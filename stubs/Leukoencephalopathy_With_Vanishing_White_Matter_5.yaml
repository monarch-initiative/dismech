notes: >-
  SUBTYPE of Leukoencephalopathy_With_Vanishing_White_Matter
  (kb/disorders/Leukoencephalopathy_With_Vanishing_White_Matter.yaml). Resolved
  as already covered; no separate disorder entry should be created.

  What the parent binds. This is not the cblA pattern of a gene named in prose.
  The parent entry carries a dedicated `genetic:` record for EIF2B5 with the gene
  term bound to hgnc:3261, its own autosomal recessive `inheritance` block, and
  PMID:11704758 evidence from the original subunit-mutation paper -- alongside
  equivalent records for EIF2B1, EIF2B2, EIF2B3 and EIF2B4. Its pathograph is
  rooted at "eIF2B Translation Initiation Complex Deficiency", a node about the
  complex rather than any one subunit, running through deregulation of the
  integrated stress response, astrocyte dysfunction, white matter rarefaction and
  cavitation to stress-provoked deterioration.

  Why the pathograph does not diverge. Two independent patient cohorts say that
  which subunit gene is mutated does not predict the disease. Fogli et al. 2004
  (PMID:15136673), 83 individuals: "Disease severity was correlated with age at
  onset (p < 0.0001) but not with the type of the mutated subunit nor with the
  position of the mutation within the protein." Deng et al. 2021
  (PMID:34745209), 341 patients and 180 distinct mutations: "The gene (EIF2B1-5)
  in which the mutation located, and the number of null alleles were not
  associated with age of onset in these patients." EIF2B5 is the common locus,
  carrying 64% of mutations in the 2004 series, not a distinct entity. What does
  predict severity is the specific allele and where it sits in the complex -- and
  that variation is entirely within EIF2B5 as well as across genes, since
  p.Arg113His homozygotes are among the mildest patients and p.Thr91Ala
  homozygotes among the more severe. That belongs in `GeneticContext` on the
  existing EIF2B5 record, not in a new file.

  Why it must not become a has_subtypes entry either. The parent's
  `has_subtypes` axis is onset-based -- Antenatal-Infantile, Early-Childhood,
  Juvenile-Adult -- which is the axis the natural-history literature actually
  stratifies on, and three phenotypes in the file carry `subtype:` foreign keys
  into it. `subtype:` is single-valued, so adding a gene-keyed subtype would mix
  two orthogonal axes in one namespace and make a patient who is both "EIF2B5"
  and "Juvenile-Adult" unrepresentable. dismech already covers both MONDO axes,
  using `has_subtypes` for onset and `genetic:` for gene, which is a better fit
  than MONDO's flat sibling list.

  Not deleted, deliberately. MONDO:0957873 is bound nowhere in kb/, so deleting
  this stub would let the next `just seed-stubs` run recreate it verbatim as
  UNDECIDED and lose this judgement -- the same reason
  stubs/Dyskinesia_With_Orofacial_Involvement.yaml is kept. The clean way to
  retire it is a `mappings.mondo_mappings` block on the parent entry with
  `skos:narrowMatch` for all five per-gene terms (MONDO:0020507, MONDO:0957870,
  MONDO:0957871, MONDO:0957872, MONDO:0957873), which would retire the whole
  sibling set at once. That is deliberately left to a maintainer: it edits the
  parent entry, it should cover all five rather than one, and the house
  convention for narrowMatch direction is not settled (Pik3ca_Mutant_Breast_
  Cancer uses it narrow-entry-to-broad-term, the opposite of what is needed
  here). Retire this stub when that mapping is added, or when MONDO:0957873 is
  otherwise bound in kb/.

  Separately, the parent entry is behind the literature in ways that are worth
  more than a new file: guanabenz has since completed a single-arm phase 1/2
  trial (PMID:42586097) while the entry still describes ISR modulation as
  mouse-only, 2025 consensus management guidelines exist (PMID:41232062), and
  cell-specific Eif2b5 conditional mice (PMID:40326783) revise the
  astrocyte-primary framing. Recorded here as leads; not curated in this PR.

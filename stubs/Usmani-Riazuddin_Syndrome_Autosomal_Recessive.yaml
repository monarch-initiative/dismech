mondo_id: MONDO:0859196
label: Usmani-Riazuddin syndrome, autosomal recessive
proposed_name: Usmani-Riazuddin_Syndrome_Autosomal_Recessive
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Sibling of MONDO:0859174 (Usmani-Riazuddin syndrome, autosomal dominant), which
  is curated as kb/disorders/Usmani-Riazuddin_Syndrome_Autosomal_Dominant.yaml.
  Both terms assert RO:0004003 to hgnc:555 AP1G1 and both sit directly under
  MONDO:0003847 with no umbrella term between them, so the recessive form could
  not be carried as a has_subtypes row on the dominant entry without asserting a
  hierarchy MONDO does not have. Nominated here so it stays visibly uncurated.
notes: >-
  Split out of PR #12186, which curated the sibling dominant form as
  kb/disorders/Usmani-Riazuddin_Syndrome_Autosomal_Dominant.yaml. That PR
  originally carried this concept as a placeholder has_subtypes row on the
  dominant entry; review found that this asserts a parent-child hierarchy MONDO
  does not have, and would have counted the concept as curated while it held no
  content. It is nominated here instead so it stays visibly uncurated.
  Caused by biallelic AP1G1 missense alleles; two families in the founding series
  (PMID:34102099). The functional separation from the dominant form is that the
  recessive missense proteins still assemble with the other AP-1 subunits and
  instead perturb the endosome recycling pathway. Before curating, settle the
  entry_type: the follow-up literature (PMID:41226632) calls the dominant and
  recessive forms clinically overlapping, so GROUPING or a merge into a new
  umbrella entry are both live options alongside DISEASE. If the two are merged,
  it needs either a new umbrella MONDO term or a mappings.mondo_mappings anchor -
  not bare reuse of a child term as the parent's disease_term. The argument is
  recorded in the dominant entry's `discussions` block (ad_ar_one_entity).
added_date: "2026-09-18"

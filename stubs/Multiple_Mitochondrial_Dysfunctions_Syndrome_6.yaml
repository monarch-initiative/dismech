label: multiple mitochondrial dysfunctions syndrome 6
proposed_name: Multiple_Mitochondrial_Dysfunctions_Syndrome_6
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  One of the numbered forms of multiple mitochondrial dysfunctions syndrome. The
  causal gene is PMPCB (OMIM 617954), resolved from NCBI mim2gene_medgen; MONDO
  records no causal gene for this term.
sources:

mondo_id: MONDO:0005419
label: methamphetamine dependence
proposed_name: Methamphetamine_Dependence
status: OPEN
entry_type: DISEASE
priority: HIGH
rationale: >-
  Methamphetamine use disorder has no approved pharmacotherapy. Its mechanism differs from cocaine's: the drug is a transporter substrate that reverses dopamine efflux, rather than only blocking reuptake. The combination of extended-release naltrexone and bupropion has randomized-trial support.

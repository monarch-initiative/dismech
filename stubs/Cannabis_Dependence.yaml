mondo_id: MONDO:0005689
label: cannabis dependence
proposed_name: Cannabis_Dependence
status: OPEN
entry_type: DISEASE
priority: HIGH
rationale: >-
  Cannabis use disorder is common and has no approved pharmacotherapy. Its mechanism runs through CB1 receptor downregulation and a withdrawal syndrome, which separates it from the monoamine-transporter stimulants.
synonyms:
- cannabis abuse
- marijuana dependence
sources:
- source_name: dismech substance use disorder coverage review
  source_identifier: MONDO:0005689
added_date: "2026-09-25"
mondo_parents:
- id: MONDO:0005303
  label: drug dependence
notes: >-
  Distinct from Cannabis_Hyperemesis_Syndrome, which is a toxicity syndrome of heavy use rather than the use disorder itself.

proposed_name: Herpesviridae_Infectious_Disease
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Dashboard CURATE_ROOT_WITH_SUBTYPES row for Herpesviridae infectious disease highlighted
  this human infectious-disease candidate; the MONDO ID is not covered by a committed
  disorder, grouping, or stub, so adding a stub keeps this infectious-disease gap visible
  for a future lump/split decision.
notes: >-
  This is a taxonomic herpesvirus parent over alpha-, beta-, and gammaherpesvirus
  diseases. Compare committed Herpes_Zoster, Cytomegalovirus_Retinitis, and
  Congenital_Herpes_Simplex_Virus_Infection, then the existing HSV encephalitis, HSV
  keratitis, congenital herpes, HSV, VZV, CMV, HHV8, EBV, and Roseolovirus stubs before
  deciding whether the term should be an explicit grouping.

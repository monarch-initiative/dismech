notes: >-
  MONDO:0016101 is Marek's disease, the herpesvirus-driven T-cell lymphoma of
  chickens: its synonyms are Marek disease and fowl paralysis, and its MONDO parent
  is viral infectious disease (MONDO:0005108). It is not the human condition also
  called neurolymphomatosis, in which lymphoma, usually B-cell non-Hodgkin
  lymphoma, infiltrates peripheral nerves. Design decisions section 1 keeps
  veterinary disease in scope as evidence only, so Marek's disease is not a
  Disease entry. Human neurolymphomatosis is a manifestation of lymphoma rather
  than a separate disease, and would belong on a lymphoma entry. It should not be
  re-nominated under this MONDO term.

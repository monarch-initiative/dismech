notes: kb/disorders/THG1L-Related_Disorder.yaml carries exactly this name while binding MONDO:0032923 (spinocerebellar ataxia, autosomal recessive 28) as its disease_term and skos:exactMatch, so `just check-stubs` reports this stub as a possible_kb_duplicate advisory. The open call is whether MONDO:1060243 is the better anchor for that entry -- in which case this is a mappings or disease_term change there rather than a new entry. The MONDO build this repository pins (release 2026-05-05, data/mondo/MANIFEST.yaml) does not carry MONDO:1060243 -- querying it for rdfs:label returns nothing -- so `just enrich-stubs` wrote no mondo_parents, mondo_descendants or genes block. The causal gene named in the rationale and in source_tags comes from the newer MONDO release the d2g comparison read; re-run `just enrich-stubs` after the next MONDO refresh.

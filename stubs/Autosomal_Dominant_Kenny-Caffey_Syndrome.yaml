mondo_id: MONDO:0007478
label: autosomal dominant Kenny-Caffey syndrome
proposed_name: Autosomal_Dominant_Kenny-Caffey_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Listed entity of the ISDS Nosology of Genetic Skeletal Disorders (2023
  revision), group 21 "Primordial dwarfism and slender bone dysplasias", with
  no dismech entry. The group's other members are curated, so this is a
  coverage gap in an otherwise complete group rather than a new nomination.
synonyms:
- KCS2
- Kenny-Caffey syndrome type 2
- Kenny-Caffey syndrome, autosomal dominant
sources:
- source_name: isds-nosology-2023-group-21
  source_url: https://pubmed.ncbi.nlm.nih.gov/36779427/
  source_identifier: NOS 21-0050
  source_tags:
  - isds_group=21
added_date: "2026-08-27"
notes: >-
  ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
  PMID:36779427), group 21, NOS 21-0050 "Kenny-Caffey syndrome, dominant,
  FAM111A-related" (OMIM 127000). The same gene gives the neighbouring row NOS
  21-0060, osteocraniostenosis (OMIM 602361), already stubbed as
  stubs/Osteocraniostenosis.yaml - the committee lists them as two entities at
  opposite ends of a FAM111A severity spectrum, so decide deliberately whether
  dismech follows that split or curates one FAM111A entry with subtypes.
  Carries isds_skeletal_category: primordial_dwarfism_and_slender_bones when
  curated.

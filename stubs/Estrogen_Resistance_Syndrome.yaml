label: estrogen resistance syndrome
proposed_name: Estrogen_Resistance_Syndrome
status: OPEN
entry_type: DISEASE
priority: HIGH
rationale: >-
  The one disease in which ESR1 sits on a mechanism node by definition, nominated
  by issue #12925 for the estrogen-signalling gap. IEMbase comparison note
  IEMBASE-0130 judged it a true unmapped local disease gap in July 2026, and no
  stub existed. MONDO cross-references the OMIM phenotype record OMIM:615363 and
  Orphanet:785; OMIM:133430, recorded by the IEMbase note, is the ESR1 gene record.
  Aromatase_Deficiency is not the target.

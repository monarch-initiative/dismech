notes: >-
  Queued rather than curated as a subtype row of Thyroid_Follicular_Carcinoma
  because the MONDO class carries two readings and the lump/split call needs to
  be made between them. Its synonyms are all names for the histologic entity
  (oncocytic carcinoma of the thyroid), which is what makes it a child of
  MONDO:0005034; its only causal-gene axiom, NDUFA13 (hgnc:17194), together with
  its second parent MONDO:0003847 hereditary disease, is the familial thyroid
  cancer predisposition reading. The class carries no definition text to settle
  which it denotes. The predisposition reading already has a home:
  Familial_Nonmedullary_Thyroid_Carcinoma curates a TCO subtype and a Hurthle
  cell thyroid adenoma phenotype on it, and the source it cites for the TCO
  locus records the causal gene there as not yet identified. The open questions
  for whoever takes this stub are therefore (a) whether oncocytic carcinoma of
  the thyroid is a distinct entity from follicular carcinoma or a histologic
  variant of it, and (b) whether NDUFA13 is established as its causal gene at
  all.

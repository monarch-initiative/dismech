notes: >-
  SUBTYPE of the curated Inborn_Disorder_of_Bile_Acid_Synthesis entry, which
  carries this disease as the has_subtypes row "Bile acid conjugation defect 1"
  (display_name "Bile acid amidation/conjugation defect (BAAT)"), binding BAAT
  as hgnc:932 and citing its own evidence. The entry also curates a dedicated
  treatment for it, Glycocholic Acid (Conjugated Bile Acid) Replacement. The
  concept therefore needs no new disorder entry.

  This supersedes the earlier note on this stub, which said no kb/ entry
  curated the disease as its own entry or as a subtype. That was wrong: the
  subtype row existed, and the stub survived the coverage check only because
  the row binds a different MONDO term.

  The two terms are distinct and neither is a parent of the other.
  MONDO:0100305, this stub, is a gene-series term generated by MONDO's
  disease_series_by_gene pattern and defined as "Any disorder of bile acid
  aminotransferase in which the cause of the disease is a mutation in the BAAT
  gene"; its parent is MONDO:0100304, it is ClinGen-sourced, and its only xref
  is GARD:0026134. The subtype row instead binds MONDO:0030991, bile acid
  conjugation defect 1 (BACD1), whose parent is MONDO:0100327 and which carries
  OMIM:619232, DOID:0061180 and MEDGEN:1780260. Since BACD1 is the only disease
  that satisfies MONDO:0100305's definition, the two very likely denote the
  same patients, but MONDO asserts no equivalence between them and has not
  merged them, so that is an observation rather than something this stub should
  act on. It may be worth a MONDO ticket; it is not a dismech curation gap.

  Not deleted, deliberately. MONDO:0100305 is bound nowhere in kb/ as a disease
  term, its only occurrence being a row in the kb/genes/ingest ClinGen table,
  which is the ingest layer and not disease coverage. A deleted stub would
  therefore be recreated verbatim as UNDECIDED by the next `just seed-stubs`
  run, losing this judgement, exactly as recorded on the LAMA2-related
  Muscular Dystrophy and Dyskinesia With Orofacial Involvement stubs.

  Retire this stub if MONDO merges MONDO:0100305 into MONDO:0030991, or if some
  kb/ entry comes to bind MONDO:0100305 directly.

  ClinGen rates BAAT for this disease Moderate (AR, Peroxisomal Disorders
  GCEP), per cache/clingen/gene_validity.csv, export of 2026-01-24. That tier
  is unchanged by this decision and is not recorded in kb/, because the
  gene-disease validity assertion is for MONDO:0100305 while the subtype row
  binds MONDO:0030991, and a validity assertion counts only for the entry's own
  disease term.

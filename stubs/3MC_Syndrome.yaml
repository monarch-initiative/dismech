mondo_id: MONDO:0017398
label: 3MC syndrome
proposed_name: 3MC_Syndrome
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  One clinical entity (the unified Mingarelli-Malpuech-Michels-Carnevale
  spectrum) whose numbered forms differ only by causal gene within a single
  pathway, the lectin complement pathway (MASP1/MASP-3, COLEC11/CL-K1,
  COLEC10/CL-L1).
sources:
- source_name: dismech-stub-queue-lump-review
  source_identifier: MONDO:0017398
added_date: "2026-08-28"
notes: >-
  Lumped stub replacing the per-gene seeded stubs 3MC syndrome 1
  (MONDO:0009770, MASP1) and 3MC syndrome 2 (MONDO:0009927, COLEC11).
  The numbered forms are clinically indistinguishable and their genes act in
  the same lectin complement / collectin developmental signaling pathway, so
  curate one entry with per-gene detail in genetic: or has_subtypes. MONDO
  also has 3MC syndrome 3 (COLEC10), which was never stubbed separately.

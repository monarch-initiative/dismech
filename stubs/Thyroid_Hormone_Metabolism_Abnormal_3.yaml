priority: NORMAL
notes: "TRU-TCA1-1 (the selenocysteine tRNA gene) is the causal gene. The homozygous C65G acceptor-arm variant was reported in a patient with abnormal thyroid hormones and low selenium (PMID:26854926) and, by an independent group, in two members of a family whose authors conclude the variant is not exclusively causative of disrupted selenoprotein synthesis (PMID:34956927); engineered C65G cells show reduced tRNA[Ser]Sec expression, altered selenoprotein synthesis and loss of selenium responsiveness (PMID:37254812). ClinGen has not classified the gene. The disease is the tRNA counterpart of SECISBP2 deficiency (thyroid hormone metabolism, abnormal 1), curated as SECISBP2_Deficiency; if curated, the gene record should be typed UNKNOWN given three reported patients and the contested causality."
rationale: Diagnostic delay impact; Insufficient ICD coding/underdiagnosis; Intervention potential; Multi-modal detectability; Phenotypic complexity

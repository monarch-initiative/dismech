mondo_id: MONDO:0001586
label: mucopolysaccharidosis type 1
proposed_name: Mucopolysaccharidosis_Type_1
status: OPEN
entry_type: GROUPING
priority: LOW
rationale: Diagnostic delay impact; Insufficient ICD coding/underdiagnosis; Intervention potential; Multi-modal detectability; Phenotypic complexity
notes: >-
  All three MONDO descendants of this concept are now curated: Hurler syndrome
  (MONDO:0011758) as kb/disorders/Hurler_syndrome.yaml, and Hurler-Scheie
  (MONDO:0011759) plus Scheie (MONDO:0011760) as subtypes of
  kb/disorders/Attenuated_Mucopolysaccharidosis_Type_I.yaml. The two stubs for
  those attenuated concepts were deleted with that curation; this one is kept
  and re-typed GROUPING because MONDO:0001586 itself is the union spanning both
  dismech entries, and no dismech object currently claims it. Priority dropped
  to LOW: the biology is fully covered, so what remains is the bookkeeping
  question of whether to create a small kb/groupings/Mucopolysaccharidosis_Type_I
  grouping over the severe and attenuated entries, or to leave MPS I represented
  only by the broadMatch mapping the attenuated entry already carries. The
  Mucopolysaccharidoses grouping covers both entries either way, so nothing is
  lost by deferring this.
synonyms:

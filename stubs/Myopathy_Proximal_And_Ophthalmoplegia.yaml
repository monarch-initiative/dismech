mondo_id: MONDO:0011577
label: myopathy, proximal, and ophthalmoplegia
proposed_name: MYH2-Related_Myopathy
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  A hereditary MYH2 congenital myopathy that MONDO files under inclusion body
  myositis, so it reaches the genetics gap list of the sporadic inclusion body
  myositis entry while sharing no mechanism with it. Nominated while reconciling
  that gap list (dismech#12277).
synonyms:
- MYPOP
- inclusion body myopathy 3, autosomal dominant
- myopathy with congenital joint contractures, ophthalmoplegia, and rimmed vacuoles
- myopathy, proximal, and ophthalmoplegia
added_date: "2026-09-27"
mondo_parents:
- id: MONDO:0007827
  label: inclusion body myositis
- id: MONDO:0019952
  label: congenital myopathy
- id: MONDO:0700223
  label: hereditary skeletal muscle disorder
genes:
- id: hgnc:7572
  label: MYH2
notes: >-
  Ruled a separate Disease entry rather than a has_subtypes row on
  Inclusion_Body_Myositis. MONDO's own definition of MONDO:0011577 is "Any
  congenital myopathy in which the cause of the disease is a mutation in MYH2
  gene", with both autosomal dominant and autosomal recessive inheritance; the
  dismech Inclusion_Body_Myositis entry is scoped to sporadic inclusion body
  myositis, an acquired late-onset inflammatory and degenerative myopathy. The
  precedent is its sibling: MONDO:0011603 GNE myopathy is the other child of
  MONDO:0007827 and is curated in this repository as its own entry,
  kb/disorders/GNE_Myopathy.yaml. Whoever curates this should also look at the
  Inclusion_Body_Myositis disease_term, which binds MONDO:0007827 itself while
  naming only the sporadic disease.

mondo_id: MONDO:0009426
label: hypoparathyroidism-retardation-dysmorphism syndrome
proposed_name: Sanjad-Sakati_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Listed entity of the ISDS Nosology of Genetic Skeletal Disorders (2023
  revision), group 21 "Primordial dwarfism and slender bone dysplasias", with
  no dismech entry. The group's other members are curated, so this is a
  coverage gap in an otherwise complete group rather than a new nomination.
synonyms:
- Sanjad-Sakati syndrome
- HRD syndrome
- HRD
- HRDS
- Richardson-Kirk syndrome
sources:
- source_name: isds-nosology-2023-group-21
  source_url: https://pubmed.ncbi.nlm.nih.gov/36779427/
  source_identifier: NOS 21-0040
  source_tags:
  - isds_group=21
added_date: "2026-08-27"
notes: >-
  ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
  PMID:36779427), group 21, NOS 21-0040 "Sanjad-Sakati syndrome, recessive,
  TBCE-related" (OMIM 241410). TBCE also causes recessive Kenny-Caffey
  syndrome; the nosology lists only the Sanjad-Sakati row for TBCE, so do not
  fold the recessive KCS phenotype in without deciding that question
  explicitly. The dominant FAM111A Kenny-Caffey is a separate row (NOS
  21-0050) and a separate stub. Carries isds_skeletal_category:
  primordial_dwarfism_and_slender_bones when curated.

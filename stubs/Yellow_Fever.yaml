notes: >-
  Member of the Viral_Hemorrhagic_Fevers grouping
  (kb/groupings/Viral_Hemorrhagic_Fevers.yaml), which lists it as a wanted
  member with no entry yet. Added when the Viral_Hemorrhagic_Fever umbrella
  Disease entry was converted to a mechanism module plus a grouping under the
  infectious disease granularity ladder (design decisions section 3e, issue
  dismech#10115). When curated, the entry should declare conforms_to
  "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability" on its
  vascular-leak node and be added to the grouping's members. A mosquito-borne
  flavivirus disease with sylvatic and urban transmission cycles, hepatic
  tropism producing the jaundice it is named for, and the only member of the
  group prevented by a long-established live attenuated vaccine. Its
  flavivirus sibling Dengue is already curated, so the lump/split call against
  that entry should be made explicitly: they differ in reservoir cycle, in
  organ emphasis and in vaccine availability.

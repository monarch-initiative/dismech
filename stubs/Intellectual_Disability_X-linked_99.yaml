mondo_id: MONDO:0010487
label: intellectual disability, X-linked 99
proposed_name: USP9X-Related_Male_Neurodevelopmental_Disorder
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  The male USP9X entity, distinct from the female-restricted syndrome dismech
  already curates as USP9X_Female-Restricted_Syndromic_Intellectual_Disability
  (MONDO:0010502). That entry states this is "a different disease entry" and
  carries it as a differential diagnosis, but no entry existed. Declined as a
  subtype of Non-Syndromic_X-Linked_Intellectual_Disability in dismech#12227
  because PMID:31443933 defines a characteristic phenotype - white matter
  disturbance, thin corpus callosum, widened ventricles, hypotonia, joint
  hypermobility, visual defects, dysmorphic features - and concludes for "a
  distinctive neurodevelopmental and behavioral syndrome in male subjects".
synonyms:
- intellectual disability, X-linked 99
- intellectual disability, X-linked type 99
- USP9X non-syndromic X-linked intellectual disability
- MRX99
- mental retardation, X-linked 99
- mental retardation, X-linked type 99
sources:
- source_name: dismech genetics-gap campaign
  source_url: https://github.com/monarch-initiative/dismech/issues/12227
  source_identifier: MONDO:0010487
added_date: "2026-09-24"
mondo_parents:
- id: MONDO:0019181
  label: non-syndromic X-linked intellectual disability
genes:
- id: hgnc:12632
  label: USP9X
notes: >-
  Two things a curator should carry over from the female entry's scope note.
  The two entities are separated by allele class (hypomorphic missense in
  males versus complete loss of function in females), by sex, and by
  phenotype, and their literatures are co-published by overlapping author
  groups, so male and female frequencies must not be blended. ClinGen lumps
  both into one curation against X-linked syndromic intellectual disability
  (Definitive), which is a third framing again and should not be adopted
  silently. MONDO's placement of this term under the non-syndromic root is
  recorded as a disagreement in the parent entry's notes.

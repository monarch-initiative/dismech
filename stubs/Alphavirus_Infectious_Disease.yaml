  keeps this concept visible for a future lump/split decision.
notes: >-
  Alphavirus infectious disease is a grouping rather than one conserved
  disease-level pathograph because it spans clinically distinct arthritogenic
  alphavirus fevers, including Barmah Forest virus disease, O'nyong-nyong
  fever, and Ross River fever, and encephalitic infections such as eastern,
  Venezuelan, and western equine encephalitis.

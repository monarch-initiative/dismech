notes: >-
  SUBTYPE of Charcot-Marie-Tooth Disease Type 4 (kb/disorders/Charcot-Marie-Tooth_Disease_Type_4.yaml),
  which carries CMT4A ("CMT4A (GDAP1-related)") in its has_subtypes list alongside CMT4B1,
  4B2, 4C, 4D, 4F and 4J, names GDAP1 in its genetic block, and curates a "GDAP1
  Mitochondrial Dynamics Defect" pathophysiology node. No separate disorder entry is needed;
  further CMT4A detail should be added to that entry's subtype record rather than to a new
  file.

  Note this stub carries no genes: field, so the gene-equality check used for the other CMT4
  stubs does not apply mechanically here; the parent's own CMT4A subtype description names
  GDAP1, which is the same check made by hand.

notes: >-
  SUBTYPE of Adult_Refsum_Disease. This term's own synonym list includes
  "Refsum disease, adult, 2", and Adult_Refsum_Disease carries a `Type 2`
  has_subtypes entry for exactly that PEX7-related form, distinguished there
  from the usual PHYH-related Type 1. The MONDO parent (Zellweger spectrum
  disorders) also has a curated entry, Peroxisome_Biogenesis_Disorder, and
  PEX7 additionally appears in the two rhizomelic chondrodysplasia punctata
  entries -- so this concept sits inside an already well-covered PEX7 allelic
  series. Found during the duplicate preflight for claim #9216; not claimed.

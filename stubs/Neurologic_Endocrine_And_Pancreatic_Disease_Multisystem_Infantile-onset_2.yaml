notes: >-
  Routed out of
  kb/disorders/Infantile-Onset_Multisystem_Neurologic_Endocrine_and_Pancreatic_Disease.yaml
  during the d2g genetics pass for dismech#12274, which re-anchored that entry
  from the series parent MONDO:0024189 to the PTRH2 leaf MONDO:8000012. MONDO
  attributes this sibling class to YARS1 and xrefs OMIM:619418. The disease has a
  GeneReviews chapter of its own, "YARS1 Deficiency" (PMID:40608960), which
  describes developmental delay or intellectual disability, poor prenatal and
  postnatal growth, gastrointestinal involvement including pancreatic
  insufficiency, liver involvement, chronic anemia, endocrine involvement, lung
  disease, retinitis pigmentosa and sensorineural hearing loss, established by
  biallelic pathogenic YARS1 variants. A seven-child consanguineous series
  (PMID:30304524) reports homozygosity for p.Pro167Thr at a conserved
  homodimerization interface, and shows in yeast complementation that the allele
  is hypomorphic and in HEK cells that the recombinant protein localizes normally
  but homodimerizes poorly - so the lesion is impaired aminoacylation capacity,
  which is a different molecular mechanism from the peptidyl-tRNA hydrolase and
  adhesion-survival roles of PTRH2. Whether the lung and retinal features place
  this outside the IMNEPD umbrella entirely is a question for whoever curates it.

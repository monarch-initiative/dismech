mondo_id: MONDO:0100228
label: LAMA2-related muscular dystrophy
proposed_name: LAMA2-related_Muscular_Dystrophy
status: OPEN
entry_type: SUBTYPE
priority: NORMAL
notes: >-
  Covered by kb/disorders/Congenital_Merosin-deficient_Muscular_Dystrophy_1A.yaml,
  which curates the whole LAMA2 spectrum under MONDO:0011925: complete and partial
  merosin deficiency are has_subtypes rows there, the entry cites congenital
  (LAMA2-CMD) and limb-girdle (LGMDR23) cohorts side by side, and it maps
  MONDO:0100228 as skos:broadMatch. Partial deficiency is an immunostaining
  category and LGMDR23 a clinical one; they overlap but are not the same. SUBTYPE is approximate, because MONDO:0100228 is the umbrella
  term rather than a child of MDC1A; the point is that this concept needs no new
  disorder entry. The stub is kept rather than deleted because a broadMatch does
  not count as coverage, so a deleted stub would be re-nominated.
rationale: Gene-defined disease nominated from the d2g genetics-gap comparison on dismech#12281, which lists LAMA2 as the MONDO causal gene; `just seed-stubs` found no kb/ entry covering MONDO:0100228.

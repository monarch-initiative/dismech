mondo_id: MONDO:0006861
label: myeloid sarcoma
proposed_name: Myeloid_Sarcoma
status: DEFERRED
entry_type: UNDECIDED
priority: LOW
rationale: >-
  Nominated by the neuroblastoma-adjacent expansion series (dismech#15822) as
  a tumour that can be mistaken for neuroblastoma in children, on the basis of
  its orbital and periorbital presentations.
synonyms:
- granulocytic sarcoma
- chloroma
- extramedullary myeloid tumor
added_date: "2026-10-30"
notes: >-
  Deferred after checking the question the nomination turned on, which was
  whether the current World Health Organization haematolymphoid classification
  treats myeloid sarcoma as an entity of its own or as a presentation of acute
  myeloid leukaemia. It treats it as a presentation.

  In the fifth edition summary (PMID:35732831) the passage headed "Myeloid
  sarcoma" sits inside the acute myeloid leukaemia chapter and opens: "Myeloid
  sarcoma represents a unique tissue-based manifestation of AML or transformed
  MDS, MDS/MPN, or MPN." The classification's own table of acute myeloid
  leukaemia types does not list myeloid sarcoma among them. Secondary reviews
  do call it a distinct entity, but that is review language rather than the
  classification's, and the most cited of them is titled "Myeloid sarcoma:
  more and less than a distinct entity" (PMID:37286874) and argues in the same
  abstract that the newer classifications "indirectly define MS more as a set
  of heterogeneous and proteiform diseases, rather than a homogeneous single
  entity". A further review (PMID:33213985) argues the World Health
  Organization term is "imprecise and misleading" and proposes extramedullary
  acute myeloid leukaemia tumour instead.

  So a standalone disorder entry would assert an entity status the primary
  classification does not give it. A has_subtypes row is not available either:
  this repository has no general acute myeloid leukaemia entry, only
  Acute_Myeloid_Leukemia_with_CEBPA_Somatic_Mutations, and myeloid sarcoma can
  arise from transformed myelodysplastic syndrome, myelodysplastic or
  myeloproliferative neoplasm overlap and myeloproliferative neoplasm as well
  as from acute myeloid leukaemia, so it is not the subtype of a single
  parent. What would settle it is a general acute myeloid leukaemia entry, at
  which point this concept is most likely a presentation recorded there rather
  than a disease of its own.

  The nomination's own premise is also weaker than it looked, and this is
  recorded so the concept is not re-nominated into a neuroblastoma series on
  the same grounds. The link to neuroblastoma rests on one sentence of one
  2008 radiology review (PMID:18635637), which places granulocytic sarcoma and
  orbital bone metastases from neuroblastoma in the same differential and says
  that "osseous lesions may appear similar to each other and to nonosseous
  masses of the orbit" at imaging. It does not report that either diagnosis is
  mistaken for the other, and no other source found says so.

  The biology is real and well described, so this is a deferral and not an
  out-of-scope ruling. Whoever picks it up should note what the literature
  does and does not support: NPM1 and FLT3 are the commonest reported
  mutations and NPM1 is enriched at the tumour site relative to marrow, but
  no source found links t(8;21), inv(16) or KMT2A rearrangement specifically
  to myeloid sarcoma; there is no incidence figure in any source found, only
  registry case counts; and no source found gives an immunohistochemistry
  panel for the human tumour or a misdiagnosis rate.

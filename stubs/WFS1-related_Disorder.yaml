mondo_id: MONDO:0700293
label: WFS1-related disorder
proposed_name: WFS1-related_Disorder
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: Diagnostic delay impact; Insufficient ICD coding/underdiagnosis
notes: >-
  Lump/split decided as DISEASE with has_subtypes, not GROUPING, on the literature
  rather than on the descendant count. The GeneReviews chapter for this concept is
  titled "WFS1 Spectrum Disorder" (PMID:20301750) and states that WFS1-SD comprises
  classic and nonclassic forms, so the field treats the allelic series as one disorder
  with subtypes. Curated as kb/disorders/WFS1-Related_Disorder.yaml, with the three
  recorded MONDO descendants plus MONDO:0100072 as has_subtypes entries. Overlaps the
  existing Wolfram_Syndrome entry at MONDO:0009101 only; that entry deliberately
  excludes the dominant arm, which is what this one carries.

label: Wilms tumor 7
proposed_name: TRIM28-Related_Wilms_Tumor_Predisposition
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: Established Wilms tumor predisposition gene with a distinctive epithelial histology that selects patients for testing; no dismech entry.
mondo_parents:
- id: MONDO:0003321
  label: hereditary Wilms tumor
genes:
- id: hgnc:16384
  label: TRIM28
added_date: "2026-09-26"
notes: >-
  Heterozygous constitutional truncating TRIM28 variants, with somatic loss of the
  remaining allele in the tumor, account for around 1 per cent of isolated and 8
  per cent of familial Wilms tumor (PMID:33565090). Familial pedigrees show
  incomplete penetrance, and every inherited variant in the largest exome series
  was maternally transmitted (PMID:30885698). Ruled a DISEASE rather
  than a subtype of Wilms_Tumor on the same grounds as Wilms tumor 6: design
  decisions 3a keeps a germline cancer predisposition condition separate from the
  tumor, and MONDO files the class under hereditary Wilms tumor. The tumor side of
  the mechanism is curated on kb/disorders/Wilms_Tumor.yaml as the TRIM28 Tumor
  Suppressor Loss node.

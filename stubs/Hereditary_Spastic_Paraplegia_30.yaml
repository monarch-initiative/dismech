notes: >-
  Left in the queue rather than taken as a has_subtypes row on
  Hereditary_Spastic_Paraplegia, because the unit of work is the KIF1A spectrum
  and not SPG30 alone. MONDO makes MONDO:0012476 a child of both hereditary
  spastic paraplegia and KIF1A related neurological disorder (MONDO:0700055) and
  gives it two children of its own, spastic paraplegia 30A (MONDO:0700307) and
  spastic paraplegia 30B (MONDO:0971149). ClinGen curates KIF1A against
  syndromic intellectual disability and against no hereditary spastic paraplegia
  entity. The single GeneReviews KIF1A chapter, PMID:41941559, is written about
  the gene spectrum, describing one broad phenotypic spectrum in which
  progressive spastic paraplegia sits alongside developmental delay, optic nerve
  atrophy, seizures and peripheral and autonomic neuropathy. And one member of
  that spectrum, HSAN2C (MONDO:0013634), is curated on
  Hereditary_Sensory_and_Autonomic_Neuropathy_Type_2. entry_type stays UNDECIDED
  because the choice between a row on an entry covering the whole KIF1A spectrum
  and a grouping over SPG30A and SPG30B belongs with whoever curates that
  spectrum, which stubs/KIF1A_Related_Neurological_Disorder.yaml queues.

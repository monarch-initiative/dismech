notes: >-
  Decided DISEASE. PHOX2B germline variants are a real, separately named
  neuroblastoma predisposition, not a grouping and not too abstract to carry a
  mechanism: the 2023 AACR childhood cancer predisposition workshop
  (PMID:38860978) states that a germline PHOX2B pathogenic variant was
  associated with Hirschsprung disease and congenital central hypoventilation
  syndrome, and that certain variants are responsible for congenital central
  hypoventilation syndrome together with neuroblastoma predisposition. One
  question to settle before curating it: ClinGen does not curate PHOX2B against
  this serial-numbered term at all, and instead rates PHOX2B Definitive for
  Haddad syndrome (MONDO:0020493) and for congenital central hypoventilation
  syndrome 1 with or without Hirschsprung disease (MONDO:0800026), both through
  its Hereditary Cancer Gene Curation Expert Panel. So the entry may belong on
  one of those terms with MONDO:0700041 recorded as a mapping, rather than on
  MONDO:0700041 itself. Keep it separate from the ALK entry
  (ALK-Related_Neuroblastic_Tumor_Susceptibility, MONDO:0013083): different
  gene, different syndrome, different surveillance.

notes: >-
  OUT_OF_SCOPE: testicular microlithiasis is an imaging/histological finding —
  calcium phosphate microliths inside the seminiferous tubules — that recurs
  across several unrelated diseases. It is not one disease with one conserved
  pathograph, so there is nothing for a dismech entry to be about.


  Evidence for that ruling, checked 2026-09-17. (1) MONDO itself dual-classifies
  the concept: MONDO:0012494 carries `HP:0012215` as a `MONDO:otherHierarchy`
  cross-reference, and HP:0012215 is the HPO phenotypic abnormality "Testicular
  microlithiasis", defined as "The deposition of calcium phosphate microliths
  within the seminiferous tubules." The same string names a MONDO disease and an
  HPO phenotype, which is the shape the claim-disease skill's suspicion list
  calls out as "phenotypes, not diseases". (2) No causal gene exists anywhere to
  anchor a mechanism. NCBI's `mim2gene_medgen`
  (https://ftp.ncbi.nlm.nih.gov/gene/DATA/mim2gene_medgen) maps OMIM:610441 to
  GeneID `-` with no GeneMap source; the two sibling concepts curated alongside
  it in this run both resolve in the same file on the same day (OMIM:618457 ->
  GeneID 124976, OMIM:620745 -> GeneID 6810), so the blank is a fact about this
  concept rather than a gap in the lookup. (3) It is not rare. OMIM's own
  description (MedGen C1864873) gives a population prevalence of 0.6% to 9%,
  citing Kim et al. 2003. Even the low end is roughly an order of magnitude above
  the conventional 1-in-2000 rare-disease threshold the queue is built around,
  which is consistent with an incidental scan finding rather than a disease.


  What the literature is about, and what it is not. A PubMed search for
  `testicular microlithiasis` returns 417 records (2026-09-17); adding
  `AND (pathogenesis OR mechanism OR pathophysiology)` returns 235. Reading the
  20 most recent of those, the recurring frame is a finding observed inside other
  disease contexts — Klinefelter syndrome (PMID:36282322), cryptorchidism after
  orchidopexy (PMID:35469770), a pathogenic STK11 variant (PMID:34674413),
  transaldolase deficiency (PMID:36825476), adolescent varicocele
  (PMID:41779255), male infertility, and testicular germ cell tumour risk
  stratification. The two 2025-2026 syntheses I read in full place it within
  testicular dysgenesis syndrome rather than proposing a mechanism of its own:
  PMID:42064772 reports that TM and TGCT "share molecular pathways (e.g.,
  KIT/KITLG, BMP7) within testicular dysgenesis syndrome" and that isolated TM
  carries minimal risk, while PMID:41029859 concludes that future work should
  "elucidate the molecular mechanisms underlying TM" — i.e. states them as not
  yet elucidated. The dominant question in this literature is epidemiological
  (does TM predict germ cell tumour?), and a contested association is not a
  pathograph.


  Caveat on the search: I read titles for 20 records and abstracts for 3, not the
  full 417. The claim above is that the recent mechanism-adjacent literature
  frames TM as a cross-disease finding, not a proof that no mechanistic paper
  exists anywhere.


  What to do with the concept instead. HP:0012215 is the right handle: record
  testicular microlithiasis as a `phenotypes:` row on the disorders it is
  observed in (Klinefelter syndrome is the best-evidenced candidate), where it
  can be wired to that disease's own pathograph. Do not create
  `kb/disorders/Testicular_Microlithiasis.yaml`.


  The stub is kept, not deleted: this decision binds MONDO:0012494 nowhere in
  `kb/`, so `just seed-stubs` would otherwise recreate it as UNDECIDED and the
  reasoning would be lost. Revisit if a mechanism specific to microlith
  formation is established independently of the diseases TM co-occurs with.
  Claim issue #12063.

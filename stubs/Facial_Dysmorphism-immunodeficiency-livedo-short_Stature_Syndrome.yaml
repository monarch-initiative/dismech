mondo_id: MONDO:0014058
label: facial dysmorphism-immunodeficiency-livedo-short stature syndrome
proposed_name: FILS_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Listed entity of the ISDS Nosology of Genetic Skeletal Disorders (2023
  revision), group 21 "Primordial dwarfism and slender bone dysplasias", with
  no dismech entry. The group's other members are curated, so this is a
  coverage gap in an otherwise complete group rather than a new nomination.
synonyms:
- FILS syndrome
- facial dysmorphism, immunodeficiency, livedo, and short stature
sources:
- source_name: isds-nosology-2023-group-21
  source_url: https://pubmed.ncbi.nlm.nih.gov/36779427/
  source_identifier: NOS 21-0220
  source_tags:
  - isds_group=21
added_date: "2026-08-27"
notes: >-
  ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
  PMID:36779427), group 21, NOS 21-0220 "IMAGE syndrome / FILS syndrome, POLE-
  related" (AR, OMIM 618336 and 615139). The row deliberately lumps two
  published POLE phenotypes into one entity, which is the lump/split question
  this stub has to settle: one POLE entry named for the row, or a FILS entry
  with the POLE-IMAGe presentation as a subtype. Distinct from the CDKN1C
  IMAGe row (NOS 21-0210), which is a separate stub. Carries
  isds_skeletal_category: primordial_dwarfism_and_slender_bones when curated.

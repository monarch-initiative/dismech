notes: >-
  SUBTYPE of kb/disorders/Pheochromocytoma_Paraganglioma.yaml. The tumor is
  that entry's "Pheochromocytoma" subtype, bound to MONDO:0004974 adrenal
  gland pheochromocytoma, and the only two MONDO children of this term,
  MONDO:0700346 MAX-related tumor predisposition and MONDO:0700345
  TMEM127-related tumor predisposition, are its "MAX-related" and
  "TMEM127-related" subtypes.

  MONDO:0008233 is not bound there, deliberately. MONDO places it in its
  omim_susceptibility subset (OMIM entries written with braces, which mark
  susceptibility), with an exact match to OMIM:171300, no definition, and
  benign neoplasm as its only parent (MONDO 2026-10-06 in OLS, and the same
  in the 2026-09-01 build). Its other exact matches include DOID:0050771,
  which DOID defines as a benign neoplasm of the adrenal medulla.
  MONDO:0004974 is the defined tumor class: a benign or malignant
  neuroendocrine neoplasm arising from the chromaffin cells of the adrenal
  medulla, with benign, malignant and childhood children. Binding the tumor
  subtype to MONDO:0008233 would assert the susceptibility class and a
  benign-only placement instead.

  Kept rather than deleted: MONDO:0008233 is not bound anywhere the stub
  coverage index reads (root disease_term, has_subtypes, exact or narrow
  mondo_mappings, groupings), so deleting this stub would let a `just
  seed-stubs` run over the same nomination list recreate it as UNDECIDED.
  Retire it if MONDO merges or redefines this term, or once an entry binds it
  in a way that counts as coverage.

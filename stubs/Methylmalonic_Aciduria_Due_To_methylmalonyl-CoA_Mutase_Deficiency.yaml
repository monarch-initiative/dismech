notes: >-
  SUBTYPE of Methylmalonic Acidemia (kb/disorders/Methylmalonic_Acidemia.yaml), which names
  MMUT deficiency as a primary cause in its description and curates MMUT in its
  "MMUT/AdoCbl pathway molecular function deficiency" pathophysiology node.

  Recorded with a caveat, because this one is weaker than the CMT4 cases. That entry's
  has_subtypes are "Vitamin B12-responsive" and "Vitamin B12-unresponsive", which is a
  treatment-response axis spanning cblA/cblB as well as mut, not the enzyme-locus axis that
  MONDO:0009612 names. So the concept is covered by the parent entry's gene and mechanism
  content, but there is no named subtype record that corresponds to it one-to-one. If the
  mut/cbl locus distinction is later wanted as an explicit subtype, that is an edit to the
  parent entry, not a new disorder file.

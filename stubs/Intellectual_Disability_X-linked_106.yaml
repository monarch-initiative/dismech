notes: >-
  Decided DISEASE in dismech#12227, while enumerating the gene-defined
  subtypes under Non-Syndromic_X-Linked_Intellectual_Disability. MONDO files
  this term under MONDO:0019181 (non-syndromic X-linked intellectual
  disability), but the field has reclassified it: PMID:32080367 describes "a
  new syndromic form of ID, which we propose to classify as a novel Congenital
  Disorder of Glycosylation (OGT-CDG)", and ClinGen curates OGT against this
  very term through its Syndromic Disorders Gene Curation Expert Panel. It
  therefore does not belong as a subtype row on the non-syndromic parent. It
  belongs with dismech's existing congenital-disorder-of-glycosylation
  entries as a standalone entry, ideally named for OGT-CDG.

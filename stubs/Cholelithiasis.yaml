mondo_id: MONDO:0012672
label: cholelithiasis
proposed_name: Cholelithiasis
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Nominated because kb/modules/cholelithiasis_biliary_supersaturation.yaml has no
  conformer: the module models the final common pathway of cholesterol gallstone
  formation, and no kb/ entry models that pathway. Gallstones appear in the KB only
  as a phenotype of haemolytic disease (Sickle_Cell_Disease, Gilberts_Syndrome),
  where the stones are pigment rather than cholesterol, so those entries are not
  conformers. MONDO:0012672 is preferred over MONDO:0005346 "gallstones", whose own
  definition describes the precipitate rather than the condition.
sources:
- source_name: dismech-orphan-module-census
  source_url: https://github.com/monarch-initiative/dismech/issues/11575
  source_identifier: MONDO:0012672
  source_tags:
  - orphan_module=cholelithiasis_biliary_supersaturation
added_date: "2026-10-08"
notes: >-
  The lump/split call is the curator's first job and is genuinely open here:
  cholesterol and pigment stones have different mechanisms, and whether this
  becomes one entry with subtypes or a grouping over two is not decided by this
  nomination.

notes: >-
  Dominant ATP5F1A (hgnc:823) disease. No dismech entry names ATP5F1A yet, and ClinGen has no
  ATP5F1A gene-disease validity record. Leads: dominant-negative ATP5F1A variants with neurological
  disease (PMID:40859057), a multi-generational family with the recurrent p.Arg207His variant and a
  literature review (PMID:42520343), and ATP5F1A deficiency with developmental delay in patients and
  zebrafish (PMID:41053757).

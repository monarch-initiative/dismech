notes: >-
  Resolved as a SUBTYPE. TAFRO syndrome / Castleman-Kojima disease is curated as
  the `iMCD-TAFRO` subtype of
  kb/disorders/Idiopathic_Multicentric_Castleman_Disease.yaml, which also carries
  MONDO:0018702 as a `skos:narrowMatch` mapping. It is kept as a subtype rather
  than promoted to its own entry because it shares an etiology (unknown), the
  same diagnostic criteria, and the same first-line drug with the rest of iMCD.
  It should be promoted if a subtype-specific first-line therapy is established,
  plausibly sirolimus via NCT03933904. Note that MONDO:0018702 also carries an
  incorrect `is_a` to MONDO:0017979 (autoimmune lymphoproliferative syndrome),
  reported upstream in the Castleman split issue.

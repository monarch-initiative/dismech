notes: >-
  Reversal of the earlier `entry_type: DISEASE` lump decision recorded on this
  stub, on evidence the earlier review did not have. Three things settle it.

  First, MONDO's own equivalence xref for this term is `OMIMPS:605711` - an OMIM
  *Phenotypic Series*, which is by construction a container for numbered
  entities and never a single entity. The plain `OMIM:605711` entry underneath
  it is MMDS1 (NFU1), not the umbrella.

  Second, MONDO gives the term nine subclass descendants, one per numbered form
  (MMDS1 NFU1, MMDS2 BOLA3, MMDS3 IBA57, MMDS4 ISCA2, MMDS5 ISCA1, MMDS6 PMPCB,
  MMDS7 GCSH, MMDS9B FDXR, MMDS10 CIAO1). Genes resolved from NCBI
  `mim2gene_medgen` against each form's OMIM number, because MONDO records no
  causal gene for the umbrella - which is itself what an umbrella looks like.

  Third, and decisively for this repository: dismech has *already* curated one
  of the numbered forms as its own disease entry,
  `kb/disorders/Multiple_Mitochondrial_Dysfunctions_Syndrome_9B.yaml`
  (MONDO:0971174, FDXR). Writing a second entry over the whole series would
  duplicate it and contradict the granularity dismech has already chosen here.

  The pathograph is also less conserved than the name suggests. MMDS1-5 are
  scaffold and transfer proteins of the [4Fe-4S] assembly line and present as
  neonatal or infantile lactic acidosis with hyperglycinemia and early death.
  MMDS6 (PMPCB) is a mitochondrial processing peptidase and presents as a
  childhood-onset neurodegeneration with basal ganglia involvement; MMDS7 (GCSH)
  sits in the glycine cleavage system; MMDS10 (CIAO1) is a cytosolic Fe-S
  assembly factor presenting as a myopathy with creatine kinase elevation. Those
  are different diseases sharing a biochemical theme, which is the definition of
  a grouping.

  Kept rather than deleted, deliberately. No `kb/groupings/` file is written yet
  because a grouping is an explicit union of *already-curated* diseases and only
  one of the nine members exists in `kb/`; a one-member union states nothing. If
  the stub were deleted now with the MONDO ID bound nowhere, `just seed-stubs`
  would recreate it as `UNDECIDED` and this judgement would be lost. Status is
  therefore `BLOCKED` on curating a second member. Stubs for the eight
  uncurated numbered forms are added alongside this one so the real work is in
  the queue.

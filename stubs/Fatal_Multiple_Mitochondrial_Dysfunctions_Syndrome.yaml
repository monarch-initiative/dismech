mondo_id: MONDO:0017338
label: fatal multiple mitochondrial dysfunctions syndrome
proposed_name: Multiple_Mitochondrial_Dysfunctions_Syndrome
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  One severe neonatal clinical entity whose numbered forms converge on
  iron-sulfur cluster biogenesis and mitochondrial protein maturation (NFU1,
  BOLA3, IBA57, PMPCB and others), with a shared biochemical signature
  (combined lipoic-acid-dependent enzyme and respiratory chain failure).

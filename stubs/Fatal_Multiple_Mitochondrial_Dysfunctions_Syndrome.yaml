notes: >-
  Lumped stub replacing the seeded stubs MMDS1 (MONDO:0011582, NFU1), MMDS2
  (MONDO:0013675, BOLA3), and MMDS6 (MONDO:0054785, PMPCB). The numbered
  forms share presentation and the Fe-S/lipoate mechanistic core; curate one
  entry with per-gene detail rather than per-number entries.

label: fatal multiple mitochondrial dysfunctions syndrome
proposed_name: Multiple_Mitochondrial_Dysfunctions_Syndrome
status: BLOCKED
entry_type: GROUPING
priority: NORMAL
rationale: >-
  The umbrella term over the numbered multiple mitochondrial dysfunctions
  syndromes (MMDS1-MMDS10). Its members share a defect in mitochondrial
  iron-sulfur cluster assembly and a combined lipoate-dependent enzyme plus
  respiratory chain failure, but they differ by gene and, increasingly, by
  presentation.

notes: >-
  Curated as its own Disease entry (kb/disorders/ZNF341_Deficiency.yaml) rather
  than as a subtype of Autosomal_Dominant_Hyper-IgE_Syndrome. The two disorders
  differ in gene (ZNF341 versus STAT3), in inheritance (autosomal recessive
  versus autosomal dominant) and in molecular mechanism (loss of a
  transcriptional activator of STAT3 versus a dominant-negative STAT3 protein),
  and they carry separate MONDO, OMIM and ClinGen gene-disease validity
  assertions. They are also separable clinically: NK lymphopenia (67% versus
  8%) and high serum IgG (83% versus 27%) are commoner here, while the
  extra-haematopoietic connective-tissue, skeletal and dental features are less
  frequent and no vascular complication has been reported. Sourced from the
  pooled comparison table in PMID:37080116.

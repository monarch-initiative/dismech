mondo_id: MONDO:0005723
label: Cryptococcal meningitis
proposed_name: Cryptococcal_Meningitis
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Nominated because kb/modules/fungal_nucleic_acid_antimetabolite.yaml has no
  conformer: the module models flucytosine prodrug activation and the poisoning of
  fungal nucleic-acid synthesis, and flucytosine's principal indication is
  cryptococcal meningitis induction therapy with amphotericin B. The two candidiasis
  entries already in kb/ are not conformers, because neither models flucytosine
  activation. Curating this disease would also give the antifungal target modules a
  conformer outside the azole and echinocandin families.
sources:
- source_name: dismech-orphan-module-census
  source_url: https://github.com/monarch-initiative/dismech/issues/11575
  source_identifier: MONDO:0005723
  source_tags:
  - orphan_module=fungal_nucleic_acid_antimetabolite
added_date: "2026-10-08"
notes: >-
  Check the relationship to MONDO:0005724 cryptococcosis before curating: the
  infectious-disease granularity ladder in design decisions section 3e puts the
  named pathogen-syndrome pair at the default level, which favours the meningitis
  entity over the organism-level concept, but the pulmonary and disseminated forms
  need placing in the same decision.

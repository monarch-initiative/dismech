notes: >-
  SUBTYPE. MONDO:0007495 (dystonia 5 / DYT5, OMIM 128230) is the GCH1-specific
  concept sitting under both of its MONDO parents recorded above. It is already
  modelled as the `GCH1-related GTPCH1-deficient DRD` entry in
  `has_subtypes` of `kb/disorders/Autosomal_Dominant_Dopa_Responsive_Dystonia.yaml`
  (MONDO:0971063), whose display name is "Classic GCH1-related dopa-responsive
  dystonia (Segawa disease)". A separate disorder file is not warranted: the
  parent entry already carries the GCH1 haploinsufficiency to BH4 depletion to
  nigrostriatal dopamine deficiency chain, the diurnal-fluctuation phenotypes,
  the sex-biased reduced penetrance, and the low-dose levodopa treatment, all
  scoped to this subtype.

  BLOCKED on one remaining step: binding `subtype_term` to MONDO:0007495 on that
  `has_subtypes` entry, which is what makes the concept count as curated for
  MONDO coverage. The binding was written and reverted in this session because
  it cannot be validated here. MONDO:0007495 is absent from both
  `cache/mondo/terms.csv` and the `DiseaseOrSubtypeTerm` enum closure cache, and
  every route to materialize those rows (EBI OLS, the bbop-sqlite MONDO build)
  is denied by this environment's egress policy. Cache rows must not be
  hand-written. A session with ontology-service access can finish it by adding
  the `subtype_term` block, running `just validate-terms` on the parent file,
  and committing the resulting cache rows, then deleting this stub.

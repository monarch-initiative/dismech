notes: >-
  Decided GROUPING. Intracranial abscess is the union of separately named
  entities (brain abscess, intracranial epidural abscess, subdural empyema)
  that differ in compartment, route of spread and causative organisms, so
  under the infectious-disease granularity ladder (design decisions section
  3e) it is a Grouping rather than a Disease entry. Expected members are the
  Subdural_Empyema (MONDO:0006984) and Epidural_Abscess (MONDO:0005752) stubs
  plus brain abscess, which has no stub yet. MONDO does not encode this
  membership: in the 2026-11-04 local mondo.db build MONDO:0000939 has no
  subClassOf children (the OLS4 hierarchicalChildren endpoint also returns
  0), neither MONDO:0006984 nor MONDO:0005752 sits under it, and the only
  MONDO label matching "brain abscess" is MONDO:1015087 brain abscess,
  non-human animal. MONDO:0005752 is defined as covering the spinal or
  intracranial epidural space, so only its intracranial part belongs here.
  The stub stays in the queue as a placeholder until at least one member has
  a kb/disorders entry, when it should be replaced by
  kb/groupings/Intracranial_Abscess.yaml.

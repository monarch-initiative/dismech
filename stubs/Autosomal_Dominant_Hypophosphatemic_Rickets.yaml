mondo_id: MONDO:0008660
label: autosomal dominant hypophosphatemic rickets
proposed_name: Autosomal_Dominant_Hypophosphatemic_Rickets
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: "Gene-defined disease with no dismech entry. ADHR (OMIM:193100) is caused by heterozygous missense FGF23 variants (ADHR Consortium, PMID:11062477) at the R176XXR179 furin site that make intact FGF23 resistant to cleavage, so it is the FGF23 gain-of-function counterpart of the loss-of-function alleles curated in Hyperphosphatemic_Familial_Tumoral_Calcinosis (HFTC2)."
added_date: "2026-11-25"

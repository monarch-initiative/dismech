notes: "No ClinGen gene-disease validity assertion exists for FGF23 in the 2026-11-22 export. When curated, the trigger node should bind FGF23 hormone activity as increased (cleavage resistance raises intact hormone), and the entry should record the iron-deficiency trigger of variable penetrance and late onset."

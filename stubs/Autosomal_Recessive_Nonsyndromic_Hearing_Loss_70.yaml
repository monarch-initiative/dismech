notes: >-
  Curated as a standalone DISEASE. PNPT1 (hgnc:23166) carries three inherited
  phenotypes on different allele classes: this recessive nonsyndromic deafness
  (DFNB70, OMIM 614934), the recessive combined oxidative phosphorylation defect
  type 13 (OMIM 614932, MONDO:0013977, already curated as
  kb/disorders/Combined_Oxidative_Phosphorylation_Defect_Type_13.yaml), and the
  dominant spinocerebellar ataxia type 25. The already-curated COXPD13 entry
  deliberately excludes DFNB70 and records it as a separate allelic entity under
  differential_diagnoses, so a standalone entry keeps the two consistent. The KB
  also curates the DFNB/DFNA series one entry per locus.

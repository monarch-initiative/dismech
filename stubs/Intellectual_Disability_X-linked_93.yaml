notes: >-
  Decided DISEASE in dismech#12227, while enumerating the gene-defined
  subtypes under Non-Syndromic_X-Linked_Intellectual_Disability. Declined as a
  subtype row there because the phenotype is reproducibly syndromic: the
  largest series (PMID:31714006, 17 males) titles the entity "an X-linked
  syndrome of mild-moderate intellectual disability, macrocephaly, and
  obesity" and reports shared facial features, MONDO itself carries "mental
  retardation, X-linked, with macrocephaly" as a related synonym, and ClinGen
  curates BRWD3 as Definitive against X-linked syndromic intellectual
  disability. A reproducible extra feature is what the non-syndromic class
  excludes, so this needs its own entry.

notes: >-
  Nominated during a completeness review of the FGFR-Related Skeletal Dysplasias
  grouping, not by the MONDO prioritizer. Expected entry_type is DISEASE, and on
  curation it should declare conforms_to against
  fgfr_gain_of_function_skeletal_dysplasia at the Constitutive FGFR Activation and
  Premature Suture Fusion and Craniosynostosis nodes, then be added to the grouping's
  members list. Recent literature to start from: PMID:41775672 (prenatal diagnosis
  with a novel FGFR2 variant, 2026), PMID:41882888 (autopsy case with extremely short
  small intestine — a visceral association not previously part of the phenotype), and
  PMID:42495986 (first successful Le Fort III distraction in Beare-Stevenson, 2026).
  The cutis gyrata and acanthosis nigricans skin features parallel the FGFR3
  keratinocyte branch already curated in Crouzon Syndrome with Acanthosis Nigricans,
  so that entry is the closest curation template.

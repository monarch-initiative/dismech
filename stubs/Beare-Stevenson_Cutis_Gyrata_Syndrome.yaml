mondo_id: MONDO:0007412
label: Beare-Stevenson cutis gyrata syndrome
proposed_name: Beare-Stevenson_Cutis_Gyrata_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: HIGH
rationale: >-
  Fills a known gap in the FGFR-Related Skeletal Dysplasias grouping. Beare-Stevenson
  is one of the classical FGFR2 gain-of-function craniosynostosis syndromes
  (recurrent p.Tyr375Cys and p.Ser372Cys), sitting alongside the already-curated
  Apert, Crouzon, Pfeiffer and Jackson-Weiss entries, and it is the only member of
  that FGFR2 series with no dismech entry at all. Its cysteine-creating alleles are
  also mechanistically informative: they are the same class of extracellular-cysteine
  substitution that drives ligand-independent constitutive activation in thanatophoric
  dysplasia, so the entry would connect the FGFR2 craniosynostosis arm to the FGFR3
  chondrodysplasia arm at the level of activation mechanism rather than phenotype.
synonyms:
- BSTVS
- Beare Stevenson syndrome
- cutis gyrata-acanthosis nigricans-craniosynostosis syndrome

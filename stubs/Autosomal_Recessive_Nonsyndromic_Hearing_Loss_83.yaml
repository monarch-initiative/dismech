notes: >-
  OUT_OF_SCOPE: a mapped locus with no identified gene, so there is no pathograph
  to build. Nothing here is a judgement about the disease being unimportant - it
  is that the molecular basis is unknown, and every other slot a dismech entry
  exists to carry follows from the gene.

  Three independent sources agree the gene is unknown. OMIM 613685 carries the
  "%" prefix (phenotype description, molecular basis unknown) and lists exactly
  one supporting publication, PMID:19888295. MedGen (C3888310) returns an empty
  AssociatedGenes element and one clinical feature, HP:0000399 prelingual
  sensorineural hearing impairment. MONDO:0013365 records no RO:0004003 causal
  gene at all, and defines the concept by chromosome region rather than by gene -
  which is what the empty `genes:` list in this stub was already telling us.

  The single publication is Shahin et al. 2010 (PMID:19888295), a SNP-based
  homozygosity mapping study of 20 Palestinian kindreds. Fourteen families were
  solved by candidate-gene screening; six were not, and DFNB83 is one of those
  six unsolved intervals. The interval is not even narrowed to one region - the
  paper reports it as 9p23-p21.2/p13.3-q21.13, two homozygous segments in a
  single family. A PubMed search for "DFNB83" returns that one paper and nothing
  since, and no candidate gene has been proposed in the sixteen years since.

  So a dismech entry would restate the ontology record and stop: an autosomal
  recessive inheritance block, one HPO phenotype, and a `genetic` section naming
  a chromosome band. There is no molecular lesion, no cell type, no process, and
  no causal edge that could be written without inventing it. In particular, a
  conforms_to link to kb/modules/sensorineural_hair_cell_loss.yaml would assert
  that the lesion acts through hair cell mechanotransduction failure, which is
  plausible for a sensorineural deafness locus and has never been shown for this
  one - exactly the unevidenced mechanism assertion the evidence SOP exists to
  prevent.

  Precedent: commit a072cbd2f1 recorded Usher_Syndrome_Type_1E as SUBTYPE on the
  same reasoning ("a mapped locus with no identified gene, so no pathograph to
  build"). SUBTYPE was right there because Usher_Syndrome is an existing entry to
  hang it on. There is no equivalent parent here - the KB has per-gene
  hearing-loss entries (Autosomal_Recessive_Nonsyndromic_Hearing_Loss_104 /
  RIPOR2, MYO6_Hearing_Loss, COL11A2_Hearing_Loss, GJB2-GJB6_Digenic...) but no
  general autosomal recessive nonsyndromic hearing loss entry or grouping for a
  gene-less locus to be a subtype of, so OUT_OF_SCOPE is the honest value.

  Reopen this if a causal gene is published. At that point the concept becomes an
  ordinary Mendelian curation target and this stub should be flipped back to
  DISEASE. The stub file is kept rather than deleted so that decision, and this
  reasoning, survive: `just seed-stubs` re-adds any nominated disease that is
  "neither curated nor already stubbed", so deleting the file would silently
  re-seed the concept as UNDECIDED on the next run. Setting entry_type is
  sufficient to take it out of the queue - src/dismech/stubs/cli.py only offers
  stubs whose entry_type is UNDECIDED or DISEASE.

  Decided while curating claim issue #9582.

notes: >-
  GROUPING, not a disease entry. Acid sphingomyelinase deficiency is the umbrella term
  for the SMPD1 disease spectrum, and the KB already curates its members separately:
  Niemann-Pick Disease Type A, Niemann-Pick Disease Type B, Niemann-Pick Disease Type E,
  and Chronic Neurovisceral Acid Sphingomyelinase Deficiency. Curating MONDO:0100464 as
  a disorder would duplicate all four. If the union is wanted as a browsable object it
  belongs in kb/groupings/ under the curate-grouping skill, with those entries as
  explicit members.

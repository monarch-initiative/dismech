notes: >-
  OUT_OF_SCOPE: a mapped locus with no identified gene, so there is no pathograph
  to build. This is not a judgement that the disease does not matter. It is that
  the molecular basis is unknown, and in a numbered DCM series every slot a
  dismech entry exists to carry follows from the gene.

  Three independent sources agree no causal gene is known. MONDO:0011425 records
  no RO:0004003 causal gene and defines the concept by chromosome band ("a
  dilated cardiomyopathy that has material basis in variation in the chromosome
  region 2q14-q22"), which is what the absent `genes:` list in this stub was
  already saying. MedGen 348980 returns an empty AssociatedGenes element. The
  HPO/JAX annotation network returns no gene for OMIM:604288.

  The concept rests on one linkage study, Jung et al. 1999 (PMID:10486326), a
  whole genome screen in a single three generation German family with 12 affected
  individuals. It reports a 24 cM interval between D2S2224 and D2S2324, narrowing
  to 11 cM with unaffected individuals included, peak LOD 3.73. No candidate gene
  was proposed. Searching Europe PMC for CMD1H returns seven records in total,
  none of which identifies a gene. The most recent (PMID:16320577, 2005) uses
  CMD1H only as a locus to exclude in an unrelated Chinese pedigree.

  So a dismech entry would restate the ontology record and stop: autosomal
  dominant inheritance, dilated cardiomyopathy with conduction disease, and a
  `genetic` section naming a chromosome band. There is no molecular lesion, no
  cell type, no process, and no causal edge that could be written without
  inventing it. A conforms_to link to a sarcomere or cytoskeletal DCM mechanism
  would assert a lesion class that has never been shown for this locus.

  The stub is kept rather than deleted so the reasoning survives and
  `just seed-stubs` does not re-add the concept as UNDECIDED; setting entry_type
  is already enough to take it out of the queue, since `just next-stubs` only
  offers UNDECIDED and DISEASE stubs. Same treatment as
  Autosomal_Recessive_Nonsyndromic_Hearing_Loss_83 (#9591).

  Reopen if a gene is identified for the 2q14-q22 interval. See #9865 group A.

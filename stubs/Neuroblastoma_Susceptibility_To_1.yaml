notes: >-
  Blocked, and still UNDECIDED: the germline KIF1B neuroblastic-tumour link
  rests on a single family, and the follow-up study of that same family moved
  most of its tumour predisposition onto a different gene.

  Yeh and colleagues (PMID:18726616) described five individuals from a
  three-generation cancer-prone family carrying a germline KIF1B beta variant,
  with seven tumours of neural-crest and non-neural origin. Both KIF1B alleles
  were retained in every neural-crest-derived tumour in that family, which fits
  haploinsufficiency rather than classical two-hit inactivation.

  Revisiting the same kindred twelve years later, Cardot Bauters and colleagues
  (PMID:33112832) found that a brother who did not carry the KIF1B variant
  developed bilateral pheochromocytoma at 31, that he carried a germline MAX
  variant, and that the wild-type MAX allele was lost in both of his tumours.
  Their conclusion is that the heritability of pheochromocytoma in this family
  is linked to the MAX variant and not to the KIF1B variant, which "may have
  contributed to the occurrence of neuroblastoma (NB) in the proband". They
  also put the share of pheochromocytoma and paraganglioma patients carrying a
  germline pathogenic KIF1B variant at only 1 to 2 per cent. What survives as a
  germline-KIF1B-to-neuroblastoma observation is therefore one proband's
  neuroblastoma, with the authors themselves hedging it.

  No gene-disease validity body has ruled on the pair. The committed ClinGen
  gene-validity export (created 2026-01-24) holds exactly one KIF1B assertion,
  for Charcot-Marie-Tooth disease type 2A1 (MONDO:0007308), classified No Known
  Disease Relationship by the Charcot-Marie-Tooth Disease Gene Curation Expert
  Panel on 2020-10-05. ClinGen has not curated KIF1B against neuroblastoma or
  any neuroblastic tumour. That is an absence of curation rather than a
  refutation, so it does not by itself argue the term out of scope.

  What would unblock the decision: a ClinGen or other expert-panel validity
  curation of KIF1B against a neuroblastoma term, or germline KIF1B evidence
  from a cohort rather than from this one kindred. Until one of those exists
  there is no basis to call the term either a curatable predisposition syndrome
  or OUT_OF_SCOPE, and guessing would put a mechanism in the knowledge base
  that its own source literature has walked back.

  The remaining open question, if that evidence does arrive, is whether MONDO's
  label qualifier "autosomal dominant, somatic mutation" means this is a
  locus-level historical concept rather than a predisposition syndrome. For
  contrast, the sibling ALK term MONDO:0013083 carries a ClinGen Definitive
  assertion and is curated as ALK-Related_Neuroblastic_Tumor_Susceptibility.

notes: >-
  Still UNDECIDED, and the reason is recorded rather than the decision guessed.
  The committed ClinGen gene-validity export holds exactly one KIF1B assertion,
  for Charcot-Marie-Tooth disease type 2A1 (MONDO:0007308), classified No Known
  Disease Relationship; ClinGen has not curated KIF1B against neuroblastoma at
  all. That is an absence of curation, not a refutation, so it does not by
  itself argue the term out of scope. The open question is whether MONDO's own
  label qualifier, autosomal dominant, somatic mutation, means this is a
  locus-level historical concept rather than a predisposition syndrome a
  curator could write a mechanism for. Settle that from the 1p36 and KIF1B
  neuroblastoma literature before setting entry_type. The sibling ALK term,
  MONDO:0013083, is curated as
  ALK-Related_Neuroblastic_Tumor_Susceptibility.

mondo_id: MONDO:0006195
label: endometrial polyp
proposed_name: Endometrial_Polyp
status: OPEN
entry_type: UNDECIDED
priority: LOW
rationale: >-
  Curated as a differential diagnosis on Endometrial_Carcinoma but has no entry of
  its own; among the leading benign causes of postmenopausal bleeding and of a
  thickened or focally irregular endometrial stripe.
added_date: "2026-08-28"
sources:
- source_name: dismech-curation
  source_identifier: MONDO:0006195
  source_tags:
  - origin=differential_of_Endometrial_Carcinoma
notes: >-
  Nominated while filling out the differential_diagnoses block on
  Endometrial_Carcinoma. Priority is set LOW because the concept is closer to a
  focal lesion than to a disease with a mechanistic narrative, and OUT_OF_SCOPE is
  a plausible outcome.

  The case for OUT_OF_SCOPE: a polyp is a localised overgrowth of endometrial
  glands and stroma rather than a disorder with an aetiology-to-phenotype causal
  chain, which is what a dismech entry models. Its clinical significance is mostly
  that it must be distinguished from carcinoma, and that is already captured where
  it belongs, as a differential on Endometrial_Carcinoma.

  The case for a DISEASE entry: polyps have a partly characterised molecular
  basis, they sit on the same hormone-responsive proliferative axis as endometrial
  hyperplasia, tamoxifen exposure induces them (now curated in the environmental
  block of Endometrial_Carcinoma), and a minority harbour hyperplasia or
  carcinoma, so the benign-to-malignant transition is a genuine mechanistic
  question.

  If OUT_OF_SCOPE is chosen, record the reasoning in the closing PR before
  deleting this stub so the concept is not re-nominated.

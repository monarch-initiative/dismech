mondo_id: MONDO:0010506
label: intellectual disability, X-linked 61
proposed_name: Tonne-Kalscheuer_Syndrome
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  Declined as a subtype of Non-Syndromic_X-Linked_Intellectual_Disability in
  dismech#12227 and nominated here instead. OMIM has renamed the concept: the
  term's OMIM xref OMIM:300978 is titled "TONNE-KALSCHEUER SYNDROME; TOKAS",
  and MONDO carries "Tonne-Kalscheuer syndrome" among this term's exact
  synonyms. The defining clinical series (PMID:29728705) is titled "Pathogenic
  variants in E3 ubiquitin ligase RLIM/RNF12 lead to a syndromic X-linked
  intellectual disability and behavior disorder".
synonyms:
- intellectual disability, X-linked 61
- intellectual disability, X-linked type 61
- MRX61
- RLIM non-syndromic X-linked intellectual disability
- Tonne-Kalscheuer syndrome
- mental retardation, X-linked 61
- mental retardation, X-linked type 61
- non-syndromic X-linked intellectual disability caused by mutation in RLIM
sources:
- source_name: dismech genetics-gap campaign
  source_url: https://github.com/monarch-initiative/dismech/issues/12227
  source_identifier: MONDO:0010506
added_date: "2026-09-24"
mondo_parents:
- id: MONDO:0019181
  label: non-syndromic X-linked intellectual disability
genes:
- id: hgnc:13429
  label: RLIM
notes: >-
  MONDO still files this term under MONDO:0019181, non-syndromic X-linked
  intellectual disability. That placement follows OMIM's historical MRX
  numbering rather than the current phenotype description and is one of the
  disagreements recorded in the parent entry's notes.

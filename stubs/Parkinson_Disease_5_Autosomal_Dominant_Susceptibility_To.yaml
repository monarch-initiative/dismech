notes: >-
  OUT_OF_SCOPE: a susceptibility term whose gene claim is contested. The PARK5
  claim rests on one I93M sibling pair never found again, and the S18Y common-
  variant claim is contradicted by the largest European meta-analysis while an
  Asian-ancestry meta-analysis still supports it. Recorded on the
  Parkinsons_Disease entry as a `genetic:` row with `relationship_type:
  DISPUTED` and the evidence cited there; no subtype row, because the concept is
  a gene claim and not a clinical entity. The ClinGen gene-validity download
  carries no Parkinson disease assertion for UCHL1 (checked 2026-11-10).

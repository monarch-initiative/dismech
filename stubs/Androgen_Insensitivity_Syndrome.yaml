notes: >-
  GROUPING, not a Disease entry. Both MONDO children of MONDO:0019154 are
  already curated as separate Disease files — complete AIS (MONDO:0021023) as
  kb/disorders/Complete_Androgen_Insensitivity_Syndrome.yaml and partial AIS
  (MONDO:0010720) as kb/disorders/Partial_Androgen_Insensitivity_Syndrome.yaml.
  MONDO:0019154 therefore sits over two already-distinct entries, which is
  exactly what kb/groupings/ is for; curating it as a third Disease would
  produce a blended umbrella pathograph over entries that already exist. This
  follows the Diabetes_Mellitus precedent in CLAUDE.md (Grouping + per-type
  Disease entries, not a blended umbrella).

  Remaining work is to write kb/groupings/Androgen_Insensitivity_Syndrome.yaml:
  grouping_basis SHARED_GENE_FAMILY + SHARED_MECHANISM (both members are AR,
  hgnc:644, loss of function differing in residual receptor activity), with a
  NECESSARY HAS_GENE criterion on AR. Mild AIS (MAIS) is a plausible third
  member but has no Disease entry yet. Delete this stub when that grouping
  lands.

notes: >-
  GROUPING, not a disorder entry: MONDO:0019154 is the AR-gene umbrella whose two
  descendants are both already curated as separate dismech Disease entries —
  complete AIS (MONDO:0021023, kb/disorders/Complete_Androgen_Insensitivity_Syndrome.yaml)
  and partial AIS (MONDO:0010720, kb/disorders/Partial_Androgen_Insensitivity_Syndrome.yaml).
  MONDO's own definition says AIS "comprises two clinical subgroups: complete AIS
  (CAIS) and partial AIS (PAIS)". Curating the umbrella would duplicate both. The
  right follow-on is a kb/groupings/ Grouping over those two members with
  grouping_basis SHARED_GENE_FAMILY + SHARED_MECHANISM (AR loss of function) and a
  NECESSARY HAS_GENE criterion on hgnc:644, not a new kb/disorders/ file.

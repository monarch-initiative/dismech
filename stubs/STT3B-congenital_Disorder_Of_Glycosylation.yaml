status: OPEN
entry_type: UNDECIDED
priority: NORMAL
notes: "Evidence for STT3B-CDG is two unrelated patients: a homozygous intronic STT3B variant (c.1539+20G>T) in a consanguineous family, rescued by STT3B cDNA in a glycosylation reporter assay (PMID:23842455), and a novel variant in a boy with epileptic spasms and respiratory failure (PMID:32253875). ClinGen rates STT3B Limited, filed under congenital disorder of glycosylation (MONDO:0015286). The paralogue STT3A causes the separate STT3A-CDG entry, which mentions STT3B-CDG only in prose. With two patients a full entry would rest on thin evidence; if curated, the gene record should be typed UNKNOWN."
rationale: Diagnostic delay impact; Insufficient ICD coding/underdiagnosis; Intervention potential; Multi-modal detectability; Phenotypic complexity

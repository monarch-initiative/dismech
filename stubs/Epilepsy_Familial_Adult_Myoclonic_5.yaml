mondo_id: MONDO:0014167
label: epilepsy, familial adult myoclonic, 5
proposed_name: Epilepsy_Familial_Adult_Myoclonic_5
status: OPEN
entry_type: UNDECIDED
priority: LOW
rationale: >-
  FAME5 is the one familial adult myoclonic epilepsy locus that is not a
  TTTTA/TTTCA pentanucleotide repeat expansion. It was mapped to a CNTN2 coding
  variant, so it does not share the repeat-RNA toxicity mechanism that lets the
  other loci sit in one entry.
sources:
- source_name: dismech-stub-queue-lump-review
  source_identifier: MONDO:0014167
added_date: "2026-09-09"
notes: >-
  Re-seeded after PR #11524 deleted the lumped stub
  stubs/Epilepsy_Familial_Adult_Myoclonic.yaml. That stub had replaced the seven
  seeded FAME stubs (FAME1-7) on the grounds that the solved loci share one
  repeat-expansion lesion, and it explicitly asked the curator to decide whether
  FAME5 stays inside the entry or is split back out.

  kb/disorders/Pentanucleotide_Repeat_Familial_Adult_Myoclonus_Epilepsy.yaml
  answers that by exclusion: its notes say it does not absorb historical or
  controversial nonrepeat candidate loci, and CNTN2 appears nowhere in kb/. So
  deleting the lumped stub would have retired FAME5 from the queue without
  anyone deciding to, which is why it is back here rather than left implicit.

  The curator taking this should weigh whether FAME5 is a dismech entry at all.
  It rests on a single pedigree, and the CNTN2 assignment has not been
  replicated, so OUT_OF_SCOPE with the reasoning recorded is a legitimate
  outcome and would be a completed curation.

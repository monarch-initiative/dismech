notes: >-
  Covered by `kb/disorders/Fibrous_Dysplasia.yaml`, which is already scoped to
  the FD/MAS spectrum rather than to skeletal-limited disease. That entry
  carries `Fibrous dysplasia/McCune-Albright syndrome` and `FD/MAS` as synonyms,
  is categorised `Somatic mosaic`, cites FD/MAS spectrum reviews
  (PMID:31037426, PMID:27492469) for the causal post-zygotic GNAS lesion, and
  models the extraskeletal arm explicitly as the pathophysiology node
  `Extraskeletal mosaic GNAS activation`, whose downstream targets are the
  MAS-defining features: large cafe-au-lait macules with irregular margins,
  precocious puberty in females, hyperthyroidism, elevated circulating growth
  hormone concentration, and ovarian cyst.

  MAS is therefore best modelled as a `has_subtypes` entry on Fibrous Dysplasia,
  alongside the monostotic and polyostotic skeletal-limited forms, rather than
  as a second `kb/disorders/` entry duplicating the shared GNAS pathograph. The
  field's own nomenclature reflects this: the spectrum is conventionally named
  FD/MAS.

  Defect this decision leaves in place: the MAS-defining phenotypes in
  Fibrous_Dysplasia.yaml carry ORPHA:249 frequency bands (all VERY_RARE), which
  are frequencies within fibrous dysplasia of bone, not within MAS. That is the
  scope-boundary frequency leak tracked in #6951, with a proposed QC check in
  #8769. Writing the has_subtypes block is the natural place to fix it.

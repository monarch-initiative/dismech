mondo_id: MONDO:1030000
label: hyperinsulinemic hypoglycemia with polycystic kidney disease
proposed_name: Hyperinsulinemic_Hypoglycemia_With_Polycystic_Kidney_Disease
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: "Gene-defined disease with no dismech entry: ClinGen rates PMM2 Moderate (AR) for hyperinsulinemic hypoglycemia with polycystic kidney disease (HIPKD, MONDO:1030000), and PMM2-Congenital_Disorder_of_Glycosylation does not cover it."
synonyms:
- HIPKD
notes: >-
  HIPKD is caused by the PMM2 promoter variant c.-167G>T, homozygous or in
  trans with a coding PMM2 variant, and combines congenital hyperinsulinism
  with polycystic kidneys without the multisystem glycosylation disorder of
  PMM2-CDG. Key references: PMID:28373276 (discovery, promoter variant),
  PMID:33811480 (European founder haplotype in 11 patients from seven
  families), PMID:32841164 and PMID:36412659 (further families),
  PMID:36773065 (early-onset inflammatory bowel disease in some patients).
  ClinGen assertion CGGV:assertion_2325bc92-b994-4c5a-b2cb-e2b757d8acbd-2026-06-08T040000.000Z
  (Moderate, AR). Decide whether it is a separate entry or an allelic
  subtype of the PMM2 entry; the mechanism (loss of a beta-cell and kidney
  specific PMM2 promoter element, not global hypoglycosylation) argues for a
  separate entry.
added_date: "2026-11-26"

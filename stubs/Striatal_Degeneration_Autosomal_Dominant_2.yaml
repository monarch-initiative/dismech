notes: >-
  Routed out of kb/disorders/Autosomal_Dominant_Striatal_Neurodegeneration.yaml
  during the d2g genetics pass for dismech#12274, which re-anchored that entry
  from the series parent MONDO:0000211 to the PDE8B leaf MONDO:0012205. MONDO
  attributes this sibling class to PDE10A and xrefs OMIM:616922. The founding
  report (PMID:27058447) describes childhood-onset chorea with symmetrical
  bilateral striatal lesions in three unrelated individuals, each carrying a de
  novo heterozygous PDE10A substitution in the regulatory GAF-B domain, which
  the same report shows leaves basal enzyme activity intact while disrupting
  cAMP-mediated stimulation. Both the onset and the movement phenotype differ
  from the adult-onset parkinsonian PDE8B disease, and the molecular lesion is
  regulatory rather than an abolition of activity, so it warrants its own entry
  rather than a subtype row. A companion 2016 report titled "Biallelic Mutations
  in PDE10A Lead to Loss of Striatal PDE10A and a Hyperkinetic Movement Disorder
  with Onset in Infancy" (PMID:27058446) describes a biallelic PDE10A disorder,
  so whoever curates this should establish the boundary between the dominant and
  the recessive PDE10A entities rather than assume it; that boundary was not
  investigated here.

notes: 'ATP6V1A encodes the catalytic A subunit of the V-ATPase that acidifies synaptic vesicles to drive
  neurotransmitter loading. Its other allelic disorder is autosomal recessive cutis laxa type 2D (MONDO:0027451),
  stubbed separately. Overlap: #12213 (open, d2g genetics pass) lists this disease for a has_subtypes
  row on Genetic_Developmental_and_Epileptic_Encephalopathy. Decide between that row alone and a dedicated
  entry before curating. Precedent for both at once: STXBP1 is a subtype row there and also kb/disorders/STXBP1_Encephalopathy.yaml,
  and synaptic-vesicle-cycle gene entries (DNM1_Encephalopathy, SNAP25_Encephalopathy, SYT1_Baker-Gordon_Syndrome)
  conform to kb/modules/synaptic_vesicle_cycle.yaml.'

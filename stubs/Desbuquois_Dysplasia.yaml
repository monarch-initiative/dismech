mondo_id: MONDO:0015426
label: Desbuquois dysplasia
proposed_name: Desbuquois_Dysplasia
status: OPEN
entry_type: GROUPING
priority: NORMAL
rationale: >-
  A union of two distinct diseases that differ in their molecular lesion, not a
  single entity. Both impair proteoglycan biosynthesis and share a clinical
  gestalt, but the defective step differs by gene.
sources:
- source_name: dismech-stub-queue-lump-review
  source_identifier: MONDO:0015426
added_date: "2026-08-28"
notes: >-
  Re-decided as a GROUPING (was DISEASE). DBQD1 (CANT1, MONDO:0009629) and
  DBQD2 (XYLT1) are curated as separate disease entries because their molecular
  lesions differ: CANT1 is the ER/Golgi calcium-activated UDP nucleotidase
  acting on glycosaminoglycan chain elongation, whereas XYLT1 is the
  xylosyltransferase that initiates the proteoglycan linker region. ClinGen
  curates CANT1 against MONDO:0009629 (Desbuquois dysplasia 1) specifically, so
  the gene-disease validity assertion is anchored at the split level, not the
  lumped MONDO:0015426. This grouping term therefore collects the two curated
  entries rather than being curated as one lumped disease. The DBQD2 (XYLT1)
  stub is retained separately.

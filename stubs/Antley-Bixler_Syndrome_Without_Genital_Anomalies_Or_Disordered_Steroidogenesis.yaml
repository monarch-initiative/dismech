mondo_id: MONDO:0020667
label: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
proposed_name: Antley-Bixler_Syndrome_Without_Genital_Anomalies_Or_Disordered_Steroidogenesis
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  The FGFR2 gain-of-function form of Antley-Bixler syndrome (craniosynostosis with
  radiohumeral synostosis), and a known unfilled seat in the FGFR-Related Skeletal
  Dysplasias grouping. It must be kept distinct from MONDO:0008726, the
  POR-cytochrome-P450-oxidoreductase form with genital anomalies and disordered
  steroidogenesis, which is already stubbed separately and has no FGFR lesion at all.
synonyms:
- ABS2
- trapezoidocephaly-synostosis syndrome

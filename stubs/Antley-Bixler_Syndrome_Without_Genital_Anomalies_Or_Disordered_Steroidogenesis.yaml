notes: >-
  NAMED ENTITY CONFUSION HAZARD — read before curating. "Antley-Bixler syndrome"
  denotes two mechanistically unrelated disorders that share a name and a
  craniosynostosis-plus-radiohumeral-synostosis phenotype: this FGFR2
  gain-of-function form (OMIM:207410), and the autosomal recessive POR form with
  disordered steroidogenesis (MONDO:0008726, OMIM:201750, stubbed as
  Antley-Bixler_Syndrome_With_Genital_Anomalies_And_Disordered_Steroidogenesis).
  Any deep-research report on "Antley-Bixler syndrome" will very likely blend the
  two; run `just preflight-dr <report> MONDO:0020667` and expect the POR literature
  to dominate. Only the FGFR2 form belongs in the FGFR-Related Skeletal Dysplasias
  grouping. The existing dismech Humeroradial_Synostosis entry already names both
  forms as syndromic contexts and is the right cross-reference. Expected entry_type
  is DISEASE.

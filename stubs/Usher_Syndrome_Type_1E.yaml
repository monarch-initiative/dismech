  label: Usher syndrome type 1
notes: >-
  SUBTYPE of Usher_Syndrome, which carries a `USH1` has_subtypes entry
  covering type 1. Two independent reasons not to curate this standalone.
  First, USH1E is a mapped locus (21q21) with no identified causal gene --
  MONDO records none for this term -- so there is no proximal mechanism to
  build a pathograph on, only the generic USH1 hair-cell and photoreceptor
  chain already curated in the parent. Second, the Usher type 1 mechanism is
  shared across its loci, so a per-locus entry would duplicate rather than
  differentiate. Revisit if a gene is identified. Found during the duplicate
  preflight for claim #9222; not claimed.

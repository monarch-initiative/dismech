added_date: "2026-09-17"
notes: >-
  Member of the Viral_Hemorrhagic_Fevers grouping
  (kb/groupings/Viral_Hemorrhagic_Fevers.yaml), which lists it as a wanted
  member with no entry yet. Added when the Viral_Hemorrhagic_Fever umbrella
  Disease entry was converted to a mechanism module plus a grouping under the
  infectious disease granularity ladder (design decisions section 3e, issue
  dismech#10115). When curated, the entry should declare conforms_to
  "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability" on its
  vascular-leak node and be added to the grouping's members. An arenavirus
  disease with a Mastomys rodent reservoir, West African in distribution, and
  the only member of the group for which ribavirin is a guideline-recommended
  treatment (on a contested evidence base, PMID:31357056). Sensorineural
  hearing loss as a sequela is another axis on which it differs from every
  other member. The retired umbrella entry's ribavirin treatment record was
  Lassa-specific and should be reconstructed here. A macaque LCMV-WE model
  dataset for Lassa fever, geo:GSE12254, was also held on the umbrella entry
  and belongs here.

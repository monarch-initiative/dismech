mondo_id: MONDO:0700207
label: constitutional delay of growth and puberty
proposed_name: Constitutional_Delay_Of_Growth_And_Puberty
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Common pubertal-timing disorder with a genetic contribution in which MC3R is
  the clearest single gene so far: humans carrying loss-of-function MC3R
  variants have later puberty, reduced linear growth and lean mass
  (PMID:34732894), and functionally damaging MC3R variants are overrepresented
  in adolescents with this diagnosis (8 of 362, OR 4.17) without being a common
  cause of it (PMID:37339320). MC3R is not yet named by any dismech entry.
genes:
- id: hgnc:6931
  label: MC3R
added_date: "2026-11-26"
notes: >-
  MC3R would be a risk-factor or susceptibility record here, not a causative
  one. The same study found no strong overrepresentation of MC3R variants in
  normosmic idiopathic hypogonadotropic hypogonadism, so the gene should not be
  added to the hypogonadotropic hypogonadism entries on this evidence.

mondo_id: MONDO:0013458
label: hyperuricemia-pulmonary hypertension-renal failure-alkalosis syndrome
proposed_name: HUPRA_Syndrome
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  Nominated from the series-071 genetics gap list (dismech#12278), which expected
  it as a gene-defined subtype under kb/disorders/Pulmonary_hypertension.yaml. It
  is not a kind of pulmonary hypertension: MONDO also files it under inherited
  renal tubular disease (MONDO:0015962) and mitochondrial oxidative
  phosphorylation disorder (MONDO:0016387), and the four cardinal features are
  hyperuricaemia, pulmonary hypertension, renal failure and metabolic alkalosis.
  It therefore warrants its own Disease entry rather than a subtype row, and
  entry_type is set to DISEASE on that basis.
synonyms:
- hyperuricemia, pulmonary hypertension, renal failure, and alkalosis syndrome
- HUPRA syndrome
- HUPRAS
mondo_parents:
- id: MONDO:0005149
  label: pulmonary hypertension
- id: MONDO:0015962
  label: inherited renal tubular disease
- id: MONDO:0016387
  label: mitochondrial oxidative phosphorylation disorder
genes:
- id: hgnc:17697
  label: SARS2
added_date: "2026-10-23"
notes: >-
  The SARS1/SARS2 paralogue trap applies to this concept and is already written
  up on kb/disorders/SARS1-Related_Neurodevelopmental_Disorder.yaml, as a
  differential_diagnoses row binding MONDO:0013458. Read that row before
  curating: HGNC lists "SARS" as both an exact synonym of SARS2 and the former
  symbol of SARS1, so any gene-disease extraction keying on that string merges
  the two diseases. This disease is SARS2 (hgnc:17697, mitochondrial seryl-tRNA
  synthetase) / OMIM:613845 / Orphanet:363694. No HUPRA literature was read
  when this stub was written; the MONDO parents and the gene above are from an
  OLS4 lookup of MONDO:0013458 on 2026-10-23, and the clinical features are from
  that term's own synonyms and the differential row named above.

mondo_id: MONDO:0013873
label: IMAGe syndrome
proposed_name: IMAGe_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Listed entity of the ISDS Nosology of Genetic Skeletal Disorders (2023
  revision), group 21 "Primordial dwarfism and slender bone dysplasias", with
  no dismech entry. The group's other members are curated, so this is a
  coverage gap in an otherwise complete group rather than a new nomination.
synonyms:
- intrauterine growth retardation-metaphyseal dysplasia-adrenal hypoplasia congenita-genital anomalies syndrome
sources:
- source_name: isds-nosology-2023-group-21
  source_url: https://pubmed.ncbi.nlm.nih.gov/36779427/
  source_identifier: NOS 21-0210
  source_tags:
  - isds_group=21
added_date: "2026-08-27"
notes: >-
  ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
  PMID:36779427), group 21, NOS 21-0210 "IMAGE syndrome (intrauterine growth
  retardation, metaphyseal dysplasia, adrenal hypoplasia, and genital
  anomalies)" (CDKN1C, AD, OMIM 614732). CDKN1C is shared with Beckwith-
  Wiedemann and Silver-Russell syndrome, both already curated and both
  correctly unassigned to this group: the gene is not what puts IMAGe here.
  Carries isds_skeletal_category: primordial_dwarfism_and_slender_bones when
  curated.

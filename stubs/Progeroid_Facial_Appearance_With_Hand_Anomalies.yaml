  label: progeroid syndrome
notes: >-
  Known only from one family (father and son) reported in 1997
  (PMID:9409877; OMIM:602249). MONDO records no causal gene, Orphanet has no
  record, and PubMed and Europe PMC list no citing or follow-up reports, so there
  is no molecular or tissue data from which to build a pathograph. Lowered to LOW
  priority in October 2026 for that reason, and kept in the queue because it is a
  real disease rather than an out-of-scope concept. Raise it if a causal gene is
  reported.

notes: >-
  OUT_OF_SCOPE: a susceptibility term, not a disease entity. Both MONDO
  parents are susceptibility classes (susceptibility to familial cutaneous
  melanoma; glioma susceptibility), and the concept denotes increased risk
  conferred by TERT promoter variation rather than a disease with its own
  pathophysiology. Per the claim-disease skill, susceptibility and
  predisposition terms are usually out of scope; the curatable entities here
  are the melanoma and glioma entries themselves, with TERT recorded as a
  susceptibility-typed gene in their `genetic` blocks. Note the KB already
  curates telomere maintenance reactivation as a cancer hallmark in
  kb/modules/enabling_replicative_immortality.yaml, which is where TERT
  mechanism belongs. Found during the duplicate preflight for claim #9223; not
  claimed.

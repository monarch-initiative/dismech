notes: >-
  Curated as a standalone Disease entry at kb/disorders/Peroxisome_Biogenesis_Disorder_6B.yaml,
  following the repository precedent for the other A/B pairs of the peroxisome biogenesis
  disorder series (1A/1B, 4A/4B, 11A/11B), and following MONDO and OMIM, which give the
  severe and mild bands of the PEX10 allelic series separate identifiers. The severe band is
  already curated as Peroxisome_Biogenesis_Disorder_6A_Zellweger (MONDO:0013936). Within the
  new entry the childhood-onset ataxic presentation and the neonatal adrenoleukodystrophy
  presentation are has_subtypes rows rather than separate entries.

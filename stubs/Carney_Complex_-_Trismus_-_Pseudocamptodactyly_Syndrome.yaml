notes: >-
  Routed out of kb/disorders/Carney_Complex.yaml during the d2g genetics pass for
  dismech#12274. MONDO files this class under Carney complex, but describes it as
  a heart-hand syndrome combining Carney complex manifestations with trismus and
  distal arthrogryposis, gives it its own OMIM (608837) and Orphanet (319340)
  identities, and attributes it to MYH8 rather than to PRKAR1A or anything else
  in the PKA pathway the Carney complex entry models. It is therefore recorded
  here as a separate disease to curate rather than as a `has_subtypes` row on
  that entry. Whether MONDO's placement under Carney complex is itself right,
  and whether the MYH8 attribution holds, are open questions for whoever curates
  it; neither was investigated here, because a structural routing decision does
  not need them answered.

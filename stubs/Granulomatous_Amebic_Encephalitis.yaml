priority: NORMAL
rationale: >-
  Dashboard CURATE_ROOT row for granulomatous amebic encephalitis highlighted
  this human infectious-disease candidate; the MONDO ID is not covered by a
  committed standalone disorder, grouping, or stub, so adding a stub keeps this
  free-living amoebic encephalitis visible for a future lump/split decision.
notes: >-
  Primary_Amebic_Meningoencephalitis.yaml already distinguishes Naegleria PAM
  from granulomatous amebic encephalitis due to Acanthamoeba or Balamuthia.
  Curate this concept separately from PAM.

mondo_id: MONDO:0000160
label: epilepsy, familial adult myoclonic
proposed_name: Familial_Adult_Myoclonic_Epilepsy
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  FAME1-7 share one clinical phenotype (cortical myoclonic tremor with
  epilepsy) and literally one molecular lesion: an intronic TTTTA/TTTCA
  pentanucleotide repeat expansion. The host gene differs per locus but is
  considered incidental to pathogenesis.
sources:
- source_name: dismech-stub-queue-lump-review
  source_identifier: MONDO:0000160
added_date: "2026-08-28"
notes: >-
  Lumped stub replacing the seeded stubs FAME1 (MONDO:0010985, SAMD12), FAME2
  (MONDO:0011930, STARD7), FAME3 (MONDO:0013322, MARCHF6), FAME4
  (MONDO:0014055), FAME5 (MONDO:0014167, CNTN2), FAME6 (MONDO:0054846,
  TNRC6A), and FAME7 (MONDO:0054847, RAPGEF2). The shared TTTCA-repeat
  mechanism (RNA foci / repeat toxicity independent of the host gene product)
  makes this the clearest possible lump: one entry, with loci as genetic
  detail.

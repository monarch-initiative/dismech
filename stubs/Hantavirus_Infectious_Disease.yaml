notes: >-
  GROUPING, not a disease entry. Hantavirus infectious disease spans clinically
  distinct Old World hemorrhagic fever with renal syndrome and New World
  hantavirus cardiopulmonary syndrome entities that differ in dominant organ
  injury, reservoir geography and curated pathographs. The KB already curates
  Hantavirus_Hemorrhagic_Fever_with_Renal_Syndrome and
  Hantavirus_Pulmonary_Syndrome as separate diseases, and the MONDO children
  listed here include virus-specific renal-syndrome leaves. A shared union
  belongs in kb/groupings/ rather than in one disorder record with one
  pathograph.

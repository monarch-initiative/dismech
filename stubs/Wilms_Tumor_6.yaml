mondo_id: MONDO:0014779
label: Wilms tumor 6
proposed_name: REST-Related_Wilms_Tumor_Predisposition
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: Established Wilms tumor predisposition gene with no dismech entry; surveillance and family counselling depend on recognising it.
mondo_parents:
- id: MONDO:0003321
  label: hereditary Wilms tumor
genes:
- id: hgnc:9966
  label: REST
added_date: "2026-09-26"
notes: >-
  Constitutional inactivating REST variants predispose to Wilms tumor, reported in
  13 of 558 cases against 0 of 993 controls in the founding series (PMID:26551668),
  which states the contribution as about 2 per cent of Wilms tumor and finds a
  second mutational event in two tumors. Ruled a DISEASE rather than a subtype of
  Wilms_Tumor: design decisions 3a keeps a germline cancer predisposition condition
  separate from the tumor it predisposes to, and MONDO files this class under
  hereditary Wilms tumor rather than under the somatic tumor. The tumor side of
  the mechanism is curated on kb/disorders/Wilms_Tumor.yaml as the REST Repressor
  Inactivation node; what this entry would add is the constitutional condition,
  its inheritance, penetrance and surveillance.

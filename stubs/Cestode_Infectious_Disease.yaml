notes: >-
  Cestode infectious disease is a grouping rather than one conserved
  disease-level pathograph because this tapeworm parent spans intestinal and
  tissue-invasive helminthiases represented by taeniasis/cysticercosis,
  cystic echinococcosis, polycystic echinococcosis, diphyllobothriasis, and
  hymenolepiasis.

mondo_id: MONDO:0001260
label: cercarial dermatitis
proposed_name: Cercarial Dermatitis
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Dashboard CURATE_ROOT row for cercarial dermatitis highlighted this human
  infectious-disease candidate; the MONDO ID is not covered by a committed
  standalone disorder, grouping, or stub, so adding a stub keeps this
  schistosome-associated skin infection visible for a future lump/split
  decision.
notes: >-
  Schistosomiasis.yaml already models cercarial dermatitis as the immediate skin
  phase of human schistosome infection, but swimmer's itch is often caused by
  avian or other non-human schistosomes that die in human skin. Decide whether
  this MONDO concept should stay a phase there, become a subtype row, or get a
  standalone pathogen-agnostic entry before curating it.

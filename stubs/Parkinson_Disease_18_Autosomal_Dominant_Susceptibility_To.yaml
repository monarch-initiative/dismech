notes: >-
  OUT_OF_SCOPE: a susceptibility term whose gene claim has been refuted. The
  founding EIF4G1 p.Arg1205His variant (PMID:21907011) is more frequent in
  controls than in cases across 12,281 subjects (PMID:26022768), is nonpenetrant
  in an unaffected 86-year-old (PMID:23408866), and other reported variants
  occur in controls (PMID:22658323). Recorded on the Parkinsons_Disease entry as
  a `genetic:` row with `relationship_type: REFUTED` and the evidence cited
  there; no subtype row. The ClinGen gene-validity download carries no EIF4G1
  assertion (checked 2026-11-10).

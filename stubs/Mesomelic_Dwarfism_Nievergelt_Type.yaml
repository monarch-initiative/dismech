mondo_id: MONDO:0008098
label: mesomelic dwarfism, Nievergelt type
proposed_name: Mesomelic_Dwarfism_Nievergelt_Type
status: OPEN
entry_type: UNDECIDED
priority: LOW
rationale: >-
  Row NOS 15-0120 of ISDS Nosology 2023 group 15 (mesomelic and rhizo-mesomelic
  dysplasias), MIM 163400, autosomal dominant. One of the two rows in that group
  with no gene assigned in the nosology table.
synonyms:
- Nievergelt syndrome
- mesomelic dysplasia, Nievergelt type
- Nievergelt-Pearlman syndrome
added_date: "2026-08-27"
notes: >-
  Queued during the group-15 review that curated the other fifteen rows of the
  group. Deliberately not curated in that pass: the nosology assigns no gene, so
  a dismech entry would carry a phenotype list and no mechanism, which is not
  what this KB is for. Priority is LOW for the same reason — revisit if a
  molecular basis is published. Note that the KINSSHIP syndrome entry
  (kb/disorders/KINSSHIP_Syndrome.yaml) names this type in its acronym for
  radiographic resemblance only; the nosology's own comment states the two are
  quite different conditions, so KINSSHIP does not cover this row.

notes: >-
  The numbered stubs PDB2, early-onset (MONDO:0011183, TNFRSF11A), PDB3
  (MONDO:0008176, SQSTM1), and PDB6 (MONDO:0014792, ZNF687) were folded here
  in the stub-queue lump/split review: Paget disease of bone is one focal
  bone-remodeling disease converging on RANK-NF-kB osteoclast signaling, with
  the numbered loci as genetic detail (early-onset TNFRSF11A disease as a
  possible subtype). Juvenile Paget disease (OPG deficiency, MONDO:0009394)
  is a genuinely distinct entity and keeps its own stub.

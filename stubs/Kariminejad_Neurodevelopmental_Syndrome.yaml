mondo_id: MONDO:0975795
label: Kariminejad neurodevelopmental syndrome
proposed_name: Kariminejad_Neurodevelopmental_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  The second Mendelian disorder attributed to RBSN. Nominated while curating the first
  (MONDO:0975797, congenital myelofibrosis with anemia, neutropenia, developmental delay and
  ocular abnormalities) so that the split between the two is recorded in the queue rather
  than only in the curated entry's notes.
genes:
- id: hgnc:20759
  label: RBSN
added_date: "2026-09-19"
notes: >-
  Reported as progressive muscle weakness, facial dysmorphism, ophthalmoplegia and
  intellectual disability caused by the recessive FYVE-domain alleles p.Arg180Gly and
  p.Gly183Arg (PMID:35652444). ClinVar keys both of those alleles to this condition and keys
  the separate allele p.Gly97Arg to MONDO:0975797; the reporting authors conclude that
  distinct germline RBSN mutations cause non-overlapping phenotypes with discrete
  endolysosomal defects. So this is expected to be DISEASE rather than a subtype of the
  myelofibrosis entry, but the lump/split call has not been made and entry_type is left
  UNDECIDED. Gene and MONDO id read from HGNC and OLS on 2026-09-19; no mondo_parents or
  descendant counts recorded because `just enrich-stubs` has not been run for this stub.

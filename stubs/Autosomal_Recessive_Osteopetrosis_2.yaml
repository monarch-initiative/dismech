added_date: "2026-09-09"
notes: >-
  This disease had no entry of its own. kb/disorders/Autosomal_Recessive_Osteopetrosis.yaml
  carried MONDO:0009816 as its disease_term but described the TCIRG1 disease
  throughout, so repointing that entry to MONDO:0009815 leaves the TNFSF11 form
  uncurated. See issue #11558. It is mechanistically distinct and not a subtype
  of the TCIRG1 entry: RANKL loss blocks osteoclast differentiation, so this is
  an osteoclast-poor osteopetrosis, and haematopoietic stem cell transplantation
  is not expected to correct it because the defect is in the osteoblast-lineage
  signal rather than in the osteoclast precursor.

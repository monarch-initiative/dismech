notes: >-
  Curated as the "Diffuse Intrinsic Pontine Glioma (DIPG)" has_subtypes entry on
  kb/disorders/H3_K27_Altered_Diffuse_Midline_Glioma.yaml (parent disease_term
  MONDO:1060171). That entry's genetic section reports H3.3 K27M in about 80 per
  cent and H3.1 K27M in about 15 per cent of DIPG, so the H3 K27-altered tumor is
  the mechanistically defined entity and DIPG is its pontine presentation. MONDO
  nests the relation the other way round (MONDO:1060171 under MONDO:0006033),
  which is an anatomical rather than a mechanistic hierarchy. The H3-wildtype
  minority of pontine gliomas is not covered by that entry and would need its own
  evidence before it could be curated.

notes: >-
  SUBTYPE. Already curated as the OCA1A entry in the has_subtypes block of
  kb/disorders/Oculocutaneous_Albinism.yaml (the umbrella MONDO:0018910), which
  also carries the TYR genetic entry keyed to subtype OCA1A and the cited
  null-vs-residual tyrosinase distinction that separates OCA1A from OCA1B. The
  subtype simply had no subtype_term, so the coverage was invisible to
  just tidy-stubs. Bound to MONDO:0008745 in that file; no standalone entry needed.
  Note MONDO nests OCA1B (MONDO:0011749) under OCA1A rather than beside it, so
  MONDO:0008745 is not a leaf; dismech models them as sibling subtypes, and both
  are bound explicitly.

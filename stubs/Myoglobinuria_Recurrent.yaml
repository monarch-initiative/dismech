notes: >-
  Identity clarified 2026-09-05 during claim #11146. MONDO:0010791 cross-references
  OMIM:550500, the mitochondrially inherited recurrent myoglobinuria attributed to mtDNA
  cytochrome c oxidase gene mutations (MT-CO1/MT-CO2/MT-CO3), and MONDO records no causal
  gene for it. It is NOT the LPIN1 disorder: that is MONDO:0009992 (OMIM:268200,
  "myoglobinuria, acute recurrent, autosomal recessive"), now curated as
  kb/disorders/LPIN1-Related_Recurrent_Myoglobinuria.yaml, which records this term only as a
  skos:relatedMatch. The GARD-derived MONDO definition mentions both causes, so a curator
  taking this stub should scope the entry to the mtDNA form and should not re-nominate the
  LPIN1 disease under this identifier. entry_type is left UNDECIDED for that curator.

notes: >-
  MHS1 (MONDO:0007783, RYR1) and MHS5 (MONDO:0011163, CACNA1S) were separate
  seeded stubs, folded here in the stub-queue lump/split review: malignant
  hyperthermia is one pharmacogenetic entity on the RYR1-CACNA1S
  excitation-contraction coupling axis, with the numbered loci as genetic
  detail. Whether a susceptibility term is in scope as a Disease entry at all
  is the first call the curator should make (the acute MH crisis carries a
  clear mechanism) - and much of the answer is already in the KB:
  kb/disorders/Malignant_Hyperthermia_of_Anesthesia.yaml (MONDO:0018493)
  curates both folded genes as "RYR1 susceptibility variants" and "CACNA1S
  susceptibility variants" plus a peri-anesthetic case-finding definition,
  so reconcile the lump/split boundary with that entry rather than creating
  a parallel one.

mondo_id: MONDO:0012815
label: Coats plus syndrome
proposed_name: Coats_Plus_Syndrome
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  Cerebroretinal microangiopathy with calcifications and cysts (Coats plus) is
  one clinical entity; the numbered forms differ by gene within the CST
  telomere-capping complex (CTC1, STN1) and POT1.
sources:
- source_name: dismech-stub-queue-lump-review
  source_identifier: MONDO:0012815
added_date: "2026-08-28"
notes: >-
  Lumped stub replacing the seeded stubs cerebroretinal microangiopathy with
  calcifications and cysts 1 (MONDO:0024564, CTC1), 2 (MONDO:0015026, STN1),
  and 3 (MONDO:0957264). All are Coats plus; the CST-complex mechanism is
  shared, so curate one entry with per-gene detail. Relationship to the wider
  telomere-biology-disorder spectrum belongs in that discussion, not in extra
  stubs.

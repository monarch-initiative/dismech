mondo_id: MONDO:0006193
label: endometrial hyperplasia without atypia
proposed_name: Endometrial_Hyperplasia_Without_Atypia
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Curated as a differential diagnosis on Endometrial_Carcinoma but has no entry of
  its own; the commonest benign explanation for the presentation through which
  endometrial carcinoma is detected.
added_date: "2026-08-28"
sources:
- source_name: dismech-curation
  source_identifier: MONDO:0006193
  source_tags:
  - origin=differential_of_Endometrial_Carcinoma
notes: >-
  Nominated while filling out the differential_diagnoses block on
  Endometrial_Carcinoma. The lump/split call is genuinely open and is the
  curator's first job here.

  The case for a DISEASE entry: it has a real mechanistic story - the same
  unopposed-oestrogen route already modelled in Endometrial_Carcinoma and
  Endometrial_Endometrioid_Adenocarcinoma - and it is a distinct clinical entity
  with its own management (progestin therapy rather than oncologic treatment) and
  a materially different prognosis from the atypical form.

  The case against: the mechanism is already represented inside
  Endometrial_Carcinoma as the Endometrial Hyperplasia Precursor pathophysiology
  node, so a separate entry would duplicate rather than add. A SUBTYPE decision
  does not fit cleanly either, since it is not a subtype of carcinoma - it is a
  precursor state that mostly does not progress.

  Note the sibling concepts MONDO:0006410 (simple endometrial hyperplasia) and
  MONDO:0006169 (complex endometrial hyperplasia); if this is curated, decide
  whether they are subtypes of it or separate stubs. MONDO:0006096 (atypical
  endometrial hyperplasia) is already bound as a differential on
  Endometrial_Carcinoma and should not be conflated with this concept.

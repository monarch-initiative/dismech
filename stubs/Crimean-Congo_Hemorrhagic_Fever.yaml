label: Crimean-Congo hemorrhagic fever
proposed_name: Crimean-Congo_Hemorrhagic_Fever
status: OPEN
entry_type: DISEASE
priority: NORMAL
synonyms:
- CCHF
- Crimean-Congo haemorrhagic fever
added_date: "2026-09-17"
notes: >-
  Member of the Viral_Hemorrhagic_Fevers grouping
  (kb/groupings/Viral_Hemorrhagic_Fevers.yaml), which lists it as a wanted
  member with no entry yet. Added when the Viral_Hemorrhagic_Fever umbrella
  Disease entry was converted to a mechanism module plus a grouping under the
  infectious disease granularity ladder (design decisions section 3e, issue
  dismech#10115). When curated, the entry should declare conforms_to
  "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability" on its
  vascular-leak node and be added to the grouping's members. A nairovirus
  disease transmitted by Hyalomma ticks, by contact with viraemic livestock,
  and nosocomially through blood - the only member with all three routes.
  Geographically the widest-ranging of the group across Africa, the Balkans,
  the Middle East and Asia. The retired umbrella entry carried CCHF-specific
  clinical evidence that has no other home and should be reconstructed here:
  the occupational blood-exposure transmission route (PMID:39558265) and the
  nausea, severe headache, petechial rash and epistaxis of the clinical
  pathology series PMID:2749111.

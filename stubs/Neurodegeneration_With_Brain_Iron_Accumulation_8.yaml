notes: >-
  Human CRAT disease is documented by two molecularly confirmed probands. The
  founding report (PMID:29395073, Drecourt et al. 2018) describes one NBIA
  subject homozygous for CRAT c.962G>A (p.Arg321His), with reduced C2
  acylcarnitine production from labelled palmitate in fibroblasts (shifted
  back toward control values by wild-type CRAT cDNA), a 10-fold rise in
  fibroblast iron content under iron loading, and reduced transferrin receptor
  palmitoylation that the authors found in other NBIA genotypes too; the subject's
  clinical description is in that paper's Supplemental Note, not in its main
  text. PMID:31448845 (Laera et al. 2020) reports a girl with early-onset Leigh
  syndrome compound heterozygous for p.Tyr110Cys and p.Val569Met, both shown to
  impair recombinant CRAT catalysis. Two older reports of enzymatic carnitine
  acetyltransferase deficiency (PMID:574220, fatal ataxic encephalopathy;
  PMID:10518284, Purkinje cell degeneration with muscle carnitine deficiency and
  multiple mtDNA deletions) predate gene sequencing. Lump/split question for the
  curator: MONDO also carries MONDO:0011642 "carnitine acetyltransferase
  deficiency", whose definition (PMID:28955988) describes a muscle-specific
  mouse knockout rather than a human disease, so the NBIA and Leigh
  presentations may be better curated as one CRAT-related entry anchored here
  than as two. PMID:35180557 lists CRAT among 13 autosomal recessive NBIA genes,
  reports that no CRAT loss-of-function allele is recorded as pathogenic in
  ClinVar or HGMD, and estimates the NBIA8 lifetime risk at 0.02 per 100,000
  from gnomAD allele frequencies.

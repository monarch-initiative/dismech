notes: >-
  Ruled a DISEASE rather than a subtype of Wilms_Tumor. MONDO:0008679 is a
  constitutional WT1 predisposition condition, filed under hereditary Wilms tumor
  (MONDO:0003321) rather than under the somatic tumor, and design decisions 3a
  keeps a germline cancer predisposition condition separate from the tumor it
  predisposes to. It is also not a duplicate of the WT1 syndrome entries: ClinGen's
  Hereditary Cancer Gene Curation Expert Panel grades WT1 to MONDO:0008679
  Definitive under an autosomal dominant model and states that it split that
  curation from the WT1 congenital malformation syndromes, Denys-Drash, Frasier,
  Meacham and nephrotic syndrome type 4, because the lesion class differs, mostly
  loss of function for Wilms tumor type 1 against dominant negative exon 8 and 9
  missense for Denys-Drash. The entry therefore belongs beside the other members of
  kb/groupings/WT1_Disorders.yaml.

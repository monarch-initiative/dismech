notes: 'NSF (N-ethylmaleimide-sensitive factor) disassembles cis-SNARE complexes after fusion so t-SNAREs
  can be reused; it has no gene-specific entry and no mention anywhere in kb/. Overlap: #12213 (open,
  d2g genetics pass) lists this disease for a has_subtypes row on Genetic_Developmental_and_Epileptic_Encephalopathy.

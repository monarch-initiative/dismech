mondo_id: MONDO:0007744
label: cholesterol-ester transfer protein deficiency
proposed_name: Cholesterol-ester_Transfer_Protein_Deficiency
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Monogenic hyperalphalipoproteinemia caused by loss-of-function CETP variants,
  first described in Japanese families homozygous for a CETP splicing mutation,
  with markedly raised HDL cholesterol and lowered LDL cholesterol
  (PMID:2215607, PMID:25410905). The
  Hyperlipidemia entry records that this MONDO class belongs in an entry of its
  own rather than as a subtype of the complex-trait umbrella. CETP is the gene
  behind it and is not yet named by any dismech entry.
genes:
- id: hgnc:1869
  label: CETP
added_date: "2026-11-26"
notes: >-
  Lump/split: the deficiency is defined by plasma CETP activity and HDL
  cholesterol, with complete (homozygous or compound heterozygous) and partial
  (heterozygous) forms, so the two read as subtypes of one entry rather than as
  separate diseases. Whether the trait carries coronary risk or protection is
  contested and should be recorded with evidence on both sides, as should its
  link to the CETP-inhibitor drug class.

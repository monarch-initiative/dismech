mondo_id: MONDO:0007810
label: autosomal dominant ichthyosis vulgaris
proposed_name: Autosomal_Dominant_Ichthyosis_Vulgaris
status: OPEN
entry_type: SUBTYPE
notes: >-
  Ruled SUBTYPE of Inherited_Ichthyosis, covered by its Ichthyosis Vulgaris
  has_subtypes row. That row binds MONDO:0024304 ichthyosis vulgaris, the parent
  of this concept and a direct child of MONDO:0015947 inherited ichthyosis, and
  binds hgnc:3748 FLG, which is the gene MONDO asserts on MONDO:0007810. The row
  level of that entry is MONDO's direct children of its anchor, so this concept
  is covered one level up rather than as a separate row. The MONDO term itself is
  therefore not bound anywhere in kb/, which is why this file is kept rather than
  deleted; the reasoning is also recorded in the row's review_notes.

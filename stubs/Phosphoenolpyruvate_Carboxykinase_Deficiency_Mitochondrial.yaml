mondo_id: MONDO:0009864
label: phosphoenolpyruvate carboxykinase deficiency, mitochondrial
proposed_name: Phosphoenolpyruvate_Carboxykinase_Deficiency_Mitochondrial
status: OPEN
entry_type: UNDECIDED
priority: LOW
rationale: "ClinGen classifies PCK2 for this disease (Limited, AR); no dismech entry curates it, and Phosphoenolpyruvate_Carboxykinase_Deficiency_Cytosolic covers only the PCK1 form."
notes: >-
  Evidence is thin and its phenotype does not match the historical,
  enzyme-defined "mitochondrial PEPCK deficiency" (OMIM:261650). The only
  molecular report found (PMID:36845668, 2023) describes three patients in
  two families with biallelic PCK2 loss-of-function variants, absent PCK2
  protein and activity in fibroblasts, and a demyelinating peripheral
  neuropathy with no obvious metabolic phenotype, supported by a Pck2 knockout
  mouse with abnormal nerve conduction. A single-family report links a PCK2
  variant to primary angle-closure glaucoma (PMID:34650006), and a PCK2
  missense variant causes paroxysmal exercise-induced dyskinesia in Shetland
  sheepdogs (PMID:32660061). ClinGen (General Inborn Errors of Metabolism
  GCEP, 2026-09-30) rates PCK2 Limited (AR) for this term:
  CGGV:assertion_89fd4cfa-9c94-4620-9657-c724da31d67a-2026-09-30T170000.000Z.
  Decide whether the disease is the neuropathy, and whether it is
  established enough to curate.
added_date: "2026-11-26"

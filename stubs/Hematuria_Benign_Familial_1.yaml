notes: >-
  SUBTYPE of Alport_Syndrome (its Autosomal Dominant subtype). Benign familial
  hematuria 1 is COL4A4-related thin basement membrane nephropathy. The Alport
  entry records thin basement membrane nephropathy (MONDO:0957317, this term's
  MONDO parent) as reclassified into the Alport spectrum covered by its
  Autosomal Dominant subtype, which binds heterozygous COL4A3 and COL4A4. A
  separate entry would duplicate that subtype; what separates the two labels
  is ultrastructure, not genetics.

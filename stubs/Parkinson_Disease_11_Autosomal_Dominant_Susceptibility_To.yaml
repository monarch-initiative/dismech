notes: >-
  OUT_OF_SCOPE: a susceptibility term whose gene claim has been refuted. The
  GIGYF2 variants reported in familial cases (PMID:18358451) were found in
  neurologically normal controls (PMID:18923002), and 566 multiplex kindreds
  showed no segregation and no excess risk (PMID:19279319). Recorded on the
  Parkinsons_Disease entry as a `genetic:` row with `relationship_type: REFUTED`
  and the evidence cited there; no subtype row. The ClinGen gene-validity
  download carries no GIGYF2 assertion (checked 2026-11-10).

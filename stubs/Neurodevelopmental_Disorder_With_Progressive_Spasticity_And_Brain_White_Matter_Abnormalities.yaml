notes: >-
  Infantile-onset, autosomal recessive end of the HPDL disease spectrum, allelic
  to spastic paraplegia 83 (MONDO:0033614). HPDL makes 4-hydroxymandelate, a
  precursor of the coenzyme Q10 head group (PMID:34471290). Founding reports:
  PMID:32707086 (neonatal encephalopathy through adolescent-onset spastic
  paraplegia), PMID:33188300 (infantile neurodegenerative condition) and
  PMID:33634263 (the CPSQ1 locus re-attributed to an HPDL missense variant).
  PMID:40368591 and PMID:39731469 correlate variant type with onset and
  severity. The Hereditary_Spastic_Paraplegia entry records HPDL as the
  SPG83 subtype and describes the infantile spectrum in that genetic record. The
  lump/split decision is open: a single HPDL-related entry covering both MONDO
  terms, a subtype row, or a separate entry.

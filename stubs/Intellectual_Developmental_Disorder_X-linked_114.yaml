mondo_id: MONDO:0975828
label: intellectual developmental disorder, X-linked 114
proposed_name: Intellectual_Developmental_Disorder_X-linked_114
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  Declined as a subtype of Non-Syndromic_X-Linked_Intellectual_Disability in
  dismech#12227 and nominated here instead. The defining report
  (PMID:39073169) states that the eight postnatally ascertained patients
  "shared common clinical features including intellectual disability, agenesis
  of the corpus callosum, abnormal eye movement, and ataxia", and concludes for
  a role "in the pathogenesis of syndromic X-linked intellectual disability". A
  feature set shared across the whole cohort is what the non-syndromic class
  excludes.
sources:
- source_name: dismech genetics-gap campaign
  source_url: https://github.com/monarch-initiative/dismech/issues/12227
  source_identifier: MONDO:0975828
added_date: "2026-09-24"
mondo_parents:
- id: MONDO:0019181
  label: non-syndromic X-linked intellectual disability
genes:
- id: hgnc:11402
  label: SRPK3
notes: >-
  MONDO files this term under MONDO:0019181, non-syndromic X-linked
  intellectual disability, which contradicts the defining publication's own
  conclusion. Recorded as a MONDO disagreement in the parent entry's notes.
  SRPK3 has no ClinGen gene-disease validity curation, so an entry here should
  state the evidence base plainly: three independent families plus a knockout
  zebrafish model.

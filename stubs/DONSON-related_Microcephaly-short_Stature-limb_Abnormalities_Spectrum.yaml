mondo_id: MONDO:0035534
label: DONSON-related microcephaly-short stature-limb abnormalities spectrum
proposed_name: DONSON-Related_Microcephalic_Primordial_Dwarfism
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Listed entity of the ISDS Nosology of Genetic Skeletal Disorders (2023
  revision), group 21 "Primordial dwarfism and slender bone dysplasias", with
  no dismech entry. The group's other members are curated, so this is a
  coverage gap in an otherwise complete group rather than a new nomination.
synonyms:
- microcephaly-micromelia syndrome
- microcephaly, short stature, and limb abnormalities
- MISSLA
sources:
- source_name: isds-nosology-2023-group-21
  source_url: https://pubmed.ncbi.nlm.nih.gov/36779427/
  source_identifier: NOS 21-0200
  source_tags:
  - isds_group=21
added_date: "2026-08-27"
notes: >-
  ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
  PMID:36779427), group 21, NOS 21-0200 "Microcephalic osteodysplastic
  primordial dwarfism, or microcephaly-short stature-micromelia-limb
  abnormalities, DONSON-related" (AR, OMIM 251230 and 617604) - the row
  already lumps microcephaly-micromelia syndrome and MISSLA, which is why this
  stub points at the MONDO spectrum term rather than either leaf. The
  complication is that DONSON was subsequently established as the thirteenth
  Meier-Gorlin gene and is curated in kb/disorders/Meier-Gorlin_Syndrome.yaml.
  Decide whether this becomes its own entry or a has_subtypes entry on Meier-
  Gorlin before curating; either way the ISDS group is unchanged, since both
  rows are in group 21. Carries isds_skeletal_category:
  primordial_dwarfism_and_slender_bones when curated.

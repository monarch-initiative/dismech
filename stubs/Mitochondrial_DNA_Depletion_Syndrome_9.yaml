  label: SUCLG1
notes: "Proposed entry name SUCLG1-Related Mitochondrial DNA Depletion Syndrome (the GeneReviews title, matching the SUCLA2 entry). Biallelic SUCLG1 variants (alpha subunit shared by the ADP- and GTP-forming succinyl-CoA ligases) cause MTDPS9, the counterpart of the SUCLA2 disorder curated in SUCLA2-Related_Mitochondrial_DNA_Depletion_Syndrome; that entry is gene-specific, so SUCLG1 needs its own entry rather than a subtype row. Evidence: GeneReviews chapter PMID:28358460 (SUCLG1-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria), founding report PMID:17668387, 71-patient SUCLA2/SUCLG1 genotype-phenotype series PMID:26475597. ClinGen classifies SUCLG1 only against the lumped Leigh syndrome class (MONDO:0009723, Moderate), so no tier applies to MTDPS9 itself."

notes: >-
  The dominant PDE10A disease (heterozygous GAF-B variants, childhood-onset
  chorea with bilateral striatal T2 lesions, MONDO:0014835) is curated
  separately as kb/disorders/Striatal_Degeneration_Autosomal_Dominant_2.yaml.
  This recessive entity is biallelic PDE10A disease with infantile onset
  (PMID:27058446) and, per a later review of the two forms, developmental
  delay and a normal MRI (PMID:36805523). The boundary
  follows inheritance and phenotype rather than protein domain: a homozygous
  GAF-B variant (p.Asp295Asn) gives the recessive phenotype (PMID:36805523), so
  it belongs here.

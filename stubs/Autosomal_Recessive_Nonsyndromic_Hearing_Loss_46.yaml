notes: >-
  OUT_OF_SCOPE: DFNB46 is a mapped linkage locus, not a gene-resolved disease
  entity, so there is no molecular lesion for a dismech pathograph to start
  from.


  Evidence for that ruling, checked 2026-09-16. (1) NCBI's
  `mim2gene_medgen` (https://ftp.ncbi.nlm.nih.gov/gene/DATA/mim2gene_medgen)
  maps OMIM:609647 to GeneID `-` with no GeneMap source, i.e. OMIM records no
  gene for this phenotype. The three sibling concepts curated alongside it in
  this run all resolve in the same file (OMIM:619615 -> GeneID 79029, OMIM:614877
  -> GeneID 9409, OMIM:609508 -> GeneID 1280), so the blank is a fact about
  DFNB46 rather than a gap in the lookup. (2) MONDO's own definition for
  MONDO:0012327 states the material basis as a chromosome region, not a gene:
  "An autosomal recessive nonsyndromic deafness that has material basis in
  variation in the chromosome region 18p11.32-p11.31." (3) A PubMed search for
  `DFNB46` returns exactly one record, the original linkage study
  (PMID:15637723, Mir et al., Am J Med Genet A 2005), which reports a single
  five-generation Pakistani family, a maximum multipoint LOD of 3.8, and a
  three-unit support interval spanning 5.8 Mb. No gene-identification follow-up
  has been published in the 21 years since.


  A 5.8 Mb interval from one family is an identity claim about a chromosomal
  segment, not about a disease mechanism. An entry built on it could carry only
  the audiological phenotype and the linkage result; every pathophysiology node
  would have to be invented. This follows the ruling in PR #11466, which placed
  three gene-less dilated-cardiomyopathy loci out of scope on the same basis.


  Revisit if the gene is identified: at that point the right action is almost
  certainly to fold DFNB46 into whatever gene-named entry results, not to curate
  the locus label. Claim issue #11976.

mondo_id: MONDO:0029136
label: muscular dystrophy, limb-girdle, autosomal recessive 23
proposed_name: Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_23
status: OPEN
entry_type: SUBTYPE
priority: NORMAL
notes: >-
  Covered by kb/disorders/Congenital_Merosin-deficient_Muscular_Dystrophy_1A.yaml,
  which curates the LAMA2 spectrum including its milder limb-girdle end: the entry
  cites LGMDR23 cohorts (PMID:34281576) and records the limb-girdle presentation
  under its Partial deficiency subtype. Partial deficiency is an immunostaining
  category and LGMDR23 a clinical one, so the match is close rather than exact. No
  new disorder entry is needed; the umbrella concept, LAMA2-related muscular
  dystrophy (MONDO:0100228), is handled the same way.
rationale: Diagnostic delay impact; Insufficient ICD coding/underdiagnosis; Intervention potential; Multi-modal detectability; Phenotypic complexity
synonyms:
- LGMDR23
- laminin subunit alpha 2-related limb-girdle muscular dystrophy R23

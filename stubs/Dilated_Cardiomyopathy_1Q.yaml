notes: >-
  OUT_OF_SCOPE: a mapped locus with no identified gene, so there is no pathograph
  to build. This is not a judgement that the disease does not matter. It is that
  the molecular basis is unknown, and in a numbered DCM series every slot a
  dismech entry exists to carry follows from the gene.

  Three independent sources agree no causal gene is known. MONDO:0012364 records
  no RO:0004003 causal gene and defines the concept by chromosome band ("a
  dilated cardiomyopathy that has material basis in variation in the chromosome
  region 7q22.3-q31.1"), which is what the absent `genes:` list in this stub was
  already saying. MedGen 332088 returns an empty AssociatedGenes element. The
  HPO/JAX annotation network returns no gene for OMIM:609915.

  The concept rests on one linkage study, Schoenberger et al. 2005
  (PMID:16228230), a genome wide analysis in a single three generation pedigree
  with 16 individuals affected by dilated cardiomyopathy without additional
  phenotypes. It reports a 9.73 Mb interval between D7S2545 and D7S2554, maximum
  LOD 4.20, and states that the interval contains no known cytoskeletal genes.
  The gene was not identified. Searching Europe PMC for CMD1Q returns a single
  record, a 2013 gene card, and nothing has narrowed the interval since.

  Do not confuse this locus with GATAD1 at 7q21.2, which causes a separate
  recessive DCM entity (CMD2B) and lies outside the 7q22.3-q31.1 interval.

  So a dismech entry would restate the ontology record and stop: autosomal
  dominant inheritance, isolated dilated cardiomyopathy, and a `genetic` section
  naming a chromosome band. There is no molecular lesion, no cell type, no
  process, and no causal edge that could be written without inventing it.

  The stub is kept rather than deleted so the reasoning survives and
  `just seed-stubs` does not re-add the concept as UNDECIDED; setting entry_type
  is already enough to take it out of the queue, since `just next-stubs` only
  offers UNDECIDED and DISEASE stubs. Same treatment as
  Autosomal_Recessive_Nonsyndromic_Hearing_Loss_83 (#9591).

  Reopen if a gene is identified for the 7q22.3-q31.1 interval. See #9865 group A.

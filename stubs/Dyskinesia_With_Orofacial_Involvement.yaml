notes: >-
  SUBTYPE of the curated Paroxysmal_Dyskinesia entry, which carries an ADCY5
  subtype (display_name "ADCY5-related dyskinesia with orofacial involvement")
  modelling the striatal cAMP gain-of-function mechanism.

  Not deleted, deliberately. MONDO:0031115 is the parent spanning BOTH the
  autosomal dominant (MONDO:0800028) and autosomal recessive (MONDO:0030625)
  forms, and Paroxysmal_Dyskinesia binds only the AD child on its ADCY5
  subtype. Binding MONDO:0031115 as a disease-level skos:narrowMatch would
  therefore assert coverage of the AR arm, which the entry does not curate, so
  the stub is kept with the decision recorded here rather than retired by an
  overclaimed mapping. Because the ID is bound nowhere in kb/, deleting the
  stub outright would let the next `just seed-stubs` run recreate it verbatim
  as UNDECIDED and lose this judgement.

  Retire this stub when either the AR form is curated (making a disease-level
  narrowMatch honest) or MONDO:0031115 is otherwise bound in kb/.

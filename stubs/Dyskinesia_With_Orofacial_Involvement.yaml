notes: >-
  SUBTYPE of Paroxysmal_Dyskinesia. That entry already carries an `ADCY5`
  has_subtypes entry (display_name "ADCY5-related dyskinesia with orofacial
  involvement") bound to MONDO:0800028, the autosomal dominant descendant of
  this term. MONDO records two descendants here (MONDO:0800028 AD,
  MONDO:0030625 AR) which are inheritance variants of one ADCY5 disease rather
  than distinct entities, so the parent entry's single subtype is the right
  home. Curating a standalone entry would duplicate the ADCY5 cAMP/striatal
  pathograph already present. Found during the duplicate preflight for claim
  #9221; not claimed.

notes: >-
  SUBTYPE of Late_Complement_Component_Deficiency (MONDO:0015700). C5 deficiency
  is already curated there as the `C5 Deficiency` entry in `has_subtypes`, and it
  shares that entry's pathograph: biallelic loss of a terminal component ->
  failed C5b-9 membrane attack complex assembly -> loss of serum bactericidal
  activity against Neisseria. MONDO:0012295 is a direct child of MONDO:0015700.
  The one mechanism that is genuinely C5-specific -- loss of the C5a
  anaphylatoxin, which C6-C9 deficiencies retain -- is a single node's worth of
  difference and does not carry a separate conserved pathograph (#8727), so a
  standalone entry would duplicate the umbrella rather than add one. Resolved by
  binding MONDO:0012295 as the subtype's `subtype_term`; see issue #10777.

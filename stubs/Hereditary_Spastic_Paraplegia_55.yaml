notes: >-
  Same gene and same disease as Combined_Oxidative_Phosphorylation_Defect_Type_7
  (MONDO:0013306, biallelic truncating MTRFR). SPG55 has separate OMIM and MONDO
  identifiers only because OMIM 615035 was minted from a 2012 spastic paraplegia report
  while OMIM 613559 was minted from a 2010 encephalomyopathy report; both sit inside the
  same optic atrophy plus axonal neuropathy plus spastic paraparesis triad, and severity
  tracks truncation position rather than clinical label. Curated as the motor-predominant
  end of that entry, which carries MONDO:0014020 as a skos:narrowMatch mapping. Parent
  entry: Combined Oxidative Phosphorylation Defect Type 7.

notes: >-
  Declined from kb/disorders/KRT1_Keratinopathies.yaml during the genetics-gap
  pass for dismech#12265. MONDO attributes this class to KRT10 (hgnc:6413) in its
  OWL axioms, and the KRT1 entry that the gap list attributed it to covers the
  KRT1 allelic series only. It reached that entry because the entry bound
  MONDO:0007239 epidermolytic ichthyosis as its disease_term, a class whose direct
  children span both keratin genes; that binding is now a skos:broadMatch and this
  class is the KRT10 sibling of MONDO:0700249 epidermolytic hyperkeratosis 1.
  A KRT10 keratinopathy entry would also be the natural home for MONDO:0100303
  ichthyosis, annular epidermolytic 1, the KRT10 member of the annular series,
  which is likewise uncurated. The lump-or-split call between one KRT10 entry
  covering both and two separate entries is undecided.

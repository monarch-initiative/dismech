mondo_id: MONDO:0008575
label: nicotine dependence
proposed_name: Nicotine_Dependence
status: OPEN
entry_type: DISEASE
priority: HIGH
rationale: >-
  Tobacco use is the leading preventable cause of death worldwide and the KB has no nicotine use disorder entry. Several approved pharmacotherapies (nicotine replacement, varenicline, bupropion, cytisine) act on distinct, well-characterised mechanisms.
synonyms:
- nicotine addiction
- tobacco use disorder
sources:
- source_name: dismech substance use disorder coverage review
  source_identifier: MONDO:0008575
added_date: "2026-09-25"
mondo_parents:
- id: MONDO:0005303
  label: drug dependence
notes: >-
  Curate as a DISEASE with DSM-5 tobacco use disorder scope. The existing stub Tobacco_Addiction_Susceptibility_To (MONDO:0100460) is the susceptibility concept for the same condition; its CHRNA5-A3-B4 locus evidence belongs in this entry's genetic section.

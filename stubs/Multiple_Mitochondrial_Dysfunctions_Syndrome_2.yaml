mondo_id: MONDO:0013675
label: multiple mitochondrial dysfunctions syndrome 2
proposed_name: Multiple_Mitochondrial_Dysfunctions_Syndrome_2
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  One of the numbered forms of multiple mitochondrial dysfunctions syndrome. The
  causal gene is BOLA3 (OMIM 614299), resolved from NCBI mim2gene_medgen; MONDO
  records no causal gene for this term.
sources:
- source_name: dismech-stub-queue-mmds-grouping-review
  source_identifier: MONDO:0013675
added_date: "2026-09-04"
mondo_parents:
- id: MONDO:0017338
  label: fatal multiple mitochondrial dysfunctions syndrome
notes: >-
  Re-seeded when MONDO:0017338 was ruled a GROUPING rather than a single disease
  (see stubs/Fatal_Multiple_Mitochondrial_Dysfunctions_Syndrome.yaml). The
  earlier lump review had folded the MMDS1, MMDS2 and MMDS6 stubs into that one
  umbrella stub; reversing the lump means the numbered forms are the curatable
  units again, so all eight uncurated forms are listed rather than only the
  three that had been deleted. MMDS9B (MONDO:0971174, FDXR) is already curated
  and has no stub.

  BOLA3 partners NFU1 in [4Fe-4S] maturation, and MMDS2 is the form explicitly named 'with hyperglycinemia' in OMIM. Clinically closest of all the numbered forms to MMDS1, which is the pair a curator should decide about first: they may be the strongest candidate in the series for a single entry with per-gene subtypes.

  entry_type is left UNDECIDED on purpose. Deciding disease versus subtype is
  the next curator's first job, and for this series it is a real question: the
  neonatal Fe-S-scaffold forms may belong together as one entry with per-gene
  subtypes even though the series as a whole does not.

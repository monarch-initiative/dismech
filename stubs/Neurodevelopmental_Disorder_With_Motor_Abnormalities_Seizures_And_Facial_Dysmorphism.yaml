mondo_id: MONDO:0958231
label: neurodevelopmental disorder with motor abnormalities, seizures, and facial dysmorphism
proposed_name: Neurodevelopmental_Disorder_With_Motor_Abnormalities_Seizures_And_Facial_Dysmorphism
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Nominated from the dismech#12230 genetics pass over Autosomal_Dominant_Cerebellar_Ataxia_Type_I.
  MONDO files this term under autosomal dominant cerebellar ataxia type I (MONDO:0019792), but
  the term's own definition describes a de novo neurodevelopmental syndrome and makes no ADCA-I
  claim, so it was declined as a has_subtypes row on that entry rather than curated there. The
  defining study (PMID:29474920) separates this severe phenotype, PADDAS, from the milder
  adult-onset Pumilio1-related cerebellar ataxia, which MONDO curates separately as
  spinocerebellar ataxia 47 (MONDO:0033482). Curating this concept needs a lump/split decision
  on whether the two PUM1 phenotypes belong in one entry.
synonyms:
- PUM1-associated developmental disability-ataxia-seizure syndrome
- PADDAS

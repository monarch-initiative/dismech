added_date: "2026-09-17"
notes: >-
  OUT_OF_SCOPE: MONDO:0005550 is the root of MONDO's infectious-disease branch,
  a class too abstract to carry a mechanism. Any pathophysiology node written
  for it is true of every infection and specific to none, which is exactly what
  rule R5 of the granularity ladder forbids an entry's nodes from being. Under
  design decisions §3e rung 0 (rule R2) such an abstraction is recorded as an
  out-of-scope stub and is never a Disease entry; `viral infectious disease`
  and `bacterial infectious disease` get the same treatment if nominated.
  Infectious-disease mechanism lives at rung 2, the named clinical entity
  (cholera, Legionnaires' disease, Buruli ulcer), and in rung-1 groupings.

  The former entry kb/disorders/Infectious_Disease.yaml (184 lines: three
  generic host-response nodes headed by "Pathogen Invasion and Replication",
  two generic treatments, a 21-item references list with no findings, and one
  GEO dataset) was retired on this basis under issue #10115 in the same PR that
  added this stub. Its history records remain in
  history/disorders/Infectious_Disease/ with target.superseded_by pointing at
  this file.

  The stub is kept rather than deleted so the reasoning survives and
  `just seed-stubs` does not re-add the concept as UNDECIDED. Setting
  entry_type already takes it out of the queue: `just next-stubs` offers only
  UNDECIDED and DISEASE stubs, and `just tidy-stubs` sweeps a stub only when
  its term is obsolete or a kb/ entry or grouping maps it, so this file stays
  until somebody maps MONDO:0005550 on purpose. Same treatment as
  Dilated_Cardiomyopathy_1K and Autosomal_Recessive_Nonsyndromic_Hearing_Loss_83.

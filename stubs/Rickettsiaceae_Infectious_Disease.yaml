proposed_name: Rickettsiaceae_Infectious_Disease
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Dashboard CURATE_ROOT_WITH_SUBTYPES row for Rickettsiaceae infectious disease
  highlighted this human infectious-disease candidate; the MONDO ID is not covered by a
  committed disorder, grouping, or stub, so adding a stub keeps this infectious-disease
  gap visible for a future lump/split decision.
notes: >-
  This is a taxonomic parent over spotted-fever and typhus rickettsioses. Compare
  committed Spotted_Fever_Rickettsiosis, Murine_Typhus, Scrub_Typhus, Rickettsialpox,
  Indian_Tick_Typhus, Israeli_Tick_Typhus, Queensland_Tick_Typhus, Siberian_Tick_Typhus,
  Rickettsia_Helvetica_Spotted_Fever, Rickettsia_Parkeri_Spotted_Fever, and
  Epidemic_Typhus; then compare the Rickettsiosis, Typhus, Rickettsial_Pneumonia, and
  Rickettsia_Conorii_Infectious_Disease stubs before deciding grouping scope.

notes: >-
  OUT_OF_SCOPE: a mapped locus with no identified gene, so there is no pathograph
  to build. This is not a judgement that the disease does not matter. It is that
  the molecular basis is unknown, and in a numbered DCM series every slot a
  dismech entry exists to carry follows from the gene.

  Three independent sources agree no causal gene is known. MONDO:0011567 records
  no RO:0004003 causal gene and defines the concept by chromosome band ("a
  dilated cardiomyopathy that has material basis in variation in the chromosome
  region 6q12-q16"), which is what the absent `genes:` list in this stub was
  already saying. MedGen 381354 returns an empty AssociatedGenes element. The
  HPO/JAX annotation network returns no gene for OMIM:605582.

  The concept rests on one linkage study, Sylvius et al. 2001 (PMID:11085912), a
  genome wide search in a single French family with 9 individuals affected by the
  pure form of autosomal dominant DCM. It reports a 16.4 cM region between
  D6S1627 and D6S1716, maximum pairwise LOD 3.52. The paper explicitly excludes
  its own three positional candidates (phospholamban, malic enzyme 1 soluble, and
  laminin alpha 4) and proposes no replacement. Searching Europe PMC for CMD1K
  returns three records in total, none of which identifies a gene.

  One of those excluded candidates is worth reading carefully. Phospholamban does
  cause DCM, and dismech curates it as Dilated_Cardiomyopathy_1P, but this very
  paper is the source that rules PLN out for the 6q12-q16 family. So CMD1K is not
  a duplicate of the curated PLN entry; it is a separate, still unsolved interval.

  So a dismech entry would restate the ontology record and stop: autosomal
  dominant inheritance, isolated dilated cardiomyopathy, and a `genetic` section
  naming a chromosome band. There is no molecular lesion, no cell type, no
  process, and no causal edge that could be written without inventing it.

  The stub is kept rather than deleted so the reasoning survives and
  `just seed-stubs` does not re-add the concept as UNDECIDED; setting entry_type
  is already enough to take it out of the queue, since `just next-stubs` only
  offers UNDECIDED and DISEASE stubs. Same treatment as
  Autosomal_Recessive_Nonsyndromic_Hearing_Loss_83 (#9591).

  Reopen if a gene is identified for the 6q12-q16 interval. See #9865 group A.

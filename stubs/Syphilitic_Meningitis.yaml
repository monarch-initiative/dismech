rationale: >-
  Dashboard CURATE_ROOT row for syphilitic meningitis highlighted this human
  infectious-disease candidate; the MONDO ID is not covered by a committed
  disorder, grouping, or stub, so adding a stub keeps this bacterial infection
  visible for a future lump/split decision.
notes: >-
  Syphilis.yaml already models syphilitic meningitis as a rare neurological
  manifestation of syphilis. Decide whether this MONDO concept should be a
  has_subtypes row on that entry or stay covered as a manifestation. MONDO's
  gram-negative bacterial-meningitis parent is its own classification; avoid
  copying that framing into a Treponema entry.

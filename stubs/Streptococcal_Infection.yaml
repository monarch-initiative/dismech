rationale: >-
  Dashboard CURATE_ROOT_WITH_SUBTYPES row for streptococcal infection highlighted this
  human infectious-disease candidate; the MONDO ID is not covered by a committed disorder,
  grouping, or stub, so adding a stub keeps this infectious-disease gap visible for a

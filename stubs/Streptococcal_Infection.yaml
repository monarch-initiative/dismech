notes: >-
  This is a broad Streptococcus parent spanning pyogenic, pneumococcal, and toxin-mediated
  diseases. Compare committed Erysipelas, Streptococcal_Meningitis,
  Streptococcal_Pharyngitis, Pneumococcal_Meningitis, Pneumococcal_Pneumonia, and
  Toxic_Shock_Syndrome plus the Streptococcal_Pneumonia stub and open streptococcal
  focal-disease stubs before deciding whether to curate it as a grouping.

mondo_id: MONDO:0009318
label: Hallermann-Streiff syndrome
proposed_name: Hallermann-Streiff_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Listed entity of the ISDS Nosology of Genetic Skeletal Disorders (2023
  revision), group 21 "Primordial dwarfism and slender bone dysplasias", with
  no dismech entry. The group's other members are curated, so this is a
  coverage gap in an otherwise complete group rather than a new nomination.
synonyms:
- HSS
- Francois dyscephalic syndrome
- Hallermann-Streiff-Francois syndrome
- oculomandibulodyscephaly with hypotrichosis
sources:
- source_name: isds-nosology-2023-group-21
  source_url: https://pubmed.ncbi.nlm.nih.gov/36779427/
  source_identifier: NOS 21-0070
  source_tags:
  - isds_group=21
added_date: "2026-08-27"
notes: >-
  ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
  PMID:36779427), group 21, NOS 21-0070 "Hallermann-Streiff syndrome" (OMIM
  234100). It is the only group-21 row with neither an inheritance mode nor a
  gene printed - the committee lists the entity as clinically recognized but
  genetically unresolved. That makes it a mechanism-light entry: expect the
  pathophysiology section to be thin and say so, rather than importing a
  speculative gene. Carries isds_skeletal_category:
  primordial_dwarfism_and_slender_bones when curated.

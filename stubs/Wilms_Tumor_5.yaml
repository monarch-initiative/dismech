notes: >-
  BLOCKED on evidence, not on effort. The searches run on 2026-09-26: the PubMed
  query POU6F2 AND Wilms returns four records in total, the most recent published in
  2016; the ClinGen gene validity CSV downloaded that day carries no POU6F2 row
  among its 3,685 assertions; and the 2020 Human Molecular Genetics review of Wilms
  tumor predisposition (PMID:32412586) states which genes the current account
  covers, namely WT1, the 11p15 locus, CTR9, REST and TRIM28, without POU6F2. The
  attribution traces to PMID:15459955, whose own conclusion is that the observations
  "suggest that the gene is a tumor suppressor and is involved in hereditary
  predisposition to WT". Whoever picks this up should either find replication
  published since or propose the attribution for upstream review; curating a
  mechanism from what is indexed today would not be supportable. Recorded in the
  differential diagnoses of kb/disorders/Wilms_Tumor.yaml as investigated and not
  supported.

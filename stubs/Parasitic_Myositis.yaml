notes: >-
  GROUPING per the infectious-disease ladder (design decisions section 3e): an
  organ syndrome (myositis) caused by unrelated parasites with distinct
  mechanisms, helminthic (trichinellosis, muscle cysticercosis) and protozoal
  (sarcocystosis, toxoplasmic myositis). MONDO's two descendants are
  trichinellosis and its Trichinella spiralis species stratum, which is a
  single disease, so grouping membership should come from the organism axis
  rather than the MONDO subtree. Candidate members: Taeniasis_Cysticercosis
  and Toxoplasmosis (kb/disorders; Toxoplasmosis records tissue cysts in
  skeletal muscle, Taeniasis_Cysticercosis does not yet describe muscle
  involvement), and Trichinellosis and Sarcocystosis (stubs, both still
  UNDECIDED). Neither trichinellosis nor sarcocystosis has a kb/disorders
  entry yet.

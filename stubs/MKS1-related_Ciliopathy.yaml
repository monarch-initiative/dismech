notes: >-
  GROUPING, not a disease entry. MKS1-related ciliopathy is a gene-centred
  umbrella over three diseases MONDO lists as descendants: Meckel syndrome
  type 1, Bardet-Biedl syndrome 13 and Joubert syndrome 28. Each is already
  covered: MKS1 is a genetic record and mechanism node in Meckel_Syndrome, a
  genetic record in Bardet-Biedl_Syndrome, and Joubert syndrome 28 is a
  subtype in Joubert_syndrome. Curating the umbrella as a disorder would
  duplicate all three, and a gene umbrella is not used as a single entry's
  name. Any union belongs in kb/groupings/ (the Ciliopathies grouping already
  spans these).

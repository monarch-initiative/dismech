notes: >-
  Declined as a has_subtypes row under
  Autosomal_Dominant_Non-Syndromic_Intellectual_Disability and proposed as a standalone
  entry instead. MONDO asserts this class as a direct subclass of MONDO:0015802 and
  defines it as any autosomal dominant non-syndromic intellectual disability caused by
  a mutation in MEF2C. Three things argue against treating it as one row in that
  series. It has its own GeneReviews chapter (PMID:39666846, MEF2C-Related Disorder),
  and searching the committed Bookshelf index by gene symbol and by disease label found
  no dedicated chapter for any other gene-defined class in that series; the Coffin-Siris
  syndrome chapter the index carries is for the umbrella entity, not for the
  ARID2-defined class. Its MONDO label is a syndrome description rather
  than an MRD number, naming hypotonia, stereotypic hand movements and impaired
  language, so the class does not present as isolated cognitive impairment. And ClinGen
  curates MEF2C against complex neurodevelopmental disorder (MONDO:0100038) as
  Definitive rather than against any non-syndromic concept
  (CGGV:assertion_34354e8f-4343-4fba-82ba-e49579e504bb-2019-02-06T110000.000Z; the
  cache file for that assertion is not committed here because no KB entry cites it
  yet, so fetch it with `just clingen-rebuild --id` before quoting it).
  MEF2C is already cited on two dismech entries -
  Neurodevelopmental_Disorder_with_Central_Hypotonia_and_Dysmorphic_Facies carries this
  exact MONDO term as a differential_diagnoses record, and Double_Outlet_Right_Ventricle
  binds the gene - so a curator should read both before starting, and should decide
  whether the contiguous-gene 5q14.3 deletion mechanism belongs in the same entry as
  the intragenic loss-of-function variants.

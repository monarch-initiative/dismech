mondo_id: MONDO:0015797
label: UV-sensitive syndrome
proposed_name: UV-Sensitive_Syndrome
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  One clinical entity (mild cutaneous photosensitivity without the
  neurodegeneration of Cockayne syndrome); all three numbered forms disrupt
  the same process, transcription-coupled nucleotide excision repair (ERCC6,
  ERCC8, UVSSA).
sources:
- source_name: dismech-stub-queue-lump-review
  source_identifier: MONDO:0015797
added_date: "2026-08-28"
notes: >-
  Lumped stub replacing the seeded stubs UVSS1 (MONDO:0010909, ERCC6), UVSS2
  (MONDO:0013829, ERCC8), and UVSS3 (MONDO:0013834, UVSSA). One entry with
  per-gene detail; the mechanistically interesting content is the shared
  TC-NER defect and the contrast with allelic Cockayne syndrome, which is
  already curated.

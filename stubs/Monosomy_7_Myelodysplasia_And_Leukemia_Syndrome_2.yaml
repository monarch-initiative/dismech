notes: >-
  Declined as a has_subtypes row on kb/disorders/Myelodysplastic_Syndrome.yaml
  while working dismech#12264, on the same grounds as its sibling
  MONDO:0009646: the class is not a child of MONDO:0018881, its only
  hierarchical parent is MONDO:0044645 familial monosomy 7 syndrome, and that
  parent's MONDO definition describes increased risk for myelodysplastic
  syndrome rather than myelodysplastic syndrome itself.


  entry_type is left UNDECIDED for the same reason as the sibling stub: whether
  the two M7MLS classes become separate disorder entries or has_subtypes rows on
  one Familial_Monosomy_7_Syndrome entry is an open lump/split call.

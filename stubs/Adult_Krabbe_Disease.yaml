notes: >-
  SUBTYPE of Krabbe Disease (kb/disorders/Krabbe_Disease.yaml, disease_term
  MONDO:0009499, which is this stub's own MONDO parent). Adult-onset Krabbe is
  the same GALC deficiency driving the same psychosine-mediated demyelination
  the parent already curates; it is an onset stratum, not a distinct pathograph,
  so it does not warrant its own disorder file.

  Recorded with a caveat, and deliberately NOT deleted. The parent has no
  has_subtypes block at all. It represents the adult form as a `progression`
  phase ("Adult Onset", age_range ">16 years"), and a progression phase is not
  a has_subtypes entry -- arguably it is the wrong axis, since the infantile,
  late-infantile/juvenile and adult forms are alternative presentations a
  patient has one of, not phases a patient passes through. Nothing in kb/ binds
  MONDO:0016091 as a subtype_term or mondo_mapping, so deleting this stub would
  let the next `just seed-stubs` run recreate it verbatim as UNDECIDED and lose
  this judgement (the same reasoning recorded on
  Dyskinesia_With_Orofacial_Involvement.yaml).

  Adding a lone has_subtypes record for the adult form was considered and
  rejected. GeneReviews (PMID:20301416, already cited by the parent) classifies
  Krabbe disease as infantile-onset versus later-onset -- "onset of
  manifestations after age 12 months and as late as the seventh decade" -- and
  does not treat adult Krabbe disease as a separately named entity, so a single
  "Adult Onset" subtype would assert a boundary the source does not draw while
  sitting asymmetrically beside two unmodelled sibling onset forms.

  Retire this stub when the parent's three onset forms are converted from
  `progression` phases to `has_subtypes` records with MONDO:0016091 bound as
  the subtype_term on the adult one.

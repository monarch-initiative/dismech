notes: >-
  SUBTYPE of Histoplasmosis (MONDO:0018312, stubs/Histoplasmosis.yaml). Under
  the infectious-disease ladder (design decisions section 3e) infection with
  Histoplasma capsulatum and histoplasmosis are the same named clinical
  entity, so this species-level term is not a union of separately named
  diseases and does not warrant a Grouping. Of its MONDO children,
  histoplasmosis meningitis and histoplasmosis retinitis are organ
  manifestations of that one disease and belong as has_subtypes rows or
  phenotypes of the Histoplasmosis entry (whether presumed ocular
  histoplasmosis is active infection or a later immune-mediated process is a
  question for that entry). African histoplasmosis (H. capsulatum var.
  duboisii) is the one candidate for a separate stratum, and should be
  assessed against the section 3e promotion axes when Histoplasmosis is
  curated.

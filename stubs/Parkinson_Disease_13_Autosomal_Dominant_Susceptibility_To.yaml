notes: >-
  OUT_OF_SCOPE: a susceptibility term whose gene claim has been refuted. The
  HTRA2 G399S and A141S variants reported in German patients (PMID:15961413)
  were found in neurologically normal controls with no association
  (PMID:18364387), and the GEO-PD consortium found no association in 6,378 cases
  and 8,880 controls (PMID:20036034). Recorded on the Parkinsons_Disease entry
  as a `genetic:` row with `relationship_type: REFUTED` and the evidence cited
  there; no subtype row. ClinGen classifies HTRA2 only for 3-methylglutaconic
  aciduria type 8 (checked 2026-11-10).

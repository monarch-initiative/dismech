priority: LOW
rationale: >-
  Found by enumerating the hierarchical descendants of MONDO:0005045 in OLS4 on
  2026-09-25 while working the series-045 genetics pass (dismech#12252). It is
  the only member of the numbered hypertrophic cardiomyopathy series with neither
  a Disease entry nor a stub, so it was added for queue completeness.
notes: >-
  The TRIM63 gene-disease claim itself is already curated on the
  Hypertrophic_Cardiomyopathy parent entry, including both ClinGen curations of
  it (autosomal dominant Disputed, autosomal recessive Moderate), so nothing
  about TRIM63 is uncurated. What is missing is a Disease entry bound to this
  MONDO term, which is how the KB models the rest of the numbered series
  (nineteen Hypertrophic_Cardiomyopathy_* entries plus
  ALPK3-Related_Hypertrophic_Cardiomyopathy and
  KLHL24-Related_Hypertrophic_Cardiomyopathy). Deciding whether a separate entry
  is warranted for a gene whose dominant relationship ClinGen disputes is the
  first job here.

notes: >-
  X-linked recessive disorder of affected males caused by hypomorphic,
  temperature-sensitive NSDHL alleles (PMID:21129721), allelic to the
  X-linked dominant, male-lethal CHILD syndrome caused by NSDHL loss of
  function, which kb/disorders/CHILD_Syndrome.yaml curates and which cites
  the CK study only to contrast the two. Further families: PMID:25900314,
  PMID:34091503, PMID:36331250; GeneReviews NSDHL-Related Disorders
  (PMID:21290788). ClinGen classifies NSDHL for CK syndrome at Moderate (XL).
  No entry curates the disease; a separate entry or an NSDHL-related grouping
  with CHILD syndrome is the open decision.

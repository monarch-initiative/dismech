proposed_name: Bartonellosis
status: OPEN
entry_type: GROUPING
priority: NORMAL
rationale: >-
  Dashboard CURATE_ROOT_WITH_SUBTYPES row for bartonellosis highlighted this
  broad_parent infectious-disease candidate; adding a stub keeps this concept
  visible for a future lump/split decision.
notes: >-
  Bartonellosis is a grouping rather than one conserved disease-level
  pathograph because it spans multiple Bartonella syndromes, including
  Oroya fever and verruga peruana from Bartonella bacilliformis, trench
  fever from Bartonella quintana, and cat-scratch disease and bacillary
  angiomatosis from Bartonella henselae.

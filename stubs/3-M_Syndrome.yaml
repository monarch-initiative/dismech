mondo_id: MONDO:0007477
label: 3-M syndrome
proposed_name: 3-M_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Listed entity of the ISDS Nosology of Genetic Skeletal Disorders (2023
  revision), group 21 "Primordial dwarfism and slender bone dysplasias", with
  no dismech entry. The group's other members are curated, so this is a
  coverage gap in an otherwise complete group rather than a new nomination.
synonyms:
- 3-MSBN
- 3M syndrome
- Yakut short stature syndrome
- Le Merrer syndrome
- gloomy face syndrome
sources:
- source_name: isds-nosology-2023-group-21
  source_url: https://pubmed.ncbi.nlm.nih.gov/36779427/
  source_identifier: NOS 21-0010, NOS 21-0020, NOS 21-0030
  source_tags:
  - isds_group=21
added_date: "2026-08-27"
notes: >-
  ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
  PMID:36779427), group 21 "Primordial dwarfism and slender bone dysplasias":
  three rows, NOS 21-0010 (CUL7, OMIM 273750), NOS 21-0020 (OBSL1, 612921) and
  NOS 21-0030 (CCDC8, 614205). The nosology splits by gene; the lump/split
  call for dismech is whether one 3-M entry covering all three genes is right,
  as Seckel_Syndrome and Meier-Gorlin_Syndrome already do for their groups, or
  whether the CUL7/OBSL1/CCDC8 phenotypes diverge enough to split. Carries
  isds_skeletal_category: primordial_dwarfism_and_slender_bones when curated.

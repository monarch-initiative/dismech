mondo_id: MONDO:0005109
label: HIV infectious disease
proposed_name: HIV_Infectious_Disease
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Nominated because kb/modules/viral_integrase_inhibition.yaml has no conformer, and
  cannot have one: the module models reverse transcription, integrase strand transfer
  and establishment of the integrated provirus, which is a step unique to the
  retroviruses, and no retroviral infection is curated in kb/. The KB has no HIV entry
  at all, which also leaves viral_latency_reservoir_persistence resting on a single
  herpesvirus conformer rather than on the reservoir biology it was written for.
sources:
- source_name: dismech-orphan-module-census
  source_url: https://github.com/monarch-initiative/dismech/issues/11575
  source_identifier: MONDO:0005109
  source_tags:
  - orphan_module=viral_integrase_inhibition
added_date: "2026-10-08"
notes: >-
  Large scope, so the entry_type decision matters more than usual: acute infection,
  chronic infection and AIDS-defining illness are phases rather than entities under
  the granularity ladder, and the opportunistic infections and HIV-associated
  neoplasms are separate diseases that cross-link rather than subtypes.

mondo_id: MONDO:0009191
label: Lowry-Wood syndrome
priority: NORMAL
notes: >-
  The third RNU4ATAC phenotype (multiple epiphyseal dysplasia with microcephaly
  and nystagmus). It is the only MONDO descendant of RNU4ATAC spectrum disorder
  (MONDO:0100558) without a dismech entry. Once curated it should join the
  RNU4ATAC_Spectrum_Disorder grouping as a DISEASE member. Key source is
  PMID:29265708, which reports biallelic RNU4ATAC variants in three patients.

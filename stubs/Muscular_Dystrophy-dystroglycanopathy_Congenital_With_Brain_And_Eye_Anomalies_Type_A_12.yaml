notes: >-
  SUBTYPE of Dystroglycanopathy. That entry already carries an `MDDG12 (POMK)`
  has_subtypes entry, one of twenty gene-anchored subtypes covering the
  alpha-dystroglycan O-mannosylation series (MDDG1-14 plus the DPM arms). POMK
  phosphorylates O-mannose on the core M3 glycan, a prerequisite for LARGE1 to
  generate the functional matriglycan, and that mechanism is curated in the
  parent. A standalone entry would duplicate it. Found during the duplicate
  preflight for claim #9222; not claimed.

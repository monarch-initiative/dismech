notes: >-
  GROUPING, not a disease entry. MONDO:0002479 is the cross-gonadal umbrella over
  Sertoli-Leydig cell tumor, and the members that carry distinct mechanisms are already
  curated separately. Malignant ovarian SLCT has its own entry bound to MONDO:0020542,
  built on the DICER1 RNase IIIb hotspot chain (issue #9002, PR #9133). The testicular
  side sits under Testicular_Sex_Cord_Stromal_Neoplasm (MONDO:0003125), which carries
  Leydig cell tumor (MONDO:0003124) as a has_subtypes entry and references testicular
  Sertoli cell tumor (MONDO:0020808). Curating MONDO:0002479 as a disorder would
  duplicate those and would have to assert one pathograph across claims the KB
  deliberately keeps apart: per the scope note on the malignant ovarian entry, DICER1
  variants are confined to the moderately/poorly differentiated and retiform tumors,
  an 18-case series found well-differentiated SLCT both DICER1 and FOXL2 wild-type, and
  the two gonads are different organs. Well-differentiated SLCT is the one residual gap,
  and it cannot be anchored today: MONDO has no term for it (OLS search returns nothing),
  so there is no identifier to bind. Note also that the single descendant recorded above,
  MONDO:0000379, has been obsoleted by MONDO ("out of scope -
  MONDO:excludeHistoricalDisease") with no replacement, so this term has no live
  descendants; the enrichment pass predates that retirement. If the union is wanted as a
  browsable object it belongs in kb/groupings/ under the curate-grouping skill, but
  kb/groupings/Ovarian_Sex_Cord-Stromal_Tumors.yaml already covers the ovarian axis, so
  a new grouping would need to justify itself against that one. Dispositioned while
  working claim issue #11566.

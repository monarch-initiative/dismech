  label: SYNJ1
notes: 'SYNJ1 (synaptojanin-1) uncoats clathrin-coated vesicles during synaptic vesicle endocytosis. Its
  other allelic disorder, early-onset Parkinson disease 20 (MONDO:0014233), is already the PARK20 subtype
  of Parkinsons_Disease; a dedicated SYNJ1 entry could carry both phenotypes as subtypes. Overlap: #12213
  (open, d2g genetics pass) lists this disease for a has_subtypes row on Genetic_Developmental_and_Epileptic_Encephalopathy.
  Decide between that row alone and a dedicated entry before curating. Precedent for both at once: STXBP1
  is a subtype row there and also kb/disorders/STXBP1_Encephalopathy.yaml, and synaptic-vesicle-cycle
  gene entries (DNM1_Encephalopathy, SNAP25_Encephalopathy, SYT1_Baker-Gordon_Syndrome) conform to kb/modules/synaptic_vesicle_cycle.yaml.'

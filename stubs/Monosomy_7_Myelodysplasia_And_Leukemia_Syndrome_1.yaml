mondo_id: MONDO:0009646
label: monosomy 7 myelodysplasia and leukemia syndrome 1
proposed_name: Monosomy_7_Myelodysplasia_And_Leukemia_Syndrome_1
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  SAMD9L-related germline predisposition to bone marrow failure with monosomy 7,
  myelodysplastic syndrome and acute myeloid leukemia. Nominated as a structural
  decline while working dismech#12264, which listed it as a subtype to curate
  under kb/disorders/Myelodysplastic_Syndrome.yaml.
synonyms:
- myelodysplasia and leukemia syndrome with monosomy 7
- M7MLS1
- chromosome 7Q deletion
- monosomy 7 of bone marrow
- myelodysplasia and leukaemia syndrome with monosomy 7
sources:
- source_name: dismech-genetics-gap-campaign
  source_url: https://github.com/monarch-initiative/dismech/issues/12264
  source_identifier: MONDO:0009646
added_date: "2026-09-27"
mondo_parents:
- id: MONDO:0044645
  label: familial monosomy 7 syndrome
genes:
- id: hgnc:1349
  label: SAMD9L
notes: >-
  Declined as a has_subtypes row on kb/disorders/Myelodysplastic_Syndrome.yaml
  while working dismech#12264. That entry is the somatic myelodysplastic
  syndrome and its disease_term MONDO:0018881 is the correct anchor for it, but
  this class is not a child of MONDO:0018881: its only hierarchical parent is
  MONDO:0044645 familial monosomy 7 syndrome, whose own MONDO definition reads
  "a rare neoplastic disease characterized by infantile to childhood onset of
  evidence of bone marrow insufficiency/failure associated with increased risk
  for myelodysplastic syndrome or acute myeloid leukemia". That is germline
  predisposition, which the cancer granularity ladder in CLAUDE.md keeps
  separate from the somatic entry it predisposes to. MONDO nonetheless files
  MONDO:0044645 under MONDO:0018881, which is how this concept reached the
  somatic entry's gap list.


  entry_type is left UNDECIDED because the open call is whether this and
  MONDO:0030801 become two gene-defined disorder entries or two has_subtypes
  rows on a single Familial_Monosomy_7_Syndrome entry bound to MONDO:0044645.

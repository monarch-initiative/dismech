mondo_id: MONDO:0032763
label: immunodeficiency 62
proposed_name: Immunodeficiency_62
status: OPEN
notes: >-
  Curated as a standalone Disease entry. IMD62 is a single-gene Mendelian entity
  (ARHGEF1, 19q13.2, autosomal recessive) with its own OMIM phenotype number
  (618459) and its own IUIS inborn-errors-of-immunity row, sitting in a run of
  numbered immunodeficiency entries already curated individually in this
  knowledge base. Its only MONDO parent is the broad grouping
  MONDO:0021094 immunodeficiency disease, so it is neither a subtype of a
  curated entry nor itself a grouping.
entry_type: DISEASE
priority: NORMAL
rationale: Diagnostic delay impact; Insufficient ICD coding/underdiagnosis
synonyms:
- IMD62

notes: >-
  Declined from
  kb/disorders/Inclusion_Body_Myopathy_with_Paget_Disease_of_Bone_and_Frontotemporal_Dementia.yaml
  during the genetics-gap pass for dismech#12265. MONDO files this class under
  MONDO:0000507, and that parentage is what put it on the gap list for the IBMPFD
  entry, but the class denotes a different clinical entity: its own label names
  brain white matter abnormalities rather than the Paget disease of bone or
  frontotemporal dementia that define IBMPFD, and its OMIM cross-reference,
  OMIM:619733, sits outside the IBMPFD OMIM series. The GeneReviews chapter for
  IBMPFD names HNRNPA1, HNRNPA2B1 and VCP as the genes whose heterozygous variants
  establish the diagnosis; searching the cached chapter,
  references_cache/PMID_20301649.md, for ANXA11, annexin and white matter returns
  no match for any of the three. ANXA11 itself is already curated in dismech, as
  the ALS23 subtype row of kb/disorders/Amyotrophic_Lateral_Sclerosis.yaml bound to
  MONDO:0027694, which is also the only disease ClinGen has a gene-disease validity
  assertion for this gene against in the committed
  cache/clingen/gene_validity.csv snapshot (Definitive, autosomal dominant). So the
  open question for this stub is whether MONDO:0850514 warrants its own entry or
  belongs as a further ANXA11 subtype row alongside ALS23, not whether it belongs
  on the IBMPFD entry.

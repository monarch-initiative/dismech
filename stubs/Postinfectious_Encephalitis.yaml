status: OPEN
entry_type: GROUPING
priority: NORMAL
rationale: >-
  Dashboard CURATE_ROOT_WITH_SUBTYPES row for postinfectious encephalitis
  highlighted this broad_parent infectious-disease candidate; adding a stub
  keeps this concept visible for a future lump/split decision.
notes: >-
  Postinfectious encephalitis is an immune-mediated mechanism/timing class
  after infection rather than a single pathogen- or lesion-defined disease with
  one conserved pathograph. Keep this as a grouping for named child CNS
  syndromes such as encephalitis lethargica and Bickerstaff brainstem
  encephalitis, then curate a child only when it has a conserved mechanism or
  agent-specific infectious granularity.

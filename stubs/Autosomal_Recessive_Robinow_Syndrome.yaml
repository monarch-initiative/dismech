notes: >-
  Robinow syndrome, autosomal recessive 2 (MONDO:0032800, NXN) was a separate
  seeded stub, folded here in the stub-queue lump/split review: the classic
  ROR2 form and the NXN form disrupt the same noncanonical WNT5A/planar-cell-
  polarity axis (NXN acts on dishevelled) and share one clinical entity, so
  curate a single autosomal recessive entry with per-gene detail - the
  mirror image of the Autosomal_Dominant_Robinow_Syndrome lump.

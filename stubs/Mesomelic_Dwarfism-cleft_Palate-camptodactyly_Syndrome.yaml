mondo_id: MONDO:0009589
label: mesomelic dwarfism-cleft palate-camptodactyly syndrome
proposed_name: Mesomelic_Dwarfism-cleft_Palate-camptodactyly_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: LOW
rationale: >-
  Row NOS 15-0130 of ISDS Nosology 2023 group 15 (mesomelic and rhizo-mesomelic
  dysplasias), MIM 249710, autosomal recessive. The second of the two rows in
  that group with no gene assigned in the nosology table.
synonyms:
- mesomelic dysplasia, Kozlowski-Reardon type
- mesomelic dwarfism-cleft palate-camptodactyly syndrome
added_date: "2026-08-27"
notes: >-
  Queued during the group-15 review that curated the other fifteen rows of the
  group. Deliberately not curated in that pass: the nosology assigns no gene, so
  a dismech entry would carry a phenotype list and no mechanism. Priority is LOW
  for the same reason — revisit if a molecular basis is published. The MONDO
  label used here is the descriptive one (mesomelic dwarfism-cleft palate-
  camptodactyly syndrome); the eponym appears in the synonyms.

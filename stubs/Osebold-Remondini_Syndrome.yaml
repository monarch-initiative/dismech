mondo_id: MONDO:0007219
label: Osebold-Remondini syndrome
proposed_name: Osebold-Remondini_Syndrome
status: OPEN
entry_type: UNDECIDED
priority: LOW
rationale: >-
  Completes the ISDS 2023 nosology group 16 (acromesomelic dysplasias) in the
  curation queue. It is the only group-16 entity with no molecular basis.
synonyms:
- brachydactyly type A6
- BDA6
- brachymesophalangy with mesomelic short limbs and carpal and tarsal osseous abnormalities
mondo_parents:
- id: MONDO:0019696
  label: acromesomelic dysplasia
added_date: "2026-08-27"
notes: >-
  Listed in ISDS 2023 nosology group 16 as an autosomal dominant acromesomelic
  dysplasia (OMIM 112910) that is not yet associated with a genomic locus. The
  published literature is four papers from 1985-1993 describing a single kindred
  and a differential-diagnosis exchange; no causal gene, and therefore no
  mechanism, has been reported. A dismech Disease entry would have no
  pathophysiology to curate, so this is deliberately left in the queue rather
  than curated as a thin entry. Revisit if a locus is identified.

notes: >-
  GROUPING, not a Disease entry. "Progeroid syndrome" is an over-broad category
  spanning mechanistically incompatible diseases that merely share accelerated
  somatic ageing: LMNA/progerin toxicity (Hutchinson-Gilford), BANF1
  (Nestor-Guillermo), RECQL2/WRN helicase loss (Werner), nucleotide-excision
  repair failure (Cockayne, XFE/ERCC1), POLR3A (Wiedemann-Rautenstrauch), and
  POLD1 (MDP). There is no single conserved pathograph to curate, so this fails
  the one-disease-one-mechanism test in CLAUDE.md and #8727.

  Several members are already curated as separate Disease files —
  Hutchinson-Gilford_Progeria_Syndrome, Nestor-Guillermo_progeria_syndrome, and
  Cockayne_Syndrome — which is the correct shape. Remaining work is to write
  kb/groupings/Progeroid_Syndromes.yaml over those entries, most plausibly with
  grouping_basis SHARED_PHENOTYPE (premature ageing) rather than a shared
  mechanism, since the DNA-repair and nuclear-lamina routes are distinct. Note
  the cellular_senescence module is the shared downstream convergence point and
  is the natural conformance target for members, not a defining criterion for
  the grouping. Delete this stub when that grouping lands.

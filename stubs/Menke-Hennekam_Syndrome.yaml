mondo_id: MONDO:0020774
label: Menke-Hennekam syndrome
proposed_name: Menke-Hennekam_Syndrome
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  One clinical entity caused by exon 30/31 missense variants in the paralogous
  acetyltransferases CREBBP (MKHK1) and EP300 (MKHK2), deliberately
  distinguished from Rubinstein-Taybi syndrome.
sources:
- source_name: dismech-stub-queue-lump-review
  source_identifier: MONDO:0020774
added_date: "2026-08-28"
notes: >-
  Lumped stub replacing the seeded stubs Menke-Hennekam syndrome 1
  (MONDO:0020763, CREBBP) and 2 (MONDO:0020769, EP300). The paralog pair has
  one shared mechanism and one phenotype; curate a single entry with per-gene
  detail, keeping the boundary with Rubinstein-Taybi (different variant class
  in the same genes) explicit.

notes: >-
  GROUPING, not one disease. The 8 MONDO descendants recorded in this stub's own
  mondo_descendants list span three enzymatically distinct disorders: glutaryl-CoA
  dehydrogenase deficiency / GA1 (MONDO:0009281, GCDH, hgnc:4189); multiple
  acyl-CoA dehydrogenase deficiency / GA2 (MONDO:0009282, ETFA/ETFB/ETFDH),
  together with its five severity and complementation-group children
  (MONDO:0018332, MONDO:0018333, MONDO:0700073, MONDO:0700074, MONDO:0700076);
  and glutaric acidemia type 3 (MONDO:0009283), a separate enzyme defect again.
  GA1 and GA2 share little beyond the urinary metabolite that named them --
  different pathways, different pathographs, different treatment.

  Both of the curatable arms are already separate disorder entries:
  kb/disorders/Glutaryl-CoA_Dehydrogenase_Deficiency.yaml (MONDO:0009281) and
  kb/disorders/Multiple_Acyl-CoA_Dehydrogenase_Deficiency.yaml (MONDO:0009282).
  That split is itself the evidence that MONDO:0000129 is a union rather than an
  entity. Do not curate it as a kb/disorders entry.

  Not deleted, and priority dropped to LOW -- the same call made on
  Mucopolysaccharidosis_Type_1.yaml. No dismech object claims MONDO:0000129:
  there is no kb/groupings entry for it and no exact/narrow mondo_mapping binds
  it, so deleting this file would let `just seed-stubs` recreate it as
  UNDECIDED. The biology is already covered by the two entries above; what
  remains is the bookkeeping question of whether a small
  kb/groupings/Glutaric_Acidurias entry over them is worth writing. Writing one
  is real grouping curation (membership criteria, differentiating mechanisms,
  evidence) and was out of scope for this decision pass. GA3 (MONDO:0009283) is
  uncurated and would be its third member.

  Retire this stub when MONDO:0000129 is bound by a kb/groupings entry or by an
  exact/narrow mondo_mapping on a disorder entry.

mondo_id: MONDO:0010456
label: renal cell carcinoma, Xp11-associated
proposed_name: Renal_Cell_Carcinoma_Xp11-associated
status: OPEN
entry_type: UNDECIDED
priority: NORMAL
rationale: >-
  Nominated from the series-060 genetics pass (dismech#12267), where it appeared on
  the checklist of kb/disorders/Renal_Cell_Carcinoma.yaml. MONDO records TFE3 as its
  causal gene in an OWL axiom and files it under MONDO:0017886 MIT family
  translocation renal cell carcinoma, a WHO-recognised molecularly defined entity.
  Nothing in kb/ binds MONDO:0010456 or MONDO:0017886, so the concept has no home.
synonyms:
- renal cell carcinoma, papillary, 1
- RCCX1
mondo_parents:
- id: MONDO:0003008
  label: hereditary renal cell carcinoma
- id: MONDO:0017886
  label: MIT family translocation renal cell carcinoma
genes:
- id: hgnc:11752
  label: TFE3
added_date: "2026-09-27"
notes: >-
  Granularity call still to make. Under design decision 3a this looks like an L3
  molecularly defined entity, which would take its own Disease entry rather than a
  has_subtypes row, and the covering parent would be MONDO:0017886 rather than the
  renal cell carcinoma pool. Note that one of MONDO's two asserted parents,
  MONDO:0003008 hereditary renal cell carcinoma, is a poor fit for a somatic
  translocation tumour, and that class also carries four children whose own
  definitions place them outside renal cell carcinoma.

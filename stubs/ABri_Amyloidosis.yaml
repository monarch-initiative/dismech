mondo_id: MONDO:0008306
label: ABri amyloidosis
proposed_name: ABri_Amyloidosis
status: OPEN
entry_type: DISEASE
priority: NORMAL
rationale: >-
  Sibling of the already-curated ADan_amyloidosis entry: the other ITM2B
  stop-codon amyloidosis, with its own amyloid peptide (ABri) and its own
  clinical picture. Nominated while reconciling the MONDO genetics gap list for
  Cerebral_Amyloid_Angiopathy (dismech#12277).
synonyms:
- ABri amyloidosis
- Bri amyloidosis
- FBD
- cerebral amyloid angiopathy, British type
- cerebral amyloid angiopathy, ITM2B-related, type 1
- dementia familial British
- familial dementia, British type
- presenile dementia with spastic ataxia
added_date: "2026-09-27"
mondo_parents:
- id: MONDO:0005620
  label: cerebral amyloid angiopathy
- id: MONDO:0018591
  label: ITM2B amyloidosis
mondo_descendant_count: 0
genes:
- id: hgnc:6174
  label: ITM2B
notes: >-
  Ruled a separate Disease entry rather than a has_subtypes row on
  Cerebral_Amyloid_Angiopathy, for consistency with its sibling: the other ITM2B
  amyloidosis, ADan amyloidosis (MONDO:0007297), is a Disease entry
  (kb/disorders/ADan_amyloidosis.yaml) and already names ABri amyloidosis in its
  differential_diagnoses. Both ITM2B diseases are dementia syndromes in which the
  angiopathy is one component beside parenchymal plaque and neurofibrillary
  pathology, and ABri adds prominent spastic tetraparesis; that is a wider
  phenotype than the Cerebral_Amyloid_Angiopathy pathograph models. MONDO agrees
  on the sibling relation: MONDO:0008306 and MONDO:0007297 are both direct
  children of MONDO:0005620 and of MONDO:0018591. The entry should carry the
  ITM2B lesion, the ABri peptide, and the ADan/ABri contrast.

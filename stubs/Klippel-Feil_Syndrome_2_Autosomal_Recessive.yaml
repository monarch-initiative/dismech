notes: >-
  SUBTYPE of Klippel-Feil_Syndrome. Note the parent has no `has_subtypes`
  block: the MEOX1-related recessive form is not a listed subtype there, it is
  the entry's core curated mechanism -- the description, inheritance block and
  pathophysiology are all built on biallelic MEOX1 loss of function, and the
  entry states explicitly that the MEOX1-related form is KFS2 (OMIM 214300).
  So this concept is already covered, more thoroughly than a subtype entry
  would cover it. A curator wanting cleaner structure could add an explicit
  `has_subtypes` entry to the parent, but that is tidying, not missing
  content. Found during the duplicate preflight for claim #9223; not claimed.

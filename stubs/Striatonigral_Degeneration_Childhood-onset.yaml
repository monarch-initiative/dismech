notes: >-
  Nominated while working the genetics gap list for Multiple_System_Atrophy, which is
  where MONDO's hierarchy sends this concept: MONDO:0014889 sits under striatonigral
  degeneration (MONDO:0003122), itself a child of multiple system atrophy
  (MONDO:0007803). It does not belong on that entry. MONDO records VAC14 as the causal
  gene in the term's OWL axioms, MONDO's other parent for it is inherited dystonia, and
  OMIM:617054 describes a childhood-onset disorder, all of which put it outside a
  sporadic adult-onset disease. Its closest sibling under MONDO:0003122, autosomal
  dominant striatal degeneration (MONDO:0000211), is curated in this knowledge base as
  its own Disease entry, which is the precedent this nomination follows. The VAC14
  gene-disease claim has not been researched here and should be established from
  primary literature and ClinGen when the entry is curated rather than taken from this
  stub.

mondo_id: MONDO:0005186
label: cocaine dependence
proposed_name: Cocaine_Dependence
status: OPEN
entry_type: DISEASE
priority: HIGH
rationale: >-
  No stimulant use disorder is curated. Cocaine use disorder has no approved pharmacotherapy, so its mechanism (dopamine transporter blockade and the downstream adaptations of the addiction cycle) is the main route to candidate treatments. Contingency management is the best-supported intervention.
synonyms:
- cocaine addiction
sources:
- source_name: dismech substance use disorder coverage review
  source_identifier: MONDO:0005186
added_date: "2026-09-25"
mondo_parents:
- id: MONDO:0005303
  label: drug dependence
notes: >-
  Distinct from Cocaine_Intoxication, which covers acute toxicity (cardiovascular and seizure) rather than the chronic use disorder. Cocaine abuse (MONDO:0004456) is a candidate has_subtypes entry or a skos:closeMatch.

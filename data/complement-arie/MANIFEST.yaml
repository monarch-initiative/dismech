# Snapshot manifest for the Complement-ARIE Landscape Analysis Q&A export.
#
# The NIH Common Fund Complement-ARIE Landscape Analysis (report dated
# 29 Feb 2024) put 19 questions to a corpus of ~3,000 papers. The free-text
# answers read as model-generated summaries; the export itself does not say
# how they were produced. Its Tableau dashboard exports the answers as one row
# per (paper, question).
#
# The export is ~128 MB, over GitHub's per-file limit, so it is not committed
# (GitHub rejects the push); it is pinned here by sha256. The derived files
# below are not committed either, and are never hand-edited; all are
# gitignored. Download the export from source_url, then run
#     just complement-arie-parse
# which checks the download against the sha256 below before parsing.
#
# Edge cases handled by the parser (see its docstring):
#   - 20 "Author et al. YEAR (NA)" keys group several papers (DOI and abstract
#     read "*"); listed with merged_key=1, their 380 answers left out.
#   - The Abstract column does not always line up with its row; it is not
#     carried forward. Fetch abstracts by PMID or DOI.
#   - UTF-8 text read as Windows-1252, up to three times over; converted back.
#   - 28 titles hold the PDF's first-page text (journal citation, DOI,
#     "REVIEW ARTICLE", "Check for updates"); moved to title_page_header with
#     title left empty. Take the title from the PMID or DOI. One further title
#     carries a journal logo prefix, removed by a per-paper rule.
#   - 294 keys have NA for every question; marked no_content=1.
#   - Every row has Answer-simple "yes", so the export appears filtered to
#     answered questions: a missing (paper, question) pair is not a "no".
report_pdf: https://commonfund.nih.gov/sites/commonfund/files/Complement-ARIE-Landscape-Analysis-29-Feb-2024-508.pdf
# Tableau Public dashboard, "Explore Questions" view; the CSV is its
# "Q&A-Question Details" data download.
source_url: https://public.tableau.com/app/profile/complement.arie/viz/Complement-ARIELandscapeAnalysis_17029296896540/ExploreQuestions
export_file: "Q&A-Question Details_data.csv"
export_format: UTF-16LE, tab-separated, quoted multi-line fields
downloaded: "2026-10-30"

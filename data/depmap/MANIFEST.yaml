# Pinned snapshot of DepMap-derived synthetic-lethality / selective-dependency
# relationships.
#
# DepMap (the Cancer Dependency Map, Broad Institute) publishes genome-scale
# CRISPR knockout dependency screens across ~1,000+ cancer cell lines. This
# source does NOT ingest the multi-hundred-MB CRISPRGeneEffect matrix directly;
# like the CIViC source it ingests a **derived, line-oriented TSV**
# (`depmap_synthetic_lethality.tsv`) in which each row is one
# context-conditioned dependency observation. That TSV is produced by a separate
# differential-dependency derivation step from a pinned DepMap release (see
# docs/depmap-source.md); the derivation script is a tracked follow-up.
#
# `just depmap-refresh` verifies the pinned TSV's sha256 (when set). The TSV is
# gitignored; this manifest is the reproducible source pin used to rebuild
# references_cache/DEPMAP_*.md.
#
# To pin a DepMap release:
#   1. Produce depmap_synthetic_lethality.tsv from the release matrix
#      (differential dependency between context-positive/negative models)
#   2. `sha256sum data/depmap/depmap_synthetic_lethality.tsv`
#   3. Fill `sha256`, `size_bytes`, `release`, `snapshot_date`, and `doi` below
#   4. `just depmap-rebuild` and review the references_cache/DEPMAP_*.md diff

source: DepMap (Cancer Dependency Map)
# Broad DepMap public release the derived TSV is computed from. Bump on refresh.
release: "DepMap Public 24Q2"
snapshot_date: "2024-05-01"
schema_tag: "depmap-sl-v1"
license: "CC BY 4.0"
# DepMap release DOI (figshare) — fill with the exact release DOI when pinning.
doi: ""

bulk_files:
  - name: depmap_synthetic_lethality.tsv
    # No stable public URL: this TSV is derived locally from the pinned
    # release matrix. Leave url empty until a hosted derived artifact exists;
    # `refresh` then only verifies a locally-produced file's checksum.
    url: ""
    sha256: ""
    size_bytes: 0
    description: >-
      Derived long-format DepMap synthetic-lethality / selective-dependency
      TSV (one context-conditioned dependency observation per row).

# Pinned snapshot of DepMap-derived synthetic-lethality / selective-dependency
# relationships.
#
# DepMap (the Cancer Dependency Map, Broad Institute) publishes genome-scale
# CRISPR knockout dependency screens across ~1,000+ cancer cell lines. This
# source does NOT ingest the multi-hundred-MB CRISPRGeneEffect matrix directly;
# like the CIViC source it ingests a **derived, line-oriented TSV**
# (`depmap_synthetic_lethality.tsv`) in which each row is one
# context-conditioned dependency observation. That TSV is produced by
# `scripts/derive_depmap_synthetic_lethality.py`, which streams the pinned
# release files below (verifying their md5) and computes, per
# dependency_gene × genomic-context hypothesis, the differential CRISPR
# gene-effect between context-positive and context-negative models.
#
# `just depmap-refresh` verifies the derived TSV's sha256 (below). The raw
# release files and the derived TSV are gitignored; this manifest is the
# reproducible source pin, and the DEPMAP_*.md cache files are committed.
#
# To bump to a newer DepMap release:
#   1. Update `derived_from` (release name, figshare article/file ids, md5s)
#      here AND in scripts/derive_depmap_synthetic_lethality.py::RELEASE
#   2. `uv run python scripts/derive_depmap_synthetic_lethality.py`
#   3. `sha256sum data/depmap/depmap_synthetic_lethality.tsv` → update `sha256`
#      and `size_bytes` below
#   4. `just depmap-rebuild` and review the references_cache/DEPMAP_*.md diff

source: DepMap (Cancer Dependency Map)
release: "DepMap Public 24Q4"
snapshot_date: "2024-12-10"
schema_tag: "depmap-sl-v1"
license: "CC BY 4.0"
doi: "10.25452/figshare.plus.27993248.v1"

# Provenance: the raw DepMap release files the derivation streams (gitignored,
# never committed). Pinned by figshare file id + md5.
derived_from:
  figshare_article: "27993248"
  files:
    - name: CRISPRGeneEffect.csv
      figshare_file_id: "51064667"
      md5: "6edf7ade09b9b34199210b559d4745d3"
    - name: OmicsSomaticMutations.csv
      figshare_file_id: "51065732"
      md5: "7bdba347a1602fe96d5654a74d6e52f1"

bulk_files:
  - name: depmap_synthetic_lethality.tsv
    # No stable public URL: derived locally by
    # scripts/derive_depmap_synthetic_lethality.py from the release files above.
    url: ""
    sha256: "1971af33afc813062aebe775cd571029171d4ffa9a36114e580decccd88a869c"
    size_bytes: 532
    description: >-
      Derived long-format DepMap synthetic-lethality / selective-dependency
      TSV (one context-conditioned dependency observation per row).

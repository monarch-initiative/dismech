# Manifest for the NCIT ontology-edge structured source.
#
# This source does NOT cache the whole NCI Thesaurus. It selects a small set
# of curated predicates out of the OAK-managed `sqlite:obo:ncit` database and
# renders one quotable per-subject cache file (references_cache/NCIT_*.md) for
# each subject that carries one of those predicates.
#
# The ontology SQLite is downloaded/managed by OAK (semsql); it is never
# committed. This manifest only pins the ontology version for provenance and
# drift detection, plus the predicate selection.
#
# See src/dismech/structured_sources/ontology_edges.py and CLAUDE.md.

source: ncit-edges
prefix: NCIT
adapter: sqlite:obo:ncit
ontology_name: NCI Thesaurus
ontology_short: NCIT
ontology_version: "26.02d"
snapshot_date: "2026-06-26"
homepage: https://ncithesaurus.nci.nih.gov/ncitbrowser/
license: >-
  NCI Thesaurus is released under terms that permit reuse with attribution
  (https://evsexplore.semantics.cancer.gov/evsexplore/welcome).

predicates:
  # Accepted_Therapeutic_Use_For: free-text disease/condition for which the
  # subject drug is an accepted treatment. Range xsd:string -> annotation.
  - id: NCIT:P302
    label: Accepted_Therapeutic_Use_For
    kind: annotation

  # Cell-of-origin relations. NCIT states these inside owl:equivalentClass
  # intersections (`Disease_Has_Normal_Cell_Origin some <cell>`), so they are
  # object properties -> kind: relation, and in semsql they are read from the
  # materialized `edge` table rather than from raw `statements`.
  #
  # These are the authority side of the derivation in
  # scripts/check_cancer_origin.py: dismech derives the cell of origin from its
  # own pathograph, and NCIT independently asserts one per disease, so the two
  # can be compared. NCIT names its own classes (Mature B-Lymphocyte,
  # Pluripotent Bone Marrow Stem Cell), NOT CL terms, so the comparison is a
  # cross-check and a lookup aid -- never a binding target. `cell_types` stays
  # bound to CL (CellTypeTerm is reachable_from CL:0000000 alone).
  - id: NCIT:R104
    label: Disease_Has_Normal_Cell_Origin
    kind: relation
  - id: NCIT:R112
    label: Disease_May_Have_Normal_Cell_Origin
    kind: relation
  # The transformed cell state, from the NCIT Abnormal Cell branch
  # (NCIT:C12913). Complements R104: R104 says what the disease came from,
  # R105 says what it is now (DLBCL: Mature B-Lymphocyte -> Neoplastic Large
  # B-Lymphocyte). CL has almost nothing at this level -- only the generic
  # CL:0001063 neoplastic cell and CL:0001064 malignant cell, which is why an
  # entry needing "H3 K27M-mutant glioma cell" has to bind the generic term.
  - id: NCIT:R105
    label: Disease_Has_Abnormal_Cell
    kind: relation

# Pinned IMPC data release used to build references_cache/IMPC_MGI_*.md.
#
# The International Mouse Phenotyping Consortium publishes per-release CSV
# reports under all-data-releases/release-<n>/results/. Unlike most sources in
# data/, these URLs are versioned, so a pin here does not go stale on its own.
#
# `just impc-refresh` downloads the three reports to data/impc/ and verifies
# their sha256. The reports are gitignored; this manifest is the reproducible
# pin.
#
# To move to a newer IMPC release:
#   1. Change `release-25.0` in the three URLs and `data_release` below
#   2. `just impc-refresh --repin` (records the new checksums and date)
#   3. `just impc-rebuild` and review the references_cache/IMPC_*.md diff
#
# IMPC content is licensed CC BY 4.0
# (https://www.mousephenotype.org/about-impc/terms-of-use/).

source: IMPC
data_release: "25.0"
snapshot_date: "2026-11-13"
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/


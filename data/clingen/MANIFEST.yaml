# Pinned snapshot of the ClinGen Gene-Disease Validity CSV.
#
# `just clingen-refresh` downloads the CSV to data/clingen/gene_validity.csv
# and verifies its sha256 against the pinned value below. The CSV itself is
# not required to be committed; this manifest is the reproducible source pin
# used to rebuild references_cache/CGGV_*.md.
#
# NOTE the `url` is UNVERSIONED: it always serves the current ClinGen release,
# so this checksum stops matching whenever ClinGen publishes. That is expected
# drift, not a corrupt download (issue #10081).
#
# To bump to a newer ClinGen release:
#   just clingen-refresh --repin   # rewrites sha256/size/snapshot_date below
#   just clingen-rebuild           # then review BOTH diffs before committing
#
# Do not hand-edit the checksum; `--repin` records what was actually downloaded.

source: ClinGen Gene-Disease Validity
snapshot_date: "2026-08-13"
schema_tag: "gene_validity.csv"

bulk_files:
  - name: gene_validity.csv
    url: https://search.clinicalgenome.org/kb/gene-validity/download
    sha256: ef5280c848d7219353f017276ceb6411dcae06d4ba62f6bf1a243a49d36e8502
    size_bytes: 1116856
    description: ClinGen Gene-Disease Validity Curations CSV

# Pinned snapshot of the ClinGen Gene-Disease Validity CSV, for gene pages.
#
# The same CSV is also pinned in data/clingen/MANIFEST.yaml, which drives the
# quotable references_cache/CGGV_*.md files that KB evidence cites. The two
# pins are kept separate on purpose: moving the citation pin rewrites hundreds
# of cache files (`just clingen-rebuild`), while this one only changes
# kb/genes/ingest/clingen_gene_validity.tsv. Gene pages show the classification
# and link to ClinGen; they never stand in for a CGGV: citation.
#
# `just genes-ingest-refresh` downloads the CSV here (gitignored) and verifies
# the sha256 below. The URL is UNVERSIONED, so the checksum stops matching
# whenever ClinGen publishes. To accept a new release:
#   just genes-ingest-refresh --repin
#   just genes-ingest-build      # then review both diffs together

source: ClinGen Gene-Disease Validity (gene pages)
snapshot_date: "2026-10-03"
schema_tag: "gene_validity.csv"

bulk_files:
  - name: gene_validity.csv
    url: https://search.clinicalgenome.org/kb/gene-validity/download
    sha256: e05943eb769968925d8eac7dc8894516444fa4f676efcde9879e921bb3c9b573
    size_bytes: 1127611
    description: ClinGen Gene-Disease Validity Curations CSV

# Pinned snapshot of the STRchive loci catalog (STRchive-loci.json).
#
# STRchive (https://strchive.org) is a centralized, actively maintained catalog
# of the tandem-repeat (TR / short-tandem-repeat, STR) loci that cause human
# disease when they expand. Each locus record carries the repeat motif, the
# benign / intermediate / pathogenic repeat-count thresholds, genomic
# coordinates on three reference builds (hg38 / hg19 / T2T-chm13), the disease,
# inheritance mode, molecular mechanism, age of onset, prevalence, and disease-
# ontology cross-references (OMIM / MONDO / Orphanet / MedGen / GARD).
#
# `just strchive-refresh` downloads the pinned JSON to data/strchive/ and
# verifies its sha256. The bulk file is gitignored; this manifest is the
# reproducible source pin used to rebuild references_cache/STRCHIVE_*.md.
#
# To bump to a newer STRchive snapshot:
#   1. Download the current data/STRchive-loci.json from the STRchive repo
#   2. Update the url, sha256, strchive_version, and snapshot_date below
#   3. `just strchive-rebuild` and review the references_cache/STRCHIVE_*.md diff

source: STRchive
strchive_version: "2.1.0"
snapshot_date: "2026-07-23"

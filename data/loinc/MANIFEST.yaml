# Pinned source for LOINC third-party copyright notices.
#
# The Monarch KG serves LOINC codes and Long Common Names (used for term
# validation through the OAK monarch adapter) but drops LOINC's
# EXTERNAL_COPYRIGHT_NOTICE field. The Tuva Project publishes the full LOINC
# table, including that field, as a public data asset. `just
# loinc-copyright-notices` downloads it, verifies the sha256 below, and writes
# cache/loinc/external_copyright_codes.csv and
# cache/loinc/external_copyright_notices.csv. The table itself is not committed.
#
# To move to a newer Tuva data asset: change `url`, run
#   just loinc-copyright-notices --repin
# and review the manifest and cache diffs together. The LOINC notice's year
# range ("1995-2025") is hard-coded in NOTICE, cache/loinc/README.md and
# src/dismech/templates/_loinc_notice.html.j2; update all three when it changes.
#
# LOINC is copyright Regenstrief Institute, Inc. and the LOINC Committee;
# see NOTICE.


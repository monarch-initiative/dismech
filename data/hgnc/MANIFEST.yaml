# Pinned snapshot of the HGNC complete gene set.
#
# `just genes-ingest-refresh` downloads the file to data/hgnc/ and verifies its
# sha256 against the pin below. The file itself is gitignored; the rows the KB
# uses are written to kb/genes/ingest/hgnc.tsv by `just genes-ingest-build`.
#
# The `url` is UNVERSIONED: HGNC republishes it as genes are approved and
# renamed, so this checksum stops matching on every HGNC release. That is
# expected drift, not a corrupt download. To accept a new release:
#   just genes-ingest-refresh --repin   # rewrites sha256/size/snapshot_date
#   just genes-ingest-build             # then review both diffs together
#
# Licence: HGNC data are freely available without restriction
# (https://www.genenames.org/about/license/).

source: HGNC complete set
snapshot_date: "2026-10-24"

bulk_files:
  - name: hgnc_complete_set.txt
    url: https://storage.googleapis.com/public-download-files/hgnc/tsv/tsv/hgnc_complete_set.txt
    sha256: 12363916be36f8f6f91879b0faade4eeaac973722de7136ec61329b77f2c2f91
    size_bytes: 16982321
    description: HGNC approved human gene symbols, names and cross-references (TSV)

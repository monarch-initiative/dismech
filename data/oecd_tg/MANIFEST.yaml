# Pinned OECD Test Guideline PDFs behind the paragraph indexes in
# `data/oecd_tg/*-paragraphs.json`.
#
# The PDFs themselves are NOT committed. This manifest is the durable pin, so the
# index can be rebuilt and checked against the same bytes it was built from:
#
#   uv run python scripts/extract_oecd_tg.py <pdf> --out data/oecd_tg/tg442d-paragraphs.json
#   uv run python scripts/check_tg_extraction.py --index data/oecd_tg/tg442d-paragraphs.json
#
# A guideline is revised under the same number, and the OECD iLibrary DOI resolves to
# the current edition rather than to the edition recorded here. So a checksum mismatch
# usually means a new adoption, not a corrupt download. Treat it as a revision: record
# the new `sha256` and `adopted` date and re-extract, rather than editing the checksum
# to make an old index validate.
#
# License: OECD Guidelines for the Testing of Chemicals are published under
# CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Quoted guideline text in
# this repository is attributed to the OECD; see NOTICE.

guidelines:
- id: OECD TG 442D
  filename: TG_442_In_vitro_skin_sensitisation.pdf
  title: >-
    Test No. 442D: In Vitro Skin Sensitisation: Assays addressing the Adverse Outcome
    Pathway Key Event on Keratinocyte activation
  # The guideline's own suggested citation, printed on its page 2.
  citation: >-
    OECD (2026), Test No. 442D: In Vitro Skin Sensitisation: Assays addressing the
    Adverse Outcome Pathway Key Event on Keratinocyte activation, OECD Guidelines for
    the Testing of Chemicals, Section 4, OECD Publishing, Paris.
  doi: 10.1787/9789264229822-en
  url: https://doi.org/10.1787/9789264229822-en
  adopted: '2026-07-02'
  declassified: '2026-06-15'
  section: 'Section 4: Health effects'
  sha256: 7c8cf491665a06dfd7371bd093e14509a98e1b7268db46652768f99479cc2bd1
  size_bytes: 3242477
  pages: 98
  retrieved_date: '2026-11-02'
  index: tg442d-paragraphs.json
  # The edition this one replaced. Recorded because the DOI above resolves to whatever
  # edition is current, so it cannot cite the pinned text -- the sha256 is the only
  # durable identifier either edition has here. Downloaded and checked directly: 49
  # pages against 98, Appendices IA and IB only, and subtitled "ARE-Nrf2 Luciferase Test
  # Method" where the current edition is subtitled "Assays addressing the Adverse
  # Outcome Pathway Key Event on Keratinocyte activation". The title broadened when the
  # guideline stopped being luciferase-only.
  supersedes:
  - id: OECD TG 442D
    title: >-
      Test Guideline No. 442D: In Vitro Skin Sensitisation: ARE-Nrf2 Luciferase Test
      Method
    adopted: '2022-06-30'
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2024/10/replaced-and-deleted-test-guidelines-2024/TG-442D-keratinocyte-activation-2022.pdf
    sha256: 56739831d88d3b81f3158fed0c3dc24ec44246a80cc62fc97db635c04126cb0c
    pages: 49
    verified_date: '2026-11-04'
    methods:
    - appendix: IA
      name: KeratinoSens™
    - appendix: IB
      name: LuSens
  # The appendix each test method is described in. The guideline numbers paragraphs
  # from 1 again in every appendix, so the index keys a paragraph by both.
  #
  # `added_in` is NOT extracted from the guideline. Neither the PDF front matter nor any
  # in-scope paragraph carries a revision history, so an edition's own text cannot say
  # which of its methods are new -- a question asked of this work on 2026-11-04, and
  # answered at first by inference rather than from a source. Each value below is
  # sourced instead from the OECD commenting round that proposed the appendix, whose
  # title states whether it proposed a new appendix or an update to an existing one;
  # `basis` records which. Read these as provenance, not as quoted guideline facts:
  # tg442d-methods.json is the quoted layer.
  methods:
  - appendix: IA
    name: KeratinoSens™
    added_in: '2015'
    basis: >-
      Present in the 2022 edition pinned under `supersedes`, which is the earliest
      edition checked here; 2015 is the guideline's first adoption and is not verified
      from a document in this repository.
  - appendix: IB
    name: LuSens
    added_in: before '2022-06-30'
    basis: Present in the 2022 edition pinned under `supersedes`.
  - appendix: IC
    name: EpiSensA
    added_in: after '2022-06-30', before '2026-07-02'
    basis: >-
      Absent from the 2022 edition. Not new in this one either: the commenting round
      that added Epi2SensA proposed it as an update to the existing Appendix IC, which
      is EpiSensA's, and its draft carries a 2024 OECD copyright line. The intervening
      edition itself has not been pinned here.
  - appendix: IC
    name: Epi2SensA
    added_in: '2026-07-02'
    basis: >-
      Proposed as an update to Appendix IC in the commenting round of 2025-12-18 to
      2026-02-05; peer review ENV/CBC/MONO(2026)13, 2026-06-29.
    consultation: https://www.oecd.org/en/events/public-consultations/2025/12/commenting-round-on-the-epiderm-epidermal-sensitisation-assay-epi2sensa-proposed-as-an-update-to-appendix-c-episensa-in-test-guideline-442d.html
  - appendix: ID
    name: α-Sens®
    added_in: '2026-07-02'
    basis: >-
      Proposed for inclusion as a new Appendix ID in a commenting round of November
      2025, so the appendix did not previously exist.

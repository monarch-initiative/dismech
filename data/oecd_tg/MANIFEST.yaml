# Pinned OECD Test Guideline PDFs behind the paragraph indexes in
# `data/oecd_tg/*-paragraphs.json`.
#
# The PDFs themselves are NOT committed. This manifest is the durable pin, so the
# index can be rebuilt and checked against the same bytes it was built from:
#
#   uv run python scripts/extract_oecd_tg.py <pdf> --out data/oecd_tg/tg442d-paragraphs.json
#   uv run python scripts/check_tg_extraction.py --index data/oecd_tg/tg442d-paragraphs.json
#
# A guideline is revised under the same number, and the OECD iLibrary DOI resolves to
# the current edition rather than to the edition recorded here. So a checksum mismatch
# usually means a new adoption, not a corrupt download. Treat it as a revision: record
# the new `sha256` and `adopted` date and re-extract, rather than editing the checksum
# to make an old index validate.
#
# License: OECD Guidelines for the Testing of Chemicals are published under
# CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Quoted guideline text in
# this repository is attributed to the OECD; see NOTICE.

guidelines:
- id: OECD TG 442D
  filename: TG_442_In_vitro_skin_sensitisation.pdf
  title: >-
    Test No. 442D: In Vitro Skin Sensitisation: Assays addressing the Adverse Outcome
    Pathway Key Event on Keratinocyte activation
  # The guideline's own suggested citation, printed on its page 2.
  citation: >-
    OECD (2026), Test No. 442D: In Vitro Skin Sensitisation: Assays addressing the
    Adverse Outcome Pathway Key Event on Keratinocyte activation, OECD Guidelines for
    the Testing of Chemicals, Section 4, OECD Publishing, Paris.
  doi: 10.1787/9789264229822-en
  url: https://doi.org/10.1787/9789264229822-en
  adopted: '2026-07-02'
  declassified: '2026-06-15'
  section: 'Section 4: Health effects'
  sha256: 7c8cf491665a06dfd7371bd093e14509a98e1b7268db46652768f99479cc2bd1
  size_bytes: 3242477
  pages: 98
  retrieved_date: '2026-11-02'
  index: tg442d-paragraphs.json
  # The appendix each test method is described in. The guideline numbers paragraphs
  # from 1 again in every appendix, so the index keys a paragraph by both.
  methods:
  - appendix: IA
    name: KeratinoSens™
  - appendix: IB
    name: LuSens
  - appendix: IC
    name: EpiSensA
  - appendix: IC
    name: Epi2SensA
  - appendix: ID
    name: α-Sens®

# Pinned commit of ai4curation/ai-gene-review.
#
# ai-gene-review holds an AI-assisted review of each gene's Gene Ontology
# annotations, keyed on the UniProt accession, with a prose description of the
# gene's normal function and its `core_functions` as GO terms. dismech ingests
# only that function layer, for human genes the KB names; the per-annotation
# reviews and deep-research files stay upstream and are linked, not copied.
#
# `just genes-ingest-refresh` sparse-checks-out the `*-ai-review.yaml` files at
# the commit below into data/ai-gene-review/repo/ (gitignored). To move to the
# upstream branch head:
#   just genes-ingest-refresh --repin   # rewrites commit and snapshot_date
#   just genes-ingest-build             # then review both diffs together
#
# The content is AI-generated. dismech shows it as a labelled outside source on
# gene pages and never cites it as evidence in a KB entry.

source: ai-gene-review

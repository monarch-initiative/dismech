# Provenance for the cached ToxCast/Tox21 assay-endpoint annotations.
#
# Unlike the other pinned data sources this records no sha256. The
# EPA CTX API serves whatever invitroDB release is current and
# exposes no version endpoint, so there is no stable upstream
# artifact to pin. The release is reported per record by
# `bioactivity/data/aed/search/by-dtxsid/{dtxsid}` as
# `invitrodbVersion` if you need it.
#
# The annotations JSON is gitignored. Refetch it with:
#     just toxcast-refresh


  PublicationReference_title:
    name: PublicationReference_title
    definition_uri: https://w3id.org/monarch-initiative/dismech/title
    implements:
    - linkml:title
    description: 'Title of the referenced publication. Recommended so that linkml-data-qc
      scores its absence, matching the `recommended: true` already carried by the
      EvidenceItem `reference_title` twin. Set here via slot_usage rather than on
      the shared `title` slot, which is also used by Dataset and TrackedIssue.'
    comments:
    - "The `linkml:title` annotation is INERT for linkml-reference-validator detection\
      \ \u2014 lrv's TitleURIs matches only \"dcterms:title\" / \"dc/terms/title\"\
      . Where this slot IS title-checked (on PublicationReference) that happens via\
      \ lrv's exact-name fallback FallbackSlotNames.TITLE = (\"title\",), not via\
      \ this annotation. Kept because it is a reasonable semantic mapping, and noted\
      \ here for the same reason the EvidenceItem `reference_title` comment exists:\

    description: "Item(s) on the **disease-category axis** of the ILO List of Occupational\
      \ Diseases (revised 2010) \u2014 section 2 (by target organ system) and section\
      \ 4 (other diseases). The item names a clinical entity, not the agent. Orthogonal\
      \ to ``ilo_agent_category``. Multivalued because more than one item from this\
      \ axis can apply: silicosis takes both 2.1.1 and 2.1.2."
    title: "ILO (revised 2010) \u2014 by disease category"
    from_schema: https://w3id.org/monarch-initiative/dismech

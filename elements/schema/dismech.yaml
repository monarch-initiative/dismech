  EUOccupationalScheduleEnum:
    name: EUOccupationalScheduleEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/EUOccupationalScheduleEnum
    description: 'Annexes, chapters and items of the European schedule of occupational
      diseases (Commission Recommendation 2003/670/EC as amended by 2022/2337 and
      2025/2609). Items point to their chapter, and chapters to their annex, via ``is_a``.
      Assign the most specific applicable item. Annex II values (``suspected_*``)
      record a SUSPECTED occupational aetiology, not an established one.

      ``source`` on this enum is the consolidated instrument. Individual values carry
      their own ``source`` ONLY where the item was introduced by an amendment rather
      than by the 2003 base schedule, so a per-value ``source`` is a positive signal
      that the item is a recent addition.'
    from_schema: https://w3id.org/monarch-initiative/dismech/classifications/eu_occupational_schedule

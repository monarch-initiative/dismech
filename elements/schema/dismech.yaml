  reference_title:
    name: reference_title
    definition_uri: https://w3id.org/monarch-initiative/dismech/reference_title
    description: The title of the referenced publication
    comments:
    - "NOT machine-checked today, and deliberately so for now. linkml-reference-validator\
      \ already compares a declared title against the fetched publication and errors\
      \ on a mismatch, and it WOULD cover this slot with `implements: - dcterms:title`\
      \ (plus a `dcterms` prefix) \u2014 no upstream change is required. `linkml:title`\
      \ does NOT work: lrv's TitleURIs matches only \"dcterms:title\" / \"dc/terms/title\"\
      , so the annotation carried by the shared `title` slot is inert, and PublicationReference.title\
      \ is detected only via lrv's exact-name fallback FallbackSlotNames.TITLE = (\"\
      title\",). Note that \"checked\" means checked for the prefixes lrv actually\
      \ fetches: prefixes in `skip_prefixes` (conf/reference_validator_config.yaml),\
      \ notably `DOI:`, are never fetched and so are exempt. That is why ~34 disease-level\
      \ titles can differ from their cache on a green main without contradicting this\
      \ \u2014 all of them are DOI."
    - "Turning it on is blocked on data, not on tooling: 6,211 of 141,830 existing\
      \ titles (4.4%) currently differ from their cached publication under lrv's own\
      \ normalize_text, so enabling the check today would fail reference validation\
      \ across a large share of the KB. The differences are cosmetic in the cases\
      \ sampled \u2014 leftover Crossref markup (`<scp><i>ECHS1</i></scp>`), the curator\
      \ suffix `(Orphanet structured-database record)`, and unicode (`Guillain-Barre`\
      \ vs `Guillain-Barre` with en-dash and accent). Normalize those first, then\
      \ add the annotation. Until then the reviewer checklist in the dismech-pr-review\
      \ skill is the control."
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:reference_title
    owner: EvidenceItem
    domain_of:
    - EvidenceItem
    range: string
    recommended: true
  explanation:
    name: explanation
    definition_uri: https://w3id.org/monarch-initiative/dismech/explanation
    examples:
    - value: There is no curative treatment for nephronophthisis, indicating that
        supportive care, including symptomatic treatment and monitoring, is currently
        applied to manage associated complications.
    from_schema: https://w3id.org/monarch-initiative/dismech

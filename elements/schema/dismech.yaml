    description: "The **causative-agent axis** of the ILO List of Occupational Diseases\
      \ (revised 2010): section 1 (diseases caused by chemical, physical and biological\
      \ agents arising from work activities) and section 3 (occupational cancer, itself\
      \ titled \"Cancer caused by the following agents\"). Items point to their subsection,\
      \ and subsections to their section, via ``is_a``; assign the most specific applicable\
      \ item.\nOrthogonal to ``ILODiseaseCategoryEnum`` \u2014 a disease commonly\
      \ takes an item from both, and this slot is multivalued because more than one\
      \ agent item can apply."

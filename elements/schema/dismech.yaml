        description: Accumulation of sphingolipids (Gaucher, Fabry, Niemann-Pick,
          Krabbe, etc.)
        meaning: MONDO:0019255
      mucopolysaccharidosis:
        text: mucopolysaccharidosis
        description: Accumulation of glycosaminoglycans (MPS I through IX)
        meaning: MONDO:0019249
      mucolipidosis:
        text: mucolipidosis
        description: Features of both sphingolipidoses and mucopolysaccharidoses
        meaning: MONDO:0019248
      glycoproteinosis:
        text: glycoproteinosis
        description: Accumulation of glycoproteins (fucosidosis, mannosidosis, sialidosis)
        meaning: MONDO:0017731
      disorder of glycogen metabolism:
        text: disorder of glycogen metabolism
        description: Accumulation of glycogen in tissues (Pompe disease and related
          glycogen storage diseases)
        meaning: MONDO:0002412
      neuronal ceroid lipofuscinosis:
        text: neuronal ceroid lipofuscinosis
        description: Accumulation of lipofuscin in neurons (Batten disease family)
        meaning: MONDO:0016295
  MechanisticNosologyEnum:
    name: MechanisticNosologyEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/MechanisticNosologyEnum
    description: Classification of diseases by molecular mechanism or affected cellular
      system. Tag diseases with their primary mechanistic category.
    from_schema: https://w3id.org/monarch-initiative/dismech/classifications/mechanistic_nosology
    permissible_values:
      RASopathy:
        text: RASopathy
        description: RAS/MAPK signaling pathway disorders (Noonan, Costello, CFC,
          NF1)
        meaning: MONDO:0021060
      ciliopathy:
        text: ciliopathy
        description: Primary cilia structure/function disorders (PKD, Bardet-Biedl,
          Joubert)
        meaning: MONDO:0005308
      laminopathy:
        text: laminopathy
        description: Nuclear lamina disorders (EDMD, progeria, lipodystrophy)
        meaning: MONDO:0021106
      collagenopathy:
        text: collagenopathy
        description: Collagen synthesis/structure disorders (OI, EDS, Alport)
        meaning: MONDO:0004603
      desmosomopathy:
        text: desmosomopathy
        description: Desmosomal cell-cell adhesion disorders (Naxos disease, Carvajal
          syndrome, arrhythmogenic cardiomyopathy, pemphigus, desmosomal palmoplantar
          keratodermas)
      mitochondrial disease:
        text: mitochondrial disease
        description: Mitochondrial function/genome disorders (MELAS, MERRF, Leigh)
        meaning: MONDO:0044970
      amyloidopathy:
        text: amyloidopathy
        description: Amyloid protein aggregation disorders (Alzheimer's, CAA, hereditary
          cerebral amyloid angiopathy)
      tauopathy:
        text: tauopathy
        description: Tau protein aggregation disorders (Alzheimer's, PSP, CBD)
        meaning: MONDO:0005574
      synucleinopathy:
        text: synucleinopathy
        description: Alpha-synuclein aggregation disorders (Parkinson's, DLB, MSA)
        meaning: MONDO:0000510
      intermediate filament disease:
        text: intermediate filament disease
        description: Intermediate filament structure/aggregation disorders (Alexander
          disease/GFAP, epidermolysis bullosa simplex/keratins)
      proteotoxic disease:
        text: proteotoxic disease
        description: Diseases driven by toxic protein misfolding/aggregation and proteostasis
          failure (Alexander disease, polyQ disorders)
  IUISCategoryEnum:

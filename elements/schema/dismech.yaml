      gaps, phenotypes, or other objects this item is about. Uses a hash-anchor grammar
      consistent with `conforms_to`: `[<file>:]<kind>#<name>`. Examples: `pathophysiology#Amyloid
      Plaque Formation`, `phenotypes#Memory Loss`, `Liver_Cirrhosis:pathophysiology#Hepatic
      Stellate Cell Activation`. `<kind>` is the schema slot name of the section referred
      to; the older singular spellings (`phenotype#`, `treatment#`, ...) still resolve,
      but curated content is written in the slot-name form. Range is `string` for
      now; a custom EntityRef type with parser support can be introduced later without
      breaking existing data.'

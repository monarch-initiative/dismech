  ILODiseaseCategoryEnum:
    name: ILODiseaseCategoryEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ILODiseaseCategoryEnum
    description: "The **disease-category axis** of the ILO List of Occupational Diseases\
      \ (revised 2010): section 2 (occupational diseases by target organ systems \u2014\
      \ respiratory, skin, musculoskeletal, mental and behavioural) and section 4\
      \ (\"Other diseases\", the residual section). Items here name a clinical entity\
      \ rather than an agent.\nOrthogonal to ``ILOCausativeAgentEnum``. Multivalued,\
      \ because more than one disease item from this axis can apply to one entry \u2014\
      \ silicosis takes both 2.1.1 and 2.1.2.\nNote that section 4 is placed on this\
      \ axis by dismech's reading of the instrument (its named item, miners' nystagmus,\
      \ is a clinical entity), not by an explicit ILO statement; see the schema-level\
      \ description."
    in_subset:
    - ilo_disease_category_axis
    from_schema: https://w3id.org/monarch-initiative/dismech/classifications/ilo_occupational_diseases
    source: https://www.ilo.org/publications/ilo-list-occupational-diseases-revised-2010
    permissible_values:
      by_target_organ_system:
        text: by_target_organ_system
        description: "ILO section 2: Occupational diseases by target organ systems.\
          \ Classifies by the affected organ system rather than by causative agent.\
          \ Orthogonal to section 1 \u2014 a disease commonly takes an item from both."
      respiratory_diseases:
        text: respiratory_diseases
        description: 'ILO section 2.1: Respiratory diseases.'
        is_a: by_target_organ_system
      pneumoconiosis_from_fibrogenic_mineral_dust:
        text: pneumoconiosis_from_fibrogenic_mineral_dust
        description: 'ILO item 2.1.1: Pneumoconioses caused by fibrogenic mineral
          dust (silicosis, anthraco-silicosis, asbestosis).'
        is_a: respiratory_diseases
      silicotuberculosis:
        text: silicotuberculosis
        description: 'ILO item 2.1.2: Silicotuberculosis.'
        is_a: respiratory_diseases
      pneumoconiosis_from_non_fibrogenic_mineral_dust:
        text: pneumoconiosis_from_non_fibrogenic_mineral_dust
        description: 'ILO item 2.1.3: Pneumoconioses caused by non-fibrogenic mineral
          dust.'
        is_a: respiratory_diseases
      siderosis:
        text: siderosis
        description: 'ILO item 2.1.4: Siderosis.'
        is_a: respiratory_diseases
      bronchopulmonary_disease_from_hard_metal_dust:
        text: bronchopulmonary_disease_from_hard_metal_dust
        description: 'ILO item 2.1.5: Bronchopulmonary diseases caused by hard-metal
          dust.'
        is_a: respiratory_diseases
      bronchopulmonary_disease_from_organic_dust:
        text: bronchopulmonary_disease_from_organic_dust
        description: 'ILO item 2.1.6: Bronchopulmonary diseases caused by dust of
          cotton (byssinosis), flax, hemp, sisal or sugar cane (bagassosis).'
        is_a: respiratory_diseases
      occupational_asthma:
        text: occupational_asthma
        description: 'ILO item 2.1.7: Asthma caused by recognized sensitizing agents
          or irritants inherent to the work process.'
        is_a: respiratory_diseases
      extrinsic_allergic_alveolitis:
        text: extrinsic_allergic_alveolitis
        description: 'ILO item 2.1.8: Extrinsic allergic alveolitis caused by the
          inhalation of organic dusts or microbially contaminated aerosols, arising

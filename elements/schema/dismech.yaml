        description: Cell-based perturbation models (CRISPR screens, chemical perturbations)
          with gene expression readouts
      FOUNDATION_MODEL:
        text: FOUNDATION_MODEL
        description: Pre-trained single-cell foundation models (scGPT, Geneformer,
          scGenePT) for perturbation response prediction
      STRUCTURAL_PREDICTION:
        text: STRUCTURAL_PREDICTION
        description: Protein structure prediction (AlphaFold, RoseTTAFold) or experimental
          structure (PDB X-ray, cryo-EM) used to understand disease mechanisms
      MOLECULAR_DOCKING:
        text: MOLECULAR_DOCKING
        description: Computational docking or molecular dynamics simulation of drug
          candidates to protein targets, typically informed by PDB/AlphaFold structures

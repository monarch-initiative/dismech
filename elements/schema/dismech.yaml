    name: occupational_classification
    definition_uri: https://w3id.org/monarch-initiative/dismech/occupational_classification
    description: "Grouping slot collecting the occupational-disease nosology assignments\
      \ (the two ILO axes and the European schedule). Purely **presentational** \u2014\
      \ LinkML slot groups \"do not change the semantics of a model\", so this neither\
      \ constrains values nor implies the members are alternatives. It exists so the\
      \ two orthogonal ILO axes read as one classification rather than as unrelated\
      \ slots scattered through ``DiseaseClassifications``. What actually keeps an\
      \ axis's values out of the other axis's slot is that each slot ranges over its\
      \ own enum."

        required: true
    class_uri: dismech:ExposureDurationAssignment
  IARCCarcinogenGroupAssignment:
    name: IARCCarcinogenGroupAssignment
    definition_uri: https://w3id.org/monarch-initiative/dismech/IARCCarcinogenGroupAssignment
    description: 'IARC Monographs carcinogenicity group assignment for an agent, per
      the Preamble as amended January 2019. This is hazard identification, not risk
      assessment: the group states the strength of evidence that the agent can cause
      cancer, not its potency or the size of any attributable burden. Record the Monograph
      volume and the tumour sites with sufficient evidence in ``notes``.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: ClassificationAssignment
    slots:
    - evidence
    - notes
    - IARCCarcinogenGroupAssignment_classification_value
    slot_usage:
      classification_value:
        name: classification_value
        range: IARCCarcinogenGroupEnum
        required: true
    class_uri: dismech:IARCCarcinogenGroupAssignment
  GHSHealthHazardClassAssignment:
    name: GHSHealthHazardClassAssignment
    definition_uri: https://w3id.org/monarch-initiative/dismech/GHSHealthHazardClassAssignment
    description: UN GHS health hazard class assignment for an agent. The numbered
      category within the class (e.g. "Carc. 1A", "Acute Tox. 3") is class-specific
      and is recorded in ``notes`` rather than as a permissible value.
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: ClassificationAssignment
    slots:
    - evidence
    - notes
    - GHSHealthHazardClassAssignment_classification_value
    slot_usage:
      classification_value:
        name: classification_value
        range: GHSHealthHazardClassEnum
        required: true
    class_uri: dismech:GHSHealthHazardClassAssignment
  ExposomeDomainAssignment:
    name: ExposomeDomainAssignment
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExposomeDomainAssignment
    description: Exposome-domain assignment (Wild 2012, PMID:22296988). The domains
      overlap by design, so a placement is a framing choice rather than a sharp claim.
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: ClassificationAssignment
    slots:
    - evidence
    - notes
    - ExposomeDomainAssignment_classification_value
    slot_usage:
      classification_value:
        name: classification_value
        range: ExposomeDomainEnum
        required: true
    class_uri: dismech:ExposomeDomainAssignment
  ExposureClassifications:
    name: ExposureClassifications
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExposureClassifications
    description: 'Container for exposure- and agent-level classification assignments
      on an ``Environmental`` entry. Deliberately separate from ``DiseaseClassifications``:
      everything here classifies the agent or the exposure event (benzene is an IARC
      Group 1 carcinogen), not the disease.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - hazard_agent_type
    - exposure_route
    - exposure_duration
    - iarc_carcinogen_group
    - ghs_health_hazard_class
    - exposome_domain
    class_uri: dismech:ExposureClassifications
  DiseaseClassifications:
    name: DiseaseClassifications
    definition_uri: https://w3id.org/monarch-initiative/dismech/DiseaseClassifications
    description: Container for all classification assignments for a disease
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - icdo_morphology
    - harrisons_chapter
    - lysosomal_storage_category
    - mechanistic_category
    - iuis_category
    - channelopathy_category
    - icimd_category
    - isds_skeletal_category
    - nih_research_priority
    - ilo_agent_category
    - ilo_disease_category
    - eu_occupational_category
    class_uri: dismech:DiseaseClassifications
  Definition:
    name: Definition
    definition_uri: https://w3id.org/monarch-initiative/dismech/Definition
    description: A diagnostic or phenotype definition for the disease
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - Definition_name
    - Definition_definition_type
    - derivation_basis
    - validation_status
    - description
    - scope
    - Definition_attaches_to
    - criteria_sets
    - inclusion_criteria
    - exclusion_criteria
    - evidence
    - notes
    slot_usage:
      name:
        name: name
        required: true
      definition_type:
        name: definition_type
        required: true
      attaches_to:
        name: attaches_to
        description: For a hypothesis-based definition, the pathophysiology node(s)/edge(s)
          this algorithm is predicated on, using the `[<file>:]<kind>#<name>` hash-anchor
          grammar (e.g. `pathophysiology#Fever-triggered CaV1.2 activation`). Lets
          the hypothesis basis be inferred from those edges' `hypothesis_groups` rather
          than duplicated as a standalone id.
    class_uri: dismech:Definition
  AlgorithmValidationStatus:
    name: AlgorithmValidationStatus
    definition_uri: https://w3id.org/monarch-initiative/dismech/AlgorithmValidationStatus
    description: "Validation maturity of a phenotype algorithm / computable case definition:\
      \ a graded status plus a free-text rationale and optional citing evidence (the\
      \ standard EvidenceItem model \u2014 reference + verbatim snippet + explanation)."
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - AlgorithmValidationStatus_status
    - AlgorithmValidationStatus_rationale
    - evidence
    slot_usage:
      status:
        name: status
        examples:
        - value: PROPOSED
        - value: VALIDATED_AGAINST_GOLD_STANDARD
        range: AlgorithmValidationStatusEnum
        required: true
      rationale:
        name: rationale
        description: "Why this status \u2014 what was (or was not) run, against which\
          \ cohort, with what result."
    class_uri: dismech:AlgorithmValidationStatus
  CriteriaSet:
    name: CriteriaSet
    definition_uri: https://w3id.org/monarch-initiative/dismech/CriteriaSet
    description: A named criteria grouping within a definition
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - CriteriaSet_name
    - description
    - scope
    - minimum_required
    - core_clinical_characteristics
    - inclusion_criteria
    - exclusion_criteria
    - imaging_requirements
    - laboratory_requirements
    - additional_requirements
    - evidence
    - notes
    slot_usage:
      name:
        name: name
        required: true
    class_uri: dismech:CriteriaSet
  CriteriaItem:
    name: CriteriaItem
    definition_uri: https://w3id.org/monarch-initiative/dismech/CriteriaItem
    description: A criterion element (clinical feature, test result, imaging requirement)
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - term
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    class_uri: dismech:CriteriaItem
  TermMapping:
    name: TermMapping
    definition_uri: https://w3id.org/monarch-initiative/dismech/TermMapping
    description: Mapping from this disease entry to an external term or code
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - TermMapping_term
    - TermMapping_mapping_predicate
    - mapping_source
    - mapping_justification
    - consistency
    - tracked_issues
    - notes
    slot_usage:
      term:
        name: term
        required: true
      mapping_predicate:
        name: mapping_predicate
        required: true
    class_uri: dismech:TermMapping
  ICD10CMMapping:
    name: ICD10CMMapping
    definition_uri: https://w3id.org/monarch-initiative/dismech/ICD10CMMapping
    description: ICD-10-CM diagnosis code mapping
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: TermMapping
    slots:
    - TermMapping_mapping_predicate
    - mapping_source
    - mapping_justification
    - consistency
    - tracked_issues
    - notes
    - ICD10CMMapping_term
    slot_usage:
      term:
        name: term
        bindings:
        - range: ICD10CMTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:ICD10CMMapping
  ICD11FMapping:
    name: ICD11FMapping
    definition_uri: https://w3id.org/monarch-initiative/dismech/ICD11FMapping
    description: ICD-11 Foundation diagnosis code mapping
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: TermMapping
    slots:
    - TermMapping_mapping_predicate
    - mapping_source
    - mapping_justification
    - consistency
    - tracked_issues
    - notes
    - ICD11FMapping_term
    slot_usage:
      term:
        name: term
        bindings:
        - range: ICD11FTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:ICD11FMapping
  MondoMapping:
    name: MondoMapping
    definition_uri: https://w3id.org/monarch-initiative/dismech/MondoMapping
    description: MONDO disease ontology mapping
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: TermMapping
    slots:
    - TermMapping_mapping_predicate
    - mapping_source
    - mapping_justification
    - consistency
    - tracked_issues
    - notes
    - MondoMapping_term
    slot_usage:
      term:
        name: term
        bindings:
        - range: DiseaseTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:MondoMapping
  NCITMapping:
    name: NCITMapping
    definition_uri: https://w3id.org/monarch-initiative/dismech/NCITMapping
    description: NCIT disease, subtype, or disease/finding ontology mapping for cancer
      entries
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: TermMapping
    slots:
    - TermMapping_mapping_predicate
    - mapping_source
    - mapping_justification
    - consistency
    - tracked_issues
    - notes
    - NCITMapping_term
    slot_usage:
      term:
        name: term
        bindings:
        - range: NCITDiseaseOrFindingTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:NCITMapping
  MappingConsistency:
    name: MappingConsistency
    definition_uri: https://w3id.org/monarch-initiative/dismech/MappingConsistency
    description: Consistency assertion for a mapping relative to another source
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - MappingConsistency_reference
    - MappingConsistency_consistent
    - notes
    slot_usage:
      reference:
        name: reference
        description: Reference source used to assess consistency (e.g., MONDO)
        range: string
        required: true
      consistent:
        name: consistent
        required: true
    class_uri: dismech:MappingConsistency
  DiseaseMappings:
    name: DiseaseMappings
    definition_uri: https://w3id.org/monarch-initiative/dismech/DiseaseMappings
    description: Container for external identifier mappings for a disease or subtype
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - icd10cm_mappings
    - icd11f_mappings
    - mondo_mappings
    - ncit_mappings
    class_uri: dismech:DiseaseMappings
  ConditionDescriptor:
    name: ConditionDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/ConditionDescriptor
    description: A descriptor for a condition or disease, optionally bound to MONDO.
      External coding identifiers (ICD-10, OMOP, SNOMED, etc.) are captured on association
      signals.
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - ConditionDescriptor_slug
    - ConditionDescriptor_preferred_term
    - description
    - ConditionDescriptor_term
    - composition
    - components
    slot_usage:
      slug:
        name: slug
        description: Use for leaf conditions; omit when using composition/components
        required: false
      term:
        name: term
        description: Optional MONDO disease term reference
        bindings:
        - range: DiseaseTerm
          obligation_level:
            text: OPTIONAL
            description: The metadata element is optional to be present in the model
          binds_value_of: id
      preferred_term:
        name: preferred_term
        required: false
    class_uri: dismech:ConditionDescriptor
  ComorbidityAssociation:
    name: ComorbidityAssociation
    definition_uri: https://w3id.org/monarch-initiative/dismech/ComorbidityAssociation
    description: An association between two conditions, including directionality,
      evidence, and computational characterizations.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - ComorbidityAssociation_creation_date
    - ComorbidityAssociation_updated_date
    - disease_a
    - disease_b
    - directionality
    - effect_direction
    - association_signals
    - literature_evidence
    - hypotheses
    - shared_upstream_hypotheses
    - phenotypes
    - notes
    - curation_status
    slot_usage:
      creation_date:
        name: creation_date
        description: Timestamp for initial creation of this comorbidity entry. Keep
          this stable after first set.
      updated_date:
        name: updated_date
        description: Timestamp for the latest substantive update to this comorbidity
          entry. Update this whenever curated content changes.
    class_uri: dismech:ComorbidityAssociation
  AssociationSignal:
    name: AssociationSignal
    definition_uri: https://w3id.org/monarch-initiative/dismech/AssociationSignal
    description: An association signal from EHR, registry, or computational sources,
      optionally stratified by sex, age, or cohort.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - AssociationSignal_source
    - AssociationSignal_method
    - signal_disorder_a_id
    - signal_disorder_b_id
    - population
    - demographics
    - mapping_notes
    - disorder_a_count
    - disorder_b_count
    - pair_count
    - limited_precision
    - precision_count_threshold
    - directionality
    - effect_direction
    - a_before_b
    - b_before_a
    - same_time
    - metrics
    - statistics
    - go_enrichment
    - evidence
    - notes
    slot_usage:
      source:
        name: source
        range: AssociationSignalSourceEnum
      method:
        name: method
        range: AssociationSignalMethodEnum
    class_uri: dismech:AssociationSignal
  Demographics:
    name: Demographics
    definition_uri: https://w3id.org/monarch-initiative/dismech/Demographics
    description: Demographic stratification for an association signal
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - Demographics_sex
    - age_range
    slot_usage:
      sex:
        name: sex
        range: SexEnum
    class_uri: dismech:Demographics
  AssociationMetric:
    name: AssociationMetric
    definition_uri: https://w3id.org/monarch-initiative/dismech/AssociationMetric
    description: Quantitative association metric and its uncertainty.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - metric_type
    - metric_value
    - metric_ci_lower
    - metric_ci_upper
    - p_value
    - fdr
    - notes
    class_uri: dismech:AssociationMetric
  AssociationStatistics:
    name: AssociationStatistics
    definition_uri: https://w3id.org/monarch-initiative/dismech/AssociationStatistics
    description: Statistical summary with evidence for an association signal.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - metrics
    - evidence
    - notes
    class_uri: dismech:AssociationStatistics
  GOEnrichment:
    name: GOEnrichment
    definition_uri: https://w3id.org/monarch-initiative/dismech/GOEnrichment
    description: GO enrichment results for an association signal.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - method
    - description
    - go_terms
    class_uri: dismech:GOEnrichment
  GOEnrichmentTerm:
    name: GOEnrichmentTerm
    definition_uri: https://w3id.org/monarch-initiative/dismech/GOEnrichmentTerm
    description: GO term enrichment result with statistical metrics.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - term
    - p_value
    - fdr
    - overlap
    - combined_score
    class_uri: dismech:GOEnrichmentTerm
  ComorbidityHypothesis:
    name: ComorbidityHypothesis
    definition_uri: https://w3id.org/monarch-initiative/dismech/ComorbidityHypothesis
    description: Mechanistic hypothesis for a comorbidity association, with rich text
      and embedded evidence plus atomic pathophysiology elements.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - description
    - evidence
    - pathophysiology
    class_uri: dismech:ComorbidityHypothesis
  UpstreamConditionHypothesis:
    name: UpstreamConditionHypothesis
    definition_uri: https://w3id.org/monarch-initiative/dismech/UpstreamConditionHypothesis
    description: Hypothesized upstream condition that may explain both A and B.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - upstream_disorder
    - description
    - evidence
    class_uri: dismech:UpstreamConditionHypothesis
  MechanisticHypothesis:
    name: MechanisticHypothesis
    definition_uri: https://w3id.org/monarch-initiative/dismech/MechanisticHypothesis
    description: Disease-level hypothesis metadata used to organize downstream causal
      edges into canonical or alternative explanatory models.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - MechanisticHypothesis_hypothesis_group_id
    - hypothesis_label
    - MechanisticHypothesis_status
    - description
    - applies_to_subtypes
    - evidence
    - notes
    slot_usage:
      hypothesis_group_id:
        name: hypothesis_group_id
        required: true
      status:
        name: status
        examples:
        - value: CANONICAL
        - value: EMERGING
        range: MechanisticHypothesisStatusEnum
    class_uri: dismech:MechanisticHypothesis
  Discussion:
    name: Discussion
    definition_uri: https://w3id.org/monarch-initiative/dismech/Discussion
    description: A thread-like record of an open question, controversy, curation todo,
      emerging hypothesis, or interpretation debate attached to a disease entry or
      sub-object. Discussions capture the *discourse* layer of curation (what is being
      argued or asked), complementing the structural knowledge-gap layer proposed
      in monarch-initiative/dismech#2617 (what is missing from the model). External
      thread links (e.g., Alzforum commentaries, GitHub issues) are not modelled as
      a separate slot; instead they are cited via the standard `evidence` block using
      the same EvidenceItem shape as primary literature.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - Discussion_discussion_id
    - Discussion_prompt
    - Discussion_kind
    - Discussion_status
    - attaches_to
    - rationale
    - proposed_experiments
    - evidence
    - posed_by
    - posed_date
    - resolved_date
    - resolution_note
    - notes
    slot_usage:
      discussion_id:
        name: discussion_id
        required: true
      prompt:
        name: prompt
        required: true
      kind:
        name: kind
        range: DiscussionKindEnum
      status:
        name: status
        examples:
        - value: OPEN
        - value: RESOLVED
        range: DiscussionStatusEnum
    class_uri: dismech:Discussion
  DiseaseCollection:
    name: DiseaseCollection
    definition_uri: https://w3id.org/monarch-initiative/dismech/DiseaseCollection
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - diseases
    class_uri: dismech:DiseaseCollection
    tree_root: true
  FDASurrogateEndpointCollection:
    name: FDASurrogateEndpointCollection
    definition_uri: https://w3id.org/monarch-initiative/dismech/FDASurrogateEndpointCollection
    description: FDA surrogate endpoint table import preserving row-level source provenance
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: SurrogateEndpointCollection
    slots:
    - SurrogateEndpointCollection_name
    - description
    - source_url
    - source_workbook_url
    - source_workbook_sha256
    - source_content_current_as_of
    - retrieved_date
    - SurrogateEndpointCollection_surrogate_endpoints
    - tracked_issues
    - notes
    class_uri: dismech:FDASurrogateEndpointCollection
  Grouping:
    name: Grouping
    definition_uri: https://w3id.org/monarch-initiative/dismech/Grouping
    description: "An explicit, curated union of distinct Disease entries assembled\
      \ below the level of the formal classification taxonomies. A Grouping points\
      \ DOWN: it lists its members rather than being inferred from them, and it does\
      \ not recapitulate MONDO (an optional `mappings` block may cross-reference an\
      \ external grouping term). Its purpose is to make the grouping boundary auditable\
      \ \u2014 recording WHY these conditions are grouped (`grouping_basis`, `grouping_rationale`),\
      \ the shared `membership_criteria` (prose plus an optional boolean expression),\
      \ and, per member, the mechanisms that differentiate it from its siblings."
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - Grouping_name
    - display_name
    - Grouping_creation_date
    - description
    - grouping_basis
    - grouping_rationale
    - membership_criteria
    - Grouping_members
    - mappings
    - references
    - discussions
    - curation_history
    - notes
    slot_usage:
      name:
        name: name
        description: Preferred name for the grouping (unique; serves as FK target)
        required: true
      creation_date:
        name: creation_date
        description: Timestamp for initial creation of this grouping entry. Keep this
          stable after first set.
        recommended: true
      members:
        name: members
        required: true
    class_uri: dismech:Grouping
  GroupingCriteria:
    name: GroupingCriteria
    definition_uri: https://w3id.org/monarch-initiative/dismech/GroupingCriteria
    description: The shared membership criteria for a grouping, pairing a human-readable
      description with an optional structured boolean expression and a necessary/sufficient/equivalent
      semantics marker.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - GroupingCriteria_description
    - criteria_semantics
    - logic
    - evidence
    - notes
    slot_usage:
      description:
        name: description
        description: Human-readable statement of the membership criteria.
        required: true
    class_uri: dismech:GroupingCriteria
  LogicalCriterion:
    name: LogicalCriterion
    definition_uri: https://w3id.org/monarch-initiative/dismech/LogicalCriterion
    description: A node in a nested boolean membership-criteria expression. A branch
      node sets `operator` and combines child `operands`; a leaf node sets `criterion_predicate`
      and the payload slots relevant to that predicate. This is a deliberately lightweight,
      OWL-inspired representation, not a full logical formalism.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - operator
    - operands
    - criterion_predicate
    - description
    - negated
    - phenotype_term
    - min_frequency
    - inheritance_term
    - gene
    - biological_processes
    - module
    - classification
    class_uri: dismech:LogicalCriterion
  GroupingMember:
    name: GroupingMember
    definition_uri: https://w3id.org/monarch-initiative/dismech/GroupingMember
    description: One member of a grouping, referenced by foreign key, together with
      the mechanisms that differentiate it from its siblings.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - GroupingMember_member
    - GroupingMember_member_type
    - display_name
    - disease_term
    - differentiating_mechanisms
    - evidence
    - notes
    slot_usage:
      member:
        name: member
        required: true
      member_type:
        name: member_type
        description: The kind of entity referenced (defaults conceptually to DISEASE).
    class_uri: dismech:GroupingMember
  DifferentiatingMechanism:
    name: DifferentiatingMechanism
    definition_uri: https://w3id.org/monarch-initiative/dismech/DifferentiatingMechanism
    description: A mechanism or feature that distinguishes a grouping member from
      its siblings, as prose plus optional structured descriptors (gene, phenotype,
      biological process, module).
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - DifferentiatingMechanism_description
    - gene
    - phenotype_term
    - biological_processes
    - module
    - modifier
    - evidence
    - notes
    slot_usage:
      description:
        name: description
        description: Human-readable statement of the differentiating mechanism.
        required: true
    class_uri: dismech:DifferentiatingMechanism

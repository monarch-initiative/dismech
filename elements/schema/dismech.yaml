  decision_criterion:
    name: decision_criterion
    definition_uri: https://w3id.org/monarch-initiative/dismech/decision_criterion
    description: Pre-specified qualitative or quantitative criterion for interpreting
      the experiment relative to the attached discussion or knowledge gap.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:decision_criterion
    owner: Experiment
    domain_of:
    - Experiment
    range: string
  would_support:
    name: would_support
    definition_uri: https://w3id.org/monarch-initiative/dismech/would_support
    description: 'Entity references that would be supported if the experiment meets
      its decision criterion. Uses the same hash-anchor grammar as `attaches_to`,
      and every value must use it: this slot names *what the result bears on*, not
      what the result would be. For a prose statement of the outcome itself, use `supporting_outcome`.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:would_support
    owner: Experiment
    domain_of:
    - Experiment
    range: string
    multivalued: true
  would_refute:
    name: would_refute
    definition_uri: https://w3id.org/monarch-initiative/dismech/would_refute
    description: Entity references that would be weakened or refuted if the experiment
      meets a contrary result. Uses the same hash-anchor grammar as `attaches_to`,
      and every value must use it. For a prose statement of the outcome itself, use
      `refuting_outcome`.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:would_refute
    owner: Experiment
    domain_of:
    - Experiment
    range: string
    multivalued: true
  supporting_outcome:
    name: supporting_outcome
    definition_uri: https://w3id.org/monarch-initiative/dismech/supporting_outcome
    description: 'Prose statement of an experimental result that would support the
      attached claim -- what would be observed, not which node it bears on. The supporting
      arm of `decision_criterion`, which is single-valued and so cannot express a
      support/refute pair.

      Distinct from `would_support`, which takes entity references. A curator writing
      "Increased progenitor apoptosis in patient organoids would establish that the
      mouse mechanism operates in human cells" is stating an outcome and belongs here;
      one writing `pathophysiology#Motor Neuron Degeneration` is naming a node and
      belongs in `would_support`.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:supporting_outcome
    owner: Experiment
    domain_of:
    - Experiment
    range: string
    multivalued: true
  refuting_outcome:
    name: refuting_outcome
    definition_uri: https://w3id.org/monarch-initiative/dismech/refuting_outcome
    description: Prose statement of an experimental result that would weaken or refute
      the attached claim. The refuting arm of `decision_criterion`; the counterpart
      of `supporting_outcome`, and distinct from `would_refute` in the same way.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:refuting_outcome
    owner: Experiment
    domain_of:
    - Experiment
    range: string
    multivalued: true
  protocol_reference:

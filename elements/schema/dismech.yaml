      RR:
        text: RR
        description: Relative risk
      HR:
        text: HR
        description: Hazard ratio
      PREVALENCE:
        text: PREVALENCE
        description: Prevalence proportion
      INCIDENCE_RATE:
        text: INCIDENCE_RATE
        description: Incidence rate
      IRR:
        text: IRR
        description: Incidence rate ratio
      CHI_SQUARE:
        text: CHI_SQUARE
        description: Chi-square association statistic
      LOG_OBS_EXP_RATIO:
        text: LOG_OBS_EXP_RATIO
        description: Natural-log observed-to-expected co-occurrence ratio
      OTHER:
        text: OTHER
        description: Other or unspecified metric
  MechanismConfidenceEnum:
    name: MechanismConfidenceEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/MechanismConfidenceEnum
    description: Level of confidence in a pathophysiology mechanism
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      ESTABLISHED:
        text: ESTABLISHED
        description: Well-established mechanism with strong evidence from multiple
          independent studies
        title: Established
      HYPOTHETICAL:
        text: HYPOTHETICAL
        description: Hypothetical mechanism with limited or indirect evidence; plausible
          but not yet validated
        title: Hypothetical
      PROVISIONAL:
        text: PROVISIONAL
        description: Provisional mechanism under active investigation with emerging
          but incomplete evidence
        title: Provisional
  GroupingBasisEnum:
    name: GroupingBasisEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/GroupingBasisEnum
    description: "The axis (or axes) on which a disease Grouping is drawn. A grouping\
      \ assembles already-distinct Disease entries into an explicit union; this enum\
      \ records WHY they belong together, supporting an audit of the grouping boundary.\
      \ Multivalued \u2014 a grouping may rest on more than one basis (e.g., the mucopolysaccharidoses\
      \ are grouped on both a shared mechanism and a shared gene/enzyme family)."
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      SHARED_MECHANISM:
        text: SHARED_MECHANISM
        description: Members converge on a common pathophysiological mechanism or
          final-common-pathway (often a shared mechanism module).
        title: Shared mechanism
      SHARED_GENE_FAMILY:
        text: SHARED_GENE_FAMILY
        description: Members are caused by variants in the same gene, gene family,
          or functionally related set of genes/enzymes.
        title: Shared gene family
      SHARED_PATHWAY:
        text: SHARED_PATHWAY
        description: Members perturb the same biological pathway or process.
        title: Shared pathway
      SHARED_PHENOTYPE:
        text: SHARED_PHENOTYPE
        description: Members share a defining clinical phenotype or phenotypic spectrum.
        title: Shared phenotype
      SHARED_TREATMENT_RESPONSE:
        text: SHARED_TREATMENT_RESPONSE
        description: Members are grouped by a shared therapeutic vulnerability or
          response to a common class of treatment.
        title: Shared treatment response
      CLINICAL_CONVENTION:
        text: CLINICAL_CONVENTION
        description: Members are grouped by established clinical or nosological convention
          rather than a single mechanistic axis.
        title: Clinical convention
      OTHER:
        text: OTHER
        description: A grouping basis that does not fit the categories above.
        title: Other
  LogicalOperatorEnum:
    name: LogicalOperatorEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/LogicalOperatorEnum
    description: Boolean operator for a branch node in a nested membership-criteria
      expression (LogicalCriterion). Branch nodes set an operator and combine child
      operands; leaf nodes set a criterion_predicate instead.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      AND:
        text: AND
        description: All operands must hold (conjunction).
      OR:
        text: OR
        description: At least one operand must hold (disjunction).
      NOT:
        text: NOT
        description: Negation. Conventionally applied to a single operand (or to the
          conjunction of its operands).
  CriterionPredicateEnum:
    name: CriterionPredicateEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/CriterionPredicateEnum
    description: The kind of constraint expressed by a leaf node in a membership-criteria
      expression (LogicalCriterion). The leaf's payload slots are interpreted according
      to this predicate (e.g., HAS_PHENOTYPE uses phenotype_term and optional min_frequency;
      HAS_GENE uses gene; CONFORMS_TO_MODULE uses module).
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      HAS_PHENOTYPE:
        text: HAS_PHENOTYPE
        description: Members present a given phenotype (phenotype_term), optionally
          at or above a frequency threshold (min_frequency).
      HAS_GENE:
        text: HAS_GENE
        description: Members carry causal variants in a given gene (gene).
      CONFORMS_TO_MODULE:
        text: CONFORMS_TO_MODULE
        description: Members have a pathophysiology node conforming to a given mechanism
          module (module).
      HAS_BIOLOGICAL_PROCESS:
        text: HAS_BIOLOGICAL_PROCESS
        description: Members involve a given biological process (biological_processes),
          optionally with a directional modifier.
      HAS_CLASSIFICATION:
        text: HAS_CLASSIFICATION
        description: Members carry a given nosology/classification assignment (classification).
      HAS_INHERITANCE:
        text: HAS_INHERITANCE
        description: Members share a mode of inheritance (description carries the
          value).
      HAS_MAPPING:
        text: HAS_MAPPING
        description: Members map to a given external term or code namespace (description
          carries the value).
      OTHER:
        text: OTHER
        description: A membership constraint that does not fit the categories above;
          described in free text via the description slot.
  CriteriaSemanticsEnum:
    name: CriteriaSemanticsEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/CriteriaSemanticsEnum
    description: 'The logical direction relating a grouping''s membership criteria
      to its members, mirroring the OWL necessary/sufficient/equivalent distinction.
      This determines what tooling may infer: NECESSARY criteria can only be used
      to AUDIT listed members (member => criteria); SUFFICIENT criteria can be used
      to CLASSIFY non-members as candidates (criteria => member); NECESSARY_AND_SUFFICIENT
      criteria do both (member <=> criteria).'
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      NECESSARY:
        text: NECESSARY
        description: Every member satisfies these criteria, but satisfying them does
          not by itself establish membership. Used to audit members for violations.
        title: Necessary (member => criteria)
      SUFFICIENT:
        text: SUFFICIENT
        description: Any disorder satisfying these criteria is a member. Used to classify
          non-members as candidate members.
        title: Sufficient (criteria => member)
      NECESSARY_AND_SUFFICIENT:
        text: NECESSARY_AND_SUFFICIENT
        description: 'These criteria define the grouping: a disorder is a member if
          and only if it satisfies them. Supports both auditing and classification.'
        title: Necessary and sufficient (member <=> criteria)
  GroupingMemberTypeEnum:
    name: GroupingMemberTypeEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/GroupingMemberTypeEnum
    description: The kind of entity referenced by a GroupingMember.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      DISEASE:
        text: DISEASE
        description: A Disease entry in kb/disorders/.
      SUBTYPE:
        text: SUBTYPE
        description: A named subtype within a Disease entry.
      MODULE:
        text: MODULE
        description: A mechanism module in kb/modules/.
      GROUPING:
        text: GROUPING
        description: Another Grouping (nested grouping).
  ReferenceTagEnum:
    name: ReferenceTagEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ReferenceTagEnum
    description: Controlled vocabulary for tagging top-level references by authoritative
      source type. Enables queries like "which disorders lack a GeneReviews citation?"
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      GeneReviews:
        text: GeneReviews
        description: Reference is a GeneReviews article published in the NCBI Bookshelf
          (https://www.ncbi.nlm.nih.gov/books/NBK1116/). GeneReviews are expert-authored,
          peer-reviewed summaries updated on a rolling basis; they are the gold-standard
          narrative resource for rare Mendelian disease phenotyping and management.
        title: GeneReviews
  GeneSetRelationshipEnum:
    name: GeneSetRelationshipEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/GeneSetRelationshipEnum
    description: How an external gene set (e.g. an MSigDB/KEGG pathway, a cell-type
      signature, or an expression-perturbation signature) relates to a disease entry.
      Records the semantics of a curated disease<->gene-set link so the link is auditable
      and the right kind of alignment can be applied.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      CANONICAL_PATHWAY:
        text: CANONICAL_PATHWAY
        description: A curated pathway gene set representing the disease's canonical
          mechanism (e.g. KEGG_ASTHMA for asthma). The primary target for BP alignment
          against the pathograph.
      CELL_TYPE_SIGNATURE:
        text: CELL_TYPE_SIGNATURE
        description: A marker gene set for a cell type relevant to the disease.
      PERTURBATION_SIGNATURE:
        text: PERTURBATION_SIGNATURE
        description: An up/down expression signature from a perturbation or contrast
          (e.g. drug response, knockout) relevant to the disease.
      DISEASE_SIGNATURE:
        text: DISEASE_SIGNATURE
        description: A differential-expression signature derived from the disease
          itself.
      OTHER:
        text: OTHER
        description: A related gene set that does not fit the categories above.

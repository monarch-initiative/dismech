  CausalLinkTypeEnum:
    name: CausalLinkTypeEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/CausalLinkTypeEnum
    description: Degree of mechanistic directness represented by a causal edge
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      DIRECT:
        text: DIRECT
        description: Direct causal influence at the current graph granularity
      INDIRECT_KNOWN_INTERMEDIATES:
        text: INDIRECT_KNOWN_INTERMEDIATES
        description: Indirect relationship where one or more intermediates are known
          but omitted from the graph
      INDIRECT_UNKNOWN_INTERMEDIATES:
        text: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Indirect relationship where at least one required intermediate
          mechanism is currently unknown
      UNKNOWN:
        text: UNKNOWN
        description: Directness has not yet been determined
  TreatmentEffectEnum:
    name: TreatmentEffectEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/TreatmentEffectEnum
    description: How a treatment affects a pathophysiology mechanism node
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      INHIBITS:
        text: INHIBITS
        description: Blocks or decreases the mechanism (e.g., TKI inhibiting constitutive
          kinase activity)
      ACTIVATES:
        text: ACTIVATES
        description: Promotes or increases the mechanism (e.g., enzyme replacement
          restoring a deficient pathway)
      MODULATES:
        text: MODULATES
        description: Alters the mechanism without clear unidirectional effect
      BYPASSES:
        text: BYPASSES
        description: Works around the disrupted mechanism via an alternative pathway
      RESTORES:
        text: RESTORES
        description: Restores normal function of a disrupted mechanism (e.g., gene
          therapy, enzyme replacement)
  EnvironmentalEffectEnum:
    name: EnvironmentalEffectEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/EnvironmentalEffectEnum
    description: How an environmental factor or exposure acts on a pathophysiology
      mechanism node. The environmental analogue of TreatmentEffectEnum, used to keep
      causative, aggravating, and protective exposures visually and semantically distinct
      in the pathograph.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      TRIGGERS:
        text: TRIGGERS
        description: The exposure initiates the mechanism, which would not otherwise
          occur in its absence (e.g., inorganic arsenic ingestion initiating systemic
          arsenic exposure; allergen contact initiating sensitization).
        title: Triggers
      EXACERBATES:
        text: EXACERBATES
        description: The exposure worsens or amplifies a mechanism that is already
          present or can arise independently (e.g., tobacco smoke amplifying airway
          inflammation).
        title: Exacerbates
      PREDISPOSES:
        text: PREDISPOSES
        description: The exposure increases susceptibility to the mechanism without
          being sufficient to produce it (e.g., a risk-factor exposure that requires
          additional genetic or environmental hits).
        title: Predisposes
      PROTECTS_AGAINST:
        text: PROTECTS_AGAINST
        description: The exposure reduces the occurrence or severity of the mechanism
          (e.g., early-life microbial exposure and allergic sensitization).
        title: Protects against
      MODULATES:
        text: MODULATES
        description: The exposure alters the mechanism without a clear unidirectional
          effect, or the direction is context dependent.
        title: Modulates

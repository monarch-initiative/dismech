        description: Simultaneous video and EEG monitoring for seizure semiology-EEG
          correlation. No distinct NCIT procedure term; a specialization of EEG.
        title: Video Electroencephalography
      ECG:
        text: ECG
        description: Electrocardiography, including resting and stress ECG
        meaning: NCIT:C38053
        title: Electrocardiography
      EMG:
        text: EMG
        description: Needle or surface electromyography
        meaning: NCIT:C38056
        title: Electromyography
      NERVE_CONDUCTION_STUDY:
        text: NERVE_CONDUCTION_STUDY
        description: Nerve conduction study (motor/sensory conduction velocity and
          amplitude)
        meaning: NCIT:C88502
        title: Nerve Conduction Velocity Test
      EVOKED_POTENTIAL:
        text: EVOKED_POTENTIAL
        description: Evoked-potential testing (visual, brainstem-auditory, or somatosensory).
          No clean generic NCIT procedure term.
        title: Evoked Potential
      POLYSOMNOGRAPHY:
        text: POLYSOMNOGRAPHY
        description: Overnight sleep study combining EEG, EOG, EMG, ECG, and respiratory
          channels
        meaning: NCIT:C114185
        title: Polysomnography
      MEG:
        text: MEG
        description: Magnetoencephalography (magnetic-field source localization)
        meaning: NCIT:C16811
        title: Magnetoencephalography
      OTHER:
        text: OTHER
        description: An electrophysiologic modality not otherwise enumerated
        title: Other electrophysiologic modality
  IctalStateEnum:
    name: IctalStateEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/IctalStateEnum
    description: Timing of an electrophysiologic finding relative to a seizure or
      paroxysmal event - the axis a flat HP phenotype term cannot express.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      ICTAL:
        text: ICTAL
        description: Recorded during a seizure / paroxysmal event
      INTERICTAL:
        text: INTERICTAL
        description: Recorded between events, in the baseline state
      POSTICTAL:
        text: POSTICTAL
        description: Recorded in the period immediately following an event
  EEGRecordingStateEnum:
    name: EEGRecordingStateEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/EEGRecordingStateEnum
    description: Behavioural state or activation procedure under which an EEG finding
      is recorded, since many findings are state- or provocation-dependent.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      AWAKE:
        text: AWAKE
        description: Recorded during wakefulness
      ASLEEP:
        text: ASLEEP
        description: Recorded during sleep (findings may be sleep-activated)
      DROWSY:
        text: DROWSY
        description: Recorded during drowsiness / transition to sleep
      SLEEP_DEPRIVED:
        text: SLEEP_DEPRIVED
        description: Recorded after sleep deprivation (a seizure-activation procedure)
      PHOTIC_STIMULATION:
        text: PHOTIC_STIMULATION
        description: Recorded during intermittent photic stimulation
      HYPERVENTILATION:
        text: HYPERVENTILATION
        description: Recorded during hyperventilation activation
  MedicalActionCategoryEnum:
    name: MedicalActionCategoryEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/MedicalActionCategoryEnum
    description: Broad functional category for a clinical action currently represented
      in the treatments section. Specific actions such as genetic counseling should
      be represented by treatment_term, while this category stays at the level needed
      for validation and rendering.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      THERAPEUTIC:
        text: THERAPEUTIC
        description: An action intended to treat, prevent, mitigate, or manage disease
          processes, complications, or symptoms. These actions may link to pathophysiology
          nodes or phenotypes through target_mechanisms or target_phenotypes.
        meaning: NCIT:C49236
        title: Therapeutic Procedure
      DIAGNOSTIC:
        text: DIAGNOSTIC
        description: A diagnostic procedure or testing action used to establish or
          refine a diagnosis. These actions should not use target_mechanisms or target_phenotypes
          because they do not treat pathophysiology nodes or phenotypes.
        meaning: NCIT:C18020
        title: Diagnostic Procedure
      SCREENING:
        text: SCREENING
        description: Screening or surveillance intended to detect disease, risk, or
          early manifestations. These actions should not use target_mechanisms or
          target_phenotypes.
        meaning: NCIT:C15419
        title: Disease Screening
      MONITORING:
        text: MONITORING
        description: Clinical, laboratory, imaging, or longitudinal follow-up used
          to observe disease status or complications. These actions should not use
          target_mechanisms or target_phenotypes.
        meaning: NCIT:C61256
        title: Monitoring
      COUNSELING_INFORMATIONAL:
        text: COUNSELING_INFORMATIONAL
        description: Counseling, education, risk communication, cascade-testing support,
          or reproductive planning actions. Use this broad category for genetic counseling
          and related informational interventions. These actions should not use target_mechanisms
          or target_phenotypes because they do not directly modify disease pathophysiology
          or phenotypes.
        meaning: NCIT:C61547
        title: Counseling
  TherapeuticModalityEnum:
    name: TherapeuticModalityEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/TherapeuticModalityEnum
    description: Broad therapeutic modality / platform of a treatment, independent
      of the specific agent or NCIT action term. Captures the "kind of thing" a treatment
      is (e.g., a small molecule vs. an antisense oligonucleotide vs. a gene therapy)
      so treatments are queryable by platform across diseases.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      SMALL_MOLECULE:
        text: SMALL_MOLECULE
        description: Small-molecule pharmacotherapy (orally or parenterally administered
          chemical drugs)
        meaning: NCIT:C48809
        aliases:
        - Small Molecule
      MONOCLONAL_ANTIBODY:
        text: MONOCLONAL_ANTIBODY
        description: Monoclonal antibody or antibody-derived biologic (including bispecifics
          and antibody-drug conjugates)
        meaning: NCIT:C20401
        aliases:
        - Monoclonal Antibody
      NANOBODY:
        text: NANOBODY
        description: "Single-domain antibody (sdAb/VHH/Nanobody) \u2014 a single variable-domain\
          \ immunoglobulin fragment (e.g., caplacizumab), distinct from full-size\
          \ monoclonal antibodies"
        title: Nanobody / single-domain antibody
        comments:
        - No generic "single-domain antibody / nanobody" class exists in the configured
          ontologies (only specific radiolabeled VHH conjugates, e.g. NCIT:C155898);
          left unmapped
        aliases:
        - Single-Domain Antibody
        - VHH
      ANTISENSE_OLIGONUCLEOTIDE:
        text: ANTISENSE_OLIGONUCLEOTIDE
        description: Single-stranded antisense oligonucleotide (ASO) acting on RNA
          via RNase H, splice modulation, or steric blockade
        meaning: NCIT:C1291
        title: Antisense oligonucleotide
        aliases:
        - Antisense Oligonucleotides
      SIRNA:
        text: SIRNA
        description: Small interfering RNA or other double-stranded RNAi therapeutic
        meaning: NCIT:C2191
        title: siRNA / RNAi
        aliases:
        - Small Interfering RNA
      MRNA_THERAPY:
        text: MRNA_THERAPY
        description: Therapeutic messenger RNA delivering a functional transcript
          (excludes prophylactic mRNA vaccines, see VACCINE)
        title: mRNA therapy
        comments:
        - No generic "mRNA therapy" class exists in the configured ontologies; left
          unmapped
      GENE_THERAPY:
        text: GENE_THERAPY
        description: Gene addition/replacement therapy (e.g., AAV- or lentivirus-delivered
          transgene)
        meaning: NCIT:C15238
        aliases:
        - Gene Therapy
      GENE_EDITING:
        text: GENE_EDITING
        description: In vivo or ex vivo genome editing (e.g., CRISPR/Cas, base or
          prime editing)
        comments:
        - No generic "gene/genome editing" class in the configured ontologies (only
          narrower CRISPR Gene Editing NCIT:C200340); left unmapped
      CELL_THERAPY:
        text: CELL_THERAPY
        description: Cell-based therapy (e.g., CAR-T, stem cell transplantation, engineered
          cells)
        meaning: NCIT:C70601
        aliases:
        - Cellular Therapy
      PROTEIN_REPLACEMENT:
        text: PROTEIN_REPLACEMENT
        description: Recombinant protein or enzyme replacement therapy
        meaning: NCIT:C16221
        aliases:
        - Protein Replacement Therapy
      PEPTIDE:
        text: PEPTIDE
        description: Therapeutic peptide or peptide analog
        meaning: CHEBI:16670
        aliases:
        - peptide
      VACCINE:
        text: VACCINE
        description: Prophylactic or therapeutic vaccine
        meaning: NCIT:C923
        aliases:
        - Vaccine
      RADIOTHERAPY:
        text: RADIOTHERAPY
        description: Radiation-based therapy
        meaning: NCIT:C15313
        aliases:
        - Radiation Therapy
      SURGERY:
        text: SURGERY
        description: Surgical or procedural intervention
        meaning: NCIT:C15329
        aliases:
        - Surgical Procedure
      DEVICE:
        text: DEVICE
        description: Implanted or external therapeutic device
        meaning: NCIT:C16830
        aliases:
        - Medical Device
      BEHAVIORAL:
        text: BEHAVIORAL
        description: Non-pharmacologic behavioral, physical, dietary, or lifestyle
          intervention
        comments:
        - Intentionally broad (behavioral/physical/dietary/lifestyle); no single faithful
          ontology class, left unmapped
      OTHER:
        text: OTHER
        description: Modality not covered by the above categories
  AsoMechanismEnum:
    name: AsoMechanismEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AsoMechanismEnum
    description: Molecular mechanism of action of an antisense oligonucleotide, following
      the three core ASO paradigms (RNase H-mediated degradation, splice modulation,
      and steric blockade) described in Sang et al. 2024 (PMID:38914784).
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      RNASE_H_KNOCKDOWN:
        text: RNASE_H_KNOCKDOWN
        description: ASO:RNA heteroduplex recruits RNase H1 to cleave the target mRNA,
          reducing a toxic or gain-of-function protein
        meaning: GO:0004523
        title: RNase H knockdown
        aliases:
        - RNA-DNA hybrid ribonuclease activity
      SPLICE_MODULATION_EXON_SKIPPING:
        text: SPLICE_MODULATION_EXON_SKIPPING
        description: ASO occludes a splice site or splicing element to exclude an
          exon, restoring an in-frame transcript (e.g., DMD exon skipping)
        title: Splice modulation (exon skipping)
      SPLICE_MODULATION_EXON_INCLUSION:
        text: SPLICE_MODULATION_EXON_INCLUSION
        description: ASO blocks an intronic splicing silencer to promote exon inclusion
          (e.g., nusinersen at SMN2 ISS-N1)
        title: Splice modulation (exon inclusion)
      STERIC_BLOCKADE:
        text: STERIC_BLOCKADE
        description: ASO sterically blocks ribosome access or other RNA-protein interactions
          without inducing cleavage (e.g., fomivirsen)
        title: Steric translational blockade
      MIRNA_MODULATION:
        text: MIRNA_MODULATION
        description: ASO sequesters or inhibits a microRNA (antimiR) or blocks a miRNA
          binding site
        title: miRNA modulation
  AsoChemistryEnum:
    name: AsoChemistryEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AsoChemistryEnum
    description: Backbone / sugar chemistry of an antisense oligonucleotide. Determines
      nuclease resistance, binding affinity, and whether the ASO supports RNase H
      recruitment (gapmer designs) or acts purely by steric occupancy.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      PHOSPHOROTHIOATE:
        text: PHOSPHOROTHIOATE
        description: Phosphorothioate (PS) backbone modification conferring nuclease
          resistance; common base chemistry for RNase H ASOs
        meaning: CHEBI:76674
        title: Phosphorothioate backbone
        aliases:
        - phosphorothioate oligonucleotide
      PHOSPHORODIAMIDATE_MORPHOLINO:
        text: PHOSPHORODIAMIDATE_MORPHOLINO
        description: Morpholino backbone (PMO); charge-neutral, steric-block/splice-switching
          chemistry (e.g., eteplirsen, golodirsen)
        title: Phosphorodiamidate morpholino (PMO)
      TWO_PRIME_O_METHYL:
        text: TWO_PRIME_O_METHYL
        description: 2'-O-methyl (2'-OMe) ribose modification
        title: 2'-O-methyl
      TWO_PRIME_O_METHOXYETHYL:
        text: TWO_PRIME_O_METHOXYETHYL
        description: 2'-O-methoxyethyl (2'-MOE) ribose modification (e.g., nusinersen,
          inotersen, eplontersen)
        title: 2'-O-methoxyethyl (2'-MOE)
      LOCKED_NUCLEIC_ACID:
        text: LOCKED_NUCLEIC_ACID
        description: Locked nucleic acid bridged-bicyclic sugar modification
        title: Locked nucleic acid (LNA)
      CONSTRAINED_ETHYL:
        text: CONSTRAINED_ETHYL
        description: Constrained ethyl (cEt) bridged sugar modification
        title: Constrained ethyl (cEt)
      OTHER:
        text: OTHER
        description: Chemistry not covered by the above categories
  AsoConjugationEnum:
    name: AsoConjugationEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AsoConjugationEnum
    description: Targeting ligand or conjugate attached to an antisense oligonucleotide
      to direct tissue uptake or improve pharmacokinetics.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      UNCONJUGATED:
        text: UNCONJUGATED
        description: No targeting conjugate (naked ASO)
      GALNAC:
        text: GALNAC
        description: Tri-antennary N-acetylgalactosamine conjugate for hepatocyte
          (ASGR-mediated) uptake (e.g., eplontersen, olezarsen)
        meaning: CHEBI:28037
        title: GalNAc-conjugated
        aliases:
        - N-acetyl-D-galactosamine
      LIPID:
        text: LIPID
        description: Lipid or fatty-acid conjugate
      PEPTIDE:
        text: PEPTIDE
        description: Cell-penetrating or targeting peptide conjugate
      ANTIBODY:
        text: ANTIBODY
        description: Antibody-oligonucleotide conjugate (AOC) for receptor-targeted
          delivery
      OTHER:
        text: OTHER
        description: Conjugate not covered by the above categories
  MechanisticHypothesisStatusEnum:
    name: MechanisticHypothesisStatusEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/MechanisticHypothesisStatusEnum
    description: Curation/maturity status for a disease-level mechanistic hypothesis
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      CANONICAL:
        text: CANONICAL
        description: Widely accepted explanatory model used as the default disease
          mechanism
      ALTERNATIVE:
        text: ALTERNATIVE
        description: Plausible competing or superimposed hypothesis with supporting
          evidence
      EMERGING:
        text: EMERGING
        description: Early-stage hypothesis with limited or recently reported evidence
      DEPRECATED:
        text: DEPRECATED
        description: Historical hypothesis no longer supported as the current model
  BiologicalScaleEnum:
    name: BiologicalScaleEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/BiologicalScaleEnum
    description: "Biological scale of the substrate a pathophysiology node describes.\
      \ A tag capturing which level of biological organisation the node is primarily\
      \ situated at \u2014 molecular, cellular, tissue/organ, or organism. Each value\
      \ covers both ongoing processes AND persistent states at that scale (a fusion\
      \ protein exists / a cell population accumulates / an ectopic tissue persists\
      \ / a metabolite is chronically elevated). See projects/PATHOPHYSIOLOGY_SCALE_FEASIBILITY.md\
      \ for the survey that led to this enum design."
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      MOLECULAR:
        text: MOLECULAR
        description: "Molecular scale \u2014 molecular activities (kinase activity,\
          \ transcription factor binding, ion transport, catalysis) or molecular states\
          \ (a fusion protein exists, a chemical accumulates, an enzyme is functionally\
          \ deficient, a gene carries a variant burden). Substrate is a molecule,\
          \ complex, or genetic element."
      CELLULAR:
        text: CELLULAR
        description: "Cellular scale \u2014 cellular processes (differentiation, apoptosis,\
          \ autophagy, intracellular signaling) or cellular states (a cell population\
          \ is in a maintained aberrant condition, an organelle is structurally disrupted,\
          \ a cell type has accumulated). Substrate is a single cell or cell type."
      TISSUE:
        text: TISSUE
        description: "Tissue / organ scale \u2014 tissue processes (inflammation,\
          \ fibrosis, granuloma formation, neoplastic outgrowth) or tissue states\
          \ (an ectopic tissue persists, an organ is malformed, a structural lesion\
          \ exists). Substrate is a tissue, organ, or anatomical structure."
      ORGANISM:
        text: ORGANISM
        description: "Organism scale \u2014 systemic / multi-organ / whole-body processes\
          \ (DIC, cytokine storm, fever, cachexia) or systemic states (a metabolite\
          \ is chronically elevated, the microbiome is dysbiotic, a syndromic developmental\
          \ phenotype bundles multi-organ features). Substrate is the whole organism."
  DiscussionKindEnum:
    name: DiscussionKindEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/DiscussionKindEnum
    description: Kind of unresolved/in-progress item captured by a Discussion. Discussions
      are thread-like objects that record open questions, controversies, curation
      todos, emerging hypotheses, or interpretation debates attached to a disease
      entry or sub-object. Knowledge gaps are represented as a discussion kind so
      they can reuse the existing pointer, evidence, and lifecycle machinery, while
      optional proposed experiments capture how a gap could be resolved.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      OPEN_QUESTION:
        text: OPEN_QUESTION
        description: An unresolved scientific question posed by curators or experts
      KNOWLEDGE_GAP:
        text: KNOWLEDGE_GAP
        description: A missing causal, evidentiary, model-system, or translational
          assertion whose resolution would materially improve the disease mechanism
          model
      CONTROVERSY:
        text: CONTROVERSY
        description: A live disagreement or competing interpretation between published
          positions
      CURATION_TODO:
        text: CURATION_TODO
        description: A curation task captured inline (e.g., "phenotype needs HPO term
          refinement")
      EMERGING_HYPOTHESIS:
        text: EMERGING_HYPOTHESIS
        description: A recently reported hypothesis under active discussion in the
          community
      INTERPRETATION:
        text: INTERPRETATION
        description: A discussion about how to interpret existing evidence or model
          an edge
      HUMAN_MODEL_MISMATCH:
        text: HUMAN_MODEL_MISMATCH
        description: "A knowledge gap where model-system evidence exists but its fidelity\
          \ to human disease-relevant biology is uncertain \u2014 the model may recapitulate\
          \ a proximal mechanism or phenotype only partially, or the relevant human\
          \ cell type (e.g., outer radial glia) or anatomy (e.g., gyrencephalic cortex)\
          \ is absent from the model. Distinct from KNOWLEDGE_GAP (which covers any\
          \ missing assertion) in that some mechanistic evidence exists but translational\
          \ validity is the open question. Use when a curator wants to flag that model-organism,\
          \ organoid, or in vitro data support a node but it is unclear whether the\
          \ same mechanism operates in the human disease context."
  DiscussionStatusEnum:
    name: DiscussionStatusEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/DiscussionStatusEnum
    description: Lifecycle status for a Discussion
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      OPEN:
        text: OPEN
        description: Posed but not yet under active discussion
      UNDER_DISCUSSION:
        text: UNDER_DISCUSSION
        description: Actively being discussed in one or more linked venues
      RESOLVED:
        text: RESOLVED
        description: Closed with a documented resolution; kept for provenance
      ARCHIVED:
        text: ARCHIVED
        description: No longer active and not resolved (deferred, stale, or superseded)
  ComorbidityDirectionEnum:
    name: ComorbidityDirectionEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ComorbidityDirectionEnum
    description: Directionality of a comorbidity/trajectory association
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      A_BEFORE_B:
        text: A_BEFORE_B
        description: A precedes B
      B_BEFORE_A:
        text: B_BEFORE_A
        description: B precedes A
      BIDIRECTIONAL:
        text: BIDIRECTIONAL
        description: Evidence supports both directions
      SAME_TIME:
        text: SAME_TIME
        description: Co-incident or same-time association
      UNKNOWN:
        text: UNKNOWN
        description: Directionality is unknown or not established
  ComorbidityEffectDirectionEnum:
    name: ComorbidityEffectDirectionEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ComorbidityEffectDirectionEnum
    description: The sign (effect direction) of a comorbidity/trajectory association
      - whether the presence of one condition raises or lowers the risk, incidence,
      or severity of the other. This is orthogonal to ComorbidityDirectionEnum, which
      captures only the temporal ordering (which condition comes first), not whether
      the effect is positive or inverse. A conventional risk comorbidity (A increases
      risk of B) is RISK; the cancer/Alzheimer's-disease inverse correlation is PROTECTIVE.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      RISK:
        text: RISK
        description: 'Positive association: the presence of one condition increases
          the risk, incidence, or severity of the other. This is the conventional
          comorbidity direction and the default for most curated pairs.'
        title: Risk (positive) association
      PROTECTIVE:
        text: PROTECTIVE
        description: 'Inverse association: the presence of one condition is associated
          with a reduced risk or incidence of the other (e.g., the reciprocal cancer/Alzheimer''s-disease
          inverse correlation, atopy and glioma, balancing-selection heterozygote
          advantage). Quantitatively an odds ratio / hazard ratio / relative risk
          below 1.'
        title: Protective (inverse) association
      MIXED:
        text: MIXED
        description: 'The effect direction is not uniform: it is protective in some
          contexts (subtype, direction, population) and risk-conferring in others
          (e.g., Parkinson''s disease shows an inverse association with most cancers
          but a positive association with melanoma). Use the per-signal effect_direction
          and notes to record the split.'
        title: Mixed / direction-dependent association
      NO_ASSOCIATION:
        text: NO_ASSOCIATION
        description: Evidence indicates no significant association in either direction
          (a null result). Useful for recording examined-but-refuted pairs.
        title: No association
      UNKNOWN:
        text: UNKNOWN
        description: The effect direction (risk vs. protective) has not been established.
  CurationStatusEnum:
    name: CurationStatusEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/CurationStatusEnum
    description: Curation workflow status for an association
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      CANDIDATE:
        text: CANDIDATE
        description: Prioritized for curation
      IN_PROGRESS:
        text: IN_PROGRESS
        description: Curation in progress
      CURATED:
        text: CURATED
        description: Curated with literature-backed evidence
      DEFERRED:
        text: DEFERRED
        description: Deferred or deprioritized
  AssociationSignalSourceEnum:
    name: AssociationSignalSourceEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AssociationSignalSourceEnum
    description: Source of an association signal

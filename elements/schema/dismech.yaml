  TreatmentDescriptor:
    name: TreatmentDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/TreatmentDescriptor
    description: A descriptor for treatments/medical actions, bindable to NCIT clinical
      interventions
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - TreatmentDescriptor_therapeutic_agent
    - TreatmentDescriptor_dietary_modifications
    - TreatmentDescriptor_term
    slot_usage:
      term:
        name: term
        description: Optional NCIT treatment term reference
        bindings:
        - range: TreatmentActionTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
      therapeutic_agent:
        name: therapeutic_agent
        description: The drug(s) or chemical agent(s) used in this treatment. Use
          when the treatment term is generic (e.g., pharmacotherapy NCIT:C15986) but
          specific drugs are involved.
        comments:
        - Prefer CHEBI terms for specific drugs (e.g., CHEBI:15365 for aspirin)
        - Use NCIT for drug classes when specific CHEBI term unavailable
      dietary_modifications:
        name: dietary_modifications
        description: The food or beverage additions, restrictions, avoidances, or
          substitutions that define a dietary intervention.
        comments:
        - Best used when treatment_term is a dietary or nutritional intervention (for
          example NCIT:C15447 dietary intervention)
        - Use FOODON-backed foods or beverages rather than abstract nutrients where
          possible
    class_uri: dismech:TreatmentDescriptor

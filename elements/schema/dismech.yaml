    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      KNOWN_TO_PREDICT_CLINICAL_BENEFIT:
        text: KNOWN_TO_PREDICT_CLINICAL_BENEFIT
        description: FDA table approval context indicates the endpoint is known to
          predict clinical benefit for the curated context
        title: Known to predict clinical benefit
      REASONABLY_LIKELY_TO_PREDICT_CLINICAL_BENEFIT:
        text: REASONABLY_LIKELY_TO_PREDICT_CLINICAL_BENEFIT
        description: FDA table approval context indicates the endpoint is reasonably
          likely to predict clinical benefit
        title: Reasonably likely to predict clinical benefit
      CONTEXT_DEPENDENT:
        text: CONTEXT_DEPENDENT
        description: Clinical-benefit linkage depends on context of use and approval
          pathway
        title: Context dependent
  SurrogateEndpointFootnoteEnum:

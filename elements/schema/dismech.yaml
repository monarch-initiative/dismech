  AssociationMetricTypeEnum:
    name: AssociationMetricTypeEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AssociationMetricTypeEnum
    description: Type of association metric
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      OR:
        text: OR
        description: Odds ratio
      AOR:
        text: AOR

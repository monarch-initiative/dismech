        description: Biomarker presence or absence, rather than monotonic level, is
          the interpretable signal
        title: Present/absent
      THRESHOLD_DEPENDENT:
        text: THRESHOLD_DEPENDENT
        description: Interpretation depends on threshold, range, genotype, assay,
          or clinical context

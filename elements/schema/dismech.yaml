      \ per the Nosology of Genetic Skeletal Disorders (2023 revision, 11th edition;\
      \ Unger et al., PMID:36779427), which supersedes the 2019 revision (PMID:31633310).\
      \ Record the provenance \u2014 which revision, the group number/name, and the\
      \ listed disorder name where it differs from the dismech entry name \u2014 in\
      \ ``notes``. Assignments may legitimately cite either revision while the 2019-derived\
      \ backfill is being re-verified against the 2023 table; the ``notes`` must say\
      \ which one."

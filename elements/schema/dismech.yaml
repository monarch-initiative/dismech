            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:RegimenDescriptor
  ExposureDescriptor:
    name: ExposureDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExposureDescriptor
    description: A descriptor for exposure events, bindable to ECTO or XCO
    comments:
    - Use ECTO (Environmental Conditions, Treatments, and Exposures Ontology) for
      general exposures
    - Use XCO (Experimental Conditions Ontology) for experimental exposure conditions
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - ExposureDescriptor_term
    slot_usage:
      term:
        name: term
        description: Optional ECTO/XCO exposure term reference
        bindings:
        - range: ExposureTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:ExposureDescriptor
  EnvironmentDescriptor:
    name: EnvironmentDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/EnvironmentDescriptor
    description: A descriptor for environmental contexts/settings, bindable to ENVO
    comments:
    - Use ENVO (Environment Ontology) for habitats, biomes, and environmental features
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - EnvironmentDescriptor_term
    slot_usage:
      term:
        name: term
        description: Optional ENVO environment term reference
        bindings:
        - range: EnvironmentTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:EnvironmentDescriptor
  FoodDescriptor:
    name: FoodDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/FoodDescriptor
    description: A descriptor for foods, beverages, nutrients, minerals, and supplements,
      bindable to FOODON or CHEBI
    comments:
    - Use FOODON for specific foods, beverages, food products, and dietary sources
    - Use CHEBI when the dietary target is an exact nutrient, mineral, vitamin, or
      supplement
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - FoodDescriptor_term
    slot_usage:
      term:
        name: term
        description: Optional FOODON or CHEBI dietary entity term reference
        bindings:
        - range: FoodTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:FoodDescriptor
  OrganismDescriptor:
    name: OrganismDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/OrganismDescriptor
    description: A descriptor for organisms, bindable to NCBITaxon
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - OrganismDescriptor_term
    slot_usage:
      term:
        name: term
        description: NCBITaxon term reference
        bindings:
        - range: OrganismTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:OrganismDescriptor
  HostDescriptor:
    name: HostDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/HostDescriptor
    description: A descriptor for hosts in an infectious agent life cycle
    comments:
    - Use role for definitive, intermediate, reservoir, accidental, or paratenic host
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: OrganismDescriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - OrganismDescriptor_term
    - role
    class_uri: dismech:HostDescriptor
  SampleTypeDescriptor:
    name: SampleTypeDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/SampleTypeDescriptor
    description: A descriptor for biological sample types (tissue and/or cell type)
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - term
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - tissue_term
    - cell_type_term
    class_uri: dismech:SampleTypeDescriptor
  GeneticContext:
    name: GeneticContext
    definition_uri: https://w3id.org/monarch-initiative/dismech/GeneticContext
    description: A structured description of a genetic context that modifies phenotype
      frequency, severity, or presentation. Flexible enough to capture single genes,
      multiple genes, mutation types, zygosity, complementation groups, and complex
      genotypes. The description slot accommodates contexts that don't fit neatly
      into the structured fields (e.g., structural variants, complex rearrangements).
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - gene
    - genes
    - allele_type
    - variant_origin
    - allelic_hit_role
    - allelic_events
    - zygosity
    - functional_impact
    - functional_impact_category
    - complementation_group
    - description
    - notes
    class_uri: dismech:GeneticContext
  OnsetDescriptor:
    name: OnsetDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/OnsetDescriptor
    description: Structured description of age of onset. Combines an HPO onset category
      with optional quantitative age data and notes.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - onset_category
    - mean_age_years
    - min_age_years
    - max_age_years
    - notes
    class_uri: dismech:OnsetDescriptor
  PhenotypeContext:
    name: PhenotypeContext
    definition_uri: https://w3id.org/monarch-initiative/dismech/PhenotypeContext
    description: 'A context-specific annotation qualifying how a phenotype manifests
      under particular conditions. Each context can specify a genetic context, demographic
      stratum, or disease subtype, along with frequency, severity, onset, and supporting
      evidence specific to that context.

      When no context qualifier slots are set (no genetic_context, sex, population,
      age_range, or subtype), the context provides evidence for the overall/default
      frequency claim, addressing the evidence separation problem (issue #112).'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - frequency
    - severity
    - onset
    - notes
    - PhenotypeContext_evidence
    - genetic_context
    - PhenotypeContext_sex
    - population
    - age_range
    - subtype
    slot_usage:
      sex:
        name: sex
        range: SexEnum
      evidence:
        name: evidence
        description: Evidence supporting the frequency, severity, or onset claims
          made in this specific context. Distinct from the D2P evidence on the parent
          Phenotype.
    class_uri: dismech:PhenotypeContext
  Dataset:
    name: Dataset
    definition_uri: https://w3id.org/monarch-initiative/dismech/Dataset
    description: A reference to a publicly available omics or phenotype dataset
    comments:
    - Supports GEO, ArrayExpress, SRA, dbGaP, GTEx, ENCODE, MorPhiC, phenopacket-store,
      and other repositories
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - accession
    - title
    - Dataset_description
    - organism
    - data_type
    - sample_types
    - sample_count
    - conditions
    - exposures
    - genes
    - platform
    - publication
    - findings
    - evidence
    - notes
    slot_usage:
      description:
        name: description
        description: A description of the dataset. This may typically be redundant
          with the `title` slot, but the description is more human-readable and may
          be used to communicate nuances not captured by the rigid standardization
          of the title slot.
        recommended: true
    class_uri: dismech:Dataset
  ExperimentalModel:
    name: ExperimentalModel
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExperimentalModel
    description: "A disease-relevant non-animal experimental model system \u2014 a\
      \ New Approach Methodology (NAM) such as an organoid, organ-on-chip, cell line,\
      \ iPSC-derived model, or primary culture. This is a disease-centric bridge class\
      \ inspired by NAMO, intended to capture the model itself while keeping dismech\
      \ focused on disease mechanisms rather than study-level model registries."
    comments:
    - 'Whole-organism animal models belong in `animal_models` as AnimalModel, which
      carries the same `modeled_mechanisms` pathograph link. Do not route an animal
      model here via `experimental_model_type: OTHER`.'
    - Use `namo_type` to map to a corresponding NAMO class when applicable
    - Prefer `experimental_model_type` for broad local categorization and `description`
      or `notes` for disease-specific nuance
    - Use `cell_source` to record whether the system is patient-derived, iPSC-derived,
      primary, immortalized, or mixed
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - description
    - experimental_model_type
    - namo_type
    - organism
    - tissue_term
    - cell_types
    - conditions
    - cell_source
    - culture_system
    - publication
    - modeled_mechanisms
    - findings
    - evidence
    - notes
    class_uri: dismech:ExperimentalModel
  Experiment:
    name: Experiment
    definition_uri: https://w3id.org/monarch-initiative/dismech/Experiment
    description: 'A structured experiment or protocol-level study design that can
      be proposed to resolve a knowledge gap, or later reused to represent experiments
      that have been carried out. The object itself is intentionally status-neutral:
      proposal, execution, and evidentiary status are expressed by the containing
      slot or future evidence context.'
    comments:
    - In `Discussion.proposed_experiments`, the containing slot means the experiment
      is proposed as a response to an open question or knowledge gap.
    - Use `model_systems` for NAMO-aligned models, `perturbations` for pathograph/gene/chemical/exposure
      manipulations, and `readouts` for ontology-backed outcome or mechanism measurements.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - Experiment_experiment_id
    - name
    - description
    - experiment_type
    - model_systems
    - Experiment_perturbations
    - Experiment_assays
    - Experiment_readouts
    - controls
    - decision_criterion
    - would_support
    - would_refute
    - supporting_outcome
    - refuting_outcome
    - protocol_reference
    - datasets
    - Experiment_evidence
    - notes
    slot_usage:
      experiment_id:
        name: experiment_id
        required: true
      perturbations:
        name: perturbations
        description: Interventions or manipulations applied in the experiment. These
          may target disease pathograph nodes, genes, chemical entities, treatments,
          exposures, triggers, or biological processes.
        range: ExperimentalPerturbation
        inlined_as_list: true
      readouts:
        name: readouts
        description: Measurements or outcomes interpreted against disease pathograph
          nodes, phenotypes, biomarkers, or biological processes.
        range: ExperimentalReadout
        inlined_as_list: true
      assays:
        name: assays
        description: Ontology-backed assays used by the experiment; prefer OBI terms
          when available.
      evidence:
        name: evidence
        description: Literature, protocol papers, or dataset evidence supporting the
          feasibility, precedent, or design rationale for this experiment.
        recommended: false
    class_uri: dismech:Experiment
  ExperimentalPerturbation:
    name: ExperimentalPerturbation
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExperimentalPerturbation
    description: A structured perturbation, intervention, or exposure used in an experiment.
      Prefer ontology-backed descriptors for genes, chemicals, treatments, exposures,
      triggers, and biological processes rather than plain string lists.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - description
    - ExperimentalPerturbation_target
    - gene
    - genes
    - chemical_entities
    - treatment_term
    - exposure_term
    - triggers
    - biological_processes
    - effect
    - evidence
    - notes
    slot_usage:
      target:
        name: target
        description: Entity reference for the pathograph node, phenotype, gene, or
          other modeled object being perturbed. Uses the same hash-anchor grammar
          as `attaches_to` when pointing into a disease entry.
    class_uri: dismech:ExperimentalPerturbation
  ExperimentalReadout:
    name: ExperimentalReadout
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExperimentalReadout
    description: A structured readout or outcome measured in an experiment or reported
      by a model. Use descriptor slots to ground readouts to phenotypes, biomarkers,
      biological processes, and assays.
    comments:
    - Reached from Experiment.readouts for a proposed or executed experiment, and
      from ModelMechanismLink.readouts for the outcome measures a curated model reports
      on a pathophysiology node. Reusing one class keeps a proposed experiment and
      a realized model directly comparable.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - description
    - ExperimentalReadout_target
    - phenotype_term
    - biomarker_term
    - biological_processes
    - assays
    - ExperimentalReadout_direction
    - ExperimentalReadout_interpretation
    - evidence
    - notes
    slot_usage:
      target:
        name: target
        description: Entity reference for the pathograph node, phenotype, or other
          modeled object that this readout measures or adjudicates.
      direction:
        name: direction
        description: Direction of the measured or expected effect. Accepts ModelReadoutDirectionEnum
          (INCREASED, DECREASED, UNCHANGED, RESTORED, ABOLISHED, ALTERED) for an experimental
          measurement relative to its comparator, and BiomarkerReadoutDirectionEnum
          for a readout expressed as the direction of association with an endpoint.
          Prefer the model enum for a measurement made in a model system.
        range: Any
        any_of:
        - range: ModelReadoutDirectionEnum
        - range: BiomarkerReadoutDirectionEnum
      interpretation:
        name: interpretation
        description: Curator-facing explanation of how this readout would be interpreted
          relative to the experiment's decision criterion, or of what the measured
          value says about the linked mechanism.
    class_uri: dismech:ExperimentalReadout
  ExperimentalControl:
    name: ExperimentalControl
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExperimentalControl
    description: A comparator or control condition for an experiment, such as an isogenic
      wild-type line, mock perturbation, vehicle control, rescue arm, or untreated
      disease model.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - description
    - model_systems
    - ExperimentalControl_perturbations
    - evidence
    - notes
    slot_usage:
      perturbations:
        name: perturbations
        range: ExperimentalPerturbation
        inlined_as_list: true
    class_uri: dismech:ExperimentalControl
  ClinicalTrial:
    name: ClinicalTrial
    definition_uri: https://w3id.org/monarch-initiative/dismech/ClinicalTrial
    description: A clinical trial relevant to treatment or research of a disease
    comments:
    - Uses NCT identifiers from ClinicalTrials.gov
    - Evidence and supporting text can be validated via linkml-reference-validator
      against ClinicalTrials.gov API
    - For a trial with no ClinicalTrials.gov registration, use its WHO ICTRP identifier
      (ChiCTR2100045397, ISRCTN67795930, CTRI/2021/05/033585, ...) as the name and
      cite ICTRP:<TrialID> in evidence; the record is cached by `just ictrp-fetch
      <TrialID>`. See docs/ictrp.md.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - ClinicalTrial_name
    - ClinicalTrial_description
    - ClinicalTrial_phase
    - ClinicalTrial_status
    - ClinicalTrial_evidence
    - target_phenotypes
    - notes
    - review_notes
    slot_usage:
      name:
        name: name
        description: NCT identifier (e.g., NCT00000001), WHO ICTRP identifier for
          a trial registered outside ClinicalTrials.gov (e.g., ChiCTR2100045397, ISRCTN67795930),
          or trial name
        identifier: false
      description:
        name: description
        description: Brief summary or key details of the clinical trial
        recommended: true
      phase:
        name: phase
        description: 'Trial phase. Enum-bound: use PHASE_I, PHASE_II, PHASE_III, PHASE_IV,
          or NOT_APPLICABLE, not the prose spellings ("Phase III").'
        examples:
        - value: PHASE_III
        - value: NOT_APPLICABLE
        range: ClinicalTrialPhaseEnum
        recommended: true
      status:
        name: status
        description: 'Recruitment or trial status. Enum-bound: use RECRUITING, NOT_RECRUITING,
          ACTIVE_NOT_RECRUITING, COMPLETED, ENROLLING_BY_INVITATION, SUSPENDED, TERMINATED,
          WITHDRAWN, or UNKNOWN, not the prose spellings ("Completed").'
        examples:
        - value: COMPLETED
        - value: RECRUITING
        range: ClinicalTrialStatusEnum
        recommended: true
      evidence:
        name: evidence
        description: Supporting evidence with snippets from trial documentation
        recommended: false
    class_uri: dismech:ClinicalTrial
  ComputationalModel:
    name: ComputationalModel
    definition_uri: https://w3id.org/monarch-initiative/dismech/ComputationalModel
    description: A computational or in-silico model relevant to understanding disease
      mechanisms
    comments:
    - Covers genome-scale metabolic models, FBA, kinetic models, digital twins, and
      ML models
    - Perturbations track gene knockouts or parameter changes used to simulate the
      disease
    - Findings capture key predictions or insights the model can generate
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - description
    - model_type
    - repository_url
    - model_id
    - base_model
    - perturbations
    - variables
    - modeled_mechanisms
    - model_software
    - model_format
    - publication
    - findings
    - evidence
    - notes
    class_uri: dismech:ComputationalModel
  ModelVariable:
    name: ModelVariable
    definition_uri: https://w3id.org/monarch-initiative/dismech/ModelVariable
    description: A variable in a computational model, identified by a human-readable
      name, with an optional dataset_identifier for the native name in the model file
      and ontology term mappings (e.g., LOINC for clinical observables, CHEBI for
      metabolites, HP for phenotypic readouts).
    comments:
    - Use 'name' for human-readable display (e.g., "Plasma Calcium")
    - Use 'dataset_identifier' for the native model name (e.g., SBML species "P",
      COBRA reaction "R_0001")
    - Map to LOINC codes for clinical lab measurements to link model outputs to CDEs
    - Map to CHEBI for metabolite variables, HP for phenotypic readouts
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - dataset_identifier
    - description
    - unit
    - mappings_list
    - notes
    class_uri: dismech:ModelVariable
  SeverityTier:
    name: SeverityTier
    definition_uri: https://w3id.org/monarch-initiative/dismech/SeverityTier
    description: A threshold-severity pair defining one tier in a severity scale
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - SeverityTier_threshold
    - SeverityTier_name
    slot_usage:
      threshold:
        name: threshold
        description: The variable value at which this severity tier activates
        required: true
      name:
        name: name
        description: Severity label (e.g., "mild", "moderate", "severe")
        required: true
    class_uri: dismech:SeverityTier
  ModelVariableDescriptor:
    name: ModelVariableDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/ModelVariableDescriptor
    description: A descriptor mapping a model variable to an ontology term (LOINC,
      CHEBI, HP, etc.). When the mapped term is an HP phenotype, optional threshold
      fields specify when the variable value activates that phenotype and at what
      severity.
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - ModelVariableDescriptor_threshold
    - ModelVariableDescriptor_threshold_direction
    - ModelVariableDescriptor_severity_scale
    - ModelVariableDescriptor_term
    slot_usage:
      term:
        name: term
        description: Ontology term reference (LOINC code, CHEBI term, HP term, etc.)
      threshold:
        name: threshold
        description: Value at which the mapped phenotype activates
      threshold_direction:
        name: threshold_direction
        description: Whether the phenotype activates above or below the threshold
      severity_scale:
        name: severity_scale
        description: Ordered severity tiers for graded phenotype activation
    class_uri: dismech:ModelVariableDescriptor
  DifferentialDiagnosis:
    name: DifferentialDiagnosis
    definition_uri: https://w3id.org/monarch-initiative/dismech/DifferentialDiagnosis
    description: A disease or condition that presents similarly to the focal disease
      and must be differentiated
    comments:
    - Documents diseases/conditions with overlapping clinical presentations
    - Includes distinguishing features to help differentiate from the focal disease
    - Essential for clinical diagnostic accuracy
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - DifferentialDiagnosis_description
    - phenotypes
    - DifferentialDiagnosis_distinguishing_features
    - evidence
    - DifferentialDiagnosis_notes
    - disease_term
    slot_usage:
      description:
        name: description
        description: Clinical or mechanistic overlaps, shared presentations, and diagnostic
          considerations with the focal disease
      distinguishing_features:
        name: distinguishing_features
        description: Key clinical, laboratory, imaging, or epidemiological features
          that help differentiate this condition from the focal disease
      notes:
        name: notes
        description: Additional clinical notes or management considerations
    class_uri: dismech:DifferentialDiagnosis
  Subtype:
    name: Subtype
    definition_uri: https://w3id.org/monarch-initiative/dismech/Subtype
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - display_name
    - subtype_term
    - mappings
    - description
    - evidence
    - review_notes
    - locations
    - geography
    - classification
    - children
    - genes
    - subtype_frequency
    - inheritance
    class_uri: dismech:Subtype
  EvidenceItem:
    name: EvidenceItem
    definition_uri: https://w3id.org/monarch-initiative/dismech/EvidenceItem
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - reference
    - reference_title
    - supports
    - evidence_source
    - snippet
    - explanation
    - images
    class_uri: dismech:EvidenceItem
  CausalEdge:
    name: CausalEdge
    definition_uri: https://w3id.org/monarch-initiative/dismech/CausalEdge
    description: A reference to a downstream effect or consequence in a causal relationship
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - target
    - description
    - CausalEdge_evidence
    - CausalEdge_hypothesis_groups
    - CausalEdge_causal_link_type
    - CausalEdge_intermediate_mechanisms
    slot_usage:
      evidence:
        name: evidence
        description: Evidence that supports this specific edge (not just the parent
          node-level claim)
      hypothesis_groups:
        name: hypothesis_groups
        description: One or more hypothesis IDs used to group edges within alternative
          or superimposed models
      causal_link_type:
        name: causal_link_type
        description: Encodes directness and whether omitted intermediates are known
          versus unknown
      intermediate_mechanisms:
        name: intermediate_mechanisms
        description: Free-text intermediates bridging source and target when using
          an indirect edge
    class_uri: dismech:CausalEdge
  TreatmentMechanismTarget:
    name: TreatmentMechanismTarget
    definition_uri: https://w3id.org/monarch-initiative/dismech/TreatmentMechanismTarget
    description: Links a treatment to a specific pathophysiology mechanism node it
      targets. Enables reasoning about which downstream phenotypes should respond
      to therapy and why resistance may emerge when the causal chain shifts.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - TreatmentMechanismTarget_target
    - treatment_effect
    - description
    - TreatmentMechanismTarget_evidence
    slot_usage:
      target:
        name: target
        description: Name of the pathograph node this treatment targets. Prefer a
          pathophysiology entry; phenotype targets are also allowed when the treatment
          is symptomatic and addresses a clinical manifestation directly rather than
          an upstream mechanism node (e.g., anti-seizure medications targeting "Seizures",
          baclofen targeting "Spasticity"). Must match a pathophysiology or phenotype
          name in the same disease file.
      evidence:
        name: evidence
        description: Evidence that this treatment targets this specific mechanism
    class_uri: dismech:TreatmentMechanismTarget
  EnvironmentalMechanismTarget:
    name: EnvironmentalMechanismTarget
    definition_uri: https://w3id.org/monarch-initiative/dismech/EnvironmentalMechanismTarget
    description: 'Links an environmental factor or exposure to a specific pathophysiology
      mechanism node it acts on. The environmental counterpart of TreatmentMechanismTarget:
      it places exposures inside the causal graph as upstream initiating (or protective)
      steps instead of leaving them as a disconnected disease-level list.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - EnvironmentalMechanismTarget_target
    - EnvironmentalMechanismTarget_environmental_effect
    - EnvironmentalMechanismTarget_causal_link_type
    - description
    - EnvironmentalMechanismTarget_evidence
    slot_usage:
      target:
        name: target
        description: Name of the pathograph node this environmental factor acts on.
          Prefer a pathophysiology entry; phenotype targets are also allowed when
          the exposure acts directly on a clinical manifestation rather than an upstream
          mechanism node. Must match a pathophysiology or phenotype name in the same
          disease file.
        required: true
      environmental_effect:
        name: environmental_effect
        description: How the exposure acts on the target. Omit only when the direction
          of effect is genuinely unstated in the cited evidence.
      causal_link_type:
        name: causal_link_type
        description: Whether the exposure acts directly on the target mechanism or
          through omitted (known or unknown) intermediates.
      evidence:
        name: evidence
        description: Evidence that this exposure acts on this specific mechanism
    class_uri: dismech:EnvironmentalMechanismTarget
  ModelMechanismLink:
    name: ModelMechanismLink
    definition_uri: https://w3id.org/monarch-initiative/dismech/ModelMechanismLink
    description: Links an experimental (NAM), animal, or computational model to a
      specific pathophysiology mechanism node, recording which facet of that mechanism
      the model recapitulates, perturbs, or reads out; how faithfully it does so;
      and the outcome measures that ground the claim.
    comments:
    - Two evidence layers, deliberately separate. Evidence on the link attests that
      the model is informative for the node; evidence on each readout attests that
      a specific measurement was made, in a specific direction.
    - Readouts belong on the link rather than on the model, because one model typically
      measures different things for different mechanism nodes.
    - A FAILS_TO_RECAPITULATE link is a substantive negative claim and should carry
      both `limitations` and `evidence`; it usually pairs with a HUMAN_MODEL_MISMATCH
      discussion.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - ModelMechanismLink_target
    - ModelMechanismLink_relationship
    - ModelMechanismLink_description
    - ModelMechanismLink_readouts
    - fidelity
    - limitations
    - ModelMechanismLink_evidence
    slot_usage:
      target:
        name: target
        description: Name of the pathophysiology entry this model is linked to. Must
          match a pathophysiology name in the same disease file.
      relationship:
        name: relationship
        description: 'What this model does to the linked mechanism: reproduces it,
          manipulates it, measures it, rescues it, or fails to reproduce it.'
        range: ModelMechanismRelationshipEnum
      description:
        name: description
        description: Brief assertion-level note describing what facet of the linked
          mechanism the model captures or assays.
      readouts:
        name: readouts
        description: Outcome measures through which this model reports on the linked
          mechanism, each optionally grounded to an OBI assay, an HP phenotype, a
          biomarker, or a GO process, with a measured direction and its own evidence.
          Each readout's own `target` is required and must repeat the link's `target`,
          so a readout stays self-describing when lifted out of its link by the graph
          and KGX exporters.
        range: ExperimentalReadout
        inlined_as_list: true
      evidence:
        name: evidence
        description: Evidence that this model is informative for the linked mechanism
        recommended: true
    class_uri: dismech:ModelMechanismLink
  BiomarkerReadout:
    name: BiomarkerReadout
    definition_uri: https://w3id.org/monarch-initiative/dismech/BiomarkerReadout
    description: Links a biochemical biomarker to a pathograph node that it measures,
      reflects, predicts, or pharmacodynamically reports on. This is an observational
      readout link, not a causal claim that the biomarker causes the target mechanism
      or phenotype.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - BiomarkerReadout_target
    - BiomarkerReadout_relationship
    - BiomarkerReadout_direction
    - BiomarkerReadout_endpoint_context
    - BiomarkerReadout_regulatory_endpoint_refs
    - BiomarkerReadout_interpretation
    - description
    - BiomarkerReadout_evidence
    slot_usage:
      target:
        name: target
        description: Name of the pathograph node this biomarker reports on. Prefer
          a pathophysiology entry; phenotype targets are also allowed when the biomarker
          is explicitly tied to a clinical manifestation.
        required: true
      relationship:
        name: relationship
        description: How the biomarker relates to the linked pathograph node.
        required: true
      direction:
        name: direction
        description: Direction of association between biomarker level/presence and
          the linked event or endpoint.
      endpoint_context:
        name: endpoint_context
        description: Diagnostic, prognostic, monitoring, pharmacodynamic, or candidate-surrogate
          use context.
      regulatory_endpoint_refs:
        name: regulatory_endpoint_refs
        description: Source-table regulatory endpoint row IDs linked to this readout.
          Keep regulatory details in the source table; use this field only as a local
          bridge from disease biology to regulatory context.
      interpretation:
        name: interpretation
        description: Human-readable interpretation of the link for display and curation
          review.
      evidence:
        name: evidence
        description: Evidence supporting this biomarker-to-pathograph-node readout
          link
    class_uri: dismech:BiomarkerReadout
  PhenotypeReadout:
    name: PhenotypeReadout
    definition_uri: https://w3id.org/monarch-initiative/dismech/PhenotypeReadout
    description: 'Links an investigation-readout phenotype (an abnormal electrophysiology,
      functional-test, or clinical-laboratory finding, e.g. HP:0000512 Abnormal electroretinogram)
      to the pathograph node whose underlying state it measures or reflects. This
      is an observational readout link, not a causal claim that the target mechanism
      causes the test result. It is the phenotype-side counterpart of BiomarkerReadout,
      deliberately lean: it omits the surrogate-endpoint/regulatory slots (regulatory_endpoint_refs
      and the source-table bridge) that belong only to molecular biomarker readouts.'
    comments:
    - Use on test-result phenotypes that report on an underlying mechanism rather
      than participating causally in the pathograph
    - READOUT_OF is the typical relationship; CORRELATES_WITH / PREDICTS also apply
    - Reuses the BiomarkerReadout relationship, direction, and endpoint-context vocabularies
      for consistency
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - PhenotypeReadout_target
    - PhenotypeReadout_relationship
    - PhenotypeReadout_direction
    - PhenotypeReadout_endpoint_context
    - PhenotypeReadout_interpretation
    - description
    - PhenotypeReadout_evidence
    slot_usage:
      target:
        name: target
        description: Name of the pathograph node this phenotype reports on. Prefer
          a pathophysiology entry; a phenotype target is also allowed when the readout
          is tied to another clinical manifestation.
        required: true
      relationship:
        name: relationship
        description: How the investigation readout relates to the linked pathograph
          node.
        required: true
      direction:
        name: direction
        description: Direction of association between the readout value/abnormality
          and the linked event or endpoint.
      endpoint_context:
        name: endpoint_context
        description: Diagnostic, prognostic, monitoring, pharmacodynamic, or candidate-surrogate
          use context.
      interpretation:
        name: interpretation
        description: Human-readable interpretation of the link for display and curation
          review.
      evidence:
        name: evidence
        description: Evidence supporting this phenotype-to-pathograph-node readout
          link
    class_uri: dismech:PhenotypeReadout
  ReferenceRangeBand:
    name: ReferenceRangeBand
    definition_uri: https://w3id.org/monarch-initiative/dismech/ReferenceRangeBand
    description: A single graded interpretation band within a reference range, mapping
      a value interval to a categorical clinical label (e.g., "Normal", "Mild", "Moderate",
      "Severe", "Critical"). Bands partition the measurement scale so a numeric result
      can be classified into a clinical category. This expresses the "above value
      X is mild, above value Y is moderate" style of graded result interpretation
      that a single normal interval cannot capture.
    comments:
    - Order bands from lowest to highest value when listing them
    - "Bands partition the scale half-open, [lower_bound, upper_bound) \u2014 lower_bound\
      \ inclusive, upper_bound exclusive \u2014 so adjacent bands sharing a boundary\
      \ value do not overlap"
    - Omit lower_bound for the lowest (open-below) band
    - Omit upper_bound for the highest (open-above) band
    - Use abnormal_flag to record normal/low/high/critical status per HL7/LOINC
    - Optionally map an abnormal band to an HP phenotype via phenotype_term (LOINC2HPO
      style)
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - ReferenceRangeBand_name
    - ReferenceRangeBand_lower_bound
    - ReferenceRangeBand_upper_bound
    - ReferenceRangeBand_unit
    - ReferenceRangeBand_abnormal_flag
    - ReferenceRangeBand_severity
    - ReferenceRangeBand_phenotype_term
    - ReferenceRangeBand_interpretation
    slot_usage:
      name:
        name: name
        description: Category label for this band (e.g., "Normal", "Mild", "Moderate",
          "Severe", "Critical high").
        required: true
      lower_bound:
        name: lower_bound
        description: Inclusive lower bound of this band's value interval. Omit for
          an open-below band (the lowest tier).
      upper_bound:
        name: upper_bound
        description: Exclusive upper bound of this band's value interval, so adjacent
          bands sharing a boundary value partition cleanly (a result exactly at the
          boundary falls in the next band, whose inclusive lower_bound equals it).
          Omit for an open-above band (the highest tier).
      unit:
        name: unit
        description: UCUM unit for this band's bounds. Usually matches the parent
          reference range; set only if it differs or for standalone clarity.
      abnormal_flag:
        name: abnormal_flag
        description: Normal/low/high/critical classification of results in this band,
          following HL7/LOINC abnormal-flag conventions.
      severity:
        name: severity
        description: Optional ordinal severity for this band when the category aligns
          with MILD/MODERATE/SEVERE grading.
      phenotype_term:
        name: phenotype_term
        description: Optional HP phenotype that an abnormal result in this band maps
          to (LOINC2HPO-style observation-to-phenotype linkage).
      interpretation:
        name: interpretation
        description: Free-text clinical interpretation of results that fall in this
          band.
    class_uri: dismech:ReferenceRangeBand
  ReferenceRange:
    name: ReferenceRange
    definition_uri: https://w3id.org/monarch-initiative/dismech/ReferenceRange
    description: A population reference interval for a clinical laboratory analyte.
      Captures the numeric normal range (lower and upper bounds), measurement unit
      in UCUM notation, and population qualifier. Provenance is carried by structured
      evidence items (the same EvidenceItem model used elsewhere in dismech), consistent
      with how all other assertions are attributed. Complements ModelVariableDescriptor
      thresholds (which define disease-model activation points) with empirically grounded
      clinical reference intervals.
    comments:
    - Use LOINC codes for loinc_term to enable cross-analyte queries
    - Use UCUM notation for unit (e.g., "mmol/L", "g/dL", "U/L")
    - population describes age group, sex, fasting state, or other stratifiers
    - Omit lower_bound or upper_bound when the interval is one-sided
    - Attribute the interval with evidence; use notes for non-citable provenance (e.g.,
      a lab manual)
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - ReferenceRange_loinc_term
    - ReferenceRange_lower_bound
    - ReferenceRange_upper_bound
    - ReferenceRange_unit
    - ReferenceRange_population
    - ReferenceRange_interpretation_bands
    - ReferenceRange_evidence
    - ReferenceRange_notes
    slot_usage:
      loinc_term:
        name: loinc_term
        description: LOINC code for the measured analyte (e.g., LOINC:2823-3 for serum
          potassium, LOINC:2777-1 for serum phosphate). Required for machine-queryable
          reference interval lookups.
        recommended: true
      interpretation_bands:
        name: interpretation_bands
        description: Ordered graded interpretation bands for this analyte (normal
          / mild / moderate / severe / critical). Use when a result is classified
          into categories beyond the single normal interval; order from lowest to
          highest value.
      lower_bound:
        name: lower_bound
        description: Lower bound of the reference interval (inclusive). Omit when
          there is no clinically meaningful lower limit (e.g., analytes where only
          elevation is abnormal).
      upper_bound:
        name: upper_bound
        description: Upper bound of the reference interval (inclusive). Omit when
          there is no clinically meaningful upper limit (e.g., analytes where only
          low values are abnormal).
      unit:
        name: unit
        description: UCUM unit string for the measured quantity (e.g., "mmol/L", "g/dL",
          "mIU/L"). Should match the unit used for lower_bound and upper_bound.
        recommended: true
      population:
        name: population
        description: Population or stratification qualifier for this interval (e.g.,
          "adults", "female 20-60y", "fasting", "pediatric 0-12mo"). Omit for universal
          adult reference ranges without stratification.
      evidence:
        name: evidence
        description: Structured evidence items attributing this reference interval
          (typically a clinical guideline or primary-study PMID/DOI, or a structured-source
          reference). Preferred over free-text provenance so reference ranges are
          held to the same evidentiary standard as other dismech assertions.
        recommended: true
      notes:
        name: notes
        description: Free-text provenance or caveats that are not a citable reference
          (e.g., a lab-manual interval such as "Tietz Clinical Guide 4th ed." or an
          assay-dependence note).
    class_uri: dismech:ReferenceRange
  SurrogateEndpoint:
    name: SurrogateEndpoint
    definition_uri: https://w3id.org/monarch-initiative/dismech/SurrogateEndpoint
    description: A regulatory surrogate endpoint assertion curated from FDA's surrogate
      endpoint table or a similar authoritative source. This captures an endpoint
      used as a substitute for direct clinical benefit in a specified disease/use,
      patient population, approval-pathway, and therapeutic mechanism context.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - SurrogateEndpoint_row_id
    - SurrogateEndpoint_source_table
    - SurrogateEndpoint_source_sheet
    - SurrogateEndpoint_source_row_number
    - SurrogateEndpoint_disease_or_use
    - SurrogateEndpoint_patient_population
    - SurrogateEndpoint_surrogate_endpoint
    - SurrogateEndpoint_approval_type
    - drug_mechanism_of_action
    - age_range
    - SurrogateEndpoint_endpoint_validation_level
    - SurrogateEndpoint_clinical_benefit_linkage
    - SurrogateEndpoint_clinical_benefit
    - clinical_benefit_linkage_basis
    - footnotes
    - context_of_use
    - SurrogateEndpoint_mapping_status
    - mapped_diseases
    - mapped_disease_files
    - mapping_notes
    - source_url
    - source_workbook_url
    - source_workbook_sha256
    - source_content_current_as_of
    - retrieved_date
    - evidence
    - notes
    slot_usage:
      row_id:
        name: row_id
        required: true
      source_table:
        name: source_table
        required: true
      source_sheet:
        name: source_sheet
        required: true
      source_row_number:
        name: source_row_number
        required: true
      disease_or_use:
        name: disease_or_use
        required: true
      patient_population:
        name: patient_population
        required: true
      surrogate_endpoint:
        name: surrogate_endpoint
        required: true
      approval_type:
        name: approval_type
        required: true
      endpoint_validation_level:
        name: endpoint_validation_level
        description: BEST-aligned level. For FDA-table rows this is derived from approval
          type unless a curator overrides it with more specific evidence.
        required: true
      clinical_benefit_linkage:
        name: clinical_benefit_linkage
        description: BEST-aligned relationship to clinical benefit. FDA table rows
          usually imply this via the approval pathway rather than naming a specific
          clinical outcome.
        required: true
      clinical_benefit:
        name: clinical_benefit
        description: Specific clinical benefit or clinical outcome predicted by the
          surrogate endpoint, when curated. FDA table rows may leave this blank.
      mapping_status:
        name: mapping_status
        required: true
    class_uri: dismech:SurrogateEndpoint
  SurrogateEndpointCollection:
    name: SurrogateEndpointCollection
    definition_uri: https://w3id.org/monarch-initiative/dismech/SurrogateEndpointCollection
    description: A source-level collection of curated regulatory surrogate endpoint
      assertions
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - SurrogateEndpointCollection_name
    - description
    - source_url
    - source_workbook_url
    - source_workbook_sha256
    - source_content_current_as_of
    - retrieved_date
    - SurrogateEndpointCollection_surrogate_endpoints
    - tracked_issues
    - notes
    slot_usage:
      name:
        name: name
        required: true
      surrogate_endpoints:
        name: surrogate_endpoints
        required: true
    class_uri: dismech:SurrogateEndpointCollection
  ProteinStructure:
    name: ProteinStructure
    definition_uri: https://w3id.org/monarch-initiative/dismech/ProteinStructure
    description: A 3D protein structure from PDB or AlphaFold relevant to understanding
      a treatment's mechanism of action. Enables embedded 3D visualization of drug-target
      interactions via Mol* viewer.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - proteinStructure__pdb_id
    - proteinStructure__description
    - proteinStructure__resolution_angstrom
    - proteinStructure__method
    - proteinStructure__ligand
    - proteinStructure__target_protein
    - proteinStructure__publication
    attributes:
      pdb_id:
        name: pdb_id
        description: PDB accession code (e.g., 3TCT) or AlphaFold identifier (e.g.,
          AF-P02766-F1). Used to construct viewer URLs and fetch structure data.
        range: string
        required: true
      description:
        name: description
        description: Brief description of what the structure shows (e.g., drug-target
          co-crystal)
        range: string
      resolution_angstrom:
        name: resolution_angstrom
        description: Structure resolution in angstroms (for experimental structures)
        range: float
      method:
        name: method
        description: Experimental method (X-ray, cryo-EM, NMR) or prediction method
          (AlphaFold)
        range: string
      ligand:
        name: ligand
        description: Name of bound drug/ligand if this is a co-crystal structure
        range: string
      target_protein:
        name: target_protein
        description: Name of the protein target in the structure
        range: string
      publication:
        name: publication
        description: Reference for the structure deposition or associated paper (e.g.,
          PMID:12345678)
        range: PMID
    class_uri: dismech:ProteinStructure
  PublicationReference:
    name: PublicationReference
    definition_uri: https://w3id.org/monarch-initiative/dismech/PublicationReference
    description: A reference to a publication with associated findings
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - PublicationReference_reference
    - PublicationReference_title
    - found_in
    - tags
    - findings
    slot_usage:
      reference:
        name: reference
        identifier: true
        required: true
      title:
        name: title
        description: 'Title of the referenced publication. Recommended so that linkml-data-qc
          scores its absence, matching the `recommended: true` already carried by
          the EvidenceItem `reference_title` twin. Set here via slot_usage rather
          than on the shared `title` slot, which is also used by Dataset and TrackedIssue.'
        recommended: true
    class_uri: dismech:PublicationReference
  ExternalAssertion:
    name: ExternalAssertion
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExternalAssertion
    description: An externally curated assertion or registry record relevant to a
      disease or variant, such as a ClinGen gene-disease validity assertion or a ClinGen
      Allele Registry record.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - name
    - ExternalAssertion_source
    - assertion_type
    - ExternalAssertion_external_id
    - url
    - description
    - evidence
    - notes
    slot_usage:
      source:
        name: source
        required: true
      external_id:
        name: external_id
        required: true
    class_uri: dismech:ExternalAssertion
  TrackedIssue:
    name: TrackedIssue
    definition_uri: https://w3id.org/monarch-initiative/dismech/TrackedIssue
    description: Structured pointer to an external tracker issue (typically a GitHub
      issue) used to record curation provenance. Use this for things like upstream
      ontology term requests, ontology coverage gaps, schema follow-ups, or any external
      ticket tied to a dismech object, instead of stashing raw URLs in free-text `notes`
      fields. Attachable at multiple levels of the model (disease entries, mappings,
      etc.).
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - TrackedIssue_url
    - TrackedIssue_title
    - tracked_issue_role
    - tracked_issue_status
    - notes
    slot_usage:
      url:
        name: url
        description: Canonical URL of the tracked issue.
        required: true
      title:
        name: title
        description: Short human-readable title of the tracked issue.
    class_uri: dismech:TrackedIssue
  Finding:
    name: Finding
    definition_uri: https://w3id.org/monarch-initiative/dismech/Finding
    description: A key finding or claim extracted from a source (publication or dataset)
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - statement
    - supporting_text
    - evidence
    class_uri: dismech:Finding
  Prevalence:
    name: Prevalence
    definition_uri: https://w3id.org/monarch-initiative/dismech/Prevalence
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - subtype
    - population
    - measure_type
    - prevalence_class
    - rate_per_100000
    - rate_low
    - rate_high
    - percentage
    - evidence
    - notes
    class_uri: dismech:Prevalence
  GeneCaseFraction:
    name: GeneCaseFraction
    definition_uri: https://w3id.org/monarch-initiative/dismech/GeneCaseFraction
    description: 'A structured estimate of the fraction of cases of a genetically
      heterogeneous disease attributable to one gene, in a defined cohort. The genetic-spectrum
      analog of a population Prevalence record: it pairs a cohort/population with
      a normalized percentage (plus optional range bounds and cohort size), source
      notes, and citable evidence. Distinct from population occurrence (Prevalence)
      and from population allele frequency; this is "what share of patients have their
      disease explained by this gene". Complements the coarse free-text `frequency`
      band on the Genetic entry.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - population
    - case_fraction_percent
    - case_fraction_low
    - case_fraction_high
    - cohort_size
    - evidence
    - notes
    class_uri: dismech:GeneCaseFraction
  ProgressionInfo:
    name: ProgressionInfo
    definition_uri: https://w3id.org/monarch-initiative/dismech/ProgressionInfo
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:

    definition_uri: https://w3id.org/monarch-initiative/dismech/ilo_agent_category
    description: "Item(s) on the **causative-agent axis** of the ILO List of Occupational\
      \ Diseases (revised 2010, annexed to Recommendation No. 194) \u2014 sections\
      \ 1 (chemical, physical, biological agents) and 3 (occupational cancer). The\
      \ item names the agent, not the disease. Orthogonal to ``ilo_disease_category``;\
      \ a disease commonly carries both. Assign only when an occupational form of\
      \ the disease is recognised."
    title: "ILO (revised 2010) \u2014 by causative agent"
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:ilo_agent_category
    owner: DiseaseClassifications

  HistopathologyFindingTerm:
    name: HistopathologyFindingTerm
    definition_uri: https://w3id.org/monarch-initiative/dismech/HistopathologyFindingTerm
    description: 'A histopathologic finding term from NCIT. Covers the full NCIT Histopathology
      Result branch (NCIT:C83490): morphologic findings, architectural/growth patterns,
      cellular features, grading, immunophenotype (IHC/flow markers), ultrastructure,
      and staining intensity.'
    comments:
    - NCIT:C35867 Morphologic Finding - architectural patterns, dysplasia, necrosis,
      etc.
    - NCIT:C18000 Histologic Grade - Fuhrman, Nottingham, WHO grades, etc.
    - NCIT:C40998 Immunophenotypic Finding - IHC/flow markers (e.g., ER-positive by
      IHC, CD20-positive cells, loss of SDHB expression)
    - NCIT:C43265 Ultrastructural Finding - electron-microscopy features (e.g., Weibel-Palade
      bodies, foot process effacement)
    - NCIT:C127762 Staining Intensity - graded stain intensity readouts
    - Also includes HP terms for rosettes (HP:0031925-HP:0031930)
    from_schema: https://w3id.org/monarch-initiative/dismech
    reachable_from:
      source_nodes:
      - NCIT:C83490
      - NCIT:C35867
      - NCIT:C40998
      - NCIT:C43265
      - NCIT:C127762
      - NCIT:C18000
      - NCIT:C4741
      - NCIT:C7062
      - NCIT:C36289
      - NCIT:C19955
      - NCIT:C188218
      - NCIT:C37008
      - HP:0025461
      relationship_types:
      - rdfs:subClassOf
      is_direct: false
  ImagingFindingTerm:
    name: ImagingFindingTerm
    definition_uri: https://w3id.org/monarch-initiative/dismech/ImagingFindingTerm
    description: 'An in-vivo imaging finding term. Imaging findings are drawn from
      the NCIT Imaging Finding branch (NCIT:C176708 / NCIT:C199145) and, because most
      radiologic observations coincide with a described phenotype, from the HP Phenotypic
      abnormality branch (HP:0000118) - e.g. white-matter lesions, atrophy, hyperintensity.
      Binding is RECOMMENDED (not REQUIRED): many specific radiologic appearances
      lack a dedicated NCIT/HP term and are left to preferred_term until a radiology
      ontology (e.g. RadLex via BioPortal) is wired in.'
    comments:
    - NCIT:C176708 Imaging Finding - imaging observations
    - NCIT:C199145 Clinical Finding Detected by Imaging
    - HP:0000118 Phenotypic abnormality - imaging-observable phenotypes (atrophy,
      white-matter lesions, hyperintensity)
    from_schema: https://w3id.org/monarch-initiative/dismech
    reachable_from:
      source_nodes:
      - NCIT:C176708
      - NCIT:C199145
      - HP:0000118
      relationship_types:
      - rdfs:subClassOf
      is_direct: false
  DiseaseTerm:

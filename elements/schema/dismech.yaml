  AnimalModel:
    name: AnimalModel
    definition_uri: https://w3id.org/monarch-initiative/dismech/AnimalModel
    description: A whole-organism animal model of the disease. This is the home for
      animal models; non-animal systems (organoids, organ-chips, cell lines, iPSC-derived
      and primary cultures) belong in `experimental_models` as ExperimentalModel.
    comments:
    - Use `modeled_mechanisms` to link the model to the pathophysiology nodes it recapitulates,
      perturbs, measures, or fails to recapitulate, so the model appears in the pathograph
      rather than as a disconnected list.
    - '`name` is optional but recommended once `modeled_mechanisms` is populated:
      it is the stable label used for pathograph nodes and in-page anchors. When absent,
      renderers fall back to a label derived from genotype and species, which is not
      stable across edits and collides when one entry file carries two models of the
      same genotype.'
    - 'Animal-model evidence should carry `evidence_source: MODEL_ORGANISM` and should
      not be the sole support for a human phenotype.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - species
    - genotype
    - background
    - genes
    - category
    - alleles
    - description
    - AnimalModel_publication
    - associated_phenotypes
    - AnimalModel_modeled_mechanisms
    - evidence
    - notes
    - animalModel__name
    slot_usage:
      publication:
        name: publication
        description: Primary publication describing the model, when one paper is the
          canonical reference for it. Per-claim citations still go in `evidence`.
      modeled_mechanisms:
        name: modeled_mechanisms
        description: Pathophysiology mechanism nodes this animal model recapitulates,
          perturbs, measures, rescues, or fails to recapitulate.
    attributes:
      name:
        name: name
        description: 'Short stable label for the model, e.g. "SOD1-G93A transgenic
          mouse". Used as the pathograph node label and in-page anchor. Optional but
          recommended once `modeled_mechanisms` is populated. Defined as a class-local
          attribute (not the global identifier `name` slot) so it is a plain optional
          label: 425 of 439 existing animal models omit it, and AnimalModel is an
          inlined object that needs no identifier.'
        range: string
        recommended: true
    class_uri: dismech:AnimalModel

    description: Phenotypes that this treatment or trial addresses or targets
    comments:
    - Should reference phenotype names defined in the same disease's phenotypes list
    - Enables linking treatments/trials to the symptoms/manifestations they aim to
      manage
    - Each phenotype can include ontology term references (HP)
    - Use only for THERAPEUTIC actions; non-therapeutic actions need a future dedicated
      observation/screening link instead of treatment-style target links
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:target_phenotypes
    owner: Treatment
    domain_of:
    - ClinicalTrial
    - Treatment
    range: PhenotypeDescriptor
    multivalued: true
    inlined: true
    inlined_as_list: true
  target_mechanisms:
    name: target_mechanisms
    definition_uri: https://w3id.org/monarch-initiative/dismech/target_mechanisms
    description: Pathophysiology mechanism nodes that this treatment targets or modulates.
      Links a treatment to specific steps in the disease's causal graph, enabling
      inference about which downstream phenotypes should respond to therapy.
    comments:
    - Target names should match pathophysiology entry names in the same disease file
    - Complements target_phenotypes by explaining WHERE in the causal chain the drug
      acts
    - Analogous to DrugMechDB paths but anchored to dismech pathophysiology nodes
    - Use only for THERAPEUTIC actions; non-therapeutic actions such as screening,
      monitoring, diagnostics, and counseling or informational interventions should
      not link to pathophysiology nodes
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:target_mechanisms
    owner: Treatment
    domain_of:
    - Treatment
    range: TreatmentMechanismTarget
    multivalued: true
    inlined: true
    inlined_as_list: true
  modeled_mechanisms:
    name: modeled_mechanisms
    definition_uri: https://w3id.org/monarch-initiative/dismech/modeled_mechanisms
    description: Pathophysiology mechanism nodes/assertions that this experimental
      model is intended to recapitulate, perturb, or measure within the disease pathograph.
    comments:
    - Target names should match pathophysiology entry names in the same disease file
    - Use description to capture the specific assayable or modeled assertion, not
      just the node label
    - Use readouts on each link to record the outcome measures that ground the assertion
    - Applies to experimental (NAM), animal, and computational models alike
    from_schema: https://w3id.org/monarch-initiative/dismech
    slot_uri: dismech:modeled_mechanisms
    owner: AnimalModel
    domain_of:

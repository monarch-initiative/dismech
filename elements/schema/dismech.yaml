  GeneSetAssociation:
    name: GeneSetAssociation
    definition_uri: https://w3id.org/monarch-initiative/dismech/GeneSetAssociation
    description: 'A curated link between this disease and an external gene set, referenced
      by its structured-source id (MYGENESET:<id>, resolving to references_cache/MYGENESET_<id>.md).
      The gene set''s membership and curated GO interpretation live upstream / in
      the cache file; this object records only the precise disease<->set link and
      its semantics, avoiding re-duplication of genes in the KB. It is the anchor
      for BP alignment (`just genesets-align`): the set''s curated biological processes
      are scored against this disease''s pathograph.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - geneSetAssociation__gene_set
    - geneSetAssociation__relationship
    - geneSetAssociation__note
    attributes:
      gene_set:
        name: gene_set
        description: Structured-source id of the gene set, e.g. MYGENESET:KEGG_ASTHMA.
          Resolves to references_cache/MYGENESET_<id>.md.
        range: uriorcurie
        required: true
      relationship:
        name: relationship
        description: How the gene set relates to this disease.
        range: GeneSetRelationshipEnum
      note:
        name: note
        description: Free-text curator note on the link (e.g. which arms overlap).
        range: string
    class_uri: dismech:GeneSetAssociation

  ModelMechanismRelationshipEnum:
    name: ModelMechanismRelationshipEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ModelMechanismRelationshipEnum
    description: Controlled relationship between an experimental, animal, or computational
      model and the pathophysiology node it is linked to. Distinguishes a model that
      reproduces a mechanism from one that merely manipulates or measures it, and
      gives negative results (a model that does NOT reproduce the human mechanism)
      a first-class home rather than leaving them in prose.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      RECAPITULATES:
        text: RECAPITULATES
        description: The model reproduces the linked mechanism, such that observations
          in the model are taken to be informative about the human mechanism.
        title: Recapitulates
      PARTIALLY_RECAPITULATES:
        text: PARTIALLY_RECAPITULATES
        description: The model reproduces some but not all of the linked mechanism.
          Use `limitations` to state which facets are and are not reproduced.
        title: Partially recapitulates
      FAILS_TO_RECAPITULATE:
        text: FAILS_TO_RECAPITULATE
        description: The model does NOT reproduce the linked mechanism. This is a
          substantive negative claim and the structural signal for a HUMAN_MODEL_MISMATCH
          discussion; it requires `limitations` and supporting `evidence`.
        title: Fails to recapitulate
      PERTURBS:
        text: PERTURBS
        description: The model manipulates the linked mechanism (knockout, knockdown,
          overexpression, chemical challenge) without itself being a claim that the
          full mechanism is reproduced.
        title: Perturbs
      MEASURES:
        text: MEASURES
        description: The model provides a readout of the linked mechanism without
          claiming to reproduce or perturb it.
        title: Measures
      RESCUES:
        text: RESCUES
        description: The model demonstrates reversal or correction of the linked mechanism,
          typically a genetic-correction, drug-rescue, or isogenic-repair arm.
        title: Rescues
  ModelFidelityEnum:
    name: ModelFidelityEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ModelFidelityEnum
    description: 'Curator assessment of how faithfully a model captures the linked
      human mechanism. Deliberately coarse: this is a translational-validity caveat,
      not a metric. Pair with `limitations` for the specific caveat.'
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      HIGH:
        text: HIGH
        description: Human-derived or otherwise closely matched system reproducing
          the mechanism with well-characterized correspondence to human disease.
        title: High
      MODERATE:
        text: MODERATE
        description: Reproduces the mechanism with known and material divergences
          from human biology (species differences, supraphysiological expression,
          reduced cellular complexity).
        title: Moderate
      LOW:
        text: LOW
        description: Informative but with divergences substantial enough that findings
          should not be transferred to human disease without corroboration.
        title: Low
      UNKNOWN:
        text: UNKNOWN
        description: Correspondence to the human mechanism has not been established.
          Prefer this over guessing a tier.
        title: Unknown
  ModelReadoutDirectionEnum:
    name: ModelReadoutDirectionEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ModelReadoutDirectionEnum
    description: Direction of a measured effect in an experimental, animal, or computational
      model, relative to the model's control or comparator arm. Complements BiomarkerReadoutDirectionEnum,
      which describes the direction of a clinical biomarker's *association* with an
      endpoint rather than the direction of an experimental measurement.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      INCREASED:
        text: INCREASED
        description: The readout is higher in the model condition than in the comparator
        title: Increased
      DECREASED:
        text: DECREASED
        description: The readout is lower in the model condition than in the comparator
        title: Decreased
      UNCHANGED:
        text: UNCHANGED
        description: The readout does not differ materially from the comparator. A
          genuine negative result, not missing data; omit `direction` entirely when
          the measurement was not made or not reported.
        title: Unchanged
      RESTORED:
        text: RESTORED
        description: The readout returns toward the comparator/wild-type value, typically
          in a rescue, correction, or treatment arm.
        title: Restored
      ABOLISHED:
        text: ABOLISHED
        description: The readout is lost or reduced to background in the model condition
        title: Abolished
      ALTERED:
        text: ALTERED
        description: The readout differs from the comparator in a way that is not
          monotonic (e.g. a shifted distribution or changed kinetics). Prefer a directional
          value when one applies.
        title: Altered

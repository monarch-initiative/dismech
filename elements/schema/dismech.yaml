    class_uri: dismech:ProgressionInfo
  ClinicalBurden:
    name: ClinicalBurden
    definition_uri: https://w3id.org/monarch-initiative/dismech/ClinicalBurden
    description: Disease-level assessment of the typical clinical burden imposed by
      a disease. This captures the overall burden of the disease concept and is distinct
      from severity annotations on individual phenotypes.
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - ClinicalBurden_burden_level
    - ClinicalBurden_rationale
    - ClinicalBurden_evidence
    - notes
    slot_usage:
      burden_level:
        name: burden_level
        required: true
      rationale:
        name: rationale
        description: Curator rationale for assigning this burden level, including
          what aspects of functional impact, morbidity, duration, management burden,
          or long-term consequence drive the assessment.
        recommended: true
      evidence:
        name: evidence
        description: Evidence supporting the disease-level clinical burden assessment.
          Prefer sources that describe typical course, functional impact, morbidity,
          mortality, or management burden.
        recommended: true
    class_uri: dismech:ClinicalBurden
  EpidemiologyInfo:
    name: EpidemiologyInfo
    definition_uri: https://w3id.org/monarch-initiative/dismech/EpidemiologyInfo
    from_schema: https://w3id.org/monarch-initiative/dismech

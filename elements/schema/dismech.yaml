    uri: xsd:string
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  EvidenceItemSupportEnum:
    name: EvidenceItemSupportEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/EvidenceItemSupportEnum
    description: The level of support for an evidence item
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      WRONG_STATEMENT:
        text: WRONG_STATEMENT
        description: The annotated claim contains a demonstrable factual error (e.g.,
          an incorrect statistic or assertion); the cited evidence documents the correct
          information. Use this when the claim is outright wrong, not merely contested.
          If the cited reference simply does not mention the claim, use NO_EVIDENCE
          instead. If the reference contradicts the claim but does not prove it factually
          wrong, use REFUTE.
        title: Wrong statement
      SUPPORT:
        text: SUPPORT
        description: The cited evidence directly supports the claim
        title: Supports
      REFUTE:
        text: REFUTE
        description: The cited evidence directly contradicts the claim
        title: Refutes
      NO_EVIDENCE:
        text: NO_EVIDENCE
        description: The cited reference does not contain evidence relevant to the
          claim
        title: No evidence
      PARTIAL:
        text: PARTIAL
        description: The cited evidence partially or indirectly supports the claim
        title: Partially supports
  EvidenceSourceEnum:
    name: EvidenceSourceEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/EvidenceSourceEnum
    description: The provenance/source of the evidence item
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      HUMAN_CLINICAL:
        text: HUMAN_CLINICAL
        description: Human clinical observations (patients, cohorts, case reports,
          clinical trials, epidemiology)
        title: Human clinical
      MODEL_ORGANISM:
        text: MODEL_ORGANISM
        description: In vivo animal evidence (mouse, zebrafish, primate, veterinary
          case series including dog/cat/horse, other non-human animal models etc.)
        title: Model organism
      IN_VITRO:
        text: IN_VITRO
        description: In vitro or ex vivo assays (cell culture, organoids, tissue slices,
          biochemical assays)
        title: In vitro / ex vivo
      COMPUTATIONAL:
        text: COMPUTATIONAL
        description: In silico/modeling studies (simulation, docking, ML predictions,
          network inference) even when using clinical data inputs
        title: Computational
      OTHER:
        text: OTHER
        description: Evidence not fitting the above (e.g., expert consensus without
          data, image atlases without cohort context)
        title: Other
  DefinitionTypeEnum:
    name: DefinitionTypeEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/DefinitionTypeEnum
    description: The type of definition or criteria set
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      DIAGNOSTIC_CRITERIA:
        text: DIAGNOSTIC_CRITERIA
        description: Published diagnostic criteria (clinical/serologic/imaging)
      PHENOTYPE_ALGORITHM:
        text: PHENOTYPE_ALGORITHM
        description: Algorithmic phenotype definition (e.g., PheKB-/OHDSI-style)
      CASE_DEFINITION:
        text: CASE_DEFINITION
        description: Case definition for surveillance or reporting
      OTHER:
        text: OTHER
        description: Other definition type
  DefinitionDerivationBasisEnum:
    name: DefinitionDerivationBasisEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/DefinitionDerivationBasisEnum
    description: The epistemic grounding of a definition / phenotype algorithm, orthogonal
      to definition_type. Records where the definition comes from and how well established
      it is, so a mechanism-predicated case-finding query is not conflated with a
      consensus- or gold-standard-validated one. When the basis is a hypothesis, the
      definition should attaches_to the pathophysiology node(s)/edge(s) it is predicated
      on, so the basis can be cross-checked against those edges' hypothesis_groups.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      ESTABLISHED_CRITERIA:
        text: ESTABLISHED_CRITERIA
        description: Published consensus criteria or a validated computable phenotype
          (e.g. an OHDSI Phenotype Library cohort). The implicit default for existing
          definitions.
      MECHANISTIC_HYPOTHESIS:
        text: MECHANISTIC_HYPOTHESIS
        description: Predicated on a specific, not-yet-proven disease mechanism hypothesis;
          membership is contingent on that hypothesis holding.
      MODEL_SYSTEM_EXTRAPOLATION:
        text: MODEL_SYSTEM_EXTRAPOLATION
        description: Extrapolated from an animal or in-vitro model result not yet
          demonstrated in humans.
  AlgorithmValidationStatusEnum:
    name: AlgorithmValidationStatusEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AlgorithmValidationStatusEnum
    description: Validation maturity of a phenotype algorithm / computable case definition.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      PROPOSED:
        text: PROPOSED
        description: Drafted; never executed against data.
      UNVALIDATED:
        text: UNVALIDATED
        description: Executable but not yet evaluated against a gold-standard or labeled
          cohort.
      VALIDATED_AGAINST_GOLD_STANDARD:
        text: VALIDATED_AGAINST_GOLD_STANDARD
        description: PPV/sensitivity characterized against a reference standard.
  MappingConsistencyEnum:
    name: MappingConsistencyEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/MappingConsistencyEnum
    description: Consistency of a mapping relative to another reference source
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      CONSISTENT:
        text: CONSISTENT
        description: Mapping is consistent with the reference source
      INCONSISTENT:
        text: INCONSISTENT
        description: Mapping conflicts with the reference source
      MISSING:
        text: MISSING
        description: Mapping is missing from the reference source
      UNKNOWN:
        text: UNKNOWN
        description: Consistency not assessed or unclear
  FrequencyEnum:
    name: FrequencyEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/FrequencyEnum
    description: The frequency of an event or phenomenon
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      OBLIGATE:
        text: OBLIGATE
        description: Present in all cases (100% of patients)
        meaning: HP:0040280
        title: Obligate (100%)
      VERY_FREQUENT:
        text: VERY_FREQUENT
        description: Present in most cases (80-99% of patients)
        meaning: HP:0040281
        title: Very frequent (80-99%)
        aliases:
        - Very frequent
      FREQUENT:
        text: FREQUENT
        description: Present in many cases (30-79% of patients)
        meaning: HP:0040282
        title: Frequent (30-79%)
      OCCASIONAL:
        text: OCCASIONAL
        description: Present in some cases (5-29% of patients)
        meaning: HP:0040283
        title: Occasional (5-29%)
      VERY_RARE:
        text: VERY_RARE
        description: Present in rare cases (<5% of patients)
        meaning: HP:0040284
        title: Very rare (<5%)
        aliases:
        - Very rare
  PrevalenceMeasureEnum:
    name: PrevalenceMeasureEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/PrevalenceMeasureEnum
    description: The kind of epidemiological measure a Prevalence record reports.
      Disease occurrence is reported in several non-interchangeable ways; this enum
      makes the measure explicit so a point prevalence is never silently compared
      with an incidence rate or a literature case-count. Mirrors the "type" column
      of the Orphanet epidemiology table.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      POINT_PREVALENCE:
        text: POINT_PREVALENCE
        description: Proportion of a population affected at a single point in time.
        title: Point prevalence
      BIRTH_PREVALENCE:
        text: BIRTH_PREVALENCE
        description: Proportion of live births (or births) affected; common for congenital
          disorders.
        title: Prevalence at birth
        aliases:
        - Prevalence at birth
      LIFETIME_PREVALENCE:
        text: LIFETIME_PREVALENCE
        description: Proportion of a population affected at some point during their
          lifetime.
        title: Lifetime prevalence
      PERIOD_PREVALENCE:
        text: PERIOD_PREVALENCE
        description: Proportion of a population affected during a defined interval
          (e.g., five-year period prevalence).
        title: Period prevalence
      ANNUAL_INCIDENCE:
        text: ANNUAL_INCIDENCE
        description: Rate of new cases arising in a population per year (an incidence,
          not a prevalence).
        title: Annual incidence
        aliases:
        - Incidence
        - Annual incidence
      CARRIER_FREQUENCY:
        text: CARRIER_FREQUENCY
        description: Frequency of heterozygous carriers in a population (not affected
          individuals).
        title: Carrier frequency
      CASES_IN_LITERATURE:
        text: CASES_IN_LITERATURE
        description: Count of reported cases or families rather than a population
          rate; used for ultra-rare disorders where no denominator-based estimate
          exists.
        title: Cases/families reported in the literature
        aliases:
        - Cases/families in the literature
      UNKNOWN:
        text: UNKNOWN
        description: The measure type is not stated or cannot be determined from the
          source.
        title: Unknown
  PrevalenceClassEnum:
    name: PrevalenceClassEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/PrevalenceClassEnum
    description: "Coarse, always-fillable band for disease occurrence \u2014 the population-rate\
      \ analog of the HPO-style FrequencyEnum used for phenotype frequency. The numeric\
      \ bands are the Orphanet prevalence classes (so the ~7% of records already quoting\
      \ Orphanet map directly and the ICEES/ORPHA structured sources stay aligned);\
      \ the qualitative tiers cover records that report only prose (\"rare\", \"common\"\
      ) with no numeric estimate. When a numeric estimate exists, also populate rate_per_100000\
      \ (or rate_low/rate_high); the band is the queryable summary, the rate carries\
      \ the precision."
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      ABOVE_1_IN_1000:
        text: ABOVE_1_IN_1000
        description: More than 1 in 1,000 (more than 100 per 100,000). Orphanet class.
        title: '>1 / 1,000'
      BAND_1_5_PER_10000:
        text: BAND_1_5_PER_10000
        description: 1 to 9 per 10,000 (10-99 per 100,000). Combines the Orphanet
          1-5 and 6-9 per 10,000 classes into one decade-spanning band, matching the
          other per-decade bands and the _band_from_rate() boundaries.
        title: 1-9 / 10,000
      BAND_1_9_PER_100000:
        text: BAND_1_9_PER_100000
        description: 1 to 9 per 100,000. Orphanet class.
        title: 1-9 / 100,000
      BAND_1_9_PER_1000000:
        text: BAND_1_9_PER_1000000
        description: 1 to 9 per 1,000,000 (0.1-0.9 per 100,000). Orphanet class.
        title: 1-9 / 1,000,000
      BELOW_1_IN_1000000:
        text: BELOW_1_IN_1000000
        description: Fewer than 1 in 1,000,000 (less than 0.1 per 100,000). Orphanet
          class.
        title: <1 / 1,000,000
      COMMON:
        text: COMMON
        description: Qualitative tier for disorders described as common/endemic with
          no numeric estimate captured. Roughly corresponds to the >1/1,000 region
          but asserted only qualitatively.
        title: Common
      RARE:
        text: RARE
        description: Qualitative tier for disorders described as "rare" in the source
          without a numeric estimate (the EU rare-disease threshold is <1 in 2,000).
        title: Rare
      ULTRA_RARE:
        text: ULTRA_RARE
        description: Qualitative tier for disorders described as ultra-rare / only
          a handful of reported cases, with no population rate available. Often paired
          with measure_type CASES_IN_LITERATURE.
        title: Ultra-rare
      NOT_YET_DOCUMENTED:
        text: NOT_YET_DOCUMENTED
        description: Source states prevalence is not yet documented. Orphanet class.
        title: Not yet documented
        aliases:
        - Not yet documented
      UNKNOWN:
        text: UNKNOWN
        description: Prevalence is unknown or not stated.
        title: Unknown
  ClinicalSignificanceEnum:
    name: ClinicalSignificanceEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ClinicalSignificanceEnum
    description: The clinical significance of a variant for a condition (ACMG guidelines)
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      PATHOGENIC:
        text: PATHOGENIC
        description: Variant is pathogenic for the condition (ACMG class 5)
        meaning: GENO:0000840
        title: Pathogenic
        aliases:
        - pathogenic_for_condition
      LIKELY_PATHOGENIC:
        text: LIKELY_PATHOGENIC
        description: Variant is likely pathogenic for the condition (ACMG class 4)
        meaning: GENO:0000841
        title: Likely pathogenic
        aliases:
        - likely_pathogenic_for_condition
      BENIGN:
        text: BENIGN
        description: Variant is benign for the condition (ACMG class 1)
        meaning: GENO:0000843
        title: Benign
        aliases:
        - benign_for_condition
      LIKELY_BENIGN:
        text: LIKELY_BENIGN
        description: Variant is likely benign for the condition (ACMG class 2)
        meaning: GENO:0000844
        title: Likely benign
        aliases:
        - likely_benign_for_condition
      UNCERTAIN_SIGNIFICANCE:
        text: UNCERTAIN_SIGNIFICANCE
        description: Clinical significance of the variant is uncertain (ACMG class
          3)
        meaning: GENO:0000845
        title: Uncertain significance
        aliases:
        - has_uncertain_significance_for_condition
  RegulatoryVariantCategoryEnum:
    name: RegulatoryVariantCategoryEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/RegulatoryVariantCategoryEnum
    description: Functional classification of non-coding gene regulatory variants
      based on their impact on gene expression patterns. Adapted from Cheng et al.
      2024 (PMID:38436667). Includes traditional coding variant categories for completeness.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      LOE:
        text: LOE
        description: Non-modular loss-of-expression. Diminishes or abolishes gene
          expression across all cell types that intrinsically express the gene. Analogous
          to coding amorphic or hypomorphic loss-of-function.
        title: Loss of expression
        notes:
        - Defined in Cheng et al. 2024 (PMID:38436667) as non-modular LOE
        see_also:
        - PMID:38436667
      mLOE:
        text: mLOE
        description: Modular loss-of-expression. Diminishes or abolishes gene expression
          in only a subset of cell types or developmental windows. Represents a disease
          mechanism largely unique to non-coding regulatory variants.
        title: Modular loss of expression
        notes:
        - Defined in Cheng et al. 2024 (PMID:38436667) as modular LOE (mLOE)
        see_also:
        - PMID:38436667
      GOE:
        text: GOE
        description: Gain-of-ectopic-expression. Results in ectopic spatial and/or
          temporal expression of a gene. Can arise from enhancer adoption, novel TFBS
          creation, promoter switching, or repressor site disruption.
        title: Gain of ectopic expression
        notes:
        - Defined in Cheng et al. 2024 (PMID:38436667) as gain-of-ectopic-expression
          (GOE)
        see_also:
        - PMID:38436667
      LOF:
        text: LOF
        description: Coding loss-of-function. Loss of normal biological function via
          complete (amorphic) or partial (hypomorphic) loss of protein activity.
        title: Loss of function
      GOF:
        text: GOF
        description: Coding gain-of-function. Creates a protein with increased activity
          (hypermorphic) or entirely new function (neomorphic).
        title: Gain of function
      DN:
        text: DN
        description: Dominant-negative. Creates a protein that blocks the normal function
          of the remaining wild-type protein (antimorphic).
        title: Dominant negative
  RegulatoryElementTypeEnum:
    name: RegulatoryElementTypeEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/RegulatoryElementTypeEnum
    description: Type of gene regulatory element disrupted by a non-coding variant.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      PROMOTER:
        text: PROMOTER
        description: Promoter-proximal element overlapping the transcription start
          site, containing core TF binding elements (TATA, CAAT, GC, CACCC boxes).
        title: Promoter
      ENHANCER:
        text: ENHANCER
        description: Distal regulatory element that upregulates transcriptional activity.
          May be cell-type-specific or shared across cell types.
        title: Enhancer
      SILENCER:
        text: SILENCER
        description: Regulatory element that represses or silences gene transcription.
        title: Silencer
      INSULATOR:
        text: INSULATOR
        description: Boundary element (often CTCF-bound) that compartmentalizes adjacent
          gene regulatory domains and limits enhancer-promoter interactions.
        title: Insulator
      TAD_BOUNDARY:
        text: TAD_BOUNDARY
        description: Topologically associating domain boundary. Structural element
          maintaining chromatin loop domains; disruption can cause enhancer adoption
          or ectopic regulatory interactions.
        title: TAD boundary
      LOCUS_CONTROL_REGION:
        text: LOCUS_CONTROL_REGION
        description: A cluster of regulatory elements that controls expression of
          a gene cluster (e.g., the beta-globin LCR).
        title: Locus control region
  GeneDiseaseRelationshipEnum:
    name: GeneDiseaseRelationshipEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/GeneDiseaseRelationshipEnum
    description: The qualitative relationship between a gene (or locus) and a disease.
      Use to constrain the free-text `association` slot to a controlled vocabulary
      aligned with ClinGen gene-disease validity concepts and common cancer/somatic
      driver classifications. The free-text `association` slot may still be used for
      narrative detail.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      CAUSATIVE:
        text: CAUSATIVE
        description: Variants in the gene are sufficient to cause the disease in a
          mendelian or near-mendelian sense (corresponds to ClinGen "Definitive" or
          "Strong" gene-disease validity).
        title: Causative
      RISK_FACTOR:
        text: RISK_FACTOR
        description: Variants in the gene increase risk of disease but are neither
          necessary nor sufficient to cause it. Includes common-variant associations
          and HLA risk alleles.
        title: Risk factor
      PROTECTIVE:
        text: PROTECTIVE
        description: Variants in the gene reduce the risk or severity of disease.
        title: Protective
      MODIFIER:
        text: MODIFIER
        description: Variants in the gene modify the severity, age of onset, or expressivity
          of disease without being a primary driver.
        title: Modifier
      SUSCEPTIBILITY:
        text: SUSCEPTIBILITY
        description: Variants in the gene confer susceptibility to disease in combination
          with other genetic or environmental factors. Used for polygenic susceptibility
          loci such as GWAS hits.
        title: Susceptibility
      SOMATIC_DRIVER:
        text: SOMATIC_DRIVER
        description: Somatic alterations in the gene drive tumor initiation or progression
          (e.g., recurrent oncogenic drivers in cancer).
        title: Somatic driver
      COOPERATING:
        text: COOPERATING
        description: Co-occurring somatic or germline alterations that cooperate with
          a primary driver to shape disease behavior or therapy response.
        title: Cooperating alteration
      BIOMARKER:
        text: BIOMARKER
        description: Gene whose expression, mutation, or amplification status serves
          as a diagnostic, prognostic, or predictive biomarker without a required
          causal role.
        title: Biomarker
      DISPUTED:
        text: DISPUTED
        description: Reported gene-disease association whose validity is contested
          (corresponds to ClinGen "Disputed" or "Refuted").
        title: Disputed
      UNKNOWN:
        text: UNKNOWN
        description: The relationship between the gene and the disease is unclear
          or not yet classified.
        title: Unknown
  VariantOriginEnum:
    name: VariantOriginEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/VariantOriginEnum
    description: The origin of variation in a gene with respect to a disease entry.
      Bound to GENO allele origin terms.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      GERMLINE:
        text: GERMLINE
        description: germline allele origin
        meaning: GENO:0000888
        title: Germline
        notes:
        - Variant present in the germline (inherited or constitutional).
      SOMATIC:
        text: SOMATIC
        description: somatic allele origin
        meaning: GENO:0000882
        title: Somatic
        notes:
        - Variant acquired in somatic tissue after fertilization.
      DE_NOVO:
        text: DE_NOVO
        description: de novo allele origin
        meaning: GENO:0000880
        title: De novo
        notes:
        - Variant arising as a new mutation in the proband, not present in parents.
      GERMLINE_AND_SOMATIC:
        text: GERMLINE_AND_SOMATIC
        description: The gene is implicated by both germline and somatic variants
          in the disease (e.g., tumor suppressors with two-hit mechanisms).
        title: Germline and somatic
      UNKNOWN:
        text: UNKNOWN
        description: unknown allele origin
        meaning: GENO:0000881
        title: Unknown
        notes:
        - Origin of the variant is unspecified or not determined.
  AllelicHitRoleEnum:
    name: AllelicHitRoleEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AllelicHitRoleEnum
    description: Role of a genetic alteration in a multi-hit disease mechanism. This
      is intentionally separate from variant origin, event type, and functional impact
      so two-hit models can be represented compositionally.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      FIRST_HIT:
        text: FIRST_HIT
        description: Initial alteration that creates a predisposed or partially disabled
          state, typically a germline alteration in tumor-suppressor syndromes.
        title: First hit
      SECOND_HIT:
        text: SECOND_HIT
        description: Additional alteration that completes functional inactivation
          or activation in the relevant disease tissue or clone.
        title: Second hit
      BIALLELIC_INACTIVATION:
        text: BIALLELIC_INACTIVATION
        description: Combined state in which both alleles of a gene are functionally
          inactivated.
        title: Biallelic inactivation
      COOPERATING_HIT:
        text: COOPERATING_HIT
        description: Alteration that cooperates with another primary alteration without
          necessarily being ordered as the first or second hit.
        title: Cooperating hit
      UNKNOWN:
        text: UNKNOWN
        description: The hit role has not been determined.
        title: Unknown
  AllelicEventEnum:
    name: AllelicEventEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AllelicEventEnum
    description: Type of genetic or epigenetic event affecting an allele. Use together
      with variant_origin, allelic_hit_role, zygosity, and functional impact rather
      than creating cross-product terms.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      PATHOGENIC_VARIANT:
        text: PATHOGENIC_VARIANT
        description: Pathogenic sequence variant or small variant not otherwise specified.
        title: Pathogenic variant
      MISSENSE_VARIANT:
        text: MISSENSE_VARIANT
        description: Sequence variant that changes an amino acid.
        title: Missense variant
      NONSENSE_VARIANT:
        text: NONSENSE_VARIANT
        description: Sequence variant that introduces a premature termination codon.
        title: Nonsense variant
      FRAMESHIFT_VARIANT:
        text: FRAMESHIFT_VARIANT
        description: Insertion or deletion that changes the coding reading frame.
        title: Frameshift variant
      SPLICE_SITE_VARIANT:
        text: SPLICE_SITE_VARIANT
        description: Variant that disrupts or alters RNA splicing.
        title: Splice site variant
      DELETION:
        text: DELETION
        description: Sequence or chromosomal deletion event.
        title: Deletion
      COPY_NUMBER_LOSS:
        text: COPY_NUMBER_LOSS
        description: Loss of DNA copy number affecting the gene or locus.
        title: Copy-number loss
      COPY_NUMBER_GAIN:
        text: COPY_NUMBER_GAIN
        description: Gain of DNA copy number affecting the gene or locus.
        title: Copy-number gain
      LOSS_OF_HETEROZYGOSITY:
        text: LOSS_OF_HETEROZYGOSITY
        description: Loss of the wild-type or alternate allele in a tissue or clone.
        title: Loss of heterozygosity
      PROMOTER_METHYLATION:
        text: PROMOTER_METHYLATION
        description: Epigenetic promoter methylation affecting gene expression.
        title: Promoter methylation
      BIALLELIC_INACTIVATION:
        text: BIALLELIC_INACTIVATION
        description: Composite event state in which both alleles are functionally
          inactivated.
        title: Biallelic inactivation
      UNKNOWN:
        text: UNKNOWN
        description: The allelic event type has not been determined.
        title: Unknown
  FunctionalImpactEnum:
    name: FunctionalImpactEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/FunctionalImpactEnum
    description: Directional or qualitative functional consequence of a variant or
      genetic context.
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      LOSS_OF_FUNCTION:
        text: LOSS_OF_FUNCTION
        description: Complete or partial reduction of normal gene product function.
        title: Loss of function
      GAIN_OF_FUNCTION:
        text: GAIN_OF_FUNCTION
        description: Increased, novel, or constitutive gene product function.
        title: Gain of function
      PARTIAL_LOSS_OF_FUNCTION:
        text: PARTIAL_LOSS_OF_FUNCTION
        description: Hypomorphic reduction of normal gene product function.
        title: Partial loss of function
      DOMINANT_NEGATIVE:
        text: DOMINANT_NEGATIVE
        description: Mutant product interferes with the remaining wild-type product.
        title: Dominant negative
      HYPERMORPHIC:
        text: HYPERMORPHIC
        description: Increased normal gene product activity.
        title: Hypermorphic
      NEOMORPHIC:
        text: NEOMORPHIC
        description: Novel gene product activity not present in the wild type.
        title: Neomorphic
      UNKNOWN:
        text: UNKNOWN
        description: Functional impact is not known.
        title: Unknown
  ModifierEnum:
    name: ModifierEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ModifierEnum
    description: "Qualifiers for direction, intensity, functional impact, or pathological\
      \ state of a descriptor (biological process, molecular function, cell type,\
      \ etc.). GAIN_OF_FUNCTION and LOSS_OF_FUNCTION describe the activity *state*\
      \ of a pathway or process regardless of underlying cause (genetic variant, viral\
      \ protein, epigenetic silencing, post-translational modification, etc.). For\
      \ the functional consequence of a specific genetic *variant*, use GeneticContext.functional_impact_category\
      \ (FunctionalImpactEnum) instead. Boundary with INCREASED/DECREASED: prefer\
      \ the PATO-bound INCREASED/DECREASED when the claim is *quantitative* \u2014\
      \ a normally regulated process running above or below its normal level. Reserve\
      \ GAIN_OF_FUNCTION/LOSS_OF_FUNCTION for a *qualitative* change in regulatory\
      \ control, where the process is driven outside its normal regulatory constraints\
      \ (viral oncoprotein, autocrine loop, epigenetic silencing, protein sequestration).\
      \ Existing INCREASED/DECREASED annotations should not be migrated to GAIN_OF_FUNCTION/LOSS_OF_FUNCTION\
      \ without that qualitative justification."
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      INCREASED:
        text: INCREASED
        description: Upregulated, hyperactive, elevated, or excessive
        meaning: PATO:0002300
        title: Increased
        aliases:
        - increased quality
      DECREASED:
        text: DECREASED
        description: Downregulated, hypoactive, reduced, or deficient
        meaning: PATO:0002301
        title: Decreased
        aliases:
        - decreased quality
      ABNORMAL:
        text: ABNORMAL
        description: Qualitatively abnormal (e.g., misfolding, mislocalization, malformed)
        meaning: PATO:0000460
        title: Abnormal
      DYSREGULATED:
        text: DYSREGULATED
        description: Regulation is impaired (may be increased or decreased)
        title: Dysregulated
      ABSENT:
        text: ABSENT
        description: Not occurring or not present
        meaning: PATO:0000462
        title: Absent
      GAIN_OF_FUNCTION:
        text: GAIN_OF_FUNCTION
        description: 'Constitutive or aberrant activation of a pathway, process, or
          molecular function regardless of underlying mechanism (viral oncoprotein,
          autocrine loop, post-translational modification, etc.). For mutation-driven
          GOF, use GeneticContext.functional_impact_category: GAIN_OF_FUNCTION.'
        title: Gain of function
      LOSS_OF_FUNCTION:
        text: LOSS_OF_FUNCTION
        description: 'Reduction or abolition of normal pathway, process, or molecular
          function regardless of underlying mechanism (epigenetic silencing, protein
          sequestration, competitive inhibition, etc.). For mutation-driven LOF, use
          GeneticContext.functional_impact_category: LOSS_OF_FUNCTION.'
        title: Loss of function
  DietaryModificationActionEnum:
    name: DietaryModificationActionEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/DietaryModificationActionEnum
    description: Action applied to a food or beverage as part of a dietary treatment
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      ADD:
        text: ADD
        description: Increase intake or deliberately include the specified food or
          beverage
        title: Add
      RESTRICT:
        text: RESTRICT
        description: Limit intake of the specified food or beverage without full elimination
        title: Restrict
      AVOID:
        text: AVOID
        description: Eliminate or strictly avoid the specified food or beverage
        title: Avoid
      SUBSTITUTE:
        text: SUBSTITUTE
        description: Use the specified food or beverage as a replacement within a
          dietary regimen
        title: Substitute
  PenetranceEnum:
    name: PenetranceEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/PenetranceEnum
    description: Penetrance classification for inheritance
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      COMPLETE:
        text: COMPLETE
        description: All individuals with the variant express the phenotype
        title: Complete
      INCOMPLETE:
        text: INCOMPLETE
        description: Not all individuals with the variant express the phenotype
        title: Incomplete
      UNKNOWN:
        text: UNKNOWN
        description: Penetrance has not been determined
        title: Unknown
  ExpressivityEnum:
    name: ExpressivityEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ExpressivityEnum
    description: Expressivity classification for inheritance
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      VARIABLE:
        text: VARIABLE
        description: Phenotype severity or features vary among individuals with the
          same variant
        title: Variable
      CONSISTENT:
        text: CONSISTENT
        description: Phenotype is uniform among individuals with the same variant
        title: Consistent
      UNKNOWN:
        text: UNKNOWN
        description: Expressivity has not been determined
        title: Unknown
  LateralityEnum:
    name: LateralityEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/LateralityEnum
    description: Laterality qualifier for anatomical structures or procedures
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      LEFT:
        text: LEFT
        description: Left side of the body
        title: Left
      RIGHT:
        text: RIGHT
        description: Right side of the body
        title: Right
      BILATERAL:
        text: BILATERAL
        description: Both sides of the body
        title: Bilateral
  SpatialExtentEnum:
    name: SpatialExtentEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/SpatialExtentEnum
    description: Qualifiers for the spatial extent or distribution of a phenotype
      or process
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      FOCAL:
        text: FOCAL
        description: Confined to a single location or region
        title: Focal
      MULTIFOCAL:
        text: MULTIFOCAL
        description: Affecting multiple discrete locations
        title: Multifocal
      DIFFUSE:
        text: DIFFUSE
        description: Widespread, continuous distribution
        title: Diffuse
      EXTENSIVE:
        text: EXTENSIVE
        description: Large extent, typically involving multiple segments or regions
        title: Extensive
      PATCHY:
        text: PATCHY
        description: Irregular, discontinuous distribution
        title: Patchy
      SEGMENTAL:
        text: SEGMENTAL
        description: Affecting a specific segment or dermatome
        title: Segmental
  TemporalityEnum:
    name: TemporalityEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/TemporalityEnum
    description: Temporal qualifiers for descriptor post-composition
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      ACUTE:
        text: ACUTE
        description: Acute manifestation or episode
        meaning: HP:0011009
        title: Acute
      TRANSIENT:
        text: TRANSIENT
        description: Transient manifestation
        meaning: HP:0025153
        title: Transient
      SUBACUTE:
        text: SUBACUTE
        description: Subacute manifestation or episode
        meaning: HP:0011011
        title: Subacute
      CHRONIC:
        text: CHRONIC

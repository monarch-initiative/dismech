  AssociationSignalMethodEnum:
    name: AssociationSignalMethodEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/AssociationSignalMethodEnum
    description: Method used to derive an association signal
    from_schema: https://w3id.org/monarch-initiative/dismech
    permissible_values:
      EHR_TEMPORAL_COMORBIDITY:

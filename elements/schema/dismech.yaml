  HistopathologyFinding:
    name: HistopathologyFinding
    definition_uri: https://w3id.org/monarch-initiative/dismech/HistopathologyFinding
    description: A histopathologic finding from microscopic examination of tissue.
      Includes morphologic features, architectural patterns, cellular characteristics,
      growth patterns, and histologic grading.
    comments:
    - '{''For cancers'': ''tumor grade, differentiation, growth patterns, necrosis,
      rosettes''}'
    - '{''For other diseases'': ''inflammatory infiltrates, architectural distortion,
      fibrosis''}'
    - Separate from phenotypes as these are microscopic observations requiring biopsy
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - HistopathologyFinding_name
    - finding_term
    - HistopathologyFinding_description
    - HistopathologyFinding_frequency
    - HistopathologyFinding_diagnostic
    - evidence
    - notes
    - HistopathologyFinding_context
    - subtype
    slot_usage:
      name:
        name: name
        description: Name of the histopathologic finding
        examples:
        - value: Flexner-Wintersteiner Rosettes
        - value: Spindle Cell Morphology
        - value: High Grade (Fuhrman Grade 3-4)
      description:
        name: description
        description: Detailed description of the finding and its clinical significance
      frequency:
        name: frequency
        description: How frequently this finding is observed in the disease
      diagnostic:
        name: diagnostic
        description: Whether this finding is pathognomonic or highly diagnostic
      context:
        name: context
        description: Context in which this finding is observed (e.g., specific subtype)
    class_uri: dismech:HistopathologyFinding
  ImagingFinding:
    name: ImagingFinding
    definition_uri: https://w3id.org/monarch-initiative/dismech/ImagingFinding
    description: A finding detected by in-vivo medical imaging (MRI, CT, PET, ultrasound,
      etc.) that reflects disease pathophysiology or defines a diagnostic criterion.
      The macroscopic / in-vivo counterpart of HistopathologyFinding. Captures the
      modality plus the imaging appearance - NOT acquisition protocol, per-patient
      reads, or radiology decision support.
    comments:
    - Separate from phenotypes - names the modality plus appearance, even when the
      abnormality is also an HP phenotype (cross-linked via phenotype_term)
    - Separate from histopathology - in-vivo / macroscopic, no biopsy
    - Separate from the generic diagnosis slot - carries a structured finding rather
      than a free-text test name
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - ImagingFinding_name
    - ImagingFinding_modality
    - imaging_finding_term
    - ImagingFinding_description
    - ImagingFinding_located_in
    - laterality
    - spatial_extent
    - ImagingFinding_phenotype_term
    - ImagingFinding_diagnostic
    - frequency
    - modifier
    - evidence
    - notes
    - ImagingFinding_context
    - subtype
    slot_usage:
      name:
        name: name
        description: Name of the imaging finding
      description:
        name: description
        description: Detailed description of the finding and its clinical significance
        examples:
        - value: Multifocal periventricular white matter lesions on MRI
        - value: Gadolinium-enhancing lesion
        - value: Cerebral atrophy on CT
      modality:
        name: modality
        description: The imaging modality by which this finding is detected
      located_in:
        name: located_in
        description: Anatomical body site of the finding (UBERON)
      phenotype_term:
        name: phenotype_term
        description: Optional HP phenotype this imaging finding also maps to
      diagnostic:
        name: diagnostic
        description: Whether this finding is pathognomonic or defines a diagnostic
          criterion
      context:
        name: context
        description: Context in which this finding is observed (e.g., specific subtype)
    class_uri: dismech:ImagingFinding

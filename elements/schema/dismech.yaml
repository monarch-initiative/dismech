          to cytokines)
  ChannelopathyOrganSystemEnum:
    name: ChannelopathyOrganSystemEnum
    definition_uri: https://w3id.org/monarch-initiative/dismech/ChannelopathyOrganSystemEnum
    description: Classification categories for channelopathies by affected organ system.
      Tag diseases like Long QT syndrome (cardiac), periodic paralysis (skeletal muscle),
      episodic ataxia (neurological), cystic fibrosis (epithelial).
    from_schema: https://w3id.org/monarch-initiative/dismech/classifications/channelopathies
    permissible_values:
      cardiac channelopathy:
        text: cardiac channelopathy
        description: Ion channel disorders primarily affecting cardiac rhythm (Long
          QT, Brugada, CPVT)
      skeletal muscle channelopathy:
        text: skeletal muscle channelopathy
        description: Ion channel disorders causing episodic weakness or myotonia

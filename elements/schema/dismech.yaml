  HistopathologyFindingDescriptor:
    name: HistopathologyFindingDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/HistopathologyFindingDescriptor
    description: A descriptor for histopathologic findings, bindable to the NCIT Histopathology
      Result branch (C83490) - Morphologic Finding (C35867), Immunophenotypic Finding
      (C40998), Ultrastructural Finding (C43265), Staining Intensity (C127762), Histologic
      Grade (C18000) - or HP Abnormal cell morphology (HP:0025461)
    comments:
    - Use for architectural patterns (spindle cell, epithelioid, nested, etc.)
    - Use for differentiation status (well/poorly differentiated)
    - Use for specific findings (rosettes, necrosis, mitotic activity)
    - Use for immunophenotype/IHC markers (ER-positive by IHC, CD20-positive cells,
      loss of SDHB expression)
    - Use for histologic grades when applicable
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - HistopathologyFindingDescriptor_term
    slot_usage:
      term:
        name: term
        description: NCIT or HP histopathology finding term reference
        bindings:
        - range: HistopathologyFindingTerm
          obligation_level:
            text: REQUIRED
            description: The metadata element is required to be present in the model
          binds_value_of: id
    class_uri: dismech:HistopathologyFindingDescriptor
  ImagingFindingDescriptor:
    name: ImagingFindingDescriptor
    definition_uri: https://w3id.org/monarch-initiative/dismech/ImagingFindingDescriptor
    description: A descriptor for an in-vivo imaging finding, bindable to the NCIT
      Imaging Finding branch (C176708 / C199145) or an HP imaging-observable phenotype.
      Inherits located_in (UBERON body site), laterality, spatial_extent, and modifier
      from Descriptor for post-composition.
    comments:
    - Use for imaging appearances (white-matter lesions, atrophy, enhancement, hyperintensity)
    - Body site goes in located_in (UBERON); focal/multifocal/diffuse in spatial_extent
    from_schema: https://w3id.org/monarch-initiative/dismech
    is_a: Descriptor
    slots:
    - preferred_term
    - Descriptor_description
    - modifier
    - located_in
    - laterality
    - spatial_extent
    - onset
    - temporality
    - clinical_course
    - severity
    - qualifiers
    - ImagingFindingDescriptor_term
    slot_usage:
      term:
        name: term
        description: NCIT imaging-finding or HP phenotype term reference
        bindings:
        - range: ImagingFindingTerm
          obligation_level:
            text: RECOMMENDED
            description: The metadata element is recommended to be present in the
              model
          binds_value_of: id
    class_uri: dismech:ImagingFindingDescriptor
  ElectrophysiologyContext:
    name: ElectrophysiologyContext
    definition_uri: https://w3id.org/monarch-initiative/dismech/ElectrophysiologyContext
    description: 'An optional post-composition sidecar on a Phenotype, carrying the
      electrophysiologic axes that a flat HP phenotype term cannot express: the modality
      it was recorded on, whether it is ictal/interictal/postictal, and the behavioural/activation
      recording state. Used ONLY on phenotypes whose phenotype_term is an electrophysiologic
      finding (the HP EEG/EMG/EKG abnormality subtrees, e.g. descendants of HP:0002353).
      Deliberately NOT a separate finding class: because electrophysiologic findings
      are already HP phenotypes, they live in `phenotypes` and this block only post-composes
      them, exactly as temporality/clinical_course/severity/onset do elsewhere.'
    comments:
    - Attach to a phenotype whose phenotype_term is under HP:0002353 (EEG), HP:0003457
      (EMG), or HP:0003115 (EKG)
    - Preclinical/animal electrophysiology (e.g. an electrographic seizure with no
      HP term) is a preferred_term-only phenotype carrying this sidecar
    from_schema: https://w3id.org/monarch-initiative/dismech
    slots:
    - electrophysiology_modality
    - ictal_state
    - recording_state
    class_uri: dismech:ElectrophysiologyContext

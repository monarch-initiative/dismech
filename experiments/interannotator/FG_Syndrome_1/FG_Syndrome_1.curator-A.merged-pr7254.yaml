discussions:
- discussion_id: fgs1_tissue_relevance_of_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the REST-silencing, GLI3-SHH, and immediate-early gene defects demonstrated in
    patient-derived EBV-immortalized lymphoblastoid cells actually operate in the human
    tissues that are malformed in FGS1 (developing cortex and callosal projection
    neurons, enteric nervous system, cardiac outflow tract, anorectal mesenchyme)?
  attaches_to:
  - pathophysiology#Impaired Neuronal Differentiation and Cortical Development
  - pathophysiology#Failure of Corpus Callosum Formation
  rationale: >-
    All three mechanistic arms of FGS1 rest on lymphoblastoid cell lines or engineered
    MED12-null rescue systems. Lymphoblasts do not model developing cortical neurons,
    enteric neurons, cardiomyocytes, or anorectal mesenchyme, and the immediate-early
    gene effect is explicitly reported to be cell-type specific. Evidence therefore
    exists but its translational validity to the affected human tissues is the open
    question, which is a model-fidelity gap rather than an absence of data. No knock-in
    model reproducing the complete human FGS1 phenotype has been reported.
  proposed_experiments:
  - experiment_id: fgs1_isogenic_ipsc_lineage_panel
    name: Isogenic MED12 p.Arg961Trp knock-in human iPSC lineage panel
    description: >-
      Generate isogenic MED12 p.Arg961Trp knock-in human iPSC lines and differentiate
      them into cortical neurons, enteric neural crest derivatives, and cardiomyocytes.
      Profile REST target derepression, GLI3-dependent SHH target expression (CREB5,
      BMP4, NEUROG2), and stimulus-evoked immediate-early gene responses, comparing
      each lineage against the published lymphoblastoid signatures.
    decision_criterion: >-
      Concordance of the neural, enteric, and cardiac signatures with the
      lymphoblastoid findings would support tissue generality; lineage-restricted or
      divergent signatures would establish that lymphoblastoid data cannot be
      extrapolated to the malformed tissues.
  - experiment_id: fgs1_knockin_mouse_phenotyping
    name: MED12 p.Arg961Trp knock-in mouse phenotyping
    description: >-
      Generate and phenotype a Med12 p.Arg961Trp knock-in mouse for callosal,
      anorectal, cardiac, and behavioural phenotypes, with parallel transcriptomic
      profiling of the affected tissues during the relevant developmental windows.
    decision_criterion: >-
      Recapitulation of callosal and anorectal defects would establish an in vivo model
      for FGS1; failure to recapitulate would itself constitute an informative
      human-model mismatch requiring human-derived systems.
  evidence:
  - reference: PMID:28369444
    reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, the effect of MED12 mutations has cell-type specificity on IEG
      expression.
    explanation: >-
      Explicit demonstration that the mechanistic readout is cell-type dependent, which
      is precisely why lymphoblastoid findings cannot be assumed to hold in the
      affected tissues.
  - reference: PMID:33925166
    reference_title: "MED12-Related (Neuro)Developmental Disorders: A Question of Causality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We propose an isogenic iNeuron model to establish the unique gene expression
      patterns that are associated with the specific MED12 variants.
    explanation: >-
      Independent expert proposal of exactly the isogenic neuronal model needed to
      resolve the mismatch, confirming this is a recognized open question.
notes: >-
  Scope note: this entry covers the molecularly defined MED12-related entity
  (MONDO:0010590, OMIM:305450). It deliberately does not curate the historical,
  purely clinical "FG syndrome" label (MONDO:0002010), which is genetically
  heterogeneous and encompasses FLNA (FGS2), CASK (FGS4), UPF3B (FGS6), and BRWD3
  (FGS7) loci; fewer than 3% of clinically diagnosed cases carry the MED12 variant.
  Quantitative phenotype frequencies in this entry derive from a single cohort of 23
  molecularly confirmed males from 10 families with variable per-feature denominators;
  they are descriptive cohort proportions and should not be read as population
  penetrance estimates. There is overlap with the existing
  Mediator_Complex_Neurodevelopmental_Disorder entry, which models the broader
  mediatoropathy spectrum (MED12/MED13/MED13L/MED23) at the disease-family level; this
  entry provides the gene- and variant-specific FGS1 detail.

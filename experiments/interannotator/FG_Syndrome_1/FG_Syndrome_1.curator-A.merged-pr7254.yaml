genetic:
- name: MED12
  notes: >-
    MED12 (Xq13.1) encodes the largest subunit of the Mediator CDK8 kinase module.
    Classic FGS1 is defined by the single recurrent hemizygous missense variant
    c.2881C>T (p.Arg961Trp) in exon 21. Other MED12 missense variants cause allelic
    but distinct disorders (Lujan-Fryns syndrome, classically p.Asn1007Ser; X-linked
    Ohdo syndrome), and de novo protein-truncating variants in females cause Hardikar
    syndrome or a severe syndromic intellectual disability phenotype; none of these
    should be labelled FGS1. A second FGS1-causing missense variant, p.Gly958Glu, has
    been reported in one family, showing that p.Arg961Trp is not strictly the only
    FGS1 allele.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  inheritance:
  - name: X-linked recessive inheritance
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  evidence:
  - reference: PMID:17334363
    reference_title: "A recurrent mutation in MED12 leading to R961W causes Opitz-Kaveggia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here that the original family for whom the condition is named and five
      other families have a recurrent mutation (2881C>T, leading to R961W) in MED12
      (also called TRAP230 or HOPA), a gene located at Xq13
    explanation: >-
      Establishes MED12 as the causative gene and localizes it to Xq13.
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of an MED12-related disorder is established in a male by
      identification of a hemizygous MED12 pathogenic variant on molecular genetic
      testing.
    explanation: >-
      GeneReviews defines molecular diagnosis of MED12-related disorders, including
      FGS1, by hemizygous MED12 variant identification in males.
  - reference: PMID:33925166
    reference_title: "MED12-Related (Neuro)Developmental Disorders: A Question of Causality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Missense variants in MED12 cause FG syndrome, Lujan-Fryns syndrome, and Ohdo
      syndrome, as well as non-syndromic intellectual disability (ID) in hemizygous
      males.
    explanation: >-
      Places FGS1 within the MED12 missense allelic series and distinguishes it from
      the other MED12-related phenotypes.
variants:
- name: MED12 c.2881C>T (p.Arg961Trp)
  description: >-
    The defining FGS1 variant: NM_005120.3:c.2881C>T in exon 21 of MED12, causing the
    p.Arg961Trp missense substitution. It is germline and hemizygous in affected
    males, recurrent across unrelated families, and maternally transmitted rather than
    de novo in the reported cohort. Functionally it produces a pathway-selective
    altered-function defect rather than complete loss of MED12 function.
  type: missense
  clinical_significance: PATHOGENIC
  gene:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:17334363
    reference_title: "A recurrent mutation in MED12 leading to R961W causes Opitz-Kaveggia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a recurrent mutation (2881C>T, leading to R961W) in MED12
    explanation: >-
      Defines the exact nucleotide and protein change for the recurrent FGS1 variant.
  - reference: PMID:18973276
    reference_title: "Behavior of 10 patients with FG syndrome (Opitz-Kaveggia syndrome) and the p.R961W mutation in the MED12 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2007, Risheg et al. identified an identical nucleotide substitution
      (c.2881C>T) in exon 21 of MED12 (p.R961W) in six families with Opitz-Kaveggia
      syndrome, including a surviving affected male from the original Opitz-Kaveggia
      family.
    explanation: >-
      Localizes the variant to exon 21 and confirms its identity across six
      independently ascertained families including the original family.
- name: MED12 p.Gly958Glu
  description: >-
    A second, non-recurrent MED12 missense variant reported in one family with three
    affected cousins whose clinical phenotype matched Opitz-Kaveggia syndrome. It
    demonstrated for the first time that FGS1 is not exclusively caused by
    p.Arg961Trp, although p.Arg961Trp remains the defining and by far the most common
    allele.
  type: missense
  clinical_significance: LIKELY_PATHOGENIC
  gene:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:20507344
    reference_title: "A novel mutation in MED12 causes FG syndrome (Opitz-Kaveggia syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report on a new family with three affected cousins, in which we
      identified a novel MED12 mutation (p.G958E). This is the first demonstration that
      other mutations in this gene can also lead to Opitz-Kaveggia syndrome.
    explanation: >-
      Directly reports the second FGS1-causing MED12 allele and states its
      significance.
diagnosis:
- name: MED12 molecular genetic testing
  description: >-
    Diagnosis requires a compatible phenotype plus identification of a hemizygous
    pathogenic MED12 variant in a male, with p.Arg961Trp defining classic FGS1.
    Targeted testing for c.2881C>T is efficient when the classic phenotype or a known
    familial variant is present; otherwise an intellectual disability/congenital
    anomaly gene panel containing MED12, or exome/genome sequencing, is appropriate,
    followed by full MED12 gene sequencing if targeted analysis is negative.
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of an MED12-related disorder is established in a male by
      identification of a hemizygous MED12 pathogenic variant on molecular genetic
      testing.
    explanation: >-
      GeneReviews states the molecular diagnostic criterion for MED12-related
      disorders in males.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      when the clinical diagnosis of FG syndrome is suspected, we recommend first
      testing for the recurrent mutation, followed by gene sequencing if targeted
      mutation analysis is negative.
    explanation: >-
      Gives the recommended tiered molecular testing strategy for suspected FGS1.
- name: Clinical algorithm for targeted p.Arg961Trp testing
  description: >-
    A six-criterion clinical algorithm derived from comparing 23 p.Arg961Trp-positive
    males with 48 mutation-negative patients carrying a clinical FG syndrome
    diagnosis. Criteria centre on the characteristic facies, affable personality,
    congenital anomaly (or an affected relative with one), small ears, macrocephaly,
    and the infantile hypotonia/feeding difficulty/constipation triad. It achieves
    100% sensitivity and 90% specificity for the recurrent MED12 variant. It is best
    used as historical triage: contemporary practice generally reaches the diagnosis
    by sequencing.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The algorithm identifies the p.R961W MED12 mutation-positive group with 100%
      sensitivity and 90% specificity.
    explanation: >-
      Reports the diagnostic performance of the clinical triage algorithm.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These features were seen most often in affected male patients: characteristic
      facies (13 of 13), an affable personality (13 of 13), a congenital anomaly (11 of
      13) or an affected relative with a congenital anomaly (2 of 13), and at least 1
      of these 3 traits: infantile hypotonia, feeding difficulties, and constipation
      (13 of 13).
    explanation: >-
      Enumerates the discriminating features that constitute the algorithm criteria.
- name: Baseline echocardiography
  description: >-
    Cardiac imaging is a core baseline evaluation at diagnosis, since congenital
    cardiac anomalies were documented in 11 of 18 evaluable molecularly confirmed
    males and congenital heart defects are among the manifestations GeneReviews
    directs to routine management.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      congenital cardiac anomalies (11 of 18)
    explanation: >-
      The high observed rate of congenital cardiac anomalies is the rationale for

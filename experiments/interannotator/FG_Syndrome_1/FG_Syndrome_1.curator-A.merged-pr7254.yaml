name: FG Syndrome 1
creation_date: "2026-07-31T00:35:00Z"
category: Mendelian
description: >-
  FG syndrome 1 (FGS1, Opitz-Kaveggia syndrome) is a rare X-linked multiple congenital
  anomaly-intellectual disability syndrome caused by the recurrent MED12 c.2881C>T
  (p.Arg961Trp) missense variant at Xq13. The recognizable phenotype comprises
  congenital hypotonia, feeding difficulties and severe constipation, cognitive
  impairment ranging from borderline to severe, agenesis or hypoplasia of the corpus
  callosum, relative or absolute macrocephaly, a distinctive facial gestalt (tall
  prominent forehead, frontal hair upsweep, downslanted palpebral fissures, small
  simple ears), anal anomalies, congenital heart defects, broad thumbs and halluces,
  and a characteristic friendly, loquacious, eager-to-please personality with
  hyperactivity and short attention span. Mechanistically, MED12 is a subunit of the
  dissociable CDK8 kinase module of the Mediator complex, and p.Arg961Trp causes a
  pathway-selective transcriptional-regulatory defect rather than complete loss of
  MED12 function, disrupting REST/NRSF-dependent neuronal gene silencing,
  GLI3-dependent Sonic hedgehog target transcription, and immediate-early gene
  regulation. The molecularly defined entity must be distinguished from the older,
  purely clinical "FG syndrome" label, which is genetically heterogeneous: fewer than
  3% of individuals given that clinical diagnosis carry the MED12 p.Arg961Trp variant.

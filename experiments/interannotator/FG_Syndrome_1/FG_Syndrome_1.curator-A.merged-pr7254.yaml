differential_diagnoses:
- name: Lujan-Fryns syndrome
  description: >-
    An allelic MED12 disorder, classically caused by p.Asn1007Ser, sharing cognitive
    impairment, hypotonia, and corpus callosum abnormality with FGS1 but distinguished
    by a tall thin body habitus, long thin face, prominent nasal bridge, high narrow
    palate, and short philtrum rather than the FGS1 facial gestalt and anorectal
    malformations.
  distinguishing_features:
  - Marfanoid tall thin body habitus and long thin face rather than the FGS1 gestalt
  - Short philtrum and high narrow palate
  - Absence of the FGS1 anorectal malformations and broad thumbs/halluces
  - Different MED12 missense variant (classically p.Asn1007Ser)
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LS is further characterized by large head, tall thin body habitus, long thin
      face, prominent nasal bridge, high narrow palate, and short philtrum.
    explanation: >-
      GeneReviews enumerates the features that distinguish Lujan syndrome from FGS1
      within the MED12 spectrum.
- name: X-linked Ohdo syndrome (Maat-Kievit-Brunner type)
  description: >-
    A further allelic MED12 disorder characterized by intellectual disability,
    blepharophimosis, and facial coarsening at an older age, distinguishing it from
    the FGS1 gestalt.
  distinguishing_features:
  - Blepharophimosis
  - Progressive facial coarsening with age
  - Absence of the FGS1 tall forehead, frontal upsweep, and small simple ears
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XLOS is characterized by intellectual disability, blepharophimosis, and facial
      coarsening.
    explanation: >-
      GeneReviews gives the discriminating features of X-linked Ohdo syndrome within
      the MED12 spectrum.
- name: Hardikar syndrome
  description: >-
    Caused by de novo MED12 protein-truncating variants in females, presenting with
    cleft lip/palate, biliary and liver anomalies, intestinal malrotation, pigmentary
    retinopathy, and coarctation of the aorta, and notably without intellectual
    disability. It is the female-restricted end of the MED12 spectrum and shares
    essentially no clinical overlap with FGS1.
  distinguishing_features:
  - Occurs in females rather than hemizygous males
  - Intellectual disability is absent
  - Hepatobiliary anomalies, intestinal malrotation, and pigmentary retinopathy
  - Caused by de novo protein-truncating rather than missense MED12 variants
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HS has been described in females with cleft lip and/or cleft palate, biliary and
      liver anomalies, intestinal malrotation, pigmentary retinopathy, and coarctation
      of the aorta. Developmental and cognitive concerns have not been reported in
      females with HS.
    explanation: >-
      GeneReviews gives the discriminating clinical profile of Hardikar syndrome.
- name: MED12-negative FG syndrome phenotypes
  description: >-
    The large majority of individuals historically given a clinical FG syndrome
    diagnosis do not carry a MED12 variant. Systematic re-evaluation of 30 such
    patients identified the recurrent variant in only the single individual with the
    typical phenotype, and a definite or possible alternative diagnosis was found in
    10 of the remaining 29. Variants in FLNA, UPF3B, and BRWD3 account for some
    families previously mapped to "FG syndrome" loci.
  distinguishing_features:
  - No MED12 variant identified on full gene sequencing
  - A broader, less specific picture of hypotonia, constipation, and relative macrocephaly
  - Absence of the full FGS1 facial gestalt and congenital anomaly burden
  - Alternative X-linked causes including FLNA, UPF3B, and BRWD3
  evidence:
  - reference: PMID:18805826
    reference_title: "Clinical experience in the evaluation of 30 patients with a prior diagnosis of FG syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The R961W mutation was identified in the only patient who had the typical
      phenotype previously associated with this mutation. The remaining 29 patients
      displayed a wide variety of features and were shown to be negative for mutations
      in the entire MED12 gene. A definite or possible alternative diagnosis was
      identified in 10 of these patients.
    explanation: >-
      Directly quantifies how rarely a clinical FG syndrome diagnosis is molecularly
      confirmed and how often an alternative diagnosis emerges.
  - reference: PMID:24123922
    reference_title: "MED12 related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The existence of genetic heterogeneity was further supported by the
      identification of mutations in three X-linked genes, FLNA, BRWD3 and UPF3B
    explanation: >-
      Names the alternative X-linked genes accounting for part of the historical FG
      syndrome heterogeneity.

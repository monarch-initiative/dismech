  evidence:
  - reference: PMID:17334363
    reference_title: "A recurrent mutation in MED12 leading to R961W causes Opitz-Kaveggia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here that the original family for whom the condition is named and five
      other families have a recurrent mutation (2881C>T, leading to R961W) in MED12
      (also called TRAP230 or HOPA), a gene located at Xq13 that functions as a thyroid
      receptor-associated protein in the Mediator complex.
    explanation: >-
      Establishes the causal recurrent variant and localizes the defect to a Mediator
      complex subunit.
  - reference: PMID:33925166
    reference_title: "MED12-Related (Neuro)Developmental Disorders: A Question of Causality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The kinase module consists of MED12, MED13, Cyclin C (CCNC), and cyclin-dependent
      kinase 8 (CDK8), and the paralogs MED12L, MED13L, and CDK19.
    explanation: >-
      Places MED12 within the dissociable Mediator kinase module, defining the
      molecular context of the lesion.
  - reference: PMID:33925166
    reference_title: "MED12-Related (Neuro)Developmental Disorders: A Question of Causality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MED12 interacts with DNA-bound transcription factors and hence acts as a hub for
      the communication of transcription factors with the kinase subunit and core
      Mediator
    explanation: >-
      Explains why a single MED12 missense change can selectively perturb the
      transcription-factor-specific arms of Mediator signalling.
  downstream:
  - target: Impaired REST-Dependent Silencing of Neuronal Genes
    causal_link_type: DIRECT
    description: >-
      The MED12 interface within Mediator is the physical link between REST/NRSF and
      G9a-dependent repressive chromatin marking; the FGS1 missense change disrupts
      that corepressor function.
  - target: Derepression of GLI3-Dependent Sonic Hedgehog Target Transcription
    causal_link_type: DIRECT
    description: >-
      MED12 normally restrains GLI3-dependent SHH target-gene transcription; the FGS1
      variant fails to restore that suppression and shows reduced CDK8 recruitment at
      GLI3 target sites.
  - target: Dysregulated Immediate-Early Gene Response
    causal_link_type: DIRECT
    description: >-
      Each MED12 patient variant, including p.Arg961Trp, produces its own
      immediate-early gene expression signature tracking MED12/Pol II promoter
      occupancy.
- name: Impaired REST-Dependent Silencing of Neuronal Genes
  biological_scale: MOLECULAR
  description: >-
    Mediator, the G9a histone methyltransferase, and the RE1 silencing transcription
    factor (REST/NRSF) form a protein interaction network that keeps neuronal genes
    silenced in non-neuronal cells, with the MED12 interface linking REST to
    G9a-dependent histone H3K9 dimethylation. Missense MED12 changes causing FG and
    Lujan syndromes disrupt this REST corepressor function, so neuronal genes escape
    scheduled repression. Rescue experiments indicate that p.Arg961Trp specifically
    fails to restore REST-mediated silencing while retaining beta-catenin rescue
    capacity, marking this as a pathway-selective, kinase-independent defect.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  evidence:
  - reference: PMID:18691967
    reference_title: "Mediator links epigenetic silencing of neuronal gene expression with x-linked mental retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the MED12 interface in Mediator links REST with G9a-dependent
      histone H3K9 dimethylation to suppress neuronal genes in nonneuronal cells.
      Notably, missense mutations in MED12 causing the X-linked mental retardation
      (XLMR) disorders FG syndrome and Lujan syndrome disrupt its REST corepressor
      function.
    explanation: >-
      Directly demonstrates that the FG syndrome MED12 missense change abolishes the
      REST corepressor activity of the MED12 interface.
  - reference: PMID:18691967
    reference_title: "Mediator links epigenetic silencing of neuronal gene expression with x-linked mental retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings implicate Mediator in epigenetic restriction of neuronal gene
      expression to the nervous system and suggest a pathologic basis for
      MED12-associated XLMR involving impaired REST-dependent neuronal gene regulation.
    explanation: >-
      States the proposed pathogenic mechanism linking impaired REST-dependent
      regulation to MED12-associated intellectual disability.
  downstream:
  - target: Impaired Neuronal Differentiation and Cortical Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      REST/NRSF silences neuronal genes in non-neuronal and progenitor cells, so
      unscheduled derepression is proposed to disturb the timing of neuronal
      differentiation directly; the link has not been demonstrated in affected
      human fetal tissue.
  - target: Failure of Corpus Callosum Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Callosal projection neurons must differentiate on schedule before their
      axons can cross the midline, so mistimed REST-dependent derepression is
      proposed to act on callosal formation via the neuronal-differentiation
      defect above rather than independently of it; not demonstrated in affected
      human fetal tissue.
- name: Derepression of GLI3-Dependent Sonic Hedgehog Target Transcription
  biological_scale: MOLECULAR
  description: >-
    Activated GLI3 physically targets the MED12 interface within Mediator to reverse
    Mediator-dependent suppression of Sonic hedgehog target-gene transcription,
    placing MED12 as a direct restraint on the pathway. In patient-derived
    lymphoblastoid lines carrying MED12 XLID variants, transcripts of the
    GLI3-dependent SHH targets CREB5, BMP4, and NEUROG2 are significantly elevated,
    and p.Arg961Trp fails to restore normal SHH inhibition while showing reduced CDK8
    recruitment at GLI3 sites. Because SHH-GLI signalling patterns the forebrain,
    craniofacial skeleton, limb, gut, and heart, this arm offers a plausible unifying
    explanation for the multi-system malformation pattern of FGS1.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:17000779
    reference_title: "Mediator modulates Gli3-dependent Sonic hedgehog signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that activated Gli3 physically targets the MED12 interface within
      Mediator in order to functionally reverse Mediator-dependent suppression of Shh
      target gene transcription.
    explanation: >-
      Establishes MED12 as a direct modulator of GLI3-dependent hedgehog target
      transcription, the pathway shown to be dysregulated in FGS1 patient cells.
  - reference: PMID:30729724
    reference_title: "Dysregulations of sonic hedgehog signaling in MED12-related X-linked intellectual disability disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transcript levels of three Gli3-dependent SHH-signaling genes, CREB5, BMP4, and
      NEUROG2, were determined by quantitative RT-PCR and found to be significantly
      elevated in lymphoblasts from patients with three mutations in the MED12-LS
      domain.
    explanation: >-
      Provides patient-cell evidence that MED12 disease variants derepress
      GLI3-dependent SHH target genes.
  - reference: PMID:30729724
    reference_title: "Dysregulations of sonic hedgehog signaling in MED12-related X-linked intellectual disability disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results support a critical role of MED12 in regulating Gli3-dependent SHH
      signaling and in developing ID and related congenital malformations in XLID
      syndromes.
    explanation: >-
      Links MED12-dependent SHH dysregulation to both the intellectual disability and
      the congenital malformations that define FGS1.
  downstream:
  - target: Failure of Corpus Callosum Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      GLI3 dose sets dorsoventral forebrain and midline patterning, and callosal
      agenesis is a recognised feature of GLI3-related disorders, making this the
      most plausible of the three arms for the callosal defect; not demonstrated
      directly in affected human tissue.
  - target: Impaired Neuronal Differentiation and Cortical Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SHH-GLI3 signalling regulates cortical progenitor proliferation and the
      neurogenic-to-gliogenic transition, so altered GLI3-dependent output is a
      plausible route to disturbed neuronal differentiation; not demonstrated
      directly in affected human tissue.
  - target: Anorectal Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SHH-GLI3 signalling patterns hindgut and cloacal septation, and anorectal
      malformation is part of the Gli3-mutant and SHH-pathway phenotype, making
      this arm the plausible route to the anorectal defect; not demonstrated
      directly in affected human tissue.
  - target: Cardiac Septation Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hedgehog signalling in second-heart-field and atrial septal progenitors is
      required for normal septation, so altered GLI3-dependent output is a
      plausible route to the septal defect; not demonstrated directly in affected
      human tissue.
  - target: Craniofacial and Skeletal Dysmorphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      GLI3 is the principal SHH effector in frontonasal, palatal and limb
      patterning, and craniofacial and digital anomalies are cardinal features of
      GLI3-related disorders, making this arm the plausible route to the
      dysmorphic features; not demonstrated directly in affected human tissue.
- name: Dysregulated Immediate-Early Gene Response
  biological_scale: CELLULAR
  description: >-
    In EBV-immortalized lymphoblastoid cells from patients, individual MED12 variants
    including p.Arg961Trp generate variant-specific expression patterns of the
    immediate-early genes JUN, FOS, and EGR1, mirrored by the presence or absence of
    the MED12-containing complex and RNA polymerase II at their promoters. The effect
    is cell-type specific, and downstream late-response genes involved in neural
    plasticity and neuronal gene specification are consequently disturbed. This arm
    supports a model in which stimulus-responsive transcription, rather than
    constitutive housekeeping transcription, is the vulnerable process.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  evidence:
  - reference: PMID:28369444
    reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we investigated several MED12 patients mutations (p.R206Q, p.N898D,
      p.R961W, p.N1007S, p.R1148H, p.S1165P and p.R1295H) and show that each MED12
      mutations cause specific expression patterns of JUN, FOS and EGR1 immediate early
      genes (IEGs), reflected by the presence or absence of MED12 containing complex at
      their respective promoters.
    explanation: >-
      Demonstrates that p.Arg961Trp, among other MED12 variants, produces a distinct
      immediate-early gene signature tied to MED12 promoter occupancy.
  - reference: PMID:28369444
    reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest that the differences between MED12-related phenotypes are
      essentially the result of distinct IEGs expression patterns
    explanation: >-
      Proposes variant-specific immediate-early gene dysregulation as the basis for
      the distinct clinical syndromes within the MED12 allelic series.
  downstream:
  - target: Impaired Neuronal Differentiation and Cortical Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Immediate-early gene programmes couple extracellular cues to the
      activity-dependent transcription that neuronal differentiation and circuit
      maturation depend on, so variant-specific IEG dysregulation is proposed to
      impair that step; the evidence base is lymphoblastoid rather than
      tissue-resident, so the neural relevance is inferred.
  - target: Failure of Corpus Callosum Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Midline axon guidance and callosal targeting are activity- and
      stimulus-responsive, so disturbed IEG programmes are proposed to reach the
      callosal defect through the neuronal-differentiation step above; the
      evidence base is lymphoblastoid rather than tissue-resident.
- name: Failure of Corpus Callosum Formation
  biological_scale: TISSUE
  description: >-
    Agenesis or hypoplasia of the corpus callosum was present in all 13 individuals of
    the molecularly confirmed cohort who underwent neuroimaging, making it the single
    most characteristic structural consequence of the MED12 lesion. The developmental
    step that fails is midline commissural axon guidance and callosal tract formation.
    The link from the upstream transcriptional arms to this specific structure is
    biologically coherent but has not been demonstrated in affected human fetal brain.
  mechanism_confidence: PROVISIONAL

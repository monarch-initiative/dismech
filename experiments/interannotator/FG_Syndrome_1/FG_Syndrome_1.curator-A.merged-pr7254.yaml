inheritance:
- name: X-linked recessive inheritance
  description: >-
    FGS1 is inherited in an X-linked manner. Affected individuals are hemizygous males;
    heterozygous carrier females in the reported FGS1 families are clinically and
    intellectually unaffected, so the pattern behaves as X-linked recessive. No de novo
    cases with a confirmed MED12 p.Arg961Trp variant have been documented in the core
    cohort; transmission is through obligate carrier mothers.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier females in families with FGS1 and LS are typically unaffected.
    explanation: >-
      GeneReviews states that heterozygous carrier females in FGS1 families are
      typically unaffected, consistent with X-linked recessive expression.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are no mentally retarded females in these 10 families. All mothers in our
      series are intellectually normal and all are heterozygous for the p.R961W
      mutation in MED12.
    explanation: >-
      Direct cohort observation that obligate heterozygous mothers are intellectually
      normal, supporting recessive X-linked expression in this disorder.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There have been no de novo patients with a confirmed MED12 mutation.
    explanation: >-
      Supports the statement that all molecularly confirmed FGS1 cases in the core
      cohort were maternally transmitted rather than de novo.
prevalence:
- population: Molecularly confirmed cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence estimate exists for molecularly confirmed
    FGS1. The definitive series comprised 23 p.Arg961Trp-positive males from 10
    families. Population-level figures for the historical clinical "FG syndrome" label
    should not be applied to this MED12-defined entity.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We ascertained 23 males with the p.R961W mutation in MED12 from 9 previously
      reported FG syndrome families and 1 new family.
    explanation: >-
      Establishes the size of the entire known molecularly confirmed FGS1 cohort at
      the time of the definitive phenotype review, supporting an ultra-rare
      classification based on literature case counts.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lifelong intellectual disability with communication impairment and dependence in
    daily living, chronic bowel dysfunction, structural congenital anomalies requiring
    surgery, and appreciable early-childhood mortality. Burden lessens after infancy:
    hypotonia improves with age and long-term survival into the fifth and sixth decades
    is documented.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FG syndrome can be life threatening. In these 10 families, early deaths and
      multiple miscarriages were common
    explanation: >-
      Documents the high early clinical burden and mortality risk in molecularly
      confirmed FGS1 families.
progression:
- phase: Neonatal and infantile presentation
  age_range: birth to 1 year
  notes: >-
    FGS1 presents at birth or in early infancy with congenital hypotonia, feeding
    difficulties, and constipation, together with structural anomalies (anorectal
    malformations, congenital heart defects, corpus callosum agenesis/hypoplasia) that
    may be recognized neonatally. Mortality is concentrated in this window; one or more
    affected males died in childhood in 8 of the 10 reported families.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the 10 families reported here produced 30 live-born affected male
      patients, 1 or more affected individuals died in childhood in 8 of these 10
      families.
    explanation: >-
      Establishes that early-childhood mortality is a defining feature of the initial
      phase of the disorder.
- phase: Childhood
  age_range: 1 to 12 years
  notes: >-
    Developmental delay, cognitive impairment, and the characteristic behavioral
    profile (friendly, loquacious, hyperactive, short attention span) become evident.
    Facial gestalt is most readily recognized in early childhood. After the first year
    of life mortality is not markedly increased.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, after the first year of life, mortality does not seem to be
      significantly increased. Hypotonia improves or resolves with age.
    explanation: >-
      Supports both the improved survival and the improvement of hypotonia beyond
      infancy.
- phase: Adolescence and adulthood
  age_range: 13 years and older
  notes: >-
    Hypotonia improves or resolves, but intellectual, speech, and adaptive limitations
    persist. Behavior may shift toward episodic aggressive, self-injurious, or
    obsessive-compulsive patterns emerging around puberty and early adulthood, with
    anxiety around transitions. Survival into the fifth and sixth decades is documented.
  evidence:
  - reference: PMID:20981778
    reference_title: "Behavioral features in young adults with FG syndrome (Opitz-Kaveggia syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These individuals had episodic and longstanding behavior patterns, sometimes
      aggressive or self-abusing, that occurred more frequently in puberty and early
      adulthood.
    explanation: >-
      Documents the adolescent/adult behavioral trajectory in p.Arg961Trp-confirmed
      males.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of these male patients are doing well in their 5th and 6th decades.
    explanation: >-
      Documents long-term adult survival and function in molecularly confirmed FGS1.
pathophysiology:
- name: MED12 p.Arg961Trp Alters CDK8 Kinase Module Function
  biological_scale: MOLECULAR
  description: >-
    MED12 is a subunit of the dissociable CDK8 kinase module (MED12, MED13, cyclin C,
    CDK8) that reversibly associates with core Mediator and acts as the hub through
    which DNA-bound transcription factors communicate with RNA polymerase II. The
    recurrent germline hemizygous c.2881C>T (p.Arg961Trp) missense substitution does
    not abolish MED12 function globally; the evidence favors a pathway-selective
    altered-function defect that impairs recruitment of, or response to, particular
    regulatory complexes while sparing others. This distinguishes FGS1 from complete
    MED12 loss of function, which has broader and developmentally more severe
    consequences.
  mechanism_confidence: ESTABLISHED

- name: Anorectal Malformation
  biological_scale: TISSUE
  description: >-
    Anal fistula, stenosis, and atresia occurred in 11 of 19 evaluable molecularly
    confirmed males. Hindgut and anorectal septation is a classic
    hedgehog-patterning-dependent process, which is why the GLI3 arm is the most
    plausible upstream route; enteric neuron development is placed here rather than on
    a pan-organ node because the severe constipation of FGS1 persists even without a
    structural anorectal defect.

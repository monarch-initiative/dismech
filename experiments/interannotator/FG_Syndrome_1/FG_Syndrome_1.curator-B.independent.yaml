    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, head imaging studies may be helpful in evaluating patients suspected to have FG syndrome."
    explanation: States the imaging recommendation and its rationale.
- name: Formal ophthalmologic assessment

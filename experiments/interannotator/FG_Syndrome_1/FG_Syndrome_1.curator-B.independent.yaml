inheritance:
- name: X-linked recessive inheritance
  description: >
    Hemizygous MED12 p.Arg961Trp in affected males, transmitted by clinically
    unaffected heterozygous carrier mothers. No de novo case with a confirmed
    MED12 variant has been reported in the defining cohort, and affected males
    are not known to reproduce.
  inheritance_term:

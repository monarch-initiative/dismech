progression:
- phase: Age-dependent evolution of tone and survival beyond infancy
  notes: >
    Congenital hypotonia improves or resolves with age. Mortality is concentrated in
    infancy — one or more affected individuals died in childhood in 8 of the 10
    known families — but after the first year of life mortality does not appear
    substantially increased, and three affected males were living into their fifth
    and sixth decades.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, after the first year of life, mortality does not seem to be significantly increased. Hypotonia improves or resolves with age. Three of these male patients are doing well in their 5th and 6th decades."
    explanation: Documents the natural history of tone and survival beyond infancy.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these 10 families, early deaths and multiple miscarriages were common"
    explanation: Documents the early-life mortality and reproductive-loss burden.
diagnosis:
- name: Molecular confirmation of hemizygous MED12 p.Arg961Trp
  description: >
    The diagnosis is established in a male by identifying a hemizygous MED12
    pathogenic variant. In FGS1 specifically this is the recurrent p.Arg961Trp
    allele. Contemporary practice reaches this by exome/genome or targeted MED12
    sequencing.
  evidence:
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of an MED12-related disorder is established in a male by identification of a hemizygous MED12 pathogenic variant on molecular genetic testing."
    explanation: GeneReviews states the diagnostic standard.
- name: Clinical triage algorithm for selecting patients for MED12 testing
  description: >
    A six-criterion clinical algorithm developed to select which patients with
    suspected FG syndrome should undergo molecular testing, achieving 100%
    sensitivity and 90% specificity for the p.R961W variant and reducing the number
    of tests required by 74%. The discriminating criteria are characteristic facies,
    an affable personality, small ears, absolute or relative macrocephaly, a
    congenital anomaly (or an affected relative with one), and a family history
    consistent with X-linkage; exclusion criteria are female sex, absence of
    intellectual disability, and an autosomal inheritance pattern. This is of
    historical and triage interest — contemporary practice sequences directly rather
    than pre-filtering clinically.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The algorithm identifies the p.R961W MED12 mutation-positive group with 100% sensitivity and 90% specificity."
    explanation: Quantifies the performance of the clinical triage algorithm.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The algorithm reduces the number of tests by 74% that must be performed to identify all mutation-positive patients."
    explanation: Quantifies the testing efficiency gain.
- name: Brain imaging for callosal anomaly
  description: >
    Head imaging is recommended when FGS1 is suspected, because callosal anomalies
    are the most consistent structural finding and are more common than anomalies of
    any other organ.
  evidence:

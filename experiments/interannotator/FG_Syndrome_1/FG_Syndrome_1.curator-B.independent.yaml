phenotypes:
- name: Intellectual disability
  category: Neurologic
  description: >
    All molecularly confirmed affected males have cognitive impairment, most with
    IQ below 70. Severity ranges from borderline to severe, but no affected male
    functions at the level of his unaffected relatives.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these individuals have cognitive disability. In most patients, IQ scores were below 70 or equivalent."
    explanation: >
      Cognitive impairment in 100% of the confirmed cohort. Banded VERY_FREQUENT
      rather than OBLIGATE because the denominator is a 23-male ascertained series,
      which does not license an assertion of invariance.
- name: Congenital hypotonia
  category: Neurologic
  description: >
    Congenital hypotonia is present in all affected individuals, typically with
    poor oral motor function and feeding difficulty in infancy. It improves or
    resolves with age.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Hypotonia

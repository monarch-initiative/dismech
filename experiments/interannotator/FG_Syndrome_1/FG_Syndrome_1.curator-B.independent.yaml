    explanation: Defines the Hardikar phenotype.
  - reference: PMID:20301719
    reference_title: "MED12-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental and cognitive concerns have not been reported in females with HS."
    explanation: Records the absence of cognitive involvement, the key contrast with FGS1.
- name: MED12-negative clinically diagnosed FG syndrome
  description: >
    The largest and most important differential is the historical clinical FG
    syndrome population itself. Of 30 patients carrying a prior clinical diagnosis
    of FG syndrome who were systematically re-evaluated, 29 were MED12-negative and
    an alternative diagnosis was reached in 10. Any entity assembled on the
    pre-molecular clinical criteria is a differential for, not an instance of, FGS1.
  evidence:
  - reference: PMID:18805826
    reference_title: "Clinical experience in the evaluation of 30 patients with a prior diagnosis of FG syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining 29 patients displayed a wide variety of features and were shown to be negative for mutations in the entire MED12 gene. A definite or possible alternative diagnosis was identified in 10 of these patients."
    explanation: >
      29 of 30 clinically diagnosed FG syndrome patients were MED12-negative, with an
      alternative diagnosis found in 10 — establishing the clinically diagnosed
      population as a differential rather than a source of FGS1 phenotype data.

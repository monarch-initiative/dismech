- name: Lujan syndrome
  description: >
    Allelic MED12 disorder caused by p.Asn1007Ser. Shares cognitive impairment,
    hypotonia and corpus callosum abnormalities with FGS1, but is further
    characterized by a tall thin body habitus, long thin face, prominent nasal
    bridge, high narrow palate and short philtrum. Gene-level testing does not
    discriminate; the specific variant does.

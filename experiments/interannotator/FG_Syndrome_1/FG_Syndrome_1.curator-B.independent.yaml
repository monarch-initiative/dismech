    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mothers in our series are intellectually normal and all are heterozygous for the p.R961W mutation in MED12."
    explanation: Obligate carrier females are unaffected, establishing the recessive X-linked pattern.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT

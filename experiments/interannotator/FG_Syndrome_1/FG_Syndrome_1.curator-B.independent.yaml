discussions:
- discussion_id: fgs1_lymphoblastoid_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >
    Do the REST-corepressor, GLI3-SHH and immediate-early-gene mechanisms
    established in EBV-immortalized patient lymphoblastoid lines actually operate in
    the human tissues that are malformed in FGS1 — developing forebrain, hindgut,
    and heart?
  rationale: >
    Every mechanistic arm in this entry rests on lymphoblastoid or engineered
    cell-line evidence. That is a serious translational gap for three converging
    reasons. First, lymphoblastoid cells are not the affected tissue: the FGS1
    malformations are of forebrain commissure, hindgut and heart, none of which is
    modeled by a B-lymphoblastoid line. Second, the immediate-early-gene effect is
    explicitly reported to be cell-type dependent, so the direction and magnitude of
    the transcriptional consequence cannot be assumed to transfer. Third, the
    available animal evidence models near-null Med12 deficiency, which is
    embryonic-lethal by E10 in mouse and therefore cannot reproduce the viable
    human p.Arg961Trp phenotype; no knock-in model of the human allele reproducing
    the human phenotype has been reported. Evidence exists in a model system; its
    fidelity to human disease is the open question.
  attaches_to:
  - pathophysiology#REST Corepressor Failure and Ectopic Neuronal Gene Expression
  - pathophysiology#Loss of Mediator Restraint on GLI3-Dependent Sonic Hedgehog Signaling
  - pathophysiology#Variant-Specific Immediate Early Gene Dysregulation
  proposed_experiments:
  - experiment_id: fgs1_isogenic_ipsc_knockin
    name: Isogenic MED12 p.Arg961Trp iPSC knock-in in disease-relevant lineages
    description: >
      Generate an isogenic MED12 p.Arg961Trp knock-in in human iPSCs and differentiate
      to cortical neurons and enteric neural crest derivatives, then test whether
      GLI3-target derepression and the JUN/FOS/EGR1 signature reproduce in the
      disease-relevant lineages rather than only in lymphoblastoid cells.
  - experiment_id: fgs1_mouse_r961w_knockin
    name: Mouse knock-in of the orthologous Med12 R961W allele
    description: >
      Construct a mouse knock-in of the orthologous Med12 R961W allele and determine
      whether it is viable and whether it reproduces callosal, anorectal and cardiac
      malformation, distinguishing the altered-function allele from the
      embryonic-lethal near-null hypomorph.
notes: >
  Scope boundary. This entry covers only the molecularly defined MED12 entity
  MONDO:0010590 (FG syndrome 1, OMIM 305450, p.Arg961Trp). It deliberately does not
  curate the historical clinical umbrella MONDO:0002010 "FG syndrome", under which
  large numbers of patients were assembled on clinical grounds between 1974 and
  2007. That distinction is not pedantic: fewer than 3% of clinically diagnosed FG
  syndrome patients carry the MED12 variant, and the other numbered FGS loci lie in
  different genes entirely (FLNA, CASK, UPF3B, BRWD3). Two consequences for
  curation are enforced throughout this entry. First, frequency bands are taken
  only from the molecularly confirmed cohort wherever possible. Second, where the
  only available quantitative data come from a clinically defined series — the
  genitourinary frequencies from a 228-patient series predating routine MED12
  testing — the evidence items are marked supports: PARTIAL and the limitation is
  stated in the explanation rather than silently absorbed into a band.

  Denominators. The defining cohort comprises 23 molecularly confirmed males from
  10 families, but the effective denominator differs by feature because different
  subsets were examined, imaged or evaluated: 13 were personally examined under a
  standardized protocol, 13 had brain imaging, 19 were evaluable for anorectal
  anomalies, 18 for cardiac anomalies, and 18 for head circumference. Bands in this
  entry are computed against the denominator the source states for that specific
  feature, not against 23 uniformly.

  Macrocephaly caution. This paper reports "15 of 18 had macrocephaly" for the
  Italian MED12 mutation-NEGATIVE comparison group. That figure must not be applied
  to FGS1. The mutation-positive figures are 7 of 18 for absolute macrocephaly and,
  per the same sentence, likewise fewer than half for relative macrocephaly.

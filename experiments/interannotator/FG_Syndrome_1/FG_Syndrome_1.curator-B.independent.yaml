name: FG Syndrome 1
creation_date: '2026-08-01T20:20:00Z'
category: Mendelian
synonyms:
- Opitz-Kaveggia syndrome
- FGS1
- MED12 FG syndrome
- FG syndrome caused by mutation in MED12
description: >
  FG syndrome 1 (FGS1, Opitz-Kaveggia syndrome) is an X-linked multiple congenital
  anomaly / cognitive impairment syndrome caused by the recurrent hemizygous MED12
  missense variant c.2881C>T (p.Arg961Trp) at Xq13. Affected males show cognitive
  impairment, congenital hypotonia with feeding difficulty and chronic constipation,
  a distinctive facial gestalt (long narrow face, tall forehead, small simple ears,
  open mouth, puffy eyelids), a characteristic friendly and loquacious personality,
  and a high burden of congenital anomalies — most consistently agenesis or
  hypoplasia of the corpus callosum, and frequently anorectal and cardiac
  malformations. This entry is scoped to the molecularly defined MED12 entity
  (MONDO:0010590). It deliberately does not cover the historical clinical umbrella
  "FG syndrome" (MONDO:0002010), under which decades of clinically diagnosed
  patients were assembled; when that population was finally tested, fewer than 3%
  carried the MED12 variant, and the other FGS loci map to different genes.

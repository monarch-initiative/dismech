    explanation: All confirmed cases were inherited, not de novo.
genetic:
- name: MED12
  notes: >
    MED12 (mediator complex subunit 12) at Xq13.1 encodes a subunit of the
    dissociable CDK8 kinase module of the Mediator complex. FGS1 is caused by the
    single recurrent missense variant p.Arg961Trp in the LS domain. The mechanism
    is pathway-selective altered function rather than null loss of function:
    complete Med12 deficiency is embryonic-lethal in mouse, whereas p.Arg961Trp
    produces a viable, recognizable syndrome.
  gene_term:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:17334363
    reference_title: "A recurrent mutation in MED12 leading to R961W causes Opitz-Kaveggia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a recurrent mutation (2881C>T, leading to R961W) in MED12 (also called TRAP230 or HOPA), a gene located at Xq13"
    explanation: Identifies the causal gene, locus, and the recurrent variant.
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same mutation, p.R961W was identified in 13 affected male patients from these 10 families. No other mutations were identified in the MED12 gene in these samples."
    explanation: Confirms allelic homogeneity of FGS1 across all known families.
variants:
- name: MED12 c.2881C>T (p.Arg961Trp)
  description: >
    The defining recurrent FGS1 allele, in the LS domain of MED12. Present in every
    molecularly confirmed FGS1 family reported to date, including the original
    Opitz-Kaveggia kindred.
  gene:
    preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:17334363
    reference_title: "A recurrent mutation in MED12 leading to R961W causes Opitz-Kaveggia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here that the original family for whom the condition is named and five other families have a recurrent mutation (2881C>T, leading to R961W) in MED12"
    explanation: Establishes the variant in the eponymous family and five others.
pathophysiology:
- name: MED12 p.Arg961Trp Altered Function in the CDK8 Kinase Module
  biological_scale: MOLECULAR
  description: >
    The p.Arg961Trp substitution lies in the LS domain of MED12, a subunit of the
    dissociable CDK8 kinase module of Mediator. It does not abolish the protein or
    disassemble the module; instead it selectively impairs particular
    transcription-factor-specific regulatory interfaces while sparing others. This
    pathway selectivity is what allows a missense change in a ubiquitously required
    transcriptional coregulator to produce a viable, recognizable syndrome rather
    than lethality.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: mediator complex
    term:
      id: GO:0016592
      label: mediator complex
  evidence:
  - reference: PMID:33925166
    reference_title: "MED12-Related (Neuro)Developmental Disorders: A Question of Causality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "kinase module consists of MED12, MED13, Cyclin C (CCNC), and cyclin-dependent kinase 8 (CDK8), and the paralogs MED12L, MED13L, and CDK19."
    explanation: Defines the CDK8 kinase module in which the variant acts.
  - reference: PMID:20630950
    reference_title: "Med12 is essential for early mouse development and for canonical Wnt and Wnt/PCP signaling."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "These mutants fail to develop beyond embryonic day 10 and have severe defects in neural tube closure, axis elongation, somitogenesis and heart formation."
    explanation: >
      Mouse Med12 hypomorphs are embryonic-lethal by E10, establishing that severe
      MED12 deficiency is developmentally catastrophic. PARTIAL because this models
      near-null deficiency, not the human p.Arg961Trp allele; it supports the
      inference that FGS1 is altered rather than absent function by contrast.
  downstream:
  - target: REST Corepressor Failure and Ectopic Neuronal Gene Expression
    description: >-
      The variant disrupts the MED12 interface that links the REST/NRSF silencer to
      G9a-dependent H3K9 dimethylation, releasing neuronal genes from repression in
      cells where they should be silent.
    evidence:
    - reference: PMID:18691967
      reference_title: "Mediator links epigenetic silencing of neuronal gene expression with x-linked mental retardation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "missense mutations in MED12 causing the X-linked mental retardation (XLMR) disorders FG syndrome and Lujan syndrome disrupt its REST corepressor function"
      explanation: Directly attributes REST corepressor failure to the FG syndrome MED12 variant.
  - target: Loss of Mediator Restraint on GLI3-Dependent Sonic Hedgehog Signaling
    description: >-
      The variant disrupts the gene-specific association of MED12 with CDK8, which
      normally suppresses GLI3 transactivation. Patient-derived cells show enhanced
      SHH pathway activation with impaired CDK8 recruitment specifically at
      GLI3-target promoters.
    evidence:
    - reference: PMID:23091001
      reference_title: "MED12 mutations link intellectual disability syndromes with dysregulated GLI3-dependent Sonic Hedgehog signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "MED12 mutations R961W and N1007S causing FG and Lujan syndromes, respectively, disrupt a Mediator-imposed constraint on GLI3-dependent Sonic Hedgehog (SHH) signaling."
      explanation: >
        Names the FGS1 variant explicitly and identifies the disrupted constraint,
        making this the variant-specific citation for this arm.
  - target: Variant-Specific Immediate Early Gene Dysregulation
    description: >-
      Each MED12 variant produces its own JUN/FOS/EGR1 expression signature that
      tracks the presence or absence of the MED12-containing complex at those
      promoters, proposed as the basis for why the MED12 allelic series splits
      into clinically distinct syndromes.
    evidence:
    - reference: PMID:28369444
      reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "each MED12 mutations cause specific expression patterns of JUN, FOS and EGR1 immediate early genes (IEGs), reflected by the presence or absence of MED12 containing complex at their respective promoters."
      explanation: Links variant identity to a distinct immediate-early-gene signature.
- name: REST Corepressor Failure and Ectopic Neuronal Gene Expression
  biological_scale: MOLECULAR
  description: >
    MED12 provides the interface through which the RE1-silencing transcription
    factor REST/NRSF recruits G9a histone methyltransferase to deposit repressive
    H3K9 dimethylation at neuronal gene promoters in non-neuronal cells. The FGS1
    variant disrupts this corepressor function, impairing epigenetic restriction of
    the neuronal gene program to the nervous system.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:18691967
    reference_title: "Mediator links epigenetic silencing of neuronal gene expression with x-linked mental retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the MED12 interface in Mediator links REST with G9a-dependent histone H3K9 dimethylation to suppress neuronal genes in nonneuronal cells"
    explanation: Defines the corepressor network that the FGS1 variant disrupts.
  downstream:
  - target: Disturbed Neurodevelopmental Transcriptional Program
    description: >-
      Failure of REST-dependent silencing contributes to a disordered neuronal
      differentiation program.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18691967
      reference_title: "Mediator links epigenetic silencing of neuronal gene expression with x-linked mental retardation."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "suggest a pathologic basis for MED12-associated XLMR involving impaired REST-dependent neuronal gene regulation"
      explanation: >
        The authors propose, but do not demonstrate in human brain, that impaired
        REST regulation underlies the cognitive phenotype. PARTIAL accordingly.
- name: Loss of Mediator Restraint on GLI3-Dependent Sonic Hedgehog Signaling
  biological_scale: MOLECULAR
  description: >
    MED12 normally constrains GLI3-dependent SHH target transcription by recruiting
    CDK8, a suppressor of GLI3 transactivation, to GLI3-target promoters. The
    p.Arg961Trp variant disrupts this gene-specific MED12-CDK8 association,
    derepressing SHH target genes. Because SHH-GLI3 patterning acts across
    forebrain, craniofacial, limb, gut and heart development, this arm is the most
    parsimonious single explanation for the breadth of the FGS1 malformation set.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:23091001
    reference_title: "MED12 mutations link intellectual disability syndromes with dysregulated GLI3-dependent Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In FG/R961W and Lujan/N1007S patient-derived cells, we document enhanced SHH pathway activation and GLI3-target gene induction coincident with impaired recruitment of CDK8 onto promoters of GLI3-target genes, but not non-GLI3-target genes."
    explanation: >
      Demonstrates the derepression in cells carrying the FGS1 variant itself, and
      shows the effect is promoter-selective rather than a global transcriptional
      collapse.
  - reference: PMID:30729724
    reference_title: "Dysregulations of sonic hedgehog signaling in MED12-related X-linked intellectual disability disorders."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Transcript levels of three Gli3-dependent SHH-signaling genes, CREB5, BMP4, and NEUROG2, were determined by quantitative RT-PCR and found to be significantly elevated in lymphoblasts from patients with three mutations in the MED12-LS domain."
    explanation: >
      Independently replicates GLI3-target derepression in patient lymphoblasts, but
      in patients carrying other LS-domain variants (N898D, R1214C, R1295H) rather
      than p.Arg961Trp — hence PARTIAL for the FGS1-specific claim.
  downstream:
  - target: Disturbed Embryonic Patterning of Multiple Organ Systems
    description: >-
      Derepressed SHH-GLI3 signaling during embryogenesis perturbs patterning across
      the organ systems that are malformed in FGS1.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30729724
      reference_title: "Dysregulations of sonic hedgehog signaling in MED12-related X-linked intellectual disability disorders."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "These results support a critical role of MED12 in regulating Gli3-dependent SHH signaling and in developing ID and related congenital malformations in XLID syndromes."
      explanation: >
        The authors link the SHH dysregulation to congenital malformations, but the
        inference from lymphoblast transcript levels to embryonic patterning is not
        directly demonstrated.
- name: Variant-Specific Immediate Early Gene Dysregulation
  biological_scale: MOLECULAR
  description: >
    MED12 variants produce distinct, variant-specific expression signatures of the
    immediate early genes JUN, FOS and EGR1, tracking MED12-complex occupancy at
    those promoters. This is the proposed molecular basis for the clinical
    divergence of the MED12 allelic series into FGS1, Lujan, X-linked Ohdo and
    nonspecific intellectual disability despite a shared gene.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28369444
    reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "each MED12 mutations cause specific expression patterns of JUN, FOS and EGR1 immediate early genes (IEGs), reflected by the presence or absence of MED12 containing complex at their respective promoters."
    explanation: Establishes the variant-specific IEG signature.
  downstream:
  - target: Disturbed Neurodevelopmental Transcriptional Program
    description: >-
      Altered immediate-early-gene responsiveness perturbs activity-dependent
      neuronal transcription.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28369444
      reference_title: "MED12-related XLID disorders are dose-dependent of immediate early genes (IEGs) expression."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "the effect of MED12 mutations has cell-type specificity on IEG expression"
      explanation: >
        The cell-type dependence explicitly limits extrapolation from the
        lymphoblastoid system to neurons.
- name: Disturbed Neurodevelopmental Transcriptional Program
  biological_scale: CELLULAR
  description: >
    Convergent output of the REST and immediate-early-gene arms: neuronal
    differentiation and activity-dependent transcription proceed abnormally,
    producing the cognitive impairment, congenital hypotonia and characteristic
    behavioral profile of FGS1.
  mechanism_confidence: PROVISIONAL

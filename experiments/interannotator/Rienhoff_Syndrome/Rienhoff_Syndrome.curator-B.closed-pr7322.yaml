name: Rienhoff Syndrome
creation_date: "2026-07-31T03:26:00Z"
category: Mendelian
description: >
  Rienhoff syndrome, also known as Loeys-Dietz syndrome type 5 (LDS5) or
  TGFB3-related heritable thoracic aortic disease, is an autosomal dominant
  connective tissue disorder caused by heterozygous pathogenic variants in
  TGFB3, encoding the transforming growth factor beta 3 ligand. It presents as
  a syndromic aortopathy with thoracic and/or abdominal aortic aneurysm and a
  risk of dissection and rupture, together with systemic features overlapping
  Loeys-Dietz, Shprintzen-Goldberg, and Marfan syndromes: cleft palate, bifid
  uvula, mitral valve disease, skeletal overgrowth, cervical spine instability,
  and clubfoot deformity. The original index patient additionally showed distal
  arthrogryposis, hypotonia, and failure of normal post-natal muscle
  development without vascular disease, reflecting the role of TGFB3 in
  palatogenesis and myogenesis. Compared with other transforming growth factor
  beta heritable thoracic aortic disease, the vascular disease is late-onset
  and less penetrant, and a larger aortic size threshold for prophylactic
  surgery is considered appropriate.

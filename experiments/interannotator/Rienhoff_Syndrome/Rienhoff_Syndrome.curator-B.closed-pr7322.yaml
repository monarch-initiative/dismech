genetic:
- name: TGFB3
  gene_term:
    preferred_term: TGFB3
    term:
      id: hgnc:11769
      label: TGFB3
  notes: >
    Heterozygous pathogenic TGFB3 variants cause Rienhoff syndrome
    (Loeys-Dietz syndrome type 5). The reported alleles are predominantly
    loss-of-function or hypomorphic: the index de novo missense variant
    p.Cys409Tyr abolishes the conserved cysteine-knot structure of the ligand
    and acts as a dominant-negative in signaling assays; nonsense (p.Cys384*)
    and further missense variants are reported. Variants cluster at
    functionally critical sites: the RGD integrin-binding motif
    (p.Asp263His, a Belgian founder allele shared by five Campine-region
    families with a common ancestor >400 years ago), the RKKR furin
    cleavage motif (codon Arg300; p.Arg300Gly/Gln/Trp), and the cystine knot
    of the mature cytokine.     Whether codon Arg300 variants act by loss or by
    increased signaling is debated (see discussions). Two homozygous
    patients have been reported, both with a more severe, earlier-onset
    phenotype than heterozygous carriers: the first-described homozygous
    patient in the Dutch-French cohort (Marsili 2020) and a child with a
    homozygous exon 2-7 deletion presenting with severe LDS5 and
    Marfan-like features (Megarbane 2020), supporting a dosage
    (haploinsufficiency) mechanism for heterozygous disease. Both de novo
    and familial transmission occur.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo mutation in TGFB3 was identified by exome sequencing."
    explanation: >-
      First identification of a coding TGFB3 mutation (c.1226G>A, p.Cys409Tyr)
      as the cause of the index case.
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on 43 patients from 11 families with syndromic presentations of aortic aneurysms caused by TGFB3 mutations."
    explanation: >-
      Confirms TGFB3 as the causal gene across 11 families ascertained
      through thoracic aortic aneurysm cohorts.
  - reference: PMID:39653386
    reference_title: "Aortic and arterial manifestations and clinical features in TGFB3-related heritable thoracic aortic disease: results from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "34 individuals (56% male, median age 42 years, IQR 17-49, range 3-74 years) with P/LP TGFB3 variants were studied."
    explanation: >-
      The international Montalcino registry independently ascertained 34
      carriers of pathogenic or likely pathogenic TGFB3 variants.
  - reference: PMID:37719708
    reference_title: "Variable clinical expression of a Belgian TGFB3 founder variant suggests the presence of a genetic modifier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The haplotype analysis revealed a shared haplotype of minimum 1.92 Mb and maximum 4.14 Mb, suggesting a common founder originating >400 years ago."
    explanation: >-
      The TGFB3 c.787G>C p.(Asp263His) variant is a Belgian founder allele
      shared by five Campine-region families, disrupting the RGD
      integrin-binding motif of the latency-associated peptide.
  - reference: PMID:32022420
    reference_title: "Homozygous deletion of exons 2-7 within TGFB3 gene in a child with severe Loeys-Dietz syndrome and Marfan-like features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the first case of a homozygous TGFB3 variant associated with a severe LDS5 and Marfan-like presentation."
    explanation: >-
      A homozygous deletion of TGFB3 exons 2-7 produced severe LDS5 with
      Marfan-like features, an in-human allelic series demonstrating that
      complete loss of TGFB3 is more severe than the heterozygous state and
      supporting a dosage mechanism.
  - reference: PMID:31898322
    reference_title: "Phenotypic spectrum of TGFB3 disease-causing variants in a Dutch-French cohort and first report of a homozygous patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cohort included the first described homozygous patient, who presented with a more severe phenotype compared to her heterozygous relatives."
    explanation: >-
      The Dutch-French cohort included a homozygous TGFB3 patient more
      severely affected than her heterozygous relatives, a second reported
      biallelic case corroborating the dosage mechanism.
inheritance:
- name: Autosomal Dominant
  description: >
    Autosomal dominant inheritance with markedly variable expressivity and
    incomplete, age-dependent penetrance. Both de novo variants (including
    the index patient) and multigenerational familial transmission are
    reported. TGFB3 has the lowest penetrance of the Loeys-Dietz syndrome
    genes: only 15% of Belgian founder-variant carriers had significant
    aortic involvement and 41% of carriers were phenotypically normal, and
    68% of the Montalcino registry cohort remains free of aortic disease.
    Two homozygous patients with a more severe, earlier-onset phenotype
    than heterozygous carriers have been reported.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2 is inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews confirms autosomal dominant inheritance for TGFB3-related
      Loeys-Dietz syndrome.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo mutation in TGFB3 was identified by exome sequencing."
    explanation: >-
      The index patient carried a de novo variant, consistent with dominant
      inheritance arising sporadically.
  - reference: PMID:37719708
    reference_title: "Variable clinical expression of a Belgian TGFB3 founder variant suggests the presence of a genetic modifier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The low penetrance (15%) of aortic aneurysm/dissection suggests that haploinsufficiency alone by the TGFB3 variant may not result in aneurysm development but that additional factors are required to provoke the aneurysm phenotype."
    explanation: >-
      The Belgian founder cohort demonstrates low (15%), age-dependent
      penetrance of aortic disease, with the authors proposing that
      additional genetic or environmental factors beyond TGFB3
      haploinsufficiency are required.
  - reference: PMID:39653386
    reference_title: "Aortic and arterial manifestations and clinical features in TGFB3-related heritable thoracic aortic disease: results from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-eight per cent of the entire cohort remains free of aortic disease."
    explanation: >-
      The Montalcino registry independently confirms incomplete penetrance,
      with two thirds of TGFB3 variant carriers free of aortic disease.
diagnosis:
- name: Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >
    The diagnosis is established in a proband with characteristic clinical
    findings or by identification of a heterozygous pathogenic variant in
    TGFB3 (one of the Loeys-Dietz syndrome genes) together with aortic
    root enlargement, type A dissection, other characteristic clinical
    features, or a family history of established Loeys-Dietz syndrome.
    Testing should include exon-level deletion/duplication (CNV) analysis
    in addition to sequencing, because a homozygous TGFB3 exon 2-7
    deletion has been reported.
  results: >
    A heterozygous (rarely biallelic) pathogenic TGFB3 variant confirms
    the diagnosis in a proband with compatible clinical findings.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of LDS is established in (1) a proband with characteristic clinical findings or (2) by the identification of a heterozygous pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2 or biallelic pathogenic variants in IPO8 in a proband with aortic root enlargement, type A dissection, other characteristic clinical features of LDS, or a family history of an established diagnosis of LDS."
    explanation: >-
      GeneReviews diagnostic criteria for Loeys-Dietz syndrome, which
      include TGFB3 among the causal genes; applicable to the TGFB3
      subtype.
  - reference: PMID:32022420
    reference_title: "Homozygous deletion of exons 2-7 within TGFB3 gene in a child with severe Loeys-Dietz syndrome and Marfan-like features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deletion/duplication testing for a panel of genes involved in connective tissue disorders revealed the presence of a novel homozygous deletion of exons 2-7 in"

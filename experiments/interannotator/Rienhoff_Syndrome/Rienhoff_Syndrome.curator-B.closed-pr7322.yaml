animal_models:
- species: Mouse (Mus musculus)
  genotype: Tgfb3 knockout (Tgfb3-/-), gene-targeted null
  description: >
    Homozygous Tgfb3-null mice die within 20 hours of birth with delayed
    pulmonary development and defective palatogenesis, without other
    craniofacial abnormalities, implicating TGF-beta 3 in
    epithelial-mesenchymal interaction. The model recapitulates the human
    cleft palate phenotype but does not model the adult-onset aortopathy.
  associated_phenotypes:
  - Cleft palate (defective palatogenesis)
  - Delayed pulmonary development
  - Neonatal lethality
  evidence:
  - reference: PMID:7493022
    reference_title: "Abnormal lung development and cleft palate in mice lacking TGF-beta 3 indicates defects of epithelial-mesenchymal interaction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Within 20 hours of birth, homozygous TGF-beta 3-/- mice die with unique and consistent phenotypic features including delayed pulmonary development and defective palatogenesis."
    explanation: >-
      The Tgfb3-null mouse establishes the essential role of TGF-beta 3 in
      palatogenesis that underlies the human cleft palate and bifid uvula
      phenotypes.
- species: Mouse (Mus musculus)
  genotype: Tgfb3 knockout (exon 6 replaced by neo cassette)
  description: >
    An independent Tgfb3-null line showing incompletely penetrant failure of

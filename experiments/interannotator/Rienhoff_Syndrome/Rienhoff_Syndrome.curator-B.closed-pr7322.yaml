    Aneurysmal dilation of the thoracic and/or abdominal aorta. Vascular
    disease is late-onset and less penetrant than in other TGF-beta pathway
    aortopathies; 29% of registry carriers show aortic dilation (Z>2) and
    68% of the cohort remains free of aortic disease.
  frequency: OCCASIONAL
  notes: >
    Frequency derived from the Montalcino registry cohort (10 of 34
    individuals with aortic dilation, 29%); 25% of children in the cohort
    had aortic dilation, indicating age-dependent penetrance.
  phenotype_term:
    preferred_term: Aortic aneurysm
    term:
      id: HP:0004942
      label: Aortic aneurysm
  evidence:
  - reference: PMID:39653386
    reference_title: "Aortic and arterial manifestations and clinical features in TGFB3-related heritable thoracic aortic disease: results from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aortic dilation (Z-Score>2) was present in 10 individuals (29%) and aortic dissection occurred in 2 (6%)."
    explanation: >-
      Provides the quantitative 29% frequency of aortic dilation in TGFB3
      variant carriers, supporting both the association and the OCCASIONAL
      frequency band.
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that TGFB3 mutations are associated with significant cardiovascular involvement, including thoracic/abdominal aortic aneurysm and dissection, and mitral valve disease."
    explanation: >-
      Establishes thoracic and abdominal aortic aneurysm as a core
      manifestation across 43 patients from 11 families.
  - reference: PMID:37719708
    reference_title: "Variable clinical expression of a Belgian TGFB3 founder variant suggests the presence of a genetic modifier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, only in 4 out of the 27 variant-harboring individuals, significant aortic involvement was observed."
    explanation: >-
      In the Belgian p.Asp263His founder cohort only 15% (4/27) of carriers
      had significant aortic involvement, reinforcing the low, age-dependent
      penetrance of the aortopathy.

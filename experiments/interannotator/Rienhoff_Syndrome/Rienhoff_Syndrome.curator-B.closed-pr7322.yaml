  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presenting at birth with distal arthrogryposis, hypotonia, bifid uvula, a failure of normal post-natal muscle development but no evidence of vascular disease"
    explanation: >-
      The index patient presented at birth with failure of normal post-natal
      muscle development (hypomyoplasia) as a core feature.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "TGFB3 is the most abundant TGFB isoform in developing skeletal muscle"
    explanation: >-
      The authors propose, from the known biology of TGFB3 in myogenesis,
      that ligand deficiency during early muscle development explains the
      hypomyoplasia; the mechanistic chain itself is a reasoned hypothesis
      rather than a demonstrated result in this paper.
phenotypes:
- category: Cardiovascular
  name: Aortic Aneurysm

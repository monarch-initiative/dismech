- name: Aortic Medial Degeneration and Wall Weakening
  description: >
    Dysregulated TGF-beta signaling in vascular smooth muscle cells drives
    degenerative change of the aortic media, weakening the wall; this
    conserved effector is shared across the heritable aortopathies and is
    inferred here from the documented aortic-wall signaling dysregulation in
    TGFB3 carriers and the identical downstream aneurysm/dissection course.
  role: effector
  biological_scale: TISSUE

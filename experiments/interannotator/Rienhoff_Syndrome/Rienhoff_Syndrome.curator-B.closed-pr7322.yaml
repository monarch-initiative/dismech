      to other TGF-beta pathway aortopathies.
  downstream:
  - target: Aortic Dissection and Rupture
    description: >-
      Progressive dilation and wall weakening culminate in dissection or
      rupture, typically in late adulthood in this condition.
- name: Aortic Dissection and Rupture
  description: >
    The life-threatening terminal consequence. Type A aortic dissection in
    the registry cohort occurred between ages 55 and 60 years, later than in
    other Loeys-Dietz types, with no deaths recorded during follow-up;
    cervical artery (carotid) dissections with cerebrovascular complications
    are also reported.
  role: consequence
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture"
  evidence:

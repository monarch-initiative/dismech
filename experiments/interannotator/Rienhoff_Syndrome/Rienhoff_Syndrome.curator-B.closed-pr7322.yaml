      cervical (carotid) artery dissections, extending the dissection
      phenotype beyond the aorta.
- name: Impaired Palatogenesis
  description: >
    TGFB3 is essential for palatal confluence during development. Ligand
    deficiency impairs fusion of the palatal shelves, producing cleft palate
    or bifid uvula, features shared with other Loeys-Dietz syndrome types.

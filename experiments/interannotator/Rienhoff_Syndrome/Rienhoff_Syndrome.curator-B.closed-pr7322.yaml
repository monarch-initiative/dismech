      carriers demonstrates the paradoxical up-regulation of canonical and
      non-canonical TGF-beta signaling, placing TGFB3-related disease in the
      shared aortopathy signaling hub.
  downstream:
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Sustained dysregulated TGF-beta signaling drives degenerative breakdown

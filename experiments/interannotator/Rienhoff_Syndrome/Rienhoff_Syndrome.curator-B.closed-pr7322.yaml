prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    On the order of one hundred molecularly confirmed cases have been
    published (94 probands and relatives in a 2023 literature review, with
    smaller subsequent additions); the two largest series comprise 43
    patients from 11 families (Bertoli-Avella 2015) and 34 registry
    individuals (Montalcino Aortic Consortium 2025).
  evidence:
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on 43 patients from 11 families with syndromic presentations of aortic aneurysms caused by TGFB3 mutations."
    explanation: >-
      The largest family series of TGFB3-related disease reported to date,
      indicating that the disorder is documented only in small case series.
  - reference: PMID:39653386
    reference_title: "Aortic and arterial manifestations and clinical features in TGFB3-related heritable thoracic aortic disease: results from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "34 individuals (56% male, median age 42 years, IQR 17-49, range 3-74 years) with P/LP TGFB3 variants were studied."
    explanation: >-
      The Montalcino Aortic Consortium registry, the largest international
      effort, ascertained only 34 individuals with pathogenic or likely
      pathogenic TGFB3 variants, consistent with ultra-rare occurrence.
  - reference: PMID:37719708
    reference_title: "Variable clinical expression of a Belgian TGFB3 founder variant suggests the presence of a genetic modifier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide the results of a haplotype analysis and a medical record review of clinical features of 27 individuals from 5 different families, originating from the Campine region in Flanders"
    explanation: >-
      The Belgian founder-variant cohort ascertained 27 carriers from five
      families; the same paper's literature review retained 94 published
      TGFB3 probands and relatives, placing occurrence at the scale of
      roughly one hundred published cases.
pathophysiology:
- name: TGFB3 Ligand Deficiency
  description: >
    Heterozygous loss-of-function mutations in TGFB3, encoding the TGF-beta 3
    ligand, reduce functional ligand availability. The index de novo missense
    variant (c.1226G>A, p.Cys409Tyr) substitutes the penultimate cysteine of
    the conserved cysteine-knot structure essential for ligand activity; the
    mutant ligand is non-functional in reporter assays and acts as a dominant
    inhibitor of wild-type TGFB3 signaling when co-expressed in Xenopus
    embryos. Nonsense (e.g., p.Cys384*) and additional missense variants have
    subsequently been reported.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo mutation in TGFB3 was identified by exome sequencing. Several lines of evidence indicate the mutation is hypomorphic suggesting that decreased TGF-β signaling from a loss of TGFB3 activity is likely responsible for the clinical phenotype."
    explanation: >-
      Identification of the causal de novo TGFB3 variant in the index patient
      by exome sequencing, with the hypomorphic (loss-of-function)
      interpretation.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We conclude that the mutant allele encodes a TGFB3 ligand that is not functional."
    explanation: >-
      A Smad2-responsive luciferase reporter assay in transfected HeLa/293T
      cells showed the C409Y mutant ligand generates no TGF-beta
      transcriptional signal, demonstrating loss of ligand function in a cell
      system.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A 1:1 ratio of mutant-to-wild-type TGFB3 RNA diminished the pSMAD2 and pERK1/2 signals to approximately 40% and 60%, respectively, of that generated by the w-t TGFB3 RNA alone."
    explanation: >-
      In Xenopus embryos, co-expression of mutant with wild-type TGFB3 RNA
      dominantly diminished canonical (pSMAD2) and non-canonical (pERK1/2)
      signaling while BMP/SMAD1 signaling was unaffected, supporting a
      dominant-negative loss-of-function mechanism.
  - reference: PMID:34549088
    reference_title: "Novel Mutation of the TGF-β 3 Protein (Loeys-Dietz Type 5) Associated With Aortic and Carotid Dissections: Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel pathogenic variant of LDS type 5 consisting of a heterogeneous nonsense variant c.1044C>A, p.(Cys384*) was found in the TGF-β 3 (TGFB3) gene."
    explanation: >-
      A nonsense TGFB3 variant causing premature termination in a patient
      with aortic and carotid dissections confirms loss-of-function alleles
      as causal. The case report's c.1044C>A cDNA designation would encode
      codon 348, inconsistent with its own p.Cys384* protein notation; the
      variant is quoted verbatim as published.
  downstream:
  - target: TGF-beta Signaling Dysregulation
    description: >-
      Loss of TGFB3 ligand activity converges on dysregulated TGF-beta
      signaling in the aortic wall, the shared hub of the heritable
      aortopathies.
  - target: Impaired Palatogenesis
    description: >-
      TGFB3 is essential for palatal confluence, so ligand deficiency during
      development produces cleft palate or bifid uvula.
  - target: Impaired Myogenesis and Hypomyoplasia
    description: >-
      TGFB3 is the most abundant TGF-beta isoform in developing skeletal
      muscle; deficient signaling during early myogenesis reduces the muscle
      precursor pool.
- name: TGF-beta Signaling Dysregulation
  description: >
    In the aortic wall of TGFB3 mutation carriers, both canonical
    (Smad-dependent) and non-canonical TGF-beta signaling are paradoxically
    up-regulated together with increased expression of TGF-beta ligands,
    mirroring the signaling hub shared across the heritable aortopathies
    (Marfan, other Loeys-Dietz types, Shprintzen-Goldberg) despite
    loss-of-function primary lesions.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"

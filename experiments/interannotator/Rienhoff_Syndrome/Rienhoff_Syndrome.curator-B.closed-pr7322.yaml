discussions:
- discussion_id: tgfb3_direction_of_effect_controversy
  prompt: >-
    Do Rienhoff-syndrome TGFB3 variants act purely by loss of function
    (hypomorphic or haploinsufficient ligand with secondary paradoxical
    pathway up-regulation in the aortic wall), or do variants at the RKKR
    furin-cleavage motif (codon Arg300) act by directly increasing TGF-beta
    signalling, and can both directions produce the same disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TGFB3 Ligand Deficiency
  - pathophysiology#TGF-beta Signaling Dysregulation
  rationale: >-
    The index allele (p.Cys409Tyr) is a non-functional ligand with
    dominant-negative interference in Xenopus assays, the Belgian founder
    cohort interprets aortic disease through haploinsufficiency requiring
    additional hits, and aortic wall tissue shows paradoxical up-regulation
    of canonical and non-canonical TGF-beta signaling; in contrast,
    Kuechler et al. proposed that codon Arg300 substitutions, which block
    furin cleavage of the latency-associated peptide, presumably increase
    TGF-beta signalling and that short versus tall stature may reflect
    opposing effects on the pathway. Resolving the direction of effect, and
    whether it is variant-position-dependent, matters for any future
    pathway-directed therapy, since potentiating versus inhibiting TGF-beta
    signalling are opposite interventions.
  evidence:
  - reference: PMID:26184463
    reference_title: "Exome sequencing identifies a novel heterozygous TGFB3 mutation in a disorder overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations at codon Arg300 presumably lead to increased TGF-beta signalling, suggesting that the short or tall stature seen in patients with TGFB3 mutations may result from opposing effects of mutations on TGF-beta signalling."
    explanation: >-
      Kuechler et al. propose a gain-of-signalling effect for codon Arg300
      variants, the position that contrasts with the loss-of-function
      interpretation of the cystine-knot and truncating alleles.
  - reference: PMID:37719708
    reference_title: "Variable clinical expression of a Belgian TGFB3 founder variant suggests the presence of a genetic modifier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The low penetrance (15%) of aortic aneurysm/dissection suggests that haploinsufficiency alone by the TGFB3 variant may not result in aneurysm development but that additional factors are required to provoke the aneurysm phenotype."
    explanation: >-
      The founder-cohort authors interpret the aortopathy through
      haploinsufficiency plus additional required factors, the
      loss-of-function pole of the controversy.
- discussion_id: tgfb3_mouse_aortopathy_model_gap
  prompt: >-
    Does any Tgfb3 mouse model reproduce the human adult-onset,
    incompletely penetrant aortopathy, given that homozygous Tgfb3-null mice
    die neonatally with cleft palate and pulmonary defects and heterozygous
    mice have no reported aortic phenotype?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Aortic Medial Degeneration and Wall Weakening
  - pathophysiology#Progressive Aortic Dilation and Aneurysm
  rationale: >-
    Model-system evidence exists and is robust for the developmental arm:
    two independent Tgfb3-null lines recapitulate the palatal fusion defect
    that maps to the human cleft palate and bifid uvula. The translational
    gap is the vascular arm — the homozygous null is neonatal lethal, so
    adult aortic biology cannot be studied in the null, and no aortic
    aneurysm or dissection phenotype has been reported in heterozygous or
    viable Tgfb3 mouse models. Whether the human heterozygous aortopathy
    requires human-specific aortic-wall biology, aging, or haemodynamic
    context that mice do not provide is unresolved and gates preclinical
    testing of pathway-directed therapies.
  proposed_experiments:
  - experiment_id: exp_tgfb3_patient_allele_knockin_aortopathy
    name: Tgfb3 patient-allele knock-in mouse aortopathy study
    description: >-
      Generate and age viable Tgfb3 knock-in mice carrying human patient
      alleles (e.g., the cystine-knot p.Cys409Tyr or founder p.Asp263His
      equivalent) on sensitized backgrounds, with longitudinal aortic
      imaging and aortic-wall phospho-SMAD2/ERK readouts to test whether
      the paradoxical signaling up-regulation and late-onset dilation of
      the human disease are reproduced.
  evidence:
  - reference: PMID:7493022
    reference_title: "Abnormal lung development and cleft palate in mice lacking TGF-beta 3 indicates defects of epithelial-mesenchymal interaction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Within 20 hours of birth, homozygous TGF-beta 3-/- mice die with unique and consistent phenotypic features including delayed pulmonary development and defective palatogenesis."
    explanation: >-
      Neonatal lethality of the homozygous null precludes modelling the
      adult-onset human aortopathy in the standard knockout.
notes: >-
  Rienhoff syndrome is the eponymous designation (after Hugh Rienhoff Jr.,
  first author of the index report and father of the proband) of
  Loeys-Dietz syndrome type 5 (MONDO:0014262, OMIM:615582), the
  TGFB3-related member of the heritable thoracic aortic disease group. It is
  modeled here as a distinct entry conforming to the
  aortopathy_tgfbeta_dysregulation module, complementary to the umbrella
  Loeys-Dietz Syndrome entry, which lists LDS type 5 as a subtype. Two
  features distinguish it from other Loeys-Dietz types: (1) vascular disease
  is late-onset and incompletely penetrant, justifying a larger prophylactic
  surgical threshold (Montalcino Aortic Consortium, 2025); (2) the original
  index phenotype included congenital distal arthrogryposis, hypotonia, and
  failure of normal post-natal muscle development without vascular disease,
  reflecting the developmental roles of TGFB3 in palatogenesis and
  myogenesis. Whether TGFB3 deficiency produces increased aortic TGF-beta
  signaling by the same compensatory ligand up-regulation seen with
  TGFBR1/2, SMAD3, and TGFB2 loss is supported by aortic wall
  immunohistochemistry (Bertoli-Avella 2015). The Matyas 2014 report of a
  de novo latency-associated peptide domain variant (PMID:24798638) has no
  fetchable abstract and is noted here without evidence items. ClinGen's
  Arrhythmogenic Right Ventricular Cardiomyopathy GCEP separately curates a
  TGFB3-ARVC association as Limited
  (CGGV:assertion_36ed9be9-2854-49e5-801c-a8fd65fec98e-2019-08-16T160000.000Z),
  a distinct and disputed relationship outside the scope of this entry.

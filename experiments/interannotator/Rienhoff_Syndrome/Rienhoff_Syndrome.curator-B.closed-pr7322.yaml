    explanation: >-
      The authors review the established requirement of TGFB3 for palatal
      confluence, the developmental process disrupted in the proband.
  downstream: []
- name: Impaired Myogenesis and Hypomyoplasia
  description: >
    TGFB3 is the most abundant TGF-beta isoform in developing skeletal
    muscle, and TGF-beta signaling is required for normal myogenesis after
    formation of the paraxial somite. Deficient TGFB3 signaling during early
    muscle development is proposed to reduce the embryonic muscle precursor
    pool, producing congenital low muscle mass (hypomyoplasia) with
    hypotonia, weakness, and failure of normal post-natal muscle development,
    with distal arthrogryposis reflecting reduced fetal movement. This
    mechanism is etiologically distinct from the myopathy of excess TGF-beta
    signaling in Marfan syndrome, and muscle biopsy shows no dystrophic
    change.

differential_diagnoses:
- name: Marfan syndrome
  description: >
    Shares arachnodactyly, pectus deformity, pes planus, joint
    hyperextensibility, and aortic aneurysm; distinguished by FBN1 testing
    and by the absence in the index case of the muscle histopathology and
    cardiovascular findings of Marfan syndrome. The index patient did not
    meet diagnostic criteria for Marfan syndrome.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proposita did not meet the diagnostic criteria established for MFS, BHS or LDS."
    explanation: >-
      The index case illustrates the clinical overlap with, and distinction
      from, Marfan syndrome, Beals-Hecht syndrome, and classic Loeys-Dietz
      syndrome.
- name: Beals-Hecht syndrome (congenital contractual arachnodactyly)
  description: >
    Shares low muscle mass, arachnodactyly, and congenital contractures;
    caused by FBN2 variants. Considered in the index patient, who did not
    meet its diagnostic criteria.
  evidence:

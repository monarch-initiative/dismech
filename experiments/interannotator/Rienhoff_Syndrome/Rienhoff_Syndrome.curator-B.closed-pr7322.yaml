- name: Progressive Aortic Dilation and Aneurysm
  description: >
    The weakened thoracic and/or abdominal aortic wall progressively dilates,
    producing aneurysm. In TGFB3-related disease dilation is late-onset and
    less penetrant than in other TGF-beta heritable thoracic aortic disease:
    29% of a 34-individual registry cohort had aortic dilation (25% of
    children), with aortic root dilation in adults typically 41-49 mm.
  role: effector
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm"
  evidence:
  - reference: PMID:39653386
    reference_title: "Aortic and arterial manifestations and clinical features in TGFB3-related heritable thoracic aortic disease: results from the Montalcino Aortic Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aortic dilation (Z-Score>2) was present in 10 individuals (29%) and aortic dissection occurred in 2 (6%)."
    explanation: >-
      Registry outcomes quantify aortic dilation in 29% of TGFB3 variant
      carriers, establishing progressive dilation as the characteristic
      vascular effector.
  - reference: PMID:39653386
    reference_title: "Aortic and arterial manifestations and clinical features in TGFB3-related heritable thoracic aortic disease: results from the Montalcino Aortic Consortium."

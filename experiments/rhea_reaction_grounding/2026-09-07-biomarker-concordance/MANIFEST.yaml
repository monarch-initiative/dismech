# Pinned inputs for the biomarker-substrate concordance run.
#
# Two of the three inputs are committed beside this file. The third is a ~1 GB
# OAK/semsql build and is deliberately not committed, following the convention
# used for data/orphadata/: pin the identity, fetch the bytes.
run: 2026-09-07-biomarker-concordance
kb_commit: d985fb64

inputs:
- name: rhea2go.tsv
  role: GO term -> Rhea reaction
  path: ../2026-09-07-coverage/rhea2go.tsv
  url: https://ftp.expasy.org/databases/rhea/tsv/rhea2go.tsv
  sha256: a6695b6938942615d4529dea0125277b03bd025c42e0f314557091a08a489b07
  bytes: 201401
  retrieved: '2026-09-07'
  committed: true
  notes: Shared with the coverage run; not duplicated here.

- name: chebi_pH7_3_mapping.tsv
  role: >-
    Reconciles ChEBI protonation forms. Rhea states participants at pH 7.3, so a
    KB biomarker bound to the neutral species does not match a reaction
    participant bound to the zwitterion without this.
  path: chebi_pH7_3_mapping.tsv
  url: https://ftp.expasy.org/databases/rhea/tsv/chebi_pH7_3_mapping.tsv
  sha256: 7076e992933d94e81b66e55d4977c4634b11ad5d9146052c0a25ebc72b5067b2
  bytes: 3099222
  retrieved: '2026-09-07'
  committed: true

- name: rhea.db
  role: >-
    OAK/semsql Rhea build. Supplies the RO:0000057 (has participant) statements
    that name each reaction's ChEBI participants -- 167,770 of them. This is the
    only input that is not published as a TSV; Rhea's FTP tsv/ directory has no
    reaction-to-participant file.
  path: ~/.data/oaklib/rhea.db
  adapter: sqlite:obo:rhea
  bytes: 1025429504
  committed: false
  notes: >-
    Never commit this. Materialize it with `uv run runoak -i sqlite:obo:rhea
    info RHEA:23844`, which downloads it to the path above. Note that OAK's
    upstream build is unversioned, so participant sets can drift between
    downloads; a rerun that disagrees with the recorded numbers should first
    check whether the build changed.

outputs:
- name: candidates.tsv
  role: >-
    Every entry carrying both a Rhea-mappable molecular-function term and a
    ChEBI-bound biomarker, sorted monogenic-first then most-corroborated -- the
    order a curator would pick pilot cases from.
- name: metrics.txt
  role: Headline counts.


# Candidate schema: what every arm returns (DRAFT, to be frozen).
# JSON Schema (draft 2020-12) in YAML. run_all.py validates every arm output against it and
# retries an invalid output once. For the API it is sent as output_config.format; keywords the
# structured-output endpoint does not enforce (minimum, maximum, maxItems) are checked locally.
$schema: https://json-schema.org/draft/2020-12/schema
title: candidate_tests
type: object
additionalProperties: false
required: [candidates]
properties:
  candidates:
    type: array
    minItems: 0
    maxItems: 10
    items:
      type: object
      additionalProperties: false
      required: [analyte, analyte_type, specimen, target, mechanism, rationale, confidence, rank]
      properties:
        analyte:
          type: string
          description: The molecule, antibody, cell population or measure the test reads.
        analyte_type:
          type: string
          enum: [AUTOANTIBODY, ENZYME_ACTIVITY, METABOLITE, PROTEIN_LEVEL, CELL_SURFACE_MARKER,
                 SOMATIC_VARIANT, CELLULAR_DNA_MEASURE, OTHER]
        specimen:
          type: string
          enum: [serum, plasma, whole_blood, dried_blood_spot, leukocytes, lymphocytes, granulocytes,
                 monocytes, erythrocytes, platelets, urine, csf, other]
        target:
          type: string
          description: The antigen, enzyme, gene or molecular entity the analyte reports on.
        mechanism:
          type: string
          description: The disease mechanism that makes the analyte discriminating.
        rationale:
          type: string
          description: Why the test would separate this disease from the conditions it is confused with.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Probability that this test, once developed, would diagnose the disease.
        rank:
          type: integer
          minimum: 1
          maximum: 10

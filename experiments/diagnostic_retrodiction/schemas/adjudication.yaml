# Adjudication output schema (DRAFT). One verdict per candidate index.
type: object
additionalProperties: false
required: [verdicts]
properties:
  verdicts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [index, T1, T3, CLINICAL_T1_ONLY]

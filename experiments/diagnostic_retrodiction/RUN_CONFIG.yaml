# Run configuration for the diagnostic-retrodiction experiment (YAML).
# Read by check_pretest_era.py and literature_recount.py (packet_minimum);
# the remaining keys are fixed for the arm runs described in README.md.

# packet_minimum: the fewest PubMed records (with abstracts, on or before a
# case's verified cutoff date) a disease must have for its time-sliced
# literature packet to be built. Cases below it are excluded as
# INSUFFICIENT_PRE_CUTOFF_LITERATURE (eligibility_rules.md, version 3).
packet_minimum: 30

# Models for the LLM arms. primary runs A2-A7; second_family runs A2' and A3'.
models:
  primary: claude-opus-5-5
  second_family: TBD   # a model from a different family; must be set before prereg-v1

temperature: 0          # applied where the model's API supports it
runs_per_llm_arm: 3     # independent runs per case for each LLM arm
k: 10                   # candidates proposed per case, and the top-k cut-off

# MONDO build used for labels, exact synonyms, MeSH mappings and OAK
# subsumption. release is the build's owl:versionIRI; local_file_date is the
# modification date of the local mondo.db, which is what check_pretest_era.py
# records in literature_check.tsv's mondo_build column.
mondo_build:
  release: 2026-09-01
  local_file_date: 2026-11-12

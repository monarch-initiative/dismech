  sections:
  - ICDOMorphologyEnum
  summary: Extend ICDOMorphologyEnum with 13 morphology families
  details: |
    Completeness review of ICDOMorphologyEnum against the neoplastic entries in kb/disorders/. All ten original values carried an ICD-O behaviour digit of /3, making it a malignant-only histogenetic vocabulary that could not hold benign or behaviour-indeterminate entities and had forced wrong values onto committed entries (mesothelioma as Carcinoma; polycythaemia vera, essential thrombocythaemia and primary myelofibrosis as Leukemia; four germ cell entries as Embryonal Neoplasm). Added Adenoma, Trophoblastic Tumor, Mesothelial Neoplasm, Pericytic Neoplasm, Nerve Sheath Neoplasm, Meningioma, Germ Cell Tumor, Sex Cord-Stromal Tumor, Neuroendocrine Neoplasm, Plasma Cell Neoplasm, Myeloproliferative Neoplasm, Myelodysplastic Syndrome and Histiocytic and Dendritic Cell Neoplasm. Every NCIT meaning was checked against the NCI EVS REST API for active status and preferred label on 2026-08-27; NCIT:C3234 (Mesothelioma), which issue 7548 had proposed, turned out to be a retired concept, so Mesothelial Neoplasm is bound to NCIT:C3786 instead. An ICDO exact_mapping is recorded only where the bound NCIT concept itself carries an ICD-O-3_Code annotation. Every MONDO exact_mapping was checked for non-obsolescence against OLS4. The enum description now states the lump/split granularity rule, the behaviour-neutrality of most values, and the omit-and-explain convention; no Other value was added, deliberately, because the recorded omissions are what drove this expansion. Outcome is needs_followup: the four-digit ICD-O code slot and a first-class neoplastic_behavior slot remain open on issue 7548, and src/dismech/datamodel/dismech_pydantic.py was not regenerated because it is already far out of date against main.

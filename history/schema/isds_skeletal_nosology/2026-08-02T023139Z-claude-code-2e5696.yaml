  summary: Add ISDS skeletal-dysplasia nosology classification axis (PMID:31633310)
  details: |
    Curated the ISDS Nosology and Classification of Genetic Skeletal Disorders,
    2019 revision (Mortier et al., Am J Med Genet A 2019;179(12):2393-2419;
    PMID:31633310) into dismech as a new classification axis, following the
    established pattern for expert nosologies (ICIMD, IUIS, Harrison's).

    Source handling: Table 1 (461 disorders in 42 groups) was parsed out of the
    publisher PDF with pdfplumber using fixed column x-positions, then every group
    description was written from the parsed row set rather than from memory and
    re-checked group by group against the table. Several first-draft descriptions
    were corrected in that pass - Hajdu-Cheney belongs to group 28 not 25,
    brachydactyly-hypertension to 38 not 15, Currarino to 35 not 24, and MPS IX is
    not listed at all.

    Schema changes: new classifications/isds_skeletal_nosology.yaml carrying
    ISDSNosologyGroupEnum (42 flat permissible values, snake_case, with the group
    number opening each description); ISDSNosologyAssignment (is_a
    ClassificationAssignment) in dismech.yaml; the isds_skeletal_category slot;
    registration in the DiseaseClassifications container and the schema import
    list.

    Deliberate modeling choices: (1) the enum is flat and non-hierarchical because
    the nosology is - the committee lists each disorder exactly once and handles
    overlap with "see also" cross-references, so the slot is multivalued only for
    dismech entries that lump several listed disorders; (2) no meaning: is asserted
    on any group, because several groups have no MONDO equivalent and near-matches
    differ in extension; (3) provenance is recorded in notes: rather than
    evidence:, because the paper's PubMed record is abstract-only and no snippet
    from that abstract can support a per-disorder group placement.

    KB backfill (recorded here as one schema-level record covering the sweep,
    following the maxo-removal precedent rather than 165 per-disorder records):
    165 kb/disorders entries received an isds_skeletal_category assignment.
    Candidates were generated by matching each entry's name, synonyms,
    disease_term label, OMIM and ORPHA identifiers against the parsed Table 1,
    then reviewed by hand one by one. Matches that were plausible to a string
    matcher but wrong were rejected rather than assigned: Peters plus syndrome
    (B3GLCT, not the B3GAT3 row), MPS IX, schwannomatosis, Seckel syndrome,
    mucolipidosis IV, SOX11-related neurodevelopmental disorder,
    TBX6-associated congenital scoliosis, Multiple epiphyseal dysplasia
    Al-Gazali type, and generic-umbrella entries whose scope is a superset of
    the listed disorder (Osteoporosis, Pseudohypoparathyroidism, the
    unqualified Ehlers-Danlos Syndrome entry). Umbrella entries that lump only
    listed disorders were assigned with the lumping stated in notes:
    (Mucopolysaccharidosis, Morquio, Sanfilippo, Otopalatodigital Spectrum
    Disorders, Short-Rib Polydactyly Syndrome, Auriculocondylar Syndrome,
    Frontonasal Dysplasia, Split Hand Foot Malformation). The 23 gene-numbered
    osteogenesis imperfecta entries all map to group 25, whose rows are
    phenotypic (OI types 1-5); their notes say so explicitly.

    Documentation: docs/isds-skeletal-nosology.md (added to the mkdocs nav) and a
    new ISDS section in .claude/skills/disease-classification/SKILL.md, both
    carrying the cross-group traps found during transcription.

    Validation: the schema loads under linkml-validate; modified KB entries pass
    validate, validate-terms and validate-references.

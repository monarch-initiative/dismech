- type: AUDIT
  outcome: changed
  summary: Re-transcribe ISDS group 21 against the 2023 Table 1; correct Lowry-Wood
    placement
  details: |
    First group completed in the outstanding 2023 re-transcription the axis documentation tracks. Group 21 was fully re-transcribed from Table 1 of PMID:36779427: 35 rows, NOS 21-0010 through NOS 21-0350. Three corrections to the primordial_dwarfism_and_slender_bones description, which had been transcribed from the 2019 table. (1) Lowry-Wood syndrome was listed as a group-21 member; the 2023 revision moved it to group 9 as NOS 09-0110 'Multiple epiphyseal dysplasia with microcephaly and nystagmus (Lowry-Wood syndrome), RNU4ATAC-related' (OMIM 226960). The group 9 description now records its arrival and the group 21 description records the move, so the two agree in both directions as the group 21 / group 37 Meier-Gorlin pair already does. (2) The gene symbol PCNT2 was updated to the 2023 symbol PCNT. (3) Rows absent from the description were added: NSMCE2, CRIPT, XRCC4 and DONSON MOPD rows, dominant Kenny-Caffey, IMAGe/FILS (POLE), and the SCUBE3 syndrome. The description also now states the two consequences of dyadic naming that make this group's membership hard to read - Seckel syndrome appears only as six 'Microcephalic osteodysplastic primordial dwarfism, <GENE>-related' rows, and the XRCC4 row is SSMED - both of which cost a missing assignment before this pass. No permissible-value key was renamed or added; the change is descriptive only, so existing assignments are unaffected.

  summary: 'Round-5 review: move Meier-Gorlin to group 21, make cross-references reciprocal'
  details: |
    Round-5 review found that the previous commit's Meier-Gorlin correction stopped at the schema and never reached the KB entry it was written about - the same shape as the earlier spEDS case. Independently, extending the gene-vs-source sweep from schema descriptions to KB assignments found the same entry, which is the useful confirmation: two different routes to the same defect.

    Extended sweep design: for each kb/disorders entry carrying isds_skeletal_category, take the gene symbols in its genetic: block, look up which 2023 groups those genes actually occupy in the extracted table, and flag any entry where NO curated gene occupies any claimed group. Across 167 entries it returns two hits.

    Hit 1, genuine: Meier-Gorlin_Syndrome.yaml claimed patellar_dysostoses (group 37) while all twelve of its curated pre-replication-complex genes sit in group 21. Reassigned to primordial_dwarfism_and_slender_bones with notes citing PMID:36779427 group 21, recording that this supersedes the 2019 group-36 placement and naming the trap explicitly: the syndrome's own name begins "ear-patella", so the patellar group looks right, and the 2023 rename to "ear-patella-primordial short stature syndrome" is the signal that it moved.

    Hit 2, false positive worth recording so it is not "fixed" later: Fanconi_Anemia.yaml claims group 38 and its curated gene FANCB resolves to group 36. Group 38 is correct. The 2023 table lists "Fanconi anemia" as a single row whose gene column reads "(several)" rather than a symbol, so the sweep cannot match it by gene; FANCB appears separately in group 36 as VACTERL association with hydrocephalus. The sweep's gene-based matching is therefore a heuristic with a known blind spot for umbrella rows, and its output needs a look at the table rather than blind application.

    Made both dangling cross-references reciprocal, since one-way pointers are the failure mode that produced this finding. Group 21 now names Meier-Gorlin and states it is NOT in group 37 despite the name; group 7 now names the SEMD Camera type BGN entry that group 31's text points at.

    Suggestions applied: reordered the group-31 parenthetical so GPC3 attaches to Simpson-Golabi-Behmel alone and Beckwith-Wiedemann is marked as 11p15 imprinting; added a Meier-Gorlin traps-table row plus an explanatory paragraph, since it is the strongest name-based trap in the set; noted in the NOS documentation that the group prefix is revision-specific, so a quoted NOS id needs its revision stated exactly as a bare group number does.

    Not done, and flagged for a human: the reviewer suggested committing the gene-vs-source sweep script. The script is trivial; its data dependency is not. It requires the full extracted 2023 Table 1 (774 rows), and committing that is a republication question about a copyrighted table rather than a technical one. Raised on the PR rather than decided unilaterally.

    Validation: KB-level sweep now returns only the documented Fanconi false positive; check_folded_hyphens --check clean with the baseline untouched at 330; validate-classification and validate-terms-schema pass; just validate on Meier-Gorlin_Syndrome.yaml passes with 104/104 snippets verified. The full suite passed on the round-3 tree at 17905 passed / 34 skipped.

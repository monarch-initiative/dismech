  summary: 'Round-4 review: fix 4 stale cross-group exemplars found by a gene-vs-source-table
    sweep'
  details: |
    Round-4 review flagged one stale exemplar. Verifying it prompted a systematic sweep that found three more of the same class, which the reviewer's schema-internal sweep could not have caught.

    The reported item: group 26 (OI and bone fragility) still listed "spondylodysplastic Ehlers-Danlos syndrome (B4GALT7)" as an exemplar, while group 5 - text added in the previous commit - claims it. Confirmed against the tables: B4GALT7 EDSSPD1 and B3GALT6 EDSSPD2 are both group 5 rows in 2023, and the 2019 table listed B4GALT7 EDS in group 25 (the 2019 predecessor of group 26). So it is a genuine 2019 leftover, and it is load-bearing because the KB entry was deliberately moved off that group in the previous commit. Converted to an explicit "moved to group 5" cross-reference rather than a bare deletion, matching how Blomstrand and Langer-Giedion are handled elsewhere in the file.

    The sweep: for every active permissible value, extract each gene symbol mentioned in its description and compare against the set of 2023 groups that gene actually appears in, per the extracted table. This checks schema prose against the source rather than against other schema prose, which is why it surfaces cases an internal consistency sweep cannot. Three further genuine errors:

    1. Group 37 (patellar dysostoses) claimed Meier-Gorlin syndrome and its pre-replication-complex genes. The 2023 revision lists all eleven Meier-Gorlin rows (ORC1, ORC4, ORC6, CDT1, CDC6, GMNN, CDC45, MCM3, MCM5, MCM7, GINS2) in group 21, Primordial dwarfism and slender bone dysplasias. Rewritten as an explicit "despite its name, NOT in this group" warning, since the syndrome's own name contains "patella" and will keep attracting curators.

    2. Group 38 (limb hypoplasia) attributed acheiropodia to SHH. The 2023 row is "Acheiropodia, LMBR1-related"; SHH appears in group 40, not 38. Corrected the gene, and added the reason the two groups look entangled: ZRS, the limb-specific SHH enhancer, sits inside LMBR1, and Werner syndrome is a group-38 ZRS row while preaxial polydactyly is a group-40 SHH row.

    3. Group 31 (overgrowth) listed "Meester-Loeys syndrome (BGN)". No BGN row exists in group 31; the revision's only BGN entry is SEMD Camera type in group 7. Removed the claim, named the six real Loeys-Dietz genes, and added the two group-31 members that were missing (Beckwith-Wiedemann, Simpson-Golabi-Behmel).

    Also applied the three round-4 suggestions. Documented the "NOS <group>-<entry>" identifier convention in the docs - it is the nosology's own per-row identifier from Table 1, not something this repo invented, and pairing it with OMIM makes an identification checkable without the paper. Added a note that MONDO independently places pseudopseudohypoparathyroidism under acromelic dysplasia, so a future reviewer does not read the MONDO hierarchy as evidence the unassigned state was an oversight. Reworded the traps-table GNAS row so the 2019 group number is not read against the table's global "these are 2023 numbers" claim.

    Worth recording: while making these edits I introduced a new folded-scalar hyphen split, and the guard widened in the previous commit caught it immediately. That is the gap closing in practice on the first opportunity.

    Validation: check_folded_hyphens --check clean with the baseline untouched at 330; the gene-vs-table sweep now reports only deliberate cross-references; schema parses to 45 permissible values; validate-classification and validate-terms-schema both pass.

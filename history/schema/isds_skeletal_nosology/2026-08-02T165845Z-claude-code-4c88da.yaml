  summary: Migrate ISDS nosology enum from the 2019 to the 2023 revision (PMID:36779427)
  details: |
    Migrated the ISDS classification axis from the 2019 revision (10th edition,
    PMID:31633310) to the 2023 revision (11th edition, Unger et al., Am J Med Genet
    A 2023;191(5):1164-1209; PMID:36779427). Full JATS XML was pulled via NCBI
    efetch, so the 41 group names and all 774 Table 1 rows come from the source
    rather than the abstract.

    Scale of the update: 461 -> 771 entries, 437 -> 552 genes, 42 -> 41 groups.

    Three LinkML constructs carry the migration so no existing annotation is
    invalidated:

    1. Keys are stable identifiers. A permissible-value key is NOT renamed or
       renumbered when a revision renames or renumbers its group; the revision's own
       number and name live in the description. Group numbers are demonstrably
       unstable - the brachydactyly groups moved from 37/38 to 18/19, lysosomal
       storage from 27 to 22 - which is exactly why they are not part of any key.
    2. Superseded names are retained as structured_aliases with
       predicate: EXACT_SYNONYM and source: PMID:31633310, so the 2019 name still
       resolves and carries the citation for the edition that used it. 38 of the 41
       groups carry one; the three that do not (metaphyseal dysplasias,
       spondylometaphyseal dysplasias, severe spondylodysplastic dysplasias) kept
       both name and number across revisions.
    3. Groups the 2023 revision dissolved are kept with deprecated: plus
       deprecated_element_has_possible_replacement - "possible" not "exact", because
       a merge makes the successor broader than the value it replaces. Four values
       are deprecated on that basis: perlecan and aggrecan (merged into the new
       Proteoglycan core proteins disorders group) and neonatal_osteosclerotic_
       dysplasias and other_sclerosing_bone_disorders (fused into Osteosclerotic
       disorders). One group is new with no 2019 counterpart: parathyroid_hormone_
       signaling.

    Body text was carried over from the verified 2019 transcription with two
    mechanical corrections: all in-body "group N" cross-references were renumbered
    through a 2019->2023 map (e.g. the FGFR3 group's pointer to the craniosynostosis
    group moved from 33 to 34), and the one disorder reassignment the paper names
    explicitly was applied - trichorhinophalangeal dysplasia types 1/3 and
    Langer-Giedion left the acromelic group for Brachydactylies as part of
    syndromes.

    KB impact: 6 entries held a now-deprecated value (Raine syndrome under neonatal
    osteosclerotic dysplasias; Camurati-Engelmann, Lenz-Majewski, primary
    hypertrophic osteoarthropathy, sclerosteosis and van Buchem disease under other
    sclerosing bone disorders). All six were migrated to osteosclerotic_disorders
    with notes recording the original 2019 assignment, the merge that moved them,
    and the explicit caveat that membership has not been re-verified against the
    2023 table.

    Deliberately NOT done: mechanically relabelling the other 160 assignments' notes
    from "2019 revision, group N" to 2023 numbering. Those notes are accurate
    provenance - the assignments were made from the 2019 table - and rewriting them
    to cite 2023 without re-checking membership would assert something unverified.
    TRPS is the proof it would be unsafe: a disorder really did change groups
    between editions. Re-verification against the extracted 2023 table is the next
    pass.

    Dyadic naming (the 2023 revision's headline change - pairing each phenotypic
    entity with its causal gene, e.g. "Geleophysic dysplasia, ADAMTSL2-related") is
    documented but deliberately not imported into dismech entry naming. It is a
    disease-identity question for the design-decision register, not something to
    absorb silently into a classification enum.

    Validation: validate-terms-schema passes; the migrated entries pass validate,
    validate-terms and validate-references; full pytest suite run.

  details: |
    Round 6 approved with no blocking items. Applied the three actionable suggestions; the fourth is an unrelated environment issue, not a change to this branch.

    Group 37 was still describing Meier-Gorlin by its 2019 name, "ear-patella-short stature syndrome", while group 21 and the KB notes use the 2023 "ear-patella-primordial short stature syndrome". That is the one place a curator lands when tempted by the patellar group, and the entry's own notes say the inserted "primordial" is what signals the move - so showing the old name there without labelling it undercut the warning. Updated to the 2023 name and added an explicit sentence that the 2019 revision used the shorter name and did list it in this group's predecessor.

    Fanconi anemia's notes were 2019-only. Folded in the 2023 re-verification: the revision retains "Fanconi anemia" in the same group, now numbered 38, still as a single row whose gene column reads "(several)", so the decline-to-decompose caveat carries over unchanged. Also recorded the automated-check trap discovered while sweeping: a check that matches an entry's curated genes against the groups those genes occupy in Table 1 flags this assignment as wrong, because FANCB appears in group 36 as VACTERL association with hydrocephalus - a distinct disorder - while the Fanconi anemia row names no gene at all. The note says plainly that group 38 is correct and not to "fix" it to 36, so the next sweep does not re-raise it.

    Group 34 listed the FGFR3 craniosynostosis disorders but never named the gene, so group 1's pointer at it was not textually reciprocal the way the other seven cross-references are. Checked the table rather than just inserting the token: group 34 holds six FGFR rows, and the two FGFR3 ones are "Crouzon-like craniosynostosis with acanthosis nigricans" and "Craniosynostosis, Muenke type" - note the former is a separate row from the FGFR2 "Crouzon syndrome", not a variant qualifier on it, which the previous phrasing "Crouzon (with and without acanthosis nigricans)" obscured. Rewrote to name the genes per disorder and to state that the two FGFR3 entries belong here rather than with the FGFR3 chondrodysplasias.

    Not actioned: the reviewer noted that running just validate on a fresh checkout rewrites roughly 7,680 references_cache files by re-quoting reference_id. That is real and it is a live trap, but it is pre-existing repository behaviour unrelated to this branch and is already tracked separately in issue #7844. Nothing here touches those files.

    Left open for a human: whether to commit the gene-vs-source sweep script. The script is trivial; committing its data dependency, the full 774-row extraction of Table 1, is a republication question about a copyrighted table. The reviewer agreed this is a call for a maintainer and noted the middle path of committing the script alone.

    Validation: check_folded_hyphens --check clean with the baseline untouched at 330; validate-classification passes; just validate on Fanconi_Anemia.yaml passes with 334/334 snippets verified.

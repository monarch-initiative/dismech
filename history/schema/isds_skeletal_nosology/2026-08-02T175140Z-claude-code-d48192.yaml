  summary: Record 2023 dyadic names as synonyms on 50 skeletal-dysplasia entries
  details: |
    Recorded the 2023 revision's dyadic names (phenotypic entity paired with its
    causal gene, e.g. "Achondroplasia, FGFR3-related") as synonyms on 50 dismech
    entries. Synonyms rather than renames: dyadic naming is a claim about
    disease-entity identity, and adopting it as the primary name: is a
    design-decision question, not a side effect of a classification bump.

    Selection rule, deliberately strict 1:1 - a dyadic name is added only when the
    entry's name stem matches a 2023 row stem (dyadic suffix stripped), the row's
    gene is one of the entry's curated genes, AND exactly one 2023 row matches that
    stem.

    The uniqueness condition is what makes this safe, and getting it wrong was the
    main hazard. A first implementation applied uniqueness AFTER filtering rows by
    gene, which turned multi-gene entities into spurious 1:1 hits whenever the
    dismech entry happened to name only one of the genes: it proposed "Sclerosteosis,
    LRP4-related" (2 rows, SOST and LRP4), "Loeys-Dietz syndrome, TGFBR1-related"
    (6 rows) and "Multiple synostoses syndrome, FGF9-related" (4 rows) as synonyms
    for the umbrella entries. Uniqueness is now judged on the stem alone, and those
    three moved to the skip list where they belong.

    19 entries are skipped because the 2023 revision splits them across several
    gene-specific rows - Coffin-Siris (5), Cornelia de Lange (5), Meckel (6),
    Loeys-Dietz (6), Adams-Oliver (6), geleophysic dysplasia (3), frontonasal
    dysplasia (3), Klippel-Feil (3), auriculocondylar (3), acrodysostosis (2),
    fibrochondrogenesis (2), sclerosteosis (2) and others. In those cases the dyadic
    names denote subtypes, so attaching any single one to the umbrella entry would
    assert a false identity.

    Two individually excluded cases:

    - Multiple sulfatase deficiency. The published 2023 table reads "Multiple
      sulfatase deficiency, SUMF-related" while its own gene column says SUMF1 - a
      typo in the source. Recording a misspelt gene symbol as a searchable synonym
      would do more harm than the synonym is worth, so the row is excluded in the
      generator with a comment.
    - Spondylodysplastic Ehlers-Danlos syndrome. The dismech entry is a three-gene
      umbrella (B3GALT6, B4GALT7, SLC39A13); the 2023 revision splits it across
      three rows in TWO different groups (5 and 13). Only the SLC39A13 row shared a
      stem, so it survived the automated check and had to be rejected by hand. This
      also means the entry's current group assignment (made from the 2019 table
      against B4GALT7) needs re-checking in the verification pass - a concrete
      instance of why that pass is needed.

    Provenance note: dismech's synonyms slot is a plain multivalued string with no
    per-synonym source, so these carry no inline citation. The entries already cite
    the 2023 revision through their isds_skeletal_category notes, and the
    ", GENE-related" form is self-identifying. A structured_synonyms slot would be
    the way to do this properly if per-synonym provenance is ever wanted.

    Validation: 16773 tests pass; sampled entries pass validate, validate-terms and
    validate-references.

  summary: Add conservative MONDO close_mappings to ISDS groups; record the Fanconi
    anemia decomposition caveat
  details: |
    Follow-up to the initial ISDS nosology curation, addressing two review points.

    MONDO mappings on the permissible values. No meaning: is asserted - that would
    claim the value IS an ontology class, which is never quite true for a curated
    nosology group. Instead, three of the 42 groups carry a close_mappings: to a
    MONDO class, chosen under a deliberately strict test: a candidate is rejected
    if the MONDO class contains any entity the ISDS Nosology itself lists in a
    DIFFERENT group, because such a mapping would silently contradict the
    committee's own placement.

    Accepted (all gene-defined series that nest cleanly inside one group):
    group 1 -> MONDO:0019685 FGFR3-related chondrodysplasia, which notably excludes
    the FGFR3 craniosynostoses ISDS places in group 33; group 8 -> MONDO:0018240
    TRPV4-related bone disorder; group 16 -> MONDO:0019696 acromesomelic dysplasia.

    Rejected on the straddle test, recorded in the schema and docs so they are not
    re-proposed: MONDO:0022800 type 2 collagenopathy for group 2 (contains SMD
    'corner fracture' type, group 12); MONDO:0019695 acromelic dysplasia for group
    15 (contains pseudohypoparathyroidism type 1A from group 38 and terminal
    osseous dysplasia from group 7); MONDO:0017198 osteopetrosis for group 23
    (contains melorheostosis and osteopathia striata with cranial sclerosis, both
    group 24); MONDO:0015338 syndromic craniosynostosis for group 33 (contains
    cranioectodermal dysplasia, group 9). Groups 10, 19, 21, 25 and 27 have no
    usable class - the nearest term is either obsolete (chondrodysplasia punctata)
    or narrower than the ISDS group.

    In every accepted case MONDO is broader, because the nosology lists only
    entities meeting its inclusion criteria; breadth is tolerated, crossing into
    another group is not. That asymmetry is why the relation is close_mappings
    rather than exact_mappings.

    Fanconi anemia. Checked against the source: the paper does NOT treat FA's
    status as a skeletal disorder as contentious. FA is listed in group 39 without
    qualification on membership grounds. What the committee flagged is genetic
    decomposition - FA is the only Table 1 row whose name carries a "(see note
    below)" pointer and the only one whose gene column reads "Several" rather than
    naming loci, and the group-39 footnote states that the complex genetic basis of
    FA and its complementation groups "is acknowledged but not further listed in
    this nosology", referring readers to OMIM or specialized reviews. The entry's
    notes: now record that caveat and state the rule it implies: the group applies
    to Fanconi anemia as a single entity, and per-complementation-group (FA-A,
    FA-C, FA-D2, ...) placements must not be derived from Table 1. No separate
    complementation-group entries exist in dismech - they are has_subtypes inside
    the single FA entry - so nothing needed unwinding.

    Also corrected one miss from the first sweep: EFL1-related Shwachman-Diamond
    syndrome now carries group 11, since the group-11 row for Shwachman-Bodian-
    Diamond syndrome lists EFL1 explicitly alongside SBDS, DNAJC21 and SRP54.

    Validation: validate-terms-schema passes with the new mappings; the two edited
    KB entries pass validate, validate-terms and validate-references.

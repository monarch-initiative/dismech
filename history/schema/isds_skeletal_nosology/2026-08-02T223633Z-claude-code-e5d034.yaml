  summary: 'Second review round: correct group-28 membership contradictions, multivalue
    spondylodysplastic EDS, restore ncit cache row'
  details: |
    Second review round on PR #7871. All four new IMPORTANT items accepted and fixed;
    the reviewer also accepted the prior Acrodysostosis decline.

    A. Restored the cache/ncit/terms.csv row for NCIT:C16811 Magnetoencephalography.
    The reviewer's earlier suggestion to drop it as off-topic churn was wrong, and it
    verified its own error: NCIT:C16811 carries meaning: at dismech.yaml:1591, so
    linkml-term-validator legitimately populates that row. Confirmed by deleting-then-
    running just validate-terms-schema, which re-adds it. Restored by regenerating via
    the validator plus just normalize-cache, not by hand-writing the row.

    B. Three group-28 disorders were still named as exemplars of other groups, in
    contradiction of the header's verified group-28 membership: Jansen and Eiken
    dysplasia under group 11, Blomstrand dysplasia under group 25, and PTHLH
    brachydactyly under group 18. All verified against the extracted 2023 table and
    corrected. Note the group-18 case is a half-move rather than a move: 2023 keeps
    "Brachydactyly type E, HOXD13-related" in group 18 and moves only the PTHLH type
    E2 to group 28, so the description now says so explicitly. Group 11's exemplars
    were also refreshed to the actual 2023 membership (the CHH-like POP1/NEPRO
    dysplasias, metaphyseal dysplasia Spahr). The Blomstrand mention inside the
    deprecated 2019 neonatal-osteosclerotic description was deliberately left alone -
    it is correct as history.

    C. Rewrote the group-28 description. It claimed membership "has not yet been
    transcribed", which stopped being true once the header listed all six members,
    and it speculated that the group includes "the pseudohypoparathyroidism/GNAS
    phenotypes". Checking the 2023 table showed that speculation is wrong in a way
    that would have caused real mis-curation: there is no GNAS row in group 28 at all.
    The GNAS entities are Albright hereditary osteodystrophy in group 17 and fibrous
    dysplasia/McCune-Albright plus progressive osseous heteroplasia in group 30, and
    pseudohypoparathyroidism is not listed under that name anywhere. dismech has
    unclassified Pseudohypoparathyroidism and Pseudopseudohypoparathyroidism entries
    that a curator reading the old text would have filed into group 28 on the strength
    of a guess. The description now lists the six verified members and carries an
    explicit warning not to file PHP/PPHP there on mechanistic grounds.

    D. Spondylodysplastic_Ehlers-Danlos_Syndrome is now multivalued across
    dysplasias_with_multiple_joint_dislocations (group 5) and
    spondylo_epi_metaphyseal_dysplasias (group 13), each with its own 2023-cited
    notes. This is the case the multivalued slot is documented for: a dismech entry
    that lumps several distinct nosology disorders. The 2023 revision splits the
    three-gene umbrella as types 1 (B4GALT7) and 2 (B3GALT6) into group 5 and type 3
    (SLC39A13) into group 13 - neither is the OI group the 2019-derived assignment
    used. Taking the stronger of the reviewer's two options was right because this was
    the one entry already known to be wrong; leaving it reading identically to merely
    unverified entries would have been misleading. Side effect: group 5 gains its
    first member, so zero-coverage active groups drop from 4 to 3.

    Suggestions applied: fixed a self-referential renumbering bug where group 25's own
    description said osteoclast-failure osteopetrosis "stays in group 25" (it is group
    24 in 2023); changed "Has no counterpart in the 2019 revision" to "no single
    counterpart ... it fuses two of them" for both merge-target groups, which is what
    the text actually means; updated the last surviving 2019 figures (461/42) in
    docs/isds-skeletal-nosology.md to 771/552/41; and added 2023 re-verification to the
    Acrodysostosis notes, recording explicitly that it stays in the acromelic group and
    does not move to group 28 despite being an iPPSD4 PTH-signalling disorder - the
    entry most likely to attract the same mechanistic instinct again.

    Validation: check_folded_hyphens clean with the baseline untouched; schema loads
    with 45 permissible values; the two edited KB entries pass validate, validate-terms
    and validate-references; full suite run in CI's baseline mode.

  details: |
    Round 7 found a genuine and consequential error in the curator-facing skill file, plus two small follow-ons.

    The blocking item: .claude/skills/disease-classification/SKILL.md stated "Fanconi anemia (group 39)" twice, two bullets after its own rule that group numbers are not stable across revisions and must never be cited as a bare number. Verified against the extracted tables: Fanconi anemia is 2023 group 38, "Limb hypoplasia - reduction defects"; it was group 39 in 2019; and 2023 group 39 is a different group entirely, "Split hand/foot with and without other manifestations". So a curator following the worked example literally would have filed Fanconi anemia into the split-hand/foot group. This was the only place in the repo carrying the number unqualified - the KB entry, the schema, and the docs all state their revision.

    Rewrote the bullet to cite the group by name and revision, to name the 2019 number explicitly as the shift, and to warn that 2023 group 39 is a different group. Also changed the instruction from "assign group 39" to "assign limb_hypoplasia_reduction_defects", with a sentence explaining why: the enum key is revision-stable and the number is not, so the key is what a curator should be typing. That converts the worked example from a demonstration of the failure mode into a demonstration of the rule.

    Suggestion 1: the docs Meier-Gorlin trap paragraph still introduced the disorder as "The disorder is called ear-patella-short stature syndrome" - the 2019 name, unlabelled - while the very next sentence treats the 2023 rename as the tell. Changed to "The 2019 revision called it...", which is the same fix applied to the group 37 description last round, one file behind. Same shape as the round-6 finding, which is why it was worth naming.

    Suggestion 2: group 34 was gene-annotated for every FGFR entry except Beare-Stevenson. Checked the table rather than assuming: the row is "Craniosynostosis with cutis gyrata (Beare-Stevenson), FGFR2-related". Moved it into the FGFR2 cluster with its gene and its distinguishing feature (cutis gyrata), and removed the now-duplicate mention further down the list, so the disorder appears exactly once.

    Validation: check_folded_hyphens --check clean with the baseline untouched at 330; validate-classification passes; schema parses to 45 permissible values.

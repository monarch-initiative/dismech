  summary: Re-transcribe ISDS group 15 membership from the 2023 Table 1
  details: |
    The mesomelic_and_rhizomesomelic_dysplasias permissible value carried an exemplar list transcribed from the 2019 revision, as the schema's own known-gap note says. Replaced it with the full 17-row 2023 membership read off Table 1 as published on the ISDS site, each row identified by its NOS id, and recorded two placement notes the table itself supplies: the KINSSHIP row's warning that its acronym's reference to Nievergelt and Savarirayan is a radiographic resemblance rather than a nosologic relationship, and the group's closing see-also to the ZRS-related tibial hemimelia entity, which is listed in another group and so must not take this value. Also added a do-not-assign note for row 15-0170: it is the syndromic oculo-skeletal MAB21L2 entity, so a dismech entry scoped to isolated microphthalmia with coloboma is correctly left unassigned even though it curates MAB21L2. This closes the group-15 part of the re-verification tracked in issue 7867; the other 40 groups still carry 2019-derived exemplar lists. Schema term validation passes.

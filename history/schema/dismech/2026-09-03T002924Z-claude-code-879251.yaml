  summary: Enact design decisions 3a and 3b; cite credibility standards in the schema
  details: |
    Maintainer (@cmungall) approved design decisions 3a (model_scale, derived scale gap) and 3b (typed divergences) in session on 2026-09-03; both flipped from PROPOSED to ENACTED. Adds see_also references to the credibility literature on the schema elements they informed: ModelMechanismLink and ModelDivergence carry all three of PMID:32993675 (ten rules of credible practice in healthcare modeling), ASME V&V 40, and the FDA computational-model credibility guidance; ModelDivergenceTypeEnum carries the ten-rules citation (its rule 4 is list limitations explicitly); ModelDivergenceMaterialityEnum carries the two device standards, whose risk-informed grading it mirrors. Class comments on ModelMechanismLink now state explicitly that a link is a context-of-use statement and divergences its applicability analysis. New reader-facing explanation doc at docs/explanation/model-credibility.md, registered in the mkdocs nav and pointed to from CLAUDE.md. The doc addresses head-on that V&V 40 and the FDA guidance were written for medical-device submissions: it separates what transfers (the structural ideas -- assess a model for a stated use, argue applicability separately from validity, grade evidence by how much the answer matters) from what does not (the procedural apparatus -- V&V plans, uncertainty quantification, numeric credibility goals, any claim about numerical accuracy), and anchors the design instead in the healthcare-wide ten rules, which reach the same conclusions with no device framing and whose rules 1, 3, 4 and 10 map onto the link, materiality, divergences and the COMBINE alignment respectively. MIRIAM (PMID:16333295) cited in the doc as the systems-biology-native model-annotation convention behind model_format/repository_url/publication. linkml-lint stays at 592 problems, so the see_also additions introduce none.

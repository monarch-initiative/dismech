  summary: Add HAS_MOLECULAR_FUNCTION criterion predicate and immune channelopathy
    value
  details: |
    Added HAS_MOLECULAR_FUNCTION to CriterionPredicateEnum and the molecular_functions slot to LogicalCriterion, so a grouping can require members to curate a GO molecular function, evaluated over the GO is_a/part_of closure exactly as HAS_BIOLOGICAL_PROCESS is. groupings.py maps the predicate to its payload, includes molecular_functions in criterion_closure_terms, and evaluates it against the same GO-id facts; render.py shows the MF chips on grouping pages. Added 'immune channelopathy' to ChannelopathyOrganSystemEnum (src/dismech/schema/classifications/channelopathies.yaml) for ORAI1 and STIM1 deficiency, and noted in the enum description that ion pump disorders are out of scope. Tests added in tests/test_grouping_criteria_closure.py.

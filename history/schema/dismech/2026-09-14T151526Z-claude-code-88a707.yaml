  summary: Add EvidenceItem.quote_role and QuoteRoleEnum
  details: |
    Adds an optional quote_role slot to EvidenceItem, ranged on a new three-value QuoteRoleEnum (PRIMARY_RESULT, BACKGROUND, REVIEW_SYNTHESIS) recording where in the cited publication's own argument a quoted sentence sits. Requested by cmungall on issue #10262 after the distinction had been proposed three times under three names (publication_role in #9827, claim_provenance in #9951, quote_role here). Orthogonal to supports, directness and evidence_source, optional with no UNKNOWN value (absent already means unassessed), and mapped out to CiTO (citesAsEvidence, obtainsBackgroundFrom, and a close mapping to citesAsAuthority for REVIEW_SYNTHESIS, which has no exact counterpart) under the #510 static-enum ruling. Nothing gates on it. A report-only worklist, scripts/check_background_citations.py behind just list-background-citations, derives candidates from NLM structured-abstract section labels and from MeSH indexing.

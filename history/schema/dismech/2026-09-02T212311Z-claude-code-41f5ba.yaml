  summary: Add ModelMechanismLink.model_scale to make the model-to-target scale gap
    computable
  details: |
    Adds an optional model_scale slot to ModelMechanismLink, ranged on the existing BiologicalScaleEnum, recording the biological scale a model actually observes. Compared against the target pathophysiology node's own biological_scale, this makes the model-to-target scale gap derivable instead of leaving it as prose in limitations. The comparison is deliberately NOT stored: a scale_mismatch flag would duplicate two existing slots and could drift. It is also directional -- a model below its target's scale is extrapolating upward and cannot observe the outcome it is cited for, whereas a model above its target's scale contains that scale and is unremarkable. Ships with scripts/model_scale_audit.py (just model-scale-audit), two tests (test_model_scale_values_are_valid, test_upward_extrapolating_links_are_caveated -- the latter verified to fail when limitations is removed from an upward link), CLAUDE.md curator guidance, and design decision 3a. Recorded as PROPOSED, not enacted: per the amendment process the schema change needs a GitHub issue and maintainer sign-off. linkml-lint problem count is 577 before and after, i.e. the change adds none. Schema docs under docs/schema/ were deliberately NOT regenerated: the current gen-doc emits 735 files against 693 committed, so regenerating would bury this change in unrelated generator drift.

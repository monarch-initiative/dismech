  summary: Add typed ModelMechanismLink.divergences with an evidence-derived taxonomy
  details: |
    Adds a multivalued divergences slot to ModelMechanismLink, holding ModelDivergence objects (required divergence_type from ModelDivergenceTypeEnum, required curator description, optional materiality from ModelDivergenceMaterialityEnum, optional evidence). Complements rather than replaces relationship, fidelity and limitations: relationship says what the model does, fidelity how well, limitations the prose summary, and divergences the typed itemisation. The taxonomy was fixed by reading all 50 computational-model limitations strings in the KB and clustering them, with the animal and NAM sets keyword-probed to establish which kinds are shared -- 831 of 1131 links (73%) already carry limitations prose, and the modality profiles differ sharply (animal set dominated by species divergence at 276 hits and allele mismatch at 123; computational set by calibration provenance, absent dynamics and proxy quantities, with species divergence nearly absent). Survey recorded in docs/superpowers/specs/2026-09-02-model-divergence-taxonomy.md. Eleven values: BOUNDARY_OMISSION, PROXY_QUANTITY, CALIBRATION_PROVENANCE, CAUSE_UNREPRESENTED, STRUCTURAL_IDEALIZATION, TEMPORAL_SCOPE, CONTESTED_ASSUMPTION, SCALE_EXTRAPOLATION, SPECIES_MISMATCH, POPULATION_MISMATCH, OTHER. PROXY_QUANTITY is the value that motivates the whole addition: a model reporting a different quantity at the same scale is invisible to the model_scale comparison from design decision 3a. Ships with two tests (test_model_divergences_are_typed_and_explained, test_scale_extrapolation_divergence_agrees_with_scales -- the latter verified to fail on an injected bogus claim, then reverted), an extended model_scale_audit that cross-checks a SCALE_EXTRAPOLATION divergence against the derived scale gap and treats a typed divergence as satisfying the caveat requirement, CLAUDE.md guidance, and design decision 3b. Recorded as PROPOSED pending an issue and maintainer sign-off. linkml-lint goes 577 to 592, all 15 new findings being the same standard_naming warning every enum in this schema already carries. Prior art: ASME V&V 40 and the FDA computational-model credibility guidance, whose context-of-use and applicability-analysis concepts this mirrors.

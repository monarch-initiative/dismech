events:
- type: EDIT
  outcome: changed
  summary: Add CodeList, criteria_set_logic, minimum_occurrences, minimum_interval_days
    and source_reference for computable phenotypes
  details: |
    Additive, optional slots so a Definition can hold a computable phenotype. CodeList (code_system from the new CodeSystemEnum, code_system_version, source_reference, codes as Term) hangs off CriteriaItem.code_lists. CriteriaItem gains minimum_occurrences and minimum_interval_days for count and time-window rules. Definition gains criteria_set_logic (new CriteriaSetLogicEnum, ALL_OF / ANY_OF), because minimum_required only says how items combine within a set. Definition and CodeList gain source_reference, a reference CURIE for the library record transcribed. HDRUK: and PHEKB: became structured-source reference prefixes (src/dismech/structured_sources/hdruk.py, phekb.py), so library records can be cached and quoted. Codes are deliberately unbound, because no vocabulary adapter serves ICD-9-CM, WHO ICD-10, SNOMED CT or Read; just check-codelists checks them against the cited record instead. Nothing narrows, so no migration is needed.

    Merged main into PR 9654. Main had meanwhile assigned 6b (supports is direction only) and 6c (dataset accessions) in docs/explanation/design-decisions.md, so the patient-organization decision this PR records is now 6d, and every reference to it in the schema, scripts, tests, workflow, justfile and CLAUDE.md was updated. The earlier history record in this directory still says 6b; it describes that session as it ran. Main had also moved the per-file pytest checks into one sweep item per file (#11002), so the two per-file tests became check_community_sourced_evidence_is_not_sole_support and check_no_social_media_references, run for disorders, modules, groupings and comorbidities via REFERENCE_CHECKS. The workflow steps moved into main's consolidated whole-repo gates step. ReferenceTagEnum now carries GeneReviews, StatPearls (from main) and PatientOrganization. The FSHD cleanup that the merge made necessary has its own history record.

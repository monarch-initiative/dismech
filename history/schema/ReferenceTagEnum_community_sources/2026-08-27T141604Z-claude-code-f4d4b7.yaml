  summary: Add PatientOrganization/PatientCommunity to ReferenceTagEnum with a not-sole-support
    gate
  details: |
    Adds two permissible values to ReferenceTagEnum (PatientOrganization, PatientCommunity) so community-sourced references are filterable and retractable by query, plus design decision 6b recording the policy and a pytest gate (test_community_sourced_evidence_is_not_sole_support) enforcing that a community-tagged reference is never the sole support for a curated claim.

    Drafted from the pattern worked out in PR #7674 (FSHD), which is approved on content and held open on this governance question. Section 6b is marked PROPOSED because the decision is a maintainer call, not a curator one; nothing in kb/ carries these tags yet, so the gate is a no-op on current content and the schema addition is purely additive.

    Also corrects the section 6 accepted-reference-type list, which omitted url: (846 reference: url: lines across kb/) along with ICTRP:, PPR:, GEO:, file: and metabolights:, and mis-stated NCT as a prefix where the KB uses clinicaltrials:. The tags slot description claimed the whole slot is populated by scripts/tag_references.py -- true only of GeneReviews; the community tags are curator-applied because no cache marker distinguishes an advocacy page from any other fetched URL.

    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED) raised three findings, all confirmed and fixed. First, the pytest gate carried the kb_data marker, so it ran only under just test-kb, which the schema path filter gates -- a curation PR touching only kb/ matched no such filter, so the gate would have been skipped by exactly the PRs that introduce community sourcing (the #9473 shape). The rule now lives in src/dismech/community_evidence.py and runs ungated and whole-KB in CI via scripts/check_community_evidence.py, following the check_entity_refs.py precedent; the pytest sweep stays as a second lane. Second, making tags: curator-writable made scripts/tag_references.py:add_tag_to_existing_entry reachable on an entry that already has a tags: key, where it inserted a second one -- the #8623 duplicate-mapping-key defect, which silently drops the existing tags. It now appends to the existing list, preserving its indentation. Third, the provenance unit test built references[].evidence, a shape PublicationReference does not permit (evidence hangs off Finding); it now uses references[].findings[].evidence and the skip predicate matches the indexed prefix rather than any path starting with "references".

    Also from that round: the gate is now parametrized over REFERENCE_BEARING_FILES (adding kb/groupings, since Grouping carries references), 6b records that the rule is opt-in by tagging and which lane enforces it, and a section 12 Gaps row records the PROPOSED status with both accept and reject paths.

    Review round 2 found that the round-1 fix to add_tag_to_existing_entry was correct for block style but broke flow style, which is worse than the defect it replaced. has_tag_in_entry read only block items, so an entry written `tags: [GeneReviews]` was reported untagged; the new append branch then found no `- ` item and wrote a block item directly after the closing bracket, which does not parse. Seven kb/disorders files carry flow-style tags lists, and Autosomal_Dominant_Charcot-Marie-Tooth_Disease_Type_2W.yaml (PMID:20301532) reproduced the ParserError. On origin/main the same file yields a duplicate tags: key -- bad, but parseable and caught by check-duplicate-keys -- so the round-1 commit converted a caught defect into a hard parse failure.

    Fixed at the root as the reviewer suggested: has_tag_in_entry now recognises flow-style lists, so already-tagged entries report already_ok and nothing is written, and add_tag_to_existing_entry rewrites a flow list in place (for the `tags: []` case) rather than appending a block item to it. Verified across all seven flow-style files: zero parse failures, zero files modified. tests/test_tag_references.py is new and covers both list styles, both failure modes, and a no-op assertion over the committed flow-style entries -- there was no test file for this script before, which is why the defect and then the regression both went unnoticed.

    Round 2 also noted that just qc skipped the new gate while every sibling check was chained into it; a check-community-evidence recipe is now defined and chained into qc, and listed among the offline gates in CLAUDE.md. The evidence-tree walker, briefly duplicated between community_evidence.py and tests/test_data.py, is now defined once and imported.

    Validation: linkml-validate clean on kb/disorders/Asthma.yaml and on a synthetic entry carrying both new tags; SchemaView loads the enum with all three values; check_community_evidence.py reports OK across 2,586 KB files and was verified to exit 1 on a synthetic violation; pytest -k community_sourced_evidence passes over the same 2,586 files; the add_tag_to_existing_entry fix verified against both the existing-tags and no-tags cases, parsing back to a single tags key. The generated datamodel under src/dismech/datamodel/ was deliberately NOT regenerated -- it already lags main's own schema by ~4.9k lines (dismech.py) and ~12.5k lines (dismech_pydantic.py), and CI regenerates it via gen-python rather than diffing the committed copy, so refreshing it here would bury a small policy change in unrelated drift.

  summary: Add PatientOrganization/PatientCommunity to ReferenceTagEnum with a not-sole-support
    gate
  details: |
    Adds two permissible values to ReferenceTagEnum (PatientOrganization, PatientCommunity) so community-sourced references are filterable and retractable by query, plus design decision 6b recording the policy and a pytest gate (test_community_sourced_evidence_is_not_sole_support) enforcing that a community-tagged reference is never the sole support for a curated claim.

    Drafted from the pattern worked out in PR #7674 (FSHD), which is approved on content and held open on this governance question. Section 6b is marked PROPOSED because the decision is a maintainer call, not a curator one; nothing in kb/ carries these tags yet, so the gate is a no-op on current content and the schema addition is purely additive.

    Also corrects the section 6 accepted-reference-type list, which omitted url: despite 611 uses across kb/, and the tags slot description, which claimed the whole slot is populated by scripts/tag_references.py -- true only of GeneReviews; the community tags are curator-applied because no cache marker distinguishes an advocacy page from any other fetched URL.

    Validation: linkml-validate clean on kb/disorders/Asthma.yaml and on a synthetic entry carrying both new tags; SchemaView loads the enum with all three values; the new gate ships with two unit tests covering the community-only, corroborated, untagged and references-provenance cases. The generated datamodel under src/dismech/datamodel/ was deliberately NOT regenerated -- it already lags main's own schema by ~4.9k lines (dismech.py) and ~12.5k lines (dismech_pydantic.py), and CI regenerates it via gen-python rather than diffing the committed copy, so refreshing it here would bury a 3-file policy change in unrelated drift.

  summary: Add PERIMENOPAUSAL and POSTMENOPAUSAL to OnsetEnum
  details: |
    Added two permissible values to OnsetEnum: PERIMENOPAUSAL (HP:6000314) and POSTMENOPAUSAL (HP:6000315), by analogy with the existing PUERPERAL (HP:4000040). Both labels were read from OLS4 on 2026-11-14 in the step they were written; both terms are current, not obsolete, and sit under HP:0003674 Onset. Each description is the canonical HPO label verbatim, so neither needs an aliases entry - PUERPERAL carries one only because HPO's own label for HP:4000040 is the misspelled 'Puerpural onset'.

    The change is additive and the slot is optional, so there is no migration and no in-flight-PR hazard of the kind dismech#10061 records for enum narrowing. No KB entry was backfilled onto either value; PUERPERAL likewise has zero uses, so these add capability rather than encode a backlog. Placed after PUERPERAL because the enum's leading values are chronological age buckets and the reproductive-state onsets are appended after them.

    cache/hp/terms.csv gained the two rows, written by the term validator rather than by hand; just normalize-cache reported no files updated and just check-cache-order and just check-term-cache-integrity pass.

    Validation: just validate-terms-schema took values checked from 1425 to 1427 and meanings validated from 195 to 197, with errors unchanged at the two pre-existing ModifierEnum PATO:0002300 / PATO:0002301 obsolescence failures tracked in dismech#13639 and zero warnings, so both new meanings resolved and both labels matched their descriptions. just check-enum-values is clean over 4663 KB files. just check-duplicate-keys on the schema is clean. just lint-schema went from 714 to 716 problems, the two added being standard_naming warnings on the new value names - the same class that every UPPER_SNAKE enum value in this schema already raises, and the recipe is red on the base branch for that reason. The full just qc chain was not run: it includes whole-corpus validate-all, and an additive enum value no entry uses cannot change its result.

    Not done: src/dismech/datamodel/dismech.py and dismech_pydantic.py were not regenerated. just gen-python does pick up the two values, but it also pulls in an unrelated backlog - GeneOrProductTerm, GeneOrProductDescriptor and nine CurieNamespace lines from a schema change made after the committed artifacts' 2026-11-10 generation date - so regenerating here would bundle another change's derived output into this one. Nothing in tests/ or .github/workflows/ gates their freshness, and the extend-schema skill records the regeneration convention as unresolved. The staleness is worth its own issue.

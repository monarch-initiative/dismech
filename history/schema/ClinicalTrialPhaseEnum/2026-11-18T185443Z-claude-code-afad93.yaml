- type: EDIT
  outcome: changed
  summary: Add combined and early phase values to ClinicalTrialPhaseEnum
  details: |
    ClinicalTrialPhaseEnum had no value for a combined-phase trial, so curators each picked a workaround and the three in kb disagreed: omit the phase, round down, or round up. A query for phase III trials in a disease therefore included some phase 2/3 trials and silently excluded others, depending on which curator wrote the row, with the real phase only in free-text notes. Added PHASE_I_II and PHASE_II_III, mirroring the ClinicalTrials.gov vocabulary, plus EARLY_PHASE_I, which the registry records as EARLY_PHASE1 and which PHASE_MAP previously mapped to PHASE_I with a comment saying it was approximate. Widening only, so no in-flight PR breaks; check-enum-values passes over all 4718 kb files and the three new values are rejected by the pre-change schema and accepted by this one. The audit in clinical_trial_status.py needed the other half: a registry record carrying two phase tokens would otherwise have reported a correctly curated combined value as phase_drift, since the curated value is not one of the component phases. COMBINED_PHASES maps the exact component set to the combined value, keyed on the set so an unregistered combination such as PHASE1 plus PHASE3 falls through to the per-component comparison rather than asserting a design the registry did not register. LEGACY_PHASE_SPELLINGS keeps the pre-existing rounded values quiet, because migrating one means re-reading its registry phase and this audit is advisory. Migration of the roughly 16 entries whose own prose names the workaround, within about 170 that mention a combined phase, is tracked as issue 18404; issue 9319 would make the whole set checkable by caching the registry phase rather than only the self-describing subset. The docs page for the audit, docs/clinical-trial-status.md, is updated in the same change: its mapping table still described EARLY_PHASE1 as approximate and its paragraph described only the any-of-the-components match, so a curator reading the page CLAUDE.md links would have been told the new values do not exist. It now carries the combined rows, what live prints, and an explicit statement that silence on a rounded row means not yet migrated rather than verified correct.

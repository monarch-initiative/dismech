  summary: Add ExperimentDesignEnum, ExperimentExecutabilityEnum, and the animal/computational
    model slots on Experiment
  details: |
    Experiment carried no controlled classification. experiment_type is an ontology-backed Descriptor whose 'prefer OBI terms' instruction is unfollowable (OBI is absent from conf/oak_config.yaml and has no cache/enums/ membership cache, the gap already recorded for assays:), so it sat at 13.4% fill holding 384 distinct free-text strings in 428 values - a ratio that is getting worse, not better. Added two optional closed enums: ExperimentDesignEnum (8 values; the coarse always-fillable design family) and ExperimentExecutabilityEnum (CONCEPTUAL/SPECIFIED/PARAMETERIZED/EXECUTABLE; how far a proposal is specified, not how good it is). Also added animal_models and computational_models to the Experiment class, reusing the existing slots and classes: Experiment.model_systems is ranged on ExperimentalModel, which is non-animal NAMs only, so animal and in-silico proposals had no route to the pathograph except experimental_model_type: OTHER, which ExperimentalModel's own comment forbids. The experiment level now mirrors the disease level's three-way split. All additive and optional, so existing entries validate unchanged. Two findings recorded in docs/explanation/experiment-model.md: LinkML 1.10 already gives implicit subclass polymorphism on a plain inlined_as_list range (accepting any subclass, rejecting a chimera mixing two siblings' slots), so an any_of over subclasses is unnecessary; and any_of over inlined object ranges is unsafe here, because range: Any plus any_of leaves only the $ref effective under JSON Schema's ignore-siblings-of-$ref rule and silently accepts arbitrary keys - the qualifiers blind spot (#10197) in a new place. Population strategy is scripts/backfill_experiment_design.py for experiment_design; executability has no population strategy yet and may be derivable rather than stored, which is flagged as an open question in the design doc.

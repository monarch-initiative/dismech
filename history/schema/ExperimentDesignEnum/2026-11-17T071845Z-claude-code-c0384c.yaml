  summary: Record the profiling/observational tie-break and the in-vivo model_systems
    caveat
  details: |
    Prose-only clarification of three descriptions; no permissible value or slot was added, narrowed or removed, and no validation behaviour changes. (1) HUMAN_OBSERVATIONAL and DESCRIPTIVE_PROFILING now state the discriminator for the case where both fit, a non-perturbational study of human material: the unit of analysis. HUMAN_OBSERVATIONAL when the inference is about the people, DESCRIPTIVE_PROFILING when it is about the specimens and the participants are only their source. DESCRIPTIVE_PROFILING also now says it is not restricted to human material, which is what keeps the two from competing over the whole non-perturbational space. Read against the 453 records already carrying one of the two values, the rule moves exactly one (exp_imcd_pretreatment_endotype_stratified_trial, which randomizes and is an INTERVENTIONAL_TRIAL), so it codifies existing practice rather than reclassifying it. (2) model_systems records the one case where its own instruction to move an animal model to animal_models should not be followed: an in-vivo preparation scoped to a tissue or cell type. Measured across the 15 such rows, five carry an NCBITaxon-bound organism that AnimalModel.species (a plain string) would turn back into free text, and three of those also carry tissue_term or cell_types, for which AnimalModel has no slot. Verification: just lint-schema reports 716 problems both with and without this change; just check-enum-values is clean; just validate-disorders passes on all 13 changed KB files with 1,080 snippets verified and 0 issues. just validate-terms-schema fails with 2 pre-existing PATO label errors (Expected Decreased, Actual decreased quality) that reproduce identically on main. The committed datamodel artifacts were deliberately not regenerated: main's copies are already 279 lines stale from an earlier unregenerated schema change, so regenerating here would import an unrelated GeneOrProductDescriptor class into this diff.

events:
- type: EDIT
  outcome: changed
  summary: Add Definition.criteria_set_logic and CriteriaItem.attaches_to
  details: |
    Added CriteriaSetLogicEnum (ALL_REQUIRED, ANY_SUFFICIENT, GRADED, WEIGHTED_SCORE) and an optional Definition.criteria_set_logic slot recording how a definition's criteria_sets combine; CriteriaSet.minimum_required only ever counted criteria within one set. The four values were chosen from the 15 definitions in kb/ that carry two or more criteria sets: DSM-style lettered criteria and revised Sapporo need every set, the NMOSD serostatus pathways are alternatives, the Mississippi HELLP classes are grades, and PARACELSUS is a points total. Added the existing attaches_to slot to CriteriaItem so a criterion names the phenotype it tests for as an entity reference; the existing entity-ref resolver already walks every attaches_to and checks it as a foreign key. New rules in src/dismech/definition_criteria.py, run by scripts/check_entity_refs.py and tests/test_data.py: criteria_set_logic needs two or more sets, and a criterion that attaches_to a phenotype and carries its own term must carry that phenotype's id and label. scripts/criteria_item_refs.py (just list-criteria-item-refs) is the backfill worklist; its --apply writes only criteria whose term and wording both match one phenotype, because a shared CURIE alone linked NMOSD's Acute myelitis criterion to a narrower LETM phenotype on the first trial run. Both slots are optional, so no existing entry or open PR is invalidated. Docs: docs/definition-criteria.md and a CLAUDE.md section. The generated datamodel was not regenerated, because gen-python also pulls in unrelated drift from earlier schema changes.

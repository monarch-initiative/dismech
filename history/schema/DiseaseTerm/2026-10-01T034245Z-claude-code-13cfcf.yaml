events:
- type: EDIT
  outcome: changed
  summary: Add MONDO injury root to DiseaseTerm and DiseaseOrSubtypeTerm
  details: |
    Added MONDO:0021178 (injury) as a reachable_from source node of the DiseaseTerm and DiseaseOrSubtypeTerm dynamic enums, enacting the MONDO constraint in design decisions section 3f at maintainer direction. MONDO files injuries under a root that is not a subclass of MONDO:0000001 (disease); before this change burn (MONDO:0043519), frostbite (MONDO:0800177), head injury (MONDO:0800482), ischemia reperfusion injury (MONDO:0005203), radiation injury (MONDO:0043458), bone fracture (MONDO:0005315) and its eight fracture descendants could not anchor an entry. Injuries that also sit under disease through a second parent, such as traumatic brain injury (MONDO:0858950) and spinal cord injury (MONDO:0043797), were already admissible. The change only widens the enums, so no existing binding is invalidated. Because the validator keys each enum membership cache file on a hash of the enum's reachable_from query, the two cache files were renamed to the keys the current schema produces (diseaseterm_f618932bb23f.csv to diseaseterm_b84b03ef2175.csv; diseaseorsubtypeterm_6d5891ec946f.csv to diseaseorsubtypeterm_25e3df8b550a.csv), with rows unchanged. Every cached row remains a member, because the new roots are a superset of the old. Checked by validating a test entry bound to MONDO:0043519 (rejected by the previous schema, accepted by the new one) and by running the offline enum cache and term cache integrity checks, which both pass.

- type: EDIT
  outcome: changed
  sections:
  - schema
  summary: Add Pathophysiology.node_class, an enum generated from the v1.0 node-class
    tree
  details: |
    Added an optional, single-valued Pathophysiology.node_class slot ranged on PathographNodeClassEnum, which is an imported schema module (src/dismech/schema/pathograph_node_class.yaml) generated from kb/node_classes/pathograph_node_classes.txt by `just gen-node-class-enum`. The tree is declared v1.0, with versioning rules in its header. The enum holds the 86 classes under the nine cascade tiers and DISPOSITION, each carrying its parent class as is_a; ALSO CLASSES, DEBUNDLE TARGETS and STILL UNPLACED are not values. `just node-classes --check-enum`, added as an ungated CI step with a pytest twin, fails while the enum and the tree disagree.

    biological_scale is kept rather than superseded: a class gives a scale but a scale does not give a class, since MOLECULAR alone covers four tiers. `just node-class-scan --format scale` reports nodes whose curated class tier and curated scale disagree, without failing. The role slot description now gives the current size of its vocabulary and points kind-of-thing roles at node_class. Design decision 14 records the change. No KB entry was changed or backfilled.

    Checked: linkml-validate accepts a node carrying node_class CELL_DEATH and rejects FOUND_BY_NAME, a worklist class; linkml-lint reports the same 696 problems on this schema as on main; the four node-class test files pass. The committed datamodel was not regenerated, because gen-python against main's schema already produces about 8,400 lines of unrelated drift and the test recipes regenerate it before running.
- type: EDIT
  outcome: changed
  sections:
  - schema
  summary: Resolve the generated enum from the working checkout, and keep build notes
    out of its descriptions
  details: |
    Changes made in review. `--write-enum` and `--check-enum` now resolve the enum module through repo_root(), falling back to the packaged copy when the checkout has no src/dismech/schema/. A worktree that shares the primary checkout's virtualenv therefore writes and checks its own enum, where before it wrote into the primary checkout and compared its tree with that checkout's enum. node_class_tiers() still reads the packaged copy. A test runs both flags from a throwaway checkout and fails, without touching the real file, if the write goes to the package's tree.

    Fourteen glosses carried node counts, KB statistics, or notes on how the tree was built (for example "41 nodes had no home", "the 8th commonest head noun in the KB") into the generated enum descriptions, where they would go out of date. That text now sits in a comment line under each class, marked as a v1.0 build note. The glosses keep their definitions, their MeSH, SNOMED or MPATH source, and their contrasts with neighbouring classes; two (cis-regulatory variant, nutritional deficit) keep as a short clause the distinction their build note drew. A gloss edit needs no version bump, so the tree stays at 1.0.

    The datamodel was again left unregenerated, for the reason given in the first event.

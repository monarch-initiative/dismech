events:
- type: EDIT
  outcome: changed
  summary: Add a description slot to ProgressionInfo
  details: |
    ProgressionInfo had no description slot and no class description, so a progression phase could only describe itself in notes. CLAUDE.md reserves notes for the caveats and qualifications a claim needs rather than for the claim, and nearly every neighbouring class an entry fills in takes description, so writing one on a phase is the natural thing to do; the validator rejected it, which is what happened on PR 14448 and pushed the text into notes. Added the shared description slot plus a class description, with slot_usage text drawing the line against notes so the distinction does not drift back. Additive only: no existing entry changes and every phase without the slot still validates, confirmed against the pre-change schema, which rejects the same probe with 'Additional properties are not allowed'. The progression card in disorder.html.j2 did not render description at all, so the slot would have been invisible; it now renders in the same item-desc position the adjacent Stages card uses, verified by rendering a real entry with a probe description. A new test pins the slot, its guidance text, the additive property, and the renderer.

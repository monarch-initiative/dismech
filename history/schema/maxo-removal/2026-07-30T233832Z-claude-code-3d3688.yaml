  summary: Remove MAXO ontology; remap all treatment/diagnosis terms to NCIT
  details: |
    Removed the Medical Action Ontology (MAXO) from dismech entirely. Migrated all 4,351 MAXO term bindings across 1,358 KB files (kb/disorders, kb/comorbidities) to NCIT equivalents via scripts/migrate_maxo_to_ncit.py, driven by the frozen crosswalk docs/superpowers/maxo_ncit_final_map.tsv (345 terms remapped, 7 terms with no NCIT equivalent left term-free with a free-text preferred_term; 39 occurrences). Every remap target verified reachable from NCIT:C25218 against the local sqlite:obo:ncit build; drug-class/substance/device MAXO nodes that were not procedures (e.g. NSAID/ACE-inhibitor/diuretic agent therapies) were remapped to a reachable generic action (NCIT:C15986 Pharmacotherapy, C15433 Nutritional Support, etc.) with the specificity retained in preferred_term. Schema: dropped MAXO:0000001 from TreatmentActionTerm.source_nodes (now NCIT:C25218-only) and scrubbed MAXO from all slot/class descriptions. Regenerated the treatment enum-cache (treatmentactionterm_b7dcb86faf99.csv, 342 NCIT terms) using the local NCIT db, then reverted conf/oak_config.yaml to NCIT: ols:ncit and removed the MAXO adapter + cache/maxo/. Updated render.py, kgx_export.py, templates, datamodel py/pydantic, 4 test files, CLAUDE.md, design-decisions.md, skills, and living docs. Validation: schema + term validation pass across disorders/modules/comorbidities under the committed ols:ncit config (cache-first path); pytest green.

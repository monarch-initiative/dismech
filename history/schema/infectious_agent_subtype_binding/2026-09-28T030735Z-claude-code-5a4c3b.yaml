  summary: Verify the AgentSubtype narrowing against all five agent-subtype entries
  details: |
    The PR was red on the curation-scope guard, which rejects a curation PR touching src/dismech/schema/ or tests/. Here the schema change is the stated point of the PR, so the guard's own documented remedy applies and the scope-override label was added rather than the change being removed.

    Before agreeing to that, the narrowing was re-verified on the merged tree, because narrowing a range is the change shape that breaks content authored while the PR is in flight (CLAUDE.md, Retired Enum Values). InfectiousAgent.has_subtypes is narrowed to AgentSubtype, so every entry populating that slot must still validate.

    The PR body names three such entries -- Cholera, Shigellosis and Paratyphoid_Fever. A scan of kb/ on the merged tree finds five:

      Shigellosis                           Shigella, 4 strata
      Paratyphoid_Fever                     Salmonella enterica serovar Paratyphi, 3
      Invasive_Non-Typhoidal_Salmonellosis  Non-typhoidal Salmonella enterica, 3
      Paralytic_Poliomyelitis               Poliovirus, 2
      Cholera                               Vibrio cholerae, 2

    The last two are not mentioned in the PR and postdate it; they reached main after 2026-09-01. All five validate against the narrowed schema with no issues, so the additive claim holds over the content that exists now and not only over the content that existed when the change was written.

    Also re-run: the seven tests in tests/test_infectious_agent_schema.py pass, and just validate-disorders on Pinta and Bejel reports 118/118 snippets and 159 titles with zero issues. main was merged in; the branch was four weeks behind and the merge was clean.

events:
- type: EDIT
  outcome: changed
  summary: Add ExecutableProtocol to Experiment
  details: |
    Adds Experiment.executable_protocols (range ExecutableProtocol), the four-value ExecutionVenueEnum, and six supporting slots, so a proposed experiment can record that an orderable service exists which would take the measurement it asks for, at a named provider and a recorded price. protocol_reference was already present but unused across all 1105 entries carrying proposed_experiments, and it means something different: it cites a methods paper, not a service that can be ordered. measures reuses the attaches_to hash-anchor grammar and was added to entity_refs.REF_SLOTS and KNOWN_KIND_SLOTS so it is gated as a foreign key. provider is free text and venue_type is the enum, so a new laboratory is data rather than a schema PR. Additive and entirely optional, so no KB migration is needed and no in-flight PR is invalidated. Worked example: Prolidase_Deficiency pd_allele_panel_abundance_stability_catalysis, three Ginkgo Cloud Lab protocols decomposing the single clinical residual-prolidase-activity figure into abundance, folding and catalysis. Catalogue read 2026-10-01; a test gates that protocol_id/protocol_url carry a retrieved_date. Carries no price, turnaround, or throughput slot: a first draft had them and they were removed on review, because commercial terms go out of date with no signal that they have and mirroring a provider's price list is not this repository's job. A test asserts their continued absence so re-adding one is a deliberate decision.

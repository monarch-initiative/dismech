events:
- type: EDIT
  outcome: changed
  summary: Add REFUTED beside DISPUTED on GeneDiseaseRelationshipEnum
  details: |
    Added the permissible value REFUTED to GeneDiseaseRelationshipEnum and narrowed the description of DISPUTED, which previously said it covered both ClinGen Disputed and Refuted. The two are different claims: DISPUTED means the gene-disease question is open (conflicting or unreplicated evidence), REFUTED means the refuting evidence significantly outweighs the original report. The split mirrors the one GeneDiseaseValidityClassificationEnum already makes (GENCC:100005 and GENCC:100006), so a curator's reading and a copied external tier can now agree value for value. Additive: no existing entry is invalidated; the 95 existing DISPUTED rows are untouched and a curator may regrade any of them to REFUTED where the refutation is cited. REFUTED joins the non-contributing relationship types in dismech.graph so a refuted locus draws no mechanism edge and is not counted as an unwired causal gene by the gene-outlink compliance metric. CLAUDE.md gained a population rule under the gene-validity section with a decision table and the requirement that a REFUTED row cite the refutation. Motivated by the Parkinson disease split, where the PARK5, PARK11, PARK13 and PARK18 susceptibility loci (UCHL1, GIGYF2, HTRA2, EIF4G1) need a structured home that is neither a subtype row nor a deletion. Generated Python models under src/dismech/datamodel/ were deliberately not regenerated: they were already thousands of lines stale before this change, and regenerating would bundle that drift into an unrelated enum edit.

    Review of PR 16952 found that the KGX exporter's gene_to_edge emitted biolink:contributes_to for every genetic row regardless of relationship_type, so a REFUTED row (and any of the pre-existing DISPUTED rows) would have entered the knowledge graph as a causal gene-disease claim citing its own refutation as the supporting publication. gene_to_edge now emits no edge for a DISPUTED or REFUTED row, with tests covering both grades and the grades that still export; CLAUDE.md records the exclusion beside the population rule.

- type: EDIT
  outcome: changed
  summary: Add BIOMECHANICAL computational model type
  details: |
    Added the permissible value BIOMECHANICAL to ComputationalModelTypeEnum for continuum-mechanics models of tissue deformation under load, typically finite-element models, as called for by design decision 3f. Before this a finite-element head model could only be filed as PHYSIOLOGICAL, which the enum defines as PBPK or organ models. The change is additive; no existing value or entry is affected, and nothing in the renderers or tests enumerates the values. First use: the finite-element head model in Traumatic_Brain_Injury.

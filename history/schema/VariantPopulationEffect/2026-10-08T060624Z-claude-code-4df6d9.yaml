events:
- type: EDIT
  outcome: changed
  summary: Add Variant.population_effects with HANCESTRO-bound populations
  details: |
    Adds VariantPopulationEffect (population, ancestry_terms, ancestry_basis, comparator_stratum, effect_differences, clinical_significance, penetrance, penetrance_percentage, allele_frequency, cohort_size, description, evidence, notes) as Variant.population_effects; AncestryDescriptor bound to the new AncestryTerm dynamic enum rooted at HANCESTRO:0004 (ancestry category); AncestryBasisEnum and PopulationEffectDifferenceEnum; HANCESTRO prefix and an ols:hancestro adapter in conf/oak_config.yaml. Additive and optional, so no existing entry changes. HANCESTRO was chosen over the HL7/CDC race and ethnicity codes and NCIT population terms on coverage of 20 FMF and founder-variant populations (18, 6 and 14 respectively); HL7 has no ancestry vocabulary and does not register HANCESTRO. Rationale is design decisions section 16; curator rules are in CLAUDE.md. Validated by linkml-lint (no new findings beyond the standard enum-naming warnings), tests/test_variant_population_effect_schema.py, and term validation on the FMF worked example, including negative checks that a wrong HANCESTRO label warns and a non-HANCESTRO CURIE fails AncestryTerm. src/dismech/datamodel/ was not regenerated: it already differs from main's schema by about 4,450 lines, so regenerating would bundle unrelated changes.

    The FMF worked example (MEFV M694V and M694I with Japanese population effects, its references and the HANCESTRO term caches) was moved to a separate curation PR stacked on this one, because the repository's CI scope check does not allow KB content and schema or code changes in the same PR. This PR is schema, tooling and documentation only.

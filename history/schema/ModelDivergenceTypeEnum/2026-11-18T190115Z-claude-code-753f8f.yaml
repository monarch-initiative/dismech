- type: EDIT
  outcome: changed
  summary: Add INCOMPLETE_PHENOTYPE to ModelDivergenceTypeEnum
  details: |
    ModelDivergenceTypeEnum had eleven values and none said that a model shows some of the disease phenotype and not the rest. The nearest value, SPECIES_MISMATCH, asserts something stronger and different: that the divergence follows from the organism being a different species. Where it does not, using it puts a cause in a typed field that is not in evidence and leaves the real issue in description, the one field no query can read, which is the outcome the taxonomy exists to prevent. Added INCOMPLETE_PHENOTYPE and made the two values point at each other, since neither description is usable without the contrast. SPECIES_MISMATCH is kept and its description now states the structural test explicitly. Widening only, so no in-flight PR breaks. The enum class description and the CLAUDE.md passage both predicted this addition and are updated; CLAUDE.md also carried a stale claim that divergences are populated on computational models only. Counted over kb through dismech.model_links.iter_model_links: 603 divergence entries on animal_models, 243 on experimental_models, 82 on computational_models and 12 inside proposed experiments, across 275 files. The issue reported 87, 45 and 26 across 41 files when it was filed, so the corpus has grown about sevenfold and the direction it noted is stronger; the figures are recorded with the instruction to re-run the walk rather than trust them. SUPRAPHYSIOLOGICAL_EXPRESSION remains the other predicted addition and is not added here, since this issue carries the corpus evidence for one value only. The PR carries the scope-override label: the Check curation PR scope gate fires because the change touches kb alongside the schema, CLAUDE.md and a test, and the label is the remedy that gate names. The override is justified here because the schema change is the subject and the single kb edit is its proof, migrating the one entry whose own description said the value did not exist. Splitting them would leave that sentence in kb asserting the absence of a value that now exists until a follow-up merged.

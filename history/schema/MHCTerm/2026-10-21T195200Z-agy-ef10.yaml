- type: EDIT
  outcome: changed
  summary: Add MRO prefix and OAK adapter, MHCTerm dynamic enum, MHCDescriptor, and mhc_term on Genetic and TreatmentEffectModifier
  details: |
    Added the MHC Restriction Ontology (MRO) prefix (http://purl.obolibrary.org/obo/MRO_) to src/dismech/schema/dismech.yaml and configured MRO: ols:mro in conf/oak_config.yaml. Because MRO's root MHC protein complex term is GO:0042611 (already a root of ProteinComplexTerm), Pathophysiology.protein_complexes automatically accepts MRO protein complex terms once MRO is configured in OAK. Added the MHCTerm dynamic enum (reachable from GO:0042611, MRO:0000775, MRO:0000776, MRO:0000007, and MRO:0000005), MHCDescriptor, and optional mhc_term slots on Genetic and TreatmentEffectModifier so multi-locus HLA serotypes, heterodimers, and allele-specific MHC restriction complexes can be bound alongside single-locus HGNC genes. Exercised immediately in kb/disorders/Hepatitis_B.yaml (Genetic.mhc_term binding MRO:0001356 MHC class II protein complex at line 980 and TreatmentEffectModifier.mhc_term binding MRO:0001284 HLA-DRB1*03:01 protein complex at line 1557). Added MRO to ONTOLOGY_NAMES and gene.mhc_term / effect_modifier.mhc_term role definitions to src/dismech/term_tooltips.py, rendered the pills in src/dismech/templates/disorder.html.j2, and added unit tests in tests/test_mhc_restriction_schema.py.

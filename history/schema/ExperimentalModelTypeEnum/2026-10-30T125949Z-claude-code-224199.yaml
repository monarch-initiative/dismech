- type: EDIT
  outcome: changed
  summary: Add CELL_FREE, PSC_DERIVED_MODEL and EX_VIVO_TISSUE; deprecate IPSC_DERIVED_MODEL
  details: |
    Added three permissible values to ExperimentalModelTypeEnum and deprecated one. Before this, every value but OTHER presupposed cultured cells, so cell-free assays, embryonic stem cell models and intact tissue preparations were typed OTHER or under a value that misdescribed them.

    CELL_FREE covers a system with no intact cells present during the measurement: purified-protein and enzyme assays, reconstituted complexes, liposome and proteoliposome systems, cell-free translation and lysates, membrane fractions, and isolated organelles such as purified mitochondria. It includes the OECD in chemico skin-sensitization assays (DPRA, ADRA, kDPRA). The deciding test is whether intact cells were present during the readout, so a protein expressed in E. coli and then purified is CELL_FREE. The description asks curators to record what the absence of cells excludes as a BOUNDARY_OMISSION divergence on each modeled_mechanisms link, or in notes when the model has no link; ExperimentalModel has no limitations slot of its own.

    PSC_DERIVED_MODEL covers a model differentiated from any pluripotent stem cell line, induced or embryonic, with the kind of line recorded in cell_source. IPSC_DERIVED_MODEL is marked deprecated in its favour but stays valid. This follows the analysis on issue 12806: curators were already putting ESC models under IPSC_DERIVED_MODEL (Spastic_Paraplegia_89_Autosomal_Recessive, Diabetes_Deafness_Developmental_Delay_and_Short_Stature_Syndrome) or CELL_LINE (Fabry_Disease), which a separate ESC value would have left mislabeled.

    EX_VIVO_TISSUE covers tissue maintained outside the body with its native architecture: explants, organotypic and precision-cut slices, organ cultures and isolated preparations such as vessel rings, including permeabilized tissue such as the skinned myocardial strips in Dilated_Cardiomyopathy_1Z. PRIMARY_CELL_CULTURE's description now says its cells are dissociated, to mark the boundary.

    All changes are additive. No KB entry was retyped and none is invalidated, including the 250 existing IPSC_DERIVED_MODEL values; retyping is left to curators editing each entry. The ExperimentalModel class gained a comment that one record holds one model system, so a source pairing a biochemical assay with a cell assay is curated as two records. The disorder page icon map covers the new values, a test fails if a future value lacks an icon, and CLAUDE.md carries the curator-facing rules.

- type: EDIT
  outcome: changed
  summary: Add Subtype.curated_in pointer slot (design decisions 3e)
  details: |
    Added the optional string slot curated_in to Subtype: the file stem of the kb/disorders entry in which a promoted stratum is curated in full. It marks a pointer subtype (design decisions 3a L4 and 3e rung 4) so that a consumer counting diseases does not count it and so that scripts/check_granularity.py can tell the prescribed pointer shape from an undeclared duplicate (DOUBLE_MODELLED) and can report a target that does not exist (DANGLING_POINTER). Additive; no existing entry is invalidated. Populated on the two pointer rows of Spotted_Fever_Rickettsiosis in the same PR. Tests in tests/test_granularity.py pin the slot on Subtype and the KB-wide no-dangling-pointer invariant.

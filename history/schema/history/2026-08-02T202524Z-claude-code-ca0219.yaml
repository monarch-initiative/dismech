  summary: Add target.superseded_by for renamed/retargeted history targets
  details: |
    Fixes the red main reported in #7861 (regression from #7833), which blocked every
    PR refreshed from main.

    Cause. #7833 began as a de-novo curation of Fanconi-ichthyosis-dysmorphism (FID) and
    was correctly retargeted mid-curation to ARC syndrome once PMID:11668108 established
    FID is not an independent entity. The first history record of that PR genuinely ran
    under the old slug, so it still points at kb/disorders/Fanconi-Ichthyosis-Dysmorphism_Syndrome.yaml,
    which no longer exists - and test_committed_history_records_follow_layout asserts
    every record's target resolves on disk.

    Approach. history/ is append-only, so rewriting the stale record's target.slug/path
    would have made the provenance trail assert something that did not happen and erased
    the evidence of the rename that the next record was written to document. Instead the
    schema gained vocabulary for supersession, which also closes the hole for any future
    rename rather than just this one.

    Changes:
    - src/dismech/schema/history.yaml: new optional HistoryTarget.superseded_by slot and
      HistoryTargetSupersession class (slug and path required via slot_usage, optional
      free-text reason).
    - tests/test_history_schema.py: factored the layout check into a _layout_errors helper.
      A missing target.path is accepted only when target.superseded_by.path resolves to an
      existing file; an ordinary missing target still fails loudly. The record-directory
      check now follows the successor slug, so all sessions for one entry stay together.
      Added unit tests for the accept/reject paths, schema validation of a superseded_by
      block, and rejection of a superseded_by block missing slug/path.
    - history/disorders/Arthrogryposis-Renal_Dysfunction-Cholestasis_Syndrome/2026-08-02T020640Z-claude-code-c4868b.yaml:
      backfilled superseded_by pointing at the ARC entry, with the retarget rationale in
      reason. Its original target.slug/path are untouched.
    - scripts/new_history.py: target_missing_warning() warns on stderr when scaffolding a
      record whose target path does not exist yet, catching a bad slug at authoring time
      instead of on main. It warns rather than refuses, since scaffolding ahead of creating
      an entry is legitimate.
    - docs/history.md: new "Renamed or retargeted targets" section documenting the
      append-only rationale and the superseded_by shape.

    Validation: tests/test_history_schema.py passes (20 tests), including
    test_committed_history_records_follow_layout; all 3116 committed history records
    validate against the updated schema.

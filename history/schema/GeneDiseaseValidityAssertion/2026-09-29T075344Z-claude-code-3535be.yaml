events:
- type: EDIT
  outcome: changed
  summary: Add Genetic.gene_disease_validity (attributed external validity tiers)
  details: |
    Added Genetic.gene_disease_validity, a multivalued list of GeneDiseaseValidityAssertion (validity_classification, classified_by, external_id, subtype, evidence, notes), with two new enums: GeneDiseaseValidityClassificationEnum (the eight GenCC harmonised tiers in current use, each annotated with its GENCC:1000xx CURIE read from the GenCC submissions export on 2026-09-23; GENCC:100007 has no submissions and has no value) and GeneDiseaseValiditySourceEnum (ClinGen, G2P, Orphanet, the two PanelApp instances, other GenCC submitter; each annotated with its GENCC:0001xx submitter CURIE). classified_by is required and has no curator/dismech value, so a tier is always attributed to the body that assigned it. Additive only: relationship_type and GeneDiseaseRelationshipEnum are unchanged, and no existing entry changes meaning. Population is deterministic for ClinGen via scripts/check_gene_validity.py (just check-gene-validity / list-gene-validity), which compares recorded ClinGen tiers with the cached CGGV: record and lists backfill candidates; generated datamodels were not regenerated, following recent schema PRs (they already lag the schema).

- type: EDIT
  outcome: changed
  summary: 'Review round 1: attribute ClinGen assertions per record; subtype FK check'
  details: |
    Addressed the first automated review of PR #13139. (1) check_gene_validity.py attributed every cited CGGV assertion to every genetic[] record for the same gene, so an entry with a causative and a susceptibility row for one gene got the ClinGen tier offered for both (Zlotogora-Ogur_Syndrome, NECTIN1), and 28 whole-KB rows were exact duplicates. Assertions are now attributed to the record(s) whose own subtree cites them; an assertion cited only outside genetic[] goes to the gene's record when it has exactly one, and is otherwise reported once as the new unplaced class. Findings carry the record name, and the TSV gains a record column. Counts moved from 610 to 576 backfill and 200 to 193 other_disease, with 3 unplaced and 0 duplicate rows. (2) tests/test_data.py check_subtype_foreign_keys now checks genetic[].gene_disease_validity[].subtype, including on entries with no has_subtypes; the whole KB passes. (3) Added descriptions for the G2P, Orphanet and PanelApp source values, and a comment recording that overstated deliberately ignores mode of inheritance.

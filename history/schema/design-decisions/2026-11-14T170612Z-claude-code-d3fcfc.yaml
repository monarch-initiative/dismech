  summary: Record that natural menopause and perimenopause are a life stage, not an
    entry
  details: |
    Added section 19 to the decision register: natural menopause and the perimenopausal transition are not dismech entries. What is curated instead is the oestrogen-withdrawal mechanism as a module, the disorders of the transition (vasomotor symptoms, genitourinary syndrome of menopause, postmenopausal osteoporosis), and the existing premature/primary ovarian insufficiency entries. The section states where a menopause fact goes in each situation, as a table keyed on the fact being recorded rather than on the slot.

    Every claim was verified in this session rather than taken from the task description, and two of them had to be corrected in the process. The 'should not be used for direct annotation' text on GO:0042697 is the term's rdfs:comment, not its textual definition: the IAO:0000115 definition is 'Cessation of menstruation, occurring in (e.g.) the human female usually around the age of 50.' OLS4's v2 definition array happens to return both strings, which is what makes the two easy to conflate. GO:0022601 menstrual cycle phase carries the same comment verbatim, so it is GO's standard phase-term boilerplate rather than something specific to menopause. The MONDO claim also needed narrowing: searches for menopause and menopausal return hits that match on a synonym or definition, so the section says only that four classes carry the word in their label and names the fourth (MONDO:0017379).

    Verified: GO:0042697 parents GO:0022601 and GO:1990636, both under GO:0044848 biological phase; QuickGO returns zero annotations for GO:0042697 and zero for GO:1990636. MONDO searches for perimenopause and climacteric return nothing at all, and none for vasomotor symptom or hot flash returns a class labelled for either. HP:0040406 Perimenopausal sits under HP:0032443 Past medical history, not under HP:0000118 Phenotypic abnormality, while HP:0033840 Postmenopausal bleeding and HP:0031217 Hot flashes do sit under Phenotypic abnormality, and HP:6000314 / HP:6000315 sit under HP:0003674 Onset. None of MONDO:0008159, MONDO:0001410 or MONDO:0001119 is bound anywhere in kb/, so the three disorders named as in scope are uncurated and the section says so; HP:0031217 is bound in one entry and HP:0033840 in four. CurationStub.mondo_id is required and an identifier, so the queue cannot hold an OUT_OF_SCOPE stub for a concept MONDO has no term for, which is why the register is the only available home.

    The current-state survey was computed over kb/disorders/ rather than estimated: 75 entries mention menopause, 64 only in prose, 11 in a named slot. Osteoporosis falls in the prose group because its environmental record is named Estrogen Deficiency and binds ECTO:9000010 with modifier DECREASED, which is the pattern the section recommends - the entry doing it correctly is the one with no menopause string in a structured slot.

    Not verified: whether ICD-11 has a Foundation entity for symptomatic menopause. cache/icd11f/terms.csv holds no menopause row, icd11f is routed to a local SQLite build that was not downloaded under this session's disk budget, and the WHO API needs credentials. The section therefore describes the ICD-anchored route by its dismech precedent (Ageing_Associated_Decline_in_Intrinsic_Capacity, which carries no disease_term and only an icd11f:835503193 exactMatch) and states what would justify taking it, without asserting that a specific ICD entity exists.

    No KB entry, schema slot or binding changed. The companion commit adds PERIMENOPAUSAL and POSTMENOPAUSAL to OnsetEnum, which the section's last table row names.

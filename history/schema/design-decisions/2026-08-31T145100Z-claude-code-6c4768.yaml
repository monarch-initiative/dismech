- type: GENERAL
  outcome: changed
  summary: File computed-index representation gap in the decision register
  details: |
    Filed the recurring representation question from the aging-biomarker curation into the decision register as a section 12 Gaps row, and cross-referenced it from the two module knowledge gaps that raise it plus CLAUDE.md. The substantive finding is that what earlier notes called one absence is two, and merging them would produce the wrong schema: computed indices over measurements (epigenetic clock, composite biomarker panel, frailty index) are fitted estimators whose output is a number and which are not analytes; composite clinical outcome endpoints (disability-free survival, multimorbidity count) are outcomes rather than measurements, and are the thing a candidate surrogate is surrogate for. The frailty index straddles both, which is why it looks like one problem from a distance. Verified that nothing existing covers either: SeverityTier and severity_scale are a threshold-label pair on a model variable rather than an estimator, and computational_models means mechanistic simulation. Three candidate shapes are named and none worked through, since picking one is a maintainer call. The row also records the NCIT sub-gap and the interim binding convention, so the next curator does not rederive it. No schema or KB semantics changed. Validation: just validate on both touched modules with 29/29 and 16/16 snippets verified, validate-terms, check-entity-refs and check-duplicate-keys pass; 47 docs/nav/CLAUDE.md tests pass; relative markdown links in the register and CLAUDE.md resolve.

  summary: Correct the mapping-predicate direction in section 19 and settle two of
    its open questions
  details: |
    Review round on PR 17805, blocking finding 1: section 19 said MONDO:0001410 postmenopausal atrophic vaginitis is 'the nearest and narrower anchor, so section 3a's convention for a stratum without its own class - anchor the parent with skos:broadMatch - is the model', which is wrong in direction and contradicted the entry it governs, which records skos:narrowMatch. Replaced that with the direction rule stated explicitly, citing section 3e's 'The predicate direction, stated once' as the single source for the subject-to-object reading rather than re-deriving it: where the anchored class is broader the entry records broadMatch (section 3a's case), where it is narrower the entry records narrowMatch (this case), and section 3e's note that narrowMatch is a legacy spelling applies to the first case only. Also: the three disorders are no longer uncurated, so 'None is curated as of 2026-11-14' is replaced; the postmenopausal-osteoporosis open question is settled as a has_subtypes stratum of Osteoporosis with the reason recorded (it shares the parent's whole downstream chain and first-line therapy, and what is specific to it is the driver and the timing, which a subtype row plus progression phases carry); the vasomotor MONDO-term-request question is settled as warranted, leaving the unfiled state of two requests as the open item; the 'Current state' census is marked as the snapshot taken before this decision's own curation landed and the Osteoporosis sentence in it is corrected, since that entry now carries the stage in named slots; and the first two rows of the 'Where a menopause fact goes' table now say to point an exposure link at the receptor node where the entry carries one, and name that node as the module conformance target. Dropped the clause saying HP:0031217 is bound in one entry, which the new vasomotor entry makes stale. Could not verify: the 75/64/11 entry counts were not recomputed, because the method behind them is not recorded; they are labelled as a pre-curation snapshot instead of being restated as current.

- type: EDIT
  outcome: changed
  summary: Make EvidenceItem.reference_title required
  details: |
    EvidenceItem.reference_title changes from recommended to required.

    This is the second stage of a two-stage narrowing. The first stage (#15612) backfilled 520 missing titles from references_cache/ and made scripts/find_missing_reference_titles.py a whole-repo CI gate, so new gaps failed before merge. The gate has held kb/ at zero since.

    The last three title-less cache files were whole-book PubMed records (PMID:23304742, AHRQ CER 86; PMID:25695122, IOM ME/CFS report; PMID:31909928, NICE cannabis-based medicinal products guideline). PubMed's eSummary leaves Title empty for a whole book, so the fetcher cached them without one. linkml-reference-validator#167 reads the title from the BookDocument's BookTitle instead; dismech already pins a release containing it (>=0.8.0). The three caches were re-fetched with --force, and the two evidence items citing PMID:23304742 (Restless_Legs_Syndrome, dopamine_receptor_agonism) were backfilled from them.

    Also filled: five top-level references: titles in TOP2B-Related_Immunodeficiency_and_Congenital_Anomalies_Spectrum, and 97 titles in the tests/data/valid example fixture, which linkml-run-examples validates against the schema. All copied verbatim from the cache by scripts/backfill_reference_titles.py.

    Not changed: src/dismech/datamodel/ (the committed generated models already differ from a fresh regeneration by ~290 lines of unrelated drift, and nothing imports them); examples/gene_term_example.yaml (cites the placeholder PMID:12345678, which has no cache file); two YAML artifacts under docs/reports/senescent-cell-representation/ (snapshots belonging to a dated report).

events:
- type: EDIT
  outcome: changed
  summary: Add Treatment.effect_modifiers (heterogeneity of treatment effect)
  details: |
    Added an optional multivalued slot Treatment.effect_modifiers, range TreatmentEffectModifier, with required effect_modifier_type (EffectModifierTypeEnum), stratum, modified_outcome and effect_in_stratum (EffectModificationDirectionEnum), and optional comparator_stratum, modification_analysis (EffectModificationAnalysisEnum), interaction_tested, description, evidence and notes.

    Motivation: the Sarcopenia resistance-training curation found age, sex, menopausal-status and baseline-function differences in effect, two of them pointing in opposite directions. These had no structured home and could only be written into the treatment description. A GitHub issue search and docs/explanation/design-decisions.md showed no prior proposal or decision. The existing Demographics class (sex and age_range on AssociationSignal) covers stratification of a comorbidity signal, not of a treatment effect, and has no direction or analysis-basis fields.

    The change is additive and optional, so no in-flight PR is invalidated. Population rules are in CLAUDE.md under 'Treatment Effect Differs by Subgroup'. The disorder template renders the block on treatment cards. Tests: tests/test_treatment_effect_modifier_schema.py. The generated datamodel (src/dismech/datamodel) was not regenerated in this change: main's committed copy already lags several earlier schema changes, and gen-python runs before the test lanes. KGX and tabular exports do not carry the slot yet.

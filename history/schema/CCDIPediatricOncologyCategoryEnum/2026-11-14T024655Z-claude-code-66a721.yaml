events:
- type: EDIT
  outcome: changed
  summary: Add the CCDI pediatric oncology diagnosis group classification axis
  details: |
    Added classifications/ccdi_pediatric_oncology.yaml (CCDIPediatricOncologyCategoryEnum, the 31 permissible values of caDSR CDE 16607972 with the NCIt concepts caDSR binds them to), the CCDIPediatricOncologyAssignment class and the optional single-valued slot ccdi_pediatric_oncology_category on DiseaseClassifications. Additive: no existing entry is invalidated. Population is computed by just ccdi-pediatric-oncology-audit (MONDO term, NCIT cross-reference, NCIt is_a ancestors, most specific value). Known limits: NCIt places some tumors outside the concept a clinician would expect (Wilms Tumor is not a Kidney Neoplasm), and strict subsumption also proposes values for adult-predominant entries. The generated datamodel under src/dismech/datamodel was not regenerated.

  summary: Add MICRO_CT to ImagingModalityEnum and IMAGING to DatasetTypeEnum
  details: |
    Added two permissible values so image-based morphometry has a home in the schema.

    DatasetTypeEnum gained IMAGING for image collections and image-derived
    morphometric datasets (IMPC embryo imaging series, IDR, TCIA); the enum had been
    omics-only, so no imaging dataset could be recorded in a datasets: block.

    ImagingModalityEnum gained MICRO_CT, scoped to in-vivo micrometer-resolution CT
    (live small-animal scanning, human HR-pQCT of bone microarchitecture) so it stays
    inside the in-vivo boundary that design decision 9 draws for ImagingFinding. The
    review of PR 12008 caught that the first draft described ex vivo diceCT of fixed
    embryos, which is the HistopathologyFinding side of that boundary; the ex vivo
    case is now recorded in the value's comments as an ExperimentalReadout matter,
    not an ImagingFinding. The value carries no NCIT meaning: none of the 28 children
    of NCIT:C17204 Computed Tomography names micro-CT, and the nearest labels are
    High Resolution Computed Tomography and High Resolution Peripheral Quantitative
    Computed Tomography (NCIT:C169101). MMO:0000570 names the concept exactly and is
    recorded in comments. The enum description now says meanings bind to NCIT where a
    term exists.

    The Python datamodels were regenerated with gen-project and gen-pydantic after
    rebasing on main; the committed files had been stale against the schema since the
    OligonucleotideDetail generalization, so the regeneration also carries that
    catch-up and QuoteRoleEnum.

    Validation: linkml-validate on entries carrying imaging_findings and datasets,
    tests/test_enum_values.py and tests/test_dataset_discovery.py, validate-history.

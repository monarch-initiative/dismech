- type: EDIT
  outcome: changed
  summary: Add Subtype.derivation (SubtypeDerivation, SubtypeBoundaryEnum) and subtype
    foreign keys on TreatmentEffectModifier
  details: |
    Additive, optional change. New class SubtypeDerivation on Subtype.derivation with boundary_type (required; CATEGORICAL, CRITERIA_BASED, THRESHOLD, STATISTICAL_PARTITION), partition_method, partition_features, derivation_population, cluster_data (entity references to datasets# or computational_models#, gated by check-entity-refs), evidence and notes. TreatmentEffectModifier gains stratum_subtype and comparator_subtype, foreign keys to has_subtypes[].name checked by check_subtype_foreign_keys, and EffectModifierTypeEnum gains DISEASE_SUBTYPE. New check_subtype_derivations requires method, features and evidence on a STATISTICAL_PARTITION, forbids them on CATEGORICAL, and requires stratum_subtype on a DISEASE_SUBTYPE modifier. Motivated by curating data-driven type 2 diabetes clusters so a statistical region is not read as a natural kind.

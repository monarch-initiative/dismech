  summary: Withdraw the LOINC Part amendment; record the question as open
  details: |
    Review round 1. The amendment added to the LOINC section said a bare LOINC Part is not a candidate for biochemical[].loinc_term at all. Counted against the corpus, 64 such bindings across 38 entries are LOINC:LP Parts, so the paragraph reversed an existing practice rather than recording one, and would have made those bindings non-conforming in passing. Its worked mirror case was also wrong: it cited X-Linked_Nephrogenic_Diabetes_Insipidus's basal copeptin as a measurements slot binding LOINC:LP200145-3, but that entry carries no LOINC binding at all on main; the only place that Part is bound is Neurohypophyseal_Diabetes_Insipidus.yaml line 1052, which is a biochemical[].loinc_term and therefore a counterexample to the rule. The amendment paragraph is withdrawn and the question is recorded as an open decision in the section on decisions not yet made, citing the count and the deliberate Neurohypophyseal binding so the migration cost is visible before anyone decides. The paragraph on Part codes being absent from the release table and on paginating a KG search is kept and now stands on its own. The ReferenceRangeBand row the review found accurate is untouched.

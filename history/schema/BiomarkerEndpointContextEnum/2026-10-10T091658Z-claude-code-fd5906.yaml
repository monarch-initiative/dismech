- type: EDIT
  outcome: changed
  summary: Add REGULATORY_SURROGATE to BiomarkerEndpointContextEnum
  details: |
    BiomarkerEndpointContextEnum had CANDIDATE_SURROGATE but no value for a surrogate endpoint a regulator has accepted, so the 17 readouts carrying regulatory_endpoint_refs (15 disorder entries) were labelled PHARMACODYNAMIC, PROGNOSTIC or MONITORING. Added REGULATORY_SURROGATE (additive; no value retired), migrated all 17 readouts to it, and added test_regulatory_surrogate_context_matches_regulatory_refs, which requires the value exactly when regulatory_endpoint_refs is set. The validated versus reasonably-likely distinction that the CKD/PKD design (docs/superpowers/specs/2026-05-18-ckd-pkd-surrogacy-evidence-design.md) carried in endpoint_context (eGFR vs TKV) is preserved on the referenced FDA rows' endpoint_validation_level. src/dismech/datamodel/*.py was not regenerated: gen-python against current main produces about 6,000 lines of pre-existing drift unrelated to this change.

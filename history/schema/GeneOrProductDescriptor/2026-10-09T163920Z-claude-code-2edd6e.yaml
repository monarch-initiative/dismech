  summary: Admit NCBIGene and UniProtKB on animal and experimental model genes
  details: |
    Added GeneOrProductTerm and GeneOrProductDescriptor (HGNC for a human gene, NCBIGene or UniProtKB for a non-human one) and gave AnimalModel.genes and a new ExperimentalModel.genes that range via slot_usage. Declared the NCBIGene and UniProtKB prefixes. Routed UniProtKB through OAK's uniprot: adapter in conf/oak_config.yaml. NCBIGene is not routed (OAK's adapter returns no labels, INCATools/ontology-access-kit#914), so scripts/check_gene_namespaces.py checks NCBIGene labels against cache/ncbigene/terms.csv and gates any NCBIGene/UniProtKB binding outside a model's genes. This narrows PR 13548: the earlier EvidenceItem model_system and perturbations slots were dropped from it and left for a separate PR.

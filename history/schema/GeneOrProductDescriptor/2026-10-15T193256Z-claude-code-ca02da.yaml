events:
- type: EDIT
  outcome: changed
  summary: Model and dataset genes prefer Alliance MOD identifiers
  details: |
    Revised the model-gene namespace rule per maintainer review on #13548: a model organism's gene uses its Alliance of Genome Resources MOD identifier (MGI, RGD, ZFIN, Xenbase, FB, WB, SGD) whether the model acts on the gene or its product; NCBIGene, or UniProtKB for a gene product, is the fallback for species with no MOD; HGNC stays the namespace for human genes. Declared the seven MOD prefixes with Biolink 4.4.0 expansions. Extended GeneOrProductDescriptor to Dataset.genes, since datasets carry a structured organism and one mouse dataset already bound an MGI gene. Prefix spellings and the MOD-first order were checked against the Monarch KG API (MOD and HGNC IDs resolve as gene nodes; NCBIGene:12810 and UniProtKB:Q62507 return 404), alliance-ingest, Biolink's prefix map and GO; the order deliberately differs from Biolink id_prefixes and Translator NodeNorm, which lead with NCBIGene. scripts/check_gene_namespaces.py now checks MOD labels against cache/<prefix>/terms.csv filled from the Alliance API, gates malformed MOD IDs and fallback prefixes on MOD species, and reports hgnc genes on MOD-organism records as an advisory worklist. tests/test_gene_namespaces.py: 29 passed.

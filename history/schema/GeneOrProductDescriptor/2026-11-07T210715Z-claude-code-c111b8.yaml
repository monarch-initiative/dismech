- type: EDIT
  outcome: changed
  summary: Reject UniProtKB explicitly rather than silently ignoring it
  details: |
    Review round on #13548 (ai4c-reviewer): the NCBIGene-only change documented UniProtKB as not accepted but the checker merely stopped recognising it, so a UniProtKB binding hit the non-gating UNCHECKED_PREFIX branch on a model gene and was missed entirely elsewhere. Fixed: added REJECTED_PREFIXES = (UniProtKB,) and a gating REJECTED_PREFIX class in scripts/check_gene_namespaces.py, so a UniProtKB binding on a model/dataset gene fails with a pointer to NCBIGene and issue #16817, and a UniProtKB binding outside a model is caught by NON_HUMAN_OUTSIDE_MODEL. Added two tests. Also fixed the stale --help text that still named UniProt as a resolver, and updated the PR title and body (which described the old two-fallback design). Validation: check-gene-namespaces OK; tests/test_gene_namespaces.py 29 passed; ruff clean.

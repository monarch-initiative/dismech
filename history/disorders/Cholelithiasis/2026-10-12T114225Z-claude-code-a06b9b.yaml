  summary: 'Review round 1: repair the lithogenic chain, evidence grading and GO bindings'
  details: |
    Addresses the automated review of PR 13924.

    Pathograph. The uncited edge from Mucin-Accelerated Cholesterol Crystal Nucleation to Gallbladder Hypomotility and Bile Stasis is removed and retargeted onto Gallstone Growth in the Gallbladder. The entry's own description, and the review cited for it, say cholesterol crystal formation requires one or more of supersaturation, accelerated nucleation and hypomotility; the serial chain asserted instead that nucleation causes hypomotility, which no source states. Hypomotility is now an independent input to stone growth and its role changes from central_effector to trigger, so the three mechanisms converge where the source says they do.

    Evidence. The two snippets on the hypomotility node described gallstone risk factors and mucin gel accumulation, neither of which is impaired gallbladder emptying; they are replaced with the sentence from PMID:18992590 that names gallbladder hypomotility and bile stasis as one of the three lithogenic conditions. The Obstructive jaundice phenotype cited only an operative-timing sentence; it now carries the PMID:2187558 sentence naming biliary obstruction as a presentation, marked directness INDIRECT because no reference cited by this entry names jaundice, with the operative-timing quote kept and its explanation scoped to the management clause it does support. Every evidence_source OTHER in the file is regraded: the gallstone clinical and management reviews are HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, and the mucin binding assay quote is IN_VITRO.

    Ontology bindings. GO:0030301 cholesterol transport is dropped from the stone growth node and GO:0008206 bile acid metabolic process from the stone impaction node. Aggregation into a macroscopic stone is not transport, and impaction is a mechanical event rather than a change in bile acid metabolism. Both nodes record the searches run and why no term was bound, per the no-term-beats-a-bad-one rule. GO:0008206 is kept on the supersaturation node, where the cholesterol to bile salt ratio makes it part of the claim.

    Validation. just validate-disorders over both changed entries: 71 of 71 snippets verified, 0 issues. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-environmental-evidence, check-coarse-phenotypes, check-case-collisions, check-block-scalar-comments and check-term-cache-integrity all pass. list-disconnected-phenotypes reports 4 of 4 phenotypes causally connected.

  summary: 'Create: Cholelithiasis (MONDO:0012672)'
  details: |
    New entry curated so that kb/modules/cholelithiasis_biliary_supersaturation.yaml has a conformer: the module had none, and nominating the disease as a stub earlier in this session queued the work rather than doing it. Five pathophysiology nodes, each conforming to a module node in order: hepatic cholesterol hypersecretion and biliary supersaturation (trigger) -> mucin-accelerated crystal nucleation (amplifier) -> gallbladder hypomotility and bile stasis (central effector) -> gallstone growth (effector) -> stone impaction and biliary obstruction (consequence), which fans out to four clinical phenotypes. The edge into the impaction node is INDIRECT_UNKNOWN_INTERMEDIATES on purpose, and a KNOWLEDGE_GAP discussion attached to that node holds the unanswered question of which silent stones become symptomatic, which the natural-history review states outright is not known. Also curated: ABCG8 D19H as a RISK_FACTOR rather than a causative gene with its odds ratio, two prevalence records kept separate because one is self-reported lifetime and the other ultrasound point prevalence, laparoscopic cholecystectomy with a BYPASSES target_mechanisms link (it removes the reservoir without correcting the supersaturation), endoscopic biliary clearance, an obesity and insulin-resistance environmental link, and two progression phases. Scope is recorded in notes: this entry models the cholesterol-stone mechanism, pigment stones are a different mechanism already carried as a phenotype of Sickle_Cell_Disease and Gilberts_Syndrome, and the lump/split question between them is left open. MONDO:0012672 was chosen over MONDO:0005346 gallstones after reading both definitions. Ursodeoxycholic acid is deliberately absent with the reason stated, because neither cited management review states its indication in a quotable sentence. Every PMID was found by PubMed search in this session, fetched with just fetch-reference, and every snippet copied from the cached abstract; the ASCII >= form is used where the source prints a Unicode operator. One defect was caught by check-snippet-grading before commit and fixed: the same mucin sentence was graded MODEL_ORGANISM on the hypomotility node and OTHER on the growth node, and since evidence_source grades the publication's evidence rather than the block the quote sits in, both now read MODEL_ORGANISM with quote_role REVIEW_SYNTHESIS, the sentence reporting a lithogenic-diet result in experimental animals inside a review. Validation: just validate-disorders passed with 32/32 snippets verified and terms clean; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes and check-granularity all clean. stubs/Cholelithiasis.yaml is deleted by the same change. The module gained a mucus-secretion binding on its nucleation node, which this entry's conformance surfaced as an anchor with no comparable term.

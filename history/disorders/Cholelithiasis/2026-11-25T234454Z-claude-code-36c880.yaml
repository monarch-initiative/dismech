  summary: 'Gene-family review: ABCG8'
  details: |
    Wired the ABCG8 lithogenic-variant record into the pathograph: ABCG8 now sits on the biliary supersaturation node with ABC-type sterol transporter activity increased, citing the linkage study's conclusion that cholelithiasis in ABCG8 19H carriers is secondary to increased hepatobiliary cholesterol secretion (PMID:17626266). This is the opposite direction to the loss of transport in sitosterolemia. Added germline origin to the RISK_FACTOR record.

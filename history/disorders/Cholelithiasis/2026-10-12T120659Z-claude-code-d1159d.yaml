  summary: 'Review round 2: add the diagnosis section'
  details: |
    Addresses round 2 of the automated review of PR 13924, which recorded that this entry had no diagnosis section.

    Two records, both sourced from the management review already cited by the entry. Transabdominal ultrasonography is bound to NCIT:C71375 and quotes the sentence naming transcutaneous ultrasonography as the paramount diagnostic method; its description notes that this is also why the large asymptomatic population is detectable at all, since most of those stones are incidental findings. Endoscopic retrograde cholangiography preceded by endosonography is the second record and quotes the sentence restricting cholangiography to planned therapeutic intervention.

    The second record's diagnosis_term is bound to the generic NCIT:C15329 Surgical Procedure rather than to a cholangiography term. NCIT files endoscopic retrograde cholangiopancreatography outside the Clinical Intervention or Procedure branch that this slot is restricted to, so a more specific term would not validate; the specificity is carried in preferred_term, as the Ontology Term Contract allows, and the node records the searches run.

    No LOINC measurements are recorded. Neither record names an analyte with a decision threshold this disease owns, and a LOINC code typed rather than read from the cache would fail the committed-label test.

    Validation. just validate-disorders over all three changed entries: 109 of 109 snippets verified, 0 issues, plus the full offline gate set. The two new NCIT CURIEs were resolved by just validate-terms and their cache rows are committed with the entry.

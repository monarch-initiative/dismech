  details: |
    Follow-up session on PR #9013, responding to CI and to the ai4c-reviewer
    REQUEST_CHANGES review. No new curation content; three corrections.

    CI failure (test (3.13), head e0bd72b7). `scripts/check_folded_hyphens.py`
    failed on kb/disorders/DLG4-Related_Synaptopathy.yaml:1955: a line inside a
    folded ('>-') scalar ended in "NMDA-", so YAML folding would have produced
    "NMDA- dependent" in the rendered animal-model description. Reflowed the
    sentence so the compound stays on one line. This gate was not run before the
    first push; the full CI step list has now been walked and every gate that
    applies to this change was run locally before this push (ruff,
    check_folded_hyphens, check_snippet_length, check_title_snippets,
    check_environmental_evidence, term_cache_integrity, check_duplicate_yaml_keys,
    validate-disorders, validate-history-all, validate-terms-schema).

    Reviewer finding (IMPORTANT, accepted). The notes block asserted that
    PMID:23342049 / PMC:PMC3546964 was "not used", but the paper IS cited on the
    Impaired Glutamate Receptor Anchoring node. The citation was added during the
    pre-PR red-team pass and the notes prose, written earlier, was never updated
    — a stale provenance statement, not a content error. Fixed the prose and kept
    the citation, as the reviewer requested. The notes block now records the
    substantive point instead: the claude_code deep-research validator flagged
    this reference `off_topic`, that flag was reviewed and deliberately
    overridden after reading the paper (an off-topic flag is evidence, not a
    verdict, per CLAUDE.md), and the paper is cited because it is the cleanest
    loss-of-function test of the receptor-anchoring claim in the entry. The three
    claude_code-flagged identifiers are now triaged individually rather than
    described as a block, since they had different outcomes.

    Self-caught error during that fix: the replacement prose initially
    misattributed PMID:23342049 to "Sturgill et al."; the cached record gives
    Yudowski GA as first author. Corrected to "Yudowski et al. 2013" before
    pushing.

    Reviewer suggestion (SUGGESTION, accepted). The behavioural sleep-disturbance
    treatment used NCIT:C49236 (Therapeutic Procedure), close to the root of the
    clinical-intervention tree. Changed to NCIT:C15541 (Sleep Disorder Therapy),
    which is more specific and matches the treatment's actual scope — behavioural
    measures first-line with pharmacotherapy for refractory cases. Deliberately
    did NOT use NCIT:C157821 (Cognitive Behavior Therapy for Insomnia): the
    GeneReviews source says only "behavioral therapy may aid those who have
    insomnia", so naming CBT-I specifically would assert more than the evidence
    supports.

    Validation after these changes: `just validate` passes with "Snippets checked:
    128/128 verified against cached references"; schema and term validation clean
    (NCIT:C15541 confirmed reachable from the TreatmentTerm enum root);
    check_folded_hyphens, check_duplicate_yaml_keys, check_snippet_length,
    check_title_snippets, check_environmental_evidence and term_cache_integrity
    all pass.

  summary: 'Create: DLG4-Related Synaptopathy (MONDO:0032919 / MRD62 / SHINE syndrome)'
  details: |
    New entry for MONDO:0032919, curated under the gene-anchored clinical name
    "DLG4-related synaptopathy" (OMIM 618793 / MRD62; patient-community acronym
    SHINE) rather than the serial-numbered ontology label, following the
    GeneReviews chapter and the post-2021 literature. The OMIM/MONDO label and
    SHINE are retained as synonyms.

    Deep research. Falcon was attempted first per the skill default and failed
    with HTTP 402 (Edison account credits exhausted), so no Falcon report exists.
    Two other providers were run and both were consumed:
    research/DLG4-Related_Synaptopathy-deep-research-claude_code.md (4m22s, 13
    web searches, 26 citations) and
    research/DLG4-Related_Synaptopathy-deep-research-openscientist.md (16m55s, 13
    citations, plus HTML/PDF artifacts). `just preflight-dr` returned PASS for
    both against MONDO:0032919 (claude_code: DLG4 x61 vs next gene DLG2 x4;
    openscientist: DLG4 x52; both report OMIM 618793, matching the MONDO xref),
    so no Named Entity Confusion.

    Reference-validation triage. The claude_code report self-reported
    needs_review: true; its three flagged identifiers (DOI:10.1111/cge.14411
    malformed by a pasted URL suffix, DOI:10.1073/pnas.1517045112 unsupported
    quote, PMC:PMC3546964 off topic) are not cited in the entry. The
    deep-intronic paper behind the malformed DOI is cited instead by PMID
    (PMID:37525972), independently fetched and verified. The openscientist report
    validated clean (14/14 resolved, no unsupported quotes, no off-topic flags).
    Two provider claims were checked and rejected as out of date: claude_code
    asserted no human iPSC model exists (PMID:42462545 reports the AOUMEYi004-A
    patient line, now curated), and openscientist asserted germline mosaicism is
    undocumented (PMID:42482343 confirms paternal germline mosaicism at 3.83%
    allele fraction in sperm, now curated).

    GeneReviews baseline. PMID:37347881 ("DLG4-Related Synaptopathy") was found,
    fetched, tagged GeneReviews in the top-level references block, and mined
    across all four abstract sections (Clinical Characteristics,
    Diagnosis/Testing, Management, Genetic Counseling). Every phenotype in the
    cached abstract is represented in the entry.

    Content. Eight-node pathograph forming a single connected DAG from the DLG4
    loss-of-function trigger through impaired glutamate-receptor anchoring,
    impaired functional synapse maturation, plasticity/E-I imbalance and cortical
    network hyperexcitability to sleep-activated epileptiform encephalopathy
    (DEE-SWAS/ESES), developmental regression and the neurodevelopmental
    phenotypic output. Six nodes declare conforms_to against
    excitatory_synapse_scaffold_disruption, which previously listed DLG4 only as
    a candidate conformer. Also curated: 32 phenotypes, a genetic block plus two
    structured variants (the deep-intronic pseudoexon allele and the synonymous
    exon-9-skipping allele with confirmed paternal germline mosaicism), two
    diagnosis entries, six treatments, one imaging finding, five animal models,
    one iPSC experimental model, three differential diagnoses, a three-phase
    progression block, and three discussions (one HUMAN_MODEL_MISMATCH on
    homozygous-null-versus-human-heterozygous extrapolation, two KNOWLEDGE_GAPs
    on genotype-phenotype divergence and on the absence of any dose-restoring
    therapeutic route).

    Deliberate omissions, recorded in the entry's notes block. No datasets block:
    `just discover-datasets` returned 12 DIRECT candidates, all of which failed
    relevance triage (they matched the generic phrase "intellectual
    developmental" and concern ZMIZ1, HNRNPH2, KAT6A, UNC5C and other genes), so
    curating any of them would have been dataset-search Named Entity Confusion.
    No frequency bands beyond the six backed by a quantitative or explicit
    frequency-word quote; the per-feature percentages in the GeneReviews chapter
    body and in the DR reports are not in any cached retrievable source. gnomAD
    constraint metrics and a reported ~33% cerebellar vermis atrophy figure are
    left out of evidence for the same reason. Uncited reference caches added by
    the DR validation passes are enumerated in notes with the reason each is
    unused.

    Red-team review before PR. A subagent ran the dismech-pr-review skill against
    the draft and returned REQUEST_CHANGES with 2 CRITICAL, 8 IMPORTANT and 12
    MINOR findings. All CRITICAL and IMPORTANT findings were fixed: a
    dendritic-spine-development DECREASED modifier contradicted by the entry's
    own cited evidence was removed and replaced with two REFUTE evidence items
    recording the spine-morphology dissociation; anxiety, aggression and
    self-injurious behaviour (GeneReviews-documented, previously absent) were
    added; an uncited nonsense-mediated-decay assertion was reconciled against
    the one DLG4 allele measured directly, which escapes decay; an unsupported
    "inhibitory transmission is untouched" claim was hedged; a
    regulation-of-synaptic-plasticity DECREASED modifier inherited from the
    module template was changed to DYSREGULATED to match the enhanced-LTP
    evidence; the bundled encephalopathy-plus-regression node was split into two
    single-scale nodes because the evidence decouples them; evidence_source for
    the narrative review PMID:35457207 was made consistent (OTHER for
    interpretive statements); an explanation claiming independent confirmation of
    the 50% epilepsy frequency was corrected, since that cohort was
    epilepsy-ascertained. Most MINOR findings were also applied, including a
    derived OCCASIONAL band for marfanoid habitus, PARTIAL downgrades plus
    ascertainment caveats on the marfanoid component phenotypes, and three
    previously fetched-but-unused PMIDs (23342049, 38182567, 40444229) now
    consumed.

    Validation. `just validate` passes: schema clean, term validation clean, and
    reference validation reporting "Snippets checked: 128/128 verified against
    cached references". `just validate-disorders` (the batched, --no-full-text
    sweep CI runs) passed on this file before the review fixes and was re-run
    after them. `just check-duplicate-keys` and `just check-title-snippets` pass.
    `uv run pytest tests/test_data.py -k "conforms_to or subtype_foreign or
    unique_name or history"` passes (4209 tests). Weighted compliance 90.1%; the
    residual gap is the deliberately absent datasets block.

  summary: Add heterozygous Dlg4 mouse, patient iPSC neurons, and LTD-disruption evidence
  details: |
    Follow-up to the user's report that the deep-research report misstated the model landscape. Added Horner et al. 2018 (PMID:29237242) as a Dlg4+/- animal model: it partially recapitulates the plasticity node and fails to recapitulate the neurodevelopmental output, because heterozygous mice show enhanced learning. Added Medina et al. 2026 (PMID:42782788) patient iPSC-derived neurons as an experimental model, linked to PSD-95 haploinsufficiency and, with an upward-extrapolation caveat, to cortical network dysfunction, noting that the observed change is reduced rather than increased activity, from a single patient line with an unrelated control. Added Carlisle et al. 2008 (PMID:18936077) evidence that LTP is facilitated and LTD disrupted in PSD-95 mutants. Updated the heterozygous-versus-null discussion rationale, its two proposed experiments, and the notes on rejected report claims. After review, the notes were corrected to say the report's heterozygous-model claim was already wrong when it ran (Horner 2018 predates it), and the patient-neuron link to cortical network dysfunction now cites the results sentence for the link and keeps the authors' limitation sentence only for the LOW fidelity grade. Validated with just validate-disorders, validate-terms, count-verified-snippets (136/136) and the whole-repo offline gates. Not resolved: the two sentences the external reviewer quoted come from the claude_code deep-research report, which the disorder page embeds under References & Deep Research. That report was left unedited because it is a record of provider output, so both sentences still render on the page; fixing that needs a renderer change that shows curator caveats beside an embedded report, or a maintainer decision to retire the report. Re-running deep research would not help: a new run is saved beside the old report with a run-date suffix, and the page embeds every report for the entry.

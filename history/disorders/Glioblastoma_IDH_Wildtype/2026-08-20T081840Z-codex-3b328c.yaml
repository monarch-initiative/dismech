  summary: Add computational and digital-twin models for IDH-wildtype glioblastoma
  details: |
    Added three recent models: the repository-backed TumorTwin framework, a serial-MRI data-assimilation digital twin evaluated in a predominantly IDH-wildtype clinical cohort, and the repository-backed M4RL agent-based and machine-learning framework. Curated exact pathophysiology links, fidelity, limitations, readouts, variables, findings, evidence, repository commits, licenses, and smoke-check caveats. Added an M2-like tumor-associated-macrophage polarization node so M4RL's macrophage intervention has a direct pathograph join point as well as its downstream tumor-proliferation link. Ran a one-iteration hypothesis-enabled OpenScientist report and retained it as a research lead. Its three labeled hypotheses were not promoted because they restated established classification, a biomarker association, and treatment efficacy rather than a distinct mechanistic hypothesis.

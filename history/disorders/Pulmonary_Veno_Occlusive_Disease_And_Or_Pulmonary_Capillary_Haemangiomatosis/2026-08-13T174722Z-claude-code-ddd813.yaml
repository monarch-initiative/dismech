  summary: Link mitomycin to its named node and solvents to the shared endpoint
  details: |
    Backfill for issue #8085. Mitomycin C and chemotherapy exposure is TRIGGERS with DIRECT into Mitomycin C PKR/ISR endothelial barrier dysfunction. The node is named for the drug and states the proposed molecular route, PKR-mediated integrated stress response injuring the endothelial barrier, so drug and mechanism are already joined in the graph and the link is direct on that basis rather than on the quoted sentence. That sentence is a risk-factor list naming chemotherapy and mitomycin among environmental risk factors, reaching neither the endothelial barrier nor the stress response, so it is PARTIAL. Organic solvent exposure is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into Pulmonary venous and capillary remodeling, and it is graded below the mitomycin link for a structural reason rather than a judgement about the chemistry: this entry has a node named for mitomycin and its proposed mechanism and no equivalent node for trichloroethylene, so the solvent link points at the shared remodeling endpoint and cannot claim an intervening step the graph does not hold. That asymmetry is recorded in the link description rather than smoothed over, and it is a modelling gap someone may want to close by giving the solvent arm its own node.

  summary: 'Add ECTO exposure_term bindings (issue #8430)'
  details: |
    Checked ECTO for exposure_term bindings on two pathograph-linked environmental exposures flagged (via a human comment from caufieldjh) in issue #8430. Bound 'Organic solvent exposure' to ECTO:9000107 (exposure to solvent), with preferred_term 'exposure to organic solvent'. An earlier pass in this same PR had bound ECTO:9000530 (exposure to trichloroethene) on the stated premise that no generic organic-solvent ECTO class exists; PR review (#8447) correctly identified that premise as wrong -- ECTO:9000107 'exposure to solvent' does exist, and ECTO:9000530 is not even a descendant of it (its ancestors are organochlorine/VOC/chlorine), so the prior binding dropped the solvent semantics of this deliberately generic node rather than narrowing them. The node's own second evidence item (PMID:38232988) speaks generically of "organic solvents", supporting the broader term. Bound 'Mitomycin C and chemotherapy exposure' to ECTO:9001737 (exposure to antineoplastic agent), matching the 'chemotherapy exposure' framing in the entry description and name; ECTO has no mitomycin-specific exposure term (confirmed via OAK search) -- this binding was independently verified correct by the same review.

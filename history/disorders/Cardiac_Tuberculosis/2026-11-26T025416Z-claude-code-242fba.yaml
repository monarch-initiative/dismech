  summary: 'Review round 1: Tygerberg score, globulin phenotype, IMPI-3'
  details: |
    Responds to the first automated review of PR 18971. Added a diagnosis row for the Tygerberg clinical prediction score quoting the predictor and accuracy sentences of PMID:17121764; the abstract gives neither item weights nor the cut-off, and the notes record that secondary sources disagree on whether the cut-off is 6 or more or more than 6 without asserting either. Added a raised serum globulin phenotype bound to HP:0032311 Elevated circulating globulin concentration (looked up in OLS). The leukocyte count below 10 x 10^9/l item was not added as a phenotype: no HP term describes the absence of leukocytosis, and a normal count is not an abnormality. Added the 40 U/l ADA cut-off sentence from the same abstract to the ADA row. Regraded the ADA and Xpert meta-analyses from OTHER to HUMAN_CLINICAL. Added IMPI-3 (NCT04521803, phase 2, completed per the ClinicalTrials.gov API) with its registry hypothesis sentence. Added frequency FREQUENT on tachycardia and peripheral oedema, OCCASIONAL on constriction and pulsus paradoxus, each where a quoted snippet gives the figure; pericardial effusion was left without a frequency because 79.5% is the share presenting as effusive pericarditis, not the frequency of effusion, and it sits on the FREQUENT/VERY_FREQUENT boundary. Added an IMPI cohort baseline-table row as cohort evidence for pulsus paradoxus beside the case vignette. Changed the fibrinous node's process to acute inflammatory response (GO:0002526). Validation: validate-disorders, validate-terms, count-verified-snippets (96/96) and the listed gates passed.

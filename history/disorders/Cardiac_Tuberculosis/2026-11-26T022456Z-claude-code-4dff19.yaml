  summary: 'Create: Cardiac_Tuberculosis'
  details: |
    New entry for cardiac tuberculosis (MONDO:0000813), created from stubs/Cardiac_Tuberculosis.yaml, which is deleted. Lump/split: MONDO:0000813 has no children; pericardial tuberculosis (MONDO:0005903) is a MONDO sibling under extrapulmonary tuberculosis, so it is recorded as the dominant subtype, and myocardial tuberculosis (no MONDO term) as the second subtype, each with documented differences in presentation, diagnosis and management. Pathophysiology nodes are scoped to one subtype each with the subtypes slot. The MONDO definition (from MeSH Tuberculosis, Cardiovascular) also mentions blood vessels; vascular tuberculosis is not curated here and the scope is stated in notes. Pericarditis.yaml keeps its own tuberculous pericarditis subtype row and was not edited. Deep research: research/Cardiac_Tuberculosis-deep-research-claude_code.md (claude_code provider), used as leads only; preflight-dr returned SKIP because MONDO records no causal gene. Every snippet was checked against references_cache entries fetched with just fetch-reference (90/90 verified). Main sources: Isiguzo et al. 2020 review (PMID:31940097, full text, staging table), Mayosi 2005 review, the IMPI trial (PMID:25178809, NCT00810849) and its HIV analysis (PMID:42568159), Ntsekhe 2008 HIV and constriction cohort, Pandie 2014 and Reuter 2006 diagnostic cohorts, ADA and Xpert meta-analyses, Shenje 2015 pericardial pharmacokinetics, Michira 2015 systematic review of tuberculous myocarditis. Validation: just validate, validate-terms and count-verified-snippets passed; whole-repo gates run before commit.

  details: |
    Disorganized Thinking now binds HP:0025769 Disordered formal thought process (exact synonym Formal thought disorder) and Social Withdrawal binds HP:5200310 Diminishment of social interactions; both were previously unbound. Added Avolition (HP:0000745 Abnormal diminished volition) and Anhedonia (HP:0012154) as negative symptoms, citing the human clinical statement in PMID:11103877 (quote_role BACKGROUND; the paper is an animal-model review). No frequency is asserted for the two new phenotypes. Working Memory Deficits and Catatonia remain unbound; their notes record that runoak -i ols:hp searches for working memory, catatonia and catatonic return no terms and that HPO 2026-09-01 has no label, synonym or definition containing those words. Validated with just validate-disorders (all snippets verified).

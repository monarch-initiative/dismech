  details: |
    Round 1 of review on PR #11917 (ai4c-reviewer, APPROVED at ede7be5be with five
    non-blocking suggestions). All five addressed in one push, since
    dismiss_stale_reviews makes a follow-up commit cost a full re-review cycle.

    Taken:

    - quote_role added to five evidence items, the slot having been introduced after this
      entry was written. Three BACKGROUND: both PMID:38104575 items quote the sentence
      "Xanomeline is a dual M1 and M4-preferring muscarinic receptor agonist that does not
      block D2 dopamine receptors", which sits verbatim inside the abstract's BACKGROUND:
      section (Tier A deterministic, confirmed against the cached record); the PMID:32437573
      Flat Affect item quotes the paper's introduction restating prior work with its own
      citation marker, not the meta-analysis's finding. Two PRIMARY_RESULT, assessed at the
      same time and equally unambiguous: PMID:32437573's CONCLUSIONS sentence and
      PMID:38104575's FINDINGS endpoint result. The two PMID:1654746 OBJECTIVE rows were
      left alone, as the reviewer noted they need no action.

    - treatment_effect on the KarXT -> Cortical Muscarinic M1 Receptor Deficit link changed
      BYPASSES -> MODULATES. The reviewer is right: xanomeline agonises the very receptor
      the node names, so nothing is being routed around by an alternative pathway, which is
      what BYPASSES claims. RESTORES would be wrong in the other direction — receptor
      protein stays low. The description now records why MODULATES was chosen over both
      neighbours, so the next reader does not re-litigate it.

    - The PMID:18317461 REFUTE explanation was refuting a claim the hypothesis never makes.
      It said the item argued against "a primary, heritable lesion", but the description
      asserts primacy only; heritability appears nowhere in it. Reworded to refute what is
      actually claimed — a receptor loss with no genetic anchor is as consistent with being
      acquired or secondary as with being the initiating lesion — which is a real refutation
      of primacy. The item stays REFUTE; only its target changed.

    - GO:0014059 (regulation of dopamine secretion) + DECREASED replaced with GO:0033602
      (negative regulation of dopamine secretion) + DECREASED on the M4 node. The reviewer
      flagged the original as ambiguous between "less regulation" and "regulation downward"
      and could not check offline whether a child term existed. It does: GO:0033602, read
      from OLS rather than from memory, and it is the exact claim — M4 restraint IS negative
      regulation of dopamine secretion, and it is what decreases. Added to cache/go/terms.csv
      and the biologicalprocessterm enum cache as one row each.

    Not a code change: suggestion 1 asked for a PR-body line describing the connectivity
    floor commit, and explicitly asked NOT to split it out. Body updated; the floor stays in
    this PR.

    Also on this push: the `scope-override` label was added to #11917. The red check was not

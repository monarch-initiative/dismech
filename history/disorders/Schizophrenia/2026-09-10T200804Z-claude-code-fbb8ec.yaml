  summary: 'Rebuild the causal pathograph: fix the dangling target, connect 6 of 7
    phenotypes'
  details: |
    Follow-up to the muscarinic curation session. Auditing that work surfaced that the
    entry's pathograph was almost entirely disconnected: 7 of 11 pathophysiology nodes were
    dead ends, 6 of 7 phenotypes had no incoming causal edge, and the single phenotype-bound
    edge in the file was a dangling target.

    Root cause of the dangling edge: `Dysregulation of Dopamine Neurotransmission` pointed
    downstream at `Psychotic Symptoms`, which is not the name of anything in the entry — the
    phenotypes are Hallucinations, Delusions, and so on. Per issue #9697 this is silent: the
    entry validates, terms and snippets verify, the page renders, and the renderer draws a
    phantom red node while the real phenotypes stay disconnected. It was row 1 of 123 in
    tests/causal_target_baseline.txt.

    Replaced that one edge with two, each carrying the original PMID:35390609 snippet plus
    Kapur's aberrant-salience framework (PMID:12505794), whose single sentence distinguishes
    the two routes — hallucination as the direct experience of aberrant salience, delusion as
    the interpretive effort layered on it. Both are INDIRECT_KNOWN_INTERMEDIATES because the
    intermediate step is psychological rather than neurochemical.

    Built the cortical circuit chain that was missing, following Lisman's framework
    (PMID:18395805): Glutamatergic (NMDA hypofunction) -> GABAergic (PV interneuron
    disinhibition) -> Dopamine -> positive symptoms. The dopamine edge is deliberately hung
    off the GABAergic node rather than the glutamatergic one, because it is the disinhibition
    that leaves pyramidal cells overactive; putting it on the glutamatergic node would have
    skipped the step that makes the two nodes one circuit.

    Symptom-domain edges: glutamatergic -> Disorganized Thinking, Social Withdrawal, Flat
    Affect, on the NMDA-antagonist challenge literature (PMID:1654746 for formal thought
    disorder and emotional withdrawal, which dopaminergic psychotomimetics do not reproduce;
    PMID:32437573 meta-analysis of 725 healthy volunteers for the quantified effect). All
    INDIRECT: the argument runs from a drug that produces the phenotype in healthy people to
    the endogenous abnormality. GABAergic -> Working Memory Deficits on the
    PV/gamma/working-memory chain (PMID:29936230).

    Three nodes carried no evidence at all and were dead ends. Gave each its own citation:
    oligodendrocyte density (PMID:31653579), mitochondrial complex I/IV deficits
    (PMID:33221354), CSF/serum albumin and IgG ratios (PMID:35939296). Only the oxidative
    stress node got a downstream edge — to GABAergic, on the Gclm KO rescue plus the human
    NAC trial (PMID:34080015), which is a genuine directional argument.

    Deliberately NOT connected, each recorded rather than left as a silent omission:

    - Oligodendrocyte and Myelin Dysfunction. The obvious edge is to Disorganized Thinking,
      and the study that tested it does not support it — thought-disorder correlations did
      not survive multiple-comparison correction and severe vs mild FTD patients did not
      differ in FA (PMID:29861197). Cited as REFUTE against the edge, in the node's own
      evidence, so the absent edge reads as a finding.
    - Blood-Brain Barrier Dysfunction. The intuitive edge to complement pruning is not
      established; the same study found CSF white cell count, protein and IgG index NOT
      elevated, so the node is a subtle group-level shift and should not be read as
      asserting neuroinflammation. Recorded in notes.
    - DNA Damage Accumulation. The SETD1A paper shows DNA damage and synaptic-gene
      regulation as parallel consequences, not a chain, so no edge was drawn.
    - Catatonia. Now the only unconnected phenotype, with a KNOWLEDGE_GAP discussion
      explaining why: lorazepam response is a treatment observation rather than a
      localisation, the mechanism reviews list three unreconciled proposals, and catatonia is
      transdiagnostic. Drawing an edge from the GABAergic node would assert a localisation
      nobody has established.

    Shrank tests/causal_target_baseline.txt from 123 to 122 via
    `just update-causal-target-baseline`; the regenerated file differs from the old one by
    exactly the one removed Schizophrenia row, nothing added.

    Measured effect: phenotypes[].causal_inlink 0/7 -> 6/7; global compliance 88.8%
    (247/278) -> 91.0% (313/344). `just validate-graphs` no longer reports this entry.

    Worth recording for the general case: only ONE of the seven disconnected phenotypes was
    a dangling target. The other six were simply never wired up, which check-causal-targets
    structurally cannot see — it checks that targets resolve, not that phenotypes are
    reached. The metric that sees them, phenotypes[].causal_inlink, exists but has
    min_compliance: null.

    Validation: linkml-validate clean; validate-terms passed; 173/173 snippets verified;
    duplicate-key, entity-ref, causal-target, qualifier-term, enum-value, folded-hyphen,
    snippet-length, title-snippet, snippet-grading, reference-title and
    environmental-evidence gates all clean; validate-disorders run as the final gate.
    check-folded-hyphens caught a real defect during this session (a line ending in
    "motor-" inside a folded scalar) which was reflowed.
    New reference caches: PMID_12505794, PMID_18395805, PMID_1654746, PMID_29936230,
    PMID_29861197, PMID_31653579, PMID_32437573, PMID_33221354, PMID_34080015,
    PMID_34842777, PMID_35939296.

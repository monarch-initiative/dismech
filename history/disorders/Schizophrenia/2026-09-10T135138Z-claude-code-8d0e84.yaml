  summary: Add muscarinic M1/M4 mechanism and link xanomeline-trospium into the pathograph
  details: |
    The entry already carried a Xanomeline-Trospium (KarXT / Cobenfy) treatment, but the
    mechanism it acts on was absent from the pathograph: the treatment had no
    target_mechanisms, no therapeutic_modality, and no pathophysiology node for muscarinic
    signalling existed. The drug's whole significance is that it is antipsychotic without D2
    blockade, and the entry could not say through what.

    Added:

    - mechanistic_hypotheses: muscarinic_cholinergic_hypothesis, status EMERGING. Held at
      EMERGING rather than CANONICAL because the therapeutic arm (three placebo-controlled
      phase 3 trials, FDA approval 2024) is much stronger than the aetiological one, and the
      two do not entail each other. Four qualifications recorded in notes: the receptor
      deficit is a subgroup rather than syndrome-wide finding; MRDS could not be separated
      by CHRM1 sequence and CHRM1/CHRM4 are not among the 287+ GWAS loci; the M4/dopamine
      mechanism is rodent pharmacology; and clozapine itself lowers muscarinic availability
      by 45-79% (PMID:12799613), which makes unmedicated and postmortem designs load-bearing.
      One evidence item is deliberately REFUTE - PMID:18317461 reports that MRDS could not
      be separated by CHRM1 sequence, which argues against the deficit being a primary
      heritable lesion, in the same study that defines the subgroup.

    - pathophysiology: two nodes.
      "Cortical Muscarinic M1 Receptor Deficit" (MOLECULAR, mechanism_confidence
      PROVISIONAL, CHRM1, GO:0016907 / GO:0007213 with modifier DECREASED,
      UBERON:0009834), downstream to Working Memory Deficits with directness INDIRECT
      because the link rests on a drug response rather than on a demonstration that the
      deficit produces the impairment. Its notes record that PMID:27801890 reads the MRDS
      transcriptomic changes as lying largely upstream of the M1 receptor, which would make
      the receptor loss a readout rather than the initiating lesion - hence PROVISIONAL and
      no primary-cause claim.
      "Loss of M4 Receptor Restraint of Striatal Dopamine Release" (CELLULAR,
      mechanism_confidence HYPOTHETICAL, CHRM4, GO:0014059 DECREASED, striatum and
      substantia nigra, medium spiny neuron and cholinergic neuron), downstream to the
      existing "Dysregulation of Dopamine Neurotransmission" node. This edge is what
      connects the muscarinic axis to the canonical dopamine axis and explains how a non-D2
      drug reaches it. HYPOTHETICAL because the causal work is rodent; the human evidence is
      an inverse correlation between striatal muscarinic availability and positive symptoms
      (PMID:12505810), marked INDIRECT. The CB2 dependence reported by PMID:27618677 is
      described in notes but not asserted as a mechanism.

    - treatments: Xanomeline-Trospium gained therapeutic_modality SMALL_MOLECULE, a
      mechanism entry, dosing_interval (twice per day / 0.5 days), two target_mechanisms
      links, and the two pivotal phase 3 results (EMERGENT-2 PMID:38104575, EMERGENT-3
      PMID:38691387). The M4 link is RESTORES; the M1 link is BYPASSES, because agonist
      occupancy raises signalling through surviving receptors rather than replacing lost
      receptor protein.

    - discussions: gap_schizophrenia_mrds_stratification_of_muscarinic_response
      (KNOWLEDGE_GAP), attached to the M1 node and to the treatment. The hypothesis and the
      drug have never been joined at the level of an individual patient: MRDS is a
      postmortem construct with no in-life assay, and every KarXT trial enrolled without
      regard to muscarinic status. The proposed experiment is an M1-stratified trial, with
      would_support pointing at the M1 node and supporting/refuting outcomes stated as
      observations.

    Snippet selection note: two intended quotes from PMID:18317461 (the 26%/74% subgroup
    figure and the kernel-density sentence) both contain the radioligand notation
    [(3)H]pirenzepine, which the reference validator strips as a bracketed span before
    matching, so neither verifies. The quotes were replaced with bracket-free sentences
    carrying the same claims rather than adding a literal_bracket_patterns entry for one
    file; the numbers are stated in explanation and notes prose instead.


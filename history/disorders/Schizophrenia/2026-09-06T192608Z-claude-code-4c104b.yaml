  details: |
    Review round on PR #8622, plus resolution of a merge conflict with main.

    Blocking item 1, no pathophysiology despite the title. Added two pathophysiology nodes to Schizophrenia, connecting SETD1A to the pathograph for the first time:

    - "Reduced SETD1A H3K4 Methyltransferase Activity at Psychiatric Risk Gene Promoters", MOLECULAR, molecular_functions GO:0042800 with modifier DECREASED. Evidenced by the promoter-binding result and, separately, by the postmortem sporadic-cortex result, which is what makes this a disease mechanism rather than an annotation on rare mutation carriers.
    - "DNA Damage Accumulation in Postmitotic Neurons", CELLULAR, cell_types CL:0000540 neuron and biological_processes GO:0006974 DNA damage response with modifier INCREASED.

    Causal edges: node 1 to node 2 as DIRECT, and node 1 to the entry's existing "Abnormality of Glutamergic Signaling" node as INDIRECT_UNKNOWN_INTERMEDIATES. The glutamatergic edge is deliberately not DIRECT: the supporting result is downregulation of glutamatergic synapse genes in single-cell transcriptomes of iPSC-derived mutant neurons, which is transcriptional evidence in a model system rather than a measurement of glutamatergic transmission in patients. That edge is what joins SETD1A into the existing seven-node graph rather than leaving it a disconnected pair.

    Ontology note: GO:0051568, "histone H3-K4 methylation", is obsolete - GO retired it on the grounds that it represents a molecular function - so the intermediate "loss of H3K4 methylation at bound promoters" node the reviewer sketched has no process term to bind. Rather than manufacture a binding or leave a node unbound, the methylation claim is carried by the molecular-function node above, which is what GO's own reasoning points to. The reviewer asked for one or two nodes, not the full chain.

    Also retargeted the HUMAN_MODEL_MISMATCH discussion to attach to the new pathophysiology node in addition to genetic#SETD1A, per the review: the mismatch is about which demethylase corrects a methylation imbalance, which now has a mechanism node to attach to.

    Blocking item 2, mouse arm described as first-party. The LSD1 evidence explanation said the result was "reported by the same authors". It is not: the snippet comes from PMID:41422157's introduction summarizing Mukai et al., the paper's reference 16, from a different group. Rewrote the explanation to state the provenance, and to note that PMID:41422157 elsewhere contrasts its own CUT&Tag findings with Mukai's ChIP-seq as mouse-versus-human differences. The snippet, PMID and MODEL_ORGANISM grading were all correct and are unchanged.

    Suggestion, SCHEMA explanation reaching past its snippet. The PMID:35396579 explanation claimed SCHEMA "retains it among its ten exome-wide-significant genes", which is true but not what the quoted sentence says - the quote describes the prior state of the field. Trimmed the claim and pointed to the entry notes, which state the ten-gene fact separately.

    Retired enum values. This branch predates the supports: PARTIAL retirement and carried three, two in Bipolar_Disorder and one in Schizophrenia. Migrated all three to SUPPORT and rewrote the two explanations that argued for the retired grade, keeping their caveats as prose. The remaining PARTIAL mentions in Bipolar_Disorder prose came from main and are pre-existing, so they were left alone.

    Merge conflict. Two conflicting regions in Bipolar_Disorder, both additive: this branch added a SETD1A genetic entry and a replication knowledge gap while main added an ITIH3 entry and a 3p21.1 effector-gene gap. Kept both sides in each.

    Validation run on the merged tree: just validate passed on both files, 138/138 and 60/60 snippets verified against cached references; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-qualifier-terms all passed.

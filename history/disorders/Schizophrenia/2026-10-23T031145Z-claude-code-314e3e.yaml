  summary: Wire Schizophrenia to the D2 receptor antagonism module
  details: |
    Adds a D2/3 Receptor Blockade (Antipsychotic Target) pathophysiology node conforming to d2_receptor_antagonism#D2/3 Receptor Antagonist Occupancy, and points the existing Antipsychotic Medications treatment at it ahead of its existing Dysregulation of Dopamine Neurotransmission target. Both targets are kept because they are different claims: the dysregulation node is the presynaptic abnormality, and the cited imaging review places D2/3 blockade downstream of it, so the new node says where the drug acts rather than that blockade corrects the lesion. The node carries no downstream edge, following the treatment-anchor convention used by the beta-blockade, GLP-1 and AT1 conformers.

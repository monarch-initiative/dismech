  summary: 'Integrate assessed OpenScientist findings: dopamine locus, C4 effector
    controversy, glutamate translation gap'
  details: |
    Integration pass over the two existing codex assessments of the OpenScientist hypothesis reports for Schizophrenia (canonical_dopamine_glutamate_neurodevelopmental_model and complement_synaptic_pruning_hypothesis). No new assessment sidecars were written; both already existed.

    From the canonical model assessment: retargeted the Dysregulation of Dopamine Neurotransmission node from a mesolimbic to an associative/sensorimotor striatal locus and cited the regional PET meta-analysis (PMID:29301039); added the prospective ultra-high-risk study (PMID:21768612) as temporality-not-causality evidence; added the treatment-resistant PET comparison (PMID:23034655) as REFUTE, bounding the node to antipsychotic-responsive illness. Added the first evidence to the previously uncited Mitochondrial Dysfunction and Oxidative Stress node (PMID:40162239). Added the pivotal placebo-controlled EMERGENT-3 trial (PMID:38691387) and the M4/dopamine-release study (PMID:27618677) to the KarXT treatment, and removed the overstated non-dopaminergic-mechanism wording from its description. Added the 287-locus GWAS (PMID:35396580) and the two disagreeing single-nucleus datasets (PMID:40162239, PMID:40053590) to the canonical hypothesis entry. Corrected four overstatements in its notes: the unsupported 30 percent dopamine-normal population fraction, the claim of PV-interneuron deficits in 6/7 studies (the systematic review measured perineuronal-net density), the word refuting applied to the glutamate prediction, and excitatory-neuron causal primacy. Opened a KNOWLEDGE_GAP discussion on the glutamate pharmacology translation gap with the two negative trials (PMID:25539791, PMID:41233083) and a biomarker-stratified trial as the proposed discriminating experiment.

    From the complement assessment: added both disagreeing mouse C4-overexpression studies to the Complement-Mediated Excessive Synaptic Pruning node (PMID:41903141 SUPPORT for CR3 dependence, PMID:39227431 REFUTE for CR3 independence), rewrote the node description so the CR3 microglial-engulfment effector step reads as contested rather than settled, opened a CONTROVERSY discussion recording the disagreement, and corrected the misstatement of the Sekar effect size in the hypothesis notes.

    Deliberately not integrated: the TSPO claim (PMID:31699629) qualifies a widespread-microglial-activation model the entry never asserts; the maternal-immune-activation claim (PMID:28138113, PMID:25195065) shows no amplification of inherited C4A risk, so no causal environmental entry is warranted; REJECTED and NEEDS_VERIFICATION claims in both assessments were not integrated. All 138 snippets in the file verify against the reference cache.

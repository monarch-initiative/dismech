  summary: Evidence the previously unevidenced SETD1A record; add KDM5-vs-LSD1 HUMAN_MODEL_MISMATCH
  details: |
    Curation-scanner run for issue #6512 (preprint-scan, SETD1A). The SETD1A genetic record carried a mechanistic claim in notes with no evidence block at all; added four peer-reviewed evidence items (three from PMID:26974950 covering the genome-wide-significant association, the LoF constraint that underlies the large effect size, and the H3K4-methylation mechanism; one from SCHEMA PMID:35396579) and relationship_type RISK_FACTOR. Also added a mismatch_schizophrenia_setd1a_h3k4_demethylase_target discussion, kind HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the evidence is not absent: mouse Setd1a phenotypes are rescued by LSD1/KDM1A inhibition and explicitly NOT by KDM5, while two independent human systems (isogenic iPSC LoF neurons in PMID:41422157, and patient-derived p.Pro596Leu cells in PPR:PPR1277941) both converge on KDM5. PMID:41422157 was already cited in this entry as the publication behind dataset geo:GSE293154 but had never been used as evidence. The preprint is typed PARTIAL and its explanation states it corroborates the peer-reviewed result rather than standing alone. Validated with just validate-disorders (schema + terms + references, exit 0) and just count-verified-snippets (189/189 across both changed files).

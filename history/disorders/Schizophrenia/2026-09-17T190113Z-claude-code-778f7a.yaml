  summary: Re-apply outstanding OpenScientist findings
  details: |
    Re-applied the part of the earlier OpenScientist integration sweep (PR #12010 lineage) that did not merge, rebased onto current main rather than merged from the old branch.

    All ten outstanding citations applied, with every snippet re-derived from references_cache on disk (all ten records were absent and were fetched fresh; six came back as full text rather than the abstract the original sweep quoted, so quotes were re-verified rather than copied).

    Canonical hypothesis evidence: PMID:35396580 (SUPPORT, the 287-locus GWAS that the notes asserted uncited), PMID:40162239 and PMID:40053590 (both REFUTE, bounding the hypothesis's assignment of genetic risk to parvalbumin interneurons; the two also disagree with each other, which is the point recorded).

    Dopamine node: PMID:29301039 (SUPPORT, meta-analysis relocating the presynaptic elevation to associative and sensorimotor striatum), PMID:21768612 (SUPPORT, prospective pre-transition PET), PMID:23034655 (REFUTE, treatment-resistant patients indistinguishable from controls).

    Complement node: PMID:41903141 (SUPPORT for the CR3 arm but via decreased rather than increased microglial surveillance) and PMID:39227431 (REFUTE, CR3-independent SNX27/GluR1 route). Main's complement hypothesis notes already described this disagreement in prose without citing either paper; these ground it.

    Mitochondrial node: PMID:40162239 (SUPPORT). Explanation reworded from the original sweep's, which claimed to be the node's first citation; main has since added PMID:33221354, so the item is now framed as the distinct genetic-risk-enrichment claim rather than the postmortem enzyme-activity one.

    New discussions: gap_schizophrenia_glutamate_pharmacology_translation (KNOWLEDGE_GAP, carrying PMID:25539791 and PMID:41233083) and controversy_schizophrenia_c4_synaptic_loss_effector_mechanism (CONTROVERSY). Neither duplicates main's existing gap_schizophrenia_complement_pruning_human_causal_chain, which is about human causal ordering rather than the effector step.

    Prose corrections, all still needed against main's current text (main had rewrapped these passages but not changed their claims): five overstatements in the canonical hypothesis notes (6/7 postmortem studies measured perineuronal-net density, not PV-cell number; the ~30% dopamine-normal figure is not established and appears to transfer the prevalence of treatment resistance; glutamate trial failure bounds the therapeutic prediction for specific agents rather than refuting glutamate pathophysiology as a class; KarXT shows D2 antagonism is not required, not that the mechanism is dopamine-independent, since M4 agonism depresses striatal dopamine release; snRNA-seq cell-type prioritization is a lead, not proof of causal primacy). Also the C4A effect size in the complement hypothesis notes (Sekar reported relative risks 1.00-1.27 across four structural alleles, not an OR of 1.27 per unit of C4A expression), the dopamine node description (mesolimbic/mesocortical to associative/sensorimotor), the complement node description (effector step recorded as contested), and the KarXT treatment description (the non-dopaminergic-mechanism claim struck). The KarXT correction is now reinforced by main's own parallel curation, whose M4 node states that M4 activation depresses striatal dopamine release.

    Skipped nothing from the assigned list. Two citations the old sweep added were already on main from the parallel muscarinic curation and were correctly excluded from the assignment: PMID:38691387 (present on the KarXT treatment with a different snippet) and PMID:27618677 (present four times across the muscarinic nodes).

    Assessment sidecars for both hypotheses were already on main (openscientist-assessment-by-codex), and were used to check each correction: they independently corroborate the perineuronal-net distinction, the 30% conflation, the Sekar relative-risk range, and the context-dependence of the CR3 conflict.

    Not applied, and left for a separate change: the codex assessment also flags the canonical hypothesis description's 'all first-line drugs are D2 antagonists' as no longer accurate given KarXT. The original sweep did not correct it, and it is outside this re-application's scope.

    Verified: linkml-validate (No issues found), count-verified-snippets (184/184), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading all clean for this file.

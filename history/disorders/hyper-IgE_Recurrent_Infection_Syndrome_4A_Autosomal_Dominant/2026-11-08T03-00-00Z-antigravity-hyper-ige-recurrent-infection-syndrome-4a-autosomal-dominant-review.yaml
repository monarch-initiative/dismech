  summary: Enriched IL6ST-Related Hyper-IgE Syndrome (Autosomal Dominant) with top-level description, Harrison's classifications, pathophysiology grounding, diagnostic procedures, and treatment modalities.
  details: Added a comprehensive disorder description and Harrison's chapter classifications (IMMUNE_RHEUMATOLOGIC, GENETICS_ENVIRONMENT_DISEASE, INFECTIOUS_DISEASES) backed by PMID:32207811. Grounded gp130/IL6ST pathophysiology nodes with anatomical locations, cell types, biological processes, and molecular functions while keeping the receptor lesion node strictly molecular. Added phenotype descriptions, core diagnostic flags on hallmark HIES features, structured diagnosis entries (Serum IgE Measurement, Chest CT, Flow Cytometry, Genetic Testing), and treatment modalities, phenotype target links for co-trimoxazole prophylaxis, and inheritance-grounded genetic counseling evidence.

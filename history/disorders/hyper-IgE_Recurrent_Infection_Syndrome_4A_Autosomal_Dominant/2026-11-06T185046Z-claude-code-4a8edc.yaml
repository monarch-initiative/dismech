  summary: 'Create: IL6ST-Related Hyper-IgE Syndrome (AD, HIES4A)'
  details: |
    De novo curation of HIES4A (MONDO:0800131, OMIM 619752), autosomal-dominant hyper-IgE syndrome from heterozygous dominant-negative IL6ST (gp130) truncating variants. Deep research via Perplexity (report cited no PMIDs; founding paper found and verified independently). Curated against the full text of Beziat et al. 2020 J Exp Med (PMID:32207811), the 12-patient/8-kindred cohort. Mechanism chain: dominant-negative gp130 (GO:0004896, DECREASED; functional_impact_category DOMINANT_NEGATIVE) -> impaired IL-6 family (gp130) cytokine signaling (GO:0070102, DECREASED) -> Th2-skewed/Th17-impaired CD4 T helper response (CL:0000546, GO:0045064 INCREASED) -> elevated IgE, eczema, eosinophilia; and the signaling node -> recurrent pulmonary infection (sequelae bronchiectasis, pneumatocele), cold cutaneous abscess, sinusitis, scoliosis, retained deciduous teeth. AD inheritance (HP:0000006, full penetrance, some de novo); two representative truncating variants (p.Thr761IlefsTer29 recurrent, p.Tyr759Ter). Co-trimoxazole antibiotic prophylaxis treatment. Lump/split: distinct from the allelic recessive partial-LOF HIES4B (OMIM 618523), recessive complete-LOF STWS2 (OMIM 619751), and somatic GOF hepatocellular adenoma, all noted. All offline gates and validate-disorders pass; 19/19 snippets verified; no GeneReviews chapter exists.

  summary: 'Create: Hypertrophic Cardiomyopathy 14 (MYH6, ClinGen Disputed)'
  details: |
    Created the MYH6-attributed node of the HCM gene series as a disputed nosological entity.

    ClinGen's Hereditary Cardiovascular Disease GCEP classifies MYH6-HCM as Disputed (downgraded from Limited 2023-07-12); the entity rests on three probands in two publications with no known mechanism. The entry curates it as a real MONDO entity whose pathophysiology is an explicit hypothesis under dispute, following the precedent of Hypertrophic_Cardiomyopathy_25 (TCAP, likewise Disputed). All four pathophysiology edges are scoped to a single mechanistic_hypotheses group; the unestablished step carries a NO_EVIDENCE item rather than being asserted or silently omitted.

    Two named-entity hazards are curated explicitly rather than left as prose. First, MYH6's Definitive association is congenital heart defects, not HCM; dismech already curates MYH6 as causative in Atrial_Septal_Defect and Dilated_Cardiomyopathy_1EE and as susceptibility in Familial_Sick_Sinus_Syndrome and Hypoplastic_Left_Heart_Syndrome (verified against each file's genetic[] block — an initial draft wrongly listed Sick_Sinus_Syndrome_2 and Dilated_Cardiomyopathy_1Z, which are HCN4 and TNNC1). Second, the reference mouse HCM models carry an MYH7-derived R403Q allele knocked into mouse Myh6 because the mouse ventricle expresses alpha-MHC where the human ventricle expresses beta-MHC; ClinGen declined to score them as MYH6 evidence. That is recorded as a HUMAN_MODEL_MISMATCH discussion plus a FAILS_TO_RECAPITULATE model link, so a text search for Myh6 plus HCM does not silently become support.

    Deep research: requested falcon, which is not configured in this environment; ran with --fallback, which recorded fell_back: true and produced research/Hypertrophic_Cardiomyopathy_14-deep-research-claude_code.md. Report validation was clean (24/24 references resolved, confabulation_rate 0.0; 79/82 terms resolved, 0 named as a different term, the 3 flagged being benign paraphrases). The report converged independently on the Disputed framing and contributed PMID:39971408, the 2025 JACC ClinGen reappraisal, which supplied the clinical-reporting consequence and a diagnosis section. The reappraisal abstract gives the count of downgraded genes rather than naming them; the explanation says so and attributes MYH6's membership to the ClinGen assertion record instead.

    Primary literature came from the ClinGen evidence summary rather than the report: PMID:11815426 (Niimura 2002, founding elderly-onset variant), PMID:15998695 (Carniel 2005, Q1065H), PMID:27483260 (Rubattu 2016, MYH6 confined to the late-onset arm), PMID:6234108 (Gorza 1984, alpha-MHC is the minor ventricular isoform), PMID:8614836, PMID:10388558, PMID:33385793, PMID:34087240, PMID:35911064, plus CGGV assertions for MYH6-HCM (Disputed) and MYH6-CHD (Definitive). No datasets block: with three probands worldwide and a disputed relationship there is no disease-specific dataset, and a gene-level search would return the ASD/sick-sinus/DCM phenotypes this entry exists to distinguish itself from.

    Validation: just validate passes (schema + terms); count-verified-snippets 49/49; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-grading, check-environmental-evidence all OK; weighted compliance 94.8%. HGNC REST confirmed hgnc:7576 and the MYH6/MYH7 14q11.2 tandem pair; OLS confirmed the MONDO:0013197 OMIM:613251 xref.

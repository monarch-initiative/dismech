  summary: 'Address PR #10340 review: treatments, trials, variant genetics, pathograph
    wiring'
  details: |
    Addressed all 7 IMPORTANT and 4 of 5 SUGGESTION items from the ai4c-reviewer review of PR #10340. No correctness defects were raised.

    Added treatments (negative inotropes, cardiac myosin inhibition, septal reduction, ICD, transplantation, genetic counselling) with NCIT/CHEBI bindings reused from sibling HCM entries, and clinical_trials for EXPLORER-HCM (NCT03470545) and SEQUOIA-HCM (NCT05186818). The myosin-inhibitor treatment carries a target_mechanisms link to the alpha-MHC isoform node rather than to the MYH6 lesion, because mavacamten and aficamten inhibit beta-cardiac myosin (MYH7) — the reviewer's observation, and it lands on this entry's own isoform argument.

    Corrected the false causal edge the reviewer identified: the variant-to-isoform edge described itself as a constraint rather than a causal step, so it was removed and the isoform node now sits upstream of Altered Sarcomere Motor Function as a second, constitutive input. Wired the pathograph through to clinical manifestations with bare-name targets: remodeling to LVH and to the clinical entity, contractile dysfunction to dilation and heart failure, plus LVH sequelae to outflow obstruction and diastolic dysfunction. Sudden Cardiac Death is left deliberately unconnected with a note, because no MYH6-specific arrhythmic-substrate evidence exists and the one reported death is confounded by an MYH7 co-variant.

    Item 3 (Walsh 2016, PMID:27532257) was added but not as the reviewer characterised it, and the difference is material. The reviewer presented OR 1.06 (0.34-3.34) and etiological fraction 0.06 as answering this entry's HCM late-onset question. Checking the source, MYH6 appears only once in Table 1, at the row inside the *dilated* cardiomyopathy panel (the HCM panel runs lines 384-404, DCM 405-460); the accompanying 'highest background variation' sentence is likewise about reported contributors to DCM. The evidence is therefore recorded as REFUTE with directness INDIRECT, with the scope stated in both the explanation and the late-onset discussion, so it is not later re-read as a direct HCM burden measurement.

    Also added: variant-level record on genetic[] (p.Gln1065His, c.G3755A, rs372446459, p.Lys364fs, and the elderly-onset series allele); Holm 2011 (PMID:21378987) sick-sinus association as a NO_EVIDENCE calibration item showing what a well-supported MYH6 association looks like; ABNORMAL modifiers on GO:0016887 and GO:0051015; two new phenotypes (diastolic dysfunction, progression to dilation).

    Declined one suggestion with reasons recorded in notes: no mappings: block. DiseaseMappings offers only mondo/ncit/icd10cm/icd11f, so OMIM, MEDGEN, UMLS, MESH, DOID and GARD have no slot and are recorded in notes as read from OLS. The candidate ICD-10-CM codes (I42.1/I42.2) are HCM-level rather than CMH14-level and are absent from cache/icd10cm/terms.csv, so binding one would assert an unvalidatable mapping.

    A duplicate 'evidence' key was introduced in clinical_trials[0] while adding trial evidence and was caught by just check-duplicate-keys before commit — yaml.safe_load had silently kept the last value, so the entry looked correct on inspection.

    Validation: just validate-disorders passes; count-verified-snippets 71/71; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens, check-environmental-evidence all OK; weighted compliance 96.5%, up from 94.8%.

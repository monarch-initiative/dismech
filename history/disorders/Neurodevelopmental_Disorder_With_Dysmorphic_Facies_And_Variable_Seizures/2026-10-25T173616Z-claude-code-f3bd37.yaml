  summary: 'Create: Neurodevelopmental_Disorder_With_Dysmorphic_Facies_And_Variable_Seizures'
  details: |
    New entry for EMC10-related NEDDFAS (MONDO:0031011), entry_type DISEASE
    (a single-gene autosomal recessive disorder with its own MONDO/OMIM
    concept; no subtypes). Stub deleted.

    Sources: GeneReviews chapter PMID:37319253 (abstract only, tagged
    GeneReviews) as baseline; discovery cohort PMID:33531666 (13 individuals,
    full text); follow-up cohort PMID:35684946 (10 individuals, full text);
    PMID:32869858, PMID:35124540, PMID:40150819, PMID:42362276 (case series and
    case reports); mechanism sources PMID:29242231 (EMC is a TMD insertase)
    and PMID:34414886 (EMC10 knockdown increases EMC client insertion, recorded
    as REFUTE evidence and a KNOWLEDGE_GAP discussion); mouse PMID:28696314.
    HGNC id hgnc:27609 taken from the HGNC REST API.

    Deep research: openscientist report committed with citations sidecar and
    artifacts. 12/12 references resolved, 12/12 quotes matched. The report
    lists EMC10 as HGNC:28974, which HGNC resolves to TTLL12; the KB binding
    uses hgnc:27609. The report's ordered chain asserts reduced EMC insertase
    capacity without citing the opposing CRISPRi result (PMID:34414886); the
    entry keeps the direction open. The report's secreted-EMC10 angiogenic
    branch (PMID:28931551) and fungal autophagy data (PMID:36772852) were not
    curated as disease mechanism. The report's suggested renal term
    HP:0000077 was not used; specific renal terms were bound instead.
    just preflight-dr could not run: the local MONDO build was absent and the
    disk had too little free space to fetch it. The causal gene identity was
    checked by hand (the report names EMC10 throughout).

    Frequencies were assigned only from single-cohort counts; pooled GDD/ID
    counts were not put on the narrower GDD term, and conflicting cohort
    counts (arachnodactyly, thin corpus callosum) carry no frequency.

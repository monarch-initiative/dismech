  summary: Remove unsupported VERY_FREQUENT band from the congestive heart failure
    phenotype
  details: |
    Follow-up to the review round on PR #12071, which merged the entry with frequency: VERY_FREQUENT on the congestive heart failure phenotype.

    The band is not supported by anything the entry cites. Its sole evidence item quotes PMID:31227780 reporting that a second consanguineous Iranian family 'had 2 children die in childhood from cardiac failure'. Two affected individuals in one kindred, with no denominator and no cohort, cannot yield an HPO frequency band; VERY_FREQUENT asserts 80-99% of affected individuals, a proportion no located source reports for CMD2E.

    The band is removed rather than downgraded. Picking any other band would have the same defect, because the problem is the absence of a denominator rather than the choice of tier. A phenotype notes: block records the reasoning and names the band that was there, so the next curator does not re-derive it from the same sentence.

    The evidence item, description and HP:0001635 binding are unchanged: heart failure in these patients is well attested, and only the claim about how many of them have it was not.

    No other record in the entry was touched. The entry-level cohort-attribution note already states that each record says which denominator it carries, which remains true.

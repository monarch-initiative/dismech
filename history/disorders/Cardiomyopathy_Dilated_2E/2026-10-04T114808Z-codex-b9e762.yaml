  summary: Review recessive JPH2 cardiomyopathy using full-text clinical and mechanistic evidence
  details: 'Reviewed the full OpenScientist narrative and citation list against the cached patient reports,
    systematic review, depletion/rescue studies, current ClinGen report, full DCM GeneReviews chapter,
    and 2025 ISHLT pediatric HF guidelines. Corrected the 0.21% carrier conversion to 210 per 100,000
    and removed an inferred homozygote prevalence band and irrelevant pooled JPH2 case prevalence. The
    study LOF definition includes in-frame indels, so this is not a pathogenic carrier estimate. Distinguished
    the genotyped Iranian proband from deceased relatives without DNA. Replaced outdated semidominant
    ClinGen claims with Strong recessive validity, checked against the live March 2026 report. Removed
    assertions of universal complete protein absence, inevitable neonatal presentation and transplant
    dependence, and unsupported phenotype frequencies. Added the missing RyR2 inactivation/calcium-leak
    branch and explicit partial-model limitations. Added the confirmed recessive case conduction phenotype,
    current pediatric HF treatment evidence, and GeneReviews cascade screening/counseling. A newly retrieved
    2026 preprint reports a phased coding allele and intronic inversion disrupting the 3-prime UTR; modeled
    as a preliminary discussion, with RNA abundance separated from unproven RNA-decay mechanism. Its full
    PDF is cached, and data are available by request rather than a public accession. Content-completeness
    dimensions: phenotype coverage adequate after adding conduction disease; no additional established
    subtypes; mechanisms adequate after calcium-leak branch; treatments adequate with guideline-based
    extrapolation and no established CMD2E trial; genetics adequate with allele/validity uncertainty;
    diagnostics adequate with imaging, molecular testing, and family surveillance; high-value references
    consumed including full text; overall coverage adequate with acquired proteolytic signaling and confounded
    PKD1-associated manifestations outside established CMD2E features. PMID:41919412 in the research report
    concerns PPP1R13L, not JPH2, and was not imported. PMID:30384889 retry remained abstract-only and
    a direct publisher PDF fetch returned HTTP 403; its cohort-wide outcome figures were removed rather
    than applied to JPH2. Prior process notes were moved out of the disease narrative. Validation passed:
    validate-disorders (schema, terms, 55/55 snippets, 69 titles), history, causal/entity references,
    gene-activity grounding against origin/main, snippet length, reference titles, title snippets, ClinGen
    consistency (no conflicts; live URL-form assertion is informationally uncached by the structured-ID
    checker), GeneReviews TAGGED, qualifier terms, duplicate keys, coarse phenotype bindings, node-class
    references, reference-cache frontmatter, HTML rendering, and diff whitespace. Generated HTML is excluded
    from the commit.


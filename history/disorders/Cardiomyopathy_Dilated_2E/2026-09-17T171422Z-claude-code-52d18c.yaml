  summary: 'Create: Cardiomyopathy_Dilated_2E (MONDO:0030366, JPH2)'
  details: |
    De novo curation of MONDO:0030366, biallelic JPH2 loss-of-function dilated cardiomyopathy, as the recessive counterpart of the existing Hypertrophic_Cardiomyopathy_17. Deep research: one OpenScientist run, reference validation 17/17 resolved with 9/17 on topic. preflight-dr returned SKIP; MONDO records no causal gene for this term, which is the fourth of five entries in this run where that check could not discriminate. The most important finding is a wrong gene identifier in the report: it offered HGNC:14179 for JPH2 throughout, and HGNC:14179 is CIAO3. The correct identifier, hgnc:14202, was confirmed against the HGNC REST API and matches the stub; it is what the entry binds. Nothing in the pipeline would have caught this, because the research recipe passes --term-skip-prefix HGNC so gene CURIEs are unchecked where emitted, and just validate-terms on the KB side only checks that a CURIE's label matches that CURIE, which a wrong-but-consistent pair passes. This is the failure mode CLAUDE.md documents under 'A gene binding only has to be self-consistent', reproduced live; just list-gene-term-mismatches reports zero findings on the finished entry. Three mouse studies carry the mechanism but no animal_models block is recorded, because none of them models CMD2E: the germline null is embryonic lethal, the knockdown is an acute adult intervention, and the AAV9 gene-therapy study uses pressure overload where junctophilin-2 falls secondarily in a heart whose dyads formed normally. That last mismatch is curated as a HUMAN_MODEL_MISMATCH discussion rather than as a treatment rationale. ClinGen's curated position calls the JPH2-DCM relationship semidominant where this entry says recessive; the disagreement is quoted verbatim on the gene record and a second KNOWLEDGE_GAP asks whether heterozygous loss-of-function carriers have cardiac disease. Arrhythmia, sudden cardiac death and conduction disease were deliberately not imported, because the systematic review assigns them to the dominant missense group. Validation: just validate 24/24 snippets verified, validate-terms, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-genereviews NO_CHAPTER, list-gene-term-mismatches clean.

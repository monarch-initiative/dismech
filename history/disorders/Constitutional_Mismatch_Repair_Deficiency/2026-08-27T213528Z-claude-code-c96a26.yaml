  summary: 'Create: Constitutional Mismatch Repair Deficiency (CMMRD, MONDO:0031219)'
  details: |
    New Disease entry for constitutional mismatch repair deficiency (CMMRD), the
    biallelic-germline-MMR childhood cancer predisposition syndrome. Curated as a
    root Disease with `has_subtypes` over the four gene-defined MONDO children
    (CMMRD1/MLH1 MONDO:0010159, CMMRD2/MSH2 MONDO:0030840, CMMRD3/MSH6
    MONDO:0030841, CMMRD4/PMS2 MONDO:0030843), because the four share one mechanism
    - biallelic loss of a single MMR heterodimer component producing constitutional
    microsatellite instability - and differ in severity and age of onset rather than
    in kind.

    The load-bearing scope decision is the boundary against the existing
    `kb/disorders/Lynch_Syndrome.yaml`. The same four genes cause both diseases;
    what differs is allelic state. Lynch is monoallelic, repair stays intact until a
    somatic second hit in one epithelium, and presentation is adult-onset
    colorectal/endometrial. CMMRD is biallelic, so mismatch repair fails in every
    normal tissue from birth, and presentation is paediatric with CNS-predominant
    tumours, haematological malignancy, early gastrointestinal carcinoma and NF1-like
    pigmentary findings. Content is cross-referenced rather than duplicated: the
    shared MSI carcinogenesis chain stays in the Lynch entry, and this entry curates
    what is specific to the constitutional state (normal-tissue MMR protein loss,
    constitutional MSI as a diagnostic assay, somatic POLE/POLD1 ultra-hypermutation,
    the NF1 mimicry, and the checkpoint-blockade indication). The distinction is
    stated explicitly in the entry description, in a differential_diagnoses record,
    and on the initiating pathophysiology node.

    Sources. Deep-research lead report from Falcon (Edison Scientific),
    `research/Constitutional_Mismatch_Repair_Deficiency-deep-research-falcon.md`,
    used as a lead list only. Every cited PMID was fetched with
    `just fetch-reference` and every snippet verified against the cached record.
    Five DOI-only citations in the report were resolved to PMIDs and re-fetched so
    they would be snippet-checked rather than skipped by the DOI skip-prefix. Two
    report claims were dropped for want of a verifiable quotable source.

    NEC preflight (CLAUDE.md section 2b). `just preflight-dr` returned SKIP because
    MONDO:0031219 records no RO:0004003 causal gene - expected for a four-gene root
    term. The manual fallback was run and passed on all three anchors. Gene check:
    the report's gene mentions are PMS2=14, MSH6=12, MLH1=11, MSH2=10, the four MMR
    genes in balance with no rival gene. OMIM check: the report's OMIM IDs
    (276300/619096/619097/619101) match the MONDO OMIMPS:276300 phenotypic series
    and the four children's xrefs. Synonym check: the MONDO exact synonym
    "constitutional mismatch repair deficiency syndrome" is not a label or synonym
    of any other MONDO entity. Confusion against Lynch syndrome (MONDO:0005835) was
    the specific risk here and was checked explicitly.

    Module conformance. Four pathophysiology nodes conform to
    `genome_instability_mutation` (Genome-Maintenance Defect or Replication Stress,
    Mutator Phenotype and Chromosomal Instability, Failure of DNA Damage
    Surveillance and Repair, Accelerated Clonal Evolution) and two to
    `immune_checkpoint_blockade` (Neoantigen Generation, Adaptive Immune
    Resistance). Both PD-1 and salvage CTLA-4 treatments use the module's
    `target_mechanisms` drug pattern against the Adaptive Immune Resistance
    conformer.

    Deliberately not curated. The B-cell class-switch/somatic-hypermutation
    abnormality is recorded as a mechanism node but explicitly not as an
    immunodeficiency phenotype, with the negative cohort finding carried as a REFUTE
    evidence item on that node (PMID:30013564). WRN-helicase synthetic lethality and
    ATR inhibition are preclinical only and are not curated as treatments.

    Validation, all run and read to completion. `just validate` passed (schema
    validation, term validation, reference validation) with 96/96 snippets verified
    against cached references. `just count-verified-snippets` reported 92/92 on the
    pre-final draft and `just validate` reported 96/96 after four design-rationale
    citations were added to the proposed experiments. `just validate-terms` passed.
    `just check-duplicate-keys` clean. `just check-title-snippets` reported no new
    title-quoting snippets. `just validate-disorders` (the batched pre-PR sweep CI
    runs) passed. `just check-term-cache-integrity` and `just check-cache-order` OK
    after `just normalize-cache`. Compliance 96.5% global / 96.9% weighted.
    Foreign keys were checked directly: subtype references, all six `conforms_to`
    module-node anchors, both treatment `target_mechanisms` targets, every
    `downstream` target, and all three discussion `attaches_to` refs resolve.

    Stub queue. `stubs/Mismatch_Repair_Cancer_Syndrome_3.yaml` (MONDO:0030841) is
    retired as a SUBTYPE decision: the concept is now the CMMRD3 `has_subtypes`
    entry on this disease. There was no stub for MONDO:0031219 itself.

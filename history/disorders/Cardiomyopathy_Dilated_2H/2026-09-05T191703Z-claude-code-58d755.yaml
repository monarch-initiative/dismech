  summary: Tag the GeneReviews baseline; add genetic counselling and genetic_context
  details: |
    Response to the review on PR #10494. One blocking item, three of five suggestions taken.

    GeneReviews baseline. PMID:20301486 'Dilated Cardiomyopathy Overview' was already in references_cache and both nearest siblings tag it, but this entry did not. Now tagged in references and covered by a GeneReviews scope paragraph in notes, following the pattern in Cardiomyopathy_Dilated_2G: there is no ASNA1/GET3-specific chapter and unlikely ever to be one, the cached record is abstract_only so section-by-section mining is not possible, and no snippet is quoted from it. Two earlier reviews and I had all recorded GeneReviews as 'unverified, probably absent'; the reviewer is right that the disease-level overview is the applicable resource and that the siblings show the accepted handling.

    Running just tag-references to check the tagging modified 332 other KB files. All were reverted - only Cardiomyopathy_Dilated_2H.yaml is staged. Worth recording because that recipe rewrites the whole corpus rather than the file passed to it, so it cannot be run casually inside a curation branch.

    Suggestions taken: genetic_context on the molecular node, carrying zygosity COMPOUND_HETEROZYGOUS, variant_origin GERMLINE, functional_impact_category LOSS_OF_FUNCTION and the three-variant description, so the variant detail is queryable rather than prose-only; and a Genetic Counseling treatment, which is not a formality here - the second affected child was echocardiographed on the first day of life because of the family history, and that sentence is the evidence.

    Suggestion declined, with reasons. Heart transplantation stays out of treatments. An earlier review on this same PR examined this and concluded omitting it was correct rather than a gap: the only transplant in the primary paper is an unrelated LMNA patient transplanted at 16, and neither CMD2H patient was ever a candidate, having died at 7 weeks and 12 days. The deep-research report does describe transplantation as the definitive option for infantile DCM generally, but adding it on that basis would be asserting a therapy for this disease that its only two patients were never offered. Flagging the disagreement between the two reviews rather than silently switching.

    Congestive heart failure as a separate phenotype is also left out: the entry already carries dilated cardiomyopathy with its sequelae of tachypnea, feeding difficulties and cardiac arrest, and the source describes the course rather than diagnosing heart failure as a distinct finding, so a separate HP:0001635 node would restate what the existing chain already says.

    The PR description was stale, still describing the committed research report as the wrong-disease RPL3L one; corrected separately.

    Validation: just validate passes; 41/41 snippets verified, up from 40/40. All offline gates green, scope clean.

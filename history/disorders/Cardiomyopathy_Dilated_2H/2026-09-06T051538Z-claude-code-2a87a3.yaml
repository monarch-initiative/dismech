  details: |
    Third review round on PR #10494. Three blocking items and four suggestions; all seven addressed.

    GeneReviews. The entry tagged PMID:20301486 and mined nothing from it, justifying that on the abstract-only cache and citing Cardiomyopathy_Dilated_2G and Cardiomyopathy_Dilated_100 as precedent. The reviewer checked and CMD100 mines the same abstract-only cache in two places. The note was half wrong: CMD2G does tag without mining and is a real precedent, CMD100 is not. Both minable strings from the cached purpose statement are now quoted where they apply - the proband evaluation strategy on the exome-sequencing diagnosis entry, and the genetic risk assessment of at-risk relatives on genetic counselling - graded OTHER, matching CMD100. The note now records that the earlier conclusion was wrong rather than silently dropping it.

    Cardiac arrest was the one phenotype never named as a target, so it rendered as a disconnected node. It is now a sequela of Dilated cardiomyopathy, as a bare name.

    Histopathology. Prominent subendothelial fibrosis is bound to NCIT:C3044 Fibrosis, following Arrhythmogenic_Right_Ventricular_Cardiomyopathy. NCIT was searched for the other two findings and has nothing usable - no finding term for irregular intercalated discs, and for myofibrillar disorganization only Myofibrillar Myopathy, which is a disease. Both left unbound under no term beats a bad one, with the search recorded in notes so it is not repeated.

    Heart transplantation added, reversing a decline I made twice. My objection was that the two reported patients died at seven weeks and twelve days having never been transplant candidates, so asserting the therapy would go beyond the source. That objection was about evidence, and the repo already has a convention for exactly this case: Dilated_Cardiomyopathy_1EE and Dilated_Cardiomyopathy_1A carry Heart Transplantation with notes reading Deliberately unevidenced, no gene-specific outcomes are reported. That is the honest shape and I should have found it rather than declining twice. Bound to NCIT:C15246 Heart Transplantation, the cached term the sibling DCM entries use, not the NCIT:C15326 the research report suggested. The description says explicitly that neither patient reached candidacy and that whether transplant is reachable in GET3 disease is unknown rather than answered negatively.

    Two snippets that stopped short of a character now carry the full phrase - the QRS range through its en-dash, and the tail-anchored substrate list through all seven proteins with their identifiers. Neither truncation was folded-scalar corruption, which is the thing worth avoiding; both were just weaker quotes than the source offered.

    PLN in the substrate discussion is now marked as printed PPLA in the source, so a reader can find the string in the paper. PLN remains the correct HGNC symbol.

    The PR description was stale and said the committed deep-research report is about RPL3L. It is not - the committed artifact carries mondo_id MONDO:0859358 and zero RPL3L mentions, because the run was repeated after the recipe fix in #10696. I said in the previous round that I was updating the description and did not. Rewritten now and verified by re-reading it from the API.

    Validation: just validate passes; 43/43 snippets verified, up from 41. All per-file offline gates green. The three whole-KB snippet gates report pre-existing findings on this branch's base, none in this file.

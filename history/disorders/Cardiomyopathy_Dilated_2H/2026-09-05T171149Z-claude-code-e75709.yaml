  summary: 'Address PR #10494 review: connect the pathograph, record the erratum'
  details: |
    Response to the post-rebase review on PR #10494. Both blocking items accepted; four of five suggestions taken, bundled into one push per the answer-a-review-in-one-push convention.

    1. The pathograph was only half connected. Six of seven phenotypes had degree 0, plus the biochemical entry and one treatment. Fixed by attaching each to the parent that actually explains it rather than to whatever was nearest: tachypnea, feeding difficulties, left ventricular thrombus and prolonged QRS as sequelae of Dilated cardiomyopathy; the two septal defects from Cardiomyocyte Structural Disorganization instead, since the reviewer is right that they are a developmental malformation and not a sequela of the cardiomyopathy - both were present at birth, before ventricular function declined. Those two edges are INDIRECT_UNKNOWN_INTERMEDIATES because how loss of tail-anchored protein targeting disturbs septation is not established.

    The biochemical entry now carries a readouts block pointing at Disrupted Cardiomyocyte Membrane Trafficking and Proteostasis. The reviewer's observation that the argument was already written in prose and simply not structured was exactly right. Graded CORRELATES_WITH rather than READOUT_OF, and the evidence directness INDIRECT, because the authors present the link as possible and say explicitly that the profiles were only slightly abnormal and should not necessarily be considered pathogenic. Supportive Heart Failure Management gained target_mechanisms, which ECMO next to it already had.

    2. The erratum. PMID:32543991 is a Published Erratum on PMID:31461301, the source of roughly thirty of this entry's snippets. It was committed with empty content, cited nowhere, and yet named in an earlier history record as one of the sources the entry was built from - it contributed no snippet. Took the reviewer's preferred option and recorded it in notes: a correction exists on the sole clinical source, its content is not retrievable from PubMed so its substance has not been checked, and anyone with journal access should confirm none of the curated claims are affected. In an entry whose own lesson is provenance hazard, leaving that implicit was the wrong call.

    Suggestions taken: cardiac arrest added as a phenotype, documented in both siblings and so 2/2 in the only reported cohort; NCIT:C101295 Whole Exome Sequencing bound as diagnosis_term; a HUMAN_CLINICAL evidence item added to the contractility node, which had rested on a zebrafish snippet alone while a human sentence sat in the same file under the ASD phenotype; and that node's description unbundled, moving the mouse developmental content to where the model entry already carries it.

    Suggestion not taken: finding_term on the three histopathology entries. The reviewer notes subendothelial versus subendocardial is genuinely ambiguous in the source and that leaving it unbound may be better - agreed, and no term beats a wrong one.

    Not verified, carried forward: the reviewer could not run the GeneReviews check from their environment and asked for confirmation. CMD2H is a two-patient entity first described in 2019 and GeneReviews chapters are gene-specific with no ASNA1/GET3 entry, so a chapter is very unlikely, but I am recording this as unconfirmed rather than asserting absence.

    Validation: just validate passes; 40/40 snippets verified, up from 37/37. pytest passes on the entity-ref, causal-target, foreign-key, readout and sequelae selections (13,823 tests). All offline gates green.

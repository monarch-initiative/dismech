  summary: 'Address PR #10494 review: mine the primary full text properly'
  details: |
    Response to the automated review on PR #10494. All six blocking items accepted; all five suggestions taken. The reviewer's core criticism was correct and is the one that generalizes: the entry drew 16 snippets from a cached full text carrying several times that much modelable content, and the reason was that I had treated the deep-research report as the research artifact and, on finding it was about the wrong disease, effectively proceeded without one instead of mining the primary paper as the substitute.

    1. Phenotypes. The entry carried one phenotype for a disease with two deeply phenotyped patients. Added ventricular septal defect (2/2), atrial septal defect, tachypnea (2/2), feeding difficulties, prolonged QRS complex, and left ventricular thrombus.

    2. histopathology: section added - subendothelial fibrosis, irregular intercalated discs with increased intercellular space, and myofibrillar disorganization on desmin staining. The intercalated disc finding is marked diagnostic: the authors tie it to the same lesion in wrb-deficient models and in phospholamban disease, which makes it mechanistically specific rather than end-stage change.

    3. The paternal allele carries two variants in cis, c.867C>G p.(Cys289Trp) with c.913C>T p.(Gln305*), not one. This changes the mechanistic story because Cys289 is part of an essential zinc-binding site, so the paternal allele is doubly compromised rather than simply truncated. Also captured: no nonsense-mediated decay was found, equal wild-type and mutant transcript, which is a non-obvious negative given a premature stop codon and means the truncated protein is actually made.

    4. Both knowledge gaps claimed the evidence was silent where it is not. which_ta_substrate_drives_the_heart_phenotype said 'the current evidence does not name one' - the paper names seven cardiomyopathy-associated tail-anchored candidates and reports a partial negative, correct emerin localization, which narrows the shortlist further. That negative is curated as a REFUTE item. cardiac_selectivity_of_a_ubiquitous_chaperone now engages with the EMC alternative-insertion proposal and with the extra-cardiac deficits reported across model organisms.

    5. therapeutic_modality BEHAVIORAL on supportive heart failure management corrected to OTHER, and ECMO added as its own DEVICE treatment with target_mechanisms. It was actually administered and its failure is part of the prognosis.

    6. prevalence: and diagnosis: added. The prevalence record carries the negative large-cohort search - 70 idiopathic cardiomyopathy children and a 19,144-patient database with no further biallelic cases - which establishes genuine rarity rather than mere recency. The diagnosis entry records that a 48-gene cardiomyopathy panel was negative and the diagnosis came only from exome, which is clinically actionable.

    Suggestions taken. The bundled contractility node was split: a new TISSUE-scale node, Cardiomyocyte Structural Disorganization, now sits between the cellular trafficking node and the organ-level contractility node, which gives the histopathology a natural attachment point and removes a bare assertion from the chain. Rather than retagging the contractility node TISSUE as suggested, the split puts a real TISSUE node in and leaves contractility at ORGANISM, which seemed the better resolution of the same observation. Synonyms added. The transferrin and apolipoprotein C-III isoelectric focusing abnormality added as a biochemical entry, with notes explaining it is a readout of the entry's own trafficking node rather than an incidental result. The heterozygous p.(Val183Met) modifier candidate added as a MODIFIER genetic entry, deliberately weak: the variant is predicted benign, no second allele was found, and the authors' claim is a non-exclusion.

    Root cause of the wrong-disease report, and it is repo-wide. The reviewer traced it to the report frontmatter carrying an empty mondo_id. Checking the recipe confirms the cause is upstream of any one run: justfile hardcodes --var mondo_id= for every research-disorder invocation, so every deep-research run in this repository has been dispatched with a disease name and no identifier. That is being handled as a separate change rather than folded into a curation PR. A corrected openscientist run for this disease with --var mondo_id=MONDO:0859358 was launched and will be added when it lands.

    Validation after changes: just validate passes; 37/37 snippets verified, up from 16/16. All offline gates green. Compliance 91.2% global / 91.8% weighted.

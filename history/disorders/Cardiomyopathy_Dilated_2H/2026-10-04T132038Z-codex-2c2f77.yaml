  details: |
    Read the matching OpenScientist report and citation list against both primary cached full texts (PMID:31461301 and PMID:41370295). Across the completeness dimensions: retained observed clinical phenotypes and histology while removing unsupported frequency labels and diagnostic specificity; no established clinical subtypes; separated atomic mechanisms and marked the substrate-to-trafficking-to-heart-failure chain emerging; added pediatric guideline-based treatment and family assessment with explicit extrapolation; corrected genotype/RNA/protein interpretation and recorded the current CMD2H-specific ClinGen Limited assertion; retained mild glycosylation findings at their uncertain diagnostic strength; consumed the clinical, recombinant-protein, zebrafish and developmental/adult mouse evidence without importing unrelated RPL3L/GATAD1 literature or broad adult DCM risk statistics. Captured selective substrate changes, preserved substrate capture by the folded Val163Ala fraction, negative early cardiac ER-stress/apoptosis findings, and transient mRNA rescue. Removed the speculative heterozygous modifier from CMD2H genetics and preserved it as an LMNA-context research question. Replaced source-access/process narrative with disease content. Retrieved the full GeneReviews chapter and ISHLT 2025 guideline. Retrieved the 2020 correction through its PMC URL: it changes the licence, not scientific results. Verified GSE304685 and MassIVE MSV000100049/PXD071381; rejected the non-resolving older MSV000098765 accession printed in the methods, using current publisher/repository metadata. Refreshed the ClinGen source pin through its generator. Schema, ontology and reference validation passed with 90/90 snippets and 99 titles; all nine model links carry scales and typed limitations; ClinGen and two-dataset checks passed.

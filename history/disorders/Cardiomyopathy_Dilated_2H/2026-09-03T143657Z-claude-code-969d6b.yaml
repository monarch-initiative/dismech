  details: |
    Third round of review response on PR #10494. All four items accepted.

    1. genetic[0].notes still described a two-variant genotype after the pathophysiology description had been corrected to three. This was raised three times and is the one I most deserved to be pushed on: the file stated the genotype two different ways in two sections, and the incomplete version was in the section a reader goes to for the genotype. Worse, the omitted variant is c.867C>G p.(Cys289Trp), the one that destroys the zinc-binding site. The root cause was that my earlier fix targeted the pathophysiology description by exact string and I never re-read the genetic block; the reviewer's point that a correction applied in one place is not a correction is well taken.

    The gnomAD and constraint findings are now included, with the version caveat the reviewer supplied. The index paper cites pLI 0.92 from gnomAD v2.0.2 while current gnomAD gives a much lower value for the same gene. Both are real and the estimate moved between releases, so the entry attributes 0.92 to v2.0.2 explicitly and says the number is version-bound rather than asserting it flat. Without that, the entry would have asserted something current gnomAD contradicts.

    2. HP:0003642 'Type I transferrin isoform profile' was wrong and wrong in a specific direction. HPO defines it as the profile of a type I CDG, an N-glycan assembly defect; the paper reports a combined N- and O-linked defect and never says type I. A combined pattern is the type II Golgi-trafficking signature, so the binding pointed opposite to the entry's own argument that this is a readout of the trafficking lesion. Rebound to HP:0003160 'Abnormal isoelectric focusing of serum transferrin', which is what was actually measured.

    The notes on the same block overstated the finding. I had written 'This is not an incidental laboratory finding'; the authors say 'it is possible that' the profiles result from defective TA protein targeting and, in the same passage, that because the profiles were only slightly abnormal 'these results should not necessarily be considered pathogenic'. Rewritten to carry the authors' hedge rather than my stronger reading, and to state why the binding is the general term.

    3. myocardium was bound to UBERON:0002084 heart left ventricle on the Cardiomyocyte Structural Disorganization node - a preferred_term broader than its binding, which is backwards. Rebound to UBERON:0002349 myocardium. The same CURIE on the contractility node is correct and was left, since that node is about the left ventricle.

    4. The ASD phenotype had preferred_term 'Ostium secundum atrial septal defect' bound to the general HP:0001631. HP:0001684 Secundum atrial septal defect is a direct child and exactly the written concept. Rebound.

    Validation: just validate passes; 37/37 snippets verified. pytest passes on the animal-model, entity-ref, causal-target, foreign-key and model-readout selections (18,742 tests). All offline gates green.

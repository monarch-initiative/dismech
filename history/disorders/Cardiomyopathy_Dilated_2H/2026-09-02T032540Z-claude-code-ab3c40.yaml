  summary: 'Create: Cardiomyopathy_Dilated_2H (GET3/ASNA1)'
  details: |
    De novo curation of dilated cardiomyopathy 2H (MONDO:0859358, OMIM:620203), autosomal recessive infantile-lethal DCM caused by biallelic GET3 (ASNA1/TRC40) variants.

    The deep-research report for this entry curated the wrong disease, and nothing was taken from it. This is the most important thing to record about this session.

    openscientist was run on 'Cardiomyopathy Dilated 2H' and returned a well-structured, internally consistent report naming RPL3L as the causal gene. RPL3L appears 44 times in it; ASNA1 and GET3 appear zero times; its entire mechanism section is built on muscle-specific ribosome biogenesis, RPL3/RPL3L paralog balance, and nucleolar protein aggregation. That is CMD2D, not CMD2H.

    Resolution, verified through NCBI rather than assumed:
      CMD2H  OMIM:620203  MONDO:0859358  MedGen 1824069  gene 439  GET3   defined by Verhagen et al. 2019
      CMD2D  OMIM:619371  MONDO:0030300  MedGen 1782612  gene 6123 RPL3L  defined by Ganapathi et al. 2020
    MedGen elink from concept to gene is 1:1 in both directions, and MedGen's own definition of CMD2H cites Verhagen et al. 2019, which is PMID:31461301, the ASNA1 paper. The repository's stub queue already separates the two correctly: stubs/Cardiomyopathy_Dilated_2H.yaml carries MONDO:0859358 and stubs/Cardiomyopathy_Dilated_2D.yaml carries MONDO:0030300 with hgnc:10351 RPL3L. So the entry is right and the report is wrong.

    Why the report's own validation did not catch it. Reference validation returned 19/19 resolved, 0 unresolved, 0 off topic. That is exactly the failure mode documented in the initiate-new-disorder-creation skill: relevance is scored against the report's own vocabulary, so a report built around the wrong disease has wrong-disease vocabulary throughout and scores all of its wrong-disease citations as on topic. The only signal was a single quote-match failure, on PMID:35323613, whose text turned out to be about biallelic RPL3L variants. That one line is what prompted the check.

    The report is committed for provenance with the misidentification flagged in three places a curator would look: the entry's notes block, this history record, and the pull request body. Its RPL3L reference cache files were deliberately not staged, since they belong to a different disease. Issue filed to point the report at the CMD2D stub, where its content would actually apply.

    Entry content is therefore built entirely from primary literature identified independently of the report: PMID:31461301 (Verhagen 2019, the index sibship and the tail-anchored protein insertion assay), PMID:32543991 (its correction), and PMID:41370295 (2025 cardiomyocyte-specific Asna1 knockout mouse work).

    Pathograph: four nodes from biallelic GET3 loss of function through impaired tail-anchored protein insertion and disrupted cardiomyocyte membrane trafficking and proteostasis to impaired cardiac contractility and ventricular remodeling.

    Two animal models are curated with ModelMechanismLink readouts. The zebrafish asna1 model carries the mRNA rescue experiment, which is what discriminates the patient alleles from wild type. The mouse model pairs constitutive and inducible cardiomyocyte-restricted deletion, separating a developmental requirement from a maintenance requirement. A HUMAN_MODEL_MISMATCH discussion records that both models are effectively null while the human genotype pairs a nonsense allele with a p.(Val163Ala) missense that still produces protein, so neither model can speak to residual hypomorphic activity.

    HP:0001522 'Death in infancy' could not be used as a phenotype because it sits outside the PhenotypeTerm dynamic enum; early death is recorded through progression and clinical_burden instead.

    Validation: just validate passes (schema, terms, references); 16/16 snippets verified. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms all pass.

    No datasets: block.

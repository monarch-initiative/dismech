  summary: 'Review round 2: re-quote six unsupporting snippets, add diagnosis, histopathology,
    variants'
  details: |
    Answered the CHANGES_REQUESTED review on PR #10457 in a single push. The central finding was that six evidence items quoted one generic background sentence - portal hypertension is a major contributor to decompensation and death from liver disease - as support for specific claims about this disease's varices, ascites, haemodynamics and treatment rationale. Every one was a verbatim substring that passed the snippet verifier and none of them said what the claim above it said, while the founding paper's full text, already cached in this branch, contained disease-specific frequency-bearing sentences for all six. All six are re-quoted: the measured portal pressure of 14 mm Hg against a 5-10 normal range for the resistance node, the endoscopic confirmation of varices in seven subjects for the variceal edge and for prophylaxis, the nearly-universal frequency sentence for the varix phenotype, the recorded deaths from portal-hypertension complications for the prophylaxis rationale, and the ascites-and-encephalopathy sentence for ascites. Splenomegaly, a human phenotype graded VERY_FREQUENT, had been supported only by a mouse study, which the evidence policy forbids as sole support for a human phenotype; it now leads with the human cohort sentence and keeps the mouse result as corroboration. Thrombocytopenia and elevated transaminases were graded VERY_FREQUENT on single-proband sentences and now rest on the cohort statement. The edge from raised portal pressure to splenomegaly quoted a paper mentioning neither, and now carries the human splenomegaly sentence with directness INDIRECT and an explanation owning the inference as the curator's. Added a diagnosis section covering exome sequencing, GIMAP5 immunoblot, direct portal venography and surveillance endoscopy; the immunoblot is genuinely discriminating because every reported allele converges on absent protein, which is now curated as its own evidence item on the gene record. Added histopathology for the sinusoidal CD34 positivity and nodular regenerative hyperplasia, which is the histological correlate of the capillarization node. Expanded the variant spectrum from two alleles to five, recording that the source is internally inconsistent about one residue, giving p.L223F in text and p.L223P in the figure legend, with the text form used and the discrepancy noted. Added elevated GGT and a radiologically suspicious hepatocellular lesion as phenotypes, hedged as the source hedges it, and a progression section recording deaths from portal-hypertension complications. Corrected one evidence_source: an expression-pattern clause was graded HUMAN_CLINICAL and is now IN_VITRO, since it reports where the protein is expressed rather than a clinical observation. Declined to add the BB-DP rat model: no cached source in this entry describes it, its dominant phenotype is autoimmune diabetes rather than portal hypertension, and citing it would mean citing a paper not fetched. One NCIT term I guessed for endoscopy, C15368, turned out to be Treatment and was corrected to C16546 Endoscopic Procedure before commit. Validation: schema, terms and references clean with 72/72 snippets verified, up from 63/63; all offline gates green.

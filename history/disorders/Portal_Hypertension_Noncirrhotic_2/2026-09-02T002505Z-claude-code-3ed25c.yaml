  summary: 'Create: noncirrhotic portal hypertension 2 (GIMAP5)'
  details: |
    Curated NCPH2 / GIMAP5 deficiency from an OpenScientist deep-research report plus eight cited PubMed abstracts, one with full text. Nine-node pathograph from biallelic GIMAP5 loss of function through unrestrained CK2 activation of ceramide synthases, long-chain ceramide accumulation and cellular senescence, then dividing into a hepatic vascular arm (reduced GATA4 in liver sinusoidal endothelial cells, sinusoidal capillarization, increased intrahepatic vascular resistance, portal hypertension) and an immune arm (lymphocyte apoptosis and impaired proliferation, lymphopenia, recurrent infection, autoimmune cytopenias). The two arms are curated as independent branches because the evidence for their independence is unusually clean in both directions: endothelial-specific Gimap5 deletion reproduces the capillarization alone, and the hepatic pathology persists in mice lacking mature B, T and NK cells and cannot be transferred with marrow. That is not a modelling nicety, it is why haematopoietic transplantation is not expected to reverse established portal hypertension, so the transplantation treatment carries a SUPPORT item for the immune arm and a REFUTE item for the hepatic one, and an open discussion records the untested question of whether early transplantation changes the hepatic trajectory. The germline Gimap5 null mouse is curated with two links of opposite verdict: RECAPITULATES the lymphocyte node, FAILS_TO_RECAPITULATE the portal hypertension, because its hepatic phenotype is hepatocyte apoptosis and liver failure at a median survival of fifteen weeks rather than the vascular lesion of the human disease. A second discussion records that the CK2-ceramide pathway, presented as unifying both arms, was demonstrated only in T cells, with a proposed experiment to test whether it reaches the endothelium; this matters because CK2 and ceramide-synthase inhibitors are the leading candidate therapies. Scope is GIMAP5 only, with DGUOK-related NCPH1 as a differential; the preflight OMIM mismatch was a false alarm caused by the checker reading the gene MIM and the NCPH1 MIM while missing the hash-prefixed 619463 that the report states correctly. Report term corrections: CL:1000488, offered for liver sinusoidal endothelial cell, is cholangiocyte, so CL:1000398 is used; and two of four proposed NCIT treatment codes are wrong, with C692 for propranolol being Nimodipine and C15356 for Liver Transplantation being the Whipple Procedure, corrected to C62073 and C15271. Every other suggested identifier resolved correctly, making this report more reliable than the FEPS3 one in the same batch. During curation I attached a quote to the wrong PMID and reference validation caught it before commit; the sentence is from the case report rather than the PSVD genetics review. Nine snippets were upgraded to better quotes once full text proved available for the case report. Declined to curate endoscopic variceal ligation and portosystemic shunting for want of a suitable NCIT action term and single-patient evidence, and the GSK3 and CK2 inhibitors because they are in-vitro rescues rather than treatments. One uncited reference fetched by the research run was read, set aside and not shipped. Validation: schema, terms and references clean with 63/63 snippets verified; all offline gates green.

  summary: Map Three M syndrome to OMIMPS:273750
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS273750 contains CUL7-related 3M1 (OMIM:273750), OBSL1-related 3M2 (OMIM:612921), and CCDC8-related 3M3 (OMIM:614205), matching the three subtypes here and the three children of MONDO:0007477. The shared 3-M complex and overlapping growth-restriction syndrome support one Disease. Gene-associated severity differences and limited evidence for the rare CCDC8 form remain internal distinctions; neither normal intelligence nor one downstream growth-signaling mechanism is imposed as a universal membership criterion. This aligns the complete syndrome rather than the first numbered record or all causes of short stature.

  summary: Review 3-M syndrome mechanisms, clinical spectrum and management
  details: |
    Compared the complete matching deep-research report and citation audit with the disorder entry and primary literature. Rebuilt the mechanism graph as 15 atomic nodes, separating membrane LL5-beta targeting, cell migration and placental findings from genotype-specific GH/IGF1 responses, IGF2/H19 expression, microtubule/mitotic defects and cartilage-specific mouse findings. Removed unsupported linear causal chains, universal catalytic loss, complete penetrance, severity ranking of sparse CCDC8 cases, and radiographic age claims. Expanded to 59 phenotypes with source-specific counts, neonatal respiratory distress, developmental delay, endocrine findings and fetal histology; mined all four GeneReviews clinical/testing/management/counseling domains and added variable GH and reported IGF1 outcomes. Independent source review confirmed mechanism scope and model limitations. Schema, live ontology and reference validation passed with 151 exact snippets; GeneReviews baseline and coarse-phenotype checks passed. New and refreshed references were generated only through just fetch-reference; no manual cache editing or dataset-accession blob access.

  details: |
    New entry for ISDS Nosology 2023 group 21 rows NOS 21-0010/0020/0030, which had no dismech coverage. Deep research: claude_code provider (research/3-M_Syndrome-deep-research-claude_code.md); its reference validation reported 19/19 references resolved, 2/2 quoted claims verified, 0 off topic. NEC preflight returned SKIP because MONDO records no causal gene for MONDO:0007477, so the manual check was used instead: the report's top genes are CUL7/OBSL1/CCDC8 and its OMIM numbers are 273750/612921/614205, matching the three nosology rows exactly. The report's HGNC identifiers were wrong (it gave HGNC:16290/15738/17086, which are TRIM33, an unassigned id, and CSTF2T); all three were re-resolved against the HGNC REST API to hgnc:21024, hgnc:29092 and hgnc:25367 before use. GeneReviews (PMID:20301654) was fetched and used as the phenotype baseline; every Clinical Characteristics feature in its abstract is curated. Pathophysiology is a six-node chain from ligase-subunit loss through failed membrane assembly of the 3-M complex to the placental and growth-plate arms, with three animal models linked via modeled_mechanisms. Lumping: one entry covering all three genes, with the nosology's per-gene split preserved as has_subtypes bound to MONDO:0010117/0013039/0013627. Validation: schema clean, term validation passed, 60/60 snippets verified against cached references, entity refs and duplicate-key checks clean.

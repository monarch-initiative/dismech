  summary: Wire phenotypes into the pathograph (18/25 connected)
  details: |
    Pathograph-connectivity pass over ISDS group 21. The dismech QC plugin dismech.qc_plugins scores phenotype causal-inlink coverage: whether each phenotype node is reached by a causal edge from the mechanism graph. Across the group the baseline was 3/192 (1.6%) - the pathophysiology chains ended at organism-level consequence nodes and never reached the phenotype nodes, so almost every phenotype rendered as a disconnected node. Wired the growth, growth-plate and craniofacial-skeletal phenotypes off the placental, chondrocyte-proliferation and growth-restriction nodes. Left unwired on purpose: the soft-tissue facial features (fleshy nasal tip, thick eyebrows, long philtrum), joint hypermobility and hip dislocation, and the male genital findings - the 3-M ligase literature reaches cell migration and the GH-IGF axis but says nothing about connective tissue or genital development, so an edge there would be invention. Every added edge carries a description; where the route is inferred rather than demonstrated the description says so, and several carry causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES. Validation: just validate-disorders passes across all 15 group-21 files, 567/568 snippets verified.

  summary: 'Create: SYCP2-related spermatogenic failure'
  details: |
    New entry for spermatogenic failure 1, MONDO:0009776, curated as SYCP2-related spermatogenic failure to match the sibling SYCP3-related_spermatogenic_failure entry. Four primary references located independently in PubMed; the Perplexity deep-research report returned no PMIDs in its body and was used only for orientation. NEC preflight PASS against MONDO:0009776 with SYCP2 mentioned 235 times against 23 for the next gene. Three decisions worth recording. First, the mode of inheritance is contested in the primary literature and the entry curates both readings as separate evidence-bearing inheritance blocks plus an open KNOWLEDGE_GAP, rather than choosing a side: PMID:31866047 and PMID:39202451 report heterozygous frameshift alleles and conclude autosomal dominant, while PMID:37337432 reports a homozygous frameshift transmitted by naturally fertile heterozygous parents and concludes autosomal recessive explicitly rather than dominant. Second, the pathograph models loss-of-function variants and translocation-driven overexpression as two separate trigger nodes converging on one synaptonemal-complex node, because dosage in either direction disrupting a stoichiometric structural complex is the actual claim and a single SYCP2 dysfunction trigger would lose the overexpression route. Third, conformance to meiotic_prophase_failure is declared at Synaptonemal Complex Assembly and Spermatogenic Arrest and Non-Obstructive Azoospermia but deliberately not at the pachytene checkpoint node, because the only human histological study cited places the arrest at the zygotene stage. An evidence-metadata limitation is recorded in the notes and raised as issue 9421: the strongest available statement about this gene-disease pair is a ClinGen-framework validity classification upgraded from borderline limited-to-moderate to strong, and EvidenceItem has no slot for it. Validated with just validate for schema and terms, 24/24 snippets verified, and the offline CI gates. An initial draft carried a guessed title for PMID:39202451 which the reference-title check rejected; the title was corrected from the cached record and all four titles were then verified against the cache programmatically.

  details: |
    Addresses the blocking finding and all four non-blocking items from the ai4c-reviewer review on PR 9422. Blocking: microdissection testicular sperm extraction with ICSI added as a treatment using NCIT:C94427 cited to PMID:10374109, which was already cached, following the pattern in the sibling SYCP3-related_spermatogenic_failure entry. It carries target_mechanisms with treatment_effect BYPASSES on the Spermatogenic Failure node, because retrieval plus ICSI circumvents the failure of sperm output rather than correcting the meiotic defect, and a notes field recording that the evidence is for the procedure in non-obstructive azoospermia generally with no SYCP2-stratified retrieval rates published. Non-blocking 1: the VERY_FREQUENT band was removed from Male Infertility and replaced with an explicit statement that the observed 100% is an ascertainment artefact, since every reported individual was found through an infertility workup, and that the snippet supports the association rather than a band. Non-blocking 2: an animal_models block was added for the Sycp2 coiled-coil-domain deletion mouse, linked by modeled_mechanisms to two nodes, RECAPITULATES with HIGH fidelity on the axial-element node with an ABOLISHED readout carrying its own evidence, and PARTIALLY_RECAPITULATES with MODERATE fidelity on Spermatogenic Failure, the latter limited because the mouse phenotype is sexually dimorphic with subfertile females while the human disorder as reported is male-limited, and because the all-or-nothing mouse does not model the oligoasthenozoospermic and cryptozoospermic human presentations. Non-blocking 3: the IN_VITRO evidence quote on PMID:16717126 was trimmed to the domain-mapping sentence so it no longer carries the both in vitro and in vivo clause belonging to the companion in vivo finding. Non-blocking 4: parents aligned with the sibling entry by adding Infertility disorder and Male infertility. Revalidated: schema and terms pass, snippets rose from 24/24 to 28/28 verified, offline gates clean, zero dangling entity refs, animal-model readout target matches its link target.

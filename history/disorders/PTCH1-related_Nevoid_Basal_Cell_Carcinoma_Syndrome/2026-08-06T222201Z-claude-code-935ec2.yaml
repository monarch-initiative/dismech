  details: |
    Backfill for issue #8085. Both radiation entries target the PTCH1 loss with SMO disinhibition node as EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES. They were harmonized in response to PR review: an earlier draft graded ionizing radiation TRIGGERS and ultraviolet EXACERBATES, an asymmetry that the evidence did not carry since both rested on clinical observation. The shared verb follows from this node's semantics, since it bundles the germline variant with its somatic second hit and neither exposure can act on the germline half. The ultraviolet link now cites PMID:12007715 for UV-signature mutations in PTCH, and the ionizing item's evidence_source was corrected from OTHER to HUMAN_CLINICAL to match a sibling item quoting the identical snippet. Validated with linkml-validate and just validate-terms; the file carries two pre-existing pathograph integrity issues, confirmed identical on origin/main and left untouched.

  summary: Bind POMP molecular function for the gene-activity grounding gate
  details: |
    After merging main into PR 13809, CI's 'Check for newly ungrounded genes' gate reported POMP as wired into the pathograph with no molecular function on the node it reaches. GO has no molecular-function term for proteasome assembly chaperone activity: GO:0044183 protein folding chaperone describes folding, not complex assembly, and the assembly role is a biological process (GO:0043248, already on the proteasome insufficiency node). QuickGO lists POMP's only molecular-function annotation as GO:0005515 protein binding (IPI). Bound that term (modifier DECREASED, preferred_term 'proteasome precursor subunit binding (assembly chaperone)') on the 'Reduced POMP in Differentiating Keratinocytes' node, and said in the node description why the general term is used. Grandfathering POMP in tests/gene_activity_grounding_baseline.txt was not an option: it would put a tests/ file in a curation PR and trip the scope gate. Validation: just validate, validate-terms, the grounding gate against origin/main, and all 26 CI gates via scripts/run_ci_gates.sh passed locally.

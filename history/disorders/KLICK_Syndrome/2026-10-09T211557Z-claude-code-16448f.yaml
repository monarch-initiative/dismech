  details: |
    New entry for KLICK syndrome (MONDO:0011169), curated from a Perplexity sonar-deep-research report (research/KLICK_Syndrome-deep-research-perplexity.md; 14/14 references resolved; preflight-dr WARN only because the report cites the POMP gene MIM 613386 rather than the disease MIM 601952, POMP mentioned 29 times). Built a seven-node chain from the homozygous POMP c.-95delC 5' UTR deletion through the long-UTR transcript switch, reduced POMP, proteasome insufficiency, ER stress and defective profilaggrin processing to perturbed terminal epidermal differentiation, with all seven phenotypes causally connected. The contested autoinflammatory interpretation is a HYPOTHETICAL node carrying both SUPPORT (Takeichi & Akiyama 2020 review) and REFUTE (PRAAS2 discovery paper, same review's own caveat) evidence, plus a KNOWLEDGE_GAP discussion. Pseudoainhum is left unbound because HP:0010491 is a subclass of Amniotic constriction ring. Four KLICK case reports have no PubMed abstract (cached as unavailable) and were not quoted. Acitretin claims from web-only sources in the report were replaced by a PubMed-indexed PPK review. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (48/48), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-duplicate-keys, and validate-disorders (48 snippets, 0 issues) all passed.

  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). Extended the rapid diagnostic test row with HRP2 (LOINC:76772-3, P. falciparum antigen by rapid immunoassay; no HRP2-specific or method-less P. falciparum antigen code found) and pLDH (LOINC:53248-1, method-less) and evidence from PMID:21499691 and PMID:36085071. Added a blood film microscopy row with species identification LOINC:32206-5 and parasitaemia LOINC:53556-7, and a reference range on LOINC:53556-7 with two bands, uncomplicated hyperparasitaemia 4 to 10 percent and hyperparasitaemia of 10 percent or more as a WHO severe malaria criterion, quoted from the WHO restatement in the background of PMID:40445171 (graded OTHER, quote_role BACKGROUND), together with that series' finding that isolated hyperparasitaemia was not an independent risk factor for critical disease. Added a Plasmodium NAAT row bound to LOINC:47085-6 (by NAA with probe detection; no method-less code found). The existing parasitological diagnosis row was left unchanged.

  summary: Evidence PfEMP1/CD36/ICAM-1 cytoadherence receptor detail
  details: |
    Issue #6309 flagged that the 'Infected erythrocyte sequestration and cytoadherence' node named cytoadherence in its title without evidencing the specific receptor biology. Enriched the node description with PfEMP1 (var-gene-encoded variant surface antigen) binding to host CD36 and ICAM-1, and added a new evidence item citing PMID:21390226 (Ochola et al., PLoS ONE 2011), whose abstract directly names PfEMP1 and quantifies differential CD36 (uncomplicated malaria) vs ICAM-1 (cerebral malaria) receptor usage. Validated with just validate, count-verified-snippets, check-duplicate-keys, check-entity-refs, and check-snippet-grading.

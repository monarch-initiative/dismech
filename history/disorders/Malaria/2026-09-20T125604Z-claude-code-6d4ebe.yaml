  summary: Add severe malarial anemia mechanism node
  details: |
    Added a new pathophysiology node, 'Bystander Destruction of Uninfected Erythrocytes in Severe Malarial Anemia', addressing the content gap flagged in issue #6309 ('Severe malarial anemia has no dedicated mechanism node'). Cited PMID:10466119 (mathematical modeling of malaria-therapy patient data quantifying ~8.5 uninfected erythrocytes destroyed per parasitized erythrocyte, and ruling out dyserythropoiesis as a major contributor) and PMID:36361552 (review background sentence restating the established hemolysis/splenic-clearance mechanism, tagged quote_role: BACKGROUND). Linked the node downstream to the existing Anemia phenotype node, which previously had no causal inlink. Validated with just validate, just validate-disorders, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, and just check-qualifier-terms, all passing; 70/70 snippets verified.

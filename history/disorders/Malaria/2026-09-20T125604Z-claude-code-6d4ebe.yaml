  summary: Add severe malarial anemia mechanism node
  details: |
    Added a new pathophysiology node, 'Bystander Destruction of Uninfected Erythrocytes in Severe Malarial Anemia', addressing the content gap flagged in issue #6309 ('Severe malarial anemia has no dedicated mechanism node'). Cited PMID:10466119 (mathematical modeling of malaria-therapy patient data quantifying ~8.5 uninfected erythrocytes destroyed per parasitized erythrocyte, and ruling out dyserythropoiesis as a major contributor) and PMID:36361552 (review background sentence restating the established hemolysis/splenic-clearance mechanism, tagged quote_role: BACKGROUND). Linked the node downstream to the existing Anemia phenotype node, which previously had no causal inlink. Validated with just validate, just validate-disorders, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, and just check-qualifier-terms, all passing; 70/70 snippets verified. Review follow-up: the three PMID:10466119 items are regraded COMPUTATIONAL, since the paper is a mathematical model fitted to retrospective data (MeSH Computer Simulation, Models Theoretical) and CLAUDE.md files in-silico modelling studies there even when the inputs are clinical - which also records honestly that bystander destruction is inferred rather than observed. The node keeps its name but a notes block now states the source population: non-immune neurosyphilis patients under induced malaria therapy, adults in a single acute infection, against the predominantly pediatric endemic syndrome this file elsewhere calls severe malarial anemia. The claim that dyserythropoiesis contributes only a minor share is removed from the node description, because it is a dataset-bounded model output rather than a general finding, and a new discussions entry (ineffective_erythropoiesis_contribution, kind KNOWLEDGE_GAP) records the erythropoietic arm as unsettled, quoting the 2022 review's own conclusion and its statement that ineffective erythropoiesis and dyserythropoiesis are general features of malaria, against the 1999 model's insignificant-role verdict graded REFUTE. The PMID:36361552 item moves from quote_role BACKGROUND to REVIEW_SYNTHESIS, the citing publication being a review rather than a primary study framing its own work, and its explanation now records that the quoted clause is the concessive half of a sentence arguing the opposite. The phagocytosis postulate item gains directness INDIRECT. The notes also record that nothing upstream reaches this node, the entry having no blood-stage schizont-rupture node to hang it off. 73/73 snippets verified after the round.

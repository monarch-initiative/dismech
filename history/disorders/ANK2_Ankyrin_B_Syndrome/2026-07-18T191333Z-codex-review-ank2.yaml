  summary: Split and reframe the ANK2 cardiac arrhythmia record
  details: |
    Separated the historical cardiac ankyrin-B phenotype from the definitive
    ANK2 complex neurodevelopmental disorder. Rebuilt the cardiac entry around
    parallel ventricular calcium-handling and sinoatrial pacemaker branches,
    adding sick sinus syndrome as the strongest directly supported human
    phenotype while retaining LQT4 only as a historical synonym. Preserved
    early functional and clinical observations alongside modern LQTS and CPVT
    counterevidence. Marked those gene-disease relationships DISPUTED, removed
    unsupported frequency bands, neurodevelopmental content, generic syncope,
    and inferred beta-blocker/genetic-counseling treatments, and added
    phenotype-first diagnostic caution. Pruned the 49-item reference catalog to
    six actively cited sources. Schema, ontology-term, exact-reference,
    graph-integrity, connectivity, and compliance checks passed.

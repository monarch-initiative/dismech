  summary: 'Publication review: ANK2 cardiac ankyrin-B syndrome'
  details: |
    Full publication-readiness review of the cardiac ANK2 record. Rechecked every existing evidence pair and retained the cautious disputed LQTS/CPVT framing. Cross-checked both deep-research reports and current literature through August 2026; no disease-specific GeneReviews article was found. Added atrial fibrillation, sinus bradycardia, syncope, and sudden cardiac death with scoped human evidence; added a computational Cav1.3/reentry mechanism; added the human-tissue and mouse-supported beta-catenin/structural-remodeling cardiomyopathy branch; added variant-specific p.L1622I susceptibility evidence; and incorporated 2025 tideglusib results strictly as preclinical mouse evidence. Prolonged QT remains described as inconsistent rather than asserted as a phenotype because current expert review disputes a monogenic ANK2-LQTS relationship. Added biological-scale tags, exact snippets, ontology bindings, and pathograph links. Targeted schema, term, snippet, history, compliance, connectivity, cache-contract, and focused tests passed; the ANK2 graph was clean, while the repository-wide graph validator reported pre-existing failures in 74 unrelated disorders.

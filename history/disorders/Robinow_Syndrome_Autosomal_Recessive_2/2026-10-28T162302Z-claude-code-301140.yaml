  summary: 'Answer review of #15551: NXN-specific phenotype evidence, honest pooled-data
    explanations, remove unsupported mechanism links'
  details: |
    Added six NXN-specific phenotypes from the NXN results paragraph of PMID:35047859 (HP:0004322 short stature, HP:0000343 long philtrum, HP:0000207 triangular mouth, HP:0000164 abnormality of the dentition, HP:0030084 clinodactyly, HP:0001539 omphalocele); frequency VERY_FREQUENT is set only where four individuals were assessed, and left unset where only two were. Rewrote the mesomelia, hypertelorism and genital-hypoplasia explanations to say the figures are pooled across genotypes, and returned Genital Hypoplasia to FREQUENT, since the 93% figure covers 27 males of all genotypes. Updated the entry notes and the prevalence notes to four NXN individuals, with the PMID:35047859 sentence as evidence. Removed GO:0005515 protein binding, the DECREASED modifier on GO:0015035, the chondrocyte and skeleton annotations and the HOMOZYGOUS zygosity from the trigger node (one NXN subject carries a nonsense variant in trans with a deletion). Toned down the NXN-to-Dishevelled edge explanation to what its snippet says. Replaced the ROR2 differential evidence with two sentences on scoliosis and hemivertebrae. Removed the Genetic Counseling target_mechanisms link, pointed the Orthodontic and Supportive Care link at Genital Hypoplasia without a MODULATES effect, and restored the note that this care does not act on the signalling defect. Tagged PMID:25577943 as GeneReviews with just tag-references and dropped the ISDS classification evidence, whose snippet does not place the disorder in the nosology.

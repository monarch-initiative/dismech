  summary: 'Create: Robinow Syndrome, Autosomal Recessive 2 (NXN)'
  details: |
    Split out of the lumped Robinow_Syndrome entry, covering row NOS 15-0100. Built around the observation that makes this entity interesting: it is recessive like the ROR2 form but its phenotype clusters with the heterozygous DVL forms, so severity in this group tracks position in the cascade rather than allele dosage. The entry says so and does not model the form on ROR2 disease. Evidence base is two families and three individuals; phenotype claims drawn from syndrome-level descriptions rather than NXN patients are marked PARTIAL and their explanations say why. A genetic-counselling pitfall is recorded, that a family assumed dominant on clinical grounds would be given the wrong recurrence risk until the molecular diagnosis is made. Both connectivity metrics 100 percent.

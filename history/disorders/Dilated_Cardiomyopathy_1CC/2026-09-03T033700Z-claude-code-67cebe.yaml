  summary: 'Address review on PR #10647'
  details: |
    Addressed the three blocking findings of the ai4c-reviewer CHANGES_REQUESTED review. (1) mechanistic_hypotheses[0] description said 'Marked ESTABLISHED rather than CANONICAL'; ESTABLISHED is not a permissible value of MechanisticHypothesisStatusEnum. Rewrote the sentence to state that the Z-disc model is retained as CANONICAL while remaining contested by the ALTERNATIVE junctional-membrane model. (2) The Impaired Excitation-Contraction Coupling to Impaired Cardiomyocyte Force Generation edge cited a background 'precise role of NEXN ... is still unknown' sentence as SUPPORT; replaced it with the same paper's result sentence reporting nexilin essential for optimal calcium transients, and rewrote the explanation. (3) Added the disease-level GeneReviews baseline PMID:20301486 with tags: [GeneReviews], following the Dilated_Cardiomyopathy_1E pattern (tagged reference plus a notes paragraph, no snippet quoted) because the cached PubMed record is content_type abstract_only and carries only the chapter purpose statement; recorded in notes why the 1JJ pattern of quoting purpose-statement clauses was not followed. Also accepted three non-blocking reviewer suggestions with already-cached NEXN-specific evidence: a Heart Transplantation treatment (NCIT:C15246) with a Heart Failure target_mechanisms link, an NT-proBNP biochemical marker (NCIT:C88524) with a THRESHOLD_DEPENDENT readout on Heart Failure, and an OCCASIONAL Arrhythmia phenotype (HP:0011675) sourced to the biallelic case in which a second conduction-gene allele was explicitly excluded. Declined a standalone ventricular assist device treatment and the peripartum second-hit note, with reasons recorded in notes. The grouping file kb/groupings/Familial_Dilated_Cardiomyopathy.yaml was deliberately not touched, because PR #10649 edits the same file and the member-count reconciliation is left for the maintainer. Validation: just validate, validate-terms, validate-disorders all passed with 72/72 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-folded-hyphens, check-snippet-length, check-title-snippets all OK; validate-grouping and check-groupings pass on the unchanged grouping file.

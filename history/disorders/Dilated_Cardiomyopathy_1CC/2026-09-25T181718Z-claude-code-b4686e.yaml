  details: |
    Round-3 review (PR 10647) found that the Familial_Dilated_Cardiomyopathy grouping prose stated member counts ('fourteen', 'eleven classes') that no longer matched the membership after main added CMD1FF, CMD1X, CMD1DD and CMD2G, and that its mechanistic-class list omitted FKTN. Merged origin/main (no conflicts; the grouping now has 16 members). Replaced every count in the grouping notes and MONDO consistency note with count-free wording, as the reviewer suggested, so the prose cannot go stale again as members are added; added the alpha-dystroglycan glycosylation class (FKTN) to the class list; deleted a parenthetical changelog sentence and an issue-number/date clause; and changed 'Six mechanistic classes are represented' in grouping_rationale to 'Among the mechanistic classes represented', since that list is partial. Re-verified the claim being reworded rather than trusting it: all 16 members are direct children of MONDO:0700335 per OLS parents, and just check-groupings reports all 16 SATISFIED on both NECESSARY criteria. In the NEXN entry's notes, removed a list of the grouping's genes described as lacking NEXN (false once this PR adds NEXN, and missing FKTN) and a sentence describing the change itself. Noted but not changed: MONDO also places CMD1E (SCN5A) under syndromic disease MONDO:0002254, which the grouping's consistency note mentions only for CMD1A; explaining why needs research outside this PR.

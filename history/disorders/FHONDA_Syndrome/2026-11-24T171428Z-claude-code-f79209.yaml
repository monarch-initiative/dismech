  summary: 'Review round 1: add diagnosis section'
  details: |
    Answered the first review of PR #18873. Added a diagnosis section with four rows: OCT foveal grading (NCIT:C20828), visual evoked potentials for chiasmal misrouting (no term bound; an OLS search of NCIT for 'visual evoked potential' returned only NCIT:C191332 Sweep Visual Evoked Potential and VEP latency/amplitude measures), molecular SLC38A8 testing (NCIT:C15709), and ultra-widefield fundus imaging for the concentric macular ring sign (NCIT:C166089; the ring sign is reported in PMID:33498813, not PMID:32744312 as the review said). All diagnosis evidence quotes PMID:32744312, PMID:35029636 or PMID:33498813, already cached. Removed the evidence-free causal edge from SLC38A8 to anterior segment dysgenesis and recorded in notes that no source describes that mechanism. No LOINC code was added: the tests are imaging and electrophysiology procedures with no disease-owned cut-off, so there is nothing for a LOINC measurement to carry. No supportive-care treatment was added: the cached FHONDA sources contain no quotable statement about refractive correction or low-vision aids. Re-ran validate, count-verified-snippets (50/50), validate-terms, the affected whole-repo gates and validate-disorders.

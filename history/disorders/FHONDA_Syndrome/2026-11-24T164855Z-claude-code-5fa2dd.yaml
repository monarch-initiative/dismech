  summary: 'Create: FHONDA Syndrome'
  details: |
    New entry for FHONDA syndrome (MONDO:0012216; SLC38A8, autosomal recessive, ClinGen Definitive). Name chosen as FHONDA Syndrome: a MONDO exact synonym and the name used across the primary literature, while an SLC38A8-related dyad appears in one paper title only. One Perplexity deep-research report (research/FHONDA_Syndrome-deep-research-perplexity.md) was used as leads; preflight-dr PASS. The report misattributed the 28-patient Kruijt et al. 2022 series to PMID:35041785 (an off-topic chemistry paper flagged by its own reference validation); the correct PMID:35029636 was cited instead. Its claims of an Slc38a8/Slc38a7 double-mutant mouse phenotype and of measured loss of transport by patient variants were not taken: PMID:39956648 reports normal retinal thickness and VEPs in its truncated mouse, and no cited source measures transport by patient variants, so the transport defect is recorded as inferred. No GeneReviews chapter exists (check-genereviews NO_CHAPTER); the phenotype baseline is the 58-patient pooled review PMID:33498813 and the 28-patient series PMID:35029636. Single-patient reports (retinitis pigmentosa features, early AMD, developmental delay) were left out of phenotypes. Validated with just validate, count-verified-snippets (all verified), validate-terms, the whole-repo gates and validate-disorders.

  summary: 'Create: KCNQ2 Developmental and Epileptic Encephalopathy'
  details: |
    De-novo curation of KCNQ2 developmental and epileptic encephalopathy / KCNQ2-NEO-DEE (MONDO:0013387, DEE7), the severe end of the KCNQ2 continuum whose benign end is the existing Benign_Neonatal_Seizures entry. Granular unbundled pathophysiology (KCNQ2 pathogenic variant -> neuronal M channel Kv7.2/Kv7.3 dysfunction -> loss of M-current control of excitability -> neuronal hyperexcitability -> neonatal-onset tonic seizures with burst-suppression EEG; parallel developmental-encephalopathy effector) with three conforms_to links to the epilepsy_excitation_inhibition_imbalance module (ion-channel, hyperexcitability, seizures). GeneReviews baseline PMID:20437616 (KCNQ2-Related Disorders), tagged. Deep research provider: claude_code. Evidence snippet-verified: 20437616 (GeneReviews), 22275249 (Weckhuysen de novo missense series), 32239694 (knock-in mouse), DOI:10.1111/epi.17627 (Knight ezogabine series). Precision-therapy treatments captured: sodium channel blockers preferentially effective (contrast with Dravet) and the Kv7/M-channel opener ezogabine. Discussions: GoF-vs-LoF opposite-drugs precision gap, same-gene-opposite-severity gap linking to the Benign Neonatal Seizures entry, and the seizure-remission-vs-persistent-encephalopathy gap. All snippets manually confirmed as exact substrings; validation and folded-hyphen pass.

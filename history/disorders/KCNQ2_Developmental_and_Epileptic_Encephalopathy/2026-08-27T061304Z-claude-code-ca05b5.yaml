  summary: 'Compliance: add KCNQ2-NEO-DEE dataset records and bursting evidence'
  details: |
    Weekly compliance pass focused on datasets. The entry had an empty datasets list; added two verified records - geo:GSE291694, transcriptional profiling of glutamatergic neurons from patient iPSCs carrying three distinct KCNQ2 variants each with its own CRISPR-corrected isogenic control, and geo:GSE122584, SNP-array copy-number profiling of a family with a KCNQ2 exon 7 partial duplication. Both resolved OK through just verify-datasets on 2026-08-27. data_type is deliberately omitted on GSE122584 because DatasetTypeEnum has no array-CGH/SNP-array value. Organism on GSE291694 is recorded as human against GEO's own sample_organism field, which says Mus musculus; the series summary and sample titles are the human patient and isogenic iPSC lines, so the GEO field looks like a submission error, and this is stated in the record notes. Also added IN_VITRO evidence from PMID:41015095 to the previously unevidenced Neuronal Hyperexcitability node. Every candidate the discovery script scored DIRECT was rejected on triage: they matched the generic phrase developmental epileptic encephalopathy and concern GLUL, CDKL5, SCN8A, or Dravet, not KCNQ2.

  details: >-
    Repaired both pre-existing PMID:32239694 title-substring snippets in-place while preserving protected node name KCNQ2 Pathogenic Variant; retired bundled Neonatal-Onset Seizures with Burst-Suppression EEG and wired Neuronal Hyperexcitability directly to the neonatal seizure, EEG, and ictal apnea phenotypes; added GO cellular_components (axon initial segment GO:0043194 and node of Ranvier GO:0033268, PMID:14762142) on Neuronal M Channel Dysfunction; added DEE7/EIEE7/KCNQ2-DEE synonyms, Harrison's chapter and neurological channelopathy classifications, and RARE prevalence block; upgraded Neonatal-Onset Seizures to HP:0032807, replaced SLFNE apnea quote with human KCNQ2-REE ictal apnea evidence (PMID:32239694), harmonized Intellectual Disability to moderate-to-profound, and added Transient Basal Ganglia MRI Signal Abnormality (HP:0012751); enriched genetic with DE_NOVO origin, ClinGen MONDO:0100455 scope note, and structured p.Thr274Met and p.Gly256Trp variants; added Kcnq2 Thr274Met/+ knock-in mouse animal model (with PARTIALLY_RECAPITULATES / MODERATE developmental-encephalopathy grading and structured P20-P30 onset and neurosensory limitations) and CRISPR-isogenic human iPSC glutamatergic

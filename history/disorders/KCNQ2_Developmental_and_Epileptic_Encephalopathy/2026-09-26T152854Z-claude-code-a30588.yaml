  details: |
    Added exact-quote evidence to all five pathophysiology downstream edges, which previously carried none. Variant to M channel dysfunction and M channel dysfunction to loss of M-current control cite the Orhan 2014 oocyte study (PMID:24318194). Loss of M-current control to neuronal hyperexcitability cites the Biba-Maazou 2022 Kcnq2 p.T274M knock-in slice study (PMID:35389519, newly cached). Hyperexcitability to seizures and to the developmental encephalopathy cite the Milh 2020 knock-in mouse (PMID:32239694); explanations note the later seizure onset in mouse and that the cognitive edge is not isolated from other intermediates. All 22 snippets verify against cached references.

  summary: 'Address review on PR #9006: add diagnosis, 12 phenotypes, environmental,
    chloramphenicol, QuEST, strain gap'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9006. Both blocking
    items addressed, plus five of the six actionable suggestions.

    BLOCKING ITEM 1 - missing `diagnosis:` section. Added five diagnosis entries following
    the Murine_Typhus pattern (NCIT:C25294 Laboratory Procedure / NCIT:C18020 Diagnostic
    Procedure with `results:`): IFA as CDC reference standard with its availability
    inversion, immunochromatographic rapid tests with ~70% sensitivity rising with fever
    duration, PCR on the 56-kDa TSA gene, the Weil-Felix test with ~15% sensitivity, and
    clinical eschar recognition. The implementation gap the reviewer flagged is curated
    explicitly: the least reliable test (Weil-Felix, ~15% sensitivity) was the primary
    method in ~61% of two decades of Indian cases while PCR accounted for 4.6%, which is a
    reason to read reported case counts as underestimates.

    BLOCKING ITEM 2 - missing phenotypes above the 10% threshold. Added twelve, all banded
    from pooled meta-analytic prevalences in PMID:40754340: hepatomegaly 46% FREQUENT,
    splenomegaly 34% FREQUENT, nausea 43% FREQUENT, vomiting 35% FREQUENT, cough 34%
    FREQUENT, dyspnoea 37% FREQUENT, tachycardia 65% FREQUENT, abdominal pain 26%
    OCCASIONAL, hypotension 22% OCCASIONAL, jaundice 18% OCCASIONAL, diarrhoea 11%
    OCCASIONAL, myocarditis 4% VERY_RARE.

    The reviewer's cardiac point was taken and made into a worked contrast rather than a
    silent correction: myocarditis is banded VERY_RARE from the 4% population figure while
    the 42% cardiovascular rate from the severity-selected INTREST arm is retained in prose
    with its provenance stated. The notes now use this pair as the concrete illustration of
    why severity-selected cohorts are not banded - doing so would have overstated cardiac
    involvement roughly tenfold.

    SUGGESTIONS ADDRESSED:
      4 - added an `environmental:` section with three exposures (occupational agricultural
          and forest work TRIGGERS; peridomestic firewood/livestock PREDISPOSES; bamboo
          flowering EXACERBATES), each with `influences_mechanisms` on the chigger
          inoculation node and its own evidence. All three exposure_terms are deliberately
          left UNBOUND: ECTO was searched for arthropod-vector, agricultural, occupational
          and peridomestic exposure concepts and no adequate match was found, so per the
          project rule that no term beats a bad one a free-text preferred_term is retained
          with a `notes:` line recording the search.
      5 - added chloramphenicol with its pregnancy/neonatal toxicity constraint, curated as
          PARTIAL because the supporting sentence both supports and restricts the agent.
          Rifampicin was NOT added: the reviewer suggested it, but the cached source for
          this entry does not mention rifampicin and no verified snippet was available, so
          adding it would have meant an unsupported claim.
      6 - added QuEST (NCT06675110), the insulated-isothermal-PCR trial, which pairs with
          the new diagnosis section.
      7 - added the `orientia-strain-variation` KNOWLEDGE_GAP consuming PMID:32620750,
          linking TSA56 antigenic diversity to the postulated strain-dependence of eschar
          formation and the strain-divergent host cytokine programmes, attached to three
          pathograph nodes.
      3 - NOT done. An `animal_models:` entry with FAILS_TO_RECAPITULATE requires both
          `limitations` and `evidence`, and no verified snippet was available stating that a
          specific murine model fails to reproduce the human eschar. Rather than
          manufacture one, the claim stays in the existing HUMAN_MODEL_MISMATCH discussion.
          Flagged as a genuine follow-up.
      8 - top-level `references:` block not added; `reference_title:` is populated on every
          evidence item so provenance is not lost. Low value relative to risk of churn.
      9 - respectfully disputed, with evidence. The PR body's "0 off-topic" matches what the
          report itself renders: its `## Reference Validation` table reads "| On topic | 4 |"
          AND "| Off topic | 0 |" on separate rows. The validator distinguishes three states
          (on topic / off topic / neither-assessed), so "not classified on topic" is not the
          same as "off topic" and the PR text did not overstate the result.


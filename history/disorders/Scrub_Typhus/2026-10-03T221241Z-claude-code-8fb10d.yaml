  summary: Backfill agent_life_cycle (#10115, R26)
  details: |
    Added agent_life_cycle for Orientia tsutsugamushi. Hosts: Leptotrombidium (NCBITaxon:279271, genus-level, the exclusive vector and simultaneously the reservoir, since the bacterium persists as an endosymbiont and passes transovarially so no vertebrate is needed to maintain it), Rodentia (NCBITaxon:9989, order-level, small-mammal host on which chiggers feed and which sustains the vector population without being required to maintain the agent), Homo sapiens (NCBITaxon:9606, incidental host). Vector: chiggers, the larval stage of Leptotrombidium. Both non-human hosts are bound above species because the sources speak of the Leptotrombidium genus and of rodents and small mammals. Three stages: transovarial maintenance in the mite reservoir (PMID:40754340 for endosymbiotic persistence by transovarial and transmedial transmission, and for the genus responsible for transmission), chigger infestation of small-mammal hosts (PMID:39452388 for the chigger as exclusive vector and for its own field count of 9309 chiggers off 1760 small-mammal hosts in an epidemic focus), and chigger attachment and human infection (PMID:40754340 for salivary-gland colonization and injection; PMID:6808205 for the infected laboratory-reared Leptotrombidium fed on human volunteers, graded HUMAN_CLINICAL in line with the file). The PMID:40754340 sentences are graded OTHER with quote_role REVIEW_SYNTHESIS because they are the review's synthesis of vector biology, where the file's existing uses of that reference are HUMAN_CLINICAL on epidemiological and clinical sentences. One new reference fetched: PMID:39452388. The pre-existing NO_PROGRESSION finding is out of scope. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (647/647 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

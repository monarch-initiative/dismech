  summary: 'Create: Scrub typhus (MONDO:0019365)'
  details: |
    New disorder entry for scrub typhus (MONDO:0019365), the mite-borne rickettsiosis
    caused by Orientia tsutsugamushi. Claimed via issue #8999 off the priority dashboard
    (CURATE_ROOT, score 71.5, no NEC risk badge).

    Deep research: `just research-disorder falcon Scrub_Typhus` (Edison/Falcon,
    research/Scrub_Typhus-deep-research-falcon.md). Three gates run before any content was
    used:
      Gate 1 - report reference_validation block: 9/9 references resolved, 0 unresolved,
        0 off-topic.
      Gate 2 - `just preflight-dr ... MONDO:0019365` returned SKIP because MONDO records no
        causal gene for an infectious disease, so the manual identity check was run against
        the organism anchor instead (RO:0014001 NCBITaxon:784). The report mentions Orientia
        tsutsugamushi and Leptotrombidium throughout and Rickettsia typhi / R. prowazekii /
        R. rickettsii zero times, so the two obvious NEC confusions (murine typhus, epidemic
        typhus) are excluded. No OMIM claims to conflict.
      Gate 3 - every citation used was independently fetched with `just fetch-reference` and
        every snippet checked against the resulting cache. The DR report cites by opaque
        citation key rather than PMID, so it was used as a structural cross-check only; all
        17 evidence-bearing references were sourced and verified independently via PubMed
        E-utilities. Three DR leads (PMID:21610853, PMID:32620750, PMID:37426673) were
        resolved from their DOIs and confirmed to be the papers claimed before use.

    Pathograph: 13 atomic nodes, 15 edges, single connected component, no orphans, all four
    biological_scale values represented with 5 MOLECULAR nodes. Chain runs chigger
    inoculation -> TSA56/fibronectin/integrin-mediated induced entry -> cytosolic replication
    -> eschar / dissemination -> endothelial and mononuclear phagocyte infection -> type I
    interferon M1 programme -> small-vessel vasculitis -> multi-organ leak, with Ank13/p53
    niche maintenance feeding the replication node and two drug-target nodes feeding in.

    Module conformance: `intracellular_pathogen_persistence` (both nodes) and
    `bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome`,
    following the Murine_Typhus / Oroya_Fever pattern. Conformance to
    `bacterial_cell_wall_synthesis_inhibition#Intrinsic Resistance in Cell-Wall-Deficient
    Organisms` was deliberately NOT declared: the classic PMID:3114150 finding that Orientia
    lacks peptidoglycan is contested by PMID:28513097, which reports a peptidoglycan-like
    structure. Both papers are curated on one node (the second as PARTIAL) and the tension is
    recorded as an open KNOWLEDGE_GAP rather than resolved by assertion.

    Frequency discipline: only eschar carries a frequency band (OCCASIONAL), justified by a
    34,002-case pooled proportion of 28.5% (PMID:39282546), with the description recording
    that the estimate is India-specific and regionally heterogeneous. The INTREST organ-
    involvement percentages are quoted in phenotype descriptions but deliberately NOT mapped
    to FrequencyEnum, because that cohort was selected for severe disease and the numbers are
    not population frequencies.

    Also curated: three discussions (two KNOWLEDGE_GAP, one HUMAN_MODEL_MISMATCH on the
    murine-only brain neuroinflammation evidence, evidenced from PMID:37426673), two NCT
    trials, and the INTREST trial keyed on its WHO ICTRP identifier
    (ICTRP:CTRI/2018/08/015159) since it has no ClinicalTrials.gov record.


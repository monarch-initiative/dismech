  summary: Wire phenotypes into the pathograph and add a progression block
  details: |
    Added downstream edges from the eschar, dissemination, interferon/cytokine and multi-organ nodes to 17 of the 25 phenotypes, each carrying its own exact-quote evidence; added ARDS sequelae to dyspnoea and cough; added a three-phase progression block (incubation, acute febrile illness, severe multi-organ phase). Phenotype causal-inlink coverage went from 0 of 25 to 17 of 25. Eight phenotypes were deliberately left unconnected because no cached source states a mechanism for them: thrombocytopenia, jaundice, nausea, vomiting, abdominal pain, diarrhoea, tachycardia and hypotension. The eschar node description was revised: it previously declared itself a terminal node with no outgoing edge, which is no longer true now that it explains the eschar and the regional lymphadenopathy. Validated with just validate (120 of 120 snippets verified), check-causal-targets, check-entity-refs, check-granularity, check-name-collisions and the offline KB gates.

  summary: 'Drop two non-causal motivation edges found systematically via PR #9007
    review'
  details: |
    Proactive correction, not requested on this PR. The reviewer of PR #9007 (brain AVM)
    flagged that a pathophysiology edge encoding clinical motivation rather than causation
    would export to KGX/cx2 as a false causal assertion. Auditing this entry for the same
    pattern found two instances, so they are fixed here rather than left to be discovered
    later:

      1. "Eschar Formation at the Inoculation Site" -> "Multi-Organ Vascular Leak and
         End-Organ Dysfunction". The edge description itself conceded the problem - "it is not
         itself the cause of organ failure but is the visible correlate of the initiating
         focus" - so the entry was asserting a causal edge while simultaneously denying
         causation in its own prose. Removed; the eschar is now correctly a terminal node.
      2. "Multi-Organ Vascular Leak and End-Organ Dysfunction" -> "Requirement for
         Cell-Penetrant Antimicrobials". Organ failure makes therapy urgent; it does not create
         the pharmacokinetic constraint, which follows from the cytosolic niche and is already
         correctly asserted by the DIRECT edge from "Cytosolic Replication in an Obligate
         Intracellular Niche". Removed.

    Both rationales are retained as prose in the relevant node descriptions, with an explicit
    statement that they are rationales rather than causal relationships.

    Connectivity after removal: 13 nodes, 13 edges, all 13 still in one undirected component,
    no orphans. Four directed roots remain and a notes block now explains why that is
    intentional rather than a defect: besides the trigger, the Ank13 effector, the bacterial
    ribosome and the bacterial envelope have no incoming edge because they are properties of
    the organism rather than consequences of the disease process. Nothing in a human pathograph
    causes a bacterium to have a ribosome. That is a materially different situation from the
    orphaned host node the AVM reviewer correctly objected to.

    Note this PR was already APPROVED and CLEAN when this change was made. Pushing dismisses
    that approval, which is the cost of fixing a known data-correctness defect rather than
    shipping it; the alternative was to knowingly leave two false causal assertions in an
    exported graph.


  summary: 'Create: Statin Toxicity'
  details: 'Created kb/disorders/Statin_Toxicity.yaml (MONDO:0033170), a toxic-exposure entry

    covering the adverse-effect spectrum of HMG-CoA reductase inhibitor therapy.


    Deep research: two Edison Falcon runs, both committed, because a wrapper fault caused

    the first launch''s shell to be killed while its provider job continued, and a second

    launch was made. Both completed and were kept at the curator''s instruction, since

    their source sets differ: research/Statin_Toxicity-deep-research-falcon.md (24

    references checked, 20 resolved, 1 unresolved, 3 unverifiable) and

    research/Statin_Toxicity-deep-research-falcon-run2.md (16 references, all 16

    resolved, 0 unresolved). Run 2 contributed twelve DOIs absent from run 1. The second

    report was renamed to the -run2 suffix, with its artifact directory and in-body

    artifact links rewritten to match, so the two reports do not overwrite each other at

    the shared default path; its template_sha was stamped with scripts/template_version.py

    as the recipe would have done.


    Both reports set needs_review. Run 1''s only unresolved identifier was GEO:GSE97254;

    the run log shows the failure was HTTP 429 from Entrez, a transport failure rather

    than a fabrication. It was re-checked against the Entrez gds database, where it

    resolves, then fetched with `just fetch-reference geo:GSE97254`; `just

    verify-datasets` reports it OK. It is recorded as a datasets: entry with the

    repository''s own title copied verbatim, data_type MICROARRAY and sample_count 23 read

    from the GEO record rather than assumed, and the GEO summary quoted as evidence. Run

    1''s term-validation flag was MONDO:0033170 reported as "if available" - the report

    echoing an unfilled template placeholder, not a competing binding. The bound label is

    MONDO''s own, statin toxicity.


    Evidence as committed: 69 snippets and 69 reference_title values across 18 PMIDs plus

    the GEO record, verified by `just validate-disorders` (69 snippets checked, 70 titles

    checked, 0 issues). Weighted compliance 89.9%. Principal sources are PMID:21067805

    (SEARCH, the randomised simvastatin dose comparison), PMID:18650507 (SLCO1B1

    genome-wide study), PMID:21732624 (Wagner, the geranylgeranyl-pyrophosphate rescue

    experiment that discriminates the mevalonate branches), PMID:21360500 (Mammen,

    identification of HMGCR as the autoantigen), PMID:36923454 (the negative zilucoplan

    C5-inhibition trial), PMID:28771594 with GEO:GSE97254 (human muscle expression after

    rechallenge), PMID:25694464 (the EAS consensus definition of SAMS), PMID:39796117

    (transporter pharmacokinetics in volunteers), PMID:40281622 (prospective

    pharmacogenomic cohort), PMID:36833383 (the Dutch null result), PMID:41010829

    (anti-HMGCR case series), PMID:35969116 and PMID:36694885 (the ILEP position paper and

    the muscle-toxicity review), PMID:38384718 (exercise meta-analysis), PMID:38751493

    (hepatic), PMID:39169014 (new-onset diabetes), PMID:40249406 (PCSK9 inhibitors in

    anti-HMGCR myopathy) and PMID:39497020 (non-statin lipid-lowering).


    Structure. The disease is modelled as one molecular lesion with five clinical strata,

    recorded as has_subtypes (SAMS, CK-Defined Myopathy, Anti-HMGCR IMNM, Hepatotoxicity,

    New-Onset Diabetes), because both reports insist their denominators, diagnostic routes

    and management differ, and on the rechallenge question are opposed. The pathograph is

    a 14-node chain from transporter function through systemic exposure, muscle HMG-CoA

    reductase inhibition, isoprenoid depletion, impaired geranylgeranylation and

    bioenergetic failure to fiber necrosis, with the autoimmune, hepatic and metabolic

    branches rejoining or running in parallel. All 11 phenotypes are causally connected.

    Three discussions carry the questions the pathograph deliberately does not answer.

    The hepatic node conforms to drug_induced_liver_injury#Mitochondrial Dysfunction and

    Oxidative Stress.


    Judgements worth recording. HMGCR is bound as a pathophysiology genes descriptor

    rather than in genetic:, because its relation to this disease is as drug target and

    autoantigen - no GeneDiseaseRelationshipEnum value states that without asserting a

    variant-mediated relationship. SLCO1B1 and ABCG2 are typed SUSCEPTIBILITY, not

    CAUSATIVE, and their variants carry no clinical_significance, because that slot is the

    ACMG scale and these are drug-response alleles. No edge runs from isoprenoid depletion

    to the energy deficit by way of ubiquinone: that is the oldest candidate mechanism and

    the rescue experiment argues against it, so it is carried as a discussion rather than

    drawn as an arrow the entry does not believe. No complement effector edge is drawn in

    the autoimmune branch, for the same reason and on the trialists'' own reading of their

    negative result. The attribution problem - how much reported muscle symptom is caused

    by the drug - is carried as a third discussion and is deliberately not pathophysiology,

    because its competing explanations are not mechanisms of the drug. No frequency slot is

    filled anywhere from a reported-symptom rate. The non-statin lipid-lowering treatment

    carries no target_mechanisms link, because it treats the indication the statin was

    prescribed for rather than any node here. Myalgia descends from the sub-necrotic

    injury node rather than from fiber necrosis, because the stratum in which it is

    commonest is defined by a normal creatine kinase. No mitochondrion is annotated on

    that node, because the source measuring the energy deficit reports membrane potential

    and mitochondrial gene expression intact.


    Negative-existence claims, each re-run immediately before being written. ECTO was

    searched through sqlite:obo:ecto with l~statin, l~simvastatin, l~atorvastatin,

    l~rosuvastatin, l~HMG, l~cholesterol, l~lipid-lowering, l~hypolipidemic and l~drug;

    ECTO:0900064 exposure to statin via ingestion was bound, and the class-level

    ECTO:9000259 and four agent-specific terms also resolve. `just check-genereviews

    --online` reports NO_CHAPTER for both GeneReviews and StatPearls, with five synonyms

    present in the entry so the match was not name-only.


    Corrections made during curation, each caught by a validator or by review rather than

    by reading. (1) One snippet attributed to PMID:28771594 was taken from the

    GEO:GSE97254 summary; replaced with the paper''s own sentence. (2) Five reference_title

    values had been written from memory; every title in the file was then rewritten

    programmatically from the cache files'' own title: frontmatter, and reference_title

    compliance is 100%. (3) A scripted substitution twice dropped the leading indentation

    of a block-scalar continuation line and broke the YAML; both were caught by the

    pre-write hook and the parse check, and repaired.


    A red-team review was then run against the dismech-pr-review standard before any PR,

    and returned REQUEST_CHANGES. Every blocking finding was independently re-verified

    against the cached sources before being acted on, and all were correct. The

    substantive ones: four evidence items quoted a methods, aims or framing sentence that

    asserted nothing, and in each case the sentence that does assert the claim was already

    in the same cached file; the edge from bioenergetic failure to fiber necrosis cited a

    cohort whose entry criterion was muscle symptoms *without* significant creatine kinase

    elevation, so it could not evidence progression to necrosis; the autoimmune effector

    edge was typed DIRECT against the entry''s own recorded uncertainty about the effector,

    and cited an antigen-identification methods sentence; "Elevated CK levels persisted for

    at least three months" sits in that paper''s treatment-response paragraph and is about

    refractoriness to immunosuppression, not independence from statin withdrawal; and an

    in vitro immunoprecipitation experiment was graded HUMAN_CLINICAL. One claim of mine

    about a re-runnable query was false: the entry stated that l~HMG returns nothing in

    ECTO, and it returns MAXO:0000739 HMG-CoA reductase inhibitor therapy. The conclusion

    survived - that is not an ECTO exposure class, and is from an ontology dismech no

    longer uses - but the sentence was corrected, since a false justification for a

    binding is worse than an unexplained one. The review also found an uncited negative

    result stated in rendered prose whose cache sat in the same commit (the Dutch SLCO1B1

    cohort, now an evidence item graded NO_EVIDENCE because its outcome is dispensing

    change rather than documented injury); ABCG2''s contribution mislocalised to hepatic

    first-pass extraction, which its own cited source does not state; a bundled

    myoglobin-release-and-nephropathy node, split into two after the fluid-therapy

    treatment had to reason about acting on "only half of what this node asserts"; two

    prevalence records carrying the measured outcome in the population field; a myopathy

    rate filed under a subtype named Rhabdomyolysis, renamed CK-Defined Myopathy; and

    several sentences of session-scoped prose in rendered description and notes fields,

    rewritten as claims about the disease or moved to review_notes. Declined, with

    reasons: no clinical_trials block (the NCT and ISRCTN records are not fetched and the

    trials are already cited by PMID where they bear on a claim), no coenzyme Q10

    treatment record (the question is carried as a discussion instead, which is where the

    conflicting evidence belongs), and no population_effects on the variants (the

    ancestry strata named in the source - including one with no HANCESTRO term - need

    their own binding pass rather than being inferred here).


    Validation run and read on the final state: `just validate-disorders

    kb/disorders/Statin_Toxicity.yaml` (schema, terms and references; 69 snippets, 70

    titles, 0 issues), `just validate-terms` (passed), `just verify-datasets` (1 OK),

    `just check-entity-refs`, `just check-causal-targets`, `just check-enum-values`,

    `just check-duplicate-keys`, `just check-qualifier-terms`,

    `just check-block-scalar-comments`, `just check-case-collisions`,

    `just check-not4curation`, `just check-granularity`, `just check-shared-disease-terms`,

    `just check-delivery-system`, `just check-genereviews --online`,

    `just list-gene-term-mismatches` (7 genes named, 0 naming a different gene),

    `just list-disconnected-phenotypes` (11/11 connected), the whole-KB ratchets for

    snippet length, title snippets, snippet grading, retired support prose, environmental

    evidence, folded hyphens, reference titles and coarse phenotypes, and

    `uv run python -m pytest tests/test_data.py -k "subtype or entity_ref or causal"`

    (3,920 passed).


    Only the cache files for references the entry cites are staged. The DOI-keyed caches

    written by the deep-research validation step duplicate papers cited here by PMID, and

    four further PMID caches were fetched and not used; none is committed.'

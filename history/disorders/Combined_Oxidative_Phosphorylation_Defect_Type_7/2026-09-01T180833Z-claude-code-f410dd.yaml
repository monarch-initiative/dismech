  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 7 (MTRFR/C12orf65)'
  details: |
    De novo curation of COXPD7 (MONDO:0013306, OMIM 613559), biallelic truncating MTRFR (formerly C12orf65).

    entry_type decision: DISEASE. One gene, one conserved pathograph (MTRFR loss -> failure of mitoribosome rescue -> global mitochondrial translation deficiency -> combined respiratory chain complex deficiency -> energy failure in long-projection and optic neurons -> optic atrophy + axonal neuropathy + spastic paraparesis + Leigh-like imaging). Peers already in kb/ (COXPD types 4, 21, 26 and COXPD 42) are curated the same way, so this is precedent-consistent. Not a GROUPING despite the five clinical names attached to the gene, and no has_subtypes: SPG55, Behr syndrome, Leigh syndrome and CMT6-like neuropathy are the same allelic disorder named after whichever feature the referring specialty saw first, and the only candidate real axis (variant position relative to the GGQ domain) is a severity gradient, not a partition.

    NEC preflight PASS: MTRFR mentioned 33 times, MONDO OMIM 613559.

    Boundary with the existing Behr_Syndrome entry, which the claim issue asked to reconcile. Behr_Syndrome is organised around OPA1 with MTRFR listed as one of several phenocopy genes producing a 'Behr-like' picture. PMID:26380172 argues the reverse - that classical Behr syndrome is typically an MTRFR disease and that the phenotype Behr described in 1909 was probably not caused by the genes usually credited with it. Rather than silently contradict the existing entry or rewrite it from this PR, the disagreement is stated in this entry's description and carried as a KNOWLEDGE_GAP (coxpd7_nosology_behr_spg55_leigh) so both entries read as describing an unsettled boundary. Rewriting Behr_Syndrome is left as separate work.

    Frequency bands were taken from the 27-patient review (PMID:32478789) and banded against FrequencyEnum rather than transcribed: 92.3% optic atrophy -> VERY_FREQUENT, 80% neuropathy -> VERY_FREQUENT (80-99 band), 60% spasticity -> FREQUENT, 20% bulbar dysfunction -> OCCASIONAL. Ophthalmoplegia is recorded as FREQUENT because two series give 73% and 38.4%, which differ substantially as point estimates but fall in the same 30-79 band; the notes say so.

    The animal_models section carries a FAILS_TO_RECAPITULATE link, which is the honest reading: Mtrfr-null mice die embryonically and two groups have now failed to make a viable line, while humans with the same allele class live into adult life and zebrafish nulls are healthy and fertile. That three-species mismatch is the subject of a HUMAN_MODEL_MISMATCH discussion, including the point that the zebrafish compensation mechanism the authors propose (teleost Ict1 lacking the mtLSU-binding motif) cannot explain human tolerance, so human tolerance remains unexplained.

    Snippet mechanics: PMID:32478789 is a PDF-derived cache with wrapped lines, so three snippets carry embedded newlines rather than being reflowed; two initial snippets were rejected by the validator (one bracket-citation stripping, one where I had paraphrased the 183-patient screen) and were replaced with exact text from the cache.

    Deliberately not curated: gene replacement as a treatment (preclinical, and the mouse it was tested in had to be rescued from an embryonic lethality patients do not have); the mitochondrial vitamin cocktail as a treatment (a single patient in whom it did not alter the course, recorded in notes instead).

    Validation: just validate exit 0 with 54/54 snippets verified; check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens all exit 0.

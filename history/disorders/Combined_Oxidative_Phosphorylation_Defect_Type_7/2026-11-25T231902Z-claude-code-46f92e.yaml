  summary: 'Gene-family review: MTRFR'
  details: |
    MTRFR had no node with a molecular function. It now sits on the mitoribosome rescue node, which binds peptidyl-tRNA hydrolase activity (GO:0004045) DECREASED: the structural study of stalled mitoribosomes shows mtRF-R (C12orf65) using the GGQ motif of release factors to eject the nascent chain from the peptidyl-tRNA without reading a stop codon (PMID:33243891, quoted on the node). The genetic record gains the entry's autosomal recessive inheritance block (HP:0000007).

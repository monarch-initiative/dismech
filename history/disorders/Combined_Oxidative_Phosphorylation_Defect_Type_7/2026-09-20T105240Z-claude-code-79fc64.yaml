  details: |
    Genetics pass for issue #12193 (d2g wiring-004). MONDO records MTRFR for MONDO:0014020 (hereditary spastic paraplegia 55). This entry already carried MTRFR bound, graded CAUSATIVE, wired to three pathograph nodes, and already carried MONDO:0014020 as a skos:narrowMatch mapping with a detailed justification arguing SPG55 and COXPD7 are the same gene and the same disease registered twice from different first reports. The checklist item is therefore purely an export-layer gap: gene_to_edge in src/dismech/export/kgx_export.py reads only the entry's own disease_term, so a narrowMatch MONDO term exports no gene edge no matter how carefully it is curated.

    What changed, deliberately little. The gene record gained variant_origin GERMLINE. Two evidence items were added: the ClinGen definitive gene-validity assertion for MTRFR, whose scoping to the broad mitochondrial-disease term is consistent with this entry's position that the numbered OMIM labels name one gene's single disease; and a quotation substantiating the cytogenetic location and exon count that the record's notes state. That locus claim was correct and already present in two cached references this entry cites, but it was carried as prose without an attached quote.

    Nothing else was touched. The entry is already a strong genetics curation and the campaign's failure mode is bolting content onto entries that do not need it.

    Validation. just validate-pre-edit, count-verified-snippets 73/73, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean.

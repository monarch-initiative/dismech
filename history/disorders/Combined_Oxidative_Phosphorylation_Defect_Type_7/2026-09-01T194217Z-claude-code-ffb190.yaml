  summary: 'Review response: COXPD7 frequency support, nystagmus, lactate, SPG55 mapping,
    GeneReviews correction'
  details: |
    Second session on this entry. The first record (2026-09-01T180833Z) reports 54/54 snippets and predates everything below; it is left unedited, since history is append-only.

    Automated second opinion on issue #10399. It found that stubs/Hereditary_Spastic_Paraplegia_55.yaml (MONDO:0014020, OMIM 615035) is the same gene and the same disease, and that curating one while leaving the other open would produce two entries sharing a single pathograph. The SPG55 stub was marked entry_type: SUBTYPE with its reasoning in notes and then deleted, and MONDO:0014020 added to mappings.mondo_mappings as skos:narrowMatch - narrow rather than exact because SPG55 names the motor-predominant end of one spectrum rather than the whole of it. That is what makes the concept count as curated and retires it from the queue. The comment also suggested renaming the entry MTRFR_Deficiency; declined, since four peer COXPD entries already use this naming and consistency across the series is worth more than matching recent literature.

    Review on PR #10422, all three findings correct. Five phenotypes asserted a percentage in description while every attached snippet quoted something else; each figure is now carried by the sentence that reports it, from the 27-patient tally in PMID:32478789 and the pooled imaging sentence in PMID:39962784. The PDF-derived cache splits spasticity and nystagmus across lines and the snippets quote that verbatim rather than repairing it, with the explanations saying so. Nystagmus added at FREQUENT (42.8 percent), more common than the ophthalmoplegia already modelled. Increased circulating lactate added with the serial serum values and the laboratory reference interval from the Perrone patient plus the MRS peak seen in 3 of 11, deliberately with no frequency band because the two measurements are not the same quantity. Bulbar Dysfunction rebound from HP:0002015 Dysphagia to HP:0001283 Bulbar palsy.

    Three papers this PR cached but had not cited are now cited, and one changed the entry: PMID:25995486 reports the identical p.V116* allele as Leigh syndrome in monozygotic twins and, previously, as CMT6 in an unrelated family - one allele, two clinical labels, which is a direct counter-observation to the positional severity rule being the whole story and is now in the nosology gap's rationale and evidence.

    Correction. I claimed on the PR that no GeneReviews chapter exists for MTRFR or C12orf65 without having run the search. Running GeneReviews[Book] returns PMID:26425749, the Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview. Not a gene-specific chapter, but saying none exists would send the next curator looking for nothing. Added as a diagnosis record with the chapter's scope statement, graded OTHER and INDIRECT because the cached record is abstract-only. Searches run for the record: 1 hit for MTRFR/C12orf65, 1 for TPRN/DFNB79 (the Genetic Hearing Loss Overview), 0 for PLS1/DFNA76, 0 for ATP2B2/DFNA82.

    Own full-text pass on PMID:40452409. The mouse lethality window is sharper than 'die embryonically': homozygous embryos recovered at expected frequency at E10.5 and E11.5, none from E12.5 onward, using an allele that should retain partial activity by extrapolation from the human truncation series - so a genotype milder than several human ones is still lethal in mid-gestation, and the authors conclude directly that mice are more sensitive to loss of Mtrfr than humans. Added to the FAILS_TO_RECAPITULATE limitations. The same authors also state the delivery constraint concretely: an intraocular approach could treat the optic neuropathy and would do nothing for the peripheral neuropathy, and no single route reaches retina, corticospinal tract and peripheral nerve. Added to the human-model-mismatch discussion.

    Validation: just validate exit 0 with 70/70 snippets verified; validate-disorders, check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens all exit 0.

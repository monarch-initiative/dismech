  details: |
    New entry for lymph node tuberculosis (MONDO:0005831), seeded from PubMed E-utilities searches and the deep-research report research/Lymph_Node_Tuberculosis-deep-research-claude_code.md (first attempt succeeded; preflight-dr returned SKIP because MONDO records no causal gene). Peripheral, intrathoracic and abdominal node groups recorded as subtypes; organism strata deliberately lumped, with M. bovis pyrazinamide resistance recorded as a treatment caveat. MONDO:0957461 primary tuberculous lymphadenitis has no MONDO definition and its Orphanet source (ORPHA:645807) is obsolete, so it is recorded as a skos:narrowMatch mapping and its stub deleted together with the Lymph_Node_Tuberculosis stub. Jones-Campbell staging is taken from a table in PMID:38618370 because the 1962 paper has no abstract. Systemic symptom frequencies are deliberately unset because figures differ widely between African and low-incidence-country series. Evidence snippets verified against the local reference cache with count-verified-snippets.

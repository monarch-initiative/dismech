  summary: 'Create: FOXN1 deficiency (nude SCID)'
  details: |
    Greenfield curation of T-cell Immunodeficiency, Congenital Alopecia, and Nail
    Dystrophy (MONDO:0011132; FOXN1; OMIM 601705; ORPHA:169095), claim issue #9612.
    No stub existed.

    Duplicate preflight. `rg -il "FOXN1|nude" kb/disorders/` returned only incidental
    hits (nude-mouse xenograft models, the unrelated LIS1-NUDEL complex, HOXC13
    naming Foxn1 as a downstream target) plus Severe_Combined_Immunodeficiency, which
    explicitly names FOXN1 deficiency as a distinct entity from typical SCID and uses
    HP:0000778 thymic hypoplasia precisely because athymia belongs to FOXN1/complete
    DiGeorge. `git grep` for MONDO:0011132 and the synonyms on origin/main returned
    nothing under kb/ or stubs/. No existing entry covers this disease.

    Pathograph. Modeled as one molecular lesion with two anatomically separate arms.
    FOXN1 transcription factor loss (MOLECULAR; GO:0003700 with modifier
    LOSS_OF_FUNCTION; genetic_context germline homozygous LOSS_OF_FUNCTION) branches
    to (a) failed thymic epithelial cell differentiation (CELLULAR; CL:0002293,
    CL:0002364, CL:0002365; GO:0030855, GO:0097536) -> athymia (TISSUE;
    UBERON:0002370; GO:0048538) -> absent thymopoiesis (CELLULAR; GO:0033077) ->
    profound T-cell lymphopenia (ORGANISM; T-B+NK+) -> severe recurrent infection
    (ORGANISM); and (b) impaired keratinocyte terminal differentiation (CELLULAR;
    CL:0000312; GO:0030216, GO:0001942) -> congenital alopecia universalis and nail
    dystrophy. Every ontology label was verified against OLS/OAK before binding. The
    MONDO canonical label and the lowercase hgnc:12765 FOXN1 CURIE were confirmed
    from the MONDO OBO record, which also supplied the OMIM and Orphanet xrefs.

    Classifications. harrisons_chapter IMMUNE_RHEUMATOLOGIC + GENETICS_ENVIRONMENT_
    DISEASE, both evidenced. iuis_category (single-valued) = combined immunodeficiency
    with syndromic features, IUIS 2022 Table 2 thymic defects. The IUIS snippet named
    in the task brief ("FOXN1 deficiency (winged helix nude") does not exist in
    references_cache/PMID_35748970.md; `grep -F` showed the actual cache line is
    "FOXN1 deficiency FOXN1 AR 601705" at line 1389, and that is what was curated.
    The assignment notes distinguish this AR row from the immediately adjacent AD
    FOXN1 haploinsufficiency row (OMIM 600838), a separate entity not covered by this
    entry; the same boundary is restated in the description and in a dedicated
    genetic entry carrying association MODIFIER.

    Evidence. 76 snippets, every one an exact substring of a cached reference, 76/76
    verified. All anchor PMIDs were confirmed by PubMed esummary before fetching:
    Nehls 1994 Nature (PMID:7969402, whn/nude winged-helix gene, MODEL_ORGANISM),
    Pignata 1996 (PMID:8911612, original two-sib report), Adriani 2004 (PMID:15180707,
    R255X Acerno founder allele, 6.52% carrier frequency), Rota & Dhalla 2017 review
    (PMID:28077132, full text), Markert 2011 Blood (PMID:20978268, first thymus
    transplantation in FOXN1 deficiency), Markert 2022 JACI (PMID:34362576, cultured
    thymus tissue in 105 children), Bosticardo 2019 (PMID:31447097), Du 2019 JCI
    (PMID:31566583), Giardino 2021 (PMID:33464451), Amorosi 2008 (PMID:18339010),
    plus the thymic-defect guideline (PMID:36648576) and IUIS 2022 (PMID:35748970).

    Frank 1999 Nature (PMID:10206641), the founding human-nude paper, has a cached
    PubMed record with no abstract text. It is therefore listed in the top-level
    references block only and is deliberately not used as an evidence item anywhere;
    no title snippet was manufactured from it. This is stated in the genetic notes.

    Several snippets had to be re-cut after failures that were themselves informative:
    two guideline quotes spanned bracketed citation markers whose stripping left a
    whitespace mismatch, and one review quote spanned a hyphenated line break
    ("nail dys-/trophy"). All three were narrowed to clean spans rather than
    accommodated by config changes.

    Prevalence is structured, not free text: a worldwide CASES_IN_LITERATURE /
    ULTRA_RARE record (nine reported cases as of the 2017 review) with an evidenced
    caveat that newborn screening and NGS have since improved ascertainment, plus a
    separate Acerno CARRIER_FREQUENCY / ABOVE_1_IN_1000 record at rate_per_100000
    6520.0 (55 carriers among 843 screened). No ORPHA structured cache entry was
    built: the Orphadata bulk XML is gitignored and not present locally, so
    ORPHA:169095 is recorded in prose rather than cited as a reference.

    Treatments. Cultured thymus tissue implantation is the mechanism-directed therapy,
    with target_mechanisms RESTORES on both Athymia and Absent Thymopoiesis and the
    FOXN1-is-stromal-not-hematopoietic rationale quoted directly. NCIT has no
    thymus-transplantation clinical-action term (checked with both l^ and l~ against
    sqlite:obo:ncit), so NCIT:C15289 Organ Transplantation is used, matching the
    22q11.2_Deletion_Syndrome precedent, with the specificity gap noted. HSCT is
    reported honestly rather than omitted or softened: it carries a REFUTE item from
    the thymic-defect guideline stating bone marrow transplantation was not effective
    in biallelic FOXN1 deficiency, a MODULATES rather than RESTORES mechanism link
    reflecting that any benefit comes from mature donor T cells in the graft, and an
    indirect 41%-survival comparator figure. Supportive care (infection prophylaxis
    and protective isolation, immunoglobulin replacement) and genetic counseling are
    also curated. Cohort-level figures from the 105-child series are labeled as
    congenital-athymia-wide rather than FOXN1-specific in both notes and explanations.

    Schema currency. The branch was fast-forwarded from 39d476bd2f to origin/main
    d45b3defa5 partway through, after which supports: PARTIAL and WRONG_STATEMENT are
    retired. Derived term caches were discarded and re-derived across the move rather
    than carried over, and one colliding reference cache file (PMID_34362576.md) was
    dropped in favour of the copy already on main. Four PARTIAL items were converted:
    three to SUPPORT with directness: INDIRECT where the explanation genuinely records
    an indirectness appraisal (mouse choroid-plexus expression standing behind a human
    neurulation claim; an ascertainment-completeness quote attached to a prevalence
    record; a broad congenital-athymia HSCT survival figure used as comparator in a
    FOXN1 entry), and one to SUPPORT with directness: DIRECT (an observed
    post-implantation thyroid autoimmunity case). No PARTIAL or WRONG_STATEMENT
    values remain.

    Validation, all run to completion after the fast-forward and their output read:
    just validate (schema + terms + references; 76/76 snippets), just
    count-verified-snippets (76/76), just validate-terms (passed), just
    check-duplicate-keys, just check-entity-refs, just check-folded-hyphens, just
    check-snippet-length, just check-title-snippets, just check-empty-snippets, and
    the authoritative batched just validate-disorders (passed).

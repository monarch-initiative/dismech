  summary: Create Anisakiasis infectious disease entry
  details: |
    Added a new Anisakiasis entry for MONDO:0015200 and deleted its stub. The curation models Anisakidae nematodes at family level because the human syndrome includes Anisakis, Pseudoterranova, and rare Contracaecum disease; records cetaceans, fish, and accidental dead-end human hosts in the life cycle; adds raw or undercooked seafood ingestion as the transmission route; and separates larval gastrointestinal mucosal invasion from IgE-mediated gastro-allergic hypersensitivity.

    The entry uses PMID:20804423, PMID:30058531, PMID:24441579, PMID:10629469, PMID:31529811, and PMID:40974456 to support gastric/intestinal/ectopic/allergic presentations, CT and endoscopic diagnosis, anti-Anisakis IgE serology, endoscopic larval removal, and surgery for complicated intestinal disease. More speculative or weakly quantified associations, including incidental larvae in gastrointestinal tumors and occupational sensitization without active parasitism, were left out of the structured entry.

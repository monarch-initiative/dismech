  summary: 'Integrate assessed OpenScientist anti-DSG2 findings: AIDA assay discordance'
  details: |
    Reviewed the OpenScientist report for hypothesis anti_dsg2_causal_injury_driver_or_amplifier against the existing codex assessment (verdict WEAKLY_SUPPORTED_UNRESOLVED) and integrated its RETAINED/QUALIFIED claims into the disorder entry. Added one evidence item to the anti_dsg2_causal_injury_driver_or_amplifier mechanistic_hypotheses entry, quoting the PMID:39597880 abstract result that ARVC clinical correlates tracked anti-intercalated-disc antibody status by indirect immunofluorescence while ELISA-defined anti-DSG2 positivity had none. This substantiates the assessment's qualification of the report's prevalence-robustness claim: anti-DSG2 reactivity is repeatedly detected, but the assay used decides which antibody phenotype carries clinical signal, so neither the positivity rate nor the assay-defined phenotype is robust. Graded REFUTE/HUMAN_CLINICAL because the finding cuts against an anti-DSG2-specific causal axis, matching how the two canine non-discrimination items in the same block are graded. Deliberately made no other change. The comparator-reconciliation claim is already curated through two evidence items keyed on the PMC13256025 full-text URL plus the discussion rationale that reconciles PMID:42233375 with PMID:39597880; PMID:42233375 itself is uncited by PMID only because its cached record is an abstract-free citation stub, so no PMID-keyed snippet could be verified. The canine-replication and missing-causal-experiments claims are already covered by two REFUTE evidence items and by the gap_arvc_anti_dsg2_autoimmune_causality discussion with its two proposed experiments. The biomarker-null-ranking claim was left out on purpose: the assessment qualified the report's parsimony ranking down to unresolved, which is what the entry already records through status EMERGING and an OPEN knowledge gap, so importing the ranking would have added the overstatement the assessment removed. No assessment sidecar was written because openscientist-assessment-by-codex.yaml already exists.

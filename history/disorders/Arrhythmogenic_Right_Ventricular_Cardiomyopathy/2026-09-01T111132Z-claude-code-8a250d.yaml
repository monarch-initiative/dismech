  summary: 'Edit: complete MONDO:0016342 child-series coverage; classification and
    ICD risk-stratification evidence'
  details: |
    Requested as curation of 'familial isolated arrhythmogenic right ventricular dysplasia' (MONDO:0016342). Duplicate preflight against origin/main, all PRs and all issues showed that term is not a missing disease: it is already covered here as a skos:narrowMatch mondo_mapping added in PR #8191, and a narrowMatch counts as curated. So this is an EDIT of the existing MONDO:0016587 anchor entry rather than a new file, per the initiate-new-disorder-creation skill.

    Deep research: requested falcon per the default. The Edison endpoint rejected EDISON_API_KEY with 403 ProviderAuthError, so the run was re-issued with --fallback rather than substituting a provider by hand; openscientist produced the report. The report file keeps the -falcon name but its frontmatter records provider: openscientist, fell_back: true, requested_provider: falcon and the full provider_attempts list. The report carried no validation sections, so both were retro-fitted before anything was cited from it: references 35/35 resolved, 0 unresolved, 0 off topic; terms 34 checked, 33 resolved, 0 unresolved.

    Term validation caught one binding that would have been a real defect if copied across: the report calls HP:0007502 'Woolly hair', but that term is Follicular hyperkeratosis (woolly hair is HP:0002224). Checked KB-wide; HP:0007502 is used correctly in all four entries that carry it, and Naxos_disease and Carvajal_Syndrome both bind woolly hair to HP:0002224, so nothing needed repair. Nothing from that flagged set was bound here.

    Changes. 1. Added four mondo_mappings completing the gene-defined series under MONDO:0016342, each skos:narrowMatch following the existing ARVD5/10/11 pattern: MONDO:0012684 (ARVD12, JUP), MONDO:0000908 (ARVD13, CTNNA3), MONDO:0030062 (ARVD14, CDH2), MONDO:0007152 (ARVD1, TGFB3). Each gene is already curated in this entry with evidence. Every intersection_of definition was read off sqlite:obo:mondo with runoak rather than assumed. Because ClinGen's ARVC GCEP rates CTNNA3, CDH2 and TGFB3 as Limited (which this entry already records as their gene-level association), each justification states that the mapping asserts ontology coverage of the concept and not strengthened gene-disease validity.

    2. Deliberately did NOT map three ARVD terms that a naive gene sweep would have taken, because a KB-wide check showed they are already claimed elsewhere: MONDO:0011831 (ARVD8, DSP) is the primary disease_term of DSP_Cardiomyopathy, MONDO:0012180 (ARVD9, PKP2) is the primary disease_term of PKP2_Cardiomyopathy, and MONDO:0007152 is named by Rienhoff_Syndrome only as a differential diagnosis, which does not claim curation, so ARVD1 was mapped here but its Rienhoff relationship is recorded in the justification. ARVD3, ARVD4 and ARVD6 (MONDO:0011188/0011189/0011460) are locus-only terms defined by chromosomal region with no gene, so there is no gene-coverage basis to map them. The three anatomic-form children (MONDO:0017401 left dominant, MONDO:0017402 biventricular, MONDO:0017403 right dominant) were also left unmapped: left-dominant arrhythmogenic cardiomyopathy is substantively the DSP_Cardiomyopathy entity, and a narrowMatch here would retire those concepts from the curation queue on the strength of a progression phase rather than curated content.

    3. Added evidence for the previously uncited desmosomopathy mechanistic_category, quoting PMID:18662195 on familial ARVC gene mutations being predominantly desmosomal cell-adhesion proteins. That sentence was chosen because 'predominantly' matches the scope the classification note already claims; it was not previously used anywhere in kb/, so it introduces no snippet-grading divergence.

    4. Added a second evidence item to the Implantable cardioverter-defibrillator placement treatment (PMID:37474315) supporting its existing 'appropriately selected high-risk patients' clause with the validated individualized ARVC arrhythmic-risk calculator. This was the one substantive content gap the new report surfaced that the entry did not already cover; the report's other key findings were all already curated. The reference_title was corrected to the cached title after validation flagged a title mismatch.

    Validation: just validate passes; just validate-disorders (the authoritative batched gate CI runs) passes with 103/103 snippets verified, up from 101/101. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all pass on the file; whole-KB check-snippet-grading and check-environmental-evidence both pass with no new divergences. Compliance rose from 90.5 percent to 90.9 percent, with classifications.mechanistic_category evidence going 0/1 to 1/1. The datasets[].evidence 0/3 gap was left alone deliberately: bulk-generated dataset records carry no evidence block by repository policy. references_cache/PMID_34191271.md shows as modified because the sanctioned fetch tooling upgraded it from abstract_only to PMC full text; it was not hand-edited.

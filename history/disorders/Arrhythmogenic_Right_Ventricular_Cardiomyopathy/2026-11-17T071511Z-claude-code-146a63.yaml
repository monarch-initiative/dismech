  summary: Type the cardiac immune microtissue model system
  details: |
    exp_arvc_anti_dsg2_causal_epistasis declared 'Isogenic human mechanically loaded cardiac immune microtissue' with no experimental_model_type. Set to CO_CULTURE, whose definition is a multi-cell-type coculture system: the row combines ventricular iPSC cardiomyocytes with cardiac fibroblasts, endothelial cells, macrophages and natural killer cells. ORGAN_ON_CHIP was rejected because that value is defined as a microfluidic model and the description names only an electrically paced, mechanically loaded format with no microfluidics. The separate animal-model row in this same experiment is left with OTHER for the reason recorded in docs/explanation/experiment-model.md.

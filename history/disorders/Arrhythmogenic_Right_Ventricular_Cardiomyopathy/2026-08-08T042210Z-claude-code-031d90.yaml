  summary: 'Augment: ARVC pathograph wiring, MONDO mapping, imaging term bindings'
  details: |
    Augmented the existing ARVC entry [MONDO:0016587] rather than creating a new one: the priority dashboard reported MONDO:0016342 "familial isolated arrhythmogenic right ventricular dysplasia" as an uncurated gap, but that term is_a the MONDO:0016587 anchor already curated here, so this was a mapping gap rather than a missing disease.

    Changes. 1. Added an influences_mechanisms block wiring the competitive/endurance-exercise environmental entry into the pathograph, target "Intercalated-disc adhesion failure", environmental_effect EXACERBATES, causal_link_type DIRECT. Previously the exposure was a disconnected disease-level list item and never appeared in the pathograph. The link carries its own evidence: PMID:17030684, MODEL_ORGANISM, plakoglobin+/- mice in which endurance training accelerates the phenotype, paired with the already-curated human carrier data in PMID:24817548 so that model-organism evidence is not the sole support. 2. Added MONDO:0016342 as an explicit skos:narrowMatch mondo_mapping; narrow rather than exact because the anchor also subsumes the syndromic recessive Naxos and Carvajal forms that the "isolated presentation" restriction of MONDO:0016342 excludes. 3. Bound both previously free-text imaging_finding_terms to HP:6000664 and HP:0033118, both verified with OAK.

    Deep research. The claude_code provider was run and its report is committed, but the run was DEGRADED: no live web search executed, num_turns 1, no citations sidecar, and the report itself states it was written from model recall. Both PMIDs it offered as high-confidence were misattributed. PMID:16467587 resolves to a radiation-dosimetry physics paper and PMID:16769908 to a drug-eluting-stent registry paper. The two intended papers were recovered independently via PubMed esearch as PMID:16823493, Garcia-Gras, which the entry already cited correctly, and PMID:17030684, Kirchhof. Only the independently verified identifiers were used; no deep-research claim was curated without independent verification.

    Validation. just validate passes across schema, terms and references. Snippets 98/98 verified against cached references, up from 96/96. pytest -k "environmental_mechanism_targets or subtype_foreign_keys or unique" reported 3758 passed. Compliance moved from 89.3 to 90.2 percent.

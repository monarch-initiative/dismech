  summary: 'Genetics pass: ARVD8 and ARVD9 mappings added, adherens-junction genes
    wired into the pathograph'
  details: |
    Genetics pass for issue #12190 (d2g wiring-001), part of epic #12189.

    Research first. The entry already curated all seventeen ARVC genes with ClinGen
    gene-disease validity assertions and mapped seven numbered ARVD MONDO terms. The
    numbered series was then enumerated directly from MONDO through the OLS
    has_material_basis_in_germline_mutation_in (RO:0004003) link rather than from the issue
    checklist. MONDO carries twelve numbered terms; nine are gene-defined (ARVD1 TGFB3,
    ARVD5 TMEM43, ARVD8 DSP, ARVD9 PKP2, ARVD10 DSG2, ARVD11 DSC2, ARVD12 JUP, ARVD13 CTNNA3,
    ARVD14 CDH2) and three - ARVD3 (MONDO:0011188), ARVD4 (MONDO:0011189) and ARVD6
    (MONDO:0011460) - carry no causal-gene assertion at all, being historical linkage loci.

    What changed. Two MONDO mappings the entry was missing were added: MONDO:0011831 (ARVD8,
    DSP) and MONDO:0012180 (ARVD9, PKP2). These are the two strongest gene-disease
    relationships in ARVC and both genes were already curated here, so their absence from
    mappings was a genuine coverage gap - and they are the two the issue checklist did not
    list. CDH2 (hgnc:1759) and CTNNA3 (hgnc:2511) are now bound on the Intercalated-disc
    adhesion failure node as adherens-junction rather than desmosomal components, with two
    new references supplying the mechanism (PMID:23136403 for alphaT-catenin and the area
    composita, PMID:28280076 for N-cadherin) and with the Limited ClinGen grading restated on
    each descriptor so the binding is not read as an equal-strength causal claim. JUP and DSP
    are bound on the Nuclear plakoglobin and canonical Wnt suppression node, which the
    experiment already cited there is about.

    Decisions recorded in notes. The numbered ARVD series is deliberately not promoted to
    has_subtypes: the numbering is a locus-discovery sequence rather than a set of clinically
    separable subtypes, three members name a gene ClinGen grades Limited, and three of the
    twelve terms have no gene at all. That is a lump/split job of its own. Ten genes in the
    genetic block reach no pathophysiology node (TMEM43, LMNA, DES, PLN, SCN5A, TJP1, MYBPC3,
    MYH7, MYL3, TGFB3) because the pathograph has no node for the nuclear envelope, the
    intermediate filament network, sarcoplasmic calcium handling or the sarcomere; adding
    those nodes needs new literature and was left as follow-on work rather than approximated
    by binding genes to nodes they do not act at. SCN5A specifically was considered for the
    Gap-junction and sodium-channel remodeling node and rejected: no cached reference in this
    entry names SCN5A, and ClinGen grades it Limited.

    MONDO reconciliation. All seven checklist genes - TGFB3, DSG2, DSC2, JUP, CTNNA3, TMEM43,
    CDH2 - were already curated with bound HGNC terms before this pass. No disagreement with
    MONDO.

    Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches
    and validate-disorders all pass.

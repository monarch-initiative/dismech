  summary: 'Review round 1: regrade the CTNNA3 background quote, and account for ARVD2
    and ARVD7'
  details: |
    Review round 1 response on PR #12322 (issue #12190).

    Two changes.

    Took the reviewer's optional suggestion on the CTNNA3 evidence quoting PMID:23136403. The
    quoted sentence closes the paper's AIMS paragraph and states established protein
    biochemistry as the motivation for the screen that follows, so the item now carries
    quote_role: BACKGROUND. evidence_source moved from HUMAN_CLINICAL to IN_VITRO because the
    quoted text describes protein-binding and junction-assembly work rather than the paper's
    own 76-patient screen; the explanation now records both reasons.

    Self-review addition to the numbered ARVD series note. The note said MONDO carries twelve
    numbered terms without accounting for the two numbers a reader would notice missing.
    ARVD2 and ARVD7 are absent because MONDO has reclassified them out of the series rather
    than because the enumeration missed them: ARVD2 survives only as a synonym set on
    MONDO:0011484 catecholaminergic polymorphic ventricular tachycardia 1 (RYR2), where
    OMIM:600996 is recorded as equivalentObsolete, and ARVD7 survives only as a synonym set
    on MONDO:0011076 myofibrillar myopathy 1. Both concepts have their own dismech entries,
    RYR2_CPVT and Myofibrillar_Myopathy, so neither belongs in this entry. Checked through
    the same OLS route as the original enumeration.

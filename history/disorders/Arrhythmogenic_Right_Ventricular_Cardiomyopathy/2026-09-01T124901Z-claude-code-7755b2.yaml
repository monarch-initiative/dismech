  details: |
    Follow-up to the earlier session on PR #10364, addressing the one blocking finding from the ai4c-reviewer review.

    Correction to the immediately preceding history record for this entry. That record stated the ICD risk calculator 'was the one substantive content gap the new report surfaced' and that 'the report's other key findings were all already curated'. That was wrong. The deep-research report's finding F002 is 'Suppressed Wnt/beta-catenin AND activated Hippo signaling drive fibro-adipogenesis', and the entry curated only the Wnt half; grepping hippo, yap, taz, lats and mst1 returned zero hits across the whole file. The earlier record is left as written because history is append-only; this record carries the correction.

    Verified the finding independently before acting on it rather than taking the review on trust: confirmed Hippo absence (0 hits for all five terms), confirmed the proposed snippet is an exact substring of references_cache/PMID_24276085.md, confirmed the cached title, and confirmed GO:0035329 resolves with canonical label 'hippo signaling' via OAK.

    Departed from the reviewer's proposed shape on one point of substance. The review described Wnt and Hippo as 'two co-equal signaling arms converging on adipogenic/fibrotic reprogramming' and suggested routing the new node to the same downstream target the Wnt node feeds, i.e. parallel siblings. The cited paper does not show that: Chen SN et al. conclude that intercalated-disc remodeling 'leads to pathogenic activation of the Hippo pathway, suppression of the canonical Wnt signaling, and enhanced adipogenesis' in that order, and their Lats1/2 knockdown experiment rescues YAP AND beta-catenin AND adipogenesis together, which places Hippo causally upstream of the Wnt arm. Modeled it that way instead: Intercalated-disc adhesion failure -> Hippo pathway activation -> Nuclear plakoglobin and canonical Wnt suppression, which then feeds the pre-existing Fibrofatty myocardial replacement node. A parallel edge straight to fibrofatty replacement was deliberately not added, because adipogenesis already flows through the Wnt node and a second edge would assert an independent route the paper does not separate out.

    Changes. 1. New pathophysiology node 'Hippo pathway activation', biological_scale MOLECULAR, bound to GO:0035329 hippo signaling with modifier INCREASED. INCREASED rather than GAIN_OF_FUNCTION because the claim is quantitative -- the kinase cascade running above its normal level -- which is the PATO-grounded default under the repository's GOF/INCREASED guidance. 2. New downstream edge from the existing 'Intercalated-disc adhesion failure' node into it. 3. New downstream edge from it into the existing Wnt node.

    Evidence was split by study type rather than graded as one item, per the repository rule that a paper mixing sources gets separate evidence items. PMID:24276085 reports human hearts, two mouse models and an HL-1 myocyte knockdown in the same abstract. The node carries the human observation ('...activation of the upstream Hippo molecules in the human hearts') as HUMAN_CLINICAL; the Hippo-to-Wnt edge carries the Lats1/2 rescue experiment as IN_VITRO, since HL-1 is a cell line and not a model organism. Both snippets were verified as exact substrings before use.

    Validation: just validate-disorders passes with 106/106 snippets verified, up from 103/103. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens all pass, and whole-KB check-snippet-grading reports no new divergences despite PMID:24276085 now being cited three times across the node and two edges. Graph wiring confirmed by parsing the file: both new edges resolve to real node names. references_cache/PMID_24276085.md gained a single tool-written 'full_text_attempted: true' line; no cached content was removed.

    Not addressed in this push, and deliberately: the reviewer's non-blocking suggestion to model AAV9:PKP2 gene therapy as an animal_models entry with a RESCUES modeled_mechanisms link. It is preclinical, the reviewer marked it non-blocking, and it widens the PR beyond the mapping-plus-evidence scope; recorded here so it is not lost.

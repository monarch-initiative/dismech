    MONDO:0010585, EDARADD-related HED MONDO:0013983, WNT10A-related ectodermal
    dysplasia MONDO:0009773), and GO molecular_functions (GO:0005031, GO:0038023,
    GO:0005515) plus hgnc:2895 on the EDAR receptor pathophysiology nodes.

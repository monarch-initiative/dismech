  summary: Expand EDAR-Related Hypohidrotic Ectodermal Dysplasia with synonyms, Harrison's chapter classifications,
    inheritance, per-cohort genetic case fractions, progression, diagnostic criteria, differential diagnoses,
    and EDAR GO molecular function and HGNC gene bindings
  details: 'Reviewed kb/disorders/EDAR_Hypohidrotic_Ectodermal_Dysplasia.yaml (Issue #2916), retaining
    the core 5-node pathophysiology graph, 15 connected phenotype nodes, AR/AD subtypes, and 3 supportive
    treatments. Added top-level synonyms (HED2, EDAR-related HED, autosomal recessive/dominant HED, ectodermal
    dysplasia 10A/10B), classifications (DERMATOLOGY, GENETICS_ENVIRONMENT_DISEASE), top-level inheritance
    (Autosomal Recessive HP:0000007 and Autosomal Dominant HP:0000006 with GeneReviews transmission-risk
    citations), three per-cohort genetic[0].case_fractions records (16.0% in 61 French HED patients, 6.5%
    in 183 solved Russian HED probands, and 25.0% in 37 non-EDA HED patients), age-stratified progression
    (Infancy hyperthermia risk and Childhood to Adulthood ectodermal triad management), clinical and molecular
    diagnosis (NCIT:C20989 Physical Examination and NCIT:C15709 Genetic Testing), differential_diagnoses
    (X-linked HED MONDO:0010585, EDARADD-related HED MONDO:0013983, WNT10A-related ectodermal dysplasia
    MONDO:0009773), and GO molecular_functions (GO:0005031 tumor necrosis factor receptor activity) plus
    hgnc:2895 on the EDAR receptor pathophysiology nodes.'

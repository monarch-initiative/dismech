  summary: 'Review: connect 13 orphans; record why two craniofacial features stay
    unconnected (IUIS Table 6)'
  details: |
    Fifteen of 36 phenotypes had no incoming edge. Thirteen are now wired and two are deliberately not.

    The haemolysis node carries LDH and the haptoglobin paradox. That second edge is worth having precisely because it runs backwards: intravascular haemolysis normally consumes haptoglobin, but here the haptoglobin-haemoglobin complex is not cleared, because clearing it is the job of the macrophage compartment this disease disables. A normal or high haptoglobin does not exclude the diagnosis.

    The macrophage node carries all three splenic outcomes - absence, hypoplasia and enlargement. The entry curates four different splenic presentations because all four are reported and none excludes the diagnosis; the edges say so rather than picking one.

    Prominent forehead and depressed nasal bridge are left unconnected with the reason recorded. The reviewing authors explicitly caution against treating the forehead finding as a uniform characteristic and describe no disease-specific gestalt, and nothing cited traces a route from a defect in stress-inducible heme catabolism to craniofacial development. Being repeatedly reported is not being explained.

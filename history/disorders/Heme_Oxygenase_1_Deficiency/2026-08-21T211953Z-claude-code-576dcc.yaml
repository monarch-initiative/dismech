  summary: 'Create: Heme Oxygenase 1 Deficiency (HMOX1)'
  details: |
    De-novo curation of heme oxygenase 1 deficiency (MONDO:0013536), an ultra-rare
    autosomal recessive HMOX1 disorder, claimed via issue #9196. The stub
    stubs/Heme_Oxygenase_1_Deficiency.yaml is deleted in the same PR. Entry type
    decided as DISEASE: MONDO records no descendants and a single causal gene, so
    this is a leaf entity with one conserved pathograph, not a grouping.

    PATHOGRAPH. Organised around the framing that makes this disease unusual:
    HMOX1 encodes the stress-INDUCIBLE heme oxygenase isozyme, so the disorder is
    loss of a cytoprotective response rather than accumulation of a stored
    substrate - the inverse of the usual storage-disease shape. A single enzymatic
    block, "Failure of Stress-Inducible Heme Catabolism", fans out into four arms,
    one per lost reaction product plus the uncleared substrate: circulating free
    heme accumulation; loss of bilirubin antioxidant capacity, which is also why
    serum bilirubin fails to rise (staying low or normal) despite brisk
    intravascular haemolysis;
    loss of carbon monoxide cytoprotective signalling; and impaired heme-iron
    recycling with tissue iron deposition. These converge through macrophage and
    monocyte dysfunction, endothelial injury with coagulopathy, and intravascular
    haemolysis onto a systemic inflammatory endpoint. 9 pathophysiology nodes and
    16 causal edges, every edge carrying its own evidence item.

    EVIDENCE DISCIPLINE. This was the main risk for this disease: only about
    eleven human patients have been reported, so a large share of the mechanism
    rests on rodents. All mouse and rat data are tagged evidence_source:
    MODEL_ORGANISM and are never the sole support for a human phenotype - every
    phenotype cites a human case report or the human case-series review. Three
    animal models are curated with modeled_mechanisms links, including a
    FAILS_TO_RECAPITULATE link for the Hmox1-deficient rat, which does not
    reproduce the hepatic and renal iron deposition that is cardinal in both human
    patients and mice.

    That rat divergence, together with the strain-dependent mouse splenic
    phenotype - splenomegaly on C57BL/6 versus progressive red-pulp atrophy and
    functional hyposplenism on a mixed background, against human asplenia - is
    recorded as a HUMAN_MODEL_MISMATCH discussion rather than a generic
    KNOWLEDGE_GAP, because evidence exists in the models and it is their
    translational validity that is the open question. It carries two proposed
    experiments. A separate KNOWLEDGE_GAP records the unexplained onset
    variability: age at first symptom ranges from 6 months to 15 years among
    patients sharing the identical homozygous p.R44X founder allele.

    NEGATIVE RESULTS ARE CURATED. Corticosteroids, cyclophosphamide, rituximab,
    anti-IL-1R, anti-IL-6 and cyclosporine are recorded with supports: REFUTE,
    since consistent therapeutic failure is a clinically important finding here.
    The HO-1-induction and CO-releasing-molecule strategy is scored PARTIAL with
    an explicit note that pharmacological HO-1 induction is conceptually futile in
    null genotypes where there is no enzyme to induce.

    WHAT THE DR REPORT ACTUALLY ADDED. The falcon report cited almost all of its
    content to page ranges of the same Yachie 2021 review the entry was already
    built on, and supplied no verbatim abstract quotes, so nothing was copied from
    it. It was useful as a gap-finder: it surfaced full-text claims in a paper
    already cached, and every resulting addition was quoted directly from that
    cache. Added on that basis: proper frequency evidence replacing weaker
    "common findings" wording (fever and haemolytic anaemia "constant findings";
    bilirubin low or normal "in all cases"; leukocyte and platelet increases
    "invariably noted in all cases" - the last also being what distinguishes this
    from HLH and classical DIC); hypertension and intracranial haemorrhage as
    phenotypes, both carrying the review's own explicit statement that they are
    NOT constant, so neither asserts a frequency band; pericardial effusion in the
    Iranian p.K204X patient; direct human evidence of vacuolated monocytes with
    reduced surface antigens, so the macrophage/monocyte node no longer rests on
    mouse data alone; and an in-utero ascertainment caveat on the prevalence
    record, which is why the reported case count is recorded as a floor rather
    than an estimate of true birth incidence.

    The report's single biggest lead was cited by DOI only and therefore unusable
    as given, so the PMID was recovered independently via PubMed: PMID:24963040,
    Kovtunovych et al., wild-type macrophages reverse disease in Hmox1-null mice.
    This was added as a RESCUES modeled_mechanism link and a matching
    investigational treatment (subablative BMT / engineered-macrophage cell
    therapy, therapeutic_modality CELL_THERAPY, target_mechanisms RESTORES on the
    macrophage node). It is the strongest evidence in the entry that macrophage
    failure is causally sufficient rather than merely correlated, and it is
    labelled preclinical-only throughout: no human with HMOX1 deficiency has been
    reported as treated this way.

    ONE DR-SUPPLIED IDENTIFIER WAS REJECTED. The report offered PMID:9927502 for
    the 1999 Yachie J Clin Invest paper; that paper is PMID:9884342, which the
    entry already cited, so 9927502 was not used.

    DEEP RESEARCH. A falcon (Edison) run was performed:
    research/Heme_Oxygenase_1_Deficiency-deep-research-falcon.md. Its own
    reference-validation block reports 9/9 references resolved with
    confabulation_rate 0.0 and no unresolved references. NEC preflight against
    MONDO:0013536 returned PASS - HMOX1 dominant at 17 mentions with no rival gene
    discussed, MONDO OMIM xref 614034. The KB entry was nonetheless built from
    primary literature fetched and read directly rather than from DR prose:
    PMID:9884342 (Yachie index case), PMID:9380735 and PMID:9380736 (Poss and
    Tonegawa mouse papers), PMID:21088618, PMID:33066778, PMID:36502441, and the
    human case-series review PMID:33546372.

    TWO CANDIDATE REFERENCES WERE DISCARDED during curation rather than cited.
    PMID:10426374 was fetched intending the Otterbein CO anti-inflammatory study
    but resolved to an unrelated glucosamine and insulin-resistance paper, so it
    was dropped. PMID:3029864 (Stocker, bilirubin as an antioxidant) cached as
    title and metadata with no abstract, so it was dropped rather than cited by
    its title, per the "a title is not a finding" rule.

    NO GENEREVIEWS BASELINE. PubMed was searched for a GeneReviews chapter for
    this disease and returned zero hits, so no GeneReviews phenotype baseline was
    available to cross-reference.

    TERM CORRECTIONS. Two bindings were corrected by the validator rather than
    assumed. HP:0020180 has canonical label "Elevated circulating haptoglobin
    concentration"; the local OAK build returned a stale "Elevated haptoglobin
    level", and the authoritative check caught the mismatch. NCIT:C2322
    Corticosteroid is not a member of the ChemicalEntityTerm dynamic enum, so no
    therapeutic_agent is bound on the immunosuppression treatment; the reason is
    recorded in that treatment's own description, since the reported agents span
    small molecules, calcineurin inhibitors and monoclonal antibodies and no
    single agent identity describes the class.

    PRE-PR ADVERSARIAL REVIEW. Before opening the PR the entry was reviewed
    adversarially against the cached sources, specifically for evidence-claim
    mismatch (a snippet that verifies verbatim but does not support the claim it
    is attached to — the failure class no validator can catch). Ten findings,
    all acted on:

    1. The free-heme node and the "Serum heme" biochemical marker quoted a
       sentence about OxyHb/MetHb spectra, i.e. cell-free haemoglobin species,
       not free heme — and the source's next paragraph offers "Hb accumulating in
       serum" as a competing reading of exactly that observation. Replaced with
       the direct measurement, "Serum heme concentration was extremely high, at
       490 uM (normal range; <1 uM)."
    2. The elevated-haptoglobin phenotype was supported only by a sentence about
       the Hb-Hp complex overflowing into urine, which never states haptoglobin
       is raised. Replaced with the quantitative measurement (800-1200 mg/dL
       against a 40-180 mg/dL reference range); the urine-overflow sentence is
       retained as a separate PARTIAL item for the proposed mechanism, and the
       description no longer states that mechanism flatly because the source
       hedges it as happening "somehow".
    3. The free-heme -> endothelial-injury edge cited an abstract *background*
       sentence that says nothing about heme causing endothelial injury.
       Re-evidenced with the patient-cell hemin-sensitivity result, downgraded to
       PARTIAL, and the edge changed from DIRECT to
       INDIRECT_UNKNOWN_INTERMEDIATES — the cells tested were lymphoblastoid, not
       endothelial, so heme cytotoxicity toward patient endothelium is inferred.
    4. Five evidence items tagged HUMAN_CLINICAL were review *background*
       sentences of mixed provenance ("In vivo and in vitro studies have
       indicated...") or statements citing other references. Retagged OTHER. The
       macrophage node's claim to rest on more than mouse data now stands on the
       genuinely human observation (vacuolated patient monocytes with reduced
       surface antigens), not on those.
    5. The CO arm was overstated: two DIRECT human edges rested on an in-vitro
       CO-donor add-back. Both edges softened to indirect, and the prose now says
       the attribution is a hypothesis and that endogenous CO deficiency has
       never been measured in a patient.
    6. Hypobilirubinaemia carried frequency VERY_FREQUENT on a source saying
       bilirubin was "low or within normal ranges in all cases" — which
       establishes universal failure-to-rise, not that frank hypobilirubinaemia
       (the bound HP term) occurs in 80%+ of patients. Band removed per the
       "omit rather than fabricate" rule, with the reasoning recorded inline.
       The entry description was softened from "No bilirubin is generated"
       likewise.
    7. The hyperlipidaemia description gave index-case lipid values that the
       attached snippet did not contain. The quantitative sentence was located in
       the cached full text and added.
    8. The rat FAILS_TO_RECAPITULATE evidence was scored REFUTE while its
       explanation said the quote demonstrates the failure. Corrected to SUPPORT:
       the link's claim is the negative one, and the quote is positive evidence
       for it. (Treatment-failure items keep REFUTE, which is correct there —
       those refute efficacy.)
    9. A snippet began mid-name ("dimer suppressed TNF-alpha...") which hid that
       the agent was a CO-releasing molecule. Quoted in full.
    10. modifier: DECREASED on two homeostasis GO terms was wrong in kind —
        homeostasis is disrupted, not decreased — so both are now ABNORMAL. The
        entry also asserted three HO isozymes while its own other citation says
        two; the count is now not asserted, with the HO-3-pseudogene reason
        recorded, since nothing here depends on it.

    SECOND-OPINION REVIEW ON THE CLAIM ISSUE (#9196). A research agent posted a
    detailed literature review on the claim issue, which was treated as review
    input and acted on after the PR opened. It changed the entry materially:

    - It named PMID:11823983 (Kawashima 2002, the first autopsy), which contains
      a PUBLISHED FIRST-PARTY mouse/human mismatch claim: the human case "seems
      to more severely involve endothelial cells and the reticuloendothelial
      system... with a short survival. This contrasts to the predominant iron
      metabolic disorders of HO-1--targeted mice with a long survival." This is a
      far stronger anchor for the HUMAN_MODEL_MISMATCH discussion than the
      cross-paper inference it previously rested on, and is now its lead evidence
      item.
    - It named PMID:25682599, which reports that red cell lifespan is PROLONGED
      in Hmox1-null mice while human patients have shortened red cell survival
      with fragmentation. This is an opposite-direction divergence rather than a
      difference of degree, and is now curated as a second
      FAILS_TO_RECAPITULATE link (on the haemolysis node) with its own readout,
      plus a third arm of the mismatch discussion. Its practical consequence is
      recorded explicitly: no conformance to a haemolysis mechanism module may be
      asserted for this disease on mouse evidence.
    - It named PMID:40945734 (J Biol Chem 2025), the one genuine therapeutic lead
      in this literature: ascorbate is depleted in patient LCLs and HMOX1-null
      HEK293T cells, and 2-phospho-L-ascorbic acid restores viability under hemin
      stress via SVCT2. Added as a treatment at PROPOSED grade, PARTIAL/IN_VITRO,
      explicitly not an established therapy.
    - It flagged an evidence-source trap specific to this disease: much of the
      mechanistic "human" work is done in patient-derived lymphoblastoid cell
      lines, which is IN_VITRO and not HUMAN_CLINICAL even though the papers read
      as case reports. One item (PMID:33066778 Western blot on patient cells) was
      retagged IN_VITRO on that basis; the PMID:9884342 item was kept
      HUMAN_CLINICAL because the quoted sentence's other half is
      immunohistochemistry on patient hepatic tissue, with the mixed provenance
      now stated in its explanation.
    - It supplied four scoping decisions now recorded in a top-level `notes`
      block so they are not re-proposed: this entry must NOT join the
      Inherited_Porphyrias grouping (that grouping is scoped to heme
      BIOSYNTHESIS blocks and none of its NECESSARY criteria are met, so joining
      would manufacture a check-groupings contradiction); granuloma_formation
      conformance was considered and rejected (cholesterol granulomas are a
      lipid/foreign-body reaction, not the Th1/TNF epithelioid programme); the
      HMOX1 GT(n) promoter-microsatellite literature is a distinct non-Mendelian
      entity and out of scope, and is the dominant search contaminant for this
      gene; and published case counts disagree and are deliberately left
      unreconciled.

    Suggestions from that review NOT acted on, with reasons: HPOA carries
    HP:0004844 Coombs-POSITIVE haemolytic anaemia for OMIM:614034, which
    contradicts the antibody-negative haemolysis this entry curates from
    PMID:33066778, so it was not added on the strength of an annotation that
    disagrees with the primary text. Several further HPOA phenotypes (diffuse
    alveolar haemorrhage, epistaxis, lymphadenopathy, sepsis, raised CRP and
    IL-6, transaminases) were left for a follow-up pass rather than added without
    reading each primary source. An amyloidogenesis conformance via the AA arm
    and a speculative atherogenesis node (aortic fatty streaks in a six-year-old,
    PMID:11823983) are both reasonable and are deferred rather than rejected.

    VALIDATION, all run and output read. just validate PASS. just validate-terms
    PASS. just count-verified-snippets 119/119 verified against cached references.
    just validate-disorders (the batched pre-PR sweep CI runs) PASS. The ungated
    whole-KB CI gates all PASS: check-folded-hyphens, check-duplicate-keys,

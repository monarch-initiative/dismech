  summary: Address ai4c-reviewer changes-requested review on PR 9399
  details: |
    Acted on the four IMPORTANT items in the ai4c-reviewer CHANGES_REQUESTED review of PR #9399.

    1. Prose/data mismatch on the CO arm. The "Loss of Carbon Monoxide Cytoprotective Signalling" node argues in its own description that endogenous CO deficiency has never been measured in a patient, and that the supporting experiment is an in vitro CO-releasing-molecule add-back in HUVECs, concluding that both downstream edges are marked indirect. Both edges nevertheless carried causal_link_type: DIRECT. Changed both (to "Endothelial Cell Injury and Coagulopathy" and to "Systemic Inflammatory Response and Progressive Organ Injury") to INDIRECT_UNKNOWN_INTERMEDIATES so the data matches the argument the node makes.

    2. evidence_source inconsistency on PMID:33546372 review background. Three evidence items on the "Failure of Stress-Inducible Heme Catabolism" node quote general HO-1 enzymology, or a stated expectation from the review, rather than an observation in patients, and were tagged HUMAN_CLINICAL. Retagged all three to OTHER, matching how the same file already tags the same class of statement from the same review on the CO node. The reviewer flagged two; the third ("Therefore, any defect in the function of HO-1 would be expected to lead to uncontrollable inflammation...") is a stated expectation in a review and belongs in the same class, so it was retagged for consistency and called out on the PR.

    3. Added the missing "Secondary AA Renal Amyloidosis" phenotype (category Renal), bound to HP:0001917 Renal amyloidosis. Secondary AA amyloidosis was already present in the description, the terminal pathophysiology node, the genetic section and a discussion, but was not modelled as a phenotype, while single-patient findings such as Pericardial Effusion were. Three evidence items from PMID:36502441, all exact abstract quotes: the AA-type renal amyloidosis observation in the 30-year-old patient; the clinical-exome confirmation of the homozygous G139V genotype, so the amyloidosis is attributable to this disease rather than to an unrelated inflammatory diagnosis; and the authors' statement that this was the first such report, which is the reason no frequency band is asserted.

    4. Added a diagnosis: section with three entries, placed after treatments: per the conventional key order.
       - "Recognition of haemolysis without hyperbilirubinaemia" (NCIT:C47868 Blood Chemistry Measurement) - the entry point, a routine laboratory pattern rather than a specialised test. Three evidence items: the hallmark triad from PMID:33066778 (direct-antibody-negative haemolysis with normal bilirubin); the independent "cardinal laboratory features" statement from PMID:38178812; and the worked instance from PMID:33546372 where persistently elevated LDH with low bilirubin is what led to HMOX1 analysis.
       - "HO-1 induction assay in patient-derived cells" (NCIT:C25294 Laboratory Procedure) - the functional confirmation. Written as an induction assay because HO-1 is absent at rest in controls too, so an unstimulated sample is uninformative. Four IN_VITRO evidence items: the original cadmium-stimulated LCL immunoblot from PMID:9884342; the cadmium/sodium-arsenite monocyte version from PMID:33546372; the later independent application with the paired hemin-viability readout from PMID:38178812, which used it to establish the pathogenicity of a previously unreported variant; and the third independent use in PMID:33066778.
       - "HMOX1 molecular confirmation" (NCIT:C15709 Genetic Testing) - sequencing plus deletion/duplication and splice analysis. The rationale is drawn from the reported genotypes rather than asserted generically: PMID:9884342 documents a whole-exon-2 deletion on the maternal allele, which sequencing alone would miss and which would report the patient as a heterozygous carrier; PMID:33066778 documents an intronic splice-donor allele requiring splice-level interpretation; PMID:36502441 documents clinical exome sequencing reaching the diagnosis where the disease was not suspected in advance. The section also records that the promoter (GT)n microsatellite literature has no diagnostic role here, consistent with the existing scoping note in this entry.

    All three NCIT diagnosis terms were already present in cache/ncit/terms.csv and in the treatmentactionterm enum membership cache, so this change added no cache rows.

    Three errors were caught during the session and are worth recording. A reference_title for PMID:38178812 was written from memory and did not match the cached record; it was corrected at both occurrences against references_cache/PMID_38178812.md. One snippet was written as "lack of HO-1 protein" where PMID:33066778 says "lack of HMOX1 protein"; count-verified-snippets caught it and it was corrected to the exact wording. An onset: block on the new phenotype was blocked by the pre-edit validation hook, because Phenotype has no onset slot.

    Nothing on the blocking list was declined. The reviewer's SUGGESTION items were deliberately left for a follow-up rather than pushed after approval, since a later push would dismiss the approval under dismiss_stale_reviews.

    Validation after these changes: just validate (133/133 snippets verified, up from 120/120), just validate-terms, and just validate-disorders (schema + terms + references batched, the command CI runs) - all pass. Ungated CI gates all pass: check-duplicate-keys over 4322 files, check-folded-hyphens, check-title-snippets, check-snippet-length, check-environmental-evidence (the last three grandfathered against origin/main, no new findings), and check-source-defect-claims. check-term-cache-integrity passes after the rebase, and every modified cache file was confirmed a proper superset of origin/main with no dropped rows. Rebased onto origin/main with no conflicts; the only deletion against main is this entry's own stub.

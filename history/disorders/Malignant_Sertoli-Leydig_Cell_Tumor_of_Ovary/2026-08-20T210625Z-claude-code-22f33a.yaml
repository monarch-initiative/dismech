  summary: 'Create: Malignant Sertoli-Leydig Cell Tumor of Ovary'
  details: |
    Created the malignant ovarian Sertoli-Leydig cell tumor entry (MONDO:0020542) as the second of two mechanism-bearing Disease entries split out of the malignant ovarian sex cord-stromal tumor umbrella (issue #9002), alongside the new kb/groupings/Ovarian_Sex_Cord-Stromal_Tumors.yaml grouping that unions it with Adult Granulosa Cell Tumor of Ovary. Curated six pathophysiology nodes: germline DICER1 loss-of-function predisposition -> somatic DICER1 RNase IIIb metal-binding hotspot mutation -> loss of 5p-strand miRNA processing with 3p strand bias -> derepression of 5p-miRNA target transcripts -> Sertoli-Leydig tumor formation with heterologous/retiform differentiation -> tumor androgen overproduction. Deliberately curated the hotspot lesion as a hypomorphic, activity-altering allele (RNase IIIa retained, RNase IIIb lost) rather than a null. Entry scope is the MALIGNANT MONDO class, which is mechanistically load-bearing: DICER1 variants are confined to moderately/poorly differentiated and retiform tumors, and an 18-case series of well-differentiated SLCT was entirely DICER1 wild-type. No hallmark mechanism module conformance was asserted, because none could be evidenced for this tumor without overreach. Added a KNOWLEDGE_GAP discussion recording that the FOXL2-mutant and DICER1/FOXL2 double-wild-type SLCT subsets have no established mechanism, with a proposed whole-genome-sequencing experiment. Deep research: falcon (Edison), report at research/Malignant_Sertoli-Leydig_Cell_Tumor_of_Ovary-deep-research-falcon.md; its own reference validation reported 5/5 references resolved, 0 unresolved, 5/5 on topic. 'just preflight-dr' returned SKIP because MONDO records no causal gene for this somatic-driver cancer class; the manual NEC fallback passed - DICER1 dominates the report's gene mentions 69 to 10 over FOXL2, and MONDO:0020542 carries no OMIM xref to conflict. One claim in the report was found to be MIS-ATTRIBUTED (a mouse-model finding credited to a human case series) and was deliberately NOT curated. All evidence was curated from primary literature fetched with 'just fetch-reference' and verified against the cached abstracts independently of the report. Validation actually run and read: 'just validate' schema clean; 'just validate-terms' passed (it caught one wrong NCIT id I had guessed - C15420 is Hypnotherapy, not Screening - which was replaced with C15576 Screening for Ovarian Cancer); 'just count-verified-snippets' reported 46/46 for this file and 96/96 across both new disorder files; 'just validate-disorders' over both files passed with 96/96 snippets; 'just check-duplicate-keys' clean over 4242 files; 'just check-groupings kb/groupings/Ovarian_Sex_Cord-Stromal_Tumors.yaml --strict' exited 0. Note: the repository history layout (docs/history.md) defines no 'grouping' kind, so the new grouping file has no history record of its own and is recorded here and in the Adult_Granulosa_Cell_Tumor_of_Ovary record instead.

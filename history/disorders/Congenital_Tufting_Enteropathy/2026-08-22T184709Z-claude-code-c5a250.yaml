  summary: 'Create: Congenital Tufting Enteropathy'
  details: |
    New entry; the second prototype of the defective enterocyte trafficking and polarity CODE class.

    MONDO:0013184, causal gene EPCAM confirmed against MONDO before curation.

    Five-node chain with a deliberate two-arm effector layer: loss of functional EpCAM at the cell surface (trigger) -> apical junctional complex disassembly and barrier failure via loss of claudin-7 recruitment (central_effector) -> in parallel, epithelial dysplasia and focal tuft formation (the morphological arm, via tricellular junction hypercontractility) and loss of absorptive and ion-transport function (the functional arm) -> intractable diarrhea and intestinal failure.

    The SPINT2 syndromic form is curated as a second genetic block rather than a separate disease because it converges mechanistically on EpCAM loss through unrestrained matriptase activity; per-gene case fractions (74% EPCAM / 26% SPINT2) are recorded as structured case_fractions with their own evidence. Genotype-segregating extraintestinal phenotypes (arthritis with EPCAM, ophthalmological disease and atresias with SPINT2) are curated with subtype foreign keys to the two has_subtypes entries.

    Deliberately does NOT conform to diet_induced_osmotic_diarrhea despite having an osmotic component, because that component is downstream of junctional and transporter loss rather than a primary substrate-specific digestive defect, and the diarrhea persists on fasting.

    Validation: linkml-validate clean; linkml-term-validator clean after correcting a guessed HP code for punctate keratitis (HP:0025436, which is elevated serum 11-deoxycortisol, -> HP:0011859); 25/25 snippets verified against cached abstracts.

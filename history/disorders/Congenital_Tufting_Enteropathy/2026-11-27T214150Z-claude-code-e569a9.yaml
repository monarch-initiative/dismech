  summary: 'Curate phenotypes: Congenital Tufting Enteropathy'
  details: |
    Expanded phenotypes from 5 to 20 using three full-text sources already in references_cache: the Das and Sivagnanam 2020 review (PMID:33374714), the Thiagarajah 2018 review of infant chronic diarrhea (PMID:29654747), and the Pathak 2019 EPCAM mutation update (PMID:30461124, read for counts; none map to an HP phenotype). Added secretory and osmotic diarrhea, steatorrhea, vomiting, abdominal distention, dehydration, weight loss, cataract, corneal erosion, choanal, intestinal and anal atresia (scoped to the SPINT2 syndromic form), skeletal dysplasia, cholestatic liver disease and a SOURCE_UNSPECIFIED skin binding. Fixed existing rows: the diarrhea phenotype was rebound from HP:0002014 Diarrhea to HP:0002041 Intractable diarrhea to match its preferred term and given an onset range of birth to 3 months; the uncounted VERY_FREQUENT band on villous atrophy was removed; the failure-to-thrive snippet was replaced with the sentence that states failure to thrive; punctate keratitis and arthritis gained direct snippets. Wired seven phenotypes from existing pathophysiology nodes with bare-name downstream targets. New references could not be fetched in this session because NCBI, Europe PMC, Crossref and Orphadata were unreachable through the network proxy. Validated with validate, count-verified-snippets (55/55), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions.

  summary: 'Address PR #9383 review findings'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #9383 from ai4c-reviewer[bot]. Every finding was independently verified before acting; two of the reviewer's suggestions were checked and declined with reasons.

    CRITICAL (confirmed, fixed): Congenital_Tufting_Enteropathy prevalence_class was BELOW_1_IN_1000000 while its own rate_low/rate_high said 1-2 per 100,000, i.e. 10-20 per 1,000,000 - wrong by 10-20x, and in a machine-queryable slot. Corrected to BAND_1_9_PER_100000. My error.

    Structural fixes:
    - Microvillus_Inclusion_Disease: the hepatic node was an orphan (nothing targeted it, no downstream), so the arm was disconnected from the MYO5B trigger whose sharing is its entire thesis. Added the trigger edge; the pathograph is now a single connected component.
    - Congenital_Sodium_Diarrhea: the trigger node was disjunctive, carrying LOSS_OF_FUNCTION on the NHE3 exchanger and GAIN_OF_FUNCTION on guanylate cyclase C together. The sources place GC-C activation UPSTREAM of NHE3 inhibition, so this was split into two sequential nodes joined by a downstream edge, with the GC-C evidence moved onto its own node.
    - enterocyte_polarity_trafficking_failure: the single blended trigger let a conformer implicitly assert the other arm's lesion. Split into two arm-specific trigger nodes following the separate-arm precedent the reviewer cited (defective_skeletal_mineralization, bilirubin_conjugation_transport). MVID now enters via the trafficking arm, CTE via the adhesion arm, and both module notes and the CLAUDE.md registry line record that arm selection is the curator's first decision.
    - Two conformance edges crossed a scale boundary (a CELLULAR capacity-loss node pointed at the module's ORGANISM-level diarrhea node) in MVID and CTE. Both retargeted to the central effector. This leaves each entry mapping two of its own nodes onto that one module node, which is honest: the module node is deliberately coarser than the structural/functional split the conformers curate, and the module notes now say so.

    Evidence fixes:
    - Four snippets were verbatim and real but did not support the claim they were attached to (MVID absorptive capacity, MVID villous atrophy, MVID dehydration, CLD hypokalemia). All four replaced with quotes from PMID:29654747 that state the claim directly; each replacement was verified as an exact substring in context before use. One of these initially kept the old PMID alongside the new snippet - caught by the snippet audit and corrected.
    - Interleukin-10_Receptor_Deficiency: GO:0032760 positive regulation of TNF production with INCREASED inverted the biology, asserting a pro-TNF regulatory arm was upregulated when the lesion is loss of the brake. Replaced with GO:0032640 tumor necrosis factor production + INCREASED.
    - Congenital_Tufting_Enteropathy: evidence_source was OTHER on a mutant-EpCAM-mouse study whose own explanation called it model-organism evidence. Corrected to MODEL_ORGANISM.
    - Two more frequency bands without frequency evidence removed (CLD metabolic alkalosis, DGAT1 failure to thrive), continuing the same discipline applied in the earlier self-review pass.

    GeneReviews baseline (reviewer finding 11): the reviewer could not run this check in their environment. I ran it, and my first query returned a false negative - the positive controls (Marfan, cystic fibrosis, Rett) also came back empty, which showed the query was broken rather than the result being real. A corrected query with a working control found that trichohepatoenteric syndrome DOES have a GeneReviews chapter (PMID:29334452); the other six do not. The chapter was fetched and mined, and it materially improved the entry: woolly hair is "seen in all" so its band moved VERY_FREQUENT -> OBLIGATE, diarrhea is "almost all" so its band moved OBLIGATE -> VERY_FREQUENT, and two new phenotypes were added, including mild intellectual disability at an explicitly quantified ~50% (FREQUENT). A GeneReviews-tagged references block was added following the IPEX_Syndrome pattern, plus a note that GeneReviews now uses the renamed symbols SKIC3/SKIC2.

    Accepted suggestions: bound both THES has_subtypes to their MONDO children (MONDO:0024541, MONDO:0013818); SKIV2L GO:0004386 helicase activity -> GO:0003724 RNA helicase activity; NCIT specificity for parenteral nutrition (NCIT:C29484) and small bowel transplantation (NCIT:C157985) in the four files where those are exactly right - deliberately NOT applied to the CCD/CSD salt-replacement treatments, which are not parenteral nutrition.

    Declined with reasons: the suggested NO_EFFECT treatment_effect does not exist in TreatmentEffectEnum (values are INHIBITS, ACTIVATES, MODULATES, BYPASSES, RESTORES), so the IL-10R conventional-therapy record keeps MODULATES + REFUTE. The suggested anion-antiporter GO term for DRA resolves to GO:0015301, which is obsolete, so GO:0015108 is retained.

    Validation: linkml-validate clean on all 8 changed files; linkml-term-validator clean; 180/180 snippets verified; 4568 conformance/subtype/uniqueness tests pass; folded-hyphen, duplicate-key and source-defect gates clean.

  summary: Backfill agent_life_cycle (10115, R26)
  details: |
    Added agent_life_cycle for Dientamoeba fragilis, deliberately recording how little of the cycle is settled. Hosts: Homo sapiens (NCBITaxon:9606) as the only established host, and Enterobius vermicularis (NCBITaxon:51028) recorded with a role that marks it a proposed egg-carriage vehicle rather than a host, since the evidence is D. fragilis DNA inside surface-sterilized pinworm eggs and not parasite development. Vector string names the pinworm-egg route as proposed and unconfirmed. Two stages: trophozoite stage in the human large intestine (OPL:0000057 trophozoite stage; PMID:10795375, snippet copied from the transmission block with its HUMAN_CLINICAL grading unchanged) and a cyst stage recorded as demonstrated only in experimentally infected rodents (PMID:38250789, the TEM study on cysts from mice and rats). Block evidence PMID:27170141 states that the life cycle and mode of transmission are not completely known. No animal reservoir recorded, because none is established; the experimental rodents are not recorded as hosts. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (367/367 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

  summary: 'Review: temper contested-pathogenicity overreach and unsupported frequency
    bands'
  details: |
    Manual claim-vs-evidence review. D. fragilis is non-invasive and its pathogenicity is genuinely contested, so several mechanistic assertions overreached their evidence and were softened: the 'Mucosal inflammatory response' node now states the inflammatory mechanism is inferred from clinical symptom association rather than demonstrated histologically; the PMID:40153748 explanation no longer claims the parasite-load/symptom association is 'mediated through mucosal inflammatory mechanisms' (the paper says nothing about mechanism). Frequency bands not supported by their snippets were corrected: abdominal pain and diarrhea VERY_FREQUENT to FREQUENT (28.2% / 23-54% quantitative anchors), flatulence and pruritus to OCCASIONAL (16.5% / 27.1%). The pruritus PMID:10795375 item was mislabeled supports=NO_EVIDENCE for a snippet that documents pruritus, corrected to PARTIAL. Removed an IBS distinguishing-feature bullet ('D. fragilis symptoms resolve with targeted antiprotozoal treatment') that directly contradicted the entry's own REFUTE evidence (PMID:24647023, PMID:39540993 showed parasitological clearance without symptom improvement). All snippets confirmed exact substrings of caches; no fabricated citations. Structured KNOWLEDGE_GAP for the pathogenicity debate deferred to #6309.

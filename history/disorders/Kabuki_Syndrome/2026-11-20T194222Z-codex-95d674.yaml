  summary: Map Kabuki syndrome to OMIMPS:147920
  details: |
    Checked actual series membership in January 2026 OMIM and class scope in September 2026 MONDO against the current Disease and its subtypes. PS147920 contains KMT2D-related Kabuki syndrome 1 (OMIM:147920) and KDM6A-related Kabuki syndrome 2 (OMIM:300867) in the January 2026 OMIM snapshot. Both are already modeled as subtypes in this Disease entry and are the two children of MONDO:0016512, which maps exactly to the series in September 2026. Their shared developmental chromatin-regulation defect and recognizable Kabuki clinical syndrome support the syndrome-level alignment. The KMT2D and KDM6A forms retain their different inheritance and clinical features; neither autosomal dominance nor involvement of one gene is imposed on the whole series. The mapping does not include all chromatin disorders or other allelic KMT2D phenotypes.

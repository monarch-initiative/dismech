  summary: 'Create: Wooly Hair-Palmoplantar Keratoderma Syndrome'
  details: |
    New entry for KANK2-related woolly hair-palmoplantar keratoderma syndrome (MONDO:0014492, keratoderma with woolly hair type IV). The deep-research source was a single Perplexity report (research/Wooly_Hair-Palmoplantar_Keratoderma_Syndrome-deep-research-perplexity.md); just preflight-dr returned PASS (KANK2 mentioned 43 times, MONDO OMIM 616099), and its reference validation resolved 16/16 references. The report's acitretin CURIE (CHEBI:50173) was not used; acitretin is CHEBI:50172. just check-genereviews --online found no GeneReviews chapter. The molecular evidence rests on one report of two consanguineous families (PMID:24671081): homozygous KANK2 c.2009C>T p.Ala670Val, nuclear SRC-2/SRC-3 in patient basal epidermal cells, and increased vitamin D-induced transactivation in patient keratinocytes. The pathophysiology is a three-node chain (loss of SIP coactivator sequestration -> nuclear SRC-2/SRC-3 -> increased VDR transactivation) with inferential (directness INDIRECT) edges to palmoplantar keratoderma and woolly hair. Pseudoainhum of the fifth toe is recorded from a secondary summary and left without an HPO binding, because the only HPO term carrying the synonym is under amniotic/placental abnormality; it is not wired to a mechanism. Acitretin is recorded from a single clinically diagnosed, KANK2-untested case (PMID:35283492). Features reported only in genetically unconfirmed cases (finger contractures, nail thickening, hearing loss, maculopathy) were not added as phenotypes; the last two are a KNOWLEDGE_GAP discussion, as is the allele-specificity question raised by nephrotic-syndrome KANK2 variants (PMID:25961457). Orphanet ORPHA:420686 could not be cited because the Orphadata cache is absent locally. Validation: just validate, validate-terms and validate-disorders pass; 23/23 snippets verified.

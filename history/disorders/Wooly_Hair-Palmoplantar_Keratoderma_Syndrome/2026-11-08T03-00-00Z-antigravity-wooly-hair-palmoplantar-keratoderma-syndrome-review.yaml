  summary: Enriched Wooly Hair-Palmoplantar Keratoderma Syndrome with Harrison's classifications, epidermal/follicular pathophysiology grounding, diagnostic procedures, and genetic counseling.
  details: Added Harrison's chapter classifications (DERMATOLOGY and GENETICS_ENVIRONMENT_DISEASE) backed by PMID:24671081. Enriched KANK2/SIP pathophysiology nodes with anatomical locations (skin epidermis, palmoplantar skin, hair follicle), cell types, molecular functions, and cellular components. Marked Palmoplantar Keratoderma and Woolly Hair as diagnostic, added structured diagnosis entries (Clinical Dermatological Examination, Echocardiography, Whole-Exome Sequencing), and enriched genetic and treatment blocks.

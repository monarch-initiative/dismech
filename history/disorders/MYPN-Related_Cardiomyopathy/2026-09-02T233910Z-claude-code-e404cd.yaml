  summary: 'Create: MYPN-Related_Cardiomyopathy (MONDO:0014100)'
  details: |
    Curated MONDO:0014100 as a standalone gene-level Disease entry, MYPN-Related_Cardiomyopathy, rather than as a has_subtypes entry on any single morphology-scoped cardiomyopathy entry. Rationale: MONDO:0014100 has three asserted parents (familial restrictive MONDO:0016340, familial hypertrophic MONDO:0024573, familial isolated dilated MONDO:0700335), verified live against OLS, and carries CMH22 and CMR4 as synonyms alongside CMD1KK; attaching it under one pattern would contradict the other two. A Grouping was rejected because there are no separate CMD1KK/CMH22/CMR4 Disease entries to unite. The three patterns are carried as has_subtypes without subtype_term, since MONDO has no distinct class for any of them. The pathograph is one chain from a MYPN allele through Z-disc and I-band scaffolding failure, splitting into a structural arm (disturbed myofibrillogenesis) and a signalling arm (failed CARP nuclear shuttling) and recombining at ventricular remodelling, where the three geometries separate; four nodes conform to cardiomyopathy_maladaptive_remodeling. The deferred-decision notes in Restrictive_Cardiomyopathy (genetic MYPN block and top-level notes) were updated to point here, and a cross-reference note was added to the MYPN gene arm in Dilated_Cardiomyopathy. Evidence: PMID:18006477 (discovery cohort), PMID:22286171 (900-patient trans-phenotypic screen and allele mechanisms), PMID:34558411 (Mypn knockout mouse), PMID:25541130 (Q529X knock-in mouse), PMID:28017374 and PMID:28220527 (recessive skeletal-muscle allelic disorder, differential), PMID:25176015 and PMID:31535829 (heart-failure therapy, graded INDIRECT), plus the ClinGen CGGV MYPN/DCM Limited assertion. Validated with just validate (schema, terms, references: 37/38 snippets verified, 1 skipped by prefix), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms-online (caught and fixed a wrong NCIT device code), check-enum-values, and validate-disorders.

  summary: 'Address review: GeneReviews baseline, diagnosis block, HCM phenotype evidence'
  details: |
    Worked the three blocking items on the ai4c-reviewer CHANGES_REQUESTED review of PR #10646.

    (1) GeneReviews baseline and top-level references. Added a references: block listing all 16 sources the entry cites, with titles copied from references_cache/ frontmatter. PMID:20301486 (Dilated Cardiomyopathy Overview) and PMID:20301725 (Nonsyndromic Hypertrophic Cardiomyopathy Overview) carry tags: [GeneReviews]. Both cached records are abstract-only stubs whose entire content is the chapter's stated purpose, so both routes the review offered were taken: the chapters are tagged and mined for what they actually contain (proband evaluation strategy, at-risk-relative cardiac surveillance, family genetic counseling), and a notes paragraph records the PubMed E-utilities search run on 2026-09-02 (MYPN AND GeneReviews[book], and the same on myopalladin), which returns exactly one record - PMID:20301725, a pattern-level chapter, not a MYPN chapter - plus the reason the mining is thin.

    (2) diagnosis: block. Added six diagnostic entries built from section 10 of research/Dilated_Cardiomyopathy_1KK-deep-research-falcon.md: electrocardiography and ambulatory monitoring (NCIT:C38053), echocardiography (NCIT:C16525), cardiac MRI (NCIT:C16809), natriuretic peptide and troponin testing (NCIT:C25294), multigene panel genetic testing (NCIT:C15709), and cascade testing with cardiac surveillance of at-risk relatives (NCIT:C15419). Two new references were fetched for it: PMID:27339497 (Japp, JACC 2016, DCM diagnosis and evaluation) and PMID:37125300 (Pezzato, ECG in non-ischaemic DCM). PMID:31073128 and PMID:39298146 were already cached. The surveillance content previously filed inside the treatments entry 'Genetic Counseling and Cascade Screening' was moved here; that treatment is now 'Genetic Counseling', scoped to counselling alone, with its evidence changed to a transmission-risk quote from the same DOI source so the genetic-testing-selection quote is not duplicated across sections.

    (3) Hypertrophic cardiomyopathy phenotype. The sole evidence item was an ascertainment sentence ('MYPN was genetically screened in 900 patients with HCM, DCM and RCM'), which does not establish that carriers developed HCM. Replaced with the result sentence from the same paper ('Humans carrying the Y20C-MYPN variant developed HCM or DCM, whereas Q529X-MYPN was found in familial RCM'), plus the Y20C transgenic-mouse sentence graded MODEL_ORGANISM/INDIRECT. The ascertainment quote was relocated to the new genetic-testing diagnosis entry, where it describes the ascertainment route rather than a phenotype.

    Non-blocking review suggestions: added a Cardiac conduction abnormality phenotype. The research report's suggested binding HP:0001678 is Atrioventricular block, not the 'Abnormality of cardiac conduction' the report named it, so HP:0031546 (Cardiac conduction abnormality) was used instead and the correction recorded in notes. The onset figure (mean 40.2 +/- 18.3 years) was not curated: it sits in the full text of PMID:18006477, whose cached record is abstract-only, so no verified snippet exists; recorded as a deliberate omission in notes. Edema, fatigue and exercise intolerance were not added as separate phenotypes - they have no MYPN-specific quotable support and are already described within the Congestive heart failure phenotype.

    Validation: just validate, validate-terms, count-verified-snippets (55/55 with --unskip-prefix DOI --unskip-prefix CGGV), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-qualifier-terms-online (327 labels match, 98 resolved online), check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens, check-reference-titles, check-term-cache-integrity, and just validate-disorders across MYPN-Related_Cardiomyopathy, Restrictive_Cardiomyopathy and Dilated_Cardiomyopathy (210/212, the 2 prefix-skips verified by hand).

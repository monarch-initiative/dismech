  summary: 'Merge-queue fix: re-cite five full-text-only PMID:21926461 quotes'
  details: |
    The merge queue dequeued #12661 with CI_FAILURE. main now pins linkml-reference-validator 0.3.0rc1 (#12482), which refuses to serve an unstamped full_text_html cache after a re-fetch fails to obtain full text (tracked in #12672). PMID:21926461 (Gil et al. 2011, JCI) is such a cache: PMC serves the article only as HTML, which the fetcher's HTML path no longer parses, so validation fell back to the abstract and five snippets quoting the article body failed. Reproduced locally under 0.3.0rc1 (5 identical errors). The cache file was not modified. Each claim was re-cited to a sentence from the same paper's abstract or, for exon 2 skipping, to a figure-legend sentence in PMID:36944331 (XML-cached, graded HUMAN_CLINICAL with quote_role BACKGROUND): allele -> residual CD3delta edge now quotes the reduced transcript and protein sentence (IN_VITRO); the residual node quotes exon 2 skipping plus the same reduced transcript sentence; residual -> selective block edge quotes the authors' contrasting CD3delta requirements conclusion; the selective-block node quotes the selective alpha-beta block sentence and the stronger gamma-delta surface TCR reduction sentence; selective block -> failure of cellular immunity quotes the lymph node depletion, reduced recent thymic emigrants and oligoclonality sentence. Prose details that only the article body supported were removed rather than left unsourced: the roughly tenfold splicing and alpha-beta reductions, half-normal protein, absent germinal centres (two descriptions) and very early transplantation. No node, edge, phenotype or term changed. validate-disorders under 0.3.0rc1 passes with 89/89 snippets verified.

  summary: 'Review round 1: fix frequency bands, wire phenotypes, thymus evidence'
  details: |
    Review round on PR #12661. BLOCKING 1: corrected three phenotype frequency bands that exceeded their source counts in the thirteen-patient transplant series (PMID:21757226 Table 1; FREQUENT=30-79%, OCCASIONAL=5-29%) - Pneumocystis pneumonia (2/13) FREQUENT->OCCASIONAL and removed the 'common presenting illness' wording, severe cytomegalovirus (3/13) FREQUENT->OCCASIONAL, recurrent candidiasis (3/13) FREQUENT->OCCASIONAL with the description reworked to set the band from the series count and cite the pooled 2025 figure only for orientation. Rechecked the others: chronic diarrhoea 5/13 (38%) and failure to thrive 4/13 (31%) remain FREQUENT, correctly; the leaky-allele Omenn features stay OCCASIONAL. BLOCKING 2: wired the five disconnected phenotypes with bare-name downstream edges, each carrying evidence already fetched in the file - Absence of Circulating T Cells -> 'Absent circulating T cells' (PMID:15729559) and -> 'Decreased mitogen-induced T-cell proliferation' (PMID:21757226 PHA sentence); Arrest of Thymocyte Development -> 'Abnormally low T cell receptor excision circle level' (PMID:21757226 TREC sentence); Selective Block of Alpha-Beta T-Cell Selection -> 'Decreased total T cell count with preserved gamma-delta T cells' (PMID:21926461); Omenn-Like Immune Dysregulation -> 'Lymphadenopathy' (PMID:21757226). list-disconnected-phenotypes now reports 15/15 connected (was 5 stranded). SUGGESTION (a): added PMID:21757226 'Thymic tissue shows marked accumulation of early T cell progenitors...lack of Hassall's corpuscles' as node evidence on Thymus Loaded with Arrested Progenitors, and reworded the small-thymus framing so small radiographic/weight size is compatible with a loaded organ (the affected fetal thymi were small yet populated with thymocytes at 60% of normal density, PMID:15546002) rather than contradicting it. SUGGESTION (b): added the transplant series' CD4/CD8 double-negative-stage arrest statement as a third data point in the arrest-stage KNOWLEDGE_GAP discussion. SUGGESTION (c): declined the generic recurrent-infections phenotype (HP:0002719) - its only quotable support is the pooled all-CD3 45% figure, which is exactly the pooled-figure reliance BLOCKING 1 corrected, and the specific infections (PJP, CMV, candida, diarrhoea) are already curated, so a generic node would double-count on a non-CD3delta-specific denominator. Validated with validate (schema+terms+references, 87/87 snippets), validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, list-disconnected-phenotypes (15/15), validate-history and validate-disorders.

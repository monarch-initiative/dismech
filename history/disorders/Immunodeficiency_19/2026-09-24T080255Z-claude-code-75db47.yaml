  summary: 'Create: Immunodeficiency_19'
  details: |
    De novo curation of immunodeficiency 19 (CD3delta deficiency, MONDO:0014280) from the placeholder skeleton. Curated 16 phenotypes, 11 pathophysiology nodes forming a causal chain from biallelic CD3D loss-of-function variants through loss of the CD3delta chain, failed pre-TCR/TCR complex assembly, intrathymic arrest and absence of circulating T cells to the clinical phenotypes, with a parallel hypomorphic branch (the IVS2+5G>A leaky splice allele) that blocks alpha-beta but not gamma-delta selection and carries the Omenn-syndrome presentations. Two has_subtypes allele classes (complete deficiency, leaky splice allele) with phenotype subtype scoping. Also curated autosomal recessive inheritance (HP:0000007), CD3D as causative gene with founder-allele notes, CASES_IN_LITERATURE prevalence (18 patients in the 2025 pooled review), three treatments (HSCT, supportive care, preclinical adenine base editing), three diagnosis routes, two differential diagnoses (CD3E and CD3G deficiency), the Cd3d-null mouse with a SPECIES_MISMATCH divergence, and one KNOWLEDGE_GAP discussion on the disputed human arrest stage. Scope decision: curated as a standalone Disease entry rather than a has_subtypes row on Severe_Combined_Immunodeficiency (issue #12236 lists CD3D as a possible subtype gap there); the precedent of Immunodeficiency_18 (CD3E), Immunodeficiency_25 (CD247) and Combined_Immunodeficiency_Due_To_CD3gamma_Deficiency, each a standalone entry, plus MONDO:0014280 being its own term under MONDO:0015703, supports the standalone entry. Evidence: 13 references, all fetched with just fetch-reference and snippets copied from the cached bodies; 80/80 snippets verified. PMID:14602880 (Dadi 2003) has no abstract in PubMed and is deliberately uncited. No GeneReviews chapter exists (just check-genereviews reports NO_CHAPTER; PubMed genereviews[book] title search returns nothing). The deep-research report research/Immunodeficiency_19-deep-research-perplexity.md is a Perplexity sonar-deep-research run generated through a session-local streaming workaround for issue #9357; it was used as a lead only. Its term-validation section reported four mislabelled CURIEs (UBERON:0002365, GO:0002450, CL:0000896, CL:0000821) and two obsolete terms, and none of its suggested CURIEs was copied: every binding here was looked up in cache/<prefix>/terms.csv or via runoak against ols: in the same step. Validated with just validate (schema, terms, references), just validate-terms, just count-verified-snippets, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms, just check-coarse-phenotypes, just check-genereviews and just validate-disorders.

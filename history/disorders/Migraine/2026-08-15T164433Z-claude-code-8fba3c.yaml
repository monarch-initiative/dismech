  summary: Cite evidence for previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 3. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. This tranche used a hardened helper that pulls `reference_title` from the cache frontmatter rather than typing it, and asserts each snippet is non-empty, over 20 characters, at least 5 words, bracket-free and present in the cache -- the guards that the #8541 review showed were missing. Cited the four remaining evidence-free `environmental:` exposures (Sleep Disturbance, Dietary Triggers, Weather Changes, Sensory Stimuli). The notable outcome is Dietary Triggers, whose note listed alcohol, aged cheese, chocolate and caffeine withdrawal: a review of controlled trials states the importance of chocolate has been seriously doubted and that evidence for cheese is lacking, so that item carries a REFUTE alongside a SUPPORT for caffeine withdrawal, and the note was rewritten to separate the well-supported precipitants from the commonly-cited but poorly-supported ones. Sleep Disturbance and Sensory Stimuli are both PARTIAL against the same paediatric trigger diary -- it evidences insufficient sleep but not the excessive-sleep half, and noise but not the bright lights and odours the note names.

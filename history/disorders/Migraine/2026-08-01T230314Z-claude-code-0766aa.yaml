  summary: 'Review fixes: revert over-derived Visual Aura frequency to OCCASIONAL;
    remove curation meta-commentary'
  details: |
    PR #7476 blocking-review fixes (items 3 and 4).

    Visual Aura frequency (item 4): the PR had raised frequency from OCCASIONAL to FREQUENT via
    a derived calculation (about one-third of migraineurs have aura x 90% of aura being visual =
    roughly 30%), cross-multiplied across two different cohorts, landing exactly on the
    OCCASIONAL/FREQUENT band boundary, with neither PMID attached as an evidence item. Per
    docs/frequency-evidence-guidelines.md, derivations of this kind are not acceptable
    justification for a frequency band. Reverted to OCCASIONAL and restored the original short
    notes. The HP:0000505 -> HP:0010822 (Scintillating scotoma) term change and the more specific
    preferred_term were approved by the reviewer and are retained unchanged.

    Prose de-meta-commentary (item 3): the Chronic Migraine subtype description and the Sleep
    Disturbance environmental-factor notes had been rewritten to comment on what the entry's own
    citations do or do not establish. Both now state the clinical fact directly (ICHD-3 chronic
    migraine threshold; insufficient and excessive sleep as recognised triggers). Per CLAUDE.md
    it is acceptable for a description/notes field to stand without an attached evidence block;
    no new citation was fabricated for either.

    Validation: just validate and just validate-terms pass; just validate-references reports

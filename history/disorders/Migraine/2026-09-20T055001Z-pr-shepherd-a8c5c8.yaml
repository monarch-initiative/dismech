  summary: 'Review round: retype TRPM3, connect and ground the PACAP node'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED round on PR 12138, and merges origin/main to clear a conflict.

    CRITICAL - TRPM3 was recorded in genetic: with relationship_type RISK_FACTOR, which the schema defines as variants increasing disease risk. The supporting snippet makes no variant claim: it is an expression and candidate-modulation statement about trigeminovascular tissues. Took the review's second remedy and moved TRPM3 out of genetic: entirely onto the Trigeminovascular Activation node as a genes: descriptor, which is what expression-level evidence supports. The record's dropped hedges are restored: the descriptor description says explicitly that this is not a genetic risk factor, and the node now carries the review's own qualifier sentence ('these pathways should be framed as emerging rather than definitive explanations') as a second evidence item. hgnc:17992 verified against HGNC as TRPM3 at edit time and its cache/hgnc/terms.csv row is committed.

    PACAP node: the Central Sensitization edge quoted a sentence about CGRP-pathway independence, which did not support sensitization; replaced with the review's two suggested sentences on neuropeptide release during the headache phase and glial reinforcement of peripheral sensitization. The node was an orphan, so a Trigeminovascular Activation -> PACAP Pathway edge was added, matching how CGRP Pathway is fed. Grounded with GO:0007218 neuropeptide signaling pathway. The previously unconsumed DOI:10.1186/s10194-024-01830-2 is now cited on the node for receptor-level resolution (VPAC1/VPAC2 rather than PAC1). Node description corrected: it no longer claims release from trigeminal neurons, and instead states the expression distribution the source gives.

    Treatment join: added Anti-PACAP Ligand Monoclonal Antibody (Lu AG09222) with a target_mechanisms INHIBITS edge onto the PACAP Pathway node, marked Phase 2 and not approved, with notes recording why ligand-directed rather than PAC1-receptor-directed.

    quote_role REVIEW_SYNTHESIS applied to every item citing PMID:42676555, including the three pre-existing Ditans items, settling the inconsistency the review flagged.

    Conflict resolution: the branch added the PACAP node at a point where main had extended the CGRP Pathway node's downstream list with vestibular-migraine content. Both sides were preserved - main's Vestibular CGRP Signaling and Trigemino-Vestibular Pathway content is intact and the PACAP node moved to the end of the pathophysiology section. The diff against main is purely additive, 203 insertions and no deletions.

    Validation: just validate passes with 120/120 snippets verified, just validate-terms passes, and check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values are clean.

  summary: 'Claim-evidence review: re-source FHM genes, fix central-sensitization
    node'
  details: |
    Claim-evidence correctness review. The three familial hemiplegic migraine causative genes (CACNA1A, ATP1A2, SCN1A) each rested on a single PMID:38508838 sentence that names no gene; added PMID:32430436, which names all three, as the primary SUPPORT and demoted the original to PARTIAL. Moved the GWAS snippet that actually names rs10166942 (2q37.1, TRPM8) onto the TRPM8 entry and demoted its expression-only snippet to PARTIAL. Re-sourced the Central Sensitization node, which claimed sensitization of trigeminal nucleus and thalamic neurons but was evidenced entirely by meningeal primary-afferent (peripheral) data: added the two PMID:30982963 snippets that address second- and third-order CNS neurons, and kept the P2X7 item as PARTIAL with an explanation of the peripheral scope. Removed the Sleep Disturbance environmental evidence, whose snippet counted precipitating factors generally and never mentioned sleep. Set evidence_source MODEL_ORGANISM on three explicitly mouse/rodent snippets that had defaulted to HUMAN_CLINICAL. Rebound Visual Aura from HP:0000505 (Visual impairment) to HP:0010822 (Scintillating scotoma), matching the entry's own notes, and raised its frequency from OCCASIONAL to FREQUENT to match the in-file evidence (aura in ~one-third of patients, visual in 90% of those). Noted that the chronic-migraine 15-day threshold is an ICHD-3 criterion not established by the cited beta-blocker trial.

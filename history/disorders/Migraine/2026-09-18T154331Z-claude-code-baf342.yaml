  summary: 'Augment Migraine: add PACAP pathway and TRPM3 genetic contributor'
  details: |
    Added PACAP Pathway node to pathophysiology with evidence from PMID:42676555 demonstrating parallel neuropeptidergic signaling to CGRP in migraine. PACAP can provoke migraine attacks and represents an independent therapeutic target. Also added TRPM3 gene entry to genetic section, identifying it as a sex-dimorphic modulator of trigeminovascular excitability contributing to female predominance. Both additions sourced from comprehensive migraine review (Migraine: Epidemiology, Risk Factors, Pathophysiology, and Treatment, Lu et al., 2026).

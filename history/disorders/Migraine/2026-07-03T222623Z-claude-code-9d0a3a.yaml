  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled reference_title on 6 previously untitled PMID evidence items covering PMID 37495957, PMID 29697154, and PMID 30982963, and on 3 clinicaltrials NCT trial evidence items NCT07040813, NCT06241313, NCT07061847. Re-verified all existing evidence snippets as exact substrings via validate-references. Pulled full text for PMID 30982963 CGRP and the Trigeminal System in Migraine and mined additional well-supported findings. Added direct human-clinical evidence that jugular CGRP is elevated during attacks and that interictal CGRP is elevated in chronic versus episodic migraine as a proposed biomarker on the CGRP biochemical entry. Added direct causal evidence that intravenous CGRP provokes delayed migraine attacks in migraineurs to the CGRP Pathway node. Added a mouse-model finding that intracerebroventricular CGRP induces light aversion to the Photophobia phenotype. Added the sumatriptan-inhibits-CGRP-release mechanism to the Triptans treatment. Added a new Cutaneous Allodynia phenotype HP:0012533 supported by the allodynia and triptan-resistance quote. Repaired the Nausea phenotype by replacing a neuroinflammation snippet that did not mention nausea with a direct associated-symptom quote listing nausea and vomiting. All snippets verified as exact substrings and all term labels validated.

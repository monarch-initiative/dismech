  summary: 'Review round 1: ontology rebinds, cerebellar node, pathograph connection'
  details: |
    PR-shepherd round addressing the four blocking findings on PR #11826.

    1. GO:0050905 removed from the Vestibulo-Thalamo-Cortical Dysfunction node. Its canonical label is 'neuromuscular process', which asserted a neuromuscular claim the node does not make; the label matched the CURIE, so just validate-terms passed and nothing flagged it. GO has no term for cortical multisensory integration, so the slot is now an unbound preferred_term 'Multisensory Integration' with a node-level notes: recording the searches run and that an NTR would be needed. The descriptor class has no notes slot, so the rationale sits on the Pathophysiology node and a short pointer on the descriptor description.

    2. GO:0007186 (G-protein coupled receptor signaling pathway) replaced by GO:1990408 (calcitonin gene-related peptide receptor signaling pathway) on the Vestibular CGRP Signaling node, with modifier INCREASED. The CURIE and label were read from OLS at the time of writing, not recalled; cache rows were then derived by just validate-terms.

    3. New pathophysiology node 'Vestibulo-Cerebellar Integration Failure and Compensation', the fifth of the five mechanism families the source's own abstract names and the only one previously unmodeled. Bound to UBERON:0014642 (vestibulocerebellum) - an initial attempt used UBERON:0002129 written from memory, which is 'cerebellar cortex'; the pre-edit validation hook caught the label mismatch and the term was then looked up. Three node-level evidence items and one edge into Vertigo, all exact quotes. The canal-otolith psychophysics item is graded directness: INDIRECT because the cerebellar localization is the source's own inference ('likely implies'), and the edge is INDIRECT_UNKNOWN_INTERMEDIATES because the source says the interaction 'may trigger' the symptoms.

    4. The vestibular cluster was a disconnected component. Two downstream edges were added on the existing nodes - Trigeminovascular Activation -> Trigemino-Vestibular Pathway and CGRP Pathway -> Vestibular CGRP Signaling - each with its own evidence. The entry's pathophysiology and phenotype nodes now form a single 9-node connected component; the remaining isolated nodes (Headache, Photophobia, Phonophobia, Nausea, Visual Aura, Cutaneous Allodynia) are pre-existing and out of this PR's scope.

    Also taken: the Vestibular Migraine subtype description now records the peripheral-abnormality subgroup the source uses to counterbalance the central framing, with its own cited evidence item rather than as an uncited qualifier.

    Validation: just validate (103/103 snippets, up from 96), validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-snippet-grading, check-folded-hyphens, check-term-cache-integrity, check-cache-order - all pass. check-snippet-length and check-title-snippets report whole-KB findings in six other entries, none in this file; those are pre-existing drift on this branch's older base and CI on the PR is green.

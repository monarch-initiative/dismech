  summary: Merge main and reduce vestibular-migraine augmentation to its non-duplicate
    remainder
  details: |
    Merged origin/main into the PR branch to clear a conflict in kb/disorders/Migraine.yaml. PR #11826 landed on main in the interim and independently curated the same Vestibular Migraine subtype from the same source (PMID:42643076), so most of this branch's content was already present. Conflict resolved by keeping main's richer subtype description and its three evidence items, and preserving from this branch only the material main does not carry: one evidence item quoting the review's own multisystem-neurovestibular recommendation, a notes enrichment on the Vertigo phenotype, and three Vertigo evidence items covering central multisensory processing, central sensitization, and vestibulo-cerebellar compensation. Two of this branch's evidence items were dropped as exact duplicates of snippets main already cites (the CGRP inner-ear 'biological bridge' sentence and the CGRP-therapy-response sentence). Review finding 2 applied to the surviving recommendation quote, which is now graded OTHER rather than HUMAN_CLINICAL: the quoted text is the authors' synthesis and recommendation over the literature, not a cohort observation. Review findings 1, 3 and 4 are moot against current main - the vestibular pathophysiology nodes (Trigemino-Vestibular Pathway, Vestibulo-Thalamo-Cortical Dysfunction, Vestibulo-Cerebellar Integration Failure and Compensation, Vestibular CGRP Signaling) exist there, Vertigo now has two inbound causal edges, and the galcanezumab and vestibular-rehabilitation material the review asked for is curated on main.

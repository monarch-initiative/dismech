  summary: 'Create: MASS_Syndrome'
  details: |
    Created a new disorder entry for MASS syndrome (MONDO:0011431, OMIM 604308; FBN1).

    Lump/split: curated as a separate Disease rather than a has_subtypes row of Marfan_Syndrome (the claim-triage bot leaned SUBTYPE). Reasons recorded in the entry notes with citations: the revised Ghent nosology defines MASS as a category whose criteria exclude ectopia lentis and aortic root aneurysm (PMID:28616514), and FBN1 carriers meeting it are classified out of Marfan syndrome (PMID:21564093); the clinically defined phenotype is not confined to FBN1 (PMID:34155898; the PMID:28616514 cohort was FBN1-negative by design); the aortic course differs; MONDO and OMIM keep a separate class; and the sibling ectopia lentis syndrome entry is curated the same way. Marfan_Syndrome.yaml was not edited.

    Content: inheritance (HP:0000006), FBN1 genetic record (CAUSATIVE, with notes on case-level evidence and gene-negative MASS; no ClinGen record exists, so no gene_disease_validity), three pathophysiology nodes (FBN1 variant, defective fibrillin-1 microfibrils and elastic fibers, hypothesized TGF-beta dysregulation flagged as untested in MASS), 12 phenotypes, 10 of them wired to the chain (myopia and the temporomandibular joint finding have no sourced mechanism edge), Ghent-2 and original 1989 definitions, progression, diagnosis (echocardiography, genetic testing), two treatments (mitral valve surgery, exercise counseling), differentials (Marfan syndrome, mitral valve prolapse syndrome, ectopia lentis syndrome) and a knowledge-gap discussion on why FBN1 gives MASS rather than Marfan syndrome.

    Deep research: the openscientist report (research/MASS_Syndrome-deep-research-openscientist.md) was read in full. Reference validation: 17/17 resolved, confabulation_rate 0.0, 2 of 6 quotes unsupported (PMID:2739055 and PMID:42274425, both ellipsis paraphrases of real sentences), needs_review true. Term validation flagged 9 mislabelled CURIEs (e.g. NCIT:C16818 is Mammography, NCIT:C61876 is Pancuronium) and 2 obsolete GO terms; none were reused. preflight-dr: WARN only because the disease acronym MASS is counted as a gene symbol (it is an HGNC alias of FBN1); the report is about the right disease. The report drew most mechanism, treatment and model-organism content from Marfan syndrome papers (losartan/atenolol trials, Fbn1 C1039G mice, pregnancy), which it flagged itself; those were not transferred because they are not about MASS. Its MASS-specific sources (PMID:2739055, PMID:26875674, PMID:26919284) were checked and the first and third used. This run wrote no .citations.md sidecar, so the report body was swept for PMIDs instead. Most entry evidence came from a separate PubMed search for MASS-specific literature (PMID:28616514, 24740214, 31185693, 41502793, 34155898, 34491247, 39459359, 22568544, 21564093, 23794388, 9837823, 42743781). PMID:31053375 (incomplete MASS phenotype, Rev Esp Cardiol) cached with no quotable text and is not cited.

    GeneReviews: just check-genereviews --online reports NO_CHAPTER for GeneReviews and StatPearls.

    Validation: just validate, validate-terms (+ normalize-cache), count-verified-snippets (67/67), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-logical-rules, list-gene-term-mismatches and the whole-tree gates passed, and the final just validate-disorders run passed (67 snippets, 0 issues).

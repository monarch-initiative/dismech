  summary: 'Weekly compliance: bind treatment terms and agents, add treatment and
    phenotype evidence'
  details: |
    Mycophenolate Mofetil, Nintedanib and ACE Inhibitors had no treatment_term. Each now carries NCIT:C15986 Pharmacotherapy, therapeutic_modality SMALL_MOLECULE and a therapeutic_agent: CHEBI:8764 mycophenolate mofetil, CHEBI:85164 nintedanib, and NCIT:C247 ACE Inhibitor (CHEBI:35457 is a role term outside the ChemicalEntityTerm enum). Each has trial or review evidence: SLS II (PMID:27469583), SENSCIS (PMID:31112379, already cited) and a scleroderma renal crisis review (PMID:26210130). Added evidence to the four phenotypes that had none: Raynaud Phenomenon and Skin Thickening from StatPearls (PMID:28613625); Pulmonary Fibrosis from SENSCIS background and a Lancet review (PMID:28413064), both marked INDIRECT because they say ILD or internal-organ fibrosis rather than pulmonary fibrosis; Dysphagia from a 2026 GI review (PMID:42812093, full text). Validated with just validate, validate-terms and count-verified-snippets (35/35).

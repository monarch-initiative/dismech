  summary: Add SSc-associated pulmonary arterial hypertension (PAH)
  details: |
    Enriched the pulmonary manifestations of systemic sclerosis with SSc-associated pulmonary arterial hypertension (SSc-PAH), the vascular lung manifestation that was absent (the entry previously modeled only SSc-ILD). Context: MONDO:0002047 'pulmonary systemic sclerosis' (= lung involvement in SSc / scleroderma lung disease) is an organ-manifestation of SSc, not a standalone disease, so rather than create a separate entry its content is folded into Systemic_Sclerosis. Added a pathophysiology node 'Systemic Sclerosis-Associated Pulmonary Arterial Hypertension' (TISSUE scale; pulmonary artery UBERON:0002012; pulmonary artery smooth muscle cell CL:0002591 + endothelial cell CL:0000115; blood vessel remodeling GO:0001974 and smooth muscle proliferation GO:0048661), wired downstream from the existing 'Vascular Injury and Endothelial Dysfunction' node (previously terminal) and to a new 'Pulmonary Arterial Hypertension' phenotype (HP:0002092, OCCASIONAL). Added four PAH-specific vasodilator treatment classes targeting the new node: endothelin receptor antagonists (ambrisentan/bosentan/macitentan), PDE-5 inhibitors (sildenafil/tadalafil), riociguat (sGC stimulator), and prostacyclin-pathway agents (treprostinil/selexipag). Evidence from PMID:38731946 (SSc-PAH mechanism/pathology review), PMID:38378970 (CTD-PAH treatment meta-analysis, 59% SSc) and PMID:36396789. 48/48 snippets verified; terms, entity-refs, causal-targets, name-collisions, coarse-phenotypes, logical-rules, snippet-grading, delivery-system, gene-namespaces, duplicate-keys, enum-values and validate-disorders all pass.

  summary: Add diagnosis and progression; record EPHX1 modifier decision
  details: |
    Carbamazepine half of issue 18522. Added a diagnosis section (clinical/exposure-history diagnosis of exclusion with weak dysmorphic scoring, PMID:16239295; multisystem phenotype and karyotype exclusion, PMID:22687674; prenatal anomaly ultrasound to exclude NTDs and the ~0.5 percent spina bifida risk, PMID:14504306) and a progression section (transient neonatal microcephaly normalizing by 24 months, PMID:22749607; childhood neurodevelopmental outcome concentrated in the full-facial-dysmorphism subgroup, PMID:9014606). EPHX1 is deliberately NOT encoded as a genetic SUSCEPTIBILITY/MODIFIER row because no carbamazepine-specific genotype-risk evidence exists (the human EPHX1 functional series is phenytoin monotherapy, ungenotyped); the reduced-detoxification claim stays as the DECREASED epoxide hydrolase molecular-function modifier, with the reasoning recorded in notes. Sourced from an OpenScientist deep-research run committed under research/. All 32 snippets verified; validate-disorders, terms, entity-refs, snippet-grading all pass.

  summary: 'Create: Fetal Carbamazepine Syndrome'
  details: |
    Created the fetal carbamazepine syndrome entry (MONDO:0018263) to home the carbamazepine arm of the ReproTracker NAM paper (PMID:38029956) and to settle the lump/split question in issue 16910: curated as a standalone Disease entry, not a subtype of Fetal_Valproate_Syndrome, because the mechanism differs (reactive arene-oxide metabolite formation vs valproate's HDAC inhibition and folate antagonism). Phenotype pattern (minor craniofacial defects, fingernail hypoplasia, developmental delay) and the arene-oxide hypothesis from Jones 1989 (PMID:2725616); epoxide-metabolite teratogenicity from Bennett 1996 mouse study (PMID:8968346); dose-dependent MCM risk (~5%) from PMID:38497990. ReproTracker linked as an IPSC_DERIVED_MODEL experimental_models entry (PARTIALLY_RECAPITULATES the differentiation node across all three lineages: MYH6, FOXA2/AFP, PAX6 decreased). A sibling Grouping (Antiseizure_Medication_Embryopathies) was created to hold the convergent-phenotype/divergent-mechanism family. All 18 snippets exact-quote verified; terms (incl. ECTO:9000603), entity-refs, coarse-phenotypes, model-scale and formatting gates pass.

  summary: 'Review round 1: diagnosis_term bindings and cytogenetic-exclusion node split'
  details: |
    PR 18777 review round 1 (ai4c-reviewer), two inline threads.

    Thread 1: bound the Prenatal anomaly screening diagnosis node to NCIT:C217447 Diagnostic Obstetric Ultrasound (verified: cached label matches, in the TreatmentActionTerm enum, validate-terms passes). Chosen over the generic NCIT:C222238 Fetal Ultrasound Imaging because the node is the obstetric anomaly scan performed on the pregnant patient.

    Thread 2: the clinical/exposure-history node's description over-claimed chromosomal microarray as an evidenced exclusion step when only karyotyping carried an evidence item. Split the cytogenetic exclusion into its own diagnosis node (Cytogenetic exclusion of a chromosomal mimic) bound to NCIT:C16768 Karyotyping, moved the PMID:22687674 karyotype quote onto it, and regraded that quote from INDIRECT to DIRECT because the node's claim is exactly the karyotype-exclusion step the quote demonstrates. Microarray is now framed as a conditional adjunct (where a submicroscopic copy-number mimic is suspected) rather than an evidenced claim. The first node keeps no diagnosis_term because it is a diagnostic approach (exposure history + compatible pattern), not a single codable procedure.

  summary: 'Review round 2: Ross River fever (RRV)'
  details: |
    Fixed the one new blocking issue the round-1 fix introduced. Reverted the Arthritis row from HP:0040311 (Symmetric polyarthritis) back to HP:0001369 (Arthritis): no cited reference states joint symmetry (grep over all 13 RRV caches finds only the virion's icosahedral symmetry), so the binding asserted a distribution the sources do not support. Dropped 'often symmetrical' from the Arthritis and Arthralgia descriptions, updated the downstream and target_mechanisms targets to 'Arthritis', and replaced the mis-graded IL-17 aim-statement evidence (a mouse study's own investigation sentence graded HUMAN_CLINICAL) with two citable human sentences: PMID:42240370 confirming RRV as the cause of epidemic polyarthritis and PMID:33802851 on CD4+ synovial-fluid infiltration. Non-blocking: dropped the arbitrary rate_per_100000 (19.3 duplicated rate_high), keeping only the sex-split bounds; completed the references list to all 10 cited PMIDs. 32/32 snippets verified; validate-disorders clean.

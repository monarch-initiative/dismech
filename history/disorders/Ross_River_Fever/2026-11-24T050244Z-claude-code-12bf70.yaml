  summary: 'Create: Ross River Fever (RRV)'
  details: |
    New infectious-disease entry for Ross River fever (MONDO:0000344), the epidemic polyarthritis caused by Ross River virus. Curated as a named pathogen-syndrome pair under the infectious ladder (design decisions 3e), a member of, not a duplicate of, the alphavirus/Togaviridae grouping claims #17868 and #18112. Deep research with the claude_code provider (7/8 report quotes valid); preflight-dr falls back to manual because MONDO records no causal gene, as expected for an infection, and the report is about the correct disease. infectious_agent bound to NCBITaxon:11029, agent_life_cycle with macropod reservoir (NCBITaxon:9307) and mosquito vectors (Ochlerotatus vigilax NCBITaxon:569589, Culex annulirostris NCBITaxon:162997), transmission and progression blocks filled. Pathograph: MXRA8 entry -> musculoskeletal dissemination -> monocyte/macrophage infiltration -> MBL-lectin-pathway complement activation and tissue destruction -> arthritis/arthralgia/stiffness/myalgia; every mechanism node carries a MODEL_ORGANISM or REVIEW_SYNTHESIS evidence_source with a caveat that the chain is largely from the C57BL/6 mouse model. Rash, fever and fatigue left unwired (systemic, mechanism not node-specific). Fixed two report HP mis-mappings (tenosynovitis, synovial fibroblast) by not binding them; used HP:0040186 for the rash. A pentosan-polysulfate phase 2a trial recorded as clinical_trials ACTRN12617000893303. Treatments symptomatic (NSAIDs/paracetamol, physiotherapy). Validated with just validate, validate-terms, check-granularity, check-entity-refs, check-causal-targets, check-snippet-grading and validate-disorders.

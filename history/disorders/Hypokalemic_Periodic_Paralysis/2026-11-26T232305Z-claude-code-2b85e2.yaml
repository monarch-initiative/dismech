  summary: 'Review round 1: Hypokalemic Periodic Paralysis'
  details: |
    Changes made in answer to the automated review of PR 19081. The notes on oral potassium chloride were reworded to state only why PMID:18426576 is not the dose source (its PubMed record carries a dosage erratum). The KCNJ2 gene binding was removed from the inward-rectifier conductance node, so that the KCNJ2 gene page does not list this disease; Kir2.1 is still named in the node description. The long exercise test frequency was changed from VERY_FREQUENT to FREQUENT to follow the two clinical sources (more than 70 percent, and 32 of 45) over the broader Orphanet EMG row. An unsupported sentence comparing arrhythmia with Andersen-Tawil syndrome was removed. A phenotype for mildly elevated creatine kinase (HP:0008180) was added with its Orphanet frequency; it has no causal edge because no cited source says what produces it, so 8 of 9 phenotypes are now connected. The Hm-3 note now records the CHEBI and NCIT searches run and what they returned. Not taken: citing the abstract of PMID:19225109 directly for the acetazolamide sodium result, because the sentence writes sodium as a bracketed symbol that the quote validator strips, which would leave a quote that omits the word the claim depends on. Validation: just validate-disorders passed with 200 snippets and 0 issues.

  summary: 'Treatment-centred review and enrichment: Hypokalemic Periodic Paralysis'
  details: |
    Treatment-centred review of an existing entry.

    Research. An OpenScientist deep-research run was launched twice with
    `just research-disorder openscientist`. The first was stopped after an hour
    without returning a report; the second had not returned when this record was
    written. No OpenScientist report was used. The curation instead rests on a
    PubMed and ClinicalTrials.gov sweep run in this session, with every claim
    read against the cached abstract or full text. The committed Falcon report
    was consulted as a cross-check on treatment and trial coverage only; it named
    no drug or trial that the sweep had not already found.

    Treatments. Five treatments became seventeen. Existing ones were re-checked
    claim by claim; the bundled potassium-sparing diuretic entry was split into
    spironolactone, eplerenone and triamterene; acute potassium was split into
    oral and intravenous, and slow-release prophylaxis was added. New
    investigational or preclinical entries: bumetanide, retigabine, azetukalner
    (XEN1101), pinacidil, topiramate, and the gating-pore blocking toxin Hm-3.
    Supportive entries: physiotherapy and perioperative precautions. Each drug
    carries a therapeutic_agent, a modality, target_mechanisms with their own
    evidence, and a dosing interval where the source states one. The oral
    potassium dose was re-sourced because the PubMed record of the review it
    was quoted from carries a dosage erratum.

    Pathograph. The combined depolarization and sodium-channel-inactivation node
    was split in two, and four nodes were added so that each drug has an
    explicit target: loss of inward-rectifier potassium conductance, NKCC1
    chloride loading, myoplasmic sodium overload, and impaired
    voltage-dependent calcium release (CACNA1S form only). All eight phenotypes
    are now reached by a causal edge.

    Other sections. Two phenotypes were rebound to more specific HPO terms
    (HP:0003752, HP:0012726); four phenotypes and Orphanet frequency bands were
    added; a biochemical section (serum potassium with LOINC and the diagnostic
    cut-off, sodium-23 MRI muscle sodium, creatine kinase), three animal models
    with MGI-bound genes, four clinical trials, and three open discussions were
    added.

    Validation. `just validate-disorders` passed (199 snippets, 0 issues), as
    did check-causal-targets, check-entity-refs, check-gene-namespaces-online,
    list-disconnected-phenotypes (8 of 8 connected) and the whole-repo offline
    gates.

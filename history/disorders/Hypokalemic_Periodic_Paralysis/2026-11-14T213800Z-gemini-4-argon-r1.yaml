  summary: Address Round 1 PR review comments on Hypokalemic Periodic Paralysis
  details: |
    Replaced the unquoted SCN4A clinical-worsening clause in the acetazolamide effect_modifiers block with the glycine-substitution finding from Matthews et al. 2011 (PMID:22094484) and attached the verbatim snippet. Added the GeneReviews exercise and carbohydrate trigger quote (PMID:20301512) to GENETICS_ENVIRONMENT_DISEASE, added two Statland et al. 2018 (PMID:29125635) snippets covering the 15-35 year attack-frequency peak and late persistent weakness to the Onset progression entry, and added PMID:29125635 snippets for resting long QTc/QU exclusion on Electrocardiography and attack frequency/duration plus interictal myotonia on Hyperkalemic periodic paralysis. Set biological_scale: ORGANISM and GO:0071805 modifier: INCREASED on Extracellular-to-Intracellular Potassium Shift, retargeted Potassium-Sparing Diuretic Preventive Pharmacotherapy target_mechanisms to Extracellular-to-Intracellular Potassium Shift (with Hypokalemia added to target_phenotypes), added evidence blocks to target_mechanisms on all five treatments, and split the Netherlands Orphanet prevalence row (ORPHA:681) into its own prevalence record.

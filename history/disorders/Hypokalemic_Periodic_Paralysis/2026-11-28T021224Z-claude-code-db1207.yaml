  summary: 'Curate phenotypes: Hypokalemic Periodic Paralysis'
  details: |
    Added seven phenotypes (myalgia, exercise-induced muscle fatigue, prodromal paresthesia, skeletal muscle atrophy, abnormal muscle fiber morphology, muscle spasm, falls) and enriched permanent proximal weakness, respiratory muscle paralysis and reduced tendon reflexes with further evidence. Sources: cached full text of PMID:39174253 and PMID:29125635, the GeneReviews abstract PMID:20301512, PMID:17587224 and the ORPHA:681 phenotype table. Wired the myopathy node to atrophy and fiber morphology, and episodic weakness to falls. PubMed, Europe PMC and OLS were blocked by the network proxy, so no new references were fetched. Frequency bands were set only from Orphanet rows; mixed-cohort survey percentages were recorded in explanations but not used as frequencies. All validators passed (219/219 snippets verified).

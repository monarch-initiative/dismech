  details: |
    Genetics pass for issue #12199 (epic #12189, d2g wiring-010).

    Both genes (CACNA1S hgnc:1397, SCN4A hgnc:10591) were already curated, already
    carried `subtype:` foreign keys, and already reached the shared "Gating-Pore Leak
    Current" node, which is the right modelling: the gating-pore mechanism is common
    to both channels rather than gene-specific.

    Changes:
    - Added `genes:` to both `has_subtypes` rows and `relationship_type: CAUSATIVE`
      to both `genetic:` entries.
    - Added `case_fractions` from the cohort share already quoted in the entry's own
      evidence (PMID:29125635): CACNA1S 60% and SCN4A 20% of familial HypoPP
      kindreds. This is exactly the "cohort share already in a verified snippet but
      not structured" case the campaign asks for.
    - GeneReviews baseline: the entry had no `references:` block at all and did not
      cite PMID:20301512 "Hypokalemic Periodic Paralysis", which
      `just check-genereviews` reported as UNTAGGED_CHAPTER. Fetched and cited it,
      tagged GeneReviews, with two findings mined from it - that approximately 30% of
      individuals meeting the consensus diagnostic criteria carry no variant in
      either known gene, and that penetrance is about 90% in males and reduced in
      females - and added an evidence item from it to each gene entry.

    The 30% finding matters for reading the two case fractions: they are shares of
    familial kindreds in one review and do not sum to the clinically diagnosed
    population.

    References newly cited and cached: PMID:20301512.

  summary: 'Create: Normal Pressure Hydrocephalus'
  details: |
    Curated the idiopathic syndrome as two mechanistically distinct arms converging on ventriculomegaly, because they differ in reversibility: a mechanical arm (age-related loss of intracranial compliance -> increased CSF pulsatility with impaired absorption -> ventriculomegaly at normal mean pressure -> periventricular white matter compression and stretch injury) and a glymphatic arm (perivascular AQP4 depolarization -> impaired CSF-ISF exchange -> interstitial amyloid-beta accumulation). Seven nodes, six edges, one connected component.

    Three nodes declare conformance to the glymphatic_dysfunction module. The decision was argued from the AQP4 immunogold measurement in iNPH cortical biopsies - human tissue, not an imaging index - rather than from topic adjacency, and the module's own caution against treating a perivascular-diffusivity index as a measurement of glymphatic transport was honoured by curating every DTI-ALPS finding as PARTIAL support for a correlation only. Conformance was deliberately NOT declared for the module's sleep node, since no sleep measurement in iNPH is cited in the sources used here.

    Three KNOWLEDGE_GAP discussions: why the cognitive arm did not separate from placebo, with the 2025 trial's gait-based selection criterion recorded as a fourth reading that weakens its cognitive null; why the urinary arm did not respond when the curated mechanism derives it from the same lesion as gait, given that the two randomised trials disagree on the bladder in the direction opposite to their disagreement on gait; and whether perivascular AQP4 depolarization is disease-specific or an ageing finding in an aged cohort, a caveat the cited source itself raises.

    A reconciliation of fetched-but-uncited references caught a defect in the first draft and materially changed the entry. The draft asserted in notes that no cached reference supported the NPH genetic findings; two cached references - the FinnGen GWAS and a 2025 systematic review of NPH genetics - refute that. Rather than pruning them, all six previously uncited references were read and curated: a genetic section (SLCO1A2, CFAP43, SFMBT1) typed SUSCEPTIBILITY throughout with a polygenic inheritance block bound to HP:0010982; an AQP4-null kaolin-hydrocephalus mouse under animal_models with modeled_mechanisms, PARTIALLY_RECAPITULATES, MODERATE fidelity and two quantitative readouts, which is the only evidence in the entry that manipulates AQP4 rather than observing it; vascular risk-factor case-control evidence on the trigger node; and long-term quality-of-life data on the treatment showing benefit returning to baseline at five to seven years and falling below it thereafter. CFAP43 is typed SUSCEPTIBILITY despite MONDO recording it as this term's causal gene, because that causal relation belongs to the Mendelian entity sharing the term.

    Recorded that MONDO:0009366 covers two entities - the acquired/idiopathic syndrome its definition describes, and the CFAP43 Mendelian form it carries via the OMIM:236690 xref and an RO:0004003 causal-gene relation - and that this entry curates the former. No clinical_trials entry for NCT05081128: the ClinicalTrials.gov fetch fails on TLS certificate verification through this environment's proxy and cache files must never be hand-created; the trial is fully covered by the cached PMID:40960253.

    Deep research (claude_code provider) was used as a lead generator only - every claim was written from the cached primary reference after reading it, not from the report's summary. The report-level reference validation retro-fit also fails on TLS in this environment, so that report carries no Reference Validation section; this is stated in the entry notes rather than glossed over.

    The NEC preflight against MONDO:0009366 returns WARN, not PASS: CFAP43 at 6 mentions against AQP4 at 16. Resolved as a false positive and documented in the entry - AQP4 is the mechanism's water channel rather than a rival disease's causal gene, the next most frequent symbols are all reported iNPH candidate genes, and the report mentions iNPH 67 times and neuromyelitis optica, the disease AQP4 is otherwise known for, zero times.

    Validation run: just validate clean; just validate-terms clean; 54/54 evidence snippets verified against the local reference cache; check-duplicate-keys, check-folded-hyphens, check-title-snippets, check-snippet-length, check-environmental-evidence and check-cache-order all clean; the conforms_to, model-readout-target and foreign-key portions of tests/test_data.py pass (6795 selected tests).
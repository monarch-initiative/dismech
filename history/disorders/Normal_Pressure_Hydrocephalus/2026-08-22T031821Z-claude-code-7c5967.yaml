  summary: Correct the edge count in the pathograph-shape note
  details: |
    Correction of a wrong edge count in notes, raised as a non-blocking suggestion on the second approving review and verified against the file before acting.

    The pathograph-shape paragraph said seven pathophysiology nodes, five phenotypes and twelve edges form one connected component. Twelve is neither of the two defensible counts. Enumerated from the file, those twelve nodes are joined by eleven downstream edges; including the shunt's target_mechanisms link and the AQP4-null mouse's modeled_mechanisms link gives fourteen nodes and thirteen edges. The reviewer's derivation was exact and matched a fresh enumeration run here. The sentence now states both counts explicitly and names the superseded number, so a reader who encountered the old figure elsewhere can see it was retracted rather than wonder which is current.

    The likely origin of the drift is worth recording: a grep for downstream targets returns thirteen when the treatment and animal-model links are included, and the number was carried into a sentence scoped to the pathophysiology-plus-phenotype set.

    This is the fifth instance in this session's batch of one defect class, and the smallest: a claim in free text that no gate can check. The others were a claim that a cached abstract was truncated (three sites, PR #9207), a claim that a deep-research validation retro-fit had succeeded when it failed on TLS (PR #9206), a claim that no cached reference supported the NPH genetic findings when two did, and a claim that genetics is structurally unable to reach the pathograph when graph.py emits contributes_to edges for SUSCEPTIBILITY entries. Of the five, three were claims about a source, one about the codebase, and this one about the entry's own structure - so the class is wider than issue #9226's proposed gate covers, and that is worth noting on the issue rather than silently widening its scope.

    This push dismisses a second approval. The trade is smaller than the last one - a wrong integer rather than a wrong statement about how the system works - but it is the same trade, and leaving a known-false number in an entry whose notes are otherwise doing careful provenance work would undercut the rest of the block.

    Validation: just validate clean; 65/65 evidence snippets verified against the local reference cache; check-duplicate-keys and check-folded-hyphens clean. One notes sentence changed; no data touched.

  summary: Correct a false schema-limitation claim in notes
  details: |
    Correction of a false claim in notes, raised as a non-blocking suggestion on the approving review and verified against the source before acting.

    The previous commit added a paragraph asserting that the three genetic entries are isolated from the pathograph for a structural reason: that a downstream edge resolves only to a pathophysiology or phenotype name, so a susceptibility locus has no attachment point in this schema. The first half is true and the conclusion is false. Genetic has no downstream slot, but that is not the only route in. src/dismech/graph.py builds pathophysiology_by_gene_key from the gene descriptors on pathophysiology nodes and emits a contributes_to edge whenever a genetic entry's gene matches, and SUSCEPTIBILITY is not a member of _NON_CONTRIBUTING_RELATIONSHIP_TYPES, which holds only BIOMARKER, DISPUTED, MODIFIER, PROTECTIVE and UNKNOWN. Both facts were checked in the file rather than taken from the review. Wiring these loci in would take a single genes descriptor on a node.

    The decision not to wire them stands; only the reason was wrong. The paragraph now states it as the curation judgement it is: the GWAS gives replicated loci at the population level and the systematic review gives a functional convergence for the risk-gene set as a whole, but neither says that SLCO1A2, CFAP43 or SFMBT1 acts on CSF absorption specifically, so attaching them to that node would assert a per-gene mechanism the sources do not support. The convergence claim is already curated where it belongs, on the SFMBT1 entry.

    This is the fourth instance in this session's batch of one defect class: a false assertion about a source or about the system, written in free text, where no gate can see it. The others were a claim that a cached abstract was truncated (three sites, PR #9207), a claim that a deep-research validation retro-fit had succeeded when it failed on TLS (PR #9206), and a claim that no cached reference supported the NPH genetic findings when two did. Issue #9226 proposes a gate for the source-claim half of this; the system-claim half - a curator asserting what the code does - has no proposed check and may not admit of one, which is worth recording as the reason to verify such claims against the code before writing them.

    The approving review is expected to be dismissed by this push, which is the correct trade: a false statement about the codebase in a merged KB entry would mislead the next curator who reads this entry as a pattern, and re-earning an approval is cheap by comparison.

    Validation: just validate clean; 65/65 evidence snippets verified against the local reference cache; check-duplicate-keys and check-folded-hyphens clean. No data changed - the edit is confined to one notes paragraph.

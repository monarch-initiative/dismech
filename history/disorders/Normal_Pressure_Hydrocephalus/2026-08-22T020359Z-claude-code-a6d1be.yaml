  summary: 'Review round: link phenotypes into the pathograph, add diagnosis section'
  details: |
    Review round on PR #9211, addressing both blocking findings and all three minor ones. Each was verified before acting; all five were correct.

    Blocking finding 1, orphaned phenotypes, was the substantive one and it exposed an overstatement of my own. The PR body claimed seven nodes, six edges and one connected component; that was true of the pathophysiology subgraph only. Computed over the whole file the graph had eight isolated nodes, including every phenotype. That matters here more than it would elsewhere, because the entry exists to say which arm of the mechanism each element of the triad hangs off - and that claim lived entirely in prose, invisible to anything reading the graph. A sample of 120 disorder entries confirms the reviewer's point that linking is the house pattern: 80 of 119 entries carrying both sections link them.

    Six edges were added, each carrying evidence already quoted elsewhere in the file: periventricular white matter injury to gait disturbance and to urinary incontinence (DIRECT, corticospinal and sacral-fibre snippets), the same node to urinary urgency (INDIRECT_UNKNOWN_INTERMEDIATES, because the cited mechanism names incontinence specifically and urgency is the milder form the trials actually measured), interstitial amyloid-beta accumulation to cognitive impairment (INDIRECT_UNKNOWN_INTERMEDIATES, since the source calls impaired clearance a likely cause rather than a demonstrated one), and ventriculomegaly at normal mean pressure to the ventriculomegaly phenotype. The urinary edge is the one worth noting: the graph now asserts a link the placebo-controlled trial did not confirm, with the knowledge gap attached to that tension rather than floating above the upstream node, which is a better encoding of the open question than the previous arrangement.

    The three genetic entries remain isolated and structurally must: a downstream edge resolves to a pathophysiology or phenotype name, so a susceptibility locus has no attachment point in this schema. That is now stated in notes so the isolation reads as a schema fact rather than a curation gap.

    Blocking finding 2, no diagnosis section, is addressed with three entries built only from already-cached references: MRI morphology (DESH pattern and callosal angle, NCIT:C16809, quoted whole including its own hedge that predictive value for treatment response is limited), cerebrospinal fluid outflow resistance (the direct physiological readout of the absorption node, and the one test here that measures the mechanism rather than its consequences), and response to temporary CSF drainage (the shunt-selection gate, which is the fact the cognitive knowledge gap argues from). The CSF amyloid-beta/tau profile named in the research report is not quotable from anything cached and was deliberately left out.

    Minor findings: a stale clause claiming the genetic section was absent - residue from the pre-reconciliation draft, and directly contradicted by the paragraph after it - was deleted; the SFMBT1 association asserted the gene was a recurrently reported risk gene while its only evidence item never named it, so the snippet that does name it was added; and an uncited comparative claim that diffusivity measures are lower in idiopathic NPH than in mimics was given the snippet supporting it, marked PARTIAL for the same reasons as the other imaging-surrogate items.

    The reviewer's push that the CFAP43 observation should leave a trace outside this file was taken. A stub does not work: it requires its own mondo_id, the only one available is MONDO:0009366, and that is now curated, so the stub would be simultaneously a duplicate and stale. The absence of a distinct identifier is the problem rather than an obstacle to recording it, so it is filed as issue #9225 and referenced from the entry notes.

    Pathograph after this round: seven pathophysiology nodes, five phenotypes, twelve edges, one connected component over those twelve nodes; three genetic entries structurally outside it.

    Validation: just validate clean; just validate-terms clean; 65/65 evidence snippets verified against the local reference cache; check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-cache-order all clean.

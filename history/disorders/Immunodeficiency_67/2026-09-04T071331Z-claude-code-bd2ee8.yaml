  summary: Add diagnosis section (clinical, functional immunology, IRAK4 sequencing)
  details: |
    Added a three-part diagnosis section to IRAK-4 deficiency: (1) clinical recognition of recurrent invasive pyogenic infection (esp. S. pneumoniae) with a characteristically blunted systemic inflammatory response (weak/delayed fever, low CRP) as the central diagnostic pitfall; (2) functional immunology - whole-blood/PBMC failure to produce TNF-alpha/IL-6/IL-12 on MyD88-dependent TLR agonists and absent IL-6 response to IL-1beta, with poly(I:C)/TLR3 spared; (3) molecular confirmation by IRAK4 sequencing showing biallelic loss-of-function alleles. Eight EvidenceItems, all exact-substring snippets from already-cached references (PMID:21057262 Picard 2010 clinical outcome; PMID:17893200 Ku 2007 functional/sequencing); no new references fetched. Ex vivo whole-blood/PBMC stimulation assays graded IN_VITRO per the evidence-source SOP; clinical-outcome observations HUMAN_CLINICAL. Validation: validate, validate-terms, count-verified-snippets (35/35), entity-refs, causal-targets, enum-values, qualifier-terms, validate-disorders, and the against-ref gates all pass.

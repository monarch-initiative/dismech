  summary: 'Create: Immunodeficiency 67 (IRAK4 deficiency)'
  details: |
    De-novo creation of Immunodeficiency 67 (IRAK-4 deficiency, MONDO:0011888, gene IRAK4 hgnc:17967, autosomal recessive). Built as a causal chain: IRAK4 loss of function -> impaired MyD88-dependent TLR/IL-1R signaling (TLR3/TLR4-IFN arms spared) -> defective NF-kB/MAPK activation -> blunted proinflammatory cytokine production -> impaired inflammatory response -> invasive pyogenic bacterial infection (S. pneumoniae, S. aureus, P. aeruginosa) and weak/delayed systemic inflammation; plus a TLR7/plasmacytoid-DC/type-I-IFN branch to severe COVID-19. Phenotypes, genetic (CAUSATIVE, LOSS_OF_FUNCTION), treatments (antibiotic prophylaxis + Antibiotic agent, antipneumococcal vaccination, IVIG), prevalence (CASES_IN_LITERATURE, ULTRA_RARE), and an age-dependent-improvement knowledge-gap discussion. Deep research: EXACTLY ONE report run; requested provider Falcon (Edison) was out of credits (HTTP 402), so --fallback produced an OpenScientist report (research/Immunodeficiency_67-deep-research-openscientist.md), which validated cleanly (18/18 references resolved, no confabulated terms, needs_review flagged only for unresolvable OMIM/Orphanet/NANDO prefixes) and corroborated the entry; its leads were verified against primary abstracts before use. GeneReviews: no GeneReviews chapter for IRAK-4 deficiency found in PubMed. Validation: just validate-disorders passes; snippets 28/28 verified against cached references (PMIDs 12637671, 21057262, 17893200, 30679311, 24596024, 36880831); term/entity-ref/causal-target/qualifier/duplicate-key/enum gates all clean.

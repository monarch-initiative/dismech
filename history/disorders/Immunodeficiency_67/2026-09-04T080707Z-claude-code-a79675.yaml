  details: |
    Addressed the four blocking findings of the ai4c-reviewer CHANGES_REQUESTED review, all from references already cached in the PR (PMID:17893200 Ku 2007, PMID:21057262 Picard 2010): (1) added the non-invasive infection tier - Recurrent Pseudomonas aeruginosa infection (HP:5210057), Recurrent bacterial upper respiratory tract infections (HP:0031949), Recurrent bacterial skin infections (HP:0005406), all FREQUENT, closing the >10% phenotype gap (52/60 non-invasive; P. aeruginosa 16.7%); (2) fixed two snippets that did not support their phenotype - Meningitis and Sepsis now cite the Ku sentence naming 'meningitis, septicemia, or arthritis'; (3) added mortality as a progression phase (childhood window, most deaths before age 2, all before 8) and a HIGH clinical_burden (24 deaths in the Picard cohort); (4) modeled the human/mouse discordance - an animal_models entry (IRAK-4- and MyD88-deficient mice, PARTIALLY_RECAPITULATES the pyogenic-infection node, fidelity LOW, model_scale ORGANISM/ALIGNED, a SPECIES_MISMATCH divergence, MODEL_ORGANISM evidence for both the concordant S. aureus susceptibility and the discordant broad murine susceptibility) plus a HUMAN_MODEL_MISMATCH discussion framing the narrow age-limited human phenotype vs the broad murine one, with the explicit caveat that much discordant data is from MyD88-null not IRAK4-null mice. Non-blocking suggestions dispositioned: OMIM/Orphanet mappings SKIPPED (schema DiseaseMappings has no omim/orphanet slot - only icd10cm/icd11f/mondo/ncit); genetic depth SKIPPED (could not verify the reviewer's HGVS allele forms as exact cache substrings; cache uses Q293X / 1189-1G>T); ORPHA prevalence SKIPPED (Orphadata XML not present); absent-fever phenotype SKIPPED (already covered by the Weak/Delayed Systemic Inflammation node). Validation: validate, validate-terms, count-verified-snippets (48/48), entity-refs, causal-targets, qualifier-terms, enum-values, validate-disorders, model-scale-audit --strict, and the against-ref gates (snippet-length, title-snippets, folded-hyphens, snippet-grading) all pass. One folded-hyphen fix (intracellular-bacterial reworded).

  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Evidence-integrity review of all 35 evidence items against 17 cached references, re-reading each cited publication; 34/35 snippets strict-verified (one GEO dataset accession skipped by prefix, hand-checked). Three defects fixed, all over-claiming in the therapeutics section: (1) brentuximab vedotin SUPPORT rested on a 10-case pediatric series whose own sentence says in children, used for a general treatment claim - downgraded to PARTIAL with the cohort limit stated; (2) the CheckMate 205 registration purpose statement graded SUPPORT for an established-treatment claim - a registration document reports no outcome, downgraded to PARTIAL; (3) the same quote on the nivolumab target_mechanisms link claimed direct support for PD-1-axis targeting - downgraded to PARTIAL with the mechanism claim redirected to the pembrolizumab phase II trial in the same file, and the description reworded. Confirmed clean: no classic-vs-NLPHL confusion (the NLPHL and PMBCL differentials quote sources drawing those exact contrasts in the correct direction); genetics claims (TNFAIP3, NFKBIA, B2M, CIITA at 15 percent, near-universal 9p24.1 copy gain) all trace to exact result sentences. Left unfixed: the deprecated free-text percentage prevalence field (schema-migration item); HUMAN_CLINICAL on two ClinicalTrials.gov records kept pending a repo-wide convention decision, one being shared with Hodgkin_Lymphoma.yaml outside this review's scope. Validation: just validate and strict snippet audit pass; grading/title/length checks clean.

  summary: 'Genetics pass: add KLHDC8B as SUSCEPTIBILITY with its refuting study,
    bind six more somatic drivers, add the antigen-presentation node'
  details: |
    Genetics pass for issue #12193 (d2g wiring-004). MONDO's checklist gene for MONDO:0009348 is KLHDC8B, which was absent. Researching it first, as the campaign requires, produced a disposition rather than a simple addition.

    KLHDC8B. Added as the only germline record in an otherwise somatic entry, graded relationship_type SUSCEPTIBILITY, variant_origin GERMLINE. The supporting evidence is Salipante 2009 (a reciprocal translocation disrupting the gene segregating in one cHL pedigree, a 5'-UTR variant associated with and segregating in further pedigrees, LOH in sorted Reed-Sternberg cells) plus the functional result that KLHDC8B depletion produces binucleate cells, which is the defining Reed-Sternberg morphology, and an independent 2023 whole-genome study of 36 HL pedigrees recovering the same 5'-UTR variant among its top four recurrent risk variants. Against that, a 2018 combined linkage and association study of a five-member nodular-sclerosis pedigree with linkage at 3p21 found no KLHDC8B variant and proposed FAM107A and SLC26A6 instead; that paper is recorded as a REFUTE evidence item rather than omitted. The committed ClinGen gene-validity CSV has no KLHDC8B row, so there is no expert-panel classification to defer to. SUSCEPTIBILITY is therefore the honest grade. It is recorded knowing that kgx_export hardcodes biolink:contributes_to and never reads relationship_type (dismech#12320), so it will export looking like the somatic drivers beside it; suppressing the record to avoid that would make the KB worse, and the caveat is written into the record's notes.

    Somatic drivers. The five existing records gained relationship_type SOMATIC_DRIVER and variant_origin SOMATIC. The locus-named '9p24.1 Copy Gain' record was renamed 'CD274 (9p24.1 copy gain)' and bound to CD274, with a sibling PDCD1LG2 record, because the copy-number gain is of an amplicon containing both genes and they are altered concordantly in 97 percent of cases. JAK2 and STAT6 were bound on the JAK/STAT pathophysiology node but had no genetic record at all, so they reached the pathograph and not the export; both now have records. REL and MAP3K14 were named in a snippet already cited on the NF-kappaB node and are now bound as records too.

    Pathograph wiring. TNFAIP3, NFKBIA, REL and MAP3K14 were added as a genes list on Mutation-Driven NF-kappaB Activation, whose own cited snippet names all four and distinguishes the destructive negative-regulator mutations from the positive-regulator copy gains. CD274 and PDCD1LG2 were added to PD-1 Ligand-Mediated Immune Evasion with a new evidence item naming both loci. B2M and CIITA had records but no node, and belong to a mechanism the pathograph did not model, so a new node was added, Mutation-Driven Antigen-Presentation Loss, with a directed edge to the checkpoint node justified by the finding that HRS-cell MHC class II expression, not class I, predicts complete remission on PD-1 blockade.

    Sourcing correction found in self-review. A first draft of the JAK2 record asserted that JAK2 lies in the 9p24.1 region without a source for the locus. A review already cited by this entry states that the 9p24.1 amplifications affect JAK2, PD-L1 and PD-L2 genes; that sentence is now quoted as the record's evidence.

    Cancer rules. just check-cancer-origin reports the same result before and after: one origin node identified via SOMATIC_LESION, cell of origin CL:0000844 germinal center B cell. The new node binds the same cell type, so it does not create a second derived origin.

    Validation. just validate-pre-edit, count-verified-snippets 51/51, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean. Gene-to-mechanism wiring moved from 0/5 to 10/11; the unwired gene is KLHDC8B, which is germline predisposition and correctly not attached to a somatic lesion node.

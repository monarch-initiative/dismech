  summary: 'Review round 1: split the antigen-presentation node into class I and class
    II arms; add quote_role; correct two overstatements'
  details: |
    Review round 1 on PR #12328 (issue #12193). Approved with five non-blocking suggestions; this record covers the two that touched this entry, plus two self-review corrections found while waiting for the verdict.

    Suggestion 1, taken. Mutation-Driven Antigen-Presentation Loss bundled B2M (MHC class I) and CIITA (MHC class II) on one node under a single GO:0019882 process, and its downstream edge carried class-I-specific reasoning (loss of cytotoxic T-cell recognition) that does not describe the CIITA arm. Split into Mutation-Driven MHC Class I Loss (B2M, GO:0002474, edge intermediate 'Loss of CD8 cytotoxic T-cell recognition of HRS cells') and Mutation-Driven MHC Class II Loss (CIITA, GO:0002495, edge intermediate 'Loss of CD4 T-cell recognition of HRS cells'). Each now carries its own reasoning. The class II node carries the finding that motivates the split: HRS-cell MHC class II expression predicts complete remission on PD-1 blockade and class I expression does not, recorded as two evidence items on that node's edge.

    Suggestion 2, partially taken with a stated decline. quote_role: REVIEW_SYNTHESIS added to all twelve evidence items citing PMID:27221964 (Seminars in Cancer Biology) and PMID:34075767 (which self-describes as a Narrative Review). evidence_source was NOT changed from OTHER to HUMAN_CLINICAL: both quoted sentences also appear in kb/disorders/Hodgkin_Lymphoma.yaml graded OTHER, and that file is outside this issue's scope, so flipping the grade here alone would create the same-sentence-two-grades divergence check-snippet-grading exists to discourage. CLAUDE.md documents OTHER plus REVIEW_SYNTHESIS as a coherent pair, so the provenance information the suggestion asked for is recorded without the side effect.

    Self-review corrections. The antigen-presentation description said recurrent B2M lesions 'abolish' beta-2-microglobulin and surface MHC class I. The cited paper says 'perturbed antigen presentation' and 'reported deficiencies of MHC class I expression'; 'abolish' overstated it and is now 'disrupt', with the paper's own sentence added as evidence so the wording is checkable against its source. 'master transactivator of MHC class II' was trimmed to match what the source says, and the claim now carries a body-text quote rather than resting on the paper's title.

    One snippet replaced during this round. A first draft quoted 'MHC class II transactivator CIITA', which is a fragment of the cited paper's title and would have failed check-title-snippets. Replaced with a body sentence, 'CIITA is an essential transactivator of MHC class II expression'.

    Validation. count-verified-snippets 55/55; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, list-gene-term-mismatches clean. check-cancer-origin still derives one cell of origin (CL:0000844 germinal center B cell) despite the node split, because both new nodes bind that cell type.

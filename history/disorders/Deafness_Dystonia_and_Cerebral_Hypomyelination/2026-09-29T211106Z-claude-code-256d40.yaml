  summary: 'Create: Deafness Dystonia and Cerebral Hypomyelination'
  details: |
    New entry for BCAP31-related DDCH (MONDO:0010334, OMIM 300475), replacing the seed file and deleting the stub.

    Deep research: one Perplexity report, research/Deafness_Dystonia_and_Cerebral_Hypomyelination-deep-research-perplexity.md. Its reference validation (run for this curation) checked the one PMID it names (24011989), which resolved; the report otherwise cites by URL and was used only as a lead. preflight-dr returned WARN only because the acronym DDCH was counted as a gene; the report is about BCAP31. All evidence was re-derived from PubMed searches on BCAP31 and fetched into references_cache (13 PMIDs quoted as evidence, one review listed under references, 3 more named in notes).

    Content: X-linked recessive inheritance with symptomatic carrier females and a skewed-X-inactivation affected girl; BCAP31 as causative gene; causal chain BCAP31 loss of function -> ER morphology and ER-to-Golgi trafficking defect (patient fibroblasts, no UPR or apoptosis) -> impaired CNS myelination and neurodevelopmental brain dysfunction -> phenotypes; a second, contested branch to mitochondrial complex I deficiency (one patient's fibroblasts, with REFUTE items from normal muscle and fibroblast assays) and, via an allelic nonsyndromic auditory-neuropathy family, to cochlear hair-cell loss. 20 HP-bound phenotypes; frequency bands only where PMID:33603160 gives per-feature denominators for loss-of-function males.

    Decision: the BCAP31-ABCD1 contiguous deletion syndrome (CADDS) is modelled as a differential diagnosis (MONDO:0018247), not a has_subtypes row, because current MONDO and Orphanet treat it as a separate disease and its distinguishing features (VLCFA elevation, neonatal cholestasis, death in infancy) come from ABCD1 loss or the combined deletion. The stub synonym for CADDS was dropped for the same reason. BCAP31-SLC6A8 deletions stay in scope. Two KNOWLEDGE_GAP discussions record the unexamined myelination mechanism and the conflicting mitochondrial data.

    Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes and validate-disorders pass.

  summary: Ground BCAP31 molecular function; split mixed evidence item
  details: |
    CI gate check_gene_activity_grounding failed: BCAP31 landed on 'BCAP31 Loss of Function', which named no molecular function. Bound GO:0038024 cargo receptor activity (modifier ABSENT), evidenced by PMID:33603160 'BAP31 also serves as a cargo receptor for the export of transmembrane proteins.' (BACKGROUND, IN_VITRO). GO's own MF annotation for BCAP31 is only protein binding (IPI); cargo receptor activity was chosen because the node and the literature describe ER-export cargo receptor function. Same push takes three non-blocking review suggestions from the round-1 approval: the PMID:28332767 item quoting two sentences that cut different ways was split into a SUPPORT/INDIRECT item (pleomorphic mitochondria) and a REFUTE item (normal respiratory-chain activity); the edge into Cochlear Hair Cell Degeneration now says the allelic-family cells were assayed for general mitochondrial dysfunction, not complex I; the complex I node description explains why the assembly term (GO:0032981) is used. Validation: validate 68/68 snippets, validate-terms, check-entity-refs, check-duplicate-keys and the gene-grounding gate against origin/main all pass.

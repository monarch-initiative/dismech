  details: |
    New PPFIBP1 entry (MONDO:0859283, claim #14398). Requested default falcon failed three times (Edison 503 authentication, including with --fallback, which found no alternative); deep research was then run with the claude_code provider (research/...-deep-research-claude_code.md: 13/13 references and 4/4 quotes verified, 70/70 terms resolved, two label paraphrases only). Curated primarily from the full text of the founding cohort (PMID:35830857) and the 2023 family (PMID:36527195), with mechanism from liprin structural (PMID:21855798), Drosophila (PMID:21084592) and C. elegans hlb-1 (PMID:19290026) studies. Two HPO IDs first written from memory were wrong and corrected by validation (periventricular calcification now HP:0007229; HPO has no drug-resistant epilepsy term, so resistance is recorded on the Seizure row). No GeneReviews chapter exists. Validated with just validate (schema, terms, 58/58 snippets) and check-entity-refs. A fresh-context red-team review against the cohort full text then led to: growth rows re-cited to the sentences that give their counts, Leukoencephalopathy and Cryptorchidism frequencies corrected to FREQUENT, the eye row given coarse_binding_basis VARIABLE_SPECTRUM, an unsupported claim that the 2023 family lacked epilepsy removed, Aicardi-Goutieres added as a differential, and tonic seizure, basal ganglia calcification, cerebellar vermis hypoplasia, polymicrogyria and cortical atrophy added. After that round: just validate-disorders passes, 64/64 snippets verified, check-coarse-phenotypes and check-granularity OK.

  summary: 'Review response: LVNC8 (TGF-beta link regrade, prevalence restructure,
    Cre drivers)'
  details: |
    Self-review pass over the augmentation recorded in the preceding history entry, run with the dismech-pr-review skill before opening a PR. Three substantive problems were found and fixed. First, the Prdm16Q187X knock-in was graded RECAPITULATES against the TGF-beta node while its own readout recorded direction DECREASED and the node asserts modifier INCREASED, so the entry simultaneously claimed the model reproduces the node and measured it moving the opposite way. The link is now FAILS_TO_RECAPITULATE with fidelity LOW, its description (which had called falling TGF-beta 'the in vivo counterpart of the promoter-level repression PRDM16 exerts on TGFB3', which is backwards) was rewritten, and the node description now states that INCREASED is the majority position rather than a settled one and points at the gap_lvnc8_tgfbeta_direction_conflict discussion. Second, neither prevalence record was a prevalence of this disease: one had LVNC-of-all-causes as its numerator and, through a copy error, LVNC patients as its population denominator, and the other was 1p36-deletion penetrance. Both nonetheless published prevalence_class ABOVE_1_IN_1000 and a rate, which any structured consumer would have read as LVNC8 occurring above 1 in 1000. They are replaced by a single record for molecularly confirmed LVNC8 with measure_type UNKNOWN and prevalence_class NOT_YET_DOCUMENTED, asserting no rate, carrying both published figures in notes as an upper bound and a penetrance figure respectively, with their evidence retained and marked INDIRECT. Third, the PMID:39304345 model was described as cardiomyocyte-specific with deletion 'complete within the cardiomyocyte lineage'; the cached full text shows an Sm22alpha-Cre driver that also eliminates PRDM16 in smooth muscle cells, which is now recorded in the genotype and limitations. Also fixed: two link-evidence snippets were background-framing sentences rather than findings (PMID:38113297's abstract BACKGROUND opener and PMID:39304345's second sentence, which cites eight other papers) and were replaced with the papers' own results; the two evidence_source OTHER gradings that had been justified by the sentence's role rather than the publication's study type were corrected, and PMID:31959004 and PMID:39420976 were regraded OTHER to HUMAN_CLINICAL as pooled human cohort epidemiology; PMID:34915728's abstract BACKGROUND ('mechanisms remain unknown') had been cited twice as if it were the paper's conclusion, where its CONCLUSIONS section offers an explanation, and both places were rewritten; the discriminating meta-regression finding that ejection fraction rather than trabeculation extent drives event-rate variation was moved off the Thromboembolic Risk node, where it did not support the node's claim, onto the three causal edges out of the ventricular dysfunction node, where it is the evidence that routes those consequences through dysfunction rather than off noncompaction; directness INDIRECT was added to the PMID:37395136 transplant item, the item with the largest inference gap in its block and the only one there unmarked; Cre drivers are now named in every mouse genotype where the record states one (Xmlc2-Cre and cTnT-Cre for PMID:34915728, Sm22alpha-Cre for PMID:39304345) with a note that PMID:32083975's driver is not in the abstract-only record, since driver choice is a documented source of divergence between Prdm16 studies and is a candidate explanation for the TGF-beta conflict; the curated Myocardial Fibrosis phenotype had no model linked to it despite three models measuring fibrosis, and now has three links; a sex-stratified mortality readout targeting the dilation node was moved to link-level evidence because mortality is a downstream consequence rather than an outcome measure of chamber geometry; and a claim that the Q187X mouse was the only allele-based model in the entry was corrected, since the zebrafish model also expresses a human truncation allele. One reviewer finding was not acted on: PMID:38019448's ellipsis-joined snippet in genetic.case_fractions does not substring-match its cache, which is pre-existing and outside this change. Post-fix state: 18 model links across 7 models, 14/14 causal edges evidenced, compliance 100 percent (267/267), 131/131 snippets verified, all offline gates and model-scale-audit --strict clean.

  summary: 'Curate phenotypes: Left Ventricular Noncompaction 8'
  details: |
    Phenotype pass from cached literature (PubMed, Europe PMC and OLS were unreachable from the curation environment). Added Hypertrophic Cardiomyopathy and Restrictive Cardiomyopathy (PMID:40439125 review synthesis of a 285-patient cohort, with its caveat that only 3 of 16 PRDM16 variants of interest were pathogenic), Endocardial Fibroelastosis (PMID:31965688, fetal onset) and Palpitations (PMID:39895316). Enriched Left Ventricular Noncompaction (PMID:38113297 both probands, PMID:35893073, PMID:39895316), Dilated Cardiomyopathy (PMID:29367541, PMID:38113297), Congestive Heart Failure (PMID:35893073) and Wolff-Parkinson-White Syndrome (high-risk pathway, PMID:39895316). Removed frequency labels FREQUENT and VERY_RARE that no source supported with counts; added FETAL onset to the hydrops phenotype; removed the endocardial fibroelastosis claim from the mouse-only Myocardial Fibrosis row. Wired four previously unconnected phenotypes from existing pathophysiology nodes. Recorded ARVC, sudden cardiac death and adult-onset biventricular failure as leads in notes, plus the GeneReviews Overview baseline status. Validated with validate, count-verified-snippets (all verified), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes, check-name-collisions, check_snippet_length. Review round 1 (approved with suggestions): added a REFUTE item from the primary rare-variant study PMID:33500567 on the HCM row, corrected the mouse hypertrophy wording (Mesp1-Cre only under stress or with age, no animal-model cross-reference), and rebased onto main.

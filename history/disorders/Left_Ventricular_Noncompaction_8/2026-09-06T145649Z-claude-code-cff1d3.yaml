  details: |
    Second-round augmentation of the existing LVNC8 (PRDM16) entry. Deep research: a fresh falcon (Edison) run on 2026-09-06 (684s, 36 citations; frontmatter reports 13/13 references verified, confabulation_rate 0.0, and 23/23 terms verified). Its needs_review flag is set only by a template-rendering artifact, the literal string 'if available' recorded as a reported label for MONDO:0014152; the CURIE itself is correct and no term was bound from that list without independent checking. The report cites by DOI rather than PMID, so DOIs were resolved through the PMC ID converter and cited under PMIDs, which are snippet-validated by the gating validator where DOI-keyed items are not. What was added: (1) evidence on all 14 pathophysiology downstream causal edges, which previously had none, each quoting a source that makes the causal claim rather than reusing a node citation, with directness INDIRECT where the source establishes co-occurrence rather than a demonstrated sequence; (2) a new animal_models section with 7 models and 15 modeled_mechanisms links carrying readouts, fidelity, model_scale and limitations, including one FAILS_TO_RECAPITULATE link recording that the genotype-matched heterozygous Prdm16Q187X mouse shows smaller rather than dilated ventricles; (3) a new prevalence section, adult LVNC point prevalence 0.5 percent and cumulative cardiomyopathy in PRDM16-deleted 1p36 individuals at 29.1 percent, both flagged as broader than LVNC8 itself; (4) a new clinical_trials section with two observational registries; (5) two new discussions, a HUMAN_MODEL_MISMATCH recording that Prdm16-null hearts show TGF-beta activation while the genotype-matched Q187X heterozygote shows age-dependent loss, and a KNOWLEDGE_GAP on the female-predominant severity signal seen in two mouse lines and in 1p36 deletion patients; (6) evidence added to the dataset record quoting its GEO summary, to the Cardiac Transplantation treatment, and to the three terminal nodes. New references: PMID:31959004, PMID:32083975, PMID:37395136, PMID:39420976, clinicaltrials:NCT06024759, clinicaltrials:NCT03572569. Deliberately not cited and recorded in the entry notes: DOI:10.20944/preprints202507.1652.v1 (unpublished preprint duplicating criteria already covered by PMID:25443708), NCT04265040 (broad multi-cardiomyopathy cohort with no LVNC arm), and DOI:10.1101/2020.01.03.19015602 (medRxiv preprint of the already-cited PMID:33500567). One prose correction: the Cardiac Transplantation description previously stated that no PRDM16-specific transplant outcome data exist, which PMID:37395136 contradicts, so it was rewritten rather than left to rot beside the new evidence. Validation: just validate-disorders passed (schema, terms, references) with 122/122 snippets verified; compliance rose from 88.3 percent to 100 percent; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass with no new violations; model-scale-audit --strict exits 0. Uncited DOI caches written as a byproduct of the report's own reference-validation pass were pruned after re-deriving the cited-reference list, and snippet verification was re-run on the pruned tree.

  details: |
    Response to the ai4c-reviewer 'Request changes' review on PR #11284. The blocking finding was correct and is fixed: the Congestive Heart Failure node's PMID:31959004 evidence item carried evidence_source HUMAN_CLINICAL while its explanation still ended 'evidence source is OTHER because this is a meta-analysis of observational studies'. That was leftover draft text from the earlier regrade of this paper from OTHER to HUMAN_CLINICAL; two sibling clauses were stripped at the time and this third one, wrapped differently, was missed. HUMAN_CLINICAL is the correct value and the clause is deleted. A programmatic sweep for any evidence item whose explanation names an evidence_source different from its own field now returns none. Both reviewer suggestions were taken, and chasing the second one turned up two things that changed content rather than presentation. The reviewer noted that two of the seven animal models had generic genotype strings not naming a Cre driver. The full text of PMID:37395136 states 'Our murine model is similar to the one developed by Nam et al using the alpha-MHC (Myh6)-Cre driven knockout', which supplies the driver for its own model and attributes one to PMID:32083975, whose own cached record is abstract-only. Both genotypes now name Myh6-Cre, with the attribution made explicit for the Nam line rather than presented as the paper's own statement. The same passage reports that Myh6-Cre knockouts gave hypertrophy in one model and LV dilation in another, and lists Cre driver efficiency, deleted cell type, deletion timing and background genetics as explanations for phenotypic variation across Prdm16 models; that is cited in the gap_lvnc8_tgfbeta_direction_conflict discussion. More substantively, the same search surfaced the Q187X paper's own conclusion that 'PRDM16 bidirectionally regulates TGFbeta signaling in a temporally-dependent manner'. That is a proposed reconciliation of the direction conflict, so three places asserting that no study had reconciled the conflicting TGF-beta directions were wrong and are corrected: the discussion rationale, the Nam link limitation, and the Q187X link limitation now record bidirectional temporal regulation as the leading candidate explanation while noting it has not been tested across models. The FAILS_TO_RECAPITULATE grading on the Q187X TGF-beta link is unchanged, since the direction mismatch against the node's asserted INCREASED is a fact about the measurement regardless of how it is later explained. The reviewer's other suggestion was that two non-animal systems consumed as IN_VITRO evidence had no experimental_models block. Added: the PRDM16-Q187X proband-derived hiPSC-cardiomyocytes (IPSC_DERIVED_MODEL, RECAPITULATES Impaired Cardiomyocyte Proliferation, the only human system in the entry carrying an actual LVNC8 genotype) and the H9c2 rat cardiomyoblast line (CELL_LINE, PERTURBS TGF-beta Signaling Dysregulation with a ChIP-PCR promoter-occupancy readout, fidelity LOW with an explicit caveat that it establishes PRDM16 can repress TGFB3 rather than the direction in patient myocardium). A stray whitespace-only line after the transplantation treatment evidence was removed. The reviewer could not reach the ClinicalTrials.gov API to confirm the RECRUITING and UNKNOWN trial statuses; both were verified against the v2 API during curation and are unchanged. Post-fix state: compliance 100 percent (284/284), 139/139 snippets verified, all offline gates clean.

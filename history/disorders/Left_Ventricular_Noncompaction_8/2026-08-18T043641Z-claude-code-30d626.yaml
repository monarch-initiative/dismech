  summary: 'Create: Left Ventricular Noncompaction 8 PRDM16'
  details: |
    Created new dismech entry for left ventricular noncompaction 8 (LVNC8, MONDO:0014152, OMIM:615373, causal gene PRDM16 / hgnc:14000), resolving issue #8747. Duplicate preflight confirmed MONDO:0014152 was uncurated on origin/main, in all PRs, and in all issues before starting; a companion agent curated the distinct LVNC10/MYBPC3 entity (issue #8746) concurrently in a separate worktree.

    Literature base: direct PubMed search for PRDM16 plus LVNC/cardiomyopathy surfaced 9 primary-literature PMIDs (23768516 founding 1p36-deletion/PRDM16 report; 34915728 and 38113297 mouse/human mechanistic studies establishing PRDM16 as a compact-myocardium transcription factor that represses TGFB3 and restrains TGF-beta signaling; 27642787 iPSC-CM TGF-beta/PRDM16 study; 31965688 fetal presentation case; 35893073 pediatric cohort gene-frequency study; 39895316 WPW case; 40439125 review; 33500567 large rare-variant study already cited in Dilated_Cardiomyopathy_1AA.yaml). No dedicated GeneReviews chapter exists for LVNC8 specifically (searched PubMed TI:GeneReviews, no hit); NCBI MedGen (CUI C3809288) clinical-feature list was used as an OMIM/GeneReviews-equivalent phenotype baseline instead.

    Modeled a 7-node pathophysiology chain from PRDM16 loss-of-function variant through loss of compact-myocardium transcriptional identity, TGF-beta signaling dysregulation, impaired cardiomyocyte proliferation, to two parallel downstream branches (failed ventricular compaction; LV dilation and systolic dysfunction) converging on heart failure, arrhythmia, and thromboembolic risk, with conforms_to links into cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling and #Structural Cardiac Impairment and Heart Failure (exact node names confirmed by grepping the module file).

    Resolved the noncompaction-vs-DCM nosological tension named in the issue via an explicit discussions entry (kind INTERPRETATION) citing PMID:23768516 (PRDM16 causal in both nonsyndromic LVNC and DCM cohorts) and PMID:33500567 (PRDM16 truncating variants LVNC-specific alongside MYH7/ACTN2), rather than silently picking one label; both the noncompaction and DCM phenotypes are curated as top-level Phenotype entries. Cross-referenced the polygenic Left_Ventricular_Noncompaction.yaml umbrella entry and Dilated_Cardiomyopathy.yaml / Dilated_Cardiomyopathy_1AA.yaml as differential diagnoses and related entries, and explicitly distinguished LVNC8 (single-gene, nonsyndromic) from 1p36 deletion syndrome (multigene, syndromic) as a second differential-diagnosis entry, since PRDM16 is the cardiomyopathy-critical gene within that contiguous-gene deletion.

    Deep research: ran just research-disorder falcon Left_Ventricular_Noncompaction_8 (Edison Scientific Literature provider, 633s runtime, citation_count 23, reference_validation confabulation_rate 0.0, 11/11 references verified, 8/11 on-topic). Ran just preflight-dr against MONDO:0014152 before using the report: verdict WARN (PRDM16 mentioned 57 times vs next-highest TBX20 3 times, a strong positive signal; the report's OMIM 605557 vs MONDO's OMIM xref 615373 flagged as a mismatch). Manually resolved the WARN per the SOP: confirmed via NCBI Gene / mygene.info that OMIM 605557 is PRDM16's own gene-locus MIM number, not a rival disease entity, while 615373 is the LVNC8 phenotype MIM number -- normal OMIM gene-MIM vs phenotype-MIM structure, not Named Entity Confusion. Cleared the report for use; no NEC found, no rival gene surfaced, and PRDM16's independent fame in brown-adipocyte biology was explicitly checked for and not present in the report. The falcon report's own content matched and confirmed the already-curated entry rather than surfacing materially new claims, so no additional falcon-sourced content was incorporated beyond the 9 PMIDs already found via direct PubMed search.

    Also cited the existing ClinGen PRDM16-dilated-cardiomyopathy Strong / autosomal-dominant gene-disease validity assertion (already cached from Dilated_Cardiomyopathy.yaml curation) for the genetic and inheritance sections, and one GEO dataset (geo:GSE307782, a PRDM16 hiPSC-cardiomyocyte knockdown/overexpression study; no evidence block, per the bulk-dataset convention, since no linked PMID exists yet).

    Validation performed and read to completion: just validate (schema pass, term validation pass, reference validation 34/34 snippets verified against cached references), just count-verified-snippets (34/34), just validate-terms (pass), and just validate-disorders -- the CI-equivalent batched pre-PR sweep -- (schema pass, term pass, 34/34 snippets verified). Additionally ran, to completion, a targeted pytest tests/test_data.py -k "conforms_to_module_node_references or subtype_foreign_keys or environmental_mechanism_targets or duplicate" sweep across the whole KB (6149 passed, 0 failed) confirming the new entry's conforms_to/foreign-key references do not break repository-wide invariants.

  summary: 'Review round 1 fixes: MF binding, skin term withdrawal, surface evidence,
    animal models'
  details: |
    Records the review round-1 fix session for PR #9331, which the CREATE record does not cover. That record is append-only and correctly describes the creation session as it ran, including its accurate-at-the-time count of 38 of 38 snippets verified; the entry now verifies 47 of 47, and this record carries the current figure so a later reader does not take the earlier one as current.

    Four blocking findings addressed.

    1. GO:0042605 peptide antigen binding removed from the trigger node. It was a false match on two counts: beta-2-microglobulin is the invariant light chain and does not bind peptide - the groove belongs to the heavy chain's alpha-1/alpha-2 domains - and the preferred_term named a protein rather than a molecular function. Its modifier: LOSS_OF_FUNCTION also contradicted the node's own description, which argues the lesion lowers the supply of the light chain rather than altering the activity of the protein. GO:0042288 MHC class I protein binding now sits on the depletion node with modifier: DECREASED, which is the quantitative reading the description actually supports. Note that the term validator could not have caught this: GO:0042605 exists, its label matched, and it was in the correct slot for a biological process. Only reading the node's prose against its own binding surfaces this class of error.

    2. HP:0200042 Skin ulcer binding withdrawn. The only quotable source says 'severe skin disease'; the ulcer specificity came from the record's MeSH indexing rather than the authors, and the cached record is abstract_only so there is no full text to appeal to. The node is renamed Severe Skin Disease with a free-text preferred_term at the specificity the source offers, and the description records why the term was drafted and withdrawn.

    3. HP:0025794 regrounded. The cell-surface sentence from PMID:25702838 is now the leading SUPPORT item; the soluble-HLA serum measurement is retained as a second item demoted to PARTIAL rather than deleted, since it is real corroborating data that measures a different thing.

    4. Two animal_models added with modeled_mechanisms: B6.129P2-B2m tm1Unc targeting Accelerated Endogenous Catabolism of IgG and Albumin, and B6.129X1/SvJ-Fcgrt Tm1Dcr targeting Failure of pH-Dependent FcRn Salvage. The second strain is the one that licenses reading the human disease as an FcRn phenotype rather than an unspecified consequence of losing class I. The direction: UNCHANGED albuminuria readout is a negative result doing real work - it converts a shortened half-life into a catabolism claim, mirroring the proteinuria exclusion in the 1990 human turnover study.

    Also taken from the non-blocking suggestions: HP:0003075 Hypoproteinemia added (the eponymous phenotype), and a progression record for the index patient's death that flags the accompanying thrombocytopenia as unexplained rather than assimilating it into the mechanism.

    Separately, the notes: block's 'Review round 1 changed four things' paragraph has been rewritten as standing curation rationale. The content was worth keeping - particularly the withdrawn-term reasoning - but the round-by-round framing renders on the public disorder page, where a reader in a year has no PR in view. The round narrative belongs here instead, which is what this record is for.

    Validation: just validate passes with 47/47 snippets verified; just validate-terms passes; check-folded-hyphens clean.

  summary: 'Create: Hypercatabolic Hypoproteinemia MONDO:0009434'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report, which passed 'just preflight-dr' against MONDO:0009434 with a PASS verdict: canonical gene B2M mentioned 84 times, and the report's OMIM identifiers include the MONDO xref 241600. The report was treated as a lead only. Its own citation list is dominated by non-PubMed URLs and its treatment section carries no primary citations, so all seven references cited here were located by PubMed query and each abstract was read before use. Three PMIDs recalled from memory during that search resolved to unrelated papers and were discarded after fetching them. The pathograph is a deliberate two-arm model from a single B2M lesion: the FcRn salvage arm, which produces the hypercatabolism of IgG and albumin the disease is named for and which was defined by protein turnover studies in 1990, and the antigen-presentation arm, absent classical MHC class I and CD1a/b/c with a failed CD8 compartment and unlicensed NK cells, which was characterised only in 2015. Neither arm is a complication of the other. No treatments are curated: all six primary references were grepped for treatment facts using several phrasings and none reports a therapy given to a patient with this disease. Validation run: 'just validate' passed with 38 of 38 snippets verified against cached references, 'just validate-terms' passed, and all five ungated CI gates were clean - check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-duplicate-keys.

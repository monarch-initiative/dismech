  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review. PMID:2254461 is cached as full text and was substantially under-mined; most additions come from it. Fidelity fix, the significant finding: the Reduced Circulating IgG phenotype asserted that the hypogammaglobulinaemia is 'restricted in mechanism to IgG, since FcRn salvages IgG and not the other immunoglobulin classes'. The cited paper contradicts this - IgA survival in the index patient was 2.9 days against a normal mean of 6.4, with the fractional catabolic rate roughly doubled; only the serum concentration was spared, because synthesis rose to cover it. The description was rewritten to distinguish the catabolic abnormality (not IgG-restricted) from the serum-concentration abnormality (which is), and the qualifying sentence added as PARTIAL. Added a biochemical section the entry lacked, with three records carrying the quantitative turnover data that names the disease: IgG fractional catabolic rate (31 and 36 percent of the intravascular pool per day against a normal 6.7 plus or minus 2), IgG survival half-lives (3.3, 3.0, 2.8 days against 22.9 plus or minus 4), albumin (6-day half-life against a normal 16 with normal synthesis), and the masked IgA hypercatabolism. Added the third diagnostic exclusion, absent autoantibodies to IgG, IgA and albumin, which is the exclusion most specific to a hypercatabolic mechanism since anti-plasma-protein autoantibody is itself a recognised cause of accelerated clearance. Added an Impaired Specific Antibody Response phenotype (anti-B titre failing to rise on challenge against a control mean of 1:1,024) with the intrafamilial discordance noted. Strengthened the existing skeletal/diabetes knowledge gap with the specific radiographic finding, shortened ulnae with bowed radii, concordant between both affected siblings. Added a HUMAN_MODEL_MISMATCH discussion recording that the shortened human IgA survival contradicts the unchanged IgA half-life in the beta-2-microglobulin knockout mouse, which this entry otherwise uses as its specificity control; the mouse evidence is curated REFUTE against the human observation and the resolving experiments are named. Validation: schema pass, terms pass, 62/62 snippets verified individually and 188/188 in the batched sweep, entity refs and duplicate keys clean.

  summary: 'Review response: cramps phenotype, supportive-care treatments, six suggestions'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9769, plus the
    failing `test (3.13)` job.

    CI failure (fixed first). `just check-snippet-length` rejected
    diagnosis[0].evidence[1].snippet, "Sensation was preserved." - a complete
    sentence in the PMID:16967488 abstract, but three words, and grandfathering is
    unavailable for a snippet introduced on the branch. Fixed by extending the quote
    backwards to the preceding exam sentence ("Tone and tendon reflexes were
    decreased and a distal tremor was common. Sensation was preserved."), which is a
    verbatim substring of the cached abstract. The explanation was widened to match
    what is now quoted. The snippet was not shortened or invented.

    Review finding 1 - Muscle Cramps. Added HP:0003394 as a Neurologic phenotype.
    The canonical HPO label is "Muscle spasm" (verified with OAK); "Muscle cramps"
    is an EXACT synonym and is used as preferred_term. Evidence is the ORPHA:209335
    definition the entry already quoted twice, which names cramps among the cardinal
    features. No frequency band curated - no molecularly confirmed p.Pro56Ser series
    quantifies cramp burden. The evidence explanation records that the entry's
    existing REFUTE against the same ORPHA sentence is confined to its
    pyramidal/bulbar exclusion clause, so citing it as SUPPORT here is not a
    contradiction.

    Review finding 2 - treatments. The entry previously curated no treatments block
    at all. Added three, all supportive:
      * Noninvasive Ventilation (NCIT:C171457, therapeutic_modality DEVICE),
        target_mechanisms -> Respiratory Insufficiency with treatment_effect
        BYPASSES (mechanical support substitutes for force the denervated
        diaphragmatic and intercostal units cannot generate; it acts nowhere on the
        VAPB chain). Evidence: this cohort's own 10-year NIV milestone
        (PMID:42166520), the French expert-panel respiratory-care guidance
        (PMID:39019674), and the Bourke NIV RCT (PMID:16426990).
      * Physical Therapy and Rehabilitation (NCIT:C15302, BEHAVIORAL),
        target_mechanisms -> Loss of Ambulation with treatment_effect MODULATES
        (rehabilitation alters how much disability a given degree of weakness
        imposes; nothing shows it slows motor unit loss). Evidence: PMID:24510737,
        plus the wheelchair-at-7-years / death-at-21.9-years gap that is the
        disease-specific reason it matters here.
      * Genetic Counseling (NCIT:C15240, action_category COUNSELING_INFORMATIONAL,
        no target_mechanisms per schema). Evidence: the cohort paper's own
        conclusion.
    Evidence drawn from the ALS literature rather than from p.Pro56Ser carriers is
    marked supports: PARTIAL with the extrapolation named in its explanation. No new
    reference cache files were needed - all three supporting references were already
    in references_cache/ from the ALS entry.
    The two prose passages asserting the absence of a treatments block (the
    vapb_no_disease_modifying_therapy discussion rationale, and the "What is
    deliberately not curated" note) were rewritten. The no-disease-modifying-therapy
    argument itself is unchanged: nusinersen, risdiplam and onasemnogene are
    SMN-directed and have no route to a non-5q disorder with normal SMN.

    Suggestions worked:
      * mean_age_years 44.9 is a cohort median. Added the explicit disclaimer note,
        following the CASQ2_CPVT and PARK7 precedent.
      * Added a mappings block: ICD10CM:G12.1 broadMatch from the ORPHA:209335
        cross-reference table (G12.1 is a residual bucket whose synonym list spans
        distal SMA, scapuloperoneal SMA, Kugelberg-Welander and Fazio-Londe). For
        ICD-11, the icd11f dynamic enum keys on numeric Foundation entity ids, which
        neither Orphanet (which gives the linearization code 8B61.Y) nor
        MONDO:0008453 supplies; mapped instead to icd11f:353473981 "Autosomal
        dominant proximal spinal muscular atrophy" as broadMatch with the derivation
        stated in notes, rather than asserting 8B61.Y.
      * GeneReviews. Resolved the reviewer's open disclosure: a PubMed search
        restricted to the GeneReviews book for VAPB/ALS8 returns exactly one record,
        PMID:20301623 (the ALS Overview). No VAPB- or ALS8-specific chapter exists.
        It is now listed in references with tags: [GeneReviews] and the search is
        recorded in notes; nothing is cited from it, because its indexed content is
        the chapter's own statement of purpose.
      * Dropped four cached-but-uncited reference files: DOI_10.1086_425287,
        DOI_10.1093_hmg_ddv360 and DOI_10.3390_cells10081865 are DOI duplicates of
        cited PMID:15372378, PMID:26362257 and PMID:34440634; DOI_10.7488_era_2973
        is an unpublished Edinburgh thesis. None was referenced from any file under
        kb/.
      * Consumed the fifth: PMID:34133501 now supports the
        vapb_p56s_one_allele_many_phenotypes discussion, stating the Finkel-SMA /
        ALS8 allelism its premise rests on.
      * Fixed the PROVISIONAL-vs-EMERGING wording mismatch on the autonomic node's
        evidence explanation (mechanism_confidence has no EMERGING value).
      * Phenotypes: added Proximal Lower Limb Onset Weakness (HP:0008994), which
        carries both axes the source states ("Onset was lumbar in 94%, proximally
        predominant"), in preference to the DR-proposed HP:0007340. Declined the
        DR-proposed postural tremor: HP:0002173 is "Hypoglycemic seizures", not
        postural tremor, and no cited abstract says the tremor is postural - the
        cited source says only "a distal tremor was common". The unsourced word
        "postural" was removed from the Distal Tremor description and HP:0001337
        retained.

    Validation: just validate (passed), just count-verified-snippets (94/94 verified
    against cached references), just validate-terms (passed), just
    check-duplicate-keys (passed), just check-snippet-length (passed),
    just check-title-snippets, and the batched just validate-disorders sweep.

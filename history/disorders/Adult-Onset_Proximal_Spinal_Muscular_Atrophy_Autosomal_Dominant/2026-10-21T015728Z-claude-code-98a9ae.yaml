  summary: Fold the duplicate VAPB-Related Proximal SMA entry's unique sources into
    this entry
  details: |
    PR 7077 had added a second Disease entry (VAPB-Related_Proximal_Spinal_Muscular_Atrophy) for MONDO:0008453, which this entry already covers. Following the review's suggested remedy, the duplicate file was removed and the three sources this entry lacked were carried over with their already-verified snippets. PMID:18523548 (Drosophila P58S aggregation recruiting wild-type VAP) is added as SUPPORT on ER-Derived Aggregation of Misfolded VAPB. PMID:23281774 (two-fold P56S overexpression mouse with abundant aggregates and no motor neuron degeneration) is added to the same node as REFUTE, because it argues against aggregate burden being sufficient, the same reading this entry already gives PMID:24252306. PMID:40764463 (inducible and patient-derived P56S iPSC motor neurons) is added to Disrupted ER-Mitochondria Contact and Calcium Handling (MAM loss, falling mitochondrial membrane potential) and to ER Stress and Unfolded Protein Response Activation (ER-stress susceptibility, ATF4 induction). That node's description said there was no evidence from VAPB-mutant human motor neurons; it now names this one unreplicated iPSC study and stays PROVISIONAL. The duplicate's ISRIB/ATF4 knock-in experiment is added as a proposed experiment under the existing vapb_aggregates_absent_at_physiological_expression discussion rather than as a second overlapping discussion. Not carried over: the duplicate's BACKGROUND-graded PMID:18523548 phenotype quotes (this entry already evidences those phenotypes), and DOI:10.1080/21678421.2026.2674020, whose cache had no quotable text and which nothing else cites; its cache file was removed. The two older history records were moved here with target.superseded_by.

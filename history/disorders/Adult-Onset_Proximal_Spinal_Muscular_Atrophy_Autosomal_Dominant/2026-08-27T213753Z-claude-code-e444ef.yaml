  summary: 'Create: adult-onset proximal SMA, autosomal dominant (VAPB p.Pro56Ser)'
  details: |
    De-novo curation of MONDO:0008453 (adult-onset proximal spinal muscular atrophy,
    autosomal dominant; Finkel type), the VAPB p.Pro56Ser lower motor neuron disease.

    Concept decision: curated as a Disease in kb/disorders/. MONDO:0008453 is a leaf
    term with one causal gene (VAPB), one OMIM entry (182980) and in practice one
    founder allele; it has no MONDO descendants and unites no distinct curated
    entities, so a Grouping would have nothing to unite. It is not a has_subtypes
    entry on Spinal_Muscular_Atrophy, which is anchored on SMN1/SMN2 and models the
    recessive 5q series. Reasoning is recorded in the entry's notes.

    NEC preflight: just preflight-dr returned PASS against MONDO:0008453 - canonical
    gene VAPB mentioned 43 times, next gene SMN1 at 6. The disease sits in a
    numbered/eponymic series (SMA types, SMALED, distal HMN) so the check was
    required; no wrong-entity content was found and the deep-research report was kept.

    Pathograph: VAPB p.Pro56Ser MSP-domain variant -> ER-derived aggregation and loss
    of functional VAPB at ER membrane contact sites -> ER stress/UPR, disrupted
    ER-mitochondria contact and calcium handling, impaired autophagic flux and RBP
    mislocalization -> lower motor neuron degeneration -> chronic denervation and
    reinnervation -> proximal neurogenic weakness and muscle atrophy. A parallel
    PROVISIONAL arm (autonomic and unmyelinated small-fibre degeneration) carries the
    dysautonomia reported in two unrelated kindreds.

    Two competing mechanistic_hypotheses are curated rather than one settled chain:
    dominant-negative sequestration of wild-type VAP (CANONICAL, but demonstrated
    only in overexpression systems) and haploinsufficiency of the wild-type allele
    (EMERGING). functional_impact_category is deliberately left unset on the trigger
    node so the schema does not silently resolve that question.

    Three discussions are recorded: a KNOWLEDGE_GAP on why one founder allele
    produces late-onset SMA, atypical ALS and typical ALS in different kindreds; a
    HUMAN_MODEL_MISMATCH on whether the ER-derived aggregates that dominate the
    mechanistic literature form at physiological expression at all; and a
    KNOWLEDGE_GAP recording that no disease-modifying therapy exists and that the
    SMN-directed 5q SMA drugs have no mechanistic route to this non-5q disease.

    Orphanet disagreement left standing. ORPHA:209335 (exact match to MONDO:0008453)
    defines the entity as proximal weakness "without bulbar or pyramidal
    involvement", while the 2026 series of 78 molecularly confirmed carriers reports
    upper motor neuron signs in 53 and bulbar involvement in 21.8%. The Orphanet
    definition is curated on both phenotypes as supports: REFUTE so a reference
    nosology and a genotype-defined cohort are visibly disagreeing rather than
    silently reconciled.

    Phenotype connectivity went from 0/12 to 11/12. Abnormal Pyramidal Signs is left
    unwired on purpose: wiring it needs an upper motor neuron node, and the only
    direct evidence is a transgenic mouse in which corticospinal neurons die while
    spinal motor neurons survive - the opposite of the human Finkel phenotype.

    Validation run in this session, all passing: just validate (schema, terms,
    references), just count-verified-snippets (82/82 verified against cached
    references), just check-duplicate-keys (OK across 4404 YAML files),

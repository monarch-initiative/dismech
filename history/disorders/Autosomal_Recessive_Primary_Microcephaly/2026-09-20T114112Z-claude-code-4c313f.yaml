  summary: 'Review round 1: strengthen the CETN3 absence note after the ALPS-FASLG
    lesson'
  details: |
    Follow-up to the same push. The CETN3 row's note justified leaving it unbound by naming three label searches of MONDO. On this same branch a sibling claim that MONDO had no ALPS-FASLG term turned out to be false, precisely because MONDO named that concept after its gene and carried the disease name only as a synonym, which a label search does not reach. So the CETN3 searches were re-run synonym-inclusively as well: 'CETN3' and 'centrin' without the l~ prefix each also return nothing. The note now names five searches and records why the synonym-inclusive pair matters.

    Also qualified a second claim in the mcph_numbering_and_disease_boundary discussion. It said MCPH31 is MONDO's highest current number; what was actually checked is that label searches for microcephaly 32 through 35 each return nothing, so the note now says that instead.

    No binding or evidence changed. Validated: just validate (157/157 snippets) and the offline gate set.

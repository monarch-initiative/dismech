  summary: 'Genetics pass (wiring-002): MCPH31 was bound to the wrong gene; repointed
    to CDK4 and split CETN3 out'
  details: |
    Genetics pass for issue #12191, and the one entry in the tranche with a wrong binding rather than a missing one.

    The finding. This entry bound MONDO:0980991 'microcephaly 31, primary, autosomal recessive' to CETN3, and its mcph_numbering_and_disease_boundary discussion asserted that CETN3-associated disease 'is now represented as MCPH31 in MONDO'. That is false. MONDO:0980991 xrefs OMIM:621507, and the Monarch association endpoint returns HGNC:1773 CDK4 for it. Its phenotype annotations — short stature, intrauterine growth retardation, delayed skeletal maturation, few cafe-au-lait spots, celiac disease, decreased testicular size, elevated TSH — match the CDK4 report (PMID:40210435, Genes Dev 2025) clinical description closely and match nothing in the CETN3 report (PMID:40926052). Three OLS searches of MONDO run for this pass — l~CETN3, l~centrin, l~microcephaly 32 — each returned no terms, so MONDO carries no term for the CETN3 entity and no MCPH number has been assigned to it.

    Why it validated. Nothing in the stack compares a subtype_term with the gene on the same row: just validate-terms confirms MONDO:0980991 exists and is correctly labelled, which it is. The error shape is the one CLAUDE.md records for gene CURIEs, in the subtype slot: CETN3 was reported in 2025 with no number, and MCPH31 was the next free number in a series this entry tracks closely.

    Curation. The MCPH31 row now carries CDK4 with two evidence items from PMID:40210435. CETN3 moved to a new CETN3-related row with no subtype_term and a note naming the three searches that establish there is nothing to bind. Added a CDK4 genetic: record (CAUSATIVE, subtype MCPH31) recording that CDK4 is a G1 kinase rather than a centrosomal protein, that the authors excluded mitotic defects experimentally, and that heterozygous R24C/R24H gain-of-function alleles are a different disease (familial melanoma). Added CDK4 to the Heterogeneous Biallelic MCPH Gene Dysfunction node and a new G1/S Cell-Cycle Entry Failure node downstream of it and upstream of Neural-Progenitor Proliferation and Survival Failure — deliberately a parallel route bypassing the centrosome and mitotic branches, because the paper states that CDK4 and CDK6 microcephaly do not share a common mechanism. CETN3's genetic: record note was corrected. The entry now has 29 subtype rows against 28 MONDO descendants; the extra one is the unbound CETN3 row, and notes: records that.

    Not done: no upstream MONDO issue was filed. The disagreement here is between the KB and MONDO with MONDO correct, so there is nothing to report upstream. The HUMAN_MODEL_MISMATCH discussion and the mouse/outer-radial-glia modelling were not touched.

    Validated: just validate (157/157 snippets), validate-terms, check-duplicate-keys (one malformed insertion was caught and repaired here), check-entity-refs, check-causal-targets, check-enum-values, list-gene-term-mismatches (0 findings).

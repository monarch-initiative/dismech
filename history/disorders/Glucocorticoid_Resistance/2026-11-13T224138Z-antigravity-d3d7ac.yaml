  summary: Review and enrich Glucocorticoid Resistance
  details: 'Audited all claims, snippets, directness ratings, and notes in Glucocorticoid Resistance
    (MONDO:0014421). Wired French MUTA-GR cohort data (PMID:29444898, including pseudohypermineralocorticism
    low-aldosterone/un-elevated-renin findings) across pathophysiology, phenotypes, biochemical, diagnosis,
    differential_diagnoses, and notes while retaining explicit ClinGen validity status in genetic.notes
    and source attributions in notes. Added categories and Harrison''s chapter classifications (ENDOCRINOLOGY_METABOLISM,
    GENETICS_ENVIRONMENT_DISEASE). Separated Hepatic Glucocorticoid Insensitivity (liver UBERON:0002107,
    hepatocyte CL:0000182, gluconeogenesis GO:0006094) downstream of Generalized Target-Tissue Glucocorticoid
    Insensitivity to feed Hypoglycemia, kept dermal fibroblast (CL:0000057) exclusively on the cellular
    insensitivity node, and linked Fatigue via an INDIRECT edge so all phenotypes are connected. Clarified
    post-dexamethasone cortisol frequency context (PMID:41038576), added Plasma renin (NCIT:C113591),
    added Apparent mineralocorticoid excess (MONDO:0009025) in differential_diagnoses, and added Mineralocorticoid
    receptor antagonist therapy (NCIT:C15986, NCIT:C101255) targeting Mineralocorticoid Excess.


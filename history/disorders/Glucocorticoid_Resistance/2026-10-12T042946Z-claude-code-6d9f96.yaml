  summary: 'Create: Glucocorticoid_Resistance'
  details: |
    De-novo curation of primary generalized glucocorticoid resistance (Chrousos syndrome), MONDO:0014421, NR3C1-based Mendelian disorder. The thin claude_code deep-research report was used for leads only; all primary sources were located via PubMed esearch and fetched with fetch-reference, and every claim is snippet-verified against the cache. Built a causal pathograph (NR3C1 inactivating variant -> impaired GR signal transduction -> generalized tissue insensitivity -> blunted HPA feedback -> compensatory HPA activation -> adrenal steroidogenesis -> mineralocorticoid/androgen excess branches) wiring the phenotypes into the pathograph (Fatigue left disconnected as its mechanism is uncertain). Both AD (dominant-negative I747M) and AR inheritance recorded with bound HP terms. No ClinGen validity assertion exists for NR3C1-GGR so gene_disease_validity was correctly omitted; no GeneReviews chapter exists (confirmed offline via bookshelf index, only StatPearls general glucocorticoid physiology). Treatment: high-dose dexamethasone with CHEBI agent and target_mechanisms edge. 13 distinct references. Validation: validate-disorders passed (40 snippets, 53 titles, 0 issues); count-verified 40/40; compliance 85.8%.

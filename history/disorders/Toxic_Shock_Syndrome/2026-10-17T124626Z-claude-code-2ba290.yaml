  summary: Bind LOINC S. aureus, S. pyogenes culture and TSST-1 gene codes
  details: |
    LOINC tranche B batch 27. The culture row takes three codes: LOINC:100897-8 and LOINC:17656-0, one organism-specific culture code per agent the entry names, plus LOINC:44881-1 (S. aureus toxic shock syndrome toxin gene by NAA with probe detection).

    The toxin gene code is what the row's own result statement turns on: it says isolation of a superantigen-producing strain, and the gene assay is what separates such a strain from carriage. The row's evidence quotes a nasal swab positive for S. aureus together with the TSST-1 gene, so the assay is already described in the entry rather than being imported.

    All three codes are specimen-level. The row names blood, wound and mucosal sites together, and the normally sterile site that a confirmed streptococcal case requires is a clinical category rather than a LOINC specimen, so no single site code would represent the row.

    The CDC clinical case definition in definitions is left alone: it is a clinical criteria set with no pathogen measurement of its own, and the definitions class has no measurements slot.

    Absence and enumeration basis: the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows, so the result set is complete rather than a ranked page. Part-level questions were taken to the Monarch KG instead, because that export carries no LP or LG rows at all. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 261 LOINC rows added by all 44 open loinc PRs, enumerated with pagination: no collision.

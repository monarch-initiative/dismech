  summary: 'Address review: repoint phenotype evidence at enumerating sentences'
  details: |
    Addressed ai4c-reviewer REQUEST_CHANGES on PR 8321. Blocking issue: Conjunctival Hyperemia, Severe Myalgia and Elevated Creatine Kinase cited a scope statement from the PMID:38247655 abstract that asserts only that the review covers clinical presentation, supporting no individual phenotype. Verified every replacement quote the reviewer named against the cache before use. Repointed Conjunctival Hyperemia and Confusion to the Todd index case series sentence in PMID:38247655; Vomiting and Diarrhea to the menstrual-TSS series sentence in the same reference, with Diarrhea also citing PMID:32461307; Acute Kidney Injury, Elevated Transaminases, ARDS and Thrombocytopenia to the STSS case-ascertainment criteria sentence in PMID:36456018; Strawberry Tongue to PMID:33304729, which names it as a diagnostic feature of TSS directly, replacing the earlier inference from scarlet fever; and Palmoplantar Desquamation gains the PMID:32461307 convalescent-desquamation sentence. Merged Severe Myalgia and Elevated Creatine Kinase into a single evidence-backed Myositis phenotype because no source in the reference set states either myalgia or a creatine kinase threshold in TSS, while the STSS criteria name myositis explicitly; the full CDC muscular criterion remains in the definitions block. Consumed the three previously uncited cached references: added a streptococcal invasive-GAS incidence prevalence record from PMID:40193120 marked PARTIAL because it measures invasive GAS rather than STSS; added the SEB emetic cystine loop attribution from PMID:40711134 to the Vomiting phenotype; and used PMID:32461307 in three places. Added a new pathophysiology node, Ribosomal Target Resistance in Group A Streptococcus, conforming to bacterial_protein_synthesis_inhibition#Ribosomal Target Resistance and evidenced by clindamycin non-susceptibility rising from 12.7 to 33.1 percent, which qualifies the adjunctive-clindamycin rationale. Corrected the entry notes, which had incorrectly claimed the cited abstracts do not enumerate individual findings. Also fixed two CI failures: a folded-scalar line ending in methicillin- and two evidence snippets under five words. Validation: just validate-disorders passed with 82 of 82 snippets verified; folded-hyphen, snippet-length and term-cache-integrity checks pass; compliance 97.2 percent global; pytest 6044 passed.

  summary: 'Review round 1: correct the TSST-1 gene assay''s scope on the culture
    row'
  details: |
    Review round 1 on PR #14689. The reviewer challenged the toxin-gene binding LOINC:44881-1 on the culture row on three grounds: the note claimed the assay distinguishes a superantigen-producing isolate from carriage, which it does not, since the gene is also carried by colonizing S. aureus; the assay covers TSST-1 only and so misses the staphylococcal enterotoxins behind many non-menstrual cases and every streptococcal superantigen; and the row's description described culture alone, so a nucleic acid test was a test the row did not name. The reviewer offered either dropping the code or extending the row description with evidence and rewriting the note.

    The second option was taken, because the row already carried an evidence item quoting the demonstration of the TSST-1 gene alongside recovery of the organism, with an explanation naming it as part of microbiological confirmation. Dropping the code would have left that evidence item describing a test the row's measurements no longer covered. The description now names nucleic acid testing of a recovered staphylococcal isolate for the TSST-1 gene, which is what that existing evidence supports and no more.

    The note was rewritten to state the assay's actual scope: it reports presence of the gene in a specimen, so it establishes that the isolate can produce TSST-1 and does not by itself separate invasive disease from colonization, with the row's result statement still resting on the clinical syndrome.

    The scope claims in the note were checked against the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 448bc5a561a9f75ae0ef67f86777ea6f7bc5597562ec21066971e23dd7794551 verified, snapshot_date 2026-10-07), read in full at 112,405 rows. Each staphylococcal enterotoxin gene has its own code (sea 44878-7, seb 44880-3, sec 72823-8, sed 72822-0, see 44879-5) and no code spans the superantigen repertoire; a search of the long common names returns zero rows for superantigen and zero for pyrogenic exotoxin. The only S. pyogenes exotoxin-gene codes are 72268-6 and 105061-6, both for speB, which is not one of the streptococcal superantigens this entry describes, so the streptococcal arm stays on culture alone. That is a narrower correction than the reviewer's wording, which said no streptococcal superantigen code exists at all: a speB code does exist, but not for a superantigen.

    No new codes, so no cache rows were added for this entry.


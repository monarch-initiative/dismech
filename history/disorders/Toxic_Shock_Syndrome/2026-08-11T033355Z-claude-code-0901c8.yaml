  summary: Apply non-blocking review suggestions from approved re-review
  details: |
    Applied all four non-blocking suggestions from the approving re-review on PR 8321. First, the entry notes claimed the CDC muscular criterion remained recorded in full in the definitions block; that block names the muscular category without stating its content, so the notes were the same class of overstatement just corrected elsewhere. Reworded to say the category is enumerated but severe myalgia and the creatine kinase threshold are recorded nowhere in the entry, marked as a deliberate gap and a target for a source that states them. Second, changed the new Ribosomal Target Resistance in Group A Streptococcus node from role therapeutic_vulnerability to adaptive_escape, matching its module anchor; resistance defeats a therapeutic vulnerability rather than constituting one. Third, removed rate_per_100000, rate_low and rate_high from the streptococcal prevalence record and set prevalence_class to UNKNOWN, so the record stands as denominator context only: the 8.2 per 100,000 figure is invasive group A streptococcal incidence rather than an STSS rate, and 3.6 and 8.2 are trend endpoints for different years rather than an uncertainty interval. The figures remain in the evidence snippet where their meaning is explicit. Fourth, cited the orphaned PMID:20036064 on the Absent or Low Neutralizing Antitoxin Antibody node, where its age-stratified serology directly supports antibody absence as the permissive host state. Validation: just validate-disorders passed with 83 of 83 snippets verified; folded-hyphen, snippet-length and term-cache-integrity checks pass; compliance 97.2 percent global; pytest 3996 passed.

  summary: Backfill transmission (#10115, R25)
  details: |
    Added four transmission records; the existing infectious_agent block (S. aureus, S. pyogenes) was left untouched. Routes: mucosal and cutaneous colonization by a toxigenic strain (PMID:38247655 - nasal carriage in 20-80% of the population, and the vagina/pharynx/skin as the usual sources, which is why this is colonization rather than an acquisition event); tampon-associated vaginal colonization during menstruation (PMID:38247655, PMID:31151811, PMID:32461307 - the 1980s incidence peak and its fall after tampon manufacture changed); surgical, postpartum and cutaneous portals in non-menstrual disease (PMID:38247655); and skin breach with invasive infection in streptococcal disease (PMID:38247655, PMID:40193120). The streptococcal record notes the real asymmetry: there an exogenous acquisition step does precede the portal, whereas the staphylococcal form is toxin crossing from a colonized site. PMID:40711134 was considered and left out to keep evidence_source uniform across the file. All references already cited, no new caches. just validate clean (97 titles). No other section touched.

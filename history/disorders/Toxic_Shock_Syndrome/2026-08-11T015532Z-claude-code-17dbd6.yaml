  summary: 'Create: Toxic Shock Syndrome'
  details: |
    Created kb/disorders/Toxic_Shock_Syndrome.yaml for MONDO:0001881, with staphylococcal MONDO:0020545 and streptococcal MONDO:0020544 subtypes. Deep research provider: claude_code, report at research/Toxic_Shock_Syndrome-deep-research-claude_code.md covering 20 web searches over 25 turns with 45 citations. Curated 10 pathophysiology nodes tracing the superantigen cascade: absent neutralizing antitoxin antibody, superantigen exotoxin production, MHC class II and TCR Vbeta cross-linking, massive polyclonal T cell activation, systemic cytokine storm, endothelial injury and capillary leak, distributive shock and multi-organ dysfunction. Three therapeutic-vulnerability nodes declare conformance to bacterial_protein_synthesis_inhibition, at both the ribosome-target and toxin-suppression nodes, and to bacterial_cell_wall_synthesis_inhibition at the penicillin-binding-protein node. Also added 17 phenotypes, HLA-DRB1 and HLA-DQB1 susceptibility genetics, the CDC CASE_DEFINITION, 6 treatments, a rabbit superantigen-challenge animal model with a modeled_mechanisms link and readout, 4 GEO datasets, the NCT02340338 vaccine trial, and a CONTROVERSY discussion holding the unresolved IVIG mortality question with SUPPORT and REFUTE evidence retained side by side. Two errors in the deep-research report were caught during verification: HP:0031013 was proposed for strawberry tongue but is actually Ankylosis, corrected to HP:0031042; and the report claimed no MONDO identifier could be confirmed, whereas MONDO:0001881 was found directly by OAK. Every PMID used was independently checked against PubMed. No frequency bands are asserted anywhere: the CDC-criterion phenotypes have a near-universal rate among confirmed cases only as an ascertainment artifact, so per docs/frequency-evidence-guidelines.md the band is omitted and diagnostic true carries criterion status instead. Validation: just validate-disorders passed covering schema, terms and references with 76 of 76 snippets verified; just verify-datasets returned 4 of 4 OK; compliance 97.1 percent global and 97.0 percent weighted; pytest 6097 passed.

  summary: 'Somatic mosaicism normalization: CHILD_Syndrome'
  details: |
    Removed the HP:0001442 (Typified by somatic mosaicism) binding from the 'Functional mosaicism from random X inactivation' block, leaving a free-text preferred_term, and added a sentence to its description recording why. The block's own text states that X-inactivation mosaicism is not somatic mosaicism at the DNA level, so the binding contradicted the description, and HPO has no term for functional mosaicism. The X-linked dominant block above it is unchanged and remains the entry's bound mode of inheritance. Evidence on the block is unchanged. The entry is deliberately NOT a member of the Somatic Mosaic Disorders grouping.Part of the somatic-mosaicism normalization tranche. Convention applied across the tranche: a disorder whose causal variant is post-zygotic (or which has a recognized post-zygotic arm) carries an inheritance block bound to HP:0001442 (Typified by somatic mosaicism) with its own snippet-backed evidence, plus variant_origin SOMATIC on the causal gene. Every evidence snippet reused here was already present and verified elsewhere in the same entry, or is an exact substring of an already-cached reference; no reference cache file was created or edited. Validation: just validate, just count-verified-snippets, just validate-terms, check-snippet-grading, check-enum-values, check-duplicate-keys, check-entity-refs and check-causal-targets all pass on the edited file. The entry was added as a member of the new kb/groupings/Somatic_Mosaic_Disorders.yaml grouping.

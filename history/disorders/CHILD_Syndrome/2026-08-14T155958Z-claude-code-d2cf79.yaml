  summary: 'Address PR #8493 review: consumption gaps'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #8493. Every finding was a consumption gap against references already cached in the PR, not an error in what had been curated, and all were accepted. BLOCKING: added a Lung malformation phenotype (HP:0002088), so the GeneReviews sentence 'Heart, lung, and kidney malformations can also occur.' -- previously quoted twice for heart and kidney while the lung was silently dropped -- is now fully consumed. IMPORTANT: added a histopathology section with three findings from the two cached-but-uncited references, PMID:7640190 (verruciform xanthoma, ptychotropism, diffuse lateralization) and PMID:16776722 (EM abnormal lamellar granules, foamy papillary-dermal cells); the previously uncited 'dermal foam cells' prose in the epidermal barrier node now carries PMID:16776722 and the Paller histology sentence. IMPORTANT: attached an evidence item to the paraphrased GeneReviews transmission-risk ratios in the inheritance description, plus PMID:36504312 for human recurrent male fetal loss. Accepted all non-blocking suggestions: a diagnosis section (NSDHL genetic testing; sterol profiling of skin flakes and plasma via PMID:33139364, including the case where the sterol pattern reclassified a variant of uncertain significance); a CASES_IN_LITERATURE / ULTRA_RARE prevalence record from PMID:7408908 with an explicit refusal of the untraceable 1-in-100000 figure; Joint contracture (HP:0001371); and two treatments, orthopedic/rehabilitative management and long-term surveillance. Also corrected a claim of my own that the reviewer's suggested reference falsified: the HUMAN_MODEL_MISMATCH rationale had asserted human male conceptuses are essentially unavailable for study, but PMID:36504312 genotyped one, so the rationale now says the human outcome is established while the murine placental mechanism for it remains untested in humans. Wired the two new organ phenotypes into the mosaicism node on the same ipsilateral-territory evidence as the cardiac and renal ones. Two histopathology findings are deliberately left without ontology terms: HP:0000991 Xanthomatosis is not a member of the HistopathologyFindingTerm enum and NCIT:C221710 Cutaneous Xanthomatous Alteration is not reachable from NCIT:C83490 (both checked), and no NCIT term exists for abnormal epidermal lamellar granules; binding to generic hyperkeratosis or acanthosis would have labelled the least distinctive part of each finding. Revalidated: just validate-disorders exit 0, just count-verified-snippets 88/88 verified against cached references, folded-hyphen / snippet-length / title-snippet gates all clean, causal graph valid, phenotype connectivity 11/12 (Normal intellect correctly unwired as a REFUTE-graded negative), all 21 reference_titles re-checked character-for-character against their cache files. Compliance rose from 90.2 to 91.0 percent global, 90.6 to 91.3 percent weighted.

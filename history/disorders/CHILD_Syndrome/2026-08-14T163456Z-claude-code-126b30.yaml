  details: |
    Second review round on PR #8493. Both IMPORTANT findings accepted, and all three suggestions taken. FINDING 1: added an ILVEN (inflammatory linear verrucous epidermal nevus, MONDO:0019318) differential. The two existing differentials were both genetic/mechanistic neighbours with no dermatologic mimic, and ILVEN is the leading one precisely because it shares the inflammatory verrucous morphology and psoriasiform histology this entry curates. Cited PMID:39953436, a case worked up as possible CHILD syndrome and resolved as severe ILVEN; the distinguishing_features record that the same case had ipsilateral limb contracture and short stature, so limb involvement does not settle it and the sterol/NSDHL result is the definitive separator. FINDING 2: the diagnosis entry presented sequencing as definitive; added the multi-exon deletion blind spot (PMID:29341259, deletion of NSDHL exons 3 and 4 with the explicit statement that Sanger may miss such variants, plus PMID:41625319 for optical genome mapping resolving Xq28 structural variants after inconclusive conventional testing), and rewrote the description to say a negative sequencing result means not-detected-by-this-assay rather than not-CHILD. SUGGESTION 1: rebound the Ichthyosiform nevus phenotype from HP:0008064 Ichthyosis to HP:0010816 Epidermal nevus; the lesion is a localized mosaic nevus rather than a generalized cornification disorder, and the classic delineation places it among the epidermal nevus syndromes. HP:0034275 Verrucous epidermal nevus was considered and declined since the verrucous quality is reported in some lesions rather than being general. SUGGESTION 2: split the midline phenotype in two. HP:0100555 Asymmetric growth was a cross-category proxy on a lesion-distribution claim, so the Strict midline demarcation phenotype now carries no term with the reasoning in notes, and a new Ipsilateral body hypoplasia phenotype carries HP:0100555, which it genuinely fits; the new phenotype is wired from the mosaicism node. SUGGESTION 3: recorded the four declined research lines in the entry notes (GI/colonic xanthomas PMID:39466221 and PMID:40517742 cache with no retrievable content so no quotable snippet exists; Greenberg dysplasia overlaps only at pathway level; four further statin case reports are redundant with the three already cited). Seeded MONDO:0019318 into cache/enums/diseaseterm and cache/mondo/terms.csv via a local sqlite:obo:mondo adapter run, then restored conf; total cache diff for this round is 2 insertions, 0 deletions. Revalidated: just validate-disorders exit 0, just count-verified-snippets 95/95 verified, folded-hyphen and title-snippet gates clean, causal graph valid, phenotype connectivity 12/13, all 24 reference_titles re-checked against their cache files. Compliance 90.6 percent global, 90.9 percent weighted; the small dip from 91.0 is the newly added differential and phenotype introducing recommended slots that are not yet filled, not a loss of existing coverage. NOT fixed, deliberately: just check-snippet-length fails on kb/disorders/Hereditary_Angioedema.yaml with two 2-word snippets; verified pre-existing on main (last touched by PR #8111) and absent from this branch diff, so it is not swept into this curation PR.

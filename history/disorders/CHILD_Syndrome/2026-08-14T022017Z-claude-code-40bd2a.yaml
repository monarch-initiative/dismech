  summary: 'Create: CHILD Syndrome'
  details: |
    New Mendelian entry for CHILD syndrome (NSDHL, MONDO:0010621). Deep research: claude_code provider (research/CHILD_Syndrome-deep-research-claude_code.md; 36/36 references resolved, confabulation_rate 0.0, but 6 of 33 quoted claims did not match their cited source, so no quoted material was taken from the report -- every snippet in this entry was quoted directly from the local references_cache abstract). GeneReviews baseline PMID:21290788 (NSDHL-Related Disorders) fetched, tagged, and cross-referenced against Clinical Characteristics. Curated six pathophysiology nodes covering the dual cholesterol-deficiency/methylsterol-toxicity lesion, X-inactivation mosaicism with negative selection, epidermal lamellar body failure, sterol-dependent Hedgehog signalling, and placental male lethality; ten phenotypes, nine of them causally wired into the pathograph (the tenth, "Normal intellect", is a deliberate negative characterization carrying REFUTE evidence and is correctly unwired); two biochemical markers; two genetic loci (NSDHL causative, EBP as a hedged locus-heterogeneity minority); four treatments including the pathogenesis-based topical cholesterol-plus-statin regimen; three animal models and one cell-line model with modeled_mechanisms links; three discussions (two KNOWLEDGE_GAP, one HUMAN_MODEL_MISMATCH). Deliberately omitted: prevalence (no cohort denominator exists), most frequency bands (definitional or unsupported by the source phrasing), datasets (all twelve GEO candidates were EBP-string collisions with the unrelated C/EBP transcription factor family), and conformance to ciliopathy_dysfunction (CHILD reaches Hedgehog by a sterol route, not a ciliary one). Seeded GO:0000252 and GO:0060816 into cache/go/terms.csv and the matching enum caches via a local sqlite:obo:go adapter run after the OLS lookups timed out. Validated with just validate (schema + terms + references via the pre-write hook), just count-verified-snippets (70/70 verified against cached references), and just validate-disorders (the batched CI-equivalent sweep, exit 0, all validations passed). Also ran just check-folded-hyphens, just check-snippet-length, and just check-title-snippets (all clean, no new violations), dismech.graph --validate (causal graph valid), and dismech.qc_plugins (9/10 phenotypes connected; EBP deliberately unwired, with the reason recorded in its notes rather than papered over). Every reference_title was checked character-for-character against its references_cache title line. Compliance 90.2 percent global, 90.6 percent weighted.

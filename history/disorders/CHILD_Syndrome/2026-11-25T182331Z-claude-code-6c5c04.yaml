  details: |
    The NSDHL node bound the dehydrogenase/decarboxylase activity (GO:0000252) with modifier LOSS_OF_FUNCTION, which the schema reserves for loss without a host mutation; set it to DECREASED, matching the node's description of reduced activity and protein abundance (PMID:40222685). Added the X-linked dominant inheritance block (HP:0001423) to the NSDHL genetic record. CK syndrome (MONDO:0010441), the allelic hypomorphic NSDHL disease in males (PMID:21129721; ClinGen Moderate), has no entry and was added to the stub queue.

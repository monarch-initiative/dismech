  summary: Review CHILD syndrome mechanisms, clinical coverage and treatment
    evidence
  details: |
    Substantive review of the complete CHILD entry against its deep-research report, citation companion, cached primary references and the full September 2024 GeneReviews chapter. Eligibility was checked against main and open PRs: no prior REVIEW event, no overlapping open PR, and an NSDHL Mendelian disease within the noninfectious/nonenvironmental scope.

    Corrected the disease boundary: NSDHL is causative; the historical EBP-positive case is a differential/interpretation issue, not an additional causative gene. Removed fetal c.790-6C>T as affirmative evidence of pathogenic inheritance because the primary full text classifies it as a VUS and calls for functional verification. Distinguished X-inactivation expression mosaicism from postzygotic DNA mosaicism. Removed normal intellect as an intellectual-disability phenotype and unsupported quantitative-frequency implications.

    Separated 13 mechanistic nodes: NSDHL loss, C4-demethylation, local cholesterol availability, precursor accumulation, expression mosaicism, model-specific cell depletion, lamellar-body secretion, stratum-corneum lamellae, Hedgehog response, placental dysmorphogenesis, receptor trafficking, EGFR signaling and anagen growth. Removed co-occurrence-only causal edges and updated the node-class example for the renamed X-inactivation node. Human skin biopsies, cultured patient cells, mouse tissue and isolated mouse neural cultures retain distinct evidence classifications. Mouse liver/brain age comparisons do not establish longitudinal human skin clearance. Conditional exon-5-null mice are not models of a specific CK hypomorphic allele. Ketoconazole viability rescue is distinct from failure to restore SHH-induced Gli1; SC4MOL-only findings are not assigned to NSDHL. The two canine male neonatal deaths were ungenotyped.

    Expanded clinical coverage from the full GeneReviews chapter: septal defects, pulmonary hypoplasia, hydronephrosis and renal agenesis, CNS malformations, hearing loss, digit anomalies, optic atrophy and vocal-cord paralysis. Added gastrointestinal mucosal xanthomas from the primary adult report and identified CD163-positive macrophages in the histology. Replaced nonspecific organ-root bindings where the source provides specific findings. Retained precise unbound descriptions where a broader binding would distort the claim. Added the human skin course, uncertain population life expectancy, initial multisystem evaluation, surveillance and counseling. Verruciform xanthoma-like histology is not diagnostic by itself; disappearance of stippling by age two is a single reported observation.

    Separated statin monotherapy, cholesterol/statin combinations and topical ketoconazole. The original two-patient sequence included cholesterol-alone failure but no statin-only arm, so it cannot establish that cholesterol supplementation is required. Used full-text response times, recurrent/site-dependent responses, limited laboratory monitoring, and the adult ketoconazole DLQI result. The 2024 p.Gly44Ser treatment report follows the previously published patient and is not an independent genotype case. Skin response does not establish skeletal correction. Grafting, recurrence after dermabrasion, symptomatic care and orthopedic management remain represented.

    Source consumption: full-text scientific sections were read for PMID:21753784, 19631568, 23125191, 25652406, 28739597, 36504312, 29687057, 39431262, 39565229 and 34957706, alongside the full GeneReviews clinical, diagnostic, management, counseling and molecular sections. Newly needed full texts were generated only with fetch-reference. PMID:40222685 remains abstract-only, so protein-abundance rescue is not treated as enzyme-activity rescue. PMID:15689440 PDF retrieval was blocked; no unseen quote is used. PMID:41625319 is limited to its mixed-cohort abstract. PMID:31374135 had no retrievable abstract/full text; GeneReviews supplies the supported dose-escalation statement. Unused failed-fetch caches are excluded from the PR. Existing PMID:21129721 and 23125191 cache refreshes only replace citation wrappers and are not needed for the committed evidence.

    Deep-research completeness checklist: (1) Phenotypes adequate for the major clinical domains, with rare secondary observations not all promoted to individual claims; unsupported numerical frequencies rejected. (2) Subtypes adequate: CK and EBP-related CDPX2 are distinct differentials, not CHILD subtypes. (3) Mechanisms adequate with atomic nodes and explicit model/human limits. (4) Treatments adequate for reported topical and supportive options; no trial identifier was supplied by the research, and no blanket absence-of-trials claim is made. (5) Genetics adequate for NSDHL variant classes, variable familial expression and mosaic male survival; no unvalidated modifier or fetal VUS promoted. (6) Diagnostics adequate for molecular/CNV testing, VUS interpretation, skin sterols and normal-serum limitations. (7) References substantially consumed, with primary evidence overriding contradictory report claims about combination necessity, human clone clearance, prognosis, and absence of quality-of-life measurements. (8) Overall coverage adequate; chaperone proposals, nonspecific HPO annotation inventories and model-to-human leaps remain outside established clinical claims. The canine sequencing accession is a secondary model resource; no claim that all datasets are absent is retained.

    Validation: schema and ontology checks pass; all 188 snippets and 218 titles verify with zero skipped or unavailable. GeneReviews is tagged and used across the four clinical domains. The disorder page renders with the new sections. Whole-repository QA exposed a short complete sentence and a stale CHILD node-class example; both were corrected. All 23 repository QA gates pass after targeted reruns of those two checks. Snippet grading and pre-commit checks pass. Independent PR review is still required.

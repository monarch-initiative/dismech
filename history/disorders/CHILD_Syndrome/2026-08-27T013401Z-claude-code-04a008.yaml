  summary: Add classifications block (ISDS CDP group 23, ICIMD, Harrison's)
  details: |
    The entry had no classifications block at all, so it was invisible on the ISDS group 23 (chondrodysplasia punctata) classification page despite the nosology listing it as row NOS 23-0030. Added isds_skeletal_category chondrodysplasia_punctata with 2023-revision provenance, icimd_category sterol_metabolism, and three Harrison's Parts (genetics, dermatology, endocrinology/metabolism). The ISDS note records that the group is radiographically rather than mechanistically defined, so CHILD syndrome's nearest mechanistic relatives (Smith-Lemli-Opitz and the other sterol-biosynthesis disorders) are correctly not group-23 entities. Part of a sweep to complete ISDS group 23 coverage. Also added as a member of the Chondrodysplasia_Punctata grouping. No content outside the classifications block was changed. Validated with the batched validate-disorders pass.

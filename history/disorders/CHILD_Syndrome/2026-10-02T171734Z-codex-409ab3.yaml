  summary: Connect core CHILD phenotypes and address review findings
  details: |
    Addressed independent review of PR13400 at commit779a256847a445ba7f54acc007e4b5bd0fbbdb7e in one revision. Added indirect edges from NSDHL loss to the defining ipsilateral body and limb hypoplasia, using the primary genetic-causation report and GeneReviews clinical definition. These edges intentionally bypass neither a known mechanism nor a claimed Hedgehog route: the developmental intermediates remain unknown. Added an indirect X-inactivation-expression edge to skin midline demarcation from the authors' qualified interpretation in PMID:11907515; retained the unresolved boundary-geometry discussion and bilateral exception. The weak visceral/contracture co-occurrence edges remain absent; the review explicitly accepted that scope.

    Also addressed the optional clinical and reference suggestions. Specific visceral and CNS descriptions now record the possible ipsilateral pattern with its non-obligatory scope, supported by the classic-pattern sentence in PMID:11907515 and classified as background rather than the case's primary result. Added the additional simvastatin/cholesterol gel case PMID:32886633 as human clinical evidence. Read both abstracts and the primary NSDHL discovery abstract directly from their existing caches; full-text attempts were already recorded. Confirmed that the GeneReviews PDF and PMID identify the same chapter; retained the title generated by the fetcher. No cache was hand-edited and no fetcher/schema changes were introduced.

    Validation: schema, terms, exact snippets/titles, causal targets, connectivity, evidence grading, short/title-snippet and reference-title gates, history and hooks checked for the revision. The three core phenotype links increase connectivity from 2/23 to 5/23 without introducing unsupported routes to the remaining manifestations. Independent re-review is required on the new commit.

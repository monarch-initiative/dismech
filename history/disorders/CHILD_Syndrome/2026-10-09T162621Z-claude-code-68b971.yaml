  summary: Add germline variant_origin to NSDHL record
  details: |
    Gene/function alignment check against the ai-gene-review NSDHL review. hgnc:13398 binding is correct; the molecular node already binds GO:0000252 (3-beta-hydroxysteroid dehydrogenase [NAD(P)+]/C4-decarboxylase activity) and GO:0006695, matching the AIGR core function. Added variant_origin: GERMLINE to the genetic record, which lacked it. No ClinGen gene-disease validity record exists for NSDHL-CHILD syndrome (the ClinGen NSDHL assertion is for CK syndrome, MONDO:0010441, a different disease), so gene_disease_validity is left absent. Validated with just validate, count-verified-snippets (200/200) and validate-terms.

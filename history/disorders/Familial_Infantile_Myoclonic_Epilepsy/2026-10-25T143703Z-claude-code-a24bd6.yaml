  summary: 'Create: Familial_Infantile_Myoclonic_Epilepsy'
  details: |
    New entry for familial infantile myoclonic epilepsy (MONDO:0011506), the autosomal recessive TBC1D24 epilepsy at the mild end of the TBC1D24-related disorder continuum, curated as a Disease separate from DEE16 and DOORS syndrome because MONDO and OMIM (605021) keep it distinct and its presentation (infantile myoclonic seizures, treatment response, variable cognition) differs. Deep research was requested from falcon, which was not configured in this environment; the run fell back to openscientist (research/Familial_Infantile_Myoclonic_Epilepsy-deep-research-openscientist.md, 16/16 references resolved, 19/19 quotes valid; just preflight-dr PASS). Primary sources were taken from PubMed directly: the 16p13 linkage paper (PMID:10741954), the founding kindred clinical description (PMID:11879364), TBC1D24 gene discovery (PMID:20727515), later FIME families (PMID:25769375, PMID:35413638), the TBC1D24 GeneReviews chapter (PMID:25719194, tagged) and the 48-patient genotype-phenotype study (PMID:27281533). Intellectual disability is recorded with both GeneReviews/later-family support and a REFUTE item for the founding family's normal cognition, since sources disagree. Synaptic vesicle endocytosis evidence comes from Tbc1d24 knockout and knockdown models, not the FIME alleles, and the edges from it are marked INDIRECT. The deep-research report's antioxidant-rescue and corpus-callosotomy leads were not used because they concern TLDc/EPRPDC and DEE cases, not FIME. A pre-PR fresh-context review led to these changes: the ARF6 edges were downgraded to INDIRECT_UNKNOWN_INTERMEDIATES and the ARF6 node's DECREASED modifier was dropped, because no study measured ARF6 signalling with FIME alleles. The initiating node was renamed to cover the in-frame deletion allele and lost its compound-heterozygous zygosity, since later FIME families are homozygous. A cytoarchitecture node supported only by the authors' interpretation was collapsed into a direct neurite-to-hyperexcitability edge. Ataxia was removed from the description because no cited FIME source reports it. The knockout-neuron endocytosis result was regraded IN_VITRO. Validated with just validate (schema, 39/39 snippets, terms), validate-terms, check-entity-refs, check-causal-targets, check-snippet-grading and check-genereviews. In PR review (#15606) the automated reviewer asked for support for the 25% recurrence-risk claim. The GeneReviews sib-risk and prenatal/preimplantation sentences were added to Genetic counseling, and the sentence naming FIME as autosomal recessive was added to the inheritance block. An EEG surveillance treatment was also added. The ARF6 node was renamed from Impaired to Altered because the sources report altered ARF6 activation without a direction. CI's newly-ungrounded-genes gate then flagged TBC1D24 on the initiating node, so GO:0031267 small GTPase binding was bound there, grounded by the TBC1D24-ARF6 co-immunoprecipitation sentence (PMID:20727515). The final entry has 48/48 snippets verified.

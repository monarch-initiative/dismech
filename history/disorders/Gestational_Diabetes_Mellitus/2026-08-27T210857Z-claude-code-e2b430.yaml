  summary: Add endocrine-disrupting chemical exposures to Gestational Diabetes Mellitus
  details: |
    Added the entry's first environmental block with two exposures, one positive and one negative. Gestational phthalate exposure (ECTO:9000522) is supported by two independent meta-analyses at pooled odds ratios of roughly 1.07-1.10 (PMID:35578291, PMID:37164202); the description states the small effect size explicitly so the exposure is not read as comparable to obesity or prior GDM. Its single edge goes to Beta-Cell Compensatory Failure, the lesion node, chosen by elimination rather than measurement and marked INDIRECT_UNKNOWN_INTERMEDIATES. Gestational bisphenol A exposure (ECTO:9000057) is curated as a negative result with REFUTE-graded evidence from a dedicated null meta-analysis (PMID:34590231) corroborated by the phenol-class null in PMID:37164202, and deliberately carries no pathograph edge. The contrast with the same chemical's positive association in Preeclampsia is noted in the entry description. Validated with validate, validate-terms and the batched validate-disorders.

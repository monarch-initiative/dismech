  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Extended the existing 75-g OGTT diagnosis row with the fasting, 1-h and 2-h molar glucose codes LOINC:14771-0, LOINC:51597-3 and LOINC:14995-5, with IADPSG 2010 thresholds 5.1, 10.0 and 8.5 mmol/L and the overt-diabetes fasting limit 7.0 mmol/L from PMID:20190296, and NICE 2015 thresholds 5.6 and 7.8 mmol/L quoted from a review PMID:27687080 because a PubMed title search found no publication of the 2015 NICE guideline itself. Added a 100-g three-hour OGTT row with Carpenter-Coustan thresholds 95, 180, 155 and 140 mg/dL on LOINC:1558-6, 1501-6, 1514-9 and 1530-5, from Table 4 of the ADA 2010 position statement PMID:20042775, with the two-abnormal-value rule. Updated the existing OGTT evidence explanation that said thresholds were left uncurated.

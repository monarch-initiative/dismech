  summary: 'Create: Gestational Diabetes Mellitus'
  details: |
    New entry filling part of the obstetric gap. Modeled around two CANONICAL hypothesis groups rather than one.
    beta_cell_reserve_unmasking_model: physiological gestational insulin resistance is universal and not pathological; GDM is what happens when that load meets marginal beta-cell reserve, so pregnancy functions as a stress test of a pre-existing trait. This predicts (and the evidence shows) that the GDM risk-factor profile is the type 2 diabetes risk-factor profile and that risk persists after delivery.
    continuous_glycaemic_risk_model: HAPO established that outcome risk rises continuously with maternal glucose with no inflection, so GDM is a diagnostic convention imposed on a continuum.
    Node chain: placental hormone-driven insulin resistance -> beta-cell compensatory failure -> maternal hyperglycaemia -> fetal hyperinsulinaemia (Pedersen) -> excess fetal growth and adiposity -> shoulder dystocia; with parallel edges to neonatal hypoglycaemia and to maternal progression to type 2 diabetes.
    Deliberate omission: no prevalence record is asserted, despite GDM being the most common medical complication of pregnancy, because reported prevalence is primarily a function of which diagnostic threshold a guideline adopts and cross-criterion figures are not comparable. This is documented in a KNOWLEDGE_GAP discussion and in entry notes, with instructions for any curator adding prevalence later to record the diagnostic criterion and not pool across criteria.
    Ontology notes: the maternal hyperglycaemia phenotype is bound to HP:0003074 Hyperglycemia rather than HP:0009800 Maternal diabetes (a pregnancy-history term outside the PhenotypeTerm enum root); the preeclampsia complication is bound to MONDO:0005081 rather than HP:0100602 for the same reason, following the workaround already used in Familial_Hyperaldosteronism_Type_I.
    All snippets verified as exact substrings against fetched abstracts.

- type: EDIT
  outcome: changed
  summary: "Address PR #14119 review findings on variants, atomic pathophysiology graph, phenotype connectivity, and evidence annotations"
  details: |
    Addressed all ai4c-reviewer findings on PR #14119:
    - Replaced the unverified Family 1 frameshift HGVS (c.16delG / p.Val6Serfs*26) and
      missense string (c.1997G>A / p.Gly666Asp) in `genetic[0].features` and `variants`
      with the exact variants reported in PMID:28250456 and PMID:38585553: the Family 1
      homozygous 7682 bp deletion removing the 3' end of exon 1 and causing complete
      exon 1 skipping (predicted p.Pro11Thrfs*15), and the Family 3 homozygous missense
      variant NM_005215.3:c.2071C>A (p.Gln691Lys) in the third fibronectin repeat.
    - Decomposed bundled pathophysiology nodes into 11 single-claim atomic nodes with
      `mechanism_confidence` ratings and `downstream` causal edges connecting all 11
      curated phenotypes (`just list-disconnected-phenotypes` reports 0 disconnected).
    - Added a top-level `mechanistic_hypotheses` entry (`scoliosis_spinal_interneuron_hypothesis`,
      status `EMERGING`) and `HYPOTHETICAL` confidence ratings for the speculative
      spinal commissural interneuron / paraspinal muscle activation imbalance pathway
      to scoliosis.
    - Split coarse `Abnormal brainstem morphology` (`HP:0002363`) into specific phenotypes
      `Midline brainstem cleft` (`HP:0033645`) and `Hypoplasia of the brainstem`
      (`HP:0002365`), added a note explaining `HP:0000549` vs supranuclear `HP:0025590`
      on `Horizontal gaze palsy`, and added primary cohort frequency evidence from
      PMID:28250456 on `Mirror movements`.
    - Updated `Physical Therapy and Neurodevelopmental Rehabilitation` evidence from
      PMID:38516134 to `supports: NO_EVIDENCE` to reflect that the snippet calls for
      future evaluation of rehabilitation benefits.
    - Reclassified mouse/model-organism background quotes in PMID:28250456 to
      `evidence_source: MODEL_ORGANISM` and `quote_role: BACKGROUND`, added `reference_title`
      and `quote_role` across all evidence items, populated top-level `references` for
      all 6 cited PMIDs, updated `creation_date` to `2026-10-14T00:00:00Z`, and removed
      the redundant self-mapping to `MONDO:0054602`.

  outcome: changed
  summary: Initial curation of Gaze Palsy, Familial Horizontal, with Progressive Scoliosis,
    2 (MONDO:0054602)
  details: |
    Created a comprehensive dismech disorder entry for Gaze Palsy, Familial Horizontal,
    with Progressive Scoliosis, 2 (MONDO:0054602, OMIM:617542; also known as developmental
    split-brain syndrome / DSBS) caused by biallelic loss-of-function variants in DCC
    (HGNC:2701):
    - Modeled the 5-node causal pathophysiology graph from biallelic DCC loss-of-function
      to impaired Netrin-1/DCC midline axon guidance signaling, forebrain commissural
      agenesis (corpus callosum, anterior and hippocampal commissures), hindbrain/medullary
      midline tract failure (abducens-to-oculomotor internuclear commissure, superior
      cerebellar peduncle decussation, transverse pontine fibers, and pyramidal decussation),
      and spinal commissural interneuron circuit disruption driving progressive scoliosis.
    - Curated 10 phenotypes with HPO bindings, frequencies across the 8 published cases,
      and causal upstream links (`has_upstream`) to pathophysiology nodes.
    - Documented autosomal recessive inheritance, allelic phenotypic spectrum with AD
      congenital mirror movements 1 (MRMV1) and isolated corpus callosum agenesis, 4
      pathogenic DCC variants (p.Val263Alafs*47, p.Met1217Valfs*11, p.Gln691Lys, c.3941_3946del),
      diagnostic neuroimaging (brain MRI/DTI tractography with Probst bundles, midline
      brainstem cleft, butterfly medulla, absent midbrain red dot sign) and DCC genetic
      testing, supportive/surgical treatments, and differential diagnoses against ROBO3-related
      HGPPS1 (MONDO:0011848) and Duane retraction syndrome (MONDO:0018054).

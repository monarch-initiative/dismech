  summary: 'Create: Ribose-5-Phosphate Isomerase Deficiency (RPIA, WP-008 row 3.5.02.01)'
  details: |
    New entry for MONDO:0012073 from the IEMbase WP-008 package (issue 5563, seed row 3.5.02.01). Preflight: MONDO cross-references OMIM:608611 and Orphanet:440706; the Orphanet record names RPIA (hgnc:10297) as disease-causing. Evidence is drawn from the cached abstracts of the four-patient literature (PMID:10589548, 14988808, 20499043, 30088433, 31247379), the rat polyol study PMID:24970317 (cited as REFUTE on oxidative injury), and ORPHA:440706. Naik et al. 2017 (PMID:28801340) has no PubMed abstract and is named in notes only. Pathograph: RPI deficiency -> ribitol/D-arabitol accumulation -> urinary polyols and (hypothesized, EMERGING group) white matter degeneration -> leukoencephalopathy. Phenotypes carry no frequency band because only four patients are reported. Stub stubs/ribose-5-P_Isomerase_Deficiency.yaml deleted. Validated with validate, validate-terms, count-verified-snippets (39/39) and the offline whole-repo gates.

  summary: 'Create: Round Cell Sarcoma with EWSR1-non-ETS Fusion (MONDO:0958160)'
  details: |
    Third and last of the entities the 2020 fifth edition of the World Health Organization classification of bone and soft tissue tumours added beside Ewing sarcoma in its undifferentiated small round cell sarcoma category, completing the set in this knowledge base. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only.

    The entity is defined by a negative criterion, that the fusion partner is not an ETS family member, and the entry says so rather than presenting it as a coherent mechanism. Two strata are declared: EWSR1::NFATC2 with its FUS counterpart, and EWSR1::PATZ1. The description and the entry notes both record that nothing cited shows the two strata share a programme, and that the PATZ1 report which founded its stratum noted those cases clustered away from other EWSR1-fusion sarcomas.

    Five pathophysiology nodes, scoped honestly to the NFATC2 stratum where the evidence only covers that one. The fusion removes the calcineurin-dependent control region of NFATC2 and leaves its active domain under the EWSR1 transactivation domains, giving constitutive transcriptional activity, a distinct methylation and copy number programme that segregates from Ewing sarcoma, a round cell proliferation in a fibromyxoid stroma, and a poor response to Ewing-type chemotherapy. The constitutive-activity node states in its own description that no equivalent mechanism is recorded for the PATZ1 stratum, and its evidence explanation notes that the step from fusion structure to constitutive activity is the authors' inference rather than an assay.

    The phenotype is connected to the pathograph from the start, after the review of the CIC entry found that layer disconnected there. One phenotype, one connecting edge, 1 of 1 connected.

    The most important curation decision is the simple bone cyst differential. FUS::NFATC2 or EWSR1::NFATC2 fusions were found in 6 of 11 simple bone cysts, a benign lesion of the same bones, and the authors state the relationship to sarcoma with the same fusion is unresolved. That is recorded as a differential diagnosis, because it means a fusion result does not establish malignancy. Mesenchymal chondrosarcoma is recorded for the same kind of reason: it shares the NKX3-1 stain.

    Seven references. Twenty-four snippets, all verified.


  summary: Cite every causal edge in round cell sarcoma with EWSR1-non-ETS fusion
  details: |
    All five pathophysiology causal edges carried no evidence; all five are now cited, with nine evidence items drawn from the entry's existing reference set. No new references were fetched and no terms were bound.

    The first edge is cited from the breakpoint cloning that established its architecture, graded INDIRECT because constitutive activity follows from losing the calcineurin-dependent control region rather than having been measured. Its explanation also records that the target node names NFATC2 and that nothing cited here says the PATZ1 stratum works the same way, which is what this entry's notes ask for.

    The chemotherapy edge turned up a disagreement inside the entry's own reference set, and it is now recorded as such rather than smoothed over. The claim that these tumours respond poorly to Ewing-type chemotherapy rests on a single review sentence, already carried on the target node. PMID:30895378 reports that all three patients with follow-up in its series responded to neoadjuvant chemotherapy, which cuts the other way, so that sentence is recorded as a REFUTE item beside a SUPPORT item from the same paper for the indolent-course half of the claim. Three patients on an unstated regimen is not a response-rate comparison, hence INDIRECT. The edge's description was left as written: softening a curated claim on the strength of one small series is a judgement for whoever next revisits the entry, and the paired items make the tension visible where a reader will meet it.

    No cell of origin was marked and no genetic_context was added to a pathophysiology node, consistent with the decision recorded in this entry's notes and in its two sibling WHO entries.

    Validated with just validate-disorders over all three sibling entries (134 snippets, 134 titles, 0 issues) plus the per-file and whole-tree offline gates.

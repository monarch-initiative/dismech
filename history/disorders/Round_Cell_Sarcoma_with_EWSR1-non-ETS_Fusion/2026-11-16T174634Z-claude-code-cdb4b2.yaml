  summary: Give the poor-response claim the outcome data it rests on, and stop it
    over-reaching
  details: |
    The entry asserted poor response to Ewing-type chemotherapy in four places - a pathophysiology
    node name, that node's description, a causal edge's description and a treatment row's description
    - on a single supporting clause, quoted twice: an introductory sentence in a primary
    immunohistochemistry study, summarising work it cites and giving no response rate. The entry
    already carried the contradiction, as a REFUTE item recording that all three patients with
    follow-up in the methylation series responded to neoadjuvant chemotherapy. What it did not carry
    was the outcome data that bears on the claim either way, although three such sentences sit in
    references the entry already cites.

    Three outcome items added to the node. The first PATZ1-fusion patient in PMID:30379650 received
    vincristine, doxorubicin and cyclophosphamide - the Ewing-type backbone - progressed at five
    months, and died; that is the only named regimen followed by an outcome anywhere in this entry's
    sources, and it is graded DIRECT because the sentence states both. The second patient in the same
    report received adjuvant doxorubicin and ifosfamide and was free of disease, recorded as a REFUTE
    so the paper is not cited only for the half that agrees, and graded INDIRECT because three months
    of follow-up in a tumour called indolent establishes very little. PMID:31972596's own single
    FUS-NFATC2 patient died within eighteen months, which is the only outcome that paper reports
    first-hand - its eleven EWSR1-NFATC2 cases carry no follow-up column - and is INDIRECT here
    because the sentence names no treatment.

    The two strata are kept apart rather than pooled: the named-regimen death is a PATZ1-fusion
    tumour, the three responders and the FUS-NFATC2 death are NFATC2-fusion tumours. The node's
    description now states the split and attributes each course, and the edge description no longer
    asserts poor response as settled, since its own evidence list contains the refutation.

    Two further repairs. The treatment row said no prospective trial has tested a regimen in this
    entity, which no cited source states; it now says no cited source reports a trial and that the
    sources reporting outcome call the clinical data very limited, with PMID:30895378's rarity
    sentence added to carry it. And an explanation describing the eleven-case morphology series said
    the pattern was present across all eleven cases, where the quoted sentence excepts one and this
    entry's other use of the same quote says so.

    One wording fix: an explanation called the poor-response source a review sentence. That paper is a
    primary immunohistochemistry study and the clause sits in its introduction; both evidence items
    already graded it BACKGROUND correctly, so only the prose was loose.

    48 snippets verified, up from 44. All four new quotes come from references already cited and
    already committed. Offline gates green, including check-snippet-grading, which CI does not run on
    a kb-only PR.

    Self-correction, before review. An adversarial pass over the pushed branch found that the central
    new item did not say what this record claimed for it. The patient given vincristine, doxorubicin
    and cyclophosphamide received them under a working diagnosis of malignant peripheral nerve sheath
    tumour - the sentence immediately before the quoted one says so - and no cited source calls those
    three drugs an Ewing-type regimen. This repository's own Ewing sarcoma entry defines the backbone
    as those three alternating with ifosfamide and etoposide, so by its own definition that patient
    did not receive it. The item is regraded INDIRECT and its explanation now states all of that. The
    earlier claim that it was "the only named regimen followed by an outcome anywhere in this entry's
    sources" was also false: the same report's second patient received a named regimen and has an
    outcome, and is the next item in the same change.

    Four more corrections from the same pass. The disease-free patient was graded REFUTE; she received
    doxorubicin and ifosfamide, so a good outcome on a different regimen contradicts nothing, and she
    is now NO_EVIDENCE. The FUS-NFATC2 death was graded SUPPORT while cutting against this node's
    other half, the more indolent course, and is now REFUTE against that half. The rarity sentence was
    graded PRIMARY_RESULT but opens a discussion paragraph and frames what follows, so it is
    BACKGROUND. And the three responders were presented as three clean responses, where the same
    paragraph records that one recurred locally at two years - that continuation is now its own
    evidence item.

    Two wording defects. The edge description called the poor-response source a review clause, which
    is the exact word this change removed from an explanation four lines below in the same commit.
    And the node description pooled the entry's three fusion strata into two. Both fixed.

    49 snippets verified after the correction round.

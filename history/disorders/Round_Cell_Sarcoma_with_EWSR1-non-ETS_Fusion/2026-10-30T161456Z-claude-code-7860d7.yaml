  summary: 'Review round 1: bind the subtypes to MONDO and split the NFATC2 stratum'
  details: |
    Round one of review on the pull request that creates this entry. One blocking item, one evidence correction and four suggestions, all addressed in this push.

    Blocking item. The two declared subtypes carried no subtype_term although MONDO has a term for each, and one of them was really two. The reviewer supplied three identifiers; each was looked up through the OLS4 API before binding rather than taken on trust, and all three resolved as given. MONDO:0958299 round cell sarcoma with EWSR1-NFATC2 gene fusion and MONDO:0958300 round cell sarcoma with EWSR1-PATZ1 gene fusion are now bound, and the NFATC2 stratum is split so that MONDO:0958301 round cell sarcoma with FUS-NFATC2 gene fusion is a stratum of its own.

    The split follows the entry's own argument rather than the ontology's convenience. The entry already said the FUS and EWSR1 forms are not interchangeable, and that the NKX3-1 marker is evidenced for the EWSR1 form only. The new FUS stratum carries both sources: the series reporting that the usual TET-family interchangeability does not hold for NFATC2 tumours, and the single FUS case in the NKX3-1 study that lacked the nested or corded architecture and was negative for CD99, NKX2-2 and NKX3-1. Its description states that this rests on one case, so it is a reason to keep the strata apart rather than an assertion of a contrary profile.

    Evidence correction. The node recording a poor response to Ewing-type chemotherapy cited only a sentence about the disease course, not about response. The clause that carries the response claim is now quoted on the node as well, graded the same way it is on the treatment.

    Also corrected, from the reviewer's smaller point: the evidence for constitutive NFATC2 activity was graded DIRECT while its own explanation said the step from fusion structure to constitutive activity is an inference with no activity assay reported. It is now INDIRECT, and the explanation leads with that.

    Suggestions taken. PAX7 is added twice, because it does two different jobs: in the Ewing differential it explains why the routine immunoprofile does not separate the two, since CD99, NKX2-2 and PAX7 are coexpressed in both; in the mesenchymal chondrosarcoma differential it is what resolves the overlap that NKX3-1 leaves open, because that tumour consistently lacks it. The edge from constitutive activity to the distinct programme is re-typed INDIRECT_UNKNOWN_INTERMEDIATES, since the methylation work shows the programme exists rather than that the fusion produces it. A new imaging_findings section records the radiologic description, with its description noting that the review gives it for the category as a whole and hedges it.

    One suggestion not taken, with a reason. The reviewer suggested moving the transcription-factor activity term off the root lesion node and leaving it only on the constitutive-activity node. The root node carries gene descriptors, and check-gene-activity-grounding requires a node with genes to carry a molecular function, so removing it there would fail that gate.

    Validation: all 18 C4 gates pass.

  summary: 'Edit: Round Cell Sarcoma with EWSR1-non-ETS Fusion, two differential rows
    bound to MONDO and the WHO 2026 split recorded'
  details: |
    Two differential-diagnosis rows that named a disease in free text are now bound: Simple Bone Cyst to MONDO:0019372 solitary bone cyst (simple bone cyst is a MONDO synonym of that class) and Mesenchymal Chondrosarcoma to MONDO:0006853. Both labels were read from OLS on 10 Nov 2026.

    The 2026 sixth edition of the WHO classification of soft tissue and bone tumours (PMID:42839882, already cached) splits the category this entry is built on into NFATC2-rearranged sarcoma, which stays in the section with Ewing sarcoma, CIC-rearranged sarcoma and sarcomas with BCOR genetic alterations, and PATZ1-rearranged sarcoma, which moves to the tumours of uncertain differentiation. The entry records this in a dated paragraph of its notes, in one sentence and one quoted item on the EWSR1-NFATC2 subtype row, and in one sentence and two quoted items on the EWSR1-PATZ1 subtype row. The three items are graded REVIEW_SYNTHESIS and OTHER, as the Undifferentiated_Round_Cell_Sarcomas grouping already grades this paper.

    The entry is not split. MONDO still has the 2020 class MONDO:0958160, and OLS4 searches of MONDO (label and synonym fields) for NFATC2-rearranged sarcoma and PATZ1-rearranged sarcoma, re-run on 10 Nov 2026 before commit, returned no class. The note leaves open whether the entry should follow the sixth edition.

    Validation: just validate, validate-terms and validate-disorders pass; all snippets verify against the cached references; the whole-repo gates and the kb test lane were run locally and pass.

  summary: Backfill transmission (#10115)
  details: |
    Added a transmission block with three routes: faecal-oral person-to-person spread, contaminated food and water, and sexual contact. Evidence: PMID:29493962 (StatPearls; faecal-oral route, and the sexual-contact outbreak setting among men who have sex with men), PMID:40915309 (Lancet seminar; humans as the only natural reservoir and the 10-100 organism infectious dose that makes person-to-person spread dominant), and PMID:23818998 (Bangladesh time-series study; food and water as the secondary route, quoted as background and marked quote_role BACKGROUND since it is the paper's framing rather than its housefly result). The Shigella agent was already bound to NCBITaxon:620; its four species strata remain unbound as UNBOUND_AGENT_STRATUM, which is a separate finding class outside this change. Validated with just validate, just count-verified-snippets (35/35 verified), and the batched just validate-disorders sweep.

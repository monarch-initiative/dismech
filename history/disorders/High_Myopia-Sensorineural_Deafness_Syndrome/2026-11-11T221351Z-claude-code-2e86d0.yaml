  summary: 'Create: High Myopia-Sensorineural Deafness Syndrome'
  details: |
    New entry for high myopia-sensorineural deafness syndrome (deafness and myopia syndrome, DFNMYP; MONDO:0009082), caused by biallelic loss-of-function variants in SLITRK6. The MONDO and Orphanet name is kept because no SLITRK6-related name is established; the MONDO and OMIM synonyms are listed.

    Content: autosomal recessive inheritance and the Old Order Amish founder-allele carrier frequency (4.7%); an eight-node pathograph running from biallelic truncating SLITRK6 variants and loss of SLITRK6 at the cell surface to reduced inner-ear neurotrophin-Ntrk signaling, reduced cochlear innervation with spiral ganglion neuron loss, dyssynchronous auditory nerve activity, outer hair cell dysfunction, delayed retinal synaptogenesis and axial eye elongation; eight phenotypes (high myopia, myopic astigmatism, myopic macular degeneration, prelingual and progressive sensorineural hearing loss, dyssynchronous auditory brainstem responses, absent otoacoustic emissions, absent middle ear muscle reflexes); the ClinGen Definitive (AR) classification copied from its CGGV record; three variants; molecular and physiological diagnosis; hearing aids, cochlear implantation and refractive correction; Stickler syndrome type 1, Donnai-Barrow syndrome and Knobloch syndrome 1 as differentials; the Slitrk6 knockout mouse with five model-to-mechanism links; and two open discussions (the vestibular human-mouse mismatch, which may reflect otolith-only testing in patients, and the unknown mechanism of axial elongation).

    Sources: Tekin et al. 2013 (abstract only; full text not licensed for caching), Morlet et al. 2014 (full text), Salime et al. 2018, a 2020 Pakistani hearing-loss cohort, the Katayama 2009 and Matsumoto 2011 mouse studies, the retired GeneReviews chapter (cited only where primary reports agree), a 2024 review of mouse myopia models, and Orphanet for Stickler syndrome.

    Deep research: OpenScientist report (the falcon key was rejected and the recipe fell back automatically), research/High_Myopia-Sensorineural_Deafness_Syndrome-deep-research-openscientist.md. Its reference validation resolved 3 of 3 citations with 6 of 6 quotes found; term validation flagged one obsolete GO term and a mislabelled HP CURIE (HP:0011962), neither used here; preflight-dr passed. The report's STRING-based statement that SLITRK6 binds PTPRD and PTPRS was not adopted, because no fetched source shows it for SLITRK6.

    Decisions: GO has no molecular-function annotation for SLITRK6 in human or mouse, so the gene's landing node carries no molecular-function term. The mouse gene is bound to MGI:2443198. Myopic astigmatism is left without an upstream edge because no source explains it. Intellectual impairment, named in the title of the 1968 Amish report, is not recorded, since the molecularly confirmed Amish patients had no neurological findings outside hearing and vision. Glaucoma and Duane retraction syndrome in one Pakistani sibling are noted but not recorded as phenotypes.

  summary: 'Review round 1: notes on the SLITRK6 binding, Usher differential'
  details: |
    The entry-level notes still said the SLITRK6 node carries no molecular-function term, although the previous commit bound it to GO:0005102 signaling receptor binding. The sentence now says the node is bound to that term on the strength of PTPsigma-ligand studies in cultured neurons (PMID:29934346, PMID:25394468) and that the activity's role in the cochlear and ocular phenotypes is untested.

    The prelingual hearing loss phenotype dropped its PMID:31506927 item, which quoted a review table cell rather than a sentence; two primary reports still carry the claim. The PMID:31506927 cache file stays, because another entry cites it.

    Usher syndrome type 1 (MONDO:0010168) is added as a differential. The GeneReviews chapter (PMID:20301442) gives its defining triad of congenital profound hearing loss, vestibular areflexia and retinitis pigmentosa; it is graded HUMAN_CLINICAL as in the entries that already quote it, and is now tagged GeneReviews in references. The Pakistani cohort (PMID:33187236) that includes the SLITRK6 family 7 also reports two MYO7A Usher families with high myopia, cataract and retinitis pigmentosa, which is quoted as the overlap. Those retinitis pigmentosa reports belong to the MYO7A families, not to the SLITRK6 family. Contiguous 13q deletions spanning SLITRK6 are not added, since they rest on ClinVar records rather than a citable report.


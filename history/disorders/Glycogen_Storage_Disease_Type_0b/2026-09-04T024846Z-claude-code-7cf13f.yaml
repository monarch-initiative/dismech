  summary: 'Create: Glycogen Storage Disease Type 0b (GYS1)'
  details: |
    New disease entry for GSD type 0b (MONDO:0012693, GYS1/hgnc:4706), IEMbase WP-008 row 3.4.02.01. NEC preflight against sqlite:obo:mondo confirmed the term carries RO:0004003 to HGNC:4706 and xrefs OMIM:611556 and Orphanet:137625, all matching the seed row. Entry decision: a new Disease entry rather than a subtype, because the lesion is on the synthesis side of the pathway and the physiology (normal glucose tolerance, glycogen-depleted rather than glycogen-loaded muscle) is not shared with any existing entry; added as a member of kb/groupings/Glycogen_Storage_Diseases.yaml, whose rationale had recorded GSD 0 as a curation gap. Five-node pathograph from GYS1 deficiency through muscle and cardiac glycogen depletion to the muscle-energy and cardiac arms, with eight phenotypes wired as bare-name downstream targets. The cardiac node carries a REFUTE evidence item (two adult patients with the same enzymatic lesion and no heart involvement) so the hypertrophy step is not read as obligate. The Gys1-null mouse is recorded with one RECAPITULATES link for the substrate lesion and one FAILS_TO_RECAPITULATE link for the cardiac phenotype, plus a HUMAN_MODEL_MISMATCH discussion, because the surviving nulls have glycogen-free but structurally and functionally normal hearts. Validation: just validate (schema), just validate-terms (passed), 59/59 evidence snippets verified against cached references, check-entity-refs and check-causal-targets clean, check-groupings evaluates the new member SATISFIED. Stub stubs/Glycogen_Storage_Disease_Due_To_Muscle_And_Heart_Glycogen_Synthase_Deficiency.yaml deleted.

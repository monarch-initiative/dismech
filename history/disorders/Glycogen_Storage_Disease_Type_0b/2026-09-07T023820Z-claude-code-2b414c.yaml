  summary: 'Review round 1: add PMID:19699667, split the bundled cardiac node'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #10873.

    IMPORTANT 1 - omitted human report. Fetched PMID:19699667 (Cameron JM et al., Mol Genet Metab 2009) with just fetch-reference and curated it into five places: a homozygous two-base-pair exon 2 frameshift deletion added to genetic.notes and as its own genetic evidence item; a third independent observation of the compensatory oxidative shift, which is the report that names the mitochondrial changes as compensation rather than primary mitochondrial disease; a third unrelated childhood cardiac death, added to the Sudden cardiac death phenotype and folded into the cardiac-versus-myopathic knowledge gap rationale; a new diagnosis entry recording the report's testing indication for children with an abnormal cardiac response to exertion, together with the mitochondrial-myopathy differential trap; and a prevalence evidence item.

    The prevalence.notes sentence 'Only two families were known when the third patient was reported in 2012' is fixed. That count is now attributed to the 2012 authors rather than asserted, and the notes record explicitly that the 2009 report predates and is not included in it. The PMID:21958591 evidence explanation was rewritten to say the same thing so the quote is not read as a corrected total.

    The report's title states the deficiency is diagnosable from skin fibroblasts, but the cached abstract does not describe the assay. Rather than quote the title, the diagnosis entry records the fibroblast route in prose and says why it is not curated as a modality.

    IMPORTANT 2 - bundled node. Split 'Cardiomyocyte Energy Reserve Failure and Hypertrophic Remodeling' into 'Cardiomyocyte Energy Reserve Failure' (CELLULAR) and 'Myocardial Hypertrophic Remodeling' (TISSUE), joined by an INDIRECT_UNKNOWN_INTERMEDIATES downstream edge. The contested inference now sits on that edge: the PMID:17928598 supporting observation and the PMID:35641353 REFUTE counter-evidence are both carried there, so the uncertainty lands on the depletion-to-hypertrophy step rather than smearing across a node that is otherwise well supported. The incoming edge from 'Muscle and Cardiac Glycogen Store Depletion' now targets the cellular node; the Gys1-null mouse FAILS_TO_RECAPITULATE link and both discussions were retargeted to the tissue node.

    Suggestions taken. HP:0012378 Fatigue replaced by HP:0009020 Exercise-induced muscle fatigue on the Muscle fatigability phenotype. New cardiovascular phenotype for the abnormal heart rate and blood pressure response during exercise, bound to HP:0500018. prevalence_class changed from BELOW_1_IN_1000000 to ULTRA_RARE, which is what the notes already described.

    Suggestion not taken. An exercise intolerance phenotype (HP:0003546) was considered and left out: the phrase appears only in the PMID:17928598 title, and no cached abstract in this literature carries a quotable sentence for it, so curating it would mean a title snippet.

    Validation on the edited tree: just validate passed schema, terms and references with 69/69 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean on the file.

  summary: Add prematurely aged appearance phenotype and inheritance block
  details: |
    Added HP:0007495 Prematurely aged appearance as a phenotype and an autosomal dominant inheritance block, both previously absent.

    Motivation: the new Progeroid_Syndromes grouping (kb/groupings/Progeroid_Syndromes.yaml) states a NECESSARY criterion of a prematurely aged appearance in a Mendelian disorder. HGPS is the prototype member and failed both leaves purely because neither fact was curated here. Per the curate-grouping rule, a listed member failing a necessary criterion is fixed in the member, not exempted in the grouping.

    Phenotype: HP:0007495, marked diagnostic with frequency VERY_FREQUENT. Cited twice from PMID:18256394, the NIH cohort of 15 children - once for the disease-level premature-aging characterization and once for the component findings (sclerotic skin, joint contractures, bone abnormalities, alopecia, growth impairment) confirmed in all 15 patients. Both snippets were already in use elsewhere in this file with evidence_source HUMAN_CLINICAL, so the grading is consistent.

    Inheritance: HP:0000006 Autosomal dominant inheritance. The description records that the mode of action is dominant-negative through progerin while essentially every case is a de novo new mutation, which is why the clinical literature calls the syndrome sporadic and autosomal dominant together. Evidence from PMID:18256394 for the mode and PMID:12714972 for the de novo origin, the latter quoting the 18-of-20 finding from the gene-identification study.

    No other content changed. Validation: just validate and just validate-terms passed; all snippets in the file verify against the committed reference cache.

  details: |
    Addressed the eight blocking items. (1) Added has_subtypes making this the parent per design decisions 3e: a Pneumococcal pointer row with curated_in: Pneumococcal_Meningitis and subtype_term MONDO:0006913, plus etiologic_species rows for GBS and S. suis (left UNBOUND_SUBTYPE advisory as no MONDO meningitis term was bound for those two). (2) Regraded the PMID:33370401 infectious_agent background sentence MODEL_ORGANISM to HUMAN_CLINICAL + quote_role BACKGROUND. (3) Wired the pathograph to 5/5 phenotypes (TLR-MMP inflammation to Fever/Headache/Nuchal rigidity; a new cochlear node to Sensorineural hearing impairment; CNS injury to Coma). (4) Added modeled_mechanisms to both rat models (infant rat to TLR-MMP inflammation RECAPITULATES; adult Wistar rat to CNS injury PARTIALLY_RECAPITULATES), both TISSUE/ALIGNED. (5) Added therapeutic_agent ceftriaxone (CHEBI:29007) and vancomycin (CHEBI:28001) to empiric therapy with a PMID:42202671 susceptibility snippet. (6) Added a diagnosis block (CSF criteria PMID:39230218; the absent-pleocytosis caveat PMID:33591075), an environmental block for immunocompromising host conditions (PMID:16163421), a clinical_burden HIGH block (GBD 2023, PMID:41911930), a PCV prevention treatment (PMID:39864526), an atomic Pneumolysin-aCx43 node (PMID:33370401), and a Coma phenotype (HP:0001259, PMID:15509818). (7) Split the two bundled nodes: pulled the pneumolysin/aCx43 mechanism and the cochlear-injury branch out of Meningeal Seeding and CNS Injury into their own atomic nodes. (8) Added directness: INDIRECT to the gene-carriage bacteremia evidence. Also changed biological_scale ORGANISM to TISSUE on the two over-broad nodes. validate, validate-terms, validate-disorders (LRV, 33/33), check-folded-hyphens and the connectivity/scale/enum/duplicate/case gates all pass. Deferred: maternal GBS intrapartum-prophylaxis prevention (weak abstract-only sourcing) and MONDO binding of the GBS/S.suis subtypes.

  summary: 'Create: Streptococcal Meningitis'
  details: |
    Created a streptococcal meningitis child of Bacterial meningitis from the OpenScientist fallback report and bound MONDO:0001316, Streptococcus pneumoniae, Streptococcus agalactiae, zoonotic Streptococcus suis, a shared human/swine lifecycle, mucosal or zoonotic acquisition routes, blood-to-CSF streptococcal seeding, pneumococcal aCx43/pneumolysin barrier traversal, TLR-MMP neutrophilic inflammation, CNS and cochleovestibular injury, fever, nuchal rigidity, headache, sensorineural hearing impairment, empiric antibacterial therapy, adjunctive dexamethasone, and rat pneumococcal meningitis models. Recorded the entry as a deliberate R9 lump for the pneumococcal, neonatal GBS, and zoonotic S. suis branches, retained UBERON:0002421 under its canonical hippocampal formation label, and avoided the report's misbound NCIT drug IDs, HP:0002169 for meningism, HP:0034332 for focal neurologic deficits, and unsupported seizure phenotype lead.

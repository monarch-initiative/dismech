  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #14898. (1) Added has_subtypes with a curated_in pointer to Pneumococcal_Meningitis plus etiologic_species rows for GBS and S. suis (no MONDO term exists for either, so no subtype_term; organisms stay NCBITaxon-bound under infectious_agent). (2) Regraded PMID:33370401 intro epidemiology sentence from MODEL_ORGANISM to HUMAN_CLINICAL + quote_role BACKGROUND (#10262). (3) Wired all phenotypes into the pathograph: list-disconnected-phenotypes now 5/5 connected (was 0/4). (4) Both rat animal models now declare modeled_mechanisms (TISSUE model_scale against TISSUE targets, both ALIGNED in model-scale-audit). (5) Empiric antibacterial therapy now carries ceftriaxone (CHEBI:29007) and vancomycin (CHEBI:28001) as therapeutic_agent, grounded in PMID:42202671 which names both. (6) Deepened cross-species content: added diagnosis (CSF criteria PMID:39230218 + pleocytosis caveat PMID:33591075), prevalence (GBD 2023 PMID:41911930), clinical_burden (GBD), environmental host-risk (immunocompromise PMID:16163421), prevention split (PCV vaccination PMID:39864526 and maternal GBS intrapartum prophylaxis PMID:42060466), an atomic pneumolysin-aCx43 astroglial cytotoxicity node, a separate cochlear injury node, and a Coma phenotype (PMID:15509818, 14% comatose). (7) Split the bundled CNS-injury node (cochlear branch) and added the pneumolysin node. (8) Added directness INDIRECT to the Streptococcal Bacteremia gene-carriage evidence. Cited StatPearls (PMID:32119335) tagged StatPearls. Deferred: seizure phenotype (no exact-quote frequency snippet in the consumed corpus) and single-valued subtype scoping of hearing loss (spans two strata). Validated: validate 0 issues, validate-terms pass, count-verified-snippets 35/35, validate-disorders 0 issues/36 titles, check-causal-targets OK, check-entity-refs OK, model-scale-audit 2/2 ALIGNED, and the whole-KB no-baseline gates (folded-hyphens, block-scalar-comments, duplicate-keys, enum-values, case-collisions) all pass.

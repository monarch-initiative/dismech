  details: |
    Addressed two of the three Viral_Encephalitis gaps named in issue #6433 (viral disorder claim-by-claim review, Section A): (1) added a DIAGNOSTIC_CRITERIA definitions entry documenting CSF HSV PCR as the confirmatory test with MRI/EEG as adjunct workup, evidenced by PMID:26833985 (CSF PCR) and PMID:37435162 (MRI lesion extent); (2) added a new pathophysiology node 'Post-HSE Anti-NMDAR Autoimmune Encephalitis' downstream of 'Parenchymal Injury and Cerebral Edema', evidenced by PMID:30049614 (prospective cohort quantifying 27% incidence, predominantly NMDAR antibodies) and PMID:27106239 (review naming anti-NMDAR autoimmune encephalitis as a recognized chronic HSE complication). Left open: EEG PLEDs-specific citation (no abstract-level quotable source found; PLEDs detail is in full text only and was not used to avoid a snippet that could fail the --no-full-text pre-PR sweep) and structured epidemiology/prevalence data. Validated with just validate, just validate-disorders (pre-PR sweep, 33/33 snippets verified), just check-duplicate-keys, just check-title-snippets, just check-term-cache-integrity, just check-reference-cache-frontmatter, and pytest -k Viral_Encephalitis (16/16 passed).

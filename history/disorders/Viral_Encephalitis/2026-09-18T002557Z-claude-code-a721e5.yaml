  summary: Backfill transmission (#10115)
  details: |
    Added a transmission block covering the routes of the agents this entry already binds, one block per route rather than one per virus. Person-to-person contact with herpes simplex virus followed by latency and neuronal spread (PMID:39567785 for the human-only reservoir, marked quote_role BACKGROUND; PMID:27106239 for epithelial entry into sensory neurons and for lifelong latency with reactivation), with the description noting that the same reactivation logic governs the varicella-zoster arm and that encephalitis has no exposure history to take. Mosquito-borne transmission of Japanese encephalitis and West Nile viruses (PMID:41755551, PMID:42431607, both newly fetched). Tick bite and alimentary transmission of tick-borne encephalitis virus (PMID:37943707 for both the Ixodes bite and the unpasteurised dairy route). The enteroviral subtype was deliberately left without a transmission block: the entry binds no enterovirus agent, and the only cached candidate was a Theiler's-virus mouse study, which would not support a claim about human enterovirus. All five infectious agents were already bound. Validated with just validate, just count-verified-snippets (40/40 verified), and the batched just validate-disorders sweep.

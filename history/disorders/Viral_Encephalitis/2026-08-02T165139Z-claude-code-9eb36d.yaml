  summary: Add human-clinical evidence for memory impairment phenotype
  details: |
    Added PMID:8937342 (Hokkanen et al. 1996, human neuropsychological follow-up study of HSVE survivors) as SUPPORT/HUMAN_CLINICAL evidence for the Memory impairment phenotype, alongside the existing PMID:40005568 (non-HSV alphavirus animal model, PARTIAL/MODEL_ORGANISM). This closes the last remaining gap noted in issue 6431: the Memory impairment node previously relied solely on wrong-agent model-organism evidence for a human phenotype claim, contrary to CLAUDE.md evidence-source discipline. All other items in issue 6431 (Long_COVID evidence_source retags, Monkeypox supports retags, Viral_Encephalitis aciclovir/HSE-gene supports retags, Ebola_Virus_Disease_EVD MODEL_ORGANISM tag) were already resolved by prior PRs 6448 and 6957.

  summary: 'Create: Atrioventricular Septal Defect MONDO:0859565'
  details: |
    Curated from an OpenScientist deep-research report. All 22 cited PMIDs independently re-fetched; all 55 snippets verified as exact substrings of the cached records. Three report claims were dropped or re-scoped on verification. The TGF-beta/BMP/Notch/Wnt EndoMT attribution rested on PMID:29549339, which is a methodological caution showing that cells scored as endothelial in the standard explant assay are largely epicardial, so only its framing statements are cited and the caveat is recorded as PARTIAL evidence. The report's suggested AV-valve-regurgitation HPO terms were HP:0031652 Abnormal aortic valve physiology and HP:0000023 Inguinal hernia, corrected to HP:0034376. Its suggested QRS-axis term HP:0031547 is Abnormal QT interval, corrected to HP:0033568. Review round 1 further caught PMID:41125893 misgraded HUMAN_CLINICAL when the cache frontmatter shows a mouse and iPSC study, and PMID:38313390, an Editorial, used to evidence AVSD haemodynamics with a CHD-composition statistic. Both corrected; the editorial was removed entirely in favour of PMID:10812553 and PMID:1943197. The entry models AVSD as failure of the whole atrioventricular mesenchymal complex including the dorsal mesenchymal protrusion, per PMID:38884733, rather than the superseded endocardial-cushion-fusion account still carried by the Congenital_Heart_Disease root stub. subtype_term bindings deferred to issue #6989. MONDO hierarchy inversion noted: the general term MONDO:0859565 is a child of the familial term MONDO:0020290.

  summary: Review Bjornstad syndrome against clinical and mechanistic sources
  details: >-
    Read the complete original entry and prior histories, the Falcon report scientific content and citation
    sidecar, all original reference caches, and newly fetched clinical and mechanistic sources. Consumed the
    full diet letter, 2021 institutional case PDF, 2019 BCS1L phenotype study, 2024 wild-type Bcs1L structural
    work and 2025 neuropathy study, including their relevant methods, results, discussion and limitations.
    Mined the BCS1L section of the complex III review and differential/management sections of the pili-torti
    review. The 2025 HeLa p.Arg183His comparator informs the molecular mechanism; the neuropathy patients and
    intermediate/GRACILE cases are not treated as classic Bjornstad cohorts. The original gene-paper abstract
    and accessible indexed full-text portions support removing an incorrect complex-III-superoxide-source claim;
    no unavailable full text was represented as cached. Removed universal missense/homozygous and unaffected-ATP-turnover
    claims, separated respiratory activity from assembly, and explicitly qualified ROS-to-cochlear/follicular
    causal edges. Replaced protein-folding chaperone activity with folded-protein translocation. Added a reported
    intellectual-disability finding and sparse scalp hair, corrected diagnostic and treatment interpretation,
    and removed unsupported quantitative frequency bands and speech-delay evidence. Four of six phenotypes
    have graph links; cochlear malformation and intellectual disability remain without a proven causal route.
    Added four genotype examples including a missense/nonsense pair and parental phasing. Cochlear implantation
    evidence remains two siblings, and the diet observation has no controlled efficacy or ROS measurement.
    The 2026 alopecia and tofacitinib/minoxidil letters remain bibliography-only leads because their retrieved
    records lacked an abstract and full text could not be obtained. No outcome is inferred from titles. No
    disease-specific GeneReviews chapter was found in the dated index; a live condition-restricted ClinicalTrials.gov
    search for Bjornstad/BCS1L returned zero studies. Completeness assessment: phenotypes, genetics, mechanisms,
    diagnostics, care and references adequate; no formal subtypes established. All added titles were read against
    their caches and evaluated for claim relevance. Reference caches were generated only through the repository
    fetcher; no cache was manually authored or edited.

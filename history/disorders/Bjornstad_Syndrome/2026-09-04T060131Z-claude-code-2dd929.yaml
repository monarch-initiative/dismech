  summary: 'Review round 1: term, evidence-grading and literature-sweep fixes'
  details: |
    Addresses the CHANGES_REQUESTED review on PR #10895. (1) Replaced GO:0016887 ATP hydrolysis activity / DECREASED on BCS1L Rieske Protein Insertion Failure with GO:0140662 ATP-dependent protein folding chaperone and no modifier: the cited paper says Bjornstad alleles alter protein-protein interaction residues and that only complex III deficiency alleles disrupt ATP-dependent assembly, so a decreased ATPase rate was the opposite of the evidence. (2) Replaced GO:0016226 iron-sulfur cluster assembly with GO:0045039 protein insertion into mitochondrial inner membrane / DECREASED; GO:0016226 is de novo Fe-S cluster biosynthesis, which BCS1L does not do. (3) Re-graded three PMID:17314340 evidence items away from HUMAN_CLINICAL: two functional-analysis results to IN_VITRO and the homology-model residue assignment to COMPUTATIONAL. (4) Manual PubMed sweep in place of a deep-research artifact (33 hits for Bjornstad syndrome, 106 for BCS1L, all screened by title). It found PMID:37816838, a 2024 cochlear implantation case series that the entry did not cite and whose existence contradicted a notes claim that no Bjornstad-specific implantation series had been published; added two evidence items to the implantation treatment, corrected the notes, and added a new phenotype Incomplete partition of the cochlea type I (HP:0011374) reported bilaterally in both siblings. Confirmed no GeneReviews chapter exists for Bjornstad syndrome; the single BCS1L GeneReviews hit (PMID:26425749) is the nuclear-gene Leigh syndrome spectrum overview. (5) Review suggestions taken: HP:0000750 bound to Speech and language delay; GO:0006979 response to oxidative stress added to the conforming cochlear node so the module conformance is checkable, with the omitted potassium branch and the skipped hair-cell-death node explained in the node description; Brittle hair given notes explaining why no frequency band is assigned. Kept PMID:27882597 graded IN_VITRO: transmission electron microscopy and tensile testing of plucked hair is an ex vivo specimen assay, which CLAUDE.md classifies as IN_VITRO. Validated with just validate, validate-terms, count-verified-snippets (34/34), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms.

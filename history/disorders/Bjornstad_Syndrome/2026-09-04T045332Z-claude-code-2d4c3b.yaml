  summary: 'Create: Bjornstad Syndrome (MONDO:0009872)'
  details: |
    New Disease entry for Bjornstad syndrome, the mild end of the BCS1L allelic spectrum (pili torti plus sensorineural hearing loss, no systemic involvement). Pathograph runs BCS1L Rieske protein insertion failure -> complex III assembly defect -> excess reactive oxygen species, then branches into cochlear oxidative injury (conforms_to sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative Stress) and hair shaft keratin assembly failure. Nine literature references fetched with just fetch-reference; 31/31 evidence snippets verified against the cache. Two discussions record what is not known: why the phenotype is restricted to cochlea and hair follicle, and the absence of any model system that reproduces the mild phenotype (HUMAN_MODEL_MISMATCH). GRACILE syndrome, BCS1L-related complex III deficiency, the proposed BCS1L Mitopathies intermediate category, Menkes disease and Bazex-Dupre-Christol syndrome are carried as differentials. Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms and validate-disorders.

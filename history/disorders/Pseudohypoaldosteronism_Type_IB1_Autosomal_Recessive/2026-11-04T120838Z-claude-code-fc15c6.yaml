  details: |
    Answered the third review round of PR 16324. Added three diagnosis rows (biochemical and hormonal profile, sweat test bound to LOINC:74993-7, SCNN1A genetic testing), four treatments (sodium chloride, sodium bicarbonate, potassium-binding resin, fludrocortisone graded REFUTE), six differential diagnoses (congenital adrenal hyperplasia, renal PHA1 MONDO:0008329, aldosterone deficiency, Bartter syndrome, secondary PHA, cystic fibrosis MONDO:0009061), two alphaENaC mouse models (germline null PMID:8589728, adult nephron-specific PMID:26701978), and a HUMAN_MODEL_MISMATCH discussion contrasting mouse neonatal lung-liquid lethality with the SCNN1A-null preterm infant in PMID:22124517. All evidence quotes SCNN1A case reports or case series already cached on the branch; no new references were fetched. The potassium-binding resin row carries no therapeutic_agent because the SCNN1A reports use different resins. Removed the uncited PMID_26582762 cache; the other uncited caches back the deep-research report's citations and were kept. Deleted the curated stub. just validate passed with 90 snippets and 0 issues; entity-ref, causal-target, enum, duplicate-key and logical-rule gates pass.

  summary: 'Create: Long-Olsen-Distelmaier_Syndrome'
  details: |
    New entry for Long-Olsen-Distelmaier syndrome (MONDO:0957960, RRAGC). Used the Perplexity deep-research report as a lead list only; its literature content was sparse and several of its HP/GO IDs were mislabelled, so every term was looked up in the caches or OLS. Primary sources: Long 2016 (PMID:27234373, index p.Ser75Tyr case), Reijnders 2023 (PMID:37057673, three de novo variants, fibroblast/HEK293 functional work), 2026 Genes case report (PMID:42793000, p.Trp115Arg), zebrafish RagC S56Y knock-in (PMID:34071043, TFEB rescue, mTOR inhibition ineffective), Sambri 2024 ragopathy review (PMID:38987251), FL RRAGC papers (PMID:26691987, PMID:31579886, mouse T89N/S74C knock-in), Napolitano 2020 (PMID:32612235) for RagC-dependent TFEB phosphorylation. Pathograph: RagC GoF variant -> amino-acid-insensitive mTORC1 (conforms mtorc1_hyperactivation) and TFEB cytosolic retention -> impaired autophagy-lysosomal clearance -> ventricular failure (conforms cardiomyopathy_maladaptive_remodeling); extracardiac features linked with unknown intermediates and a KNOWLEDGE_GAP discussion. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, validate-disorders all pass; 77/77 snippets verified; 13/13 phenotypes causally connected. No GeneReviews chapter exists.

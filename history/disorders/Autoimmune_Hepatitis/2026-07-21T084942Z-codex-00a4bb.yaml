  summary: Comprehensive re-review of Autoimmune Hepatitis
  details: |
    Rebuilt the entry around an explicit idiopathic-AIH disease boundary and a six-node causal graph spanning ancestry-dependent polygenic susceptibility, liver-autoantigen-specific adaptive immunity, diagnostic autoantibody/hyper-IgG output, T-cell-mediated hepatocyte injury, interface hepatitis, and fibrogenesis. Removed the incorrect MHC-class-II restriction claim for CD8 T-cell killing and the weakly supported standalone regulatory-T-cell-deficiency node. Updated diagnosis and treatment to current guidance, including biopsy as a cornerstone, MMF as a first-line azathioprine alternative with teratogenicity caveats, and removal of budesonide from current first-line representation while preserving the evidence and guideline reversal as a resolved discussion. Added ancestry-specific genetic evidence, phenotypes, biochemical readout edges, treatment mechanism edges, differentials, and classification evidence. Fully paginated ClinicalTrials.gov primary-condition audit covered 110 records and retained eight active or planned direct-AIH studies with explicit mixed-cohort and stale-status notes. Dataset review retained GSE216064 with its pooled-library limitations. Added exact cached evidence and achieved 100% compliance and complete phenotype/gene connectivity.

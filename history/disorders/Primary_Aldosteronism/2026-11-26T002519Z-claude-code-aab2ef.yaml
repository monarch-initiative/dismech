  summary: 'Gene-family review: CACNA1D'
  details: |
    The somatic driver node bundling KCNJ5, CACNA1D, ATP1A1 and ATP2B3 named no molecular function. It now binds CACNA1D's CaV1.3 channel activity (high voltage-gated calcium channel activity, INCREASED) with the functional evidence that the adenoma variants shift activation to less depolarized potentials and impair inactivation (PMID:23913001). The other three genes on the node are outside this review. The PMID:23913001 sentence inferring increased Ca2+ influx from the channel recordings was regraded from HUMAN_CLINICAL to IN_VITRO, matching how the same sentence is graded in Adrenal_Cortex_Adenoma and Familial_Hyperaldosteronism.

  summary: Bind LOINC aldosterone-renin ratio and paired pre/post suppression-challenge
    aldosterone codes
  details: |
    LOINC Diagnostics tranche G, batch 25 (functional and provocative tests with diagnostic thresholds). Code selection was made against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin, and every candidate set was fully enumerated rather than read off a ranked search page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 526 snippets and 587 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms and check-block-scalar-comments all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:30894-0 (Aldosterone/Renin ratio in plasma, already cached on origin/main) to the aldosterone-to-renin ratio screening row, the ratio itself rather than its two component analytes because the ratio is what the test reports and what the guideline threshold applies to; the plasma form was chosen over the serum-or-plasma form LOINC:103560-9 to match the specimen the entry's markers specify, and the two aldosterone-with-renin panels LOINC:55151-5 and LOINC:78960-2 were declined because they differ in whether renin is measured as activity or concentration and the row does not fix that choice. Bound LOINC:57581-1 and LOINC:57580-3 (plasma aldosterone pre and post unspecified challenge) to the confirmatory suppression testing row. That row covers four alternative protocols and the release names only one: of the 73 aldosterone-component codes in LOINC 2.83, ten are qualified by a 25 milligram oral captopril challenge and none by a saline infusion, by fludrocortisone, or by an oral sodium load, the only fludrocortisone codes in the release measuring the drug's own concentration, which is therapeutic drug monitoring and out of this project's scope. Binding the captopril pair LOINC:57582-9 and LOINC:57579-5 would have narrowed the row to one of its four protocols, so the challenge-unspecified pair is used. The plain plasma aldosterone, plasma renin and serum potassium markers were deliberately left unbound: their codes name neither the disease nor a threshold it owns, and the entry carries no disease-specific decision limit on them. No reference ranges were added; neither cited source states a numeric ratio or post-suppression cutoff.

  details: |
    Created kb/disorders/Primary_Aldosteronism.yaml for primary aldosteronism (MONDO:0001422) as a single DISEASE entry rather than a Grouping, per the granularity decision recorded in issue #11163. One pathograph of 13 nodes runs from somatic driver mutations in zona glomerulosa ion channels and pumps (KCNJ5, CACNA1D, ATP1A1, ATP2B3) and from the parallel CTNNB1/Wnt branch, through the shared depolarization-and-calcium-entry convergence node, to autonomous CYP11B2 expression, renin-independent aldosterone excess, mineralocorticoid receptor overactivation in the distal nephron, sodium retention, renal potassium and hydrogen ion wasting, and the MR-driven inflammation and fibrosis arm that produces end-organ damage in excess of the blood pressure. The lateralization axis (APA, unilateral adrenal hyperplasia, bilateral idiopathic hyperaldosteronism) is modelled in has_subtypes because it decides surgical curability; the germline familial forms are cross-referenced to the existing Familial_Hyperaldosteronism and Familial_Hyperaldosteronism_Type_I entries and deliberately not restated. Two conforms_to links declared against fibrotic_response (Inflammatory Recruitment and Amplification; Excessive ECM Deposition); cardiomyopathy_maladaptive_remodeling was considered and rejected because its Neurohormonal Activation node is a compensatory response downstream of a cardiomyocyte insult, whereas in this disease the aldosterone excess is the primary lesion. Hypokalemia is curated explicitly as NOT required for diagnosis and absent in most cases, with four citations. Deep research: research/Primary_Aldosteronism-deep-research-claude_code.md (claude_code provider, 24 web searches, 48 citations). Its reference validation reported 46/46 identifiers resolved with no confabulations, but 4 of 5 report quotes did not match their source and PMID:31813371 resolved to an unrelated mathematics paper, so the sex-difference claim attached to it was dropped and no identifier was taken from the report on trust. preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0001422; disease identity was confirmed manually against the MONDO label, synonyms, and the report's gene set. Every one of the 23 cited references was independently located in PubMed, fetched with just fetch-reference, and read before use. Validation: just validate PASSED, 88/88 snippets verified; just validate-terms PASSED; just check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-reference-titles, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading all OK; just validate-disorders PASSED (88/88); weighted compliance 92.7 percent. Deliberately omitted: a Muscle weakness phenotype, because the only candidate source (PMID:25430699) states the patient had not developed primary aldosteronism; aldosterone synthase inhibitors as a treatment, because the PA-specific evidence was a research letter with no fetchable abstract; and a datasets block, which was not verified.

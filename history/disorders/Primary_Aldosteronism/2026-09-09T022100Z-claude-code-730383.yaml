  summary: 'Review round 1: cell-type specificity, frequency, trials, ARR binding'
  details: |
    Addressed all four IMPORTANT findings from the ai4c-reviewer round-1 review plus three of the four non-blocking suggestions. Rebound the zona glomerulosa cell from CL:0002097 (cortical cell of adrenal gland) to CL:0002099 (type I cell of adrenal cortex) at five pathophysiology nodes, after reading the CL definition confirming CL:0002099 is the zona glomerulosa mineralocorticoid-producing cell. Removed frequency: OCCASIONAL from the Hypokalemia phenotype: the reported 9-46% range straddles the OCCASIONAL/FREQUENT boundary and the spread is ascertainment-driven, so no band is asserted and the description now says so. Rebound aldosterone-to-renin ratio screening from the generic NCIT:C18020 Diagnostic Procedure to NCIT:C124338 Aldosterone to Renin Activity Ratio Measurement. Added a clinical_trials block with four PA-specific registrations, each snippet-verified against its fetched clinicaltrials_*.md cache. Added CL:0005009 renal principal cell to the distal nephron node, which its own description already named. Added mappings: ICD10CM:E26.0 exactMatch, verified against the icd10cm build; icd11f:100169070 narrowMatch. Two suggestions declined with reasons recorded: NCT05432167 was excluded because its own registration title names uncontrolled hypertension and CKD rather than primary aldosteronism, and the ICD-11 stem code 5A11 proposed by the research report does not resolve in the icd11f build. Validation: schema passed, 92/92 snippets verified (was 88/88), validate-terms passed, and the four whole-KB offline gates clean.

  summary: Complete the Primary_Aldosteronism top-level references block
  details: |
    The top-level references block is the entry's index of its own sources, so an incomplete one is misleading rather than merely sparse. Added the 27 cited references it was missing, each title copied verbatim from the title: frontmatter of its references_cache file rather than written from having read the abstract. The block now lists every reference the evidence items cite, with no orphans in either direction, and every cache file was already committed so there is no cache diff. The same gap was a blocking review finding on PR 11413, a suggestion on PR 11412, and was fixed for Sheehan syndrome in PR 11182. Also removed a leftover evidence explanation clause reading 'supporting the OCCASIONAL frequency band': the hypokalemia phenotype deliberately asserts no frequency band, because the reported 9-46% range straddles the OCCASIONAL/FREQUENT boundary, so the clause contradicted the description directly above it. Rewritten to say that the quoted 9-37% range straddles the boundary on its own, which is why no band is asserted. Flagged as a non-blocking note on PR 11179 and deferred there to avoid costing a review cycle on an approved PR. Bibliographic only: no evidence item added or regraded and no snippet changed.

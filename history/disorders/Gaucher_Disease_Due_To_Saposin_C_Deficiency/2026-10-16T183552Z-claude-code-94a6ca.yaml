  summary: Bind the saposin C activator functional assay, not GCase (tranche D batch
    4)
  details: |
    LOINC tranche D batch 4 (enzyme activity and metabolite assays; activator/cofactor deficiencies). This entry's own diagnosis row states that glucocerebrosidase (beta-glucosidase, GBA1) activity is NORMAL in this disease (saposin C / PSAP deficiency), and that this normal-enzyme-with-Gaucher-phenotype picture is what prompts PSAP testing -- binding the classic-Gaucher Part code (LOINC:LP15604-9) would have asserted a deficiency this disease does not have. Searched the Monarch KG for 'beta glucosidase activator' and found a genuine functional-assay code for the activator protein itself: LOINC:LP20856-8 (Beta glucosidase activator), the specimen-generic Part code, with a specimen-specific interpretation code (LOINC:25830-1, in Fibroblast) also available if needed later. Bound LOINC:LP20856-8 via measurements on the existing 'Glucocerebrosidase assay with PSAP sequencing' diagnosis row. No reference_ranges band: the finding is binary (activator present/functional vs. absent), not a graded cut-off. Neither code requires a third-party copyright notice. No collision with LOINC:LP20856-8 on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, and tests/test_loinc_measurement_schema.py all pass.

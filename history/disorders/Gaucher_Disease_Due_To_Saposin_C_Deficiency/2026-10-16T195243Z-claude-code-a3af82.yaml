  details: |
    Review on PR #14561 identified the same error as the paired Tay-Sachs AB variant fix, traced to the batch's own dispatch: a LOINC code identifies the measurement performed, not its result. Replaced the activator Part code (LOINC:LP20856-8, Beta glucosidase activator) with LOINC:LP15604-9 (Glucosylceramidase), the same Part code used for glucocerebrosidase activity on classic Gaucher_Disease.yaml, because this row's own test is the glucocerebrosidase enzyme assay itself and the diagnostic finding is that the result comes back normal -- which the row's own markers field already states. Checked whether a biochemical saposin C activator functional assay is described anywhere in this entry's evidence before dropping the activator code: no source does, only PSAP gene-level biology and the sequencing-based confirmatory test in the second diagnosis row, so the activator code and its orphan cache row were removed rather than kept as a speculative second measurement. Rewrote notes to state only facts about the disease and its tests. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

  summary: Add saposin C C384S knock-in mouse model with a negative storage result
  details: |
    Curated mouse models from MGI genotype-phenotype annotations on the two MP branches that separate abnormal enzyme/coenzyme LEVEL (MP:0005319, under abnormal homeostasis) from abnormal enzyme/coenzyme ACTIVITY (MP:0005584, under abnormal metabolism). Candidates were selected from MGI_PhenoGenoMP.rpt joined to the MP descendant closures from OLS and to genes already present in dismech, prioritising genes annotated on BOTH branches. Each model was added as an animal_models entry with modeled_mechanisms links to existing pathophysiology nodes, per-link and per-readout evidence, and exact snippets verified against the local reference cache. The Psap<tm1Suz> C384S knock-in and its compound heterozygote over a null allele (PMID:20175216) isolate loss of the activator from loss of the hydrolase: glucocerebrosidase is present and intact, and only its in vivo activation is impaired. MGI annotates this genotype on both MP branches from the same paper (increased beta-galactosidase level, MP:0020261; abnormal enzyme/coenzyme activity, MP:0005584). The model carries a FAILS_TO_RECAPITULATE link to the glucosylceramide accumulation node, with the required limitations and evidence: substrate was assayed in brain and liver of both genotypes and was not raised, and hepatosplenomegaly never developed, so the model cannot support substrate-accumulation or substrate-reduction endpoints even though it remains informative for the activator defect. Validated with just validate and exact-substring snippet checks.

  summary: Add the deep-research artifact after the first provider timed out
  details: |
    Closes review item 1 on PR 9893. The openscientist run commissioned before the entry was written timed out at 3600s and was cancelled by the client, which is why no artifact existed - a different failure from having skipped the step, and one the original PR body understated. A claude_code run was commissioned during review and is committed here with its citations sidecar and the nine reference caches its own validation fetched, all on-topic for CPOX and porphyria. The report corroborated the entry and supplied no citable content it lacked, including on prevalence, where it independently describes fewer than ten reported cases worldwide. That null result is recorded in the entry notes rather than passed over, because a report that adds nothing is a different outcome from a report that was not read. The report's own term-validation section flags two wrong-concept identifiers it proposed - HP:0032263 named as Coproporphyrinuria but actually Increased blood pressure, and UBERON:0001155 named as liver but actually colon - and neither is used.

    Addressed review items 2, 3 and 4 on PR 9893 plus three suggestions. Item 2 was a real overstatement: the entry said the enzyme is not slow, while the same source it cites four times reports a Michaelis constant 15-20-fold above normal and a maximal velocity half of normal, and the entry itself annotated the activity DECREASED. The wording now says the deficit is unequal between the two cycles rather than absent. Item 3 was worse and more interesting: the 1983 paper explicitly ruled out a second-decarboxylation-specific active-site lesion on the basis of rat-liver experiments, which is the argument against this entry's central node, and the entry quoted only the parts of that paper that agreed with it. That sentence is now carried as a REFUTE-graded evidence item with an explanation of how the 2005 crystal structure resolves it, since a single shared active centre and a cycle-specific retention failure are compatible. Item 4 completed module conformance on all three conforms_to nodes against heme_biosynthesis_porphyria. Also added the absence of neurovisceral symptoms as the clinical discriminator from HCP, an erythrocyte-harderoporphyrin biochemical record, and the intron-6 splice allele. Snippets 28 to 33, all verified. A deep-research run is in progress for item 1 after the openscientist job timed out at 3600s.

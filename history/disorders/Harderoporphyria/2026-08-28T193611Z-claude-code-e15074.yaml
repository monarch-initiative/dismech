  details: |
    Closing an inconsistency I introduced in the previous commit. I regraded the two PMID:629747 items from MODEL_ORGANISM to IN_VITRO on the reviewer's suggestion, but left the PMID:6886003 REFUTE item at MODEL_ORGANISM even though it quotes the same class of rat-liver enzyme experiment. An earlier review round had warned about exactly this - it noted that PMID:629747 was graded consistently with the 1983 rat-liver items and that changing one would mean changing all of them - and I changed one. Cell-free rat-liver enzymology is IN_VITRO under the CLAUDE.md rule for biochemical assays outside an organism, so both are now IN_VITRO. The other nine PMID:6886003 items stay HUMAN_CLINICAL; they quote the human sibling study, which is what the paper mostly is, and splitting by sentence is what CLAUDE.md asks for when a paper mixes sources. Validation: schema, terms, 46 of 46 snippets, check-snippet-grading clean with no baseline change.

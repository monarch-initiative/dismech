  summary: Ground the Orphanet claim in ORDO classification level, not the xref
  details: |
    Review caught that the Orphanet external_assertion description asserted a hierarchy I had not checked. I wrote that Orphanet codes harderoporphyria as its own disorder rather than as a form of hereditary coproporphyria, but what I had actually verified was only that ORPHA:659672 is an equivalentTo cross-reference on MONDO:0030048. A distinct code does not establish a classification level, and MONDO itself gives this concept its own term while placing it under HCP, so the xref settles nothing about placement either way. This is the fourth instance in this PR of asserting more than the check supported. Checked it properly: in ORDO, Orphanet_659672 has asserted parents Disorder (ORDO:557493) and Disease (ORDO:377788), with Clinical entity (ORDO:C001) above them, and not Subtype of a disorder (ORDO:557494), which exists as the contrasting class. Hereditary coproporphyria is not among its parents or ancestors. So the claim is true, but for a different reason than the one I gave. The description now states the classification level and the parents that establish it, and says explicitly that the cross-reference alone would not have. Verified against the OLS ORDO API. Validation: schema, terms and 46 of 46 snippets pass.

  summary: Record ORPHA and OMIM as external_assertions, not prose
  details: |
    Correcting my own claim from the previous round. I said the schema had nowhere structural to put an ORPHA or OMIM identifier because DiseaseMappings carries only ICD-10CM, ICD-11F, MONDO and NCIT slots, and put both in notes with the gap filed upstream. That was wrong. external_assertions carries a required external_id plus source, assertion_type and url, and it is the established convention here - 121 ORPHA and 49 OMIM external_assertions already exist across kb/disorders. I had looked at DiseaseMappings, found what I expected to find missing, and stopped. Replaced the prose paragraph with two external_assertions records. The Orphanet one notes that Orphanet codes harderoporphyria as its own disorder rather than as a form of hereditary coproporphyria, which agrees with this entry and disagrees with MONDO - recorded as an external assertion rather than a mapping precisely because the resources disagree about the hierarchy. Validation: schema, terms and 46 of 46 snippets pass; duplicate-key and entity-ref checks clean.

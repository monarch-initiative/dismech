  summary: Consume the reference caches the deep-research run fetched, and correct
    the claim that it added nothing
  details: |
    Round-three review response on PR 9893. Finding A was that the entry's notes claimed the deep-research report supplied no citable content it lacked, and that claim was false - made without reading the nine reference caches the run fetched and this PR commits. Three contained needed content. PMID:629747 is the load-bearing one: it establishes in rat liver that both decarboxylations occur at one active centre which becomes temporarily inaccessible, and that the intermediate en route to protoporphyrinogen does not equilibrate with free harderoporphyrinogen. That is the normal physiology the entry's central claim presupposes and the direct answer to the 1983 objection the REFUTE item carries, which had been argued in prose alone. Added as two evidence items on the arrest node. The other two caches supplied murine Cpox models, now curated as an animal_models section with FAILS_TO_RECAPITULATE links and a HUMAN_MODEL_MISMATCH discussion: all three published murine alleles accumulate coproporphyrin and none accumulates harderoporphyrin, and their allele positions at 373 and 380 sit outside the D400-K404 retention region. That negative result is the entry's position-not-dose argument arriving from an independent direction. Finding B was that modifier ABSENT on GO:0004109 contradicted the node's own evidence of Vmax half normal; corrected to DECREASED, which also resolves the same term appearing in two states. Snippets 33 to 41, all verified. One pre-existing test failure in Primary_Bile_Acid_Malabsorption.yaml is from PR 9781 and untouched by this branch.

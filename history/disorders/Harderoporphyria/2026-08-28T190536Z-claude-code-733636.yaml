  summary: 'Review round 4: restate the murine negative as an unassayed analyte'
  details: |
    Blocking finding addressed. The entry argued that no Cpox mouse accumulates harderoporphyrin. Checking the methods of both phenotyped strains showed harderoporphyrin was never among the measured analytes - PMID:36967721 assayed uroporphyrin, coproporphyrin, protoporphyrin, porphobilinogen and delta-aminolevulinic acid; PMID:23631845 assayed coproporphyrin III alone; PMID:28600349 is abstract-only. The negative was an unmeasured analyte, not a reported null. Reworded the FAILS_TO_RECAPITULATE description and limitations on both models and the HUMAN_MODEL_MISMATCH rationale so the murine claim rests on allele position plus the coproporphyrin-dominant reported profile, and states plainly that the diagnostic species has never been assayed in a Cpox mouse. Added the mouse-380 to human-391 homology and the reported p.Arg391Trp 22 percent residual activity as two new evidence items, so the positional argument is anchored in a human allele at the homologous residue rather than in a measurement nobody took. Corrected the allele count - the Nakano strain is the same p.Arg380Leu locus, not a third allele - and added the unphenotyped M100835 splice strain. Added two proposed_experiments to the discussion: assaying harderoporphyrin in the existing strains, and a retention-region knock-in. Regraded the two Elder 1978 items from MODEL_ORGANISM to IN_VITRO since the work is cell-free rat-liver enzymology. Corrected the PMID:629747 reference_title to match the cache. Added evidence to the two terminal pathophysiology nodes. Recorded the ORPHA and OMIM equivalentTo identifiers in notes, verified against OLS, with the missing DiseaseMappings slots flagged. Removed a redundant DOI cache duplicating PMID:21103937. Validation: schema, terms and 46 of 46 snippets pass; all offline gates pass.

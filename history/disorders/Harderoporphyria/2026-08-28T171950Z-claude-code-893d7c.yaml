  summary: 'Create: Harderoporphyria'
  details: |
    De novo curation of harderoporphyria, MONDO:0030048, as a position-specific biallelic CPOX lesion in which the enzyme completes the first decarboxylation and fails to retain the intermediate for the second. Curated as its own disease rather than as a subtype of hereditary coproporphyria, against MONDO's placement; the reasoning is recorded as an INTERPRETATION discussion so a reviewer can disagree with the argument rather than with an implicit choice. Three nodes declare conforms_to against the heme_biosynthesis_porphyria module, and the notes flag that the accumulation node conforms structurally while differing in substance, since what accumulates here is a reaction intermediate rather than an upstream substrate. Eight references, all located through PubMed and fetched with just fetch-reference. The commissioned openscientist deep-research run had not returned when the entry was written, so nothing here depends on it. Validated: schema, terms, 28 of 28 reference snippets, all seven ungated offline gates, and 15058 conformance tests.

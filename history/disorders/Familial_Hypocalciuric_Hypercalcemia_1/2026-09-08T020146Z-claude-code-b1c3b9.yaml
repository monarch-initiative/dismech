  summary: Address review round 2 on FHH1
  details: |
    Round 2 returned CHANGES_REQUESTED with two findings, both in the evidence
    layer. Both were verified against the caches before being acted on, and both
    were correct.

    Finding 1, truncated quote. Three items carried the same PMID:35566721
    snippet, cut off exactly where the source's list begins - so as quoted it
    established that some FHH1 patients are symptomatic and named none of the
    symptoms. For Chondrocalcinosis and Pancreatitis that was the sole citation,
    so each phenotype's only evidence did not mention the phenotype. Extended
    through the parenthetical to '...and nephrolithiasis)', stopping before the
    bracketed citation. The source's own irregularities are reproduced rather than
    tidied: 'polyuria- polydipsia' with the hyphen and space, and the duplicated
    'acute pancreatitis, chondrocalcinosis' after both were already listed. That
    is the same discipline that preserved this entry's 'Familiar' typo, and it is
    what makes the quote checkable. check_folded_hyphens re-run afterwards, since
    'polyuria- polydipsia' is exactly the shape that gate watches; clean. The
    three explanations were rewritten too - each had been pointing at words the
    quote did not contain, which is what an explanation must never do.

    Finding 2, off-organ evidence on the renal negative. 'Absence of
    Nephrolithiasis and Nephrocalcinosis' had one SUPPORT item, PMID:19250271's
    bone-density result, which says nothing about the kidney. It is the correct
    evidence for 'Preserved Bone Mineral Density Despite Chronic PTH Elevation',
    where the identical snippet already sits; reused here it argued by analogy
    across organ systems.

    Rather than take the reviewer's fallback of a general asymptomatic-ness quote,
    a renal-specific source was fetched: PMID:21986511 (Christensen et al. 2011),
    from the same Aarhus group whose CCCR study this entry already cites. Two
    items now carry the claim - 'typically normal renal function' in explicit
    contrast with PHPT, and the low urine calcium excretion that is the mechanism
    behind the low stone burden. The bone item was removed rather than regraded to
    NO_EVIDENCE: it is already correctly placed on the bone node, and a duplicate
    placeholder would add noise without adding a claim.

    Searched and not found: no committed cache, and nothing surfaced by six PubMed
    searches, reports a renal complication rate in FHH1 specifically. The claim is
    therefore supported at the level the literature actually states it - normal
    renal function and a low filtered calcium load - rather than as a stone-rate
    comparison nobody has published.

    Not taken into this PR. PMID:42640938 (UK Biobank genotype-first PheWAS, 162
    FHH1 carriers) reports that pancreatitis- and diabetes-related outcomes did
    not reach multiple-testing-corrected significance. That is a strong
    population-scale negative bearing on this entry's contested pancreatitis
    attribution and on its KNOWLEDGE_GAP discussion about the DiscovEHR burden
    signal, but adding it is new curation rather than a review fix, so it is
    recorded here as a follow-up lead.

    Validation. Schema, terms and references pass. Snippets 43/43 verified, up
    from 42/42, under both the fast audit and the batched --no-full-text
    validator. check_enum_values, check_duplicate_yaml_keys, check_entity_refs,
    check_causal_targets, check_qualifier_terms, check_snippet_length,
    check_snippet_grading, check_title_snippets, check_reference_titles,
    check_folded_hyphens and check_empty_snippets all pass with no new baseline
    entries. One new reference cache file, PMID_21986511.md; no cache CSV changes.

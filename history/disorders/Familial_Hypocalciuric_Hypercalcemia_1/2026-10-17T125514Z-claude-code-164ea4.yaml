  details: |
    LOINC Diagnostics tranche G, batch 26 (functional and provocative tests with diagnostic thresholds). Two sources were used and each answered a different question. Observation and panel codes were enumerated against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin; that export contains no LP or LG Part rows at all, so every Part question was put separately to the Monarch KG, and each KG query was paginated to its stated total rather than read off a first page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 549 snippets and 605 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:24346-9 (Parathyrin.intact and Calcium panel) to the paired serum calcium and intact PTH row, which is the entry point this entry describes; the panel codes the pairing, and the mid-molecule counterpart LOINC:24347-7 was declined because the row specifies intact PTH. The calcium/creatinine clearance ratio rows are deliberately left unbound, on both the diagnosis and the biochemical side, and this is the finding worth keeping. CCCR is dimensionless and computed from four results, urine and serum calcium and urine and serum creatinine, whereas all seven Calcium/Creatinine codes in LOINC 2.83 are concentration ratios within a urine specimen alone, reported in mg per gram or mmol per mol creatinine. Binding one would put a four-term clearance ratio onto a two-term urinary ratio while validating cleanly. No clearance ratio code exists for this or any analyte pair: nothing in the export matches calcium with creatinine and clearance and nothing carries the phrase clearance ratio, and the Monarch KG returns nothing for the former and six non-Part records for the latter. Because there is no code of either kind, there is nothing to key a band to either, which is the one case in this batch where the band convention would have worked: both cited cut-offs, below 0.0115 and below 0.020, are strict upper bounds that an exclusive upper bound states exactly.

  summary: 'Create: Familial Hypocalciuric Hypercalcemia 1'
  details: |
    Created kb/disorders/Familial_Hypocalciuric_Hypercalcemia_1.yaml (MONDO:0007791) from the curation stub, resolving entry_type to DISEASE. The lump/split call was made from the stub's MONDO context: no descendants are recorded under this term, and FHH2 (GNA11) / FHH3 (AP2S1) are sibling terms with different genes rather than children, so the term denotes the CASR-specific entity rather than a grouping over the FHH types. Neonatal severe hyperparathyroidism is carried as a has_subtypes entry because it is the same receptor at a higher mutational dose; it had no separate entry in the KB.

    The existing Autosomal_Dominant_Hypocalcemia_1 entry (MONDO:0011013, CASR gain of function) was used as the structural template, so the two pathographs are deliberately parallel: a shared set-point node with parathyroid and renal limbs, with every modifier direction reversed. Two negative findings are curated as pathophysiology nodes rather than left implicit, because in this disease the absences carry the mechanism: preserved bone mineral density despite chronically raised PTH, and the near-absence of stones and nephrocalcinosis despite chronic hypercalcaemia, both consequences of the renal limb and both points of differentiation from primary hyperparathyroidism.

    Deliberately not claimed: the pancreatitis association is recorded as RARE with its attribution flagged as contested; the cardiovascular/neurological rare-variant burden signal from the DiscovEHR study is held in a KNOWLEDGE_GAP discussion rather than in the pathograph, because the study design cannot separate a mechanistic consequence from ascertainment in a healthcare-derived cohort.

    Validation: linkml-validate against Disease passed; 30/30 evidence snippets verified against cached references; linkml-term-validator passed with labels; check_duplicate_yaml_keys, check_enum_values, check_entity_refs, check_causal_targets and check_qualifier_terms all passed. One snippet was trimmed to avoid a bracketed OMIM identifier that the reference validator strips before matching; the shared literal_bracket_patterns config was deliberately left alone.

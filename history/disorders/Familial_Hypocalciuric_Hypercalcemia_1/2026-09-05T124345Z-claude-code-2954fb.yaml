  summary: Add parathyroid localization imaging to diagnosis
  details: |
    Added a fourth diagnosis entry, Parathyroid Localization Imaging, recording what imaging does not do rather than what it does. The entry previously listed paired calcium/PTH, the calcium/creatinine clearance ratio and CASR sequencing, all of which bear on the FHH1-versus-primary-hyperparathyroidism differential the whole record turns on; imaging was absent, yet a positive localization study is one of the routes by which an FHH1 patient actually reaches an operation that cannot work.

    Grounded in PMID:39810898, a case in which scintigraphy showed focal uptake above the left thyroid lobe, that finding together with a mildly raised PTH settled a diagnosis of primary hyperparathyroidism, and the patient remained hypercalcaemic months after total parathyroidectomy. Two secondary traps from the same case are recorded: the uptake lay where a thyroid nodule would also lie, and the resected glands showed four-gland mild hyperplasia, which is a feature of FHH1 rather than evidence against it, so the operative histology did not correct the error either. PMID:35566721 supplies the contrasting hierarchy, that the differential rests on molecular genetic findings.

    Scope note. This began as a question about whether the thyroid-parathyroid relationship belonged in the entry. It does not: the association is anatomical and embryological rather than mechanistic, post-thyroidectomy hypoparathyroidism is a different disease, CaSR expression on thyroid C cells has no established FHH1 phenotype, and reported co-occurrence with Hashimoto thyroiditis is the same over-claiming the entry already declines for pancreatitis. The thyroid appears here only as the anatomical site of a false-positive scan.

    Validation: schema, terms and references all pass; snippets 35/35 verified, up from 30/30. check_duplicate_yaml_keys, check_enum_values, check_entity_refs, check_causal_targets and check_qualifier_terms pass. NCIT:C16502 was already present in the treatment-action enum cache, so no cache CSV changed; one reference cache file added. The bound label was corrected from a drafted 'Diagnostic Imaging' to the canonical 'Diagnostic Imaging Testing' before validation. A first draft of the description asserted that nothing about imaging appearance separates FHH1 from primary hyperparathyroidism; that is a universal negative the cited sources do not establish, so it was narrowed to the claim they do support, that a positive study does not exclude FHH1.

  summary: 'Create: Spinocerebellar Ataxia Type 31'
  details: |
    De novo curation of SCA31 (MONDO:0007296) as a DISEASE entry. Deep research: falcon (Edison Scientific), research/Spinocerebellar_Ataxia_Type_31-deep-research-falcon.md; frontmatter reported reference_validation 3/3 verified, confabulation_rate 0.0, and term_validation 38/39 with one obsolete GO term (GO:0051603) that was not used. just preflight-dr returned WARN because TK2 is mentioned 18 times against BEAN1's 19; that is correct biology for SCA31 rather than named-entity confusion, since the causal repeat lies in an intron shared by the two oppositely transcribed genes, so the report was used. The falcon report cited only three resolvable references (all DOIs), so the bulk of the entry was built from primary literature located via PubMed E-utilities. No GeneReviews chapter exists for SCA31 (esearch for 'spinocerebellar ataxia 31 GeneReviews[All Fields]' returned zero hits), so no GeneReviews baseline was available. Eleven references were fetched and cached with just fetch-reference. Pathophysiology is a seven-node causal chain from the BEAN1/TK2 intronic (TGGAA)n insertion through bidirectional transcription to a branch point: nuclear (UGGAA)n RNA foci with RNA-binding/splicing-factor engagement on one arm, repeat-associated poly-WNGME pentapeptide translation on the other, converging on Purkinje cell degeneration, cerebellar cortical atrophy and progressive ataxia. Three nodes declare conforms_to against cerebellar_purkinje_degeneration; conformance to that module's calcium-and-proteostasis node is deliberately not claimed because no calcium-handling measurement exists in SCA31. Twelve phenotypes bound to HP terms, most with pooled frequencies from the 374-patient literature review (PMID:36563608). Two genetic entries: BEAN1 CAUSATIVE and TK2 MODIFIER, the latter with an explicit note separating this locus relationship from recessive TK2 deficiency. One Drosophila animal model with two modeled_mechanisms links and readouts. Two discussions: a KNOWLEDGE_GAP on apportioning RNA versus PPR toxicity, and a HUMAN_MODEL_MISMATCH on the fly model's overexpression regime and absence of a cerebellum. Validation: just validate passed; just validate-disorders passed with 88/88 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles all passed. All snippets are PMID-keyed, so none were skipped by prefix.

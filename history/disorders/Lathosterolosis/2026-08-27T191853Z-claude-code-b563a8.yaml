  details: |
    Curated lathosterolosis (MONDO:0011816, SC5D) from a claude_code deep-research report. Eight pathophysiology nodes in one connected component. The entry's central structure is that the enzymatic block produces two biochemical consequences with different downstream arms, modeled as two hypothesis groups: cholesterol deficiency drives the malformation arm via impaired hedgehog signalling (CANONICAL, supported by the Sc5d-null mouse attributing the defects to decreased cholesterol rather than increased lathosterol), while lathosterol accumulation drives the lysosomal storage and hepatic arms (ALTERNATIVE). Simvastatin is curated with conflicting evidence deliberately retained - one report of biochemical and histological improvement graded SUPPORT, and a second patient's absence of perceived benefit graded REFUTE - plus a KNOWLEDGE_GAP discussion noting the two endpoints are not the same and so are not strictly contradictory. Prevalence is CASES_IN_LITERATURE, not a rate. Correction: the report offered CHEBI:16833 for lathosterol, which is neurosporene, a carotenoid; the correct term is CHEBI:17168. A title mismatch was also caught and fixed - PMID:33204591 had been given the title belonging to PMID:31259789. Validation: 23/23 snippets verified plus an independent raw-substring re-check at 23/23; schema, terms, entity-refs and duplicate-keys pass.

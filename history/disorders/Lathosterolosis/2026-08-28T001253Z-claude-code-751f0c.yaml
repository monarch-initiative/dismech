  details: |
    Review-response pass on PR 9756, plus a rebase onto current main. Four blocking items closed. The GeneReviews GENETIC COUNSELING section was unmined; the inheritance block cited only a sentence establishing autosomal recessive inheritance, which gives the mode but not the transmission risk, so the GeneReviews 25/50/25 recurrence figures are now cited there. Avoidance of hepatotoxic medications and chemicals was absent entirely, which was the most consequential gap: the hepatic arm is this disease's dominant morbidity driver, it is the arm liver transplantation addresses, and the entry's only pharmacotherapy is a statin, so an entry that models the hepatic arm carefully while omitting the one instruction about protecting it had a real hole. Added as a treatment with MODULATES on Progressive Liver Disease. Hypotonia was missing although the supporting quote was already in the file, sitting inside the facial-dysmorphism evidence item; it is now its own phenotype bound to HP:0001252 citing that same verified snippet. The generic HP:0000271 Abnormality of the face was replaced by seven specific features that both cited sources enumerate: HP:0000218 high palate, HP:0000463 anteverted nares and HP:0000343 long philtrum, each carrying both the mild-case snippet and the GeneReviews enumeration, plus HP:0000508 ptosis, HP:0000494 downslanted palpebral fissures, HP:0000286 epicanthus and HP:0000347 micrognathia from the GeneReviews list. A near-root HPO term was doing very little work when a specific list sat in an abstract the entry had already cached. The branch was also rebased onto current main, because main merged three environmental-evidence PRs that shrank the check_environmental_evidence baseline from 37 entries to 11, which fails any branch predating them with findings in files it never touched. Validation: schema and terms pass, 40/40 snippets verified and 40/40 on the raw-substring re-check, entity-refs and duplicate-keys pass, all thirteen sections present, 48/48 reference titles match cache frontmatter, declared and cited reference sets agree.

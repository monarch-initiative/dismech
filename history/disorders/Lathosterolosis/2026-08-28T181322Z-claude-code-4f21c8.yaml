  details: |
    Clears the four Lathosterolosis items deferred from PR #9756 review and tracked in issue #9787.

    genetic: added the Q72* nonsense allele. PMID:33204591 was already cited five times in the entry but its variant sentence was not mined. Q72* is the one reported allele that cannot encode a functional enzyme, carried in trans with the missense N71I by the patient whose FibroScan read 15.6 kPa. It anchors the severe end of the residual-activity argument that D210E already anchored at the mild end.

    biochemical: added plasma total cholesterol, presence Normal. The entry frames the disease as one enzymatic step upstream of SLOS and attributes the malformation arm to a cholesterol shortfall, which invites the reading that plasma cholesterol should be low. It is not, and the same sterol profile shows normal 7-dehydrocholesterol, which is the biochemical discriminator from SLOS. The cholesterol claim in the pathophysiology is a developmental and cellular one, not a plasma one, and the entry now says so where a reader would look.

    phenotypes: added Global Developmental Delay (HP:0001263, FREQUENT, with the 'in all surviving patients' count behind the band) and Genitourinary Anomalies (HP:0000119, no frequency). The Congenital Malformation Pattern node already named the urogenital system with no phenotype behind it. The GeneReviews genitourinary sentence is a management instruction rather than a clinical-characteristics one, so it is graded PARTIAL and paired with the PMID:17853487 malformation-pattern quote that names urogenital systems directly.

    treatments: added the GeneReviews Surveillance Schedule. Deliberately carries no target_mechanisms: surveillance detects the arms of the disease rather than acting on them, and every available treatment_effect value asserts a causal action on its target. Bound to NCIT:C15747 with therapeutic_modality OTHER, matching the dominant house pattern for surveillance entries across kb/disorders.

    discussions: added lath_mouse_lethality_mismatch, kind HUMAN_MODEL_MISMATCH. The analysis was already written in the Sc5d-null model's limitations field, where nothing surfaces it as an open translational question. Homozygous nulls are stillborn, so the model is informative for the malformation arm and silent on the hepatic and ophthalmologic course that dominates the human disease. Carries a proposed hypomorphic allelic-series experiment with would_support/would_refute.

    Review follow-up (PR #9899). Three changes after the ai4c-reviewer round.

    The blocking one: the proposed experiment put prose in would_support and
    would_refute. Those slots take only <kind>#<name> entity references - the slot
    descriptions say so explicitly, and supporting_outcome / refuting_outcome exist for
    the prose. The prose is unchanged, just moved; would_support now names
    pathophysiology#Progressive Liver Disease and
    mechanistic_hypotheses#lath_accumulation_drives_storage, and would_refute names the
    hypothesis alone, since the experiment is designed to discriminate on it. This was
    also the CI failure: just check-entity-refs is an ungated whole-KB step and none of
    the three commands recorded above catches it. Adding it to the pre-PR routine.

    The surveillance snippet dropped the registered-trademark mark the cache carries on
    FibroScan(R). It validated either way, which means the matcher normalizes it, but an
    exact quote should be exact.

    Added a FAILS_TO_RECAPITULATE link from the Sc5d-null mouse to Progressive Liver
    Disease, on the reviewer's suggestion, so the mismatch is machine-visible on the
    model rather than only readable in the new discussion. Carries the required
    limitations and evidence: the abstract's statement that homozygous nulls were
    stillborn is the substantive basis, and the limitation records the honest ambiguity
    - a complete null is a more severe lesion than any patient carries, so the lethality
    may be the mouse reproducing something true rather than failing.

    Also trimmed a sentence of curation rationale out of that link's description
    ("Recorded as an explicit negative so the silence is machine-visible..."). description
    renders on the disorder page as a statement about the disease; reasoning about the
    modeling belongs here. The same reviewer raised this pattern on three sibling PRs in
    this round, so it is a habit rather than a slip.

    Two snippets (the variant sentence and the sterol profile) are drawn from the PMC full text rather than the abstract. references_cache/PMID_33204591.md is committed with content_type full_text_xml, and both were confirmed against the --no-full-text path CI actually runs.

    Validation: just validate passed (schema, terms, references). just validate-disorders kb/disorders/Lathosterolosis.yaml passed, exit 0, Snippets checked: 47/47 verified against cached references. The unicode in the sterol quote (U+2010 hyphens) was lifted programmatically from the cache rather than retyped.

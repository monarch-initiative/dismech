  details: |
    Applied the findings of the REQUEST_CHANGES review on the sibling PR 9755 to this entry proactively. Two substantive gaps. (1) reference_title was absent from all 23 evidence items; backfilled with scripts/backfill_reference_titles.py. (2) A dedicated GeneReviews chapter for lathosterolosis exists (PMID:38060690) and the first version of this entry missed it entirely - the deep-research report cited the bookshelf ID NBK597809 but no PMID, and I did not search for one. It is now tagged and mined across all four sections, supplying: a diagnosis: section with the plasma-sterol-or-molecular criterion; liver transplantation as a second targeted therapy with MODULATES on the hepatic arm; postaxial polydactyly, toe syndactyly and cirrhosis as phenotypes; and the statement that simvastatin's safety and efficacy are unproven in this disease. That last one materially improves the lath_statin_benefit_conflict discussion: GeneReviews does not adjudicate between the two conflicting case reports but states the field's position and still recommends plasma sterol monitoring before and during therapy, which is the practical shape of the uncertainty. Stub deleted. Validation: 28/28 snippets verified plus raw-substring re-check at 28/28; no declared-uncited or cited-undeclared references; schema, terms, entity-refs, duplicate-keys and reference titles all pass.

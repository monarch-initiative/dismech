  summary: 'Gene-family review: SC5D'
  details: |
    The desaturase node bound GO:0000248 'C-5 sterol desaturase activity', whose GO definition is a yeast ergosterol-pathway reaction on ergostatrienol; replaced it with GO:0050046 delta7-sterol 5(6)-desaturase activity (EC 1.14.19.20, lathosterol 5-desaturase), the human reaction the node describes and that patient fibroblasts fail to perform (PMID:12189593). The node did not carry SC5D; attached the gene. The SC5D genetic record gave no variant origin; recorded germline and added the autosomal recessive inheritance block.

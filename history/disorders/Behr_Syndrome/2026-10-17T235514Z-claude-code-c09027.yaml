  details: |
    Review round 1. The split CSF marker had kept biomarker_term HP:0002151 Increased circulating lactate concentration, which is a blood phenotype, so it paired a CSF LOINC code with a blood HPO term; it now binds HP:0002490 Increased CSF lactate, the term the COXPD13 and COXPD4 entries use for the same finding, and the marker name no longer says Circulating. The companion marker's own snippet and notes report the elevation in plasma, so its LOINC code moved from 32693-4 Lactate [Moles/volume] in Blood to 2524-7 Lactate [Moles/volume] in Serum or Plasma and its name suffix from (Blood) to (Plasma). The CSF marker's note no longer calls the measurement circulating lactate. Labels copied from cache/hp/terms.csv and cache/loinc/terms.csv; both codes were already cached. No snippet, grading or evidence item changed, and no entity reference names either marker.

  summary: Address Behr review evidence grading and gene-function grounding
  details: |
    Addressed the independent review on PR #13242 and the gene-activity CI failure. Normal lactate during the fatal decompensation and absent intellectual disability in the Lee2016 child are now REFUTE evidence against universal elevation/impairment, paired with the positive evidence and preserved clinical qualifications.

    Restored the normal OPA1 GTPase molecular-function binding without a decreased-activity modifier. PMID:18158317 supplies an explicitly BACKGROUND, INDIRECT statement identifying the protein as a dynamin-related GTPase; this does not restore the unsupported claim that every biallelic genotype has reduced catalytic activity. Included the generated Sundew NCT06461286 cache so registry evidence is available to offline reviewers.

    Corrected supportive care to OTHER, retained low-vision specificity in preferred_term, and mapped combined physical/occupational/speech therapy to Rehabilitation. Bound arginine and the four documented maintenance antiseizure drugs as therapeutic agents without claiming isolated efficacy. Added OPA1 as the target gene of investigational antisense expression modulation; the oligonucleotide mechanism remains unspecified. Checked the suggested GO:0000002 live local GO database: it is obsolete mitochondrial genome maintenance, so retained the valid GO:0032042 mitochondrial DNA metabolic process binding rather than adopting an obsolete term.

    The scientific scope, patient-overlap caveats, negative case treatment results and extrapolation limits remain as assessed in the preceding REVIEW event.

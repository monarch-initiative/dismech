  summary: 'Create: Behr Syndrome'
  details: |
    Created de-novo Behr Syndrome (MONDO:0008858) entry, curated as the severe autosomal-recessive end of the OPA1-related optic atrophy spectrum (biallelic/compound-heterozygous OPA1). Deep research provider: OpenScientist. Pathophysiology modeled as a 4-node chain: biallelic OPA1 loss of function and impaired mitochondrial fusion, then bioenergetic OXPHOS failure, then retinal ganglion cell degeneration (optic atrophy) plus central/peripheral neurodegeneration (cerebellar ataxia, pyramidal spasticity, axonal neuropathy). Ten HP-termed phenotypes plus genetics and NCIT-coded supportive treatments (no MAXO used, per curator instruction). All 25 evidence snippets verified as exact substrings of cached PubMed abstracts; key PMIDs 25012220, 28442211, 27150940, 38369985, 33340656, 18158317. No active GeneReviews chapter exists for Behr syndrome. Validated with just validate (schema, terms, references clean); compliance 85.7 percent (weighted 86.5).

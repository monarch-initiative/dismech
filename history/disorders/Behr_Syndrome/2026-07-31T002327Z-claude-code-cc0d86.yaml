  details: |
    Addressed all 7 IMPORTANT findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #7195. Split the bundled 'Mitochondrial Fusion and Cristae Disruption with Bioenergetic Failure' node into three atomic nodes (fusion/cristae, mtDNA instability, OXPHOS failure) following the Autosomal_Dominant_Optic_Atrophy_Plus precedent; split 'Central and Peripheral Neurodegeneration' into cerebellar, corticospinal, and peripheral sensory/dorsal-column nodes with conforms_to links to cerebellar_purkinje_degeneration and peripheral_axonal_degeneration. Added downstream edges from tissue nodes to phenotypes, taking phenotype connectivity from 0/8 to 8/8. Added biochemical (lactate), histopathology (COX-deficient fibers), and diagnosis (molecular testing) sections built from already-cached quotable text in PMID:28442211 and PMID:26187298. Added a top-level references block citing the two previously orphaned cache files (PMID:25012220, PMID:21112924). Sourced two new references (PMID:35741767, PMID:30972688) to evidence the previously bare Nystagmus and Dysarthria phenotypes; dropped the Impaired Vibration Sensation phenotype as no quotable source exists in any cached abstract. Removed the unevidenced MECR mention from the description. Added a disease-level note recording the OPA1-anchored-mechanism vs pan-locus-genetics asymmetry and the heterozygous-Behr nosological debate. All 26 snippets independently verified as exact substrings of cached abstracts.

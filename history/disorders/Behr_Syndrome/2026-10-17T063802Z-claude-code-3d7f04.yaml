  summary: 'Bind LOINC: specimen-specific blood and CSF lactate'
  details: |
    Split the combined 'Increased Circulating Lactate in a Severe Biallelic Presentation' biochemical marker into two specimen-specific markers, Blood (loinc_term LOINC:32693-4, Lactate [Moles/volume] in Blood) and CSF (loinc_term LOINC:2520-5, Lactate [Moles/volume] in Cerebral spinal fluid), since a single loinc_term slot cannot carry both specimens. Bound because PMID:28494813 reports this specific OPA1 patient's own plasma and CSF lactate elevation at an earlier assessment (the quote already cited in the entry), not a generic mitochondrial-disease statement; the entry's existing caveat that the patient's coexisting MT-ND4/MT-ND1 variants limit attribution to OPA1 alone was preserved on both split markers. The pre-existing REFUTE evidence item (normal lactate/pyruvate during later deterioration) was kept on the Blood marker only, since that reading did not specify a CSF measurement. LOINC:2520-5 was newly seeded via just loinc-seed-cache; LOINC:32693-4 was already cached. just validate-disorders passed with 0 issues.

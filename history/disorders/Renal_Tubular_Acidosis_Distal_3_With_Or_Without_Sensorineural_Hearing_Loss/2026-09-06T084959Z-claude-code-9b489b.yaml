  details: |
    De novo curation of the ATP6V0A4 (a4 subunit) form of autosomal recessive distal renal tubular acidosis, filling the gap between the already-curated dRTA-2 (ATP6V1B1) and dRTA-4 (SLC4A1) entries. One openscientist deep-research run was performed (research/Renal_Tubular_Acidosis_Distal_3_With_Or_Without_Sensorineural_Hearing_Loss-deep-research-openscientist.md; 25/25 references verified, confabulation_rate 0.0, 5 of 7 quotes valid, 18 of 25 on topic). The entry was written from primary literature read directly rather than from the report, and the report is committed as a curation input. The pathograph is deliberately two-armed: the renal and cochlear consequences both hang off the single failed proton-secretion step rather than one being downstream of the other, which is the reason alkali therapy corrects the acidosis and does not act on hearing. The variable auditory onset is curated as a KNOWLEDGE_GAP with three competing explanations and no study discriminating between them, citing two series that point in opposite directions. The Atp6v0a4 null mouse is linked to three nodes at different fidelities, and its failure to reproduce hypercalciuria is recorded as a HUMAN_MODEL_MISMATCH so the model is not read as uniformly faithful. A 2025 gain-of-function ATP6V0A4 alkalosis report is cited on the trigger node only, as a boundary establishing that this entry is the loss-of-function phenotype. One node (Impaired Net Acid Excretion) is deliberately left unbound: no GO term names renal net acid excretion. Validated: schema, terms, 33/33 snippets, entity refs, causal targets. Tooling gap found: just ictrp-fetch rejects every form of the EudraCT identifier for the ADV7103 trials, so no clinical_trials record is asserted.

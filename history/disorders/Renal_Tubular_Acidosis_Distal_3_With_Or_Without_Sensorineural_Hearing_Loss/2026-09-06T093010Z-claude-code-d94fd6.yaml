  summary: 'Review round 1: GeneReviews baseline, renal outcome arm, ear-directed
    treatment, modifier locus'
  details: |
    Answers the ai4c-reviewer CHANGES_REQUESTED review in one push, plus a real CI failure. CI first: check-snippet-length failed on a three-word readout snippet, 'absent endocochlear potential'. That was my process error, not a tooling gap - I ran the whole-KB offline gates in the aip and pcd worktrees and never in this one, and the local recipe uses the same --against-ref origin/main that CI does, so it would have caught it. Replaced with the full sentence. Critical finding: GeneReviews PMID:31600044 was cached in the repo, tagged and mined ten times by the sibling dRTA-2 entry, and cited nowhere here. Added a references block tagging it GeneReviews and mined it across all four domains. Content findings: added a Progressive Nephron Loss pathophysiology node so the renal arm no longer terminates at nephrocalcinosis, with Chronic kidney disease, Nephrolithiasis and Rickets phenotypes; added Hearing Amplification and Cochlear Implantation as a DEVICE treatment, which the entry's own two-armed argument made conspicuous by its absence; added Avoidance of Potassium-Sparing Diuretics; added recurrence-risk and prenatal-testing evidence to inheritance; added a renal and growth surveillance diagnosis record and the annual audiometry interval. Correctness finding, the one that mattered most: the hearing-onset KNOWLEDGE_GAP asserted that three candidate explanations exhausted the field and that no study discriminated between them. PMID:28934385 maps a Chr 13 modifier locus accounting for about 20 percent of hearing-threshold variance and shows the same mutation gives deafness on an MRL background and normal hearing on C57BL/6. The rationale now names four candidates and says genetic background is the best evidenced. Both evidence items are graded directness INDIRECT because the mapping was done in Atp6v1b1 mice and this entry is ATP6V0A4 - the reviewer suggested the addition without that caveat, and transferring a modifier result between V-ATPase subunits is an inference. Also: prevalence_class BELOW_1_IN_1000000 to ULTRA_RARE, since the record's own notes disclaim a numeric magnitude; connected the previously orphaned Enlarged vestibular aqueduct node into the pathograph with INDIRECT_UNKNOWN_INTERMEDIATES; recorded that the ICTRP trial status is stale relative to the publications and that the registry's target of 24 does not reconcile with the published 30. A second self-caught error: I wrote reference_title for PMID:30773598 from memory as 'Distal renal tubular acidosis: a systematic approach from diagnosis to treatment' and the reference validator rejected it against the cached title, 'Treatment and long-term outcome in primary distal renal tubular acidosis'. Corrected in all four places. Two frequency figures (CKD 35/82 percent, nephrolithiasis 21 percent) come from a mixed-genotype 340-patient cohort and each explanation says so. Validated: schema, terms, 49/49 snippets, entity refs, causal targets, snippet-length, title-snippets.

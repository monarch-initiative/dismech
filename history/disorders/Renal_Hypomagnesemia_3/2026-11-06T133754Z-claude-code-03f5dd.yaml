  summary: 'Create: Renal_Hypomagnesemia_3'
  details: |
    New entry for renal hypomagnesemia 3 (MONDO:0009550; CLDN16-related FHHNC), curated from the stub. Deep research: one Perplexity report (research/Renal_Hypomagnesemia_3-deep-research-perplexity.md); all 7 resolvable references verified, but needs_review is set because of two mislabelled CURIEs (UBERON:0001285, CL:0000563), and preflight-dr warned that the report's HGNC:20360 beside CLDN16 is LRFN5. No CURIE was copied from the report; CLDN16 is bound to hgnc:2037 from HGNC/ClinGen. Evidence comes mainly from primary sources found beside the report: Simon 1999, Weber 2001, Konrad 2008, the Polish CLDN16 cohort (PMID:25477417), Hou 2007/2008, the Cldn16 knockout mouse (PMID:20147368), Bardet 2016 on amelogenesis imperfecta, and the 2016 review PMID:26613020. ClinGen Definitive AR tier copied from the CGGV record. No GeneReviews chapter (check-genereviews --online NO_CHAPTER). Kept the numbered-series name because FHHNC also covers the CLDN19 form. Validated with just validate, validate-terms, count-verified-snippets (66/66) and validate-disorders.

  summary: 'Address round-3 re-review on PR #7521 (frequency bands, Sunitinib, evidence
    coverage)'
  details: |
    Round-3 response to the ai4c-reviewer re-review of PR #7521, which confirmed no regressions and left two blockers plus three carried-over suggestions. All five are now closed.

    Blocker 1 - unevidenced frequency bands. Headache and Palpitations both asserted VERY_FREQUENT with no evidence, and the reviewer correctly pointed out that PMID_39735644 Table 1 - the same cache used to band six phenotypes in round 2 - actually reports 59% and 50%, i.e. FREQUENT. Both bands were corrected downward to FREQUENT and given the quantitative row as evidence, with the reason recorded in each description. Diaphoresis kept its (correct) FREQUENT band and gained the missing evidence row. Hypertension kept VERY_FREQUENT and gained the 92% row, which confirms rather than changes it. There are now zero phenotypes in the file carrying a frequency band without evidence for that band.

    Blocker 2 - Sunitinib. Was the only treatment in the file with no evidence, and its description ("Used in clinical practice despite limited prospective data") had been overtaken by FIRSTMAPP. Rewritten around the randomized placebo-controlled phase 2 result (12-month PFS 36% vs 19% placebo) with two evidence items, plus a second target_mechanisms edge to Kinase Signaling Activation reflecting that sunitinib also inhibits RET - flagged in the edge description as a target-profile inference rather than a genotype-stratified trial result. The FIRSTMAPP and target-profile snippets both reproduce PDF-extraction artifacts from the cache verbatim ("23 -50%", "11 -31%", "c- kit"); the c-kit snippet is held on a single quoted line rather than a folded scalar because check_folded_hyphens.py rejects a folded line ending in a hyphen, and the reason is noted in the evidence explanation.

    Suggestion - Surgical Resection had no target_mechanisms. Added two edges (Chromaffin Cell Tumorigenesis, Catecholamine Hypersecretion). It is the only curative intervention and the only one acting on the tumor rather than a downstream consequence, so leaving it unjoined was a real gap. Genetic Testing and Lifelong Surveillance remain deliberately unjoined, which the reviewer agreed is correct for counselling and screening actions.

    Suggestion - orphaned references_cache/PMID_16317055.md. Resolved by citing it rather than deleting it: the Benn et al. International SDH Consortium paper is the source for penetrance being both age-dependent and gene-specific, which is the justification for recording penetrance per-locus on the subtype inheritance blocks instead of as one disease-level number. Verified by script that this branch now adds no orphaned cache files at all.

    Suggestion - pathophysiology nodes without evidence. All four are now evidenced, not just the one the reviewer prioritized. Angiogenic and Glycolytic Tumor Program (the tumor_angiogenesis conformance point and target of three treatments) got the pseudohypoxia-to-VEGF-to-angiogenesis quote; the Noradrenergic/Dopaminergic and Adrenergic secretory nodes got the Cluster 1 vs Cluster 2 biochemical-phenotype and PNMT-mechanism quotes plus the 2/3-of-parasympathetic-PGLs-are-nonsecretory figure that underpins the "a normal metanephrine panel cannot exclude head-and-neck disease" claim; Chromaffin Cell Tumorigenesis got its cell-of-origin and genotype-predicts-site quotes. No pathophysiology node and no treatment in the file now lacks evidence.

    A YAML indentation bug introduced while scripting the frequency-band edits (reference_title indented to 2 spaces instead of 4 in three places) was caught by the repo pre-edit validation hook before it could be committed, and repaired.

    Validation: just validate passes (schema + terms + references); check_folded_hyphens.py clean; reference validation 99/114 verified, still the same 15 DOI-prefix skips; weighted compliance 76.3% -> 78.7% (69.5% at the start of this review cycle); 0 dangling downstream or target_mechanisms targets; 0 orphaned reference caches added by this branch. references_cache reformat churn reverted before committing.

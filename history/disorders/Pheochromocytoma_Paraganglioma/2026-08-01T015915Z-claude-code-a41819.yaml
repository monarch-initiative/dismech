  summary: Extend PPGL entry with the hereditary predisposition axis MONDO:0017366
  details: |
    Extended kb/disorders/Pheochromocytoma_Paraganglioma.yaml to cover the hereditary pheochromocytoma-paraganglioma syndrome axis MONDO:0017366 in place of creating a separate Disease entry, following the maintainer decision recorded when closing issue #7475. Added seven genetic-locus subtypes PGL1/SDHD, PGL2/SDHAF2, PGL3/SDHC, PGL4/SDHB, PGL5/SDHA, MAX-related and TMEM127-related, each with an independently OAK-verified MONDO subtype_term, HGNC gene and bound inheritance term. Expanded pathophysiology from 4 to 12 nodes forming one connected DAG with biological_scale and role on every node, adding the succinate oncometabolite branch point, the DNA and histone hypermethylator phenotype, the Cluster 2 kinase-signaling arm, somatic loss of maternal chromosome 11, the noradrenergic/dopaminergic versus adrenergic secretory split, and metastatic progression; declared conforms_to against tumor_angiogenesis at two nodes. Added a top-level inheritance block including HP:0012275 for the SDHD and SDHAF2 parent-of-origin effect, seven new genetic loci SDHA SDHC SDHAF2 MAX TMEM127 FH EPAS1 with gene_terms, SDHB immunohistochemistry histopathology, LOINC-coded plasma metanephrine normetanephrine and 3-methoxytyramine reference ranges with interpretation bands, structured prevalence, eight structured differential_diagnoses, belzutifan and 177Lu-DOTATATE treatments with target_mechanisms, and two KNOWLEDGE_GAP discussions. Deep research: Falcon Edison re-run 2026-08-01, 12 minutes, 32 citations, used as leads only. All 13 new PMIDs fetched via just fetch-reference and every snippet verified against the cache. Validation: validate, validate-terms and validate-references all pass; weighted compliance improved from 66.7 to 69.5 percent.

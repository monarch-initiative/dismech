  summary: Widen Table 1 band snippets to consecutive rows to clear five-word minimum
  details: |
    CI fix. The "Check for new short evidence snippets" gate (scripts/check_snippet_length.py --against-ref origin/main) failed on ten evidence snippets in this entry, all of them the Table 1 frequency rows added earlier in this PR as band evidence: 'Headache 59%', 'Palpitations 50%', 'Diaphoresis 50%', 'Hypertension 92%', 'Anxiety 19%', 'Dizziness 67%', 'Syncope episodes 40%', 'Tachycardia 15%', 'Orthostatic hypotension 12%', 'Weight loss 30%'. Each is 2-3 words, under the five-word minimum. The gate exempts pipe-delimited structured-source rows (ORPHA/ClinGen/ICEES/NCIT), but these come from a PMID-cached PDF table and are not pipe-delimited, so they do not qualify.

    Fix at source, not by baseline. Each snippet was widened to a span of CONSECUTIVE WHOLE ROWS of the same table in references_cache/PMID_39735644.md (lines 519-533), so every snippet remains an exact substring while clearing the minimum. Where the span naturally reaches the table header it was included, which makes the snippet self-describing: the Headache and Dizziness snippets now open with 'Symptoms % of presence' and the Hypertension one with 'Signs % of presence'. The Hypertension span additionally carries the sustained 48% / paroxysmic 44% breakdown that had previously been asserted only in the explanation, so that claim is now quoted rather than paraphrased.

    Explanations were updated from 'Row of ...' to 'Consecutive rows of ...' and now name the specific row and figure being relied on, so a multi-row quote cannot be misread as evidence for the wrong phenotype.

    No band was changed, dropped, or re-derived. Bands remain Hypertension VERY_FREQUENT; Headache, Palpitations, Diaphoresis, Dizziness, Syncope, Weight Loss FREQUENT; Anxiety, Tachycardia, Orthostatic Hypotension OCCASIONAL.

    tests/snippet_length_baseline.txt was deliberately NOT modified: CI grandfathers against the base branch and never reads the committed file, so --update-baseline passes locally and still fails CI.

    Verification: check_snippet_length.py --against-ref origin/main reports OK, no new snippets under 5 words. All 10 rewritten spans independently confirmed as exact substrings of the cache under whitespace collapse (10/10). just count-verified-snippets 104/119 verified, 15 skipped by prefix, unchanged from before the fix. phenotypes banded without evidence: 0. check-duplicate-keys, check_folded_hyphens --check, check-title-snippets, and validate-disorders all pass.

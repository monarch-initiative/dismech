  summary: 'Phenotype review: Pheochromocytoma_Paraganglioma'
  details: |
    Reviewed all 22 phenotypes on three axes: snippet-to-claim consistency in whole-source context, optimal HPO binding, and whether the phenotype is explained in the pathograph.

    Snippet audit: all 22 phenotypes' pre-existing snippets verified as exact substrings of their cached sources, and each was read in the context of the surrounding text rather than in isolation. The Table 1 symptom/sign rows quoted from PMID:39735644 were checked against the table itself (lines 519-533 of the cache) and every asserted frequency band matches the reported percentage. No wrong-disease citations, no title-as-snippet, no model-organism evidence mislabeled as human clinical. Three phenotypes carried no evidence at all (Pallor, Renal Cell Carcinoma, Gastrointestinal Stromal Tumor); each was given a verified GeneReviews (PMID:20301715) quote already available in the cache.

    HPO bindings: one rebind and one name correction. Hoarseness moved from HP:0001618 Dysphonia to the more specific HP:0001609 Hoarse voice, which matches the cited symptom word exactly. The phenotype named 'Pulsatile Tinnitus' was renamed to 'Tinnitus': its only source is a vagal-paraganglioma series reporting unqualified 'tinnitus', no cached source establishes pulsatility in this disease, and the name was narrower than both the bound term (HP:0000360) and the evidence. Dizziness was left bound to HP:0002321 Vertigo after checking HPO for lightheadedness/presyncope alternatives; no generic dizziness class exists and the entry already documents the compromise.

    Pathograph: the entry had 0/22 phenotypes causally connected despite a well-developed 11-node mechanism graph. Added 20 downstream edges, all onto existing nodes, with no new pathophysiology nodes invented. Catecholamine Hypersecretion now reaches the 14 secretory manifestations; Chromaffin Cell Tumorigenesis reaches Pheochromocytoma and Paraganglioma plus the three head-and-neck mass-effect symptoms via the GeneReviews mass-effect-versus-hypersecretion distinction; Pseudohypoxia and HIF Activation reaches Polycythemia through the erythropoietin intermediate documented in PMID:22931260. Edges whose mechanism runs through a named intermediate (headache via transient blood-pressure elevation, orthostatic hypotension and syncope via volume contraction and receptor desensitization, the mass-effect edges) are typed INDIRECT_KNOWN_INTERMEDIATES with the intermediates spelled out rather than asserted as direct causation. Edge-level evidence was attached wherever a source makes the specific mechanistic claim; the small number of description-only edges (tachycardia, tremor) are textbook adrenergic receptor physiology.

    Deliberately left unconnected: Renal Cell Carcinoma and Gastrointestinal Stromal Tumor, now 2/22 unexplained. Both are real parts of the SDHx spectrum, but the succinate cascade curated here is modeled in chromaffin cells and no verified source in this entry establishes how the same complex II lesion transforms renal tubular or gastric interstitial cells. Wiring them would assert a lineage-independent mechanism the evidence does not support, so a KNOWLEDGE_GAP discussion (tissue_specificity_of_sdhx_tumor_spectrum) records the question and a proposed lineage-resolved screen instead. Connectivity 0/22 to 20/22.

    Validation: just validate, count-verified-snippets (121/136, 15 skipped by prefix), validate-terms, check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, and validate-disorders all pass.

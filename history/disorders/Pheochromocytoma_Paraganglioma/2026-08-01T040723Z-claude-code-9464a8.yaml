  summary: 'Address automated review on PR #7521 (hereditary PPGL axis)'
  details: |
    Round-2 response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7521 (0 CRITICAL, 5 IMPORTANT, 6 SUGGESTION). All five IMPORTANT items and every actionable suggestion were addressed.

    (1) evidence_source on the PMID:20154675 snippet in the "Kinase Signaling Activation" node corrected HUMAN_CLINICAL -> IN_VITRO.

    (2) GeneReviews baseline added: fetched PMID:20301715 (Else/Greenberg/Fishbein, updated 2023-09-21), registered in `references` with tags: [GeneReviews] and four findings, and mined into five new evidence items backing the 50%-transmission counselling statement, the parent-of-origin rule ("almost exclusively ... paternally inherited", together with the maternal-transmission exception that independently corroborates the entry's existing strong-bias-not-absolute-rule wording), the molecular diagnostic strategy, first-degree-relative cascade testing, and the biochemical-plus-whole-body-MRI surveillance schedule with its 95%-nonsecretory head-and-neck caveat.

    (3) Penetrance modeled with the schema slots: `penetrance: INCOMPLETE` plus `penetrance_percentage` on both disease-level Inheritance blocks and on the PGL1 and PGL4 subtype inheritance blocks, plus `parent_of_origin_effect` on the SDHD/SDHAF2 blocks. Figures come from Andrews et al. 2018 (PMID:29386252) - SDHB 23.9% by 60 and 30.6% by 80 ascertainment-adjusted, 21.8% by 60 in non-probands; paternally inherited SDHD 43.2% by 60; SDHB malignant risk 4.2% by 60 - deliberately in preference to the higher clinically ascertained figures the deep-research report supplied (e.g. SDHD 86% by 50), because Andrews explicitly demonstrates those older estimates are inflated by proband ascertainment. Rationale recorded in the inheritance description and in notes item 6.

    (4) Treatment gaps closed: added Cabozantinib (Natalie phase 2, PMID:38608693, ORR 25%) and CVD chemotherapy (PMID:25041164 meta-analysis, 37% partial tumour-volume response, with the authors' natural-history caveat recorded as supports: PARTIAL); gave MIBG Therapy three evidence items from the registrational phase 2 trial (PMID:30291194) plus two target_mechanisms edges and an Iobenguane I-131 therapeutic_agent, so no treatment is now unjoined to the pathograph; gave Temozolomide three evidence items (PMID:24752622) and a CHEBI agent.

    (5) Eleven phenotypes added at or around the 10% threshold - dizziness, syncope, tachycardia, orthostatic hypotension, weight loss, hyperglycemia, diabetes mellitus, tremor, and the head-and-neck mass-effect triad of tinnitus, hoarseness and hearing loss - plus a frequency band on the pre-existing Anxiety entry. Frequency bands are asserted only where the source gives a number (PMID:39735644 Table 1); hyperglycemia, diabetes, tremor and the otolaryngologic phenotypes carry no band and say so in their descriptions.

    Suggestions also addressed: Cluster 3 scope note added as notes item 5; somatic ATRX/TERT recorded as a modifier of the Metastatic Progression node with two TCGA quotes (PMID:28162975) rather than as separate nodes, with the reasoning recorded; `clinical_trials` section added (NCT03206060 Lutathera, NCT02302833 Natalie); NCIT:C15313 Radiation Therapy replaced with the more specific NCIT:C192439 Radiopharmaceutical Therapy on both radionuclide treatments; therapeutic_agent added to alpha-blockade, temozolomide, cabozantinib and CVD; evidence_source backfilled on eight pre-existing evidence items; the NCIT:C43574 histopathology preferred_term corrected to "Neuroendocrine differentiation" to match what the term actually asserts.

    Verification notes: the repo pre-edit hook caught NCIT:C61790 (Iobenguane I-131) as a retired NCIT concept and it was replaced with NCIT:C970; MAXO:0000647 chemotherapy was rejected by the TreatmentActionTerm dynamic enum and replaced with NCIT:C15632; the value OTHER does not exist in the treatment_effect enum, so the temozolomide/MGMT biomarker relationship was documented in prose rather than forced into a target_mechanisms edge. The 15 snippets reported as "skipped by prefix" were audited independently: all 15 are DOI-prefixed (DOI is in conf/reference_validator_config.yaml skip_prefixes repo-wide), all 15 have cache files present, and all 15 were confirmed by script to be exact whitespace-normalised substrings of their cached bodies. Every reference_title was checked against the title: field of its cache file.

    Validation: `just validate` passes (schema + terms + references); reference validation now 84/99 verified with the same 15 DOI skips (was 44/59); weighted compliance 69.5% -> 76.3%; no dangling downstream or target_mechanisms targets. The ~7,600-file references_cache reformat churn (#7393) was reverted before committing.

  summary: Composite tumour subtypes, a neuroblastoma differential, and the Pheochromocytoma
    stub
  details: |
    Three changes to the Pheochromocytoma and Paraganglioma entry and one stub decision. Part of the neuroblastoma expansion series (issue 15822).

    1. Two histological subtypes: Composite Pheochromocytoma (NCIT:C48306 Adrenal Gland Composite Pheochromocytoma) and an extra-adrenal Composite Paraganglioma (NCIT:C157246 Composite Paraganglioma). MONDO has no composite term (OLS MONDO search and a label/synonym search of the local build returned nothing); both NCIT terms descend from NCIT:C2991, a root of the subtype_term enum. The composite description gives the 2022 systematic review's figures (PMID:33651160; 94 patients from 62 studies): second component ganglioneuroma 65%, ganglioneuroblastoma 16%, neuroblastoma 11%; NF1, MEN 2A and von Hippel-Lindau syndrome as the recorded genetic syndromes. These are counts of published cases, not population frequencies. The extra-adrenal row cites PMID:35273997 and states that its 'fewer than 70 cases' figure comes from that paper's extra-adrenal literature table.
    2. A Neuroblastoma differential diagnosis (MONDO:0005072) with three distinguishing features: age; hypertension and plasma catecholamines, including that hypertension occurs in a minority of neuroblastoma patients (2.2% to 10%), mainly from renal artery compression; and plasma metanephrines, comparable in the two tumours, while catecholamines were lower in neuroblastoma. Most quotes come from PMID:36531507, which compares the two tumours directly and is graded as in Neuroblastoma.yaml; the PPGL age figures come from PMID:32617052, already cited here.
    3. The unbound Pheochromocytoma subtype is bound to MONDO:0004974 (adrenal gland pheochromocytoma), not MONDO:0008233, which is MONDO's OMIM susceptibility term (omim_susceptibility subset, no definition, only parent 'benign neoplasm'). stubs/Pheochromocytoma.yaml (MONDO:0008233) is kept with entry_type SUBTYPE and notes naming the parent, so that seed-stubs does not recreate it.

    New reference caches: PMID:33651160, PMID:35273997 and PMID:28752484 (cited as evidence) and PMID:35285002 (named in an explanation). Re-fetched copies of already-cited caches produced during drafting (PMID_32617052.md and whitespace-only rewrites) were not committed.

    Validation on the branch rebased onto main: the run_c4 gate set (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules, check-qualifier-terms, check-stubs, validate-stubs and check-shared-disease-terms all passed.

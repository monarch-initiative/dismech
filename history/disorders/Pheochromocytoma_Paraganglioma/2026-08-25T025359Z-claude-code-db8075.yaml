  summary: Wire to oncometabolite and two-hit modules; document scope boundary
  details: |
    Wired this entry's existing succinate/oncometabolite chain to the new oncometabolite_dioxygenase_inhibition module and its maternal-chromosome-loss node to the germline_two_hit_tumor_predisposition second-hit node. The entry already curated the full mechanism; it simply had no module conformance. Also retargeted the Pseudohypoxia and HIF Activation node from tumor_angiogenesis (Intratumoral Hypoxia and HIF Stabilization) to the oncometabolite module's Pseudohypoxic HIF Stabilization node, because the tumor_angiogenesis node models genuine intratumoral hypoxia from outgrowing blood supply whereas this node explicitly describes HIF stabilization under normoxia. Added a reciprocal scope-boundary note against Hereditary_Pheochromocytoma-Paraganglioma_Syndrome (MONDO:0017366) as a reviewer requested. Two pre-existing role-ordering oddities were found and deliberately left alone: a trigger node with an incoming edge, and a consequence node with outgoing edges.

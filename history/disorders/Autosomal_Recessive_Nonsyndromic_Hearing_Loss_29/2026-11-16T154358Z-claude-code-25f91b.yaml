  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 29 (DFNB29, CLDN14)'
  details: |
    New entry for MONDO:0013537, curated for claim issue #9060 (replaces stubs/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_29.yaml).

    Sources: the cached abstracts and full texts of 15 papers on CLDN14 and DFNB29, and an OpenScientist deep-research report (research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_29-deep-research-openscientist.md; 14 of 14 references resolved, 8 judged on topic, one off topic, a claudin-15 structure paper that is not cited; just preflight-dr passed with CLDN14 the dominant gene and OMIM 614035 matching). The curation brief posted on #9060 was used as a list of leads; every CURIE and quote was checked against the caches before use. Four NCIT CURIEs in the report carry wrong labels (for example its Cochlear Implant CURIE is a natural-history study term) and none were used.

    Lump or split: one disease with variable onset, severity and course, as #9060 asks. The prelingual, post-lingual and progressive audioprofiles come from different alleles and populations, so they are phenotype rows and allele descriptions, not subtypes. The mouse-versus-human difference in severity and onset is recorded as a HUMAN_MODEL_MISMATCH discussion, and the absent renal phenotype as a KNOWLEDGE_GAP.

    Naming: kept the numbered MONDO-label name. No CLDN14-related name is established by the entry-naming criteria: no GeneReviews chapter, and ClinGen classifies CLDN14 only for the broader nonsyndromic genetic hearing loss (MONDO:0019497), which is also why that Definitive classification is not recorded as this entry's gene-disease validity.

    Term choices: the lesion node binds GO:0005198 structural molecule activity rather than GO:0160187 paracellular tight junction channel activity, because claudin-14 is a barrier-forming claudin that lowers paracellular cation permeability. The cation-overload node binds GO:0055080 monoatomic cation homeostasis rather than the module's potassium term, because the sources say cations without naming potassium; the hair-cell node binds GO:0008219 cell death rather than apoptosis for the same reason. The ribbon-synapse node has no conforms_to, because spiral ganglion neuron density is unchanged in the knockout and the module's matching node is about neuron degeneration.

  summary: 'Create: Craniofrontonasal_Syndrome'
  details: |
    New entry for craniofrontonasal syndrome (MONDO:0010570, EFNB1), claimed in issue #16219. The pathograph runs EFNB1 loss of function -> ephrin-B1 expression mosaicism (X-inactivation or post-zygotic variant) -> ectopic Eph/ephrin boundaries and cell segregation -> gap-junction block and impaired calvarial osteogenesis (mouse), mosaic disruption of palatal proliferation, craniofacial mesenchyme dysmorphogenesis, and coronal suture boundary disturbance (conforms to cranial_suture_premature_fusion#Loss of Suture Patency Restraint). A separate neural-crest migration arm covers the defect shared by hemizygous males. Inheritance carries an X-linked dominant block and an HP:0001442 block for the recognized somatic mosaic arm in males; X-inactivation mosaicism is not bound to HP:0001442. EFNB1 ClinGen Definitive (XL) recorded from the CGGV record. Evidence was taken from primary papers found by PubMed search (Twigg 2004, Wieland 2004, Twigg 2006, Twigg 2013, Wieland 2005, Davy 2004/2006, Bush & Soriano 2010, O'Neill 2016, Niethamer 2017/2020, van den Elzen 2014, Kawamoto 2008, Oxford cohort 2020). No GeneReviews chapter exists (PubMed genereviews[book] search and just check-genereviews both NO_CHAPTER). The deep-research run was requested from falcon; falcon reported no usable key and the run fell back to openscientist (research/Craniofrontonasal_Syndrome-deep-research-openscientist.md). Its 21 references all resolved (confabulation rate 0.0); term validation flagged NCIT:C15312, labelled speech therapy but actually Radiation Dosimetry, which the entry does not use. just preflight-dr confirmed the report is about EFNB1/CFNS. The report agreed with the entry and supplied PMID:39643662 (X inversion separating EFNB1 from an enhancer), now cited in the genetic block alongside the 5' UTR uORF variant from PMID:23335590. Validation: just validate-disorders passed (62 snippets, 61 titles, 0 issues); just validate-terms passed; entity-ref, causal-target, coarse-phenotype, enum, logical-rule and duplicate-key checks clean. Ten of 16 phenotypes (nails, hair, neck, digits, strabismus, corpus callosum, speech) are not connected to a mechanism because no source gives one.

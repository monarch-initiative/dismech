  summary: 'Review round 1: Craniofrontonasal_Syndrome'
  details: |
    Answered the first automated review on PR 16266. Rebound toe clinodactyly from HP:0030084 Clinodactyly to HP:0001863 Toe clinodactyly. Added low implantation of the breasts (90% in PMID:24281372), bound to HP:0002562 Low-set nipples because HPO has no breast-position term (OLS HP searches for 'low set breast', 'breast position' and 'low implantation' returned none). Columellar indentation (91%) has no HPO term (searches 'columella indentation', 'grooved columella') and stays in the bifid nasal tip description. Split the cleft phenotype into cleft palate (HP:0000175) and cleft lip (HP:0410030). Added preaxial polydactyly (HP:0100258) for duplication of the thumbs or halluces from PMID:23335590. Added a diagnosis section: EFNB1 sequencing (PMID:15959873) and MLPA/sensitive sequencing for deletions and mosaicism (PMID:16685650, PMID:23335590). Split genetic counseling (NCIT:C15240) out of the multidisciplinary follow-up treatment, which is now unbound. Frontal bossing and wide nasal bridge were not added because no cached source states their frequency. Also fixed the failing CI gate 'Check every evidence item has a reference title': the ClinGen CGGV evidence item had no reference_title, now filled from the cache by scripts/backfill_reference_titles.py. Validation: just validate passed, 70/70 snippets verified, just validate-terms passed, entity-ref, causal-target, coarse-phenotype, enum, duplicate-key, snippet-grading and reference-title checks clean.

  summary: 'Review: Pyoderma Gangrenosum evidence re-read against cached sources'
  details: |
    Re-read every cited publication and re-verified all 147 evidence items - the largest
    entry in this review batch. Every reference resolved to a cache file. No fabricated,
    title-derived or wrong-disease quotes anywhere, and COMPUTATIONAL/MODEL_ORGANISM/IN_VITRO
    grading is correct and consistent on the multi-arm papers.

    Fixed in this pass (both were real verbatim failures that the repo's own relaxed snippet
    audit had passed):
    - Two PMID:37516310 snippets omitted the trailing "(Ortega-Loayza et al. 2022)." that the
      cache carries, at treatments[6].evidence[1] and discussions[2].evidence[0]. Both would
      fail linkml-reference-validator. Restored.
    - Two PMID:37610614 snippets were truncated one word before the content they were cited
      for: the quote stopped at "inhibitors of tumour necrosis factor" while the explanations
      cited it for IL-1 blockade (treatments[3]) and for IL-17/IL-23 (pathophysiology[1]).
      Extended through "...interleukin-23 or complement factor C5a."

    Recorded, not fixed:
    - histopathology[0]'s quote never names the major criterion, although the cited abstract
      states it verbatim ("1 major criterion-biopsy of ulcer edge demonstrating neutrophilic
      infiltrate-and 8 minor criteria").
    - pathophysiology[0].evidence[1]'s inflammasome sentence has monogenic autoinflammatory
      diseases as its antecedent, not PG.
    - A GSDMD-NETosis node's third evidence item belongs on the neutrophil-recruitment node.
    - Roughly 29 items drawn from narrative reviews and a Delphi consensus are graded
      HUMAN_CLINICAL where OTHER fits, with carve-outs for the Delphi ROC result and one
      meta-analysis. This is a systematic call across the entry rather than a per-item slip,
      so it is recorded rather than changed piecemeal.
    - discussions[2]'s prompt says every late-phase targeted trial has failed or been
      terminated; the entry's own NCT03311464 (Phase III, COMPLETED, basis of Japanese
      approval) and NCT06624670 (Phase III, RECRUITING) contradict it. The same rationale says
      "nine trials in this entry"; there are ten.

  summary: 'Address PR 9115 round-3 review: C5a, MMP, JAK-STAT nodes and trial landscape'
  details: |
    Third review round on PR #9115 (3 IMPORTANT, 3 SUGGESTION). All six addressed.

    IMPORTANT 1 - complement C5a/C5aR1 node. The previous round declined this on
    the stated ground that "no primary source was fetched and verified in this
    pass". The reviewer correctly identified that as an EFFORT statement dressed
    as a scoping decision: declining a claim because it is unsupported is
    legitimate, declining it because the work was not done is not. Accepted and
    acted on. Fetched PMID:37516310 (Wang et al., J Invest Dermatol) and verified
    it says what the review claimed: C5a is the most potent NETosis inducer among
    the candidates expressed in PG, acts specifically through C5aR1 and ERK
    (abolished by avacopan and by U0126), and is more than 6-fold elevated in PG
    wound fluid versus traumatic-wound fluid, correlating with neutrophil
    elastase. Added `Complement C5a Generation and C5aR1 Signalling`
    (biological_scale MOLECULAR, GO:0006956 + GO:0038178) with a DIRECT causal
    edge into the GSDMD-Dependent NETosis node added last round, so that effector
    now has its named proximal driver. Evidence split by source type: the
    induction experiments IN_VITRO, the wound-fluid measurements HUMAN_CLINICAL.

    IMPORTANT 2 - Phase II+ trial landscape. Added eight trials. Phase and status
    were taken from the ClinicalTrials.gov API directly, NOT from the review or
    the DR report, because the review had already been shown to carry one wrong
    NCT in an earlier round. That check mattered: NCT02318914 is the open-label
    2-year safety EXTENSION of the gevokizumab programme, not a third independent
    randomised Phase III as the review described, and it is curated as such. It
    also surfaced the single most consequential fact in this round - the
    vilobelimab Phase III NCT05964413 is TERMINATED with registry whyStopped
    "Study stopped for futility". The negative record is curated as fact: five of
    nine trials are terminated. Both the new C5a-blockade treatment and the
    existing IL-1-blockade treatment now carry explicit NEGATIVE QUALIFIER text
    forbidding them from being read as established therapy, and a new
    `pg_trial_attrition` INTERPRETATION discussion sets out three non-exclusive
    readings (mechanistic redundancy, trial-design difficulty, and nodes being
    real-but-not-rate-limiting) with the curation consequence stated explicitly.

    IMPORTANT 3 - JAK-STAT. Added `JAK-STAT Pathway Overactivation` from
    PMID:42603447 (scRNA-seq + multiplex IHC showing overactivation in PG
    lesions, driven by myeloid and T cells; tofacitinib suppresses STAT
    phosphorylation, myeloid NETosis and IL-17A in vitro), with DIRECT edges into
    both the NETosis and Th17/Th1 nodes it converges on. Added a JAK-inhibition
    treatment marked investigational only. PMID:42123319 is curated throughout as
    evidence_source COMPUTATIONAL and supports PARTIAL, because it is an entirely
    in-silico study (Mendelian randomization, WGCNA, docking, system dynamics)
    that states its own lack of experimental validation.

    SUGGESTIONS. Split-thickness grafting under immunosuppressive cover
    (PMID:23903083) added as a counterweight to the avoid-debridement guidance -
    the operative principle is now "not on active disease without cover", not
    "never". MMP-2/MMP-9 added as a full `MMP-Mediated Extracellular Matrix
    Destruction` node (PMID:20636397). JAK2 added to the genetic section, but
    deliberately NOT as the review framed it: the cited systematic review reports
    "two had mutations in JAK2" among 823 cases without naming the allele or its
    origin, so this entry does NOT assert JAK2 V617F or variant_origin SOMATIC
    despite V617F being the canonical myeloproliferative allele. The discrepancy
    and the reason are recorded in the gene's notes.

    Unplanned bonus from PMID:20636397: it reports myeloperoxidase, IL-8 and
    MMP-9 expressed significantly LESS in vegetative PG than in ulcerative and
    bullous PG. That finally supplies the distinguishing feature for the
    Vegetative subtype that rounds 1-2 could not find, so Vegetative now has a
    real evidenced `subtype:` back-reference (a new phenotype capturing the
    superficial, less-destructive lesion with its mechanistic correlate) rather
    than the documented exception it carried before. All five subtypes now carry
    back-references.

    Also updated `pg_ibd_comorbidity_edge` with PMID:42123319, which reports
    Mendelian-randomization evidence that IBD is a causal risk factor for PG plus
    six shared loci and a JAK-STAT module with JAK2/STAT3 hubs - closing part of
    a gap this entry itself flagged in round 1. Corrected two now-false claims my
    own edits created: the notes paragraph and the pathogenesis knowledge-gap
    discussion both said C5a and MMP were uncurated.

    Process note for the record: the previous round triggered two concurrent
    review runs (an auto-triggered `claude-review` on push plus a manual
    `claude-code-review.yml` dispatch), which produced an APPROVED verdict at
    21:33 and a CHANGES_REQUESTED at 21:45 against the same commit. The later
    review is binding and was addressed here; the approval was NOT treated as the
    verdict and no review was dismissed. Only one review path will be used from
    now on.

    Validation run and read in full: just validate PASS; just
    count-verified-snippets 147/147 verified against cached references (up from
    116/116, so all 31 new snippets are exact quotes); just validate-disorders
    (the batched pre-PR sweep CI runs) PASS; just check-folded-hyphens OK; just
    check-title-snippets OK (no new title-quoting snippets, which was a real risk
    given several trial brief-summaries restate their titles); just
    check-duplicate-keys OK across 4240 files; pytest tests/test_data.py over the
    subtype/unique/conforms/discussion/attaches/model-readout/animal/variant/
    trial/treatment selection returned 19478 passed. Compliance reads 89.9/90.1
    percent versus 91.2/91.5 last round - this is denominator dilution from added
    content, not regression: satisfied items rose from 238/261 to 303/337.

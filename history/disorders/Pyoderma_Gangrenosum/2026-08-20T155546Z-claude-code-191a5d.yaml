  summary: 'Create: Pyoderma Gangrenosum'
  details: |
    Created kb/disorders/Pyoderma_Gangrenosum.yaml for MONDO:0018824 as a single
    Disease entry. Framed as a primarily sterile autoinflammatory neutrophilic
    dermatosis rather than an infection, driven by MONDO's autoinflammatory-syndrome
    parent MONDO:0019751 rather than its pyoderma parent MONDO:0002922.

    Pathograph: two upstream arms - PSTPIP1 dysfunction as the monogenic PAPA arm,
    and pathergy as trauma-induced lesion initiation - feed a five-node chain running
    inflammasome activation and IL-1 overproduction, Th17/Th1-skewed cytokine
    amplification, neutrophil recruitment to the dermis, sterile neutrophilic dermal
    inflammation with tissue destruction, and progressive cutaneous ulceration with an
    undermined violaceous border. Two mechanistic_hypotheses recorded:
    autoinflammatory_neutrophil_model as CANONICAL and follicular_unit_initiation as
    EMERGING.

    Entry shape: MONDO:0018824 has no children and is tagged ordo_disorder, so this is
    a single entry despite the dashboard CURATE_ROOT_WITH_SUBTYPES hint. Five
    has_subtypes were curated - Ulcerative, Bullous, Pustular, Vegetative, Peristomal.
    Four of the five carry genuine subtype back-references on phenotype claims that
    actually differ by variant, addressing the decorative-subtype problem in issue
    7082. The Vegetative subtype deliberately carries no back-reference because
    available sources enumerate the variant without characterizing a distinguishing
    feature in quotable form; that exception is documented in the entry notes rather
    than papered over with an unevidenced back-reference.

    Also curated: two DIAGNOSTIC_CRITERIA definitions - the Delphi consensus criteria
    for ulcerative PG with sensitivity 86 percent and specificity 90 percent, and the
    PARACELSUS score - both marked VALIDATED_AGAINST_GOLD_STANDARD with rationale and
    citing evidence; PSTPIP1 typed as MODIFIER rather than causal because sporadic PG
    is not Mendelian; population-based epidemiology from the UK GPRD cohort;
    histopathology with the diagnostic ulcer-edge neutrophilic infiltrate; four
    differential diagnoses including Sweet syndrome, reciprocating the pointer
    Sweet_Syndrome.yaml already carries to PG; six treatments including the infliximab
    randomised placebo-controlled trial PMID:16188920 and the STOP GAP trial
    PMID:26071094, with target_mechanisms links into the pathograph; the STOP GAP trial
    keyed on its WHO ICTRP identifier ISRCTN35898459 since it is not registered on
    ClinicalTrials.gov; and three discussions covering the PG-IBD comorbidity
    follow-up, the PG versus PAPA entity boundary, and an open pathogenesis knowledge
    gap.

    Honesty notes on content: the commonly quoted "about 50 percent have associated
    systemic disease" figure is NOT asserted as a single number - the population-based
    cohort gives 33 percent and a hospital inpatient series 47.8 percent, and both are
    curated with their populations because they measure different things. PAPA syndrome
    MONDO:0011462 is an open curation stub and is cross-referenced only, not curated
    here.

    Curation method and provenance: the entry was built from primary literature located
    through the PubMed E-utilities API, with every PMID fetched using just
    fetch-reference and every snippet independently verified as an exact substring of
    the cached reference. A claude_code deep-research run completed only after the entry
    had been drafted and was used purely as a cross-check and lead source, not as the
    basis of the entry; its own reference validation was clean at 124 of 124 references
    resolved with 2 of 2 quoted claims found and none off topic. The single substantive
    lead taken from it was PMID:24903614, which the report had cited with a paraphrase
    marker, so the real abstract was fetched and quoted verbatim instead. Effector nodes
    the report proposed but that could not be independently verified in this pass -
    complement C5a/C5aR1 signalling, GSDMD-dependent NETosis, and MMP-2/MMP-9 matrix
    destruction - were recorded as follow-up enrichment targets in the knowledge-gap
    discussion rather than asserted.

    NEC preflight: just preflight-dr returned SKIP because MONDO records no causal gene
    via RO:0004003 for MONDO:0018824, which is correct for a non-Mendelian disease, so
    the manual preflight was run instead. runoak -i sqlite:obo:mondo info MONDO:0018824
    -O obo confirmed the label pyoderma gangrenosum, the Orphanet:48104 xref, and both
    parents. The report's top gene was PSTPIP1 at 19 mentions, the correct
    PG-associated gene, and its single OMIM 604416 is PAPA syndrome, discussed correctly
    as the monogenic anchor rather than mistaken for PG itself, so no named entity
    confusion.

    Validation actually run, with output read in full: just validate passed; just
    count-verified-snippets reported 78 of 78 snippets verified against cached
    references; just validate-disorders, the batched pre-PR sweep that CI runs, passed
    with all validations passed and 78 of 78 snippets verified; just
    check-title-snippets reported no new title-quoting snippets; just
    check-duplicate-keys found no duplicate mapping keys across 4240 YAML files; the
    pytest tests/test_data.py selection covering subtype, unique-name, conforms_to,
    discussion and attaches_to foreign keys returned 10689 passed; and compliance
    reported 89.6 percent global and 89.9 percent weighted.

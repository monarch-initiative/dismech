  summary: 'Address PR 9115 review: subtype MONDO bindings, NETosis, animal model'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9115 (1 CRITICAL,
    6 IMPORTANT, 3 SUGGESTION) and fixed an unrelated CI failure.

    CRITICAL (item 1) - the entry asserted MONDO:0018824 had no children. That was
    FALSE and the false premise came from the task brief, which had been derived
    from an invalid OAK invocation. MONDO:0018824 has four is_a children:
    MONDO:0035235 classic (exact synonym "Ulcerative pyoderma gangrenosum"),
    MONDO:0035236 pustular, MONDO:0035237 bullous, MONDO:0035238 vegetative. All
    four are now bound on their has_subtypes entries via subtype_term (the schema
    slot is subtype_term, not disease_term as the review wording suggested).
    Peristomal is correctly left unbound - MONDO has no term for it. The notes
    text asserting "no children" was REMOVED, not softened, and replaced with the
    real justification: the single-entry-with-subtypes decision rests on the
    variants being morphology/site/course differences within one disease process
    sharing one pathograph, one set of diagnostic instruments and one treatment
    ladder - not on any ontology claim. MONDO:0035237 initially failed the
    pre-edit term validator with a 5s read timeout against EBI OLS; the term was
    independently confirmed to exist via a direct OLS query before retrying, and
    the validator then resolved and cached it normally. No cache file was
    hand-written at any point.

    IMPORTANT items addressed: (2) the defining ulceration phenotype now uses
    HP:0025452 Pyoderma gangrenosum - the disease-like phenotype term - instead of
    the generic HP:0200042 Skin ulcer. (3) Pathergy was UNBOUND from HP:0200042,
    which discarded its semantic content and made it indistinguishable from three
    other Skin ulcer annotations in the same file; it now carries a free-text
    preferred_term plus a notes block recording the needs-term/NTR rationale, per
    the dismech-terms rule that no term beats a misleading one. It also gained a
    quantified frequency (OCCASIONAL) from the meta-analysis figure of 16.3%
    pathergy-attributed onset. (4) The genetic section gained the two originally
    reported PSTPIP1 missense variants (A230T, E250Q) as structured Variant
    records with clinical_significance PATHOGENIC and IN_VITRO yeast-two-hybrid
    evidence, plus three SUSCEPTIBILITY-typed genes (MEFV, NLRP3, NOD2) with HGNC
    bindings verified by OAK. (5) Added adalimumab (Phase III NCT03311464, plus
    52-week real-world PMID:42107018 showing PGA 0/1 in 57.7% at week 52) and
    topical clobetasol propionate (PMID:27502313, 43.8% healed by 6 months) - the
    entry previously curated no topical therapy at all, which misrepresented
    first-line management of limited disease. (6) Added an animal_models section
    for the PG-serum transfer mouse (PMID:40034857) with two ModelMechanismLinks:
    PERTURBS on the NETosis node (GSDMD knockout reduces ulcer severity) and
    PARTIALLY_RECAPITULATES on the ulceration node with explicit limitations.
    (7) Added the GSDMD-Dependent NETosis pathophysiology node so the animal model
    has a join point, grounded in human data (elevated serum NETs in PG patients)
    as well as the mouse result.

    Note on the review's item 5: it cited NCT03311464 for adalimumab, and the
    52-week paper PMID:42107018 registers a different trial, NCT04750213. Both
    were checked; NCT03311464 is genuinely the Phase 3 PG trial and is what is
    curated as the clinical_trials record, with PMID:42107018 cited separately as
    real-world evidence. Neither identifier was assumed from the review text.

    SUGGESTIONS also implemented: (8) added the Su 2004 criteria as a third
    DIAGNOSTIC_CRITERIA definition marked UNVALIDATED (its sensitivity and
    specificity are unreported in the literature, per PMID:41923959), a
    KNOWLEDGE_GAP discussion on the biopsy-utility controversy that deliberately
    does NOT resolve the tension with this entry's own diagnostic:true
    histopathology node, and a diagnosis entry quantifying the 10% misdiagnosis
    rate and the 12% of misdiagnosed ulcers actively exacerbated by PG-directed
    treatment (PMID:12409543). (9) Added the entry's first REFUTE evidence: a
    DEPRECATED mechanistic_hypotheses entry for the historical infectious
    etiology - valuable because the disease name itself encodes that refuted
    hypothesis and drives the harmful reflex to debride - and an epidemiology
    entry refuting any association with solid malignancy (PMID:34076886).
    (10) Consumed the Nature Reviews Disease Primers overview (PMID:33033263) and
    the systematic review/meta-analysis (PMID:29721816), whose pooled 56.8%
    reconciles the 33% population-based and 47.8% inpatient figures already
    curated.

    Declined, with reasons recorded in the entry notes rather than silently: the
    complement C5a/C5aR1 and MMP-2/MMP-9 effector arms remain uncurated because no
    primary source for either was fetched and verified in this pass. They stay as
    named follow-up enrichment targets in the knowledge-gap discussion.

    Unrelated CI fix: the test (3.13) job was failing on a folded-scalar
    compound-word split - a line inside a YAML folded scalar ended in
    "autoantibody-", so folding would render "autoantibody- mediated". Reflowed.
    This was a real content bug, not just a lint nit.

    Validation run and read in full after the changes: just validate PASS; just
    count-verified-snippets 116/116 verified against cached references (up from
    78/78, so all ~38 new snippets are exact quotes); just validate-disorders (the
    batched pre-PR sweep CI runs) PASS with 116/116; just check-folded-hyphens OK
    (no new splits); just check-title-snippets OK (no new title-quoting snippets
    despite the added evidence); just check-duplicate-keys OK across 4240 files;
    pytest tests/test_data.py over the subtype/unique/conforms/discussion/attaches/
    model-readout/animal/variant selection returned 17327 passed; compliance rose
    from 89.6/89.9 percent to 91.2/91.5 percent global/weighted.

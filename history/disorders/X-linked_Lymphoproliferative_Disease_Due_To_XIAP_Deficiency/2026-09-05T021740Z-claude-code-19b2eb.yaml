  summary: 'Create: X-linked Lymphoproliferative Disease Due To XIAP Deficiency (XLP2)'
  details: |
    De-novo curation of XLP2 (MONDO:0010385, XIAP/BIRC4, OMIM 300635, X-linked).

    No deep-research provider was run. The entry was built from primary literature
    located via the PubMed E-utilities API and from the GeneReviews chapter; every
    PMID was confirmed by title search before fetching with `just fetch-reference`.
    Sources used: Rigaud 2006 Nature (PMID:17080092 - XIAP discovery in XLP,
    enhanced lymphocyte apoptosis, low NKT cells); Marsh 2010 Blood (PMID:20489057 -
    10-patient cohort, no lymphoma); Pachlopnik Schmid 2011 Blood (PMID:21119115 -
    head-to-head XLP1 n=33 vs XLP2 n=30 comparison, the source of every frequency
    band in the entry); Speckmann 2013 (PMID:23973892 - non-HLH presenting
    manifestations); Marsh 2013 Blood (PMID:23131490 - international HSCT survey,
    MAC 14% vs RIC 55% survival); Wada 2014 (PMID:24084330 - sustained serum IL-18);
    Damgaard 2012 Mol Cell (PMID:22607974 - XIAP ubiquitylates RIPK2 and recruits
    LUBAC to NOD2); Damgaard 2013 EMBO Mol Med (PMID:23818254 - BIR2 missense
    hotspot, NOD1/2 defect in patient cells); Aguilar 2014 JACI (PMID:24942515 -
    Crohn disease characterisation and monocyte NOD2 defect); Latour and Aguilar
    2015 (PMID:25666262 - review); Yang 2012 (PMID:22228567 - Japanese cohort, iNKT
    counts); GeneReviews (PMID:20301580, tagged in the top-level references block);
    IUIS 2022 (PMID:35748970, Table 4).

    Mechanism. The three arms are modelled as seven pathophysiology nodes fanning
    out from XIAP Loss of Function (MOLECULAR, carrying a hemizygous germline
    LOSS_OF_FUNCTION genetic_context on hgnc:592): (1) enhanced activation-induced
    lymphocyte apoptosis -> invariant NKT cell depletion -> HLH susceptibility;
    (2) defective NOD2/NOD1 ubiquitin-scaffold signalling in monocytes, Paneth cells
    and intestinal epithelium -> Crohn-like intestinal inflammation; (3) inflammasome
    dysregulation with sustained IL-18 excess -> HLH amplification and recurrent
    fever. XIAP's two separable domains (BIR caspase inhibition, RING ubiquitin
    ligase) are what make arms 1 and 2 genuinely independent rather than a single
    chain, and the entry says so.

    Key negative versus XLP1. Lymphoma is curated as a phenotype carrying four
    REFUTE evidence items rather than being silently omitted: Marsh 2010 ("There
    were no cases of lymphoma"), Pachlopnik Schmid 2011 (lymphomas in XLP1 only,
    30%), and GeneReviews ("neither lymphoproliferative disease nor common variable
    immunodeficiency has been reported in males with XLP2"). The description states
    that absence of reported cases in cohorts of this size is not proof of zero
    risk.

    Uncertainty recorded rather than smoothed over. Two nodes are graded PROVISIONAL
    and say why in their own descriptions. The IL-18 node: patient PBMCs stimulated
    with LPS plus ATP did not oversecrete IL-18 relative to controls, so neither the
    cellular source nor the trigger is established, and the causal edge to HLH is
    INDIRECT_UNKNOWN_INTERMEDIATES because the authors state the association in
    hedged terms. The iNKT node: IUIS records the count as "low/normal", so
    depletion is not uniform and cannot be the whole explanation for HLH
    susceptibility; that IUIS row is cited with directness: INDIRECT for exactly
    this reason.

    Classifications. harrisons_chapter IMMUNE_RHEUMATOLOGIC + GASTROINTESTINAL (the
    colitis burden, cited to Aguilar 2014 and Speckmann 2013, in which Crohn-like
    bowel disease was the commonest non-HLH presenting manifestation) +
    GENETICS_ENVIRONMENT_DISEASE. iuis_category (single-valued) is "immune
    dysregulation", cited to the byte-verified IUIS 2022 Table 4 row "XIAP
    deficiency (XLP2) XIAP XL 300079" plus its section header "7. Susceptibility to
    EBV and Lymphoproliferative Conditions".

    Prevalence. CASES_IN_LITERATURE / ULTRA_RARE. No population-based estimate
    exists for XLP2, and Orphanet has no cached record for this concept in this
    repository's structured reference cache (347 ORPHA files present, none matching;
    the bulk XML is not available here). The prevalence notes state that explicitly
    rather than quoting an Orphanet class that was not read.

    Deliberate omissions. No environmental block: no ECTO term for EBV exposure was
    found, so the EBV trigger is carried in pathophysiology prose and evidence
    instead of an unbound exposure entry. No IL-18-targeted treatment: no citable
    source for tadekinig alfa or an IL-18-binding-protein trial in XIAP deficiency
    was found, so IL-18 is curated as a biochemical monitoring readout rather than
    as a therapy. The sibling XLP1 (SH2D1A) entry is being curated in parallel on
    another branch and is referenced only in prose, never as a file path.

    Validation. All of the following pass: `just validate`,
    `just count-verified-snippets` (83/83 verified), `just validate-terms`,
    `just check-duplicate-keys`, `just check-entity-refs`,
    `just check-folded-hyphens`, `just check-snippet-length`,
    `just check-title-snippets`, `just check-snippet-grading`,
    `just check-environmental-evidence`, and the authoritative batched
    `just validate-disorders` sweep. `just check-reference-titles` reports no
    finding for this file (its 248 findings are pre-existing in other entries).
    The stub stubs/X-linked_Lymphoproliferative_Disease_Due_To_XIAP_Deficiency.yaml
    is deleted in the same commit. Claim issue #10110.

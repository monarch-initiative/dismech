  summary: 'Create: Severe Congenital Neutropenia 1, Autosomal Dominant (ELANE)'
  details: |
    De novo curation of SCN1 (MONDO:0042490, ELANE, OMIM 202700) against claim issue #10121. Duplicate preflight confirmed no existing kb/ or stubs/ entry for MONDO:0042490 on origin/main; the allelic cyclic disease (Cyclic_Hematopoiesis, MONDO:0008090) and the distinct autosomal recessive congenital neutropenias (G6PC3_Deficiency, the CSF3R stub) were read and left untouched. No deep-research provider was used: the entry was curated directly from PubMed plus the cached reference set, as was done for the sibling Cyclic_Hematopoiesis entry. GeneReviews baseline applied (PMID:20301705, tagged GeneReviews in top-level references), and its Clinical Characteristics section drove the phenotype list. Pathophysiology is a single connected chain: ELANE misfolding (MOLECULAR, DOMINANT_NEGATIVE genetic_context) to ER stress/UPR (CELLULAR) to precursor apoptosis (CELLULAR) to promyelocyte-stage maturation arrest (TISSUE) to profound persistent neutropenia (ORGANISM), which branches to the infection arm and, via somatic CSF3R acquisition (marked PROVISIONAL per Germeshausen's explicit not-necessary caveat), to clonal evolution to MDS/AML (ESTABLISHED). Classifications: harrisons_chapter ONCOLOGY_HEMATOLOGY plus GENETICS_ENVIRONMENT_DISEASE; iuis_category phagocyte defect, evidenced by byte-verified quotes of the IUIS 2022 Table 5 elastase-deficiency row and the footnote recording the cyclic-neutropenia merge. Prevalence recorded structurally from two registry rows in PMID:21595885; the commonly quoted 1:200,000 birth figure was deliberately NOT recorded because no cached source stated it quotably, and that omission is documented in notes. Validation: just validate passed (schema, terms, references); count-verified-snippets 103/103; check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-reference-titles all clean; just validate-disorders passed. check-title-snippets and check-snippet-grading report pre-existing findings in other files only, none in this entry.

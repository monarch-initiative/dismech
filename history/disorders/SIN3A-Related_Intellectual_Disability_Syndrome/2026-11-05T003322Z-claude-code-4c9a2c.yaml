  summary: 'Create: SIN3A-Related_Intellectual_Disability_Syndrome'
  details: |
    New entry for MONDO:0044699 (Witteveen-Kolk syndrome, SIN3A haploinsufficiency). Two subtypes: point mutation (MONDO:0044700) and SIN3A-spanning 15q24 deletion (no MONDO term). The boundary with the existing Chromosome_15q24_Deletion_Syndrome entry follows that entry, which already treats Witteveen-Kolk syndrome as distinct; that file was not edited. MONDO places the Witteveen-Kolk syndrome and WITKOS strings and the OMIM:613406 xref on MONDO:0013256, not on MONDO:0044699; the synonyms are kept here because the cited cohort papers use them for SIN3A haploinsufficiency, and the mapping difference is recorded in the entry notes. Pathophysiology chain: SIN3A haploinsufficiency and the PAH1 missense partner-binding defect converge on reduced SIN3A-HDAC corepressor activity, which leads to impaired cortical neurogenesis (mouse knockdown), disrupted cortical integrity and the neurodevelopmental phenotypes; a blood hypomethylation episignature is a terminal readout. Phenotype frequencies are from the 28-patient cohort (PMID:33437032); where its abstract and results text disagree (mild ID, seizures) a frequency band is used. ClinGen Definitive AD tier recorded from the CGGV record. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Sources: literature search via PubMed E-utilities plus one OpenScientist deep-research report (research/SIN3A-Related_Intellectual_Disability_Syndrome-deep-research-openscientist.md): 21/21 references resolved, one paraphrased quote (PMID:39576496) not reused, no unresolved terms; just preflight-dr PASS. Taken from the report: Myt1L and TET1 PAH1 partner evidence, gastroesophageal reflux, dystonia and progressive cerebellar ataxia (single case). Not used: two general chromatinopathy episignature papers (PMID:41952182, PMID:41957673) that do not report SIN3A data; the SIN3A-specific episignature paper (PMID:36399132) is cited instead. Validation: just validate, validate-terms, count-verified-snippets (82/82) and the offline gates in CLAUDE.md passed; validate-disorders run before push.

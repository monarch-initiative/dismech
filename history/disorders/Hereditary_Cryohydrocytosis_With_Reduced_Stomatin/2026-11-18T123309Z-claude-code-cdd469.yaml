  summary: 'Create: Hereditary Cryohydrocytosis With Reduced Stomatin'
  details: |
    New entry for stomatin-deficient cryohydrocytosis (sdCHC, MONDO:0012143, SLC2A1), curated from the primary literature on all four reported pedigrees: PMID:15180870 (founding clinical description), PMID:21791420 (SLC2A1 identified; dual loss of glucose transport and gained cation leak in Xenopus oocytes), PMID:22492876 (fourth pedigree, pseudohyperkalemia mechanism) and PMID:29713289 (mechanistic review, variant list, cold-dependence hypothesis). Pathophysiology is modelled as a branching chain from one lesion node: the mutant GLUT1 both loses glucose transport, which runs to blood-brain-barrier glucose deficit and cerebral energy failure, and gains a monovalent cation pathway, which runs to erythrocyte cation imbalance, stomatocytosis, hemolysis and pseudohyperkalemia, with reticulocyte stomatin loss as a secondary branch. Three judgement calls are recorded in notes: splenectomy guidance was left out because both reviews scope their warning to dehydrated or overhydrated stomatocytosis rather than sdCHC; no gene_disease_validity assertion was recorded because ClinGen rates SLC2A1 for GLUT1 deficiency syndrome (MONDO:0000188), not for this entry's term; and no frequency values are recorded because four pedigrees cannot support them. The GLUT1 Deficiency Syndrome GeneReviews chapter (PMID:20301603) is gene-scoped rather than disease-specific, so it is the baseline for the neurological arm only. Its committed cache held MEDLINE citation boilerplate with no abstract, so it was re-fetched. Validation: just validate-disorders passed with 31 of 31 snippets and 32 titles verified; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-duplicate-keys, check-enum-values, check-logical-rules, check-delivery-system, check-name-collisions, check-gene-namespaces and check-genereviews all pass. Term validation caught GO:0005355 written from memory as an obsolete term; it was replaced with GO:0055056 after an OLS lookup. The OpenScientist deep-research run for this disease was still queued when the entry was written, so the entry rests on the primary literature; the report will be reconciled against it before the pull request is marked ready.

  summary: 'Review round 1 and deep research: Hereditary Cryohydrocytosis With Reduced
    Stomatin'
  details: |
    Addresses the first review round on PR 18380 and adds the deep-research artifact. Two GeneReviews sections the first pass had not mined are now used. The Genetic Counseling section states autosomal dominant inheritance for SLC2A1 disease directly and gives the fifty percent transmission risk; both are added to the inheritance block, INDIRECT because they are stated for Glut1DS rather than for sdCHC. The Agents and Circumstances to Avoid section gives a contraindication specific to patients on a ketogenic diet, that valproic acid raises the risk of a Reye-like illness and may itself inhibit glucose transport; that is now on the ketogenic diet treatment, and it matters because valproate is an obvious anticonvulsant to reach for in a child with seizures. Evidence tightening: two IN_VITRO items quoting a review's restatement or its speculation now carry quote_role REVIEW_SYNTHESIS, the cation leak node gains a measurement of the leak in patient red cells rather than resting on the review's speculative explanation of its temperature dependence, the ten-times-normal figure and the overhydrated form's linear temperature behaviour are cited rather than asserted, the pore wording is softened to match a source that reports a lack of structural evidence rather than a prediction against a pore, and two frequency claims that the entry's own notes decline to make elsewhere are removed. CI gate: check-gene-activity-grounding failed because SLC2A1 reached the pathograph on a node binding no molecular function; GO:0055056 D-glucose transmembrane transporter activity is now bound there with LOSS_OF_FUNCTION. Earlier in the same branch, self-review before the pull request had already corrected two evidence-claim mismatches: Pseudohyperkalemia cited the presentation sentence, which records raised potassium but not that it is spurious, and Hypoglycorrhachia was asserted from GeneReviews on Glut1DS although no sdCHC report measures cerebrospinal fluid glucose in any patient. Deep research: openscientist failed on every attempt, so claude_code was substituted by hand and recorded, as on dismech#18386. The report passes just preflight-dr against MONDO:0012143 with SLC2A1 mentioned 205 times and OMIM 608885 matching. One claim in it was chased and not used: it states that a ketogenic diet improved seizure control in the fourth pedigree, attributing that to the full text of PMID:22492876. That paper is cached as abstract only, the word ketogenic appears nowhere in the cached record, and a forced re-fetch does not retrieve a full text, so the quote is unusable and the treatment keeps its INDIRECT grading. The notes record the claim, the failed verification, and that this is the one claim in the entry that would move from extrapolated to reported if someone holding that article confirms it. The forced re-fetch left the cache file byte-identical, so no unrelated churn of the kind dismech#10736 describes enters this pull request. Validation: validate-disorders passes with 39 of 39 snippets verified, and the entity-ref, causal-target, coarse-phenotype, enum-value, logical-rule and gene-grounding gates all pass.

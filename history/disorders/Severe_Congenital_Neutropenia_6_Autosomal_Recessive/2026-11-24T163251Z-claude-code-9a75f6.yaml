  summary: Add Perplexity deep-research report and fold in its leads
  details: |
    Added the Perplexity sonar-deep-research report (with citations sidecar) that review had required for this entry; just preflight-dr against MONDO:0014456 returned PASS. The report's OMIM:616012 is the JAGN1 gene record, not a separate disease, and is already explained in the IUIS classification note. Two CURIEs the report's term validation flagged as mislabelled (UBERON:0001741 for bone marrow, GO:0005544 for calpain signalling), and the other mislabelled HP codes it lists, were not used.

    Cross-check against the entry. New content, each supported by an exact quote from a cached reference: (1) a VERY_RARE Intracranial hemorrhage phenotype (HP:0002170) from the Thomas et al. 2023 case report (PMID:37528877), with its negative coagulation and imaging work-up; (2) that case's infantile hypogammaglobulinemia as a further item on the existing decreased-immunoglobulin phenotype; (3) a Drosophila Jagunal ER-reorganization item (PMID:17389229, MODEL_ORGANISM, INDIRECT) on the Early Secretory Pathway and ER Dysfunction node; (4) the HL-60 finding that increased cell death followed overexpression of patient mutants but not JAGN1 knockdown (PMID:33206996), added to the ER Stress node with the caveat in its explanation and description.

    Not added: the report's failure to thrive, hypothyroidism, pancreatic insufficiency, coarctation and triangular face (already recorded in notes as uncounted associations), quality-of-life phenotypes (no source), osteoporosis and fractures (already covered by Osteopenia and the cohort's bone-disorder figure), the c.35_43del ClinVar variant (no new claim the entry needs), and the McDermott and Malech BJH commentary (DOI:10.1111/bjh.17135), whose cache has no content. The report's dominant-negative speculation was not curated.

    Validation: just validate, validate-terms, count-verified-snippets (90/90) and the whole-repo gates.

  summary: 'Create: Severe Congenital Neutropenia 6, Autosomal Recessive (JAGN1)'
  details: |
    New entry for SCN6 (MONDO:0014456, JAGN1), requested in #14230. Curated from primary literature: the founding Nat Genet report (PMID:25129144) and its companion mouse study (PMID:25129145), the 32-patient ESID/EBMT cohort (PMID:39775668), the zebrafish jagn1b model (PMID:38739706), mechanism papers on calpain-dependent death (PMID:33206996), IgG glycosylation (PMID:32930709) and sialylation (PMID:42685351), the GM-CSF case report (PMID:39286252), the c.63G>T series (PMID:41751872), a diabetes case report (PMID:40682375), IUIS 2024 (PMID:41608114), the Turkish SCN registry (PMID:31321910) and Orphanet ORPHA:423384. No deep-research report was used. The review behind the request (PMID:42461459) expands JAGN1 as Jagged-1 and was not cited. The mouse model is recorded as failing to recapitulate the neutropenia, and the GM-CSF treatment carries the negative human result next to the mouse rescue. Validated with just validate-disorders (72/72 snippets, terms, schema), check-entity-refs, check-causal-targets, check-coarse-phenotypes and check-snippet-grading.

  summary: Review and enrich Osteogenesis_Imperfecta_Type_VI
  details: |-
    Reviewed and enriched Osteogenesis_Imperfecta_Type_VI (MONDO:0013515). Added MONDO and clinical synonyms, recorded GeneReviews scope note (COL1A1/COL1A2 chapter covers types I-IV and excludes autosomal recessive SERPINF1 type VI), added classifications.harrisons_chapter (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) and updated ISDS nosology note with 11th revision PMID:36779427, and added ULTRA_RARE prevalence backed by PMID:28689307. Enriched all 4 pathophysiology nodes with biological_scale and UBERON bone locations while preserving RANKL-Mediated Osteoclast Overactivation, grounded SERPINF1 Loss of Function Abolishes PEDF Secretion with hgnc:8824 SERPINF1, GO:0005102 signaling receptor binding, and CL:0000137 osteocyte, and wired all 8 phenotypes via downstream edges. Added CAUSATIVE and GERMLINE on SERPINF1 genetic entry, added phenotype categories and rebound Osteomalacia (HP:0002749), split diagnosis into SERPINF1 Molecular Genetic Testing (NCIT:C19770) and Iliac Crest Bone Biopsy and Polarized-Light Histomorphometry (NCIT:C51927), and added SMALL_MOLECULE modality and target_mechanisms across treatments.

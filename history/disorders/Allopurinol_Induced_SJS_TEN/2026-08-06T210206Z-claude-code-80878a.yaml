  details: |
    Backfill for issue #8085. Allopurinol exposure is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into the oxypurinol-HLA interaction node, because allopurinol is not itself the antigenic species: it is metabolized to oxypurinol, which is what engages peptide-HLA complexes. Renal impairment is TRIGGERS/DIRECT into the reduced renal oxypurinol clearance node, which it causes outright. Worth noting for curation review that renal impairment is a host physiological state rather than an environmental exposure, so its placement in the environmental section predates this change and was not altered here. Validated with just validate, just validate-terms and just validate-references (40/40 snippets); zero integrity issues.

  summary: Bind the allopurinol exposure term, add HLA-B*58:01 screening and the SCAR
    differentials
  details: |
    Both environmental entries were reported UNBOUND by just environmental-term-audit. They are now dispositioned differently, on purpose.

    Allopurinol exposure is bound to ECTO:0000509 (exposure to drug) with the specific agent carried in preferred_term, following the documented pattern of linking the most specific verified term while letting preferred_term be more precise.

    Renal impairment is deliberately left unbound, with a notes line recording why. Reduced renal function is a host susceptibility factor modifying oxypurinol clearance, not an exposure. ECTO is an exposure ontology and binding a physiological state to it would misuse the ontology while silencing the audit. The entry sits under environmental only so it can reach the pathograph via influences_mechanisms. The audit will continue to report it as UNBOUND and that is the correct outcome, not a gap; the notes line exists so a later curator does not try to close it.

    Added HLA-B*58:01 pre-prescription screening to the diagnosis block, which already carried SCORTEN, ALDEN causality and biopsy histopathology but not the one pharmacogenomic test specific to allopurinol. It is framed as preventive rather than diagnostic, because it identifies the susceptibility allele the trigger node depends on before exposure occurs. The clinically operative figure is the population dependence of sensitivity: pooled sensitivity about 56 percent in European and Japanese populations against about 97 percent in Korean, Thai, Sardinian Italian and Han Chinese populations, so a negative result carries very different reassurance by ancestry.

    Added DRESS and AGEP as differential_diagnoses with distinguishing features. Both deliberately omit disease_term: no verified MONDO CURIE was available from the local caches and the ontology service was unreachable at curation time, so binding a guessed identifier would have been worse than leaving it unbound. Each carries a notes line saying so. The AGEP description records that its own boundary with pustular psoriasis is genetically contested, so the label is not presented as a settled alternative diagnosis.

    Process note: reference_title values were written as placeholders and then generated programmatically from each cache file, rather than typed. This is the practice adopted after fabricating four titles earlier in the same session on Secondary_Hypertension; here it produced zero fabrications.

    Validated with just validate-disorders (batched sweep CI runs), just count-verified-snippets (44/44), just check-duplicate-keys, just check-entity-refs, and just environmental-term-audit.

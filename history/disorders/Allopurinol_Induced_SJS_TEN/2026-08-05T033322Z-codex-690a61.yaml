  summary: 'Review: Allopurinol-induced SJS/TEN'
  details: |
    Performed a full publication-readiness review of the allopurinol-induced
    SJS/TEN entry against its complete claim-evidence set, the repository
    Stevens-Johnson syndrome deep-research artifact, and disease-specific
    literature through 2026-08-04. Corrected overgeneralized phenotype evidence,
    added dose and latency evidence, qualified HLA-B*58:01 as a strong but
    incomplete risk factor, strengthened the oxypurinol/HLA/CD8 T-cell causal
    graph, connected every phenotype and the HLA-B gene, and added renal impairment
    as an oxypurinol-clearance cofactor, histopathology, clinical, ALDEN, and
    SCORTEN assessment, prospective HLA screening, and a patient-derived PBMC
    experimental model. Added nine generator-created PubMed cache records used by
    the entry. Reviewed but did not promote the small mixed-phenotype
    HLA-A*34:02 signal, generic all-cause SJS/TEN single-cell findings, nonspecific
    immunomodulatory treatments, non-allopurinol trials, or animal/computational
    models lacking direct validation; removed oxcarbazepine-series snippets that
    did not support allopurinol-specific phenotype frequencies. Validation included
    schema, terms, references, 38 exact snippets, history, compliance,
    phenotype/gene connectivity, graph/model links, and cache contracts.

  summary: 'Review round 2: restore the CYBB Xp21.1 location, now cited'
  details: |
    Review round on PR #12332. Round 1 removed 'Xp21.1' from the CYBB subtype description and genetic record because no reference cited in this entry stated it. The reviewer's point was fair: CYBB genuinely is at Xp21.1, so removal discarded correct information on sourcing grounds alone. A source turned out to be already in references_cache - PMID:22111908, 'Chronic granulomatous disease, the McLeod phenotype and the contiguous gene deletion syndrome-a review', cached for kb/disorders/McLeod_Neuroacanthocytosis_Syndrome.yaml - which states both the Xp21.1 location and the XK-deletion route to the McLeod phenotype. The band is restored in both places with two evidence items from that review, and the description now names the XK/Kell locus and cross-references the McLeod entry.

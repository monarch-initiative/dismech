  summary: 'Genetics pass: complete NOX2 subunit wiring and bind all six subtype rows'
  details: |
    Genetics pass for #12192. All six genes were curated but only CYBB and NCF1 carried a descriptor on the NADPH oxidase assembly node, so CYBA, NCF2, NCF4 and CYBC1 were unwired even though that node's own description names all six subunits. Added the four missing gene descriptors, taking wiring from 2/6 to 6/6. None of the six `has_subtypes` rows carried a gene, an inheritance block or any evidence; added all three to each, with the GeneReviews sentence assigning each form to its gene and inheritance mode. Added `relationship_type: CAUSATIVE` to the six genetic records. MONDO reconciliation: all six checklist pairs - CYBB, CYBA, NCF1, NCF2, NCF4 and CYBC1 - were already present in `genetic:` and are now bound at their subtype rows too. No new literature needed.

    Self-review found an unsourced cytogenetic band in the CYBB subtype description and in the CYBB genetic record ('Xp21.1'), which no reference cited in this entry states. Removed both, and replaced the description's 'contiguous-gene deletion at Xp21.1' with the relationship the IUIS 2022 table does state - a deletion extending into the contiguous Kell locus - cited with that row as a new evidence item. The subtype inheritance term is HP:0001417 X-linked inheritance rather than HP:0001419 X-linked recessive, because 'X-linked manner' is what the entry's GeneReviews source says.

  summary: 'Treatment-centred review and enrichment: Chronic Granulomatous Disease'
  details: |
    Treatment-centred review and enrichment of an existing entry.

    Research: a fresh openscientist run was launched for this disease (just research-disorder openscientist Chronic_Granulomatous_Disease); it was still queued server-side when this work was committed, so no openscientist report is part of this change. The committed claude_code report (research/Chronic_Granulomatous_Disease-deep-research-claude_code.md) was read as leads only: just preflight-dr returns SKIP because MONDO:0018305 records no RO:0004003 causal gene, and that report's own PMIDs are marked 'verify' and include at least one wrong identifier (12802026 for the itraconazole trial, which is 12802027). Every claim curated here was read from the primary abstract or full text in references_cache/ and sourced by a targeted PubMed sweep over CGD treatment literature (prophylaxis trials, HSCT cohorts, anti-inflammatory biologics, granulocyte transfusion, gene therapy and gene editing, inflammasome/autophagy/efferocytosis mechanism).

    Treatments: 10 existing treatments reviewed and extended; 9 added. New: posaconazole prophylaxis, high-dose corticosteroid management of staphylococcal liver abscess, anti-TNF (infliximab) for CGD-IBD with its infection cost, anakinra, thalidomide (the 2026 randomised trial), ustekinumab/vedolizumab as investigational, sirolimus, pioglitazone (including the negative clinical result, recorded as REFUTE), granulocyte transfusions (including the pre-transplant alloimmunisation harm), and autologous HSPC gene editing (prime and base editing). Added therapeutic_modality throughout, dosing_interval/dosing_interval_days where a source states the schedule, NCIT:C15704 and NCIT:C219703 treatment terms, CHEBI/NCIT therapeutic_agent bindings, and target_mechanisms with their own evidence on every treatment that acts on a node. effect_modifiers added: three tested nulls from the 1991 interferon-gamma trial (age, inheritance mode, concurrent antibiotics) and two from the 712-patient HSCT registry (age, donor mismatch). modification_analysis is left absent on the trial nulls because the report does not say whether those subgroup analyses were prespecified.

    Pathophysiology: four new nodes, each an explicit drug target that previously had none - loss of oxidase-dependent mitochondrial ROS signalling (pioglitazone), impaired efferocytosis of apoptotic cells (pioglitazone), defective phagosomal autophagy (the step linking the oxidase lesion to IL-1) and ROS-independent inflammasome activation with IL-1 beta release (anakinra, sirolimus). Wired with evidenced downstream edges, including an INDIRECT_UNKNOWN_INTERMEDIATES edge where the source says only 'may contribute'. Added conforms_to anchors to the killing and immunoregulation nodes of phagocyte_oxidative_burst_failure, a molecular_functions binding (GO:0016175) on the assembly-failure node, NETosis to the killing node and TNF production to the inflammatory node; all four conformance links now share a GO term with their module node.

    Other sections: new biochemical entry for residual neutrophil reactive oxygen intermediate production with DIAGNOSTIC and PROGNOSTIC readouts; four clinical trials (two gene-editing, two G1XCGD lentiviral arms) with phase and status read from the ClinicalTrials.gov v2 API rather than from memory; an open KNOWLEDGE_GAP discussion recording that interferon gamma's benefit is not burst restoration, with the trial's own negative superoxide sentence; Colitis frequency raised OCCASIONAL to FREQUENT against a CGD-IBD-specific figure, with the three non-equivalent denominators spelled out in its notes; European-cohort organ frequencies added to four phenotypes.

    Deliberately not done: no LOINC binding for the DHR assay (none looked up and cached in this pass), no effect_modifier from the TMP-SMX genotype strata (the source reports two per-stratum rates without claiming a difference), no ustekinumab/vedolizumab mechanism edge (the reviewed evidence does not identify a node), no tamoxifen (named in a review's list with no primary source cited here), no model links or experimental models.

    Validation: just validate, count-verified-snippets (151/151 verified), validate-terms, check-entity-refs, check-causal-targets, list-disconnected-phenotypes (11/11 connected), check-conformance-content, check-logical-rules, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-folded-hyphens, check-folded-yaml, check-name-collisions, check-snippet-length, check-title-snippets, check-reference-titles, check-retired-support-prose, check-snippet-grading, check-shared-disease-terms, check-gene-namespaces, check-cache-order, check-genereviews, check-codelists, compliance-connectivity, and the authoritative just validate-disorders - all pass.

  summary: 'Review: connect CGD''s entirely detached clinical layer (IUIS Table 5)'
  details: |
    All eleven phenotypes had no incoming causal edge, in the flagship phagocyte disorder. The NADPH oxidase chain was complete and split cleanly into its two arms - impaired killing and dysregulated inflammation - and neither arm reached a clinical finding.

    Eight infection phenotypes attach to the killing arm and three inflammatory ones to the granuloma arm. The split is the point of this disease and the edges make it visible: colitis is drawn from the inflammatory arm rather than the infectious one because that is how the entry classifies it and because it responds to immunosuppression rather than antimicrobials, and gastric outlet obstruction is the mechanical consequence of granuloma at a narrow point rather than infection at that site.

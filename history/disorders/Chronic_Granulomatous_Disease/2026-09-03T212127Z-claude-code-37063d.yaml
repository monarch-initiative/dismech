  summary: Bind MONDO subtype_term to all six CGD has_subtypes entries; correct 'no
    MONDO term' prose
  details: |
    Claim #10789 (chronic granulomatous disease, autosomal recessive, cytochrome b-negative, MONDO:0009308). The umbrella entry already carried all six genetic forms in has_subtypes but none had a subtype_term, so MONDO:0009308 was bound nowhere in kb/.

    Each subtype description additionally asserted 'no distinct MONDO subtype term is available' (and, for the X-linked form, 'MONDO models CGD only at the parent level'). That is not true: MONDO carries a class for every one of the six OMIM phenotypes the entry already named, and each maps 1:1 by OMIM number. The prose has been corrected to cite the MONDO id instead.

    Resolved and label-checked through the EBI OLS4 MONDO API before writing (obo_id lookup; is_obsolete False; label and OMIM xref read from the API response, not from memory):
      X-linked CYBB    -> MONDO:0010600 granulomatous disease, chronic, X-linked (OMIM:306400)
      AR p47phox NCF1  -> MONDO:0009309 ... autosomal recessive, cytochrome b-positive, type 1 (OMIM:233700)
      AR p22phox CYBA  -> MONDO:0009308 ... autosomal recessive, cytochrome b-negative (OMIM:233690)
      AR p67phox NCF2  -> MONDO:0009310 ... autosomal recessive, cytochrome b-positive, type 2 (OMIM:233710)
      AR p40phox NCF4  -> MONDO:0013507 ... autosomal recessive, cytochrome b-positive, type 3 (OMIM:613960)
      AR CYBC1 EROS    -> MONDO:0030066 granulomatous disease, chronic, autosomal recessive, 5 (OMIM:618935)

    Every OMIM xref returned by OLS matches the OMIM phenotype number the entry had already recorded for that subtype, which is what makes the six assignments checkable rather than judgement calls. All six mapped 1:1, so none needed the top-level mappings/skos:narrowMatch treatment #10780 used for the C8 chain split.

    No other content changed. Retires two stubs: the claim's own CYBA stub plus the previously unclaimed Granulomatous_Disease_Chronic_X-linked, which the CYBB binding covers. The latter had no open claim issue.

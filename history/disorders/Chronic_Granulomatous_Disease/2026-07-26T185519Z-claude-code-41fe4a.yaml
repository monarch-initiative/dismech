  details: |
    Manual expert claim-evidence review.
    Fixed: (1) prevalence used the deprecated free-text style with the measure type embedded in population ('United States (birth incidence)') - restructured with measure_type BIRTH_PREVALENCE, prevalence_class, rate_low/high, and a note that the registry figure is explicitly a minimum. (2) Lymphadenitis (FREQUENT), Recurrent skin abscesses (FREQUENT) and Osteomyelitis (OCCASIONAL) asserted frequency bands supported only by GeneReviews site-of-infection lists, which say nothing about frequency - added the quantitative US registry rows (53%, 42%, 25%). (3) Colitis was FREQUENT (30-79%) with no band evidence; the only quantitative source in the entry reports 17% - downgraded to OCCASIONAL with the registry citation plus a note flagging that modern series report higher GI involvement and the band should be re-evaluated if a contemporary cohort figure is added.

  summary: 'Create: Sick Sinus Syndrome 2, Autosomal Dominant (HCN4)'
  details: |
    De-novo curation of MONDO:0008102 (SSS2, HCN4-related autosomal dominant sinus node dysfunction), fulfilling issue #8548. LUMP-VS-SPLIT: the existing umbrella entry Familial_Sick_Sinus_Syndrome (MONDO:0012061) already carried an HCN4 node, an HCN4 genetic entry and LVNC as a phenotype, but MONDO models MONDO:0008102 as a distinct disease-series-by-gene entity (is_a MONDO:0012061, RO:0004003 HGNC:16882, xref OMIM:163800) and the umbrella is deliberately gene-heterogeneous (recessive SCN5A form, LMNA, ANK2, GWAS loci), so a standalone HCN4-specific entry was created and cross-referenced in both directions via differential_diagnoses rather than duplicating the umbrella. NEC PREFLIGHT: the MONDO record was read directly with runoak and confirms HCN4 and OMIM:163800; preflight-dr on the falcon report returned PASS (HCN4 91 mentions vs SCN5A 3). DEEP RESEARCH: falcon (Edison) run, reference_validation 8/8 verified and confabulation_rate 0.0, but it cited reviews rather than the primary SSS2 literature and its suggested HPO/NCIT identifiers were largely wrong on OAK lookup, so it was used as a lead only and the evidence base was rebuilt from primary papers: PMID:16407510, PMID:12750403, PMID:17646576, PMID:23178648, PMID:25145517, PMID:25145518, PMID:28104484, PMID:35328031, PMID:19570998, PMID:21220308, PMID:37760888, PMID:34383451, PMID:26835093. Declares conforms_to against three cardiac_ion_channel_repolarization module nodes including the sinoatrial-node automaticity-failure branch, and was added as a member of the Inherited_Arrhythmia_Syndromes grouping (check-groupings reports SATISFIED). No GeneReviews chapter exists for this disorder; PubMed was searched and only unrelated chapters were returned. VALIDATION ACTUALLY RUN: schema and term validation via the repository pre-edit hook (both clean); count-verified-snippets 59/59 verified against cached references; check-title-snippets OK; check-duplicate-keys OK; validate-grouping and check-groupings OK; pytest tests/test_data.py; and validate-disorders as the final batched pre-PR sweep.

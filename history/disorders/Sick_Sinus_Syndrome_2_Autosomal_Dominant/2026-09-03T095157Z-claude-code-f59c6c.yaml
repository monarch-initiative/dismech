  summary: Make variant functional effects machine-readable
  details: |
    Acts on the single optional suggestion in the second approving review of PR #10683: P883R's functional discordance was recorded only in description and explanation prose, so a query for HCN4 alleles that are not loss-of-function returned nothing. Added functional_effects to all eight variants in the genetic block, each a transcription of the functional consequence that variant's own description and evidence already state rather than a new claim: S672R hyperpolarizing shift with retained cAMP response, 573X loss of cAMP-dependent gating with dominant-negative suppression, G480R reduced synthesis and trafficking, G482R nonfunctional pore with suppression of wild-type current, K530N heteromer-restricted hyperpolarizing shift, D553N trafficking defect, the c.1737+1 G>T splice-donor disruption, and P883R depolarizing shift with increased current density. The splice allele's entry says in its description that the consequence is inferred from the variant class and the family phenotype rather than measured, since that family was characterised by Holter and exercise testing rather than patch clamp. The review's suggestion named P883R alone; the other seven were included because populating the slot for one variant would make the layer answer 'which alleles are not loss-of-function' while leaving 'which alleles are loss-of-function' empty, which is a worse asymmetry than either populated or unpopulated. clinical_significance was set on P883R only, to UNCERTAIN_SIGNIFICANCE, because the entry itself carries evidence cutting both ways on that allele. It was deliberately not set on the other seven: grading them PATHOGENIC would be a new assertion that no cited source in this entry makes, and the review's point was about making existing curation queryable, not about adding pathogenicity calls. VALIDATION ACTUALLY RUN: just validate; just validate-terms (passed); count-verified-snippets 138/138, unchanged since no evidence items were touched; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms; validate-disorders as the final batched sweep; pytest tests/test_data.py. Compliance holds at 99.7 percent.

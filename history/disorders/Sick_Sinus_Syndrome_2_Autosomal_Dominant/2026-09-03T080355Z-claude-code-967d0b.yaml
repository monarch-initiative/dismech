  summary: 'Augment SSS2: prevalence, progression, models, datasets, knowledge gaps,
    edge evidence'
  details: |
    Augmentation pass on the existing MONDO:0008102 entry (created 2026-08-17, issue #8548, PR #8771). DEEP RESEARCH: openscientist (Edison/falcon report for this disorder already existed on main and was read rather than regenerated, since re-running would have overwritten the committed report the original curation was built from). The openscientist run validated clean -- 16/16 references resolved, confabulation_rate 0.0, 24/24 CURIEs resolved -- with needs_review true for one quote (PMID:18375593) that could not be matched beyond the abstract; that reference was not used. preflight-dr against MONDO:0008102 returned PASS (HCN4 56 mentions vs SCN5A 4, OMIM 163800 matching). Its suggested HP:0011702 and HP:0011664 names were paraphrases of the ontology labels and were not copied. ADDED: four structured prevalence records, each an ascertainment-conditioned occurrence figure with the conditioning stated in notes (HCN4 share of mutation-positive familial SSS probands 16/48 PMID:28104484; HCN4 share of paediatric LVNC 4/31 PMID:35893073; ordinal rank in adult LVNC PMID:30471092; Danish nationwide cumulative incidence of pacemaker-treated SND in first-degree relatives PMID:39535890, graded INDIRECT because the cohort is not genotyped). Four progression phases from prenatal bradycardia (PMID:39698436) through asymptomatic childhood (PMID:35257104), post-adolescent symptomatic SND (PMID:28104484), to age-dependent aortic dilatation, the last recorded with the report's own contradicting family. Three phenotypes: biventricular noncompaction with preserved systolic function (PMID:34088380), mitral valve prolapse and prolonged QT interval (PMID:15123648, PMID:39698436). Two variants, D553N trafficking-defective (PMID:15123648) and the c.1737+1 G>T splice allele (PMID:28465117), the latter also supplying the only formal exercise-test measurement of chronotropic incompetence against non-carrier relatives. Two experimental_models: the patient-derived hiPSC gene-dose pair (PMID:40414080, relationship PERTURBS with fidelity UNKNOWN because only pluripotency characterisation is published) and the wild-type hiPSC pacemaker-cardiomyocyte I_f platform (PMID:33934225, relationship MEASURES). Three verified GEO datasets (geo:GSE279632, geo:GSE189782, geo:GSE329403) with relevance triage in notes -- none is an SSS2 cohort, and the mouse GOF accession is labelled as the opposite-direction allele. Four discussions: the unexplained aortic-wall mechanism, whether noncompaction is developmental or rate-driven, the HCN4 variant-causality threshold (CONTROVERSY, PMID:33095298 V759I functionally normal and non-segregating), and a HUMAN_MODEL_MISMATCH on chronotropic incompetence in the hHCN4-573X mouse. Evidence added to 11 of the 12 causal edges; the compaction-to-aortic-dilatation edge is deliberately left uncited and carries the knowledge-gap discussion instead. Top-level evidence added to both animal models and to four of five differential diagnoses (PMID:21131953 for SANDD, PMID:30645171 for SSS4). CLEANUP: rewrote nine explanation strings that still argued for the retired supports value PARTIAL (issue #10003 prose backlog) and encoded the inference step as directness INDIRECT where that is what they meant; refreshed the stale PREVALENCE paragraph in notes. NOT USED: PMID:27173043 (Vermeer 2016, the primary aortic-dilatation report) and PMID:33185997 have no retrievable abstract, so the aortic frequency is cited through the case report PMID:35257104 with directness INDIRECT rather than quoted from the primary. VALIDATION ACTUALLY RUN: just validate; just validate-terms (passed); count-verified-snippets 127/127; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms plus check-qualifier-terms-online, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading (one new divergence found and fixed), check-environmental-evidence; verify-datasets 3/3 OK; check-groupings on Inherited_Arrhythmia_Syndromes (SATISFIED); validate-disorders as the final batched sweep; pytest tests/test_data.py. Compliance moved 89.5 to 99.7 percent. RED-TEAM REVIEW BEFORE COMMIT: a subagent review against .claude/skills/dismech-pr-review raised 20 findings and all were acted on. The substantive ones: the four prevalence records initially asserted prevalence_class ABOVE_1_IN_1000 and rate_per_100000 for ascertainment-conditioned cohorts, which would have exported as SSS2 population prevalence, so the three cohort-share records were moved to genetic.case_fractions (the slot this entry's own notes already named as correct for a genetic-spectrum share) and only the Danish population-scale record remains under prevalence; the biventricular-noncompaction frequency was cut from FREQUENT to OCCASIONAL because the 53.1% is conditioned on already having noncompaction rather than measured across SSS2 carriers; the aortic progression phase no longer claims adult onset, since the cited family has dilatation in two adolescents and none in their 50-year-old mother; the childhood phase no longer says carriers have no device indication, since the proband in that same family had 66 pauses of three seconds or longer and was implanted; the geo:GSE279632 record now names the CITE-seq component it actually is rather than the whole series; the hiPSC-line limitation no longer assumes the heterozygous carrier is affected, which a consanguineous pedigree does not establish; two weak causal-edge snippets were replaced (a disease definition, and an eight-word generic sentence that omitted sudden cardiac death) and directness INDIRECT was added to every item resting on generic sinus-node-dysfunction literature; the SSS4 differential explanation now says its quote is that paper's background summarising the primary GNB2 report rather than its own KCNJ5 result; and an unsourced superlative on the D553N allele was dropped. Acting on the review's content-gap finding, a Stroke Prevention in Atrial Fibrillation treatment (PMID:37977871, PMID:40315941) and a paired knowledge-gap discussion were added, scoped to documented atrial fibrillation because the meta-analysis states in terms that anticoagulation in sinus node dysfunction is untested. Two review points were answered in place rather than by the suggested change: the hiPSC I_f platform keeps fidelity MODERATE, since its own limitations already record the immaturity that grade reflects, and the CL:1000477 binding is kept with preferred_term rewritten to hiPSC-derived sinoatrial-node-like pacemaker cardiomyocyte so the ontology term carries the intended identity while preferred_term carries the qualification, which is the Ontology Term Contract pattern. Three new phenotypes were checked against the pathograph: biventricular noncompaction was given a causal edge from the trabecular compaction node, and mitral valve prolapse and prolonged QT interval were deliberately left unconnected with a line in each description saying why.

  summary: 'Address PR review: P883R modifier allele and Shox2 developmental lead'
  details: |
    Acts on the three optional suggestions in the ai4c-reviewer approval of PR #10683. SUGGESTION 1, PMID:31481236 cached without being cited or explained: curated as a new variant, HCN4 p.Pro883Arg, rather than explained away. It is the one allele in this entry that does not fit the uniform loss-of-function pattern. PMID:25145518 reports it segregating with the combined sinus node dysfunction and noncompaction phenotype in an unrelated proband, while PMID:31481236 characterises it functionally as shifting activation to more depolarised potentials and, co-expressed with wild type as in a heterozygote, producing higher rather than lower current density, and reads it as a modifier acting with a common KCNE1 variant rather than as an SSS2 allele. Its minor allele frequency of about 0.9 percent is recorded as a further argument against full penetrance. Both readings are curated: the segregation observation as SUPPORT, the electrophysiology as REFUTE against the loss-of-function reading of this allele, and the modifier conclusion as SUPPORT. A matching REFUTE item was added in the genetic block against the PMID:26835093 statement that all HCN4 mutations described so far are loss-of-function, and that item's explanation now says the statement holds for every allele curated here except P883R. This is the two-items split the evidence SOP asks for when one quoted claim cuts both ways, not a downgrade of the review's finding. SUGGESTION 2, the Shox2 to Tbx3 to Hcn4 developmental programme: PMID:19166829 added to the developmental-versus-rate-driven noncompaction discussion, with its limit stated in both the rationale and the evidence explanation. It shows Hcn4 sitting downstream of a transcriptional cascade rather than being an isolated channel gene, which is what makes a developmental reading coherent at all, but the cascade it describes builds the sinoatrial node and not the compacted ventricular wall, and it is mouse, so it carries directness INDIRECT and two named inference steps. It was deliberately not written as evidence that the compaction phenotype is developmental, which the paper does not show. SUGGESTION 3, stale PR description: the body had already been rewritten before the reviewer job read it, since that job started at 08:54:53 and the rewrite landed shortly after. The corrected body names the fourth progression phase as aortic dilatation with onset not reliably age-ordered, which is what the YAML says. NOT-CITED CACHES: a new UNCITED REFERENCE CACHES paragraph in notes records why PMID:27173043 and PMID:33185997 are cached but not cited. Both are empty in the cache, verified at zero bytes of body after the Content heading, so there is no text to attach a snippet to; PMID:27173043 in particular is the primary Vermeer 2016 aortic-dilatation report and would otherwise be the better citation than the case report currently used. VALIDATION ACTUALLY RUN: just validate; just validate-terms (passed); count-verified-snippets 138/138; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading; check-source-defect-claims, which reports nothing against this file and so does not contradict the new uncited-cache claim; validate-disorders as the final batched sweep; pytest tests/test_data.py. Compliance holds at 99.7 percent.

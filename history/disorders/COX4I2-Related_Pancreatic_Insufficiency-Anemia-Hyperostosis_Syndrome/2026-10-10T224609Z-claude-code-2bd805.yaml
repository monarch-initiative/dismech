  summary: Clarify COX4I2 contributes to COX activity; add genetic fields
  details: |
    COX4I2 is a non-catalytic Complex IV subunit. The GO:0004129 descriptor on the Complex IV node now says it names the holoenzyme activity COX4I2 contributes to, matching the contributes_to qualifier in the ai-gene-review COX4I2 review. Added relationship_type CAUSATIVE and variant_origin GERMLINE, and a note that ClinGen rates COX4I2 Limited for the broader mitochondrial disease concept (MONDO:0044970), which is not this entry's disease.

  summary: Review COX4I2 disease against full clinical and mechanistic texts
  details: |
    Reviewed the original entry and targeted disease research report against the complete Shteyer 2009 primary text, Huttemann 2012 mouse paper, Sommer 2017 pulmonary oxygen-sensing study and Pajuelo Reguera 2020 isoform-replacement study. Used the relevant Scheers/Berardis 2022 clinical-review sections, correcting the research report’s author attribution in source assessment. Captured five affected relatives, variable hyperostosis, neurologic and additional clinical manifestations, exact E138K segregation, cobalt-chloride assay context, normal lactate and fibroblast COX activity, and directly reported supportive-treatment outcomes. Separated observed transcript, pancreatic and erythroid changes from proposed tissue-specific complex IV and osteoclast mechanisms. Removed unsupported assembly-module conformance and corrected the associated grouping criterion. Added explicitly limited cell and animal models, including the knockout mouse’s failure to reproduce pancreatic pathology. Verified normal-tissue expression accession geo:GDS1096; it is not an EPIDACH patient cohort. GeneReviews and StatPearls checks find no matching chapter. Examined the broader COX-deficiency variant-screening lead (PMID:22592081), whose available primary text is abstract-only; did not promote secondary-source heterozygous-variant annotations to confirmed disease alleles. Clinical literature does not establish reliable frequencies, separate molecular subtypes, gene-specific prognosis or disease-modifying treatment. Updated the node-class leaf to the observed pancreatic lesion. Source access and limitations are documented in the worktree source audit; no reference cache was hand-written.

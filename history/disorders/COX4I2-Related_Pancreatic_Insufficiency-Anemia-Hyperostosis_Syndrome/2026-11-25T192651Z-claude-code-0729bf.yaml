  details: |
    COX4I2 relationship_type changed from CAUSATIVE to UNKNOWN. The syndrome is known from a single consanguineous kindred (Shteyer et al. 2009, PMC2668012) carrying homozygous p.Glu138Lys; a 2026 literature search found no second family. ClinGen rates COX4I2 Limited (AR) only for the broader mitochondrial disease concept (MONDO:0044970), which is not this entry's MONDO:0012992, so no tier is recorded. CAUSATIVE is reserved for Definitive or Strong validity. Mechanism nodes unchanged: the Complex IV node keeps GO:0004129 as the holoenzyme activity the non-catalytic COX4-2 subunit contributes to.

  summary: 'Review round 1: HLD12 (VPS11) reviewer response'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11129 (two blocking
    items plus the worthwhile suggestions) in one bundled push.

    Blocking:
    1. Wired the disconnected CNS Neuronal Death node into the pathograph: added a
       downstream edge from Impaired Autophagic Flux -> CNS Neuronal Death
       (causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES) with the PMID:27120463
       zebrafish snippet (MODEL_ORGANISM, directness INDIRECT). It no longer renders
       as a second co-equal initiating lesion.
    2. Added module conformance on the two mapping nodes: Oligodendroglial
       Differentiation Failure -> cns_myelin_failure#Oligodendrocyte Differentiation
       Arrest and Death, and CNS Hypomyelination ->
       cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath. Deliberately not
       conformed at the VPS11 trigger node (ubiquitous endolysosomal machinery, not
       oligodendrocyte-specific), per the module SCOPE note.

    Suggestions taken:
    - prevalence: Ashkenazi Jewish CARRIER_FREQUENCY record (0.6%, rate_per_100000
      600) from the already-verified PMID:26307567 snippet; no qualitative tier
      paired with the carrier-frequency measure.
    - animal_models: added the zebrafish vps11(plt) record with modeled_mechanisms
      linking it to CNS Neuronal Death and CNS Hypomyelination
      (PARTIALLY_RECAPITULATES, model_scale TISSUE, limitations noting the truncated
      RING-H2 allele is not the human founder missense).
    - Renamed the phenotype "Global developmental delay and regression" to
      "Global developmental delay" (matching its HP:0001263 binding), updating the
      pathograph target too; regression stays modeled by the separate
      Developmental regression phenotype.
    - Added description prose to the three previously bare CNS Hypomyelination edges
      (developmental delay, spastic tetraplegia, axial hypotonia).
    - Moved the uncited later-onset dystonic/spastic-paraplegia (provisional DYT32,
      Storck et al. PMID:41551069) claim out of the description into notes, flagged
      as a distinct entity not curated here; the entry stays anchored on
      MONDO:0014732.

    Not taken, with reasons:
    - The two minor grading notes (line-211 HOPS/CORVET background statement
      IN_VITRO, yeast Mup1-GFP IN_VITRO): the reviewer judged neither worth changing
      on its own, and re-grading one reused sentence risks a check-snippet-grading
      divergence for no real gain.
    - classifications: left for the disease-classification skill rather than a
      guessed block; a wrong classification is worse than none, and the correct
      lysosomal-storage / Harrison's-part values need that skill's proper selection.

    Validation: just validate-disorders green (schema + terms + 38/38 snippets, up
    from 32). Offline gates pass: causal-targets (rename + new edge), entity-refs,
    duplicate-keys, enum-values, qualifier-terms; model-scale-audit --strict exit 0;
    81 model/conforms/divergence pytest cases pass.

  summary: HLD12 review round 2 — drop unsupported Developmental regression; add prevalence_class
    + classifications
  details: |
    Round-2 ai4c-reviewer CHANGES_REQUESTED response (commit on 835f4fca9).

    Blocking item — removed the unsupported "Developmental regression"
    (HP:0002376) claim. The reviewer searched all five cached references
    (including the full text of PMID:27120463) and found no wording for loss of
    acquired skills; every source says the opposite — global developmental
    STAGNATION (PMID:26307567), severe developmental DELAY (PMID:27120463,
    PMID:27473128). Stagnation is failure to acquire; regression is loss of what
    was acquired, and in a hypomyelinating leukodystrophy that distinction is
    diagnostically load-bearing, so HP:0002376 made the entry a false positive
    for regression queries. Per the reviewer's recommended (cheapest honest) fix
    I dropped the claim rather than hunt a source none of the five carries:
      - deleted the `Developmental regression` phenotype (HP:0002376) and its
        one evidence item (the "highly concordant disease progression" snippet,
        which describes a phenotype set, not milestone loss);
      - retargeted the `CNS Neuronal Death -> Developmental regression` downstream
        edge to `Global developmental delay`, reworded to progressive
        stagnation/failure-to-acquire (no new phantom pathograph node);
      - trimmed the description sentence at the top of the file
        ("developmental stagnation and then regression" -> "developmental
        stagnation");
      - trimmed the Global-developmental-delay phenotype description (removed the
        "modeled separately as Developmental regression" sentence);
      - fixed the `CNS Hypomyelination -> Global developmental delay` edge
        description that still said "and subsequent loss of, developmental
        milestones".

    Suggestions taken:
      - prevalence_class: ABOVE_1_IN_1000 on the Ashkenazi CARRIER_FREQUENCY
        record (600/100,000), and a separate Worldwide measure_type: UNKNOWN /
        prevalence_class: ULTRA_RARE record so the disease-rarity tier is
        queryable without riding on the carrier measure;
      - classifications: harrisons_chapter NEUROLOGIC (leukodystrophy, primary
        clinical home) and GENETICS_ENVIRONMENT_DISEASE (single-gene AR
        Mendelian), each backed by an exact-quote evidence snippet from an
        already-cited reference.

    Suggestion NOT taken, with reason:
      - lysosomal_storage_category. LysosomalStorageEnum classifies LSDs by
        accumulated substrate (sphingolipidosis, mucopolysaccharidosis,
        glycoproteinosis, glycogen, NCL, mucolipidosis). VPS11 disease is a
        HOPS/CORVET endolysosomal-tethering/trafficking defect with only
        SECONDARY storage (membranous cytoplasmic bodies, storage macrophages,
        abnormal urinary glycosphingolipids), not a catabolic-enzyme deficiency,
        so no substrate class applies. Tagging it sphingolipidosis on the
        phenotypic resemblance would be biochemically wrong; a wrong
        classification is worse than none.

    Validation: `just validate` 39/39 snippets; check-causal-targets,
    check-entity-refs, check-duplicate-keys, check-qualifier-terms,
    check-enum-values, and the whole-KB snippet gates all clean;
    `just validate-disorders` (authoritative) green.

  summary: 'Expand: Quebec Platelet Disorder primary functional evidence'
  details: |
    Third pass, replacing review-synthesis support with primary experimental evidence on the mechanism nodes. Two further references were fetched and cached: PMID:16689763 (whole-blood clot lysis studies) and PMID:19029443 (uPA expression across megakaryocyte differentiation). PMID:19029443 supplies direct evidence for three nodes - overexpression emerging at megakaryocyte differentiation without altering flanking genes, uPA co-localized with alpha-granule proteins and with plasminogen inside the granule, and alpha-granule proteins stored undegraded in the megakaryocyte, which locates the proteolysis in the platelet and explains why cargo transcript levels are normal. PMID:16689763 supplies the single most discriminating result in the entry: in whole-blood perfusion over preformed fibrin, QPD platelets adhered normally and accelerated fibrinolysis followed the adhesion. That substantiates the entry's most contestable curation decision - leaving the accelerated-lysis node unconformed to primary_hemostatic_plug_failure - with a measured result rather than a reading of the module's scope, and the notes were rewritten to cite it. The same paper's plasmin-inhibitor result was added to the tranexamic acid mechanism target, and its thromboelastography negative became a new diagnosis entry recording that global coagulation and viscoelastic testing do not detect the defect, which is a large part of why the disorder is missed. Snippets went from 34 to 41, all exact-quote verified; the entry from 893 to 1026 lines. The rendered page was generated and inspected - every graph node carries is_orphan false, so there are no phantom duplicate nodes - and then deleted, since pages/ is derived and must not be committed from a curation PR. Revalidated with the full gate set including validate-disorders, check-causal-targets, check-entity-refs and check-case-collisions.

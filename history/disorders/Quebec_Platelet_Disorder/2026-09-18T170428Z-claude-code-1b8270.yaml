  summary: 'Create: Quebec Platelet Disorder (MONDO:0011136)'
  details: |
    De novo curation of Quebec platelet disorder (MONDO:0011136, PLAU). Deep research was run with the falcon provider (research/Quebec_Platelet_Disorder-deep-research-falcon.md, 45 citations); the report passed 'just preflight-dr' against MONDO:0011136 with PLAU as the expected gene and matching OMIM 601709. The report was treated as leads only: every ontology CURIE was taken from cache/<prefix>/terms.csv rather than from the report, and three of the report's cited sources (Liang 2020, Blavignac 2011, Wilson 2023) were cached with empty bodies, so PMIDs were resolved by title search and re-fetched with 'just fetch-reference' before any of their text was quoted. Pathophysiology is a six-node chain from the 78-kb PLAU tandem duplication through sub-TAD enhancer adoption, megakaryocyte-restricted overexpression, alpha-granule uPA storage and intraplatelet plasmin generation to accelerated platelet-localized clot lysis, wired to all eight phenotypes (100 percent causal_inlink). Two nodes conform to primary_hemostatic_plug_failure at the component-loss and granule arms; the accelerated-lysis node is deliberately left unconformed because that module models a plug that never forms whereas QPD destroys one that did. Validated with just validate, validate-terms, validate-disorders (17/17 snippets verified), check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading, check-title-snippets, check-folded-hyphens and check-case-collisions. just check-groupings now surfaces the entry as a candidate member of Inherited_Platelet_Function_Disorders without editing that grouping, as its coverage notes anticipated. No prevalence block was recorded because the reviews carrying the Quebec and Canada estimates could not be fetched into references_cache.

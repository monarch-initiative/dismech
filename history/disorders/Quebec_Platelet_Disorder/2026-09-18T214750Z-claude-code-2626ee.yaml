  summary: 'Fix: biological_scale on the clot-lysis node contradicted the entry'
  details: |
    Self-review against the dismech-pr-review checklist found one substantive defect. The Accelerated Platelet-Localized Clot Lysis node carried biological_scale ORGANISM, which denotes a systemic state, while the node's own description says systemic fibrinolysis is normal and the effect is confined to the site of the plug. The tag contradicted the entry's central claim, which is that QPD is a platelet-localized rather than a systemic fibrinolytic defect. Corrected to TISSUE, the scale of a clot at a site of vascular injury. The consequence for the animal-model link is checked and benign: just model-scale-audit now classifies it MODEL_ABOVE_TARGET, a whole organism reporting a tissue-scale outcome, which needs no additional caveat and the link already carries limitations. Also verified in the same pass that the GO bindings satisfy the reviewer rule that GO terms be molecular or cellular rather than organ-level physiology: GO:0031639 plasminogen activation and GO:0042730 fibrinolysis are both molecular cascades. Reference-title coverage was confirmed complete, 41 of 41 evidence items carrying reference_title and 8 of 8 references entries carrying title, with just check-reference-titles reporting no titles below the 0.85 similarity threshold.

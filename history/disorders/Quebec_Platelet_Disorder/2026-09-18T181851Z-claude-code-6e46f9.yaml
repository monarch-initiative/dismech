  summary: 'Expand: Quebec Platelet Disorder diagnosis, causal-edge evidence, discussions'
  details: |
    Second curation pass, closing the gaps a peer comparison surfaced. The first pass was gate-clean but carried none of the sections all eight peer platelet-disorder entries have. Added: a diagnosis section (platelet uPA measurement, light transmission aggregometry, alpha-granule protein degradation analysis, PLAU breakpoint PCR) built on a newly fetched reference, PMID:18791940, which reports a family diagnosed by proteomics and confirmed by urokinase-specific Western blot; a datasets record for EGA EGAS00001004315, the controlled-access ChIP-seq/RNA-seq/4C-seq data behind the enhancer-rewiring result; two discussions, a KNOWLEDGE_GAP on what actually causes the thrombocytopenia and a HUMAN_MODEL_MISMATCH on the absence of any model carrying the human duplication; a references index; and evidence on nine causal edges plus the treatment mechanism target and the animal model entry. Snippets went from 17 to 34, all exact-quote verified, and compliance MISSING fields from 23 to 14. Four phenotypes and three differential diagnoses are deliberately left without evidence and the reason is recorded in the entry notes: their odds ratios fall below the threshold of the McKay abstract's summary sentence, so the supporting numbers are in that paper's results tables while the cached record is abstract-only, and quoting a sentence that does not name them would be worse than an empty slot. Prevalence remains uncurated for the same class of reason. Revalidated with validate, validate-terms, validate-disorders, check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-snippet-length, check-snippet-grading, check-title-snippets, check-enum-values, check-folded-hyphens and check-environmental-evidence; phenotype causal_inlink remains 8/8.

  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR 12171. The reviewer found that the entry's notes justified four uncited phenotypes on the grounds that the cached record is abstract-only, which is true of McKay PMID:15026313 but was generalized across every source. PMID:32663239 is cached as full_text_html and its discussion carries one sentence naming heavy menstrual bleeding, joint bleeds, spontaneous hematuria and wound-healing problems. The sentence was verified as an exact substring of the committed cache before use. It now evidences Hematuria, Prolonged Menstrual Bleeding and Poor Wound Healing, graded HUMAN_CLINICAL with quote_role BACKGROUND because it is the authors framing of the clinical picture rather than their own result, and it was also added to Joint Bleeding as a second independent source alongside the McKay odds ratio. Epistaxis stays uncited: the term appears in none of the eight cached references, which was confirmed by grep, so that slot is correctly empty. The notes block was rewritten to scope its justification to McKay and to record the earlier over-generalization explicitly, on the reasoning that an over-broad justification is worse than none because it tells the next reader to skip the check that would have caught it. The reviewer's non-blocking suggestion about genomic coordinates was also taken: the GRCh37 interval chr10:75,659,017-75,736,956 is now stated on the genetic record and evidenced from the same full-text cache, with quote_role left unset because a methods parameter is neither the paper's finding nor a restatement of anothers. Snippets went from 41 to 46, all exact-quote verified; compliance MISSING fields from 14 to 11. Three folded-scalar indentation errors introduced while editing were caught by just validate and fixed before commit.

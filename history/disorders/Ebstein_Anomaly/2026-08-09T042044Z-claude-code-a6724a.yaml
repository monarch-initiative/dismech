  summary: 'Create: Ebstein Anomaly'
  details: |
    Created a new KB entry for Ebstein anomaly (MONDO:0009144), a rare congenital tricuspid valve and right ventricular malformation.

    Deep research provider: claude_code, via `just research-disorder claude_code Ebstein_Anomaly` (research/Ebstein_Anomaly-deep-research-claude_code.md; 10 web searches, 12 turns, 37 citations).

    NEC preflight: `just preflight-dr research/Ebstein_Anomaly-deep-research-claude_code.md MONDO:0009144` returned SKIP, because MONDO records no causal gene (RO:0004003) for this predominantly sporadic disease and the automated gene-identity check therefore cannot discriminate. The manual fallback checks passed: the report's OMIM 224700 matches the MONDO xref, and MYH7 was the dominant gene mentioned (28 mentions), consistent with the known Ebstein/left-ventricular-noncompaction subtype.

    GeneReviews: no chapter exists. A PubMed search for `Ebstein anomaly GeneReviews[All Fields]` returned 0 results, consistent with a predominantly sporadic rather than Mendelian disease. This is recorded in the entry's top-level `notes`.

    Curated content: a nine-node pathograph running from failure of tricuspid leaflet delamination through apical displacement of the functional orifice, right ventricular atrialization, anterosuperior leaflet redundancy, failure of leaflet coaptation with tricuspid regurgitation, right heart volume overload, right-to-left interatrial shunting, the accessory atrioventricular pathway substrate, atrial remodelling with tachyarrhythmia, and fetal circular shunt physiology, with 11 causal edges of which 10 carry their own evidence. Also 13 phenotypes, 9 treatments (cone reconstruction, Starnes procedure, bidirectional cavopulmonary shunt, accessory pathway ablation, concomitant maze, neonatal ductal management, conservative surveillance, cardiac transplantation, genetic counselling) with target_mechanisms links back into the pathograph, 4 genetic entries (MYH7 CAUSATIVE with structured case_fractions; 1p36 and 8p23.1 deletions SUSCEPTIBILITY; NKX2-5 DISPUTED, with the negative screen recorded honestly as REFUTE evidence), an autosomal dominant Inheritance block scoped to the MYH7/LVNC subtype, 2 environmental entries (first-trimester lithium linked into the pathograph via influences_mechanisms with PREDISPOSES and INDIRECT_UNKNOWN_INTERMEDIATES; advanced maternal age deliberately left unlinked because the registry finding is an epidemiologic association, not a demonstrated mechanism), 6 diagnosis modalities, 3 differential diagnoses, three structured prevalence records, clinical_burden (VARIABLE), experimental_models, and one KNOWLEDGE_GAP discussion with two proposed experiments on the unresolved MYH7-sarcomere-to-valve-delamination mechanism.

    Corrections applied during verification of the deep-research output (all three ontology errors originated in the DR report and were caught by independent OAK lookup): HP:0004757 and HP:0004308 were both wrong for ventricular preexcitation (correct term is HP:0004309; HP:0004308 is Ventricular arrhythmia); CL:0002138 is endothelial cell of lymphatic vessel, not endocardial cell (correct term is CL:0002350); UBERON:0002102 is not the tricuspid valve (correct term is UBERON:0002134). Every cited PMID was independently fetched with `just fetch-reference` and its abstract read before use; the PMIDs the DR report attributed to specific claims (21604106, 25444217, 28591541, 19937010, 25535206, 23819422, 8031346, 1394922, 41819162) were all confirmed real and correctly attributed by esummary lookup.

    Datasets: added geo:GSE7527 (array CGH in non-syndromic congenital heart disease, 119 samples) after manual relevance triage. Exactly one sample in the GEO series metadata carries an Ebstein anomaly diagnosis, and the record's `notes` states that limitation explicitly, so the dataset cannot support any Ebstein-specific quantitative claim; it is included because copy number variation is the one genetic mechanism with reproducible support in this disease. The other 11 discovery candidates were gene-only matches on MYH7, GATA4, and NKX2-5 that concern hypertrophic cardiomyopathy, ovarian cancer, and transcription-factor binding respectively, and were rejected as Named Entity Confusion reached through dataset search.


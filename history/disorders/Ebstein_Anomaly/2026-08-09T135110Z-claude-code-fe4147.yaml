    - `just validate kb/disorders/Ebstein_Anomaly.yaml` - passed (schema, terms, references).
    - `just count-verified-snippets` - 132/132 verified against cached references, up from 116/116, 0 skipped by prefix.
    - `just validate-disorders kb/disorders/Ebstein_Anomaly.yaml` - passed. This is the batched pre-PR sweep CI runs.
    - `tests/test_data.py -k "subtype_foreign or unique_name or environmental_mechanism_targets or graph"` - 3808 passed, which exercises the new `has_subtypes` foreign keys and the renamed pathograph node.
    - `just compliance` - 98.3% global, 98.3% weighted, up from 98.1%/98.0%.

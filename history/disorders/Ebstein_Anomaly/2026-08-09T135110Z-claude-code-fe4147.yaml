  summary: 'Edit: Ebstein Anomaly - address PR #8261 review'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #8261 (0 critical, 2 important, 4 suggestions). All six items acted on.

    IMPORTANT 1 - right bundle branch block was not modeled. Added a `Right bundle branch block` phenotype bound to HP:0011710 Bundle branch block, and surfaced the finding in the `Electrocardiography` diagnosis modality. The reviewer's warning was correct and worth recording: line 842 of the deep-research artifact suggests HP:0011711 for RBBB, and HP:0011711 is actually `Left anterior fascicular block` - a fourth DR ontology error beyond the three caught during initial curation. HP:0011710 (the parent) was chosen over HP:0011712 Complete RBBB or HP:6000313 Incomplete RBBB because the cited source says "complete or incomplete right bundle-branch block" and does not distinguish. No `frequency` band is asserted: neither new source quantifies prevalence, and CLAUDE.md says omit rather than fabricate. Two new references fetched and cited: PMID:27751284 and PMID:28666538, the latter giving the clinically useful inversion that ABSENCE of RBBB in an Ebstein patient with SVT is a sensitive and specific marker of an ipsilateral accessory pathway concealing it.

    IMPORTANT 2 - medical-therapy arm absent. Added three pharmacotherapy treatments: (a) `Antiarrhythmic pharmacotherapy`, therapeutic_agent NCIT:C47793 Antiarrhythmic Agent, with a target_mechanisms INHIBITS edge onto the `Atrial remodelling and atrial tachyarrhythmia` node, curated at the honest strength the sources support - PMID:19937010 says "Only four patients are currently on antiarrhythmic drugs" and concludes ablation is the definitive treatment, so drugs are curated as the secondary line rather than the mainstay; (b) `Heart failure pharmacotherapy`, therapeutic_agent NCIT:C448 Diuretic, evidenced by the AATS 2025 goal-directed-medical-therapy statement, with the description explicitly scoping that recommendation to systolic LV dysfunction and flagging that diuretic use for right-sided congestion is standard practice rather than a disease-specific evidence-based recommendation; (c) `Prostaglandin E1 to maintain ductal patency`, therapeutic_agent CHEBI:15544, the mirror image of the existing medical ductal-closure entry, evidenced PARTIAL from a single documented case (PMID:31888914, newly fetched) that also shows the functional pulmonary atresia can reverse so prostaglandin may be weaned without a stent or shunt.

    SUGGESTION 3 - fetched-but-uncited references. PMID:33020344 now cited on cone reconstruction. The other three cannot supply verified snippets because their PubMed records carry no abstract text at all: PMID:25444217 is a JTCVS case-report letter, PMID:28958645 is a Seminars review without an abstract, PMID:36379695 is a Heart editorial comment. Their cache files contain only citation metadata. Citing them would require fabricating snippets, so they are left uncited deliberately. Note also that the reviewer's table rotated three titles - 28958645 is `Neonatal Ebstein Anomaly`, 33020344 is `Cone Repair in Adult Patients with Ebstein Anomaly`, and 36379695 is `Atrial fibrillation in Ebstein anomaly: weathering the storm`; the review's item 2 and its table both name 33020344 as the atrial fibrillation paper, which it is not.

    SUGGESTION 4 - conjunctive node names with a scale conflict. Renamed `Failure of leaflet coaptation and tricuspid regurgitation` to `Tricuspid regurgitation (haemodynamic lesion)` and rewrote its description so the node carries a single organism-scale claim, with the tissue-scale coaptation mechanism left where it already lived, on the upstream apical-displacement and anterosuperior-leaflet nodes. All three inbound references (two `downstream[].target` values and one treatment `target_mechanisms[].target`) updated. The other two conjunctive names were left as-is: the reviewer classed them as mild, each pairs a cause with its immediate consequence rather than a multi-step chain, and neither carries a conflicting scale.

    SUGGESTION 5 - missing therapeutic_agent on NCIT:C15986. Added NCIT:C257 Nonsteroidal Antiinflammatory Drug to the medical ductal-closure entry.

    SUGGESTION 6 - no has_subtypes, no severity grading. Added a `has_subtypes` entry `MYH7-LVNC` for the Mendelian minority, with the MYH7 gene descriptor and two evidence items, and scoped both the `Left ventricular noncompaction` phenotype and the `MYH7` genetic entry to it via `subtype:`. The subtype description states explicitly that Carpentier A-D and the Celermajer index are severity scales rather than subtypes and belong under `diagnosis`, which is where they were added: the echocardiography modality now carries the Celermajer index formula and its four grades (PMID:31711824, newly fetched), plus the caveat that echocardiographic and cardiac-MRI derived grades agree only fairly so the grade is modality-dependent. The fetal echocardiography modality now carries the TRIPP score parameters (PMID:31008542, newly fetched) and a REFUTE evidence item recording that the Celermajer index and cardiothoracic area ratio did NOT reach significance for perinatal mortality in that cohort - so anatomic severity is not presented as a reliable fetal prognostic marker.

    Not done: the reviewer's non-blocking note on pulmonary hypoplasia (HP:0002089) in severe fetal cases. No cached source states it for Ebstein anomaly specifically, and adding it would require asserting a phenotype without a verifiable snippet.

    References added to the cache and cited: PMID:27751284, PMID:28666538, PMID:31888914, PMID:31711824, PMID:31008542. Also fetched during triage but not cited: PMID:17228014 and PMID:39085031, both of which have no abstract text.


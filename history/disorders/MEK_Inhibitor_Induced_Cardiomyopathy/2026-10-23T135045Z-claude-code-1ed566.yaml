  summary: 'Create: MEK Inhibitor-Induced Cardiomyopathy'
  details: |
    New drug-toxicity disease entry for cardiac dysfunction under MEK1/2 inhibition, the clinical counterpart of the new mek_inhibition_cardiac_mitochondrial_injury module, which all three pathophysiology nodes conform to. Clinical evidence from five human sources: the Glen 2025 prospective melanoma cohort (PMID:41065626), the Glen 2023 longitudinal cohort (PMID:37969652), the Mincu 2019 meta-analysis (PMID:31397860), the Robison paediatric cohort (PMID:35233653) and the TRAIN trametinib-monotherapy trial (PMID:41864169), with the Banks/Jensen index case (PMID:28861837). No disease_term is bound: MONDO codes anthracycline and doxorubicin cardiomyopathy specifically and has no MEK-inhibitor, kinase-inhibitor or generic drug-induced cardiomyopathy class. The nine ols:mondo searches run are recorded verbatim in review_notes, and MONDO:0004994 cardiomyopathy is recorded as skos:broadMatch so the concept is not retired from the curation queue; a MONDO term request is the stated follow-up. No prevalence block, following the reasoning already recorded in Anthracycline_Induced_Cardiomyopathy: every published figure is cumulative incidence in a treated cohort and partly measures surveillance intensity, so the cohort figures sit on the clinical features with their cohorts named instead. No biomarker_term on the NT-proBNP record either; an inferred-ancestor walk shows neither NCIT:C88522 nor NCIT:C96610 is reachable from NCIT:C16342 Biomarker, and that is recorded in review_notes with the search. Two REFUTE evidence items are deliberate rather than oversights: the paediatric cohort's 'Symptomatic heart failure did not occur' against the heart-failure phenotype, and the TRAIN finding that on-treatment NT-proBNP stayed normal in most cases, which refutes the monitoring claim a reader would otherwise carry over from the positive baseline association. The central discussion records the risk-prediction failure, which is the entry's main point: four independent cohorts found no baseline predictor, the HFA/ICOS tool's utility is explicitly limited here, and the mechanism-derived candidates (circulating cell-free mtDNA, interferon tone, neutrophil-to-lymphocyte ratio, cardiac high-energy phosphate reserve) are all untested in this setting. A third discussion, added after the clinical set, is a
    HUMAN_MODEL_MISMATCH on the paediatric developmental window: MEK inhibitors
    are given to children for years, MEK-ERK input actively maintains
    ventricular cardiomyocyte identity, and reduced upstream MAPK input across
    the murine proliferation-to-maturation window produces dilated
    cardiomyopathy detectable only by three months of age - whereas the one
    paediatric cohort had a median twelve months of follow-up and reports
    reversibility during the exposure period rather than adult outcomes. All 42
    snippets and 52 titles verified against references_cache; linkml-validate, term validation and validate-disorders pass.

  details: |
    Two items, both consequences of the round-1 edits rather than new content.

        The biochemical notes still ended 'No biomarker_term or loinc_term is bound; see review_notes for the searches' after round 1 bound biomarker_term to NCIT:C88524 eleven lines above, so the note contradicted the record it sat on. Only the LOINC half remained true. Corrected to name LOINC alone and to point at the recorded reason rather than a search that failed. This is the prose-describing-repository-state rot that the round-1 history record itself cited, reproduced in the same push that cited it, which is some evidence that the failure mode is about proximity rather than carelessness: the stale sentence was eleven lines from the change that invalidated it.

        Four evidence items on mekicm_baseline_risk_prediction_failure were regraded from REFUTE to SUPPORT. They were graded REFUTE when the gap asserted that no baseline parameter discriminates, so stating a positive baseline finding refuted the claim they hung on. Round 1 rewrote that rationale to assert those positives itself, which inverted the relation and left the grades describing the superseded thesis. Since supports is claim-relative, evidence stating a claim the rationale now makes is SUPPORT. Each explanation was rewritten to name which part of the rewritten rationale it supports, rather than only flipping the enum value. The reviewer raised this as non-blocking and defensible; it is taken as a real defect because a reader filtering on supports would otherwise see the entry's own asserted claims marked as refuting the discussion that asserts them.

        Two REFUTE items remain and are correct: the paediatric cohort's 'Symptomatic heart failure did not occur' against the heart-failure phenotype, and the TRAIN result that on-treatment NT-proBNP stayed normal in most affected patients, which refutes a monitoring claim a reader would carry over from the positive baseline association. Neither is affected by the regrade, because both still contradict the claim they attach to.

        No snippet text changed in this round, so no quote needed re-verification; the four regraded items keep their verified snippets. Validation: validate-disorders passes with 47 snippets and 57 titles; check-entity-refs, check-folded-hyphens, check-folded-yaml, check-duplicate-keys, check-enum-values and check-block-scalar-comments report no new findings.

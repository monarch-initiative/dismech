  details: |
    Response to the reviewer verdict on PR #7853 (REQUEST_CHANGES, two IMPORTANT and two SUGGESTION findings). The missing-deep-research finding is being handled at batch level and is not addressed here.

    IMPORTANT 1, content-free snippet (accepted). The phenotype 'Seizure precipitated by febrile infection' (HP:0032894) carried the snippet 'At the age of 2' from PMID:38365196. That is verbatim and clears the five-word CI floor, but it carries no proposition: no seizure, no fever, no temporal association. It is replaced by the full case-2 sentence, 'she had a generalized seizure with fever, lasting for 1 minute, and she gradually lost the ability to walk, speak, and swallow within the following 3 weeks', which is in references_cache/PMID_38365196.md and spans three wrapped cache lines that the validator normalises. The explanation no longer apologises for an anchor; it states what the quote shows, namely that the febrile seizure is the opening event of a course from which the child does not recover, which is the discriminator the phenotype description sets out. The original ligature caution was well founded in general (the reference validator does not fold typographic ligatures, only the repo-side helper does) but this particular span is ligature-free.

    SUGGESTION 3, over-hedged prevalence caveat (accepted). 'None of this must be read as a statement about where the disorder actually occurs' read as an instruction to the reader. Reworded to 'That distribution reflects reporting and consanguinity patterns, not the true geographic range of the disorder.' Same caution, no change of meaning.

    SUGGESTION 4, unsourced MRI pitfall (accepted). The diagnosis node 'Serial brain and spinal cord MRI' asserts in prose that 7 of the 28 patients who ever had an abnormal MRI had a normal first scan. The attached snippet is abstract-level and does not carry it. A notes: block now names the source precisely, Table 1 of PMID:38365196, MRI findings block, row 'Normal at first imaging study but abnormal during follow-up', giving 7/28 (25) beneath 'Abnormal 28/36 (77.7)'. It also records a further self-contradiction in that paper: the running text renders the same 25 percent as n = 8, and since 25 percent of 28 is 7 the table figure is used. The row cannot be quoted as a snippet because it carries a ligature in 'first' which the reference validator does not fold; this was confirmed empirically against SupportingTextValidator.normalize_text before choosing the notes route over an evidence item.

    Independent re-verification carried out during this pass, not taken on trust from the prior record. HP:0025215 'Triggered by febrile illness' was re-checked with runoak ancestors -p i and does sit under HP:0012823 Clinical modifier, so the note at the febrile-seizure phenotype is accurate and HP:0032894 is the right binding. The six differential-diagnosis MONDO terms asserting RO:0004003 relationships (MONDO:0008840 ATM, MONDO:0008842 APTX, MONDO:0014557 PNKP, MONDO:0011801 TDP1, MONDO:0011841 SLC19A3, MONDO:0011724 SLC2A1) were re-run through runoak relationships and all six returned exactly the stated gene; MONDO:0007163 returned no RO:0004003 edge, which is what its note already says. The five PMIDs cited in the NEC preflight as the discarded 'Alzheimer's Disease Polygenic Risk Score' collision were checked against PubMed esummary and are all real Alzheimer or dementia papers, so that provenance claim holds. The GeneReviews negative was re-run as '"GeneReviews"[ta] AND (ADPRHL2 OR ADPRS OR ARH3 OR CONDSIAS OR "stress-induced childhood-onset neurodegeneration")' and returned zero records, confirming the dated negative the reviewer could not re-run. The quantitative prose figures were re-traced to the cache: 25.5 percent normal and 16.2 percent delayed milestones at PMID_38365196.md lines 312 and 607, weakness 27/47, ocular 15/47, respiratory insufficiency 14/47, spinal cord 7/12, consanguinity 30/42, and the Table 2 nationality list of PMID:32746785 including Kosovo and Poland.

    Nothing was rejected. All three actionable findings were correct as stated.


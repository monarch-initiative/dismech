  details: |
    Post-review correction pass on the CONDSIAS entry in response to an independent adversarial verification of the branch, plus the snippet-length CI gate (scripts/check_snippet_length.py --against-ref origin/main, .github/workflows/main.yaml) that the original curation did not run.

    CI gate. Six evidence snippets were under the five-word floor and were lengthened to the minimal verbatim span that still carries a proposition: 'axonal polyneuropathy (9/23; 39.1%)' -> 'regression (28/43; 60.4%), axonal polyneuropathy (9/23; 39.1%)' at pathophysiology[9].evidence[1], phenotypes[8].evidence[0] and diagnosis[2].evidence[0]; 'regression (28/43; 60.4%)' -> 'Triggering factors (28/47; 59.5%) and regression (28/43; 60.4%)' at phenotypes[4].evidence[0]; 'axonal (sensori-)motor neuropathy' -> the full 'key clinical features including ...' clause at phenotypes[8].evidence[1]; and 'cataracts in patient 1' -> the whole sentence 'Extra-neurological manifestations included ichthyosis in patients 1 and 2 and cataracts in patient 1.' at phenotypes[18].evidence[0]. All 98 snippets remain verbatim.

    Denominator error, stated twice. Table 1 of PMID:38365196 gives 'Normal at first imaging study but abnormal during follow-up 7/28 (25)', where 28 is the abnormal-MRI group, not the 36 imaged patients. The progression phase 'Progressive neurodegeneration' and the diagnosis node 'Serial brain and spinal cord MRI' both read the 25 percent against all imaged patients, overstating it by about 1.3x. Both now state 7 of the 28 patients with an abnormal MRI (25 percent). The clinical point, repeat the scan, is unchanged.

    Case narrative misread. The 'Stress-triggered episodic deterioration' phase said the head tilt of case 1 'remitted without treatment for two months'. The source says the attacks occurred about weekly and 'lasted for about 2 months and resolved without any treatment', with recurrence in the last six weeks; two months is the duration of the attack phase, not of the remission. Reworded to follow the source.

    Nomenclature. The genetic notes claimed ADPRLH2 appears in the title of PMID:35664652. It does not; the title is 'Child-Onset Cerebellar Ataxia Caused by Two Compound Heterozygous Variants in ADPRS Gene: A Case Report' and ADPRLH2 appears only in the abstract body. Corrected and the abstract phrase quoted. The AHR3-in-title claim for PMID:33528672 was correct and is kept.

    Unsourced prose removed or repaired (issue 7791). (a) The animal_models mouse description asserted cardiac dysfunction in Arh3-deficient mice improved by rucaparib, attributed to PMID:36945462, a reference the entry itself said had not been fetched and which is not in references_cache; the claim and the 'bioRxiv preprint' characterisation are deleted and replaced by an explicit statement that no cardiac phenotype was established from any source read. (b) The inheritance description said compound heterozygous genotypes 'were initially thought not to occur'; no source states this and PMID:38365196 already tabulates two compound heterozygotes among 47, so the claim is replaced by the actual count, and the echo in the genetic evidence explanation is reworded. (c) The SCAN1 differential asserted 'essentially a single extended Saudi kindred'; no cached source supports it and the bullet is deleted, leaving the clinical contrasts. (d) 'clinical_trials: is absent: a search found no registered interventional trial' is replaced by a statement of what was actually done, that no source read reports one and no registry was queried. (e) The prevalence ascertainment note's country list is now anchored to Table 2 of PMID:32746785, which tabulates the nationality of each reported family.

    Three verifier findings were rejected. The cytoband 1p34.3 is in the cache, at PMID_38365196: 'loss of function variants in the ADPRHL2 gene on chromosome 1p34.3, which encodes ARH3'; the verifier's grep missed it. The ADPRS[TIAB] acronym-collision preflight and the GeneReviews negative are already phrased as searches performed on a stated date and carry real curatorial weight, so they are kept as process claims. The HPOA per-cohort fractions are correctly attributed to a dated ontology.jax.org retrieval and the verifier independently re-fetched and confirmed every one.

    Validation after the changes: just validate PASS, just validate-terms PASS, check_snippets_verbatim.py 98 verified 0 failed, check_folded_hyphens.py --check OK, check_snippet_length.py --against-ref origin/main OK no new findings, pytest tests/test_data.py all passed 0 failed. HP:0025215 was re-checked with runoak ancestors -p i and does sit under HP:0012823 Clinical modifier, confirming the note at the febrile-seizure phenotype.

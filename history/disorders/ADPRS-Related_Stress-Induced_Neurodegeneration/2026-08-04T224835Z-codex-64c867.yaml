  summary: 'Publication review: ADPRS-related stress-induced neurodegeneration'
  details: |
    Publication-completeness and claim-evidence review of the ADPRS/CONDSIAS
    entry. Cross-checked the matching claude_code deep-research report and
    citation sidecar against the structured YAML across phenotype coverage,
    subtypes, mechanism depth, treatments/trials, genetics,
    diagnostics/biomarkers, references, and overall consumption. Major research
    themes are represented; no formal subtype or clinical-trial omission was
    found. Corrected semantic issues not detectable by schema/reference
    validators: connected 20 of 23 phenotypes to the pathograph (the remaining
    hearing loss, ichthyosis, and cataract lack an established mechanism, with
    the latter two explicitly possibly coincidental); changed the seizure
    binding from bilateral tonic-clonic seizure to the evidence-supported parent
    Seizure; separated an Oculomotor apraxia assertion from a separately
    evidenced Nystagmus phenotype; based the cerebellar-atrophy frequency on the
    phenotype-specific HPOA cohort count rather than a combined imaging
    endpoint; removed unsupported peripheral-neuron apoptosis and brainstem
    cell/anatomy assertions; and qualified speculative modifier,
    respiratory-surveillance, ventilation-benefit, PARP-treatment,
    chromatin-scar, and empiric SLC19A3-treatment language. Automated-review
    follow-up also corrected a febrile-seizure edge description, reconciled
    residual brainstem wording, and documented deliberate module-process
    omissions. Validation: schema PASS, term validation PASS, reference
    validation PASS with 99/99 snippets verified; connectivity improved from
    0/22 to 20/23. Validator-induced broad references_cache churn was explicitly
    discarded and is not part of the review diff.

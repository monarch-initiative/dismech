  summary: 'Create: ADPRS-Related Stress-Induced Neurodegeneration (CONDSIAS)'
  details: |
    Deep curation of CONDSIAS, MONDO:0100095 / OMIM:618170 / ADPRS (HGNC:21304), which was previously absent from kb/disorders entirely.

    NEC preflight was run with OAK before any content was written. runoak -i sqlite:obo:mondo info MONDO:0100095 -O obo returns relationship RO:0004003 HGNC:21304 ADPRS, xref OMIM:618170, xref Orphanet:694922 and the synonym CONDSIAS; runoak -i sqlite:obo:hgnc info hgnc:21304 returns ADPRS. Literature searches deliberately covered all three names for the gene - ADPRS (current HGNC symbol), ADPRHL2 (former symbol, used by the MONDO definition and by both 2018 founding papers) and ARH3 (protein name, used by essentially all of the biochemistry) - because a search on any one name misses most of the evidence base. One concrete NEC hazard was found and discarded as a block rather than cherry-picked: a PubMed query on ADPRS[TIAB] returns mostly Alzheimer disease neuroimaging and epidemiology papers in which ADPRS is an author-coined abbreviation for Alzheimer's Disease Polygenic Risk Score. None of that material appears in the entry.

    Content: 21 cited references supporting a 12-node pathophysiology graph running from bi-allelic inactivating ADPRS variants, through loss of ARH3 serine-ADP-ribosylhydrolase activity, the physiological stressor trigger, the two parallel molecular consequences (persistent serine-mono-ADP-ribose chromatin scars with deregulated histone acetylation and transcription; failure of poly-ADP-ribose turnover under stress with NAD+ consumption and AIF-mediated parthanatos), to the tissue and organism endpoints (selective neuronal loss with cerebellar and cerebral atrophy, distal axonal degeneration of peripheral nerve, episodic stepwise neurological deterioration, brainstem respiratory network failure). Two competing mechanistic hypotheses are curated rather than adjudicated, with hypothesis_groups on the relevant causal edges: canonical_par_parthanatos_model (CANONICAL) and mar_chromatin_scar_transcriptional_model (ALTERNATIVE, carrying an explicit REFUTE evidence item from PMID:34019811).

    Honesty about gaps: five discussions record what is genuinely unknown - whether febrile illness actually produces the proposed PAR burst in a patient (every experimental stressor in the literature is a surrogate), whether the mono-ADP-ribose scar or the poly-ADP-ribose excess is the toxic species (two studies from overlapping groups disagree), that no model reproduces chronic spontaneous neurodegeneration (HUMAN_MODEL_MISMATCH), that neuropathology is essentially absent from the literature, and that stress avoidance has never been tested. Purkinje cells are deliberately not bound to the cerebellar node and no histopathology section is asserted, for that reason.

    Three source-internal inconsistencies were caught and are recorded rather than propagated: PMID:38365196 gives regression as 28/43 in its abstract but 26/43 in Table 1 with a stated 60.4 percent; the same paper gives seizure as 34 percent presenting but 23.4 percent clinical in one table; and it writes the recurrent Turkish allele as both c.235A>C and c.235C>A for the same p.Thr79Pro change (ACG to CCG requires c.235A>C). Frequency bands are asserted only where a percentage is quotable from a cached abstract; where the pooled review and the HPO annotation set disagree on a denominator, no band is given.

    Validation run 2026-08-01: just validate PASS (schema, terms and references), just validate-terms PASS, just validate-references PASS with 98/98 snippets verified, scripts/check_snippets_verbatim.py PASS 98 verified 0 failed, scripts/check_folded_hyphens.py --check OK, uv run pytest tests/test_data.py 16782 passed 0 failed.

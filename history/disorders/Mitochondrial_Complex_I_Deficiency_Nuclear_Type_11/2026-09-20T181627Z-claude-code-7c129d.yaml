  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 11'
  details: |
    New entry for MC1DN11 (MONDO:0032617, NDUFAF1/CIA30), the isolated complex I deficiency caused by biallelic variants in an assembly factor rather than a structural subunit.

    Duplicate preflight was run across all three surfaces before starting - origin/main kb/ by MONDO ID, label and synonyms; PRs all states; issues all states. It surfaced that the first candidate, Garg-Mishra progeroid syndrome, has an open claim issue (#9047) assigned to a human, so that disease was left alone and MC1DN11 chosen instead. MC1DN11 had no entry, no claim and no PR.

    Deep research: falcon was requested and is not configured here, so the run used --fallback rather than a hand substitution. The report is research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_11-deep-research-claude_code.md and records fell_back: true, requested_provider: falcon, ProviderNotConfiguredError in its own frontmatter. just preflight-dr returns PASS (NDUFAF1=75, OMIM 618234 matching both sides).

    The pathograph is a causal chain with a disease-specific metabolic arm rather than the generic mitochondrial-decline chain. PMID:31121247 shows a Warburg-like glycolytic switch is a feature of complex I ASSEMBLY defects specifically, driven by ROS from stalled intermediates; PMID:21931170 and PMID:17557076 both document those intermediates in NDUFAF1 patients (the latter giving a ~400 kDa stalled complex). Every item from PMID:31121247 is graded INDIRECT, since its cohort is assembly defects as a class with no NDUFAF1 line named.

    An adversarial red-team pass with fresh context found a serious error and it is worth recording plainly. An earlier draft read only the abstract section of references_cache/PMID_17557076.md and then asserted in notes that the case-report full texts were not cached. That file is a 51 KB full_text_html record. The false negative-existence claim - the exact failure mode the dismech-terms guidance describes - had suppressed the index patient's twenty-year clinical history, the only numeric lactate in the corpus (5-10 mM against a stated normal below 2.5 mM), the 36% residual complex I activity, and the stalled-intermediate size. Ten phenotypes were added from that full text (failure to thrive, developmental delay, hypotonia, Wolff-Parkinson-White syndrome, cerebral visual impairment, pigmentary retinopathy, kyphoscoliosis, osteoporosis, intellectual disability, myopathy), along with an environmental section for the infection trigger and a diagnosis section for blue native PAGE. Four claims previously dropped as unsourced were in fact in that cache and are now curated with quotes; two genuinely wrong report figures remain rejected and are named in notes.

    The same pass caught three further defects of mine: a claim that hypertrophic cardiomyopathy runs through all four cases, which PMID:24963768 (a leukodystrophy with no reported cardiomyopathy) falsifies; a statement that the cardiac phenotype is what kills these patients, which the full text contradicts - the index patient was alive and medically stable at twenty; and Encephalopathy wired downstream of Cardiomyocyte Bioenergetic Failure. Also corrected: an inheritance block saying two molecular diagnoses when four are reported, a REFUTE graded on a snippet that did not mention the phenotype (now NO_EVIDENCE on the sentence that does), three patient-fibroblast items graded HUMAN_CLINICAL where the parallel rescue item was IN_VITRO (all now IN_VITRO), two orphaned mechanistic_hypotheses groups (the assembly edge now opts in), and the 2016 case misdated 2014.

    A stale cached ontology label was found and deliberately not fixed: HP:0003236 is cached as 'Elevated circulating creatine kinase concentration' (row dated 2026-03-18) while live OLS gives 'activity'. Correcting the row re-derived cleanly and then failed all 73 pre-existing KB entries carrying the old label, so it was reverted and the entry matches the KB. The label is used 76 times across 74 files; renaming it is its own migration and is flagged in notes.

    Validation: just validate 51/51 snippets verified, just validate-terms passed, 18/18 phenotypes causally connected, all offline gates clean, all reference_title values re-derived from cache frontmatter with 0 mismatches, prose-figure-audit clean, just validate-disorders passed. Four fetched-but-uncited caches were pruned against a freshly re-derived cited list.

  summary: Bind the Giardia stool antigen EIA as a LOINC measurement
  details: |
    Added measurements: LOINC:31830-3 (Giardia lamblia Ag [Presence] in Stool) to the existing Stool antigen enzyme immunoassay diagnosis row, which already carries an NCIT ELISA qualifier. The LOINC code is method-unspecified (not the narrower 'by Immunoassay' variant) so it stays the identity-level code for the antigen test regardless of immunoassay platform; the stool specimen is intrinsic to this antigen assay, not an interchangeable method choice. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch7 (LOINC_DIAGNOSTICS.md tranche B).

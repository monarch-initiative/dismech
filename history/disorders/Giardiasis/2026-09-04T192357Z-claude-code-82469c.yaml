  details: |
    PR Shepherd review round addressing ai4c-reviewer's two blocking findings, both about frequency bands.

    IMPORTANT 1 - the villous-shortening finding was banded OCCASIONAL while its own snippet reports 3.7 percent. FrequencyEnum puts OCCASIONAL at 5-29 percent and VERY_RARE below 5 percent, so the band is now VERY_RARE and the evidence explanation states the arithmetic.

    IMPORTANT 2 - the CD4 intraepithelial lymphocytosis finding carried frequency OCCASIONAL justified by a snippet containing no proportion. Took the reviewer's second option and dropped frequency entirely rather than rebanding it: the PMID:30500895 CD4 result is a group-level mean comparison over 28 patients, not a fraction of cases, and no cited source reports the proportion of patients above a CD4 IEL threshold. The mis-explained second evidence item was replaced with the sentence the reviewer identified, 'In our study, only a few subjects had increased CD3 IEL counts >30', which is the actual source for the description's minority-of-cases claim about CD3; its explanation now says it grounds the wording without licensing a band. The description records why no band is given.

    Non-blocking suggestions taken. Suggestion 1: PMID:690234 was an orphan cache file, now cited on the histopathology finding, with the description scoped so that 'usually normal' refers to routine light microscopy while Weibel graticule morphometry does resolve reduced mucosal surface area in the malabsorbing subset. Suggestion 2: severity MILD on the finding_term, which softens the tension with binding NCIT Villous Atrophy. Suggestion 3: GO:0046352 disaccharide catabolic process replaces GO:0005984 disaccharide metabolic process as the direction actually lost, plus a molecular_functions descriptor GO:0004553 sitting closer to the enzyme-activity assay in PMID:6420534. Suggestion 4: therapeutic_modality SMALL_MOLECULE on the second-line agents treatment. Suggestion 5: biological_scale MOLECULAR on the new pathophysiology node.

    Validated: just validate passed; just validate-terms passed; just count-verified-snippets 108/129 with 21 skipped by prefix, up from 107/128 before this round.

    This branch still conflicts with main on three cache CSVs and needs a merge before it can land.

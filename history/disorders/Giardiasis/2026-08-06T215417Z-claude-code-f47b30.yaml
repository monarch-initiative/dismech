  details: |
    Backfill for issue #8085. All three entries target the 'Ingestion of infectious Giardia cysts' node. Untreated freshwater exposure and childcare close-contact faecal-oral exposure are TRIGGERS/DIRECT, both supported by the same risk-factor sentence which names each of them explicitly. Water infrastructure failure and rainfall-associated contamination is TRIGGERS but INDIRECT_KNOWN_INTERMEDIATES, because treatment failure and rainfall do not infect anyone directly: they load cysts into water that is subsequently drunk or swum in. Validated with linkml-validate, just validate-terms and just validate-references; zero integrity issues.

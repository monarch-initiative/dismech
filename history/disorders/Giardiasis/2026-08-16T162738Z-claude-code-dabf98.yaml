  summary: Add histopathology, disaccharidase-deficiency mechanism, second-line treatments;
    issue 6309
  details: |
    Content-gap follow-up from issue 6309, parasitic disorders review. Giardiasis had empty histopathology, no secondary disaccharidase-deficiency mechanism, and no second-line treatment agents. Added two histopathology findings honestly reflecting the literature: duodenal mucosa is usually normal on light microscopy with only occasional mild villous shortening (PMID:9018766, a 567-case series where 96.3% were normal and 3.7% showed mild villous shortening), and occasional CD4-positive intraepithelial lymphocytosis in chronic infection (PMID:30500895). Added a new pathophysiology node, Brush-Border Disaccharidase Deficiency, downstream of trophozoite colonization, citing PMID:6420534 (a pediatric cohort in which 41% had depressed brush-border disaccharidase activity contributing to diarrhea and carbohydrate intolerance), linked downstream to the existing Malabsorption pathophysiology node and the Diarrhea phenotype. Added a second-line treatment entry for albendazole, quinacrine, and furazolidone (CHEBI-bound), citing the already-cited PMID:15625030 review. Validated with just validate (schema/terms/references all pass), just count-verified-snippets (107/128 verified, 21 skipped by prefix, none of the new evidence failed), just check-title-snippets (no new title-quoting snippets), and pytest tests/test_data.py -k Giardiasis (16 passed).

  summary: 'Create: Macrocephaly, Dysmorphic Facies, and Psychomotor Retardation'
  details: |
    De novo curation of MDFPMR (MONDO:0014863; OMIM 617011), the autosomal recessive HERC1 disorder. The Falcon deep-research report (research/Macrocephaly_Dysmorphic_Facies_And_Psychomotor_Retardation-deep-research-falcon.md) was used as a lead list; every cited abstract was fetched into references_cache with just fetch-reference and every snippet is an exact substring of its cache file. Pathograph: HERC1 protein deficiency (nonsense, frameshift, splice-site nulls) and a single HECT-domain gain-of-function allele both feed a TSC2-mTORC1 growth-signaling node that reaches megalencephaly, macrocephaly, overgrowth and tall stature; an impaired neuronal function and cerebellar maintenance node reaches intellectual disability, hypotonia, seizures, cerebellar atrophy and the behavioural phenotypes; a hypothetical bone-remodeling node (C-RAF/ERK) carries the Herc1-knockout osteopenia finding. The mTORC1 model is recorded as an EMERGING mechanistic hypothesis because hyperactivation was measured only in the gain-of-function family, and a KNOWLEDGE_GAP asks how null alleles reach overgrowth. The tambaleante (Gly483Glu) and Herc1-knockout mice are linked with modeled_mechanisms, typed divergences and readouts; a HUMAN_MODEL_MISMATCH records that the tambaleante allele runs the opposite way on the mTOR axis. MONDO:0018710 (Orphanet megalencephaly-severe kyphoscoliosis-overgrowth syndrome) is mapped as skos:narrowMatch rather than modeled as a subtype, since it is Orphanet's name for the same single-gene disease. No GeneReviews chapter (just check-genereviews NO_CHAPTER) and no ClinGen validity assertion exist. ORPHA:457359 was not cited: data/orphadata is not on disk and the manifest pin has drifted from upstream, and repinning belongs in its own PR. Validation: just validate, validate-terms, validate-disorders (88/88 snippets, 91 titles, 0 issues), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, validate-stubs all pass; compliance 93.3 percent global.

  summary: 'Review round 1: split bundled nodes'
  details: |
    Review round 1 on PR 15310. Split the bundled node 'Impaired Neuronal Function and Cerebellar Maintenance' into 'Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity' (tambaleante vesicle depletion PMID:32694577, absent LTP PMID:28102468, learning deficits PMID:33328904, impaired NMJ release PMID:25746226, motor-terminal vesicle recycling PMID:39859507; edges to intellectual disability, developmental delay, hypotonia, seizures, autistic behavior, pyramidal signs, behavioural problems, schizoaffective disorder, speech disorder) and 'Autophagy-Associated Purkinje Cell Degeneration' (PMID:20041218, PMID:27147983, human cerebellar atrophy PMID:26153217; edges to cerebellar atrophy and gait ataxia; GO:0048102 autophagic cell death newly bound). Both new nodes now receive an edge from HERC1 Protein Deficiency. Split reduced autophagy out of 'Dysregulated TSC2-mTORC1 Growth Signaling' into 'Reduced Starvation-Induced Autophagy' (GO:0006914 DECREASED, PMID:32921582 patient-fibroblast quote) fed by the mTORC1 node. Tambaleante mouse now carries three modeled_mechanisms links: PARTIALLY_RECAPITULATES the Purkinje node (Purkinje count readout), PARTIALLY_RECAPITULATES the synaptic node (learning and NMJ release readouts), FAILS_TO_RECAPITULATE the reduced-autophagy node (excess autophagy, PMID:20041218). HUMAN_MODEL_MISMATCH discussion attaches_to and would_support, and the knowledge-gap experiment would_support/would_refute, re-pointed to the new nodes. Suggestions taken: Megalencephaly -> Macrocephaly moved to a sequelae edge on the Megalencephaly phenotype (mTORC1 -> Macrocephaly edge removed); mTORC1 -> Megalencephaly changed to INDIRECT_UNKNOWN_INTERMEDIATES; skin-fibroblast cell_types dropped from the HERC1 Protein Deficiency and gain-of-function nodes with a notes line recording the fibroblast as the assay system; speech phenotype from the Iranian case (PMID:39891458) added as Speech Disorder bound to HP:0002167 because the source says speech disorder, not delay; Bachiller 2018 myelin paper (PMID:29603094) cited on the animal model. Bone-remodeling node left unlinked. Validated with just validate, count-verified-snippets (102/102), validate-terms, validate-disorders, check-entity-refs, check-causal-targets, check-enum-values, check-block-scalar-comments, check-duplicate-keys; the entry is not listed by check-gene-activity-grounding; compliance 94.1 percent global.

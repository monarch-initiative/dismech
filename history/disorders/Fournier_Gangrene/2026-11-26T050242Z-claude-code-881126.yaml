  details: |
    Sepsis frequency changed to FREQUENT (78.8% in the 33-patient source; FREQUENT is 30-79%). Sexual dysfunction rebound from HP:0000802 Impotence to HP:0040307 Male sexual dysfunction (HPO has no sex-neutral term; recorded in notes), phenotype and target renamed. Swelling rebound from HP:0000969 Edema to HP:0031188 Genital edema. Split the endarteritis/thrombosis node into Obliterative Endarteritis of Subcutaneous Arteries -> Subcutaneous Vessel Thrombosis (thrombogenesis conformance on the thrombosis node), each edge with its own PMID:39840205 quote. Renamed Sepsis and Multiorgan Failure to Septic Multiorgan Failure and added pooled (20.41%, PMID:38625013) and population-based (7.5%, PMID:19286224) mortality. Added CHEBI:23066 cephalosporin as a therapeutic agent for the quoted third-generation cephalosporin recommendation. Corrected the PMID:41451372 explanation to say significantly lower risk (still REFUTE). IDSA 2014 guideline (PMID:24973422) not added because its abstract states no regimen.

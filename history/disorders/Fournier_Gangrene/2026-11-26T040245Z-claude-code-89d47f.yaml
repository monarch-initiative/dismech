  summary: 'Create: Fournier_Gangrene'
  details: |
    Created Fournier gangrene (MONDO:0043352) as a promotion out of Necrotizing_Soft_Tissue_Infection, which had lumped it before MONDO had a term. Promotion axes: organ systems (perineal/genital/perianal fascial compartment, testicular sparing) and diagnosis/therapy (FGSI, fecal/urinary diversion). Deep research leads from research/Fournier_Gangrene-deep-research-claude_code.md (claude_code provider; preflight SKIP because MONDO records no causal gene). Every snippet was checked against references_cache (90/90 verified) and every CURIE looked up in OLS or cache. SGLT2-inhibitor association recorded with one SUPPORT (FDA case series) and three REFUTE items (matched cohorts and the umbrella review's RCT meta-analysis summary). Hyperbaric oxygen recorded as SUPPORT from observational meta-analyses with risk-of-bias caveats.

  details: |
    Addressed ai4c-reviewer REQUEST_CHANGES (findings 2-9 plus low-cost suggestions). Added majority-frequency phenotypes (Proteinuria HP:0000093, Hematuria HP:0000790, Elevated hepatic transaminases HP:0002910; PMID:12401846, PMID:38847221). Added a diagnosis section: gold-standard renal biopsy histology (PMID:38847221), exclusion of viral cytopathic mimics by CMV/adenovirus/SV40 IHC (PMID:30040181), DNA-ploidy with negative Ki-67/PCNA and absent mitoses (PMID:12401846), confirmatory FAN1 sequencing (PMID:22772369, PMID:32220227). Reworked kidney transplantation to emphasize the two disease-specific hazards: avoid heterozygous-carrier related donors due to donor-derived/recurrent allograft KIN (PMID:38681017, PMID:30040181, PMID:32220227) and fatal post-transplant respiratory sepsis (PMID:12401846). Added a genetic_context block (functional_impact_category LOSS_OF_FUNCTION, variant_origin GERMLINE) with a variant spectrum (c.2260C>T p.Arg754Ter homozygous, PMID:39294548; c.2616delA and novel c.2603delT, PMID:34126972). Split the bundled repair node into atomic 'Defective Interstrand Crosslink Repair' and 'Defective Replication Fork Protection' nodes, both downstream of FAN1 loss and upstream of genomic instability (fork protection evidence PMID:26797144, PMID:29051491). Connected the pathograph to phenotype nodes via bare-name downstream targets (karyomegaly, renal fibrosis, stage 5 CKD, elevated creatinine). Split the environmental entry into ochratoxin A (ECTO:0000524) and genotoxic/alkylating drugs (ECTO:0000509), each with own evidence and influences_mechanisms. Fixed two weak snippets (FA-distinguishing full sentence; results sentence for the Fan1-KO link). Rebound GO:0004520 to GO:0017108 (5'-flap endonuclease activity). Added prevalence ULTRA_RARE (PMID:34126972) and a FAN1-mutant hiPSC kidney organoid experimental model (PMID:37759541). Set RRT therapeutic_modality DEVICE. Validation: validate-disorders 61/61 snippets verified; check-entity-refs, check-caus
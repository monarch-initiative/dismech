  summary: 'Create: Karyomegalic Interstitial Nephritis (FAN1)'
  details: |
    New autosomal-recessive FAN1-related DNA-repair chronic tubulointerstitial nephritis. Deep-research: falcon (Edison) requested with --fallback but HTTP 402 (out of credits); openscientist produced the report (fell_back=true). Causal chain: biallelic FAN1 LoF -> defective interstrand-crosslink/replication-fork repair -> genomic instability & replication stress (endogenous ROS, FAN1-null mouse, MODEL_ORGANISM) -> tubular-epithelial polyploidy/karyomegaly -> chronic tubulointerstitial nephritis & fibrosis -> progressive CKD/ESRD. Explicitly distinguished from Fanconi anemia. Primary + functional literature: PMID:22772369 (Zhou 2012, FAN1 causes KIN), 20603016/20603073/21115814 (FAN1 nuclease/ICL-repair biochemistry, IN_VITRO), 37107275 (FAN1-null ROS mechanism, MODEL_ORGANISM), 38847221 (clinical case/biopsy). preflight-dr WARNs are false positives (rival 'gene' KIN is the disease acronym; report OMIM 613534 is the FAN1 gene MIM vs phenotype MIM 614817 that MONDO xrefs). Validated: validate-disorders PASS, 29/29 snippets verified, entity-refs/causal-targets/qualifier-terms clean. No KIN-specific GeneReviews chapter (PubMed searched).

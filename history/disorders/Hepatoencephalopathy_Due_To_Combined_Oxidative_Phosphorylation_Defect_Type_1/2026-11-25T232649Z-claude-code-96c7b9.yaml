  summary: 'Create: Hepatoencephalopathy Due To Combined Oxidative Phosphorylation
    Defect Type 1 (GFM1, COXPD1)'
  details: |
    New entry for MONDO:0012191, curated from its stub as part of the mitochondrial translation gene-family review, because GFM1 had no dismech entry. GFM1 (mitochondrial elongation factor G1) is typed CAUSATIVE with GERMLINE origin and autosomal recessive inheritance: the founding family mapped to GFM1 with a variant in the GTP-binding domain (PMID:15537906), functional complementation confirmed pathogenicity (PMID:17160893), and nine further unrelated patients were reported in 2020 (PMID:31680380). The pathograph runs from GFM1 loss of function (translation elongation factor activity and GTPase activity, DECREASED) through impaired mitochondrial translational elongation and a combined, tissue-specific respiratory chain deficiency (severe in liver, slight in muscle and fibroblasts; PMID:26937387) to hepatocellular and neuronal energy failure, with nodes conforming to the mitochondrial_translation_deficiency module. Phenotypes: lactic acidosis, encephalopathy, hepatic failure (11/14 patients), axial hypotonia, dystonia, infantile spasms, abnormal basal ganglia morphology, microcephaly (7/14) and intrauterine growth retardation (4/14). The Gfm1 R671C/- compound heterozygous mouse reproduces the translation and respiratory chain defect (PMID:34919756), and AAV delivery of human GFM1 corrects it (PMID:41998139). ClinGen rates GFM1 Moderate for Leigh syndrome, a different disease, so no tier is recorded.

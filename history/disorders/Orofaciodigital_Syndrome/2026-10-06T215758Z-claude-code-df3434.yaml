  details: |
    SCLT1, TBC1D32 (OFD IX), IFT57 (OFD 18) and RAB34 (OFD 20) added to the Ciliary and Centriolar Gene Defect node as ciliary genes outside the three named modules, with the description extended and one evidence item per gene class (PMID:24285566, PMID:27141300, PMID:28289185, PMID:37384395); GO ciliary transition fiber and ciliary membrane added as components. Two new trigger nodes: Integrator Complex Assembly Defect and Ciliary Gene Dysregulation (INTS13, OFD II) feeding the ciliogenesis node, and DDX59 RNA Helicase Deficiency (OFD V) feeding the Hedgehog signaling node directly, because the DDX59 study reports intact ciliogenesis with impaired ciliary signaling. just subtype-usage-audit reports no unwired subtype genes afterwards; validate-disorders passes with all snippets verified.

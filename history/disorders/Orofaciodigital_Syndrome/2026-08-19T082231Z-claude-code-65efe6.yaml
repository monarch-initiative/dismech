  summary: 'Create: Orofaciodigital Syndrome (MONDO:0015375)'
  details: |
    Created the group-level Disease entry for orofaciodigital syndrome (MONDO:0015375) for issue #8888, curated from primary literature (no deep-research pass was run for this entry).

    Deliverable type. Curated as a Disease with has_subtypes, following the priority dashboard's CURATE_ROOT_WITH_SUBTYPES recommendation. The competing Grouping argument (Bruel et al. 2017, PMID:28289185, calls the numbered classification obsolete; two members already exist as standalone Disease entries) is recorded verbatim as an OPEN_QUESTION discussion (ofds_disease_versus_grouping) rather than being decided silently, with the migration path named.

    OFD type I inclusion decision. MONDO:0015375 has nineteen is_a descendants and MONDO:0010702 (orofaciodigital syndrome I) is NOT among them; OFD I sits under syndromic disease, Mendelian neurodevelopmental disorder and MONDO:1040039 OFD1-related ciliopathy. OFD I is nonetheless listed as a subtype, on three grounds carried by MONDO:0015375 itself: its OMIM cross-reference is the phenotypic series OMIMPS:311200 anchored on OFD I, its MeSH-derived definition names Type I explicitly, and its Orphanet cross-reference (Orphanet:140997) is the OFD group record. Recorded in notes and as a CURATION_TODO discussion (ofds_mondo_excludes_type_i) flagging the missing MONDO is_a edge for upstream reporting. No MONDO ticket was filed from this session.

    Subtypes. All twenty numbered types that carry a MONDO identifier are enumerated, each bound to a CURIE and canonical label verified with OAK against the local MONDO build. Fifteen carry a gene assignment with subtype-level evidence; five molecularly undefined types (VII, VIII, X, XI, 12) are enumerated with a MONDO binding and one-line descriptor, and notes says so explicitly rather than implying exhaustive depth. OFD XIII (Degner) has no MONDO term and is noted as absent.

    Mechanism. Nine pathophysiology nodes, two trigger routes (ciliary/centriolar gene defect; minor U12 spliceosome dysfunction in OFD 19/21) converging on impaired ciliogenesis, then cilium-dependent Hedgehog/GLI derangement branching to cranial neural crest facial midline patterning and to autopod digit specification. All 8 downstream causal edges carry their own evidence (8/8). Five conforms_to links declared: ciliopathy_dysfunction at Basal Body and Transition Zone Dysfunction, Impaired Hedgehog Signal Transduction and Multisystem Pleiotropic Ciliopathy Phenotype; limb_digit_patterning_serial_homology at Disrupted Digit Number and Identity Specification and Serially Homologous Autopod Malformation.

    Sections. classifications, mappings, 20 has_subtypes, 3 inheritance blocks, prevalence (scoped to OFD I, the only published figure), 9 pathophysiology nodes, 19 phenotypes, 10 genetic entries, 6 diagnosis entries, 3 differential diagnoses, 4 treatments, 1 dataset, 3 discussions.

    Frequency discipline. Only two frequency bands asserted, each with its own quantitative quote: polycystic kidney dysplasia OCCASIONAL (15% of cases, PMID:16311594) and intellectual disability FREQUENT (approximately 50%, PMID:20301367). Both are explicitly scoped to OFD type I in the explanation.

    References. 15 PMIDs, all fetched with `just fetch-reference`; no cache file was hand-created. Dataset geo:GSE154197 verified against NCBI E-utilities and confirmed DIRECT-relevance (the linked publication reports OFD type 2 families, not merely a ciliary gene).

    Validation run to completion: `just validate` passed (includes reference validation); `just count-verified-snippets` reported 98/98 verified against cached references; `just validate-terms` passed; `just compliance` 97.6% global and weighted; check-duplicate-keys, check-title-snippets, check-environmental-evidence, check-snippet-length, check-empty-snippets, check-term-cache-integrity, check-cache-order all OK; pytest tests/test_data.py -k "conforms_to or unique or subtype_foreign or environmental_mechanism" 8395 passed.

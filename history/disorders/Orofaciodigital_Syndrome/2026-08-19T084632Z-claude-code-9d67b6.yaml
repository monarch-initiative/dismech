  summary: 'Review fixes for PR #8894: tag GeneReviews reference, scope three subtype-restricted
    phenotypes'
  details: |
    Addresses the two IMPORTANT findings from the ai4c-reviewer REQUEST_CHANGES review on PR #8894, plus one of the three non-blocking suggestions.

    Finding 1 - GeneReviews article mined but never tagged. PMID:20301367 "Oral-Facial-Digital Syndrome Type I" is cited 20 times across the entry and all four GeneReviews domains were genuinely mined (clinical characteristics, diagnosis, management, genetic counseling), but the file carried no top-level references: block, so the article had no tags: [GeneReviews]. Added the four-line block between notes: and has_subtypes:, matching the placement and shape used in kb/disorders/ADCA-DN.yaml. This is a tagging-only change; no evidence, snippet or claim was altered.

    Finding 2 - subtype-restricted phenotypes asserted at group level. This entry is a group-level Disease spanning 20 heterogeneous subtypes. The genetic: block used subtype: nine times and prevalence: scoped its OFD-I-only figure explicitly, but the phenotypes: block used subtype: zero times, so three phenotypes whose own prose named a subtype restriction read as group-level claims. Added the qualifier to each, using names already valid as has_subtypes foreign keys:
    - Polycystic kidney dysplasia (frequency OCCASIONAL, the 15 percent figure is OFD-I-only) -> subtype: OFD I
    - Intellectual disability (frequency FREQUENT, the explanation already stated the ~50 percent figure is specific to OFD type I) -> subtype: OFD I
    - Retinal coloboma (described as the discriminating feature of OFD type IX) -> subtype: OFD IX
    The frequency bands themselves were already correct against docs/frequency-evidence-guidelines.md and were not changed; only their scope is now explicit. The distinction matters because 15 percent of OFD I patients is a materially different claim from 15 percent of OFD patients.

    Suggestion 5 - slug typo. Two notes references to the WDPCP entry used hyphens (Heart_Defect-Tongue_Hamartoma-Polysyndactyly_Syndrome) where the actual slug is all underscores, so the reference would not resolve or auto-link. Corrected both occurrences and confirmed kb/disorders/Heart_Defect_Tongue_Hamartoma_Polysyndactyly_Syndrome.yaml exists.

    Deliberately NOT changed:

    Suggestion 3 - no deep-research artifact. The reviewer explicitly did not block on this, judging the entry under-documented rather than under-researched given 98/98 verified snippets across 18 PMIDs. Running a DR pass has been deprioritised by the maintainer, and the same requirement was waived on PR #8830 on the grounds that measured compliance directly demonstrates the completeness the artifact only proxies for.

    Suggestion 4 - evidence_source on PMID:16311594 for the 15 percent figure. The reviewer noted OTHER would be the more literal reading, since the quoted sentence is background prose in a paper whose own experiments are murine, and observed that the same PMID is correctly MODEL_ORGANISM elsewhere in the entry. Left as HUMAN_CLINICAL because the original curator recorded the reasoning explicitly in the evidence explanation, which the reviewer accepted as defensible and self-disclosing; changing it would silently overwrite a documented judgement to gain consistency alone. Flagged here so a later curator can revisit rather than rediscover it.

    Validation after the edits: just validate passed (schema, terms, references); just count-verified-snippets 98/98 verified, unchanged by these edits; just check-duplicate-keys OK; just check-title-snippets no new title-quoting snippets; the full batched just validate-disorders sweep passed; pytest tests/test_data.py -k "subtype_foreign or unique or conforms_to" 6364 passed, which covers the three new subtype foreign keys resolving to real has_subtypes names.

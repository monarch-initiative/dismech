  summary: Verify and source the transplant negative-existence claim
  details: |
    Follow-up on a self-audit prompted by the review round on the sibling PR #12433, where a coarse_binding_basis justification that was true when written had been falsified by a later edit. Auditing this entry for the same shape surfaced a different but related problem: an unverified negative-existence claim.

    The Renal Replacement Therapy treatment asserted that no transplant outcome has been reported for this disorder. That assertion had never been searched for. It is the exact failure mode recorded in CLAUDE.md and filed as issue #12411, and the only reason it was not caught is that nothing can catch it.

    Searched, and the negative holds for CD151 specifically. PubMed CD151 AND kidney transplantation returns zero. epidermolysis bullosa nephropathy deafness transplant returns one record, PMID:28615054, which is a different gene. pretibial epidermolysis bullosa AND transplantation returns two records from 1995 and 1986, both skin grafting for pretibial ulcers rather than renal transplantation, and both predating the 2004 identification of CD151. The claim is now stated with the queries that support it rather than as a bare assertion.

    The search also found evidence worth carrying. PMID:28615054 reports a 29-year-old woman with laminin-5 epidermolysis bullosa, bilateral sensorineural deafness and oesophageal stenosis who reached end-stage renal disease and in whom kidney transplantation was pursued once dialysis access proved difficult; its authors conclude no renal replacement modality should be ruled out in epidermolysis bullosa. That is a statement about the disease group rather than about CD151, so both evidence items are directness INDIRECT and say so explicitly in their explanations. It is mechanistically adjacent in a way worth recording: laminin is the ligand whose integrin binding CD151 stabilises, so this is the same adhesion axis failing from the other side and reaching the same renal endpoint.

    A second evidence item records that few reports of ESRD exist in epidermolysis bullosa at all, which is why the CD151-specific negative is unsurprising rather than suspicious.

    Validation: just validate-disorders passes, 76/76 snippets verified, up from 74. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-coarse-phenotypes all clean.

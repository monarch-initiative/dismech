  summary: 'Review round 1 on PR #12409'
  details: |
    Addressed both IMPORTANT findings and all three suggestions from the ai4c-reviewer round on 5cd6bc04a.

    IMPORTANT 1, pathograph stopping short of phenotypes. Wired the two histologic readouts off Glomerular Basement Membrane Disorganization (Thickened glomerular basement membrane, Podocyte foot process effacement), both on the electron-microscopy sentence the node already cites, and added the FSGS to Stage 5 chronic kidney disease sequela. Phenotype causal inlink coverage for this entry goes from 4/13 to 7/13, above the KB-wide floor. The six ectodermal and mucosal phenotypes are left disconnected on purpose and that decision is now recorded in notes: no source proposes a mechanism for hair, tooth, nail or oesophageal involvement here, and routing them through the keratinocyte dysadhesion node would assert a published claim that does not exist.

    IMPORTANT 2, no hearing management. Resolved as a diagnosis entry rather than a treatment, because that is what the literature supports. PMID:35519797 gives a CD151-specific workup recommendation naming audiology referral explicitly; no CD151 report describes a device, a fitting or an audiological outcome in any proband. Added Audiological Assessment and Surveillance bound to NCIT:C217379 Diagnostic Audiology Testing, and recorded in notes why no hearing treatment is asserted. The device-qualifier pattern the reviewer pointed at was therefore not needed.

    Suggestion 1 taken: quote_role REVIEW_SYNTHESIS added to the PMID:35278129 extrarenal-negative snippet under pathophysiology, matching its grading under animal_models.

    Suggestion 2 declined with reasons recorded in notes. Intraglomerular filtration pressure is an intrinsic haemodynamic variable, not an exposure, and ECTO has no term for it: l~blood pressure returns nothing, l~hypertens returns only drug-exposure classes ECTO:2000001 and ECTO:9001744, l~pressure returns only ambient air and water pressure classes. All three searches were run against sqlite:obo:ecto before the note was written. The fact is carried structurally as evidence on the GBM node, as the RAAS blockade target_mechanisms link, and as the new knowledge gap.

    Suggestion 3 taken, but grounded differently. Added discussion cd151_renal_severity_modifiers_unknown as a KNOWLEDGE_GAP over the variance in renal course, built on PMID:22201679's strain dependence and filtration-pressure gate plus the incidentally-detected proband in PMID:38188895, rather than on the TNS2 paper the review suggested, which is about a different gene.

    Correction to the previous round. The note explaining preflight-dr's OMIM WARN as a false positive gave the wrong reason. The conclusion was right but the mechanism was not: the extractor never sees the phenotype MIM at all, because every one of its three appearances is written with markdown bold and the pattern allows only whitespace between the OMIM token and the number. Tested directly against the pattern rather than reasoned about. Rewritten, and filed as issue #12414 with a measurement of 67 affected committed reports.

    One fabricated snippet was written and caught before commit. A quote attributed to PMID:38188895 describing a school dipstick screening programme does not exist; the source says the mother tested the boy's urine at home. Replaced with the exact sentence.

    Validation: just validate passes, 74/74 snippets verified, up from 68. check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms all clean. list-disconnected-phenotypes confirms the 7/13 figure.

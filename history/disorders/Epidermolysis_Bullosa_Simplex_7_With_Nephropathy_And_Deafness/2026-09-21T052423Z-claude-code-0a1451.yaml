  summary: 'Create: Epidermolysis Bullosa Simplex 7 With Nephropathy And Deafness
    (CD151)'
  details: |
    New DISEASE entry for MONDO:0012190, the CD151 tetraspanin disorder.

    Why one entry for three organs. CD151 is not a structural component of the basement membrane; it is a lateral organiser that holds the laminin-binding integrins alpha-3/beta-1 and alpha-6/beta-4 in a high-avidity association with their laminin ligands. Losing it weakens the same class of cell-matrix adhesion wherever an epithelium is anchored that way, which is why one gene gives skin fragility, a progressive glomerular disease and sensorineural hearing loss. The pathograph is built around that shared molecular lesion with three organ arms branching from it, rather than as three parallel chains.

    Module conformance, and a correction to an earlier draft of the entry's notes. The first draft claimed a module search had been run and had found only 'podocyte_injury_and_glomerular_filtration_barrier_failure' and 'epithelial_barrier_dysfunction'. That was false: no module of the first name exists in kb/modules/ at all. The automated second-opinion comment on claim issue #12389 named dermal_epidermal_junction_adhesion_failure and nephrotic_podocyte_injury; ls kb/modules/ confirms both, and both were then read in full and declared - the first on the two skin-arm nodes, the second on the renal node. This is the exact failure the dismech-terms skill documents at step 3a, an unverified justification that tells the next reviewer to skip the check that would catch it, landing on module selection rather than on a term binding. Recorded rather than silently fixed.

    One caveat on the skin conformance, carried as a CONTROVERSY discussion: the module's organising axis is the ultrastructural cleavage plane, and in this disease that plane is not settled. PMID:29138120 reports intraepidermal keratinocyte dysadhesion on electron microscopy; PMID:35519797 reports subepidermal separation on biopsy, though without immunofluorescence mapping or TEM. Conformance is declared at the attachment-defect and loss-of-adhesive-integrity nodes, which hold either way, and not at the module's dermal-epidermal separation node, which does not.

    The same second-opinion comment independently caught a fabricated CURIE in the claim issue body: I had written hgnc:1885 for CD151, which is actually CGA. The stub had hgnc:1630 correct on the line I was paraphrasing. The issue body was corrected with the error left visible rather than edited away.

    Curation choices. The auditory arm is curated with its evidence deliberately weak and marked so: the only mechanistic statement in the literature is the founding paper's hedge that CD151 'is probably a component of the inner ear', reasoned backwards from the deafness, and PMID:35278129 states the Cd151 knockout mouse does not reproduce the deafness - curated as a REFUTE item and as a HUMAN_MODEL_MISMATCH discussion. Heterozygous relatives in the Saudi pedigree had partial phenotypes (steroid-responsive nephrotic syndrome; hearing impairment with low-grade proteinuria) while others were asymptomatic; that is one family and is carried as a KNOWLEDGE_GAP rather than asserted as a carrier phenotype. The strongest treatment evidence is a within-patient one - proteinuria resolving and relapsing in step with lisinopril adherence - and the most actionable finding is negative: one proband had years of failed immunosuppression for a presumed autoimmune blistering disease and improved once it was withdrawn.

    Two claims in the sources were deliberately not curated: the beta-thalassemia minor and cervical ribs in the founding consanguineous pedigree (co-segregating, no proposed link to CD151), and the epilepsy and sweat-chloride-positive 'atypical cystic fibrosis' in PMID:35519797, whose authors argue for inclusion from tissue-expression overlap rather than from any demonstrated mechanism.

    Deep research: an OpenScientist run for this entry was launched at the same time as the others in this batch and had not completed when the entry was committed. It will be reconciled and committed in a follow-up round before the pull request is opened, and this record will be followed by a second one covering that round.


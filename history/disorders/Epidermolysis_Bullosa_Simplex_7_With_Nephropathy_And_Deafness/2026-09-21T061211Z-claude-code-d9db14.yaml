  summary: Reconcile OpenScientist deep-research report
  details: |
    Reconciled the OpenScientist deep-research run against the committed entry.

    Substantive changes. The Cd151-null mouse model was citing a 2022 review for both its positive and its negative claim; both are now sourced to PMID:17015618, the 2006 report that generated the mice, which states the renal phenotype and the skin/hearing negative in the same sentence. The review is kept alongside with quote_role REVIEW_SYNTHESIS where it adds something the primary source does not (the FVB strain dependence, and that the negative has held since).

    Added a podocyte-specific Cd151 conditional knockout as a separate animal model (PMID:22201679). It makes a different claim from the global null - that loss of CD151 in the podocyte alone is sufficient - which is what licenses this entry to place the renal lesion at the podocyte and to conform that node to nephrotic_podocyte_injury. It carries a RESTORED readout for the ACE-inhibition life-span arm.

    The Glomerular Basement Membrane Disorganization node asserted in prose that podocyte attachment is under continuous mechanical load and that this is why the adhesion defect bites in the kidney and not in quieter tissues. That claim had no evidence behind it. PMID:22201679 supplies it: the same null allele is silent on a resistant background until filtration pressure is raised.

    Added the RAPH blood group review (PMID:32667818) in two places - the full laminin-binding integrin partner set including alpha-7/beta-1, which is wider than the three organs the disease affects and so sharpens rather than answers the tissue-selectivity question; and the blood-group literature's own statement of the disease association on the MER2 phenotyping definition.

    Two report findings recorded as notes rather than content. The report independently attributes the beta-thalassemia minor to 11p15.5 proximity to the beta-globin cluster rather than to CD151, corroborating an exclusion this entry had already made. And just preflight-dr returns a WARN on OMIM identity that is a false positive: the report carries phenotype MIM 609057 and gene MIM 602243 on one line and the check does not distinguish them.

    Term discipline. Two CURIEs offered by the report were not taken. UBERON:0002966 is obsolete. HP:0011904, offered for beta-thalassemia minor, is Persistence of hemoglobin F - an unrelated concept - and the phenotype is excluded from this entry in any case. Six of the report's term-validation label mismatches were inspected and are table-column artifacts (the validator read the frequency column) rather than wrong-concept bindings.

    Validation: just validate passes, 68/68 snippets verified against cached references (was 61/61). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-coarse-phenotypes, check-delivery-system and check-case-collisions all clean. check-genereviews re-confirms NO_CHAPTER offline against the committed Bookshelf index, which is the negative the notes record.

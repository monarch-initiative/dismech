  summary: 'Review round 1: address CHANGES_REQUESTED on PR #11261'
  details: |
    Three blocking items. First, notes said the entry omits datasets and trials because the disease has six reported patients, while prevalence.notes says twelve from seven families across three cohorts; six was the pre-reconciliation count and the sentence now says twelve. Second, the Defective Neutrophil Motility and Polarization node rested entirely on PMID:27557945 while PMID:27994071, cited throughout the entry, measured the same thing in the founding family and found no difference in velocity or chemotactic index; two REFUTE evidence items now carry that result and the mild-defects sentence, and the node description states the disagreement is unsettled rather than presenting the motility defect as a whole-disease claim. Third, added Recurrent respiratory infections (HP:0002205), the presenting infection in the six-patient lymphoid cohort, from a sentence already quoted twice in the file. Suggestions taken: added a Reduced circulating follicular helper T cells phenotype, deliberately left unbound because HPO has obsoleted its entire helper-T-cell-proportion branch and the live total-T-cell terms would contradict a source that states T-cell development is otherwise normal; softened the animal-model limitation that said the human disease is not macrothrombocytopenic, since one of the two index siblings had mean platelet volume consistently above the reference range, and added that measurement as evidence; added a notes paragraph explaining why the historical OMIM 150550 lazy-leukocyte-syndrome xref on MONDO:0007883 is harmless. Not taken this round: the dendritic-cell antigen-processing mechanism, gnomAD constraint metrics, and a more specific allogeneic HSCT term, with reasons given in the PR reply. Two self-inflicted errors caught during the round: an evidence block first inserted into a downstream list rather than an evidence list, caught by schema validation, and a retyped en dash in a snippet, avoided by extracting quotes programmatically from the cache rather than retyping them. Validated: just validate (53/53 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading.

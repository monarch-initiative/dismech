  summary: 'Create: Periodic Fever, Immunodeficiency, and Thrombocytopenia Syndrome'
  details: |
    De novo curation of PFIT (MONDO:0007883, biallelic WDR1/Aip1 actinopathy) from the two founding cohorts, PMID:27994071 (Standing 2017, autoinflammatory presentation) and PMID:27557945 (Kuhns 2016, neutrophil-dysfunction presentation), plus PMID:29056508 for the Aip1 biochemistry and PMID:17515402 for the Wdr1 hypomorphic mouse. Eight pathophysiology nodes model one actin-turnover defect branching into inflammasome, neutrophil-motility and megakaryocyte arms. The pyrin-sequestration node is marked PROVISIONAL because it rests on a single HEK293T co-transfection the authors themselves hedge twice. Anakinra is carried with a REFUTE evidence item. Validated: just validate (37/37 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all pass.

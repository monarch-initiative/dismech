  summary: Reconcile openscientist deep-research report into PFIT entry
  details: |
    Reconciled the openscientist deep-research report, which returned after the entry was first written. The report passed the Named Entity Confusion preflight. Its principal contribution was PMID:29751004, a third cohort establishing a lymphoid arm of the disease that neither founding report describes: a new pathophysiology node for defective immunological synapse formation in T and B lymphocytes, two new phenotypes (decreased total B cell count, skin ulcer), and a corrected patient count of twelve across seven families. Also added PMID:25448002 refining what the lost Aip1 activity is (a cofilin-dependent depolymerisation factor, not a barbed-end capper) and PMID:39644982 placing PFIT in the monogenic autoinflammatory actinopathy class. PMID:24840128, a cardiomyocyte-specific Wdr1 conditional knockout the report cited, was deliberately not curated because no human PFIT patient has a cardiac phenotype. Snippet count rose from 37/37 to 48/48 verified.

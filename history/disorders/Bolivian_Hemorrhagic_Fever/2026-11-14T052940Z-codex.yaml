events:
- type: CREATE
  outcome: changed
  summary: Create Bolivian hemorrhagic fever
  details: >-
    Created a standalone Bolivian hemorrhagic fever entry for MONDO:0017875
    from the infectious-disease stub. Curated Machupo virus as the
    Mammarenavirus machupoense infectious agent, rodent reservoir biology,
    rodent-excreta and limited nosocomial transmission,
    prodromal and hemorrhagic-neurologic phases, human transferrin receptor 1
    entry, leukopenia, thrombocytopenia, bleeding, neurologic manifestations,
    supportive care, and limited intravenous ribavirin case-report therapy from
    cached PubMed/PMC evidence. Added the disease as a member of the viral
    hemorrhagic fever grouping and removed the promoted stub.
- type: REVIEW
  outcome: changed
  sections:
  - pathophysiology
  - treatments
  - review_notes
  summary: Address adversarial review findings for PR #17705
  details: >-
    Split neurologic manifestations away from the vascular-permeability
    conformance node so tremor and seizures no longer sit downstream of
    increased endothelial permeability. Added a cautious convalescent immune
    plasma treatment row for historical and reemergent BHF survivor-plasma use,
    while keeping it separate from routine supportive care and without asserting
    proven BHF-specific efficacy.

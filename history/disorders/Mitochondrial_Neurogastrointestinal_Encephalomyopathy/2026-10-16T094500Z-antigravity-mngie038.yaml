  details: "1. Connected all 10 phenotypes to the causal pathophysiology graph: wired\n   Multiple mitochondrial\
    \ DNA deletions downstream of mtDNA Instability;\n   wired Gastrointestinal dysmotility, Ptosis, Progressive\
    \ external\n   ophthalmoplegia, Demyelinating peripheral neuropathy, Leukoencephalopathy,\n   and\
    \ Skeletal myopathy downstream of Respiratory Chain Dysfunction; added\n   sequelae edges from Gastrointestinal\
    \ dysmotility to Intestinal\n   pseudo-obstruction and Cachexia and from Demyelinating peripheral\n\
    \   neuropathy to Increased CSF protein concentration.\n2. Grounded RRM2B (hgnc:17296, GO:0004748\
    \ DECREASED) on a dedicated\n   subtype-restricted upstream node (RRM2B Ribonucleotide Reductase\n\
    \   Deficiency -> Mitochondrial dNTP Pool Imbalance) and POLG (hgnc:9179,\n   GO:0003887 DECREASED)\
    \ on a dedicated subtype-restricted upstream node\n   (POLG Polymerase Gamma Deficiency -> mtDNA Instability)\
    \ so all three\n   causative genes (TYMP, POLG, RRM2B) are wired into the causal graph with\n   GO\
    \ molecular function activity grounding without bundling onto classic\n   TYMP MNGIE nodes.\n3. Added\
    \ BiomarkerReadout links (READOUT_OF Systemic Nucleoside Accumulation)\n   on Elevated plasma thymidine\
    \ and Elevated plasma 2'-deoxyuridine, and\n   TreatmentMechanismTarget / target_phenotypes links\
    \ across all 6 treatments.\n4. Replaced weak snippets on Increased CSF protein concentration and Gene\n\
    \   therapy (investigational) with exact verbatim quotes from the cached full\n   text of PMID:30373120,\
    \ including the Tymp/Upp1 double-knockout mouse\n   hematopoietic gene-therapy result.\n5. Added structured\
    \ progression (Onset), diagnosis (4 assays/modalities with\n   NCIT terms and result links), differential_diagnoses\
    \ (5 commonly\n   misdiagnosed conditions with MONDO terms, overlapping_phenotypes, and\n   diagnostic_tests),\
    \ and top-level reference findings for all 6 cited PMIDs."

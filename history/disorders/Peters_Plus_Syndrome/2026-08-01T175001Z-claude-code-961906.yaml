  summary: 'Create: Peters Plus Syndrome'
  details: |
    Created kb/disorders/Peters_Plus_Syndrome.yaml for Peters plus syndrome (MONDO:0009856, OMIM 261540, B3GLCT / hgnc:20207). NEC preflight was run first against the MONDO record - gene relationship RO:0004003 HGNC:20207, OMIM:261540 xref, synonyms Krause-Kivlin syndrome and Peters anomaly with short limb dwarfism. The entry is scoped to the B3GLCT syndromic entity and explicitly separated from isolated Peters anomaly, whose genes are PAX6, PITX2, PITX3, FOXE3, FOXC1, CYP1B1 and SOX2, via differential_diagnoses and a scope note. Issue 7706 wrongly described the gene as B4GALT1, which causes CDG type IId; this is corrected to B3GLCT and documented in the entry notes. Deep research used Edison/falcon, saved at research/Peters_Plus_Syndrome-deep-research-falcon.md, 730 seconds and 19 citations. Its NEC identity anchors matched and it contributed PMID:25544610, PMID:35170016, PMID:40650233 and PMID:31795264. Its claim that no validated B3glct-null mouse model exists was contradicted by independent PubMed searching, PMID:31600785, and was not carried into the entry. The GeneReviews baseline step was completed: PMID:20301637 was fetched, tagged GeneReviews in the top-level references block, and every phenotype in its Clinical Characteristics section is represented in the YAML. Curated content: a seven-node pathophysiology chain running B3GLCT loss of function to absent Glc-beta-1,3-Fuc disaccharide on thrombospondin type-1 repeats to impaired noncanonical ER quality control and TSR secretion to reduced ADAMTS9 and ADAMTS20 function, branching into anterior segment dysgenesis, craniofacial and endochondral skeletal growth, and palatal shelf fusion; 20 phenotypes; a genetic block plus two variants; two diagnosis entries; two differential diagnoses; seven treatments; two animal models; two progression phases; and three discussions, including a HUMAN_MODEL_MISMATCH for the phenotype-free zebrafish b3glct double null. Frequencies were deliberately limited to three OCCASIONAL bands supported directly by the GeneReviews word occasionally; the 30 to 70 percent glaucoma figure and the 2.2 to 3.1 per 100000 birth prevalence were rejected as Peters-anomaly-spectrum statistics rather than PTRPLS-specific. Validation: just validate passed, just validate-terms passed, just validate-references passed with 84 of 84 snippets verified against cached references.

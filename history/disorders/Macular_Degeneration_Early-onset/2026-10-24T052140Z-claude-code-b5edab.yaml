  summary: 'Create: Macular Degeneration, Early-onset (FBN2)'
  details: |
    New entry for early-onset macular degeneration (MONDO:0014501), claimed in issue #15458. Built from the abstracts of the defining FBN2 report (PMID:24899048) and two mouse studies of fibrillin-2 knockdown (PMID:37100863) and antibody blockade (PMID:35108420); no full text was available, so no fundus, imaging or onset-age details are recorded. Pathograph: FBN2 heterozygous variant -> Bruch's membrane elastic microfibril dysfunction -> outer retinal degeneration -> macular degeneration, with every edge marked INDIRECT_UNKNOWN_INTERMEDIATES. The opposite TGF-beta findings in the two mouse studies are recorded as a knowledge gap rather than as a pathophysiology node. Validated with just validate, count-verified-snippets (17/17) and validate-terms.

  details: |
    Responds to the changes-requested review on PR 15477. The knockdown study (PMID:37100863) is cached as full text, and its Results show Fbn2 knockdown raising retinal TGF-beta1 and LTBP-1 mRNA and protein, with levels falling after recombinant fibrillin-2 rescue. That is the same direction as the anti-FBN2 blockade study (PMID:35108420). The earlier knowledge gap described the two studies as disagreeing, based on an abstract sentence that the paper's own Results contradict. The gap now asks whether the TGF-beta increase is causal, and its evidence quotes the Results. Added the knockdown lesion location (photoreceptor and RPE layer) as evidence on the outer retinal degeneration node and a RESTORED retinal-thickness readout for the rescue arm. Removed the background gene-disease sentence from the outer retina to maculopathy edge, which it did not support. Corrected notes to say only the human report and the blockade study are abstract-only. Added an OpenScientist deep-research report (Falcon was not installed in this environment). It passed preflight-dr for FBN2 and OMIM 616118 and all 25 of its references resolved, but it found no EOMD-specific human evidence beyond Ratnapriya 2014: its drusen, CNV and onset descriptions are extrapolated from AMD, and the one other human paper it cites for early-onset dominant maculopathy (PMID:17302207) is a North Carolina-like family with no FBN2 finding. Nothing from the report was added to the entry. A TGF-beta pathophysiology node was considered and not added, since neither study tested causation.

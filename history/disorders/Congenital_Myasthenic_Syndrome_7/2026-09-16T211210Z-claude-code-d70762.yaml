  summary: 'Create: Congenital Myasthenic Syndrome 7'
  details: |
    Created kb/disorders/Congenital_Myasthenic_Syndrome_7.yaml from claim issue #11961. Deep research: openscientist (research/Congenital_Myasthenic_Syndrome_7-deep-research-openscientist.md, 20 citations, 20/20 resolved, 0 unresolved, 1 flagged possibly off topic). The run's own term-validation step aborted on an EBI network timeout, so the report carried no reference_validation or term_validation frontmatter; the ## Reference Validation section was added afterwards with just validate-research-reference. Scoped as one entry with two has_subtypes because MONDO:0014468 is defined gene-wise (Any congenital myasthenic syndrome in which the cause of the disease is a mutation in the SYT2 gene), read from OLS rather than assumed; OMIM splits it by inheritance and that mismatch is recorded in the entry notes. The report changed two things a textbook-first draft had wrong. First, it supplied PMID:34037996, which establishes the dominant mechanism as dominant-negative rather than plain loss of function, so the single molecular node was split into two subtype-tagged nodes with different functional_impact_category values. Second, the report's own reference validation flagged PMID:41251564 as possibly off topic; reading it showed the paper is a UK prevalence study of congenital myasthenic syndrome as a whole, so it is curated as an explicit upper bound with directness INDIRECT and a note, not as a CMS7 prevalence. Also added from the report: quantal-content microelectrode and EM ultrastructure findings, the biallelic cohort (PMID:32776697) with anticholinesterase benefit, the 28-case review (PMID:41331967), the P308L Drosophila model (PMID:28953919), and a negative salbutamol result (PMID:36869887) curated as REFUTE. Two CHEBI CURIEs written from memory were wrong and were corrected against the term cache. Validation: just validate and just validate-disorders pass (46/46 snippets verified); duplicate-key, entity-ref, causal-target, enum-value gates clean.

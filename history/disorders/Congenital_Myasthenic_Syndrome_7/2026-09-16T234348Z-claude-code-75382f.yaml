  summary: 'Review round 1: SNARE binding rebind, third dominant allele class, penetrance
    and seronegativity'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #11980, answered in one push.

    Blocking item 1. The recessive molecular node bound GO:0005509 calcium ion binding to a molecular function written as 'synaptotagmin-2 SNARE engagement', on a node whose own description says the affected surface is not a calcium-binding site. Rebound to GO:0000149 SNARE binding, keeping modifier LOSS_OF_FUNCTION. GO:0000149 was confirmed against both the local GO build and the OLS adapter before binding, and the run populated cache/go/terms.csv and the MolecularFunctionTerm enum cache. The rebind also restores the distinction between the recessive and dominant arms that the entry is built around: the dominant node keeps its calcium-binding term, the recessive node now names the SNARE surface.

    Blocking item 2. PMID:33320396 was fetched by this PR and cited nowhere. It reports a de novo heterozygous in-frame deletion, c.1082_1096del, removing five residues from C2B: a third dominant allele class that is neither a C2B missense change nor a biallelic loss-of-function allele. Now cited in four places, each for a claim the abstract actually carries: the genetic record (allele class), the Autosomal Dominant inheritance record (de novo occurrence, which is what makes unaffected parents compatible with the dominant form), the Pes cavus phenotype (independent case with the same distal-weakness-plus-pes-cavus presentation), and diagnosis (presynaptic rather than axonal electrophysiology in a neuropathy mimic). The CMS7 dominant subtype description and the genetic notes variant summary were both rewritten to cover the in-frame deletion class.

    Optional items folded into the same push, since a push drops the approval either way.

    Item 3: added a references block tagging PMID:20301347 as GeneReviews, matching the umbrella Congenital_Myasthenic_Syndrome entry. The chapter is the parent-disease overview and is abstract-only with no SYT2 content, so there is nothing in it to mine; that judgement is recorded in the entry notes rather than left implied by the reference's absence. PublicationReference has no notes slot, which is why the note lives at entry level.

    Item 4: gnomAD constraint recorded in the genetic notes (pLI 0.70, LOEUF upper 0.58, LoF z 3.34, missense z 2.62, synonymous z 0.98), flagged there as database summary statistics with no quotable publication behind them. Penetrance was deliberately NOT put in the structured penetrance slot: PenetranceEnum offers only COMPLETE, INCOMPLETE and UNKNOWN, and the literature supports 'high' without supporting COMPLETE. The claim is carried as prose on each inheritance record and the reason is recorded in the entry notes. expressivity: VARIABLE was added to both inheritance records, which the severity gradient does support.

    Item 5: AChR and VGCC antibody negativity added to the diagnosis description. No cached reference states it as a measured result in a SYT2 series, so it is supported indirectly by PMID:30032336 ('Unlike in autoimmune myasthenia gravis, there is no role for immunotherapy in congenital myasthenic syndromes') with directness INDIRECT and an explanation saying exactly what that quote does and does not establish.

    Item 6: PMID:29696584 cited twice (the quantal-release node, and diagnosis for the point that the electrophysiology alone cannot separate CMS7 from acquired LEMS), and PMID:17521570 on the fusion node for the baseline physiology. Both carry quote_role, REVIEW_SYNTHESIS and BACKGROUND respectively, because neither sentence is the citing paper's own result.

    Item 7: three phenotype names that paired two features while binding one term were reduced to the bound feature: 'Ptosis and ophthalmoparesis' to 'Ptosis', 'Pes cavus and foot deformity' to 'Pes cavus', 'Weak cry and dysphonia' to 'Weak cry'. The two that were also bare-name causal targets were updated at the target sites in the same edit. The dropped conjuncts are kept in the descriptions with a note on why they are not asserted as separate phenotypes; ophthalmoparesis in particular is not separately evidenced, since the cited snippet says only 'fatigable ocular and lower limb weakness'.

    Validation after the edits: just validate clean, just validate-terms passed, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean, snippet count 54/54 verified (up from 46/46), and check_snippet_length and check_title_snippets clean against origin/main.

  summary: 'Gene-family review: AGXT (and HAO1 as a drug target)'
  details: |
    AGXT modelling re-reviewed. The AGXT genetic record gains a record-level autosomal recessive inheritance block (GeneReviews PMID:20301460). The AGXT trigger node now records that the common c.508G>A p.Gly170Arg allele acts by mislocalizing AGT from peroxisomes to mitochondria (base-editing correction in patient iPSC-derived hepatocyte-like cells restores peroxisomal localization, PMID:41330733), and that pyridoxine response tracks the two mistargeting alleles G170R and F152I (PMID:15849466). Added a treatments section: pyridoxine for pyridoxine-responsive missense genotypes (GeneReviews PMID:20301460; PMID:15849466), and lumasiran, an siRNA against HAO1 (glycolate oxidase) that reduces glyoxylate supply upstream of the AGT block (ILLUMINATE-A, PMID:33789010). HAO1 is recorded only as the oligonucleotide target_gene, not as a PH1 disease gene. ClinGen's AGXT Definitive assertion is filed against MONDO:0100278 (alanine glyoxylate aminotransferase deficiency), whose only child is PH1; it is not copied onto this entry. MONDO's definition of MONDO:0100278 currently calls it a disorder of plasmalogen biosynthesis, which is wrong for AGXT.

  summary: 'Create: Autosomal_Recessive_Nonsyndromic_Hearing_Loss_63'
  details: |
    New entry for DFNB63 (autosomal recessive nonsyndromic hearing loss 63, MONDO:0012670), caused by biallelic LRTOMT variants affecting the LRTOMT2 (TOMT) product. Curated from the claude_code deep-research report research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_63-deep-research-claude_code.md and the cited primary literature. Covers autosomal recessive inheritance, the LRTOMT gene record with four population case fractions, two mechanistic hypotheses (the current TOMT-dependent TMC1/TMC2 trafficking model, and the superseded catecholamine-catabolism model with the mouse and zebrafish evidence against it), a four-node pathophysiology chain from LRTOMT loss of function through failed TMC1/TMC2 trafficking and absent hair-cell mechanotransduction to hair-cell degeneration, five auditory phenotypes, prevalence, diagnosis and cochlear implantation. The LRTOMT node binds GO:0140597 protein carrier activity (DECREASED), following the two papers that describe TOMT binding TMC components and delivering them to the hair bundle; the catechol O-methyltransferase activity UniProt annotates is not bound, because both papers report the hair-cell role is independent of it. The entry has no animal_models or discussions section. Validation: just validate, validate-terms, 41/41 snippets verified against cached references, entity refs, causal targets, gene-activity grounding and reference-title gates pass.

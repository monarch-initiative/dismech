  summary: 'Genetics pass (d2g series-044): Intermediate_Charcot-Marie-Tooth_Disease'
  details: |
    Genetics pass for issue #12251 (d2g series-044). Bound subtype_term MONDO identifiers and genes descriptors on the four existing has_subtypes rows (DI-CMTB, DI-CMTC, DI-CMTF, RI-CMTB), which previously named their genes only in prose, and added six new rows to complete the ten numbered dominant- and recessive-intermediate subtypes MONDO files under MONDO:0018778: DI-CMTD (MPZ), DI-CMTE (INF2), DI-CMTG (NEFL), RI-CMTA (GDAP1), RI-CMTC (PLEKHG5), RI-CMTD (COX6A1). Added genetic records with relationship_type CAUSATIVE and variant_origin GERMLINE for MPZ, GDAP1 and PLEKHG5, backfilled those two slots on the four legacy records, and wired the three new genes into the pathograph as their own pathophysiology nodes, each feeding the shared terminal node. Declined CMT2GG (MONDO:0011675, GBF1) as an axonal form reaching this branch through a stale is_a edge, and DI-CMTA (MONDO:0957273) as a locus-only concept with no causal gene. Corrected a pre-existing description claim that intermediate CMT exceeded "the axonal-optic and HNPP groups combined" in the cited cohort: that cohort has no axonal-optic group, and the sourced statement is that intermediate CMT was the third largest group after CMT1 and CMT2. Deleted stubs/Charcot-Marie-Tooth_Disease_Recessive_Intermediate_C.yaml, now curated as the RI-CMTC subtype row. Validated with linkml-reference-validator 0.3.0rc1.

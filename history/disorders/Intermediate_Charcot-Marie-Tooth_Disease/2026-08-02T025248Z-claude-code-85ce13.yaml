  summary: 'Create: Intermediate Charcot-Marie-Tooth Disease (intermediate compartment)'
  details: |
    New entry filling the largest remaining CMT gap: intermediate CMT (CMTi), 13.5% (205/1515) of a specialist cohort yet previously unmodeled. Defined by intermediate motor NCV overlapping CMT1/CMT2 with combined demyelinating-and-axonal pathology. Covers 4 verified subtypes: DI-CMTB/DNM2 (PMID:15731758), DI-CMTC/YARS1 (PMID:16429158), DI-CMTF/GNB4 (PMID:23434117), and recessive RI-CMTB/KARS1 (PMID:20920668). Three mechanism nodes (DNM2 membrane remodeling; aminoacyl-tRNA synthetase dysfunction covering YARS1+KARS1; GNB4 GPCR signaling) converge on a shared terminal node conforming to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination. INF2 (CMT+glomerulopathy) is noted in prose only because its abstract body was not retrievable for snippet verification (no fabricated evidence). All 19 evidence snippets verified as exact substrings of fetched caches; schema, term, and graph validation pass; FK/uniqueness checks clean. Bound to MONDO:0018778 and HGNC gene terms.

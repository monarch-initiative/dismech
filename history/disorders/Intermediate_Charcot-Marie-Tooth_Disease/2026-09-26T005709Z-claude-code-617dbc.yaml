  summary: 'Review round 1: PNS neuron bindings and MPZ background quote'
  details: |
    Blocking finding on PR 12781. Two cell_types bound the root CL:0000540 neuron where their own preferred_term said peripheral nervous system: the PLEKHG5 node (preferred_term peripheral nervous system neuron) and the GDAP1 node (peripheral nerve axon-bearing neuron). Both rebound to CL:2000032 peripheral nervous system neuron, read live from ols:cl rather than from memory. The reviewer also asked whether a PNS glia class exists for the PLEKHG5 glial binding. It does not, and the searches are recorded in that node's notes so they can be re-run: l^peripheral nervous system returns CL:2000032 and no glial counterpart, and the full-text searches for peripheral nervous system glial cell and satellite glial cell return nothing against a working control. l^satellite does return CL:0000516 perineuronal satellite cell, a real PNS glial type, but the cited sentence reports Plekhg5 expression in peripheral glia generally rather than in ganglionic satellite glia, so binding it would assert a specificity the source does not support; CL:0000125 glial cell stays. Note that the OLS adapter cannot traverse the class hierarchy (descendants and ancestors both raise NotImplementedError), and its l~ search truncates at around 22 results, so the negative rests on the starts-with and full-text queries rather than on a subtree walk. Separately, three copies of the MPZ structural-role sentence from PMID:22704856 gained quote_role BACKGROUND; it is the case report's introductory framing, and the HUMAN_CLINICAL grading is unchanged.

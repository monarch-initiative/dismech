  summary: 'Create: RDH12-Related_Dominant_Retinopathy'
  details: |
    New entry for the autosomal dominant RDH12 retinopathy (MONDO:0800100), curated separately from the recessive disease Leber_Congenital_Amaurosis_13 following the ClinGen lumping and splitting decision. Sources: the four published families (Fingert 2008, PMID:18779497; Sarkar 2020, PMID:32322264, two families with c.759del; Muthiah 2022, PMID:34031043), the patient iPSC line (PMID:34216980) and retinal organoid study (PMID:40365019, GEO GSE271751), a 27-family Chinese RDH12 cohort with a literature review of the dominant alleles (PMID:35994252), and the ClinGen Moderate (AD) gene-disease validity record, copied into gene_disease_validity. Normal RDH12 function is cited from PMID:15865448 and PMID:22621924 with the same grading used in the LCA13 entry. The mechanism is recorded as two alternative, untested hypotheses (toxic gain of function of the shared C-terminal peptide, and dominant-negative interference with wild-type RDH12), with haploinsufficiency recorded as deprecated and the reasons given. relationship_type is left unset because CAUSATIVE requires ClinGen Definitive or Strong. MONDO:0800348 (retinitis pigmentosa 53) is deliberately not mapped: MedGen C3150208 lists RP53 as an entry term of OMIM 612712, which MONDO maps to LCA13, so its scope is not this dominant disease. No GeneReviews chapter is specific to this disease; the Nonsyndromic Retinitis Pigmentosa Overview is tagged. The OpenScientist deep-research report (research/RDH12-Related_Dominant_Retinopathy-deep-research-openscientist.md) was read after the entry was drafted. Its reference validation resolved 13/13 references with 1/1 quotes found and none off topic; its term validation flagged needs_review, with four CURIEs named as different terms (for example UBERON:0005396 given as macula lutea, which is carotid artery segment, and HP:0000548 given for reduced cone density), none of which are bound here. just preflight-dr passed (RDH12 mentioned 62 times). The report did not cover the 2020 c.759del families or the 2025 organoid study, and described PMID:32322264 as a recessive deletion, so the entry relies on the primary papers; the report's statement that OMIM 612712 is LCA13 led to dropping a draft RP53 mapping. Checked with just validate, count-verified-snippets (all snippets verified), validate-terms, check-genereviews --online and the offline whole-repo gates.

  summary: 'Create: Juvenile-Onset Diabetes Mellitus With Central and Peripheral Neurodegeneration'
  details: |
    De novo curation of MONDO:0014523 (juvenile-onset diabetes
    mellitus-central and peripheral neurodegeneration syndrome), the autosomal
    recessive DNAJC3/p58IPK disorder, for issue #8950.

    Duplicate preflight: `git grep -i MONDO:0014523 origin/main -- kb/` returned
    nothing; no existing entry, PR, or other issue covers the concept.

    Deep research: one falcon (Edison) run,
    research/Juvenile-Onset_Diabetes_Mellitus_with_Central_and_Peripheral_Neurodegeneration-deep-research-falcon.md.
    Its own reference-validation block reported 6/6 references resolved,
    confabulation_rate 0.0, 5/6 on topic, needs_review not set. NEC preflight
    (`just preflight-dr ... MONDO:0014523`) returned PASS: canonical gene DNAJC3
    mentioned 44 times against APP=3 as the next-most-frequent symbol, and the
    report's OMIM identifiers include the MONDO xref 616192. The report cites
    by author-year keys rather than PMIDs, so nothing was curated directly from
    it; it was used only to cross-check that the entity, mechanism chain and
    phenotype list matched the primary literature curated independently.

    GeneReviews baseline: not applicable. PubMed searches for
    `DNAJC3 GeneReviews[All Fields]` and for the disease name return no
    GeneReviews chapter.

    Evidence: 80 evidence snippets, every one an exact quote from a reference
    fetched with `just fetch-reference` (15 PMIDs). Anchors are the founding
    report (PMID:25466870), the natural-history series (PMID:32738013), the
    beta-cell mechanism study (PMID:33486469), the Sec61/calcium hyperinsulinism
    study (PMID:38279270), the patient-fibroblast proteomics (PMID:34692675) and
    the Dnajc3-null mouse (PMID:15793246).

    Deliberate omissions, all recorded in the entry's notes: no `conforms_to`
    (er_protein_storage_disease models hepatocellular retention of a mutant
    secretory protein, and loss_of_proteostasis is aggregation-centred; neither
    fits a congenital chaperone-capacity deficit with no demonstrated aggregating
    species); no `prevalence` (fewer than about twenty reported individuals, and
    the one large denominator in the literature is a targeted database screen,
    not a population estimate); no `frequency:` on any phenotype, since no cohort
    study reports per-feature frequencies. Two KNOWLEDGE_GAP discussions record
    the unexplained neuronal-death mechanism and the wide phenotypic variability.
    The proposed edge from insulin deficiency to neurodegeneration was removed
    rather than curated as CONDITIONAL: the neurological arm frequently precedes
    the diabetes and is not a diabetic complication.

    Validation: `just validate`, `just validate-terms`,
    `just count-verified-snippets` (80/80 verified), and the full batched
    `just validate-disorders` sweep all pass, as do
    scripts/check_snippet_length.py --against-ref origin/main,
    scripts/check_folded_hyphens.py, scripts/check_title_snippets.py and
    `just check-duplicate-keys`.

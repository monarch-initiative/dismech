  summary: 'Create: 8p Inverted Duplication Deletion Syndrome'
  details: |
    De novo curation of invdupdel(8p) from primary literature plus one openscientist deep-research run. The pathograph is built around the two-step formation mechanism, with the common maternal 8p23 inversion polymorphism curated as the first node so that the rarity of the syndrome against the commonness of its predisposing haplotype is explicit. Deletion-side gene candidates (GATA4/NEIL2/SOX7, and the defensin cluster) are curated in genetic: as candidates with INDIRECT grading rather than promoted into pathophysiology nodes, because the cardiac attributions come from isolated 8p23.1 cohorts and the immune one from a single case. Four reference_title values were written from memory and corrected against the cache after the validator flagged them, and one snippet needed a bracketed span trimmed. Validated: schema, terms, 31/31 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms.

  summary: Review 8p invdupdel mechanisms, cohort scope and clinical care from full
    sources
  details: |
    Reviewed the complete original entry and matching deep-research narrative/citations, with full-text reading of the clinical cohorts, proposed care guidance, rearrangement studies, immune case and available prenatal reports. Cache files were generated only through just fetch-reference; the shared 2022 cache now contains its patient-level table and its sole KB consumer passes exact-quote validation.

    Corrected universal maternal/de novo inheritance and spacer assumptions, distinguished measured FISH/STR/CMA endpoints from proposed recombination/dicentric/rescue mechanisms, and added complex telomere-capture architecture. Ten mechanism nodes separate structural formation and the two opposed dosage changes. Familial unbalanced transmission is retained without inventing a numerical recurrence risk. The full Shimokawa paper distinguishes Japanese allele frequency from inferred heterozygosity; its erroneous abstract frequency and chance calculation are not repeated.

    Replaced universal GATA4/SOX7 loss with measured copy-neutral recurrent cases and conditional larger-deletion involvement. RHOBTB2 and CHRNA2 remain candidates, not established triplosensitive causes. Removed NEIL2 and defensin overclaims based on differently scoped or single-patient studies. Fifty-four phenotype records preserve cohort-specific denominators, distinguish intellectual disability from developmental delay, and avoid unsupported frequency bands and pooled mixed-8p outcomes. Severe neonatal polyvalvular disease is a case observation, not syndrome lethality. The 2024 mixed-clinic aggregate MRI/cardio counts are internally inconsistent in the actual PDF and are not used.

    Six care entries and diagnostic surveillance use full proposed guidelines with their limits; symptomatic links are evidence-based, while counseling and diagnostic evaluation are not therapeutic edges. Independent bounded peer review checked inheritance, mechanisms, genetics and care against full sources; removed an unsupported rehabilitation-to-hypotonia inhibition edge and added the primary STR parent-of-origin result.

    Research completeness: clinical features, architectural subtypes, mechanisms, diagnosis and management addressed. Single-gene Gata4/Tbx5 mouse and sox7 fish studies and isolated 8p23 network analyses do not validate a whole-invdupdel model; no suitable disease-wide experimental model or clinical dataset was identified for addition. The defensin/NK/RSV hypothesis remains discussion with timing, genotype and control limitations. No disease-specific GeneReviews chapter in the committed index; current exact ClinicalTrials.gov searches returned no relevant trial. Population prevalence and individual duplication-size prognosis remain unresolved. No code/schema/provider edits or frozen dataset-accession access.

    Validation: schema, live ontology terms and 125/125 exact evidence snippets passed before commit; complete curation gates and history checks are recorded in the PR.

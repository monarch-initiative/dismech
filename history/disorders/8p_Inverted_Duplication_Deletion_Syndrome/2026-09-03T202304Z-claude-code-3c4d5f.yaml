  summary: 'Round-2 review: reachability for the polyvalvular node, seizure frequency,
    and no band for the single-case immune phenotype'
  details: |
    Two blocking items and one suggestion from the second review round.

    Reachability. Splitting the cardiac phenotype in round 1 left Polyvalvular Dysplasia with no incoming edge: the general node kept the edge from Opposed Dosage Change Across Two 8p Segments and the severe-tail record that split off it did not get one. Added as a fifth INDIRECT_UNKNOWN_INTERMEDIATES target of that node rather than a sequela of the general cardiac phenotype, since polyvalvular dysplasia is a form of the cardiac phenotype and not a consequence of it. Confirmed against the built graph (dismech.graph.build_causal_graph): the node now has an incoming edge, and the nodes still without one are all legitimate roots -- treatments, genes, and the initiating maternal inversion. Worth recording that check-causal-targets passes either way: it gates dangling targets, not unreachable nodes, so nothing in the offline set would have caught this.

    Seizure frequency. Was OCCASIONAL (5-29%) against its own evidence of 34%, and the entry elsewhere cited 55%. Regraded FREQUENT and the grade is now carried by evidence rather than by the description: the 34% cohort item keeps its place, the 55% literature-wide sentence from PMID:35327368 is added, and the same paper's 'Seizures were reported in only one case' is curated as a REFUTE item, because one of its own eight patients is 12.5% and would be OCCASIONAL. The band follows the two larger denominators; the small-series discordance is recorded rather than dropped.

    Recurrent Respiratory Infections. Carried OCCASIONAL reasoned from a single case, while Polyvalvular Dysplasia reasoned from a single case to VERY_RARE -- the same input in opposite directions. Neither is right here: the source is a mechanistic report whose authors state cellular immune function had never previously been described in this syndrome, so there is no denominator at all. Removed the frequency and said so in both the description and the evidence explanation. Absent means unassessed, which is the true state.

    Validation: schema, term and reference validation pass with 43/43 snippets verified, and all ten offline gates pass including check-snippet-grading. Reference-cache churn was reverted before staging.

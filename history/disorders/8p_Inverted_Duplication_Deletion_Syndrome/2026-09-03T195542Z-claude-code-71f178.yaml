  summary: 'Review round 1: address ai4c-reviewer findings on #10769'
  details: |
    Addressed six findings. (1) The Recurrent Respiratory Infections phenotype was an orphan node, unreachable in the pathograph; connected from the dosage node along with hypotonia and facial dysmorphism. (2) SOX7 and NEIL2 were left unbound on the false premise that their HGNC identifiers were unresolvable; the reviewer correctly points out that cache/ is not the term authority and the OAK adapter is - both resolve, and each now has its own genetic record. (3) relationship_type CAUSATIVE contradicted the entry's own framing of these genes as candidates with INDIRECT evidence; changed to UNKNOWN on all four records. (4) Added hypotonia, dysmorphic facial features and the psychomotor/language delay wording from PMID:35327368. (5) The cardiac phenotype graded a general finding OCCASIONAL from a single fatal case report while cohorts report cardiovascular malformation at 65%; split into a FREQUENT general cardiac phenotype and a VERY_RARE polyvalvular dysplasia record carrying the fatal case and its own paper's calibrating REFUTE. (6) Added a treatments section covering anti-seizure medication, developmental and rehabilitative therapy, and cardiac repair, all on the no-evidence-with-notes pattern. Also took the dicentric-intermediate suggestion: PMID:35327368 supplies the modern framing of the 2004 model's rescue step and establishes that U-type exchange is an alternative route accounting for one of eight cases. Revalidated: schema, terms, 41/41 snippets, all offline gates.

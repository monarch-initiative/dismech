  summary: 'Create: LZTFL1-Related Ciliopathy (BBS17)'
  details: |
    De novo curation of MONDO:1040046 (LZTFL1, AR ciliopathy / BBS17). claude_code deep research. Mechanism: biallelic LZTFL1 LoF -> dysregulated BBSome ciliary trafficking -> branches: hedgehog/Smoothened activation (mesoaxial polydactyly), photoreceptor connecting-cilium dysfunction (rod-cone dystrophy), hypothalamic leptin resistance (obesity). ClinGen DEFINITIVE (Retina GCEP, CGGV assertion) recorded in gene_disease_validity. Two Lztfl1 KO mouse models RECAPITULATE retina and obesity arms. 21/21 snippets verified; all gates pass. Distinct from the general Bardet-Biedl entry and from the non-Mendelian 3p21.31 COVID-19 locus.

  summary: Re-review BRAF V600E-mutant NSCLC scope, graph, and treatment evidence
  details: |
    Rebuilt the record around somatic class-I BRAF V600E, sustained MEK-ERK signaling, tissue-context and tumor-suppressor cooperation, metastatic progression, and acquired BRAF/MEK-inhibitor resistance. Corrected the disease-term scope to non-small cell lung carcinoma, removed the erroneous non-V600 child, and added evidence-backed epidemiology, histopathology, phenotypes, molecular diagnosis, differential diagnoses, progression, targeted and systemic treatment context, three current phase-II trial records, two lung-specific mouse models, an isogenic human lung epithelial model, and four bounded knowledge gaps. Replaced noisy imported references with an exact 21-source evidence set, wired all phenotypes and the causal BRAF gene, and documented that no public accession could be verified for the cited multi-omics model study.

  summary: 'Create: LGMDR28 (MONDO:0957270, HMGCR)'
  details: |
    De novo curation of limb-girdle muscular dystrophy autosomal recessive 28 (LGMDR28), biallelic HMGCR. entry_type decided as DISEASE rather than a has_subtypes entry on Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy: that parent entry's own description asserts sarcolemmal fragility and failed membrane repair as the shared mechanism of its eight subtypes, and LGMDR28 is a mevalonate-pathway flux defect with normal dystrophin/sarcoglycan/dysferlin immunohistochemistry, so folding it in would place a mechanistically foreign pathograph inside that entry. Linked via parents: instead. Named Entity Confusion is the central risk here and is a same-protein rather than a same-name problem: three diseases involve HMG-CoA reductase (this germline Mendelian disease, statin-associated myopathy, and anti-HMGCR immune-mediated necrotizing myopathy). OAK confirms MONDO:0957270 is the only term carrying RO:0004003 HGNC:5006; the other two are curated as differentials bound to MONDO:0100637 and MONDO:0016098. Anti-HMGCR myopathy papers that present as limb-girdle mimics (PMID:30588482, PMID:32447205, PMID:35754285) were read and excluded rather than mined. Pathograph: reduced HMGCR catalytic activity to mevalonate flux reduction to isoprenoid depletion and impaired Rab geranylgeranylation to myofiber mitochondrial dysfunction and impaired myoblast fusion to myofiber loss with fatty replacement to weakness, CK elevation and respiratory failure. Two mouse models curated as PARTIALLY_RECAPITULATES and RECAPITULATES with the framing mismatch recorded in limitations, since both papers describe their muscle-specific Hmgcr nulls as statin-myopathy models while the genotype is closest to LGMDR28; the p.Arg641Cys knock-in is curated as FAILS_TO_RECAPITULATE with limitations and evidence because homozygotes die in utero. The falcon deep-research run returned preflight WARN for CERT1 at 31 percent of HMGCR mentions; on reading, CERT1 appears only in the report's own caveat that Open Targets returns it as a 5q13 locus-level artifact, independently corroborated by the founding kindred's 3.2 Mbp linkage interval containing a single candidate variant, so the report was kept but contributed no content. Acting on the automated second opinion on issue 10244: corrected the experimental model from PRIMARY_CELL_CULTURE to CELL_LINE (C2C12, ATCC), and corrected an overstated absence of cardiac involvement after checking PMID:36745799, which reports slightly raised troponin T in four of four patients tested and ECG conduction changes in two; a Subclinical Cardiac Involvement phenotype was added and the description and differential were requalified. Also added exercise-induced myalgia, an alpha-dystroglycan knowledge gap, and notes recording the HPO-curated biopsy findings that could not be quoted because the discovery-cohort cache is abstract-only. Validation: just validate exit 0, just validate-terms exit 0, 85 of 85 snippets verified, check-entity-refs exit 0.

  summary: 'Create: Dysferlinopathy'
  details: |
    New entry for MONDO:0016145 (dysferlinopathy, DYSF), curated from the
    seeded stub, which this change deletes.

    Scope: one Disease entry with six clinical-presentation subtypes (LGMD R2,
    Miyoshi myopathy, DMAT, proximodistal, asymptomatic hyperCKemia and the
    congenital Paradas type). The first three and the congenital form carry the
    MONDO child terms of MONDO:0016145, looked up in OLS. They are subtypes rather
    than separate entries because the same DYSF variant produces different
    presentations and the Jain natural history cohort found no clinically
    relevant proximal-versus-distal split (PMID:33610434).

    Sources: the GeneReviews Dysferlinopathy chapter (PMID:20301480, tagged
    GeneReviews) is the phenotype baseline; its presentations, management
    advice and weight-control circumstance to avoid are represented, and the
    scapuloperoneal presentation it lists is mentioned in notes without a
    subtype row. Primary papers were found by PubMed search and
    fetched with just fetch-reference; all snippets quote abstracts. The
    OpenScientist deep-research report
    (research/Dysferlinopathy-deep-research-openscientist.md) was used as a lead
    list: its 23 references all resolved, and the papers taken from it are
    PMID:37716854, 26088049, 21658164, 19380584, 17825554, 17994539, 23254335,
    36972667, 40740171 and 28707952. Its unresolved HP:0003734 and its
    NCIT:C15431 (hematopoietic cell transplantation, called gene therapy in the
    report) were not used, and its Orphanet ID for the disease disagrees with
    the MONDO cross-reference and was not used. just preflight-dr returned
    WARN: DYSF is the most-mentioned gene (26), and the second gene flagged,
    C3 (12), is complement C3 from the dysferlin-null C3 knockout study, a
    modifier of this disease rather than a second disease entity; the other
    "genes" counted (C2, HP) are dysferlin C2 domains and HPO prefixes.

    Pathophysiology is a chain from biallelic DYSF loss of function through
    defective calcium-dependent sarcolemmal resealing, persistent membrane
    lesions, t-tubule instability, myofiber necrosis, complement-rich
    inflammation, attenuated regeneration, intramyofiber lipid and
    fibro-adipogenic replacement to progressive weakness, conforming to the
    sarcolemmal_fragility_myofiber_necrosis module at the repair-failure,
    necrosis, inflammation, fibro-adipose and weakness nodes. The deflazacort
    trial (PMID:23406536) is recorded as REFUTE evidence on a corticosteroid
    treatment and as a clinical trial. Cardiomyopathy carries supporting and
    refuting evidence because the Tunisian and natural history cohorts
    disagree. No ClinGen validity is recorded: the cached DYSF assertion is for
    MONDO:0015152, a different disease term. No prevalence is recorded because
    no estimate was found in a citable abstract.

    Validation: just validate, validate-terms, count-verified-snippets
    (116/116) and validate-disorders pass, as do the entity-reference,
    causal-target, duplicate-key, GeneReviews and gene-term checks.

  summary: 'Review round 1: Dysferlinopathy'
  details: |
    Review round 1 on PR 15386. Added molecular_functions GO:0005544 calcium-dependent phospholipid binding (DECREASED) to the Biallelic DYSF Loss of Function node, supported by PMID:11959863, which shows the dysferlin C2A domain binds phosphatidylserine in a calcium-regulated way and that a disease missense allele reduces this binding; this grounds the DYSF gene in a molecular function for the gene-activity grounding gate. Regraded the PMID:25815352 background sentence on the Myofiber Necrosis to Fibro-Adipogenic Replacement edge from OTHER to HUMAN_CLINICAL, keeping quote_role BACKGROUND, because the quoted sentence describes the human disease. Rebound the fibro/adipogenic progenitor cell type from CL:0008019 mesenchymal cell to the specific CL:0009099 fibro/adipogenic progenitor cell. Added the PMID:12445162 sentence on the extent of fibre degeneration and regeneration as the primary evidence for the Muscle fiber necrosis phenotype, keeping the MHC class I sentence as supporting evidence. Validated with just validate, validate-terms, count-verified-snippets, the snippet-grading and gene-activity grounding gates, and validate-disorders.

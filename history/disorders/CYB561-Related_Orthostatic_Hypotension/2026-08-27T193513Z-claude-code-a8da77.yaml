  summary: 'Create: CYB561-Related Orthostatic Hypotension'
  details: |
    Curated CYB561-related orthostatic hypotension (MONDO:0020751) from a claude_code deep-research report. Seven pathophysiology nodes, one connected component. The mechanism is a compartment-specific redox-recycling defect: cytochrome b561 regenerates ascorbate inside the catecholamine secretory vesicle, so its loss starves dopamine beta-hydroxylase of cofactor while leaving the enzyme structurally intact and catalytically normal on plasma assay. That dissociation is curated as both a pathophysiology node and a biochemical readout because it is the diagnostic discriminator against DBH deficiency. Droxidopa is modeled as BYPASSES on the functional-deficiency node, since it reaches noradrenaline without the cofactor-dependent step. The preflight WARN (DBH at 63 percent of CYB561 mentions) was genuine and is addressed: DBH content was used only for the differential, an INTERPRETATION discussion curates the relationship explicitly as a phenocopy rather than a subtype, and no DBH-deficiency observation is cited as a CYB561 finding. A second entity risk the preflight did not flag was found and handled: PMID:36903505 concerns CYB561D1, a different family member in a cancer context, and is cited only for the family-level biochemical property with the explanation saying so; two further search hits on other family members were excluded entirely. A KNOWLEDGE_GAP records the unexplained mismatch between broad CYB561 expression and the narrowly noradrenergic phenotype. Prevalence is CASES_IN_LITERATURE against five characterized patients. One schema fix: readout direction NO_CHANGE is not permitted, replaced with PRESENT_ABSENT and the interpretation reworded to match. Validation: 17/17 snippets verified plus an independent raw-substring re-check; schema, terms, entity-refs, duplicate-keys and reference titles pass.

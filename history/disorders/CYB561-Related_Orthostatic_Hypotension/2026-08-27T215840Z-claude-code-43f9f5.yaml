  summary: Correct a factual error in the phenocopy discussion; add hypoglycaemia
    arm and three phenotypes
  details: |
    Addressed the REQUEST_CHANGES review on PR 9759. The most important item was a FACTUAL ERROR I introduced: the cyb561_phenocopy_not_subtype discussion claimed CYB561 deficiency and dopamine beta-hydroxylase deficiency share a profile of absent noradrenaline and adrenaline WITH PRESERVED DOPAMINE. Preserved dopamine is not shared - it is a CYB561 finding, and in primary DBH deficiency plasma dopamine is characteristically elevated because it accumulates upstream of the enzymatic block. I verified against the cached full text: the founding report says only 'As in dopamine beta-hydroxylase deficiency, concentrations of norepinephrine and epinephrine in the patients were low' and says nothing about dopamine in DBH deficiency. The claim was therefore both unsourced and backwards. The discussion now narrows the shared-profile claim to what the source states, says explicitly that preserved dopamine is a difference rather than a similarity, and records that an earlier version had it wrong. Two sourced discriminators were added to the same discussion: the CYB561 syndrome is 'more malignant in terms of renal insufficiency and reduced life expectancy', and ptosis and skeletal muscle hypotonia occur in DBH deficiency but were not seen in CYB561 patients. Also added: a second downstream arm from Noradrenaline and Adrenaline Deficiency to Impaired Catecholamine Counter-Regulation of Hypoglycaemia and thence to Recurrent Hypoglycaemia, since adrenaline is a principal counter-regulatory hormone and a partial pancreatectomy in one patient did not help, which localizes the defect to counter-regulation rather than insulin secretion; three phenotypes from the cached full text (recurrent hypoglycaemia, progressive renal insufficiency, reduced life expectancy); the mouse model limitation that mice unlike humans synthesize ascorbate de novo, which is the strongest reason the knockout under-represents human severity in an ascorbate-recycling disease and is why fidelity is MODERATE; and the sweating half of the preserved-function phenotype, which was previously evidenced only for heart rate. Validation: 24/24 snippets verified plus raw-substring re-check; 9 nodes in one component; schema, terms, entity-refs and duplicate-keys pass.

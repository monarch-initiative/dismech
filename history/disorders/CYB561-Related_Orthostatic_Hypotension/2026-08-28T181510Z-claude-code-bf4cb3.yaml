  summary: 'Follow-up #9787: life-expectancy frequency band, drop self-narrating sentence,
    PAM arm, droxidopa dosing, DHPG and CSF MHPG'
  details: |
    Clears the three CYB561 items deferred from PR #9759 review and tracked in issue #9787.

    discussions: removed the sentence in cyb561_phenocopy_not_subtype that narrated its own edit history ('An earlier version of this discussion listed preserved dopamine among the similarities...'). It rendered on the disorder page, where a reader has no earlier version to compare against, and git history is this repo's change log. The substantive point it was hedging - that preserved dopamine is a CYB561 finding and points the wrong way for a shared feature - is stated directly in the surrounding sentences and is unaffected.

    phenotypes: Reduced Life Expectancy frequency OCCASIONAL to FREQUENT. This is arithmetic, not judgement. Three of the four molecularly confirmed patients are dead - D1 at 37 after a prolonged circulatory arrest sustained while off droxidopa, A1 at 59 and A2 at 48 of causes never established - which is 75%, inside FREQUENT (30-79%) and well outside OCCASIONAL (5-29%). The description previously led with the brother who died at 16; he predates the molecular diagnosis and is not among the four confirmed patients, so he is now named as uncounted rather than used as the lead example. Two evidence items were added to carry the count, since the pre-existing qualitative 'reduced life expectancy' quote supports the phenotype but not the band.

    pathophysiology: added the PAM arm to Intravesicular Ascorbate Depletion. Peptidylglycine alpha-amidating monooxygenase draws on the same intravesicular ascorbate pool as dopamine beta-hydroxylase and amidates alpha-MSH, oxytocin, vasopressin and gastrin, so the lesion should in principle disable neuropeptide amidation as well as noradrenaline synthesis. No neuropeptide phenotype has been reported in any of the four patients. Curated as an open asymmetry rather than resolved, and the existing cyb561_expression_versus_phenotype knowledge gap was extended with it - it is the sharpest form of that discussion's question, because it is about a second enzyme in the same vesicle rather than about tissue expression.

    treatments: added droxidopa dosing (200 mg once to three times daily across all four patients) and tolerability (nausea, headache, lumbar pain). Tolerability carries more weight here than for a symptomatic drug, because droxidopa is the only treatment that addresses the lesion at all - a point the series makes bluntly, since D1's fatal arrest occurred while she was off treatment.

    biochemical: added plasma dihydroxyphenylglycol and CSF 3-methoxy-4-hydroxyphenylglycol. DHPG is the intraneuronal metabolite, so undetectable DHPG says the noradrenaline was never made rather than made and cleared, which distinguishes a synthetic defect from a release or reuptake one. CSF MHPG is the entry's only direct evidence about the brain and is a three-part result: central noradrenaline depleted, while CSF HVA and 5-HIAA are normal, so dopamine and serotonin are intact. Neither carries a term: CHEBI has only conjugates (the DHPG O-sulfate, the MHPG glucuronide and sulfate) and not the free metabolites, and a conjugate is a different analyte. Recorded in each context field so the absence is not read as an omission.

    Review follow-up (PR #9900). Four changes.

    Blocking: the droxidopa dosing and tolerability items were attached to
    target_mechanisms[0], whose claim is BYPASSES - supplies a substrate that reaches
    noradrenaline without passing through the cofactor-dependent step. Neither quote
    bears on that. target_mechanisms[].evidence backs the treatment-to-mechanism edge in
    the pathograph, so this was not a tidiness issue. Both moved to Treatment.evidence,
    which was empty; tolerability regraded PARTIAL, matching how ATTR_Amyloidosis grades
    diflunisal's adverse-event quote.

    Blocking: "the four molecularly confirmed patients" contradicted two other sections
    of the same entry. prevalence.notes records four patients in the founding report
    plus one further compound heterozygote characterized subsequently, so five are
    confirmed. Reworded to "the four patients in the founding report" and the same
    imprecision fixed in three other places, including one pre-existing sentence in the
    expression-versus-phenotype discussion. The frequency band is unaffected: three of
    five is 60%, still inside FREQUENT.

    Dropped the claim that the van den Berg range is "the only dosing guidance this
    disease has". Shibao 2020 is already cited in this entry and also reports dosing; its
    cache is abstract-only so it cannot be quoted, but the exclusivity claim was simply
    wrong.

    Regraded the two PAM evidence items from HUMAN_CLINICAL to OTHER. They quote the
    paper's background enzymology - which enzymes need intravesicular ascorbate, and what
    the amidating one does - not an observation in the patients.

    Bound plasma DHPG to NCIT:C101017 (3,4-Dihydroxyphenylglycol Measurement) after an
    NCIT search the first pass did not run; only CHEBI had been checked. NCIT
    "... Measurement" terms are established practice for biomarker_term in this KB
    (Creatine Kinase Measurement in seven entries, Lactic Acid Measurement, Hemoglobin
    Measurement). CSF MHPG stays unbound: NCIT's only MHPG term is NCIT:C220216, a URINE
    measurement, and this result is in cerebrospinal fluid, so binding it would name the
    wrong specimen. Both context fields now record which ontologies were searched.

    The cache/ncit/terms.csv row for NCIT:C101017 was seeded by just validate-terms.

    Greek letters and en-dashes in the quoted fragments were lifted programmatically from references_cache/PMID_29343526.md rather than retyped.


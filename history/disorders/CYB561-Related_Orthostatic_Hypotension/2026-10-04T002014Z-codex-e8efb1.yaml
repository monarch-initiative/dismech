- type: REVIEW
  outcome: changed
  summary: Review CYB561 deficiency against full-text clinical and biochemical evidence
  details: |
    Reviewed the deep-research report and citations across all eight completeness dimensions, then read the recovered full texts of PMID:29343526 and PMID:31822578 including the founding clinical and mouse tables. Corrected overlapping case counts (five confirmed individuals in three families, plus one untested relative), hypoglycemia mechanism and duration, mortality interpretation, DBH differential, mouse limitations and dosing evidence. Added source-specific genetics, diagnostics, syncope, anemia and retrograde ejaculation; moved preserved function and outcomes into appropriate sections. Replaced CYB561D1 family-level evidence with primary bovine CYB561 biochemistry (PMID:14769875 and PMID:14999009; abstract-only after full-text attempts). Kept unmeasured vesicular and pancreatic mechanisms provisional or hypothetical. Verified hgnc:2571 and MONDO:0020751 through OAK; rejected incorrect report identifiers and gene-family substitutions. GeneReviews helper: NO_CHAPTER; generic StatPearls OH chapter is adjacent scope. ClinicalTrials.gov API CYB561 search returned zero studies on 2026-10-04. General OH supportive treatments and standard recessive counseling in research were extrapolations, not CYB561-specific trials or guidelines. No validated clinical subtypes or quantitative penetrance estimate established. Schema, term, reference and content checks run before PR.

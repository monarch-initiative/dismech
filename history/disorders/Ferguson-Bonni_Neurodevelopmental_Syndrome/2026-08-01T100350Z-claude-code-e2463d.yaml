  summary: Repair 16 unverifiable clinical-phenotype snippets (Table S2 provenance)
  details: |
    Repaired 16 clinical-phenotype/diagnostic/treatment evidence snippets flagged in #7598 as absent from the cached text of DOI:10.1016/j.molcel.2021.11.031 (Ferguson et al. 2021, Mol Cell). Root cause: the curator correctly read phenotypes from the paper's supplemental clinical-characteristics table (Table S2) and Figure S3D legend, both of which are outside the cached PMC full text (main text + figure legends only). This was a provenance defect, not a hallucination -- 15 of the 16 claims are independently corroborated by the HPO annotation set for OMIM:619699 (the same 11-patient Old Order Amish cohort). Fixes: 1) Micrognathia, High palate, Hypertelorism, Pectus excavatum -- re-snippeted to the verifiable main-text sentence 'Skeletal and/or craniofacial deformities were seen in a subset of patients', downgraded supports to PARTIAL, moved per-phenotype HPO n/11 counts to notes. 2) Hypotonia, Hearing impairment (4 occurrences across phenotype/diagnostic/treatment nodes), Strabismus (3), and the combined CDH/unilateral-ptosis/microcephaly/PFO evidence (2, diagnostic + treatment) -- snippet field removed, claim relocated to notes, evidence item retained without a verbatim quote. 3) Body weight, length and head circumference of affected patients (Figure S3D legend) -- snippet removed, explicitly NOT repointed to the cache's mouse body-weight text. 4) Cleft palate -- evidence block removed entirely since, unlike the other 15, it is absent from both the cache and the HPO annotation set and may be conflation with the separately-evidenced Pierre-Robin sequence finding in patient 2137; retained as an unevidenced phenotype with an explanatory note rather than fabricating support. All PMID:34942119-cited snippets (10) were left untouched -- they already verify. Independent checker scripts/check_snippets_verbatim.py confirms 30/30 verified, 0 failed, previously 26/42 verified with 16 failed. linkml-validate, linkml-term-validator, linkml-reference-validator, and pytest tests/test_data.py all pass.

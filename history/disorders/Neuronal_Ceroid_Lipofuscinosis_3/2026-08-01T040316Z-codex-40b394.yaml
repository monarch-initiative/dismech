  details: |
    Curated PMID:41501856 into the existing CLN3/juvenile Batten disease entry. Added the paper as a publication reference, replaced coarse progression phases with four evidence-backed pooled natural-history phases spanning vision loss through advanced disability and death, and added five previously absent phenotype records: blindness, speech and language impairment, cardiac conduction abnormality, loss of ambulation, and feeding difficulties. Preserved CLN3 scope rather than projecting these estimates onto the full Batten disease spectrum. Treated weighted means as cohort-level estimates, retained symptom-specific N and SD, and recorded mixed-method and small-sample limitations. Fetched the reference cache through linkml-reference-validator; schema, offline term, and strict cached-snippet validation passed.

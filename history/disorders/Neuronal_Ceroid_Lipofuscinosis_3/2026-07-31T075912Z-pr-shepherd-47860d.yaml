  details: |
    PR Shepherd fixes for the four IMPORTANT items in the ai4c-reviewer review of PR #7192. (1) TRPML1 under-consumption: added an 'Experimental TRPML1 agonist lysosomal-storage rescue' treatment carrying the paper's headline finding as an IN_VITRO evidence item, linked via target_mechanisms INHIBITS to the 'CLN3 endolysosomal membrane dysfunction' node (which already conforms to lysosomal_substrate_accumulation). Framed as incomplete in-vitro proof-of-concept, noting BMP levels were not restored. (2) Trials: added the three missing research-surfaced programs - NCT01399047 mycophenolate mofetil, NCT05174039 miglustat, NCT04637282 PLX-200 (the Phase 3 flagged as blocking). References fetched with just fetch-reference; no cache file was hand-created. Phase and status were confirmed against the live ClinicalTrials.gov v2 API rather than taken from the deep-research artifact: NCT01399047 PHASE2/COMPLETED, NCT05174039 PHASE1+PHASE2 (recorded PHASE_I, no combined value in schema), NCT04637282 PHASE3/NOT_YET_RECRUITING (recorded NOT_RECRUITING, no NOT_YET_RECRUITING value in schema); both substitutions are stated in the trial descriptions. Also added a mycophenolate mofetil treatment (CHEBI:8764, verified with OAK). (3) Added 'Vacuolated lymphocytes on peripheral blood film' as a biochemical entry with the two already-cached exact quotes from PMID:31926949 and PMID:33137890 - the classic accessible CLN3 bedside screening marker. (4) Dropped the ICIMD evidence item whose snippet supported only the generic 'lysosomal storage disease' framework rather than the ICIMD placement, per the disease-classification skill's preference for notes alone; expanded the notes to cite the icimd.yaml is_a axiom and state why no evidence is attached. Also applied non-blocking suggestion 5: added harrisons_chapter NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE. Validated: just validate, validate-terms, validate-references all pass; all 44 evidence snippets in the entry re-verified as exact whitesp
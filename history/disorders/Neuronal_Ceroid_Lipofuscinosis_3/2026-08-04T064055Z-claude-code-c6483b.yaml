  summary: Curate CLN3 symptom-onset timeline (PMID:41501856)
  details: |
    Curated PMID:41501856 (Whiteman et al., Orphanet J Rare Dis 2026), a pooled meta-analysis of nine CLN3 natural-history studies (423 patients) yielding weighted mean age at onset for 13 core symptoms. Added onset descriptors (JUVENILE/YOUNG_ADULT + mean_age_years) to the 7 existing phenotypes covered by the paper (Visual impairment, Atypical behavior, Cognitive impairment, Seizure, Sleep disturbance, Motor deterioration, Parkinsonism) and added 5 new phenotypes for milestones with no prior entry: Complete blindness (HP:0000618), Speech and language impairment (HP:0002463), Cardiac conduction abnormality (HP:0031546 -- chosen over the issue's suggested Arrhythmia HP:0011675 as a better fit for the paper's sinus-node-dysfunction/bradycardia/conduction description), Loss of independent walking (HP:0002505), Feeding difficulties requiring enteral feeding tube (HP:0011968). Refined the 3 existing progression phases with PMID:41501856 evidence and split the former merged Motor-decline/seizures/premature-death phase into Motor decline and seizures (10-18y) plus a new Late multisystem decline and mortality phase (18-23y: cardiac conduction abnormality, loss of independent walking, enteral feeding, death), since the paper's pooled data show these as a distinct later cluster. Added a KNOWLEDGE_GAP discussion on the paper's own call for standardised longitudinal CLN3 natural-history data, linked to the entry's four existing clinical trials. Added a top-level notes block recording pooling caveats (9 heterogeneous studies, per-symptom N 35-254, age-at-reported-onset vs biological onset, wide SD on sleep disturbance). Deliberately did not propagate these CLN3-specific ages to the umbrella Neuronal_Ceroid_Lipofuscinosis.yaml entry or grouping, per the issue's own scoping. Snippets were sourced directly from the cached full text (references_cache/PMID_41501856.md, gold OA/CC-BY via OpenAlex) via exact-substring extraction rather than retyped, to preserve non-breaking/thin-space characters used in the source HTML formatting. Deferred the clinical_burden/surrogate_endpoint framing mentioned as a further opportunity in the issue as out of scope for this bounded pass. All 63 snippets in the touched file verify against cache; just validate and just validate-terms pass clean.

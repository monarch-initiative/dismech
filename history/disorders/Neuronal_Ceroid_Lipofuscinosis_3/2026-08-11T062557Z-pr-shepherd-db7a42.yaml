  summary: Address review feedback on CLN3 symptom-onset timeline
  details: |
    Review-response session on PR #7923 (ai4c-reviewer CHANGES_REQUESTED). Fixed
    five blocking study-attribution issues against references_cache/PMID_41501856.md.

    1. Replaced the incorrect "across nine studies" template phrasing on per-symptom
       onset notes and evidence explanations with the actual contributing-study
       counts from the paper: vision loss four studies (N=254), cognitive decline
       three studies reporting mean and SD (N=219), sleep disturbance one study
       (N=111), Parkinsonian gait one study (N=111). Behavioural change drops the
       count entirely because the paper does not state how many studies fed its
       pooled N=194.
    2. Removed the self-contradiction in the sleep-disturbance onset note
       ("across nine ... reported by only one of the nine").
    3. Added the single-study caveat to Parkinsonism, matching the treatment already
       given to sleep disturbance and feeding difficulties, per the paper's own
       limitations paragraph.
    4. Rebound the enteral-feeding phenotype from HP:0011968 (Feeding difficulties)
       to the exact child term HP:0033454 (Tube feeding), verified with OAK.
    5. Widened the late-phase age_range from "18 to 23 years" to "18 years through
       the third decade", which no longer contradicts its own notes or the paper's
       reported twenty-to-thirty-year life expectancy (range 20-39 years); added a
       supporting evidence item quoting the life-expectancy sentence.

    Also took three non-blocking suggestions: removed changelog prose from the
    motor-decline/seizure phase notes and the trailing non-propagation sentence from
    the top-level notes; retargeted the now-stale "mortality window" explanation on
    the split phase; and added PMID:41501856 to the top-level references block with
    findings.

    Left for follow-up (new curation rather than corrections): min_age_years /
    max_age_years population, a companion Dysarthria phenotype, sex-difference
    phenotype_contexts, and the protracted / vision-loss-only subtypes.

    Validation: just validate (schema clean; Snippets checked: 64/64 verified
    against cached references) and just validate-terms (passed) on the changed
    entry. Unrelated references_cache/ and molecularfunctionterm enum normalization
    churn produced as a validator side effect was discarded to keep PR scope tight.

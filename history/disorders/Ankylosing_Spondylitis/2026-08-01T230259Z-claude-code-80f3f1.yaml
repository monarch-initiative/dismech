  summary: 'Review fixes: HUMAN_CLINICAL prevalence evidence, corrected prevalence
    band, restored entheseal mechanism with citation'
  details: |
    PR #7476 blocking-review fixes (items 2 and 3).

    evidence_source (item 2): both PMID:32712723 prevalence evidence items (North America,
    Europe) were tagged OTHER on the grounds that the publication is a review. Publication
    format is not the discriminator; the cited content is pooled human epidemiology, so both are
    retagged HUMAN_CLINICAL.

    Prevalence band correction (found while editing those blocks): 0.20% and 0.25% are 200 and
    250 per 100,000, which fall in ABOVE_1_IN_1000 (>100 per 100,000), not BAND_1_5_PER_10000
    (10-99 per 100,000). Both prevalence_class values corrected to ABOVE_1_IN_1000, matching the
    schema's own numeric band definitions and scripts/migrate_prevalence.py _band_from_rate().

    Mechanical Stress at Entheses (item 3): the PR had deleted accurate mechanistic biology
    (microtrauma, cartilage-peptide release, local vascularization) and replaced it with a
    sourcing disclaimer. Restored the original mechanistic description and attached a real
    supporting citation: PMID:33547227 (RMD Open narrative review of biomechanical stress in
    axSpA), fetched with just fetch-reference, quoted verbatim from the cached full text,
    supports PARTIAL, evidence_source MODEL_ORGANISM because the quoted sentence explicitly
    attributes the finding to preclinical studies and does not cover the cartilage-peptide or
    vascularization detail. The pre-existing PMID:39590356 PARTIAL item is retained.

    Other prose de-meta-commentary (item 3): Uveitis phenotype notes and the HLA-B27 genetic
    notes were rewritten to state the clinical facts (25.8% pooled versus up to ~50% reported;
    HLA-B27 present in roughly 90% of patients, with most carriers unaffected) instead of
    commenting on what the entry's own citations do or do not establish.

    Validation: just validate and just validate-terms pass; just validate-references reports
    42/43 snippets verified (1 skipped by prefix).

    Added the missing transmission block; the bound T. whipplei agent record was not touched. Two records, because neither proposed route is established: environmental exposure to soil and sewage (PMID:37727483 background statement, PMID:36626499 regional inpatient distribution, marked directness INDIRECT since the inference is geographic), and human-to-human faecal-oral acquisition (PMID:36626499, which names both routes as hypothesized and reports 1-11 percent faecal carriage in healthy people). Both descriptions state that carriage is far commoner than disease and that host susceptibility is what differs. Validated with just validate (46/46 snippets verified).

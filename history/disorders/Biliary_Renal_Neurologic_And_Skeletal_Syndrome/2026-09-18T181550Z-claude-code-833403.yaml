  summary: 'Create: Biliary_Renal_Neurologic_And_Skeletal_Syndrome'
  details: |
    De novo curation of BRENS / TTC26 ciliopathy (MONDO:0859191) from an openscientist deep-research report plus independent PubMed work.

    Deep research: just research-disorder openscientist; report committed at research/Biliary_Renal_Neurologic_And_Skeletal_Syndrome-deep-research-openscientist.md. Frontmatter: reference_validation 17/17 verified, confabulation_rate 0.0. term_validation flags 2 obsolete terms (HP:0001388 replaced by HP:0001382; NCIT:C29273) and 1 mislabelled term; none of the three is used in this entry, and the obsolete flags were read before term selection rather than after.

    Lump/split decision. The disease name enumerates four organ systems, which is normally the shape of a grouping. Curated as a single Disease because all four failures follow from one lesion in one conserved transport machine and the entry models them as one pathograph; the reasoning is stated in the entry description rather than left implicit.

    The report contributed a real mechanistic refinement, not just breadth. My first pass had the Hedgehog node as 'signalling is dysregulated'. PMID:25340710 localises the failure: Gli still accumulates at the ciliary tip on Hedgehog stimulation, and what fails is the subsequent dissociation of Gli from Sufu - which the authors state distinguishes Ttc26 from the previously characterised IFT-B mutations. So the lesion is not 'cargo does not arrive' but 'cargo arrives and is not released'. The report also supplied PMID:39514123, the first BRENS case without biliary involvement, which is cited as REFUTE against the claim that cholestasis is obligate and is why that phenotype is FREQUENT rather than VERY_FREQUENT despite naming the disease.

    Recorded tension rather than resolving it: patient cells show cilia of variable length, the hop mouse shows no decrease in number or length. Both agree the organelle is built, which is the load-bearing claim; they differ on dimensions, which nothing downstream depends on. The entry says so.

    Gene symbol: the live HGNC record for hgnc:21882 gives IFT56 with prev_symbol TTC26 (checked against the HGNC REST API). The OBO build the term validator resolves against still carries TTC26, so term.label binds TTC26 - copied from the source the validator checks, per the ontology-term contract - and the entry notes record the lag and that the label will need updating when the build catches up. Same situation as dismech#10102 for GBA1/GBA.

    Schema gap encountered: the Ift56hop mouse does not express neonatal cholestasis, the defining human phenotype, and nothing about mice prevents it, so this is an incomplete phenotype rather than a species mismatch. ModelDivergenceTypeEnum has no value for that. Recorded as OTHER with 'Incomplete phenotype:' as the opening words and a pointer to dismech#11743, which already tracks the gap; commented there with this instance rather than filing a duplicate.

    Validation: just validate passes with 21/21 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms all pass. GeneReviews: NO_CHAPTER for both collections.

    Deliberately not done: adding this entry to kb/groupings/Ciliopathies.yaml. It belongs there, but that is a shared file other ciliopathy curation may be touching, so it is left as a follow-up rather than risking a conflict in a single-disease PR.

  summary: Review TTC26-related biliary, renal, neurologic and skeletal syndrome
  details: |
    Reviewed the complete entry, both prior history records, the OpenScientist report and citation sidecar, all disease-specific clinical abstracts, and available full scientific texts for the 2021 case and TTC26 experiments (2012, 2014, 2017, 2022 and 2026). Read the 2024 case full text online; publisher cache fetches were blocked, so snippets use its retrieved abstract. Used generated PMC URL caches where PMID retrieval supplied only abstracts. Corrected the literature count, compound-allele phasing, RNA-assay interpretation, unsupported phenotype frequencies, renal and cardiac specificity, and anatomical conflation of photoreceptor injury with optic atrophy. Added pituitary, limb, craniofacial, growth and feeding findings, with suspected hearing impairment explicitly provisional. Separated IFT localization, axonemal architecture and Hedgehog signaling, preserved assay-dependent GLI differences, and qualified the human motile-cilia and biliary mechanisms. Model background effects do not establish human modifiers; the FLNB/TTC26/PRMT7 scoliosis study remains an emerging discussion, not BRENS therapy. Added transplant, hormone replacement with explicitly indirect general-PSIS evidence, fundoplication and gastrostomy. No disease-specific GeneReviews chapter or TTC26 trial was found. Completeness assessment: phenotype, mechanism, genotype, diagnostics, care and references adequate; subtypes not established. Fifteen of nineteen phenotypes connect to the graph; axial hypotonia, failure to thrive, reflux and provisional hearing impairment remain documented without assigning a specific causal chain. No reference cache was manually authored or edited.

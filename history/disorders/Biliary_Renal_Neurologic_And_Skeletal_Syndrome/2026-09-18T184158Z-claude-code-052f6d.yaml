  summary: 'Review round 1: address the critical finding and all eleven important
    findings on PR #12164'
  details: |
    Single bundled round for the ai4c-reviewer CHANGES_REQUESTED review on PR #12164.

    The CRITICAL finding was a factual error of mine. genetic.notes asserted TTC26 'is not one of the IFT-B core subunits'. PMID:26980730, committed by this PR and uncited, identifies TTC26/IFT56 as an integral component of the IFT-B core subcomplex, and PMID:28264835 agrees indirectly by showing core IFT-B proteins fail to accumulate without it. I had over-read the word 'atypical' in the index report. Checked both sources directly before accepting. The correction keeps the substance the wrong claim was reaching for: what 'atypical' actually denotes is cargo selectivity, since dyf13 mutant flagella assemble IFT particles at normal speed while a specific subset of motility proteins is depleted (PMID:24596149). That reading is better than the one it replaces, because it explains why the disease has both a Hedgehog arm and a motile-cilia arm.

    Finding 8 was the other genuine curation error: I presented the Gli-accumulation question as settled on the strength of PMID:25340710, when PMID:28264835 reports the opposite on the same Ift56hop allele. Now carried as a SUPPORT/REFUTE pair on the node plus a KNOWLEDGE_GAP that states why the disagreement does not destabilise the downstream nodes.

    Also addressed: the motile-cilia mechanism branch conforming to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction, which gives the neurologic phenotypes an upstream mechanism; six new phenotypes (hydrocephalus, aqueductal stenosis, congenital heart defect, diabetes insipidus, optic atrophy, global developmental delay), all wired into the pathograph; a treatments section (ursodiol cited REFUTE for its documented failure, desmopressin, VP shunt, serial knee casting); a diagnosis section; mappings; BRENS as the synonym in place of the unsourced BRNS; cholestasis raised to VERY_FREQUENT, since roughly 91% is that band and the reviewer is right that VERY_FREQUENT already means not universal; and a GO term on the biliary node.

    I fabricated two more reference_title strings in this round and the validator caught them, which is the third such instance in this curation session. I have stopped writing titles by hand: a small script now rewrites every reference_title line from the cache frontmatter before validation, and it is what produced the titles in this commit.

    One snippet in the first draft of this round quoted a paper's title rather than a finding, which check-title-snippets would also have flagged; replaced with a result sentence from the body.

    Validation after the round: just validate passes with 43/43 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values all pass.

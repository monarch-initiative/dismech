  summary: Backfill transmission (#10115, R25)
  details: |
    Added two transmission records; the existing infectious_agent block (Madurella mycetomatis) was left untouched. Routes: traumatic percutaneous inoculation through broken skin (PMID:35887499, PMID:25726758, PMID:34267575 - thorn pricks, wood splinters and accidental cuts, with the trauma usually trivial and often not remembered given the months-to-years incubation); and the environmental soil-and-water reservoir with occupational and barefoot exposure (PMID:35887499, PMID:38728359 - the 420-case series linking farming and barefoot activity to the exposure). Both routes are written for mycetoma as a whole rather than per subtype, which is what the cited reviews state for the fungal and bacterial agents together. All references already cited, no new caches. just validate clean (57 titles). No other section touched.

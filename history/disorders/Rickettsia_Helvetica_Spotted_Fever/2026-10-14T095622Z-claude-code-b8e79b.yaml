  summary: Bind LOINC group-level SFG serology code to the paired-IFA diagnosis row
  details: |
    Added diagnosis[].measurements binding LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Paired-serum indirect immunofluorescence antibody assay row. The row's own description already states that serology cross-reacts within the spotted fever group and that species-level R. helvetica assignment needs a different method, so the group-level code matches the row's stated scope exactly; no entry-level caveat sentence was needed beyond what was already there. No new cache/loinc/terms.csv row was required -- 22474-1 was already cached from earlier LOINC tranche-B batches (Flea_Borne_Spotted_Fever, Far_Eastern_Spotted_Fever, Siberian_Tick_Typhus). This supersedes an earlier batch's rejection of this entry, which had assumed a species-specific R. helvetica code was needed; re-reading the row's own text showed the group-level code is the correct fit.

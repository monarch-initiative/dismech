  summary: 'Create: Neurodevelopmental Disorder with Hypotonia and Speech Delay (EIF4A2/NEDHSS)'
  details: |
    De-novo curation of NEDHSS (MONDO:0957541, OMIM:620455, EIF4A2/hgnc:3284) resolving issue #8539.

    NEC preflight: runoak on MONDO:0957541 confirmed xref OMIM:620455 and RO:0004003 to HGNC:3284 (EIF4A2). The paralogues EIF4A1 (90% identity, no Mendelian disease) and EIF4A3 (exon junction complex, Richieri-Costa-Pereira syndrome) were explicitly excluded as identity confusions and are curated as a differential diagnosis.

    Deep research: falcon (Edison), 27.6 min. `just preflight-dr` PASSED (EIF4A2 = 54 mentions, top gene; report OMIM 620455 matched the MONDO xref). The report contributed one usable lead, PMID:39149612 (Lederbauer 2024 DEAD/DExH-box helicase NDD review); it missed the 2026 case series, the EIF4A2 dystonia paper and the whole eIF4A2-Ccr4-Not mechanism literature, all of which were found by direct PubMed search. Two of its ontology suggestions (HP:0002463 for speech delay, UBERON:0002596 for cerebral cortex) were wrong on OAK verification and were rejected; this is recorded in the entry notes.

    GeneReviews: no chapter exists. PubMed `EIF4A2 GeneReviews[All Fields]` (2026-08-15) returns only PMID:20301334 (Monogenic Isolated Dystonia Overview), whose abstract does not mention EIF4A2; not used as a phenotype baseline.

    Content: nine pathophysiology nodes forming a connected chain from the EIF4A2 variant through the two opposing arms of eIF4A2 biology (eIF4F cap-dependent initiation and 43S scanning; Ccr4-Not-mediated miRNA repression) to a deregulated neurodevelopmental translation program, structural brain anomalies, epileptogenesis, bi-allelic neurodegeneration, and an organism-level convergence node from which every phenotype is reachable. Every node carries a single biological_scale. Nine phenotypes, three inheritance blocks (AD de novo, AR bi-allelic, somatic mosaicism), one causative gene, one variant, one animal model and two experimental models - all three models wired into the pathograph with modeled_mechanisms plus explicit limitations. Three diagnosis entries, four differentials, four treatments, five discussions (two KNOWLEDGE_GAP, one HUMAN_MODEL_MISMATCH, one EMERGING_HYPOTHESIS, one cohort-size gap) with proposed experiments.

    Evidence discipline: 89/89 snippets verified as exact substrings of cached references. evidence_source reflects the cited study type - Drosophila work is MODEL_ORGANISM, fibroblast/ESC/biochemistry is IN_VITRO, molecular modelling and the brain-transcriptome reanalysis are COMPUTATIONAL, and review-level background sentences about other authors' patients are OTHER.

    Known gap: PMID:36528028 (Am J Hum Genet 2023) is not open access; PMC9892767 and the OpenAlex green-OA record expose only the abstract, so no Table 1 per-feature counts were quotable. Frequency bands are derived only from the cohort-level 15/15 presenting-features sentence. Speech delay is curated with PARTIAL support and no frequency band; inability to walk and tube feeding (listed in OMIM/MedGen) are deliberately NOT curated rather than sourced to an unquotable claim. This is recorded as an open discussion in the entry.

    Validation: `just validate`, `just validate-references` (89/89) and `just validate-terms` all pass. Compliance 84.5%.

    MAXO note: TreatmentActionTerm is reachable only from NCIT:C25218 on current main, so all treatment_term values use NCIT equivalents rather than the MAXO terms documented in CLAUDE.md.

  summary: 'Address PR #8726 review: drop over-derived frequency bands and the out-of-scope
    PATHOGENIC variant'
  details: |
    Addressed the automated review on PR #8726 (REQUEST_CHANGES, two IMPORTANT findings plus four optional suggestions). Both IMPORTANT findings were assessed as correct and implemented in full.

    1. Over-derived frequency bands (IMPORTANT). Removed `frequency: VERY_FREQUENT` from all five phenotypes that carried it (global developmental delay, intellectual disability, hypotonia, seizure, abnormal brain morphology) and rewrote each `explanation` to claim only what the quote supports. The reviewer is right that the source sentence's "all of whom" clause attaches to the EIF4A2 variants, not to the phenotype list, so it is a cohort-level composite descriptor and licenses no per-feature 15/15 numerator. For Seizure the band was self-contradictory: the same explanation cited the MONDO/OMIM qualifier "with or without seizures" as evidence that seizures are not obligate. No phenotype in the entry now carries a frequency band, which makes the whole phenotype section consistent with the discipline already applied to speech delay, infantile spasms, neurodegeneration and cochlear nerve aplasia.

    2. Out-of-scope PATHOGENIC variant (IMPORTANT). Removed the entire `variants:` block (EIF4A2 c.896_897del). Curating it under MONDO:0957541 with `clinical_significance: PATHOGENIC` asserted pathogenicity FOR NEDHSS to KGX and graph consumers, which never see the prose disclaimer, while the entry's own description, scope-boundary note and differential_diagnoses all assign the allele to the allelic dystonia-tremor syndrome. Nothing is lost: the haploinsufficiency evidence remains, correctly scoped as a molecular claim about the gene, on the `Reduced eIF4A2 Protein Dosage` pathophysiology node.

    Optional items, all four taken:

    3. Removed `therapeutic_modality: SMALL_MOLECULE` from the antiseizure/hormonal treatment. The only documented component is hormonal therapy; ACTH is a peptide while prednisolone and vigabatrin are small molecules, and no agent is named, so the tag was an unsupported platform assertion. Replaced with a `notes` line stating why the slot is omitted.

    4. Added a `notes` line on the `genetic` block recording that `variant_origin` is single-valued and set to the predominant mode (DE_NOVO), and that the authoritative statement of all three modes is the three `inheritance` blocks.

    5. Removed all stale MAXO justification prose - two per-treatment notes and the entry-level "Treatment-term ontology" paragraph. Current main CLAUDE.md states MAXO was removed from dismech and every former MAXO term remapped to NCIT, so the NCIT bindings are simply the documented default and need no justification. The entry now contains no reference to MAXO.

    6. Split assessment from management. The treatment is renamed "Hearing Habilitation" and now covers only habilitation; the internal-auditory-canal imaging recommendation moved into the existing `Neuroimaging and EEG` diagnosis entry, with the cochlear-nerve evidence item carried over.

    Validation after the changes: `just validate` (schema + terms + references), `just validate-references` (89/89 snippets verified; count fell from 90 to 89 because the removed variants block carried a duplicate snippet) and `just validate-terms` all pass. Programmatic re-checks confirm no phenotype carries a frequency band, no `variants` section exists, every `modeled_mechanisms` target and `attaches_to`/`would_support`/`would_refute` reference still resolves to a pathophysiology node, and no PMID+snippet pair is tagged with conflicting `evidence_source`. Rebased onto origin/main at 38893ad728.

  summary: Conform ischemic bone necrosis nodes to ischemic_bone_necrosis_and_repair
  details: |
    Added conforms_to links to the ischemic_bone_necrosis_and_repair module on five nodes:
    Femoral Head Ischemia -> Bone Vascular Supply Interruption; Osteocyte Death -> Ischemic
    Osteocyte and Marrow Cell Death; Increased Osteoclast Bone Resorption ->
    Resorption-Dominant Revascularization and Creeping Substitution; Subchondral Fracture
    and Femoral Head Structural Collapse -> Structural Failure of Necrotic Bone under
    Mechanical Load (two entry nodes map to one module node because the entry splits the
    fracture from the collapse). Left unconformed on purpose: the TRPV4 gain-of-function,
    endothelial calcium-overload and microthrombosis nodes upstream of ischemia, which are
    the disorder-specific trigger substitution rather than module nodes. The
    osteoclast-resorption link is through the shared outcome (resorption outpacing
    formation before collapse); the resorption modelled in the entry is a cell-intrinsic
    TRPV4 effect in mice, not revascularization-driven creeping substitution, which the
    node description now says. No node content was changed in this session.

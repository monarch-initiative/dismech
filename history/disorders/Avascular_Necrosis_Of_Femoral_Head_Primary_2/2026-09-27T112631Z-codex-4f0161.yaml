  summary: Review ANFH2 clinical evidence, channel mechanisms and model limitations
  details: 'Reviewed the existing ANFH2 entry against the founding publication, its full supplement, the
    complete matching Claude Code research narrative and citations sidecar, and later TRPV4 literature.
    Eligible Mendelian disorder: only CREATE history existed; infectious/environmental exclusions do not
    apply. Branch rebased onto origin/main before this review. Named-entity preflight could not supply
    a MONDO causal-gene assertion; manual MONDO:0054551/OMIM:617383 and primary-paper TRPV4 identity checked.
    The research report''s HGNC:12716 is TRPV1; the entry correctly uses hgnc:18083.


    Source consumption:

    - PMID:27330106: complete cached main scientific text, methods and figure legends. Its 36-page supplement
    was recovered from Europe PMC supplementaryFiles, read as extracted text and inspected visually for
    image-only Tables S1-S4. Subsequently generated a verifiable NCBI BioC supplementary cache with just
    fetch-reference; no cache text was hand-written. BioC does not capture image-only table contents,
    whose counts were checked on the original PDF. This exposed stages III-VI, modality-specific MRI/radiograph
    differences, only one unaffected sibling genotyped, and incomplete neurologic/physical examination
    coverage. The main paper reports bilateral core decompression at 21 while the supplementary note reports
    right-sided surgery at 28; both accounts are preserved. Individual diagnostic ages 44/46 conflict
    with Table S2 categories, and the main approximate sporadic bilateral proportion differs from the
    table''s 36/49. Do not infer a precise family age distribution or penetrance.

    - Supplementary methods show immortalized patient/control fibroblasts, 30-frame/s optical imaging
    and >100-fold transduced-cell mRNA relative to fibroblasts. Figure S12 used wild-type-transduced HEK293
    cells and control fibroblasts: inhibitor specificity is not mutant rescue. Its methods name HC067047
    while main text/figure captions name GSK219; no clinical antagonist claim is made. Mutant cDNA persistence
    was measured; qPCR did not distinguish alleles, and endogenous fibroblast protein was not detected.

    - PMID:22492541: complete abstract in generated cache and full scientific text, methods, results,
    figures, Table 1 and discussion read on Wiley. R616Q/V620I osteoclast-lineage transgenic mice establish
    positive gain-of-function resorption evidence; deleting the calmodulin-binding region abrogates bone
    loss. Neither construct is the ANFH2 allele. MYH9/MLCK mechanistic experiments inform that separate
    osteoclast model, not a proven patient pathway; not promoted to ANFH2-specific nodes. PMID:18762026
    full cached abstract consumed after refresh; full text remained unavailable. Its global-null mice
    are explicitly opposite-direction evidence.

    - PMID:25572823 complete abstract consumed; PMC, Europe PMC and BioC full-text recovery attempts failed
    or returned error pages. Mouse aortic contraction and HUVEC thromboxane observations support an indirect
    vascular hypothesis. No patient-vessel measurement is inferred.

    - PMID:30693671 complete cached full scientific text, methods, figures and Table 1 consumed. The p.K801E
    family has a mixed skeletal dysplasia; computational structural modeling does not establish a functional
    direction. Table 1 restates the founding ANFH2 family. PMID:33075594 complete available abstract consumed:
    p.Trp785Cys co-segregates with a mixed congenital motor-neuron, skeletal and skin phenotype; it is
    not isolated ANFH2 replication. No per-person femoral-head necrosis count or functional assay is inferred.
    PMID:30328481 complete refreshed abstract consumed; this is the original group''s review, not independent
    replication.

    - GeneReviews PMID:24830047 abstract and relevant diagnosis, management, surveillance and genetic-counseling
    portions of generated full NBK201366 HTML read; the chapter contains neither avascular necrosis nor
    osteonecrosis. All four abstract sections are represented through explicitly scoped background evidence.
    General symptomatic care and Mendelian counseling are applicable principles; respiratory, spinal and
    neurologic surveillance for other TRPV4 disorders is not imported into isolated ANFH2.

    - ClinicalTrials.gov API queries TRPV4 (12 records, no next page) and exact ANFH2 (zero) found no
    ANFH2-specific intervention. NCT05600764 describes a neuropathy-focused observational cohort with
    broad investigator-determined TRPV4 eligibility; no explicit ANFH2 cohort or intervention is specified.
    Its description and eligibility were read directly from the API. A broader avascular-necrosis/primary
    query had additional pages and is not claimed as an exhaustive trial census.


    Content-completeness assessment:

    1. Phenotypes: adequate for isolated ANFH2. Bilateral osteonecrosis, hip pain, secondary hip osteoarthritis
    and antalgic gait are represented. Collapse, sclerosis and cystic changes are described with direct
    supplementary support. Scoliosis/short metacarpals/median neuropathy considered incidental by the
    investigators are retained as caveats rather than asserted disease phenotypes. No frequency is inferred
    from the selected family.

    2. Subtypes: N/A; no established subdivisions within isolated ANFH2. Later mixed TRPV4 families belong
    in differential/spectrum context.

    3. Pathophysiology: separated truncation, prolonged channel activity, calcium influx, endothelial
    calcium overload, vasoconstriction, microthrombosis, ischemia, osteocyte death, resorption, subchondral
    fracture and collapse. Vascular/resorption alternatives remain emerging hypotheses with indirect links
    and properly scoped model evidence; no disease-site histopathology was available. Three animal models
    and two cellular systems now link to the relevant mechanisms.

    4. Treatments/trials: documented operations, broad supportive pain care and genetic counseling included.
    The procedure discrepancy is explicit. Research-report bisphosphonate/statin/anticoagulant/hyperbaric-oxygen
    discussions concern general ONFH and do not establish an ANFH2 treatment regimen. Control-cell antagonist
    inhibition is not therapeutic rescue. No ANFH2-specific intervention found in the targeted registry
    queries.

    5. Genetics: structured complex founding allele, last-exon transcript persistence, segregation and
    functional direction included without inventing ACMG status, transmitting parent, full penetrance
    or a measured calmodulin-feedback defect. Other collagen candidates did not segregate.

    6. Diagnostics/biomarkers: imaging stages separated by modality, molecular confirmation, negative
    thrombophilia panel interpreted narrowly. No blood biomarker was established. Panel contents are not
    negative patient values or proof of microthrombosis.

    7. References: central cached primary findings and recovered supplement incorporated; later mixed
    families and 2012 gain-of-function evidence repair substantial source under-consumption. No dataset
    accession identified in these publications; no dataset reanalysis performed.

    8. Overall: covers all central disease-specific findings while explicitly separating broader TRPV4
    biology and general ONFH care. False ancestry, penetrance, patch-clamp and calmodulin-certainty claims
    in the research report were not propagated.



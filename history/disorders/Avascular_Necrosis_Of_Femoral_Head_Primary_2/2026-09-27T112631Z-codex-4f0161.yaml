    Both scoped data/entity tests passed. Entity, causal-target, coarse-phenotype, source-defect, snippet-boundary
    and GeneReviews checks passed; all 101 node classes and 2186 examples resolved. Repository-wide snippet/title
    ratchets are also checked before commit. Independent approval and green CI remain required before
    this campaign item is complete.'

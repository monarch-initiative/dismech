  summary: 'Create: Avascular Necrosis of Femoral Head, Primary, 2'
  details: |
    De novo curation of ANFH2 (MONDO:0054551), an autosomal dominant, TRPV4-associated form of inherited osteonecrosis of the femoral head. Claimed via issue #10880. Deep research: attempted falcon (Edison) first per skill default, but Edison's API host (api.platform.edisonscientific.com) is blocked by this environment's outbound network policy (proxy returns 403 on CONNECT), not a bad key -- confirmed via /__agentproxy/status. The --fallback flag did not recover because the auth failure crashes before the client's internal retry/fallback chain engages. Switched explicitly to the claude_code provider (no external API key required; report at research/Avascular_Necrosis_Of_Femoral_Head_Primary_2-deep-research-claude_code.md), which completed with needs_review: true on both reference and term validation -- its term suggestions included several mislabelled CURIEs (e.g. HP:0010734 is actually 'Fibrous dysplasia of the bones', not femoral head osteonecrosis; HP:0100787 is 'Prostate neoplasm', not gait disturbance; the HGNC:12716 it and my own initial skeleton used for TRPV4 is actually TRPV1). None of these mislabelled report-suggested CURIEs were used; every ontology term in the entry (hgnc:18083 TRPV4, HP:0005743, HP:0030838, GO:0005262, GO:0070588, GO:0042310, CL:0000092, CL:0000115, GO:0030316) was independently verified via runoak against the live OAK adapters before binding. Core evidence is built from two primary PubMed sources found directly (not via the deep-research report): PMID:27330106 (Mah et al. 2016, J Med Genet, the discovery paper; full text was available via PMC and used for exact-quote snippets) establishing the causal TRPV4 c.2480_2483delCCCG+c.2486T>A gain-of-function frameshift/truncation variant and its calcium-sparklet electrophysiology, and PMID:30328481 (Wang et al. 2019 review) for genetic-basis context. Added a second pathophysiology branch (osteoclast calcium signaling / bone resorption) supported by PMID:18762026 (Masuyama et al. 2008, Cell Metab), graded directness: INDIRECT since it is opposite-direction (Trpv4-knockout) mouse evidence rather than direct GOF-variant data. Two mechanistic_hypotheses groups record the vascular-vasoconstriction and osteoclast-resorption branches as EMERGING, both explicitly hedged per the discovery paper's own limitations paragraph, which is also cited directly in a HUMAN_MODEL_MISMATCH discussion noting no animal or cellular model directly recapitulates the ANFH2 gain-of-function phenotype. No GeneReviews article exists for this disease (searched PubMed TI:GeneReviews, no hit) so no GeneReviews baseline was applicable. Validated: linkml-validate (Disease, no issues), linkml-term-validator (validate-data --labels, passed), reference_snippet_audit (20/20 snippets verified), full linkml-reference-validator (all checks pass), check-duplicate-keys / check-enum-values / check-entity-refs / check-causal-targets / check-qualifier-terms (all OK), whole-KB check-not4curation / check-folded-hyphens / check-snippet-length / check-title-snippets / check-snippet-grading (all OK, no new issues), term_cache_integrity (OK), and tests/test_data.py -k Avascular (2768 selected tests passed, no failures). linkml-data-qc weighted compliance 87.0%. Deleted stubs/Avascular_Necrosis_Of_Femoral_Head_Primary_2.yaml as part of this curation.

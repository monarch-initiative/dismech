  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing molecular-testing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound: congenital severe-to-profound loss is the consistently reported severity across the founding and replication series, but it spans the WHO/GBD Severe/Profound boundary, and a minority of individuals additionally have a progressive component worsening to that same degree, so no single static grade would represent the range.

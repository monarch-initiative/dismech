  summary: 'Create: Hearing Loss Autosomal Recessive 120 (DFNB120, MINAR2)'
  details: |
    De novo curation of DFNB120 (MONDO:0859374, MINAR2 hgnc:33914) from the stub queue. entry_type decided as DISEASE: one causal gene, no MONDO descendants, one pathograph from biallelic MINAR2 loss to impaired hair cell mechanotransduction. Nothing in kb/ previously mentioned MINAR2.

    The evidence base is genuinely thin, so the entry is built to show where its own claims come from. Two mechanisms have been proposed in two different species and no experiment joins them: the mouse null gives a mammalian structural lesion (shortest row of outer hair cell stereocilia depleted, ribbon synapses and organ of Corti normal at the age thresholds are already raised), and the zebrafish mutant gives the molecular function (Minar2 on apical lysosomes delivering cholesterol to the hair bundle membrane, with bidirectional pharmacological rescue). They are curated as separate nodes with a KNOWLEDGE_GAP discussion recording that the two structural phenotypes point in opposite directions - fish bundles longer and thinner, mouse stereocilia shorter and fewer - so the tempting synthesis is not yet earned.

    The NOTCH2/mTORC1 arm is curated as a pathophysiology node that is deliberately drawn with no edge into the hearing phenotypes, because no experiment connects it to any cochlear phenotype in any species and the founding authors put it no more strongly than that Notch signalling might play a role. A HUMAN_MODEL_MISMATCH discussion carries the corresponding translational problem: Minar2 knockout mice are obese, glucose intolerant and parkinsonian, while affected humans examined between 4 and 80 years of age had isolated deafness and normal bedside balance testing. The discussion states both readings - a real species difference, or ascertainment through an audiology clinic - and proposes recall phenotyping against heterozygous relatives.

    Evidence: 5 references cited, all fetched with just fetch-reference; 59/59 snippets verified against the local cache. Two readouts are recorded as UNCHANGED because they are real negative results (ribbon synapse counts in the mouse). No treatment other than genetic counselling is curated: cochlear implantation is standard for congenital severe-to-profound loss but no DFNB120-specific report documents it, and the treatment notes say so explicitly rather than importing general practice.

    Deep research: falcon report run and preflighted against MONDO:0859374, verdict PASS (MINAR2=30 mentions, next gene at 4; OMIM 620238 matched on both sides). Entry curated from primary sources regardless.


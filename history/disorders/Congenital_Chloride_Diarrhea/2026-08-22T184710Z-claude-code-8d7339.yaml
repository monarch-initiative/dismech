  summary: 'Create: Congenital Chloride Diarrhea'
  details: |
    New entry; the prototype of the electrolyte-transport-related CODE class, and the sibling class boundary case for the diet_induced_osmotic_diarrhea module created in the same PR.

    MONDO:0008964, causal gene SLC26A3 confirmed against MONDO before curation.

    Four-node chain that branches at the trigger: loss of apical DRA chloride/bicarbonate exchange (trigger) -> luminal chloride retention and failure of intestinal fluid absorption (central_effector) and, in parallel, systemic electrolyte depletion and metabolic alkalosis (effector) -> chloride-rich watery diarrhea and its consequences. The parallel systemic arm is what lets the two treatments be modelled distinctly: oral salt substitution INHIBITS the systemic node only (life-saving, normalises electrolytes, no effect on stool volume), while oral sodium butyrate ACTIVATES the trigger node (partially rescuing DRA expression and trafficking) and INHIBITS the clinical output.

    Nosology care: the MONDO label says secretory chloride diarrhoea, but the cited CODE review states the secretory label is imprecise here because the lesion is loss of chloride ABSORPTION. The MONDO label is retained verbatim as disease_term while the entry text describes absorptive failure, and the notes record the discrepancy explicitly rather than silently reconciling it.

    Also records the acid-base contrast with congenital sodium diarrhea (alkalosis vs acidosis) as the bedside discriminator, and flags a shared electrolyte-transport module as a reasonable future factoring once congenital sodium diarrhea is curated.

    Added a clinical_trials entry keyed on ICTRP:ACTRN12613000450718 (ANZCTR), the butyrate trial reported in PMID:24350656, which has no ClinicalTrials.gov identifier.

    Evidence honesty: the polyhydramnios phenotype carries a note that no snippet-verified reference is cited for it yet and asserts no frequency band.

    Validation: linkml-validate clean; linkml-term-validator clean; 23/23 snippets verified against cached abstracts.

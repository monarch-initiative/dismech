  details: |
    Replaced all four MAXO terms with NCIT equivalents per project ontology decision to stop using MAXO: diagnosis genetic testing (MAXO:0000127 -> NCIT:C15709 Genetic Testing, x2); treatment supportive care (MAXO:0000950 -> NCIT:C15747 Supportive Care); treatment clinical assessment (MAXO:0000487 -> NCIT:C124351 Clinical Evaluation, a reachable treatment-root term for multi-system routine surveillance). Added conforms_to on the 'Abnormal mitochondrial energy metabolism' pathophysiology node to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress (secondary nuclear-encoded carrier lesion converging on the conserved OXPHOS-decline effector; node already carried GO:0006119 oxidative phosphorylation DECREASED). Added a Craniofacial surgical management treatment (NCIT:C15329 Surgical Procedure, therapeutic_modality SURGERY) evidenced by, and worded faithfully to, the GeneReviews craniofacial-clinic quote (PMID:35679445; abstract names surgical specialties, not a specific procedure). Added an Aortic dilatation phenotype bound to HP:0004942 Aortic aneurysm (the current term into which the obsolete HP:0001724 'Aortic dilatation' was merged), preferred_term retaining the source wording, no frequency, from the GeneReviews activity-restriction sentence; also linked as a downstream target of the connective-tissue node. Recorded the activity-restriction guidance in notes. Removed deprecated updated_date and two deprecated prevalence percentage fields.

    Post-review (PR #7266, ai4c-reviewer): swapped the surveillance term C20989->C124351 and the craniofacial term C51791->C15329 per reviewer; reversed the earlier decision to omit aortic dilatation after the reviewer identified HP:0004942 as the obsoletion replacement; moved conformance meta-text out of the node description. Validation: just validate (schema+terms), validate-references, validate-graphs (Fontaine clean) all pass.

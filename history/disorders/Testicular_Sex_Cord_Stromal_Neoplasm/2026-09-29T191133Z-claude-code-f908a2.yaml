  summary: Wire CTNNB1, GNAS, PRKAR1A, STK11 and FOXL2 into the pathograph (#13152)
  details: |
    Addressed issue 13152. All five causal genes are now wired (0/5 to 5/5), each onto a node carrying a molecular function term read from the GO cache and confirmed against OLS in the same step. CTNNB1 went onto Wnt/Beta-Catenin Pathway Activation with transcription coactivator activity (GO:0003713, GAIN_OF_FUNCTION). GNAS and PRKAR1A went onto cAMP/PKA Pathway Activation with cAMP-dependent protein kinase activity (GO:0004691, INCREASED), the one activity both lesions converge on. That node also gained a GNAS evidence item and a Sertoli cell type. STK11 went onto a new node, LKB1 Loss in Sertoli Cells (GO:0004674, LOSS_OF_FUNCTION; PMID:24037887), with an edge to a new Sertoli Cell Aromatase Overexpression node (GO:0070330; PMID:16944977), which feeds Estrogen-Mediated Clinical Manifestations and Precocious Puberty with Sertoli Cell Tumor. No PRKAR1A-to-aromatase edge was drawn because the only source states it as a hypothesis. FOXL2 went onto a new node, FOXL2 C134W Neomorphic Transcription Factor Activity (GO:0003700, GAIN_OF_FUNCTION; PMID:32641411, PMID:36409821, PMID:37565864). The node notes record why it is not on the TGFBR1 transdifferentiation node. relationship_type and variant_origin were added to all five genetic records: SOMATIC_DRIVER for CTNNB1, GNAS and FOXL2, RISK_FACTOR for PRKAR1A and STK11. has_subtypes now list their genes. The estrogen node gained four evidence items from Leydig cell tumour case reports (PMID:9235082, PMID:16671273, PMID:29166332) and an edge to Gynecomastia (PMID:12628123). Neoplastic Transformation now links to Testicular Mass, so 3/6 phenotypes are connected, up from 0/6. No new deep research was run: the existing falcon report (research/Testicular Sex Cord Stromal Tumor-deep-research-falcon.md) was consulted and was thin on STK11 and FOXL2 mechanism, so those references came from PubMed searches. Validated with just validate, validate-terms, count-verified-snippets (36/36), check-entity-refs, check-causal-targets, check_gene_activity_grounding --against-ref origin/main, and the offline qc gates.

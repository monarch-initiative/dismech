  summary: Record why no estrogen receptor gene is bound on the estrogen-mediated
    manifestations node
  details: |
    Fifth tranche of the estrogen-signalling pathograph work in issue #12925.
    The issue lists the Estrogen-Mediated Clinical Manifestations node among
    fourteen that bind GO:0030520 while naming no gene, and suggests it may be
    ligand excess acting on a normal receptor. It is, and no receptor gene is
    bound; the node carries a recorded reason instead.

    Why this differs from the endometrial nodes in the fourth tranche, which
    are also ligand excess on a normal receptor and did take ESR1. Those nodes
    name one cell type, conform to a receptor-hyperactivation module, and have
    a source naming the receptor with the tissue and the proliferative readout
    together. This node names no cell type and bundles two remote target
    tissues, the breast (gynecomastia) and the hypothalamic-pituitary axis
    (gonadotropin suppression and reduced fertility), and the only tissue-level
    receptor data found for either arm points away from a single gene: in
    pubertal gynecomastia tissue the beta receptor is expressed above the alpha
    in stromal cells and both are barely detectable in epithelial cells
    (PMID:21597315). A single receptor gene here would assert more than the
    node localizes.

    Searches run, all on PubMed, recorded in the node's notes with what each
    returned: Leydig cell tumor with gynecomastia and estrogen receptor, no
    records; sex cord-stromal with testis and estrogen receptor, one
    (PMID:21974818, GPER expression in tumor and normal testis, stating that
    testicular estrogen signaling runs through beta isoforms, which measures
    the tumor rather than the target tissues); Sertoli cell tumor with estrogen
    receptor, five, of which the one human testis report (PMID:16944977) is
    about aromatase and receptor expression within a large-cell calcifying
    Sertoli cell tumor as a tumor-development mechanism; gynecomastia in the
    title with estrogen receptor alpha or ESR1, two, of which PMID:21597315 is
    the tissue study above and PMID:40881656 is an organoid protocol; Leydig
    cell tumor with gynecomastia and estradiol, eight case reports of
    estradiol-producing tumors screened by title, none naming a receptor in
    its title. None of the sources cited in the entry names a receptor, which
    was checked by searching every cached reference the entry cites. None of
    these PubMed records was fetched into the cache, because none is quoted.

    No deep-research report exists for this disease. The only Sertoli-Leydig
    report in research/ is for the ovarian tumor, a different entry, and was
    not used.

    Two things observed and not changed here, because neither is this issue's
    scope. No pathophysiology node in this entry carries a genes: descriptor,
    so the entry's five causal genes in genetic: reach no mechanism node; that
    is the shape issue #13130 records for two other entries. And this node
    carries no evidence items of its own, so its gynecomastia and
    gonadotropin-suppression claim rests on the upstream edge and the
    phenotype records rather than on a citation on the node.

    No cache file changed. Checks: validate, validate-terms and
    count-verified-snippets passed on the file; validate-disorders over the
    whole tranche passed; the offline gates listed in the Heart_Failure record
    for this tranche passed with no new findings.

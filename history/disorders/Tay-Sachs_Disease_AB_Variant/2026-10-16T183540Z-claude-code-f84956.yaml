  summary: Bind the GM2 activator functional assay, not HexA/B (tranche D batch 4)
  details: |
    LOINC tranche D batch 4 (enzyme activity and metabolite assays; activator/cofactor deficiencies, the hardest batch in the tranche). This entry's own diagnosis row already states that hexosaminidase A and B activity is characteristically NORMAL in this disease (GM2 activator protein deficiency, GM2A), and that a normal-enzyme-with-GM2-phenotype picture is what prompts GM2A testing -- binding either the classic-Tay-Sachs Part code (LOINC:LP14296-5) or the Sandhoff plain-total code (LOINC:LP14022-5) would have asserted a deficiency this disease does not have. Searched the Monarch KG for 'GM2 activator' and found a genuine functional-assay code for the activator protein itself: LOINC:LP20857-6 (Beta-N-acetylhexosaminidase.A activator), the specimen-generic Part code, with a specimen-specific interpretation code (LOINC:25832-7, in Fibroblast) also available if needed later. Bound LOINC:LP20857-6 via measurements on the existing 'Hexosaminidase enzyme assay with GM2A sequencing' diagnosis row. No reference_ranges band: the finding is binary (activator present/functional vs. absent), not a graded cut-off. Neither code requires a third-party copyright notice. No collision with LOINC:LP20857-6 on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, and tests/test_loinc_measurement_schema.py all pass.

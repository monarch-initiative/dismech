  details: |
    Review on PR #14561 correctly identified that the activator Part code (LOINC:LP20857-6) was the wrong binding, and traced the error to the batch's own dispatch: a LOINC code identifies the measurement performed, not the result it returns. Binding LP14296-5 (Beta-N-acetylhexosaminidase.A) does not assert hexosaminidase A is deficient; it says the test performed was a hexosaminidase A measurement, which is exactly what this row's own diagnosis description and markers field describe -- the finding being that the result comes back normal. Replaced the measurements block with LOINC:LP14296-5, the same Part code used for hexosaminidase A activity on classic Tay-Sachs_Disease.yaml (seeded fresh on this branch since that sibling binding is carried on PR #14481, not yet merged to main). Checked whether a biochemical GM2 activator functional assay is actually described anywhere in this entry's evidence before deciding to drop the activator code entirely rather than keep it as a second measurement: the only mention is the evidence snippet 'normal enzyme activity...need to be investigated for GM2 activator protein,' which this entry's own second diagnosis row resolves via GM2A sequencing (a genetic test), not a separate biochemical activator assay. No source describes an activator functional assay being run, so the activator Part code and its orphan cache row were dropped rather than kept as a speculative second measurement. Rewrote notes to state only facts about the disease and its tests, with no reference to review rounds, PR numbers in prose, or branch state. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

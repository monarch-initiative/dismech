  summary: Review and enrich Tay-Sachs_Disease_AB_Variant
  details: |
    Tagged and mined GeneReviews chapter PMID:36007105, added MONDO synonym hexosaminidase activator deficiency, added classifications (Harrison's ENDOCRINOLOGY_METABOLISM/NEUROLOGIC, sphingolipidosis, ICIMD sphingolipid_degradation), added acute infantile and juvenile/late-onset progression phases, expanded pathophysiology to 4 atomic multi-scale nodes causally wired to 11 phenotypes (adding Seizure, Ataxia with childhood onset, Muscle weakness, Dysphagia, and Decerebrate rigidity), added sibling recurrence risk to inheritance, separated Hexosaminidase A and B enzyme assay from GM2A sequencing and added plasma ganglioside LC-MS/MS in diagnosis, quoted GeneReviews surveillance and agents-to-avoid in supportive care, added preclinical intrathecal scAAV9.hGM2A gene therapy (PMID:37298170), and added Gm2a-/- and Gm2a-/-Neu3-/- animal models (PMID:38098938).

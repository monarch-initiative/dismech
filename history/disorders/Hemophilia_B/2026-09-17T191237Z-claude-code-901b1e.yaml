  summary: Re-apply outstanding OpenScientist findings
  details: |
    Batch-2 re-application of the earlier OpenScientist sweep onto current main. One citation from that sweep was still absent: PMID:19686262 (FVII 353Q polymorphism modifying severe haemophilia phenotype). The sweep had attached it to the canonical hypothesis notes as support for a modifier refinement; main has since restructured that material, rewriting the notes to state that modifier associations do not explain a measured 10-15% of HB variance and moving the modifier question into the severity-modifiers KNOWLEDGE_GAP discussion. The paper was therefore re-applied to that discussion, whose rationale named FVII with no citation behind it, quoting the FVII353Q association re-derived from references_cache/PMID_19686262.md (abstract-only record) with the mixed-cohort, multiplicity, and opposite-direction caveats stated in the explanation. Nothing else from the sweep was re-applied: main already carries its own richer equivalents of every node and correction that commit described - Deficient intrinsic tenase activity and Deficient thrombin propagation nodes, the skeletal-pathway and synovitis-translation HUMAN_MODEL_MISMATCH-style discussions, durability-and-retreatment, extravascular-fix, gene-therapy trial evidence, the severity-dependent (not abolished) thrombin wording, and the note that the report overlooked the existing definitive ClinGen curation. The missing openscientist-assessment-by-claude-opus-5 sidecar (yaml plus the .md it declares as its artifact) was copied across verbatim, byte-identical to os-review-fable, alongside main's existing codex assessment. Verified with linkml-validate (no issues), count-verified-snippets (195/195), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and validate-hypothesis-assessment.

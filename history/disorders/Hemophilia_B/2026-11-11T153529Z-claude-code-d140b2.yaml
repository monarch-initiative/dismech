  summary: 'Evidence-claim mismatch review (issue #16985)'
  details: |
    Reviewed the 15 assertions the Jev evaluation (dismech-evals, jev-1.13.0) labelled MISMATCH at the whole-claim level against the current entry and cached references. Six evidence items were repaired. The AAV long-term follow-up item on the canonical mechanistic hypothesis (PMID:40499172) now quotes the conclusion on durable factor IX expression instead of the follow-up duration. The menorrhagia item (PMID:39371765) now quotes the menorrhagia count among 68 pooled HA/HB carriers instead of the carrier breakdown. The FVII-deficiency differential item (PMID:19245420) now quotes the result sentence on differing presenting symptoms instead of the methods sentence. The GeneReviews differential item (PMID:20301668) keeps its snippet but its explanation no longer claims a differential table was reviewed, since only the abstract is cached. The synovitis knowledge-gap item (PMID:42119948) extends the snippet so it is clear the cartilage result is from the delayed-treatment arm. The FLT180a trial item (NCT03369444) now quotes the registry sentence naming the gene-therapy aim instead of a generic disease definition. Nine flagged items were retained because the snippet supports the specific part of the claim it is attached to: the FIX-Padua thrombophilia snippet supports the genetic notes on Padua as a gain-of-function transgene; the GeneReviews low-FIX-activity snippet on the FIX-deficiency readout and on prolonged aPTT supports factor-specific diagnosis; the 1.5-3% inhibitor estimate is the older figure the FIX inhibitor description names; the endothelial-dysfunction snippet supports confounding by viral comorbidity; the concizumab enrolment and inhibitor-cohort snippets support the randomized-subset and inhibitor-option statements; the marstacimab target and cohort-size snippets support the anti-TFPI and 116-participant statements; and the fitusiran low-antithrombin snippet supports the AT-guided regimen. Validated with just validate, count-verified-snippets (197/197), check-snippet-grading, check-snippet-length and validate-disorders.

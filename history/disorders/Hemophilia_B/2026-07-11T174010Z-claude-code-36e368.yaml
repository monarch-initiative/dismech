  summary: Enrich treatments with ISTH and Chinese hemophilia guidelines
  details: |
    Mined 2024 ISTH GRADE clinical practice guideline (PMID:39043543) and 2025 Chinese hemophilia treatment guideline (PMID:41087175) into Hemophilia B. Reinforced Factor IX Replacement and Prophylactic Factor IX Replacement with B-specific ISTH evidence (strong recommendation for prophylaxis over episodic treatment; FIX concentrates for prophylactic/episodic treatment). Added two new treatments: Long-Acting (Extended Half-Life) Factor IX Products (MAXO:0000933) and Gene Therapy (MAXO:0001001), both cited to the Chinese guideline's novel-therapeutic-strategies statement. Excluded PMID:38908829 (companion ISTH implementation paper, no substantive abstract body cached; duplicate scope of PMID:39043543) and PMID:29119666 (PK SSC communication, no abstract body cached). All snippets verified as exact substrings; schema and term validation pass.

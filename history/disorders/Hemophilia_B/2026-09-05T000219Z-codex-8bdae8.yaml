  summary: Review the full Hemophilia B model and assess OpenScientist evidence
  details: |
    Full disease YAML and complete OpenScientist report/citation sidecar reviewed against all cited source records, selected full texts, matching Falcon/Perplexity/Cyberian research, primary clinical and model literature, and all four GeneReviews domains. Expanded the functional FIX to intrinsic-tenase to FXa to thrombin to fibrin pathway and blood-induced joint injury; separated Leyden regulation and inhibitor complications. Reviewed severity subtypes, female disease, clinical phenotypes, evidence denominators, activity versus antigen, genetics, age-specific diagnosis, differentials, management, precautions, pregnancy, surveillance, model validity, and biomarker interpretation. Verified 13 ClinicalTrials.gov records and GEO GSE190760 without reading the frozen dataset cache or performing raw-data analysis. Incorporated valid OpenScientist findings and corrected cohort/timepoint conflation, identical Padua transgenes, missed 13-year human follow-up, extravascular FIX studies and ClinGen assertion, inhibitor statistics, mouse correction denominator, and overclaimed skeletal/inflammatory causality. Created a 35-claim authoritative Codex assessment with exact report anchors, evidence-qualified dispositions, provenance limits and six unexecuted proposed analyses. References generated only through sanctioned retrieval; new terms selected by OLS and derived by validation. Checklist: full content, proximal and distal pathograph coherence, phenotype causal scope, genetics/subtypes, literature directness, treatment/model/biomarker links, trial status, dataset provenance, unresolved knowledge gaps, schema/terms/references/assessment/history, causal and entity targets, duplicates, titles, source grading and relevant offline gates; scoped diff reviewed before PR.

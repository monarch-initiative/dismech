  summary: Ground gene in a molecular function for the gene-activity gate
  details: |
    The gene-activity grounding gate added to main after this PR was approved flagged YIPF5, whose landing node binds no molecular function. No YIPF5 activity is established: QuickGO lists only five GO:0005515 protein binding (IPI) molecular-function annotations for UniProtKB:Q969M3, and the cited work shows SURF4 binding rather than an activity. Following the gate's own guidance that no term beats a bad one, no term was bound; a notes field on 'YIPF5 Loss of Function' records the search, and YIPF5 was added to tests/gene_activity_grounding_baseline.txt.

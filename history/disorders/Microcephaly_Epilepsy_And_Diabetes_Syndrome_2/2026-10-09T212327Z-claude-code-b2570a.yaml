  details: |
    New MEDS2 (YIPF5, MONDO:0025690) entry. Deep-research source: research/Microcephaly_Epilepsy_And_Diabetes_Syndrome_2-deep-research-perplexity.md (21/21 references resolved, 7 scored on topic, no off-topic list; 31 terms, 0 unresolved). just preflight-dr exited 2 because no local mondo.db; Named Entity Confusion was checked by hand: the report consistently describes YIPF5 and distinguishes MEDS1 (IER3IP1) and TMEM167A. Evidence comes from the 2020 discovery paper (PMID:33164986, full text cached), the 2024 transient-hyperglycemia case (PMID:38632213), the p.W218R rabbit (PMID:37142085), the 2026 SURF4/ER-export study (PMID:41717013), the JCI commentary (PMID:33164987, used only for the untested pioglitazone hypothesis), and differential-diagnosis sources PMID:24138066, PMID:39441964 (IER3IP1) and PMID:40924476 (TMEM167A). Report references not used: PMID:37689631 (ketogenic diet case is IER3IP1/MEDS1, not YIPF5), PMID:39115595 (IER3IP1 neuronal trafficking, superseded by 39441964 for the differential), PMID:33967960 and PMID:37152949 (general beta-cell ER stress/ER export reviews, not MEDS2-specific), PMID:39344692 (NDM update review; primary paper preferred); non-PubMed web sources (MalaCards, PanelApp, MedGen, Orphanet pages) were not cited. Orphanet ORPHA:306558 is a broader MEDS entry (MONDO xrefs it to MEDS1 only) so its prevalence is not used. Mortality is recorded under progression because death-age HPO terms are outside the PhenotypeTerm enum. No ClinGen record for YIPF5, so gene_disease_validity absent. No GeneReviews chapter (PubMed genereviews[book] search and just check-genereviews both NO_CHAPTER). No conforming module: no beta-cell ER-stress module exists and loss_of_proteostasis / er_protein_storage_disease model misfolded-protein retention, not trafficking of folded proinsulin. Validation: just validate-disorders passed (77/77 snippets, 0 issues); validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms clean; list-disconnected-phenotypes 7/7 connected.

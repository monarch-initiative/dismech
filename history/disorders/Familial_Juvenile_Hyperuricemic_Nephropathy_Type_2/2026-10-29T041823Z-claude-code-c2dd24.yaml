  summary: 'Create: Familial_Juvenile_Hyperuricemic_Nephropathy_Type_2'
  details: |
    New entry for ADTKD-REN (MONDO:0013128, REN hgnc:9958). The GeneReviews ADTKD-REN chapter (PMID:21473025) is the phenotype baseline and is tagged; its clinical characteristics, diagnosis, management, surveillance, agents-to-avoid and genetic counseling sections are each quoted. Primary sources: the founding report (PMID:19664745), the fludrocortisone family (PMID:21084044), the p.Trp10Arg kindred (PMID:21903317), the international 111-patient cohort (PMID:32750457), the adult-onset mature-peptide family (PMID:31406136), the mitochondrial misrouting study (PMID:37283036), the p.Trp17Arg study (PMID:38520530), a case report (PMID:28701203), an ADTKD review (PMID:36250282), the ClinGen Definitive validity record and a renin-lineage Dicer knockout mouse (PMID:20056748). The causal chain runs from REN variants through failed preprorenin translocation or trafficking, endoplasmic reticulum stress or mitochondrial misrouting, and juxtaglomerular cell loss, to reduced renin, hyporeninemic hypoaldosteronism (hyperkalemia, acidosis, hypotension, urate retention and gout), reduced erythropoietin (anemia) and nephron loss with tubulointerstitial fibrosis (CKD to ESKD). Subtypes follow the cohort's signal peptide, prosegment and mature renin groups. Entry type DISEASE, one gene-defined entity matching ClinGen; biallelic REN renal tubular dysgenesis is excluded. One OpenScientist report was used: 19/19 references resolved, 0 off topic; term validation flagged NCIT:C15366 and NCIT:C29060 as mislabelled, and neither was used. Its leads PMID:37283036, PMID:38520530 (fludrocortisone follow-up) and PMID:20056748 were re-read from fetched caches before citing; its anemia-mechanism leads (PMID:20400218, PMID:11104792, PMID:2474097) and general ADTKD reviews were not used because the entry already cites a disease-specific source for that step. just preflight-dr exited 2 for lack of a local MONDO build; the report names REN throughout. Validated with just validate-disorders (schema, terms, 85/85 snippets) and the per-file and whole-repo gates in the brief.

    CHD term rebind, 9 more Table 1 phenotypes, edge-evidence relocation, nail onset'
  details: |
    Review round 2 on PR #15570 (ai4c-reviewer re-review of commit 05ebd1203),
    all in one push.

    Blocking items:
    1. Top-level description SCOPE NOTE and notes still said VSDs are "not seen
       with intragenic UBE2A point mutations" / called heart defects a
       "contiguous-gene feature". Rewrote both to match the corrected phenotype
       block (CHD occurs with intragenic alleles and deletions, enriched among
       larger deletions).
    2. Q128X overstatement fixed in the two remaining places: the node-1
       downstream explanation (now "importance inferred from conservation;
       reduced activity inferred rather than directly assayed", with
       directness: INDIRECT) and the variant description.
    3. Heart-defect frequency was on the VSD-specific term HP:0001629. Rebound the
       node to HP:0001627 Abnormal heart morphology (preferred_term "Congenital
       heart defect", coarse_binding_basis VARIABLE_SPECTRUM) since the 38% counts
       any heart defect; VSD kept as the named commonest lesion in the
       description. Replaced the stand-alone Table 2 mutation-header snippet with a
       concrete conotruncal lesion quote (DORV with inlet VSD).
    4. Added nine more Table 1 phenotypes with exact gestalt/figure/Discussion
       quotes: Upslanting Palpebral Fissures (HP:0000582), Prominent Columella
       (HP:0009765), Hypoplastic Alae Nasi (HP:0000430), Macrocephaly (HP:0000256),
       Dry Skin (HP:0000958), Myxedematous Appearance (no term - HPO searched,
       only the anatomically wrong HP:0200028 Pretibial myxedema exists, recorded
       in notes), Widely Spaced Nipples (HP:0006610), Pes Cavus (HP:0001761),
       Constipation (HP:0002019, with the authors' coincidental-finding caveat).
       Deliberately omitted: short/broad neck and low posterior hairline (only
       bare Table 1 row labels, no clean propositional quote without parsing merged
       cells) and cryptorchidism (reviewer marked optional).

    Accepted 🔵 suggestions: relocated the PMID:23685073 edge evidence so the
    mitophagy->mitochondria edge carries the "defective mitochondria" sentence and
    the mitochondria->synaptic edge carries the "defective synaptic function as a
    consequence of mitochondrial failure" sentence; added JUVENILE onset to Nail
    Dystrophy with the "onset of onychodystrophy is in or after puberty" quote.
    Declined/deferred (non-blocking): no treatments: section (no disease-specific
    therapy; symptomatic-only claims left out rather than add weakly-sourced ones);
    the DNA-repair (RAD18/PCNA) and H2Bub1 (RNF20/40) mechanism arms from the
    deep-research report left as leads rather than added as an EMERGING
    mechanistic_hypotheses block (their reference caches are committed with the DR
    report but remain uncited by the entry).

    Validation (all green): just validate (65/65 snippets, 68 titles),
    validate-disorders, check-entity-refs, check-causal-targets,
    check-coarse-phenotypes (HP:0001627 VARIABLE_SPECTRUM accepted),
    check-snippet-grading, check_gene_activity_grounding --against-ref origin/main.

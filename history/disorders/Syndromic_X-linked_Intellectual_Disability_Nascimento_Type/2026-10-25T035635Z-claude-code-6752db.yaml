  summary: 'Review round 1: VSD intragenic correction, pathophysiology node split,
    phenotype frequencies, diagnosis section'
  details: |
    Review round 1 on PR #15570, responding to ai4c-reviewer CHANGES_REQUESTED.
    All changes bundled into one push.

    Blocking items addressed:
    1. Ventricular Septal Defect: removed the incorrect claim that heart defects
       are "not reported with intragenic UBE2A point mutations". Czeschik 2013
       (PMID:24053514) Table 2 reports heart defects in 10/26 (38%), including
       intragenic alleles (p.Y130Vfs*9 1/1, p.I87Mfs*14 1/2, the 7.1 kb intragenic
       deletion 1/3). Reframed as a residual genotype gradient (more frequent with
       larger Xq24 deletions, not confined to them); added the Czeschik heart-defect
       row and mutation-header row as evidence, kept de Leeuw/Thunstrom reframed, set
       frequency FREQUENT.
    2. Split two bundled pathophysiology nodes into four atomic nodes:
       "Neuronal Mitochondrial Dysfunction and Synaptic Failure" ->
       "Accumulation of Dysfunctional Neuronal Mitochondria" (CELLULAR) +
       "Neuronal Synaptic Dysfunction" (CELLULAR); "Impaired Synaptic Plasticity
       and Learning" -> "Impaired mGluR-Dependent Long-Term Depression" (CELLULAR) +
       "Spatial Learning and Memory Deficit" (ORGANISM). Retargeted node 3's
       downstream and the discussion attaches_to to the new names; redistributed the
       Haddad/Bruinsma snippets (mouse/patient defective-mitochondria, Drosophila
       synaptic-failure, mGluR-LTD, spatial-learning/epilepsy-normal) across the
       atomic nodes. check-entity-refs and check-causal-targets re-run OK.
    3. Added phenotype frequencies from Czeschik Table 2 aggregate counts (each with
       an exact table-row snippet): Intellectual Disability 100%, Global
       Developmental Delay / motor delay 100%, Absent Speech / speech impairment
       100%, Seizures 62%, Generalized Hirsutism 65%; and three new phenotypes:
       Abnormal Facial Shape (HP:0001999, facial dysmorphism 100%, VERY_FREQUENT),
       Behavioral Abnormality (HP:0000708, 57%, FREQUENT), White Matter Abnormality
       (HP:0002500, 47%, FREQUENT). Per-feature craniofacial frequencies left unset
       (no quotable per-feature count exists).
    4. Q128X: reworded from "required for enzyme function" to the source's actual
       claim that C-terminal importance is inferred from conservation (Nascimento
       2006). Removed uncited R11Q from the node-1 prose (G23R, cited to Budny, kept).
    5. Gene-grounding modifier: changed GO:0061631 on the variant node from
       LOSS_OF_FUNCTION to DECREASED so it agrees with the E2-activity node;
       functional_impact_category still records LOSS_OF_FUNCTION.
       check_gene_activity_grounding --against-ref origin/main stays OK.

    Accepted 🔵 suggestions: added a diagnosis section (UBE2A sequence analysis;
    chromosomal microarray / deletion analysis, with the Czeschik array-coverage
    caveat that an unsuitable array misses intragenic deletions) - diagnosis_term
    NCIT bindings omitted because the checked NCIT action terms had no label-matched
    entry in the diagnosis-term enum; split the PMID:23685073 mouse/patient snippets
    across the new mitochondrial and synaptic nodes. Declined: onset on nail
    dystrophy (no onset timing is stated in the cached sources, so adding it would
    be unsourced).

    Deep research: ran OpenScientist (provider that works in this env; falcon 403s)
    via deep-research-client with templates/disease_pathophysiology_research.md ->
    research/Syndromic_X-linked_Intellectual_Disability_Nascimento_Type-deep-research-openscientist.md.
    validate-research-reference passed (all cited PMIDs resolve; one benign
    "off-topic" warning for PMID:21967848, a genuine RAD6A-RAD18 paper). preflight-dr
    (MONDO gene/OMIM cross-check) was not run because its 588 MB sqlite:obo:mondo
    build would not fit the shared container volume, which repeatedly hit 0 MB free
    during this session. Reconciliation: the report CORROBORATES the curated entry
    (UBE2A LoF, mitophagy -> synaptic -> learning mechanism, the phenotype set, and
    the larger-deletion heart-defect gradient) with no contradictions. New leads not
    yet incorporated (left as leads pending primary-source verification): additional
    ubiquitination arms (PCNA mono-ubiquitination / DNA repair, H2B ubiquitination /
    transcription), and pineal/sudden-death and immunologic associations. These are
    candidate future enrichments, not defects in the current entry.

    Validation (all green): just validate, validate-terms (within validate),
    count-verified-snippets (57/57), check-entity-refs, check-causal-targets,
    check-coarse-phenotypes, check-snippet-grading, check_gene_activity_grounding
    --against-ref origin/main, and the batched validate-disorders gate.

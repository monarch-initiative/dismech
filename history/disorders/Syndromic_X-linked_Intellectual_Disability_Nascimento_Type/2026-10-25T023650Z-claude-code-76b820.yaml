  summary: 'Create: syndromic XLID Nascimento type (UBE2A)'
  details: |
    De novo creation of the UBE2A deficiency syndrome / X-linked intellectual
    disability type Nascimento entry (MONDO:0010461), entry_type DISEASE (a single
    gene-defined Mendelian entity). No deep-research provider was used; curated
    directly from primary literature retrieved via PubMed E-utilities.

    Gene: the lead HGNC id supplied in the task (hgnc:12475) was WRONG — hgnc:12475
    is UBE2D2. UBE2A resolves to hgnc:12472 (verified by runoak against the local
    HGNC sqlite build), which is what the entry binds.

    Pathophysiology is a five-node causal chain (bare-name downstream targets):
    UBE2A loss-of-function variant -> impaired E2 ubiquitin-conjugating activity ->
    impaired Parkin-dependent mitophagy -> neuronal mitochondrial dysfunction and
    synaptic failure -> impaired synaptic plasticity/learning -> intellectual
    disability / global developmental delay. Mechanism anchored on Haddad 2013
    (PMID:23685073, Mol Cell: RAD6A/Parkin mitophagy in Drosophila, mouse KO and
    patient cells) and Bruinsma 2016 (PMID:26476408, Ube2a-KO mouse spatial-learning
    and mGluR-LTD deficit). A HUMAN_MODEL_MISMATCH discussion records that the mouse
    KO did NOT reproduce the human seizure phenotype.

    16 phenotypes bound to HPO (intellectual disability, global developmental delay,
    absent speech, seizures, synophrys, prominent supraorbital ridges, deeply set
    eyes, almond-shaped palpebral fissures, depressed nasal bridge, wide mouth,
    hypertelorism, generalized hirsutism, nail dystrophy, micropenis, obesity,
    ventricular septal defect [recorded as a deletion/contiguous-gene feature, not
    UBE2A-intrinsic]). Genetic section + two variants (Q128X nonsense, G23R missense).
    X-linked recessive inheritance (HP:0001419) with unaffected skewed-XCI carriers
    and a maternal-germline-mosaicism caveat.

    Evidence: 8 references, all PMIDs with exact-quote snippets
    (PMID:16909393 Nascimento 2006 gene discovery; PMID:20412111 Budny 2010;
    PMID:21108393 de Leeuw 2010 clinical delineation; PMID:24053514 Czeschik 2013
    Nascimento-type delineation; PMID:25287747 Thunstrom 2015 Xq24 deletions;
    PMID:29283210 Giugliano 2018 germline mosaicism; PMID:23685073 and PMID:26476408
    mechanism). GeneReviews: searched PubMed [book] field and the committed Bookshelf
    index; no GeneReviews chapter exists (recorded in entry notes).


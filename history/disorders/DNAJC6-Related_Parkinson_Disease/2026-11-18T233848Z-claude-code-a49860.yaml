  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #18412 (scope/structure/mouse-model were approved). Item 1 (mechanism quotes that did not support their claims): re-sourced the Nigrostriatal node and the Impaired Synaptic Vesicle Endocytosis node off the AR-inheritance and gene-discovery quotes onto direct evidence - PMID:20160091 (Yim auxilin KO mouse: 'clathrin-mediated endocytosis of synaptic vesicles... was impaired'; CCV/empty-cage accumulation, MODEL_ORGANISM) and PMID:36920906 (nigral loss; patient DAT imaging). Item 4: added a Clathrin Coat Disassembly Failure node (GO:0072318) between the root and the endocytosis node, with Yim as evidence. Added a Striatal Dopamine Dyshomeostasis node (DAT misrouting/slowed reuptake/low CSF HVA; PMID:36920906 + PMID:32472658) as the link between endocytic failure and degeneration. Item 2 (GeneReviews under-used; corrected my earlier TAGGED_OVERVIEW claim to TAGGED after re-running check-genereviews - the chapter is a full four-section abstract): added a diagnosis section, the cardinal-sign phenotypes (bradykinesia, resting tremor, rigidity, postural instability) plus spasticity, myoclonus, developmental delay, neuropsychiatric features, dysphagia, sialorrhea and GI dysmotility, a progression block (juvenile onset <21y; rapidly progressive, loss of ambulation mid-adolescence), and management treatments (dopamine agonist/anticholinergic, anti-seizure, myoclonus pharmacotherapy, multidisciplinary supportive care), with the dopamine-antagonist/VMAT2 avoidance caution now backed by a GeneReviews evidence item and the 25% recurrence-risk quote on genetic counseling. Item 3 (under-used caches): added pallidal DBS as a treatment (PMID:39654465, force-fetched to full text for the UPDRS 87->55 and levodopa-withdrawal quotes); added the DNAJC6-mutant midbrain organoid as an experimental_model (PMID:33597231) linked to a new HYPOTHETICAL 'Impaired Midbrain Dopaminergic Neurodevelopment' node (WNT-LMX1A), which also wires the developmental-delay and intellectual-disability phenotypes; cited MDSGene (PMID:34396589) on the genetic row and levodopa. Suggestions taken: dropped the cell type from the ORGANISM-scale Parkinsonian Motor Syndrome node; added an ATP13A2 (PARK9) differential. Every reviewer-suggested quote was verified against its actual cache before use. Validated: validate-disorders (0 issues), count-verified-snippets 71/71, entity-refs, causal-targets, name-collisions, gene-activity-grounding, coarse-phenotypes, logical-rules, qualifier-terms, enum-values, duplicate-keys, block-scalar-comments, delivery-system, model-scale-audit, conformance-content, cache-order; disconnected-phenotypes improved to 8/16 connected.

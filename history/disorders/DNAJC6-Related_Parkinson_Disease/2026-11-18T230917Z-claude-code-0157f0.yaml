  summary: 'Create: DNAJC6-Related Parkinson Disease (PARK19), split from the PD basket'
  details: |
    Fifth per-gene Parkinson entry split out of the Parkinsons_Disease basket (after PRKN, PINK1, VPS35, SNCA; plan #16952), covering a recessive atypical form. One entry for DNAJC6 (hgnc:15469, auxilin): disease_term PARK19A juvenile (MONDO:0014231) with PARK19B early-onset (MONDO:0800369) as a has_subtypes row, mirroring the SNCA PARK1/PARK4 structure. Pathograph is the presynaptic clathrin-uncoating/synaptic-vesicle-endocytosis arm: Auxilin Loss of Function -> Impaired Synaptic Vesicle Endocytosis and Recycling -> Nigrostriatal Dopaminergic Neurodegeneration (conforms module) -> Striatal Dopamine Deficiency (conforms module) -> Parkinsonian Motor Syndrome -> Parkinsonism/Dystonia. Phenotypes: parkinsonism, dystonia, and the juvenile extra-parkinsonian features (intellectual disability, seizures, cognitive decline). Added an animal_models arm: the Vidyadhara 2023 auxilin (Dnajc6) knockout mouse (PMID:36920906), an explicit PARK19 model, with two modeled_mechanisms (nigrostriatal degeneration ~40% SNpc loss; striatal dopamine deficit with L-DOPA rescue), typed divergences (SPECIES_MISMATCH, BOUNDARY_OMISSION) and readouts. Evidence reused the basket's verified DNAJC6 PMIDs (22563501, 26528954, 42414182) plus the GeneReviews chapter PMID:33983693 (TAGGED_OVERVIEW baseline); every snippet verified as an exact cache substring. DNAJC6 HGNC id confirmed hgnc:15469 from the ingest table (not from memory). Deep research: claude_code provider run and committed as a lead only (research/DNAJC6-Related_Parkinson_Disease-deep-research-claude_code.md); the Vidyadhara mouse model was the one DR lead pursued, verified against its full-text cache. Validated: validate-disorders (schema+terms+references, 0 issues), count-verified-snippets 32/32, plus entity-refs, causal-targets, name-collisions (resolved a Parkinsonism node/phenotype cross-section collision by renaming the ORGANISM node to Parkinsonian Motor Syndrome), gene-activity-grounding, coarse-phenotypes, logical-rules, qualifier-terms, enum-values, duplicate-keys, block-scalar-comments, delivery-system, shared-disease-terms, model-scale-audit, cache-order.

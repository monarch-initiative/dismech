  summary: 'Create: DDOST-Congenital_Disorder_of_Glycosylation'
  details: |
    New entry for DDOST-CDG (MONDO:0013789), built from the claude_code deep-research report (research/DDOST-Congenital_Disorder_of_Glycosylation-deep-research-claude_code.md; preflight-dr PASS, 9/9 references resolved, GO:0018279 flagged obsolete and GO:0006487 bound instead). Sources are the five DDOST case/functional papers in the report (PMID:22305527, 34462534, 36214423, 37848450, 41392699), plus two found via the ClinGen record: PMID:33413482, a CDG liver cohort listing a 65-year-old woman with DDOST-CDG, and PMID:1600939, the yeast WBP1 study used for the OST48-to-OST-activity step. ClinGen Moderate (AR) is copied from the CGGV record; relationship_type is left unset because the schema ties CAUSATIVE to Definitive/Strong. PMID:36631682 (humoral immune deficiency, a letter) has no abstract and no fetchable text, so it is not cited and the immune phenotype is not curated. Orphanet frequency classes rest on the index case and are not reproduced. No GeneReviews chapter (check-genereviews --online NO_CHAPTER). The pathophysiology runs variants -> reduced OST48 -> impaired OST function -> hypoglycosylation (conforms to the congenital_disorder_of_glycosylation module) -> multisystem dysfunction -> phenotypes; lactose intolerance and situs inversus are single-patient findings left unconnected. Validation: just validate, validate-terms, 64/64 snippets verified, entity refs, causal targets, duplicate keys, block-scalar comments, snippet length and coarse phenotypes all clean.

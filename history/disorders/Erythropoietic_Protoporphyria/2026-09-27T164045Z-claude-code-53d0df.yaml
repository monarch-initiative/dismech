  summary: 'Genetics pass: bind FECH and ALAS2 on their nodes, wire cutaneous and
    hepatic phenotypes, bind genes on subtype rows'
  details: |
    d2g genetics pass for the two erythropoietic protoporphyria rows of
    dismech#12274 (MONDO:0010420 X-linked EPP / ALAS2 and MONDO:0008319 EPP1 /
    FECH).

    Both rows were spurious. Each CURIE was already bound as a `subtype_term` on
    this entry before the change - MONDO:0008319 on the EPP row and MONDO:0010420 on
    the XLP row - so the gap list nominated concepts the entry had already retired.
    That is the `has_subtypes[].subtype_term` blind spot recorded on dismech#12189.
    Both rows carried no `genes:`, which is fixed here: FECH on the EPP row and
    ALAS2 on the XLP row.

    Anchor test. MONDO:0001676 is correct and unchanged. Both curated subtype rows
    sit inside its subtree, and the third relevant class (MONDO:0060729, EPP2) was
    already recorded as a `skos:narrowMatch` mapping.

    Wiring. Gene-to-mechanism coverage went 0/2 to 2/2 by binding FECH on the
    Ferrochelatase Enzymatic Deficiency node and ALAS2 on the ALAS2 Gain-of-Function
    Precursor Overproduction node - both nodes are named after the gene and cite its
    evidence, so the binding adds no new claim. Phenotype causal inlink went 0/8 to
    7/8: four cutaneous phenotypes wired from the phototoxic ROS node, gallstones
    from hepatobiliary loading, and two hepatic phenotypes from the cholestatic
    hepatopathy node. Mild Microcytic Anemia is deliberately left unwired and now
    carries a `notes:` field saying why - the entry's own cited review records the
    anemia but states the mechanism of the iron disturbance is unclear.

    Validation on the committed tree: `just validate` clean, `just validate-terms`
    clean, and the file's share of a 643/643 snippet verification across the ten
    files this PR touches. No new references were fetched for this entry.

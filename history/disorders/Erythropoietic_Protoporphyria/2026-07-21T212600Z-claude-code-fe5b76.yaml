  summary: 'Create: Erythropoietic Protoporphyria (MONDO:0001676)'
  details: |
    Created new Mendelian disorder entry for erythropoietic protoporphyria (FECH-related, subtype EPP) and X-linked protoporphyria (ALAS2 gain-of-function, subtype XLP). Built a deliberately unbundled seven-node pathophysiology cascade (ferrochelatase deficiency / ALAS2 gain-of-function precursor overproduction -> erythroid protoporphyrin IX accumulation -> cutaneous photoexcitation -> phototoxic ROS dermal injury; and hepatobiliary protoporphyrin loading -> cholestatic protoporphyric hepatopathy). Deep research via just research-disorder claude_code. Evidence (40 snippets) drawn from GeneReviews EPP/XLP (PMID:23016163, PMID:23409301), Balwani review (PMID:30704898), afamelanotide NEJM RCT (PMID:26132941), Whatley ALAS2 discovery (PMID:18760763), and Gouya low-expression-allele papers (PMID:10068685, PMID:14669009-fetched). All snippets verified as exact substrings of cached references; schema, term, and reference validation pass. Compliance 90.4% global / 91.0% weighted.

  summary: 'Edit: GDF5 receptor-binding mechanism and dosage series'
  details: |
    Literature pass found direct biosensor characterisation of the exact du Pan GDF5 allele. The 2002 founding report inferred that p.Leu441Pro caused a conformational change; a 2005 interaction study showed the specific defect is loss of binding to the BMPR1A and BMPR1B ectodomains, with NOGGIN binding preserved, which localises the lesion to the receptor interface. The same allele heterozygous causes brachydactyly type A2, so it is a dosage series in one variant; that is now recorded in the genetic features, as a new differential, and as the human half of a residual-signalling dose model. A second hypothesis group records the competing receptor-specificity reading, in which GDF5 p.Arg438Leu redistributes binding toward BMPR1A rather than reducing it and causes symphalangism. Pathograph GO coverage completed on all three nodes. Snippets 44/44 verified.

  summary: 'Create: Du Pan Syndrome'
  details: |
    De-novo curation while reviewing ISDS 2023 nosology group 16. Curated as one entry with two causative genes (GDF5 and BMPR1B) because MONDO carries a single concept (MONDO:0009231) for both and no published clinical feature distinguishes them; the last candidate discriminator, postaxial polydactyly, was reported in a BMPR1B case in 2024. The mechanism is modelled as partial rather than abolished GDF5-BMPR1B signalling, with the severity gradient cited from the functional comparison of the du Pan p.Arg31Cys and Grebe p.Cys53Arg BMPR1B alleles. The single reported dominant kindred is recorded as an explicit cis-allele exception in a second inheritance block rather than as an alternative mode of inheritance. All 32 evidence snippets verified against the reference cache.

  summary: Map Brittle cornea syndrome to OMIMPS:229200
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS229200 contains ZNF469-related brittle cornea syndrome 1 (OMIM:229200) and PRDM5-related brittle cornea syndrome 2 (OMIM:614170). These are the two subtypes of this Disease and the two children of MONDO:0009242. Their convergent extracellular-matrix transcriptional dysregulation and clinically overlapping corneal fragility syndrome support the existing single-Disease representation, with gene-specific mechanisms retained internally. ExactMatch applies to the full syndrome, not just ZNF469 disease, isolated keratoconus, or all Ehlers-Danlos syndromes; the historical EDS VIB label does not determine the current boundary.

  summary: 'Review rounds: address ai4c-reviewer findings on Brittle Cornea Syndrome'
  details: |
    Two review rounds on PR #9311, recorded together. Round 2 approved the entry.

    Round 1 raised six IMPORTANT findings, four of them phenotype term granularity. The
    cardinal phenotype had been bound to a grouping term and was also carrying two claims
    at once; it is now split into decreased corneal thickness (HP:0100689, OBLIGATE) and
    corneal perforation (HP:0100583), thinning being what predisposes and perforation the
    discrete event management is organised around. Keratoconus and keratoglobus were
    unbundled (HP:0000563 + HP:0001119), being distinct ectatic morphologies and separate
    major criteria in the 2017 EDS classification. The auditory phenotype was regrounded
    from the grandparent HP:0000365 to HP:0000410 mixed hearing impairment.

    The fourth was a genuine claim-evidence misalignment: joint hypermobility was supported
    by a management snippet that never mentions it. That snippet actually supports
    developmental dysplasia of the hip, which is now its own phenotype (HP:0001385), and
    joint hypermobility is re-evidenced from a newly fetched PMID:35791165. That source
    describes the hearing loss as sensorineural where the definitive review describes it as
    mixed; rather than quietly preferring one, the discrepancy is stated on the node and
    the auditory phenotype names which source it is curated from.

    Also added a diagnosis: section - two-gene molecular testing, and separately the
    recognition problem, since for this disease the hard part is reaching the test rather
    than performing it - and regrounded keratoplasty to NCIT:C210959.

    One round-1 request could not be met as written and the round-2 reviewer independently
    confirmed the pushback was correct: a top-level references: block entry with an
    explanatory tag is impossible, because ReferenceTagEnum permits exactly one value,
    GeneReviews, and the class has no notes slot. This was discovered by attempting it and
    failing validation on both counts. Since no GeneReviews chapter exists for brittle
    cornea syndrome, the absence of the block is correct, and the reasoning is recorded in
    notes: instead.

    Round 2 approved with three non-blocking suggestions, all taken. Two were real defects
    rather than polish: the auditory phenotype was NAMED "Mixed Deafness with Hypercompliant
    Tympanic Membranes" while modelling only the hearing loss, so the tympanic finding is
    now its own phenotype (HP:6000015) rather than an assertion living in another
    phenotype's name; and the central corneal thickness threshold sat in prose while a
    quotable figure was already cached, so it is now cited (below 400 micrometres, in
    extreme cases below 300, against a normal of roughly 540). The third was this missing
    history record.

    Accepting the re-review cost deliberately: pushing to an approved PR resets the
    approval under dismiss_stale_reviews. Both content suggestions correct defects
    introduced by this curation rather than adding scope, so leaving them to preserve a
    green check would have been the wrong trade.

    Validation: 30/30 snippets verified under just validate-disorders, the exact CI command,
    up from 22/22 at first submission. All five ungated CI gates pass.

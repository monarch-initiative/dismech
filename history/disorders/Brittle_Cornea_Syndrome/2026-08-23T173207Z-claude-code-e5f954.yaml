  summary: Remove two uncited corneal thickness figures and an explanation asserting
    an edit that never happened
  details: |
    Three false statements removed from prose fields, all flagged by the round-4 reviewer as non-blocking. They are fixed anyway because each is an assertion in the knowledge base that is not true, which is a different thing from an omission.

    1. 'under 200 micrometres in reported cases' appeared in both the 'Corneal Stromal Thinning and Biomechanical Failure' node description and the 'Extreme Corneal Thinning' phenotype description, presented as a central corneal thickness. No cached source says that. The nearest figures are the two case-report THINNEST POINT measurements in PMID:40647596 (151 and 157 micrometres, in a figure legend), which are not central thickness. The number was a garbled recollection of those, restated as a different measurement.

    2. 'against a normal central thickness around 540' is uncited and appears in no cached source at all. Grepped all five: PMID_23642083, PMID_40647596, PMID_21664999, PMID_26395458, PMID_35791165. Nothing.

    3. The evidence explanation on the cited PMID:40647596 threshold read 'replacing a prose-only figure with a cited threshold'. It did not replace it - the prose-only figure was still present, twice, further up the same file. This is the same error as a commit message describing edits it does not contain, except living permanently in the KB rather than in git history where it can at least be corrected by a follow-up commit.

    Both descriptions now state the figures that ARE cited in the adjacent evidence item: central corneal thickness commonly below 400 micrometres, below 300 in extreme cases. The explanation now describes what it does rather than what it changed.

    Note the 'below 200 micrometres' figure retained in the Corneal Collagen Cross-Linking treatment description is a different and correct claim - it is the Dresden protocol contraindication threshold, and it is cited.

    Validation: just validate passes all three stages, 34/34 snippets verified (unchanged - this removes uncited prose, it adds no snippet). All five ungated CI gates pass. No cache churn to revert.

  summary: 'Review round 3: add corneal cross-linking, correcting a false decline'
  details: |
    Adds a Corneal Collagen Cross-Linking treatment (NCIT:C49236 Therapeutic Procedure, therapeutic_modality DEVICE) with a target_mechanisms link to 'Corneal Stromal Thinning and Biomechanical Failure' and four evidence items from PMID:40647596.

    This corrects an error in my own review response on this PR. Reviewer suggestion 2 on the first review asked for corneal cross-linking; I declined it, and the diagnosis-section note in the same comment declined the CCT threshold, both on the stated grounds that the text 'sits in full text, and validate-disorders runs --no-full-text, so a snippet from there would fail CI'. That premise is false. --no-full-text governs whether the validator FETCHES full text, not whether it MATCHES against full text already present in the cached file. PMID_40647596.md is cached in full, and the cross-linking passage is on line 99 of it.

    The premise was already disproven by my own later commit 7f44b7d3e, which added the CCT 'below 400 micrometre' quote from the same full-text file and verified 30/30. I did not go back and revisit the cross-linking decline at that point, which is the actual lapse: a premise shown false in one place was left standing in another.

    This is the third instance of the same error pattern in this curation run (GSD VI prevalence, RAC2 neutrophilia, and now this), recorded here so the pattern is visible in provenance rather than only in three separate commit messages: asserting that a quote does not exist without grepping the cache for it.

    Curation choices in the added block:
    - NCIT:C49236 Therapeutic Procedure rather than NCIT:C15331 Ophthalmologic Surgical Procedure. The reported protocol is transepithelial (epithelium-on) cross-linking, which is not a surgical procedure.
    - No therapeutic_agent. Riboflavin is the photosensitiser but is not named in any quotable sentence in the cached record, so binding it would be an assertion the source does not carry.
    - The target_mechanisms evidence is supports PARTIAL, not SUPPORT. The outcome is real but rests on two paediatric cases.
    - The Dresden 200 micrometre contraindication is curated as its own evidence item, because it is what makes the transepithelial variant the relevant protocol for this disease rather than a detail of it.
    - The description states plainly that this is an emerging option and not a standard of care.

    Validation: just validate passes all three stages, 34/34 snippets verified (was 30/30). All five ungated CI gates pass; check-folded-hyphens caught a 'cross-' line-end split in the new prose that would have folded to 'cross- linking', fixed by reflowing. Unrelated references_cache churn produced by the validator's normalisation step was reverted rather than staged.

  summary: 'Create: Brittle Cornea Syndrome (MONDO:0009242) with ZNF469 and PRDM5
    subtypes'
  details: |
    Created kb/disorders/Brittle_Cornea_Syndrome.yaml as a single Disease entry keyed on
    MONDO:0009242 with two genotypic subtypes, BCS1 (ZNF469, MONDO:0024543) and BCS2
    (PRDM5, MONDO:0013605). Both stubs are retired by this change.

    The claim (#9302) was for BCS2 alone and explicitly asked for the lump/split call to be
    made and justified. The evidence favours lumping. PMID:21664999 states that "ZNF469 and
    PRDM5, two genes that when mutated cause BCS, participate in the same regulatory
    pathway"; the downstream lesion - loss of transcriptional control over fibrillar
    collagens - is shared; and PMID:23642083 states the clinical feature list and the
    management plan once for BCS rather than per gene. dismech's own rule is that a disorder
    entry needs one reasonably conserved pathograph, and BCS has exactly one: the two genes
    diverge only at the topmost node and are indistinguishable from the ECM-transcription
    node downward.

    Curating a Grouping was considered and rejected. A grouping is a union of already
    distinct diseases; BCS1 and BCS2 are not distinct diseases but one disease with two
    loci, so has_subtypes is the correct construct. Both MONDO IDs are carried as
    subtype_term values, which counts as curated coverage, so the lump does not lose
    queryability by either identifier. The reasoning is recorded in-entry as an OPEN_QUESTION
    discussion naming the counter-argument (MONDO models them as separate children) and the
    condition under which splitting would become correct (a demonstrated genotype-phenotype
    difference, none currently described).

    The p.Arg83Cys missense allele is curated as mechanistically informative rather than as
    just another variant: PMID:26395458 shows it leaves DNA binding intact and instead
    diminishes PRDM5 interaction with CHD4/NuRD and HP1BP3, so loss of the protein-protein
    interaction alone is sufficient to cause disease.

    The Ehlers-Danlos type VIB history is recorded as prose in notes with no evidence block.
    The 2017 international EDS classification abstract does not itself mention brittle cornea
    syndrome, so there is no quotable snippet; per the evidence SOP the claim was moved to
    notes rather than supported by a title quote or a fabricated one.

    A Perplexity deep-research report was generated and passed the NEC preflight against
    MONDO:0013605 - PRDM5 mentioned 169 times against ZNF469 23, report OMIM 614170 matching
    the MONDO xref. Used as a lead-generation aid only. One of its sources is a MalaCards
    page for BCS1 rather than BCS2; benign here because the entry covers both, but recorded
    because source-level entity drift survives a report-level preflight PASS.

    Validation: just validate passes all three stages, reporting "Snippets checked: 22/22
    verified against cached references". All five ungated CI gates pass. Two fixes were
    needed during validation: GO:0006355 was initially placed in molecular_functions when it
    is a biological process, and one snippet began "we demonstrate that" where the abstract
    reads "and demonstrate that".

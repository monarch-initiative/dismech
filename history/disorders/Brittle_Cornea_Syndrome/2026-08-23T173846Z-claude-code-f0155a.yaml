  summary: Restore the thickness figures with correct labels and citations; correct
    my own false absence claim
  details: |
    Supersedes the previous record in this directory on one point, which was wrong.

    That record, and the PR comment accompanying it, said the figure 'normal central thickness around 540' was 'uncited, and appears in no cached source at all', on the basis of grepping five cached files for the string '540'. The reviewer then pointed at references_cache/PMID_23642083.md:185, which reads: 'the large majority of patients with BCS have had central corneal thickness (CCT) of less than 400 um (normal range 515- 575 um)'. 540 is the midpoint of that cited range. The claim was imprecise, not uncited. My grep searched for the literal number rather than for the fact, and I reported the absence of the string as the absence of the fact.

    This is the fourth instance in this run of asserting absence without checking properly, and the first one committed WHILE fixing an earlier instance of the same thing. Recording it here because a pattern that reproduces inside its own remediation is more informative than three separate instances of it.

    Similarly the 'under 200 micrometres' figure was not invented: references_cache/PMID_40647596.md:55 gives thinnest points of 151 and 157 micrometres for the two genetically confirmed cases. The real defect there was the label, not the number - a thinnest point was being presented as a central corneal thickness and compared against a central-thickness normal.

    The previous commit resolved both by deletion, which removed two true facts to fix one labelling error. This commit restores them correctly instead:

    - Both descriptions now give CCT below 400 micrometres in the large majority of patients against a cited normal range of 515 to 575, and separately give the thinnest point of 151 and 157 micrometres in two reported cases, named as a thinnest point.
    - The phenotype description says explicitly that the thinnest point is not the same measurement, so a later curator does not re-conflate them.
    - Three evidence items added: the normal range, the pachymetry finding that thinning is central rather than uniform (which is why CCT is the measurement the literature reports), and the thinnest-point figures.

    The false explanation corrected in the previous commit stays corrected.

    Validation: just validate passes all three stages, 37/37 snippets verified (was 34/34). All five ungated CI gates pass. references_cache churn from the validator normalisation step reverted rather than staged.

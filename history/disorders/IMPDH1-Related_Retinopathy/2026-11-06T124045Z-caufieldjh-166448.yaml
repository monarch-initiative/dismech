  summary: 'Create: IMPDH1-Related Retinopathy'
  details: |
    De novo creation of IMPDH1-related retinopathy (MONDO:1040051), an autosomal dominant inherited retinal dystrophy spanning RP10 and LCA11. Deep research performed with the claude_code provider (research/IMPDH1-Related_Retinopathy-deep-research-claude_code.md; just preflight-dr passed, 87/87 references resolved). Curated a seven-node pathophysiology chain (CBS-domain missense variant -> loss of allosteric regulation / impaired nucleic-acid binding / dominant-negative misfolding / abnormal filament assembly -> rod-before-cone photoreceptor degeneration), with the retina-restricted isoform dependence as the tissue-specificity node; the catalysis-preserved negative is modelled explicitly. Competing mechanistic_hypotheses capture the misfolding-vs-no-aggregation dispute and the DEPRECATED (refuted) elevated-cGMP toxicity model. ClinGen Definitive AD gene_disease_validity recorded against CGGV:assertion_04d85991. Four model systems (Impdh1 null mouse, AAV R224P mouse, K238E and D226N cone zebrafish) with typed divergences and a FAILS_TO_RECAPITULATE link for D226N; a HUMAN_MODEL_MISMATCH discussion records the isoform-ratio model gap. Prevalence recorded only as a marked derivation. Validated with just validate-disorders, just count-verified-snippets (76/76), check-causal-targets, check-entity-refs, check-gene-validity, check-genereviews (TAGGED_OVERVIEW, non-gating), check-snippet-grading, and connectivity. Added as a DISEASE member of the Retinitis Pigmentosa grouping and deleted the stub. Closes #16645.

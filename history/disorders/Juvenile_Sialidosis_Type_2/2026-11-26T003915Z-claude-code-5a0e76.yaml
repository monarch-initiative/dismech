  summary: 'Gene-family review: NEU1; bind neuraminidase activity on the deficiency
    node'
  details: |
    The node Neuraminidase-1 Deficiency carried NEU1 with no molecular function. It now binds exo-alpha-sialidase activity (GO:0004308) as decreased, with lysosome as the location, supported by the node's existing evidence that NEU1 encodes the lysosomal sialidase whose deficiency causes sialidosis (PMID:26949572, PMID:29693572).

  summary: 'Create: KIZ-related_Retinopathy'
  details: |
    New entry for KIZ-related retinopathy (MONDO:0700232), curated from PubMed primary literature, the ClinGen gene-disease validity record for KIZ (Definitive, AR) and the openscientist deep-research report committed alongside it.

    Lump/split: kept as one Disease entry. MONDO places retinitis pigmentosa 69 (MONDO:0014345, OMIM 615780) as the only child of the gene-based term and both name the same KIZ disease, so RP69 is recorded as a has_subtypes row bound to MONDO:0014345 and as a synonym, following MAK-related_Retinopathy.

    Deep research: the openscientist report resolved 15/15 references with 8/8 quotes valid. Its term validation flagged GO:0120197 as mucociliary clearance, so that CURIE was not used. It gave HGNC:20738 for KIZ, which is SYVN1; just preflight-dr returned WARN for that reason, and the gene is bound to hgnc:15865 from the HGNC lookup and the ClinGen row. The report's own gnomAD carrier arithmetic (1 in 87) was not used; the entry quotes the 1 in 79 figure stated in PMID:38927740.

    Additional references found by PubMed search and not in the report: PMID:31556760, PMID:28837078, PMID:40169886, PMID:38375504, plus the ClinGen CGGV record. GeneReviews: just check-genereviews --online returned NO_CHAPTER.

    Mechanism: the chain runs from biallelic loss of function through kizuna at the photoreceptor ciliary base and connecting cilium dysfunction to rod and then cone degeneration. The connecting-cilium steps rest on localization only and are marked with UNKNOWN causal links, INDIRECT evidence and a KNOWLEDGE_GAP discussion. The founder allele's exonic splicing enhancer disruption is a separate upstream node. Whether RPE atrophy is secondary is recorded as an open question. The only molecular function bound for KIZ is protein kinase binding (GO:0019901), from its role as a PLK1 substrate, with INDIRECT evidence.

    Validation: just validate, just validate-terms (after normalize-cache), count-verified-snippets 81/81, entity-ref, causal-target, coarse-phenotype, qualifier, enum, duplicate-key, block-scalar, logical-rule and gene-term checks, the whole-tree gates, and just validate-disorders.

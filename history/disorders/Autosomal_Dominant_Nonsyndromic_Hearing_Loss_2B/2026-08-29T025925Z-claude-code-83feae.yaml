  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 2B (DFNA2B, GJB3)
    as a contested entity'
  details: |
    De novo curation of DFNA2B from MONDO:0012976, curated as a disease whose causal claim is contested. The curation issue asked whether the GJB3-deafness association is weaker than OMIM implies and to say so rather than curate around it; it is, and the entry does. ClinGen Hearing Loss GCEP classifies GJB3-nonsyndromic hearing loss Disputed with the wording convincing evidence disputing the association - stronger than the Limited it gives MET - and that is recorded as an external_assertion citing a newly generated CGGV cache. Gene typed DISPUTED. Mechanism grouped under a mechanistic_hypotheses entry with status ALTERNATIVE, every causal edge opting in. The founding claim is graded PARTIAL because the founding paper itself says may be responsible. The decisive human evidence is a 5700-case versus 4600-control study of the most-screened allele c.538C>T finding no significant difference and no family history in any of the 23 carriers; cited as REFUTE in four sections. The Cx31-null mouse is FAILS_TO_RECAPITULATE at fidelity LOW. Deliberately recorded the strongest counter-argument against the entry's own direction: the same null mouse is normal in skin, where GJB3-erythrokeratodermia variabilis is rated Definitive by the same panel, so an animal that cannot report an established GJB3 disease is a poor instrument for excluding a disputed one. That is written into the model limitations and into a HUMAN_MODEL_MISMATCH discussion. Read kb/disorders/Erythrokeratodermia_Variabilis.yaml first and kept the two entries consistent about connexin 31 - both describe mutant Cx31 failing to reach the membrane; they differ only on whether the tissue consequence is established. The EKV ClinGen Definitive assertion is cited alongside the Disputed one so the contrast is in the data. Recorded a defective upstream source: the ClinGen evidence summary cites PMID 12759707, which was looked up at PubMed and is a 2003 Spanish smoking-prevention editorial; it is cited nowhere and no guess was made at the intended publication. Evidence grading splits PMID:21204020 between MODEL_ORGANISM for its mouse inner ear expression work and IN_VITRO for its transfected-cell trafficking work. No treatments, no progression section: the fourth-decade progressive course is repeated in reviews with no primary natural-history data, and asserting a clinical course for a disputed entity would be the wrong kind of completeness. Validated: just validate exit 0, just validate-terms exit 0, validate-disorders exit 0 with 38/38 snippets verified.

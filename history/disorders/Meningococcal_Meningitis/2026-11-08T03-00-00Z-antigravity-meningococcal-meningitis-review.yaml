  summary: Enriched Harrison's classifications, host cell-type bindings in pathophysiology, terminal complement gene groundings, diagnostic results, and antimicrobial modality for Meningococcal Meningitis.
  details: >-
    Added Harrison's chapter classifications (INFECTIOUS_DISEASES and NEUROLOGIC)
    supported by PMID:23830646. Enriched pathophysiology nodes with epithelial cell
    (CL:0000066), endothelial cell (CL:0000115), neutrophil (CL:0000775), and
    macrophage (CL:0000235) bindings. Grounded terminal complement pathway risk genes
    (C5, C6, C7) with HGNC identifiers and autosomal recessive inheritance from
    PMID:31440263, added presence/results and CSF PCR evidence to diagnostic testing,
    and set SMALL_MOLECULE therapeutic_modality on Early Parenteral Antimicrobial Therapy.

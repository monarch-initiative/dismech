  summary: Enriched Harrison's classifications, respiratory epithelial and immune cell-type bindings, complement risk genes (C5-C9, CFP), CSF RT-PCR diagnostic evidence, and antimicrobial modality for Meningococcal Meningitis.
  details: >-
    Added Harrison's chapter classifications (INFECTIOUS_DISEASES and NEUROLOGIC)
    supported by PMID:23830646 (with REVIEW_SYNTHESIS provenance). Enriched
    pathophysiology nodes with respiratory tract epithelial cell (CL:0002368),
    endothelial cell (CL:0000115), neutrophil (CL:0000775), and macrophage
    (CL:0000235) bindings. Grounded terminal complement pathway risk genes (C5, C6, C7,
    C8B, C9) with HGNC identifiers and autosomal recessive inheritance and added
    X-linked recessive properdin (CFP, hgnc:8864) deficiency from PMID:31440263. Added
    presence/results and prospective CSF multiplex RT-PCR evidence (PMID:29237781) to
    diagnostic testing, restored the full 75%-reduction 4CMenB snippet (PMID:31971676),
    and set SMALL_MOLECULE therapeutic_modality on Early Parenteral Antimicrobial
    Therapy.

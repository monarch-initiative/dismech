  summary: 'Create: CTR9-Related Neurodevelopmental Disorder'
  details: |
    New entry for MONDO:1040006, curated from the Perplexity deep-research report (preflight-dr PASS) used as leads only. Every evidence item quotes a cached reference: the two defining case reports (PMID:35499524, 13 probands; PMID:35717577, two patients plus zebrafish ctr9 knockout and mutant overexpression), the Hamanaka 2022 de novo enrichment study (PMID:35468861), the Drosophila Ctr9 mutant study (PMID:27520958), the human PAF1 complex purification (PMID:15632063) and the ClinGen Moderate assertion (CGGV record). Both case papers are abstract-only in the cache, so no phenotype frequencies are recorded. The DR report blends in CTR9 familial Wilms tumour predisposition and MCF7 PRC2 data; both were kept out of the entry, with Wilms tumour named in notes as a separate ClinGen-curated disease. The pathograph runs variant -> altered PAF1C interactions -> impaired PAF1C-coupled elongation/histone methylation (inferred, flagged as a knowledge gap after negative fibroblast studies) -> abnormal brain development -> the clinical phenotypes. The PAF1C-interaction node binds GO:0000993 RNA polymerase II complex binding, taken from the QuickGO annotation of CTR9 (Q6PD62) and consistent with the PAF1 complex purification paper. Entry and research files use the -Related casing per the entry-naming skill; the stub is deleted. Validated with just validate, count-verified-snippets (53/53), validate-terms, check-snippet-grading and the whole-repo gate list.

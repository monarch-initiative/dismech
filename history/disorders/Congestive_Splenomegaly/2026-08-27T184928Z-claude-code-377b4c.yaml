  summary: Remove the Thrombotic Risk Factors non-exposure entry
  details: |
    Removed the Thrombotic Risk Factors environmental entry, which bundled inherited and acquired thrombophilia, myeloproliferative neoplasms and other prothrombotic states as one exposure. None is an environmental exposure: thrombophilia is a host state and a myeloproliferative neoplasm is a disease, so no ECTO or XCO term could bind the entry, and the mechanism it described is already carried by the Portal and Splenic Venous Congestion pathophysiology node. The proper destinations are a genetic entry and a comorbidity entry, both #8551 work, deliberately not attempted here rather than done half-way. A review_notes entry records this and that it clears a #8296 row structurally rather than by citation.

  summary: 'Address PR #17568 review feedback: repair environmental, subtype, treatment, and symptom evidence and add Esophageal Varix'
  details: |
    Replaced mismatched anemia-focused environmental quotes on Alcohol Use and Hepatitis B/C Virus Infection with Lancet cirrhosis-to-portal-hypertension evidence (PMID:34543610) on both the exposure entries and their PREDISPOSES influences_mechanisms links. Added multicenter cohort platelet-response evidence (PMID:38679291) to Partial Splenic Embolization while re-grading the transient-recovery quote (PMID:27860293) as REFUTE, and replaced the mismatched Splenectomy quote with cirrhotic hypersplenism splenectomy outcome data (PMID:23109457). Replaced the Extrahepatic Congestive Splenomegaly subtype quote with extrahepatic portal vein obstruction (PMID:18955865) and left-sided portal hypertension from splenic vein obstruction (PMID:38142180) evidence, and replaced mismatched snippets on Abdominal Pain (PMID:38679291, PMID:34786165), Early Satiety (PMID:34786165), and Fatigue (PMID:40095848). Added Esophageal Varix (HP:0002040) between Portal and Splenic Venous Congestion and Gastrointestinal Hemorrhage (PMID:24679494, PMID:38642564), updated Treat Underlying Cause to OTHER / NCIT:C49236, changed Hypersplenism biological_scale to ORGANISM, added splanchnic arterial locations (UBERON:0001182, UBERON:0001194), and added quote_role: REVIEW_SYNTHESIS to review-article citations.

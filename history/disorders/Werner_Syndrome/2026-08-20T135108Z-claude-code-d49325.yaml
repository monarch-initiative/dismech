  summary: 'Create: Werner Syndrome'
  details: |
    De-novo curation. Pathograph: WRN RecQ helicase-exonuclease loss -> impaired replication fork recovery and DNA repair, and telomere maintenance failure -> genomic instability and accelerated replicative senescence -> segmental progeroid tissue failure and a mesenchymally weighted cancer predisposition. Conforms to four genomic_instability_aging nodes, to telomere_attrition#Progressive Telomere Attrition, and to cellular_senescence#Senescence-Associated Cell Cycle Arrest.

    Curation decisions worth recording:
    - The telomere-limited mTerc-/- Wrn-/- mouse is curated as RECAPITULATES and the plain Wrn-/- mouse as FAILS_TO_RECAPITULATE, so the negative result is a structural claim rather than prose.
    - A HUMAN_MODEL_MISMATCH discussion records that the mouse cross may restore a human-like telomere baseline or may unmask a phenotype whose human rate-limiting step lies elsewhere; the two readings differ on whether telomere-directed intervention would be disease-modifying.
    - A KNOWLEDGE_GAP records the unexplained mesenchymal weighting of the tumour spectrum.
    - The segmental (not global) character of the progeroid phenotype is preserved in notes: no Alzheimer-type dementia, distal-predominant osteoporosis, posterior subcapsular rather than nuclear cataract.
    - Atypical LMNA-related Werner syndrome is deliberately NOT modelled as a subtype (different gene, inheritance and mechanism).
    - WRN synthetic lethality in MSI cancer is confined to notes and kept out of treatments: it is sporadic-cancer pharmacology targeting the gene whose loss causes this disease, and curating it as a treatment would invert the mechanism.

    Validation: schema, ontology-term and reference validation all run via `just validate` on each file. Every PMID was fetched with `just fetch-reference` and each evidence snippet verified as an exact substring of the cached abstract; no snippet was written from memory. Snippet count for this entry: 51/51 verified. The stub for this disease is deleted in the same change, and this PR carries only this disease's files (entry, history record, its six cited reference-cache files); it introduced no new ontology-term cache rows.

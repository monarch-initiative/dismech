  summary: 'Review: Werner syndrome'
  details: |
    Performed a full literature and structure review of Werner syndrome before
    publication. Eligibility was established on authoritative main/HEAD
    db0b8304e0c40929362e104b4f0a7ae001178f6a: the effective-history predicate
    `.events[]?.type == "REVIEW"` at
    `.target.superseded_by.path // .target.path` found no prior review for this
    target. No history record, staging, commit, push, PR, ready-state, review,
    thread, or auto-merge write preceded independent approval of the immutable
    content boundary. This record intentionally has an empty `links.prs` list;
    a separate append-only backlink is required after a draft PR exists.

    Corrected the clinical boundary and phenotype account using human cohort
    evidence. The four-cardinal-sign diagnostic rule now requires all four
    cardinal signs plus at least two additional signs, while molecular diagnosis
    is independently established by biallelic pathogenic WRN variants. Targeted
    long-read or genome sequencing is retained as an escalation for compelling
    cases with only one detected coding allele. The Japanese carrier estimate is
    explicitly modeled as CARRIER_FREQUENCY rather than affected-person
    prevalence. Registry frequencies are limited to measurements with reported
    denominators; hypertension is no longer described as uncommon. Atypical
    Werner syndrome is kept as a WRN-negative differential rather than a subtype,
    with LMNA- and POLD1-associated causes distinguished from classic biallelic
    WRN disease; Hutchinson-Gilford progeria, Bloom syndrome, and
    Rothmund-Thomson syndrome are also explicit differentials.

    Rebuilt the causal account around WRN helicase-exonuclease loss, replication
    progression, telomere maintenance, genomic instability, senescence,
    mitochondrial quality control, SHOX regulation, adipogenic failure, and the
    macrophage retrotransposon-dsRNA/type-I-interferon arm. Cancer phenotypes now
    descend only from genomic-instability-driven cancer predisposition, never
    from generic segmental tissue failure. Telomere attrition is represented as
    an experimentally supported and potentially rate-limiting route, not as an
    established sole proximate trigger of human disease. The graph contains 17
    pathophysiology nodes and 26 phenotypes; 15/26 phenotypes have supported
    causal connectivity. The other 11 are intentionally unwired because registry
    occurrence evidence does not establish a proximate route. The single causal
    gene is wired 1/1.

    Added calibrated translational content. The completed early-phase EMPOWER
    crossover trial (jRCTs031190141) and nicotinamide-riboside treatment record
    preserve the small sample, dropout, no-washout, ulcer-sequence, worsening
    right-ABI, negative secondary-endpoint, and no-serious-adverse-event facts;
    they do not claim established disease-modifying efficacy. The genotype-
    restricted WRN-108 exon-27-skipping ASO remains preclinical: patient-cell
    splice/protein rescue, dermal pharmacokinetics, and single-primate target
    engagement do not establish wound efficacy or long-term safety. The entry
    also records two experimental models, two animal models including the
    telomere-dependent mouse mismatch, verified human dataset geo:GSE247722, and
    six open discussions that preserve translational and mechanism uncertainty.
    The final structured inventory is 17 pathophysiology nodes, 26 phenotypes,
    one genetic record, two diagnosis records, four differential diagnoses,
    seven treatments, two experimental models, one dataset, one completed trial,
    two animal models, six discussions, and 22 bibliography references.

    No reference cache was created or edited by hand. Nine literature caches
    initially fetched with the sanctioned `just fetch-reference` command were
    frozen when the missing exhaustive open-PR path gate was noticed. A stable
    retrospective pre/post snapshot of 223 open PRs reconciled 14,912 declared
    files with 10,284 REST-returned file records and checked both `filename` and
    `previous_filename`. API anomalies PR #7922 (7,728 declared, 3,000 returned)
    and PR #9240 (4,309 exact-diff paths, zero of 100 declared files returned)
    were resolved with exact pinned base-to-head git diffs; all nine paths were
    absent from main and every frozen hash remained unchanged. PMID:16673358 and
    the corrected ICTRP:JPRN-jRCTs031190141 cache path each passed a separate
    live-main and stable exhaustive open-PR gate before sanctioned generation.
    Dataset and ontology validation generated only the approved GSE247722
    accession entry and MONDO disease-term cache rows. Current live-main,
    effective-history, exhaustive target/history/reference collision, rebase,
    and generated-cache union proofs are publication-stage gates and remain

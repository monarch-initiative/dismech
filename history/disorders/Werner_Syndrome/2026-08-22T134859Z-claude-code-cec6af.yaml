  details: |
    Addressed the ai4c-reviewer re-review of cf4a632b. All three CRITICAL blockers
    closed, plus findings 4, 5 and 6.

    Blocker 1 (GeneReviews untagged, uncached, unmined) - fetched PMID:20301687 with
    just fetch-reference, added it to references: with tags: [GeneReviews], and mined
    it across six sections. The PubMed record is a structured GeneReviews summary with
    CLINICAL CHARACTERISTICS, DIAGNOSIS/TESTING, MANAGEMENT and GENETIC COUNSELING
    blocks, so every item the reviewer named was quotable from the cached abstract
    without needing full text.

    Blocker 2 (no diagnosis section) - added a diagnosis: section with two entries.
    Clinical Diagnostic Criteria (Four Cardinal Signs) quotes the conjunctive
    criterion verbatim; WRN Molecular Genetic Testing quotes the independently
    sufficient molecular route and the downstream carrier and prenatal/PGT options.

    Blocker 3 (bosentan missing) - added Bosentan for Lower-Extremity Ulcers, bound to
    CHEBI:51450 as therapeutic_agent under NCIT:C15986 Pharmacotherapy,
    therapeutic_modality SMALL_MOLECULE, citing the GeneReviews targeted-therapy
    statement. It is the only treatment in this entry aimed at a WS-specific
    phenotype rather than at general-population management of an acquired
    complication, and it addresses the previously untreated HP:0200042 phenotype.

    Finding 4 (hoarseness) - added as a phenotype bound to HP:0001609. Note the
    canonical HP label is "Hoarse voice", not "Hoarseness"; preferred_term follows the
    label and the entry name carries the clinical term.

    Finding 5 (genetic counseling) - added a Genetic Counseling treatment
    (NCIT:C15240) carrying the 25/50/25 sib recurrence risks and the
    evaluate-at-risk-sibs recommendation, and added the recurrence-risk quote as a
    third evidence item on the existing autosomal recessive inheritance block.

    Finding 6 (surveillance and agents to avoid) - added two evidence items covering
    the annual surveillance schedule to the existing Cancer Surveillance and
    Complication-Directed Management treatment, and added a Risk-Factor Avoidance
    treatment (NCIT:C181743) for the agents/circumstances-to-avoid list.

    Finding 7 (deep-research artifact) - NOT addressed, remains open. Needs a
    deep-research provider run, outside this automated pass.

    Suggestions 12, 13 and 14 - NOT addressed. Left for the entry author.

    Validation: just validate passes (schema, terms, references); 62/62 snippets
    verified, up from 51/51; check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets clean; check-environmental-evidence
    clean after refreshing the branch from main.

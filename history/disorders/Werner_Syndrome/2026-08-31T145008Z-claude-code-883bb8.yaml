  summary: Add prematurely aged appearance phenotype
  details: |
    Added HP:0007495 Prematurely aged appearance as a phenotype. The file already carried an autosomal recessive inheritance block, so no inheritance change was needed.

    Motivation: the new Progeroid_Syndromes grouping states a NECESSARY criterion of a prematurely aged appearance in a Mendelian disorder. Werner syndrome is the adult prototype of that group and failed the phenotype leaf only because the composite finding was never curated, despite the file already holding its components - premature graying and thinning of hair, scleroderma-like skin changes, bird-like facies, loss of limb subcutaneous fat, short stature.

    Phenotype: HP:0007495, marked diagnostic with frequency VERY_FREQUENT. Two evidence items: PMID:20301687 GeneReviews, graded OTHER to match this file's existing treatment of that source, for the opening clinical characterization as premature appearance of features associated with normal aging; and PMID:903377, graded IN_VITRO, for an independent description of Werner syndrome as an autosomal recessive premature aging disease. That second snippet was already in use in the inheritance block with the same grading.

    The description records the adult onset explicitly - normal development through the first decade, with the aged phenotype assembling over the second and third - because that is what distinguishes this member from the childhood progerias in the grouping.

    No other content changed. Validation: just validate and just validate-terms passed; all snippets verify against the committed reference cache.

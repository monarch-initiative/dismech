  summary: 'Create: Hypomagnesemia_7_Renal_With_Or_Without_Dilated_Cardiomyopathy'
  details: |
    New entry for HOMG7 / ADKH-RRAGD (MONDO:0859328), caused by heterozygous gain-of-function RRAGD missense variants. Built from the Perplexity deep-research report (research/Hypomagnesemia_7_Renal_With_Or_Without_Dilated_Cardiomyopathy-deep-research-perplexity.md) used as leads only; its HP/GO CURIEs were mostly mislabelled or unresolved and none was reused without a fresh lookup. Evidence comes from nine PubMed records: the discovery cohort (PMID:34607910), the MiT/TFE mechanism study (PMID:37188688), the 13-patient cohort with a 37-patient summary and diuretic/dapagliflozin data (PMID:41141537, full text), a clinical review (PMID:38901414), the zebrafish model (PMID:39331021), the p.Ser76Leu hiPSC-cardiomyocyte model (PMID:42329298) and an exome-reanalysis diagnostic study (PMID:38790019). Pathograph: RRAGD variant -> nutrient-insensitive mTORC1 signalling -> TFEB/TFE3 cytoplasmic retention, branching to impaired mitophagy, a distal nephron Mg/Ca reabsorption defect (TAL and DCT) and a cardiomyocyte defect that conforms to cardiomyopathy_maladaptive_remodeling. All 17 phenotypes are causally connected. No GeneReviews or StatPearls chapter exists. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets and validate-disorders all pass; 86/86 snippets verified.

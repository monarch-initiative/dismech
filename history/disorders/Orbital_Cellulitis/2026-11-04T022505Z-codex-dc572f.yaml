  details: |
    Created a de-novo Orbital Cellulitis entry for MONDO:0006881. Added Staphylococcus aureus, Streptococcus, and historic Haemophilus influenzae infectious-agent records; contiguous sinonasal, odontogenic, traumatic, and procedural transmission routes; a postseptal infection to abscess to orbital-compartment-syndrome pathophysiology chain with optic neuropathy, visual loss, cavernous-sinus thrombosis, meningitis, and brain-abscess branches; Chandler-stage progression; ocular, eyelid, fever, optic-neuropathy, and intracranial phenotypes; orbital CT/MRI diagnosis and surgical-risk prediction; elevated C-reactive protein as a surgical risk marker; antibiotic, adjunctive corticosteroid, and surgical treatments; exact PubMed evidence snippets; and MONDO, HPO, NCBITaxon, NCIT, and CHEBI bindings. Verified the curation against cached OpenScientist research with 29/29 resolved references, retained generated PubMed caches and artifacts, and recorded the claim issue, duplicate preflight, and bacterial-scope decision in review_notes.

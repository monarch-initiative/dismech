  summary: Bind the trehalase Part to the biopsy assay; decline the urine code and
    the uncoded trehalose breath test
  details: |
    LOINC Diagnostics tranche G, batch 27 (functional and provocative tests with diagnostic thresholds). Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows at all. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 435 snippets and 466 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. This entry is the worked case for the Part-versus-observation-code distinction. LOINC:LP15910-0, the trehalase Part, is bound as the measurement of the small-intestinal biopsy assay row: it names the analyte with no specimen or method attached, which is the right shape for an identity slot. The release's one trehalase observation code, LOINC:3038-7, is declined because it measures trehalase activity in urine, a renal tubular measure rather than a mucosal one; binding it would name a different specimen and a different clinical purpose while validating cleanly. The KG, paginated in full, holds exactly two trehalase records, that urine code and this Part. The biochemical marker for the same activity is deliberately left with no loinc_term, and the reason is the slot rather than the analyte: that slot names the measurement that quantifies the marker, so it needs a specimen and a unit, and the Part cannot supply either. The breath-test row is also left unbound. Trehalose appears nowhere in LOINC: zero matching codes in the release and zero records in the KG. The challenge-unspecified exhaled hydrogen code used on the lactose and sucrose rows elsewhere in this campaign was deliberately not reused, because this row's own text says the test is not standardized, lacks validated doses and a gold-standard comparison, and is confounded by bacterial overgrowth; a code would lend a provisional test the appearance of a settled one. No reference ranges were added on any of the three rows.

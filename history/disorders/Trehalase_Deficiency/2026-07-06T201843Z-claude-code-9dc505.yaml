  summary: 'Create: Trehalase Deficiency'
  details: |
    Created a lean new disorder entry for TREH-related trehalase deficiency (MONDO:0012803, OMIM:612119, ORPHA:103909, gene TREH/hgnc:12266), confirmed via OAK sqlite:obo:mondo and sqlite:obo:hgnc. Modeled autosomal recessive inheritance, TREH loss-of-function causative genetics, brush-border trehalase-deficiency pathophysiology with a downstream osmotic/fermentative-diarrhea node, phenotypes (diarrhea and vomiting after trehalose/mushroom ingestion, abdominal distention/flatulence, and an explicit asymptomatic-carrier phenotype), oral trehalose tolerance test and small-intestinal biopsy disaccharidase assay diagnostics, dietary trehalose avoidance treatment, and three structured Prevalence records (Greenlandic Inuit 8 percent biopsy cohort, gnomAD-based worldwide birth prevalence 9.2 per million, and UK referral-population rarity). All PMIDs (3227291, 10522609, 23468175, 36167617, 10884712) were found via direct PubMed esearch/efetch, fetched with just fetch-reference, and all snippets verified as exact abstract substrings. All ontology terms verified via OAK: MONDO:0012803, hgnc:12266, HP:0000007, HP:0002014, HP:0002013, HP:0003270, GO:0004555, GO:0046352, CL:0000584, MAXO:0035096, MAXO:0000088, NCIT:C15189. just validate, just validate-references, and just validate-terms all pass.

  summary: 'Create: Familial Vesicoureteral Reflux (MONDO:0017329)'
  details: |
    De novo curation of familial vesicoureteral reflux (MONDO:0017329) as a CURATE_ROOT_WITH_SUBTYPES target. Modelled nine subtypes: the OMIM PS193000 series VUR1-VUR8 (VUR1 1p13; VUR2 ROBO2; VUR3 SOX17; VUR4 chr5; VUR5 chr13; VUR6 chr18; VUR7 12p11-q13 recessive; VUR8 TNXB) plus the X-linked form VURX, each bound to its own MONDO subtype term. Pathophysiology is a seven-node chain from abnormal ureteric bud outgrowth position (SLIT2-ROBO2, SOX17/Wnt) through ureterovesical junction incompetence and intrarenal reflux to pyelonephritic cortical scarring and reflux nephropathy, with a parallel congenital renal hypodysplasia arm. Three nodes declare conforms_to against the fibrotic_response module (Tissue Injury, Excessive ECM Deposition, Architectural Distortion and Organ Dysfunction) to capture the reflux-nephropathy/CKD trajectory. Three discussions record open items: unidentified genes at six mapped loci (KNOWLEDGE_GAP), the congenital-vs-acquired renal lesion and the RIVUR null scarring result (KNOWLEDGE_GAP), and the Robo2/Gen1 mouse MEK-inhibition rescue (HUMAN_MODEL_MISMATCH). Deep research: a claude_code run was executed (research/Familial_Vesicoureteral_Reflux-deep-research-claude_code.md) but returned only a short ontology-verification addendum rather than a narrative report; all claims were therefore anchored on primary literature fetched directly with just fetch-reference and snippet-verified. Validation: schema, term and reference validation all pass, 92 of 92 snippets verified against cached abstracts, compliance 91.3 percent. No GeneReviews chapter exists for this disease (PubMed search returned no results). A pre-PR red-team self-review was then run and its findings applied: the fibrotic conformance chain was split so that the module Inflammatory Recruitment and Mesenchymal Cell Activation nodes are instantiated rather than skipped (new Renal Inflammatory Cell Recruitment and Interstitial Myofibroblast Activation nodes, with VUR-specific evidence from PMID:27760770, PMID:33148615 and the human TGF-beta1 promoter study PMID:19861314); three MOLECULAR-scale proximal nodes were added for the ROBO2, SOX17 and TNXB lesions; an animal_models section was added for the Robo2 dosage, Robo2/Gen1 digenic and C3H/HeOuJ refluxing-infection models; the incomplete-penetrance qualifier was given a citation (PMID:1623385); the offspring prevalence was changed from a point estimate of 66 percent to a 50 percent central estimate with 66 percent as the upper bound; unreplicated-linkage and negative-association counter-evidence from PMID:19959718 was added to VUR1 and to the ROBO2 gene record; frequency-band explanations were rewritten to state both denominators; and a scar-to-reflux feedback causal edge was added. Final state: 113 of 113 snippets verified, compliance 91.4 percent, all schema, term and reference validation green, targeted pytest selection green.

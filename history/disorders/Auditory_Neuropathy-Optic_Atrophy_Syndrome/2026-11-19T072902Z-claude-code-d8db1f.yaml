  summary: 'Review rounds 1-2: evidence narrowed to what the sources state'
  details: |
    Round 1 fixed a wrong differential binding (the FDX2 row was on MONDO:0009706, the ISCU myopathy, with a note falsely claiming no FDXR MONDO term exists in this repository) and two failing whole-repo gates: two evidence snippets quoted paper titles, and the node carrying FDXR bound no molecular function. It added the Fdxr R389Q animal model and a treatments section. Round 2 then found three descriptions still asserting details no cached source states. No cached reference in this entry contains 'otoacoustic', 'brainstem' or 'evoked', and none states the five-of-eight clinical-versus-infraclinical optic atrophy split, so those claims moved from description into notes with the reason, as the vibration phenotype had been handled in round 1. The residual enzyme activity figure, by contrast, is quotable from PMID:29040572's full text and now carries real evidence showing 48 per cent of control and restoration to 94 per cent on rescue. The gene therapy's target_mechanisms effect was ACTIVATES on a node named Reduced Ferredoxin Reductase Activity, which read literally says the therapy increases the reduction; it is now RESTORES, which the enum documents with gene therapy as its example. An unsupported transferrin-receptor clause was dropped, and parents: now names FDXR-related mitochondriopathy, a synonym of the curated MMDS9B entry, rather than the MONDO parent label that has no dismech entry and rendered as an unlinked string. Validated with just validate-disorders and the two previously failing gates, check-title-snippets and check-gene-activity-grounding, both now clean.

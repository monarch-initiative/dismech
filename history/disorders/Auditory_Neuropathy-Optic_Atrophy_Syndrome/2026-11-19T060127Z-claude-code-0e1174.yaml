  summary: 'Create: Auditory Neuropathy-Optic Atrophy Syndrome'
  details: |
    Created the FDXR entry (MONDO:0060582). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true. just preflight-dr returned SKIP rather than PASS, because MONDO records no causal gene (RO:0004003) for this term, so the gene-identity check could not discriminate; identity was confirmed by hand instead, from the exact OMIM xref match (617717) and FDXR being the report's top gene at 32 mentions. The report's own frontmatter reports 2 of 8 quotes unsupported, so no quote was taken from it and every snippet was copied from the cached abstracts directly. No GeneReviews chapter exists for FDXR. The pathophysiology is a ten-node chain with no bundling: the central effector is cluster biogenesis failure reached through the electron-supply step, which is what distinguishes this disease from the scaffold, transfer and export lesions of its siblings, and the chain then branches into a bioenergetic arm and an iron arm that reconverge on oxidative stress before the sensory failure. The retinal vascular node is deliberately left with no incoming edge because its mechanism is unknown. The report suggested HP:0008568 for auditory neuropathy; that term is Vestibular areflexia, so the binding follows the existing KB precedent of HP:0006958 Abnormal auditory evoked potentials with the clinical name in preferred_term. Scope is the sensory-predominant end of the FDXR spectrum: findings reported only for the severe end, which dismech curates as Multiple Mitochondrial Dysfunctions Syndrome 9B, are excluded and the entry notes say so. Variant protein positions are recorded as each source writes them, because the hotspot allele is numbered differently across reports from different reference transcripts, and the notes warn a reader to reconcile the transcript before reuse. Three discussion sections cover the sensory selectivity, the retinal vascular finding, and the spectrum boundary and nomenclature hazard, each with a proposed experiment. Three snippets failed because the cached abstract wraps lines mid-word and mid-number, and were corrected to whole-word spans. Review round 1 fixed a wrong differential binding and two failing whole-repo gates. The FDX2 differential had been bound to MONDO:0009706, the ISCU myopathy, which is a different gene and a different disease, and its note claimed the FDX2 disease has no MONDO term in this repository when kb/disorders/FDX2-Related_Mitochondrial_Myopathy.yaml exists on MONDO:0020714. Rebound, the false note deleted, and the distinguishing features rewritten: optic atrophy is shared between the two diseases, and the episodic myopathy and reversible leukoencephalopathy are what separate them. The check-title-snippets and check-gene-activity-grounding gates both failed in CI: two evidence snippets quoted paper titles and were replaced with abstract sentences that state the claims, and the FDXR node carrying the gene bound no molecular function, so it now binds GO:0004324 ferredoxin-NADP+ reductase activity. Three further evidence items cited text that did not carry the claim: the ataxia figure now uses the snippet that states it, the progression onset range lost its quote and gained a note saying where the figure lives, and a single-patient vibration-sensation phenotype was removed rather than kept on a framing sentence. A forced re-fetch of PMID:28965846 returned abstract_only. The round also added the Fdxr R389Q knock-in mouse as an animal model linked to the transport and iron nodes with its limitations stated, and a treatments section with auditory and low-vision rehabilitation (unevidenced by design, with a note) and the preclinical AAV-Fdxr gene therapy linked to the enzyme-activity node. The equine model is explained in notes as deliberately not curated. Validated with just validate-disorders (0 issues), just check-entity-refs and just validate-history.

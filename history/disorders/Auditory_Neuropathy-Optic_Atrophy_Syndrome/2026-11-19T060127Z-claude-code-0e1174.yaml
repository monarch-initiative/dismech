  summary: 'Create: Auditory Neuropathy-Optic Atrophy Syndrome'
  details: |
    Created the FDXR entry (MONDO:0060582). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true. just preflight-dr returned SKIP rather than PASS, because MONDO records no causal gene (RO:0004003) for this term, so the gene-identity check could not discriminate; identity was confirmed by hand instead, from the exact OMIM xref match (617717) and FDXR being the report's top gene at 32 mentions. The report's own frontmatter reports 2 of 8 quotes unsupported, so no quote was taken from it and every snippet was copied from the cached abstracts directly. No GeneReviews chapter exists for FDXR. The pathophysiology is a ten-node chain with no bundling: the central effector is cluster biogenesis failure reached through the electron-supply step, which is what distinguishes this disease from the scaffold, transfer and export lesions of its siblings, and the chain then branches into a bioenergetic arm and an iron arm that reconverge on oxidative stress before the sensory failure. The retinal vascular node is deliberately left with no incoming edge because its mechanism is unknown. The report suggested HP:0008568 for auditory neuropathy; that term is Vestibular areflexia, so the binding follows the existing KB precedent of HP:0006958 Abnormal auditory evoked potentials with the clinical name in preferred_term. Scope is the sensory-predominant end of the FDXR spectrum: findings reported only for the severe end, which dismech curates as Multiple Mitochondrial Dysfunctions Syndrome 9B, are excluded and the entry notes say so. Variant protein positions are recorded as each source writes them, because the hotspot allele is numbered differently across reports from different reference transcripts, and the notes warn a reader to reconcile the transcript before reuse. Three discussion sections cover the sensory selectivity, the retinal vascular finding, and the spectrum boundary and nomenclature hazard, each with a proposed experiment. Three snippets failed because the cached abstract wraps lines mid-word and mid-number, and were corrected to whole-word spans. Validated with just validate-disorders (0 issues), just check-entity-refs and just validate-history.

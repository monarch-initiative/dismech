  summary: 'Create: Optic Atrophy 14 (MIEF1/MID51)'
  details: |
    De novo curation of optic atrophy 14 / OPA14 (MONDO:0957824, MIEF1 / hgnc:25979) as a standalone kb/disorders Disease entry.

    entry_type decision: DISEASE. One causal gene, no MONDO descendants, its own MONDO and OMIM identity (OMIM:620550), and a coherent pathograph from a heterozygous MIEF1 missense variant through impaired DRP1 recruitment to disrupted mitochondrial network dynamics and retinal ganglion cell degeneration. Nothing in kb/ mentioned MIEF1 before this entry, so there was no existing entry to extend.

    The issue asked whether an existing optic atrophy or mitochondrial dynamics entry should gain a conforms_to relationship instead. Answer: no, and the entry says why in its notes. The only candidate module is mitochondrial_dysfunction, whose five nodes are age-related mitochondrial damage and mtDNA mutation, bioenergetic decline and oxidative stress, impaired mitophagy and quality control, mitochondrial contribution to senescence and inflammation, and age-related tissue dysfunction. None is about fission-fusion balance, and no bioenergetic, ROS or mitophagy measurement exists for MIEF1, so conforming to the bioenergetic node would assert an unmeasured claim to gain a link. Autosomal_Dominant_Optic_Atrophy_Plus (OPA1) declares no conforms_to either. What is missing is a mitochondrial-dynamics module covering OPA1, MFN2, OPA3, DNM1L, MFF, SPG7, AFG3L2, YME1L1 and MIEF1; that is a separate piece of work and should be built from the OPA1 and DNM1L literature, not from this two-patient entity. Recorded in notes so the absence is a decision rather than an oversight.

    Sources: PMID:33632269 (Charif 2021, defining report, full text), PMID:36044022 (Wong lab 2022, Mid51/Fis1 lysosomal untethering, full text - independent replication of the Y240N DRP1-binding defect and a clean negative for the lysosomal arm), PMID:27660309 (MiD49/MiD51 review), PMID:36317462 (Rocatcher 2023, 2186-proband hereditary optic neuropathy series, used only to bound rarity).

    Honest framing of a thin evidence base. The whole human evidence is two unrelated women from one 200-person French cohort, with no reported segregation, and functional support from transient overexpression in HeLa cells measured against overexpressed wild-type rather than an untransfected baseline. The trigger and DRP1-recruitment nodes are graded PROVISIONAL, the HeLa model link is graded fidelity LOW with the overexpression-direction problem stated, and an open KNOWLEDGE_GAP discussion says plainly that a MONDO identifier and an OMIM number record that a claim was made, not that it was replicated.

    A node was curated for what the disease is not: preserved MID51 localisation and oligomerisation, carrying two REFUTE evidence items, because both candidate mechanisms were tested and excluded and that is what makes the positive finding meaningful.

    Source defect recorded, not propagated: the defining paper's Figure 2a legend places c.436C>T at "position 416 of the MID51 protein" while naming p.R146W in the same sentence. 146 is consistent with the nucleotide change and every other mention; the genetic notes flag 416 as a typographical error.

    Deep-research claim rejected: the falcon report states MIEF1 accounted for about 1.08 percent of positive optic atrophy diagnoses in the Rocatcher series. That series' abstract says genes outside its top ten each account for less than one percent and does not name MIEF1 at all. The prevalence block curates the bound the abstract supports; the discrepancy is recorded in the entry's notes. NEC preflight itself passed cleanly (MIEF1=47, next gene OPA1=3).

    Deliberate omissions: no treatments, no animal_models (none exists in any species), and no progression block beyond what the phenotype descriptions carry.


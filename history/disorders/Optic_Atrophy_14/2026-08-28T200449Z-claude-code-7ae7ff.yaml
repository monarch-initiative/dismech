  details: |
    Review response on PR #9926, plus one item from the automated research comment on issue #9907.

    Blocking review items fixed.
    1. supports: REFUTE polarity was inverted on the "Preserved MID51 Localisation and Oligomerisation" node. The node is named for the preserved state, so evidence showing preservation supports it; REFUTE would have read as "preserved localisation is refuted", the opposite of both the paper and the node's own prose. Both items switched to SUPPORT, with explanations stating which hypothesis is thereby excluded.
    2. GO:0005515 protein binding on the DRP1-recruitment node replaced with GO:0030674 protein-macromolecule adaptor activity, which matches the entry's own description of MID51 as the adaptor that recruits DRP1 and is already in the enum cache.
    3. Retinal nerve fibre layer thinning added to phenotypes as HP:0020119 Abnormal retinal nerve fiber layer morphology, using the already-verified OCT snippet. Noted in its description that only one of the two patients had OCT.

    Non-blocking suggestions taken.
    4. Structured onset added to the Optic Atrophy phenotype: onset_category MIDDLE_AGE with min 47 and max 55 years, and a notes field warning that those are ages at study rather than ages at onset, which the source does not separate cleanly for patient 1. Added the paper's own adult-onset discriminator sentence as supporting evidence.
    5. evidence_source on the PMID:36044022 domain-assignment sentence changed from IN_VITRO to OTHER, since that sentence is background framing in the citing paper's introduction rather than a result it reports.

    From the research comment on issue #9907.
    6. Added the mitochondria-lysosome specificity result as evidence on the preserved-state node: the optic-atrophy variant p.Y240N still forms a Mid51/Fis1 complex and does not misregulate lysosomal untethering or lysosomal network dynamics. Graded SUPPORT rather than REFUTE, deliberately, because the claim the node makes is the preserved state; the excluded mechanism is named in the explanation instead. The node description now explains that this turns the preservation from an in vitro observation into a statement about which of MID51's two functions the disease damages, and links it to the existing pathway-selectivity discussion.

    Branch rebased onto origin/main. Before the rebase, check-snippet-grading failed on a divergence in Metastatic_Ovarian_Cancer.yaml, a file this PR never touches; the branch was simply behind main, and the check passes after rebasing.

    Validation after the changes: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 37/37 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. Cache diff is empty after the edits.

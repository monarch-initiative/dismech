  details: |
    Review round 1 on PR #13491, suggestion. Neither snippet in the endogenous block supported the claim that the organisms come from resident ocular-surface and oral flora; endogenous origin was an inference from a stagnation quote and a polymicrobial quote. Made the claim direct instead of softening it only: added two further quotes from PMID:39488146, one stating that the lacrimal ducts carry resident flora of their own (the lacriome) and one stating that infection occurs when mucosal immune functions are overwhelmed, which together support endogenous origin from flora already present rather than acquisition from outside. Narrowed the block name and description from 'resident ocular surface and oral flora' to the lacrimal drainage system's own resident flora, dropping the oral and ocular-surface origin claim the sources do not make. Added a notes: field recording what the sources do and do not establish, including that PMID:34287258 reports the concretion microbiome resembling that of oral endodontic disease in structure but that a resemblance in composition is not evidence of an oral origin and is not cited as a route. Validation: just validate passed; snippets verified; MISSING_TRANSMISSION stays cleared.

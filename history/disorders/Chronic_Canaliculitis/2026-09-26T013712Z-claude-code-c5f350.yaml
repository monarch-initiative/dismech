  summary: 'Create: Chronic Canaliculitis'
  details: |
    Created a MONDO:0004924 Chronic Canaliculitis entry from the OpenScientist deep-research report at research/Chronic_Canaliculitis-deep-research-openscientist.md. Report-level reference validation resolved 34/34 PMIDs; report-level term validation found one treatment CURIE mislabelled as Antibiotic Therapy (NCIT:C15329 is Surgical Procedure), so treatment bindings were reselected with OAK and canaliculotomy was bound to the broader Curettage Procedure term after an OAK search found no canaliculotomy-specific NCIT term. preflight-dr skipped because MONDO records no causal gene for this acquired infection; manual identity review kept the entry scoped to MONDO's Actinomyces-associated chronic canaliculitis and excluded fungal, viral, and plug-related canaliculitis claims from the broader report. Added an Actinomyces infectious-agent block, a lacrimal canaliculus concretion/inflammation pathograph, five ophthalmic or laboratory phenotypes, and canaliculotomy/curettage plus incision-sparing expression/antibiotic irrigation treatments with exact PubMed evidence.

  details: |
    New entry for HMGCS1-related congenital myopathy 28 with rigid spine (MONDO:0980756, OMIM:621433), curated from the PubMed abstract of the founding report (PMID:39531736, Dofash et al. 2025), which is the only patient series; its PMC record is not open access, so only the abstract is cached and quotable. Three zebrafish hmgcs1 papers (PMID:24573296, PMID:28686747, PMID:30987969) support the enzyme reaction and the loss of isoprenoid and cholesterol synthesis on mutation. Pathophysiology is a three-node chain (hypomorphic HMGCS1 variants -> reduced mevalonate pathway output -> rigid spine myopathy) wired to all eight phenotypes. The zebrafish mutant is recorded as an animal model with modeled_mechanisms, readouts and a typed TEMPORAL_SCOPE divergence. Mevalonic acid is recorded as a preclinical treatment, tested only in zebrafish. One OpenScientist deep-research report was used as leads (8/8 references resolved, 6/6 quotes valid, 0 off topic; term validation flagged obsolete GO:0010142, which is not used). just preflight-dr returned WARN because HMGCR is mentioned as a pathway comparator, not as a second disease. The report's HPO-annotation frequencies (proximal and distal weakness, scapular winging, reduced FVC, fatty replacement and absent features) come from the full text and are recorded in notes, not curated, because no citable quote exists. Validation: just validate, validate-terms, count-verified-snippets (32/32), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading, list-gene-term-mismatches and validate-disorders all passed.

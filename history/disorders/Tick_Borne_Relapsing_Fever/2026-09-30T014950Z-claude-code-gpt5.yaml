  details: |
    Created a soft-tick tick-borne relapsing fever leaf under Relapsing Fever from the OpenScientist fallback report and bound MONDO:0001621, Borrelia, B. hermsii, B. crocidurae, Ornithodoros soft-tick vectors, Rodentia reservoirs, FhbA-mediated complement evasion, Vtp-dependent tick-bite infectivity, and Vmp antigenic switching. Recorded a deliberate soft-tick Borrelia lumping decision in review_notes while keeping louse-borne relapsing fever and hard-tick B. miyamotoi disease outside this leaf. Avoided the unsupported PMID:16940140 quote, unresolved HP:0500131, bad NCIT drug IDs, incorrect UBERON:0001891 brain binding, and generated NCBITaxon leads that live OAK lookup showed were not Ornithodoros or Borrelia parkeri.

  details: |
    Addressed the blocking content-completeness finding (the entry had no clinical layer) plus the two evidence items and the notes correction. Added phenotypes Recurrent fever (HP:0001954), Anemia (HP:0001903) and Thrombocytopenia (HP:0001873), all wired from a new Recurrent Spirochetemic Febrile Episodes node (PMID:29250931, PMID:19995898). Added a B1b-cell IgM Clearance of Bacteremic Waves node (PMID:12646649) that completes the relapse cycle - antibody clearance of each Vmp serotype selects for the next - wired Spirochetemic Dissemination to it and it to Vmp Antigenic Switching, and Vmp switching to the febrile-episode node. Added a Jarisch-Herxheimer Reaction node (PMID:8663853, treatment-triggered TNF-alpha/IL-6/IL-8 surge). Added a diagnosis block (blood-film microscopy + 16S PCR, PMID:27188655), treatments (doxycycline/penicillin/ceftriaxone via CHEBI; doxycycline post-exposure prophylaxis, PMID:24107216; both note the JHR risk), and a progression block (incubation 2-18d, ~3d febrile episodes, ~5-7d afebrile intervals, relapses). Fixed FhbA-Mediated Complement Evasion: added quote_role BACKGROUND to the PMID:35303742 framing sentence and added the on-claim PMID:18354209 FhbA virulence-factor citation (moved from the dissemination node where it was mis-allocated). Replaced the dissemination node's mis-fit recurrent-bacteremia snippet with the plasminogen/plasmin dissemination mechanism (PMID:25914944). Corrected notes: removed the session log describing a TBRF deep-research run that was never committed (its identifiers appear in no committed report; the entry's genus-level artifact is Relapsing_Fever-deep-research-openscientist.md), keeping only a disease/binding caveat. validate, validate-terms, count-verified-snippets (22/22), validate-disorders (LRV), check-folded-hyphens, check-causal-targets, check-entity-refs, list-disconnected-phenotypes (3/3) and check-granularity all pass. Deferred the optional further agent strata (B. duttonii etc.) and the PMID:26327444 OTHER-vs-HUMAN_CLINICAL soft call.

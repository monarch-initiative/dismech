    fever, Anemia, Thrombocytopenia, Neurological complications, Facial palsy,
    Chills, Hypotension, and Delivery during febrile attack phenotypes
    (PMID:9351408, PMID:35171908); bound NCIT diagnosis terms for Microscopy and
    Polymerase Chain Reaction; wired antibiotic therapy target_mechanisms to
    both inhibit spirochetemia and activate Jarisch-Herxheimer reaction.

  summary: 'Create: Congenital_Myopathy_11'
  details: |
    New entry for congenital myopathy 11 (MONDO:0859264), autosomal recessive HACD1 loss of function. Curated from one OpenScientist deep-research report (research/Congenital_Myopathy_11-deep-research-openscientist.md; 14/14 references resolved, term section flagged mislabelled HPO suggestions, including HP:0003749 offered for fiber-type disproportion when it is Pelvic girdle muscle weakness, so no report CURIE was copied without a lookup) plus a direct PubMed search for HACD1/PTPLA. preflight-dr was not run because the local MONDO build is absent; the report names HACD1 throughout, which is the MONDO causal gene. Pathograph: HACD1 loss, reduced 3-hydroxyacyl-CoA dehydratase activity, altered myoblast phospholipid composition (with a REFUTE item from adult Hacd1 knockout muscle, which showed no lipid change), impaired myoblast fusion and differentiation, myofiber hypotrophy, a canine-only T-tubule membrane node, and a mouse-only cardiolipin node. Labrador retriever and Hacd1 knockout mouse animal models carry modeled_mechanisms; a HUMAN_MODEL_MISMATCH discussion records that the dog disease is centronuclear and progressive while the human disease is fiber-type disproportion and improves. Clinical detail available only in the full text of PMID:23933735 and the case letter PMID:32426512 (no abstract) was used in prose only, because CI matches snippets against abstracts. Report citations not used: PMID:20179953 and PMID:20951040 (general fiber-type disproportion differentials), PMID:31450509 (canine model review), PMID:25815571 and PMID:21217042 (veterinary anesthesia and allele frequency studies). Rejected PMID:16959509/17085063 (Samaritan benign congenital myopathy), later shown to be RYR1. ClinGen records HACD1 Definitive only for the parent class MONDO:0019952, so no gene_disease_validity assertion was added. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), validate-disorders and the offline QC gates.

  summary: 'Create: KLC4-Related Early-Childhood-Onset Neurodegeneration (CONDRHN,
    MONDO:0700288)'
  details: |
    Identity resolved from the stub's MONDO xref chain, since MONDO records no causal gene for MONDO:0700288: OLS gave OMIM:621129 and MEDGEN:1876471, NCBI mim2gene_medgen mapped that MIM to GeneID 89953, and NCBI Gene resolved it to KLC4 (6p21.1). MedGen's definition of the concept (CONDRHN) attributes it to Bayrakli et al. 2015, which is the KLC4 spastic paraplegia paper, and ClinVar carries two KLC4 variants classified against exactly this trait name - a three-way triangulation. Coverage recheck by gene against origin/main found no kb/ entry for KLC4; the pre-existing label hits on Autosomal_Dominant_Charcot-Marie-Tooth_Disease_Type_2W and Cerebrotendinous_Xanthomatosis were confirmed to be the phrase 'demyelinating peripheral neuropathy' used as a phenotype.

    Two scope decisions drive the entry.

    First, the disease's name is more specific than its published clinical description, and this is curated as an explicit knowledge gap rather than papered over. MONDO and OMIM name retinitis pigmentosa, sensorineural hearing loss and demyelinating peripheral neuropathy; the only clinical report's abstract (PMID:26423925) says only 'progressive complicated spastic paraplegia', and its full text is paywalled - the cached reference contains zero occurrences of retinitis, pigmentosa, hearing or neuropathy. The nearest quotable statement of the phenotype is the zebrafish paper's summary sentence, 'patients show defects in vision, hearing, movement and cognition', so the four phenotype records are bound at that level (HP:0000505, HP:0000365, HP:0100543, HP:0007020) and each says in its description why it is not bound to the narrower concept in the disease name.

    Second, the entry does not merge the late-onset heterozygous KLC4 case. PMID:37565267 reports an Undiagnosed Diseases Network proband with myelopathy and neuropathy from around age fifty carrying a heterozygous residue-369 frameshift - a different allele, inheritance mode and onset. The recessive family's four unaffected heterozygous relatives are the control that makes one truncated allele insufficient, so the two are curated as separate entities and the C. elegans model that tests the dominant allele is linked only to the molecular domain-loss node at fidelity LOW.

    Gene-disease validity is recorded honestly. NCBI mim2gene_medgen maps MIM 621129 to KLC4 with the qualifier 'question', which that file's own README defines as an OMIM question mark indicating an unconfirmed or possibly spurious mapping. KLC4 has no ClinGen gene-disease validity classification (checked against the ClinGen Gene-Disease Validity CSV). ClinVar's second allele, NM_201521.3:c.1164T>A (p.Cys388Ter, likely pathogenic against this trait), is mentioned in prose but not used as evidence because no publication describing that patient was found.

    Mechanism comes almost entirely from the klc4 zebrafish mutant (PMID:36222498): KLC4 is required for stabilising nascent sensory axon branches, for microtubule dynamics and endosomal transport, and for the contact repulsion that lets peripheral arbors tile. The chain is truncation -> loss of the cargo-binding TPR domain -> impaired kinesin-1 cargo delivery -> defective axon branch stabilisation and arbor patterning -> disordered patterning across multiple neural systems -> the four phenotypes. The last edge is INDIRECT_UNKNOWN_INTERMEDIATES and means it: nothing connects a mispatterned fish arbor to a child losing vision, hearing, walking and cognition.

    The fish is also curated with a FAILS_TO_RECAPITULATE link against Progressive Complicated Spastic Paraplegia, because it is adult viable with no early neurodegeneration while the disease's name begins with the word neurodegeneration. That tension has its own HUMAN_MODEL_MISMATCH discussion, including the two caveats that fish have no corticospinal tract and that paralogue redundancy may differ between species.

    Only one treatment record (genetic counselling) because it is the only one that can be stated without inventing an experience; the notes say so explicitly.

    Validation: just validate (schema + terms + references) passed; 40/40 snippets verified, no prefix skips; check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all clean. Every phenotype is wired; the only node with no incoming edge is the variant.

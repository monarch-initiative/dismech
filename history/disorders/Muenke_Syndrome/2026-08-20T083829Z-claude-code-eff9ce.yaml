  summary: 'Review: add surgical-cohort epidemiology and reoperation burden'
  details: |
    Muenke was among the weaker members of the FGFR-Related Skeletal Dysplasias grouping on evidence density (22 evidence items before this pass). Added two things from a cohort-based analysis of 326 operated craniosynostosis children (PMID:20643727).

    Prevalence: a second record, measure_type PERIOD_PREVALENCE, expressing Muenke as a share of a surgical cohort rather than of the population - the FGFR3 p.Pro250Arg allele alone accounted for 24% of the 84 genetically explained cases, the single largest contributor. The notes state explicitly that this is a surgical-cohort figure and is not comparable with the 1-in-30,000 birth incidence already curated, so the two records are not read as conflicting estimates of the same quantity.

    Treatments: added evidence to the Cranial Vault Surgery entry that 58% of children with a single-gene cause required repeat craniofacial surgery against 17% of those with a chromosomal cause, and the authors' mechanistic reading of that difference - a mutation that continuously disrupts physiological signalling in the suture keeps driving fusion after release, whereas a chromosomal cause produces a more indolent secondary craniosynostosis. This ties surgical burden to the FGFR signalling lesion rather than to severity, and is the clinical argument for the pharmacological suture-directed approaches now under investigation.

    Validation: just validate PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 26/26 verified.

  summary: 'LOINC tranche I: bind serum K/Mg, blood/urine cesium, and QTc codes'
  details: |
    Bound LOINC-coded loinc_term to the Serum potassium concentration marker (LOINC:2823-3) and the Blood and urine cesium concentration marker (LOINC:5616-8, the blood/serum-plasma side; loinc_term is single-valued so the paired urine code is bound on the diagnosis row instead). Added diagnosis[].measurements to the three existing diagnosis rows: Serum potassium and magnesium measurement (LOINC:2823-3, LOINC:2601-3), Blood and urine cesium quantification (LOINC:5616-8, LOINC:5618-4), and Serial electrocardiography with corrected QT measurement (LOINC:8636-3, the method-less corrected-QT code, chosen over the Bazett/Fridericia-formula-specific variants since the cited sources do not state which formula was used). No new reference-range bands: potassium/magnesium normal intervals are population facts rather than disease content, and no validated universal toxic threshold exists for cesium in the sources consulted.

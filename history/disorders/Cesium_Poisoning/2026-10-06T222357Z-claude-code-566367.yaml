  summary: 'Create: Cesium Poisoning'
  details: |
    New Disease entry for cesium poisoning (MONDO:0800384), an exposure-defined toxic disorder with two clinically distinct forms curated as has_subtypes: stable (non-radioactive) cesium salt poisoning and internal radioactive cesium-137 contamination.

    Deep research: Edison Falcon (research/Cesium_Poisoning-deep-research-falcon.md, 13/13 references verified, confabulation_rate 0.0). The report's needs_review flag was set for one off-topic DOI and for a label mismatch in which the report echoed the template placeholder 'if available' instead of the MONDO label; neither is a content defect, and the MONDO binding was verified independently against the local MONDO build. The report was used as a lead set only: every citation in the entry was re-fetched into references_cache/ and snippet-verified, and all ontology CURIEs were looked up in OAK at the moment of writing rather than copied from the report.

    Pathograph: 12 pathophysiology nodes forming one connected component with no orphans. Chemical branch runs small-intestinal absorption -> systemic distribution as a potassium analog -> four parallel molecular lesions (myocardial delayed rectifier blockade, renal inward rectifier/ROMK blockade, HCN pacemaker inhibition, neuronal membrane potential instability) -> renal potassium wasting -> systemic potassium depletion -> prolonged ventricular repolarization -> triggered ventricular arrhythmia -> torsade de pointes, ventricular tachycardia, cardiac arrest, syncope. Radiological branch runs internal radiocesium retention -> hematopoietic marrow suppression -> neutropenia and thrombocytopenia. Both root nodes are entered through environmental influences_mechanisms links, so neither is a floating root.

    Deliberate curation decisions, each recorded in the entry's notes: (1) No FrequencyEnum bands on any phenotype. The only systematic human series is a 20-case review whose own scope statement states its percentages are not population frequencies, so a band would assert what the source disclaims. (2) Diarrhea left causally unconnected - documented as a manifestation and used by the sources to explain part of the potassium depletion, but no source states a mechanism by which cesium produces it. 11 of 12 phenotypes are connected. (3) No genetic section. A 2024 KCNE1 drug-induced long QT association exists but did not test cesium exposure and is not recorded as a susceptibility gene. (4) A note on the myocardial blockade node records that the clinical literature attributes QT prolongation to delayed rectifier blockade while the 1976 voltage-clamp study reports the delayed outward rectifier as the one current cesium spared in sheep Purkinje fibers; both are quoted rather than reconciled, and that evidence item is graded directness: INDIRECT.

    Validation run and read: just validate (0 issues), just validate-terms (passed), just count-verified-snippets (107/107), just check-entity-refs (OK), just check-causal-targets (no new broken targets), just check-duplicate-keys (OK), just check-qualifier-terms (3 labels match; 3 RO terms unvalidatable by any current tooling), just check-term-cache-integrity (OK), and the authoritative just validate-disorders batch (107 snippets, 119 titles, 0 issues). New MONDO/CHEBI/ECTO/NCIT/GO/UBERON terms were seeded by pointing conf/oak_config.yaml at local sqlite adapters for the validator run and then restoring it; conf/ is unmodified in the diff and the cache rows were written by the validator itself.

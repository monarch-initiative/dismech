  summary: 'Review round 1: Cesium Poisoning'
  details: |
    Addressed the ai4c-reviewer round on PR #13631 in one push.

    CRITICAL, confirmed. references_cache/PMID_988568.md was genuinely not committed. Root cause was a shell staging loop, 'while read r; do git add ...; done' over a list written without a trailing newline: read returns false on the unterminated final line, so git add was never called for it and nothing warned. The dropped file was the alphabetically last cited PMID in each of three PRs from the same session (#13631 PMID_988568, #13632 PMID_42302087, #13633 PMID_40913680); all three are corrected. Staging is now verified per cited reference with git ls-files --error-unmatch, which reports 13/13 for this entry. Both PMID:988568 quotes were re-read against the cached record: it is abstract_only but does carry the abstract, and both verify.

    IMPORTANT, diagnosis section added, covering both arms as the entry's own description promises. Serial electrocardiography with corrected QT measurement (NCIT:C38053), serum potassium and magnesium measurement (NCIT:C74946), blood and urine cesium quantification (NCIT:C47868), and for the radiological arm whole-body counting with urine and fecal bioassay plus serial blood counts (NCIT:C25294). All four terms were checked reachable from NCIT:C25218.

    IMPORTANT, the Triggered ventricular arrhythmia node now carries the early-afterdepolarization step directly rather than resting on a QT risk-association sentence. PMID:8542076 was located and cached (the Szabo 1995 Purkinje study the deep-research report cited only by DOI) and supplies the measured 43% of fibers developing late early afterdepolarizations after a 17-123 minute latency, plus the calcium-loading result. The node description was tightened to state the measurement rather than the animal-model framing.

    IMPORTANT, partly accepted with a correction to the finding. Nausea was added as a phenotype on the strength of 'Less severe but frequently reported symptoms included diarrhea, nausea, and paresthesias' from the cached series, and that same sentence was added as independent support to the existing Paresthesia phenotype. Vomiting and muscle cramps or weakness were NOT added: neither appears in PMID:41489700's cached full text. A case-insensitive search of that cache returns no occurrence of 'vomit' at all, and the single occurrence of 'weakness' is 'methodological weaknesses' in the critical note. Those symptoms appear in the deep-research report's synthesis across other sources, not in this cached series, so adding them would have meant an unsourced claim. They are left out rather than asserted.

    Suggestion accepted: the two ex vivo models are now wired into the pathograph through animal_models[].modeled_mechanisms. The canine and guinea-pig Purkinje preparation RECAPITULATES Triggered ventricular arrhythmia at model_scale CELLULAR with a readout for afterdepolarization incidence; the sheep voltage-clamp preparation RECAPITULATES Cardiac pacemaker HCN channel inhibition at MOLECULAR. Both carry limitations: the first has no whole-heart outcome and no human threshold, the second uses 20 mM cesium far above any human plasma concentration and is the preparation in which the delayed outward rectifier was spared, so it supports pacemaker-current block and not the delayed rectifier attribution.

    Suggestions declined with reasons. Prussian blue's own hypokalemia and constipation are real but not quotable from the cached sources: the sentence stating them is the deep-research report's synthesis, and PMID:31835766's cached full text contains no adverse-effect sentence for the drug. Rather than cite a report paraphrase as a paper quote it is left out. The monitoring-and-antiarrhythmic treatment bundling a procedure with a drug under SMALL_MOLECULE is a real imprecision, but the alternative is splitting one clinical action into two treatment records, and the therapeutic_modality enum has no value for a monitoring procedure paired with an agent; left as is pending a clearer convention.

    Two self-inflicted errors caught during this round. A snippet containing [K+]o and [Cs+]o failed because bracketed spans are stripped before matching; it was replaced with a bracket-free sentence from the same abstract and both dependent explanations were realigned so they describe the new quote rather than the old one. And a subtype: key on a diagnosis entry failed schema validation, because the Diagnosis class has no subtype slot; the scoping was moved into the description with a note saying why.

    Validation after the fixes, run to completion and read: just validate-disorders (124 snippets, 137 titles, 0 issues), just validate-terms (passed), just count-verified-snippets (124/124), just check-entity-refs (OK), just check-causal-targets (no new broken targets), just check-duplicate-keys (OK), just check-case-collisions (OK), and uv run pytest tests/test_data.py -k 'entity_ref or model_readout or animal' (3552 passed). conf/ is unmodified.

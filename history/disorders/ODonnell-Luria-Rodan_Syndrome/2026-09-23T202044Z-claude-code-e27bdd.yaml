  details: |
    New entry for O'Donnell-Luria-Rodan syndrome (MONDO:0032793; KMT2E). One deep-research report was run: falcon was requested and returned HTTP 402, so the claude_code fallback produced research/ODonnell-Luria-Rodan_Syndrome-deep-research-claude_code.md (fell_back: true). Its generation-time term validation failed on an OLS timeout, so reference and term validation sections were added afterwards with validate-research-reference (11/11 references resolved, 1/1 quote found, 0 off topic) and validate-research-terms (0 unresolved; 2 obsolete GO terms; 3 label mismatches that are table-parsing artifacts). preflight-dr returned PASS. Report content was used only as leads; every claim is sourced to a fetched primary or structured source. Report identifiers not used in the entry: PMID:28188343 (review), PMID:40225946 (ASO treatability review), DOI:10.3390/genes15040430 (synonymous-variant case); their caches are kept because the report's validation cites them. Structured sources: ClinGen gene-disease validity CGGV assertion (KMT2E / complex neurodevelopmental disorder, Definitive, AD) built with the structured-source CLI from the ClinGen CSV downloaded 2026-09-23, whose checksum no longer matches the 2026-08-13 manifest pin (upstream release drift); the manifest was not repinned, so the cache file's source line reports the pinned snapshot date. ClinGen dosage (CGDS) was not built for the same reason. No Orphanet product-1 record exists for the syndrome. Lump/split: single MONDO/OMIM concept kept as one entry with two allelic has_subtypes (Loss-of-function; Missense), because the missense group's severe DEE/microcephaly phenotype diverges but its mechanism is an untested hypothesis. KMT2E catalytic activity treated as a CONTROVERSY (PMID:27812132 no activity vs PMID:19377461 GlcNAcylation-dependent activity); the PHD-finger H3K4me3 reader function is what is bound. Conforms to epigenetic_machinery_neurodevelopmental_dysregulation at the haploinsufficiency and chromatin-state nodes only; the central transcriptional node is not declared because no neural chromatin or transcriptome data exist (KNOWLEDGE_GAP). Validation: just validate, validate-terms, count-verified-snippets (136/136), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-reference-titles, check-genereviews --online (TAGGED), list-gene-term-mismatches, pytest tests/test_data.py -k ODonnell (2 passed), validate-disorders (passed).

  details: |
    Corrected Cerebellar Progenitor Proliferation description to note that CL:4023161 (unipolar brush cell) represents the differentiated glutamatergic interneuron rather than the proliferative progenitor population while Cell Ontology has no rhombic-lip progenitor class. Added rate_per_100000: 0.39 and rate_denominator: POPULATION_PER_YEAR on the pediatric annual-incidence record and split ORPHA:616 US all-ages annual incidence into its own United States Prevalence record. Expanded the PMID:28613723 snippet on Multi-Agent Adjuvant Chemotherapy to include the 65%-70% 5-year survival sentence, added cohort-vs-Orphanet frequency context on Hydrocephalus (PMID:31494131, PMID:22120270, ORPHA:616), and anchored the Leptomeningeal Dissemination causal edge directly on Chang M1-M3 staging (PMID:8756384) and the metastatic presentation cluster (PMID:31494131).

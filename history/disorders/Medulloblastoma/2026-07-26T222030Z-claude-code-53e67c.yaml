  summary: Content-correctness fixes from pediatric cancer review
  details: |
    Corrected the WHO CNS5 (2021) classification statement, which had described the 2016/Heidelberg four-subgroup scheme as if it were WHO 2021. Added the Non-WNT/Non-SHH entity and demoted Groups 3 and 4 to provisional subtypes within it; added the parallel histologically defined axis (classic, desmoplastic/nodular, MBEN, large-cell/anaplastic) to the description; split SHH by TP53 status. Fixed the cell-of-origin binding on the Cerebellar Progenitor Proliferation node, which bound all four subgroups to cerebellar granule cell (CL:0001031) despite the node text correctly describing distinct lineages; now binds CL:0002362 (SHH granule-neuron precursor) and CL:0011020 (rhombic-lip-derived progenitor), with the Cell Ontology gap for unipolar brush cells and rhombic-lip progenitors stated in the node description. Added UBERON:0006215 rhombic lip. Source: docs/reports/pediatric-cancer-claim-evidence-review-2026-07-25.md. Validated with linkml-validate, linkml-term-validator (--labels), and linkml-reference-validator; all pass. New PMIDs were cached via the reference validator, never hand-written.

  summary: Augment Late-Onset Pompe Disease with the smooth-muscle and vascular arm
  details: |
    Augmented the existing MONDO:0018485 entry rather than creating a duplicate: the requested disorder name is the MONDO label already curated as kb/disorders/Late-Onset_Pompe_Disease.yaml (issue #8759, PR #8878).

    Deep research: two runs. The requested provider (falcon) failed authentication (403, empty EDISON_API_KEY), so the run was made with --fallback and completed as openscientist; research/Late-Onset_Pompe_Disease-deep-research-openscientist.md carries fell_back: true, requested_provider: falcon and the provider_attempts trail, with 52/52 references resolved. That report has no smooth-muscle or vascular content, so it corroborates the existing entry rather than this augmentation. A second run with claude_code (no API key needed) produced research/Late-Onset_Pompe_Disease-deep-research-claude_code.md (231s, 17 web searches, 70 citations, 47/47 references resolved), and it is the one that bears on this work: it independently identified the same vasculopathy literature found by direct PubMed search, which is the triangulation this augmentation rests on. Its reference_validation carries needs_review: true for one unsupported quote (PMC:PMC11638199, 'unexplained limb-girdle weakness'), which was not used here. The openscientist report is also needs_review, for one mislabelled term (HP:0001638 read as 'Minor/mild cardiac involvement'; HP calls it Cardiomyopathy), which was not used. The claude_code term_validation flagged six mislabelled CURIEs; notably it offered CL:0000192 for *vascular* smooth muscle, which CL calls plain 'smooth muscle cell'. That binding was not taken - CL:0000359 (vascular associated smooth muscle cell) was verified independently with OAK and used instead. The pre-existing falcon report from the original curation was left in place.

    What was added. The prior curation recorded, on the 'Dilatation of the ascending thoracic aorta' phenotype, that glycogen storage in vascular smooth muscle was 'the proposed substrate, but the mechanism is not established here and is deliberately not asserted'. That gap is now closed with human evidence and the phenotype description updated accordingly. Two pathophysiology nodes: 'Lysosomal Glycogen Accumulation in Vascular and Visceral Smooth Muscle' (CELLULAR, ESTABLISHED, conforms to lysosomal_substrate_accumulation) on the strength of LOPD autopsy transmission electron microscopy (PMID:22664150) plus Gaa-/- mouse quantification (PMID:33883348); and 'Dilative Arteriopathy of the Aorta and Intracranial Arteries' (TISSUE, PROVISIONAL) from PMID:21605996, PMID:39010129, PMID:33386209 and PMID:22945242. The arteriopathy node is deliberately PROVISIONAL rather than ESTABLISHED: the step from smooth-muscle glycogen to arterial wall weakness is inferred, one resected aneurysmal aorta showed connective-tissue rather than storage changes, and the mouse does not develop the lesion.

    Seven phenotypes: vertebrobasilar dolichoectasia (HP:0020038, FREQUENT, 17/30), dilatation of the intracranial arteries (HP:0004944), stroke (HP:0001297, OCCASIONAL, 7/30), cerebral white matter hyperintensities (HP:0030890, FREQUENT, 13/28), gastroesophageal reflux (HP:0002020), constipation (HP:0002019), urinary incontinence (HP:0000020). Every frequency band is backed by a quoted denominator; all four cerebrovascular frequencies come from one 30-patient Chinese imaging cohort and the notes say so rather than presenting them as pooled estimates.

    New animal_models section: the Gaa-/- B6;129 global knockout (PMID:33883348), carrying two links. It RECAPITULATES the smooth-muscle storage node (MODERATE, two readouts: tissue glycogen INCREASED, LAMP1 INCREASED) and FAILS_TO_RECAPITULATE the arteriopathy node (LOW), with the authors' own statement that their aortic findings do not corroborate the glycogen-to-wall-weakness hypothesis, plus an UNCHANGED aortic PAS readout. The negative result is curated rather than dropped because it is the reason the human node is qualified. Both links record the model's central limitation for late-onset disease: a global null has no residual enzyme, whereas LOPD is defined by partial activity from a leaky splice allele.

    Validation. just validate passed (schema, terms, references). just validate-disorders (the batched CI gate) passed: schema OK, terms OK, 156/157 snippets verified. just count-verified-snippets --unskip-prefix DOI reports 157/157, so the one DOI-keyed item CI skips was checked by hand and verifies. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all clean with no new baseline entries. Compliance rose from 98.5 percent (256/260) to 98.8 percent (331/335); the four remaining gaps are pre-existing (two datasets lacking evidence, one proposed experiment). Two literature cache files (PMID_34800399, PMID_39424261) were rewritten as formatting-only churn by the research runs' validator and were reverted, since they carry no content change and are unrelated to this curation. Separately, the --fallback run renamed the falcon output directory on its way to openscientist, which deleted the previously committed falcon report, its citations sidecar and its artifact, and left a duplicate of that artifact inside the openscientist artifact directory. The falcon files were restored from git and the stray duplicate removed, so the only research additions here are the two new reports.

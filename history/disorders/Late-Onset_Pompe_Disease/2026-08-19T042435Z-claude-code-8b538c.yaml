  summary: 'Create: Late-Onset Pompe Disease (MONDO:0018485)'
  details: |
    Standalone entry for the late-onset arm of acid alpha-glucosidase deficiency (MONDO:0018485; OMIM:621314; Orphanet:420429).

    SCOPE DECISION. kb/disorders/Pompe_Disease.yaml (MONDO:0009290) already carried an LOPD subtype with a display_name and description but no bound term. Chose a standalone entry over binding-only, because the late-onset form has substantive mechanism that is not derivable from the umbrella entry and that the umbrella deliberately does not model: (a) partial rather than absent enzyme, produced by leaky intron-1 splicing at c.-32-13T>G; (b) the resulting relative cardiac sparing, which is part of the formal case definition rather than a statistical tendency; (c) diaphragm-predominant respiratory failure with a possible spinal phrenic motor neuron component; (d) an autophagic/lipofuscin ceiling on enzyme replacement therapy that only matters because LOPD is treated for decades; (e) pre-vacuolar metabolic reprogramming of myonuclei; and (f) the newborn-screening pre-symptomatic treatment-initiation dilemma. The umbrella entry is otherwise left untouched except for one surgical edit: the LOPD subtype block now carries subtype_term MONDO:0018485 and a pointer to this file. The IOPD subtype block was deliberately not touched, because a sibling agent is concurrently curating MONDO:0017694 (issue 8758).

    CONTENT. 8 pathophysiology nodes wired into a single chain from leaky splicing to incomplete ERT response, conforming at lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation. 5 phenotypes, 2 progression phases, 1 biochemical marker, 1 histopathology finding (lipofuscin-loaded autolysosomes), 1 genetic entry with the c.-32-13T>G variant, 2 treatments with target_mechanisms, 4 clinical trials (LOTS, COMET, PROPEL, RESOLUTE), 2 datasets, and 2 discussions (a KNOWLEDGE_GAP on pre-symptomatic ERT initiation and a HUMAN_MODEL_MISMATCH on whether GAA-knockout-mouse enzyme mistargeting explains the human treatment ceiling).

    DEEP RESEARCH. falcon (Edison), research/Late-Onset_Pompe_Disease-deep-research-falcon.md. Report reference_validation: 12/12 references resolved, confabulation_rate 0.0, 0 off topic. `just preflight-dr` against MONDO:0018485 returned SKIP because MONDO records no RO:0004003 causal gene for this subtype term; the manual fallback was run and passes - GAA dominates the report's gene mentions (GAA=23, next highest 2), and the OMIM difference (report cites 232300, MONDO xrefs 621314) is the expected umbrella-vs-subtype split rather than a Named Entity Confusion signal, since OMIM:621314 is a recent LOPD-specific entry that the literature does not yet use. Only two claims were taken from the report and both were independently re-verified against freshly fetched abstracts: the single-nucleus RNA-seq staging study (PMID:39045638) and the post-ERT muscle proteomics study (PMID:33799647).

    VALIDATION. `just validate` (schema + terms + full reference validation) passed; `just validate-disorders` (the batched --no-full-text sweep CI runs) passed; `just count-verified-snippets` reports 67/67 snippets verified against cached references; `just verify-datasets` resolved 2/2 accessions; `just check-duplicate-keys` clean over 2334 files. Compliance 95%. No references_cache or cache CSV file was hand-written - all were produced by `just fetch-reference` and `just validate-terms`.

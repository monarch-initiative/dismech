  summary: 'Review response: diagnosis section, six phenotypes, GeneReviews and MetabERN
    mining (PR 8878)'
  details: |
    Review-response pass on PR #8878. Addresses all five blocking findings and all four suggestions from the ai4c-reviewer CHANGES_REQUESTED review, using sources already cached in the PR plus eight newly fetched PMIDs. The IOPD block of kb/disorders/Pompe_Disease.yaml was again deliberately not touched (sibling PR #8877 is curating it concurrently); the only edit to that file remains the LOPD subtype_term from the first commit.

    FINDING 1 - GeneReviews under-mined. The inheritance block now carries two GeneReviews (PMID:20301438) evidence items alongside the retained IPaNeMA citation: the 25%/50%/25% sibling recurrence risks and the statement that identifying the proband's biallelic GAA variants enables carrier and prenatal testing. The GeneReviews Diagnosis/Testing sentence is mined in the new diagnosis section (finding 2).

    FINDING 2 - no diagnosis section. Added nine diagnosis entries covering the full LOPD pathway: red-flag recognition; dried blood spot GAA activity as first-line screen with its preanalytical failure modes; confirmatory enzyme and molecular testing; the c.271G>A (p.Asp91Asn) pseudodeficiency false-positive trap; sitting-and-supine forced vital capacity with the FVC<40% ventilation-referral threshold; paraspinal needle EMG (curated as supportive, not confirmatory, per MetabERN); skeletal muscle MRI for disease burden; newborn screening and the resulting pre-symptomatic "patients in waiting"; and urinary Glc4/Hex4 as a second-tier and monitoring marker. All diagnosis_term values are NCIT clinical-action terms already in cache/enums (C15419, C15709, C38081, C38056, C16809, C81178).

    FINDING 3 - arteriopathy quoted as padding. Split. Ascending thoracic aortic dilatation is now its own Cardiovascular phenotype bound to HP:0012727 (Thoracic aortic aneurysm; its definition is "an abnormal localized widening (dilatation) of the thoracic aorta" and it carries "Dilatation of the thoracic aorta" as a BROAD synonym, so it is the correct term for the GeneReviews wording, with the more specific preferred_term carrying the ascending qualifier). HPO has no ascending-aorta-specific dilatation term - searched. Scoliosis now quotes "Scoliosis is also frequent." plus the per-visit surveillance line, both genuinely about scoliosis.

    FINDING 4 - 12 DOI caches fetched, none cited. Resolved by eliminating the DOI layer rather than citing it. Nine of the twelve resolve to PubMed records, so those PMIDs were fetched with just fetch-reference and the PMID form is cited instead - snippet-validated, whereas DOI: is in skip_prefixes and is not. Two DOI caches (10.1093/brain/awae249, 10.3390/ijms22062850) were duplicates of PMIDs the entry already cited (39045638, 33799647), so they were never independent sources. One (10.21037/atm.2019.06.48) cached with content_type: unavailable and has nothing quotable. Eleven DOI cache files removed; the one kept and cited is DOI:10.1101/2024.10.03.24314698, a medRxiv preprint with no PubMed record, cited only for the ACMG-AMP benign classification of c.271G>A and flagged as a preprint in its explanation.

    Newly fetched and cited: PMID:39482698 (MetabERN 2024 clinical pathway - the reviewer's "most authoritative recent clinical source"; now the backbone of the diagnosis section with 10 evidence items), PMID:37265469 (Turkish neurology expert consensus - red flags, diagnostic algorithm, paraspinal myotonia), PMID:37759679 (comprehensive LOPD update - DBS rationale, preanalytics, pseudodeficiency, Glc4), PMID:38057636 (ATB200-02 48-month cipaglucosidase alfa plus miglustat), PMID:38785980 (Failure of Autophagy in Pompe Disease), PMID:35682977 (isogenic GAA-KO myotubes), PMID:39273088 (Italian GAA mutation spectrum), PMID:42074341 (Pompe pathogenesis and therapeutics review).

    FINDING 5 - thin phenotype coverage. Six phenotypes added, taking the entry from 5 to 11: axial and paraspinal muscle weakness (HP:0003327), ascending thoracic aortic dilatation (HP:0012727), dysphagia (HP:0002015), reduced bone mineral density (HP:0000939), exercise intolerance (HP:0003546), and myalgia (HP:0003326). Each carries evidence quoting a finding, not a title. Frequency bands were deliberately NOT assigned to the six new phenotypes: none of the available sources gives a quantitative or mappable qualitative frequency for them in LOPD specifically, and per docs/frequency-evidence-guidelines.md omitting the band is preferred to fabricating justification. Dysphagia's evidence explicitly records that the supporting literature is case reports.

    SUGGESTION 6 - GeneReviews surveillance and anaesthesia caution unmined. Two treatments added. "Structured multidisciplinary surveillance" carries the GeneReviews annual panel (DXA, PFTs, echocardiography with aortic assessment, EKG, audiology, BNP), the five-yearly MR cerebral angiography, and the MetabERN annual polysomnography interval. "Anaesthetic and cardiovascular agent precautions" carries the anaesthesia caution as a negative recommendation plus the MetabERN not-totally-flat positioning rule; the digoxin/inotrope/diuretic caution is included as supports: PARTIAL with an explanation stating it is written for Pompe disease as a whole and guards against an outflow obstruction that is a feature of infantile-onset cardiomyopathy rather than of typically cardiac-spared LOPD.

    SUGGESTION 7 - node names bundling two concepts. Both renamed, with all target: and attaches_to: references updated: "Autophagic Buildup and Mistargeting of Endocytosed Recombinant Enzyme" to "Autophagic Mistargeting of Endocytosed Recombinant Enzyme", and "Diaphragmatic and Phrenic Motor Unit Failure" to "Phrenic Motor Unit Failure" (a motor unit is the motor neuron plus the fibres it innervates, so the single name covers both arms the node asserts).

    SUGGESTION 8 - CL:0000100 specificity. Confirmed deliberate and left as is. CL has no phrenic motor neuron term; preferred_term: Phrenic motor neuron against the general CL:0000100 is the documented pattern.

    SUGGESTION 9 - pre-vacuolar node rests on a single PMID. Corroborated by an independent modality: PMID:33799647 muscle proteomics before and after ERT, which reports that defects in oxidative metabolism persisted after a year of therapy and supplies the p62/SQSTM1 and LC3BII/LC3BI protein-level readout of the autophagic imbalance the transcriptomic study infers from gene expression. Note that DOI:10.1093/brain/awae249 could NOT serve as corroboration - it is the same paper as PMID:39045638, which the node already cited.

    Also strengthened while in the same nodes: the autophagic mistargeting node gained the PMID:38785980 statement that autophagic buildup rather than the enlarged lysosome is the dominant lesion in adult patient biopsies, the autophagosomal-lysosomal fusion block mechanism, and PMID:35682977 in vitro evidence that GAA-null myotubes downregulate CI-MPR (a second route by which delivered enzyme fails to reach the lysosome); the phrenic motor unit node gained PMID:42074341 on limited blood-brain barrier penetration of infused enzyme, which is the pharmacological half of its argument; the genetic section gained the Italian cohort confirmation that c.-32-13T>G is the most prevalent allele in a second European population, plus a supports: PARTIAL bound noting 22 of 61 genotyped subjects carried variants of uncertain significance.

    VALIDATION. just validate (schema + terms + full reference validation) passed on the entry. just validate-disorders over both changed kb files - the batched --no-full-text sweep CI runs - passed: schema batch "No issues found", term batch both files green, reference batch "All validations passed", "Snippets checked: 213/214 verified against cached references (1 skipped by prefix)". The single skip is the medRxiv preprint DOI, which is in skip_prefixes. just count-verified-snippets over both files reports the same 213/214. just check-duplicate-keys clean over 2334 files. just check-title-snippets: "OK: no new title-quoting snippets". Compliance 96.9% (250/258), up from 95%. No references_cache or cache CSV file was hand-written; every one was produced by just fetch-reference or just validate-terms.

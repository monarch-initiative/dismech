  summary: 'Review response: mine the consensus guideline, connect the infection branch'
  details: |
    Review response on PR #10005, addressing four IMPORTANT items plus three non-blocking suggestions.

    The reviewer identified one root cause behind all four blocking items and was right about it: the 2017 consensus guideline PMID:28399932 was cached as full text but only its abstract had been mined, so most of its graded recommendations went unused.

    Item 1, the ophthalmological surveillance entry was bound to NCIT:C17230 Ultrasound Imaging, which is not the modality described. Rebound to NCIT:C38060 Eye Examination, which already has precedent in Achromatopsia and ADan_amyloidosis. The guideline's Grade B recommendation for periodic fundus examination was added as primary evidence, and the previous single-case support retained as secondary.

    Item 2, treatments under-consumed the guideline. Five were added: ketogenic diet or vagus nerve stimulation for the drug-resistant half of patients, early physical therapy at Grade B targeting hypotonic complications, speech therapy for dysphagia at Grade A, extended inactivated vaccination at Grade C with the specific vaccines named, and vitamin D supplementation at twice the recommended daily allowance. Vagus nerve stimulation is described in the notes rather than bound, because NCIT's only reachable stimulation term is Transcutaneous Auricular Vagus Nerve Stimulation, a different and non-implanted modality that would misstate the intervention.

    Item 3, the 14q32 haploinsufficiency node asserted in its description and its own verified snippet that the branch accounts for infection susceptibility, but carried only the behavioural downstream edge, leaving Recurrent infections disconnected from the pathograph. A second downstream edge was added to that phenotype with its own evidence.

    Item 4, the fact that infection is the leading cause of adult death appeared nowhere in the entry. A clinical_burden block was added at burden_level HIGH whose rationale separates the two components of burden: the epilepsy drives disability and cognitive outcome, while infection drives mortality, and an entry modelling only the epilepsy would misrepresent what kills these patients.

    Non-blocking suggestions taken up. PMID:23159383 had been fetched but never cited; it is now the evidence for a new environmental entry modelling febrile illness as a seizure trigger, linked to the cortical hyperexcitability node with environmental_effect EXACERBATES rather than TRIGGERS, since fever lowers the threshold of an already seizure-prone cortex rather than creating the susceptibility. Its exposure_term is deliberately unbound with a review_notes waiver recording that ECTO was searched for fever, hyperthermia and heat and returns only environmental heat sources such as self-heating coal-mine waste, and that HP:0001945 Fever is a phenotype term not valid in that slot. NCT06813469, the MD-RING study, was added as a clinical trial because its registered aim is an explicit test of the position-effect hypothesis this entry curates as EMERGING, which makes it the live route to resolving the entry's central knowledge gap. The vigabatrin retinal-toxicity interaction was not curated: the guideline lists vigabatrin among antiepileptic drugs in use but makes no statement about retinal risk in this syndrome, and asserting the interaction would require a source about ring 14 patients specifically.

    Two defects were introduced and caught during this session. First, the edit that added the infection downstream edge inserted it between the behavioural edge's description and that edge's existing evidence block, producing a duplicate evidence key. just validate passed under PyYAML while the ruamel-backed reference validator aborted, which is exactly the failure mode CLAUDE.md documents; just check-duplicate-keys located it and the orphaned block was moved back onto the behavioural edge. Second, two guideline snippets spanned hyphenated line breaks in the cached PDF text. just count-verified-snippets accepted them with a cache-defect normalisation note while the authoritative just validate-disorders rejected them as not-substring; both were replaced with spans that avoid the hyphenation. Neither defect was committed.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (58/58), just check-entity-refs, just check-duplicate-keys, just check-environmental-evidence and just check-snippet-length. Compliance rose from 85.4 to 87.6 percent.

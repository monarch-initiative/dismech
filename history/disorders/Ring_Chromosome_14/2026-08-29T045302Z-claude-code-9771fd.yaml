  summary: 'Review response 2: unbind ciliate micronucleus term, correct IGH rationale'
  details: |
    Second review response on PR #10005, addressing four IMPORTANT items.

    Item 1, the micronucleus binding was a false friend. GO:0031040 resolves and passes term validation, but its definition is a membrane-bounded organelle of ciliated protozoan cells containing a diploid copy of the genome, and the term carries an explicit Ciliophora taxon restriction. That is the ciliate germline nucleus, not the mitotic-error micronucleus the cited case report describes. GO:0032125 micronucleus organization is the same ciliate concept, so no correct GO term exists. The term block was dropped, preferred_term retained as free text, and a description added recording why and that this awaits a new-term request. The claim and its evidence were unaffected; only the binding was wrong.

    Item 2, the notes rationale for not naming a 14q32.33 gene was factually wrong. It said no source in the reference cache makes that claim about ring 14 patients. The consensus guideline, cited thirteen times elsewhere in this entry, does: it attributes the infection susceptibility to haploinsufficiency on the grounds that the distal region of 14q contains the immunoglobulin heavy-chain genes. The rationale was rewritten to state what is actually true, that the sources do propose the IGH locus and the entry declines to promote it into a named-gene mechanism node because the argument is positional rather than patient-level. The guideline quote was added as PARTIAL evidence on the infection edge, and the edge description, which had said no gene has been named, was corrected to say a candidate locus has been named while the immunological lesion itself remains uncharacterised.

    Item 3, guideline section 4 was under-mined in the same pattern the previous review flagged for sections 3 and 5. Both Grade A recommendations were curated: respiratory function monitoring with advance care planning for respiratory failure, and the combined antibiotic prophylaxis, respiratory physiotherapy and immunological evaluation for recurrent pulmonary infection. The second is curated as a single treatment because the guideline recommends the three together as one conditional response; treatment_term is bound to the antibiotic component, the only one with a reachable NCIT clinical-action term. The immunological evaluation is noted as being both management and the missing evidence for the IGH mechanism.

    Item 4, the ring formation node carried locations cerebral cortex. Ring chromosome 14 is a constitutional lesion present in every cell, so localising it to cortex asserted something the mechanism does not claim. The block was dropped; the cortical localisation remains where it belongs, on the downstream cortical hyperexcitability node.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (61/61), just check-entity-refs, just check-duplicate-keys and just check-snippet-grading.

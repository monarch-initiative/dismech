  details: |
    Created kb/disorders/Ring_Chromosome_14.yaml (MONDO:0014708).

    Deep research was requested from falcon, which is not configured in this environment, so the run used --fallback and claude_code produced the report. The substitution is recorded in the report frontmatter as fell_back, requested_provider and provider_attempts rather than described in prose. The report resolved 33 of 33 references with a 0.0 confabulation rate and set needs_review for one off-topic reference, PMID:22579566, which is not cited here. Its term validation flagged 13 mislabelled terms, nearly all artifacts of frequency words and quoted prose bleeding into the label column of the report's own tables rather than wrong bindings, and two obsolete GO terms, GO:0016458 and GO:0006486. Neither obsolete term is used; the heterochromatin node binds GO:0031507, which is current.

    The entry was drafted from primary literature first and then cross-checked against the report. The cross-check added the 2017 consensus guideline, PMID:28399932, which the initial literature search had not surfaced and which materially changed the entry: it supplied autism spectrum disorder as a defining feature, feeding difficulty and nonverbal status as curated phenotypes, the nutritional-support treatment including gastrostomy escalation, the anticonvulsive-from-onset recommendation, and an explicit statement of the diagnostic order that is stronger evidence for the karyotype-first argument than the single case report the entry originally relied on.

    The mechanism is modelled as two parallel branches out of one lesion, because that is what the literature supports. Ring formation removes terminal 14q material in most patients but nothing at all in a substantial minority, six of twenty-seven in the largest series. Phenotype mapping against linear deletions places the epilepsy and the retinal abnormality in proximal 14q11.2-q12, which is preserved in every ring patient, so the deletion cannot explain the two defining features. The 14q32 branch is ordinary haploinsufficiency and carries the behavioural and immunological features. The proximal branch has no deletion behind it and is carried by two competing hypotheses, both curated as EMERGING mechanistic_hypotheses rather than asserted: position effect, supported by a telomere-only ring in which two of eight chromosome-14 genes were downregulated at normal copy number and by a FOXG1 breakpoint case; and dynamic mosaicism, supported by documented micronuclei, aneuploidy and anaphase lags in one patient. Every edge into the cortical hyperexcitability node is typed INDIRECT_UNKNOWN_INTERMEDIATES and that node is graded HYPOTHETICAL, because no causal gene, ion channel, synaptic or network abnormality has been identified in this syndrome.

    No genetic section, following the Ring_Chromosome_20_Syndrome precedent. There is no causal gene. FOXG1 is a positional candidate raised by a single atypical case and is curated inside the position-effect hypothesis where the reasoning can be stated, rather than typed CAUSATIVE in a genetic block.

    A named 14q32.33 candidate was deliberately not asserted. The report identifies the IGH locus as the likely basis of the infection susceptibility and PACS2 as an epilepsy candidate. Both are attractive and IGH would upgrade the 14q32 node from unnamed dosage loss to a specific lesion, but no cached source makes that claim about ring 14 patients, so both are recorded in the entry notes as leads rather than curated.

    Phenotype frequencies come from the HPO disease annotation for ORPHA:1440, which carries Orphanet's own curated frequency classes rather than raw patient counts, so those classes map onto FrequencyEnum directly. Provenance is recorded in notes rather than a manufactured quote, since HPOA is a derived annotation. The Orphanet bulk XML was not downloaded to build an ORPHA reference-cache entry, because doing so would have added manifest churn unrelated to this curation.

    Three knowledge gaps are recorded: the unexplained route from the ring to cortical hyperexcitability, the fact that FOXG1 expression has never been measured in a classical ring 14 patient, and the absence of any correlation between degree of ring instability and phenotype severity. The second carries a proposed experiment.

    Validated with just validate-disorders, just validate-terms, just count-verified-snippets (46/46), just check-entity-refs and just check-duplicate-keys. Compliance 85.4 percent.

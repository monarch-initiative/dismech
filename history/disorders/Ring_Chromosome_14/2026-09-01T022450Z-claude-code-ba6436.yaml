  details: |
    Rebasing onto current main picked up tests/test_causal_targets.py, which did not exist when this branch was cut, and it failed. Two downstream edges pointing at the Recurrent infections phenotype were written as phenotypes#Recurrent infections, one from Terminal 14q32 Haploinsufficiency and one from Aberrant IgG N-Glycosylation. downstream.target holds a bare node name matched verbatim against another item's name, so both pointed at nothing while the entry validated and the page rendered; the renderer would have drawn a phantom duplicate node and dropped the real one. check-entity-refs passes the prefixed form because it is valid entity-reference syntax in attaches_to, which is why nothing already on this branch caught it. Both stripped to bare names. This is the same defect found on the sibling Hyperostosis Cranialis Interna branch in the same rebase, and it is the IgG glycosylation arm of this entry that was disconnected by it. Validated: schema clean, 71/71 snippets, check_causal_targets exit 0, tests/test_data.py and tests/test_causal_targets.py 47206 passed.

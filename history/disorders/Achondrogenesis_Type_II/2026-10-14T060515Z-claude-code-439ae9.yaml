  summary: 'Re-curate: Achondrogenesis Type II'
  details: |
    Re-curated against new deep research (Perplexity, 2026-10-14; preflight-dr PASS, 7/7 references resolved; its term suggestions were not used because 22 of 57 labels mismatched). Falcon could not be run (Edison authentication failed with a 503). Added an ER-stress branch to the pathograph: mutant procollagen retention leads to rough-ER dilation (human ACG2 Gly691Arg case PMID:7757081, achondrogenesis-hypochondrogenesis case PMID:3057886, hypochondrogenesis PMID:1429602) and, in Col2a1 mice only, to UPR activation and premature chondrocyte apoptosis that disrupts the growth plate (PMID:24475193, PMID:1946380); these mouse-derived nodes are labelled as such. Added a craniofacial cartilage-growth node from the Gly85Cys transgenic mouse (PMID:8227287) that connects cleft palate, Pierre-Robin sequence, midface retrusion and prominent forehead, with human ACG2 support from a confirmed fetus (PMID:34573377). Added four Col2a1 animal models with typed mechanism links and zygosity/dosage limitations (Gly85Cys transgenic, Gly1170Ser knock-in, human minigene in-frame deletion, null), and the COL2A1 p.G1113C iPSC line as an unlinked experimental model. Added a ClinGen DEFINITIVE gene_disease_validity record, exon-21-skipping and C-propeptide variant classes, a dilated-RER histopathology finding, and a radiographic caveat that skull ossification can be defective in confirmed cases (PMID:31392067). Tagged the GeneReviews Type II Collagen Disorders Overview (PMID:31021589); its PubMed record has no quotable clinical text. Hydrops, cystic hygroma, edema, polyhydramnios and pulmonary hypertension remain without causal edges because the sources do not state a mechanism. Validated with just validate-disorders (131/131 snippets), validate-terms, check-entity-refs, check-causal-targets and the snippet gates.

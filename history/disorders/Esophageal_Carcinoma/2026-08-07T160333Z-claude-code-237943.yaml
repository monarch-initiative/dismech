  summary: Route exposures to the squamous and adenocarcinoma arms separately
  details: |
    Backfill for issue #8085. This entry models two histologies with separate pathways and the four exposures split cleanly between them. Tobacco smoking is TRIGGERS/DIRECT and alcohol consumption TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into the squamous transformation node; alcohol is indirect because ethanol is not itself the carcinogen, being oxidised to acetaldehyde which forms DNA adducts, and that intermediate is why ALDH2 variants raise risk. Chronic gastroesophageal reflux disease is TRIGGERS/DIRECT into the Barrett metaplasia to adenocarcinoma sequence, and Western lifestyle and obesity is PREDISPOSES into the same node. Routing all four onto one node would have erased the histological distinction the entry exists to model. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 36 of 36 verified; integrity issue count unchanged.

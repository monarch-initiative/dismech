  summary: 'Create: intellectual disability, autosomal dominant 6'
  details: |
    De-novo curation of MRD6 (MONDO:0013509, GRIN2B hgnc:4586) as the non-encephalopathic arm of the GRIN2B allelic series, resolving claim issue 11066 and deleting the stub. Lump/split decision: curated as DISEASE, not SUBTYPE - distinct MONDO/OMIM identities (613970 vs 616139), separable ID-without-encephalopathy presentation, LOF-leaning mechanism (deletions/truncating/hypomorphic missense) vs the GOF-enriched DEE27 sibling, and opposite mechanism-directed therapy direction; the separability caveat is recorded as an open KNOWLEDGE_GAP discussion and in entry notes. Six-node pathophysiology chain with four nodes conforming (partially, per module notes) to nmda_receptor_hypofunction; the module BDNF arm is deliberately not reproduced for lack of GRIN2B-specific evidence. Deep research: Edison was requested but the provider slug is falcon in this checkout; falcon returned HTTP 402 (out of credits), so the run used the recorded --fallback mechanism and claude_code produced the report (research/Intellectual_Disability_Autosomal_Dominant_6-deep-research-claude_code.md, fell_back/requested_provider recorded in frontmatter). preflight-dr returned SKIP (MONDO records no causal gene for MONDO:0013509); manual check confirmed identity (OMIM 613970 in report, GRIN2B=41 mentions, no gene drift). The report's one unresolved reference (DOI:10.1016/j.ymgme.2023.107673) was not cited, and neither was its off-topic-flagged PMID:8789948 (Grin2b homozygous-null mouse; the heterozygous Grin2b+/- model from PMID:40024627 was used instead as the better match for a dominant haploinsufficiency disorder). Evidence: 40/40 snippets verified against references_cache (PMIDs 20890276, 23718928, 23918416, 27818011, 28377535 sibling-shared, 29851452 GeneReviews tagged, 29937144, 35741674, 36704660, 40024627, 41146259); mixed-source PMID:40024627 split into IN_VITRO/MODEL_ORGANISM/HUMAN_CLINICAL items per grading rules. Validation: just validate PASS, count-verified-snippets 40/40, validate-terms PASS, check-duplicate-keys/entity-refs/causal-targets/qualifier-terms/enum-values PASS, check-folded-hyphens/snippet-length/title-snippets/snippet-grading PASS (one short snippet fixed during the loop), validate-disorders run once at the end.

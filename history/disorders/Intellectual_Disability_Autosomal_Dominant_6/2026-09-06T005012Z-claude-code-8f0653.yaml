  summary: 'Red-team review round: evidence, prevalence semantics, phenotypes, treatments'
  details: |
    Pre-merge red-team review round on PR 11158, folded into one push. Evidence: added the countervailing single-null-allele result from PMID:35741674 as a REFUTE item beside the double-null SUPPORT item it qualifies, and graded the latter directness INDIRECT (measured in a GluN2A/GluN2B double-null background, not the heterozygous disease state). Cited Platzer 2017 (PMID:28377535), previously uncited despite being the canonical 86-patient GRIN2B cohort, for the missense-clustering claim. Prevalence: the two cohort-share records asserted prevalence_class ABOVE_1_IN_1000 with rate_per_100000 750/200, which reads as a general-population rarity tier and overstated MRD6 occurrence by roughly three orders of magnitude; prevalence_class is now UNKNOWN on both with the diagnostic-yield denominator stated, and a third record carries the honest general-population position (NOT_YET_DOCUMENTED). The Lopez-Rivera 5.91/100000 birth-incidence figure remains uncited because it lives in a supplementary table absent from the retrievable text of PMID:32168371. Phenotypes: added movement disorder, cerebral visual impairment, spasticity and feeding difficulties; microcephaly and malformation of cortical development deliberately NOT added, with the gain-of-function-enrichment reasoning recorded in notes. Treatments: added L-serine supplementation (PMID:38380699) and antiseizure medication; memantine and radiprodil deliberately left to the DEE27 sibling because blocking an already-hypofunctional receptor is the wrong direction for this arm. Added clinical_trials NCT04646447 (L-serine phase 2A, loss-of-function GRIN variants); NCT05818943 not added because it enrolls gain-of-function variants only. Structure: split the bundled differentiation/dendrite node into two, added an Altered Excitatory Circuit Function node wiring the behavioral cluster and seizures into the pathograph, and recorded in notes which phenotypes remain deliberately unwired. Also added expressivity VARIABLE, evidenced the radiprodil and transmembrane-clustering differential bullets, cited the load-bearing calcium-to-plasticity edge that short-cuts the module BDNF arm, and reworded the spermine explanation which had overstated a wild-type-and-mutant result as loss-of-function-specific. ClinGen dosage record CGDS:HGNC_4586 was NOT added: the refresh fails on upstream checksum drift and repinning the manifest is a separate change. Branch rebased onto origin/main (conflict in cache/mondo/terms.csv resolved by keeping both new CURIE rows in order). Validation on the rebased tree: validate PASS 55/55 snippets, validate-disorders PASS 55/55, check-entity-refs/causal-targets/enum-values/duplicate-keys/qualifier-terms PASS, snippet-length/snippet-grading/title-snippets/folded-hyphens PASS after fixing one folded-scalar hyphen split introduced this round.

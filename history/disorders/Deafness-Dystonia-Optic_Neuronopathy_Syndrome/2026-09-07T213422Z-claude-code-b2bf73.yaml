  summary: 'Review round: correct a false prevalence note, put the 50% recurrence
    risk on GeneReviews'
  details: |
    Post-approval round on PR #11393. The reviewer approved with no blocking findings and four optional suggestions; this round takes two of them and fixes a defect of my own that the suggestions surfaced.

    The defect: prevalence.notes claimed the diagnostic-yield figure from the auditory-neuropathy sequencing cohort "is recorded on the diagnosis section instead". It was not recorded anywhere in the entry, and checking the cache showed why - the 3/168 figure and the 1.8% derived from it appear only in the deep-research report, not in the cached abstract of PMID:30634948, so the figure was never quotable in the first place. That is prose making a false claim about the entry's own contents, which is the failure mode CLAUDE.md warns about under "prose describing repository state is content, and it rots". The note now says the figure exists in the report, is absent from the cached abstract, is therefore not curated here, and that the diagnosis section quotes the cohort finding qualitatively.

    Reviewer suggestion 1 taken: the Genetic Counseling treatment asserted a 50% per-pregnancy recurrence risk and the availability of prenatal and preimplantation testing, but cited only PMID:37325222's weaker "Recurrence risk is high for female carriers". Both exact GeneReviews sentences were already in references_cache/PMID_20301395.md and are now quoted, so the quantitative claim sits on the source that actually makes it. The case-report item is kept alongside rather than replaced, since it supports counseling as a management component.

    Reviewer suggestion 2 taken: the surveillance described on Supportive and Multidisciplinary Care was asserted without a quoted source. The GeneReviews surveillance sentence is now quoted.

    Reviewer suggestion 3 not taken, and the reason is the defect above: the figure is not quotable from any cached reference, so there is nothing to put on the diagnosis node. The corrected prevalence note now says this explicitly rather than pointing at a figure that is not there.

    Reviewer suggestion 4 not taken. The reviewer identified it as non-blocking on the grounds that none of the four items (peripheral sensory neuropathy, recurrent aspiration pneumonia, the STAM1 trafficking role, symptomatic dystonia pharmacotherapy) has a quotable exact snippet in a cached reference, and that the research itself labels the dystonia drugs "not MTS-specific". I agree; adding them would mean either fetching new references for claims the entry does not need or writing unsourced content.

    This push costs the existing approval, since main has dismiss_stale_reviews enabled. That was weighed: the entry carried a statement that was factually wrong about itself and would otherwise have merged that way, and the two citation improvements ride along in the same push rather than as a separate chore commit.

    Validation after the change: just validate and just validate-disorders both pass, 78/78 snippets verified (up from 75/75). check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens and check-reference-titles all OK. No new references were fetched; every snippet added here comes from PMID_20301395.md, which was already committed.
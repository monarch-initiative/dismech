  summary: 'Review round 2: separate transmission risk from risk of an affected child'
  details: |
    Second review round on PR #11393, taking both remaining optional wording notes. The reviewer marked each non-blocking and called the second "defensible as written"; I took them anyway because one is a clinical accuracy issue rather than style.

    Genetic Counseling: the description said "recurrence risk is 50% per pregnancy". GeneReviews, now quoted on the same treatment, says the 50% is the chance of transmitting the genetic alteration. Those are different numbers in an X-linked condition. Sons who inherit the variant are affected; daughters who inherit it are heterozygotes who, in this disease, may have only mild hearing impairment and focal dystonia. "Recurrence risk" in genetic counseling conventionally means the risk of an affected child, so the flat 50% overstated it roughly twofold for a classically affected child. The description now states the transmission figure and spells out the sex difference instead of collapsing them.

    Supportive and Multidisciplinary Care: the description claimed surveillance "across audiology, ophthalmology, and neurology", but the GeneReviews surveillance sentence quoted on that treatment covers neurologic, developmental, speech-language and vision assessment plus physical and occupational therapy review, and does not mention audiology. The description reached one item past its source. It now names what the quote covers and says explicitly that audiologic follow-up is standard practice in a disease presenting with hearing loss but is not part of the GeneReviews recommendation and is not claimed as one.

    No evidence items, terms, references or pathograph edges changed in this round; both edits are description prose being brought back in line with the sources already cited beneath them. Snippet count is unchanged at 78/78.

    Validation: just validate and just validate-disorders pass with 78/78 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-title-snippets and check-folded-hyphens all OK.
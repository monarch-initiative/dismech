  summary: 'Create: Deafness-Dystonia-Optic Neuronopathy Syndrome'
  details: |
    New entry created from the stubs/ queue under claim issue #11025. The stub is deleted in the same PR.

    Deep research: one run, provider claude_code (research/Deafness-Dystonia-Optic_Neuronopathy_Syndrome-deep-research-claude_code.md). No other provider was reachable in this environment: EDISON_API_KEY, FUTUREHOUSE_API_KEY, ASTA_API_KEY, OPENSCIENTIST_API_KEY, PERPLEXITY_API_KEY and OPENAI_API_KEY were all unset, and claude_code auto-enables from the claude CLI on PATH. The report's reference validation came back 22/22 verified, confabulation_rate 0.0, no unresolved references. Its term validation set needs_review true and named two mislabelled UBERON bindings, which were NOT used: UBERON:0001846 is internal ear, not spiral ganglion, and UBERON:0009713 is endocardium of left ventricle, not vestibular ganglion. The spiral ganglion concept was bound instead to CL:0011113 (spiral ganglion neuron), verified via OLS.

    GeneReviews baseline: PMID:20301395 was found, fetched, tagged GeneReviews in the top-level references block, and used as the phenotype baseline. Every phenotype in its Clinical Characteristics paragraph is curated (hearing impairment, dystonia/ataxia, optic atrophy, dementia, psychiatric symptoms), plus dysphagia from PMID:37325222. Its management statement that "Because auditory neuronopathy is the cause of the hearing loss, hearing aids have only variable success" is quoted on the cochlear implantation treatment. That is the organizing idea of the entry: the treatment expectation follows from the retrocochlear lesion in the pathograph rather than sitting beside it.

    Pathophysiology is a five-node causal chain with cited downstream edges: TIMM8A loss of function -> TIM8-TIM13 complex assembly failure -> impaired intermembrane-space escort of hydrophobic precursors -> neuronal mitochondrial dysfunction -> selective neurodegeneration, fanning out to the four clinical phenotypes.

    A substantive negative result is curated rather than smoothed over. The Timm8a1 I23fs49X mouse (PMID:32820032) reproduces hearing impairment and cognitive deficit but explicitly did NOT show the Tim23/Tom40 import defect or any oxidative-phosphorylation biogenesis defect. That is recorded as a FAILS_TO_RECAPITULATE modeled_mechanisms link carrying supports REFUTE evidence against the import node, and as a HUMAN_MODEL_MISMATCH discussion with a proposed experiment to assay TIM23 in patient iPSC-derived neurons. PMID:40075073 independently calls the human cross-membrane transport mechanism controversial, so the entry carries both readings instead of asserting the textbook one.

    Two references beyond the report's narrative were added after reading the cache the report's own validation had populated, and both change a claim. PMID:31682224 shows hTim8a is required for complex IV assembly specifically in neurons via COX17, with the resulting oxidative stress priming cells for apoptosis. That is the neuron-selectivity step; without it the entry asserted a neuronal disease from a ubiquitously expressed chaperone with no cited bridge. PMID:36090790 is the correct primary source for the reduced hippocampal mitochondrial size and the Mtfp1/Mtp18 upregulation. The deep-research report attributed that finding to PMID:32820032, which is the earlier paper in the same series and does not report it; the readout is cited to PMID:36090790 accordingly.

    Two ontology label corrections, both caught before binding. HP:0011971 is Dermatographic urticaria, not Auditory neuropathy as assumed on the first pass; HPO has no auditory neuropathy term, so HP:0000407 Sensorineural hearing impairment is bound with the specificity carried in preferred_term. HP:0000708 is Atypical behavior, not Behavioral abnormality as the report labelled it.

    Secondary-citation defect found and fixed during self-review, before any PR. The cochlear/vestibular ganglion loss was first cited to PMID:40075073, but that sentence sits in the iPSC paper's introduction summarizing its own reference [8] - it is not that paper's finding. It was replaced with the primary temporal-bone sources, PMID:11449109 (single case: near-complete spiral ganglion loss, only 8.5% of age-normal cells remaining, with the organ of Corti including hair cells preserved) and PMID:17471106 (four members of one Norwegian family: 90-95% cochlear and 75-85% vestibular neuron loss). This matters beyond citation hygiene: the hair-cell-sparing observation in PMID:11449109 is the direct evidence that the lesion is retrocochlear, which is the claim the whole entry, and its treatment reasoning, rests on. Both papers' auditory-neuropathy conclusions were also added to the hearing phenotype.


    Adversarial self-review before opening the PR (a subagent with fresh context, per the curate skill's red-team step) found several things the validators cannot see, all fixed in this same commit rather than deferred.

    An exact-quote violation that no gate catches: a folded YAML scalar wrapped "97-amino acid" as "97\n-amino acid", which resolves to "97 -amino acid" and is not a substring of the source. check_folded_hyphens.py only matches a hyphen at the END of a folded line (EOL_HYPHEN_RE = [A-Za-z0-9]-$), so the mirror-image case of a leading hyphen on the next line passes it. The snippet was rewrapped. The checker gap is real and worth its own issue; it is not fixed here.

    A secondary-citation defect, described above, where the cochlear ganglion loss was cited to an iPSC paper's introduction. Replaced with PMID:11449109 and PMID:17471106.

    An anatomical error in the cochlear-implant treatment. The entry had said an implant "stimulating distal to the loss cannot bypass" the spiral ganglion lesion. That is backwards: an implant bypasses the hair cells and stimulates the spiral ganglion neurons directly, so in DDON its target population is precisely the one that has degenerated. Rewritten, and evidenced with the 8.5%-of-normal spiral ganglion count from PMID:11449109 plus a documented implantation from PMID:31903733, because the only prior evidence was a GeneReviews sentence about hearing aids.

    The HUMAN_MODEL_MISMATCH was reframed. It had been written as a human-versus-mouse species gap. Reading the primary literature shows the disagreement is already inside human patient cells: patient lymphoblasts show an import defect and decreased NADH (PMID:15254020), while patient fibroblasts and RNAi knockdown show no effect on respiration or membrane potential and frame the TIM23 account as a proposal (PMID:21984432); the mouse then sides with the negative. Both primaries were fetched and cited, the import node now carries REFUTE items alongside its SUPPORT items, and the discussion rationale states the contest and notes that every result on either side comes from a cell type the disease spares. Two alternative accounts that do not require TIM23 depletion are named: neuron-specific complex IV assembly via COX17 (PMID:31682224) and loss of the citrin/aralar1 carriers (PMID:15254020).

    A false causal edge was removed: Auditory Neuropathy had Dysphagia as a sequela, asserting the hearing deficit causes the swallowing deficit. It does not. A Corticospinal and Bulbar Involvement node was added to carry it, evidenced from the original DFN-1 description and the case report's spasticity findings, and the orphan phenotypes (ataxia, the psychiatric features) were wired into the neurodegeneration node.

    The bundled Neuronal Mitochondrial Dysfunction node was split, per the single-scale discipline, into Mitochondrial Morphology and Dynamics Disturbance and Neuronal Bioenergetic Failure. The split exposed a three-way direction conflict that the bundle had hidden: fibroblasts and knockdown HeLa elongate, patient iPSC neurons fragment, and mouse hippocampal mitochondria shrink with upregulated Mtfp1. The node is scoped to dysregulated dynamics and says so, and the mouse link's limitations warn against reading the murine direction as the human one. The mouse link became RECAPITULATES against the morphology node instead of PARTIALLY_RECAPITULATES against the bundle.

    Terms: the psychiatric phenotype was split from the enum-root HP:0000708 Atypical behavior into HP:0000751 Personality changes and HP:0011999 Paranoia, both of which exist and both of which the GeneReviews sentence names. CL:1001474 medium spiny neuron was removed as an unsupported specificity leap, since the neuropathology resolves only to basal ganglia and striatum. GO:0045041 was dropped from the escort node as the wrong direction (import INTO the IMS is upstream of what this complex does; GO:0045039 is retained).

    Also added: prevalence (CASES_IN_LITERATURE / ULTRA_RARE, with a note that no numeric rate is asserted because the case counts are not in a cached abstract), a four-phase progression block, onset categories, a REFUTE item and prose softening for penetrance from PMID:40597358 (a hemizygous adolescent with dystonia and no hearing loss), the basal ganglia iron phenotype from the same case, primary deletion-architecture evidence from PMID:36056138, vestibular-sparing evidence, and a preclinical-only vitamin E entry marked as a cell-culture lead rather than a therapy. The FAILS_TO_RECAPITULATE link's evidence was flipped from REFUTE to SUPPORT: the quote establishes the failure the link asserts, so it supports the link while contradicting the import account.


  summary: 'Create: Familial Erythrocytosis 4'
  details: |
    Deep-research report used: research/Familial_Erythrocytosis_4-deep-research-openscientist.md (OpenScientist, 15 references, all resolved, confabulation_rate 0.0, needs_review true). Taken from it and independently verified against the reference cache: the four P531-proximal germline variants D525G, L526F, G527K and A530S plus the germline/somatic residue overlap at A530S and Y532C (PMID:36700397, snippets re-quoted from the cached abstract); the JAK2-exclusion-first diagnostic step, the hereditary-erythrocytosis differential, and the management statements on phlebotomy, cytoreduction avoidance, low-dose aspirin and the unsettled role of HIF2A inhibitors (PMID:41123216, newly fetched); the hydroxylation-escape and nuclear-translocation mechanism sentence (PMID:39426935); the oxygen-sensing nosology sentence placing EPAS1 gain of function beside VHL and EGLN1 loss of function (PMID:33840141); the germline exon-9 F374Y case, recorded in genetic notes with its own evidence (PMID:23090011); and ischemic stroke as a phenotype, wired as a sequela of Thromboembolism (PMID:40879399, PMID:36700397). Rejected from the report: its suggested HP:0003573 for elevated erythropoietin, which is Increased total bilirubin (the report's own term-validation section flags it, and HP:0033644 is the right term, already bound); NCIT:C15843 labelled "Therapeutic Phlebotomy", which is Preventive Intervention, and NCIT:C156989 labelled "Belzutifan", which is a questionnaire item, both flagged by the same section (NCIT:C28221 Phlebotomy and the CHEBI belzutifan binding were kept); obsolete GO:0061418; the off-topic iron-crosstalk reference PMID:35618957 and the iron-axis material from PMID:28263291, which is about physiological EPO regulation rather than this disease; a headache phenotype, which the report tabulates with no citation supporting it in ECYT4; and the whole Pacak-Zhuang/mosaic branch (PMID:37450881, 31091718, 31185588, 31876943, 41518596, 22931260, 27659016), which belongs to the separate mosaic entity. The report's flagged unsupported quote, "role remains unclear" from PMID:41123216, is in fact present in that abstract as "the role of HIF2A inhibitors remains unclear" and verifies against the local cache, so the flag is a false negative in the report's own quote matcher. Disease identity was checked by hand rather than with just preflight-dr, which refuses without the 1.3 GB local MONDO build: the report names EPAS1/HIF2A throughout, cites MONDO:0012729 and OMIM 611783, and names no rival causal gene. Also added in this pass: GO:0000981 as the HIF-2-alpha molecular function on the gene-bearing node (a real EPAS1 annotation, checked against QuickGO for UniProt Q99814), which clears this entry from check-gene-activity-grounding.

    De novo curation of ECYT4 (autosomal dominant congenital secondary erythrocytosis from germline gain-of-function EPAS1/HIF2A missense variants near Pro531). Curated from primary literature: Percy 2008 NEJM (PMID:18184961, first HIF2A GOF variant G537W), Percy 2008 Blood exon-12 cohort (PMID:18378852, M535V/G537R, elevated EPO), Percy 2008 Ulster Med J (PMID:18711622, index proband Hb/Hct), Furlow 2009 JBC (PMID:19208626, impaired degradation/stabilization across alleles), van Wijk 2013 (PMID:23716564, erythroid progenitor phenotype), Formenti 2011 (PMID:21389259, human HIF-2a GOF pulmonary hypertension), Tan 2013 (PMID:23640890, G536W knock-in mouse erythrocytosis+PH), Gharib/European collection 2023 (PMID:36700397, 41-patient cohort: PAH, thrombosis, belzutifan eligibility), Giani/Bulgarian family (PMID:27292716, phlebotomy+anticoagulant management), Lee 2019 review (PMID:31350093, autosomal dominant/ECYT4), belzutifan case (PMID:40879399). Five pathophysiology nodes: the EPAS1 variant, HIF-2a stabilization, inappropriate EPO transcription and erythroid progenitor expansion form the core chain, plus a pulmonary vascular remodeling node conforming to the pulmonary_vascular_remodeling module; all phenotypes are downstream targets. 37/37 snippets verified after the second pass. Rejected/not used: Gale 2008 Blood (PMID:18650473) abstract empty in cache; Pacak-Zhuang/mosaic EPAS1 papers (distinct somatic-mosaic entity, kept separate). Second pass integrated the OpenScientist report as described above; snippet count rose from 24 to 37. Validation: just validate, validate-terms, count-verified-snippets (37/37), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-qualifier-terms, check-coarse-phenotypes, check-genereviews (NO_CHAPTER, no GeneReviews chapter for germline ECYT4), and validate-disorders all pass.

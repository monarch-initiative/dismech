  summary: 'Create: Familial Erythrocytosis 4'
  details: |
    De novo curation of ECYT4 (autosomal dominant congenital secondary erythrocytosis from germline gain-of-function EPAS1/HIF2A missense variants near Pro531). Curated from primary literature: Percy 2008 NEJM (PMID:18184961, first HIF2A GOF variant G537W), Percy 2008 Blood exon-12 cohort (PMID:18378852, M535V/G537R, elevated EPO), Percy 2008 Ulster Med J (PMID:18711622, index proband Hb/Hct), Furlow 2009 JBC (PMID:19208626, impaired degradation/stabilization across alleles), van Wijk 2013 (PMID:23716564, erythroid progenitor phenotype), Formenti 2011 (PMID:21389259, human HIF-2a GOF pulmonary hypertension), Tan 2013 (PMID:23640890, G536W knock-in mouse erythrocytosis+PH), Gharib/European collection 2023 (PMID:36700397, 41-patient cohort: PAH, thrombosis, belzutifan eligibility), Giani/Bulgarian family (PMID:27292716, phlebotomy+anticoagulant management), Lee 2019 review (PMID:31350093, autosomal dominant/ECYT4), belzutifan case (PMID:40879399). Six pathophysiology nodes form the PHD2->HIF-2a->EPO->erythroid chain plus a pulmonary vascular remodeling node conforming to pulmonary_vascular_remodeling module; all 6 phenotypes are downstream targets. 24/24 snippets verified. Rejected/not used: Gale 2008 Blood (PMID:18650473) abstract empty in cache; Pacak-Zhuang/mosaic EPAS1 papers (distinct somatic-mosaic entity, kept separate). Deep-research openscientist report was still running and not available at curation time (agentapi not found in PATH per dr.log); to be integrated on resume. Validation: just validate, validate-terms, count-verified-snippets (24/24), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-qualifier-terms, check-coarse-phenotypes, check-genereviews (NO_CHAPTER, no GeneReviews chapter for germline ECYT4), and validate-disorders all pass.

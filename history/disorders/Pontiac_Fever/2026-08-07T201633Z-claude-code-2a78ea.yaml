  summary: Link water-system reservoir and amplification to aerosol exposure
  details: |
    Backfill for issue #8085. All three exposures feed the single aerosolized-exposure node, and the grading separates the reservoir from the conditions that amplify it. Engineered aquatic reservoirs is PREDISPOSES with DIRECT and supports SUPPORT: drinking water systems, whirlpools, and cooling towers are named in the snippet and are the same systems that generate the aerosols at the node, so nothing intervenes, but a reservoir does not itself aerosolize anything and so is not recorded as triggering. Biofilm-associated amplification and warm, stagnant, sediment-containing systems are both PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES and supports PARTIAL, graded identically because they share the same limitation: each source documents amplification of the organism, and the step from water-system load to inhaled dose is understood but not measured. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 49 of 49 verified.

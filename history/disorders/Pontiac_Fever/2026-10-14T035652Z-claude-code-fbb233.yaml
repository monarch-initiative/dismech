  summary: Bind the L. pneumophila antibody test as a LOINC measurement
  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and measurements: LOINC:7947-5 (Legionella pneumophila Ab [Presence] in Serum) to the Legionella testing and environmental source confirmation row. Applying the carry-over lesson from the Bubonic_Plague review on batch 12: this row bundles serology, culture, DFA, PCR, and environmental water testing, but only the patient serology arm is coded (the row's own cited evidence describes seroconversion to a serogroup 6 isolate; the species-level, serogroup-unspecified code was used rather than a serogroup-6-specific one, since the row does not assert serogroup 6 as the general test). Added a sentence to the row's description naming which part is coded and which parts (culture, DFA, PCR, environmental water testing) are not, in the entry itself rather than only in this record. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch13 (LOINC_DIAGNOSTICS.md tranche B).

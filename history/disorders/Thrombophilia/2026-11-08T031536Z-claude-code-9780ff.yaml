  summary: Add SERPIND1 heparin cofactor II deficiency subtype
  details: |
    Follow-up to #12931 (deferred parents from #12893). Added the Heparin Cofactor II Deficiency subtype bound to MONDO:0012876, a SERPIND1 loss-of-thrombin-inhibition mechanism node wired to the coagulation cascade node, and a SERPIND1 genetic record carrying the ClinGen Definitive (AD) assertion. Evidence includes both supporting family reports (PMID:2863445, PMID:8902986) and refuting or limiting studies (PMID:3603411, PMID:10494755, PMID:15337701), because the deficiency's standalone thrombotic risk is contested. THBD (MONDO:0013775) was not added: MONDO and ClinGen now label it a thrombomodulin-related bleeding disorder, so it does not belong as a thrombophilia subtype without a scope decision. F8 (MONDO:0859082) left for a separate pass. Validated with just validate, validate-terms, count-verified-snippets (101/101) and the KB gates.

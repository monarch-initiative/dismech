  summary: Add X-linked F8 duplication thrombophilia subtype; record THBD scope decision
  details: |
    Added the X-linked thrombophilia due to factor VIII defect subtype (MONDO:0859082), deferred by #12893 and tracked in #12931. Sources: PMID:33275657 (factor VIII Padua, 23.4-kb F8 partial duplication in two Italian founder families) and PMID:42712804 (229-kb whole-gene F8 duplication in a Chinese family, full text). Added a factor VIII overexpression mechanism node (GO:0008047 enzyme activator activity, INCREASED) linked to the shared coagulation-activation node, and an F8 genetic record typed UNKNOWN because ClinGen has not classified F8 for thrombophilia. THBD (MONDO:0013775) left out as a subtype: MONDO and ClinGen now define that disease as a bleeding disorder; recorded in notes. Validated with just validate, validate-terms, validate-disorders and count-verified-snippets (111/111).

  summary: 'Thrombophilia: bind PROC AD/AR child subtypes and add X-linked F9 (factor
    IX Padua) subtype'
  details: |
    Deferred work from PR #12893 (issue #12253), tracked on #12931. Added Protein C Deficiency AD (MONDO:0008316) and AR (MONDO:0012860) as subtype rows listed under children of the existing Protein C Deficiency row (MONDO:0019145, their MONDO parent). Added X-linked F9 Thrombophilia (MONDO:0010432) with F9 (hgnc:3551), a new Factor IX Gain-of-Function Hyperactivity node (GO:0004252 INCREASED, germline GAIN_OF_FUNCTION context) feeding the shared coagulation-activation node, and an F9 genetic record typed UNKNOWN with the ClinGen Limited XL assertion copied into gene_disease_validity. Evidence: PMID:19846852 (factor IX Padua), PMID:32079698 (factor IX Shanghai), the ClinGen CGGV record. Not done: F8 (MONDO:0859082), SERPIND1 (MONDO:0012876), THBD (MONDO:0013775), each needing its own literature judgement. Validated with just validate, validate-terms, count-verified-snippets (91/91) and the KB gates.

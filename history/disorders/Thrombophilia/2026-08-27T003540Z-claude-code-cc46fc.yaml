  details: |
    Created a new dismech entry for thrombophilia, MONDO:0002305, resolving issue #9545, CURATE_ROOT_WITH_SUBTYPES. Modeled the root disease plus five classic hereditary subtypes via has_subtypes: factor V Leiden thrombophilia / activated protein C resistance MONDO:0008560 F5, prothrombin G20210A thrombophilia MONDO:0008559 F2, antithrombin III deficiency MONDO:0013144 SERPINC1, protein C deficiency MONDO:0019145 PROC, and protein S deficiency MONDO:0019144 PROS1. Pathophysiology models each subtype molecular lesion as a trigger node converging on a shared Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation node, which conforms_to thrombogenesis#Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation; downstream nodes conform to thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation and thrombogenesis#Venous Thrombus Embolization to Pulmonary Arteries. A dedicated Warfarin-Induced Transient Anticoagulant Depletion node, protein C and protein S subtypes, captures the paradoxical warfarin skin necrosis mechanism. Acquired antiphospholipid-antibody-mediated thrombophilia is explicitly cross-referenced to, not duplicated from, Antiphospholipid_Syndrome.yaml. Curated phenotypes DVT, PE, recurrent VTE, cerebral venous sinus thrombosis, subtype-specific lab findings, recurrent pregnancy loss, warfarin-induced skin necrosis, neonatal purpura fulminans; genetics F5, F2, SERPINC1, PROC, PROS1 with CAUSATIVE relationship and autosomal dominant incomplete-penetrance inheritance; environmental exposures oral contraceptive and HRT use, EXACERBATES; one animal model, platelet-specific Pros1 knockout mouse, Calzavarini et al 2020, PARTIALLY_RECAPITULATES; and treatments, heparin-bridged anticoagulation, long-term oral anticoagulation and DOACs, antithrombin concentrate replacement therapy, plus structured per-subtype prevalence records. Deep research: falcon Edison Scientific provider, research/Thrombophilia-deep-research-falcon.md, reference_validation 9 of 9 resolved, 0 off-topic. NEC preflight just preflight-dr returned SKIP because MONDO:0002305 records no single causal gene, expected for this heterogeneous umbrella term; manual review of the report's gene-frequency table F2=17 F5=12 PROC=12 PROS1=12 SERPINC1=9 confirmed it discusses exactly the five expected classic thrombophilia genes with no rival-disease gene dominating, and the report's own Identifiers section correctly cites MONDO:0002305, so no NEC concern. All evidence PMIDs and DOIs fetched via just fetch-reference, never hand-written. Validation: just validate passed, schema plus terms plus references, 59 of 64 snippets verified against cached references, 5 skipped by prefix for DOI references; just count-verified-snippets separately confirmed the same 59 of 64; just validate-terms passed; just check-duplicate-keys passed; just validate-disorders batched pre-PR sweep passed.

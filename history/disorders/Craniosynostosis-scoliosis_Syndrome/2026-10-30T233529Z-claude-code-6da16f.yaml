  summary: 'Create: Craniosynostosis-Scoliosis Syndrome'
  details: |
    New entry for craniosynostosis-scoliosis syndrome (MONDO:0980974), the DHRS3 retinoic acid embryopathy. entry_type decided as DISEASE: a single gene-defined Mendelian syndrome with its own MONDO and OMIM (621499) terms, not a grouping or subtype of an existing entry. The phenotype comes from the defining report (PMID:40519748, full text cached) and is restricted to the five homozygotes carrying the two alleles the authors classify pathogenic (promoter/5'-UTR deletion; p.Val171Met); the three other homozygous missense variants (likely benign or VUS) are described in notes only. Pathograph: DHRS3 reductase deficiency, excess RA synthesis, increased RAR signalling, then three arms: coronal suture osteogenic acceleration to premature fusion (conforms to the cranial_suture_premature_fusion module at its two convergent nodes), cardiac septation defect, and axial skeletal patterning defect. Mouse Dhrs3-null evidence (PMID:24005908, 29806219 and the mouse figures in 40519748) is graded MODEL_ORGANISM; RA-to-suture-osteogenesis evidence is from exogenous-RA suture models (PMID:20134361 IN_VITRO, 30392121) and the Fgfr2IIIc RA paper (PMID:42604930), marked INDIRECT. The scoliosis edge is UNKNOWN and carries a knowledge gap because no spinal imaging is reported. Deep research: one OpenScientist report (no fallback); 14/14 references resolved, preflight-dr PASS. It overstated the cohort (presented all five variants as causal), cited a gene alias CRSS that HGNC does not list, and grounded scoliosis in general somitogenesis papers (PMID:19651306, 24284210) that were not used. Its RA-suture leads 20134361 and 30392121 were used. Validated with just validate, validate-terms, count-verified-snippets (all verified), the per-file offline gates, snippet grading/length/title gates and validate-disorders.

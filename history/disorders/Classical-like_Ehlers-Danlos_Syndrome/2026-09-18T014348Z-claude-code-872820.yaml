  summary: Literature refresh + pathograph completeness fix for Classical-like EDS
    type 2 (clEDS-2/AEBP1)
  details: |
    Task requested curating 'Classical-like EDS type 2', which like the prior 'type 1' task is not a new disease: clEDS-2 (AEBP1) is already curated as has_subtypes[1] of this entry. Per the duplicate-preflight rule, did not create a second file; treated as an ongoing-curation/augmentation task, mirroring the type-1 session immediately before this one.

    A targeted PubMed search for AEBP1/clEDS-2 literature published since the original curation (whose newest source was the 2023 '11th patient' comprehensive review, PMID:37214418) surfaced two genuinely new, on-topic 2026 papers, filtering out several AEBP1-in-cancer/fibrosis hits as Named Entity Confusion: PMID:42191857 (16th reported clEDS-2 case, a novel AEBP1 splice-site variant with experimentally validated exon-12 skipping, and recurrent bowel perforation over a 20-year follow-up) and PMID:41231548 (a conditional Aebp1-knockout mouse model showing osteoprogenitor-specific Aebp1 loss disrupts Wnt/beta-catenin signaling, impairing osteoblast differentiation and enhancing osteoclast activity). Also fetched PMID:38674395, a 2024 comparison case report that had been fetched but left uncited during the original creation two days ago (and later deleted as an uncited leftover); read it again but found nothing beyond what the more comprehensive PMID:37214418 review and the two 2026 papers already establish, so it remains uncited.

    Added to pathophysiology: a new node 'Impaired Osteoblast Wnt/beta-catenin Signaling' (CELLULAR, subtype: clEDS-2) downstream of 'AEBP1 Loss-of-Function', sourced to the mouse-model paper -- this is a second, cell-autonomous AEBP1 mechanism distinct from its extracellular collagen-binding role, and its addition fixed a pre-existing gap: the 'Osteopenia' phenotype had been orphaned (no downstream edge) since the entry's original creation. Added 'Intestinal Perforation' (subtype: clEDS-2, HP:0031368) as a new phenotype and downstream target of the existing 'Vascular and Visceral Fragility' node, sourced to the new case report. Updated the clEDS-2 prevalence note and evidence from '11 patients from 9 families' (2023) to '16 affected individuals from 13 families' (2026), keeping both citations rather than replacing the older one.

    While fixing the Osteopenia orphan, ran the same zero-indegree-phenotype check used in the prior two entries' self-reviews this session and found five more pre-existing orphaned phenotypes dating to the original creation (Atrophic Scarring, Thin Skin, Alopecia, Piezogenic Pedal Papules, High Myopia, Peripheral Edema). Fixed all of them rather than leaving newly-discovered gaps unaddressed: Atrophic Scarring, Thin Skin, and Piezogenic Pedal Papules were wired into the existing 'Skin Fragility and Hyperextensibility' node (whose description was also updated to note that clEDS-1 lacks atrophic scarring while clEDS-2 does show it, rather than stating the absence as if disease-wide); Peripheral Edema was wired into 'Vascular and Visceral Fragility' with a vascular-permeability rationale; Alopecia and High Myopia were wired into a new node 'Other Ectodermal and Ocular Findings' whose description and edge explicitly state that the cited sources propose no mechanism connecting these findings to the collagen XII/ACLP defect -- an honest, hedged connection rather than a fabricated causal claim, following the same pattern used for the equivalent craniofacial-findings gap in this session's Myopathic EDS entry.

    Ran the required falcon deep-research pass (just dr_fallback='--fallback' research-disorder falcon Classical-like_Ehlers-Danlos_Syndrome); like the type-1 task's pass two hours earlier, this also returned cached: true (duration_seconds: 0.0, same 22 citations, same term-validation warnings, none of which this entry binds), reusing the report already incorporated at original creation. No new content beyond what the direct-PubMed-search findings above already cover; the research/*.md frontmatter timestamp churn from the cache hit was reverted rather than committed as noise, matching the type-1 record's handling of the same situation.

    Validated with: just validate (52/52 snippets verified, up from 47), just check-causal-targets (0 new dangling targets), just check-entity-refs, just check-duplicate-keys, just check-enum-values, just check-qualifier-terms, just list-gene-term-mismatches (0/6 mismatches), just validate-disorders (CI-authoritative gate, passed), and a manual PyYAML check confirming zero orphaned phenotype nodes remain (was 7/24 before this pass, counting the pre-existing Osteopenia gap plus the five discovered during this pass).

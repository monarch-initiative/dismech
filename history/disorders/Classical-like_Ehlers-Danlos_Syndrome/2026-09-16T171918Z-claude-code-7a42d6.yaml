  summary: 'Create: Classical-like Ehlers-Danlos Syndrome'
  details: |
    Created new entry for Classical-like Ehlers-Danlos syndrome (clEDS), covering both molecularly distinct autosomal recessive subtypes: clEDS-1 (TNXB, MONDO:0011670, anchoring the top-level disease_term since the umbrella MONDO term for clEDS as a whole is itself the TNXB-specific term) and clEDS-2 (AEBP1, MONDO:0054813). A third form, clEDS-3 (MONDO:0971044, OMIM #620865), was deliberately excluded from has_subtypes: it carries no causal-gene relationship in MONDO and no indexed PubMed literature was found describing it as of curation, so it is only noted in the entry notes rather than curated with fabricated evidence. Sources: the TNXB GeneReviews chapter (PMID:36108117, confirmed and tagged via just check-genereviews --online), the 2023 comprehensive AEBP1/clEDS-2 clinical and molecular review (PMID:37214418, 11 patients/9 families), and two TNX collagen-biochemistry primary papers (PMID:17033827, PMID:20089348) establishing the FNIII29-domain collagen-fibrillogenesis mechanism. Pathograph models two upstream MOLECULAR loss-of-function nodes (TNXB, AEBP1) converging on a shared TISSUE-level 'Disorganized Dermal Collagen Matrix' node, branching into skin fragility, joint hypermobility, vascular/visceral fragility, and (clEDS-1-specific) peripheral nerve/muscle involvement nodes -- all phenotypes connected into the pathograph rather than left orphaned, applying the lesson learned from the kEDS self-review earlier in this session. MONDO term resolution required searching 'tenascin' rather than 'classical-like'/'classic-like', since the correct MONDO:0011670 label is 'Ehlers-Danlos syndrome due to tenascin-X deficiency'. Ran just discover-datasets Classical-like_Ehlers-Danlos_Syndrome: all 12 GEO candidates were GENE_ONLY matches on AEBP1's unrelated roles (cancer, diabetic retinopathy, atherosclerosis fibrosis) rather than DIRECT matches for the disease itself, so no datasets: block was added -- adding any would have been the Named Entity Confusion trap CLAUDE.md warns about. Deleted stubs/Ehlers-Danlos_Syndrome_Arthrochalasia_Type.yaml as follow-up housekeeping: that disease was curated into kb/disorders/Arthrochalasia_Ehlers-Danlos_Syndrome.yaml earlier in this session but the stub deletion was not done at the time. Validated with: just validate (40/40 snippets verified), just validate-disorders (CI-authoritative gate, passed), just check-causal-targets (0 new dangling targets against 122 grandfathered), just check-entity-refs, just check-duplicate-keys, just check-enum-values, just check-qualifier-terms, just list-gene-term-mismatches (0/6 mismatches), just check-snippet-length (whole-KB, exit 0), just check-folded-hyphens/check-title-snippets/check-snippet-grading (whole-KB, all exit 0), just check-environmental-evidence (whole-KB, exit 0), and just check-genereviews --online (TNXB chapter correctly tagged). just compliance: 87.0% global / 87.4% weighted. A falcon deep-research pass (just research-disorder falcon Classical-like_Ehlers-Danlos_Syndrome --fallback) was launched for cross-check per the default-provider instruction; its findings, if any, will be recorded in a follow-up EDIT history record.

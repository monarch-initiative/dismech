    Ran the falcon (Edison Scientific) deep-research pass required by the curation task template (just research-disorder falcon Classical-like_Ehlers-Danlos_Syndrome --fallback; 806s runtime, 22 citations mostly by DOI). The report's own term validation flagged only terms it suggested that this entry never bound (HP:0001811, UBERON:0000216 unresolved; GO:0062023 obsolete/replaced by GO:0031012) plus a harmless template-placeholder label mismatch on MONDO:0011670 ('if available', same artifact class already seen for Arthrochalasia EDS) and a table-cell string being read as a label for HP:0001634 -- none affect this entry, which independently verified every bound CURIE via runoak before writing it. just preflight-dr flagged AEBP1 mentioned in 52% as many sentences as TNXB; this is expected and not a rival-disease conflation, since the report (correctly, per its own template) covers both clEDS-1 (TNXB) and clEDS-2 (AEBP1) subtypes of the same disease entry, exactly as this entry itself is structured. Cross-checked the report body against the existing entry and found it substantially corroborated the independently-sourced primary literature already cited (same TNXB/AEBP1 mechanism, same autosomal recessive inheritance, same absence-of-atrophic-scarring-in-clEDS1 distinction), plus surfaced one genuinely important gap: the report's phenotype table states atrophic scarring is present in 9/11 clEDS2 patients, which is the opposite of the 'no atrophic scarring' framing that (correctly) applies only to clEDS-1/TNXB. This data point was already present verbatim in the already-cached PMID:37214418 Table 1 ('Atrophic scars | ... | 10/10 (100%)') but had not been added as a phenotype in the initial CREATE pass. Added two new clEDS-2-specific phenotypes from that same already-cached, already-fetched source, each with its own exact-quote table-row snippet: Atrophic Scarring (HP:0001075, 10/10 assessed patients) and Osteopenia (HP:0000938, 5/7 assessed patients). Considered and did
  summary: Literature refresh for Classical-like EDS type 1 (clEDS-1/TNXB)
  details: |
    Task requested curating 'Classical-like EDS type 1', which is not a new disease: it is exactly clEDS-1 (TNXB), already the primary subject of this entry (disease_term anchored on MONDO:0011670, synonyms includes 'clEDS-1', has_subtypes[0] is 'clEDS-1'). Per the duplicate-preflight rule, did not create a second file; treated this as an ongoing-curation/augmentation task on the existing entry instead.

    Ran the required falcon deep-research pass (just dr_fallback='--fallback' research-disorder falcon Classical-like_Ehlers-Danlos_Syndrome); it returned cached: true, duration_seconds 0.21, reusing the identical report already incorporated when this entry was first created two days ago (same 22 citations, same term-validation warnings, none of which this entry ever bound). It surfaced no new content, so the research/*.md frontmatter timestamp churn from the cache-hit was reverted rather than committed as noise.

    The genuinely new content came from a direct, targeted PubMed search (not a repeat deep-research call) for TNXB/clEDS literature published since the original curation, which surfaced three on-topic 2026 papers not available two days ago: PMID:42445465 (Nusayri family clinical report, 2026 May), PMID:42295573 (splicing-mechanism case report, 2026 Jun), and PMID:41913751 (Polish patient cohort, 2026). All three fetched and read in full/abstract.

    Added to genetic#TNXB: two new evidence items -- a dose-dependent TNXB expression finding (homozygotes show significantly lower expression than heterozygous carriers, PMID:42445465) and a distinct pathogenic-mechanism class not previously represented in this entry (intron-40-retention aberrant splicing from intronic variants, affecting the fibrinogen C-terminal domain, PMID:42295573). Added to prevalence: an independent 2026 case-count estimate ('fewer than 100 cases described worldwide', PMID:41913751) corroborating the existing under-ascertained-rarity framing.

    Added a new discussions: entry (kind: KNOWLEDGE_GAP, discussion_id: heterozygous_tnxb_and_hypermobile_eds) recording an unresolved question raised independently by both new clinical-cohort papers: whether heterozygous (carrier) TNXB variants contribute to hypermobile EDS or a milder connective-tissue phenotype beyond the biallelic threshold this entry models as strictly recessive. Deliberately NOT folded into a confident phenotype or inheritance-pattern claim -- the evidence is small-pedigree, internally inconsistent (symptomatic vs. asymptomatic heterozygous carriers within the same reports), and both source papers explicitly flag it as unresolved (incomplete penetrance/variable expressivity) rather than asserting it. attaches_to genetic#TNXB and inheritance#Autosomal Recessive Inheritance.

    Considered and did not add: detailed clinical/phenotype findings from PMID:42295573's index patient (orthostatic dizziness, chronic constipation, mild mitral valve regurgitation) -- that patient carries TNXB variants of uncertain clinical significance per the source paper itself, so adding these as established clEDS-1 phenotypes would overclaim from a single VUS-carrying case.

    Validated with: just validate (47/47 snippets verified, up from 42), just check-causal-targets (0 new dangling targets), just check-entity-refs (confirms both new attaches_to refs resolve), just check-duplicate-keys, just check-enum-values, just validate-disorders (CI-authoritative gate, passed). just check-snippet-length reported one finding, but in kb/disorders/Epidermolysis_Bullosa.yaml -- confirmed via git log/diff this predates and is unrelated to this session's edits (already present in an already-merged upstream PR #11931 pulled by git fetch origin main), not a defect introduced here.

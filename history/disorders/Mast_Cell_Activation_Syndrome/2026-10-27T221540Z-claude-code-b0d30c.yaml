  summary: Wire the H1 antihistamine half to the H1 receptor antagonism module
  details: |
    The entry's H1/H2 antihistamine treatment already bound cetirizine and famotidine as separate agents, so it identifies which drug acts at which receptor and needed no split. An Antihistamine Occupancy of H1 Receptors node was added as a therapeutic_vulnerability conforming to h1_receptor_antagonism, and the treatment reaches it through a second target_mechanisms item with treatment_effect ACTIVATES; the pre-existing link to the multisystem mediator node is unchanged. The node carries no downstream edge, because the relation between an antagonist and the mediator signalling it blocks is inhibitory. No location is bound: the H1-mediated symptoms this treatment addresses are multisystem rather than confined to one site.

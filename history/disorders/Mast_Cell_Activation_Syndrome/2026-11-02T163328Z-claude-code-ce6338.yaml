  summary: Cross-reference POTS, MCAS, hEDS and ME/CFS overlaps
  details: |
    Added notes summarising the overlaps with the related conditions and naming the comorbidity entries that hold the evidence. Added evidence to the existing knowledge-gap discussion: for POTS, the definition-dependent MCAS prevalence (PMID:40352770), the systematic review finding no qualifying study (PMID:40185471, REFUTE), the pediatric tryptase comparison (PMID:39165715, REFUTE, INDIRECT) and the ME/CFS cohort linking mast cell activation to POTS (PMID:41300853, INDIRECT). For MCAS, the same definition study and the Canadian guidance listing POTS and hEDS as not suggestive of MCAS (PMID:41272881), quoted from its 'not suggestive' list. No pathophysiology node was added, because the mechanism is not established. Validated with just validate-disorders; all snippets verified.

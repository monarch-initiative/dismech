  summary: 'Create: Mast Cell Activation Syndrome (general/idiopathic + secondary)'
  details: |
    Curated the general MCAS entry (MONDO:0100004), the curation-stub-queue entry stubs/Mast_Cell_Activation_Syndrome.yaml and stubs/Secondary_Mast_Cell_Activation_Syndrome.yaml (both deleted). Deep research via the claude_code provider (research/Mast_Cell_Activation_Syndrome-deep-research-claude_code.md): 27/27 references verified, 0.0 confabulation rate, one off-topic reference (PMID:27571382, a molybdenum-nanosheets materials-science paper, wrongly attributed by the report to the Lyons et al. 2016 Nat Genet hereditary alpha-tryptasemia paper) correctly excluded and replaced with the actual PMID (27749843) found via PubMed search. Term validation flagged one wrong CL binding (CL:0001060, mislabeled 'basophil' but actually a progenitor-cell term) which was not used. Models idiopathic and secondary MCAS as has_subtypes (both MONDO-bound); monoclonal/clonal MCAS remains its own separately-curated entry (Monoclonal_Mast_Cell_Activation_Syndrome.yaml) per the granularity-ladder convention, given its distinct KIT D816V driver and therapy. Hereditary alpha-tryptasemia (TPSAB1 copy-number gain) modeled as a genetic MODIFIER, not a causal lesion. Pathophysiology chain: receptor engagement (IgE-dependent and IgE-independent) -> signaling cascade -> degranulation/mediator release -> multisystem end-organ symptoms. Evidence cites PMID:41272881 (2026 Canadian practical-approach review, primary source for diagnostics/treatment/environmental triggers), PMID:23179866, PMID:21035176 (2010 consensus criteria), PMID:38056692 (703-patient referred-cohort prevalence, 4.4% idiopathic MCAS), PMID:27749843 (HaT genetics), PMID:31576204 (omalizumab case), PMID:38851398 (2024 JACI review, cited for the overdiagnosis/underdiagnosis knowledge-gap discussion). All CURIEs looked up live via runoak at write time after the pre-edit validation hook caught several fabricated/wrong CURIEs (HGNC TPSAB1, HP Angioedema, two ECTO exposure terms, CHEBI montelukast/cromolyn, NCIT omalizumab) on first write attempt -- corrected before the file was actually committed to disk. Validated with just validate-disorders (29/29 snippets verified), just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just check-stubs. This is preparatory work for a planned hEDS-MCAS comorbidity entry.

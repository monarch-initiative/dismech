  summary: 'Create: SETD2-Related Neurodevelopmental Disorder (RAPAS/MRD70)'
  details: |
    De novo curation of MONDO:0800477 (SETD2 codon-1740 NDD umbrella: RAPAS R1740W and MRD70 R1740Q subtypes). claude_code deep research. Scoped distinct from the separately-curated Luscan-Lumish overgrowth entry (MONDO:0014791, haploinsufficiency). Mechanism: codon-1740 altered-function SETD2 -> disturbed H3K36me3 and alpha-tubulin K40 methylation -> dysregulated cPcdh/cortical arealization (mouse) and impaired neuronal microtubule methylation (mouse). Two ClinGen records recorded in gene_disease_validity: Definitive (MONDO:0800477) and Strong (RAPAS MONDO:0035706, subtype-scoped). 17/17 snippets verified; all fast gates pass.

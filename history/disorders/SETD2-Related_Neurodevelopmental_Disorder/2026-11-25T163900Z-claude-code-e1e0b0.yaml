  summary: 'Review round 1: mine GeneReviews, add phenotypes, soften mechanism framing'
  details: |
    Round-1 review: (1) tagged and mined the GeneReviews chapter PMID:34978780 (SETD2 Neurodevelopmental Disorders) for RAPAS phenotypes, treatment management, and the behavioral spectrum; (2) added 8 phenotypes (hypotonia, failure to thrive, hyponatremia, seizures, congenital heart malformation, absent speech, facial dysmorphism, autistic behavior), stratified to RAPAS where applicable; (3) softened the mechanism framing to primary loss of H3K36me3 with an inferred superimposed gain/altered-function effect at codon 1740, aligning with the ClinGen LoF rationale; (4) changed both mouse models from RECAPITULATES to PARTIALLY_RECAPITULATES (LoF constructs vs codon-1740 alleles); (5) reworded the alpha-tubulin edge off 'loss'; (6) wired seizures/absent-speech/autistic-behavior to the cortical and microtubule nodes; bound CL:0010012 cerebral cortex neuron; dropped unsourced gnomAD claims. Lump/split of the MONDO:0800477 umbrella vs RAPAS/MRD70 deferred to maintainer (cc cmungall).

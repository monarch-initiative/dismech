  summary: 'Create: Methylmalonic Aciduria, cblA Type (MONDO:0009613, MMAA)'
  details: |
    Created kb/disorders/Methylmalonic_Aciduria_cblA_Type.yaml for MONDO:0009613 (biallelic MMAA), closing claim issue #10245.

    Entry-type decision: DISEASE. cblA was listed in two existing entries and curated in neither. Methylmalonic_Acidemia.yaml carries a thin MMAA genetic record whose only evidence is a review sentence naming cblA, no cblA pathophysiology node and no MMAA mechanism; its two has_subtypes entries are biochemical response classes spanning three genotypes rather than complementation groups. Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport.yaml carries a cblA has_subtypes line with no bound disease term and no evidence. Neither carried MONDO:0009613. The MMADHC cblD entry is direct precedent for a complementation group holding its own Disease entry while remaining a has_subtypes line on the cobalamin umbrella. Neither umbrella file was modified.

    Pathograph: nine nodes running from biallelic MMAA loss of function through the loss of the MMAA-mutase functional interaction (the mechanistically decisive step: patient missense proteins retain intrinsic GTPase activity but lose mutase-stimulated activity, physical binding, and AdoCbl gating), then splitting into the two arms of MMAA function (cofactor gating and cofactor protection/reactivation), converging on reduced holoenzyme activity, metabolite accumulation, and the decompensation, renal and neurologic arms.

    Named Entity Confusion: preflight keys on the gene and cannot separate cblA from the MMA umbrella or from cblB/cblC, so every clinical source was checked for study-population composition. PMID:32754920, PMID:35618652 and PMID:31921599 are cblA-specific or analyse cblA as a separate arm. PMID:17597648 and PMID:17957493 are mixed mut0/mut-/cblA/cblB cohorts, cited only for between-group contrasts with the non-cblA subgroup stated in each explanation. The string cblA also names a Burkholderia cepacia adhesin gene and an unrelated engineering acronym; those hits were excluded.

    Evidence grading held consistent file-wide: patient-derived findings including diagnostic enzymology and biopsy histology are HUMAN_CLINICAL; cultured-cell and purified-protein mechanism experiments including somatic cell complementation, recombinant biochemistry, crystallography and transcript-stability assays are IN_VITRO; GeneReviews is OTHER, matching the cblD entry. PMID:28497574 and PMID:17957493 report both kinds and had their evidence split so each item carries one grade.

    Deliberately not curated: no animal_models, because no published study characterises an Mmaa-deficient animal as a cblA model. A constitutive IMPC null allele does exist (Mmaa em1(IMPC)J, MGI:5825155) with broad MGI phenotype annotations but no disease-model assertion and no publication, so it is recorded in a KNOWLEDGE_GAP discussion rather than asserted absent or curated as a model. No prevalence rate, because none specific to cblA is published; ULTRA_RARE recorded instead.

    Orphanet correction: an initial draft asserted that no ORPHA cache file could be generated. That was wrong and was fixed before the pull request. just refresh-orphadata does abort on a checksum mismatch against the pin in data/orphadata/MANIFEST.yaml, but it downloads en_product1.xml first, which is enough for just structured-rebuild-orphanet --id 79310 to produce a valid nosology and cross-reference record. ORPHA:79310 is now cited under external_assertions for the exact MONDO and OMIM mappings and for the fact that the ICD-10 and ICD-11 mappings are both Narrower, so cblA carries no ICD code of its own. The definition, phenotype and epidemiology sections are genuinely absent because the aborted run never fetched the bulk files that supply them. Separately, just fetch-reference ORPHA:79310 does not work at all and reports "No source found for reference type".

    Also added after an automated second opinion on issue #10245: PMID:19955418 (GTP-gated cofactor editing, bacterial MeaB orthologue, cited for mechanism not genotype) and PMID:37468522 (human MMUT-MMAA co-crystal structure placing disease alleles at the interface).

    Also recorded: MONDO:0009613 carries an incorrect EXACT synonym "cobalamin B disease" (that is cblB/MMAB); it was deliberately not copied into the synonyms list. Worth reporting upstream to MONDO.

    Validation, all exit 0: just validate, just validate-terms, just validate-disorders (62/62 snippets verified), check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens.

    Review response (ai4c-reviewer CHANGES_REQUESTED at 1a64753aa1). All five IMPORTANT findings were verified against the cached references before acting, and all five were accepted.

    (1) GO:0003924 GTPase activity carried modifier: DECREASED while the evidence on that same node states 14 of 15 purified mutants retain wild-type-like intrinsic GTPase activity. A real contradiction. The modifier is removed rather than relocated, because what cblA alleles lose is the mutase-stimulated form of the activity and ModifierEnum has no value for "intact but no longer activatable". A node-level notes: records the reasoning so DECREASED is not re-added later.

    (2) Added nine phenotypes: hyperuricemia HP:0002149 (5/23, treatment-relevant since three were on allopurinol), abnormality of extrapyramidal motor function HP:0002071 (5/23), seizure HP:0001250 (3/23), cerebral atrophy HP:0002059 and ventriculomegaly HP:0002119 (4/5), mild hyperammonemia HP:0001987 (2/5), plus hypotonia HP:0001252, feeding difficulties HP:0011968 and failure to thrive HP:0001508 from GeneReviews.

    (3) Added three treatments, each with target_mechanisms: L-carnitine supplementation (CHEBI:16347), gut decontamination (CHEBI:6909 metronidazole) and liver or kidney transplantation (NCIT:C15289).

    (4) GeneReviews CLINICAL CHARACTERISTICS is now mined for phenotypes, closing the fourth-section gap.

    (5) reference_title added to both ORPHA:79310 evidence items.

    Four of the six lower-priority suggestions were also taken: the duplicated GO:0004494 descriptor was removed from the cofactor-protection node, propionate catabolic process was removed from the ORGANISM-scale decompensation node, and propionylcarnitine C3 (CHEBI:53210) and 2-methylcitric acid (CHEBI:30835) were added as biochemical markers.

    One suggestion was accepted only in modified form. Hyperammonemia was added, but sourced to PMID:31921599 (two of five cblA patients, mildly raised at diagnosis) and recorded as MILD and OCCASIONAL, not from GeneReviews. The GeneReviews hyperammonemic-encephalopathy sentence describes the infantile non-B12-responsive form, that is mut0 and cblB; quoting it for cblA would have attributed a mut0/cblB feature to this disease. The phenotype description states that distinction explicitly.

    Snippet mechanics worth recording: the GeneReviews phenotype quote had to begin after the bracketed qualifier in "cblA, cblB [rare], cblD-MMA", because the reference validator strips bracketed text and the snippet then fails to match. The quoted clause therefore no longer displays the gene list it describes, so each explanation states that the clause's subject is the B12-responsive list in which cblA is named.

    Rebased onto origin/main after check-snippet-length failed on four short snippets in kb/disorders/Hyperprolinemia_Type_2.yaml, a file this diff never touches. Commit 20faacff65 on main had re-cut those snippets, so this branch's older copy was being measured against the corrected baseline. The rebase was clean, with no conflicts and no file overlap.

    Post-review validation, all exit 0: validate-disorders (87/87 snippets verified), validate, validate-terms, normalize-cache, check-term-cache-integrity, check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens, plus the full tests/test_data.py suite locally.

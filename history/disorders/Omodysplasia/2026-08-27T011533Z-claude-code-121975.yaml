  details: |
    Group-15 review pass. Re-verified the ISDS assignment against Table 1 of the 2023 revision. The entry lumps two nosology rows, NOS 15-0030 (recessive, GPC6) and NOS 15-0040 (dominant, FZD2), one per curated subtype; the previous note cited only the recessive row, so the note now names both and states that both sit in group 15, making the single assignment a within-group lump rather than a cross-group one. Migrated the prevalence record off the deprecated free-text percentage field to measure_type CASES_IN_LITERATURE with prevalence_class ULTRA_RARE, which is what the cited case counts actually support. No mechanism or evidence content changed.

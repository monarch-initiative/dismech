  summary: Address pre-PR red-team review findings (MRXS35)
  details: |
    Second round on the same session: applied the pre-PR red-team review (dismech-pr-review skill, run in a fresh-context subagent before any PR existed). The review confirmed 68/68 snippets by independent re-check, all 44 ontology labels exact, no fabricated PMIDs and no Named Entity Confusion, and raised no CRITICAL findings. It raised seven IMPORTANT and eight MINOR items. Every claim was re-verified against references_cache/ before acting; all were correct.

    I-1 (fabricated reconciliation, corrected). prevalence.notes asserted that the 15-vs-19 published-case discrepancy came from 'different inclusion boundaries around the autism-only alleles'. That explanation was invented. PMID:35876338 states 'A total of 19 males with RPL10-related disorder, including the four individuals in the present study, are known so far' — Cappuccio's own total is 19, the 15 being their pre-existing-literature subset, and Xu's '19 previously reported' is that same 19. Replaced the invented cause with the real one and cited the sentence.

    I-2 (frequency bands inverted, corrected). Microcephaly was FREQUENT and Secondary microcephaly OCCASIONAL, but the cached full text says 'OFC was normal birth in all 19 patients' and 'Postnatal microcephaly was found as a common feature in our case series (100%) and was highly prevalent in the other patients reported in the literature (75%)'. In this disorder microcephaly is predominantly secondary. Raised Secondary microcephaly to VERY_FREQUENT, added both quotes, and rewrote both descriptions so the generic entry points at the secondary one.

    I-3 (bundled node split). 'Hypomorphic C-Terminal uL16 Variants' carried modifier DECREASED on GO:0006412 while its own two evidence items said basic translation is intact and that p.A64V INCREASES the translating ribosome pool, and the node title said C-terminal while its text absorbed the N-terminal p.A64V. Split into two nodes: the C-terminal autism hypomorphs (modifier dropped, since the claim is altered regulation at preserved output) and a new 'p.A64V Increases the Actively Translating Ribosome Population' node with modifier INCREASED, which now carries the Cerebellar hypoplasia and Spondyloepiphyseal dysplasia edges that depend on that family.

    I-4 (confound recorded). Mitral valve prolapse was attributed to RPL10 in a patient the source says also carries pathogenic FBN1 p.Arg1530Cys with a Marfan systemic score of 4 and lens subluxation; MVP is a cardinal Marfan feature. Added the confound to the description, noting his brother had mitral prolapse with no reported FBN1, so the finding is not wholly Marfan.

    I-5 (missing branch added). Added a 'Tissue-Specific Translational Vulnerability' node downstream of the reduced-subunit-pool node, evidenced by the retinal expression rank (553rd of 12,000) and the epiphyseal-cartilage expression, both graded INDIRECT because they are expression observations rather than demonstrations of the route. Connected the previously orphaned CNS phenotypes. The pathograph went from 39 nodes / 15 edges to 41 / 26, still with zero orphan targets.

    I-6 (frequency grounding). Added the count-bearing quote for Short stature (62%, 5/8 of the literature group, absent in the p.R32L group) and rewrote the description to record that the feature is allele-dependent.

    I-7 (evidence_source corrected). The PMID:27053602 quote on the microcephaly edge reports human phenotype associations drawn from the literature, not the paper's own rat experiments, so MODEL_ORGANISM was wrong; re-graded to OTHER and added a direct on-disease quote alongside it.

    MINORs applied: proliferation evidence added to the apoptosis/proliferation node (M-1); corrected a wrong internal cross-reference in genetic.notes that pointed at the wrong section (M-2); Spondyloepiphyseal dysplasia VERY_RARE to OCCASIONAL, since 2 of ~19 is about 10% (M-3); autism given a route from the syndromic branch, not only the C-terminal one (M-4); evidence added to the Cerebellar hypoplasia and Seizure edges (M-5); Xq28 copy-number differential added to diagnosis, explaining why chromosomal microarray matters when RPL10 sits in the recurrent duplication interval with FLNA and GDI1 (M-6); removed an overclaim that laryngeal stridor and feeding difficulty resolved with supportive care, which the cited sentence does not say (M-7); added directness INDIRECT to the two PMID:9443083 QM items for consistency with the other conserved-biochemistry-by-proxy items (M-8).

    Also completed one snippet that had been truncated mid-phrase to avoid Unicode hyphens, and fixed two YAML defects introduced while editing (an over-indented evidence block and an unquoted colon in a plain scalar).

    Deliberately not changed: eleven downstream edges remain uncited. These are the trivially-derivable CNS phenotype edges and edges whose node-level evidence already carries the claim; per the curation skill an uncited edge is preferable to reaching for a node's citation to paper over one. No new references were needed, so the citation set is unchanged at 11.

    Validation after the round: just validate and just validate-disorders pass, 81/81 snippets verified, compliance 92.3% global / 92.6% weighted (absolute satisfied slots rose from 171 to 191; the ratio fell because the new nodes enlarged the denominator), pathograph resolves with zero orphan targets, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-title-snippets and check-snippet-length are all clean.

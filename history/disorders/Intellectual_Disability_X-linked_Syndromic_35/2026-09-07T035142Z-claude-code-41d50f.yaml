  summary: 'Create: Intellectual Disability X-linked Syndromic 35 (MRXS35, RPL10)'
  details: |
    De novo curation of MRXS35 (MONDO:0030908; RPL10/uL16, Xq28) from an empty stub.

    DEEP RESEARCH. falcon was the requested provider and could not run: the Edison account returned HTTP 402 (out of credits) on two attempts. Rather than substituting a provider by hand, the run was re-issued with dr_fallback='--fallback', so openscientist produced the report and the substitution is recorded in the report frontmatter (fell_back: true, requested_provider: falcon, provider_attempts). Report: research/Intellectual_Disability_X-linked_Syndromic_35-deep-research-openscientist.md (980s, 12 citations).

    REPORT VALIDATION READ BEFORE USE. needs_review: true. Reference validation: 12/12 resolved, 0 not found, confabulation_rate 0.0; one reference (PMID:30482776, 'Ribosomal Lesions Promote Oncogenic Mutagenesis') flagged off topic — it is a T-ALL somatic-oncogenesis paper and was not cited. Term validation: 34/36 resolved, 0 unresolved, but 8 terms reported as mislabelled. On inspection all 8 are the report placing a frequency word ('Frequent', 'Subset') in its table's label column; the CURIEs themselves (HP:0001999, HP:0001250, HP:0000717, HP:0001561, HP:0004322, HP:0000546, HP:0000365) match the bindings independently chosen here, so they are a report formatting artifact rather than wrong bindings. No term listed as unresolved was bound. just preflight-dr PASSED (RPL10 mentioned 54 times; OMIM 300998 matches).

    GENEREVIEWS. Searched PubMed for a GeneReviews chapter on RPL10/MRXS35 ('RPL10 GeneReviews[All Fields]' and title search): zero results. No chapter exists, so no GeneReviews baseline applies. Step 3b recorded as not applicable rather than skipped.

    CITATIONS. 11 references, all PMIDs (no DOI-only items), all fetched via just fetch-reference and committed to references_cache/. Eight came from the report's citation list; three were found independently by PubMed E-utilities search because the report did not cite them and they carry content the entry needed: PMID:26290468 (Zanni, the p.A64V / cerebellar hypoplasia / spondyloepiphyseal dysplasia family), PMID:28715419 and PMID:24706786 (the uL16 late-60S-maturation checkpoint biochemistry).

    CITATIONS DELIBERATELY NOT USED. Five of the report's twelve were rejected on substance, not availability. PMID:31090057 and PMID:20004760 are Xq28 *duplication* syndromes (MECP2/MidXq28 region) — a different disorder that shares only the cytogenetic band with RPL10, and citing them would be exactly the Named Entity Confusion the preflight guards against. PMID:28744013, PMID:31186416 and PMID:30482776 are somatic T-ALL RPL10-R98S papers (JAK-STAT gain of activity, serine/glycine translatome, oncogenic mutagenesis); that is a mechanistically distinct somatic disease and importing it would misrepresent the germline disorder.

    HANDLING OF THE LEUKEMIA-ALLELE MECHANISM PAPERS. Two yeast rpl10-R98S papers (PMID:28715419, PMID:24706786) ARE cited, but only to establish the conserved biochemistry of uL16 in late cytoplasmic 60S maturation (Nmd3/Tif6 release), never as evidence about MRXS35 patients. Every such item is graded directness: INDIRECT with an explanation naming the limitation, the entry's description carries an explicit scope note separating the germline disorder from the somatic T-ALL context, and a KNOWLEDGE_GAP discussion records that the checkpoint defect has never been measured for any syndromic allele. PMID:9443083 (QM protein, the original name for RPL10) was added from the report to anchor the same step in human cells rather than yeast alone.

    CONTENT. 6-node causal pathophysiology chain from the missense lesion through failed late 60S maturation, a reduced translation-competent subunit pool, neural apoptosis, to impaired brain growth, plus a separate node for the hypomorphic C-terminal autism alleles that does not proceed through that chain. 22 phenotypes with HP bindings, genetic (RPL10, hgnc:10298) with genetic_context on the initiating node, X-linked recessive inheritance, diagnosis, prevalence (CASES_IN_LITERATURE; the 15 vs 19 published-case discrepancy between Cappuccio 2022 and Xu 2025 is recorded and explained rather than averaged), 6 treatments with NCIT bindings, a zebrafish morphant animal model with two modeled_mechanisms links and a readout, and two KNOWLEDGE_GAP discussions with proposed experiments. gnomAD constraint values are recorded in genetic notes rather than as an evidence item, because they are database statistics with no quotable source sentence.

    VALIDATION. just validate passed (schema, terms, references). 68/68 snippets verified against the local cache. just validate-disorders (the batched pre-PR gate CI runs) passed. just compliance 95.5% global / 96.0% weighted. Offline gates run clean: check-entity-refs, check-causal-targets (no new dangling targets), check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length. The curated stub stubs/Intellectual_Disability_X-linked_Syndromic_35.yaml was deleted and just check-stubs passes.

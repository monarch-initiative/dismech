  summary: 'Address ai4c-reviewer changes-requested on PR #11322 (MRXS35)'
  details: |
    Third round on MRXS35, addressing the automated review on https://github.com/monarch-initiative/dismech/pull/11322 (ai4c-reviewer, REQUEST_CHANGES). One blocking finding and four non-blocking suggestions; all five taken in a single push, since branch protection dismisses the approval on every push.

    BLOCKING, and the reviewer was right. The a64v_increased_translating_ribosomes_paradox discussion still pointed at pathophysiology#Hypomorphic C-Terminal uL16 Variants Altering Translational Regulation. That was a defect introduced by the previous round: when the bundled node was split, the new p.A64V node was created but the discussion's attaches_to was never repointed, so a knowledge gap entirely about the N-terminal p.A64V allele hung off the node describing the C-terminal autism alleles. Nothing catches this automatically -- the foreign key resolves, so check-entity-refs passes and the page renders; it simply renders on the wrong branch of the allelic series, which is a substantive misstatement about which allele does what. Repointed to pathophysiology#p.A64V Increases the Actively Translating Ribosome Population.

    SUGGESTION 1 taken. Added an Abnormal heart morphology phenotype (HP:0001627) for the broader structural cardiac involvement associated with p.K78E, cited to PMID:29066376. The existing Mitral valve prolapse entry stays as the one specific lesion, keeping the FBN1/Marfan confound attached to the finding it actually qualifies rather than spreading it over the general cardiac claim.

    SUGGESTION 2 taken. Added an Occupational Therapy treatment (NCIT:C121351, therapeutic_modality BEHAVIORAL) targeting global developmental delay, completing the developmental package beside the existing physical and speech therapy entries.

    SUGGESTION 3 taken. Added the clinical differential (MECP2, KDM5C, USP9X, MSL3) to the diagnosis description, with the point that none is separable from MRXS35 on phenotype alone, which is why diagnosis is molecular. Written as description prose rather than as an evidence-bearing claim, because the differential comes from the deep-research report's synthesis and no cached reference carries a quotable sentence asserting it.

    SUGGESTION 4 taken, and filed as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP. The reviewer proposed a knowledge gap for the absent humanized knock-in mammalian model. The repository distinguishes the two kinds: KNOWLEDGE_GAP means evidence is absent, HUMAN_MODEL_MISMATCH means evidence exists in a model whose translational validity is the open question. That is the situation here -- a zebrafish morphant model exists and is cited throughout, but it suppresses the gene entirely while every patient carries a missense allele that still makes protein, so it models absence rather than substitution. The gap attaches to the zebrafish model and to the apoptosis/proliferation node, and proposes a knock-in mouse carrying the orthologous p.K78E and p.R32L substitutions.

    NOT ACTED ON. The reviewer disclosed two checks it could not run for lack of network access: independent PubMed verification of the 11 PMIDs, and the GeneReviews existence check. Both were performed during the original curation session against live NCBI E-utilities. Every PMID was fetched through just fetch-reference, which resolves against PubMed, and the GeneReviews search ('RPL10 GeneReviews[All Fields]' plus a title search) returned zero results, which is recorded in the first history record for this entry. No further action is needed; the checks are done, just not by the reviewer.

    Validation after this round: just validate and just validate-disorders pass, 83/83 snippets verified, compliance 91.2% global / 91.6% weighted (198 of 217 satisfied slots, up from 191; the ratio moves down because the added nodes enlarge the denominator faster than they fill it). Pathograph 43 nodes / 27 edges, zero orphan targets. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-title-snippets and check-snippet-length all clean.

  summary: 'Review round 1: remove process narration from notes'
  details: |
    Review round 1 on PR #12725. Took the reviewer's suggestion to remove process narration from the entry notes, and recorded the removed facts here instead. Two sentences changed. The holoprosencephaly paragraph now opens "The eight holoprosencephaly forms MONDO places beneath the bound term" rather than naming the Monarch-KG gene coverage comparison that produced the gap list, since what the paragraph needs to establish is where MONDO puts those classes, not how they came to attention. The closing sentence dropped "Evidence added before this pass uses DOI caches because PMID fetching failed during that run", which described a previous curation session; the durable half of that sentence, that DOI:10.3390/children12030364 and PMID:40150646 are the same publication and the DOI form is cited throughout so the paper has one cache file, is kept because a future curator adding a citation to that paper needs it. The reason the earlier evidence uses DOI caches is that PubMed DocSum fetching failed during the 2026-05-10 curation session recorded in this entry's creation history; that is session provenance and belongs here. The dated ClinGen download reference was left in notes on purpose: it is the source citation for a negative-existence claim about LHX3 and LHX4 validity assertions, which CLAUDE.md requires to name the query and what it returned, and an undated reference to a file that upstream republishes would not be checkable. The reviewer's other two suggestions were declined for this PR: tagging GeneReviews NBK1347 and mining it for the PROP1 genetic row is a PROP1 pass rather than an LHX3/LHX4 one, and splitting Sella Turcica and Hindbrain Malformation into two nodes is premature while one report supplies both findings and its two downstream phenotypes already separate them. No evidence, term binding, or structure changed in this round; the three files revalidated clean.

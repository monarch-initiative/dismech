  summary: Add FOXA2 genetic record (UNKNOWN, de novo, autosomal dominant)
  details: |
    Requested by the insulin-secretion and glycogen gene-family review; the entry's own note recorded that FOXA2 was missing. Added a FOXA2 record typed UNKNOWN with variant_origin DE_NOVO and an autosomal dominant inheritance block (HP:0000006). Evidence: two patients with syndromic hypopituitarism due to FOXA2 defects, one with a heterozygous nonsense variant and pancreatic dysgenesis and one with a de novo 20p11.2 deletion including FOXA2 (PMID:33999151), and the ClinGen curation summary (CGGV:assertion_8a995738-1ea3-454b-b92f-251d4b21d530-2025-10-08T170000.000Z), which states that variants were de novo wherever parents were tested, reports structural congenital heart disease, and grades the relationship Moderate for autosomal dominant combined pituitary hormone deficiency. That ClinGen assertion is filed against MONDO:0013099, which this entry maps only as skos:closeMatch to its bound term MONDO:0018762, so the tier was not copied into gene_disease_validity (check-gene-validity reports it as other_disease); Moderate is also below the CAUSATIVE threshold. The entry-level note that called FOXA2 uncovered was updated. FOXA2 is not placed on a mechanism node. The FOXA2 curated summary (hgnc_5022) was refreshed and verifies.

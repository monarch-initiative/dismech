  summary: 'Genetics pass: LHX3 and LHX4 subtypes, developmental-step nodes'
  details: |
    Genetics pass for issue #12238 (d2g series-031). Curated the two gene-defined MONDO children of the bound term as has_subtypes rows: CPHD3 (MONDO:0009091, LHX3, hgnc:6595, autosomal recessive) and CPHD4 (MONDO:0009880, LHX4, hgnc:21734, autosomal dominant with incomplete penetrance). Added a LHX3 genetic record with the reciprocal subtype foreign key and gave the existing LHX4 record its subtype key plus a case_fractions entry recording the approximately 1.4 percent yield in the 417-proband cohort of PMID:27820671, with the structural preselection stated in the population field. Split the flat Developmental Gene Disruption node into the developmental steps the two transcription factors act at: Rathke Pouch Formation Failure (LHX3 and LHX4 redundantly, GO:0048847, UBERON:0005356), Anterior Pituitary Cell-Lineage Specification Failure (LHX3, LHX4 via POU1F1 transactivation, GO:0045165 and GO:0021984), Extrapituitary LHX3 Developmental Defect (UBERON:0002413), and Sella Turcica and Hindbrain Malformation (UBERON:0003689, UBERON:0002037). Added five subtype-scoped phenotypes: limited neck range of motion, sensorineural hearing impairment and scoliosis for CPHD3; small sella turcica and Chiari malformation for CPHD4. Changed disease_term preferred_term from the label of MONDO:0013099 to the label of the bound term MONDO:0018762 and recorded MONDO:0013099 as a skos:closeMatch, noting that the two classes look like a duplicate pair. Recorded in notes why ANE syndrome (RBM28) and the eight holoprosencephaly forms in the gap list are not curated here, including the MONDO subclass edge from holoprosencephaly to the bound term that put them there. Eleven new reference caches fetched. All 226 snippets in the three-file batch verified under linkml-reference-validator 0.3.0rc1 with --no-full-text; reference-cache churn from validator runs was reverted and snippets re-verified against the committed tree.

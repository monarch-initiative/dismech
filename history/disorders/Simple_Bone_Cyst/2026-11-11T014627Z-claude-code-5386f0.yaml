  summary: 'Create: Simple Bone Cyst (MONDO:0019372), with the cause written as two
    competing hypotheses'
  details: |
    New entry for simple bone cyst on MONDO:0019372, which MONDO labels solitary bone cyst. Until now the lesion appeared in the knowledge base only as a differential diagnosis of Round_Cell_Sarcoma_with_EWSR1-non-ETS_Fusion, which carries the same gene fusion. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only. Closes the claim issue 17018; part of the neuroblastoma-related series (issue 15822).

    Sources. 27 papers are cited, 26 of them new to the reference cache. PMID:32991339 was already cached and quoted in the sarcoma entry, and its sentences keep the grading used there. The sources are retrospective series, one randomised trial, a Cochrane review, a meta-analysis of retrospective studies and narrative reviews.

    Shape. The cause is unknown, so the mechanism is written as hypotheses. Three nodes: NFATC2 Gene Fusion, Venous Outflow Obstruction and Raised Intracystic Pressure, and Bone Resorption by Factors in the Cyst Fluid. Two mechanistic hypotheses: venous_obstruction (CANONICAL, because reviews present it as the accepted account; its description says it is not proven) and neoplastic_nfatc2_fusion (EMERGING). Three of the four edges are typed INDIRECT_UNKNOWN_INTERMEDIATES, and all four belong to a hypothesis group. The cyst itself is a phenotype (HP:0012062) that all three nodes point to; Pathological Fracture is its sequela, and Bone Pain the sequela of the fracture. One genetic row (NFATC2), three diagnosis rows, two differential diagnoses bound to the MONDO terms of their own entries (aneurysmal bone cyst and the round cell sarcoma with the same fusion), six treatments, three progression phases, one prevalence record, two epidemiology rows and three KNOWLEDGE_GAP discussions.

    Decisions a reader may want to check. The name is Simple Bone Cyst, the name the literature and the NCI Thesaurus use (NCIT:C2904); the MONDO label and unicameral bone cyst are synonyms. The NFATC2 row is typed BIOMARKER and not SOMATIC_DRIVER: the studies establish that the fusion helps the diagnosis, and their authors' reading that it proves a neoplasm is recorded as a hypothesis. No node carries a somatic genetic_context, because the sources do not say which cell of the cyst wall carries the fusion. A 2026 clinical review that calls the cyst non-neoplastic and the study of jaw cysts are REFUTE items on the neoplastic hypothesis. One frequency band is set: Pathological Fracture is FREQUENT, from two clinical series of children (43 of 68 and 13 of 22); a pathology series of older patients gives 4 of 14 and is quoted with that caveat. The prevalence record is an incidental-finding prevalence of 1.4 per 1,000 in children imaged for spinal disorders, lower extremities only. The sources disagree on whether the cysts resolve with skeletal maturity; both views are quoted in the progression section and neither is preferred. The Cochrane review's statements are graded like the other review sentences, HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS.

    Terms. Read from the committed caches or through OLS on 11 November 2026. The NCI Thesaurus has no term for an injection of bone marrow into a bone lesion, for decompression of a bone cyst or for intramedullary nailing: OLS searches of NCIT for 'bone marrow injection' and 'intramedullary nailing' returned nothing, and 'decompression' returned Spinal Cord Decompression, Core Decompression, Nasogastric Decompression and Laminectomy, none of which is this procedure (searches run again before the commit, same results). Those three treatments are bound to Therapeutic Procedure or Orthopedic Surgical Procedure, with the specific procedure in preferred_term.

    Left out. A classifications block and histopathology rows; the histology is described in the diagnosis section. just check-genereviews reports no GeneReviews chapter, as expected for a lesion that is not Mendelian, and one StatPearls chapter, which is not cited.

    After review. The first review made four suggestions. Three led to a change and one to a note. The edge from Bone Resorption by Factors in the Cyst Fluid to Bone Cyst now belongs to the venous_obstruction hypothesis, because the 2024 review that states that account names enzymatic lysis with venous obstruction, and its one evidence item is graded directness INDIRECT, because the authors inferred the resorption from the factors in the fluid and did not measure it. The two sentences of the Cochrane review were graded evidence_source OTHER and are now HUMAN_CLINICAL, as the other review sentences in the entry are. Swelling, which one source names with pain, was considered for a phenotype row and not added: the sentence does not say where the swelling is or what tissue it is in, and the HPO terms found either name a site or a tissue or are Edema; the searches and what they returned are in the notes of the Bone Pain row. An ICD-10-CM mapping to M85.4 Solitary bone cyst was added, as the review suggested for later. The first version of this record said that the local ICD-10-CM build was not on this machine. That was wrong: the build is present, and the code and its label were read from it.

    Validation: just validate, validate-terms and validate-disorders pass; 134 of 134 snippets verify against the cached references; the whole-repo gates, the extra gates and the kb test lane were run locally and pass. Term validation added cache rows for MONDO:0019372, NCIT:C2904, CHEBI:6889 and ICD10CM:M85.4.

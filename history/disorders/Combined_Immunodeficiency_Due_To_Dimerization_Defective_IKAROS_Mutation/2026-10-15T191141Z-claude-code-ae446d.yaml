  summary: 'Create: Combined_Immunodeficiency_Due_To_Dimerization_Defective_IKAROS_Mutation'
  details: |
    Curated a new entry for MONDO:0979288 from issue #14383. Lump/split decision: DISEASE. MONDO and Orphanet split germline IKZF1 disease by mechanism, the DNA-binding haploinsufficiency class is the IKAROS subtype of Common_Variable_Immunodeficiency, and the dominant-negative class is a separate stub (MONDO:0979316); the stub for this disease was deleted. Deep research: one OpenScientist report (28/28 references resolved, 16/18 quotes valid, preflight-dr PASS with IKZF1 mentioned 38 times). The report mixes in features of other IKZF1 allele classes, so several of its claims were not used: Pneumocystis infection and low TREC come from dominant-negative and haploinsufficient cases, and its HSCT citation (PMID:38320737) is a gain-of-function series; that paper is cited only for two introduction sentences, graded BACKGROUND. Its NCIT suggestions were wrong (NCIT:C564 is Ifosfamide, NCIT:C105558 is a TPI1 allele) and none was used. Evidence rests on the founding Kuehn 2021 cohort (PMID:32845957), the ZF6 truncating families in PMID:40024461, the ZF5/ZF6 functional screen in PMID:41380100, the T-cell immunophenotyping in PMID:41424385, and the pericentromeric-targeting domain mapping in PMID:10970879. Mechanism follows the sources: haploinsufficiency without a dominant-negative effect, which corrects the issue text's dominant-negative description. Cytopenia and vasculitis phenotypes are left without a causal edge and carry a knowledge-gap discussion. A fresh-context review before the PR led to: a caveat that M494Vfs*86 is assigned to this class by its ZF6 location rather than by a dimerization assay; the dimerization-to-instability edge downgraded to INDIRECT_UNKNOWN_INTERMEDIATES; the HNRNPLL node split into a molecular repression node and a cellular naive-to-memory shift node, with the reporter-assay snippet that includes DD variants; patient-cell immunoblot and cDNA evidence regraded IN_VITRO; and pulmonary, splenic and oral phenotypes added from PMID:40024461. Validated with just validate, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-genereviews (NO_CHAPTER), and just validate-disorders (55/55 snippets).

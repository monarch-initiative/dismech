  summary: 'Create: NIK Deficiency (MAP3K14)'
  details: |
    Created kb/disorders/NIK_Deficiency.yaml for NIK (MAP3K14) deficiency (MONDO:0018642), an autosomal recessive combined immunodeficiency from biallelic loss-of-function variants abolishing non-canonical NF-kappaB signaling. Curated from the three human reports (PMID:25406581 index p.Pro565Arg family; PMID:29230214 South African p.Val345Met; PMID:41280889 long-term HSCT outcomes) plus mechanistic mouse literature (PMID:10319865 aly mouse, PMID:11239468 p100 processing, PMID:12352969 BAFF/NIK B-cell survival, PMID:31481626 TEC-specific Nik). An 8-node causal pathograph runs from loss of NIK kinase activity through the p100-to-p52 block to B-cell, TFH, NK, and lymphoid-stromal defects and post-transplant autoimmunity; two mouse models linked via modeled_mechanisms. 20 phenotypes, 2 variants, 2 treatments, 2 diagnosis entries. Deep-research requested via falcon with --fallback (no EDISON_API_KEY); it fell back to openscientist, whose report was still running at write time. Validated: just validate (51 snippets, 54 titles, 0 issues), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-genereviews (NO_CHAPTER confirmed).

  summary: Review Barber-Say evidence, inheritance, models and clinical
    completeness
  details: |
    Reviewed the complete disorder and prior CREATE/EDIT histories, the matching deep-research scientific narrative and its validation metadata, every evidence-to-claim association, and cached references including available full text. The entry had no previous REVIEW event. It is a Mendelian TWIST2 disorder, within the campaign's scope excluding infectious and environmental diseases/poisonings.

    Sources: read the complete scientific text of PMID26119818 including its 12-person/10-family BSS table, microscopy, HeLa ChIP-seq and zebrafish methods/results; PMID28690482 including the patient-perspective tables and BSS adult surgical figure; PMID28680619 and PMID30984591 clinical reports; PMID20691403 Setleis functional study; and the full clinical/anesthesia reports PMID25614816 and PMID29497666. Read every other cited abstract and the ORPHA1231 structured record. The PMID28369379 cache remains abstract-only, but its complete accepted manuscript was already available in the Oxford URL cache: consumed results, heterozygous/null controls, methods and figure legends. The PMID27196381 landing-page cache only contains the abstract; consumed the full Amsterdam UMC publisher PDF, including its critical diagnostic reassessment and extracted Table IV. Image-only Tables I–III were not used for new row-level claims. Repeat fetches of PMID27092433 and PMID9415700 retrieved no quotable text. A PMC URL fetch returned a CAPTCHA and was not used. No cache text was hand-written.

    Corrected diagnostic provenance. The 2016 critical review excluded Suga2014 (PMID25614816) after negative TWIST2 testing and a divergent phenotype; the anesthesia report PMID29497666 identifies the same first Japanese child. Neither now establishes Barber-Say clinical/anesthetic risks. Ng/Rajguru2006 (PMID16714944) and the son in Dinulos/Pagon1999 (PMID10440829) were excluded as insufficiently documented. Removed their affirmative evidence, retaining the accepted mother's cleft-palate/hearing observations. Removed hypospadias supported only by the unconfirmed son. PMID34092176 concerns mosaic AMS and is no longer primary BSS eyelid evidence. The full-text exclusions and bibliographic correspondence are documented for future curators.

    Corrected inheritance, source scope and mechanism interpretation. The three mosaic transmitting parents belong to the combined AMS/BSS series, not three BSS fathers; BSS4.1 and his daughters are distinguished. Removed blanket DE_NOVO and SNV annotations from the mixed germline/mosaic and missense/duplication context. Added three structured variants with the source transcript and precise discovery-series counts. Clarified unresolved paternal origin in the 2017 infant and tissue-dependent postzygotic detection in the 2024 hamartoma case. Removed an unsupported numerical prevalence class from a case-count record.

    The HeLa study included all four mutant constructs, including E75Q. Removed the unmeasured claim that half of patient dimers are abnormal, the direct inference of reduced elastic-fiber assembly from microscopy, and the false assertion that no model expresses a mutant alongside an endogenous wild-type allele. The worm heterozygote reporter results and recessive null control now support the transcription model; multicopy reporters, sensitized embryo-retention background and species limits are explicit. No binding-site mapping was performed in worms. Human dermal histopathology is represented separately. Dominant-negative and neomorphic hypotheses remain alternatives with unresolved human-tissue contributions.

    Completeness assessment:
    1. Phenotypes: adequate after expansion to 67. Separated nipple inversion/absence and breast aplasia/hypoplasia; added specific genital, dental, limb, craniofacial and ophthalmic findings from primary tables and the critical review, plus explicitly case-limited findings from a molecularly confirmed infant. Retained variation and family-cluster limitations; did not infer new population frequencies. Protruding premaxilla remains unbound rather than misbound to dental overjet or maxillary hyperplasia.
    2. Subtypes: no established intradisease subtypes. AMS and Setleis remain allelic differentials; temporal lesions are not an absolute discriminator, and an uncharacterized TWIST2 variant alone is not diagnostic.
    3. Mechanisms: adequate within evidence limits; six atomic nodes, two competing hypotheses, dermal histopathology, HeLa/fish/worm models with explicit experimental limitations. Hair-growth mechanism remains an honest knowledge gap.
    4. Treatment/trials: ten care/intervention records, including ocular protection, tailored reconstruction, dental care, counseling, psychosocial support, laser hair removal and optional breast/facial procedures. Shared AMS/BSS recommendations are labeled as synthesis, not BSS-specific comparative efficacy. No disease-specific clinical trial was surfaced by the research or consumed references.
    5. Genetics: three structured variants plus de novo/inherited/mosaic distinctions, uncertainty about individual origin, and non-mosaic versus mosaic counseling scope. No unsupported penetrance or modifier claims.
    6. Diagnostics/biomarkers: two diagnostic approaches, including observed tissue-discordant mosaic detection; no established biochemical biomarker in the consumed sources. Online and offline GeneReviews check: NO_CHAPTER (Bookshelf snapshot2026-09-10).
    7. References: full-text omissions addressed; exact quotes carry titles copied from cache. Off-entity and diagnostically doubtful reports are separated from affirmative evidence.
    8. Overall: research themes assessed against primary and critical-review sources; rejected unsupported claims, incorrect ontology suggestions, uncertain historical diagnoses and model-to-human overgeneralization rather than importing them.

    OLS searches supplied canonical labels and definitions for new bindings, followed by term validation. Schema/term/reference batch validation passed 164 snippets and166 titles with no skipped/unavailable snippets. History and final content/cache gates are recorded in the PR validation summary. Cached institutional PDFs are reused from main; only relevant generated term-cache updates are included with the entry and this history.

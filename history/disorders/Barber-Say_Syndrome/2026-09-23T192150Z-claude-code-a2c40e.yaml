  summary: 'Create: Barber-Say_Syndrome'
  details: 'New Disease entry for Barber-Say syndrome (MONDO:0008853, TWIST2). Lump/split: kept as its
    own entry with ablepharon-macrostomia syndrome (MONDO:0008693, TWIST2 p.Glu75Lys) and Setleis syndrome
    (MONDO:0009203, biallelic TWIST2 truncation) as differential_diagnoses, following MONDO/OMIM/Orphanet
    and the residue-level genotype-phenotype split in PMID:26119818; the continuum view (PMID:19760652,
    PMID:27196381) is recorded in notes and evidence. The stub synonyms ''Brown Sequard Syndrome''/''Bss''
    were not carried over. Deep research: one run, falcon requested (HTTP 402, out of credits) with claude_code
    fallback, which produced research/Barber-Say_Syndrome-deep-research-claude_code.md (fell_back: true;
    no .citations.md sidecar produced). Report reference validation: 12/12 identifiers resolved, 1 quote
    attributed to PMID:26119818 not found verbatim (the closest source sentence was used instead), needs_review
    true. Term validation needs_review true: four report CURIEs name unrelated terms (UBERON:0004085,
    UBERON:0000151, UBERON:0000202 used for eyelid/nasal/mouth region; none bound) and two obsolete terms
    (HP:0007756, GO:0043433; not bound). preflight-dr PASS. All evidence was re-read against the primary
    abstracts or cached full text; phenotype frequency bands come from counting rows of Table 1 in PMID:26119818
    (12 molecularly confirmed BSS individuals) and the count is stated in each phenotype''s notes. functional_impact_category
    deliberately left unset: the primary paper frames dominant-negative and neomorphic mechanisms as alternatives,
    so both are curated as EMERGING mechanistic_hypotheses. Not cited: PMID:27092433 (mosaic father-to-child
    transmission; no abstract or full text available) and PMID:9415700 (milder form without ectropion;
    no abstract), both named by the report. The report''s POSTN/Setleis fibroblast lead (PMID:33669496)
    was not used because it concerns loss-of-function Setleis cells. No GeneReviews chapter (check-genereviews
    --online NO_CHAPTER); no ClinGen gene-validity row for TWIST2. ORPHA:1231 cache built from the Orphadata
    snapshot. Validated with just validate, count-verified-snippets (121/121), validate-terms, and the
    offline gate set. After reading the automated research comment on the claim issue: added a notes paragraph
    on the Say-Barber-Biesecker-Young-Simpson (KAT6B) name collision, and added stubs/Ablepharon_Macrostomia_Syndrome.yaml
    so the allelic differential is in the curation queue. That comment named PMID:25620206 as the Marchegiani
    2015 AJHG paper; PubMed resolves PMID:25620206 to an unrelated mtDNA-ancestry paper, and the correct
    PMID (26119818) was used. just validate-disorders passed (121/121 snippets).


  summary: 'Create: VPS16-Related Dystonia (DYT30)'
  details: |
    De novo curation of DYT30 (MONDO:0025691, OMIM 619291), autosomal-dominant early-onset generalized dystonia from heterozygous loss-of-function VPS16 variants. Deep research via Perplexity (report cited no PMIDs and gave a wrong HGNC id HGNC:16812=COQ8A for VPS16, flagged by preflight; VPS16 is hgnc:14584, used here). Curated against Steel et al. 2020 Ann Neurol (PMID:32808683; weighted exome burden of 138 individuals, 18 heterozygous LoF + 1 microdeletion), cached abstract-only. Mechanism: VPS16 haploinsufficiency (HOPS subunit; GO:0000149 SNARE binding DECREASED) -> impaired autophagosome-lysosome fusion and lysosomal dysfunction (GO:0061909 DECREASED; EM vacuolar abnormalities in patient cells, IN_VITRO) -> generalized/oromandibular/cervical dystonia and developmental comorbidity. AD inheritance (HP:0000006). Lump/split: distinct from the allelic AR biallelic-VPS16 mucopolysaccharidosis-like syndrome; part of HOPSANDs. Specific variant alleles and DBS outcomes (later case series) not exact-quote cited as Steel is abstract-only. All offline gates incl check-snippet-length and validate-disorders pass; 9/9 snippets verified; 4/4 phenotypes connected; no GeneReviews chapter.

  summary: Enriched Dystonia 30 with description, Harrison's classifications, HOPS/lysosomal pathophysiology groundings, additional neuropsychiatric/motor phenotypes, genetic diagnosis, and botulinum toxin treatment.
  details: >-
    Added top-level description, Harrison's chapter classifications (NEUROLOGIC,
    GENETICS_ENVIRONMENT_DISEASE), and incomplete penetrance annotation backed
    by PMID:32808683 and PMID:40539388. Grounded VPS16 Haploinsufficiency with
    HOPS complex (GO:0030897) and lysosome (GO:0005764), and grounded Impaired
    Autophagosome-Lysosome Fusion and Lysosomal Dysfunction with lysosome and
    autophagosome cellular components, lymphocyte/fibroblast cell types, and
    autophagy/lysosomal transport GO biological processes. Added Anxiety,
    Depression, Intellectual disability, and Myoclonus phenotypes wired to
    lysosomal dysfunction, backed Cervical dystonia frequency with PMID:40539388
    cohort counts, added molecular genetic testing diagnosis (NCIT:C15709), and
    added Botulinum toxin injection treatment (NCIT:C157775) modulating
    Generalized dystonia.

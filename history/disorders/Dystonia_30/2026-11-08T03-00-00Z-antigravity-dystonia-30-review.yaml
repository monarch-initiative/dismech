  summary: Enriched Dystonia 30 with description, Harrison's classifications, HOPS/lysosomal pathophysiology groundings, additional neuropsychiatric/motor phenotypes, genetic diagnosis, and botulinum toxin treatment.
  details: >-
    Added top-level description, Harrison's chapter classifications (NEUROLOGIC,
    GENETICS_ENVIRONMENT_DISEASE), and incomplete penetrance annotation backed
    by PMID:32808683 and PMID:34440453. Grounded VPS16 pathophysiology nodes
    with HOPS complex (GO:0030897), lysosome/autophagosome cellular components,
    neuron/fibroblast/lymphocyte cell types, brain/globus pallidus UBERON
    locations, and autophagy/lysosomal transport GO biological processes. Added
    Anxiety, Depression, and Myoclonus phenotypes wired to lysosomal
    dysfunction, added molecular genetic testing diagnosis (NCIT:C15709), and
    added Botulinum toxin injection treatment (NCIT:C157775).

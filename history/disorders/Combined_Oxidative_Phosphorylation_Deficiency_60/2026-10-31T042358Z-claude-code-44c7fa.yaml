  summary: 'Create: Combined_Oxidative_Phosphorylation_Deficiency_60'
  details: |
    Lump/split decision: DISEASE. COXPD60 is a single-gene (MRPL49) autosomal recessive mitoribosomal large-subunit disorder with one conserved pathograph, so it is curated as its own entry rather than as a Perrault syndrome subtype. Deep research: one openscientist report (research/Combined_Oxidative_Phosphorylation_Deficiency_60-deep-research-openscientist.md), 12/12 references resolved, preflight-dr PASS (MRPL49 mentioned 44 times, OMIM 621195 matches). The report was used as leads only; nearly all MRPL49-specific content traces to the founding report PMID:40043708, which was fetched as PMC full text and quoted directly. Report claims not carried over because they could not be sourced: an estimated 8 percent share of Perrault syndrome, a GeneReviews MRPL49-related Perrault syndrome listing, and a c.236G>A cDNA for p.Arg88His (the paper gives c.263G>A). The term it suggested for globus pallidus (HP:0002452) does not resolve; HP:0012751 was used instead. Relationship to Perrault syndrome: the dismech Perrault_Syndrome entry deliberately omits MRPL49 as a curated gene; this entry records Perrault syndrome as a differential diagnosis and the mild end of the COXPD60 spectrum instead of conflating the two. Evidence is one multicentre report of nine families plus a Perrault review listing MRPL49 (PMID:42283975); a 2025 case report (PMID:40715997) has no abstract and is mentioned in notes only. Mitochondrial translation was not measured directly in the founding study, so that node and its edges are graded directness INDIRECT and a KNOWLEDGE_GAP discussion records it. check-genereviews --online lists the GeneReviews Perrault Syndrome Overview (PMID:25254289) as a candidate chapter matched on MRPL49; its scope is Perrault syndrome, not COXPD60, its cached abstract does not mention MRPL49, and the Bookshelf full text could not be retrieved here, so it is not tagged. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), the CLAUDE.md offline gates, check-snippet-grading, check-gene-activity-grounding and validate-disorders.

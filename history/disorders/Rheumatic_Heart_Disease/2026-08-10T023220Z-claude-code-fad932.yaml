  summary: 'Review response: Rheumatic Heart Disease'
  details: |
    Review-response session on PR 8276. Addressed all five IMPORTANT findings.

    The most consequential was an inverted reading of a source. The HLA-DQA1 gene
    entry cited a snippet stating that the paper's class III signal remained after
    conditioning on the class I and class II variants. That sentence is evidence for
    the independence of the class III signal FROM class II, not evidence for a class
    II association, and the explanation I wrote inverted the paper's logic. Re-reading
    the cached abstract showed the study's class II signal is HLA-DQB1 rs28724238 and
    that HLA-DQA1 does not appear in it at all. The gene entry is now HLA-DQB1, cites
    the sentence that locates the signal, and is graded PARTIAL because at P equal to
    7.77 times ten to the minus seven it falls short of genome-wide significance and
    ranked third in that study. Snippet-exactness checking cannot catch this class of
    error, because the quote was accurate and only the inference from it was wrong.

    Also corrected a false provenance claim shared with the sibling entries in this
    series. The Jones criteria snippet was cut mid-word and labelled as truncated in
    the cached abstract. The cache is complete; the cut came from a fixed-width
    extraction window in the curation script. Re-quoted at the sentence boundary,
    which also gained the substantive clause about Doppler-detected carditis becoming
    a major manifestation.

    Added: a progression section consuming PMID 28255075, which had been fetched and
    never cited, with the multi-state model's counted trajectories; a biochemical
    section covering streptococcal serology and acute-phase reactants, plus a
    diagnosis entry for evidence of antecedent streptococcal infection, since that is
    a mandatory Jones criterion rather than a supporting test; a pulmonary
    hypertension branch from mitral stenosis through post-capillary pulmonary
    hypertension to right heart failure, conforming to the pulmonary vascular
    remodelling module at the remodelling node only because the cause here is
    mechanical rather than a primary arteriopathy; and a low-molecular-weight heparin
    treatment for pregnancy, curated with the caveat that the standard of care in the
    highest-risk period rests on off-label use.

    The remaining fetched-but-unused references now support a knowledge gap
    discussion on group A streptococcal vaccine development, including why this
    disease's own mechanism makes a vaccine hard, since the immunodominant antigens
    are the cross-reactive ones.

    Two term corrections. CL 0000084 T cell replaced with CL 0000624 CD4-positive
    alpha-beta T cell to match the preferred term and the class II restricted
    mechanism. The fibrotic response module node name was wrong; the module has
    Excessive ECM Deposition, not Excessive Extracellular Matrix Deposition. That was
    caught by the conforms to foreign key test, which linkml-validate does not run.

    Validation: schema, ontology terms, and references all pass. Snippets checked 42
    of 42 verified against cached references, up from 34 of 34.

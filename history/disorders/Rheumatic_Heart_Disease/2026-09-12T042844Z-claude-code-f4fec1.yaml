  details: |
    Review round on PR #9722; ai4c-reviewer requested changes on two prose-accuracy items. The branch had also gone into conflict with main, so this round resolves both.

    Merge conflict. main had received a competing pass on the same entry's environmental block. The single textual conflict was on environmental[0].notes, and git's automatic resolution of the surrounding block had also produced a duplicate evidence key in environmental[0] - one block before influences_mechanisms and one after - which is the dismech#8623 pattern documented in CLAUDE.md and the same failure recorded in the PR #9720 review. Resolved per CLAUDE.md by merging the blocks rather than deleting one: environmental[0].evidence is now a single block holding all four items (PMID:20948456, PMID:28052445 x2 from this branch, PMID:15927077 from main). Verified snippet count moved 46 -> 49, which is the three items PyYAML had been silently discarding by keeping only the last duplicate key. Confirmed no evidence item was swallowed into a prose scalar, the other half of the #9720 damage: 49 raw reference lines parse to 49 evidence items.

    IMPORTANT 1, Jaine 2011 is an ecologic study. The evidence explanation claimed crowding survives adjustment for ethnicity, income and child density in a 1249-case national series, and the notes claimed the cited evidence separates crowding from deprivation. Both were wrong in the same way, and the paper's own METHODS say so: it is an ecologic study joining hospitalisation counts to census area units, entering crowding, the New Zealand deprivation index, household income and proportion of children alike as area factors based on the CAU of home address. All the adjusters are census-area aggregates, so adjusting one for another cannot rule out individual-household confounding, and the authors write "Our conclusion could be further investigated using a case-control study." Exposure was never measured on any individual case, so 1249-case series also mischaracterizes the design. The explanation now names the ecologic design, claims only the graded area-level association that a PREDISPOSES link asserts, and states that cause versus marker is open. The notes record the withdrawn claim explicitly rather than silently dropping it, so a reader who saw the old page text can see it was retracted and why.

    IMPORTANT 2, the treatment cascade pointed Oliver 2017 against its own conclusion. The item graded the sore-throat cascade as support for poverty driving untreated pharyngitis. Oliver 2017 is a descriptive interview study of 55 cases with no comparator, so it cannot attribute the gap to poverty, and its authors use the finding the other way, against sore-throat treatment as the intervention: "Sore throat treatment has important limitations as an intervention, particularly as 38% of participants did not recall sore throat preceding the diagnosis." Kept SUPPORT and rewrote the explanation to claim only the measured cascade attrition (62% recalled a sore throat, 29% saw a clinician, 13% received antibiotics), to state that it does not attribute the gap to poverty, and to record the 38%. The reviewer's alternative was to downgrade to PARTIAL; that value no longer exists after issue #7439, and CLAUDE.md's replacement needs a directness slot this branch's vendored schema predates, so the rewrite was the available option and is the one the reviewer listed second.

    Also fixed the two explanation strings in these blocks that still argued for the retired PARTIAL grade, since #10003 migrated the supports values but left the prose. Fourteen further PARTIAL prose references remain elsewhere in this file; they are the known #10003 backlog and are deliberately out of scope for a review round.

    All quotes were verified as exact substrings of their caches before being written. check-duplicate-keys, validate, validate-terms, check-entity-refs, check-folded-hyphens and count-verified-snippets (49/49) all pass.

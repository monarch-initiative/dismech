  details: |
    Weekly compliance pass focused on environmental exposure evidence. The single environmental entry, household crowding and poverty, had no entry-level evidence; only its influences_mechanisms link was cited, and that citation was a PARTIAL observation about socioeconomic distribution. Added three entry-level evidence items: PMID:20948456 (Jaine 2011, 1249 New Zealand ARF cases; crowding remains significant after adjustment for age, ethnicity, household income, and child density) and two from PMID:28052445 (Oliver 2017; measured housing exposures in 55 recently diagnosed cases, and the sore-throat treatment cascade showing 62 percent recalled pharyngitis but only 13 percent of the total sample received antibiotics). Added a link-level evidence item quantifying the crowding incidence rate ratio of 1.065 on the PREDISPOSES edge. Corrected a stale notes field that still read 'No ECTO term is bound' after PR 8471 bound ECTO:6000028; the note now records that the bound term captures deprivation but not crowding, and that the cited evidence separates the two. All 48 snippets verify against the reference cache. Weighted compliance 68.6 percent to 69.9 percent.

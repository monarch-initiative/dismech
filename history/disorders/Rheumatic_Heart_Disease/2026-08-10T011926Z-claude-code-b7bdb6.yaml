  summary: 'Create: Rheumatic Heart Disease'
  details: |
    Created the Rheumatic Heart Disease entry from a claude_code deep-research report
    treated as leads only. The report was unusually disciplined and flagged its own
    MONDO and ontology identifiers as unverified rather than asserting them; every
    identifier used was independently checked against OAK or OLS.

    Mechanism model. Nine pathophysiology nodes running from group A streptococcal
    infection in an HLA-susceptible host, through molecular mimicry, cross-reactive
    antibody binding with valve endothelial activation, CD4-positive T cell
    infiltration, acute valvulitis with Aschoff body formation, and chronic valve
    fibrosis with commissural fusion, to valvular stenosis and regurgitation and
    thence to atrial fibrillation and heart failure. One node conforms to
    fibrotic_response.

    Two deliberate non-conformances, both following the report's own advice. The
    Aschoff body is an Xogenesis-style lesion but is not conformed to
    granuloma_formation, because that module models containment of a persistent
    indigestible stimulus by macrophage fusion and there is no organism in the
    rheumatic valve to contain. The atrial fibrillation is not conformed to
    cardiac_ion_channel_repolarization, because it is structural rather than a
    primary channelopathy; the INVICTUS trial result, in which warfarin beat
    rivaroxaban in exactly this population, is the clinical consequence of that
    distinction and is curated on the node.

    Curated negatives. The 2015 Cochrane review found little evidence that
    corticosteroids or intravenous immunoglobulin protect the valve, which is
    curated as a REFUTE item on the anti-inflammatory treatment edge together with
    the reviewers' own caveats about trial antiquity and risk of bias, so it reads
    as failure to demonstrate benefit rather than demonstrated futility. The primary
    prevention meta-analysis is curated with its own limitation, namely that the
    evidence base is seventy-year-old trials in young American servicemen.

    Sixteen references fetched and verified. The report cited the Cochrane review
    without a PMID; three versions exist and the 2015 update was used, with the
    superseded 2003 version fetched during curation and deliberately not cited.

    Snippet discipline. An automated check flagged one snippet under five words, and
    inspection showed that eight snippets in the draft were title fragments rather
    than assertive sentences. All eight were replaced with real sentences from the
    cached abstracts. Two of the replacements were then caught by the reference
    validator as misattributed, having been drawn from a different paper than the
    one cited, and were replaced with sentences from the correct abstract.

    Validation: schema, ontology terms, and references all pass. Snippets checked
    34 of 34 verified against cached references.

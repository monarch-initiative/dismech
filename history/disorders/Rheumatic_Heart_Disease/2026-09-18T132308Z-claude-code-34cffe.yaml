  summary: 'Compliance pass: evidence for the haemodynamic nodes, acute-episode phenotypes
    and streptococcal serology'
  details: |
    Weekly compliance sweep. All 59 compliance gaps were empty evidence slots; every ontology binding was already present. Added 14 evidence items: the three previously uncited haemodynamic pathophysiology nodes (valvular overload, pulmonary venous congestion and pulmonary hypertension, right heart failure), nine phenotypes (mitral regurgitation as a second item, mitral stenosis, aortic regurgitation, congestive heart failure, post-capillary pulmonary hypertension, migratory polyarthritis, Sydenham chorea, subcutaneous nodules, fever) and the two streptococcal serology markers. Two references newly cached: PMID:27188830 (Carapetis et al., Nature Reviews Disease Primers, full text) and PMID:31516274 (ASO and anti-DNase B titres across acute pharyngitis, acute rheumatic fever, rheumatic heart disease and healthy children). The primer supplies the valve ranking that the existing World Heart Federation citation on the mitral regurgitation phenotype explicitly could not, so that phenotype now carries both. Four items are graded INDIRECT with the shortfall named in the explanation rather than smoothed over: the pulmonary hypertension evidence does not distinguish post-capillary from pre-capillary, which is the specific claim behind the HP binding; the heart failure figures do not separate right-sided from left-sided failure, which is the distinction the right heart failure node exists to make; and the subcutaneous nodule mechanism is hedged in the source and does not support the entry's further claim that nodules almost always accompany carditis. The serology pair is worth noting: in the cited cohort ASO was raised in acute rheumatic fever but not in established rheumatic heart disease, while anti-DNase B was raised in both, which is the complementarity the entry asserts. Review follow-up: the two items quoting "half of these patients" now name their referent, a Ugandan RHD cohort (n = 309) selected for late, previously undiagnosed presentation, so the 50 percent figure is not read as a general frequency for this disease; the two quoting the 14 and 27 percent heart-failure figures likewise name Lawrence and colleagues' 1,149 children with ARF in the Northern Territory, Australia. Those four plus the three carditis items are marked quote_role REVIEW_SYNTHESIS, each carrying a citation to work the primer's authors did not perform. The primer's own mechanism exposition is deliberately left unassessed rather than marked by default. Second review round: the phenotype-side pulmonary hypertension explanation had read the 50 percent off the composite endpoint and attached it to one component, so it now says half the cohort had at least one of the four listed severe complications and that the share with pulmonary hypertension specifically is not given, matching what the pathophysiology item quoting the same sentence already said. The trailing sentence restating quote_role REVIEW_SYNTHESIS in prose is dropped from both pulmonary hypertension explanations, since the structured field already carries it. The Sydenham chorea item is marked REVIEW_SYNTHESIS: its quoted sentence carries superscript 86, so it meets the same criterion applied to the other seven, and leaving it unmarked was an oversight rather than a judgement. Weighted compliance 64.6 to 74.0 percent. All 63 snippets verified against the cache.

  summary: 'Compliance pass: evidence for the haemodynamic nodes, acute-episode phenotypes
    and streptococcal serology'
  details: |
    Weekly compliance sweep. All 59 compliance gaps were empty evidence slots; every ontology binding was already present. Added 13 evidence items: the three previously uncited haemodynamic pathophysiology nodes (valvular overload, pulmonary venous congestion and pulmonary hypertension, right heart failure), eight phenotypes (mitral regurgitation as a second item, mitral stenosis, aortic regurgitation, congestive heart failure, post-capillary pulmonary hypertension, migratory polyarthritis, Sydenham chorea, subcutaneous nodules, fever) and the two streptococcal serology markers. Two references newly cached: PMID:27188830 (Carapetis et al., Nature Reviews Disease Primers, full text) and PMID:31516274 (ASO and anti-DNase B titres across acute pharyngitis, acute rheumatic fever, rheumatic heart disease and healthy children). The primer supplies the valve ranking that the existing World Heart Federation citation on the mitral regurgitation phenotype explicitly could not, so that phenotype now carries both. Four items are graded INDIRECT with the shortfall named in the explanation rather than smoothed over: the pulmonary hypertension evidence does not distinguish post-capillary from pre-capillary, which is the specific claim behind the HP binding; the heart failure figures do not separate right-sided from left-sided failure, which is the distinction the right heart failure node exists to make; and the subcutaneous nodule mechanism is hedged in the source and does not support the entry's further claim that nodules almost always accompany carditis. The serology pair is worth noting: in the cited cohort ASO was raised in acute rheumatic fever but not in established rheumatic heart disease, while anti-DNase B was raised in both, which is the complementarity the entry asserts. Weighted compliance 64.6 to 74.0 percent. All 63 snippets verified against the cache.

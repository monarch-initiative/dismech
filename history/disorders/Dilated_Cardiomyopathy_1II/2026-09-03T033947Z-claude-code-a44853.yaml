  details: |
    Worked the five blocking items from the ai4c-reviewer CHANGES_REQUESTED review, plus the four non-blocking suggestions. B1: added a top-level references: block covering all 15 cited PMIDs, with the GeneReviews DCM overview (PMID:20301486) tagged tags: [GeneReviews], and two evidence items mined from its cached purpose statement. B2: added a diagnosis: section (echocardiography NCIT:C16525; CMR with late gadolinium enhancement NCIT:C16809; natriuretic peptide measurement NCIT:C96610, newly cited to PMID:25740799; cardiomyopathy multigene panel NCIT:C15709) and a differential_diagnoses: section whose lead entry separates CRYAB myofibrillar myopathy (MONDO:0012130) from the cardiac-restricted form, carrying the p.Gly154Ser counter-evidence as a REFUTE item. B3: extended the truncated DAPA-HF snippet to the complete conclusion sentence. B4: removed the echocardiography-modality quote from both the remodeling causal edge and the Myocardial fibrosis phenotype and replaced it with sources that actually assert fibrosis in human dilated-cardiomyopathy myocardium (PMID:29323059 histology, PMID:33928704 CMR/PICP); rewrote the phenotype description to state plainly that no CRYAB carrier has reported myocardium. B5: replaced GO:0031072 heat shock protein binding with GO:0031432 titin binding on the pivotal titin N2B node, keeping modifier DECREASED, which is now the correct side of the interaction. Non-blocking: added cardiac resynchronization therapy and advanced heart failure therapy treatments; wired Reduced left ventricular ejection fraction, Sudden cardiac death and Myocardial fibrosis into the pathograph, leaving only Cataract orphaned by design; added the module's GO:0014898 and GO:0030198 processes to the conforming Ventricular Remodeling node; ran discover-datasets, got 6/6 GENE_ONLY off-target hits, and recorded that in notes rather than curating them. Validation: just validate, validate-terms, count-verified-snippets (66/66), check-duplicate-keys, check-entity-ref
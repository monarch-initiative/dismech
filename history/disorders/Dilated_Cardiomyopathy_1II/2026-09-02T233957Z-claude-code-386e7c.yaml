  summary: 'Create: Dilated_Cardiomyopathy_1II (CRYAB, MONDO:0014073)'
  details: |
    Curated CRYAB-related dilated cardiomyopathy (CMD1II, OMIM 615184) as a standalone Disease entry rather than a has_subtypes entry on Myofibrillar_Myopathy, which was the lump/split call the issue asked to settle. MONDO lists MONDO:1060212 (CRYAB-related myofibrillar myopathy-cataract-cardiomyopathy spectrum) as a second parent of MONDO:0014073, and Myofibrillar_Myopathy already carries an MFM2 alpha-B crystallinopathy subtype. The split rests on PMID:16483541, which compares the two alleles directly: p.Arg157His reduces binding to the heart-specific titin N2B domain without changing subcellular distribution or forming aggregates, while p.Arg120Gly loses binding to both N2B and the striated-muscle-specific I26/I27 domains and does aggregate, and the authors state the disease-causing mechanisms differ. The Myofibrillar_Myopathy pathograph is built around aggregation, so folding CMD1II into it would assert a mechanism the primary literature denies for the index allele. The counter-evidence (p.Gly154Ser reported in isolated cardiomyopathy and later in aggregate-positive distal myopathy without cardiac involvement, PMID:20171888) is recorded as a KNOWLEDGE_GAP discussion rather than argued away. Two mechanistic routes are separated into hypothesis groups (titin_n2b_interaction_defect, proteotoxic_aggregation), and the allele mismatch between the model literature and the human alleles is carried as a HUMAN_MODEL_MISMATCH discussion with a FAILS_TO_RECAPITULATE animal-model link. Nine references were fetched independently; the Edison/falcon deep-research report carries no PMIDs and none of its citations were used. Validated with just validate (44/44 snippets verified, schema and term validation clean), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, and just validate-disorders.

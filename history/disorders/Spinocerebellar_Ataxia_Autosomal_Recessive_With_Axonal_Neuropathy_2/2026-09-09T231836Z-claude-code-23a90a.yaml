  summary: 'Create: SCAN2 (AOA2)'
  details: |
    New leaf disease entry for spinocerebellar ataxia, autosomal recessive, with axonal
    neuropathy 2 (MONDO:0018996), better known as ataxia with oculomotor apraxia type 2.

    LUMP/SPLIT. Curated as a standalone Disease entry. One causal gene (SETX, hgnc:445,
    confirmed against MONDO's own RO:0004003 relation), no MONDO descendants, one coherent
    pathograph. The dominant SETX allelic disorder ALS4 stays in
    Juvenile_Amyotrophic_Lateral_Sclerosis: opposite variant mechanism (heterozygous
    gain-of-function vs biallelic loss), different neuron population, no shared chain worth
    merging. It is cross-referenced as a differential rather than duplicated. Before
    curating, MONDO:0018996 was present in kb/ only as a differential_diagnoses entry on
    Ataxia_Telangiectasia; no disorder file, PR, or issue covered it.

    DEEP RESEARCH. One Perplexity run,
    research/Spinocerebellar_Ataxia_Autosomal_Recessive_With_Axonal_Neuropathy_2-deep-research-perplexity.md.
    The default sonar-deep-research model could not be used: three attempts, plus a direct
    curl reproducing the same failure, were cut at exactly 300 s by the network path with
    'Server disconnected without sending a response'. dr_fallback='--fallback' does not
    rescue this, by design - is_fallback_worthy() covers credential and billing failures,
    not transport failures. The committed report was produced with --model
    sonar-reasoning-pro (155 s). An earlier --model sonar-pro run of the same template was
    overwritten by it; only the sonar-reasoning-pro report is committed.

    The report was weak as a curation input and is recorded as such rather than leaned on.
    Its reference validation is clean (3/3 resolved, 0 unresolved, 3/3 on topic, no quotes
    checked) but that is a small denominator: it cites database pages - MalaCards, GARD,
    MedGen, Orphanet, ClinVar, PomBase - and carries no PMID strings in its body at all.
    Its term_validation reports needs_review: true with 9 of 19 checked labels naming a
    different term than the report claimed (CL:0000103 offered as 'dorsal root ganglion
    neuron' when CL calls it bipolar neuron; UBERON:0001898 offered as 'brainstem' when it
    is hypothalamus; six NCIT clinical-action codes naming unrelated concepts such as
    Breast Conservation Treatment for 'physical therapy') plus one invented HP identifier
    (HP:0006259). It also gave two different and both-wrong HGNC ids for SETX across runs
    (HGNC:10761 in the sonar-pro run, HGNC:10740 here). No CURIE was taken from the report.
    Every binding in the entry was read from the repository term caches and OAK at the
    moment it was written, and this is stated in the entry's notes.

    Consequently the substantive literature was found by direct PubMed search, which the
    skill's Step 4 permits. Cited: PMID:20301333 (GeneReviews, tagged in the top-level
    references block), PMID:14770181 (Moreira 2004 gene discovery), PMID:19696032 (Anheim
    2009, 90-patient cohort - the source of nearly every frequency in the entry),
    PMID:14736755 (Le Ber 2004, 18 patients), PMID:17562789 (Suraweera 2007, DNA-damage
    response), PMID:21700224 (Skourti-Stathaki 2011, R-loop resolution and Xrn2
    termination), PMID:24637776 (Yeo 2014, the negative brain R-loop result),
    PMID:29916023 (senataxin review), PMID:34922620 and PMID:29725819 (the ALS4 contrast),
    PMID:29356829 (AOA1 cohort, for the differential), PMID:17112370 (ARCA classification).

    REPORT REFERENCE WALK. Every reference the report resolved was checked for use.
    Consumed: PMID:35203940 (Taiwanese SETX case plus literature review - supplies the only
    population prevalence figure, the caution that oculomotor apraxia is variable rather
    than obligate, the East Asian nystagmus finding, and the worked compound-heterozygous
    genotype); PMID:40464291 (2025 ARCA review, classification evidence); PMID:20687496,
    PMID:31182267 and PMID:17948061 (all SCAN1, used in the SCAN1 differential);
    PMID:17112370 (ARCA classification). Deliberately not used: PMID:27544499 (severe late
    axonal neuropathy in SPG11) - a real differential for complex hereditary spastic
    paraplegia, but the SPG11 phenotype is spastic paraplegia from onset and does not
    resemble this AFP-positive ataxia, so adding it would pad the differential list rather
    than sharpen it. DOI:10.1002/ana.27271 is the same paper as PMID:40464291 and the PMID
    was cited in preference, since DOI: is in skip_prefixes and would not be
    snippet-checked by the gating validator.

    That walk changed the content. A first draft asserted 'elevated alpha-fetoprotein is
    not a characteristic feature of SCAN1' as a discriminator against SCAN1. PMID:31182267
    reports elevated serum AFP in 3 of 4 SCAN1 patients and hypercholesterolaemia in 2 of
    4, so the claim was wrong; the differential now records AFP as explicitly
    non-discriminating and says separation is molecular. PMID:17948061 was added in the
    same pass for the sharper distinction - SCAN1 is a recessive neomorphic TDP1 allele
    (Tdp1-null mice are normal) against plain biallelic loss of senataxin here.

    MECHANISM AND ITS HONEST LIMIT. Five-node chain, MOLECULAR to ORGANISM: biallelic SETX
    loss of function -> failure of co-transcriptional R-loop resolution -> defective
    double-strand-break repair and oxidative genome damage -> Purkinje cell degeneration
    and DRG/length-dependent axonal degeneration, with a sixth ORGANISM node for the
    alpha-fetoprotein elevation hung off the trigger. The two edges into the degeneration
    nodes are INDIRECT_UNKNOWN_INTERMEDIATES, not DIRECT, because they are not demonstrated:
    PMID:24637776 found no R-loop accumulation in the brains of Setx-, Atm-, Tdp1- or
    Aptx-disrupted mice and concluded R-loop accumulation does not explain the
    neurodegeneration in these ataxias. That paper is carried twice on the R-loop edge - once
    SUPPORT/INDIRECT for the proliferating-cell result and once REFUTE for the brain result -
    and a HUMAN_MODEL_MISMATCH discussion (r_loop_neuronal_relevance) states the conflict as
    a question. A second KNOWLEDGE_GAP discussion records that no mechanism connects
    senataxin loss to hepatic AFP regulation.

    ANIMAL MODEL. One entry, the Setx-disrupted mouse (PMID:24637776), linked to the R-loop
    node as PARTIALLY_RECAPITULATES / fidelity LOW / model_scale MOLECULAR, with two
    readouts: R-loop abundance INCREASED in proliferating tissue and UNCHANGED in brain. The
    UNCHANGED readout is a measured negative, not an omission, and is the point of including
    the model at all. Its limitations slot states that the lesion was not demonstrable in the
    tissue that degenerates. No phenotype-level link is asserted: the model's overt phenotype
    is infertility from failed meiotic recombination, not ataxia or neuropathy. The ALS4
    mouse models in PMID:29725819 are deliberately not curated here - they model the dominant
    gain-of-function disease, which belongs to Juvenile_Amyotrophic_Lateral_Sclerosis.

    SCHEMA FIELD CHECKS. Three fields were resolved against the schema rather than assumed.
    Biochemical genuinely has no description slot (checked via class_induced_slots, which
    covers both slots: and attributes:), so the marker's prose is in notes and context.
    Pathophysiology's anatomy slot is locations, not anatomical_structures. AnimalModel.name
    is declared under attributes: rather than in the slots: list and is used here as the
    stable pathograph label; animal_models#Setx-disrupted mouse resolves against it in the
    r_loop_neuronal_relevance discussion's attaches_to.

    conforms_to on two existing modules: cerebellar_purkinje_degeneration#Purkinje Neuron
    Degeneration and peripheral_axonal_degeneration#Distal Axonal Degeneration and
    Demyelination. The neuropathy earns the second one - at 97.5% it is more consistent than
    cerebellar atrophy and dominates the later course.

    BIOCHEMICAL. Serum alpha-fetoprotein with a reference_ranges block (0.5-17.2 microg/L,
    the control interval from the Anheim cohort). No LOINC code is bound: LOINC has no
    adapter in conf/oak_config.yaml, so the identifier could not be looked up, and the entry
    says so rather than writing one from memory. The validated 7 microg/l sequencing
    threshold is recorded in notes rather than as an interpretation_band, because it is a
    sensitivity-tuned screening cut-off for a preselected ataxic population and sits inside
    the quoted normal range - modelling it as a band would misrepresent it.

    FREQUENCY DISCIPLINE. Phenotype frequency bands come from the Anheim percentages, not
    from prose. Nystagmus and two neuropathic signs carry no frequency because the sources
    are case-series reviews rather than frequency studies. Prevalence uses measure_type:
    UNKNOWN because the only source ('from non-existent up to 1/150,000') does not say which
    occurrence measure it reports; the 8% share of non-Friedreich recessive ataxia is a
    proportion among ataxia patients rather than population occurrence and is in notes.
    Areflexia carries directness: INDIRECT because the quote supporting it asserts masking
    by severe motor neuropathy rather than areflexia itself.

    VALIDATION. just validate (schema, terms, references) passes with 64/64 snippets verified
    against the cached references. check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms (0 qualifier terms), check-enum-values,
    check-stubs, check-folded-hyphens, check-snippet-length, check-title-snippets and
    check-snippet-grading all pass with no new baseline entries. just validate-disorders run
    once over the file as the authoritative gate. The stub was deleted.

    TOOLING NOTES. references_cache/PMID_29725819.md is deliberately left unstaged: fetching
    it upgraded the committed abstract-only record to full text, which is unrelated churn on
    a file another PR may touch, and the snippet cited here is in the abstract either way.
    Disk filled to 100% partway through (the oaklib SQLite builds total ~5 GB); the NCIT
    build could not be materialised, so NCIT term choices were verified against
    cache/ncit/terms.csv for labels and cache/enums/treatmentactionterm_*.csv for
    dynamic-enum membership, which is the same question validation asks.

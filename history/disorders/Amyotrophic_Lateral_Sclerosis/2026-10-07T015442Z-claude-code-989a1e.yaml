  summary: Evidence-claim mismatch review (#13156)
  details: |
    Reviewed the root-level MISMATCH findings in the saved Jev assessment for this
    entry (22 active items) against the current YAML and cached references.

    Corrected:
    - Neuroinflammation node: neither existing item supported the microglia/astrocyte
      mechanism (one was a T-cell sentence from a multiple sclerosis review). Replaced
      it with Boillee et al. 2006 (PMID:16741123, microglial mutant SOD1 drives
      progression in mice) and Haidet-Phillips et al. 2011 (PMID:21832997, familial
      and sporadic patient astrocytes are toxic to motor neurons and upregulate
      inflammatory genes). The description now names those findings instead of an
      unsourced cytokine/ROS list.
    - Equine motor neuron disease model: the Motor Neuron Degeneration link cited only
      the case-series count sentence; it now cites the first pathology report
      (PMID:2209016) describing spinal and brainstem motor neuron loss. The Oxidative
      Stress link's fidelity moved MODERATE -> LOW and its description/limitations now
      state that the oxidative mechanism is inferred from lipopigment, dietary risk
      factors and an uncontrolled rescue, which the authors frame as a hypothesis.
    - TBK1 genetic record: added the familial exome result (PMID:25803835) that the
      CAUSATIVE grading rests on; the Orphanet row's explanation now says Orphanet
      files TBK1 as a susceptibility factor.
    - Tofersen and C9orf72 node: removed two generic review sentences that did not
      address the claim; both claims keep their specific trial/cohort evidence.
    - Edaravone description now matches its evidence (subset phase 3 benefit;
      no disease-modifying benefit in a real-world cohort).
    - Cardiomyocyte proteomic-age biomarker: the incident-ALS sentence is now
      NO_EVIDENCE, since the marker is curated as a cross-sectional correlate only.
    - GTEx v8 dataset records: publication and evidence pointed at an ALS
      electrodiagnosis chapter; now the GTEx v8 paper (PMID:32913098), following the
      Hyperlipidemia GTEx records.

    Retained after review: the FIG4 snippets (they support FIG4's enzymatic identity
    and CMT4J allelism, which is what the descriptions claim); the STMN2 knowledge-gap
    and downstream-edge items (correct REFUTE/gap framing); the ALS9, ALS10, ALS28 and
    FTDALS1 subtype items (each supports a specific sentence of its description).
    Lower-probability PARTIAL findings were not individually worked.

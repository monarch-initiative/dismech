  summary: 'Review round 2: split bundled node, fix FTDALS1 overlap claim, regrade
    mixed-source evidence'
  details: |
    Review round 2 on PR #12655 (issue #12229). The reviewer's two structural findings both applied to this entry. First, the FTDALS1 description claimed C9orf72 is "the reason the ALS and FTD series overlap at all", which contradicts the rows beside it: TBK1, CCNF and VCP are each bound to a MONDO "frontotemporal dementia and/or amyotrophic lateral sclerosis" term in the same list, and TARDBP and UBQLN2 also span ALS and dementia. Reworded to say C9orf72 is the largest of several shared causes. Second, the new node "Loss of Neurotrophic and Angiogenic Support Signaling" bundled two unrelated pathways under a loose shared label, set GO:0001525 angiogenesis DECREASED against a motor-neuron cell type, and claimed MOLECULAR scale for a node containing a tissue-level process. Split into "Neuregulin-ErbB4 Signaling Failure" (ERBB4, GO:0038130 DECREASED, motor neuron) and "Angiogenin Loss of Function" (ANG, GO:0004540 RNA nuclease activity DECREASED as a molecular function, with both cell types the source names, motor neuron and endothelial cell). The angiogenesis process is deliberately not repeated on either node and the reason is recorded in the new node's notes. The ERBB4 evidence explanation claimed the source showed "a lost trophic signalling pathway, not a gained toxicity"; the quoted sentence says only that pathway disruption is involved in pathogenesis, so the explanation was trimmed to that and the measured autophosphorylation deficit added as its own item. Evidence-source regrading: the PMID:23455423 sentence spans a cell-based stress-granule result and an animal-model inclusion result, so it is now MODEL_ORGANISM for the animal half and a separate IN_VITRO item quoting the steric-zipper self-seeding sentence carries the biochemical half. The FIG4 genetic record had association "Causative" next to relationship_type RISK_FACTOR and now reads "Risk factor". Removed curation-session narration from three places: the TDP-43 node notes no longer describe when the 97% figure was sourced while keeping the distinction from the ~90% measurement, the entry notes state that no ClinGen classification is cited for these 18 genes rather than describing a blocked refresh recipe, and the same tooling status was swept out of the ALS26 review_notes; the TAF15 sentence on the RNA-binding protein node now names the search that was run. Took three non-blocking suggestions: the C9orf72 record carried three unreconciled familial-share figures and now states the series and population each belongs to with the meta-analysis cited; the TARDBP GeneReviews explanation claimed rare homozygous reports that its snippet did not contain, and that sentence is now quoted as its own item; and the Familial ALS row's 5-10% figure, uncited since before this PR, is now sourced. Declined the request to mine the ALS Overview GeneReviews chapter: its cached body is 380 characters of the chapter's statement of purpose, with no finding to quote. Validated with the same gate list as the paired amelogenesis imperfecta record.

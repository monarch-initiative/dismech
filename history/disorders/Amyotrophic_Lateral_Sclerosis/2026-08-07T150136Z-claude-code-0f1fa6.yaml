  summary: Link environmental risk associations as predisposing only
  details: |
    Backfill for issue #8085. All five entries are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the motor neuron degeneration node, which is the honest shape for a disease with no established environmental cause. Heavy metal exposure carries a pooled odds ratio of 1.46 for lead, pesticides 1.9 at class level without identifying a compound, military service 1.92 as a setting bundling unseparated exposures, and head trauma 1.26 with reverse causation a genuine concern since early motor impairment increases falls. Smoking carries supports PARTIAL rather than SUPPORT because its pooled current-versus-never estimate does not exclude no effect; the link cites the sex-stratified figures instead, 0.86 in men and 1.66 in women, and the description records that the association is present only in women. Grading any of these as TRIGGERS would assert causation that the field has not established. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 197 of 197 verified; integrity issue count unchanged.

  summary: Add cardiomyocyte plasma proteomic aging clock biomarker with prognostic-null
    caveat
  details: |
    Added the cardiomyocyte aging clock from Ding et al. (PMID:42297981) as a cross-sectional correlate of prevalent ALS, deliberately NOT as a prognostic marker. The two arms must not be quoted as one finding and the notes say so: cross-sectionally cardiomyocyte aging was accelerated in prevalent ALS in GNPC (r = 0.33, adjusted P = 4.08e-9) alongside the stronger skeletal myocyte signal (r = 0.43), but the overall log-rank test for cumulative ALS incidence in UK Biobank gave P = 0.0562 for cardiomyocyte aging against P < 0.0001 for skeletal myocyte. The paper's own narrative sentence describes 'similar risk stratification' for the two cell types, which reads more favourably than its log-rank result; that sentence is curated as PARTIAL with an explanation naming the discrepancy, so the next curator sees it rather than silently inheriting the narrative. No readout link was added, because a marker whose prognostic test did not reach significance should not be wired into the pathograph as PREDICTS. Also recorded the authors' own caveat that cardiomyocyte-assigned FABP3 may be released more broadly than its assigned cell type, which is a specific rather than generic specificity limit for this marker, carried in the specificity slot. Validation: linkml-validate clean; term validation passed; reference validation --no-full-text exit 0 with 231/231 snippets verified across this file and the senescence module.
    Part of the cell-type plasma proteomic aging clock tranche prompted by the
    Cell Reports Medicine Spotlight (PMID:42612620); primary source throughout is
    Ding et al. (PMID:42297981). Companion records: Alzheimer_Disease,
    Amyotrophic_Lateral_Sclerosis, Lung_Carcinoma, Type_2_Diabetes_Mellitus,
    Frontotemporal_Dementia, and the cellular_senescence module.

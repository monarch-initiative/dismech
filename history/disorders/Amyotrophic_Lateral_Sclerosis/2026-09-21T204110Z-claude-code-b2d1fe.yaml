  summary: Add phenothiazine/chlorpromazine ALS repurposing hypothesis discussion
  details: |
    Investigated chlorpromazine as a candidate ALS disease-modifying therapy at user request. Recorded the result as a kind: EMERGING_HYPOTHESIS discussion (hyp_als_phenothiazine_autophagy_repurposing) attached to pathophysiology#Impaired Autophagy, pathophysiology#TDP-43 Proteinopathy, pathophysiology#Motor Neuron Degeneration and treatments#, rather than as a treatments: entry: there is no human ALS evidence for chlorpromazine and no registered trial. Fifteen evidence items across thirteen references, five SUPPORT and ten REFUTE-direction, all exact-quote verified against newly cached references_cache entries. Supporting lines: chlorpromazine opens lysosomal TPC2 in NSC-34 motor neurons driving TFEB-dependent autophagy and protecting against L-BMAA (PMID:40796055); an unbiased neuronal autophagy-inducer screen returned two phenothiazines as top hits and showed TDP-43 clearance in human stem-cell-derived neurons (PMID:24974230); thioridazine cleared TDP-43 aggregates in cells and Drosophila (PMID:34571136). Refuting lines: the same thioridazine paper reports clearance as proteasome-dependent and autophagy-independent, so the class does not share one mechanism; chronic pimozide worsened motor function, shortened SOD1-G93A survival and increased insoluble TDP-43 (PMID:29790082) after a short human ALS trial showed target engagement (PMID:29202456); clozapine's dose-response changes sign with high-dose hindlimb rigidity (PMID:14598305); methylene blue, the closest chemical relative, went from cellular TDP-43 clearance (PMID:19560462) to no effect in two ALS mouse models (PMID:22230045, PMID:21998625); the founding epidemiological premise (PMID:17475413) is contradicted by a positive ALS-schizophrenia genetic correlation predicting increased comorbidity (PMID:28322246); chlorpromazine specifically inhibits SOD1 activity where trifluoperazine activates it (PMID:33663349); and antipsychotic-associated oropharyngeal dysphagia acts on the same bulbar axis ALS already fails along (PMID:29023321). Two proposed experiments record the decisive test, ordered: a TPC2/TFEB engagement versus tolerated-CNS-exposure window study, then a dose-ranging two-model survival study. Companion analysis: docs/reports/chlorpromazine-als-repurposing-hypothesis-2026-09-21.md. Validated with just validate (240/240 snippets verified), check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-snippet-length.

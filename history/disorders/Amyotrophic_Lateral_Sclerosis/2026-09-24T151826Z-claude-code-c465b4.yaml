  summary: Repair three reference-validation failures blocking CI on PR 12655
  details: |
    CI repair round for PR #12655. The required Build and test check failed on three
    reference-validation errors in this entry; all three are fixed here and nothing
    else in the entry was changed.

    1. Upstream title drift, 17 occurrences. StatPearls archived PMID:33085325 and
       renamed the chapter to "Electrodiagnostic Evaluation of Motor Neuron Disease
       (Archived)." The entry's reference_title and references[].title values were
       correct when written. The cache file was regenerated with just fetch-reference
       and every string copied from its title frontmatter line. The archived revision
       also reworded two sentences, which broke the snippet quoted by both GTEx
       dataset records; that snippet was re-quoted verbatim from the current cached
       text (the claim is unchanged, only the source's wording moved).

    2. PMID:19118816, pathophysiology "Vesicular and Endolysosomal Trafficking
       Failure". The quoted sentence on PI(3,5)P2-mediated retrograde trafficking is
       in the paper's introduction, i.e. full text only, and the CI gate validates
       with --no-full-text, so it is unverifiable there. Replaced with the abstract
       sentence stating FIG4's enzymatic identity, and added PMID:16954148 (Rutherford
       et al., J Cell Sci 2006) as the source for the endosome-to-trans-Golgi
       retrograde transport step, graded IN_VITRO and INDIRECT because that study
       examines PIKfyve, the kinase generating PI(3,5)P2, and not FIG4. The node
       description was narrowed to match what those two abstracts state: the
       "late endosomal membranes" qualifier was also full-text-only and is gone.

    3. PMID:36543887, biochemical "Neurofilament Light Chain (NfL)". The quoted
       sentence is from the review's Key Points box, not its PubMed abstract, so it
       also fails under --no-full-text. Replaced with two abstract quotes from
       PMID:32385188 (Benatar et al., Neurology 2020), the prospective multicentre
       validation study, which state the prognostic and pharmacodynamic claims the
       marker record makes. PMID:36543887 is still cited elsewhere in the entry with
       an abstract-sourced snippet and was not removed.

    Items 2 and 3 are pre-existing evidence in this entry, not content this PR added;
    CI validates the whole changed file, so they had to be repaired to get the check
    green.

    Validation: linkml-validate, linkml-term-validator, count-verified-snippets
    (396/396), check-reference-titles, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (0 findings over 139 gene bindings), and
    validate-disorders over both changed entries.

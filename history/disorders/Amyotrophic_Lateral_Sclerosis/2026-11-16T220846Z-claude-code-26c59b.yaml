  summary: Add SARM1 axon-degeneration node and SARM1 susceptibility row
  details: |
    Added a SARM1-Mediated Axon Degeneration pathophysiology node (SARM1, GO:0003953 NAD+ nucleosidase activity INCREASED, downstream to Motor Neuron Degeneration) and a SARM1 Constitutively Active Variants genetic row (SUSCEPTIBILITY, GERMLINE). Evidence: PMID:34991663 (more than fivefold enrichment of constitutively active SARM1 alleles in 8507 ALS patients vs 9671 controls; SARM1 V184G causes axon loss and motor dysfunction in mice) and PMID:31661035 (Sarm1 deletion protects motor axons and NMJs in TDP-43Q331K mice but not behaviour). Lead came from an OpenScientist repurposing assessment in experiments/biomni_lead_exploration/als/. The NB-4746 trial (NCT07369076) was not added: neither the registration nor PubMed states its target, so a SARM1 link could not be cited. The ClinGen export has no SARM1 record. Validated with just validate (349/349 snippets verified) and the whole-repo KB gates.

  summary: Add skeletal myocyte plasma proteomic aging clock biomarker
  details: |
    Curated the skeletal myocyte plasma proteomic aging clock from Ding et al. (PMID:42297981, Nat Med 2026) as a biochemical biomarker with a PREDICTS readout onto Motor Neuron Degeneration. This was the strongest disease/cell-type pairing in the whole study; extreme vs youthful skeletal myocyte aging carried a 12.7-fold higher risk of incident ALS over 15 years of UK Biobank follow-up, and 53 of 57 (93.0%) skeletal myocyte extreme agers in the GNPC ALS cohort had an ALS diagnosis. The readout evidence is deliberately the sentence showing the signal persists for cases diagnosed more than three years after the blood draw, because that is what answers the reverse-causation objection for a prognostic marker of a rapidly progressive disease. Grounded to NCIT:C97139 Proteomic Profile with CL:0008002 skeletal muscle fiber. Curated as an observational prognostic association, and the note states explicitly that this does not establish myocyte aging as an initiator of motor neuron degeneration; the likeliest reading is that the plasma signature reports early denervation-associated muscle change. Validation: linkml-validate clean; term validation passed; all new snippets verified as exact literal substrings of the cached full text.
    Source of this curation: the Cell Reports Medicine Spotlight by Heikal & Salama
    (PMID:42612620, doi:10.1016/j.xcrm.2026.102996), which surveys Ding et al.
    Numbers were taken from the primary paper, not the commentary: the Spotlight
    presents the astrocyte HR 12.59 (extreme vs youthful) as directly exceeding
    APOE4's HR 5.30, but those come from two different comparisons in Ding et al.
    The commentary is not cited as evidence because its cached record carries only
    the teaser sentence, which states no finding of its own.

  summary: 'Integrate assessed OpenScientist findings: C9orf72 ASO trial, tofersen
    qualification, STMN2/UNC13A, aggregation mismatch'
  details: |
    Integration pass over the two OpenScientist hypothesis reports for ALS, driven by the existing codex assessments (no new assessment sidecars written; openscientist-assessment-by-codex.yaml already present in both hypothesis folders).

    From canonical_motor_neuron_proteostatic_failure_model (verdict PARTIALLY_SUPPORTED): added PMID:39059407, the primary randomised placebo-controlled BIIB078 phase 1 publication, to the canonical hypothesis evidence so the C9orf72 ASO failure no longer rests only on a review (assessment claim c9orf72-biib078-outcome, RETAINED). Added PMID:34873335 (cross-ancestry ALS GWAS) as the human-genetic basis for the convergence framing (claim canonical-convergence-model, QUALIFIED). Rewrote the hypothesis description and notes to drop the assertion that DPR-mediated toxicity likely dominates the C9orf72 axis: per assessment claim c9orf72-failure-mechanism, one negative ASO programme cannot separate incomplete target engagement, timing, antisense-strand transcripts, DPR toxicity, haploinsufficiency, or persistent TDP-43 pathology. Added a fourth qualification recording that the tofersen validation is target-engagement- and biomarker-led. Qualified the Tofersen treatment description accordingly and added two evidence items: PMID:36129998 (VALOR conclusion that clinical endpoints did not improve over 28 weeks) and PMID:41661214 (integrated VALOR plus open-label-extension 148-week early-start analysis, recorded as numerical and open-label). Added PMID:41890591 to the Axonal Transport Dysfunction node with directness INDIRECT, flagged in the explanation as a single-author review proposing the upstream framework rather than demonstrating it (claim axonal-transport-upstream-evidence, QUALIFIED). Added a new HUMAN_MODEL_MISMATCH discussion, mismatch_tdp43_aggregation_dispensability, carrying PMID:23382207 (TDP-43 Q331K/M337V mice degenerate without aggregation or nuclear clearance) against the near-universal human aggregation finding, with a proposed isogenic iPSC dissociation experiment (claim aggregation-late-stage-inference, QUALIFIED).

    From tdp43_rna_dysregulation_selective_vulnerability_model (verdict PARTIALLY_SUPPORTED): added PMID:37996528 to the cryptic-exon to Axonal Transport Dysfunction edge (in vivo stathmin-2 loss causes neurofilament-dependent axonal caliber collapse and denervation). Added PMID:38979232 to the cryptic-exon to Motor Neuron Degeneration edge (UNC13A cryptic exon drives the synaptic deficit and splice-switching ASOs rescue it). Added PMID:35767949 to the same edge as a REFUTE item: Stmn2 knockout mice reproduce fast-fatigable motor-unit denervation without axon or motoneuron degeneration, so the STMN2 arm is not sufficient for motor-neuron death; the edge description now says so. Added PMID:35767949 and PMID:39603486 to the existing gap_als_tdp43_selective_vulnerability_and_spread knowledge gap, since neither Stmn2 loss alone nor Stmn2 plus TDP-43 Q331K produces degeneration.

    Deliberately not integrated: PMID:41670738, the four-patient Icelandic tofersen case series, because the assessment (tofersen-case-series-causality, QUALIFIED) holds that an uncontrolled series of four G94S patients cannot add causal support beyond the trial evidence now curated. PMID:37532939 and PMID:39260416, because the assessment (filament-disease-context, QUALIFIED) establishes that both concern FTLD-TDP types A and C rather than ALS motor-neuron vulnerability. The five seven-upstream-triggers citations, because the assessment holds the list is a lead set rather than a demonstrated hierarchy, and the entry already carries gap_als_tdp43_mislocalization_upstream_trigger for that question. No hypothesis status was changed: the report's own candidate status change asks to retain CANONICAL, and the EMERGING status of the TDP-43 model remains correct. No new ontology terms were bound, since the assessments reject the reports' proposed CL and GO identifiers.

    Validated with count-verified-snippets (225/225), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens, check-snippet-grading, check-title-snippets and check-snippet-length.

  summary: Enumerate 18 gene-defined subtypes and wire ALS genes into the pathograph
  details: |
    Gene-defined subtype enumeration under the adult ALS umbrella (issue #12229, epic #12189). Sanity-checked the parent anchor first: MONDO:0004976 is the genuine umbrella and all 18 checklist terms descend from it through MONDO:0005144 (familial amyotrophic lateral sclerosis), which is a direct child; the four FTDALS terms are additionally parented under MONDO:0030923. Checked at the OLS MONDO endpoint. Added 18 gene-defined has_subtypes rows (ALS6, ALS8-ALS12, ALS15, ALS18-ALS21, ALS23, ALS26, ALS28, FTDALS1, FTDALS4-FTDALS6), each with a bound subtype_term, bound genes, description and exact-quote evidence from the discovery report. The four pre-existing clinical rows are kept as a second axis. Added 15 genetic records and gave gene_term bindings to the five pre-existing records that had none (C9orf72, SOD1, TARDBP, FUS, NEK1), which were previously invisible to any gene query. Wired genes into the pathograph: three new pathophysiology nodes (RNA-Binding Protein Mislocalization and Stress Granule Dysfunction for FUS, TIA1, HNRNPA1 and MATR3; Vesicular and Endolysosomal Trafficking Failure for VAPB, ANXA11 and FIG4; Loss of Neurotrophic and Angiogenic Support Signaling for ERBB4 and ANG), plus UBQLN2 and CCNF bound onto the existing Impaired Autophagy node. Gene-to-mechanism wiring moved from 6/22 to 23/36. Two subtypes are graded against their own counter-evidence: ALS26 (TIA1) carries the Project MinE consortium's published challenge as a REFUTE item and its genetic record is DISPUTED; ALS28 (LRP12) carries the European non-replication and is left unwired to any node. FIG4 is graded RISK_FACTOR on the primary report's own framing, which disagrees with Orphanet. TAF15 was deliberately not added to the stress-granule node for lack of a source. The animal-model links that make this entry a CLAUDE.md worked exemplar were not touched: the diff is insertion-only. Self-review found the 97% TDP-43 figure was uncited throughout the entry and the SOD1 "1-23% of familial ALS" range was uncited and mis-pointed at a case_fractions block that reports a single 24.2% cohort; both are now sourced, and the per-gene familial-ALS shares for SOD1, TARDBP and FUS were replaced with population-stratified figures from a 111-study meta-analysis. Three GeneReviews chapters and one StatPearls chapter are now cited and tagged, closing a pre-existing baseline gap. Validated with just validate, validate-terms, count-verified-snippets (307/307), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-genereviews, check-snippet-grading, prose-figure-audit and validate-disorders.

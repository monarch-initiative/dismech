  summary: Manual claim-by-claim evidence review of ALS entry
  details: |
    Detailed, manual (non-scripted) claim-by-claim review of the Amyotrophic
    Lateral Sclerosis entry. Every evidence snippet was verified as an exact
    (whitespace-normalized) substring of its cached reference, and each
    explanation/`supports` value was semantically checked against what its
    snippet actually shows. 190 evidence snippets verified as exact substrings
    with zero fabrications/misquotes; schema and term (--labels) validation pass.

    Problems found and FIXED in this session:
    - Military Service (PMID:14504315): snippet had an appended terminal period
      not present in the source (source has a comma). Trimmed to an exact quote.
    - Motor Neuron Degeneration (PMID:38521060): the chosen snippet ("ALS and
      FTLD share many clinical, pathological, and genetic features") did NOT
      support the explanation's claim about cortical layer-5 vulnerability.
      Replaced with the paper's actual layer-5 sentence and upgraded PARTIAL ->
      SUPPORT; added evidence_source: HUMAN_CLINICAL.
    - Smoking (environmental): notes called smoking a "confirmed risk factor,"
      but the cited meta-analysis (PMID:20639382) reports overall pooled RRs
      that are NOT statistically significant (CIs cross 1.0) and concludes the
      signal is sex-specific (women). Reworded notes to match the evidence,
      downgraded the overall-estimate item to PARTIAL, and added the exact
      sex-stratified sentence (women RR 1.66, 1.31-2.10) as SUPPORT.
    - C9orf72 (pathophysiology node + genetic entry): the "~40% of familial /
      5-10% of sporadic" figures were unsupported by the cited discovery paper
      (PMID:21944778 gives 23.5% familial). Added the canonical cross-sectional
      frequency study (PMID:22406228, Majounie 2012): 39.3% familial, 7.0%
      sporadic, fetched via linkml-reference-validator cache.
    - Added a missing `classifications` block: harrisons_chapter NEUROLOGIC and
      mechanistic_category "proteotoxic disease" (TDP-43 proteinopathy /
      proteostatic failure), consistent with 370 sibling entries.

    Outstanding items (NOT changed here; tracked as a GitHub review issue):
    - SOD1 (~20% fALS / ~2% sporadic), TARDBP (~5%), FUS (~5%) percentages live
      in `notes` without a directly supporting citation.
    - Neuroinflammation node describes microglial/astrocytic cytokine release but
      its only evidence (PMID:34440810, PARTIAL) is about T-cell recruitment; a
      microglia/astrocyte-specific citation would strengthen it.
    - Deprecated `updated_date` field is still present and being bumped; per
      CLAUDE.md it is deprecated (git history is authoritative). Left in place to
      avoid unrelated churn.

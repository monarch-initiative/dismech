  summary: Narrow the chlorpromazine ALS hypothesis to the NAADP/Ca2+ arm of TPC2
    pharmacology
  details: |
    Follow-on to the 2026-09-21 session's hyp_als_phenothiazine_autophagy_repurposing discussion, after exploring TPC2 as a target. Added three REFUTE evidence items and two rationale paragraphs recording a finding that narrows the hypothesis materially. TPC2 ion selectivity is set by the activating ligand: a NAADP-mimetic evokes non-selective cation currents and strong Ca2+ signals, a PI(3,5)P2-mimetic evokes Na+-selective currents and weak ones, and the two drive lysosomal pH and exocytosis in opposite directions (PMID:32167471). The chlorpromazine result sits on the NAADP arm, since the paper benchmarks the chlorpromazine-evoked current against NAADP and its mimetic TPC2-A1-N and blocks it with trans-Ned-19. That arm has no in vivo efficacy precedent anywhere: the lysosomal-storage rescue used the PI(3,5)P2-mimetic TPC2-A1-P throughout including its MLIV mouse, and in LRRK2 Parkinson's models the beneficial agonist was one biased to reduce Ca2+ permeability with TPC2 itself pathogenic (PMID:40279672). Also recorded why switching sign is not the escape route: trans-Ned-19, the antagonist that is neuroprotective in stroke and corrective in LRRK2 models, attenuates Ca2+ transients in zebrafish caudal primary motor neurons and inhibits their axon extension (PMID:32546534), so in a motor-neuron disease the better-developed arm of TPC2 pharmacology acts against the arm of TPC2 biology motor neurons need. Consequence for the recorded experiments: the window study should additionally read out the PI(3,5)P2-biased mode, because if motor-neuron TDP-43 clearance tracks that mode the useful compound is a biased TPC2 agonist rather than an antipsychotic, which removes the dopaminergic window problem entirely. The existing experiments were left in place rather than rewritten; the rationale states the added readout. Discussion now carries 18 evidence items (5 SUPPORT, 13 REFUTE) and cross-references controversy_tpc2_direction_of_modulation on kb/modules/lysosomal_substrate_accumulation.yaml for the general direction question. Companion analysis: docs/reports/tpc2-target-exploration-2026-09-26.md. Validated with just validate (243/243 snippets verified), check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, check-qualifier-terms.

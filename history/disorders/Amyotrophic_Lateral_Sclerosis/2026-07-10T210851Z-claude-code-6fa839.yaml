  summary: Add naturally-occurring veterinary animal model entries to ALS
  details: |
    Added an animal_models section with two naturally-occurring veterinary ALS
    analogs, implementing the design decision from issue #6023:

    1. Canine degenerative myelopathy (DM): SOD1 c.118G>A (p.E40K) homozygous
    mutation across five breeds (Pembroke Welsh Corgi, Boxer, Rhodesian Ridgeback,
    German Shepherd Dog, Chesapeake Bay Retriever). Cited Awano et al. 2009 PNAS
    (PMID:19188595), which formally identified canine DM as the first recognized
    spontaneously occurring animal model for ALS, with SOD1-immunoreactive
    cytoplasmic inclusions mirroring human ALS pathology.

    2. Equine motor neuron disease (EMND): naturally occurring lower motor neuron
    disease linked to chronic vitamin E deficiency and oxidative stress. Cited
    Divers et al. 1994 (PMID:7988544) for clinical/pathological description and
    de la Rue-Domenech et al. 1997 (PMID:9373362) for vitamin E deficiency as
    key risk factor.

    Added a HUMAN_MODEL_MISMATCH discussion flagging that EMND involves
    predominantly lower motor neurons only, limiting direct phenotypic equivalence
    to classic ALS which requires combined UMN+LMN degeneration. The discussion
    includes a proposed experiment to assess corticospinal tract pathology in
    post-mortem EMND horses.

    VBO breed ontology binding deliberately excluded per issue guidance (VBO not
    yet wired into schema prefixes or oak_config.yaml). Breeds recorded as free
    text in background/description fields following Achromatopsia precedent.

    All three PMIDs fetched via just fetch-reference. All snippets are exact
    substrings of the fetched abstracts. Validated with just validate (schema,
    terms, references all pass).

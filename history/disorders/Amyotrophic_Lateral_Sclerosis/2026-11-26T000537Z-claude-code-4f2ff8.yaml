  summary: 'Gene-family review: HK1'
  details: |
    HK1 sits on the TDP-43-Driven Glycolytic Failure node, which named only a decreased glycolytic process. The node now binds HK1's own activity, hexokinase activity, as DECREASED: cytoplasmic TDP-43 binds and sequesters HK1, and ALS spinal cord shows reduced HK1 protein (PMID:41838122, already cited on the node). HK1 is not a genetic cause of ALS here and has no genetic record; TARDBP's own molecular function on this node was left for its gene family's review.

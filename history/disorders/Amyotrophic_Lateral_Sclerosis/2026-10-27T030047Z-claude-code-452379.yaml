  summary: 'Amyotrophic_Lateral_Sclerosis: link Neuroinflammation to neuroinflammation_glial_activation'
  details: |
    Linked the Neuroinflammation node to neuroinflammation_glial_activation#Reactive Microglial and Astrocytic Activation, which matches its microglia and astrocyte cell types and its description of glia driving motor neuron death. Added GO:0001774 microglial cell activation and GO:0048143 astrocyte activation (INCREASED). Added an edge to Motor Neuron Degeneration, which the node's description already asserted, supported by the existing microglial SOD1 mouse result (PMID:16741123, MODEL_ORGANISM) and patient-astrocyte toxicity (PMID:21832997, IN_VITRO). Added primary human evidence: [11C](R)-PK11195 PET showing increased microglial activation in motor cortex correlating with upper motor neuron signs (PMID:15056468). The Microglial TREM2 Signaling node was deliberately not linked: TREM2 is not one of the pattern-recognition receptor families the module's danger-sensing node is defined by, and the node's only evidence is one general review sentence. Refs issue 15590. Validated with just validate and count-verified-snippets.

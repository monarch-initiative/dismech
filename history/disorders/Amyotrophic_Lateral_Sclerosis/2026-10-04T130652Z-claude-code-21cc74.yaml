  summary: Add cellular senescence pathophysiology node
  details: |
    Added new pathophysiology node 'Cellular Senescence in Motor Neurons and Glia' that conforms to the cellular_senescence module. This node captures how aging-associated senescence emerges early in motor cortex and spinal cord in ALS disease models and drives neuroinflammation. Linked downstream to Neuroinflammation node with directness: INDIRECT (the source shows microglial senescence reduction but the explicit SASP-neuroinflammation link is inferred). Cell types refined to microglia only, based on source statement of "cortical microglia" at cellular level. Evidence from PMID:42759848 demonstrates senescence markers in microglia and validates senolytic therapeutics (dasatinib + quercetin) as a disease-modifying approach. Addressed review feedback to restore unmodified reference_cache files and align claims to source evidence.

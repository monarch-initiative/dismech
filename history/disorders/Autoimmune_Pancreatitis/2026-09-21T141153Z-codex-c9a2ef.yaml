  summary: Review autoimmune pancreatitis mechanisms, subtype scope, diagnosis and
    treatment evidence
  details: |
    Comprehensive review of the complete entry, every inherited cited source, the matching deep-research report and citation set, and the full clinical baseline in StatPearls and the European and international consensus guidelines. Actual full scientific bodies, available tables, methods and figure captions were consumed, including the immune-cell studies, mouse interventions, candidate-gene studies, pancreatic-function cohorts, Japanese surveys, MITIGATE trial, 2025 FDA label and general exocrine-insufficiency guidance. Independent readers audited the cytotoxic-T-cell and NET/pDC studies and the integrated mechanism and clinical-care sections.

    Rebuilt twenty atomic mechanisms separating systemic type 1 IgG4-related disease from type 2 duct-centric neutrophilic disease, measured cell and antibody observations from inferred mediators, and acinar from endocrine-islet injury. Human immune-cell cohorts are not automatically pancreatic cohorts. Preventive mouse interventions, neonatal antibody transfer, isolated-cell results and salivary gene transfer retain their actual species, timing, tissue and readout limits. IgG4 secretion does not establish de novo class switching, peripheral cytotoxic markers do not prove pancreatic killing, and IFNAR blockade does not isolate interferon-alpha from beta. The already published antibody-transfer experiment replaces an inherited proposal to perform it.

    Expanded eleven clinical findings, six diagnostic records, fourteen care entries, three animal and three experimental models, one trial and four interpretive discussions. Added contemporary Japanese population estimates with response and denominator limits, selected-cohort relapse and functional-outcome data, and distinct extrapancreatic involvement. Corrected candidate single-base indels previously described as gene copy-number associations; retained the corrected CTLA4 significance and untested functional mediation. Autoantibody targets are biochemical observations rather than germline disease genes. Neither a proposed checkpoint-inhibitor subtype nor uncertain pancreatic cancer risk is promoted to an established causal pathway.

    Care now distinguishes induction, selective maintenance, limited steroid-sparing evidence, type 2 anti-TNF case reports, cancer exclusion, selective drainage, pancreatic enzyme replacement and nutritional follow-up. The randomized inebilizumab result is systemic IgG4-related disease with matched glucocorticoid taper, not a pancreas-only or type 2 trial, a rituximab comparison or proof of fibrosis reversal. The current US indication and safety restrictions are retained. Guideline recommendations and clinical response do not directly measure histological depletion; their corresponding treatment-target evidence is graded indirect.

    A regenerated PMID31872350 cache had incorrectly attached the different 2021 survey to the 2016 publication. Sanctioned abstract-only regeneration restored the correct bibliographic identity, while the actual 2021 full paper is separately cited. All cache changes were produced by fetch-reference; no cache was hand-edited and the frozen dataset-accession blob was neither read nor modified. Authoritative schema, live ontology, cached-quote validation and repository guards accompany the review.

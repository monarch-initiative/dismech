  summary: 'Add classifications block (round 1 follow-up, #11233)'
  details: |-
    Adds the classifications block. GASTROINTESTINAL plus IMMUNE_RHEUMATOLOGIC, both with
    cited evidence from PMID:32809604.

    The two Parts track the split the whole entry is organised around. The pancreas is the
    target organ in all three subtypes, which fixes the GI Part. The immune Part is there
    because type 1 is the pancreatic manifestation of a systemic disease that also produces
    sclerosing cholangitis, retroperitoneal fibrosis, tubulointerstitial nephritis and
    sialadenitis, so a reader arriving from the IgG4-related disease literature should land
    here. Type 2 and type 3 are immune-mediated but pancreas-restricted, which is one more
    place the three-subtype structure shows through. The cited sentence states the
    organ-restricted and systemic readings as alternatives, which is why both Parts are
    assigned rather than either alone.

    No icimd_category: this is not an inherited metabolic disorder. No icdo_morphology: not
    neoplastic, notwithstanding that the entry is largely about being mistaken for a cancer.

    Validated: just validate-disorders (93/93, up from 91 - the two classification evidence
    items are new snippets), just validate-terms, and the full ungated set: snippet length,
    title snippets, snippet grading, folded hyphens, environmental evidence, enum values,
    duplicate keys, entity refs, causal targets, qualifier terms. Green.

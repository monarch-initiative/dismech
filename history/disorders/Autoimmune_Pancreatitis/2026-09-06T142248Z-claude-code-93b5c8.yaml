  summary: 'Round 4: two fabricated trim justifications, a third false negative-existence
    claim, and two suggestions'
  details: |-
    Round-4 findings. Two were fixed in the previous local commit (the Storiform Fibrosis
    description, the NCT reference_title); the rest are here.

    Two snippets trimmed with justifications that were not true. The phlebitis quote began
    mid-word at "e than ten", justified by saying the sentence runs "more than ten" and was
    trimmed to start at the threshold. The imaging quote stopped at "(e", justified by claiming
    the snippet matcher treats an abbreviation's periods as sentence structure. It does not -
    the matcher does normalised substring matching with no notion of sentence structure at all.
    Both full sentences verify exactly; the reviewer patched and tested them before reporting,
    and I confirmed the same. Neither trim was necessary. Both quotes are now full sentences and
    both justifications are deleted.

    That is instances four and five in this session of the same pattern: when a quote does not
    fit neatly, inventing a mechanical reason for the trim rather than checking whether the trim
    is needed. So I audited all five entries in this batch for trim-justification prose and
    tested each claim by writing the fuller quote and running the validator. Six claims, four
    false. The two that hold: this entry's extrapancreatic quote genuinely stops before an
    enumeration, and cblJ's isotope-label claim is true - the validator strips bracketed content
    from a snippet before matching, so a quote containing [(14)C]propionate cannot match a cache
    that retains it. That is a real mechanism I only learned by testing a claim I had guessed at.
    The other two false ones are fixed on their own PRs.

    A third false negative-existence claim. The imaging notes said the named criteria frameworks
    were not curated "because no cited source in this entry states their content in a quotable
    sentence". PMID:36293522, cited seven times here, states the ICDC's standing directly. Now
    quoted, with the notes rewritten to record the pattern rather than just the correction:
    after "HPO has no term for a tumefactive pancreatic mass" and "no randomized trials other
    than glucocorticoid maintenance have been performed", this is the third assertion in this
    entry that something does not exist, contradicted by a file committed alongside it. The rule
    that would have caught all three is one grep.

    Suggestion 5 taken: the type 3 discriminator is now cited. The phlebitis node's description
    claimed checkpoint-inhibitor pancreatitis does not produce obliterative phlebitis, and both
    of the node's evidence items were about the type 1 triad, so that half of the sentence was
    uncited. PMID:41922528 reports the absence of all three triad elements in ICI-P directly.

    Suggestion 6 taken, and it improved the entry rather than just satisfying the note. The
    PET/CT item quoted a paper's statement that it would discuss PET/CT, which is not a finding
    about PET/CT. Replaced with a measured result from PMID:41922528: 16% focal mass-like
    enlargement, 66% focal uptake mimicking metastatic disease. That lands on this entry's
    central theme from a new direction - in the type 3 arm the imaging itself creates the
    cancer-mimicry trap that types 1 and 2 create histologically.

    Validated: just validate-disorders 101/101, just validate-terms,
    pytest tests/test_data.py -k Autoimmune_Pancreatitis (2 passed), model-scale-audit --strict,
    a programmatic audit confirming zero evidence items lack reference_title, and the full
    ungated set: snippet length, title snippets, snippet grading, folded hyphens, environmental
    evidence, enum values, duplicate keys, entity refs, causal targets, qualifier terms.

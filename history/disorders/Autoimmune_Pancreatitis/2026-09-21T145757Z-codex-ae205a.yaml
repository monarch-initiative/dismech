  summary: Resolve review bindings and qualify genetic and exposure evidence
  details: |
    Addressed the automated review in one consolidated follow-up: used the specific CD4-positive alpha-beta cytotoxic T-cell term, classified biliary stenting as DEVICE and pancreatic surgery as SURGERY, and added matching treatment bindings. Added pharmacotherapy, supportive-care, dietary-intervention and histopathological-assessment bindings where they match the complete record. Composite follow-up retains its MONITORING category; available Follow-Up and Patient Monitoring concepts did not satisfy the current treatment-action enum, so no forced narrow procedure was assigned. Tagged the cited StatPearls reference. Evaluated fibrotic-module conformance but did not assert its complete activation/matrix-turnover contract from measured T-cell cytokine secretion plus tissue fibrosis. Evaluated the optional genetic suggestions: the CACNA1S/SMAD7 sequence-panel candidates remain explicitly exploratory; fetched and read the genuine primary FCRL3 letter PMID16905709, including its cohort and genotype table, rather than misattributing that experiment to CTLA4 PMID18341485. Added the small Japanese case-control association with genotype-versus-allele, comparator, replication and functional-linkage limits. An independent peer read full PMID41728618, PMID35807009 and the actual occupational primary PMID34816110. Added one occupational-history association for the combined IgG4-cholangitis/type 1 AIP cohort, with selection/recall/confounding limits and no invented causal target. Smoking is recorded as an uncertain diabetes association among established type 1 AIP patients, not a cause of AIP. All225 evidence excerpts verify; schema and term validation, scoped/whole-KB guards, history and formatting checks are completed for the final follow-up before push.

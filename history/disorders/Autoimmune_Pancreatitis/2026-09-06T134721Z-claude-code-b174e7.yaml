  summary: Round 2 findings 2, 3, 4 and 6
  details: |-
    Round-2 findings 2, 3, 4 and suggestion 6. The critical and suggestion 5 were pushed
    separately in f3f24d2 before the full review body was available.

    Finding 2, obliterative phlebitis. Now a pathophysiology node, fed by the
    lymphoplasmacytic infiltration node. The reviewer's framing was right: its two companions
    in the type 1 histologic triad are both first-class nodes here, so the third one's absence
    read as oversight rather than scoping. Two independent sources are quoted rather than one,
    because the node is being added late and its membership of the triad is the entire
    justification for it. The node description also records that it is absent in
    checkpoint-inhibitor pancreatitis, which makes it a subtype discriminator rather than only
    a type 1 feature.

    Finding 3, imaging diagnosis record. Added. The substance is not the modalities but an
    asymmetry between subtypes: type 2 has no serum marker and no extrapancreatic disease, so
    histologic evaluation is required rather than supportive, which is why EUS-guided core
    biopsy is the modality that matters there. The entry stated the histological route without
    ever saying why the two subtypes need different routes to one diagnosis. PET/CT is graded
    OTHER and INDIRECT because the only cited source is a case report discussing the modality,
    not a diagnostic accuracy study.

    The named frameworks (ICDC, HISORt, JPS) are deliberately not curated, with the reason in
    notes: no cited source in this entry states their content in a quotable sentence, and
    naming them without being able to quote what they require is exactly the confident
    unsourced prose this entry has already had to correct twice.

    Finding 4, missing reference_title on the environmental evidence item. Added.

    Suggestion 6, Greek letters. This one is more than cosmetic. Titles and snippets carried
    "IFN-alpha" and "CD8alpha" where the caches carry "IFN-α" and "CD8α". They passed
    validation because the reference validator normalises a spelled-out Greek letter to its
    character - so transliterating α to "alpha" verifies silently, while transliterating it to
    "a" fails, which is how the same error was caught earlier in this PR and missed here. All
    occurrences now use the cached form. Third instance of normalising a source instead of
    quoting it in this PR alone.

    One error caught before pushing, and it is the third occurrence of a pattern. Inserting the
    diagnosis record before the clinical_trials: key put it at the end of animal_models,
    because animal_models: sits between diagnosis: and clinical_trials: in this file. YAML
    parsed, schema validated, and the record was in the wrong list. Caught by parsing the file
    and printing the membership of all three lists rather than trusting that it parsed. The
    same defect happened twice earlier in this session on other entries.

    Not taken, with reasons stated in the PR reply rather than in the entry: suggestion 7
    (occupational and smoking exposures - the smoking source reports metabolic outcomes rather
    than disease onset, and the occupational claim is a review assertion with no quotable
    result) and suggestion 8 (FCRL3, P2RX3, TOP1 - the three curated loci are the two
    GWAS-significant hits plus the one with relapse ORs, which is a defensible line).

    Validated: just validate-disorders 99/99, just validate-terms,
    pytest tests/test_data.py -k Autoimmune_Pancreatitis (2 passed), model-scale-audit
    --strict, and the full ungated set: snippet length, title snippets, snippet grading,
    folded hyphens, environmental evidence, enum values, duplicate keys, entity refs, causal
    targets, qualifier terms.

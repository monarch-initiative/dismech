  details: |-
    Round-3 findings 1 and 2. Findings 3 and 4 (obliterative phlebitis, imaging diagnosis
    record) and suggestion 5 (Greek letters) were already fixed in 188ec4b, which the round-3
    review had not seen - it ran on f3f24d2.

    Finding 1, missing reference_title. Two were named: the environmental one, fixed in
    188ec4b, and clinical_trials[0].evidence[0] on the MITIGATE registration record, fixed
    here. Rather than fix the two named, I walked the whole parsed entry for evidence items
    carrying a reference without a reference_title. The count is now zero. Fixing named
    instances one at a time is how the first of these survived a round.

    Finding 2 is the one worth recording. The Storiform Fibrosis description claimed the split
    would yield "a clean RECAPITULATES here". The link is PARTIALLY_RECAPITULATES, correctly,
    because the model reports fibrosis and architectural destruction rather than the storiform
    pattern specifically - which is exactly what the PROXY_QUANTITY divergence added in the
    previous round says.

    The sequence is worth being explicit about, because it is a failure mode rather than a
    typo. The sentence was written in round 1 describing an intended structure. The structure
    landed differently in round 2, when the split was actually implemented and the model link
    turned out to warrant a partial rather than a clean match. The prose was never re-read
    against what shipped. That is the same defect this entry corrects twice in its own notes -
    prose asserting something nobody re-checks once written - committed in the very paragraph
    explaining why the split was worth doing.

    The paragraph now describes what is actually in the file, and records that an earlier
    version of it was wrong, rather than being quietly overwritten. The general lesson, which
    generalises past this entry: a description that narrates a structural decision has to be
    re-read whenever that structure changes, and nothing enforces it. Node descriptions
    referencing relationship enum values are the specific pattern at risk.

    Validated: just validate-disorders 99/99, just validate-terms,

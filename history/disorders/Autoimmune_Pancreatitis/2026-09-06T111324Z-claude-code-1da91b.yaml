  summary: 'Review round 1: address all eight findings on PR #11233'
  details: |-
    Review round 1 on PR #11233. One critical, eight important and most suggestions
    addressed in one push. Evidence base goes from 61 to 91 verified snippets and from
    16 to 26 distinct references.

    CRITICAL. The PR title said MONDO:0006122, which is calcifying nested epithelial
    stromal tumor of the liver. The entry correctly uses MONDO:0015175. Title fixed. Same
    class of error as the cblJ history record in the sibling PR: an identifier written
    from memory rather than read from the file.

    1. Two false claims in notes: corrected, and the correction is recorded rather than
       silently made. The ontology paragraph asserted that four bindings were deliberately
       broader because no suitable term existed. Two of the four claims were false.
       HP:6000409 Pancreatic mass exists and the phenotype was bound to HP:0001732
       Abnormality of the pancreas; now bound correctly. HPO also has terms for the
       individual extrapancreatic manifestations. The third claim is moot because that
       phenotype was already split. Only the T follicular helper 2 claim stands. The
       paragraph now says all of this, because a claim that an ontology lacks a term is a
       factual claim about the ontology and nobody re-checks it once written.

    2. The no-trials claim: also false, and it appeared twice. The phase 3 MITIGATE trial
       of inebilizumab in IgG4-related disease (n=135, recurrence 10% vs 60% placebo, FDA
       approval 2025) is now curated as a clinical_trials record keyed on NCT04540497, with
       its registration cache fetched. The scoping question the reviewer anticipated is
       answered in the record rather than used to exclude the trial: MITIGATE enrolled
       IgG4-RD, not AIP, so it applies to type 1 and to nothing else here, and type 1 is
       the pancreatic manifestation of IgG4-RD. An inebilizumab treatment record carries
       both the efficacy and the harm result from the same trial.

    3. Subtype MONDO bindings added (MONDO:0017227, MONDO:0017228) via subtype_term, which
       is the correct slot - Subtype has no disease_term.

    4. Pancreatic mass rebound to HP:6000409.

    5. Extrapancreatic involvement supplemented with two separately bound records,
       sclerosing cholangitis (HP:0030991) and sialadenitis (HP:0031281), the two that
       change management. Both hang off the systemic adaptive node rather than off the
       pancreatic mass, which is the mechanistically correct parent: extrapancreatic
       disease is the same process in another organ, not a consequence of the pancreatic
       lesion, which is why it occurs in type 1 and never in type 2.

    6. The bundled node is split. IgG4-Positive Plasma Cell Infiltration and Storiform
       Fibrosis becomes IgG4-Positive Lymphoplasmacytic Infiltration -> Storiform Fibrosis.
       The split earns its keep immediately: the poly(I:C) mouse model reproduces the
       fibrosis and cannot in principle reproduce the IgG4 component, so what was one
       PARTIALLY_RECAPITULATES link with an apologetic limitations string is now a clean
       claim against each node. All entity references and model links repointed.

    7. Type 3 modelled rather than dropped. A new root pathophysiology node for
       checkpoint-blockade-induced acinar-centric T cell infiltration, plus an
       environmental: entry for the exposure with a TRIGGERS mechanism link. The node has
       no edge to the other two arms and does not reach the tumefactive mass, because most
       type 3 disease presents as asymptomatic lipase elevation - the shared endpoint that
       unites types 1 and 2 is absent here.

    8. Both missing mechanisms added. The innate ignition axis (NETs -> pDC activation ->
       IFN-alpha -> IgG4-selective class switching) is now the most upstream node in the
       type 1 arm and carries the only interventional evidence in the entry: pDC depletion
       and IFN-alpha blockade both prevent disease in the model. The CD4+SLAMF7+ cytotoxic
       T lymphocyte population is a new central effector node, fed by the plasmablast
       compartment, which is the edge direction that makes B-cell depletion a plausible
       treatment for a T-cell-mediated lesion.

    Suggestions taken: weight loss, abdominal pain phenotypes; a biochemical: section for
    circulating plasmablasts (the IgG4-independent biomarker that fills the 43%-sensitivity
    gap the entry already curates); HLA-DRB1 and FCGR2B GWAS loci and the four autoantigen
    candidates in genetic:, the last carrying a REFUTE item because the functional test of
    the autoantigen hypothesis was negative; anti-TNF-alpha for type 2, so the treatments
    section stops implying one disease; pancreatic-cancer SIR on the progression phase,
    quoted alongside the flat overall SIR so the raised figure is not read alone.

    Not done: eosinophilia (no cited source states it), and a comorbidities block (Disease
    has no such slot; comorbidity records live in kb/comorbidities/, which the entry notes
    already says for the IBD association).

    Sixteen uncited screening caches pruned with the criterion recorded in notes.

    Errors caught in myself this round, all of the same kind - normalising a source instead
    of quoting it: Greek alpha transliterated to "a" in two SLAMF7 snippets; the Lancet
    middle-dot decimal separator and multiplication sign rewritten as "." and "x" in two
    GWAS snippets; and, for the second time this session, a snippet truncated with a
    fabricated justification about the cache breaking a word across lines, which it does
    not. The reference validator caught the first two. The third I caught by checking the
    claim before committing it, having made the identical mistake on the PCD entry an hour
    earlier.

    Validated: just validate-disorders (91/91), just validate-terms, and the ungated
    whole-KB gates: snippet length, title snippets, snippet grading, folded hyphens,
    environmental evidence, enum values, duplicate keys, entity refs, causal targets,
    qualifier terms, model-scale-audit --strict, check-not4curation. All green.

  details: |
    Reviewed the Jev evidence_claim_match assessments (source revision fc510ecca0, which already includes the #12455 review) against the current entry and cached references. Replaced four weak snippets: (1) diagnosis 'Pancreatic exocrine and endocrine function assessment' now quotes the European IgG4-RD guideline sentence naming exocrine and endocrine insufficiency as long-term sequelae requiring surveillance, instead of the bare lifelong-follow-up recommendation; (2) the plasmablast readout on 'Circulating plasmablasts' now quotes PMID:24817416's finding that all 37 patients had elevated plasmablasts although 36% had normal serum IgG4, instead of the IgG4-only fragment; (3) the aip_human_causal_scope discussion now quotes PMID:29499100's organ breakdown (10 pancreatic cases) instead of a demographics sentence; (4) completed the truncated C18 calcium sentence from PMID:28634110. Removed the azathioprine-preference snippet from the mycophenolate target_mechanisms edge, where it did not bear on the inhibited mechanism; it stays on the treatment itself. Retained the highest-ranked flags unchanged: the H69 cholangiocyte model, galectin-3/prohibitin autoantibodies and the MITIGATE inebilizumab trial were flagged because the cited cohorts are IgG4-related cholangitis or systemic IgG4-RD rather than AIP-only, and each record already states that scope; re-reading PMID:38332916 confirmed the discordant-intervention and single-donor IgG details. just validate-disorders passed; 224/224 snippets verified.

  summary: 'Create: Autoimmune Pancreatitis'
  details: |-
      New Disease entry for MONDO:0006122, curated from an OpenScientist deep-research
      report plus primary literature. 61/61 evidence snippets verified against the
      committed reference cache, drawn from 16 sources.

      Architecture. Three has_subtypes (Type 1 IgG4-related, Type 2 idiopathic
      duct-centric, Type 3 immune-checkpoint-inhibitor-associated) over two parallel
      pathophysiology arms that meet only at the shared Tumefactive Pancreatic Mass
      node: the type 1 arm runs through oligoclonal plasmablast expansion,
      IgG4-positive lymphoplasmacytic infiltration and storiform fibrosis, the type 2
      arm through granulocytic epithelial lesions and duct-centric neutrophilic
      destruction. That shared endpoint is why the two present alike and are separated
      on histology rather than imaging.

      Evidence base. A first draft of this entry was sourced entirely from four
      narrative reviews, with one review supplying 14 of 29 snippets. That was
      corrected before opening the PR by adding eight primary studies:

      - Three Japanese nationwide surveys (PMID:22466167, PMID:25815647,
        PMID:31872350) replacing a qualitative RARE record with numeric point
        prevalence and annual incidence. The measured prevalence rises from 2.2 to
        4.6 to 10.1 per 100,000 across nine years; the entry records that rise but
        explicitly declines to read it as rising incidence, because the diagnostic
        criteria changed between surveys and EUS-FNA became routine over the same
        period.
      - A new progression section with two phases, covering the relapse trajectory
        from three cohorts that agree on shape and disagree on level (PMID:42185503,
        PMID:31872350, PMID:41223493), and long-term functional decline
        (PMID:35807009). The notes state why all three relapse estimates probably
        overstate population risk: each design excludes a different set of
        non-relapsing patients.
      - A new genetic section typing CTLA4 (hgnc:2505) as SUSCEPTIBILITY rather than
        causative, with the sample size, the absence of replication, and the
        imprecision of the relapse odds ratios stated in notes. Eleven further
        candidate genes from a 27-versus-30 NGS study are described in notes and
        deliberately not curated as entries.
      - A new animal_models section for the poly(I:C)/MRL-Mp model, with two
        ModelMechanismLinks and typed divergences. The SPECIES_MISMATCH divergence is
        marked INVALIDATING because mice have no IgG4 subclass at all, so the
        defining feature of the human lesion is structurally impossible in the model
        rather than merely unmeasured.
      - Diagnosis entries for serum CA 19-9 (a negative finding that is clinically
        load-bearing) and for the scale of misdiagnosis (PMID:39169289: AIP is 1.6%
        of resections for suspected cancer and 26% of resections that turn out
        unnecessary), plus the measured 43% sensitivity of serum IgG4 in that
        population.

      Curation changes. The bundled phenotype "Pancreatic exocrine and endocrine
      insufficiency" was split into two separately bound and separately quantified
      phenotypes (HP:0001738, HP:0000819) and the causal edge feeding it was
      retargeted to both. A truncated evidence quote on the extrapancreatic phenotype
      that ended mid-sentence at "including" was supplemented with a source that
      actually names the organ set.

      One discussion is recorded rather than resolved: aip_one_disease_or_two
      (CONTROVERSY) on whether type 1 and type 2 are subtypes of one disease or two
      diseases sharing a radiological presentation.

      Validated with just validate-disorders (61/61), just validate-terms, and the
      ungated whole-KB gates: snippet length, title snippets, snippet grading, folded
      hyphens, enum values, duplicate keys, entity refs, causal targets, qualifier
      terms, model-scale-audit --strict, check-not4curation.

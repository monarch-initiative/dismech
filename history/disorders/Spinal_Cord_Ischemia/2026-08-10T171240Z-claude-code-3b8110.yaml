  details: |
    Backfill for issue #8085. All three exposures are TRIGGERS with DIRECT into the spinal arterial supply disruption node, which names aortic pathology, dissection, embolism, hypotension and perioperative interruption of collateral supply in its own text; these exposures are the node's content rather than something acting on it from a distance. Fibrocartilaginous embolism keeps its own edge rather than being folded into the general embolism exposure, because it is the one mechanism that operates in patients with no conventional vascular risk factors, which is a clinically distinct claim. Grades track what each sentence shows rather than the shared directness: the single case in which collateral interruption was inferred rather than observed is PARTIAL, as is the fibrocartilaginous item, whose sentence is a recommendation about differential diagnosis rather than a measurement of frequency; the two aetiological series are SUPPORT. One thing worth recording rather than smoothing over: the cohort sentence cited for the dissection and hypoperfusion exposure leaves aetiology unclear in nearly a quarter of cases, which is noted in that link's explanation so the residual is visible alongside the attributed fractions. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 28 of 35 with 7 pre-existing DOI-prefix skips, none on items added here.

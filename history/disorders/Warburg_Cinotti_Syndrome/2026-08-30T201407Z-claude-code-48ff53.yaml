  details: |
    Addresses the CHANGES_REQUESTED review on PR 10178. Five blocking items. First, publication years: PMID:41259339 and PMID:41778429 are 2025, not 2026, so the description, the discussion rationale and two treatment texts were wrong, as were the derived intervals - the two-step mechanism resolution is seven years apart, not eight, and the dasatinib result is seven years old. Verified against the cache frontmatter and corrected everywhere; the other three entries in this run were checked for the same error and are correct. Second, the corneal neovascularization phenotype quoted a case-count sentence that did not support the claim; replaced with two on-claim quotes covering the corneal invasion itself and the diagnostic point that it can present without systemic features. Third, the pathophysiology node asserted a 2024 paediatric case in prose with nothing cited; the claim is now backed at the point it is made, and expanded to include the surgical-recurrence detail. Fourth, added five phenotypes quotable from already-cached sources - blepharophimosis, symblepharon, hearing impairment, multiple joint contractures - and bound the previously unbound palatal phenotype to HP:0000174. Fifth, added an environmental entry for ocular and cutaneous trauma or surgery with influences_mechanisms EXACERBATES against the ECM remodelling node, which is the review's key point: lesions are provoked by injury and accelerated by attempts to remove them, and that follows from the mechanism, since wounding supplies the collagen exposure that a constitutively active DDR2 cannot stop responding to. Also regraded three disease-background quotes from the in vitro enzymology paper from HUMAN_CLINICAL to OTHER with directness INDIRECT - the reviewer suggested this and I initially applied it only to the new phenotype, which check-snippet-grading correctly flagged as a divergence. The HPOA-derived phenotype list in the review is not fully consumed: those frequencies come from an HPO annotation table rather than a citable publication, and only the features stated in cached sources were added. Snippets 44/44 verified; all gates including check-environmental-evidence pass.

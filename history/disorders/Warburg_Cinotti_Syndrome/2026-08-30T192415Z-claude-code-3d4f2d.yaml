  summary: 'Create: Warburg-Cinotti Syndrome (MONDO:0032579, DDR2)'
  details: |
    De novo curation of Warburg-Cinotti syndrome (OMIM 618175) as a DDR2 receptor-tyrosine-kinase gain-of-function connective tissue disorder. Sources: Xu et al. AJHG 2018 (PMID:30449416, the six-individual founding series and the dasatinib result), the 2026 enzymology paper (PMID:41259339) establishing ligand-independent constitutive autophosphorylation and the activation-loop structural basis, plus case reports PMID:35036505, PMID:39095787 and PMID:41778429, and PMID:42323896 for the palatal spectrum statement. Six-node pathograph: activating kinase-domain missense variants -> ligand-independent constitutive DDR2 kinase activation -> dysregulated fibroblast ECM remodelling, branching to corneal neovascularisation, fibroproliferative and ulcerative skin disease, and acro-osteolysis with flexion contractures. This is believed to be the first KB entry to co-occur Descriptor.modifier GAIN_OF_FUNCTION with GeneticContext.functional_impact_category GAIN_OF_FUNCTION on the same pathophysiology node, which CLAUDE.md permits but notes had no worked example. The qualitative call is justified by measurement rather than inference: unphosphorylated DDR2-Y740C has catalytic rates matching fully phosphorylated wild-type, so the kinase is outside its regulatory constraints rather than merely running high. Two knowledge gaps recorded: the p.Asn144Ser neonatal variant whose reported in vitro result is a failure of p38 MAPK activation rather than a gain, curated with a REFUTE evidence item; and the eight-year-old dasatinib rescue that still has no patient outcome data. The DDR2 loss-of-function skeletal dysplasia contrast is deliberately omitted as uncited. Validated with just validate, count-verified-snippets (34/34), check-entity-refs, check-duplicate-keys and the four baseline gates.

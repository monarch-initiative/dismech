  summary: 'Create: X-linked_Intellectual_Disability-cerebellar_Hypoplasia_Syndrome'
  details: |
    New entry for MONDO:0010337 (OPHN1). Lump/split: kept as one Disease entry; ClinGen (Definitive, XL) curates OPHN1 cases with and without cerebellar hypoplasia under this single entity, so the no-cerebellar-anomaly families (PMID:29510240) are recorded as REFUTE evidence on the cerebellar phenotypes rather than as a separate entry. Name follows the MONDO and ClinGen label because MONDO carries no established OPHN1-related dyadic name. One OpenScientist deep research report was run and used as leads: 22/22 references resolved, 6/7 quotes matched (the miss is an ellipsis paraphrase of PMID:33638601), preflight-dr WARN because the report writes HGNC:8183 (OR1D2) beside OPHN1; the entry binds hgnc:8148 from HGNC via term validation and copies no identifiers from the report. Report term suggestions NCIT:C15193, C15327 and C15335 name unrelated procedures and were not used. Evidence comes from cached PubMed abstracts and full texts plus the cached ClinGen CGGV record; no GeneReviews chapter exists in the Bookshelf index. PMID:12807966 and PMID:27390894 have no abstract in PubMed and were not cited. GO:0010737 (protein kinase A signaling) turned out to be obsolete and was replaced with GO:0141156. Treatments are supportive only; fasudil is recorded as a KNOWLEDGE_GAP because all evidence is preclinical. Validated with just validate, validate-terms, count-verified-snippets and the whole-repo gates listed in the PR.

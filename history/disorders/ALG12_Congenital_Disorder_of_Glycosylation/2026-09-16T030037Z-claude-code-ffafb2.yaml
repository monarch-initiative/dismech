  summary: Curate the two skeletal findings the source names as their own phenotypes
  details: |
    The 'Skeletal-dysplasia-like abnormalities' phenotype bound HP:0000924 (Abnormality of the skeletal system) while its own cited sentence named two specific findings: shortened long bones and talipes equinovarus. Both are now ordinary phenotypes bound to HP:0003026 Short long bone and HP:0001762 Talipes equinovarus, each citing that same sentence (PMID:38717015) and carrying no frequency, since the source gives none per finding. The coarse node is retained with coarse_binding_basis VARIABLE_SPECTRUM: the source says 'including' those two, so the set is open and the node carries the spectrum claim the two specifics do not. Validated with linkml-validate, linkml-term-validator, the snippet audit (89/89) and the offline KB gates.

  details: |
    Weekly compliance pass focused on immune-disease treatments. All six treatments[].target_mechanisms[] links were previously unevidenced (0 of 6) - the drug-to-mechanism claims that make this entry's cytokinopathy model actionable had nothing behind them. Each now carries its own evidence item chosen to substantiate the mechanism claim specifically rather than reusing the efficacy snippet: anakinra cites the CSF-cytokine normalization measurement (PMID:27770579), tocilizumab the IL-6-receptor-inhibitor identification (PMID:30408233), the ketogenic diet the time-to-efficacy-after-ketonuria result (PMID:20813015), first-line immunotherapy the multicenter usage data (PMID:21883180), anesthetic burst-suppression the burst-suppression-coma usage in the same cohort, and cannabidiol the seizure frequency/duration reduction (PMID:27655472). Two treatments that had no evidence at all now do: Tocilizumab gained a therapeutic_agent binding (NCIT:C84217) and evidence from the 7-patient NORSE series, and Cannabidiol from the 7-child 5-centre FIRES series. Both are PARTIAL by design - uncontrolled open-label series - and both carry notes recording their limits: the tocilizumab cohort was NORSE broadly rather than FIRES specifically and 2 of 7 patients had severe infection-related adverse events; the cannabidiol series had one death from isoflurane-related multiorgan failure, which is a complication of background anesthetic management and not attributed to the drug. The first-line-immunotherapy mechanism link is deliberately PARTIAL because the cited cohort found no convincing acute-phase effect, so the link records therapeutic intent rather than demonstrated mechanism-level efficacy. Mechanical: backfilled reference_title on all 28 evidence items, read programmatically from the committed references_cache titles rather than retyped. Validated with just validate: 36 of 36 snippets verified against cached references. Weighted compliance 48.4 to 78.9.

  summary: 'Create: Febrile Infection-Related Epilepsy Syndrome (FIRES)'
  details: |
    De novo curation of FIRES (MONDO:0015584), the febrile subgroup of NORSE. Deep research provider: claude_code. Non-Mendelian so no GeneReviews; grounded in consensus definitions (Hirsch 2018 PMID:29399791), multicenter cohort (Kramer 2011 PMID:21883180), ketogenic diet (Nabbout 2010 PMID:20813015), anakinra/IL-1 mechanism (Kenney-Jung 2016 PMID:27770579), cytokine study (Hanin 2023 PMID:36871188), management consensus (Wickstrom 2022 PMID:35997591), and IL1RN functional-deficiency susceptibility (Clarkson 2019 PMID:30779222, surfaced by DR cross-check and independently verified). Pathophysiology deliberately partitioned into a biphasic cascade (febrile trigger -> innate neuroinflammation/IL-1b-IL-6 -> cytokine-driven hyperexcitability + BBB dysfunction -> cortical E/I imbalance -> acute super-refractory SE -> neuronal injury -> chronic refractory epilepsy) to minimize bundling. Includes prevalence, diagnosis, differentials (NORSE, anti-NMDAR encephalitis, HSV encephalitis, Dravet), IL1RN genetic susceptibility, and two knowledge-gap discussions. Validated: schema+terms pass; all 22 evidence snippets verified as exact substrings.

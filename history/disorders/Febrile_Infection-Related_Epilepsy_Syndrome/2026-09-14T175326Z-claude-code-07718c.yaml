  summary: Answer the burst-suppression finding; migrate off the retired PARTIAL value
  details: |
    Merged current main, then answered the one blocking review finding and completed the enum migration the branch could not do before the merge. All fifteen merge conflicts were reference_title quoting differences except one supports value main had already migrated; main's side was taken throughout. Blocking finding: the Anesthetic Burst-Suppression mechanism link graded a bare usage-count snippet from PMID:21883180 as SUPPORT for an INHIBITS effect, while a different sentence of the same abstract reports no evidence of efficacy for that modality. Per CLAUDE.md a source that supports one part of a claim and contradicts another is two items, so the usage-count item is now SUPPORT with directness: INDIRECT, stating that a usage count establishes aim rather than action, and a second REFUTE item quotes the no-evidence-of-efficacy sentence. The edge is retained because the treatment is genuinely directed at that node. Added a treatment-level notes block recording the harm signal the review found absent from the entry: cognitive level at follow-up was significantly associated with duration of burst-suppression coma (p = 0.005) and the authors conclude that inducing a prolonged BSC was associated with a worse cognitive outcome. Separately migrated the four supports: PARTIAL values this branch introduced (tocilizumab mechanism link, first-line immunotherapy mechanism link, and both cannabidiol items) to SUPPORT plus directness: INDIRECT, which #10003 defines as the replacement, and reworded every explanation that named the retired value. Validated with just validate (37/37 snippets verified), just validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading and check-snippet-length.

  details: |
    Weekly compliance pass. Added a classifications block (Harrison's NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE) backed by exact-quote evidence from the cached GeneReviews record PMID:38603524. Added evidence to all five previously uncited pathophysiology nodes: Impaired Dendritic Spine and Synapse Development (PMID:39033321 and PMID:24838000), Disrupted Cortical Excitation-Inhibition Balance (PMID:24838000), Impaired Neurodevelopment, Cortical Visual Impairment and Autonomic Dysfunction (all PMID:38603524). Two of the mouse-model items carry directness INDIRECT because the measurement is mouse dendritic branching or mouse behaviour rather than the human synaptic or circuit claim the node makes. No channelopathy_category was assigned since CDKL5 encodes a kinase, and no mechanistic_category value in the enum fits. Validated with just validate (28/28 snippets verified), check-snippet-grading, check-duplicate-keys and check-entity-refs. Weighted compliance 63.3 percent to 69.6 percent.

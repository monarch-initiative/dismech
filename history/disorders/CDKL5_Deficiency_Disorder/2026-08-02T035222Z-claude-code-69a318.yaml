  summary: Add PRIDE and MetaboLights dataset records
  details: |
    Added 2 proteomics/metabolomics record(s) via scripts/discover_ebi_omics.py. Both archives had accession resolvers in this project but no discovery route, and the earlier OmicsDI pass wrongly discarded their hits as already covered; this closes that gap. These assay types matter most for metabolic and rare disease, which transcriptomic archives cover poorly. Matching required the disease to be named in the dataset's own title; causal genes were never searched and sibling-disease qualifier conflicts were vetoed. Every accession was resolved against the PRIDE or MetaboLights API before commit; four legacy PRIDE identifiers (PAD/PRD series) were dropped because the v2 API does not serve them and they could not be verified. No evidence blocks generated, since an evidence item requires an exact abstract quote.

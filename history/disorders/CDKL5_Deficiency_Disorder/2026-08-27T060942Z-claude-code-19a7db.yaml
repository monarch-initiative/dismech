  summary: 'Compliance: add CDD dataset records and hyperexcitability evidence'
  details: |
    Weekly compliance pass focused on datasets. The entry had an empty datasets list; added three verified records - geo:GSE325168 base-editing isogenic trio of CDKL5 p.R550star patient iPSC neurons, geo:GSE319077 paired NGN2-induced versus cortical-organoid neurons from CDD patient iPSCs and isogenic controls, and geo:GSE294284 whole-animal RNA-seq of cdkl5 mutant zebrafish. All three resolved OK through just verify-datasets against NCBI E-utilities on 2026-08-27. Also added IN_VITRO evidence from PMID:40930428 to the previously unevidenced Neuronal Network Hyperexcitability pathophysiology node, with the explanation recording that the same study saw no difference in NGN2-induced neurons so the phenotype is specific to cortically specified neurons. Rejected several candidates the discovery script scored DIRECT because they matched only the generic phrase developmental epileptic encephalopathy and concern GLUL, SCN8A, or Dravet rather than CDKL5. Snippets 20/20 verified.

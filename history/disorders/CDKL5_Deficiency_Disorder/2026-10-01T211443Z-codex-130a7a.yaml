  summary: Review CDKL5 mechanisms, clinical spectrum, and treatment evidence against
    full text
  details: |
    Reviewed the complete entry, prior research, full GeneReviews chapter and tables, primary clinical and experimental papers, accepted ganaxolone trial manuscript and supplement, regulatory labels, and trial/dataset records. Separated coding and noncoding variant mechanisms, kinase-dependent substrates, and kinase-independent scaffolding; qualified cross-model causal links and negative results. Corrected frequency denominators, regional birth incidence, variant uncertainty, and human versus experimental evidence. Distinguished major-motor seizure reduction, responder endpoints, seizure freedom, nonseizure outcomes, and preliminary conference results; added the negative ataluren trial and longitudinal cannabidiol limitations. Expanded evidence-backed phenotypes, Rett differential, multidisciplinary care, model suitability and discussion experiments. Verified three GEO accessions and refreshed six trial records. Full-text retrieval failed for the AAV paper and long-term ganaxolone extension; those claims remain bounded to their available abstracts. Schema, ontology and quotation validation plus repository gates are recorded in the PR.

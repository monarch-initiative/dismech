  summary: Treatment evidence and drug bindings for CDKL5 deficiency disorder
  details: |
    Weekly compliance sweep targeting treatments. Added evidence items to the Antiseizure Medication, Ketogenic Diet Therapy, and Multidisciplinary Supportive Care treatments (previously evidence-free), sourced from the 2025 CDKL5 antiseizure-medication systematic review (PMID:40834685), a ketogenic-diet meta-analysis in monogenic epilepsy (PMID:40982721), and GeneReviews (PMID:38603524). Bound therapeutic_agent CHEBI terms for clobazam, lamotrigine, valproic acid and vigabatrin on the ASM treatment and NCIT:C72793 Ganaxolone on the Ztalmy treatment, and set therapeutic_modality on three treatments. Descriptions were tightened to state the partial magnitude of benefit (ganaxolone ~30% seizure reduction; ketogenic diet ~50% reduction but 0% seizure freedom in CDKL5). Validated with just validate, just validate-terms, just count-verified-snippets (27/27), and just check-qualifier-terms.

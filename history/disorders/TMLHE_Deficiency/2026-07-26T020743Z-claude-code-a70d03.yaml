  summary: 'Create: TMLHE Deficiency - carnitine biosynthesis gap from WP-010'
  details: |
    New disorder entry for epsilon-trimethyllysine hydroxylase (TMLHE) deficiency (MONDO:0010469, OMIM:300872, hgnc:18308), curated as row 4.1.05.01 of the IEMbase metabolic WP-010 package (issue #5565). This was one of the rows the 2026-07-06 scanner audit flagged as genuinely missing.

    Curated from primary literature only; nine PMIDs, all fetched via `just fetch-reference` and every snippet verified as an exact substring of the cached abstract. Notably, five PMIDs recalled from background knowledge during planning turned out to point at entirely unrelated papers; they were discarded and the real literature was found via a PubMed esearch on TMLHE[Title/Abstract] before any curation, per the anti-hallucination SOP.

    Modeling decisions:
    - Curated as a distinct disorder rather than folded into Primary_Carnitine_Deficiency (SLC22A5 transport) or the carnitine-cycle entries (CPT1A/CPT2/SLC25A20): the lesion is in carnitine BIOSYNTHESIS, and the clinical consequence is a low-penetrance neurodevelopmental risk, not fasting intolerance/cardiomyopathy.
    - Six-node pathograph, MOLECULAR -> MOLECULAR -> ORGANISM -> CELLULAR -> CELLULAR -> ORGANISM, each tagged with biological_scale.
    - The gene relationship is typed RISK_FACTOR, not CAUSATIVE, and the entry keeps the biochemical claim (fully penetrant, functionally validated) explicitly separate from the autism claim (2-4% penetrance). MONDO places MONDO:0010469 in its predisposition/omim_susceptibility subsets under "autism, susceptibility to"; that nosological tension is recorded in notes rather than silently resolved.
    - The brain-selective-carnitine-deficit route is modeled as a mechanistic_hypotheses group (brain_carnitine_deficiency_autism, status EMERGING) with the single speculative causal edge opting in via hypothesis_groups, so it is not conflated with the established chain.
    - Two discussions: a HUMAN_MODEL_MISMATCH for the constitutive Tmlhe knockout mouse (PMID:37553674), which shows >90% carnitine reduction with no ASD-like or motor phenotype and does not phenocopy primary carnitine deficiency, carrying two REFUTE evidence items against the mouse-derived neural-stem-cell mechanism (PMID:26832401); and a KNOWLEDGE_GAP on the unidentified penetrance modifiers. Each carries structured proposed_experiments.
    - Levocarnitine treatment is deliberately framed as single-case evidence with an explicit PARTIAL evidence item quoting the authors' own caveat, and target_mechanisms uses BYPASSES rather than RESTORES since supplementation does not correct the enzymatic lesion.
    - No frequency bands asserted on phenotypes: no source quantifies phenotype frequency among TMLHE-deficient males, so per the frequency-evidence SOP the slot is omitted rather than guessed.

    Validation: `just validate`, `just validate-references`, and `just validate-terms` all pass. The reference validator was additionally negative-controlled with a deliberately fabricated snippet to confirm it was actually exercising the snippet checks; it correctly failed on the fabricated text.

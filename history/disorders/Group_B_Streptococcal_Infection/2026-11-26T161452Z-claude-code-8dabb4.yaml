  summary: 'Create: Group_B_Streptococcal_Infection'
  details: |
    Created the organism-level GBS (Streptococcus agalactiae) entry bound to MONDO:0700218. Four clinical strata (early-onset, late-onset neonatal; pregnancy-associated; non-pregnant adult) kept as has_subtypes under design decisions 3e (deliberate lump recorded in review_notes). Pathophysiology covers maternal rectovaginal colonisation, sialylated capsule immune evasion, beta-haemolysin/cytolysin (ornithine rhamnolipid pigment, CovR/S), pilus/HvgA adhesion and BBB crossing, ST-17 hypervirulent clone, low maternal anti-capsular antibody, ascending amniotic invasion, bacteraemia and meningitis. Screening 35-37wk and intrapartum penicillin/ampicillin prophylaxis (reduces early-onset not late-onset). Verified NCT03765073 maternal GBS6 vaccine trial. Sources: Raabe/Shane review PMID:30900541, Teuscher 2026 prevention review PMID:42747473, Whidbey J Exp Med PMID:23712433, ST-17 PMID:31779587, GBS6 trial PMID:42521820, bovine mastitis PMID:41200363. Deep-research report committed under research/. 55 snippets verified; all offline gates pass.

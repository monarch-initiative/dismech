  details: |
    LOINC tranche K batch 1. The single Karyotype Analysis diagnosis row conflated the confirmatory karyotype and the maternal serum marker screening route named in its own evidence snippet. Split it into two rows: Karyotype Analysis, bound to LOINC:29770-5 (Karyotype [Identifier] in Blood or Tissue Nominal), and a new Maternal Serum Marker Screening row bound to LOINC:50580-0 (Maternal screen for fetal abnormalities such as Open Neural Tube Defects, Trisomy 21 or Trisomy 18 panel - Serum or Plasma). Chose the generic multi-condition panel code over a triple/quad/penta-specific one because the source names the screening step generically ('maternal serum marker screening') without specifying which panel was used, and the generic code is the one that does not assert a marker count the source does not state. Both codes verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

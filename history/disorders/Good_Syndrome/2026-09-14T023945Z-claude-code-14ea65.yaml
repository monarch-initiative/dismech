  summary: 'Classify: IUIS 2022 Table 10'
  details: |
    Added a classifications block carrying iuis_category: phenocopy of IEI, backfilled from IUIS 2022 Table 10 (Tangye et al., PMID:35748970), second section, 'Associated with autoantibodies'. The entry previously had no classifications block. The row is 'Thymoma with hypogammaglobulinemia (Good syndrome)', pathogenesis given as autoantibodies to various cytokines, with increased CD8+ T cells, absent B cells and decreased immunoglobulin. Good syndrome is the clearest case in the table of why the phenocopy category exists: the laboratory picture is that of a combined immunodeficiency, which is this entry's own parent term, but it is acquired in adult life on the back of a thymic epithelial tumour rather than inherited. Phenocopy-versus-primary check: the neighbouring dismech entry is Thymoma, which is the neoplasm rather than the immunodeficiency and carries no IUIS assignment; nothing was changed there. Notes also record that IUIS attributes Good syndrome to anticytokine autoantibodies, which is one mechanism among several, and that this entry's mechanistic_hypotheses section keeps the thymic stromal account open alongside it - the classification does not settle that question. Evidence graded OTHER, snippet verified byte-exactly against the cached reference.

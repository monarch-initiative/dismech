  summary: 'Review: Good syndrome publication-completeness deep review (IUIS Table
    10)'
  details: |
    Good syndrome is a combined immunodeficiency and the entry curated only its humoral half. Hypogammaglobulinemia and B lymphocytopenia were both present as phenotypes; the T-cell arm existed as prose only.

    Added CD4 T-cell lymphopenia with inverted CD4:CD8 ratio, wired from the Reduced Thymopoietic Output node, and progressive bronchiectasis as a sequela of recurrent infection. The CD4 record is bound to HP:0033222 (the ratio) rather than to a CD4 count, because HPO has no non-obsolete term for a decreased CD4-positive T-cell count and HP:0005403 would assert a decreased TOTAL T cell count, which is often false here - total T cells can be normal while CD4 cells are selectively depleted. The CD4 depletion is carried in preferred_term and the description, with the ontology gap recorded.

    Nothing was changed about the treatments. The entry already records the thymectomy dissociation carefully - that resection is oncologic and the immunodeficiency persists after it - which was the thing this review expected to find missing and did not.

    PMID:34888060 was cited only for the thymectomy point; its characterization sentence, which is the disease's defining laboratory signature, was unmined. 43/43 snippets verify.

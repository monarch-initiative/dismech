  summary: 'Review: Good syndrome publication-completeness deep review (IUIS Table 10)'
  details: 'Good syndrome is a combined immunodeficiency and the entry curated only its humoral half.
    Hypogammaglobulinemia and B lymphocytopenia were both present as phenotypes; the T-cell arm existed
    as prose only.


    Added two laboratory phenotypes wired from the Reduced Thymopoietic Output node - CD4 T-cell lymphopenia
    bound to HP:5210418 (Decreased total CD4+ T cell count) and the inverted CD4:CD8 ratio bound to HP:0033222
    - plus progressive bronchiectasis as a sequela of recurrent infection. The count and the ratio are
    curated separately because they are distinct measurements: a ratio can invert through CD8 expansion
    as well as through CD4 loss, and the cited sentence reports both independently.


    Correction, recorded because an earlier version of this record asserted the opposite. That version
    bound only the ratio and stated that HPO has no non-obsolete term for a decreased CD4 count. That
    was false. HP:5210418 exists, is non-obsolete, was already present in this repository''s committed
    cache/hp/terms.csv, and is already bound in two other entries. The error came from searching the local
    OAK build with runoak and never checking the committed term cache, which is the cache-first path the
    project documents. A false statement about an ontology had been written into the disease entry as
    a result; it is removed there as well as here.


    Nothing was changed about the treatments. The entry already records the thymectomy dissociation carefully
    - that resection is oncologic and the immunodeficiency persists after it - which was the thing this
    review expected to find missing and did not.


    PMID:34888060 was cited only for the thymectomy point; its characterization sentence, which is the
    disease''s defining laboratory signature, was unmined.


    Second correction, from the next review round, and the same class as the first. The entry''s notes
    stated that the reported phenotype frequencies "live in full text that is not in this repository''s
    cache; the cached PMID:34113351 record is abstract-level". That was false: the file is 324 lines of
    full_text_xml and has been since it was committed, and this entry was already citing it five times
    including once for a frequency band. Nobody opened it.


    Three bands are now curated from it: CD4 lymphopenia at 71.3%, inverted CD4:CD8 ratio at 82.5%, and
    B lymphocytopenia at 95.2%. The false paragraph is replaced with one recording what happened and noting
    that the pure red cell aplasia and myasthenia gravis figures remain uncurated because nobody has done
    it, not because the source is unavailable.


    Twice in one entry the reasoning rested on an unchecked claim about a committed artifact - first about
    HPO, then about the reference cache. The entry''s own notes already carried a heading reading "The
    same mistake, twice more" about this exact failure mode. It is now four.


    Third correction, found on rebase. The three frequency bands above were verified against a copy of
    references_cache/PMID_34113351.md that was full text in my worktree and abstract-only on main. The
    validator network-fetches an uncached reference and reports the snippet verified, so local validation
    passed while the branch would have failed for anyone else checking it out - the exact trap CLAUDE.md
    documents for validate-disorders. The full-text cache file is now committed with the change that depends
    on it.


    Note this also corrects the review that prompted the bands: it stated the file was 324 lines of full_text_xml
    and had been since it was committed. On origin/main it was 43 lines, abstract-only. Both of us were
    reading a cache that was not the committed one.

    '

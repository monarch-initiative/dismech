  summary: 'Review: Good syndrome publication-completeness deep review (IUIS Table 10)'
  details: 'Good syndrome is a combined immunodeficiency and the entry curated only its humoral half.
    Hypogammaglobulinemia and B lymphocytopenia were both present as phenotypes; the T-cell arm existed
    as prose only.


    Added two laboratory phenotypes wired from the Reduced Thymopoietic Output node - CD4 T-cell lymphopenia
    bound to HP:5210418 (Decreased total CD4+ T cell count) and the inverted CD4:CD8 ratio bound to HP:0033222
    - plus progressive bronchiectasis as a sequela of recurrent infection. The count and the ratio are
    curated separately because they are distinct measurements: a ratio can invert through CD8 expansion
    as well as through CD4 loss, and the cited sentence reports both independently.


    Correction, recorded because an earlier version of this record asserted the opposite. That version
    bound only the ratio and stated that HPO has no non-obsolete term for a decreased CD4 count. That
    was false. HP:5210418 exists, is non-obsolete, was already present in this repository''s committed
    cache/hp/terms.csv, and is already bound in two other entries. The error came from searching the local
    OAK build with runoak and never checking the committed term cache, which is the cache-first path the
    project documents. A false statement about an ontology had been written into the disease entry as
    a result; it is removed there as well as here.


    Nothing was changed about the treatments. The entry already records the thymectomy dissociation carefully
    - that resection is oncologic and the immunodeficiency persists after it - which was the thing this
    review expected to find missing and did not.


    PMID:34888060 was cited only for the thymectomy point; its characterization sentence, which is the
    disease''s defining laboratory signature, was unmined.

    '

  details: |
    Added mechanistic_hypotheses group gs_anticytokine_infection (status EMERGING): anti-cytokine autoantibodies (neutralizing anti-IL-23) may drive opportunistic infection independent of the humoral defect. Kept deliberately separate from gs_autoantibody_mediated, which concerns cytopenias; the cytopenia claim is not extended. Carries a REFUTE evidence item (PMID:41701387) recording the authors' view that the autoantibodies are secondary to the thymoma rather than causal, which is why the group is EMERGING. Sources: PMID:38507753, PMID:41701387 (GS-specific cohort, fetched and read). Validated as above.

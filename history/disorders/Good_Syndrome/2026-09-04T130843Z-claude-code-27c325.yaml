  summary: 'Create: Good Syndrome (MONDO:0015696)'
  details: |
    New entry for Good syndrome, the adult-onset combined immunodeficiency occurring with thymoma, bound to MONDO:0015696 and curated as a DISEASE.

    The central curation decision was not to assert a mechanism. Good syndrome's pathophysiology is genuinely unresolved, and the observation that forces this is that the immunodeficiency usually does not remit after thymectomy, so the thymoma cannot be assumed to sit upstream of the B-cell loss. Rather than picking one story and writing it as a causal chain, three competing accounts are curated as separate mechanistic_hypotheses groups, all with status ALTERNATIVE: a shared thymic epithelial lesion producing the tumour and the immune failure in parallel, a bone marrow B-cell precursor arrest that surgery cannot reach, and autoantibody-mediated suppression of precursors and cytokines. The absence of a CANONICAL group is deliberate and is stated in the KNOWLEDGE_GAP discussion, which also sets out what evidence would separate the three: marrow B-cell precursor phenotyping before and after thymectomy, paired autoantibody screening, and GTF2I genotyping of the same patients.

    The pathophysiology chain is kept to steps that are actually supported, and the two branches, humoral and cellular, both feed the infection node so the combined nature of the defect is visible in the graph rather than only in prose.

    Evidence discipline, and the reason it mattered here. The deep-research report's reference validation flagged one quoted claim as not found in its cited source: the phrase about disrupting the balance between host-defense and self-tolerance, attributed to PMID:34113351. That quote is not used anywhere in this entry, and the entry's notes record that it was rejected. This is the first of the five reports in this session with a failing quote, and it is exactly the case the skill guidance describes, where a clean confabulation_rate says nothing about quote fidelity. The report resolved 28/28 references but 1 of 2 quotes failed, so needs_review would be true.

    Mouse evidence is graded MODEL_ORGANISM with directness INDIRECT. The GTF2I mouse carries the human thymoma-associated mutation but was not studied in Good syndrome patients, and the entry says so in the explanation rather than letting the grade carry it silently.

    One hypothesis, the marrow precursor arrest, is recorded with no evidence item at all, and its notes say why: no cached reference in this entry carries a quotable statement of the transitional-B-cell finding that the account rests on. Recording the hypothesis without evidence is more honest than attaching a quote that does not say what it would be cited for, and curating that evidence is the obvious next step for the entry.

    Prognosis is curated from the 162-patient systematic review, including the finding that infection type and site rather than the thymoma are what determine survival.

    Not done: no treatments section. Immunoglobulin replacement and thymectomy are both standard, but no cached reference in this entry carries a quotable statement about either, and a treatment entry asserting them from the research narrative alone would not survive snippet verification. No relationship modelled to kb/disorders/Thymoma.yaml beyond a notes cross-reference explaining that the two entries make different claims and neither subsumes the other.

    Validation: just validate, just validate-terms, just count-verified-snippets (14/14 verified), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values and just check-stubs all pass.

  summary: 'Self-review: address red-team findings before PR'
  details: |
    Pre-PR adversarial self-review (dismech-pr-review skill, run in a fresh-context subagent) returned REQUEST_CHANGES with 22 findings. What changed:

    CLAIM-EVIDENCE MISMATCHES
    - The Intellectual Disability evidence quoted a sentence classing DD/ID as "relatively less-frequent" while the explanation described it as a neutral list, laundering away the only quantitative word in the quote. Explanation rewritten to say what the sentence actually claims and to flag that it disagrees with the cohort series.
    - "the only adult with CAFDADD reported to date" appeared three times, was in no cited paper (it came from the DR report's gloss), and was contradicted by PMID:37067385, which reports a 31-year-old affected woman. Replaced with "the one patient followed into adulthood in detail".
    - The OSA description said the apnea was driven by skeletal features "rather than by obesity". The source says exacerbated-by, in a patient with BMI 28. Corrected.
    - The MEKK3-MEK5-ERK5 edge was evidenced with a paper about the AP1/CHOP arm. Re-cited to the shear-stress paper that names this arm.
    - The Ras-brake framing in the MAPK-direction discussion asserted more than its snippet supports (the snippet is about mutant TRAF7; the review's abstract says TRAF7 inhibits MEK1/2). Restated to the sourced claim, with the unpublished-GEO provenance of the Ras-stabilization mechanism flagged.
    - "germline and somatic residues do not overlap" was stated as fact in three places and refuted elsewhere in the same file: somatic R653Q and germline R653L are the same residue. Softened in all three, and the discussion rationale now leads with the overlap instead of burying it.

    GRAPH STRUCTURE
    - The dominant-negative node was wired backwards: adaptor failure was shown causing heterodimerization. Rewired so the variant causes heterodimerization, which causes adaptor failure.
    - Added an Axial Skeletal Patterning Defect node. The digit node had been carrying short neck, pectus and vertebrae in its description while bound to embryonic digit morphogenesis and pointing only at digits.
    - Added a Left-Right Patterning Defect node (ciliary L-R organizer, pitx2c lost or bilateral in knockdown frogs). Explicitly marked as a mechanistic prediction, not an observed feature: no CAFDADD patient has been reported with a situs abnormality.
    - Connected 12 previously orphan phenotypes, and modelled the short-neck/vertebral-anomaly -> OSA relation as `sequelae` rather than only as English prose.

    EVIDENCE GRADING
    - Added `directness: INDIRECT` to 12 items. The Traf7-null mouse results had none, in a disease this entry itself argues has no null alleles.
    - Regraded three items from MODEL_ORGANISM to OTHER: a 2025 narrative review restating a mouse result, and two items from the "Reply to Pisan et al." correspondence, which reports no new experiments.
    - Fixed `supports: REFUTE` on evidence that supports its FAILS_TO_RECAPITULATE link. `supports` is relative to the attached claim, and the claim is that the model fails.
    - The Xenopus model's `publication` pointed at that correspondence letter; retargeted to the primary PNAS paper and re-cited its actual V442M/T601A and Sox10 results.

    SLOT AND ONTOLOGY CORRECTIONS
    - `modifier: LOSS_OF_FUNCTION` on ubiquitin-protein transferase activity contradicted the node's own "rewired rather than simply reduced" and the entry's anti-haploinsufficiency thesis. Changed to DECREASED, which is the PATO-grounded quantitative default.
    - Added `functional_impact_category: DOMINANT_NEGATIVE` to the variant's genetic_context, with the allele-class caveat in its description.
    - Split the bundled "Aortic Root Aneurysm with Bicuspid Aortic Valve" phenotype into two, each with its own HP term.

    FREQUENCIES
    - Nine surviving `frequency:` bands now each carry a `notes:` saying the band is a curator estimate mapped from qualitative source language, with no cohort count behind it.

    CONTENT ADDED
    - Five phenotypes the cached references already supported and the entry had missed: Seizures, Cerebral Atrophy, Optic Atrophy, Short Stature, Intestinal Malrotation (two independent reports).
    - A `diagnosis:` block with five entries. Trio sequencing, and the deliberately-negative finding that karyotype and chromosomal microarray are uninformative, since a normal cytogenetic workup should move a multiple-anomaly presentation to sequencing rather than reassure. Two surveillance activities were moved out of `treatments:` into `diagnosis:` where the skill puts them.
    - Split the cardiac treatment into surveillance (now diagnosis) and repair, and added the Bentall aortic root replacement as its own treatment.
    - References block completed from 5 to 11, matching what is actually cited.

    MAPPINGS AND THE ORPHANET CHECK
    Added an ICD-10-CM mapping: ORPHA:592570 attributes Q87.8 with relation NTBT. Recorded as `skos:broadMatch`, not equivalence, because Q87.8 is a residual "other specified" bucket, which is itself part of why the stub cited underdiagnosis from insufficient ICD coding.

    Checking this turned up two things. Orphanet still cross-references MONDO:0035661 for ORPHA:592570; that term is obsolete and MONDO:0032572 now carries both OMIM:618164 and Orphanet:592570, so the binding here is the current one. This is noted on `disease_term`. Separately, the entry previously asserted "Orphanet has no epidemiology record for this entity", which was unverified. Only the Orphadata cross-reference product was consulted (it carries no epidemiology); the claim is now stated as what was actually checked.

    Note `just refresh-orphadata` failed on checksum drift (upstream published a new release behind the same URL). Repinning plus the whole-cache rebuild it implies is its own PR, so it was not done here, and no ORPHA cache file is cited as evidence anywhere in this entry.

    NOT DONE, AND WHY
    - No `classifications:` block. It needs the disease-classification skill and its own pass.
    - The node bundling E3 ligase catalytic activity with MEKK3 adaptor engagement was flagged as two claims in one node. Left as-is: both are properties of the same WD40 surface and the same mutations abolish both, so splitting them would assert a separability the sources do not establish. Worth revisiting if an allele is found that separates them.
    - The meningioma reported in one of the seven original Tokita probands is the single most relevant fact for the oncological-surveillance question, but PMID:29961569 is cached abstract-only and the abstract does not mention it. Not added rather than cited to a source that does not say it.

    A note on process: a line-walking script used to insert `directness` duplicated the file's tail and produced a duplicate `datasets:` key. `just check-duplicate-keys` caught it, which is the failure mode CLAUDE.md describes, arrived at by editing rather than by merge.

    VALIDATION AFTER REVIEW
    just validate 94/94 snippets; validate-disorders passed; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all OK. No baseline updated. Compliance 86.1% global, down from 88.9% because the round added objects (five phenotypes, five diagnosis entries, three pathophysiology nodes) whose optional slots are honestly empty.

  summary: 'Create: Cardiac, Facial, and Digital Anomalies with Developmental Delay
    (MONDO:0032572, TRAF7)'
  details: |
    entry_type DISEASE. MONDO:0032572 has only syndromic disease and hereditary disease as parents, so there is nothing it could be a subtype of. TRAF7 previously appeared in kb/ only in Meningioma, as a recurrent somatic driver. Keeping the two apart was the main curation risk and was handled at the sentence level rather than at the paper level: every citation here was checked to confirm it is about germline syndrome patients, and PMID:37043537, which spans both diseases, is cited only for sentences that explicitly name the germline or inherited arm or the shared molecular mechanism. Two independent sources (PMID:41372821, PMID:37583551) state that germline and somatic TRAF7 mutations do not overlap despite both being recurrent missense changes in the same region; that non-overlap and its unexplained cause are curated as a KNOWLEDGE_GAP, together with the separate clinical question of whether germline carriers have excess tumour risk. No tumour predisposition is asserted. A CONTROVERSY discussion records the published PNAS exchange over whether three inherited TRAF7 variants cause isolated congenital heart disease (PMID:37043537 vs PMID:38466850 and the reply PMID:38466853); because that is unresolved, the entry describes the syndrome as predominantly de novo and does not assert incomplete penetrance. Per-feature frequencies were deliberately omitted: the widely quoted percentages over 68 aggregated cases are in full-text tables not present in the reference cache, so no snippet could verify them, and the phenotype descriptions instead record only the qualitative ordering the abstracts support. Developmental delay is curated as frequent but not obligate, on the strength of the 2024 series reporting individuals whose early psychomotor delay resolved. The Traf7 null mouse link is FAILS_TO_RECAPITULATE with limitations and evidence, because complete loss is embryonic lethal in mouse while human heterozygotes survive, and no knock-in of a recurrent human allele exists. Module conformance to ciliopathy_dysfunction and cranial_suture_premature_fusion was considered and rejected, recorded in notes. Deep research: falcon, 8/8 references verified, 0 confabulation, preflight PASS with TRAF7 mentioned 64 times. Note issue #8923 is an open Review issue on the same MONDO term assigned to another curator; it carries no PR and is flagged in the PR body.

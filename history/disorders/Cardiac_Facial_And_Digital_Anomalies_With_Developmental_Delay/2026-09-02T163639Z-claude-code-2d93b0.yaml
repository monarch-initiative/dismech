  summary: 'Create: Cardiac Facial and Digital Anomalies with Developmental Delay
    (CAFDADD, TRAF7)'
  details: |
    De novo curation of CAFDADD / TRAF7 syndrome (MONDO:0032572, OMIM 618164), curating the stub stubs/Cardiac_Facial_And_Digital_Anomalies_With_Developmental_Delay.yaml (entry_type UNDECIDED -> DISEASE; stub deleted).

    DEEP RESEARCH
    falcon was requested and was unusable: EDISON_API_KEY is present but the API returns 403 "Failed to authenticate" (confirmed with `deep-research-client providers --check`). Rather than hand-substituting a provider, the run was repeated with `just dr_fallback='--fallback'`, which recorded fell_back/requested_provider/provider_attempts in the report frontmatter and renamed the report to its actual producer.

    The fallback landed on openscientist, and THAT REPORT WAS DISCARDED as a Named Entity Confusion failure. `just preflight-dr` returned FAIL: TRAF7 mentioned 0 times, TAB2 mentioned 70 times, MAP3K7 13 times. All 7 of its citations were TAB2/MAP3K7 papers (TAB2 haploinsufficiency CHD, 6q25.1 microdeletion, frontometaphyseal dysplasia). Its own reference_validation block reported 7/7 verified and confabulation_rate 0.0, and scored 5/7 references "on topic" - exactly the failure mode the skill warns about, since relevance is scored against the report's own (wrong-disease) vocabulary. The report, citations sidecar and artifacts directory were deleted rather than committed, so nothing under research/ points at the wrong disease. Contributing cause worth noting: the `research-disorder` recipe (project.justfile:1996) hardcodes `--var "mondo_id="`, so the provider never receives the MONDO ID that would have disambiguated the plain-English disease name. Not fixed here (out of scope for a curation PR).

    The report actually used is research/Cardiac_Facial_And_Digital_Anomalies_With_Developmental_Delay-deep-research-claude_code.md, re-run with `--var mondo_id=MONDO:0032572` appended. It PASSES preflight-dr (TRAF7 mentioned 90 times, report OMIM 618164 == MONDO OMIM 618164).

    READING ITS VALIDATION SECTIONS (Step 3a)
    - reference_validation: 16/16 verified, confabulation_rate 0.0, but needs_review true - quotes_valid 4/6, with unsupported quotes attributed to PMID:37043537 and PMC:PMC10120005. No quoted material from that report was reused; every snippet in this entry was re-extracted from the local cache by hand. (The unsupported quote was a real figure-legend sentence broken by an ellipsis; it is quoted correctly in this entry as "Low concentrations of mutant TRAF7 (C388Y) are sufficient to disrupt the interaction of WT TRAF7 with MEKK3".)
    - term_validation: needs_review true, 6 mislabelled_terms. NONE of them were bound: HP:0031650 (report says "bicuspid aortic valve", HPO says Abnormal atrioventricular valve physiology), HP:0004385 ("double outlet right ventricle" vs Protracted diarrhea), CL:0002518 ("cardiac endothelial cell" vs kidney epithelial cell), UBERON:0004134 ("cardiac outflow tract" vs proximal tubule), UBERON:0004674 ("upper eyelid" vs facial nerve root), plus obsolete HP:0001180. Bicuspid aortic valve was instead curated against HP:0001647, verified independently.
    - The report also claims "No germline knock-in mouse model ... has been reported to date". That is now out of date - see datasets below.

    GENEREVIEWS BASELINE (Step 3b)
    Searched PubMed for `TRAF7 GeneReviews[All Fields]` and `<disease> GeneReviews[TI]`: no GeneReviews chapter exists for TRAF7 or CAFDADD. No action needed; the absence is recorded here.

    WHAT WAS CURATED
    11-node pathophysiology chain built as a causal graph, not a bucket list: TRAF7 WD40 missense -> disrupted E3 ligase / MEKK3 adaptor function -> four parallel arms (attenuated ERK1/2 phosphorylation; perturbed MEKK3-MEK5-ERK5-KLF2 signaling; dominant-negative heterodimerization with wild-type TRAF7; disrupted TRAF7-IFT57 interaction with cilia loss) -> compromised endothelial integrity / neural crest derivative patterning defect / dysregulated transcriptional program -> the four organ-level nodes (cardiovascular, craniofacial, limb/digital, neurodevelopmental) -> named phenotypes. Every downstream target resolves (check-causal-targets OK).

    17 phenotypes, 1 genetic record, 2 inheritance blocks, 3 animal models (mouse global/endothelial Traf7 null; zebrafish morphant; Xenopus knockdown + p.Val442Met overexpression), 6 treatments, 1 prevalence record, 1 dataset, 3 discussions, 79 evidence items across 10 references.

    ALLELE-CLASS HONESTY
    The strongest mechanistic work (PMID:37043537, PNAS) was done on meningioma-associated SOMATIC substitutions (C388Y, G536S, K615E, R653Q) and on inherited CHD variants (V142M, V442M) whose pathogenicity was publicly disputed (PMID:38466853 is the reply to that dispute). Those alleles are not CAFDADD germline alleles. Every evidence item drawn from that work carries directness: INDIRECT and says so in the explanation, and the node descriptions state the caveat rather than burying it.

    DISCUSSIONS (three genuine open questions, not filler)
    - traf7_null_mouse_vs_human_missense (HUMAN_MODEL_MISMATCH): all in vivo TRAF7 mechanism comes from null alleles; the human disease has none. The heterozygous null mouse is "phenotypically normal and fertile", which is the argument against haploinsufficiency - but PMID:38466853 cites IMPC heterozygous Traf7-loss eye and ECG phenotypes as evidence FOR haploinsufficiency. Both cannot be right; both are cited.
    - traf7_mapk_direction (KNOWLEDGE_GAP): wild-type TRAF7 restrains Ras-GTPases, so disrupting it predicts INCREASED ERK output, yet the only assay on the patient alleles measured REDUCED ERK1/2 phosphorylation. Which holds decides whether CAFDADD belongs with the RASopathies.
    - traf7_germline_somatic_residue_divergence (KNOWLEDGE_GAP): germline and somatic hotspot residues do not overlap, so oncological surveillance currently rests on gene identity rather than a quantified risk.

    DATASET
    geo:GSE273833 added and verified with `just verify-datasets` (1/1 OK), relevance triaged manually as DIRECT (series title names CAFDADD). Its submission summary describes a Traf7 R654Q/+ knock-in mouse - the exact experiment the model-mismatch discussion proposes - and reports MAPK HYPERactivation, the opposite direction from the 2018 patient-allele result. No linked publication was findable in PubMed at curation time, so per the dataset-curation SOP it carries notes and no evidence block, and nothing from it is cited anywhere in the entry. Recorded so the next curator finds the dataset and the discrepancy instead of rediscovering both.

    VALIDATION RUN (all completed, output read)
    - just validate: schema OK, term validation OK, 79/79 snippets verified against cached references.
    - just validate-disorders (the batched pre-PR gate CI runs): passed, 79/79.
    - just verify-datasets: 1/1 OK.
    - just check-qualifier-terms-online: OK. This one caught a real defect: an NCIT device CURIE guessed for a CPAP qualifier resolved to "Severely Abnormal Ventricular Ejection Fraction". The qualifier was dropped and the treatment rebound to NCIT:C124040 Continuous Positive Airway Pressure, found with OAK.
    - check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-environmental-evidence: all OK. check-folded-hyphens initially failed on a line split at "blepharophimosis-ptosis-/epicanthus"; the sentence was reflowed.
    - No baseline file was updated.
    - just compliance: 88.9% global, 88.8% weighted. Residual gaps are the dataset evidence block (deliberately absent) and downstream-edge evidence where no source makes the causal claim directly.

    PHENOTYPE FREQUENCIES

    Only six phenotypes carry a `frequency:`, and each is anchored to explicit
    source language: "major features" in the 45-patient series maps to FREQUENT,
    and "a defining feature across nearly all patients" maps to VERY_FREQUENT.
    Eight initially-drafted frequency values were removed on self-review because
    the only source language was "worth highlighting", "observed in the cohort",
    or a single case report - none of which supports a numeric band. The
    deep-research report claims hearing loss and short stature are "present in
    all patients", but sources that to a press summary rather than the paper, so
    it was not used. Per the skill, omitted beats guessed.

    ONE CACHE NOTE
    The Tokita 2018 abstract contains a non-breaking space in "In vitro", so the snippet for the ERK1/2 result deliberately starts at "analyses of the observed TRAF7 mutations..." rather than at the start of the sentence.

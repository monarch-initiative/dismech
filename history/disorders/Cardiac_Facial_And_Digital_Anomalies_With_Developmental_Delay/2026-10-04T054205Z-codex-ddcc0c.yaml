  summary: Address independent TRAF7 review and improve evidence annotations
  details: |
    Addressed the independent review on PR 13521 after its review workflow finished. Removed the generated preprint PDF from the Git index while retaining the fetch-generated Markdown cache; the original REVIEW history remains unchanged. Corrected the ERK background quotation to evidence_source IN_VITRO while keeping quote_role BACKGROUND, because the sentence describes an overexpression assay.


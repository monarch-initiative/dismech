    The first CI run passed 22 of 23 whole-repository gates and failed only because the two digestive quotes had been shortened to four words during cleanup. Extended each with the adjacent source text about feeding support; the resulting passages remain exact cached quotations and exceed the minimum length.

    Did not add edges from general congenital cardiac malformation to its individual lesion types: those would encode class membership as causation. The experimentally measured trimer and ERK effects retain unresolved clinical intermediates rather than fabricated downstream links. Retained the generated accepted-manuscript extraction: it is the published-version source used to cross-check the preprint and its differing tables, and the preprint alone cannot reproduce that comparison. The user specifically requested full use of available cached full texts. Its URL-derived title is a fetcher artifact and is not passed off as a journal title.

    Batched schema, ontology and reference validation passed with 129/129 snippets, zero skipped/unavailable snippets, 145 titles and zero issues. NCIT:C15329 was independently looked up with the configured OLS adapter. The final local snippet-length rerun and pre-commit results are reported in the PR response.

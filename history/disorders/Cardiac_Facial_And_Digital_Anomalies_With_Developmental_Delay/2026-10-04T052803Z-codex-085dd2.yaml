  summary: Review TRAF7 syndrome using clinical and mechanistic full texts
  details: |
    Reviewed the existing TRAF7 syndrome entry before its first REVIEW history event. This inherited developmental disorder is in scope; tumor-only TRAF7 disease remains a separate clinical context. Created an isolated branch from origin/main cfde41b269c18edbe48a8686b9cb6c55ebb0c5cd and explicitly rebased before reviewing. No open disorder/history PR overlapped at preflight. The older issue 8923 concerns placement before this entry existed and is not closed by this review. Existing history is unchanged.

    Source audit: read the original disorder, its creation history, and the matching genuine Falcon report and citation companion. Used the full 2020 clinical/transcriptomic study (PMID:32376980), including the core-cohort definition, familial transmission, clinical counts, fibroblast methods, differential-expression thresholds, validation results, and tumor-variant exception. Read the full 2023 PNAS experiments (PMID:37043537) relevant to somatic-allele dominant effects, developmental variant overexpression, IFT57 binding, ciliary transport and neural crest models; read the published letter and reply (PMID:38466850/38466853). Used the structural, biochemical and rescue results of PMID:38178633, the mouse/endothelial results and dataset record from PMID:37583551, and the full adult case PMID:38612512. Checked the 2025 review PMID:41372821 against those primary sources rather than importing its generalized non-overlap and dominant-negative assertions. Retrieved and read the full mosaic meningiomatosis case PMID:35733823 and the familial-mosaic abstract PMID:37067385.

    The 2024 clinical paper PMID:38569228 remained abstract-only through the PMID fetcher. Retrieved its accepted manuscript from the University of Barcelona repository and its full 2023 preprint through DOI:10.1101/2023.12.13.23299272. Read clinical results, genetics, management and discussion, and compared the primary manuscript tables with the preprint/report. Quotes from the cleaner preprint extraction are explicitly attributed to that version; it is not treated as an independent cohort. The manuscript includes a previously reported individual and conflicting table counts, so neither case totals nor inconsistent aggregate percentages were imported. Preserved both full-text caches and the preprint PDF. The accepted manuscript URL cache has a URL-derived title generated by the fetcher; it is retained as an audit source, not used as a falsely titled publication. The discovery paper PMID:29961569 remained abstract-level after PMID, DOI, PMC and Europe PMC attempts (blocked or unavailable routes); its experiment context was also checked against the later primary papers' discussion. Craniosynostosis case abstracts PMID:32459067 and PMID:34247275 were used. PMID:41201137 remains unavailable and no title-only claim is imported.

    Corrected inheritance and variant interpretation: added established affected-mother transmission to twins and mosaic-mother transmission to a non-mosaic son. Kept the separate dispute over three isolated-CHD variants inherited from apparently unaffected parents. Removed a universal dominant-negative classification: the strongest heterodimer interference experiments tested somatic meningioma alleles, and the coiled-coil study found reduced trimer stability for Lys346Glu but not Arg371Gly. Both alleles failed fish rescue, which does not prove identical molecular effects. Corrected ERK experiments from patient-derived cells to overexpression assays, retaining allele dependence. Split IFT57 binding from ciliary maintenance and qualified the neural crest route as a model-derived hypothesis. Removed unsupported neural-crest-to-developmental-delay/digital-anomaly edges. Used primary patient-fibroblast results, distinguishing 76 basal/90 TNF DEGs from the relaxed 726-gene enrichment analysis; no causal ERK-to-transcriptome chain is asserted.

    Corrected the absolute germline/somatic non-overlap claim: Arg524Trp appeared in a tumor also carrying an activating SMO variant, Arg653Leu affects a residue mutated differently in tumors, and a mosaic Arg641Cys case combined developmental anomalies and meningiomatosis. None estimates constitutional-carrier tumor risk. Tumor surveillance remains an uncertain clinical proposal, not a validated screening regimen. Revised proposed experiments so a negative assay or underpowered incidence study cannot establish biological equivalence or absence of risk.

    Expanded clinical findings using exact primary-cohort counts and clearly scoped later-series observations: motor delay, intellectual disability, feeding difficulties, short stature, palatal abnormalities, individual facial/digital findings, pes planus, scoliosis/kyphosis, cervical stenosis, septal and valvular defects, hearing loss, refractive/ocular findings, renal/genital findings and hernia. Did not infer feature-specific denominators from the 42-person cohort or population penetrance from small selected series. Removed the false single-adult claim and separated nonspecific sleep disturbance from obstructive apnea. Added assisted learning/augmentative communication, enteral feeding, cardiac surgery, hearing rehabilitation, CPAP response and cervical assessment. Negative chromosome testing is a case observation, not a universal diagnostic rule. Added frog/fish and cell models with dosage and tissue limitations. The null mouse remains normal-function/hypothesis context rather than a failed heterozygous knock-in. Verified and cached GEO:GSE229698; no retired shared accession file was used.

    Deep-research completeness checklist: phenotype coverage adequate after the additions above; feature counts retain source/cohort context instead of importing the report's pooled percentages. Subtypes N/A: no established separately mapped disease subtypes; craniosynostosis and mosaicism are variable presentations. Pathophysiology adequate after atomic-node and experimental-context corrections, with unresolved routes stated. Treatments/trials adequate for available supportive-care reports; an official ClinicalTrials.gov TRAF7 OR CAFDADD query returned no studies. Genetics adequate with recurrence, familial transmission, mosaicism and allele-specific uncertainty. Biomarkers/diagnostics adequate for molecular confirmation, segregation, cardiac assessment and clinically relevant cervical disease; no established diagnostic biomarker threshold. References: central disease-specific primary sources and available full texts consumed; no matching GeneReviews or StatPearls chapter in the offline Bookshelf index. Overall consumption adequate; unrelated tumor signaling, unverified title-only claims and pooled frequencies with inconsistent denominators were not imported.

    All new evidence titles were copied from cache metadata, with study relevance and source grading checked. Batched schema, ontology and reference validation passed: 125/125 snippets, zero unavailable/skipped snippets, 141 titles, zero issues. Two subsequent treatment-support snippets from the same validated sources also verified, bringing the final offline count to 127/127. Dataset verification passed. Additional local entity, causal-target, coarse-phenotype, qualifier, duplicate-key and enum checks passed. Whole-tree folded-text, snippet length/grading/title, reference-title, empty-snippet, environmental-evidence and cache integrity/order gates passed. Gene-activity grounding passed against origin/main; the disorder page rendered.

  summary: Address automated review on PR 11079; rebase onto post-freeze main
  details: |
    Responding to the ai4c-reviewer review on PR 11079, which requested changes on one item and made three suggestions.

    THE BLOCKING ITEM WAS REAL, AND ITS DIAGNOSIS WAS THE USEFUL PART
    The branch was based on cf97031e2, which predates the freeze of cache/dataset_accessions.json. Verified against origin/main's CLAUDE.md before acting: that file is now marked NEVER commit, enforced by test_no_automation_touches_the_frozen_dataset_cache, and superseded by per-dataset references_cache/GEO_*.md. Running `just verify-datasets` on the stale base wrote the frozen file and produced no GEO cache file at all, because the old verifier had no concept of one.

    Rebased onto origin/main (50c5fca26), restored cache/dataset_accessions.json to main's version, and re-ran `just verify-datasets`, which under the new tooling wrote references_cache/GEO_GSE273833.md. That file is now committed with the datasets: block, as main requires. datasets[].title already matched GEO's own title exactly, so no change was needed there.

    THE REBASE CHANGED THE SCIENCE, NOT JUST THE PLUMBING
    The new GEO cache file holds the full submission summary, and main's policy makes a geo: accession a citable, exact-quote-validated reference. The dataset that had been recorded as an uncitable lead is now evidence, and what it says is substantive:

    - TRAF7 ubiquitinates KRAS and NRAS for proteasomal degradation, so wild-type TRAF7 is a brake on RAS rather than somewhere vaguer upstream of ERK.
    - CAFDADD-associated variants specifically (not meningioma somatic alleles) exert a dominant-negative effect, causing KRAS/NRAS accumulation and constitutive MAPK-ERK1/2 hyperactivation.
    - A heterozygous Traf7 R654Q knock-in mouse shows growth retardation, skeletal abnormalities and neurobehavioural deficits, against a heterozygous null that is normal.
    - Selumetinib suppressed the ERK1/2 hyperactivation and improved brain-to-body weight ratio.

    That bears directly on two of this entry's three discussions, and both were updated rather than left stale:

    - traf7_mapk_direction: the gap now has a concrete proposed mechanism and a named substrate, and if it holds, CAFDADD is a RASopathy and the 2018 reduced-ERK1/2 result is the outlier. Cited as a lead worth resolving, not as the answer. The pathophysiology chain still carries the 2018 measurement as its ERK node, because that is the peer-reviewed one.
    - traf7_null_mouse_vs_human_missense: the proposed knock-in experiment has largely been done. Its notes now say so. It stays listed because the submission reports no cardiac or endothelial Klf2 readout, which is the specific arm this experiment targets.

    Everything cited from GEO:GSE273833 is graded evidence_source: OTHER and says in its explanation that it is a repository submission summary, not peer-reviewed text. This is a genuine epistemic step up from the previous state (uncitable) without pretending it is a paper.

    SUGGESTIONS, ALL THREE TAKEN
    - Added Epicanthus (HP:0000286) and Abnormal Pinna Morphology (HP:0000377), both connected to the craniofacial node. Bound the general pinna term rather than Low-set ears because the reported descriptions vary (dysmorphic, asymmetrically placed, low-set) and picking one would over-specify. VSD and double-outlet right ventricle were left out: the DR report's suggested codes for both were among the six the report's own term validation flagged as naming different concepts, and no cached reference carries a quotable VSD sentence.
    - Added a Physical and Occupational Therapy treatment arm targeting hypotonia. Its evidence quote establishes that a management schedule was proposed, not the content of the physical-therapy arm, and the explanation says so rather than overselling it.
    - Rebound both cardiac surgery treatments away from the generic NCIT:C15329 Surgical Procedure: congenital heart defect repair to NCIT:C157806 Cardiac Surgery, and the Bentall to NCIT:C50815 Aortic Valve Replacement. Both are reachable from the treatment enum root and validate.

    ONE REVIEWER OBSERVATION WORTH RECORDING
    The review noted, as a positive, that the deep-research report's own metadata flagged needs_review true, two unsupported quotes, one obsolete term and six label mismatches, and that none of it leaked into the YAML. That is the intended behaviour of treating a report as leads, and it is worth having the record say the checks are what produced that outcome, not luck.

    A LOCAL PYTEST FALSE ALARM
    tests/test_data.py run against the pre-rebase tree reported three failures in test_grouping_member_foreign_keys, on grouping files this PR does not touch. All 101 pass on the rebased tree, so they were base-commit failures already fixed on main, not this PR's.

    VALIDATION AFTER THIS ROUND
    just validate 100/100 snippets; validate-disorders passed; verify-datasets 1/1 with the GEO cache file present; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all OK; tests/test_data.py::test_grouping_member_foreign_keys 101 passed. check-snippet-length caught a four-word auricle quote, which was lengthened rather than baselined. No baseline file was updated. Compliance 86.0%.

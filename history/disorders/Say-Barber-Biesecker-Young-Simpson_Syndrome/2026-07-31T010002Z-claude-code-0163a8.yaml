  summary: 'Create: Say-Barber-Biesecker-Young-Simpson_Syndrome'
  details: |
    Created the SBBYSS disorder entry (MONDO:0011365, KAT6B, OMIM:603736). Deep research was run with the falcon (Edison Scientific) provider; the report, citations sidecar and Edison answer artifact are committed under research/. NEC preflight per CLAUDE.md 2b passed: runoak on MONDO:0011365 confirms RO:0004003 -> HGNC:17582 (KAT6B), xref OMIM:603736, and synonyms 'SBBYSS' / 'Ohdo syndrome, SBBYS variant', confirming the report is about the KAT6B entity and not MED12-related Ohdo syndrome, KAT6A/Arboleda-Tham, or the allelic genitopatellar syndrome. GeneReviews 'KAT6B Disorders' (PMID:23236640) was fetched, tagged GeneReviews in the top-level references block, and cross-referenced against the phenotype list; that cross-check added slow growth and small bowel malrotation. Falcon output was treated as leads only: the report contained no PMIDs, so each DOI was resolved via the PMC ID converter, cached with 'just fetch-reference', and every snippet verified as an exact substring of the cached abstract. Curated 29 phenotypes, 3 pathophysiology nodes with 16 evidenced causal edges, 127 evidence items across 20 references, the two positional allelic classes plus the recurrent exon 16 synonymous splice hot spot, the BRPF1-KAT6B-ING5-MEAF6 complex, prevalence, diagnosis (KAT6B sequencing and DNA methylation episignature), treatments, differential diagnoses, two mouse models and a patient-derived iPSC line. Cross-referenced against the allelic Genitopatellar_Syndrome entry (MONDO:0011640) so SBBYSS is modeled as the distinct milder entity. Corrected an earlier draft claim that polydactyly is not a recognised feature: PMID:32424177 and Orphanet ORPHA:3047 both support it, so it is curated as OCCASIONAL. A pre-PR red-team self-review (dismech-pr-review skill, fresh-context subagent) was run before pushing and its findings were addressed: the critical fix was five dangling pathophysiology downstream targets, which bundled 2-3 phenotypes each and matched no phenotype or node name; these were split into atomic edges whose targets now all resolve (16 edges, verified programmatically). Also corrected per that review: cleft palate frequency rebanded OCCASIONAL to FREQUENT to match the quoted 14/44 (32 percent); a methods-only snippet downgraded SUPPORT to PARTIAL; a mixed human-cell/mouse snippet split into separate IN_VITRO and MODEL_ORGANISM items; bulbous nasal tip and long great toes rebanded to VERY_FREQUENT for consistency with the identical source sentence and the 12/15 (80 percent) figure; the differential-diagnosis claim that GPS-restricted features are 'essentially absent' in SBBYSS softened to a difference of degree, since GeneReviews and PMID:25424711 both document them in SBBYSS; patellar hypoplasia frequency omitted because the only quantitative figure (8/32, 25 percent) conflicts with the qualitative sources and is ascertainment-limited; a title-as-snippet replaced with real result sentences; an unsupported 'binding determinants' phrase reworded; and cerebral anomalies, neurobehavioural difficulties, keratoconus, recurrent infections and increased fracture susceptibility promoted to structured phenotypes from snippets already available in the cache. A KAT6B-overexpression dosage caveat (PMID:40083716) was added to the experimental acetylation-restoring treatment. All 127 snippets were then independently re-verified as exact whitespace-normalized substrings of their cached references (0 mismatches), because the local reference validator reports 'Total checks: 0' and cannot be relied on alone. All four validations pass; compliance 99.6 percent (100 percent weighted).

  details: |
    New entry for oocyte/zygote/embryo maturation arrest 17 (MONDO:0957220, OMIM:620319), biallelic KPNA7. Curated mainly from the founding cohort study PMID:36647821 (full text cached), with PMID:36647833 (commentary), PMID:20699224 (Kpna7 knockout mouse) and PMID:22281085 (porcine KPNA7 knockdown). Allelic KPNA7 conditions (PMID:24045845, PMID:32179771, PMID:42278511) are cited in notes only. Deep research: falcon was requested but is not configured here; the recorded fallback produced research/KPNA7-related_Preimplantation_Embryonic_Arrest-deep-research-openscientist.md (8/8 references resolved; preflight-dr PASS for KPNA7). It was used as a cross-check: it adds no claims beyond the primary paper, states 8 ARM repeats where PMID:36647821 says 10 (the paper's figure is kept), and suggests an unresolved HP:0008215 and the obsolete GO:0008139, neither of which was bound. The ZGA node and its edges are model-derived from Kpna2 knockout mice and marked INDIRECT; the paralog substitution is recorded as a HUMAN_MODEL_MISMATCH discussion. A fresh-context self-review led to hedging the ZGA-to-arrest edge, citing the allelic reports, a no-replication note naming its PubMed search, and a preclinical cRNA rescue treatment. Validation: just validate passes, 32/32 snippets verified, entity refs and causal targets clean, check-snippet-grading clean, no GeneReviews chapter.

  summary: 'Review round 1: add staging, relapse treatment, lung and renal phenotypes'
  details: |
    Answers the first review of PR 15880, which asked for two additions and made four suggestions.

    Staging: a new stages section with Stage I to IV rows. Each gives the NWTS-5 five-year event-free survival (PMID:30255545) and the pooled AREN0321/AREN03B2 four-year event-free survival (PMID:38396300) for that stage, with patient numbers. Stage I records the omission of radiotherapy on AREN0321 and the COG authors' comparison of COG and SIOP stage I (7.6% against 39.5%), with their explanation that COG stage I is assigned at upfront nephrectomy and SIOP stage I after preoperative chemotherapy. Its notes record that the SIOP report itself (PMID:23880476) gives 42% stage I, not 39.5%. Stage II records the NWTS-5 rule that any renal sinus vessel invasion is stage II. Stage III carries the tumour rupture and inferior vena cava thrombus findings from the Shanghai cohort (PMID:38980838) and the NWTS-5 finding that tumour spill was not predictive. Stage IV records the addition of carboplatin on AREN0321 and points at the metastasis node through the Stage pathophysiology slot.

    Relapsed disease: two new treatment rows from the combined SIOP and AIEOP relapse series (PMID:24937667), both carrying its statement that no standard treatment guidelines are available for this patient group. Salvage Chemotherapy for Relapsed Disease binds NCIT:C15632 with CHEBI:5864 ifosfamide, CHEBI:31355 carboplatin, CHEBI:4911 etoposide and the NCIT:C10345 ICE Regimen term; High-Dose Chemotherapy with Autologous Stem-Cell Rescue binds NCIT:C16039. Each links to the metastasis node with an INDIRECT target_mechanisms item.

    Phenotypes: Lung Metastases, bound to HP:0100526 with coarse_binding_basis NO_HPO_TERM and a term_gap note listing the HPO label and synonym searches that returned no lung metastasis term (re-run on 29 Oct with the same result); and Renal Neoplasm (HP:0009726), wired from Primary Renal Tumor Growth. PMID:22579455, which had no quotable finding, is removed from references and its cache file is dropped. The PMID:38980838 cache is upgraded to full text, because the 41.7% figure is only in the full text; the entry's earlier snippet from it still verifies.

    The details of this PR's first history record are reworded so that they no longer refer to the curation tooling.

    Validation: just validate-disorders, validate-terms, count-verified-snippets --strict, check-snippet-grading, the whole-repo offline gates that CI runs, check-reference-titles-present, check-cache-order, check-logical-rules, check-qualifier-terms, check-cancer-origin and check-genereviews all passed; every phenotype is causally connected.

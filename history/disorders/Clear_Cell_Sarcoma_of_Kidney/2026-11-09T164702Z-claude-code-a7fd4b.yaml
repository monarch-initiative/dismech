  summary: 'Review round 1: regrade two PMID:30736802 quotes as BACKGROUND'
  details: |
    The reviewer found that the two new metastatic-site items citing PMID:30736802 were graded quote_role: REVIEW_SYNTHESIS, and that is wrong. Verified independently before changing anything: the paper's publication_types lists only Journal Article, it is a cyclin D1 immunohistochemistry study of 48 cases, and both quoted sentences sit in its introduction with reference markers attached ([7] for the bone propensity, [2, 5, 8, 9] for brain exceeding bone). They are the authors restating earlier literature, which is BACKGROUND. The same file already graded another sentence from this paper's introduction that way.

    Both items are now BACKGROUND. The brain item's explanation said 'A review's synthesis of reported series' and now says this paper's introduction summarising four earlier series. The adjacent NWTS-5 item's explanation called it 'the review above' and now says 'the series summarised above', so no explanation in the file still describes this paper as a review.

    Swept the rest of the PR for the same defect rather than fixing only what was reported. Of the publications cited by new items, only PMID:29589100 is graded REVIEW_SYNTHESIS, and its publication_types does list Review, so that one is correct. The other REVIEW_SYNTHESIS gradings in these two files are pre-existing and were not touched.

    One pre-existing item was looked at and deliberately left alone: PMID:24937667, on the high-dose-chemotherapy treatment row, is graded REVIEW_SYNTHESIS although its publication_types is Journal Article only. That grading is defensible on the sentence rather than the document, because the quote begins 'Summarising our study and previous reports' and reports a pooled count of 24 patients drawn partly from earlier papers. REVIEW_SYNTHESIS covers a publication's synthesis of work it did not perform; BACKGROUND would understate a new pooled figure and PRIMARY_RESULT would overstate it. It is also outside this PR's scope.

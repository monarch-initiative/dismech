  summary: 'Create: Clear Cell Sarcoma of Kidney'
  details: |
    New entry for clear cell sarcoma of the kidney (CCSK; MONDO:0005006; NCIT:C4264), a rare paediatric renal sarcoma distinct from Wilms tumour. Part of the neuroblastoma expansion series (issue 15822); claim issue 15848.

    Content: two epidemiology rows (age at diagnosis, male predominance); a SEER annual-incidence record (children 0-19, 2000-2017); two progression rows (presentation in early childhood; relapse, including the shift from bone to brain and fewer late relapses with modern chemotherapy); four pathophysiology nodes: a somatic BCOR internal tandem duplication (the origin node; renal mesenchymal cell bound to CL:0008019, with the CL searches recorded; molecular function GO:0003714 so the BCOR gene record is grounded), the alternative YWHAE::NUTM2B/E fusion from t(10;17), primary renal tumour growth, and distant metastasis to bone, brain and lung (conforms to invasion_and_metastasis#Metastatic Colonization); four histopathology rows (classic cords and fibrovascular septa, NCIT:C49203; variant patterns, NCIT:C35867; the vimentin-positive, cytokeratin- and MIC2-negative immunophenotype and BCOR immunoreactivity, both NCIT:C40998, with the searches for more specific terms recorded); four phenotypes (abdominal mass, haematuria, bone and brain metastases), all causally connected; a BCOR genetic record with three structured case fractions (85%, 100% and 87.18% in three cohorts); three differentials (Wilms tumour, neuroblastoma, renal rhabdoid tumour, each limited to what cyclin D1, BCOR and cytokeratin studies state, including a series in which the epithelial component of most Wilms tumours was also cyclin D1-positive (PMID:30736802)); and four treatments (radical nephrectomy, NWTS-5 regimen I with CHEBI-bound vincristine, doxorubicin, cyclophosphamide and etoposide and a stage-dependent effect modifier, carboplatin for stage IV on AREN0321, and radiotherapy), with small-number caveats. 66 evidence items from 24 references.

    Left out on purpose: the planned link to the BCOR sarcoma entry (that PR is on hold); YWHAE, NUTM2B and NUTM2E genetic records (no sourced molecular function for the fusion, so check-gene-activity-grounding would fail without a baseline edit); molecular has_subtypes; TP53 as a cooperating lesion; phenotype frequencies across treatment eras. The notes keep MONDO's placement under clear cell sarcoma and limit the entry to the renal tumour, without claiming how it relates to clear cell sarcoma of soft tissue.

    The histopathology section was added in a second drafting pass, after a pre-submission review found it missing, and was checked against its sources before commit.

    Source report: research/Clear_Cell_Sarcoma_of_Kidney-deep-research-claude_code.md (claude_code provider), re-validated before commit, 76 of 76 references resolved. preflight-dr returned WARN: the report's HGNC table is shifted by one row, so no gene identifier was copied from it; every gene was looked up in HGNC. Not committed: 50 uncited caches from the research and design runs.

    Validation on the branch rebased onto main: just validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo offline gates that CI runs (including check-gene-activity-grounding), check-reference-titles-present, check-cache-order, check-shared-disease-terms, check-logical-rules, check-qualifier-terms, check-delivery-system, check-cancer-origin (SOMATIC_LESION, one cell of origin derived) and check-genereviews (no chapter) all passed; all four phenotypes are causally connected.

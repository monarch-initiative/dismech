  summary: Evidence on all nine causal edges, and descriptions for the four that had
    none
  details: |
    All nine causal edges were uncited and four carried no description at all: the dissemination edge and the three metastatic-site edges were bare targets. Each is now cited from the entry's own reference set. The two driver edges are graded INDIRECT on purpose: BCOR ITD cites the authors' reading that the duplication is the major oncogenic event, which rests on recurrence and on tumours expressing only the aberrant allele rather than on a demonstrated path to growth, and the YWHAE-NUTM2 edge cites the 12 per cent recurrence framing, which makes the fusion an alternative driver without describing a mechanism. The site edges are split by what each source actually names: bone from the propensity sentence that also explains the tumour's older synonym, brain from both a review stating it now exceeds bone and a trial group's own comparison against NWTS-4, and lung from a small cohort count, which is why its description calls lung reported rather than characteristic. The dissemination edge quotes the bone-and-brain sentence and says in its explanation that lung is cited on its own edge instead, because that sentence does not name lung. Presentation is cited once for abdominal mass and once for haematuria from the same undenominated sentence, with the lack of a denominator stated in both explanations.

  summary: Add the neuroblastoma side of childhood opsoclonus-myoclonus
  details: |
    The entry already listed opsoclonus-myoclonus among PNS phenotypes but said nothing about its main childhood cause. This adds the neuroblastoma side in the curated sections, and keeps the two directions of association apart, because they have different denominators and are routinely conflated.

    A new pathophysiology node, 'Tumor-Infiltrating Polyclonal Lymphoid Response' (TISSUE; CL:0000236 B cell, CL:0000084 T cell; GO:0042113 and GO:0042098 both INCREASED), with edges to the existing Opsoclonus and Myoclonus phenotypes. It exists because neuroblastoma-associated OMS fits neither of this entry's two subtypes: 'Intracellular Antigen PNS' is cytotoxic-T-cell mediated and 'Surface Antigen PNS' is autoantibody mediated, and here no antigen and no pathogenic autoantibody has been identified. Its evidence is the controlled Children's Cancer Group histology (PMID:11344493: 12 of 13 OMS tumours with diffuse and extensive lymphocytic infiltration with lymphoid follicles, none of 41 matched controls), the polyclonal B and T expansion with tertiary lymphoid structures and no unifying antigen (PMID:37537844), and the compartment result that commercial serum autoantibodies are negative while CSF oligoclonal bands and B cells are present (PMID:28959231).

    The two directions. Under prevalence: OMA affects 2-3% of children with neuroblastoma (PMID:11344492), with the study's own ascertainment quoted beside it - 21 of 675 serum-bank questionnaire responses - so the figure is read against a method. On the new node: of 389 children with OMS, about half had a tumour and in those 194 it was neuroblastic, 73% neuroblastoma (PMID:28959231), with the consensus panel's independent statement of the same fraction (PMID:34006622). The prevalence note and the node explanation each say the two are not complements.

    A third definitions entry records that OMS is the one named exception in the 2021 PNS-Care criteria: definite PNS otherwise needs a high- or intermediate-risk antibody, and OMS with neuroblastoma or SCLC is definite without one because it has no specific antibody association (PMID:34006622). That is the practical consequence of the mechanism - a negative commercial panel does not argue against the diagnosis.

    Treatments. The existing Intravenous Immunoglobulin row gains the ANBL00P3 randomised trial (PMID:29376112: 81% versus 41% OMA response with IVIG added to prednisone and risk-adapted chemotherapy, OR 6.1, arms of 26 and 27), which is the strongest trial evidence for IVIG anywhere in this entry, plus a MODULATES link to the new node graded INDIRECT because the measured outcome is neurological response rather than any property of the infiltrate. The Rituximab row gains the stated reason it is preferred over cyclophosphamide (PMID:35260471), with the sentence's own trade-off kept: cyclophosphamide allows faster recovery of immune function after stopping.

    A discussions section is created with one KNOWLEDGE_GAP: whether the effector arm in OMAS is humoral or T-cell mediated. It attaches to the new node and to the Rituximab treatment, because the preference for rituximab rests partly on the B-cell premise the gap records as unsettled. Its evidence puts both arms side by side (PMID:35260471) and quotes the negative repertoire result with the authors' own sample-size limitation (PMID:37537844), so the absence of an identified clone reads as a failure to find rather than as a demonstration that none exists.

    Provenance. Composed by hand from the drafted snippet texts saved in memory/newpr_saved/n2_final/, not by reprocessing the halted workflow run. The claim-to-source mapping was re-derived by matching each drafted quote against the caches rather than trusting the run report, which is also how the multi-span quotes were confirmed. Two reference_title strings were written with the wrong apostrophe handling and were corrected against the cache frontmatter before commit; validation caught them. Only one new cache was needed (PMID:29376112) - the other seven sources were already tracked. An unrelated full-text upgrade of PMID_41871563.md, left in the worktree by an earlier run, was deliberately not committed.


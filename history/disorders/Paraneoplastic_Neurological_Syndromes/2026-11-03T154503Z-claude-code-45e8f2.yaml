  summary: Pointer subtype for opsoclonus-myoclonus syndrome, now curated in its own
    entry
  details: |
    Adds one has_subtypes row recording that opsoclonus-myoclonus syndrome is curated as its own entry, Opsoclonus_Myoclonus_Syndrome, created separately as part of the neuroblastoma expansion series. No content is removed from this entry and nothing moves.

    The row carries curated_in and no subtype_term. The new entry binds MONDO:0015247 with skos:exactMatch, so binding the same class here as well would bind it twice; this follows how the digenic pointer row in Dyskeratosis_Congenita is handled.

    The row reads differently from the two already present. Intracellular Antigen PNS and Surface Antigen PNS divide paraneoplastic syndromes by antigen compartment, whereas this one names a single clinical syndrome and so cuts across both rather than adding a third compartment. The description says this, because a reader could otherwise take all three rows as one classification.

    What justifies the row is that opsoclonus-myoclonus is the one syndrome the 2021 PNS-Care criteria name as an exception to the antibody requirement: it is accepted as definite paraneoplastic neurological syndrome without a high- or intermediate-risk antibody when it occurs with neuroblastoma or small-cell lung cancer. This entry already records that as a case definition, along with the rate of the syndrome within children with neuroblastoma and the tumour-infiltrating polyclonal lymphoid response. The paraneoplastic side stays here; the syndrome's own phenotypes, treatment and course are in the separate entry.

    The one evidence item quotes the sentence that makes this a subtype row at all, that opsoclonus-myoclonus-ataxia is a paraneoplastic neurologic syndrome affecting 2 to 3 per cent of children with neuroblastoma. It is copied from this entry's own prevalence record with its grading unchanged, including the BACKGROUND quote role, because the sentence opens a Children's Cancer Group serum-bank study and states the established classification rather than testing it. The same sentence is cited on the prevalence record for the 2 to 3 per cent figure; here only the classification is relied on, and the explanation says so.

    Validation: schema, term and reference validation pass with 129 snippets and 179 titles checked and no issues, and 129 of 129 snippets verify against the cached references. The granularity check now reports no dangling pointer and one informational pointer, where before the referenced entry merged it reported the dangling pointer. The duplicate-key, block-scalar, enum-value, entity-reference, causal-target, coarse-phenotype, qualifier-term and logical-rule gates pass, as do the whole-tree snippet-grading and reference-title gates and the eight relevant tests in tests/test_data.py.

  summary: 'Manual review: reframe SBCADD as a primarily biochemical phenotype'
  details: |
    Manually reviewed the complete disease entry and every previously linked
    local reference record. Rebuilt claims around direct ACADSB enzyme evidence,
    newborn-screening cohorts, and current diagnostic studies.

    Removed unsupported clinical frequencies, unrelated references, duplicate
    DOI/PMID records, the nonclinical C3 branch, and causal phenotype edges from
    exogenous 2-MBG experiments. Added genotype-based Hmong birth prevalence and
    carrier frequency, updated Chinese screening estimates, structured diagnosis
    and differential diagnosis, treatment-evidence limitations, and two open
    knowledge gaps.

    New reference records were generated only with `just fetch-reference`.
    Schema, target-scoped graph, term, history, folded-scalar, and reference
    validation passed. The repository-wide graph check still reports an
    unrelated pre-existing backlog in other disorders. Independent repository
    and scientific reviewers both returned GO after all evidence blockers were
    resolved.

  summary: Conform to xenobiotic_oxidative_phosphorylation_blockade module
  details: |
    Declared conforms_to against the new xenobiotic_oxidative_phosphorylation_blockade module on three pathophysiology nodes: Cytochrome c oxidase inhibition (trigger), Cellular energy failure (central effector), and Oxidative stress and free radical generation (the secondary oxidative stress amplifier).

    Deliberately NOT conformed: Carboxyhemoglobin formation, Leftward shift of the oxyhemoglobin dissociation curve, and Impaired tissue oxygen delivery. Those nodes are a separate upstream mechanism, impaired oxygen delivery, which the module explicitly places out of scope. This entry is the case that forced that scope line to be drawn, because carbon monoxide genuinely acts by both routes and only the direct respiratory-chain arm belongs to this module. The module notes record the distinction.

    No content was changed and no evidence was added or regraded.

  details: |
    Re-banded Headache from VERY_FREQUENT (80-99%) to FREQUENT: the snippet lists headache among nonspecific initial symptoms at COHb 15-30% but carries no frequency content, and the explanation's own wording ('common') maps to FREQUENT. The explanation now declares this a documented clinical estimate (Pattern D) rather than a value extracted from the citation. Dropped three OCCASIONAL bands whose snippets contain no frequency signal: Syncope (a COHb 30-70% dose-response threshold), Coma (a 1-3% mortality rate, not a coma frequency), and Chest pain (a COHb 1-9% threshold in a susceptible ischemic-heart-disease subgroup). Cognitive impairment (15-40%) and Myocardial injury (approximately one-third of moderate-to-severe cases) were audited and kept.

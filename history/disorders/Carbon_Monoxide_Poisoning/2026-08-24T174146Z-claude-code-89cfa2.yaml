  - computational_models
  summary: Add Coburn-Forster-Kane computational model linking ambient CO exposure
    to carboxyhemoglobin formation
  details: |
    Added a computational_models block for the Coburn-Forster-Kane (CFK) equation (Coburn, Forster and Kane 1965, PMID:5845666), model_type PHYSIOLOGICAL, with six model variables (PICO inspired CO partial pressure, A[COHb]t blood carboxyhemoglobin, VA alveolar ventilation, DLCO pulmonary diffusing capacity for CO, Vb blood volume, VCO endogenous CO production). The PICO input variable is bound through ModelVariable.mappings_list to ECTO:0000207 'exposure to carbon monoxide'; ModelVariableDescriptor inherits an open Term range from Descriptor, so this required no schema change. One modeled_mechanisms link to the existing 'Carboxyhemoglobin formation' pathophysiology node with relationship RECAPITULATES, fidelity HIGH, an explicit limitations statement, and one readout carrying its own evidence. Curated as the worked example of a computational model whose input variable is an environmental exposure concentration, following a gap analysis against the Monarch EnVar prioritized environmental variables survey. Three deliberate omissions are recorded in notes rather than papered over: (1) the blood carboxyhemoglobin output variable is left unbound because LOINC has no adapter in conf/oak_config.yaml and no cache, so a LOINC term could not be validated, and CHEBI has no carboxyhemoglobin class; (2) no severity_scale or threshold is curated on that variable, because this entry's own Carboxyhemoglobin biochemical marker records that COHb magnitude correlates imperfectly with clinical severity and a graded mapping would contradict it; (3) no repository_url, model_id, model_format or model_software, because the CFK equation is a published closed-form differential equation with no deposited SBML entry. Only the Carboxyhemoglobin formation node is linked; the entry's non-hypoxic toxicity nodes are outside what the model represents. Two new references cached with linkml-reference-validator (PMID:42347386 field validation against monitored ambient CO, PMID:33283194 clinical characterization); 69/69 snippets in the file verified, and both findings[].supporting_text quotes checked by hand against their cached abstracts. Schema and term validation pass.

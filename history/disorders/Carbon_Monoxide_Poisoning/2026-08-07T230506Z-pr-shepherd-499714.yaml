    PR #7115 review follow-up (ai4c-reviewer, 2026-08-05). Item 2: Myocardial injury bands OCCASIONAL while its snippet reports 'approximately one-third' of moderate-to-severely poisoned patients, a downward departure the frequency guidelines require to be stated in the evidence explanation. The explanation now names the denominator argument explicitly: the one-third figure is conditioned on the moderate-to-severe subgroup, which is a minority of all CO presentations, so the disease-wide share bands OCCASIONAL (5-29%) rather than FREQUENT (30-79%). Also took the non-blocking suggestion on Cognitive impairment, whose reported 15-40% straddles the band boundary: the explanation now states that FREQUENT is banded on the upper end of the range and that the lower end would band OCCASIONAL. No frequency values were changed and no new references were introduced. Validation: just validate passed; just count-verified-snippets over Thallium_Poisoning.yaml and Carbon_Monoxide_Poisoning.yaml reported 146/148 verified with 2 skipped by prefix.

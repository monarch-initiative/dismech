  details: |
    Backfill for issue #8085. Added influences_mechanisms on all five environmental entries, each targeting the 'Carboxyhemoglobin formation' pathophysiology node. The four combustion sources (faulty heating appliances, fire smoke, motor vehicle exhaust, portable generators and indoor combustion) are TRIGGERS with causal_link_type DIRECT: they differ in where the carbon monoxide comes from, not in how it enters, so they share the mechanistic edge evidence from PMID:26563790 while their descriptions carry the source-specific detail. Methylene chloride exposure is modelled separately as INDIRECT_KNOWN_INTERMEDIATES because no carbon monoxide is inhaled at all - the solvent is metabolized hepatically to CO, which is why the carboxyhemoglobin rise is delayed and prolonged. Validated with just validate, just validate-terms and just validate-references (65/65 snippets); confirmed all five environmental nodes now appear in the pathograph with zero integrity issues.

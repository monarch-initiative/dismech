  summary: 'Create: Carbon Monoxide Poisoning'
  details: |
    De novo creation of the Carbon Monoxide Poisoning entry (MONDO:0800373). Deep research via the claude_code provider (11 web searches, 14 turns). Modeled the dual-insult pathophysiology: carboxyhemoglobin formation with leftward oxyhemoglobin-dissociation-curve shift and impaired tissue oxygen delivery; cytochrome c oxidase (Complex IV) inhibition causing histotoxic hypoxia; an oxidative/xanthine-oxidase inflammatory cascade; and immune-mediated (anti-MBP) delayed demyelination producing delayed neurological sequelae; plus myocardial ischemic injury. Curated 13 phenotypes, 5 exposure sources (incl. methylene chloride to endogenous CO), normobaric and hyperbaric oxygen treatments, a globus pallidus histopathology finding, structured annual-incidence prevalence, and two discussions (KNOWLEDGE_GAP on HBO patient selection with conflicting RCTs; HUMAN_MODEL_MISMATCH on rodent anti-MBP autoimmunity). All 55 evidence snippets verified as exact substrings of cached PubMed abstracts; every ontology term OAK-verified. Validation and manual snippet check pass; weighted compliance 94.0%.

  details: |
    Created the MONDO:0005767 clostridial myonecrosis infectious disease entry from the OpenScientist report at research/Gas_Gangrene-deep-research-openscientist.md. The deep-research identity preflight returned SKIP, not FAIL, because MONDO records no human causal gene for this bacterial infection; manual preflight confirmed the report targeted gas gangrene / clostridial myonecrosis and the expected Clostridium perfringens and Clostridium septicum pathogen scope. Curated a compact human entry with the C. perfringens and C. septicum infectious agents, traumatic/postsurgical/spontaneous clostridial seeding, alpha-toxin and theta-toxin pathophysiology branches, systemic shock/hemolysis, four phenotypes, and surgical plus antibiotic treatment records. Used eight quotable cached PMID records and avoided report leads that validation flagged as unsupported, off-topic, or mislabelled, including veterinary blackleg references and the bad UBERON fascia and CHEBI ceramide CURIEs. Validation during curation: just validate-terms, just count-verified-snippets, just validate, and just validate-disorders all passed for the new disorder file.

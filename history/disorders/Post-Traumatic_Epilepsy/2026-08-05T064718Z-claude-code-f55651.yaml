  summary: 'Review response: Post-Traumatic Epilepsy (PR 7978, rounds 2-6)'
  details: |
    Append-only record of the six review rounds on PR 7978. The CREATE record for this entry is correctly frozen and describes the entry as first written (four conformance declarations, 36/36 snippets); this record describes what the entry became.

    Structural changes. Module conformance retargeted from #Neuronal Hyperexcitability and Hypersynchrony to #Seizure Generation and Epileptogenesis on the epileptogenesis node, and dropped entirely from the blood-brain barrier node, where #Ion Channel and Synaptic Dysfunction was a category error: barrier breakdown is a vascular event, not a channel or synaptic one. Three of eight nodes now conform, not four. An explicit Early Provoked Seizures node was added as a separate branch off the injury, so the early-versus-late dissociation the entry argues for is visible in the graph rather than only in prose. A diagnosis section (EEG, brain imaging), a clinical_trials block (NCT01463033 levetiracetam prevention pilot, NCT01048138 biperiden), and a Refractory drug response phenotype (HP:0020174) were added. The focal-to-bilateral tonic-clonic phenotype was removed, because no cited source reports post-traumatic seizure semiology.

    Evidence corrections. The albumin/TGF-beta chain at the barrier node was evidenced (PMID:17121744, PMID:25836421) rather than asserted in prose. Levetiracetam gained the 2024 Neurocritical Care Society guideline (PMID:38316735), which had been attached to the wrong treatment. The biperiden results paper (PMID:39175759) was added with its negative primary endpoint as REFUTE.

    Three factual errors of mine were caught and fixed, all the same failure mode of writing what I expected a source to say rather than what it says. First, a VERY_FREQUENT frequency band and a focal-onset binding hung on a methods sentence containing neither; the band was dropped and the focal-onset claim attributed to the MONDO:0043264 definition, which is its only basis. Second, an assertion that the biperiden late-seizure statistic was internally inconsistent because its confidence interval spans unity; 2.03 is a count-regression coefficient on the log scale, so the null is zero, the interval excludes it, and no inconsistency exists. That claim was removed from three locations and replaced with the caveat the authors actually give, allocation imbalance on injury severity, cited verbatim. Third, GCSoS expanded as admission Glasgow Coma Scale when the paper defines it as on scene and reports GCSoA separately; corrected in three places.

    Also removed review-process narrative that had leaked into three permanent evidence explanation fields, and pruned the scope note, which had gone stale by listing dimensions the same commit had just curated.

    Final state: just validate passes with 60/60 snippets verified. Compliance 80.8 percent. Reviewer verdict APPROVE with no critical or important findings remaining.

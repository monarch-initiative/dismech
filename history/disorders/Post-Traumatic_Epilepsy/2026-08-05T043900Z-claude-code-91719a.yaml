  summary: 'Create: Post-Traumatic Epilepsy (MONDO:0043264)'
  details: |
    De-novo curation of post-traumatic epilepsy, the archetypal acquired epilepsy and previously absent from dismech.

    Deep research: claude_code provider (80 KB report, 22 unique PMIDs), report and citations sidecar committed under research/. Treated as leads only; every PMID independently fetched and every snippet verified as an exact substring of the cached abstract.

    Model: a seven-node chain from traumatic brain injury through three parallel arms (blood-brain barrier disruption with albumin extravasation, inflammasome-driven neuroinflammation, and GABAergic interneuron loss), converging via reactive astrogliosis on epileptogenesis during the latent period and then on late unprovoked seizures. Four nodes declare conformance to epilepsy_excitation_inhibition_imbalance.

    The entry is built around the early-versus-late seizure distinction. Short-term prophylaxis is attached to the injury node with MODULATES, deliberately NOT to the epileptogenesis node, because the pivotal Temkin trial showed a large early effect (14.2 to 3.6 percent) and no late effect (27.5 versus 21.1 percent at two years). That negative result is recorded as REFUTE evidence on the treatment rather than glossed.

    Three discussions: (1) KNOWLEDGE_GAP on why suppressing early seizures leaves epileptogenesis untouched and what that implies about anticonvulsant versus antiepileptogenic endpoints; (2) KNOWLEDGE_GAP on the absent epileptogenesis biomarker that blocks prevention trials; (3) HUMAN_MODEL_MISMATCH on why preclinical antiepileptogenic successes have not translated, including the argument that preclinical seizure-burden endpoints may be measuring the wrong variable.

    Cache note: MONDO:0043264 was new to dismech and the live OLS lookup timed out during term validation. The DiseaseTerm enum cache and cache/mondo/terms.csv were seeded by a one-off validate run against the local sqlite:obo:mondo adapter; conf/oak_config.yaml was restored afterwards and is unmodified in this branch.

    Validation: just validate passes (schema, terms, references) with 36/36 snippets verified against cached references. Compliance 77.3 percent global.

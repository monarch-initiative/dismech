  summary: Reviewed and enhanced Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary with evidence-backed classifications and histologic subtypes, causal edges from germ cell and subtype-specific pathophysiology nodes to clinical and endocrine phenotypes, coarse phenotype binding basis on Ovarian Mass, somatic genetic driver grounding (12p gain, KRAS, PIK3CA), and treatment target_mechanisms.
  details: Added evidence blocks (PMID:40275685) to classifications.harrisons_chapter and classifications.icdo_morphology and across all 5 has_subtypes entries (Yolk Sac Tumor of Ovary, Ovarian Embryonal Carcinoma, Immature Teratoma of Ovary, Ovarian Non-Gestational Choriocarcinoma, Mixed Germ Cell Tumor of Ovary). Preserved qualitative prevalence context in prevalence notes rather than an ungrounded percentage string. Added downstream causal edges from Primordial Germ Cell-Derived Malignancy to Ovarian Mass, Pelvic Mass, Abdominal Pain, Abdominal Distension, and Ascites; from Yolk Sac Tumor Molecular Alteration to Elevated Serum Alpha-Fetoprotein (and bound molecular_functions to GO:0016303 1-phosphatidylinositol-3-kinase activity); and from Trophoblastic and Mixed-Lineage Hormone Production to Precocious Puberty and Abnormal Vaginal Bleeding. Added coarse_binding_basis (PATHOGRAPH_HUB) to Ovarian Mass (HP:0100615). Added PMID:40275685 evidence and variant_origin (SOMATIC) to Chromosome 12p Gain / Isochromosome 12p, KRAS, and PIK3CA. Linked all 4 treatment entries (Fertility-Sparing Staging Surgery, BEP Chemotherapy, Active Surveillance After Complete Resection, Salvage Chemotherapy)
    to pathophysiology nodes via target_mechanisms.

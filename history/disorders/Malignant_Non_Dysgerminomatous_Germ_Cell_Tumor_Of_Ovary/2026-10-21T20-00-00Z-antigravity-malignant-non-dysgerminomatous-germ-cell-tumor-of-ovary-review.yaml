  summary: Added classifications, subtype MONDO bindings, tumor-to-phenotype causal edges, somatic driver evidence, and treatment modality/target_mechanisms.
  details: Added harrisons_chapter (ONCOLOGY_HEMATOLOGY) and icdo_morphology (Germ Cell Tumor) classifications citing PMID:37372675 and PMID:40275685. Bound subtype_term MONDO terms for Yolk Sac Tumor (MONDO:0006344), Immature Teratoma (MONDO:0018369), Choriocarcinoma (MONDO:0004322) and Mixed Malignant Germ Cell Tumor (MONDO:0003710). Moved the deprecated prevalence percentage (2-5%) into notes. Added molecular_functions GO:0016303 (INCREASED) to Yolk Sac Tumor Molecular Alteration. Added six downstream edges from Large Unilateral Marker-Secreting Ovarian Tumor to Large Ovarian Mass, Abdominal Distention From Tumor Bulk, Abdominal or Pelvic Pain, Elevated Alpha-Fetoprotein, Elevated Beta-Human Chorionic Gonadotropin and Elevated Lactate Dehydrogenase. Added a reports_on readout from the beta-hCG phenotype to that tumor node. Added PMID:40275685 evidence to the 12p gain, KRAS and PIK3CA genetic entries. Set therapeutic_modality SMALL_MOLECULE on BEP, Paclitaxel-Carboplatin and Neoadjuvant Chemotherapy, with a BEP note on bleomycin. Added target_mechanisms (INHIBITS the tumor node) to Fertility-Sparing Surgery and Neoadjuvant Chemotherapy.

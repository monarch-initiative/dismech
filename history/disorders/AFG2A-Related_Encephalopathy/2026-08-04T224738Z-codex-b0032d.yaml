  summary: Review publication completeness and claim-evidence alignment
  details: |
    Completed a publication-readiness and claim-evidence audit of the full entry.
    PubMed searches for AFG2A or SPATA5 through 2026-08-04 found no disease-specific
    publication newer than the 2026 systematic review (PMID:41933351); the two later
    2026 hits were unrelated gene-string false positives. Re-ran the deep-research
    named-entity preflight against MONDO:0014698: it returned WARN because the report
    discusses C1orf109, but AFG2A/SPATA5 was the dominant entity and the OMIM anchor
    matched. C1orf109/AIRIM and AFG2B organoid results remain explicitly marked as
    cross-subunit extrapolation rather than direct AFG2A evidence.

    Corrected a selected-cohort 3% diagnostic yield that had been represented as
    PERIOD_PREVALENCE and 3,000 per 100,000; preserved the finding under molecular
    diagnosis instead. Replaced unsupported or overly absolute language about disease
    course, postnatal reversibility, universal sequencing ascertainment, movement-
    disorder under-recognition, and IESS treatment failure with claims bounded to the
    available retrospective data. Added direct evidence for the three reported deaths
    and for knockdown-and-rescue of the neuronal ATP deficit. Reclassified cultured rat
    cortical-neuron and ex vivo patient blood-cell experiments as IN_VITRO rather than
    MODEL_ORGANISM or HUMAN_CLINICAL. Also changed the cross-subunit translation-to-
    neuroepithelial-vulnerability edge from DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES.

    Validation after edits: schema clean; ontology terms clean; 105/105 reference
    snippets verified against generated caches; independent verbatim-snippet checker
    105 verified, 0 failed; compliance 94.0% global and 93.9% weighted. Broad
    validation-induced reference-cache normalization was deliberately excluded from
    the review diff.

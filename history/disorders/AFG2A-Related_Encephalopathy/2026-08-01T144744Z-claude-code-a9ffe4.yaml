  details: |
    Created kb/disorders/AFG2A-Related_Encephalopathy.yaml for microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal muscle tone syndrome (MONDO:0014698), AFG2A/HGNC:18119. Preflight re-run: runoak confirmed RO:0004003 HGNC:18119 ! AFG2A on the anchor. Deep research provider: claude_code (research/AFG2A-Related_Encephalopathy-deep-research-claude_code.md, 820s, 9 web searches, 69 turns, 24 citations), read in full and used to rewrite a textbook first pass. GeneReviews: none exists; three PubMed searches on 2026-08-01 returned zero records and the single GeneReviews PMID surfaced by a broader phenotype search (PMID:20301382) is the unrelated mtDNA deletion chapter. Phenotype baseline used instead is the 51-individual systematic review PMID:41933351, cross-checked against the 30-patient summary in PMID:29343804. Curated: 10-node single-root connected pathophysiology DAG (AFG2A loss of function -> 55LCC complex -> pre-60S maturation -> global protein synthesis -> neuroepithelial vulnerability -> cortical neuron growth, with parallel replisome-proteostasis and mitochondrial branches), 19 HPO-bound phenotypes with derived frequency bands, genetic section with three recurrent variants cited to primary reports rather than to the review table, two treatments plus hearing habilitation, four differential diagnoses (two MONDO-bound: MONDO:0859206 AFG2B, MONDO:0044970 mitochondrial disease; two deliberately unbound with reasons), a classifications block, four discussions and one ProteomeXchange dataset. Named-entity-confusion discipline recorded in notes: AFG2A was formerly SPATA5, the local HGNC adapter still labels hgnc:18119 SPATA5, and AFG2B/SPATA5L1 is a different gene whose only citation (PMID:34626583) appears solely in differential_diagnoses. Validation: just validate clean, 98/98 snippets verbatim (both linkml-reference-validator and scripts/check_snippets_verbatim.py), folded-hyphen check clean, compliance 94.2%.

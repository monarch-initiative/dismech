  summary: Correct GMFCS denominator on Inability to walk phenotype (n=22, not 51)
  details: |
    Addresses the single blocking IMPORTANT item from the ai4c-reviewer re-review of fix commit 35ac1e3b.

    The notes on the Inability to walk (HP:0002540) phenotype asserted that the GMFCS distribution was drawn from the 51-individual pooled cohort. It is not. The published percentages resolve exactly to n=22: 59.09% = 13/22, 27.27% = 6/22, 9.09% = 2/22, 4.55% = 1/22, summing to 22 individuals and to 100%. The deep-research artifact records the GMFCS subgroup as n=22 explicitly.

    The note has been rewritten to state the n=22 arithmetic, to record that the cached paper's own prose ('All individuals were assessed using the Gross Motor Function Classification System') conflicts with that arithmetic and would imply a denominator of 51, and to state which reading the frequency band was chosen on. The VERY_FREQUENT band is retained on the n=22 reading (19/22 = 86.36% at GMFCS IV-V), with the alternative pooled-cohort reading (19/51 = 37%, FREQUENT) recorded alongside it and the reason for the preference given: ungraded individuals are unknown rather than known-ambulatory.

    The disorder-level notes block, which already enumerates three deliberately omitted frequency bands, now also records this one retained band and its dual denominator, so the entry's denominator discipline is applied consistently and visibly.

    The phenotype description was also adjusted from 'Every individual in the pooled cohort with available data was graded' to 'Among the individuals graded', so the description no longer implies the 51 denominator either.

    No evidence snippets were changed and no evidence marker was strengthened. Validation at this change: schema clean, terms passed, references 103/103 verbatim, check_snippets_verbatim.py 103 verified / 0 failed, folded-hyphen clean, compliance 94.0% global / 93.9% weighted (unchanged).

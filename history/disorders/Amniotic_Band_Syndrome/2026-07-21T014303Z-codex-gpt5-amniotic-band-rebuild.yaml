    nonspecific, secondary, and body-wall rows; added ontology-backed terminal
    limb loss and intrauterine amputation; and connected every retained
    phenotype through evidence-bearing hypothesis-grouped edges. Reworked fetal
    ultrasound, postnatal assessment, risk contexts, the limb-body-wall complex
    boundary, selected-case fetoscopic release, postnatal ring reconstruction,
    and informational genetic counseling. Preserved SURGERY modality metadata
    for both operative treatments. Added four prioritized cached references and
    did not assert a universal genetic cause.

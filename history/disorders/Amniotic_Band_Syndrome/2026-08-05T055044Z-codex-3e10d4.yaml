  summary: 'Review: Amniotic Band Syndrome publication readiness'
  details: |
    Independent publication-readiness review. Corrected the causal model to distinguish band-mediated compression from vascular-disruption/adhesion mechanisms. Removed unsupported broad causal edges, split perfusion and neural mechanisms, and added quantitative Orphanet phenotypes, diagnostic ultrasound pitfalls, treatment evidence, animal models, knowledge gaps, and provenance. Added seven literature references through the reference-cache workflow. No disorder-specific registered interventional trial was identified. Phenotypes lacking direct mechanism evidence remain deliberately unconnected.

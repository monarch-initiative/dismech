  details: |
    Backfill for issue #8085. Both exposures point at amnion rupture or detachment, the initiating event of the extrinsic model, which is the only node an antenatal risk context can honestly reach in this entry since everything downstream of it is mechanical consequence. Both are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, and the grades carry this entry's own caution rather than overriding it: the twinning exposure is annotated by its curator as a population-level risk context that is not a sufficient cause and not evidence that either fetus must be affected, and the uterine-procedure exposure is annotated as not establishing causation. Prior uterine surgery is the more mechanistically suggestive of the two, since it plausibly weakens the membranes this node has rupturing, and the weaker of the two evidentially, resting on ten pregnancies; it is graded with the twinning link rather than above it for that reason. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 141 of 141 verified.

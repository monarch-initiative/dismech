  details: |
    Created the SCA48 (ATX-STUB1, MONDO:0032526, STUB1 hgnc:11427) entry de novo, replacing a placeholder seed written from textbook knowledge. Deep research: research/Spinocerebellar_Ataxia_48-deep-research-falcon.md (Edison/falcon, 33 citations). Its frontmatter reference_validation reported 13/13 resolved and confabulation_rate 0.0, but only 13 of 33 citations carried a fetchable identifier - the other 20 are bare author-year keys and were never checked, so the clean table covers 39 percent of the report. The report contained zero PMIDs; all 13 identifiers were DOIs. Every DOI was converted to a PMID via the PMC ID converter and re-fetched with just fetch-reference, so no DOI-keyed (CI-unchecked) evidence was used and just count-verified-snippets --unskip-prefix DOI was not needed. term_validation reported 18/18 resolved with matching labels; term selection was still done independently with OAK. just preflight-dr with MONDO:0032526 --strict returned WARN, flagging TBP at 68 percent of STUB1 mentions - inspected and confirmed legitimate (TBP is the curated modifier locus), not Named Entity Confusion. Zygosity discipline: the recessive STUB1 disorder SCAR16 / Gordon Holmes syndrome is already curated as Cerebellar_Ataxia-Hypogonadism_Syndrome.yaml; that file was read first and every evidence item here was checked for heterozygous-versus-biallelic attribution. Two items sourced from recessive cohorts (PMID:33097556 SCAR16 patient fibroblasts and iPSC neurons) are explicitly labelled as such in node description, discussion rationale and evidence explanation. Content: 8-node causal chain from heterozygous STUB1 variant through loss of chaperone-coupled quality control to Purkinje cell degeneration, cerebellar and dentate involvement, and cerebello-cerebral circuit disruption, plus a parallel provisional PINK1/Parkin mitophagy branch and a TBP modifier node. conforms_to declared against loss_of_proteostasis#Loss of Proteostasis, loss_of_proteostasis#Misfolded-Protein Aggregation, cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration and cerebellar_purkinje_degeneration#Loss of Cerebellar Cortical Output. The digenic-versus-modifier TBP debate is modelled as two mechanistic_hypotheses (sca48_monogenic CANONICAL, sca48_tbp_digenic DEPRECATED) with the digenic position given its own supporting quote before its refutation. GeneReviews baseline: no STUB1/SCA48/SCAR16-specific chapter exists (PubMed searched); the Hereditary Ataxia Overview PMID:20301317 is tagged in top-level references and the absence is documented in notes. A claimed digenic or modifier interaction with intermediate-length ATXN2 repeats was dropped - PubMed returns no SCA48/STUB1-ATXN2 literature. Purkinje-loss-to-cerebellar-atrophy and node-to-phenotype causal edges were left uncited rather than reusing node citations for edge claims. Red-team self-review run via a fresh subagent using the dismech-pr-review skill before opening the PR; it found a critical omission (pyramidal/upper-motor-neuron involvement denied in prose while cited abstracts document it), seven orphaned phenotypes, a mis-signed evidence item, two stale references to the retired PARTIAL value, a mis-graded evidence_source, and a mixed-source evidence item - all fixed. Validation: just validate, just validate-disorders, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-enum-values, just check-qualifier-terms, just check-folded-hyphens and just verify-datasets all pass; 110/110 snippets verified; compliance 91.3 percent global, 91.2 percent weighted. 26 references cited.

  summary: 'Edit: repoint SCA48 SCAR16 cross-reference to the new SCAR16 entry'
  details: |
    Follow-on correction caused by creating kb/disorders/Autosomal_Recessive_Spinocerebellar_Ataxia_16.yaml in the same change. SCA48 previously said the allelic recessive disorder was curated in this knowledge base as Cerebellar Ataxia-Hypogonadism Syndrome and bound its SCAR16 differential to MONDO:0008935. That is now stale and conflates two different concepts: SCAR16 (MONDO:0014339) is gene-defined by biallelic STUB1, while Gordon Holmes syndrome (MONDO:0008935) is a clinically defined, genetically heterogeneous entity whose commonest causes are RNF216 and PNPLA6. Three text changes plus one disease_term rebinding: the description now names SCAR16 with its own MONDO ID and entry and explains that the hypogonadic subset additionally meets the Gordon Holmes definition; the differential_diagnoses entry is renamed from 'SCAR16 / Gordon Holmes syndrome (biallelic STUB1)' to 'SCAR16 (biallelic STUB1)' and rebound from MONDO:0008935 to MONDO:0014339, with the Gordon Holmes relationship stated in its description; and one inheritance sentence drops the conflated 'SCAR16 / Gordon Holmes syndrome' phrasing. No evidence items, snippets, distinguishing_features or pathophysiology were touched. just validate passes on the edited file with 120/120 snippets still verified.

  summary: 'Create: IFNAR1_Deficiency (MONDO:0030970)'
  details: |
    De novo curation of autosomal recessive and dominant-negative IFNAR1 deficiency (immunodeficiency 106). Deep research: one openscientist report, committed alongside the entry (research/IFNAR1_Deficiency-deep-research-openscientist.md). Report reference validation resolved 21/21 citations with confabulation_rate 0.0; term validation returned needs_review: true with six mislabelled terms, two of which were real wrong bindings rather than parsing artefacts - HP:0032251 offered as 'Abnormal susceptibility to viral infection' (ontology label: Abnormal immune system morphology) and NCIT:C15320 offered as 'Supportive Care' (ontology label: Study Design). Neither was bound. NCIT:C15747 was used for supportive care instead, read from OLS. Separately, just preflight-dr flagged that the report gives this disease's OMIM entry as '#619304 (Immunodeficiency 45)'; immunodeficiency 45 is the IFNAR2 disease already curated here as IFNAR2_Deficiency, and MONDO cross-references MONDO:0030970 to a different OMIM entry. No OMIM identifier was recorded in the entry. Every ontology CURIE in the entry was resolved against OLS at the time of writing; one label error of my own (HP:0001751) was caught by just validate-terms in a sibling entry in the same session. Structure follows the curated sibling IFNAR2_Deficiency deliberately so the type I interferon pathway entries read against each other. Two molecular arms are modelled: the recessive complete signalling null, and the negative-dominance allele class that impairs IFN-alpha and IFN-omega responses while sparing IFN-beta. Validation: just validate passes schema, term and reference checks with 45/45 snippets verified against cached references; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass.

  summary: 'Review round 1: diagnosis section, MIS-C phenotype, term rebindings'
  details: |
    Addresses all three IMPORTANT findings and all three suggestions from the ai4c-reviewer review on PR #11793, in one push. (1) Added a diagnosis section with three entries: whole-blood IP-10 induction assay (PMID:39312669), molecular genetic testing including copy-number analysis (PMID:35091979, PMID:42097348), and differential diagnosis against neutralizing anti-type-I-interferon autoantibodies (PMID:39680367, PMID:42524028). (2) Added a multisystem inflammatory syndrome phenotype and a second structural allele from PMID:35091979, which was cached but uncited. (3) Rebound the screening treatment from NCIT:C15240 (Genetic Counseling) to NCIT:C92803 (Genetic Screening). (4) Tightened GO:0034340 to GO:0071357 (cellular response to type I interferon), the exact match for the node's preferred_term. (5) Recorded in notes why HSCT is not curated as a treatment - the report supplies no citation and, separately, the rationale is weaker than it appears because IFNAR1 is ubiquitously expressed and the defect is cell-intrinsic in fibroblasts. (6) Added the surface-expressed non-functional IFNAR1 allele class to the genetic notes, since it is the case a flow-cytometry surface-expression assay would read as normal. One term error of my own occurred and was caught by just validate-terms: NCIT:C16583 written from memory as 'Immunologic Technique' is actually 'Filtration'. The replacement NCIT:C17455 (Enzyme Immunoassay) is the exact concept but is not reachable from NCIT:C25218, so both assay entries bind NCIT:C25294 (Laboratory Procedure) with the specificity in preferred_term, and that decision is recorded in the entry. Validation: 55/55 snippets verified; schema, term, entity-ref, causal-target, duplicate-key, qualifier-term and enum-value checks all pass.

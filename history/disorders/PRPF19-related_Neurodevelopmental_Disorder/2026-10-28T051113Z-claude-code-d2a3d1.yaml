  summary: 'Create: PRPF19-related neurodevelopmental disorder'
  details: |
    New entry for MONDO:1040005 from the defining series of six individuals with de novo PRPF19 variants (PMID:37962958), with background on PRPF19 U-box E3 ligase activity (PMID:15660529), Prp19-complex ubiquitination at the spliceosome (PMID:20595234) and mouse knockout lethality (PMID:26663487). Pathophysiology: germline variant node (conforms to spliceosome_component_dysfunction Germline Spliceosome Component Variant; MF ubiquitin protein ligase activity, CC Prp19 complex) -> impaired Prp19 complex assembly (shown only for the frameshift) -> altered exon usage (conforms to the module's mis-splicing node; evidence is fly ortholog knockdown only) -> reduced neural precursor proliferation and mushroom body development -> motor delay, autism, intellectual disability. A separate, non-conforming duplication branch leads to increased proliferation and macrocephaly. Speech delay, hypotonia and tall stature are left unconnected for lack of mechanistic evidence. A KNOWLEDGE_GAP discussion records that missense mechanism and non-splicing roles are untested. No ClinGen validity record was found in the local cache. Stub deleted.

  details: |
    Created de-novo MKMS entry for the STAG2 X-linked cohesinopathy MONDO:0026722 OMIM:301022. Textbook draft enhanced with deep research; falcon/Edison failed with 402 Payment Required so fell back to the claude_code provider with 12 citations; openscientist queued. No GeneReviews article exists. Evidence anchored on independently verified PubMed abstracts PMID:28296084, PMID:29263825, PMID:30158690, PMID:36467423, PMID:34580287, PMID:41300816. Thirteen phenotypes and a four-node pathograph from STAG2 loss-of-function through cohesin deficiency and transcriptional/chromatin dysregulation to impaired brain development plus a congenital heart defect branch. Validated: just validate schema/terms/references passing; compliance 98.7 percent, 100 percent weighted.

  summary: Wire calcimimetic treatment to the CaSR modulation module
  details: |
    Added one therapeutic_vulnerability pathophysiology node, 'Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors', conforming to casr_positive_allosteric_modulation#Calcimimetic Occupancy of the Parathyroid Calcium-Sensing Receptor, and linked this entry's existing calcimimetic treatment to it with an ACTIVATES target_mechanisms link.

    The node carries no downstream edge, deliberately and consistently with the other drug-mechanism conformers in the GPCR series: the drug's relation to the mechanism nodes already in this entry is relief or suppression of hormone excess, not causation, so an edge would assert the wrong direction. The node binds GO:0004930 with modifier INCREASED, CL:0000446 chief cell of parathyroid gland, UBERON:0001132 parathyroid gland and hgnc:1514 CASR, mirroring the module trigger; the receptor identity rests on the gene binding because GO has no calcium-sensing receptor activity term.

    Evidence on the node is PMID:29534286, which states that the drug binds the receptor and increases its sensitivity to extracellular calcium, thereby decreasing parathyroid hormone secretion by chief cells. Evidence on the treatment link is PMID:29680147, which establishes the class as positive allosteric modulators of this receptor.

    No existing content was changed: the node was appended to pathophysiology and the link appended to the treatment's existing target_mechanisms list where it had one. Validated with validate-disorders alongside the other four conformers (269 snippets, 291 titles, 0 issues) and with the offline structural gates.

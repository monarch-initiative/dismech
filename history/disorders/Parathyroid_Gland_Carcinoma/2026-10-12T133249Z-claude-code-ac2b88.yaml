  summary: Address PR review round 1 and a newly-added CI gate
  details: |
    Two separate failures on PR 13926. First, test (3.13) failed, which I had reported as passing in the PR body; that was wrong. The failing gate is scripts/check_gene_activity_grounding.py, which requires a gene wired into the pathograph to land on a molecular_functions term. It was added upstream after this branch's base commit, so the three earlier curations in this series passed because the gate did not yet exist; being 113 commits behind origin/main hid it. CDC73 was the named gene. The gate sanctions two routes, binding a term or grandfathering a baseline line with a stated reason, and its own rule is that no term beats a bad one. No reference cited in the entry stated parafibromin's molecular function: the only function-adjacent claim available was that mutant parafibromin destabilises p53 mRNA, which is a gain of function of the mutant rather than a lost wild-type activity, so binding GO:0000993 from background knowledge of the PAF1 complex would have overstated what the node claims. I fetched the canonical source instead, PMID:15923622, which is specifically about parathyroid malignancy and states that parafibromin interacts with PAF1 complex components and associates with RNA polymerase II. GO:0000993 RNA polymerase II complex binding is now bound on the CDC73 node with modifier LOSS_OF_FUNCTION and that evidence, plus the paper's finding that the interaction depends on a C-terminal domain deleted in about 80% of clinically relevant mutations, which is what makes the molecular function the right level to bind. Its RNAi result, that parafibromin knockdown promotes S-phase entry, was added to the proliferation node as the in vitro counterpart of the mouse proliferation measurement. The gate now reports zero findings for this file. Second, the reviewer returned CHANGES_REQUESTED with six important items, all addressed. (1) The renal phenotype was bound to HP:0000787 Nephrolithiasis although no cited reference names stones; rebound to HP:0000077 Abnormality of the kidney with coarse_binding_basis SOURCE_UNSPECIFIED, matching how the skeletal row was already handled. (2) Elevated circulating parathyroid hormone rested on mouse evidence alone, which CLAUDE.md forbids for a human phenotype; human evidence was added from PMID:42577903, already cited in the entry. (3) Intravenous bisphosphonate therapy and denosumab were added as treatments targeting Hypercalcemia, with agent bindings CHEBI:46557 and NCIT:C61313. The reviewer's reasoning is right and worth recording: mortality in this disease follows the hypercalcaemia rather than tumour burden, so these are central treatments, and disclosing an omission in review_notes does not convert it into a scoping decision. (4) The population incidence record now carries quote_role BACKGROUND, because the figure sits in the cited paper's introduction attributed to two further references rather than being that paper's own SEER result, and its population no longer says Worldwide, which the source does not state. (5) The description still read that local recurrence and metastasis are common, which is the same lump removed from the invasion node in the previous round and which the entry's own SEER evidence contradicts for metastasis; reworded. (6) Seven revision-history passages were removed from notes and explanation fields, where CLAUDE.md says they do not belong; they are recorded here instead. I was also wrong about the en dash: an earlier explanation claimed a trimmed snippet was necessary because an en dash does not survive quoting, and CLAUDE.md line 3791 states that a hyphen in a snippet matches an en dash in the source. The full range is now quoted and the claim is gone. Took the pathograph suggestion as well: Renal disease, Skeletal disease and Palpable neck mass had no inbound causal edge, and are now wired from Unrestrained Parathyroid Hormone Secretion and Autonomous Chief Cell Proliferation respectively, with INDIRECT_KNOWN_INTERMEDIATES on the two end-organ links. One knock-on: the notes paragraph listing deliberate omissions went stale the moment the treatments were added, which is the prose rot CLAUDE.md warns about, and was rewritten. Not taken: the remaining suggestions, pembrolizumab for microsatellite-unstable disease, parathyroid crisis with altered mental status, dropping the ULTRA_RARE tier on the case-fraction record, and rebinding the neck mass away from HP:0100733. Validation after the round: 40/40 snippets verified, up from 33; all 40 reference_title values audited against their cache files with zero mismatches; validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, the gene-activity grounding gate and the batched validate-disorders all pass.

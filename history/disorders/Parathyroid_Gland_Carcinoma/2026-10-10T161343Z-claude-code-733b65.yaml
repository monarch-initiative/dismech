  summary: 'Create: Parathyroid Gland Carcinoma'
  details: |
    De novo curation of parathyroid gland carcinoma (MONDO:0012004) at the histologic-entity level per design decisions section 3a. Pre-claim verification found the ID absent from kb/ on origin/main, all 22 MONDO synonyms clear apart from one reference_title mention inside Parathyroid_Hyperplasia.yaml, zero MONDO children, no parent bound as any entry's disease_term, CDC73 uncurated outside hypothesis-run gene-list CSVs, and no prior PR or issue. Deep research: falcon was requested but has no API key here, so the run used --fallback and claude_code produced the report, which records fell_back, requested_provider and provider_attempts. Both validation blocks reported needs_review: true. Because the report was still running, I fetched the core references independently from PubMed first, which is why the entry rests mainly on sources verified before the report arrived. I audited all 18 cached references by title and found TWO confabulated citations, of which the report's validator flagged one: PMID:38198197 (actually a Gensingen bracing trial in adolescent idiopathic scoliosis, the one flagged) and PMID:36949199 (actually a mouse skin squamous cell carcinoma RHOJ/EMT paper with zero parathyroid mentions, cited in the report for a WT1 biomarker claim and given a fabricated title in the report's own citation table). The validator missed the second because generic cancer vocabulary scores on-topic against a cancer report. This is the third consecutive report with real-PMID-wrong-paper confabulations, though at 2 of 18 the rate is better than the five-of-twenty-five seen twice before. Four ontology bindings the report offered were wrong and are not used: NCIT:C65509 was given as Cinacalcet Hydrochloride and is Eletriptan, a migraine agent; NCIT:C65214 was given as Denosumab and is Acotiamide; CHEBI:77862 was given as zoledronic acid and is gossypetin(1-); HP:0100255 was given as Osteitis fibrosa cystica and is Metaphyseal dysplasia. GO:0098532 is obsolete and was not used. Every CURIE in the entry was resolved against OLS at the time of writing, and the verified replacements are CHEBI:48390 cinacalcet, with NCIT:C61313 denosumab and CHEBI:46557 zoledronic acid recorded in review_notes for a later round rather than added without a cited source. A factual error in my own claim issue was caught during curation: I had written that the differential is against atypical adenoma, but the 2022 WHO classification no longer endorses that term and replaces it with atypical parathyroid tumour, a neoplasm of uncertain malignant potential. The entry uses the current term, explains the change, and preserves older wording only inside quoted snippets. The same WHO source notes that parathyroid hyperplasia is now reserved largely for secondary hyperplasia of chronic renal failure, which bears on Parathyroid_Hyperplasia.yaml rather than on this entry and is recorded in notes rather than acted on. Pathophysiology is a causal chain from CDC73 biallelic inactivation through loss of nuclear parafibromin to autonomous chief cell proliferation, branching into unrestrained PTH secretion and into local invasion and metastasis. Cell of origin is derived rather than asserted: the CDC73 node carries genetic_context variant_origin SOMATIC with CL:0000446 bound, and check-cancer-origin reports SOMATIC_LESION OK with a single origin. A REFUTE item is deliberate on the parafibromin node, recording that the authors call both molecular screening and immunohistochemistry limited in sensitivity and specificity, which is why diagnostic weight sits on the WHO invasion criteria instead. The Cdc73 mouse model is linked with fidelity MODERATE and limitations recording that its lesions are atypical adenomas rather than carcinoma, so it captures the proliferative and hormonal arm and not the invasive behaviour that defines the human disease. Hyperparathyroidism-jaw tumour syndrome, the germline CDC73 predisposition, is absent from kb/ and deliberately not folded in. Validation: just validate passes with 17/17 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys all pass.

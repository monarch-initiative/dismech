  summary: 'Pre-PR red-team review round: Parathyroid Gland Carcinoma'
  details: |
    Self-review round before opening the PR, run in a subagent for fresh context per step 7 of the initiate-new-disorder-creation skill. Verdict was REQUEST_CHANGES with nine blocking findings and nine important ones; all are addressed. Snippet count rose from 17/17 to 33/33 verified, and the reference count cited rose from 5 to 13 of the 18 cached. The single underlying finding was under-consumption: the entry rested on one mini-review summary sentence carrying four of its seventeen evidence items while a full-text SEER paper and five disease-specific reviews sat cached and unread. Blocking fixes. (1) The invasion node carried locations bound to lung and liver with lung labelled the commonest distant metastatic site; no reference cited in this entry mentions either organ, and the claim traced to the deep-research report's prose, from the very line its own term validator had flagged. A free-text preferred_term is not read by any gate, which is why it survived. The locations block was removed and the omission recorded. (2) The description's claim that resection is the only treatment with curative intent had no cited snippet; it is now sourced from PMID:41878704, which states it and the absence of effective systemic therapy in one sentence. (3) The calcimimetic treatment had zero evidence, and the stated reason in review_notes was wrong: the report's bad NCIT codes did not block anything because CHEBI:48390 cinacalcet was bound correctly anyway. Two cached sentences now support it, one quantitative. (4) A real population incidence was added from the SEER full text, 3.5 to 5.7 cases per 10,000,000 per year normalized to 0.046 per 100,000, with rate_denominator POPULATION_PER_YEAR and no qualitative tier, since CLAUDE.md forbids pairing one with ANNUAL_INCIDENCE. The existing case-fraction record keeps its tier because it states a fraction rather than a rate. (5) The invasion node asserted that recurrence and metastasis are common, which the SEER source contradicts for metastasis: lymph node under 5% and systemic metastasis under 2% against local recurrence of 25 to 80%. The node bundled two behaviours and was split into Local Invasive Growth and a downstream Distant Metastasis node. The entry had inherited the lump from a review sentence that names both in one phrase. (6) The renal and skeletal consequences the description promised were absent; kidney stone and a coarse skeletal binding were added, the latter with coarse_binding_basis SOURCE_UNSPECIFIED because the source says skeletal disease without specifying a lesion. Osteitis fibrosa cystica remains unbound: the report offered HP:0100255 for it, which is Metaphyseal dysplasia, and no cited source names the lesion. (7) A REFUTE item on the parafibromin node refuted a reading the node already disclaimed; regraded SUPPORT. (8) The claim that parafibromin loss is neither fully sensitive nor specific was a single-cohort cherry-pick. Two cached studies report 100% specificity with loss confined to malignant tumours, against one cohort finding loss in 3 of 17 typical adenomas. The description now states the disagreement and the defensible reading, insensitive but highly specific, and both sides are cited. (9) The entry had zero GO bindings; GO:0008283 and GO:0035898 were added on the proliferation and secretion nodes, matching how the sibling Parathyroid_Hyperplasia entry binds its homologous nodes. Important fixes: a specific treatment term NCIT:C139567 En Bloc Resection replacing generic Surgical Procedure; an invented preferred_term, antineoplastic-adjacent medical control of hypercalcaemia, replaced with calcimimetic therapy; the biallelic character of the CDC73 lesion sourced from PMID:42196524, having been in the node name but not its evidence; the MEN1/PRUNE2/CCND1/EZH2 and PI3K-AKT-mTOR sentence cited rather than left as unsupported description prose; two further modeled_mechanisms links on the mouse model, including a FAILS_TO_RECAPITULATE link against the invasion node evidenced by the SEER paper's statement that Cdc73-deleted mice do not develop parathyroid carcinoma, which converts a prose limitation into the typed negative claim CLAUDE.md calls first-class; progression repurposed from a secular detection trend to real natural history; a histopathology section added; the germline-in-sporadic arm recorded, since germline CDC73 is present in up to 25% of apparently sporadic cases, which is a fact about this disease rather than about the excluded HPT-JT syndrome; severity SEVERE on hypercalcaemia; a palpable neck mass phenotype; classifications; and the notes now disclose what the entry still lacks. The report's defects are now recorded in the entry's notes rather than only in history, including one the review found that I had missed: PMID:539600 is cited in the report for parathyroid carcinoma accounting for 4.3% of radiation-associated hyperparathyroidism, and that paper states the opposite, that parathyroid carcinoma has not been reported in irradiated patients. I had not cited it, but by instinct rather than by checking. The report's own validator also recorded quotes_valid 0 of 2 against PMID:42577903, so quotes attributed to that paper in the report are unreliable; the two sentences taken from it here came from the cache. Process note on my own errors in this round. I typed four reference_title values from memory instead of copying them from the cache, which just validate caught one at a time, so I wrote an audit that diffs every reference_title in the entry against its cache file; it then found four semicolon-for-colon mismatches that just validate had let through. Correcting those broke YAML on unquoted colons, and my quoting regex backtracked and mangled twenty already-quoted lines before I unmangled them; nothing was lost. I also typed HP:0000924's label from memory and got it wrong, and used HP:0000787's current HPO label Kidney stone where the committed cache says Nephrolithiasis, which 41 other entries use; the repo is cache-first so the cached form is correct. Validation after the round: 33/33 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes and the batched validate-disorders all pass; check-cancer-origin reports SOMATIC_LESION OK with a single origin CL:0000446.

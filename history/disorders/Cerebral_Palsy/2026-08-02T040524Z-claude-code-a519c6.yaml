  summary: Address code review of Cerebral Palsy entry
  details: |
    Addressed ai4c-reviewer REQUEST_CHANGES on PR 7462. Prevalence measure_type POINT_PREVALENCE to BIRTH_PREVALENCE on both records plus rate_low/rate_high on the very-preterm record. Dropped four frequency bands whose Novak 2012 statistic quantified a narrower phenotype than the annotated HP term - visual impairment/blind, hearing impairment/deaf, dysarthria/anarthria, hip dislocation/displacement - keeping the broader terms and evidence per omit-frequency guidance. Replaced the misattributed PMID:30564460 snippet with the paper's own combined SNV plus CNV 22.7 percent yield. Added MONDO subtype_term bindings to all four subtypes. Split the bundled Corticospinal Tract Disruption and Upper Motor Neuron Syndrome node into atomic TISSUE and ORGANISM nodes. Added downstream edges to the dangling Perinatal Neuroinflammation node and evidence to previously evidence-less nodes. Added evidence to the perinatal-asphyxia risk factor. Also added Behavioral abnormality and Sleep disturbance phenotypes, a notes block on the Bilirubin Encephalopathy root, and second-prevalence CI fields. Validated schema/terms/references all pass, 44/44 snippets verified.

  summary: Link each perinatal insult to its own lesion node
  details: |
    Backfill for issue #8085. This entry is unusually well suited to the slot because each environmental entry has a bespoke lesion node waiting for it, so all five links are TRIGGERS and each lands somewhere different. Preterm birth and low birth weight targets periventricular white matter injury with INDIRECT_KNOWN_INTERMEDIATES, since prematurity produces that characteristic lesion through the selective vulnerability of pre-myelinating oligodendrocytes at a vascular watershed rather than causing diffuse damage. Perinatal asphyxia targets hypoxic-ischemic encephalopathy as DIRECT, the exposure and the node being the same event described clinically and pathologically. Intrauterine infection targets perinatal neuroinflammation with INDIRECT_KNOWN_INTERMEDIATES, reaching the fetal brain by cytokine response rather than direct invasion. Perinatal stroke targets the non-progressive developing-brain injury node as DIRECT. Neonatal hyperbilirubinaemia targets bilirubin encephalopathy as DIRECT, an exact node match and the one cause in the set that is essentially fully preventable. Not linked: the multiple gestation and intrauterine growth restriction entry, which carries no evidence items. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 49 of 49 verified; integrity issue count unchanged from origin/main. PR review found two defects. Five new evidence items carried an empty reference_title string, which asserts that the reference has a blank title rather than saying nothing; all five are now populated from the cache frontmatter, read directly rather than transcribed. The asphyxia link's snippet was also truncated one clause before the words that carry its claim, quoting only a definition of hypoxic-ischemic encephalopathy; it now extends to state that the injury is caused by a lack of oxygen to the brain during the neonatal period, which is what the TRIGGERS grading asserts. Re-verified: 49 of 49 snippets.

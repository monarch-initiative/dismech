  summary: Re-parent non-endochondral phenotypes; drop unsupported Finnish rate
  details: |
    Acts on findings 7 and 8 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    Finding 7: Cleft Palate, Bifid Uvula, Absent Uvula, Tracheobronchomalacia and Respiratory Insufficiency were parented to 'Impaired Endochondral Ossification'. Palatal shelf fusion and airway hyaline cartilage are not endochondral bone-formation processes, so these derive from the upstream proteoglycan-undersulfation matrix defect; all five were moved there. The respiratory edges gained intermediate_mechanisms and PMID:34064542 evidence naming airway malacia and cervical kyphosis, rather than ossification failure, as the route to respiratory compromise.

    Finding 8: the Finnish incidence of ~1:22,000 appeared twice in notes but no cited source states it; the cited snippet says only that incidence has significantly decreased. Both assertions were removed. The Finland record now carries measure_type BIRTH_PREVALENCE with prevalence_class UNKNOWN and quotes the registry study's actual case count (14 SLC26A2 subjects born 2000-2020, 12 classified as DTD) instead of a rate.

    Validated: schema, reference and term validation all pass.

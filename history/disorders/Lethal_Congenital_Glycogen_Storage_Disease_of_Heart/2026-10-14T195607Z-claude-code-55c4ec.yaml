  summary: 'Strengthen: Lethal_Congenital_Glycogen_Storage_Disease_of_Heart'
  details: |
    Strengthened an entry that rested mainly on the abstract of PMID:15877279. New references fetched: PMID:17667862 (Akman 2007, fatal infantile case with de novo-likely PRKAG2 R384T, autopsy attributing ventricular and atrial hypertrophy to glycogen, apparent skeletal-muscle phosphorylase kinase deficiency, R384T nucleotide-binding loss), PMID:39569283 (2024 case report with full text: trio-confirmed de novo R531Q neonate with fetal hydrops, biventricular hypertrophy, cardiomegaly, pulmonary hypoplasia, bradycardia, short PR interval, death at 77 days, plus a literature table of fetal and infantile PRKAG2 cases in which every R531Q carrier died within months), PMID:39215506 (de novo R384G case named as this disorder, presenting with nonimmune hydrops), PMID:10368461, PMID:3918928 and PMID:8236826 / PMID:6424667 (historical cases under the superseded cardiac phosphorylase kinase attribution, cited INDIRECT for the clinical picture only), and PMID:28801758 (infant PRKAG2 disease mimicking Pompe disease). Changes: variant_origin set to DE_NOVO; R384T and R384G variants added; new phenotypes Biventricular hypertrophy, Cardiomegaly, Pulmonary hypoplasia (as a sequela of cardiomegaly), Congestive heart failure, Nonimmune hydrops fetalis, Pericardial effusion, Bradycardia, Shortened PR interval; progression split into fetal onset and death in early infancy; storage-to-hypertrophy edge now cites direct autopsy evidence from the lethal form instead of only borrowed-allele evidence; hypertrophy node wired to cardiomegaly, biventricular hypertrophy and heart failure; diagnosis (fetal ultrasound, genetic testing) and a heart transplantation treatment entry (historical statement, no transplanted case found) added. Ventricular pre-excitation remains INDIRECT because no lethal-form source reports it per patient. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders plus the offline gate list.

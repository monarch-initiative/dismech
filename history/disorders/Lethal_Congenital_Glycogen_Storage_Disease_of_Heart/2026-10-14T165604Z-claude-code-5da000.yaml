  summary: 'Create: Lethal_Congenital_Glycogen_Storage_Disease_of_Heart'
  details: |
    Created a standalone entry for lethal congenital glycogen storage disease of heart (MONDO:0009867, OMIM 261740), previously represented only as the Lethal Congenital has_subtypes row of PRKAG2_Cardiac_Syndrome. Primary source is the Burwinkel et al. 2005 abstract (PMID:15877279): recurrent heterozygous PRKAG2 p.Arg531Gln in 3 of 5 sporadic patients, no phosphorylase kinase or glycogen phosphorylase mutations, >100-fold loss of AMP/ATP binding with increased basal AMPK activity, massive non-lysosomal cardiac glycogenosis of fetal onset and rapidly fatal course. Pathograph: R531Q variant -> constitutive AMPK activation -> massive cardiomyocyte glycogen accumulation -> storage-driven hypertrophy / pre-excitation; edges supported only by other PRKAG2 alleles (PMID:11827995, PMID:20031621, PMID:12782567) are marked directness INDIRECT. Three phenotypes, all causally connected; no frequencies or treatments asserted because no cached source reports them for this form. Literature was limited to the existing reference cache because PubMed was unreachable. Validated with just validate, validate-terms, count-verified-snippets (19/19), the offline gates, and validate-disorders.

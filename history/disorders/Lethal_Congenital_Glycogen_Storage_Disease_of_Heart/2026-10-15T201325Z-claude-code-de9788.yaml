  summary: 'Recheck against deep research: Lethal_Congenital_Glycogen_Storage_Disease_of_Heart'
  details: |
    Rechecked the entry against research/Lethal_Congenital_Glycogen_Storage_Disease_of_Heart-deep-research-claude_code.md. preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0009867; the report's OMIM number (261740) matches MONDO's, and its content is about this disorder except where noted below. The report was used as a lead only.

    Added (new reference PMID:30430036, Gorla et al. 2018, a prenatally detected R531Q case who died at about 7 weeks; cached as full text): a Pulmonary edema phenotype (HP:0100598) with a causal edge from Storage-Driven Cardiac Hypertrophy via diastolic dysfunction, as the authors state; a second evidence item on Ventricular pre-excitation from the paper's review of the three original R531Q infants (all had pre-excitation on ECG, quote_role REVIEW_SYNTHESIS), with the phenotype description and the notes sentence that said no source reported pre-excitation per patient updated; further R531Q case evidence for the short PR interval, autopsy myocardial glycogen, fetal onset at 28 weeks and death at about 7 weeks; and a Supportive Heart Failure Pharmacotherapy treatment (NCIT:C15986 with NCIT:C29576 beta-adrenergic antagonist and NCIT:C448 diuretic) that did not prevent death. Added the MONDO synonym 'Fatal congenital hypertrophic cardiomyopathy due to glycogenosis', read from OLS.

    Deliberately not added: neonatal hypoglycemia (named only from the OMIM clinical synopsis; no case source found, and the one R531Q case with a diabetic mother does not report it); enzyme replacement therapy and the Austin 2017 case (PMID:27692944: an infant who survived beyond 11 months with hypotonia and seizures, not this fetal-onset lethal form); the K475E variant (infant survivor, already excluded in notes); genetic counseling and prenatal diagnosis for recurrence (no source); PRKAG2 transgenic mouse models (N488I and others model the adult-onset classic syndrome; already used only as INDIRECT mechanism evidence); prevalence, ClinGen validity and ClinVar/gnomAD data (none found for this disease); DOID/OMIM/ICD10CM cross-references (the report's identifiers are unverified and the entry carries no mapping block for them); the report's 'eight infants' figure for Torok 2017 (the cached abstract says three, matching the report's own conclusion).

    Validated with just validate, validate-terms, count-verified-snippets and the offline QC checks, then validate-disorders.

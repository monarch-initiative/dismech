  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding LOINC:79462-8 Iduronate-2-Sulfatase [Enzymatic activity/volume] in DBS plus the second-tier glycosaminoglycan codes LOINC:90233-8 and LOINC:90235-3. No reference range: the Illinois programme states its rule as I2S activity at or below 10 percent of the daily median (PMID:33117908), the Missouri implementation report (PMID:33124617) states no threshold in its abstract, and a PubMed search for an absolute IDS DBS cut-off, written verbatim in the row notes, returned nothing. The GAG second-tier study's dual-marker percentile rule for MPS II (PMID:41970633) is quoted as evidence. Bound the LOINC Part LP14029-0 on the Iduronate-2-sulfatase activity marker, which describes leukocyte, fibroblast and plasma assays. The urinary and CSF glycosaminoglycan markers were left unbound as confirmatory or research measurements outside the newborn-screening scope. Validated with the per-file gates, validate-disorders and the KB-wide snippet-grading gate.

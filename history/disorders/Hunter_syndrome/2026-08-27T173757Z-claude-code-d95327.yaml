  summary: Add severe/attenuated MPS II subtypes
  details: |
    Added a has_subtypes block binding the two MONDO MPS II severity concepts that dismech previously covered only in prose: MONDO:0016315 (severe/neuronopathic) and MONDO:0016316 (attenuated/non-neuronopathic). The entry already described the split in its description and cited it in evidence; what was missing was the structured, ontology-bound representation, so the two MONDO terms showed as uncurated in a coverage audit. Evidence reuses PMID:32707880 (CSF biomarker study, which gives the two-thirds neuronopathic proportion, the neurological feature list, the pre-3-year onset, and the CSF GAG contrast) and the already-cited PMID:25345092. Also corrected the reference_title on all 20 PMID:32707880 citations in this file, which carried an invented title rather than the cached one.

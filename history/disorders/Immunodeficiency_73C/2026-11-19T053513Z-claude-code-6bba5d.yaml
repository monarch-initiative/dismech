  summary: 'Create: Immunodeficiency 73C (recessive RAC2 loss of function)'
  details: |
    Curated from an OpenScientist deep-research run (research/Immunodeficiency_73C-deep-research-openscientist.md). The first run timed out: fourth in the provider's server-side queue, cancelled at the 3600s client limit after spending most of the hour waiting. Relaunched with --timeout 6600 and it completed.

    just preflight-dr returned WARN. Two signals, both checked. MONDO records no causal gene for MONDO:0033555, so the gene-identity check could not discriminate and the manual OMIM/synonym preflight was used instead: the report's four OMIM numbers are 602049 (the RAC2 gene) and 608203/618986/618987 (the three RAC2 disease arms), with 618987 the intended one, and RAC2 is mentioned 150 times. The reported gene-identifier mismatch, 'HGNC:9802 beside C3', is a false positive: C3 is part of RAC2's full name, Ras-related C3 botulinum toxin substrate 2, and hgnc:9802 is RAC2.

    Entry shape completes an allele-class split the KB had already made twice for this gene, so the lump/split call was settled by precedent and the work was the mechanism and evidence. ClinGen's own record states the same decision, that it found differences in molecular mechanism, inheritance pattern and phenotypic variability and split RAC2 into three entities; that sentence is quoted on the genetic row. The IUIS discriminator question the sibling entry raised is resolved here by the inheritance column rather than the MIM number: this is the AR row in IUIS 2022 Table 3 (predominantly antibody deficiencies), which is quoted exactly, against the AD LOF row in Table 5 and the AD GOF row in Table 1.

    relationship_type is RISK_FACTOR rather than CAUSATIVE. The schema reserves CAUSATIVE for a Definitive or Strong validity tier and ClinGen rates this pair Moderate on two probands in two publications. The genetic row's notes say explicitly that the relationship is not in doubt, only its evidence weight, so the value is not read as hedging about the gene.

    MONDO's placement of this term under T-B- severe combined immunodeficiency does not fit the reported patients, who had low but not absent B cells, survived well past infancy and were managed as common variable immunodeficiency for years. That parent is not reproduced in the entry; notes records the disagreement as a candidate MONDO term request rather than silently copying or silently dropping it. The deep-research report independently flagged the same placement.

    Provider-computed content excluded from evidence: the GTEx tissue-specificity index comparing RAC2 with RAC1, the gnomAD carrier frequency with its derived birth-prevalence and consanguinity-multiplier figures, the STRING partner tables, and a count of how many IMD73C features the Rac2-null mouse matches against other inborn-error-of-immunity models. The report's NCIT treatment bindings were largely wrong - its own term validation flagged NCIT:C564, C265, C1322, C15417, C15632 and C15271 as naming unrelated concepts - so every term was re-derived from OLS.

    No frequencies are recorded anywhere in the entry: the whole clinical description is two siblings of one consanguineous family, and the HPO annotation of OMIM:618987 derives from the same two patients, so every denominator would be 2.

    The immune-dysregulation node (glomerulonephritis, coagulopathy, hormone deficiencies) is curated with its weakness stated in the node description: no mechanistic study connects RAC2 loss to renal, coagulation or endocrine pathology, the Rac2-null mouse does not reproduce it, and the original authors' own wording is 'potentially on the autoimmune basis'. Its outgoing edges are INDIRECT_UNKNOWN_INTERMEDIATES and the mouse model carries an INCOMPLETE_PHENOTYPE divergence recording the same gap.

    Two label errors caught by validation: HP:0002850 is 'Decreased circulating total IgM' in the repository's term source although OLS now serves 'Decreased circulating IgM concentration', and the repository's source is what CI checks; and two snippets needed the source's exact wording rather than mine (the ClinGen sentence includes its PMIDs, and the source spells 'nitrobluetetrazolium' without the internal space). The Rac2 MGI binding was read from NCBI Gene rather than written from memory and confirmed with just check-gene-namespaces-online.

    Validation: just validate-disorders passed (36 snippets, 38 titles, 0 issues); just validate-terms passed; check-snippet-grading, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, qualifier-terms, coarse-phenotypes, logical-rules, delivery-system, gene-namespaces-online and shared-disease-terms all clean. just check-genereviews --online reports NO_CHAPTER for the disease and for RAC2. 8 of 8 phenotypes causally connected.

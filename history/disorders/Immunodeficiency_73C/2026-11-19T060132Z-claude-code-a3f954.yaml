  summary: 'Review round 1: CAUSATIVE with the tier as caveat, correct the oxidase
    branch, add the missed sibling features'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #18445. All four IMPORTANT items taken, plus all four suggestions.

    1. relationship_type moved from RISK_FACTOR to CAUSATIVE. The reviewer answered the question the PR asked and was right to: the schema defines RISK_FACTOR for variants neither necessary nor sufficient to cause disease, which is the opposite of a biallelic null in a recessive Mendelian condition, so RISK_FACTOR was not merely imprecise but false. The convention the reviewer cites is already in the KB, including on the sibling Immunodeficiency_73B and on Skeletal_Dysplasia_Mild_With_Joint_Laxity_And_Advanced_Bone_Age, and about 28 other entries with a MODERATE assertion use CAUSATIVE. The genetic row's notes now say the enum overstates the tier, that the Moderate tier is copied from ClinGen below and carries the caveat, and that just check-gene-validity reports this as overstated without gating. That is confirmed: the check reports [overstated] for this entry and exits 0.

    2. The entry contradicted the ClinGen record it quotes. The quoted sentence names two probands in two publications while the description, the genetic notes and the variant description all said p.Trp56Ter was the only reported genotype. All three sentences were corrected. PMID:31130284's abstract carries no RAC2 phenotype detail, so the second proband is recorded as adding a genotype rather than a clinical description, and the denominator-of-two statement is now explicitly about phenotyped patients.

    3. The NADPH oxidase branch was stated more strongly than the patient data allow, and the entry contradicted itself: the diagnosis row recorded the proband's normal NBT while the oxidase node asserted the oxidase cannot assemble. The node now carries the NBT sentence as a REFUTE item, because it is the only oxidative-burst measurement in an IMD73C patient and it was normal, and the mouse superoxide sentence with its 'but it was normal in activated peritoneal exudate neutrophils' clause as MODEL_ORGANISM evidence. The node description, the Neutrophil Effector Failure description and the top-level description were all reworded to say a reduced burst is predicted by the biochemistry and partly seen in the mouse rather than demonstrated in these patients. The upstream edge's quote was extended to oxidase steps (4) and (5) together so the conformational change the description names is inside the quote.

    4. Five features present in both siblings were missing and are now curated: selective IgA deficiency, which is the earliest antibody finding of the two and was the first diagnosis in both; coagulation factor XI deficiency at under 1% activity, with F11 excluded by sequencing so it is not a second segregating condition; urticaria, with the authors' proposed mast-cell mechanism recorded as a possibility; hyperparathyroidism; and growth hormone deficiency. With n = 2 a feature in both patients is the whole phenotype, so leaving them out was the material omission the reviewer called it. Their causal edges are hedged the way glomerulonephritis was.

    Suggestions taken: a sequela edge from Recurrent respiratory infections to Glomerulonephritis records the post-streptococcal route the authors themselves favour, alongside the immune-dysregulation edge, and both descriptions now name PSGN and the ASO titre; the oxidase quote was extended as above; a thyroid hormone replacement treatment row was added for the documented autoimmune hypothyroidism; and PMID:38194689's missense allele 'present only in homozygosity' is recorded in notes as unresolved, because the abstract does not say which disease arm it belongs to, so it is not counted toward this entry either way.

    Two errors of mine inside this round. A heredoc with mismatched quote styles failed to parse, so nothing was written; confirmed the file was untouched before retrying. More seriously, inserting the Glomerulonephritis sequela before the Bronchiectasis entry's evidence block orphaned that block onto the wrong entry and produced a duplicate evidence key. just check-duplicate-keys caught it. Worth recording how it presented: linkml-reference-validator did not error, it silently reported 'Snippets checked: 0' and 'No snippet comparisons were performed' while still printing a failing-file line, which is the ruamel DuplicateKeyError behaviour CLAUDE.md documents. A reader skimming for ERROR lines would have seen none. The sequelae block was rebuilt rather than patched further.

    Validation after the round: just validate-disorders passed (47 snippets, 49 titles, 0 issues); just validate-terms passed; check-snippet-grading, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, qualifier-terms, coarse-phenotypes, logical-rules, delivery-system, gene-namespaces and cache-order all clean. 13 of 13 phenotypes causally connected.

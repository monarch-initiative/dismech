  summary: 'Create: Platelet-type bleeding disorder 18 (MONDO:0014386, RASGRP2/CalDAG-GEFI)'
  details: |
    Curated BDPLT18 as a signalling-arm conformer of primary_hemostatic_plug_failure. Stub deleted.

    This entry is the module's worked example of exactly the distinction the aggregation arm's guidance is written to protect. Aggregation fails severely, yet the entry deliberately does NOT conform to #Failure of Integrin alphaIIbbeta3-Mediated Platelet Aggregation: the integrin is expressed normally, and PMA-induced aggregation is preserved because phorbol ester activates PKC downstream of the missing exchange factor. Conformance is at #Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling instead.

    The Residual PKC- and ADP-Dependent Platelet Activation node is given role: adaptive_escape with an edge into the integrin node, because it is a genuine parallel route that partially offsets the block rather than a separate disease mechanism. It matters twice: it explains why the aggregation defect is severe but not absolute, and it underlies the therapeutic inversion the source draws - a pathway with an intact backup is a safer antithrombotic target. That antithrombotic-target claim is reported as the source's own conclusion; nothing in the entry should be read as evidence that a CalDAG-GEFI inhibitor exists or has been tested.

    The Rac1-dependent spreading/flow-adhesion arm is curated separately from the Rap1-integrin arm because the source attributes it to reduced Rac1 GTP-binding, and because it is the more sensitive readout: non-bleeding heterozygotes with normal aggregation still fail flow adhesion and spreading. Its downstream edge is INDIRECT_KNOWN_INTERMEDIATES, since the heterozygote data show it is not on its own sufficient to cause bleeding.

    The neutrophil nuance is preserved rather than flattened: PMID:24958846 reports no leukocyte alteration, while PMID:28762304 reports normal neutrophil integrin expression with impaired Mn2+-induced fibrinogen binding. The second is cited at PARTIAL because it qualifies rather than supports the first. This dissociation, not the gene's expression pattern, is what separates the disorder from LAD-III.

    No prevalence record: known from a small number of families, no published denominator.


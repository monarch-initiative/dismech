  summary: 'Enrich ECHS1 Deficiency with classifications, inheritance, prevalence, 3-phase progression, GeneReviews PMID:31219693 and PMID:25125611 evidence, Central apnea (HP:0002871) and Feeding difficulties (HP:0011968) phenotypes, N-Acetylcysteine Supplementation (CHEBI:28939), diagnosis, differential_diagnoses, and references.'
  details: '- Added classifications (ENDOCRINOLOGY_METABOLISM, NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE; mitochondrial disease;
    branched_chain_amino_acids).

    - Added top-level inheritance (Autosomal recessive inheritance, HP:0000007), structured prevalence metadata (CASES_IN_LITERATURE,
    RARE), and 3-phase progression (Neonatal, Infancy, Childhood) backed by GeneReviews PMID:31219693 (tagged with GeneReviews) and PMID:31967322.

    - Normalized genetic[0].name to ECHS1 with relationship_type: CAUSATIVE and removed the negative fatty-acid beta-oxidation
    pseudo-node from pathophysiology.

    - Added PMID:31219693 evidence to Bilateral basal ganglia lesions and Optic atrophy (HP:0000648), added Central apnea (HP:0002871, OCCASIONAL), and added Feeding difficulties (HP:0011968, FREQUENT) with a downstream causal edge from Leigh-like basal ganglia neurodegeneration.

    - Added N-Acetylcysteine Supplementation (CHEBI:28939) under treatments, and added diagnosis, differential_diagnoses (3-hydroxyisobutyryl-CoA hydrolase deficiency MONDO:0009603; Leigh syndrome
    MONDO:0009723 scoped to primary OXPHOS defects), and top-level references with primary PMID:25125611 urinary metabolite evidence.

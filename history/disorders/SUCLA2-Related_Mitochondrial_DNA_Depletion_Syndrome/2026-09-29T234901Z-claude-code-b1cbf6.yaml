  summary: Add reverse differential diagnosis to TK2 myopathic MDS
  details: |
    Added a differential_diagnoses record for mitochondrial DNA depletion syndrome, myopathic form (MONDO:0012301, TK2 deficiency), the myopathic member of the same mtDNA depletion family. This is the reverse pointer for the new Mitochondrial_DNA_Depletion_Syndrome_Myopathic_Form entry created in the same PR; nothing else in this entry was changed. The record names what the two share (infantile hypotonia, muscle mtDNA depletion, raised lactate, death from respiratory failure) and what separates them: a deoxyribonucleoside kinase defect against a succinyl-CoA ligase defect, so mtDNA depletion is a precursor shortage in TK2 disease and a downstream consequence here; the absence of methylmalonic aciduria in TK2 disease; limb and respiratory myopathy with cognition spared against dystonia, deafness and basal ganglia change; and the fact that the deoxycytidine/deoxythymidine rationale is direct for TK2 and indirect here, where the pooled phase 2 trial this entry already cites reports no SUCLA2-specific result. Its two evidence items quote PMID:23932787 (TK2 as the rate-limiting pyrimidine salvage enzyme, HUMAN_CLINICAL) and PMID:23230576 (cognitive sparing in TK2 deficiency, HUMAN_CLINICAL, the GeneReviews chapter). Both were fetched with just fetch-reference and quoted from the cache file. MONDO:0012301 was verified with runoak against the local MONDO build. just validate passed on this file with 115 snippets checked and 0 issues.

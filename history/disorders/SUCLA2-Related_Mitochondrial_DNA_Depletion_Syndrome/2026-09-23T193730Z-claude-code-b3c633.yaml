  details: |
    New entry for MONDO:0012791 (MTDPS5), SUCLA2 only; stub stubs/Mitochondrial_DNA_Depletion_Syndrome_Encephalomyopathic_Form_With_Methylmalonic_Aciduria.yaml removed.

    Lump/split: SUCLA2-only Disease entry. The SUCLG1 disorder (MTDPS9, MONDO:0009504, OMIM 245400, ORPHA:17, separate GeneReviews chapter PMID:28358460) is recorded as a differential diagnosis, not a subtype. The MONDO parent MONDO:0016796 is a multi-gene grouping (SUCLA2, SUCLG1, RRM2B, FBXL4 children) and is not this entry. Slug chosen to match the GeneReviews chapter name rather than the long MONDO label.

    Deep research: one run requested from falcon, which failed with HTTP 402 (out of credits); the run fell back to claude_code and the report is committed as research/SUCLA2-Related_Mitochondrial_DNA_Depletion_Syndrome-deep-research-claude_code.md (fell_back: true, requested_provider: falcon). Its reference validation: 32/32 identifiers resolved, 14/19 quotes matched, needs_review true; the five unmatched quotes (PMID:19666145, 21295139, 15877282, 18392745, 24659738) were not reused, and every snippet in the entry was copied from the cached source instead. preflight-dr returned WARN only because SUCLG1 is mentioned at 40% of SUCLA2's rate; the report is about the right disease (causal gene SUCLA2, OMIM 612073 matches MONDO), and SUCLG1 content was used only for the differential. Report errors not carried into the entry: it gives the SUCLA2 gene as HGNC:11450, which is SUCLG2 (SUCLA2 is hgnc:11448, confirmed with runoak sqlite:obo:hgnc); it says ORPHA:1933 covers both SUCLA2 and SUCLG1 disease, but ORPHA:1933 cross-references only MONDO:0012791 / OMIM 612073 and SUCLG1 has ORPHA:17; it binds HP:0003348 (Hyperalaninemia) as the defining biomarker and HP:0002490 (Increased CSF lactate) for basal ganglia signal change, neither used.

    Structured sources: ClinGen CGGV SUCLA2 / mitochondrial disease (Definitive, 2024) and Orphanet ORPHA:1933 caches built with --cache-dir references_cache. GeneReviews chapter PMID:20301762 is the phenotype baseline (abstract only); all features in its Clinical Characteristics abstract are present.

    Evidence gaps: no frequency figures for most phenotypes (only the 69% basal ganglia figure is quantified in an accessible abstract); hearing-loss lesion site unknown (recorded as a KNOWLEDGE_GAP discussion); deoxynucleoside trial data are pooled across genes; Faroese 1 in 1700 figure is recorded with measure_type UNKNOWN because the source does not say per live birth.

    Validation: just validate, count-verified-snippets (113/113), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-reference-titles, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-genereviews --online, validate-disorders.

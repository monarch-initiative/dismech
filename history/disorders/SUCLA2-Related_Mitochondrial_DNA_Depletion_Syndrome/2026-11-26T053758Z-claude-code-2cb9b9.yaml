  summary: 'Gene-family review: SUCLA2'
  details: |
    SUCLA2 modelling re-reviewed: the loss-of-function node binds GO:0004775 succinate-CoA ligase (ADP-forming) activity as DECREASED, correct for the beta subunit of the ADP-forming heterodimer. ClinGen's two SUCLA2 records are against lumped classes (Leigh syndrome, mitochondrial disease) rather than this entry's MONDO:0012791, so no tier is copied; the record's note already says so. The genetic record's inheritance block is now bound to HP:0000007. The TK2 GeneReviews chapter (PMID:23230576) cited in this entry is now tagged in references. The alpha-subunit gene SUCLG1 causes the related MTDPS9 (MONDO:0009504) and is handled separately; it is not added here because this entry is gene-specific.

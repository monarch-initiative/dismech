  summary: 'Create: Microcephaly 26, Primary, Autosomal Dominant'
  details: |
    New standalone entry for MCPH26 (MONDO:0030928), caused by heterozygous, mostly de novo LMNB1 missense variants and in-frame deletions, modeled on the sibling MCPH27 (LMNB2) entry. Kept separate from Autosomal_Recessive_Primary_Microcephaly and from LMNB1-related adult-onset demyelinating leukodystrophy (ADLD, duplication/overexpression), which ClinGen also curates as a distinct disease; ADLD appears only as a contrast note. Sources: the two 2020 founding cohorts (PMID:32910914, abstract only; PMID:33033404, full text, pooled LMNB1/LMNB2 frequencies labeled as pooled), the ClinGen Definitive assertion (recorded in gene_disease_validity), and lamin B1-deficient mouse papers (PMIDs 21976703, 22116031, 31796586, 15232008). The two progenitor/neuron mechanisms are EMERGING hypotheses with a HUMAN_MODEL_MISMATCH discussion. Deep research: research/Microcephaly_26_Primary_Autosomal_Dominant-deep-research-claude_code.md (claude_code provider), used as leads. just preflight-dr was not run (no local MONDO build). Validated with validate, validate-terms, count-verified-snippets, entity-ref, causal-target and duplicate-key checks, and validate-disorders.

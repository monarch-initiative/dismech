  summary: Restore Becker-specific CK edge evidence and sevasemten target link
  details: |
    The 2026-09-28 re-review found that the evidence on the Contraction-Induced Skeletal Muscle Injury -> Elevated Creatine Kinase edge misread GeneReviews (PMID:20301298): the quoted sentence describes isolated hyperCKaemia as a separate mild dystrophinopathy phenotype, not as Becker, and says nothing about injury releasing CK. Replaced it with the two Becker-specific items from the earlier approved revision (daf669ba5): the sevasemten phase 1 trial's serum muscle-injury biomarker result (PMID:40452637) and the French Becker guideline's statement that CK falls with fatty involution (PMID:37422773). The edge description was restored to match. Also restored the sevasemten target_mechanisms INHIBITS link to Contraction-Induced Skeletal Muscle Injury, backed by the phase 1b open-label biomarker result (PMID:42308588). All three references were already cached. just validate-disorders passes with 195 snippets verified.

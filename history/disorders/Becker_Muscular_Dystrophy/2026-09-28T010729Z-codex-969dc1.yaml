  summary: Review Becker muscular dystrophy mechanisms, clinical care and trial evidence using
    cached full texts
  details: |
    Reviewed the entire Becker muscular dystrophy entry against its cached sources and the matching Perplexity research report and citation artifact. The initial history contained CREATE and EDIT events but no REVIEW. An open-PR file/history overlap audit found no competing Becker review. This Mendelian DMD disorder is eligible for the campaign excluding infectious and environmental diseases/poisonings. The branch was rebased onto main 6e995d2408bcd21df3c4f87bb0a3929a303c0f28 before the final content pass. Previous process-oriented KB notes were removed; they are preserved in git history and the original entry rather than retained as disease-facing prose.

    Source consumption: read all seven originally cited caches. Recovered and read the 2025 Italian 943-patient cohort through the publisher's minimal HTML endpoint, including narrative, tables and references. Read the 2026-09-10 GeneReviews chapter narrative and clinical tables through molecular genetics; it is distinct from the older PMID:20301298 abstract. Read the French guideline narrative and relevant references; downloaded its actual PDF and visually inspected the diagnostic algorithm, histology, immunoblot and differential table on PDF pages 7, 8 and 12. The algorithm's simplified reading-frame and normal-immunostaining branches were not promoted to absolute diagnostic rules. Read full primary givinostat, sevasemten phase 1/1b, bmx mouse, Becker rat, and vamorolone mouse studies, including available methods, tables and figure captions. Read ENMC anesthesia general recommendations and the muscular-dystrophy table. Read the full weekly-prednisone pilot and its tables. Read the full tadalafil study, methods, supplemental figure captions and tables, and recovered and read the nitrate study's full narrative, methods, tables and captions from PMC HTML. Unlinked supplements and every bibliography item were not independently consumed.

    Access limitations: refetching PMID:2491009 yielded duplicate abstract text despite a full-text flag, so it was not treated as full text. PMID:25042931 sildenafil remains abstract-supported after publisher PDF access returned 403 and two indexed PDF mirrors returned 404. PMID:22589245 was checked at PubMed and the publisher's minimal endpoint; the latter still exposed only the abstract/paywall. The RyR1 claim is restricted to the abstract's 12-patient biopsy association, without inventing calcium-leak measurements or causal rescue. The 1988 reading-frame and 2021 respiratory studies remain abstract-supported. No references_cache markdown was hand-authored or edited; all new files were generated with just fetch-reference.

    Major corrections: Becker is not defined by an invariant in-frame genotype. The Italian cohort contains out-of-frame and nonsense variants; clinical and residual-protein findings matter. Removed assertions that all Becker proteins retain both termini, that all out-of-frame variants abolish anchoring, and that DGC abundance or actin binding is uniformly decreased. Distinguished observed mean age at loss of ambulation (35.3 years among 111 events) from Kaplan-Meier median (69 years); 111/822 is a cross-sectional event fraction, not lifetime risk. LVEF below 55% in 187/621 is systolic impairment, not an unqualified count of dilated cardiomyopathy. FVC below 50% in 12/441 occurred in nonambulant patients. Deleted the inference that most die ambulant obtained by comparing age summaries from different populations. Retained the male-birth denominator for prevalence. Preserved uncertainty around BMD corticosteroid efficacy rather than importing Duchenne benefits.

    Mechanisms: retained DMD variant to partly functional dystrophin and skeletal/cardiac injury branches, while making unresolved mediation explicit. Added rat intercalated-disc findings (TMEM65 and connexin-43 localization) without claiming that reduced transcript proves reduced TMEM65 protein or that an unperformed rescue establishes mediation. Added human nNOS localization and exercise vasomodulation evidence: absent membrane nNOS is not universal, and retained staining is not a perfect predictor of normal physiology. Acute pharmacological vascular rescue does not establish clinical disease modification. Added del45-55-associated RyR1 hypernitrosylation/calstabin dissociation as a source-scoped candidate molecular mechanism. The final pathograph has ten nodes and six supported links to clinical phenotype nodes; other symptoms remain unconnected when the consumed sources do not resolve a faithful mechanism. No edge was added solely to increase connectivity. The original cardiac module association is retained, but the Becker-specific injury-to-cardiomyopathy edge no longer claims unverified known intermediates.

    Clinical content: 22 phenotype entries cover motor, cardiac, respiratory, neurodevelopmental, gastrointestinal and urinary findings. Cohort neurobehavioral counts retain missing-data limitations and do not become general prevalence bands. Added three histopathology findings with non-pathognomonic status and four differential diagnoses. The French PDF table supplies FSHD1 asymmetry/facial/scapular features, SMA neurogenic features and inflammatory-myopathy contrasts; GeneReviews supports the autosomal limb-girdle differential. Added genetic testing and VUS interpretation, biopsy/protein testing including possible normal immunostaining, and unresolved-case RNA analysis with the clinical-versus-research availability distinction. Expanded counseling, maternal and paternal transmission, family evaluation and female pregnancy planning. Added rehabilitation, orthoses and assistive equipment, selective surgery, neuropsychological care, cardiac and respiratory surveillance, NIV/cough assistance, swallowing/nutrition/gastrostomy, gastrointestinal and urological care, bone/pain prevention and vaccination. The 2026 GeneReviews and 2023 French surveillance schedules are separately attributed; Duchenne-derived schedules are identified. ACE prophylaxis in normal Becker cardiac findings is not universal. Anesthesia-induced rhabdomyolysis/hyperkalemia is distinguished from malignant hyperthermia using the ENMC consensus.

    Treatments and trials: 27 treatment/care entries and nine registry records. Givinostat failed its primary total-fibrosis endpoint; a secondary MRI signal is not a positive primary trial or proof of functional benefit. The sevasemten phase 1b observations are small, uncontrolled and primarily safety-oriented. The phase 1 registry's overall enrollment is not silently equated with the published analyzed population. The current CANYON/GRAND record is completed; absence of posted registry results does not imply absence of results elsewhere. Vamorolone registry results are presented descriptively with actual outcome denominators, without invented significance testing. Weekly prednisone enrolled only one Becker participant among 20, so pooled LGMD/BMD changes cannot establish Becker benefit. Tadalafil/nitrate physiological rescue is separated from sildenafil's negative four-week functional trial. Registry snapshots are dated; the tadalafil registry's estimated population/parallel design field is distinguished from the published ten-patient crossover. Raw API outcome quotes include outcome identity and individual group values with ellipses to avoid bracket-normalization loss. The calf, cramps and contracture quotations were expanded to retain disease context.

    Content-completeness checklist against research: (1) Phenotypes adequate for major supported systems; broad DMD-derived cognitive-frequency claims were not imported, and retrospective learning/seizure ascertainment was not made a universal phenotype frequency. (2) Subtypes adequate: variable severity and female manifestations are represented; no independently mapped Becker subtype was established in consumed sources. (3) Pathophysiology adequate for supported central mechanisms, with human nitrosative and rat intercalated-disc observations and explicit translational gaps; generic oxidative-stress, inflammatory and modifier hypotheses from DMD were not assigned Becker causal certainty. (4) Treatments/trials adequate, extending the report's vague trial references with primary publications and nine current registry records; DMD-approved exon-skipping/gene therapies and speculative idebenone benefit were not described as established Becker treatments. (5) Genetics adequate: DMD variation, reading-frame exceptions, genotype-associated trajectories, variable female expression and transmission are covered; SPP1/LTBP4 modifier claims remain a nonblocking DMD-extrapolation gap rather than verified Becker associations. (6) Biomarkers/diagnostics adequate: CK, transaminase pitfall, molecular/protein/RNA testing and cardiac/respiratory evaluation are represented. (7) References substantially consumed: primary trials, models and full guideline/cohort sources replace reliance on short abstracts. (8) Overall consumption adequate: all major report themes were assessed and unsupported ontology IDs, square-root carrier-frequency reasoning and exaggerated steroid/prognosis statements rejected. No disease-specific dataset accession was identified in the consumed source text; no retired dataset_accessions.json was read or recreated.

    Ontology checks: new HPO, MONDO, GO, NCIT and ChEBI candidates were searched in OLS and their records/definitions inspected, then validated through the repository's live term validator. Sodium nitrate NCIT:C84161 failed the chemical-entity range; replaced it with the verified ChEBI sodium nitrate term rather than bypassing validation. The vasomodulation branch uses intracellular NO-cGMP signaling rather than a GO organ-level vasoconstriction annotation. Histologic regeneration and broad inflammatory myopathies remain unbound where the search returned misleadingly specific alternatives. All generated cache changes are limited to required terms.

    Validation: final formatted entry passed schema, live ontology and reference checks, with 191 snippets and 230 titles, none skipped or unavailable. YAML formatting preserved parsed content. Scoped causal-target, entity-reference, coarse-phenotype, source-defect, qualifier, duplicate-key, snippet-boundary and knowledge-gap checks passed; GeneReviews is tagged. Broader snippet/title/grading/cache checks and commit hooks are recorded in the PR after their terminal results. External independent review and current-head CI remain separate publication gates.

  summary: 'Edit: Becker Muscular Dystrophy - review round 1 corrections'
  details: |
    Review round 1 on PR #9333. Two blocking findings, both correct. First, the GeneReviews chapter PMID:20301298 Dystrophinopathies was neither tagged nor mined although it was already cached and already cited by the sibling Duchenne entry; it is now registered with a GeneReviews tag and mined into phenotypes, treatments and diagnosis. Second, and more seriously, the empty treatments section was justified by a grep claim that is false. The CREATE record for this entry states that grepping all six cached references for ACE inhibitors, beta-blockers, corticosteroids, ventilation, transplantation and dosing returned nothing at all. It returns 34 hits in PMID:37422773 alone, a reference the entry already cited, cached as full text with an entire Heart treatment section. The cause was a methodological error in the grep itself rather than in the choice of search terms: the pattern required fifty characters of context on either side of the term, grep is line-oriented, and the cached text is a line-wrapped PDF extraction, so any term sitting near a line boundary could never satisfy the context requirement and was silently converted into a non-hit. The empty result was then read as evidence of absence. The corrected procedure is a bare term grep first, adding context only on the lines that matched. The CREATE record is left untouched as an append-only description of the session as it ran; this record carries the correction. Content added: five treatments including the Becker-specific negative indication that prophylactic ACE inhibition is NOT given regardless of cardiac phenotype as it is in Duchenne, because no trial has tested it at normal LVEF, with treatment instead triggered by LVEF below 50 percent or myocardial fibrosis on MRI; cardiac transplantation with its selection boundary; corticosteroids carrying the source's own efficacy hedge; cardiac surveillance including carrier females; and anaesthetic avoidance for malignant hyperthermia susceptibility. The GeneReviews chapter also corrected the entry's prognostic shape: the first version emphasised a median age at loss of ambulation of sixty-nine and never said what patients die of, when heart failure from dilated cardiomyopathy is the most common cause of death in Becker muscular dystrophy with a mean age of death in the mid-forties, so most patients are still walking when the heart fails. Two phenotypes were added, the very-late-onset ambulant end of the spectrum and dilated cardiomyopathy in heterozygous females, and two evidence items that established only that a paper discussed a topic were replaced with direct statements. Validation: 'just validate' passes with 42 of 42 snippets verified against cached references, up from 29; 'just validate-terms' passes; treatment-mechanism and conforms_to foreign-key tests pass; the ungated CI gates are clean.

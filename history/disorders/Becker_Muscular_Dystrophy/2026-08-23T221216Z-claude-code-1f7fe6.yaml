  summary: 'Create: Becker Muscular Dystrophy MONDO:0010311'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report. 'just preflight-dr' returned SKIP for MONDO:0010311 because MONDO records no RO:0004003 causal gene for the term, so the manual NEC preflight was run instead: the report's OMIM ids are 300376 (the MONDO xref for Becker) and 310200 (Duchenne, expected in a Becker report), DMD dominates gene mentions at 109, the ACE hits are angiotensin-converting-enzyme inhibitors rather than a gene, and the eponym trap for this disease - Becker myotonia congenita, an unrelated CLCN1 chloride channelopathy - returns zero mentions of CLCN1, myotonia congenita or Thomsen disease. Three of the six references came from the report's citations file; the other three were found by PubMed query, and every abstract was read before use. The entry is organised around the reading-frame rule as the Becker/Duchenne discriminator, with a central_effector node for the internally deleted semifunctional dystrophin. Two interpretation discussions carry the judgements: Becker is the target state that exon-skipping therapy in Duchenne aims to produce, which is why this entry deliberately does NOT conform to antisense_oligonucleotide_therapy - those nodes are intervention-conditioned and conforming would put an ASO in the causal path of an untreated disease; and the reading-frame rule is statistical not absolute, with three independent figures agreeing at roughly 91-92% and 10 percent of a 943-patient Becker cohort carrying out-of-frame mutations. Conformance to cardiomyopathy_maladaptive_remodeling is claimed at the insult and outcome nodes only, since no reference evidences the intervening remodelling steps in Becker specifically. No treatments curated: all six references grepped for ACE inhibitors, beta-blockers, corticosteroids, ventilation, transplantation, exon skipping and dosing, returning nothing - the cardioprotective regimen exists only in the report's uncited synthesis. Two defects were caught by validation and fixed before commit: HP:0033401 was written for 'Reduced forced vital capacity' but is actually 'Tissue ischemia' (corrected to HP:0032341), and GO:0016010 was placed under biological_processes when it is a cellular component (moved to cellular_components). Validation: 'just validate' passed with 29 of 29 snippets verified, 'just validate-terms' passed, and the ungated CI gates are clean.

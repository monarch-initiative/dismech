  summary: 'Address review on Cataract_48: unbundle trigger node, drop unsupported
    claims'
  details: |
    Responded to the 2026-10-24 review of PR 15542. Removed the NEUROLOGIC Harrison's classification, which does not cover a non-syndromic lens disorder. Kept the DNMBP Loss of Function trigger node molecular (gene and decreased GEF activity) by removing the junction, actin, tight-junction, lens epithelial cell and lens location annotations that duplicated the downstream junction node and implied untested lens-epithelial action. Removed the unsupported OCCASIONAL frequency from Lamellar cataract and recorded that morphology is reported for one of the confirmed biallelic patients; dropped a cohort-inclusion snippet that said nothing about lamellar morphology. Reworded genetic features to drop 'often lamellar' and 'congenital'. Trimmed the ophthalmologic examination description to what its source states and changed the exome sequencing result to 'biallelic'. Corrected the earlier history record of this PR, which described pathophysiology for other cataract genes that was never added.

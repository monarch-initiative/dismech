  summary: 'Create: Cataract_48'
  details: |
    New entry for DNMBP-related autosomal recessive infantile cataract (MONDO:0032735). Sources: the gene-discovery report in three Pakistani families (PMID:30290152), a Turkish exome cohort with a homozygous p.Arg640* family and a compound heterozygous VUS family (PMID:37592116), and two Tuba cell-biology papers for the Cdc42 exchange-factor activity and its role in epithelial junction shape (PMID:14506234, PMID:17015620). The junction-to-lens-opacity edge is marked INDIRECT_UNKNOWN_INTERMEDIATES because no vertebrate lens model exists; the Drosophila sif knockdown is recorded as a low-fidelity animal model with a SPECIES_MISMATCH divergence. Lens opacity node conforms to the cataract_lens_opacification module. 19/19 snippets verified; validate-disorders, validate-terms, entity-ref and causal-target checks pass. No GeneReviews chapter exists.

  summary: Rung-3 lump/split review (#10115, design decisions §3e)
  details: |
    Rung-3 lump/split review of the four animal hookworm species against the six differentiating axes of design decisions section 3e (R7-R9). Outcome: a deliberate lump, recorded in entry-level review_notes beginning with the 'Deliberately lumped.' sentinel, so the checker reports LUMP_RECORDED rather than TAXON_LUMP. Ancylostoma braziliense, A. caninum, A. ceylanicum and Uncinaria stenocephala are all named in the literature as causes, but nothing found reports that the creeping eruption differs by species on presentation, diagnosis, albendazole or ivermectin response, prognosis, transmission or geography. Five PubMed queries are recorded verbatim in review_notes with their result counts (5, 0, 22, 4 and 6 records). Two near misses are recorded so they are not re-litigated: PMID:20189454 states that A. braziliense is most often implicated in dermatological lesions while A. caninum is associated with eosinophilic enteritis and possibly diffuse unilateral subacute neuroretinitis - a difference in which disease each species causes, not in how this one presents, and relative frequency among cutaneous cases is not one of the six axes; and PMID:34748782 reports A. ceylanicum as the second commonest human hookworm in the Asia Pacific, which concerns patent intestinal infection rather than cutaneous larva migrans. Both were newly fetched, are committed to references_cache, and are named in review_notes as leads without being cited as evidence, since neither supports a claim this entry makes. No subtypes were added and no other section was changed. Validated: just validate (50/50 snippets), just check-granularity (LUMP_RECORDED).

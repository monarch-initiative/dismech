  summary: 'Create: MRD65 (KDM4B)'
  details: |
    New entry for autosomal dominant intellectual developmental disorder 65 (MRD65, MONDO:0023657, KDM4B), a chromatinopathy. Deep research with claude_code (6/6 report quotes valid, preflight-dr PASS). Chain: KDM4B loss of function -> excess repressive H3K9 methylation -> dysregulated neurodevelopmental transcription -> brain structural and synaptic defects -> clinical features; the chromatin and transcription steps are inferred for patients and the brain/synaptic steps come from the Kdm4b+/- mouse (PMID:33232677) and the neuron-specific knockout (PMID:27023172), both modelled. Evidence from Duncan 2020 (founding cohort + heterozygous mouse), the fetal case (38270710), the biallelic case (37526414) and the neuron-KO mouse, plus the ClinGen CGGV record (Strong). All HP/GO/CL terms re-resolved against cache or OLS. Dysmorphic features bound to HP:0001999 with coarse_binding_basis VARIABLE_SPECTRUM because the cohort reported dysmorphism in all but no consistent single feature. Distinguished from the recessive KDM5B disorder in notes. 5/10 phenotypes connected. No GeneReviews chapter. Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-snippet-grading, check-gene-validity, check-gene-namespaces and validate-disorders.

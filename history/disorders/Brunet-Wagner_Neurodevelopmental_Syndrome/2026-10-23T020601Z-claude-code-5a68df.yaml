  summary: 'Create: Brunet-Wagner_Neurodevelopmental_Syndrome'
  details: |
    New entry for RBL2-related autosomal recessive neurodevelopmental disorder (MONDO:0859217, OMIM:619690). Phenotype frequencies are taken from the full text of the 35-patient series (PMID:39692517); founding sibling report PMID:32105419 and three-patient report PMID:33980986 corroborate. Pathograph: biallelic RBL2 LoF (transcription corepressor activity) to loss of p130-DREAM repression (hypothetical, PMID:17531812), impaired neurogenesis and neural survival (p130-null mouse PMID:9806916, fly Rbf), progressive neurodegeneration (imaging), and post-mitotic neuronal RBL2 requirement (fly rescue). DNA methylation and telomere mechanisms were excluded in patient fibroblasts and are recorded in notes, not as nodes. All ontology terms looked up in caches or OLS; validate, validate-terms, count-verified-snippets (58/58) and structural checks passed. preflight-dr could not be run (no local MONDO build).

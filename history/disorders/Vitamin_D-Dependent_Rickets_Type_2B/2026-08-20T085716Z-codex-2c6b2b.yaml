  summary: Deep review separated VDDR2B evidence strata and calibrated the shared VDDR grouping.
  details: |
    Scope and outcome
    -----------------
    Deep-reviewed kb/disorders/Vitamin_D-Dependent_Rickets_Type_2B.yaml and the
    directly related kb/groupings/Vitamin_D-Dependent_Rickets.yaml. The disorder
    now treats MONDO:0010931 as an unresolved umbrella over unlinked historical
    evidence strata: the more-than-200-child Cauca cluster, the single alopecic
    index lineage later studied for HNRNPC C1/C2/VDRE competition, and other
    receptor-positive cases. HNRNPC is an index-case molecular actor, not a
    demonstrated disease-causal gene; genetic and inheritance fields remain
    empty. Historical "HVDRR type III" is explicitly distinguished from modern
    CYP3A4-related VDDR3. No unsupported phenotype frequencies were introduced.

    The review added calibrated pathophysiology, phenotype, biochemical,
    diagnosis, treatment, differential-diagnosis, experimental-model, discussion,
    and bibliography content. The n=1 combined calcitriol-plus-calcium regimen is
    scoped to correction of rachitic bone disease without assigning component
    sufficiency. GSE22523 is recorded as the single-index-patient EBV-B-cell
    microarray resource. Animal models, imaging findings, and clinical trials are
    explicitly empty because no disease-specific evidence was verified. The
    shared VDDR grouping was corrected for entity, biochemical, mechanism, and
    treatment heterogeneity. A stale reciprocal statement in the Type 2A disorder
    entry was documented for its separate next campaign review and was not edited
    in this scope.

    Eligibility and collision preflight
    ------------------------------------
    Work began from exact live-main commit
    d3be8c9b89c3d859674179716e380788e3be0196 after confirming no effective prior
    REVIEW event for the target and no target/history/branch/worktree collision.
    The initial stable exhaustive scan covered 165 open PRs, 13,898 declared
    changed files, and 9,170 paginated REST file records, checking both filename
    and previous_filename. The capped PR #7922 was checked with an exact
    base...head diff of 7,728 paths. Targeted add-on scans were repeated before
    fetching newly identified sources: the PMID:6313754 scan covered 169 open PRs,
    14,000 declared files, and 9,272 REST records; the final PMID:38365463 scan
    covered 171 open PRs, 14,043 declared files, and 9,315 REST records, again
    resolving PR #7922 by its exact 7,728-path diff. All scans found zero relevant
    path collisions.

    On the case-insensitive APFS worktree, three unrelated upper/lower-case DOI
    cache pairs appeared dirty. All six paired paths were verified to have
    distinct index/live-main/HEAD blobs, then protected with the local
    skip-worktree guard. None entered this review scope or diff.

    Cache provenance and evidence limitations
    -----------------------------------------
    New reference caches for PMID:12716975, PMID:21123297, PMID:25506471,
    PMID:27672039, PMID:32596195, PMID:37541189, PMID:38365463, PMID:6313754,
    PMID:7586652, and PMID:8287584 were generated only with `just
    fetch-reference`; no reference cache was hand-edited. Dataset accession and
    HGNC term cache updates were generated by the repository verification and
    term-validation workflows. The sanctioned PMID:12716975 and PMID:38365463
    caches are abstract-only. Full-text-only clinical details from PMID:12716975
    and current-review context from PMID:38365463 are therefore labeled as such
    and carry no invented cache quotation. The relevant PMID:36779427 nosology
    table is omitted from its cache, so its HNRNPC-related/"AD?" classification
    tension is recorded only as transparent non-snippet context and is not
    propagated into causal genetics or inheritance.

    Validation and independent audit
    --------------------------------
    Target and grouping YAML parsing, LinkML schema, ontology terms, references,
    and duplicate-key checks passed. All 54 target evidence snippets matched
    sanctioned caches exactly. All structured mechanism, treatment, model,
    discussion, and readout targets resolved. Phenotype connectivity is 3/5
    causal (rickets, hypocalcemia, lower-limb abnormality); elevated total
    alkaline phosphatase is an observational CORRELATES_WITH diagnostic readout,
    and alopecia is explicitly left unresolved because no causal link was tested.
    Strict grouping checks passed for all 5/5 members. Official GSE22523 dataset
    verification passed 1/1. Reference-cache frontmatter, empty/short/title
    snippet checks, and git diff --check passed.

    Before this REVIEW record was created, an independent immutable content audit
    matched and approved all 14 content blobs at manifest SHA-256
    875f6deb48120628cfbbb40157e33a725eb2a7f2e7ffdeebc3102194cf733c1e,
    including disorder SHA-256

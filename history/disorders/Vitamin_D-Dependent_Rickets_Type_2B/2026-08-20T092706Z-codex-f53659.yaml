    The repository-configured repair was run exactly as
    `uv run pre-commit run trailing-whitespace --files
    references_cache/PMID_25506471.md`. The first run removed the single trailing
    ASCII space and the immediate second run passed. Byte counts changed from
    26,474 to 26,473; the cache SHA-256 changed from
    83748c5178b64cf25bcc57b291b3970141914792a9afdeb6237b0642a663c50e to
    6af937c02364b60a5f8caee84e8214302b8bdf46ef56ce2faea7530ac566cb29.
    The exact diff is one source line replaced by the same line without its
    terminal space. No cache content was hand-edited or regenerated.

    This record therefore supersedes only the preceding REVIEW's unqualified
    diff-check wording: the approved semantic review remains unchanged, while
    the normalized publication range is required to pass full-range
    `git diff --check` before publication. Pull-request links remain empty

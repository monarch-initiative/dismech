  summary: Reframe the metabolic stress entry as infection exposure and cite it
  details: |
    Renamed the environmental entry from 'Metabolic Stress Susceptibility' to 'Intercurrent systemic infection'. The previous name stated a host susceptibility plus a recommendation, and bundled three stressors of unequal evidential standing. Infection is documented for FDXR specifically and is now cited (PMID:42484718 for infection precipitating severe symptoms with characteristic imaging, PMID:38885337 for worsening or demise following infection-associated stress). Prolonged fasting and extreme physical exertion are general primary-mitochondrial-disease precautions not documented for this gene; they were removed from the description rather than carried as an unsourced claim, and the notes say so. Part of #8296.

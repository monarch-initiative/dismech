  details: |
    Backfilled reference_title on all 26 inlined evidence items across three PMIDs 33105716, 31965886, 36055263. Re-verified every existing snippet as an exact whitespace-normalized substring of the cached full text and confirmed each supports its stated claim. Mined the full text of PMID 33105716 and PMID 31965886 and added new verified evidence: Aguadilla as the most common FGG variant worldwide plus its molecular lesion p.Arg401Trp, in-silico dimerization-interface clustering of storage mutations, diagnostic PAS-diastase-resistant fibrinogen-positive alpha-1-antitrypsin-negative inclusion staining, HepG2 in-vitro and yeast model-organism autophagic clearance of mutant fibrinogen, the liver as the target organ rather than hemostasis, fibrinogen and APOB co-accumulation in shared ER inclusions, and an independent case count of 27 individuals from 17 families. Added a structured autosomal dominant inheritance block bound to HP:0000006 with INCOMPLETE penetrance and VARIABLE expressivity supported by unaffected same-mutation carriers. Added top-level reference findings capturing the serpin-like beta-strand pull-out polymerization hypothesis and external aggregation triggers. No support downgrades or retractions were needed. Schema, term, and reference validation all pass.

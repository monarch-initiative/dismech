  summary: 'Create: Primary Central Nervous System Lymphoma'
  details: |
    Created kb/disorders/Primary_Central_Nervous_System_Lymphoma.yaml for MONDO:0002571.

    Target selection, and a MONDO defect found on the way. The stub queue offered MONDO:0016101 'neurolymphomatosis' as a candidate. It is not curatable and should not be attempted as written: MONDO's label is the human entity, but its definition is 'A transmissible viral disease of birds caused by avian herpesvirus 2', its related synonyms are Marek disease and fowl paralysis, and its asserted parent is viral infectious disease. The xrefs carry both MESH:D000077162 (Neurolymphomatosis, human) and MESH:D008380 (Marek Disease, avian), plus Orphanet:206586 (Neurolymphomatosis, human). Two distinct diseases in different species are merged under one term. Curating it from human literature would have produced an entry describing a different disease from the one the identifier names. Reported to the user; no stub change made in this session.

    Entity and binding. Curated at the WHO entity level as primary CNS lymphoma rather than at the anatomical level of the stub that prompted it (stubs/Cerebral_Lymphoma.yaml, MONDO:0003655). OAK confirms MONDO:0003655 is a direct rdfs:subClassOf MONDO:0002571, so the narrower term is recorded in mappings.mondo_mappings as skos:narrowMatch, which is one of the two predicates that count as curated coverage and therefore retires the stub properly rather than orphaning it.

    Deep research: claude_code, as requested by the user. Reference validation came back strong - 32 of 32 citations resolved, confabulation_rate 0.0, 27 of 32 assessed on topic, no unresolved identifiers. Term validation came back weak, and the split between the two is the main lesson of this entry.

    The report offered at least seven wrong ontology bindings. Its own term-validation section caught three: NCIT:C9218 offered as 'Primary Central Nervous System Lymphoma' is Stage IV Oropharyngeal Carcinoma AJCC v6; UBERON:0004087 offered as 'vitreous body' is vena cava; NCIT:C36044 offered as 'Diffuse Large B-Cell Lymphoma' is Grade 3b Malignant Neoplasm and is also obsolete. Four more were found only by checking each identifier by hand against cache/*/terms.csv or OLS, because the validator label-checked 31 of 75 terms and skips gene CURIEs entirely: hgnc:16412 offered as CARD11 is NLRC4 (CARD11 is hgnc:16393, confirmed against the HGNC REST API); HP:0000618 offered as 'Blurred vision' is Blindness (correct term HP:0000622); HP:0002153 offered as 'Papilledema' is Hyperkalemia (correct term HP:0001085); HP:0034332 offered as 'Focal neurologic deficit' is Cognitive regression. None of the seven was bound.

    One further case is worth recording because the tooling pointed at the wrong answer rather than merely failing to point at the right one. The report gave CHEBI:9560 for thiotepa. The run's obsolescence check reported that identifier as replaced by CHEBI:102166, which resolves to thiopental - an anaesthetic barbiturate, not the alkylating agent. Following the automated replacement would have bound a different drug. Thiotepa is CHEBI:9570, taken from a direct CHEBI search. All ten gene CURIEs the report supplied were checked individually against HGNC; nine were right.

    Named Entity Confusion preflight (just preflight-dr) returns SKIP for this entry because MONDO records no causal gene for a somatic cancer, so the gene-identity discriminator cannot run. Fell back to the manual check as the tool instructs: the report's gene census is MYD88=32, CD79B=15, CDKN2A=10, which is the PCNSL signature with no rival disease gene present.

    Content: 11-node causal chain from the somatic MYD88/CD79B lesion through ligand-independent BCR and TLR signalling, constitutive NF-kB, and a separately-modelled late immune-escape arm (HLA loss, B2M, 9p24.1 PD-L1/PD-L2) to perivascular CNS infiltration, with a parallel EBV branch for the immunodeficiency-associated form. 9 phenotypes, 5 genes, 4 treatments, 2 differential diagnoses, 1 clinical trial (NCT01011920, IELSG32), and a KNOWLEDGE_GAP discussion on the unresolved question of whether transformation happens inside or outside the CNS.

    Cell of origin derives cleanly as SOMATIC_LESION / OK / CL:0000787. An earlier draft bound both CL:0000236 (B cell) and CL:0000787 (memory B cell) on the origin node, which made just check-cancer-origin report MULTI_ORIGIN_CELL. That would have been an artefact of granularity rather than the genuine lump/split signal the report exists to surface, so a single term is bound and the reason is recorded in the node description.

    No GeneReviews baseline: searched and confirmed absent, which is expected for a somatic cancer. No datasets block; recorded in notes as an ordinary gap rather than a reasoned exclusion.

    Validation: just validate and just validate-disorders pass with 44/44 snippets verified. check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms pass on the file.

  summary: 'Address review findings: Primary CNS Lymphoma'
  details: |
    Addressed all four blocking findings and three of five suggestions from the review of PR #11513, in a single push. Each finding was verified against the primary source before being acted on; all four were correct.

    Finding 1, the EBV branch asserted a mechanism with no supporting evidence. The 'Loss of EBV-Specific T-Cell Surveillance' node claimed that failure of EBV-specific T-cell control permits outgrowth of an EBV-transformed clone, and cited a PMID:37322012 sentence about distinguishing PCNSL from secondary CNS lymphoma - a nosology statement that says nothing about EBV, immunosuppression or T cells. The explanation was candid that it supported only category separation, but the node still made an unsupported causal claim. Confirmed the reviewer's observation independently: grep over the 42 references this PR adds returns no mention of EBV or Epstein-Barr in any of them. Fetched PMID:36960939, a 309-patient multicentre cohort of EBV-positive CNS lymphoma in older patients, and cited two sentences from it giving the EBV-positive fraction, the transplant-associated majority within it, and the correlation with immunosuppressive treatment. Added the PMID:37322012 immunosuppression sentence the reviewer identified as a third item.

    Finding 2, the commonest presentation was missing. Focal neurological deficit is the leading presentation and was absent from the phenotype list. The reason it was dropped is recorded in the entry notes: the deep-research report offered HP:0034332 for it, which is Cognitive regression. Catching that was right and dropping the phenotype instead of finding the correct term was not. Added Hemiparesis (HP:0001269) and Aphasia (HP:0002381), both labels verified against ols:hp, as the two common forms of the focal presentation, with downstream edges from the mass-effect node and the PMID:37322012 sentence naming focal deficit as the most common presentation. No frequency values were added: the frequency table the reviewer pointed at lives in the deep-research artifact rather than in a citable cached source, and a frequency without a quotable source is exactly what the earlier ZAP70 review flagged.

    Finding 3, the immune-escape genes were named in prose and absent from the structured section. The entry calls this arm the genetically distinctive feature of the disease and names HLA at 6p21, B2M and CD274/PDCD1LG2 at 9p24.1 in three places, while genetic: carried only MYD88, CD79B, CDKN2A and PIM1. Added records for B2M (hgnc:914), CD274 (hgnc:17635) and CARD11 (hgnc:16393), all CAUSATIVE/SOMATIC like the existing four, and cited PMID:31471540 for the 9p24.1 lesion and PMID:28619981 for the CARD11 ibrutinib-resistance mutation. HLA is deliberately not given a gene record: it is a locus spanning several genes rather than one gene, and the entry's existing prose and the PMID:36971477 snippet already carry the claim.

    Finding 4, 32 of 42 fetched caches were uncited. Now 15 of 42 are cited, and the notes carry a paragraph recording what was set aside and why, in three groups: references about systemic DLBCL, Hodgkin or primary mediastinal lymphoma retrieved as comparators rather than as evidence about this disease; treatment options the entry does not yet model (lenalidomide, checkpoint inhibitors, CAR-T, blood-brain-barrier strategies), which belong here but need a relapsed/refractory arm built properly rather than bolted on; and imaging/radiomics studies not needed because the differential entry makes the weaker, directly-cited claim that tissue diagnosis settles it. The notes also name the one genuine content gap rather than scoping decision: IELSG and MSKCC prognostic scoring, with PMID:29541540 cached and unused.

    Suggestions taken. Added a biochemical block for CSF interleukin-10 with the diagnostic performance figures and the prognostic association from PMID:27924864. Added an environmental entry for prolonged iatrogenic immunosuppression with an influences_mechanisms link at environmental_effect: PREDISPOSES onto the EBV node, which connects what had been the least-supported branch of the pathograph to a cited exposure. Its exposure_term is left unbound with the search recorded, on the same reasoning as the ZAP70 BCG entry: ECTO covers named agents and drug classes rather than the state of sustained therapeutic immunosuppression, and ECTO:0000509 is too general to carry the meaning. Added the canine primary CNS B-cell lymphoma animal model (PMID:23115372) with a PARTIALLY_RECAPITULATES link at LOW fidelity, whose limitations state plainly that the case-report evidence carries no molecular characterisation and so cannot support any claim about shared mechanism.

    Also strengthened the BCR/TLR node, which had rested on a review sentence conceding the pathophysiology is incompletely understood, with the PMID:28619981 opening statement that BTK links the B-cell antigen receptor and Toll-like receptors with NF-kB.

    One self-inflicted error caught by validation during this round: the CSF IL-10 reference_title was written from a truncated cache header rather than copied, producing 'Primary Central Nervous System Lymphoma' where the real title reads 'Primary Central Nervous System Large B-cell Lymphoma'. This is the check-reference-titles failure mode described in CLAUDE.md. Both occurrences were corrected by copying the title: field from the cache frontmatter, and check-reference-titles passes.

    Suggestions not taken, with reasons given in the PR reply: the immune-privileged-sites Grouping (agreed, but it is a new record for three diseases rather than an edit to this entry, so it belongs in its own PR) and prognostic scoring (a real gap, recorded in notes as such rather than added, to keep this push to the review's scope).

    Validation: just validate and just validate-disorders pass with 57/57 snippets verified, up from 44. check-reference-titles, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-environmental-evidence pass; check-cancer-origin still reports SOMATIC_LESION / OK / CL:0000787.

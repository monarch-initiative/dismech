  summary: 'Create: WFS1-Related Disorder'
  details: |
    De novo curation of MONDO:0700293, the WFS1 allelic series, closing the curation
    claim in issue #12794 and deleting stubs/WFS1-related_Disorder.yaml.

    Lump/split. Decided DISEASE with has_subtypes rather than GROUPING, from the
    literature rather than from the stub's descendant count. The GeneReviews chapter
    for this concept (PMID:20301750) is titled "WFS1 Spectrum Disorder" and states
    that WFS1-SD comprises classic and nonclassic forms, so the field treats the
    series as one disorder with subtypes. Four subtypes: Classic WFS1-SD
    (MONDO:0009101), DFNA6/14/38 (MONDO:0010963), Wolfram-like syndrome
    (MONDO:0013673), and the neonatal diabetes-deafness-cataract syndrome
    (MONDO:0100072). The first three are the descendants the stub recorded; the
    fourth is not a MONDO descendant of MONDO:0700293 - checked via the OLS
    hierarchicalAncestors endpoint, which returns only generic ancestors - and is
    carried on the strength of the primary report, with the discrepancy recorded in
    the entry's notes.

    Overlap with existing entries. Checked before writing. Wolfram_Syndrome
    (MONDO:0018105) already curates the recessive disease including the CISD2 form,
    and its own notes say it deliberately excludes the dominant arm and records it
    as a differential; this entry carries that arm. MONDO:0009101 is the only
    duplicated concept, appearing as a subtype in both. The two nonsyndromic
    hearing-loss entries the prompt flagged are unrelated:
    Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11 is MYO7A and
    Autosomal_Recessive_Nonsyndromic_Hearing_Loss_35 is ESRRB, and each mentions
    WFS1 only inside a quoted sentence about candidate-gene exclusion or a control
    cohort. MYO7A is listed in this entry's differential because DFNA11 is another
    cause of the ascending audiogram.

    Deep research. The requested provider, falcon, returned HTTP 402 (Edison account
    out of credits). Rather than substituting by hand, the run was re-issued as
    `just dr_fallback='--fallback' research-disorder falcon WFS1-Related_Disorder`;
    openscientist produced the report, which records fell_back, requested_provider
    and provider_attempts in its frontmatter. Committed as
    research/WFS1-Related_Disorder-deep-research-openscientist.md with its citations
    sidecar and its two artifacts (final_report.html/pdf).

    The report has a scope error worth recording. Asked about MONDO:0700293 it
    answered about classic recessive Wolfram syndrome - its summary equates
    WFS1-related disorder with DIDMOAD, its phenotype table is the Washington
    University recessive natural-history cohort, and the dominant arm appears only in
    three passing mentions of a "wolframinopathy" spectrum. That is Named Entity
    Confusion reached through a gene-anchored concept name, and most of the report
    duplicates the existing Wolfram_Syndrome entry. One citation it surfaced was
    genuinely useful and is used: PMID:36764396, the 86-patient systematic review of
    Wolfram-like syndrome, which supplies the dominant arm's feature frequencies
    (optic atrophy 87%, hearing impairment 94%, diabetes 44%), its
    genotype-phenotype correlation, and its survival statement. Every other reference
    was found through PubMed E-utilities searches run directly.

    The report carried no reference-validation section when it landed, so
    `just validate-research-reference` was run on it: 33/33 references resolved,
    14/14 quoted claims found in source, 0 off topic. Its pre-existing term-validation
    section lists five identifiers the report names as something else; none of them
    was used here, since every CURIE in this entry was read from cache/<prefix>/terms.csv
    or from an OLS lookup in the same step it was written.

    Evidence. 73 snippets across 13 references, all exact-quote verified against
    references_cache by `just count-verified-snippets` (73/73) and by
    `just validate-disorders`. Sources are the GeneReviews chapter, the two 2001
    founding DFNA6/DFNA38 papers (PMID:11709537, PMID:11709538), the p.A684V
    optic-atrophy cohort (PMID:21538838) and the 14-patient Japanese p.A684V series
    (PMID:39858604), the dominant ER-stress neonatal-diabetes paper (PMID:28468959),
    the p.E864K MAM/mitophagy study (PMID:38651637), the mouse inner-ear wolframin
    localisation study (PMID:12649740), the DFNA6/14/38 family study (PMID:36833385),
    the Wolfram-like systematic review (PMID:36764396) and case report
    (PMID:41048689), the WFS1 optic-atrophy series (PMID:39552476), and the
    low-frequency hearing-loss review (PMID:37121227). Content types are abstract_only
    or full_text_xml throughout; no full_text_html snippet was used, given the stale
    cache-body problem in issue #12672. Two snippets had to be reshaped because the
    validator strips bracketed reference markers mid-quote; they were split at the
    bracket rather than edited.

    Mechanism. Ten pathophysiology nodes in a connected chain from the heterozygous
    exon 8 allele to four tissue-level outcomes, with mechanism_confidence set per
    node: ESTABLISHED for the aggregation/ER-stress and MAM/calcium nodes,
    PROVISIONAL for the reduced-protein and beta-cell nodes, HYPOTHETICAL for the
    proposed dominant-negative interference and for inner-ear ion homeostasis.
    genetic_context.functional_impact_category is UNKNOWN rather than
    DOMINANT_NEGATIVE: the literature offers dominant-negative interference and toxic
    gain of function as alternatives in the same paragraph and settles neither, so the
    two candidates are modelled as separate downstream nodes and the unresolved
    question is recorded as a discussion. Eight of the nine phenotypes are causally
    connected to a pathophysiology node; hypotonia is left ISOLATED because nothing
    in the cited literature says what produces it, and an edge added to clear a
    report would be worse than the gap.

    Two KNOWLEDGE_GAP discussions: why the non-syndromic form takes the low
    frequencies when wolframin shows no basal-to-apical cochlear expression gradient,
    and whether the dominant alleles interfere with wild-type protein or act by toxic
    gain of function.

    Not curated: animal_models, computational_models, biochemical, clinical_trials,
    datasets. The Wfs1E864K knock-in mouse is cited as evidence but no source
    characterises it as a model with the fidelity and limitations an AnimalModel
    record needs. No trial in nonclassic WFS1-SD was found; NCT03717909 enrolled
    classic disease and is curated in Wolfram_Syndrome. GeneReviews' isolated-diabetes
    and isolated-cataract nonclassic phenotypes are named in the entry's notes but not
    made subtypes, because no source read characterises them beyond the name.

    Validation run, all passing: just validate-disorders (schema, terms, references,
    73 snippets, 0 issues), just count-verified-snippets (73/73), just validate-terms,
    just check-entity-refs, just check-causal-targets, just check-duplicate-keys,
    just check-enum-values, just check-coarse-phenotypes, just check-reference-titles,
    just check-genereviews (GeneReviews TAGGED, exact match to NBK4144),
    just list-gene-term-mismatches (6/6 bindings name the gene the entry names),
    just validate-stubs, just check-stubs, and pytest -k WFS1 (2 passed).
    references_cache/ and cache/ were checked after every validator run and reverted
    to any file this entry did not intend to change; PMID_20301750.md and
    PMID_27434582.md were each reverted once after a validator rewrote them, per
    issue #12672.

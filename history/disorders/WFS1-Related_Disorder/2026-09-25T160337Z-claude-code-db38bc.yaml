  summary: 'Self-review before the automated review landed'
  details: |
    Three corrections found by re-reading the committed entry, all pushed before the
    reviewer's verdict.

    The p.A684V hearing-loss phenotype was scoped to the Wolfram-like subtype and
    carried frequency FREQUENT. Both were wrong. In the fourteen-patient Japanese
    series that allele gave hearing loss and nothing else in most carriers - optic
    atrophy in two of eleven assessed, diabetes in none - so filing it under the
    syndromic subtype asserted a presentation those patients did not have, and a
    whole-entity frequency has no published denominator. The scoping and the frequency
    are removed and the reason is recorded in the phenotype's notes; the same
    overstatement in the entry description is corrected to say that the allele cuts
    across both presentations.

    Two evidence explanations described the "Alternatively, the aberrant protein has a
    toxic gain-of-function effect" sentence as though it were in the quote. It is not:
    the snippet validator strips the bracketed reference marker that separates it from
    the preceding sentence, so the quote had to be cut there. Both explanations now say
    where the alternative lives and why it is not quoted. The same node's
    genetic_context gained a note explaining why variant_origin is GERMLINE rather than
    DE_NOVO on a node that covers both transmitted and de novo alleles.

    The deep-research paragraph in notes: narrated the curation run rather than
    describing the artifact. Rewritten to lead with what a reader reusing the committed
    report needs to know - it was asked about MONDO:0700293 and answered about recessive
    Wolfram syndrome - leaving the provider-fallback history to the report's own
    frontmatter, per the rule that notes: is not a session log.

    Re-validated after each change: just validate-disorders (0 issues, 73 snippets) and
    just check-folded-hyphens, which caught one line-ending hyphen split introduced by
    the clinical_burden text and was fixed before commit.

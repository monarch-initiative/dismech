  summary: Correct the cohort named in both subtype_frequency values
  details: |
    Fourth review round on PR 12491, one factual correction. Both subtype_frequency values said the 24-and-2 split was 'of 28 homozygous p.Tyr51Cys carriers in the founding cohort'. That misnames the cohort: PMID:35148383 describes its 28 individuals from 26 families as 'so far unreported', making them additional to the discovery cohort of 33 patients from 29 families in PMID:33465056. Verified both abstracts in the reference cache before changing anything. Changed to 'founder-variant cohort', which is how the adjacent evidence explanation already phrases it. The error was worse than a loose word because this entry already uses 'founding cohort' correctly in three pre-existing places, all referring to the 33-patient 2021 cohort - at the p.Tyr51Cys variant description, and twice in the treatment and progression sections for the untreated recovery rate - so the new text collided with established usage in the same file. Those three were left untouched. This is the failure mode CLAUDE.md describes for the unchecked prose layer: the snippet itself verified as an exact quote, and the mischaracterisation was in my summary of which cohort it came from, which no gate reads. Declined the round's other suggestion, adding mappings.mondo_mappings with skos:broadMatch on the Leigh subtype. It is schema-legal, since mappings is a slot on Subtype, and the direction the reviewer gave is right. CORRECTION, made in place after the next review round: this record originally justified declining it by claiming that no has_subtypes entry in the knowledge base carries a mappings block. That was false. 72 subtypes across 28 files carry one (38 mondo exactMatch, 20 ncit exactMatch, 11 ncit closeMatch, 3 mondo broadMatch, 2 mondo narrowMatch, 2 mondo closeMatch, 1 mondo relatedMatch). The check behind the claim was broken: it ran a python yaml parse in a loop with stderr discarded, in a checkout where the interpreter had no yaml module, so every iteration failed silently and the empty output was read as an absence of precedent. The decision stands on its substantive reason instead. In the analogous Citrin_Deficiency CTLN2 subtype, subtype_term holds the narrow term MONDO:0011326 and the broadMatch points up to the broader MONDO:0016603, which is informative. Here the relation is inverted: no DNAJC30-specific Leigh term exists, so the broad MONDO:0009723 already sits in subtype_term, and a broadMatch to that same CURIE would restate it under a second predicate without adding information. broadMatch is also excluded from coverage counting, so nothing is gained there either. Validation: just validate-disorders passed with 99/99 snippets verified; check-enum-values OK; pytest -k subtype 6 passed.

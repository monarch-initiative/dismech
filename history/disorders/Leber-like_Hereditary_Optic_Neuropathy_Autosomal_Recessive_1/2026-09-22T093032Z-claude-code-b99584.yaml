  summary: Correct the cohort named in both subtype_frequency values
  details: |
    Fourth review round on PR 12491, one factual correction. Both subtype_frequency values said the 24-and-2 split was 'of 28 homozygous p.Tyr51Cys carriers in the founding cohort'. That misnames the cohort: PMID:35148383 describes its 28 individuals from 26 families as 'so far unreported', making them additional to the discovery cohort of 33 patients from 29 families in PMID:33465056. Verified both abstracts in the reference cache before changing anything. Changed to 'founder-variant cohort', which is how the adjacent evidence explanation already phrases it. The error was worse than a loose word because this entry already uses 'founding cohort' correctly in three pre-existing places, all referring to the 33-patient 2021 cohort - at the p.Tyr51Cys variant description, and twice in the treatment and progression sections for the untreated recovery rate - so the new text collided with established usage in the same file. Those three were left untouched. This is the failure mode CLAUDE.md describes for the unchecked prose layer: the snippet itself verified as an exact quote, and the mischaracterisation was in my summary of which cohort it came from, which no gate reads. Declined the round's other suggestion, adding mappings.mondo_mappings with skos:broadMatch on the Leigh subtype. It is schema-legal, since mappings is a slot on Subtype, and the direction the reviewer gave is right, but no has_subtypes entry in the knowledge base carries a mappings block, and the two precedent files the review cited contain no broadMatch at all. Validation: just validate-disorders passed with 99/99 snippets verified; check-enum-values OK; pytest -k subtype 6 passed.

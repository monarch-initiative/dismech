- type: REVIEW
  outcome: changed
  sections:
  - has_subtypes
  summary: 'Gene-family review: DNAJC30; unbind the Leigh presentation subtype'
  details: |
    DNAJC30's modelling (causative, germline, ClinGen Definitive for MONDO:0958183; lesion node bound to enzyme binding for its interaction with complex I subunits and to protein-containing complex remodeling, PMID:33465056) was checked against the literature and left unchanged. The Leigh syndrome presentation subtype was bound to MONDO:0009723 Leigh syndrome, the generic disease. Because has_subtypes terms are what dismech matches external gene-disease assertions against, every gene ClinGen classifies for Leigh syndrome (complex I, IV and V genes, HPDL, OPA1, AIFM1 and others) was reported as having a ClinGen disease curated by this DNAJC30 entry, which does not name them. No MONDO term exists for the DNAJC30 Leigh presentation, so the subtype now keeps its preferred term, Leigh syndrome presentation of DNAJC30 disease, without an ontology binding, as the entry's Optic presentation subtype already does. Leigh syndrome itself is curated by the Leigh Syndrome entry.

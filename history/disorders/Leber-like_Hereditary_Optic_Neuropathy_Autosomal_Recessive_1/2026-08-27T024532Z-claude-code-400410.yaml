  summary: 'Create: Leber-like Hereditary Optic Neuropathy, Autosomal Recessive 1
    (DNAJC30)'
  details: |
    New Disease entry for MONDO:0958183 (OMIM 619382), the DNAJC30-specific
    autosomal recessive form of Leber hereditary optic neuropathy, curated from the
    stub at stubs/Leber-like_Hereditary_Optic_Neuropathy_Autosomal_Recessive_1.yaml.

    Entry-type decision: DISEASE. The stub records no mondo_descendant_count, so
    MONDO holds this as a leaf, and genes: lists a single causal gene (DNAJC30).
    The existing kb/disorders/Leber_Hereditary_Optic_Neuropathy.yaml entry carries
    an arLHON has_subtypes block bound to the PARENT term MONDO:0030309, which
    lumps DNAJC30 with NDUFS2, MCAT and NDUFA12; this entry is the DNAJC30-specific
    child concept and is curated separately because the mechanism differs in kind
    from the mitochondrial form (impaired repair of an assembled complex I versus a
    defect in a complex I subunit). A notes: block in the entry records that
    relationship so the two are not later merged by mistake.

    Deep research: just research-disorder falcon. The report's own
    reference_validation block reported 5/5 references verified, 0 not found,
    5/5 on topic, confabulation_rate 0.0. NEC preflight
    (just preflight-dr ... MONDO:0958183) returned PASS: DNAJC30 mentioned 71 times
    against MT-ND4 3, and the report OMIM 619382 matched the MONDO xref. The report
    was used as a lead only; every snippet in the entry was taken directly from a
    references_cache file fetched with just fetch-reference, not from the report.
    Two ontology suggestions in the report were checked and NOT used because they
    are wrong for this repository: CL:0000705 for retinal ganglion cell (the
    correct term is CL:0000740) and UBERON:0000390 for optic nerve (this repo binds
    UBERON:0000941 cranial nerve II, as the existing LHON entry does).

    Content: 7 pathophysiology nodes forming a single connected chain from DNAJC30
    loss of function through impaired complex I N-module subunit exchange,
    accumulation of functionally impaired complex I, and mitochondrial bioenergetic
    failure, to retinal ganglion cell degeneration and optic nerve atrophy, with a
    minority Leigh syndrome branch. 9 phenotypes, 1 genetic entry with two
    population-specific case_fractions, 1 prevalence record, idebenone as the single
    treatment with a BYPASSES target_mechanisms link, 1 diagnosis entry, and 2
    KNOWLEDGE_GAP discussions with proposed experiments (sex-dependent incomplete
    penetrance in a recessive disease; what determines the Leigh branch).

    Deliberate omissions recorded in the entry notes: no environmental section
    (tobacco and alcohol are established for mtLHON but no source examined reports
    them for DNAJC30 patients); no complex V mechanism (the founding study found no
    effect on complex V function, abundance or subunit turnover); no Williams
    syndrome link (the founding study found no Williams features in carriers); and
    no GeneReviews baseline, because a PubMed search for a DNAJC30 or arLHON
    GeneReviews chapter returned none and the Nuclear Gene-Encoded Leigh Syndrome
    Spectrum overview does not list DNAJC30. Frequency was omitted for the two
    Leigh-branch phenotypes because no source quantifies them.

    Two GO annotations were dropped after validation flagged GO:0070997 neuron death
    as obsolete. Rather than substituting GO:0051402 neuron apoptotic process, the
    biological_processes blocks on the retinal ganglion cell and Leigh nodes were
    removed: the cited sources say "degeneration" and "necrosis", and neither states
    an apoptotic mechanism, so binding an apoptosis term would have asserted more
    than the evidence supports.

    Validation, all run and read: just validate passed (schema, terms, references),
    Snippets checked: 70/70 verified against cached references; check-title-snippets
    OK; check_snippet_length.py --against-ref origin/main OK; check_folded_hyphens
    --check OK; check-duplicate-keys OK; check-term-cache-integrity OK;
    check-cache-order OK. just validate-disorders run once before opening the PR.

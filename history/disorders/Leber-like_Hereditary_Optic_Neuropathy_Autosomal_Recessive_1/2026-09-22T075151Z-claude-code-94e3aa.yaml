  summary: Split the optic and Leigh presentations into has_subtypes
  details: |
    Added a has_subtypes block with two arms, Optic and Leigh, and scoped all eight curated phenotypes to them (five Ophthalmological to Optic, three Neurological - Dystonia, Bilateral Basal Ganglia Lesions, Ataxia - to Leigh). The entry previously carried both presentations in one undifferentiated file with no has_subtypes and no subtype FK references. Rationale: the arms are separable on observation, since PMID:35861300 states DNAJC30 variants should be suspected in LS patients irrespective of optic nerve involvement, so the Leigh arm is not merely the optic arm with added features; and the curated phenotypes partition cleanly. They are deliberately NOT modelled as mechanistically distinct entities - one genotype produces both and the determinant is the entry's own open question arlhon_leigh_branch_determinant - which is why the subtype descriptions cross-reference that discussion. The precedent for a clinically defined subtype over an unexplained determinant is Gaucher disease's neuronopathic/non-neuronopathic types. Checked first that the entry had not already declined subtypes: neither the notes nor the discussion rationale contains any such statement. Deliberately left unscoped and recorded in notes: the three progression phases (all written for the optic course) and idebenone's differential response, each being a separate claim needing its own per-arm evidence. The five ophthalmological frequency bands were scoped to Optic rather than dropped because their source cohorts were optic-ascertained, making the scoped reading closer to the sources than the entry-wide one; the three neurological phenotypes carry no bands. Validation: just validate-disorders passed with 99/99 snippets verified against cached references; pytest -k subtype 6 passed (includes check_subtype_foreign_keys); check-enum-values, check-duplicate-keys, check-entity-refs all OK; just subtype-usage-audit reports 2/2 subtypes referenced by subtype FK (100%), against a KB-wide baseline near 36%. Branched from the complex_i_deficiency module/grouping commit, so this file already carries its conforms_to lines.

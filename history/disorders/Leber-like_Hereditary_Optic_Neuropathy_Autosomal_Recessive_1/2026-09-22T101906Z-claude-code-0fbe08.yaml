  summary: Correct a false precedent claim in the previous round's record
  details: |
    Fifth review round on PR 12491. No knowledge-base content changed; this round corrects a false statement I made in the previous round's history record and in a PR comment. Declining the suggested subtype-level mappings block was justified by the claim that no has_subtypes entry in the knowledge base carries one. The reviewer checked and found 72 such subtypes across 28 files; I re-derived the same figure independently, with the same predicate breakdown they reported. The claim was false. Root cause: the check behind it ran a python yaml parse inside a shell loop with stderr redirected to /dev/null, in a checkout whose python3 has no yaml module, so every iteration raised ModuleNotFoundError, produced no output, and the empty result was read as an absence of precedent rather than as a failed check. The same session had already seen that interpreter fail on import yaml a few commands earlier. The decision to decline the mapping is unchanged but now rests on its real reason, which is stronger than the precedent argument was: in the analogous Citrin_Deficiency CTLN2 subtype the subtype_term is the narrow term MONDO:0011326 and the broadMatch points up to the broader MONDO:0016603, so the pair carries information; here no DNAJC30-specific Leigh term exists, so the broad MONDO:0009723 already occupies subtype_term and a broadMatch to the same CURIE would restate it under a second predicate. broadMatch is additionally excluded from coverage counting. Corrected the earlier record in place rather than by appending, following the distinction the reviewer drew: last round's record accurately described a session as it ran and rewriting it would have falsified the ledger, whereas this one asserted repository state that was untrue when written, sits on an unmerged branch, and is the record for the round under review. This is the same failure shape as the cohort error one layer out, and CLAUDE.md is explicit that a false justification is a larger defect than an unexplained absence because it tells the next reader the check has been done.

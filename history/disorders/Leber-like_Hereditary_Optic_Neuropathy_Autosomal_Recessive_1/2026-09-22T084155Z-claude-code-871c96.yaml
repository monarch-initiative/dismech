  summary: 'Review round: stop scoping shared optic phenotypes to the Optic arm'
  details: |
    Review round on PR 12491. The reviewer found that scoping optic phenotypes to the Optic subtype asserts they do not occur in Leigh-arm patients, which this entry refutes in its own text. Verified all four citations: the entry description says the Leigh arm presents with or without optic involvement; Optic Atrophy cites PMID:37397562, whose patients had bilateral optic atrophy with a Leigh-like course; the Ataxia snippet from PMID:39132756 describes a Leigh patient with progressive optic neuropathy; and PMID:35861300 says DNAJC30 should be suspected in LS irrespective of optic nerve involvement. The contradiction was self-inflicted in the same commit, since the with-or-without sentence is one I wrote. Fix: dropped subtype: Optic from Reduced Visual Acuity and Optic Atrophy, the two with documented Leigh-arm occurrence, and corrected the notes claim that the eight phenotypes partition cleanly. Centrocecal Scotoma, Color Vision Defect and Optic Disc Hyperemia keep the Optic scoping because no source examined reports them in a Leigh-arm patient, but the notes now state plainly that this rests on absence of evidence rather than demonstrated exclusivity and should be revisited if such a case is reported. Also took the reviewer's grounding point: the Leigh subtype now carries subtype_term MONDO:0009723 Leigh syndrome, making the arm visible to MONDO-driven queries, and both arms carry subtype_frequency from the founding cohort's own 24-of-28 versus 2-of-28 split. Validation: just validate-disorders passed; pytest -k subtype 6 passed; check-enum-values OK; subtype-usage-audit still reports 2/2 subtypes referenced by subtype FK.

  summary: 'Create: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis (DBA14,
    TSR2)'
  details: |
    New standalone Disease entry for MONDO:0010493 (DBA14, X-linked, hgnc:25455 TSR2, OMIM 300946). Lump/split call argued explicitly in entry notes and resolved as a separate entry rather than a has_subtypes row on MONDO:0015253: distinct MONDO/OMIM/DOID identity, X-linked recessive rather than autosomal dominant transmission, a chaperone/escortin lesion upstream of the parent concept's ribosomal-protein-haploinsufficiency anchor, and a mandibulofacial dysostosis phenotype absent from the parent concept. Pathograph runs TSR2 Escortin Deficiency -> Impaired Escortin Handover of eS26 -> Deficient eS26 Incorporation into the Small Ribosomal Subunit -> Defective Small-Subunit Maturation and 18S rRNA Processing -> Ribosomal Stress Response / Impaired Erythroid Progenitor Output / Abnormal Craniofacial Embryonic Development, with the eS26 node curated as the convergence point with RPS26-related DBA10. Evidence rests on two TSR2-specific primary papers (PMID:24942156 gene discovery in one kindred of two hemizygous male cousins; PMID:30201955 humanized-yeast and biochemical characterisation of the E64G allele, including the eS26-overexpression rescue), plus PMID:25144938 for escortin function, PMID:35213229 for the stress-response role recorded as an unmodelled second function, PMID:23252420 for eADA test performance, PMID:20301769 (GeneReviews) for class-level diagnosis and management, PMID:26203908 for the bovine TSR2 allele, and PMID:29022598 for TSR2 being subject to X-inactivation. Class-level DBA statements are graded directness: INDIRECT throughout and labelled as such in each explanation. penetrance left UNKNOWN (two affected hemizygotes is not a denominator); expressivity VARIABLE on within-family evidence. Six discussions record the open questions: single-family gene-disease evidence, the unexplained craniofacial mechanism, carrier-female status and X-inactivation skew, the bovine model mismatch (curated PERTURBS rather than FAILS_TO_RECAPITULATE because no haematology was reported in the cows), whether loss of TSR2's second, reversible stress-response function on mature ribosomes contributes to the disease, and whether the DBA class cancer risk applies. [Count corrected from "Five" in review round 1 of PR 11432; the stress-ribosome discussion was present in the entry from the first commit but omitted from this enumeration.] One deep-research run with the claude_code provider; three of its findings were rejected against the primary sources and the rejections are recorded in notes. Validation: linkml-validate no issues; validate-terms passed; 104/104 snippets verified against cached references; duplicate-keys, entity-refs, causal-targets, qualifier-terms (offline and online) and enum-values all OK; validate-disorders run as the authoritative gate.

  summary: 'Review round 2: drop the two one-of-two frequency bands'
  details: |
    Round-2 review response for PR 11432. The reviewer ruled on the frequency question I had put to them, and ruled against what round 1 pushed. frequency: FREQUENT is removed from Macrocytic anemia and Cryptorchidism, and the caveat sentences that justified the band are trimmed out of both descriptions rather than left dangling. The seven VERY_FREQUENT bands are untouched. The argument that settles it is internal to this entry rather than a borrowed precedent: six phenotypes rest on a denominator of two, and four of them (Increased mean corpuscular volume, Elevated red cell adenosine deaminase activity, Persistence of hemoglobin F, Abnormal middle ear morphology) already carried no band, so the round-1 change made Macrocytic anemia and Cryptorchidism inconsistent with their four siblings instead of consistent with each other. Separately, the seven findings present in both affected males are recorded VERY_FREQUENT (80-99%) rather than the OBLIGATE that 2 of 2 would literally give; that is the conservative reading, and applied consistently a 1-of-2 observation is an absent band rather than 30-79%. I verified all thirteen phenotypes against their descriptions before writing this: the seven banded ones each say both affected males, and the six unbanded ones each name a single patient. A notes paragraph now records the convention and cross-references kb/disorders/COA5-Related_Fatal_Infantile_Cardioencephalomyopathy.yaml, which records the same reasoning for a three-patient disease. Validation: just validate passes with 105/105 snippets verified, unchanged - no evidence item was touched; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean; validate-disorders run as the authoritative gate.

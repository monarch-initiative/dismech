  details: |
    Round-1 review response for PR 11432. Both blocking items were ontology-specificity findings on treatment_term. Red Cell Transfusion was bound to the generic NCIT:C15747 Supportive Care and is now NCIT:C15192 Blood Transfusion, the term eleven sibling haematology entries already use for this treatment. Malignancy Surveillance was bound to the same generic term and is now NCIT:C15406 Cancer Screening, matching the parent entry kb/disorders/Diamond-Blackfan_Anemia.yaml. Both CURIEs were checked against cache/ncit/terms.csv for label agreement and against cache/enums/treatmentactionterm_b7dcb86faf99.csv for reachability from NCIT:C25218, so no cache row was added. The third NCIT:C15747 use, Multidisciplinary Management of Congenital Malformations, is left alone: it names no single procedure and the generic term is the accurate one there. preferred_term is unchanged on both, and stays more specific than the ontology label as the term contract allows. Three non-blocking suggestions were also taken. A GeneReviews evidence item now carries the agents-to-avoid statement that previously existed only as treatment description prose, quoting PMID:20301769 exactly and graded INDIRECT as class-level DBA management. Macrocytic anemia carried frequency Occasional (5-29%) while describing a one-of-two observation, which falls in the FREQUENT band (30-79%); it is now FREQUENT with the denominator caveat kept, and Cryptorchidism, which has the same one-of-two denominator and omitted frequency entirely, now carries the same band and caveat. The remaining seven frequency values in the file were normalised from the legacy alias spelling to the canonical enum form, which is what 6153 of the corpus uses. The round-1 history record said five discussions where the entry has six; that count is corrected in place with a bracketed note saying so, the omitted one being tsr2-stress-ribosome-role, which was in the entry from the first commit. Validation: just validate passes with 105/105 snippets verified, up from 104 for the one added evidence item; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-term-cache-integrity and check-cache-order all clean; check-snippet-length, check-title-snippets and check-snippet-grading report findings only in MPI-Congenital_Disorder_of_Glycosylation and ZNF407-Related_Neurodevelopmental_Disorder, neither of which this branch touches.

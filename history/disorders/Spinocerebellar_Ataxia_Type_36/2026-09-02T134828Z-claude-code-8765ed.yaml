  summary: 'Create: Spinocerebellar Ataxia Type 36'
  details: |
    De novo curation of SCA36 (Asidan / Costa da Morte ataxia, MONDO:0013594), the NOP56 intronic GGCCTG hexanucleotide repeat expansion disorder. Deep research: falcon (research/Spinocerebellar_Ataxia_Type_36-deep-research-falcon.md); its reference_validation reported 12/12 citations resolved with a 0.0 confabulation rate, and term_validation flagged only one obsolete GO term (GO:0030529, which was not used here) and the unresolvable ORPHA prefix. just preflight-dr returned PASS against MONDO:0013594 with NOP56 mentioned 34 times. The retired GeneReviews chapter (PMID:25101480) was fetched and used as the phenotype and management baseline and is tagged in the top-level references block; its retired status is recorded in the entry notes. Content is built on primary cohort reports: Kobayashi 2011 (PMID:21683323) for the gene and the RNA gain-of-function mechanism, Ikeda 2012 (PMID:22744658) for the Japanese clinical series and neuropathology, Garcia-Murias 2012 (PMID:22492559) for the Galician founder kindreds, Obayashi 2015 (PMID:25476002) for the multicentre screen and short expansions, Lee 2016 (PMID:27123487) for the Han Chinese founder cohort and the MIR1292 replication, Lam 2023 (PMID:37810464) for the British cohort where hearing loss is uncommon, plus mechanism and therapeutic papers (PMID:24985895, PMID:32375063, PMID:30610877, PMID:28918022, PMID:33705846, PMID:23140984, PMID:22353375, PMID:27862279, PMID:35309140). Pathophysiology is curated as a causal chain from the expansion through intron 1 retention and nuclear GGCCUG RNA foci to SRSF2 sequestration and DPR production, converging on Purkinje cell and lower motor neuron degeneration and then on cerebellar atrophy and bulbar/limb denervation; two nodes conform to the cerebellar_purkinje_degeneration module. Three uncertainties are curated explicitly rather than smoothed over: the MIR1292 node carries HYPOTHETICAL confidence and no outgoing edge because its only data are in lymphoblastoid cells and the target-gene test was negative; the DPR node is PROVISIONAL with a CONTROVERSY discussion because a Neuro2A model found RAN-derived DPR formation rare; and the auditory node has an UNKNOWN-typed incoming edge with a KNOWLEDGE_GAP discussion. Validation run in this worktree: just validate (schema, no issues), just validate-terms (passed), just count-verified-snippets (103/103 verified), just check-duplicate-keys, just check-entity-refs, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-reference-titles (all OK), and the batched just validate-disorders (schema + terms + references all passed, 103/103 snippets). No DOI-keyed evidence was used, so no --unskip-prefix run was needed.

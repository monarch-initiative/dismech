  summary: 'Gene-family review: NDUFS8'
  details: |
    NDUFS8's molecular function, 4 iron, 4 sulfur cluster binding, is correct, but the entry description and the NDUFS8 node presented the 1998 view (PMID:9837812) that its two 4Fe4S ferredoxin motifs bind cluster N2, the terminal cluster that reduces ubiquinone. Structures of complex I assign those motifs to the [4Fe-4S] clusters N6a and N6b, and N2 to NDUFS7. Both passages now say so, the node gains an evidence item mapping each cluster to its subunit (N2/NDUFS7, N6a and N6b/NDUFS8; PMID:34849584), and the explanations of the 1998 and 2004 (PMID:15159508) evidence items now mark their N2 attribution as the pre-structural view. The genetic record (causative, germline) was checked and left unchanged.

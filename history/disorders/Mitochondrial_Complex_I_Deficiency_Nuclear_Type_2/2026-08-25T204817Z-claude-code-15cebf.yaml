  summary: 'Review response 2: neurological phenotypes, term fix, definitional-evidence
    scoping (#9491)'
  details: |
    Second review response for PR #9491. All 3 IMPORTANT findings and all 4 actionable SUGGESTIONS
    addressed.

    IMPORTANT 1 - the clinical paragraph. Same root cause as round 1, different location: the
    paragraph immediately preceding the biochemistry I mined gives the late-onset patient's complete
    neurological examination, and none of it was curated. Four phenotypes added, each with a
    patient-level quote: Dysarthria (HP:0001260, with a second quote establishing it was progressive),
    Nystagmus (HP:0000639, marked horizontal and vertical on lateral upgaze), Dystonia (HP:0001332,
    with the dissociation from normal resting strength and tone that makes it a basal-ganglia rather
    than myopathic sign), and Gait Ataxia and Falls (HP:0002066, with the toe-walking onset at age 7
    that dates the illness precisely).

    IMPORTANT 2 - Developmental Regression was bound to HP:0001263 Global developmental delay while
    its own description argued regression rather than delay. Rebound to HP:0002376 Developmental
    regression. The reviewer was right that the entry was contradicting itself.

    IMPORTANT 3 - three phenotypes rested on the definitional sentence rather than a patient
    observation. Handled differently for each rather than uniformly:
    - Bilateral Striatal Necrosis: the patient-specific MRI quote is now the PRIMARY evidence ("A head
      MRI showed abnormal bilateral, symmetric lucencies involving the posterior half of the putamen,
      lesions compatible with LS"), giving the exact anatomical distribution. The definitional sentence
      is retained but downgraded to PARTIAL with its status stated.
    - Developmental Regression and Hypotonia: no patient-level quote exists for either, so instead of
      manufacturing one I SOFTENED THE CLAIMS. Both descriptions now say explicitly that the evidence
      is the definition of Leigh syndrome rather than an NDUFS8 observation, both are scoped to the
      severe infantile end, both definitional snippets are PARTIAL, and each now carries a REFUTE
      evidence item quoting the counterexample from the SAME paper - cognition "remained normal" and
      "normal strength and tone at rest" in the late-onset patient. The reviewer's observation that
      the definitional sentence sits awkwardly next to that patient is exactly right, and the entry now
      records the tension instead of hiding it.

    SUGGESTION 1 taken - the assembly-mechanism detail. Node 2's description now states the structural
    proposal (TYKY connects the membrane and peripheral domains of complex I) with two supporting
    quotes, including the 39-kDa subunit being placed at the same domain boundary.

    SUGGESTION 2 taken - the 39-kDa reduction is folded into the mc1dn2_genotype_phenotype_range gap
    as a THIRD candidate explanation, and argued to be the most tractable of the three: unlike the
    structural inference and the activity-to-amount ratio, it is a measured protein-level difference
    between the two genotyped patients with different courses, obtainable by western blot on
    fibroblasts that already exist.

    SUGGESTION 3 taken - the compensatory COI induction is added to the glycolytic-compensation
    modifier node, with the authors' own hedge ("Perhaps this induction...") quoted intact and both
    evidence items tagged PARTIAL. The practical point recorded is that an assay finding one
    respiratory complex up and another down should not be assumed to have gone wrong.

    SUGGESTION 4 taken - both references fetched. I applied the round-1 lesson first and checked
    content_type: both are full_text_xml, and both yielded material the abstracts do not carry.
    - PMID:36557887 (Wang 2022) supplies the finding I consider the most important addition in this
      round: every identified NDUFS8 mutation is missense and no nonsense variant has ever been
      reported, with complete absence of the protein proposed to be lethal in utero. That is a
      selection effect on the entire observable disease, and it is now in the genetic notes with the
      cohort size (16 Leigh syndrome + 1 encephalomyopathy patient) that bounds any genotype-phenotype
      analysis.
    - PMID:39385390 (Henke 2024) independently confirms that mutagenising the NDUFS8 homologue
      generates a Leigh phenotype in Yarrowia, and - more usefully - NAMES the NDUFS8 allele in the
      galactose fibroblast experiment as p.Arg94Cys, which the primary report does not spell out. The
      galactose model's limitations block is updated accordingly.
    - I did NOT find the quantitative Yarrowia result (~50% Vmax, altered rotenone/DQA sensitivity)
      the reviewer hoped for in the cached Henke text, so the Yarrowia model still records no readout
      magnitude and says so.
    - TAT-NDUFS8 is recorded in notes as a known lead but NOT curated: it has never been given to a
      patient, and the only source available here is a review's account of a cell-line experiment
      rather than the primary report. The note says where the right home would be if that paper is
      fetched.

    SUGGESTION 5 needed no action - the four Leigh-spectrum-general NCTs remain excluded as
    non-NDUFS8-specific, which the reviewer agreed with.


  summary: 'Review response: mine the full-text cache of PMID:15159508 on PR #9491'
  details: |
    Review response for PR #9491 (Mitochondrial Complex I Deficiency, Nuclear Type 2). The single
    blocking IMPORTANT finding is fully addressed; all seven omitted items are now curated.

    THE ROOT CAUSE, STATED PLAINLY. references_cache/PMID_15159508.md is cached as
    content_type: full_text_html and I consumed it as though it were abstract-only. I had checked the
    content_type on OTHER references in this entry -- it is why the tissue-specific residual activities
    from PMID:9837812 are deliberately NOT asserted, that record being abstract_only -- and then
    failed to apply the same check to this one. The reviewer is right that this is generalisable:
    check content_type before treating any cached reference as abstract-only. A note to that effect is
    now in the entry's notes so the next curator inherits the lesson rather than the mistake.

    WHAT WAS ADDED, item by item.
    1. Lactic Acidosis phenotype (HP:0003128), citing the index patient's elevated lactate and
       pyruvate in blood and CSF -- AND, as a REFUTE item on the same phenotype, the repeatedly normal
       lactate/pyruvate in the late-onset patient. The negative belongs on the phenotype because it
       establishes that lactic acidosis is not obligatory in this entity.
    2. Cardiomyopathy phenotype (HP:0001638, severity SEVERE) with the fatal cardiorespiratory
       failure at 11 weeks. Scoped to the severe infantile form: neither the late-onset patient nor
       the PEO-plus siblings are reported with cardiac involvement.
    3. The late-onset alleles are now named at nucleotide and protein level -- C254T (p.Pro85Leu) and
       G413A (p.Arg138His) -- with the parental segregation and the 100-control-DNA evidence, plus
       their positions relative to the iron-sulfur machinery.
    4. The repeatedly-normal lactate/pyruvate is added as a REFUTE evidence item on the Respiratory
       Chain Enzymology diagnosis entry, paired with the 31%/43% enzymology result from the SAME
       patient. Together they make the clinically actionable point: routine metabolic screening can be
       entirely reassuring in genetically and enzymatically confirmed disease, so a normal lactate
       must not stop the workup. The diagnosis description now says so.
    5. Residual complex I activity of 31% and 43% of control (muscle and lymphoblasts, normalized to
       citrate synthase) added to the Partial Rather Than Complete Complex I Defect biochemical entry,
       with the normal complex IV activity from the same assay -- which is what makes the figure
       interpretable as an ISOLATED complex I defect.
    6. The Yarrowia lipolytica model of the actual patient alleles added. The reviewer is right that
       it is more disease-specific than the C. elegans bypass: it tests P85L and R138H themselves
       rather than complex I deficiency in general, so it is linked to the NDUFS8 Loss of Function
       trigger node with relationship RECAPITULATES. Note I placed it under experimental_models with
       experimental_model_type: OTHER rather than under animal_models, because Yarrowia lipolytica is
       a fungus and not an animal; the reasoning is recorded in its limitations block.
    7. The spared-cysteine-motif mechanism folded into the mc1dn2_genotype_phenotype_range
       KNOWLEDGE_GAP, which now presents TWO candidate explanations rather than one: a structural,
       allele-specific criterion (alleles sparing the cysteine motifs that coordinate the iron-sulfur
       clusters should be milder) and the quantitative activity-to-amount ratio. The proposed
       experiment was rewritten to test them together, since the structural hypothesis predicts which
       alleles should show which ratio, and to name the Yarrowia system as an alternative background.

    A SECOND TOOLING DEFECT ENCOUNTERED TWICE. Two of the quotes I wanted contain "[4Fe-4S]", and
    bracketed spans are stripped before snippet matching unless conf/reference_validator_config.yaml
    lists a matching literal_bracket_patterns entry. count-verified-snippets diagnosed this precisely
    ("the snippet matches the cached text exactly once [4Fe-4S] is kept"), which is a genuinely good
    error message. Both quotes were re-cut to spans that carry the same claim without the bracket, and
    the reason is recorded in each explanation so a later curator does not re-attempt the fuller quote.

    CORRECTION TO THE PR BODY. It claimed the DR report "cites Edison-internal keys rather than
    identifiers". That is wrong: the .citations.md sidecar does carry resolvable DOIs alongside the
    internal keys. The report BODY cites internal keys, which is what misled me, but a curator should
    read the sidecar rather than skipping it. Corrected in the entry notes and in a PR comment.

    NOT CHANGED, ON THE REVIEWER'S OWN ASSESSMENT. GeneReviews PMID:26425749 remains tagged but not
    cited: the reviewer independently confirmed its cache holds only the chapter's statement of
    purpose and copyright, and ruled that declining to cite it is the better call than quoting the
    aims sentence as evidence_source: OTHER.


  details: |
    Third review response for PR #9491. The one IMPORTANT finding and all four SUGGESTIONS addressed.

    IMPORTANT - the clinical-spectrum paragraph. Third instance of the same root cause the reviewer
    identified in round 1: a full_text_xml cache under-consumed. In round 2 I mined the GENETIC
    sentences from the line-53 paragraph of PMID:36557887 and stopped; the two sentences immediately
    following are the NDUFS8-specific clinical spectrum across the 13-patient series. Five phenotypes
    added, each with a patient-series quote and SUPPORT/HUMAN_CLINICAL, which is straightforwardly
    right here because these are observations rather than the Leigh syndrome definition:
    - Seizures (HP:0001250) - severe infantile subgroup
    - Feeding Difficulties (HP:0011968) - severe infantile subgroup
    - Respiratory Insufficiency (HP:0002093, SEVERE) - severe infantile subgroup, joined to the index
      patient's fatal cardiorespiratory failure
    - Slowly Progressive Muscle Weakness (HP:0001324) - childhood-onset arm
    - Severe Myopia (HP:0000545) - childhood-onset arm
    The reviewer's observation that the existing infantile-vs-childhood scoping framing handles both
    clauses cleanly is right, and each phenotype description states which arm it belongs to. The
    respiratory phenotype is bound to the broad HP:0002093 rather than a mechanism-specific child,
    because the source says "respiratory problems" and distinguishes neither central hypoventilation
    nor respiratory muscle weakness; that reasoning is in the description.

    SUGGESTION 1 taken - the full allelic series is now quoted verbatim and summarised in the genetic
    notes: eleven distinct missense alleles across homozygous (p.Pro79Leu, p.Gly154Ser, p.Glu63Gln,
    p.Arg54Trp, p.Arg94Cys) and compound heterozygous (p.Pro79Leu/p.Arg102His, p.Pro85Leu/p.Arg138His,
    p.Arg77Trp/p.Ala159Asp, p.Arg18Cys, p.Val162Met, p.Cys153Arg) combinations. The reviewer is right
    that this materially strengthens mc1dn2_allelic_series_activity_amount, whose proposed experiment
    was reasoning over the two families the primary reports describe; it now explicitly names the full
    series as the denominator.

    SUGGESTION 2 taken - Cardiomyopathy rebound from HP:0001638 to HP:0001639 Hypertrophic
    cardiomyopathy, with the patient-series quote naming the morphology added alongside the existing
    index-patient quote. The description records why the more specific binding is now licensed.

    SUGGESTION 3 taken - a new diagnosis entry, "Diagnostic Negatives That Narrow the Differential",
    carrying all four: normal EMG and nerve conduction at age 7; unremarkable muscle histochemistry
    and electron microscopy; negative muscle mtDNA screening by Southern blot and common point
    mutations; and normal organic acids, amino acids and carnitines except a mild alanine rise. The
    entry argues what each negative excludes rather than just listing them - in particular that the
    negative mtDNA screen is the step that redirects the search to the NUCLEAR genome, which is the
    reason this entity has "nuclear type" in its name, and that a child with this disease can pass
    every first-line test.

    SUGGESTION 4 taken - the supports: REFUTE on the normal-lactate item in the enzymology diagnosis
    entry is now SUPPORT. The reviewer is right: `supports` describes the item's relation to the CLAIM
    being made, and a normal lactate in a patient with 31-43% residual complex I activity supports the
    claim that enzymology is worth doing. I had been treating REFUTE as "this is a negative finding",
    which is a different thing. The same snippet remains REFUTE on the Lactic Acidosis phenotype,
    where the claim it bears on genuinely is refuted; the explanation now says so explicitly so the
    apparent inconsistency is legible rather than looking like an error.

    SELF-CAUGHT WHILE EDITING. scripts/check_folded_hyphens.py fired on prose I had just written -
    "the ragged-red-fibre and abnormal-mitochondrial-" at a line end inside a folded scalar, which
    would have parsed as "abnormal-mitochondrial- morphology". Rephrased to keep the compounds off
    line ends. This is the third occurrence of that gate firing on descriptive prose in this session
    and the pattern is consistent: long explanatory sentences in notes/description fields are where
    hyphenated technical compounds cluster.


  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 2 (MONDO:0032606)'
  details: |
    De-novo creation of the Mitochondrial Complex I Deficiency, Nuclear Type 2 entry for
    MONDO:0032606 (claim issue #9440).

    ENTRY TYPE DECISION: DISORDER. The stub carried no mondo_descendant_count (a leaf) and named
    NDUFS8. MONDO:0032606 is a DEFINED intersection class -- "mitochondrial complex I deficiency,
    nuclear type" AND RO:0004003 NDUFS8 -- so the gene is constitutive of the concept, not merely
    associated with it. Curated as its own kb/disorders/ Disease exactly parallel to the existing
    Mitochondrial_Complex_I_Deficiency_Nuclear_Type_12 (NDUFA1) entry. The numbered MC1DN series is a
    gene-per-entry series by construction, so a subtype or grouping treatment would be wrong.

    NEC PREFLIGHT: WARN, assessed as benign. NDUFS8 dominates the report's gene mentions
    overwhelmingly (66, against NDUFS7=4 and NDUFS2=3), which is the strongest possible positive
    identity signal. The WARN is raised only because the report cites OMIM 252010 and 256000 where
    MONDO xrefs OMIM 618222. Both are parent or sibling concepts -- 252010 is the generic
    "mitochondrial complex I deficiency" entry and 256000 is Leigh syndrome -- not a rival disease
    entity, so this is not Named Entity Confusion. No sections were excluded. Separately, the report
    cites internal keys rather than identifiers, so nothing was curated from it directly; every PMID
    in this entry was found by direct PubMed E-utilities search and fetched with just fetch-reference.
    The report was used as a lead list, and two of its leads were followed up successfully (the 2024
    NDUFS8 endothelial paper, resolved from DOI to PMID:38594244, and the canine-free literature
    around the phenotypic range).

    WHAT WAS CURATED. 7 pathophysiology nodes (single MOLECULAR trigger root; every non-root reachable
    on a directed walk; scales MOLECULAR 3 / CELLULAR 3 / ORGANISM 1; includes one deliberate feedback
    edge from the ROS node back onto the assembly node), 5 phenotypes, 2 progression records,
    2 biochemical findings, 1 genetic block, 2 experimental_models with modeled_mechanisms and
    readouts, 1 animal_model, 2 diagnosis entries, 3 discussions (1 KNOWLEDGE_GAP, 2
    HUMAN_MODEL_MISMATCH). 66 evidence snippets across 8 PMIDs.

    THE MECHANISTIC POINT THAT DISTINGUISHES THIS ENTRY FROM ITS SIBLING. NDUFA1 (type 12) is an
    accessory subunit whose loss reduces the AMOUNT of assembled complex I. NDUFS8 is a structural
    core subunit carrying the 4Fe4S consensus patterns for cluster N-2, and its loss reduces both the
    amount AND the intrinsic catalytic activity of what remains: in control fibroblasts the ratio of
    complex I activity to complex I amount is exactly 1, and in patient cells it is below 1
    (PMID:18435906). That measurement is curated as its own node because it does real work -- it
    distinguishes this entity mechanistically from the accessory-subunit deficiencies, and it sets a
    ceiling on any therapy that acts by increasing enzyme amount.

    JUDGEMENT CALLS.
    - "Death in infancy" (HP:0001522) was initially curated as a phenotype and REMOVED after
      just validate-terms rejected it: the term sits under Mortality/Aging, not under Phenotypic
      abnormality, so it is outside the PhenotypeTerm dynamic enum. The content was moved to a
      progression: record instead, which is where a course belongs anyway.
    - The 2024 NDUFS8 endothelial paper (PMID:38594244) is a well-controlled gene-specific
      loss-of-function study with rescue experiments, and its ATP-Akt-mTOR-ANGIOGENESIS arm is
      deliberately NOT curated as a disease mechanism. Endothelium is not a tissue that fails in
      MC1DN2, vascular maldevelopment is not a reported patient phenotype, and the paper's only human
      tissue observation comes from proliferative diabetic retinopathy. The bioenergetic and ROS arms
      ARE curated as experimental_models links (this is the only NDUFS8-SPECIFIC model available --
      every patient-fibroblast panel in the literature pools NDUFS8 with NDUFS1/S2/S7/V1). The
      angiogenesis arm is recorded as a HUMAN_MODEL_MISMATCH discussion.
    - NO treatments: block. No treatment is established. The two interventions with any evidence are
      curated where the evidence sits: Trolox as a PERTURBS link under experimental_models with the
      authors' own ceiling ("may only be beneficial to patients with a relatively small reduction in
      intrinsic catalytic defect"), and the yeast Ndi1p bypass under animal_models as an invertebrate
      proof of principle. Recording either as a treatment would assert therapy for patients that
      nothing in the literature supports.
    - NO datasets: block. just discover-datasets returned 8 candidates; the two best (geo:GSE65634,
      geo:GSE27041) are real, human, patient-derived and about complex I deficiency -- but about the
      GROUP, with no NDUFS8 genotype. Attaching them would be exactly the "relaxing a precise entry
      name collapses sibling diseases" failure the dataset guidance warns about. A separate GEO text
      search for NDUFS8 returned 22 hits whose two series-level matches (cysteamine bitartrate in
      respiratory chain disease) mention the gene only in per-sample annotation. Rejection recorded in
      the entry notes.
    - GeneReviews: PMID:26425749 ("Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview") is the
      applicable chapter and is TAGGED in references: but deliberately NOT cited as evidence anywhere.
      Its cached PubMed record contains only the chapter's statement of purpose ("The purpose of this
      overview is to...") and no clinical content, so any snippet from it would attest to the
      chapter's aims rather than to a fact about the disease. Phenotypes are anchored on primary
      reports instead.
    - Tissue-specific residual complex I activity in the index patient (39% muscle, 69% fibroblasts,
      ~0% heart, 53% liver, 3% brain) is a striking datum the DR report surfaced and is NOT asserted
      here: those numbers live in the full text of PMID:9837812 and the cached record is abstract-only,
      so they cannot be quoted as a verified snippet. Recorded as a known gap in the entry notes.


  summary: Split the lumped EDMD4-5 row, add EDMD3, wire the LINC genes
  details: |
    The EDMD4-5 has_subtypes row bound MONDO:0013071, whose MONDO definition names SYNE1 alone, while carrying both SYNE1 and SYNE2 as genes; the entry's own description acknowledged the lump. Split it into EDMD4 (MONDO:0013071, SYNE1) and EDMD5 (MONDO:0013072, SYNE2) and repointed the two genetic foreign keys accordingly. Added EDMD3 (MONDO:0014676, biallelic LMNA) with the original autosomal recessive report, plus a second LMNA genetic record for the biallelic form so the new row carries a reciprocal foreign key; the dominant record keeps EDMD2. Gave EDMD5 SYNE2-specific evidence, since the shared nesprin screening sentence names both genes and so supports the pair rather than either member. Typed relationship_type CAUSATIVE on all seven genetic records. Bound EMD, LMNA, SYNE1, SYNE2 and TMEM43 as genes on the Nuclear Envelope and LINC Complex Dysfunction node, whose own cited snippets describe nesprin, emerin, lamin and LUMA localisation; FHL1 is left unwired and the reason recorded. Recorded the disposition of the two inheritance-grouping MONDO nodes, the SUN1 and SUN2 deferral, and that ClinGen holds no Emery-Dreifuss assertion for any of these genes. Review round 1: added a second evidence item on EDMD3 quoting the recessive
    segregation (a single homozygous change in the proband, unaffected
    heterozygous first-cousin parents), so the row's description stays within
    reach of a quoted snippet. Self-review also replaced decade arithmetic in that
    description with the ages the source states, reattributed the nesprin
    fibroblast findings the way PMID:17761684 reports them, and matched the
    source's hedge on the non-hepatic origin of the transaminases in EDMD5.
    54 of 54 snippets verified.

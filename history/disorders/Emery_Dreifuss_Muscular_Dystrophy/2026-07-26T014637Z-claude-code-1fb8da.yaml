  summary: Fix evidence/claim mismatch on Sudden Cardiac Death and Ventricular Arrhythmia
    nodes
  details: |
    Two fixes on PMID:35453731-cited nodes (Valenti et al. 2022 systematic review, abstract-only cache). (1) Sudden Cardiac Death: the sole evidence item quoted the review's PubMed/Embase search/inclusion-criteria list (naming SCD as a searched-for outcome), not a reported SCD incidence or mortality rate; the abstract gives quantitative incidence rates for AF/flutter, atrial standstill, and thromboembolism but none for SCD or mortality. Downgraded supports: SUPPORT to PARTIAL, reworded the explanation to state the mismatch, and added a notes: field flagging that a quantitative SCD/mortality citation is still needed. (2) Ventricular Arrhythmia: trimmed the unsupported clause 'Pacing does not protect against them' from the node description -- the cited PMID:37639473 documents malignant-ventricular-arrhythmia incidence in EMD variant carriers and recommends considering early ICD implantation, but says nothing about pacing failing to protect against arrhythmia; kept the ICD-indicated claim, which the paper's conclusion does support. Surfaced by issue #6972 (claim-evidence audit of muscular disorders); validated with linkml-validate and just validate-references.

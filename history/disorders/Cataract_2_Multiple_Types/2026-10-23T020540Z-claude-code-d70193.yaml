  summary: 'Create: Cataract 2, Multiple Types (CRYGC)'
  details: |
    New entry for CRYGC-related autosomal dominant congenital cataract (MONDO:0100436). Entry type DISEASE: no existing kb entry covers CRYGC; the CRYGD sibling Cataract_4_Multiple_Types is a separate MONDO disease. Pathograph runs from the CRYGC variant through two protein-level routes (unfolding/destabilization for T5P, G129C, the 5-bp duplication and W157X; aggregation with a native-like fold for R168W), cellular aggregation and a PERK unfolded protein response with apoptosis (transgenic mouse, 5-bp duplication only), to lens light scattering and the cataract phenotypes. Microcornea and microphthalmia are recorded without a causal edge and with a knowledge-gap discussion. A claude_code deep-research report was used as leads; every snippet was checked against abstracts fetched with just fetch-reference. Validated with just validate, validate-terms, count-verified-snippets (61/61), check-entity-refs, check-causal-targets and check-duplicate-keys.

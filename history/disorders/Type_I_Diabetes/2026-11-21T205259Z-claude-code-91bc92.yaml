  summary: Receive rows from the retired umbrella; add HLA class II presentation node
  details: |
    Part of retiring the Diabetes_Mellitus umbrella Disease entry (step 5 of docs/curation-notes/diabetes-mellitus-grouping-refactor.md). Moved in: polyphagia (its source is a paediatric type 1 cohort), the immune checkpoint inhibitor exposure (retargeted from the umbrella's chronic hyperglycaemia node to this entry's Hyperglycemia node), two polyuria differentials, and the type 1 share-of-diabetes prevalence row. The HLA-DQA1/DQB1 rows moved in the previous PR landed on the Genetic Susceptibility node, which has no molecular function and also carries INS; a new HLA Class II Autoantigen Presentation node now carries the two HLA genes with peptide antigen binding (GO:0042605), evidenced by PMID:22184118, and they were removed from the susceptibility node.

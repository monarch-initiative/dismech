  summary: Link viral infection and early diet, carrying the refuting trial result
  details: |
    Backfill for issue #8085. Both exposures point at the environmental triggers node, which names viral infection and early dietary factors in its own text, and they are graded far apart. Viral infection is TRIGGERS with DIRECT. This entry holds nine evidence items for it, and the two carried on the link are the two that do different work: one takes the virus as far as the beta cell, stating that viruses can infect pancreatic beta cells with effects ranging from functional damage to cell death, and the other names congenital rubella as the only infection clearly associated with the disease. The word clearly is doing real work there, since most of this entry's viral evidence is explicitly candidate-level and that item is not. Early dietary factors is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and every item PARTIAL or lower. The refuting item is carried on the link deliberately rather than left in the exposure block: the TRIGR trial removed intact cow's milk protein from infant feeding, measured type 1 diabetes itself, and found no reduction in cumulative incidence over a median of 11.5 years. An earlier version of this link carried a different negative trial summary instead, whose endpoint was celiac disease rather than this disease; its explanation dropped the celiac qualifier that the pre-existing exposure-block item had kept, and the link description then promoted it as the strongest evidence here. That was a claim-evidence mismatch made worse by being moved to the more visible position, and the item was removed rather than reworded. PMID:29297078 was fetched and verified for the replacement. Keeping it on the link means the contrary result travels with the claim rather than sitting where a reader of the pathograph would never meet it, the same disposition used for the refuting acne item in PR #8182. Twelve evidence items across the two exposures carry no evidence_source in the exposure block and still do; only the copies placed on the new links are tagged, since this change is otherwise insertions-only and retagging the originals was left out of scope. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 135 of 135 verified.

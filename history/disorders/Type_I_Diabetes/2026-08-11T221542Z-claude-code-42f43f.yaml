  summary: Link viral infection and early diet, carrying the refuting trial result
  details: |
    Backfill for issue #8085. Both exposures point at the environmental triggers node, which names viral infection and early dietary factors in its own text, and they are graded far apart. Viral infection is TRIGGERS with DIRECT. This entry holds nine evidence items for it, and the two carried on the link are the two that do different work: one takes the virus as far as the beta cell, stating that viruses can infect pancreatic beta cells with effects ranging from functional damage to cell death, and the other names congenital rubella as the only infection clearly associated with the disease. The word clearly is doing real work there, since most of this entry's viral evidence is explicitly candidate-level and that item is not. Early dietary factors is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and every item PARTIAL or lower. The refuting item is carried on the link deliberately rather than left in the exposure block: two large randomised trials found that breastfeeding and the timing of gluten introduction do not influence risk, which is the strongest design in this entry's dietary evidence and it argues against the claim. Keeping it on the link means the contrary result travels with the claim rather than sitting where a reader of the pathograph would never meet it, the same disposition used for the refuting acne item in PR #8182. Twelve evidence items across the two exposures carried no evidence_source; those cited here are now tagged explicitly rather than defaulting to HUMAN_CLINICAL. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 135 of 135 verified.

  summary: 'Review: duplicate complication phenotypes, unsupported frequency bands'
  details: |
    Correctness review. (1) Removed three exact-duplicate phenotypes. Retinopathy/Neuropathy/Nephropathy duplicated Diabetic Retinopathy (HP:0000488), Diabetic Neuropathy (HP:0009830) and Diabetic Nephropathy (HP:0000112) - same HPO term, no evidence, and CONTRADICTORY frequency (FREQUENT vs OCCASIONAL on the evidenced twin). Kept the evidenced entries and repointed the three 'Chronic Complications' causal edges at them so no edge was orphaned. (2) Removed frequency: OCCASIONAL from all three retained complications. Every citation attached to them is graded NO_EVIDENCE or PARTIAL with an explanation stating the source does not establish frequency, so the band had no support; project guidance is to omit frequency rather than justify it post hoc. (3) Regraded PMID:38272591 on Diabetic Retinopathy from NO_EVIDENCE to SUPPORT - its snippet directly names retinopathy as a microvascular complication of type 1 diabetes, which IS the phenotype claim; it had been marked NO_EVIDENCE only because it does not quantify frequency, conflating the association claim with the frequency claim. (4) Noted that Cardiovascular Disease is bound to a root-level HPO term (HP:0001626) with no evidence and needs refinement.

  details: |
    Backfilled the evidence_source field on all 124 evidence items in Type_I_Diabetes.yaml that were missing it (out of 140 total; 16 were already tagged). This is the last remaining item of Section 1 (bulk evidence_source retag) from issue #6980 -- Addisons_Disease (#8720) and Graves_Disease (#8844, open) were completed in prior sessions. Method: all 113 unique cited PMIDs were already cached in references_cache/. For each evidence item, checked the cached title/abstract plus the exact quoted snippet for animal-model, in-vitro, or computational language rather than blanket-tagging as HUMAN_CLINICAL. 118 items are genuinely HUMAN_CLINICAL (mostly narrative clinical/genetic/epidemiological reviews and cohort studies). 1 item (PMID:17691946, environmental[0].evidence[7]) is tagged MODEL_ORGANISM: its snippet explicitly reads 'evidence from various animal models suggests that viruses can indeed initiate or accelerate autoimmune diseases'. 5 items are tagged OTHER because their snippets explicitly mix human and animal evidence in a single sentence, matching a pattern -- and reusing the same evidence_source value -- already established elsewhere in this file for the identical PMID+snippet: PMID:8741809, PMID:20640941, PMID:23393684, PMID:11334504, plus a newly-identified fifth instance PMID:6749365 whose snippet reads 'epidemiological and clinical studies of diabetes in man and ... studies of experimental diabetes in animals'. Where a PMID already carried an established evidence_source elsewhere in this same file, reused that exact value for consistency rather than re-deriving it. Edited via a ruamel.yaml round-trip script (not a full PyYAML dump) so only evidence_source lines were inserted -- diff is a clean +124/-0 with no incidental reformatting. Validated with just validate (schema+terms+references all pass; only a pre-existing unrelated EGA dataset WARN), just count-verified-snippets (137/137 verified), just check-duplicate-keys, just check-term-cache-integrity, just check-reference-cache-frontmatter, and the Type_I_Diabetes-scoped pytest suite (16/16 passed). Issue #6980 should stay open: Sections 2 and 3 (citation gaps and modelling judgment calls) are untouched by this change.

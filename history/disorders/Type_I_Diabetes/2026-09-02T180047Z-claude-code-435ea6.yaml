  summary: Integrate assessed OpenScientist viral-interferon findings
  details: |
    Assessed kb/hypotheses/Type_I_Diabetes/viral_interferon_beta_cell_autoimmunity_model/openscientist.md (verdict PARTIALLY_SUPPORTED; sidecar openscientist-assessment-by-claude-opus-5.yaml) and integrated its RETAINED and QUALIFIED claims. Added: a new pathophysiology node 'Persistent Low-Grade Islet Enteroviral Infection' (PMID:34390364, PMID:40090995) with an Environmental Triggers edge into it (PMID:39314969) and an INDIRECT edge from it to Interferon-Driven Beta Cell Response (PMID:40090995); four evidence items on Interferon-Driven Beta Cell Response covering durable MHC class I overexpression (PMID:29305625), IFN-induced PD-L1 and HLA-E checkpoint ligands as a protective arm (PMID:32444635), iatrogenic interferon-alpha as human causal evidence (PMID:25574096), and IFNAR1-deficient rats (PMID:27999109, curated as delay-and-reduction rather than the report's 'prevents'); a REFUTE item on the interferon-to-destruction edge recording CXCL10-CXCR3 functional redundancy (PMID:23434930); three interventional and epidemiological items on the hypothesis entry (PMID:37390839 meta-analysis, PMID:37789144 antiviral phase 2, PMID:38055252 baricitinib phase 2); first evidence for the previously empty TYK2 (PMID:26239055) and IFIH1 (PMID:35867130 SUPPORT and REFUTE, PMID:39373578) gene entries; and a KNOWLEDGE_GAP discussion on what determines the destructive-versus-protective interferon balance (PMID:29937434). Deliberately not integrated: the report's claim of a timed ISG to CXCL10 to MHC class I sequence in rat islets, which misreads a co-expressed signature (QUALIFIED); its OR 11.60 for the IFIH1 risk allele, which belongs to a different comparison in the same paper and was replaced with the correct OR 3.07 (REJECTED); its interferon-alpha to PD-L1 edge citation, which is a mouse interferon-gamma study (REJECTED). Status left at EMERGING per the report's own recommendation. Verified with count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and validate-hypothesis-assessment.

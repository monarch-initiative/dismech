  summary: Split root-level Cardiovascular Disease phenotype into Coronary Artery
    Disease and Stroke
  details: |
    Replaced the HP:0001626 (Abnormality of the cardiovascular system) root-level, unevidenced Cardiovascular Disease phenotype flagged in #6980 section 3 with two specific, evidenced macrovascular endpoints: Coronary Artery Disease (HP:0001677) and Stroke (HP:0001297), both cited to PMID:16567818 (Soedamah-Muthu et al. 2006, UK GPRD cohort of 7,479 T1D subjects vs 38,116 matched controls), which reports separate hazard ratios for acute coronary events/revascularization and for stroke. Updated the Chronic Complications pathophysiology node's downstream targets to match the new phenotype names. Left frequency unset per the frequency-evidence SOP since the source reports relative hazard ratios, not a prevalence/incidence band. Section 1 (bulk evidence_source retag) and the remaining section 3 items (PCOS duplicate-node question -- appears already resolved by a later atomization commit; Pseudohypoparathyroidism hypothesis_groups gap -- appears already addressed via the edge's existing description; MEN2/CAH Falcon references pruning -- still open) are left for separate follow-up passes.

  summary: Move Hyperglycemia assay values to biochemical readouts
  details: |
    The Hyperglycemia pathophysiology node carried an assays list with two results, Elevated Blood Glucose and Elevated Hemoglobin A1c (HbA1c), copied from the assays slot's schema example. Those are findings, not assays, and they duplicated the entry's existing Blood Glucose and Hemoglobin A1c (HbA1c) biochemical markers. Removed the node's assays and added a readouts link on each marker targeting Hyperglycemia (READOUT_OF, POSITIVE, MONITORING), each with an exact-quote evidence item reusing a reference the entry already cites with the same evidence_source: PMID:32256447 for self-monitoring of blood glucose and PMID:37921158 for HbA1c as an indicator of chronic hyperglycemia. Dropped the word 'assays' from three NO_EVIDENCE explanations on the node that described the removed list. LOINC codes for the two markers were not added; where they belong is left open on the issue. Validated with just validate (schema, terms, 164 snippets, 167 titles) and the whole-repo KB gates.

  summary: Bind HLA-DQ haplotype genes and type genetic records
  details: |
    The HLA-DQ2 and HLA-DQ8 genetic records had no gene binding. Each now records its haplotype as an affected region overlapping HLA-DQA1 (hgnc:4942) and HLA-DQB1 (hgnc:4944), typed RISK_FACTOR and GERMLINE, with a PMID:31331105 snippet giving the DQ2.5 and DQ8 allele composition. The Genetic Susceptibility node's unbound HLA-DQ2/HLA-DQ8 gene descriptors were replaced with bound HLA-DQA1 and HLA-DQB1. All other single-gene records were typed SUSCEPTIBILITY and GERMLINE. Gene bindings were checked against their symbols with list-gene-term-mismatches, which found no mismatches.

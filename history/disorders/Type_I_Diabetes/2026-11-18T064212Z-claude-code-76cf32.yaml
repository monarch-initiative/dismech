  summary: Receive LADA, SAID and type 1 rows from the Diabetes_Mellitus umbrella
  details: |
    Part of finishing the diabetes mellitus grouping refactor (step 4 of docs/curation-notes/diabetes-mellitus-grouping-refactor.md): type-specific content left on the Diabetes_Mellitus umbrella entry was moved to, or deduplicated against, the per-type entries. Rows were moved as unchanged YAML blocks with their evidence; only umbrella subtype scoping was dropped and one model target was renamed to the destination node. Added: has_subtypes LADA (MONDO:0850306) and SAID (with its THRESHOLD derivation); HGNC-bound HLA-DQA1 and HLA-DQB1 records beside the existing DQ2/DQ8 haplotype rows; the teplizumab prevention trial NCT01030861; the UVA/Padova simulator, its modeled_mechanisms target changed from the umbrella's Chronic Hyperglycemia node to this entry's Hyperglycemia node, which conforms to the same module node; the Presymptomatic autoimmunity progression stage. The HLA records are not yet wired to the Genetic Susceptibility node.

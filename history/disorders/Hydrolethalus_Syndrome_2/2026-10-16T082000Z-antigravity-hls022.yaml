  summary: Enhance Hydrolethalus Syndrome 2 with expanded KIF7-GLI3 ciliopathy causal graph, progression
    timeline, granular HPO phenotypes, variant-level genetics, differential diagnosis bindings, and evidence-backed
    treatments.
  details: Bound Autosomal Recessive inheritance to HP:0000007 with primary pedigree evidence (PMID:21552264,
    PMID:27081521); removed deprecated percentage from prevalence and added primary case evidence (PMID:21552264,
    PMID:27081521); added Fetal onset (in utero) and Perinatal lethality (perinatal) progression blocks;
    enriched KIF7 Cilium-Tip Dysfunction with hgnc:30497, CL:0000064, GO:0008017 (microtubule binding),
    and PMID:34705483 evidence; added Impaired GLI3 Repressor Processing and Deregulated GLI Target Expression
    and Aberrant Anterior-Posterior Limb Bud Patterning mechanisms; added Exencephaly, Anencephaly, Ventriculomegaly,
    Postaxial Hand Polydactyly, Preaxial Foot Polydactyly, and Micrognathia phenotypes with 100% downstream
    pathograph connectivity and explicit distinction between genotyped KIF7 family 1 findings and classic
    HLS clinical features; added KIF7 c.2896_2897del (p.Ala966Profs*81) variant details capturing its
    full phenotypic spectrum across lethal HLS2, liveborn ACLS, and mild corpus callosum dysgenesis; added
    MONDO:0008708 and Joubert Syndrome (MONDO:0018772) to differential_diagnoses; and added action_category,
    target_phenotypes, and evidence to treatments.

  details: |
    New entry for NUP93-related SRNS (MONDO:0014817), claimed in #14663. Built from the primary literature fetched directly: Braun 2016 founding report (PMID:26878725, full text), the 2026 podocyte Nup93 knockout mouse (PMID:41563289), the UK NephroS cohort and fly model (PMID:35211795), case reports, the 2025 nucleoporin-SRNS review (PMID:39331077), the ClinGen Definitive assertion, and the GeneReviews genetic SRNS overview. Deep research: falcon was requested but Edison auth returned 403, so the run used --fallback and openscientist produced the report (research/Nephrotic_Syndrome_Type_12-deep-research-openscientist.md). Its term-validation step hit a network reset; validate-research-reference and validate-research-terms were re-run afterwards (15/15 references resolved, 8/8 quotes found, 0 off topic; mislabelled-term rows were table headers). preflight-dr passed (NUP93 83 mentions). From the report I added PMID:39814977, PMID:34031708, and the CDC42 (PMID:40298220) and YAP/TAZ (PMID:37565816) findings as indirect evidence, since they concern other nucleoporins. A fresh-context subagent review found misattributed treatment responses (Table 1 assigns the steroid response to NUP205 and one CsA response to XPO5), wrong cohort counts, wrong p.Gly591Val zygosity, and a VUS behind the second post-transplant recurrence; all were checked against the cached text and fixed. Validated with just validate (96/96 snippets), check-entity-refs and check-genereviews.

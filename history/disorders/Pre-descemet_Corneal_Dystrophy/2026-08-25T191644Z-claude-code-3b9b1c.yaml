  summary: 'Create: Pre-Descemet Corneal Dystrophy (MONDO:0017392)'
  details: |
    De-novo creation of the Pre-Descemet Corneal Dystrophy entry for MONDO:0017392 (claim issue #9439).

    ENTRY TYPE DECISION: DISORDER (standalone kb/disorders/ Disease), NOT a has_subtypes entry on the
    existing Stromal_Corneal_Dystrophy umbrella. MONDO:0017392 is a leaf under MONDO:0020213 and
    dismech already has a Stromal_Corneal_Dystrophy entry with six subtypes, so folding it in was the
    obvious move and was rejected on mechanism: that umbrella's pathograph is progressive deposition
    of abnormal material in the EXTRACELLULAR matrix causing loss of transparency and visual
    impairment, whereas PDCD's material is intracellular in enlarged posterior keratocytes, electron
    microscopy reports no extracellular deposits at all, and vision is spared. Linked to the umbrella
    via parents: instead. Rationale recorded in the entry notes.

    NEC PREFLIGHT: SKIP -- MONDO records no causal gene (RO:0004003) for MONDO:0017392, so the
    automated gene-identity check could not discriminate. Manual fallback per CLAUDE.md:
    - Gene check: the report's top genes were PRDX3=27 and STS=23. PRDX3 is the gene of PPPCD
      (punctiform and polychromatic pre-Descemet corneal dystrophy), which IC3D edition 3 states can
      be distinguished phenotypically from PDCD and which MONDO holds as a SEPARATE term
      (MONDO:0859248, not a descendant of MONDO:0020213). The report therefore mixes two entities.
    - OMIM check: MONDO:0017392 has no OMIM xref, and IC3D independently records "MIM: PDCD-None"
      against "PPPCD-#619871". Consistent, and confirms the two are distinct concepts.
    - Synonym check: no synonym of MONDO:0017392 belongs to another MONDO entity.
    Verdict: not a wrong-entity report, but a two-entity report. Nothing about PRDX3 or PPPCD was
    curated from it; PPPCD is instead recorded under differential_diagnoses with its distinguishing
    features, and the notes state the exclusion explicitly.

    THE IC3D FULL TEXT CHANGED THE FRAMING MID-CURATION. The first draft treated PDCD as a
    dystrophy with an XLI-associated subtype. Reading the cached IC3D edition 3 full text
    (PMID:38359414, full_text_xml) forced a rewrite, because IC3D states three things that draft
    missed: (a) isolated PDCD is category 4, "neither a well-defined entity nor ... clearly a
    hereditary or degenerative disorder", with locus and gene "Unknown" and no MIM number;
    (b) its ultrastructure is membrane-bound vacuoles with secondary-lysosome-like electron-dense
    material and lipofuscin-like lipoprotein, "consistent with a degenerative process", with NO
    extracellular deposits; and (c) of the XLI deposits, "This is a systemic disease with corneal
    manifestations and therefore is not a corneal dystrophy" -- an explicit refusal of the label
    that every primary case series cited here applies. The entry now curates that disagreement
    rather than picking a side: the XLI subtype is named "XLI-Associated Deep Corneal Deposits",
    carries two REFUTE-tagged IC3D evidence items against its own inclusion, and has a dedicated
    KNOWLEDGE_GAP discussion (pdcd_entity_boundary_xli).

    WHAT WAS CURATED. 6 pathophysiology nodes (2 MOLECULAR trigger roots -- one per arm -- converging
    on a shared keratocyte-deposition node; every non-root reachable on a directed walk; scales
    MOLECULAR 3 / CELLULAR 1 / TISSUE 1 / ORGANISM 1), 4 phenotypes, 2 subtypes, 1 inheritance block,
    1 genetic block (STS, CAUSATIVE, GERMLINE, scoped to the XLI arm), 3 histopathology findings,
    1 imaging finding, 3 differential diagnoses, 2 progression records, 3 diagnoses, 1 prevalence,
    3 discussions (all KNOWLEDGE_GAP). 68 evidence snippets across 7 PMIDs.

    JUDGEMENT CALLS.
    - "Glare" phenotype is deliberately left UNBOUND (preferred_term only, no term:). HPO has no glare
      term; the nearest, Photophobia HP:0000613, is defined as light sensitivity with discomfort or
      pain, which is a different complaint from light scatter degrading image quality. The search is
      recorded in the phenotype's notes. No term beats a bad one.
    - frequency: omitted everywhere. The glare observation is one adult in one pedigree, below the
      resolution of any FrequencyEnum band; the other phenotypes have no reported proportions.
    - The prevalence record is the prevalence of X-linked ichthyosis (1/6,000-1/2,000 males),
      recorded explicitly as a CEILING on the XLI-associated subtype rather than a measurement of
      PDCD, tagged supports: PARTIAL, with the reason in notes. PDCD's own prevalence is undocumented.
    - Cholesterol sulfate is curated PROVISIONAL, not established. It is measured in stratum corneum
      only; no corneal metabolomics exists; and the material actually characterised in isolated PDCD
      is a lipofuscin-like lipoprotein, a competing identity. That competition is the substance of
      the pdcd_deposit_identity discussion.
    - A REFUTE evidence item is attached to the In Vivo Confocal Microscopy diagnosis entry
      (PMID:32482962, "In vivo confocal microscopy findings were unremarkable" in a genetically
      confirmed case) so the diagnostic claim is not overstated.
    - Two conflicting observations about extracellular deposit are BOTH recorded on the deposition
      node (in vivo confocal sees diffuse extracellular deposits; TEM reports none) rather than
      reconciled, with the IC3D "Histopathologic studies of PDCD are not consistent" caveat as a
      standalone histopathology finding.
    - NO datasets: block. just discover-datasets returned 12 candidates, all GENE_ONLY, all matched on
      the string "STS" meaning soft tissue sarcoma or an STS-named cell line (H-STS, STS-109). None
      concerned cornea, ichthyosis or sulfatase. Textbook Named Entity Confusion via dataset search;
      the rejection is recorded in the notes.
    - NO treatments: block. IC3D lists PDCD among the dystrophies that are typically asymptomatic and
      do not require treatment; that fact is carried by evidence on the Visually Silent Corneal
      Finding node rather than by inventing an intervention.


  details: |
    Review response for PR #9489 (Pre-Descemet Corneal Dystrophy). Both IMPORTANT findings fixed and
    three of four SUGGESTIONS taken; the fourth is declined with a recorded reason.

    IMPORTANT 1 - evidence_source consistency. Four PMID:38359414 snippets carried OTHER in
    has_subtypes and HUMAN_CLINICAL elsewhere. Rather than fix only the four the reviewer listed, I
    wrote a checker that walks the whole document, normalises every snippet's whitespace, and reports
    any (reference, snippet) pair carrying more than one evidence_source. It found the four plus two
    more of the same kind. All were resolved on the rule the reviewer proposed and extended
    consistently: classification and nomenclature judgements by the IC3D committee -> OTHER (the
    category-4 status statement, the "not a corneal dystrophy" statement, the "similar deep corneal
    deposits" statement, the PPPCD category-1 statement, the "distinguished phenotypically" statement,
    the evidence-tier definition, and the "historically described as having several subgroups"
    statement); factual observations about patients -> HUMAN_CLINICAL (the two age-of-onset statements
    and the two-to-four-generation familial clustering statement). The checker now reports zero
    inconsistent pairs.

    IMPORTANT 2 - the Glare phenotype's stale VERY_RARE clause is deleted. The notes already
    explained that frequency was deliberately omitted; the explanation text contradicting it is gone.

    SUGGESTION 1 taken - the first Cholesterol Sulfate Accumulation evidence item moved from SUPPORT
    to PARTIAL, and its explanation now states that the measurement is in stratum corneum, not cornea.
    The support level now carries the tissue mismatch instead of leaving it to prose.

    SUGGESTION 2 taken - a notes block on the Abnormal Posterior Corneal Stroma phenotype explains why
    both HP:0011492 and its descendant HP:0007856 are carried: they record different observations at
    different resolutions (slit lamp vs confocal), HPO has no keratocyte-inclusion term, and the
    binding should move if one is ever added.

    SUGGESTION 3 taken, and upgraded. The reviewer called the canine phenocopy "genuinely optional"
    because the DR report gave no identifier. An independent PubMed search recovered it -
    PMID:35346188, BMC Vet Res 2022 - and the abstract turned out to support a properly hedged model
    entry after all: "With IVCM, hyperreflective deposits were identified within keratocytes and the
    number of enlarged keratocytes containing hyperreflective deposits increased towards the posterior
    stroma" and "most consistent with a posterior stromal dystrophy reminiscent of pre-Descemet
    corneal dystrophy described in humans". Curated as an animal_models entry with
    PARTIALLY_RECAPITULATES, fidelity LOW, one readout, and a limitations block stating that there is
    no genotype, no orthologous mutation, no demonstration the stored material is the same, and that
    the value of the observation is only that the cellular pattern recurs in a second species.

    SUGGESTION 4 declined, with the reason recorded in the entry notes rather than left implicit.
    Genetic counselling for the X-linked arm is obviously appropriate clinically, but none of the
    eight cached references contains a quotable statement about it. The closest is PMID:23807007's
    remark on the clinical utility of copy-number analysis, which is about diagnosis and is already
    curated under diagnosis:. Adding a counselling treatment because it is obviously true is precisely
    the fabrication the evidence SOP forbids. The notes now say so and name what source would close
    the gap.


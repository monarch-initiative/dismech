  summary: 'Create: TNFRSF9-Related Immunodeficiency'
  details: |
    New entry for immunodeficiency 109 with lymphoproliferation (MONDO:0859526, OMIM:620282), named with the gene-dyad label of its MONDO parent MONDO:0700308, which is recorded as an exactMatch because MONDO:0859526 is that class's only descendant. Both stubs (Immunodeficiency_109_With_Lymphoproliferation and TNFRSF9-related_Immunodeficiency) are resolved by this entry. One Perplexity deep-research report was run and used as leads only; preflight-dr returned SKIP because MONDO:0859526 records no RO:0004003 gene, and a manual check confirmed the report is about TNFRSF9 and cites OMIM:620282. The report attributed the mitochondrial findings to Somekh et al. (PMID:31501153); they are from Alosaimi et al. (PMID:30872117) and are cited there. Evidence comes from the primary case reports (PMID:30872117, 31501153, 31537641, 33259966, 37144041, 40843003, 41315311), the 14-patient review PMID:42144872, the ClinGen Definitive curation, ORPHA:664726, IUIS 2022 (PMID:35748970) and the Tnfrsf9 knockout mouse (PMID:12023342). Autoimmune cytopenia is left unconnected in the pathograph because no source studies its mechanism. Validated with just validate, count-verified-snippets (64/64) and validate-terms.

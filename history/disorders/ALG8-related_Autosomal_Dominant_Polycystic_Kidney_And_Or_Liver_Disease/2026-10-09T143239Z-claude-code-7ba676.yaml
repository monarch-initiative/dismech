  summary: Review openscientist deep-research report (research synthesis YAML)
  details: |
    Structured review of the openscientist deep-research report, written as research/ALG8-related_Autosomal_Dominant_Polycystic_Kidney_And_Or_Liver_Disease-research-synthesis.yaml in the research_synthesis schema. It records the falcon (402) and openai (401) runs as FAILED, the preflight PASS, three identifier defects and thirteen findings with the report's stance on each.

    The review found three defects beyond the two noted in the CREATE record. HGNC:23159, given for ALG8, is ALG2 (ALG8 is hgnc:23161), checked against the local HGNC build and the HGNC REST API. HP:0001399, given for hepatic cysts, is Hepatic failure (hepatic cysts is HP:0001407). UBERON:0001174, given for intrahepatic bile duct, is common bile duct (intrahepatic is UBERON:0003704). The report's term validation missed both mislabels because it checked existence only. The third-glucose claim was confirmed wrong against the GO:0042283 definition and UniProt Q9BVK2: ALG8 converts Glc1 to Glc2, and the third glucose is the ALG10 step. The report's liver-predominant framing is graded PARTIAL because its own genotype-first quote shows kidney but not liver cysts enriched.

    All 11 passages the report presents as quotes were found verbatim (after normalization) in the cached text of the attributed papers. No change to the KB entry was needed: it already binds hgnc:23161, HP:0001407 and GO:0042283, and binds no bile-duct anatomy term. Validated with the test_research_synthesis_file pytest case (schema, provider foreign keys, verbatim best_matching_text).

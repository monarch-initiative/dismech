  summary: 'Create: ALG8-related Autosomal Dominant Polycystic Kidney And/Or Liver
    Disease'
  details: |
    New gene-defined entry for MONDO:1060122 (monoallelic ALG8 kidney and/or liver cyst disease), curated as a standalone entry on the Polycystic_Kidney_Disease_3 (GANAB) precedent; the matching stub was deleted. Duplicate preflight: no kb entry for MONDO:1060122 on origin/main, no issue, and the only open PR touching ALG8 (dismech#13279) adds ADPKD subtype rows for other genes.

    Deep research: falcon was requested and returned 402 (account out of credits); the run was repeated with --fallback, which skipped openai (invalid key) and fell back to openscientist. The entry content was sourced directly from primary literature read in full text from references_cache: the multicenter clinical and biobank cohort (PMID:39899384), the discovery and Alg8-null cell mechanism paper (PMID:28375157), the Geisinger genotype-first cohort (PMID:36574950), the ADPLD cohort with liver immunostaining (PMID:37628703), the Prkcsh/Sec63 polycystin-1 dosage mouse work (PMID:21685914), the gnomAD ADPLD-gene frequency study (PMID:42804492), and the ClinGen CGGV and Orphanet ORPHA:2924 rows.

    The openscientist report (research/ALG8-related_Autosomal_Dominant_Polycystic_Kidney_And_Or_Liver_Disease-deep-research-openscientist.md) is committed with its artifacts. Its reference validation resolved 18/18 identifiers and just preflight-dr returned PASS (ALG8 named 65 times). It agreed with the entry and added one usable lead, the somatostatin-analogue pooled analysis (PMID:23665274), added as an INDIRECT treatment because the trials did not identify ALG8 carriers. Two report claims were not used because they are wrong: it says ALG8 adds the third glucose (the primary source and GO:0042283 say the second), and it gives ALG8 as HGNC:23159 (it is hgnc:23161).

    Decisions: ClinGen's Definitive tier is for ADPKD (MONDO:0004691), not this MONDO term, so it is cited as evidence but not copied into gene_disease_validity. The ADPKD GeneReviews chapter names ALG8 only in its differential-diagnosis table; it is tagged but its PKD1-based clinical picture was not imported. Hypertension has no causal in-edge because the Geisinger cohort did not find it enriched. Liver cysts carry a REFUTE item from the genotype-first cohort, and decreased GFR a REFUTE item for CKD in unselected populations. A recalled Fedeles 2011 PMID resolved to an unrelated paper and was discarded; the correct PMID was found by PubMed search.

    Validation: schema validation, count-verified-snippets 56/56, validate-terms passed, check-genereviews TAGGED, and check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all OK.

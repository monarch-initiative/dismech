  summary: 'Gene-family review: MTTP'
  details: |
    Replaced the generic lipid transfer activity on the MTTP loss-of-function node with the two activities vertebrate MTP carries, triglyceride transfer and phospholipid transfer, both decreased (PMID:18460919), and added the study showing MTP activity is absent in abetalipoproteinemia (PMID:1439810). Moved the gene from the single-valued gene slot to the standard genes list used by every other node. The causative record (biallelic, autosomal recessive, germline) was reviewed and left unchanged; ClinGen has not classified MTTP.

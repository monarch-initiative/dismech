  details: |
    Integrated the RETAINED and QUALIFIED claims of the codex assessment of the OpenScientist report for hypothesis canonical_mttp_lipoprotein_assembly_model. Added PMID:8111381 to the biallelic MTTP variant block (the MTTP cloning study that identified a homozygous splice-disrupting variant in affected siblings, the human-genetics half of the RETAINED canonical-mttp-core claim, previously uncited here). Added two MODEL_ORGANISM items to Hepatic Triglyceride Retention for the RETAINED hepatic-triglyceride-retention claim: PMID:24511105 (hepatic triglyceride rises with both liver-specific Mttp knockout and pharmacological MTP inhibition in mice) and PMID:22121032 (re-expressing MTP in liver-specific MTP-deficient mice reverses hepatosteatosis, a rescue result). Added PMID:38710625 to the Familial hypobetalipoproteinemia 1 differential for the RETAINED apob-phenocopy-differential claim, sourcing the first-degree-relative lipid discriminator already asserted in distinguishing_features. Added a new discussions block with three KNOWLEDGE_GAP entries, each with a proposed experiment and cited evidence, for the QUALIFIED claims the assessment asked be kept as leads rather than curated causal edges: the acanthocyte membrane mechanism (PMID:15142658), retinal tissue-autonomous MTP loss (PMID:15654125), and the residual-activity genotype-to-phenotype question (PMID:30875496). Deliberately not integrated: the report's registry-absence gap and its lomitapide phenocopy and postprandial-study claims, all REJECTED by the assessment; its three ontology leads (GO:0006497, obsolete GO:0030433, CL:0000127 mislabelled as cerebellar astrocyte), also REJECTED; the two-step-assembly and vitamin-E-mediation qualifications, because the entry's existing prose already avoids the overstatement the assessment flagged; and the single-case oligogenic (PMID:29540175), cross-species microbiome (PMID:31004524), and HCV core (PMID:11818366) leads, which the assessment graded too weak or too indirect for this MTTP-restricted entry. No assessment sidecar was written: openscientist-assessment-by-codex.yaml already exists for this hypothesis.

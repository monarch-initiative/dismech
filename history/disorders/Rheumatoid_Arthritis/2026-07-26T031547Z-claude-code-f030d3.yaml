  summary: 'Claim-evidence review: remove JIA subtype, sweep NO_EVIDENCE items'
  details: |
    Claim-evidence correctness review. Removed JIA from has_subtypes: it is a distinct disease entity (MONDO:0011429 is not under rheumatoid arthritis, and dismech curates it separately), and all four attached evidence items failed to support the subtype claim, two saying so explicitly. Re-modelled as a differential_diagnoses entry with the two citations that legitimately speak to the RA overlap. Deleted 13 evidence items whose snippet was off-topic (wrong analyte, wrong disease) or empty: HLA shared-epitope and JIA quotes under symmetric polyarthritis; two empty snippets and a polymyalgia-rheumatica quote under morning stiffness; a JIA quote under rheumatoid factor; a homocysteine/ADA/MDA quote under ESR; a substance-P quote under CRP; a JIA quote under HLA-DRB1; a nano-drug review and a major-depressive-disorder paper under NSAIDs; an elderly-onset-RA quote and a prevalence quote under progression. Reclassified six further items from NO_EVIDENCE or unqualified SUPPORT to PARTIAL with honest explanations (fatigue, spondyloarthritis NSAID efficacy, NSAID GI toxicity, ESR-DVT, psoriatic-arthritis anti-CCP). Replaced a boilerplate morning-stiffness snippet with the substantive expert-panel sentence. Merged the duplicate Interstitial pneumonitis phenotype into Interstitial Lung Disease and upgraded its binding from HP:0006530 to the more precise HP:0006515. Qualified the Cervical Spine Instability frequency, which its own evidence (up to 80% cervical involvement) appeared to contradict. Schema, term and snippet validation all pass afterwards.

  summary: 'RA: address review on centrally-mediated pain node'
  details: |
    PR Shepherd fix on top of PR #5396 (branch pain-mechanisms-ra-5200),
    addressing the ai4c-agent CHANGES_REQUESTED review of the new
    "Centrally Mediated Pain and Central Sensitization" pathophysiology node.

    1. Removed the unsupported "pain catastrophizing" claim from the node
       description. The term does not appear in the cited preprint
       PPR:PPR1260392, which measures psychological distress via PHQ-ADS
       (a depression/anxiety instrument), not catastrophizing.
    2. Resolved the sole-preprint-reliance concern from issue #5200 by adding
       two peer-reviewed corroborating references: PMID:22035625 (Meeus 2012,
       systematic literature review of central sensitization in RA) and
       PMID:38757102 (Mesci 2024, clinical study of 60 RA patients). NOTE: the
       reviewer-suggested PMIDs 28386917 and 28011459 were independently checked
       and found to be incorrect (28386917 is a heart-failure registry paper;
       28011459 does not resolve), so they were NOT used. Both added references
       were fetched via `just fetch-reference` and their snippets validated as
       exact substrings of the cached abstracts.
    3. Added cell_types to the node: CL:0005000 (spinal cord interneuron;
       preferred_term "Dorsal horn neuron") and CL:0000129 (microglial cell) —
       the key cells in central pain amplification and glial neuroinflammation.
    4. Added a downstream causal edge from "Inflammatory Cytokine Production" to
       the new central-sensitization node, wiring the previously isolated leaf
       into the causal graph (chronic peripheral inflammation -> central
       sensitization).

    Validation: `just validate`, `just validate-references`, and
    `just validate-terms` all pass on kb/disorders/Rheumatoid_Arthritis.yaml.

  summary: 'Review round 2: separate leukotoxic hypercitrullination from PAD4 NETosis'
  details: |
    Answers the blocking review item on the periodontal arm. The edge from the leukotoxin node to Neutrophil Extracellular Trap Formation no longer routes the release through PAD4-dependent NETosis: the cited study separates the two experimentally (DPI blocks NETosis citrullination but not the leukotoxin route, which is calcium- and PAD-dependent and intracellular, and hypercitrullination is absent from conventional traps). The edge is now INDIRECT_UNKNOWN_INTERMEDIATES, describes convergence on the extruded citrullinated-autoantigen pool rather than one cellular program, and carries a REFUTE item quoting the DPI result. The node notes record the distinction. Also taken from the review suggestions: a protein-arginine deiminase molecular-function binding with modifier GAIN_OF_FUNCTION on the molecular node (GO has no biological-process term for protein citrullination); the known omitted intermediates named on the Mucosal Origins edge; a clause distinguishing the A. actinomycetemcomitans and P. gingivalis arguments in the Mucosal Origins notes; and two proposed_experiments on the knowledge gap, built from the designs its rationale already specified.

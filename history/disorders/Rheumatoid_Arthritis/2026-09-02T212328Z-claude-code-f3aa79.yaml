  summary: Tag pathophysiology scale and record model_scale on the RA-FLS Boolean
    links
  details: |
    Added biological_scale to three pathophysiology nodes (Synovial Hyperplasia TISSUE, Cartilage and Bone Destruction TISSUE, Inflammatory Cytokine Production CELLULAR) and model_scale: CELLULAR to the three RA-FLS Boolean model links. The RA-FLS model is an intracellular signalling network for one cell type with cell-level phenotype outputs, so it observes at CELLULAR scale; two of its three links therefore resolve as a 1-step upward extrapolation onto TISSUE nodes, which is what the previously prose-only limitations on those links were saying. The Inflammatory Cytokine Production link resolves as ALIGNED and is the one link of the three that carries no scale-related limitation. Verified with just model-scale-audit.

  summary: Add typed divergences to the RA-FLS Boolean model links
  details: |
    Seven typed divergences across the three RA-FLS links, converting the prose limitations into itemised claims. Synovial Hyperplasia: BOUNDARY_OMISSION (immune-cell compartment and the growth factors the authors invoke for persistent simulated proliferation) plus SCALE_EXTRAPOLATION. Cartilage and Bone Destruction: PROXY_QUANTITY (Boolean output nodes driven by synoviocyte RANKL/MMP activity, not the bone and cartilage loss the node describes), BOUNDARY_OMISSION (osteoclasts and chondrocytes, the cells that actually resorb), SCALE_EXTRAPOLATION. Inflammatory Cytokine Production, which is ALIGNED on scale and previously carried no limitations at all: TEMPORAL_SCOPE (Boolean on/off says nothing about how much cytokine or over what course) and CALIBRATION_PROVENANCE (CaSQ-inferred rules, which the authors themselves note are not optimal where the map lacks mechanistic detail). All materiality QUALIFYING.

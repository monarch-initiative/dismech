  summary: Link smoking to the autoimmune response and infection to the mucosal node
  details: |
    Backfill for issue #8085. The two exposures are routed to different nodes because their evidence lands in different places. Smoking points at the B cell and plasma cell node, since its sentences distinguish which patients are affected: risk is raised for the seropositive form specifically, the one defined by rheumatoid factor and anti-citrullinated protein antibodies, and this entry puts those autoantibodies on that node. An earlier version targeted the general autoimmune response node and justified it by claiming that node held the antibody response; it does not, its own text being about synovial attack, so the link was retargeted rather than the prose reworded. The intermediates are nonetheless recorded as unknown despite that specificity, because no cited sentence follows smoke to citrullination or to any other step; the association is with the serotype, not with a mechanism. Its two supporting items are graded PARTIAL because they concern extra-articular severity and interstitial lung disease, which are complications further from this node than the serotype is. Infections point at the mucosal origins and dysbiosis node rather than at the autoimmune response, because that is where the cited sentences actually land: they concern microbial taxa at mucosal sites, not antibody production. All three keep the PARTIAL grade this entry already assigned them, and the sentences show why, offering a candidate culprit organism, a doubly hedged more-than-one-line-of-evidence conclusion, and a list of factors including infection. Eight evidence items across the two exposures carry no evidence_source in the exposure block and still do; only the copies placed on the new links are tagged, reviews as OTHER and the primary cohort study as HUMAN_CLINICAL, since this change is otherwise insertions-only. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 158 of 158 verified.

  summary: Add ferroptosis-microbiome axis knowledge gap to RA
  details: |
    Added discussion gap_ra_ferroptosis_microbiome_axis, kind KNOWLEDGE_GAP, status OPEN, attached to pathophysiology#Mucosal Origins and Dysbiosis. The gap asks whether ferroptosis inhibition remodels the gut microbiota via direct rescue of barrier-forming cells, direct immunocyte rescue, or indirect metabolite shifts secondary to a shifted community. Cited PMID:42570764, ferrostatin-1 in collagen-induced arthritis, with two verbatim abstract snippets. Modeled as a KNOWLEDGE_GAP rather than a new pathophysiology node because the source establishes association, not causal direction. PR shepherd follow-up addressing the blocking ai4c-reviewer review: retyped both evidence items from evidence_source OTHER to MODEL_ORGANISM, since PMID:42570764 is a primary in vivo murine CIA experiment using 16S rDNA sequencing and untargeted metabolomics on mouse fecal samples, and per CLAUDE.md evidence_source classifies the cited publication's study type rather than the sentence quoted; added this history record; stated the all-murine evidence base explicitly in the gap rationale; backfilled reference_title; and fixed a subject-verb typo in the first explanation.

  summary: Review CMT4D phenotype evidence, HPO mappings and causal paths
  details: |
    Reviewed all 21 original phenotypes against the Falcon report and source context; retained 28 final phenotypes after adding seven documented findings. Removed three mismatched frequency assignments, corrected scoliosis evidence polarity, replaced fragmentary or misattached evidence, rebound acquired equinovarus, and separated cerebellar, medullary and cord findings. Represented qualified glia-to-axon injury, motor denervation, clinical motor/sensory/auditory consequences, muscle-imbalance deformities, gait/falls and vocal-cord paralysis causing respiratory insufficiency. Used four observational readout links and documented nine remaining clinical attribution gaps plus unresolved visual-pathway etiology. General-CMT biomechanical evidence is explicitly indirect; central and bulbar routes remain unresolved. Preserved prior model evidence and historical authorship; did not import glaucoma or the NDRG1-wild-type relative’s epilepsy/intellectual disability.

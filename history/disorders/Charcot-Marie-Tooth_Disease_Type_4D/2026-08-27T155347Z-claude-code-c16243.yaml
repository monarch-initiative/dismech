  summary: 'Create: Charcot-Marie-Tooth disease type 4D'
  details: |
    De-novo creation of the CMT4D (HMSN-Lom, NDRG1) entry from stubs/.

    Entry-type decision: dedicated Disease entry rather than folding into the
    existing Charcot-Marie-Tooth_Disease_Type_4 parent, which already carries CMT4D
    as a subtype block. MONDO:0011085 records no descendants and a single causal
    gene (NDRG1, RO:0004003), and per-subtype entries alongside a type-level entry
    are established convention here (CMT2JJ and CMT2W alongside CMT2). The parent's
    subtype block and this entry are complementary; the notes: section records the
    boundary.

    Deep research: falcon report generated and NEC-preflighted against MONDO:0011085
    -> PASS (NDRG1 = 50 mentions, next gene NRG1 = 3; report OMIM 601455 matches the
    MONDO xref). Report reference_validation reported 11/12 resolved, 0 unresolved,
    0 off topic. The report was used as a lead source only; every curated PMID was
    independently fetched with just fetch-reference and every snippet checked
    against the cached text. Two leads taken from the report (PMID:9549516 original
    1998 clinical delineation, PMID:15082788 Okuda Ndrg1 knockout) were fetched and
    curated; the report's own caution that phenotype frequencies could not be
    assigned from its evidence was superseded by the 2026 systematic review
    (PMID:42089726), which supplies them directly.

    Pathograph: 9 nodes, 9 edges, single root, every node reachable from the root
    (measured, not asserted). Chain runs biallelic NDRG1 loss of function ->
    Schwann-cell NDRG1 loss -> two parallel arms (vesicular trafficking failure;
    attenuated neuregulin 1/ErbB signalling -> dysregulated myelination transcription
    program) -> myelin breakdown with onion bulbs -> early severe axonal loss ->
    clinical neuropathy. Auditory pathway involvement is reached from the genotype by
    an edge explicitly typed INDIRECT_UNKNOWN_INTERMEDIATES rather than routed
    through the somatic Schwann-cell chain, because the evoked-potential evidence
    implicates the eighth nerve and the central pathways simultaneously and no
    cochlear pathology has been reported. Conformance declared to three
    peripheral_axonal_degeneration nodes.

    Honesty decisions worth recording: the entire neuregulin 1/ErbB and myelination
    transcription arm is mouse-only and is marked PROVISIONAL with MODEL_ORGANISM
    evidence; all three NDRG1-null RODENT models fail to reproduce the early severe
    axonal loss that defines the human disease, curated as FAILS_TO_RECAPITULATE
    links plus a HUMAN_MODEL_MISMATCH discussion rather than glossed. The canine
    model is excluded from that claim - it shows axonal pathology, and what is
    unassessed there is whether the loss is early and disproportionate to the
    demyelination. Scoliosis
    carries a FREQUENT band from the 72-patient literature review together with a
    PARTIAL-tagged contradicting observation from the Bulgarian cohort (1/7) rather
    than averaging them. Bulbar and central-nervous-system phenotypes carry no
    frequency because they rest on single families. No disease-modifying treatment
    exists; the two curated treatments (PEG feeding, non-invasive ventilation) were
    actually performed in reported CMT4D patients rather than extrapolated.

    Validation run in the worktree: just validate -> all validations passed;
    just count-verified-snippets -> 97/97 verified against cached references;
    just validate-terms -> passed. A reference_title audit script confirmed all 14
    cited reference_title values byte-match the title: line in their cache
    frontmatter. just validate-disorders run once before opening the PR.

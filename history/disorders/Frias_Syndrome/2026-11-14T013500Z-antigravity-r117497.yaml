  summary: Address Round 1 PR review feedback on Frias Syndrome
  details: >-
    Mined the remaining Very frequent and Frequent HPO annotations from
    ORPHA:264200 (14q22q23 microdeletion syndrome), adding frequency tiers and
    exact Orphanet table-row snippets across 8 existing phenotypes and adding 18
    missing phenotypes (including Optic nerve aplasia HP:0012521, Hypotonia,
    Diabetes insipidus, Agenesis of corpus callosum, Ventriculomegaly,
    Cryptorchidism, Small scrotum, and recurrent craniofacial and otologic
    anomalies), while recording top-level notes on Orphanet's retirement of
    ORPHA:2055 into ORPHA:264200 and representation of coarse HP:0000864 via
    specific pituitary phenotypes. Re-wired causal edges lacking single-gene
    attribution (Choanal atresia, Gastroesophageal reflux, Abnormal facial
    shape, Micrognathia, Global developmental delay, Abnormal cerebral white
    matter morphology, and newly added deletion-level features) directly to
    14q22-q23 contiguous gene deletion with INDIRECT_UNKNOWN_INTERMEDIATES and
    descriptions, added descriptions and causal_link_type on all remaining BMP4
    and OTX2 downstream edges, added UBERON face and limb locations to the BMP4
    node, removed duplicated molecular_functions from the deletion root node,
    and added genetic notes clarifying contiguous-gene haploinsufficiency scope.

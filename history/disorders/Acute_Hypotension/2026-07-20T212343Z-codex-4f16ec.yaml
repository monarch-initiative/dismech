  summary: 'Comprehensive re-review: Acute Hypotension'
  details: |
    Comprehensively re-reviewed the syndrome boundary, mechanism graph,
    phenotypes, diagnostic framing, and cause-specific treatment evidence.
    Replaced the fragmented, shock-conflating model with a connected graph from
    reduced circulating volume, cardiac output, systemic vascular resistance,
    or obstructed filling/ejection through an acute arterial-pressure fall to
    conditional organ hypoperfusion, cerebral hypoperfusion and syncope, and
    renal stress and acute kidney injury.

    Explicitly separated hypotension from shock and organ hypoperfusion,
    downgraded observational kidney-injury claims, removed the context-specific
    surgical cohort rate from population prevalence, removed monitoring as a
    treatment and the weakly supported anaphylaxis treatment claim, and pruned
    the raw deep-research bibliography block. Restricted fluid and
    norepinephrine treatments to supported hemodynamic contexts and added two
    open knowledge gaps. Added focused reference caches only through
    `just fetch-reference`.

  summary: 'Genetics pass: KRT1 anchor correction and subtype term bindings'
  details: |
    Genetics-gap pass for issue #12265 (series-058), parent 1 of 2.

    Re-nomination mechanism found: over-broad anchor (the dismech#12184 pattern).
    The entry is scoped to the KRT1 allelic series but bound MONDO:0007239
    epidermolytic ichthyosis as its disease_term. That class asserts no causal gene
    and its four direct children span both keratin genes (MONDO:0700249 KRT1,
    MONDO:0958184 KRT10) and both inheritance modes, which is how the KRT10 disease
    reached this entry's checklist. The class is not a superclass of the entry
    either: MONDO:0007808 Curth-Macklin sits under keratinopathic ichthyosis and
    ichthyosis hystrix, and MONDO:0957303 epidermolytic palmoplantar keratoderma 2
    sits under palmoplantar keratoderma, epidermolytic.

    Remedy, following the ANK2_Related_Complex_Neurodevelopmental_Disorder
    precedent: disease_term is now free text with no term, and MONDO:0007239 is
    recorded as skos:broadMatch in mappings.mondo_mappings with the reasoning and
    the searches in mapping_justification. Synonym-inclusive ols:mondo searches for
    KRT1, keratin, keratin 1 and keratinopathy returned no human class denoting the
    gene's allelic series.

    Curated: all four has_subtypes rows gained a bound subtype_term plus a KRT1
    genes descriptor, each bound to the KRT1 member of a MONDO gene series -
    MONDO:0700249, MONDO:0007808, MONDO:0859574, MONDO:0957303. Three rows gained an
    inheritance block with HP:0000006 and its own citation; the Curth-Macklin row
    was left without one because the cited paper's proband was sporadic. KRT1
    (hgnc:6412, read live from rest.genenames.org) is now bound as a genes
    descriptor on the KRT1 Dominant-Negative Mutations pathophysiology node, which
    previously carried none, so the gene reaches the pathograph. The single genetic
    row was renamed to KRT1 dominant-negative allelic series so it no longer
    collides with that node's name in the flat pathograph namespace; it carries no
    subtype foreign key because Genetic.subtype is single-valued and KRT1 causes all
    four subtypes, and the notes record that the reciprocal link is carried by each
    row's genes descriptor instead.

    Correction: the entry attributed V2 tail domain frameshift variants in
    Curth-Macklin to PMID:29689068, whose own result is a de novo KRT10
    three-base-pair deletion. The quoted sentence is that paper's background
    statement, so it now carries quote_role BACKGROUND, the features text says the
    correlation rests on background rather than a primary result, and the claim was
    softened from frameshift to truncating, which is what the source says.

    Declined: MONDO:0958184 epidermolytic hyperkeratosis 2, structurally, as the
    KRT10 sibling of MONDO:0700249. Queued as
    stubs/Epidermolytic_Hyperkeratosis_2.yaml, whose notes also record MONDO:0100303
    as the other uncurated KRT10 concept.

    Validation: schema and term validation pass; 31/31 snippets verified;
    list-gene-term-mismatches-online examined every binding with no finding;
    check-folded-hyphens, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms and check-enum-values all clean.
    GeneReviews has no chapter for this disease in the committed Bookshelf index
    snapshot, which the notes record; the StatPearls chapter is now tagged.
    Orphanet could not be consulted, as no ORPHA cache file covers these concepts.

  summary: 'Create: Aortic Valve Disease 3'
  details: |
    Created the ROBO4 aortic valve disease 3 entry (MONDO:0032783) from the Perplexity deep-research report, the only report used. just preflight-dr returned PASS (ROBO4 mentioned 50 times, OMIM 618496 matches). just check-genereviews --online found no GeneReviews chapter. Nearly all disease-specific content rests on one paper, Gould et al. 2019 (PMID:30455415): two segregating families, a 13/736 rare-variant enrichment, cultured human aortic endothelial cell experiments, one patient's aneurysm histology, and Robo4 knockout, splice knock-in mouse and robo4 zebrafish models. evidence_source is set per item to separate patient, cultured-cell and animal findings. The ClinGen record (CGGV assertion 3531e2eb, Moderate, AD) was cached and recorded verbatim as a gene_disease_validity assertion; relationship_type is left unset because the schema ties CAUSATIVE to Definitive or Strong. Musfee et al. 2020 (PMID:32748548) is cited as REFUTE for the lack of significant ROBO4 burden in a heritable thoracic aortic disease cohort. General BAV diagnosis and surgery recommendations cite the 2022 ACC/AHA aortic guideline (PMID:36322642), whose gene table names ROBO4. A 2026 single-case coarctation report (PMID:41613935) was read and not curated as a phenotype. Atrial septal defect is left without an upstream mechanism node. Validation: just validate passed (51/51 snippets), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-block-scalar-comments clean.

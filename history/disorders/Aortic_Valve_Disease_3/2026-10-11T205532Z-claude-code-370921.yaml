  summary: Bind ROBO4 molecular function for the gene-grounding gate
  details: |
    Bound GO:0038023 signaling receptor activity on the ROBO4 Loss of Function node, without a modifier, citing PMID:18345009 (Jones et al. 2008), whose abstract shows Slit2 activation of Robo4 suppressing VEGF-induced endothelial permeability in vitro. The modifier is omitted on purpose: the discovery paper (PMID:30455415) finds the familial variants spread across the protein and argues against loss of any domain-specific function, so which part of receptor activity the variants reduce is not established; a node-level note says so. The reviewer's optional suggestion to link the knockout mouse to the aortic-wall node was not taken because that paper reports ascending aneurysm in the mouse, not medial remodeling. Validation: validate, validate-terms, 52/52 snippets, snippet grading, title snippets, and check_gene_activity_grounding against origin/main all pass.

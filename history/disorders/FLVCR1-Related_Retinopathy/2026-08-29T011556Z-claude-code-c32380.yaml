  details: |
    # Fixes: FLVCR1-Related Retinopathy with or without Ataxia

    File: `/home/user/dismech/kb/disorders/FLVCR1-Related_Retinopathy.yaml`
    Review: `reviews/FLVCR1-Related_Retinopathy.md` (2 MAJOR + 6 MINOR)

    ## Findings fixed

    ### 1. MAJOR — mouse expression data graded `HUMAN_CLINICAL` (fixed)
    `pathophysiology` → *Tissue-Selective Vulnerability from the FLVCR1 Expression Gradient*,
    PMID:29192808 item:
    - `evidence_source: HUMAN_CLINICAL` → `OTHER` (a discussion-section restatement of the
      Rajadhyaksha mouse qRT-PCR, not a measurement by these authors).
    - `supports: SUPPORT` → `PARTIAL`.
    - `explanation` rewritten: it now states the sentence cites the mouse study already
      cited as the first item on this node, and that no human tissue-expression measurement
      is cited anywhere in the entry. The node no longer reads as having two independent
      supports, one human.
    - Node `description` now says the gradient was measured as Flvcr1 mRNA in wild-type
      mouse tissue with no equivalent human measurement, and that it is "proposed to
      explain" the dual sensory phenotype.

    I kept the item rather than deleting it: retained and reframed, it documents that the
    2018 paper is relaying the mouse gradient — deleting it would have hidden that.

    ### 2. MAJOR — single-patient hypothesis graded `SUPPORT` and named as determinative (fixed)
    - Node renamed *Genotype-Dependent Residual FLVCR1 Function Determines Ataxia
      Penetrance* → **Proposed Residual FLVCR1 Function in Ataxia-Sparing Genotypes**.
      Grepped `kb/`, the file's `downstream`/`attaches_to`/`conforms_to` and history before
      renaming: nothing referenced the old name (the node is only an edge *source*).
      `check_entity_refs.py` passes.
    - Node `description` rewritten to hypothesis strength ("proposed, currently unproven",
      "may permit", "would, on this hypothesis, be sufficient") and now records the actual
      evidence base: one 32-year-old patient plus two previously reported carriers of the
      same variant, no functional assay of residual protein, authors' own caution that deep
      splice-site effects are hard to predict, residual-protein step inferred from the mouse
      null.
    - Evidence regraded `SUPPORT` → `PARTIAL`, explanation rewritten to say the quote is an
      explicit conjecture.
    - Added a second evidence item from the same paper's abstract quoting the authors'
      framing ("We suggest an association ... suggest a hypothesis ... Should this
      association be proven"), so the node's epistemic status is explicit in the data, not
      only in prose. Same `evidence_source: HUMAN_CLINICAL` as the sibling item — no
      grading divergence introduced.
    - `has_subtypes` → *Isolated Retinopathy* `description` rewritten: it now states the
      observed fact (RP without posterior column degeneration in a small number of
      c.1092+5G>A individuals), labels the residual-function explanation as proposed and
      unproven, and notes later ataxia onset/incomplete follow-up as an alternative.
    - Disease `description`: "spared in a minority of patients whose variants retain partial
      function" → "whose variants have been hypothesized to retain partial function".

    ### 3. MINOR — "could cause cellular toxicity" graded SUPPORT (fixed)
    PMID:22483575 item on *Intracellular Heme Accumulation and Toxicity*: `SUPPORT` →
    `PARTIAL`; explanation now says the authors measured export, localization and half-life,
    not intracellular heme or cell death. Node `description` softened ("is inferred to
    accumulate ... and to cause cellular toxicity", with the measured endpoints named).
    Disease `description`: "its intracellular accumulation drives selective degeneration" →
    "is inferred to drive".

    ### 4. MINOR — apoptosis annotated on the posterior-column node with no apoptosis evidence (fixed)
    Removed the `biological_processes: apoptotic process (GO:0006915) modifier: INCREASED`
    block from *Posterior Column Sensory Neuron Degeneration*. No supported replacement term
    was available: `GO:0070997 neuron death` is obsolete in `cache/go/terms.csv` and no other
    degeneration/neuron-death GO term is in the cache or the
    `biologicalprocessterm` enum-membership cache, so per the protocol I removed rather than
    substituted. Node `description` now states that the death mode is uncharacterized and
    that this is why no death-process term is annotated.

    ### 6. MINOR — `VERY_FREQUENT` read off n=1 (fixed)
    - *Night blindness*: `frequency: VERY_FREQUENT` removed, with an inline comment saying
      why (single-patient citation, no frequency source). Per
      `docs/frequency-evidence-guidelines.md`, omitting is preferred to an unsupported band.
    - *Pigmentary retinopathy*: band kept at `VERY_FREQUENT` but made transparent under
      Pattern D of the same guideline — the existing n=1 explanation now says it supports the
      association only, and a second evidence item (PMID:21070897, already in the file and
      already graded `HUMAN_CLINICAL` on the same sentence in `inheritance`, so no grading
      divergence) grounds the band on retinitis pigmentosa being definitional for the
      disorder.

    ### 7. MINOR — species omitted from embryonic-lethality prose (fixed)
    - *Intracellular Heme Accumulation and Toxicity* `description`: "Complete loss of FLVCR1
      function is embryonically lethal" → "Complete loss of Flvcr1 function is embryonically
      lethal in mice".
    - `genetic` → FLVCR1 `notes`: rewritten to attribute the inference — Flvcr1-null mice die
      in mid-gestation, so the 2018 authors infer human disease variants likely retain some
      function.

    ### 8. MINOR — uncited prose in `treatments` notes (fixed)
    *Low Vision Rehabilitation*: notes rewritten to attribute the gene-therapy-target and
    therapeutic-window claims to Yusuf et al. (2018), and the negative "no such therapy has
    reached human trials" is now dated ("As of that report ... the entry does not cite a
    later source, so the current trial status is not established here"). Added an evidence
    item quoting the therapeutic-window sentence verbatim (`PARTIAL`, `HUMAN_CLINICAL`),
    the first evidence block on any treatment in this file.

    ## Intentionally skipped

    ### 5. MINOR — rod node diverges from its module (noted, not changed)
    *Rod Photoreceptor Apoptosis* annotates `GO:0006915` where the module node annotates
    `GO:0051402`, and adds `CL:0000573` retinal cone cell which neither the module nor any
    cited FLVCR1 source mentions. Left as-is per the task instruction to note the
    module-conformance divergence rather than rewire the binding. For a follow-up: both
    changes are low risk — `GO:0051402` is present in `cache/go/terms.csv` and in
    `cache/enums/biologicalprocessterm_dd47231dca51.csv`, so aligning the process term and
    dropping the cone cell type would validate offline. The report itself notes the apoptosis
    claim is legitimately imported from the module (conformance duplicates rather than
    inherits), so this is a consistency issue rather than an evidence failure.

    Also not done (report suggested, out of scope for a minimal evidence fix): adding a
    `discussions` entry with `kind: KNOWLEDGE_GAP` / `HUMAN_MODEL_MISMATCH` attached to the
    expression-gradient and residual-function nodes. The uncertainty is now recorded in the
    node descriptions and evidence grading; a new structural section is a curation decision
    beyond a defect fix.

    ## References

    No new references fetched. All added evidence items quote papers already cited in the
    file and already present in `references_cache/` (PMID:29192808, PMID:21070897).


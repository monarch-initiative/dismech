  summary: 'Create: FLVCR1-Related Retinopathy with or without Ataxia (MONDO:0100449,
    issue #4008)'
  details: |
    New entry for FLVCR1-related retinopathy with or without ataxia (PCARP), a medium-priority target from issue #4008's retinopathy curation tracker. Modeled as gene-centric with two subtypes (PCARP with ataxia; Isolated Retinopathy without ataxia) sharing a heme-toxicity mechanism gated by a tissue-expression gradient (retina > posterior columns > cerebellum) -- explains why retinopathy is universal but ataxia is only partially penetrant. Pathophysiology chain: FLVCR1 loss-of-function/misfolding -> heme export failure -> intracellular heme toxicity -> tissue-selective degeneration (retina always, posterior columns only with more severe variants), plus a dedicated node on the genotype-dependent residual-function hypothesis for splice-site variants. 4 PMIDs used (9409377 classic 1997 clinical description, 21070897 gene discovery, 22483575 heme-export mechanism, 29192808 genotype-phenotype/isolated-RP case), all fetched via just fetch-reference and snippet-verified. Required 3 dynamic-enum cache additions (MONDO:0100449 disease term; GO:0097037, GO:0042168, GO:0006915 biological processes; HP:0002571 achalasia phenotype) after confirming reachability via the local sqlite:obo: OAK adapters, since the repo's ols:mondo/ols:go remote adapters didn't resolve these newly-added/less-common terms live. Note for future curators: running linkml-term-validator with --cache-strategy greedy --saturate-enum-caches against the ols: adapters is unsafe in this environment -- it left stray .csv.complete marker files that caused subsequent just validate/validate-terms/validate-references runs to catastrophically corrupt several unrelated enum caches (one ballooned from ~1000 to 200000+ rows) until the markers were removed and caches reverted to origin/main. Schema, term (offline), and reference validation all pass; dup-key/structural check clean.

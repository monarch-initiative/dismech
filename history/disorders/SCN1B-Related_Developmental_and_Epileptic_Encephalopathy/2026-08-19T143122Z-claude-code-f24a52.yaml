  summary: 'Create: SCN1B-Related Developmental and Epileptic Encephalopathy DEE52'
  details: |
    New entry for DEE52 MONDO:0033361, the SCN1B sodium-channel beta-1 subunit encephalopathy. Deep research via "just research-disorder claude_code"; NEC preflight PASS with SCN1B mentioned 50 times and report OMIM 617350 among the OMIM IDs matching the MONDO xref. No GeneReviews chapter exists for SCN1B-DEE52; a PubMed search returned PMID:20301690, which is the Brugada Syndrome chapter, so it was deliberately NOT cited as an SCN1B baseline. Pathophysiology de-bundled into 20 atomic nodes across four parallel arms that the literature keeps separate: a trafficking arm, a gating-modulation arm, a cell-adhesion arm, and a cardiac arm. The forebrain and cerebellar branches are modeled in opposite directions because that is what the evidence says - pyramidal neurons are hyperexcitable while cerebellar Purkinje cells and interneurons are hypoexcitable. Four discussions, the central one a CONTROVERSY recording that the Scn1b mouse shows no interneuron changes, explicitly in contrast with Scn1a-based Dravet models, which contradicts the assumption that SCN1B disease works through the SCN1A mechanism. Three animal models and one patient-derived iPSC cardiomyocyte model are wired into the pathograph with readouts and limitations. A diagnosis section and structured onset descriptors were included from the outset following reviewer feedback on the sibling SLC12A5 PR. Validated with just validate 72/72 snippets verified, just validate-terms passed, just check-duplicate-keys, and just check-title-snippets.

  summary: 'Create: SZT2-Related Developmental and Epileptic Encephalopathy DEE18'
  details: |
    New entry for DEE18 MONDO:0014201, the SZT2/KICSTOR mTORopathy. Deep research via "just research-disorder claude_code"; NEC preflight PASS with SZT2 mentioned 108 times and report OMIM 615476 matching the MONDO xref. No GeneReviews chapter exists for SZT2, confirmed by PubMed search. Pathophysiology de-bundled into 14 atomic nodes that walk the KICSTOR chain one step at a time: variant, loss of SZT2 protein, complex disassembly, GATOR1 mislocalization, loss of the amino-acid-sensing input, and only then measured mTORC1 hyperactivation, with progenitor expansion and upper-layer neuron overproduction kept separate from the macrocephaly/malformation they produce. The intrinsic seizure-threshold arm and the progressive myelin-loss arm are modeled as separate branches rather than folded into the main chain. Four discussions: a KNOWLEDGE_GAP on mTOR-inhibitor repurposing and its therapeutic window, a KNOWLEDGE_GAP on whether the seizure-threshold arm is independent of malformation, a HUMAN_MODEL_MISMATCH on the organoid in-frame-deletion allele versus patient null alleles, and a KNOWLEDGE_GAP on the mechanism of the leukoencephalopathy. The deep-research report gave SZT2 as HGNC:29175, which is wrong; the HGNC REST API and the OAK mondo adapter both give HGNC:29040, which is what the entry uses. The report also proposed HP:0002185 for periventricular nodular heterotopia, which is actually Neurofibrillary tangles; HP:0032388 was used instead. Validated with just validate 53/53 snippets verified, just validate-terms passed, just check-duplicate-keys, and just check-title-snippets.

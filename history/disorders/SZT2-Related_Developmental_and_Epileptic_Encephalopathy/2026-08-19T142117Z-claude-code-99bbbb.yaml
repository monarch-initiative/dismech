  summary: 'Address review findings: module conformance and myelination GO term'
  details: |
    PR Shepherd pass on the review findings for PR #8905.

    Finding 1 - FIXED. Removed the conforms_to declaration
    "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
    from the "Constitutive mTORC1 Hyperactivation" node. That module node is scoped
    to voltage-gated channel variants, neurotransmitter receptor defects and
    synaptic-protein abnormalities, and carries GO:0042391 regulation of membrane
    potential plus GO:0007268 chemical synaptic transmission. This node carries
    GO:0031929 TOR signaling and neither of those processes. The precedent was
    verified independently rather than taken from the review: the comparable
    mTORopathies already in the KB - Sturge-Weber_Syndrome and Hemimegalencephaly -
    conform only to #Neuronal Hyperexcitability and Hypersynchrony and to
    #Recurrent Unprovoked Seizures, never to the ion-channel trigger node. The
    entry's own downstream edge also states that the steps between mTORC1
    dysregulation and altered excitability are not established, which undercuts
    asserting conformance to the module's E/I trigger. The entry's other two
    conformance declarations were left unchanged.

    Finding 2 - FIXED. On the "Progressive Loss of Central Myelination" node,
    replaced GO:0021987 cerebral cortex development, modifier ABNORMAL, with
    GO:0022010 central nervous system myelination, modifier DECREASED. Progressive
    loss of central white-matter myelin is not cortical development. GO:0022010 was
    verified present in cache/go/terms.csv and in the biologicalprocessterm enum
    membership cache, so it validates offline.

    Finding 3 - NOT ACTIONED, reported on the PR instead. The review asked for a
    Status epilepticus phenotype bound to HP:0032667. Two blockers. First, HP:0032667
    is "Myoclonic status epilepticus", not generic status epilepticus. The identifier
    was mislabelled as "Status epilepticus" in the deep-research artifact's section-15
    term table, and that mislabel was carried into the review; the correct generic
    term is HP:0002133 Status epilepticus, already present in cache/hp/terms.csv.
    Second, no citable evidence is available. The only occurrence of the phrase
    across all six cited references is a table abbreviation legend in PMID:37213690,
    "SE, status epilepticus" - an abbreviation key, not a reported finding. The
    deep-research artifact's alternative source PMID:33681650 was fetched and checked
    and does not mention status epilepticus at all. Quoting an abbreviation legend
    would satisfy the snippet checker while supporting nothing, which is the failure
    family described in CLAUDE.md sections 4 and 6, so the phenotype was left out
    pending a source that actually reports it.

    Validation on the resulting file: just validate passed; just validate-terms
    passed; just count-verified-snippets reported 58/58 verified against cached
    references; just check-duplicate-keys clean; pytest tests/test_data.py
    -k "conforms_to or title_snippet" 2183 passed.

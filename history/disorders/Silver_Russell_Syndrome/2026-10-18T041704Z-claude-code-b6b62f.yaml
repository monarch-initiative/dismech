  summary: 'Address review on PR 14706: GeneReviews baseline, split monogenic node,
    fix CDKN1C direction'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 14706. Cited and tagged the GeneReviews chapter (PMID:20301499) with snippets for clinical characteristics, diagnosis, management and genetic counselling, and added the GeneReviews phenotypes triangular face, fifth finger clinodactyly, micrognathia and lower limb length discrepancy. Removed the CDKN1C inhibitor-activity annotation and the CDKN1C gene from the 11p15 ICR1 loss-of-methylation node, since ICR1 acts through IGF2. Split the bundled monogenic node into CDKN1C Gain-of-Function and HMGA2 or PLAG1 Loss-of-Function, each with genetic_context, and changed ABNORMAL modifiers to DECREASED. Removed the 11p15 IC1 LOM subtype tags from relative macrocephaly, prominent forehead and asymmetric growth and recorded the enrichment in their descriptions. Kept three described and evidenced edges from growth restriction (SGA, postnatal growth retardation, relative macrocephaly via cranial sparing) and dropped the eight unsupported edges. Added a MONDO term to the Temple syndrome differential and a puberty snippet, a growth hormone therapeutic_agent (somatropin), an endocrine Harrison's snippet, a later-childhood endocrine progression phase, and removed the redundant gene slot. Validated with just validate, validate-terms, count-verified-snippets (83/83) and check-folded-hyphens.

  summary: 'Create: Familial_Nonmedullary_Thyroid_Carcinoma'
  details: |
    De-novo curation of familial nonmedullary thyroid carcinoma (FNMTC), the non-syndromic familial predisposition to follicular-cell-derived thyroid carcinoma, resolving issue #7473. disease_term anchored on MONDO:0017896 rather than MONDO:0017895 named in the issue: MONDO tags MONDO:0017895 (familial papillary or follicular thyroid carcinoma) with subset obsoletion_candidate and places it as a direct child of MONDO:0017896 that it effectively duplicates; MONDO:0017895 is retained under mappings.mondo_mappings as skos:closeMatch with a justification. Both terms were verified with OAK before writing. Named-entity-confusion preflight confirmed the deep-research report concerns NON-medullary (follicular-cell) disease, not medullary carcinoma/MEN2/RET: of 113 'medullary' string hits in the report, 111 were part of 'nonmedullary'/'non-medullary'. Content curated: a five-node connected pathograph (inherited non-syndromic susceptibility -> perturbed thyroid transcription factor and growth-regulatory signalling / telomere-telomerase imbalance and chromosome fragility -> acquisition of somatic MAPK-activating drivers -> multifocal follicular cell transformation -> eight phenotypes); polygenic (HP:0010982) plus autosomal-dominant-with-reduced-penetrance (HP:0000006) inheritance blocks; thirteen genetic records typed with GeneDiseaseRelationshipEnum, including HABP2 and MAP2K5 and DUOX2 as DISPUTED carrying both SUPPORT and REFUTE evidence; six differential diagnoses cross-referencing the existing syndromic entries rather than duplicating them; two prevalence records; six treatments; two diagnosis records; and three discussions (HABP2 CONTROVERSY, genetic-architecture KNOWLEDGE_GAP, anticipation/ascertainment CONTROVERSY). The telomere node declares partial conformance to genome_instability_mutation#Mutator Phenotype and Chromosomal Instability, documented in a node note. Deep research used Edison/FutureHouse Falcon via 'just research-disorder falcon' (500 s run, 38 citations, 1 artifact). Falcon supplied DOIs but explicitly declined to emit PMIDs, and it hallucinated CL:0000501 as thyroid follicular cell (that CURIE is granulosa cell; the correct term CL:0002258 was used). All 21 PMIDs were resolved independently via the NCBI DOI-to-PMID converter and PubMed esearch, fetched with 'just fetch-reference', and every snippet verified as an exact substring of the cached abstract. Validation: just validate (schema, term and reference validation) passes; 80/80 snippets verified, re-checked after reverting the reference validator's spurious rewrite of 7613 unrelated cache files; scripts/check_folded_hyphens.py clean; pathograph confirmed a single connected component with all eight phenotypes targeted and no dangling edge targets. Not done: ORPHA-sourced epidemiology, because the pinned Orphadata snapshot is unavailable in this working tree.

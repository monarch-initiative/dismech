  details: |
    Merged the surviving content of a parallel, never-pushed duplicate curation of FNMTC (dedup policy: older PR wins) into this entry, and folded in the automated reviewer's CHANGES_REQUESTED findings in the same pass.

    Ported: mechanistic_hypotheses (habp2_g534e_susceptibility DEPRECATED, telomere_length_predisposition EMERGING, clinical_anticipation ALTERNATIVE) wired to causal edges via downstream hypothesis_groups; a HABP2 G534E disputed-branch pathophysiology node carrying 1 SUPPORT + 5 REFUTE; HABP2 variant clinical_significance BENIGN and type MISSENSE; NID1 candidate gene; quantitative syndromic-gene risk for APC, PTEN, PRKAR1A, WRN and DICER1; four phenotypes (Non-Medullary Thyroid Carcinoma, Hurthle Cell Thyroid Adenoma, Papillary Renal Neoplasia, Hashimoto Thyroiditis) plus a split-out Thyroid Nodule; a new histopathology section; a US-guided FNA diagnosis entry; two differentials; Thyroid Lobectomy plus quantitative screening-derived treatment evidence; and two discussions (MONDO granularity, two-relative definition).

    Deliberately NOT ported: the five syndromic has_subtypes blocks from the duplicate, which would contradict this entry's scoping decision that syndromic causes are differentials; their quantitative content was redirected into the existing genetic entries instead.

    Review fixes: HP:0002716 to HP:0025289; removed the HP:0100031 term-claim mismatch on the anticipation phenotype (the reviewer's proposed HP:0003743 was contested and rejected with OAK evidence - it is an inheritance qualifier under HP:0000005, not reachable from HP:0000118, so it cannot validate as a phenotype_term); dropped the unsupported Pulmonary Metastasis frequency band; added subtype_term to TCO, fPTC-PRN and NMTC1; corrected the PMID:28942234 evidence item, which had omitted the significant lymph-node-metastasis result and quoted a bare trailing clause. Added clinical_trials NCT01109420.

    Every ported item was re-verified rather than trusted: all 12 newly cited PMIDs were fetched via just fetch-reference, every reference_title was checked against the cached title (issue #7536 check - no mismatches found), and every ontology ID was re-resolved with OAK with its definition read.

    Validation: schema OK, terms OK, references 173 of 173 snippets verified (up from 105), compliance 84.5 to 86.2 percent global and 85.0 to 86.6 percent weighted over a denominator that grew from 271 to 384 checks.

  summary: Wire Silicosis to nlrp3_inflammasome_activation module
  details: |
    Wired three conforms_to edges onto existing Silicosis pathophysiology nodes against the new nlrp3_inflammasome_activation module. No new nodes, evidence, ontology terms, or prose were added; each edge asserts over content the entry already carried.

    Phagolysosomal Membrane Rupture and Cathepsin B Release conforms to the module's Activating Danger Signal node, and Reactive Oxygen Species Generation conforms to the same node. Both are legitimate: the module node is explicitly a union of non-exclusive signal-2 routes, and Silicosis correctly curates lysosomal rupture and ROS as two atomic nodes rather than bundling two mechanistic claims. The ROS node's own description already calls itself "a second signal for inflammasome activation", which is the module node's exact semantics.

    NLRP3 Inflammasome Assembly and Caspase-1 Activation conforms to the module's central_effector node of the same name. The Silicosis node already carries GO:0044546 NLRP3 inflammasome complex assembly with modifier INCREASED, the module node's defining process, and its evidence includes PMID:18577586 reporting Nalp3-dependent caspase-1 activation.

    Not wired: the IL-1beta and IL-18 Maturation and Secretion node was deliberately left unconformed. The module's effector node bundles cytokine maturation with gasdermin D-mediated pyroptosis, while Silicosis splits pyroptosis into a separate Macrophage Pyroptosis and Silica Re-uptake node; claiming conformance for the cytokine node alone would over-assert against a node that also requires the pyroptotic arm. That call is left for a curator with the pyroptosis evidence in front of them.

    Validation: linkml-validate passed on the changed file, just validate-terms passed, and just count-verified-snippets was clean.

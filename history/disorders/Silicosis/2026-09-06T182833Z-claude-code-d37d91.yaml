  summary: Add cytokine-arm conforms_to edge to the NLRP3 module effector node (#8990)
  details: |
    Review round on PR #8990, blocking finding 1.

    Added conforms_to "nlrp3_inflammasome_activation#IL-1 Family Cytokine
    Maturation and Gasdermin D-Mediated Pyroptosis" to the "IL-1beta and IL-18
    Maturation and Secretion" node.

    The conformance had been withheld in the PR body on the reasoning that the
    module node bundles cytokine maturation with pyroptosis, so claiming it would
    over-assert. That contradicted the module node's own description, which
    explicitly licenses cytokine-arm-only conformance: cytokine processing and
    gasdermin D-mediated release are separable, and a conforming entry may evidence
    the cytokine arm without evidencing pyroptosis. The reviewer asked for the
    contradiction to be resolved one way or the other; the module's stated rule was
    kept and the edge added.

    The node already carried GO:0032611 interleukin-1 beta production (INCREASED),
    descends from the node conforming to the module central effector, and cites
    NLRP3-dependent evidence (PMID:18577586). No new content was needed. A notes
    line records that the conformance is on the cytokine arm only and points at
    "Macrophage Pyroptosis and Silica Re-uptake", where silica-induced pyroptosis
    is curated separately, so a later reader does not read the edge as asserting
    the pyroptotic arm too.

    Checks run: just validate (passed; 38/38 snippets verified), just validate-terms
    (passed), pytest tests/test_data.py -k "conform or Silicosis or nlrp3 or module"
    (2797 passed).

  details: |
    Claim-evidence correctness review (docs/reports/exposure-disorder-claim-evidence-review-2026-07-25.md).
    All three has_subtypes entries carried latency and exposure-intensity claims with no evidence. Evidenced with PMID:25191413 (silicosis classified into acute, chronic and accelerated forms by exposure intensity and time to symptom onset) and PMID:30053129 (histologically confirmed accelerated silicosis after ~2 years of intense unprotected sandblasting; rarity of the acute/subacute forms; poor prognosis). Removed the unevidenced numeric latency windows and nodule-size cut-offs from the subtype descriptions and flagged that the acute form's silicoproteinosis histology rests on the wider literature rather than a curated source. Also evidenced the Dyspnea, Cough and Lung Transplantation items from PMID:30053129.
    Remaining unevidenced: Respiratory Insufficiency, Silica Exposure Cessation and Dust Control, Whole-Lung Lavage.
    Validated: schema clean; all snippets verified as exact substrings.

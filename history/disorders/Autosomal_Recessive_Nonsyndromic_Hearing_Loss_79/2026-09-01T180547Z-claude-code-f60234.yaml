  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 79 (DFNB79, TPRN)'
  details: |
    De novo curation of DFNB79 (MONDO:0013215), biallelic TPRN/taperin.

    entry_type decision: DISEASE. One gene, one conserved pathograph (TPRN loss -> loss of F-actin bundling at the stereocilia taper -> rootlet destabilisation -> progressive stereocilia retraction and fusion -> late IHC synaptic/vesicular abnormality -> progressive SNHL). Not a SUBTYPE: no existing dismech entry covers TPRN, and DFNB103/CLIC5 is a distinct gene with a distinct clinical picture. Not a GROUPING: no member diseases.

    Sources: own PubMed sweep (TPRN/DFNB79/taperin) plus an Edison/falcon deep-research report (research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_79-deep-research-falcon.md). NEC preflight PASS: TPRN mentioned 51 times, OMIM 613307 agreed between MONDO and report. Two DR-suggested HPO terms were rejected on lookup rather than adopted (HP:0012717 resolves to 'Severe conductive hearing impairment', not 'prelingual hearing loss' as the report claimed); every term in the entry was resolved through OLS before use.

    Agreement with the CLIC5 entry (DFNB103): both are curated around the same taper-region complex and cite the same PMID:24285636 observation, so the two entries rest on one shared claim rather than two independent assertions. The entries deliberately differ on vestibular involvement: CLIC5 loss gives vestibular areflexia in patients and circling in mice, whereas TPRN loss spares balance in both (normal Romberg/tandem gait in the one family formally tested; no significant VsEP difference in Tprn-null mice to P60). That negative is curated as a phenotype with frequency: EXCLUDED, following the ADLD precedent, because modifier: ABSENT alone is not read by the HPOA exporter.

    Two discussions: a HUMAN_MODEL_MISMATCH on the two-sided TPRN dosage window (AAV-Tprn rescues nulls, but taperin overexpression is used in the same paper as a method of destroying the rings, and lowering taperin rescues Grxcr2 nulls); and a KNOWLEDGE_GAP on identical c.42_52del11 homozygotes showing stable versus progressive loss, where a null allele leaves no residual-function explanation.

    Deliberately not curated: hearing aids and cochlear implantation (no DFNB79-specific outcome data); AAV gene replacement as a treatment (preclinical, recorded under animal_models with its dosage limitation); the nuclear PP1-docking and DNA-damage biology of taperin as a pathophysiology node (no link to deafness established, recorded in genetic notes).

    Validation: just validate exit 0 with 50/50 snippets verified; check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens all exit 0.

  details: |
    Second session on this entry. The first record (2026-09-01T180547Z) is now stale - it reports 50/50 snippets and says hearing amplification and cochlear implantation were deliberately not curated - and is left unedited, since history is append-only.

    Automated second opinion on issue #10400. It pointed out that DFNB104 (RIPOR2) is a closer taper-region neighbour than DFNB103 (CLIC5) and already curates a taperin dependency. Added the RIPOR2 side of the reciprocal network, citing the same PMID:27269051 observation the DFNB104 entry uses as a readout, plus the PMID:32631815 sentence naming the full compartment membership. All three entries now rest on one shared set of claims about the taper rather than three independent assertions.

    Review on PR #10419, both findings correct. The purified full-length TPRN F-actin bundling result was graded MODEL_ORGANISM; it is a cell-free assay, so IN_VITRO, and the mouse origin of the protein classifies the reagent rather than the study design. PMID:40471101 is a mixed-source paper and the explanation now names which items carry its in vivo results.

    Cochlear Implantation and Hearing Amplification curated, following the Autosomal_Recessive_Nonsyndromic_Hearing_Loss_97 and _77 patterns: no evidence item, notes recording that the absence of DFNB79-specific outcome data is a reason to omit the evidence rather than the treatment, and target_mechanisms supplying the section's join point. Implantation gets BYPASSES against the stereocilia node with the caveat stated beside it that Tprn-null mice develop inner hair cell synaptic abnormalities, so the neural side may not be entirely spared. Amplification carries a link with no treatment_effect, as _77 does. Counselling carries no link at all, and its notes explain that no TreatmentEffectEnum value describes surveillance and that choosing the least-wrong one would put a false mechanistic claim in a machine-readable slot.

    Suggestions taken: progressive record rebound to HP:0008619 so it carries laterality alongside clinical_course; prelingual record given severity: SEVERE; penetrance addressed in the gene notes including the ascertainment caveat; PMID:34026762 now supports the taper node with directness: INDIRECT.

    Own full-text pass, prompted by the reviewer on PR #10421 noting that most of their findings came from a committed full text that had only been skimmed. Two negative results in PMID:40471101 qualify this entry's mechanical claim: pivot stiffness of Tprn-null stereocilia was not detectably changed in young postnatal outer hair cells and those stereocilia were not excessively fragile, and mechanotransduction currents were largely unaffected. Both graded NO_EVIDENCE rather than REFUTE - the measurements were made and found nothing, and the authors attribute that to the effect being too subtle to resolve at that age. Recorded because the node takes its pivot-flexibility framing from the paper's title, and without them it would read as though a stiffness change had been measured. The MET-current negative also constrains the mechanism usefully: taperin loss is not an immediate transduction failure, which is what makes DFNB79 a progressive structural disease rather than a channelopathy.

    Validation: just validate exit 0 with 55/55 snippets verified; validate-disorders, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens all exit 0.

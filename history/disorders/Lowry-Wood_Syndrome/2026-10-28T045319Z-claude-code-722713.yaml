  summary: 'Follow-up: ISDS classification, OMIM note, two evidence corrections'
  details: |
    Follow-up to dismech PR 15746, from two non-blocking review suggestions and a nosology check. Added the ISDS 2023 classification (group 9, Pseudoachondroplasia and the multiple epiphyseal dysplasias, NOS 09-0110), quoting the table row in PMID:36779427; the same row gives OMIM 226960, so the note that left the OMIM number unresolved now records 226960 and that Farach 2018 prints 226969. Marked the U6atac base-pairing evidence directness INDIRECT, because the source predicts rather than shows the disruption. Reworded the note on cerebral anomalies: an arachnoid cyst was reported in patient 1 of PMID:29265708, so the note now says no MOPD I-type brain malformation has been reported in a molecularly confirmed patient, and names the clinically diagnosed 1995 case with corpus callosum hypoplasia as the exception. Validated with just validate-disorders (schema, terms, 59/59 snippets).

  summary: 'Create: Lowry-Wood syndrome'
  details: |
    New entry for Lowry-Wood syndrome (MONDO:0009191), the third named RNU4ATAC phenotype, alongside the existing MOPD I and Roifman syndrome entries. The pathograph runs from biallelic hypomorphic RNU4ATAC variants to defective U12-type minor intron splicing, which has been measured directly in Lowry-Wood patient PBMCs (PMID:33660780), and then through secondary primary cilium dysfunction, the RNU4ATAC-wide mechanism from PMID:36802443, to the skeletal, retinal and neurodevelopmental phenotypes. The cilium-to-phenotype edges are marked INDIRECT_UNKNOWN_INTERMEDIATES and the cilium evidence is marked directness INDIRECT, because it was not shown in Lowry-Wood syndrome specifically. Phenotypes come from the two molecularly confirmed series (PMID:29265708, PMID:30368667) and the earlier clinical reports, which the entry notes identify as clinically diagnosed only. The 1995 corpus callosum and leukonychia report is deliberately not encoded as a phenotype. No OMIM mapping is recorded, because Farach 2018 gives 226969 and later papers give 226960. The two mechanism nodes conform to the spliceosome_component_dysfunction module at the same nodes as the MOPD I and Roifman entries. The change deletes stubs/Lowry-Wood_Syndrome.yaml and adds the entry as a member of the RNU4ATAC_Spectrum_Disorder grouping, which dismech PR 15656 created while this entry was in progress. A review round added GeneReviews spectrum-level evidence, a GO:0030624 U6atac snRNA binding function on the trigger node, a u4atac zebrafish animal model, and an OpenScientist deep-research report (research/Lowry-Wood_Syndrome-deep-research-openscientist.md; 18/18 citations verified). The report's identity was checked manually against MONDO:0009191 and RNU4ATAC because the MONDO build for just preflight-dr was absent; its additional leads (chilblain-like lesions, JAK/STAT signalling, U11 mouse models, an MOPD I fetal family) concern the wider spectrum or other diagnoses, so they are named in notes rather than encoded. Validated with just validate-disorders (schema, terms, 58/58 snippets).

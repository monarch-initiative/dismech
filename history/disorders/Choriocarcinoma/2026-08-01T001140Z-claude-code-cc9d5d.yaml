  details: |
    Created kb/disorders/Choriocarcinoma.yaml for MONDO:0005207 [GitHub issue #7466, tracker #1079; recommended_action CURATE_ROOT_WITH_SUBTYPES]. Deep research provider: Edison/Falcon via 'just research-disorder falcon Choriocarcinoma' - 1273s, 33 citations, 1 artifact; output at research/Choriocarcinoma-deep-research-falcon.md. Falcon output was treated as leads only: every PMID was fetched with 'just fetch-reference' and every snippet verified as an exact substring of the cached abstract or full text. Named Entity Confusion preflight run against MONDO:0005207 with OAK - trophoblastic neoplasm plus germ cell tumor parents, NCIT:C2948 xref, ICDO:9100/3 - no confusion detected. Scope decision: this entry covers choriocarcinoma proper - gestational, non-gestational germ cell, and intraplacental early form as three has_subtypes; the wider gestational trophoblastic disease spectrum of invasive mole, PSTT and ETT, and the molar precursor imprinting biology of CDKN1C/p57, are cross-referenced to the existing Gestational_Trophoblastic_Neoplasm and Hydatidiform_Mole entries rather than duplicated. Content: 10 pathophysiology nodes with biological_scale tags and a fully wired downstream chain, conforming to invasion_and_metastasis at Local Invasion and Intravasation and at Metastatic Colonization, and to immune_checkpoint_blockade at Adaptive Immune Resistance; 11 phenotypes with HPO terms; 4 histopathology findings; structured prevalence using measure_type/prevalence_class/rate_per_100000 with no deprecated percentage; genetic section on the paternal androgenetic allele complement and STR genotyping as the gestational-versus-non-gestational discriminator; biochemical serum beta-hCG with a LOINC:21198-7 reference range and FIGO/WHO pre-treatment hCG interpretation bands; FIGO stages I-IV; risk-factor environmental section; 7 treatments including EMA-CO with regimen_term NCIT:C67511 and PD-1/PD-L1 checkpoint blockade wired via target_mechanisms; TROPHIMMUN trial NCT03135769. A red-team self-review against the dismech-pr-review skill was run in a fresh-context subagent before opening the PR, and its findings were applied: added a diagnosis section (hCG criteria, STR genotyping, staging imaging, hCG-defined remission and surveillance); added EMA-EP/TP-TE cytotoxic salvage wired to the refractory node; replaced radiotherapy-first brain-metastasis management with CNS-penetrating high-dose methotrexate within EMA-CO; downgraded eight inferential or disease-group-level evidence items from SUPPORT to PARTIAL; removed three frequency bands and one prevalence-class claim that the sources did not license; dropped an unsupported GO genomic-imprinting annotation; switched the hCG analyte from the free beta-subunit LOINC code to the total-hCG code 19080-1; upgraded two histopathology NCIT terms and one HPO term (hemoperitoneum); split the bundled age/ethnicity risk factor; added two KNOWLEDGE_GAP discussions with proposed experiments; and made the boundary with Gestational_Trophoblastic_Neoplasm bidirectional by adding a cross-reference to that entry's Choriocarcinoma subtype, flagging the lump/split question for curator adjudication. Additionally, every snippet was audited to be a byte-literal substring of its cache (not merely part-wise matched), and six that passed the validator but were not byte-exact were corrected. Validation: just validate PASS with 110/110 snippets verified, just validate-terms PASS, just validate-references PASS, just compliance 96.7 percent global and 97.0 percent weighted (residual gaps are datasets and evidence on not-yet-performed proposed experiments).

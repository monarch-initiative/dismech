  summary: 'Cross-check audit + reviewer response: split CNS therapy, add angiogenesis
    node, add MONDO-bound differentials, add node roles'
  details: |
    Independent fresh-context audit (adversarial cross-check of a self-reviewed PR), merged with the ai4c-reviewer CHANGES_REQUESTED findings.

    REVIEWER IMPORTANT 1 - CNS-Directed Therapy for Cerebral Metastases was typed as radiotherapy but modeled as chemotherapy. Agreed. The single treatment carried therapeutic_modality RADIOTHERAPY and NCIT:C15313 Radiation Therapy while its description and primary evidence were about CNS-penetrating high-dose methotrexate within EMA-CO, and a radiation action term was carrying a small-molecule therapeutic_agent. Split into two treatments exactly as suggested: CNS-Penetrating High-Dose Methotrexate EMA-CO (SMALL_MOLECULE, NCIT:C15632 Chemotherapy, methotrexate agent, EMA-CO regimen_term, PMID:38008872) and Adjunctive Cranial Radiotherapy (RADIOTHERAPY, NCIT:C15313, no agent, PMID:34669197). Both were given target_mechanisms join points that the merged treatment lacked: the methotrexate arm targets Hematogenous Dissemination and Pulmonary Colonisation, the radiotherapy arm targets Haemorrhagic Destruction of Colonised Organs, which is the node whose risk it is given to reduce.

    REVIEWER IMPORTANT 2 - angiogenesis not modeled anywhere in the pathograph. Agreed. Added a VEGF-Driven Neoangiogenesis node conforming to tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization, wired in from Neoplastic Trophoblastic Transformation and out to both Hematogenous Dissemination and Haemorrhagic Destruction. Two new references were fetched and cached for it. Evidence is deliberately tiered and the tiering is documented on the node: the direct mechanistic demonstration (PMID:40760271, Rap1/VEGF axis driving choriocarcinoma angiogenesis) is IN_VITRO because it is cell-line work, and the clinical evidence (PMID:41627371, camrelizumab plus apatinib achieving complete and durable responses in 70-80 percent of multidrug-resistant GTN) is marked PARTIAL because response to an antiangiogenic agent is indirect evidence for the mechanism and the combination confounds the antiangiogenic contribution with checkpoint blockade. The node notes explicitly record that no cited source quantifies VEGF expression or microvessel density in primary human gestational choriocarcinoma tissue, and that a microvessel-density or VEGF-IHC series would upgrade the node. This is stated rather than glossed because the deep-research artifact itself warns that much of the angiogenesis evidence in this disease comes from complete hydatidiform mole or cell lines rather than causal intervention in human gestational choriocarcinoma.

    FOUND BY INDEPENDENT AUDIT:
    1. All ten pathophysiology nodes were missing the role slot, while every node correctly carried biological_scale. Assigned roles using the vocabulary already dominant across the KB: trigger, central_effector, effector, consequence, outcome, adaptive_escape, therapeutic_vulnerability.
    2. differential_diagnoses was absent entirely. For choriocarcinoma this is a substantive gap, because the entity is defined largely by its boundaries. Added five structured, MONDO-bound differentials with distinguishing_features and verified evidence: placental site trophoblastic tumour (MONDO:0020552), epithelioid trophoblastic tumour (MONDO:0016787), invasive hydatidiform mole (MONDO:0020549), complete hydatidiform mole (MONDO:0016785) and non-gestational choriocarcinoma (MONDO:0004322). The PSTT and ETT boundaries are therapeutically consequential because both are relatively chemoresistant, and the non-gestational boundary is the most consequential of all, since it determines whether the semi-allogeneic trigger node applies at all and whether the patient is treated on GTN or germ-cell protocols.

    NOT FIXED, flagged for the author: all twelve phenotypes have no incoming causal edge from the pathograph. Wiring them is a modelling decision rather than a repair and would be better done by the curator who built the graph.

    ON THE CONTESTED-MODEL CHECK: the gestational versus non-gestational origin question was specifically examined for the failure mode where prose acknowledges a contested model while the graph silently encodes one arm as settled. This entry does NOT have that defect. The Paternal Genome Content and Semi-Allogeneic Tumour Identity trigger node is gestational-specific, and that limitation is explicitly carried as a KNOWLEDGE_GAP discussion attached to that node, asking whether non-gestational germ-cell choriocarcinoma shares the modeled pathophysiology. That is the correct treatment and it is now reinforced by the new non-gestational differential.

    VERIFICATION PERFORMED: all 77 ontology identifiers re-resolved with OAK and definitions read, not just labels. All 110 original evidence snippets checked against the cached references; all 110 matched byte-exactly, with zero normalisation needed - the strongest snippet-fidelity result of the four entries audited. All reference_title values diffed against cached paper titles; no misattributions.

    VALIDATION: just validate, just validate-terms and just validate-references all pass. 118/118 snippets verified. Weighted compliance 97.0 to 96.0 percent; the decrease is the expected effect of adding a differentials section and a new node, which introduce optional-field denominators that the previously very compact entry did not have.

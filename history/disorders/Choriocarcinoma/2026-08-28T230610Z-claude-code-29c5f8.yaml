  summary: 'Detailed evidence review: all 120 evidence items verified, no defects'
  details: |
    Full manual evidence audit of kb/disorders/Choriocarcinoma.yaml.

    Scope: all 120 evidence items were re-read against their cited sources, covering 20 unique references -- 18 PMIDs (37758451, 40588865, 34088998, 34669197, 36286620, 32185550, 41243514, 30339966, 35681761, 37703867, 22469506, 32761058, 20673583, 20739008, 38008872, 37020431, 40760271, 41627371) and 2 ClinicalTrials.gov records (NCT03135769, NCT05139095). Every cache file was opened and its title, abstract and, for the eight full-text caches, the surrounding paragraph of each quoted passage was read.

    Checks performed on each evidence item:
    1. Snippet is an exact substring of the cached reference body. Mechanically confirmed at 120/120 verified by count-verified-snippets.
    2. The quote semantically supports the specific claim it sits under -- the pathophysiology node, causal edge, phenotype, subtype, histopathology finding, biochemical marker, diagnosis, stage, differential diagnosis, environmental factor, discussion, treatment or clinical trial.
    3. The supports grading matches the strength of the quoted statement for that particular claim.
    4. evidence_source classifies the cited study rather than the claim or the curator.
    5. No Named Entity Confusion between gestational and non-gestational germ cell choriocarcinoma, and no silent drift between choriocarcinoma-specific figures and gestational-trophoblastic-disease-wide figures.
    6. Snippets are propositional statements rather than paper titles.

    Result: no defects found. No edits were made to the entry.

    Findings supporting that conclusion:
    - The gestational versus non-gestational boundary is handled carefully throughout. PMID:34088998 and PMID:32185550 are used only for the non-gestational germ cell arm, and PMID:32185550 is described as a pooled analysis of 39 published cases rather than a primary cohort, which is what it is.
    - Figures that describe gestational trophoblastic neoplasia as a whole rather than choriocarcinoma specifically are already downgraded to PARTIAL with an explanation naming that exact limitation. This covers the 11 percent brain-metastasis figure from PMID:38008872 and the bimodal maternal-age, ancestry and blood-group correlates from PMID:37020431 and PMID:38008872.
    - evidence_source is correct on the two items where it departs from the default. PMID:40760271 is graded IN_VITRO for the Rap1/VEGF angiogenesis axis, which was studied in choriocarcinoma cell lines, and the entry's own notes block on that node states the mechanism is deliberately modelled at that weaker evidence tier. PMID:41627371 is graded HUMAN_CLINICAL and PARTIAL for the camrelizumab-plus-apatinib response, correctly reflecting that response to an antiangiogenic agent is indirect evidence for the angiogenic mechanism and that the combination confounds it with checkpoint blockade.
    - Inferential causal edges carry PARTIAL with the inference named in the explanation, for example the allograft-identity to PD-L1-selection edge and the syncytiotrophoblast-compartment to hCG-secretion edge.
    - Reference titles on evidence items and in the top-level references block match the title recorded in each cache file's frontmatter.
    - Advisory note, not a defect and deliberately not changed: the PMID:20673583 snippet quoting the use of human chorionic gonadotropin as a biomarker is a clause lifted from a longer sentence and reads closer to a noun phrase than a standalone proposition. It does support the hCG-biomarker claim in context, it passes the snippet-length and title-snippet gates, and re-quoting would not strengthen the claim, so it was left in place.

    Validation after review: just validate kb/disorders/Choriocarcinoma.yaml passed, and just count-verified-snippets reported 120/120 verified against cached references. No files under cache/ or references_cache/ were touched.

  summary: Link the antecedent molar pregnancy to the paternal genome node
  details: |
    Backfill for issue #8085. One link, TRIGGERS with DIRECT, and an unusually tight exposure-to-node fit: the paternal genome node names the complete hydatidiform mole as the most common precursor and states that its conceptus genome is entirely androgenetic, which is the paternal genome content the node is built around, so the exposure supplies the node's content rather than acting on it from outside. Both evidence items are graded PARTIAL because each measures incidence, one the one-in-forty risk after a mole against one in forty thousand pregnancies overall, and one the fall in incidence once postmolar surveillance programmes were introduced, rather than genome content. The second is the stronger design, since removing the precursor reduces the disease. The other two exposures were deliberately left unlinked, and this entry's own curation is the reason. Extremes of maternal age and the population and host correlates are both already annotated by their curator as gestational-trophoblastic-disease-wide rather than choriocarcinoma-specific, and the correlates entry states outright that these are population correlates and not established exposures or causal mechanisms. There is no node in this pathograph that either can honestly reach, and drawing an edge would convert an explicitly non-causal annotation into a causal claim. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 120 of 120 verified.

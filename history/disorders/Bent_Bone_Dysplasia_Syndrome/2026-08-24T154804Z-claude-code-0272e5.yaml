  summary: 'Create: Bent Bone Dysplasia Syndrome (MONDO:0013815); corrects an FGFR
    grouping membership claim'
  details: |
    Curated de novo from primary literature. The entry is unusual in the KB in declaring NO conforms_to anchors at all, and that is its substantive claim rather than an omission.

    WHY: this disorder was listed in the FGFR-Related Skeletal Dysplasias grouping review (#9257) as one of three "known unfilled seats" - disorders said to belong to the group on mechanism but lacking a curated entry. Checking the mechanism before curating showed that claim was wrong, and the grouping note has been corrected in the same commit.

    The BBDS alleles put a polar residue into the hydrophobic FGFR2 transmembrane domain and "selectively reduced plasma-membrane levels of FGFR2 and markedly diminished the receptor's responsiveness to extracellular FGF" (PMID:22387015, whose title is "...has deficient canonical FGF signaling" and which concludes the disorder is "separate from previously characterized FGFR2 disorders"). What is gained is receptor LOCATION, not activity: the same mutations "despite reducing canonical signaling, enhance nucleolar occupancy of FGFR2 at the ribosomal DNA (rDNA) promoter" (PMID:24908667), activating rDNA transcription via FGF2/UBF1 by de-repressing RUNX2. The grouping criterion is conformance to fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation - a constitutively active or ligand-hypersensitive receptor - which BBDS fails. check-groupings confirms it is not flagged as a candidate member.

    The error being corrected was an inference: an FGFR2 skeletal dysplasia with craniosynostosis was assumed to be a receptor gain-of-function disorder. The general lesson is now recorded in the grouping notes - within this group, allele position does not settle membership. BBDS alleles sit in the same transmembrane domain as achondroplasia p.Gly380Arg and Beare-Stevenson p.Tyr375Cys, and FGFR2 Tyr-381 substitutions have been reported to give either Crouzon syndrome or bent bone dysplasia depending on the substituting residue.

    Structure: 6 pathophysiology nodes (transmembrane substitution -> branching into reduced membrane signalling AND enhanced nucleolar rDNA occupancy -> nucleolar disorganization with Rpl11-MDM2-p53 stress -> osteoprogenitor proliferation with delayed differentiation -> impaired mineralization), 13 phenotypes, 2 progression phases, 1 treatment, 2 discussions, 41 evidence items across 5 references.

    Two module NON-conformances are stated explicitly in node descriptions rather than left implicit: the FGFR gain-of-function module (receptor mechanism inverted) and defective_skeletal_mineralization (mineralization failure here is secondary to an osteoprogenitor cell-fate defect, not a calciopenic, phosphopenic or inhibitor-excess arm).

    Discussions: gap_bbds_p53_inhibition_translation (HUMAN_MODEL_MISMATCH - p53 inhibition rescues the differentiation delay in cells, but there is no animal model, the skeletal lesions are established in utero so the therapeutic window may close before diagnosis, and systemic p53 inhibition in a child carries an unquantified oncogenic hazard; explicitly not to be curated as an emerging treatment); gap_bbds_same_residue_opposite_disease (why the same FGFR2 transmembrane residue gives Crouzon or BBDS depending on substituting residue).

    Evidence discipline: no phenotype carries a frequency band - 14 reported individuals, ascertainment-weighted toward lethal cases. Stillbirth is curated in progression rather than phenotypes because HP:0003826 sits outside the Phenotypic abnormality subtree the PhenotypeTerm enum draws from; noted in the entry. Three on-topic papers (PMID:23808569 Tyr-381 Crouzon-vs-BBDS, PMID:24300289 postnatal features, PMID:26573129 case and review) cache with content_type unavailable so no snippet could be verified - the Tyr-381 observation is used in prose and attributed as a report rather than quoted, with a note to add it as evidence if that paper is later cached. PMID:33242826 (biallelic LAMA5 bent bone dysplasia) is a distinct disorder and a differential-diagnosis consideration, not cited as BBDS evidence.

    Validation: pre-edit hook PASS after three iterations (ALTERED -> DYSREGULATED modifier; SUPPORTIVE -> THERAPEUTIC action_category; bent_bone_dysplasia_group -> bent_bone_dysplasia ISDS value; Stillbirth phenotype removed as outside the PhenotypeTerm enum). just validate-terms PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 41/41 verified. Stub deleted; check-stubs and check-groupings clean.

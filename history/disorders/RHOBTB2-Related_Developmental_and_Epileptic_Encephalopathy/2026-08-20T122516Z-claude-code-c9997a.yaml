  summary: 'Create: RHOBTB2-Related DEE (DEE64)'
  details: |
    New entry for DEE64 (MONDO:0033373, OMIM 618004, RHOBTB2 hgnc:18756), curated from a claude_code deep-research run. NEC preflight PASS: RHOBTB2 at 68 mentions with CUL3 and RBX1 appearing as its ligase-complex partners rather than rival entities, and OMIM 618004 matching the MONDO xref. The report's own validator flagged one unsupported quote from DOI:10.3389/fped.2024.1448793; that source is not cited in this entry. Two ontology bindings proposed by the report were wrong and were corrected against OAK before use: GO:0004871 is obsolete, and the report advised excluding CL:0000598 on the stated ground that it is dendritic cell, which is incorrect since CL:0000598 is pyramidal neuron. The exclusion was kept but for the correct reason, that the iPSC recordings are from mature differentiated neurons with no stated cortical subtype, so only CL:0000540 neuron is bound. No GeneReviews chapter exists for RHOBTB2, verified with a query form validated against SCN1A as a positive control. Six references cited, three with full text mined beyond the abstract. The entry is built around a three-way dissociation the deep-research report understated: in one iPSC system, BTB-domain missense variants altered excitability while GTPase-domain variants and complete loss of RHOBTB2 did not. The complete-loss negative is curated as an UNCHANGED readout because it is what excludes haploinsufficiency and makes the protein-accumulation account operative. A 2026 paper the report did not cite, PMID:41478322, adds a second molecular arm in which Na+/K+-ATPase is reduced through a lysosome-dependent route most prominently in the GTPase-domain mutants, which is the class showing no excitability phenotype; that tension is recorded as an open knowledge gap rather than smoothed over. Two competing mechanistic_hypotheses are curated for the route from accumulated RHOBTB2 to channel deregulation, transcriptional versus direct substrate ubiquitination, with the causal edge tagged to both groups. Validation: just validate passed with 36 of 36 snippets verified; validate-terms, check-duplicate-keys, check_folded_hyphens, check_environmental_evidence, check-title-snippets and check_snippet_length all pass.

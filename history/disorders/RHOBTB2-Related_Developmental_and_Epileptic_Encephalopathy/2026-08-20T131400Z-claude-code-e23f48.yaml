  details: |
    Addresses the eight IMPORTANT findings and four suggestions in the ai4c-reviewer CHANGES_REQUESTED review of PR #9092. Every finding was a case of under-consuming evidence already committed in the PR, plus one incorrect ontology binding.

    Item 1. GO:0032413 was bound inverted - preferred_term said 'regulation of ion transmembrane transporter activity' while the bound label was 'negative regulation of...', modifier DYSREGULATED contradicted that baked-in direction, and the evidence is about gene expression rather than transporter activity. Rebound to GO:0010468 regulation of gene expression, which is what the measurement is actually of, with the ion-channel specificity carried by preferred_term. The obvious alternative GO:0032412 (the non-directional parent) is obsolete; recorded in a node note.

    Items 2 and 3. Movement-disorder phenotypes added from PMID:33504645 (fetched for this round) and PMID:35315256 (already committed): Complex Motor Phenotype OBLIGATE 11/11, Paroxysmal Movement Disorder VERY_FREQUENT 10/11, Episodic Hemiplegia FREQUENT 8/11 with the 20-month onset that distinguishes it from ATP1A3 AHC, plus ataxia, dystonia, chorea (PARTIAL - the source says chorea-like) and Intellectual Disability OBLIGATE. HP:0100022 retained but retargeted as the explicit umbrella carrying the 'at least 2 different kinds' claim, with the specific components curated separately beneath it.

    Item 4. New environmental section with hyperthermia and head trauma, both linked via influences_mechanisms TRIGGERS to Seizures and Developmental Encephalopathy, each with its own link evidence. Both left without exposure_term: ECTO's temperature terms describe environmental heat exposure while the source says only 'hyperthermia' without stating whether it was febrile, and ECTO has no head-trauma or physical-injury term. Both searches recorded in notes.

    Item 5. Treatment description corrected. The earlier 'at best partial control on multi-drug regimens' was contradicted by the entry's own cited sources: 4 of 7 patients with epilepsy achieved seizure freedom (PMID:33504645) and one infant remained seizure-free on valproate monotherapy (PMID:39831600). Rewritten as genuinely variable response, with the retraction recorded in treatment notes rather than silently overwritten.

    Item 6. therapeutic_agent added: valproic acid (CHEBI:39867), carbamazepine (CHEBI:3387), pyridoxine (CHEBI:16709), from the source sentence naming all three.

    Item 7. Trio whole-exome sequencing added to diagnosis (NCIT:C101295) as the primary modality, with the de novo determination it exists to make.

    Item 8. Hotspot residues Arg483 and Arg511 added to the genetic association with their share of the spectrum (about 50 percent of about 30 variants across about 60 reported cases), the over-10-percent individual incidence of p.Arg511Gln, p.Arg483His and p.Arg511Trp, and the non-conservation finding (curated COMPUTATIONAL, a homology analysis).

    Suggestions also taken: seizure semiology and developmental regression phenotypes added, and a CASES_IN_LITERATURE prevalence record (60 reported cases).

    One new reference fetched and committed: PMID:33504645 (Zagaglia 2021, Neurology), the dedicated movement-disorder cohort. The deep-research report's approximately-84-percent figure for AHC was NOT used - the primary source reports 8 of 11, which is 73 percent, and the entry curates the counted figure.

    Validation: just validate passed, snippets 58/58 verified (was 36/36); just validate-terms passed; check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean.

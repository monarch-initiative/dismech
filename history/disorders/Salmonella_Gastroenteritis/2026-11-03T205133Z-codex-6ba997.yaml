  summary: Curated Salmonella gastroenteritis pathophysiology, phenotypes, diagnosis,
    treatment, and animal model evidence.
  details: |
    Created an evidence-backed acute nontyphoidal Salmonella gastroenteritis entry from a duplicate-screened skeleton and the cached OpenScientist research report. Added fecal-oral transmission, Salmonella enterica as the infectious agent, M-cell and SPI-1 epithelial invasion, SipB/SopB inflammatory signaling, neutrophilic enterocolitis, tetrathionate respiration in the inflamed gut, the bacteremia/focal-infection branch, common pediatric phenotypes, severe/high-risk antibiotic therapy, and the streptomycin-pretreated mouse colitis model.

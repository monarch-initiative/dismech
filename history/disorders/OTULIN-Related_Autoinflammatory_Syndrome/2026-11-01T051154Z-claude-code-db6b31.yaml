  summary: 'Create: OTULIN-related autoinflammatory syndrome (ORAS)'
  details: |
    Created the OTULIN-related autoinflammatory syndrome (otulipenia / ORAS; AIPDS-AR) entry.
    Deep research via claude_code; preflight-dr confirmed OTULIN dominant with matching OMIM
    617099 (TNF is the disease's own effector). Evidence anchored on fetched primary
    abstracts/full text (Zhou 2016 PNAS otulipenia discovery PMID:27559085, Damgaard 2019 EMBO
    Mol Med ORAS mechanism+HSCT cure PMID:30804083). Atomic pathograph: biallelic OTULIN LOF
    -> impaired linear (M1) deubiquitination -> increased canonical NF-kB signaling (monocyte)
    and dysregulated TNF signaling/TNF-induced cell death (fibroblast) -> neonatal-onset
    systemic autoinflammation; 4/4 phenotypes connected (recurrent fever, panniculitis,
    failure to thrive, diarrhea). Treatments: TNF inhibitor therapy and curative
    haematopoietic cell transplantation. Generic protein-deubiquitination GO term used (no
    M1/linear-specific term available); no LUBAC/NF-kB module as conformance target,
    consistent with A20 and HOIP sibling entries. All gates pass.

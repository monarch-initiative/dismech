  details: |
    Expanded the entry's hypothesis and knowledge-gap coverage beyond the single antigen-persistence model. Added a second mechanistic_hypotheses group, vimentin_autoimmunity_model (EMERGING): an alternative in which the disease-defining antigen in HLA-DRB1*03+/Lofgren sarcoidosis is a self-protein (vimentin) rather than persistent microbial antigen, wired onto the shared HLA-presentation and antigen-recognition->Th17.1 edges and cross-referenced from the existing model's notes (the two are non-exclusive via molecular mimicry). Evidence: PMID:30038611 (Kinloch/Grunewald, in situ T- and B-cell vimentin autoreactivity in HLA-DRB1*03+ lung). Added a second KNOWLEDGE_GAP discussion, gap_sarcoidosis_immunologic_paradox_anergy_vs_activation: the paradox of vigorous local granulomatous Th1/Th17.1 activity with peripheral T-cell anergy/lymphopenia and PD-1+ exhaustion, and the unresolved therapeutic direction (exhaustion reverses with spontaneous resolution, yet checkpoint-inhibitor therapy triggers sarcoid-like reactions), with a proposed longitudinal exhaustion-vs-resolution experiment. Evidence: PMID:29234685 (Drake group, CD4+ exhaustion reverses with resolution). Leads mined from the existing deep-research corpus; each PMID fetched via just fetch-reference and snippets verified as exact abstract substrings. just validate passes (schema, term, reference).

  summary: Link candidate antigen exposures and the inverse smoking association
  details: |
    Backfill for issue #8085. All six entries target the antigen recognition and CD4+ T-cell activation node, which is where an inhaled exposure must act in a disease defined by an antigen-driven granulomatous response. Occupational inorganic dust exposure, microbial bioaerosol and infectious triggers are TRIGGERS, since each is a candidate antigen source; all are INDIRECT_UNKNOWN_INTERMEDIATES because no organism or particle has been established as causal and whether they act as antigen or adjuvant is unresolved. Insecticide exposure and agricultural employment are PREDISPOSES: the first is an established risk factor that is not a plausible antigen and whose effect depends on genotype, the second is a setting bundling several exposures rather than an exposure itself. Cigarette smoking history is PROTECTS_AGAINST, one of the few well-replicated inverse associations in respiratory disease, with ever-smoking significantly less frequent among cases than controls at an odds ratio of 0.62. The description records that confounding by ascertainment is not excluded and no protective mechanism is established, so the direction is taken from the data without asserting a mechanism. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged from origin/main.

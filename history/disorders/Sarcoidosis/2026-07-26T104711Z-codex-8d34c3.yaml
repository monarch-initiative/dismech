  summary: 'Curate: sarcoidosis exposure-trigger mechanism gap'
  details: |
    Integrated disease-level and focused OpenScientist research for GitHub issue 6971. Kept the environmental exposure-by-host-susceptibility model EMERGING and pulmonary-scoped; added primary ACCESS exposure evidence without asserting a causal edge; localized exploratory HLA interaction, WTC null-interaction, and bronchoalveolar TLR2 constraints; and added a distinct OPEN knowledge gap with preregistered epidemiologic replication followed by exposure-matched sensor/HLA/CD4 perturbation. Balanced the antigen-persistence model with discordant positive cutaneous and negative pulmonary CLEAR trials, preserving uncertainty about viable organisms, nonviable antigen remnants, organ specificity, and the unproven Th17.1-to-mTORC1 bridge. Corrected review study types and the distinction between peptide presentation and particle innate/adjuvant effects.

  summary: 'Curate: sarcoidosis exposure-trigger mechanism gap'
  details: |
    Integrated disease-level and focused OpenScientist research for GitHub issue 6971. Kept the environmental exposure-by-host-susceptibility model EMERGING and pulmonary-scoped; added primary ACCESS exposure evidence without asserting a causal edge; and structured the associated microbial-bioaerosol, insecticide, agricultural-employment, and inverse smoking observations as non-causal environmental leads. Added calibrated systematic-review, inorganic-sensitization/fibrosis, and beryllium diagnostic-constraint evidence, preserving study-quality, exposure-ascertainment, causal-direction, and chronic-beryllium-disease misclassification limits. Localized exploratory HLA interaction, WTC null-interaction, and ex-vivo bronchoalveolar TLR2 constraints; added a distinct OPEN knowledge gap with preregistered epidemiologic replication followed by exposure-matched sensor/HLA/CD4 perturbation; and retained the beryllium result as PARTIAL rather than a broad refutation because its main-effect nulls co-occurred with a duration-by-Glu69 interaction. Balanced the antigen-persistence model with discordant positive cutaneous and negative pulmonary CLEAR trials while explicitly retaining the cutaneous result only as cross-organ discordance under a pulmonary-scoped hypothesis. Corrected review and ex-vivo study types and the distinction between peptide presentation and particle innate/adjuvant effects.

  summary: Integrate assessed OpenScientist findings across three hypotheses
  details: |
    Integration-only pass over the three OpenScientist hypothesis reports for Sarcoidosis. All three already carried assessment sidecars (antigen_persistence_granuloma_chronicity_model and environmental_exposure_host_susceptibility_trigger_model by codex, vimentin_autoimmunity_model by claude-code), so no new assessment was written. Nine evidence items were added, each traceable to a RETAINED or QUALIFIED claim in those sidecars, with every snippet re-derived from references_cache rather than copied from the reports. From antigen_persistence_granuloma_chronicity_model: PMID:42143504 on the Th17.1-to-macrophage-mTORC1 causal edge as the partial (associative, whole-tissue, murine) bridge that keeps the edge INDIRECT rather than absent; PMID:34944053 as a REFUTE item on the mTORC1 node showing phospho-S6 in only a subgroup of sarcoid granulomas, at a comparable rate in other granulomatous lung diseases, with no clinical-phenotype association, and the node description plus hypothesis notes rewritten to stop asserting that mTORC1 activation is enriched in progressive human lesions; PMID:42246493 for the peer-reviewed Fsp1-Cre Tsc1/Tsc2 CCL24-CCR3 axis, cited in place of the preprint the report used; PMID:37750561 split into a MODEL_ORGANISM item (myeloid mTORC1 sufficiency for cardiac granulomas) and a HUMAN_CLINICAL item (mTOR signalling in CD68+ macrophages in cardiac-sarcoidosis autopsy myocardium); PMID:42286635 on the Th17.1 node for the CTD-ILD-controlled activation and lung-Treg comparison and the corticosteroid-response arm; PMID:33801218 on the Infectious Triggers environmental entry for the caveat that granuloma bacterial nucleic acid does not establish protein co-localization. From environmental_exposure_host_susceptibility_trigger_model: PMID:24912188 added to the gap_sarcoidosis_exposure_genotype_trigger_mechanism discussion as the chronic-beryllium-disease analogue that makes the exposure-genotype-CD4-granuloma chain concrete, explicitly marked directness INDIRECT and framed as an exposure-defined mimic to exclude rather than generalize. From vimentin_autoimmunity_model: PMID:28827283 on the Self-Antigen Vimentin Presentation node, substantiating the word public in that node description via shared TRAV12-1/TRBV2 CDR3 motifs across DR3-positive Lofgren patients. PMID:41916671 was added to JAK Inhibitor Therapy as a cardiac treatment lead with its uncontrolled eight-patient design stated, and was deliberately not used to support the causal-necessity framing the codex sidecar REJECTED. Deliberately not integrated: applies_to_subtypes was left at Pulmonary Sarcoidosis because the pulmonary-cardiac-subtype-scope claim is QUALIFIED against a unified subtype restriction; PMID:29449421 has no retrievable abstract in the cache so no exact snippet could be built; PMID:33630763 was redundant with PMID:24912188 for the beryllium-analogue point; the REJECTED claims (jak-causal-necessity, hla-determines-antigen-clearance, gene-environment-search-completeness, interaction-only-inference, metal-hypersensitivity-class) produced no content, and in particular no type-II-hypersensitivity ontology term was added. No new ontology CURIEs were introduced. Verified with count-verified-snippets (154/154), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and check-snippet-grading, all passing.

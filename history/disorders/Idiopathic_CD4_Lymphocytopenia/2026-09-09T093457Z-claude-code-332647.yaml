  summary: 'Create: Idiopathic CD4 Lymphocytopenia'
  details: |
    Created the idiopathic CD4 lymphocytopenia entry (MONDO:0014226). This was the seventh disease of a seven-disease claim run; its original drafting agent produced nothing before hitting a rate limit, so the claim issue had been open and assigned with no work behind it.

    The curation decision that shapes the entry is nosological. MONDO:0014226 conflates two entities: its definition and Orphanet:228000 cross-reference describe the clinical syndrome, a diagnosis of exclusion, while its OMIM:615518 cross-reference is immunodeficiency 13, a Mendelian UNC119 disorder. The curation stub had inherited both identities, listing IMD13 among synonyms and UNC119 among genes. The entry follows the clinical definition, because that is what the literature under this name is about and what the cited cohorts enrolled.

    Consequently no causal gene is bound as the cause of ICL, and that absence is a structural claim rather than a gap. The defining criterion requires that no other immunodeficiency be demonstrable, so identifying a monogenic cause removes the patient from the category. The NEJM cohort quantifies the mechanic: 108 enrolled, 91 remaining after excluding genetic and acquired causes. RAG1 is curated in the genetic section explicitly as a differential rather than an aetiology, with that framing in its own notes; MAGT1, JAK3 and CD4 are named in the deep research report but were not curated on that authority alone.

    just preflight-dr emits a warning on this report, naming UNC119 as the expected gene against CD4 as a rival at 112 mentions. That warning is a direct artifact of the same MONDO conflation and is not a defect: CD4 is the defining surface marker, and MAGT1/RAG1/GATA2 appear because they are the causes that must be excluded. The warning and its explanation are recorded in the entry notes rather than left for the next reader to re-derive.

    Pathophysiology is a six-node branching chain: autoantibody formation and increased CD4 activation and turnover both converge on depletion of circulating CD4+ T cells, which drives impaired cell-mediated immune surveillance and a blunted response to novel antigens. Ten phenotypes; eight have a mechanistic parent. Autoimmune Disease is deliberately left unattached because both candidate edges are contradicted by the cited evidence: the autoantibody repertoire is reported as unrelated to autoimmune disease status, and deeper CD4 depletion carries lower rather than higher odds of autoimmunity (odds ratio 0.5). Vitiligo hangs off Autoimmune Disease for the same reason. That reasoning is in notes.

    Deep research: one claude_code provider report, 19/19 references resolved, no confabulation. Its term validation flagged that it proposed HP:0004802 as "Lymphopenia" when that identifier is Episodic hemolytic anemia; the term was not used. Every snippet in the entry is quoted from a primary reference fetched directly rather than from the report, since the report cited mostly URLs rather than PMIDs and the PMIDs were located by separate PubMed searches.

    Two errors were caught by validation before commit and are worth recording. The reference_title for PMID:11049808 was written as "a case report and review of the literature" when the cached title reads "a case report and review of reported cases" - it had been completed from a display truncated at 100 characters rather than read in full. The NCT00839436 evidence quoted the trial's registry title, which is not a substring of the cached body; it now quotes the trial's stated objective instead.

    Validation: just validate passes with 25/25 snippets verified; validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms and the whole-KB snippet-grading, title-snippet, snippet-length, folded-hyphen and reference-title gates all pass.

    Not curated, with reasons in notes: no GeneReviews baseline (not a Mendelian disorder, and exclusion of monogenic causes is definitional), no prevalence record (cited cohorts are single-centre referral series with no population rate found), no animal model (the syndrome is defined by the absence of an identified cause).

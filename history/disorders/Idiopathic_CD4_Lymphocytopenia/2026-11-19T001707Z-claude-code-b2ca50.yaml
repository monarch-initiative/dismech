  details: |
    Answers review round 1 on PR 18416 in one push.

    Blocking item 1, the snippet truncation of dismech#15607. Six cancer snippets quoted PMID:37133586 only as far as 'six cancers' or 'virus-associated cancers', stopping before the clause that names the tumour each one was cited for. The squamous cell carcinoma, Kaposi sarcoma and non-Hodgkin lymphoma phenotype rows and the three matching downstream edges from Impaired Immunosurveillance of Virus-Associated Malignancy therefore each cited a quote that never named their cancer, and the non-Hodgkin lymphoma explanation asserted the authors named it 'in this sentence' when the quoted part did not. All six are now extended to the full sentence. Both full sentences were checked against the cached body with linkml_reference_validator's own normalize_text before being written, in plain ASCII (straight apostrophe, hyphen for the em and en dashes), so nothing was cut to avoid a character. The four explanations the longer quotes now support were rewritten to say what the quote states: the squamous rows name the three squamous-cell sites, the Kaposi phenotype names the tumour itself, and the Kaposi edge says the sentence names the causative herpesvirus rather than the tumour. The papillary thyroid carcinoma row gained the same sentence as a second evidence item, since it names that tumour in the excess list and the row previously had no direct statement of excess.

    Blocking item 2. references_cache/PMID_21796205.md, a pre-existing tracked cache for the MAGT1 paper also cited by Congenital_Disorder_Of_Glycosylation_Type_ICC, had been rewritten by a fetch in this branch: new extractor_version and xml_extraction_version frontmatter and re-spaced full text, for example 'plants1-3' becoming 'plants 1- 3'. This entry quotes only the unchanged abstract. Restored from the branch base per CLAUDE.md, which treats a tracked cache modified after validation as a bug to report rather than a change to commit. The scope was checked with git diff --diff-filter=M: that was the only reference cache rewritten, and the seven cache/*.csv term-cache changes are purely additive, 7 rows added and none removed, so those are kept.

    Suggestion item 3, taken. The PMID:24646462 snippet 'as a result of profound cell-mediated immune-response deficiency' on the depletion to cell-mediated immunity edge now carries quote_role: BACKGROUND, matching the JC-virus item already quoting the same introduction sentence, and its explanation says the paper cites earlier reports for the claim rather than deriving it from the French cohort.

    Suggestion item 4, declined with reasons given on the PR. The report's population-genetics figures were not added to the UNC119 notes: they are the provider's own computation over gnomAD and IMPC, I have not re-run them, and CLAUDE.md requires a recorded claim to be one whose query was re-run rather than restated. The ClinVar Benign/Likely benign assertion, which was verified at NCBI, already carries the point.

    Also fixed in this push, from the CI failure rather than the review: four reference_title strings on two ClinicalTrials.gov records were wrong because they had been completed from truncated terminal output rather than copied from the cache frontmatter. NCT03519464 is '...in Patients With Idiopathic CD4 T Cell Lymphocytopenia' and NCT02015013 ends '...T Cell Maturation and Trafficking in Murine Models'. check-reference-titles had passed them because its similarity floor is 0.85 and the wrong strings sat above it; only the reference validator's exact title comparison caught them.

    Validated: just validate-disorders passes, 129 of 129 snippets and 146 titles with 0 issues.

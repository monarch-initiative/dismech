  summary: 'Create: Idiopathic CD4 Lymphocytopenia'
  details: |
    Curated as a single Disease entry (MONDO:0014226), the lump/split call the claim issue asks for. The case definition is a consensus one, the downstream pathograph replicates across cohorts (HPV disease 29 percent in the NIH series and 30 percent in the French one, plus cryptococcosis, cancer and autoimmunity), and only 7 percent of the NIH cohort had a monogenic cause, which the definition then excludes. So the gene-defined causes (MAGT1, ITK, CD4, STK4 and the five other inborn errors found on sequencing) are differential_diagnoses pointing at their own KB entries, not subtypes.

    Pathograph: four provisional candidate upstream nodes (blunted interleukin-7 homeostasis, anti-CD4 autoantibody-mediated destruction, accelerated Fas-mediated apoptosis, defective surface CXCR4) converge on the defining depletion node, which branches to cell-mediated immune failure, impaired malignancy immunosurveillance, lymphopenia-associated loss of self-tolerance, and impaired primary antibody response. Each candidate also carries a mechanistic_hypotheses entry; none is CANONICAL, because no cohort has shown any one of them to account for the syndrome, and a KNOWLEDGE_GAP discussion proposes assaying all four in one cohort.

    UNC119 is recorded as relationship_type DISPUTED with the reported allele at clinical_significance BENIGN, not as a cause: one 2012 proband, unreplicated in thirteen years, and ClinVar classifies NM_005148.4(UNC119):c.65G>T as Benign/Likely benign with multiple submitters and no conflicts (variation 88737, verified via E-utilities 2026-11-17). That ClinVar record and the OMIM 615518 record are in external_assertions, since neither is a citable reference prefix here. The UNC119A-to-LCK trafficking pathway is kept as an ALTERNATIVE hypothesis because it is independently established in primary human T cells. A CONTROVERSY discussion records the open question.

    Evidence: 128 of 128 snippets verified against cached references; 17 references fetched directly, with 11 new to the KB. A 3-iteration OpenScientist report was used as a lead list only. Its ontology suggestions were discarded: 11 of 31 checked labels were mismatched, including every NCIT treatment CURIE and two HPO terms naming different concepts. preflight-dr returned WARN, with CD4 outnumbering UNC119 because CD4 is this disease's own marker rather than a second entity.

    Validated: schema, term validation, 128/128 snippets, and the per-file gates for entity refs, causal targets, duplicate keys, enum values, coarse phenotypes, qualifier terms, logical rules, delivery system and block-scalar comments.

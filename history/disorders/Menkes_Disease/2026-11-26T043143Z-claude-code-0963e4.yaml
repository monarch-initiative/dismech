  summary: 'Gene-family review: ATP7A'
  details: |
    ATP7A modelling re-reviewed. The copper-export node binds GO:0140581 P-type monovalent copper transporter activity as DECREASED, which matches ATP7A's normal function (Cu(I)-transporting P1B-type ATPase that loads secretory-pathway cuproenzymes and exports copper across polarized epithelia); no change there. The single CAUSATIVE genetic record covered all four subtypes although ClinGen classifies them separately: Menkes disease (MONDO:0010651, this entry's disease_term) is Definitive (CGGV:assertion_9bc50734-316b-47db-ba10-61f3fde46cca-2018-02-07T110000.000Z) and X-linked distal spinal muscular atrophy type 3 (MONDO:0010338, the distal motor neuropathy subtype's term) is Moderate (CGGV:assertion_ec7c42f3-3cad-4020-aa75-cf103c5381ba-2023-01-10T170000.000Z). The Definitive tier is now recorded on the main CAUSATIVE record, and the distal motor neuropathy has its own record typed UNKNOWN with the Moderate tier and subtype set, citing the founding two-family report and its trafficking-defect functional data (PMID:20170900). The disease-level and record-level inheritance blocks are now bound to HP:0001419 X-linked recessive inheritance.

  details: |
    Claim-evidence review of frequency bands (issue #7026). Added Orphanet ORPHA:565 curated HPO-frequency evidence and reconciled bands to match: Seizure and Hypotonia FREQUENT->VERY_FREQUENT, Wormian bones OCCASIONAL->FREQUENT; corroborated Bladder diverticulum OCCASIONAL with ORPHA (its prior 3/4 case-series snippet was too small). Dropped 8 frequency bands whose evidence contained no quantitative/frequency data and for which ORPHA:565 has no exact-HP-term row (Neurodevelopmental delay, Failure to thrive, Pili torti, Cutis laxa, Cerebral atrophy, Arterial tortuosity, Subdural hemorrhage, Fair hair), each with an explanatory notes recording the related ORPHA sibling-term frequency. Internal jugular vein phlebectasia (14%) retained. Schema + reference validation pass.

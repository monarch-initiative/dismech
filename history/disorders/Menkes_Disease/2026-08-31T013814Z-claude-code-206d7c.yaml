  summary: Correct the copper-dependence claim; add link-level evidence
  details: |
    Review response on PR 10161. The reviewer correctly flagged that the viable-brindled model description called succinate-cytochrome c reductase a copper-dependent respiratory-chain activity. Complex II uses FAD and iron-sulfur clusters and complex III uses hemes plus a Rieske cluster; neither contains copper, and only cytochrome oxidase (complex IV) is a cuproenzyme. The claim also over-read PMID:9342151, which concludes only that the tissues show abnormalities consistent with mitochondrial impairment. Rewrote the description to restrict the copper claim to cytochrome oxidase and to say explicitly why the muscle deficit is not evidence of cuproenzyme failure. Separately added link-level evidence to the brindled mouse cuproenzyme link, which was the only one of the twelve links carrying readout evidence but no evidence for the link itself.

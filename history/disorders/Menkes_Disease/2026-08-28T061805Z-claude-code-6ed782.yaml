  summary: GO annotation pass and literature extension for Menkes disease copper pathway
  details: |
    Added the ATP7A copper-transporter molecular function and direction modifiers to the apex export-failure node; applied the homeostasis-modifier convention (ABNORMAL on GO:0055070); bound the cuproenzyme molecular functions dopamine beta-monooxygenase GO:0004500 and cytochrome-c oxidase GO:0004129 with DECREASED and re-homed the misplaced redox evidence, adding the COX-specific Elesclomol study PMID:32381719; added lysyl oxidase GO:0004720 to the connective-tissue node; added tyrosinase GO:0004503 and melanin biosynthesis GO:0042438 to the hair node with PMID:18650808; tagged nodes with biological_scale; added an icimd copper_metabolism classification; and recorded the January 2026 FDA approval of copper histidinate (ZYCUBO, PMID:42018271) with a CHEBI therapeutic agent. Validated with validate-disorders and the offline QC gates.

  summary: Add brindled and viable-brindled mottled mouse models
  details: |
    Curated mouse models from MGI genotype-phenotype annotations on the two MP branches that separate abnormal enzyme/coenzyme LEVEL (MP:0005319, under abnormal homeostasis) from abnormal enzyme/coenzyme ACTIVITY (MP:0005584, under abnormal metabolism). Candidates were selected from MGI_PhenoGenoMP.rpt joined to the MP descendant closures from OLS and to genes already present in dismech, prioritising genes annotated on BOTH branches. Each model was added as an animal_models entry with modeled_mechanisms links to existing pathophysiology nodes, per-link and per-readout evidence, and exact snippets verified against the local reference cache. Two mottled Atp7a alleles were added. Atp7a<Mo-br> (PMID:16371425) shows SOD3 specific activity falling in aorta and fibroblasts while cytosolic SOD1 is unaffected, and partially recovering on copper addition: a cofactor-loading defect in which enzyme activity drops without the enzyme protein being lost, which is exactly the dissociation the MP branch split preserves. Its link to the cuproenzyme node is PARTIALLY_RECAPITULATES at LOW fidelity because the cuproenzyme assayed is vascular SOD3 rather than a neuronal cuproenzyme and no neurodevelopmental outcome is measured. Atp7a<Mo-vbr> (PMID:9342151) contributes brain cytochrome oxidase and muscle succinate-cytochrome c reductase activity deficits, with the tissue restriction recorded as a limitation. The mitochondrial redox node was deliberately not linked: the cited study does not attribute the mitochondrial impairment to copper accumulation. Validated with just validate and exact-substring snippet checks.

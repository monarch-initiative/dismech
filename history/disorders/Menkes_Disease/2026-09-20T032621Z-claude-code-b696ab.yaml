  details: |
    Genetics pass for the d2g wiring-013 gap job (issue #12202). Research first: fetched and read the GeneReviews baseline chapter NBK1413 "ATP7A-Related Copper Transport Disorders" (PMID:20301586), which the entry had not cited, and the ClinGen ATP7A / X-linked distal spinal muscular atrophy type 3 curation.

    ATP7A was already bound on the origin pathophysiology node. The gap was the four has_subtypes rows, none of which reached a gene.

    Changes:
    - Bound ATP7A on all four subtype rows: Classical Menkes disease, Atypical Menkes disease, Occipital horn syndrome, ATP7A-related distal motor neuropathy.
    - Added the GeneReviews chapter as a reference (now tagged GeneReviews by just tag-references) and as evidence on the ATP7A genetic entry, quoting the sentence that makes ATP7A the single gene behind all three named phenotypes.
    - Added the ClinGen CGGV assertion for the distal motor neuropathy row, both the validity table row (Moderate, not Definitive) and the sentence describing its defining feature, that these patients lack the copper abnormalities of Menkes disease and occipital horn syndrome.
    - Recorded in review_notes on that row that ClinGen splits ATP7A into three gene-disease entities under its Lumping and Splitting criteria while dismech keeps them as subtype rows of one entry, and why.
    - Set relationship_type CAUSATIVE and variant_origin GERMLINE on the ATP7A genetic entry.

    Both MONDO checklist entries for this job, MONDO:0010338 and MONDO:0010572, were already bound as subtype_terms and are now gene-wired.

    Validation: just validate (92/92 snippets), validate-terms, and the offline gate suite all clean.

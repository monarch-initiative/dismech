  summary: Review CPT1A deficiency using full-text clinical and mechanistic evidence
  details: |
    Comprehensive review of cached CPT1A literature and the complete February 2025 GeneReviews PDF, covering clinical description, diagnosis, genotype correlations, molecular pathogenesis, management, surveillance, precautions, pregnancy and counseling. No matching deep-research artifact was found. Replaced bundled and overly categorical mechanisms with 11 nodes, separating variant-dependent instability from catalytic loss; removed claims of universal cardiac/muscle sparing and obligatory plasma carnitine abnormalities. Added renal acidification physiology, uncommon cardiac/muscle and neurodevelopmental findings, hepatic macrovesicular steatosis and chronic cirrhosis. Kept case-series ascertainment and molecular-confirmation limits explicit. Did not infer causal lipid-storage/cirrhosis edges from coexistence alone. Distinct clinical subtypes were not invented for variable-penetrance alleles sharing the same reaction defect. Expanded CPT1A alleles, conditional recurrence risks and ClinGen-attributed Definitive validity. The ClinGen live assertion is cached by URL because fetch-reference does not support CGGV here; the canonical-CGGV checker reports uncached, not conflict. Corrected infant fasting guidance, separated MCT/triheptanoin bypass from enzyme restoration, and added emergency, perioperative, renal/nutritional/developmental, pregnancy and family management. Added the physiological NCT00653666 study, CL202 NCT02214160 and expanded access NCT03773770 with full cached registry metadata; AVAILABLE is retained in notes because the status enum lacks it. One CPT I participant in CL202 does not justify transferring pooled efficacy estimates. Added COS-cell and fibroblast/yeast experimental systems with molecular-scale limitations.
    Full text consumed: GeneReviews; PMID21763168,28748224,34295859,23231747,26010953,38090675,35822099,32885845. PMID37276053 abstract is cached; publisher full text was read to verify final enrollment and the single CPT I participant, while supplemental and cache retrieval were blocked. Other primary claims use fetched abstracts where full text remained unavailable. Population p.Pro479Leu infant-death and infectious-illness associations retain confounding/ascertainment caveats instead of a direct immunodeficiency or death mechanism. Maternal illness contexts are distinguished. No central public dataset accession was identified; the population-study restricted access/supplement data do not imply an invented GEO record. Failed/CAPTCHA cache responses are excluded.
    Completeness: major phenotypes and severity spectrum covered; proximal mechanism and selected consequences covered with uncertainty; treatment and trial coverage adequate; genotype, inheritance and external validity covered; biochemical screening and confirmatory limitations covered; high-value sources consumed throughout, with all four GeneReviews clinical domains supported by quotes. Validation before independent PR review: 150/150 snippets and 177 titles passed batched schema/terms/reference validation. Independent review remains a separate gate.

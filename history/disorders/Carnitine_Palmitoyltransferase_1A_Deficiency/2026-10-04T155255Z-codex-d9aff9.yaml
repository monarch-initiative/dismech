  details: |
    Addressed all four findings from independent review of PR13546. Verified NCIT:C15271 Liver Transplantation and CHEBI:757060 triheptanoin through live OAK/OLS lookups before using the suggested identifiers. Bound transplantation specifically with SURGERY modality; added treatment modalities and a triheptanoin agent with pharmacotherapy action term. Structured the historical newborn-screening estimate as birth prevalence per live births, preserving the full 0.05–0.1333-per-100,000 interval and explaining the upper-bound class choice. Moved the 95.5% population allele frequency and both supporting quotes to the p.Pro479Leu variant. Reclassified the two primary-study introduction sentences as BACKGROUND in every occurrence. Removed encephalopathy-only evidence from hepatomegaly/transaminase/ammonia claims and removed the reciprocal nonspecific hepatic laboratory quote from encephalopathy-only claims. Rechecked PMID preference for GR quotations; remaining PDF-only quotes cannot be replaced with the PMID abstract. Re-read the full GeneReviews molecular section and PMID7877875: neither supplies an explicit disease-specific FAO-to-steatosis causal sentence, so did not manufacture edges from co-occurrence. Maternal phenotype omission and generated cache normalizations remain as explained in the review; no independent follow-up housekeeping push is planned.

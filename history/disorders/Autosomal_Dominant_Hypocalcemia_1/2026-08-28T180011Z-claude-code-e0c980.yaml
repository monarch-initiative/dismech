  summary: Cite the CLDN14 descriptor rather than leaving it on a deep-research lead
  details: |
    PR review flagged as non-blocking that the CLDN14 gene descriptor on the renal node had no citation - its only source was the deep-research report, which this entry's own notes say are leads rather than evidence. Fixed rather than left, because an uncited gene assertion is worse than an extra review cycle. PMID:25071082 is ADH1-specific, shows that ADH receptor variants repress miR-9 and miR-374 and thereby lift the brake on claudin-14, and reports an HDAC-inhibitor rescue in cell and animal models. The node description now states the route and its evidential strength. Snippets 67 to 69, all verified.

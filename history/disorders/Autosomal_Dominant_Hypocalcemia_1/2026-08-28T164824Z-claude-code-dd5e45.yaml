  summary: 'Create: Autosomal Dominant Hypocalcemia 1'
  details: |
    De novo curation of ADH1, MONDO:0011013, as a CASR gain-of-function set-point disorder. The pathograph models the parathyroid and renal limbs as parallel downstream arms of one left-shifted calcium set point, because that convergence is what explains why conventional calcium and calcitriol treatment aggravates the renal lesion rather than relieving it. Twelve references, all located through PubMed and fetched with just fetch-reference; an openscientist deep-research run was commissioned and used as a source of leads for four of them after the independent model had been built. Three snippets initially taken from an abstract-metadata service did not match the fetched cache text word for word and were corrected against the cache. Validated: schema, terms, 44 of 44 reference snippets, plus the duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet, snippet-grading and environmental-evidence gates.

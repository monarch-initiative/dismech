  summary: Review CASR-related hypocalcemia against full-text mechanisms, cohort denominators and
    treatment evidence
  details: |-
    Reviewed the entire disorder entry and OpenScientist deep-research narrative/citation artifact. Eligibility checks found no REVIEW history event and no overlapping open PR; inherited CASR-related disease is within the resumed scope excluding infectious/environmental diseases and poisonings.

    Corrected universal normal-expression/trafficking and uniform left-shift claims using primary variant-expression and G11-biased signaling experiments. Recovered the key renal/parathyroid threshold study: chronic renal activation was not obligatory at baseline in Nuf mice or the studied human case, and treatment-dependent renal effects must not be generalized across alleles. Split renal from intracranial deposition, separated the water-handling branch, and represented the microRNA/CLDN14 steps with their actual cell and pharmacological mouse evidence. AQP2 drug rescue does not isolate direct renal effects from concurrent mineral/PTH changes. Removed unsupported frequency bands derived from single families or broader hypoparathyroidism cohorts, while preserving bounded published-case denominators. Corrected cohort genetic prevalence, differential diagnosis, PTH replacement as bypass rather than restoration of secretion, thiazide caveats, and Nuf induced origin and partial treatment response.

    Updated treatment evidence through September 2026. Distinguished five-person NPSP795 proof of concept, uncontrolled 13-adult encaleret results, three-child PTH(1-84) experience and the off-label pediatric palopegteriparatide case. The CALIBRATE conference abstract reports both the primary within-encaleret baseline comparison and a separate concurrent randomized comparison; biochemical improvement is not proof of long-term renal protection. Official FDA, SEC/company and Takeda records establish adult palopegteriparatide approval, pending encaleret review and historical NATPAR/NATPARA supply limitations. Registry API records confirmed phase 2 completion and ongoing phase 3 extension status.

    Source consumption: full cached scientific bodies, pertinent methods/results/discussion and main captions of PMID35313217, 35879818, 32386559, 39607645, 39658204, 15347804, 31063613, 33103030, 25071082, 40086735, 33112267, 37754292, 42388864 and 35818129; pertinent methodology, population tables and limitations of the broader renal systematic review PMID33599907; complete cited primary/review abstracts where no full text was cached. Regenerated PMID35313217 to recover full text. Inspected publisher Table 1 for PMID42388864, including the 16-month urine collection footnote despite its placement under a 12-month column. The continued thiazide and uncontrolled design constrain interpretation. Read the complete CALIBRATE conference abstract and official regulatory/manufacturer documents. Separate supplementary files were not independently retrieved; no conclusions depend on inaccessible supplementary-only numerical data. Reference caches were generated only through the repository fetcher; the frozen dataset blob was not accessed.

    Deep-research completeness assessment: phenotypes adequate with bounded ascertainment and no invented population penetrance; subtypes adequate for isolated and Bartter-like presentations; mechanisms adequate after renal threshold, expression and biased-signaling corrections; treatments/trials adequate after phase 3 update and missing acute/PTH(1-34)/monitoring care; genetics adequate with non-missense variants, mosaicism and rare biallelic exception; biomarkers/diagnostics adequate with paired interpretation and nonspecificity; high-value references consumed and report errors corrected; overall adequate. Proposed extra-organ mechanisms and genotype-guided drug selection remain research questions. The report's wrong MONDO/cell identifiers were not imported. Current preflight flagged PTH as a rival gene, but PTH is a central hormone/therapeutic mechanism here; GNA11/OMIM615361 appears only as the appropriate ADH2 differential. GeneReviews and StatPearls checks found no matching chapter in the current index.

    Independent-review follow-up removed four retired PARTIAL-grade rationales and stated their actual evidence limits, expanded the reused conference evidence without a YAML alias, added OLS-verified drug agents, and distinguished renal phosphate retention from its serum phenotype. Hypomagnesemia and hypokalemia remain unlinked rather than adding unsupported causal edges. The SEC reference title retains the fetcher-generated URL because title validation requires the cached title; the document heading is not the HTML title.

    Validation: schema, ontology terms and 102/102 cached quotations passed on the substantive draft; entity references and causal targets resolve, and model readouts were checked against their link targets. Final formatting, evidence hygiene and history validation are recorded with the published PR. No merge was performed.

  summary: Assess germinal_center_reaction conformance; record decision not to conform
  details: |
    Assessed as the third, genuinely uncertain candidate named in the issue. Judged against conforming: the defect is isotype-restricted (normal IgG/IgM are part of the disease's own case definition), where every declared conformer fails the reaction broadly across isotypes; the immunoglobulin heavy-chain alpha loci are structurally intact (see the entry's own 'Intact Immunoglobulin Heavy Chain Alpha Loci' node); and the genetics are polygenic and largely associative (HLA class II haplotype, TNFRSF13B, IFIH1, PVT1, CLEC16A) rather than a single lesion substituting into the module's chain, unlike every other conformer. No conforms_to was added. Recorded the decision and its reasoning in a notes: block on the 'Failure of Terminal B Cell Differentiation to IgA-Secreting Plasma Cells' node, pointing at the entry's existing HLA-to-differentiation-block knowledge gap discussion as the open question that would need resolving before revisiting this. Also recorded the exclusion in the module's own notes so the decision is discoverable from either side.

  summary: 'Create: Selective IgA Deficiency'
  details: |
    Created kb/disorders/Selective_IgA_Deficiency.yaml (MONDO:0001341) from primary literature; no deep-research provider run was used. Scope decision: no causal gene is curated. SIgAD is genetically complex, so the genetic: section carries HLA class II haplotype association (SUSCEPTIBILITY, deliberately with no gene_term because the signal is to extended MHC haplotypes rather than one gene), TNFRSF13B/TACI as MODIFIER on the strength of the IUIS 2022 Table 3 footnote that heterozygous variants are likely disease-modifying rather than disease-causing, and IFIH1/PVT1/CLEC16A as common-variant SUSCEPTIBILITY loci. Pathophysiology chain: HLA susceptibility and intact IGHA alpha-1/alpha-2 loci -> failure of terminal differentiation of IgA-committed B cells into IgA plasma cells -> absent serum and secretory IgA -> impaired mucosal immune exclusion -> sinopulmonary/GI infection, plus an immune-dysregulation arm to celiac disease and autoimmunity and an anti-IgA alloimmunization arm to anaphylactic transfusion reaction. Two KNOWLEDGE_GAP discussions record what is unresolved: how HLA risk becomes a differentiation block, and why 85-90 percent of biochemically deficient people are asymptomatic. Prevalence is curated for three populations that disagree by orders of magnitude on purpose - European screening-based 1:600, Japanese blood donors 1:18500, and Ireland UKPID/ESID registry 0.75 per 100000 - with notes explaining that the registry-versus-screening gap is the asymptomatic majority, not a contradiction. Treatments are supportive only: antibiotics/prophylaxis, observation, IgA-deficient or saline-washed blood products, vaccination and specific-antibody assessment, and immunoglobulin replacement explicitly typed as a restricted indication for concomitant IgG subclass or specific antibody deficiency rather than routine therapy. classifications carries harrisons_chapter IMMUNE_RHEUMATOLOGIC and iuis_category 'predominantly antibody deficiency' quoting the IUIS 2022 Table 3 section 4 row directly (cache lines 2209-2214), chosen to avoid the PDF-extraction corruption in the adjacent rows. Sources: Yel 2010 (PMID:20101521, full text), Yazdani 2017 (PMID:27763681), Bronson 2016 GWAS (PMID:27723758), Ferreira 2012 HLA mapping (PMID:22291608), Ferreira 2010 GWAS (PMID:20694011), Ludvigsson autoimmunity and infection cohorts (PMID:24584841, PMID:26739713), Aghamohammadi 2008 progression (PMID:18520152), Kanoh 1986 Japanese donors (PMID:3485858), Sandler 2004 anti-IgA transfusion (PMID:15679454), Ireland UKPID/ESID registry (PMID:35604475), Castigli 2005 TACI (PMID:16007086), IUIS 2022 (PMID:35748970). Validation: just validate passed (schema, terms, references); count-verified-snippets 78/78; validate-terms passed; check-duplicate-keys, check-entity-refs, check-title-snippets, check-folded-hyphens, check-snippet-length, check-reference-titles all clean; just validate-disorders passed as the final batched gate. Caveats: Hammarstrom 2000 (PMID:10792368) was fetched but has no retrievable content in the cache so it is not cited; ORPHA:69127 could not be built because the Orphadata bulk XML is absent from this worktree.

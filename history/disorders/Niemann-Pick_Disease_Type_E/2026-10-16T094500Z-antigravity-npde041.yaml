  summary: Restore historical C/D/E neurovisceral description and remove conflated chronic visceral ASMD
    (NPD-B) clinical blocks per PR
  details: Restored the PMID:28164782-grounded description, definitions, and Neurodegeneration (HP:0002180)
    phenotype reflecting the historical grouping of patients with hepatomegaly, foamy macrophage infiltration,
    partial (often secondary) ASM deficiency, moderate sphingomyelin accumulation, and chronic neurological
    deterioration under types C, D, or E. Removed the unsourced synonym "Adult non-neuronopathic Niemann-Pick
    disease" (which belongs to MONDO:0011871) and removed chronic visceral ASMD (Niemann-Pick disease
    type B / ORPHA:77293) blocks (SMPD1-causative pathophysiology and genetics, ORPHA:77293 phenotype
    frequencies and prevalence, progression, biochemical markers, diagnosis, and olipudase alfa treatments)
    so Niemann-Pick_Disease_Type_E.yaml remains an accurate historical pointer entry. Added supporting
    snippets from Vanier 2010 (PMID:20525256) to substantiate the clinical and filipin-staining distinguishing
    features on the Niemann-Pick disease type C differential diagnosis entry.

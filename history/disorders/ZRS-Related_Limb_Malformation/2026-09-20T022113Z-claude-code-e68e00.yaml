  details: |
    Genetics pass for the d2g wiring campaign (issue #12207, epic #12189).

    Research first: the offline Bookshelf index (cache/bookshelf/genereviews.csv,
    2026-09-10 snapshot) has no GeneReviews chapter for LMBR1, ZRS, triphalangeal
    thumb, preaxial polydactyly, Laurin-Sandrow syndrome or syndactyly type IV, so
    there is no GeneReviews baseline for this disease. ClinGen has no gene-validity
    curation for LMBR1. MONDO records LMBR1 (RO:0004003) for the three classes the
    issue lists. The entry's existing treatment of the causal entity is already
    correct and careful: the lesion is the ZRS limb enhancer, LMBR1 is bound only
    because ZRS has no HGNC identifier, and the zrs_regulatory_element_not_groundable
    discussion records that limitation. Nothing about that framing was changed.

    Changes:
    - Bound LMBR1 (hgnc:13243) on all six has_subtypes rows, each with a descriptor
      description naming that branch's lesion class (ZRS point variant, complete
      duplication, duplication larger or smaller than 80 kb, position-404 point
      variant, pre-ZRS point variant) and repeating that LMBR1 is the host locus
      rather than the causal gene product. Without this the gene-to-subtype pair
      existed only in prose.
    - Bound SHH (hgnc:10848) on the Ectopic Limb-Bud SHH Regulatory Activity node.
      SHH is the enhancer's distant target and the effector of the mechanism, and
      it was not bound anywhere in the entry. The descriptor description states
      that it is the node's effector rather than a disease gene of this entry, and
      repeats the node's own caution that the node records enhancer spatial
      activity and not SHH abundance.

    Absence claims: earlier drafts of the two descriptor descriptions asserted that
    no LMBR1 coding variant and no SHH coding variant causes this spectrum. Both
    were rewritten to the positive form - that every lesion curated for the branch
    is regulatory - because an unsearched absence is not a claim this pass ran the
    searches to support.

    MONDO reconciliation: MONDO:0007615 LMBR1, MONDO:0008515 LMBR1 and
    MONDO:0017454 LMBR1 are all present and now bound on their subtype rows. The
    entry additionally curates three further LMBR1/ZRS branches beyond MONDO's list
    for this issue: MONDO:0008605, MONDO:0008270 and MONDO:0008572.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (62/62), just list-gene-term-mismatches, and the offline gates all pass.

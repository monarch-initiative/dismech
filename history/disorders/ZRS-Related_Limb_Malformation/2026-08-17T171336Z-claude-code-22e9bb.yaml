    Added an evidence block to the pzrs_fibroblast_mouse_limb_bud_model_mismatch HUMAN_MODEL_MISMATCH discussion in kb/disorders/ZRS-Related_Limb_Malformation.yaml, substantiating both sides of the mismatch with a citation each.

    PMID:35821352 (evidence_source: IN_VITRO) covers the human side: the 4C-seq assay was run on skin fibroblasts from a single affected family member plus controls, so the chromatin-contact readout comes from a single-donor fibroblast system rather than developing limb bud.


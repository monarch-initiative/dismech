    Also tightened the PMID:29543231 explanation in response to PR review: the previous wording said the snippet confirms the mouse assay measures an isolated reporter construct rather than endogenous SHH transcription, which asserts more than the quote states. The quote names the assay type; the reporter-versus-endogenous distinction is domain knowledge about transgenic enhancer assays, so the explanation now attributes each part to its actual source.


  summary: Extend phenotype coverage to the zeugopod branch of the ZRS spectrum
  details: |
    Extends phenotype coverage from the autopod-only bundle inherited from the TPT-PS scoping to both limb segments, now that the entry is scoped to the whole ZRS gain-of-function locus.

    New pathograph node: Disrupted Zeugopod Element Specification, downstream of Ectopic Limb-Bud SHH Regulatory Activity. It is deliberately modelled as a lesion-class-dependent edge rather than a universal consequence, because Wieczorek et al. show the two arms of the same study in opposition: ZRS position-404 point variants drive strong ectopic SHH expression and reach the zeugopod, while complete ZRS duplications "do not affect lower limb development" (PMID:19847792). That contrast is the branch point separating Werner mesomelic syndrome from the duplication phenotypes, so the mechanism model now carries it explicitly.

    Six phenotypes added. Autopod: Mirror Image Foot Polydactyly (HP:0010691, Laurin-Sandrow) and Absent Thumb (HP:0009777, Werner and Haas-type). Zeugopod: Tibial Hypoplasia or Aplasia (HP:0005772), Fibular Duplication (HP:0010503), Mesomelic Limb Shortening (HP:0003027) and Patellar Aplasia (HP:0006443). All twelve phenotypes are causally connected, and every subtype now has phenotype coverage.

    One feature is deliberately left uncurated. Nasal defects are part of the Laurin-Sandrow definition, but ZRS is limb-specific and no curated mechanism in this entry reaches the face; adding the phenotype would attach a node asserting a causal path the evidence does not support. It is described in the subtype entry and raised as the lss_nasal_defects_outside_limb_enhancer_scope KNOWLEDGE_GAP, which sets out the two candidate explanations worth testing.

    Snippet verification rose from 42/42 to 55/55. Connectivity for this file is 12/12 phenotypes and no dangling pathograph targets.

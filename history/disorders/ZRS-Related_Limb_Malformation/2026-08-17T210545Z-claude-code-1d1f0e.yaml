  summary: Add mondo_mappings; fix disease_inventory exporter's non-exact fallback
  details: |
    Added mappings.mondo_mappings (skos:narrowMatch) for the six subtype MONDO terms (isolated triphalangeal thumb, PPD2, TPT-PS, Haas-type syndactyly IV, Laurin-Sandrow, Werner mesomelic), following the WAPL-/TRIO-Related precedent for locus-generic entries without a disease_term. PR review (ai4c-reviewer) found this silently re-grounded the entry's exported mondo_id via disease_inventory.py's permissive fallback, which treated any non-exactMatch mapping as an anchor and picked the first by list order -- undermining the entry's deliberate disease_term omission recorded in the mondo_no_zrs_spectrum_class discussion. Fixed by restricting src/dismech/export/disease_inventory.py::_resolve_mondo's fallback to skos:exactMatch only (a general fix, not ZRS-specific: it also corrected the same latent ambiguity for 9 other entries relying on closeMatch/relatedMatch fallback). Added a regression test (test_non_exact_mappings_do_not_resolve_disease_mondo_id). Verified via a full-KB build_inventory() run that ZRS now reports has_mondo=false again and no entry is silently anchored via a non-exact mapping.

  summary: Retarget from TPT-PS entity to the locus-level ZRS gain-of-function spectrum
  details: |
    Renamed kb/disorders/Triphalangeal_Thumb_Polysyndactyly.yaml to kb/disorders/ZRS-Related_Limb_Malformation.yaml and moved the three prior history records into the successor directory with target.superseded_by blocks.

    Rationale: the curated pathograph - ectopic limb-bud SHH regulatory activity disrupting anterior-posterior digit number and identity - is locus-generic, not TPT-PS-specific. It is shared by preaxial polydactyly type 2, Haas-type syndactyly IV, Laurin-Sandrow syndrome, Werner mesomelic syndrome and isolated triphalangeal thumb, and a single ZRS allele produces several of them within one kindred (PMID:24777739). Wieczorek et al. proposed "ZRS-associated syndromes" as the cover term for this continuum (PMID:19847792). Under a pathograph-lumping KB the prior scoping split one mechanism across an entity boundary the literature does not support.

    Changes: six grounded subtypes added via has_subtypes/subtype_term (MONDO:0008605, MONDO:0008270, MONDO:0017454, MONDO:0008515, MONDO:0007615, MONDO:0008572); the six existing autopod phenotypes tagged to the subtypes they occur in; autosomal recessive inheritance added for the homozygous ZRS 402C>T Werner phenotype, restoring dosage-effect content the prior narrow scoping had deleted as out of boundary; genetic section reframed on OMIM's actual locus-assignment rule, which splits this spectrum between the ZRS locus entry (OMIM:620738, for enhancer sequence variants) and LMBR1 (OMIM:605522, for structural lesions of the interval); the "not PPD2" identity framing removed, since PPD2 is now in scope; stale ORPHA:2950 corrected (deprecated, moved to ORPHA:988).

    Two gaps recorded as discussions rather than papered over: mondo_no_zrs_spectrum_class (no MONDO class covers the spectrum, so disease_term is omitted, following 22 other disorder entries) and zrs_regulatory_element_not_groundable (ZRS has no HGNC identifier and the schema has no regulatory-element descriptor, so the entry is grounded on hgnc:13243 LMBR1 despite LMBR1 being a bystander).

    Outcome is needs_followup: the zeugopod phenotypes defining the Werner branch (tibial hypo- and aplasia, fibular duplication, mesomelic shortening) and the mirror-image foot phenotype defining Laurin-Sandrow are described in subtype entries but not yet curated as phenotype records with pathograph edges.

    reason: >-
      These sessions curated the entry as the TPT-PS syndrome entity. Later review in
      the same PR (#8676) established that TPT-PS is one phenotypic branch of a single
      ZRS gain-of-function allelic series rather than an independent pathograph. The
      curated mechanism - ectopic limb-bud SHH regulatory activity disrupting digit
      number and identity - is locus-generic: it is shared with preaxial polydactyly
      type 2, Haas-type syndactyly IV, Laurin-Sandrow syndrome, Werner mesomelic/tibial
      hypoplasia and isolated triphalangeal thumb, and a single ZRS allele produces
      several of these within one kindred (PMID:24777739). The entry was therefore
      retargeted to the locus-level spectrum ZRS-Related_Limb_Malformation, retaining
      the named entities as grounded subtypes.

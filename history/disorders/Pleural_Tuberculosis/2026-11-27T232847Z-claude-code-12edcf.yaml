  summary: 'Create: Pleural_Tuberculosis'
  details: |
    Created the pleural tuberculosis (tuberculous pleuritis / tuberculous pleural effusion, MONDO:0005922) entry covering the common paucibacillary lymphocytic effusion. Tuberculous empyema (MONDO:0005999) is recorded as a pointer subtype with curated_in Tuberculous_Empyema. Pathograph: pleural seeding by subpleural focus rupture, early neutrophilic influx, Th1 delayed-type hypersensitivity (conforms to granuloma_formation Th1 node), capillary leak, pleural granulomas (conforms to granuloma_formation Organized Granuloma Assembly) and impaired lymphatic clearance producing the exudate, paucibacillary containment with persistent bacilli leading to later active TB if untreated, and pleural fibrosis with residual thickening. Diagnosis rows cover fluid analysis, ADA (Liang 2008 and Aggarwal 2019 meta-analyses), combined ADA/lymphocyte-neutrophil ratio/biopsy criterion, unstimulated IFN-gamma, Xpert and Ultra, culture and induced sputum, Abrams biopsy, thoracoscopy, tuberculin test and chest radiography. Treatments: standard chemotherapy with alternative and extended regimens, corticosteroids (Cochrane 2017, not recommended; Kaposi sarcoma in HIV), therapeutic drainage (Lai 2003 RCT), fibrinolytics and decortication. Deep research: research/Pleural_Tuberculosis-deep-research-claude_code.md (claude_code, first attempt succeeded), used as leads only; every snippet verified against references_cache. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders.

  summary: 'Create: Myoclonic Epilepsy in Infancy'
  details: |
    Created the MEI entry as a six-node pathograph running from an age-restricted generalized cortical hyperexcitability of infancy through generalized epileptiform discharge time-locked to the jerk, a reflex-sensitivity branch present in a disputed subset, and brief generalized myoclonic seizures, to age-dependent remission and persisting cognitive difficulty in a minority. Two nodes conform to epilepsy_excitation_inhibition_imbalance. Three discussions: the controversy over what produces the cognitive difficulty in roughly a third of children despite seizure remission, which is why ILAE dropped benign from the name; whether reflex myoclonic epilepsy in infancy is a variant or a separate entity, with the reflex group developmentally normal in all reported cases; and the unknown genetic basis. No genetic section is included because no gene is established, and the falcon deep-research report independently warned against asserting SCN1A, SLC2A1 or YWHAG as causes and against merging this syndrome with familial infantile myoclonic epilepsy. All snippets verified against their own fetched caches.

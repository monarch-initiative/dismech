  summary: 'Create: Usmani-Riazuddin Syndrome (AP1G1), autosomal dominant form curated'
  details: |
    Curated the AP1G1-related neurodevelopmental disorder from the claim issue #12177 (MONDO:0859174, Usmani-Riazuddin syndrome, autosomal dominant).

    Lump/split decision. MONDO carries two AP1G1 terms with no umbrella over them: MONDO:0859174 (autosomal dominant, OMIM 619467) and MONDO:0859196 (autosomal recessive, OMIM 619548), both asserting RO:0004003 to hgnc:555 AP1G1 and both placed directly under MONDO:0003847. Recorded entry_type DISEASE as a single entry named Usmani-Riazuddin Syndrome, with the two inheritance forms as has_subtypes rows, rather than two sibling files. The governing rule is design-decisions section 3: a separate file needs a distinct MONDO identity AND a substantially independent mechanism. The identities are distinct but the mechanisms converge on one complex, and the follow-up literature states the two forms show overlapping clinical features (PMID:41226632) while the founding cohort (PMID:34102099) delineated both in one series and described them as one neurodevelopmental disorder. KB precedent for this shape: Thomsen_and_Becker_disease (CLCN1), COL11A2_Hearing_Loss (DFNA13/DFNB53), Alport_Syndrome. The counter-precedent of two sibling files (POLG PEOA1/PEOB1, UNC13A, LBR) was considered and rejected on the independent-mechanism test.

    Scope honesty. Only the DOMINANT form is curated. The recessive has_subtypes row carries its MONDO and OMIM identity, its gene, its inheritance term and a description that says NOT CURATED in as many words, plus review_notes asking a later curator to populate it or argue the two apart. There was no stub for the recessive form on origin/main, so nothing was retired from the queue by binding MONDO:0859196 here.

    Mechanism. Two dominant allele classes are modelled as separate pathophysiology nodes because they are not the same lesion: AP1G1 Haploinsufficiency (truncating, splice and whole-gene-deletion alleles; the de novo 16q22.2 whole-gene deletion in PMID:38840441 is the cleanest human evidence, since no mutant protein is made) and Dominant-Negative Gamma-1 Adaptin Missense Protein (mechanism_confidence PROVISIONAL; the zebrafish co-injection failure in PMID:41226632 is the direct evidence, and the authors state they have not separated dominant-negative from toxic gain-of-function, which is recorded as a KNOWLEDGE_GAP discussion). Both converge on AP-1 Adaptor Complex Dysfunction, then trans-Golgi cargo sorting failure and endosomal recycling impairment, then neuronal somatodendritic sorting failure and cadherin mis-sorting, then perturbed neurodevelopment and reduced brain growth.

    Connectivity. 8 of 10 phenotypes are causally connected. Abnormal facial shape and Abnormality of limbs are deliberately left unconnected: no study links AP1G1 to craniofacial or limb patterning, and an invented edge would be worse than the gap. Both carry a description saying so.

    conforms_to left unset. list-modules and a grep of kb/modules for clathrin, adaptinopathy, AP-1 complex and trans-Golgi returned only synaptic_vesicle_cycle (presynaptic AP-2 endocytosis) and apical_neuroependyma_integrity_failure. Neither covers AP-1 cargo selection at the TGN. Recorded in notes.

    GeneReviews. No chapter, verified offline with just check-genereviews against the committed Bookshelf index snapshot 2026-09-10 (NO_CHAPTER for GeneReviews and StatPearls). Recorded in notes.

    Evidence. 76 snippets, all exact substrings of five cached references: PMID:34102099 (founding AJHG cohort), PMID:41226632 (IJMS 2025 functional characterization, full text), PMID:37108275 (IJMS 2023 zebrafish ap1g1 knockout, full text), PMID:38665048 (Clin Genet 2024 case report), PMID:38840441 (Dev Med Child Neurol whole-genome-sequencing series). PMID:41420732 was fetched and discarded: it reports an AP1G1 VUS frequency in a small autism cohort, which does not support a disease claim. quote_role BACKGROUND is used on quotes taken from a paper restating the founding cohort's findings.

    Validation. just validate, validate-terms, count-verified-snippets (76/76), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-case-collisions, check-stubs, check-reference-titles, list-gene-term-mismatches (8/8 bindings name AP1G1), prose-figure-audit, normalize-cache, validate-disorders. Stub stubs/Usmani-Riazuddin_Syndrome_Autosomal_Dominant.yaml deleted.

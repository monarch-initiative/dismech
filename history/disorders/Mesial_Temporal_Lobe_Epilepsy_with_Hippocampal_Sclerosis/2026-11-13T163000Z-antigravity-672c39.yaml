  summary: Address PR review findings for Mesial Temporal Lobe Epilepsy with Hippocampal Sclerosis
  details: |
    Added ILAE Type 1, Type 2, and Type 3 Hippocampal Sclerosis histopathological subtypes (DOI:10.1111/epi.12220, PMID:38383054); split Mossy Fiber Sprouting and Circuit Hyperexcitability into atomic Mossy Fiber Sprouting (CL:2000089, GO:0048668, UBERON:0001885) and Hippocampal Circuit Hyperexcitability (CL:0000540, GO:0098976, UBERON:0001954, conforming to epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony) nodes; added Focal Aware Seizure (HP:0002349) and Focal Automatism Seizure (HP:0032898) phenotypes; downgraded Large-Scale Network Reorganization downstream causal-edge correlations (PMID:25809843, PMID:29094314) to directness: INDIRECT; clarified High-Resolution Brain MRI 2D T2 TSE vs supportive FLAIR sequence roles (PMID:38383054); replaced Neuropsychological Memory Evaluation methods snippet with results/clinical findings; retargeted Anti-seizure Medication Pharmacotherapy target_mechanisms to Hippocampal Circuit Hyperexcitability with sodium-channel target evidence (PMID:24014518, DOI:10.32388/zvebpt); and removed duplicate bare reference entries.

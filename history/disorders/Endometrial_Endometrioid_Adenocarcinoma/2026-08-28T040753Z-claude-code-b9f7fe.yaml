    Two changes. First, added a Tamoxifen Therapy for Breast Cancer environmental entry mirroring the one added to Endometrial_Carcinoma, linked to Unopposed Estrogen Signaling, with exposure_term left unbound for the same ECTO gap and the reasoning recorded in the entry notes. Second, resolved node-name drift against the parent entry: this file and Endometrial_Carcinoma modelled the same mechanisms under different labels. Renamed WNT Beta-Catenin Pathway Dysregulation to CTNNB1 WNT Pathway Activation, POLE Ultramutation to POLE Proofreading Defect and Ultramutation, and Immune Checkpoint Vulnerability to Adaptive Immune Resistance (5 occurrences, including two treatment target_mechanisms references). All references to the renamed nodes were internal to this file, confirmed by searching kb/ and history/ before the rename, and the entity-reference foreign-key tests pass afterwards. The last rename also makes the local node name match the module node it already conforms to, immune_checkpoint_blockade#Adaptive Immune Resistance. Six node names are now shared verbatim with the parent entry so the common mechanism is greppable across both files; content remains duplicated rather than inherited, per the non-DRY convention. Mismatch Repair Deficiency and Endometrioid Glandular Neoplasia stay specific to this entry, and the parent's TP53 and serous-like nodes are correctly absent. Extended the notes block to record the convention.

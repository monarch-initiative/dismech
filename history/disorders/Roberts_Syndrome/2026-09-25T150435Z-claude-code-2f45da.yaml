  summary: 'Create: Roberts Syndrome'
  details: |
    New entry for Roberts-SC phocomelia syndrome (MONDO:0100253; ESCO2 spectrum
    disorder), replacing the stub stubs/Roberts-SC_Phocomelia_Syndrome.yaml.

    Scope. Roberts syndrome (OMIM 268300) and SC phocomelia (OMIM 269000) are
    curated as one disease with no has_subtypes: MONDO:0100253 carries both OMIM
    identifiers, GeneReviews treats them as one spectrum, and the two share the
    gene, the truncating allele class and the cytogenetic sign. Juberg-Hayward
    syndrome (MONDO:0008992) is recorded as an allelic differential, consistent
    with kb/disorders/Humeroradial_Synostosis.yaml, which treats it as a
    separate ESCO2 disorder.

    Sources. The GeneReviews chapter "ESCO2 Spectrum Disorder" (PMID:20301332,
    NBK1153) is tagged and cited for all four abstract sections: clinical
    characteristics (phenotypes), diagnosis (molecular and cytogenetic testing),
    management (limb, cleft, craniofacial, feeding, speech and surveillance
    treatments) and genetic counseling (inheritance and recurrence risk). The
    OpenScientist deep-research report
    (research/Roberts_Syndrome-deep-research-openscientist.md; 16/16
    references resolved, no unresolved terms) was read in full and its
    citations used where they support a claim: PMID:16380922, 21637801,
    26710928, 26729373, 30204960, 31935221, 32783269, 34989322, 34897432,
    25378554 and 27803161. Not used: PMID:40668332 (sorbitol as a chemical
    chaperone in the yeast eco1-W216G model; a single yeast study with no
    animal or clinical data, so not added as a treatment), PMID:40396618
    (Nipbl knockdown and the CRL4 axis in zebrafish; it concerns NIPBL, the
    Cornelia de Lange gene, and adds nothing ESCO2-specific beyond
    PMID:34989322, which is cited) and PMID:31516082 (cohesinopathy review
    centred on Cornelia de Lange syndrome and CAID syndrome). The report gives HGNC:24645 for ESCO2; HGNC's identifier
    is hgnc:27230, which is the one bound here. The report's HP suggestions
    HP:0000119 and HP:0001028 were not used; more specific terms were bound.
    The remaining references were found by PubMed search.

    Pathograph. ESCO2 loss of function -> reduced SMC3 acetylation -> failed
    pericentric cohesion -> (premature centromere separation; prolonged
    mitosis and missegregation -> aneuploidy and p53 activation; nucleolar
    dysfunction -> mTORC1 repression; transcriptional dysregulation) -> p53 ->
    progenitor apoptosis and limb-bud vascular disruption -> limb bud
    outgrowth failure, deficient craniofacial primordium growth and cortical
    progenitor loss -> phenotypes. Five mechanistic_hypotheses record the
    competing models (mitotic failure and apoptosis, ribosome biogenesis and
    translation, transcriptional dysregulation, vascular disruption,
    macromolecular damage), including the refuting observations (no cell-cycle
    lengthening in patient lymphoblastoid lines, PMID:18411254; p53 inhibition
    rescuing limb hemorrhage but not chondrogenesis, PMID:39168984). The
    cortical node conforms to
    neural_progenitor_centrosome_spindle_dysfunction#Progenitor Pool
    Distortion, on the strength of the Emx1-Cre Esco2 mouse (PMID:33798452).
    No cohesinopathy module exists in kb/modules/.

    Terms. Neonatal death (HP:0003811) is outside the PhenotypeTerm enum
    (HP:0000118), so the perinatal-death phenotype carries no term. Premature
    centromere separation has no HPO term (ols:hp search "premature
    centromere division" returned nothing) and is bound to HP:0031411 Abnormal
    chromosome morphology. Ear malformations and malignancy are coarse
    bindings with coarse_binding_basis SOURCE_UNSPECIFIED, following the
    GeneReviews list sentences.

    Validation: just validate, just validate-terms, just
    count-verified-snippets (all snippets verified), check-entity-refs,
    check-causal-targets, check-coarse-phenotypes, check-qualifier-terms,
    list-gene-term-mismatches, check-duplicate-keys, check-snippet-length,
    check-title-snippets, check-folded-hyphens, check-reference-titles, and
    just validate-disorders on the entry.

  details: |
    PR #9475 review round, run by the PR Shepherd. (1) Repaired the CRITICAL cache corruption the reviewer found: three unrelated cache/mondo/terms.csv rows had been re-encoded latin-1-as-UTF-8 by the original curation session (MONDO:0009145 Schoepf-Schulz-Passarge, MONDO:0100163 COVID-19-associated MIS-C, MONDO:0800043 Stuve-Wiedemann syndrome 1). All three restored from main; the cache diff against main is now purely additive (5 new rows, 0 removed). Confirmed the collateral damage is cleared: just validate-terms now passes on IL6ST-Related_Stuve-Wiedemann_Syndrome, LIFR-Related_Stuve-Wiedemann_Syndrome, Odonto-Onycho-Dermal_Dysplasia and Multisystem_Inflammatory_Syndrome_in_Children_MIS-C. (2) Added the three phenotypes the reviewer identified as missing: Constriction of peripheral visual field (HP:0001133), evidenced by the PMID:28056120 abstract sentence already quoted elsewhere in the entry, with a reports_on link to Progressive Visual Field Loss and Blindness; Cystoid macular edema (HP:0011505, 21.2 percent of patients) and Cataract (HP:0000518, 13 of 33 patients) from PMID:35743231. (3) Correction to the record dated 2026-08-25T154738Z, which is left unedited because history is append-only: that record states the pathograph has 7 nodes, and it has 6. It also states that the no-full-text gate used by validate-disorders matches only a cached paper's printed abstract paragraph and not its extracted body. That is not the behaviour observed here: both new PMID:35743231 snippets are body text from a full_text_xml cache record, and just validate-disorders reports 48/48 verified. Evidence dropped from the original curation on that belief may be recoverable. (4) Bound cataract to HP:0000518 rather than the HP:0000523 Subcapsular cataract row this PR added to the cache, because the source says only cataract surgery and does not specify a subcapsular lens opacity; binding the narrower term would assert a specificity the source does not carry. The unused HP:0000523 cache row is left in place rather than hand-deleted, per the never-hand-edit-cache-rows rule. (5) Added the two reports_on links the reviewer suggested as non-blocking: Rod-cone dystrophy to Secondary Cone Dysfunction and Degeneration, Pigmentary retinopathy to Rod Photoreceptor Apoptosis and Progressive Degeneration. Phenotype causal_inlink coverage for this entry goes from 2 of 6 to 6 of 9. (6) Merged origin/main, resolving additive conflicts in cache/hp/terms.csv and cache/mondo/terms.csv by keeping every unique row from both sides and taking main's value for rows present on both. Validation: just validate-disorders passed clean (schema, terms, references, 48/48 snippets verified); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-term-cache-integrity and check-case-collisions all OK.

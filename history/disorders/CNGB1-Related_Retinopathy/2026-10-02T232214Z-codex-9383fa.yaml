  summary: Review CNGB1 retinopathy clinical spectrum, channel mechanisms and
    preclinical rescue evidence
  details: |
    Reviewed an existing genetic disorder with no prior REVIEW history event. Infectious and environmental exclusions do not apply. Rebased the isolated review branch onto origin/main 093f725 before edits and checked the open PR inventory for overlapping CNGB1 curation.

    Source audit: read the complete cached scientific bodies of PMID:35743231 (2022 natural history), PMID:33847019 (2021 mutation review/cohort; also the clinical table), PMID:20126465 (splice experiment), PMID:38086857 (conditional late rescue), and the 2018 olfactory full text at PMC6136054. Read the scientific body, methods, results, discussion and legends of the 2021 AAV5 mouse study at PMC8819509 (PMID:34376057 abstract also fetched). Read the 2023 dog/primate paper PMID:37056049 through the clinical/preclinical results, discussion and principal methods. Targeted full-text reading of PMID:24015210 covered canine genetics, results and NMD interpretation; targeted reading of PMID:29202463 covered patient/model results, genotype/transcript findings, rescue follow-up, imaging and translational limitations. Read the recovered Hull accepted manuscript's clinical/molecular results and discussion. Read the general GeneReviews NBK1417 clinical baseline, molecular evaluation, care/surveillance and recessive counseling sections. Remaining older PMID sources were assessed from their complete cached abstracts. Supplementary files and the full variant catalogue table were not independently audited. Full-text retrieval attempts for the original 2005 mouse paper and 2012 rescue paper did not yield usable full text on these fetches; their abstract-level evidence remains scoped accordingly. No matching deep-research artifact was found for this existing entry.

    Corrected the dated 84-variant count to distinguish 59 pathogenic/likely pathogenic alleles from 25 VUS, and distinguished arRP case fractions from all-IRD clinic denominators. Corrected onset/clinical denominators, formal field loss versus symptomatic recognition, variable rod ERGs, imaging-endpoint limitations and cataract-age missingness. Added anosmia separately from hyposmia, epiretinal membrane, optic-disc pallor, color-vision defect and reduced acuity. Retained cohort-specific rates without pooling potentially overlapping cohorts. Did not infer bulb agenesis, progressive olfactory-neuron loss or CNGB1 causality for an individual's glaucoma/high-myopia complications.

    Removed CNGA1-mutant Xenopus evidence incorrectly used as direct CNGB1-loss evidence. Split channel abundance, rod response impairment, cGMP accumulation, rod loss, gliosis, synaptic ribbon loss and impaired ganglion-cell signaling. Added variant-specific protein-instability evidence and a qualified olfactory signaling mechanism. Removed the calcium-overload module conformance because the channel-deficiency evidence does not establish calcium overload; did not invent a known molecular chain from cGMP accumulation to cell death. Corrected model/readout targets and qualified cross-species fidelity. The 2013 dog NMD prediction is superseded by the 2018 demonstration of partial transcript escape and truncated protein; the model is not transcript-null. Separated 2018 dog ERG follow-up (18 months) from protein/structural follow-up (23 months), and from the 2023 construct's 12-month functional follow-up. Added AAV5 mouse dose limitations and the dog inflammatory adverse event. Primate reporter expression is not therapeutic rescue. Conditional endogenous rescue is distinct from AAV treatment and does not define human eligibility thresholds.

    Actively mined and tagged general RP GeneReviews guidance for low-vision rehabilitation, complication-directed CME/cataract treatment, ophthalmic surveillance, molecular evaluation and recessive counseling. Did not transfer outdated supplement or device recommendations. Added NCT04639635 as observational natural history, not an interventional gene-therapy study. ClinicalTrials.gov API checked 2026-10-02: SUSPENDED, reason IRB renewal lapsed, update posted 2026-04-13. Reference caches were generated only with the repository fetcher; unavailable/CAPTCHA and redundant unsuccessful fetches are excluded from the PR. Repository validation may normalize cached whitespace; no cache text was authored by the reviewer.

    Validation before PR: schema, ontology terms and all 93 evidence quotations/114 titles passed. All added evidence has reference titles and quote-role/directness grading. The 23 repository QA gates pass after expanding a short structured registry quote. Two targeted disorder/entity-reference tests pass; history validation, snippet-boundary audit, title/source checks and page rendering pass. Generated HTML is excluded. Commit-hook results are recorded in the PR summary.

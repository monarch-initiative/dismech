  summary: 'Create: CNGB1-Related Retinopathy'
  details: |
    Curated CNGB1-Related Retinopathy (MONDO:0800403, RP45) from independent PubMed literature sourcing (falcon deep-research provider requires the disorder file to pre-exist, so manual PubMed/NCBI E-utilities search plus just fetch-reference caching was used instead). Sourced 12 PMIDs: founding gene-discovery paper (Bareil 2001, PMID:11379879), Cngb1-knockout mouse (Huttl 2005, PMID:15634774), CNGA1-CNGB1 intersubunit trafficking mechanism (Trudeau and Zagotta 2002, PMID:11970862), two clinical characterization series (Hull 2017 PMID:28056120; Radojevic 2021 PMID:33465333), largest natural-history cohort (Jackson/Moosajee 2022, PMID:35743231, n=33), olfactory dysfunction study (Charbel Issa 2018, PMID:29800053), canine model discovery (Ahonen 2013, PMID:24015210), combined patient/mouse/dog gene-augmentation study (Petersen-Jones 2018, PMID:29202463), most advanced translatable AAV5-RHO-CNGB1 gene therapy construct (Occelli 2023, PMID:37056049), and the exon-32 splice mechanism paper (Becirovic 2010, PMID:20126465). Modeled a 7-node pathophysiology chain from CNGB1 loss-of-function through CNGA1 co-degradation, channel loss and cGMP dysregulation, rod apoptosis, secondary cone degeneration, to visual field loss, conforming to phototransduction_cascade_dysfunction and photoreceptor_degeneration modules. Added 6 phenotypes including hyposmia, reflecting CNGB1 dual expression in rod and olfactory CNG channels. Added structured animal_models (mouse and dog) with modeled_mechanisms RECAPITULATES and RESCUES links, treatments, diagnosis, epidemiology (about 4 percent of autosomal recessive RP), and progression sections. Validation: just validate-disorders passed clean; 45 of 45 snippets verified against references_cache. Note for future curators: the strict no-full-text reference-validation gate used by validate-disorders only matches snippets against each cached paper printed abstract paragraph, not its full extracted body text, even for full-text-cached papers; several evidence items were revised to quote abstract-paragraph text only, or moved to an abstract-only source, after this was discovered empirically. Also worked around bracket-stripping behavior for one snippet and removed evidence items containing extended Unicode characters (Greek beta) that failed byte-level matching in the strict validator despite being confirmed present via direct Python substring checks.

  summary: Add diagnosis section; delete curated stub
  details: |
    Added a three-node diagnosis section to Frank-Ter Haar syndrome (SH3PXD2B): (1) clinical/radiographic recognition of the characteristic craniofacial-ocular-skeletal constellation (brachycephaly, prominent forehead, hypertelorism, megalocornea +/- glaucoma, long-bone bowing, prominent coccyx); (2) ophthalmologic evaluation for megalocornea/congenital glaucoma as a frequent early presenting feature where early treatment preserves vision; (3) molecular confirmation by SH3PXD2B gene/exome sequencing, modeled honestly to capture both that biallelic LOF establishes the diagnosis AND that an SH3PXD2B-negative result does not exclude FTHS (genetic heterogeneity), distinguishing the SH3PXD2B-positive from the SH3PXD2B-negative end of the FTHS/Borrone spectrum. Eight EvidenceItems, all exact-substring snippets from already-cached references (PMID:15523657, 31809395, 31978614, 20137777, 24105366); no new fetches. diagnosis_term bound to NCIT clinical-action terms already in the enum cache (C20989 Physical Examination, C38060 Eye Examination, C15709 Genetic Testing). Also committed the deletion of stubs/Frank-Ter_Haar_Syndrome.yaml (the stub this PR curates), which had not been committed on the branch. Validation: validate, validate-terms, count-verified-snippets (44/44), entity-refs, causal-targets, enum-values, qualifier-terms, validate-disorders, and the against-ref gates all pass.

  summary: 'Create: Frank-Ter Haar Syndrome'
  details: |
    Curated a new Disease entry for Frank-Ter Haar syndrome (MONDO:0009579, SH3PXD2B) from the stub queue, resolving entry_type as DISEASE. Five pathophysiology nodes run from TKS4 adaptor loss of function, through incomplete podosome formation with failed MT1-MMP recruitment, to defective pericellular matrix remodelling, which then branches to skeletal/craniofacial malformation and fibrotic soft-tissue change. Synonym discipline was the main curation issue. The stub carried two synonyms requiring opposite treatment: Borrone dermato-cardio-skeletal syndrome is a genuine partial synonym, since linkage and sequencing in two BDCS kindreds found homozygous SH3PXD2B mutations with complete protein loss and the authors conclude a proportion of BDCS and FTHS are allelic, so its literature is usable; whereas autosomal recessive Melnick-Needles syndrome is a historical misattribution, since Melnick-Needles is X-linked FLNA, and its literature must not be imported. Both decisions are recorded in notes. Genetic heterogeneity is stated explicitly rather than smoothed over, since only 7 of 13 founding families carried SH3PXD2B mutations, and the pathograph is keyed on TKS4 loss rather than genotype because a mutation-negative individual still showed reduced TKS4 protein. Two animal models carry modeled_mechanisms links: the Tks4-null mouse RECAPITULATES the malformation node, and the pretzel zebrafish PARTIALLY_RECAPITULATES the fibrotic node with typed SPECIES_MISMATCH and BOUNDARY_OMISSION divergences taken from the authors own stated caveats. The matrix-accumulation explanation for facial coarsening and refractory glaucoma is marked directness INDIRECT because the source frames it as a hypothesis. All 28 evidence snippets verified against the local reference cache; schema and term validation pass.

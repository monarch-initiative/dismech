  summary: 'Create: Frank-Ter Haar Syndrome (SH3PXD2B)'
  details: |
    De novo curation of Frank-Ter Haar syndrome (MONDO:0009579), autosomal recessive, causative gene SH3PXD2B (hgnc:29242, product TKS4). Pathophysiology modeled as a causal chain: biallelic SH3PXD2B loss of function -> defective podosome formation -> impaired MT1-MMP-dependent extracellular-matrix degradation/remodeling -> abnormal connective-tissue/skeletal/ocular/cardiovascular morphogenesis. Deep research: requested falcon (Edison) with --fallback; falcon returned HTTP 402 (account out of credits), the openscientist fallback then timed out (3600s), and a claude_code deep-research report was subsequently run and is the committed report (research/Frank-Ter_Haar_Syndrome-deep-research-claude_code.md). Evidence sourced independently from PubMed and verified against cached abstracts (36/36 snippets verified). Human clinical evidence: Iqbal 2010 AJHG (PMID:20137777, seminal SH3PXD2B/TKS4 discovery), Wilson 2014 EJHG (PMID:24105366, Borrone allelic, LOF), Bendon/further-delineation 2004 AJMG (PMID:15523657, craniofacial/skeletal feature list), severe-case+review 2020 (PMID:31978614, ECM-accumulation mechanistic hypothesis, prevalence ~40 cases), congenital-glaucoma sib pair 2020 J Glaucoma (PMID:31809395, phenotypes + trabeculotomy/trabeculectomy treatment). In vitro: Buschman 2009 MBoC (PMID:19144821, TKS4 required for podosome formation and ECM degradation, MT1-MMP recruitment). Model organism: Sh3pxd2b nee mouse (PMID:21282566) added as an animal_model with modeled_mechanisms linking to the Glaucoma node; also cited on the ECM->morphogenesis edge. GeneReviews: PubMed search returned no GeneReviews chapter for FTHS (documented absence). Validation: just validate, just validate-terms, just count-verified-snippets (36/36), check-entity-refs, check-causal-targets, check-qualifier-terms, and just validate-disorders all pass.

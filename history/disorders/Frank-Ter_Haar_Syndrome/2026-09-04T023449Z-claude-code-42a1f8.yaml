  summary: Address review on Frank-Ter Haar Syndrome
  details: |
    Acted on the REQUEST_CHANGES review from ai4c-reviewer on PR 10852. Connected the pathograph: Hypertelorism, Scoliosis and a new Wide Anterior Fontanelle phenotype now hang off Skeletal and Craniofacial Malformation, and Megalocornea off Defective Pericellular Matrix Remodelling. Developmental Delay is deliberately left unconnected with the reasoning recorded in its description, since no source proposes a route from matrix remodelling failure to impaired neurodevelopment. Removed the Brachydactyly phenotype entirely: the reviewer was right that its quote said only skeletal malformations, and on checking, no reference in the set mentions brachydactyly at all. Replaced it with Camptodactyly, which is what the literature actually reports, supported by a newly fetched clinical review naming flexion deformity of the fingers plus the existing case report naming camptodactyly. Added PMID:21453629, whose main-clinical-features sentence supplies independent support for hypertelorism, wide fontanels, kyphoscoliosis, congenital heart defects, macrocornea and developmental delay, addressing the single-case-report frequency concern across several phenotypes. Dropped the guessed OCCASIONAL frequency on Developmental Delay since the sources say variable severity without a denominator. Added the three missing sections from quotes already in cache: a CASES_IN_LITERATURE prevalence record at ULTRA_RARE, a diagnosis block for molecular confirmation, and treatments recording supportive care and refractory glaucoma management with no target_mechanisms link because no intervention acts on the mechanism. Regraded four PMID:33234702 background sentences from HUMAN_CLINICAL to OTHER per the reviewer, which surfaced a snippet-grading divergence on a fifth instance that was then made consistent. Declined the fibrotic_response conformance suggestion: that module node requires TGF-beta-driven myofibroblast activation upstream, which this disease does not have, so conformance would be a false claim. All 42 snippets verified; schema, term, grading, length and offline gates pass.

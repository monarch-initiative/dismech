  summary: Split BRAF V600E detection into molecular and VE1 IHC codes (tranche F
    batch 4)
  details: |
    LOINC tranche F batch 4. The bundled 'BRAF V600E Mutation Detection' row named PCR, VE1 IHC, and NGS together in one row; split it into two since Biochemical.loinc_term is singular and PCR/NGS (molecular methods) are a genuinely different test from VE1 immunohistochemistry (an antibody stain). Bound LOINC:58415-1 (BRAF gene p.Val600Glu [Presence] in Tissue by Molecular genetics method, reused from BRAF_V600E_Mutant_NSCLC and BRAF_Mutant_Thyroid_Cancer in this same tranche) on the molecular row, and LOINC:85299-6 (BRAF V600E mutant protein [Presence] in Cancer specimen by Immune stain, reused from BRAF_V600_Mutant_Melanoma in tranche F batch 1) on the VE1 IHC row. Bound 'MSI/MMR Testing' to LOINC:81711-4 (Microsatellite instability marker panel - Cancer specimen, reused from MSI_High_Colorectal_Cancer in tranche F batch 2): this row names 'MSI/MMR status' generically without naming individual MMR proteins the way the dedicated MSI-H entries do, so no four-protein IHC split was made here. All three codes already existed on other branches but were newly seeded on this one. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

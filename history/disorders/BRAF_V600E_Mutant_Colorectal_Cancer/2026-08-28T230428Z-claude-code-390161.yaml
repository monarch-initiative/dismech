  summary: 'Detailed evidence review: BRAF V600E-Mutant Colorectal Cancer'
  details: |
    Full evidence review of kb/disorders/BRAF_V600E_Mutant_Colorectal_Cancer.yaml. All 62 evidence items were checked against all 64 unique cited references (42 PMIDs, 20 DOIs, CIVIC_ASSERTION:20, CIVIC_EID:126): every PMID and CIViC cache file was re-read (title plus abstract/content), and each item was verified for exact-substring snippet match (mechanical check: 47/62 verified against cache, the remaining 15 being DOI-prefixed items that the snippet auditor skips by configured prefix and that cannot be cache-verified), semantic support of the attached claim, supports grading, evidence_source classification, reference_title agreement with cache frontmatter (just check-reference-titles and just check-title-snippets reported no findings for this file), and named-entity confusion (confirmed the CIViC records target BRAF V600E in colorectal cancer, not melanoma/NSCLC, and that quotes about generic CRC are only attached to generic-CRC claims). Thirteen evidence_source misclassifications were found and fixed, all in the deep-research references index: PMID:25005754 (770-patient human cohort sequencing study) and PMID:29540830 (narrative review of human cancer genomics) were graded COMPUTATIONAL though neither reports computational work, both corrected to HUMAN_CLINICAL; nine items quoting sentences that state human clinical or epidemiologic findings (patient mutation frequencies, survival, trial efficacy) from human clinical studies were graded OTHER and corrected to HUMAN_CLINICAL (PMID:27312529, PMID:34249672, PMID:35696748, PMID:36368253, PMID:37455182, PMID:37815847, PMID:38553360, PMID:39935752, PMID:41677963); DOI:10.3389/fonc.2024.1349572 (epidemiologic claim from a systematic review/meta-analysis) OTHER corrected to HUMAN_CLINICAL; and DOI:10.5772/intechopen.1004189, whose quote is a review scope self-description rather than clinical data, HUMAN_CLINICAL corrected to OTHER. Borderline OTHER gradings on purely generic background sentences were deliberately left unchanged to avoid churn. Minor observations, no change made: the histopathology Adenocarcinoma item cites a general colon-cancer sentence from an adenosquamous-carcinoma case report (PMID:35613396) - the quote genuinely states the claim though the host paper is about a different histology; the 15 DOI-referenced snippets in the references index remain unverifiable by the offline snippet auditor. Post-edit validation: just validate passed; just count-verified-snippets 47/62 verified (15 skipped by DOI prefix).

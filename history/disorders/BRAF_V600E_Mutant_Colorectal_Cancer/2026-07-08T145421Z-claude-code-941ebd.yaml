    Added regimen_term (bound to the NCIT RegimenTerm dynamic enum) to a treatment that follows a named combination chemotherapy protocol, as an illustrative backfill accompanying the decision (documented in CLAUDE.md) to keep regimen_term reserved for named multi-drug regimens with their own NCIT identity (e.g. ABVD, R-CHOP, CHOP, FOLFIRINOX), distinct from treatment_term (the action) and therapeutic_agent (individual drugs/classes). Where a therapeutic_agent list was already present but missing an agent explicitly named in the regimen (rituximab for R-CHOP, bevacizumab for FOLFOXIRI+Bev), added it. Validated with just validate-disorders.

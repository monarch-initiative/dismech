  summary: 'Create: Neurodevelopmental disorder with hypotonia, seizures, and absent
    language (HECW2)'
  details: |
    New entry for MONDO:0014995 (OMIM:617268), the HECW2 disorder. Lump/split: no MONDO descendants and one causal gene, so a single Disease; the dominant de novo missense form and the recessive biallelic loss-of-function form (three consanguineous families) are kept together and separated at the pathophysiology level. Sources: the 2016-2017 defining exome series, the 2021 35-case review, case reports (Rett-like, episodic ataxia, West syndrome, DEE, long QT), the three recessive reports, wild-type HECW2 substrate studies in cultured cells (p73, PCNA, lamin B1, HP1, AMOTL1), the Nedl2 knockout mouse and zebrafish hecw2a knockdown. ClinGen classifies HECW2 for the broader complex neurodevelopmental disorder (MONDO:0100038); cited as evidence but not recorded in gene_disease_validity. Validated with just validate, count-verified-snippets (72/72) and validate-terms.

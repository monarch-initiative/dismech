  details: |
    Answers the automated review of PR 15308. Wired seven phenotypes plus gastroesophageal reflux into the pathograph (19 of 22 connected; midface retrusion and the two cardiac phenotypes left unconnected, no proposed mechanism), added a Broad-based gait phenotype, split acetazolamide for episodic ataxia from perampanel, added mexiletine and NCIT:C29576 as long-QT therapeutic agents, replaced the intellectual disability snippet, cited PMID:42489670 for fetal cardiomyopathy and made its description consistent, left PMID:42598698 uncited because of a coexisting 15q25 deletion, and marked the strabismus, nystagmus and episodic ataxia edges indirect. Ran an OpenScientist deep-research report (Falcon is unavailable in this environment); just preflight-dr PASS, 13/13 references resolved. The report agreed with the entry on phenotype frequencies, the AD missense versus AR loss-of-function split and the p73 mechanism; it added PMID:40469502 (trio exome diagnosis), now cited. The report states that no animal model exists, which overlooks the Nedl2 knockout mouse (PMID:25555806) and zebrafish hecw2a knockdown (PMID:33205896) already in the entry; its NCIT treatment codes (C73043, C15401, C15415) resolve to unrelated terms and were not used. Validated with just validate, count-verified-snippets (77/77) and validate-terms.

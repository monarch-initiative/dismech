  summary: Add phenotypes from a parallel curation of this disorder
  details: |
    A second session curated this disorder in parallel with #15308 from claim issue #15302 (openscientist deep research, which fell back from falcon). After #15308 merged, the phenotypes that session found and #15308 lacks were ported here: spasticity, language impairment, developmental regression, developmental and epileptic encephalopathy, EEG abnormality, behavioral problems, self-injurious and aggressive behavior, high pain tolerance, movement disorders, chorea, dysphagia, failure to thrive, cerebellar atrophy, and non-specific facial dysmorphism. Each carries the exact snippets from the earlier session, re-verified against the cache (100/100), and each neurological, behavioural and feeding phenotype is wired from Disrupted Brain Development; facial dysmorphism is left unwired because no node in the entry explains it. In review the new row was displayed as developmental language disorder, and the existing Absent speech row lost its VERY_FREQUENT frequency, because the 100% figure covers language disorder broadly and one family had only mild speech impairment. Not ported, because #15308 already covers them under another term: ataxic gait (Broad-based gait), microcephaly (Secondary microcephaly), fetal hypertrophic cardiomyopathy (Cardiomyopathy), a separate p73 node (in the ligase node description), and an enteric-model discussion (modelled as the Impaired Enteric Nervous System Development node). Both sessions independently reached the same core mechanism and inheritance model.

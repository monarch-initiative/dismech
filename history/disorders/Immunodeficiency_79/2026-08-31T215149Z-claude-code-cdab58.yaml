  summary: 'Create: Immunodeficiency 79 (CD4 deficiency)'
  details: |
    De-novo curation of immunodeficiency 79 (MONDO:0030981, CD4) resolving curation claim #10293. The pathograph deliberately does not run CD4 loss straight to broad infection susceptibility, because that is the prediction the disease refutes: it routes through the compensatory TCR-alpha-beta+ CD4-CD8- helper population, which is phenotypically and transcriptionally Th-like and retains intact HLA class II-restricted responses and B cell help, and hangs the two narrow susceptibilities (human papillomavirus, Tropheryma whipplei) off what that compensation fails to cover. Three knowledge gaps recorded: why those two organisms specifically; whether MONDO's placement of this concept under severe combined immunodeficiency is right given a phenotype dominated by warts and sometimes first diagnosed at age 61; and whether the shorter LCK-binding CD4 isoform can be used to dissect the co-receptor's two roles. Deep research: one OpenScientist run was commissioned and is committed, but NONE of its content was used - the report is about a different disease, claiming biallelic germline TET2 loss of function as the cause of IMD79. MedGen links MONDO:0030981/OMIM:619238 to CD4 (Gene 920), and the report cites OMIM 619223. just preflight-dr scores CD4=3 against TET2=93 and flags the OMIM mismatch. Note the report's own frontmatter reports confabulation_rate 0.0 with 14/14 references resolved, so identifier resolution gave no warning here. Evidence for this entry comes from the primary CD4-deficiency literature instead: PMID:38557723 (seven patients, five families) and PMID:33471124 (the founding translation-initiation-codon family), both fetched and quote-verified. Reported the case on issue #9888 (research-disorder sends an empty mondo_id, so a numbered disease name has nothing to anchor on). Validated with just validate (18/18 snippets verified), just validate-terms, check-entity-refs, check-duplicate-keys, check-enum-values and the snippet/folded-hyphen gates.

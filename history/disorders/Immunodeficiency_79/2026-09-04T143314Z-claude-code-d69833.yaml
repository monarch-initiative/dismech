  summary: 'Review response: pathograph, full-text re-curation, CHRONIC grounding,
    exclusivity hedging'
  details: |
    Four review-response sessions on PR #10304, following the CREATE record. Round 1 connected all phenotypes to the pathograph with bare-name downstream targets. Round 2 re-curated the entry from the cached full text of PMID:38557723, which the first pass had read only as far as the abstract: added Recurrent Mycobacterial Infections HP:0011274, Chronic Oral Candidiasis HP:0009098, Severe Viral Pneumonia HP:0002090, Chronic Diarrhea HP:0002028 and Arthralgia HP:0002829; added doxycycline and hydroxychloroquine treatments; replaced GO:0019886 with GO:0002456 and GO:0030183; and recorded PMID:33471124's contrary conclusion about B cell, monocyte and NK impairment as a REFUTE item with a fourth knowledge gap, since the 2021 single-family report and the 2024 seven-patient cohort disagree about the non-T compartments. Round 3 grounded temporality CHRONIC on the Chronic Diarrhea phenotype, which had asserted it over a quote saying only recurrent fever and diarrhea; P4's sentence is the only place the report calls the diarrhoea chronic, and it also supplies a second independent occurrence. The same round hedged four passages that presented HPV and Tropheryma whipplei as the only two susceptibilities: the paper concludes CD4 is indispensable at least against those two, and the node itself carries six downstream edges including mycobacterial disease and cryptosporidiosis, so the prose was contradicting its own graph. Round 4 fixed an internal inconsistency introduced by round 3, where the Chronic Diarrhea description still asserted chronicity for P2 while the evidence explanation directly below it said that sentence does not establish it. Validated with just validate (29 of 29 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading.

  details: |
    Created the CMH28 (FHOD3, MONDO:0030317) entry from the validated claude_code deep-research report (falcon fallback; preflight PASS, 23/23 references resolved). Key sources: Ochoa 2018 founding cohort PMID:30442288 (3,189 probands, LOD 7.92, coiled-coil hotspot, 82% ASH, 14% LVEF<50%, 16% hypertrabeculation), Ochoa 2020 exon 15-16 CNVs PMID:32335906, Balkan founder c.1646+2T>C PMID:38051749, Chinese cohort PMID:33586461, p.S527del family PMID:31742804, LVNC family PMID:35205353, p.Arg637Gln intermediate-effect allele PMID:38160043 and PMID:40879562, ClinGen Definitive (CGGV assertion for MONDO:0005045; PMID:39971408, preprint PMID:39132495), mechanism/model papers PMID:19706596, 21149568, 23213483, 29158260, 29686099, 40663059, 41540467, 23255317. Pathophysiology chain: heterozygous non-truncating FHOD3 variant (functional impact UNKNOWN) -> perturbed FHOD3L actin assembly -> sarcomere disorganization (conforms to cardiomyopathy_maladaptive_remodeling Primary Cardiomyocyte Insult) -> reduced contractility and CaMKII activation -> maladaptive hypertrophic remodeling (conforms to Ventricular Remodeling) -> ASH/HCM/fibrosis/heart failure; separate hypothetical trabecular-compaction node -> LV noncompaction. ClinGen tier not recorded in gene_disease_validity because the assertion is for MONDO:0005045, not MONDO:0030317. GeneReviews check --online: NO_CHAPTER. Stub deleted. Validation: just validate pass, count-verified-snippets 100% verified, entity-refs, causal-targets, enum-values, duplicate-keys, snippet-length/grading/title, coarse-phenotypes and model-scale-audit OK; validate-disorders run as final gate. Review round 1 fixes: added FHOD3 gene and GO:0051015 actin filament binding (modifier ABNORMAL) on the actin-assembly node so the gene-activity grounding gate passes for all three genetic rows; added INDIRECT plus the FHOD3:p.Arg637Gln 50%-of-IEV-carriers sentence (PMID:40879562); added Balkan cohort symptom phenotypes (dyspnea, palpitations, syncope, chest pain) and corrected the arrhythmia description and notes (NSVT 3/13, no AF, PMID:38051749); added the exon-12/C-zone background quote and narrowed the cMyBP-C explanation; noted nonsense alleles in the ClinGen spectrum explanation; added remodeling->arrhythmia and contractility->LV thrombus edges (INDIRECT); added no-outflow-obstruction evidence to mavacamten; marked the remodeling->HCM edge INDIRECT. Kept COMPUTATIONAL on the PMID:35205353 dominant-negative speculation (based on in-silico splice prediction) and did not conform the contractility node to Progressive Contractile Dysfunction (that module node is a downstream pump-failure effector of remodeling, not a cellular upstream defect). validate-disorders: 109 snippets, 0 issues.

    # Review: Cytomegalovirus Retinitis

    - **File:** `/home/user/dismech/kb/disorders/Cytomegalovirus_Retinitis.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical snippet audit:** `dismech.reference_snippet_audit` — **17/17 snippets verified** against cached references. No unverified snippet.

    ## Verdict: NEEDS_FOLLOWUP

    Every snippet present in the file is exact and, with one exception, reasonably matched to its claim. The problem is not what is cited but how much is *not* cited: five phenotypes, one whole treatment, and several specific mechanistic assertions carry no evidence anywhere in the file, and the antiretroviral-therapy treatment's central efficacy claim is supported only by a sentence about one of ART's complications. Two MAJOR findings below.

    ## Findings

    ### 1. MAJOR — the antiretroviral-therapy treatment's efficacy claim is unsupported by its only citation
    - **Location:** `treatments` → "Antiretroviral therapy for immune reconstitution", including `target_mechanisms[target: CMV reactivation under impaired cellular immunity, treatment_effect: RESTORES]`; `PMID:39046420`; `evidence_source: HUMAN_CLINICAL`
    - **Entry claims:** "antiretroviral therapy restores CD4+ T-cell-mediated immunity and **is essential for durable control of the underlying opportunistic infection**"; the mechanism link asserts ART "restores CD4+ T-cell-mediated immunity, **reversing the immunodeficiency** that permits latent cytomegalovirus to reactivate and cause end-organ retinal disease."
    - **What the paper says:** the entire quoted support is "Immune recovery uveitis is an important cause of visual morbidity particularly in HIV/AIDS patients receiving highly active antiretroviral." That sentence reports an *adverse* ocular consequence of ART. The paper is a narrative review of immune recovery uveitis; its findings section says "The exact pathology for this paradoxical inflammatory reaction remains unclear" and "no standardized treatment approach exists currently." Nowhere does the cached text state that ART restores CD4 immunity, controls CMV replication, or is essential for durable retinitis control.
    - **Why it matters:** this is the entry's only disease-modifying (as opposed to antiviral) treatment, it declares a `RESTORES` edge onto the root pathophysiology node, and the strongest therapeutic claim in the file rests on a quote about a complication. The explanation concedes as much — it claims only "the immune-reconstituting treatment **context**" — which means the evidence item and the claim it is attached to are not the same claim. A cited source establishing immune reconstitution and CMV retinitis control under ART is needed.

    ### 2. MAJOR — six entries assert specific clinical facts with no evidence anywhere in the file
    - **Location:**
      - `phenotypes` → "Yellow-white retinal lesions", "Visual impairment", "Vitreous floaters", "Scotoma", "Retinal detachment" (five of eight phenotypes carry no `evidence:` block at all)
      - `treatments` → "Foscarnet" (no `evidence:` at treatment level, and none on its `target_mechanisms`)
    - **Entry claims (examples):** "Necrotic, atrophic retina is prone to breaks, and **rhegmatogenous** retinal detachment is a **major sight-threatening late complication** of CMV retinitis"; "yellow-white areas of retinal necrosis, often with associated retinal hemorrhage, **spreading along the vascular arcades**"; foscarnet "directly inhibits the CMV DNA polymerase **pyrophosphate-binding site**", used "particularly in **ganciclovir-resistant** disease".
    - **What the sources say:** nothing on any of these points. The three literature references in the file (`PMID:11294581` laboratory-diagnosis review, `PMID:12768225` fomivirsen drug review, `PMID:39046420` immune-recovery-uveitis review) contain no discussion of retinal detachment, floaters, scotoma, lesion morphology, or foscarnet. The only adjacent statement in the cache is in the cidofovir RCT (`PMID:9036797`): "If left untreated, it may lead to progressive destruction of retinal tissue and blindness" — and, on resistance, "many CMV isolates that are resistant to ganciclovir and foscarnet", which if anything cuts against foscarnet as the resistance fallback as written.
    - **Why it matters:** these are the parts of the entry a clinician would read as fact, and they are the parts with no traceable source. `PMID:9036797` is already in the cache and could immediately support the untreated-progression/blindness claim; the detachment, lesion-morphology, and foscarnet-pharmacology claims need real citations or should be softened.

    ### 3. MINOR — "first FDA-approved ASO" / 1998 / phosphorothioate chemistry are uncited
    - **Location:** top-level `description` and `treatments` → "Fomivirsen" (`description`, `aso_details.aso_chemistry: PHOSPHOROTHIOATE`)
    - **Entry claims:** "the indication for fomivirsen, **the first antisense oligonucleotide drug ever approved by the FDA (1998)**"; repeated in the treatment description.
    - **What the papers say:** `PMID:12768225` (Drugs Today, 2001) never uses the word "first" and gives no approval date; it describes the molecule, trial efficacy, absence of systemic absorption, and local adverse events. `PMID:38914784` lists "fomiversen (for opportunistic cytomegalovirus infection)" among RNase H-dependent ASOs — which correctly supports `aso_mechanism: RNASE_H_KNOCKDOWN` — but says nothing about priority, date, or backbone chemistry.
    - **Why it matters:** the claims are true in the wider literature, so this is a citation gap rather than an error; but it is a distinctive, quotable historical claim sitting in the entry's opening paragraph with nothing behind it.

    ### 4. MINOR — an aim/objective sentence used where the paper's result was available
    - **Location:** `treatments` → "Intravitreal ganciclovir"; `PMID:37452370`
    - **Entry snippet:** "To compare the efficacy and injection frequency of intravitreal low-dose vs. intermediate-dose ganciclovir therapy in acquired immune deficiency syndrome (AIDS) patients exhibiting cytomegalovirus retinitis (CMVR)." — the PURPOSE line, which states no finding.
    - **What the paper says:** the same cached abstract carries the result: "In both groups, the median BCVA, expressed as the logarithm of the minimum angle of resolution (logMAR), improved significantly from baseline to the end of treatment (both p < 0.001), while vision loss from CMVR continued to occur at the 12-month visit."
    - **Why it matters:** an objectives sentence establishes only that the intervention is used in this population — which is all the explanation claims, so the grading is honest — but the propositional result is right there and would substantiate the treatment properly. Note also this is a dose-comparison trial, so it does not establish efficacy against no treatment; the entry does not overclaim on that point.

    ### 5. MINOR — a molecular-description sentence graded `HUMAN_CLINICAL`
    - **Location:** `treatments` → "Fomivirsen", first evidence item; `PMID:12768225`
    - **Entry snippet:** "Fomivirsen is a novel antisense drug with a 21-nucleotide sequence complementary to the immediate early region 2 of CMV messenger ribonucleic acid." graded `evidence_source: HUMAN_CLINICAL`.
    - **Why it matters:** `evidence_source` classifies the kind of evidence the quoted material represents in the cited publication. This sentence is a pharmacological/molecular characterization, not a human observation; `OTHER` fits. The paper's other two quoted sentences (rapid blindness in AIDS; clinical-trial efficacy) are correctly `HUMAN_CLINICAL`. Because the check is keyed on the quoted sentence, this does not trip `check-snippet-grading`.

    ### 6. MINOR — cell-type annotations not supported by the node's evidence
    - **Location:** `pathophysiology` → "Productive CMV infection of the retina"; `cell_types: retinal pigment epithelial cell (CL:0002586)`, `photoreceptor cell (CL:0000210)`; `PMID:11294581`
    - **Entry claims:** the node names RPE and photoreceptors as the productively infected cells.
    - **What the paper says:** the only supporting quote is "In HIV-positive patients, CMVD tends to manifest itself as retinitis and involvement of the gastrointestinal tract" — which locates the disease in the retina and says nothing about which retinal cell types support productive infection.
    - **Why it matters:** cellular tropism is a specific mechanistic claim and these terms will be exported as graph nodes. Either cite a source for retinal-cell tropism or drop to the tissue level.

    ### 7. MINOR — necrotizing-retinitis node description outruns its single quote
    - **Location:** `pathophysiology` → "Full-thickness necrotizing retinitis"; `PMID:12768225`
    - **Entry claims:** "characteristic yellow-white retinal opacification and associated hemorrhage … advances **centrifugally** and can rapidly destroy the retina".
    - **What the paper says:** only "Cytomegalovirus (CMV) retinitis can rapidly lead to blindness in patients with acquired immune deficiency syndrome (AIDS)." — the opening background line of a drug review, supporting the rapid-blindness clause and nothing else.
    - **Why it matters:** same pattern as finding 2 — the morphological and directional detail is the clinically distinctive content and is the part with no source.

    ## Things checked and found correct

    - **`NCIT:C2629` (valganciclovir) row quote is exact** and matches the cached `references_cache/NCIT_C2629.md` edge table (`| NCIT:C2629 | Valganciclovir | Accepted_Therapeutic_Use_For | - | - | Cytomegalovirus retinitis |`), correctly graded `evidence_source: OTHER`.
    - **Cidofovir is the best-evidenced treatment in the file**: `PMID:9036797` is a randomized controlled trial in AIDS patients with previously untreated peripheral CMV retinitis; the quoted conclusion ("Cidofovir was efficacious in delaying progression of previously untreated CMV retinitis.") matches the result (median time to progression 22 vs 120 days, p<0.001), and the entry's probenecid/saline-hydration nephrotoxicity note matches the trial's INTERVENTION text exactly.
    - **`aso_details` are well grounded**: `RNASE_H_KNOCKDOWN` from `PMID:38914784`'s explicit list, `target_transcript: CMV IE2 mRNA` from the fomivirsen review's own sentence.
    - **The CD4 <50/mm³ risk threshold and the pp65/qPCR viral-load diagnostics** are quoted verbatim from `PMID:11294581` and match the entry's `diagnosis` descriptions without numeric drift.
    - **Immune recovery uveitis is handled correctly** — modeled both as a pathophysiology node downstream of retinitis and as a phenotype bound to `HP:0000554`, with the paradoxical-reaction and visual-morbidity quotes matching the source's SUMMARY exactly.
    - **No Named Entity Confusion, no title-as-finding snippets, and no sentence graded with two different `evidence_source` values** (checked programmatically across the file).


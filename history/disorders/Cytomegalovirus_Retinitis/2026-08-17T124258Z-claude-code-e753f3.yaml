  summary: Cite 5 uncited phenotypes and Foscarnet treatment (issue 6433)
  details: |
    Added evidence blocks to five previously-uncited Ophthalmological phenotypes (Yellow-white retinal lesions, Visual impairment, Vitreous floaters, Scotoma, Retinal detachment) and to the Foscarnet treatment, which had no evidence block at all. Citations: PMID:32318357 (Tang et al. 2020, yellow-white lesion resolution with ART), PMID:21168815 (Jabs 2011 Edward Jackson lecture, pre-HAART visual-impairment/blindness rates), DOI:10.3389/fcimb.2023.1107237 (Zhao et al. 2023 meta-analysis of 20214 CMVR patients, symptom frequencies and retinal detachment incidence), and PMID:8011248 (ACTG 093 phase II trial, foscarnet efficacy in ganciclovir-resistant retinitis). All new PMIDs/DOIs fetched via just fetch-reference, not hand-created. Validation: just validate (schema/terms/references all pass), just count-verified-snippets (20/23 verified; the 3 unchecked items are the three new DOI:10.3389/fcimb.2023.1107237 evidence items, because DOI is in skip_prefixes in conf/reference_validator_config.yaml — NCIT is not skipped, so the pre-existing NCIT:C2629 reference was among the 20 validated. Those 3 DOI snippets were instead verified by hand as exact substrings of references_cache/DOI_10.3389_fcimb.2023.1107237.md, per the issue 7514 caveat), just check-duplicate-keys, just check-title-snippets, just validate-disorders full pre-PR sweep (passes), pytest tests/test_data.py -k Cytomegalovirus (16 passed).

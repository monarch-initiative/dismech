  summary: Backfill infectious_agent binding and transmission (#10115)
  details: |
    Bound the entry's single infectious agent, Human cytomegalovirus, to NCBITaxon:10359 (label Human betaherpesvirus 5, copied from the OLS lookup; preferred_term keeps the clinical name). Added an evidence item naming the organism as the cause of the retinal necrosis this entry curates (PMID:21168815). Added a transmission block with two entries: acquisition by blood, body fluids, organ transplantation and vertical transmission (PMID:39339903), and the route that actually matters clinically - reactivation of lifelong latent virus with haematogenous spread to the retina when cellular immunity fails (PMID:21168815, PMID:11294581). The second block's description records that retinitis is an endogenous bloodborne event in a host infected long beforehand, which is why it tracks CD4 count rather than recent exposure. Validated with just validate, just count-verified-snippets (50/50 verified), and the batched just validate-disorders sweep. cache/ncbitaxon/terms.csv and the organismterm enum cache gained the NCBITaxon:10359 row.

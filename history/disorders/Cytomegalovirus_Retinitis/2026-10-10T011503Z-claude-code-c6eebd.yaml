  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). Extended the viral load row with blood CMV DNA LOINC:105880-9 (method-less quantitative serum or plasma code) and pp65 antigenemia LOINC:78001-5 (the only pp65 code found; immunofluorescence defines the assay). Added a row for the clinical funduscopic diagnosis with intraocular PCR, quoting the SUN Working Group classification criteria (PMID:33845015), bound to CMV DNA in ocular fluid LOINC:88131-8 (specimen is the test identity; no separate aqueous or vitreous code and no method-less ocular fluid code found). No reference_ranges: the 6,390 copies/mL figure in PMID:32318357 is a single-centre cohort association, not a guideline threshold, and the intraocular criterion is qualitative. The CD4 row was left unchanged.

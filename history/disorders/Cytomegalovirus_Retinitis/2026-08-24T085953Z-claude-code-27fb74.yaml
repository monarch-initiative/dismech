  details: |
    Addressed the Cytomegalovirus_Retinitis item from issue #6433 (viral disorder review follow-up): cited evidence for the 5 phenotypes that previously had no evidence block (Yellow-white retinal lesions, Visual impairment, Vitreous floaters, Scotoma, Retinal detachment), added an evidence block to the Foscarnet treatment's target_mechanisms claim, and added a new prevalence: section giving current-era worldwide CMVR prevalence in HIV-positive patients (PMID:39339903) plus a matched pre-HAART/post-HAART annual-incidence pair from a single US institution cohort (PMID:10935050), closing the 'no pre/post-HAART epidemiology' gap. New PMIDs fetched via just fetch-reference and verified via just count-verified-snippets (26/26) and just validate. Did not address the Dengue near-stub or other sibling items in #6433's Section A checklist; those remain open.

  summary: 'Review round: source the withdrawal clause on the ART link'
  details: |
    Review of e318f9622 raised one optional finding on the target_mechanisms link of the 'Antiretroviral therapy for immune reconstitution' treatment. The link description claimed immune recovery controls the infection 'to the point that specific anti-CMV therapy can be withdrawn without retinitis progression in some patients', but the link carried a single evidence item quoting only the immune-recovery half of that claim ('Immune recovery in patients receiving HAART has been effective in controlling opportunistic infections...'). The withdrawal clause was genuinely sourced, but from the treatment-level evidence block rather than the link's own. That is the exact pattern this audit corrects elsewhere - a description saying more than the quote attached to it - so it was fixed rather than left. Added a second evidence item on the link quoting PMID:10665706 'In some patients, retinitis has not progressed when specific anti-CMV therapy was discontinued', verified as an exact substring of the cached record. Graded SUPPORT / OTHER, matching the identical sentence in the treatment-level block, so check-snippet-grading sees no new divergence. No other review findings required action: the two supporting_text mismatches (EYS, MERTK) and the 22 stale-PARTIAL prose mentions are pre-existing on main, untouched by this diff, and filed as #10685 and the #7439 sweep respectively.

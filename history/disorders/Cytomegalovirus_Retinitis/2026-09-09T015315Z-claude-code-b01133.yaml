  summary: 'Review round: reframe 20-40% figure as lifetime prevalence; reconcile
    with main'
  details: |
    PR shepherd round addressing the blocking review item on #9353, plus a merge from main.

    Blocking item: the 20-40% of HIV-positive patients figure was recorded as measure_type POINT_PREVALENCE and described as a current-era estimate. The cited sentence in PMID:39339903 carries no temporal qualifier, and the same statistic appears in the pre-HAART literature as the proportion of AIDS patients who develop CMVR, so as written it contradicted the 0.07% post-HAART annual incidence in the same block by roughly 400-fold while presenting both as current. Changed to LIFETIME_PREVALENCE and rewrote the notes and evidence explanation to record the pre-HAART provenance instead of a current-era claim.

    Also replaced prevalence_class COMMON with the numeric band ABOVE_1_IN_1000, since CLAUDE.md forbids a qualitative tier alongside a populated rate_per_100000, and added the rate_denominator POPULATION_PER_YEAR that CLAUDE.md requires on every ANNUAL_INCIDENCE record. Recorded the differing observation windows (1992-1993, about two years, versus October 1997 to October 1998, one year) in the pre-HAART record's notes, so the pre/post contrast is read as the reliable signal rather than either absolute rate.

    Merge from main: main had independently curated evidence for all five phenotypes this PR set out to cite, with strictly more evidence items per claim, so all six conflict hunks were resolved in favour of main. The PR's remaining unique contribution is the prevalence block, which main lacked entirely. Removed references_cache/PMID_37305416.md and PMID_1318365.md, which became uncited repo-wide once main's evidence superseded the items citing them; PMID:37305416 is the same paper main cites as DOI:10.3389/fcimb.2023.1107237, whose cache remains.

    Validation: just validate (43/46 snippets verified, 3 skipped by prefix), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values all pass.

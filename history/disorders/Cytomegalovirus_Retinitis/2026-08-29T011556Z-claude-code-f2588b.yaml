    # Fixes: Cytomegalovirus Retinitis

    File: `/home/user/dismech/kb/disorders/Cytomegalovirus_Retinitis.yaml`
    Review: `reviews/Cytomegalovirus_Retinitis.md` (2 MAJOR, 5 MINOR)

    ## Findings fixed

    ### 1 (MAJOR) — antiretroviral therapy claim supported only by an immune-recovery-uveitis sentence
    **New reference fetched:** `PMID:10665706` (Whitcup, *Cytomegalovirus retinitis in the era
    of highly active antiretroviral therapy*, JAMA 2000) — the HAART-era
    discontinuation-of-maintenance literature the review asked for.

    - Treatment-level evidence added: *"In some patients, retinitis has not progressed when
      specific anti-CMV therapy was discontinued"* and *"Anti-CMV maintenance therapy likely can
      be safely discontinued in some patients with CMV retinitis if CD4+ cell counts are stable
      or increasing"*.
    - The `RESTORES` link now carries its own evidence: *"Immune recovery in patients receiving
      HAART has been effective in controlling opportunistic infections, but it may also result
      in intraocular inflammation, which can have adverse effects on the eye."*
    - Both descriptions rewritten to the evidenced claim: ART raises CD4+ counts and the
      resulting immune recovery controls the opportunistic infection to the point that
      anti-CMV therapy can be withdrawn in selected patients — replacing the unsupported
      "essential for durable control" / "reversing the immunodeficiency" phrasing.
    - The `PMID:39046420` item was kept but regraded `SUPPORT` → `PARTIAL`, with an
      explanation saying it supports only the adverse (immune recovery uveitis) half.
    - All three Whitcup items are `evidence_source: OTHER` (narrative clinical review), stated
      inline.

    ### 2 (MAJOR) — five phenotypes and the Foscarnet treatment carried no evidence
    **New references fetched:** `PMID:39339903` (Zhang et al., *Cytomegalovirus Retinitis:
    Clinical Manifestations, Diagnosis and Treatment*, Viruses 2024) and `PMID:11139700`
    (Cassoux et al., retinal detachment in AIDS patients).

    - **Yellow-white retinal lesions** — description rewritten to the citable morphology
      (necrosis with intraretinal hemorrhage, the "pizza pie" appearance; peripheral onset
      advancing to the posterior pole). The uncited "spreading along the vascular arcades" was
      dropped. Two quotes from PMID:39339903 added.
    - **Visual impairment** — description softened ("loss can continue to accrue even where
      antiviral treatment improves acuity in the short term"); evidenced by PMID:39339903
      (*"CMVR causes vision loss if left untreated, and early antiviral therapy significantly
      reduces the risk of vision loss."*) and PMID:37452370 (*"while vision loss from CMVR
      continued to occur at the 12-month visit"*).
    - **Vitreous floaters** — the uncited "vitreous inflammatory debris" mechanism was replaced
      with the review's own framing (nonspecific initial symptom alongside blurred vision and
      flashing lights), with that quote attached.
    - **Scotoma** — evidenced by *"As the disease progresses, patients may experience floaters,
      flashes of light, and blind spots"*.
    - **Retinal detachment** — the rhegmatogenous/late-complication claim is now sourced:
      PMID:11139700 *"Multiple or single holes, as well as micro holes, were observed in areas
      of retinal necrosis leading to complex retinal detachments."* and *"Retinal detachment
      (RD) is a frequent complication of this disease, with an incidence varying from 18% to
      29%."*, plus PMID:39339903 *"When untreated, the disease can lead to retinal detachment,
      a major cause of vision loss"*.
    - **Foscarnet** — the pyrophosphate mechanism is now evidenced on the `target_mechanisms`
      link (*"FOS uniquely inhibits viral DNA polymerase by binding to its pyrophosphate
      binding site"*), and treatment-level evidence places it as a mechanistically distinct
      alternative given IV or intravitreally. The description was changed from
      "ganciclovir-resistant" to "drug-resistant", matching what the review actually says.
      Caveat recorded in that explanation: the sentence's "particularly for drug-resistant
      patients" clause sits after a bracketed citation marker that the snippet matcher strips,
      so only the contiguous first clause could be quoted.

    ### 3 (MINOR) — "first FDA-approved ASO (1998)" / phosphorothioate uncited
    **New reference fetched:** `PMID:11497353` (Orr, *Technology evaluation: fomivirsen*).
    Three items added to the Fomivirsen treatment: *"fomivirsen is the first antisense
    oligonucleotide to receive approval for licensing"*, *"In August 1998, the FDA approved the
    marketing of Vitravene for the local treatment of CMV retinitis"*, and *"Fomivirsen
    (ISIS-2922, Vitravene) is an antisense 21 mer phosphorothioate oligonucleotide"* (the last
    grounds `aso_details.aso_chemistry: PHOSPHOROTHIOATE`). All `OTHER`.

    ### 4 (MINOR) — PURPOSE-line snippet for intravitreal ganciclovir
    Replaced with the result sentence from the same cached abstract: *"the median BCVA,
    expressed as the logarithm of the minimum angle of resolution (logMAR), improved
    significantly from baseline to the end of treatment"*, with the explanation noting it is a
    dose-comparison trial and therefore does not establish benefit against no treatment.

    ### 5 (MINOR) — molecular-description sentence graded `HUMAN_CLINICAL`
    Fomivirsen's IE2-complementarity sentence (`PMID:12768225`) regraded to `OTHER` with the
    reason inline. The paper's two clinical sentences keep `HUMAN_CLINICAL`.

    ### 7 (MINOR) — necrotizing-retinitis node description outran its quote
    "advances centrifugally" replaced with the review's own account (begins peripherally,
    advances toward the posterior pole), and the morphology reworded to necrosis with
    intraretinal hemorrhage. Two PMID:39339903 quotes added to the node.

    ## Findings intentionally skipped

    - **6 (MINOR) — RPE and photoreceptor cell-type annotations on "Productive CMV infection of
      the retina."** No cached source (including the new 2024 review) states which retinal cell
      types support productive infection, and the fix options are to find a tropism paper or to
      delete two ontology-bound annotations. Deleting bound terms is a structural change the
      protocol reserves; recorded here for a curator, who should either cite a tropism source
      or drop to the tissue level.


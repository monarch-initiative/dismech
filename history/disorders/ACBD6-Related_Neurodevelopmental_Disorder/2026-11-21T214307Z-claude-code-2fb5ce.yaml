  summary: 'Create: ACBD6-Related Neurodevelopmental Disorder'
  details: |
    New Disease entry for MONDO:0968976 (OMIM 620785), curated from stub Neurodevelopmental_Disorder_With_Progressive_Movement_Abnormalities, which is deleted; entry_type decision DISEASE (one gene, one MONDO term, no subtypes). The entry is named for the gene because the MONDO label describes a phenotype that does not require an ACBD6 variant; the MONDO label, NEDPM and the literature forms are synonyms. No deep-research provider was run; the literature was found by a PubMed search for ACBD6 (26 records, 2026-11-21). Four references are cited, all cached as PMC full text: the 45-patient cohort PMID:37951597 (phenotype frequencies, MRI, zebrafish and Xenopus models, YnMyr proteomics), the Thai sibling report PMID:36457943 (systemic features), and the two biochemical studies PMID:32108178 and PMID:36551154 (patient fibroblasts, knockout cells). just check-genereviews --online reports NO_CHAPTER. The ai-gene-review ACBD6 record was read for leads only and is not cited. Contents: 36 phenotypes, 6 pathophysiology nodes, 3 treatments, 2 animal models (gene bindings ZFIN:ZDB-GENE-030131-2810 and Xenbase:XB-GENE-989234, read from the NCBI Gene records and confirmed by check-gene-namespaces-online), 2 experimental models, 5 discussions, 106 evidence items. The cellular nodes (N-myristoylation, lysophospholipid acylation) are deliberately not wired to the tissue nodes because no source establishes that step. Validation: just validate, validate-terms, count-verified-snippets (106/106), validate-disorders (106 snippets and 106 titles checked, 0 issues), and the offline gates check-duplicate-keys, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-snippet-grading, check-folded-hyphens, check-snippet-length, check-title-snippets, check-reference-titles, check-gene-namespaces-online all passed.

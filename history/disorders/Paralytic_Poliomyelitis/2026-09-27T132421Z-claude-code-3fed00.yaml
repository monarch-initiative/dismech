  summary: 'Resolve merge with main: keep the unbound poliovirus agent record'
  details: |
    Merged origin/main into the PR branch and resolved a conflict in which both sides had rewritten the infectious_agent block. This branch had bound the agent to NCBITaxon:138950 (Enterovirus C) with preferred_term poliovirus; main had since landed a record that leaves the agent deliberately unbound, on the grounds that Enterovirus C also contains the coxsackie A viruses and that NCBI Taxonomy carries the polio serotypes only as unranked nodes. Both claims were checked against NCBI Taxonomy efetch/esearch for txid138950 before deciding: the subtree returns Coxsackievirus A1, A18, A19, A20, A22 and A24 beside the polioviruses, and 12080/12083/12086 report no species rank. Main's record is therefore correct and its agent block, WPV/VDPV subtypes and evidence are kept in full; the Enterovirus C binding introduced on this branch is dropped. The transmission block this branch added (faecal-oral and oral-oral spread, three PMID:32644370 snippets) is not in main and is kept. The earlier record 2026-09-18T001754Z-claude-code-b28075.yaml describes the session that made the dropped binding and is left unaltered. Revalidated with just validate-disorders over all ten entries: 471/471 snippets verified, 0 issues.

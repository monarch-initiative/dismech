  details: |
    Review round on PR #9602. Bound diagnosis_term to NCIT:C20055 (Nucleic Acid Amplification Test) on the stool RT-PCR entry, following the Chickenpox pattern. Moved the WPV-versus-VDPV distinction out of prose into InfectiousAgent.has_subtypes (WPV, VDPV) and added cVDPV/iVDPV/aVDPV framing with a supporting quote naming circulating VDPV2 outbreaks. Added a second evidence item quoting the VP1-divergence sentence so the diagnosis entry's WPV-versus-VDPV claim is evidenced rather than resting on a serotype-only quote. Added a Wastewater Surveillance diagnosis entry with two quotes from the same MMWR report. Recorded in infectious_agent_term.description why the agent term is deliberately unbound: NCBITaxon has no species-level Poliovirus node (only serotype terms 12080/12083/12086) and the species parent NCBITaxon:138950 Enterovirus C is too broad. Added PMID:35980868 to the top-level references block. Validated with just validate-disorders (39/39 snippets verified), just validate-terms, check-duplicate-keys, check-entity-refs.

  details: |
    Addresses finding 9 (blocking) and finding 10 (suggestion) from the third review, in one push.

    Finding 9: PMID:32941411 was cited by two evidence items on the WPV subtype but missing from the top-level references: block, which listed 8 of the 9 cited PMIDs. Added it in sorted position between PMID:32644370 and PMID:33490061, with the title copied verbatim from the frontmatter of references_cache/PMID_32941411.md rather than written from the abstract. Verified programmatically that the cited-PMID set and the listed set are now identical in both directions - no cited-not-listed and no listed-not-cited.

    Finding 10: added quote_role: BACKGROUND to both PMID:32941411 evidence items. Both quoted sentences sit in that paper's opening paragraph and each carries the citation marker (1) attributing it to another source; the paper is a containment-implementation progress report that neither certified the eradications nor conducted the endemicity surveillance. evidence_source is unchanged on both - OTHER for the GCC certification and HUMAN_CLINICAL for the endemicity statement - so the pair now records that the endemicity finding is human epidemiology while this publication is not where it came from.

    Applying finding 10 required integrating main: quote_role postdates this branch's schema, and the pre-edit validation hook correctly rejected the slot as an unexpected property before the merge. The merge of origin/main was conflict-free and the entry validates against the merged schema with no other drift surfaced - in particular no retired enum values.

    Validation after both changes: just validate passes (schema, terms, references) with 41/41 snippets verified, unchanged. check-duplicate-keys, check-entity-refs, check-causal-targets and check-enum-values all clean.

  summary: 'Review round 3: source the WPV eradication and endemicity claims'
  details: |
    Addresses the single blocking finding (finding 8) of review round 2 on PR #9602.

    The WPV subtype under infectious_agent[0].has_subtypes carried a description
    asserting two specific, falsifiable public-health claims - that wild serotypes 2
    and 3 have been certified eradicated, and that WPV1 remains endemic in
    Afghanistan and Pakistan - with no evidence block, and nothing elsewhere in the
    entry covering either claim. The entry's agent-level evidence is about VDPV
    emergence, importation risk and detection delays, none of which speaks to
    eradication certification.

    Fetched PMID:32941411 (MMWR, "Progress Toward Poliovirus Containment
    Implementation - Worldwide, 2019-2020") via just fetch-reference and attached two
    evidence items to the subtype, one per claim:

    - Certification: "The Global Commission for the Certification of Poliomyelitis
      Eradication (GCC) declared two of the three WPV types, type 2 (WPV2) and type 3
      (WPV3), eradicated globally in 2015 and 2019, respectively". Graded OTHER - a
      certification of eradication is an expert-commission determination, not a study
      result.
    - Endemicity: "Wild poliovirus type 1 (WPV1) remains endemic in Afghanistan and
      Pakistan". Graded HUMAN_CLINICAL - endemic status is a conclusion from global
      acute-flaccid-paralysis surveillance in human populations.

    The reviewer suggested PMID:38535567 (already cached) for the endemicity half and
    noted that nothing in cache supported the certification half at all - its closest
    sentence is a WPV2 detection claim ("last detected in 1999 in Northern India")
    and it says nothing about WPV3. PMID:32941411 was used instead because a single
    source carries both halves in the entry's own terms: it names the certifying
    body, both certified serotypes and their dates, and states the WPV1 endemic
    countries without the Nigeria qualifier that made the PMID:38535567 sentence an
    awkward fit. The description text is unchanged - it was accurate, only
    untraceable.

    quote_role: BACKGROUND would fit both items, since the sentences frame the report
    rather than reporting its own surveillance, but this branch's schema predates
    that slot, so the provenance reasoning is recorded in the explanation prose
    instead.


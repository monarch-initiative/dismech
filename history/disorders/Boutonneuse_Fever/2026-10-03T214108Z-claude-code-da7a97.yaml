  details: |
    Added agent_life_cycle for Rickettsia conorii subsp. conorii. Hosts: Homo sapiens (NCBITaxon:9606, accidental host at the tick-bite site), Rhipicephalus sanguineus (NCBITaxon:34632, brown dog tick, vector and candidate reservoir), Canis lupus familiaris (NCBITaxon:9615, candidate reservoir, not established). Vector: brown dog tick. Two stages: maintenance in the tick vector (PMID:16881414, immature-stage tick activity sets the seasonal peak) and human infection at the tick-bite inoculation site (PMID:16881414, eschar at the bite site). Block evidence PMID:34698275 records the reservoir as unsettled among dogs, other mammals and the ticks, which is why dog and tick roles are written as candidates. No OPL stage terms: OPL covers protozoan and helminth stages only. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (367/367 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

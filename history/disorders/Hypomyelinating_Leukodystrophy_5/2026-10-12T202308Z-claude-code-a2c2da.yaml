  summary: 'Review round 1: Hypomyelinating Leukodystrophy 5'
  details: |
    Addressed the first automated review of PR 13965. Added a genetic record for HYCC1 (hgnc:24587, label FAM126A) with the ClinGen Definitive assertion CGGV:assertion_1717e62b-6b1e-47fd-a335-de3fd597f7a4-2025-03-13T160000.000Z and four variants (IVS5+1G>T, c.636_639del, microdeletion, p.Leu53Pro). Because GO annotates hyccin only with protein binding, the gene descriptor was moved from the variant node to the PI4KIIIalpha complex node, whose molecular function is the complex's kinase activity, so check-gene-activity-grounding passes without a baseline exemption. Replaced the seizure snippet with a longer exact GeneReviews substring containing 'Seizures can occur.' (the three-word sentence alone fails check-snippet-length). Added truncal hypotonia (HP:0008936), lower limb weakness (HP:0007340) and motor regression (HP:0033044), the GeneReviews recurrence-risk sentence, and an orthopaedic/feeding supportive-care treatment with the surveillance sentence. Backfilled reference_title on all evidence items. Not added: nystagmus, which appears in the deep-research report but in no cached abstract.

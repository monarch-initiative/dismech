  summary: 'Create: Hypomyelinating Leukodystrophy 5'
  details: |
    New entry for hypomyelination and congenital cataract (HLD5, MONDO:0012514), HYCC1/FAM126A. Pathograph: biallelic HYCC1 loss of function -> destabilised plasma-membrane PI4KIIIalpha complex -> reduced PtdIns(4)P synthesis (oligodendrocyte, conforms to cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult) -> CNS and PNS hypomyelination (conforms to #Deficient or Unstable CNS Myelin Sheath) -> neurological phenotypes, plus secondary white-matter loss (conforms to #Axonal Degeneration and Progressive White Matter Dysfunction). A missense ER-aggregation/UPR branch is recorded as a proposed mechanism. The congenital cataract node is left without an upstream edge because no study links hyccin to the lens. GeneReviews chapter PMID:20301737 is the phenotype baseline and is tagged. One OpenScientist deep-research report: built-in validation completed (10/10 references resolved, needs_review set only by table-cell label artefacts such as 'Most'); just preflight-dr PASS, with PI4KA mentions reflecting the hyccin-PI4KA complex rather than a second disease. The report gave HGNC:24810 as the HYCC1 identifier; HGNC resolves that to SMCO4, so it was not used. The gene is bound to hgnc:24587 with label FAM126A because the HGNC build used for term validation still carries the old symbol. MONDO:0012514 is labelled 'leukodystrophy, hypomyelinating, 5' in MONDO, which differs from the stub label. Validated with just validate-disorders and the offline CI gates.

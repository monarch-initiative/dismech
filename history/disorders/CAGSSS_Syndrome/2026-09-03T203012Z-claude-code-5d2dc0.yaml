  summary: 'Round-2 review: regrade two ocular frequencies to their denominators,
    rebind keratitis, add somatropin'
  details: |
    Three items from the second review round, all introduced by the round-1 fix commit.

    Frequencies. Corneal Opacity and Nystagmus were both graded OCCASIONAL (5-29%) from single-proband narrative snippets, while the same already-cached source carries denominators that put both in FREQUENT (30-79%). Both are now graded from the Table 1 ocular evaluation rows, which record corneal opacification for six of ten probands and bilateral nystagmus for seven of ten, with the narrative snippet retained as the individual-level description. The reviewer's caution was followed: the prose sentence reading 'bilateral nystagmus and/or cataracts' does not establish a nystagmus-only denominator and is not quoted as if it did, and the explanation says so. Strabismus stays OCCASIONAL at two of ten, which is correct.

    The prose sentence stating the six-of-ten corneal count is not quotable from the cache. PDF extraction hyphenated it across a line break as 'ob-' / 'served'; the snippet audit accepts the reassembled span only through cache-defect normalization and linkml-reference-validator rejects it outright. Both halves of that were tested directly rather than assumed. The table row carries the same count and validates cleanly, so it is what the grade cites, and the explanation records why.

    Keratitis binding. Neurotrophic Keratitis was bound to HP:0000481 Abnormal cornea morphology. Keratitis is corneal inflammation, not a morphological abnormality, and HP:0000491 Keratitis exists, is in both the label and enum caches, and is used elsewhere in the KB. Rebound, with the neurotrophic qualifier kept in preferred_term. The note previously implied nothing closer than the grouper existed, which was wrong, and now states the branch reasoning instead.

    Growth Hormone Replacement. NCIT:C15986 Pharmacotherapy with no therapeutic_agent. Added CHEBI:749556 somatropin.

    Validation: schema, term and reference validation pass with 45/45 snippets verified and no cache-defect normalization, and all ten offline gates pass including check-snippet-grading. check-source-defect-claims does not flag the hyphenation claim. Reference-cache churn was reverted before staging.

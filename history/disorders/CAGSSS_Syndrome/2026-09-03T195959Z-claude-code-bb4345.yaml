  summary: 'Review round 1: address ai4c-reviewer findings on #10768'
  details: |
    Addressed three findings. (1) The tRNA-charging node's notes contradicted its own edge and were stale: the prose described INDIRECT_UNKNOWN_INTERMEDIATES while the edge declared INDIRECT_KNOWN_INTERMEDIATES, it described the tissue-selectivity problem that belongs to the next edge, and its closing clause said the one experiment addressing the intermediate step found no respiratory chain deficiency - which PMID:39169373, cited three times in the same entry, contradicts. Rewritten. (2) The eye was modelled as cataract alone; added corneal opacity, neurotrophic keratitis, nystagmus and strabismus, using PMID:27078007 which reports a full-pentad adult with neurotrophic keratitis and multiple failed corneal grafts. (3) Added a treatments section: cataract surgery, growth hormone replacement, and corneal transplantation - the last curated principally through two REFUTE items, because grafts fail in this disease and the pattern is mechanistically coherent with a cornea denervated by the syndrome's sensory neuropathy. One snippet had to be trimmed past a hyphen-split word in the PDF-extracted cache, which the validator surfaced as a cache-defect normalization warning rather than a clean pass. Revalidated: schema, terms, 43/43 snippets, all offline gates including check-folded-hyphens.

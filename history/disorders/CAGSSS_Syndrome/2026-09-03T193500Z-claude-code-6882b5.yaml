  summary: 'Create: CAGSSS Syndrome (IARS2)'
  details: |
    De novo curation of IARS2-related CAGSSS from primary literature plus one openscientist deep-research run. Three judgement calls are recorded structurally rather than in prose: the skeletal dysplasia is curated as primary on the neonatal-radiograph evidence that answers a published letter exchange; functional_impact_category is UNKNOWN rather than LOSS_OF_FUNCTION because no aminoacylation assay on any patient allele has been reported; and the respiratory-chain mechanism is carried as a node whose every evidence item is INDIRECT, because the demonstration used Leigh-syndrome alleles while the only CAGSSS-range measurement was negative. The deep-research run supplied PMID:39169373, which changed that discussion from an unexplained contradiction into a testable allele-severity question. Two cached letters are deliberately uncited because PubMed carries no abstract for either and a title is not a finding. Validated: schema, terms, 34/34 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms.

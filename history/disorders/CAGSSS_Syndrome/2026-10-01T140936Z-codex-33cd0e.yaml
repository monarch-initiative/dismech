  summary: Review CAGSSS clinical spectrum, model-specific mechanisms and documented
    care using full cached sources
  details: |
    Reviewed the complete existing entry, its creation/edit history and matching OpenScientist research report and citations. Consumed the full 2018 clinical paper, its detailed DOCX clinical supplement, the 2024 lymphocyte/HEK293T paper, the 2022 case/review with phenotype-separated tables, the 2020 anemia report, 2018 and 2025 cataract papers, and newer clinical/review sources for scope checks. Read the founding 1993, 2014, Danish and ophthalmology abstracts; DOI retries did not recover their full text. Used the current ClinGen curation and official endocrine guideline resource. All caches were generated by just fetch-reference; the supplement URL fetch produced unparsed DOCX bytes, so that cache is not included or used for quotations.

    Separated core CAGSSS from the broader IARS2 spectrum while updating the entity-boundary discussion to acknowledge ClinGen's definitive December 2024 lumped classification. The 2018 ten-person table is not a pure CAGSSS denominator; the 2022 summary separates seven core cases. Checked summary counts against the individual table/supplement: hearing counts disagree (four versus five), normal-intelligence and GH ascertainment require qualification, and repeat publications of the Canadian family are not independent patients. Corrected the Pro909Ser cDNA coordinate from the full Results rather than propagating the abstract typo; retained the primary Danish Gly874Arg designation despite secondary-source errors. Genotype/domain associations are provisional, and a truncating allele also occurs in isolated cataract.

    Replaced the tissue bundle with nine atomic mechanism nodes. Protein abundance, proposed charging and translation, respiratory-complex content, oxygen consumption, ATP and ROS are distinct. The 2024 patient-cell assay used only one of two Leigh patients; BN-PAGE measured complex abundance, not enzyme activity, and rescue was performed in HEK293T cells, not patient cells. Core fibroblast null results and normal biochemical results in broader severe cases limit universal-deficiency claims. Four cellular systems and the expert-curated embryonic-lethal Iars2 mouse knockout carry explicit fidelity limits and negative-result model links. Preserved and corrected both existing scientific discussions.

    Expanded to 32 phenotypes with specific ophthalmic, neurological, skeletal and endocrine findings; separated short stature from documented GH deficiency, corrected hip and achalasia histories and distinguished confirmed from suspected adrenal insufficiency. Clinical graph links use UNKNOWN intermediates where mechanisms are unresolved. Added nerve-fiber histology, biochemical interpretation and relevant diagnostic assessment. Corrected the claim that GH replacement had never been given: two cases had reported qualitative benefit. Documented hearing aids, achalasia endoscopy, ankle arthrodesis and three individuals with graft failure without asserting universal failure or a proven denervation mechanism. General adrenal replacement guidance is clearly indirect to CAGSSS. Added recessive genetic counseling and explicit allelic differentials.

    Current EuropePMC IARS2/CAGSSS search returned 46 records; reviewed all titles and retrieved relevant newer clinical sources. The 2025 isolated-cataract report has inconsistent variant classifications and does not establish a new multisystem CAGSSS case. ClinicalTrials.gov returned one background-only hit, NCT07459816 (GASCON-2, genomic study of unexplained congenital sideroblastic anemia), not a CAGSSS treatment trial; no trial block was added. Unavailable skeletal and valproate correspondence supplies no evidence quote. The research completeness cross-check covers core phenotypes, genetic spectrum, mechanisms, care, diagnostics and models; broader Leigh/West/anemia therapies are not silently generalized to the core phenotype.

    Final entry validation verifies all 118 snippets and 130 titles with no skipped or unavailable snippets. Schema and ontology checks pass. Additional graph, evidence-hygiene, GeneReviews and history checks are recorded with this review PR.

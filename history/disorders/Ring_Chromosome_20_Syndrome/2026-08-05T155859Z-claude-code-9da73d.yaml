  summary: 'Create: Ring Chromosome 20 Syndrome'
  details: |
    De novo curation of ring chromosome 20 syndrome (MONDO:0015436). Nine-node pathograph from telomere-telomere fusion through two structurally distinct downstream forms (postzygotic mosaic without deletion; meiotic non-mosaic with terminal deletion) and mitotic ring instability into a deliberately empty hub node, 'Ring Ratio-Dependent Cortical Network Dysfunction', then frontally predominant hyperexcitability, nonconvulsive status epilepticus and drug-resistant focal epilepsy, and cognitive/behavioural decline. Two nodes conform to epilepsy_excitation_inhibition_imbalance at the hyperexcitability and recurrent-seizure nodes only, deliberately not at the module's ion-channel trigger. No genetic section: the syndrome has no established causal gene and typing a refuted candidate would misrepresent the evidence; the candidate-gene question lives in the discussions block with REFUTE-typed evidence. Three CONTROVERSY discussions: what makes a deletion-free ring epileptogenic (candidate-gene deletion and peritelomeric transcription both refuted); whether the long-lasting rhythmic slow-wave pattern is genuinely ictal (pharmacological dissociation, preserved responsiveness, sparse spike content); and whether the intellectual disability is seizure-driven or a parallel ring effect (ring-ratio confounding, pre-seizure behavioural disturbance, spared adolescent-onset cognition). Validation: schema passed, term validation passed, 76/76 evidence snippets verified against cached references.

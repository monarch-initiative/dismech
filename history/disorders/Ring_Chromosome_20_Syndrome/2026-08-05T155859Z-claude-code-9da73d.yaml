  summary: 'Create: Ring Chromosome 20 Syndrome'
  details: |
    De novo curation of ring chromosome 20 syndrome (MONDO:0015436). Nine-node pathograph from telomere-telomere fusion through two structurally distinct downstream forms (postzygotic mosaic without deletion; meiotic non-mosaic with terminal deletion) and mitotic ring instability into a deliberately empty hub node, 'Ring Ratio-Dependent Cortical Network Dysfunction', then frontally predominant hyperexcitability, nonconvulsive status epilepticus and drug-resistant focal epilepsy, and cognitive/behavioural decline. Two nodes conform to epilepsy_excitation_inhibition_imbalance at the hyperexcitability and recurrent-seizure nodes only, deliberately not at the module's ion-channel trigger. No genetic section: the syndrome has no established causal gene and typing a refuted candidate would misrepresent the evidence; the candidate-gene question lives in the discussions block with REFUTE-typed evidence. Three CONTROVERSY discussions: what makes a deletion-free ring epileptogenic (candidate-gene deletion and peritelomeric transcription both refuted); whether the long-lasting rhythmic slow-wave pattern is genuinely ictal (pharmacological dissociation, preserved responsiveness, sparse spike content); and whether the intellectual disability is seizure-driven or a parallel ring effect (ring-ratio confounding, pre-seizure behavioural disturbance, spared adolescent-onset cognition). Validation of the initial draft: schema passed, term validation passed, 76/76 evidence snippets verified against cached references.

    Deep-research cross-check, same session. Generated research/Ring_Chromosome_20_Syndrome-deep-research-claude_code.md with the claude_code provider (1077 lines, 28 distinct PMIDs) and reconciled the entry against it. The most substantive addition was a mechanism the first draft missed entirely, a nigrostriatal seizure-termination arm. Fluorodopa uptake is reduced bilaterally in putamen and caudate in r(20) and does not track the ring ratio (PMID:15249613), and EEG-fMRI during an actual seizure shows substantia nigra, striatum, and frontal cortex engaged together (PMID:22738216). That is now its own pathophysiology node sitting between cortical hyperexcitability and prolonged nonconvulsive status, because it addresses the defining feature of this syndrome, which is that the seizures will not stop rather than that they start. A 192-patient systematic review (PMID:42468067) then replaced the single-series frequency estimates: nonconvulsive status upgraded from FREQUENT to VERY_FREQUENT on 126 of 143 patients (88 percent), focal impaired-awareness seizures banded at 50.3 percent, drug resistance quantified at 80 percent, and a new ictal fear phenotype added at 72 percent bound to HP:0025613 Focal emotional seizure. The same review supplied an unexplained female excess (40.4 percent male across 192 pooled patients), now curated as a fourth discussion, a KNOWLEDGE_GAP laying out ascertainment bias, differential male embryonic survival, and publication bias as competing explanations with a fixed-testing-rule study to separate them. Two deep-research suggestions were declined: no OMIM identifier is cited because none exists for this syndrome, and the macrocephaly in the MONDO definition is not curated as a phenotype because the primary literature does not support it.

    Validation after the deep-research pass: schema passed, term validation passed, 85/85 evidence snippets verified against cached references, snippet-length check clean, and a pathograph self-check showing ten nodes, a single root, and no dangling downstream edges.

    Review response, same session, PR #8029. The first automated review found that PMID:33363513 was cached as full text but cited only from its abstract, and it was right; five further evidence items were mined from that cache. Three of them change substantive claims. Familial recurrence: four families are on record in which a mosaic mother transmitted the ring mosaically, with a higher ring ratio in the children and correspondingly earlier onset, so the inheritance block no longer says familial recurrence is not a feature. A third refuted mechanism: a genome-wide methylation screen found no shared epigenetic signature and no methylation difference at CHRNA4 or KCNQ2, refuting the telomeric-silencing hypothesis, with the authors' own subtelomeric-coverage caveat curated as PARTIAL alongside it. And a cleaner argument against gene dosage than the absence of deletions, namely that people carrying terminal deletions of a linear chromosome 20 do not develop this epilepsy at all. Two constraints on the surviving ring-instability hypothesis were also added: only 12 of 35 evaluated patients had secondary aberrations above five percent, and ring chromosome 2 and 4 patients have no epilepsy, so the mechanism has to be chromosome-20-specific. Treatments now name valproic acid and lamotrigine as therapeutic_agent entries and record that vagus nerve stimulation efficacy is described as controversial. Two differential-diagnosis records had been supported by a generic snippet that established only that differentials exist; both now quote sentences that name the specific alternative. Added a ring chromosome 14 differential, updated the published case count from more than 100 (2012) to about 200 (2020), and extended the module conformance note to explain why the module's Excitation-Inhibition Imbalance node is skipped: nothing in this literature establishes which side of that balance is disturbed.

    Validation after the review response: schema passed, term validation passed, 97/97 evidence snippets verified against cached references, snippet-length check clean.

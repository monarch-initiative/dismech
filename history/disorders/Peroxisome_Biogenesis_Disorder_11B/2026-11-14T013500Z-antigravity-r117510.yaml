    added SUPPORT evidence from PMID:37962062 on Plasma very-long-chain fatty
    acid profiling alongside the cohort REFUTE item; and corrected the previous
    history session details to accurately state CHEBI:16359 on cholic acid
    supplementation and CHEBI:50858 on adrenal replacement therapy.

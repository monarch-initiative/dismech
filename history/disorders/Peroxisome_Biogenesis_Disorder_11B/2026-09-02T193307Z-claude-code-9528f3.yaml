  summary: 'Address re-review: contradicted phenotypes, exemplar allele, pexophagy'
  details: |
    Second session record, covering the response to the second ai4c-reviewer round. The most consequential finding was a genuine evidence error: adrenal insufficiency, decreased liver function and nephrolithiasis were supported only by a spectrum-wide GeneReviews sentence, while Borgia 2022 - the PEX13-specific cohort this entry is built on - states that none of the affected individuals presented those features. Each now carries a REFUTE evidence item quoting that sentence, and the Peroxisomal Metabolic Failure to Adrenal insufficiency causal edge was removed, since asserting a causal edge to a manifestation the gene-specific cohort negates is worse than the phenotype claim alone. The hypomorph node was re-anchored: p.Ile326Thr is the exemplar for the milder NALD end, since every reported p.Arg294Trp patient is labelled ZSD. p.Arg294Trp is retained in the node because it carries the only mechanistic characterisation available, and the description now states that the mechanism and the severity label come from different alleles. The genotype-severity direction is also cited: compound heterozygotes were milder than missense homozygotes, opposite to a naive dosage model. The Plasmalogen Deficiency node cited a snippet that never mentions plasmalogens and whose truncation concealed a pathway list excluding them; it now cites Maxwell 2003 naming plasmalogen synthesis directly, and carries a GO:0008611 binding. A pexophagy node was added from Demers 2023, with the patient-fibroblast peroxisome count marked INDIRECT because that study did not measure autophagy. Seizure was re-sourced from a management fragment to an observation, with notes recording that the observation is severe-end; Cataract was removed entirely, because its only support was a GeneReviews management fragment listing cataract removal, which establishes that clinicians treat it rather than that it occurs at this severity. Validated with just validate (43/43 snippets verified, term validation passed) and all offline gates.

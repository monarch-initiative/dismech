  summary: Review and enrich Peroxisome Biogenesis Disorder 11B
  details: 'Audited all claims and snippets against cached sources and enriched Peroxisome Biogenesis
    Disorder 11B (MONDO:0013950). Added Harrison''s chapter (ENDOCRINOLOGY_METABOLISM, NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE)
    and ICIMD (peroxisomal_biogenesis) classifications plus structured ultra-rare prevalence (22 reported
    biallelic PEX13 individuals worldwide, PMID:37962062). Resolved pre-existing gene_activity_grounding
    defect on PEX13 Hypomorphic Deficiency by binding GO:0017124 (SH3 domain binding) and GO:0042803 (protein
    homodimerization activity) backed by structural/biochemical evidence (PMID:38632234), and eliminated
    all cross-file snippet collisions on PMID:35854306 against Peroxisome_Biogenesis_Disorder_11A_Zellweger.
    Enriched pathophysiology with CL cell types, UBERON anatomical locations, GO processes, module conformance
    (peroxisomal_metabolic_failure, cns_myelin_failure), and causal downstream links to all previously
    disconnected phenotypes; bound NCIT terms on biochemical, diagnosis, and treatment entries, CHEBI:16359
    on cholic acid supplementation, and CHEBI:50858 on adrenal replacement therapy.'

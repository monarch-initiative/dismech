  summary: 'Create: Peroxisome Biogenesis Disorder 11B'
  details: |
    Created the entry for the milder end of the PEX13 Zellweger spectrum. Deep research was run with falcon; the report resolved 9/9 references but cited only DOIs, so each was converted to a PMID and cited as a PMID. The GeneReviews Zellweger Spectrum Disorder chapter (PMID:20301621, tagged GeneReviews) was retrieved and used as the phenotype baseline for the intermediate/milder range, and Chiarini et al. 2022 (PMID:35854306) supplied the PEX13-specific genotype-phenotype and mechanism content. A gene-identifier error in my first draft was caught before use: I had written hgnc:8850 for PEX13, which is PEX1; the correct id is hgnc:8855, confirmed against the HGNC REST API. Three curation judgements. The p.Arg294Trp destabilisation claim is graded COMPUTATIONAL because it rests on modelling and blind docking rather than a functional assay. The secondary mitochondrial dysfunction node is curated as contributory with an INDIRECT_UNKNOWN_INTERMEDIATES incoming edge, quoting the authors' own statement that the role is potential and not yet fully understood. Most importantly, a CONTROVERSY discussion records that the 11A/11B split is the superseded ZS/NALD/IRD phenotype division applied to one gene: GeneReviews states ZSD is now used for all ZSD-PEX gene defects regardless of phenotype, and the reported PEX13 cohort spans both severities within single publications. The entry follows the existing KB precedent (Peroxisome_Biogenesis_Disorder_11A_Zellweger is already its own entry) and surfaces the merge alternative rather than taking it silently. Validated with just validate (23/23 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms.

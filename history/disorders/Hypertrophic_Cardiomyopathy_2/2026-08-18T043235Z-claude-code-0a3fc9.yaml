  summary: 'Create: Hypertrophic Cardiomyopathy 2 (TNNT2)'
  details: |
    Created the TNNT2 gene-specific hypertrophic cardiomyopathy entry (CMH2, MONDO:0007266, OMIM:115195), closing issue #8741. Modeled the 'malignant but mild' genotype-phenotype pattern distinctive to TNNT2 (disproportionately high sudden-cardiac-death risk relative to often-mild/subclinical hypertrophy), with a 7-node pathophysiology chain: thin-filament regulatory defect -> myofilament calcium sensitization and PKA-uncoupling -> two parallel branches (cardiomyocyte hypercontractility/energetic inefficiency leading to hypertrophy+fibrosis, and beat-to-beat electrophysiological instability/alternans leading directly to the malignant arrhythmic substrate) -> diastolic dysfunction -> progressive heart failure. Conforms to cardiomyopathy_maladaptive_remodeling at Primary Cardiomyocyte Insult, Ventricular Remodeling, Progressive Contractile Dysfunction, and Structural Cardiac Impairment and Heart Failure. Two mechanistic_hypotheses groups (canonical calcium-sensitization/uncoupling; alternative mutation-specific myofilament-vs-E-C-coupling divergence). Used the falcon (Edison) deep-research provider as requested on the issue; research/Hypertrophic_Cardiomyopathy_2-deep-research-falcon.md (11/11 references resolved, 0 confabulated). Ran the mandatory NEC preflight (just preflight-dr against MONDO:0007266) given the CMH numbered series is a documented high-NEC-risk class: automated verdict was SKIP (MONDO records no RO:0004003 causal-gene edge for the automated check), so the manual fallback was applied and passed (TNNT2 dominates gene mentions 89:4, OMIM 115195 matches exactly, and the report's own text correctly disambiguates CMH2 from other TNNT2 phenotypes) before using any of its content. Incorporated three falcon-surfaced PMIDs after independent verification: PMID:37929589 (contemporary penetrance meta-analysis, ~60% TNNT2 penetrance), PMID:34977031 (human iPSC-CM and transgenic-mouse electrophysiological arrhythmia mechanism for I79N), and PMID:35861968 (fetched but not ultimately cited). All other evidence (PMID:8205619, 7898523, 9060892, 40310325, 11600691, 27036851, 28735292, 37159677, 32731933) was located independently via PubMed search and fetched with just fetch-reference. Reused the umbrella's existing ClinGen CGGV assertion for TNNT2 (Moderate/SOP7, flagged in notes as a curation-vintage artifact relative to the Definitive SOP9 classifications on sibling MYH7/MYBPC3/TPM1 entries). Cross-references rather than duplicates the umbrella Hypertrophic_Cardiomyopathy entry (MONDO:0005045) for generic HCM treatment (mavacamten, beta-blockers, ICD, septal reduction); this entry's sole treatment node is genotype-informed risk stratification/cascade genetic testing, the TNNT2-specific management point. Validation: just validate (schema+terms+references) passed with 44/44 snippets verified; just count-verified-snippets 44/44; just check-duplicate-keys clean; relevant pytest test_data.py subset (conforms_to/foreign-key/duplicate-name checks) passed. just validate-disorders run once before opening the PR.

  details: |
    PR-shepherd pass addressing the two blocking IMPORTANT findings on PR #8808.

    (1) Added a Ventricular Arrhythmia phenotype (HP:0004308) between the arrhythmogenic-substrate node and Sudden Cardiac Death. Human evidence: PMID:40310325 (3.2% malignant ventricular arrhythmia in the low-risk p.Asn271Ile cohort, versus a 34.3% composite endpoint in codon-92 carriers). Model-organism corroboration: PMID:34977031 (I79N mice susceptible to ventricular tachycardia in the absence of structural abnormality). frequency: is deliberately omitted because the two quoted rates are not comparable bands - one is an isolated arrhythmia rate, the other a composite that also includes end-stage heart failure. The reviewer's term caution was followed: the deep-research report's HP:0001680 resolves to Coarctation of aorta and its HP:0005179 does not exist; HP:0004308 was checked against cache/hp/terms.csv and the phenotypeterm enum cache before use.

    (2) The sole treatments: item carried action_category: DIAGNOSTIC. It was moved into a new diagnosis: section with all three evidence items unchanged, retermed from NCIT:C15240 Genetic Counseling to NCIT:C15709 Genetic Testing, given a results: value, and its notes: rewritten to record why the entry now carries no treatments: section (cross-gene HCM therapy is curated on the umbrella entry) and why the wider imaging/ECG workup is not modeled (PMID:38718139 caches as an abstract-only AIM/METHODS/STRUCTURE stub and PMID:20301725 as its purpose statement alone, so neither is minable).

    Validation: just validate (46/46 snippets verified, up from 44/44), just validate-terms, just check-duplicate-keys, just check-title-snippets, just check-cache-order all pass. Phenotype connectivity remains 0/7 - it was 0/6 before this change, so the gap is pre-existing rather than introduced.

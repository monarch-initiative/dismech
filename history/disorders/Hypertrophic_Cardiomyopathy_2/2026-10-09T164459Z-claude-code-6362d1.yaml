  summary: Drop withdrawn ClinGen TNNT2-HCM validity citation
  details: |
    ClinGen unpublished its 2021 Moderate (SOP7) gene-disease validity assertion for TNNT2 and hypertrophic cardiomyopathy (CGGV:assertion_ef922dc4-...): on 2026-10-09 the report id returned ClinGen's invalid-identifier page, the row was absent from the gene-validity export, and the TNNT2 gene page listed only dilated cardiomyopathy 1D and arrhythmogenic right ventricular cardiomyopathy. Every evidence item quoting that row was removed; prose that stated the Moderate classification as current (the CMH2 inheritance description and notes) now records the withdrawal instead. In Hypertrophic_Cardiomyopathy_2 the autosomal dominant inheritance claim is re-supported by a background sentence from PMID:37159677, already cited by the entry, graded HUMAN_CLINICAL with quote_role BACKGROUND. The orphaned CGGV cache file, cited only by these two entries, was removed in the same change. Validated with just validate-disorders, count-verified-snippets, check-reference-titles, check-entity-refs and check-duplicate-keys. Found by the CGGV currency census in dismech issue 13576.

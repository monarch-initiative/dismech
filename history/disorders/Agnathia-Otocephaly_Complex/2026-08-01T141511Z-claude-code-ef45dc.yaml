  summary: 'Salvage residual differentials and corroborating references from closed
    PR #7321'
  details: |
    Recovers content that PR #7503 (which augmented the merged #7233 entry using #7240) did not carry over from the third, closed duplicate lineage (#7321, branch parked at e393da48).

    Adds two differential diagnoses absent from main: Tetra-amelia syndrome (MONDO:0010110), retained because biallelic WNT3/RSPO2 loss can produce near-isolated agnathia and those cases are a distinct entity that should not be absorbed into the complex; and Holoprosencephaly spectrum disorders (MONDO:0016296), the reciprocal differential where the discriminator is which developmental field is primary rather than mutual exclusivity.

    Adds three PMIDs cited nowhere on main, all corroborating rather than load-bearing: PMID:40723430 (micro-CT of historical museum specimens) as evidence for the tetra-amelia differential and as a second anatomic citation on Treacher Collins; PMID:17438667 (Faye-Petersen otocephaly series) as a third concordant source for the sub-1-in-70,000 birth incidence and as evidence for the holoprosencephaly-association differential; PMID:7590242 (Matsuo mouse Otx2) as the originating description of the Otx2 heterozygous otocephaly model, its homozygous-null result establishing the gene-dosage continuum.

    All three reference cache files are tool-generated (just fetch-reference) and were not hand-authored. They were present in the working tree but untracked when this branch was first pushed, and were committed in a follow-up after PR review caught the omission. No existing content was modified or removed; evidence items were appended to existing blocks only.

    Validation: just validate passed (schema, terms, 173/173 snippets verified against cached references), pytest -k Agnathia 9/9 passed, weighted compliance 99.1% (unchanged from main).

    Post-review corrections (ai4c-reviewer on PR #7662): the tetra-amelia differential was rebound from MONDO:0017439 (tetra-amelia, a non-syndromic morphological anomaly under MONDO:0017419) to MONDO:0010110 (tetraamelia-multiple malformations syndrome, TETAMS), the parent of tetraamelia syndrome 1 (WNT3) and 2 (RSPO2), which matches the entry's own WNT3-or-RSPO2 framing; the three reference cache files were committed; and the PMID:17438667 incidence explanation was softened from "independent" to "concordant" since the 2006 review predates the other two sources.

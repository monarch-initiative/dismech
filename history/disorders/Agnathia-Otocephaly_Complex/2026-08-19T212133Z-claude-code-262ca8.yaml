  summary: 'Fix four surviving review findings from superseded PR #7240'
  details: |
    Re-targeted the four still-true findings from PR #7240's CHANGES_REQUESTED review at main's live entry (PR #7240 itself was superseded by #7233 and its subsequent enrichments in #7503, #7662, #7960, #8713).

    Finding 1 - GO:0007224 "smoothened signaling pathway" on the Midline Forebrain Cleavage Failure node had no supporting evidence: its three evidence items never mention SHH or hedgehog, so the claim lived only in curator prose. Rather than drop the term, added two cache-verified evidence items that do assert it - PMID:29770994 ("HPE may occur in isolation (nonsyndromic) and is often associated with pathogenic variants in the genes SHH, SIX3, and ZIC2", SUPPORT/HUMAN_CLINICAL) and PMID:32100971 ("This study concluded that most genes in which variants cause a holoprosencephaly phenotype act in the TGF-beta, hedgehog and FGF signaling pathways.", PARTIAL because the agnathia-otocephaly report quotes it second-hand from a holoprosencephaly cohort study).

    Finding 2 - Dysphagia was not modeled as a phenotype despite a dedicated aerodigestive pathophysiology node, a gastrostomy treatment, and a cache-verified snippet quoted three times. Added a Dysphagia phenotype bound to HP:0002015 with two already-verified PMID:26517463 evidence items ("the lack of musculature make deglutition virtually impossible with current therapies" and "All four underwent perinatal tracheostomy and gastrostomy-tube placement"). Frequency deliberately omitted per the frequency-evidence SOP - the only quantitative source is a four-patient severe-survivor series.

    Finding 3 - Retagged 17 evidence items away from evidence_source: OTHER. 12x PMID:32100971 (Meier et al. 2020, a fetal patient report expanding the SMAD3 phenotype spectrum) and 4x PMID:20849990 (Gekas et al. 2010, an etiology review of agnathia-otocephaly) to HUMAN_CLINICAL. 1x PMID:34299147 was read before deciding: it is Fabik, Psutkova and Machon 2021, "The Mandibular and Hyoid Arches - From Molecular Patterning to Shaping Bone and Cartilage", whose abstract states "This review focuses on mouse and zebrafish models of craniofacial development", so it was tagged MODEL_ORGANISM rather than HUMAN_CLINICAL. It is a single-source-type item, so no split was needed.

    Finding 4 - Astomia carried no ontology term. HPO was searched (astomia, t~mouth, l~oral aperture, l~stomia, and the full descendant set of HP:0011337 "Abnormality of mouth size", whose only children are HP:0000154 "Wide mouth" and HP:0000160 "Narrow mouth"). No HPO class denotes absence of the mouth. HP:0000160 is already used for the Microstomia phenotype in this entry and asserts a small aperture rather than its absence, so it was deliberately not reused - no term beats a bad one. The phenotype stays preferred-term-only and a notes: line now records the search and the rejection rationale.

    Validation: just validate passed with "Snippets checked: 188/188 verified against cached references"; just count-verified-snippets 188/188; just check-duplicate-keys, just check-title-snippets, just check-cache-order and just check-term-cache-integrity all OK; just validate-disorders run once as the pre-PR sweep. No cache churn.

    Review round 2 (PR #8991): the new Dysphagia phenotype was the only phenotype in the entry that was not the target of any downstream edge, so it rendered as a disconnected pathograph node. Wired it as a DIRECT downstream consequence of "Airway Obstruction and Perinatal Respiratory Failure", whose own description already argued that the same anatomy makes deglutition impossible; the edge reuses the PMID:26517463 deglutition snippet already carried on that node, so no new reference was needed. Also: added target_mechanisms to "Gastrostomy tube feeding" (BYPASSES Dysphagia), mirroring the existing "Perinatal tracheostomy" BYPASSES airway-obstruction join; downgraded the new PMID:29770994 SHH item from SUPPORT to PARTIAL because its quote concerns isolated/nonsyndromic holoprosencephaly rather than the holoprosencephaly arm of agnathia-otocephaly, matching the PARTIAL tagging of the other two inferential items on that node; and populated the history links with the PRs. The two borderline PMID:32100971 retags (PRRX1 "encodes a homeobox gene" and "expressed in undifferentiated human embryonic cranial neural crest cells") were kept HUMAN_CLINICAL: evidence_source classifies the cited publication, which is a human fetal patient report, and the primary source for the expression claim (Celik et al. 2012) is not in references_cache, so tagging IN_VITRO would assert a study method that could not be verified.

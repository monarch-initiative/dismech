  summary: 'Create: Agnathia-Otocephaly Complex'
  details: |
    De novo creation of kb/disorders/Agnathia-Otocephaly_Complex.yaml (MONDO:0008740).

    Deep research: falcon (Edison Scientific), 447s, 16 citations, 1 markdown artifact -> research/Agnathia-Otocephaly_Complex-deep-research-falcon.md. The falcon report was treated as a lead set only: every DOI it cited was independently resolved to a PubMed record, and every snippet used in the entry was taken from an abstract fetched via `just fetch-reference`, not from the report text.

    NEC preflight: MONDO:0008740 was pulled with OAK and the report's disease identity checked against it. The report is unambiguously about the same entity (agnathia/otocephaly, first pharyngeal arch, OTX2 and PRRX1, OMIM:202650) and matches the MONDO RO:0004003 PRRX1 gene relation. No named-entity confusion.

    GeneReviews baseline: PubMed searches for "otocephaly GeneReviews[All Fields]" and "agnathia GeneReviews[All Fields]" both returned 0 results. No GeneReviews chapter exists for this disorder, so that baseline step is not applicable.

    Content curated: 10 HPO-bound phenotypes (mandibular aplasia, synotia, narrow mouth, aglossia, holoprosencephaly, microphthalmia, polyhydramnios, respiratory failure, cleft palate, situs inversus totalis); a five-node pathophysiology chain from anterior-patterning transcription factor insufficiency through cranial neural crest / first-arch ectomesenchyme failure, mandibular agenesis, and perinatal airway obstruction, plus a modifier-dependent variable-expressivity node; a genetic section covering OTX2 (causative), PRRX1 (causative), SMAD3 (candidate, single unreplicated case), and an explicit molecularly-unexplained-cases block carrying the 34% (11/32) diagnostic-yield figure and a REFUTE item for CNBP; three animal models (Otx2 heterozygous mouse, Prx1/Prx2 compound null mouse, zebrafish otx2 trans-suppression); EXIT-with-tracheostomy and genetic-counselling treatments; prenatal ultrasonography diagnosis; four differential diagnoses; a three-phase progression; and two discussions (a KNOWLEDGE_GAP for the unexplained molecular majority and a HUMAN_MODEL_MISMATCH for the mouse-Cnbp-versus-human-CNBP discrepancy the source authors themselves raise).

    Curation decisions worth flagging: (1) perinatal lethality is modelled under `progression` rather than as a phenotype, because HPO death terms (HP:0003811 and siblings) sit under Clinical modifier / Age of death and are outside the PhenotypeTerm value set; (2) the PRRX1 germline-mosaicism inheritance block deliberately carries no inheritance_term, since HPO's only mosaicism term (HP:0001442, "Typified by somatic mosaicism") describes somatic rather than germline mosaicism; (3) the entry is scoped to the broader agnathia-otocephaly complex rather than the narrower Orphanet "agnathia-holoprosencephaly-situs inversus syndrome" definition that MONDO:0008740 carries, with holoprosencephaly and situs inversus modelled as associated phenotypes. All three are recorded in the entry notes.

    Validation: `just validate` passes all three stages (schema, term, reference). All 71 evidence snippets were additionally verified by script as exact whitespace-normalized substrings of their references_cache abstracts. `just compliance` reports 93.2% weighted. 16 references were cached via `just fetch-reference`; no cache file was hand-written.

  summary: Rewrite 26 explanations naming the retired PARTIAL grade; add directness
  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place. This entry therefore explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim - the specific limitation each item carries - restated in terms of the current enum, following the pattern set by PR 10120. Where that reason IS an inference step, meaning the finding reaches this entry through a parent entity, a model organism, a pooled cohort or a disease class rather than from this disorder directly, directness: INDIRECT is added, because that is the slot the reason was always describing. Where the reason is something else - a variable phenotype, an untested construct, an n-of-1 overclaim - the retired token is dropped without asserting a directness nobody assessed. A consistency check enforces both directions: no explanation claims INDIRECT without the item carrying it, and no item carries it without the explanation saying why. No supports value, snippet, reference, evidence_source or ontology term changed. Twenty-one were rewritten mechanically and five by hand, including several whose explanation was a single-line scalar rather than a folded block and so was invisible to the first pass. Five items gain directness: INDIRECT - a holoprosencephaly statement made of the isolated/nonsyndromic form rather than the agnathia-otocephaly arm, a lethality snippet standing in for airway obstruction, and an iPSC chondrogenesis system not developed for or validated against this disease. The rest are variable-phenotype caveats, which are not directness claims and gain no slot. Validated with just validate-disorders across the tranche: 439/439 snippets verified.

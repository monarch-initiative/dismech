  summary: 'Create: Agnathia-Otocephaly_Complex'
  details: |
    Created kb/disorders/Agnathia-Otocephaly_Complex.yaml for MONDO:0008740 [agnathia-otocephaly complex, OMIM:202650, causal gene PRRX1 hgnc:9142]. Deep research run with the Edison Scientific falcon provider; report, citations sidecar and the single falcon artifact - a summary table, not an image - committed under research/. NEC preflight against the MONDO record confirmed gene PRRX1, OMIM xref 202650 and synonyms otocephaly / agnathia-holoprosencephaly-situs inversus syndrome all match, so the report was retained and used as leads. Entry carries 8 pathophysiology nodes with three conforms_to edges into kb/modules/pharyngeal_arch_patterning_serial_homology.yaml; 14 phenotypes; 6 genetic entries - PRRX1 and OTX2 causative, SMAD3 UNKNOWN (single de novo observation), CRKL and PGAP1 UNKNOWN model-organism candidates marked presence Absent, CNBP DISPUTED after negative human screening; structured birth prevalence of 1.43 per 100000; two inheritance blocks; a suspected-teratogen environmental block; four differential diagnoses including the two worked conformers of the same module, Treacher Collins and auriculocondylar syndrome; five animal models; one experimental model; 8 treatments; and 142 evidence items across 28 references. Every evidence snippet was verified programmatically as an exact whitespace-normalised substring of its references_cache abstract. Validated with just validate covering schema, terms and references, plus just validate-terms and just compliance at 99.6 percent global and 100 percent weighted. A fresh-context red-team self-review with the dismech-pr-review skill was run before pushing; it found and this commit fixes a wrong OTX2 case-fraction numerator (6 of 32 corrected to 7 of 32, since the authors' own cohort contributed a seventh array-CGH-detected OTX2 deletion), a microphthalmia snippet that did not mention microphthalmia, four gene relationship_type values that overstated gene-disease validity, an orphan Midline Forebrain Cleavage Failure node now wired into the OTX2 lesion, and several frequency bands whose explanations now state explicitly that the band is a clinical estimate rather than an extracted figure.

  summary: Evidence the new causal edges and narrow the cell-type binding
  details: |
    Each downstream edge from Heterozygous KCNN2 Loss of Function to a phenotype now carries an INDIRECT HUMAN_CLINICAL evidence item quoting the founding series (PMID:33242881) or the KCNN2 case series and review (PMID:36118511), and its description states only that the phenotype is reported in carriers with an unknown intervening mechanism. The movement-phenotype edges (abnormality of movement, extrapyramidal signs, myoclonus, dystonia, chorea, tics) were moved off Altered Neuronal Afterhyperpolarization and Firing, whose only evidence is mouse central vestibular neuron recordings proposed as a cause of tremor and locomotor deficits, onto the loss-of-function node. The seizure and nystagmus edges were removed: the source lists both only as other reported features. The firing node's cell type is rebound from CL:0000540 neuron to CL:0000117 CNS neuron (sensu Vertebrata), matching the central vestibular neurons in its evidence.

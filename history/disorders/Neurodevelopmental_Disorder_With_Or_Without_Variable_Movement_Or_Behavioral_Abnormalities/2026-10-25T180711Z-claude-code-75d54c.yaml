  summary: 'Create: Neurodevelopmental_Disorder_With_Or_Without_Variable_Movement_Or_Behavioral_Abnormalities'
  details: |
    New entry for the KCNN2 neurodevelopmental disorder (OMIM 619725, MONDO:0859225),
    curated as a DISEASE. The allelic myoclonic dystonia 34 (DYT34, MONDO:0030538) has
    its own MONDO and OMIM terms and was kept out of scope (split, not lumped); its case
    reports (PMID:32212350, 35106185, 41982418, 37510285 essential tremor family, and the
    DBS reports 40869056, 39788039) were read but not used as evidence for this entry.

    Deep research: openscientist (report and citations committed with its artifacts). The
    first launch failed because the recipe needs the KB file to exist. A second launch,
    before the KCNN2 genetic row existed, had no causal-gene anchor; its wrapper log reported
    termination but the provider job later completed and placed a second, dated report.
    The third launch, anchored on KCNN2, is the committed report. The dated duplicate was
    read and not committed: its new content (SK2 in Purkinje cell AHP, PMID:12040053,
    22794265, 26972012; calmodulin gating, PMID:15180477) is normal channel physiology
    rather than disease evidence, and its one disease-relevant addition, the in vitro
    positive-modulator rescue of I289N (PMID:36717104), was added to the loss-of-function
    node. Committed report validation: 8/8 references
    resolved, 0 off topic; the term-validation needs_review flag is the report's "NEDMAB"
    label for MONDO:0859225, which is benign. `just preflight-dr` could not run because the
    local MONDO build is absent and the host disk had no room to fetch it; a manual check
    found the report is about KCNN2 / OMIM 619725 throughout. Reconciled from the report:
    the Rahman 2023 review (PMID:37466411) statements on mAHP physiology and
    haploinsufficiency. Not taken: the report's cryo-EM SK4 and SK modulator citations
    (PMID:29724949, 30013223, 38242037), which are channel biology rather than disease
    evidence, and its HP:0000708 suggestion, replaced by the specific autism and anxiety
    terms.

    Phenotype frequencies come from the pooled percentages restated in PMID:36118511
    (quote_role BACKGROUND), because the founding Brain 2020 series (PMID:33242881) is
    cached as abstract only. The 60% pooled movement-disorder figure sits on HP:0100022,
    not on any narrower movement term. A C. elegans study (PMID:41040851) showing I359M as
    gain of function is recorded as a REFUTE item on the loss-of-function node.
    Treatments are limited to speech and occupational therapy from one patient's Table 1
    row; no pharmacotherapy for this presentation was found.

    Validation: just validate, validate-terms, count-verified-snippets (all verified),
    validate-disorders, check-entity-refs, check-causal-targets, check-coarse-phenotypes,
    check-snippet-length/grading, check-reference-titles, check-title-snippets, and the
    gene-activity grounding check (GO:0016286 bound on the KCNN2 node). Several whole-KB
    gates first failed with ENOSPC on the shared host and were rerun after space freed.

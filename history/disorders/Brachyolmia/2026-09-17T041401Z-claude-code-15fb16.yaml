  summary: Calibrate the PAPSS2 androgen-excess prose to what the source concludes
  details: |
    Review round (#11587): the previous edit fixed an overstatement in one direction ('overt androgen excess is not observed') and introduced one in the other ('does occur ... reported much less often than the skeletal phenotype'). The second is a true within-disease comparison but not the comparison PMID:38084048 makes. That review reports clinical androgen excess in 10/79 patients (12.6%) and then explicitly declines to call it disease-attributable, against a general-population background of 5-25% for hirsutism and 6-20% for PCOS. Both prose blocks - the 'Impaired steroid sulfation' pathophysiology node description and the 'Decreased circulating DHEAS' biochemical context - now carry the 12.6% figure and the not-above-background qualifier, and each gained an evidence item quoting the source's own statement of that comparison: 'it seems difficult to speak of an increased frequency ...' on the pathophysiology node, and the conclusion sentence 'Most published cases do not have clinical/biochemical hyperandrogenism ...' on the biochemical block. The mechanistic claim is untouched: the Noordam patient's impaired DHEA sulfation driving androstenedione and testosterone is real, and the correction is to the epidemiology only. For the reviewer's non-blocking suggestion 1, resolution 2 was taken and recorded explicitly: a notes line on the node saying androgen excess is deliberately not modelled as a phenotype because the source does not establish an above-background frequency. The reviewer proposed review_notes, which is not a slot on Pathophysiology; notes is. Suggestion 2 (regrading the PMID:9771708 background-biochemistry quote) was not taken: quote_role would be the precise instrument and this branch's schema predates it, so the choice is between leaving the defensible HUMAN_CLINICAL grade and moving to OTHER, which carries less information. Left as is. just validate passes with 83/83 snippets verified.

  summary: Bind MONDO:0019666 to the AR-PAPSS2 subtype and correct the androgen-excess
    claim
  details: |
    Resolved the lump/split call in issue #10307 in favour of option 1 (subtype, not a separate kb/disorders/ entry).

    Decision. The 2023 ISDS Nosology folds recessive brachyolmia and the historical Hobaek and Toledo types into PAPSS2-related spondyloepimetaphyseal dysplasia (NOS 04-0050, MIM 612847), so SEMD-PAPSS2 and the AR brachyolmia subtype are one entity rather than two. The concern recorded in the issue - that MONDO:0019666 over-claims because epiphyseal and metaphyseal changes are in its label - is about the label rather than the entity: Miyake 2012 (PMID:22791835) reports a gradation from brachyolmia to SEMD within the same PAPSS2 family, and describes the epiphyseal/metaphyseal changes as variable across six patients. The PAPSS2 pathograph is already curated inside this file (Deficient PAPS biosynthesis -> Cartilage glycosaminoglycan undersulfation -> Impaired vertebral endochondral ossification, plus the Impaired steroid sulfation -> Low serum DHEAS branch) with seven subtype: AR-PAPSS2 phenotypes, so a separate entry would duplicate all of it. Same reasoning #10297 applied to AD-TRPV4.

    Changes.
    - subtype_term MONDO:0019666 on has_subtypes AR-PAPSS2. preferred_term deliberately does not echo the ontology label, since the subtype describes the brachyolmia pole of a wider entity.
    - mappings.mondo_mappings on that subtype: MONDO:0018662 (skos:exactMatch, the Orphanet-derived duplicate MONDO has not merged with MONDO:0019666) and MONDO:0010070 / MONDO:0010074 (skos:narrowMatch, the Hobaek and Toledo historical types). Retires all three from the curation queue.
    - Corrected an overstatement in two places (the Impaired steroid sulfation node and the Low serum DHEAS biochemical record) that read 'overt androgen excess is not observed'. That is true of the Bownass cohort (PMID:31313512, quoted there) but not of the disease: PMID:38084048 reviews all 79 reported patients and reports androgen excess as less frequent, not absent, and documents a patient meeting PCOS criteria. The existing Bownass evidence items are untouched; only the surrounding prose changed, and the frequency claim now carries its own evidence.
    - Added PMID:9771708 (Faiyaz ul Haque 1998, Nat Genet) to the Deficient PAPS biosynthesis node. It is the founding PAPSS2 skeletal-dysplasia paper and was previously uncited here.
    - Deleted stubs/Spondyloepimetaphyseal_Dysplasia_PAPSS2_Type.yaml; the disposition is entry_type SUBTYPE.

    Not done, deliberately.
    - Did not quote the nosology itself (PMID:36779427). Its Group 4 table is not in the cached full text - the cache is the narrative only - so the NOS 04-0050 row is not snippet-verifiable here. The lumping is cited through PMID:38084048, which states it in quotable prose.
    - Did not touch the AD-TRPV4 or LTBP3 subtypes (#10297, #10208/#10214).
    - Did not restructure Brachyolmia into a Grouping. Worth revisiting once the LTBP3 form is fully curated elsewhere, since the 2023 nosology places the three forms in three different groups; flagged in #10307, not decided here.
    - MONDO:0018662 duplicating MONDO:0019666 is an upstream MONDO merge request that this repo cannot file.

    Validation. just validate (passed), just validate-terms (passed), just count-verified-snippets (81/81 -> see PR), just check-stubs (no errors).

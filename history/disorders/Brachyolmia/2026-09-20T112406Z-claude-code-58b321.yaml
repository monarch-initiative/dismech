  details: |
    Genetics pass for issue #12191. TRPV4, the MONDO-recorded gene for MONDO:0007232 (autosomal dominant brachyolmia), was already curated and already bound on its own pathophysiology node, as were PAPSS2 and LTBP3. The gap was that none of the three has_subtypes rows carried a genes: descriptor. Bound TRPV4 to AD-TRPV4, PAPSS2 to AR-PAPSS2 and LTBP3 to the LTBP3 row, and added relationship_type: CAUSATIVE to the three genetic: records, which previously carried only free-text association: Causative. The AR-PAPSS2 row's deliberate binding to the broader SEMD PAPSS2-type MONDO term, and its three narrowMatch mappings, were left exactly as curated. No prose, evidence or references changed. Validated: just validate (83/83 snippets), validate-terms, and the offline gate set.

  summary: Address ai4c-reviewer changes on PR 7744
  details: |
    Response to the automated ai4c-reviewer change request on PR 7744. Both blocking items addressed plus all four optional suggestions.

    BLOCKING 1 - Visual impairment HP:0000505 added. The reviewer was right that this is snippet-verifiable rather than full-text-only: the founding series PMID:29556724 says 'eye and vision abnormalities', which is a vision-function claim distinct from the structural-eye claim. Curated on that exact snippet with no frequency band; the 17 of 22 denominator stays in the description as explicitly full-text-only. Also wired as target_phenotypes on the visual-rehabilitation treatment.

    BLOCKING 2 - differential_diagnoses populated with six entries, every MONDO term verified with OAK before use: SOX2 MONDO:0008799, OTX2 MONDO:0012413, CHARGE/CHD7 MONDO:0008965, PAX2 MONDO:0007352, SALL4 MONDO:0011812, PAX6 MONDO:0007119. distinguishing_features used as a multivalued list of discrete discriminators as the schema intends. Four new GeneReviews chapters fetched and cached for evidence: PMID:20301296 CHD7, PMID:20301624 PAX2, PMID:20301547 SALL4, PMID:20301534 PAX6. Two discriminators are unusually sharp and worth flagging: PAX2 GeneReviews states iris colobomas have never been reported in PAX2-related disorder, and PAX6 GeneReviews states little variability is seen between the two eyes - the direct inverse of the PRR12 asymmetry that defines this entry.

    OPTIONAL, all four applied. Split the bundled Disrupted Cardiac and Renal Organogenesis node into Disrupted Cardiac Organogenesis and Disrupted Renal Organogenesis, each now carrying GO and UBERON annotation, and split the matching ORGANISM endpoint likewise; this also resolved the evidence mismatch the reviewer spotted, since the PrediXcan snippet is renal and ocular specific and now sits only on the renal node. Tightened the cohesin node description to state explicitly that its curated scope is the neurodevelopmental arm only and that no evidence connects it to the ocular, cardiac, or renal malformations, which was the honest fix rather than drawing unevidenced edges. Treatments regranularised from four to seven: physical, occupational, and speech-language therapy as distinct entries with specific NCIT terms, low-vision rehabilitation split out of the surgical entry because it is rehabilitative not operative, and the generic NCIT:C15329 Surgical Procedure replaced with the specific NCIT:C15331 Ophthalmologic Surgical Procedure. Carried transcript, isoform, recurrent-variant, and constraint detail into the genetic notes as prose, since it is full-text-only.

    Validation after changes: just validate, just validate-terms, just validate-references all pass, with 100 of 100 snippets verified, up from 80. All internal foreign keys re-checked after the node splits and resolve cleanly. Staging remained targeted; the repo-wide cache churn was left unstaged.

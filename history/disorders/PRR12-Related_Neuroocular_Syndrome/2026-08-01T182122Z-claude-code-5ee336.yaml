  summary: 'Create: PRR12-Related Neuroocular Syndrome'
  details: |
    De-novo curation of neuroocular syndrome 1 / MONDO:0971007 / OMIM 619539 / PRR12, opened as issue 7713.

    NEC preflight PASSED before any deep-research content was used. runoak on sqlite:obo:mondo for MONDO:0971007 returned label 'neuroocular syndrome 1', relationship RO:0004003 HGNC:29217 PRR12, and xref OMIM:619539 - all three identity anchors match the intended entity. Other MAC-spectrum genes SOX2, OTX2, RAX, STRA6 were explicitly excluded. The high-risk confusable is spaceflight-associated neuro-ocular syndrome, which dominates PubMed for the bare phrase 'neuroocular syndrome' and is already a separate dismech entry; the entry is therefore named gene-first as PRR12-Related Neuroocular Syndrome while keeping the MONDO binding.

    Duplicate preflight: no PRR12, NOC1, or MONDO:0971007 match in origin/main kb/, and no prior PR. Positioned against in-flight PR 7638 Isolated_Anophthalmia-Microphthalmia_Syndrome MONDO:0016764, which is a distinct gene-agnostic entity and was not edited.

    Deep research: Edison/falcon via just research-disorder, 384s, report and citations committed under research/. The report proved to be a full-text read of the single delineating cohort paper PMID:33824499 and cited nothing else. An independent PubMed sweep added eight further papers the DR missed, including the ophthalmic-genetics cohort PMID:33314030, the founding series PMID:29556724, the translocation case PMID:26163108, the 2025 Dev Cell cohesin mechanism paper PMID:39742660, and the zebrafish expression study PMID:38674426.

    Curated content: a seven-node pathograph from truncating allele and nonsense-mediated decay through haploinsufficiency to three parallel arms - neural, ocular, and cardiorenal - with two competing mechanistic hypotheses, the CANONICAL transcriptional-cofactor model and the EMERGING NIPBL/cohesin model. Twenty-three phenotypes, structured prevalence including the MAC diagnostic-yield figure, genetic allelic spectrum, three diagnosis entries, four supportive treatments, and three discussions covering unilateral eye penetrance, ascertainment bias between the two cohorts, and a HUMAN_MODEL_MISMATCH on the mouse-derived cohesin data.

    Evidence discipline: no GeneReviews chapter exists for PRR12, confirmed by PubMed search returning zero hits. PMID:33824499 is abstract-only in PubMed, so full-text-derived frequencies surfaced by the DR run are recorded as prose in notes and descriptions rather than as evidence items with unverifiable snippets. Frequency bands were asserted only where the abstract quantifies them.

    Validation: just validate, just validate-terms, and just validate-references all pass. 80 of 80 snippets verified against cached references. Only the nine new PMID cache files were staged by explicit filename; the repo-wide references_cache and cache CSV churn produced by the validators is pre-existing and was deliberately left unstaged.

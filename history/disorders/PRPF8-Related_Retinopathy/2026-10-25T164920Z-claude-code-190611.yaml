  summary: 'Create: PRPF8-Related_Retinopathy'
  details: |
    Curated from the stub of the same name (stub deleted) as part of the splice variants project. Falcon was requested by the curation workflow default but the provider was unavailable in this environment, so the claude_code provider report was used; preflight-dr passed for SNRNP200 and warned for PRPF8 only because the report abbreviates retinal pigment epithelium as RPE, which is also a gene symbol. Primary literature was fetched and quoted directly; ClinGen Definitive gene-disease validity records are cited for the gene and case fraction. A fresh-context review led to: correcting the SNRNP200 case-fraction denominator to the 251-family cohort, dropping phenotypes that rested only on ClinGen's generic retinitis pigmentosa feature list and the photophobia figure that pooled a recessive patient, separating the early homozygous from the late heterozygous Prpf8 mouse findings, marking pooled multi-gene results as pooled, and adding truncating PRPF8 variants. The entry conforms to spliceosome_component_dysfunction and is a member of the Spliceosomopathies grouping. Validated with validate-disorders (0 issues), count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets and check-gene-validity.

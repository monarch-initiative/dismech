  summary: Wire module conformance and add prevalence records
  details: |
    Two changes from a systematic re-review of the KB's Mendelian gut disorder coverage.

    1. Module conformance. Two pathophysiology nodes now declare conforms_to against the new diet_induced_osmotic_diarrhea module: "Brush-border sucrase-isomaltase deficiency" -> the module trigger, and "Carbohydrate malabsorption and intestinal symptoms" -> the module central effector. Before this change no Mendelian gut entry in the KB declared conformance to any module, even though four entries (this one, congenital lactase deficiency, trehalase deficiency and glucose-galactose malabsorption) were independently re-deriving the same causal chain.

    2. Prevalence. The entry had no prevalence records. Added two structured Prevalence blocks from PMID:35565890: North America and Europe (1/500-1/2000, recorded as rate_low 50 / rate_high 200 per 100,000) and Greenland (5-10%). The North American/European record carries a note recording that the reported range straddles a band boundary - 1/2000 sits at the top of BAND_1_5_PER_10000 while 1/500 falls in ABOVE_1_IN_1000 - and that the more conservative band is recorded with the precise range carried in rate_low/rate_high rather than the band being silently rounded either way.

    The Greenland snippet was initially truncated before the figures to avoid en-dash characters; that produced a technically verified but substantively empty quote, so it was replaced with the full sentence including its original en dashes, which verifies as an exact substring.

    Validation: linkml-validate clean; 60/60 snippets verified against cached references.

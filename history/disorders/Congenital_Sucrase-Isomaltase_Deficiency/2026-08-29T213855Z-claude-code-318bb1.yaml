    # Evidence review: Congenital_Sucrase-Isomaltase_Deficiency.yaml

    ## Stats
    - Evidence items checked: 45 (all `reference:` blocks, including downstream edges, readouts, target_mechanisms, prevalence)
    - References read: 10 (PMID:39128102, PMID:38327254, PMID:33772704, PMID:33972906, PMID:11340066, PMID:16543230, PMID:24433566, PMID:35565890, ORPHA:35122, NCIT:C66525)
    - Verified clean: 45 (no edits required); mechanical snippet check 45/45 verified

    ## Findings
    1. Location: pathophysiology "Carbohydrate malabsorption..." downstream Bloating / Abdominal Pain, and phenotypes Bloating (line ~505) / Abdominal Pain (line ~520); reference PMID:39128102. Problem: the quoted symptom percentages ("abdominal pain (37%), gas irritability (33.3%), bloating (22.2%)...") are from symptomatic *heterozygous* c.317G>A carriers in the family study, not homozygous CSID patients; the paper itself frames heterozygote symptomaticity as an unexpected finding. Explanations honestly say "SI-variant carriers"/"mutation-positive relatives", and each claim also carries an independent CSID reference, so grading SUPPORT is tolerable but PARTIAL would be more precise. Severity: NOTE. ACTION: reported only — grading not plainly wrong and the claims are co-supported by direct CSID sources.
    2. Location: multiple items citing PMID:33772704 (inheritance-adjacent mechanism claims: genetic SI variants line ~65, pathophysiology brush-border node line ~108, folding/trafficking node line ~189, sucrase/isomaltase activity edges and biochemical items). Problem: PMID:33772704 is a cross-sectional qualitative interview / HRQL study; the quoted sentences ("Mutations in the SI gene result in abnormal synthesis...", "Patients with CSID generally have reduced sucrase activity", "levels of isomaltase activity range from absent to almost normal.") are abstract *background* statements, not findings of that study. Snippets are exact and factually standard; evidence_source HUMAN_CLINICAL is defensible (human-patient study). Severity: NOTE. ACTION: reported only — a primary biochemical source would be stronger support for the activity claims.
    3. Location: biochemical "Sucrose hydrogen breath test" (presence: INCREASED, line ~674) and its readout; reference PMID:33972906. Problem: the quote establishes the breath test as a diagnostic confirmation but does not itself state the *direction* (increased breath hydrogen); direction is inferred. Severity: NOTE. ACTION: reported only — inference is mechanistically safe and the same reference is the best available in-file source.
    4. Location: inheritance "Autosomal Recessive" (line ~33); reference PMID:39128102. Problem: none with the quote (exact, directly states AR inheritance), but note the paper's own conclusion qualifies that heterozygotes can be symptomatic; the entry does not model that nuance. Severity: NOTE. ACTION: reported only — outside conservative fix scope.
    5. ORPHA:35122 rows (six downstream edges + six phenotypes, Vomiting/Nausea/Constipation/GER/Poor Appetite/Flatulence): each snippet is an exact cache table row, frequency FREQUENT matches "Frequent (79-30%)", evidence_source OTHER is correct for a structured record. Clean.
    6. NCIT:C66525 P302 edge row for sacrosidase, and both prevalence quotes from PMID:35565890 (including the en-dash "5–10%" figure): exact, correctly graded, OTHER justified in-file for the review/structured sources. Clean.

    ## Sections reviewed
    inheritance, genetic, pathophysiology (incl. downstream edges), phenotypes, biochemical (incl. readouts), diagnosis, treatments (incl. target_mechanisms), prevalence

    ## Verdict
    Evidence quality is high: every snippet is an exact substring of its cached source, attached to the claim it supports, with honest explanations and correct evidence_source values (including the deliberate OTHER-for-review convention). The only soft spots are reliance on heterozygous-carrier symptom percentages for two symptom claims and on background sentences from a quality-of-life study for core biochemistry claims — all accurately explained in situ, none warranting edits.

  summary: Bind LOINC disaccharidase panel, enzyme activity and challenge codes across
    three tests and three markers
  details: |
    LOINC Diagnostics tranche G, batch 25 (functional and provocative tests with diagnostic thresholds). Code selection was made against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin, and every candidate set was fully enumerated rather than read off a ranked search page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 526 snippets and 587 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms and check-block-scalar-comments all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:57765-0 (Disaccharidases panel, small intestine tissue) to the duodenal disaccharidase assay row, with its component activities bound on the markers they report: LOINC:30372-7 (sucrase) and LOINC:74954-9 (isomaltase), both the small-intestine-tissue forms rather than the generic tissue ones. The release's other disaccharidase code, LOINC:57779-1, is a narrative interpretation and was declined by campaign rule. LOINC 2.83 has no sucrose breath test code: exactly 14 codes carry sucrose in their name, none in exhaled gas, covering urinary sucrose and sucrose-to-creatinine permeability ratios, sucrose in stool and in unspecified specimen, dietary sucrose intake, a microbiological polysaccharide-production test, and the sucrose haemolysis test, which despite the matching word is a red-cell assay for paroxysmal nocturnal haemoglobinuria. Nor does the release pair sucrose with carbon dioxide or a 13C label. The sucrose breath rows therefore bind LOINC:33471-4, the challenge-unspecified exhaled hydrogen quantity, on both the diagnosis row and the breath-hydrogen marker. Likewise the sucrose tolerance test binds LOINC:39997-2 and LOINC:16914-4 (serum glucose pre and post unspecified challenge): of the 648 challenge-qualified glucose codes in the release, the named substrates include oral and intravenous glucose, lactose, fructose, glucagon, insulin, arginine and a test meal, and sucrose is not among them. No reference ranges were added; the entry states its results qualitatively and names no cutoff.

  summary: 'Create: Combined oxidative phosphorylation deficiency 42'
  details: |
    De-novo creation of the COXPD42 (GATC / GatCAB) entry from stubs/.

    DEEP RESEARCH DISCARDED - Named Entity Confusion. A falcon report was generated
    for this disorder and failed the NEC preflight against MONDO:0030008 with verdict
    FAIL: the canonical gene GATC was mentioned ZERO times while MRPS2 was mentioned
    53 times, and the report's OMIM ID (617872) disagreed with the MONDO xref
    (618839). OMIM 617872 is COXPD36 (MRPS2), a different disease. The report is
    labelled "COXPD42" throughout while its content describes the MRPS2 entity, which
    is why only the gene-frequency check catches it - its citations resolve and its
    snippets would verify. Per the discard rule the report was NOT cherry-picked and
    NOT committed; the files were deleted rather than left in research/, where they
    would misleadingly register provider coverage for this disorder and mislead the
    next curator. This entry is built entirely from primary literature identified
    independently via PubMed, so no report content reached it.

    Entry-type decision: dedicated Disease entry. MONDO:0030008 records no
    descendants and a single causal gene (GATC, RO:0004003), and is not obsolete in
    the current release (checked against OLS after the MONDO:0014866 obsoletion found
    in the sibling CMT2T task).

    Pathograph: 7 nodes, 6 edges, single root, every node reachable from the root
    (measured). Chain runs biallelic GATC missense -> GatCAB trimer destabilization
    -> impaired transamidation of Glu-mt-tRNA(Gln) -> deficient mitochondrial protein
    synthesis -> combined respiratory chain enzyme deficiency -> tissue-selective
    bioenergetic failure of the myocardium -> lethal infantile cardiomyopathy with
    lactic acidosis. Conformance declared to
    mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress at the
    respiratory-chain node only, with the reasons for not conforming further recorded
    in the node description and in notes: the module is built around age-related
    mitochondrial damage, and its reactive-oxygen-species arm is not evidenced in
    these patients.

    Curation decisions worth recording. The defining paper reports nine patients
    across three genes in shared tables, and its summary counts (cardiomyopathy 9/9,
    anaemia 7/7) are NOT GATC-specific. Every GATC-specific statement in this entry
    was derived by reading the per-patient columns for P4A, P4B, P4C, P5A and P5B,
    and the attached snippets are sentences that name families 4 and 5 or patients
    within them. No frequency: band is assigned anywhere - with five patients sharing
    one allele a percentage would imply precision the series cannot support.
    functional_impact_category is PARTIAL_LOSS_OF_FUNCTION rather than
    LOSS_OF_FUNCTION because GatC protein is reduced to about 20 percent rather than
    abolished and the source states that complete loss is thought to be embryonically
    lethal.

    Two claims are explicitly kept out of the human pathograph and curated on a model
    instead: increased reactive oxygen species, and the finding that mischarged
    Glu-mt-tRNA(Gln) is rejected rather than mistranslated. Both come from a
    mouse-cell GatA knockdown, a different subunit and species.

    No treatments block. The glutamine-conditional biochemistry invites a
    supplementation hypothesis; it is recorded as an open KNOWLEDGE_GAP discussion
    with its three specific obstacles (supraphysiological culture concentrations, the
    rescue seen only in the least-affected tissue, and the chloramphenicol
    block-and-release result suggesting the constraint is enzymatic throughput rather
    than substrate supply) rather than curated as a therapy.

    A title-quoting snippet was caught and replaced during curation: PMID:29440775 was
    initially quoted by title and was re-quoted from its abstract's concluding
    sentence after checking that the cached record does carry abstract text.

    Validation run in the worktree: just validate -> all validations passed;
    just count-verified-snippets -> 51/51 verified against cached references;
    just validate-terms -> passed; just validate-disorders run once before the PR. A
    reference_title audit confirmed the cited reference_title values match the title:
    line in their cache frontmatter (one differs only by a non-breaking space in the
    cached PubMed title for PMID:24579914, "in vivo").

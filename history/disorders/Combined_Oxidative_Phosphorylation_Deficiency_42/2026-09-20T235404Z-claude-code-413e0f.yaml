  summary: 'Migrate HP:0003236 to HPO''s current label (issue #12358)'
  details: |
    Corpus-wide label migration for HP:0003236 (issue #12358). HPO renamed this term to "Elevated circulating creatine kinase activity"; this entry carried the previous label, "Elevated circulating creatine kinase concentration".

    The old label passed term validation because validation is cache-first and cache/hp/terms.csv held a row from 2026-03-18 with the previous label. That is why this could not be fixed one entry at a time: re-deriving the cache row corrects it and then fails every entry still carrying the old string, so the cache row and all 77 bindings had to move in one commit.

    Changed in this entry: the term.label under id HP:0003236, and the preferred_term where it carried the previous canonical label verbatim. The cache row was re-derived through the validator per the term-cache recovery procedure, never retyped.

    Deliberately unchanged: evidence snippets quoting Orphanet phenotype rows, which are exact substrings of cached reference records and would fail snippet validation if rewritten; pathograph node names and the bare downstream targets naming them, which are curator labels and file-local foreign keys rather than ontology labels; and references_cache/, research/ and history/, which are respectively never hand-edited, provider output, and append-only.

    Verified against the configured validation source: runoak -i ols:hp info HP:0003236 returns "Elevated circulating creatine kinase activity", and the term is not obsolete. Note the local sqlite:obo:hp build still returns the previous label, so a spot-check against a local build will disagree. Validated with just validate-disorders across the full 75-file set plus the offline gate suite.

  summary: 'Addressed PR 17281 review: added IVIg, negative fatigue pharmacotherapy trials, and anesthetic precautions, added frequent Orphanet non-motor/mobility phenotypes, and aligned Skeletal Muscle Atrophy frequency'
  details: |
    Added Intravenous Immunoglobulin (NCIT:C15986 with NCIT:C80829 Human Immunoglobulin G, targeting Low-grade Neuroinflammation), Fatigue Pharmacotherapy negative RCTs (supports: REFUTE for prednisone, amantadine, modafinil, and conflicting pyridostigmine trials), and Perioperative Anesthetic Precautions (NCIT:C15181), plus target_mechanisms on Non-Invasive Mechanical Ventilation and Respiratory Support -> Respiratory Insufficiency. Added Excessive daytime somnolence (HP:0001262, current HPO replacement for ORPHA:2942's obsolete HP:0100786 Hypersomnia), Difficulty climbing stairs (HP:0003551), and Abnormality of mental function (HP:0011446) with Orphanet and PMID:31379723 support and causal wiring, documented ORPHA:2942 Pain/Muscle weakness specificity in notes, aligned Skeletal Muscle Atrophy frequency to OCCASIONAL per ORPHA:2942, removed off-target PMID:15599928 item from Lower motor neuron disorder, and neutralized Cold Intolerance descriptions.

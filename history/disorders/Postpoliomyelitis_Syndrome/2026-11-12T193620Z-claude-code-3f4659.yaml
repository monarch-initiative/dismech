  summary: 'Reviewed Postpoliomyelitis Syndrome: harmonized review evidence grading,
    added synonyms, diagnosis, respiratory ventilation treatment, Orphanet phenotypes,
    and 100% causal phenotype connectivity'
  details: |
    Added MONDO and Orphanet (ORPHA:2942) synonyms, exactMatch mondo_mappings, Harrison's NEUROLOGIC classification, and 15-40 year post-polio latent progression. Harmonized all narrative review and background citations (PMID:15599928, PMID:20494327, PMID:31379723, PMID:37092507) to OTHER with REVIEW_SYNTHESIS or BACKGROUND quote_role while retaining HUMAN_CLINICAL on primary SFEMG/EMG studies (PMID:2261887, PMID:2286169). Preserved protected node name Chronic Motor Neuron and Terminal Axon Metabolic Overload and HP:0002366 grouping anchor, added biological_scale and UBERON spinal ventral horn and skeletal muscle locations across all 4 pathophysiology nodes, added Fasciculations (HP:0002380), Arthralgia (HP:0002829), and Dysarthria (HP:0001260), and wired bare-name downstream edges to all 11 phenotypes (100% connected). Added Neurologic Examination (NCIT:C81313) and Electromyography (NCIT:C38056) diagnosis entries, added BEHAVIORAL modality and overload target_mechanisms on Rehabilitation, and added Non-Invasive Mechanical Ventilation (NCIT:C171457) treatment.

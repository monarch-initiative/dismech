  summary: 'Review round 2: phenotype gaps, node scoping, VLCFA qualification, differentials'
  details: |
    Answered the CHANGES_REQUESTED review on PR #10447 in a single push. Added Dysarthria (HP:0001260), the third member of the movement-disorder triad and the only feature documented in both inheritance arms, and Dysmorphic facial features (HP:0001999), a quarter of the eponymous tetrad; both are supported by sentences in caches the entry already shipped, so the omission was a curation gap rather than a sourcing one. Narrowed the root pathophysiology node's genetic_context by dropping variant_origin DE_NOVO and zygosity HETEROZYGOUS, which described only the monoallelic arm even though that node is the shared root through which every downstream edge of both arms flows; functional_impact_category LOSS_OF_FUNCTION is true of both and was kept. Surfaced the qualifying serum result from PMID:29496980 on the elongation node as a REFUTE item against the general reduced-plasma-VLCFA reading, alongside the existing SUPPORT item and a new IN_VITRO fibroblast item, plus a node note recording that the compartment in which the defect is measurable differs by arm. Added prevalence with prevalence_class ULTRA_RARE, which the earlier decision to omit prevalence entirely had been too strong about. Added two differential diagnoses: ELOVL4-related disorder, from a sentence in an already-shipped cache, and X-linked adrenoleukodystrophy, which required one new reference. The X-ALD case is the opposite pole of the same biochemical axis, so PMID:20166112 was fetched to establish that ELOVL1 is the single elongase synthesising C26:0. A first PMID guessed for that paper resolved to an unrelated article titled Consanguinity and was discarded rather than cited; the correct identifier came from a PubMed title search. Declined two suggestions with reasons recorded in the entry notes: palmoplantar keratoderma, because no shipped cache mentions it and the suggested HP:0007479 is Congenital nonbullous ichthyosiform erythroderma rather than a keratoderma term, and dietary VLCFA intake as an environmental modifier, because the only source hedges it as something that may influence expression in a future-work sentence. Validation: schema, terms and references clean with 47/47 snippets verified, up from 37/37; all offline gates green.

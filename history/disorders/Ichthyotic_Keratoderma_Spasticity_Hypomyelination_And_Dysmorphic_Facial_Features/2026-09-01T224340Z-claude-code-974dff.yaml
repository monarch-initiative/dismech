  summary: 'Create: IKSHD / ELOVL1-related neuro-ichthyotic disorder (MONDO:0032798)'
  details: |
    New entry for MONDO:0032798, ELOVL1-related neuro-ichthyotic disorder. Claim issue #10412.

    Mechanism is one enzymatic lesion reaching two organs. ELOVL1 sets the chain-length ceiling for C22-C26 saturated and monounsaturated fatty acids, and two tissues specifically require the longest species: the ceramide lamellae of the stratum corneum and the sphingolipids of central myelin. The chain splits after the elongation node into an epidermal arm ending in ichthyosis and a myelin arm ending in hypomyelination, spastic paraparesis and nystagmus. Patient fibroblast transcriptomics shows both arms simultaneously as reciprocal programmes, keratinisation up and myelination down.

    Scope decision, and it differs deliberately from the RBP4 entry curated in the same batch. Both inheritance arms are curated together here because MONDO carries exactly one ELOVL1 disease concept, checked against the ontology rather than assumed. For RBP4 the dominant and recessive arms each had a home, so keeping them apart cost nothing. Here, scoping to the monoallelic arm alone, which the disease name would justify since IKSHD is that report's own acronym, would leave the seven published biallelic patients with no entry. They are separated as has_subtypes so the split can be made cleanly if MONDO adds a term, and a discussion records that the lumping is provisional.

    Model discipline. Two mouse strains are curated with opposite verdicts on the same node. The Elovl1 null is definitive for the epidermal arm and FAILS_TO_RECAPITULATE the neurological one, not because myelination is normal but because the animals die within hours of birth from barrier failure and never reach myelination. The hypomorphic Elovl1 mutant survives and carries the myelin phenotype. Recording the null as simply a model of ELOVL1 deficiency would conceal that the most complete genetic model of this gene cannot speak to half the disease.

    Two things removed rather than shipped. An acanthosis nigricans phenotype was drafted and then dropped: the feature appears only in the title of PMID:30487246 and nowhere in the retrieved abstract, and a title is not a finding. Seven reference caches fetched during research were deleted as uncited, covering elongase reviews, congenital ichthyosis treatment trials and X-linked adrenoleukodystrophy lipidomics, all of which concern other diseases.

    Report handling. The deep-research report's one machine-checked quote failed verification and turned out to be a paraphrase rather than a fabrication, compressing and reordering a real sentence from PMID:40590574; the full original is what the entry quotes. Six further term flags were category headings written where the term name belonged, with correct identifiers. The fetch of PMID:40590574 failed once with an HTTP 400 from the PMC provider and succeeded on retry, which is worth distinguishing from a bad identifier. One curation error of mine: GO:0030497 fatty acid elongation was first filed under molecular_functions and is a biological process, caught by the dynamic-enum validator, the same slip made on the RBP4 entry.

    Validation: linkml-validate clean, linkml-term-validator --labels clean, 37/37 snippets verified, check-entity-refs, check-duplicate-keys, check-causal-targets and check-qualifier-terms all OK. Cited PMIDs reconciled against shipped caches by re-deriving the list from the entry file.

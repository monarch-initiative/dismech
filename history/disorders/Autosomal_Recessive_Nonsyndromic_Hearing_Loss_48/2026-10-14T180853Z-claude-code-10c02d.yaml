  details: |
    Added a LOINC-coded pure-tone audiometry measurement set (panel plus 500/1000/2000/4000 Hz per ear) to the existing Audiological characterization and pre-implant imaging diagnosis row, with a clarifying sentence stating the codes represent the pure-tone audiometric component only, not auditory brainstem response testing or temporal-bone CT also described in that row. Added one new evidence item quoting the pure-tone audiometry finding the measurements represent, alongside the row's existing ABR and CT evidence. No reference range is bound: the entry's own phenotype section states that severity varies between families, including families sharing the same CIB2 founder variant, and spans moderate-to-severe, severe-to-profound and profound presentations, so no single WHO/GBD band would represent the gene's range.

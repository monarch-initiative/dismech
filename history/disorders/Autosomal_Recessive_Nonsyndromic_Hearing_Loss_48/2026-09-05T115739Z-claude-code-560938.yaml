  details: |
    Corrects an error made in the immediately preceding session on this entry, recorded in 2026-09-05T114037Z-claude-code-8fb4b4.yaml. That record and its commit state that the two open candidates removed from the stereocilia-growth node were uncited and were not what the source raises. The first half is true, the second is false, and the reviewer of #10972 caught it.

    PMID:28663585 - already cached, and cited thirteen times in this entry - raises BOTH removed candidates in its discussion at references_cache/PMID_28663585.md:248: that CIB2 may be part of the myosin XVa/whirlin stereocilia elongation complex, and that as a calcium binding protein it may buffer free calcium near the MET channels at the stereocilia tips. So the previous round replaced a real, sourced pair of candidates with a different real, sourced candidate from a different paper and described the removal as correcting an invention. The earlier record is left in place rather than edited, because it accurately records what was believed at the time and the correction is more informative than a silent fix.

    The node text is rewritten to name all three candidates with their sources, and to record two of them as retired on evidence the entry already carried rather than dropped. The myosin XVa/whirlin route is what the WHRN independence results in this same node argue against. The calcium-buffering route is undercut by PMID:26173970, whose ratiometric calcium imaging shows the p.F91S and p.R66W deafness substitutions do not alter CIB2 calcium buffering. The retirement is explicitly on balance rather than a disproof, because PMID:28663585 also reports that p.I123T and p.R186W do impair buffering, and that caveat now carries its own evidence item rather than sitting as unsourced prose - which is the failure mode this whole correction is about.

    Three evidence items added, all from references already cached and cited: PMID:28663585 SUPPORT/DIRECT/MODEL_ORGANISM for the buffering candidate being raised, PMID:26173970 REFUTE/DIRECT/IN_VITRO for the two-allele buffering result, and PMID:28663585 SUPPORT/DIRECT/IN_VITRO for the p.I123T/p.R186W caveat. The last is graded IN_VITRO with the reason stated in its explanation: the sentence restates calcium-imaging results from primary work it cites, not this paper's own mouse experiments.

    This push costs the approval the reviewer gave minutes earlier, and the reviewer had explicitly said the suggestion was not worth a re-review cycle on its own. It is not on its own: the entry itself asserted that GPSM2-GNAI is the candidate this literature raises, which is too narrow, and leaving a known-false characterisation in a merged history record was the worse trade.

    Verification: 47/47 snippets, from 44/44. No new references, no new cache rows. validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading all clean.

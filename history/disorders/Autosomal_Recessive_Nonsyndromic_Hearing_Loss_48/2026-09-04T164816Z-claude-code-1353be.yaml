  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 48 (DFNB48, CIB2)'
  details: |
    De-novo curation of DFNB48 (MONDO:0012273, CIB2). Deep research: openscientist (research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_48-deep-research-openscientist.md), 1102s, 16/16 references resolved with 0 confabulations and 13/16 assessed on topic; term validation flagged needs_review only for benign label abbreviations (HP:0008619 called 'Bilateral SNHL'), none of which affect terms bound in this entry. GeneReviews baseline: no CIB2- or DFNB48-specific chapter exists; the Genetic Hearing Loss Overview (PMID:20301607) is cached and listed in references, but its cached record is book front matter with no quotable Clinical Characteristics, so no evidence item is attached to it. Pathophysiology is built as a causal chain from CIB2 loss of function through disrupted CIB2-TMC1/TMC2 association and abolished cochlear MET to hair-cell death, with a second parallel arm for failure to restrict transducing stereocilia growth. A CIB3 paralogue-redundancy node is included deliberately without a downstream edge: it explains the absence of vestibular involvement rather than causing a phenotype. The CIB2/USH1J reassignment is recorded as a CONTROVERSY discussion carrying both the original dual assignment and the later refutations, since the difference is clinically consequential. Validation: just validate passes (schema, terms, references) with 27/27 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all pass. An initial draft used publication titles as evidence snippets; all seven were replaced with quoted findings from the cached abstracts before commit. A later pass in the same session wired two audiological phenotypes (Profound and Congenital sensorineural hearing impairment) into the pathograph as downstream targets of Hair Cell Dysfunction and Death; a connectivity audit had found them present as phenotypes but with no incoming mechanism edge.

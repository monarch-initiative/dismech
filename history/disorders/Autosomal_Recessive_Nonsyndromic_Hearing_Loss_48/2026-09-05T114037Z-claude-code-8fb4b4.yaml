  details: |
    Takes up both non-blocking items from the approving review.

    The first was a correctness problem, not a cosmetic one. The Failure to Restrict Transducing Stereocilia Growth node closed by naming two open candidates - a whirlin/myosin XVa elongation complex and local calcium buffering at the stereocilia tips - immediately after arguing at length that the function is separable from WHRN. Neither candidate was cited, and neither is what the source raises. PMID:40083274's own speculation is the GPSM2-GNAI stereocilia elongation complex; nothing in the cached full text mentions calcium buffering at the tips. The paragraph is rewritten to name GPSM2-GNAI, quoted with the authors' hedge intact, and to say plainly that this is not a whirlin route reintroduced under another name but is also not a claim that WHRN is uninvolved in elongation, since GPSM2-GNAI itself binds WHRN and is carried to the tips by MYO15A. The open question is which complex CIB2 acts in.

    The same paper also separates the growth arm from the channel arm on the phenotype: rows 2 and 3 elongate in Cib2 mutants, the opposite of the retraction that follows loss of mechanotransduction current. That argument was absent and is the reason this node sits parallel to the transduction node rather than beneath it, so it is now curated with its own evidence item.

    Two evidence items added, both PMID:40083274, MODEL_ORGANISM, DIRECT.

    The second item was the four overlapping audiological phenotypes. They are kept, because HPO has no single term composing onset, laterality and severity, and the three specific terms carry different frequencies from different sources. What changed is that the redundancy is now explained rather than looking accidental: the generic HP:0000407 anchor's preferred_term no longer restates the three axes, its description points at them instead, and a notes block records that the four are one annotation decomposed and that collapsing them would lose the per-axis frequencies.

    Verification: 44/44 snippets (from 42/42). validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading all clean. No cache rows added - both new snippets are from a reference already cached and no new ontology term is bound.

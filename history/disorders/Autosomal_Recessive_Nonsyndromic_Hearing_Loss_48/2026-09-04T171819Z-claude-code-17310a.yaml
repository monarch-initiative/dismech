  summary: 'Review round 1: DFNB48 (PR #10972)'
  details: |
    Addressed all seven IMPORTANT items and most suggestions from the ai4c-reviewer CHANGES_REQUESTED review, in one push. (1) CL:0000202 (auditory hair cell) was bound on the CIB3 vestibular-redundancy node, inverting the cochlea/vestibule contrast the node exists to make; rebound to CL:0000609 vestibular hair cell. (2) The stereocilia node asserted that the structural arm 'is organised through whirlin rather than through TMC1/2'. The reviewer flagged it as uncited; on fetching PMID:40083274 it turned out to be wrong in direction, not merely uncited - CIB2 binds WHRN via EF2-HHD2, but Cib2/Whrn double homozygotes show the Whrn single-mutant bundle phenotype, WHRN overexpression does not rescue Cib2-null stereocilia, and double heterozygotes hear normally. The description was rewritten to state CIB2's staircase function is independent of WHRN, with three new evidence items including a REFUTE on the rescue experiment. (3) PMID:42427029 (an entirely murine AAV study) carried evidence_source HUMAN_CLINICAL on a human phenotype claim; the claim was re-sourced to PMID:29112224's audiometry sentence rather than regraded, so the phenotype now rests on human data. (4) HP:0008527 (congenital) overreached a snippet saying only 'prelingual'; rebound to HP:0000399 Prelingual sensorineural hearing impairment, and the description no longer claims onset at or before birth. (5) Added animal_models for the Cib2 knockout and the Cib2 p.F91S knock-in, with modeled_mechanisms, limitations and readouts. (6) Added a diagnosis section. (7) Added conforms_to sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death on the hair-cell death node, plus the module's apoptotic-process binding. Suggestions taken: HP:0008619 bilaterality phenotype, GO:0050910 preferred_term corrected and modifier changed from LOSS_OF_FUNCTION to DECREASED, auditory-verbal therapy and genetic counseling treatments. Suggestions not taken, for lack of a quotable source: a progression section (no cached abstract states non-progressive) and hearing aids as a treatment. NCIT:C159273 required label 'Speech Language Therapy' rather than 'Speech Therapy'. Validation after the round: just validate and just validate-disorders both pass with 41/41 snippets verified (up from 27/27); check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-title-snippets and check-snippet-length all pass.

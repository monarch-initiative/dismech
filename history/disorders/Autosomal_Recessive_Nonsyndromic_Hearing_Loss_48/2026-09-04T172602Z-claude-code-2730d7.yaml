  summary: 'Review round 2: whirlin mechanism recorded as unsettled (PR #10972)'
  details: |
    The round-2 review ran against commit 25c7cc1 rather than the round-1 fix commit 6d66af5a9, which was pushed while the review job was already running, so it reported all seven IMPORTANT items as outstanding when they were already addressed on the head. No rework was needed. It did however add substantive new analysis on the whirlin question, which is taken here. The reviewer checked what PMID:28663585 actually did with whirlin and found it cuts against the whirlin route rather than merely failing to support it: whirlin, myosin XVa, Eps8 and Eps8L2 all still localise to stereocilia tips in Cib2 mutants, so CIB2 is not required to deliver them, and the whirlin route survives in that paper only as one of two hedged Discussion alternatives alongside local calcium buffering. Added that localisation negative as a second evidence item on the node, and rewrote the description so it no longer implies a positive replacement mechanism: what is established is that the staircase function is separable from WHRN, not what it runs through instead, with the whirlin/myosin XVa complex and local calcium buffering both named as unresolved candidates. Declined the suggestion to collapse the four audiological phenotypes into one with severity and onset qualifiers: multiple HPO terms at different granularities is within sibling convention (ARNSHL_104 carries three), each term is independently verifiable from the same measured audiometry sentence, and the explicit terms are what downstream phenotype matching consumes. Validation: 42/42 snippets verified, up from 41/41.

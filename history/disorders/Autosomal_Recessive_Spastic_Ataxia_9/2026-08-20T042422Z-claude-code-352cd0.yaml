  summary: 'Create: Autosomal Recessive Spastic Ataxia 9 (SPAX9, CHP1)'
  details: |
    De-novo curation of SPAX9 (MONDO:0032753, OMIM:618438, CHP1 at 15q15.1). Deep research provider: falcon (research/Autosomal_Recessive_Spastic_Ataxia_9-deep-research-falcon.md; the report's own reference validation resolved 4/4 citations with 0 unresolved). NEC preflight: 'just preflight-dr <report> MONDO:0032753' returned SKIP because MONDO records no RO:0004003 causal gene for this term, so the manual fallback was run - the MONDO OMIM xref 618438 matches the OMIM/MedGen record whose associated gene is CHP1 (15q15.1), and the report's gene-mention profile is dominated by CHP1 (41 mentions, vs PLS3 14 and SLC9A1 3), confirming the report is about the intended entity. No GeneReviews chapter exists for this disorder (PubMed searches for 'CHP1 GeneReviews' and 'spastic ataxia 9 GeneReviews' returned no hits), so the HPO annotations for OMIM:618438 plus the two primary clinical reports were used as the phenotype baseline instead. Content is built from primary literature: PMID:29379881 (discovery family, CHP1 p.Lys19del, cell and zebrafish work), PMID:32787936 (second family, p.Arg91Cys, autopsy neuropathology), PMID:23904602 (Chp1 vacillator mouse), PMID:34108458 (human NHE1-CHP1 cryo-EM structures 7DSV/7DSW/7DSX), PMID:31607845 (PLS3 modifier mouse). The falcon report missed the 2020 autopsy paper entirely but contributed one important correction, now curated as a REFUTE evidence item: the discovery authors themselves attribute the female proband's ovarian failure to a separate homozygous BNC1 p.G258E variant rather than to CHP1. Two conforms_to edges were added (cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration and peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination). Validation performed: 'just validate' passed (schema, terms, and references); 'just count-verified-snippets' reported 73/73 snippets verified against cached references; 'just check-duplicate-keys' and 'just check-title-snippets' passed; the full targeted pytest selection over tests/test_data.py passed (10917 passed); and 'just validate-disorders' (the batched schema+terms+references sweep CI runs, with --no-full-text) passed with 73/73 snippets verified.

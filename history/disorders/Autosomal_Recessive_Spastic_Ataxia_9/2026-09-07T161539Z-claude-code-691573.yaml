  summary: 'Phenotype review: Autosomal_Recessive_Spastic_Ataxia_9'
  details: |
    Reviewed all 22 phenotypes on three questions: snippet-to-claim consistency in whole-paper context, optimal HPO binding, and whether the pathograph explains the phenotype. Both primary sources (PMID:29379881 discovery family, PMID:32787936 autopsied family) are full text in the reference cache and were read in full; the Falcon report was checked and adds nothing, as it missed the 2020 autopsy paper entirely. Snippet/claim fixes: three phenotype notes (Babinski sign, Dysmetria, Hyperreflexia) claimed the published clinical comparison table does not survive text extraction, which the cache contradicts - Table 1 is present but flattened into run-together cells, so the curation decision to omit evidence stands while the stated reason was corrected. The Impaired vibration evidence explanation still ended in 'hence PARTIAL', a value removed from the supports enum in #7439; replaced with directness: INDIRECT. Dysmetria's description claimed limb dysmetria, which neither source reports; narrowed to ocular. Hearing impairment's description claimed the CHP1-NHE1 axis provides a mechanistic rationale for deafness, whereas the discovery authors predicted the opposite (residual NHE1 protects CHP1 patients from the deafness of Lichtenstein-Knorr); rewritten and recorded as a knowledge gap. Term rebinds: Distal muscle weakness -> Muscle weakness HP:0001324 (no source states a distal distribution); Impaired distal vibration sensation -> Impaired vibratory sensation HP:0002495 (same reason); Frontal cortical atrophy HP:0006913 -> Neuronal loss in the cerebral cortex HP:0007190, because frontal atrophy was never demonstrated (CT showed only cerebellar atrophy) whereas layer II-III neuronal loss with gliosis was, with the regional detail kept in preferred_term. Pathograph: connectivity went 0/22 to 13/22 via 17 downstream edges from four existing tissue-level nodes (cerebellar degeneration, sensory neuronopathy/dorsal column, peripheral nerve axonal degeneration, frontal cortical neuronal loss); two edges carry their own evidence, the authors' attribution of cerebellar ataxia and cognitive decline to cerebellar and frontal neuronal loss respectively. No pathophysiology node was added. Nine phenotypes deliberately left unconnected with three new KNOWLEDGE_GAP discussions: the pyramidal axis (spastic paraparesis, Babinski sign, abnormal pyramidal sign, hyperreflexia) has no demonstrated corticospinal lesion - the autopsied siblings had pyramidal signs but pathology confined to cerebellum and dorsal columns with brainstem and motor cortex explicitly spared; hearing loss contradicts the discovery authors' prediction and is confounded by age at death; and slow saccades, intellectual disability and growth retardation occur only in the never-autopsied childhood family. Premature ovarian insufficiency remains unconnected as already curated, since the discovery authors attribute it to a second homozygous BNC1 variant.

  summary: Post-review triage of PR 7852 reviewer suggestions
  details: |
    Second adversarial-review pass on PR #7852. The reviewer's single IMPORTANT
    finding (no deep-research artifact in research/) is being handled separately
    at batch level and was not addressed here. The three SUGGESTION items were
    triaged individually; two were adopted, one was rejected with evidence.

    ADOPTED - suggestion 1, residual family-count phrasing. The `genetic`
    evidence explanation for c.1196C>T read "Adds a second recurrent allele to
    the series, in independent Turkish families". "Recurrent" and "independent"
    are not established by the quoted snippet ("both patients carried a novel
    missense variant"), and the abstract calls the variant novel. Reworded to
    "Adds a further missense allele to the series, reported in unrelated Turkish
    families", which matches both the `variants:` block for the same allele and
    the abstract's own phrase "three unrelated Turkish families".

    ADOPTED - suggestion 3, animal-model cross-link. The Danio rerio
    `animal_models` description now points explicitly at the
    `sars1-no-disease-model` HUMAN_MODEL_MISMATCH discussion and names the two
    experiments it proposes, so a reader landing on either finds the other.

    REJECTED - suggestion 2, rebinding HP:0002342 (Moderate intellectual
    disability) to the parent HP:0001249 (Intellectual disability). HP:0002342
    is an is_a descendant of HP:0001249 (checked: runoak -i sqlite:obo:hp
    ancestors -p i HP:0002342 returns HP:0001249), so any query over the parent
    already retrieves this entry by subsumption, whereas demoting the binding
    would delete from the machine-readable layer the one grade that sources
    actually state. HPOA for OMIM:617709 annotates HP:0002342 at 4/4 sourced to
    PMID:28236339 (re-verified live against
    https://ontology.jax.org/api/network/annotation/OMIM:617709 on 2026-08-02),
    and PMID:36004946 and PMID:34570399 both state "moderate intellectual
    disability" in their abstracts. The moderate-versus-severe spread stays
    where the schema provides for it: the PARTIAL evidence item quoting "severe
    developmental delay and ID". What WAS fixed is the genuine internal
    contradiction the reviewer's point exposed - the description previously said
    the "moderate" qualifier "should not be applied to the entity as a whole"
    while the entity-level term did exactly that. The description and notes now
    state the binding rationale and record that the parent was considered and
    why it was not used.

    ADDITIONAL FIXES found by re-applying the issue #7791 unchecked-prose audit
    (snippet checkers read only evidence[].snippet, never description: or
    notes:), which turned up two residues of the same countable/unsourced
    phrasing class that commit 6bd9b60e was cleaning up:

    - The disease `description` said the published literature is "a handful of
      families - the Turkish kindreds explicitly consanguineous". Plural
      over-claim: consanguinity is stated only in PMID:34570399 ("a
      consanguineous Turkish family"); PMID:36004946 calls its Turkish families
      unrelated and says nothing about consanguinity. Scoped to the singular
      family, with the negative stated.
    - The `genetic` "not asserted, deliberately" block said "consanguinity is
      stated in the source only for the Turkish kindreds". Rewritten to name
      PMID:34570399 as the only source that states it and to record explicitly
      that PMID:36004946 and PMID:28236339 do not.
    - The `description` asserts that a ClinVar likely-pathogenic in-frame
      insertion (p.Ala497_Arg498insAla) sits inside the C-terminal UNE-S
      appendage. That domain assignment was not traceable from the entry. The
      ClinVar audit note now records that UNE-S is given as residues 470-514 in
      the cached FULL TEXT of PMID:22353712 (content_type: full_text_pdf, so the
      range is quotable from the repo) and that the assignment is arithmetic on
      that range rather than a claim from any SARS1 clinical paper.

    Abstract-only-versus-full-text audit re-run: the entry's own manifest of
    which references are abstract-only (PMID:28236339, 36004946, 34570399,
    35790048, 36041817, 42158840, 38255739) versus full text (PMID:24095058,
    29875423, 22353712, 19423847, 27913726) was checked against the
    content_type: frontmatter of each cached file and is correct. No prose claim
    was found that depends on full text of an abstract-only cache entry.

    Other verification claims spot-checked rather than trusted: the notes assert
    that runoak -i sqlite:obo:hp search "l~central hearing" and "t~auditory
    neuropathy" return no results, justifying the deliberate loss of specificity
    from "central deafness" to HP:0000365. Both searches were re-run and both
    return nothing, so the note is honest. Every HPOA fraction quoted in a
    phenotype note (Microcephaly 4/4, Global developmental delay 4/4, Ataxia
    4/4, Bilateral tonic-clonic seizure 4/4 with Infantile onset, Muscle
    weakness 4/4, Aggressive behavior 4/4, Slender build 2/4, Pes planus 2/4)
    was re-checked against the live HPOA API and all match.

    Validation after the edits: schema "No issues found"; term validation
    passed; reference validation "Snippets checked: 103/103 verified against
    cached references"; check_snippets_verbatim 103 verified / 0 failed;
    check_folded_hyphens clean; check_snippet_length --against-ref origin/main
    reports no new snippets under 5 words; pytest tests/test_data.py 16891

  summary: 'Create: SARS1-Related Neurodevelopmental Disorder'
  details: |
    Deep curation of NEDMAS from primary literature. NEC preflight run with OAK before writing: gene HGNC:10537 SARS1 and xref OMIM:617709 confirmed on MONDO:0060577. Every contrast entity verified with OAK before being named - SARS2/HUPRA (hgnc:17697, MONDO:0013458, OMIM:613845), WARS1 (hgnc:12729, MONDO:0957218, OMIM:620317), WARS2 (hgnc:12730, MONDO:0060578, OMIM:617710) and AIMP1 (hgnc:10648, MONDO:0009843). Mechanism modelled as loss of serine charging capacity - catalytic-core alleles, reduced protein stability and reduced serylation - feeding the ARS-family demand-versus-capacity model. The SerRS UNE-S/VEGFA and telomere moonlighting arm is modelled as an explicitly HYPOTHETICAL node plus a knowledge-gap discussion rather than asserted as mechanism. The whole SARS1 germline spectrum is curated under the single MONDO term, including the deafness/cardiomyopathy/febrile-decompensation presentation and the de novo dominant-negative spastic-paraplegia case. Validation: 102 snippets verified by both just validate-references and scripts/check_snippets_verbatim.py; just validate, just validate-terms, scripts/check_folded_hyphens.py --check and pytest tests/test_data.py all pass.

  summary: 'Adversarial-review fixes: remove unsourced consanguinity, family-count
    and antioxidant claims; qualify catalytic-core convergence against ClinVar UNE-S
    allele; source carrier claim to ARS review'
  details: |
    Applied triage of independent verifier findings.

    Fixed:
    - description / causal chain / moonlighting notes: the 'every disease-associated SARS1 allele sits in the catalytic core' claim is now scoped to alleles with a published structural position in the clinical literature, and the counterexample the entry itself records (ClinVar VCV004529504 c.1483GCA[4] p.Ala497_Arg498insAla, Likely pathogenic, residues inside UNE-S F470-A514 per PMID:22353712) is named explicitly in the causal-chain notes and in the HYPOTHETICAL moonlighting node.
    - genetic notes / diagnosis: c.1196C>T (p.Thr399Met) is no longer attributed to 'three unrelated Turkish families'. PMID:36004946's abstract says three families with four patients but 'both patients carried' the variant; the entry's own CURATION_TODO declines to assert a count, so the prose now matches that policy.
    - consanguinity of the Iranian kindred (PMID:28236339) removed from description, inheritance, prevalence, variants[0] and genetic notes. The abstract says only 'two unrelated Iranian families'; grep for 'consangui' hits only PMID_34570399 (the Turkish family), where the claim is kept and snippet-backed.
    - inheritance: 'Heterozygous parents are unaffected' is now attributed to the ARS deficiency class and backed by a new verbatim snippet from PMID:29875423, with an explicit statement that no cached SARS1 paper reports carrier-parent phenotype.
    - description: 'congenital and postnatal microcephaly' reduced to 'microcephaly'; the temporal qualifiers appear in no cached SARS1 reference and the HPOA records only HP:0000252.
    - pathophysiology (Impaired Selenocysteine Incorporation, HYPOTHETICAL): named glutathione peroxidases and thioredoxin reductases deleted; neither family appears in any cached reference for this entry.
    - differential_diagnoses: 'central nervous system involvement in every one of them' corrected to 'central nervous system and/or the senses in all thirteen', matching PMID:29875423's compound denominator (13/13).
    - differential_diagnoses: unsourced 'survival into adolescence and adulthood' for SARS1 and unsourced HLD3 severity/onset comparison replaced with an explicit statement that no cached source gives age, onset or survival for either.
    - diagnosis: unsourced claim that the serylation assay is 'available in a small number of specialist metabolic laboratories' removed.
    - notes: GeneReviews negative rephrased as a search performed on 2026-08-01 rather than a fact about the world; the animal-model negative likewise scoped to sources consulted.

    Rejected:
    - Verifier claim that 'Pulmonary alveolar proteinosis points towards MARS1, IARS1 or LARS1' is unsupported. PMID_29875423.md line 1247 states 'PAP was previously thought to be a specific feature of MARS deficiency. We show that other recessive ARS deficiencies (IARS and LARS) can also cause PAP.' All three attributions are directly in the cached full text; the verifier read only the figure legend at line 634.
    - Verifier claim that 'heterozygous parents are unaffected' has no cached source. PMID_29875423.md line 1218 states it verbatim; the defect was attribution, not sourcing, and has been fixed by adding the snippet.

    Validation: schema, terms, references, check_snippets_verbatim (103/103), check_folded_hyphens, check_snippet_length --against-ref origin/main, and tests/test_data.py all pass; references_cache churn from #7507 reverted.

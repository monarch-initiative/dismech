events:
- type: EDIT
  outcome: changed
  sections:
  - datasets
  summary: Add dataset records routed via OmicsDI
  details: |
    Added 3 record(s) located through OmicsDI via scripts/discover_omicsdi.py. OmicsDI is used only as a router to repositories with no other discovery route in this project and a working accession resolver: Metabolomics Workbench, MassIVE and dbGaP. 89 percent of OmicsDI results duplicate GEO, ArrayExpress, PRIDE, MetaboLights or EGA, which have dedicated passes, and biostudies-literature records are supplementary paper files rather than deposited datasets; both classes are excluded by design. Matching required the disease to be named in the dataset's own title, genes were never searched, and sibling-disease qualifier conflicts were vetoed. Every accession was resolved against its repository API before commit. No evidence blocks generated, since an evidence item requires an exact abstract quote.

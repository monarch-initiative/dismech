  summary: Add Xmrk-activated melanocyte dermal-collagen experimental model (osteopontin)
  details: |
    Added an experimental_models entry for melanocytes carrying the Xiphophorus Xmrk receptor tyrosine kinase in three-dimensional type I collagen, linked via modeled_mechanisms to 'Invasive Plasticity and Migration' as PARTIALLY_RECAPITULATES (fidelity MODERATE). This is deliberately curated as an experimental model rather than an animal model: the osteopontin work (PMID:12183442) was done in cultured melanocytes, not in fish, so evidence_source is IN_VITRO. The Xiphophorus connection is the driving oncogene. Substance: osteopontin secreted downstream of Xmrk acts through integrin alpha-v beta-3 to rescue melanocytes from matrix-induced apoptosis, and Schartl & Lu (PMID:38299666) record that osteopontin was first identified in Xiphophorus melanoma as the factor for the radial-to-vertical growth transition and is now a clinical prognostic marker. Limitations recorded: a collagen gel is not a vascularized dermis and reports survival and spreading rather than invasion, vascular entry or distant colonization, and the assay has no immune or stromal compartment, so it covers only the first step of the node. One readout (melanocyte survival and spreading with and without osteopontin, direction RESTORED). All snippets verified as exact substrings of the local reference cache. Validation: linkml-validate clean, term validation passed, duplicate-key and entity-ref checks clean, snippet audit reported no failures, baseline gates reported no new defects.

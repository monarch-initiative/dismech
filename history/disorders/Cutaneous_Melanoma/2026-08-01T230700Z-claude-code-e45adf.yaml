events:
- type: EDIT
  outcome: changed
  sections:
  - datasets
  summary: Add EGA study dataset records
  details: |
    Added 3 European Genome-phenome Archive study record(s), discovered by scripts/discover_ega.py. EGA holds the controlled-access human cohorts that GEO cannot index. Matching was deliberately narrow: the disease had to be named in the study's own TITLE, description-level mentions were not accepted, causal genes were never searched, and titles applying a competing qualifier to the disease core term were vetoed as sibling diseases. Title, description, study type and linked PMID are EGA's own metadata. Every accession was resolved against the EGA metadata API before commit. Note these datasets are controlled access and require a Data Access Agreement. No evidence blocks generated, since an evidence item requires an exact abstract quote.

  summary: 'Gene-family review: ALDH18A1 record typed'
  details: |
    ALDH18A1 modelling re-reviewed and found correct: the node binds delta1-pyrroline-5-carboxylate synthetase (NADP+) activity (GO:0017084) as decreased through a dominant-negative effect of the stable p.Arg138Trp protein on the wild-type complex. The genetic record was untyped with no variant origin and an unbound inheritance block; it is now typed CAUSATIVE (recurrent de novo Arg138 substitutions in several unrelated individuals, PMID:26320891, plus Arg126 and Ser134 cases, PMID:28228640, PMID:40164711), with germline origin and the inheritance bound to autosomal dominant (HP:0000006). ClinGen's Definitive (semidominant) ALDH18A1 assertion is for the lumped MONDO:0100126 P5CS deficiency, not this entry's MONDO:0014706, so it is noted and not copied.

  summary: Link skin dysbiosis into the AD pathograph and record its causal-ordering
    gap
  details: |
    The environmental entry "Microbial Dysbiosis" carried well-sourced S. aureus
    colonization data but no `influences_mechanisms`, so it was not in the
    pathograph and no discussion could attach to it.

    Added two `influences_mechanisms` edges from that entry, to "Type 2 Immune
    Response" and to "Secondary Inflammatory Amplification", both
    `environmental_effect: EXACERBATES` and
    `causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES`, each carrying its own
    evidence. EXACERBATES rather than TRIGGERS is deliberate: birth-cohort
    evidence argues against S. aureus overgrowth initiating infantile disease.

    Added KNOWLEDGE_GAP discussion `gap_ad_dysbiosis_causal_ordering`, modelled
    on the HS gap `gap_hs_follicular_immune_microbiome_ordering`, carrying both
    arms. Driver arm: PMID:25902485, species-specific antibiotics reversing
    dysbiosis and eliminating inflammation in Adam17-deficient mice, and
    PMID:28228596, depletion of antimicrobial-peptide-producing commensal CoNS on
    AD skin with reintroduction lowering S. aureus. Consequence arm:
    PMID:31252032, a placebo-controlled dupilumab trial in which IL-4Ralpha
    blockade alone raised microbial diversity and lowered S. aureus, and
    PMID:27609659, a birth cohort in which infants developing AD were not
    colonized by S. aureus beforehand. Included proposed experiment
    `exp_ad_dysbiosis_temporal_ordering` with a decision criterion separating
    driver, consequence, and staged models.

    Four new references fetched with `just fetch-reference`. Two PMIDs recalled
    from memory for these papers resolved to unrelated publications and were
    discarded rather than cited; the correct identifiers were found via PubMed
    esearch and the abstracts read before quoting.

    Validation: `just validate` (69/69 snippets verified), `just
    count-verified-snippets` (69/69), `just validate-terms` (passed), and all
    five ungated CI gates (`check-folded-hyphens`, `check-snippet-length`,
    `check-title-snippets`, `check-environmental-evidence`,
    `check-duplicate-keys`) passed. Pytest subset matching
    environmental/discussion/duplicate: 2182 passed. Final pre-PR sweep with
    `just validate-disorders` run before commit.

  summary: Merge duplicated classifications blocks (#8623)
  details: |
    PRs #8592 and #8580 each added a top-level `classifications:` block to this
    entry at a different point in the file. Git merged both without a conflict,
    producing two `classifications:` keys in one mapping. PyYAML keeps the last
    value silently, so the entry looked fine to the renderer and tests, but the
    ruamel-backed linkml-reference-validator raised DuplicateKeyError and turned
    main red on the post-merge push build.

    Merged the two into the single block at the canonical position after
    `parents:`. Both harrisons_chapter values are retained: DERMATOLOGY (which now
    also carries the PMID:32738956 Lancet-seminar evidence from the later block)
    and IMMUNE_RHEUMATOLOGIC. Keeping both matches the sibling Psoriasis entry, a
    chronic immune-mediated inflammatory skin disease carrying the same pair.

    The DERMATOLOGY explanation was trimmed of its closing argument that no immune
    Part should be assigned, since that sentence contradicted the immune Part in
    the same block. No evidence item, snippet, or reference was added or changed.

    Validated with `just validate-disorders` over this file and
    Ulcerative_Colitis.yaml: schema, terms, and references all pass, 133/133
    snippets verified against cached references.

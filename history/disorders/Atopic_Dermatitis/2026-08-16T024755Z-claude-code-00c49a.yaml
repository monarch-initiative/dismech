  summary: 'Weekly compliance: classification + subtype and GWAS gene evidence'
  details: |
    Weekly compliance pass focused on disease classification for immune-mediated disorders. Added a classifications block assigning Harrison's Part DERMATOLOGY only, cited to PMID:32738956. Deliberately did not add IMMUNE_RHEUMATOLOGIC: the classification guidance uses asthma, which goes to RESPIRATORY rather than the immune Part despite being type-2 immune-mediated, as its worked example, and atopic dermatitis is the cutaneous member of the same atopic family. The reasoning is recorded in the assignment explanation. Added evidence to the Extrinsic and Intrinsic Atopic Dermatitis subtypes from PMID:36983191, newly fetched. Added evidence to the ETS1 genetic entry from the EAGLE multi-ancestry GWAS PMID:26482879, also newly fetched, which names ETS1 as the most plausible candidate gene at the 11q24.3 locus. Left the other seven GWAS-tagged genes unevidenced after checking that this GWAS full text does not name them, rather than attaching a citation that does not support the claim. Validated with just validate, just validate-terms, and just count-verified-snippets with 55/55 snippets verified. Weighted compliance rose from 75.0 percent to 77.2 percent.

  summary: Cite 3 evidence-free environmental exposures and correct a prevalence figure,
    issue 8296 tranche 4
  details: |
    Attached verified evidence to the three previously uncited environmental exposures, and
    corrected one curated claim that the evidence contradicted.

    Microbial Dysbiosis: the description previously asserted S. aureus colonization in over 90
    percent of lesional skin. The pooled estimate from a 95-study systematic review and
    meta-analysis, PMID:26994362, is 70 percent for lesional skin, so the figure was corrected
    downward rather than cited as written. PMID:22310478 was added for the flare dynamics --
    longitudinal metagenomic sequencing showing S. aureus abundance rises during flares and
    correlates with severity. The description's further claims of superantigen- and
    biofilm-mediated amplification were removed rather than cited: no source was found whose
    abstract states them, and per the evidence SOP an unsupportable claim is dropped rather
    than attached to an approximately-relevant citation. A review_notes breadcrumb records
    both decisions.

    Allergen Exposure: PMID:14609097, atopy patch testing in 30 sensitized patients, covers all
    three allergen classes the description names -- house dust mite, cat dander, grass pollen.
    PMID:25598014, the Cochrane review, is added as PARTIAL: it evidences that about a third of
    house-dust-mite-sensitized patients report worsening on exposure, which narrows the claim to
    a sensitized subset, and its very-low-quality verdict on avoidance measures is now recorded
    in the description so the therapeutic corollary is not read into the trigger.

    Skin Irritants: PMID:26426984, a controlled tandem repeated irritation test using sodium
    lauryl sulfate in atopic versus healthy volunteers.

    Two explanations state figures that are given in brackets in their source abstracts and so
    could not be quoted: the reference snippet validator strips bracketed spans as editorial
    insertions, so quoting across one can never verify. The explanations say where those
    figures come from.

    Validation: just validate, just count-verified-snippets with every new snippet verified
    against its cached abstract, the batched just validate-disorders sweep, and
    just check-title-snippets.

  summary: 'Review response: correct the assay named in a PMID:22310478 explanation,
    issue 8296 tranche 4'
  details: |
    Review on PR 8558 caught a factual error in an explanation I wrote. The
    PMID:22310478 explanation described the study as shotgun metagenomic sequencing.
    It is 16S rRNA gene sequencing. Verified against the cached record: the abstract
    states 16S ribosomal RNA bacterial gene sequencing was performed, and the
    discussion names whole-genome shotgun sequencing as a future advance rather than
    the method used.

    Corrected, and the explanation now also records why the distinction matters here:
    the quoted snippet attributes the flare-associated increase specifically to
    S. aureus, and species-level attribution is the weakest point of 16S amplicon
    data. Naming the assay as shotgun implied a confidence the measurement does not
    carry.

    Only the explanation changed. Snippet, reference, supports and evidence_source
    are untouched.

    Revalidated: just validate, just count-verified-snippets.

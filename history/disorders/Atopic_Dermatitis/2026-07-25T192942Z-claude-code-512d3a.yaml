  summary: 'Review: Atopic dermatitis - unsupported IL-31 and Dennie-Morgan claims
    flagged'
  details: |
    The Pruritogen-Induced Neuronal Activation node asserts that IL-31 activates cutaneous sensory neurons and carries an IL31 gene annotation, but its only citation states merely that recent work has focused on neuroimmune interactions, and the cited review contains no IL-31 text. Added an explicit evidence caveat to the node description rather than leaving the IL-31 attribution reading as sourced. Corrected the Dennie-Morgan folds note and explanation: the cited sentence lists the folds among features of intrinsic AD and does not establish presence in extrinsic AD, so the both-subtypes claim was withdrawn. Validated: schema, terms, references all pass.

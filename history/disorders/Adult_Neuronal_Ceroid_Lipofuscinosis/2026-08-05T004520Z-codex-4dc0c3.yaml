  summary: 'Publication review: Adult Neuronal Ceroid Lipofuscinosis'
  details: |
    Completed a claim-by-claim publication readiness review and a current
    literature search. Corrected the CTSF branch from a Type B-only model to
    the broader CLN13 spectrum, added 2025 systematic-review evidence, and
    added subtype-bounded cerebral and cerebellar imaging findings.

    Expanded DNAJC5 variant and diagnostic coverage with the 30-bp duplication
    missed by Sanger sequencing and WES. Replaced a bundled speculative CSPalpha
    node with atomic sorting and microautophagy/MAPS nodes, split mixed in-vitro
    and model-organism evidence, and added biological scales.

    Removed visual loss as a positive CLN4 phenotype because the isolated table
    phrase conflicts with the disease literature. Recast EEG photosensitivity
    as an observational phenotype readout rather than a causal consequence.
    Added and tagged the current GeneReviews overview. Rarer adult presentations
    of other NCL genes remain explicitly in scope but are not deeply expanded in
    this entry; no adult-specific disease-modifying intervention evidence was
    identified.

    In response to automated publication review, restored the atomic emerging
    CSPalpha presynaptic-dysfunction mechanism, refined EEG photosensitivity to
    the exact photoparoxysmal-response HPO term, preserved the CLN4 visual-loss
    source conflict in a resolved discussion, and added a current diagnostic
    odyssey case to the differential-diagnosis section.

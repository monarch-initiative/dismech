  summary: 'Focused evidence review: adult neuronal ceroid lipofuscinosis'
  details: |
    Reframed the broad MONDO adult-NCL entry around three source-backed classic gene-first branches (CLN6 Kufs A, CTSF Kufs B/CLN13, and DNAJC5 CLN4/Parry), while explicitly limiting CTSF to a minority of legacy Type B cases and not expanding rarer adult-onset NCL genes. Added subtype-specific onset and phenotype evidence, two structured CLN6 MRI findings, and complete graph wiring for 12 phenotypes and 3 causal genes. Represented conflicting DNAJC5/CLN4 visual-loss reports explicitly with supporting and refuting evidence. Tightened proposed CLN6, DNAJC5, and CTSF mechanisms to PARTIAL/OTHER where causal testing is absent, changed direct clinical causal edges to unknown-intermediate edges, and corrected inferred biochemical readouts so they are not represented as validated diagnostic assays. Replaced weak treatment inference with review-supported palliative/symptomatic and seizure-burden evidence. Reconciled the bibliography to seven cited references. Validation: schema and ontology terms pass; all 89 whitespace-normalized evidence snippets and all seven titles exactly match existing reference caches; causal graph has 26 nodes and 26 edges with no integrity issues; 12/12 phenotypes and 3/3 genes are wired; compliance is 99.5% global and 100% weighted; folded-hyphen check passes. No references_cache files changed.

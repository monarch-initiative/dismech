  details: |
    Created a Weil's disease leaf under Leptospirosis from the OpenScientist fallback report, binding MONDO:0043004, pathogenic Leptospira and L. interrogans serogroup Icterohaemorrhagiae context, rodent and dog reservoir sources, urine-contaminated environmental acquisition, hematogenous dissemination, hepatocyte junction disruption, endothelial immune vascular leak, proximal-tubule transporter loss, icteric hepatorenal-pulmonary injury, high fever, jaundice, acute kidney injury, pulmonary hemorrhage, myocarditis, leptospirosis culture/PCR/serologic testing, and severity-stratified antibacterial therapy. Avoided PMID:42801462 because the report marked it off-topic for human Weil's disease, avoided the report's stale PMID:42169153 full-text cache, and treated the generated HPO table as term leads because severity/timing text was misreported as HPO labels.

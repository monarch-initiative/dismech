  details: |
    Addressed the ai4c-reviewer changes-requested review on PR #11891 in one push. Added a four-entry diagnosis section - audiologic evaluation with speech recognition testing, post-contrast MRI-FLAIR of the cochlea, NLRP3 sequencing, and a monocyte IL-1 beta secretion assay - reusing snippets already verified in this entry plus one new quote from the PMID:35572943 full-text cache. Cited the previously uncited human gain-of-function claim in the Local Cochlear IL-1 beta Secretion node: patient monocytes secrete IL-1 beta after priming alone where controls secrete none, and the node description now states explicitly that the human measurement is peripheral while the cochlear compartment is shown only in mouse, which is the inference the node makes. Regraded five evidence_source OTHER items on the PMID:35572943 review to HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, and added the same quote_role to the PMID:32194497 mouse sentence, which keeps MODEL_ORGANISM. Added quote_role BACKGROUND to the PMID:28847925 abstract framing sentence. Added the missing downstream edge to Bilateral Symmetric Hearing Loss, completing the auditory branch. Changed anakinra's therapeutic_modality from PROTEIN_REPLACEMENT to OTHER to match the three sibling NLRP3 entries, and recorded in review_notes that the KB is split on this drug. Left the blood-labyrinth-barrier node unsplit, with the reason recorded: the cited mouse work reports barrier breakdown and macrophage infiltration as one observation in one experiment. Snippets 33/33 to 39/39; all structural gates clean.

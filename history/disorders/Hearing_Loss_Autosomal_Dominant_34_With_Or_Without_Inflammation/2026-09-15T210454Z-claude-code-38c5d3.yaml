  summary: 'Create: DFNA34 (NLRP3 cochlear autoinflammation)'
  details: |
    De novo curation of MONDO:0033261 (DFNA34) from a Perplexity sonar-deep-research report (research/Hearing_Loss_Autosomal_Dominant_34_With_Or_Without_Inflammation-deep-research-perplexity.md). Report preflight (just preflight-dr) returned WARN: NLRP3 mentioned 180 times against a rival 'CAPS' token counted 49 times, which is the CAPS acronym rather than the CAPS gene, and an OMIM mismatch that is the NLRP3 gene MIM 606416 against the disease MIM 617772 - both reviewed and judged benign. The report supplied only 7 resolvable reference identifiers for a 114 KB document, so the reference set was rebuilt from PubMed: PMIDs 28847925, 29342053, 32194497, 33020839, 33156237, 35572943, 35812087, 35870427, with three PMC identifiers from the report's citation sidecar resolved to PMIDs through the NCBI ID converter. Pathophysiology is curated as a six-node causal chain from the NLRP3 gain-of-function variant through cochlear macrophage inflammasome assembly, local IL-1 beta secretion, blood-labyrinth barrier disruption and cochlear sensory injury, with a separate branch for the systemic autoinflammatory phenotype that is present in one index family and absent in the other. Two mouse models are linked through modeled_mechanisms with model_scale and typed divergences. Validated: just validate (passed), 33/33 snippets verified against cached references, just validate-terms (passed), check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all OK, and check-qualifier-terms-online confirmed the two NCIT device qualifier labels against OAK.

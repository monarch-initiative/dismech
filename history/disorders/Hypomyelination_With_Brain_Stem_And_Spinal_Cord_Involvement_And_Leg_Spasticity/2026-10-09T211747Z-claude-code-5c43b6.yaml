  summary: 'Create: Hypomyelination_With_Brain_Stem_And_Spinal_Cord_Involvement_And_Leg_Spasticity'
  details: |
    New entry for HBSL (MONDO:0014115, DARS1, OMIM:615281). Deep-research source:
    research/Hypomyelination_With_Brain_Stem_And_Spinal_Cord_Involvement_And_Leg_Spasticity-deep-research-perplexity.md (Perplexity sonar-deep-research). Its
    reference validation resolved 15/15 references with 0 off topic; its only term
    flag was MONDO:0014115 being labelled "MONDO", so the canonical MONDO label was
    used. just preflight-dr exited 2 (no local mondo.db) and was not run; disease
    identity was checked by hand instead: the report and every cited paper concern
    DARS1/HBSL, with DARS2/LBSL appearing only as the differential.

    Content: a causal chain from biallelic DARS1 variants through reduced cytosolic
    tRNA(Asp) charging and a hypothesised translation defect in neurons and glia to
    tract-selective CNS hypomyelination (conforming at the myelin-sheath node of
    cns_myelin_failure only), then corticospinal tract dysfunction and the motor
    phenotypes; 15 phenotypes (11 causally connected; seizures, ataxia, nystagmus
    and cognitive impairment are left unconnected because no source localises
    their mechanism, and edges written from clinical reasoning alone were
    removed in self-review before the PR), two progression phases, DARS1 genetics with four variant records,
    LBSL and multiple sclerosis differentials, three treatments, three mouse models
    with modeled_mechanisms, and four discussions including a HUMAN_MODEL_MISMATCH
    for the mild homozygous knock-in mice.

    References: PMIDs 23643384, 25527264, 27816769, 29518832, 29615866, 33551752,
    33574740, 35357600, 35571067, 36712860. Two (29518832, 33574740) were found by a
    PubMed search beyond the report. Snippets are taken from abstracts only.

    Report content not used: the 2023 review's per-feature counts (16/19 motor
    retardation, 18/19 hyperreflexia, myopia, dysarthria, retinal findings), the
    thiamine/methylcobalamin/citicoline case and the hydrocephalus shunt case,
    because these are only in full texts and not quotable from abstracts; the
    late-adult-onset case (DOI:10.54029/2023vkd, Neurology Asia), which is not in
    PubMed and was not fetched; ClinVar and Orphanet figures, which are not cached.
    No ClinGen DARS1 record is cached, so no gene_disease_validity was recorded.

    Validation: just validate passed; just validate-terms passed; just
    count-verified-snippets 68/68; just validate-disorders passed (68 snippets,
    68 titles, 0 issues); check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-qualifier-terms OK; check-genereviews NO_CHAPTER (PubMed genereviews[book]
    searches also returned zero).

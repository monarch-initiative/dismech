  summary: 'Review round 1: HBSL frequencies and phenotypes'
  details: |
    Review round 1 on PR 13812. The Zhu 2023 review (PMID:36712860) and the discovery paper (PMID:23643384) are cached as PMC full text, so per-feature counts from the 19 published cases are now quoted directly. Frequencies set: motor delay 16/19 VERY_FREQUENT; lower limb hyperreflexia 18/19 VERY_FREQUENT (rebound from HP:0001347 Hyperreflexia to HP:0002395 Lower limb hyperreflexia, the review's own wording); Babinski sign 13/19 FREQUENT; cognitive impairment 6/19 FREQUENT; myopia 6/19 FREQUENT; ataxia 5/19 OCCASIONAL; dysarthria 3/19 OCCASIONAL; seizure 2/19 OCCASIONAL. Added Myopia (HP:0000545) and Dysarthria (HP:0001260) phenotypes, unconnected because no source gives a mechanism. Nystagmus gained the discovery-cohort primary result (all ten subjects, onset in the first year) and onset INFANTILE; no frequency is set because the review's 7/19 counts only nystagmus with dyskinesia. Added an infection-associated deterioration progression phase (5/19). Corticosteroid treatment and the steroid-response discussion now cite the review's 4/5 improved, short-lived in one. Added A274V and L426S variant records, and in vitro evidence on the DARS1-to-charging edge: SUPPORT for A274V (activity abolished) and REFUTE for D367Y (activity slightly increased), both from HEK293 overexpression. Removed the two REFUTE items grading individual patients with normal spinal MRI or normal cognition, which wrongly refuted phenotypes never claimed as obligate; variability stays in the descriptions. Notes now record the uncurated Neurology Asia late-onset case and the deliberately omitted single-case treatments. Validation: just validate passed, validate-terms passed, count-verified-snippets 84/84, check-entity-refs, check-causal-targets, check-duplicate-keys and check-snippet-length OK; list-disconnected-phenotypes 11/17 connected; just validate-disorders passed (84 snippets, 0 issues).

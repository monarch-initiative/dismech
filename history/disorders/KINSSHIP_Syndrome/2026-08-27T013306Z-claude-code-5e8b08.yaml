  summary: 'Create: KINSSHIP Syndrome'
  details: |
    De-novo curation of KINSSHIP syndrome, row NOS 15-0160 of ISDS Nosology 2023 group 15 and new in that revision. Pathograph is three nodes: degron disruption preventing ubiquitin-ligase hand-off and so stabilising AFF3, dysregulated super-elongation-complex activity, and multisystem developmental patterning failure. The dosage direction is stated as an inference from the degron mechanism plus zebrafish overexpression rather than as settled, and an aff3_dosage_direction discussion records what would resolve it. Two animal models curated with explicit limitations, including a HUMAN_MODEL_MISMATCH discussion on the missense knockin being lethal in mouse while the same substitution is survivable in humans. The classification note carries the nosology table's own warning that the Nievergelt and Savarirayan names in the acronym record a radiographic resemblance rather than a nosologic relationship. All 19 evidence snippets verified against the reference cache; schema, term, reference, entity-ref, duplicate-key, snippet-length and title-snippet checks pass.

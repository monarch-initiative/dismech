  summary: 'Create: SLC35A1-Congenital Disorder of Glycosylation'
  details: |
    Created SLC35A1-CDG (CDG-IIf) from the primary literature plus an OpenScientist deep-research report (13/13 references verified). Eight-node pathograph branching at the global-hyposialylation node into a hematologic arm (platelet desialylation and hepatic clearance, impaired megakaryocytopoiesis, loss of leukocyte sialyl-Lewis-x) and a neurological arm (deficient brain sialoglycan synthesis, impaired neuronal connectivity). The branch structure follows the clinical record: the index patient had the hematologic picture with no encephalopathy, the third reported patient had encephalopathy with explicitly no hematological abnormality. The neurological arm's evidence is entirely INDIRECT and REVIEW_SYNTHESIS, and a HUMAN_MODEL_MISMATCH discussion records that the only animal model deletes Slc35a1 in megakaryocytes and platelets only and so cannot address that arm; the model link to the brain node is curated FAILS_TO_RECAPITULATE. Three evidence items use quote_role BACKGROUND, quoting a 2016 splice-variant paper's introduction where it restates the authors' own 2005 clinical description. Two report-supplied CURIEs were rejected after lookup: HGNC:10940, which the report labelled SLC35A1 but which is SLC1A2, and HP:0040326, labelled 'giant platelets' but actually Hypoplasia of the olfactory bulb; the report's own term-validation section flagged neither. Validated with just validate-disorders (30/30 snippets), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, and just preflight-dr (PASS).

  details: |
    Answering the ai4c-reviewer changes-requested review on #11934.

    BLOCKING FINDING, accepted. The PMID:32303557 evidence item on the Golgi CMP-sialic acid depletion node was graded evidence_source: MODEL_ORGANISM with quote_role: BACKGROUND, and the notes paragraph this PR added asserted that grading was correct. The quoted sentence opens that paper's abstract stating what the gene encodes and what the transporter carries. It describes no animal experiment, so MODEL_ORGANISM asserts the mouse study measured the transporter's substrate. Regraded, and the notes sentence rewritten to match.

    Regraded to OTHER, not to the IN_VITRO the reviewer proposed first. The reviewer's argument for IN_VITRO was that the fact was established in CHO mutant cell lines and that the same paper's discussion cites Eckhardt et al. for it. Checked against references_cache/PMID_32303557.md, which is full_text_xml: it contains no mention of Eckhardt, CHO cells or Lec2, and the quoted sentence carries no citation marker. Grading IN_VITRO would therefore rest on provenance the cited paper does not state, which is the failure mode this repository's every-CURIE-read-from-a-source rule exists to prevent. OTHER was the reviewer's other accepted value and is what the corpus uses for a route or gene-function statement with no named experimental system (Ciguatera_Fish_Poisoning line 222 is the pattern; its IN_VITRO siblings all describe a named cell-level measurement). The explanation now records both the positive reason for OTHER and the reason IN_VITRO was declined.

    SUGGESTION, taken. The assessed-absence argument behind this PR's Recurrent infections item covers three Table I rows of the same shape, and only one had been structured. Added a REFUTE item to Abnormal bleeding quoting the same patient-3 sentence, INDIRECT because it denies the coagulopathy the phenotype bundles rather than bleeding events, and a REFUTE item to Macrothrombocytopenia quoting that phenotype's own Table I row, DIRECT because the row names it. The Abnormal bleeding description now records the absence, matching Macrothrombocytopenia, which already did.

    SUGGESTION, out of scope and filed separately. No downstream edge in this entry lands on a phenotype: 7 edges, 8 pathophysiology nodes, 13 phenotypes, 0 incoming. Verified independently rather than taken on the reviewer's word. Not a defect this PR introduced and not what #11854 asked for, so it is recorded as its own issue.

    Validation: just validate 43/43 snippets (41/41 at round 1, 39/39 before the PR), just validate-terms passed, and the offline gates re-run whole-KB against the origin/main baselines.

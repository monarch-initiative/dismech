  summary: 'Review rounds 2-3: correct a false central premise, fix snippet grading,
    retire stale form wording'
  details: |
    Round 2 corrected this entry's organizing premise. The first version claimed the hematologic and neurological presentations are mutually exclusive; Table I of PMID:28856833, a full text this PR itself cached, refutes it - Patient 2 has both arms, on the mildest genotype (p.Gln101His, 50% residual transport). Patient 1's neurological features are tabulated NR, not reported, rather than absent, so one of the three data points was an ascertainment gap read as a negative finding. Six phenotypes added (seizure, ataxia, intellectual disability, hypotonia, microcephaly, abnormal bleeding), PMID:23873973 added as the source for Patient 2, and the index patient's allele-validity dispute recorded as a REFUTE item rather than smoothed into prose.

    Round 3 fixed a CI failure that had been present since the first commit and was missed by both review rounds. test_no_new_snippet_grading_divergences failed because the sialyl-Lewis-x biochemical readout quoted a fragment of PMID:15576474 graded HUMAN_CLINICAL while the diagnosis entry quoted the whole sentence that fragment came from, graded IN_VITRO. Both gradings are right for what they quote; the defect was lifting a clause out of a methods sentence and presenting it as a clinical measurement. The 2005 abstract names the patient's sialyl-Lewis-x deficiency only inside that complementation-methods sentence, so the readout now cites PMID:27387429, whose introduction restates the same authors' 2005 finding as a clinical observation, at HUMAN_CLINICAL + quote_role BACKGROUND. That failure also failed the merge-group builds of three sibling PRs stacked above this one.

    Round 3 also retired three lines that still described features as belonging to 'the hematologic form' - the exact patient-sorting premise the rest of the entry now disclaims. Two were flagged by the round-2 review; the third, in the sialyl-Lewis-x biochemical notes, was not. All three now describe what was reported in the index patient, and the sialyl-Lewis-x note records that the three-patient comparison table carries no row for that antigen, so its distribution across the later patients is unknown.

    Validated: just validate (schema, terms, references), check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-reference-titles.

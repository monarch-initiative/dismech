  summary: 'Gene-family review: SLC35A1; relationship typed UNKNOWN (ClinGen Moderate)'
  details: |
    The SLC35A1 record was CAUSATIVE while the ClinGen tier it already recorded for this disease (MONDO:0011342) is Moderate (2025-11-17). CAUSATIVE is reserved for Definitive or Strong validity, so the record is now UNKNOWN with a note, matching the KB convention for ClinGen Moderate pairs; the entry already records that one of the two index-patient variants is likely benign. The transporter node (CMP-N-acetylneuraminate transmembrane transporter activity, GO:0005456, decreased, at the Golgi membrane) matches SLC35A1's role as the Golgi CMP-sialic acid/CMP antiporter and was left unchanged.

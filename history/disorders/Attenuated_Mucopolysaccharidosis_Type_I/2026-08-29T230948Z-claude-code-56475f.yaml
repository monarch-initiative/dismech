  details: |
    Addresses the blocking GeneReviews finding on PR 10082. Added the top-level references block tagging PMID:20301341 with tags GeneReviews, following the pattern on the sibling Hurler_syndrome entry, with seven Finding objects each carrying an exact supporting_text quote. Mined the chapter for the content the entry lacked: recurrence-risk evidence on the inheritance block, and two new diagnosis entries covering carrier and prenatal testing and the severe-versus-attenuated phenotype determination that GeneReviews places first in management. Also took three reviewer suggestions: replaced two non-propositional snippets that named a measurement without asserting a result, and mirrored the unstratified-cohort caveat from the phenotype use of PMID:41656624 onto its treatment use, since that cohort includes transplanted and therefore severe patients.

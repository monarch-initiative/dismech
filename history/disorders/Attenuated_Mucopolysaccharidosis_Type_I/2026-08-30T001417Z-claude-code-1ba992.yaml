  summary: 'Address non-blocking review notes: fragment quote and directness'
  details: |
    Two non-blocking notes from the re-review of PR 10082. First, the snippet quoting the severe-versus-attenuated determination stopped one clause short of the claim its explanation makes: the source reads 'An essential component of management is the determination of whether the proband has severe or attenuated MPS I', and cut at 'the determination' it named a step without asserting it was essential. Extended at both sites, the diagnosis evidence and the matching GeneReviews finding supporting_text. This is the same defect class as the blocking truncation fixed in the previous commit, so it was worth fixing rather than deferring even though the PR was already approved. Second, added directness INDIRECT to the urinary GAG evidence on the diagnostic pathway entry, where a treatment-response result is used to support a diagnostic measure. Deliberately not applied to the same quote in the biochemical section, where it is a direct pharmacodynamic result and DIRECT is correct.

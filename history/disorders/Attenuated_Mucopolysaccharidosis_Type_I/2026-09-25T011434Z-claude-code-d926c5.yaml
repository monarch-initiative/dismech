  summary: Wire Attenuated MPS I to the lysosomal-storage and MPS GAG-storage modules
  details: |
    Found during a review of the Mucopolysaccharidoses grouping: this entry was the one member that failed the grouping's NECESSARY criterion, because it declared no conforms_to and no glycosaminoglycan-catabolism process. Three annotations added, each mirroring a sibling MPS entry: the Lysosomal Glycosaminoglycan Accumulation node conforms to lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation (as in Hurler, Hunter, Sanfilippo and Morquio); the Extracellular Matrix Disorganization node, the entry node of this entry's somatic chain, conforms to mps_gag_storage#Dermatan Sulfate-Driven Connective-Tissue and ECM Storage (as in Hunter, Maroteaux-Lamy and Sly) and carries GO:0030198 extracellular matrix organization, DYSREGULATED, which its existing PMID:32764324 evidence on collagen and elastin fiber organization already states; the Impaired Dermatan and Heparan Sulfate Degradation node carries GO:0006027 glycosaminoglycan catabolic process, DECREASED (as in Hurler). No evidence, phenotype, or edge was changed. The entry also becomes visible to the Lysosomal Storage Disorders grouping's defining criterion, which it reaches as a nested member. Validated with linkml-validate, linkml-term-validator (all three terms were already cached), check_entity_refs and check_causal_targets.

  summary: 'Create: Attenuated mucopolysaccharidosis type I'
  details: |
    New entry covering the non-neuronopathic arm of MPS I, comprising Hurler-Scheie (MONDO:0011759) and Scheie (MONDO:0011760) as subtypes. Found by diffing MONDO's mucopolysaccharidosis descendants against kb/disorders: dismech curated Hurler syndrome (MONDO:0011758) but neither attenuated concept, which existed only as differential-diagnosis mentions on the Hurler entry and as three open stubs. Curated as a sibling of Hurler syndrome rather than folded into it, because the two arms differ in age at presentation, in the organ systems carrying morbidity, and in the treatment decision (enzyme replacement versus transplantation) - the notes field records that boundary rationale. Sources: the 2020 natural-history review (PMID:32764324), the MPS I Registry growth (PMID:35869927) and cardiac (PMID:37850463) papers, the Cochrane laronidase review (PMID:31211405), the original NEJM ERT trial (PMID:11172140), the 2009 management guidelines (PMID:19117856), a ten-year exclusive-ERT cohort (PMID:41353341), and a carpal tunnel cohort (PMID:41656624). Includes a deliberately curated negative pathophysiology node for preserved CNS function, since that is the defining feature of the attenuated arm and the reason the treatment logic inverts. Registry evidence is quoted at the attenuated-specific figure rather than the pooled one throughout; where a source is not phenotype-stratified that is stated in the explanation. All 49 snippets verified against the reference cache; term validation passes.

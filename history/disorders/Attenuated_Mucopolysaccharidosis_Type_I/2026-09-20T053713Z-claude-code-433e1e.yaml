  summary: 'Genetics pass: IDUA bound on both subtype rows; missing MONDO attenuated-MPS-I
    class recorded'
  details: |
    Genetics pass for issue #12190 (d2g wiring-001), part of epic #12189.

    Research first: the entry already carried a full IDUA genetic record with a documented
    genotype-to-severity direction, the Mucopolysaccharidosis Type I GeneReviews chapter
    (PMID:20301341) as its baseline, and an extensive lump/split rationale for why the
    attenuated arm is a separate entry from Hurler_syndrome. That rationale was left intact.

    What changed. IDUA (hgnc:5391) is bound as a genes descriptor on both has_subtypes rows
    (MONDO:0011759 Hurler-Scheie, MONDO:0011760 Scheie). The genetic record gained
    relationship_type CAUSATIVE and variant_origin GERMLINE, which it lacked. An unsourced
    cytogenetic band in the record's features prose - "chromosome 4p16.3" - was removed: it
    appears in none of the entry's cited references, and the band is not load-bearing for any
    claim the entry makes.

    A finding recorded in notes. This entry carries no disease_term because MONDO has no
    class for the attenuated arm of MPS I. The OLS MONDO search for "attenuated
    mucopolysaccharidosis" returns MONDO:0016316 "mucopolysaccharidosis type 2, attenuated
    form" and no MPS I counterpart. The cost is concrete: kgx_export.iter_edges_with_evidence
    returns immediately when a record has no disease_term.term.id, so this entry currently
    contributes no edges at all to the KGX export, not merely no gene edges.

    MONDO reconciliation. MONDO:0011759 and MONDO:0011760 both record IDUA (hgnc:5391);
    present at the entry level before this pass and now bound on the matching subtype rows.
    No disagreement with MONDO on gene assignment; the missing attenuated-MPS-I class is
    reported as an upstream candidate.

    Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches
    and validate-disorders all pass.

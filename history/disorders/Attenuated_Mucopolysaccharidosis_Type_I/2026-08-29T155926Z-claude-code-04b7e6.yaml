  summary: Curate absent developmental regression; migrate retired supports values
  details: |
    Migrated two retired 'supports: PARTIAL' items to the new direction-plus-directness model, both to SUPPORT: the MPS-I-spectrum quote as INDIRECT (the curated claim about genotype predicting direction but not individual course follows from the quoted continuum by inference) and the laronidase-antibody quote as DIRECT (it asserts the immunogenicity claim the treatment entry actually makes). Added one excluded phenotype: developmental regression, with frequency EXCLUDED and modifier ABSENT. Deliberately curated as absent regression rather than as absent intellectual disability. The temptation is to record normal intelligence as the exclusion, since preserved cognition is what the word attenuated means, but the source cohort reports 16 percent of attenuated patients with cognitive impairment before enzyme replacement, and mild learning difficulty is recognised at the Hurler-Scheie end. What is genuinely excluded is the progressive neurodegenerative course, and the cited sentence states in one breath both the 84 percent normal-cognition figure and that no patient developed cognitive regression. The phenotype description records that reasoning so the narrower exclusion is not later widened. Note that this entry has no disease_term, only narrowMatch and broadMatch MONDO mappings, so the HPOA exporter currently emits no rows for it at all.

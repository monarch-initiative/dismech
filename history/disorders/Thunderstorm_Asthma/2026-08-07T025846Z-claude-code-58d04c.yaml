  details: |
    Backfill for issue #8085. This entry is unusual in that the environmental exposure is the mechanism rather than a precondition: the thunderstorm is TRIGGERS/DIRECT into the pollen concentration and osmotic rupture node, because storm outflow concentrating grains and humidity rupturing them is exactly the physical event that node describes. Ryegrass pollen sensitization is TRIGGERS/DIRECT into the IgE-mediated mast cell activation node rather than the deposition node, since without pre-existing specific IgE the same particle load produces no attack. Outdoor mould sensitization is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES because its evidence is predictive of epidemic asthma rather than establishing mould as the particle driving these events. Validated with linkml-validate, just validate-terms and just validate-references; integrity issue count unchanged from origin/main.

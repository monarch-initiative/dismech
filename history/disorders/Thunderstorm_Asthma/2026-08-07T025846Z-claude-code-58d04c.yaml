  details: |
    Backfill for issue #8085. This entry is unusual in that the environmental exposure is the mechanism rather than a precondition: the thunderstorm is TRIGGERS/DIRECT into the pollen concentration and osmotic rupture node, because storm outflow concentrating grains and humidity rupturing them is exactly the physical event that node describes. Ryegrass pollen sensitization is TRIGGERS/DIRECT into the IgE-mediated mast cell activation node rather than the deposition node, since without pre-existing specific IgE the same particle load produces no attack. Outdoor mould sensitization is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES because its evidence is predictive of epidemic asthma rather than establishing mould as the particle driving these events. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged from origin/main. PR review noted the storm link's evidence covered concentration but not the osmotic-rupture half of its target node. A second evidence item was added from PMID:26765082, already cached in this entry, stating that thunderstorms concentrate pollen grains at ground level and release respirable allergenic particles after rupture by osmotic shock, so both halves of the node are now evidenced.

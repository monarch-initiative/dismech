  summary: 'Review round 1: address all eight blocking findings and four suggestions
    on PR #11799'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11799 in a single push. The reviewer's root-cause diagnosis was right: PMID_41370196 is a full-text cache with Tables 1 and 2, and the entry was quoting only its abstract. Snippets went from 45 to 86.

    Finding 1, omitted phenotypes. Added hypogammaglobulinemia, lymphadenopathy, splenomegaly, oral ulcers and CD8+/CD57+ large granular lymphocytes.

    The reviewer's suggested HP:0002720 for hypogammaglobulinemia is wrong: that term is Decreased circulating IgA concentration. Bound HP:0004313 Decreased circulating immunoglobulin concentration instead, which carries Hypogammaglobulinemia as an exact synonym, verified against OLS.

    LGLs have no HPO term. Bound the HP:0004332 Abnormal lymphocyte morphology parent with the immunophenotype in preferred_term and a review_notes recording that NCIT:C12921 exists but is a cell type rather than a phenotypic abnormality and cannot fill an HP-rooted slot.

    Finding 2, bundled cytopenias. Split into Thrombocytopenia (HP:0001873, universal at 10 of 10, severity MODERATE, with the paper's own platelet-count band definitions as a second evidence item) and Anemia (HP:0001903, 5 mild-moderate and 3 severe).

    Finding 3, TLR8 inhibition. Rewrote the description around the inhibitor experiment in patient p.P432L iPSC-derived macrophages. Chloroquine and CPG-52364 inhibited the GOF receptor; CU-CPT9a did not, and that failure is curated as REFUTE. Added the CU-CPT9a result and the inhibitor's stated binding mode as INDIRECT support on the conformational_gain_not_receptor_gain hypothesis, since an inhibitor that binds the inactive conformation failing on the variant is what that hypothesis predicts. Also added the single-patient hydroxychloroquine failure as REFUTE.

    Finding 4, no diagnosis section. Added two entries: targeted deep sequencing for low-VAF somatic variants, citing the authors' high-index-of-suspicion statement, the lower-VAF-in-females detail and the alternative-methodologies sentence, plus PMID:36119097 generalizing the problem; and bone marrow biopsy with immunophenotyping, including the no-dysplasia negative that separates this from the myelodysplastic differential, and a REFUTE item against using the biopsy as a rule-out test.

    Finding 5, missing treatments. Added immunoglobulin replacement (6 of 10 patients, NCIT:C62710) and a combined entry for sirolimus, mycophenolate mofetil and JAK inhibitors with REFUTE evidence, plus the single-patient azathioprine/methotrexate/cyclophosphamide/rituximab failure. Added the busulfan-avoidance recommendation and the patient-2 VOD case to the HCT entry.

    Finding 6, wrong hotspot. Rewrote genetic.notes around p.P432 (8 of 10 patients: 6 p.P432L, plus novel p.P432Q and p.P432R), with three new evidence items including the functional validation showing neither novel allele is constitutively active. Recorded in an explanation that the deep-research report names Phe494/Gly572 from ClinVar and the primary literature disagrees, so the report is not followed.

    Finding 7, clinical trial. Fetched NCT04339777 and added a clinical_trials entry, noting it is a general inborn-errors-of-immunity transplant protocol rather than a TLR8-specific trial.

    Finding 8, no animal model. Added the human TLR8 transgenic crossed onto a lupus background, with relationship PARTIALLY_RECAPITULATES, fidelity LOW, and three typed divergences: CONTESTED_ASSUMPTION (transgenic quantity of normal receptor is not the same lesion as a hypersensitive one), PROXY_QUANTITY (fatal anaemia in a whole animal versus blocked EPO signalling in erythroid progenitors, reached by a myeloid route), and POPULATION_MISMATCH (the lupus background is required). Narrowed the notes claim from 'no animal model' to 'no knock-in mouse' and stated that the earlier version overstated the absence.

    Suggestion 9, adaptor step. Added a TIRAP-MyD88 Adaptor Assembly and IRAK Activation pathophysiology node between the sensor and the cytokine output, citing PMID:41159953 and PMID:21606490. Both carry a second species divergence one step below ligand recognition, which strengthens the entry's no-mouse argument rather than restating it. The node's description records that the gain-of-function claim there is inferred rather than measured in patient cells. Inserting the node produced a duplicate evidence key on the sensor node's downstream edge; the pre-existing evidence item was re-homed onto the new adaptor-to-cytokine edge rather than deleted, and the explanation records the move.

    Suggestion 10, cell-extrinsic lean. Rewrote the low_vaf_mosaic_sufficiency description to record the authors' stated position rather than presenting the two accounts as equally open, including the clean form of the argument for the lymphoid arm (T and B cells do not express TLR8), and the named candidate intermediates for the edge left as INDIRECT_UNKNOWN_INTERMEDIATES.

    Suggestion 11, reference consumption. PMID:36119097, PMID:41159953 and PMID:21606490 are now cited.

    Suggestion 12, references block. Confirmed by PubMed esearch that no GeneReviews chapter exists for TLR8 or immunodeficiency 98, and added a top-level references block with the founding cohort, the expanded cohort and the interface-disorders review.

    Validation: schema, term and reference validation all pass; snippets verified 86/86 (was 45/45). All nine offline gates run. Cache diff is additive: two term rows, two enum rows, a full-text upgrade to PMID_36119097, and the new NCT cache file.

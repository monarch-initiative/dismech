  summary: 'Create: Immunodeficiency_98_With_Autoinflammation (MONDO:0024777)'
  details: |
    De novo curation of TLR8 gain-of-function disease (IMD98 / INFLTR8). Deep research: one openscientist report, committed alongside. Report reference validation resolved 13/13 citations with confabulation_rate 0.0 and 13/13 quotes valid; term validation returned needs_review: true on 7 label mismatches, all table-parsing artefacts. just preflight-dr returns PASS with OMIM agreement (301078 on both sides) and TLR8 mentioned 81 times. Worth recording that the report's relevance metric reads on_topic 4 of relevance_assessed 13 with off_topic null and no off_topic_references, so nine references are undecided rather than off topic; that is the accounting gap issue #9339 describes, and it would be a misreading to treat the low on_topic count as a relevance failure. No GeneReviews chapter exists for this disease; the PubMed search was run and returned nothing, which is expected for a disease first described in 2021. The entry models two mechanistically separate arms from the same receptor: the myeloid NF-kB/cytokine arm producing marrow failure, lymphoproliferation and the B-cell defect, and an erythroid-intrinsic arm in which TLR8 activation blocks annexin A2-mediated STAT5 membrane localisation and disrupts EPO signalling. Three mechanistic_hypotheses blocks: how a somatic clone at 7-26 per cent variant allele fraction produces full disease, and whether gain of function here is conformational stabilisation of the active homodimer rather than more receptor - the A518T allele signals more from less protein, since it turns over faster. Granulocyte colony-stimulating factor and corticosteroids are curated as a treatment with REFUTE evidence rather than omitted, because their failure is diagnostically useful. No animal_models section: TLR8 ligand recognition is species-specific and R848 does not activate the rodent receptor, which is recorded in notes as the reason rather than left as an absence. One error of my own was caught by the reference validator: a reference_title completed from a truncated search listing as 'a hypothetical model' where the cached title says 'a hypothesis'. Validation: schema, term and reference checks pass with 45/45 snippets verified; all five offline gates pass.

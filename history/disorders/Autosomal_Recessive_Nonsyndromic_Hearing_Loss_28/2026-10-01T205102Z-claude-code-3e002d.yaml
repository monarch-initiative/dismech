  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 28 (DFNB28, TRIOBP)'
  details: |
    De novo curation of DFNB28 (MONDO:0012355), biallelic TRIOBP. Stub stubs/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_28.yaml deleted.

    entry_type decision: DISEASE. One gene, MONDO records no descendants, and no existing entry covers TRIOBP (git grep of origin/main found TRIOBP only as a rootlet protein mentioned in the DFNB79/TPRN entry).

    Sources: own PubMed sweep ("TRIOBP AND (deafness OR hearing)", 48 records; "DFNB28", 12 records) plus an Edison/falcon deep-research report (research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_28-deep-research-falcon.md; 14/14 references verified, no confabulated terms). just preflight-dr could not run because it needs the local MONDO build, which was not fetched for disk reasons; a manual entity check found TRIOBP mentioned 59 times in the report and the report's phenotype OMIM 609823 matches MONDO's OMIM xref. The report added no claim that is not already in the entry from primary sources.

    Pathograph: TRIOBP-4/5 loss of function -> loss of dense F-actin bundling (GO:0051015 and GO:0051017 DECREASED) -> failure of stereocilia rootlet formation -> reduced pivot stiffness and fragility -> stereocilia fusion and bundle degeneration -> both hearing phenotypes. A second branch from the bundling node runs to reduced supporting-cell apical stiffness, linked to hearing loss with INDIRECT_UNKNOWN_INTERMEDIATES because its human contribution is unmeasured (recorded as a HUMAN_MODEL_MISMATCH discussion). Consistency with DFNB79: the rootlet node quotes the same PMID:40471101 sentence as DFNB79 about TPRN loss removing TRIOBP-5 and ANKRD24 from rootlets.

    The milder TRIOBP-5-only presentation (Dutch, Polish families) is curated as a separate phenotype and its isoform explanation recorded as a KNOWLEDGE_GAP, since both families share one allele (p.Gly1672*) in compound heterozygous form and the TRIOBP-5-null mouse becomes severe-to-profound.

    No GeneReviews or StatPearls chapter exists (just check-genereviews: NO_CHAPTER). Hearing aids and genetic counselling carry no evidence items, for the reasons stated in their notes. Uncited DOI cache files written by the deep-research reference validation were not committed.

    Validation: just validate, count-verified-snippets (42/42), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-coarse-phenotypes, check-reference-titles, check-folded-hyphens, check-environmental-evidence, check_gene_activity_grounding and validate-disorders.

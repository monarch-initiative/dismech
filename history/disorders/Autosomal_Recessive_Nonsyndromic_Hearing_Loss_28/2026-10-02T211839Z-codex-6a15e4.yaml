- type: REVIEW
  outcome: changed
  summary: Review DFNB28 clinical scope, isoform mechanisms, experimental models and supportive care against cached full text
  details: |
    Reviewed the existing DFNB28 entry and CREATE history on main 093f725c2404daf223b730d6c901167470314dea. This is a genetic TRIOBP disorder, within the review campaign's exclusion of infectious and environmental diseases. No prior REVIEW or overlapping open disorder/history PR was present at selection. The worktree was created from and rebased onto current main before revision.

    Corrected clinical overgeneralization: normal vestibular testing is a reported observation, not a universal excluded phenotype; normal vision and absence of conductive loss were specifically documented in Palestinian family K. The Polish full text supplies reported onset/recognition at 3, 4.5 and 12 years, two-year stability in two siblings, no follow-up audiogram for the third, a passed newborn screen and later superimposed otitis-related conductive loss. The Dutch moderate cases do not all share a TRIOBP-5-only allele. Implant results come from three Afghan siblings and include the oldest recipient's inability to perform open-set speech audiometry at ten months. Molecular diagnosis now requires pathogenicity and recessive phase, not simply two variants.

    Added general Genetic Hearing Loss Overview guidance for hearing aids, communication and language access, audiologic/family follow-up, avoiding additional noise injury and counseling conditional on both parents being heterozygous carriers. This general chapter is not a disease-specific phenotype or prognosis baseline. The previous hearing-aid phenotype was incorrectly placed under target_mechanisms and is now a target_phenotypes link. The moderate-to-severe phenotype uses the broader sensorineural-hearing-impairment term, with the observed severity in prose.

    Mechanistic review separates early pre-hearing cochlear-explant recordings from in-vivo mouse hearing and ultrastructure. Preserved early MET responses do not establish preserved transduction after degeneration. The lethal mouse genotypes removed TRIOBP-1 and TRIOBP-5 together, not isolated TRIOBP-1; human viability and auditory restriction are not proven by that observation. Individual patient transcript/protein loss is partly predicted. Added TRIOBP-5 coiled-coil-dependent self-association, disrupted cuticular-plate actin and supporting-cell cytoskeletal abnormalities. Their contributions to human hearing remain provisional. AFM softening and radial gradients are from P5-P6 explants; softer heterozygous tissue can coexist with preserved hearing. ANKRD24 localization rescue is an explant experiment, not demonstrated in-vivo hearing rescue. TPRN provides a related rootlet comparison, not a second human DFNB28 cause or validated modifier.

    The published Triobp delta-exon8/YHB226 compound heterozygote was missing from the model comparison. Added it with its slower auditory trajectory, exon-skipping transcripts and possible residual shortened TRIOBP-5. Revised the proposed dosage experiment to distinguish residual TRIOBP-5 function and TRIOBP-1 dosage rather than proposing an already-published model as wholly new.

    Source consumption: read the complete cached scientific body of PMID:16385458, PMID:29197352 and PMID:20510926 (including 2010 main methods), plus the scientific narrative/methods and legends recovered for PMID:16385457 through generated PMC1380211 HTML. Read PMID:36029164 clinical methods/results/discussion; its blanket inference about all missense variants is not adopted. Read PMID:31217345 full results/discussion and selected model, ABR, transfection, NanoSPD, AFM and fluid-jet methods. Read PMID:35737845 relevant ultrastructure, AFM, radial-gradient results, discussion limitations and main methods; PMID:35175278 interaction/localization, mutant/rescue results, discussion and explant-transfection methods; PMID:40471101 rootlet-protein localization, ultrastructure, mechanotransduction/stiffness comparison, discussion and recording methods. These targeted full-text reads are not claims to have consumed every supplement or every paragraph of the last four papers. PMID:23789641, PMID:28089734 and PMID:32877897 were read as complete abstracts; DOI retrieval did not recover fuller text. The research Figure 6A/B image was visually inspected; it includes only part of 6C and is not the complete figure/supplement.

    New generated DOI caches for Zhou 2020 (10.1186/s12881-020-01055-5) and Zhou 2021 (10.3389/fgene.2021.766973) supplied full text. Read clinical methods/results/discussion and source limitations: p.Arg448* in the Chinese family is independent of the Afghan implant pedigree; the 2021 patient lacked contemporaneous audiometry, and severity is not inferred. Neither source's broader speculative signaling pathways or unvalidated additional gene variants were imported. Original Shahin abstract/full-text disagreement over the truncating allele paired with G1019R is acknowledged rather than silently resolved.

    General GeneReviews NBK1434 reader cache: mined selected molecular diagnosis, management, communication, surveillance, noise avoidance and counseling/family-evaluation sections. Generated the full Bookshelf PDF and checked the matching testing/amplification/surveillance passages where HTML tags interrupted quote matching. The generated PDF title is its URL and was not hand-edited. Every cache was generated using the reference fetcher; no cache was manually authored.

    Research completeness: read the Falcon substantive report, citation appendix, allele-table artifact and complete bibliography, and inspected its figure. Automated entity preflight PASS for MONDO:0012355/TRIOBP/OMIM:609823. Its term-label warning arose from the template phrase 'if available', not a disease mismatch. Phenotypes: adequate after family-level scoping and later-onset/mixed-loss additions. Subtypes: no established distinct subtype requiring a separate record. Pathophysiology: central rootlet, oligomerization, cuticular-plate and supporting-cell mechanisms represented with explicit model limits. Treatments/trials: clinical CI series and general supportive care represented; no verified DFNB28 Phase II+ trial surfaced. Genetics: segregation and isoform-specific alleles covered, without adopting all historical missense classifications. Diagnostics: pathogenicity, phase, panel/genomic testing and surveillance covered. References: central clinical and experimental sources consumed, including two previously uncited Chinese reports. Overall consumption: adequate for verified disease-specific content.

    Research scoping: Margret 2024 retrieved abstract attributes hearing loss and infertility to independent events; no new DFNB28 infertility phenotype is added. Tlili 2024 abstract does not verify the report's case-level missense claim, so it is not imported as a pathogenic allele. Broad Taiwanese panel yields are not DFNB28 prevalence or diagnostic sensitivity. RFX3 developmental regulation, a Meniere/noise preprint lead, TRIOBP1 psychiatric/cancer associations and OTOF gene therapy are not established DFNB28 causation or treatment evidence. Exhaustive historical variant-table replication, inaccessible supplements and clinical full texts remain outside this review's verified source claims.

    Validation: schema, ontology and references pass with 73/73 snippets and 89 titles; snippet-boundary checks pass. All 23 repository QA gates pass. History validation and rendering pass; the rendered page includes the added mechanisms. Commit hooks are run before publication. Formal author assessment is a COMMENT; independent current-head review and green CI remain necessary. No self-approval or merge is authorized by this record.

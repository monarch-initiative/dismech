  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing TRIOBP sequencing and audiologic follow-up rows, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound: TRIOBP-related hearing loss is bimodal rather than a single grade, with congenital profound loss in the founding and Afghan families and congenital moderate-to-severe loss in patients carrying a TRIOBP-5-only truncation in trans with a TRIOBP-4/5 truncation, so no single WHO/GBD band would represent the gene's range.

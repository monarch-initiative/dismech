  summary: 'Create: Spermatogenic_Failure_33'
  details: |
    Created the SPGF33 entry for CFAP251-related male infertility (MONDO:0029147). Sources: a claude_code deep-research report (research/Spermatogenic_Failure_33-deep-research-claude_code.md, preflight PASS) used as leads only, plus PubMed searches for CFAP251/WDR66. Primary evidence: Auguste 2018 and Kherraf 2018 (founder exon 20-21 deletion), Li 2019, Wang 2021 (ICSI pregnancy, maternal UPD), Liu 2026 (splice alleles, knockout mouse, ICSI live births, one patient with cough and CT changes) and a 2026 HOST-ICSI case report, with Tetrahymena CSC structure (Urbanska 2015). Pathograph: Loss of CFAP251 (GO:0005200 DECREASED, radial spoke base 3) -> loss of the calmodulin- and spoke-associated complex (radial spoke assembly DECREASED) -> sperm axonemal disorganization (incl. mitochondrial sheath) -> MMAF -> flagellar phenotypes and male infertility; the CSC nodes use the same names and terms as SPGF51 and SPGF84. A CANONICAL hypothesis records the sperm-restricted phenotype with REFUTE items for the single PCD-like patient and the knockout mouse's tracheal inner dynein arm loss. ClinGen has not classified the pair (2026-10-14 export) and there is no GeneReviews chapter. Validated with just validate, validate-terms, count-verified-snippets (all verified), entity-ref, causal-target, duplicate-key, snippet grading/length/title, reference-title, gene-activity-grounding and GeneReviews checks, and validate-disorders. Stub stubs/Spermatogenic_Failure_33.yaml deleted.

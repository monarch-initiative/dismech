  summary: 'Create: ZAP70 deficiency'
  details: |
    De novo curation of Combined Immunodeficiency Due To ZAP70 Deficiency
    (MONDO:0010023, gene ZAP70/hgnc:12858, OMIM 269840) from the stub queue;
    the stub stubs/Combined_Immunodeficiency_Due_To_ZAP70_Deficiency.yaml was
    deleted in the same change (claim issue #9573).

    Pathophysiology: four-node causal chain with biological_scale tags and
    CL/GO bindings -- Loss of ZAP-70 Kinase Activity in TCR Signaling
    (MOLECULAR; GO:0004715, GO:0050852; genetic_context GERMLINE
    LOSS_OF_FUNCTION) -> Failed Positive Selection of CD8 Thymocytes
    (CELLULAR; CL:0000809, GO:0045059, GO:0043374) -> Absence of CD8+ T cells,
    and -> Defective Peripheral CD4+ T-Cell Activation (CELLULAR; CL:0000624,
    GO:0042110, GO:0032623, GO:0042098) -> Combined Cellular and Humoral
    Immune Failure (ORGANISM; GO:0002250, GO:0002377) -> infection and growth
    phenotypes.

    Evidence anchored in the three foundational 1994 papers (Arpaia
    PMID:8124727; Elder PMID:8202712; Chan PMID:8202713), the GeneReviews
    chapter (PMID:20301777, tagged GeneReviews in top-level references), the
    49-patient systematic review (PMID:32431715), long-term HSCT outcomes
    (PMID:27438785), the IUIS 2022 classification (PMID:35748970, Table 1 row
    quoted for iuis_category "combined immunodeficiency"), and the structured
    Orphanet record ORPHA:911 (rebuilt into references_cache from the pinned
    Orphadata snapshot). The distinct hypomorphic-plus-activating autoimmune
    genotype (Chan 2016, PMID:26783323; OMIM 617006) is covered as PARTIAL
    evidence and genetic notes, kept nosologically separate per IUIS.

    Phenotypes bound to HP with FrequencyEnum bands sourced from ORPHA:911
    frequency rows and systematic-review percentages. Treatments: HSCT
    (NCIT:C15431, therapeutic_modality CELL_THERAPY, three target_mechanisms
    RESTORES links), immunoglobulin replacement (NCIT:C62710, MODULATES), and
    antimicrobial prophylaxis (NCIT:C15986). Structured prevalence: Orphanet
    worldwide point prevalence class Unknown plus CASES_IN_LITERATURE
    ULTRA_RARE (49 reported patients).

    Validation: just validate, just validate-terms, just
    count-verified-snippets (60/60 snippets verified), just validate-disorders
    (authoritative batched sweep), just check-duplicate-keys, just
    check-entity-refs, check_snippet_length, and check_title_snippets all
    passed. PMID:37101133 was fetched and screened but not cited.

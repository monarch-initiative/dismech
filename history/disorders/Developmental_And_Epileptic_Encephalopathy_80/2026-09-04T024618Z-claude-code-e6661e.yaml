  summary: 'Create: Developmental And Epileptic Encephalopathy 80 (PIGB)'
  details: |
    New AR PIGB-related GPI-anchor-deficiency DEE (GPIBD20). Deep-research: falcon (Edison) was requested with --fallback but returned HTTP 402 (account out of credits); openscientist produced the report (24 citations, provenance fell_back=true). Entry grounded in primary literature: Murakami et al. 2019 (PMID:31256876, index 10-family series), Schiavoni et al. 2021 (PMID:34161862, further delineation), and founding PIGB biochemistry Takahashi et al. 1996 (PMID:8861954). Pathograph built as a causal chain PIGB LOF -> impaired GPI-anchor biosynthesis -> reduced surface GPI-anchored proteins -> neuronal dysfunction/DEE; the final edge is directness INDIRECT with a KNOWLEDGE_GAP discussion (no human neural E/I data) and the entry deliberately does not conform to the epilepsy E/I or CDG modules. NEC preflight-dr WARN for rival gene 'GPI' is a false positive (GPI = the glycosylphosphatidylinositol anchor abbreviation, not the GPI gene); OMIM matched 618580. No PIGB-specific GeneReviews chapter (PubMed searched). Validated: just validate PASS; count-verified-snippets 44/44; check-entity-refs OK; check-causal-targets OK; validate-disorders PASS. Curated in worktree by Claude Code.

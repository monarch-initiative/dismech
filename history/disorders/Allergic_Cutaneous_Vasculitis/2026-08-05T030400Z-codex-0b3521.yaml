  summary: 'Publication review: Allergic Cutaneous Vasculitis'
  details: |
    Independent publication-readiness review. Narrowed scope to skin-limited immune-complex cutaneous small-vessel vasculitis; rebuilt the mechanism into atomic immune-complex, complement, neutrophil, and vessel-injury events; connected all phenotypes; corrected evidence source types and exact snippets; updated diagnostic guidance and epidemiology with the current EADV consensus and a 2024 single-organ cohort; and limited treatment claims to supported skin-limited management. Verified the active trial status on ClinicalTrials.gov and excluded conflated systemic, IgA, cryoglobulinemic, ANCA-associated, and urticarial vasculitides.

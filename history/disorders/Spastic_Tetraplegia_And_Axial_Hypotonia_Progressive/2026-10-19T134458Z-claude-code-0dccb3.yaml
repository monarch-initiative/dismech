  summary: 'Address review: optic atrophy, missing phenotypes, mouse model, dog model'
  details: |
    Responded to the ai4c-reviewer changes-requested review. Optic atrophy was described as a single-patient finding, but Table 1 of PMID:34380534 (2/5) and PMID:36793789 (2/8, plus optic tract thinning in 3/6 on MRI) record it; description and notes corrected and table rows added as evidence. Added phenotypes recorded in the same tables: hyperreflexia, facial weakness, facial myokymia, oculomotor apraxia, sialorrhea, constipation, scoliosis, congenital hip dislocation, short stature, microcephaly, low-set ears, each with per-cohort counts. Split the bundled atrophy node into progressive cerebellar vermis atrophy, static brainstem atrophy, fronto-temporal cortical atrophy and retro-chiasmal optic tract thinning, per the serial-MRI table. Sod1-null mouse changed from FAILS_TO_RECAPITULATE to PARTIALLY_RECAPITULATES with QUALIFYING divergences, citing the late motor neuropathy reported in PMID:36793789. Added the Markiesje dog SOD1 frameshift model (PMID:33677640). Bound the proteasomal node to GO:0010498 rather than the suggested ubiquitin-dependent GO:0043161, which the source does not establish. Dropped an unsourced polyhydramnios mechanism phrase. Ran an openscientist deep-research pass.

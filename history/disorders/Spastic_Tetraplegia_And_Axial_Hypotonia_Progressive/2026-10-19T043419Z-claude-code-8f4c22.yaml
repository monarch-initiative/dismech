  summary: 'Create: Spastic Tetraplegia and Axial Hypotonia, Progressive (STAHP)'
  details: |
    New entry for STAHP (MONDO:0032828), recessive SOD1 deficiency. Literature found by PubMed search for homozygous/biallelic SOD1 loss-of-function reports; seven human papers (2019-2025) and the Sod1 knockout mouse paper cached via fetch-reference. Pathograph: biallelic SOD1 LoF -> proteasomal degradation of unstable product -> absent SOD1 activity -> (a) reduced erythrocyte glutathione -> shortened erythrocyte survival -> hemolytic anemia; (b) upper and lower motor neuron degeneration -> spastic tetraplegia, axial hypotonia, bulbar and respiratory signs; (c) cerebellar/brainstem/frontal atrophy. Sod1-null mouse linked as FAILS_TO_RECAPITULATE with a HUMAN_MODEL_MISMATCH discussion; separate-entity-vs-early-ALS controversy and SOD1-silencing implications recorded as discussions. Validated with just validate (schema, terms, 83 snippets).

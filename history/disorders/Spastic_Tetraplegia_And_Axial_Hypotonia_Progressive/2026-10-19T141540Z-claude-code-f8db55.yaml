  summary: 'Address re-review: mouse timing, rescue evidence, two phenotype edges'
  details: |
    Mouse model prose said the knockout's motor involvement was late, but PMID:21963651 reports denervation from 1-4 months; reworded the animal description, link description, SPECIES_MISMATCH and TEMPORAL_SCOPE divergences, and the HUMAN_MODEL_MISMATCH prompt and rationale so the difference is the pattern of degeneration (distal axonopathy with motor neuron cell bodies spared) rather than timing. Added the neuron-restricted (PMID:24378874) and intermembrane-space (PMID:21078595) rescue papers as MODEL_ORGANISM, INDIRECT evidence on the absent-SOD1 to motor neuron degeneration edge. Linked Babinski sign and facial myokymia to the motor neuron node using sentences from PMID:34380534. Facial weakness, sialorrhea and oculomotor apraxia stay unconnected because no source ties them to a mechanism; genetic counseling was not added because no cited source states it for this disease.

  summary: 'Create: Incontinentia Pigmenti (IKBKG/NEMO, X-linked dominant)'
  details: |
    New de-novo entry for incontinentia pigmenti (Bloch-Sulzberger syndrome; MONDO:0010631), the X-linked dominant, male-lethal IKBKG/NEMO ectodermal disorder. Deep research via the claude_code provider (research/Incontinentia_Pigmenti-deep-research-claude_code.md); GeneReviews chapter (PMID:20301645) fetched, tagged, and mined as the phenotype/management baseline. Eight atomic (unbundled) pathophysiology nodes model IKBKG/NEMO loss of function -> impaired canonical NF-kB activation, branching into (a) heightened susceptibility to TNF-induced apoptosis -> skewed X-inactivation/male lethality + vesiculobullous Blaschko-linear skin disease + retinal vascular dysgenesis/neovascularization + cerebral microvascular/neuronal injury, and (b) a bystander NF-kB-competent eotaxin/eosinophil-recruitment arm (the surviving wild-type-X cells drive the stage-I eosinophilic inflammation). 13 phenotypes (four staged skin lesions, dental, hair, nail, ocular, neurologic, eosinophilia), IKBKG genetics with the recurrent exon 4-10 deletion (PMID:19603533), X-linked dominant male-lethal inheritance, eosinophilic-spongiosis histopathology, clinical+molecular diagnosis, treatments (retinal laser photocoagulation, ophthalmologic surveillance schedule, supportive skin care), Danish nationwide birth prevalence 2.37/100,000 (PMID:39623400), GENETICS_ENVIRONMENT_DISEASE + DERMATOLOGY classification, and a discussions section (KNOWLEDGE_GAP on genotype-phenotype variability; INTERPRETATION resolving the NF-kB-loss-vs-NF-kB-driven-inflammation paradox via the mosaic bystander mechanism). Distinct from the allelic sibling entry IKBKG_Ectodermal_Dysplasia_with_Immunodeficiency (IKBKG-hypomorphic male EDA-ID). Validated: schema, term validation (--labels), 36/36 snippets exact, folded-hyphen, pathograph fully connected (8 nodes), reference-validator title check, compliance 92.9%.

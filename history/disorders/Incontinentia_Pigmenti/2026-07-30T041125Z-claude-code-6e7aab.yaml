  summary: 'Create: Incontinentia Pigmenti (IKBKG/NEMO, X-linked dominant)'
  details: |
    New de-novo entry for incontinentia pigmenti (Bloch-Sulzberger syndrome; MONDO:0010631), the X-linked dominant, male-lethal IKBKG/NEMO ectodermal disorder. Deep research via the claude_code provider (research/Incontinentia_Pigmenti-deep-research-claude_code.md); GeneReviews chapter (PMID:20301645) fetched, tagged, and mined as the phenotype/management baseline. Eight atomic (unbundled) pathophysiology nodes model IKBKG/NEMO loss of function -> impaired canonical NF-kB activation, branching into (a) heightened susceptibility to TNF-induced apoptosis -> skewed X-inactivation/male lethality + vesiculobullous Blaschko-linear skin disease + retinal vascular dysgenesis/neovascularization + cerebral microvascular/neuronal injury, and (b) a bystander NF-kB-competent eotaxin/eosinophil-recruitment arm (the surviving wild-type-X cells drive the stage-I eosinophilic inflammation). 13 phenotypes (four staged skin lesions, dental, hair, nail, ocular, neurologic, eosinophilia), IKBKG genetics with the recurrent exon 4-10 deletion (PMID:19603533), X-linked dominant male-lethal inheritance, eosinophilic-spongiosis histopathology, clinical+molecular diagnosis, treatments (retinal laser photocoagulation, ophthalmologic surveillance schedule, supportive skin care), Danish nationwide birth prevalence 2.37/100,000 (PMID:39623400), GENETICS_ENVIRONMENT_DISEASE + DERMATOLOGY classification, and a discussions section (KNOWLEDGE_GAP on genotype-phenotype variability; INTERPRETATION resolving the NF-kB-loss-vs-NF-kB-driven-inflammation paradox via the mosaic bystander mechanism). Distinct from the allelic sibling entry IKBKG_Ectodermal_Dysplasia_with_Immunodeficiency (IKBKG-hypomorphic male EDA-ID). An internal red-team review (dismech-pr-review) was run before PR and its findings folded in: corrected the peripheral-eosinophilia evidence (blood vs tissue snippet), re-evidenced and rescoped the cerebral node to the vaso-occlusive mechanism (PMID:26043102), re-routed the bystander-eotaxin edge to originate from the keratinocyte-necrosis node, rescoped the X-inactivation/male-lethality node to the evidenced organism-level male lethality (avoiding an unquotable skewed-XCI node), added a developmental-delay phenotype, added the IKBKG pseudogene diagnostic caveat (PMID:19603533), and added an allelic-disorder cross-reference to the EDA-ID sibling entry. Automated PR review (#7124) then requested further changes, all folded in: split the bundled skin node into a four-stage downstream chain (Stage I vesiculobullous -> II verrucous -> III dermal-melanophage pigment incontinence [the eponymous node, with melanocyte + macrophage cell types] -> IV atrophic hypopigmentation); added the bidirectional amplification-loop feedback edge (bystander -> TNF-apoptosis); added MODEL_ORGANISM evidence from the NEMO-knockout mice (PMID:16399796 Nenci TNF-dependence; PMID:10911992 Rudolph male lethality + keratinocyte clearing) and an IN_VITRO keratinocyte-eotaxin item, replacing the eotaxin study-aim snippet with the IHC finding; added quantitative frequency evidence (teeth 58.7%, skin 93.3%, neurological 28% from PMIDs 39623400/33655605); added GeneReviews genetic-counseling figures (65% de novo, 33/33/33 transmission) and dental/neurologic management treatments. Validated: schema, term validation (--labels), 52/52 snippets exact, folded-hyphen, pathograph fully connected (11 nodes), reference-validator title check, compliance ~91%.

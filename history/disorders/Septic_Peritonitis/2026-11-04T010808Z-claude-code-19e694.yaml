  details: |
    Created a septic peritonitis disease entry from the local OpenScientist report for MONDO:0005195. Scoped the entry to secondary bacterial septic peritonitis, excluding spontaneous bacterial, peritoneal-dialysis-associated, sterile chemical, and tertiary peritonitis. Curated endogenous peritoneal inoculation, enteric aerobic and anaerobic infectious agents, progression phases from visceral breach through source-controlled resolution or tertiary recurrence, a secondary-peritonitis pathograph from barrier failure through abdominal sepsis, sepsis and acute-abdomen phenotypes, CT and clinical diagnostic support, procalcitonin and CRP biochemical markers, source-control and antimicrobial treatments, and a cecal-ligation-and-puncture animal model with a typed source-control boundary omission. Ran preflight-dr with the expected no-causal-gene SKIP, avoided the report CURIEs that term validation marked as mislabelled, fetched every cited PMID with just fetch-reference, and validated schema, terms, and snippets.

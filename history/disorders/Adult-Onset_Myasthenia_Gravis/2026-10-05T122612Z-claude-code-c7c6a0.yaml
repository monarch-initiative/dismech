  summary: Evidence-claim mismatch review (#13158)
  details: |
    Reviewed the 14 whole-claim MISMATCH findings in the saved Jev assessment against the current entry and cached sources. Changed 8 claims. (1) Ectopic Thymic Germinal Center Formation: the PMID:38886398 snippet about surgical ascertainment of thymectomy was a caveat, not support; replaced it with the paper's background sentence linking AChR+ EOMG to B-cell thymic infiltration and ectopic germinal centers (quote_role BACKGROUND). (2) Edge to Thymic Follicular Hyperplasia: replaced the PMID:27273086 sex-ratio sentence with the PMID:38886398 sentence equating ectopic GC development with lymphofollicular hyperplasia. (3) Impaired Neuromuscular Transmission -> Myasthenic Crisis: replaced a crisis-frequency sentence (PMID:22476514) with the PMID:39105625 sentence placing respiratory failure at the severe end of generalized weakness. (4) HLA-DQA1 and (5) LRP4 serological-subtyping evidence: extended sentence fragments to the full sentence naming the cohort and the antibody. (6) Rituximab: added the guideline's MuSK-myasthenia case-series sentence for the MuSK claim in the description. (7) Thymic interaction discussion: added the MIF-CD74 interactome-prediction sentence. (8) GSE233180 dataset: added the 11-patient analyzed denominator sentence. Retained after review: anti-RyR control-reactivity snippet (supports the stated specificity limitation in context), CMS genetic-testing snippet (supports the conditional testing statement), LOMG thymectomy meta-analysis snippet (supports the uncertainty stated in the treatment description and explanation), inebilizumab label indication, EOMG subtype review sentence, and the GEO record snippet for 12 recruited patients. Validated with just validate (schema, terms, 211/211 snippets).

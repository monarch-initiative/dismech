  summary: 'Create: Adult-Onset Myasthenia Gravis (MONDO:0018324)'
  details: |
    New entry for MONDO:0018324 (adult-onset myasthenia gravis, ORPHA:391490), curated on the AGE-AT-ONSET axis to complement the existing serotype-stratified Myasthenia_Gravis.yaml (MONDO:0009688). That file was deliberately NOT edited: PR #6885 is in flight on it.

    Scope decision (recorded in the entry notes and the PR body): the entry carries EOMG/LOMG/VLOMG subtypes, onset-stratified thymic pathology (tertiary-lymphoid-organ conversion of the hyperplastic thymus vs thymic atrophy), onset-stratified immunogenetics (HLA-B*08 / DRB1*03 / TNIP1 in EOMG vs TNFRSF11A / ZBTB10 and directionally reversed MHC effects in LOMG), the striational antibody profile of late onset, the divergent EOMG/LOMG incidence trajectories, and the age-bounded (MGTX, 18-65 years) thymectomy evidence. None of that exists on the parent entry. Shared serotype and effector biology is not re-derived. A CONTROVERSY discussion records the opposing continuum reading (PMID:22476514) rather than asserting the two-disorder model, and a KNOWLEDGE_GAP discussion records that the late-onset initiating event is unidentified.

    Deep research: falcon (research/Adult-Onset_Myasthenia_Gravis-deep-research-falcon.md). Its own reference-validation block reports 16/16 references resolved, confabulation_rate 0.0, 1/1 quoted claims valid, needs_review true on a single advisory off-topic flag for DOI:10.3390/jcm13010236 - a Ferrara MG incidence study that was read and not cited. The report was used as corroboration only; every snippet in this entry was quoted from a PubMed abstract fetched directly with just fetch-reference.

    NEC check: just preflight-dr returned SKIP (MONDO records no causal gene for this autoimmune class), so the manual CLAUDE.md section 2b fallback was performed. OAK confirms MONDO:0018324 is a defined class (myasthenia gravis and has-onset HP:0003581 Adult onset) with an Orphanet:391490 xref and no OMIM xref of its own; the top gene mentions in the report are MG autoantigens and susceptibility loci (LRP4, C5, AGRN, PTPN22, TNFRSF11A), and the report explicitly scopes itself away from congenital myasthenic syndromes. No drift onto CMS.

    One snippet was initially mis-stitched from line-wrapped efetch terminal output (PMID:38886398) and was caught by the reference validator, then corrected against the cached text rather than paraphrased.

    Validation actually run and read: just validate (schema + terms + references) passed; just validate-disorders passed with 83/83 snippets verified against cached references; just check-title-snippets clean (no new title-quoting snippets); just check-duplicate-keys clean; just check-term-cache-integrity clean; targeted pytest tests/test_data.py -k Adult-Onset_Myasthenia passed 16/16. The whole-suite pytest run has one unrelated failure in Travelers_Diarrhea.yaml which is pre-existing on origin/main and untouched by this branch.

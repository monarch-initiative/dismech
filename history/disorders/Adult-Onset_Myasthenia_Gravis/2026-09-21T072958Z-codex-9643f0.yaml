  summary: Review adult-onset MG mechanisms, genetic associations and antibody-specific
    care
  details: |
    Comprehensive review of the original adult-onset MG entry, the full matching falcon research narrative, citation sidecar and extracted entity table, every original cited abstract, and every available actual cached scientific body. Corrected the false equivalence between puberty and adult onset; removed all-MG and time-varying incidence bands from adult-subtype prevalence. Clinical distributions, serotypes and onset ages are separate axes. Individual ocular/bulbar signs now have specific support; selected histology, titin, striational-antibody and crisis cohorts retain their denominators and ascertainment limits. Fatigue is distinguished from fatigable weakness, and ocular generalization is not determined by limb jitter alone.

    Replaced bundled mechanisms with 18 atomic nodes distinguishing thymic chemokines/recruitment/germinal centers, thymoma-related tolerance, AChR antibody production/binding, complement injury, crosslinking/internalization, blockade, MuSK-LRP4 interaction/phosphorylation/clustering and transmission failure. Review-supported molecular synthesis is not presented as a new human perturbation experiment. Added one acute passive-transfer rat model and four non-animal experimental systems, each with measured readouts and limitations. Young female rats and engineered IgG1 switching do not model adult-onset initiation; HEK clustering does not directly measure internalization; serum blockade does not identify the responsible clone; engineered MuSK activation-loop substitutions are not patient variants. Thymic RNA velocity and MIF-CD74 inference are not lineage tracing or signaling-rescue evidence. GEO GSE233180 was independently verified through its generated per-record cache; 12 recruited versus 11 retained patients and the final 29,688-cell atlas are distinguished.

    Reworked susceptibility genetics using full 2012, 2015 and 2024 GWAS evidence and the 2022 abstract. The 2012 EOMG cohort includes adolescents; the 2015 >=60 subgroup is not replication; conditional HLA localization does not establish a unique causal allele, CD8 pathway or distinct disease. TNIP1 p.Pro151Ala function is explicitly untested; ZBTB10-adjacent protective association, suggestive older TNFRSF11A/PTPN22 results, gene-based AGRN association and computational CHRNA1/CTLA4/TBX18 nomination are accurately scoped. The 2024 European study reuses older cohorts, with self-report replication and participation-age/onset limitations. Striational antibodies remain markers rather than proven effectors of myocarditis or ordinary transmission failure.

    Expanded care from three to 26 records covering conventional immunotherapy, serotype-specific complement/FcRn/B-cell therapies, crisis and respiratory care, ocular aids, fatigue support, vaccination, reproductive planning and treatment monitoring. MGTX included adults aged 18-65 and cannot be called evidence exclusively for EOMG; onset-age and enrollment-age subgroup analyses are not interchangeable. REGAIN primary-analysis failure and mixed conventional-drug/rituximab evidence are retained. The newer inebilizumab and nipocalimab indications and trial results come from generated regulatory labels, with correct either-antibody eligibility and primary analysis populations. Seven trial summaries and live registry records were checked; trial design is not efficacy evidence. Cross-drug target citations and thymectomy-target evidence were repaired during independent peer review.

    Full bodies consumed: original PMID27509100,26562150,30918333,33458590,38505076,38886398,40022458; regenerated PMID23055271; new PMID38152089,39105625,40117520,24297891,36074148; existing full PMID39537604 independently audited through Methods/Results/Discussion. The complete general MG StatPearls chapter supports presentation/diagnosis, with outdated treatment or simplified molecular statements superseded by the guideline and primary studies. The adult-onset-specific Bookshelf baseline found no dedicated chapter. Full 2023 guideline care sections and current MG label sections were read. Its 2024 erratum was checked on the publisher site and corrects authorship plus ravulizumab day-15 dosing; no uncorrected dose schedule is reproduced. The MGTX erratum text could not be recovered and is not claim support. Unrecovered original articles and the 2025 epidemiology/special-population papers remain abstract-supported, without claims to inaccessible methods. No reference cache was hand-edited and the frozen dataset-accession blob was never accessed.

    Independent peers audited old/new genetic interpretation and the mechanism/care integration. Authoritative validate-disorders passed schema, ontology terms and 208/208 exact snippets. Dataset verification, node-class resolution, connectivity and scoped/whole-KB integrity guards were checked; a repeated-quote provenance divergence was corrected before commit. Research completeness dimensions are addressed; predictive metabolomics, viral initiation and broad veterinary comparisons remain explicitly noncentral/exploratory rather than unsupported disease-level claims.

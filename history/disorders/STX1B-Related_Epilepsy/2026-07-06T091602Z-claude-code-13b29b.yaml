  summary: 'Create: STX1B-Related Epilepsy'
  details: |
    Created STX1B-Related Epilepsy (MONDO:0014517, GEFS+9, OMIM:616172), the syntaxin-1B t-SNARE conformer completing the three core neuronal SNAREs in synaptic_vesicle_cycle (syntaxin-1B LoF -> impaired SNARE-mediated fusion -> temperature-sensitive cortical hyperexcitability -> febrile seizures/GEFS+). Reference PMID:25362483 (Schubert Nat Genet 2014, STX1B discovery, zebrafish stx1b-knockdown temperature-sensitive seizures + WT rescue). Validated: schema, terms, exact-substring snippet check (13/13). Added to grouping (SATISFIED).

  summary: Add immune-competent lung-on-a-chip severe influenza model (PMID:40987954)
  details: |
    Added an experimental_models entry for the immune-competent, microvascularized lung-on-a-chip from Nature Biomedical Engineering (PMID:40987954), with three modeled_mechanisms links. The finding worth curating is a dissociation a cytokine panel alone would not show: IL-1beta and TNF-alpha, usually grouped as pro-inflammatory drivers, act in opposite directions on the storm, with IL-1beta blockade abolishing it and TNF-alpha blockade worsening it. Links: Inflammasome Activation and Cytokine Storm (RECAPITULATES, HIGH fidelity, since chip cytokine profiles matched patient bronchoalveolar lavage), Respiratory Epithelial Infection and Cytopathic Effect (RECAPITULATES), and Endothelial Dysfunction and Thromboinflammation (MEASURES only, because the vascular compartment has no platelets or coagulation factors and so cannot model the thrombotic half of that node). Also records the fibroblast-derived CXCL12-CXCR4 axis as the dominant stromal-immune interaction. Validated: linkml-validate clean, linkml-term-validator clean, snippets verified.

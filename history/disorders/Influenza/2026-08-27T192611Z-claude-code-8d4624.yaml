  summary: 'Address PR review: rebind bronchiole and lung fibroblast terms'
  details: |
    Addresses findings 1 and 2 of the automated review on PR 9715. The IC-LOC experimental model's tissue_term carried preferred_term 'epithelium of bronchiole' bound to UBERON:0002031 (epithelium of bronchus) - a substantive anatomical mismatch, since bronchus and bronchiole are distinct levels and the model is explicitly a small-airway chip. Rebound to UBERON:0002051 (epithelium of bronchiole), verified as existing and non-obsolete via OLS before the change. The model's fibroblast cell type was bound to the generic CL:0000057 (fibroblast); since the IC-LOC's stromal compartment is lung fibroblasts and the CXCL12 finding is attributed to them, rebound to CL:0002553 (fibroblast of lung) with preferred_term updated to match. Validated: linkml-validate and linkml-term-validator clean.

  summary: Link the three obstetric exposures to the angiogenic imbalance node
  details: |
    Backfill for issue #8085. All three exposures point at the sFlt1 angiogenic imbalance node, and the spread of grades is driven entirely by how close each cited sentence gets to that node. Multiparity and multiple gestations is the best evidenced and is TRIGGERS with DIRECT: its sentence states that placental secretion of soluble FLT1 in late gestation is accentuated by multiple gestation, which names the node's own factor. Pregnancy and peripartum hemodynamic stress is also TRIGGERS with DIRECT, since the late-pregnant state constitutes the node rather than acting on it from outside, but its evidence is graded PARTIAL and the link description flags why: the cited sentence measures subclinical cardiac dysfunction against circulating sFLT1 and says nothing about volume, cardiac output, or vascular resistance, so it supports the angiogenic arm and not the hemodynamic claim the exposure is named for. That hemodynamic claim in the exposure description remains uncited and was left as it stands rather than rewritten. Preeclampsia and hypertensive disorders is graded lowest at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, because both of its sentences are about the relationship between two diseases, one reporting raised prevalence and the other asserting a shared pathogenesis without naming which mechanism, and neither measures sFlt1 or any other angiogenic factor. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 28 of 28 verified.

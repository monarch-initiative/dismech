  details: |
    Added a therapeutic_vulnerability node, Lactotroph D2 Receptor Activation Suppressing Prolactin Release, conforming to dopamine_receptor_agonism at its lactotroph node rather than its trigger, because that node is the same lactotroph prolactin-suppression step bound to the same GO, CL and UBERON terms. Pointed the existing Bromocriptine treatment at it with ACTIVATES, keeping the existing INHIBITS edge into Oxidative stress and 16-kDa prolactin generation. Also set therapeutic_modality SMALL_MOLECULE, which was unset. Review round 1: the node first carried a downstream edge into the oxidative-stress node, which was wrong. A downstream edge asserts causation, so it read as the drug producing the pathology it suppresses; the edge is removed and the node now matches the other two conformers in carrying none.

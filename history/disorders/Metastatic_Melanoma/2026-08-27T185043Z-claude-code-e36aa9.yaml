  summary: 'Respond to review: record the host-cell translational gap on the Xmrk
    melanocyte model'
  details: |
    Follow-up to the ai4c-reviewer approval on PR 9714, suggestion 2. The reviewer noted that the limitations block covered the fish origin of the Xmrk receptor but said nothing about the responding cell, and proposed setting organism to NCBITaxon:10090 plus cell_source IMMORTALIZED on the basis that PMID:12183442 carries a Mice MeSH term and is probably the melan-a murine line. That species assignment is not established by any source available here, and the reviewer conditioned it on full-text confirmation, so it was not asserted; inferring a specific organism from a MeSH term is the kind of unsourced claim this repository's evidence discipline exists to prevent. The underlying gap is real and was fixed without the species claim: limitations now records that the responding cell is a cultured melanocyte line rather than a human melanocyte in situ, and that any species difference between that host cell and human melanocytes is uncontrolled, making it a second translational gap alongside the fish receptor. Phrasing deliberately makes a claim about the model rather than about the cited source, to stay clear of the source-defect-claim class that check-source-defect-claims adjudicates. If the full text is later obtained and confirms the line, organism and cell_source can be set then. No evidence items were added or changed. Validation after the edit: linkml-validate clean, term validation passed, duplicate-key and entity-ref checks clean, snippet audit reported no failures, baseline gates reported no new defects.

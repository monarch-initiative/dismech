  summary: 'Strengthen: Long_QT_Syndrome_15'
  details: |
    Strengthened the existing CALM2/LQT15 calmodulinopathy entry against the primary literature now cached. Made Makita et al. 2014 (PMID:24917665) the primary clinical source for the D134H carrier (the same patient and substitution as D133H in the functional study PMID:41294816; Makita counts the initiator methionine) and added her as four further de novo CALM2 variants: p.Asp96Val (founding Crotti et al. 2013 proband, PMID:23388215), p.Asp130Gly (iPSC-model patient, PMID:27765793), p.Asn98Ser, p.Asn98Ile and p.Gln136Pro. Added CALM2-specific phenotypes 2:1 atrioventricular block (HP:0034305; documented in utero at 28 weeks and at birth in the D96V proband, onset ANTENATAL), T-wave alternans (HP:0012266), seizure (HP:0001250) and autism (HP:0000717); recorded the D96V proband's fetal bradycardia (HP:0001662, onset ANTENATAL) and QTc 690 ms. Wired 2:1 block and T-wave alternans from the prolonged-action-potential node through refractoriness (INDIRECT, PMID:1918714/PMID:1889452/registry), and drew the D96V proband's seizures as a sequela of her post-arrest cerebral infarction. Strengthened the impaired-CDI edges with CALM2 D96V guinea-pig myocytes (PMID:24816216) and CALM2 D130G patient iPSC-cardiomyocytes (PMID:27765793). Added per-gene registry event rate (CALM2 70%; PMID:37528649), de novo inheritance evidence, and a mexiletine treatment item (QTc shortening in the D134H carrier). No new references fetched; all seven primary sources were already cached. Validated with just validate, validate-terms, validate-disorders (201 snippets over both files, 0 issues), check-causal-targets, check-entity-refs, check-duplicate-keys, and the snippet/enum/coarse gates.

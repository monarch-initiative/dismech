  summary: 'Recheck against deep research: Long_QT_Syndrome_15'
  details: |
    Rechecked the entry against research/Long_QT_Syndrome_15-deep-research-claude_code.md (preflight-dr WARN: the second gene CALM1 is the paralogous calmodulin gene discussed as LQT14 context, not a different disease; report identity accepted). The report was used as leads only. Added: (1) Global developmental delay phenotype (HP:0001263) in the CALM2 D96V proband, drawn as a sequela of cardiac arrest (PMID:23388215); (2) a CASES_IN_LITERATURE prevalence record: 53 CALM2 carriers in the 2023 International Calmodulinopathy Registry (PMID:37528649), across all presentations; (3) an environmental entry for exertion/adrenergic triggers (ECTO:6000002) acting on polymorphic ventricular tachycardia, CALM2-specific from Makita 2014 (PMID:24917665) with the pooled CALM1-3 registry figure labelled pooled (PMID:31170290); (4) the Calm2 N98S knock-in mouse (newly fetched PMID:37589122) linked to Bradycardia (RECAPITULATES), Polymorphic Ventricular Tachycardia (PARTIALLY_RECAPITULATES) and Prolonged QT Interval (FAILS_TO_RECAPITULATE). Deliberately omitted: flecainide (the only individual flecainide response in the founding report was the CALM1 proband; registry data are pooled and give no outcome by gene; flecainide failed in the N98S mice); torsades de pointes (sources describe non-pause-dependent polymorphic VT, and the founding report states VF was not preceded by TdP); NaV1.5 late sodium current (no CALM2-specific data); the report's 13-fold calcium-affinity figure for D134H (Makita reports a 7 to 23-fold range across variants, already represented); F142L as a CALM2 variant (it is CALM1, Crotti 2013); pacing for AV block, QT-drug avoidance, electrolyte correction, genetic counselling/cascade testing and prenatal testing (generic LQTS management with no CALM2-specific source); allele-specific ASO/CRISPR silencing as a therapy (the ASO study is CALM1-only; the CALM2 D130G iPSC rescue is already cited on the variant record); single somatic mosaic case CALM2 D96G and the inherited CALM2 G114R family (single cases outside the LQTS presentation, not encoded as an inheritance mode); report's hgnc:1443 (wrong; CALM2 is hgnc:1445 per the ClinGen row). Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and validate-disorders.

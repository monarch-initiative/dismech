  summary: 'Create: Long_QT_Syndrome_15'
  details: |
    Created a standalone CALM2-related long QT syndrome 15 entry (MONDO:0014550) as a gene-specific child of Long_QT_Syndrome (has_subtypes Type 15), parallel in structure to its calmodulinopathy sibling. Curated autosomal dominant and sporadic (de novo) inheritance; a calmodulin-variant trigger node feeding impaired Cav1.2 calcium-dependent inactivation, prolonged ventricular action potential and RyR2 dysregulation, plus a Kv7.1 activation node drawn only from the CALM2 D133H study; phenotypes (prolonged QT, AV block, bradycardia, polymorphic VT, syncope, cardiac arrest, ventricular fibrillation, sudden cardiac death); the CALM2 genetic record with variants; beta-blocker, LCSD and ICD treatments; and calmodulin-gene genetic testing. Sources: Adler 2020 LQTS gene reappraisal (PMID:31983240 abstract and DOI full text), ClinGen CGGV records for CALM2 (LQTS MONDO:0002442 and CPVT MONDO:0017990, cited as evidence only, not copied into gene_disease_validity because neither is for this MONDO term), Nyegaard 2012, the CALM2 D133H functional study (PMID:41294816), a CPVT mechanisms review (PMID:32115705), the CPVT GeneReviews chapter, CardiacG2P (PMID:37872640) and the Spanish paediatric LQTS registry (PMID:42466893). Literature was limited to the existing reference cache because PubMed was unreachable; neurodevelopmental features and per-phenotype frequencies were not curated for lack of cached sources. Validated with linkml-validate, count-verified-snippets (all snippets verified offline), offline term validation (only the DiseaseTerm enum membership of the disease_term could not be checked offline because OLS was unreachable), check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms.

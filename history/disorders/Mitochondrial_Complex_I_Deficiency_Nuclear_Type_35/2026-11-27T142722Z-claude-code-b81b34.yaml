  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 35 (NDUFB10)'
  details: |
    New entry for MONDO:0033560 (OMIM 619003). NDUFB10 was confirmed as its gene from MedGen's record for the disorder (NDUFB10, gene ID 4716), because the MONDO term carries no RO:0004003 gene and has the parent 'hereditary disease' rather than the nuclear-type complex I deficiency class; its label also writes 'complex 1'. The entry name follows the OMIM title and the series, and the MONDO label is kept as a synonym; the stub stubs/Mitochondrial_Complex_1_Deficiency_Nuclear_Type_35.yaml was deleted. NDUFB10 is modelled as a structural accessory subunit of the distal membrane arm (GO:0005198, DECREASED) that is imported by the CHCHD4 disulfide relay (GO:0160203; the p.Cys107Ser allele blocks this, PMID:28040730); loss stalls late complex I assembly (GO:0032981; knockout cells lose the PD module and supercomplexes, PMID:36952351) and causes isolated complex I deficiency. Phenotypes come from the only two families: fatal neonatal lactic acidosis with cardiomyopathy (PMID:28040730) and two siblings with a deep intronic cryptic-exon variant, sensorineural hearing loss, growth delay, thumb hypoplasia, regression, apnoea and bradycardia who died in infancy (PMID:33169436, found by RNA sequencing). relationship_type UNKNOWN: two families, and ClinGen rates NDUFB10 Moderate for the lumped mitochondrial disease term. No treatment is reported. Validated: linkml-validate, term validation, reference validation (30/30 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen and gene-term checks.

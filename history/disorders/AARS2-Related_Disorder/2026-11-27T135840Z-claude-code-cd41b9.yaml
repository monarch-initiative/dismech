  summary: 'Create: AARS2-Related Disorder (COXPD8 and LKENP subtypes)'
  details: |
    New entry for AARS2-related disorder (MONDO:1060240); the stub stubs/AARS2-related_Disorder.yaml is deleted. Lump/split: one entry with two subtypes bound to MONDO's two children, COXPD8 (infantile-onset cardiomyopathy, MONDO:0013570) and LKENP (neurodegeneration with or without leukoencephalopathy, MONDO:0014387), following MONDO and the GeneReviews chapter AARS2-Related Disorder (PMID:39480987), which is tagged and used as the phenotype baseline; p.Arg592Trp occurs in both phenotypes (PMID:42362900). Mechanism chain: AARS2 loss of function (alanine-tRNA ligase activity GO:0004813 DECREASED; structural prediction PMID:25705216, PMID:21549344; protein instability of p.Arg580Trp with reduced mt-AlaRS in patient muscle and heart, PMID:30285085), reduced mitochondrial tRNA-Ala aminoacylation (GO:0070143, with a REFUTE item: tRNA-Ala fully charged in patient fibroblasts), impaired mitochondrial translation, combined complex I and IV deficiency (PMID:30285085, PMID:40863384), then muscle energy failure (COXPD8), white matter degeneration (LKENP; histology PMID:30272204; energy-failure link marked as a review's hypothesis, PMID:42650065) and ovarian follicle depletion (LKENP; Aars2 R194C knock-in mouse, PMID:41832996, lactylation mechanism recorded as the authors' proposal). Later-onset feature frequencies from a 71-patient series (PMID:42362900). Animal models: cardiomyocyte Aars2 exon 16 deletion (PMID:42010330) and R194C knock-in (PMID:41832996). Treatments: supportive care and levodopa per GeneReviews, and alanine supplementation recorded with its negative pilot-trial result (PMID:41075682). relationship_type CAUSATIVE; ClinGen Definitive is filed under mitochondrial disease (MONDO:0044970), so it is noted rather than recorded. Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (81 snippets, 0 issues), count-verified-snippets 81/81, and the entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype and folded-hyphen checks all pass.

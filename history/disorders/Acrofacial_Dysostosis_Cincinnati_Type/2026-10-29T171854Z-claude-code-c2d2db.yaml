  summary: Evidence-claim mismatch review (#15758)
  details: |
    Reviewed the Jev evidence-claim assessments for this entry against the cached references. Corrected treatment evidence that reused one quote for targets it does not mention: tracheostomy for vocal cord paralysis now cites the 2023 supplement (individual 4), and the choanal atresia and metopic craniosynostosis surgery links now quote their own repair sentences instead of the cleft-palate/strabismus sentence. Explanations that restated the whole treatment description were narrowed to what each quote supports. Added evidence for the mother's unilateral vocal cord paralysis on the Vocal Cord Paralysis phenotype, the de novo/inherited breakdown on the POLR1A germline record, the non-significant focal apoptosis in the anterior heart-field model, and healthy heterozygous knock-in mice for the limitation on the knock-in model. Retained: PERTURBS links from mouse models to the heterozygous-variant node (the models introduce the orthologous lesion; the limitations already state that they are not phenocopies); discussion notes, which are open questions and PARTIAL by design; disease-level /about/disease flags, which reflect snippets not naming the disease rather than a wrong claim.

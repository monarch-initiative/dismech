  summary: 'Review round 1: consume PMID:41010008 full text, add phenotypes, treatments,
    diagnosis'
  details: |
    Response to the automated review on PR #10509 (four blocking items, four suggestions). All four addressed; all four suggestions taken.

    The review found a factual error in this entry's own scoping rationale, and it was correct. The notes claimed the per-individual clinical detail was not in the reference cache. PMID:41010008 is cached as PMC full text (content_type: full_text_xml, 119 lines), was added by this PR, and its body carries AFDCIN-specific clinical sentences attributed to this disease alone. Several phenotypes, a treatment and the diagnostic pathway were omitted on the strength of a claim the cache contradicts. The notes paragraph now records the correction explicitly rather than being silently rewritten, because the mistaken claim shaped what got curated.

    1. Micrognathia and Malar Hypoplasia now carry a DIRECT evidence item from PMID:41010008 describing the founding cohort's craniofacial findings. The older INDIRECT items from the jointly-attributed AFDCIN-plus-Treacher-Collins sentence are kept; a second weaker source is not a defect.

    2. Five phenotypes added, all quotable from the same source: Hypertelorism (HP:0000316), External Ear Anomaly (HP:0000356), Seizure (HP:0001250), Atrial Septal Defect (HP:0001631) as a specific sibling of the coarse Abnormal heart morphology, and Hearing Impairment (HP:0000365). Hearing impairment is graded INDIRECT with an explicit description caveat: no cached source reports hearing status, and the evidence supports the ear anatomy (small malformed ears with small canals) rather than an audiogram. It is curated as an anatomically-grounded expectation and labelled as one. External ear anomaly is bound at the outer-ear level rather than to microtia, because the sources say dysplastic and malformed without stating hypoplasia.

    3. Added treatments: with the single citable item, cardiac surgical repair in one severely affected patient, plus a KNOWLEDGE_GAP discussion attached to treatments# recording why nothing else is there: every management paper filed under acrofacial dysostosis concerns Nager, Miller or Treacher Collins syndrome, and importing them would be Named Entity Confusion. The reviewer independently reached the same conclusion and warned specifically against PMID:9633164, which was not used.

    4. Added diagnosis: with exome sequencing (quotable) and a differentiation entry carrying the craniosynostosis and macrocephaly negatives that separate this disorder from the craniosynostosis syndromes. That entry deliberately carries no evidence item, and says so: the negative counts are HPO annotation tallies rather than statements in a primary paper, which is the same reason no phenotype here carries a frequency.

    Suggestions taken: mappings block for MONDO:0014651; a paragraph on genetic_context.description recording that the single LOSS_OF_FUNCTION value is a simplification, since the series mixes truncating and CNV alleles with missense alleles in a strongly missense-constrained gene; limb sub-features (short broad fingers, bowed femurs) now named in the phenotype description and evidenced, with the binding left coarse and the reason stated. The Pol I module suggestion is noted for a separate issue rather than actioned here.

    Validation: 49/49 snippets verified, up from 38. All gates pass.

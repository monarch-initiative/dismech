  details: |
    De-novo curation of acrofacial dysostosis Cincinnati type (MONDO:0014651), the POLR1A Pol I ribosomopathy.

    Deep research: one openscientist run (research/Acrofacial_Dysostosis_Cincinnati_Type-deep-research-openscientist.md, 12/12 citations resolved, confabulation_rate 0.0). just preflight-dr PASSed against MONDO:0014651 with POLR1A mentioned 39 times; it flagged TP53 as a rival gene at 31% of POLR1A mentions, which is expected here since p53 is the effector arm of the mechanism rather than a second disease entity, and the sections were read with that in mind.

    Mechanism curated as two hypothesis groups. The canonical group runs from heterozygous POLR1A variants through reduced 47S rRNA transcription, the tissue-selective vulnerability of neuroepithelium and neural crest, RPL5/RPL11 sequestration of MDM2, and p53-dependent apoptosis, to depletion of neural-crest-derived skeletal precursors. A second EMERGING group holds the p53-independent arm, which exists because genetic tp53 inhibition in polr1a-mutant zebrafish suppresses the apoptosis and only partially rescues cartilage, leaving rDNA transcription and neural crest proliferation impaired. Three animal models are curated with distinct roles: the zebrafish mutant (including a RESCUES link for the tp53 inhibition experiment), lineage-restricted mouse conditional knockouts establishing cell-autonomy in three lineages, and CRISPR knock-in of two human alleles.

    Deliberate omissions, recorded in the entry notes. No phenotype carries a frequency. The deep-research report supplies an HPO-annotation-derived frequency table with denominators (hypotonia 10/17, hypertelorism 9/16, micrognathia 9/21, and so on, with craniosynostosis 0/15), but those are counts over annotation records rather than statements in either primary paper, so no cached sentence could evidence them. The table and its source are recorded in the entry notes for a curator who later obtains the per-individual tables. Three craniofacial phenotypes (micrognathia, malar hypoplasia, cleft palate) are graded directness: INDIRECT because their only quotable source describes this disease and Treacher Collins syndrome jointly.

    Validation: just validate-disorders, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all pass. 38/38 snippets verified against cached references.

  summary: 'Create: CADASIL_Type_2'
  details: |
    New entry for HTRA1-related cerebral small vessel disease (MONDO:0014768), written as one
    entry with two subtypes: HTRA1-CSVD (heterozygous, autosomal dominant, MONDO:0014768) and
    CARASIL (biallelic, autosomal recessive, MONDO:0010829, mapped as skos:narrowMatch). The
    lump follows the GeneReviews chapter "HTRA1 Disorder" (PMID:20437615), which treats both as
    one spectrum, MONDO's placement of CARASIL as the only child of MONDO:0014768, shared autopsy
    arteriopathy in both forms, and a semidominant family (PMID:34303089). The parent grouping
    MONDO:0007432 is mapped as skos:broadMatch, matching CADASIL_Type_1. The European Academy
    of Neurology consensus describes heterozygous disease as a separate form; this is recorded
    in notes.

    Deep research: claude_code (research/CADASIL_Type_2-deep-research-claude_code.md). Its
    reference validation resolved 49/49 identifiers; the one quoted claim checked (a synonym
    phrase attributed to PMID:27164673) was not found in the abstract and was not used. Term
    validation flagged four mislabelled CURIEs (annotations written as labels) and one obsolete
    GO term (GO:0005615); none was bound. The report recommended keeping CARASIL out of the
    entry; that was not followed, for the reasons above. preflight-dr returned PASS (HTRA1
    mentioned 68 times). The GeneReviews chapter is tagged and cited for clinical
    characteristics, diagnosis, management (including smoking and high-salt diet as
    circumstances to avoid) and genetic counseling with recurrence risks.

    Additional references were found by PubMed search (HTRA1 with CARASIL/CADASIL/small
    vessel). Fetched but not cited: PMID:25116877, PMID:33313782, PMID:21482952,
    PMID:30447605 and PMID:40499346 (no cached abstract text), PMID:38466301 (no abstract),
    PMID:25770224 (correspondence; its point is covered by the TGF-beta node's REFUTE item),
    PMID:36035235 (UK Biobank, no significant HTRA1 phenotype associations),
    PMID:33963955 (genotype-phenotype review not needed for a specific claim) and
    PMID:39613464 (endothelial cell-line study overlapping PMID:42169653). Other report
    citations cached during report validation but not used were removed. Orphanet records
    were not fetched
    because the Orphadata bulk files are not present locally and disk space was limited.
    ClinGen has no HTRA1 gene-disease validity record in the local cache, so no tier is set.

    Pathophysiology: 17 nodes, each tagged with one biological scale, from HTRA1
    haploinsufficiency and dominant-negative trimer disruption to protease loss of function,
    matrisome accumulation, dysregulated TGF-beta signalling (contested direction, with a
    REFUTE item), NOTCH3 over-activation, impaired smooth muscle differentiation, medial smooth
    muscle loss, intimal thickening, elastic lamina splitting, reduced distensibility, vessel
    ectasia, wall fragility, endothelial oxidative stress, blood-brain barrier leakage, chronic
    subcortical hypoperfusion and white matter myelin loss. Uncited edges carry a description
    saying the link is inferred.

    Conformance: "Blood-Brain Barrier Leakage" conforms to
    blood_brain_barrier_breakdown#Blood-Brain Barrier Permeability Increase (human DCE-MRI
    leakage, PMID:38787758, plus mouse knockdown); "Cerebral White Matter Myelin Loss" conforms
    to cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath, which that module allows for
    secondary myelin loss when histology shows it (EAN consensus myelin pallor; rat MBP loss),
    and conformance is declared at that node only. Considered and rejected:
    aortopathy_tgfbeta_dysregulation (aorta-specific), fibrotic_response (matrisome accumulation
    here comes from failed degradation, not myofibroblast deposition), glymphatic_dysfunction
    (no HTRA1 evidence), neuroinflammation_glial_activation (not evidenced),
    corticospinal_tract_axonopathy and focal_axonal_injury_wallerian_degeneration (no
    tract-specific evidence), osteoarthritis_cartilage_degradation (spine and knee disease is
    reported clinically but no chondrocyte mechanism is shown), atherogenesis (no lipid
    mechanism), loss_of_proteostasis (intracellular scope).

    Validation: just validate passed; count-verified-snippets 176/176; check-genereviews TAGGED;
    entity refs, causal targets, logical rules, coarse phenotypes, enum values, duplicate keys,
    block-scalar comments, delivery system and qualifier terms clean; whole-tree snippet
    length, title snippets, reference titles, snippet grading, retired support prose, folded
    hyphens and environmental evidence clean; gene-activity grounding reports nothing for this
    file. 16 of 26 phenotypes are causally connected; the rest (mostly single-patient or
    psychiatric features) have no supported upstream node. validate-disorders passed.

    Review response (optional findings). The PMID:36530220 knee-pain item was
    removed from Knee Osteoarthritis, since pain does not establish joint
    degeneration; the radiograph finding in PMID:11889251 remains. The
    explanation on the wall-fragility to intracerebral-hemorrhage edge now
    says the source's statement is a hedged interpretation from one patient's
    pathology.

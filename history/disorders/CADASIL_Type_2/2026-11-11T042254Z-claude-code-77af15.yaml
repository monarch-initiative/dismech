  summary: Evidence-claim mismatch review (#16984)
  details: |
    Reviewed the Jev evidence-claim-match assessments for this entry. Most flags were on /about/disease, scoring CARASIL-specific claims against the entry's autosomal dominant MONDO label; the entry deliberately spans both ends of HTRA1 disorder with subtypes, so those were not treated as defects. Corrections: (1) Lumbar Spondylosis - the PMID:24535794 snippet was a clinical recommendation; replaced with the abstract sentence describing the CARASIL patient with a degenerated spine, noting the spinal level is unstated. (2) Apathy - the description said apathy follows gait disturbance in heterozygotes, which GeneReviews states only for mood change in general; description reworded and the HTRA1-CSVD GeneReviews sentence added with that caveat. (3) CARASIL subtype - added the NEJM 2009 background sentence stating CARASIL is a recessive, nonhypertensive small-vessel disease with alopecia and spondylosis. (4) HtrA1 L364P mouse - the description's vessel and myelin findings were supported by the paper but no evidence item quoted them; added the paper's sentences for wall hyperplasia/lumen stenosis (vascular staining), thickened intima/narrow lumen (electron microscopy) and myelin abnormality (electron microscopy), and stated both the staining and electron-microscopy vessel findings in the description. Retained: the REFUTE item on cerebral arteriopathy in the knockout (PMID:29768431), prevalence notes, inheritance evidence, and the HP:0001342 binding for microbleeds (OLS search of HP for 'microbleed' returned only HP:0430010 Microblepharia).

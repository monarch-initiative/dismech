  summary: 'Create: Trichinellosis'
  details: |
    De novo curation of MONDO:0019444 (trichinellosis), the foodborne Trichinella zoonosis. claude_code deep research (30/30 refs verified, 0% confabulation). Named clinical entity anchored to the clinical-disease MONDO (claim #18929 was on the species term MONDO:0042458; both stubs deleted). Trichinella spiralis bound as principal agent (NCBITaxon:6334), pig reservoir (NCBITaxon:9823), foodborne transmission, single-host life cycle. Mechanism: ingested encysted L1 larvae -> enteral invasion of small-intestinal epithelium (diarrhoea) -> newborn-larval systemic migration driving a type 2 eosinophilic response (eosinophilia, facial oedema, fever, headache) -> muscle invasion and nurse-cell formation (myocyte dedifferentiation/cell-cycle arrest + satellite cells, PMID:18710582) producing myalgia and raised muscle enzymes. The systemic-response node conforms_to helminth_larval_migration_type2_response#Type 2 Immune Response (module in sibling PR #18938). Phenotypes from the 5,377-case series (PMID:22172230) and the CMR review (PMID:19136437); burden PMID:24953055. Albendazole (CHEBI:16664) anthelmintic. 19/19 snippets verified; validate-disorders, terms, causal-targets, name-collisions, coarse, granularity(strict), folded-hyphens, enum-values all pass.

  details: |
    Promoted infant botulism (MONDO:0015804) out of Botulism.yaml into its own entry. Toxicoinfection mechanism (intestinal spore colonization and in-situ toxin production), honey/soil/dust sources, BIG-IV/BabyBIG first-line therapy vs equine antitoxin with aminoglycosides contraindicated, and the age/tempo axis. conforms_to neuromuscular_transmission_failure at two nodes. Sources: PMID:33956777, PMID:39138824, PMID:24924163, PMID:16452558, PMID:37429225, PMID:8331029. Deep research run failed (exit 4, environment NCBI access blocked) on both attempts; entry curated from independently verified cached references.

  summary: 'Create: Spermatogenic Failure 64 (FBXO43)'
  details: |
    New entry for SPGF64 (MONDO:0030522), biallelic FBXO43/EMI2. Curated from the four male case reports (PMID:30878252, 34595750, 42597893, abstract-only mention in 41932285), the Emi2 knockout mouse (PMID:28723571) and the Xenopus APC/C mechanism paper (PMID:24770399). The pathograph runs from loss of FBXO43 APC/C inhibition to reduced Cdk1 activity and early-diplotene prophase I arrest (truncating alleles, non-obstructive azoospermia), with a second branch to meiotic chromosome missegregation and macrozoospermia for hypomorphic missense alleles. The female FBXO43 disease (oocyte maturation defect 12, MONDO:0030523) is left to its own stub. Snippets were verified against the cached references with just validate and just count-verified-snippets. Claim issue #15121.

  summary: Review fix - requote lysosomal_storage_category evidence
  details: |
    Responds to the blocking item in the ai4c-reviewer CHANGES_REQUESTED review on PR #8610. The lysosomal_storage_category (glycoproteinosis) evidence quoted PMID:31890708 saying that the enzyme defect results in galactose oligosaccharides, galactomannans and galactolipids accumulating within cells. That sentence describes hydrolysis of terminal non-reducing alpha-D-galactose residues in alpha-galactosides, which is the alpha-galactosidase A (Fabry) reaction rather than the alpha-NAGA reaction, so the case report conflated the two enzymes; galactomannans are a plant and fungal polysaccharide and galactolipids are lipids, so the quote also named no glycopeptide or glycoprotein and therefore did not discriminate glycoproteinosis from sphingolipidosis. Requoted the same cached paper's diagnostic sentence about urine tests identifying glycopeptiduria, which names a glycopeptide and does discriminate, and rewrote the explanation to match. Kept the evidence block rather than dropping it because the disease-classification skill asks curators to cite an authoritative source whenever one genuinely states the placement. Validation - just validate passed with 19 of 19 snippets verified against cached references; just validate-terms passed; check-folded-hyphens passed; check-title-snippets and check-snippet-length report zero findings in this file.

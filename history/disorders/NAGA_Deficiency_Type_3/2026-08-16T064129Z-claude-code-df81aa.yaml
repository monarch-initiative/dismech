  summary: Add ICIMD, Harrison's and lysosomal storage classifications plus glycopeptide
    binding
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM + NEUROLOGIC, icimd_category 'glycoprotein_degradation' (ICIMD group 'Disorders of glycoprotein degradation' under category 'Disorders of complex molecule degradation'; Ferreira et al. 2021, PMID:33340416), and lysosomal_storage_category 'glycoproteinosis'. The lysosomal_storage_category carries a real evidence block quoting PMID:31890708, which names the stored material as galactose oligosaccharides and related glycoconjugates - this is what discriminates a glycoproteinosis from a sphingolipidosis or mucopolysaccharidosis, so it is a genuine evidential claim rather than a definitional mapping. The ICIMD assignment records provenance in notes only, per the disease-classification skill. Also bound the previously unbound Glycopeptiduria and oligosacchariduria biochemical entry to CHEBI:24396 (glycopeptide), matching the cited evidence which reports glycopeptiduria on urine testing; verified with OAK against sqlite:obo:chebi. Validated with 'just validate' - schema, term and reference validation all passed, 19/19 snippets verified.

  summary: Add lactic acidosis and hypotonia phenotypes
  details: |
    Searched for further NDUFB9 patient sources. The defining paper (PMID:22200994) remains abstract-only after a forced re-fetch, so its Table 2 is not quotable. PMID:33233646 (2020 review, full text cached) states that the p.Leu64Pro homozygote presented with lactic acidemia and muscular hypotonia; both added as phenotypes with that exact sentence. Lactic acidemia is a listed synonym of HP:0003128. No causal edges added: no source argues them. The Table 2 onset, lactate and course findings stay uncited leads in the open discussion. Validated with validate, count-verified-snippets, validate-terms and validate-disorders.

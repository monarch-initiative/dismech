  summary: 'Gene-family review: NDUFB9'
  details: |
    The NDUFB9 lesion node had no molecular function. NDUFB9 is an accessory membrane-arm subunit whose loss lowers both the amount and the activity of complex I, rescued by wild-type NDUFB9 (PMID:22200994); the node now binds structural molecule activity, decreased. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

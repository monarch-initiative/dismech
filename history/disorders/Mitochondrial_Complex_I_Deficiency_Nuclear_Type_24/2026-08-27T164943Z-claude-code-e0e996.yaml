  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 24'
  details: |
    De-novo creation of the MC1DN24 (NDUFB9) entry from stubs/.

    Entry-type decision: dedicated Disease entry. MONDO:0032628 records no
    descendants and a single causal gene (NDUFB9, hgnc:7704); checked against OLS and
    confirmed not obsolete, after the MONDO:0014866 obsoletion found in the sibling
    CMT2T task in this batch. Sibling per-gene entries already exist
    (Mitochondrial_Complex_I_Deficiency_Nuclear_Type_2, _12, _31), so a per-gene
    entry is the established shape.

    The defining constraint on this entry is evidence scarcity, and the entry is
    built around stating that rather than papering over it. MC1DN24 rests on ONE
    patient reported in a 152-patient screening paper (PMID:22200994), which is not
    open access; its abstract reports only the molecular and biochemical findings.
    A PubMed sweep confirmed no further NDUFB9 patient has been published in the
    fourteen years since - searches under NDUFB9 return cancer transcriptomics and
    expression-signature papers, not case reports. Europe PMC confirms the defining
    paper is not open access and has no PMC record.

    Consequences, all deliberate:
    - Exactly ONE phenotype is curated (HP:0011923 Decreased activity of
      mitochondrial complex I), because that is the only finding any accessible
      source attributes to the NDUFB9 patient. The clinical spectrum of complex I
      deficiency as a class (Leigh syndrome, leukoencephalopathy, fatal infantile
      lactic acidosis, hypertrophic cardiomyopathy, exercise intolerance) is
      explicitly NOT imported - an annotation borrowed from the class would be
      indistinguishable in the exported graph from an observed one.
    - No progression and no treatments sections, for the same reason.
    - The trigger node's genetic_context leaves zygosity UNSET: it is not reported in
      the accessible record, and inferring homozygosity from the recessive class
      would be inventing a fact. functional_impact_category is LOSS_OF_FUNCTION on
      the strength of the measured protein reduction plus the complementation rescue,
      not from a predicted variant consequence.
    - The inheritance block states explicitly that it records the mode of the disease
      class and the gene's autosomal location, not a confirmed segregation analysis
      in the index patient.

    Pathograph: 5 nodes, 5 edges, single root, every node reachable from the root
    (measured). Two nodes are marked HYPOTHETICAL with INDIRECT_UNKNOWN_INTERMEDIATES
    outgoing edges, and the reason is curated as a HUMAN_MODEL_MISMATCH discussion:
    the ACPM2-LYRM3 assembly-module account comes from Yarrowia lipolytica, whose
    complex I carries two ACPMs against the mammalian enzyme's one, and the
    respirasome-interface role is a static-structure inference from porcine cryo-EM
    with no functional measurement in any NDUFB9-deficient cell. Only two things are
    measured in the patient - reduced NDUFB9 protein, and reduced complex I amount
    and activity restored by wild-type NDUFB9 - and the entry says so.

    Conformance declared to mitochondrial_dysfunction#Bioenergetic Decline and
    Oxidative Stress at the complex I node only, consistent with the COXPD42 entry in
    the same batch. The module's own description names primary nuclear
    respiratory-chain defects as an intended substitution; its upstream age-related
    mtDNA-damage node does not apply, and its reactive-oxygen-species arm is not
    measured in this patient and is not asserted.

    Ontology note: an initial binding of GO:0005515 (protein binding) on the ACP
    module node was replaced with GO:0032981 (mitochondrial respiratory chain complex
    I assembly), which states the actual claim rather than a near-vacuous parent.

    Deep research: falcon report NEC-checked before use -> PASS (NDUFB9 = 63
    mentions, no rival gene; report cites no OMIM ID conflicting with the MONDO
    xref 618245). Its own reference_validation reported 6/6 resolved, 0
    unresolved, 0 off topic. Used as a lead source only.

    The report changed one claim in this entry and is worth recording for that.
    It extracted Table 2 of the defining paper from an image and reported
    per-patient clinical data (onset under 6 months, raised blood lactate,
    progressive course) that the abstract does not carry. None of it is curated,
    because the table is not in the reference cache and no snippet can be
    verified against it - but the entry's original claim that "no accessible
    source states the clinical phenotype" was too strong and has been corrected
    to say the data exist in a paywalled table and are therefore not quotable
    here.

    The report also contradicted itself on that table, which is recorded in the
    entry's discussion as the concrete reason not to curate second-hand table
    extraction: its summary artifact listed hypertrophic cardiomyopathy among the
    patient's supported findings, while its body twice recorded hypertrophic
    cardiomyopathy and leukodystrophy as dashes for that patient that "should not
    be entered as positive findings". Nothing in the report resolves which
    reading is right.

    Validation run in the worktree: just validate -> all validations passed;
    just count-verified-snippets -> 28/28 verified against cached references;
    just validate-terms -> passed; just validate-disorders run once before the PR;
    just check-reference-titles, check-title-snippets, check_snippet_length,
    check_folded_hyphens, check-duplicate-keys, check-cache-order and
    check-term-cache-integrity all OK. A reference_title audit confirmed all 6 cited
    reference_title values match their cache frontmatter.

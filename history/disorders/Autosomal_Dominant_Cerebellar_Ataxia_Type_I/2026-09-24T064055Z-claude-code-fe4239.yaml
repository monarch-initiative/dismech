  summary: 'Genetics pass: enumerate 15 gene-defined ADCA-I subtypes and wire all
    20 causal genes'
  details: |
    Gene-defined subtype enumeration under the ADCA-I umbrella for the genetics-gap campaign (dismech#12230, epic #12189). Sanity-checked the parent anchor first: MONDO:0019792 is the Harding clinical class this entry models and its Orphanet-derived definition matches the entry description, so the anchor is correct and no narrowMatch re-anchoring was needed. Added 15 gene-defined has_subtypes rows (SCA4, SCA12, SCA13, SCA14, SCA19-22, SCA21, SCA25, SCA27, SCA28, SCA29, SCA34, SCA35, SCA37, SCA40, CANPMR), each with a bound subtype_term, a bound hgnc gene descriptor, a sourced description and exact-quote evidence. Added 13 reciprocal genetic records with the subtype foreign key and added the FK to the two pre-existing records that now have rows (ZFHX3 to SCA4, PRKCG to SCA14). ITPR1 was bound on a pathophysiology node with no genetic record at all; that record now exists. Added four mechanism-specific pathophysiology nodes (Purkinje-cell ion channel and excitability dysfunction; Purkinje-cell calcium signaling dysfunction; mitochondrial protein quality control and RNA metabolism failure; very-long-chain fatty acid synthesis deficiency), each wired downstream from the root lesion node and upstream of Purkinje cell degeneration, and bound the remaining genes onto the existing non-polyglutamine repeat, conventional-variant and transcriptional dysregulation nodes. All 20 causal genes now reach a mechanism node. Declined one MONDO child: MONDO:0958231 (PUM1, PADDAS/NEDMSF) is a de novo developmental syndrome whose own definition makes no ADCA-I claim, and the PUM1 ataxia phenotype is the separate milder PRCA that MONDO curates as SCA47 under MONDO:0020380; the reasoning is recorded in notes and a stub was nominated instead. SCA35/TGM6 is curated with the MONDO gene assignment plus two REFUTE evidence items, because two population-genetic studies argue against TGM6 causation and ClinGen has no record for the gene. Validated with just validate, just validate-terms, just count-verified-snippets (152/152), just list-gene-term-mismatches, the offline gates and just validate-disorders.

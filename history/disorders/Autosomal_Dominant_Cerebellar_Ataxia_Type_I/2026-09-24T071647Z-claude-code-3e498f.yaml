  summary: 'Review round 1: split the bundled mitochondrial node; move PRKCG/ITPR1
    to the calcium node'
  details: |
    Review round 1 on PR #12656. Addressed the reviewer's item 2: the Mitochondrial Protein Quality Control and RNA Metabolism Failure node bundled two mechanisms that share an organelle but not a pathway, so it was split into Mitochondrial m-AAA Protease Failure (AFG3L2, GO:0006515) and Mitochondrial RNA Metabolism Failure (PNPT1, GO:0000958), each with its own evidence and its own downstream edges; the root lesion node's single downstream edge was replaced by two, and the AFG3L2 and PNPT1 genetic notes were updated so they no longer name a node that has been dissolved. Added PMID:37935417 as independent human evidence for the SCA25 sensory neuropathy edge. Took suggestion B: PRKCG and ITPR1 were carried on both the conventional-variant node and the new calcium node, so they were removed from the conventional-variant node along with the PKC-gamma snippet and the calcium ion homeostasis GO binding, all of which moved to the Purkinje-cell calcium signaling node together with that node's Purkinje cell type and cerebellar cortex location. The conventional-variant node now carries only the three subtypes whose molecular mechanism is not established (TMEM240, TGM6, CCDC88C), its description says so, and its downstream Purkinje edge is re-evidenced from a TMEM240 source rather than the calcium review. All 20 causal genes still reach a mechanism node and all 7 phenotypes remain causally connected.

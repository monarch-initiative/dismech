  details: |
    Round 2 on PR #12656, pushed after approval because a companion fix on the Pontocerebellar Hypoplasia entry corrects a claim that no cited paper supported, rather than a stylistic point. Self-review of the round-1 edits found four prose claims that no cited snippet supported; this record covers the ADCA-I one. The Mitochondrial RNA Metabolism Failure node, created in round 1 when the bundled AFG3L2/PNPT1 node was split on the reviewer's finding, states in its name and description that PNPT1 acts in mitochondrial RNA metabolism. Neither source cited on that node uses the word mitochondrial: PMID:39899068 names PNPT1 and its S1 RNA-binding domain but not the organelle, and PMID:37935417 mentions mitochondrial disease only as the gene panel the variant was found on. PMID:23084291, already present in this repository from an unrelated curation PR and byte-identical after refetch, established the mitochondrial RNA-import role, and its rescue-experiment sentence is now cited on the node. The explanation on that item records that the paper describes a separate recessive respiratory-chain disease and is cited for the gene's function rather than for the SCA25 phenotype, so a reader does not take it as phenotype evidence. No other content changed on this entry; all 20 causal genes still reach a mechanism node and all 7 phenotypes remain causally connected.

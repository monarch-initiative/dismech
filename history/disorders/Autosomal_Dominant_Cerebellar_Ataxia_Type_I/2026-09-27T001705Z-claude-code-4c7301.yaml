  summary: 'Correct the PUM1/SCA47 note: PRCA ruled out by PMID:40191983'
  details: |
    The entry's notes stated that PRCA (spinocerebellar ataxia 47, MONDO:0033482) rather than PADDAS is the PUM1 ataxia phenotype. PMID:40191983 (Cuillerier et al., Care4Rare Canada, 2025) re-examined the single family that concept rested on, found a pathogenic FGF14 GAA intronic expansion segregating with disease and absent from the reportedly non-penetrant relative, and concluded that this rules out the PUM1 missense variant as causative; OMIM reclassified it to a VUS. The note is rewritten to record the withdrawal and to say PADDAS is curated as its own entry. Found while curating MONDO:0958231; no other part of this entry references SCA47.

  summary: 'Create: Monoclonal Mast Cell Activation Syndrome'
  details: |
    De novo curation of monoclonal mast cell activation syndrome (MONDO:0033954) as a Disease entry. entry_type DISEASE, and the decision was already half-made in the repository: kb/groupings/Mastocytosis.yaml states in its grouping_rationale that MMAS 'carries a clonal KIT D816V mast cell population but does not meet the mast cell burden that the proliferation and mastocytosis-finding operands require', and its NECESSARY_AND_SUFFICIENT criteria deliberately exclude it. So the KB had already ruled MMAS is not a mastocytosis and is not a member of that grouping, which is the argument for a separate entry rather than a has_subtypes line on Systemic_Mastocytosis.

    Process error worth recording: my first coverage check for mastocytosis in the KB used git grep piped through head, on an alphabetical file list, and I concluded from the truncated output that only Maculopapular_Cutaneous_Mastocytosis existed. Systemic_Mastocytosis.yaml and kb/groupings/Mastocytosis.yaml both exist and both bear directly on this lump/split call. Caught before writing YAML, but the near-miss was a truncated grep, not a hard question.

    Deep research: one openscientist run (research/Monoclonal_Mast_Cell_Activation_Syndrome-deep-research-openscientist.md, 23 citations). It shipped with no reference_validation or term_validation block, term validation having aborted on a 5-second EBI OLS read timeout on HP:0002018; this is dismech#10396 and four of the five runs in this batch failed the same way. The retro-fitted reference section is the cleanest of the five: 23/23 references resolved, 22 of 22 quoted claims found in source, 21 of 23 on topic, none off topic.

    Used from the report: PMID:20434205 (the 83-patient cohort that defines the clonality criteria and shows the clonal-but-not-SM group is three of eighty-three), PMID:34298172 (KIT prevalence and diagnostic relevance in MCAS), PMID:35623575 (ECNM-AIM ICD-10-CM classification and the delineation between confirmed MCAS and MCAD not fulfilling MCAS criteria), PMID:28740494 (anaphylaxis prevalence in clonal mast cell disease, underdiagnosis without skin lesions, bone marrow study requirement), PMID:34545185 (2021 refined bone marrow mastocytosis criteria, cited on the moving boundary), PMID:30948489 (D816V-KIT constitutive signalling through STAT5 and PI3K via JAK2 and MEK/ERK1/2, and persistent IL-6 production), and PMID:21035176 (the 2010 MCAS criteria proposal, cited both for the lowered-threshold hypothesis and for its own statement that MCAS is not generally accepted as a distinct entity).

    Evidence-grading decisions. Five items are graded directness INDIRECT with the reason stated in each explanation, mostly because the source cohort is systemic mastocytosis or bone marrow mastocytosis rather than MMAS and the shared driver or the adjacent threshold is what is being relied on. Three items use evidence_source OTHER because the 2010 criteria paper is expert consensus reasoning about a then-hypothetical disease class rather than a data report; the lowered-threshold node in particular is supported only by that consensus-conference conjecture, and both the node description and a KNOWLEDGE_GAP discussion say so.

    One evidence item was dropped rather than defended: a quote from PMID:28262030 that was the paper's title and would not verify because I had not fetched that reference. The claim it supported (assay sensitivity matters because the clone is small) follows from the definition, and the treatment description now says that rather than citing a source for it.

    Schema note: I initially wrote a pathophysiology downstream target pointing at 'Elevated total serum tryptase', which is a biochemical entry name and not a pathograph node, so check-causal-targets flagged it as a dangling target. Replaced with the documented pattern: a readouts block on the biochemical entry with target Systemic Mast Cell Mediator Release and relationship READOUT_OF.

    Three knowledge gaps recorded, all about the stability of the concept rather than about its mechanism: how much of MMAS the 2021 refined bone marrow mastocytosis criteria have absorbed and whether a distinct population remains; whether a lowered mast cell activation threshold has ever been measured in these patients rather than inferred, with the competing account that mediator output simply scales with clone size; and whether MCAS as a category is established enough for its monoclonal subset to be a stable disease concept. prevalence_class is UNKNOWN deliberately: only a proportion within a highly selected referred cohort exists, and it predates the criteria change.

    Validation: just validate passes; 24/24 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading and check-title-snippets all pass.

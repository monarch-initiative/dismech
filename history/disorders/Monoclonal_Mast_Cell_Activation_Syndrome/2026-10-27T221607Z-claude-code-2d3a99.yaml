  summary: Bind the H1 and H2 agents and wire the H1 component to the H1 receptor
    antagonism module
  details: |
    The Anti-mediator Therapy treatment bound no therapeutic agent at all, so none of the drug classes its description names was machine-readable. NCIT:C29578 Histamine-1 Receptor Antagonist and NCIT:C29702 Histamine-2 Receptor Antagonist are now bound, supported by the treatment's existing citation, whose snippet reads 'anti-mediator therapy including H(1) and H(2)histamine receptor antagonists, anti-leukotrienes, or mast cell stabilizers'.

    The treatment itself is deliberately left whole rather than split by class. The snippet above is a diagnostic criterion: response to the bundle is one of the criteria for this disease, and the source states the bundle rather than any one class, so splitting it would break the claim the citation actually makes. The anti-leukotrienes and mast cell stabilisers the same sentence names are not bound here, because this pass was about the histamine receptor classes; binding them is a reasonable follow-up.

    An Antihistamine Occupancy of H1 Receptors node was added as a therapeutic_vulnerability conforming to h1_receptor_antagonism, and the treatment reaches it through a second target_mechanisms item with treatment_effect ACTIVATES; the pre-existing link to the systemic mediator release node is unchanged. The node carries no downstream edge, since the relation between an antagonist and the mediator release it blocks is inhibitory. No location is bound, as the H1-mediated symptoms are multisystem.

    The H2 component is deliberately not wired, because the h2_receptor_antagonism module is scoped to gastric acid secretion and this entry does not establish that pathway.

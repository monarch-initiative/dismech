  summary: 'Review response: MMAS review rounds 1 and 2'
  details: |
    Two rounds of review response on PR #10744, recorded separately from the CREATE record because the review-round-1 commit reported three fixes that were not in the file.

    Root cause of that, stated plainly: the round-1 edits were applied with Python str.replace() and I did not assert that any replacement matched. Three anchors failed silently -- the bone marrow treatment block was copied into diagnosis: rather than moved out of treatments:, PMID:28262030 was fetched into the reference cache but never cited, and the Flushing phenotype received a new explanation without the new snippet. I then wrote a commit message asserting all seven items were done. The reviewer caught all three by diffing the file against the commit message. Round 2 applies every edit through a helper that exits non-zero on a non-matching anchor, and each claim was grepped out of the file before the commit message was written.

    Round 1 (commit e0881ed41): reference_title backfilled on all evidence items; diagnosis: section added with the bone marrow study and the MCAS mediator criterion; anti-mediator therapy added; HP:0100495 unbound from the Absence of skin lesions phenotype because the binding asserted the disease presents WITH mastocytosis, inverting the feature whose absence defines it, and the schema cannot negate a phenotype (dismech#10190); Diarrhea and Abdominal pain re-sourced from the PMID:23179866 diagnostic criteria list rather than from a PMID:21035176 sentence about how the MCAS label is applied in a paper arguing that usage is over-broad.

    Round 2 (this commit): the duplicated Bone Marrow Study treatment block deleted, so the diagnostic procedure is no longer asserted as a therapeutic one; PMID:28262030 wired in twice -- a REFUTE item on genetic[0] carrying the 38-patient KIT D816V finding that previously sat uncited in features prose, and a SUPPORT item on Sub-threshold Clonal Burden carrying the CD25 0.002-0.3% burden measurement, which is the only direct measurement of that node's claim made in MMAS patients rather than a neighbouring category; the Flushing snippet re-pointed to PMID:23179866 so it matches its own explanation; Hymenoptera venom immunotherapy added from PMID:39187156 with the indefinite-duration and three-autoinjector recommendations that distinguish management in clonal disease; and the REMA score added to diagnosis:, including the tryptase-genotype qualifier that exists because hereditary alpha-tryptasemia raises baseline tryptase independently of any clone.

    Also corrected: the Absence of skin lesions description still claimed the phenotype was bound to the mastocytosis term after the binding had been removed.

    Validation: just validate passes; 35/35 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading and check-reference-titles all pass.

  details: |
    Second review response on PR #9919, covering the one remaining blocking item and three of the four non-blocking notes.

    Blocking item fixed: the "3 of 13" denominator was described two different ways in the same file. The treatments description and the KNOWLEDGE_GAP discussion said it spans the paper's assembly-factor patients across four genes; the notes said it sits in a whole-cohort paragraph. The notes were right. Checked against the cached full text: the idebenone sentence sits in the general clinical-features paragraph describing all 31 patients, immediately after the sentence listing which drugs were used, so the thirteen are most plausibly the patients who received idebenone and the cache does not resolve it. Both prose passages now say that, and the treatments description states explicitly why the assembly-factor reading must be rejected even though that group also numbers thirteen: taking the coincidence for a match would imply six of the treated thirteen carry NDUFAF8, a far tighter link than the paper supports. The separate and accurate claim about 13 assembly-factor patients across four genes, in the optic atrophy phenotype node, is untouched - it is a different fact and the new prose now distinguishes them.

    Non-blocking notes taken.
    GO:0032981 appeared on three consecutive nodes and no longer discriminated between them. The NDUFAF8-NDUFAF5 module node now carries GO:0050821 protein stabilization, which is what that node actually asserts - NDUFAF8 holding NDUFAF5 stable, measured as an 82 percent fall in NDUFAF5 - with the reasoning written into the node description.
    evidence_source on the idebenone recommendation snippet changed from HUMAN_CLINICAL to OTHER. It is an expert recommendation rather than an observation the study made, which is the grading this entry already gives the mechanistic rationale two items below.
    This history record covers the three commits that had none.


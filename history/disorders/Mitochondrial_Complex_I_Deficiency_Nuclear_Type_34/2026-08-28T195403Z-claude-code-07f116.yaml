  summary: 'Review response: idebenone treatment, GeneReviews tag, fourth patient,
    TIMMDC1 cross-reference'
  details: |
    Review response on PR #9919, plus items raised by the automated research comment on issue #9901.

    Blocking review items fixed.
    1. The absolute "no treatment reported" claim was wrong. PMID:41234160, which this entry already cites as full text, recommends idebenone at LHON dosing for nuclear complex I optic neuropathy. Added a treatments block for it, with the paper's own qualification attached as PARTIAL evidence: visual improvement was variable and only 3 of 13 patients responded, and that denominator spans the cohort's four assembly-factor genes rather than the NDUFAF8 patients. The KNOWLEDGE_GAP discussion and the notes were rewritten so they no longer assert an absolute absence; what is genuinely absent is any outcome attributable to this genotype. The treatment's indication, optic atrophy, is already a curated phenotype in the same entry.
    2. GeneReviews PMID:26425749 (Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview) added to the top-level references with the GeneReviews tag, plus a note explaining it is deliberately not cited as evidence because its cached record carries only the chapter's statement of purpose. This follows MC1DN2 and MC1DN6, both of which tag it.

    Non-blocking suggestions taken.
    3. GO:0005515 protein binding removed from the NDUFAF8-NDUFAF5 module node; the node keeps its GO:0032981 complex I assembly process term, which carries the claim without an uninformative binding annotation.
    4. PMID:37159021 was titled but uncited; it now carries two PARTIAL evidence items on the abundance node covering the two-step import route and the YME1L/CLPP protease surveillance, each explained as cell-line work on wild-type NDUFAF8 that does not involve the patient allele.
    5. Added the quotable subacute-onset sentence to the optic atrophy phenotype, with a note that its twelve cases span five genes rather than being twelve NDUFAF8 patients.

    Items from the research comment on issue #9901.
    6. PMID:39921456 (Gaignard 2025) reports a fourth Leigh-syndrome patient. Added to references and cited in prevalence; the patient count throughout the entry moves from nine to ten. That patient also carried a mitochondrial-DNA variant in a complex I subunit gene, recorded in the genetic notes as a caution that a single-gene answer in this class is not automatically the whole answer.
    7. Cross-reference added to Mitochondrial_Complex_I_Deficiency_Nuclear_Type_31: its recurrent TIMMDC1 c.597-1340A>G is the other deep-intronic lesion among the nuclear complex I diseases curated here, and the pair is the practical reason this entry's diagnosis section recommends examining intronic sequence.
    8. Subject 3's normal blood lactate (1.44 mmol/L with CSF lactate 3 mmol/L) recorded as an uncited lead in the biochemical notes. It is the finding most likely to stop a clinician suspecting mitochondrial disease, and the same caution is curated in the TIMMDC1 sibling entry.
    9. parents changed from [hereditary disease, Mitochondrial Disease] to [Mitochondrial Complex I Deficiency, Mitochondrial Disease], following Type 31, which the research comment identifies as the better model among inconsistent siblings.

    Not done: PMID:41898833, the 2026 Goldenhar syndrome exome paper reporting a rare NDUFAF8 frameshift with limited segregation, is deliberately not cited. It is a candidate-gene list that did not establish causality, and it is not evidence about this disease.


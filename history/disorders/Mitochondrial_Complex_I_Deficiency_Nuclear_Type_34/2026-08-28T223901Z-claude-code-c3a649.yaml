  details: |
    Fourth review response on PR #9919. A second review at 22:32Z superseded the 22:10Z approval on the same commit, and its single blocking finding was correct.

    Five evidence items citing PMID:41234160 were graded HUMAN_CLINICAL while describing in-silico or cultured-cell work. Both provenance claims were checked against the cached full text before changing anything.

    Two items quote the sentence predicting that the p.L15R change affects the mitochondrial targeting sequence. The paper's methods say "Mitochondrial targeting sequences (MTS) were identified using MTSviewer and variants reported in the 3D structure predicted by AF3", with delta-delta-G from DynaMut2 and DUET. That is an in-silico prediction and no patient was measured to produce it, so both are now COMPUTATIONAL. The sentence is used twice - on the abundance node and in the HUMAN_MODEL_MISMATCH discussion - and both uses carry the same value, so the same-sentence grading rule still holds.

    Three items quote the TMT proteomics results: NDUFAF8 not detected in the batch, the NDUFAF5 fold change of 0.18, and the complex I fold change of 0.73. The sentence immediately preceding them in the paper is "we performed quantitative proteomics on fibroblasts derived from individual II-4 in a batch of 11 samples". Cultured cells are IN_VITRO, and all three are now graded that way.

    The decisive argument was internal consistency, not the classification rule in the abstract. The same file already grades PMID:31866046's fibroblast complexome profiling and enzymology IN_VITRO in seven places and PMID:37159021's cell work IN_VITRO in three, so the entry was saying fibroblast measurements are IN_VITRO when they come from the 2020 paper and HUMAN_CLINICAL when they come from the 2026 one. Both cannot be right.

    Each of the five explanations now records why the value is what it is, so the reasoning sits next to the field rather than only in a PR comment. No snippet, claim or supports grade moved.

    Audited the whole reference afterwards rather than only the five: of 23 items citing PMID:41234160, the split is now 15 HUMAN_CLINICAL, 3 OTHER, 3 IN_VITRO, 2 COMPUTATIONAL. The 18 untouched items are clinical course, optic atrophy findings, cohort composition, the idebenone recommendation and its mechanistic rationale, which are correctly graded.

    Worth recording why no gate caught this: check-snippet-grading keys on the same sentence graded two different ways. These are five different sentences and the MTS snippet was consistently mis-graded across both of its uses, so the check passed. This class of error needs a human read of what the cited experiment actually was.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 47/47 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. Render test passes. No cache diff.

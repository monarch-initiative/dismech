  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 34 (NDUFAF8)'
  details: |
    De novo curation of MC1DN34 (MONDO:0032910, NDUFAF8 / hgnc:33551) as a standalone kb/disorders Disease entry.

    entry_type decision: DISEASE. One causal gene, no MONDO descendants, a single conserved pathograph (assembly-factor loss -> stalled early complex I assembly -> isolated complex I deficiency), and five sibling "mitochondrial complex I deficiency, nuclear type N" entries already curated as standalone Disease entries. Curated to match the shape of Mitochondrial_Complex_I_Deficiency_Nuclear_Type_24, including its convention of recording full-text-only facts as explicitly labelled uncited leads rather than as evidence.

    Sources: PMID:31866046 (Alston 2020, defining Leigh-syndrome cohort; abstract_only in cache), PMID:41234160 (2026 Brain series associating NDUFAF8 with recessive optic atrophy / arLHON; full text), PMID:37159021 (Peker 2023, two-step NDUFAF8 import pathway; full text), PMID:27499296 (C17orf89 validated as a complex I assembly factor), PMID:22972949 (class-level context).

    Scope call: the 2020 Leigh cohort and the 2026 optic-atrophy cohort are curated as one gene-defined entity, not two. They share the recurrent deep-intronic allele c.195+271C>T, and the deep-research report (which read the full text of the 2020 paper) records optic atrophy, visual impairment, small optic nerves and nystagmus among the 2020 subjects, so the optic nerve is involved at both ends of the severity range rather than defining one end of it.

    Deliberate omissions: no treatments block (none reported anywhere, including in full text) and no progression block (reported in the 2020 full text but not snippet-verifiable from the abstract-only cached record). The distinction between those two kinds of absence is recorded in an open KNOWLEDGE_GAP discussion together with the uncited outcome values.

    Discussions: OPEN_QUESTION on what determines how far beyond the optic nerve the disease extends; HUMAN_MODEL_MISMATCH on the untested relation between the cell-line two-step import pathway and the patient targeting-sequence allele p.(L15R); KNOWLEDGE_GAP on treatment and natural history.

    Deep research: falcon. NEC preflight WARN with the gene clearly dominant (NDUFAF8=61, next gene NDUFAF5=10); the sole warning is that the report cites OMIM 256000, Leigh syndrome, the parent phenotype, rather than 618776 for this entity. Report and citations sidecar committed under research/.

    Validation: just validate exit 0; just validate-terms exit 0; 37/37 snippets verified; check-entity-refs and check-duplicate-keys exit 0.

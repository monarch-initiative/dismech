  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #12186. Three blocking findings, all taken.

    Finding 2 (structure) reversed the lump/split decision made in the CREATE record for this entry. The original entry was a single umbrella named Usmani-Riazuddin Syndrome, anchored on MONDO:0859174, carrying the dominant and recessive forms as has_subtypes rows. The reviewer's argument is correct and I had missed it: MONDO:0859174 and MONDO:0859196 are SIBLINGS, both directly under MONDO:0003847 with no umbrella term, so the recessive form cannot be a subtype of an entry whose own disease_term is the dominant term - and the entry's own notes said as much, contradicting its own structure. The first subtype row also duplicated the parent disease_term, which asserts the disease is a subtype of itself. Took the reviewer's route 1: the entry is now AD-only and renamed to kb/disorders/Usmani-Riazuddin_Syndrome_Autosomal_Dominant.yaml, matching the scope of claim issue #12177 and the name the original stub proposed. Both has_subtypes rows removed, the autosomal recessive inheritance block and the biallelic genetic row removed, and MONDO:0859196 nominated as stubs/Usmani-Riazuddin_Syndrome_Autosomal_Recessive.yaml so it stays visibly uncurated rather than being counted as covered by a hollow subtype row.

    The CREATE history record for this entry was moved into the new slug directory and its target.slug and target.path updated in place. It was created in this same unmerged PR and has never been on main, so this is a correction inside the PR rather than a rewrite of merged provenance; no superseded_by block was added, because there is no merged predecessor record to supersede.

    The OPEN_QUESTION discussion ad_ar_one_entity was rewritten rather than deleted. The biological argument for one entity is unchanged and still worth recording - one founding cohort, a published statement of overlapping clinical features, convergence on one complex - but the entry now records that the two are curated separately for a structural reason, and states what merging them would require: a new umbrella MONDO term or a mappings.mondo_mappings anchor, plus a real curation pass over the recessive form. Its attaches_to refs were repointed from has_subtypes# to disease# and genetic#.

    Finding 1 (deep research) ran the research-disorder recipe with the claude_code provider. Report and citations sidecar committed, along with the two reference-cache files the report cites that the entry does not (PMID:10811610 and the Clin Genet DOI record). The preflight-dr recipe returns PASS against MONDO:0859174; the report's own reference validation is 11 of 11 verified with a 0.0 confabulation rate. Reconciling it against the entry added two mouse models the entry had missed - PMID:10026148, the gamma-adaptin null whose heterozygote measures AP-1 complex abundance at half of controls, which is the direct molecular content of the haploinsufficiency claim, and PMID:27090238, the fgt hypomorph, the only mammalian partial-function model surviving past embryogenesis - plus three phenotypes (hyperactivity, hearing impairment, abnormal vertebral morphology) and an extra background evidence item on the AP-1 complex node. Hyperactivity was wired into the pathograph; hearing impairment and vertebral morphology were left unconnected with the reason stated in their descriptions, alongside facial shape and limb abnormality.

    Two deep-research claims were deliberately NOT taken up, and this is recorded in the entry notes: the gnomAD constraint figures (pLI 1.0, LOEUF 0.2) and a neonatal death in the founding cohort. Both are attributed by the report to PMID:34102099, whose cached record is abstract-only and contains neither string, so neither is quotable and neither is asserted. Reconciliation also caught a defect of my own: the clinical_burden rationale asserted that no mortality data have been published, an absence I had never searched. It now says only that survival is not characterized in the abstract-level sources cited here.

    Finding 3 (references) added the top-level references block with all seven cited PMIDs, each title copied from its references_cache frontmatter, tags set to the empty list because no GeneReviews chapter exists, and one Finding statement per reference.

    Also bundled: phenotype frequency values changed from the free-text band to the enum form VERY_FREQUENT, matching the dominant KB convention (4,536 uses against 42 of the free-text form). Same band, same evidence. The reviewer had explicitly cleared these as correctly sourced, so this is convention alignment, not a correction.

    Validation run before pushing: validate, validate-terms, count-verified-snippets at 81 of 81, validate-disorders, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-case-collisions, check-stubs, validate-stubs, check-reference-titles, check-genereviews, list-gene-term-mismatches, list-disconnected-phenotypes, validate-history-all, normalize-cache.

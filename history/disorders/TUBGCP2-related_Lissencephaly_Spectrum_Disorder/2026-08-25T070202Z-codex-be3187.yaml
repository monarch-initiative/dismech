    Ontology and content adjudication
    ---------------------------------
    OLS4 was consulted against the authoritative MONDO 2026-08-04 release.
    MONDO:0032893 was active and non-obsolete, with no replacement, and its exact
    label was "pachygyria, microcephaly, developmental delay, and dysmorphic
    facies, with or without seizures". The term validator generated exactly one
    sorted MONDO term-cache row and one sorted DiseaseTerm enum-membership row;
    no generated cache was hand-edited.

    The review separated the p.Glu311Lys computational GCP2-GCP3 interface
    prediction from the IN_VITRO patient-fibroblast localization findings. It
    did not assert a measured decrease in microtubule nucleation. The pan-allelic
    trigger remains functional-impact UNKNOWN and omits zygosity because the
    reported disease configurations include homozygous, compound-heterozygous,
    and hemizygous-by-deletion states and the schema has no generic biallelic
    zygosity value. No loss-of-function or dominant-negative mechanism was
    generalized across the mixed allele series.

    Neuronal migration is HYPOTHETICAL, PARTIAL, imaging-inferred, and connected
    through unknown intermediates rather than presented as measured. The
    zebrafish and Drosophila models are separate LOW-fidelity depletion/null
    models. Increased zebrafish pH3-positive cell abundance is recorded as a
    direction-neutral altered mitotic state because the source cannot distinguish
    mitotic arrest from over-proliferation. Neither animal model is linked to
    neuronal migration, lissencephaly, or measured microtubule nucleation.

    Frequency bands are scoped to the eight-person PMID:40017707 review:
    pachygyria, microcephaly, and global developmental delay are OBLIGATE (8/8);
    seizures and broad dysmorphic facial features are VERY_FREQUENT (7/8); thin
    corpus callosum is FREQUENT (6/8); cerebellar volume loss is FREQUENT (3/8);
    and subcortical band heterotopia, subependymal cysts, brainstem hypoplasia,
    and cerebral white-matter abnormality are OCCASIONAL (2/8). Broad 7/8 facial
    dysmorphism is mapped to HP:0001999 rather than the narrower 4/7 narrow
    forehead finding. Later reports extend the phenotype but are excluded from
    this denominator. Hypotonia and spasticity were split and supported by exact
    patient-level examination text; EEG abnormality remains an observational
    readout of seizures rather than a causal phenotype edge.

    GeneReviews NBK350554 does not mention TUBGCP2. Its seizure and rehabilitation
    guidance is therefore PARTIAL, OTHER-source phenotype extrapolation.
    Counseling records only the source-supported recessive inheritance and does
    not add an uncited numerical recurrence risk or carrier-testing outcome.
    The nonsignificant L-serine fibroblast result remains a model finding and
    open discussion, not a treatment.


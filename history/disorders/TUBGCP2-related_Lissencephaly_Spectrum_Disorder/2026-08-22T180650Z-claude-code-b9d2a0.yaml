  summary: 'Create: TUBGCP2-related Lissencephaly Spectrum Disorder'
  details: |
    Curated during a QA pass over the tubulin-family tranche as the last tubulin-family gene with a published, replicated gene-disease relationship and no DisMech entry. Biallelic TUBGCP2 (GCP2, gamma-tubulin ring complex) disease: disrupted GCP2:GCP3 interface -> impaired microtubule nucleation -> neuronal migration failure -> lissencephaly spectrum cortical malformation, conforming to all three nodes of microtubule_dependent_neuronal_migration_failure. No disease_term: MONDO has no disease concept for TUBGCP2, only the gene (HGNC:18599). functional_impact_category deliberately left UNKNOWN with a KNOWLEDGE_GAP discussion, because the allele spectrum mixes unambiguous null alleles with a missense allele that leaves GCP2 protein levels normal. A second KNOWLEDGE_GAP records the thin-vs-thick corpus callosum divergence reported in 2025. Added as a member of the Lissencephaly and Neuronal Migration Disorders grouping but deliberately NOT of Tubulinopathies, whose scope is tubulin-encoding genes; the lumping boundary is recorded in both files. Sources: PMID:31630790, PMID:33458610, PMID:40017707, PMID:40448381, PMID:42472988. Validated: schema OK, term validation OK, 27/27 snippets verified against cached references, weighted compliance 86.8 percent.

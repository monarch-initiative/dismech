  summary: Review GIPC3 hearing loss against human families and full-text experimental studies
  details: 'Eligibility: reviewed the existing CREATE and EDIT records on main 990da2d68103; no REVIEW
    was present. This is a Mendelian hearing-loss disorder, within the sweep excluding infectious
    and environmental disease. The open-PR search returned a MYO6 entry without file overlap. The
    worktree started from freshly fetched main.


    Source consumption: read the matching Perplexity report and citations and compared its claims
    with the entry and primary literature. The report''s proposed ontology IDs include unrelated
    terms and were not copied. Its statements that human progression and late mouse degeneration
    have not occurred conflict with the 2011 primary report. Read the full scientific body, human
    pedigrees, electrophysiology, protein-abundance experiments, transgenic rescue and methods in
    PMID:21326233; the full family/linkage report and Table 1 in PMID:21660509; and the clinical
    results, discussion and tables in PMID:34071867. Read the 2023 knockout report PMID:37096733,
    including cuticular plate/junction development, MYO6/MYO18A binding, proteomics, calcium/MET
    recording methods and limitations. This distinguishes binding assays from the proposed mechanical
    force-coupling model. Its PXD006240 dataset is normal developmental proteomics context, not a
    GIPC3 patient or perturbation dataset; no disease-specific dataset claim was added.


    Recovered the complete 2016 Ohn calcium-active-zone study (PMID:27462107) through the generated
    PMC4987782 URL cache and read its scientific body, supplemental figures and methods. The experiments
    use the Black Swiss Gly115Arg allele and C57BL/6 comparison animals, not the 2023 knockout. Recorded
    hyperpolarized calcium activation, increased exocytosis and spontaneous auditory-nerve activity
    with explicit model limits. Normal BK currents at P14-16 qualify the earlier P12 potassium-current
    finding; unchanged calcium currents in the younger P8-12 knockout are retained as counterevidence
    to universalization. The work does not establish direct GIPC3-CaV1.3 binding or a resolved trafficking
    mechanism. Sound-transduction defects confound interpretation of sound responses; adapted firing
    and recovery were preserved.


    The generated PMID:40658338 cache was truncated midway through results. Recovered the complete
    2025 study through the DOI PDF cache and PMC12511236 URL cache, then consumed methods, results,
    figure legends, discussion and limitations. Despite its mutation-oriented title, it tests siRNA
    in HEI-OC1 cells and neonatal P3 mouse cochlear explants, with and without tert-butyl hydroperoxide.
    Separate provisional nodes describe autophagy-marker changes, increased ROS and JC-1 depolarization.
    Static LC3B/p62 measurements are not selective mitophagic-flux proof; APPL1 colocalization and
    abundance do not prove direct interaction or causal mediation in auditory cells. No in vivo mutant,
    patient variant or hearing rescue was tested. The 2017 BRCA2/GIPC3 paper PMID:29021281 was checked
    as an APPL-binding lead, but is an embryonic-stem-cell survival context and is not modeled as
    an inner-ear mechanism; the attempted PMC5714451 URL returned a browser challenge.


    Read the available abstracts for PMID:25296581 (minigene), PMID:23510777 (Saudi family), PMID:29605370
    (Iranian panel), PMID:33168789 (South Indian screening), and PMID:11493199 (historical mapping).
    Attempted DOI recovery of the splice paper returned unavailable text, so only the verified abstract
    supports that assay. Do not equate its premature stop with measured protein absence. Human p.Trp301*
    deletes only the final 12 residues; mouse protein-abundance experiments are not patient-allele
    assays. Preserve the correctly stated Chuvash 6/26 homozygous diagnostic fraction, clarify that
    the 13/52 allele count includes a single heterozygous affected person, and avoid treating consanguinity
    as a diagnostic requirement.


    No disease-specific GeneReviews chapter was identified by the online check. Read the general
    Genetic Hearing Loss Overview sections on habilitation, cochlear implantation and recessive counseling
    to support these general-care claims. A refetch of its existing full-text URL returned a browser
    challenge; retained the intact tracked cache rather than replacing usable text with the challenge.
    The source supports general care, not GIPC3-specific implant outcomes. ClinicalTrials.gov v2
    search for GIPC3 OR DFNB15 OR DFNB72 OR DFNB95 returned zero studies on 2026-09-27. No treatment
    efficacy was inferred from transgenic mouse rescue or unrelated gene-therapy programs.


    Completeness cross-check:

    1. Phenotypes adequate: bilateral early sensorineural loss, severity variation and the documented
    progressive Dutch patient. No human seizures, hyperacusis, vestibular or retinal syndrome inferred
    from mouse experiments. Existing five phenotype records retained.

    2. Subtypes adequate: DFNB15/72/95 are aliases of the same GIPC3 disorder; DFNB81 remains a distinct
    locus. The cited families do not establish reproducible molecular clinical subtypes.

    3. Mechanisms adequate: 14 nodes, separating cuticular plate and junction abnormalities and adding
    calcium/exocytosis/nerve-firing findings and provisional in-vitro mitochondrial observations.
    Human translation and contradictory experimental contexts are explicit.

    4. Treatments/trials adequate: amplification/habilitation, implantation and genetic counseling;
    general evidence distinguished from the single reported implanted GIPC3 patient without outcome
    data. No disease-specific registry study found.

    5. Genetics adequate: linkage, pathogenic allele classes, founder cohort and selected screening
    denominators; no unsupported complete-penetrance or global carrier-frequency estimate.

    6. Diagnostics/biomarkers adequate: audiological phenotype and biallelic pathogenic/likely pathogenic
    molecular diagnosis; neighboring-locus linkage or an arbitrary GIPC3 variant alone is insufficient.
    No validated disease-specific biochemical biomarker surfaced.

    7. References adequate: all existing cited sources checked at their available depth; two recovered
    full-text caches committed. Unavailable/challenge caches are not evidence and are not included
    in the PR.

    8. Overall consumption adequate: central research themes represented and corrected using primary
    results; speculative glutamate-receptor/kinase pathways from general context are not promoted
    to established disease mechanisms.


    Validation: schema/ontology/reference checks passed with 67 snippets and 79 titles, no unavailable
    snippets. Two scoped data tests passed. Causal targets, entity references, coarse phenotype,
    source-defect, snippet grading and snippet-boundary checks passed. Independent review and CI
    remain PR-level follow-up.


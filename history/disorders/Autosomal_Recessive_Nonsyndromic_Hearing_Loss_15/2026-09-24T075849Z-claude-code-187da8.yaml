  details: |
    New entry for GIPC3-related DFNB15/DFNB72/DFNB95 (MONDO:0011160), replacing the stub (claim issue monarch-initiative/dismech#12617). Deep research: Perplexity sonar-deep-research, run through a session-local streaming workaround for #9357; the report is committed as a lead only. just preflight-dr returned PASS (GIPC3 mentioned 186 times). The report cites bare URLs (no PMID/DOI, so reference validation found nothing to check) and its term validation flagged 17 CURIEs naming different terms plus one nonexistent HP term; no CURIE was taken from it. The four PMC links in its sidecar were converted to PMIDs (21326233, 22652773, 25140308, 36704659); only 21326233 is cited. Additional primary literature was found by PubMed E-utilities search for GIPC3 (Rehman 2011 PMID:21660509, Ain 2007 PMID:17690910, Chatterjee 2023 PMID:37096733, Siddiqi 2014 PMID:25296581, Ramzan 2013 PMID:23510777, Asgharzade 2018 PMID:29605370, Petrova 2021 PMID:34071867, Kalaimathi 2020 PMID:33168789); PMID:11493199 (MYO1F excluded at DFNB15) is listed in references only. Li 2022 review PMID:36704659 was read but not cited, and the 2025 mitophagy mouse paper PMID:40658338 was not curated. Mouse allele names were verified from the cached text as ahl5 and jams1. Pathophysiology is a six-node chain (biallelic GIPC3 variants -> loss of GIPC3 adaptor function -> stereocilia bundle disorganisation -> reduced mechanotransduction -> hearing loss; and -> hair cell/spiral ganglion degeneration -> progressive loss), with the knockout cuticular-plate/junction defect recorded as a node without a downstream edge because its link to deafness is not shown. Mechanistic evidence is typed MODEL_ORGANISM or IN_VITRO; the Gipc3 knockout result showing normal early transduction currents is recorded as REFUTE against the transduction node, and a HUMAN_MODEL_MISMATCH discussion records the ahl5 versus knockout versus patient discrepancy. Some snippets come from the PMC full text cached for PMID:21326233 and PMID:21660509 (family audiology, prelingual onset, cochlear implant). just check-genereviews returned NO_CHAPTER. Validated with just validate, validate-terms, count-verified-snippets (41/41), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-folded-hyphens, check-reference-titles and just validate-disorders.

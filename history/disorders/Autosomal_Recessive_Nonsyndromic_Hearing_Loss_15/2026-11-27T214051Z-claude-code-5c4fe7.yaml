  details: |
    Phenotype pass. Added laterality (BILATERAL) to the sensorineural hearing loss phenotype and a structured CONGENITAL onset to Prelingual Onset. Added evidence from the Chuvash p.Asn82Ser founder study (PMID:34071867, full text): six homozygotes, all bilateral and prelingual, five congenital, five with profound or complete loss in at least one ear; recorded as phenotype_contexts scoped to that population (VERY_FREQUENT, not OBLIGATE, given n=6). Added severity evidence for the Iranian p.Glu158Lys and Pakistani c.226-1G>T families and the Iranian p.Asn82Ser siblings from that paper's literature table, marked quote_role BACKGROUND, and a review-table row (PMID:31506927, REVIEW_SYNTHESIS) for bilateral prelingual severe-to-profound loss. Updated phenotype descriptions and notes (leads: original Iranian, Pakistani p.Ser253Arg and Algerian p.Met255Lys reports). PubMed, Europe PMC, OMIM and Orphanet were unreachable from the curation environment, so no new references were cached; all additions use references already in references_cache. Validation: validate, validate-terms, validate-disorders pass; 83/83 snippets verified; causal-targets, coarse-phenotypes and name-collisions OK.

  summary: 'Review round 1: Autosomal_Recessive_Nonsyndromic_Hearing_Loss_15'
  details: |
    Addressed review of PR 12660. (1) PKDF291 is shown by Rehman 2011 (PMID:21660509) to be a DFNB81 family unrelated to GIPC3, so the Ain 2007 (PMID:17690910) items that used it were removed: the profound-severity item was replaced by the Rehman Table 1 DEM4322 row and the Charizopoulou DFNB15 prelingual-profound sentence; the moderate-to-severe item was replaced by the Rehman Table 1 PKDF335 (moderate to severe) and PKDF1258 (mild to severe) rows; the inheritance item was replaced by the Rehman sentence on seven homozygous recessive mutations segregating in seven consanguineous families. PMID:17690910 is no longer cited and its cache file was removed. The Rehman vestibular sentence was kept, with the explanation noting that its 'these families' also covers PKDF291. (2) The Gipc3 knockout REFUTE item (normal early transduction, no ABR at one month) was moved from the Reduced Hair Cell Mechanotransduction node to its edge to Sensorineural Hearing Loss; the node now cites the measured 57/71% transduction-current reduction. (3) Potassium current maturation was split into its own node, Failure of Inner Hair Cell Potassium Current Maturation (GO:0071805 potassium ion transmembrane transport, DECREASED, label checked with runoak ols:go), reached from Loss of GIPC3 Adaptor Function; it has no downstream edge because no source links it to the human hearing loss. (4) HP:0012714 Severe hearing impairment was considered for the lower severity phenotype and not used, because severe loss is shared with the severe-to-profound group; the phenotype stays on HP:0012713 and its description now names the mild-to-severe families PKDF1258 and PKDF1048. (5) The notes paragraph about the deep-research report was removed; that provenance is in the CREATE history record. Rechecked with just validate, validate-terms, count-verified-snippets (45/45), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-snippet-length, check-snippet-grading and validate-disorders.

  summary: Wire Lowe syndrome into the mineralization module and curate its rickets
    gap
  details: |
    Issue #8995 item 7: Lowe_Syndrome described Fanconi-type proximal tubulopathy in prose but carried zero occurrences of 'rickets' and no HP:0002748. Added a 'Renal phosphate wasting' pathophysiology node conforming to defective_skeletal_mineralization#Phosphopenic Substrate Deficiency, downstream of the existing 'Proximal tubular endocytic reabsorption failure' node, plus Hypophosphatemia (HP:0002148) and Rickets (HP:0002748) phenotypes. Evidence from newly fetched PMID:20301653 (GeneReviews), PMID:30501482 and PMID:37508663. Node notes record two caveats: a calciopenic contribution via impaired 1-alpha-hydroxylase reported in a single case report with confounding nutritional vitamin D deficiency (no second conforms_to was created), and the source disagreement over whether the tubulopathy is full Fanconi (GeneReviews) or selective (PMID:18480301). Validated with just validate, count-verified-snippets, term validation and the offline CI gates.

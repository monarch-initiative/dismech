  summary: 'Create: Catamenial Pneumothorax'
  details: |
    Created Catamenial Pneumothorax (MONDO:0022098), an acquired/complex disorder and the commonest manifestation of thoracic endometriosis syndrome. Pathophysiology modeled as the leading account plus two explicitly-proposed competing theories (the reviews frame all three as theories, preserved here): Cyclical Ovarian Hormone Stimulation -> Thoracic Endometriosis (diaphragm/visceral pleura, endometrial glandular+stromal cells CL:0002656/CL:0002255) -> Visceral Pleural and Diaphragmatic Defects -> Air Accumulation in the Pleural Space -> pneumothorax/pleuritic chest pain/dyspnea; plus Transdiaphragmatic Air Passage and Prostaglandin-Mediated Alveolar Rupture (CHEBI:15553 PGF2alpha, GO:0006939) as parallel proposed routes into air accumulation; thoracic endometriosis also wired to catamenial hemothorax and hemoptysis. 5/5 phenotypes causally connected. biochemical: serum CA-125 (INCREASED). prevalence recorded honestly as a proportion of reproductive-age female spontaneous pneumothorax (measure_type UNKNOWN / NOT_YET_DOCUMENTED, 7.3-36.7% in notes). progression: perimenstrual recurrent episodes (<72h of menses, recurrence 14.3-55%). Treatments: GnRH agonist (leuprolide CHEBI:6427, PEPTIDE), hormonal ovarian suppression (danazol CHEBI:4315, SMALL_MOLECULE), thoracoscopic surgery (NCIT:C15726), pleurodesis (NCIT:C66899), all target_mechanisms-linked. Deep research requested falcon, fell back to claude_code (no EDISON_API_KEY), thin, used as a lead only. Evidence anchored on five PubMed reviews/systematic reviews: PMID:31401265, PMID:25337402, PMID:20473170, PMID:39768909, PMID:27516783; 25/25 snippets exact-quote verified. No GeneReviews chapter (acquired/complex). validate-disorders, validate-terms, entity-refs, causal-targets, duplicate-keys, qualifier-terms, coarse-phenotypes pass. Differentials omitted: no precise MONDO term for non-catamenial primary spontaneous pneumothorax to anchor one without a loose parent binding.

  summary: Review CP clinical boundaries, competing mechanisms and surgical-hormonal
    evidence
  details: |
    Review the existing CP entry against all eight originally cited caches, the full scientific bodies and tables of PMID27516783,39768909,35268286,39115198,33477657,42063108,35544515, and the available abstracts31542450/37773983. Primary TERP cohorts are explicitly broader than clinically timed CP. Full-text attempts for37773983 reached a403 publisher response and an institutional degree-examination summary, not the article;31542450 remained abstract-only. No cache was hand-written.
    Separate clinical menstrual timing from histological confirmation of associated endometriosis, remove broader TERP as exact synonym, preserve the discrete MONDO clinical entity without inventing etiologic subtypes. Replace pelvic-endometriosis universal-origin claim with scoped association and competing migration, lymphovascular and coelomic hypotheses. Separate cyclic implant breakdown, diaphragm fenestrations, visceral pleural invasion/air leakage and bronchiolar versus vascular contraction, marking unproven mechanisms hypothetical. Capture stromal-only histology and ER/PgR/CD10 interpretation without converting selected TERP frequencies to CP population rates.
    Add cough and direct CP hemothorax evidence; remove hemoptysis supported only as another TES presentation. Qualify imaging/CA125 and exploratory circulating-cell/24-gene-panel results. Add individualized gynecologic evaluation and diaphragm repair/resection; preserve observational limitations of hormone and surgical comparisons, adverse effects and fertility considerations. Avoid contradictory primary recurrence counts and overconfident secondary pooled estimates. Repair LAM/PSP/BHD differentials, including variable BHD presentation. No CP-specific causal gene, model, trial or dataset accession was established by the reviewed materials.
    Deep-research cross-check completed across phenotypes, subtype identity, mechanisms, treatments/trials, genetics, diagnostics/biomarkers and references. The report labels much recalled content unverified; cached evidence controls the entry. Secondary case reports are nonblocking; nonspecific spontaneous-pneumothorax drainage analyses and pelvic-endometriosis antiangiogenic animal models are outside these CP claims. GeneReviews/StatPearls offline lookup: NO_CHAPTER. Design-decisions sections1/3/6/9 govern scope and evidence separation. Terms checked using OAK and authoritative validation; specific releasing-hormone-agonist and hormone-therapy bindings replace generic pharmacotherapy. Source audit and validations retained locally.

  summary: 'Add differential diagnoses: PSP, LAM, Birt-Hogg-Dube'
  details: |
    Added three phenotype-overlap differential diagnoses to the recurrent-spontaneous-pneumothorax presentation, in response to review feedback that differentials should be based on shared phenotype patterns rather than sibling MONDO terms: primary (non-catamenial) spontaneous pneumothorax (PMID:34774177), lymphangioleiomyomatosis (MONDO:0011705, PMID:27514586), and Birt-Hogg-Dube syndrome (MONDO:0800444, PMID:27514594). Each carries distinguishing_features separating it from the hormone-driven, perimenstrual, right-sided catamenial form, plus exact-quote evidence. Validated with just validate, validate-terms, count-verified-snippets 29/29, validate-disorders, and the whole-KB grading/length/title/folded/entity gates all clean.

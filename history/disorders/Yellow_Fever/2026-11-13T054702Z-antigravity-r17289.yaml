  details: |
    Added yellow-fever-specific coagulopathy and DIC evidence from PMID:31668201 to phenotypes[Coagulopathy] and both incoming causal edges (Hepatocyte Apoptosis and Midzonal Liver Necrosis -> Coagulopathy and Endothelial Activation and Microvascular Leakage -> Coagulopathy), marked the VHF-wide synthesis item (PMID:41734218) as directness INDIRECT on Coagulopathy, and removed the unsupported FREQUENT frequency tag. Added African sylvatic Aedes (NCBITaxon:7158) to agent_life_cycle.hosts and vectors with PMID:31668201 sylvatic-cycle evidence, and documented in agent_life_cycle.notes why monophyletic Primates (NCBITaxon:9443) is bound for non-human primates.

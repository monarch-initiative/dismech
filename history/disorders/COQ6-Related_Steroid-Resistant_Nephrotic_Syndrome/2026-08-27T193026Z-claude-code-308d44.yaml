  summary: 'Create: COQ6-Related Steroid-Resistant Nephrotic Syndrome with Sensorineural
    Deafness'
  details: |
    Curated COQ6-related SRNS with SNHL (MONDO:0013836) from a claude_code deep-research report plus the GeneReviews primary CoQ10 deficiency overview PMID:28125198. Eight pathophysiology nodes, one connected component. The entry treats steroid resistance as part of the causal chain rather than as an adjective in the name: the lesion is a biosynthetic deficiency, so immunosuppression has nothing to act on, and an INTERPRETATION discussion draws out the clinical consequence that resistance should prompt a metabolic question rather than escalation. Tissue selectivity is curated from the localization result showing COQ6 in podocytes and stria vascularis, which is why an oto-renal phenotype rather than a general mitochondrial one. CoQ10 replacement carries three target_mechanisms with different effects: BYPASSES the deficiency node, RESTORES the nephrotic syndrome, MODULATES the hearing loss at a 42.9% response rate graded PARTIAL. A KNOWLEDGE_GAP records that genotype and treatment timing are both offered as explanations for variable response and no reported series separates them. Two corrections to my own prior: the claim issue predicted the deafness would generally not reverse, but the source reports stabilization or improvement in nearly half, so the entry follows the source; and GO:0006744 was initially placed in molecular_functions when it is a biological process, caught by term validation and moved, with GO:0004497 and GO:0071949 used for the monooxygenase and FAD-binding functions. PMID:26808124 is cited twice on one node with different evidence_source values because one sentence reports biochemistry and the other molecular dynamics. Validation: 22/22 snippets verified plus an independent raw-substring re-check; schema, terms, entity-refs, duplicate-keys and reference titles all pass.

  summary: Fix snippet-grading regression; the gate exposed a factual error about
    the zebrafish rescue
  details: |
    Third review-response pass on PR 9758. The previous commit introduced a check-snippet-grading regression: the new animal_models link reused the abstract sentence 'knockdown of Coq6 in podocyte cell lines and coq6 in zebrafish embryos caused apoptosis that was partially reversed by coenzyme Q10 treatment' and graded it MODEL_ORGANISM, while three existing items in the same file grade the identical sentence IN_VITRO. Reproduced the failure before fixing it: 3 new findings. Investigating the right replacement quote turned up a substantive error rather than a formatting one. That sentence is the abstract's summary of two separate experiments, and reading the results section shows the coenzyme Q10 rescue was demonstrated in cultured mouse podocytes (Figure 5, A-C) while the zebrafish panels (D-F) compare knockdown against mismatch and uninjected controls with no CoQ10 condition at all. The animal-model link's explanation had claimed it 'establishes the same rescue in a whole organism, which is what makes it more than a cell-culture artefact' - a claim the cited experiment does not support. The link now quotes a zebrafish-only result, 'coq6 knockdown in zebrafish embryos 28 hours after fertilization increases apoptosis', carries a single evidence type, and its limitations state plainly that the zebrafish arm has no CoQ10 treatment condition so the model supports the phenotype and not the treatment response. The HUMAN_MODEL_MISMATCH rationale, which had said the models reproduce the renal arm 'including its CoQ10 responsiveness', was corrected to attribute the rescue to the cellular level only. Also closed the two items left open from the previous round: the six-manifestation Severe Infantile Presentation bundle was split into five atomic phenotypes bound to HP:0001942, HP:0000093, HP:0003073, HP:0001510 and HP:0001252; death in early infancy was deliberately NOT added as a sixth because HP:0001522 is a clinical-course concept outside the PhenotypeTerm dynamic enum, and that outcome is recorded in the genetic notes instead. The two nonsense alleles were moved from free-text notes into structured genetic variants entries. Validation: schema and terms pass, 36/36 snippets verified and 36/36 on the raw-substring re-check, entity-refs and duplicate-keys pass, 44/44 reference titles match cache frontmatter, declared and cited reference sets agree, check-snippet-grading reports no new divergences.

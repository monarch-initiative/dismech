  summary: 'Follow-up #9787: variant LOF effects, per-arm idebenone REFUTE, cochlear
    NCIT term, diagnosis, progression, renal replacement, identifiers'
  details: |
    Clears the COQ6 items deferred from PR #9758 review and tracked in issue #9787.

    genetic: added functional_effects with type loss-of-function to both nonsense variants. The issue asked for functional_impact_category, but that slot lives on GeneticContext, which is not reachable from a variants[] entry - the Variant class carries functional_effects instead. That is the house pattern used across kb/disorders (see Abetalipoproteinemia, 3-Hydroxy-3-Methylglutaryl-CoA_Synthase_Deficiency) and it achieves the issue's actual goal: the residual-activity argument in notes becomes queryable rather than prose. Supported by the snippet already quoted on both variants (resulting in two truncated protein products).

    treatments: moved the idebenone hearing REFUTE from treatment level to a target_mechanisms entry against Progressive Sensorineural Hearing Loss. At treatment level the sentence scanned as a refutation of idebenone as such, which the optic response in the adjacent link contradicts; the claim is about the drug's reach, not its efficacy. The new link deliberately carries no treatment_effect - every available value (INHIBITS, ACTIVATES, MODULATES, BYPASSES, RESTORES, TRIGGERS) asserts that the drug acts on the node, and the finding is that it did not. treatment_effect is optional on TreatmentMechanismTarget, so this is representable without a workaround.

    treatments: cochlear implantation retermed from NCIT:C15747 (Supportive Care) to NCIT:C15329 (Surgical Procedure) with preferred_term cochlear device implantation, matching the twenty other cochlear-implantation treatments across kb/disorders and the sibling entry in #9757. A notes line records why the specific device term NCIT:C157820 cannot be used: it names the device rather than the clinical action and is not reachable from NCIT:C25218 where TreatmentTerm is rooted. That reasoning was previously re-derived independently in at least four separate entries.

    treatments: added Dialysis and Kidney Transplantation. Curated for a mechanistic reason and not just completeness: post-transplant recurrence is low in monogenic SRNS because the lesion is in the podocyte genome and the graft podocytes are someone else's, which is a prediction the entry can make from its own pathophysiology and which makes transplantation definitive here in a way it is not for immune-mediated nephrotic syndrome. Linked BYPASSES to the renal node, with the note that the auditory arm continues after a successful graft.

    diagnosis: added two entries. Molecular genetic testing is the diagnostic route - there is no biochemical screen specific to COQ6, so whole-exome or an SRNS/FSGS panel is the way in, and the clinical trigger is steroid resistance plus deafness in a child. Renal biopsy showing FSGS is curated separately and explicitly as directional rather than diagnostic: FSGS is the common final appearance of podocyte injury from many causes, so it identifies the lesion and not its cause.

    progression: added one phase, steroid-resistant nephrotic syndrome to kidney failure, using the ProgressionInfo shape (phase/notes, not name/description - the first attempt used the wrong slots and failed schema validation). Records the authors' word inevitably, and the modifier on it: renal function can be restored if CoQ10 starts before the kidney pathology progresses. That is what makes timing rather than treatment choice the decisive variable, and it is where the renal and auditory arms come apart.

    prevalence was NOT added. None of the eight cached references gives a COQ6-specific rate or literature case count. The one quantitative figure available (SRNS affects approximately 10-20% of paediatric nephrotic syndrome) is about SRNS as a whole, not this gene, and the 12-patient audiological series is a single-centre cohort rather than a literature total. Recording a rate would have meant manufacturing one.

    notes: recorded OMIM:614650 and ORPHA:280406 as identifiers rather than as a mappings block. The schema's mappings slot has icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings only - there is no omim_mappings or orphanet_mappings slot - and both identifiers are already xrefs of the curated disease_term MONDO:0013836, which was verified with runoak. Re-asserting an ontology's own xrefs is what the design register tells curators not to do. The free-text identifiers line is the house pattern (see Acatalasia, 3-Phosphoglycerate_Dehydrogenase_Deficiency).

    One evidence item was written and then removed before commit: a methods sentence from PMID:36124066 (We compared the two groups in terms of...) cited under the transplantation treatment. It validates as an exact quote and asserts nothing, which is the failure mode dismech#8682 describes. Dropped rather than regraded.

    Validation: just validate-disorders kb/disorders/COQ6-Related_Steroid-Resistant_Nephrotic_Syndrome.yaml passed, exit 0, Snippets checked: 43/43 verified against cached references. Every snippet was confirmed as an exact substring of its cache before being written; the dialysis sentence was truncated before a thin space in 6 years. build_causal_graph reports no dangling edges.

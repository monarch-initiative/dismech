  details: |
    Added GeneReviews Clinical Characteristics evidence for the usual untreated renal trajectory and the explicit COQ6 ascertainment caveat. Retained three PMID bibliographic records alongside their URL full texts for readable source identities. Added international-cohort context for the combined encephalopathy/seizures, ocular-abnormality and myopathy categories without treating aggregate counts as narrower phenotype frequencies; added the observed median age at ESKD. Added atrial septal defect, elevated pulmonary artery pressure and raised lactate from the severe infantile family, with infection and structural-heart confounding stated and no population frequency assigned. Verified the new HPO terms through OLS. This append-only follow-up links PR13438 while preserving the original REVIEW record unchanged.

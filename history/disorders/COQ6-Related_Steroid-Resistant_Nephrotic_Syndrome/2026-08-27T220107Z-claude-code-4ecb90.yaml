  summary: Add idebenone, optic-nerve node, model sections and a HUMAN_MODEL_MISMATCH
  details: |
    Addressed the substantive items in the REQUEST_CHANGES review on PR 9758. (1) Idebenone was missing while the entry curated Optic Atrophy as a phenotype, leaving the ocular arm a dead end - a phenotype with no node and no treatment - even though the evidence sat in a cache this PR added. Idebenone is now curated with RESTORES on a new Optic Nerve Involvement pathophysiology node, and with the clean negative retained as REFUTE: the same source reports it did not improve hearing loss in the same patients. That per-arm dissociation within one drug is now visible in the graph. (2) The zebrafish morpholino and podocyte knockdown were cited three times as evidence, including as the mechanistic basis for the treatment's BYPASSES link, but neither was modelled - so neither reached the pathograph. Both are now first-class with modeled_mechanisms and limitations. (3) Added a HUMAN_MODEL_MISMATCH discussion, which the reviewer correctly judged sharper than the generic gap: the models reproduce the renal arm including CoQ10 responsiveness, but no cochlear or optic-nerve model exists in any species, so the hearing and vision arms rest on a localization result plus analogy - and the idebenone dissociation between them is exactly what a model would be needed to explain. Earlier in this session the same PR also gained the ROS/cytoskeleton/caspase intermediates from PMID:30425193, which the reviewer independently flagged as item 7. Validation: 30/30 snippets verified plus raw-substring re-check; 9 nodes in one component; schema, terms, entity-refs and duplicate-keys pass.

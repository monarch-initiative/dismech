  summary: 'Gene-family review: COQ6, COQ8B'
  details: |
    The COQ6 mechanism node bound the generic monooxygenase activity (GO:0004497); replaced it with the specific ferredoxin-dependent C5 oxygenase GO:0106364 (4-hydroxy-3-all-trans-polyprenylbenzoate oxygenase activity, EC 1.14.15.45), matching the reconstituted reaction in which COQ6 hydroxylates C5 using the FDXR/FDX2 ferredoxin couple as electron donor (PMID:38425362), and added that dependence to the node description. Added the autosomal recessive inheritance block to the COQ6 genetic record and recorded the COQ8B p.His174Arg candidate-modifier polymorphism as germline.

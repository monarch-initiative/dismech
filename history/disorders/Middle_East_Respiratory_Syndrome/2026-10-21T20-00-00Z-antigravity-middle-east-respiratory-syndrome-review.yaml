  summary: Comprehensive deep review and clinical/diagnostic enrichment for Middle East Respiratory Syndrome
  details: '- Added `progression` phases documenting the incubation period (`incubation_days: 2-13`, median 5.2 days) and rapid progression (`duration: first 1 to 2 weeks of symptomatic illness`) to ICU admission (median 5 days), mechanical ventilation (median 7 days), and death (median 11 days) from PMID:23782161. - Added anatomical `locations` (`bronchiole` `UBERON:0002186`, `kidney` `UBERON:0002113`, `small intestine` `UBERON:0002108`, `liver` `UBERON:0002107`) and receptor tropism `notes` to `MERS-CoV Spike-Mediated Entry via DPP4` and `Severe Lower Respiratory Infection and Systemic Spread`, and annotated `causal_link_type` and `intermediate_mechanisms` on all pathophysiology edges. - Added `Acute respiratory distress syndrome` (`HP:0033677`), `Chills` (`HP:0025143`), `Hemoptysis` (`HP:0002105`), and `Abdominal pain` (`HP:0002027`) to `phenotypes` with verbatim evidence from PMID:26049252 and PMID:23891402, and wired them from `Severe Lower Respiratory Infection and Systemic Spread`. - Added `diagnosis` entries (`Real-time reverse transcription polymerase chain reaction` `NCIT:C17003`, `Chest radiography` `NCIT:C38103`, `Diagnostic serology testing` `NCIT:C217458`) supported by
    PMID:26049252. - Added verbatim evidence (PMID:26049252), `target_mechanisms`, and `target_phenotypes` to `Supportive Care` in `treatments`. - Added `differential_diagnoses` (`Severe acute respiratory syndrome`) supported by PMID:23782161 and PMID:26049252, and tagged PMID:26049252 review evidence with `evidence_source: HUMAN_CLINICAL` and `quote_role: REVIEW_SYNTHESIS` across `infectious_agent`, `transmission`, `phenotypes`, `diagnosis`, `treatments`, and `differential_diagnoses`.'

  summary: Correct BVVL scope and causal wiring
  details: |
    Reviewed Brown-Vialetto-Van Laere syndrome for ontology scope, causal graph integrity, gene wiring, phenotype connectivity, and inheritance evidence. Replaced the type-1-only MONDO identifier with the riboflavin transporter deficiency umbrella that covers both SLC52A3/BVVL1 and SLC52A2/BVVL2. Wired both genes to impaired riboflavin transport, added evidence throughout the flavocofactor and mitochondrial neuronopathy chain, connected all ten retained phenotypes, and structured evidence-backed autosomal-recessive inheritance for both genes. Schema, terms, references, phenotype connectivity, gene wiring, and compliance checks passed.

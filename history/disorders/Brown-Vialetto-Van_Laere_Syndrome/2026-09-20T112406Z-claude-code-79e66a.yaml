  summary: 'Genetics pass (wiring-002): bind subtype genes, add the GeneReviews baseline,
    disposition SLC52A1'
  details: |
    Genetics pass for issue #12191. Both MONDO-recorded genes (SLC52A3 for MONDO:0024537, SLC52A2 for MONDO:0013867) were already curated and already bound on the Riboflavin Transporter Deficiency node. Bound each to its has_subtypes row and added relationship_type: CAUSATIVE plus the subtype foreign key to both genetic: records. Separately, just check-genereviews reported the Riboflavin Transporter Deficiency chapter (PMID:26072523) as an uncited UNTAGGED_CHAPTER, so it was fetched, tagged in references:, and mined for two evidence items: the RTD2/RTD3 biallelic diagnostic statement on the SLC52A3 record and the disease-definition sentence on the SLC52A2 record. Added a notes: block dispositioning SLC52A1 explicitly: the same chapter records a single unconfirmed case report of biallelic SLC52A1 variants with infantile riboflavin-responsive seizures and hyperammonaemia, a different phenotype from the ponto-bulbar palsy this entry models, so SLC52A1 is deferred rather than curated as a third subtype. That note is worded as a deferral because no further SLC52A1 research was done for this pass. Validated: just validate (47/47 snippets), validate-terms, check-genereviews, and the offline gate set.

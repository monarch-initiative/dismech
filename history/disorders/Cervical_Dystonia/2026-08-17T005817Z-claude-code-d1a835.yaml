  summary: 'Create: Cervical Dystonia (MONDO:0000481)'
  details: |
    New entry from an Edison Falcon deep-research report. Three pathophysiology nodes deliberately pitched at network scale rather than localised: sensorimotor network dysfunction spanning basal ganglia, thalamus, sensorimotor cortex and cerebellum; disordered sensorimotor integration; and involuntary sustained neck muscle contraction. Assigning the fault to a single structure would claim more than the evidence supports, and the network formulation exists precisely because decades of attempts to localise it failed. Two discussions carry what is genuinely open. The cerebellar contribution is a KNOWLEDGE_GAP because the cerebellum is named in every formulation of the network yet direct functional testing in patients gives equivocal results, and the answer changes whether it is a therapeutic target or a downstream consequence; the proposed experiment stratifies rather than pooling, since equivocal group-level results are what a real subgroup effect looks like. The sensory trick is an OPEN_QUESTION attached to the integration node because it is the strongest bedside argument that the fault is afferent rather than efferent: a light touch abolishing a sustained involuntary motor output is hard to explain if the lesion is downstream of the motor command. Botulinum toxin is curated with its mechanistic position made explicit, acting at the neuromuscular junction far downstream of everything modelled as the pathophysiology, which is why it is effective, temporary and non-disease-modifying; the Cochrane finding of no demonstrable dose-response is curated as PARTIAL and framed as a limit on practice rather than support for the drug. Genetics recorded as SUSCEPTIBILITY with the panel yield quantified (209 heterozygous variants across 24 genes in 121 patients, nine relevant, three likely pathogenic) rather than implying the associated genes explain the common sporadic disease. THREE ontology identifier errors from the Falcon report caught and corrected against OAK: HP:0002418 offered for torticollis is Abnormal midbrain morphology (correct HP:0000473); HP:0001336 offered for tremor is Myoclonus (correct HP:0001337); HP:0003577 offered for adult onset is Congenital onset (correct HP:0003581). MONDO:0000481 required cache seeding via the local sqlite adapter after the configured OLS adapter timed out; conf/oak_config.yaml restored and verified clean. Validated: just validate passed; count-verified-snippets 17/17; title audit 17 citations 0 mismatches; check_folded_hyphens and check-title-snippets OK; pytest -k Cervical_Dystonia 16 passed.

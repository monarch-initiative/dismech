  summary: Connect the orphaned anxiety and depression phenotypes to the network node,
    not the motor node
  details: |
    Self-caught before review, from a parse of every entry in this batch after orphaned phenotype leaves blocked the pigment dispersion PR. Anxiety and depression had no incoming edge, so the non-motor burden that this entry argues is central sat outside the pathograph entirely.

    Where to attach them is the interesting part and the reason this is not a mechanical fix. The obvious parent is the motor node: a person with a visible, disabling neck posture becomes anxious and low. The cited source rules that out in its own sentence, saying the non-motor symptoms cannot be directly attributed as a secondary consequence of motor symptoms. Attaching them downstream of the contraction would therefore have encoded exactly the claim the evidence denies. Both edges are drawn instead from Sensorimotor Network Dysfunction, the shared upstream node, with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES because the route from network dysfunction to mood is not established by anything cited here. The edge descriptions say all of this rather than leaving the choice of parent to look arbitrary.

    Only the initiating node now lacks an incoming edge. Validated: just validate passed; count-verified-snippets 22/22; pytest -k Cervical_Dystonia 16 passed; folded-hyphen gate OK.

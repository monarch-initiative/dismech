  summary: 'Address review: re-anchor evidence, bind genes, quantify frequencies'
  details: |
    Six IMPORTANT findings addressed. Three were the same defect family, evidence cited for a claim it does not make, which is a recurring weakness of mine. The prevalence record carried rate_per_100000 30.9 while its snippet stated no rate at all; the real sentence was in a reference this PR already cached, and it is now cited with an explicit note that the figure measures ISOLATED DYSTONIA as a whole rather than cervical dystonia specifically, and that the same sentence offers a second estimate of 52.7. The tremor phenotype was evidenced by a generic dystonia definition that never mentions tremor; replaced with the registry figure of 516 of 1701, 30.3 per cent, and a FREQUENT band added. The Disordered Sensorimotor Integration node was argued from the sensory trick in prose but evidenced by a generic network sentence; it now carries the geste antagoniste sentence, which names cervical dystonia specifically and describes a voluntary sensory action completely suppressing an involuntary motor output, which is the actual argument for the node. Bound three genes, THAP1 GNAL and ANO3, as SUSCEPTIBILITY so they are queryable rather than free text, keeping the polygenic record and its yield figures alongside. Neck pain frequency quantified at 488 of 848, 57.5 per cent. Added a structured ADULT onset descriptor. Corrected the sex-ratio prevalence record from POINT_PREVALENCE to UNKNOWN, since a sex ratio is not a prevalence measure and the slot was misrepresenting what was measured. DBS retargeted to NCIT:C21024 Deep Brain Stimulation, an exact term. One reviewer suggestion could not be taken as given: NCIT:C82623 Botulinum Toxin Type A exists but is rejected by the ChemicalEntityTerm dynamic enum, which is CHEBI-rooted, and CHEBI has no botulinum toxin entry because the agent is a bacterial protein rather than a small molecule. The binding was removed and the reason recorded in treatment notes. DBS efficacy evidence was not added: the cited source is a DOI I could not resolve to a cached PubMed record in this pass, and I would rather leave the rationale-only PARTIAL standing than cite a figure I have not verified. Validated: just validate passed; count-verified-snippets 20/20 (was 17/17); pytest -k Cervical_Dystonia 16 passed; hyphen gate OK.

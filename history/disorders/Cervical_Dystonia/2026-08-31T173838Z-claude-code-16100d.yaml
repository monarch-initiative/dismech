  details: |
    Response to the blocking item in the ai4c-reviewer review of PR 10234, which found sub-line snippet fragments my whole-line detector was blind to. Four in this entry, and one of them matters more than the others. The neck-tremor phenotype item quoted the sex-comparison sentence up to 'tremors in the neck and/or in the upper limb tended to be more frequent in women than in men' and stopped at the comma immediately before ', but the difference did not reach the level of statistical significance after Bonferroni correction'. The cut turned a non-significant trend into what reads as a finding, on the item this PR had just edited and graded INDIRECT; the quote now runs to the end of the sentence and carries its own correction. The botulinum toxin dose-response item stopped at 'cervical dystonia-specific impairment' and now continues through 'a destinction between BtA formulations, or a variation with use of EMG-guidance' (the misspelling is the source's), which also makes the item quote the two findings the treatment's notes block records as frequently assumed in practice. The isolated-dystonia prevalence item began mid-sentence at 'was estimated as' and now starts at 'According to recent epidemiological studies'. The sex-ratio prevalence item was extended to its full sentence, with the abstract's 'RESULTS:' section label deliberately left out of the quote rather than pulled in as though it were part of the sentence. Five further flags in this entry were checked by hand and left alone: they are already whole sentences and the sentence splitter only joins them to the cache file's markdown header or to a results table whose rows are the quotable unit. No supports, directness, reference, evidence_source or ontology term changed in this pass. Validated with just validate-disorders over both entries (97/97 snippets verified), check-duplicate-keys, check-folded-hyphens, and check-snippet-length and check-title-snippets grandfathered against origin/main.

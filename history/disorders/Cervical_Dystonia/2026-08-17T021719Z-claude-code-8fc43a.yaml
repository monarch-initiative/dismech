  summary: Fix an unquoted prevalence figure, drop a frequency band built on the wrong
    denominator, add DBS efficacy, correct an invented enum claim
  details: |
    Four IMPORTANT findings from the second review, and three of them are the same underlying failure in different clothes: a number recorded in a structured slot whose evidence does not contain that number.

    The prevalence record asserted rate_per_100000 30.9 while the attached snippet quoted only 52.7. The full sentence contains both figures, so extending the quote fixes it. The explanation had even discussed the 30.9 alternative, which means the mismatch was visible in the same block and I did not notice that the quote had been trimmed short of the figure the slot uses.

    The tremor phenotype carried frequency FREQUENT on a snippet reading '1 Tremor 516/1701 (30' - a mangled table fragment carrying a stray digit from the row above and truncated mid-percentage. The reviewer's substantive point is the one that matters more: 516 of 1701 is the denominator for ALL idiopathic adult-onset dystonia, and the same table quotes cervical-dystonia-specific rows where it means cervical dystonia, giving neck pain against a denominator of 848. The absence of a CD row for tremor is therefore informative, not accidental, and a band derived from the all-dystonia figure asserts something about cervical dystonia the source declines to say. The frequency is removed, the fragment replaced with a whole sentence, the item regraded PARTIAL, and the reasoning recorded in notes so the next curator does not re-derive the tempting number.

    The deep brain stimulation deferral reason did not hold: the paper resolves, and its abstract carries the BFMDRS figures. Added at the PMID rather than the DOI, because DOI sits in skip_prefixes and a DOI snippet is not snippet-validated - a real trap, since it would have looked cited while being unchecked. Both halves are curated: the 55.3 and 56.6 per cent improvements as SUPPORT, and poor outcomes in 6 of 24 as PARTIAL, with a note that this is a single-centre craniocervical series rather than a controlled trial of cervical dystonia.

    The fourth is the one I would most want flagged in future. The botulinum notes asserted that the ChemicalEntityTerm enum is CHEBI-rooted and that CHEBI has no botulinum toxin entry. Both are false: the enum also roots at NCIT:C1909 with hundreds of NCIT members, and CHEBI:3160 Botulinum toxin type A exists. The conclusion, that NCIT:C82623 fails the enum, happened to be correct, which is exactly why this is dangerous: a wrong explanation attached to a right conclusion is never re-tested. CHEBI:3160 is now bound and validates. The note records the correction rather than being silently rewritten.

    Validated: just validate passed; count-verified-snippets 22/22 (was 20/20); pytest -k Cervical_Dystonia 16 passed; folded-hyphen and title-snippet gates OK.

  details: |
    The Botulinum Toxin Type A treatment's notes block carried two paragraphs. The first is clinical content and is kept: the Cochrane review found no evidence distinguishing between formulations and none that electromyographic guidance improved efficacy outcomes. The second was agent self-correction about an ontology-binding decision - that an earlier revision of the note wrongly claimed the ChemicalEntityTerm enum is CHEBI-rooted and that CHEBI has no botulinum toxin entry, and that the agent is now bound to CHEBI:3160. That is a record of how a curation session went wrong and was fixed, which is what history records are for; notes renders on the public disorder page as clinical content about the treatment, so it read as though the enum roots were part of what a clinician should know about botulinum toxin. Removed from the entry and recorded here instead. The substance is preserved and remains true: the therapeutic_agent binding is CHEBI:3160 Botulinum toxin type A, the ChemicalEntityTerm enum roots at both CHEBI and NCIT:C1909, and NCIT:C82623 does genuinely fail that enum. Nothing about the binding itself was changed. Separately, four evidence explanations in this entry still argued for the retired supports: PARTIAL grade; rewritten to state the same caveat in terms of the current enum. The neck-tremor phenotype item now carries directness: INDIRECT, because the quoted sentence is a sex comparison whose tremor denominator is all adult-onset dystonia rather than cervical dystonia. Direction was reviewed on the two items whose prose says they are carried as a limit rather than as support - the absent BtA dose-response relationship, and six of 24 poor outcomes after pallidal deep brain stimulation - and left as SUPPORT in both cases: neither contradicts the claim it attaches to, both bound how far it reaches, and each sits beside a sibling item carrying the positive finding. Validated with just validate: all checks passed.

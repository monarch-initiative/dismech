  summary: 'Review round 1: split the Eczema phenotype per STAT5B subtype after the
    AR/AD split'
  details: |
    Review round 1 on PR #12900. The reviewer found that splitting the STAT5B arm into autosomal recessive and dominant-negative rows had left the Eczema phenotype keyed to the recessive row while its only evidence (PMID:29844444) describes the dominant-negative form, and while its description claimed both forms at once - which a single-valued `subtype:` cannot express. The finding is correct.

    Fix. The single Eczema phenotype is now two rows, one per subtype, with distinct names so the flat pathograph name namespace does not collapse them:

    - "Severe eczema", `subtype: STAT5B Deficiency`, evidence PMID:26703237 ("Shared symptoms in 8 of the 10 patients include severe eczema, chronic pulmonary disease manifesting as early as the first year of life"). That quote was already cited in this entry on the Lymphocytic Interstitial Pneumonia phenotype with the same `evidence_source`, so the grading is unchanged.
    - "Eczema with elevated IgE", `subtype: STAT5B Dominant-Negative`, carrying the PMID:29844444 evidence item unchanged. This gives the new dominant-negative row its first phenotype foreign key.

    Both bind HP:0000964 Eczematoid dermatitis. Nothing referenced the old "Eczema" name - no `downstream`, `sequelae`, `attaches_to` or `subtype:` value pointed at it - so the rename breaks no foreign key.

    Also taken from the review: the new IGF1 `genetic:` record's PMID:23502138 evidence item now carries `quote_role: REVIEW_SYNTHESIS`. The basis is the quoted sentence's role, not a PubMed publication type - PubMed indexes that record as "Journal Article" only, but the chapter is a Nestle Nutrition Institute Workshop Series synthesis and the quoted sentence restates other groups' IGF1-mutation series rather than reporting this paper's own result.

    Also taken: the GeneReviews absence note no longer names the `just` recipe that confirmed it, and states the checkable fact instead - that the committed index of every PubMed-indexed GeneReviews chapter, snapshot 2026-09-10, holds no chapter for either name.

    Declined, with reason: the reviewer also suggested moving the "because `subtype:` is single-valued" reasoning out of `notes:`. Kept, because it is the schema constraint that makes the two-row structure necessary rather than a session detail; without it a later curator reading the two near-identical STAT5B rows would have no recorded reason not to merge them back.

    Validation after the fix. `just validate-disorders` over both changed files: schema no issues, term validation passed, 124/124 snippets checked, 125 titles, 0 issues, under linkml-reference-validator 0.3.0rc3 with --no-full-text. Subtype foreign-key coverage stays 6/7 (86%), now with a phenotype key on the dominant-negative row. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-coarse-phenotypes all OK, no baseline touched. No references_cache churn.

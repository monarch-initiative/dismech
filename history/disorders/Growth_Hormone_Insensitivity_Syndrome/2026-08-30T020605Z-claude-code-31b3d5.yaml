  details: |
    Publication-completeness deep review under the IUIS Table 2 campaign, focused on the STAT5B sub-entity (the IUIS Table 2 section 9 rows: STAT5b deficiency AR 245590 and AD dominant-negative 604260 in PMID:35748970). Re-verified all snippets (54/54). Expanded the STAT5B Deficiency subtype description to distinguish the AR and AD-DN forms and their OMIM numbers, added the three IUIS Table 2 row quotes as subtype evidence, and recorded in top-level notes that the STAT5B component - not the GHIS root - is the IUIS entity, that the entry deliberately carries no entry-level iuis_category, and that a dedicated STAT5B deficiency entry (stub MONDO:0100211) is the intended future home. Fidelity fix: the former 'Severe T-cell immunodeficiency' phenotype (HP:0005352) overstated the cited sources, which describe modest, variable T-cell lymphopenia; rebound to HP:0002721 Immunodeficiency with the variability quote. Added STAT5B-subtype phenotypes Decreased Regulatory T-Cell Proportion (HP:0020113), Lymphocytic Interstitial Pneumonia (HP:0006527), and Hypergammaglobulinemia (HP:0010702), and a 'STAT5B-Dependent Regulatory T-Cell Failure' pathophysiology node (IL-2 signaling/Treg differentiation GO terms, FOXP3 evidence from PMID:26703237) parallel to the GH-IGF1 axis, with downstream edges to the new phenotypes. Fidelity-checked the load-bearing claims (GHR classic cause, low IGF-1/high GH signature, rhIGF-1 efficacy, IGFALS insulin insensitivity, STAT5A knowledge gap) against cached text. Validation: just validate-disorders pass, validate-terms pass, entity-refs and duplicate-keys clean.

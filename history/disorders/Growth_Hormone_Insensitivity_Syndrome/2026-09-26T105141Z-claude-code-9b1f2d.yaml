  summary: 'Genetics pass: bind four MONDO subtype terms, split the STAT5B arm AR/AD,
    add reciprocal subtype foreign keys'
  details: |
    Genetics pass for the d2g gap list in issue #12258 (series-051). The parent's own MONDO anchor (MONDO:0015892) was checked first and is correct: its definition describes a group of diseases with marked short stature and normal or elevated GH that fail to respond to it, which is what this entry models. Four of the six subtype rows carried no MONDO term at all, and only one of six was referenced by a `subtype:` foreign key.

    Changes. (1) Four MONDO leaf classes are now bound as `has_subtypes[].subtype_term`, each confirmed by OLS hierarchicalParents to sit under MONDO:0015892 and each with its RO:0004003 causal gene read from the OLS v2 class record: MONDO:0014420 short stature due to primary acid-labile subunit deficiency (IGFALS, hgnc:5468) on the IGFALS Deficiency row; MONDO:0010038 growth delay due to insulin-like growth factor I resistance (IGF1R, hgnc:5465) on the IGF1 Resistance row; MONDO:0100211 (STAT5B, hgnc:11367) on the STAT5B Deficiency row; and MONDO:0100219 (STAT5B) on a new STAT5B Dominant-Negative row. The last two are reached through the intermediate class MONDO:0100210, which is not bound separately.

    (2) The single STAT5B Deficiency subtype row described both the recessive and the dominant-negative forms, which are two MONDO concepts, two OMIM concepts (245590, 604260) and two IUIS 2022 Table 2 rows. Since `subtype_term` and `subtype:` are both single-valued, the dominant-negative form is now its own subtype row with its own MONDO binding, autosomal dominant `inheritance`, and three evidence items (two abstract sentences from PMID:29844444 and the IUIS clinical column for the dominant-negative row, which moved here from the recessive row where it did not belong). The recessive row keeps its name so the five phenotypes keying on it with `subtype:` stay valid, and gains an autosomal recessive `inheritance` block.

    (3) The `genetic:` STAT5B record, which likewise covered both forms and so could carry no `subtype:` foreign key, is split into "STAT5B biallelic loss-of-function variants" (subtype STAT5B Deficiency, autosomal recessive, PMID:26703237) and "STAT5B dominant-negative heterozygous variants" (subtype STAT5B Dominant-Negative, autosomal dominant, PMID:29844444).

    (4) Reciprocal `subtype:` foreign keys added to the GHR, IGFALS and IGF1R genetic records, and a new IGF1 genetic record created so the IGF1 arm of the umbrella is a declared causal gene rather than only a gene descriptor on its subtype row; the disease itself stays curated in kb/disorders/IGF1_Deficiency.yaml. Subtype foreign-key coverage 1/6 (17%) -> 6/7 (86%); gene-to-mechanism wiring 4/4 -> 6/6. The one unreferenced row is STAT5A Deficiency, correctly so: it is a mechanistically motivated candidate with no established human disease gene, and no genetic record was created for it.

    (5) `notes` corrections and additions. The claim that a dedicated STAT5B deficiency entry was "the intended future home" was stale: kb/disorders/STAT5B_Deficiency.yaml exists, bound to MONDO:0100211. The absence of a GeneReviews chapter is now re-confirmed offline against the committed Bookshelf index rather than resting only on a 2026-06 PubMed search. Two research results are recorded: the synonym-inclusive ols:mondo searches that establish STAT5A has no monogenic class of its own (the only hit naming it is MONDO:1060224 STAT5 haploinsufficiency, a joint STAT5A/STAT5B copy-number condition with no RO:0004003 gene asserted), and a tension inside MONDO:0014420, whose Orphanet-derived definition places acid-labile subunit deficiency "in the absence of growth hormone (GH) deficiency or GH insensitivity" while MONDO files it under growth hormone insensitivity syndrome. The binding is kept because the literature this entry cites (PMID:23502138, PMID:39060265) supports the classification; the note exists so a later curator does not read the term as mis-parented.

    Validation. linkml-validate no issues; linkml-term-validator passed; reference validation 58/58 snippets and 58 titles, 0 issues, under linkml-reference-validator 0.3.0rc3 with --no-full-text (the pre-edit baseline on this file was 54/54, also clean). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-case-collisions, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-coarse-phenotypes all OK. list-gene-term-mismatches --resolve: 0 mismatches, 0 uncached. Every gene symbol and HGNC id was read live from rest.genenames.org in the same step it was written; no symbol in this entry has been renamed. No references_cache churn to revert.

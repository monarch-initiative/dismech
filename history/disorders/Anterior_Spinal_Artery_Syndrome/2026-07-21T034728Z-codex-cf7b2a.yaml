  summary: 'Re-review: Anterior Spinal Artery Syndrome'
  details: |
    Reconciled the entry to MONDO:0006650 as a territory-defined ischemic syndrome distinct from broader spinal cord ischemia and etiologic fibrocartilaginous embolism. Rebuilt the causal graph from arterial supply compromise through anterior-territory perfusion failure and tract-specific injury to connected clinical phenotypes; added dedicated MRI findings, diagnostic differentials, burden and progression. Calibrated aortic-repair prevention, CSF drainage with pressure augmentation, thrombolysis, and rehabilitation to the cited evidence strength; retained unresolved acute-treatment and human-model translation questions. Pruned tangential research references and verified all quoted evidence against local reference caches.

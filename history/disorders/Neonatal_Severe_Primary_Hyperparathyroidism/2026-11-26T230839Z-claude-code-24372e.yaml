  summary: 'Treatment-centred review and enrichment: Neonatal_Severe_Primary_Hyperparathyroidism'
  details: |
    Treatments. The bundled acute-management row was split into intravenous hydration, loop diuretic (furosemide), calcitonin and low-calcium feeding, and subtotal parathyroidectomy was separated from total parathyroidectomy so that the case reports supporting it and the review advising against it sit on the claim they concern. Every treatment except low-calcium feeding and genetic counselling now has target_mechanisms with a treatment_effect and its own evidence. Cinacalcet gained first-line, nine-year and non-response reports and two genotype effect_modifiers (monoallelic versus biallelic, a cross-study comparison stated by case-report authors; and an in vitro surface-expression result, recorded with the clinical report that contradicts it for I81K).

    Pathograph. PTH-Driven Skeletal Demineralization was split into PTH-Stimulated Osteoclastic Bone Resorption (the bisphosphonate and calcitonin target) and Skeletal Demineralization. Added Hungry Bone Syndrome After Parathyroidectomy (provisional; the calcium and calcitriol target) and a calcimimetic-occupancy node conforming to casr_positive_allosteric_modulation, following Familial_Hypocalciuric_Hypercalcemia_1. The renal node gained thick-ascending-limb cell and location bindings and mouse double-knockout evidence that the hypocalciuria is independent of PTH. New edges: PTH to renal reabsorption, PTH to hypophosphatemia, resorption to hypercalcaemia.

    Other sections. Phenotypes added: nephrocalcinosis (9 of 19 in the largest series), hypophosphatemia, raised alkaline phosphatase, polyuria, postoperative hypocalcemia. Biomarkers: LOINC on calcium and PTH, the 4.5 mmol/L homozygote band, alkaline phosphatase, phosphate, urinary calcium to creatinine ratio. Added progression, the Casr/Gcm2 double-deficient mouse, a HEK293 mutant-receptor model with typed divergences, and a knowledge-gap discussion on predicting cinacalcet response.

    Sources. Own PubMed and ClinicalTrials.gov sweep; 27 references newly cached with just fetch-reference and ORPHA:417 rebuilt. OpenScientist was submitted twice (just research-disorder openscientist) and both jobs timed out server-side after 3600 s without a report; a third run with a longer timeout was in progress when this record was written, so no OpenScientist content is in the entry. The existing claude_code report was not used for this pass; just preflight-dr on it could not run because OLS timed out and no local MONDO build is present.

    Left out. No clinical_trials block: ClinicalTrials.gov lists no interventional trial, and the one study naming the disease (NCT03655223, newborn screening) does not name it in the cached record, so it could not be quoted. No MGI gene bindings on the mouse models, because the Alliance lookup was unavailable. Corticosteroids, used in some reports, are not modelled. The classifications proposed in PR 18187 were not carried over because the ISDS number could not be checked.

    Validation: just validate-disorders (schema, terms, 165 of 165 snippets and titles), the whole-repo offline gates, list-disconnected-phenotypes (19 of 19 connected), check-conformance-content.

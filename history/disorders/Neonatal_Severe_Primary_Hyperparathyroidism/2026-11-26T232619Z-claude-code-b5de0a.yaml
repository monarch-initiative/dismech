  details: |
    Removed the cinacalcet effect modifier whose stratum was a set of CASR mutants in transfected HEK293 cells: effect_modifiers records patient subgroups, and no patient was stratified in that study. Its quote (PMID:35318962, no compound rescued expression of I81K and C582R) now sits as evidence on the HEK293 model's link to the calcimimetic node, whose limitations already state the I81K discordance. On the remaining monoallelic versus biallelic modifier, the description now says that genotype and severity are confounded in the source (the heterozygous responders are described by their lower calcium), the explanation says the quoted sentence carries only the heterozygous half of the contrast, and the quote is regraded OTHER with BACKGROUND to match the other case-report discussion sentences in the entry. Added treatment_effect INHIBITS to the Total Parathyroidectomy link to Parathyroid Chief Cell Hyperplasia. Re-ran just validate-disorders and the per-file offline gates.

  details: |
    New entry for MONDO:0009397 (CASR, biallelic loss of function; ClinGen Definitive AR copied from CGGV:assertion_095b6507-5537-4017-b2b9-28715cc23df7-2023-07-20T160000.000Z). Deep research: the requested Edison/falcon provider failed with HTTP 403 (ProviderAuthError), so the report is a claude_code fallback (fell_back: true in its frontmatter); it was used as leads only, and preflight-dr returned WARN only because the disease abbreviation NSHPT was counted as a gene symbol. Every evidence item was re-sourced from references_cache files fetched with just fetch-reference (21 PMIDs plus the ClinGen record); all 75 snippets verify. Ontology terms were taken from cache/*/terms.csv and confirmed with just validate-terms. Lump/split: kept separate from Familial_Hypocalciuric_Hypercalcemia_1 following ClinGen's split; FHH1 still carries an unbound NSHPT subtype row that should become a curated_in pointer to this entry in a separate PR. Monoallelic neonatal disease is a subtype with ClinGen's caveat cited as REFUTE, and no autosomal dominant inheritance block is bound. Validated with just validate, count-verified-snippets, validate-terms, check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-genereviews (no chapter), and validate-disorders.

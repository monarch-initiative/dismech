  summary: Record the ontology gap behind the CNS-involvement binding
  details: |
    The 'Central Nervous System Involvement' phenotype bound HP:0002011 (Morphological central nervous system abnormality), which is a structural term for what is actually leukemic infiltration. HPO has no better term: searches of 'leukemic infiltration' and 'central nervous system leukemia' return nothing, and the two presentations the source names (cranial nerve deficits, meningismus) have no exact HPO counterpart either - 'cranial nerve deficit' returns nothing, and the nearest match for meningismus is Nuchal rigidity, a narrower sign the source does not assert. Declared coarse_binding_basis NO_HPO_TERM with that search in term_gap and preferred_term changed to 'Leukemic central nervous system involvement' so the display name carries the concept the binding cannot. Validated with linkml-validate, the snippet audit (88/88) and the offline KB gates.

  summary: 'Address PR 17266 review feedback: remove untested insulin-signaling GO
    binding, fix tissue node_class, and retarget orthopedic/rehab treatments'
  details: |
    Removed unsupported biological_processes binding GO:0008286 (insulin receptor signaling pathway, modifier: ABNORMAL) from 'Biallelic PHLDB1 Loss-of-Function Eliminates PHLDB1 Protein' and softened the top-level and node descriptions to describe PHLDB1's normal reported role in insulin-dependent Akt phosphorylation (PMID:36543534) without claiming phosphoinositide binding or tested signaling disruption in patient bone cells, consistent with gap_oi23_phldb1_bone_mechanism_undefined. Replaced node_class FIBROSIS_REMODELLING with TISSUE_ORGAN_EFFECT on 'Defective Bone Formation and Skeletal Fragility'. Retargeted target_mechanisms on 'Orthopedic Surgery and Intramedullary Rodding' and 'Physical Therapy and Rehabilitation' to the phenotypes they address ('Bowing of the Long Bones' and 'Recurrent Fractures'). Added therapeutic_agent NCIT:C443 (Biphosphonate) on 'Bisphosphonate Therapy', adjusted 'Recurrent Fractures' and 'Osteopenia' frequency from VERY_FREQUENT to FREQUENT with explanatory notes reflecting 'recurrent fractures and/or osteopaenia' across the 5-patient cohort, and added a clarifying note on 'Skeletal Survey Radiography'.

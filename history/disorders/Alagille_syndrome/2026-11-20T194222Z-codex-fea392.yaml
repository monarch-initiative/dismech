  summary: Map Alagille syndrome to OMIMPS:118450
  details: |
    Checked actual series membership in January 2026 OMIM and class scope in September 2026 MONDO against the current Disease and its subtypes. PS118450 contains JAG1-related Alagille syndrome 1 (OMIM:118450) and NOTCH2-related Alagille syndrome 2 (OMIM:610205) in the January 2026 OMIM snapshot. The syndrome-level entry includes both genes and explicitly distinguishes JAG1 point variants, JAG1-containing 20p12 deletions, and NOTCH2 variants. These are also the three children of MONDO:0007318 in September 2026; their different granularity does not add a third gene-defined OMIM series member. Impaired developmental Notch signaling and the shared multisystem Alagille phenotype support a single Disease with these subtypes. ExactMatch includes the Alagille presentation of JAG1-containing deletions without attributing every additional contiguous-gene feature to JAG1 or extending the mapping to all cholestatic or Notch-related disorders.
    Corrected an existing spelling error in dataset description prose exposed by the commit hook.

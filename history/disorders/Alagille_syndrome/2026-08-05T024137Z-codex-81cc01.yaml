  summary: 'Publication readiness review: Alagille syndrome'
  details: |
    Completed a claim-level publication review against GeneReviews, disease-specific GALA natural-history cohorts, randomized maralixibat and odevixibat trials, and recent mechanistic literature. Separated JAG1 and NOTCH2 disease mechanisms and subtypes; added quantitative natural history, renal and ocular manifestations, histopathology, biochemical biomarkers, surveillance, supportive care, an approved drug, a phase III trial, and a preclinical JAG1-upregulating strategy; removed unsupported or misleading phenotype claims; and corrected ontology, evidence polarity, source type, snippet, scope, and pathograph issues. Cross-checked the repository deep-research artifact and performed a current primary-literature search. Deliberately omitted the Orphanet corneal-dystrophy row because disease-specific sources support anterior-segment findings rather than corneal dystrophy, and removed the ventricular-septal-defect frequency that had been inferred from tetralogy-of-Fallot evidence; neither claim should be restored from those sources without direct support.

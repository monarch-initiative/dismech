  summary: Correct module conformance placement and retract a prior history claim
  details: |
    Re-review of PR #7812 found that the 2026-08-12 record (2026-08-12T222223Z-claude-code-32600c.yaml) misstated its own change: it claimed the 'Primary Cardiomyocyte Insult' conformer had been given GO:0045214 sarcomere organization (ABNORMAL) and GO:0006936 muscle contraction (ABNORMAL). It had not. Those two processes landed on 'Cardiac Z-Disc Destabilization Under Mechanical Load', which declared no conforms_to, while the node that did declare conformance ('NEXN Missense Variants Impair Nexilin F-Actin Binding') carried no biological_processes at all. The module-consistency expectation in CLAUDE.md was therefore still unmet, and the incorrect history entry is what made the gap invisible on the first pass. History records are append-only, so that record is left intact and this one corrects it. Resolution: moved the conforms_to anchor onto the Z-disc node rather than duplicating the two processes onto the variant node. The Z-disc node is CELLULAR in scale, matching the module node's cell-level insult to cardiomyocyte contractile function, and already carries both expected processes plus CL:0000746 cardiac muscle cell; the variant node is MOLECULAR and describes loss of nexilin-actin binding, one level finer than the module models, so asserting the module processes there would duplicate the Z-disc node's claim without independent evidence at that scale. Rationale recorded in the entry notes. Verified: just validate passes (schema, terms, references); scripts/check_folded_hyphens.py exits 0; pytest -k conforms_to_module_node_references 2078 passed.

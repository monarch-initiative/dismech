  summary: 'Address PR #7812 review: GO terms, diagnosis block, treatment term'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7812. All five IMPORTANT items
    are addressed, plus three of the suggestions. One suggestion is declined with reasoning, and
    the reason is recorded in the entry itself.

    ITEM 1 - GeneReviews tagged but never mined. Added a top-level notes block recording that
    PMID:20301725's PubMed record is the six-point purpose statement with no Clinical
    Characteristics / Diagnosis / Management / Genetic Counseling narrative to quote, that no
    NEXN-specific GeneReviews chapter exists, and that the tag therefore records the parent
    overview having been checked rather than content having been drawn from it. Kept the tag
    rather than dropping it, per the first of the two options offered.

    ITEMS 2 and 3 - module-expected biological processes absent, and GO:0055008 in the wrong
    register. Both fixed together, since item 3's correct replacement is one of the terms item 2
    asks for. The Primary Cardiomyocyte Insult conformer now carries GO:0045214 sarcomere
    organization (ABNORMAL) and GO:0006936 muscle contraction (ABNORMAL); the Ventricular
    Remodeling conformer now carries GO:0014898 cardiac muscle hypertrophy in response to stress
    (INCREASED) and GO:0030198 extracellular matrix organization (INCREASED). GO:0055008 cardiac
    muscle tissue morphogenesis - a developmental term applied to adult remodeling - is gone, and
    GO:0055003 cardiac myofibril assembly (DECREASED) was likewise replaced by GO:0045214, per the
    related suggestion: the claim is destabilization of a formed Z-disc, not a failure of
    assembly. The module's own node contents were read directly rather than taken from the review,
    to confirm the expected term set.

    ITEM 4 - Standard Hypertrophic Cardiomyopathy Management mis-termed. The description spans
    pharmacotherapy, ICD placement and septal reduction while treatment_term was NCIT:C15986
    Pharmacotherapy, which named a third of it. Of the two remedies offered, the second was taken:
    retermed to the broader NCIT:C49236 Therapeutic Procedure and given therapeutic_modality
    OTHER, rather than narrowing the description. Narrowing would have misrepresented what the
    entry is doing - this is a deliberate single pointer to umbrella management, not a curated
    treatment. No therapeutic_agent was added for the same reason: naming metoprolol, verapamil or
    mavacamten here would imply NEXN-specific evidence for them, and there is none. The reasoning
    is recorded in the treatment notes.

    ITEM 5 - no diagnosis block, and the reporting claim in the wrong place. Added a diagnosis
    entry for cardiomyopathy gene panel testing (NCIT:C15709) built around the clinically
    consequential fact, which is a reporting rule rather than a testing indication: ClinGen places
    limited, no-evidence and disputed genes in a single uncertain-significance tier and states
    that disputed-evidence genes are not appropriate for diagnostic reporting. Both quotes the
    review extracted from PMID:39132495 are used verbatim. The entry states what follows - a NEXN
    variant is not a molecular diagnosis, must not direct predictive cascade testing, and does not
    discharge a family from clinical surveillance - and its notes record that this caveat
    previously lived only in the genetic counseling treatment, inferred from a generic Ingles-2019
    quote, and has been moved to the section that governs test interpretation and sourced directly
    from the panel that classifies NEXN.

    SUGGESTION taken - prevalence. Added a CASES_IN_LITERATURE / NOT_YET_DOCUMENTED record with
    the 0.14% figure in notes, as suggested, plus a point worth making explicit: a Limited entity
    that should not be diagnostically reported arguably cannot have a population prevalence at
    all, and the 0.14% counts variant carriage rather than established causation, which the source
    itself says. The evidence item is PARTIAL and its explanation notes the asymmetry the same
    sentence reveals - NEXN variants were more than twice as common in dilated as in hypertrophic
    cardiomyopathy in that cohort.

    SUGGESTION declined, with the reason recorded in the entry's notes - the missing phenotypes
    (atrial fibrillation, reduced LVEF, sudden cardiac death) and the scoping asymmetry the review
    asked for a rationale on. On checking the source rather than the DR summary, these phenotypes
    cannot be curated for this entity: in PMID:38059363 the median ejection fraction of 37.5% is
    explicitly "for patients with dilated cardiomyopathy", and the arrhythmic events and sudden
    infant deaths are reported without attribution to the three hypertrophic probands, with the
    authors stating that a causal link could not be established. Adding them would move a DCM
    observation onto an HCM entity - exactly the confusion this entry's DISPUTED framing and
    external_assertions exist to prevent. The notes state that, explain why disarray and fibrosis
    are nonetheless retained (they are definitional for the entity the MONDO term names, so their
    absence would mislead), and record what would justify adding the clinical phenotypes later: a
    cohort reporting them in NEXN HCM carriers specifically. The onset suggestion is declined on
    the same ground - the median age at diagnosis of 32.0 is for all 29 probands, a
    mixed DCM/HCM population, not for the HCM subgroup.

    Also noted, not actioned here because it is out of scope for this PR: the review's observation
    that kb/disorders/Hypertrophic_Cardiomyopathy.yaml carries a NEXN entry citing the same CGGV
    Limited assertion without relationship_type: DISPUTED, which is now inconsistent with this
    entry. That belongs in its own PR against the umbrella entry.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_20.yaml' passes
    in full - schema, terms, references - with "Snippets checked: 30/30 verified against cached
    references", up from 27/27. All replacement GO terms were confirmed against the module's own
    node definitions before use. The branch was rebased onto current origin/main; the rebase
    conflicted only on two generated cache CSVs, resolved to main's side with this entry's rows
    re-derived by just validate-terms rather than hand-merged.

  summary: 'Create: Hypertrophic Cardiomyopathy 20 (NEXN)'
  details: |
    Created kb/disorders/Hypertrophic_Cardiomyopathy_20.yaml for MONDO:0013477 (CMH20; OMIM 613876; NEXN / hgnc:29557). NEC preflight against sqlite:obo:mondo confirmed causal gene NEXN, the OMIM:613876 xref, and is_a MONDO:0024573 familial hypertrophic cardiomyopathy. Duplicate preflight against fresh origin/main found no existing entry for MONDO:0013477 or for its parent MONDO:0024573. Deep research: the falcon provider was unavailable in this environment (no EDISON_API_KEY / FUTUREHOUSE_API_KEY), so the claude_code provider was used instead - research/Hypertrophic_Cardiomyopathy_20-deep-research-claude_code.md, 17 web searches, 55 turns, 26 citations. The DR report independently converged on the same Limited-validity framing used here, and its gene mention counts (NEXN 144 vs MYBPC3 4, MYH7 2, TNNT2 1) rule out named-entity confusion. KEY CURATION DECISION: this entry is deliberately curated as a CONTESTED entity rather than as an established mechanism. ClinGen's Hereditary Cardiovascular Disease GCEP classifies NEXN-HCM as Limited (CGGV assertion 9456bdef, 2023-03-23, SOP9), and the published ClinGen HCM reappraisal (PMID:39132495) names NEXN explicitly among six genes retaining a Limited classification. The largest NEXN carrier cohort to date (PMID:40680702, 60 carriers) found NEXN truncating-variant enrichment in DCM/NDLVC but no association with HCM; that item is recorded with supports REFUTE. PMID:38059363 found three HCM probands (0.14 percent) but states a causal link could not be established. The CMH20 designation as a whole rests on PMID:20970104 (Wang 2010: two families, two missense variants, loss of F-actin binding in vitro). Mechanistic framing is Z-disc / F-actin anchorage failure rather than thick- or thin-filament cross-bridge kinetics, since NEXN encodes nexilin, an F-actin-binding Z-disc protein. Pathophysiology is a three-node chain tagged MOLECULAR, CELLULAR, TISSUE with mechanism_confidence PROVISIONAL then HYPOTHETICAL then HYPOTHETICAL, conforming to cardiomyopathy_maladaptive_remodeling at the Primary Cardiomyocyte Insult and Ventricular Remodeling nodes. The Z-disc to hypertrophy edge is INDIRECT_UNKNOWN_INTERMEDIATES because every published nexilin model system yields a dilated phenotype. genetic[0] uses relationship_type DISPUTED and carries a case_fraction of 0.14 percent; genetic[1] records the better-supported NEXN dilated cardiomyopathy association purely as differential context to prevent future NEC. No phenotype carries a frequency band: the reported carrier count is too small and the validity too uncertain to justify one. Three discussions are recorded, each with proposed_experiments - a CONTROVERSY on gene-disease validity, a HUMAN_MODEL_MISMATCH on the dilated-versus-hypertrophic model discrepancy, and a KNOWLEDGE_GAP on the absent clinical phenotype detail. Validation: just validate PASS, just validate-references PASS with 27 of 27 snippets verified, just validate-terms PASS, snippet-length ratchet PASS, compliance 81.8 percent global and 82.4 percent weighted. NOTE for maintainers: PMID:40161564 was fetched but deliberately NOT cited and its cache file was removed, because the fetch appended an unrelated full-text PDF (full_text_url pointed at PMC8359989) beneath a correct abstract - a cache-integrity issue worth reporting upstream.

  summary: 'Create: Immunodeficiency 86'
  details: |
    New entry for SPPL2A deficiency (MONDO:0030448), curated from six primary references fetched into the cache for this PR. Sources found by PubMed search; every PMID was real before citation and all ontology terms verified against OLS before binding.

    The entry's organising decision is that this is a gain-of-toxic-substrate disease presenting as a signalling deficiency, and the pathophysiology is ordered to make that explicit. Most MSMD genes sit in the IFN-gamma/IL-12/IL-23 circuit and the disease follows from losing a signal; here nothing in that circuit is mutated. The uncleaved CD74 N-terminal fragment accumulates and is toxic to CD1c-positive cDC2s specifically, and the IFN-gamma failure is downstream and secondary. Placing SPPL2A alongside the IL12RB1-type lesions it phenocopies would invert the mechanism.

    The Sppl2a-/- CD74-/- double knockout is curated as its own animal_models entry with relationship RESCUES, because it is the epistasis control that makes the substrate-toxicity claim causal rather than correlative: deleting the substrate rescues the depleted cell type.

    A FAILS_TO_RECAPITULATE link records that the murine B-cell phenotype does not model the human one. The mouse lacks mature B-cell subsets and phenocopies BAFF deficiency; the one human patient with reported B-cell numbers had hypogammaglobulinaemia with normal B-cell counts. The divergence is localised: the upstream molecular step is demonstrably conserved (human SPPL2a-null B-cell lines accumulate CD74 NTF comparably to mouse), so species divergence appears downstream of substrate accumulation rather than at it. The limitations field records that the human side is a single patient.

    The murine dendritic-cell cytokine-shift finding is graded PROVISIONAL and its supporting quote is the authors' own proposal, quoted as a proposal.

    Validation: schema clean, terms clean, 28/28 snippets verified, all offline gates clean.

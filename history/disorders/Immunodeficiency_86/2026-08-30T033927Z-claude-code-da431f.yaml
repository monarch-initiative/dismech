  summary: 'Review round 1: add the TNF-alpha ICD route to IL-12 and soften the headline
    claim'
  details: |
    Addressed the round-1 review on PR 10130. The blocking finding was that the entry's organising claim - that SPPL2A sits outside the IFN-gamma/IL-12/IL-23 circuit and nothing in that circuit is mutated - is contradicted by PMID:16829952 (Friedmann 2006), which was uncited.

    Verified against the newly fetched cache: SPPL2a and SPPL2b catalyse intramembrane cleavage of TNF-alpha, and the released intracellular domain triggers IL-12 expression in activated human dendritic cells. That is a direct, cell-intrinsic route from the protease to the cytokine whose absence defines MSMD, requiring no cell death and no CD74 fragment.

    Rather than delete the distinction, which is still real, the claim was softened: most MSMD genes encode components of the circuit itself, SPPL2A is not one of those, but it does have one direct link into the IL-12 arm. The description, the notes' lump/split rationale, and the discussion all now say this.

    A new pathophysiology node, Loss of TNF-alpha Intracellular Domain Signalling to IL-12, was added off the trigger node rather than off the depletion node, since the route bypasses CD74 entirely. Graded PROVISIONAL with two caveats stated in the node description: the source characterises SPPL2a and SPPL2b jointly and never isolates SPPL2a, and the work is in human dendritic cells in vitro rather than in patient cells.

    The dc_loss_versus_dc_dysfunction discussion was rewritten from a two-way to a three-way question, noting that the TNF-alpha route is the only one of the two functional accounts with human data behind it, and the proposed experiment now assays TNF-alpha ICD release alongside per-cell cytokine output so a deficit can be attributed rather than left ambiguous.

    Non-blocking items taken: NCIT:C280 Antitubercular Agent as therapeutic_agent, and a top-level references block.

    Not taken: PMID:36630059 was deliberately not cited. The reviewer flagged probable cohort overlap with Kong 2018's Moroccan kindreds via shared authors, and citing it as independent additional patients without resolving that would inflate the patient census.

    Validation: 30/30 snippets verified (was 28/28; two new items from the new reference), schema and terms clean, all offline gates clean.

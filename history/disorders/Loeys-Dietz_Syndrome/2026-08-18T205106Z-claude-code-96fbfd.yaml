  summary: Bind LDS Type 2 subtype to MONDO:0012427 (TGFBR2)
  details: |
    Bound the previously unbound "Loeys-Dietz Syndrome Type 2" subtype in
    kb/disorders/Loeys-Dietz_Syndrome.yaml to MONDO:0012427 (Loeys-Dietz syndrome 2)
    and hgnc:11773 (TGFBR2), adding display_name, subtype_term, genes,
    a cohort-qualified subtype_frequency, an expanded description, review_notes,
    and 13 evidence items.

    Scope decision - bind vs standalone. Bound the existing subtype rather than
    creating a standalone kb/disorders/Loeys-Dietz_Syndrome_2.yaml, mirroring the
    merged LDS1 binding in PR #8807. Three reasons: MONDO:0012427 carries the
    ordo_subtype_of_a_disorder subset and is_a MONDO:0018954, so MONDO itself
    models it as a subtype; the umbrella entry already carried a
    "Loeys-Dietz Syndrome Type 2" placeholder and a "TGFBR2 Mutations (LDS Type 2)"
    genetic block, so a standalone file would have duplicated the concept; and the
    immediately analogous sibling issue (#8748, LDS1) was resolved by binding. Edits
    are confined to the single has_subtypes Type 2 block to minimise collision with
    the concurrent LDS4 (#8750) and LDS6 (#8751) curation branches.

    MONDO-vs-OMIM gene discrepancy - resolved to TGFBR2. MONDO:0012427's free-text
    definition, imported from NCIT:C114768, names "either the TGFBR1 or TGFBR2
    gene". That wording preserves the older gene-agnostic CLINICAL sense of
    "Loeys-Dietz syndrome type II" from Loeys et al. 2006 (PMID:16928994), in which
    type II denoted a craniofacially spared, vascular-Ehlers-Danlos-like
    presentation and probands of both types carried TGFBR1 or TGFBR2 mutations.
    MONDO's logical axioms (intersection_of: RO:0004003 HGNC:11773), its
    disease_series_by_gene synonyms ("TGFBR2 Loeys-Dietz syndrome", "Loeys-Dietz
    syndrome caused by mutation in TGFBR2"), and the OMIM:610168 xref all define the
    modern gene-based class unambiguously as TGFBR2. Bound to TGFBR2 and recorded
    both senses as an explicit nosology note in the subtype description, with the
    Loeys 2006 quote cited, so the stale prose is not silently re-inherited by a
    future curator.

    Severity framing. The pre-existing description's later mean age at surgery (26.9
    years) and death (31.8 years) came from the clinically defined type II cohort,
    not a TGFBR2-genotyped one, and reads as though LDS2 were milder. Added the
    counterweight evidence: uniformly grade III cystic medial necrosis in
    TGFBR2-mutated aortas (PMID:33408307), larger aortic z-scores and stiffer, less
    distensible aortas in a paediatric TGFBR2 cohort (PMID:38774681), and the
    gene-based ranking LDS1=LDS2>LDS3>LDS4>LDS5 (PMID:31569402). Mechanism evidence
    covers the dominant-negative model in vitro (PMID:21098638, PMID:28679693) and
    in a Tgfbr2 knockin mouse (PMID:24355923, MODEL_ORGANISM, offered only as
    mechanistic corroboration). The TGFBR2 Arg528Cys exudative-vitreoretinopathy
    association (PMID:41024485) is graded supports: PARTIAL because it rests on two
    reported cases and is recorded as allele-specific, not a subtype-level
    phenotype.

    Self-review pass. A red-team review before opening the PR found and fixed four
    substantive issues. (1) PMID:33408307's abstract conclusion asserts that female
    TGFBR2 carriers had more frequent dissection AND reoperation, but the paper's own
    RESULTS report reoperation as a non-significant trend (p = 0.08, n = 6) with no
    group-level difference (p = 0.19); the snippet was re-quoted from RESULTS, regraded
    PARTIAL, and the reoperation half is deliberately not curated. (2) Removed an
    unsourced "mutations cluster in the kinase domain" distribution claim that no cited
    reference supports. (3) Replaced a bare subtype_frequency of "55-60%" - traceable
    only to the deep-research report and to unsourced pre-existing prose - with the
    cohort-qualified figure the cited literature supports, 10/24 families (~42%) in
    PMID:31569402, plus a supporting evidence item. (4) Caveated the two retained
    clinical-sense claims inline and added PMID:38774681's finding that craniofacial
    features were similar between genotyped TGFBR1 and TGFBR2 groups, so the
    "craniofacially spared" framing of the 2006 clinical cohort is not silently
    inherited into a gene-defined block. Also moved the MONDO definition analysis into
    review_notes and extended two snippets to their qualifiers.
    
    Deep research: falcon, research/Loeys-Dietz_Syndrome_2-deep-research-falcon.md.
    Its own reference validation reported 10/10 references resolved, 0 unresolved,
    0 off topic (of 10 assessed for relevance, 4 were affirmatively on topic and the
    remainder undecided rather than flagged). NEC preflight (just preflight-dr <report> MONDO:0012427) returned
    PASS with TGFBR2 mentioned 45 times against TGFBR1 8. The report was used for
    corroboration and for the 55-60% subtype fraction; every snippet curated here
    was taken from a primary abstract fetched via just fetch-reference and checked
    against the local cache, not from the report text.

    GeneReviews baseline: PMID:20301312 (Loeys-Dietz Syndrome) is genus-level,
    covering all six genetic types without an LDS2-specific Clinical
    Characteristics breakout, so it remains the baseline for the umbrella entry's
    phenotypes block rather than for this subtype binding. No LDS2-specific
    GeneReviews chapter exists.


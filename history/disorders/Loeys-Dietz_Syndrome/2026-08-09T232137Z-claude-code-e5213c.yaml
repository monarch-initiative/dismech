  summary: Add reciprocal Marfan differential diagnosis with MFS2 nosology note
  details: |
    Added the reciprocal differential_diagnoses block for Marfan Syndrome (disease_term MONDO:0007947) -- the entry's first. Pairs with the Loeys-Dietz differential added to kb/disorders/Marfan_Syndrome.yaml in the same change, so the differential resolves from either direction.

    Distinguishing features: ectopia lentis as the positive Marfan finding (cardinal under the revised Ghent nosology, 0/16 in the original LDS cohort), the LDS-characteristic hypertelorism / bifid uvula or cleft palate / arterial tortuosity, aneurysm and dissection occurring earlier, at smaller diameters and throughout the arterial tree rather than centered on the aortic root, and FBN1 versus TGFBR1/TGFBR2/SMAD3/TGFB2 on molecular testing.

    Four evidence items cite PMID:20591885 (revised Ghent nosology), PMID:15731757 (Loeys, Nat Genet 2005), PMID:16928994 (Loeys, NEJM 2006) and PMID:24577266 (MacCarrick LDS primer, already cited elsewhere in this entry).

    The notes field carries the same historical-nosology record as the Marfan entry: MFS2 was obsoleted by MONDO as MONDO:0017308 with no replacement term, retired as a dubious entity rather than mapped to Loeys-Dietz syndrome, and the obsolete CURIE must not be cited as a term. LDS is modeled as its own Disease entry and a sibling member of the Heritable_Thoracic_Aortic_Disease grouping, never as a Marfan subtype.

    Validation: just validate (passed), just validate-terms (passed), just count-verified-snippets over both touched files (217/217 verified, 0 skipped by prefix), and just validate-disorders over both files (schema + terms + references batched, --no-full-text; passed). tests/test_data.py run over the full KB.

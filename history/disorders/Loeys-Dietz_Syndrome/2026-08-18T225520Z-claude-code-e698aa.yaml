  details: |
    Review-response session addressing the CHANGES_REQUESTED review on PR #8861.
    Scope confined to the Loeys-Dietz Syndrome Type 2 subtype block, the TGFBR2
    genetic block, and the top-level references list.

    CORRECTION OF A FALSE PROVENANCE STATEMENT IN THE PRIOR RECORD
    (2026-08-18T205106Z-claude-code-96fbfd.yaml). That record justified replacing
    the 55-60% TGFBR2 subtype fraction with a cohort-qualified "10/24 families
    (~42%)" on the premise that 55-60% was traceable only to the falcon deep-research
    report and that "no reference cited in this entry establishes" it. That premise
    was WRONG. references_cache/PMID_29270370.md - added by this same PR - carries
    the source table (Table 1, LDS subtypes) with the rows "LDS type 1 TGFBR1 20-25%"
    and "LDS type 2 TGFBR2 55-60%". The 55-60% figure was therefore always sourceable
    from a cached primary reference, and the red-team "fix" introduced a contradiction
    with the TGFBR2 genetic block note and with the sibling LDS1 subtype_frequency of
    20-25%. This record supersedes that statement; the earlier record is left
    unedited, as history is append-only.

    Changes made:
    1. subtype_frequency on Loeys-Dietz Syndrome Type 2 restored to "55-60%", with a
       new PMID:29270370 evidence item quoting the subtype-table row verbatim
       (en dash as printed in the source). The PMID:31569402 10/24 (~42%) item is
       retained and its explanation rewritten: it is now recorded as independent
       single-cohort corroboration that TGFBR2 is the most frequently affected LDS
       gene, explicitly not as the source of subtype_frequency. The sibling LDS1
       20-25% and the TGFBR2 genetic-block note are now mutually consistent and
       traceable to the same cached table.
    2. Added the missing foreign key subtype: Loeys-Dietz Syndrome Type 2 to the
       genetic[] block "TGFBR2 Mutations (LDS Type 2)", matching its TGFBR1 sibling.
       The earlier deferral on collision-risk grounds was thin: the block is
       spatially distinct from the concurrent LDS4 (#8750) and LDS6 (#8751) work,
       and this FK is the payoff of binding the subtype at all. The same
       PMID:29270370 row was added there to substantiate the 55-60% claim in its
       notes.
    3. GeneReviews baseline corrected. The prior record asserted that PMID:20301312
       (GeneReviews, Loeys-Dietz Syndrome) "remains the baseline for the umbrella
       entry's phenotypes block" - but it was cited nowhere in the entry and carried
       no tag. It is now recorded in the top-level references list with
       tags: [GeneReviews]. The genus-level scoping argument for not using it inside
       the LDS2 subtype block stands: the chapter covers all six genetic types with
       no LDS2-specific Clinical Characteristics breakout, and no LDS2-specific
       GeneReviews chapter exists.


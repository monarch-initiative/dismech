  summary: Bind MONDO:0012212 (Loeys-Dietz syndrome 1) to the existing LDS Type 1
    subtype
  details: |
    Resolved GH issue #8748 (curate Loeys-Dietz syndrome 1, MONDO:0012212, OMIM:609192, Orphanet:97295, canonical gene TGFBR1). Decision: bound MONDO:0012212 onto the existing has_subtypes entry 'Loeys-Dietz Syndrome Type 1' in kb/disorders/Loeys-Dietz_Syndrome.yaml (MONDO:0018954) rather than creating a standalone Disease entry, because OAK confirms MONDO models 0012212 as is_a 0018954 with intersection_of TGFBR1 and tags its synonym with the MONDO patterns disease_series_by_gene design pattern (a mechanical disease-by-gene cross product, not an independently characterized clinical entity), in contrast to Aneurysm-Osteoarthritis_Syndrome.yaml (MONDO:0013426, LDS type 3), which IS a standalone entry with its own historical name, OMIM id, and a qualitatively distinct defining phenotype. Added subtype_term MONDO:0012212, genes TGFBR1 hgnc:11772, and subtype_frequency 20-25 percent to the Type 1 subtype block; enriched its description and evidence with TGFBR1-specific findings independently verified via PubMed: PMID:40612107 haploinsufficiency plus dominant-negative kinase-domain mechanism, PMID:33408307 milder cystic-medial-necrosis histology vs TGFBR2/LDS2, PMID:31569402 gene-based severity ranking LDS1 equal LDS2 greater than LDS3 greater than LDS4 greater than LDS5. Linked the existing TGFBR1 genetic block to the subtype via subtype and added a dominant-negative variant example K232R and R487P. Wired two TGFBR1-genotype-specific models into the pathograph via modeled_mechanisms: Gallo et al 2014 PMID:24355923 Tgfbr1 M318R knock-in mouse targeting Paradoxical TGF-beta Signaling; Yang et al 2024 PMID:38718134 hiPSC TGFBR1 A230T bioengineered vascular graft targeting Extracellular Matrix Degradation. Falcon deep research was run against a throwaway placeholder file, deleted before commit, to satisfy the research-first workflow; report at research/Loeys-Dietz_Syndrome_1-deep-research-falcon.md, 0 percent confabulation rate, 8 of 8 references verified. just preflight-dr against MONDO:0012212 returned PASS, TGFBR1 mentioned 35 times vs TGFBR2 3 times. Validated with just validate schema plus terms plus references, 101 of 101 snippets verified, just check-duplicate-keys, just check-reference-cache-frontmatter repo-wide OK, and a pytest tests/test_data.py subset covering subtype, model, and foreign-key tests.

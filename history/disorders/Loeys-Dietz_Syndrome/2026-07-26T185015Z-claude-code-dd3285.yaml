  summary: 'Review: qualify cross-disease MAPK claim, extend immune snippet (ECM review
    r2)'
  details: |
    Round-2 ECM claim-evidence review. Fixed: (1) the Noncanonical MAPK Pathway Activation node asserted that ERK1/2 and JNK 'are prominently activated in LDS aortic tissue', but its sole citation PMID:21493862 is titled 'Noncanonical TGFbeta signaling contributes to aortic aneurysm progression in Marfan syndrome mice' and its snippet says 'in MFS mice'. The description now states that the direct experimental evidence comes from Marfan mouse models and that the extension to LDS rests on the shared TGF-beta axis, and the evidence item is downgraded SUPPORT -> PARTIAL. (2) The Immune Dysregulation node asserted 'food allergy (31%)' in its description and repeated the 31% and 6-8% figures in an explanation, while the quoted snippet contained no figures at all; the figures are present in the paper's full text, so the snippet was extended to carry them rather than the claim being weakened. Noted but not fixed: the Extracellular Matrix Degradation node carries no evidence whatsoever despite making a specific mechanistic claim (MMP upregulation, reduced tissue inhibitors, elastic-fibre and collagen degradation) and feeding 13 downstream edges - the largest single evidence gap found across both review rounds; tracked in issue #7025.

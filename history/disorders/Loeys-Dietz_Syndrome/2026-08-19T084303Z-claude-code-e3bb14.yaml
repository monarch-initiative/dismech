  details: |
    Now that the three concurrent per-type LDS PRs (#8861 LDS2, #8862 LDS4, #8864 LDS6) have all merged, this addresses the safe, non-controversial portion of #8866's reconciliation checklist plus the fix requested by #8867: bound subtype_term (with genes) on the previously-unbound Type 3/4/5 stubs and added the previously-entirely-missing Type 6 row, each pointing to MONDO:0013426/0013897/0014262/0030500 respectively. Fixed the Type 4 stub, which stated 'lower prevalence of musculoskeletal involvement' -- the transposed opposite of PMID:25163805's conclusion that articular/skeletal signs are prevalent in LDS4 while it is the vascular phenotype that is comparatively mild -- and added that citation as evidence. Added review_notes on all four rows cross-referencing the richer standalone entries (Aneurysm-Osteoarthritis_Syndrome.yaml, Loeys-Dietz_Syndrome_4.yaml, Rienhoff_Syndrome.yaml, Loeys-Dietz_Syndrome_6.yaml) and explicitly flagging that the umbrella-vs-standalone authoritative-locus question is still open. Deliberately did NOT touch the Heritable_Thoracic_Aortic_Disease grouping membership, retire/merge the standalone entries, add mondo_mappings narrowMatch rows, or fix the now-stale claim in Thoracic_Aortic_Aneurysm.yaml -- those all depend on a human decision on the authoritative-locus question (#8866 item 4) that this PR does not make. Validated: just validate (schema+terms+119/119 snippets verified), just check-duplicate-keys, just check-groupings (HTAD grouping unaffected/still evaluates), and the full tests/test_data.py subtype-foreign-key suite (2030 passed).

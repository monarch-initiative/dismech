  details: |
    Issue #8866 asked for the Loeys-Dietz_Syndrome umbrella reconciliation to be finished once the LDS2/LDS4/LDS6 per-type PRs landed. Verified items 1-3 of the issue were already complete: LDS6/SMAD2 is bound to MONDO:0030500 in has_subtypes, test_subtype_foreign_keys passes for this file, and just check-groupings on Heritable_Thoracic_Aortic_Disease evaluates Loeys-Dietz Syndrome membership as SATISFIED. Only item 4 (decide and record the umbrella-vs-standalone authoritative locus for per-type detail) remained open -- the has_subtypes review_notes for Types 3, 4, 5, and 6 each repeated the same 'remains an open curation decision' language rather than a resolution, even though the disease-level mappings.mondo_mappings comment already assumed the standalone-is-authoritative convention. Formalized that decision: added a top-level notes: block stating standalone entries (Aneurysm-Osteoarthritis_Syndrome, Loeys-Dietz_Syndrome_4, Rienhoff_Syndrome, Loeys-Dietz_Syndrome_6) are authoritative for full per-type curation, with the umbrella has_subtypes rows kept as deliberately thin term-bound cross-references; Types 1 and 2 remain fully curated in the umbrella since they have no standalone entry. Updated the four review_notes blocks to point at this decision instead of calling it open. No content, evidence, or term bindings were changed. Validated with just validate, just count-verified-snippets (119/119), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-enum-values, and pytest test_subtype_foreign_keys.

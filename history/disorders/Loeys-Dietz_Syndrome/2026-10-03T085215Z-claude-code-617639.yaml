  summary: Wire SMAD2, SMAD3, TGFB2, TGFB3 into Paradoxical TGF-beta Signaling
  details: |
    Issue #12034. Attached the four non-receptor LDS genes (SMAD3/LDS3, TGFB2/LDS4, TGFB3/LDS5, SMAD2/LDS6) to the existing Paradoxical TGF-beta Signaling node rather than a new node, because Bertoli-Avella 2015 (PMID:25835445) reports the same aortic-wall paradox for TGFBR1/2, SMAD3, TGFB2 and TGFB3. Rewrote the node description to name the ligand and effector lesions and to state that SMAD2/SMAD3 appear both as lesion and as phosphorylated readout. SMAD2 is attached on pathway membership (Schepers 2018 review, PMID:29392890), and the description says no cited source measures the paradox for SMAD2 variants. Validated with just validate, validate-terms, count-verified-snippets (122/122), subtype-usage-audit (no ABSENT rows remain).

  summary: Add mondo_mappings for LDS1/LDS2 leaf classes (#8866)
  details: |
    Issue #8866 item 1: added top-level mappings.mondo_mappings (skos:narrowMatch) for LDS1 (MONDO:0012212) and LDS2 (MONDO:0012427) only. Checked scripts/grouping_mondo_gaps.py first, per the issue's own caveat against blindly copying the FTAAD precedent: its disorder_mondo_index() reads only disease_term and top-level mappings, not has_subtypes[].subtype_term, so LDS1/LDS2 -- which have no standalone dismech entry -- were invisible to the grouping-to-MONDO descendant-coverage audit despite being fully curated as umbrella subtypes. LDS3/4/5/6 were NOT added here because each already has its own standalone entry (Aneurysm-Osteoarthritis_Syndrome, Loeys-Dietz_Syndrome_4, Rienhoff_Syndrome, Loeys-Dietz_Syndrome_6) whose own disease_term already indexes that MONDO id; verified via grep and by calling disorder_mondo_index() directly. Remaining #8866 items (HTAD grouping members expansion, IPO8 gap, top-level locus-decision ratification) are out of scope -- each needs a human judgment call per prior audit comments.

  summary: 'Create: Periprosthetic Joint Infection'
  details: |
    Created a MONDO:0800179 periprosthetic joint infection entry from the OpenScientist fallback report and direct reference checks. Bound Staphylococcus aureus, Staphylococcus epidermidis, and Streptococcus as human PJI pathogens; connected arthroplasty hardware and persistent wound drainage to bacterial seeding; modeled staphylococcal prosthesis biofilm formation, monocyte/Th17 immune suppression, chronic peri-implant inflammation, and painful prosthesis failure; added arthralgia, joint swelling, fever, and sepsis phenotypes; and recorded DAIR, vancomycin, and rifampicin treatment mechanisms plus a spontaneous canine total hip replacement PJI comparator. Excluded report ontology suggestions whose cached labels disagreed with their proposed meanings.

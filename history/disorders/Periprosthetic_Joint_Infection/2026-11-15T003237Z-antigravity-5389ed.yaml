  summary: Add classification and progression evidence, primary and megaprosthesis
    prevalence, NCIT diagnosis binding, StatPearls reference tag, and differentials
  details: |
    Added evidence to INFECTIOUS_DISEASES and IMMUNE_RHEUMATOLOGIC Harrison's classifications (PMID:31086080, PMID:41511894); added primary arthroplasty (0.2-2%) and megaprosthesis (15-43%) prevalence records (PMID:31086080, PMID:40713651, PMID:40468465); bound NCIT:C220175 on PJI diagnostic criteria; added evidence to Late chronic infection and Acute hematogenous infection progression phases (PMID:41511894); tagged PMID:28846340 as [StatPearls] in references; and added aseptic prosthetic loosening/wear-particle inflammation (PMID:42524013) and native joint infective arthritis (MONDO:0042485, PMID:41511894, PMID:40713651) differential diagnoses.

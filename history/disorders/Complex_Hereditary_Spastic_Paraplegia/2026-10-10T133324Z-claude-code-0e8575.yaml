  summary: Ground NT5C2 (5'-nucleotidase) and baseline ARL6IP1 on the HSP nodes
  details: |
    Gene-activity grounding gate flagged two newly-wired genes. NT5C2, on the 'Purine Nucleotide Metabolic Imbalance' node (a 3-gene purine-enzyme bundle; AMPD2/ENTPD1 already grandfathered), bound GO:0008253 5'-nucleotidase activity (DECREASED, biallelic LoF in SPG45), the activity the node's own description states. ARL6IP1, on 'Tubular Endoplasmic Reticulum Membrane Shaping Failure', has no GO molecular-function annotation matching its reticulon-like ER-membrane-shaping role (UniProt Q15041: only generic protein binding), so it is grandfathered in tests/gene_activity_grounding_baseline.txt, same pattern as SSR4/FHL1. Merged origin/main (no conflicts). Gate OK in ref mode; validate and validate-terms pass; pytest -k passes.

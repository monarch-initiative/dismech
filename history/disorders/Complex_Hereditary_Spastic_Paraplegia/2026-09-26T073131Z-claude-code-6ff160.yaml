  summary: 'Genetics pass: 26 gene-defined complex-HSP subtype rows, 29 genes wired
    into the pathograph'
  details: |
    Genetics pass for the complex-HSP subtype series (d2g series-016, issue #12223). Checked the parent's disease_term anchor (MONDO:0015150) against the over-broad-anchor pattern of dismech#12184 and left it in place: the entry is the syndromic grouping itself, MONDO defines the class as a hereditary spastic paraplegia that is part of a larger syndrome, and ClinGen curates five of the genes recorded here (DSTYK, B4GALNT1, VPS37A, ENTPD1, MAG) directly against that class. Added 26 gene-defined has_subtypes rows, each with a bound MONDO subtype_term, its causal gene(s) read live from HGNC, an inheritance block and cited evidence; added 26 reciprocal genetic records with subtype foreign keys and re-pointed the three existing SPART, ZFYVE26 and AP4B1 records off the generic AR bucket onto their own rows. AP-4-associated HSP is curated as ONE row with four genes (AP4B1, AP4E1, AP4M1, AP4S1) bound to MONDO:0100176, on the strength of the single GeneReviews AP-4-HSP chapter, four Definitive ClinGen assertions against that one entity, and MONDO's own integrated class definition; MONDO's four gene-generated SPG47/50/51/52 classes are recorded in notes rather than curated as separate rows, and the bare gene-generated definition form was not treated as an ontology defect because two classes this entry does bind carry the same form. Wired all 29 genes into the pathograph: five new mechanism-specific pathophysiology nodes (endolysosomal/autophagic/ESCRT traffic, membrane-lipid and ganglioside metabolism, mitochondrial and Fe-S cluster assembly, kinesin-dependent axonal cargo transport, IP3-receptor-dependent ER calcium release), each with GO bindings supported by its own cited snippets and a downstream edge into an existing node; CAPN1 bound on the core corticospinal node; the remaining ten genes bound on the existing pleiotropic node. Also wired two pre-existing records that reached no node: FA2H to the lipid node and L1CAM to the pleiotropic node, taking the entry to 34/34 causal genes wired to a mechanism. Repaired three pre-existing reference-validator failures in this file that would otherwise have failed CI on the touched file: the PMID:18394578, PMID:20104589 and PMID:12134148 snippets were quotes taken from the papers' titles and did not verify against the abstracts, and were requoted from the abstract text without changing the claims. Reflowed eight folded-scalar lines that ended in a hyphen. Validation: just validate 132/132 snippets, 0 issues; validate-terms passed; list-gene-term-mismatches examined 105 HGNC bindings with 0 mismatches and 0 uncached; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-case-collisions, check-folded-hyphens all clean; subtype-usage-audit reports every new row fully wired. Every snippet was checked against the paper's PubMed abstract text, not only against the cached body, because the CI gate runs with --no-full-text. Orphanet could not be consulted: no ORPHA record for any of these concepts is in references_cache.

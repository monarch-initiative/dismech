  summary: 'Gene-family review: ALDH18A1 record typed'
  details: |
    The ALDH18A1 record for the dominant SPG9A form was untyped with no variant origin, and its inheritance block had no evidence. It is now typed CAUSATIVE (monoallelic ALDH18A1 variants segregating in three independent families, PMID:26026163) with germline origin, and the inheritance block quotes that segregation. The node it sits on already binds delta1-pyrroline-5-carboxylate synthetase (NADP+) activity as decreased. Other genes in this entry were not reviewed; check-gene-validity lists 14 ClinGen backfill candidates for them (SPART, AP4B1, AP4E1, AP4M1, AP4S1, GPT2, ERLIN2, DSTYK, B4GALNT1, VPS37A, ENTPD1, MAG, KIDINS220) whose assertions the entry already cites.

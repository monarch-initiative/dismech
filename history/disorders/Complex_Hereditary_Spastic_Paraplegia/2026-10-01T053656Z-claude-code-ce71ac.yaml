  summary: 'Genetics pass: SPG45 (NT5C2) and SPG61 (ARL6IP1) subtype rows, 36/36 genes
    wired'
  details: |
    Genetics pass for the two diseases on dismech#12224 (d2g series-017 part 2), both curated as gene-defined has_subtypes rows: SPG45 bound to MONDO:0013165 with NT5C2 (hgnc:8022), and SPG61 bound to MONDO:0014304 with ARL6IP1 (hgnc:697). Both MONDO classes are direct children of the entry's own disease_term MONDO:0015150, confirmed by OLS hierarchicalChildren on 2026-09-30, and both carry an "autosomal recessive complex spastic paraplegia caused by mutation in <gene>" synonym, so the entry's existing complex-versus-pure routing rule places them here. Each row has a reciprocal genetic: record carrying the subtype foreign key, an autosomal recessive inheritance block, and HGNC CURIEs read live from rest.genenames.org in the same step they were written.

    Two pathophysiology nodes were added so each gene reaches the mechanism it acts at rather than a bucket. Purine Nucleotide Metabolic Imbalance (GO:0006163, modifier ABNORMAL) carries NT5C2 together with AMPD2 and ENTPD1, which the founding exome study PMID:24482476 assigns to one purine-metabolism module; those two genes were moved off the pleiotropic node, whose own description reserves it for genes with diverse housekeeping roles. Tubular Endoplasmic Reticulum Membrane Shaping Failure (GO:0071786, modifier DECREASED) carries ARL6IP1 and is kept separate from the IP3-receptor calcium-release node. Two phenotypes were added and wired: Microcephaly (HP:0000252) with three incoming edges, including one from the pre-existing Impaired Mitochondrial Anaplerosis node whose already-verified GPT2 snippet recorded postnatal microcephaly with no edge to carry it, and Pain Insensitivity (HP:0007021) with one.

    Measured with dismech.qc_plugins: gene_mechanism_wiring_coverage went from 34/34 to 36/36 and causal_inlink_coverage from 10/10 to 12/12; pathophysiology nodes with no outgoing downstream edge stayed at 0, 9 before and 11 after. just count-verified-snippets reports 164/164 verified on the tree being committed, taken after reverting the 15 references_cache files that just validate-disorders normalized as a side effect. just validate-disorders reports 0 issues over 164 snippets and 170 titles under linkml-reference-validator 0.3.0rc3. just validate-terms passed. just list-gene-term-mismatches examined 113 HGNC bindings, compared all 113 against HGNC, and found 0 naming a different gene, 0 uncached and 0 advisory. The whole-repo gates check-folded-hyphens, check-case-collisions, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-coarse-phenotypes, check-duplicate-keys and check-enum-values all report OK, as do the per-file check-entity-refs, check-causal-targets, check-qualifier-terms and check-genereviews. A repeated-"- name:" scan over the file returns nothing, on this branch and on main.

    Anchor audit. MONDO:0015150 was re-tested rather than inherited from the part 1 pass: it is not over-broad, since the entry is the syndromic grouping MONDO defines as "A hereditary spastic paraplegia that is part of a larger syndrome"; its 50 direct children are all complex-HSP forms; and the entry name matches the class label. The reciprocal test found one failure, reported and not fixed: every subtype row binding a MONDO class sits inside the MONDO:0015150 subtree except the AP-4-HSP row, whose class MONDO:0100176 is filed under MONDO:7770009 disease of genetic or genomic mechanism with no hereditary-spastic-paraplegia ancestor. The four gene-generated AP-4 SPG classes sit outside that subtree too, so splitting the row into four would not bring it inside; the finding is recorded in the entry's notes and flagged in the pull request for a maintainer.

    Sources. No GeneReviews chapter exists for either disease: the committed Bookshelf index holds seven spastic-paraplegia chapters, none numbered 45 or 61, and no hit for NT5C2 or ARL6IP. The committed ClinGen gene-disease validity cache holds no assertion for either gene, and the full ClinGen CSV is gitignored and absent, so that statement describes the committed snapshot only. No ORPHA record for these concepts is present in references_cache. The evidence is therefore primary literature: PMID:39119448, PMID:32153630 and PMID:24482476 for NT5C2, and PMID:31272422, PMID:28471035, PMID:24262037 and PMID:24482476 for ARL6IP1. Every snippet was checked as an exact substring of its cached reference before being written.

    Self-review before pushing found four false statements in the first draft, all of which had passed every gate because prose is ungated. A claim that pain insensitivity with acromutilation separates SPG61 from the other forms on this entry was refuted by the entry's own CCT5 row, hereditary sensory and autonomic neuropathy with spastic paraplegia, whose cited snippet describes a mutilating sensory neuropathy; the Microcephaly description claiming the feature was reported in only two forms was refuted by the GPT2 and AR Complex HSP rows, which is what prompted the third microcephaly edge; "the SPG61 alleles are truncating and predicted to abolish the protein" overstated the frameshift allele, whose own source says it adds a C-terminal hydrophobic domain that could disrupt function; and a clause asserting that AMPD2 and ENTPD1 complicating features are recorded on their own subtype rows was false, neither row recording any. The subtype scoping was also dropped from the Pain Insensitivity phenotype, because given the CCT5 row this entry's sources do not settle whether pain insensitivity is peculiar to SPG61.

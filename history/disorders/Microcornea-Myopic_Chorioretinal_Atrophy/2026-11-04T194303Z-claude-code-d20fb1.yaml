  details: |
    Addressed the first automated review. Added a diagnosis section (molecular genetic testing, NCIT:C15709; ophthalmic examination and electroretinography, NCIT:C38060) with quoted evidence from PMIDs 38249507, 39902400, 22686506 and 23356391. Split the single uncited treatment into spectacle correction (DEVICE, cited to PMID:38249507) and surveillance and surgical management of complications (no modality, cited to PMID:39902400). Replaced the PMID:23356391 cone-rod dystrophy snippet, which stated only a genotype, with the full-text sentence reporting extinguished rod and cone ERG responses. Cited the two previously unused references: PMID:41155148 for a further nonsense allele (p.Gly467*) and a new Taurodontia phenotype from one family, and PMID:40946907 for telecanthus. Removed the FREQUENT frequency from telecanthus because the source counts facial features as a group. Added a SPECIES_MISMATCH divergence to the mouse retinal link. Validated with just validate-disorders (pass) and count-verified-snippets (52/52).

  summary: 'Create: Microcornea-Myopic_Chorioretinal_Atrophy'
  details: |
    New Disease entry for MMCAT (MONDO:0014195), caused by biallelic ADAMTS18 variants. Lump/split decision DISEASE: a leaf MONDO term with a single causal gene; the cone-rod dystrophy, early-onset retinal dystrophy, anterior segment dysgenesis and developmental glaucoma presentations reported with ADAMTS18 are kept in one entry. Sources were found by direct PubMed search (2012 clinical description, 2013 gene discovery, case series 2014-2025, 2025 systematic review, Adamts18 knockout mouse, medaka knockdown, fibronectin cleavage study) and cached with just fetch-reference. Pathograph: ADAMTS18 loss of function to lost metalloproteinase activity to disordered developmental ECM remodeling, branching to anterior segment/lens maldevelopment and retinal-choroidal degeneration, each wired to its phenotypes. The mouse retinal phenotype mismatch is recorded as a HUMAN_MODEL_MISMATCH discussion. ClinGen Definitive AR tier recorded from the CGGV assertion. No GeneReviews chapter (genereviews[book] searches on disease and gene returned nothing; check-genereviews NO_CHAPTER). Falcon was requested but no Edison key is configured, so the deep-research run fell back to openscientist (research/Microcornea-Myopic_Chorioretinal_Atrophy-deep-research-openscientist.md; 19/19 references resolved, one flagged off topic, a platelet paper, not cited). The report drew on the same primary papers already curated and added nothing citable; its claims that the mouse lens-capsule lesion explains microcornea and myopia, and that bone mineral density GWAS findings bear on this disease, were not taken because the cited sources do not support them. Validated with just validate (schema, terms, references all pass) and count-verified-snippets (42/42).

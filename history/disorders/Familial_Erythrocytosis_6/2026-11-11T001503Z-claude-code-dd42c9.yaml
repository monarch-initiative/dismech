  summary: 'Create: Familial_Erythrocytosis_6'
  details: |
    New entry for ECYT6 (HBB high oxygen affinity hemoglobin erythrocytosis, MONDO:0054801, OMIM 617980), closing issue #17006 and replacing stubs/Erythrocytosis_Familial_6.yaml.
    DEEP RESEARCH: just research-disorder claude_code Familial_Erythrocytosis_6, committed as research/Familial_Erythrocytosis_6-deep-research-claude_code.md. The claude_code provider declined to write the 15-section dossier in one pass and instead returned a PubMed-verified candidate reference table of 14 PMIDs with a rationale about one-shot fabrication risk; a second invocation returned the identical cached response (cached: true, same session_id), so the committed report is that one and the duplicate dated file was deleted rather than committed. Its reference_validation (2/2 resolved) and term_validation (1/1) blocks are clean but cover only the four URLs it cited; just preflight-dr returned PASS (HBB mentioned 5 times, OMIM 617980 matching MONDO). The report was therefore used as a citation list, not as a narrative source: every claim in the entry was taken from an abstract or cached full text read directly, supplemented by my own PubMed E-utilities searches (high oxygen affinity hemoglobin with erythrocytosis, thrombosis, phlebotomy, 2,3-BPG and T-state). Eleven of its 14 PMIDs are cited. PMID:19734427 and PMID:31445464 cache with no quotable text (both are letters) and are named in the entry prose where they bear on an open question rather than cited; PMID:32151172 and PMID:33456185 are single-variant case reports covered by cited equivalents.
    PATHOGRAPH: debundled to one claim per node. 13 pathophysiology nodes, 24 edges. The HBB missense variant forks into the three structural routes the literature names (alpha1-beta2 interface, C-terminal T-state salt bridges, allosteric effector binding sites), which converge on R-state stabilisation, with loss of cooperativity as a separate parallel node; then low p50, reduced tissue oxygen unloading, renal hypoxia sensing, raised EPO, erythroid progenitor expansion, raised red cell mass and raised whole blood viscosity. 10 phenotypes, 9 causally connected; splenomegaly is deliberately unconnected because the mechanism that plausibly produces it (variant instability with hemolysis) is the one this entry does not model, and both its description and the entry notes say so.
    MODULE CONFORMANCE: none added. The module directory on origin/main has no hypoxia-sensing, EPO-signalling or erythroid-expansion module. Two candidates were considered and rejected in notes: pulmonary_vascular_remodeling (the only module the sibling erythrocytosis entries reach, modelling a complication this disease does not have) and thrombogenesis (conformance needs a pathophysiology node, and this entry deliberately models no thrombogenic mechanism because the hematocrit-to-thrombosis link is what the sources leave unsettled).
    DISCUSSIONS: five, each with evidence and a proposed experiment -- compensation versus disease and whether phlebotomy can harm, thrombosis attribution (typed CONTROVERSY and carrying both the negative single-centre result and the positive pooled venous-event association), normal EPO under a sustained hypoxic drive, electrophoretically silent variants with an unavailable p50, and pregnancy and fetal oxygen transfer.
    SCOPE: HBB only, with a skos:relatedMatch mapping to MONDO:0054802 (ECYT7, alpha-globin) and a note that the 41-patient series whose figures are cited is 83 per cent beta-chain with no published beta-only breakdown.
    GENEREVIEWS: just check-genereviews --online returns CANDIDATE_CHAPTER from the HBB gene search only (Sickle Cell Disease, Beta-Thalassemia -- both other HBB diseases). No chapter covers this disease, so neither is cited and the phenotype baseline is the reported clinical series and cohorts plus the review literature; recorded in notes.
    SELF REVIEW: a red-team pass against the dismech-pr-review skill was run in a subagent before the PR, and its findings were fixed in this version -- the "largest reported series" over-claim (that series is single-centre; the pooled systematic review is larger), the "rather than in the heme pocket" over-claim (a fourth structural route exists and is now named and sourced), missing gene-dose, homozygous and compound-heterozygous content, the omitted positive hematocrit-thrombosis association, symptom frequencies taken from a whole-cohort symptom rate rather than the hyperviscosity-class rate, quote_role and evidence_source grading on review and background prose (nine items on PMID:41978276 regraded from HUMAN_CLINICAL to OTHER where the quote is that paper's review section), an unsourced claim that the other blood lineages are normal (removed; one reported patient in fact had thrombocytopenia), a table-row snippet on the inheritance claim replaced by ClinGen's prose sentence, and the two negative-existence claims in notes softened to say what was and was not checked. The review also prompted the new environmental section (tobacco smoking as a MODIFIER with two multivariable associations from PMID:42719225), the tinnitus and splenomegaly phenotypes, a GO:0034101 binding on the red-cell-mass node, and a positive justification note for the broad GO:0042446 binding on the EPO node.
    VALIDATION: just validate passes (schema, terms, 137 snippets, 153 reference titles); just validate-terms passes; just count-verified-snippets 137/137; just validate-disorders passes; just compliance 87.4 per cent; just check-entity-refs OK; just check-causal-targets OK with no new dangling targets; scripts/check_disconnected_phenotypes.py 9 of 10. Whole-repo CI gates run clean locally: folded hyphens, folded YAML, snippet length, title-quoting snippets, retired support prose, reference titles, environmental evidence, missing reference titles, cache order and term-cache integrity. Cache changes are additive only (8 rows across 6 files, all terms this entry introduced); one stray NCIT row from a discarded term binding was removed and one reference-cache file re-fetch churn was reverted.

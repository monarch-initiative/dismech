  summary: 'Create: LPIN1-Related_Recurrent_Myoglobinuria (LPIN1, MONDO:0009992)'
  details: |
    Created the LPIN1 acute recurrent myoglobinuria entry as a single Disease. Identity correction: the claim (#11146) was filed against stubs/Myoglobinuria_Recurrent.yaml (MONDO:0010791). just preflight-dr returned SKIP (no causal gene in MONDO) and runoak inspection showed MONDO:0010791 xrefs OMIM:550500, the mitochondrially inherited cytochrome c oxidase-related recurrent myoglobinuria; the LPIN1 disorder is MONDO:0009992 (OMIM:268200), which had no KB entry, stub or claim. The entry therefore uses MONDO:0009992 as disease_term, records MONDO:0010791 as a skos:relatedMatch, the claim issue was retitled, and the MONDO:0010791 stub was annotated (notes) and left in the queue rather than deleted. Sources: PMID:18817903 (gene discovery), PMID:20583302 and PMID:22481384 and PMID:22480698 (French cohorts, founder deletion, fatal ECG changes), PMID:23928362 and PMID:34467247 (patient myoblast mechanism: lipid droplets, cytokine sensitivity, mitochondrial quality control and TLR9), PMID:30028636, PMID:33113595 and PMID:30420558 (muscle-specific mouse models), PMID:31492716 and PMID:29325813 (exercise physiology and cardiac studies), PMID:28986436 (normal adipose tissue), PMID:35242575 (US cohort and care recommendations), PMID:36680547 (corticosteroids), PMID:37150031 (hydroxychloroquine), PMID:36195520, PMID:32522502, PMID:31240148, PMID:32913636, PMID:33456573. Deep research: Edison/falcon report research/LPIN1-Related_Recurrent_Myoglobinuria-deep-research-falcon.md (14/14 references verified, 11/11 terms verified), read for the mechanism chain, phenotype list and treatment sections; its causal chain matches the entry. NCIT:C2322 (Corticosteroid) was tried as a therapeutic_agent and rejected by the ChemicalEntityTerm dynamic enum, so dexamethasone (CHEBI:41879) is bound instead. Environmental triggers: febrile illness left unbound (no fever/febrile ECTO term in the label cache), strenuous exercise bound to ECTO:6000031. Validation: just validate pass, just validate-terms pass, count-verified-snippets 73/73, check-causal-targets and check-entity-refs clean, check-environmental-evidence clean, check-stubs and validate-stubs clean after the stub annotation. No GeneReviews chapter exists for this disorder.

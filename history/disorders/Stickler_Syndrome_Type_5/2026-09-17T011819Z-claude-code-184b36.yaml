  summary: 'Review round 1: mine GeneReviews, add diagnosis and surgical treatments'
  details: |
    Addresses the REQUEST_CHANGES review of c9a36dd9 (run 35152487476).

    Blocking finding: PMID:20301479 (GeneReviews Stickler Syndrome) was tagged in references: but cited by zero evidence items. It is now mined in five places, each as a REVIEW_SYNTHESIS item because the chapter is an expert synthesis rather than a study of this genotype: the diagnostic criterion (biallelic COL9A1/COL9A2/COL9A3), the surveillance interval, sensorineural and conductive hearing-loss management, the contact-sport restriction, and the 25/50/25 recurrence risks plus the carrier-testing precondition.

    Also from the review:
    - New diagnosis entry for molecular genetic testing, which is the confirmatory test for a recessive entry and was absent.
    - The genetic counselling treatment asserted a 25 percent sibling recurrence risk on a six-word fragment (as well as identifying risk to future children) that states no figure. Replaced with the GeneReviews sentence that states all three risks.
    - New treatments: avoidance of contact sports, retinal detachment repair surgery, cataract surgery. The last two are reported in the COL9A2 proband of PMID:33356723.
    - preferred_term on the surveillance treatment changed from Supportive Care, which echoed the broader NCIT label, to vitreoretinal surveillance and retinal detachment education.
    - The hearing-aid treatment now carries target_mechanisms into Cochlear Matrix Dysfunction.

    Beyond the review: PMID:35885933 (Prevention of Blindness in Stickler Syndrome) was among the uncited caches the review flagged. It is the pro-prophylaxis case for Stickler syndrome as a whole and it names the absence of molecular genetic sub-typing as a reason the historic evidence was uncertain, which is exactly what the type IX cohort supplies. Both are now cited on the prophylactic retinopexy treatment so the general recommendation and its genotype-specific scoping sit together.

    Declined, with reasons recorded in notes: wiring Cataract and Short stature into the pathograph. No located source states a mechanism connecting either to a node here, and the review itself noted an edge added to clear a report is worse than no edge. The remaining fifteen uncited caches are left in place; pruning against a cited-reference list is how a needed cache gets deleted.

    Validation: just validate passed with 46/46 snippets verified, up from 34/34. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all OK.

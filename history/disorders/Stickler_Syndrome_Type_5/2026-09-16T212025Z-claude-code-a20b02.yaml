  summary: 'Create: Stickler Syndrome Type 5'
  details: |
    Created kb/disorders/Stickler_Syndrome_Type_5.yaml (MONDO:0013666, COL9A2) as a per-type entry alongside the existing Stickler_Syndrome_Type_1, _2 and _6. Deep research: Perplexity sonar-deep-research (404s). just preflight-dr returned WARN, not PASS: COL9A2 is mentioned 145 times but the rival gene LOXL3 is mentioned 38 times, because the report ranges over the whole recessive Stickler gene set. Nothing was taken from the report; every ontology term was resolved against the committed caches or OLS and every snippet derived by hand from cached PubMed abstracts, so the LOXL3 contamination does not reach the entry. Most published cohorts pool COL9A1, COL9A2 and COL9A3 as 'type IX recessive Stickler syndrome', so the quantitative claims (91.7% hearing loss, 15.4% retinal detachment, 30.8% midfacial hypoplasia) are type IX figures and the descriptions say so rather than attributing them to COL9A2. The clinically important content is a negative: prophylactic retinopexy, standard in type 1, is not transferable here and is curated as a restriction with its evidence. One snippet initially spliced two non-adjacent sentences from PMID:39406934 and was caught by the reference validator; it was split into two evidence items. Validated: just validate (34/34 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-length, check-enum-values.

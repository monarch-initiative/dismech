  summary: 'Create: RLBP1-Related Retinopathy'
  details: |
    Fresh curation of RLBP1-related retinopathy (MONDO:0100444), the natural follow-on to RDH5-Related_Retinopathy (MONDO:0100443, PR #6816) per projects/RETINOPATHIES.md's RLBP1-family-umbrella recommendation. RLBP1 encodes CRALBP, a retinoid-carrier chaperone (not an enzyme) expressed in BOTH the RPE and Muller glial cells -- a real mechanistic difference from RDH5's RPE-only enzymatic block, confirmed via a Muller-cell-specific knockout rescue study (PMID:25607845). Modeled 3 named clinical subtypes on an allelic severity gradient (all confirmed via MONDO's own narrow-synonym list for MONDO:0100444): Bothnia Dystrophy (Swedish/Vasterbotten founder p.Arg234Trp missense, ~1/4500 regional prevalence), Newfoundland Rod-Cone Dystrophy/NFRCD (null alleles, most severe -- also confirmed the NFRCD label has since been applied to a French cohort's unrelated recurrent exon7-9 deletion, so it now functions as a genotype-severity class beyond the original founder population), and Retinitis Punctata Albescens/fundus-albipunctatus-like presentation (intermediate missense/nonsense alleles, with a striking age-dependent phenotype-conversion finding: identical R150Q genotype patients were stationary-appearing at ages 3-20 but showed RPA signs in their 4th-5th decade -- modeled as an explicit pathophysiology downstream edge). 10 PMIDs + 1 NCT record independently fetched and snippet-verified. Found and fixed 4 real snippet-verification failures during this session: 3 were my own transcription errors dropping the umlaut in 'Muller' (source text used 'Müller' -- Python substring check requires the exact accented character), and 1 was a fabricated/paraphrased quote ('Selective reconstitution of CRALBP...') that did not literally appear in the source -- replaced with the paper's actual wording. Also hit and fixed a PDF-extraction artifact: two PMID sources have hard-wrapped abstract text with embedded \r\n line breaks (from content_type: full_text_pdf) and a special diameter symbol (O with stroke, U+00D8) that a snippet must not span across or include -- resolved by choosing shorter snippets fully contained within one wrapped line, avoiding the special character entirely. Also caught and corrected a real schema-structure error: initially nested a clinical_trials: block under an individual Treatment list item (Treatment has no such slot per schema); moved it to the disease-level top-level clinical_trials: section, matching the RPE65-Related_Retinopathy.yaml precedent. Unlike RDH5's treatment landscape (supplement pilot only), RLBP1 has an active AAV8-RLBP1/CPK850 gene therapy program with real phase 1/2 interim data (PMID:39256350, NCT03374657) -- this time the NCT ID IS correctly self-consistent with the paper's own abstract, cross-checked against the RDH5 session's mismatched-NCT lesson. New MONDO:0100444 term manually appended in sorted order to cache/enums/diseaseterm_f618932bb23f.csv. Full validation suite (schema, references, terms) passes clean.

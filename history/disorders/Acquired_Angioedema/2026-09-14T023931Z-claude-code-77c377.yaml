  summary: 'Classify: IUIS 2022 Table 10'
  details: |
    Added a classifications block carrying iuis_category: phenocopy of IEI, backfilled from IUIS 2022 Table 10 (Tangye et al., PMID:35748970), second section, 'Associated with autoantibodies'. The entry previously had no classifications block. The row is 'Acquired angioedema', pathogenesis given as autoantibody to C1 inhibitor, and its similar-PID column names hereditary angioedema (C1 INH deficiency) as the germline disease it copies. Phenocopy-versus-primary check: dismech curates Hereditary_Angioedema as a separate entry, and hereditary angioedema is an IUIS Table 8 (complement deficiency) entity, not a phenocopy - so Hereditary_Angioedema was deliberately left unclassified by this pass and the phenocopy value put only here. The entity IUIS lists in Table 10 is acquired functional C1-INH deficiency, which is exactly what this entry defines, so the assignment is entry-level rather than subtype-level. Two evidence items, both PMID:35748970 graded OTHER: the row itself, and its similar-PID cell quoted separately because that cell is what distinguishes the phenocopy from its counterpart. Note the table prints 'CI inhibitor' with a capital letter I - an OCR artefact of the source PDF, preserved verbatim in the snippet because snippets must match the cached text byte for byte, and flagged in the notes so a later curator does not 'correct' it.

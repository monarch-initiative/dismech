  summary: Cite the CIViC FOXR2 diagnostic assertion and its three evidence items
  details: |
    Adds an external_assertions section citing CIViC's accepted diagnostic assertion for FOXR2 rearrangement in this entity, plus each of the three accepted evidence items CIViC builds it on. All four cache files were generated through the structured source with just civic-rebuild, never by hand; just civic-refresh found the pinned 01-May-2026 snapshot already current, so no manifest bump was needed. The slate row also asked for CIVIC_EID:11854 to be cited in Ganglioneuroblastoma. That is not done, and it cannot be: that evidence item is predictive evidence for entrectinib, entrectinib inhibits ALK, and content fence (a) forbids adding ALK-inhibitor clinical or trial evidence. The underlying trial enrolled patients with NTRK, ROS1 or ALK fusions, so the item sits squarely inside the fence rather than merely beside it. Its cache file was generated during this work and then deleted rather than committed. Checking the whole CIViC neuroblastic set showed that EID:11854 is the only Ganglioneuroblastoma item CIViC holds, so that half of the row is closed by the fence rather than deferred - there is no non-fenced alternative to substitute. Of the twenty-seven CIViC items covering neuroblastoma and its relatives, seventeen are predictive evidence for an ALK inhibitor and are likewise never cached or cited. What the row gained instead is depth on the half that is clean: rather than citing the assertion alone, the entry cites the three diagnostic evidence items behind it, which are the methylation-clustering study that defined the entity among 323 tumours, the RNA-sequencing result finding FOXR2 fusion transcripts in all 14 tumours analysed with the partner loci named, and a Swedish population re-review that recovered the class in 7 of 71 tumours with a current classifier. Every item is graded OTHER because the quoted text is CIViC's curated restatement rather than a study's own abstract, and the re-review's 10 per cent is recorded as the share of that re-reviewed cohort rather than a population frequency. The edit is a text splice rather than a YAML round-trip, so the diff is one hunk of 98 insertions and no deletions. Two read-only verifiers then re-checked the change against its sources, split by axis, and four things changed as a result. The 11528 block was titled and explained as fusion transcripts in every tumour analysed, where the source says all 14 CNS NB-FOXR2 tumours of 20 such cases in an 84-tumour cohort; the block now says that. The 12521 explanation called the cohort unselected, which its own description and the source contradict - the 71 tumours were selected on poorly differentiated supratentorial histology and a prior CNS-PNET diagnosis, and re-reviewed for BCOR rather than FOXR2. The three evidence-item notes now carry CIViC's own evidence_level=B and the citation_id of the study each one is, so the studies the prose describes can be reached from the entry. And assertion_type on the three evidence records said accepted_evidence, a third spelling the knowledge base had nowhere else; the six pre-existing CIViC evidence records all say accepted_evidence_item, which these now do. quote_role is set to REVIEW_SYNTHESIS on all four, since a CIViC record is by construction a curated restatement of work CIViC did not perform, which is what each explanation already said in prose.

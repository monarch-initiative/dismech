  summary: 'Create: CNS Neuroblastoma, FOXR2-Activated (MONDO:0859597)'
  details: |
    New entry for the second tumour in this series that shares the word neuroblastoma without being one. It is a supratentorial embryonal brain tumour of young children, recognised in the 2021 World Health Organization classification of central nervous system tumours, and one of four entities that DNA methylation profiling carved out of the discarded category of central nervous system primitive neuroectodermal tumour. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only.

    Five pathophysiology nodes and three phenotypes, all connected. The mechanism is unusual and the entry is built around what makes it so: the activating events are structural rearrangements upstream of FOXR2, clustering within about 150 kb of it, which leave the coding sequence intact and work by bringing a normally testis-restricted transcription factor under the control of promoters and enhancers active in the tissue. Because no chimeric protein need result, routine testing can miss them, which is why the diagnosis rests on expression or methylation class rather than on sequence.

    Three things are recorded as limits rather than smoothed over. Neither FOXR2 overexpression nor chromosome 1q gain is specific: one series found 1q gain in 70.6 per cent of high-grade gliomas that overexpressed FOXR2, and that is both a differential diagnosis row and a sentence in the entry notes. The 1q gain node's edge to the tumour is typed UNKNOWN, because it is near-universal and reported to suppress p53 signalling through MDM4, but nothing cited shows it causes the tumour. And the favourable survival is attributed by its own authors to the use of craniospinal irradiation in a retrospective cohort, so the treatment's within-cohort comparison is graded INDIRECT and the late-relapse finding is recorded beside the five-year figures.

    FOXR2-expressing peripheral neuroblastoma is deliberately excluded and said to be excluded: about 9 per cent of peripheral neuroblastomas express FOXR2, and that group is a subset of peripheral neuroblastoma with an unfavourable outcome, not this entity. It is recorded in the notes and in the Neuroblastoma differential row.

    A process note worth recording, because it nearly put wrong content in the knowledge base. The reference titles in the first draft were written from the literature digest rather than copied from the cache frontmatter, and nine of them were wrong, including one that attributed a case series to an unrelated clinical trial report. Term validation caught all seventeen title mismatches, and every title was then rewritten programmatically from the cache file for its own reference. The snippets themselves were all exact, so the error was confined to the titles. The rule that a reference_title is copied in the same step it is written, never reconstructed, is the one that failed here.

    Nine references. Twenty-two snippets, all verified.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-cache-order, check-term-cache-integrity, check-logical-rules, check-qualifier-terms, check-shared-disease-terms and check-snippet-grading. check-coarse-phenotypes initially failed because the one coarse binding declared NO_HPO_TERM while its preferred_term merely echoed the bound label; the preferred_term now states the narrower concept the binding cannot express.

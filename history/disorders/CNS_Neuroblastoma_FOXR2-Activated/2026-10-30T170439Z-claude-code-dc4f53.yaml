  details: |
    Round one of review. Two content items and three suggestions, all addressed in this push; the third item is the deep-research question, which was already settled on a sibling pull request.

    The sharpest finding was that the GAIN_OF_FUNCTION modifier sat on the wrong node. Its justifying note argued about FOXR2 expression, but the modifier was attached to the structural rearrangement node, while the expression node carried INCREASED, the quantitative reading the note explicitly rules out. The rearrangement is a cis-regulatory lesion in intergenic DNA, not an alteration of transcription factor activity. The gene descriptor, the molecular function and the note all move to the expression node, and the rearrangement node now says in its own notes why it carries neither. Gene-activity grounding still passes, because FOXR2 is annotated where its activity changes.

    Added an immunohistochemistry and fluorescence in situ hybridisation diagnosis row: Olig2, synaptophysin and SOX10 immunopositivity with vimentin negativity plus 1q gain, which the French histopathological network found the best of four panels it compared. Its evidence explanations record that the performance figures come from cases referred on histological suspicion rather than from unselected tumours, and that the panel supports the diagnosis rather than establishing it, since 1q gain is not specific.

    Added a surgical resection treatment with the reported extents of resection, and an explicit statement that no cited source compares outcomes by extent, so the row records practice and not benefit. Changed the mass node's biological scale from ORGANISM to TISSUE, which is what a mass lesion is.

    A note was added to the irradiation treatment explaining why its chemotherapy half carries no therapeutic agent: no cited source names a standard regimen for this entity, the cohorts describe postoperative, induction and high-dose chemotherapy in varying combinations, and one review proposes a medulloblastoma-like approach as a proposal rather than a protocol. Naming agents would invent a standard that does not exist.

    Two suggestions were considered and not taken, with reasons given on the pull request: a raised intracranial pressure node and phenotype, for which no cited snippet reports the sign; and phenotype frequencies, which the pooled source gives only for two symptoms combined.

    Validation: all 18 C4 gates pass, and reference titles were again generated from each reference's own cache file rather than written.

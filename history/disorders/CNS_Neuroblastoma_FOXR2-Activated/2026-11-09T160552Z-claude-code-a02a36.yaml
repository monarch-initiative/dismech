  summary: Evidence on all seven causal edges, the MGE interneuron cell of origin,
    and the somatic lesion marking
  details: |
    The entry had seven causal edges and none carried evidence, and no node bound a cell type, so check-cancer-origin reported NO_ORIGIN. All seven edges are now cited from the entry's own sources plus two added lineage papers. The rearrangement-to-expression edge quotes Sturm 2016's reading that the breakpoints place FOXR2 under active promoters, which also supplies the baseline the edge needs: FOXR2 is silent in normal brain, so tumour expression is ectopic rather than raised. The expression-to-tumour edge carries two model-organism items, the mouse ganglionic-eminence Foxr2 targeting that produces signature-matching cortical tumours and the transplantation experiment whose cortical-progenitor arm stayed asymptomatic, which is the cell-context control the first lacks; both are graded INDIRECT because the human steps are unestablished and the edge stays INDIRECT_UNKNOWN_INTERMEDIATES. The 1q edge quotes only the 43 of 44 co-occurrence frequency and its explanation says so explicitly, because the edge is typed UNKNOWN and no source shows the gain contributes. Site is cited from two independent series. Vomiting and seizure both quote the one series reporting them as presenting symptoms in every case. Cell of origin is bound on the lesion node and on the tumour node as CL:4023063 medial ganglionic eminence derived interneuron, resolved by an ols:cl search rather than written from memory; the LHX6/DLX marker detail stays in preferred_term because CL has no class at that level. variant_origin SOMATIC on the rearrangement node makes it the transforming lesion, so check-cancer-origin now derives SOMATIC_LESION with that cell instead of NO_ORIGIN.

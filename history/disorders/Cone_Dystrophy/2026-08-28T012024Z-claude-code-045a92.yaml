  details: |
    Curated from an OpenScientist deep-research report. All cited PMIDs independently re-fetched and every title read from the cache frontmatter rather than the fetch output, after that gap produced a fabricated reference_title on PR 9721. All 39 snippets verified as exact substrings. Ontology terms were checked against the local OAK databases rather than trusted from the report, which caught NCIT:C38084 being Forced Expiratory Volume in 1 Second rather than electroretinography, NCIT:C15254 being Human Genome Project rather than gene therapy, UBERON:0000401 being mandibular ramus rather than fovea, and CL:0002149 being uterine epithelial cell rather than retinal pigment epithelium. Electroretinography has no NCIT term and no enum-valid equivalent, so it is bound to NCIT:C156778 Vision Assessment with a more specific preferred_term. The report transcribed the Israeli prevalence figure as 1:14,000 where the paper writes 1:14 000. The pathograph is organised around the convergent cGMP and calcium node rather than by gene, since dominant GUCA1A and GUCY2D gain-of-function alleles and recessive PDE6C and CNGA3 or CNGB3 loss-of-function alleles reach the same lesion from opposite directions; the X-linked RPGR arm is modelled separately because it acts through a glutamylation and trafficking defect.

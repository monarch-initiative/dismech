  details: |
    Curated from an OpenScientist deep-research report. All cited PMIDs independently re-fetched and every title read from the cache frontmatter rather than the fetch output, after that gap produced a fabricated reference_title on PR 9721. All 39 snippets verified as exact substrings. Every CURIE was resolved against the local OAK databases and its returned label read before use, regardless of source. That caught four wrong bindings. One came from the research report: NCIT:C15254, suggested for gene therapy, is Human Genome Project. Three were the curator's own recall, not the report: NCIT:C38084, reached for as electroretinography, is Forced Expiratory Volume in 1 Second; UBERON:0000401, reached for as fovea, is mandibular ramus; CL:0002149, reached for as retinal pigment epithelium, is uterine epithelial cell. Both sources produce real identifiers attached to the wrong concept, which pass an existence check, so the mitigation is label-reading on every term rather than scrutiny of the report alone. Electroretinography has no NCIT term and no enum-valid equivalent, so it is bound to NCIT:C156778 Vision Assessment with a more specific preferred_term. The report transcribed the Israeli prevalence figure as 1:14,000 where the paper writes 1:14 000. The pathograph is organised around the convergent cGMP and calcium node rather than by gene, since dominant GUCA1A and GUCY2D gain-of-function alleles and recessive PDE6C and CNGA3 or CNGB3 loss-of-function alleles reach the same lesion from opposite directions; the X-linked RPGR arm is modelled separately because it acts through a glutamylation and trafficking defect.

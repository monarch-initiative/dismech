  summary: 'Review response: Cone Dystrophy MONDO:0000455'
  details: |
    Response to two rounds of ai4c-reviewer findings on PR 9790. The substantive correction was the CNG channel arm: an earlier draft routed CNGA3 and CNGB3 loss into cGMP elevation alongside PDE6C loss. The channel reads the cGMP signal rather than degrading it, so its loss removes the dark current and leaves cones hyperpolarised with low rather than elevated outer-segment calcium. PMID:35327647 shows Cngb1-null animals are partially protected from degeneration, placing the channel downstream of cGMP on the calcium-death route rather than upstream. The node was split into a phosphodiesterase hydrolysis arm that feeds cGMP elevation and a separate channel arm that does not. The research report underpinning this entry had the correct model in its diagram; the error came from following a looser prose sentence in the same document. Round two then found the pathograph corrected but the description and notes prose still asserting the removed claim, so notes contradicted itself two paragraphs apart; both were rewritten. Other corrections: X-linked inheritance had been evidenced by a Ttll5 mouse study, but TTLL5 is autosomal at 14q24.3 and its disease recessive, so it now cites a human RPGR ORF15 study; the calpain and PARP execution node was added after the previous notes wrongly claimed no quotable source existed; GO:0051402 neuron apoptotic process was replaced with GO:0012501 programmed cell death because the cited paper explicitly describes the death as nonapoptotic PARthanatos; six evidence items citing an organotypic explant study were regraded from MODEL_ORGANISM to IN_VITRO per the CLAUDE.md rule, keeping the one item that reports prior in vivo work; and five phenotype frequency bands drawn from a single-gene KCNV2 cohort were scoped in their explanations, with the nystagmus band dropped entirely since that cohort is uniformly early-onset while the entry scopes nystagmus to early-onset forms. A duplicate-key gate also caught three duplicate evidence keys introduced by the frequency additions, where YAML was silently discarding the earlier block; merging recovered them and raised the verified snippet count from 49 to 52.

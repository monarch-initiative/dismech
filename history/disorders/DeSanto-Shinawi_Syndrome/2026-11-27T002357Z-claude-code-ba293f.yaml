  summary: 'Review fixes: rewire hypotonia, feeding, sleep, cardiac and vision edges'
  details: |
    Hypotonia and Sleep disturbance edges moved from the mouse seizure-susceptibility node to WAC haploinsufficiency with INDIRECT_UNKNOWN_INTERMEDIATES; Feeding difficulties is now a sequela of the Hypotonia phenotype. The WAC haploinsufficiency edges to the deletion-scoped Cardiac malformation and Abnormality of vision phenotypes were removed and replaced by a new deletion-scoped node, Contiguous 10p12p11 gene loss (PMID:21522184), which also points at WAC haploinsufficiency, so the entry no longer attributes deletion-series findings to WAC dosage. Added an unscoped Eye abnormalities phenotype (HP:0000478, SOURCE_UNSPECIFIED) for the 5/6 intragenic-variant figure in PMID:26264232, wired from WAC haploinsufficiency. Added PMID:21329877 (Zhang and Yu 2011, WAC as an RNF20/40 partner) as IN_VITRO primary evidence for GO:0097027 on WAC haploinsufficiency and for the H2B ubiquitination node; the PMID:26757981 introduction sentence there is now quote_role BACKGROUND and graded IN_VITRO. Removed GABAergic-neuron perturbation from intermediate_mechanisms on edges leaving the seizure node, since it is upstream of that node; ADHD and Anxiety edges became INDIRECT_UNKNOWN_INTERMEDIATES. Supportive care therapeutic_modality changed from OTHER to BEHAVIORAL. A respiratory phenotype was not added: the only source sentence (GeneReviews abstract) names respiratory problems without frequency or type.

  summary: Augment with PMID:42601842 (WAC frameshift, EEG and cardiac phenotypes)
  details: |
    Augmented the entry from PMID:42601842, a de novo WAC frameshift case report with serial EEG and congenital cardiac anomalies. Added four phenotypes (temporo-occipital epileptiform activity, behavioral abnormalities, ventricular septal defect, bicuspid aortic valve), evidence on the existing Seizure phenotype, and a gene-level evidence item. Addressing the PR 9944 review: added reference_title to all six new evidence items; bound bicuspid aortic valve to HP:0001647 rather than the parent HP:0001646; bound the EEG phenotype to HP:0011185 (EEG with focal epileptiform discharges) rather than the branch root HP:0002353; re-quoted the Seizure evidence to the sentence that reports epilepsy rather than the interictal EEG sentence; wired all four new phenotypes into the pathograph as downstream targets; added the PMID:38826421 evidence that names ADHD, which the case report alone does not support; and hedged the n=1 cardiac generalizations. Merged main, which had independently added subtype-scoped Cardiac malformation and Abnormality of vision phenotypes; the conflict was resolved as a union.

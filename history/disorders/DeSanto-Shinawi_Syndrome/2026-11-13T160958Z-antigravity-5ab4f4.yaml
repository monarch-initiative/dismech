  summary: Review and enrich DeSanto-Shinawi Syndrome
  details: |
    Added MONDO and GeneReviews synonyms, Harrison classifications, structured prevalence (ORPHA:466943 and cases in literature), GO molecular_functions grounding (GO:0060090, GO:0097027) and cell/location bindings on protected node WAC haploinsufficiency, added Disrupted Transcription-Coupled Histone H2B Ubiquitination conforming to epigenetic_machinery_neurodevelopmental_dysregulation, mined WAC GeneReviews (PMID:29190062, tagged GeneReviews) baseline phenotypes (Hypotonia, Feeding difficulties, Constipation, Attention deficit hyperactivity disorder, Anxiety, Sleep disturbance), upgraded MODEL_ORGANISM-only phenotype support to HUMAN_CLINICAL, added ClinGen DEFINITIVE gene_disease_validity, three diagnostic procedures, and targeted supportive treatments.

  sections:
  - has_subtypes
  summary: Bind both MONDO subtypes of DeSanto-Shinawi syndrome
  details: |
    entry_type SUBTYPE for MONDO:0014741 (DeSanto-Shinawi syndrome due to WAC point mutation). The existing entry binds only the parent MONDO:0018760 as disease_term with a skos:exactMatch mapping, and had no has_subtypes block, so neither MONDO child was covered. MONDO:0018760 has exactly two children: MONDO:0014741 (WAC point mutation) and MONDO:0017283 (10p11.21p12.31 microdeletion). Both were added as has_subtypes entries with subtype_term bound, following the rule from #9911 that binding half a section teaches the next reader the unbound half is deliberate. A standalone DISEASE entry was rejected: the existing pathograph (WAC haploinsufficiency -> impaired ULK activation/autophagy -> GABAergic-neuron perturbation) is derived entirely from intragenic-variant cohorts, so a separate entry would duplicate it. DeSanto 2015 (PMID:26264232) argues WAC haploinsufficiency accounts for most of the deletion phenotype, which is the basis for keeping both under one disease. The deletion subtype description records what does not carry over: deletions span 1-10.6 Mb so other genes are lost, and cardiac malformation in 6/7 patients in the defining deletion series is not an established frequency for the intragenic form and was deliberately not added to the entry phenotype section. No other part of the entry was modified.

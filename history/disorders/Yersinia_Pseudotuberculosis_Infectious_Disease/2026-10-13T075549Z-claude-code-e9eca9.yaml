  summary: Bind the Y. pseudotuberculosis antibody test as a LOINC measurement
  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and measurements: LOINC:40936-7 (Yersinia pseudotuberculosis Ab [Presence] in Serum) to the Direct detection and PsaA-based species-discriminating serology row. The row's point is species-level serologic discrimination from Y. enterocolitica via the PsaA antigen; the bound code is species-specific (Y. pseudotuberculosis, not the Y. enterocolitica code) and method-unspecified, matching the species identity the row's serology targets, though it does not encode the PsaA-antigen detail itself (no PsaA-specific LOINC code exists). Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch9 (LOINC_DIAGNOSTICS.md tranche B).

  details: |
    Addressed the automated review on PR 16409. Added a Pulmonic stenosis phenotype (HP:0001642, whose HPO definition covers valvular, infundibular and supravalvar narrowing, matching the unqualified 'pulmonary stenosis' in the PMID:40062121 abstract) as a single case, and reworded the congenital heart malformations description. Added a diagnosis row for trio exome sequencing (NCIT:C101295 Whole Exome Sequencing, validated in-enum by validate-terms) quoting the abstract's exome result, the laboratory VUS calls and the OMIM 620080 dominant-only listing. Added a progression onset row quoting the ClinGen record (neonatal period or early childhood). Did not split the EFEMP2/LOX node: both cited sentences (Adamo 2022 abstract, ClinGen summary) report impaired EFEMP2 deposition and reduced LOX activity together and do not state that one causes the other. Re-ran validate, count-verified-snippets (41/41), validate-terms, check-causal-targets, check-entity-refs, check-snippet-length, check-snippet-grading and validate-disorders.

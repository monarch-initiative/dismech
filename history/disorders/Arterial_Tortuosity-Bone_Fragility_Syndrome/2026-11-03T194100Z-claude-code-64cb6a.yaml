  summary: 'Create: Arterial Tortuosity-Bone Fragility Syndrome'
  details: |
    New entry for MONDO:0971179 (EMILIN1, autosomal recessive), named EMILIN1-Related Arterial Tortuosity Syndrome after the ClinGen-attributed MONDO exact synonym; file slug keeps the MONDO label. Deep research was run with the claude_code provider after falcon (Edison) returned 403; the report records fell_back. just preflight-dr returned WARN only (second 'gene' IV-2 is pedigree notation). Report claims marked unverified extraction (per-patient Table 1 counts from the Adamo 2022 full text) were not used, because a forced re-fetch of PMID:36351433 still returned abstract only. Evidence is limited to the Adamo 2022 and Furuta 2025 abstracts, the ClinGen CGGV evidence summary and row (gene_disease_validity DEFINITIVE copied from it), and the Zacchigna 2006 Emilin1 knockout abstract (MODEL_ORGANISM). Allelic dominant EMILIN1 phenotypes (PMID:26462740 connective tissue disease, HMND10) are recorded in notes only. Validated with just validate, count-verified-snippets (36/36), validate-terms, check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-genereviews and validate-disorders.

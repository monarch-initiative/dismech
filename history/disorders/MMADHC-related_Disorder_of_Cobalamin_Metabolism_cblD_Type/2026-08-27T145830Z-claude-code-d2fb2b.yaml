  summary: 'Create: MMADHC-related cobalamin disorder, cblD type'
  details: |
    New entry for the MMADHC/cblD complementation group (MONDO:0700297). Nine pathophysiology nodes built around the branch point: MMADHC partitions processed cobalamin between the mitochondrial adenosylcobalamin route and the cytosolic methylcobalamin route, so variant position within the protein determines which arm fails. All three biochemical forms are curated in one entry as has_subtypes (cblD-MMA, cblD-HC, cblD-MMA/HC) because they are one gene acting through one switch. An INTERPRETATION discussion records that the domain-to-phenotype map was confirmed by systematic mutagenesis rather than inferred after the fact, and that truncation length grades continuously between the isolated and combined phenotypes. A KNOWLEDGE_GAP records PTC readthrough as a lead, noting that the published readthrough inducers are aminoglycosides, whose ototoxicity is the subject of a sibling entry curated in the same round - a carrier of an MT-RNR1 variant treated this way would face that risk. The preflight WARN for MMACHC at 25% of MMADHC mentions was treated as real: cblC material was used only for pathway context and differential, never as cblD evidence, and two GeneReviews-derived phenotypes are graded PARTIAL because the chapter's clinical description is explicitly of cblC as prototype. The research report gave HGNC:26275 for MMADHC; the correct identifier is hgnc:25221. 18/18 snippets verified and independently re-checked as raw substrings.

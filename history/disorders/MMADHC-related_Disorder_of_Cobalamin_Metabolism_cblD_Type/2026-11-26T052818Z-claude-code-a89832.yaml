  summary: 'Gene-family review: MMADHC'
  details: |
    MMADHC is the cobalamin trafficking adapter that, through its C-terminal domain, forms a complex with cobalamin-loaded MMACHC and partitions the cofactor between the cytosolic and mitochondrial arms (PMID:23415655); in the complex its Cys-261 coordinates the cobalt of MMACHC-bound cobalamin (PMID:40996799). The C-terminal null allele node, which removes that domain and both arms, now binds GO:0031419 cobalamin binding as DECREASED with those two citations. The N-terminal null and C-terminal missense nodes were left without a molecular function, because each removes only one arm and the activity responsible for that arm alone is not established. The genetic record now has variant_origin GERMLINE and an inheritance block bound to HP:0000007. ClinGen's Definitive MMADHC record is against the grouping term MONDO:0019220, not this entry's cblD term, so it is recorded on the Inborn Disorder of Cobalamin Metabolism and Transport entry and a note here says why.

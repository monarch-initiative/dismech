  summary: Re-anchor cblD on MONDO:0100463 and bind all three subtypes
  details: |
    The entry covers all three MMADHC biochemical forms but was anchored on MONDO:0700297, the isolated-homocystinuria class, which is one of its own subtypes. Re-anchored on MONDO:0100463 (methylmalonic aciduria and/or homocystinuria, cblD type), whose MONDO definition matches the entry's scope. Bound cblD-HC to MONDO:0700297 and cblD-MMA/HC to MONDO:0010185, each with genes and evidence from PMID:15292234 and PMID:22156578 (cached abstracts, snippets verified). Recorded the Orphanet-derived duplicates MONDO:0017683 and MONDO:0017685 as narrowMatch mappings. Replaced five explanations that argued for the retired PARTIAL grade with directness INDIRECT. Pointed the cblD subtype of Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport at MONDO:0100463 with curated_in, and updated the cross-reference sentence in Methylmalonic_Acidemia notes. MONDO terms looked up in OLS4 during the edit.

  summary: 'Genetics pass (d2g series-047): MMADHC-related_Disorder_of_Cobalamin_Metabolism_cblD_Type'
  details: |
    Scoped follow-through from issue #12254 (d2g series-047). The gap list for the
    Methylmalonic Acidemia parent includes MONDO:0700298 isolated methylmalonic aciduria cblD
    type, whose correct home is this entry rather than the umbrella, because the cblD forms are
    already split out here. That term was not bound anywhere in the KB, so it is now bound as
    the subtype_term of the existing cblD-MMA row, with MMADHC in that row's genes and the
    Stucki et al. mapping of the Met62-Met116 segment quoted as evidence for the row's
    adenosylcobalamin-only phenotype. Also wired MMADHC into the pathograph: the
    "Biallelic MMADHC Loss of Function" node carried no genes: descriptor, so the entry's only
    causal gene reached no mechanism node; gene-to-mechanism wiring goes 0/1 to 1/1. The two
    sibling rows cblD-HC and cblD-MMA/HC are deliberately left unbound and the reason recorded
    in the row's review_notes: MONDO:0700297 is already this entry's own disease_term and
    MONDO:0010185 has an open curation stub, so their placement is a wider lump/split question
    than this row. The five disconnected phenotypes in this entry were left disconnected; no
    source-supported causal edge was in hand and an edge added to move a connectivity metric
    would be worse than the gap.

  summary: 'Review response: subtype tags, truncated snippet, biochemical, agents'
  details: |
    Response to the first review round, closing four blocking items. The one that was a genuine evidence defect: a snippet read 'Finally, C-terminal truncation of more than 20 amino acids' and stopped exactly where the finding begins, so it stated no result while being cited for the graded-truncation claim that the entry and PR body both lean on. Extended to the full sentence. The subtype tagging was worse than cosmetic: subtype is single-valued and all three biochemical phenotypes were pinned to the isolated forms, so a query for phenotypes of the combined cblD-MMA/HC form returned nothing - inverting the entry's central claim that the combined form has both. Tags dropped where the phenotype spans forms, with each description saying so. Added a biochemical section with homocysteine, methylmalonic acid, and methionine; methionine is the one that carries diagnostic discrimination, because low-to-normal rather than elevated methionine is what separates a remethylation defect from CBS deficiency. Added therapeutic_agent to both pharmacotherapy treatments (hydroxocobalamin CHEBI:27786, glycine betaine CHEBI:17750), matching the sibling cblC entry this one already follows for naming. Added hypotonia and seizures, both from a GeneReviews sentence already quoted in the file for megaloblastic anemia - the Neurologic Injury node asserted seizures in prose while the phenotype section recorded none. Corrected a notes sentence that said two phenotypes were graded PARTIAL when it was counting a discussion item quoting a different paper. Fixed the history record's pull/0 placeholder. 23/23 snippets verified and independently re-checked as raw substrings.

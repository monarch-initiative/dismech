  summary: 'Create: Cornelia de Lange Syndrome 4 (MONDO:0013864, RAD21)'
  details: |
    New standalone Disease entry for CdLS4, the RAD21-related attenuated form of the Cornelia de Lange spectrum. Sources: the entity-defining paper PMID:22633399 (Deardorff 2012), the 49-individual dedicated RAD21 series PMID:32193685 (Krab 2020) including its RAD21 versus SMC1A versus NIPBL comparison table, the 36-patient systematic review PMID:39286962 (Yue 2024), the RAD21 review PMID:32687945, the Mungan syndrome paper PMID:25575569 for the biallelic differential, and the ClinGen RAD21-CdLS assertion already committed to references_cache. Entry-type decision recorded in notes: standalone rather than a has_subtypes record on Cornelia de Lange Syndrome, because the umbrella has no subtype axis, its pathograph is one generic six-gene node with nowhere to record ring-versus-loader or the attenuation, and RAD21 carries a zygosity split into Mungan syndrome that a subtype line cannot hold. Follows the existing gene-level cohesinopathy pattern (MKMS, WAPL-RDD, CHOPS, CTCF-NDD, Warsaw breakage). The umbrella was not modified. A draft claim that the CdLS consensus score under-detects CdLS4 was removed after PMID:32193685 was found to state the opposite explicitly; the diagnosis node now curates both sources and the disagreement. Square-bracket fractions in the systematic review's frequency sentences are stripped by the reference validator's literal_bracket_patterns, so phenotype frequencies were re-sourced to bracket-free prose and to comparison-table rows whose column order is confirmed by the table caption. The Deardorff sentence carries three claims with two different evidence sources and is quoted in non-overlapping clauses. MONDO:0013864's second parent, non-syndromic limb reduction defect, is recorded in notes as an upstream placement error and not propagated. Validation: linkml-validate clean, 43/43 snippets verified, term validation clean, entity refs and duplicate keys clean.

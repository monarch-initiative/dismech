  details: |
    Acts on the ai4c-reviewer CHANGES_REQUESTED on PR #10423. GeneReviews PMID:20301283 was tagged but cited by no evidence item; it now supplies four: the mild-end-of-spectrum attenuation statement on the attenuated phenotype node, the diagnostic-criteria statement naming RAD21, and two management statements on Multidisciplinary Supportive Care, which previously had no evidence block at all. Genetic Counseling asserted a 50% recurrence risk that no cited snippet stated; the GeneReviews sentence that does state it is now cited. Added eight phenotype records from the Krab comparison table the entry already quotes: a combined Behavioural Phenotype record carrying anxiety 53 percent, attention deficit 35 percent, obsessive-compulsive behaviour 32 percent, autistic-like features 35 percent, and the two sharpest attenuation contrasts in the entry, self-injurious behaviour 6 percent against 77 percent in NIPBL and aggression 6 percent against 80 percent; plus microcephaly 57 percent, ptosis 42 percent (higher than NIPBL), short nose 88 percent, congenital heart disease 39 percent, gastro-oesophageal reflux 52 percent, hirsutism 38 percent and clinodactyly of the fifth finger 54 percent, each with a downstream edge from the attenuated phenotype node. The facial-gestalt preferred_term and description previously listed different feature sets and now list the same three, with short nose split out as the one facial feature that is not attenuated. Added Kaur PMID:37377026 as INDIRECT evidence for attenuation across non-NIPBL cohesin genes. The prevalence note now records the 6 of 422 solved-proband share and states that it sits in that paper's full text rather than its cached abstract, so it is not quoted as evidence. Added a notes paragraph recording why pan-CdLS trials are not curated on a subtype entry. Validation: 61/61 snippets verified, all offline gates exit 0.

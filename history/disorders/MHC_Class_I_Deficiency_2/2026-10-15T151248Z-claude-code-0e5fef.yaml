  details: |
    Created the TAP2-defined MHC class I deficiency 2 entry (MONDO:0971011, OMIM 620813). Deep research: Perplexity sonar-deep-research run at reasoning_effort=low because default-effort requests were repeatedly cut off; the report (18/18 references resolved, 1 unresolved term HP:0005784 not used) was treated as leads only, and just preflight-dr passed (TAP2 mentioned 100 times). Most evidence comes from additional PubMed searches for TAP2-deficient patients (PMIDs 8523185, 9419217, 11529920, 12067308, 14604968, 36227411, 41531537) rather than the report. TAP1, TAPBP and B2M patient evidence was not used as TAP2 evidence; mixed TAP1/TAP2 series (PMID:10560675, PMID:10229096) and syndrome-level treatment evidence (PMID:34280577) are marked INDIRECT or explained as syndrome-level. Report citations not used: PMID:10931128 and PMID:39345282 have no quotable abstract; PMID:41126834 pools TAP1 and TAP2 patients; PMID:11751378, 33481921, 41011036 and 41511357 are not about this disease. ClinGen TAP2 validity (Strong) is recorded for the parent MONDO:0011476, so gene_disease_validity was not filled. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (39/39) and validate-disorders all passed; offline gates clean for this file; 3 of 13 phenotypes (IgG2, polysaccharide response, gamma-delta T cells) are left unconnected because no source gives a mechanism.

  summary: 'Address review: MHC_Class_I_Deficiency_2'
  details: |
    Review round 1 on PR 14343. Added a diagnosis section: HLA class I surface expression (NCIT:C16585 Flow Cytometry; PMID:8523185, PMID:36227411), TAP2 molecular genetic testing (NCIT:C15709; PMID:11529920, PMID:41531537) and rubella IgG serology for granulomatous skin disease (NCIT:C217458; PMID:41531537). NCIT:C71329 HLA Typing was not used because it also covers molecular typing, which does not measure expression. No LOINC measurements were added. On the rubella node, the cycle-threshold snippet was replaced by the RT-PCR positivity sentence, and an INDIRECT summary sentence was added. Added an INDIRECT edge from HLA class I surface loss to rubella persistence, citing the paper's statement that TAP1/TAP2 deficiency predisposes to skin rubella infection. The combined treatment was split into Antibiotic Prophylaxis (NCIT:C51993) and Chest Physiotherapy (NCIT:C15302, BEHAVIORAL); NCIT has no chest-physiotherapy or airway-clearance term. No target_mechanisms link was added because no cached source states the mechanistic effect of prophylaxis. Added an Increased MAIT cells phenotype (HP:0020339, proportion term for a count; note added). iNKT was not added because HPO has no iNKT term. The HSCT explanation now notes that the MeSH terms of PMID:34280577 index ABCB2 (TAP1) and ABCB3 (TAP2) deficiency. Validation: validate, validate-terms, count-verified-snippets (49/49), offline gates and validate-disorders all pass.

  summary: 'Create: Idiopathic Multicentric Castleman Disease (split from Castleman
    Disease)'
  details: |
    Created by splitting the former umbrella kb/disorders/Castleman_Disease.yaml (and the overlapping kb/disorders/Multicentric_Castleman_Disease.yaml) into three etiologically distinct entries plus a grouping, per the analysis in the dismech Castleman split issue.

    The split follows the disjunction test from issue 7082: the claims that distinguish the Castleman forms live in pathophysiology, treatments and diagnosis, none of which carry a subtype: discriminator, so a single entry had to assert a causal graph with two mutually exclusive etiologic roots (HHV-8 viral replication and an unknown idiopathic trigger) feeding one shared IL-6 node. In the retired umbrella entry, 14 of 16 pathophysiology nodes and 10 of 11 treatments were scoped to a branch in free-text prose only.

    Content was migrated line-for-line from the umbrella entry wherever it applied unchanged, so evidence snippets and their verification carry over; blocks that referenced other branches were rescoped or replaced with branch-appropriate evidence rather than left to bleed across entities. The curated union is kept in kb/groupings/Castleman_Disease.yaml.

    This entry carries the HHV-8-negative idiopathic form and inherited the largest share of the umbrella entry's content, which is why the retired entries' history records name it as their successor. It holds iMCD-TAFRO, iMCD-IPL and iMCD-NOS as has_subtypes, six EMERGING mechanistic hypothesis groups, the unknown-initiating-process root node, the stromal, autoantibody, mTOR, CXCL13 and renal-thrombotic-microangiopathy nodes, the CDCN diagnostic criteria, both clinical trials, and eight discussions covering the field's open questions. The IL-6 node was renamed from 'IL-6 / vIL-6 Overproduction' since no viral IL-6 exists in this form. 147 evidence snippets, all verified verbatim.

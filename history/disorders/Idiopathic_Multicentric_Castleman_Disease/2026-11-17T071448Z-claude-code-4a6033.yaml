  summary: Correct experiment_design on the endotype-stratified trial
  details: |
    exp_imcd_pretreatment_endotype_stratified_trial carried DESCRIPTIVE_PROFILING, read off its profiling arm. The proposal profiles serum proteome, lymph node spatial transcriptome and PBMC phospho-signaling, assigns a candidate endotype, then randomizes within endotype to IL-6 blockade versus the endotype-matched agent, with an embedded day-8 futility rule. The profiling is the stratification step; the design is a randomized interventional trial, as the experiment_id's own _trial suffix suggests. Set to INTERVENTIONAL_TRIAL. Found by applying the unit-of-analysis tie-break recorded in this change to all 453 records carrying either DESCRIPTIVE_PROFILING or HUMAN_OBSERVATIONAL; it is the only one the rule moves.

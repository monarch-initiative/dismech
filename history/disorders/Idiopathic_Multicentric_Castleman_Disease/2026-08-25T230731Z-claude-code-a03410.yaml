  summary: 'Review and expand: Castleman Disease'
  details: |
    Reviewed the existing entry and expanded it after a fresh literature sweep. 14 references were newly fetched and cached; the file now carries 193 evidence snippets, all verified verbatim against the reference cache.

    Pathophysiology: added an explicit "Unknown iMCD Initiating Process" root node so downstream mechanism is not implicitly attributed to IL-6, plus nodes for lymph node stromal cell activation (FDC / T-zone / B-zone / perivascular reticular cells, from the 2025 Nat Commun spatial and single-cell map), follicular dendritic cell meshwork expansion, stromal VEGF overproduction, PI3K/AKT/mTOR activation, the CXCL13 chemokine axis, autoantibody-mediated immune dysregulation, somatic stromal cell mutation, vascular hyperpermeability, renal thrombotic microangiopathy, and bone marrow reticulin fibrosis. The existing IL-6 / JAK-STAT chain was retained and rewired with causal_link_type and hypothesis_groups.

    Hypotheses: added five EMERGING mechanistic_hypotheses groups - stromal cytokine source, autoimmune etiology, clonal stromal origin, IL-6-independent mTOR, and subtype-specific IL-6 source - each with its own evidence and an explicit statement of what is not yet established.

    Subtypes: split iMCD into iMCD-TAFRO, iMCD-IPL and iMCD-NOS as first-class subtypes with MONDO subtype_terms where available, and recorded the IPL classification controversy rather than resolving it silently.

    Phenotypes: grew from 11 to 29, with frequencies from the 1,998-patient meta-analysis and the ACCELERATE natural-history registry, and with UCD-specific (paraneoplastic pemphigus, bronchiolitis obliterans, growth delay), HHV-8-specific (Kaposi sarcoma) and POEMS-specific (polyneuropathy, skin hyperpigmentation, monoclonal gammopathy) features that were previously absent.

    New sections: synonyms, mappings, imaging_findings, prevalence (CD incidence 21-25 per million person-years; iMCD incidence 3.4 and prevalence 6.9 per million), progression (six phases including the TAFRO / NOS burden split and category-specific 5-year survival), clinical_burden (VARIABLE), diagnosis (six entries including the CDCN criteria, HHV-8 LANA-1 immunohistochemistry, and the serum IgG4/IgG ratio), differential_diagnoses (six), and genetic (PDGFRB, IL6ST, NCOA4 somatic drivers).

    Discussions: ten open items - eight KNOWLEDGE_GAP or OPEN_QUESTION and two CONTROVERSY - covering the unknown iMCD initiating process, the absence of any validated animal or cell-culture model, anti-IL-6 non-response, the causal direction of the stromal-source model, iMCD-IPL as a subtype, persistent symptoms after complete UCD resection, post-iMCD malignancy risk, the TAFRO renal mediator, the genomic coverage gap for HHV-8-positive and POEMS-associated MCD, and the missing diagnostic biomarker. Six carry proposed_experiments with would_support / would_refute foreign keys.

    Also added "Castleman Disease" as a parent of the separate Multicentric_Castleman_Disease entry, and recorded the deliberate overlap between the two entries in notes.

    Validation: just validate (schema plus terms) passed; just validate-terms passed; scripts/check_snippets_verbatim.py reported 193/193 verbatim; just validate-disorders (the authoritative pre-PR gate) passed over this file and Multicentric_Castleman_Disease.yaml; check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets and check-environmental-evidence were all clean.

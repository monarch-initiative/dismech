  details: |
    Addresses a Cursor Bugbot finding on PR #8872, verified before acting.

    "IL-6 Hypersecretion and Cytokine Storm" conforms to cytokine_storm_hyperinflammation#IL-6-Driven Systemic Cytokine Storm, which binds GO:0032635 interleukin-6 production and GO:0006954 inflammatory response, both INCREASED. The disorder node bound only IL-6-mediated signaling (GO:0070102) and JAK-STAT (GO:0007259), with no modifiers, so it did not carry the module's expected processes - the consistency check conformance exists to perform.

    Added GO:0032635 and GO:0006954, both INCREASED, and set INCREASED on the two existing signaling terms. This records what the node already asserted in prose - its name is "IL-6 Hypersecretion" and its description opens "Dysregulated overproduction of interleukin-6 drives the systemic inflammatory manifestations of MCD" - so no new mechanistic claim is introduced and no new evidence is required. Both added terms were already label- and enum-cached from the module; no cache row was written.


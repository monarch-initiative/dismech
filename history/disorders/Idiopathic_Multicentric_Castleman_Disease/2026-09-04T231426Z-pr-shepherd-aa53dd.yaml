  details: |
    Merge reconciliation with main (PR #9974). main's commit f19f3c58d4 ran an evidence-integrity review on the two entries this PR retires (Castleman_Disease, Multicentric_Castleman_Disease). Resolving the modify/delete conflict in favour of the split would have silently reverted that review, so each of its findings was checked against this entry and ported where the defect survived the split. Ported here: the IL-6 Overproduction node explanation, which claimed the expert-review quote establishes IL-6 as the unifying mechanism across all CD subtypes - rescoped to the multicentric forms, since IL-6 is typically normal in unicentric disease; and three causal edges (IL-6 -> JAK-STAT3, JAK-STAT3 -> Plasma Cell / B Cell Proliferation, Plasma Cell / B Cell Proliferation -> Angiofollicular Lymph Node Hyperplasia) where one review sentence was reused as full SUPPORT for downstream steps it does not describe - now directness: INDIRECT with explanations saying where the quote stops. Already superseded, so not ported: main's removal of the off-topic PMID:24622327 angiogenesis quote (this entry cites DOI:10.1038/s41467-025-61214-1 and PMID:31408438 for stromal VEGF instead), its removal of the siltuximab grade-3+ adverse-event sentence from Night Sweats/Fatigue (not carried forward here), its re-citation of Anemia (this entry uses the ACCELERATE 85.3% figure from DOI:10.3324/haematol.2023.283603), and its Fever explanation fix (rewritten in the split). Validation: just validate passes; check-duplicate-keys, check-entity-refs and check-causal-targets pass with no baseline change.

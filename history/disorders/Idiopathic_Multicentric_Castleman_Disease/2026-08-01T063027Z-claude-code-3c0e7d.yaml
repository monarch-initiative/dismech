  summary: Add public dataset records from GEO
  details: |
    Added 3 datasets record(s) discovered via the GEO DataSets index (scripts/discover_datasets.py, batch 1). Each record's accession, title, organism, sample count and linked PMID are GEO's own metadata rather than model-generated text, and every accession was resolved against NCBI E-utilities (scripts/verify_dataset_accessions.py) before commit. Candidates were manually triaged for disease identity; records naming a sibling disease or a different condition were rejected and are not included. No evidence blocks were generated, since an evidence item requires an exact quote from the cited abstract; records carry publication and provenance notes instead.

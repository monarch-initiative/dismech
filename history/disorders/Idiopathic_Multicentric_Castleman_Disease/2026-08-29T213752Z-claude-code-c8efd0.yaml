  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Evidence-integrity review of ~22 in-body evidence items against 18 cached references (6 PMIDs, 12 DOIs), re-reading each cited publication. Five defects found and fixed: (1) the Angiogenesis and Vascular Proliferation node cited a quote about inflammatory symptoms and lymphoproliferation that says nothing about angiogenesis or VEGF; no cached source contains a quotable IL-6/VEGF vascular-proliferation statement, so the evidence item was removed, the node description softened to state the VEGF link as hypothesis, and the gap recorded in notes; (2,3) Night Sweats and Fatigue phenotypes cited the siltuximab trial's grade-3+ treatment-emergent adverse-event sentence (PMID:25042199) as if it were disease-symptom evidence - both items removed, phenotypes and frequency bands kept, gaps noted; (4) Anemia carried the same adverse-event misread but a genuine source existed - replaced with the disease-course normalization quote from DOI:10.1182/bloodadvances.2022007112 (manually verified exact); (5) the Fever explanation claimed frequency across all MCD subtypes from a TAFRO-definition quote - softened to what the quote supports. Confirmed sound: HHV-8-associated vs idiopathic MCD vs TAFRO subtyping is correctly separated and sourced; deep-research references-block DOI rows are provenance stubs, not mechanism claims. Validation: just validate and count-verified-snippets --strict pass.

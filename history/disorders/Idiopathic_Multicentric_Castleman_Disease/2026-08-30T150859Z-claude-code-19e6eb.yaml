  summary: Address review on PR 9974
  details: |
    Addresses the CHANGES_REQUESTED review from ai4c-reviewer on PR 9974.

    Split the bundled non-atomic node 'Plasma Cell / B Cell Proliferation and Acute-Phase Response' into two atomic nodes: 'Plasma Cell / B Cell Proliferation' (CELLULAR) and 'Hepatic Acute-Phase Response' (TISSUE). These were two mechanistic claims on different cell lineages with different clinical read-outs, which the single-valued biological_scale slot could not express. Each now conforms to the matching module node, and the upstream edge and the discussion entity reference were re-pointed.

    Added a disease-level references: block carrying the substantive leads dropped when the retired umbrella entries were split. These are provenance entries with no findings block, because neither key source has a retrievable abstract in the reference cache and manufacturing a snippet for them would be exactly the fabrication risk the evidence SOP warns about.

    Also split 'Bone Marrow Reticulin Fibrosis and Megakaryocyte Dysregulation' into 'Bone Marrow Reticulin Fibrosis' (TISSUE) and 'Peripheral Platelet Consumption' (ORGANISM). These are different claims - stromal remodeling in the marrow versus platelet survival in the circulation - and neither is established as causing the other, so bundling them asserted a link the literature does not support.

    Recorded the Lossos 2024 SVEP1/tissue-factor/endotheliopathy finding as an unmined lead on the renal thrombotic microangiopathy node, noting it would be a candidate for the unidentified mediator that node records and would connect it to the PI3K/AKT/mTOR node. Not curated as evidence: the cached record has no retrievable abstract.

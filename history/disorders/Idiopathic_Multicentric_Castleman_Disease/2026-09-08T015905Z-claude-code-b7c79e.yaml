  summary: Correct fever frequency band, grade trial registrations OTHER, restore
    fever directness
  details: |
    Round-5 review of PR 9974 found three evidence-hygiene defects in this entry.

    Fever carried 'frequency: VERY_FREQUENT' (80-99%), contradicted by the entry's own notes and its only attached evidence: the meta-analysis reports constitutional symptoms in 46.6% of iMCD patients. Fever is a component of that composite, so its rate cannot exceed 46.6%. Changed to FREQUENT (30-79%). The corresponding HHV-8 entry is correct at VERY_FREQUENT, since its figure is 98.6%.

    Both clinical_trials evidence items cited 'clinicaltrials:' registry records with no evidence_source, and an absent value defaults to HUMAN_CLINICAL - grading a registration document as human clinical evidence. NCT03933904 is status UNKNOWN and NCT07085039 is RECRUITING, so neither has results to be clinical evidence of. Both now carry 'evidence_source: OTHER', matching main's grading.

    The Fever meta-analysis item regained 'directness: INDIRECT', which main had assessed: the quote gives a composite constitutional-symptom rate, and fever is one component of it.

    Also moved a sentence of curation rationale out of the 'Marrow Stromal Fibrotic Remodeling' node description into that node's notes. The description renders on the disorder page, and an explanation of why the node is named as it is belongs in notes rather than in prose describing the biology.

    Correction to an earlier record: 2026-09-04T231426Z-pr-shepherd-*.yaml states that each of main's findings was checked against this entry, and enumerates four items deliberately not ported. That enumeration was incomplete - the two trial gradings were neither ported nor listed as declined. This record supersedes that coverage claim; the earlier record is left as written, per the append-only rule.

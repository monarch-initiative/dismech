  summary: Review COX16 assembly mechanism, clinical course and model-dependent copper
    response
  details: |
    Reviewed the original COX16 entry against the full founding clinical report (PMID:33169484), the full COX16 assembly study (PMID:29381136), the available Cerqua abstract (PMID:29355485), and the relevant COX16 knockout thiol-trapping experiments and methods in PMID:35750769. Refetched the first two papers to full-text caches. The Cerqua PMID and DOI routes did not retrieve full text; direct publisher URL fetching returned HTTP 403. Publisher-indexed results, copper and yeast experiments, and discussion were additionally read via web search, but uncached details were not converted into evidence quotations. Full text was critical: copper chloride failed to rescue patient fibroblasts despite rescue in engineered cells, and the two patients had substantially different survival.

    Replaced the bundled loss/copper/assembly/ATP narrative with six separate nodes for protein deficiency, SCO1 recruitment, COX2 stability, COX1-COX2 module joining, complex IV assembly, and respiratory capacity. Preserved the assembly-module conformance and updated its node-catalog example. Bound the proximal protein-recruitment activity to GO:0030674 after inspecting the adaptor definition and the SCO1-COX2 interaction experiments. Human COX16 is not presented as a permanent supercomplex subunit or a proven direct copper transporter. Normal mitochondrial translation, preserved SCO2 association, residual complex IV activity, and normal muscle histochemistry qualify the mechanism. Thiol-trapping evidence is explicitly unable to distinguish oxidized from copper-bound states.

    Expanded clinical findings from four to 28 with direct clinical quotations, without estimating population frequencies from two cases. Neonatal hypoglycemia, hypotonia/areflexia, congenital bilateral sensorineural hearing impairment, growth restriction, ventilatory dependence, feeding/growth problems, diarrhea, progressive cardiac obstruction/failure, cerebral edema/infarcts, ventriculomegaly, coagulation abnormalities and specific biochemical findings are represented. Removed the title-only liver evidence. Did not turn explicitly uncertain atrophy into a definite phenotype, infer seizures from encephalopathy, classify infarcts as MELAS stroke-like episodes, or convert nonspecific acylcarnitines into another metabolic diagnosis. Corrected universal fatal-neonatal wording: one patient died at 55 hours, the other almost seven months old.

    The gene-specific GeneReviews check initially found no chapter. Retrieved and mined the applicable Primary Mitochondrial Disorders Overview (PMID:20301403 and full NBK1224 URL), covering clinical context, molecular/functional diagnosis, surveillance and recessive counseling with conditional recurrence risks and prenatal/preimplantation testing. Full mitochondrial care consensus PMID:28749475 supplies explicitly general cardiac, nutrition, audiology, critical-care and anesthetic recommendations. Case-specific glucose, beta-blocker, enteral feeding, ventilation and palliative interventions remain distinguished from broad guidance and preclinical copper experiments. Patient fibroblast complementation, engineered HEK cells and C. elegans knockdown are linked to the mechanisms with fidelity limitations; rescue of cultured cells is not labeled clinical gene therapy.

    Checked the dated ClinGen mitochondrial expert-panel curation, which classifies the relationship as Moderate because independent human genetic replication is limited despite functional support. Cached the official URL through the fetcher after the structured CGGV route was unsupported. Retained the precise MONDO:0859160 disease identity, verified its causal hgnc:20213 relation, and verified HPO/GO/NCIT/CHEBI bindings with OAK. Updated the creatine-kinase label to the live OLS canonical activity label after the older local HPO build differed.

    Cross-checked the broad cytochrome c oxidase Falcon report, citation companion and gene table for phenotypes, genetics, pathophysiology, diagnostics, treatment, models and references. No COX16-specific core omission remained; other-gene cohorts, pooled myopathy trials, SCO1 diagnostic experiments and COA6 treatment responses were not transferred. No disease-specific trial or dataset surfaced in the directly used sources. The two clinical courses do not establish distinct mechanistic subtypes or general prevalence, penetrance or survival estimates. Removed historical workflow commentary from the KB notes. All reference cache changes were fetcher-generated; no cache text was hand-authored.

  summary: Clarify copper evidence direction, assembly model support and cardiac sequelae
  details: |
    Addressed the non-blocking suggestions from the approving review on PR #13444. Negative copper-rescue findings now REFUTE treatment efficacy in the tested patient fibroblast system, using separate evidence objects so the model description retains SUPPORT for its negative result. The engineered-cell assembly link now quotes the directly observed reduction in assembled complex IV. Added supported sequelae for hypertrophy to outflow obstruction and progressive heart failure, and heart failure to secondary feeding problems. Left liver failure and coagulopathy as co-occurring clinical observations: the founding case does not establish the coagulation mechanism or attribute it specifically to impaired hepatic synthesis. Added a genetic note explaining that the ClinGen Moderate curation uses broader MONDO:0044970, so it is not copied as a formal assertion for MONDO:0859160. Kept the GeneReviews encephalopathy passage HUMAN_CLINICAL with REVIEW_SYNTHESIS because it summarizes human clinical manifestations; general diagnostic, management and counseling guidance remains OTHER. These are evidence-type and quotation-role distinctions, not inconsistent grades for one sentence. All changes are bundled in one review-response commit.

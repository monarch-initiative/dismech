  summary: 'Create: Disabling_Pansclerotic_Morphea_Of_Childhood'
  details: |
    New entry for disabling pansclerotic morphea of childhood (MONDO:0957497, OMIM 620443), the STAT4 gain-of-function autoinflammatory fibrosing disorder. Primary source is the 2023 NEJM report of three families with heterozygous SH2-domain STAT4 variants (PMID:37256972), used for the genetic, inheritance, molecular and cellular pathophysiology (constitutive STAT4 phosphorylation, fibroblast IL-6 autoinflammatory loop, impaired fibroblast wound repair, lymphocyte inflammatory program), the systemic laboratory phenotypes and the ruxolitinib response. Clinical-spectrum, ulcer-associated squamous cell carcinoma and conventional-treatment claims come from the pre-genetic DPMC literature (PMIDs 7356347, 18048875, 19250408, 28543434, 17143989, 30838436, 29455178, 28980909, 39520387), and the entry notes that those patients were not genotyped. A provisional type II interferon tissue node rests on a single-patient pansclerotic morphea transcriptomic study (PMID:37471168) whose genotype was not reported. One openscientist deep-research report was used (research/Disabling_Pansclerotic_Morphea_Of_Childhood-deep-research-openscientist.md); its in-run term validation crashed on an OLS read timeout, so reference and term validation sections were retro-fitted with just validate-research-reference and just validate-research-terms (8/8 references resolved; none of its mislabelled CURIEs were used). The report placed the STAT4 variants in the DNA-binding domain and described Th1 skewing; both contradict the cited NEJM paper (SH2 domain; Th1 skewing not observed), so those statements were not used. Its one new lead, PMID:40518164 (Chinese case report of de novo p.His623Tyr with ruxolitinib response), was added. preflight-dr could not run (local mondo.db absent, exit 2); disease identity was checked manually (report names STAT4 throughout and cites OMIM 620443, matching the MONDO xref). Eight phenotypes (panniculitis, eosinophilia, portal hypertension, glaucoma, cataract, sensorineural hearing loss, sepsis, gangrene) and the hypogammaglobulinemia-to-infection link were left unwired or weakly wired where no mechanism is sourced. Validated with just validate, count-verified-snippets (87/87), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, global gates, and validate-disorders.

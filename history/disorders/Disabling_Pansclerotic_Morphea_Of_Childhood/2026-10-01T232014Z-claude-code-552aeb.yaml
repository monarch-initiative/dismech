  summary: 'Pre-PR review fixes: Disabling_Pansclerotic_Morphea_Of_Childhood'
  details: |
    Applied a pre-PR review pass. Removed eight unsupported downstream edges from the Lymphocyte Inflammatory Transcriptional Program node (lymphopenia, IgG, IgA, arthritis had no treatment-response or mechanistic support); re-sourced neutropenia, anemia, thrombocytopenia and pulmonary arterial hypertension as INDIRECT edges from the STAT4 node, each carrying the ruxolitinib treatment-response snippet from PMID:37256972. Added restrictive ventilatory defect (HP:0002091, BACKGROUND), pulmonary nodule (HP:0033608) and pulmonary infiltrates (HP:0002113) phenotypes, left unconnected as background mortality/less-frequent findings. Added a diagnosis section (skin biopsy, musculoskeletal imaging, genome sequencing). Rebound the STAT4 signalling node GO term to GO:0007259 (JAK-STAT, ruxolitinib response confirms JAK dependence) and added conforms_to jak_stat_pathway_activation. Added IMMUNE_RHEUMATOLOGIC and DERMATOLOGY Harrison classifications. Corrected joint-contracture frequency from VERY_FREQUENT to FREQUENT; prevalence ceiling moved to rate_high; wound-healing background quote marked quote_role BACKGROUND; subject-less lymphocyte snippet expanded; notes and ruxolitinib wording corrected. Validated: validate (97 snippets), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-grading/length/title, check-coarse-phenotypes, check-reference-titles, check-enum-values, validate-disorders.

  summary: 'Address review items: SETD5_Haploinsufficiency_Syndrome'
  details: |
    Addressed the three outstanding IMPORTANT reviewer items on PR #7529, all additive; no existing structure was rewritten.

    (1) diagnosis: added a 'DNA Methylation Episignature Testing' entry (NCIT:C63328 DNA Methylation Analysis, verified live with OAK and confirmed reachable from NCIT:C25218). It covers both clinical uses the reviewer named: reclassifying a SETD5 VUS, and the KBG / Cornelia de Lange / SETD5 differential, with an explicit cross-reference to the existing differential_diagnoses section. Evidence: three items from PMID:41957673 (Koparir et al., Clin Epigenetics 2026, EpiSign in 400 routine diagnostic NDD cases), which is the only one of the three reviewer-named PMIDs whose cached record actually names SETD5. It establishes SETD5 diagnostic concordance and VUS support, the combined KBGS_MRD23 episignature shared with ANKRD11/KBG (requiring secondary disorder-specific episignatures and MDS clustering to separate the two), and the negative-result bound (three ANKRD11/SETD5 VUS were episignature-negative). PMID:32109418 is cited once as PARTIAL for the general principle only, with the explanation stating that its abstract does not name SETD5. PMID:34906459 was fetched but NOT cited: its cached abstract does not mention SETD5 or MRD23 anywhere. Both of those sourcing limits are recorded in the entry's notes field rather than papered over.

    (2) phenotypes: added 'Lower Limb Asymmetry' (HP:0100559, label verified live with OAK) in the Musculoskeletal category next to its sibling Scoliosis. frequency: OCCASIONAL, derived from the denominator in the cited source itself (2 of 7 children = 29%, top of the 5-29% band) and concordant with the HPO annotation of HP:0100559 to OMIM:615761 at 2/7. Evidence is the already-cache-verified leg-length-discrepancy quote from PMID:24680889 that previously appeared only inside the Orthopedic and Skeletal Management treatment description, plus the abstract-level statement of the same finding; no new fetch was needed. HP:0100559 was also added to that treatment's target_phenotypes so the description and the structured targets agree.

    (3) treatments: added 'Psychiatric and Behavioral Pharmacotherapy' following the responsible precedent already set by the Antiseizure Medication entry - generic NCIT:C15986 Pharmacotherapy, deliberately NO therapeutic_agent, all three evidence items supports: PARTIAL, and a notes disclaimer stating that the evidence establishes only the size and composition of the treatable psychiatric population and that no study measures the efficacy, safety, or comparative effectiveness of any psychotropic drug in SETD5 haploinsufficiency. target_phenotypes are the four already-curated psychiatric phenotypes (Anxiety HP:0000739, ADHD HP:0007018, Psychosis HP:0000709, Compulsive behaviors HP:0000722). Evidence reuses already-cached snippets: the De Falco multicenter-cohort psychiatric-comorbidity sentence (PMID:39603091), the 47% anxiety figure (PMID:42468298), and the obsessive-compulsive/ritualized-behavior sentence (PMID:24680889). The notes also carry forward the caveat from the epilepsy literature that subtle seizures can be mistaken for behavioral phenomena, so a psychiatric attribution should not be assumed before neurological evaluation.

    Also completed the optional (blue) item: extended the existing Table 1 frequency re-anchoring pattern to six sibling phenotypes that still carried 'Frequency is omitted' notes where Table 1 of PMID:24680889 supplies a SETD5-column count - Brachycephaly (3/7, FREQUENT), Synophrys (5/7, FREQUENT), Upslanted Palpebral Fissure (6/7, VERY_FREQUENT), Long Nose (7/7, VERY_FREQUENT), Low-Set Ears (5/7, FREQUENT), and Feeding Difficulties (5/7, FREQUENT). Each gains a second evidence item quoting the Table 1 row byte-exactly and a notes field recording the derivation and, where applicable, that the HPO term is narrower than the combined category the table scores. Long Nose is flagged in its own notes as the least tightly term-matched of these, since the scored row is the broader 'Abnormal nasal shape'; its Table 1 evidence item is marked PARTIAL for that reason. Prominent Forehead was deliberately left unbanded because Table 1 has no corresponding row.

    Validation: 'just validate' clean (schema: no issues; term validation: passed; reference validation: 177/177 snippets verified against cached references, up from 171). 'just validate-references' clean at 177/177. 'just compliance' global 98.7% (380/385), weighted 99.0%; the five remaining gaps are pre-existing missing datasets/evidence on discussions[].proposed_experiments and are untouched by this change. Every new snippet was copy-pasted from the cached reference rather than retyped, including the fi/fl ligatures in the PMID:24680889 PDF text and the run-together italicised gene symbols in the PMID:41957673 full-text HTML.

  summary: 'Create: SETD5_Haploinsufficiency_Syndrome'
  details: |
    Created kb/disorders/SETD5_Haploinsufficiency_Syndrome.yaml for MONDO:0014336
    (intellectual disability-facial dysmorphism syndrome due to SETD5
    haploinsufficiency; OMIM:615761; SETD5 / HGNC:25566), closing issue #7500 under
    epic #1079.

    NEC preflight. Run before any content was written:
    `uv run runoak -i sqlite:obo:mondo info MONDO:0014336 -O obo` confirmed
    `relationship: RO:0004003 HGNC:25566 ! SETD5` and `xref: OMIM:615761`. Every
    citation was checked for the gene symbol SETD5 rather than the one-character
    neighbours SETD2 (Luscan-Lumish), SETD1A, or SETD1B, or the locus-adjacent
    SETBP1. The entry is also kept explicitly distinct from the contiguous 3p25.3
    microdeletion syndrome: SETD5 is the principal driver of that deletion phenotype
    (124 kb three-gene critical region), but the two entities differ in extent,
    assay, and MONDO/OMIM anchors, and PMID:32793091 argues directly that the
    overlapping chromatinopathies "still remain distinct clinical entities". The
    split rationale is recorded in the description, in a differential_diagnoses
    entry, and in the `nec_setd5_vs_3p253_deletion` INTERPRETATION discussion. The
    deep-research report independently flagged that ORPHA:435638 "Proximal 3p25.3
    microdeletion syndrome" (MONDO:0018564) is a different entity; it was therefore
    not used as a source.

    Deep research. Provider that actually ran: claude_code
    (research/SETD5_Haploinsufficiency_Syndrome-deep-research-claude_code.md, 78
    turns, 15 citations, 1250 s). falcon was not attempted because EDISON_API_KEY and
    FUTUREHOUSE_API_KEY are both empty in this environment. The report was read in
    full before the YAML was finalized and was treated as leads only: every PMID it
    suggested was fetched with `just fetch-reference` and every snippet re-verified
    against the cached text.

    GeneReviews. No GeneReviews chapter exists for SETD5 haploinsufficiency syndrome,
    MRD23, or 3p25.3 microdeletion syndrome. Two PubMed searches
    ("SETD5 GeneReviews[All Fields]" and a GeneReviews-restricted SETD5/3p25.3 query)
    returned zero records on 2026-07-31, and the absence is documented in the entry's
    top-level `notes`. The phenotype baseline is instead the 28-patient European
    multicenter cohort (PMID:39603091), the Powis diagnostic-exome cohort
    (PMID:28881385), the National Brain Gene Registry cohort (PMID:40265665), the
    support-group survey (PMID:42468298), and the gene-discovery reports
    (PMID:24680889, PMID:25138099).

    Content curated. Nine pathophysiology nodes with CL and GO bindings:
    SETD5 haploinsufficiency (NMD-verified), impaired H3K36 methylation and chromatin
    regulation, aberrant RNA polymerase II elongation and transcriptional infidelity,
    dysregulated rDNA expression and reduced translation (HDAC3-TIP5-cyclin D1),
    mitochondrial fragmentation and bioenergetic deficit, impaired neural progenitor
    proliferation and cortical neurogenesis, reduced synaptic density and cortical
    network hypoconnectivity, impaired neurodevelopment, and extra-neural
    developmental involvement. Two competing `mechanistic_hypotheses` are modelled
    rather than silently resolved (SETD5 as a catalytic H3K36 methyltransferase
    versus a catalytically inert co-repressor scaffold), both wired via
    `hypothesis_groups` to the convergent transcriptional-infidelity edge. Also
    added: 39 phenotypes with HPO terms and cohort-derived frequency bands, genetic,
    inheritance (with a separate incomplete-penetrance block), diagnosis, four
    differential diagnoses (3p25.3 microdeletion syndrome, KBG, Cornelia de Lange,
    SETD1B-NDD), prevalence, seven treatments, three animal models (mouse Setd5
    heterozygote, cardiopharyngeal-mesoderm conditional, zebrafish setd5), and five
    discussions including a HUMAN_MODEL_MISMATCH on the mouse mitochondrial
    phenotype with two proposed experiments.

    Evidence discipline. Frequency bands were taken only from quantitative cohort
    statements and omitted wherever the source gave a collective or qualitative
    figure; the reason is recorded in the phenotype `notes` each time. Conflicting
    evidence was retained rather than smoothed: the Growth Delay phenotype carries
    both a SUPPORT item (severe short stature, PMID:40869907) and a REFUTE item
    (normal growth in all seven gene-discovery individuals, PMID:24680889), and the
    Seizure phenotype records that the original cohort had no seizures. The
    SETD5-moyamoya association is PARTIAL with no frequency because the source
    states validation is still required.

    Validation. `just validate` passes cleanly (schema: no issues; terms: validation
    passed; references: 161/161 snippets verified against cached references).
    `just compliance` reports 98.6% global / 98.9% weighted; the only remaining gaps
    are `datasets` and `evidence` on the two proposed (not yet performed) experiments,
    which are correctly empty.

  details: |
    Adversarial red-team review of PR #7529. Verified mechanically that all 161 original snippets are byte-exact substrings of their cached references, that all 19 cited PMIDs resolve on live PubMed (including the very recent PMID:42468298), that all 161 reference_title values match their caches, and that the NEC anchor is correct (MONDO:0014336 carries RO:0004003 to HGNC:25566 SETD5, OMIM:615761 and Orphanet:404440). Found and fixed three phenotypes whose sole evidence was a sentence describing individuals with the smallest 3p25 microdeletion, a contiguous-deletion entity this entry explicitly scopes out: Abnormality of the Gastrointestinal Tract, Depressed Nasal Bridge and Long Philtrum. All three features are genuinely reported in the SETD5 loss-of-function cohort, so each snippet was re-anchored to the SETD5-variant column of Table 1 of PMID:24680889 (5/7, 3/7 and 5/7 respectively) and a quantitatively supported FREQUENT band was added to each. Also added a Table 1 quantitative anchor (6/7 = 86 percent) to the pre-existing VERY_FREQUENT band on Delayed Speech and Language Development, which previously rested only on qualitative wording. Validation after changes: schema and term validation pass, 162/162 snippets verified, weighted compliance 98.9 percent.

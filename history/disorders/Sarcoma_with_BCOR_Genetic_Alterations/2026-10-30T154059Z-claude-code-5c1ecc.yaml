  details: |
    Round one of review on the pull request that creates this entry. One blocking point and two suggestions, all addressed in this push.

    Blocking point. The phenotype layer was disconnected, 0 of 1 phenotypes causally connected. Added a second phenotype, Metastatic Disease and Local Recurrence, and connected both phenotypes to the proliferation node. Connectivity is now 2 of 2. The new phenotype is left unbound for the same reason as in the sibling CIC entry: a label and synonym search of HPO through the OLS4 API on 30 October 2026 for metasta star returns only HP:0200059 Metastatic angiosarcoma, a different disease, so HPO has no general metastasis term and a site term would assert a site the sources do not establish.

    First suggestion, taken. The entry's prose said the fusion's route to transformation runs through the appended cyclin rather than through the polycomb node, but no edge carried that route. Added an edge from BCOR Overexpression to the proliferation node, carrying the NIH3T3 S phase result as its own evidence with the same grading the node already used, and a description that names it as the fusion route and states its limits. The polycomb edge now says explicitly that it is the internal tandem duplication's route.

    Second suggestion, taken. The chemotherapy treatment now carries a target_mechanisms link to the proliferation node.

    The recurrence figure is quoted with the swung dash the source prints, copied from the cache file rather than retyped, so the snippet matches byte for byte as well as after normalisation.

    Validation: all 18 C4 gates pass after the changes.

  summary: Cite the uncited causal edges in sarcoma with BCOR genetic alterations
  details: |
    Five of the six pathophysiology causal edges carried no evidence; all six are now cited, with thirteen new evidence items drawn from the entry's existing reference set. No new references were fetched and no terms were bound.

    Two gradings are worth reading. The convergence edge, from the alteration to BCOR overexpression, is cited at transcript level, at protein level and from an independent cohort; the protein-level item's explanation names the 93 per cent figure for the internal tandem duplication, so 'every one of the recurrent alterations' is recorded as a statement about the classes rather than about every individual tumour.

    The polycomb edges are the entry's weakest link and are now cited in a way that says so. The only experimental work available for them, PMID:33920124, was done in neural stem cells for the central nervous system BCOR-ITD tumour, which this entry's own notes keep separate from the sarcoma on histopathological and methylation grounds. Both items taken from it are therefore INDIRECT, and the derepression-to-proliferation edge carries a paired REFUTE: the duplication increased growth, invasion and migration in murine cells, and the same study saw no growth advantage in human cells and could not establish long-term models. So that step is supported in mouse cells and not reproduced in human ones, which is the substance of the edge being typed with unknown intermediates.

    No cell of origin was marked and no genetic_context was added to a pathophysiology node, consistent with the decision recorded in this entry's notes and in its two sibling WHO entries. The note cites PMID:35174661's suggestion that the CNS and sarcoma groups may differ by cell of origin, which is a hypothesis about the difference rather than an identification of either cell, so the entry still reports NO_ORIGIN under just check-cancer-origin.

    Validated with just validate-disorders over all three sibling entries (134 snippets, 134 titles, 0 issues) plus the per-file and whole-tree offline gates.

  summary: 'Create: Sarcoma with BCOR Genetic Alterations (MONDO:0958159)'
  details: |
    Second of the three remaining entities of the undifferentiated small round cell sarcoma category of the 2020 fifth edition of the World Health Organization classification of bone and soft tissue tumours. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only.

    The entity is defined by a shared consequence rather than by one lesion: BCOR::CCNB3 fusion, BCOR internal tandem duplication, BCOR::MAML3 and ZC3H7B::BCOR all raise BCOR expression. That convergence is recorded as a four-node chain, alteration to BCOR overexpression to derepression of polycomb target genes to a round to spindle cell sarcomatous proliferation. Two subtypes are declared, BCOR-CCNB3 and BCOR-ITD, because they differ in age, site and marker: adolescent males with bone-predominant tumours against infants with trunk, abdominal and head and neck soft tissue tumours, separated in practice by CCNB3 staining.

    The molecular function on the lesion node is marked ABNORMAL rather than a directional value, and the node notes say why: the duplication derepresses polycomb targets while the fusion appends a cyclin and drives S phase entry, so a single directional value would assert of both what is shown for one.

    Scope is stated in the entry notes. BCOR internal tandem duplication also occurs in clear cell sarcoma of the kidney, which has its own entry, in high-grade endometrial stromal sarcoma, and in the central nervous system BCOR-ITD tumour. The separation from the CNS tumour is not only anatomical: a 33-tumour study found marked histopathological differences and consistent separation under unsupervised clustering of expression and methylation data. As in the sibling CIC entry, no cell of origin is marked and the somatic lesion sits in the genetic section instead.

    One grading conflict was found by check-snippet-grading and fixed rather than worked around. A single sentence of the discovery paper reports both a CCNB3 immunohistochemistry result in patient tumours and an S phase result in NIH3T3 cells; it had been quoted whole as HUMAN_CLINICAL in the genetic record and in part as IN_VITRO on the proliferation node. The two halves are now quoted separately, each with its own grading.

    Nine references. Twenty-seven snippets, all verified. Two cache rows shared with the CIC-rearranged sarcoma branch were set to that branch's exact timestamps so the two pull requests add byte-identical rows.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-cache-order, check-term-cache-integrity, check-logical-rules, check-qualifier-terms, validate-terms and check-shared-disease-terms.

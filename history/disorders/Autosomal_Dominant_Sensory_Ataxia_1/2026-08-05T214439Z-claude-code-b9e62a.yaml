  summary: 'Review: calibrate DRG neuronopathy claims to per-kindred evidence'
  details: |
    Post-curation review of the ADSA1 entry, correcting over-generalization of the dorsal root ganglion (DRG) sensory neuronopathy claim.

    The entry asserted DRG sensory neuronopathy as the universal primary lesion. That is not supported across kindreds: the originally described Maritime Canadian families had normal sensory nerve conduction despite posterior-column disease (PMID:32943585, "Affected cases showed progressive sensory loss and ataxia due to degeneration of the posterior columns, but normal sensory nerve conduction."), whereas the Ecuadorian kindred had absent sensory action potentials in all four limbs. A ganglionopathy degenerates both central and peripheral branches, so preserved peripheral conduction argues the lesion is not a ganglionopathy in those families.

    Changes:
    - description: the defining lesion is posterior-column degeneration; DRG neuronopathy is presented as a per-kindred finding, not universal.
    - pathophysiology "Dorsal Root Ganglion Sensory Neuronopathy": mechanism_confidence ESTABLISHED -> PROVISIONAL, added frequency OCCASIONAL, description scoped to the Ecuadorian kindred with an explicit non-generalization caveat.
    - pathophysiology "Peripheral Sensory Axon Degeneration": removed conforms_to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination. That module node models length-dependent distal dying-back; the ADSA1 peripheral arm is the non-length-dependent peripheral branch of a ganglionopathy. Conformance to the module trigger node is retained on the DRG node.
    - pathophysiology "Variable Corticospinal Tract Involvement": added a downstream edge to the Pyramidal Signs phenotype, which the node description already stated it underpins but did not link.
    - prevalence: prevalence_class BELOW_1_IN_1000000 -> ULTRA_RARE. measure_type is CASES_IN_LITERATURE (about four families known); the numeric Orphanet band asserted a measured rate that does not exist, whereas ULTRA_RARE is the qualitative tier for prose-only sources.

    Deliberately not changed: onset wording. An in-progress edit had softened "fifth to seventh decade" to "mid-to-late adulthood" in the description and inheritance blocks only. That was reverted, because the range is evidence-grounded (documented onset ages 47, 50 and about 60 years, with a verified snippet) and the entry commits to it in the structured progression field age_range "Fifth to seventh decade" plus three differential-diagnosis comparisons. Softening two of six occurrences left the entry internally inconsistent without improving accuracy.

    Validation: just validate passes (schema, terms, references); 91/91 snippets verified against cached references. No new references were cited, so no reference cache changes were required.

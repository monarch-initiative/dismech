  summary: Address ai4c-reviewer CHANGES_REQUESTED on PR 7694
  details: |
    Response to the ai4c-reviewer formal review on PR #7694, which requested changes on two IMPORTANT items and raised five optional suggestions. Both IMPORTANT items fixed. (1) The Pyramidal Signs phenotype was rebound from HP:0001257 Spasticity to its parent HP:0007256 Abnormal pyramidal sign, verified with OAK, because the sole cited source says pyramidal involvement generically and asserting spasticity over-committed relative to the evidence. (2) The Positive Romberg Sign phenotype no longer rests solely on PMID:42052314, the case report that entry note 6 classifies as an unverified phenotype-expansion claim; its primary evidence is now the genotype-confirmed p.Arg199Cys Ecuadorian index case from PMID:32943585 with the exact snippet Romberg's was positive including its Unicode right single quote, and the case report is retained only as a secondary corroborating item. Note 6 was updated to record that the phenotype now stands independently of that report. Four of the five suggestions were adopted. The unevidenced TMUB1 gene on the IP3-receptor-ERAD node is now backed by two verified snippets from PMID:38782601, newly fetched, which names TMUB1 as an ERLIN-bridged partner of RNF170 and notes that variants precluding those interactions cause hereditary spastic paraplegia. A new eleventh pathophysiology node, Variable Corticospinal Tract Involvement, closes the pathograph gap the reviewer flagged; it is deliberately PROVISIONAL and OCCASIONAL, carries a REFUTE item quoting Babinski was absent from the genotype-confirmed index case, and is linked from the Pyramidal Signs phenotype via reports_on with relationship READOUT_OF. The bundled Paresthesia and Dysesthesia phenotype was split to a single concept and rebound from HP:0003401 Paresthesia to HP:0012534 Dysesthesia, since only dysaesthesia is snippet-supportable. OMIM:608984 was added as an external_assertions record rather than under mappings, because the schema DiseaseMappings container offers only icd10cm, icd11f, mondo and ncit slots and external_assertions is the established pattern for OMIM identifiers in this repo. One suggestion was adopted only in part with reasoning: a Pseudoathetosis phenotype was added using the snippet-supportable observation of pseudo-athetotic arm movements, because it structurally carries the upper-limb non-length-dependent argument behind the documented module non-conformance, but it is deliberately left with a free-text preferred_term and no ontology term binding. The reviewer suggested HP:0011443, which resolves to Abnormality of coordination, a very high-level parent that would not convey this specific deafferentation sign, and HP:0002305 Athetosis would be actively misleading since pseudoathetosis is not extrapyramidal. HPO has no pseudoathetosis term. This reasoning is recorded in the phenotype notes and in new entry note 8a. Validation after the changes: schema pass, ontology term validation pass, references 91 of 91 snippets verified up from 85, pytest 9 of 9 file-scoped checks pass, and a manual foreign-key sweep confirms 11 pathophysiology nodes, 14 phenotypes, zero broken references and no orphan hypothesis groups. All three newly used ontology terms, HP:0007256, HP:0012534 and UBERON:0002707, were already present in the committed term caches from earlier entries, so no new cache lines were produced and nothing cache-related is left uncommitted.

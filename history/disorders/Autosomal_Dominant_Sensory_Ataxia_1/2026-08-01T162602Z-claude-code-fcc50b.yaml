  summary: 'Create: Autosomal Dominant Sensory Ataxia 1 [RNF170, MONDO:0012166]'
  details: |
    De-novo curation of ADSA1/SNAX1, caused by the recurrent heterozygous RNF170 p.Arg199Cys allele. NEC preflight against MONDO:0012166 with OAK confirmed all three identity anchors: gene RNF170 via RO:0004003 HGNC:25358, OMIM:608984, synonyms ADSA and SNAX1. No GeneReviews chapter exists for this gene or disease - verified by PubMed search returning zero hits - so the phenotype baseline was built from the three primary clinical reports that constitute the entire clinical literature: PMID:21115467 gene discovery in two Maritime Canadian founder families, PMID:34469621 Belgian family, and PMID:32943585 Ecuadorian family reported as a CANVAS mimic whose cached full text supplies examination-level detail. Ten pathophysiology nodes trace the chain from p.Arg199Cys transmembrane destabilisation, through enhanced autoubiquitination and erlin1/2-RNF170-mediated IP3 receptor ERAD, to dysregulated ER calcium release, dorsal root ganglion sensory neuronopathy, posterior column degeneration, variable peripheral sensory axon and vestibular ganglion involvement, and progressive sensory gait ataxia. Mechanism is deliberately modelled as unresolved via three mechanistic_hypotheses with hypothesis-tagged causal edges: toxic gain-of-function or dominant-negative EMERGING, RNF170 haploinsufficiency ALTERNATIVE carrying a REFUTE evidence item, and non-IP3-receptor substrate dysregulation EMERGING. Three discussions including a HUMAN_MODEL_MISMATCH arguing that the Rnf170-null mouse and the naturally occurring canine frameshift both correspond genotypically to recessive SPG85 rather than to dominant ADSA, since human heterozygous null carriers are unaffected. Partial conformance to peripheral_axonal_degeneration is declared on two nodes, with documented deliberate non-conformance to the length-dependent node because ADSA is a non-length-dependent ganglionopathy, and outright rejection of cerebellar_purkinje_degeneration because the cerebellum is characteristically spared. Validation: schema pass, ontology term validation pass, 85 of 85 snippets verified against cached references. Two deep-research reports, falcon and openscientist, were generated and committed and used as lead-generation and cross-check layers only; both were NEC-screened by gene-mention frequency and both proved concordant with the primary literature, with openscientist independently reaching the same null-model-mismatch conclusion.

  summary: 'Create: Intellectual Developmental Disorder With Autism And Dysmorphic
    Facies (PDZD8)'
  details: |
    New entry for IDDADF (MONDO:0859281), autosomal recessive syndromic intellectual disability from homozygous PDZD8 truncating variants. Clinical content from the two family reports (PMID:35227461 families A and B; PMID:40016860 family C and a six-patient table, whose counts give phenotype frequencies). Pathograph: PDZD8 loss of lipid transfer and ER-endosome / ER-mitochondria tethering activity leads to impaired endolysosome maturation (and brain cholesteryl ester accumulation via impaired lipophagy, mouse) and impaired ER-mitochondria calcium coupling; both feed neurite/synapse development and hippocampal synaptic plasticity deficits, which the authors link to ID, developmental delay and autistic behaviour (edges marked INDIRECT where the step is the authors' inference). Mechanism evidence is from cells, flies and mice; no patient cells have been studied, recorded as a knowledge gap. Deep research (claude_code) used as leads only. Validated with just validate, validate-terms, count-verified-snippets (70/70), check-entity-refs, check-causal-targets, check-duplicate-keys, gene-activity grounding against origin/main, and validate-disorders. preflight-dr not run (no local MONDO build).

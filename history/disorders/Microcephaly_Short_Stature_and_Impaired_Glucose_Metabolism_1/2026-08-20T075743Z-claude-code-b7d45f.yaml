  summary: 'Create: Microcephaly, Short Stature, and Impaired Glucose Metabolism 1
    (TRMT10A)'
  details: |
    New Mendelian Disease entry for MSSGM1 / TRMT10A deficiency [MONDO:0000208], created in response to a curation request naming the disorder by its Orphanet label, "primary microcephaly-mild intellectual disability-young-onset diabetes syndrome" [ORPHA:391408 / MONDO:0018320; stubs/Primary_Microcephaly-mild_Intellectual_Disability-young-onset_Diabetes_Syndrome.yaml].

    ENTITY RESOLUTION. The named Orphanet concept is not a single disease. Orphadata lists BOTH TRMT10A and PPP1R15B as its assessed disease-causing genes, and cross-references ORPHA:391408 as BTNT - broader than - both OMIM:616033 [MSSGM1/TRMT10A] and OMIM:616817 [MSSGM2/PPP1R15B]. MSSGM2 was already curated in this KB. This session therefore did two things: curated the missing TRMT10A disease as kb/disorders/Microcephaly_Short_Stature_and_Impaired_Glucose_Metabolism_1.yaml anchored on MONDO:0000208, and created kb/groupings/Microcephaly_Short_Stature_and_Impaired_Glucose_Metabolism.yaml as the explicit union of MSSGM1 and MSSGM2, which carries the skos:exactMatch to MONDO:0018320 and to the OMIM-PS grouping MONDO:0800450. The Disease entry itself records MONDO:0018320 only as skos:broadMatch, since the Orphanet concept is strictly broader than it. The stub was deleted.

    DEEP RESEARCH. Two providers returned reports. claude_code: research/Microcephaly_Short_Stature_and_Impaired_Glucose_Metabolism_1-deep-research-claude_code.md, reference validation 10/10 resolved, 0 unresolved, 0 off-topic; just preflight-dr against MONDO:0000208 returned PASS - TRMT10A mentioned 62 times vs 4 for the nearest rival gene, report OMIM 616033 matches the MONDO xref. openscientist: research/Microcephaly_Short_Stature_and_Impaired_Glucose_Metabolism_1-deep-research-openscientist.md, 12/12 resolved, 0 unresolved, 0 off-topic; preflight returned WARN because the report discusses PPP1R15B (12 mentions) alongside TRMT10A (36) - the expected consequence of the lump/split situation described above rather than a wrong-entity report, and the openscientist report itself states the correct MSSGM1=TRMT10A / MSSGM2=PPP1R15B assignment and flags the conflation risk. falcon was attempted first per the default and failed with HTTP 402 Payment Required - the Edison key carries no credit. The openscientist report contributed the IER3IP1/MEDS1 differential diagnosis (PMID:24138066) and the monogenic-diabetes misdiagnosis evidence (PMID:33832649).

    ONE DEEP-RESEARCH ERROR CAUGHT AND DISCARDED. The claude_code report asserted that MSSGM2 is caused by biallelic IGF2BP1 variants. That is wrong; MSSGM2 [OMIM:616817 / MONDO:0014785] is caused by PPP1R15B, verified against the MONDO record and against the existing dismech MSSGM2 entry. The claim was not used and is recorded in the entry notes so it is not reintroduced; the openscientist report independently states the correct gene assignment. Two other report term suggestions were also rejected on verification: HP:0009806 for dorsocervical fat pad - the correct term is HP:0025383 - and HP:0040270 for insulin resistance - the correct term is HP:0000855.

    CONTENT. Ten-node pathophysiology chain from biallelic TRMT10A loss of function through loss of tRNA m1G9 methyltransferase activity, tRNA destabilization and fragmentation, and codon-specific translational impairment, splitting into the beta-cell arm - oxidative stress, intrinsic apoptosis, biphasic glucose dysregulation, insulin resistance - and the neural arm - progenitor pool, synaptic structure - plus a parallel non-catalytic TRMT10A-FTO mRNA m6A node. 18 phenotypes, 8 variant records spanning nonsense, splice, missense and whole-locus deletion, inheritance, 3 diagnosis entries, 2 biochemical markers, 5 treatments with metformin and insulin both linked to their target mechanism nodes, 1 animal model and 3 experimental models with structured readouts, 4 differential diagnoses, and 2 verified GEO datasets.

    DISCUSSIONS. One HUMAN_MODEL_MISMATCH - Trmt10a null mice show no discernible pancreatic defect while diabetes defines the human syndrome, so the whole beta-cell mechanism rests on human cellular models - plus three KNOWLEDGE_GAPs: unexplained peripheral insulin resistance; age-dependence versus true non-penetrance of the metabolic phenotype; and the absence of any direct human measurement behind the neural-progenitor account of the microcephaly. Each carries proposed experiments. The animal-model link to the beta-cell node is curated as FAILS_TO_RECAPITULATE with limitations and evidence, rather than being left as prose.

    FREQUENCY. No FrequencyEnum values are asserted anywhere in the entry. With on the order of twenty published probands and no cohort study, any band would have been manufactured; the descriptions state what was observed in which report instead.

    VALIDATION. just validate passes - schema, terms and references. just count-verified-snippets reports 136/136 snippets verified against cached references for the disorder and 2/2 for the grouping. just validate-grouping, just check-groupings - no contradictions; the two UNKNOWN verdicts are the unevaluable HAS_INHERITANCE leaf - just verify-datasets 2/2 OK, just check-duplicate-keys, just check-stubs and just check-title-snippets all pass. GeneReviews was searched for TRMT10A and no article exists, so no GeneReviews baseline applies. Orphanet HPO annotations were not cited: just refresh-orphadata failed on a sha256 mismatch against the pinned manifest and repinning would have required rebuilding all 8,823 ORPHA cache files.

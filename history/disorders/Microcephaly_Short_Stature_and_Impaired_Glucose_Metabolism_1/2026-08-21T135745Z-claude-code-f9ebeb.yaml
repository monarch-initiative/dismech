  details: |
    Addressed the CRITICAL finding and all three IMPORTANT findings from the ai4c-reviewer review of PR 9164. CRITICAL: PMID:30247717 (Cosentino et al. 2018, Nucleic Acids Research) was omitted from the original entry. It is the mechanistic paper for the endocrine phenotype and its absence propagated four separate errors, each now corrected. First, a whole mechanistic arm was missing: added a tRNA Fragmentation and 5-prime tRNA-Gln Fragment Generation node, since guanosine 9 hypomethylation causes tRNA-Gln fragmentation and the 5-prime fragments are what mediate beta-cell death - a gain of a toxic product rather than a shortage of tRNA. Second, the proposed experiment exp_patient_islet_assessment asked for work published in 2018 (patient iPSC-derived beta-like cells); it has been replaced with exp_trmt10a_fragment_rescue_in_mouse, which tests whether the murine pancreas is spared because it does not accumulate the toxic fragment. Third, the HUMAN_MODEL_MISMATCH rationale claimed the human endocrine evidence was only silencing in culture; rewritten to state that beta-cell death is demonstrated in patient-genotype iPSC-derived cells by an identified route, while noting that the tissue-level beta-cell mass claim genuinely does remain unmeasured. Fourth, identification of tRNA-Gln and tRNA-iMeth as TRMT10A targets was misattributed to the 2024 mouse paper; the 2018 paper is now credited and the mouse paper recast as confirming depletion in vivo. IMPORTANT 3: split the bundled Pancreatic Beta-Cell Apoptosis and Reduced Beta-Cell Mass node into a CELLULAR apoptosis node and a TISSUE mass node, and retargeted both the FAILS_TO_RECAPITULATE model link and the mismatch discussion onto the mass node, which is the unmeasured claim they are actually about; supports upgraded from PARTIAL to SUPPORT on the apoptosis evidence, with PARTIAL retained only on the mass proposal. IMPORTANT 1: cited PMID:34541035, which reports hypoglycaemia in early childhood followed by diabetes in late childhood in one patient - this reframes the bidirectionality knowledge gap from unexplained to plausibly sequential and age-dependent, and the gap rationale was rewritten accordingly; and cited PMID:39440920 as the actual source of the spastic-ataxic paraparesis and Dandy-Walker detail, which had been attributed to PMID:42181738. IMPORTANT 2: corrected two evidence_source tags from HUMAN_CLINICAL to IN_VITRO on the expression and in-situ-hybridization items. Suggestions taken: PMID:25053765 added to the references block and cited for the Seizure phenotype; the tRNA modopathy differential now names the knowledge base's existing PUS7-Related_Neurodevelopmental_Disorder entry. One snippet was repaired before commit after an initial transcription cut off at variant nomenclature. A GO label taken as tRNA catabolic process was corrected to the canonical tRNA decay after validate-terms rejected it. Snippets rose from 31/31 to 37/37. Validated: just validate passed; just validate-terms passed; count-verified-snippets 37/37; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

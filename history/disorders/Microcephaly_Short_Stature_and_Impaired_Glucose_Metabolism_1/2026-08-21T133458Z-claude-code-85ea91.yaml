  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9162. Four IMPORTANT items and four of the six SUGGESTIONS were addressed; the two not taken are explained below and in a PR comment.

    IMPORTANT 1 - phenotypes naming an unbound feature. Three entries asserted a feature in their name or description that carried no bound term. All are now split into their own bound entries using snippets that were already cached and verified: Scoliosis [HP:0002650] and Joint hypermobility [HP:0001382] out of the former "Scoliosis and Osteoporosis" entry, both from the same already-verified PMID:24204302 sentence. The former "Dysmorphic Features" entry was likewise split - it is now "Low Anterior Hairline" plus four new bound entries: Deeply set eye [HP:0000490], Hypotelorism [HP:0000601], Wide nose [HP:0000445], Short neck [HP:0000470]. Phenotype count 18 to 25.

    IMPORTANT 1c - Dandy-Walker, bound differently from the reviewer suggestion, deliberately. The reviewer proposed HP:0001305 Dandy-Walker malformation. HPO defines that term as incomplete vermis formation PLUS dilation of the fourth ventricle PLUS enlargement of the posterior fossa - and it is precisely the absence of posterior-fossa enlargement that distinguishes a Dandy-Walker VARIANT from the malformation. The cited abstract says only "Dandy-Walker variant" with no further radiological detail, so binding to HP:0001305 would assert a finding the source does not report. The new entry binds HP:0001320 Cerebellar vermis hypoplasia, which is definitional for the variant and safely asserted, with preferred_term "Dandy-Walker variant" preserving the clinical designation - the preferred_term-more-specific-than-term.label pattern the reviewer pointed at, applied to the component that is actually supportable. Evidence is marked PARTIAL because the binding is inferred from the definition of the designation rather than from reported measurements. The reasoning is recorded on the phenotype entry itself, not only here. The former entry was renamed "Spastic-Ataxic Paraparesis" since the posterior-fossa finding now has its own entry.

    IMPORTANT 2 - Wolcott-Rallison syndrome added to differential_diagnoses [MONDO:0009192], with the two already-cached PMID:26159176 snippets that the sibling MSSGM2 entry uses: the phenotype-overlap sentence and the C-peptide discriminator sentence, which also places MSSGM1, MSSGM2 and WRS on a shared eIF2-alpha axis. Differentials 3 to 5 [IER3IP1/MEDS1 was added in the initial curation].

    SUGGESTION - node atomicity. "Progressive Beta-Cell Loss and Biphasic Glucose Dysregulation" did bundle a CELLULAR claim with an ORGANISM one. Split into "Progressive Beta-Cell Mass Loss" [CELLULAR, cell_types type B pancreatic cell] and "Biphasic Glucose Dysregulation" [ORGANISM], joined by a PARTIAL DIRECT edge carrying the PMID:25053765 "perhaps as a consequence of accelerated beta cell apoptosis" sentence. All references repointed: the upstream apoptosis edge now targets the mass-loss node, the insulin-replacement treatment target_mechanisms and the metabolic-penetrance KNOWLEDGE_GAP now target the glucose node, and the HUMAN_MODEL_MISMATCH now targets the mass-loss node. Pathophysiology 10 to 11 nodes.

    SUGGESTION - gnomAD constraint. Verified independently against the gnomAD API rather than copied from the deep-research report: pLI 3.2e-12, observed/expected LoF 0.917 with 90% upper bound [LOEUF] 1.21. Recorded in the genetic notes with the interpretation that matters - haploinsufficiency is not a mechanism here, so the unaffected heterozygous parents in every pedigree are the expected result rather than a puzzle. No evidence block, because a database query is not a literature claim with a quotable sentence.

    SUGGESTION - history links. The initial history record now carries prs: 9162.

    NOT TAKEN, with reasons. Hypoglycaemia-phase treatment: no cached abstract contains a quotable management sentence for the hypoglycaemic phase [checked PMID:25053765, 34541035, 26297882, 24204302 for diazoxide, feeding regimens, glucose infusion and equivalents; nothing]. The reviewer's own framing was "if not, this is correctly omitted". Manufacturing a management claim is exactly the failure mode the evidence SOP warns about. ClinVar variant-class summary: the count quoted by openscientist [approximately 196 variants, approximately 50 P/LP] could not be verified from this environment, and an unverified aggregate is not worth adding next to 8 individually evidenced variant records.

    The three DOI_*.md cache files the reviewer noted are retained deliberately: they are genuine deep-research reference-validation fetches and are part of the provenance of the two research artifacts, even though no DOI: reference is cited in evidence.

    VALIDATION after these changes. just validate passes [schema, terms, references]. count-verified-snippets 149/149 verified, up from 136/136 - every new snippet is an exact substring of an already-cached reference, and no new PMIDs were needed for any of this round. Foreign-key re-check passes across all 11 pathophysiology nodes: downstream edges, treatment target_mechanisms, discussion attaches_to, and model modeled_mechanisms/readout targets all resolve. No FrequencyEnum value is asserted anywhere, unchanged.

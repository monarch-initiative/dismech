  summary: 'Create: Microcephaly, Short Stature, and Impaired Glucose Metabolism 1
    (TRMT10A)'
  details: |
    New entry for MSSGM1 / TRMT10A syndrome (MONDO:0000208, OMIM 616033), autosomal recessive biallelic TRMT10A (hgnc:28403). A tRNA modopathy: the lesion is loss of the m1G9 tRNA methylation rather than any defect in a protein-coding product downstream. Nine pathophysiology nodes running from biallelic loss through catalytic loss, selective tRNA depletion and codon-specific ribosome slowdown, then branching into an endocrine (beta-cell) and a neurodevelopmental arm. Reference set assembled by direct PubMed search; no deep-research provider run was used for this entry, so no research/ artifact accompanies it. GeneReviews baseline checked and found ABSENT by search on both the gene and the OMIM disease name (zero results each). Curated the metabolic phenotype as bidirectional and non-obligate rather than as diabetes: the founding family had young-onset diabetes, a second kindred had predominantly hyperinsulinaemic hypoglycaemia, and a 2026 report describes the full neurodevelopmental syndrome with no metabolic abnormality at fifteen; this is recorded as a KNOWLEDGE_GAP because screening for diabetes alone would miss the hypoglycaemic presentation. Trmt10a-null mouse curated with two links: RECAPITULATES on the codon-translation node with a ribosome-occupancy readout, and FAILS_TO_RECAPITULATE on the beta-cell node, since the mice show no discernible pancreatic defect despite the human syndrome being named for its glucose phenotype - carried into a HUMAN_MODEL_MISMATCH discussion noting that the cell-culture and whole-animal evidence point in opposite directions and neither is a human in vivo measurement. The beta-cell mass claim is curated as PARTIAL because its source states it as a proposal from silencing experiments, not a measurement in patients. MONDO identity left deliberately open: MONDO:0018320 (Orphanet:391408) appears to describe the same disease but carries no causal gene or OMIM xref and is in no subsumption relation to MONDO:0000208; verifying equivalence needs the Orphadata bulk XML, which is not present in this checkout, so no mondo_mappings entry was asserted and the stub keyed on MONDO:0018320 was left in place rather than retired on an assumption. This differs from the plan stated in the claim issue, and the reason is recorded in the entry notes. No frequency bands assigned. Validated: just validate passed; just validate-terms passed; count-verified-snippets 31/31; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK.

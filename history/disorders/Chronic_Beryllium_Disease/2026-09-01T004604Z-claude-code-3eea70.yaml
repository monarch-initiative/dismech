  summary: Add dermal exposure route, BeLPT diagnosis, sarcoidosis differential, and
    biological_scale tags
  details: |
    The mechanism chain was already strong (nine nodes, five conforming to granuloma_formation), so this focuses on the exposure and diagnostic layers rather than re-deriving the granuloma.

    Added a second environmental entry for dermal beryllium exposure, linked by influences_mechanisms (TRIGGERS, INDIRECT_KNOWN_INTERMEDIATES) to the CD4+ T cell sensitization node rather than to the particle-deposition trigger, because the skin route bypasses the alveolar-macrophage arm and enters the mechanism further down. PMID:16231190 supports this as an alternate immune-response pathway, and supplies the epidemiological motivation: falling airborne beryllium has not produced a matching fall in sensitization or disease. ECTO has no route-specific dermal term, so the entry reuses the substance-level ECTO:9000941 and carries the route in its name, description and a notes line, rather than inventing a CURIE.

    Added a diagnosis block for the BeLPT with quantified performance from a 431-patient series (PMID:40609857, 2025): single-test sensitivity 61.5 percent and specificity 90.8 percent, improving to 76.0/80.4 percent on split-sample testing. The numbers matter clinically because they are why a single negative BeLPT does not exclude CBD in a plausibly exposed worker.

    Added a differential_diagnoses block for sarcoidosis, the entry's defining differential and the reason CBD is under-recognised. The MONDO id was taken from this repository's own Sarcoidosis entry rather than recalled, so the cross-reference is real. Distinguishing features are BeLPT-demonstrable sensitization, exposure history, and the physiological difference, the last with its effect size (restrictive pattern 41.0 vs 14.8 percent, OR 3.99) rather than asserted qualitatively.

    Tagged biological_scale on all nine pathophysiology nodes: TISSUE for particle deposition, granuloma assembly and fibrosis; MOLECULAR for neoantigen formation and HLA-DP-restricted presentation; CELLULAR for the T cell and macrophage steps.

    No existing mechanism content, evidence item or conformance declaration was altered. Validated with just validate-disorders (the batched sweep CI runs), just count-verified-snippets (36/36), just validate-terms, and a graph build showing 11 edges, no integrity issues and no node without an incoming edge.

  summary: 'Review round 1: split the ROMK/BK branch into its own node'
  details: |
    Addresses review round 1 on PR #16033 in one push. IMPORTANT finding: the edge from WNK1 and WNK4 Kinase Accumulation into Reduced Sodium Delivery to ENaC-Expressing Segments was supported only by ROMK and BK channel-suppression evidence, which does not support reduced sodium delivery; the node also held two claims where its name held one. Split out a new atomic node, WNK4-Mediated Suppression of ROMK and BK Channels (CELLULAR; CL:1001431 and CL:1001432; WNK4, KCNJ1 and KCNMA1; GO:0005267 DECREASED), downstream of WNK accumulation and upstream of Impaired Distal Potassium Secretion, and moved the four channel evidence items onto it. Reduced Sodium Delivery now carries only the driving-force claim, with the PMID:39699086 sodium-delivery quote as its node evidence. Graph re-inspected: both branches reach Impaired Distal Potassium Secretion and orphan_targets is empty. Suggestions taken: the GeneReviews 50 percent recurrence-risk and prenatal-testing sentences quoted on the autosomal dominant inheritance block; the ammonium node rebound from GO:0006885 regulation of pH DECREASED to GO:0097272 ammonium homeostasis with biological_scale TISSUE; hypertension frequency lowered from VERY_FREQUENT to FREQUENT to match the KLHL3-specific numbers, with the departure from Orphanet's grading stated in the description; a phenotype row added for the aldosterone profile bound to the umbrella HP:0040085 rather than a directional term, because GeneReviews, Orphanet and the case reports disagree on the absolute direction, with the disagreement carried in the description. A follow-up issue for a Pseudohypoaldosteronism Type 2 grouping was filed after searching for an existing one. Phenotype connectivity is now 5 of 14 (36 percent), one lower in proportion because the new aldosterone row is also unwired; the reason is recorded in notes. Every CURIE added was resolved in the step it was written (GO:0097272, GO:0005267, CL:1001432, HP:0040085 via OLS; KCNJ1 and KCNMA1 via the HGNC REST records) and both new GeneReviews snippets were confirmed present in references_cache before use. Validation: validate, validate-terms, count-verified-snippets (149/149), validate-disorders (149 snippets, 150 titles, 0 issues), check-causal-targets, check-entity-refs, check-logical-rules, list-gene-term-mismatches (12/12 clean) and the full offline gate battery, all passing.

  summary: 'Create: Pseudohypoaldosteronism Type 2D (KLHL3)'
  details: |
    New Disease entry for the KLHL3 form of familial hyperkalemic hypertension, curated from literature plus one openscientist deep-research report. entry_type decided DISEASE; the stub is deleted. Mechanism curated as an eleven-node causal chain from adaptor loss through failed CUL3-KLHL3 ubiquitination of WNK1/WNK4, SPAK and OSR1 hyperactivation and NCC hyperphosphorylation to the three clinical branches. Both inheritance modes encoded with HPO bindings and separate evidence, the dominant one as a dominant-negative dimer node supported by the knockout mouse asymmetry. Two animal models with modeled_mechanisms, including a FAILS_TO_RECAPITULATE link with a typed PROXY_QUANTITY divergence on the heterozygous null. Four discussions: three KNOWLEDGE_GAP (acidosis mechanism, hypercalciuria mechanism, recessive missense versus null) and one OPEN_QUESTION on upstream cascade inhibitors. The deep-research report gave KLHL3 as HGNC:15531 (EBNA1BP2) and mislabelled two HPO terms; all CURIEs were resolved independently and the rejections recorded in notes. Validation: just validate, validate-terms, count-verified-snippets (142/142), validate-disorders (142 snippets, 143 titles, 0 issues), check-genereviews --online (chapter PMID:22073419 tagged), and the offline gate battery, all passing.

  summary: 'Create: Jaberi-Elahi Syndrome'
  details: |
    New entry for Jaberi-Elahi syndrome (MONDO:0060711), the GTPBP2 disorder. It records autosomal recessive inheritance, a published-case count, eight pathophysiology nodes, 21 phenotypes, the GTPBP2 gene record with the ClinGen Definitive (AR) tier copied from its CGGV record, three animal models (the C57BL/6J Gtpbp2 nmf205 mouse, a Labrador retriever with GTPBP2-associated retinal atrophy, and the Drosophila CG2017 hypomorph), two diagnostic methods, three differentials, two treatments, and a HUMAN_MODEL_MISMATCH discussion on the ribosome-pausing mechanism.

    Deep research: the falcon run failed with HTTP 403 and the recipe fell back to OpenScientist (research/Jaberi-Elahi_Syndrome-deep-research-openscientist.md). Reference validation of the report: 14 of 14 references resolved, none unresolved, 11 on topic and none off topic. Term validation of the report could not run because the ontology service timed out. preflight-dr returned WARN only because the report also discusses the paralog GTPBP1, whose disease is the sibling entry. Every reference cited in the entry was fetched and checked on its own; the report was used for leads.

    Curation decisions: the eponym is kept as the name because no gene-led name is established; the GTPBP1/2-related ectodermal neurodevelopmental (GREND) label covers both paralogs. Frequencies come from the 2024 review of 28 individuals (PMID:38852771). Counts from the pooled GTPBP1 and GTPBP2 cohort (PMID:38118446) are not used as GTPBP2 frequencies, and its descriptions are used only where the authors state them for both genes. The loss-of-function node is bound to GTP binding rather than to the elongation activity of GTPBP1, because GTPBP2 lacks that activity in vitro (PMID:30108131). The ribosome-pausing node carries the mouse evidence and a REFUTE item from ribosome profiling of patient fibroblasts. Separate developmental and ectodermal nodes, linked through unknown intermediates, connect the congenital and ectodermal features that the mouse model does not explain. Scoliosis and the high anterior hairline are left unconnected. Evidence grades for references shared with the GTPBP1 sibling entry match that entry.

  summary: 'Review: connect five orphan phenotypes (IUIS Table 7)'
  details: |
    Five of 22 phenotypes had no incoming edge. Papilledema, uveitis and retinal dystrophy attach to the CNS inflammation node, hepatosplenomegaly to the systemic neutrophilic node, and short stature to the epiphyseal overgrowth node.

    That last one is worth stating plainly because it looks contradictory: growth failure despite epiphyseal overgrowth. The disorganised overgrowth does not produce normal longitudinal growth, and chronic inflammation suppresses it further. The edge says so rather than leaving a reader to assume an error.

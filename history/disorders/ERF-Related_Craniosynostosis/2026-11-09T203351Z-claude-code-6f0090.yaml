  summary: 'Create: ERF-Related Craniosynostosis'
  details: |
    De-novo curation of ERF-related craniosynostosis (craniosynostosis 4, CRS4; MONDO:0010929; hgnc:3444 ERF; autosomal dominant). Named ERF-Related Craniosynostosis (a MONDO EXACT synonym and the established literature name); numbered label kept in synonyms. 10 pathophysiology nodes modelling the ERF haploinsufficiency -> derepression of osteogenic ETS/RUNX2 targets -> Cyp26b1/retinoic-acid branch and osteogenic-acceleration -> premature multisuture fusion -> raised ICP / Chiari / Crouzonoid facies / neurodevelopmental chain, with three nodes conforming to cranial_suture_premature_fusion (Loss of Suture Patency Restraint, Cranial Suture Osteogenic Acceleration, Premature Cranial Suture Fusion and Craniosynostosis). 21 HPO-bound phenotypes, genetic section (LoF/haploinsufficiency, two variants), diagnosis, treatments (surgery, VP shunt, surveillance, SLT, counselling, preclinical MEK/XPO1 inhibitors), 2 mechanistic_hypotheses, 5 discussions (OPEN_QUESTION/KNOWLEDGE_GAP/HUMAN_MODEL_MISMATCH), 2 animal models (ErfloxP/- PARTIALLY_RECAPITULATES, Erf+/- FAILS_TO_RECAPITULATE). 69/69 snippets verified. No GeneReviews chapter exists; ClinGen Definitive noted but no CGGV cached so gene_disease_validity omitted.

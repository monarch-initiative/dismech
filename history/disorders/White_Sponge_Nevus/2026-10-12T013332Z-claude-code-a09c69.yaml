  summary: 'Review round 1: diagnosis section and dysplasia split'
  details: |
    Added a diagnosis section with six rows: clinical oral examination (NCIT:C163004), incisional biopsy with histopathology (NCIT:C15386), exfoliative liquid-based cytology (NCIT:C99177), KRT4 and KRT13 sequencing (NCIT:C15709), HPV in situ hybridization with keratin immunohistochemistry (NCIT:C17562), and a differential diagnosis row without a term. The sequencing row states that rare KRT4/KRT13 variants are often inherited from unaffected parents, so a rare variant alone does not prove causation. The differential covers HPV-13 Heck disease, hereditary benign intraepithelial dyskeratosis, Darier disease, candidiasis, thermal and frictional injury, leukoplakia and oral lichen planus. Evidence comes from the already cached PMID:36829648, PMID:31473371 and PMID:28878914. All NCIT terms were looked up with runoak ols:ncit, and validate-terms confirmed membership in the dynamic enum. The single KRT4 dysplasia case (PMID:38773401) now has its own phenotype, Oral Epithelial Dysplasia, scoped to WSN1. It is left unbound because OLS and runoak searches of HP for oral or epithelial dysplasia returned no term; the queries are recorded in the phenotype notes. On that phenotype the patient's 40-year smoking history is graded REFUTE, because it argues against attributing the dysplasia to WSN. A proposed edge from suprabasal overproliferation leads to the new phenotype. The squamous cell carcinoma phenotype keeps only the KRT13 family evidence. Its binding stays HP:0020357, because OLS returned no oral-cavity squamous cell carcinoma term in HP; the queries are in the entry notes. The anogenital phenotype is renamed Vaginal and Cervical Mucosal Plaques to match its HP:0000142 binding. Validation: validate, validate-terms, count-verified-snippets (66/66), the offline gates, check-gene-activity-grounding, compliance-connectivity and validate-disorders.

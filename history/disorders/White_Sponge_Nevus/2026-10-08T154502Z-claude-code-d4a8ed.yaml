  summary: 'Create: White_Sponge_Nevus'
  details: |
    Created White Sponge Nevus (hereditary mucosal leukokeratosis, MONDO:0015748) as one entry with two gene subtypes: WSN1 (KRT4, MONDO:0008676) and WSN2 (KRT13, MONDO:0014346). The claim issue was for WSN2 only. The two forms share phenotype, histology and mechanism (K4 and K13 are an obligate keratin pair), so both forms are curated here as subtypes, and both stubs (White_Sponge_Nevus_1 and White_Sponge_Nevus_2) were deleted.

    Sources. The entry was first curated directly from PubMed abstracts and PMC full text fetched with just fetch-reference: the 1995 founding KRT4 and KRT13 reports (PMID:7493030, PMID:7493031), later KRT4/KRT13 family reports (PMID:12828738, PMID:11379896, PMID:25606422, PMID:29476668, PMID:28878914), the Krt13 and Krt4 knockout mice (PMID:32758484, PMID:9727004), a cytology case series (PMID:36829648), a malignant-transformation case (PMID:38773401) and an antibiotic case series (PMID:9692306). A falcon deep-research report (research/White_Sponge_Nevus-deep-research-falcon.md) was then run and used as leads. Its 12 extracted references all resolved. Its single term-validation flag (MONDO:0015748 labelled "if available") is template text, not a wrong binding. Content added from it: the KRT13 intron 5 splice allele (PMID:28878914 full text), the KRT4 c.438_440delCAA family and the temporary response to topical retinoic acid (PMID:36553451), broken desmosomes in Krt13-null epithelium (PMID:32758484), the smoking history confounding the KRT4 dysplasia case (PMID:38773401), reassurance and observation as the main management (PMID:27601826, PMID:31568560), the HPV-13 Heck disease mimic (PMID:31473371, in notes), and the GEO dataset GSE145215. Three DOI-only sources the report cited have no PubMed record and were not cited: a 2025 narrative review, a 2024 Portuguese case report, and a 2004 case of a WSN-like lesion treated with azithromycin that was not genetically confirmed.

    just preflight-dr could not run because the local MONDO build is absent and was not downloaded, since disk space is limited. A manual check instead: the report body names KRT4 19 times and KRT13 27 times, and no other disease gene recurs, so it is about this disease.

    Structure. The pathophysiology is a five-node chain from dominant-negative keratin variant to filament aggregation, loss of mechanical resilience, suprabasal overproliferation and the thickened vacuolated plaque. The first three nodes conform to keratin_intermediate_filament_fragility, and the variant node binds GO:0005200 structural constituent of cytoskeleton. The edge to oral squamous cell carcinoma is marked as proposed, because malignant potential rests on two case reports. Cervical dysplasia is deliberately left without an incoming edge: no source proposes a mechanism for it. just check-genereviews (offline and --online) found no GeneReviews chapter. No ClinGen CGGV record for KRT4 or KRT13 is cached, so gene_disease_validity is absent.

    Validation: just validate, validate-terms, count-verified-snippets (52/52), verify-datasets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes, check-gene-activity-grounding, compliance-connectivity, the snippet gates and validate-disorders.

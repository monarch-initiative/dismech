  summary: Map White sponge nevus to OMIMPS:193900
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS193900 contains KRT4-related white sponge nevus 1 (OMIM:193900) and KRT13-related white sponge nevus 2 (OMIM:615785), the two subtypes curated here and the two children of MONDO:0015748. The two mucosal keratins form a filament pair, and their disruption converges on the characteristic hereditary mucosal leukokeratosis phenotype. A single syndrome-level Disease preserves the gene-defined subtypes without making the series synonymous with KRT4 disease alone. The mapping does not include acquired oral leukoplakia, all white oral lesions, or other keratin disorders.

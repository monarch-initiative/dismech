  summary: 'Review round 1: mine the cached GeneReviews chapter into SCA6'
  details: |
    Addresses all five blocking findings and all six IMPORTANT findings from the automated review of PR #11444, in one push.

    The central finding was correct and is the one worth recording: references_cache/PMID_20301319.md, the GeneReviews chapter for SCA6, was ALREADY in the repository and the entry cited it nowhere. I hand-assembled the mechanism literature because the deep-research report cited only two PMIDs in its body and missed the alpha1ACT primary source -- that part was right -- but the same report quoted GeneReviews eight times for the clinical content, and that half did not make it across. No fetch was needed; the abstract was on disk.

    Blocking findings, all fixed: a top-level references block tagging PMID:20301319 with tags [GeneReviews]; a diagnosis section quoting the confirmatory-test sentence; a treatments section (acetazolamide, 4-aminopyridine, physical therapy and mobility support, speech therapy, surveillance and agents-to-avoid) with NCIT treatment_term and CHEBI therapeutic_agent bindings; nine new GeneReviews phenotypes with their frequency figures (upper-limb incoordination, intention tremor, dysphagia, hyperreflexia, extensor plantar response, dystonia, blepharospasm, diplopia, plus the reworked dysarthria); and the 50% transmission risk and prenatal/PGT availability in the inheritance block.

    The repeat-range divergence the reviewer flagged is recorded rather than resolved: GeneReviews says 20-33, PMID:29427102 says 19-33, both are now quoted, and the diagnosis notes say alleles at 19 are the disputed boundary.

    IMPORTANT findings. The onset range in description was a single-kindred figure (24-63) presented as the disease's range; it now gives the literature-wide 19-73, mean 43-52, and keeps the kindred figure where it belongs -- as the within-kindred anomaly. The onset_age_variance_unexplained discussion overstated its premise: Durr et al. (PMID:9436730) found onset age correlates inversely with repeat length, so the prompt was recalibrated from 'repeat length does not' to the defensible claim about residual variance, and that paper is now cited for both what repeat length predicts and what it does not. Dysarthria was a disconnected node: it now carries reports_on into Cerebellar Cortical Atrophy and quotes the whole GeneReviews sentence rather than the mid-sentence fragment it had. The alpha1ACT node now declares conforms_to polyglutamine_expansion_proteotoxicity#Transcriptional Dysregulation. An animal_models entry was added for the alpha1ACT transgenic mouse already cited in the pathograph, with a modeled_mechanisms link graded PARTIALLY_RECAPITULATES / MODERATE and limitations noting it cannot speak to IRES regulation or model the aggregation arm. Prevalence gained the German cohort figure and its misdiagnosis caveat; the notes prose that claimed the 12% figure was 'the only quantitative frequency statement available' was revised, since it described repository state and the reviewer was right that it would rot. Orphanet's sub-1/100,000 estimate is NOT asserted: ORPHA:98757 does not fetch, so no citable record exists here, and the notes now say so instead.

    Suggestions taken: a classifications block (NEUROLOGIC, matching sibling Spinocerebellar_Ataxia_Type_31) and age-dependent penetrance context via the Durr evidence. The redundant clinical_course: PROGRESSIVE on HP:0002073 was left alone, as the reviewer judged it harmless.

    One defect of my own, caught by a gate rather than by review: I initially gave PMID:9436730 the reference_title of PMID:9371902 ('Frequency of the mutation and genotype-phenotype correlations'), a sibling paper. check_reference_titles flagged all six occurrences at similarity 0.65; the real title is 'Spinocerebellar ataxia type 6: genotype and phenotype in German kindreds.' This is exactly the failure mode issue #9713 describes, and it is the same class of defect this PR's description criticises the deep-research report for.

    Validation: linkml-validate clean; linkml-term-validator --labels clean; reference_snippet_audit 54/54 (up from 25/25); check_duplicate_yaml_keys, check_entity_refs, check_causal_targets, check_enum_values, check_qualifier_terms, check_folded_hyphens, check_snippet_grading and check_reference_titles all clean. check_snippet_length and check_title_snippets report three findings, all in ZNF407-Related_Neurodevelopmental_Disorder.yaml, which merged to main after this branch point -- baseline staleness, not introduced here.

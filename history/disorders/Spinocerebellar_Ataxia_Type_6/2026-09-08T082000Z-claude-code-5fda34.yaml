  summary: 'Create: Spinocerebellar Ataxia Type 6 (MONDO:0008457, CACNA1A)'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report (research/Spinocerebellar_Ataxia_Type_6-deep-research-perplexity.md). 25 evidence snippets, all verified by dismech.reference_snippet_audit against references_cache/.

    Lump/split decision: standalone DISEASE entry, following the KB's established pattern for numbered SCAs. Spinocerebellar_Ataxia_Type_1, _23 and _31 are all standalone entries even though the Harding-class entries list them as has_subtypes; SCA6 is treated the same way and remains a has_subtypes entry on Autosomal_Dominant_Cerebellar_Ataxia_Type_III. The boundary with CACNA1A_Related_Disorder, Episodic_Ataxia (EA2) and Familial_Hemiplegic_Migraine (FHM1) is recorded in notes: those are channel loss-of-function and missense disorders, SCA6 is a repeat expansion acting on the alpha1ACT transcription factor.

    The report's own validation sections were read first, as the skill requires, and both flagged items mattered. It reported quotes_unsupported: 2 for PMID:10985694 and PMID:29427102. The first was a genuinely invented quote -- text that appears nowhere in the abstract. The second differed from the source by one word: the report wrote 'internal ribosomal entry site (IRES) within the mRNA' where the paper says 'with the mRNA'. The report had silently corrected a typo in the source. Both were re-derived from the cached abstract rather than copied, so the entry's versions verify. Term validation flagged HP:0000007 being used with the reported label 'No intellectual disability'; HP:0000007 is Autosomal recessive inheritance, which would have been doubly wrong in a dominant disease. It was not used.

    The report cited only two PMIDs in its body. The primary literature for this entry was assembled by hand: PMID:8988170 (Zhuchenko, original expansion), PMID:23827678 (Du, Cell 2013, the bicistronic alpha1ACT mechanism), PMID:10369863 (cytoplasmic non-ubiquitinated aggregates), PMID:10985694, PMID:9403487, PMID:9371902.

    Mechanistic stance: the two candidate proximal mechanisms -- loss of alpha1ACT transcription-factor function, and cytoplasmic aggregation -- are documented in different systems and have never been tested against each other, so the edge between them is INDIRECT_UNKNOWN_INTERMEDIATES and a discussion records the open question rather than picking one. Conformance to polyglutamine_expansion_proteotoxicity is declared but qualified in prose: SCA6's inclusions are cytoplasmic and non-ubiquitinated, unlike the rest of the family, and that contrast is carried as its own evidence item.

    Validation run in the worktree: linkml-validate (Disease) clean; linkml-term-validator validate-data --labels clean; reference_snippet_audit 25/25; check_duplicate_yaml_keys, check_entity_refs, check_causal_targets, check_enum_values all clean.

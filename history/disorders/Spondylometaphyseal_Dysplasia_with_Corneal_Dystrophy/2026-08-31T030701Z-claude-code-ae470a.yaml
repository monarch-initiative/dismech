  summary: Add brachydactyly and neonatal hypotonia phenotypes
  details: |
    Added two phenotypes (Brachydactyly HP:0001156, Neonatal Hypotonia HP:0001319) documented in PMID:29122926 for both affected cousins but not previously curated, per issue #9859's first item. Wired both as downstream targets of the existing Spondylometaphyseal Skeletal Dysplasia pathophysiology node: Brachydactyly graded DIRECT, Neonatal Hypotonia graded UNKNOWN since both children were also born preterm, a confounder for neonatal floppiness. The other two aspects of the same issue item -- facial dysmorphism and the narrow-chest respiratory-failure description -- were already resolved by an unrelated merged PR (#9618) before this session started; the issue's other three items were independently verified to already be resolved (conjunctive-node split) or out of scope for a single bounded fix (animal_models and target_mechanisms gaps spanning ten files).

  summary: 'Create: Spondylometaphyseal dysplasia with corneal dystrophy'
  details: |
    ISDS Nosology group 12, row NOS 12-0050. Pathograph runs from the destabilising PLCB3 Ha2-element variant through PIP2 accumulation to F-actin disorganisation, and then to the clinical syndrome by an edge marked indirect with unknown intermediates, since the functional work was done in dermal fibroblasts and not in chondrocytes or keratocytes. The whole entry derives from a single 2018 family and PLCB3 was chosen from four candidate variants on pathway reasoning; that evidence base is recorded explicitly in prevalence notes, genetic notes and an open knowledge gap rather than smoothed over. 23 evidence snippets verified; schema, term, duplicate-key and entity-reference checks pass.

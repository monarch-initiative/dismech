  summary: Wire phenotypes into pathograph; no 2024-2026 literature found
  details: |
    Final QA pass over the six ISDS group-12 entries, on three axes.

    Pathograph connectivity. The QC metric reported 1/58 phenotype nodes causally connected across the six entries. Two causes. First, the chains terminated in ORGANISM-scale pathophysiology nodes that restated phenotype names instead of pointing at the phenotypes[] records, and in one case (SPENCD short stature) the restatement collided with the phenotype name and merged into a single graph node. Second, the downstream edges were written with the entity-reference form "phenotypes#<Name>"; src/dismech/graph.py resolves downstream.target by bare name, so those edges pointed at nothing. Note this is a repo-wide issue, not specific to these entries: THOC6, Gray_Platelet_Syndrome, Alzheimer_Disease, Systemic_Lupus_Erythematosus and Heritable_Pulmonary_Arterial_Hypertension all carry phenotypes#-prefixed downstream targets and all score 0% connectivity. Fixed here by using bare names, dropping the restatement nodes, and adding explicit mechanism-to-phenotype edges. All six now report 100% phenotype connectivity.

    Gene-to-mechanism wiring. Three of six causal genes were unwired because the genetic[] item name was byte-identical to the first pathophysiology node name, so the inferred edge was a self-loop and discarded. Renamed the pathophysiology nodes (TRIP11, PCYT1A, HHAT entries); 6/6 genes now wired.

    Literature refresh 2024-2026 and phenotype completeness. A PubMed sweep per disorder surfaced material that changed content rather than merely adding citations: HHAT is no longer a single-family disorder (twelve patients on record; the entry previously claimed one family and carried a replication knowledge gap that is now answered), FN1-related SMDCF is not exclusively de novo (a multigenerational family with four affected members) and has an adult natural history plus a 2024 patient-derived iPSC mechanism paper that partly resolves the dominant-negative-versus-haploinsufficiency gap, and a 2024 retina-specific Pcyt1a knockout refutes the bulk-phosphatidylcholine explanation of the PCYT1A retinal branch in favour of fatty-acid dysregulation and ferroptosis in Mueller glia. New phenotypes added across the entries: sensorineural hearing loss and coeliac disease (SPENCD), os odontoideum with cervical instability, adult osteoporosis and chronic limb pain (FN1), microphthalmia and ptosis (HHAT). PLCB3 returned no 2024-2026 literature, which corroborates its single-family status.

    Validated with just validate-disorders (6/6, 286 snippets), the offline gates, the connectivity metric, and tests/test_data.py.

  summary: 'Create: WHIM Syndrome 1'
  details: |
    De novo curation of WHIM syndrome 1 (MONDO:8000006), CXCR4 gain-of-function autosomal dominant combined immunodeficiency. Built a causal pathograph: heterozygous CXCR4 C-terminal GOF variant -> impaired desensitization/internalization -> enhanced CXCL12-CXCR4 signaling -> marrow neutrophil retention (myelokathexis) and lymphocyte/monocyte sequestration -> panleukopenia; separate branches for impaired B/T lymphopoiesis -> defective memory/isotype switching -> hypogammaglobulinemia, plasmacytoid dendritic cell/type I IFN defect, and CXCR4-driven HPV keratinocyte transformation. Phenotypes wired into the graph (12/15 causally connected; tetralogy of Fallot, autoimmunity and lymphoma left unconnected as developmental/idiopathic/virus-driven). Treatments: mavorixafor (FDA 2024, phase 3 NCT03995108) and plerixafor (phase 3 NCT02231879) with target_mechanisms INHIBITS on enhanced signaling; G-CSF, IVIG, antibiotic prophylaxis, HSCT (BYPASSES the GOF lesion). Cxcr4 knock-in WHIM mouse animal model with modeled_mechanisms. 22 PMIDs + 2 ClinicalTrials records; all 80 snippets exact-verified (just validate 80/80, validate-terms pass). GeneReviews: no chapter exists (checked offline index + PubMed genereviews[book]). WHIM syndrome 2 (CXCR2) noted as a distinct disease in notes. OpenScientist deep-research report (PASS on preflight-dr; 30/30 refs resolved, 0 confabulations, 0 off-topic) corroborated the entry; its leads verified against primary abstracts before use.

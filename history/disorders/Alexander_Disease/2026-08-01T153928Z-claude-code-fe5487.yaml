  summary: Add public dataset records from GEO
  details: |
    Added 2 dataset records discovered via the GEO DataSets index (scripts/discover_datasets.py, batch 11, Mendelian category). Accession, title, organism, sample count and linked PMID are GEO's own metadata rather than model-generated text, and every accession resolved against NCBI E-utilities before commit. Candidates were manually triaged for disease identity; for rare monogenic entries the rejection rate is high because most candidates match only the causal gene and describe a different disease caused by that gene. No evidence blocks generated, since an evidence item requires an exact abstract quote; records carry publication and provenance notes instead.

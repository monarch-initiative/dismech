  summary: 'Gene-family review: COX14'
  details: |
    COX14 genetic record typed UNKNOWN with variant_origin GERMLINE, and the record's and entry's recessive inheritance blocks bound to HP:0000007. Added the second unrelated family (compound heterozygous p.Tyr28Thrfs*83 / c.3G>A with muscle complex IV deficiency and a Leigh-like course, PMID:42649470) as evidence and to the record note; ClinGen rates COX14 Limited (AR) only for mitochondrial disease (MONDO:0044970), so CAUSATIVE is not used and no tier is recorded. The node's GO:0045182 translation regulator activity is kept: COX14 associates with nascent COX1 in the ribosome nascent-chain complex and its depletion lowers COX1 synthesis (PMID:27693358).

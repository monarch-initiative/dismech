  summary: 'Review: cite the ~70% clefting figure on Cleft Palate Repair (ECM review)'
  details: |
    Claim-evidence correctness review of ECM disorders. Fixed: treatments > Cleft Palate Repair asserted 'Clefting abnormalities are present in approximately 70% of Kniest dysplasia cases' with no evidence block at all. Attached PMID:25592122 ('five of the seven patients exhibited clefting abnormalities', 5/7 = 71%), the molecularly confirmed series already cited under the Cleft Palate phenotype in the same file. No other defects found: this entry was among the strongest of the ten reviewed, with quantified, disease-specific evidence on nearly every phenotype and honest acknowledgement where cohorts were mixed COL2A1 skeletal dysplasia rather than Kniest-specific. Validated with linkml-validate and an offline snippet-vs-cache substring check.

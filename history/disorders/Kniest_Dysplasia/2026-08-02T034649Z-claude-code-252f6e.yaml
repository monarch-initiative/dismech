  summary: Source the previously unsupported iPSC/UPR mechanism claim
  details: |
    Acts on finding 1 (highest priority) of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    The node asserted that 'recent iPSC-derived human cartilage models show that some COL2A1 mutations cause ER procollagen storage without engaging canonical UPR' with no reference in the entry mentioning iPSC-derived cartilage at all. The claim was the sole basis for hedging the entry's central ER-stress mechanism, so it could not stand unsourced.

    Located and attached the two real sources: PMID:25187577 (patient-derived type II collagenopathy iPSC chondrocytes DO show ER stress markers and apoptosis) and PMID:40602718 (an iPSC cartilage model showing ER retention with absent UPR activation). Critically, the latter models COL2A1 p.Arg719Cys, which causes precocious osteoarthritis with mild spondyloepiphyseal dysplasia rather than Kniest, so it is marked PARTIAL and the description now states that the behaviour of Kniest-causing triple-helical deletions has not been tested directly.

    Validated: schema, reference and term validation all pass.

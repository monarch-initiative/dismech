  summary: Bind MONDO:0007551 to the localized EBS subtype row
  details: |
    Curation outcome for MONDO:0007551 (epidermolysis bullosa simplex 1C, localized) is SUBTYPE. kb/disorders/Epidermolysis_Bullosa_Simplex.yaml already carried a has_subtypes row named 'EBS Localized (formerly Weber-Cockayne)'; the identifier was bound nowhere in kb/. Identity check before binding, because the issue warned that revised EBS nomenclature does not map cleanly onto the eponyms: MONDO:0007551 carries 'Weber-Cockayne syndrome' and 'localized epidermolysis bullosa simplex' among its synonyms, its own definition is gene-agnostic ('blisters occurring mainly on the palms and soles, exacerbated by warm weather'), and its xrefs include OMIM:131800, Orphanet:79400, SCTID:294705005 and UMLS:C0080333. It is therefore the general localized-EBS concept and not a differently-delimited one. The numbered series does, however, split by gene: MedGen elink and the Monarch association API independently return KRT14 (hgnc:6416) for MONDO:0007551 and KRT5 (hgnc:6442) for the sibling MONDO:0030527 (epidermolysis bullosa simplex 2C, localized, OMIM:619594). The dismech row is the single clinical localized subtype covering both keratin routes, so the row binds MONDO:0007551 as subtype_term and records MONDO:0030527 under mappings.mondo_mappings with mapping_predicate skos:closeMatch - deliberately not exactMatch or narrowMatch, which would retire an uncurated concept from the curation queue. Enrichment: added genes KRT14 and KRT5, autosomal dominant inheritance, a display_name using current EBS-loc nomenclature, and three evidence items - PMID:9804357 (ties localized subtype, Weber-Cockayne eponym, MIM 131800, both keratin genes and dominant inheritance in one sentence), PMID:7688477 (localized/Weber-Cockayne is the mildest EBS type), and PMID:26432462 (EBS-loc among the most frequent variants, blistering confined to hands and feet; graded quote_role BACKGROUND because the sentence is in that cohort paper's introduction restating the established classification). Rewrote the description so the OMIM/MONDO gene split is stated explicitly rather than implied, and downgraded the unsupported 'most common' superlative to 'one of its most frequent variants', which is what the cited sentence says. Deleted stubs/Epidermolysis_Bullosa_Simplex_1C_Localized.yaml, safe because the identifier is now bound. Validation: just validate (59/66 snippets verified, 7 skipped by prefix - all pre-existing DOI references; re-run with --unskip-prefix DOI gives 66/66), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values, check-stubs, validate-disorders, and whole-KB check-title-snippets, check-snippet-length and check-snippet-grading.

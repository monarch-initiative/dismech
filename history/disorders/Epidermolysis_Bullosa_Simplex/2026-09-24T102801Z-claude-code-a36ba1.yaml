  summary: 'Review round 1: de-narrate notes; wire the pathograph to its phenotypes'
  details: |
    Review round 1 on PR #12668, plus phenotype wiring.

    NOTES DE-NARRATED. The reviewer found that this entry's new `notes:` block narrated
    the curation session rather than stating facts about the disease and the ontology,
    which CLAUDE.md rules out ("`notes:` is not a session log"). Phrases such as "was
    re-checked against OLS before this pass", "PKP1 was bound nowhere in this knowledge
    base before this pass" and "the pattern this curation pass exists to remove" were
    removed, and each surviving fact rewritten as a plain statement checkable
    independently of who wrote it or when: the anchor MONDO:0017610 is the EBS group term
    with MONDO:0019276 as its only parent and all sixteen subtype concepts as descendants
    (fourteen direct, two through MONDO:0015550); the GeneReviews seven-gene set plus the
    two suprabasal genes MONDO places under the same term; the 1x/2x keratin-gene split
    and why the 2x terms are closeMatch; MONDO:0030535's lowercase subtype letter; and the
    CD151 disposition to its own entry.

    The process narrative removed from `notes:` is the content of this record and of the
    record for the preceding session: the gap list is dismech#12231 (genetics-gap
    series-024) under epic #12189; sixteen MONDO subtype concepts were put forward as
    candidate rows; fourteen became rows in the preceding session and CD151 was
    dispositioned to its existing entry; PKP1 (hgnc:9023) was bound nowhere in the
    knowledge base before that session.

    A sweep of every prose field in the entry for the same defect found two further
    matches on the phrase "before this", both false positives: they refer to the cited
    publication, not to this pull request.

    PHENOTYPE WIRING. Separately, the entry reached no phenotype at all. On the branch
    point, `Mechanical Stress-Induced Keratinocyte Cytolysis` - where four of the five
    mechanistic routes converge - carried no `downstream` whatsoever, so
    `just list-disconnected-phenotypes` reported 0 of 7 phenotypes causally connected.
    Three edges were added, each supported by evidence already cited on the node it
    leaves: cytolysis to Skin Blistering (PMID:16098032), heat sensitivity to
    Heat-Exacerbated Blistering (PMID:8586658), and the plectin node to Muscular Dystrophy
    (PMID:34572129). On a reviewer suggestion the suprabasal desmosomal node also gained
    edges to Palmoplantar Keratoderma and Nail Dystrophy, supported by the PKP1 case-series
    frequencies in PMID:32248567 (16/18 and 18/18). Connectivity is now 5 of 7; Herpetiform
    Blistering Pattern and Milia remain unexplained and were not wired, because no cited
    source in this entry places either downstream of a specific node.

    Validation after the last edit: just validate, validate-terms, count-verified-snippets,
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, list-gene-term-mismatches, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-reference-titles,
    check-source-defect-claims, compliance-connectivity, validate-history-all, and

  summary: 'Review: Epidermolysis Bullosa Simplex evidence re-read against cached
    sources'
  details: |
    Re-read all 17 distinct cached references and re-verified all 64 evidence items,
    including the ~10 DOI-referenced items the machine verifier skips entirely. 63 of 64
    snippets matched their cache body exactly.

    Fixed in this pass:
    - references[DOI:10.1038/s41572-020-0210-0]: the sole finding used the two-word paper
      title as statement, supporting_text and snippet, against a cache whose content_type is
      "unavailable" and whose body is empty - simultaneously a title-as-finding, a
      non-propositional snippet, and an unverifiable claim. It was also redundant: that DOI
      is PMID:32973163, already cited twice in the entry with a real verified sentence. The
      pseudo-finding was removed and the bibliography stanza kept.

    Recorded for follow-up (the prevalence block is the substantive gap):
    - prevalence[Global].notes asserts EBS is "approximately 70% of all EB cases" and a
      prevalence of "1 in 30,000 to 50,000". Neither figure is in either cited abstract, and
      the second is inconsistent with the cited registry (11.07 per million for all inherited
      EB is about 1 in 90,000). Both evidence explanations also assert EBS's rank, which
      neither quote supports.
    - The fix is already in the entry's own bibliography: DOI:10.1186/s13023-022-02433-3
      (cached full text) states the 70% claim verbatim, and DOI:10.1111/jdv.18637 gives an
      EBS-specific 28.44 per million German estimate.

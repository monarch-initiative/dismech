  summary: Enumerate gene-defined EBS subtypes and wire every gene into the pathograph
  details: |
    Gene-defined subtype enumeration under the EBS parent (genetics-gap series-024, issue #12231).

    Anchor check first: MONDO:0017610 verified against OLS as the EBS group term with
    MONDO:0019276 as its only asserted parent. All sixteen subtype concepts on the issue
    list resolve as descendants - fourteen as direct children, and the two suprabasal
    concepts (PKP1, DSP) through MONDO:0015550 'suprabasal epidermolysis bullosa simplex'.
    No anchor change needed; the #12184 narrowMatch pattern does not apply.

    has_subtypes went from 5 rows (1 with a bound subtype_term) to 14 rows, all 14 with a
    bound subtype_term, a genes list, inheritance with an HPO mode-of-inheritance term, and
    exact-quote evidence. The four pre-existing description-only rows were bound
    (intermediate/Koebner, severe/Dowling-Meara, EBS-MD, recessive KRT14-null); nine rows
    were added (recessive KRT5, Ogna, mottled pigmentation, migratory circinate erythema,
    BP230 deficiency, EXPH5, KLHL24, plakophilin deficiency, lethal acantholytic EB).

    Localized, generalized intermediate and generalized severe EBS each carry two MONDO
    terms split by causal keratin gene. Each is one row binding the 1x term with the 2x
    term recorded as skos:closeMatch, following the convention the pre-existing localized
    row established; closeMatch deliberately does not retire an uncurated concept from the
    stub queue. The recessive pair is two separate rows because the KRT14 and KRT5 routes
    were established by separate reports with different phenotypic ranges.

    Four pathophysiology nodes added so that every gene reaches the pathograph at the
    component it is: BPAG1-e deficiency at the hemidesmosomal inner plaque (DST),
    exophilin-5 deficiency in keratinocyte vesicle trafficking (EXPH5), KLHL24
    gain-of-function driving ubiquitin-mediated keratin 14 degradation, and desmosomal
    plaque deficiency causing suprabasal acantholysis (PKP1, DSP). Nodes carrying bound
    genes went from 2/5 to 6/9.

    genetic: gained PKP1 and DSP. PKP1 (hgnc:9023) was bound nowhere in the knowledge base
    before this pass. Single-valued `subtype` foreign keys were set only where a gene maps
    to exactly one row (DST, EXPH5, KLHL24, PKP1, DSP); KRT5, KRT14 and PLEC each span
    several rows, and each record's notes says so rather than asserting one row.

    CD151 / MONDO:0012190 dispositioned: already curated as its own Disease entry
    (Epidermolysis_Bullosa_Simplex_7_With_Nephropathy_And_Deafness), so no duplicate
    genetic record was added here, which would have left a gene nothing points at.

    Reported, not acted on: MONDO:0030535's label uses a lowercase subtype letter ('2d')
    where every sibling in the series uses uppercase. Copied verbatim as term labels always
    are.

    Validation: just validate, validate-terms, count-verified-snippets (all snippets
    verified against committed caches), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (33 bindings, 0 mismatches), check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-genereviews, validate-disorders.

    Self-review caught and fixed before push: a false claim that EXPH5 was the only EBS
    gene whose product is not a structural component (KLHL24 is another); a GO binding
    (GO:0043161, proteasome-mediated catabolism) that overstated what the node's own cited
    snippets say, replaced with GO:0016567 protein ubiquitination; two prose claims with no
    supporting evidence item in their row, for which the supporting sentences were added;
    and a description calling Carvajal syndrome a milder skin phenotype.

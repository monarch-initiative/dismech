  summary: 'Create: Premature_Ovarian_Failure_24'
  details: |
    New entry for SYCP2L-related premature ovarian failure 24 (MONDO:0970995; OMIM 620840), claimed in #15602 and modelled on Premature_Ovarian_Failure_19. Human evidence: two homozygous Chinese probands from consanguineous families (frameshift p.Ser52Profs*7 and missense p.Ile333Met, PMID:32303603, full text cached), plus an Iranian family with a homozygous nonsense variant known only from an abstract (PMID:38521400). Mechanism evidence comes from the Sycp2l knockout mouse (PMID:26362258, abstract only). That knockout shows accelerated loss of the primordial (dictyate) oocyte pool, not a prophase I synapsis or recombination arrest, so only the follicle-depletion node conforms to meiotic_prophase_failure. The common menopause-age SNP rs2153157 (PMID:19448621, PMID:37417852) is described in notes and is not a causal genetic record. No molecular function is bound on the SYCP2L node, because GO records only cellular-component annotations for the gene. The edges from follicle depletion to the hormone phenotypes are uncited textbook physiology, as in the precedent entry. Validation: just validate, validate-terms, count-verified-snippets (25/25) and the offline KB gates. Review round 1 (PR #15630): the oocyte-survival node now says no synapsis or recombination defect has been reported in Sycp2l-null oocytes, instead of asserting that synapsis is normal. The SC-assembly clause in the PMID:38521400 abstract is recorded as a description of the gene's general role, with no assay behind it. The HRT snippet now quotes the two full guideline sentences, with quote_role BACKGROUND. The C-terminus snippet from PMID:26362258 is regraded IN_VITRO, because PMID:32303603 attributes that result to transfected somatic cells. A Europe PMC search found no SYCP2L POI families beyond the three already cited. Review round 2: a deep-research report was run with OpenScientist (falcon is not installed in this environment) and committed with its citations and artifacts. just preflight-dr passed (SYCP2L named 72 times; OMIM 620840). All 16 of the report's references resolved, and all 5 of its quoted claims were found in their sources. It reports no families or variants beyond the three already in the entry and agrees with the entry's causal chain, so no KB content changed. The reference caches its validation wrote are committed because the report cites them. Two of its term mentions are mislabeled (HP:0000820 is thyroid, not menopausal symptoms), and neither is used in the entry.

  summary: 'Review Premature Ovarian Failure 24: repair SYCP2L gene-activity grounding
    and enrich classifications, prevalence, diagnosis, and treatments'
  details: |
    Repaired SYCP2L gene-activity grounding defect on SYCP2L Loss of Function by binding molecular_functions (GO:0003682 chromatin binding DECREASED, GO:0005198 structural molecule activity DECREASED), cellular_components (GO:0000795 synaptonemal complex), cell_types (CL:0000023 oocyte), and locations (UBERON:0000992 ovary). Added Harrison's chapters (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE), structured ULTRA_RARE prevalence across three published families (PMID:32303603, PMID:38521400), germline variant_origin, expanded diagnosis (FSH NCIT:C74783, AMH NCIT:C120625, Transvaginal Ultrasound NCIT:C17644), wired Hormone replacement therapy target_mechanisms (Ovarian Follicle Depletion, BYPASSES) with distinct non-colliding PMID:39652037 quote, cleaned cache narration from notes/limitations, and added top-level references.

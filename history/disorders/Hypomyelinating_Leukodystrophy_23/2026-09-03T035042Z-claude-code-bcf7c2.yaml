  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #10656.

    CRITICAL: the claim that R365Q homozygotes die of dilated cardiomyopathy in the first decade while R363Q homozygotes survive into the second was removed from all eight sites (top-level description, genetic.notes, the Cardiac and Hepatic Involvement node, the Dilated Cardiomyopathy phenotype, the progression record's phase and notes, the supportive-care treatment rationale, the KNOWLEDGE_GAP rationale, and the HUMAN_MODEL_MISMATCH rationale). Searched for a source before removing: PubMed esearch over all 51 RNF220 records, Europe PMC full-text queries for RNF220 with R365Q/cardiomyopathy/dilated cardiomyopathy, and an open-access check on PMID:33964137 and PMID:36083980. Neither cached source states it and no other paper does; PMID:38324685 describes the course unstratified ('most affected patients suffered from severe ataxia during their early teenage years and died at their second teenage years'). Dependent prose was rewritten to rest on that unstratified course instead, and the removal is recorded in the entry notes so the claim is not reintroduced.

    Roma founder allele claim removed from the genetic-counseling treatment; no source mentions Roma ancestry and PMID:40594583's founder-effect statement concerns RARS1.

    Truncated Olig snippet repaired: 'R365Q lost the ability...' restored to the full source clause 'both RNF220R363Q and RNF220R365Q lost the ability to increase the protein levels of endogenous Olig1 and Olig2', with the downstream description and genetic.notes corrected so neither asserts an R365Q-specific defect.

    Ambiguous entity reference animal_models#Mouse retargeted to animal_models#RNF220 R365Q knock-in mouse (RNF220-QQ), since both mouse models declare species: Mouse.

    Conformance gap closed: the node conforming to cns_myelin_failure#Axonal Degeneration and Progressive White Matter Dysfunction now carries GO:1990535 neuron projection maintenance DECREASED plus UBERON:0002316 white matter, matching the module node, instead of repeating GO:0042552 myelination from the upstream deposition node.

    PMID:36083980 (Yan et al., Brain 2022) identified and fetched as the second of the two clinical references PMID:38324685 cites as '(16, 17)'. It is listed under references but supports no evidence item: it is a paywalled correspondence with no abstract in PubMed or Europe PMC, so no snippet can be verified. Recorded as such in the entry notes.

    Also added a prevalence record (CASES_IN_LITERATURE / ULTRA_RARE, evidenced by the seven-families quote) and a note that PMID:40594583's c.1088G > A falls at codon 363, recorded as an inference rather than curated as a protein-level claim.

    No deep-research provider report backs this entry. Edison/falcon returned HTTP 402 and the claude_code fallback failed to launch; that statement is unchanged and remains accurate.


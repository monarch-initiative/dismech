  summary: 'Patch PR #10656: connect pathograph, refine myelin conformance'
  details: |
    Patch on top of the unmerged PR #10656 (author AO33, head 1abe575), prepared after /curate found that PR already covering MONDO:0030514. Not a competing entry: no PR opened for this branch.

    Closes the two IMPORTANT items in the standing CHANGES_REQUESTED review. (1) The pathograph was three disconnected components: 'Cardiac and Hepatic Involvement' and 'Auditory Pathway Involvement' had no incoming edge, so three of the four organ systems in the disease name floated free of the causal gene. Added two downstream edges from the trigger node with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, each carrying its own PMID:33964137 evidence item quoting the sentence that establishes the organ limbs as features of the genotype. The restraint stays on the mechanism, not on whether the link exists; the nodes' own outgoing edges to phenotypes remain UNKNOWN. All 9 pathophysiology nodes now form one weakly connected component with a single root. (2) 'Deficient CNS Myelin Deposition' carried GO:0042552 myelination while its declared conformance target cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath carries GO:0022010; confirmed via OAK that GO:0022010 is a direct subClassOf GO:0042552, and mirrored the module node's GO:0043209 and UBERON:0002316.

    Also took two reviewer suggestions: corrected the olig_stabilization_failure hypothesis description from an R365Q-specific loss to both disease alleles (keeping the mouse clause R365Q-specific, since only that allele was modelled in vivo), and recorded in notes why PMID:40594583 case 10's brain tumour is not curated as a feature, quoting that paper's own statement. Updated a notes sentence the first patch made stale.

    Deep research: falcon returned HTTP 402 (out of credits), the same failure the PR author documented; a --fallback run to openscientist was in flight and had not returned at the time of this record, so no provider report backs this patch. Content came from the reference caches already committed on the PR branch.

    Validation, all run against the patched file: validate-disorders (43/43 snippets verified), validate, validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens. Both new snippets confirmed exact substrings of references_cache/PMID_33964137.md. The patch introduces no new ontology terms: GO:0022010, GO:0043209 and UBERON:0002316 were already in cache/ from the module.

  summary: Deep research report for HLD23 (openscientist via falcon fallback)
  details: |
    Adds the provider report PR #10656 was missing. falcon returned HTTP 402 (out of credits), the same failure the PR author hit; the documented --fallback path routed to openscientist, which produced the report in 681s. Frontmatter records fell_back: true, requested_provider: falcon, and the falcon 402 in provider_attempts. The recipe's align_research_provider step renamed the report and its artifacts directory to -openscientist; a pre-rename duplicate named -falcon.md was removed so research-status does not report falcon coverage that does not exist.

    Report validation was retro-fitted with validate-research-reference and validate-research-terms, since openscientist emitted no frontmatter validation block and no citations sidecar. References: 14 checked, 14 resolved, 0 unresolved, 0 off topic (only 3 of 14 could be weighed for relevance). Terms: 39 checked, 38 resolved, 1 unverifiable, 7 named as a different term. Two of those seven are real wrong bindings and must not be used: NCIT:C15277, offered as 'supportive care', is Mastectomy; NCIT:C15535, offered as 'rehabilitation / physical therapy', is Urothelial Toxicity Attenuation. The other five are extraction artifacts where the report's column header rather than the term name was captured.

    Substantively the report reproduces the causal chain already curated on the PR branch independently, and marks the auditory, cardiac and hepatic links as inferred rather than demonstrated, which agrees with the INDIRECT_UNKNOWN_INTERMEDIATES typing used in the accompanying patch.

    The report contradicts the PR's stated literature base. The PR body says a PubMed search for RNF220 with leukodystrophy or lamin returns exactly three papers and all three are cited. That search was too narrow: it misses the RNF220 neural-development literature. Newly cached and uncited here are PMID:34716995 (RNF220 in neural development, review), PMID:32376680 (RNF220 required for cerebellum development, positive regulator of Shh signalling via PRC2/EED, required for CGNP proliferation), PMID:35040952 (sequential stabilization of RNF220 by RLIM and ZC4H2 in cerebellum development) and PMID:32630355 (loss of ZC4H2 and RNF220 in neural stem cells). PMID:32376680 is the notable one: it offers a candidate cerebellar-development mechanism for the ataxia limb, which the entry currently derives only from white matter dysfunction. It is RNF220 biology generally rather than the R363Q/R365Q disease alleles, so it is a lead for follow-up curation, not evidence that can be dropped in. Reported to the PR rather than acted on, to avoid widening someone else's PR.

  summary: 'Review: Hypomyelinating_Leukodystrophy_23'
  details: |
    Evidence-claim mismatch review using only the existing reference cache (PubMed was unreachable). All 7 phenotypes were already causally connected; no ClinGen CGGV or Orphanet record for RNF220/HLD23 is cached, and PMID:36083980 is still cached without any body text, so no new sources could be added. Changes: the human-phenotype sentences quoted from the mouse paper PMID:38324685 (leukodystrophy, callosal agenesis and intellectual disability; severe teenage ataxia and second-decade death) restate the clinical reports it cites, so the six items quoting them now carry quote_role BACKGROUND. The corpus callosum agenesis edge was moved from the progressive neurodegeneration node, whose description (the tract 'fails to form') is a developmental claim a degeneration node cannot make, to the oligodendrocyte progenitor proliferation/differentiation failure node, as an INDIRECT_UNKNOWN_INTERMEDIATES edge citing the R365Q knock-in mouse sentence linking Olig deregulation to oligodendroglial maldevelopment and callosal agenesis (MODEL_ORGANISM, INDIRECT). The two previously uncited edges from deficient CNS myelin now carry evidence: to leukodystrophy (definition of hypomyelinating leukodystrophy as primary lack of myelin deposition, BACKGROUND) and to progressive neurodegeneration (rotarod motor deficit in cKO and knock-in mice, MODEL_ORGANISM, INDIRECT). The progressive-neurodegeneration node description no longer asserts secondary axonal degeneration as observed in HLD23 (it has not been examined). Supportive care therapeutic_modality changed from BEHAVIORAL to OTHER, since it bundles cardiac, hepatic and audiological monitoring. Entry notes: removed a paragraph describing the deep-research provider failure during the original curation session and reworded two sentences that narrated earlier entry versions, keeping the substantive facts (no allele-stratified mortality source; the PMID:40594583 brain tumour is not curated as a feature). Validated with just validate, validate-terms, count-verified-snippets (46/46), check-entity-refs, check-causal-targets, the global snippet gates, and validate-disorders.

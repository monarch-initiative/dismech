  summary: 'Create: Hypomyelinating Leukodystrophy 23 (HLD23, RNF220)'
  details: |
    Created the HLD23 entry (MONDO:0030514, biallelic RNF220) from the seed stub. NO deep-research provider report was obtained: the Edison/falcon provider returned HTTP 402 (out of credits) and the documented claude_code fallback failed to launch ('agentapi not found in PATH' -> 'Claude Code exited with code 1: <no stderr>'). All content was curated from directly retrieved primary literature fetched with just fetch-reference. The literature on this entity is small: a PubMed search for RNF220 combined with leukodystrophy or lamin returns exactly three papers, all cited here (PMID:33964137 Sferra et al. Brain 2021, the delineating clinical study; PMID:38324685 Li et al. Sci Adv 2024, the Olig1/Olig2 K63-ubiquitination mouse study; PMID:40594583, an Iranian leukodystrophy cohort contributing a corroborating homozygous RNF220 case classified as a VUS). Verified the issue's claims before curating: hgnc:25552 resolves to RNF220 via OAK, MONDO:0030514's canonical label was confirmed and the seed file's incorrect title-cased label was replaced, and RNF220 in Wieacker_Wolff_Syndrome.yaml was confirmed to appear only inside reference titles and evidence snippets rather than as a causal genetic binding, so the coverage claim held. entry_type recorded as DISEASE. Two mechanistic routes are curated as separate EMERGING mechanistic_hypotheses rather than merged: reduced RNF220-lamin B1 binding with patient-fibroblast nuclear blebs (the laminopathy interpretation) and failed K63-linked stabilization of Olig1/Olig2 (the better-evidenced route to hypomyelination). Declared conforms_to against cns_myelin_failure at the trigger, differentiation-arrest, myelin-sheath and axonal-degeneration nodes, which fits that module's documented scope for oligodendrocyte-essential transcription machinery, and against cardiomyopathy_maladaptive_remodeling at the structural-impairment endpoint only, since no upstream cardiomyocyte insult or remodeling step is published for RNF220. Deliberately did NOT conform the deafness node to sensorineural_hair_cell_loss: no cochlear pathology has been reported and the deafness could be retrocochlear, so conforming would assert an unevidenced mechanism. The auditory, cardiac and hepatic edges carry causal_link_type UNKNOWN, and a KNOWLEDGE_GAP discussion records that three of the four organ systems in the disease name have no mechanistic account. A HUMAN_MODEL_MISMATCH discussion plus a PARTIALLY_RECAPITULATES link record that the R365Q knock-in mouse reproduces the myelin phenotype but not the progressive lethal course. Validation run: just validate passed; validate-terms passed; count-verified-snippets 40/40; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms (0 qualifier terms; none used), check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens all OK. check-snippet-grading initially failed on a real defect I introduced - a mixed sentence reporting both the mouse result and the human course was graded MODEL_ORGANISM on the animal-model link while its human clause was graded HUMAN_CLINICAL under phenotypes and progression; re-quoted the animal-model item to the mouse clause alone and the gate passed.

  summary: 'Create: Perisylvian Polymicrogyria with Cerebellar Hypoplasia and Arthrogryposis
    (MONDO:0014679, PI4KA)'
  details: |
    De novo curation of the prenatal-onset brain-malformation end of the PI4KA-related disorder spectrum. Six-node pathograph: biallelic PI4KA loss of function, impaired PI4KIIIalpha-TTC7-FAM126-EFR3 complex function, depletion of the plasma membrane PI(4)P pool, impaired cortical neuronal migration, and impaired myelination, feeding the perisylvian polymicrogyria and CNS hypomyelination phenotypes. Scope decision recorded in mappings and notes: the entry is anchored on MONDO:0014679 with a skos:broadMatch to MONDO:1040012 (PI4KA-related disorder), so the broader spectrum concept stays in the curation queue. No frequency band is asserted on any phenotype -- the entity rests on one family of three fetuses and the supporting cohorts enrolled across the whole PI4KA spectrum, so their denominators are not this entity's patient count. No causal edge runs into arthrogryposis; its mechanism is unestablished and is recorded as a KNOWLEDGE_GAP discussion with two proposed experiments rather than asserted. Two animal models: the Pi4ka null mouse recorded as FAILS_TO_RECAPITULATE (embryonic lethal, so unusable for a hypomorphic human disease) with limitations and evidence as the schema requires, and the zebrafish knockdown as PARTIALLY_RECAPITULATES. Validated with just validate (schema, terms, references: 62/62 snippets verified), validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms.

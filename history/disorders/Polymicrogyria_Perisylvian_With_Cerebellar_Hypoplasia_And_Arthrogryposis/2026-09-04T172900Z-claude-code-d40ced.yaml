  summary: 'Review round: correct the arthrogryposis knowledge-gap rationale and record
    the phenotype scoping rule'
  details: |
    Addressed the two blocking findings on PR #10900. Finding 1, inverted assertion: the pi4ka_arthrogryposis_mechanism_unknown rationale said no muscle histology or electrophysiology has ever been reported, and the adjacent clause said no muscle phenotype has been reported in PI4KA patients or any model. The deep-research artifact committed with this PR states three separate times, each citing Pagnamenta 2015 pages 2-4, that fetal muscle histology was normal and that this argues against a primary myopathy and favours fetal akinesia secondary to neurologic dysfunction. The rationale therefore asserted an untouched question where an informative negative result exists. The muscle clause was removed from the no-phenotype-reported sentence, and a paragraph now records the normal muscle histology and what it implies. It is recorded as prose without an evidence item because it cannot be quoted: references_cache/PMID_25855803.md is content_type abstract_only and a re-fetch on 2026-09-04 returned the abstract again with a byte-identical file, and DOI:10.1093/hmg/ddv117 is content_type unavailable. The rationale says so explicitly and flags that it belongs as a REFUTE item against a primary-myopathy mechanism once the full text is retrievable. Proposed experiment 1 was retargeted from muscle structure to motor unit assessment (anterior horn motor neuron counts, neuromuscular junction architecture) since muscle structure has already been looked at; its id, name, description and both outcome statements were rewritten, and repeat muscle histology is now framed as an internal control. Finding 2, phenotype scoping: the full text of the 2015 index report cannot be fetched, so the index-family findings the review named (bilateral talipes equinovarus, micrognathia, externally rotated hips, and the variable dolichocephaly, ventriculomegaly, small pons, renal pelviectasis, borderline pulmonary hypoplasia) still cannot be quoted. Resolution 2 was taken: a notes paragraph now states the rule that decided which features are in (a cached reference states it in a quotable sentence), explains why wider-spectrum features the index fetuses did not have are present, and lists the index-family findings that are absent and why. Two index-family findings turned out to be quotable after all, from PMID:34415322's summary of the earlier family, and were curated: Abnormal dentate nucleus morphology (HP:0100321) and Overlapping fingers (HP:0010557). The dentate phenotype is wired as a downstream target of the PI(4)P depletion node with directness INDIRECT, mirroring the existing cerebellar hypoplasia edge. Overlapping fingers is left unwired with a notes entry pointing at the same knowledge gap as the arthrogryposis phenotype. The olivary nucleus abnormality reported in the same sentence is not separately curated: HPO searches for olivary, olive and inferior olivary return only Olivary degeneration, Olivopontocerebellar atrophy, Olivopontocerebellar hypoplasia and Superior olive hypertrophy, none of which describes a dysplastic fetal inferior olive, and that search is recorded in the phenotype description. Non-blocking items taken: the GeneReviews surveillance sentence is now quoted on the Multidisciplinary supportive care treatment whose description asserted it, and PMID:39705356 was added to the top-level references block. Declined: pharmacologic spasticity management, because GeneReviews names no agent and no cached reference names baclofen, diazepam or botulinum toxin, so a therapeutic_agent binding would rest on the research report alone; and broadening the differential diagnoses, because none of the proposed additions is stated in a quotable sentence in any cached reference. Validation: just validate green including reference validation, validate-terms passed, count-verified-snippets 82/82, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all clean, and whole-KB check-title-snippets, check-snippet-length, check-folded-hyphens and check-snippet-grading all report no new violations.

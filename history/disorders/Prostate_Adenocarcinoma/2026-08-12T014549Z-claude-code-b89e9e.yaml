  summary: Add HUMAN_MODEL_MISMATCH discussion on microbial androgen biosynthesis
  details: |
    Added one HUMAN_MODEL_MISMATCH discussion (hmm_prostate_microbial_androgen_biosynthesis_castration_resistance) on whether gut commensal conversion of androgen precursors contributes to castration resistance in humans. Typed HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP per CLAUDE.md: the evidence is not absent but strong and causal in mice (antibiotic ablation delays resistance; FMT from castration-resistant donors confers it, PMID:34618582), while the human arm is observational enrichment only. Attached to the AR-dependence and castration-resistance-bypass nodes and to Androgen Deprivation Therapy. The rationale states why the species difference is load-bearing: mice produce little adrenal androgen, so in men a microbial route must be shown non-redundant with the adrenal-precursor/intratumoral-steroidogenesis pathway this entry already models. The 2026 cross-disease review (PMID:42426614) still calls the route hypothesized. No mechanism node or causal edge was added. Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets over the three edited files reported 77/90 verified, 13 skipped by prefix (DOI), 0 failures.

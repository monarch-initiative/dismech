  summary: 'Edit: add EZH2-DAB2IP silencing and stromal RASAL3 nodes'
  details: |
    Added two pathophysiology nodes. EZH2-Mediated DAB2IP Silencing records polycomb repression of DAB2IP in prostate epithelium with coordinate Ras and NF-kappaB release, from PMID:15817459 and PMID:20154697, with a downstream edge to Metastatic Dissemination. Stromal RASAL3 Silencing and Glutamine Supply records the cancer-associated-fibroblast mechanism from PMID:30047926, bound to CL:1000299 because the Cell Ontology has no cancer-associated fibroblast term, with a downstream edge to Clonal Evolution and Lineage Plasticity. Added a DAB2IP genetic record typed BIOMARKER; RASAL3 is deliberately not given a genetic record because the lesion is stromal and epigenetic. All offline checks pass.

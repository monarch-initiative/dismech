  summary: Correct the AR-mutagenesis to ETS-fusion edge and cite its real source
  details: |
    Corrected an overstated causal edge introduced in the previous session's curation
    (history record 2026-09-10T064812Z).

    The edge AR-Mediated Mutagenesis at Androgen Receptor Binding Sites ->
    TMPRSS2:ERG Fusion-Driven ETS Activation was described as "the rearrangement
    mechanism that generates androgen-responsive ETS fusions", carried no evidence of
    its own, and sat under a node whose description said the process "supplies the
    rearrangement mechanism behind" those fusions. The PPCG cohort study cited on that
    node does not show this. It shows chromoplexy enriched at tumour-specific AR
    binding sites, and a correlation between the AR-mediated footprint and ETS-fusion
    status (Cohen's d = 0.75). Neither establishes generation, and the correlation is
    directionally ambiguous in isolation, since an ETS fusion raises AR-pathway output.

    Fetched PMID:23622249 (Baca et al., Punctuated evolution of prostate cancer
    genomes, Cell 2013 - the paper that defined chromoplexy, cited as reference 15 by
    the PPCG study) and split the claim across its two real sources. The edge now
    carries two evidence items: Baca for the generative and temporal step ("Chromoplexy
    is active prior to ETS gene fusions, however, and generated ERG fusions in many
    instances"), which is clonal-ordering evidence, and the PPCG study for the
    localization step (chromoplexy enriched at tumour-specific ARBSs). The edge
    description was rewritten to say generation-then-expression explicitly, which is
    also what distinguishes it from the pre-existing AR-dependency edge into the same
    node - that one is about transcription through a fusion that already exists.

    The node description no longer asserts that AR-mediated mutagenesis supplies the
    mechanism. It now states that chromoplexy is an established generator of ERG
    fusions and is concentrated at AR binding sites, and that the step from
    co-localization to AR being what localizes the chromoplexy is an inference rather
    than a demonstrated result.

    Extended the node notes with two limits, both stated by the sources themselves.
    Baca explicitly flags the androgen-receptor attribution as unvalidated ("this
    hypothesis awaits experimental validation"); the experimental arm for it is the
    earlier TOP2B and AID androgen-induced double-strand-break literature, which this
    entry does not yet cite and which is the obvious next curation step. And the
    direction of the edge is recorded as resting on Baca's clonal ordering rather than
    on the PPCG correlation.

    Both new snippets verify against references_cache/PMID_23622249.md, which holds
    full text; the entry's machine-verified snippet count went from 43/88 to 44/90.


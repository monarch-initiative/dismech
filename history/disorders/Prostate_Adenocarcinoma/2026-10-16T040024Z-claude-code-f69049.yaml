  summary: Add Gleason score diagnosis row (tranche Q batch 3)
  details: |
    LOINC tranche Q batch 3 (final batch; staging and severity scores). Added a diagnosis[] row binding LOINC:35266-6 (Gleason score in Specimen Qualitative) via measurements, with diagnosis_term NCIT:C51701 (Biopsy of Prostate). Citing PMID:40063046 (the JAMA Prostate Cancer review, already cited elsewhere in this entry for the Metastatic stage), which states Gleason score as a component of this disease's own risk-stratification framework for choosing active surveillance versus definitive treatment. No reference_ranges band: Gleason grading is categorical specimen grading assigned by a pathologist, not a cut-off on a measured quantity. Code confirmed via the NLM Clinical Table LOINC search service and Monarch KG API in the step written; NCIT:C51701's label was corrected from an initial 'Biopsy of Prostate' entry attempt after the pre-edit validation hook caught a label mismatch -- the canonical label for the actual diagnosis_term binding used, NCIT:C15189, is 'Biopsy Procedure', not 'Biopsy' (caught and fixed on the sibling NRAS_Mutant_Melanoma entry in this same batch). Neither LOINC:35266-6 nor the NCIT diagnosis_term requires a third-party copyright notice. No collision with LOINC:35266-6 on any other open loinc-* branch's cache. BRCA_Mutant_Prostate_Cancer was considered as a second Gleason candidate and rejected: its only Gleason content is a single case-control study's risk-association finding (BRCA2 carriers and Gleason 7-10) embedded in a pathophysiology causal-edge evidence item, not an independent diagnostic-grading claim by this subtype entry, and the parent Prostate_Adenocarcinoma entry already carries the disease-level Gleason-grading diagnosis row. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

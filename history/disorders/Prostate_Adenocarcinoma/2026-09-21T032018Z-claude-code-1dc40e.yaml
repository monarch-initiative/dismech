  summary: Re-cite the PPCG study from DOI to PMID:42717097; 90/90 snippets verified
  details: |
    Re-cited the PPCG cohort study from its DOI to its now-available PMID, after
    merging origin/main into the branch for PR #12382.

    The merge changed the validation contract under this entry. Main removed DOI from
    skip_prefixes in conf/reference_validator_config.yaml and set
    unknown_prefix_severity to ERROR (issues #7514 and #11921), on the principle that
    changing the citation identifier must not change whether its quote is checked.
    The 28 snippets cited to DOI:10.1038/s41586-026-10468-w had been exempt from
    snippet checking; they became hard errors, because that DOI's Crossref record
    carries no abstract and its cache file holds content_type unavailable.

    The paper is now indexed. An E-utilities lookup on both the DOI and the title
    returns PMID:42717097, and fetching it caches 136,220 characters of full text.
    All 28 snippets were tested against that cache before any edit and matched as
    exact substrings, with no hyphenation tolerance needed - which independently
    confirms the transcription made from the publisher PDF in the original session.
    Re-pointed every reference to the PMID and updated reference_title to PubMed's
    form, which carries a trailing period.

    The entry's snippet verification goes from 44/90 verified with 46 skipped by
    prefix, to 90/90 verified with nothing skipped.

    Rewrote the review_notes paragraph that described the DOI-only state. It said the
    paper was not indexed and told a future curator to re-fetch once a PMID existed;
    leaving it would have been prose asserting a repository state that no longer
    holds. It now records that the entry was curated ahead of indexing, that the
    snippets were re-cited and verified against the PMID, and that the PMID is the
    identifier to use.

    Kept references_cache/DOI_10.1038_s41586-026-10468-w.md. Nothing cites it as
    evidence any more, but the review_notes and the 2026-09-10 history record both
    name the DOI as provenance, and an extra cache file is the safe direction.

    The merge itself conflicted only in cache/go/terms.csv, where both sides had
    added the identical GO:0004126 row and only retrieved_at differed; main's earlier
    row was kept.

    Validation on the merged tree: just validate-disorders and just
    validate-kb-references both pass at 90/90, plus check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-empty-snippets, check-reference-titles,
    check-term-cache-integrity and check-cache-order.

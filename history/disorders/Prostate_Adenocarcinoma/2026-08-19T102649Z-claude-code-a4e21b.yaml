  details: |
    Review response to the ai4c-reviewer CHANGES_REQUESTED review of PR #8854, blocking item 4: the 13-CMB PHENOTYPE_ALGORITHM definition asserted details absent from the abstract_only PMID:41887393 cache.

    Removed or corrected each unsupported assertion in validation_status.rationale. The abstract reports adjustment for "established clinical factors and commonly used genomic biomarkers, including Decipher and Oncotype DX" but does not enumerate Gleason score, PSA, stage or age, so the enumeration was replaced with the abstract's own wording. The claim that the Decipher/Oncotype DX comparison used computational curatedPCaData scores rather than the proprietary commercial assays appears nowhere in the abstract and was removed. The attribution of a prospective multi-center validation requirement to the authors was likewise unsupported; it is now stated as what the publication does and does not report, quoting the abstract's own hedge that the model "could potentially serve as a robust solution for precision management". The "retrospective, two-center hospital validation" limitation was reworded to what the abstract states, since it does not describe the cohorts as retrospective.

    Also replaced the "ER-like"/"INR-like" terminology throughout the definition description and the mTOR evidence explanation with the "responders and non-responders" wording the publication actually uses, per the same review item.

    All reported performance figures were checked against the cached abstract and retained as stated: AUC 0.981 in the NCT02430480 training cohort (n = 37), pCR p = 0.0005 and BCRFS p = 0.024 in the n = 122 cohort, BCRFS p = 0.031 in the n = 60 cohort, and progression-free survival p = 0.0017 in TCGA-PRAD (n = 396).

    Validation: just validate (all validations passed), just check-duplicate-keys (OK), just count-verified-snippets 55/71 verified with 16 skipped by prefix across the module and both disorder entries, identical to the pre-change baseline reported in the review. No evidence snippet on this entry was altered - only prose that had drifted beyond the cited abstract.

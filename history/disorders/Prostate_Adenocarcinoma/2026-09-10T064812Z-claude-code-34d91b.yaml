  summary: Curate mutational processes from the PPCG whole-genome cohort
  details: |
    Curated the mutational-process aetiologies of prostate adenocarcinoma from the Pan
    Prostate Cancer Group whole-genome study (DOI:10.1038/s41586-026-10468-w, 959 primary
    tumours), which integrates single-base-substitution, indel, copy-number and complex
    structural-variant signatures into eight integrated mutational footprints.

    Added seven pathophysiology nodes, one per mutational process with a distinct
    aetiology: AR-mediated mutagenesis at tumour-specific AR binding sites, replication
    stress-driven chromosomal instability, reactive-oxygen-species mutagenesis, canonical
    homologous recombination deficiency, CDK12-associated non-canonical homologous
    recombination impairment, mismatch-repair deficiency with microsatellite instability,
    and APOBEC cytidine-deaminase mutagenesis. Each carries three or four evidence items
    quoting the paper, GO/CL/UBERON bindings, and downstream edges into the entry's
    existing Clonal Evolution, Metastatic Dissemination, ETS-fusion and immune-evasion
    nodes. Added an upstream edge from Androgen Receptor Signaling Dependence into the
    AR-mutagenesis node, which is the mechanistic link the entry previously lacked between
    AR as a growth dependency and AR as a mutagen.

    Wired two existing biomarker-selected treatments to the mechanisms they are actually
    selected on: Talazoparib plus Enzalutamide to the homologous-recombination-deficiency
    node and Pembrolizumab to the mismatch-repair-deficiency node, both with
    treatment_effect MODULATES, since the enum has no value for a synthetic-lethal or
    biomarker-selection relation and INHIBITS would assert the wrong direction against a
    deficiency node.

    Added a KNOWLEDGE_GAP discussion recording that the metastasis-risk and
    ARPI-versus-taxane results are retrospective, the latter a target trial emulation the
    authors themselves call hypothesis generating, and that a prospective test must specify
    how low-purity, low-burden and panel-only tumours are classified.

    Three curation decisions worth recording. First, the mutational-process nodes carry no
    genetic_context: each is a process-level bias rather than a single variant, and a
    SOMATIC variant_origin on any of them would be read by the cancer-cell-of-origin
    derivation as a second transforming lesion competing with the ETS-fusion node.
    just check-cancer-origin confirms the entry still derives a single origin
    (SOMATIC_LESION / OK / CL:0002231). Second, no DNA-methylation GO term is bound on the
    AR node: GO:0006306 and GO:0032776 are both obsolete, so the CpG-hypomethylation context
    is carried in prose and evidence rather than by a bad binding. Third, the paper was not
    in PubMed at curation time and Crossref returns no abstract, so its cache file has
    content_type unavailable and the snippet auditor reports its 20 snippets as skipped
    rather than verified. Every snippet was transcribed from the publisher PDF and checked
    character-by-character against the extracted text, ignoring only line-break
    hyphenation; re-fetch the reference once a PMID exists.

    Validation: just validate-disorders (schema, terms, references) passed; also
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-empty-snippets, check-reference-titles.

  summary: 'Create: Nail-patella syndrome'
  details: |
    De novo curation of Nail-patella syndrome (NPS; MONDO:0008061; LMX1B,
    hgnc:6654; autosomal dominant, haploinsufficiency). Closes claim issue
    #10933; deletes stubs/Nail-patella_Syndrome.yaml.

    Deep research: `just research-disorder claude_code` (claude-haiku-4-5 /
    claude-sonnet provider, 15 web searches, 27 citations). The provider's
    reference/term validation step did not complete in this environment (agent
    proxy SSL blocked crossref/unpaywall/openalex enrichment), so every PMID/CURIE
    was treated as a lead and independently fetched and verified from the local
    reference cache. GeneReviews (PMID:20301311) was used as the mandatory
    phenotype baseline.

    Pathograph: one initiating lesion (LMX1B Haploinsufficiency, MOLECULAR,
    genetic_context LOSS_OF_FUNCTION/heterozygous) branching to four organ chains
    - failed dorsoventral limb patterning -> nail/patella/elbow/iliac-horn
    dysostosis; podocyte transcriptional-program failure -> GBM defect ->
    proteinuria/FSGS; trabecular-meshwork dysfunction -> elevated IOP ->
    open-angle glaucoma; monoaminergic neuron deficit -> reduced pain sensation /
    ADHD / depression. 14 phenotypes with HP terms and frequencies where the
    source quantifies them. Two animal models (Lmx1b V265D/+ dominant-negative;
    Lmx1b-null) linked via modeled_mechanisms with readouts including the
    nicotinamide IOP rescue. One HUMAN_MODEL_MISMATCH discussion on
    haploinsufficiency vs dominant-negative and mouse-heterozygote silence.

    Evidence: 45 evidence items across 10 PMIDs plus one ClinGen Definitive
    gene-disease validity assertion (CGGV, cache built via clingen-rebuild).
    Validation: just validate, validate-terms, count-verified-snippets (45/45),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-enum-values, check-qualifier-terms, and the batched validate-disorders
    all pass.

  details: |
    Follow-up commit addressing the ai4c-reviewer REQUEST_CHANGES on PR 7593, all four items being claim-evidence alignment rather than fabricated text. Item 1: the Intra-articular and Systemic Glucocorticoids treatment cited a EULAR/PReS sentence stating that systemic JIA and adult-onset Still's disease are the same disease, a nosological claim with no glucocorticoid content; swapped for the on-point sentence from the same cached abstract about early IL-1 or IL-6 inhibition associated with short-duration glucocorticoid, upgraded PARTIAL to SUPPORT, and reworded the treatment description so it no longer calls systemic glucocorticoids a front-line standing agent in systemic JIA. Item 2: the Synovial Hyperplasia to Cytokine-Mediated Articular Damage edge carried a snippet placing the effector/regulatory imbalance upstream of synovial inflammation, the opposite orientation to the edge, and the cached Lancet abstract contains no sentence supporting the edge as drawn; the evidence item was removed rather than repointed. Item 3: evidence_source across the three consensus documents was inconsistent; adopted the convention that a consensus document whose recommendations rest on a systematic review of human clinical evidence is HUMAN_CLINICAL while a pure expert-opinion consensus with no patient data is OTHER, per the CLAUDE.md definition of OTHER. That moves the PANLAR GRADE guideline to HUMAN_CLINICAL and the PRINTO Delphi consensus to OTHER, leaving EULAR/PReS as HUMAN_CLINICAL. Item 4: the Enthesitis-related subtype was tagged SUPPORT on the bare fragment enthesitis/spondylitis-related JIA; quoted the full four-disorders sentence and downgraded to PARTIAL, matching the treatment already given to the RF-negative and Psoriatic subtypes. Also took suggestions 6, 7 and 8: extended the two remaining bare-fragment snippets to self-interpretable clauses, corrected the Systemic subtype explanation which claimed the Orphanet definition supports every recorded feature when it does not cover macrophage activation syndrome or the adult-onset Still's continuum and frames its features as of variable occurrence, and filled links.prs on the weekly-compliance history record. Suggestion 5, citing Petty et al. 2004 for the ILAR categories, was left for separate work because it requires fetching a new reference and re-sourcing four subtype evidence items. Validation: just validate passed, just validate-terms passed, just count-verified-snippets reported all snippets verified against cached references.

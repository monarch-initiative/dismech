  summary: Add rare genetic variants (NOD2, ACVR1, SMAD6) from multiplex family WGS
    study
  details: |
    Added three genes from PMID:42466628 (Avery et al. 2026, G3) identifying rare pathogenic variants in familial JIA: NOD2 (association with Blau syndrome phenotypic overlap), ACVR1 (gain-of-function variants disrupting OGT inhibition with Drosophila validation), and SMAD6 (frameshift variant affecting BMP pathway inhibition). Each gene includes computational evidence (AlphaFold3 modeling) and/or experimental validation. BMP pathway dysregulation emerged as a novel mechanistic convergence point between familial JIA and FOP. Review follow-up: ACVR1 and SMAD6 are downgraded from association Causative to Risk Factor, with relationship_type RISK_FACTOR added to all three genes. The source reports both as ClinVar VUS with GEM scores of 0.75-1.63 against its own stated diagnostic threshold of 2, calls them candidate variants, and says additional or experimental follow-up is still needed - several tiers below the schema's CAUSATIVE, which corresponds to ClinGen Definitive or Strong. The grading was also inverted relative to the evidence, since NOD2, the one gene with known pathogenic ClinVar alleles and GEM 3.08-4.77, was already Risk Factor. The NOD2 notes no longer place the N637Sfs*120 frameshift among the four multiplex pedigrees: it comes from the 115-singleton replication cohort, and the authors discount it on gnomAD haplosufficiency grounds while calling it worth follow-up. The single GEM span 0.96-4.77 is split into 3.08-4.77 for the known-pathogenic variants and 0.962-1.04 for the one VUS family, which the single span hid. A new NOD2 item quotes the authors' own stronger reading, that these are an additional four families with Blau syndrome previously ascertained as JIA. The ACVR1 evidence item that bundled the cohort finding and the AlphaFold3 prediction under HUMAN_CLINICAL is split into a HUMAN_CLINICAL item for the variant-association sentence and a COMPUTATIONAL item quoting the paper's own computational-support sentence. On SMAD6, the segregation item's explanation is trimmed to what its snippet supports and the MutationTaster prediction it had been asserting is moved to a separate COMPUTATIONAL item; the BMP-convergence item is regraded OTHER with directness INDIRECT, being the authors' mechanistic proposal rather than a human clinical observation. The ACVR1 notes no longer claim clean autosomal-dominant segregation in both families: H121Y was not transmitted from the mother and the father was not genotyped, R160G shows incomplete penetrance with two of five carrier children unaffected, and the paper's own wording is likely autosomal dominant. 71/71 snippets verified after the round.

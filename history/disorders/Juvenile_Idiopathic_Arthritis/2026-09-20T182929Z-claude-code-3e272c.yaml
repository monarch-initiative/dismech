  summary: Add rare genetic variants (NOD2, ACVR1, SMAD6) from multiplex family WGS
    study
  details: |
    Added three genes from PMID:42466628 (Avery et al. 2026, G3) identifying rare pathogenic variants in familial JIA: NOD2 (association with Blau syndrome phenotypic overlap), ACVR1 (gain-of-function variants disrupting OGT inhibition with Drosophila validation), and SMAD6 (frameshift variant affecting BMP pathway inhibition). Each gene includes computational evidence (AlphaFold3 modeling) and/or experimental validation. BMP pathway dysregulation emerged as a novel mechanistic convergence point between familial JIA and FOP.

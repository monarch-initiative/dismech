  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 27 (CARS2)'
  details: |
    New entry for COXPD27 (MONDO:0014728), caused by biallelic CARS2 variants; the stub stubs/Combined_Oxidative_Phosphorylation_Defect_Type_27.yaml is deleted. CARS2 encodes the mitochondrial cysteinyl-tRNA synthetase; the lesion node binds cysteine-tRNA ligase activity (GO:0004817, DECREASED) and mentions its second activity, cysteine persulfide synthesis (PMID:29079736), whose role in the disease is unstudied. Chain: reduced mitochondrial tRNA-Cys charging in patient fibroblasts (GO:0070147; PMID:25787132, PMID:37151360), impaired mitochondrial translation with complex I and V assembly defects corrected by wild-type CARS2 (PMID:25787132), combined complex I/III/IV deficiency in liver and muscle with normal fibroblast respiratory chain in one patient (PMID:25787132, PMID:37151360), and neuronal energy failure with Alpers-like neuropathology (PMID:30139652). Phenotypes from the case reports: the first family with a MERRF-like progressive myoclonic epilepsy (PMID:25361775), epileptic encephalopathy with complex movement disorder (PMID:25787132), Alpers-Huttenlocher-like focal status epilepticus (PMID:30139652), tremor and aggression (PMID:34704010), and a neonatal case with dystonic crises and fatal central apnoea (PMID:37151360, which tabulates the eight patients known in 2023). relationship_type UNKNOWN: ClinGen rates CARS2 Moderate for mitochondrial disease (MONDO:0044970), a broader concept, so no tier is recorded. No GeneReviews chapter covers CARS2 (offline and online checks). Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (48 snippets, 0 issues), count-verified-snippets 48/48, and the entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype and folded-hyphen checks all pass.

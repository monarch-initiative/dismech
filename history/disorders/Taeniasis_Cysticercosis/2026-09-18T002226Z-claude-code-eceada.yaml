  summary: Backfill transmission (#10115)
  details: |
    Added a transmission block recording the two distinct routes of this entry's paired syndromes: taeniasis by ingesting undercooked pork containing cysticerci, and cysticercosis by faecal-oral ingestion of Taenia solium eggs shed by a human tapeworm carrier. The descriptions state why the routes must stay separate - a person who never eats pork can still develop cysticercosis, and the disease tracks sanitation rather than meat consumption. Evidence: PMID:12932389 (Lancet seminar; one sentence for each route), PMID:39280880 (pork-ingestion route, marked quote_role BACKGROUND), and PMID:38535559 (egg ingestion and poor sanitary conditions). The Taenia solium agent was already bound to NCBITaxon:6204. Validated with just validate, just count-verified-snippets (51/51 verified), and the batched just validate-disorders sweep.

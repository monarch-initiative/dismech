  summary: Add calcified-NCC and hydrocephalus phenotypes, bind antiparasitic therapeutic_agent,
    add niclosamide treatment
  details: |
    Addressed one gap from the #6309 parasitic-disorders content-gap tracker for Taeniasis_Cysticercosis: 'no calcified-NCC/hydrocephalus phenotypes; add therapeutic_agent (albendazole/praziquantel/niclosamide)'. Added a Cerebral Calcification phenotype (HP:0002514, OCCASIONAL, 10-20% of NCC cases per PMID:38251334) and a Hydrocephalus phenotype (HP:0000238, unquantified frequency per PMID:38535559, a surgical narrative review of extraparenchymal NCC). Bound therapeutic_agent (CHEBI) for albendazole and praziquantel on the existing Antiparasitic therapy treatment, with a supporting combination-therapy citation (PMID:39149676), and added a new Niclosamide (Taeniasis Treatment) entry bound to CHEBI:7553 with evidence from a niclosamide MDA effectiveness/safety study (PMID:39280880). Also tagged both antiparasitic treatments therapeutic_modality: SMALL_MOLECULE. Left the issue's other Taeniasis_Cysticercosis bullet (structured transmission distinguishing pork-cysticerci-to-taeniasis vs fecal-oral egg-to-cysticercosis routes, and adult intestinal taeniasis phenotype representation) for a future pass, since it needs its own mechanism/transmission modeling rather than a bounded phenotype/treatment addition. Validated with just validate, just validate-disorders, just count-verified-snippets (13/30 verified, up from 7/24; all 6 new PMID snippets verified), just validate-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-duplicate-keys, check-entity-refs.

  summary: 'Review round 2: model NCC hydrocephalus/calcification mechanisms, add
    Headache'
  details: |
    Second curation round on PR #9805, responding to the review's four blocking items, plus a merge of origin/main to clear a conflict.

    1. Cerebral Calcification frequency band removed. The cited 10-20% is attributed in the source to a separate population-based CT study of an endemic population, so it is endemic-population CT prevalence rather than the fraction of NCC patients; and this cohort was selected for calcified NCC, so it structurally cannot supply that fraction. The explanation now records why frequency is unset instead of asserting an OCCASIONAL band.

    2. Niclosamide evidence re-quoted from the paper's own FINDINGS and INTERPRETATION rather than its BACKGROUND. The 84.3% figure restated an earlier selective-chemotherapy study; this paper reports 75.0% single-dose effectiveness and concludes effectiveness "is lower than expected". Three evidence items now: the 75.0% FINDINGS result, the INTERPRETATION sentence that qualifies it, and the adverse-event safety numbers.

    3. Hydrocephalus mechanism is now modeled rather than quoted inside a phenotype block. pathophysiology gained four nodes with downstream edges, replacing the single orphan node:
       - Larval infection of the nervous system now has downstream edges into both arms.
       - Cyst Degeneration and Perilesional Inflammation [TISSUE] -> Residual Parenchymal Calcification.
       - Residual Parenchymal Calcification [TISSUE] -> Cerebral Calcification, Seizures, Headache.
       - Extraparenchymal Cyst Burden with Impaired CSF Flow [ORGANISM] -> Hydrocephalus, carrying both mechanisms the review pointed at: inflammatory CSF-flow impairment and direct mechanical obstruction.
       Antiparasitic therapy gained target_mechanisms. Note one of the two links records aggravation, not suppression: the cited source states that anthelminthic treatment itself triggers antigen release and inflammation, which is why corticosteroids are co-administered.

    4. Headache phenotype added, bound to HP:0002315, citing the 52.1%-as-presenting-symptom result in the 524-patient cohort and the associated care burden. frequency is deliberately unset here too, for the same selection reason as item 1 - the cohort is hospital-based and selected for calcified NCC, so its symptom shares describe that subpopulation and not the disease as a whole.

    Merge: origin/main was merged in to clear a conflict. The conflict was confined to two cache files [cache/chebi/terms.csv and cache/enums/chemicalentityterm_b3afbb412a9e.csv] where both sides had appended rows; resolved by keeping both sides and running just normalize-cache, then just check-term-cache-integrity.

    Validation run: just validate [30/47 snippets verified, 17 skipped by prefix], just validate-terms [passed], just check-entity-refs, just check-causal-targets [no new broken targets], just check-duplicate-keys, just check-term-cache-integrity.

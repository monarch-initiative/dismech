  summary: 'Create: Spondyloepimetaphyseal Dysplasia Short Limb Abnormal Calcification
    Syndrome (MONDO:0010077, DDR2)'
  details: |
    De-novo curation of SMED-SL/AC (MONDO:0010077), the autosomal recessive DDR2 loss-of-function skeletal dysplasia.

    Deep research: one openscientist run (research/Spondyloepimetaphyseal_Dysplasia_Short_Limb_Abnormal_Calcification_Syndrome-deep-research-openscientist.md, 12/12 citations resolved, one quote checked and valid). Its term validation flagged needs_review, and two of its identifiers were wrong and were not used: it proposed MONDO:0009642 as the disease term (that CURIE resolves, and is orofaciodigital syndrome type II) and HGNC:2968 as the gene (does not resolve; DDR2 is hgnc:2731). Both are recorded in the entry notes. just preflight-dr PASSed against MONDO:0010077 with DDR2 mentioned 76 times.

    Mechanism curated as two upstream routes converging on one node: kinase-domain missense and frameshift alleles retained in the endoplasmic reticulum, versus the discoidin-domain p.E113K allele that traffics normally and cannot bind collagen. Both converge on failure of collagen-induced receptor activation, then on growth-plate chondrocyte proliferation, with a separate craniofacial branch through the cranial-base synchondroses.

    Deliberate omissions: no frequency on any phenotype (small consanguineous founder cohorts); the premature calcification that names the disorder is curated as a KNOWLEDGE_GAP because no source traces a path from absent DDR2 collagen sensing to early mineral deposition; the p.Arg124Trp discoidin allele is recorded as unassayed rather than assumed to fail like p.E113K.

    A quoting limitation is recorded in the entry notes and reported on issue #10192: the founding paper's allelic-series sentence encloses each variant designation in square brackets, which linkml-reference-validator strips from the query but keeps in the cache, so that sentence cannot be used as a snippet. The claim is evidenced from a bracket-free sentence in a later paper instead.

    Validation: just validate-disorders, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length all pass. 52/52 snippets verified against cached references.

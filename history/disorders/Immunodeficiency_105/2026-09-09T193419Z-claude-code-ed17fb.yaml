  summary: 'Create: Immunodeficiency 105 (CD45 deficiency)'
  details: |
    New entry for claim #11553 (immunodeficiency 105, MONDO:0800104, PTPRC/CD45 deficiency). Preflight confirmed nothing in kb/ bound hgnc:9666 or described CD45 deficiency; the only prior PTPRC mention was a vitiligo GWAS snippet. Curated from one OpenScientist deep-research report (research/Immunodeficiency_105-deep-research-openscientist.md; 12/12 references resolved, 23/23 quotes verified, term validation needs_review true) plus the primary case reports. No GeneReviews chapter exists for this disease. Pathophysiology is a four-node chain: loss of CD45 surface expression, failure of Lck activation, arrest of thymocyte development, and B-cell signalling failure despite normal B-cell numbers. The human evidence base is three unrelated patients, so the entry is explicit about which claims rest on the Ptprc-null mouse: the two-checkpoint thymic block and the selection defects are model-organism evidence only, and a KNOWLEDGE_GAP discussion records that the human staging is unobserved rather than confirmed. The PTPRC C77G isoform-altering polymorphism is recorded as a separate SUSCEPTIBILITY genetic record precisely so it is not mistaken for a cause, since it dominates the PTPRC literature. The report's ontology suggestions were checked and three were wrong: HP:0410354 offered for reduced T-cell count is Increased sialylated N-glycan level, CL:0000807 offered for CD4/CD8 double-positive thymocyte is DN3 thymocyte, and HP:0005415 offered for T lymphopenia is Decreased total CD8+ T cell proportion. HP:0005403 and CL:0000809 were used instead. Every CURIE in the entry was resolved through OLS at the point of writing. Two claims are left deliberately without evidence, each with a notes line saying why: immunoglobulin replacement is standard supportive care not reported in the CD45 literature, and the newborn-screening definition describes the general SCID pathway since no case of this disease has been reported as screen-detected. Validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-duplicate-keys and just validate-disorders.

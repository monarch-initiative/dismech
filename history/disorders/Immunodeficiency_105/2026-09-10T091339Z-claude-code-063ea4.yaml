  summary: 'Review round 1: cite the transplanted CD45 patient, add the flow-cytometry
    diagnosis'
  details: |
    Round 1 on PR #11563. The blocking finding was correct and is the kind of error that matters most in this entry: the HSCT notes said the recommendation rests 'not on direct evidence in this genotype', while PMID:22689986, already cited by this entry and already in references_cache, reports that the uniparental-disomy patient 'had undergone successful bone marrow transplantation'. That is a molecularly confirmed CD45-deficient patient, transplanted successfully, mentioned in passing by a paper about the disomy rather than about the transplant. I had read that abstract for the genetics and not for the management sentence. The entry now carries it as evidence on the HSCT treatment, and the note is reworded to say that no CD45-specific series exists and the only genotype-specific datum is that single case, so it establishes feasibility rather than outcome. The reviewer's framing is right that understating available evidence is the same class of defect as overstating it, and worse in an entry whose whole point is being scrupulous about how thin the evidence is. Took suggestion 1 and added a diagnosis block for absent surface CD45 on leukocyte immunophenotyping, bound to NCIT:C113003 Immunological Flow Cytometry and cited to PMID:11145714; this is the one diagnostic step specific to the genotype rather than shared with severe combined immunodeficiency generally. Declined suggestions 2 and 3 with reasons recorded in the PR reply: the additional phenotypes come from the OMIM clinical synopsis and dismech has no OMIM reference fetcher, so they cannot be added with an exact-quote snippet, and the Orphadata XML is not present locally to substitute; and DiseaseMappings has only icd10cm, icd11f, mondo and ncit slots, so an OMIM mapping cannot be expressed in the schema at all. Re-validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-snippet-length and just validate-disorders; 26/26 snippets verified, up from 23.

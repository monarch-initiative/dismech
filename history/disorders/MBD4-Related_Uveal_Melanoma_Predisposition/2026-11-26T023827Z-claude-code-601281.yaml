  summary: Add metastatic uveal melanoma phenotype
  details: |
    Searched GeneReviews (PMID:42594245), the discovery cohort, the 25-family series and the index case report, then two further PubMed searches on MBD4 with germline/heterozygous/carrier and with uveal/glioma/breast/polyposis terms. Added three phenotypes: Metastatic Uveal Melanoma, Increased CpG>TpG Mutagenesis in Carrier Blood, and Clonal Hematopoiesis (the last two from the heterozygous founder-allele study PMID:40905073). No HPO term fits any of them, so none is bound; the searches are recorded in each description. Relatives' breast, renal and colorectal cancers remain excluded (no case-control data). AML, myelodysplasia, colorectal polyposis and glioma in biallelic carriers belong to MBD4-Related_Tumor_Predisposition_Syndrome, not this heterozygote entry, and were not added. Entry prose that the new findings made stale (the claim that a heterozygote is not a mutator state, and that no phenotype other than uveal melanoma is recorded) was revised.

  summary: 'Create: MBD4-Related_Uveal_Melanoma_Predisposition'
  details: |
    New entry for the autosomal dominant uveal melanoma susceptibility conferred by heterozygous germline MBD4 loss of function (MONDO:0011695, OMIM 606660), following the ClinGen split from the recessive MBD4-TPDS (MBD4-Related_Tumor_Predisposition_Syndrome, not edited). Anchored on the susceptibility term rather than MONDO:0006486 (tumor term, somatic Uveal_Melanoma entry). The ClinGen AD Moderate assertion (CGGV:assertion_d97335a9..., cached from the 2026-10-14 ClinGen export via clingen-rebuild --csv) is recorded against MONDO:0006486, so it is cited as evidence and not recorded in gene_disease_validity; check-gene-validity reports it as other_disease. relationship_type RISK_FACTOR (ClinGen Moderate; variant neither necessary nor sufficient). Pathograph: germline first hit -> chromosome 3 loss second hit (co-inactivating BAP1) -> tumor-restricted G:T mismatch repair loss -> CpG>TpG hypermutator -> uveal melanoma. Sources: Derrien 2021 (full text), Rodrigues 2018 (full text), Villy 2024, Repo 2020 (REFUTE), Johansson 2019, JAMA Ophthalmol 2026, Saint-Ghislain 2022, Curie ICI series 2026, Ohio panel study 2026, ClinGen record, GeneReviews MBD4-TPDS chapter, mouse knockouts. Deep research: falcon failed authentication (503) twice and --fallback did not engage, so one claude_code report was run and used only as a lead; it read search snippets only, and its ellipsis-joined Palles quote (flagged unsupported by the validator) and NCI PDQ and Portuguese-series claims were not used. preflight-dr exited 2 (no local mondo.db). Gaps: no penetrance figure, no heterozygote surveillance protocol found, tumor spectrum beyond uveal melanoma unestablished, no pediatric cases in cited sources, NCCN/ASCO guideline texts not read (cited via a secondary report). Validated with just validate, count-verified-snippets (62/62), validate-terms, entity-ref, causal-target, duplicate-key, qualifier, genereviews, gene-term-mismatch and block-scalar checks, and validate-disorders.

  summary: Create a Kyasanur forest disease infectious-disorder entry
  details: |
    Added Kyasanur forest disease as MONDO:0017881, caused by Orthoflavivirus kyasanurense / KFDV.

    The curation binds the Indian Western Ghats H. spinigera tick ecology, two human exposure routes, a prevalence/burden summary from the 2000-2025 systematic review, the 3- to 8-day incubation and biphasic clinical course, hallmark febrile and hematologic phenotypes, RT-PCR/IgM ELISA diagnostics, supportive care, and the formalin-inactivated KFD vaccination program.

    The mechanism chain models KFDV infection of human endothelial and monocyte-derived dendritic cells, endothelial E-selectin/ICAM1/VCAM1 activation and dendritic-cell conditioned-media activation, then an indirect conformance to the viral hemorrhagic fever vascular-permeability node. The final vascular-permeability edge is deliberately marked as indirect because the primary KFDV cell paper measured endothelial activation and leukocyte adhesion, not monolayer leak.

    Deep-research providers were unavailable for this candidate, so the entry was curated directly from regenerated PubMed cache records.

  summary: Record why no estrogen receptor gene is bound on the estrogen-annotated
    node
  details: |
    Third tranche of the estrogen-signalling pathograph work in issue #12925.
    The issue lists this entry's estrogen-annotated node among fourteen that
    bind GO:0030520 while naming no gene, as candidates for an ESR1 descriptor.
    Read against the node's own claim and sources, ESR1 is not the gene this
    node is about, so the node carries a recorded reason instead of a binding.
    The issue treats that as a closed task rather than an avoided one.

    Resistance in this entry comes from PIK3CA-driven PI3K-ER crosstalk, so the
    estrogen receptor is the pathway the mutant kinase acts on rather than the
    altered gene. The instructive point is the contrast with the identically
    named node in ER_Positive_Breast_Cancer, where ligand-binding-domain
    mutations in ESR1 itself produce ligand-independent receptor activity: the
    same node name carries opposite gene-level claims in the two entries, which
    is why the worklist's node names could not be acted on mechanically.

    PIK3CA is in this entry's genetic: section and reaches no node, including
    its own eponymous PIK3CA Oncogenic Mutations node. That is a real wiring
    gap, but for a different gene than this issue covers, so it is left alone
    here rather than widened into.

  summary: Wire PIK3CA into its eponymous pathophysiology node
  details: |
    Issue #13130 reports this entry wiring none of its causal genes into the
    pathograph (0/1). The gene was PIK3CA, and the node it belongs on was the
    entry's own first node, PIK3CA Oncogenic Mutations, which already carried a
    somatic genetic_context and the luminal cell type but named no gene.

    The node now carries a genes: descriptor bound to hgnc:8975 (PIK3CA), read
    from cache/hgnc/terms.csv, and a molecular_functions: descriptor bound to
    GO:0046934 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity, the
    p110-alpha catalytic activity that produces PIP3. GO:0016303
    1-phosphatidylinositol-3-kinase activity was considered and rejected: it is
    a sibling under GO:0052742 with a different substrate (PI to PI3P), not the
    PI(4,5)P2 to PIP3 reaction p110-alpha catalyses. The modifier is GAIN_OF_FUNCTION rather than INCREASED
    because the node's own claim is constitutive activity independent of upstream
    receptor tyrosine kinase input, which is the qualitative case the CLAUDE.md
    decision tree reserves the unbound modifier for. The genetic_context gained
    functional_impact_category: GAIN_OF_FUNCTION and allele_type: missense
    alongside its existing variant_origin, so the block carries its own allele
    detail rather than existing only to hold the category; the node gained
    biological_scale: MOLECULAR. The molecular-function description is limited
    to what PMID:15647370 reports (elevated catalytic activity and constitutive
    AKT, S6K and 4E-BP1 phosphorylation) rather than the p85-release and
    membrane-affinity structural mechanisms, which are stated in the genetic:
    record's notes but cited nowhere in the entry.

    The molecular-function claim needed its own source: the existing evidence on
    the node is a clinical-trial abstract about mutation frequency. PMID:15647370
    (Kang, Bader and Vogt 2005) was fetched and cached; its abstract reports that
    the three hotspot mutants raise catalytic activity in in vitro kinase assays,
    graded IN_VITRO, and that sentence is quoted as the evidence for the binding.

    The gene-activity-grounding ratchet requires a newly wired gene to land on a
    node naming a molecular function, which is why the term was bound alongside
    the gene rather than afterwards. After the change the entry reports 1/1 causal
    genes wired. PR #13128 adds notes to this entry's Endocrine Resistance node;
    this change touches a different node so the two do not overlap.

    Checks: just validate passed; count-verified-snippets 46/46 across both
    files in the PR; validate-terms passed; list-gene-term-mismatches examined
    two bindings, both naming the gene they bind; check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms and the whole-KB snippet, title, grading, hyphen and
    coarse-phenotype gates all passed with no new findings;
    check-gene-activity-grounding against origin/main reported no new finding;
    check-cancer-origin still derives the luminal epithelial cell of mammary
    gland as the cell of origin. No deep-research provider was run: this is a
    gene-wiring edit on an existing entry, and the one new reference was found by
    a direct PubMed lookup.

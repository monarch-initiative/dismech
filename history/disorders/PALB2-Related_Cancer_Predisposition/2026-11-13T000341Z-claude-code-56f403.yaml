  details: |
    First review round on PR #17252, five blocking items. (1) Under-consumed references: the entry cited 10 of 33 newly cached PMIDs. It now cites 16, adding the TBCRC 048 expansion cohort (PMID:41604601, 24 germline PALB2 patients, ORR 75%, median PFS 9.4 months) which supersedes the 11-patient figures the description previously gave; PRECEDE pancreatic surveillance (PMID:42976359); post-resection HR mechanism (PMID:40749686) and the BRCA1-side coiled-coil assay (PMID:39673470) on the bridging node, which previously rested on a single background sentence; the Argentine recurrent allele (PMID:42011088) for the founder-allele claim the genetic notes already made; and first-line CDK4/6 inhibitor PFS in carriers (PMID:41713165) as a sequencing argument. The 17 cache files still uncited after that were removed with git rm, the cited list re-derived immediately beforehand as CLAUDE.md requires. (2) No platinum evidence existed: rather than cite a generic HRD-score sentence, the node was renamed from 'PARP-Inhibitor and Platinum Sensitivity' to 'PARP-Inhibitor Sensitivity' and the description now states that platinum sensitivity is not claimed because no cached source reports a platinum result in PALB2 carriers specifically. (3) Breast carcinoma frequency VERY_FREQUENT (80-99%) corrected to FREQUENT for a 53% absolute risk. (4) The 10-of-805 figure was a per-gene case fraction in an ascertained cohort recorded as a population prevalence band; the prevalence record was removed and the figure moved to genetic[PALB2].case_fractions with case_fraction_percent 1.2 and cohort_size 805. (5) Three tracked references_cache files (PMID_29922827, PMID_33471974, PMID_33471991) had been rewritten to a newer extraction version by a validation run and swept into the first commit by a broad git add; all three were reverted to their origin/main content, which is the #9963 bug rather than a change to commit. Suggestions taken: HP:0025318 Ovarian carcinoma and HP:0006725 Pancreatic adenocarcinoma replace the broader neoplasm terms, with both phenotype row names and every bare downstream target renamed to match; treatment_effect INHIBITS retargeted from the sensitivity node to the tumour node, since a drug exploits a sensitivity rather than inhibiting it; the uninformative GO:0005515 protein binding annotation was dropped; four Yang snippets no longer end on a truncated p-value. Three defects of my own were introduced during this round and caught by gates before pushing: a reference_title reconstructed from a truncated display instead of the cache, a snippet that was actually the cited paper's title, and a duplicate quote_role key; a fourth, a treatment target naming an ontology label rather than the node name, was caught by check-causal-targets. One snippet needed an ellipsis to bridge stripped confidence intervals. Re-validated: validate-disorders 42/42 snippets and 42 titles with 0 issues, plus validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-enum-values, check-logical-rules, check-name-collisions, check-qualifier-terms, check-block-scalar-comments, check-gene-namespaces, check-gene-activity-grounding and check-cache-order.

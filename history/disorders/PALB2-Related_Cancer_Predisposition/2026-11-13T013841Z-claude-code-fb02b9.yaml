  summary: Correct the olaparib response figures and drop two unsupported claims
  details: |
    Three defects found on a re-read after the round-2 approval, all in claims the cached records do not support. First, the PARP-inhibitor therapy description gave only the initial TBCRC 048 figures, an 82% objective response rate and a 13.3-month median progression-free survival from PMID:33119476, while the PMID:41604601 evidence explanation beneath it said those were the figures the description gave; the expansion-cohort figures the explanation meant, a 75% objective response rate and a 9.4-month median progression-free survival in 24 germline PALB2 patients, were nowhere in the description. The description now gives both series and the explanation describes the evidence rather than the entry. Second, both the treatment description and the PARP-Inhibitor Sensitivity node called the expansion-cohort figures more reliable, and one explanation called the initial arm an 11-patient estimate; neither the reliability judgement nor the number 11 is in either cached abstract, which reports the initial trial's cohorts only as cohort 1 and cohort 2 with 33% and 31% response rates across all genes. Both now say only that the expansion cohorts are the larger PALB2 series. A sentence naming talazoparib as the other PARP inhibitor used in genotype-directed breast cancer treatment was also removed: no cached source supports it for PALB2, the entry's therapeutic_agent lists olaparib alone, and talazoparib's breast cancer indication is germline BRCA1/2. Third, the pancreatic surveillance description said the programme is offered to PALB2 carriers with a family history of pancreatic cancer; the phrase family history does not occur anywhere in the cached PRECEDE record, so the eligibility qualifier is dropped and the row now says what the study says, that PALB2 heterozygotes are among the high-risk individuals surveilled. The 9% share that description already gave had no snippet of its own and now carries one, the PRECEDE sentence reporting PALB2 at 9% of 2,085 eligible participants, which also fixes the description's looser wording about the surveilled population. The entry validates with 43 of 43 snippets verified, up from 42 with the added evidence item. The branch was also rebased onto origin/main: CI's test (3.13) went red on PR #17245 at the same merge base, on two ref-mode gates whose findings were all in Hereditary_Spastic_Paraplegia_48 and Spinal_Muscular_Atrophy_Progressive_Myoclonic_Epilepsy, entries repaired on main after that merge base, so this branch carried the same exposure.

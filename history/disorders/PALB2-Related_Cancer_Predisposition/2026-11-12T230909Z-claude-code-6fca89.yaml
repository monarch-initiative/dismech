  summary: 'Create: PALB2-Related Cancer Predisposition'
  details: |
    De novo curation of MONDO:0700272 from one OpenScientist deep-research report (research/PALB2-Related_Cancer_Predisposition-deep-research-openscientist.md; 35/35 references resolved, confabulation_rate 0.0) plus the ClinGen Hereditary Cancer GCEP Definitive assertion and the consortium studies it names. just preflight-dr returned PASS (PALB2 mentioned 133 times). Scoped to the monoallelic autosomal dominant cancer predisposition only, following ClinGen's explicit lumping of breast, ovarian and pancreatic cancer into this entity and its separate curation of Fanconi anemia complementation group N (MONDO:0012565); the biallelic paediatric phenotype is not curated here and is already covered in kb/disorders/Fanconi_Anemia.yaml. The report framed both zygosities as one disease with a dual inheritance architecture, which was not followed. Three defects in the report were found and corrected: it bound HP:0100013 (Neoplasm of the breast) to two different concepts at once (triple-negative enrichment and male breast cancer); its labels for HP:0100615 (Ovarian neoplasm, not Ovarian carcinoma) and HP:0002894 (Neoplasm of the pancreas, not Pancreatic carcinoma) were wrong; and it attributed the quote 'PALB2 is a mediator of BRCA2-RAD51 DNA break localization' to PMID:39745016, which does not contain it, so that evidence item was replaced with a sentence that does. One MGI identifier written from memory (MGI:1914487) resolved to Cul4a and was replaced with MGI:3040695 after confirming mouse Palb2 at the Alliance; five reference_title values initially taken from the report's abbreviated evidence table were replaced with cached titles after check-reference-titles failed them. Validated with just validate-disorders (33/33 snippets, 33 titles, 0 issues), validate-terms, check-gene-namespaces-online, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-enum-values, check-duplicate-keys, check-logical-rules, check-name-collisions, check-qualifier-terms and check-block-scalar-comments.

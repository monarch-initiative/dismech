  summary: 'Review round 1: reconcile patient counts, add two uncited reports'
  details: |
    Answered the three IMPORTANT findings on PR #11725 in one push.

    Finding 1, stale prose. The entry was drafted against two patient reports and later expanded to four without the prose being swept, so nine separate passages still described a two-patient literature while prevalence.notes said five patients in four reports. Reconciled all of them. The count is now five reports and at least seven patients, because finding 2 added a report the entry had missed.

    Finding 2, PMID:27623147 (Guarani 2016, eLife). Cached by this PR and cited nowhere. It is an independent sibling pair from a different group in the same year as the founding report, verified as a separate family by disjoint author lists and separate publication. Added as replicating evidence on the MICOS assembly node, and for its specificity control showing that over-expression of other MICOS subunits does not rescue assembly.

    Finding 3, PMID:27479602 (Anand 2016, CRISPR MIC13 knockout). Added as an experimental model with three mechanism links. Two RECAPITULATES for subcomplex assembly failure and cristae junction loss. One FAILS_TO_RECAPITULATE for the combined respiratory chain deficiency, because the knockout leaves respiratory chain assembly intact and reduces respiration only moderately. That negative result contradicts the simplest reading of this entry's causal chain and is recorded as such rather than omitted.

    Also took the PMID:34271005 suggestion, but not for the reason given: that paper concerns GxxxG and WN motifs, not the RDSWN motif, so it is cited for the bridging function and MIC10-subcomplex destabilization instead.

    Four things were found by reading the sources rather than by acting on the review, and they
    matter more than the findings did.

    Fetching PMID:27623147 upgraded its cache from abstract to full text, and the full text
    contradicts the entry. It documents optic atrophy, sensorineural deafness and acquired
    microcephaly in 2016, all three of which the entry described as contributed by the 2026
    report. So the entry's claim that the phenotype widened considerably with the most recent
    report was wrong; what widened was which reports the entry had read. Corrected in all
    three phenotype descriptions and stated as a correction in notes.

    The same full text reports mild cardiac hypertrophy on echocardiography in a named
    patient. The review suggested curating cardiac hypertrophy from PMID:32749073 instead, but
    that mention is in its introduction summarising prior literature, not an observation in
    its own patient. Curated from the primary observation, with the weaker source's status
    recorded in notes.

    Guarani et al.'s patients have non-consanguineous parents, where the other families are
    consanguineous. Recorded in inheritance, because a negative family history does not argue
    against this diagnosis.

    Patients were identified in prose by nationality (the Japanese patient, the Tunisian
    patient). None of those nationalities is stated in any cached source. Replaced throughout
    with author-year keys taken from the cache frontmatter.

    Declined, with reasons given in the PR reply: the cofactor treatment regimen (no cited
    report describes treatment of any kind, and its NCIT codes came from a deep-research
    report rather than a lookup), pruning the uncited caches (several are the residue of the
    MRPS34 report that preflight-dr correctly rejected, and that footprint is worth keeping),
    and two general cell-biology mechanism nodes.

    Validation: 55/55 snippets verified (was 41/41), schema and term validation pass,
    duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, title-snippets,
    snippet-grading and reference-titles all clean.

  summary: 'Create: COXPD37 / MICOS13 deficiency (MONDO:0032679)'
  details: |
    De-novo curation from claim issue #11716. Built around the fact that the lesion is architectural rather than enzymatic: no respiratory complex subunit is defective, but without MICOS13 the MICOS complex cannot be assembled, cristae junctions are lost, and the combined OXPHOS deficiency follows from the membrane geometry collapsing. Recorded the assembly claim in its precise form - loss of a defined MIC10-MIC26-MIC27-QIL1 subcomplex - rather than as a general statement that MICOS is disrupted. The lentiviral complementation in the patient's own fibroblasts is the strongest evidence in the entry and is curated as a RESCUES model link, since it establishes causation rather than correlation while controlling for genetic background. Curated the mtDNA depletion finding and the classification question without resolving it: the two published patients were classified differently (combined OXPHOS deficiency vs mtDNA depletion syndrome) on the strength of what each group measured, and only one assayed copy number, so the edge to the depletion node is typed INDIRECT_UNKNOWN_INTERMEDIATES. Two imperfect ontology bindings recorded in place rather than hidden: hepatopathy bound to HP:0001399 Hepatic failure and psychomotor retardation bound to HP:0002361 Psychomotor deterioration, both more specific than the sources support, each with the mismatch stated in the phenotype's notes. The OpenScientist run failed twice before succeeding: once on the 3600 s provider timeout, once returning a report about MRPS34 while printing this entry's MONDO ID in its own header beside a non-matching OMIM number, which just preflight-dr failed outright. The third run substantially improved the entry, surfacing the founding 2016 report the initial literature search had missed and with it the 3-methylglutaconic aciduria that is the disease's most useful diagnostic finding, human liver cristae ultrastructure, the selective loss of MIC13 and MIC10 with MIC60 retained, and a fourth patient replicating the mtDNA depletion. All verified against primary sources before use. One claim in the first draft was falsified and corrected in place: it said no patient liver ultrastructure had been published. Validated: linkml-validate, linkml-term-validator, 41/41 snippets verified, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms.

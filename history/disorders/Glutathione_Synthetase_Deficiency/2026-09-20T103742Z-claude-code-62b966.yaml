  details: |
    Genetics pass for issue #12198 (d2g wiring-009). GSS, the only gene MONDO records for either
    subtype, was already present and already bound onto the "Glutathione synthetase molecular function
    deficiency" node, so the entry needed no new literature. Added genes: GSS to both has_subtypes rows

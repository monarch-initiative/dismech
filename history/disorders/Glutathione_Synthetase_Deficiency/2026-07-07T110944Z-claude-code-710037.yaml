  summary: 'Create: Glutathione Synthetase Deficiency (WP-006)'
  details: |
    Initial curation of Glutathione Synthetase Deficiency (GSS, hgnc:4624) as the first entry of IEMbase metabolic package WP-006 (issue 5561). Anchored to umbrella MONDO:0017909 with two structured subtypes: With 5-Oxoprolinuria (systemic; MONDO:0009947 / OMIM:266130) and Without 5-Oxoprolinuria (mild; MONDO:0009284 / OMIM:231900). Mechanism: GSS deficiency -> generalized glutathione deficiency -> oxidative erythrocyte injury conforming to the hemolytic anemia erythrocyte destruction mechanism -> hemolytic anemia in all forms; loss of feedback inhibition of gamma-glutamylcysteine synthetase -> 5-oxoproline overproduction -> 5-oxoprolinuria and metabolic acidosis in systemic forms; progressive CNS dysfunction and recurrent bacterial infections in the severe form. Evidence: PMID:17397529, PMID:9215686, PMID:15717202, PMID:11445798, PMID:37050856. All evidence snippets verified as exact substrings of fetched abstracts; schema and term validation pass. Flagged that the IEMbase seed conflates OMIM for the two subtypes and that the GPX4 row 2.1.06.01 short-aliases to ACTA2-based Multisystemic Smooth Muscle Dysfunction Syndrome (NEC risk).

  details: |
    Took the four optional suggestions left on the round-1 approval. None blocked merge; two were defects the round-1 push itself introduced.

    PMID:40448120 added to the top-level references block. Round 1 completed that block to the eight PMIDs cited at the time and then, in the same push, added the CCDC22 differential citing a ninth. The block was left one short of the citations. Corrected, and the round-1 history record's claim of 'all 8 cited PMIDs' amended, since there are nine.

    The four motor phenotypes added in round 1 - Dysmetria, Dysdiadochokinesis, Dysarthria, Delayed Fine Motor Development - were isolated pathograph nodes: nothing targeted them, so they rendered disconnected from the chain that produces them. Connected as sequelae of Movement Impairment, the node whose content they are, citing the same verified sentence from PMID:33749590 that supports each phenotype individually. The edges are constituent rather than sequential - each sign is a component of the movement impairment, not a later consequence - and sequelae is the only slot available for that relation, so the shared evidence block says so explicitly rather than leaving a reader to infer a temporal claim.

    target_phenotypes added to Physical Therapy (HP:0100022 Abnormality of movement, HP:0003198 Myopathy) and Occupational Therapy (HP:0010862 Delayed fine motor development), matching the three treatments that already carried them.

    The round-1 record's other flagged count, 'all 60 evidence items', was accurate for the fill step but read as a total; reworded to 'the 60 evidence items that existed at the time'. The 72/72 figure in that record was correct and is unchanged.

    Validation: just validate-disorders passes; snippets verified against cached references with no new references added. validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms clean. No new ontology terms, so no cache change.

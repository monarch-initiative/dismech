  details: |
    De novo creation of the MRT43 (WASHC4/KIAA1033/SWIP) entry from the stub stubs/Intellectual_Disability_Autosomal_Recessive_43.yaml.

    LUMP/SPLIT: curated as a standalone Disease rather than a has_subtypes row on the class-level entry Autosomal_Recessive_Non-Syndromic_Intellectual_Disability. MONDO:0014354 is a leaf (no descendants, checked against the local MONDO SQLite) with a single causal-gene assertion RO:0004003 HGNC:29174. The class-level entry's own notes declare its has_subtypes rows to be non-exhaustive exemplars (WASHC4 is not among them) and state that a Grouping treatment is blocked until MRT-series members exist as separate Disease entries. The entry does NOT assert pathway convergence with TRAPPC9/TRAPPC6B/TBC1D23/CC2D1A, and makes no NF-kB claim for WASHC4, so it does not contradict the class entry's 'post-hoc organising themes, not a claim of pathway convergence' framing.

    DEEP RESEARCH: provider claude_code (falcon returns HTTP 402 in this environment; no substitution was made by hand). Report research/Intellectual_Disability_Autosomal_Recessive_43-deep-research-claude_code.md, 319s, 16 web searches. reference_validation: 7/7 resolved, 0 unresolved, confabulation_rate 0.0, quotes 1/1 valid, 6/7 on topic. term_validation: needs_review true, driven by a single mislabelled_terms entry for MONDO:0014354 whose reported labels are the parsing artifacts 'MONDO' and 'EBI OLS'; no unresolved_terms, 0 not_found, 0 obsolete. just preflight-dr against MONDO:0014354 returned PASS (WASHC4 mentioned 37 times; OMIM 615817 matches).

    CORRECTION TO THE DR REPORT: the report attributes the founding MRT43 description to Najmabadi et al., Nature 2011 (PMID:21937992). That is wrong. The founding WASHC4 report is Ropers et al., Hum Mol Genet 2011 (PMID:21498477) - the paper that describes the consanguineous pedigree, the SWIP variant and the WASH-complex destabilisation, and which the eLife knock-in mouse paper cites as the source of the p.Pro1019Arg allele. PMID:21937992 is not cited in the entry, since no verified quote from it names KIAA1033/WASHC4. This correction is recorded in the entry notes.

    NAMED ENTITY CONFUSION: WASHC5/strumpellin (Ritscher-Schinzel/3C, SPG8), WASHC3 (2025 short-stature/dysmorphism syndrome, PMID:40129681), CCDC22, and VPS35/retromer are all adjacent to this gene. WASHC5 and WASHC3 are curated under differential_diagnoses rather than being allowed to leak into the phenotype set. Cell-biology citations (PMID:20498093, PMID:36995008) are used only for statements about SWIP/KIAA1033 or about the complex containing it.

    RETROMER FRAMING: the entry deliberately does not describe MRT43 as a retromer disorder. PMID:36995008 shows SWIP itself provides a retromer-INDEPENDENT membrane anchor via phosphoinositide binding, so the chain carries a separate node for loss of that anchor alongside the FAM21-VPS35 route.

    EVIDENCE: 9 references, all fetched with just fetch-reference and all snippets extracted programmatically from the cached records. One eLife sentence was dropped because the cached full text renders it with a missing space ('SWIPP1019Rresults'); a different, clean sentence from the same paper was substituted rather than quoting the mangled form. treatments carry no evidence by decision - no treatment study, guideline, trial or GeneReviews chapter exists for WASHC4 - recorded in the mrt43_no_therapeutic_evidence discussion and in per-treatment notes. The medRxiv preprint PMID:38712155 (WASHC4 rare-variant association with abnormality of speech or vocalization) was read and deliberately not cited: it is a cohort burden association, not a statement about MRT43 patients.

    VALIDATION: just validate PASS; just validate-terms PASS; just count-verified-snippets 60/60; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK; just validate-disorders PASS with 60/60 snippets verified. just qc was not run (exceeds the tool timeout).

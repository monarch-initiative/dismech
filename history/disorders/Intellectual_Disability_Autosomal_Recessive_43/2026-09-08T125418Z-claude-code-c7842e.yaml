  summary: 'Review round 1: reference titles, motor phenotypes, variants, treatment
    split'
  details: |
    Answered the round-1 CHANGES_REQUESTED review in a single push.

    Blocking finding 1: filled reference_title on all 60 evidence items, copying each title verbatim from the references_cache frontmatter rather than from the review's table. Two of the seven titles in that table diverge from the cache (PMID:20498093 and PMID:40129681) and one cited PMID (PMID:30010465) is absent from it; the cache is the repository's authority for a title, so the entry follows the cache and records the divergence in notes (14).

    Finding 2: the Developmental and Educational Intervention treatment was bound to NCIT:C15302 Physical Therapy while describing developmental, educational, speech and physical support. Split into four treatments - developmental/educational support rebound to NCIT:C15315 Rehabilitation with the specificity in preferred_term, Speech and Language Therapy on NCIT:C159273, Physical Therapy on NCIT:C15302, Occupational Therapy on NCIT:C121351.

    Finding 3: added four specific motor phenotypes off one verified sentence in PMID:33749590 - Dysmetria HP:0001310, Dysdiadochokinesis HP:0002075, Dysarthria HP:0001260, Delayed Fine Motor Development HP:0010862. No frequency asserted on any of them: the source quantifies motor symptoms in aggregate, not per sign.

    Finding 4: moved the four reported WASHC4 alleles out of free-text notes into a structured variants block, each with its own verified snippet. The 2022 sibship's allele is recorded as unnamed because the abstract states homozygosity without giving the change. The mouse-knockout embryonic-lethality constraint is recorded in genetic.notes explicitly as an unverified lead: it is carried by MGI/IMPC phenotype annotations, no cached reference asserts it, and this repository has no MGI or IMPC ingest to quote.

    Finding 5: added Congenital Absence of the Internal Carotid Artery. The review proposed HP:0011933, which resolves to Elongated superior cerebellar peduncle and was not used. HPO has no agenesis/aplasia term for this artery - HP:0005290 asserts hypoplasia and HP:0031604 is the bony canal - so the accurate parent HP:3000062 is bound with the finding in preferred_term.

    Suggestions taken: completed the top-level references block to all 8 cited PMIDs (6); added an audiological assessment diagnosis entry with a free-text preferred_term, since no NCIT clinical action term for it is reachable from NCIT:C25218 (8); added the CCDC22-related attenuated 3C differential from the already-cached PMID:40448120 (9); renamed Progressive Movement Impairment to Movement Impairment across all five references, since progression is established in the mouse and not in the patients (10).

    Suggestion declined: UBERON:0000955 brain is left broad rather than narrowed to primary motor cortex (7), because the endo-lysosomal phenotype is reported in cultured neurons and in vivo without regional restriction while only the lipofuscin and caspase-3 findings are localised. Recorded in notes (13).

    Validation: just validate passes; snippets 72/72 verified against cached references, up from 60/60. validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all clean. Two new HPO terms (HP:3000062, HP:0010862) resolved and were added to the term and enum caches by the validator.

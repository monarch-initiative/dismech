  summary: 'Create: C1s_Deficiency'
  details: |
    New entry for hereditary C1s deficiency, the autosomal recessive classical
    complement pathway defect caused by biallelic loss-of-function C1S
    variants.

    Term choice. The claim issue named MONDO:1060176 "systemic lupus
    erythematosus related to C1S", which MONDO defines as SLE caused by C1S
    variation and places under systemic lupus erythematosus. MONDO also has
    MONDO:0013419 "complement component C1s deficiency" (OMIM:613783), which
    covers the whole deficiency, including patients with infections only,
    other autoimmunity or no symptoms. The entry is bound to MONDO:0013419 and
    maps MONDO:1060176 as skos:relatedMatch, following the precedent of
    C1Q_Deficiency and its gene-specific SLE classes. Both stubs
    (Complement_Component_C1s_Deficiency and
    Systemic_Lupus_Erythematosus_Related_To_C1S) are removed.

    Scope. C1S-caused deficiency only. Combined C1r/C1s families with a
    primary C1r defect (PMID:737019, PMID:7939409) were read and not used for
    C1s-specific claims; C1r deficiency is listed as a differential diagnosis.
    Heterozygous C1S gain-of-function variants (periodontal Ehlers-Danlos
    syndrome) are a differential, not a subtype.

    Sources. Primary case and family reports were found by PubMed search and
    are the basis for the phenotypes and variants: PMID:1575792, 9856483,
    9973493, 11390518, 18062908, 19155518, 37209807 and 38469558 (full text
    cached, used for treatment and laboratory detail). Reviews of early
    classical pathway deficiency (PMID:26913032, 26941740, 35648651,
    20476965, 12496511, 6433145, 39294906, 41421099) support the shared
    mechanism and are marked REVIEW_SYNTHESIS, with directness INDIRECT where
    the step is inferred for C1s rather than shown. PMID:27648302 (in vitro
    C1s cleavage of HMGB1) and PMID:19302245 (classical pathway dependence of
    apoptotic cell uptake) support the two autoimmunity branches. The ICGN
    congenic mouse (PMID:29550838) is recorded as recapitulating C1s absence
    and failing to recapitulate autoimmunity. PMID:20191570 (rituximab for
    lupus nephritis) has no cached abstract, so it is cited only through the
    2023 report's account of it.

    Deep research. One OpenScientist report
    (research/C1s_Deficiency-deep-research-openscientist.md) was used as
    leads: 18/18 references resolved, 0 off topic. Its term section flags
    HP:0003261, HP:0001970 and HP:0005356 as naming different concepts from
    the report's text; none of them was bound. just preflight-dr could not run
    because the local MONDO build is absent; the report names only C1S and
    HGNC:1247, consistent with the entry.

    Validation. just validate, validate-terms, count-verified-snippets (all
    snippets verified), check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-genereviews (no chapter) and
    validate-disorders were run on the file. Four rare phenotypes
    (hemophagocytic syndrome, seizure, reduced consciousness, Kikuchi-Fujimoto
    lymphadenitis) are deliberately left without a causal edge because no
    source proposes a mechanism for them.

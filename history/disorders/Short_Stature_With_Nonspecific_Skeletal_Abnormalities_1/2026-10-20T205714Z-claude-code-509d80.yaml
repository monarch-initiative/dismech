  details: |
    Added reference_title to all 51 existing evidence items, copied from the references_cache title frontmatter by scripts/backfill_reference_titles.py. Committed a claude_code deep-research report; it ran two web searches and opened no primary papers, so it was used only as a theme cross-check. Its themes (short stature, disproportion, short metacarpals, delayed bone age, AMD1 and SNSK2 as separate entities, growth hormone, vosoritide) are covered by the entry, except delayed bone age, now added. Added two phenotypes from PMID:35741827: Delayed Bone Age (HP:0002750; 9 of 12 probands delayed, 3 advanced) and Increased Body Mass Index (HP:0031418; single-cohort report, with the authors' own caveat in the description). Noted the delayed bone age in the ACAN differential. In the SGA phenotype, dropped 'mainly for length', which PMID:30602027 reports for all eight diagnosed SGA patients across six genes rather than for NPR2 carriers. Replaced the SGA edge snippet with the NPR2-specific gene count from the same abstract. Expanded the vosoritide target_mechanisms explanation to say the MAPK inhibition follows from NPR-B activation, so the ACTIVATES edge does not read as a contradiction. Validated with just validate, validate-terms, count-verified-snippets (53/53) and check-reference-titles. preflight-dr could not run because the local MONDO build is absent.

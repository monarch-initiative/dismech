  summary: 'Create: Short Stature With Nonspecific Skeletal Abnormalities 1 (NPR2
    heterozygous)'
  details: |
    New Disease entry for SNSK (MONDO:0014551), the heterozygous NPR2 loss-of-function counterpart of the existing Acromesomelic_Dysplasia_Maroteaux_Type entry. The stub had no MONDO descendants and a single causal gene, so entry_type is DISEASE. Pathograph: heterozygous NPR2 variant -> reduced CNP-stimulated NPR-B cGMP production (haploinsufficiency, ER retention, dominant negative) -> growth-plate chondrocyte differentiation deficit -> reduced endochondral longitudinal bone growth -> short stature, progressive height deficit, mild disproportion, short metacarpals, clinodactyly, SGA. Disproportion carries REFUTE items from two family studies that reported proportionate stature. GH treatment carries both supporting and refuting cohort evidence; vosoritide is recorded as investigational from the phase 2 basket trial publication. ClinicalTrials.gov was unreachable from the session, so no clinical_trials record was added. Validated with just validate, validate-terms, count-verified-snippets (51/51), check-entity-refs and check-causal-targets.

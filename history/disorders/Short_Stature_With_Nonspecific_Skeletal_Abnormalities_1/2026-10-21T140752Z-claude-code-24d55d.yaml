  summary: Add Npr2 mouse animal models linked to the pathograph
  details: |
    Added three animal_models records with modeled_mechanisms links, following the optional suggestion in the PR 15055 review that the Npr2 mouse was cited only as edge evidence. Npr2 pwe/pwe (L313X; PMID:23065701): PARTIALLY_RECAPITULATES the growth-plate chondrocyte node, with readouts for reduced proliferative and hypertrophic zones and increased activated ERK1/2; RESCUES the endochondral bone-growth node through MEK inhibitor rescue of fetal tibia explants (graded IN_VITRO). Npr2 cn/cn (PMID:15722353): PARTIALLY_RECAPITULATES the CNP-stimulated cGMP node, with an ABOLISHED cGMP readout from cultured chondrocytes (IN_VITRO). GC-B knockout (PMID:15572448): PARTIALLY_RECAPITULATES the endochondral bone-growth node. All three are homozygous models of acromesomelic dysplasia, Maroteaux type, so every link carries a POPULATION_MISMATCH divergence (QUALIFYING) for the allele-dose difference from this heterozygous disease. No phenotype for heterozygous Npr2 mice is asserted: the available abstracts report none, and full texts were not retrievable (PMC4817088 does not permit XML download). PMID:26014585 (cartilage-specific GC-B knockout) was read but not used. Validated with just validate, count-verified-snippets (63/63), model-scale-audit --strict, and the model-link pytest subset (127 passed).

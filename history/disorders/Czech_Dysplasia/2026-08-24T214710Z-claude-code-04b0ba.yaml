  summary: 'Create: Czech dysplasia'
  details: |
    New entry for Czech dysplasia / spondyloepiphyseal dysplasia with metatarsal shortening, MONDO:0012206, an autosomal dominant type II collagenopathy caused by the single recurrent COL2A1 c.823C>T p.Arg275Cys allele. Curated from five primary papers located independently in PubMed. The Perplexity deep-research report returned only two PMIDs in its body and one of those is about the mechanistically unrelated CCN6/WISP3 progressive pseudorheumatoid dysplasia, a name that is also a listed synonym of this disorder; that citation is not used anywhere in the entry and the naming hazard is recorded in the notes. NEC preflight returned SKIP because MONDO records no causal gene for this term, so the manual OMIM check was run instead and matched exactly at 609162 with COL2A1 dominating gene mentions 69 to 1. Three curation judgements are recorded explicitly: the allelic-exclusivity claim is curated with its hedge intact, PARTIAL for the 'possibly caused exclusively' wording and SUPPORT for the independent 700-patient variant review; the collagen fibril node carries mechanism_confidence HYPOTHETICAL with an INDIRECT_UNKNOWN_INTERMEDIATES edge because no cited source reports fibril structure or biochemistry from a patient carrying this allele; and conformance to osteoarthritis_cartilage_degradation is declared at the clinical endpoint node only, not at the intermediate catabolic-chondrocyte and matrix-enzyme nodes, which no source measures in this disorder. Validated with just validate for schema and terms, 21/21 snippets verified against cached references, and the five offline CI gates clean against origin main.

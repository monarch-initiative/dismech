  summary: 'Review round 1: consume cached R275C biophysics, rescope knowledge gap'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR 9419. The substantive finding was correct and is acted on: PMID:29439465 was already in references_cache and studies this exact substitution under mature-helix numbering as R75C, which is R275C in precursor numbering, and the paper names it as the Czech dysplasia allele. It reports correct folding by circular dichroism, retained trypsin resistance, a 2.5 degree Celsius lower melting temperature, normal ER to Golgi trafficking, no XBP-1 splicing and no caspase-3 activation, concluding the allele might act predominantly via extracellular interference. Three evidence items were added to the fibril node, one of them a REFUTE item against an intracellular-retention mechanism. The node keeps mechanism_confidence HYPOTHETICAL but its notes now state the narrower true reason, that patient-cartilage fibril and matrix state is unmeasured, rather than implying no biophysics exists. The discussion was rescoped and renamed accordingly, its rationale rewritten around the extracellular-interference conclusion, the ER-stress reroute removed from a decision criterion because the paper argues against it, and a third experiment added on aberrant disulfide bonding of the introduced cysteine. Separately, an ORPHA:137678 record was built with just structured-rebuild-orphanet and cited as evidence that the three negative features, absent ophthalmologic, cleft palate and height anomalies, are part of the Orphanet disease definition rather than incidental, and PMID:31021589 was added to references carrying only the GeneReviews provenance tag and deliberately not mined for snippets since its cached record never mentions Czech dysplasia. Two review findings were not actioned and are answered on the PR instead: the Orphanet bulk XML products contain no management section at all, and the cached ORPHA:137678 record carries no Epidemiology section, so the quoted treatment and prevalence figures come from the orpha.net web narrative and are not quotable from any citable cached source. Revalidated: schema and terms pass, 26/26 snippets verified, offline gates clean, zero dangling entity refs.

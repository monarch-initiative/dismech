  summary: 'Create: Aminoglycoside-Induced Hearing Loss (MT-RNR1)'
  details: |
    New entry for the Mendelian MT-RNR1-dependent form of aminoglycoside ototoxicity (MONDO:0010799). Seven pathophysiology nodes in one chain from the 12S rRNA decoding-site variant through bacterial-like conformation, drug binding, impaired mitochondrial translation, hair cell oxidative injury and death, to permanent bilateral loss. The exposure is modelled as an environmental entry with influences_mechanisms TRIGGERS onto the drug-binding node, so the second hit is a pathograph node rather than prose. Gene assignment needed a judgement call: MONDO records TRMU as the RO:0004003 causal gene, and the preflight therefore flagged MT-RNR1 dominance as possible entity confusion, but OMIM 580000 - the entity MONDO maps to - is the MT-RNR1 locus and matches between MONDO and the report, so MT-RNR1 is curated CAUSATIVE and TRMU MODIFIER. An INTERPRETATION discussion records the ascertainment conflict between pedigree penetrance (14% excluding exposure) and an unbiased birth cohort finding no hearing difference in carriers at 44-45, and notes that the population negative strengthens rather than weakens the case for pre-emptive genotyping. GeneReviews PMID:20301595 is tagged and mined across all four sections. Nine of nineteen suggested CURIEs were wrong or obsolete and were corrected against OLS, including CHEBI:9334 offered as streptomycin, which is sulfasalazine. The aminoglycoside exposure term is deliberately left unbound: ECTO:9002231 exists in OLS but not in the local build validation uses, and every antibiotic-exposure term the local build carries is agrochemical. 22/22 snippets verified and independently re-checked as raw substrings.

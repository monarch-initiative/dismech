  summary: 'Review response: CPIC guideline, structured variants, model mismatch'
  details: |
    Response to the first review round. Added the CPIC guideline PMID:34032273, which the entry needed and which the deep-research artifact's own Key Caveats for Curators had told me to cite - the one explicit curation instruction in that section I had not followed. It now carries the prescribing recommendation itself and the cascade-to-the-matriline sentence on the avoidance treatment. Added a structured variants list to the MT-RNR1 genetic entry covering m.1555A>G, m.1494C>T and m.1095T>C; the third is CPIC-actionable and was absent entirely, which made the actionable-variant list incomplete for prescribing, and the variants slot had been left unused so nothing was machine-queryable by variant. Added a HUMAN_MODEL_MISMATCH discussion explaining why the entry carries no animal model: the lesion makes a human mitochondrial rRNA resemble a bacterial one, species diverge at that sequence, and the research sweep did not surface a knock-in line reproducing the genotype-specific susceptibility - phrased as a limit of the search rather than a demonstrated absence. Added a notes sentence recording that vestibulotoxicity is deliberately out of scope as drug- and dose-dependent toxicity. 27/27 snippets verified and independently re-checked as raw substrings.

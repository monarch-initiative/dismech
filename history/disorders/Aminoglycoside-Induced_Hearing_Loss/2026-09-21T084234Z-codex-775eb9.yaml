  details: |
    Read all original cited sources and matching deep research, recovered the full GeneReviews chapter and genuine full experimental articles, and reviewed current CPIC/CERSI guidance plus PALOH. Replaced inevitable drug-triggered deafness and a direct universal oxidative-death chain with variant-specific susceptibility, distinct decoding-accuracy and synthesis nodes, and explicitly hypothetical cochlear bioenergetic links. Corrected carrier-versus-disease prevalence, selected-cohort screening endpoints, TRMU modifier scope, genotype testing and surveillance, and experimental model limitations. Added contextual phase I apramycin evidence without claiming carrier safety. Peer audits independently checked CPIC/PALOH and the new fish/explant studies. Reference caches were generated through fetch-reference; no frozen dataset cache was accessed. Authoritative schema/term/snippet validation and repository quality gates are recorded with the review PR.

  summary: 'LOINC tranche G: high-frequency audiometry, no generic band'
  details: |
    Added LOINC:89015-2 (panel) plus the 4000/6000/8000 Hz per-ear threshold codes to the existing Clinical audiologic and exposure assessment row. Deliberately did NOT bind the 500/1000/2000 Hz codes or the generic WHO/GBD better-ear-average grading used on other hearing-loss entries in this campaign: the entry's own cited guidance is that conventional speech-frequency testing misses aminoglycoside ototoxic injury, which characteristically begins at the ultrahigh frequencies, so the 500-4000 Hz four-frequency average this campaign's generic scheme grades would misrepresent what is diagnostic here. Part of LOINC tranche G batch 14 (projects/LOINC_DIAGNOSTICS.md).

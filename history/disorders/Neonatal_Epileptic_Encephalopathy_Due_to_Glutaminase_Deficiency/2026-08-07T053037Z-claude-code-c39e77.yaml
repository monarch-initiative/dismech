  summary: 'Create: Neonatal Epileptic Encephalopathy Due to Glutaminase Deficiency
    (GLS, DEE71)'
  details: |
    Created the biallelic loss-of-function GLS entity (MONDO:0032678 / OMIM 618328 / Orphanet:557064), discharging the split decision recorded in the Global_Developmental_Delay_Progressive_Ataxia_and_Elevated_Glutamine entry's resolution_note (PR #7138), which stated the severe neonatal-onset form was to be modeled as a separate entry. Sources: PMID:30575854 (JAMA Neurol 2019, four infants from two families, the original report), PMID:41865506 (Mol Genet Metab 2026, three further infants, functional confirmation of complete enzymatic deficiency plus a fibroblast organelle-stress and bioenergetic phenotype), PMID:39559284 (2024 single-neonate case report), PMID:31603991 (review of inborn errors of glutamate metabolism). Curated two competing mechanistic_hypotheses rather than a single settled chain: glutamate_deficiency (ALTERNATIVE, the original framing) and glutamine_neurotoxicity (EMERGING, the urea-cycle-analogy model, which accounts for the cerebral edema that the deficiency model does not). Validation: schema, term and reference validation all passed; 46/46 snippets verified against cached references; weighted compliance 88.3 percent. HP:0003811 (Neonatal death) was dropped because it sits under Mortality/Aging, outside the PhenotypeTerm enum root; the fatal outcome is carried by a pathophysiology node and by prevalence notes instead.

  summary: 'Create: PPM-X Syndrome - MECP2 p.Ala140Val, MONDO:0010235'
  details: |
    De novo curation of MONDO:0010235 (PPM-X syndrome / MRXS13 / OMIM 300055; ORPHA:3077) as kb/disorders/PPM-X_Syndrome.yaml.

    NEC PREFLIGHT (mandatory for this target). MONDO:0010235 carries no definition text, so identity was anchored on three independent signals: the MONDO gene relation RO:0004003 HGNC:6990 (MECP2); the OMIM:300055 xref, corroborated inside PMID:20163734 and PMID:27465203; and the synonym list (PPM-X, Lindsay-Burn syndrome, MRXS13). All three converge on MECP2 p.Ala140Val, so the entity survives as separately curatable and is NOT obsolete or merged into fragile X. The predicted NEC attractor - fragile X syndrome (FMR1) - is excluded with primary evidence rather than assertion: the founding paper PMID:8651288 reports negative cytogenetic fragile sites at distal Xq, no CGG expansion at FRAXA/FRAXE/FRAXF, and Xq28 linkage (FMR1 is at Xq27.3). Two further traps were caught and documented in the entry notes: PMID:9222958 surfaces on a PubMed search for "PPM-X syndrome" and maps to the same Xq28 interval but explicitly describes a different family, and is cited nowhere; and MRX16, folded into MONDO:0010235 as a synonym, carries a DIFFERENT MECP2 allele (E137G, PMID:11309367) and is excluded from every A140V pedigree count here.

    DUPLICATE PREFLIGHT. No existing KB entry covers MONDO:0010235; no open or closed PR/issue other than #7710. Fragile_X_Syndrome.yaml, Rett_Syndrome.yaml, MECP2_Duplication_Syndrome.yaml and Autism_Susceptibility_to_X-Linked_3.yaml all exist separately and are kept strictly disjoint from this entry.

    DEEP RESEARCH. One Edison/falcon run (research/PPM-X_Syndrome-deep-research-falcon.md, 640s, 20 citations, artifact retained). It passed the gene-frequency NEC check decisively (MECP2 x70 vs FMR1 x1) and its evidence-boundary framing was sound, but it contributed no usable primary evidence and all three of its stated "key primary publications" failed verification: PMID:11951158, given as Klauck et al. 2002, is a German-language COPD exercise-training paper; PMID:11309367 is mislabelled as the original syndrome report when it is Couvert et al. 2001; and PMID:16966553 is offered as an A140V phenotypic expansion but reports a different MECP2 allele, 964C>T. The report also missed the central mechanism of the disorder, speculating about NCoR/SMRT while stating that no variant-specific mechanism is established, whereas the A140V-specific ATRX-recruitment defect is well documented in PMID:17296936. The entry was therefore built from primary literature retrieved directly from PubMed, with the DR report retained for provenance and used as a negative control. All of this is recorded in the entry notes.

    GENEREVIEWS BASELINE. No PPM-X-titled chapter exists; the applicable chapter is MECP2 Disorders (PMID:20301670), fetched, cached and tagged in the top-level references block. Its diagnosis, management, agents-to-avoid, surveillance and genetic-counselling content is mined; its Rett-specific clinical characteristics are deliberately excluded as belonging to a different entity.

    CONTENT. Six-node pathograph anchored on the A140V separation-of-function mechanism - preserved methyl-CpG binding and heterochromatic targeting with selective loss of ATRX recruitment - running through mouse-derived neuronal maturation and hippocampal excitability changes to the motor and neuropsychiatric arms. Seventeen phenotypes, MECP2 gene and variant blocks, X-linked semidominant inheritance, prevalence as CASES_IN_LITERATURE with no fabricated rate, two diagnosis entries, four differential diagnoses (fragile X, Rett, male MECP2 neonatal encephalopathy, ATR-X), four treatments, one animal model, one mechanistic hypothesis (atrx_mislocalization_model), and three discussions - two KNOWLEDGE_GAP and one HUMAN_MODEL_MISMATCH on the A140V mouse.

    PRE-PR RED TEAM. A fresh-context subagent review using the dismech-pr-review skill found and fixed, before any PR was opened: the MRX16/E137G allele error; an overstated "alone among MBD substitutions" claim contradicted by the very paper it rested on, since R133C also spares methyl-CpG binding; Orrico 2000 and Dotti 2002 miscounted as two independent pedigrees when they are one Siena family; an anatomically implausible hippocampal-to-corticospinal causal edge, re-parented to the neuronal-maturation node; the Siena n=6 denominator being four men plus two women rather than six males, which materially widens the documented carrier-female phenotype and is now reflected in the phenotype and inheritance blocks; an unreplicated VERY_FREQUENT band on distal amyotrophy, removed; four Discussion-section literature statements mis-tagged IN_VITRO, retagged OTHER; three cultured-neuron results mis-tagged MODEL_ORGANISM, retagged IN_VITRO; two title-only snippets replaced with substantive abstract sentences; a six-word mTOR fragment replaced with the full sentence; and a GeneReviews QT warning downgraded from SUPPORT to PARTIAL.

    VALIDATION. just validate passes (schema, terms and references); 103 of 103 snippets verified against cached references; just validate-terms passes. Thirteen new PMID cache files were created via just fetch-reference and are committed. No Orphanet evidence is cited: ORPHA:3077 is absent from references_cache and just refresh-orphadata fails on a checksum mismatch against the pinned data/orphadata/MANIFEST.yaml, and repinning would rewrite all 328 cached ORPHA files, which is out of scope for a curation PR.

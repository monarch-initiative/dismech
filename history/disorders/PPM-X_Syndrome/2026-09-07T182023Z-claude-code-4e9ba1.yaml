  summary: 'Phenotype review: PPM-X_Syndrome'
  details: |
    Reviewed all 18 phenotypes for snippet-claim consistency, HPO term optimality, and pathograph connectivity. Snippets verified in whole-abstract context against cached sources (founding Lindsay 1996 paper, Siena/Dotti 2002, Belgian Lambert 2016, Venkateswaran 2014 female case, GeneReviews); no wrong-disease or out-of-context quotes found. Fixed nine ghost 'Marked PARTIAL' explanations left over from the removed supports:PARTIAL enum value by adding directness: INDIRECT and rewording (two in phenotypes, others in genetic/diagnosis/treatments/discussions). Three term rebinds: Distal Amyotrophy HP:0003693 to HP:0008944 Distal lower limb amyotrophy (claim is legs-specific 6/6), Dystonia HP:0001332 to HP:0002451 Limb dystonia (dystonic hand movements), Developmental Regression HP:0002376 to HP:0034332 Cognitive regression with phenotype renamed Cognitive Regression (reported loss was adolescent cognitive function, not early milestones). Deliberately kept HP:0002313 Spastic paraparesis + clinical_course PROGRESSIVE over HP:0007020 Progressive spastic paraplegia (sources say paresis, not plegia). Connectivity raised 0/18 to 15/18 by adding summary downstream edges from the two existing ORGANISM-scale arm nodes (Progressive Corticospinal and Extrapyramidal Dysfunction: 8 motor phenotypes; Cognitive and Neuropsychiatric Dysfunction: 7 cognitive/psychiatric phenotypes); edges carry descriptions and lean on node-level evidence already quoting the Siena counts, Belgian replication, and founding description. Left unexplained on purpose: Macroorchidism (no proposed mechanism; existing KNOWLEDGE_GAP now also attaches_to phenotypes#Macroorchidism), Microcephaly (single-family 2/4 subset, no A140V-specific mechanism data), Abnormal Facial Shape (curated for negative content, no gestalt). Validated: just validate, validate-terms, count-verified-snippets 103/103, check-duplicate-keys, check-entity-refs, validate-disorders all pass.

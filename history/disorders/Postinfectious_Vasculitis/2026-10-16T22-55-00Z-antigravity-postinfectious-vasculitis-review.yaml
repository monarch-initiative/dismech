  summary: 'Review and enhance: Postinfectious Vasculitis'
  details: 'Reviewed and expanded kb/disorders/Postinfectious_Vasculitis.yaml for issue #11986 using cached
    references:

    - Added verified evidence items to all three subtypes (`Infection-triggered IgA vasculitis`, `Infection-associated
    cutaneous small-vessel vasculitis`, and `Infectious or secondary CNS vasculitis`).

    - Added `prevalence` (`ANNUAL_INCIDENCE` of 4.5 per 100,000 person-years for all-cause US biopsy-proven
    leukocytoclastic vasculitis and `ANNUAL_INCIDENCE` of 10-20 per 100,000 children per year for pediatric
    IgA vasculitis from PMID:33713282 and DOI:10.3390/jcm12020697) and `progression` (7-10 day post-infectious
    latency, 2-3 week lesion resolution, and 3-4 week single-organ episode resolution from PMID:33713282).

    - Linked core `pathophysiology` nodes to the shared `necrotizing_vasculitis` module via `conforms_to`
    (`necrotizing_vasculitis#Vessel Wall Immune Stimulus Deposition and Endothelial Activation` and `necrotizing_vasculitis#Fibrinoid
    Necrosis of the Vessel Wall`) and wired downstream causal edges through `Leukocyte-mediated vessel-wall
    injury` to explain all 12 phenotypes (zero disconnected phenotypes).

    - Added `histopathology` (`Leukocytoclastic vasculitis with fibrinoid necrosis`, bound to `NCIT:C35956`
    `Fibrinoid Necrosis`), `Necrotizing vasculitis` phenotype (`HP:6000253`), and `coarse_binding_basis:
    SOURCE_UNSPECIFIED` on `Gastrointestinal symptoms` (`HP:0025031`).

    - Added `biochemical` findings (`Infection-induced anti-neutrophil cytoplasmic antibodies (ANCA)`,
    `Serum complement fractions (C3 and C4)`, `Serum galactose-deficient IgA1 (Gd-IgA1) immune complexes`,
    `Cerebrospinal fluid hypoglycorrhachia and oligoclonal bands`, and `Leukocytosis and elevated C-reactive
    protein`), `genetic` susceptibility (`Shared IgAV-IgAN polygenic susceptibility architecture`), and
    `environmental` triggers (`Antecedent viral infection`, `Bacterial toxin or superantigen exposure`,
    and `Upper respiratory tract and streptococcal infection` with `influences_mechanisms` edges).

    - Added `Supportive care for self-limited cutaneous leukocytoclastic vasculitis` (`NCIT:C15747`) to
    `treatments` and populated `target_mechanisms` and `target_phenotypes` across all five treatments.

    - Added `diagnosis` (`Skin biopsy with light microscopy and direct immunofluorescence`, `Urinalysis
    and renal function monitoring`, and `Infectious serologies, autoantibody panel, and complement workup`),
    `differential_diagnoses` (`Granulomatosis with polyangiitis and primary ANCA-associated vasculitis`,
    `Primary polyarteritis nodosa`, `Primary central nervous system vasculitis`, and `Infective endocarditis
    and septic embolic pseudovasculitis`), `inheritance` (`Sporadic postinfectious acquisition`, `HP:0003745`),
    `classifications` (`harrisons_chapter`), `references`, and curation `notes`.


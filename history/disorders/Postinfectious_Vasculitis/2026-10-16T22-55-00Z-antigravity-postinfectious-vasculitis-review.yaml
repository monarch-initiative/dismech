  summary: 'Review and enhance: Postinfectious Vasculitis'
  details: |
    Reviewed and expanded kb/disorders/Postinfectious_Vasculitis.yaml for issue #11986 using cached references:
    - Added verified evidence items to all three subtypes (Postinfectious small-vessel leukocytoclastic vasculitis, Postinfectious IgA vasculitis, and Postinfectious medium- and large-vessel vasculitis).
    - Added prevalence/incidence records (US population-based biopsy-proven leukocytoclastic vasculitis annual incidence of 4.5 per 100,000 person-years from PMID:33713282, and pediatric post-viral IgA vasculitis epidemiology from DOI:10.3390/jcm12020697) and onset/progression records (7-10 day latency and 2-4 week cutaneous resolution from PMID:33713282; adult CNS vasculitis cohort median age 54 years from DOI:10.1177/19418744231223283).
    - Linked core pathophysiology nodes to the shared necrotizing_vasculitis module via conforms_to (`necrotizing_vasculitis#Vessel Wall Immune Stimulus Deposition and Endothelial Activation` and `necrotizing_vasculitis#Fibrinoid Necrosis of the Vessel Wall`) and wired downstream causal edges to explain all 12 phenotypes (zero disconnected phenotypes).
    - Added histopathology (`Leukocytoclastic vasculitis with fibrinoid necrosis`, NCIT:C35771), `Necrotizing vasculitis` phenotype (HP:6000253), and `coarse_binding_basis: SOURCE_UNSPECIFIED` on `Gastrointestinal symptoms` (HP:0025031).
    - Added biochemical findings (Elevated C-reactive protein and erythrocyte sedimentation rate, Circulating immune complexes and galactose-deficient IgA1, Hypocomplementemia, and Transient secondary ANCA or cryoglobulin positivity), genetic susceptibility (`HLA class II and complement gene susceptibility`), and environmental triggers (`Antecedent viral infection`, `Antecedent bacterial infection`, and `Vaccination` with `influences_mechanisms` edges).
    - Added `Supportive care` (NCIT:C15747) to treatments and populated `target_mechanisms` and `target_phenotypes` across all four treatments.
    - Added diagnosis (`Skin biopsy with direct immunofluorescence`, `Infectious trigger and autoantibody serologic workup`, and `Vascular imaging and angiography`), differential_diagnoses (`IgA vasculitis`, `ANCA-associated vasculitis`, `Cryoglobulinemic vasculitis`, and `Drug-induced vasculitis`), inheritance (`Sporadic`, HP:0003745), classifications (`harrisons_chapter`), references, and curation notes.

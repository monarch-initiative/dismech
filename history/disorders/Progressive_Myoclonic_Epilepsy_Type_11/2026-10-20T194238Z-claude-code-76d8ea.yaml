  summary: 'Create: Progressive_Myoclonic_Epilepsy_Type_11'
  details: |
    New entry for EPM11 (MONDO:0030034), caused by heterozygous, mostly de novo, truncating SEMA6B variants in exon 17 that escape nonsense-mediated decay. Curated from primary literature fetched from PubMed (Hamanaka 2020 discovery study with zebrafish crispants; Courage 2021 replication; Xiaozhen 2021 and Cordovado 2022 functional studies; Castellotti 2023 phenotype appraisal; Altintas 2025 systematic review; case reports for treatment and status epilepticus; Torene 2024 NMD-escape enrichment) plus the ClinGen gene-disease validity record. The OpenScientist deep-research report (research/Progressive_Myoclonic_Epilepsy_Type_11-deep-research-openscientist.md) was read and used as a cross-check; all 12 of its references resolved. Dropped from it: the SEMA6B identifier HGNC:7357 and chromosome 15q21.1 (both wrong; the gene is hgnc:10739 on 19p13.3), seven mislabelled HP and NCIT terms flagged by its own term validation, its statement that a toxic gain-of-function or dominant-negative mechanism is directly supported, the excitation-inhibition and GABAergic interneuron branch (no SEMA6B-specific evidence), and treatment recommendations extrapolated from other progressive myoclonus epilepsies (Unverricht-Lundborg, MERRF, GOSR2 Drosophila), which are not evidence for this disease. Scope decisions: developmental and epileptic encephalopathy and intellectual disability without epilepsy caused by the same variants are treated as one SEMA6B-related spectrum within this entry (recorded as an INTERPRETATION discussion); the variant mechanism is left as functional_impact_category UNKNOWN with a KNOWLEDGE_GAP discussion, because the literature describes the same variant class as dominant-negative, toxic gain-of-function and loss-of-function without a mammalian test at heterozygous dosage. ClinGen's Definitive AD classification is filed against the parent class MONDO:0020074, so it is cited as evidence but not recorded in gene_disease_validity. No GeneReviews chapter exists (check-genereviews --online). preflight-dr could not run without a local mondo.db; entity identity was checked by hand. Regression, loss of speech and spasticity are left without a causal edge because no source explains their mechanism; this is recorded as a second KNOWLEDGE_GAP.

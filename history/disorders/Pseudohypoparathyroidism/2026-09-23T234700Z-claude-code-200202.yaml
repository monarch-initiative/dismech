  summary: 'Split PPHP from PHP: remove subtype/parent link'
  details: |
    Lump/split decision: split. PPHP has its own MONDO term (MONDO:0012912) and a mechanism distinct from pseudohypoparathyroidism (paternal-allele GNAS coding loss producing AHO without the PTH resistance that defines PHP), and it already had a full standalone entry. Following design-decisions section 3, it is kept as a separate entry only: the Pseudopseudohypoparathyroidism subtype was removed from Pseudohypoparathyroidism.has_subtypes and from two applies_to_subtypes lists (canonical_imprinting_model, aho_mesenchymal_model), and Pseudohypoparathyroidism was removed from the PPHP entry's parents list, so the two entries no longer stand in a parent-child relationship. A top-level notes paragraph on the PHP entry records why PPHP is not a subtype. No evidence, phenotypes or pathophysiology were deleted from the PPHP entry. Validated with linkml-validate, check_duplicate_yaml_keys, check_entity_refs, check_causal_targets and the subtype pytest checks.

  summary: 'Review: hypothesis-group mis-assignment, PHP1B over-statement, deprecated
    field'
  details: |
    Correctness review. (1) Two causal edges were filed under the wrong mechanistic hypothesis group. The AHO node's 'Obesity' edge was tagged aho_mesenchymal_model (defined as bone/mesenchymal structural phenotypes) even though its own intermediate_mechanisms name MC4R appetite/energy signalling and the entry's neuroendocrine_obesity_model notes attribute obesity to hypothalamic DMH Gs-alpha loss; removed the mesenchymal tag. The 'Developmental Delay' edge was likewise tagged aho_mesenchymal_model although the entry's own neurohypocalcemia_model notes attribute PHP1A cognitive impairment to early CNS Gs-alpha haploinsufficiency; removed the tag and recorded why no existing group fits. (2) The Round Face phenotype asserted AHO is 'absent in PHP1B which lacks AHO features', contradicting this same entry's PHP1B subtype description ('less pronounced AHO') and the literature, where mild AHO features - notably brachydactyly - are reported in PHP1B. Reworded to scope the phenotype to PHP1A without excluding PHP1B. Its evidence snippet is a three-word fragment truncated mid-term ('short stature, round') that says nothing about PHP1B, so the grade was lowered from SUPPORT to PARTIAL pending a fuller quote. (3) Removed the deprecated free-text 'percentage: 3.4 per million' field; the structured rate_per_100000, prevalence_class and notes already carry it.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 77 (DFNB77, LOXHD1)'
  details: |
    De-novo curation of DFNB77 (MONDO:0013119, LOXHD1) from an OpenScientist deep-research report plus primary literature. Modelled the chain: LOXHD1 loss of function in stereocilia, hair-cell mechanotransduction failure with intact bundle architecture, progressive hair-cell degeneration, progressive sensorineural hearing loss. The mechanism node is defined as much by exclusions as by the positive result: bundle morphology, tip-link number and tip-link complex protein localisation were all measured and normal, which is what supports the authors' reading that the machinery is present but not activatable. Curated two negative findings from cohort studies, vestibular sparing and the absent genotype-phenotype correlation, and recorded in the entry that the schema has no EXCLUDED frequency value to express the first properly (issue #10190). Two mouse models with explicit relationship types, including the samba line by which the human gene was found. Two discussions filed. preflight-dr returned WARN on a false-positive rival-gene call, PLAT being the protein domain rather than the gene; the report is on topic. Validated with just validate, just validate-terms, just validate-disorders, just check-entity-refs, just check-duplicate-keys, just check-snippet-grading and just check-folded-hyphens.

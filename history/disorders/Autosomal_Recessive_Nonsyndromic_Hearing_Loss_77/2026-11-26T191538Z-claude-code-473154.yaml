  summary: Record ClinGen Definitive tier for LOXHD1; narrow two stereocilium bindings
    to stereocilium tip
  details: |
    Recorded the ClinGen Hearing Loss expert panel's Definitive autosomal recessive classification for LOXHD1 on the gene record, quoting the CGGV row, and mapped MONDO:0019497 as a broad match because the panel files the record under that class. Set germline origin on the gene record. Narrowed the cellular component on two nodes (LOXHD1 loss of function, TMC1 mislocalization from tip-link insertion sites) from GO:0032420 stereocilium to GO:0032426 stereocilium tip; the HA-tagged knock-in localization already quoted on the first node (PMID:39256406) places LOXHD1 at the tips of rows 2 and 3 where the lower tip link inserts. The TMC1-abundance and BAIAP2L2 nodes keep the generic term. A review of the six human LOXHD1 GO annotations found no contradiction with the mechanism chain. Validation: validate-disorders, count-verified-snippets, check-gene-validity and the offline structural gates.

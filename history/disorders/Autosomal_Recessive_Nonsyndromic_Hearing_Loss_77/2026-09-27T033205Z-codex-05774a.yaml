  summary: Review DFNB77 mechanisms, variable clinical course, care and experimental
    models
  details: |
    Reviewed the complete existing entry, CREATE/EDIT histories and matching OpenScientist report/citation list. Eligibility: no REVIEW history, no overlapping open LOXHD1/DFNB77 PR, Mendelian disease rather than infectious or environmental disease. Rebased isolated branch on main before curation.

    Mechanisms: incorporated the 2024 complete-deletion and tagged-protein experiments (PMID:39256406), missing from the entry/report. Separated reduced stereociliary TMC1 abundance from displacement of remaining TMC1 away from the lower tip-link insertion. Preserved TMC2, partial TMIE change, retained LHFPL5 and limited CIB2 immunostaining interpretation. Co-immunoprecipitation supports protein associations, not a proven direct-binding topology. BAIAP2L2 redistribution is a downstream localization readout, not an independently established cause of deafness. Separated stereociliary degeneration from whole hair-cell degeneration. PLAT10 mutant and complete-deletion current phenotypes have different onset; residual currents remain. Nonsense-associated alternative splicing in the 2021 T1308X mouse prevents treating that allele as a complete null and remains a proposed contributor to attenuation, with genetic-background alternatives.

    Clinical completeness: added general and congenital sensorineural impairment, high-frequency loss, tinnitus and secondary language delay; retained progression, prelingual onset and the two-sister ANSD presentation. Removed unsupported frequencies and obligatory progression. Serial audiograms exist in both Japanese and Dutch cohorts; congenital stable and later progressive courses coexist. The cousin's residual ABR waveforms differ from the sisters' ANSD presentation. Vestibular testing covers a small assessed subset, not all 8,074 screened patients. Preserved minor Dutch test variations. Tinnitus narrative 6/21 conflicts with seven positive entries in recovered Table 2; no population frequency is assigned. Cohort yields are not population prevalence and include uncertain variants/incomplete phase. No distinct mechanistic subtype or established systemic syndrome was demonstrated.

    Genetics: added representative nonsense, synonymous splice-altering, compound-truncating and computationally modeled missense alleles. c.4212+1G>A appears on differing haplotypes and is not established as exclusively Japanese or as one founder. Do not infer pathogenicity from prediction alone or two VUS. Synonymous c.5934C>T minigene evidence is IN_VITRO. Fuchs dystrophy association remains uncertain; 2018 carrier-parent examinations and 2023 systematic reassessment do not justify a DFNB77 corneal phenotype.

    Care and diagnosis: integrated direct 2011 and 2019 cochlear-implant reports alongside the 2022 ANSD family. Four assessed Japanese CI recipients among eight implanted had favorable outcomes; no universal success rate. Hearing-aid benefit is distinct from language outcome: the cousin remained delayed. Added communication/language support and general GeneReviews guidance for panel/genomic testing, VUS limitations, amplification and conditional recessive recurrence risk. General NBK1434 is tagged and actively mined; the index contains no DFNB77-specific chapter. Generic hearing-loss syndrome phenotypes do not define this disorder. ClinicalTrials.gov API LOXHD1 OR DFNB77 returned zero studies. No demonstrated LOXHD1 gene-replacement treatment was identified; restoration remains a proposed experiment, not a clinical therapy. No disease-specific biochemical marker was established. Existing auditory physiological diagnosis is retained and qualified.

    Models: corrected samba and PLAT10 comparison descriptions, added complete-deletion mouse and naturally occurring canine p.Gly1914Ala model. Canine segregation/BAER are direct findings; histology from earlier ungenotyped dogs cannot establish that variant's cellular mechanism. Human onset cannot be read directly from postnatal mouse timing.

    Sources consumed: full scientific text and relevant methods/results/discussion of PMID:39256406, 33707295, 31547530, 29676012, 35875410, 25792669, 33983508 and 42131115; tables recovered for 31547530 via fetch-reference. LOXHD1-specific results and limitations in 34753855 and 37441688; abstracts for 19732867, 21465660, 26973026 and 36472766. PMID:19732867 full text remained inaccessible after DOI, PMC/NCBI and EuropePMC routes; its abstract supports the retained claims, supplemented by later primary experiments. The 2024 correction only removed an accidental word from the abstract, not findings. General GeneReviews NBK1434 diagnostic, management and counseling sections read from cached HTML; ellipses omit markup boundaries without changing the cited claims.

    Research artifact discrepancies were checked against primary sources: invented or mismatched ontology IDs, unsupported computational population-frequency estimates, universally progressive framing, no-human-longitudinal-data claim and founder assumption were not accepted. The 2026 paper PMID:42131115 contains inconsistent family/variant counts and uncertain genotypes in implanted cases; stronger earlier direct clinical series support the treatment claims without treating those VUS cases as definitively solved. No broad prognostic conclusion follows from negative genotype/phenotype correlations in small cohorts. Unavailable full texts and unverified report leads were not substituted for primary results.

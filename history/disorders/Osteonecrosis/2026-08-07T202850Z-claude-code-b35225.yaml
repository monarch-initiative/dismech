  details: |
    Backfill for issue #8085. All four exposures target the vascular supply disruption node that initiates this entry's chain, and the grading is decided by one question: does the cited sentence connect the exposure to that node, or only to the disease? Glucocorticoid exposure is TRIGGERS with DIRECT because its second evidence item names the three routes, coagulation dysfunction, endothelial dysfunction, and impaired angiogenesis, by which glucocorticoids injure femoral head blood flow. Femoral neck fracture is also TRIGGERS with DIRECT, on the anatomical ground the node itself states, that fracture disrupts the retinacular vessels; the cited meta-analysis quantifies how often osteonecrosis follows rather than imaging the vessels, and the description says so. Heavy alcohol consumption and the combined hypercholesterolemia and smoking exposure are graded identically to each other at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, because they rest on the same single sentence, a list of risk factors contributing to the disease with no route named to the blood supply. Both are recorded one step more cautiously than the entry's own evidence items, which are SUPPORT, rather than more confidently. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 44 of 44 verified.

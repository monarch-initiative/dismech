  summary: Conform ischemic bone necrosis nodes to ischemic_bone_necrosis_and_repair
  details: |
    Added conforms_to links to the ischemic_bone_necrosis_and_repair module on four nodes:
    Vascular supply disruption and microvascular injury -> Bone Vascular Supply
    Interruption; Ischemic osteocyte and marrow cell death -> Ischemic Osteocyte and
    Marrow Cell Death; Impaired angiogenesis-osteogenesis coupling -> Resorption-Dominant
    Revascularization and Creeping Substitution; Subchondral fracture and femoral head
    collapse -> Structural Failure of Necrotic Bone under Mechanical Load. Left
    unconformed on purpose: Marrow adipogenesis and lipotoxicity, because it is the
    glucocorticoid- and alcohol-specific amplifier and does not recur in the traumatic,
    vertebral or paediatric conformers, so it is not a module node. The entry's
    Secondary osteoarthritis is a phenotype, not a pathophysiology node, so the module's
    consequence node has no conformer here. No node content was changed in this session.
    (The coupling-node link was later found to point the wrong way along the causal chain
    and was removed in the review round; see the follow-up record for this PR.)

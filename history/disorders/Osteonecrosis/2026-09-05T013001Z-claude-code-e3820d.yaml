  summary: Add gut dysbiosis environmental link and gut-bone axis knowledge gap
  details: |
    Adds the gut microbiota-mediated pathway to Osteonecrosis from PMID:42551625, a scoping review of gut microbiome and avascular necrosis, and addresses the review of PR #8868.

    The environmental entry "Gut dysbiosis" carries two influences_mechanisms edges: one to "Vascular supply disruption and microvascular injury" and one to "Impaired angiogenesis-osteogenesis coupling", the bone-remodeling arm added in this review round.

    Both edges are graded PREDISPOSES rather than EXACERBATES. The cited evidence is cross-sectional co-association of dysbiosis and vascular impairment as features of AVN, plus Mendelian-randomization support for a causal contribution of selected taxa to disease risk. Nothing quoted shows dysbiosis worsening already-established disease, which is what EXACERBATES asserts. PREDISPOSES also matches the grading of the better-evidenced heavy alcohol and hypercholesterolemia/smoking links already in this entry; the earlier EXACERBATES gave the weakest-evidenced link in the file a stronger predicate than the best-evidenced non-triggering one, and EXACERBATES counts as a causal predicate for compliance scoring.

    Adds a discussions entry, gap_avn_gut_bone_axis_causality, of kind KNOWLEDGE_GAP, attached to both pathophysiology nodes and to the environmental entry. Issue #8131 asked for either a KNOWLEDGE_GAP discussion or a distinct mechanism; the first round delivered only the mechanism and left the caveats as free text in notes and effect. The gap asks whether dysbiosis causally contributes or merely co-occurs downstream of glucocorticoid exposure and alcohol, which are established causes of both AVN and dysbiosis. Two proposed experiments, a longitudinal at-risk cohort for temporal ordering and a microbiota-targeted intervention trial for causality, come from the review's own closing sentence.

    Records in notes that ECTO was searched and has no suitable dysbiosis term, since dysbiosis is a host-microbiome state rather than an external exposure, so the UNBOUND classification from environmental-term-audit here is a deliberate decision rather than an un-researched gap. The original PR body claimed an ECTO binding that was never present in the diff. Also records that conformance to kb/modules/gut_dysbiosis.yaml was considered and rejected, because that module frames microbiota drift as an age-associated aging hallmark and there is no barrier-translocation evidence in AVN.

    Migrated the two supports: PARTIAL values this branch introduced to SUPPORT. PARTIAL was retired from EvidenceItem.supports by issue #10003 after this branch was cut; main's copy of this file is already migrated, so leaving them would have landed invalid enum values on main. The indirectness they expressed is now stated in each explanation instead. This branch's schema predates the directness slot, so no directness value was added, matching what main's own migration did to this file.

    Validation: just validate passed; just count-verified-snippets reported 49/49 verified, up from 46/46, with the three new snippets all exact substrings of the cached abstract; just check-duplicate-keys clean; attaches_to, would_support, would_refute, and all influences_mechanisms bare-name targets were verified to resolve against this entry.

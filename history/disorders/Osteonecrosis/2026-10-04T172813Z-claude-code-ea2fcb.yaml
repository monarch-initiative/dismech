  details: |
    Review of PR #13542 found that Impaired angiogenesis-osteogenesis coupling had been conformed to the module's Resorption-Dominant Revascularization and Creeping Substitution node although the entry places it upstream of osteocyte death and it makes no resorption claim. Removed that conforms_to (the trigger node's DECREASED angiogenesis binding already carries the vascular half). Added a new node, Resorption-dominant repair of the necrotic segment, downstream of Ischemic osteocyte and marrow cell death and upstream of Subchondral fracture and femoral head collapse, conforming to the module's central effector; bindings are osteoclast (CL:0000092), osteoblast (CL:0000062), bone resorption (GO:0045453) INCREASED and ossification (GO:0001503) DECREASED, mirroring the module node. Evidence is three review sentences already cached for this entry: PMID:39051378 (revascularization initiates resorption and formation; subchondral destruction results primarily from the resorption-formation imbalance) and PMID:34781934 (creeping substitution with glucocorticoid-enhanced unbalanced resorption behind vascularized-graft failure, graded INDIRECT). Added target_mechanisms on Bisphosphonate therapy pointing at the new node with treatment_effect INHIBITS and a PMID:39051378 mechanism-of-action snippet, plus a treatment-level item quoting the alendronate RCT collapse figures and noting the conflicting Chen trial. Validation: just validate, validate-terms, count-verified-snippets, check-entity-refs and check-causal-targets on the file.

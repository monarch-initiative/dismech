  details: |
    Answers the curation call the previous session's commit message left to the reviewer, per the round 3 review.

    Background: main gained disc_osteonecrosis_dysbiosis_axis via PR #9053 on 2026-08-20, one day after the round 1 review of this PR asked for a KNOWLEDGE_GAP block. Two PRs independently curated the same gap from the same paper (PMID:42551625). The previous session folded the merge-duplicated discussions: keys correctly (both kept, nothing deleted) but left the content collision open: two KNOWLEDGE_GAP discussions on one question, citing one PMID, proposing the same longitudinal cohort and the same microbiota-targeted intervention trial. Two records of a gap is worse than one, because a future curator who resolves one leaves the other standing.

    Consolidated into disc_osteonecrosis_dysbiosis_axis, the id already on main, following the reviewer's spec:

    - prompt: main's distinct-mechanism-vs-modulating-factor question, extended with this branch's shared-driver clause, which is the half that makes the gap falsifiable.
    - attaches_to: union of all four refs, including environmental#Gut dysbiosis.
    - rationale: this branch's, which names the live confounding alternative and the three indirect evidence classes, with main's dysbiosis -> SCFA -> barrier -> immune -> endothelium chain sentence and the lipotoxicity clause folded back in.
    - proposed_experiments: three, not five. The branch's longitudinal and intervention experiments are the base because they carry decision_criterion; main's richer readout lists (zonulin/LBP, C-reactive protein and cytokine panels, etiology stratification, ARCO staging, pain scores) are folded into their descriptions. exp_osteonecrosis_dysbiosis_mechanism is kept unchanged, having no counterpart on the branch.
    - evidence: all three snippets retained, all verify.

    Also took review suggestion 2: would_support and would_refute previously named the same pathophysiology node on both sides of each experiment, which reads as 'this experiment bears on this node' rather than as a directional prediction. What is under test is the dysbiosis-to-node link, and the entity-ref grammar has no anchor for an edge, so would_refute is now dropped from both experiments and the already well-written decision_criterion carries the direction.

    Nothing outside this file referenced either discussion_id or any experiment_id; grepped kb/, projects/, docs/. The two prior history records naming gap_avn_gut_bone_axis_causality are append-only and correctly describe the sessions as they ran.

    Validation: just validate clean (schema, terms, 50/50 snippets verified); check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens all OK.

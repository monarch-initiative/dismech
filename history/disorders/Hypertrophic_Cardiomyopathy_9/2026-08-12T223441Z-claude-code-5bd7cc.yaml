  summary: 'Address PR #7811 review: segregation paper, evidence fixes, four new sections'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7811 (one CRITICAL, four
    IMPORTANT, three suggestions). All are addressed.

    CRITICAL - the "no published segregation" claim was factually wrong, and the PR's own research
    artifact said so. PMID:39895828 was fetched and read: a three-generation Chinese Han family in
    which TTN p.Arg6745Cys tracked with three affected members and was absent from healthy adults
    except one 3-year-old girl. Added as a genetic evidence item, PARTIAL / HUMAN_CLINICAL, with
    an explanation carrying the qualifiers that keep it from being over-read: one small family,
    ACMG PP1 at supporting strength only, no functional work, and the authors' own observation
    that the Ig49 domain has no known nearby protein binding site. The unaffected 3-year-old is
    described as uninformative given age-dependent penetrance rather than as counter-evidence.

    The absolute phrasing was corrected in three places, not one - the review flagged the
    KNOWLEDGE_GAP rationale and asked me to check the description, and a third instance turned up
    in the inheritance block. The gap rationale now says segregation is reported in one small
    family rather than absent. The inheritance description says segregation evidence is minimal
    rather than absent and describes the pedigree. The Arg740Leu mechanism node's "no segregation"
    claim was scoped to that variant specifically, with a pointer noting that segregation exists
    for a different allele and does not replicate this one. The reviewer's second observation is
    also incorporated: the ClinGen assertion (2025-10-28) post-dates the segregation report
    (February 2025), so the panel plausibly saw it and still said Limited - which is a stronger
    argument for the classification than an absence would have been, and the rationale now makes
    that argument.

    IMPORTANT 2 - the REFUTE snippet cited a dilated-cardiomyopathy result to refute a hypertrophic
    claim, so the machine-readable evidence did not support the machine-readable assertion.
    Replaced with the HCM-specific comparison from the same full-text cache ("The frequency of TTN
    truncating variants ... hypertrophic cardiomyopathy and controls was similar (1% and 3%,
    respectively; P = 0.34)"), and added the sentence the review identified as the most damning
    datum in the paper as its own evidence item: every HCM subject with a TTN variant also carried
    a pathogenic variant in an established HCM gene. That second item does real work - it removes
    the reading in which TTN variants are rare but genuine HCM causes. The bracket-stripping
    workaround described in the original PR body was unnecessary and is gone.

    IMPORTANT 3 - six unconsumed content dimensions. Added the four the review set as the minimum:
    prevalence (CASES_IN_LITERATURE / NOT_YET_DOCUMENTED, with the point that a case count is
    uninterpretable while carriage runs at control frequency), diagnosis (promoting the panel
    reporting rule out of genetic.notes into a machine-readable entry - the single most useful
    output of a disputed entity), differential_diagnoses (sarcomeric HCM as the likelier
    explanation, TTN-DCM as the confusion risk, and non-sarcomeric phenocopies, which matter
    especially because the founding CMH9 cohort was by definition sarcomere-negative), and
    experimental_models (the medaka nsh mutant, with modeled_mechanisms linking it to the
    MURF1 hypothesis at fidelity LOW and limitations spelling out why: it is a fish, the causal
    direction runs from fish mutation to human screen rather than from a validated human allele,
    and the human phenotype is dominant while the fish structural phenotype is clearest in
    homozygotes). Treatments were scoped out explicitly rather than added, which the review
    permitted on condition it was stated: a notes paragraph now records that curating
    genotype-agnostic HCM management under a Limited-validity entity would imply a TTN variant
    carries management consequences, which is the opposite of this entry's central claim.

    IMPORTANT 4 - PMID:16352453 over-claimed. Both explanations for this study now carry the exon
    scope: only exons 2, 3, 4 and 14 were sequenced, four of TTN's 364, so it refutes recurrence at
    the known sites rather than excluding TTN involvement across the gene. The two explanations
    previously disagreed with each other on this point; they now say the same thing and each notes
    that the other exists.

    IMPORTANT 5 - four evidence_source: HUMAN_CLINICAL tags on definitional background sentences.
    All four retagged to OTHER (three instances of the same PMID:10462489 disease-definition
    sentence, plus the PMID:31628103 opening definition), with one explanation extended to say why
    the tag changed. Rather than only retagging, the review's alternative was also taken where it
    was available: the Left Ventricular Hypertrophy phenotype now carries a genuine HUMAN_CLINICAL
    observation from PMID:39895828 - measured septal thicknesses of approximately 32, 34 and 24 mm
    in the p.Arg6745Cys proband - so that phenotype rests on a measurement rather than only on a
    definition. It is PARTIAL, since it is one individual whose variant is not established as
    causal.

    SUGGESTIONS taken. The ClinVar 0-star caveat for Arg740Leu is recorded in notes with the point
    that matters: VCV000012649 is a 1999 OMIM-derived assertion with no assertion criteria,
    derived from the same report this entity rests on rather than independent of it, so a reader
    who checks ClinVar and sees "Pathogenic" is seeing the index case again, not confirmation. A
    reference-mining note records that PMID:20301725 and PMID:38718139 are both abstract_only with
    nothing minable, and explicitly warns against attributing circulating HCM penetrance figures to
    the GeneReviews record, which would fail reference validation. Variant-level HGVS was not
    added; the alleles are already identified by protein-level notation throughout and the
    review marked this optional.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_9.yaml' passes in

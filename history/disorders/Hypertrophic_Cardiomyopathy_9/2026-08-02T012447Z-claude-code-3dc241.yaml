  summary: 'Create: Hypertrophic Cardiomyopathy 9 (TTN)'
  details: |
    Created kb/disorders/Hypertrophic_Cardiomyopathy_9.yaml for MONDO:0013412 (CMH9, OMIM 613765, TTN).

    NEC preflight run independently against sqlite:obo:mondo: causal gene TTN (HGNC:12403), OMIM:613765, and synonym CMH9 all confirmed.

    Parent-term duplicate check: MONDO:0013412's parent MONDO:0100494 (autosomal dominant titinopathy) is already curated as TTN_Related_Myopathy_Dominant_Negative_TTNsv.yaml. That entry is a skeletal-muscle myopathy caused by in-frame multi-exon structural variants acting by a dominant-negative mechanism, it explicitly disclaims covering the wider TTN spectrum, and it never mentions hypertrophic cardiomyopathy. A separate entry was therefore justified; the reasoning is recorded in the entry's notes field.

    Headline finding: ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel classifies TTN-hypertrophic cardiomyopathy as LIMITED (SOP11, classified 2025-10-28; CGGV:assertion_c17e22eb-c6fc-487d-bcf6-001bb85fdabd), scored 1.2 genetic + 5.5 experimental = 6.7 points.

    The entry therefore asserts no established mechanism. The two proposed mechanisms (titin/alpha-actinin Z-disc binding; titin/MURF1 ubiquitination near the M-line) are recorded as mechanistic_hypotheses with status EMERGING, all pathophysiology nodes carry mechanism_confidence HYPOTHETICAL, and the validity question is recorded as a KNOWLEDGE_GAP discussion alongside a cause-versus-modifier CONTROVERSY discussion, each with proposed_experiments.

    Refuting evidence is carried explicitly rather than omitted: PMID:22335739 (TTN truncating variants in 3/231 HCM vs 7/249 controls vs 54/203 DCM), PMID:28822653 (TTNtv 2.5% in HCM vs 2.6% in controls), PMID:16352453 (no TTN mutations in 389 HCM patients), and PMID:39132495 (no excess TTN variants in cases vs controls).

    Anti-NEC guard: the TTN-dilated-cardiomyopathy Definitive assertion is recorded as an external_assertion contrast, and the large TTN-DCM literature is deliberately excluded from this HCM entry.

    Deep research: falcon was requested but is unavailable in this environment (no EDISON_API_KEY/FUTUREHOUSE_API_KEY; the provider is not registered, only claude_code is). claude_code was used instead. Its report passed an NEC check (TTN 109 mentions, OMIM 613765 present, hypertrophic 49 vs dilated 7) and contributed one high-value lead, the ClinGen HCM gene reappraisal paper PMID:39132495. All DR output was treated as leads only; every PMID was fetched via just fetch-reference and every snippet independently verified against the cached text.

    Validation: just validate PASS, just validate-references PASS (34/34 snippets verified), just validate-terms PASS, compliance 87.5% global / 88.3% weighted, tests/test_snippet_length.py 23 passed.

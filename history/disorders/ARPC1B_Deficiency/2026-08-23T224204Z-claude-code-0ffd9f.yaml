  summary: 'Create: ARPC1B Deficiency MONDO:0060583'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report that passed 'just preflight-dr' against MONDO:0060583 with a PASS verdict: canonical gene ARPC1B mentioned 232 times and the report's single OMIM identifier 617718 matching the MONDO xref exactly. The ARPC1A mentions in the gene table are the paralogue this disease is about, not a rival entity. Three of the report's PubMed links were usable; the founding Nature Communications paper, the Nepalese founder cohort and the IUIS classification were located by PubMed query, and every abstract or full text was read before use. The entry is organised around isoform non-redundancy: ARPC1A and ARPC1B are 68 percent identical and occupy the same slot in the same complex, ARPC1A is actively upregulated when ARPC1B is lost, and it still does not rescue - the Arp2/3 complex is barely detectable in patient platelets while every other subunit is present at normal levels. Three downstream arms hang off defective branched actin nucleation: megakaryocyte and platelet failure, lymphocyte cytoskeletal dysfunction with a cell-intrinsic Treg defect and IL-2-reversible NK degranulation failure, and a nuclear arm in which Arp2/3-dependent double-strand break clustering fails, giving cellular radiosensitivity. The radiosensitivity arm is deliberately kept separate from the immune arm because the mechanism is nuclear rather than cytoskeletal-motility and no source connects it to any clinical manifestation. A CONTROVERSY discussion carries the platelet-size disagreement, which matters because platelet size is the classical bedside discriminator against Wiskott-Aldrich syndrome: the founding report describes microthrombocytes, the 14-patient cohort reports normal volume in most cases, and the IUIS 2022 table sides with the cohort. An allelic reconciliation was drafted and then withdrawn after reading the founding paper's discussion, which reports microthrombocytes across both of its allele classes while platelet counts varied by genotype - the opposite of what an allelic explanation needs - so the discussion now points at measurement method instead and the proposed experiment was rewritten accordingly. One reference, PMID:27965109, was fetched and deliberately not cited: it caches as an Edinburgh Research Explorer repository landing page carrying only bibliographic boilerplate, with no article body to quote; the 2019 follow-up from the same group is cited in its place. Three snippets initially failed verification and were fixed rather than paraphrased: two omitted an HSCT parenthesis present in the cached text, and one spanned a square-bracketed figure callout that the reference validator strips before matching, which was resolved by splitting the quote into two evidence items. Validation: 'just validate' passed with 47 of 47 snippets verified against cached references; 'just validate-terms' passed; treatment-mechanism and conforms_to foreign-key tests passed; the ungated CI gates are clean.

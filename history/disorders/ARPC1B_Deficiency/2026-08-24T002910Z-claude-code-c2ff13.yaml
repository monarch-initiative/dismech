  details: |
    One-word correction to the omission note added in the previous record. That note said the omission check grepped 'the eight cited caches'; the entry cites seven PMIDs as evidence. The eighth, PMID:27965109, is discussed in notes: as a reference deliberately NOT cited (its cache resolves to a repository landing page with no quotable body), and it is correctly absent from references_cache/ - my grep loop enumerated PMID mentions rather than evidence references, picked it up, and silently skipped the missing file, so the count was inflated by one.

    The substance of the note is unaffected and was independently verified by the reviewer: the c.899_944del founder allele is absent from every cited cache, leukocytosis is quotable but attributable only to an n-of-1 observation during acute infection, and abnormal platelet morphology is already curated inside the platelet-size CONTROVERSY.

    Fixing it rather than deferring, despite the reviewer marking it non-blocking and suggesting it wait for the next edit to this file, for two reasons: an approved PR is auto-merged after three days by pr-shepherd, so 'next time this file is touched' could be a long way off and the wrong number would ship in the meantime; and the note's entire subject is provenance precision, which makes a wrong count in it worse than it would be anywhere else in the entry.

    The previous history record retains the wrong figure. History records are append-only and describe the session as it ran, so it is not rewritten - this record supersedes it on that point.


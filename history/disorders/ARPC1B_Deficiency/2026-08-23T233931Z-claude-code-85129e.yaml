  summary: 'Review round 2: fix contradictory frequency explanation, record omission
    reasoning'
  details: |
    Addressed the three non-blocking suggestions on the approving review of PR #9335.

    1. Fixed a self-contradiction I introduced in round 1. The Growth Failure phenotype's description reasons its way to VERY_FREQUENT (one 14-patient series' 'all patients' does not establish complete penetrance across roughly forty published patients), but the evidence explanation three lines below still read 'Universal in the cohort, hence OBLIGATE'. Round 1 changed the band and the description and left the explanation behind. The explanation now states what the band actually rests on. This is the exact failure mode of curating prose that no validator reads: schema, terms, and all five gates passed on a file whose own explanation contradicted its own frequency band.

    2. Recorded the deliberate omissions in notes:, with reasoning that differs from the review's framing on two of three items. The review characterized leukocytosis, abnormal platelet morphology and the c.899_944del founder allele as having no cacheable source. Grepping the eight cited caches for the facts rather than for literal strings shows two of the three are present:

    - Leukocytosis IS quotable. PMID:33679784 records significant leukocytosis (WBC 20,000-48,000) in the index patient. It is not curated because that is an n-of-1 observation taken during acute lower respiratory tract infection, and because the other cached hits are in PMID:35748970, a review table where the leukocytosis rows belong to leukocyte adhesion deficiency and hyper-IgD periodic fever, not ARPC1B. The right reason is attribution, not availability.
    - Abnormal platelet morphology IS in the entry. PMID:28368018 reports microthrombocytes and small platelets and that material is already curated inside the platelet-size CONTROVERSY. Adding HP:0001907 as a phenotype would assert as settled the thing the discussion exists to record as contested.
    - Only c.899_944del (p.E300Gfs*7) is genuinely absent. Grepping all eight caches for the coding change, the protein change and the ancestry descriptors returns nothing; the only founder allele any cited source describes is the Nepalese c.64+2T>A, already curated, with PMID:30771411 separately noting a founder mutation shared by three Nepalese-ancestry patients. A second independent founder allele is left out rather than sourced to the research report alone.

    Validation: just validate passes with 70/70 snippets verified (unchanged - this round edited prose only, no new evidence); just validate-terms passes; check-folded-hyphens and check-duplicate-keys clean. No cache file was written or edited.

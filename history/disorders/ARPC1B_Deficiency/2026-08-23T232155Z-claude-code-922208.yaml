  summary: 'Edit: ARPC1B Deficiency - review round 1 corrections'
  details: |
    Review round 1 on PR #9335, six IMPORTANT findings, all correct. The thrombocytopenia frequency band was VERY_FREQUENT and justified by a bleeding statistic rather than a platelet-count one; worse, 79 percent sits inside the FREQUENT band, so the explanation misstated the band boundary as well as substituting a different phenotype as a proxy. The band is now removed entirely because the only on-point statement reports reduced platelet counts without a percentage, and the bleeding figure is curated as its own phenotype at FREQUENT. Growth failure was OBLIGATE on one 14-patient cohort's 'all patients' and is now VERY_FREQUENT, since the disease spans roughly forty published patients with documented intrafamilial heterogeneity and OBLIGATE asserts complete penetrance on a denominator that does not support it. Six phenotypes were added: IBD-like colitis, asthma, food allergy, autoantibody positivity with its own counterweight evidence that autoantibodies were absent in most patients of the largest cohort, elevated circulating IgA in its own right rather than only inside the IgE entry's snippet, and lymphadenopathy. A diagnosis section replaced what had been only a differential: ARPC1B protein quantification by immunoblot and flow cytometry as the confirmatory functional test, and the sequencing strategy with the RNA confirmation step that non-coding alleles require. Three treatments were added, of which sirolimus is the substantive one, curated with the constraint that matters: actin polymerisation assays before and after showed no change, so the benefit is immunomodulatory rather than a correction of the Arp2/3 defect, which the authors also offer as the explanation for sirolimus failing in patients with broader dysregulation. Recording the response without the assay would have implied the drug treats ARPC1B deficiency rather than its autoimmune component. Also added avoidance of ionising radiation and radiomimetics, which was the actionable half of the radiosensitivity finding and previously existed only as an unactioned knowledge gap. The genetic section now names all six reported allele classes including two a coding-consequence filter would not flag, the synonymous c.783G>A and the intronic c.64+4_64+24del. Two new references drive most of this. PMID:33679784 reports three siblings homozygous for c.783G>A with the syndrome and no thrombocytopenia at all, which widens the platelet controversy from size to presence and is a further reason not to use platelet findings to include or exclude the diagnosis; that discussion now carries it. PMID:42614194 supplies the sirolimus case. Immunosuppression and TNF blockade now both declare target_mechanisms so the negative TNF result attaches to a node rather than floating. Validation: 'just validate' passes with 70 of 70 snippets verified against cached references, up from 47; 'just validate-terms' passes; the ungated CI gates are clean.

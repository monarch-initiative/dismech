  details: |
    Addressed the five blocking review items. (1) Retargeted adjunctive clindamycin from the fibrinolytic-escape node to a new Streptococcal Superantigen Exotoxin Release node with treatment_effect INHIBITS, matching its anti-toxin rationale. (2) Added two pathograph nodes - Streptococcal Superantigen Exotoxin Release (superantigen -> massive T-cell response, PMID:41714399) and Streptococcal Toxic Shock and Multiorgan Failure (PMID:12736555, PMID:37465410) - wired Bacterial Proliferation -> Superantigen -> {Necrosis, Toxic Shock}. A separate microvascular-thrombosis/ischemia node was NOT added: both NSTI-review caches (PMID:40185551, PMID:39259555) are abstract-only and no cached reference carries a quotable thrombosis/ischemia sentence, so adding it would require a fabricated snippet; the vascular-injury path remains represented by the existing Clostridial Alpha-Toxin Endothelial Injury node. (3) Added three phenotypes - Skin necrosis (HP:0033126), Edema (HP:0000969), Hypotension (HP:0002615) - all wired, so list-disconnected-phenotypes now reports 6/6. Fever and crepitus were not added: the only cached fever mention is a negative ('did not have a high fever') and no soft-tissue-gas HP term fits crepitus. (4) Added environmental PREDISPOSES entries for diabetes mellitus (PMID:40721651, 62% prevalence plus the perfusion/immune-dysfunction mechanism) and immunocompromise (PMID:12736555), each with its own evidence. (5) Moved the deep-research session log out of notes into this record: the run used a falcon request that fell back to the openscientist provider (research/Necrotizing_Soft_Tissue_Infection-deep-research-openscientist.md); the report resolved all 26 references with no missing/unverifiable ones but retained unsupported generated quotes for PMID:14620152, 26633512, 32828915, 33945021 and 26908491, none of which are used as snippets here; its term-validation pass flagged obsolete GO:0070265, not used; just preflight-dr returned SKIP as expected for an acquired infection with no RO:0004003 causal gene on MONDO:0018602; manual preflight confirmed MONDO:0018602 / Orphanet 440368 alignment. validate, validate-terms and count-verified-snippets (31/31) all pass.

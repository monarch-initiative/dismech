  summary: Add EMERGING immune-stromal dysregulation hypothesis to Castleman Disease
  details: |
    Added a mechanistic_hypotheses group (immune_stromal_dysregulation, status EMERGING, applies_to_subtypes: [iMCD]) capturing the proposed shift from a purely IL-6-centric model of iMCD toward immune-stromal dysregulation (fibroblastic reticular cells, endothelial dysfunction, dysregulated immune-cell communication), with molecular endotypes defined by differential IL-6 / CXCL13 / TNF / PI3K-AKT-mTOR pathway activation.

    Evidence: a single narrative review preprint, PPR:PPR1286884, cached via `just fetch-reference` (never hand-written) and tagged evidence_source: OTHER because it is an expert synthesis contributing no primary data. Because the sole source is not peer reviewed, the top-level description was reworded in response to PR review: the immune-stromal claim is now scoped to iMCD (matching applies_to_subtypes rather than generalizing across all MCD subtypes), is hedged as a proposed emerging framework rather than settled "contemporary understanding", and states explicitly that it is recorded as an EMERGING hypothesis. The IL-6 / JAK-STAT sentence is restored to its original unhedged form as the established across-subtype mechanism.

    Known modeling debt, recorded rather than silently accepted: hypothesis_group_id immune_stromal_dysregulation is not yet referenced by any downstream[].hypothesis_groups, so it does not shape the pathograph. Adding FRC/endothelial pathophysiology nodes on the strength of a non-peer-reviewed review was judged unwarranted. The tractable follow-on flagged in review is a PI3K/AKT/mTOR node drawn from the peer-reviewed iMCD literature, which would also give the already-curated Sirolimus treatment something to point target_mechanisms at.

    Checks actually run on this branch, all passing: `just validate kb/disorders/Castleman_Disease.yaml` (schema OK; the 3 WARN lines are pre-existing unfetchable ega: dataset accessions, untouched here), `just validate-terms kb/disorders/Castleman_Disease.yaml` (no new ontology-bound descriptors), `just count-verified-snippets kb/disorders/Castleman_Disease.yaml` (4/27 verified, 23 skipped by prefix as pre-existing DOI: refs; the new PPR: snippet is among the 4 verified), `just check-folded-hyphens` (no new splits), and `just validate-history-all`. Not run: the full `just validate-disorders` batched sweep.

  details: |
    Evidence-integrity review of all 27 evidence items against all 9 cached references (5 DOIs, NCIT:C61084, PPR preprint, 2 ClinicalTrials.gov records), re-reading each cited publication; all 23 prefix-skipped snippets hand-verified as exact substrings. Defects fixed, all unicentric/multicentric scope or mechanism over-reach - no fabricated quotes: (1) an IL-6 across-subtypes explanation rescoped to MCD, since the quoted they refers to the MCD forms and the entry's own biochemical section notes IL-6 is typically normal in UCD; (2) three pathophysiology edges (IL-6 to JAK-STAT3, JAK-STAT3 to proliferation, proliferation to angiofollicular hyperplasia) downgraded to PARTIAL - one review sentence about excess IL-6 had been reused as SUPPORT for downstream steps it does not describe; explanations now say where the quote stops; (3) the proliferation node's own evidence similarly downgraded; (4) a vIL-6 mechanism claim trimmed to what the cited background sentence states; (5) fever evidence downgraded to PARTIAL because the meta-analysis reports a composite constitutional-symptoms endpoint, while the parallel splenomegaly item stays SUPPORT as directly measured; (6) two trial registrations graded OTHER. Left unfixed with reasons: an expert-perspective review kept HUMAN_CLINICAL across all nine uses pending a single whole-file convention decision (changing one occurrence would split a quoted sentence across two evidence_source values); Viral-Track items stay COMPUTATIONAL per the repo's edge-case rule; surgical resection and tocilizumab carry no evidence (gap, no claim to check). Named-entity check against the sibling Multicentric_Castleman_Disease entry found no conflation - this umbrella entry subtype-tags MCD-specific phenotypes and pins UCD/iMCD/HHV8+ distinctions to sources drawing those exact distinctions. Clearest follow-up: the gp130/JAK-STAT3 and VEGF-histology middle links remain plausible but effectively uncited. Validation: just validate, validate-terms, and strict snippet audit pass.

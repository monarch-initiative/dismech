  details: |
    Addressed the CHANGES_REQUESTED review on PR 14884. Added eyelid pain (HP:0034808), palpebral edema (HP:0100540) and eyelid erythema (HP:0040323) as acute, very frequent phenotypes quoted from PMID:28068454 and wired them downstream of the suppurative inflammation node. Added predisposing nodes for chronic blepharitis / meibomian gland dysfunction (PMID:34379160, PMID:28181687) and Demodex eyelash infestation (PMID:34725365, fetched), and an atomic lash-line gland orifice obstruction node (PMID:28181687) upstream of staphylococcal seeding; warm compresses and lid hygiene now target the obstruction node. Added a progression block (acute abscess, spontaneous drainage, recurrence, local spread) and rare complications: preseptal cellulitis (HP:0100658) and eyelid necrosis (HP:0033126), the latter including the MSSA periorbital necrotizing fasciitis case (PMID:34054469 and PMID:41787906, fetched), linked as sequelae. Bound warm compresses to NCIT:C94625 Thermotherapy with therapeutic_modality BEHAVIORAL, set SURGERY on incision and drainage, and marked the PMID:42367702 snippets quote_role BACKGROUND. Moved curation-process text out of notes: the original Falcon deep-research request fell back to OpenScientist and all 31 reported references resolved; the report's term validation flagged HP:0025421 and HP:0000198 as mislabeled so they were not used; preflight-dr skipped automated gene identity checks because MONDO:0001642 records no causal gene, and manual review confirmed the report covered hordeolum externum, external hordeolum and external stye. Not taken: optional IPL and intralesional 5-FU treatments and a sebaceous carcinoma differential, which need further source review. Validation: just validate, validate-terms, count-verified-snippets (42/42), check-folded-hyphens, check-causal-targets, check-coarse-phenotypes, check-snippet-grading, check-granularity, list-disconnected-phenotypes (6/6 connected) all pass.

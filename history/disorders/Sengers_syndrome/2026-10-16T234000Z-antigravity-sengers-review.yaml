  summary: Review and enhance Sengers syndrome classifications, natural history, diagnostic workup, cataract
    causal edges, and PR review follow-up
  details: 'Reviewed kb/disorders/Sengers_syndrome.yaml against the disease schema, compliance checks,
    cached literature, and PR #14650 review findings:

    - Added top-level synonyms (Cardiomyopathy, familial hypertrophic, with congenital cataract and mitochondrial
    myopathy; Cataract-cardiomyopathy syndrome; Cardiomyopathy-cataract-mitochondrial myopathy syndrome).

    - Added top-level classifications block with Harrison''s chapters (GENETICS_ENVIRONMENT_DISEASE, CARDIOVASCULAR,
    NEUROLOGIC), mechanistic_category (mitochondrial disease), and icimd_category entries for mitochondrial_membrane_biogenesis_and_remodeling
    (DOI:10.1007/s10545-014-9759-7) and mitochondrial_protein_import (DOI:10.3390/ijms222413484).

    - Bound Autosomal Recessive inheritance to HP:0000007 (Autosomal recessive inheritance).

    - Added progression block contrasting the severe neonatal-onset form (total mortality 57.9% [22/38],
    with 86.4% [19/22] of fatal cases dying within 3 years of age, mostly from heart failure; PMID:34164355,
    DOI:10.3390/ijms222413484, PMID:8526648) with the chronic benign form surviving into adulthood (associated
    with splicing variants that reduce but do not abolish normal transcript levels; DOI:10.1186/s13052-022-01370-y).

    - Connected Developmental cataract as a downstream phenotype of Disrupted mitochondrial phospholipid
    metabolism and Oxidative phosphorylation deficiency in the pathophysiology causal graph with causal_link_type:
    INDIRECT_UNKNOWN_INTERMEDIATES, eliminating the sole disconnected phenotype while explicitly noting
    that lens-specific intermediates remain uncharacterized.

    - Added a structured diagnosis section covering AGK molecular genetic testing (NCIT:C15709), echocardiography
    (NCIT:C16525), skeletal muscle biopsy and OXPHOS/ANT1 assessment (NCIT:C51895), and ophthalmologic
    examination (NCIT:C120698, with notes explaining the broader eye examination proxy) backed by verbatim
    snippets from cached references.

    - Consolidated duplicate citations of Wang et al. 2021 (DOI:10.3389/fped.2021.639687 and PMID:34164355)
    onto PMID:34164355 (full-text XML cache), marked the reused TIM22 background snippet from DOI:10.3390/ijms222413484
    with quote_role: BACKGROUND across all 3 occurrences, and standardized evidence_source: HUMAN_CLINICAL
    on the patient muscle biopsy ANT1 immunoblot snippet from DOI:10.1002/ana.10214.

    '

    summary: 'Review and enhance Sengers syndrome classifications, natural history, diagnostic workup, and cataract causal edges'
    details: |
      Reviewed kb/disorders/Sengers_syndrome.yaml against the disease schema, compliance checks, and cached literature:
      - Added top-level classifications block with Harrison's chapters (GENETICS_ENVIRONMENT_DISEASE, CARDIOVASCULAR, NEUROLOGIC), mechanistic_category (mitochondrial disease), and icimd_category entries for mitochondrial_membrane_biogenesis_and_remodeling (DOI:10.1007/s10545-014-9759-7) and mitochondrial_protein_import (DOI:10.3390/ijms222413484).
      - Bound Autosomal Recessive inheritance to HP:0000007 (Autosomal recessive inheritance).
      - Added progression block contrasting the severe neonatal-onset form (~86% 3-year mortality, mostly from heart failure; PMID:34164355, DOI:10.3390/ijms222413484, PMID:8526648) with the chronic benign splice-variant form surviving into adulthood (DOI:10.1186/s13052-022-01370-y).
      - Connected Developmental cataract as a downstream phenotype of Disrupted mitochondrial phospholipid metabolism and Oxidative phosphorylation deficiency in the pathophysiology causal graph, eliminating the sole disconnected phenotype.
      - Added a structured diagnosis section covering AGK molecular genetic testing (NCIT:C15709), echocardiography (NCIT:C16525), skeletal muscle biopsy and OXPHOS/ANT1 assessment (NCIT:C51895), and ophthalmologic examination (NCIT:C120698) backed by verbatim snippets from cached references.
      - Synchronized the top-level references block with all cited PMIDs and DOIs.

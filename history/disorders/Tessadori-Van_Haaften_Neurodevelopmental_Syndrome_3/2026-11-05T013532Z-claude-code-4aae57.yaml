  summary: 'Create: Tessadori-Van_Haaften_Neurodevelopmental_Syndrome_3'
  details: |
    New entry for Tessadori-Van Haaften neurodevelopmental syndrome 3 (MONDO:0030993, H4C5), curated from an OpenScientist deep-research report (the only provider used; preflight-dr PASS, 13/13 references resolved). Primary sources: the founding pan-H4 cohort (PMID:35202563, full text; 17 of its 29 individuals carry H4C5 variants), the H4C5 p.Tyr99His Angelman-like case report (PMID:36987712), and the ClinGen Strong AD gene-disease validity record. Phenotype frequencies are taken from the pan-H4 cohort and the entry notes that they are not H4C5-specific. Pathophysiology is a three-node chain (variant -> predicted nucleosome/chaperone-interaction perturbation -> disrupted embryonic development in zebrafish) with the mechanism step marked as inference, and the zebrafish mRNA model recorded with its limits, including the null result for H4C5 Arg40Cys. Not used from the report: PMID:31542297 (H4K91 glutarylation, a post-translational modification study, not a disease variant), PMID:31804630 (H4C11), the episignature and H1/H3.3 papers (other disorders), and ClinVar-only variant classifications the report did not source. No treatment section because no cited source describes management. check-genereviews: NO_CHAPTER. validate, validate-terms, count-verified-snippets (48/48) and validate-disorders run.

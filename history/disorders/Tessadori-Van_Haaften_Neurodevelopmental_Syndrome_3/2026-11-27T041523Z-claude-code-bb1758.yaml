  details: |
    Removed the UBERON brain location from Disrupted Early Embryonic Development, an organism-scale node whose zebrafish evidence describes whole-embryo effects and which also feeds Short Stature. Added descriptions to the Seizure, Autistic Behavior and Ataxia edges stating that they are inferred and that the 28-hour zebrafish assay does not report these features. Added PMID:36987712 evidence for exome reanalysis to the trio whole-exome sequencing row. Reworded the Angelman syndrome distinguishing feature to the tests the case report states were negative (methylation-specific MLPA and exome sequencing); the report does not mention UBE3A.

  summary: 'Genetics pass: bind SOST, add van Buchem and LRP4 subtype terms'
  details: |
    Genetics pass for dismech#12205 (d2g wiring-016).

    SOST - the gene this disease is named for - was bound nowhere. The `SOST
    Mutations` genetic record had no `gene_term`, and the only HGNC CURIE in the
    file was LRP4. Wiring was 0/2.

    Changes:
    - `genetic[0]` binds SOST (`hgnc:13771`), `CAUSATIVE`, `GERMLINE`, linked to the
      `SOST-related Sclerosteosis` subtype.
    - SOST bound as a `genes:` descriptor on the sclerostin-loss and Wnt-activation
      nodes, with a `genetic_context` on the first that also records why van Buchem
      disease is a separate subtype rather than another SOST coding allele: its
      lesion is a biallelic 52-kb regulatory deletion downstream of the gene.
    - A new pathophysiology node, `Impaired Sclerostin Action at LRP4`, converging
      downstream on the shared Wnt node, so the LRP4 record reaches the pathograph
      too. Wiring is now 2/2.
    - The `Van Buchem Disease` subtype row had no `subtype_term`. MONDO does have
      the concept, under a primary label that does not contain the words "van
      Buchem": MONDO:0009395 "hyperostosis corticalis generalisata", whose
      definition opens "Hyperostosis corticalis generalisata, also known as van
      Buchem disease". It is now bound, with the row's description stating that the
      binding follows the GeneReviews grouping of the two SOST-related sclerosing
      bone dysplasias and does not assert a MONDO subclass edge under sclerosteosis.
    - A third subtype row for MONDO:0013679 "sclerosteosis 2", MONDO's LRP4-caused
      sclerosteosis, so the LRP4 locus is reachable from this umbrella entry (whose
      `disease_term` is the MONDO:0017838 parent). The existing LRP4 genetic record
      keeps its differential-diagnosis reasoning and now also names that subtype.
    - Both new subtype rows carry `genes:` and, for van Buchem, two GeneReviews
      snippets.

    Grading correction, entry-wide: `just check-snippet-grading` flagged two new
    items I had graded `HUMAN_CLINICAL` for PMID:36508511 against eight pre-existing
    items in the same file grading that GeneReviews chapter `OTHER`. All three of my
    new items were moved to `OTHER` with `quote_role: REVIEW_SYNTHESIS`; no
    pre-existing item was regraded.

    The `17q12-q21` band in the record's notes was checked and is already sourced -
    both PMID:11179006 and PMID:11181578, cited in the same record, state it.

    Verification: full offline gate list passes.

  summary: Review MYO3A clinical attribution and model-specific mechanisms against
    full texts
  details: |
    Reviewed the complete entry and substantive Falcon report, with citation companion and preflight PASS. Read cached full texts for the founding family, espin-1 cell experiments, nonsense and Y137C knock-in mice, constitutive/conditional double-null mice, dominant MYO3A context and Japanese cohort. Inspected full-text methods, available figure captions and extracted cohort/model tables. Regenerated reference caches only through the fetcher; founding, double-null and Y137C sources gained full text and Japanese cohort tables became accessible. The Kazakh report remains abstract-only. The kinase report PMID cache also remains abstract-only after refetch; inspected the author-uploaded full-text clinical, segregation and modelling-methods sections through the public ResearchGate page (https://www.researchgate.net/publication/354075626_Molecular_insights_into_MYO3A_kinase_domain_variants_explain_variability_in_both_severity_and_progression_of_DFNB30_hearing_impairment); the reference fetcher returned 403 and no cache was hand-created. Separate supplements and raw data were not independently inspected. No disease-specific GeneReviews/StatPearls chapter was found; the general Genetic Hearing Loss Overview was used and tagged. Corrected missing bilaterality and unsupported claims that vision was never assessed. Retained the founding within-family genotype association and measured lymphoblast splice effects. Qualified Japanese VUS/phase uncertainty, vertigo attribution, cross-sectional progression and referral yield; removed an inconsistent worldwide patient count and phenotype-frequency bands. Separated early functional hearing deficit from later degeneration, qualified epitope-dependent staining and construct-dependent espin transport, and corrected the blanket normal-MET claim with reduced current amplitude/sensitivity and preserved adaptation. Limited developmental double-null and conditional-model transfer, corrected Y137C human-allele context, and separated general care from unmeasured genotype-specific outcomes. No infectious or environmental disease entry reviewed.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 30 (DFNB30)'
  details: |
    De-novo curation of DFNB30 (MONDO:0011774), biallelic MYO3A. Four-node pathograph: MYO3A loss of function -> failure of myosin IIIa delivery to stereocilia tips -> disordered stereocilia and hair bundle architecture -> progressive hair cell degeneration, feeding five wired phenotypes (progressive SNHL, postlingual onset, congenital profound, high-frequency-predominant configuration, vertigo). Nine PMIDs cited, 41/41 snippets verified against the local cache, no DOI-only citations. Human evidence is three reports totalling ~30 patients, so every frequency band carries its numerator/denominator in notes. Mechanism evidence is mouse and cell culture and is graded MODEL_ORGANISM/IN_VITRO with directness INDIRECT where it supports a human claim. Three negative or contradicting results are curated as REFUTE items rather than dropped: espin-1 still reaches stereocilia tips in the class III myosin double knockout, congenital onset refutes obligate postlingual onset, and both a formally examined DFNB30 patient and the knock-in mouse have normal vestibular function against the reported vertigo. Three discussions record the open questions (unassessed retinal involvement despite strong retinal MYO3A expression, the in-vitro/in-vivo mismatch in the espin-1 transport model, and the unresolved kinase-domain genotype-phenotype proposal). A Falcon deep-research report is committed alongside; preflight-dr PASS with MYO3A mentioned 52 times, reference validation 8/8 verified with 0 confabulation.

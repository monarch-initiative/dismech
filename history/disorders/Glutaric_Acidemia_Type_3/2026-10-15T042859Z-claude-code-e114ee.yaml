  summary: Review rounds 1-2 and OpenScientist deep-research reconciliation
  details: |
    Review round 1: added reference_title to every evidence item, each copied from the title frontmatter of its references_cache file (commit e30f152e1).

    Review round 2: linked the Sugct knockout mouse to the SUGCT Loss of Function node with relationship RECAPITULATES (fidelity MODERATE), and added a limitations note to its Gut Bacterial Glutarate Production link stating that the study reports dysbiosis as a consequence of SUGCT loss, the reverse direction of the entry's bacteria-to-glutarate edge, so that link does not support the edge (commit 2ee7cbca4). The genetic record keeps relationship_type CAUSATIVE although ClinGen rates SUGCT-GA3 Moderate; the record's notes explain that CAUSATIVE refers to the biochemical trait that defines the disorder, not to any clinical illness, and the ClinGen Moderate assertion is recorded under gene_disease_validity.

    Deep research: Falcon was unavailable. The Asta report was off-topic and was not committed. A claude_code report was produced without PubMed access and was not committed. The first OpenScientist run hit the provider's one-hour timeout. A second OpenScientist run completed (16/16 references resolved; one unresolved term, CHEBI:45009, which was not bound) and is committed with its citations file and artifacts.

    Reconciliation against that report. Added two evidence items to the controversy_ga3_clinical_significance discussion, both from references the entry already cites: PMID:39101156 ('GA III has historically been considered clinically benign, with few reported cases.') and PMID:31722069 ('patients remain largely asymptomatic despite high levels of glutarate in the urine'). Both are graded HUMAN_CLINICAL with quote_role BACKGROUND, since each sentence states the human clinical picture in the paper's framing rather than reporting the paper's own result; 31722069 is a mouse study.

    Left out, and why. The eight PMIDs the report cites that the entry did not: 17879145, 20923787, 21431622 and 27853989 are about glutaric aciduria type 1 (pathogenesis and management guidelines), which the report itself uses only as contrast. 26098869 (pancreatic cancer GWAS) and 41733842 (frailty GWAS) report common-variant associations at the SUGCT locus, which are not the Mendelian disorder. 38228059 is a chicken selection scan. 35500672 is a GC-MS method for separating 2- and 3-hydroxyglutarate whose abstract does not mention GA3. The report's gnomAD constraint figures, carrier-frequency estimate (about 1 in 440) and biallelic birth-prevalence estimate are the provider's own calculations with no citable source, so no number was taken from them. Its statements that tandem-MS acylcarnitine newborn screening misses GA3 and that lysine restriction is rational were not added because the report gives no source that states them. The ClinVar counts and the PDB structure identifiers were also not added. Everything else in the report was already in the entry.

    Validation: just validate, count-verified-snippets (50/50), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-retired-support-prose, normalize-cache, validate-disorders all passed; check-gene-activity-grounding reports nothing for this entry.

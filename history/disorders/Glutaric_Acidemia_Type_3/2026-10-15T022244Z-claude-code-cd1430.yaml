  summary: 'Create: Glutaric_Acidemia_Type_3'
  details: |
    New entry for glutaric acidemia type 3 (MONDO:0009283, SUGCT), claim issue #14246. Lump/split decision: DISEASE. MONDO carries a dedicated term with a causal gene, ClinGen has a gene-disease validity curation for exactly this MONDO term, and the disorder is a distinct biochemical entity separate from GA1 and GA2; the clinical-significance question is recorded as a CONTROVERSY discussion rather than resolved by declaring the term out of scope. Deep research: falcon was requested but failed authentication (503) twice, including with --fallback, which did not fall back; a claude_code report was then generated, but its own text states that PubMed access was denied, that it made one web search, and that it gives no verified quotes; its 4 cited PMIDs were all found independently and are used here. The report was not committed because it contributes no content beyond those identifiers. Literature research was therefore done directly through PubMed search (SUGCT, glutaric aciduria type 3/III, C7orf10). just preflight-dr was not run because the local MONDO build is absent and the shared disk was too full to download it; the report is plainly about SUGCT/GA3. Pathograph: SUGCT loss of function -> impaired glutarate re-esterification -> free glutarate accumulation and urinary loss -> glutaric aciduria; lysine/tryptophan catabolic flux and gut bacterial glutarate production feed the accumulation node. Gastrointestinal symptoms (episodic vomiting) hang off an EMERGING mechanistic hypothesis with causal_link_type UNKNOWN because attribution to GA3 is unproven. ClinGen Moderate tier copied from its CGGV record; relationship_type kept CAUSATIVE with a note explaining it refers to the biochemical trait. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, validate-disorders.

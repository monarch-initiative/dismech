  summary: 'Create: 2-Aminoadipic 2-Oxoadipic Aciduria'
  details: |
    Created the entry for MONDO:0008774 (DHTKD1, autosomal recessive) from the skeleton, using the claude_code deep-research report (research/2-Aminoadipic_2-Oxoadipic_Aciduria-deep-research-claude_code.md) as the lead source and the cached abstracts as the evidence source. Curated: AR inheritance with clinical penetrance recorded as UNKNOWN; DHTKD1 genetic record with ClinGen Definitive gene_disease_validity (CGGV assertion fetched into references_cache) and three named variants; a nine-node pathograph (DHTKD1 loss of function, defective E1a incorporation into the OADH complex, loss of 2-oxoadipate dehydrogenase activity, lysine/hydroxylysine/tryptophan flux, impaired decarboxylation to glutaryl-CoA, 2-oxoadipate/2-aminoadipate/2-hydroxyadipate accumulation, residual OGDH decarboxylation) wired to the four biochemical HPO phenotypes; neurodevelopmental phenotypes recorded as reported associations with a single UNKNOWN edge scoped to an EMERGING hypothesis (amoxad_metabolite_neurotoxicity) carrying both supporting and refuting evidence; three mechanistic hypotheses; three CHEBI-bound biochemical markers; diagnosis, differential diagnoses (vigabatrin, Kearns-Sayre, GA1, hyperlysinemia); treatments stated as non-specific (lysine restriction, B6/B1, genetic counselling) with REFUTE evidence where trials failed; three mouse models; six discussions (clinical significance controversy, CMT2Q allelic relationship, knockout-mouse discordance, DHTKD1 inhibition for GA1 and OGDH compensation, cardiometabolic 2-aminoadipate signal, diagnostic confounders in pre-2012 case reports). The allelic dominant CMT2Q is left to its existing subtype in Charcot-Marie-Tooth_Disease_Type_2. No GeneReviews chapter exists (check-genereviews: NO_CHAPTER). Not used as evidence: PMID:4442872, 3930865, 1527995, 10503694 and 11596655 (no retrievable abstract); the deep-research quote attributed to PMID:25860818 (it belongs to PMID:32303640 and was not reused); the report's isolated-aminoadipic and N-acetyl-aminoadipate items beyond a note; off-topic eosinophilic esophagitis and ALS associations. Fetched PMID:26708453, 1112065, 35721081 and the ClinGen CGGV record. Validation: just validate, count-verified-snippets (117/117), validate-terms, entity-ref, causal-target, name-collision, enum, duplicate-key, coarse-phenotype, cache-order, GeneReviews, block-scalar and logical-rule checks all pass.

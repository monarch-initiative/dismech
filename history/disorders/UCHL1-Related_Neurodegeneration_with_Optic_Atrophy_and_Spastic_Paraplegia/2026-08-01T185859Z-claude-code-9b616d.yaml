  summary: 'Create: UCHL1-Related Neurodegeneration with Optic Atrophy and Spastic
    Paraplegia'
  details: |
    De-novo curation of MONDO:0014209 / OMIM 615491 / Orphanet:352654, curated as the UCHL1 recessive entity SPG79B. Causal gene UCHL1 established BEFORE deep research on three independent anchors: the MONDO RO:0004003 relationship to HGNC:12513, the NCBI MedGen C3809665 definition of OMIM 615491 as SPG79B, and the index primary report PMID:23359680. NEC preflight passed; the descriptive MONDO label was treated as high-risk and the entry was positioned explicitly against Behr syndrome, autosomal dominant optic atrophy, Friedreich ataxia, PLA2G6 neurodegeneration and the other hereditary spastic paraplegias. Deep research was run with Edison/falcon and read in full; its report was UCHL1-centred and NEC-clean, and was used only as leads. Every PMID was fetched with just fetch-reference and every snippet verified as an exact substring of the cached abstract. Pathophysiology chain: biallelic UCHL1 loss of function to failure of neuronal ubiquitin recycling to impaired ubiquitin-dependent protein turnover to dying-back axonal degeneration, branching to retinal ganglion cell, cerebellar, dorsal column and corticospinal degeneration. Two module conformances declared, the peripheral-axonal one with an explicit caveat that only its axonal arm applies. Twenty phenotypes, five variants, a three-phase progression, one animal model, three differential diagnoses, one EMERGING mechanistic hypothesis on the UCH-L1 activity window and one HUMAN_MODEL_MISMATCH discussion about the mouse-only neuropathology. A pre-PR red-team review was run with the dismech-pr-review skill and all of its CRITICAL and IMPORTANT findings were fixed: a Bishop 2016 snippet that clipped off a negation and inverted the source meaning; peripheral neuropathy resting on cross-arm dominant-cohort evidence when recessive-specific full text was already cached; six missing phenotypes recoverable from that same full text, notably loss of ambulation and cognitive impairment; a gad-mouse snippet that did not carry the protein-turnover claim its explanation made; and the absent progression section. Also corrected: a hyperreflexia assertion that the source contradicts, since reflexes are reduced or absent from the superimposed neuropathy; prevalence class moved from a numeric Orphanet band to ULTRA_RARE; hypertrophic cardiomyopathy onset moved to YOUNG_ADULT; and PARK5 explicitly scoped out. Validation: just validate, just validate-terms and just validate-references all pass, with 85 of 85 snippets verified. No GeneReviews chapter exists for UCHL1 or SPG79. Frequency bands are given only where a published count exists, and the one quantified dominant-cohort series is marked PARTIAL and cross-arm.

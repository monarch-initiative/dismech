  summary: 'Address automated review on PR 7766: frequency-band denominators and cached
    full-text harvest'
  details: |
    Addressed three blocking evidence-hygiene findings from the automated reviewer, all fixable from the cached full text of PMID:32656641. First, the stale notes paragraph claimed frequency was omitted throughout while five phenotypes carried bands; it is replaced by a paragraph stating the real policy, namely that every band derives from Table 1 of PMID:32656641, which pools all ten patients across the four published SPG79B families, and listing each band with its denominator. Second and third, Loss of Ambulation and Cognitive Impairment carried bands bound to snippets that counted something other than the phenotype in question. Both now quote the Table 1 row for that specific feature, verified against the cache with whitespace normalisation. Auditing the remaining bands for the same defect class found it in three more places: Peripheral Neuropathy, Seizures and Ophthalmoparesis all rested on aggregate sentences. Each now carries its own Table 1 row, and the aggregate sentences are retained as association evidence with an explicit note that they do not carry the band. All five band values were numerically correct and none needed changing. Cognitive Impairment additionally gains a REFUTE evidence item quoting the normal cognition observed in both index siblings, since that variability is real and was previously invisible. Suggestions applied: added Nocturnal Hypoventilation as a phenotype with the matching non-invasive-ventilation treatment; added the ACE-inhibitor plus beta-blocker cardiomyopathy pharmacotherapy, scored PARTIAL because both patients still died suddenly; added scoliosis surgery; added the normal metabolic and CSF panel as a diagnostic exclusion; added nerve conduction studies with the documented caveat that foot deformity can make testing technically impossible; populated UBERON locations on the four tissue-level pathophysiology nodes; and tagged the class-level GeneReviews chapter PMID:20301682 with an explicit scope caveat that it covers pure rather than complicated HSP and that no clinical claim is drawn from it. Validation: just validate, just validate-terms, just validate-references and just validate-history all pass, with 98 of 98 snippets verified.

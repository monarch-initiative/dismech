  details: |
    New entry for Bartsocas-Papas syndrome 1 (MONDO:0009901, RIPK4), curated from primary literature and Orphanet (ORPHA:1234, which also covers the CHUK form, as recorded in notes). The pathograph runs from biallelic RIPK4 loss of kinase activity through the p63-RIPK4-IRF6 axis and the Wnt and Hippo (LATS1/2) branches to defective keratinocyte differentiation, then periderm failure with epithelial fusion (pterygia, ankyloblepharon, oral synechiae, fused lips, syndactyly), appendage dysplasia (alopecia, eyebrows, eyelashes, nails), a mouse-derived barrier defect, and an explicitly unresolved craniofacial, limb and genital morphogenesis node. Node names reuse those of CHAND_Syndrome where the mechanism is the same; CHAND, Cocoon syndrome, Bartsocas-Papas syndrome 2, IRF6 dominant popliteal pterygium syndrome, AEC syndrome and autosomal recessive multiple pterygium syndrome (Escobar/lethal, fetal akinesia) are recorded as differential diagnoses. Perinatal lethality is recorded under progression because the HPO death terms are outside the PhenotypeTerm enum. One OpenScientist report was used (research/Bartsocas-Papas_Syndrome_1-deep-research-openscientist.md). Its 26 references all resolved and none was off topic; needs_review was set by term-label mismatches (HP:0010296, HP:0100333, HP:0000028, NCIT:C157866), and its stated Orphanet ID (1300), HGNC ID (6616) and the source for p.Ile121Asn were wrong, so none of its identifiers were copied. Claims taken from it were checked against the cited abstracts: dimerization-dependent kinase activity (PMID:29706531), the Wnt/DVL2 branch (PMID:23371553) and the LATS1/2 Hippo branch (PMID:40570855), plus oligohydramnios (PMID:18820389). Its surgical papers (PMID:39574490, 37008989, 38613612, 30807513) concern popliteal pterygium syndrome in general rather than BPS and were not used; PMID:40683865 (MFN2), 41002404 (review) and 28643456 (Irf6 rescue) were also not used. just preflight-dr exited 2 because no local MONDO build was present. GeneReviews: no chapter (check-genereviews --online). Validated with just validate, validate-terms, count-verified-snippets, the whole-repo gates in the brief, and validate-disorders.

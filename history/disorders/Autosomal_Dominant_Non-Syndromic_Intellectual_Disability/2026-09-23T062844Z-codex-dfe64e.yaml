  summary: Review dominant intellectual-disability mechanisms, cohort claims and subtype
    evidence
  details: |
    Substantive author-side review of the existing entry and all 18 subtype records. No prior REVIEW history was present. Infectious and environmental diseases/poisonings are outside this review campaign; this inherited neurodevelopmental category is eligible. Retained the existing class-level scope and recent MONDO/ClinGen subtype dispositions in accordance with the recorded scope discussion, rather than performing a separate Grouping migration.

    Corrected complete-penetrance and exclusively de novo/haploinsufficient claims; removed population prevalence and phenotype-frequency extrapolations from broader or selected cohorts. Distinguished dose loss from altered activity, added the AP2M1 endocytosis branch, and restricted premature spine maturation to the SYNGAP1 model. Adult SYNGAP1 restoration rescues selected outcomes, so the older mouse result cannot establish universally irreversible cognition or a human treatment deadline. Added the adult-restoration animal model and supported phenotype links; the remaining unlinked clinical features lack a resolved common causal path in this heterogeneous category.

    Read the whole entry, the matching Falcon scientific narrative and bibliography, every cited abstract/structured ClinGen summary, and relevant cached full-text methods, results and discussion. Particularly consequential full-text checks included SYNGAP1 discovery and adult restoration (19196676, 31025938), DDD ascertainment and modeling (28135719, 33057194), regulatory variants (36854624), CAMK2G (30184290), TLK2 (29861108), CIC (28288114), TRIO (27418539), TRIP12 (28251352, 36430143), HIVEP2 (27003583), TBL1XR1 (38378692), TAF4 (35904126), and the broader sequencing cohorts (25356899, 39528574). Read relevant sections of the cytoskeleton and chromatin reviews (34200511, 36743289). Independently retrieved the full ACMG 2021 guideline, general-ID StatPearls care guidance, and CAMK2A/CAMK2B primary PDF through just fetch-reference; the latter explicitly places migration assays in mouse embryos. Abstract-only caches were not represented as full texts; supplementary files were not independently retrieved.

    Full-text corrections include four de novo CIC cases plus transmission from a mosaic father, assay-specific TLK2 decay/escape, TRIP12 p.A761V uncertainty despite the abstract's pathogenic shorthand, excluded discovery outliers in the TRIP12 blood episignature, seven rather than eight TAF4 individuals with ID, and only one reported formal ADOS assessment in the original SYNGAP1 series. The 2011 SYNGAP1 replication is three variants in 60 additional selected cases, not a repeat of the original three-of-94 background statement. Removed the mixed-DD abstract yield whose percentages conflict with the article's results. ClinGen's CAMK2G Limited and DPP6 Disputed assessments remain explicit; AP2M1 cellular results do not establish a gene-wide mechanism.

    Eight-dimension research assessment: (1) phenotypes: retained core clinical manifestations, bounded subtype-specific findings and frequencies, and distinguished autistic behavior from formal ASD; (2) subtypes: reviewed all 18 identities and their clinical/evidence caveats, preserving pre-existing dispositions; (3) pathophysiology: retained representative synaptic, chromatin and cytoskeletal mechanisms while separating altered activity/endocytosis and a provisional regulatory hypothesis; subtype-level ubiquitin-proteasome and N-terminal acetylation descriptions are not forced into a universal causal chain; (4) treatments/trials: corrected counseling, rehabilitation and seizure-response claims, added explicit topiramate/valproate agents, and kept mouse restoration separate from clinical therapy; no class-specific trial with phase-II-or-later results was surfaced by the matching report; (5) genetics: distinguished inherited, mosaic, loss-of-function and altered-function variants, and prediction from functional assays; (6) diagnostics/biomarkers: preferred early ES/GS without making trios mandatory, corrected CNV and differential-diagnosis limitations, and bounded the blood episignature; (7) references: used relevant full texts and corrected source/claim mismatches, with titles on all added evidence; (8) consumption: the graph is intentionally representative of this heterogeneous category, and per-gene clinical scope is signaled rather than silently pooled.

    GeneReviews baseline check found NO_CHAPTER for the umbrella; no subtype GeneReviews chapter is being claimed as the umbrella baseline. General-ID StatPearls is tagged for orientation and care context, not substituted for a phenotype baseline. Quotation matching is supplemented by substantive source review; it does not by itself prove the claims. Schema, ontology, quotation, causal-target, entity-reference and history checks are recorded with the PR validation results. An independent PR review and CI remain separate from this author-side REVIEW record.

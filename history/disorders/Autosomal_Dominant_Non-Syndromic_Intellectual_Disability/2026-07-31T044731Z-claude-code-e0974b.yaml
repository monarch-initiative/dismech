  summary: 'Create: Autosomal Dominant Non-Syndromic Intellectual Disability'
  details: |
    De novo curation of MONDO:0015802 (autosomal dominant non-syndromic intellectual disability) as a genetically heterogeneous umbrella entity. Deep research provider: Edison/Falcon (research/Autosomal_Dominant_Non-Syndromic_Intellectual_Disability-deep-research-falcon.md; 542s runtime, 37 citations, 1 artifact). NEC preflight passed: the MONDO gene/OMIM/synonym anchors match the intended entity, and the curated parents match the MONDO is_a axis (MONDO:0000509 non-syndromic intellectual disability, MONDO:0100172 intellectual disability autosomal dominant). No GeneReviews chapter exists at this class level - gene-specific chapters exist for SYNGAP1 and STXBP1 but not for MONDO:0015802. Curated a 12-node pathograph spanning three convergent mechanism modules (synaptic transmission and plasticity, chromatin and transcriptional regulation, cytoskeletal/Rho-GTPase control of neuronal morphogenesis) converging on critical-window cortical circuit formation, with 10 causal genes: SYNGAP1, STXBP1, ZBTB18, GRIN2B, GATAD2B, MED13L, TRIO, CAMK2A, DLG4, KMT5B. The last three were added specifically to anchor the entry to the Open Targets gene set for this MONDO ID rather than to the general de-novo-ID literature. The unstable syndromic/non-syndromic boundary is modeled explicitly as a mechanistic_hypothesis with status EMERGING plus a CONTROVERSY discussion rather than asserted as fact; gene records that have migrated toward syndromic status (MED13L, TRIO, KMT5B) carry PARTIAL evidence with explicit caveats. An internal red-team review pass corrected the prevalence_class band to ABOVE_1_IN_1000, TRIO variant_origin to GERMLINE, five evidence_source misclassifications, one REFUTE-to-PARTIAL calibration, and a duplicated tissue-scale GO term on a molecular-scale node; it also split a bundled pathophysiology node into atomic Premature Dendritic Spine Maturation and Cortical Hyperexcitability nodes so the antiseizure-drug target_mechanisms edge attaches to the excitability half only. Two phenotype frequency bands that could not be reconciled across cited sources were deliberately omitted rather than guessed. Validation: just validate passes (schema, ontology terms, and references); reference validation was independently confirmed live by a deliberate-corruption probe; compliance 93.4 percent, weighted 93.7 percent.

  summary: Enumerate the gene-defined MRD subtype series under MONDO:0015802
  details: |
    Series-019 gene-defined subtype enumeration under MONDO:0015802 (issue 12226). Verified the parent anchor first: MONDO:0015802 is the correct umbrella for what this entry models (label, definition and the entry's own parents: list all agree), so the #12184 over-broad-anchor remedy does not apply and the anchor is unchanged. MONDO asserts 26 direct subclasses; five already have a home elsewhere in the KB and were deliberately not duplicated (MRD34, MRD52/ASH1L as standalone entries; IDD61 as MED13_Syndrome's disease_term; IDD62 as DLG4-Related_Synaptopathy's; MRD63 as a has_subtypes row on TRIO-Related_Neurodevelopmental_Disorder). Of the remaining 21, eighteen were added as has_subtypes rows with bound subtype_term, bound genes:, inheritance, sourced description and 53 exact-quote evidence items (ClinGen CGGV validity rows plus the defining primary series). Three were dispositioned elsewhere: CSS6/ARID2 routed to Coffin_Siris_Syndrome; MRD33/DPP6 declined as ClinGen-Disputed and recorded as a genetic: entry with relationship_type DISPUTED and four evidence items; MEF2C proposed as a standalone entry via a new stub. Reciprocal genetic[].subtype foreign keys added for ZBTB18, CAMK2A and KMT5B. Pathograph wiring: six pathophysiology nodes gained genes: descriptors (19 bindings) where the node's own description or the entry's existing cited evidence already named the gene; the entry previously bound no gene to any node. Added the adnsid_clingen_disease_concept discussion recording that sixteen of the 21 classes have a ClinGen curation and not one is curated against a concept labelled non-syndromic. All 21 MONDO term-to-gene pairs were cross-checked against the Monarch KG association API and agree with the local MONDO build and with HGNC symbol lookups; every one is biolink:causes.

  summary: 'Address PR review suggestions: regulatory enhancer DNMs, UBERON locations,
    Open Targets gene backlog'
  details: |
    Addressed the three optional blue-level suggestions from the automated review on PR #7323, which approved the entry with no critical or important findings. (1) Added the non-coding regulatory arm of the de novo trigger: extended the trigger node description to cover regulatory DNMs enriched in fetal-brain-specific enhancers, with three new evidence items from De Vas et al. 2023 (PMID:36854624, newly fetched and cached) covering the enrichment finding, the recurrently mutated enhancer clusters regulating CSMD1/OLFM1/POU3F3, and the CRISPR functional confirmation. The functional item is typed PARTIAL and the description states explicitly that the cohort is small and mixed developmental-disorder rather than AD-NSID-specific, so this is an emerging rather than established contributor. Modeled as part of the existing trigger node rather than a separate node because the downstream consequence (dosage perturbation of a constraint-intolerant neurodevelopmental gene) is identical and only the lesion type differs. (2) Added UBERON locations annotations: brain (UBERON:0000955) on the trigger node, hippocampal formation (UBERON:0002421) on Premature Dendritic Spine Maturation where the SYNGAP1 model evidence is hippocampal, and cerebral cortex (UBERON:0000956) plus hippocampal formation on Cortical Hyperexcitability and Impaired Cortical Circuit Formation. Deliberately left unannotated on the nodes where anatomy is not well-defined (haploinsufficiency, chromatin regulation, and the generic synaptic and cytoskeletal module nodes). (3) Added a KNOWLEDGE_GAP discussion adnsid_opentargets_gene_backlog recording the eight Open Targets associations for MONDO:0015802 not yet curated (TLK2, ASH1L, STAG1, CLTC, CIC, NAA15, TRIP12, SET), with a proposed experiment for deep-phenotype triage, so the scoping decision is an explicit auditable backlog rather than a silent omission. Validation: just validate passes (schema, terms, references); pathograph FK check clean at 9 nodes with no dangling refs; per-file pytest plus test_discussion_knowledge_gap_proposed_experiment_validates pass. Compliance moved from 93.4 to 92.4 percent, a denominator effect from the added discussion whose proposed_experiments lack datasets and evidence, matching the shape of the three pre-existing discussions.

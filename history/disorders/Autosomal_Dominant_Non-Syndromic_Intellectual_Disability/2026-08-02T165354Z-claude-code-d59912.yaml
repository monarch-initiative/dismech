  summary: Augment TRIO gene block with MRD63 macrocephaly arm and novel second-SH3-domain
    variant
  details: |
    Lit-scan follow-up for issue #6041. Added PMID:42421094 (Zhang et al., BMC Med Genomics 2026) to the TRIO gene block: three gene-level evidence items plus a new variants entry for NM_007118.4:c.7738A>T (p.Ile2580Phe) in the second SH3 domain, classified LIKELY_PATHOGENIC on in-silico/3D-modelling grounds only (that supporting evidence item is tagged COMPUTATIONAL and split from the HUMAN_CLINICAL case-report items). Extended the gene notes with a third boundary caveat: the TRIO head-size phenotype is domain-dependent and bidirectional (Rac-GEF/GEFD1 variants give MRD44 with microcephaly; second-SH3-domain variants correlate with MRD63 with macrocephaly), so TRIO is retained as a syndromic-boundary exemplar rather than a clean non-syndromic gene. Per the issue's scope constraint only the existing entry was augmented; a dedicated TRIO-related neurodevelopmental disorder entry modelling the MRD44/MRD63 split is recommended as a separate high_effort issue. Reference fetched with just fetch-reference; validated with just validate (schema + terms + references), 113/113 snippets verified against cached references.

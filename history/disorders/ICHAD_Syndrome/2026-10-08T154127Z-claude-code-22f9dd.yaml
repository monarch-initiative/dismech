  summary: 'Create: ICHAD_Syndrome'
  details: |
    New entry for ICHAD syndrome (MONDO:0979234; OMIM 621234), the syndromic disorder caused by de novo heterozygous dominant negative IKZF2 variants in the DNA-binding zinc fingers 2 and 3.

    Scope decision: kept as a standalone Disease. MONDO carries separate terms for the non-syndromic loss-of-function IKZF2 disorder (HELIOS deficiency, MONDO:0800139) and for IKZF2-related combined immunodeficiency (MONDO:1010177), and the ICHAD papers distinguish the dominant negative DNA-binding-domain variants from those alleles. Non-syndromic IKZF2 hearing loss (PMID:39406892, PMID:39754384) is also left out and described in notes. The two ICHAD papers describe two probands in total; PMID:40295428 is a follow-up immunology study of proband 1 from PMID:37316189, so no phenotype frequencies were assigned.

    Sources: the entry was first drafted from PubMed. Primary sources are PMID:37316189 (case series, functional IL2-promoter assays) and PMID:40295428 (immunophenotyping of proband 1). The hearing mechanism node uses the cello mouse study PMID:30464345 (MODEL_ORGANISM, marked HYPOTHETICAL) with human support from PMID:39406892. Several snippets are taken from the PMC full text of PMID:37316189 (clinical case descriptions), which the reference validator accepts. just check-genereviews reports NO_CHAPTER.

    Deep research: a falcon report was then run (research/ICHAD_Syndrome-deep-research-falcon.md; 7/7 references resolved, needs_review set only because the term validator read the placeholder 'if available' as the report's disease label). It agreed with the draft and surfaced four additions, each re-sourced from the fetched PMID:40295428 or PMID:39406892 caches: hypotonia, red blood cell transfusion for AIHA, the single-cell dataset GEO:GSE236159 (verified with just verify-datasets), and the observation that the hearing-only zinc finger 2/3 variants lack the dominant negative effect (recorded in notes). The image artifact's caption expands ICHAD incorrectly ('IKAROS-associated congenital hemolytic anemia') and was not used as evidence. just preflight-dr was not run because it requires the 1.3 GB local MONDO build and disk was limited; instead the report body was checked by hand and names IKZF2/HELIOS throughout, matching the MONDO causal gene.

    Validation: just validate, validate-terms, count-verified-snippets (43/43), verify-datasets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-gene-activity-grounding (against origin/main), check-coarse-phenotypes, check-snippet-length, check-title-snippets and validate-disorders all pass. Most phenotypes (craniofacial, athelia, developmental) are left without an upstream mechanism edge because no source describes how HELIOS dysfunction produces them.

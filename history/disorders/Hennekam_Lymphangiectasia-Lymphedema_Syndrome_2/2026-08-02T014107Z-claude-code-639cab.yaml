  summary: 'Create: Hennekam lymphangiectasia-lymphedema syndrome 2 FAT4'
  details: |
    De novo curation of FAT4-related Hennekam syndrome MONDO:0014454, OMIM 616006. Deep research via Edison falcon provider. Curated the FAT4/Dachsous1 planar-cell-polarity lymphatic-valve-morphogenesis mechanism, generalized lymphatic dysplasia, intestinal lymphangiectasia, lymphedema, facial gestalt, intellectual disability, and the allelic relationship to Van Maldergem syndrome. Key insight: the original 1989 Hennekam family PMID:2624276 was later shown to carry FAT4 mutations per Alders 2014 PMID:24913602, grounding the phenotype descriptions. Evidence: Alders 2014 PMID:24913602, Ivanovski 2018 PMID:29681106, Pujol 2017 PMID:28705793, Hennekam 1989 PMID:2624276. Validated with just validate; schema, terms and references all pass.

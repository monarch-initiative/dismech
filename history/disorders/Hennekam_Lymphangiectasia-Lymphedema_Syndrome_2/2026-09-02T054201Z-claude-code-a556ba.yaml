  summary: 'Augment: Hennekam lymphangiectasia-lymphedema syndrome 2'
  details: |
    Augmented an existing entry (created in PR #7834) rather than creating one; a duplicate preflight against origin/main found the file already present. Raised linkml-data-qc compliance from 88.1% to 99.1% (weighted 100%).

    Added: evidence on the 7 previously-uncited causal edges in pathophysiology[].downstream[]; evidence on the 2 uncited phenotypes (Hypoalbuminemia, Lymphopenia) and on both previously-uncited differential_diagnoses; and a new third differential, Hennekam lymphangiectasia-lymphedema syndrome 3 (MONDO:0032564, ADAMTS3-related). Converted DOI:10.1172/JCI99027 to PMID:32182215 so the gating reference validator snippet-checks it; no DOI-keyed references remain.

    Deep research: the committed falcon report for this disease predated report-level validation, so it was retro-fitted with 'just validate-research-reference' (7/7 references resolved, 0 unresolved, 0 off topic). An openscientist run was also launched for additional leads. New references fetched: PMID:18294365 and PMID:32182215.

    Judgment calls: datasets left empty, which is the one remaining compliance gap. All 7 'just discover-datasets' candidates were GENE_ONLY FAT4 studies in unrelated contexts (Ewing sarcoma, neuronal heterotopia, tuberculosis adipose tissue, nephron progenitors, ketogenic diet, tumor angiogenesis); none concerned lymphatic biology or Hennekam syndrome, so adding any would be the Named Entity Confusion failure that dataset relevance triage exists to prevent. PMID:18294365 is a review of primary intestinal lymphangiectasia (Waldmann's disease), not of Hennekam syndrome, so its six uses carrying the lymphangiectasia -> protein-losing enteropathy -> hypoalbuminemia/hypogammaglobulinemia/lymphopenia cascade are marked directness: INDIRECT, with each explanation naming the inferential step. Phenotype frequency was left unset because no source reports per-phenotype frequencies for this disorder. No GeneReviews article exists for Hennekam syndrome (PubMed search returned no hits), so that baseline step did not apply.

    Validation: just validate passed; just validate-terms passed; 43/43 snippets verified by just count-verified-snippets; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean.

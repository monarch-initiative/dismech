  details: |
    PR shepherd round addressing the ai4c-reviewer CHANGES_REQUESTED review and the merge conflict against main.

    Merge: main's deep-review pass (#10118) had edited the same entry. Resolved six conflict hunks preserving both sides - kept main's more careful explanations, its extra PMID:18294365 pyogenic-infection-risk evidence item and its genetic notes block; kept this PR's fuller PMID:18294365 snippets, its two new phenotypes (Camptodactyly, Generalized hypotonia) and its PMID:41992670 splice-variant evidence. Five references_cache add/add conflicts resolved to main's full-text versions; PMID_41992670.md regenerated with just fetch-reference.

    CRITICAL fix: the Van Maldergem differential asserted allelism with HKLLS2 via biallelic FAT4 while bound to MONDO:0011070 (van Maldergem syndrome 1), which is the DCHS1 form. Retargeted to MONDO:0014242 van Maldergem syndrome 2, the FAT4 form, and recorded in the description that VMS1 is the DCHS1-related form and not allelic to this entry.

    IMPORTANT fix: the PMID:32182215 snippet on the HKLLS3 differential began mid-clause at 'CCBE1) and ADAM metallopeptidase' with a dropped subject and an unbalanced parenthesis. Extended to begin at 'Hennekam syndrome is also caused by mutations in', which also makes it state outright that ADAMTS3 causes Hennekam syndrome.

    IMPORTANT fix: added the missing brain/Hippo-YAP arm from PMID:24056717 - two pathophysiology nodes (Dysregulated Hippo-YAP signaling in cortical neural progenitors, Periventricular neuronal heterotopia) wired from the root FAT4 loss node and downstream to Intellectual disability and Seizure, which were pathograph orphans. Mouse and human evidence split into separate items by evidence_source; the heterotopia-to-ID and heterotopia-to-seizure steps are marked INDIRECT because this paper does not measure them.


  summary: 'Augment: HKLLS2 openscientist findings and red-team review fixes'
  details: |
    Second round on the same session. Two inputs: an openscientist deep-research run that completed after the first commit, and a red-team review of that commit run against the dismech-pr-review skill.

    From the openscientist report (19/19 references verified, 18/18 quotes valid, 0 unresolved, 0 confabulation; its 8 'mislabelled' terms are a benign artifact where the report emitted category names such as 'Lab abnormality' in the label position, not wrong bindings): added Camptodactyly (HP:0012385) and Generalized hypotonia (HP:0001290) phenotypes, plus a genetic evidence item extending the FAT4 allele spectrum to splice site variants, all citing PMID:41992670. That 2026 case report postdates the falcon report and is molecularly confirmed HKLLS2, which is why it is usable for disease-specific phenotype claims.

    Deliberately NOT taken from that report: hearing loss, which the report itself flags as 'more typical of VMS'; and PMID:25616299, a clinically but not molecularly diagnosed Hennekam case, so it cannot support HKLLS2-specific claims. PMID:26686525 was likewise rejected as a CCBE1 (HKLLS1) kindred, not FAT4. These are Named Entity Confusion risks arising from the allelic Van Maldergem phenotype and the sibling molecular forms.

    From the red-team review, three claim/evidence-fit defects fixed. (1) The explanation on the 'Impaired lymphatic valve morphogenesis' -> 'Generalized lymphatic dysplasia' edge described the upstream edge instead of the one it sat on; reworded to name the actual endpoints and marked directness: INDIRECT, since it is a mouse result cited for a human causal step. (2) Two explanations on the PMID:29560340 edges said the source 'attributes' lymphangiectasia and lymphedema to lymphatic malformation, when the abstract only states the two adjacently; reworded to own the inference and marked directness: INDIRECT, also noting the cited patient was clinically rather than molecularly diagnosed. (3) The six PMID:18294365 snippets began mid-sentence, dropping the subject 'Primary intestinal lymphangiectasia (PIL) is a rare disorder characterized by'; extended so the quote itself discloses the source disease and the INDIRECT grade is self-evident.

    Also removed references_cache/DOI_10.1161_atvbaha.117.309818.md, a byproduct of the retro-fitted report validation that duplicated DOI_10.1161_ATVBAHA.117.309818.md in different casing and would collide on a case-insensitive filesystem; the two differed only in the DOI string and neither is referenced by any KB entry. Kept the uppercase form, which matches the other ATVBAHA cache filenames. Cited the previously unsupported ADAMTS3/VEGF-C mechanism claim in the HKLLS3 differential description with PMID:32182215.

    Not fixed: the retro-fitted Reference Validation table in the falcon report reads 7 weighed, 5 on topic, 0 off topic, which does not sum. That table is generated by linkml-reference-validator, not hand-written, so it is reported rather than edited.

    Validation after fixes: just validate-disorders passed (the batched gate CI runs); 47/47 snippets verified; just validate-terms passed; compliance 99.2% global, 100% weighted; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean.

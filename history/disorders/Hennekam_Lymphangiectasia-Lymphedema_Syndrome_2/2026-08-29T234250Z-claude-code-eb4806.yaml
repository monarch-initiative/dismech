  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review of an IUIS Table 2 entry, reviewed as a sibling pair with HKLLS1 (CCBE1). PRIMARY GAP, shared with the sibling entry: Hypoalbuminemia and Lymphopenia carried NO evidence at all. Fetched ONE new reference, PMID:18294365 (Vignes & Bellanger, primary intestinal lymphangiectasia), and evidenced both plus corroborated hypogammaglobulinemia, with every explanation stating that the source covers primary rather than FAT4-related lymphangiectasia and is cited for the shared downstream mechanism only. Added the same infection-risk nuance as the sibling entry: lymphopenia and hypogammaglobulinemia in intestinal lymphangiectasia coexist with a pyogenic infection risk that is not significantly elevated, so the description now frames this as a quantitative loss rather than a functional immunodeficiency. DEFECT FIXED: the Dietary management treatment's sole evidence item quoted the TITLE of the 1989 clinical report (PMID:2624276) as its snippet. The title describes the syndrome and says nothing whatever about diet, so the explanation did not follow from the quote - a title used as a finding, which the references SOP explicitly warns against. It was grandfathered in the title-snippet baseline and so was not being caught. Replaced with three substantive quotes from PMID:18294365 covering the regimen, its mechanism (withholding long-chain fat prevents lacteal engorgement and rupture; MCTs are absorbed via the portal circulation and bypass the lacteals), and the finding that dietary control must be permanent because abnormalities recur on withdrawal. SIBLING SCOPE DISTINCTNESS: added genetic notes setting out how FAT4 divides the Hennekam population from CCBE1 - CCBE1 accounts for about 25%, and FAT4 was then sought specifically within the CCBE1-negative remainder (four further families from a cohort of 24 CCBE1 mutation-negative patients), so the two fractions add rather than compete and a substantial share remains unexplained by either. NOT DONE, deliberately: a secondary source (PMID:29560340) puts the FAT4 share at about 20%, but the sentence carrying that number is broken in the cached text by an inline citation marker (stripped from the query side but not from the cache) and a hyphenated line break, so no exact substring can carry it. A case_fractions record was drafted and then withdrawn rather than anchored on an unverifiable snippet; the notes record both the figure and why it is not quoted as evidence. Also added a quantified seizure frequency (about 33%, FREQUENT), flagged in its explanation as an all-subtypes figure rather than FAT4-specific. Snippets 26 -> 37, all verified; all validation gates pass.

  summary: 'Create: DEGCAGS_Syndrome'
  details: |
    De novo curation of DEGCAGS syndrome (MONDO:0859181, ZNF699, OMIM 619488) for claim issue #10766. Deep research was requested from falcon, which was not configured (no EDISON_API_KEY); the run used --fallback and OpenScientist produced the report (research/DEGCAGS_Syndrome-deep-research-openscientist.md, fell_back recorded in frontmatter). All 15 of its citations resolved; three general KRAB-ZFP retrotransposon papers it flagged off-topic were not used, and its one obsolete term (GO:0006306) was not bound. The report cited the same primary DEGCAGS literature found by a direct PubMed search (esearch for DEGCAGS OR ZNF699), so the entry was built from that literature: the founding report PMID:33875846 (full text cached, including the Table 1 HPO inventory for all 13 patients), the 14-patient frequency synthesis PMID:35205213 (full text), the 30-patient epigenomic cohort PMID:39424669 (abstract only), and the ocular (PMID:38014480), airway (PMID:41205195), immunological (PMID:42534679) and oro-dental (PMID:42569837) case reports. The KRAB-KAP1 structural paper PMID:36341546 was taken from the report as INDIRECT IN_VITRO evidence on the emerging epigenetic-mediation hypothesis. PMID:40790844 (hematology, no cached abstract) is listed in references only; PMID:42527142 (Chinese case report) fetched empty and is mentioned in notes only. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER), no Orphanet entry or ClinGen assertion in the structured caches. Pathograph: five nodes (biallelic ZNF699 LoF; aberrant genome-wide DNA methylation; disrupted embryonic organ morphogenesis; impaired neurodevelopment; impaired hematopoiesis and lymphocyte development), with the methylation node's outgoing edges tagged to an EMERGING mechanistic hypothesis rather than asserted. After a pre-PR red-team review round (independent agent running the dismech-pr-review checklist; nine IMPORTANT findings, all taken: Synophrys split from Thick eyebrow, Immunodeficiency HP:0002721 added so the single-patient Combined immunodeficiency drops to VERY_RARE, single-patient immune and lung findings set VERY_RARE, hypotonia-to-ptosis sequela and morphogenesis-to-IUGR edge removed, KRAB-domain sentence regraded OTHER/BACKGROUND with the AlphaFold sentence added as COMPUTATIONAL, hangover orthology softened and PMID:16940975 cited, Polyhydramnios and Premature birth added; GO:0006325 swapped for GO:0040029 on the methylation node, NCIT:C15709 Genetic Testing on the molecular-diagnosis entry) the entry has 49 phenotypes, 42 causally connected; Neonatal respiratory distress, Premature graying of hair, Ptosis, Retinal vascular tortuosity, Intrauterine growth retardation, Polyhydramnios and Premature birth deliberately left unconnected. Six reference caches the research run fetched but the entry does not cite (PMID:21791101, 21876767, 22496453, 29482634, 30846446, 42527142) were not committed. Death in infancy (HP:0001522) was dropped as a phenotype because it is outside the PhenotypeTerm enum; infant mortality is recorded in the description and a KNOWLEDGE_GAP discussion. HP:0000062 Ambiguous genitalia was chosen over the sex-specific HP:0000033 after term validation flagged the label. Validation: just validate, validate-terms, count-verified-snippets (156/156), check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-reference-titles, check-coarse-phenotypes and check-genereviews all pass; just validate-disorders run once at the end (result recorded in the PR).

  summary: 'Create: Childhood Absence Epilepsy'
  details: |
    De-novo curation of childhood absence epilepsy (CAE, MONDO:0010826), a genetic generalized epilepsy and pediatric-epilepsy gap entry. Granular unbundled pathophysiology: genetic susceptibility (CACNA1H T-type, GABRG2/GABRB3 GABA-A) -> enhanced thalamic T-type calcium current + aberrant thalamic GABAergic inhibition (de-inactivating T-type) -> abnormal thalamocortical oscillation/hypersynchrony (conforms epilepsy module) -> bilateral generalized 3-Hz spike-wave -> absence seizures (conforms). Also conforms T-type node to Ion Channel and Synaptic Dysfunction. Evidence: Vitko CACNA1H functional/modeling (PMID:15888660), Wang CaV3.2 (PMID:26220996), Liang CACNA1H association (PMID:17156077), Wallace GABRG2 (PMID:11326275), Glauser NEJM CAE trial (PMID:20200383), Caplan comorbidity (PMID:18557780). SLC2A1/GLUT1 phenocopy captured in genetic + discussion. Three KNOWLEDGE_GAP discussions: T-type-vs-GABA primary driver, GLUT1 subset recognition/ketogenic diet, attention/cognition mechanism. claude_code deep research used as leads; NEC preflight confirmed report matched MONDO:0010826. All snippets verified as exact substrings; schema + term validation pass.

  summary: 'Genetics pass: wire the GABA-A and GLUT1 genes and add the GABRG2 subtype
    row'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). Two gaps, both closed. On the gene side, three GABA-A receptor subunit genes (GABRG2, GABRB3, GABRA1) were bound in the genetic section but reached no mechanism node, and SLC2A1 had no node at all; genes wired 1/5 to 5/5. The three subunits are now genes descriptors on the Aberrant Thalamic GABAergic Inhibition node, which gains a GO:0004890 GABA-A receptor activity binding carrying modifier ABNORMAL rather than INCREASED or DECREASED, because the two lines of evidence point opposite ways: the CAE-associated beta-3 variants reduce GABA-evoked current in heterologous expression, while extrasynaptic tonic GABA-A inhibition is increased in thalamocortical neurons across absence models. Both results are cited on the node. SLC2A1 gets a new node, Reduced GLUT1-Mediated Glucose Transport into Brain, with GO:0055056 D-glucose transmembrane transporter activity DECREASED; the obsolete GO:0005355 was rejected on lookup. On the phenotype side, the cascade ended at a pathophysiology node named Absence Seizures with nothing downstream of it, so no phenotype had an incoming causal edge; phenotype causal inlink 0/6 to 5/6. The sixth, the attention and behavioural comorbidity, is deliberately left unwired and an entry-level notes field records why: its source is cross-sectional and establishes the association without its direction. The series row MONDO:0011891 is curated as a has_subtypes row. Its primary MONDO label is "febrile seizures, familial, 8", which is misleading here: its definition opens "A childhood absence epilepsy that is characterized by mutations in the GABRG2 gene", childhood absence epilepsy is one of its three is_a parents, and its synonyms include ECA2 and "GABRG2 childhood absence epilepsy". Validation on the committed tree: just validate 0 issues, validate-terms passed, 48/48 snippets verified.

    Self-review round, same session: the GLUT1 node's description asserted that GLUT1 is a facilitative transporter carrying glucose across the blood-brain barrier and that reduced function produces a chronic cerebral energy deficit. Neither cited source says any of that - they establish the gene-transporter identity, the reduced protein function, and the low cerebrospinal fluid glucose, and nothing more. The description was rewritten to those claims and now states explicitly that the transport route and an energy-deficit mechanism are not modelled here because the sources state none. Snippets after the round: 48/48.

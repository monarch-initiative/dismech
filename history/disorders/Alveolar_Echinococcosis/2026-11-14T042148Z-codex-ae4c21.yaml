  summary: 'Create: Alveolar echinococcosis'
  details: |
    Created a MONDO:0017282 Alveolar_Echinococcosis entry and retired stubs/Alveolar_Echinococcosis.yaml.

    Scope: curated as the Echinococcus multilocularis clinical form of echinococcosis, parallel to the existing Cystic_Echinococcosis and Polycystic_Echinococcosis entries. The entry records a lump/split decision in notes: this disease is species-specific and clinically distinct, because E. multilocularis forms an infiltrative hepatic metacestode staged and managed like a malignant liver process, whereas cystic and polycystic echinococcosis have different Echinococcus agents and cycles.

    Content: added NCBITaxon-bound E. multilocularis as the infectious agent; a Canidae/Rodentia life cycle with OPL-bound adult-worm and egg stages; fecal-oral egg ingestion transmission; a rare Northern-Hemisphere prevalence record anchored in China-heavy review evidence; a pathograph from egg ingestion through hepatic metacestode establishment, infiltrative hepatic metacestode growth, biliary and vascular invasion, and metastasis-like spread; four hepatic/systemic phenotypes; ultrasound, serology, and PCR diagnosis rows; R0 surgical resection and benzimidazole suppressive therapy; immunosuppression as a predisposition/progression exposure; and malignant hepatic disease and cystic echinococcosis as high-stakes mimics.

    Sources: evidence was curated directly from PubMed caches generated with just fetch-reference. The core sources are current or recent AE reviews and a vascular-complication series: PMID:42676261, PMID:41754385, PMID:39311470, PMID:37567730, PMID:34524197, PMID:34161992, PMID:30755313, and PMID:28212790.

    Deep research: no generated research artifact was committed. An OpenScientist run through just research-disorder was attempted but automatic approval review rejected the external provider invocation because it could upload the local disease entry and context to an external service without specific authorization for that destination.

    Ontology: verified new bindings against OLS before use for NCBITaxon:6211 Echinococcus multilocularis, NCBITaxon:9608 Canidae, NCBITaxon:9989 Rodentia, HP:0002027 Abdominal pain, HP:0000952 Jaundice, HP:0001409 Portal hypertension, NCIT:C17230 Ultrasound Imaging, NCIT:C217458 Diagnostic Serology Testing, NCIT:C17003 Polymerase Chain Reaction, and CHEBI:6704 mebendazole. just validate-terms populated the generated NCBITaxon, organism enum, ChEBI, and chemical-entity enum caches.

    Validation: just validate-disorders kb/disorders/Alveolar_Echinococcosis.yaml passes; count-verified-snippets reports 34/34 verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-granularity, check-coarse-phenotypes, check-name-collisions, check-logical-rules, check-genereviews, check-cache-order, check-term-cache-integrity, and git diff --check pass.


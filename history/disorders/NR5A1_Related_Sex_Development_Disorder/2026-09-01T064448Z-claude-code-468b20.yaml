  summary: Curate 46,XY sex reversal 3 (MONDO:0013066) as the SRXY3 subtype
  details: |
    Curation target was the stub 46,XY sex reversal 3 (MONDO:0013066, OMIM
    612965, SRXY3). Recorded as entry_type SUBTYPE rather than a new disorder
    entry, and the stub was deleted.

    Lump/split reasoning. OAK against sqlite:obo:mondo shows MONDO:0013066 is a
    subclass of three terms this KB already curates: MONDO:1060211
    (NR5A1-related sex development disorder), MONDO:0010765 (46,XY complete
    gonadal dysgenesis) and MONDO:0016674 (46,XY partial gonadal dysgenesis).
    The latter two already carry NR5A1-specific has_subtypes blocks, so a
    standalone entry would have duplicated content across three parents.
    46_XX_Testicular_DSD.yaml already handles the parallel MONDO terms 46,XX
    sex reversal 3 and 4 as the SRXX3/SRXX4 subtypes, which fixes the shape
    used here. Placing it on the gene-axis parent also begins the has_subtypes
    structuring that entry's notes had deferred (issue 3310, open question 2);
    the 46,XX POI and 46,XX testicular/ovotesticular bins remain unstructured.

    Deep research. Requested provider was falcon, which returned 403 Failed to
    authenticate; deep-research-client providers --check reported falcon
    UNREACHABLE. Rather than substitute by hand, the run was repeated with
    just dr_fallback='--fallback' research-disorder falcon, which escalated to
    openscientist; that job timed out after 3600s and was cancelled, and
    because the failure surfaced as a ValueError the fallback chain ended
    before reaching claude_code. claude_code was therefore invoked explicitly
    as a third attempt and produced the report used here,
    research/46_XY_Sex_Reversal_3-deep-research-claude_code.md (12 web
    searches, 16 turns, 45 citations). The report carried no validation
    sections, so both were retro-fitted with just validate-research-terms and
    just validate-research-reference. Term validation: 35 checked, 33 resolved,
    0 unresolved, 0 mislabelled, 2 unverifiable (OMIM has no resolver).
    Reference validation: 28 checked, 28 resolved, 0 unresolved, 0 off topic;
    1 quoted claim checked and not found, which is the report quoting
    PMID:17200175's title as though it were a sentence. No content was taken
    from that quote.

    Named Entity Confusion found in the report. Three of its nine PMIDs
    (21129722, 28504475, 35290982) are MAP3K1 papers. MAP3K1 is SRXY6 (OMIM
    618973), not SRXY3, and the report flagged the risk itself in its section 1
    before nonetheless citing them. None were used. The trap is now recorded in
    the SRXY3 subtype's review_notes so the next curator does not fall into it.

    A separate hazard worth recording: four PMIDs recalled from model memory
    during early scoping resolved to entirely unrelated papers (20674172 TiO2
    nanoparticles, 11994345 adipose IL-6, 8033209 Fmr1 knockout, 17179197 a
    PCOS review). All were caught by fetching before use, nothing from them
    reached the entry, and their cache files were deleted. Every citation in
    this edit was instead found by PubMed esearch and verified against the
    cached abstract.

    What was added to kb/disorders/NR5A1_Related_Sex_Development_Disorder.yaml:
    the SRXY3 has_subtypes entry bound to MONDO:0013066 with NR5A1, sex-limited
    dominant inheritance and five evidence items; a pathophysiology node
    'Sertoli-cell AMH failure and Mullerian duct persistence' (GO:0001880,
    CL:0000216) wired downstream of the 46,XY testicular dysgenesis node, plus
    new edges to the genital phenotypes and to germ-cell tumour risk; four
    phenotypes (HP:0008730, HP:0034546, HP:0000047, HP:0010788) and
    subtype: SRXY3 tags on the three existing 46,XY phenotypes; two progression
    phases covering neonatal undervirilization and spontaneous pubertal
    virilization; an orchidopexy-plus-tumour-surveillance treatment; a
    subcellular-mislocalization loss-of-function mechanism on the
    haploinsufficiency node (PMID:29190620, from the report); and the
    GeneReviews baseline PMID:20301714.

    Scope boundary. Azoospermia and Oligozoospermia are deliberately left
    untagged because isolated NR5A1 spermatogenic failure is a separate OMIM
    entity (SPGF8) and is not within MONDO:0013066.

    Known gap, not filled. The report describes streak gonads in the complete
    form and anorchia/vanishing testes at the mild end. Neither was added: no
    cached reference yields an exact quote for either in an NR5A1 46,XY
    context, and manufacturing one is precisely the failure the evidence SOP
    forbids. Both are good candidates for a follow-up with a dedicated source.
    PMID:10369247 (Achermann 1999, the founding SRXY3 report) has no abstract
    in PubMed, so it remains cited in notes for historical provenance only and
    carries no snippet.

    GeneReviews baseline. PMID:20301714 'Nonsyndromic Disorders of Testicular
    Development Overview' is the applicable chapter and is now tagged
    GeneReviews in the top-level references. Its PubMed record contains only
    the chapter's scope statement, not Clinical Characteristics, so it supplied
    no phenotype snippets; phenotype coverage came from the primary literature
    instead.

    Validation. just validate passes (schema clean, term validation passed,
    60/60 snippets verified against the local cache). Also run and clean:
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, and the batched just validate-disorders.
    Weighted compliance rose from 84.8% to 88.5%.

  summary: "Address ai4c-reviewer REQUEST_CHANGES on PR 10349 (four IMPORTANT items)"
  details: |
    The automated reviewer returned REQUEST_CHANGES with four IMPORTANT items and
    no CRITICAL ones. All four were valid and all were fixable from references
    already cached in the PR. Every quote was re-verified against the cache
    before use.

    Item 1, bundled pathophysiology node. 'Sertoli-cell AMH failure and
    Mullerian duct persistence' conjoined two mechanistic steps at two
    biological scales and was tagged TISSUE, which fits only the second half.
    This is the single-value-discipline signal CLAUDE.md describes. Split into
    'Sertoli-cell AMH transcription failure' (CELLULAR, CL:0000216, GO:0006357
    DECREASED) and 'Mullerian duct persistence' (TISSUE, GO:0001880 DECREASED),
    joined by a downstream edge, with the human AMH-transcription evidence on
    the first node and the two mouse Mullerian-persistence snippets on the
    second. The incoming edge from the 46,XY undervirilization node was
    retargeted to the first node; check-causal-targets confirms nothing dangles.

    Item 2, genetic section depth. Added three evidence items: the recurrent
    p.Arg92Trp allele and the absence of genotype-phenotype correlation, both
    from the cached full text of PMID:28033660, plus an independent functional
    series reaching the same no-correlation conclusion (PMID:22549935). The
    gene-level notes now record variable expressivity within a pedigree and
    that genotype does not predict position in the SRXY3 range.

    Item 3, micropenis. The subtype description already named micropenis in the
    spectrum while no phenotype carried it. Added Micropenis (HP:0000054),
    subtype SRXY3, with two evidence items and a downstream edge from the
    undervirilization node.

    Item 4, biomarker join point for the new AMH mechanism. Added serum
    anti-Mullerian hormone (NCIT:C101737) and serum inhibin B (NCIT:C2278), both
    DECREASED, each with a readout targeting the new Sertoli-cell AMH node, from
    the PMID:34613524 measurement that both markers were below reference range
    in nine patients.

    Two NCIT codes recalled from model memory during this fix were wrong:
    NCIT:C81926 resolves to 'State Machine' and NCIT:C114812 to 'Childhood
    Pineoblastoma'. Both were caught by checking against OLS before validation
    and replaced with the searched terms above. This is the same failure mode
    that produced four bad PMIDs earlier in the session; ontology codes and
    identifiers in this domain should never be written from recall.

    Reviewer suggestion taken: the subtype review_notes now record that streak
    gonad (HP:0000813) and cryptorchidism (HP:0000028) were considered and
    deferred for want of a citable snippet, so the next curator does not
    re-derive the same dead end.

    Reviewer observation not acted on: references_cache/DOI_10.1093_hmg_ddz002.md
    is committed but cited nowhere in kb/. It is a MAP3K1 paper cached by the
    research report's own reference validation, and the reviewer confirmed no
    conflation occurred. Left in place because it belongs to the committed
    report's citation set.

    Validation after the fixes: just validate passes with 68/68 snippets
    verified; just validate-terms passes including the two corrected NCIT
    codes; check-causal-targets, check-entity-refs, check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-folded-hyphens,
    check-snippet-length, check-title-snippets and check-snippet-grading all
    clean. pytest tests/test_data.py passes 47178 tests on the pre-fix state and
    15747 selected subtype/entity-ref/causal/readout tests on the post-fix state.
- type: EDIT
  outcome: changed
  sections:
  - pathophysiology
  summary: "Fix evidence misattached to the wrong causal edge, and sharpen the AMH GO binding"
  details: |
    Two non-blocking notes from the approving re-review, both taken.

    The first was reported as a stale explanation on the new Micropenis causal
    edge and turned out to be a worse defect than that. Inserting the Micropenis
    edge immediately after the Hypospadias edge's causal_link_type line placed it
    ahead of the Hypospadias edge's evidence block, so that evidence detached
    from Hypospadias and reattached to Micropenis. The Hypospadias edge was left
    with no evidence at all, and the Micropenis edge carried an explanation
    written about hypospadias.

    Nothing caught this. The YAML stayed valid, the snippet was still an exact
    quote of a real paper, the reference title still matched, and
    check-causal-targets was satisfied because both targets resolve. An
    evidence item silently changing which claim it supports is invisible to
    every gate in the repo, which is worth knowing when inserting a list item
    directly above a sibling's child block.

    Fixed by restoring the evidence to the Hypospadias edge and giving the
    Micropenis edge its own item. The PMID:17200175 quote supports both claims,
    since the patient is described with a small phallus and penoscrotal
    hypospadias in one sentence, so each edge now cites it with an explanation
    naming the finding that edge asserts.

    The second note was the GO binding on the Sertoli-cell node. GO:0006357
    (regulation of transcription by RNA polymerase II) with modifier DECREASED
    is ambiguous, since it reads as a decrease in regulation rather than in
    output. SF-1 is a transcriptional activator of AMH, so GO:0045944 (positive
    regulation of transcription by RNA polymerase II) with DECREASED states the
    claim correctly: the activating input is what is lost. Label verified
    against OLS before binding.

    Validation: just validate passes with 69/69 snippets verified; term
    validation passes with the new GO term; check-causal-targets,
    check-entity-refs, check-enum-values, check-duplicate-keys,
    check-snippet-grading, check-folded-hyphens, check-snippet-length and
    check-title-snippets all clean.


  summary: 'Review publication readiness: Zimmermann-Laband Syndrome'
  details: |
    Full publication-readiness review emphasizing completeness and claim-evidence alignment. Added the three MONDO-defined gene-specific subtypes and mappings, structured Orphanet prevalence, explicit inheritance-source disagreement, core distal-phalanx, coarse-facies, and global-developmental-delay phenotypes, structured differentials, and updated oral-management evidence. Replaced 51 mostly uncited and biologically misgrouped causal edges with a focused evidence-bearing graph. The independent strict-audit correction replaced the provisional ATP6V1B2 assembly prediction with exact full-text p.Arg485Pro patient-fibroblast findings: gain of V-ATPase function, increased lysosomal acidification, abnormal lysosomal morphology and storage, impaired autophagic flux, and short or absent cilia. It also qualified subtype-specific claims, changed unsupported phenotype paths to unknown intermediates, conservatively connected increased KCNH1 activity to ciliary disruption using the authors' proposed route, added exact DDOD/DOORS distinguishing evidence while preserving MONDO:0007420 and the KCNK4 FHEIG mapping, mapped speech therapy to NCIT:C159273, and removed DIRECT assertions supported only by frequency or part-whole evidence. Downgraded the unsupported obligate frequency for gingival fibromatosis after identifying KCNN3-related twins without gingival overgrowth. Validated evidence snippets, ontology bindings, history, causal-edge coverage, and graph connectivity.

  summary: 'Review publication readiness: Zimmermann-Laband Syndrome'
  details: |
    Full publication-readiness review emphasizing completeness and claim-evidence alignment. Added the three MONDO-defined gene-specific subtypes and mappings, structured Orphanet prevalence, explicit inheritance-source disagreement, core distal-phalanx and coarse-facies phenotypes, structured differentials, and updated oral-management evidence. Replaced 51 mostly uncited and biologically misgrouped causal edges with 17 focused edges carrying exact-snippet evidence; marked the ATP6V1B2 route provisional and the KCNH1 ciliary/Hedgehog route as an emerging hypothesis. Downgraded the unsupported obligate frequency for gingival fibromatosis after identifying KCNN3-related twins without gingival overgrowth, and corrected the supportive oral-therapy target claim. Validated all evidence snippets and ontology bindings and reached 100% weighted compliance.

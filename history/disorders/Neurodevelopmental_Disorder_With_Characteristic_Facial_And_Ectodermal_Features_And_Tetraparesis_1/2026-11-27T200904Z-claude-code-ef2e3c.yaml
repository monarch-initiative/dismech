  summary: Address review on PR 18149
  details: |
    Removed five Neuronal Degeneration edges to developmental phenotypes (global developmental delay, profound intellectual disability, absent speech, microcephaly, axial hypotonia), because the entry's own evidence shows a deficit present from infancy and a post-developmental degeneration in the knockout mouse. Marked the motor stereotypy, electroretinogram, visual impairment and hearing edges INDIRECT_UNKNOWN_INTERMEDIATES with descriptions; the two retinal edges cite the PMID:33186095 retinal-neuron degeneration sentence. Removed the supportive-care target_mechanisms link and its phenotype-only evidence item, as no cited source discusses management. Replaced the Woodhouse-Sakati differential snippet with the PMID:38118446 sentence naming WDSKS and DCAF17. Changed the prevalence class from BELOW_1_IN_1000000 to ULTRA_RARE (a case count gives no rate) and added the GTPBP1-only count (n = 4) from the same paper.

  summary: 'Create: SLC12A5-Related Developmental and Epileptic Encephalopathy DEE34'
  details: |
    New entry for DEE34 MONDO:0014718, KCC2 loss of function. Deep research via "just research-disorder claude_code"; NEC preflight PASS with SLC12A5 mentioned 41 times and report OMIM 616645 matching the MONDO xref. GeneReviews baseline PMID:30763027 cross-referenced for phenotypes and management. Pathophysiology deliberately de-bundled into 13 atomic nodes, separating the trafficking/ERAD defect from the intrinsic transport defect, the chloride setpoint change from its effect on the GABA-A reversal potential, and the chloride-independent structural arm from the transport arm. Four discussions: a CONTROVERSY on chloride setpoint versus impermeant anions, a KNOWLEDGE_GAP on the bidirectional effect of KCC2 inhibition on seizures, a HUMAN_MODEL_MISMATCH on null-mouse versus partial-loss human genotypes and mouse/human developmental timing, and a KNOWLEDGE_GAP apportioning the developmental phenotype between the two mechanistic arms. Several HPO/CL identifiers suggested by the deep-research report were wrong on verification - HP:0002133 is Status epilepticus and CL:0000601 is cochlear outer hair cell - and were replaced with OAK-verified terms. Validated with just validate 57/57 snippets verified, just validate-terms passed, just check-duplicate-keys, and just check-title-snippets.

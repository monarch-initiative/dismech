  summary: Grounded RNF43/ZNRF3 molecular functions, added Harrison's classification and RSPO2 genetic diagnosis, and wired craniofacial phenotypes in Tetraamelia Syndrome 2.
  details: Added GENETICS_ENVIRONMENT_DISEASE classification and a molecular genetic testing diagnosis record backed by PMID:29769720. Grounded the RNF43/ZNRF3 pathophysiology node with GO ubiquitin protein ligase and transferase molecular functions, added anatomical locations (limb bud, lung) and epithelial cell types across pathophysiology nodes, and wired Micrognathia, Retrognathia, and Ankyloglossia downstream of branchial-arch WNT signaling reduction. Marked defining limb and lung phenotypes as diagnostic and recorded GERMLINE variant origin on RSPO2.

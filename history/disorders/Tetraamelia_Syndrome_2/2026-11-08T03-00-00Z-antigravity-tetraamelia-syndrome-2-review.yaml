  summary: Grounded RNF43/ZNRF3 ubiquitin ligase activity, refined limb/lung cell-type bindings, and added Harrison's classification and RSPO2 genetic diagnosis in Tetraamelia Syndrome 2.
  details: Added GENETICS_ENVIRONMENT_DISEASE classification and an RSPO2 Molecular Genetic Testing diagnosis record backed by PMID:29769720. Grounded the RNF43/ZNRF3 pathophysiology node with GO ubiquitin protein ligase activity (GO:0061630, increased relative to the RSPO2-antagonised state), added anatomical locations (limb bud, lung) and specific cell-type bindings (CL:0000082 epithelial cell of lung on lung branching; AER-scoped preferred_term on CL:0000066), marked defining limb and lung phenotypes as diagnostic, and recorded GERMLINE variant origin on RSPO2 while leaving Micrognathia, Retrognathia, and Ankyloglossia disconnected where no developmental mechanism is published.

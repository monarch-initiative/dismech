  summary: 'Review round 1: Tetraamelia_Syndrome_2'
  details: |
    Changes made in response to the first review of PR 13704. (1) Deep research: ran falcon (research/Tetraamelia_Syndrome_2-deep-research-falcon.md, committed with its citations file and artifacts). Its reference block shows 9 of 9 references resolved and none off topic. Its term block flags MONDO:0060732 as mislabelled only because the prompt template's 'MONDO ID ... (if available)' text was read as a label; the CURIE itself is correct. just preflight-dr could not run: it needs a local mondo.db that was not present and was not downloaded because disk space on the machine is limited. A manual check found the report is about RSPO2 throughout (72 mentions), the same causal gene MONDO records, with WNT3 named only as a differential. The report read the full text of PMID:29769720 (11 fetuses, 5 families, per-fetus table, family-level variants) and found that one family with a hypomorphic missense allele had humerofemoral hypoplasia with radiotibial ray deficiency, which is the separate MONDO disease MONDO:0060733. That full text and its supplement have no open-access copy and only the abstract is cached, so none of the per-fetus or per-variant detail could be quoted. That is recorded in the entry notes and is not curated. One quotable addition was made: the allele-dependent severity spectrum on the Tetraamelia phenotype, cited to the PMID:29769720 abstract (WNT potentiation correlated with allele severity) and to the human-series summary in PMID:33176673. The VERY_FREQUENT frequency was removed because the series is 7 severe fetuses. (2) The branchial-arch to Orofacial cleft edge is now directness INDIRECT, with an explanation. (3) The branchial-arch location was rebound from UBERON:0004362 pharyngeal arch 1 to UBERON:0002539 pharyngeal arch, because the source does not name which arch. (4) CI gene-activity grounding: the RSPO2 landing node now carries GO:0005102 signaling receptor binding and GO:0031625 ubiquitin protein ligase binding, both marked DECREASED and supported by the node's existing PMID:29769720 binding sentence. The branch was rebased onto origin/main. Validated with validate, validate-terms, count-verified-snippets (29/29), validate-disorders, and the CI check-* gates run locally, including check_gene_activity_grounding --against-ref origin/main.

  summary: 'Create: Tetraamelia_Syndrome_2'
  details: |
    New entry for tetraamelia syndrome 2 (MONDO:0060732, RSPO2), curated directly from PubMed; no deep-research provider was run. Curated as a standalone Disease rather than a subtype: MONDO has separate leaf terms for TETAMS1 (WNT3) and TETAMS2 (RSPO2) under MONDO:0010110, there is no dismech entry for that parent, and the two genes act at different steps of WNT signalling. Human evidence rests on one paper (PMID:29769720, Szenker-Ravi 2018), available only as an abstract, which supports recessive inheritance, tetra-amelia and lung aplasia, and the RNF43/ZNRF3 mechanism. The craniofacial phenotypes (orofacial cleft, mandibular hypoplasia, retrognathia, ankyloglossia) are cited from the OMIM-derived summary table in the bovine RSPO2 paper (PMID:33176673) and marked quote_role BACKGROUND. Labioscrotal fold aplasia, listed in that same table row, was not curated because no HPO term clearly matches. The mechanism chain (AER maintenance failure, reduced lung branching, reduced branchial-arch WNT signalling) comes from Rspo2 mouse models (PMIDs 17904116, 18067586, 18256198, 19233133). Mouse-to-human edges are marked directness INDIRECT because the mice show limb truncation and lung hypoplasia, not complete amelia and lung aplasia. The jaw and tongue phenotypes have no causal edge because no source links them to a specific mechanism. No treatments, no ClinGen record, and no GeneReviews chapter were found. Validated with just validate, validate-terms, count-verified-snippets (27/27), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-length, check-title-snippets, check-genereviews and validate-disorders.

  summary: Bind the spotted fever group Rickettsia antibody test as a LOINC measurement
  details: |
    Added measurements: LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Paired rickettsial serology row. The row's own description and evidence state that the serologic finding is a spotted-fever-group antibody response, explicitly noting cross-reactivity within the group limits species-level (R. heilongjiangensis) discrimination without molecular confirmation, so a group-level code matches the test's actual identity; no R. heilongjiangensis-specific LOINC code exists (checked via Monarch KG search, no results). Same code as kb/disorders/Flea_Borne_Spotted_Fever.yaml, reused because both rows describe the same group-level serologic test. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch9 (LOINC_DIAGNOSTICS.md tranche B).

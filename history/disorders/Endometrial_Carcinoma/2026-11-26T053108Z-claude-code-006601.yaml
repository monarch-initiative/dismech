  summary: 'Gene-family review: PTEN, KRAS'
  details: |
    Typed the PTEN record SOMATIC_DRIVER with variant_origin SOMATIC (TCGA: frequent somatic PTEN mutations in endometrioid tumours, PMID:23636398). Bound phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity DECREASED (PTEN loss), 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity INCREASED (activating PIK3CA) and GTPase activity DECREASED (activating KRAS) on the 'PTEN PI3K Pathway Dysregulation' node. The node is a multi-gene driver bundle; rather than split it, one molecular function was bound per protein class it carries, each with the modifier of the activating or inactivating lesion the node describes.

  summary: Expand differential diagnoses with benign causes of postmenopausal bleeding
  details: |
    Added three differential_diagnoses entries covering the benign conditions that compete with endometrial carcinoma for the same presentation (postmenopausal bleeding, a thickened endometrial stripe): endometrial hyperplasia without atypia (MONDO:0006193), endometrial polyp (MONDO:0006195), and endometrial atrophy. Atrophy is left unbound because the only close MONDO match, MONDO:1016756, is scoped to non-human animals; that reasoning is recorded in the entry notes. Previously the block held only Endometrial Hyperplasia (bound to the atypical form), Cervical Cancer, Uterine Corpus Sarcoma, and Leiomyoma, so the commonest benign explanations for the presenting findings were absent. Six new evidence items across five newly cached references (PMID:28586596, PMID:23154663, PMID:37832697, PMID:32648824, PMID:26166330), each with an exact-quote snippet verified against the reference cache. Deliberately did not add an endometrial-thickness triage rule or decision-support threshold: design-decisions.md section 1 places diagnostic decision support out of scope, and a thick stripe is a low-specificity finding whose benign differential dominates.

  summary: Link four routes converging on unopposed estrogen
  details: |
    Backfill for issue #8085. All four exposures target the unopposed estrogen signaling node but reach it by different routes, which the descriptions record. Unopposed estrogen exposure is TRIGGERS/DIRECT, an identity with the node, and the fact that adding a progestin abolishes the excess risk is the cleanest demonstration that the unopposed part is the mechanism. Obesity is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES because adipose aromatisation of androgens is the intervening endocrine step. Polycystic ovary syndrome and nulliparity are PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES, both acting through reduced progesterone opposition rather than added oestrogen, the first through chronic anovulation and the second through absent pregnancy-associated progesterone dominance; PCOS is graded predisposing partly because its cited evidence notes limitations in the underlying studies. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 52 of 53 with 1 pre-existing DOI-prefix skip; integrity issue count unchanged.

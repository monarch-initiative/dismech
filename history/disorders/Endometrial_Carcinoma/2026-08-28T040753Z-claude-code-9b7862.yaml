  summary: Add tamoxifen exposure and document the Endometrial_Endometrioid_Adenocarcinoma
    relationship
  details: |
    Added a Tamoxifen Therapy for Breast Cancer entry to the environmental block, linked via influences_mechanisms to the Unopposed Estrogen Signaling node (TRIGGERS, DIRECT). Tamoxifen was previously absent from the entry entirely despite being the classic iatrogenic risk factor. The link description records that tamoxifen is an endometrial partial agonist and that the LNG-IUS largely prevents the resulting pathology, which is the evidence the route is the progestin-opposable oestrogenic one. Three entry-level evidence items (PMID:31479143 USPSTF, PMID:33348436 Cochrane, PMID:25423691 meta-analysis) plus one link-level item, all with exact verified snippets. exposure_term is deliberately unbound: the pinned sqlite:obo:ecto build carries no tamoxifen exposure term (ECTO:9002223 and ECTO:0900485 resolve on OLS but not locally), and the nearest available term ECTO:2000006 sits under exposure to hormone replacement therapy, which would misclassify adjuvant anti-oestrogen therapy. Reasoning recorded in the entry notes; chemicals: tamoxifen carries the free-text identity. Also added a top-level notes block recording why Endometrial_Endometrioid_Adenocarcinoma is a separate entry rather than a has_subtypes member, since has_subtypes is reserved for the four molecular classes and mixing in a histologic type would conflate two classification axes.

  summary: Estrogen receptor binding decision on the estrogen-annotated node
  details: |
    Fourth tranche of the estrogen-signalling pathograph work in issue #12925.
    The node binds GO:0030520 with modifier INCREASED and conforms to
    sex_steroid_driven_proliferation#Nuclear Steroid Receptor Hyperactivation,
    so the mechanism is receptor-mediated mitogenic signalling and the receptor
    is its effector. ESR1 is now bound on the node with a matching
    molecular_functions descriptor, GO:0030284 nuclear estrogen receptor
    activity, modifier INCREASED.

    Two things settled the binding, because unopposed estrogen is ligand excess
    acting on a structurally normal receptor and there is no ESR1 lesion here.
    First, the corpus convention: 2,841 pathophysiology nodes carry genes: with
    no genetic_context against 497 that have one, so a gene descriptor names the
    gene the node is about rather than asserting a variant. Second, the module
    node this one conforms to is deliberately receptor-generic, carrying
    estrogen, progesterone and generic nuclear-receptor process terms and no
    gene, which is the pattern where a conforming entry substitutes the specific
    receptor exactly as it already substitutes the organ-specific cell type and
    location.

    Evidence is PMID:35895287, which reports ESR1 cistromes from human
    endometrial biopsies and organoids and finds ESR1 binding in whole
    endometrium enriched for regulation of cell proliferation. Graded IN_VITRO:
    the measurement is chromatin immunoprecipitation and sequencing on tissue
    outside the organism, not a clinical observation. It names the gene, the
    tissue and the proliferative readout together, which the entry's existing
    unopposed-estrogen review (PMID:12496040) does not, since that one argues
    the hormonal model without naming the receptor gene.

    Deep-research reports for this disease were read before any external
    source was consulted. They discuss estrogen but name no ESR gene at all,
    so the receptor-gene fact this decision turns on is not in them. That is
    a gap in those reports rather than a reason to skip them, and it is
    recorded here so the next curator does not re-derive it.

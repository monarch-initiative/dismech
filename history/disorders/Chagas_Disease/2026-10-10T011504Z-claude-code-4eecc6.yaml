  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). Extended the serology row with anti-T. cruzi IgG LOINC:32725-4 (method-less serum presence) and the WHO, PAHO and CDC two-serological-method recommendation, quoted from the scoping review PMID:38746745 and from PMID:29683542, both graded OTHER with quote_role BACKGROUND. The two tests differ in method, so one method-less measurement is bound and the different-principle rule is in the description. Extended the PCR row with T. cruzi DNA in blood LOINC:49801-4 (by NAA with probe detection; no method-less code found), the scoping review statement that molecular methods depend on parasitaemia, and the congenital qPCR evaluation PMID:34186488. No reference_ranges: results are qualitative, and the ARCHITECT signal-to-cut-off value in PMID:29683542 is a product cut-off.

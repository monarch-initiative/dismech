  summary: 'Address ai4c-reviewer requested changes on PR #7032'
  details: |
    Review-response for PR #7032. (1) Added progression section (acute -> indeterminate/60% asymptomatic -> chronic cardiac/digestive). (2) Decomposed the bundled cardiomyopathy node into an atomic chain joined by downstream: chronic Th1 myocarditis+persistence -> cardiomyocyte mitochondrial dysfunction -> myocardial fibrosis/arrhythmogenic substrate -> ventricular remodeling/DCM (conforms_to cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling), mining DOI:10.1177/15353702231220658 for the IFN-gamma/TNF-alpha, mitochondrial, and fibrosis/arrhythmia-substrate sentences. (3) Fixed the amiodarone target_mechanism to point at the fibrosis/arrhythmogenic-substrate pathophysiology node instead of the Ventricular arrhythmia phenotype. (4) Renamed the generic conduction phenotype to Atrioventricular block (term-matched) and added Right bundle branch block (HP:0011712, PMID:28056014) as the hallmark. (5) Added a granularity note that HPO lacks a megaesophagus-specific term. (6) Added clinical_trials (BENDITA NCT03378661 Phase II; NuestroBen NCT04897516 Phase III) and a vector-control environmental protective factor (Rassi). Non-blocking: numeric prevalence rate (1212/100000), heart-transplantation treatment (MAXO:0010039, PMID:28284779). Validated: schema, term validation, folded-hyphen check, and all 59 snippets verified as exact substrings.

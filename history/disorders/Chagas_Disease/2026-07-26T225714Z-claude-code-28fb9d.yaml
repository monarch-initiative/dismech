  summary: 'Full curation of Chagas disease + address preprint lead (issue #6515)'
  details: |
    Full curation of a previously thin entry, plus addressing preprint-scan issue #6515. Added: classifications (Harrison's Infectious Diseases); structured prevalence (~8M Latin America, Rassi PMID:20399979); expanded transmission to four routes (vectorial/congenital/transfusion-transplant/oral; PMID:40531676 quantifies modes, PMID:25993972); progression (acute -> indeterminate -> chronic cardiac/digestive); expanded pathophysiology (chronic myocardial inflammation/cardiomyopathy conforming to cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling with BENEFIT parasite-persistence evidence PMID:26323937; enteric nervous system denervation -> megaviscera, PMID:20004942/32338024) with downstream edges; expanded phenotypes (myocarditis, AV/conduction block, ventricular arrhythmia, megaesophagus HP:0002031, megacolon HP:6000852, constipation); treatments (added benznidazole/nifurtimox CHEBI agents + amastigote target_mechanism + BENEFIT caveat that benznidazole clears parasitemia but does not halt established cardiomyopathy; new Chagas-cardiomyopathy symptomatic management with amiodarone/ICD); diagnosis (IgG serology + PCR); and a discussions section with three gaps: parasite-persistence-vs-autoimmunity CONTROVERSY (BENEFIT null), ICD-RCT KNOWLEDGE_GAP, and the issue's vector-chemosensory/domiciliation KNOWLEDGE_GAP citing the preprint PPR:PPR1277623 (evidence_source COMPUTATIONAL, recorded as a lead not a mechanism per the issue's caution). Also backfilled evidence_source on pre-existing items (IN_VITRO parasitology, OTHER reviews, HUMAN_CLINICAL). Validated: schema + term validation pass; all 51 snippets verified as exact substrings.

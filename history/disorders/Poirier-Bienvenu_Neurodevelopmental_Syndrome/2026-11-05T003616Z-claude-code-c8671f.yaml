  summary: 'Create: Poirier-Bienvenu_Neurodevelopmental_Syndrome'
  details: |
    New entry for MONDO:0032889 (OMIM 618732), caused by heterozygous, usually de novo, CSNK2B variants. Named CSNK2B-Related Neurodevelopmental Disorder after the GeneReviews chapter title (PMID:39236211), which covers the same single-gene condition; the MONDO label is kept as a synonym and the file slug is unchanged. The Asp32 intellectual disability-craniodigital presentation (PMID:35571680, PMID:34983633) is recorded as a has_subtypes row rather than a separate entry, because GeneReviews and PMID:36833176 treat it as part of the CSNK2B spectrum and PMID:40317201 found no destabilization for p.Asp32Asn. ClinGen Definitive AD (CGGV assertion 64552de0) recorded in gene_disease_validity. Pathophysiology runs from loss-of-function and zinc-finger missense alleles through reduced CK2beta and reduced CK2 holoenzyme to neural progenitor dysregulation, a cortical parvalbumin interneuron deficit, abnormal cortical development and network hyperexcitability, using the Csnk2b heterozygous mouse with AAV rescue (PMID:42190665), the conditional CK2beta knockout (PMID:20368359) and knockdown data (PMID:29483533). An OpenScientist deep-research report was used as a lead; its 18 references all resolved, preflight-dr passed, and its citations added the 103-patient pooled seizure frequency (PMID:42764391), the zinc-finger genotype-phenotype correlation (PMID:35774559), a mosaic proband (PMID:37020656) and an Asp32Tyr case (PMID:34983633). Report citations not used: PMID:38395944 (de novo mutation rate across genes, not disease content), PMID:12529396 and PMID:31779225 (homozygous null embryonic lethality and GN11 cell-line migration, less relevant than the heterozygous mouse). Okur-Chung neurodevelopmental syndrome (CSNK2A1) is a separate entry and was not changed. Validation: just validate, count-verified-snippets (all snippets verified), validate-terms, check-genereviews (TAGGED), and the offline gates listed in CLAUDE.md.

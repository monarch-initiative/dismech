  summary: 'Review round: add diagnosis section and tighten model links'
  details: |
    Response to the automated review of PR 16551. Added a diagnosis section with four rows: molecular genetic testing (NCIT:C15709, GeneReviews diagnostic sentence and exome-sequencing ascertainment in PMID:34041744), copy-number analysis for 6p21.33 deletions (NCIT:C15709, PMID:39493709; the description notes that those deletions were found from next-generation sequencing data rather than a microarray), electroencephalography (NCIT:C38054, generalized discharges in 14/19 and background slowing in 9/19, PMID:34041744) and brain MRI (NCIT:C16809, normal in 5/8, PMID:35205321). All NCIT terms were looked up in OLS in this round and are members of the treatment-action enum. Moved the gene-replacement RESCUES link in animal_models from the holoenzyme node, which the paper did not measure, to the network hyperexcitability node, and added a RECAPITULATES link to Abnormal Cortical Development with a limitation that patient MRI is usually normal. Added frequency OCCASIONAL to Status Epilepticus (3 of 25 in PMID:34041744) and a note explaining that the ataxia row binds the narrower Gait ataxia term. The file slug was kept as Poirier-Bienvenu_Neurodevelopmental_Syndrome because how slugs follow dyadic names is still open in dismech issue 15894 and the deep-research files are keyed on that stem. Validation: just validate (89 of 89 snippets), check-entity-refs, check-causal-targets, check-name-collisions, check-snippet-grading and validate-disorders.

  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 123 (DFNB123, STX4)'
  details: |
    Created DFNB123 from a blank stub (no causal gene in MONDO). Identity resolved OMIM:620745 via the MONDO xref, then NCBI mim2gene_medgen -> GeneID 6810 (STX4, 16p11.2); kb/ searched for STX4 and DFNB123 first and found no existing coverage. Two references fetched and cited: PMID:36355422 (Schrauwen 2023 HMG, the defining Pakistani family plus zebrafish knockdown) and PMID:35599850 (Perl 2022 HGG Adv, the syndromic STX4 patients and CRISPR null fish). Pathograph: STX4 biallelic LOF -> failure of SNARE-mediated membrane fusion -> loss of syntaxin-4 from the hair cell membrane and stereocilia -> hair cell mechanotransduction failure and disturbed inner ear development -> one wired phenotype. Deliberately curates a single phenotype because the abstract-only source reports no onset age, audiometric configuration or follow-up; the richer STX4 phenotype in the literature belongs to the syndromic patients and is recorded under genetic and in a discussion rather than folded in. Two discussions filed: the nonsyndromic-versus-syndromic allelic question (whose dosage direction runs the wrong way, since the syndromic missense allele is the hypomorph), and the absence of any mammalian Stx4 ear model. OMIM provisional (mim2gene_medgen 'question' comment) recorded in genetic.notes, the description and the OMIM external assertion. Validated: just validate clean first pass, 22/22 snippets verified, plus check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values, check-title-snippets, check-snippet-length, check-snippet-grading all OK.

  details: |
    De novo curation of the 3q29 reciprocal duplication from primary literature plus one openscientist deep-research run. The minimal-critical-region question is curated as a CONTROVERSY carrying both positions with their own evidence (BDH1-alone versus no critical region), and the causal link from the candidate-gene node to the clinical layer is INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT because of it. A second INTERPRETATION discussion records which 3q29 findings do and do not transfer from the reciprocal deletion, since the schizophrenia association that dominates the 3q29 literature is deletion-only. Three reference_title values were initially written from memory and corrected against the cache after the validator flagged them. Validated: schema, terms, 33/33 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms.

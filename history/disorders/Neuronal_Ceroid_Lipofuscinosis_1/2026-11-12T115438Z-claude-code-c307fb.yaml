  summary: Review and enrich Neuronal_Ceroid_Lipofuscinosis_1
  details: |
    Added MONDO exact synonyms; added evidence-backed harrisons_chapter (NEUROLOGIC, ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE), lysosomal_storage_category, and icimd_category; set relationship_type CAUSATIVE on PPT1; grounded PPT1 lysosomal depalmitoylation failure with hgnc:9325 and GO:0008474, biological_scale, UBERON locations, and GO:0033173 on AKAP5-NFAT; split Autophagy Suppression and Neurodegeneration into mTORC1 Hyperactivation and Autophagy Suppression (GO:0038202, GO:0006914) and Cerebral and Retinal Neuronal Degeneration (GO:0008219, GO:0046666) with evidence-backed causal edges to all 10 phenotypes; added Ataxia (HP:0001251), Cerebral atrophy (HP:0002059), Progressive microcephaly (HP:0000253), and Feeding difficulties (HP:0011968); added 6 diagnostic procedures including fluorogenic PPT1 enzyme assay (PMID:10191108), Electroretinography, and Electroencephalography (NCIT:C38054); added Investigational Oral Cysteamine Bitartrate and N-Acetylcysteine Combination Therapy (CHEBI:17141, CHEBI:28939; PMID:24997880, clinicaltrials:NCT00028262) and clinical_trials entries for NCT00028262 and NCT00337636 alongside Individualized Multidisciplinary Supportive and Palliative Care (PMID:34000449) and HSPC gene therapy target_mechanisms; documented GeneReviews TAGGED_OVERVIEW (PMID:20301601) in notes.

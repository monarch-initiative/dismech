  details: |
    Grounded Biallelic CIROZ Loss of Function with GERMLINE/LOSS_OF_FUNCTION genetic_context and GO:0042802 (identical protein binding, modifier DECREASED) for ZP-N-mediated autonomous CIROZ homooligomerization with IN_VITRO evidence from PMID:39753129; added Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE, CARDIOVASCULAR) and structured prevalence (CASES_IN_LITERATURE, ULTRA_RARE); bound CL:0000064 (ciliated cell) and UBERON:0003062 (primitive knot) on Loss of CIROZ in the Left-Right Organizer with LRO expression evidence; wired downstream edges from Failure of Left-Right Axis Determination to Mitral atresia, Hypoplastic left ventricle, and Abnormal lung lobation and noted on Horseshoe kidney that individual F4-II:4 had situs solitus so a causal link to laterality failure is unestablished; added model-level evidence on all four animal models and both discussion blocks; added target_phenotypes on cardiac surgery and Ladd procedure treatments; and refined description and notes to remove meta-narration.

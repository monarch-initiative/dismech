  summary: 'Create: Visceral Heterotaxy 14 (CIROZ)'
  details: |
    De novo curation of HTX14 (MONDO:0976135), autosomal recessive CIROZ-related visceral heterotaxy. Evidence from the gene-defining cohort PMID:39753129 (16 individuals/10 families; full text cached) and the independent consanguineous-cohort replication PMID:39513328. Pathograph: biallelic CIROZ LOF -> disrupted LRO signaling (GO:0007368) -> failure of L-R axis determination (GO:0070986) -> heterotaxy, congenital heart defect, situs inversus totalis, intestinal malrotation. Phenotypes: heterotaxy (HP:0030853), CHD (HP:0001627), situs inversus totalis (HP:0001696), intestinal malrotation (HP:0002566), horseshoe kidney (HP:0000085). Incomplete penetrance recorded (2 bi-allelic individuals with situs solitus). Three animal models (mouse RECAPITULATES; zebrafish and Xenopus FAILS_TO_RECAPITULATE) with a HUMAN_MODEL_MISMATCH discussion on species divergence. Gene bound hgnc:26730 (pinned HGNC build labels it C1orf127; preferred_term CIROZ). No GeneReviews chapter (offline check NO_CHAPTER). No ClinGen validity assertion available. Deep research: falcon unavailable (403 auth); ran via --fallback, openscientist produced the report. All gates pass: validate 22 snippets/24 titles/0 issues, entity-refs, causal-targets, enum-values, duplicate-keys, coarse-phenotypes, qualifier-terms, shared-disease-terms, snippet-grading, validate-disorders.

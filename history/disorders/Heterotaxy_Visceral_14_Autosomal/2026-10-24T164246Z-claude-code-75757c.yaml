  summary: 'Review round 2: address ai4c-reviewer CHANGES_REQUESTED on PR #15496'
  details: |
    Addressed the automated review on PR #15496. Blocking: (1) removed the description clause asserting CIROZ 'acts downstream of cilia-driven leftward flow' (that is CIROP per PMID:39753129 line: 'CIROP, which encodes a metallopeptidase acting downstream of the leftward fluid flow'); reworded the former 'Disrupted Left-Right Organizer Signaling' node to 'Loss of CIROZ in the Left-Right Organizer' (CIROZ is a secreted LRO-restricted module member, molecular step unknown), and added a KNOWLEDGE_GAP discussion attached to it quoting 'the exact role played by CIROZ ... remains to be addressed' with the paper's own candidate experiments (LRO cilia/flow/morphology assays; CIROZ-as-MMP21/CIROP-substrate test by analogy to ZP2/ovastacin). (2) Added heterotaxy-generic diagnosis (echocardiography/situs imaging + interrupted-IVC->malrotation screening PMID:20730421; exome/genome sequencing with CIROZ on panels and ~20-30pct NGS yield PMID:42630107) and treatments (cardiac surgery PMID:42630107; Ladd correction of malrotation PMID:20730421; pneumococcal vaccination PMID:20730421), each explanation stating NOT CIROZ-specific. Suggestions taken: added Mitral atresia (HP:0011560), Hypoplastic left ventricle (HP:0004383, for HLHS), Abnormal lung lobation (HP:0002101, bilobed lungs) from the F1-II:3 clinical quote; split the single mouse model into the two source lines MGI:5431499 (ENU c.26+1G>A) and MGI:5635119 (IMPC LacZ exon4); removed the near-synonymous GO:0070986 so only GO:0007368 grounds the organism-level determination node; split the mixed humans-and-mice MODEL_ORGANISM node evidence into a clean HUMAN_CLINICAL quote; added a notes line flagging the 11/16 vs 5/16 CHD-count discrepancy in PMID:39753129. CIROZ gene grandfathered in gene_activity_grounding_baseline (molecular function genuinely unknown; not invented). Fixed two CI gate failures (check-snippet-length short 'malrotation of the bowel' snippet lengthened; check-gene-activity-grounding exemption added). All gates green: validate 31 snippets/35 titles/0 issues, validate-terms, count-verified-snippets 31/31, entity-refs, causal-targets, enum-values, duplicate-keys, coarse-phenotypes, qualifier-terms, snippet-length, gene-activity-grounding, validate-disorders, snippet-grading, validate-history.

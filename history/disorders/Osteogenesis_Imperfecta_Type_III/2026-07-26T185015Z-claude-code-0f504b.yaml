  summary: 'Review: retag Orphanet rows evidence_source OTHER (ECM review r2)'
  details: |
    Round-2 ECM claim-evidence review. Fixed: all six ORPHA evidence items used evidence_source HUMAN_CLINICAL; retagged OTHER to match the convention for Orphanet structured-database rows. This is the same defect corrected in Osteogenesis_Imperfecta_Type_I during round 1, and it also appears in Hypermobile_Ehlers-Danlos_Syndrome, so it is a recurring pattern rather than an outlier. A KB-wide audit found 372 ORPHA evidence items across 52 files using a non-OTHER source (366 HUMAN_CLINICAL, 5 IN_VITRO, 1 MODEL_ORGANISM - the last two plainly wrong, since an Orphanet record is neither a cell-culture experiment nor an animal study). The corpus-wide scripted fix is tracked in issue #7026.

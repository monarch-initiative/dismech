  summary: 'Create: Perrault_Syndrome'
  details: |
    De novo curation of Perrault syndrome (MONDO:0017312) for issue #7556. Deep research via Edison/Falcon (research/Perrault_Syndrome-deep-research-falcon.md; 36 citations; 514 s). GeneReviews baseline PMID:25254289 fetched, tagged in top-level references, and the full NBK242617 chapter mined for Clinical Characteristics, the per-gene case-share table, the differential list and management/agents-to-avoid.

    Gene-to-PRLTS-number mapping was verified independently against MONDO with OAK rather than taken from the task brief: PRLTS1=HSD17B4 (MONDO:0009300), 2=HARS2 (MONDO:0013972), 3=CLPP (MONDO:0013588), 4=LARS2 (MONDO:0014126), 5=TWNK (MONDO:0014504), 6=ERAL1 (MONDO:0033047), 7=DAP3 (MONDO:0976232). The brief's implied ordering placed LARS2 before CLPP and was wrong; MONDO/OMIM were treated as authoritative and the verified table is recorded in the entry notes.

    Sex-limited gonadal expression is modelled as a dedicated ORGANISM-scale pathophysiology node ('Sex-Limited Expression of the Gonadal Phenotype') plus PhenotypeContext sex strata (FEMALE/MALE) on the premature-ovarian-insufficiency and hearing-loss phenotypes, with the male ascertainment consequence evidenced from PMID:31827252. Male infertility is curated with deliberately contradicting REFUTE evidence to prevent over-generalisation.

    TWNK/adPEO pleiotropy is firewalled in three places: the PRLTS5 subtype note, the TWNK genetic note, and an explicit differential bound to MONDO:0012241 (PEOA3, OAK-verified as the TWNK dominant PEO entity). The 46,XX gonadal dysgenesis boundary is reciprocal - that entry already lists Perrault as a differential, so this entry cross-references it rather than duplicating the numbered ODG series.

    Ten DR- or memory-suggested ontology IDs were rejected after OAK definition checks, including an obsolete GO term and several semantically wrong but syntactically valid IDs.

    Validation: just validate PASS; just validate-terms PASS; just validate-references 85/85 snippets verified; just compliance 86.1%; just compliance-connectivity 18/18 phenotypes connected and 12/12 causal genes wired.

  summary: 'Gene-family review: LARS2, HARS2, PRORP; peroxisomal and isoprenoid genes
    moved to their own nodes'
  details: |
    One node, 'Biallelic Loss of Mitochondrial Gene-Expression and Proteostasis Factors', carried twelve genes and no molecular function. LARS2, HARS2 and PRORP now each have their own node binding the activity their Perrault alleles reduce: leucine-tRNA ligase activity (yeast complementation of the LARS2 alleles, PMID:23541342), histidine-tRNA ligase activity (reduced aminoacylation of HARS2 p.V368L and p.L200V, PMID:21464306) and ribonuclease P activity with mitochondrial tRNA 5'-end processing (reconstituted RNase P assays, PMID:34715011, PMID:41772230), each feeding the mitochondrial translation node. HSD17B4, PEX6 and GGPS1 were removed from that node because they are not mitochondrial gene-expression factors; the edges it drew to the peroxisomal and isoprenoid nodes were removed with them. HSD17B4 stays on the peroxisomal beta-oxidation node, which now binds the D-specific (2E)-enoyl-CoA hydratase (GO:0080023) and (3R)-3-hydroxyacyl-CoA dehydrogenase (GO:0106386) activities as DECREASED (PMID:9089413). PEX6 has its own upstream node binding ATP hydrolysis activity (GO:0016887) as the AAA ATPase of the PEX5 export module (PMID:29884772, PMID:32399598), feeding the peroxisomal node. The isoprenoid node binds geranylgeranyl diphosphate synthase activity (GO:0004311) DECREASED, about 50% of control in patient myoblasts (PMID:32403198). ClinGen tiers were copied: LARS2 Definitive and HSD17B4 Definitive for Perrault syndrome, HARS2 Limited for Perrault syndrome 2 (2018). HARS2 stays CAUSATIVE because independent families have been reported since that classification (PMID:34406847), and its notes say so. PEX6 is typed UNKNOWN: one report, no ClinGen classification. PRORP's notes now point to COXPD54 (MONDO:0030543), the MONDO and OMIM name for the PRORP disease, whose spectrum includes Perrault syndrome. LARS2, HARS2 and PRORP gain autosomal recessive inheritance blocks, and every record lacking a variant origin gains GERMLINE. Requested by the peroxisomal and CoQ/sterol reviews, checked against the cited papers before applying.

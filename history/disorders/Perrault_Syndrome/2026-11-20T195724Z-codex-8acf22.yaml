  summary: Map Perrault syndrome to OMIMPS:233400
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS233400 contains the seven numbered Perrault forms in the January 2026 OMIM snapshot, corresponding to the seven children of MONDO:0017312 and PRLTS1 through PRLTS7 curated here. This maps the clinical syndrome concept, not a closed list of seven genes: the entry also discusses additional molecular causes of the same hearing-loss and ovarian-dysfunction spectrum. The phenotype is sex- and age-dependent, so ovarian dysfunction is not required in every affected individual. Diverse mitochondrial, peroxisomal, and metabolic mechanisms remain explicit; the mapping neither asserts one universal mitochondrial lesion nor equates all allelic disorders of these genes with Perrault syndrome.

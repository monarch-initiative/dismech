  summary: Enhanced Morgagni-Stewart-Morel_Syndrome with upstream endocrine/metabolic pathophysiology
    node, progression, diagnosis, and complete top-level references.
  details: Added an upstream Systemic endocrine and metabolic dysregulation node (GO:0050886, GO:0010817,
    GO:0042593; UBERON:0000949) backed by PMID:23284007 and PMID:27428347 that feeds Endocrine-mediated
    calvarial bone overgrowth, Obesity, and Diabetes mellitus, removing the reversed Obesity edge from
    the bone overgrowth node and leaving Diabetes insipidus unconnected due to lack of mechanistic evidence.
    Added progression (Onset in adulthood/postmenopausal women, plus early-adulthood seizure onset in
    twins backed by PMID:16909048) and diagnosis (Cranial radiographic examination, NCIT:C128940; Cranial
    neuroimaging, NCIT:C173635) sections backed by verbatim abstract snippets. Added all cited PMIDs to
    top-level references and cleared the title-as-finding entry on DOI:10.7759/cureus.41445.

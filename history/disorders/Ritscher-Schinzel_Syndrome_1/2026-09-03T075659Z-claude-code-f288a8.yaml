  summary: 'Create: Ritscher-Schinzel Syndrome 1'
  details: |
    Created kb/disorders/Ritscher-Schinzel_Syndrome_1.yaml (MONDO:0009073) for the
    autosomal recessive, WASHC5/strumpellin-related form of Ritscher-Schinzel (3C)
    syndrome.

    LUMP/SPLIT DECISION. kb/disorders/Ritscher-Schinzel_Syndrome.yaml already
    carried RSS1 as a has_subtypes entry, so a separate file needed justifying
    rather than assuming. It clears the bar in docs/explanation/design-decisions.md
    ("a distinct MONDO identity and a substantially independent mechanism"):
    MONDO:0009073 is a distinct term, and WASHC5 encodes a WASH regulatory complex
    subunit recruited to endosomes by FAM21-retromer binding, which is a different
    lesion from the SNX17-dependent Commander/CCC cargo-selection route behind RSS2
    (CCDC22) and RSS3 (VPS35L). Repo precedent supports it (Hereditary Spastic
    Paraplegia 7/11/44/48/49 alongside a parent). The parent's RSS1 subtype block
    was converted to a pointer per the promotion convention, not left as a
    divergent copy. Two follow-ups are recorded in the parent's review_notes and
    deliberately not done here: its phenotypes are still untagged by subtype, and
    no Grouping covers the split.

    DEEP RESEARCH. Requested provider was falcon. Falcon was unavailable in this
    environment: EDISON_API_KEY was set but the endpoint returned 403
    ProviderAuthError. Rather than substitute a provider by hand, the run was
    re-issued through the recorded-fallback path
    (just dr_fallback='--fallback' research-disorder falcon ...), which fell back
    to openscientist and recorded fell_back, requested_provider and
    provider_attempts in the report frontmatter. The report used is
    research/Ritscher-Schinzel_Syndrome_1-deep-research-openscientist.md (2276s,
    23 citations, 2 artifacts). It was generated without frontmatter validation
    blocks, so both retro-fits were run: just validate-research-reference reported
    23/23 references resolved, 0 unresolved, 0 off topic; just validate-research-terms
    reported 56/57 terms resolved, 0 unresolved, 0 mislabelled (the 3 "second look"
    entries are markdown category prefixes leaking into the term name, e.g.
    "Craniofacial:** low-set ears" for HP:0000369, not wrong bindings). Running the
    reference validator is also what renamed the report file from -falcon to
    -openscientist.

    NAMED ENTITY CONFUSION. just preflight-dr against MONDO:0009073 returned WARN:
    the report mentions CCDC22 exactly as often as WASHC5 (29 each) and carries
    OMIM 610657 (RSS2) alongside the correct 220210. The report mixes RSS1 and
    RSS2, so only WASHC5-attributed claims were taken from it. Its LDLR
    hypercholesterolaemia and ATP7A copper branches were deliberately NOT curated:
    the report itself routes both through CCC/Commander coupling, which is the
    RSS2/RSS3 mechanism. The one WASH-specific enrichment taken from it was the
    FAM21-tail/VPS35 recruitment step (PMID:22070227) and the 26-patient
    phenotypic series (PMID:28555453).

    The report also asserts the founder variant is a "splice-site variant skipping
    exon 27". That is wrong, and it is the same error this curation made
    independently before reading the report; see the correction below. Curating
    from the primary source rather than the report is what caught it.

    GENEREVIEWS BASELINE. PMID:31971710 exists and is tagged GeneReviews in the
    top-level references block. Its Clinical Characteristics were cross-referenced
    phenotype by phenotype; the renal and immune manifestations named only in its
    Management section were added, as were flat face, overfolded helix and smooth
    philtrum. Its Diagnosis/Testing and Genetic Counseling sections are both
    curated (a diagnosis block, and the 25% sibling recurrence and prenatal/PGT
    sentences on the counselling treatment). No Agents to Avoid section exists in
    the abstract.

    CONTENT. 8 pathophysiology nodes wired as a causal chain from WASHC5
    hypomorphic loss of function through WASH complex destabilisation, impaired
    Arp2/3 endosomal actin nucleation, failed tubule fission and cargo retrieval,
    and reduced surface cargo density, branching to integrin-mediated adhesion and
    to neuronal dendritic/synaptic plasticity, converging on multisystem
    malformation. 27 HP-bound phenotypes, 2 diagnosis entries, 6 treatments, 1
    genetic entry, 2 animal models linked via modeled_mechanisms, and 2
    discussions. The Washc5 null mouse is recorded as FAILS_TO_RECAPITULATE with
    its limitations: homozygous nulls are embryonic lethal while human alleles are
    hypomorphic, so no published model sits in the viable disease window. That is
    also the HUMAN_MODEL_MISMATCH discussion, whose proposed experiment is a
    patient-allele hypomorphic knock-in. The KNOWLEDGE_GAP discussion asks why a
    ubiquitous trafficking defect produces this particular triad.

    NO FREQUENCY BANDS ARE ASSERTED. Every frequency value was removed during
    self-review. The candidates all came from sources that cannot support an
    RSS1-specific band: PMID:36130690 is six patients from two families mixing four
    WASHC5 and two CCDC22 genotypes and says only "the most common findings" with
    no percentage; PMID:28555453 gives real percentages (megalocornea 69%, low-set
    ears 80.7%, septal defects 68.7%, acral skeletal cluster 96%, megacisterna
    magna 31.8%, Dandy-Walker 27%) but is a clinically ascertained cohort that
    never genotypes anyone, never names WASHC5, and is 69% male, which suggests
    X-linked RSS2 inclusion. Those percentages are quoted verbatim in snippets with
    directness: INDIRECT and an explanation naming the limitation, so the numbers
    are visible with their provenance rather than laundered into a band.

    SELF-REVIEW AND CORRECTIONS. A red-team review was run in a fresh context
    before committing and returned REQUEST_CHANGES. Everything mechanical was clean
    (all snippets exact, all term labels matching, all gates green); every defect
    was in claim-to-evidence alignment. Fixed:
    - An inverted causal claim. The entry said the founder variant "causes skipping
      of exon 27"; PMID:24065355 says the opposite, an eightfold reduction in the
      relative amount of a transcript lacking exon 27. Corrected in all three
      places it appeared. The entry now states only the splice-site change, the
      shift in relative transcript abundance, and the 60% protein reduction.
    - Two evidence items imported SPG8 results (same gene, heterozygous, dominant,
      a different disease) under explanations that generalised them to "the WASHC5
      lesion". Both now carry directness: INDIRECT and name SPG8.
    - A contested result cited one-sidedly. PMID:31911435's SPG8 non-rescue finding
      is contradicted by PMID:37392480 and PMID:23085491, both already cited in the
      entry. A REFUTE item quoting the contradiction was added rather than
      presenting the disagreement as settled.
    - Hypercholesterolemia and immunodeficiency come from form-agnostic GeneReviews
      sentences and are curated as RSS3 phenotypes in the parent. Kept for baseline
      completeness with directness: INDIRECT and the attribution recorded as
      unestablished.
    - A node bundling integrin adhesion with neuronal plasticity was split in two.
      This also gave Gait ataxia an upstream parent; it had been an isolated node
      despite a mechanism node and an animal model existing to explain it.
      Cerebellar vermis hypoplasia was likewise connected.
    - GO:0034314 and GO:0030041 were on each other's nodes; swapped. CL:0000598
      pyramidal neuron narrowed the evidence (the papers say cortical neurons) and
      became CL:0010012 cerebral cortex neuron. Cultured-neuron results were
      re-graded MODEL_ORGANISM to IN_VITRO.
    - Two reference caches (PMID:34020006 CCDC22, PMID:31712251 VPS35L) had been
      fetched but were cited by nothing; removed as scope creep and an NEC signal.
    Two review suggestions were not actioned and the reasons are recorded here: an
    OMIM xref is not expressible (the schema has ICD10CM, ICD11F, Mondo and NCIT
    mapping classes and no OMIM one), and the WASHC5-specific phenotype counts
    proposed as a better frequency basis come from a medRxiv preprint absent from
    PMC that cannot be snippet-verified.

    DATASETS. just discover-datasets returned no GEO candidates, which is expected
    for a disorder this rare. datasets is left empty rather than padded.

    VALIDATION. just validate passes with 69/69 snippets verified against cached
    references. All PMID-keyed, so no DOI-skip gap. Also clean:
    check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-snippet-length,
    check-title-snippets, check-snippet-grading. Compliance 91.0%. The residual
    compliance gap is uncited downstream edges, left uncited deliberately where no
    source makes the causal claim, plus proposed-experiment slots that have no
    datasets by nature.

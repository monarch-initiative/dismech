  details: |
    Created the acquired Zika virus infectious disease entry from the MONDO:0018661 stub, kept Congenital_Zika_Syndrome as a pointer subtype, removed congenital synonyms from the acquired entry, curated NCBITaxon-bound Zika virus and Aedes vector lifecycle data, added Aedes, sexual, blood-borne and vertical transmission, represented cutaneous replication, bloodstream dissemination, post-ZIKV Guillain-Barre predisposition and transplacental fetal seeding, added acute fever-rash-arthralgia-conjunctivitis-headache phenotypes, captured Aedes exposure as a TRIGGERS environmental influence, and documented supportive care in the absence of a public vaccine or ZIKV-specific antiviral. Evidence was fetched with just fetch-reference and checked with schema, term and exact-snippet validation.

  summary: 'Create: Lateral Meningocele Syndrome'
  details: |
    New entry for lateral meningocele syndrome (Lehman syndrome, MONDO:0007537), caused by heterozygous truncating variants in NOTCH3 exon 33. The GeneReviews chapter NOTCH3-Related Lateral Meningocele Syndrome (PMID:27336130) is the phenotype baseline and is tagged in references. One OpenScientist deep-research report was used: research/Lateral_Meningocele_Syndrome-deep-research-openscientist.md (29/29 references resolved, 0 off topic; term validation flagged two GO cellular-component terms whose report labels differed from the ontology labels, neither of which is used here). just preflight-dr passed with NOTCH3 as the dominant gene. Curated 8 pathophysiology nodes as a causal chain: terminal-exon truncation escaping nonsense-mediated decay, NOTCH3 gain of function, increased RANKL in osteoblasts and osteocytes, increased osteoclastogenesis leading to osteopenia (mouse evidence), connective tissue and dural dysplasia, dural ectasia and meningocele formation, nerve root compression and its neurological sequelae, and abnormal craniofacial and skeletal development. The edges from NOTCH3 gain of function to connective tissue dysplasia and to craniofacial development are marked INDIRECT_UNKNOWN_INTERMEDIATES because no study has shown the mechanism, and a HUMAN_MODEL_MISMATCH discussion records that the Notch3 knock-in mouse has osteopenia but no meningoceles. 33 phenotypes with HP terms; 11 have no causal edge because no source gives a mechanism. HP:0032478 Lateral spinal meningocele was confirmed in OLS and added to the term cache. Treatments are supportive (neurosurgery for symptomatic meningoceles, mandibular distraction, physiotherapy, supportive care, genetic counseling); preclinical ASO and anti-NOTCH3 antibody results are recorded under the mouse model rather than as treatments. Validation: just validate, validate-terms, count-verified-snippets (92/92), check-causal-targets, check-entity-refs, check-duplicate-keys, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles and just validate-disorders all passed.

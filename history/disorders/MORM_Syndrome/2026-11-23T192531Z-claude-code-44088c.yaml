  summary: 'Review round 1: MORM Syndrome'
  details: |
    Addressed the automated review's two blocking findings and its four suggestions. Added a diagnosis section with three rows: molecular genetic testing of INPP5E (NCIT:C15709), citing the whole-exome sentence from PMID:31173343 and the negative retinal-dystrophy panel from PMID:34211432; retinal electrophysiology and imaging (NCIT:C101217), citing the electroretinography and OCT findings from PMID:34211432 plus the progression-biomarker statement from PMID:41465079 marked INDIRECT; and brain MRI (NCIT:C16809) from PMID:34211432. Added two animal models and one experimental model, each with modeled_mechanisms, fidelity, model_scale, limitations, typed divergences and readouts: the retina-specific Inpp5e knockout mouse (PMID:33711342) and the MC4R-neuron Inpp5e CRISPRi mouse (PMID:42838451), both with mouse Inpp5e on MGI:1927753, and INPP5E-knockout iPSC retinal organoids (PMID:42374981). Every link is PARTIALLY_RECAPITULATES and carries a CAUSE_UNREPRESENTED divergence, because none of the three models encodes the MORM lesion: two remove the gene or its transcript and the organoid carries the catalytic-domain allele ClinGen attributes to Joubert syndrome 1. Rebound Sleep hypopnea from HP:0002870 Obstructive sleep apnea to HP:0040213 Hypopnea with temporality NOCTURNAL, after HPO label searches for hypopnea and hypopnoea returned only HP:0040213 and HP:0002877. Regraded the PMID:24166846 evidence item to IN_VITRO. Attached PMID:42838451 evidence to the Primary Cilium Instability to Hypothalamic Ciliary Dysfunction edge. Left the MC4R neuron bound to CL:0000540 with a note: CL types its hypothalamic neurons by transmitter or peptide and the source identifies its cells only as MC4R-expressing.

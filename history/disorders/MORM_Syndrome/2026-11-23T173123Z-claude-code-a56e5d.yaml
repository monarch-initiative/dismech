  summary: 'Create: MORM_Syndrome'
  details: |
    New Disease entry for MORM syndrome (MONDO:0012423), INPP5E. Lump/split: kept as its own entry rather than a subtype of Joubert_syndrome, because MONDO, OMIM 610156 and the ClinGen Syndromic Disorders GCEP treat it as a separate disease and ClinGen's split rationale records a distinct mechanism (C-terminal CaaX truncation causing loss of ciliary targeting with retained catalytic activity) and a distinct presentation. Deep research: falcon was requested but no Edison key is configured, so the run fell back to claude_code (research/MORM_Syndrome-deep-research-claude_code.md). A first claude_code attempt returned answer_status unsuccessful and was deleted and re-run. The kept report has 32/32 references resolved, but 2 of 4 quotes unsupported (PMID:16493448, PMID:19668215); no quote was reused from it, and every snippet was taken from a references_cache file. just preflight-dr PASS. Primary sources: Hampshire 2006, Jacoby 2009, Khan 2019, Drole Torkar 2021, the ClinGen CGGV record, and INPP5E ciliary-targeting papers (PMIDs 23150559, 24166846, 27063844, 29140789, 26190144). Pathograph: truncation -> failed PDE6D ciliary targeting -> ciliary phosphoinositide imbalance / Hedgehog repression and cilium instability -> photoreceptor and MC4R-neuron ciliary dysfunction -> retinal dystrophy, nystagmus, obesity, hyperphagia; conforms to ciliopathy_dysfunction at four nodes. Intellectual disability and micropenis are left unconnected because no source establishes their mechanism. relationship_type left unset because ClinGen rates the pair Moderate. No GeneReviews chapter covers MORM (check-genereviews --online lists only the Joubert Overview and a retired hepatic fibrosis chapter as gene-scoped candidates). Validated with just validate, validate-terms, count-verified-snippets (all verified), check-causal-targets, check-entity-refs, and validate-disorders.

  summary: 'Create: autoinflammation with episodic fever and lymphadenopathy (CRIA)'
  details: |
    Created the autoinflammation with episodic fever and lymphadenopathy (cleavage-resistant
    RIPK1-induced autoinflammatory, CRIA) entry. Deep research via claude_code (report in
    research/, 12/12 references resolved; preflight-dr confirmed RIPK1 dominant with matching
    OMIM 618852). Evidence anchored on fetched primary abstracts (Lalaoui Nature 2019
    PMID:31827281 full text, Tao Nature 2019 PMID:31827280, novel-variant characterization
    PMID:35716229, three-generation family PMID:37452601, RIPK1 IEI review PMID:34163478).
    Built an atomic causal pathograph from the D324 cleavage-resistant variant through
    impaired caspase-8 cleavage, increased RIPK1 activation, TNF-induced apoptosis/necroptosis
    hypersensitivity and inflammatory-cytokine overproduction to systemic autoinflammation;
    8/8 phenotypes connected. Recorded tocilizumab (anti-IL-6R, effective) with a
    target_mechanisms link and the characteristic non-response to TNF inhibitors (supports:
    REFUTE). Deliberately not conformed to il6_hypercytokinemia (rate-limiting step is cell-
    death hypersensitivity, not ligand-driven gp130-JAK-STAT3) with the reasoning in notes.
    Distinguished from recessive RIPK1 deficiency (immunodeficiency 57). All gates pass.

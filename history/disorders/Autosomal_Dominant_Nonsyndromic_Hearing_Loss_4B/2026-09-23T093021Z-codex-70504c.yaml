  summary: Review DFNA4B clinical variability and CEACAM16 matrix mechanisms against primary full text
  details: 'Reviewed the existing entry, CREATE history, matching OpenScientist narrative, citation artifact
    and variant table against cached primary sources and accessible full text. Confirmed MONDO:0013823/CEACAM16
    identity; the entity preflight TECTB warning concerns a binding partner, not a rival disease. DFNA4B
    is Mendelian, within the requested scope excluding infectious diseases and environmental diseases/poisonings.


    Replaced the asserted universal dominant-negative/abnormal-monomer mechanism with allele-specific
    biochemical observations and a provisional matrix hypothesis. Added the opposing p.Arg255Gly protein-level
    result alongside reduced p.Gly169Arg secretion. Folding, stability, mutant/wild-type interference
    and matrix incorporation were not directly established by these assays. Restored the founding p.Thr140Pro
    allele and the omitted 2020 p.Thr140Ala family; distinguished mouse p.Thr142Pro glycosylation results
    summarized by the 2024 report from untested glycosylation predictions for p.Thr140Ala/Ile. ClinGen''s
    September 2022 Moderate assessment and its zero-point late-onset frameshift case prevent overgeneralizing
    all heterozygous truncating variants. Recessive splice-variant families show clinically overlapping
    hearing loss with normal-hearing human heterozygotes, not a phenotypically distinct severity class.


    Corrected CEACAM16 source-cell localization using 2012/2014 reporter and localization studies: nonsensory
    cells including Deiters and limbal cells, rather than OHC production asserted from the first report.
    Classified tectorin coimmunoprecipitation as transfected-cell evidence. Replaced membrane-to-stereocilia
    detachment with directly measured membrane mechanics from the 2021 isolated-tissue study. The 2012
    null membrane often remained attached during preparation; neither that result nor the 2019 aged-wild-type
    detachment establishes accelerated in vivo detachment in young nulls. Separated BALB/c deletion-null
    and C57BL/6J beta-galactosidase-null phenotypes and experimental ages. Corrected the apical/low-frequency
    bias, shared background hair-cell loss, aged heterozygote emissions and the direction of the ABR-threshold
    readout. Ex vivo sample sizes and absence of juvenile wild-type controls are recorded.


    Revised clinical generalizations using family tables and longitudinal observations. Added p.Thr140Ala
    onset in the twenties, the de novo child''s flat 40–60 dB audiogram with one-year stability, family-variable
    tinnitus and single-case subjective noise sensitivity. Removed unsupported pooled frequencies and
    the fixed 5–20-year onset. Retained limited vestibular assessment and phenocopies; did not infer complete
    penetrance from young relatives or an internally inconsistent V-11 genotype in the Russian report.
    Removed an allele count used as a prevalence estimate. Added actual hearing-aid use in the Russian
    family and de novo child. GeneReviews clinical characteristics, diagnosis, management and counseling
    supply exact quotations; VUS alone is not diagnostic, and the 50% transmission risk applies to offspring
    rather than all recurrence scenarios. General noise advice is kept separate from acoustic susceptibility;
    direct CEACAM16-null challenge evidence did not show increased injury, replacing an inference borrowed
    from TECTB.


    Read accessible full text for the p.Gly169Arg, de novo p.Leu365Arg, p.Thr140Ala, p.Arg255Gly and Russian
    p.Thr140Ile reports, the 2018 recessive splice families, 2012/2014/2019 null studies and 2021 mechanics
    experiment. Read ClinGen''s complete evidence table and relevant GeneReviews domains. Generated full-text
    URL caches where PMID caches held abstracts. The 2011 founding paper and 2019 recessive truncation
    report were assessed within available abstract scope; the founding-paper full text remained inaccessible
    despite PMC, publisher/DOI and Europe PMC attempts. The 2024 paper''s summary is identified as the
    source for the mouse glycosylation detail. Unsuccessful browser-challenge cache artifacts are excluded
    from the PR. Structured CGGV fetching is unsupported by this checkout''s fetch-reference path, so
    the generated full evidence-table URL is used. ClinicalTrials.gov CEACAM16 and DFNA4B searches returned
    zero studies on 2026-09-23.


    Completeness checklist: phenotypes, mechanisms, therapy/trials, genetics, diagnostics and references
    are adequate after revision; no established DFNA4B subtypes were surfaced. The recessive disease remains
    an allelic differential. Research was initially under-consumed for conflicting mechanisms, supporting-cell
    localization, direct mechanics, clinical variability and actual management. Primary sources correct
    those gaps; speculation and other-gene noise data are not promoted to DFNA4B findings. Tinnitus and
    subjective noise sensitivity remain without speculative causal edges. New titles were read against
    cache metadata and claim relevance. HPO Hyperacusis and CL Deiter''s cell were resolved using OAK/OLS,
    with the existing disease binding confirmed independently. Schema, ontology labels, all 53 quotations,
    GeneReviews tagging, entity/causal links and history are locally validated before publication; independent
    review and CI remain separate readiness gates.'

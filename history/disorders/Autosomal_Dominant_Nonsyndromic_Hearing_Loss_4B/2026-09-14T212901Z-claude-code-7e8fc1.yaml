  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 4B'
  details: |
    Created DFNA4B (CEACAM16) from the primary literature plus an OpenScientist deep-research report. Five-node pathograph from a heterozygous missense monomer through altered secretion and destabilized tectorial-membrane matrix assembly to destabilized cochlear amplification. Curated as a tectorial membrane matrix disease rather than a hair-cell disease. The entry keeps the dominant missense mechanism and the allelic recessive loss-of-function disease apart, because a missense monomer entering the matrix and a null allele removing the protein are different perturbations rather than dosage grades. Two discussions record the open problems: one dominant allele reduces secretion while another increases it, and the only animal model is a null so the dominant-negative step has no animal support; the model's link to the initiating node is curated FAILS_TO_RECAPITULATE with an INVALIDATING BOUNDARY_OMISSION divergence. Four of the seven HP identifiers the deep-research report suggested resolve to unrelated terms (HP:0000421 is Epistaxis, HP:0008542 is Low-frequency hearing impairment, HP:0011476 is Profound sensorineural hearing impairment, HP:0008625 is Severe sensorineural hearing impairment) and the report's own term validation flagged only the last; every binding here was resolved independently. just preflight-dr reports a rival-gene warning for TECTB at 50% of CEACAM16 mentions; this was checked and is a false positive for Named Entity Confusion purposes, since TECTB is CEACAM16's binding partner rather than a second disease entity, and the report's TECTB-specific noise-susceptibility material was deliberately not carried into the entry. Validated with just validate-disorders (31/31 snippets), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms. During curation I twice assumed a cached reference had no abstract body and wrote placeholder title snippets; on checking, both records had full abstracts, and the placeholders were replaced with real quoted findings.

  details: |
    New entry from a claude_code deep-research report (47/47 references resolved, zero confabulations). Five pathophysiology nodes running FBN1 TB4-domain missense to loss of integrin binding, then in parallel to increased dermal TGF-beta signalling and fibroblast activation, converging on dermal and fascial collagen accumulation. The key mechanistic point, and the separation from Marfan syndrome, is that the mutant protein IS secreted and assembled: this is a functional defect in matrix-cell communication through the RGD motif rather than a fibrillin-1 deficiency. Same gene, different domain, opposite tissue behaviour, and Marfan is curated as a differential on exactly that basis. The TGF-beta node is stated as increased pathway ACTIVITY rather than increased synthesis, and an apparently contradictory human finding (no difference in TGF-beta transcript, PMID:19468049) is curated as PARTIAL rather than REFUTE with the reasoning made explicit: unchanged transcript alongside raised nuclear phospho-Smad2 is exactly what a release-of-sequestered-latent-cytokine mechanism predicts, so it constrains the claim rather than contradicting it. That reading is also recorded as an OPEN_QUESTION discussion with a proposed active-versus-total TGF-beta measurement, since the two observations come from different patients, different disease forms, and different assays. A HUMAN_MODEL_MISMATCH records the entry's principal unresolved problem: the knock-in mouse is emphatically inflammatory with autoantibody production while human lesional histology is famously bland, which matters because the mouse therapeutic responses were reported alongside normalisation of that infiltrate. The mouse limitations field states that consequence explicitly. Also curated: the distinction between integrin modulation PREVENTING fibrosis and TGF-beta antagonism REVERSING it, the latter being the only lead in this disease pointing at regression of established lesions. Secukinumab is recorded as used but its usual mechanistic rationale is rejected in notes, because the reported responder carried an IL17C variant while the drug blocks IL-17A, different cytokines through different receptors. datasets deliberately left empty with the reason recorded, since searching the gene symbol would surface Marfan and aortic-aneurysm datasets (dataset-search NEC trap). clinical_trials deliberately empty; the only loose hit was a multi-hundred-condition newborn screening study. Every reference_title was written as PLACEHOLDER and filled programmatically from cache; 21 filled, 0 mismatches. Validated: just validate passed on first pass; count-verified-snippets 21/21; title audit 21 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK; all downstream and target_mechanisms targets resolve.

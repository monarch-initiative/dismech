  summary: Add three pooled-frequency phenotypes; my transposition claim was wrong
  details: |
    CORRECTION TO MY OWN PUSHBACK IN THE PRECEDING RECORD AND COMMIT MESSAGE. I declined to curate hypertrichosis at 52.6 per cent on the grounds that the review had transposed figures, asserting that 52.6 per cent belonged to thigh skin sclerosis and 31.3 per cent to hypertrichosis. That was wrong. Reading the source table directly: skin manifestations across 154 patients give hyperpigmentation 57 at 37.0 per cent, hypertrichosis 81 at 52.6 per cent, and subcutaneous nodules 43 at 27.9 per cent. The 31.3 per cent figure I relied on is from the 16-patient PUMCH cohort, a different denominator; and thigh skin sclerosis independently happens to be 81 at 52.6 per cent, an identical-number coincidence which is exactly what made the review look transposed to me. The reviewer was right on both the figures and the reason I misread them. Added all three phenotypes with the pooled figures. The snippet is a run of table text rather than prose, because the pooled frequencies appear only in the table; each explanation states that and, on hypertrichosis, records the coincidence with thigh sclerosis so a future reader does not repeat my inference. Frequency bands: hypertrichosis and hyperpigmentation FREQUENT, subcutaneous nodules OCCASIONAL at 27.9 per cent, which sits inside the 5 to 29 per cent band. Validated: just validate passed; count-verified-snippets 29/29 (was 26/26); check_folded_hyphens OK; check-title-snippets OK. Phenotype count verified as 6 by parsing the file rather than assumed.

  summary: 'Address review: subtypes, histopathology, diagnosis, fix mis-cited evidence'
  details: |
    Addressed the six blocking findings. Two were evidence cited for claims it does not make: the Stiff skin phenotype was evidenced by a sentence calling the disease ultrarare and untreatable, which supports rarity and is already used correctly in the prevalence block, and Flexion contracture was evidenced by a statement about what patients were treated with, which describes management. Both replaced with quantified cohort sentences (thigh skin sclerosis 52.6 per cent; joint restriction 35.7 per cent), and the contracture record gained the diagnostic-delay association. Added has_subtypes for the widespread and segmental forms and REMOVED segmental stiff skin syndrome from differential_diagnoses, where it was wrongly filed; a subtype is not a differential, and the distinction carries evidential weight here because most of the best downstream mechanistic data were generated in segmental cases. Added histopathology with the characteristic thickened horizontally oriented collagen bundles and adipocyte entrapment, the latter being the finding that actually explains why the skin binds to underlying tissue rather than merely thickening. Added diagnosis recording skin biopsy as gold standard and, importantly, that in the reported series it followed a period of ineffective treatment, which matches the diagnostic-delay finding elsewhere in the entry. The most substantive correction is to the inflammation negative. The phenotype asserted outright absence of inflammatory infiltrate; the largest pooled series reports lymphocyte infiltration as relatively rare at 12.6 per cent, not absent. Renamed to sparse or absent, rewritten to state the claim at the strength the evidence supports, and the 12.6 per cent figure added as PARTIAL because it qualifies rather than confirms the absolute form. Noted that the same publication reports outright absence in its own 16-patient series, so the two figures describe different cohorts within one paper rather than contradicting each other. The mouse/human mismatch survives this correction intact, since sparse lymphocytes remain a different thing from the dense pDC, T helper and plasma cell infiltrate with autoantibody production seen in the model. One reviewer detail not adopted as given: the review listed hypertrichosis at 52.6 per cent, but the source assigns 52.6 per cent to thigh skin sclerosis and 31.3 per cent to hypertrichosis, so the curated figures follow the source rather than the review summary. Validated: just validate passed; count-verified-snippets 26/26 (was 21/21); title audit 26 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK.

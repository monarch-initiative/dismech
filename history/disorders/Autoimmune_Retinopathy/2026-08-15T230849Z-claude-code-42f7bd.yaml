  details: |
    Weekly compliance pass. Added classifications.harrisons_chapter (IMMUNE_RHEUMATOLOGIC + ONCOLOGY_HEMATOLOGY) with rationale notes; added PMID-backed evidence to all three subtypes (CAR, MAR, npAIR) and to all four previously bare causal edges, each also given an explicit causal_link_type. Every new evidence item carries reference_title, taken from titles already in references_cache; no pre-existing evidence item was modified, and the entry file is a pure addition (123 insertions, 0 deletions). All PMIDs were already cited by this entry, so no new references were fetched. One edge carries a deliberate REFUTE item recording that the pathogenicity of anti-retinal antibodies is disputed in the 2025 review, so the antibody-to-injury link is not curated as settled. Weighted compliance 71.8 percent to 80.7 percent. Validated with just validate, just validate-terms and just count-verified-snippets (28/28 verified).

    Merge resolution against origin/main, recorded before merge because history records are append-only afterwards. While this PR was open, main gained an independent evidence audit of twenty eye-disease entries (PR 10537) plus the retirement of the PARTIAL and WRONG_STATEMENT evidence values (PR 10003). Main had independently curated this entry's classifications block with cited evidence, and had added its own evidence to the same subtypes and causal edges this branch targeted. The claim above that the entry file is a pure addition was true of the original session and is no longer true of the merged result.

    Six content conflicts were resolved as follows. For the CAR and MAR subtypes, the nyctalopia edge, and the antibody-to-injury edge, both sides' evidence items were kept: they cite different papers for the same claims and are complementary rather than competing, and multiple evidence items per claim is the normal pattern. For the antibody-to-injury edge, main's more conservative description was kept (antibody-mediated retinal cell injury) over this branch's wording, which asserted complement-mediated cytotoxicity that the cited snippets do not establish. For the npAIR subtype and the visual-field edge, both sides quoted the same sentences and main's canonical wording was kept. The duplicated classifications block, a duplicate YAML key that PyYAML resolves silently and linkml-reference-validator rejects, was folded into the single block at main's position, keeping main's cited evidence and grafting this branch's rationale notes onto both classification values.

    One stale prose fix was made to merged content: an explanation on the nyctalopia edge still read PARTIAL because the abstract does not state the nyctalopia outcome itself, naming an enum value retired by PR 10003. It was reworded to state the indirectness in prose without naming the retired value. The evidence value itself was already migrated and was not changed.

    Re-validated on the merged tree with just validate (39/39 snippets verified), just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-causal-targets and just check-enum-values.

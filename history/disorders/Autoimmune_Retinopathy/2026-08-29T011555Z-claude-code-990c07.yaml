       manually).

    2. **MAJOR — caspase-3 / alpha-enolase mechanism / complement attributed to sources that
       never state them.**
       - Node "Photoreceptor and Bipolar Cell Injury by Autoantibodies" description rewritten:
         caspase-3 removed (now "culminates in photoreceptor apoptosis", matching PMID:16444517);
         alpha-enolase glycolytic-ATP-failure mechanism removed (now "among the most commonly

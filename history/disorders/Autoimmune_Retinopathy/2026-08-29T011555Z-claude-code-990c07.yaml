    ## Findings fixed

    1. **MAJOR — `references[].findings[].supporting_text` curator commentary (all 12 entries).**
       Every `supporting_text` replaced with an exact excerpt from the cached abstract that
       states the finding. Where one `statement` spanned non-contiguous result sentences, the
       finding was split into two findings each with its own exact excerpt (PMID:39669695
       systemic vs biologic RRs; PMID:41003888 bilateral/malignancies vs 49.1% CAR worsening;
       PMID:41400833 >80% ERG/ARA testing vs 755 cases/77 publications; PMID:37958272
       structural vs functional baseline changes; PMID:34562437 CARBD-causation vs epitope
       spread; PMID:36473045 effectiveness-interpretation vs RCT-unlikelihood — the latter

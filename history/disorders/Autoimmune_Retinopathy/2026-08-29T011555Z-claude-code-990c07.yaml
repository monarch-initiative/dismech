         cached sources; none mentions complement.
       - The PMID:16444517 explanation "Directly establishes caspase-3-mediated apoptosis..."
         replaced with an apoptosis-only statement matching the abstract.
       - Upstream node's downstream-edge description "direct and complement-mediated
         cytotoxicity" softened to "antibody-mediated retinal cell injury".

    3. **MAJOR — Color Vision Defect: sole evidence quote never mentions color vision.**
       Removed the non-supporting PMID:40862484 multimodal-diagnosis item. Fetched two new
       references whose abstracts state the phenotype: PMID:33796514 (CAR case, "Best-corrected
       visual acuity was 20/50 in both eyes with reduced color vision", SUPPORT) and
       PMID:40986840 (npAIR case, "decreased color vision over the past 8 months", SUPPORT).

    4. **MINOR — bilateral >90% over-attribution.** Description now says "systematic review of

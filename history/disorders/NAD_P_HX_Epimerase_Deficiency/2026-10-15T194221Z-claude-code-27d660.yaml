  summary: 'Create: NAD_P_HX_Epimerase_Deficiency'
  details: |
    New entry for NAD(P)HX epimerase (NAXE) deficiency, PEBEL1 (MONDO:0020781), curated as a Disease separate from the existing NAD_P_HX_Dehydratase_Deficiency (PEBEL2) entry. Deep research: falcon was requested but unreachable (503 authentication failure on two attempts; the --fallback flag did not engage because the client classifies that error as transient), so one claude_code report was generated. It was thin (three web searches, no full text) and was used only as a source of leads; just preflight-dr returned WARN only because NAXD is named as the sister disorder. The report and its citations sidecar are not committed in this PR, pending a maintainer decision, because the generated frontmatter records model identifiers. All claims were checked against primary literature fetched with just fetch-reference (founding series PMID:27616477 and PMID:27122014, the 30-case NAXE review PMID:35637064, later case reports, the 2026 Beijing nicotinamide series PMID:41578284, the zebrafish model PMID:41621837). Phenotype frequencies come from the NAXE-only 30-case review; evidence from studies pooling NAXE with NAXD is graded INDIRECT. ClinGen has NAXE assertions only for mitochondrial disease (Definitive) and Leigh syndrome (Limited), not this MONDO term, so no gene_disease_validity was recorded. No GeneReviews chapter exists. Validation: just validate, validate-terms, count-verified-snippets (93/93), the offline gates, and just validate-disorders all passed.

  summary: 'Revise Grin1 Rgsc174 records: human R844C report, links withdrawn, genotypes
    separated'
  details: |
    Revision of the preliminary Grin1 Rgsc174 (R844C) curation following the curator's scientific review. (1) Corrected the statement that no human R844C carrier is reported: added a GRIN1 variants record for c.2530C>T (p.Arg844Cys) citing Lemke et al. 2016 (PMID:27164704), separating what quoted Results text supports (recurrent de novo variant; no significant change in Imax or agonist affinity in Xenopus oocytes with GluN2B; the authors' untested hypothesis) from row values read off Table 1, which is an image (patients 24 and 25, NM_007327, heterozygous, de novo, CBD, 'Similar to wild-type', 'Unclear', 'Severe ID, MD, Sz'). Functional consequence left unclassified. (2) Withdrew the two positive model links (NMDA Receptor Gain-of-Function; Impaired Neurodevelopment); no human pathophysiology node was changed and no replacement link was added. Readout directions that the links carried are now stated in text, since readouts exist only inside a mechanism link in the current schema. (3) Split the record by genotype and system: heterozygous whole-animal findings, homozygous survival, and a primary cortical neuron experimental_models record holding the NMDA-evoked calcium result. PPI and conditioning-phase freezing are worded as no significant genotype difference detected. (4) Furuse 2010 culture conditions were read directly in the full-text PDF supplied by the curator (PMID20345915_2010FuruseEJN_.pdf): Methods, journal p. 1283, and figure 4 legend, p. 1285; the cached 2010 record is abstract only, so evidence items quote the 2013 restatement as BACKGROUND. Residue correspondence (NP_015566.1 and P35438 R844; A2AI21 R865) is recorded as a curator sequence comparison. Not done: comparison with the curator's own annotation files (Excel, BKSO/ALF), which have not been provided; HUMAN_MODEL_MISMATCH discussion and any mechanism link remain undecided.

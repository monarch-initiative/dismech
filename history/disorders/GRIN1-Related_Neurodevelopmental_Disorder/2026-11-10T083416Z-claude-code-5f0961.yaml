  summary: 'Grin1 Rgsc174: re-run and record the GluN1 residue 844 sequence comparison'
  details: |
    Who ran it: the AI curation agent (Claude Code). The human curator (yuki-yamagata) supplied the Furuse 2010 and Umemori 2013 PDFs but did not retrieve or compare sequences, and this comparison is not an independent check by them. Neither mouse paper reports this comparison.

    Earlier run: during the 4e2f1c74f revision the agent made the same comparison with an inline script. Its downloaded FASTA files survive only in that session's temporary scratch directory, the script and its output were not saved, and nothing from it was committed, so it cannot be reproduced from the repository. The run below is a new run, not a record of that one.

    Inputs, retrieved 2026-11-10T08:32:53Z: NCBI E-utilities efetch, protein NP_015566.1 (FASTA, 938 aa, sha256 79eb42e86a334e24cb68650f7c9ba16aa6069b424229c1752afc33047980dd08); NCBI efetch, nuccore NM_007327.4 coding-sequence translation (938 aa, identical sha256, header names NP_015566.1); UniProt REST P35438 (Mus musculus, sequence version 1, entry version 238, sequence last modified 1994-06-01, 938 aa, sha256 53de9c07754c1843710eb7dfbdcb2eea71a8f0b287c74128ee7d7143e3a3189d); UniProt REST A2AI21 (Mus musculus, sequence version 1, entry version 149, sequence last modified 2007-02-20, 959 aa, sha256 fa545457aaf10a3912d95aa3813734bd88788fe323877d7bf6effb1d2513ec25). URLs in links.

    Method: exact string operations in Python, no alignment program. NP_015566.1 and P35438 compared position by position (equal length). The P35438 segment 835-863 searched for as an exact substring in A2AI21. The Furuse 2010 figure 3D wild-type sequence KRHKDARRKQMQLAFAAVNVWRKNLQDR, in which the mutant allele changes the 7th residue (KRHKDACRKQ...), located in each sequence.

    Outputs: NP_015566.1 and P35438 both have R at 844 and the identical segment 835-863 IAYKRHKDARRKQMQLAFAAVNVWRKNLQ; they differ at 9 of 938 positions (5, 9, 17, 159, 212, 213, 267, 415, 460), none near 844. In A2AI21 residue 844 is G; the P35438 835-863 segment occurs once, starting at 856, so the corresponding arginine is residue 865. The figure 3D motif starts at 838 in NP_015566.1 and P35438 (changed arginine at 844) and at 859 in A2AI21 (changed arginine at 865).

    Not checked: the mouse transcript and nucleotide position of the C>T change (not given in either paper); the NM_007327 version behind c.2530C>T in Lemke et al. 2016 Table 1 (not given); which isoform Furuse 2010 numbered (inferred from the figure 3D sequence, not stated). Positional correspondence does not establish the same functional consequence.

    Entry change: the heterozygous record's notes now name who ran the comparison and point to this record, replacing the phrase 'Curator sequence comparison'. No other content changed. Comparison with the curator's own annotation files (Excel, BKSO/ALF) has still not been done.

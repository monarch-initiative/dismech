  summary: Add Grin1 Rgsc174 (R844C) ENU mutant mouse as an animal model
  details: |
    Added the first animal_models record to this entry: the heterozygous Grin1<Rgsc174> (R844C) ENU mutant mouse, curated from PMID:20345915 (original characterisation; cached abstract only) and PMID:23688147 (behavioural battery; PMC full text cached). Linked PARTIALLY_RECAPITULATES / LOW to two existing nodes. NMDA Receptor Gain-of-Function: increased and prolonged NMDA-evoked calcium influx, seen in homozygous but not heterozygous cultured cortical neurons; quoted from the 2013 paper as BACKGROUND because the 2010 abstract does not report it. Impaired Neurodevelopment: impaired fear memory and a mild working-memory deficit as proxies for the cognitive component, with typed PROXY_QUANTITY, POPULATION_MISMATCH and SPECIES_MISMATCH divergences. No new pathophysiology node was added for the glutamatergic-dopaminergic interaction the 2010 paper proposes, because a human node resting only on one mouse study would overstate it. Follow-up: whether the strain relates better to a psychiatric entry than to GRIN1-related encephalopathy, and the curators' existing annotations, are open. Validated with just validate-disorders (58/58 snippets) and the whole-repo offline gates.

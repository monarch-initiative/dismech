  summary: Adopt ClinGen-style name; map to MONDO:0014590
  details: |
    Supersedes the empty-mapping decision recorded for this entry on 2026-08-08, earlier in the same branch and never merged. That decision rested on the premise that SNAP25-DEE and congenital myasthenic syndrome 18 are distinct entities and that no MONDO class could hold this entry. MONDO triage on monarch-initiative/mondo#10532 rejected that premise: a new-term PR (mondo#10534) was opened and then closed unmerged, with the conclusion that OMIM:616330 -- equivalent to MONDO:0014590 -- is a single phenotype concept that OMIM has retitled 'developmental and epileptic encephalopathy-117 (DEE117)', retaining the myasthenic titles only as former names. Verified independently against MedGen's OMIM name block for MIM 616330: 'DEVELOPMENTAL AND EPILEPTIC ENCEPHALOPATHY 117' carries TTY=PT (preferred), while 'CMS18, FORMERLY' and 'MYASTHENIC SYNDROME, CONGENITAL, 18, FORMERLY' are marked former; the OMIM-sourced definition is the DEE description citing Klockner et al. 2021 (PMID:33299146), the same cohort this entry curates. Renamed the entry from 'SNAP25 Encephalopathy' to the ClinGen-style gene-anchored form 'SNAP25-Related Developmental and Epileptic Encephalopathy', matching repository convention (VAMP2-Related, CPLX1-Related, SNIP1-Related) and the label MONDO has proposed. Updated the single foreign key in the Synaptic_Vesicle_Cycle_Disorders grouping; the filename is unchanged, since dismech filenames routinely abbreviate entry names. Bound disease_term to MONDO:0014590 reproducing its current canonical label verbatim as term validation requires, with preferred_term carrying the intended clinical name, and added a top-level note explaining why the label reads as a myasthenic syndrome so the binding is not later 'corrected' back to the unrelated GLS entity MONDO:0032678. Added SNAP25-DEE, DEE117, and the former myasthenic titles as synonyms. Schema validation, term validation, term-cache integrity, cache ordering, and the grouping audit under --strict all pass.

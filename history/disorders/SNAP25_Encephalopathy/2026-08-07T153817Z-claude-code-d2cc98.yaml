  summary: 'Fix incorrect disease_term: MONDO:0032678 is the GLS entity, not a SNAP25
    entity'
  details: |
    Corrected the disease_term binding. The entry carried MONDO:0032678 'developmental and epileptic encephalopathy, 71', which is not a SNAP25 entity: it is the GLS glutaminase-deficiency entity (xref OMIM:618328 and Orphanet:557064, classified under the MONDO grouping class MONDO:0600001 glutaminase deficiency, and carrying the exact synonym 'neonatal epileptic encephalopathy due to glutaminase deficiency'). The mis-binding was found while curating the GLS allelic series in this same branch, when the new neonatal glutaminase-deficiency entry needed that term. It is a Named Entity Confusion error of the kind described in CLAUDE.md, produced by matching on the shared label phrase 'developmental and epileptic encephalopathy'; no anti-hallucination check can catch it, because the term exists, its label matches the recorded label exactly, and it passes term validation. Rebound to MONDO:0100062 'genetic developmental and epileptic encephalopathy', a non-specific but correct parent, with the specific identity retained in preferred_term. Deliberately NOT rebound to MONDO:0014590 congenital myasthenic syndrome 18, which is the only SNAP25-specific term in MONDO and MedGen but describes a myasthenic syndrome rather than the DEE curated here. Added an INTERPRETATION discussion recording the ontology gap and the resolution path (request a SNAP25-related DEE class upstream in MONDO citing PMID:33299146, then rebind). Validation: schema, term and reference validation passed; 22/22 snippets verified against cached references.

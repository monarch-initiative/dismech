  summary: Treatment evidence for SNAP25 encephalopathy
  details: |
    Weekly compliance sweep targeting treatments. None of the three treatments carried evidence. Added six evidence items drawn from the Kloeckner SNAP25-DEE cohort (PMID:33299146, abstract only in cache) and from the Rohena index case report (PMID:25003006, newly fetched with full text). Antiseizure Medication now cites early-onset epilepsy as a core SNAP25-DEE symptom and the index case's failure of more than eight antiseizure drugs plus ketogenic diet and steroid trials. Supportive and Developmental Care cites the recurrent movement disorder and cerebral visual impairment findings, and the enteral/gastrostomy feeding course in the index case. Genetic Counseling cites the all-de-novo cohort and the parental sequencing that established de novo origin. The levetiracetam therapeutic_agent binding was left in place: unlike the STX1B and DNM1 entries reviewed in the same sweep, no cited source here names a different agent, so there is nothing to correct it to. It remains unsourced. Validated with just validate, just validate-terms, just count-verified-snippets (27/27), just check-snippet-grading, and just check-snippet-length.

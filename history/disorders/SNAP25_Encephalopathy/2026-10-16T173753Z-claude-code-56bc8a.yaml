  summary: Merge Congenital_Myasthenic_Syndrome_18 into SNAP25_Encephalopathy
  details: |
    Merged the duplicate Congenital_Myasthenic_Syndrome_18 entry into this one. Both entries bound MONDO:0014590, which MONDO and OMIM treat as one class: OMIM:616330 is now titled developmental and epileptic encephalopathy 117, with myasthenic syndrome, congenital, 18 kept only as a former title, and MONDO lists SNAP25-DEE as a synonym of the class. This entry was kept because its name matches OMIM's current title and because Congenital_Myasthenic_Syndrome.yaml and the pathograph node-class file already pointed here.

    Folded in from the retired entry: pathophysiology nodes Reduced Evoked Quantal Release at the Motor Endplate, Impaired Neuromuscular Junction Transmission and Central Synaptic Dysfunction, with their edges; the Dominant-Negative Disruption of the SNARE Complex node merged into SNAP-25 SNARE Assembly Defect (SNARE complex assembly process, motor neuron cell type, MOLECULAR scale, three evidence items) and the Impaired Calcium-Triggered Synaptic Vesicle Exocytosis node merged into Impaired SNARE-Mediated Vesicle Fusion (calcium-ion regulated exocytosis, motor neuron, CELLULAR scale, four evidence items, two new downstream edges). Phenotypes added: Fatigable Muscle Weakness, Ptosis, Congenital Joint Contractures, Neonatal Cyanosis, Cerebral Cortical Hyperexcitability, Cerebellar Ataxia, Delayed Psychomotor Development, Delayed Speech and Language Development, Dysarthria; Intellectual Disability merged with evidence unioned. Fatigable Muscle Weakness no longer carries diagnostic: true, because the Klockner cohort report does not describe it. Histopathology, classifications, the amifampridine treatment, five diagnosis rows (RNS/SFEMG, rapid WGS, EEG, endplate microelectrode study, brain MRI) and three differentials (myasthenia gravis, LEMS, other presynaptic CMS) added. Antiseizure Prophylaxis merged into Antiseizure Medication (levetiracetam agent and target mechanism added), Genetic Counseling and the molecular diagnosis row merged with evidence unioned, the SNAP25 genetic row gained relationship_type CAUSATIVE and the retired notes, the prevalence rows merged into one Worldwide row carrying all three evidence items, and the GeneReviews CMS overview reference added. The gap_cms18_dee_nosological_boundary discussion was kept. Dropped as a duplicate: the retired entry's differential diagnosis row naming this disease itself. Brain MRI prose was rewritten so that it no longer says atrophy argues against the diagnosis. A skos:exactMatch mondo_mappings row to MONDO:0014590 records the OMIM retitling.

    Every (reference, snippet) pair from both source files was checked programmatically to be present in the merged entry, except the dropped self-differential item. Validated with just validate, just validate-terms, just count-verified-snippets (205/205 across this file and Congenital_Myasthenic_Syndrome.yaml), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-block-scalar-comments, node-classes --verify-kb, check-granularity and check_shared_disease_terms.py.

    Review round on PR 14554 (four optional suggestions taken): removed two respiratory-failure statements that the notes say the cached abstract does not support; reworded the Brain MRI evidence explanation; made the Central Synaptic Dysfunction description agree with its edge to Cerebral Cortical Hyperexcitability; collapsed the CMS18 synonyms to one form each. A second round removed "with hypotonia" from the rapid-WGS row, which the cached abstract (PMID:36379720) does not state.

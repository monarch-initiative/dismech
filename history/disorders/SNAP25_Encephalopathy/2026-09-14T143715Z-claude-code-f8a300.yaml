  summary: 'Review response: drop unsourced levetiracetam binding'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR 10627.

    Removed the therapeutic_agent binding of CHEBI:6437 (levetiracetam) from the Antiseizure Medication treatment. The earlier session in this PR left it in place on the reasoning that no cited source names a replacement agent, but that inverts the dismech rule that no term beats a bad one: levetiracetam appeared nowhere else in the entry - no treatment name, no description, no snippet - so the binding was a machine-queryable claim with no support sitting inside the one treatment block this PR set out to evidence. The newly added PMID:25003006 item reports refractoriness to more than eight antiseizure drugs without naming any of them, which makes singling out one drug less defensible rather than more. treatment_term (NCIT:C15986 Pharmacotherapy) and therapeutic_modality (SMALL_MOLECULE) are unchanged; therapeutic_agent is recommended rather than required, so the block still validates.

    Also took three non-blocking review suggestions: widened the Supportive and Developmental Care description to cover the nutritional and enteral feeding support its gastrostomy snippet already evidenced, and labelled directness: DIRECT on the two plainly direct items that were unlabelled (the refractory-to-eight-drugs snippet and the parental co-segregation sequencing snippet).

    Deliberately not done: modelling the failed ketogenic-diet trial as its own NCIT:C15447 treatment with supports: REFUTE. The only source sentence covers diet and steroids together in one clause about multi-modal refractoriness, so splitting it into a standalone treatment would need a quote that isolates the diet, and none is available in the cached text.

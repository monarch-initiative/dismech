  summary: Remove curation-question discussion; clear placeholder MONDO binding
  details: |
    Removed the snap25_no_specific_mondo_term INTERPRETATION discussion: discussions record open bio/clinical questions, not curation/ontology-tooling questions, so this was the wrong venue. Cleared the disease_term binding to MONDO:0100062 (genetic developmental and epileptic encephalopathy), a non-specific parent used as a placeholder, leaving preferred_term to carry the entity identity. Verified independently with OAK that no SNAP25-related DEE class exists in MONDO: the only SNAP25-anchored term is MONDO:0014590 (congenital myasthenic syndrome 18), and the previously-bound MONDO:0032678 (DEE71) is is_a MONDO:0600001 glutaminase deficiency (the GLS entity, now correctly anchoring Neonatal_Epileptic_Encephalopathy_Due_to_Glutaminase_Deficiency). The term request is tracked as GitHub issue #8238 for the MONDO team rather than in-entry. Schema, term, and snippet validation pass.

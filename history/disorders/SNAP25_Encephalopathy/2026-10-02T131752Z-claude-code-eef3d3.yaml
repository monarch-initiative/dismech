  summary: Grade one PMID:25381298 quote consistently as IN_VITRO
  details: |
    The sentence 'Ile67Asn variant in SNAP25B is pathogenic because it inhibits synaptic vesicle exocytosis.' from PMID:25381298 was cited twice in this entry with two different evidence_source values: IN_VITRO on the Impaired Calcium-Triggered Synaptic Vesicle Exocytosis node and HUMAN_CLINICAL on the Central Synaptic Dysfunction node. evidence_source grades the cited publication's evidence for the quoted sentence, so one sentence carries one value. The conclusion rests on the paper's liposome-fusion and chromaffin-cell exocytosis assays, so both items are now IN_VITRO. No claim, snippet, or explanation text changed.

  summary: 'Create: Absence_Of_Fingerprints-congenital_Milia_Syndrome'
  details: |
    De novo curation of Basan syndrome (absence of fingerprints-congenital milia syndrome, MONDO:0007507, SMARCAD1 skin-specific isoform). Claim issue #13949. Deep-research report (research/Absence_Of_Fingerprints-congenital_Milia_Syndrome-deep-research-claude_code.md) used as leads only; all primary sources (PMID:21820097 Nousbeck 2011 AJHG, PMID:34909722, PMID:26932190, PMID:30289605, PMID:33486784, PMID:35212137, PMID:20619487) re-fetched and every snippet verified exact against references_cache. Pathograph: 5-node SMARCAD1 skin-isoform chain (splice-donor variant -> reduced skin-specific transcript -> inferred impaired epidermal chromatin remodeling -> failure of dermatoglyph development; branch to abnormal epidermal/adnexal development) wiring 5 of 7 phenotypes. Gene node grounded with GO:0140658 ATP-dependent chromatin remodeler activity. No ClinGen CGGV record for SMARCAD1 in cache, so gene_disease_validity omitted and noted. Lump/split: single-gene leaf DISEASE; isolated AD adermatoglyphia and Huriez syndrome kept as allelic differentials (proposed 'SMARCAD syndrome' spectrum unsettled). Retracted cSCC report PMID:35592705 excluded. Validation: validate-disorders clean, 30/30 snippets verified, check-gene-activity-grounding/snippet-length/snippet-grading/entity-refs/causal-targets/coarse-phenotypes all OK.

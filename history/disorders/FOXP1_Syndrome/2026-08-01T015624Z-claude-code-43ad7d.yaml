  summary: 'Create: FOXP1 Syndrome'
  details: |
    Created kb/disorders/FOXP1_Syndrome.yaml (MONDO:0013352; FOXP1 / hgnc:3823; OMIM 613670; ORPHA:391372) from a minimal stub.

    Content curated: 46 phenotypes with HPO bindings across neurologic, behavioral, ophthalmologic, cardiovascular, renal, genitourinary, gastrointestinal, craniofacial, musculoskeletal, otologic, immunologic and growth categories; a 13-node pathophysiology graph with causal downstream edges running heterozygous FOXP1 loss-of-function to loss of transcriptional repression, to a dysregulated neurodevelopmental transcriptional program (Notch/Jagged1 de-repression), to impaired neural progenitor differentiation, impaired cortical radial migration and impaired striatal medium spiny neuron development, to neocortical cytoarchitectonic alteration and altered striatal circuit excitability, and finally to impaired speech and vocal communication output, global developmental delay and intellectual disability, autistic features and behavioral dysregulation, and dependence in activities of daily living, plus a separate extra-CNS node. GO, CL and HGNC terms bound on the mechanism nodes. Genetic section with the FOXP1 gene descriptor, DE_NOVO variant origin, and two functionally characterized variants (p.Arg525Gln and p.Val423Hisfs*37). Structured prevalence (CASES_IN_LITERATURE, ULTRA_RARE). Nine treatments with NCIT terms and therapeutic_modality. Diagnosis block, a DIAGNOSTIC_CRITERIA definition, progression, clinical_burden, five animal models, two clinical trials, a differential diagnosis versus FOXP2-related disorder, and a HUMAN_MODEL_MISMATCH discussion on the postnatal FOXP1-reinstatement window with three proposed experiments.

    Deep research: an Edison/Falcon run (research/FOXP1_Syndrome-deep-research-falcon.md) was used as leads only. NEC preflight passed: the report gene FOXP1 and MONDO:0013352 match the intended entity. Every DR-sourced DOI was resolved to a PMID via the PMC ID converter and fetched with just fetch-reference. Two DR ontology suggestions were rejected on verification: HP:0002167 proposed for speech apraxia (correct term HP:0011098; HP:0002167 is Neurological speech impairment), and HP:0000431 proposed for wide nasal tip (its actual label is Wide nasal bridge). The DR report claimed no Orphanet code could be established; ORPHA:391372 was confirmed independently from the MONDO record and the Orphadata cache.

    GeneReviews PMID:37733892 was fetched, tagged in the top-level references block, and cross-referenced feature by feature against the Clinical Characteristics section. Quantitative frequency bands are anchored on the pooled 62-person review PMID:33892622 and the prospective Mount Sinai cohorts PMID:29090079, PMID:34588003 and PMID:40066139; frequency was deliberately omitted where GeneReviews applies "common findings" collectively to a group rather than to individual items.

    Validation: just validate passes (schema: No issues found; term validation passed; 179/179 snippets verified against cached references). just validate-terms and just validate-references pass individually. Compliance 97.9 percent global, 98.2 percent weighted.

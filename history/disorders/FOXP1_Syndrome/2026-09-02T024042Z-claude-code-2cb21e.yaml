  summary: 'Phenotype review: FOXP1_Syndrome'
  details: |
    Campaign phenotype review of all 46 phenotypes on three axes. (1) Snippet-claim consistency: every phenotype evidence item was re-read against the cached source in whole-abstract/full-text context; all snippets were genuine, but three items whose explanations already called themselves partial support were carrying supports: SUPPORT and were re-expressed per the issue 7439 narrowing as SUPPORT with directness: INDIRECT (ASD 50% trait-level row vs the 24% DSM-5 band; the mouse whisker-stimulation analog of the human sensory phenotype; the direction-unspecified abnormal-muscle-tone row cited under Hypertonia). The Hypotonia pooled-review snippet was replaced with the summary-table row that actually names hypotonia (the prose figure is split by a line-break hyphen in the cached PDF text), the Micropenis snippet was extended to include the 3/41 (7%) figure the explanation relies on, and a Seizures explanation that contradicted the curated OCCASIONAL band was corrected. Hypertonia gained the FREQUENT band from the pooled review's Hypertonia/muscle spasms 20/58 (34%) figure, previously uncurated. (2) HPO bindings: two rebinds - Renal and Urinary Tract Anomaly from HP:0000077 (kidney only) to HP:0000079 Abnormality of the urinary system, since the claim is CAKUT and covers the urinary tract; Contractures and Spasticity from HP:0001371 Flexion contracture to HP:0034392 Joint contracture, since neither source specifies flexion. All other bindings judged optimal, including deliberate grouping-level choices already documented in-file (HP:0011220 prominent forehead, HP:5200046 sensory behavioral abnormality). (3) Pathograph: the entry had 0/46 phenotypes causally connected despite a complete mechanism chain ending in four organism-scale endpoint nodes. Added 27 downstream edges from those nodes: speech-motor node to the 5 speech/oromotor phenotypes plus feeding difficulties and dysphagia (via oromotor dysfunction, GeneReviews-attributed); GDD/ID node to GDD, ID, motor delay, delayed bladder control; behavioral node to ASD, ADHD, anxiety, RRB, sensory, sleep (GeneReviews groups sleep under behavior abnormalities); extra-CNS node to cardiac, renal/urinary, cryptorchidism, micropenis, recurrent respiratory infections, and the four ophthalmic findings (all INDIRECT_UNKNOWN_INTERMEDIATES, with the mouse tissue-requirement evidence on the cardiac and immune edges); transcriptional-program node to structural brain abnormality. The remaining 19 phenotypes were deliberately left unwired and covered by three new KNOWLEDGE_GAP discussions (craniofacial gestalt and minor anomalies; tone/contractures/epilepsy/Chiari; growth/hearing/otitis) because no verifiable mechanism exists. Connectivity 0/46 to 27/46. Validated: just validate, count-verified-snippets (190/190), validate-terms, check-duplicate-keys, check-entity-refs, validate-disorders all pass.

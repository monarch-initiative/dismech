  summary: 'Create: Spondyloepiphyseal Dysplasia, Kondo-Fu Type (MBTPS1, MONDO:0032721)'
  details: |
    De novo curation of SEDKF (MBTPS1 / site-1 protease deficiency). GeneReviews exists for this disease (PMID:38048414) and was used as the mandatory phenotype baseline; its Clinical Characteristics list is the source for most phenotypes, and it is tagged GeneReviews in the top-level references block. Mechanism comes from the founding single-patient paper (PMID:30046013), which establishes the ~1% residual functional transcript, the selective failure of the BBF2H7 ER-stress transducer, the partial impairment of mannose-6-phosphate lysosomal delivery, and a two-way rescue. Two curation choices are flagged in the entry notes for review: Preserved Lipid Homeostasis is curated as a pathophysiology node although it records a function that is NOT disrupted, because S1P's best-known role is SREBP activation and the sparing of that arm is what makes the skeletal phenotype interpretable; and the elevated lysosomal hydrolases are curated as a biochemical marker with a free-text preferred_term and no ontology binding, because HPO has single-enzyme terms but none for a generic multi-enzyme elevation, and binding a single-enzyme term would misstate the finding. Nomenclature discrepancy recorded: MONDO/OMIM say spondyloepiphyseal, GeneReviews says spondyloepimetaphyseal; the entry name follows MONDO and the phenotype binding follows the radiographic description. Deep research: one Perplexity sonar-deep-research report, committed; it carries no reference_validation or term_validation block and cites URLs rather than identifiers, so every reference was located independently via PubMed and cached. Validation: just validate passed, 44/44 snippets verified, just validate-terms passed, entity-refs / causal-targets / duplicate-keys passed.

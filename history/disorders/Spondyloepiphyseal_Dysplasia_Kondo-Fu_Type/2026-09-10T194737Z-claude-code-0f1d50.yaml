  summary: 'Review round 1: GeneReviews Management and Genetic Counseling mined, five
    phenotypes added, GO binding corrected, CI snippet fixed'
  details: |
    Review round 1 on PR #11642, answering the ai4c-reviewer CHANGES_REQUESTED verdict, plus one CI failure, in a single push.

    CORRECTION TO THE PRECEDING RECORD IN THIS DIRECTORY. That record states the deep-research report "carries no reference_validation or term_validation block". That is false. The committed report carries both: reference_validation at frontmatter line 24, flagging off_topic_references [PMID:32316092], and term_validation at line 37 with needs_review true, confabulation_rate 0.0, and one obsolete term GO:0006486. History records are append-only, so the earlier record is left as written and this one supersedes the claim. The same false claim was made in all five PR descriptions of this batch and in five history records; it originated in reading the report frontmatter seconds after the provider returned, before the recipe appends the validation blocks, and then repeating that stale observation without re-reading. The rest of that sentence stands: the report cites URLs rather than identifiers, and every reference here was located independently via PubMed.

    Neither flagged item reached the entry. GO:0006486 does not appear in the YAML. PMID:32316092 was read and is a hepatocellular-carcinoma paper unrelated to this disease; the check and the reason are now recorded in the entry notes.

    CI FAILURE FIXED. check_snippet_length failed on phenotypes[2].evidence[1] - the four-word snippet '80% had bilateral cataracts' carries no statement of what the percentage is over. Replaced with the whole summary sentence from the same source. The same defect was found and fixed in two sibling entries of this batch by scanning all five rather than only the one CI named.

    REVIEW ITEM 1, treatments. The entry had no treatments section at all. Eight treatments added, all mined from the GeneReviews MANAGEMENT paragraph in the committed cache, all with quoted evidence: orthopedic management of kyphoscoliosis/scoliosis/hip dysplasia, vitamin D and calcium supplementation, physical therapy, cataract surgery, inguinal hernia repair, craniofacial management of craniosynostosis, developmental and educational support, and recombinant human growth hormone therapy. Three carry target_mechanisms so the pathograph has treatment join points: orthopedic management and physical therapy into Defective Endochondral Skeletal Development, vitamin D and calcium into Extracellular Lysosomal Enzyme-Mediated Bone Matrix Degradation, each typed MODULATES because none of them acts on the lesion.

    Two treatment_terms are bound to the generic NCIT:C49236 Therapeutic Procedure rather than to a modality-specific term, because GeneReviews says "per orthopedist" and "per craniofacial specialist" without naming a modality; asserting NCIT:C16186 Orthopedic Surgical Procedure would claim surgery the source does not. therapeutic_modality is unset on those two and on the growth hormone item for the same kind of reason, recorded in each treatment's notes.

    The GeneReviews agents-to-avoid instruction (avoid spine-stressing sports in significant kyphoscoliosis) is recorded in the physical therapy treatment's notes because Treatment has no contraindication slot. The Surveillance and Pregnancy management paragraphs are recorded in the entry notes for the same reason - no slot exists for either.

    REVIEW ITEM 2, genetic counseling. Two GeneReviews quotes added to the inheritance block: the 25/50/25 recurrence risk and the carrier-testing/prenatal/PGT statement. Note that Inheritance has no notes slot, so the provenance sentence intended for it was dropped rather than forced elsewhere.

    REVIEW ITEM 3, missing phenotypes. Five added: Macrotia (HP:0000400), prominent cheekbones (deliberately unbound - HP:0000293 Full cheeks is soft-tissue fullness, a different claim from a prominent zygomatic contour), Short metacarpal (HP:0010049), Short metatarsal (HP:0010743), Copper beaten skull (HP:0034271). The reviewer was right that the old rationale could not distinguish these from the three facial phenotypes already curated off the same quote; the notes now say so explicitly rather than restating a rationale that did not hold. Macrotia gains a second, independent source: the rhGH case report describes the patient's facies with macrotia.

    REVIEW ITEM 4, GO binding. GO:0032964 collagen biosynthetic process / DYSREGULATED contradicted the node's own description, which says collagen is synthesised but not exported. Rebound to GO:0006888 endoplasmic reticulum to Golgi vesicle-mediated transport with modifier DECREASED. The co-bound GO:0034976 / INCREASED is unchanged.

    SUGGESTIONS TAKEN. The unverified rhGH lead PMID:36816387 was fetched and is real - a 2023 Frontiers in Pediatrics case report of a three-year rhGH course in a SEDKF patient. It is now a fifth reference and the source for the growth hormone treatment, for the Macrotia corroboration, and for the new prevalence record. A prevalence record was added with measure_type CASES_IN_LITERATURE and prevalence_class ULTRA_RARE, no rate, quoting that paper's explicit count of the reported literature. The mixed-source OTHER evidence item was split: the definitional half stays OTHER, the functional half is graded MODEL_ORGANISM with an explanation stating that the sentence rests on mouse AND cell-culture work at once and that evidence_source, being single-valued, cannot hold both - splitting further would require splitting the sentence.

    SUGGESTIONS NOT TAKEN, with reasons. No mappings block: DiseaseMappings has slots only for ICD-10-CM, ICD-11-Foundation, MONDO and NCIT, and the identifier the reviewer suggested, OMIM 618392, has no slot. No classifications block: the ISDS skeletal nosology would be the right classification, and the identifier reached for it, PMID:37454339, resolved to an X-linked agammaglobulinemia transplant survey, so nothing is recorded rather than a guessed group.

    CONNECTIVITY. Six downstream edges added from Defective Endochondral Skeletal Development, to Scoliosis, Pectus carinatum, Pectus excavatum, Short metacarpal and Short metatarsal. Copper beaten skull is deliberately left unconnected: the calvaria ossifies intramembranously, so an endochondral growth-plate lesion is not the obvious cause and no source states it.

    The growth hormone treatment carries a SUPPORT item and a REFUTE item quoting the only two reported courses, which had opposite outcomes. dismech has no way to record that two evidence items conflict with each other, as opposed to each being graded independently against the claim, so the conflict is stated in the treatment description and notes. This is a live instance of issue #11142.

    VALIDATION. just validate passed with 63/63 snippets verified against cached references, up from 44/44. just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-length and check-enum-values all passed.

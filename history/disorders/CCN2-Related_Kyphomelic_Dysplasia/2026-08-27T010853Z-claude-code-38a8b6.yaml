  summary: Classify into ISDS group 20 as a documented post-revision extension
  details: |
    The entry had no isds_skeletal_category. Added bent_bone_dysplasia.

    This one is an extension of the table rather than a transcription of it, and the note says so at length. CCN2 was published in 2024 (PMID:39506047), after the 2023 revision closed, so the committee could not have listed it. The hook used is that group 20's single kyphomelic row, NOS 20-0040, is keyed to MIM 211350 - the identifier OMIM now anchors to this recessive CCN2 form - while being named for KIF5B, and carries the committee's own caveat that the kyphomelic label has been applied to heterogeneous conditions. The schema's curation guidance says not to extend the nosology to disorders the committee chose not to list; the judgement recorded here is that the committee did not choose to omit this entity, it predated it, and that leaving a bona fide bent-bone dysplasia unclassified would be the worse error. Flagged in the note for re-verification against the next revision.

    Part of a completeness and consistency pass over ISDS 2023 nosology group 20 (Bent bones dysplasia group). After this pass all six 2023 rows are curated and classified, plus the post-revision CCN2 entity.

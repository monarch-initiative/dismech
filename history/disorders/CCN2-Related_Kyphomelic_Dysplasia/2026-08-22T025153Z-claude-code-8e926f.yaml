  summary: 'Create: CCN2-Related_Kyphomelic_Dysplasia (member of the Kyphomelic Dysplasia
    grouping)'
  details: |
    Created as one of two member Disease entries under the new kb/groupings/Kyphomelic_Dysplasia.yaml grouping, resolving claim issue #9221.

    The stub for kyphomelic dysplasia (MONDO:0008881) arrived carrying a single causal gene (CCN2) from MONDO, which made it look like a leaf disease. It is not. Two molecularly distinct entities exist under the label: de novo heterozygous KIF5B variants (dominant; kinesin-1 heavy chain motor domain) and biallelic CCN2 variants (recessive; matricellular protein controlling chondrocyte proliferation). Both defining papers open by describing kyphomelic dysplasia as a heterogeneous group of skeletal dysplasias -- the authors' own judgement that the label is a grouping, not a disease.

    Rather than curate a single Disease that would have merged a kinesin-motor disorder with a cartilage growth-factor disorder on the strength of a shared radiographic appearance, the concept was resolved as a Grouping with two member Disease entries. The entry_type outcome for the stub is GROUPING.

    This entry carries the disease-specific pathograph, phenotypes, genetics and differentials for its own molecular form, and points at the grouping for the MONDO mapping and the lump/split reasoning. Neither member asserts disease_term: MONDO:0008881 belongs to the grouping concept, and binding it to one member would assert an equivalence the literature does not support.


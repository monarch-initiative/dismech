  summary: 'Create: Immune Dysregulation With Immunodeficiency Due To AIOLOS Haploinsufficiency'
  details: |
    New entry for MONDO:0979328 from the founding haploinsufficiency study (PMID:38015619, full text: E82K and Q402* in 9 carriers from 3 families), the M77L rubella-granuloma family (PMID:41746515, full text), a 2024 review of AIOLOS inborn errors (PMID:38773004) and the Aiolos-null mouse (PMID:12574333). Pathograph: unstable N-terminal missense alleles (proteasomal degradation) and the truncating Q402* allele converge on reduced AIOLOS transcriptional activity, leading to impaired memory B cell differentiation and antibody production (hypogammaglobulinemia, low switched memory B cells) and, by unknown intermediates, to loss of immune tolerance (ITP, Hashimoto thyroiditis, SLE, autoimmune hepatitis, allergy). The dominant-negative IKZF3 alleles (G159R, N160S, G191R) are scoped out because MONDO places them under immunodeficiency 84 (MONDO:0030333). Deep research: just research-disorder falcon with fallback; falcon had no usable key, so openscientist produced the report. preflight-dr returned WARN because IKZF1 is mentioned often; those mentions are IKAROS-family paralog context, not a second disease. All 12 report references resolved. The report adds the Aiolos-null mouse lupus model, now linked to the tolerance node as a partial, low-fidelity model; it groups the dominant-negative alleles with this disease, which the entry does not follow; its flagged CURIE (HP:0005550 used for B-cell lymphoproliferation) was not adopted. Validated with just validate, count-verified-snippets (34/34), validate-terms and the per-file and whole-repo gates.

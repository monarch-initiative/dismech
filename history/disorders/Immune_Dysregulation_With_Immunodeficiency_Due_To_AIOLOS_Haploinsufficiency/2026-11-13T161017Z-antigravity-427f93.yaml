  summary: Review and enrich AIOLOS haploinsufficiency classifications, variants,
    grounding, diagnosis, and treatments
  details: |
    Added Harrison's chapters (IMMUNE_RHEUMATOLOGIC, GENETICS_ENVIRONMENT_DISEASE) and IUIS classification (combined immunodeficiency with syndromic features via PMID:41608114), top-level references block, structured IKZF3 germline variants (p.Gln402Ter, p.Glu82Lys, p.Met77Leu), GO/CL/UBERON grounding across pathophysiology nodes (GO:0046982, GO:0042803, GO:0003677, GO:0002507), four diagnostic evaluations (Whole Exome Sequencing, Lymphocyte Subset Immunophenotyping, Serum Immunoglobulin Measurement, AIOLOS Protein Expression and Stability Immunoblotting), and enriched treatments (corrected Immunoglobulin Replacement Therapy target_mechanisms from phenotype Hypogammaglobulinemia to mechanism Impaired B Cell Memory Differentiation and Antibody Production, and added Antibiotic Therapy NCIT:C15620).

  summary: 'Review round 1: split allergy/asthma, add immune-dysregulation phenotypes
    and immunosuppressive treatment'
  details: |
    Addressed the first automated review. Split the bundled Allergy and Asthma phenotype into Allergy (HP:0012393, 5/9 carriers per the review in PMID:38773004) and Asthma (HP:0002099), each with its own edge from Loss of Immune Tolerance. Added phenotypes from the cached founding paper (PMID:38015619) and review: sarcoidosis (bound to HP:0002955 Granulomatosis; HP has no sarcoidosis term), erythema nodosum, bilateral uveitis, Sjogren-like sicca syndrome (keratoconjunctivitis sicca), polyarthritis, polymyalgia rheumatica (left unbound: OLS searches of HP for 'polymyalgia rheumatica' and 'polymyalgia' return no term) and noninfectious colitis, all linked under Loss of Immune Tolerance by unknown-intermediate edges. Added the review's 5/9 autoimmune-disease frequency to the tolerance node. Added an Immunosuppressive Therapy treatment (NCIT:C15261) with prednisone, mycophenolate mofetil and infliximab as agents, targeting Loss of Immune Tolerance, citing the review's varied-response summary, the E82K carrier controlled on prednisone then mycophenolate, and the M77L carrier's response to infliximab. Took both optional suggestions: the parent 'Combined immunodeficiency' became 'Disease of immune dysregulation', and the convergence evidence item was regraded IN_VITRO. Also merged main twice to clear a cache-row merge conflict and a stale Isolated_Pierre_Robin_Syndrome copy that tripped the gene-grounding gate; the PR diff stays limited to this entry.

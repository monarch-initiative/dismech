  summary: Cite evidence for 6 previously evidence-free environmental exposures
  details: |
    Issue 8296 tranche 1. Sources were located by PubMed search, cached with `just fetch-reference`, and every snippet was verified as an exact quote from the cached abstract. Added an EvidenceItem to each of the six `environmental:` exposures (Streptococcal Infection, Stress, Smoking, Obesity, Medications, Skin Trauma), which previously carried only a name and a one-line note. One note was corrected rather than merely cited: Obesity read 'Associated with severity', but the citable evidence is a Mendelian randomization study (PMID:30703100) showing higher BMI causally increases psoriasis RISK. The note now states that, rather than leaving a severity claim the citation does not make. Validated with `just validate`, `just count-verified-snippets` and the batched `just validate-disorders` sweep.

  summary: Relate psoriasis to the mixed susceptibility and disease series PS177900
  details: |
    Inspected all 15 members in the January 2026 OMIM snapshot and the September 2026 MONDO:0005083 crosswalk. Most members explicitly encode susceptibility, while psoriasis 2 and pustular psoriasis 14 are genetically defined forms. Selected relatedMatch for the clinical Disease versus the mixed locus collection, recording the deliberate qualification of MONDO exactMatch. Checked the existing GWAS evidence PMID:19169254 and primary CARD14 study PMID:22521418 when interpreting the mixture; did not recast numbered loci as patient subtypes.

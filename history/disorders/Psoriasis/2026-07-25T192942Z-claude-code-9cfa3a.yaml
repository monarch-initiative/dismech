  summary: 'Review: Psoriasis - replace non-genetic evidence on GWAS loci'
  details: |
    IL12B and IL23R were curated as risk factors but cited an IL-23 biology review whose snippets contained no genetic content; the explanations reasoned from mechanism to genetics. Fetched PMID:19169254 (Nair 2009 genome-wide scan) and replaced both with the sentence reporting IL12B rs2082412 p=5e-10 and IL23R rs2201841 p=3e-7. Removed three NO_EVIDENCE evidence items whose snippets were vacuous (Many skin diseases begin with inflammatory changes on a molecular level) on Keratinocyte Hyperproliferation and the IL-23/IL-17 Axis; Keratinocyte Hyperproliferation is now uncited and needs sourcing. Downgraded the Depression and Erythroderma evidence to PARTIAL with corrected explanations: the depression meta-analysis characterizes risk factors within the psoriasis population rather than excess prevalence versus controls, and the erythroderma sentence describes the morphologic spectrum of drug-related psoriasis. Validated: schema, terms, references all pass.

  details: >-
    Replaced unfetchable DOI:10.1038/ng.2599 citations with PMID:23542697, tagged GeneReviews DEPDC5-Related Epilepsy (PMID:27683934) and cited its DIAGNOSIS/TESTING, MANAGEMENT, and GENETIC COUNSELING sections across inheritance, molecular testing, antiseizure pharmacotherapy, epilepsy surgery, and surveillance notes, repaired DEPDC5/NPRL2/NPRL3 gene_activity_grounding defects with GO:0005096 GTPase activator activity, added Harrison's classifications and Orphanet ORPHA:98820 prevalence, refined EEG Abnormality to HP:0011185 (EEG with focal epileptiform discharges, VERY_FREQUENT), added Nocturnal Seizures, Hemimegalencephaly (wired downstream of GATOR1 Complex Loss and mTORC1 Disinhibition), Infantile Spasms, and Intellectual Disability phenotypes with evidence-backed causal inlinks, split EEG and Brain MRI into separate NCIT-bound diagnostic procedures, and added therapeutic_modality, top-level evidence, and Genetic Counseling to treatments.

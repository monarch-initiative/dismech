  summary: Add FFEVF1-4 subtypes and the SCN3A (FFEVF4) gene and mechanism
  details: |
    Recovered the FFEVF work deferred by PR #12919 and listed as stranded on #12931. Added has_subtypes rows FFEVF1-FFEVF4 bound to MONDO:0024556, MONDO:0014924, MONDO:0014925 and MONDO:0054776 (labels read from OLS4 MONDO), each with genes and evidence, and reciprocal genetic[].subtype keys on DEPDC5, NPRL2 and NPRL3. Added SCN3A (hgnc:10590, read from rest.genenames.org) as a genetic record for FFEVF4, citing the two pediatric focal-epilepsy series (PMID:18242854, PMID:24157691), and a new pathophysiology node for the Nav1.3 ramp/persistent current gain (IN_VITRO evidence from PMID:24157691 and PMID:20420834) with an INDIRECT edge to the focal seizure phenotype. relationship_type and gene_disease_validity left unset for SCN3A: ClinGen classifies SCN3A only for developmental and epileptic encephalopathy, and the source series did not test segregation. The GATOR1 node was not split per gene. Validated with just validate-disorders, validate-terms, count-verified-snippets (50/50), check-entity-refs, check-causal-targets, check-duplicate-keys.

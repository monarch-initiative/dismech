  summary: 'Create: Acute Macular Neuroretinopathy'
  details: |
    Curated new dismech entry for Acute Macular Neuroretinopathy (MONDO:0044627), the next acquired/mechanistic retinopathy from issue #4008 worklist, following Proliferative Vitreoretinopathy (PR #6614). Modeled the pathophysiology cascade: retinal deep capillary plexus (DCP) ischemia -> outer retinal photoreceptor layer (OPL/ONL) infarction -> persistent outer nuclear layer thinning and visual field defect. No existing mechanism module fits an acute retinal-capillary-ischemia pattern (photoreceptor_degeneration models chronic inherited RP, not acute vascular infarction), so pathophysiology nodes are standalone with no conforms_to. Modeled the DCP-ischemia-vs-choriocapillaris-deficit mechanistic controversy explicitly via mechanistic_hypotheses (CANONICAL DCP ischemia model per multiple OCTA studies; EMERGING choriocapillaris perfusion-deficit model per a single small COVID-associated case series that explicitly contradicts the predominant literature view). Cited 7 PMIDs (fetched via just fetch-reference, snippets verified against cached abstracts/full text): PMID:1180301 (Bos and Deutman 1975 original description), PMID:26973287 (Bhavsar comprehensive review, 101 cases 1975-2014), PMID:22846801 (Fawzi long-term multimodal imaging, OPL/ONL hyperreflectivity and persistent ONL thinning), PMID:29561336 and PMID:30025133 (OCTA studies localizing the flow deficit to the deep capillary plexus, distinguishing AMN from PAMM), PMID:38200478 (COVID-19-associated AMN case series, 81.8% persistent scotomas), PMID:38512510 (choriocapillaris perfusion-deficit alternative hypothesis). Verified MONDO/CL/HP/GO/UBERON/MAXO terms via OAK before use; added MONDO:0044627 to the enum caches via scripts/refresh_disease_enum_cache.py. Full just validate (schema + term + reference validation) passes on first attempt.

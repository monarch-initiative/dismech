  summary: Mine the two full-text sources the first pass only skimmed
  details: |
    Review round on PR #18337. Every blocking item and every suggestion taken, in one push.

    The reviewer found a real and consequential error on my side, and it is worth recording precisely because no gate could have caught it. Three explanation fields and the PR body asserted that no cached source names myositis, inflammatory arthritis or the lung-disease frequency. That was false. Two of the six cached references are full text (content_type full_text_xml) and both describe all three directly. The cause was my reading method: I read each cached file with a head of the first few lines, saw an abstract, and then wrote a negative-existence claim about the whole file. That is the failure mode CLAUDE.md describes under 'Naming the query does not make the note true; re-running it does', reached from a different direction, and the three explanations actively told a reader the claim was unsourced when the source was sitting in the PR.

    Blocking item 1, three phenotypes citing snippets that do not support them. Myositis now quotes 'She was diagnosed with steroid-responsive juvenile polymyositis' plus the sentence recording it as the first reported case; inflammatory arthritis quotes 'inflammatory arthritis requiring repeated intra-articular steroid injections' and the independent report's arthrocentesis sentence; chronic interstitial lung disease quotes the 90% figure and the tracheostomy sentence. The generic multisystem-autoimmunity snippets are gone from all three.

    The reviewer asked whether a polymyositis-specific HP term fits better than HP:0100614. There is none. An OLS search of HPO for 'polymyositis' returns only antibody and skin-sign terms (anti-PM-Scl antibody positivity, shawl sign, V-sign). HP:0100614 Myositis stays, with the specific diagnosis in preferred_term and a notes field recording the search.

    Blocking item 2, frequencies. The bands now come from the cohort table of PMID:36338154, whose percentages are the ten-patient Amish cohort, with the table row quoted as the snippet. Chronic lung disease OCCASIONAL to VERY_FREQUENT (90%), hypotonia OCCASIONAL to FREQUENT (60%), thyroiditis OCCASIONAL to FREQUENT (40%), enteropathy FREQUENT to OCCASIONAL (20%). Autoimmune hepatitis (30%) and type 1 diabetes (10%) were already right.

    Blocking item 3, missing phenotypes. Added: hepatosplenomegaly (HP:0001433, 90%), relative macrocephaly (HP:0004482, 90%, where the HPO label matches the table's own wording), psoriasis (HP:0003765, since HPO has no plain Psoriasis term), parotitis (HP:0011850, which the notes had already established as the correct term while no phenotype carried it), and IgA deficiency with hypogammaglobulinemia (HP:0002720).

    Psoriasis, polymyositis, parotitis and IgA deficiency are recorded VERY_RARE rather than from the table, because the table shows 0% for psoriasis and polymyositis in the Amish cohort and they appear in the individually reported non-Amish patients. The notes say so, so the mix of cohort-derived and case-derived bands is legible.

    Blocking item 4, the ClinGen tier. external_id is now CGGV:assertion_00d5cbfd-6118-48c7-b0d1-393f3e001118-2025-10-20T050000.000Z, the record is cached, and the validity row is quoted. list-gene-validity reports unsourced 0 for this entry. As with the KNG1 entry, the fetch warned that the committed ClinGen CSV no longer matches its manifest pin, so the cache file carries the file's own date.

    Blocking item 5, treatments. Added sirolimus, immunoglobulin replacement, and a combined entry for the biologics and cytotoxics that did not work. The last is graded REFUTE on the sentence saying they 'produced limited or organ-specific responses and failed to permit sustained corticosteroid tapering', because that accumulated failure is what the case for transplantation rests on and a treatment that failed is informative for this disease.

    One thing the reviewer did not raise, found while doing this. The two reports disagree about sirolimus in the same patient. PMID:36338154 (2022) reports 'dramatic improvement in diarrhea, liver enzymes' and reduced inflammation on repeat biopsy; PMID:42148098 (2025) says it 'was added to her immunosuppressive medication without much clinical impact'. Both are recorded on the treatment, the second graded REFUTE, and the description says the 2025 assessment is the later one and the one that led to transplantation. Picking one would have hidden a real disagreement in a two-paper literature.

    Suggestion taken: a notes paragraph records that PMID:36338154 and PMID:42148098 describe the same individual. I confirmed it independently of the reviewer's assertion rather than taking it on trust: both report the variant c.599dupC. The paragraph names which findings come from her so she is not counted twice.

    CI failure, separate from the review. check_gene_namespaces failed with UNRESOLVED on MGI:1202301 not being in cache/mgi/terms.csv. I had verified that identifier against the MGI marker page but never ran just check-gene-namespaces-online in this worktree, so the row was never cached. CLAUDE.md says to run it after adding a binding and commit the cache rows with it; I did the verification and skipped the caching. Both the online and offline checks now pass and the row is committed.

    Two further identifier errors of my own, caught by validation rather than by me. NCIT:C68875, written from memory for ustekinumab, is Enzyme-Linked Immunosorbent Assay Unit; the real code is NCIT:C84237, and I confirmed it is reachable from NCIT:C1909 before binding it. And an immunoglobulin snippet I had truncated mid-word ('for the past sev') was rejected by reference validation, correctly, and is now the whole sentence. Counting the earlier rounds, that is five identifiers across this batch of six entries that I wrote from memory and had to correct against a source.

    Re-verified on this head: just validate passes with 69/69 snippets, up from 46. check-gene-namespaces, check-gene-namespaces-online, check-gene-activity-grounding, check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes, check-logical-rules, check-duplicate-keys, check-snippet-length, check-snippet-grading, check-title-snippets, check-cache-order and check-name-collisions all pass, and list-gene-validity reports 0 conflicts and 0 unsourced.

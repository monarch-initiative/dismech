  summary: 'Create: Syndromic Multisystem Autoimmune Disease Due to ITCH Deficiency'
  details: |
    New entry for syndromic multisystem autoimmune disease due to ITCH deficiency (MONDO:0013245, OMIM 613385), the ITCH E3 ubiquitin ligase primary immune regulatory disorder.

    Deep research: one openscientist run, research/Syndromic_Multisystem_Autoimmune_Disease_Due_To_ITCH_Deficiency-deep-research-openscientist.md. Its reference_validation reports 16/16 references resolved, confabulation_rate 0.0. Its term_validation set needs_review with five mislabelled CURIEs. One is a genuinely wrong binding it suggested for this entry: HP:0030149, offered as 'parotitis', is Cardiogenic shock. It was not used; HP:0011850 Parotitis is the correct term. The rest are the report putting a frequency phrase where the label belongs. Every term in the entry was looked up in OLS.

    Name: the entry follows the MONDO label, which names both the syndromic scope and the gene. The OMIM title (autoimmune disease, multisystem, with facial dysmorphism) and the short form used in the immunodeficiency literature (ITCH deficiency) are synonyms.

    GeneReviews: none. The only hit for ITCH[TIAB] AND genereviews[book] NOT retired[TI] is the Dystrophic Epidermolysis Bullosa chapter, which matches solely because the ordinary English word 'itch' appears in its abstract. Tagging it would assert a relationship that does not exist, so it is not tagged, and its identifier is deliberately left out of the notes because check-genereviews reads a GeneReviews PMID anywhere in a file as a citation needing a tag. The note names the chapter by title and quotes the query instead, so the negative stays checkable. That gate behaviour is dismech#12329, where I added this case as a data point; it is the one instance in this batch where the workaround cost real provenance, since the identifier is the part that made the claim verifiable.

    Mechanism: the published chain has four branches from the loss of ligase activity (JunB-driven Th2 skewing, failed anergy, impaired Treg generation, NF-kappaB disinhibition). Only the tolerance branch is curated as its own node, because that is the one with a direct demonstration, the Itch-null mouse in which high-dose tolerizing antigen fails to block airway inflammation. The other three are named in that node's description as contributing in the published mechanism, with the reason given that this entry's sources demonstrate them in mouse and in vitro rather than in patients. Two edges carry causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES with directness INDIRECT: the route from T cell anergy to impaired EBV control, which the review itself presents as speculation, and the mitochondrial bioenergetic finding.

    Myositis and inflammatory arthritis are recorded as phenotypes but their evidence is cited at the level the available sources support, namely the multisystem autoimmune character of the disease, because no source cached for this entry enumerates them. Each explanation says so rather than implying the quoted sentence names the manifestation.

    A KNOWLEDGE_GAP discussion records that the mitochondrial bioenergetic defect comes from one patient who was worked up for suspected mitochondrial disease first, a route that selects for finding it, and that nobody has measured it in the other reported patients. The point of recording it is that the syndromic features, which are what distinguish this disorder from the other primary immune regulatory disorders, currently have no mechanism attached to them at all.

    The mouse Itch identifier MGI:1202301 was verified against the MGI marker page, after writing it from memory first.

    Validation: just validate passes (46/46 snippets) and the per-file and whole-tree gates pass. GO:0004842 ubiquitin-protein transferase activity was bound on the lesion node for check-gene-activity-grounding, taken from ITCH's own GO annotations.

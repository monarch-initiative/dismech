  details: |
    Grouping review of the Lysosomal Storage Disorders tree found this entry declared no conforms_to at all, leaving the only GNPTAB-related mucolipidosis outside the Mucolipidoses grouping. Added the two conformance declarations that its allelic counterpart Mucolipidosis Type II already carries: the GNPTAB phosphotransferase deficiency node to lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency, and the intracellular glycosphingolipid and glycosaminoglycan storage node to lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation. The entry already carried the GO:0006622 protein-targeting-to-lysosome annotation the Mucolipidoses criteria require. It is now a listed member and audits SATISFIED. Validation: just validate-disorders passed over the four changed disorder files with 224 of 231 snippets verified (7 skipped by prefix).

  summary: Move GeneReviews evidence from the retired ML III chapter to GNPTAB-Related
    Disorders
  details: |
    GeneReviews retired the Mucolipidosis III Alpha/Beta chapter (PMID:20301730, last updated 2012) in favour of GNPTAB-Related Disorders (PMID:20301728, updated 2019, same authors), which covers ML II, ML III alpha/beta and the intermediate phenotypes. Ten evidence claims (11 items) were moved to the current chapter with new exact quotes from its abstract, covering inheritance, onset, osteoporosis, cardiorespiratory complications, facial coarsening and cognition, molecular diagnosis, surveillance, physical therapy and genetic counselling. Four explanations were narrowed to match the new quotes. Eight items stay on the retired chapter because the current abstract does not state them: phosphotransferase activity of 1%-10% of normal, plasma hydrolases up to tenfold above normal, urinary oligosaccharides, and myringotomy tubes. The notes say so. The current chapter is tagged GeneReviews in references, and check-genereviews now reports TAGGED on it. just validate passes, and count-verified-snippets verifies 139/139 snippets.

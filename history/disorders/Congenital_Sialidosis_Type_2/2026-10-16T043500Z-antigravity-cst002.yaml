  summary: Review and expand Congenital Sialidosis Type 2 with full module conformance, unbundled LAMP1/exocytosis
    mechanisms, and 26 connected phenotypes
  details: 'Conducted a comprehensive review and substantive expansion of Congenital Sialidosis Type 2
    (MONDO:0019682):

    - Expanded top-level description and synonyms (adding Congenital sialidosis type II and Mucolipidosis
    I, congenital form).

    - Added Harrison''s chapters (ENDOCRINOLOGY_METABOLISM, NEUROLOGIC), lysosomal_storage_category (glycoproteinosis),
    and icimd_category (glycoprotein_degradation) alongside existing ISDS skeletal nosology classification.

    - Added global prevalence using structured fields (measure_type: ANNUAL_INCIDENCE, prevalence_class:
    BELOW_1_IN_1000000, rate_per_100000: 0.04) and antenatal/perinatal progression phases backed by PMID:31956508
    and PMID:26949572.

    - Expanded pathophysiology from 2 minimal nodes to 12 unbundled mechanistic nodes conforming to all
    5 nodes of the lysosomal_substrate_accumulation module, detailing NEU1/PPCA/GLB1 multienzyme complex
    assembly, Class I/II catalytically inactive NEU1 variant biology, primary sialyloligosaccharide/glycopeptide
    storage, LAMP1 oversialylation driving excessive calcium-regulated lysosomal exocytosis, neonatal
    renal tubular vacuolization (CL:1000494) and perinatal systemic fluid dysregulation, visceral reticuloendothelial
    storage and bone marrow niche disruption with splenic extramedullary hematopoiesis, connective tissue/chondrocyte
    storage remodeling, exocytosis-driven skeletal muscle degeneration, inner ear endolymphatic exocytosis,
    and CNS microgliosis/astrogliosis with retinal ganglion cell storage and progressive neurodegeneration.

    - Expanded phenotypes from 3 to 26 entries (25 HPO-bound under HP:0000118 plus Stillbirth documented
    as unbound due to HP:0003826 sitting under Mortality/Aging) with 100% causal connectivity from pathophysiology
    nodes, explicit scoping of infantile/juvenile cohort data (PMID:31956508, PMID:26949572) to congenital
    cases surviving past the neonatal period, and REVIEW_SYNTHESIS quote roles on review citations.

    - Repaired a non-verbatim abstract paraphrase in definitions[0].evidence[0].snippet for PMID:29693572
    and migrated inline curation_history out of the disorder YAML.

    - Expanded biochemical markers (urinary sialyloligosaccharides, fibroblast/leukocyte NEU1 activity,
    secondary visceral glycolipids GM3/GD3/GM4/LM1), genetic variant class correlations (including c.679G>A;
    p.Gly227Arg), diagnostic workup (biochemical, molecular NEU1 testing, skeletal radiography, ophthalmoscopy),
    differential diagnoses (galactosialidosis, sialidosis type 1, juvenile sialidosis type 2), and treatments
    (supportive/palliative care and preclinical AAV-mediated NEU1/PPCA co-expression gene therapy).

    '

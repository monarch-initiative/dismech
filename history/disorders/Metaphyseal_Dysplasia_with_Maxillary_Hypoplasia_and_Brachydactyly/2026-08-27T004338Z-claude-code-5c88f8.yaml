  summary: 'Create: Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly'
  details: |
    Curated to complete ISDS Nosology group 11, row NOS 11-0120 (RUNX2, dominant). The pathograph is built around the mechanistic inversion that defines the disorder: an intragenic RUNX2 tandem duplication raises cellular RUNX2 protein and behaves as a gain of function, against the loss-of-function RUNX2 alleles that cause cleidocranial dysplasia, and the clavicular phenotype inverts with it. Records an open knowledge gap on whether the gain of function is a dosage effect or an altered protein, using the reported whole-gene RUNX2 duplication family as the comparator. 37 evidence snippets verified against the local reference cache; schema, term, duplicate-key and entity-reference checks pass.

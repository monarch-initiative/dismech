  summary: 'Create: HLASA (LARS2)'
  details: |
    De novo curation of HLASA (LARS2, MONDO:0014869) from the 2015 index report and the 2020 spectrum paper, with a LARS2 Perrault DSD case report and a ring-sideroblast review for the two edges the primary literature does not cover. Deep research: one openscientist run, committed at research/Hydrops-Lactic_Acidosis-Sideroblastic_Anemia-Multisystemic_Failure_Syndrome-deep-research-openscientist.md (11 references, 11/11 resolved, 5/11 judged on topic, needs_review true; 13 of 25 label checks reported as mismatches, all of which are the validator reading the report's markdown table Type column rather than real mis-bindings). The report gave LARS2 as HGNC:21353, which is KLHL31; the correct identifier hgnc:17095 was substituted and the error recorded in genetic.notes, since neither the research lane (--term-skip-prefix HGNC) nor just validate-terms (CURIE-versus-own-label only) catches it. Pathograph is a seven-node chain with two branches from the complex I deficiency, one to bioenergetic failure and one to erythroblast iron accumulation; the erythroid branch is graded HYPOTHETICAL because its mechanism is imported from the congenital sideroblastic anaemia group and nothing has been measured in a LARS2 erythroblast. Two evidence items are REFUTE on purpose: the non-diagnostic respiratory-chain enzymology against the complex I node, and the failure of bicarbonate to lower the lactate against supportive care. Three discussions record the sideroblast mechanism gap, the unexplained survival fork, and a preclinical metabolic-rescue lead deliberately not curated as a treatment. Validation on the final tree: just validate, validate-terms, validate-disorders, count-verified-snippets 39/39, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-coarse-phenotypes, check-reference-titles, check-case-collisions, check-genereviews (NO_CHAPTER), list-disconnected-phenotypes 12/14.

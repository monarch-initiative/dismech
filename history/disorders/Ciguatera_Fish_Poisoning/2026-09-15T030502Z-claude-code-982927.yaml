  summary: 'Create: Ciguatera Fish Poisoning'
  details: |
    New entry for ciguatera fish poisoning (MONDO:0043230), an environmental marine-biotoxin exposure disorder.

    Deep research: one run, provider claude_code, with no fallback (research/Ciguatera_Fish_Poisoning-deep-research-claude_code.md). Its own reference validation resolved 38/38 identifiers with a 0.0 confabulation rate; its term validation resolved 41/41 CURIEs with one mislabelling (HP:0001251 reported as 'Peripheral neuropathy/paresis, ataxia' where HPO calls it Ataxia) and two loose paraphrases (CL:0000540, UBERON:0002240). None of those three terms is bound in this entry. No CURIE was copied from the report: every binding was re-derived by a fresh runoak lookup at the moment it was written, per the CLAUDE.md term contract, and the report explicitly flags its own suggestions as unverified.

    Duplicate preflight: git grep over origin/main for MONDO:0043230 and 'ciguatera' across kb/ and stubs/ returned nothing; GitHub issue and PR searches across all states for 'ciguatera' returned zero results.

    GeneReviews baseline: not applicable and deliberately skipped. This is an acquired toxicosis with no Mendelian basis, so there is no GeneReviews chapter and no OMIM phenotype entry. The entry therefore carries no genetic: section at all; the open question of host voltage-gated sodium channel variation is recorded as a KNOWLEDGE_GAP discussion rather than inferred from channel pharmacology.

    References: 22 PMIDs fetched into references_cache/ via just fetch-reference. Most of the report's sources were cited by PMC id; those were converted to PMIDs through the NCBI ID converter rather than by guessing. Every reference_title was inserted programmatically by copying the title: frontmatter line out of the cached file, never written from having read the abstract. No DOI-keyed or preprint-keyed evidence items were used, so every snippet in this entry is covered by the gating validator.

    Content: a twelve-node causal chain running from Gambierdiscus toxin production on reef substrate, through trophic biotransformation and biomagnification, ingestion, voltage-gated sodium channel site 5 activation and concurrent potassium current inhibition, to sustained sodium influx and then four organ-level branches (peripheral sensory afferents with CGRP release and Nav1.8/TRPA1 cold sensitisation, nodal and adaxonal Schwann cell swelling, enteric and autonomic neurons, cardiac conduction). Seventeen phenotypes, three progression phases, four prevalence records, two environmental exposures, four treatments, two animal models and two discussions.

    Judgement calls worth flagging for review:
    - Cold allodynia is bound to HP:0012533 Allodynia with the cold qualifier carried in preferred_term. HPO has no cold-specific allodynia term; HP:0012534 Dysesthesia and HP:0010829 Impaired temperature sensation were both considered and neither names cold-evoked pain.
    - The food exposure is bound to ECTO:0000537 exposure to toxin, following the Acute_Ackee_Fruit_Intoxication precedent. ECTO was searched through sqlite:obo:ecto for a ciguatoxin, ciguatera or marine-biotoxin class and none exists; the descendants of ECTO:0000537 are mycotoxin, phytoalexin, phytotoxin, uremic toxin and virulence factor, and the fish-ingestion classes that exist name unrelated species. The reason is recorded in the entry's own notes.
    - The sea-surface-warming exposure is left with a free-text exposure_term and no term:, because ECTO's temperature classes describe an organism exposed to ambient heat and the warming here acts on the dinoflagellate habitat, not on the patient.
    - Mannitol carries a deliberate SUPPORT/REFUTE pair from the same review (PMID:28535116): the case-series evidence for it and the negative randomised trial against it, as separate items rather than one hedged item.
    - modifier: GAIN_OF_FUNCTION rather than INCREASED on the sodium channel node, because the claim is qualitative (the channel opens outside its voltage-dependent constraint), and there is no host variant anywhere in the entry for functional_impact_category to describe.
    - The Cook Islands veterinary series is recorded under a single species: Dog entry although it covers 165 dogs and 81 cats, because the slot is single-valued; the entry notes say so.
    - No datasets: block. No ciguatera-relevant repository accession was identified, and none was invented.

    Validation run on this tree: just validate (schema, terms, references) passes with 98/98 snippets verified; just validate-disorders (the authoritative batched check CI runs) passes; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-enum-values all pass. Weighted compliance 90.1%. The remaining compliance gaps are uncited causal edges where no source makes the causal claim separately from the nodes it connects, and the absent datasets block.

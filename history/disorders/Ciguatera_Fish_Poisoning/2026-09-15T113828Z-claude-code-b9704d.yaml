  summary: 'Review round 2: DRG-specific cell binding, two more CL terms, full agent
    list, four sourced phenotypes'
  details: |
    Addresses the automated review on PR #11862, which returned REQUEST_CHANGES on one blocking item plus four suggestions. All were verified independently before acting.

    Blocking (ontology granularity). The Potassium Current Inhibition node's description, preferred_term and evidence snippet are all dorsal-root-ganglion specific ('in dorsal root ganglia neurones'), but the binding was the generic CL:0000101 sensory neuron. CL:1001451 sensory neuron of dorsal root ganglion exists, is already in cache/cl/terms.csv, and is now bound. The reviewer was right and the more specific term was available, which is what the term contract asks for.

    Suggestion 2 (the other three CL:0000101 uses) was taken further than the reviewer proposed, because the runoak pass it asked for found real terms for two of the three:
    - 'peripheral sensory afferent neuron' -> CL:3000004 peripheral sensory neuron, whose definition is exactly a PNS neuron carrying sensory information to the CNS.
    - 'peptidergic sensory neuron' -> CL:4033176 dorsal root ganglion CGRP neuron, whose definition reads 'This peptidergic nociceptor subpopulation is involved in neurogenic inflammation and pain signaling' - that is this node's claim verbatim.
    - 'Nav1.8/TRPA1-positive primary afferent neuron' stays on CL:0000101. CL has no Nav1.8 or TRPA1 class. Its channel-marker types are the segment-specific transcriptomic series (CL:4079002 cervical dorsal root ganglion Nav1.7 neuron and siblings), which name a different channel and add a spinal level this claim does not make. Recorded in node notes, as the reviewer suggested, so the failed search is written down rather than left to look un-researched.

    Suggestion 1 (agents). fluoxetine CHEBI:5118 and tocainide CHEBI:9611 added to the neuropathic-pain treatment, which now binds all six agents its own snippet names.

    Suggestion 3 (omitted phenotypes) was partly actionable. The reviewer correctly found no quotable sentence for blurred vision, and there is none. But one sentence in PMID:33066435 supports four phenotypes that were missing, and another supports a fifth:
    - Ataxia (HP:0001251), Hyporeflexia (HP:0001265) and Vertigo (HP:0002321) from 'These include vertigo, visual and/or oculomotor disturbances, reduction or abolition of deep tendon reflexes, paresis and impaired motor coordination, with some cases developing an inability to stand or walk (ataxia).'
    - Dysuria (HP:0100518) from 'dental pain, headaches, painful micturition and other urogenital pain'.
    All four carry no frequency, because no source gives one - matching the existing pattern in this file rather than guessing. Ataxia, Hyporeflexia and Dysuria are wired downstream of Repetitive Firing with INDIRECT_UNKNOWN_INTERMEDIATES; Vertigo is deliberately left unconnected, because no cited source traces it to the peripheral afferent mechanism this entry models and a vestibular route would be a different claim. Dental pain is named in the same quote but not added: HPO has no tooth-pain term, and a label search returns only HP:0005216 Impaired mastication, which denotes something else. That reasoning is recorded on the Dysuria entry.

    Suggestion 4 (PR body says 4 treatments, file has 5) is a PR-description edit, not a code change, and was corrected there.

    Validation: just validate-disorders passes with 135/135 snippets verified, up from 131. All ten offline gates pass. Weighted compliance 90.6% - down from 91.1% because four new phenotypes each add unscored optional slots, not because anything regressed.

  summary: 'Review round: fix source-contradicted claims, two mis-drawn causal edges,
    and add diagnosis/histopathology'
  details: |
    Pre-PR adversarial review of the entry created in the preceding CREATE record, run as a subagent against the dismech-pr-review skill. Every finding below was re-verified against the cached reference bodies before acting on it.

    Claims contradicted by the entry's own cited sources (the class automated validation cannot catch):
    - The entry said the bradycardia 'can be resistant to atropine', in two places, uncited. All four cached references that mention atropine say the opposite: PMID:33066435 'atropine effectively relieves the gastrointestinal and cardiovascular disturbances'; PMID:25333356 'respond to intravenous fluids, atropine and dopamine'; PMID:22574244 gave 45 mg and 30 mg over 48 hours and reverted both cases; PMID:19005579 'Symptomatic bradycardia may require IV atropine dosing as needed'. Rewritten to what the sources support - it works, but reversal can need unusually large or prolonged dosing - and cited. Atropine is now also modelled as its own treatment with CHEBI:16684, which it was not.
    - The cardiac node asserted 'sodium channel activation in cardiac conduction tissue' and bound CL:0000746 cardiac muscle cell, while PMID:22574244, cited twice in that same node, concludes the action is 'related primarily to indirect effects on intrinsic nerves, rather than a direct effect on myocardial cells'. The node's two snippets were clinical observations of the phenotype and supported none of the mechanism. Rewritten as the genuine two-sided dispute it is: the clinical vagal-afferent/central-vasomotor account, and the mouse cardiac-myocyte-swelling account from PMID:33066435, with the latter recorded as REFUTE against the former. The CL binding is kept but its node notes now say it covers one side of the dispute only, and that CL has no term for the vagal cardiac afferent the other side names.

    Two causal edges that were not causal claims:
    - Sodium channel site 5 activation -> potassium current inhibition was drawn DIRECT, but its own description said 'the same toxin additionally acts on', which is a sibling relation. Sodium-channel activation does not cause potassium-channel inhibition; they are independent pharmacological actions of one molecule. Re-parented onto the ingestion node as a parallel branch of the same exposure, converging with the sodium branch at afferent firing.
    - Repetitive firing -> cold sensitisation was drawn DIRECT, but PMID:26454262 derives cold sensitisation from membrane depolarization: 'a cumulative effect on sodium and potassium currents would result in activation of TRPA1 upon cooling but not TRPM8'. Re-parented onto the depolarization node and cited.
    - Hyperhidrosis was drawn off enteric hyperexcitability; PMID:33066435 places it on the cutaneous axon reflex ('intracutaneous injection of low nanomolar concentrations of P-CTX-1 in the forearm elicited a striking axon reflex sweating' via 'efferent cholinergic sympathetic skin nerves'). Re-parented onto the neurogenic-inflammation branch and cited.

    Blocking content gap: no diagnosis. The commit cached five diagnostics sources and cited none of them. Added a diagnosis: block (syndromic diagnosis from exposure history; the absence of any human biomarker; the FDA two-tier N2a-then-LC-MS/MS fish-testing protocol plus RBA and ELISA alternatives) and a differential_diagnoses: block against PSP, NSP, scombrotoxin, pufferfish and hallucinatory fish poisoning, all cited to PMID:28335428 and PMID:18623118. distinguishing_features was deliberately kept short: the features separating ciguatera from each named alternative individually are standard clinical teaching but are stated by no reference this entry cites, so they are omitted with a note rather than asserted.

    Frequency grading. Nine phenotype frequency values were unsupported by their attached evidence and three were contradicted by it. Hypotension was OCCASIONAL (5-29%) on a quote reading 'are common'; Bradycardia was OCCASIONAL against 22% and 40.3% figures the entry itself quotes. Both raised to FREQUENT with the Guadeloupe percentages attached. Paresthesia was lowered from VERY_FREQUENT to FREQUENT because its quote says 'in most cases', which is a majority claim, not the 80% the higher band requires. Frequency was removed entirely from Hyperesthesia, Arthralgia, Parageusia, Headache and Hyperhidrosis, where no cited source states one - omission is the honest state. Vomiting and Diarrhea keep VERY_FREQUENT and now carry the 93.9% figure that justifies it.

    Other corrections: 'abolishes' overstated PMID:28225079's 'significantly decreased' in the repetitive-firing description. GO:0019233 sensory perception of pain, an organism-level term, was dropped from a CELLULAR node. GO:0005249 voltage-gated potassium channel activity was replaced by both specific children it named, GO:0005251 and GO:0005250. The site-5 'is believed to be caused by' quote was regraded HUMAN_CLINICAL -> OTHER, since it describes a mechanistic belief and no human clinical evidence. The warming edge cited a risk-mapping conclusion that asserted nothing about warming; replaced with two quotes that do. Frog nerve preparations regraded MODEL_ORGANISM -> IN_VITRO, which also reconciles the grading with the mannitol description's own phrase 'isolated nerve preparations'. 'the same swelling' softened, since the frog result is perisynaptic Schwann cell at the NMJ and the node is about adaxonal myelinating Schwann cell. Four orphaned phenotypes (Arthralgia, Headache, Muscle weakness, Fatigue) were wired into the pathograph with INDIRECT_UNKNOWN_INTERMEDIATES, which is the honest link type here. A preferred_term naming an entity in a molecular_functions slot was corrected to name the activity.

    Additions from cached-but-uncited sources: the enteric plexus swelling result (PMID:33066435) that the enteric node's mechanism claim actually needs, where it previously leaned on a mouse pain-behaviour quote; the human intracutaneous axon-reflex flare (PMID:28867800), the entry's only human experimental result, previously unquoted; the intact-rat mannitol failure (PMID:28535116) as a second REFUTE on the mannitol mechanism link; the Cook Islands motor-dominance sentence (PMID:32255982), which was committed uncited while the limitations claim it supports rested on a weaker quote; and the absorption/elimination sentence behind an uncited pharmacokinetic claim. A histopathology: block was added for the two human tissue findings previously carried only as node prose, with a note explaining why no HPO finding_term is bound.

    Also: duloxetine added to the neuropathic-pain agent list, which its own snippet named; that treatment now links to the pathograph, with its description flagging the mechanism attribution as an inference. The ECTO notes were corrected - they had asserted no algal-toxin exposure class exists, when ECTO:8000033 does, outside the ECTO:0000537 subtree where a descendant walk misses it; it is now recorded as considered and rejected, because ciguatoxin reaches people through food-chain accumulation rather than a bloom event. The duplicate DOI cache for PMID:28535116 was removed.

    Two reference_title values were typed from memory during this round and caught by the title check; every title in the file was then re-derived programmatically from the cached frontmatter, twice, until clean. That is the failure CLAUDE.md warns about, and it happened.

    Not done, deliberately: no classifications: block and no primary-prevention content (the FDA processor guidance and Codex CXC 83-2024 the research surfaced), both of which are additions rather than corrections; no datasets: block, as no ciguatera-relevant accession was identified.

    Validation after fixes: just validate-disorders passes with 131/131 snippets verified; all ten offline gates pass; weighted compliance 91.1%, up from 90.1%.

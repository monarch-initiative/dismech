  details: |
    Addressed the round-1 review of PR 12745. Split the bundled 'MAPK Suppression and Adenylate Cyclase Excess' node into 'Lethal Toxin MAPKK Cleavage' (GO:0000165 MAPK cascade DECREASED, evidenced by PMID:42409807's exact MEK1/2/3 cleavage sentence) and 'Edema Toxin Activity', and moved endothelial injury into its own 'Lethal Toxin-Mediated Endothelial Apoptosis' node (CL:0000115) evidenced by PMID:37963097's endothelial-apoptosis sentence; dropped the unsupported GO:0004016 adenylate-cyclase binding because no committed cache states it. Split 'Systemic Toxemia and Vascular Injury' into 'Systemic Toxemia'. Added phenotypes Fever, Pleural Effusion (76%), Ascites (52%), Lymphadenopathy, and Shock, all wired into the pathograph (13/13 connected). Added a diagnosis section (culture + gamma-phage/penicillin differentiation + pXO1 lef / pXO2 capB multiplex PCR). Bound the six FDA-approved antibiotics as therapeutic_agent (ciprofloxacin NCIT:C375, doxycycline NCIT:C457, levofloxacin NCIT:C1586, minocycline NCIT:C61849, penicillin G NCIT:C61883, tetracycline NCIT:C865 -- the reviewer's suggested codes were all wrong and were re-derived). Added a Pleural Fluid Drainage treatment (NCIT:C15392) targeting the effusion and the lethal-factor reservoir. Regraded ~12 evidence items from blanket OTHER to HUMAN_CLINICAL + quote_role REVIEW_SYNTHESIS, and added quote_role BACKGROUND to the two framing-sentence citations (PMID:33371332, PMID:38638828).

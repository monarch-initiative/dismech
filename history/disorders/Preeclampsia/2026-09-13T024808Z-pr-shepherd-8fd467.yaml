  summary: 'Review round: split the thromboinflammation node into three and declare
    thrombogenesis conformance'
  details: |
    Addressed the two remaining blocking items from the re-review on PR #8465.

    1. Split the bundled node. "Immune-Driven Thromboinflammation and Coagulation Activation"
    narrated a seven-step cascade on a single node with five biological_processes spanning all
    of it. It is now three atomic nodes, following the Antiphospholipid_Syndrome pattern the
    reviewer cited:

      - Cytokine-Induced Tissue Factor Expression and Coagulation Cascade Activation
        (MOLECULAR) - cytokine-driven tissue factor on endothelium and monocytes, the extrinsic
        cascade, and suppressed fibrinolysis. Keeps blood coagulation, fibrin clot formation
        and fibrinolysis; keeps the endothelial cell and monocyte cell types.
      - Platelet Activation and NET-Amplified Thrombus Propagation (CELLULAR) - platelet
        activation plus the NET/extracellular-vesicle amplification loop. Keeps platelet
        activation and inflammatory response; keeps the platelet and neutrophil cell types.
      - Microvascular Thrombosis and Maternal Organ Ischemia (TISSUE) - microthrombi in kidney,
        liver, brain and placenta, reduced perfusion, organ injury. Carries the two downstream
        edges to HELLP and Thrombocytopenia.

    The three node-level evidence items partitioned along these lines already, as the reviewer
    noted, so each node keeps the quote that anchors it and no evidence was added or dropped
    to make the split work. Two new internal edges chain them (cascade -> platelets ->
    microvascular thrombosis), each with its own quoted evidence from the same cached review.
    The incoming NLRP3 edge was retargeted to the first node so the chain still has its
    upstream connection.

    2. Declared conforms_to against kb/modules/thrombogenesis.yaml on all three nodes:
    Coagulation Cascade Activation and Thrombin-Driven Fibrin Formation, Platelet Adhesion,
    Activation, and Aggregation, and Thrombotic Vascular Occlusion and Ischemic Tissue Injury.
    All three anchors were checked against the module's node names. The module's
    TTP-microangiopathy scope caveat is addressed in the first node's description: the cited
    review describes an explicit tissue factor to thrombin to fibrin branch, which is what the
    module scopes itself to.

    Suggestions:

    - biological_scale added on all three new nodes. The values are unambiguous once split,
      which is the point the reviewer was making - the original node would have wanted both
      MOLECULAR and TISSUE, and that was the bundling signal.
    - The direct Thrombocytopenia edge is kept rather than dropped, but now declares
      causal_link_type: INDIRECT_KNOWN_INTERMEDIATES with intermediate_mechanisms naming the
      HELLP node, which is the transitive shortcut the reviewer identified. EvidenceItem has
      no directness slot in this branch's schema version, so the causal_link_type carries the
      signal instead.
    - The curation meta-prose was removed from that edge's description, which now describes
      only the mechanism. The reasoning about what the source does and does not state stays in
      the evidence explanation, where it belongs.
    - Low-dose aspirin prophylaxis now has a target_mechanisms INHIBITS link onto the platelet
      node, with the cyclooxygenase-1 / thromboxane A2 sentence from the same cached review.
      It targets the platelet node specifically rather than the cascade node, since that is
      what the quoted mechanism acts on.

    Validation: just validate passes with 78/78 snippets verified; just validate-terms passes.
    All conforms_to anchors resolve against the thrombogenesis module and no pathograph target
    in the entry dangles.

  details: |
    Assessed kb/hypotheses/Preeclampsia/early_onset_placenta_dominant/openscientist.md (verdict PARTIALLY_SUPPORTED; sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml) and integrated its RETAINED and QUALIFIED claims. Added: a HIF-1alpha Stabilization in the Ischemic Placenta pathophysiology node (PMID:41814104) inserted between defective trophoblast invasion and antiangiogenic factor release, with the review-level caveat stated in its description; single-cell evidence for FLT1 up / PGF down in syncytiotrophoblast and extravillous trophoblast on the antiangiogenic node (PMID:40253080); subtype-boundary evidence on the early_onset_placenta_dominant hypothesis (PMID:41582793); the actual fetal FLT1 GWAS on the FLT1 genetic entry (PMID:28628106); the KIR2DS1 to GM-CSF to trophoblast migration mechanism and the fetal-C2-dose specificity on the immune maladaptation node (PMID:24091323, PMID:20972337); biochemical records for the sFlt-1/PlGF ratio (PMID:31188674, PMID:42041953) and for senescence-associated secretory phenotype factors (PMID:39440423); and two KNOWLEDGE_GAP discussions, one on whether apheresis benefit is attributable to sFlt-1 removal and one on complement independence in HELLP. Deliberately not changed: hypothesis status stays CANONICAL, as the report itself recommended. Deliberately not added: the report's P = 5.4e-16 for rs4769613 (the paper reports 5.4e-11 and different sample counts); its claim that the FLT1 GWAS was not subtype-stratified (the paper reports the association strongest in late gestation, which is curated instead as a REFUTE item on the hypothesis); its use of the H.E.L.P. apheresis study as support for sFlt-1 removal (that study prolonged pregnancy without lowering sFlt-1, curated as REFUTE in the new gap); its uncited FDA-approval claim; and its proposed CURIEs CL:0002252 and GO:0008045, which name epithelial cell of esophagus and motor neuron axon guidance rather than decidual NK cell and trophoblast cell migration. No SASP pathophysiology node was added because the source establishes senescence and predictive markers, not a causal edge to the maternal syndrome.

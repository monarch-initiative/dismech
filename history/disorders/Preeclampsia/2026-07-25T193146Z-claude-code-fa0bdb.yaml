  summary: 'Review: Preeclampsia - model-organism-only phenotype evidence and gene-association
    typing'
  details: |
    Manual claim-evidence review. Fixed: (1) three human phenotypes (Thrombocytopenia, Elevated hepatic transaminases, Hemolytic anemia) were supported solely by MODEL_ORGANISM evidence from the rat sFlt1/sEng study PMID:16751767, contrary to the repo rule that model-organism evidence should not be the only support for a human phenotype - added human clinical anchors (PMID:34033373, PMID:31877439) and downgraded the rat items to PARTIAL with explicit model-organism framing; (2) the genetic block typed PGF, ENG and VEGFA as 'Risk Factor' while their attached evidence concerns circulating protein levels, not genetic variation - retyped as mechanistic effectors with relationship_type: BIOMARKER, and left FLT1 as RISK_FACTOR since PMID:39062815 does evidence FLT1 polymorphisms; (3) added the missing structured prevalence record for the 2-8%-of-pregnancies figure asserted in the description, sourced to ACOG Practice Bulletin 222 (PMID:32443079).

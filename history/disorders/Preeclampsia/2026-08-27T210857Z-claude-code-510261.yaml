  summary: Add plastic-derived chemical and microplastic exposures to Preeclampsia
  details: |
    Added the entry's first environmental block with three exposures. Gestational phthalate exposure (ECTO:9000522) carries two edges: a weakly supported one to Defective Trophoblast Invasion and Spiral Artery Remodeling, drawn from syndrome-level hazard ratios with no measured intermediate (PMID:27177253, PMID:36113809), and a better-supported one to Placental Anti-Angiogenic Factor Release, where the measured outcome is the node itself - falling PlGF and a rising sFlt-1/PlGF ratio (PMID:25913709). Gestational bisphenol A exposure (ECTO:9000057) carries the same angiogenic edge on its own evidence. Micro- and nanoplastic particle exposure (ECTO:7000061) is rodent-only: a rat polystyrene model reproducing the maternal syndrome through HIF-1alpha/TFRC-mediated trophoblast ferroptosis with a ferroptosis-inhibition rescue arm (PMID:40414414). Added a HUMAN_MODEL_MISMATCH discussion recording that the chemical exposures have human risk estimates without a mechanism while the particle exposure has a mechanism without a human endpoint, citing a systematic review that found the human outcome literature empty (PMID:38287142). Validated with validate, validate-terms, check-entity-refs and the batched validate-disorders.

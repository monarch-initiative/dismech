  summary: Map Preeclampsia/eclampsia to OMIMPS:189800
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS189800 contains five numbered preeclampsia/eclampsia records in the January 2026 OMIM snapshot. These genetic and familial records are related to the multifactorial obstetric disease curated here, but are not interchangeable with its early-onset, late-onset, and HELLP clinical presentations or with an individual genetic risk allele. RelatedMatch preserves that distinction and the series label explicitly spans eclampsia as well as preeclampsia. Placental and maternal mechanisms and maternal and fetal genetic contributions do not constitute one Mendelian inheritance rule. The exact crosswalk associated with MONDO:0005081 is therefore not copied as proof of clinical and genetic-series equivalence.
    Quoted an existing folded scalar containing a line ending in colon-no so yamlfix cannot reinterpret it as a boolean. Verified parsed YAML values are identical apart from the new mapping.

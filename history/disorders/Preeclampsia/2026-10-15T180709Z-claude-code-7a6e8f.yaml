  details: |
    Review of the Preeclampsia entry found Hypertension, Intrauterine growth retardation and Pulmonary edema with no incoming causal edge, and Elevated hepatic transaminases linked only as a readout. Added Maternal Endothelial Dysfunction -> Hypertension (PMID:42381215 review; PMID:12618519 and PMID:16751767 rat sFlt1/sEng models, directness INDIRECT), Maternal Endothelial Dysfunction -> Pulmonary edema (PMID:42381215), Defective Trophoblast Invasion and Spiral Artery Remodeling -> Intrauterine growth retardation (PMID:29422210), and Hepatic Sinusoidal Obstruction and HELLP -> Elevated hepatic transaminases (PMID:31877439). Added evidence to previously bare organ-branch edges: endotheliosis -> Proteinuria (PMID:12618519), HELLP -> Thrombocytopenia and Hemolytic anemia (PMID:19245695), cerebrovascular -> Seizures, Headache, Visual disturbances (PMID:26126779). Pulmonary edema phenotype gained its first evidence item (PMID:42381215). Added FLT1 and ENG genes to Placental Anti-Angiogenic Factor Release and HIF1A to the HIF-1alpha node; added vasodilation DECREASED and vasoconstriction INCREASED to Maternal Endothelial Dysfunction. Corrected the proteinuria protein/creatinine threshold from 0.3 mg/dL to 0.3 mg/mg (30 mg/mmol). Rewrote two phthalate evidence explanations that argued for the retired PARTIAL grade as directness INDIRECT. Phenotype causal connectivity went from 6/10 to 10/10. just validate-disorders, validate-terms, check-causal-targets, check-entity-refs, check-snippet-grading, check-snippet-length and check-retired-support-prose all pass; 132/132 snippets verified.

  summary: Add PSG2 TGF-beta mechanism
  details: |
    Addressed reviewer feedback on PR 9280 by restructuring mechanistic representation:

    1. Created new upstream pathophysiology node "PSG2-Mediated TGF-beta/Smad3 Activation"
       (biological_scale: MOLECULAR) with:
       - gene: PSG2 (hgnc:9519)
       - biological_processes: GO:0007179 (TGF-beta receptor signaling, INCREASED) and
         GO:0060395 (SMAD signal transduction, INCREASED)
       - Evidence from PMID:42573986 showing PSG2 upregulation in preeclamptic placentas

    2. Added downstream edge from PSG2 node to "Defective Trophoblast Invasion and Spiral
       Artery Remodeling" with mechanistic evidence demonstrating PSG2-TGF-beta/Smad3
       activation suppresses EMT and MMP2/MMP9

    3. Retained GO:0001837 (epithelial to mesenchymal transition, DECREASED) on invasion
       node as the correct downstream consequence of PSG2-TGF-beta signaling

    4. Clarified in node description that PSG2/TGF-beta arm is cell-autonomous in
       trophoblasts, distinct from endothelial sEng-mediated TGF-beta inhibition

    This implements structured representation allowing the PSG2-mediated mechanism to be
    machine-queryable for export and pathograph rendering, per reviewer specification.

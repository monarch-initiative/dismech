  details: |
    Genetics pass for the d2g wiring-008 tranche (issue #12197).

    This was the one entry in the tranche with no gene reaching the pathograph at
    all. ALX1, ALX3 and ALX4 each had a genetic[] record with
    relationship_type: CAUSATIVE, variant_origin: GERMLINE and a correct subtype:
    foreign key, but the upstream node 'ALX transcription factor disruption' named
    all three genes in its description while binding none of them, so the graph
    carried no gene node for this disease.

    Changes:
    - genes: ALX1, ALX3, ALX4 bound on 'ALX transcription factor disruption', each
      with a one-line description naming the subtype it accounts for.
    - genes: bound on the three has_subtypes rows, matching the genetic[] record
      that already pointed at each: ALX3 on Frontorhiny (MONDO:0007636), ALX4 on
      frontonasal dysplasia with alopecia and genital anomaly (MONDO:0013268),
      ALX1 on the severe microphthalmia / facial clefting form (MONDO:0013271).

    All three MONDO-checklist pairs were already correctly split across the three
    subtype rows before this pass; what was missing was the binding, not the
    knowledge. No new literature was needed and no evidence was added.

    Validation: just validate, validate-terms, count-verified-snippets (25/25),
    check-genereviews (NO_CHAPTER for both collections, verified offline against
    the committed Bookshelf index), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (0 findings), validate-disorders.

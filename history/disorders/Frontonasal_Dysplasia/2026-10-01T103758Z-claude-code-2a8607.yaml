  summary: 'Genetics pass: add the ZSWIM6 acromelic subtype and wire the pathograph'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). Curated the series row MONDO:0011359 acromelic frontonasal dysostosis as a fourth has_subtypes row with ZSWIM6 bound, its own autosomal dominant de novo inheritance block, and evidence from the founding exome study and the later mosaicism series. ZSWIM6 is deliberately given no genetic record and no mechanism node: its molecular function is not established, the patient-cell Hedgehog signal is hedged in the source, and the later series states that a molecular-developmental explanation for the malformation pattern is lacking, so a node would assert a step no source supports. Separately repaired the pathograph, where two of three nodes dead-ended and no phenotype had an incoming causal edge. The neural-crest node now reaches hypertelorism, wide nasal bridge, bifid nasal tip, facial cleft and microphthalmia; the BMP node is re-placed as a mediator upstream of the migration defect on the strength of the BMP2/BMP9-antagonist rescue experiment rather than as a parallel branch; and a new ALX4-Dependent Epidermal and Hair Follicle Development Failure node carries the skin and hair arm of ALX4 loss through to alopecia. The four remaining ALX4-subtype features are wired from the ALX node with their descriptions stating that no intervening mechanism is sourced. Phenotype causal inlink 0/10 to 10/10; dead-end nodes 2 to 0; genes wired unchanged at 3/3. Validation on the committed tree: just validate 0 issues, 44/44 snippets verified, validate-terms passed.

  summary: 'Create: Birk-Landau-Perez Syndrome'
  details: |
    New entry for Birk-Landau-Perez syndrome (BILAPES, MONDO:0044726, SLC30A9), curated from PMID:28334855 (Perez 2017, the founding Bedouin kindred and the zinc-transport experiments), PMID:34716203 (first non-consanguineous proband), PMID:37576556 (two further patients, cerebellar atrophy, and the mitochondrial-exporter literature) and PMID:37041080 (eight patients from four families). Two judgements shape the entry. First, the mechanism is recorded as unresolved rather than asserted: the founding study measured lower cytosolic zinc in mutant cells and excluded the earlier Wnt-signalling account, while later work on SLC30A9 as a mitochondrial zinc exporter describes zinc accumulation and mitochondrial stress. Those are two mechanistic_hypotheses groups, CANONICAL and EMERGING, with the causal edges scoped to them by hypothesis_groups, and a KNOWLEDGE_GAP discussion attached to both the nodes and the hypothesis groups. Second, the renal arm is recorded as variable rather than obligatory: four of six founding patients had nephropathy and none of the eight in the later series had severe renal impairment, so the nephropathy node carries a REFUTE evidence item citing that series alongside the SUPPORT item from the founding report. The entry is named Birk-Landau-Perez Syndrome rather than taking the MONDO label, which is a four-part feature description rather than a name in use; the MONDO label and BILAPES are kept in synonyms, per the entry-naming skill. Validation: just validate-disorders passed with 34 of 34 snippets and 34 titles verified on the first run; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-duplicate-keys, check-enum-values, check-logical-rules, check-delivery-system and check-genereviews all pass. The OpenScientist deep-research run for this disease was cancelled twice by the client timeout described in dismech#10387, so the entry rests on the primary literature; a third run is in flight and will be reconciled against the entry before the pull request is opened.

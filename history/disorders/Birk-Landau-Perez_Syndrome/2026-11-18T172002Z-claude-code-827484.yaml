  summary: 'Review round 2: correct the spasticity misattribution, add hyperechogenic
    kidneys and microcephaly'
  details: |
    Addresses the one blocking item of the second review round on dismech#18382, plus the suggestions that could be sourced.

    Spasticity, and the pattern behind it. The phenotype said spasticity was reported in the founding kindred. The founding report says the opposite: deep tendon reflexes were normal in all six patients, without abnormal pyramidal signs including clonus or Babinski, and spasticity is a pyramidal sign. The claim came from PMID:34716203's secondhand restatement of that kindred, which lists spasticity among its findings. The phenotype is rewritten rather than deleted, because spasticity is real in this syndrome, just occasional and in a later family: PMID:37041080 reports mild lower-limb spasticity with brisk reflexes in one patient, and states explicitly that neither of two other boys displayed any. That lower-limb sentence is now the primary SUPPORT item. The negative sentence from the same series and the founding report's pyramidal-signs sentence are both added as REFUTE items. The PMID:34716203 restatement is kept rather than dropped, regraded to directness INDIRECT, with an explanation saying it misreports its primary source on this point, so a reader who meets the same summary elsewhere is warned. No frequency is recorded.

    This is the second claim in this entry traced to that same secondhand summary; the hearing-loss claim corrected in round 1 was the first. The entry notes now record the pattern explicitly rather than only the individual correction, so the next curator treats PMID:34716203 as a secondhand source for the founding kindred.

    Hyperechogenic kidneys added, after a corrected search. A first search of the founding report's cache for hyperechogenic returned nothing, which would have been recorded as the phenotype being unsourceable. The source hyphenates it: renal sonography revealed in the four individuals with renal involvement, but not in the two with only neurological symptoms, kidneys that were hyper-echogenic yet normal sized with no cysts. The phenotype is bound to HP:0004719 with that sentence as evidence, and wired as a downstream target of the Tubulointerstitial Nephropathy node alongside Hypertension and Hyperkalemia.

    Microcephaly added, with a corrected figure. The first draft of the snippet read a Z score of minus four, taken from a truncated grep line. The reference validator rejected it with the message that the text occurs only inside longer words, because the source says minus four point zero eight. Both the snippet and the description now carry the real value. Bound to HP:0000252, recorded as a single-patient finding with no frequency.

    Nystagmus not added. The review suggested it for the PMID:34716203 proband. The word does not appear in any of the three cached primary papers for this disease, so there is no quotable sentence to attach. Asserting it from a summary is exactly how the spasticity error entered, so the phenotype is left out and the notes say why.

    Validation: just validate passes with 43 of 43 snippets and 43 titles verified.

  summary: 'Review round 1 and deep research: Birk-Landau-Perez Syndrome'
  details: |
    Addresses the first review round on PR 18382 and adds the deep-research artifact the review SOP requires. The substantive correction is the hearing-loss phenotype. Its description said hearing impairment was part of the syndrome as described from the founding kindred, and cited a later paper's secondhand summary for it. PMID:28334855 does not mention hearing anywhere; the only occurrence of deafness in that cached text is inside the name of EAST syndrome. The phenotype now leads with the measured finding from the family that did report it, the auditory brainstem response showing severe sensorineural hearing loss, keeps the summary sentence as a second item marked INDIRECT with quote_role REVIEW_SYNTHESIS, and the description states that the status of the founding kindred is not established here. ClinGen: the previous notes said the CGGV record had not been retrieved. It is in the committed export. SLC30A9 is rated Definitive for MONDO:0044726, which is this entry's own disease_term, so a gene_disease_validity assertion is now recorded with the record fetched, cached and quoted, and the to-do sentence is gone. That rating also settles the relationship_type question in the entry's favour: CAUSATIVE matches the schema's definition of Definitive or Strong rather than merely being defensible. CI gate: check-gene-activity-grounding failed because SLC30A9 was wired into the pathograph on a node binding no molecular function; GO:0005385 zinc ion transmembrane transporter activity is now bound there with LOSS_OF_FUNCTION, consistent with the same term downstream. Zygosity is dropped from the lesion node, because reported patients include a compound heterozygote as well as homozygotes and the node's own text said biallelic. Three phenotypes that were in the entry but not in the graph, axial hypotonia, limb hypertonia and cerebellar atrophy, are now wired to the neuronal dysfunction node, cerebellar atrophy with unknown intermediates since no source traces it. Spasticity and a tendency to hyperkalemia are added as phenotypes, the latter hanging off the nephropathy node. The mixed worm and human cell-line evidence item now says in its explanation that the quoted clause spans both source types. Deep research: the requested provider was openscientist, which failed on every attempt, six runs cancelled by the client timeout in dismech#10387 and two failing server side at report generation, filed as dismech#18386; this disease hit both. The --fallback flag does not engage on either failure mode, so the substitution to claude_code was made by hand and recorded here and on that issue. The committed report is research/Birk-Landau-Perez_Syndrome-deep-research-claude_code.md: 25 of 25 references verified at a confabulation rate of 0.0, and just preflight-dr against MONDO:0044726 returns PASS with SLC30A9 mentioned 115 times and the MONDO OMIM cross-reference 617595 present. Validation: validate-disorders passes with 38 of 38 snippets verified, and the entity-ref, causal-target, coarse-phenotype, enum-value, logical-rule and gene-grounding gates all pass. One title correction came from the validator: the ClinGen evidence item's reference_title must be the cache's own title, which uses the MONDO label rather than the eponym this entry is named for.

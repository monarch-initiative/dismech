  summary: 'Create: Mitochondrial_Complex_I_Deficiency_Nuclear_Type_18'
  details: |
    De novo curation of MC1DN18 (MONDO:0032623, NDUFAF3). Entry type decided as DISEASE: MONDO leaf under MONDO:0100223 with one causal gene, following the nineteen existing MC1DN per-gene entries. Seven-node pathograph from the biallelic NDUFAF3 variant through loss of the assembly factor from early intermediates, rapid AFG3L2-mediated turnover of newly synthesised ND1, a stalled assembly with Q- and P-module subunits depleted, isolated complex I deficiency, and two clinical nodes (neonatal/infantile encephalopathy with lactic acidosis; basal ganglia and brainstem injury). Sixteen phenotypes, fifteen wired to a mechanism node. Evidence from four primary clinical reports (PMID:19463981, 27986404, 29344937, 37572574), two mechanism papers (PMID:22653752 ND1 turnover, PMID:34386730 Drosophila), one dystonia cohort (PMID:40302693), and the ClinGen Mitochondrial Disease GCEP Definitive assertion (CGGV:assertion_fbdf3ba5-37d8-447d-888b-2762701bab49-2022-03-07T050000.000Z), which is also the only source for optic atrophy, developmental regression, hypotonia and myoclonic seizures. All four primary clinical reports are abstract-only in the reference cache, so no full-text-only clinical detail was curated; this limit is recorded in the entry notes. Deep research: falcon requested, returned HTTP 402 (out of credits), claude_code produced the report under the configured fallback; preflight-dr PASS (NDUFAF3 55 mentions, OMIM 618240 matches MONDO), 6/6 references resolved, confabulation rate 0. No complex-I module or grouping exists on main (PR #12492 open and held), so the entry conforms to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress like its nineteen siblings. No treatments block: nothing therapeutic is published for this gene. Validated with the linkml-reference-validator 0.3.0rc1 venv required by main.

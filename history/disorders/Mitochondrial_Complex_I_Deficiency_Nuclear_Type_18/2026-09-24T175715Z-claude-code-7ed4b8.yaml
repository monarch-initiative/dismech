  details: |
    Review round 1 on PR #12701 (ai4c-reviewer, CHANGES_REQUESTED).

    Blocking item 1. Removed `zygosity: HOMOZYGOUS` from the `Biallelic NDUFAF3 Variant` node's `genetic_context`. The slot is single-valued and the reported cases are mixed: the Leigh-syndrome patient (PMID:27986404) is homozygous, while the cavitating-leukoencephalopathy patient (PMID:29344937) and the 2023 patient (PMID:37572574) are compound heterozygous. Verified against the committed cache: references_cache/PMID_37572574.md reads 'compound-heterozygosity for a pathogenic splice-site and a likely pathogenic missense variant in NDUFAF3.' Neither enum value is true of the node, so the claim is carried by the word 'biallelic' in the node name and description instead.

    Blocking item 2. Removed two passages of session narration from `notes:` per the CLAUDE.md rule that notes are not a session log. The gene-level sentence saying the HGNC identifier, symbol, previous symbol, aliases and cytoband were read from the REST API rather than from memory is deleted outright. The top-level deep-research paragraph is moved here verbatim and is recorded below.

    Deep-research provenance, moved out of the entry's top-level `notes:`:
    falcon was requested and returned HTTP 402 (the account is out of credits), so claude_code produced the report under the configured fallback and the file is named for it. `just preflight-dr` returns PASS: NDUFAF3 is the top gene at 55 mentions against 6 for the next token, and the report's OMIM identifier (618240) matches the one MONDO carries for MONDO:0032623. All six of its extracted references resolved with a confabulation rate of zero, and 43 of 49 ontology terms resolved, with one unresolved identifier (HP:0002082, which the report offers only as a possible mapping for a leukomalacia finding) and two obsolete GO terms. None of those three terms is used in this entry. Nothing in the entry was taken from the report without being re-sourced from the reference cache first; the report is committed as a research input, not as a citation.

    Suggestions taken. (a) The second evidence item on the `NDUFAF3 patient fibroblast complementation` model cited PMID:27986404 with a sentence about assembly-route analysis, which is not about complementation; swapped for the sentence the reviewer offered, quoted in full as 'In a patient presenting with Leigh syndrome, which has hitherto not been described as a clinical feature of NDUFAF3 deficiency, we identified a novel homozygous variant and confirmed its pathogenicity in patient fibroblasts studies.' and verified against the committed cache. It is graded HUMAN_CLINICAL rather than IN_VITRO: the same sentence is already quoted twice in this file for the Leigh-syndrome phenotype at that grading, and check-snippet-grading requires one quoted sentence to carry one evidence_source per file. The explanation records which clause supports the complementation claim. (b) Added the second complexome finding from PMID:37572574 - free monomeric complex I still holding MCIA and other assembly factors - to the `Stalled Complex I Assembly with Depleted Q- and P-Module Subunits` node description, with its own evidence item quoting the cached sentence. (c) Added a line to the full-text limitation note naming ataxia, dysarthria, dysphonia, failure to thrive, emesis and abnormal muscle cristae as details that sit only in the 2023 paper's full text; they are named as unverified full-text detail, not curated as phenotypes.

    The rest of the notes are unchanged: the ClinGen lumping tension, the weakness of the optic-atrophy claim, the two kinds of source behind the frequency bands, and the reasons no treatments block is curated.

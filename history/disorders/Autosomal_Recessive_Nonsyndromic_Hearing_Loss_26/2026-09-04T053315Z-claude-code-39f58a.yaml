  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 26 (DFNB26, GAB1
    with METTL13 suppressor)'
  details: |
    De-novo curation of DFNB26 (MONDO:0011553, OMIM:605428), prelingual severe-to-profound nonsyndromic recessive deafness caused by homozygous GAB1 p.Gly116Glu, with the unlinked dominant METTL13 p.Arg544Gln suppressor at DFNM1 (OMIM:605429).

    Lump/split: kept as a Disease. MONDO records no descendants and no causal gene for the term; the gene assignment comes from the literature (Yousaf 2018), not from MONDO.

    Modelling decision worth flagging: the METTL13 relationship is curated as a MODIFIER, NOT as digenic inheritance, and HP:0010984 is deliberately not bound. Digenic means two loci are jointly required; here the GAB1 genotype alone is sufficient and the second locus subtracts the phenotype. The reasoning is written into the second inheritance block so it is not re-litigated. METTL13 appears in genetic: with relationship_type: MODIFIER and in the SPRY2 Upregulation node, where the suppression acts.

    Pathograph: GAB1 p.Gly116Glu hypomorphic PH-domain variant -> reduced phosphoinositide binding (42% drop in PtdIns(3,4,5)P3 binding) -> dysregulated MET/HGF signalling -> SPRY2 upregulation -> spiral ganglion neuron and organ of Corti supporting cell dysfunction -> profound prelingual SNHL. The SPRY2 node carries the discriminating result: of 37 pathway transcripts, only SPRY2 differs between deaf and non-penetrant homozygotes.

    Deliberate hedges: the cellular node is expression-based, not a demonstrated cochlear pathology, and says so - no model of the human GAB1 allele exists. The zebrafish entry is graded PARTIALLY_RECAPITULATES with fidelity LOW because the scored phenotype is early embryonic development, not hearing; it is an allele-function assay, and the limitations say that. No pooled frequency bands: DFNB26 is one family, so only the definitional OBLIGATE is used and the prevalence notes state the base explicitly.

    Snippet handling: the PMID:29408807 cache is PDF-derived and carries mid-word hyphenation artifacts (developmen-tal, senso -rineural, homo -zygous, METTL13- dominant). Rather than quote across those, every snippet was re-cut to a clean span and each affected explanation records what was trimmed and why. The audit reports 45/45 verified with zero cache-defect normalizations.

    Two references fetched during scoping (PMID:16579977, PMID:39062623) were not cited and their untracked cache files were deleted rather than committed.

    Validation: just validate, validate-terms, count-verified-snippets (45/45), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-environmental-evidence, validate-disorders all pass.

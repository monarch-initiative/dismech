  summary: 'Review round 1: address CHANGES_REQUESTED on PR #10904'
  details: |
    Addressed the four IMPORTANT findings and four suggestions in the automated review of PR #10904.

    Fixed:
    - METTL13 enzymatic activity (finding 2). The curator prose asserting that METTL13's predicted activities have never been demonstrated was outdated and is rewritten. PMID:30143613 (Jakobsson et al., Nat Commun 2018) and PMID:30612740 (Liu et al., Cell 2019) were fetched and are now cited on the METTL13 genetic entry and in the knowledge-gap discussion. The 2018 JCI snippet is unchanged and is retained as the historical baseline, with an explanation saying it has been superseded.
    - The review's domain assignment is wrong in one detail and the entry does not repeat it. The review states p.Arg544Gln falls in 'MTase13-C, the eEF1A-Lys55 methyltransferase domain'. Jakobsson assigns the Lys55 activity to MT13-N and the eEF1A N-terminal activity to MT13-C, and Liu independently shows residues 1-401 suffice for Lys55 methylation while the C-terminal domain is dispensable for it. Arg544 sits in MT13-C (crystallised core residues 470-699), so the candidate activity for the suppressor is eEF1A N-terminal methylation, not Lys55 methylation.
    - evidence_source consistency (finding 3). Three items quoting the lymphoblastoid RT-PCR panel were regraded HUMAN_CLINICAL -> IN_VITRO; four items quoting authorial framing, future work, a therapeutic proposal and explicit speculation were regraded HUMAN_CLINICAL -> OTHER. Each explanation now says why.
    - references block and GeneReviews decision (finding 4). Added a references: block for the four cited papers and a top-level notes paragraph recording that PMID:20301607 is not tagged, because its cached record is abstract-only and contains no GAB1/METTL13/DFNB26/DFNM1 content.
    - Fourteen-vs-thirteen count (suggestion 5). The discussion rationale said thirteen; the source lists thirteen downregulated plus PI3K upregulated. Corrected to fourteen with the breakdown.
    - Mouse provenance (suggestion 8). The spiral-ganglion node description now says the LacZ reporter and colocalisation data are mouse.
    - Cochlear implantation (suggestion 7). Neither cached paper mentions implantation (verified by searching both records), so no evidence item was manufactured; a notes field records the search and the absence.
    - Prelingual Onset (suggestion 6). Kept as its own phenotype and the disconnection made explicit in notes: it is the timing axis of the same clinical event rather than a separate consequence, so no source supports an edge; folding it into an onset: block would require choosing an OnsetEnum value, and both sources say only 'prelingual', which does not distinguish congenital from neonatal or infantile.

    Declined:
    - No deep-research artifact was added (finding 1). CLAUDE.md forbids hand-writing markdown into research/, and no provider recipe was available. A manual PubMed sweep was run instead (GAB1 x hearing loss/deafness, DFNB26, DFNM1, METTL13, METTL13 x deafness, METTL13 x eEF1A) and is recorded in the entry's top-level notes. It confirmed no third family and no independent replication of the disease association, and it surfaced the two METTL13 papers that finding 2 turns on.

    The METTL13 MODIFIER-not-digenic modelling and the unbound HP:0010984 are unchanged; the review endorsed both.

    Validation: just validate (51/51 snippets verified), validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-title-snippets, check-snippet-length, check-snippet-grading all pass.

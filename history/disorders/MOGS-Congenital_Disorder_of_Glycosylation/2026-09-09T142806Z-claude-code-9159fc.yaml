  summary: 'Create: MOGS-Congenital Disorder of Glycosylation (MONDO:0011629)'
  details: |
    De novo curation of MOGS-CDG (CDG-IIb), claimed on issue #11522.

    Deep research: one OpenScientist run (research/MOGS-Congenital_Disorder_of_Glycosylation-deep-research-openscientist.md, 53 min, 15 citations). The report carried reference_validation and term_validation frontmatter from the generator. References: 15/15 verified, 0 not found, 0 unverifiable, 15/15 on topic, confabulation_rate 0.0. Terms: 45 checked, 43 resolved, 0 not found, 0 obsolete, 2 unverifiable (ORPHA, no resolver).

    needs_review is true, and it is worth saying why, because the reason is benign and the flag would otherwise read as a fabrication warning. Five entries appear under mislabelled_terms: HP:0001252, HP:0001188, HP:0002791, HP:0002720 and HP:0000505 are each 'named' by the report as a frequency word ('Nearly universal', 'Common', 'Subset', 'Minority'). That is a column artifact of the report's phenotype frequency table, not a wrong binding. Each CURIE was checked independently and resolves to a sensible phenotype. No CURIE was taken from the report without checking it.

    No .citations.md sidecar was produced for this report, so the citation set was swept from the body with grep rather than read from the sidecar, per the dismech-references fallback.

    What the report changed. Two additions were taken from it. First, HP:0000505 Visual impairment as a phenotype: the ten-case series snippet already cited elsewhere in the entry names vision problems in a minority, and I had that only as prose. Second, the serum-glycomics mechanism behind the hypogammaglobulinemia (PMID:35137040): patient IgG carries aberrant oligo-mannose and hybrid N-glycans with reduced core-fucosylated complex species, while transferrin and alpha-1-antitrypsin move the opposite way. That both explains the increased IgG clearance and supplies a second, independent reason transferrin-based CDG screening misses this disease. The report's own ordered causal chain otherwise matched the chain already curated, which is corroboration rather than new content.

    Three report-only PMIDs were fetched into references_cache but not cited (PMID:33245474, PMID:40267907, PMID:40674822); they are committed because the report cites them.

    GeneReviews baseline: none exists for this disease. PubMed searched for 'MOGS-CDG GeneReviews[All Fields]' (no results) and 'congenital disorders of glycosylation GeneReviews[All Fields]' (four results: PMM2-CDG, SLC39A8-CDG, NGLY1-related congenital disorder of deglycosylation, and a retired N-linked glycosylation overview; none is this disease).

    Evidence discipline. The viral-resistance finding is hedged by both cited sources ('may explain', 'at least in part') and those hedges are preserved in the evidence explanations; the node carries mechanism_confidence: PROVISIONAL. The antiviral-target proposal is filed as an EMERGING_HYPOTHESIS discussion rather than as a treatment, and immunoglobulin replacement is deliberately not recorded as a treatment because no cited source recommends it in this disease.

    Validation run in this worktree: just validate passes, 42/42 snippets verified against cached references.

  summary: 'Review round 1 on PR #11528: connect the pathograph, add phenotypes, biochemical
    and models'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11528. All six important findings accepted; all seven suggestions taken.

    Finding 1, the structural one, accepted. Ten of eleven phenotypes had no causal path from any mechanism node: the entry implemented the immune branch of the research report's four and left the neurological, hepatic and dysmorphic findings as a detached cloud. Four branch nodes were added off Failure of the First N-Glycan Trimming Step - Aberrant Neuronal Glycoprotein Function, Hepatic Glycoprotein Dysfunction, Disrupted Developmental Glycosylation and Cumulative Multisystem Glycoprotein Dysfunction - and every phenotype is now the target of a downstream edge. A script confirms 17 of 17 wired, from 1 of 11 before.

    The epistemic status of those branches is recorded rather than glossed. All four carry mechanism_confidence: HYPOTHETICAL and their incoming edges are typed INDIRECT_UNKNOWN_INTERMEDIATES, because the research report marks them inferred and no cited work identifies which neuronal or hepatic glycoprotein carries the effect. The node descriptions say so explicitly. An honestly hedged edge is more informative than no edge, but it should not read as a demonstrated one.

    Finding 2 accepted: six phenotypes added, all from snippets in caches this PR already commits - Failure to thrive, Cerebral atrophy, Hirsutism, Generalized edema, Elevated circulating hepatic transaminase concentration, Dystonia.

    Finding 3 accepted: frequency added to Epileptic encephalopathy (VERY_FREQUENT, matching the description's claim that seizures are universal) and to six other phenotypes.

    Finding 4 accepted. The supportive-care treatment's only evidence item was a methods sentence whose own explanation conceded it did not support the claim; it was removed rather than kept, and a notes field states that no cited source makes a management recommendation for this disease, which is more honest than a weak citation. Anticonvulsant therapy added (NCIT:C64172), with the drug-resistance and long-term seizure course cited from PMID:33058492 and no agent named because the literature names none. Both treatments now carry target_mechanisms into the pathograph.

    Finding 5 accepted. PMID:33058492 and PMID:38498292 were fetched but unused; both are now cited and both carried content the entry was missing - the movement-disorder and progressive-atrophy phenotypes, and the updated worldwide count of about 30 patients as of 2024, which the prevalence notes previously stopped at 12. PMID:33245474 and PMID:40674822, listed in the PR body as deliberately uncited, are now cited too (see below). PMID:40267907 supports the new UGGT1-CDG differential.

    Finding 6 accepted: a biochemical block was added with the urinary Glc3Man reference interval (under 5 umol/mmol creatinine against a patient range of 34.1 to 618.0) and a second record for the secondary laboratory panel from PMID:36158009. No LOINC code is bound: urinary Glc3Man is a specialist research assay with no LOINC counterpart, and the reference_range notes say that rather than binding an approximate code.

    Suggestions, all taken. GO:0009313 rebound to GO:0006491 N-glycan processing on the bypass node. The GO:0019065 binding on the viral node is kept but the node description now states that it covers the entry half only and that the replication half is deliberately left unbound. Prevalence updated. UGGT1-CDG added as a differential, reciprocating the link that already exists on that entry. Two experimental_models added: patient skin fibroblasts, which is where the residual activity and the compensatory bypass were actually measured, and the Saccharomyces cerevisiae CWH41 knockout complementation assay from PMID:40674822, which is a route to testing variants of uncertain significance - the practical difficulty the genetic notes already record. The dropped comma was fixed in all five affected snippets.

    One addition beyond the review. PMID:33245474 was among the uncited caches and turned out to matter: it is a negative result from the same group that made the original antiviral observation, reporting that miglustat produced the expected structural glycan change without the functional consequence and did not reproduce the resistance the genetic deficiency shows. It is now cited on the EMERGING_HYPOTHESIS discussion with supports: REFUTE, against the proposition that pharmacological alpha-glucosidase inhibition reproduces the genetic phenotype. Leaving that out of an entry that files the antiviral idea as a hypothesis would have been a real omission.

    The suggestion for a mappings: block could not be implemented. DiseaseMappings carries slots only for icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings; OMIM #606056 and ORPHA:79328 have no home. The same limitation was hit on PR #11527.

    Validation after the round: just validate-disorders passes, 65/65 snippets verified against cached references; check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-snippet-grading, check-title-snippets and check-snippet-length all pass.

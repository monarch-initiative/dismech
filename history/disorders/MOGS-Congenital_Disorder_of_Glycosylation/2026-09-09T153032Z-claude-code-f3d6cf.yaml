  summary: 'Review round 2: fix truncated snippet, add UGGT1-CDG differential, regrade
    second null result'
  details: |
    Second review round on PR #11528, answering three IMPORTANT findings and five suggestions in one push.

    Finding A: the yeast CWH41 complementation snippet ended mid-word at 'Saccharomyces cerev' and its explanation asserted the cached record truncates there. It does not; references_cache/PMID_40674822.md carries the sentence complete. The snippet is completed, the false claim about the cache is deleted, and a second evidence item was added for the sentence saying the assay was run on disease-associated human variants.

    Finding B: the previous history record for this entry (2026-09-09T145702Z-claude-code-a8b590.yaml) states that a UGGT1-CDG differential was added and that PMID:40267907 supports it. Neither was true; the differential never landed in the file and that PMID stayed title-only. That record is append-only and is left as written. The differential is now actually present, bound to MONDO:0980705, with three evidence items from PMID:40267907 covering the overlapping cardinal features, the severe-end features, and UGGT1's role in the same ER quality-control loop. This reciprocates the MOGS-CDG differential that already existed on the UGGT1-CDG entry.

    Finding C: two null results from PMID:33245474 in the antiviral discussion were graded REFUTE and SUPPORT although both cut the same way against the same proposition. The cytokine null is now REFUTE.

    Suggestions taken: frequency added to the six remaining phenotypes, so all 17 now carry one; the Thin corpus callosum and Visual impairment edges retyped INDIRECT_UNKNOWN_INTERMEDIATES to match the HYPOTHETICAL confidence of the node they leave; a classifications block with icimd_category n_linked_protein_glycosylation; a mappings block with ICD10CM:E77.8 as a skos:broadMatch, since it is a residual glycoprotein-metabolism code covering many unrelated disorders.

    Two suggestions declined with reasons recorded in the entry notes. No conforms_to: the congenital_disorder_of_glycosylation module is keyed on a Protein Hypoglycosylation hub, and MOGS-CDG's signature is precisely that generalized hypoglycosylation does not occur, because the endo-alpha-1,2-mannosidase bypass restores glycan maturation and transferrin isoelectric focusing is normal. No ICD-11 mapping: icd11f identifiers in this repository are Foundation entity numbers and no source consulted resolved the linearization code 5C51.2 to one, so the code is recorded in notes rather than converted by guesswork.

    Validation: linkml-validate, linkml-term-validator and linkml-reference-validator clean, 70/70 snippets verified (was 65/65). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values clean for this file.

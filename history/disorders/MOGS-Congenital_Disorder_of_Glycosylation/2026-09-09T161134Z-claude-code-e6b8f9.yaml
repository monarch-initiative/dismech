  details: |
    Fourth review round on PR #11528. One IMPORTANT finding and five suggestions.

    Finding A. Round 3 changed two frequency grades from the PMID:36158009 summary table without moving the evidence underneath them, so both records carried a band their own citations could not support. Hepatomegaly was VERY_FREQUENT on the strength of a two-case report. Decreased circulating IgG concentration was worse: its description cited counts (low IgG in four of eleven, some-class hypogammaglobulinemia in all eleven) that appeared in no evidence item, while its remaining explanation still read 'Sets the frequency: hypogammaglobulinemia is a minority feature' and contradicted the description three lines above. Both records now carry an evidence item quoting the table row the band was actually set from, in the same caption-plus-row form the round-3 phenotypes use.

    The IgG record's two cohorts genuinely disagree: the ten-case series calls hypogammaglobulinemia a minority feature, the eleven-patient table shows some-class hypogammaglobulinemia in every patient. Both quotes are retained and the description now states the disagreement and says which one the band follows, rather than leaving two sentences pointing opposite ways. Two stale explanations in the same block were also rewritten: one still called the sibling-pair finding 'the paradox this entry models', which round 3 removed, and one still claimed to set a frequency it no longer sets.

    Suggestions taken. The High palate count was wrong in the same direction the reviewer's own round-3 note was: the row carries six positives and five unassessed columns, not seven and four. Broad nose was rebound from HP:0000431 Wide nasal bridge to HP:0000445 Wide nose, which carries 'Broad nose' as a recorded synonym and matches what the source recorded; the old binding named a structure the table does not mention. Elevated circulating hepatic transaminase concentration regraded FREQUENT to VERY_FREQUENT with its own row, positive in all seven patients where transaminases were measured. The Overlapping fingers category was Skeletal where every sibling record uses Musculoskeletal.

    The CMV observation was load-bearing prose in three places with no evidence item. It is now a third REFUTE item on the antiviral discussion, and the most important of the three: the other two are nulls from the same in-vitro model, while this is a MOGS-CDG patient acquiring an enveloped-virus infection, with the reporting authors naming the contradiction themselves.

    Validation: schema, terms and references clean, 84/84 snippets verified (was 80/80). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values clean for this file. All 26 phenotypes remain downstream targets.

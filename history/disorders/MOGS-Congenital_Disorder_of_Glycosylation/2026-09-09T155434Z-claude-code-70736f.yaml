  summary: 'Review round 3: correct two false clinical claims and curate the summary
    table'
  details: |
    Third review round on PR #11528. Two CRITICAL findings, both correct, both traceable to the same mistake: references_cache/PMID_36158009.md was mined for its case narratives and its glycomics and not for Table 2, the summary of all reported patients, in a cache this PR commits and cites five times.

    CRITICAL 1. The UGGT1-CDG differential added in round 2 asserted that microcephaly 'is not a described feature of MOGS-CDG' and called it the discriminating item. Table 2 shows microcephaly positive in 10 of 11 MOGS-CDG patient columns, one not-done, none negative. It is near-universal on both sides and discriminates nothing, and the false line sat in the section whose only job is telling two diseases apart. The distinguishing_features list now names the urinary Glc3Man tetrasaccharide as the discriminator that works, keeps scoliosis and polycystic kidneys as the genuine UGGT1 separators, and states explicitly that microcephaly and cardiac involvement do NOT discriminate, with the counts. A REFUTE-graded evidence item quoting the microcephaly row is attached so the correction is visible in the record rather than only in prose. The cardiac claim was narrowed for the same reason: roughly six of eleven MOGS-CDG patients have ASD, PFO, left ventricular hypertrophy, dilated cardiomyopathy or heart failure.

    CRITICAL 2. The entry asserted 'little clinical infection' as a property of the disease in four places: the top-level description, the antiviral pathophysiology node, the hypothesis rationale, and the notes argument for withholding immunoglobulin replacement. Table 2 shows recurrent infection positive in 10 of 11 patients; the single negative column is the sibling pair of PMID:24716661, which is where the observation came from. That paper says 'we cannot make broad generalizations' and scopes its conclusion to those two siblings, and PMID:36158009 reports cytomegalovirus infection in a patient from another pair despite CMV being enveloped. All four statements narrowed to the sibling pair. The mechanistic claim is untouched, since reduced susceptibility to glycosylation-dependent enveloped viruses is a different proposition from a clinical phenotype of preserved immunity. The notes argument for withholding IVIG rested partly on the paradox, so the reason was corrected rather than the conclusion: the sufficient reason is that no cited source recommends it here.

    IMPORTANT 3 and 4. Nine phenotypes added from the same table, each citing its own row quoted with the table caption so the count is attributable to the whole reported cohort: Microcephaly, Recurrent infections, Hearing impairment, Wide nasal bridge, Short palpebral fissure, High palate, Macrotia, Arthrogryposis multiplex congenita, and Abnormal heart morphology. Every HP term was resolved by lookup at the point of writing. Hepatomegaly regraded FREQUENT to VERY_FREQUENT (9 of 9 assessable) and Decreased circulating IgG concentration OCCASIONAL to FREQUENT, with its description corrected: low IgG specifically is named in four of eleven, while hypogammaglobulinemia of some class is present in all eleven.

    All 26 phenotypes are downstream targets. The notes section 'What this entry deliberately does not claim' was half-stated: it recorded that the antiviral observation rests on two siblings but not what the other nine patients look like. It now carries the counts.

    One error caught in progress: the reference_title for PMID:36158009 was written from recall as 'Genetic and clinical profile of Chinese patients...' and the cache title is 'Updated clinical and glycomic features of mannosyl-oligosaccharide glucosidase deficiency: Two case reports.' The reference validator caught it before commit. This is the second title fabrication in this session and the rule against it exists for exactly this shape of error.

    Validation: schema, terms and references clean, 80/80 snippets verified (was 70/70). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values clean for this file.

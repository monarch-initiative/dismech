  summary: 'Genetics pass: bind each gene to its complex-component subtype'
  details: |
    Genetics pass for dismech#12205 (d2g wiring-016).

    All six canonical genes plus LONP1 were already bound with `gene_term` and
    already wired into pathophysiology nodes (7/7). The gap was in the other
    direction: no `has_subtypes` row carried a gene, and no `genetic:` record named
    its subtype, so the mapping from gene to the complex component it encodes lived
    only in a flat six-gene list on one node.

    Changes:
    - `genes:` on each of the six `has_subtypes` rows, binding the gene for that
      component: PDHA1 (+LONP1) to E1-alpha, PDHB to E1-beta, DLAT to E2, DLD to E3,
      PDHX to E3-binding protein, PDP1 to PDH phosphatase.
    - `subtype:`, `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` on
      all seven `genetic:` records.
    - A `review_notes` paragraph recording that GeneReviews has a chapter for this
      disease (PMID:34138529, "Primary Pyruvate Dehydrogenase Complex Deficiency
      Overview") which the entry does not cite, and why: its PubMed record carries
      only the chapter's statement of purpose, with no finding that could serve as an
      evidence snippet. The chapter was fetched and inspected to establish that.

    LONP1 is present in this entry and is not in MONDO's causal-gene list for any of
    the six terms; it is kept, sourced to the Orphanet E1-alpha record and to
    PMID:30304514.

    Verification: full offline gate list passes.

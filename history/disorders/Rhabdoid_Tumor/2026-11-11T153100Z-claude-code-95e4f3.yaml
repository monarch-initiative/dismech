  summary: Bind the renal and extrarenal subtypes, point AT/RT at its own entry, and
    cite every causal edge
  details: |
    Three has_subtypes rows carried no subtype_term and the six causal edges carried no evidence. RTK and eMRT are now bound to MONDO:0002729 and MONDO:0044916; the AT/RT row is bound to MONDO:0020560 and carries curated_in: Atypical_Teratoid_Rhabdoid_Tumor, making it a pointer to the entry that curates that stratum rather than a second home for it. Every label was read from the local MONDO build with runoak. All six downstream edges now carry their own evidence, separate from the node evidence they sit beside: the SMARCB1-to-EZH2 edge and the EZH2-to-CDKN2A edge cite PMID:20951942, newly fetched, whose conditional-mouse result and EZH2 shRNA result are the two claims those edges make; the remaining four reuse references already in the entry, each quoting the sentence that asserts the edge rather than the node. Four of the six are graded INDIRECT because they rest on removing one end of the edge and reading the other (Ezh2 deletion, EZH2 inhibition, Cyclin D1 knockout). Differential diagnosis rows were planned for this pass and are not included: the cited imaging review carries no differential statement in its cached record, and adding differentials without a source that places each one in the differential would be unsourced. Validated with just validate, just validate-terms, just count-verified-snippets (31 of 31) and the full C4 gate set.

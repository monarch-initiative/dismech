  summary: Bind GO:0090042 tubulin deacetylation, replacing an over-broad GO:0006476
  details: |
    Review round on the approving review from ai4c-reviewer on PR #12402. The review found no CRITICAL or IMPORTANT issues and marked two SUGGESTIONS as optional. Optional findings do not start a push under the repository's review rules, and this round is a push anyway, for a reason worth recording.

    Suggestion 1 observed that the Alpha-Tubulin Hypoacetylation node binds GO:0006476 protein deacetylation while its preferred_term is 'alpha-tubulin deacetylation', and proposed - explicitly as optional - adding a one-line note recording that a tubulin-specific GO term had been searched for. Its stated reasoning was that the broad binding is the correct call under the term contract because manufacturing a narrower match would be worse.

    Running the search before writing that note showed the premise was false. runoak -i ols:go search 'l~tubulin deacetylation' returns GO:0090042 tubulin deacetylation, along with GO:0090043 regulation of tubulin deacetylation, GO:0090044 positive regulation, GO:1904428 negative regulation, and the molecular-function term GO:0042903 tubulin deacetylase activity already bound on the node above. A tubulin-specific biological-process term exists and the entry was not using it.

    So the binding was over-broad, not a justified compromise, and the Ontology Term Contract's instruction to bind the most specific term that accurately represents the claim was not being met. Changed to GO:0090042. The note added to the entry records the query and what it returned, and states positively that GO has no alpha-tubulin-specific process term so the alpha-tubulin specificity stays in preferred_term - rather than asserting an absence that was not checked.

    Had the suggested note been written as proposed, it would have been a false justification of exactly the kind the dismech-terms skill documents at step 3a: a sentence asserting a search was run, attached to an over-broad binding, telling the next reviewer to skip the one check that would catch it. That is the third instance of that failure shape in this five-entry batch and the first where the false note was proposed by a reviewer rather than by the curator.

    This push dismisses the approving review, which is a real cost and was weighed. A wrong ontology binding in a knowledge base whose value rests on correct bindings is not a cosmetic defect, and the approval was granted on a premise that turned out to be false.

    Suggestion 2 was not acted on and needs no change: it flags that the pathograph is deliberately not one connected component, and explicitly does not ask for the missing edge. That disconnection is the entry's central documented knowledge gap.

    Two mislabelled CURIEs the reviewer found in the deep-research report were independently re-checked here rather than taken on trust: HP:0005830 resolves to Flexion contracture of toe (the report calls it 'Poor skull mineralization') and HP:0001010 to Hypopigmentation of the skin (the report calls it 'Body/limb asymmetry'). Both confirmed via ols:hp, and grep confirms neither appears anywhere in the entry. No action needed; recorded because it is further evidence that a deep-research CURIE is a lead and not a binding.

    Validation after the round: just validate passes with 43/43 snippets verified; validate-terms, check-entity-refs, check-causal-targets and check-duplicate-keys all pass.

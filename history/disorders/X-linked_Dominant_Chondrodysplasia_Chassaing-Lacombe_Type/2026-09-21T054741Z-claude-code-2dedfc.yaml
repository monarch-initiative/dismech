  summary: Rebind to GO:0071929 alpha-tubulin acetylation; retract a false negative-existence
    claim
  details: |
    Answers the CHANGES_REQUESTED review on PR #12402 (review 5263377657). The finding was reached independently here at the same time and the fix was already prepared locally when the verdict arrived; the two converged on the same two options.

    The defect. The ontology note added by the previous commit asserted 'GO has no alpha-tubulin-specific process term'. That was written after running only 'runoak -i ols:go search l~tubulin deacetylation' and generalising from it. It is false: 'runoak -i ols:go search l~alpha-tubulin' returns GO:0043014 alpha-tubulin binding and GO:0071929 alpha-tubulin acetylation, the latter defined as the addition of an acetyl group to the lysine 40 residue of alpha-tubulin - the exact mark this entry is about.

    This is the third negative-existence failure in this five-entry batch, and the most pointed one: the commit that introduced it was itself correcting a reviewer-proposed false justification, and described that failure accurately in its own message, then committed the same shape one substrate level down. A false justification in notes is worse than a bare over-broad binding precisely because it tells the next reader the lookup is done.

    The fix takes the reviewer's option 2 rather than its option 1. The node is bound to GO:0071929 alpha-tubulin acetylation with modifier: DECREASED, replacing GO:0090042 tubulin deacetylation with modifier: INCREASED. Reasoning, recorded in the entry rather than only here: GO:0071929 is alpha-specific where GO:0090042 is tubulin-general; it names K40, the residue the cited measurement concerns; and it states the node in the direction the node is named and measured. PMID:20181727 reports that 'the level of acetylated alpha-tubulin was found to be profoundly decreased' - the measured quantity is alpha-tubulin acetylation, falling. Nothing about the enzymatic step is lost, because the deacetylase activity driving it is separately bound as GO:0042903 tubulin deacetylase activity on the node above.

    The reviewer asked that whichever binding is kept, the note record that both were seen. It does: the note states the true narrower claim (GO has no alpha-tubulin-specific deacetylation term - it has the alpha-specific acetylation process and the tubulin-general deacetylation process, and nothing combining both), explains the choice between them positively, and lists all three searches with their full output so the next reader need not repeat them.

    The reviewer also flagged that GO:0071929 was not yet in cache/enums/biologicalprocessterm_*.csv and that a rebind would need just validate-terms to confirm enum membership. Run: it passes, and the enum cache row is included in this commit.

    Validation after the round: just validate passes with 43/43 snippets verified; validate-terms, check-entity-refs, check-causal-targets and check-duplicate-keys all pass.

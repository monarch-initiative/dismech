  summary: 'Create: X-linked Dominant Chondrodysplasia Chassaing-Lacombe Type (HDAC6)'
  details: |
    New DISEASE entry for MONDO:0010463, the HDAC6 3'-UTR chondrodysplasia described in one four-generation family.

    Why this entry stops where it does. There is a measured molecular consequence (alpha-tubulin hypoacetylation in affected fetal thymus) and a well-described skeletal phenotype, and nothing published connects them. No chondrocyte or growth-plate study of this variant exists and no animal model of it has been made. The pathograph therefore ends at the biochemical node, with no causal edge to any skeletal phenotype. It would have been easy to write that edge from general knowledge about microtubules in chondrocytes and it would have validated; it is left out deliberately and recorded as a KNOWLEDGE_GAP discussion with two proposed experiments.

    Two candidate bridges across that gap are carried as EMERGING mechanistic_hypotheses rather than as edges, and neither is adjudicated:
    - hdac6_fgfr3_stabilization: FGFR3 accumulation depends on HDAC6, and deleting or inhibiting HDAC6 improves growth-plate bone growth in a mouse thanatophoric dysplasia model (PMID:27506979). That is the inverse manipulation to this disease, so HDAC6 excess would be predicted to stabilize FGFR3.
    - hdac6_ciliary_resorption: HDAC6 is the effector of regulated primary-cilium disassembly via HEF1/NEDD9 and Aurora A (PMID:17604723), and growth-plate chondrocytes depend on the cilium for Hedgehog signalling. This one came from the deep-research pass.

    Deep research: research/X-linked_Dominant_Chondrodysplasia_Chassaing-Lacombe_Type-deep-research-openscientist.md, provider openscientist, 14 citations, 14/14 resolved, confabulation rate 0.0. just preflight-dr returns PASS against MONDO:0010463 (HDAC6 mentioned 81 times, no rival gene above 9).

    Reconciling it contributed the Hdac6-knockout mouse (PMID:18180281) and the cilium hypothesis (PMID:17604723). The knockout is the dosage control and is curated in animal_models as FAILS_TO_RECAPITULATE: mice with no HDAC6 at all are viable and fertile with hyperacetylated tubulin, and losing the gene gives only a small increase in cancellous bone mineral density, described by its authors as a minor role in bone biology. The skeleton tolerates complete absence of HDAC6 almost without comment, which is the argument for HYPERMORPHIC on the lesion node and against any loss-of-function reading.

    Its causal chain marks steps 4-6 [INFERRED] and states the ciliary-Hedgehog mechanism is 'inferred, not directly demonstrated in patients'. That matches the reading this entry had reached independently and is why conforms_to ciliopathy_dysfunction stays unset: HDAC6 does act on cilia, but nothing in either paper about this disease examines them.

    What was NOT taken from the report, and the reason matters. Its phenotype table lists intrauterine growth retardation, macrocephaly, frontal bossing, low-set ears, thin ribs, eleven rib pairs, iliac wing hypoplasia and poor skull mineralization, attributing them to PMID:16001442 plus the OMIM 300863 clinical synopsis. None appears in the cached abstract of PMID:16001442, which is the only text a snippet can be verified against here, and an OMIM clinical synopsis is not a quotable source in this repository. They are left out rather than curated against a quote that does not exist. The same applies to its LOD score of 3.30 and its bone-histology description. This is a real coverage cost of the exact-quote rule and is recorded rather than worked around. Its ClinVar missense candidate p.Thr697Ile is recorded as an OPEN_QUESTION discussion rather than curated, because the ClinVar record was not read as part of this curation.

    One drafting error, caught by validation and recorded because the pattern recurred across this session: the brachydactyly phenotype originally quoted the describing paper's TITLE as its snippet. Reference validation rejected it, and it was replaced with the abstract's metaphyseal-cupping result sentence, marked INDIRECT because that sentence reports the radiographic lesion rather than the clinical sign. Separately, NCIT:C38101 was written from memory as 'Radiography'; its canonical label is 'X-Ray Imaging', caught as a WARN by just validate-terms.

    Validation. just validate passes with 38/38 snippets verified. just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-coarse-phenotypes all pass. just check-genereviews reports NO_CHAPTER for both collections against the committed Bookshelf index snapshot of 2026-09-10.

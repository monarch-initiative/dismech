  summary: 'Create: ichthyosiform erythroderma, corneal involvement, and hearing loss
    (MONDO:0009440, AP1B1)'
  details: |
    De-novo curation of MONDO:0009440 as a DISEASE entry: the autosomal recessive AP1B1 disorder called KIDAR, Desmons syndrome, and currently IDEDNIK. Curated as an inborn error of copper metabolism reached through a trafficking defect: biallelic AP1B1 loss of function, AP-1 adaptor complex dysfunction, ATP7A mislocalisation demonstrated in patient fibroblasts, systemic copper handling defect. The existing Keratitis-Ichthyosis-Deafness_Syndrome entry places this disorder explicitly out of its own scope and carries it as a differential, so a separate entry is what that entry expects. THE OPENSCIENTIST DEEP-RESEARCH REPORT WAS DISCARDED IN FULL AND NONE OF ITS CONTENT WAS USED: given the label and MONDO:0009440 it researched the dominant GJB2 KID syndrome instead, naming GJB2 fourteen times and AP1B1 not once, and had it been used this entry would have duplicated the existing KID entry. It is committed for provenance and the failure is documented in notes and in the PR body. Every reference was found independently through PubMed. Three knowledge gaps: the MONDO:0009440 versus MONDO:0859278 identity question, whether the skin and gut phenotypes follow from copper or from other AP-1 cargo, and the contradiction between the founding report finding no hepatic copper toxicity and GeneReviews describing zinc therapy aimed at liver copper overload. Validated: just validate (all snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass.

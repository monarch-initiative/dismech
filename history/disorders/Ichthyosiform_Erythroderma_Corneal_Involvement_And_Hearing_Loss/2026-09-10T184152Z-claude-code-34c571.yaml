  details: |
    Round 2 of review on PR #11622. One blocking item, three suggestions, in one push.

    BLOCKING, and the reviewer found less of it than there was. Both history records on this entry had links.issues pointing at issue 11618, which is an unrelated OPA1 optic-atrophy curation. The correct claim issue is 11613, as the PR body's Closes line says. Checking the sibling PRs in the same run showed the same typo in two more records: the PBD6A round-2 record said 11616 for what is 11611, and the 12p12.1 round-2 record said 11615 for what is 11612. Three of four wrong. All fixed on their own branches.

    The reviewer's argument for blocking on one URL is right and worth recording rather than just complying with. Round 1 raised the empty links as a suggestion; the response filled it with a confident wrong value, which is worse than the gap it replaced. These records are append-only, so an empty field is something a later reader can fill and a wrong pointer is a false statement that reads as authoritative indefinitely. The reviewer also noted the irony, that an entry whose headline finding is a fluent research report naming the wrong disease had the same failure reach its own provenance metadata. That is exactly what happened: the numbers were written from working memory of the claim run rather than read back from the issues.

    SUGGESTION 1 taken. The Recurrent Infections to Sepsis sequela was directness DIRECT on a sentence that enumerates findings without asserting that the infections caused the sepsis. Regraded INDIRECT, matching the keratitis and developmental-delay sequelae added in the same round, which quote co-listing sentences and were already graded that way. The inconsistency was mine.

    SUGGESTION 2 taken, and taken the more faithful of the two options offered. The source's word consequent attaches to the neonatal pancreatic insufficiency, not to the enteropathy the edge was drawn from, so the edge claimed an asserted causal order that belonged to a neighbouring pair. Exocrine Pancreatic Insufficiency is now its own phenotype (HP:0001738), carrying the consequent clause as a DIRECT sequela to Failure to Thrive, and connected upstream to the copper node. The enteropathy to failure-to-thrive edge is regraded INDIRECT_UNKNOWN_INTERMEDIATES on the systematic-review core-features sentence, which co-lists the three without ordering them.

    SUGGESTION 3 taken as a knowledge gap rather than as content. The GeneReviews SURVEILLANCE schedule has no schema home: it is not a treatment (nothing is administered), not a diagnostic test (repeat measurements on an already-diagnosed patient, timed by risk rather than by a diagnostic question), and not a phenotype. The nearest structural analog is biochemical.reference_ranges, which says what a value means but not when to measure it. The schedule is quoted inside the gap so the content is at least present, and the gap says the answer is a schema question.

    SUGGESTION 4 is not a change to this PR; it is handled on GitHub against the deep-research tooling.

    Validation: schema clean, terms clean, 90 of 90 snippets verified (was 86), and entity refs, duplicate keys, causal targets, enum values and qualifier terms all clean.

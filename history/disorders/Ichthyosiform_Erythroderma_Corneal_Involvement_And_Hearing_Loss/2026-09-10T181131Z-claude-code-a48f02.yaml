  summary: 'Review round 1: mine GeneReviews management and phenotypes, connect the
    pathograph'
  details: |
    Round 1 of review on PR #11622, all seven findings plus the suggestions in one push.

    Finding 1: tagged PMID:39541497 as a GeneReviews chapter in the top-level references block.

    Finding 2: mined the GeneReviews MANAGEMENT section. Seven supportive-care treatments added, each with its own target_mechanisms edge: nutritional support for the enteropathy, gastrostomy, topical skin therapy, hearing aids (device carried as an NCIT:C16830 qualifier because NCIT:C183182 Hearing Aid is not reachable from Clinical Intervention or Procedure), developmental and educational support, standard treatment of recurrent infections, and supportive care for the cytopenias. The Evaluation of relatives at risk recommendation is recorded as a treatment because its stated purpose is early initiation of zinc acetate, which makes it a timing intervention on the one mechanism-directed therapy the disorder has.

    Finding 3: PMID:41453769 is now cited, supplying the acitretin treatment row. It was the one on-target reference among the thirty-odd GJB2 files the off-target deep-research run fetched.

    Finding 4: the GeneReviews recurrence-risk sentence is now an evidence item in inheritance.

    Finding 5: ten phenotypes added, all corroborated in two independently cited sources where the reviewer said so: recurrent infections, sepsis, anemia, neutropenia, thrombocytopenia, liver disease, cerebral atrophy, thin corpus callosum, intellectual disability, and erythroderma (the suggestion: HP:0008064 Ichthyosis carries only the scaling half of the compound term, so the erythroderma was being dropped by the binding).

    Finding 6: directness on the AP-1 Adaptor Complex Dysfunction evidence item changed from DIRECT to INDIRECT, since the explanation itself describes an inference step. The GeneReviews confirmatory-testing sentence moved to diagnosis.

    Finding 7: the pathograph is now connected. Thirteen downstream edges added from Systemic Copper Handling Defect, four sequelae chains (enteropathy to failure to thrive, keratitis to photophobia and to corneal scarring, developmental delay to intellectual disability, recurrent infections to sepsis), and target_mechanisms on Oral Zinc Acetate. The zinc edge is recorded MODULATES rather than RESTORES and its evidence graded INDIRECT, because the therapy is aimed at liver copper overload while this entry curates the deficiency arm; that tension is the entry's existing knowledge gap and the edge does not resolve it.

    Suggestions: clinical_course PROGRESSIVE added to the hearing-loss phenotype term, with the description reconciled so congenital onset and progressive course sit together rather than in conflict. The cross-entry MONDO disagreement with Keratitis-Ichthyosis-Deafness_Syndrome.yaml lines 36-39 is now named explicitly in notes; that entry is deliberately not edited, because which of MONDO:0009440 and MONDO:0859278 is right is the open question and writing an answer into a second entry would spread a guess.

    Validation: schema clean, term validation clean, 86 of 86 snippets verified against the local reference cache, and the offline gates (entity refs, duplicate keys, causal targets, enum values, qualifier terms, folded hyphens, snippet length, title snippets) all pass.

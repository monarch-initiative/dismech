  summary: 'Review round 1: wire the phenotypes into the pathograph; add molecular
    diagnosis'
  details: |
    Addressed the three IMPORTANT findings in the CHANGES_REQUESTED review on PR #11718.

    Finding 1, pathograph disconnection. Nine of eleven phenotypes had no edges at all, so the rendered graph showed a lipid disease with an orphaned neurological phenotype list. Neurodevelopmental Dysfunction had no downstream edges despite the entry calling it the clinically dominant arm. Added bare-name downstream edges: Neurodevelopmental Dysfunction to its seven neurological phenotypes, the insulin-receptor node to Short Stature (the edge the node's own prose already argued for), and node 3 to Dysmorphic Features, which is morphogenetic rather than neurological so it is drawn from the substrate-loss node. All are typed INDIRECT_UNKNOWN_INTERMEDIATES, which is the honest typing: no substrate is identified for any of them. Added target_mechanisms to two of the three treatments (antiseizure to Epilepsy, developmental support to Neurodevelopmental Dysfunction); Genetic Counselling has no mechanism target and keeps none.

    Verified by rebuilding the graph rather than by reading the YAML: 20 edges, zero orphan targets, and isolated nodes down from 12 to 2. The two remaining are the GALNT2 gene node and Genetic Counselling, neither of which is a causal-graph participant.

    Finding 2, diagnosis. The section had only apoC-III glycoform analysis. Added molecular confirmation by next-generation sequencing, citing PMID:34540767, which was already cached in this PR but never cited, graded INDIRECT/OTHER because it is a class-level CDG review rather than a GALNT2-CDG source. Added brain MRI, since the entry curates white matter changes as a phenotype and the finding has to be looked for to be recorded. The transferrin IEF notes block was left unchanged, as the reviewer explicitly asked.

    Finding 3, notes miscount. The evidence-base sentence said five references and then said one plus the other three, which sums to four and there were four. Now five after this round's addition, itemised, with the earlier error stated rather than silently overwritten.

    Suggestions taken: oligodendrocyte (CL:0000128) added alongside neuron on the neurodevelopmental node, which also justifies the white-matter edge. OMIM 618885 recorded in notes rather than in mappings, because the schema has no OMIM mapping slot; the number was read from MONDO's own oio:hasDbXref rather than from the deep-research report.

    Suggestions declined with reasons given in the PR reply: HP:0000708 (is-a parent of an already-curated term, so it adds no queryable information), the gene OMIM number (not independently verified), and pruning the ten cached-but-uncited references.

    Validation: just validate passes, 32/32 snippets verified (was 30/30). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK.

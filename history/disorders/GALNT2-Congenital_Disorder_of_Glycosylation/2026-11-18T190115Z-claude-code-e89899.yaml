  summary: Split a stretched SPECIES_MISMATCH into a species and an incomplete-phenotype
    divergence
  details: |
    The Galnt2-null mouse link carried one SPECIES_MISMATCH divergence whose own description said that what was meant was an incomplete phenotype, for which the enum then had no term. With INCOMPLETE_PHENOTYPE added, the single divergence is split into the two claims it was carrying. Language has no murine counterpart at all, so the model structurally cannot address it: that remains SPECIES_MISMATCH. Epilepsy and chronic insomnia are unreported in the model, and a mouse can have seizures and disordered sleep, so nothing about the organism explains their absence: that is INCOMPLETE_PHENOTYPE. Both stay QUALIFYING, the link relationship and fidelity are unchanged, and the note about the missing enum term is removed rather than left contradicting the value it asked for. Review of the PR caught that the first wording of the incomplete-phenotype description overclaimed: it said the model does not show epilepsy and insomnia, which asserts they were assayed. The cited reference is cached abstract-only and reports cerebellar motor deficits, decreased sociability and impaired sensory processing, naming no EEG or sleep measurement, so whether either feature was assayed and absent or never assayed is not recoverable from it. The description now says their absence from the reported phenotype is not explained by the organism, and records that the distinction is unrecoverable. No evidence item, readout, term or snippet is touched.

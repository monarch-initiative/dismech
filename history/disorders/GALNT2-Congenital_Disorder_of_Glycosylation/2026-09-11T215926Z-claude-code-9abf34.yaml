  summary: 'Create: GALNT2-CDG (MONDO:0030043)'
  details: |
    De-novo curation of GALNT2-CDG from claim issue #11713. Built the entry around the non-redundancy of GalNAc-T2 for a small substrate set rather than around a general loss of O-glycosylation, which does not occur. Kept the lipid arm (apoC-III -> low HDL, a named and measured substrate) separate from the neurological arm, whose causal edge is typed INDIRECT_UNKNOWN_INTERMEDIATES because no brain substrate has been identified. Added the insulin receptor as a second named substrate after an OpenScientist deep-research report surfaced it; the lead was verified against the primary paper and graded INDIRECT/MODEL_ORGANISM since the demonstration is murine. Population-genetic GALNT2 lipid-locus evidence is cited only as differential-diagnostic context and graded INDIRECT throughout, to keep common-variant HDL biology from reading as evidence about this Mendelian disease. Validated: linkml-validate, linkml-term-validator, 30/30 snippets verified against cached references, plus check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms. One reference_title was initially written from a reconstructed string and was corrected to the cached title after check-reference-titles flagged it.

  summary: Record the gene-axis MONDO classes as closeMatch cross-references rather
    than subtype rows
  details: |
    series-064 genetics pass, a decline with the reasoning recorded. MONDO:0100561 and MONDO:0100562 partition alpha thalassemia by which alpha-globin gene carries the variant; this entry stratifies it by how many of the four alpha-globin alleles remain functional, which is how the disease is graded clinically. subtype_term is single-valued and each existing row spans both genes, so binding either class to a row would assert that the stratum is restricted to one gene. Both classes also define themselves as mild microcytic anemia, which does not reach the Hemoglobin H and Hemoglobin Bart hydrops fetalis ends of this entry's series. Recorded them in mappings.mondo_mappings as skos:closeMatch, a cross-reference that leaves both concepts in the curation queue rather than retiring them, with the ruling in new entry notes and a pointer that a grouping over the two gene-defined classes is the right home if MONDO's gene axis is later wanted. Gene wiring and phenotype inlink were already complete at 2/2 and 12/12; HBA1 and HBA2 are both bound on the Defective Alpha-Globin Synthesis node.

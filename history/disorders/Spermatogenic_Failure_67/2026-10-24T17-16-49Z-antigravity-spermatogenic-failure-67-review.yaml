    CCDC62 Protein`, `locations` (`UBERON:0000473` testis) to `Impaired Acrosome Biogenesis`, and evidence
    to its downstream edges.

    - Marked `Male infertility` and `Globozoospermia` with `diagnostic: true`, added `presence` and `results`
    to `diagnosis` entries, added `target_mechanisms` (`BYPASSES` `Impaired Acrosome Biogenesis`, PMID:32318024)
    to `ICSI with artificial oocyte activation`, and added top-level evidence to the `Ccdc62` mouse model
    (PMID:28339613).


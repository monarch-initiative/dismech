  summary: Enrich Spermatogenic Failure 67 (CCDC62) with classifications, spermatid/testis grounding,
    downstream edge evidence, diagnosis results, and ICSI target_mechanisms
  details: '- Added `classifications` (`ENDOCRINOLOGY_METABOLISM` and `GENETICS_ENVIRONMENT_DISEASE`)
    and per-gene `inheritance` (`HP:0000007`) on `CCDC62` (`hgnc:30723`) backed by PMID:31985809.


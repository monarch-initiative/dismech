  summary: 'Create: Spermatogenic Failure 67'
  details: |
    New entry for CCDC62-related globozoospermia (MONDO:0030718), claimed in issue 15303. The human evidence is one proband (GL-13, PMID:31985809, full text): homozygous CCDC62 p.Gln148* predicted to cause NMD, in cis with p.His283Tyr, inside a 9 Mb run of homozygosity, alongside VUS in CCDC73, NRIP3 and ATP8A2. No patient sperm or testis was available, so the acrosome-formation node rests on the repro29 Ccdc62 nonsense mouse (PMID:28339613, abstract), including CCDC62 acrosomal localization and the GOPC interaction. ICSI is supported only by a globozoospermia-wide review (PMID:36047070), graded INDIRECT/REVIEW_SYNTHESIS. PMID:33108537 (no CCDC62 variant in 23 DPY19L2-negative exomes) is cited in notes only. No ClinGen, Orphanet or GeneReviews coverage, so no validity tier. CCDC62 bound to hgnc:30723 after an OLS lookup and validate-terms. Validated with just validate, count-verified-snippets (12/12), validate-terms, validate-disorders and the offline gates.

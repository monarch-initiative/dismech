  summary: 'Create: Spermatogenic Failure 67'
  details: |
    Created SPGF67 (CCDC62, MONDO:0030718/OMIM:619803) as autosomal recessive male infertility. Mechanism grounded in primary literature retrieved via PubMed: mouse repro29 ENU nonsense + CRISPR Ccdc62 knockout with complementation proof (PMID:28339613), and the single human proband with a homozygous CCDC62 nonsense variant from a globozoospermia exome study (PMID:31985809), plus a globozoospermia cohort listing CCDC62 as a recognised candidate gene (PMID:33108537). Causal chain: Loss of CCDC62 -> Impaired acrosome biogenesis -> globozoospermia/reduced motility/male infertility. A deep-research run (falcon with --fallback) was launched to augment; reconciliation of its validated citations is pending. GeneReviews check returned NO_CHAPTER (name/gene/synonyms matched). Validated with just validate, validate-terms, count-verified-snippets (12/12), check-entity-refs, check-causal-targets, check-duplicate-keys, and the batched validate-disorders gate.

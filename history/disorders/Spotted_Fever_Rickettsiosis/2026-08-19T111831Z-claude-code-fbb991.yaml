  summary: 'Create: Spotted fever rickettsiosis (SFG root entry)'
  details: |
    Created the root entry for the spotted fever group rickettsioses (MONDO:0001195),
    resolving issue #8890.

    DESIGN DECISION. Modelled as a thin root Disease with has_subtypes rather than a
    Grouping, recorded in the sfr_root_disease_vs_grouping discussion. Two verified
    tooling facts drove it: build_coverage_index in src/dismech/compare/mondo_priority.py
    calls iter_disease_files, which globs the --kb-dir default of kb/disorders only and
    never reads kb/groupings, so a Grouping could not retire MONDO:0001195 from the MONDO
    priority queue; and tests/test_data.py::test_grouping_member_foreign_keys requires
    every grouping member to resolve to a real Disease name, which four of the six members
    here do not yet have. Both were read in source rather than assumed from the
    thanatophoric-dysplasia precedent, and the differences from that precedent are recorded
    in the discussion.

    SUBTYPE AXIS. Keyed on the causative Rickettsia species, with geography as a secondary
    per-subtype descriptor, recorded in sfr_subtype_axis_species_not_geography. Geography
    fails as an identity criterion in both directions: R. conorii carries four
    geographically named diseases (PMID:15766388) and R. rickettsii spans North and South
    America (PMID:28169507). Six subtypes curated, each bound to its own MONDO term: RMSF
    (MONDO:0019359), Mediterranean spotted fever (MONDO:0024472), African tick-bite fever
    (MONDO:0000227), rickettsialpox (MONDO:0019360), Queensland tick typhus
    (MONDO:0001118), Siberian tick typhus (MONDO:0001154). The list is explicitly
    non-exhaustive; the remaining MONDO descendants are named in the discussion as a later
    tranche.

    MODULES. Two conformance anchors, no re-derivation:
    intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials and
    bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome, both
    reached by the group-level doxycycline treatment via target_mechanisms.

    CONTENT. Seven pathophysiology nodes, deliberately thin: arthropod inoculation,
    obligate intracytosolic endothelial infection, a species-graded endothelial
    inflammatory response node that only a root can carry, disseminated small-vessel
    vasculitis with increased permeability, severe pulmonary and neurological end-organ
    involvement, plus the two module anchors. Also carries the SFG taxon
    (NCBITaxon:114277), seven infectious-agent entries, both transmission routes, five
    shared phenotypes, the group-versus-species serology limit, and the all-ages
    doxycycline rule including the overturned paediatric dental-staining concern
    (PMID:25794784, PMID:27172113). Two open discussions record the group-boundary problems
    (mite-borne rickettsialpox under a tick-borne MONDO definition; R. akari and R.
    australis reassigned to the transitional group; the tick-typhus naming trap) and the
    unexplained severity gradient.

    SOURCES AND NEC. No new deep-research provider pass was run, by instruction; the entry
    was built from primary literature fetched from PubMed. preflight-dr is therefore not
    applicable, and NEC discipline was applied manually. Murine typhus is deliberately
    excluded as typhus group, and the tick-typhus versus typhus-group versus scrub-typhus
    trap is recorded explicitly in the entry rather than left implicit. Orphanet ORPHA:102022
    could not be cached because refresh-orphadata fails a sha256 check against its pinned
    manifest; noted in the entry notes, and no prevalence block was invented as a result.

    VALIDATION. just validate passed. just count-verified-snippets reported 58 of 58
    snippets verified against cached references. just validate-terms passed. Whole-KB
    just check-duplicate-keys, just check-title-snippets, just check-term-cache-integrity
    and just check-cache-order all passed. The batched CI gate,
    just validate-disorders kb/disorders/Spotted_Fever_Rickettsiosis.yaml, exited 0 with
    58 of 58 snippets verified. pytest tests/test_data.py -k
    "conforms_to or unique or subtype_foreign or environmental_mechanism" passed, 8415
    tests. All reference cache files were created by just fetch-reference and all term and
    enum cache rows were derived by the validators; none were hand-written.

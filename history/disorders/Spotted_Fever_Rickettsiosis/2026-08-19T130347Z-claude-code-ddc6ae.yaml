  summary: 'Address review findings on PR #8899'
  details: |
    Review-fix session for PR #8899, addressing findings from two successive ai4c-reviewer REQUEST_CHANGES reviews on the Spotted fever rickettsiosis root entry.

    Round 1, finding 1 - frequency band over-read a disjunctive composite. Fever, Headache and Myalgia each carried frequency VERY_FREQUENT, all three resting on one sentence in PMID:12766836: "More than 80% of the patients had fever, headache, and/or myalgia". That is a disjunction and establishes only that more than 80 percent of patients had at least one of the three, so the figure cannot be distributed across its disjuncts to give a rate for any single symptom. The denominator was also wrong for a group-level claim, being n=38 African tick-bite fever patients, the mildest member of the group. The entry was internally inconsistent, since it already declined to assert a frequency for rash and eschar from the second half of the same sentence. Removed frequency from all three and regraded each evidence item from SUPPORT to PARTIAL, with explanations stating what the sentence does and does not support. Searched the cached references for a group-level fever frequency statement to re-source the Fever band and found none, so omission stands rather than substitution, per CLAUDE.md section 7.

    Round 1, finding 2 - diagnosis term contradicted its own node. The "Empiric clinical and epidemiologic diagnosis" node was bound to NCIT:C25294 Laboratory Procedure while describing diagnosis made and treated on suspicion without laboratory confirmation. Rebound to NCIT:C124351 Clinical Evaluation, which was already present in cache/ncit/terms.csv and in the enum membership cache, so no new cache row was needed. The separate serology node correctly retains NCIT:C25294.

    Round 1, non-blocking suggestion - two loose GO bindings removed. GO:0009617 response to bacterium sat on the tick-inoculation node but names a host response rather than the inoculation event; GO:0051701 biological process involved in interaction with host is a near-root grouping term carrying no information. Checked for precise replacements and found none suitable at that time. Note GO:0020003 symbiont-containing vacuole would have been wrong, since Rickettsia escapes the phagosome into the cytosol.

    Round 2, finding 1 - stale notes contradicting the new binding. The round 1 term rebind left the diagnosis node's notes block asserting that diagnosis_term was bound to "the broad NCIT laboratory-procedure term" and that "NCIT has no clinical-action concept for empiric clinical diagnosis as such". Both claims became false with the rebind, and the second was the original justification that the review had disproved by naming an already-cached alternative. Left unfixed, the note would have given a future curator a documented rationale for reverting the fix. No validator catches this class of defect. Rewritten to record that NCIT:C124351 was chosen precisely because the node's claim is diagnosis without laboratory confirmation, and to record the divergence from Rocky_Mountain_Spotted_Fever.yaml as deliberate.

    Round 2, suggestion - restored a process descriptor on the cell-penetrant node. Removing GO:0051701 in round 1 left the "Obligate Intracytosolic Niche (Cell-Penetrant Drug Requirement)" node with no biological_processes entry, while the module node it conforms to carries GO:0046677 response to antibiotic. Added GO:0046677, which both restores a descriptor and tightens conformance to intracellular_pathogen_persistence per the CLAUDE.md guidance that a conforming node should include the expected biological processes from the module. The term was already in the label cache and the enum membership cache.

    No evidence snippet text was altered in either round. Snippet count is unchanged at 58/58 throughout.

    Validation after the round 2 edits: just validate passed (schema, terms, references) with 58/58 snippets verified; just check-duplicate-keys OK; just check-title-snippets reported no new title-quoting snippets; the batched just validate-disorders CI gate passed with exit 0; and the targeted tests/test_data.py selection covering conforms_to node references, unique names, subtype foreign keys and environmental mechanism targets passed.

  summary: 'Create: MSMD due to complete IL12B deficiency'
  details: |
    Created the IL-12p40 (IL12B) etiology of Mendelian susceptibility to mycobacterial disease. Autosomal recessive, biallelic IL12B loss-of-function (hgnc:5970) abolishing the p40 subunit shared by IL-12 and IL-23. Pathophysiology curated as a causal chain: IL12B LOF -> absent IL-12/IL-23 production -> impaired IL-12-dependent IFN-gamma production -> failed IFN-gamma-dependent macrophage activation -> uncontrolled intramacrophage replication of weakly virulent mycobacteria and Salmonella, plus a separate IL-23/IL-17 arm to mucocutaneous candidiasis. Phenotypes: disseminated BCG disease, NTM infection, non-typhoidal salmonellosis, candidiasis, reduced IFN-gamma. Treatments: antimycobacterial chemotherapy, recombinant IFN-gamma (production-defect indication), BCG avoidance. Every evidence item is a real PMID with an exact-quote snippet, verified 32/32 by count-verified-snippets. Foundational refs verified by PubMed fetch: Altare 1998 J Clin Invest (PMID:9854038, first cytokine-gene defect), Prando 2013 Medicine (PMID:23429356, 49-patient cohort), plus PMID:29589181, PMID:34134458, PMID:38025345. GeneReviews search found no dedicated chapter. Validated with just validate, validate-terms, validate-disorders (all pass).

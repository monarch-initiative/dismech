    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #10576 (content completeness). Deep-research providers were unavailable in this environment (no API keys), so no research/ artifact was produced; the review's blocking gaps were closed instead by mining the committed full text of PMID:23429356 (Prando 2013). Added: incomplete penetrance to the inheritance block (penetrance INCOMPLETE, penetrance_percentage, 33.3%-asymptomatic-relatives and Kaplan-Meier 0.45-at-7mo/0.71-at-48mo evidence); a clinical_burden HIGH block with mortality evidence (28.6% global, 31.8% symptomatic, mean age at death 7.1 yr); an INFANTILE onset descriptor on the Disseminated BCG disease phenotype (mean 9 months). Also applied cheap cache-supported suggestions: Nocardiosis and Klebsiella infection phenotypes wired into the pathograph; ex vivo CD3+IL-17A+ readout on the IL-23/IL-17 node; IL-12 rescue evidence on the IFN-gamma node; a biochemical block for undetectable IL-12p40/IL-12p70; and an explicit HP:0033253 concept-fit note. Snippet count rose 32 to 44, all verified. Deferred (need new PMID or other files): animal_models, conforms_to granuloma_formation, grouping membership.

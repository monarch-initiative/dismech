  summary: 'Create: Leber Congenital Amaurosis 16'
  details: |
    New entry for LCA16 (MONDO:0013613, KCNJ13). Source report: research/Leber_Congenital_Amaurosis_16-deep-research-perplexity.md (Perplexity sonar-deep-research, default reasoning effort). Its reference validation resolved 23/23 identifiers and 3/3 quotes; preflight-dr returned WARN only because the heuristic gene lexicon counted the acronym RPE (retinal pigment epithelium) as a gene, and the report was read and confirmed to be about KCNJ13 and OMIM 614186. Papers not cited by the report were added from a PubMed search for KCNJ13 with retinal terms: PMID:25475713, PMID:31647904, PMID:35584325, PMID:40672310, PMID:25666713, PMID:18179896 and the GeneReviews LCA/EOSRD overview PMID:30285347. The pathograph runs from biallelic KCNJ13 loss of function through loss of RPE Kir7.1 conductance to impaired outer-segment phagocytosis, RPE oxidative stress and loss of photoreceptor support. The conflicting mouse (RPE survives) and human iPSC-RPE (RPE dies) results are both curated, the mouse result as REFUTE on the RPE death node. ClinGen's Definitive tier is for MONDO:0019118, not this disease, so no gene_disease_validity is recorded. Retinal neovascularization is left without an upstream mechanism because none is established. Validated with just validate, count-verified-snippets (68/68), validate-terms, check-genereviews (TAGGED) and check-causal-targets.

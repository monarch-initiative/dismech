  summary: 'Create: Immunodeficiency 120 (POLD1)'
  details: |
    De novo curation of IMD120 (POLD1, MONDO:0970994) from the 2020 Turkish-kindred report, the 2019 polymerase delta deficiency series, and a 2026 first-HSCT report. Deep research: one openscientist run (7 references, 7/7 resolved, 4/7 judged on topic; term_validation needs_review true, 1 invented CURIE HP:0410413 and 9 mis-named terms, among them HP:0002326 offered as Herpes simplex disease when HP calls it Transient ischemic attack, HP:0200042 as molluscum when HP calls it Skin ulcer, HP:0031521 as a clinical sign when HP calls it Vaginal clear cell adenocarcinoma, and HP:0005387 as decreased antibody level when HP calls it Combined immunodeficiency - none of those bindings were taken). The report's gene CURIE HGNC:9175 was checked against the ontology and is correct, unlike the LARS2 one in the sibling HLASA run. The substantive correction was attribution: the 2019 paper reports a POLD2 patient (P1) and a POLD1 patient (P2) together under one syndrome name, and the report attributes P1's molluscum contagiosum, skin abscesses and bronchiectasis-since-six-months to POLD1. None are curated here; every phenotype snippet is quoted so the patient it belongs to is identifiable. Four REFUTE evidence items carry counter-evidence in place: the younger sister's normal audiogram against hearing loss as a constant, her tetanus response normalising on boosting against the absent-vaccine-response phenotype, and the extended family's colorectal cancers segregating away from the mutant allele against the inference that this allele carries POLD1 cancer risk. Three discussions record the CD8/CD4 asymmetry, the conditioning-toxicity question where the clinical worry and the normal repair assay point different ways, and whether the syndromic features are developmental or post-infectious. One curator error caught by validation: NCIT:C593 was written from memory for immunoglobulin and is Recombinant Interleukin; the entry now uses the house binding NCIT:C62710 Immunoglobulin Therapy. Validation on the final tree: just validate, validate-terms, validate-disorders, count-verified-snippets 49/49, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-coarse-phenotypes, check-reference-titles, check-case-collisions, check-genereviews (NO_CHAPTER), list-disconnected-phenotypes 14/15.


    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED, one IMPORTANT finding, taken plus two of three
    suggestions). The finding was that the repair-normal claim - which framed the description,
    justified the presence: ABSENT diagnosis entry and was the premise of the conditioning-toxicity
    discussion - is P1 data. P1 is the POLD2 patient; the POLD1 patient was never exposed to a
    genotoxic compound in any published experiment. This is precisely the within-paper attribution
    hazard the entry's own notes warn about, committed on a claim the curator treated as background.
    The claim is retained because the shared-holoenzyme inference is the one the whole paper rests
    on, but it is now marked as extrapolated at all three places it is used, the evidence item quotes
    the sentence naming P1 so the patient is identifiable from the snippet, a second item quotes the
    experiment's design, and the conditioning discussion gained an evidence block plus an explicit
    statement that the alkylator-tolerance reassurance runs through a different gene's patient.
    Consumed the two references the review flagged as unused: PMID:31944473 bounds the allelic
    series quantitatively (a compound heterozygote retaining 30-40 percent polymerase activity with
    normal proofreading gets nonsyndromic hearing loss, no immunodeficiency, no cancer), and
    PMID:41263451 is recorded as a functional-variant database pointer with the caveat that it is
    scoped to cancer-fidelity variants. One curator error caught in the same round: the
    reference_title for PMID:31944473 was written to describe the paper rather than copied from the
    cache frontmatter, and the reference validator rejected it - the exact failure check-reference-
    titles exists for. Declined the animal_models suggestion: the mouse models in the research
    report's Section 15 are Pold1 proofreading-deficient mutator mice and knockouts, which model the
    cancer allele class and embryonic lethality rather than this hypomorphic immunodeficiency, and
    none is snippet-supportable from the cached references. Post-round validation:
    count-verified-snippets 54/54, all gates green.
  summary: 'Create: Multiple_Mitochondrial_Dysfunctions_Syndrome_2 (BOLA3, MONDO:0013675)'
  details: |
    Created MMDS2 as a per-gene Disease entry (stub entry_type decision: DISEASE), sibling to MMDS1 and MMDS5 in the same tranche; the stub's suggestion of merging MMDS1/MMDS2 into one entry with subtypes was declined for series uniformity, and the shared lipoate-deficiency chain is duplicated. Chain: biallelic BOLA3 loss, failure of the GLRX5-BOLA3 node, LIAS deficiency, combined 2-oxoacid dehydrogenase/GCS deficiency, complex I/II deficiency, attenuated mitochondrial translation, bioenergetic failure in brain and heart (cardiomyopathy as the distinguishing feature), and a pulmonary endothelial node conforming to pulmonary_vascular_remodeling grounded in the BOLA3 endothelial knockdown study. Sources: PMID:21944046, PMID:22562699, PMID:24334290, PMID:29501406, PMID:29654549, PMID:30302924, PMID:40273865, PMID:34063696, PMID:37511493, PMID:33693876, PMID:31486956, PMID:37823603, PMID:28803783, PMID:30759996, PMID:34440194. Snippets containing bracketed Fe-S notation were trimmed because bracketed spans are stripped before matching. The Edison/falcon deep-research run had not completed when the entry was written (provider retries; runs relaunched with fallback). Validation: just validate pass, just validate-terms pass, count-verified-snippets 64/64, check-causal-targets and check-entity-refs clean. No GeneReviews chapter exists for BOLA3-related MMDS.

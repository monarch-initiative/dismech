  summary: 'Create: Immunodeficiency Common Variable 4 (MONDO:0013284, TNFRSF13C)'
  details: |
    New disorder entry for CVID4, BAFF-receptor (TNFRSF13C) deficiency.

    Lump/split decision. Curated as its own kb/disorders entry rather than as a has_subtypes entry on Common_Variable_Immunodeficiency. Two reasons. The parent entry carries BAFF-R only as a genetic entry and has no has_subtypes block at all, so there was no existing subtype structure to extend. More substantively, the pathograph is not the parent's: generic CVID is a failure of the late steps, class-switch recombination and plasma-cell differentiation, whereas this is a survival failure at the transitional-to-mature checkpoint, upstream of all of that. The immunoglobulin pattern shows the difference - BAFF-R-deficient siblings had normal IgA, which most CVID patients do not. The KB already holds several single-gene inborn-error-of-immunity entries at this granularity, including CTLA4_Haploinsufficiency, TRAF3_Haploinsufficiency and SOCS1_Haploinsufficiency.

    Curation inputs. One Perplexity deep-research run, committed alongside, plus independent PubMed E-utilities searching. The report contributed framing only. Its reference_validation block reported 7 of 7 citations resolving but only 4 of 7 assessed as on topic. Its term_validation block reported 8 of 35 checked labels mismatched, including MONDO:0011107 offered as common variable immunodeficiency when MONDO calls that identifier congenital hypotrichosis with juvenile macular dystrophy. No CURIE was taken from the report.

    GeneReviews baseline. A PubMed search for TNFRSF13C GeneReviews returned no results, so Step 3b does not apply.

    Structure. Six pathophysiology nodes: biallelic TNFRSF13C loss of function, loss of BAFF-induced non-canonical NF-kB signalling, developmental arrest at the transitional B cell stage, impaired antibody production, and recurrent sinopulmonary infection. The sixth is a deliberate contrast node, BAFF-driven B cell hyperplasia, which is the opposite-direction pathology on the same axis in receptor-sufficient CVID patients with interstitial lung disease. It is retained with its role marked as modifier and its description saying plainly that this pathology cannot occur in a BAFF-R-null patient, because a keyword search for this gene returns that literature repeatedly and it should not be misread as evidence about CVID4.

    The signalling node is placed at non-canonical NF-kB specifically rather than at the vaguer B cell survival, because the NEMO-independence is what explains why BAFF-R deficiency does not produce the broad inflammatory phenotype of canonical NF-kB defects.

    The genetic entry separates the two variant classes the literature conflates. Null alleles cause the disease; the six functionally characterised missense variants are modifiers, only P21R correlates positively with CVID in association study, and P21R is present in healthy individuals. Three evidence items carry that distinction, two of them graded PARTIAL because they qualify rather than support a causal claim.

    Two discussions. A KNOWLEDGE_GAP on incomplete clinical penetrance: both homozygous siblings had the full immunological phenotype and failed the pneumococcal polysaccharide response, but only one developed recurrent infections, and the defining paper says outright that the deletion does not necessarily lead to a clinically manifest immunodeficiency. A HUMAN_MODEL_MISMATCH on the lupus-like syndrome of BAFF-R-mutant A/WySnJ mice, which is genetically linked to the Baffr allele by a congenic control and has no human counterpart reported - recorded with the caveat that with two patients and no reported autoimmune serology, absence of evidence is doing all the work.

    Validation. Schema validation passes; 28 of 28 evidence snippets verified against cached primary references; term validation, duplicate-key and entity-ref checks pass.

    Two fixes made during validation, both recorded because they are generalisable. The term validator rejected HP:0002850 with the label OLS search returned, Decreased circulating IgM concentration; the authority's canonical label is Decreased circulating total IgM, and OLS search results are therefore not a safe source of the label field even when the CURIE is right. And one snippet failed because the sentence begins The patient had rather than He had; the paraphrase was mine, and it was fixed by quoting the source rather than by loosening the claim.

    One quoted snippet in the loss-of-function node contains words run together - theTNFRSF13Cgene - because the cached source has the gene symbol in italic markup that the cache strips. It is reproduced exactly as cached, and a note on the entry says so, since a snippet must be an exact substring.

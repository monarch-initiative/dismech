  summary: 'Review round 1: address ai4c-reviewer items on PR 10025'
  details: |
    Addressed all five IMPORTANT items and three of four suggestions from the automated review of PR 10025. The reviewer's closing observation was the useful one: PMID:19666484 is cached as full text rather than as an abstract, and it answers findings 2, 3 and 4 directly. I had curated from the abstract without checking what else the cache held, which is the generalisable mistake in this round.

    Item 1, wrong GO term. Removed GO:0033209 tumor necrosis factor-mediated signaling pathway from the signalling node. The reviewer is right and the error is instructive: BAFF-R is a member of the TNF receptor superfamily, which is a structural classification, but its ligand is BAFF (TNFSF13B), not TNF, and GO defines that term by the ligand. GO:0038061 non-canonical NF-kappaB signal transduction already carried the claim precisely, so the term was dropped rather than swapped for another approximation.

    Item 2, missing diagnostic triad. Added three phenotypes, each VERY_FREQUENT and each with a measured quote from the cached full text: B lymphopenia (HP:0010976), increased transitional B cell proportion (HP:0030381), and decreased marginal zone B cell proportion (HP:0030384). The marginal-zone one supplies the mechanistic link the entry previously only asserted in prose - that the absent T-independent response follows from the lost MZ compartment.

    Item 3, onset. Removed the Late Adult Onset phenotype, which was bound to HP:0002718 Recurrent bacterial infections - not an onset claim at all - and duplicated the sinopulmonary infection phenotype. Onset is now an onset descriptor on that phenotype's phenotype_term. Bound to ADULT with min_age_years 37, not to LATE: the earliest documented onset in a null-allele patient is his first pneumonia at 37, and although diagnosis came at 57 and the paper calls this the first immunodeficiency diagnosed primarily in the second half of life, that sentence is about diagnosis rather than onset. Both quotes are recorded, with the distinction stated in the descriptor notes. The P21R patient's onset at 23 is deliberately no longer used to set the value.

    Item 4, prevalence. The note denied an estimate the cited paper gives. Now recorded as 1 in 3,000,000 to 1 in 6,000,000, prevalence_class BELOW_1_IN_1000000, rate_per_100000 0.025 with a 0.0167-0.0333 range, the screening denominator of 138 CVID patients captured, and the authors' own caveat quoted as a PARTIAL evidence item - they say in the same sentence that the true population figure is probably higher, because a BAFF-R-deficient person who never came to immunological attention is invisible to a CVID-cohort screen.

    Item 5, contrast node in the mechanism graph. The BAFF-Driven B Cell Hyperplasia node has been moved out of pathophysiology into a discussions entry. The reviewer's argument is correct and worth recording: pathophysiology is what gets exported as this disease's mechanism graph, so a node saying in its own description that the mechanism cannot occur in a BAFF-R-null patient was, to a graph consumer, an assertion that it does - the exact misreading the node existed to prevent. role and mechanism_confidence do not carry a negation across an export boundary.

    Suggestions taken. The class-switched memory B cell phenotype now carries a second, SUPPORT-graded evidence item measuring it in both null-allele patients, so it stands on the causal genotype rather than on the modifier variant; the P21R item is kept for the normal-total-count dissociation. The autoimmunity HUMAN_MODEL_MISMATCH now carries a citable negative rather than resting on absence of evidence, graded REFUTE. The incomplete-penetrance discussion now records the original authors' own modifier search - BTK sequencing and CD40L expression both normal in the discordant sibling pair - which excludes the two obvious X-linked candidates without closing the question.

    One suggestion not taken, because the premise is wrong. The reviewer identified PMID:15316526 as the primary P21R association source, titled Mutational Analysis of Human BAFF Receptor TNFRSF13C in Patients with Common Variable Immunodeficiency. The cached record for that PMID is Granulomatous-lymphocytic lung disease shortens survival in common variable immunodeficiency, a retrospective analysis of 69 CVID patients with no BAFF-R content. It is in the cache because the deep-research report's citation list resolved it, not because I fetched it. Citing it as a P21R source would have introduced exactly the kind of wrong-paper attribution the review process exists to catch.

    The fourth suggestion, antibiotic prophylaxis, is not taken for the reason the reviewer gives - it is generic CVID management and belongs on the parent entry.

    Validation after changes. Schema validation passes; 39 of 39 evidence snippets verified, up from 28; term validation, entity-ref and duplicate-key checks pass.

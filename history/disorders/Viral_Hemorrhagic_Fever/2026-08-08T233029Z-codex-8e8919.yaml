  summary: 'Review: Viral Hemorrhagic Fever'
  details: |
    Performed a full evidence, ontology, and causal-graph review of this
    heterogeneous VHF umbrella entry. Reframed cross-VHF claims as recurring
    rather than universal; decomposed vascular leak and parallel hemostatic
    routes; removed unsupported immune-cell, interferon, and
    coagulopathy-to-shock assertions; split nausea from vomiting; added
    evidence-backed capillary-leak and coagulopathy phenotypes; separated
    established agent-specific laboratory testing from investigational CRISPR
    point-of-care assays; and restricted ribavirin, Ebola monoclonal
    antibodies, and vaccination claims to the relevant agents. Added an
    infectious-disease classification and two open, source-backed discussions
    covering shared-versus-agent-specific bleeding mechanisms and human
    vascular-model fidelity.

    No umbrella prevalence estimate was added, and a D2P audit was not
    bulk-imported because its 370 Orphanet phenotypes aggregate heterogeneous
    agent-specific manifestations. The matching Falcon artifact was used only
    as a discovery lead; retained claims were checked against tool-generated
    caches.

    Validation at review time: schema passed; causal graph passed with 29 nodes
    and 15 edges; all 15 causal edges carry edge-level evidence; all discussion
    anchors resolved; 2 of 2 dataset accessions resolved; reference validation
    and the offline snippet audit verified all 62 of 62 snippets. Phenotype
    connectivity is 6 of 16; nonspecific symptoms remain deliberately unwired
    where the reviewed evidence did not support a common cross-VHF mechanism.

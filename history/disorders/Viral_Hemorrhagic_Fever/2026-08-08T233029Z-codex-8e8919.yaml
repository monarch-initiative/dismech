  summary: 'Review: Viral Hemorrhagic Fever'
  details: |
    Performed a full evidence, ontology, and causal-graph review of this
    heterogeneous VHF umbrella entry. Reframed cross-VHF claims as recurring
    rather than universal; decomposed vascular permeability, coagulation-factor,
    consumptive-coagulopathy, platelet-number, and platelet-function mechanisms;
    removed unsupported immune-cell, interferon, and coagulopathy-to-shock
    assertions; split nausea from vomiting; added evidence-backed
    capillary-leak and coagulopathy phenotypes; separated established
    agent-specific laboratory testing from investigational CRISPR point-of-care
    assays; and restricted ribavirin, Ebola monoclonal antibodies, and
    vaccination claims to the relevant agents. Added an infectious-disease
    classification and two open, source-backed discussions covering
    shared-versus-agent-specific bleeding mechanisms and human vascular-model
    fidelity.

    A follow-up independent audit removed the association-only antiviral immune
    failure-to-high viremia and generic organ dysfunction-to-acute kidney injury
    edges, removed directionally unsupported hemostatic-umbrella parent edges,
    and eliminated the bundled shock-and-organ-dysfunction node. It also
    atomized the permeability and platelet mechanisms, qualified Ebola-only
    vomiting and diarrhea evidence and Crimean-Congo-only nausea, petechiae, and
    epistaxis evidence, normalized narrative-review evidence-source labels, and
    added a scoped preventive intervention for isolation, contact tracing, and
    PPE-based infection control without prescribing an operational protocol.

    A subsequent exact-head review identified antiviral immune failure and high
    viremia as fully floating nodes after their association-only edge was
    removed. Because the cached evidence did not support reconnecting them with
    a causal assertion, both standalone nodes were removed rather than adding a
    speculative edge. The remaining narrative-review evidence-source outlier
    was normalized to OTHER at the same time.

    No umbrella prevalence estimate was added, and a D2P audit was not
    bulk-imported because its 370 Orphanet phenotypes aggregate heterogeneous
    agent-specific manifestations. The matching Falcon artifact was used only
    as a discovery lead; retained claims were checked against tool-generated
    caches.

    Validation at review time: schema passed; causal graph passed with 27 nodes
    and 10 edges; all 10 causal edges carry edge-level evidence; all discussion
    anchors resolved; 2 of 2 dataset accessions resolved; reference validation
    and the offline snippet audit verified all 58 of 58 snippets. Phenotype
    connectivity is 5 of 16; nonspecific symptoms and acute kidney injury remain
    deliberately unwired where the reviewed evidence did not support a common
    cross-VHF mechanism.

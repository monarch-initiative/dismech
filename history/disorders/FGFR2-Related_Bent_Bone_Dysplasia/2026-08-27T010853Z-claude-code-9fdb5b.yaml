  summary: Rename to Bent Bone Dysplasia Syndrome 1; add BBDS2 differential and ISDS
    row detail
  details: |
    Renamed the entry from "Bent Bone Dysplasia Syndrome" to "Bent Bone Dysplasia Syndrome 1". With BBDS2 (LAMA5) now curated, the bare name read like a parent concept covering both; the numbered form also matches the entry's own disease_term label, MONDO:0013815 bent bone dysplasia syndrome 1. The old name is retained as a synonym and BBDS1 added. The FILENAME IS DELIBERATELY UNCHANGED so that this entry's existing history records, its page URL, and the path reference from kb/groupings/FGFR_Related_Skeletal_Dysplasias.yaml all keep resolving; the rename is to the display name only, and is recorded in the entry's notes.

    ISDS note rewritten to carry the group-20 entry number (NOS 20-0050) and the exact 2023 row wording, and to quote the committee's own footnote that bent bones is an unspecific sign - which makes explicit that group 20 records a radiographic finding, not a shared mechanism. No change to the classification value.

    Added a differential_diagnoses entry for BBDS2 (MONDO:0859573). The entry's notes already flagged PMID:33242826 as describing a distinct disorder and a differential; that paragraph now points at the curated entry.

    Added harrisons_chapter GENETICS_ENVIRONMENT_DISEASE, which the entry lacked.

    Part of a completeness and consistency pass over ISDS 2023 nosology group 20 (Bent bones dysplasia group). After this pass all six 2023 rows are curated and classified, plus the post-revision CCN2 entity.

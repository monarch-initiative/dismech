  summary: Cite UV photo-provocation; withdraw the waiver
  details: |
    Withdrew the 'Left deliberately uncited.' waiver on the Ultraviolet Exposure entry and cited PMID:6531279 instead. The waiver asserted that no quotable source existed; that was wrong. PMID:6531279 is a photo-provocation study in pemphigus erythematosus specifically, not foliaceus, with a retrievable abstract, and it surfaces on a one-line PubMed title query. Review of PR #9751 found it. The evidence is stronger than the entry's previous hedge: ultraviolet light applied to normal-appearing skin reproduced the clinical and histological changes typical of the disease, with an action spectrum in the UVB range, so the description and effect were rewritten from 'plausible exacerbating factor' to the induction the source reports. A second evidence item cites the action spectrum, which is what makes the ECTO ultraviolet binding specific rather than nominal.

  summary: 'Create: Charcot-Marie-Tooth Disease Type 4C (MONDO:0011113, SH3TC2)'
  details: |
    New standalone Disease entry for CMT4C, the most common recessive demyelinating CMT. Curated from primary literature (gene discovery PMID:14574644; SH3TC2-Rab11 recycling-endosome mechanism PMID:20028792 and PMID:20826437; NRG1/ErbB2 trafficking PMID:23553667; Sh3tc2 knockout mouse PMID:19805030; natural history PMID:36947133 and PMID:40745932; Norwegian minimum prevalence PMID:30001926; cerebellar phenotype PMID:31346473; gene-replacement and NT-3 preclinical therapy PMID:30907403, PMID:37641403, PMID:39544702) with a falcon deep-research report used as a lead source only. preflight-dr PASS (SH3TC2 51 mentions, next gene PMID-level noise). Entry-type decision recorded in notes: standalone rather than a has_subtypes entry on Charcot-Marie-Tooth Disease Type 4, following the merged Charcot-Marie-Tooth Disease Type 4K precedent; the umbrella was not modified and the open entry_type SUBTYPE policy question from PR #9696 is explicitly not treated as settled. All phenotype frequency bands derived from the 103-patient cohort; the scoliosis disagreement between cohorts (73 vs 81 percent) is curated rather than averaged. The two published mouse lines were found to be one line (JAX 033933) and merged into a single animal_models entry carrying both RECAPITULATES and RESCUES links. Validation: linkml-validate clean, 70/70 snippets verified, term validation clean, entity refs and duplicate keys clean.

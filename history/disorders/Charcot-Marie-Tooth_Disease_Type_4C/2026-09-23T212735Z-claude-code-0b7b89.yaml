  summary: Wire three stranded phenotypes; rename spinal node
  details: |
    Answered the CHANGES_REQUESTED review on 46f0694. Added downstream edges so three ISOLATED phenotypes join the pathograph: Nerve Conduction Slowing and Conduction Block -> Demyelinating Peripheral Neuropathy (the OBLIGATE defining phenotype), and Progressive Demyelinating Sensorimotor Neuropathy -> Impaired Pain Sensation and -> Sensory Ataxia. Phenotype connectivity went from 9/14 to 12/14. Genitourinary Involvement is deliberately left unconnected: PMID:40745932 states the pathophysiology of CMT-related genitourinary disorders is unclear, so that sentence was added as evidence and the description no longer calls the feature autonomic. Cerebellar Signs stays unconnected (one patient, no proposed mechanism). Renamed the node Paraspinal Muscle Weakness and Spinal Deformity to Early-Onset Spinal Deformity, because its evidence supports only the deformity; the trunk-weakness route stays in the incoming edge description and the cmt4c_scoliosis_mechanism knowledge gap, and all three references to the node were updated. Rewrote the prevalence paragraph in notes to drop repository-tooling detail. For the record, that detail was: just refresh-orphadata aborted on a drifted sha256 against data/orphadata/MANIFEST.yaml, fetch-reference does not support the ORPHA prefix, and no ORPHA cache file for CMT4C exists on main as of 2026-09-23. Checked NCT01193075 on ClinicalTrials.gov: still RECRUITING (last update 2025-10-07), so status was left as is. Validated with just validate-disorders (74/74 snippets), check-causal-targets, check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-snippet-grading and check-reference-titles, all exit 0.

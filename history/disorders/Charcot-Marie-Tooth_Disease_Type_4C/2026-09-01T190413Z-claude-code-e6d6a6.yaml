  summary: 'Review fixes: connect the cranial nerve node, add walking difficulty,
    add the INC natural history trial'
  details: |
    Acts on the ai4c-reviewer CHANGES_REQUESTED on PR #10406/#10408. Cranial Nerve Involvement was orphaned with zero incoming edges while its own description claimed an unknown-intermediates edge from the genotype existed; that edge is now present, typed INDIRECT_UNKNOWN_INTERMEDIATES from Biallelic SH3TC2 Loss of Function. Added a Walking Difficulty and Loss of Ambulation phenotype at 94% VERY_FREQUENT, bound to HP:0001288 Gait disturbance rather than HP:0002355, which is obsolete and replaced by it, with the age-stratified ambulation figures as a second evidence item and a downstream edge from the neuropathy node. Added a clinical_trials block with NCT01193075, the Inherited Neuropathy Consortium natural history study whose registration record names CMT4C explicitly and which is the source of PMID:36947133. NCT05902351 was deliberately not curated and the reason is recorded in notes: its record is about CMT generally with no mention of CMT4C or SH3TC2, so curating it would be relevance by adjacency, and its status and phase would have to be asserted from outside the cached record.

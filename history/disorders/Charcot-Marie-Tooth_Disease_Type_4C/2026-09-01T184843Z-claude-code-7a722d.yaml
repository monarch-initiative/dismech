  summary: 'Fix: drop phenotypes# prefix from bare-name pathograph targets'
  details: |
    CI step 'Check pathograph targets resolve' (scripts/check_causal_targets.py, issue #10112) failed on nine targets. downstream[].target and treatments.target_mechanisms[].target do not use the <kind>#<name> entity-reference grammar; dismech.graph matches them verbatim against another item's name, so a prefixed target is silently unresolved and renders as a phantom duplicate node. The prefix was dropped from all nine. This gate is not among the ones listed in CLAUDE.md's pre-PR set and is not reachable through just validate-disorders; just check-causal-targets is the local equivalent.

  details: |
    Created the CMD1M (CSRP3, MONDO:0011840) entry from the skeleton for claim issue 13735. Deep research: claude_code provider (falcon fallback; falcon not configured), report validated 14/14 references. Pathograph: heterozygous CSRP3 missense variant -> loss of MLP telethonin/alpha-actinin-2 binding and reduced MLP abundance -> defective stretch sensing, impaired Z-disc calcineurin-NFAT signalling, disrupted cytoarchitecture, and a HYPOTHETICAL SR calcium-cycling defect -> LV dilation/systolic dysfunction -> heart failure. Downstream steps rest mainly on mouse and cell data, marked by evidence_source and mechanism_confidence. Human evidence: PMID:12507422 (W4R), PMID:14567970 (K69R DCM+EFE; W4R non-segregating), PMID:19412328 (1/313 probands), PMID:36166435 (Thai cohort), PMID:27532257 (no CSRP3 excess in 945 DCM cases). Models: PMID:9039266 (Mlp-/-), PMID:15665106 (MLP+/- after MI), PMID:10555147 and PMID:21484537 (PLN rescue), PMID:20044516 (W4R knock-in, HCM). Gene validity: ClinGen Limited AD for MONDO:0011840, CGGV:assertion_beaafc90-...-2026-03-04, cached with clingen-rebuild --csv-only; the same assertion is the CSRP3 DCM row in the committed kb/genes/ingest/clingen_gene_validity.tsv on origin/main, so the ClinGen manifest was not repinned. relationship_type left unset. check-genereviews --online: GeneReviews TAGGED (PMID:20301486), StatPearls NO_CHAPTER. Validation: just validate clean, 83/83 snippets verified, entity refs, causal targets, enum values, duplicate keys and gene-activity grounding all OK; 2/3 phenotypes connected (EFE left unconnected, no source gives a mechanism). Red-team review fixes: re-sourced the older umbrella-term ClinGen record (2025-05-30, No Known Disease Relationship) to the committed cache/clingen/gene_validity.csv and the current record to the committed ingest TSV; Trachoo count corrected to one subject (E191K, het, VUS) from Table 1; G72R named from PMID:19412328 full text; W4R non-segregation REFUTE scoped to the W4R allele (INDIRECT); the Walsh burden row in prevalence changed to SUPPORT with 'no detectable excess (OR 1.10; a modest effect is not excluded)' wording throughout; evidence added to the LV dilation -> DCM and heart failure -> CHF edges; W4R review parenthetical marked INDIRECT; knock-in stretch-sensing evidence added; calcineurin and cytoarchitecture nodes lowered to HYPOTHETICAL; mismatch discussion gained the hypertrophy-then-dilation review sentence; parent Dilated_Cardiomyopathy CSRP3 note updated (separate history record). After fixes: 89/89 snippets verified, all gates OK.

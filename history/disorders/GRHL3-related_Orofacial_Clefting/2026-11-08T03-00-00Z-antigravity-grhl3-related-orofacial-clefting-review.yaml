  summary: Enriched GRHL3-related Orofacial Clefting with top-level description, Harrison's classification, peridermal/palatal ontology groundings, diagnostic details, and surgical treatment targets.
  details: >-
    Added top-level disorder description and Harrison's chapter classification
    (GENETICS_ENVIRONMENT_DISEASE) backed by PMID:24360809. Grounded the four
    pathophysiology nodes with CL cell types (peridermal cell, epithelial cell),
    embryonic UBERON location (secondary palate), molecular function
    (DNA-binding transcription factor activity on the GRHL3 node), and causal
    downstream edge descriptions. Added VERY_FREQUENT frequency on Cleft palate
    and diagnostic flags on Cleft palate and Lower lip pit, completed diagnosis
    presence and results, and linked multidisciplinary cleft surgical repair to
    Cleft palate (PMID:34459660).

  summary: 'Create: GRHL3-related Orofacial Clefting'
  details: |
    Created GRHL3-related orofacial clefting (MONDO:0100579) as a single kb/disorders Disease (entry_type DISEASE), confirmed against issue #15690 and the Disease Groupings rule: dominant GRHL3 variants cause both syndromic Van der Woude syndrome type 2 (orofacial cleft + lower lip pits) and the more common nonsyndromic cleft palate only, sharing one conserved periderm/epithelial-differentiation pathograph. Modelled the mechanistic chain GRHL3 loss of function (dominant-negative/LOF transcription factor) -> oral periderm dysfunction -> pathological inter-epithelial adhesion -> failure of secondary palatal shelf fusion -> cleft palate (and cleft lip in the VWS spectrum). Two has_subtypes rows (VWS Type 2 bound MONDO:0011712; Nonsyndromic Cleft Palate bound MONDO:0007336). Deep research: requested provider falcon (Edison) was unavailable environment-wide (403 auth failure); --fallback routed to openscientist but that provider's queue was badly backed up and stalled, so per coordinator steering the required DR run used the claude_code provider (research/GRHL3-related_Orofacial_Clefting-deep-research-claude_code.md; 6/6 references verified, 5/5 terms resolved, preflight-dr PASS with GRHL3 mentioned 38 times, no Named Entity Confusion). Evidence is drawn from primary literature fetched directly: PMID:24360809 (Peyrard-Janvid 2014, original GRHL3-VWS paper; human families + zebrafish periderm + Grhl3-null mouse cleft palate), PMID:27018475 (common p.Thr454Met susceptibility variant and rare truncating variants specific to nonsyndromic cleft palate, ~5% of VWS), PMID:28803895 (periderm life-cycle review), PMID:34459660 (South African cohort, incomplete penetrance, p.Thr454Met etiologic for nsCP). Validated with just validate, just validate-terms, just count-verified-snippets (16/16), just validate-disorders, and the offline QC gates (duplicate-keys, enum-values, entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, snippet-grading, snippet-length, shared-disease-terms, gene-activity-grounding in ref mode). Lower lip pit phenotype left causally unconnected in the pathograph (no citable upstream node for lip-sulcus persistence); honest gap, report-only metric.

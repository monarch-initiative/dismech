  summary: Link radiation, ultraviolet and chemical exposures to their own nodes
  details: |
    Backfill for issue #8085. This entry already models radiation-associated DNA damage and ultraviolet-associated hypermutation as separate nodes, so prior radiotherapy and ultraviolet exposure are TRIGGERS/DIRECT into their respective nodes rather than sharing one. The ultraviolet link is unusually well evidenced for an environmental association because the support is mutational rather than epidemiological: head and neck tumours carry a dominant ultraviolet damage signature. Chronic lymphedema is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the malignant endothelial proliferation node, the classical Stewart-Treves setting, and is deliberately graded weaker because unlike radiation and ultraviolet it supplies no identified genotoxic insult. Chemical carcinogen exposure is TRIGGERS into the same node, noting that vinyl chloride and thorium dioxide are associated with hepatic angiosarcoma specifically. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 76 of 76 verified; integrity issue count unchanged.

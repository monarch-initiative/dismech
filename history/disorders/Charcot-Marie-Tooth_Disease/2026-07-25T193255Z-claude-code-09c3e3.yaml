  details: |
    Manual claim-evidence review of the CMT disorder entries. Corrected the GJB1/CMTX1 genetic note, which stated 'X-linked recessive (CMTX1)' - factually wrong and inconsistent with the sibling Charcot-Marie-Tooth Disease Type 1 entry and the project's cited source PMID:30881289 ('CMTX1, the X-linked dominant form of CMT'). CMTX1 is X-linked dominant/semidominant: heterozygous carrier females are commonly symptomatic. All evidence snippets in this entry were verified as exact substrings of their cached references.

  summary: Manual evidence review of the CMT umbrella entry; no claim errors found
  details: |
    Manual, no-scripting review of the CMT umbrella classification entry as part
    of a CMT-family review. Verified every evidence snippet is an exact substring
    of its cached source and supports its attached claim. The heavily reused Brain
    2024 cohort figures (DOI:10.1093/brain/awae064) all match: CMT1 41.0%, CMT2
    19.4%, GJB1/CMTX1 13.0% of solved, PMP22-duplication CMT1A 43.3%, PMP22-deletion
    HNPP 6.2% of solved (HNPP 4.8% of the whole cohort is also stated verbatim in
    the abstract). The AAV9-MFN2 gene-therapy citation (PMID:42301793) was
    scrutinised because of its unusually high PMID; it is a genuine 2026 PNAS paper
    (DOI:10.1073/pnas.2530774123) and its snippet is exact — not a hallucination.
    PXT3003 (DOI:10.3390/genes14071391) and the mechanistic-hypothesis seed
    citation also verify.

    No fixes were required in this entry. Follow-up gaps recorded as GitHub issues:
    the "~1 in 2,500" prevalence is prose-only with no structured Prevalence record
    or citation, and the deprecated updated_date field is still present (grandfathered).
    Validation of the family was run on the one file that changed (CMT2); this
    umbrella entry was left byte-for-byte unchanged.

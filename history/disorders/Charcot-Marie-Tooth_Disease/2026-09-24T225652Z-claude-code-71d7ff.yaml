  summary: Record where gene-defined CMT subtypes are curated, and tag the GeneReviews
    overview
  details: |
    Issue #12240 named this umbrella entry as the parent for ten gene-defined
    numbered CMT subtypes. They were curated on the two mechanism compartment
    entries instead, because this entry carries no pathophysiology section of its own
    and its has_subtypes rows are compartments (CMT1, CMT2, CMTX, CMT4, HNPP) rather
    than gene-defined subtypes. FBLN5 and ITPR3 went to Charcot-Marie-Tooth Disease
    Type 1; CADM3, JAG1, SLC12A6, ARHGAP19, DARS2, COX18 and the two MFN2 variants
    went to Charcot-Marie-Tooth Disease Type 2. The only change here is a sentence in
    the description recording that ruling, so a later curator does not add a parallel
    flat gene list to the umbrella.

    The GeneReviews Charcot-Marie-Tooth Hereditary Neuropathy Overview (PMID:20301532)
    was already tagged in the references block; no reference changes were needed.

    The entry's own disease_term binding was checked first, as the issue asks:
    MONDO:0015626 resolves in OLS as "Charcot-Marie-Tooth disease", the genuine CMT
    umbrella class, so the gap list is not an artefact of an over-broad anchor.

  summary: Add SCO2 genetic record with ClinGen Moderate (AR) tier
  details: |
    Requested by the complex IV gene-family review. Added a SCO2 genetic record typed UNKNOWN, germline, autosomal recessive (HP:0000007). ClinGen classifies SCO2 against Charcot-Marie-Tooth disease (MONDO:0015626), which is this entry's own disease_term, as Moderate for AR inheritance (CGGV:assertion_8c1cc0ca-0471-496b-941f-4c7a0ae854ae-2026-04-10T160000.000Z, fetched and quoted); Moderate is below the Definitive or Strong level CAUSATIVE requires, so the tier is recorded in gene_disease_validity and the record is UNKNOWN. Primary evidence: compound heterozygous SCO2 variants in two unrelated patients with early-onset axonal CMT and reduced SCO2, copper and COX in fibroblasts (PMID:29351582), and a homozygous variant in two brothers with axonal motor neuropathy (PMID:35112411). No subtype was set: ClinGen files the assertion against the umbrella term, and the primary report describes the neuropathy as both axonal CMT and CMT type 4.

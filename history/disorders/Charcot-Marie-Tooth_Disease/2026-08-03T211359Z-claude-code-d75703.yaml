  summary: Reconcile canonical PMP22/MPZ hypothesis notes with independent OpenScientist
    assessment (#7405)
  details: |
    Rewrote the canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model hypothesis's notes field to replace six copied, overreaching report-level claims with source-, model-, subtype-, and species-scoped statements per issue #7405's independent reconciliation of the 2026 openscientist deep-research report (sidecar assessment merged in PR #7406). Corrected: (1) blended '43-60%' PMP22-duplication frequency range now split into the correct diagnosed-case denominators (505/1165=43.3%, 505/1515=33.3%, PMID:38481354) versus the non-comparable background ~60% figure (PMID:31852984); (2) absolute 'DYSMYELINATING NOT demyelinating' claim softened to a coexisting developmental component (PMID:19923170, PMID:21487305); (3)-(4) structural-organizer/UPR/SARM1 claims scoped to their actual source models (CMT1A+HNPP mice PMID:41400104; C3-PMP22/MpzR98C mice PMID:35501630; one Mfn2-H361Y rat PMID:36287202) instead of generalized across CMT; (5) macrophage-CSF1 neuroinflammation scoped to CMT1B/CMT1X models (PMID:16775375, PMID:26865613) and the terminal-complement-inhibition item (PMID:36926597) corrected from a listed 'failed human trial' to what it actually is, a mouse experiment; (6) cholesterol-supplementation rescue corrected to its actual direction (PMP22-deficient/loss-of-function mice, PMID:32511821), which does not support a CMT1A (gain-of-function/duplication) supplementation trial; and the human proof-of-concept gap reframed to note real preclinical human-cell (iPSC-organoid/iPS-Schwann-cell) rescue data (PMID:36511878, PMID:38017287) rather than stating the entire human dosage axis is unvalidated. Two of the issue's eight items (KIF1B attribution; the '128-paper/36-finding' provider-provenance claim) were confirmed to concern only the provider report/assessment sidecar, not any current assertion in this disease YAML, so no change was needed for those two. Added 12 new evidence items (one per newly-cited PMID) with exact-quote snippets verified against freshly fetched references_cache/*.md abstracts, each with an evidence_source classification (HUMAN_CLINICAL/MODEL_ORGANISM/IN_VITRO) and an explanation tying it to the specific scoped claim. status: CANONICAL is unchanged -- this is a scoping correction, not a verdict change. Validated with just validate (schema + term + reference, 14/14 new-PMID snippets verified) and a targeted pytest -k 'Charcot or hypothesis or evidence' run (3822 passed).

  summary: 'Integrate assessed OpenScientist findings: PMP22-lowering therapies, ascorbic-acid
    failure, biomarkers'
  details: |
    Reconciliation of the openscientist report for hypothesis canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model against the existing codex assessment sidecar (verdict SUPPORTED). No second assessment was written. Worked only from the assessment's RETAINED and QUALIFIED claims; every snippet was re-derived from references_cache after 'just fetch-reference', never copied from the report.

    Added: (1) five evidence items on the mechanistic_hypotheses entry - PMID:26450076 and PMID:21393063 for the five negative human ascorbic-acid trials, which the notes previously asserted uncited; PMID:25216747 for the Schwann-cell c-Jun repair programme that opposes distal axon loss in the C3-PMP22 model; PMID:28796392 for faster CMTPedS progression in CMT2A than CMT1A children, both qualifying the final-common-pathway framing; PMID:38743588 extending the PMP22 cholesterol branch into the duplication direction in patient-derived iPSC Schwann cell precursors. (2) Two evidence items on treatments#PXT3003 for the PLEO-CMT phase III result and the formulation/missing-data caveat (PMID:34656144); the treatment previously cited only a review. (3) Two new treatments carrying the RETAINED preclinical PMP22-lowering claim: a PMP22-lowering antisense oligonucleotide with aso_details (RNASE_H_KNOCKDOWN, hgnc:9118, CONSTRAINED_ETHYL, all sourced from PMID:29202483 including its RNase H and cEt-gapmer text) and AAV9-miR871 gene therapy (PMID:41948127). (4) A biochemical block for plasma NfL (NCIT:C88043, already in the term cache) and plasma GFAP (deliberately unbound - no NCIT GFAP biomarker term is cached), from PMID:39882365. (5) Two KNOWLEDGE_GAP discussions: human proof of concept for direct PMP22 lowering, with a first-in-human dose-escalation experiment, and biomarker responsiveness to an effective therapy (PMID:39957630). (6) A notes paragraph on the hypothesis entry recording what each addition does and does not establish.

    Deliberately not integrated: the KIF1B downgrade (already curated with the ClinGen expert-panel assertion; the report's pedigree-level PMIDs would not change the entry); the Schwann-cell lactate-shuttle bridge, which the assessment scoped as general PNS plausibility with no CMT test; the oligogenic inheritance model, which the assessment found unproven from its two sources; and the ascorbate pharmacokinetic explanation (PMID:23525455), which argues rather than tests its case - the reason is recorded in the notes instead. Mechanism nodes proposed by the report (cholesterol trafficking edge, adherens-junction disorganization, SARM1 chain, macrophage-CSF1) were not added because this is the umbrella classification entry, which carries no pathophysiology section by design; they belong in the CMT type 1 and type 2 compartment entries.

    Validation: linkml-validate Disease clean; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens all OK; count-verified-snippets 32/40 with 8 skipped by prefix and no failures.

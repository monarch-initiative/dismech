  summary: 'Review round 1: AD Table 2 phenotypes'
  details: |
    Review round 1 on PR #13178. The entry took its dominant-form counts from PMID:41897354 but used only the prose summary paragraph, omitting most of that paper's Table 2. Added sixteen AD-STT3A-CDG phenotypes, each carrying a frequency band mapped from the Table 2 count over the 21-individual pooled cohort and an evidence item quoting the table row: High anterior hairline (HP:0009890, 10/21, FREQUENT), Abnormal upper lip and philtrum morphology (HP:0000177, 9/21, FREQUENT), Short palpebral fissure (HP:0012745, 7/21, FREQUENT), Wide nasal bridge (HP:0000431, 7/21, FREQUENT), Prognathism (HP:0030791, 6/21, OCCASIONAL), Protruding or low-set ears (HP:0000377, 6/21, OCCASIONAL), Inverted nipples (HP:0003186, 6/21, OCCASIONAL), Abnormal subcutaneous fat distribution (HP:0007552, 4/21, OCCASIONAL), Muscle hypertrophy (HP:0003712, 4/21, OCCASIONAL), Bruising susceptibility (HP:0000978, 4/21, OCCASIONAL), Scoliosis (HP:0002650, 5/21, OCCASIONAL), Attention deficit hyperactivity disorder (HP:0007018) and Anxiety (HP:0000739) with no band, Intrauterine growth restriction (HP:0001511, 3/21, OCCASIONAL), Morbid obesity (HP:0001513, 1/21, VERY_RARE) and Anorectal malformation (HP:0012732, 1/21, VERY_RARE). Three Table 2 rows bundle two concepts. The upper lip and the ears rows are bound to the narrowest HPO class above both halves, because the source does not say which half each individual had, and the bundling is stated in the description. The ADHD-or-anxiety row is split into two precisely bound phenotypes carrying no frequency band, since the 5 of 21 count is a union that cannot be apportioned and no HPO class covers both diagnoses without also covering the intellectual disability and learning difficulties counted separately in the same cohort. Prognathism has no maxillary-specific HPO term; HP:0000303 Mandibular prognathia is defined by increased mandibular length and would assert the wrong bone for a maxillary-predominant finding, so the binding is HP:0030791 Abnormal jaw morphology with coarse_binding_basis NO_HPO_TERM and a term_gap recording the search. The two single-patient features are VERY_RARE rather than OCCASIONAL because 1 of 21 is 4.8 per cent, below the 5 per cent floor of the occasional band. Three corrections. Macrocephaly gained the 7 of 21 frequency it lacked. The Abnormal bleeding description said the bleeding diathesis was in a single dominant-form patient; Table 2 records it in 3 of 21, with a further 4 of 21 having easy bruising, so the description was corrected and a frequency added. The Hypertonia description now records that the cohort's abnormal muscle tone count of 7 of 21 pools hypertonia with hypotonia and cannot be apportioned. Renamed the pathophysiology node Heterozygous Dominant-Negative STT3A Catalytic-Site Variants to Heterozygous STT3A Catalytic-Site Missense Variants, updating the discussion attaches_to reference in the same edit, because no allele-specific dominant-negative assay has been reported for p.Asn544Ser or p.Asp167Tyr; the node description now says so and the mechanism remains an open discussion. Wired every new phenotype into the pathograph: Scoliosis, Prognathism and Wide nasal bridge from Abnormal Skeletal Development, the rest from Multisystem Glycoprotein Dysfunction, all INDIRECT_UNKNOWN_INTERMEDIATES, since the cohort establishes each as a feature of the disease without naming a client glycoprotein. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens all clean; 110/110 snippets verified against the local cache; list-disconnected-phenotypes reports 40 of 40 phenotypes causally connected; validate-disorders passed.

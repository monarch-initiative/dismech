  summary: 'Create: STT3A-Congenital_Disorder_of_Glycosylation'
  details: |
    New entry for STT3A-congenital disorder of glycosylation (CDG-Iw),
    expanding the seed file created from the stub queue. The stub
    stubs/STT3A-congenital_Disorder_Of_Glycosylation.yaml is deleted.

    Scope decision. MONDO has two terms: MONDO:0014270 (gene-named label,
    carrying the autosomal recessive synonym and OMIM:615596) and
    MONDO:0859223 (autosomal dominant, OMIM:619714), which sits directly under
    congenital disorder of glycosylation and not under MONDO:0014270. The
    entry is anchored on MONDO:0014270 and models the two forms as
    has_subtypes (AR-STT3A-CDG bound to MONDO:0014270, AD-STT3A-CDG bound to
    MONDO:0859223), because they share the gene, the OST-A enzyme and the
    transfer defect but differ in allele mechanism (biallelic loss of
    function versus heterozygous, likely dominant-negative catalytic-site
    variants) and clinical emphasis (encephalopathy versus
    neuromusculoskeletal). Phenotypes, prevalence and lesion nodes carry
    subtype assignments. The same MONDO term is therefore bound twice (entry
    and recessive subtype); Myopathic_Ehlers-Danlos_Syndrome is a precedent.

    Pathograph: two lesion nodes (biallelic LoF; heterozygous dominant-
    negative) converge on reduced OST-A activity, impaired cotranslational
    N-glycosylation (GO:0180058) and protein hypoglycosylation, which
    conforms to congenital_disorder_of_glycosylation#Protein Hypoglycosylation.
    Branches: impaired factor VIII secretion, ER stress (cell-line only,
    PROVISIONAL), impaired insulin/IGF-1 receptor processing (cell-line only,
    HYPOTHETICAL, deliberately not wired to growth phenotypes and raised as a
    discussion), abnormal skeletal development (zebrafish-supported, dominant
    form), and multisystem glycoprotein dysfunction (conforms to the module
    node). All 24 phenotypes are causally connected. The module's ER
    lipid-linked oligosaccharide assembly trigger node was not used because
    the lesion here is at glycan transfer, not donor assembly. Two
    discussions record the open question of dominant-negative versus dosage
    mechanisms (p.Asp167Tyr lowers protein; the zebrafish model is a
    knockdown) and the growth-receptor hypothesis.

    Frequencies for the dominant form come from the 21-individual pooled
    cohort in PMID:41897354; phenotypes spanning both subtypes carry counts
    in their descriptions but no frequency value, since the cohort covers
    only the dominant form. No treatments section: no disease-specific or
    symptomatic treatment study was found for either subtype.

    Deep research: the OpenScientist report was read in full. Its
    reference_validation reports 16/16 references resolved and 31/31 quotes
    found, 0 off topic. Its term_validation needs_review flag was set by
    label-format noise (category words such as "Clinical sign" reported as
    labels), one obsolete GO term (GO:0018279, not used; GO:0180058 bound
    instead), and CHEBI:23509 offered as dolichol but actually "cysteine
    derivative" (not used). The report gives the STT3A HGNC identifier as
    HGNC:30591, which is wrong; hgnc:6172 was verified against the HGNC REST
    service. The report binds skeletal anomalies to HP:0000924; the entry uses
    HP:0011842 with coarse_binding_basis VARIABLE_SPECTRUM. just preflight-dr
    returned PASS (STT3A mentioned 71 times; report OMIM 615596 and 619714).
    Report citations used: 23842455, 34653363, 39891251, 30701557, 28860277,
    25460543, 31101650, 39435313. Report citations not used: 40737785,
    39923392, 34440401 and 28323990 are about the CDG group or PMM2-CDG and
    say nothing specific to STT3A; 31433728, 25135935 and 29282902 are OST
    mechanism papers superseded here by more direct sources; 37876147 is a
    PMM2-CDG transferrin-variant pitfall paper. The report's gnomAD constraint
    figures have no citable source and were not used.

    Additional sources found by PubMed search: Ghosh 2017 (PMID:28424003,
    second recessive family), the 2026 pooled review of the dominant form
    (PMID:41897354), the OST isoform papers PMID:19167329, PMID:29519914,
    PMID:31831667, PMID:31296534 and the STT3A-knockout proteomics study
    PMID:36139350. PMID:31021453 is a published erratum to PMID:30701557 with
    no text and was not cited.

    Checks run: just validate (pass), just validate-terms (pass),
    just count-verified-snippets (all snippets verified), check-entity-refs,

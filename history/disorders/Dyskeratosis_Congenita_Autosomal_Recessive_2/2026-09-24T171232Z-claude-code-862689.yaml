  summary: 'Create: Dyskeratosis_Congenita_Autosomal_Recessive_2'
  details: |
    De novo curation of DKCB2 (biallelic NHP2) as a standalone Disease entry, following the precedent of Dyskeratosis_Congenita_Autosomal_Recessive_6 (PARN) and _8: the parent Dyskeratosis_Congenita keeps its gene-keyed has_subtypes row for NHP2 and the disorder-family pathograph, while this entry carries the gene-specific upstream mechanism (H/ACA ribonucleoprotein assembly failure) that the family-level chain cannot express. Nine pathophysiology nodes run from failed NHP2 incorporation into the H/ACA complex through TERC depletion and telomerase insufficiency to telomere attrition, replicative senescence, marrow and mucocutaneous failure, clonal evolution, and a parallel ribosomal RNA biogenesis arm; two nodes declare conforms_to against telomere_attrition. Fifteen phenotypes, all quoted from cached sources. Cancer predisposition is carried on this entry rather than deferred to the parent, on the strength of one genetically confirmed NHP2 patient with myelodysplastic syndrome and gastric carcinoma plus genotype-based GeneReviews surveillance; no NHP2-specific quantitative risk figure exists and that gap is recorded as a discussion rather than filled. Sources: GeneReviews PMID:20301779 (baseline chapter, tagged), the ClinGen gene-disease validity assertion for NHP2/MONDO:0013519 (classification Limited, Interstitial Lung Disease GCEP, 2025-08-01), and six primary papers. PMID:36943377 and PMID:40073202 are on topic but have no retrievable text beyond their titles and were deliberately not cited. Deep research: falcon requested, returned HTTP 402 (out of credits), claude_code fallback produced the report; preflight-dr PASS, reference validation 8/8 verified with needs_review true on two unsupported quotes, term validation flagged five mislabelled identifiers in the report which were not adopted. Validated under linkml-reference-validator 0.3.0rc1: validate, count-verified-snippets 57/57, validate-terms, duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, coarse-phenotypes, snippet-length, title-snippets, snippet-grading, folded-hyphens, environmental-evidence, reference-titles, gene-term-mismatches, check-genereviews --online, pytest tests/test_data.py, and validate-disorders.

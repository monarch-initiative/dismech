  details: |
    Review round 1 on PR 12752, taking the reviewer's suggestions 1 and 4. Added has_subtypes rows for IGSF1-Related Central Hypothyroidism (MONDO:0010475) and CHNG7 (MONDO:0032819, TRHR), both MONDO terms read live from OLS, with reciprocal genetic[].subtype foreign keys; both genes were already curated in this entry, so the rows close a coverage gap the PR's own upstream notes had identified. Regraded two TBL1X background sentences that were HUMAN_CLINICAL: the protein-function statement is OTHER with quote_role BACKGROUND, and the tissue-expression statement is IN_VITRO with quote_role BACKGROUND, since expression data is not a clinical observation. Three defects in my own first draft of the new rows were caught by the authoritative gate and by re-reading the caches, and are recorded because the same mistakes are the ones this campaign's brief warns about: both reference_title values were written from memory and were wrong, both snippets were fabricated by completing a quote I had truncated to 105 characters when inspecting the existing records, and the IGSF1 row description asserted macroorchidism and prolactin and growth hormone deficiency that appear nowhere in the cited cache. Titles and snippets are now copied verbatim from the entry's existing verified items, and the description states only what this row's evidence covers, noting explicitly that the late-onset testicular enlargement in the MONDO label is not asserted from it.

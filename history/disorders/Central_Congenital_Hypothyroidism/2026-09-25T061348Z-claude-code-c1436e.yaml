  summary: 'Genetics pass (d2g series-037): gene-defined subtypes and pathograph wiring'
  details: |
    Bound the two isolated central congenital hypothyroidism genes this entry named
    in prose but never bound, found while working the d2g series-037 gap list
    (issue #12244).

    The entry's single genetic record was named "Established isolated central
    congenital hypothyroidism genes", bound to IGSF1, and its notes listed five
    established genes - TSHB, TRHR, IGSF1, TBL1X and IRS4 - of which only three had
    records. TBL1X and IRS4 were therefore invisible to any gene-level query while
    being plainly stated in the file. The gap list files both under
    Congenital_Hypothyroidism, but MONDO:0026731 and MONDO:0026732 are isolated
    central hypothyroidism, so they are curated here beside their three siblings
    rather than on the primary-hypothyroidism umbrella.

    Added genetic records for TBL1X and IRS4, both X-linked, each with its
    discovery publication. Added a has_subtypes block with CHNG8 bound to
    MONDO:0026731 and CHNG9 bound to MONDO:0026732. Bound all five genes as
    descriptors on the Impaired Hypothalamic-Pituitary TSH Drive node, with added
    evidence naming TRHR, TSHB and IGSF1, then TBL1X, then IRS4.

    Renamed the IGSF1 record to "IGSF1 pathogenic variants" to match its four
    siblings, and rewrote its notes: the previous text described which gene the
    curator chose to anchor the section on, which stopped being true once the other
    genes had records of their own.

    Validation: just validate (56 snippets, 0 issues), just validate-terms and the
    offline gates pass under linkml-reference-validator 0.3.0rc1.

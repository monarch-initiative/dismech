  summary: 'Gene-family review: COQ4'
  details: |
    Renamed the COQ4 mechanism node from 'COQ4 Loss of Function and CoQ Synthome Destabilization' to 'COQ4 C1 Decarboxylase Deficiency' and rewrote its description around the catalytic step. Two 2024 studies assign the C1 decarboxylation of the CoQ head group to COQ4: in vitro reconstitution of the ancestral animal COQ metabolon shows a zinc-dependent decarboxylase that does not hydroxylate C1 (PMID:38425362), and complementation in E. coli and C. glutamicum shows an oxygen-dependent oxidative decarboxylation (PMID:38295803). The bound term GO:0120539 (EC 4.1.1.130) matches the reconstituted reaction. The earlier purely structural reading (PMID:25658047) is now described as a possible additional contribution: the 2015 snippet saying COQ4's function was unknown was replaced by the 2024 statement that the catalytic role is additional to the proposed structural one, plus the observation that the yeast complex is destabilized in most coq deletion strains. Added that COQ4-knockout cells and a COQ4 patient fibroblast line accumulate 3-decaprenyl-4-hydroxybenzoic acid, the COQ2 product (PMID:38295803). Corrected the biosynthetic-failure node and the 6-demethoxyubiquinone biomarker: DMQ is the COQ7 substrate, downstream of the COQ4 step, so its rise in patient fibroblasts (PMID:34656997) does not localise the block; the earlier text called it an upstream intermediate that localises the lesion. Added the autosomal recessive inheritance block to the main COQ4 genetic record.

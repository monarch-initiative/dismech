  summary: Rebind COQ4 molecular function to C1 decarboxylase; record germline origin
  details: |
    The COQ4 molecular node was bound to GO:0030674 protein-macromolecule adaptor activity on the basis of a 2015 statement that COQ4's catalytic function was unknown. In vitro reconstitution of the COQ metabolon (PMID:38425362) and heterologous complementation (PMID:38295803) assign the zinc-dependent C1 decarboxylation step of the CoQ head-group pathway to COQ4, so the node now binds GO:0120539 4-hydroxy-3-methoxy-5-polyprenylbenzoate decarboxylase activity (DECREASED), matching Primary_Coenzyme_Q10_Deficiency and the ai-gene-review COQ4 core function. The entry description, node description, downstream edge and knowledge-gap rationale were updated to drop the 'no catalytic activity / scaffold only' framing; the 2015 evidence is kept with an explanation noting it predates the 2024 assignment. variant_origin: GERMLINE added to the four CAUSATIVE genetic records. ClinGen classifies COQ4 only for the lumped 'mitochondrial disease' (MONDO:0044970), not this entry's disease, so no gene_disease_validity was copied. Validated with just validate, count-verified-snippets (113/113) and validate-terms.

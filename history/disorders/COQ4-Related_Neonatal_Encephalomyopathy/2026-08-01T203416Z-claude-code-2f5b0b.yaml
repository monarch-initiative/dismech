  summary: Address automated review on PR 7767
  details: |
    Addressed the automated reviewer's two blocking items and four of five suggestions on PR 7767. Blocking item 1, partial GeneReviews mining: added a third evidence item citing PMID:28125198 aim 4 on the whole-exome-sequencing diagnosis entry, so the tagged GeneReviews reference is now mined across inheritance, treatments and diagnosis. Blocking item 2, omitted manifestations: added Dystonia HP:0001332, Ataxia HP:0001251 and Spasticity HP:0001257, all named in the PMID:37948995 sentence already quoted verbatim elsewhere in the entry. These are tagged PARTIAL and carry no frequency band because the citing review spans the whole COQ4 spectrum from prenatal to adult onset rather than the neonatal-onset subset this entry scopes. Suggestions applied: added Nystagmus HP:0000639 from an already-quoted PMID:38353291 snippet; anchored the entry scope explicitly to Laugwitz type 1 in the notes block, with the type 2 and type 3 patterns assigned to the umbrella entry; gave Idebenone a target_mechanisms BYPASSES link to the impaired electron-transfer node, reflecting that a short-chain quinone shuttles electrons independently of endogenous CoQ10 rather than relieving the biosynthetic block. On the biochemical terms suggestion, searching HPO first showed that two of the three unbound markers do have terms, so rather than filing new-term requests the entry now binds HP:0034369 for reduced skeletal-muscle coenzyme Q10 and HP:0008972 for reduced respiratory chain activity, each with a note on the residual granularity gap; only 6-demethoxyubiquinone is marked as a genuine new-term candidate after HPO and CHEBI searches returned nothing. Declined: modelling secondary COQ7 and COQ9 reduction, because that finding exists only in full-text pages of PMID:34656997 while the cached record is abstract-only, so no snippet-verifiable evidence is available. Every added snippet was re-read in its surrounding cache context before use to guard against truncation, negation-clipping and cross-disease errors. Validation after changes: just validate passed, just validate-terms passed, just validate-references verified 102 of 102 snippets, just validate-history passed.

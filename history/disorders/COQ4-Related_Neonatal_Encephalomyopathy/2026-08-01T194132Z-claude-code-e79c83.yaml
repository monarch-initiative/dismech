  summary: 'Create: COQ4-Related Neonatal Encephalomyopathy'
  details: |
    Created a new dismech entry for neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome / primary coenzyme Q10 deficiency-7 / COQ10D7, MONDO:0014562, OMIM:616276. Causal gene COQ4, hgnc:19693, established BEFORE deep research from the MONDO structured gene relationship RO:0004003 plus the OMIM xref, and cross-checked against primary literature. NEC preflight passed on gene, OMIM and synonyms. Duplicate preflight found no existing entry for MONDO:0014562; the entry is positioned as the gene- and onset-specific child of the existing umbrella entry Primary_Coenzyme_Q10_Deficiency MONDO:0018151, and is mechanistically distinct from the concurrently curated MTO1 and MRPL44 mitochondrial-translation defects and from SLC25A3 phosphate-carrier disease. Deep research used the Edison/falcon provider via just research-disorder falcon; the report was read in full and treated as leads only. Edison asserted OMIM 616227 for the disease, which is wrong and was rejected in favour of the MONDO-xref value 616276. Two Edison leads were independently resolved and used: the exon-dependent genotype-phenotype gradient and the specialist-cohort treatment data. Curation content: a five-node pathophysiology chain from COQ4 loss and CoQ synthome destabilization through CoQ10 biosynthetic failure, impaired CoQ10-dependent electron transfer, tissue bioenergetic failure, to lactic acidosis and multiorgan failure; 19 phenotypes with HPO terms; 4 biochemical markers; 2 histopathology findings; 4 genetic records including both founder alleles and the exon gradient; 2 diagnostic modalities; 3 treatments; 3 knowledge-gap discussions. GeneReviews baseline PMID:28125198 was fetched, tagged in the top-level references block, and mined for two evidence items. Validation: just validate passed, just validate-terms passed, just validate-references verified 97 of 97 snippets against cached references. A red-team review pass was run before opening the PR and its findings were addressed, including rebinding cardiomyopathy to the generic HP term to match the cited counts, downgrading the hearing phenotype to the generic term, adding four missing phenotypes, adding idebenone and CoQ10 dosing, correcting an unsourced OMIM claim and an unsourced case count in prose, and downgrading several overstated evidence-strength tags.

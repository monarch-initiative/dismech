  summary: 'Review: connect Revesz''s nine orphan phenotypes (IUIS Table 9)'
  details: |
    Nine phenotypes had no incoming edge, including the measured telomere phenotype the disease is defined by.

    Very Short Telomeres, the DC mucocutaneous triad, cerebellar hypoplasia, global developmental delay and intrauterine growth restriction now attach to Extreme Telomere Shortening. Glaucoma attaches to the retinal vasculopathy node, by the route ischaemia takes in other proliferative retinopathies - neovascularisation onto the iris and drainage angle obstructing outflow - rather than being treated as an independent ocular abnormality. Seizures attach to the intracranial calcification and cerebrovascular fragility node, with the attribution flagged as inference: no cited source separates that contribution from the cerebellar and developmental abnormalities.

    One thing deliberately NOT changed. The entry has two edges from Impaired Shelterin-Mediated Telomere Maintenance to the same target, Extreme Telomere Shortening. That looks like a duplicate and is not: the two carry different hypothesis_groups, one for the telomerase-recruitment model and one for the telomere-replication model, which is the documented pattern for competing mechanistic accounts. Left alone. 94/94 snippets verify.

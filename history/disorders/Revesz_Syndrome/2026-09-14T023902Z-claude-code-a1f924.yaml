  summary: 'Classify: IUIS 2022 Table 9'
  details: |
    Added a classifications block carrying iuis_category: bone marrow failure, backfilled from IUIS 2022 Table 9 (Tangye et al., PMID:35748970). The entry previously had no classifications block. The relevant row is DKCA5 inside the table's dyskeratosis congenita block, printed as 'DKCA5 TINF2 AD 268130'. IUIS names no eponym there, so the identification runs through the OMIM number: 268130 is Revesz syndrome, and this entry already carried both DKCA5 and 'dyskeratosis congenita, autosomal dominant 5' in its synonym list. The evidence snippet quotes the DKCA5 row together with the adjacent DKCA4 and DKCA6 rows, because the DKCA5 row alone is four tokens and falls below the five-word snippet-length floor; the explanation says which part of the quote bears on the claim. Graded OTHER. The notes record two things this assignment does not claim: that IUIS treats Revesz as distinct from dyskeratosis congenita (the row sits inside the DC block and the parent entry carries the same value against the block), and that it settles the ClinGen lumping question described in the entry's own description, which postdates IUIS 2022. Also added as a member of kb/groupings/Bone_Marrow_Failure_IEIs.yaml.

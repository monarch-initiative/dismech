  summary: 'Create: Revesz Syndrome (MONDO:0009990, TINF2) curated as a standalone
    entry with the ClinGen lumping decision recorded'
  details: |
    New standalone Disease entry for MONDO:0009990, curated with an active nosological dispute attached.

    Lump/split decision: DISEASE, and it was close. The biological case favours SUBTYPE: Revesz has no upstream mechanistic divergence from TINF2 dyskeratosis congenita at all - same gene, same exon 6, often the same R282H allele, same shelterin defect - which is exactly the divergence that justified a standalone entry for methylmalonic aciduria cblA in #10260. Two authorities go further. ClinGen's Interstitial Lung Disease GCEP applied the Lumping and Splitting Working Group criteria in November 2024 and merged Revesz syndrome (OMIM 268130) with DKCA3, Hoyeraal-Hreidarsson syndrome and pulmonary fibrosis into one entity, TINF2-related short telomere syndrome, finding no difference in molecular mechanism or inheritance. And an August 2026 widefield fluorescein angiography study (PMID:42617951) found retinovascular abnormality in 100% of 44 eyes across 22 telomere biology disorder patients, 81.8% of them asymptomatic, and proposed replacing the eponym with Short Telomere Associated Retinopathy.

    What decided it the other way was what a Subtype record can hold, not biology. The Subtype class carries name, term, mappings, description, evidence, genes, frequency and inheritance - no pathophysiology, progression, treatments, models or discussions. Recording Revesz as a subtype would have bound the MONDO term and discarded everything this file exists for: the retinal and cerebral limbs of the pathograph (the dismech Dyskeratosis Congenita pathograph has three nodes and terminates in marrow, lung and liver, with no retinal or CNS branch at all), the two competing TIN2 mechanisms, the natural history, the transplant outcomes, and the STAR reframing. Separately, that entry's has_subtypes list is keyed by gene across all sixteen entries, and Revesz is not a gene. Same shape of argument as the cblA PR's 'the umbrella's existing subtype is the wrong shape to hold it', applied to a different limitation.

    Both sides of the dispute are curated, not just the conclusion. The ClinGen lumping decision is an external_assertions block with the Lumping and Splitting sentence quoted; the STAR proposal is quoted in a CONTROVERSY discussion; and the counter-position (Rolles 2024, 'clearly distinct from classical DKC') is quoted alongside them with an explanation noting it is a phenotype description rather than a nosological ruling. The entry states in its description that Revesz is not genetically or mechanistically separable from TINF2 dyskeratosis congenita.

    Dyskeratosis_Congenita.yaml was not modified, following the cblA precedent of leaving the umbrella alone. It still describes Revesz in three places and binds MONDO:0009990 nowhere.

    Named entity confusion. The gene is not the trap - preflight-dr PASSed with 52 TINF2 mentions and the correct OMIM. The trap is the neighbouring syndromes that share the retinopathy or the calcification: Coats plus / CRMCC (CTC1), Hoyeraal-Hreidarsson, and telomere-disorder retinopathy in TERT, RTEL1 and TERC patients. Every clinical citation was checked to be about patients labelled Revesz syndrome, with two deliberate exceptions marked as such - the Walne TINF2 series and the STAR angiography series are broader telomere-disorder cohorts, each used with directness INDIRECT or an explanation naming its population. PMID:34522616 (TINF2 autopsy telomere survey) was read and excluded because its patient had classical DC and survived to eighteen.

    Two competing TIN2 mechanisms are curated as separate ALTERNATIVE hypothesis groups rather than blended, with both downstream edges from the shelterin node opting into one each: telomerase-recruitment failure (PMID:21536674, human cells) and a telomerase-independent replication defect (PMID:24449270, TIN2-DC knock-in mouse shortening faster with mTR deleted). Neither is CANONICAL; the mouse authors' proposed reconciliation is quoted in an OPEN_QUESTION discussion.

    Two pathophysiology nodes are tagged HYPOTHETICAL and deliberately name the observed lesion rather than an inferred cell mechanism: no study has measured telomere length, senescence or endothelial state in Revesz retina or brain. The tissue-selectivity question - why these children and not other carriers of the identical variant - is a KNOWLEDGE_GAP with two proposed experiments.

    Frequency bands were taken from the Karremann denominators and checked against FrequencyEnum: 85% calcification VERY_FREQUENT, 76% cerebellar hypoplasia and 71% delay FREQUENT, 20% seizures and 3/18 haemorrhage OCCASIONAL, 87% nail dystrophy VERY_FREQUENT, 55% and 43% FREQUENT. Bands were left absent on intrauterine growth restriction, retinal detachment and short telomeres, where the available numbers come from the wrong denominator. de_novo_rate was left absent despite universal de novo occurrence, because only twelve of eighteen patients were genotyped.

    The stale ClinGen CSV pin (#10081) was worked around as in the companion DCM 1U PR: current CSV downloaded to the gitignored data/clingen/gene_validity.csv and the rebuild run directly. PMID_39371255.md is modified rather than added because the existing cache was abstract_only and the fetch upgraded it to PMC full text, which the snippets depend on.

    Two clinical trials are curated: NCT01659606 and NCT06817590 both list Revesz Syndrome in their ClinicalTrials.gov condition arrays (verified against the v2 API; the cached summary text does not contain the string, so the fact is stated in the trial description rather than quoted as a snippet).

    Validation: just validate, validate-terms, check-entity-refs and check-duplicate-keys all exit 0; 81/81 snippets verified against the cached references.

  summary: 'Address ai4c-reviewer findings on PR #10328: GeneReviews baseline and
    the unmodeled pulmonary branch'
  details: |
    Response to the automated review on PR #10328. Both blocking findings were checked against the cached source before acting; both were correct and both are fixed.

    Finding 1, the GeneReviews baseline. references_cache/PMID_20301779.md - Savage and Niewisch, Dyskeratosis Congenita and Related Telomere Biology Disorders - was already committed in the repository, names Revesz syndrome explicitly, and was neither tagged nor cited. The reviewer's point that this is not a box-check is the right one: there is no Revesz-specific GeneReviews chapter, and this entry's own argument is that Revesz is not separable from TINF2 dyskeratosis congenita, which makes the DC/TBD chapter the authoritative clinical source for it. It is now tagged GeneReviews in the references block and cited across all four required domains: flow-FISH on the telomere-length diagnosis entry, the 80% sequencing yield on the TINF2 sequencing entry, the HCT-is-the-only-curative-treatment statement on the transplantation entry, the marrow and pulmonary surveillance schedules and the agents-to-avoid list on the surveillance entry, and the autosomal-dominant gene assignment plus the prenatal/preimplantation testing statement on the inheritance block. Every one is marked directness INDIRECT with an explanation naming the population, because the chapter is written for DC/TBD as a class.

    Finding 2, the pulmonary branch. The reviewer is right that the entry quoted refractory lung failure twice and referred in notes to a pulmonary branch that did not exist. Added a fourth downstream edge from Extreme Telomere Shortening to a new pathophysiology node, Pulmonary Involvement and Respiratory Failure, plus a Respiratory Failure phenotype bound to HP:0002878.

    The node is deliberately not called pulmonary fibrosis and the phenotype is not bound to HP:0002206. Fibrosis is the established telomere-disorder mechanism and GeneReviews names it, but what is documented in Revesz syndrome is acute refractory lung failure as a cause of death, including after transplantation; no pulmonary function series, imaging or histology exists for this disease, and most of these children die before the age at which GeneReviews says pulmonary function testing becomes performable. Binding to fibrosis would have asserted a lesion nobody has demonstrated in a Revesz patient. The node carries mechanism_confidence PROVISIONAL and says this. No frequency band, because the source says some cases without a count.

    Suggestion 3 accepted: Glaucoma is now its own Ophthalmologic phenotype, HP:0000501, banded OCCASIONAL on three of eighteen, rather than living inside the retinopathy prose.

    Suggestion 4 accepted and folded into finding 1: the GeneReviews agents-to-avoid list is on the surveillance treatment, with the two items that matter most in this disease called out - non-leukodepleted and non-irradiated blood products, and blood donation by family members while transplantation is under consideration, which matters because a related donor may be an unrecognised carrier of a dominant variant. The androgen plus G-CSF warning is included and the notes now say explicitly that a safety warning is a different claim from the danazol efficacy data this entry still declines to curate.

    Suggestion 5 declined, with the reason recorded in notes rather than left silent: somatic reversion in TINF2 disease is a real false-negative mode for blood-derived sequencing, and the deep-research report raises it, but no reference cached for this entry - GeneReviews included - contains a quotable sentence stating it. It is recorded in notes as a known gap.

    Validation after the changes: just validate, validate-terms, check-entity-refs, check-duplicate-keys and validate-disorders all exit 0; 93 of 93 snippets verified against the cached references, up from 81. All five whole-KB gates exit 0, and the entity-ref, conforms_to and causal-target pytest lanes pass.

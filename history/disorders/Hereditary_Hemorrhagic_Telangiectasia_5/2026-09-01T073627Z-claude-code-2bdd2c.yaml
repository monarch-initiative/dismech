  summary: 'Create: Hereditary Hemorrhagic Telangiectasia Type 5 (GDF2/BMP9)'
  details: |
    Created kb/disorders/Hereditary_Hemorrhagic_Telangiectasia_5.yaml (MONDO:0014217, OMIM 615506, GDF2/BMP9), the GDF2-defined member of the HHT numbered series, following the Hereditary_Hemorrhagic_Telangiectasia_4 precedent of a standalone entry that also remains a has_subtypes stub on the parent. Duplicate preflight ran against origin/main plus all-state PR and issue searches for the label, synonyms and MONDO ID; no prior entry, PR or issue existed.

    DEEP RESEARCH: falcon (Edison) was requested and returned HTTP 403 ProviderAuthError. Rather than hand-substituting, the run was re-issued with the recorded --fallback, which produced research/Hereditary_Hemorrhagic_Telangiectasia_5-deep-research-openscientist.md (fell_back: true, requested_provider: falcon, provider_attempts recorded in frontmatter), plus its citations sidecar and two artifacts. The report's own reference_validation was clean on identifiers (18/18 resolved, confabulation_rate 0.0) but flagged only 9/18 on topic, and its term_validation set needs_review: true. Its ontology suggestions were NOT used: it proposed MONDO:0014660 for this disease (which is autosomal recessive primary microcephaly 15), HP:0006775 for pulmonary AVM (which is multiple myeloma), and NCIT:C15325 for therapeutic embolization (which is skin transplantation). Every term bound in the entry was resolved independently with OAK. The report also extrapolated HHT-wide frequencies (>90 percent epistaxis, ~50 percent anaemia, 1-in-5000 prevalence) to HHT5; those were deliberately not imported and the notes block records why.

    The report did contribute four substantive leads that PubMed-first curation had missed, all followed to primary sources and cited from them: the four-proband GDF2 cohort with the first documented cerebrovascular involvement in HHT5 and the upper-forelimb/trunk/head dermal lesion distribution (PMID:34611981); the multi-megabase 10q11.22-10q11.23 deletion allele class, which forced a CNV-aware-testing note in the diagnosis section (PMID:34611981); the germline zebrafish bmp9 mutant that survives to adulthood with no overt phenotype, contradicting the founding paper's morpholino result and explaining incomplete penetrance via BMP10 redundancy (PMID:31828546); and PI3K/Akt/mTOR-VEGFR2 overactivation downstream of BMP9/ALK1 loss, which supplied a mechanistic rationale for the single reported sirolimus response and is modelled as its own pathophysiology node (PMID:31689244). PMID:34611981 also corrected a claim written into an earlier draft of the notes, that cerebral involvement had never been reported in a GDF2 patient; the notes now record the exception and the contiguous-gene caveat attached to it.

    ANCHOR REFERENCES, selected from PubMed independently of the report and read in full where full text was cached: PMID:23972370 (founding BMP9/GDF2 vascular-anomaly syndrome, 3 of 191 gene-negative probands), PMID:33834622 (biallelic GDF2, undetectable circulating BMP9/BMP10, PAH-versus-PAVM split), PMID:34904380 (heterozygous p.Cys428Arg family meeting HHT criteria; retraction in confidence for p.Arg333Trp at 0.1 percent of control chromosomes), PMID:32669404 (homozygous frameshift family, sirolimus response, asymptomatic homozygous sibling), PMID:26801773 (index paediatric PAH case), PMID:25620979 (BMP9/BMP10-ALK1 quiescence model), PMID:37422716 (GDF2 definitive for PAH, which is a different gene-disease claim from HHT5), PMID:18309101 and PMID:17311849 (circulating quiescence factor, physiological ALK1 ligand).

    GENEREVIEWS BASELINE: PubMed searched for a GeneReviews chapter. None exists for HHT5. The HHT chapter (PMID:20301525, updated 2026-02-19) was fetched and tagged GeneReviews in the top-level references block; it is cited in the diagnosis section precisely because it restricts molecular diagnosis of HHT to ACVRL1, ENG and SMAD4 and does not list GDF2, which is the nosological gap the entry records.

    CURATION STANCE: the entry is deliberately narrow. It does not import the ENG/ACVRL1 organ-lesion profile, does not transfer parent-disease frequencies or prevalence, and separates GDF2's definitive PAH gene-disease validity from its contested HHT5 assignment. Four discussions record the open questions: whether GDF2 disease is HHT or a distinct HHT-like syndrome, whether inheritance is dominant, recessive or allele-class-dependent, why identical biallelic genotypes give shunting PAVMs in one child and obliterative PAH in another, and whether ligand replacement is feasible. A fifth, HUMAN_MODEL_MISMATCH, records the zebrafish morphant-versus-mutant contradiction. datasets: is deliberately absent: a GEO discovery sweep returned only ALK1/ENG/SMAD4 HHT datasets and nothing on GDF2 or BMP9, and attaching them would be Named Entity Confusion reached through dataset search; the reasoning is recorded in notes.

    The parent entry kb/disorders/Hereditary_Hemorrhagic_Telangiectasia.yaml was also edited: its GDF2-related HHT-like disease subtype description now cross-references this standalone entry, matching the HHT4 pattern.

    VALIDATION: just validate passes (schema, terms, references). just count-verified-snippets reports 86/86 snippets verified against the local cache; three snippets were reworded and two lengthened after the bracket-stripping and short-snippet gates flagged them. just validate-disorders passed over both changed files (144/144 snippets at the time it ran; re-run after the final edits). check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens all pass with no new findings. Compliance is 92 percent; the residual gap is datasets and proposed-experiment datasets, both intentional. The pathograph is fully connected: every node except the initiating GDF2 lesion has an incoming edge.

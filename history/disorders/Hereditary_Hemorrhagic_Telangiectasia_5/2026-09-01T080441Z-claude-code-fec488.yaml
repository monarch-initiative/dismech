  summary: 'Address PR #10352 review: three cached-but-unused references, five suggestions'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #10352. All three blocking findings were the same class of defect: a GDF2/BMP9-specific reference this PR had itself fetched into references_cache/ and then not used. Each was verified against its cached abstract before acting.

    FINDING 1 (PMID:27874028, transmammary anti-BMP9/BMP10 immunoblockade mouse). Valid and the most consequential of the three. The YAML prose invoked this model twice - in the PI3K node description and in the sirolimus target_mechanisms description - calling it the closest available experimental analogue of the HHT5 lesion, while citing nothing and giving it no animal_models entry. The entry therefore asserted a ligand-loss to AVM mechanism while carrying no model that positively reproduced it: the only two animal models were zebrafish at LOW fidelity, one of them FAILS_TO_RECAPITULATE. Added a full animal_models entry with a RECAPITULATES / MODERATE modeled_mechanisms link to Arteriovenous Malformation and Telangiectasia Formation, two readouts (retinal AVM burden and angiopoietin-2 transcript abundance, both INCREASED, each with its own MODEL_ORGANISM evidence), link-level evidence, and limitations recording that acute dual-ligand antibody depletion in a neonatal retina is not a germline GDF2 variant - while noting that dual BMP9/BMP10 loss is in fact the state the human biallelic cases are in.

    FINDING 2 (PMID:42309173, ancient founder GDF2 variant, semi-dominant PAH, n=13, Clin Genet 2026). Valid, and it changed a claim rather than merely adding a citation. The hht5_inheritance_mode discussion asserted that no study had tested the allele-class hypothesis directly; this paper states the division explicitly - dominant GDF2 variants cause HHT5, recessive variants cause PAH with or without HHT5 features - and reports a 13-patient founder cohort characterised as semi-dominant. Rewrote that passage: the hypothesis is no longer untested, the direction it points is that allele dose selects between two phenotypes rather than between two penetrances, and what remains untested is narrowed to the specific functional prediction in the attached experiment plus whether the split survives outside one founder haplotype. Also added the 'lack of HHT manifestations was a consistent clinical feature' sentence to hht5_is_it_hht, where it is the strongest single observation against reading GDF2 disease as necessarily HHT.

    On the reviewer's third point for this finding I did not follow the framing. The review suggested n=13 bears on the prevalence block's ~nine published probands figure. Those 13 patients consistently lacked HHT manifestations and were characterised as non-syndromic PAH, so they are not HHT5 probands and adding them to that count would be wrong. Recorded them in the prevalence notes as a separate, larger GDF2 disease case base, stated explicitly that they are not added to the HHT5 proband total and why, and noted that which count is the right denominator depends on the unresolved hht5_is_it_hht question.

    FINDING 3 (PMID:32078368, impaired SMAD1/5 mechanotransduction and Cx37). Valid. The step from reduced SMAD1/5/8 signalling to AVM formation rested on a review's hedged working model graded OTHER. Added the primary result - reduced Cx37 expression is permissive for capillary enlargement into shunts - as MODEL_ORGANISM evidence on that causal edge, alongside rather than replacing the review, since the review states the step and the primary study identifies the effector.

    SUGGESTIONS. Four accepted: prose reading 'Marked PROBABLE' corrected to PROVISIONAL to match the enum value actually set (my error - MechanismConfidenceEnum has no PROBABLE); the Cutaneous Telangiectasia phenotype's first evidence item replaced, since its snippet identified a study cohort rather than describing the lesion, with the founding paper's sentence describing the dermal lesions' location and appearance; Epistaxis recategorised from Hematologic to Vascular alongside the other lesion phenotypes; and a notes line added to Facial Telangiectasia explaining that it is a subset of Cutaneous Telangiectasia, why its frequency band is lower, and why the two are kept separate (the distribution is the feature on which the entity most clearly departs from HHT).

    One suggestion declined on the facts. The review flagged PMID:32894695 and PMID:34280349 as duplicate caches of the Second International HHT Guidelines. They are different PubMed records: 32894695 is the 2020 guideline (doi 10.7326/M20-1443) and 34280349 is a 2021 record with doi 10.7326/L21-0068, an L-prefixed letter rather than the guideline itself. Neither is cited by the entry - both are deep-research run artifacts - so nothing was changed.

    GENEREVIEWS. The review judged the single negative citation of PMID:20301525 defensible but asked for the reasoning to be recorded. Added a notes paragraph stating that no HHT5 GeneReviews chapter exists, that the HHT chapter is cited for the fact that it excludes GDF2 from molecular diagnosis, and that mining its Clinical Characteristics, Management and Genetic Counseling sections would import exactly the parent-disease content the entry argues must not be transferred - the baseline was read and applied by exclusion.

    VALIDATION AFTER FIXES: just validate passes; snippets rose from 86/86 to 94/94 on this file, and the batched just validate-disorders reports 172/172 across both changed files. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens all clean with no new findings. Three new top-level references registered (PMID:27874028, PMID:32078368, PMID:42309173); no new reference fetches were needed, since all three were already cached by the original commit.

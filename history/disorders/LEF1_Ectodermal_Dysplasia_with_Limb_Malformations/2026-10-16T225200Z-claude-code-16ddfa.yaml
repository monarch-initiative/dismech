  summary: 'Create: LEF1_Ectodermal_Dysplasia_with_Limb_Malformations'
  details: |
    New entry for ectodermal dysplasia 17 with or without limb malformations (MONDO:0979228, OMIM:621224), caused by LEF1. Deep research: falcon was requested by the curate skill but deep-research-client providers --check reported it UNREACHABLE (403 Failed to authenticate), so OpenScientist was run directly (research/LEF1_Ectodermal_Dysplasia_with_Limb_Malformations-deep-research-openscientist.md); the --fallback flag was not used. The report passed just preflight-dr (LEF1 mentioned 67 times, OMIM 621224) and resolved 11/11 references; its only disease-specific primary source is Dufour et al. 2022 (PMID:35583550), and its other citations (TP63 split-hand/foot, EDA-pathway cohorts, 10q24 duplication) are differentials and were not cited. Evidence comes from the Dufour 2022 and Levy 2020 (PMID:32022899) abstracts and two Lef1-null mouse studies (PMID:7958926, PMID:8647435); no PMC full text exists for the human papers. Hassan et al. 2024 (PMID:39107921) has no abstract and was not cited. Phenotype frequency bands come from phenotype.hpoa counts for OMIM:621224, recorded in each phenotype's notes; HPOA-only features with no abstract support (sparse eyebrows, hypoplastic nipples, short thumb and others) are listed in the entry notes rather than modelled. Two subtypes (monoallelic AD haploinsufficiency or loss of DNA binding; biallelic AR loss of beta-catenin binding) feed a shared WNT-transcription node that branches to ectodermal-appendage and limb-patterning nodes. A fresh-context review subagent found no blocking issues; its should-fix items (Orphanet/ClinGen absence wording, HPOA source attribution, unsourced HOMOZYGOUS zygosity removed, Wnt modifier changed to DYSREGULATED, caveats on the taurodontism and hypohidrosis edges) were applied. Validated with just validate, count-verified-snippets (26/26) and just validate-disorders.

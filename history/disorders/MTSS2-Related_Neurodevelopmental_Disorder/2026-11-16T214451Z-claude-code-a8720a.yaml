  summary: 'Create: MTSS2-Related Neurodevelopmental Disorder (IDDOF, MONDO:0859303)'
  details: |
    New entry for MONDO:0859303, curated for claim issue #9062 (replaces stubs/Intellectual_Developmental_Disorder_With_Ocular_Anomalies_And_Distinctive_Facial_Features.yaml).

    Sources: the cached abstracts and full texts of eight papers on MTSS2 and this disorder, and an OpenScientist deep-research report (research/MTSS2-Related_Neurodevelopmental_Disorder-deep-research-openscientist.md; 8 of 8 references resolved; just preflight-dr passed with MTSS2 the dominant gene and OMIM 620086 matching). The report's one failing quote, from PMID:36067766, is genuine: it contains a bracketed protein change that the matcher strips, and the entry quotes it with an ellipsis bridge. The report's relevance check called PMID:31232686 and PMID:36871754 off topic; PMID:31232686 is about Mtss1L, the former symbol of MTSS2, and is cited, while PMID:36871754 is not cited. The curation brief posted on #9062 was used as a list of leads, with every CURIE and quote checked against the caches.

    Mechanism: the full text of PMID:40698928 changes the picture the brief and the report give. The patient variant expressed in embryonic mouse cortex disorganized radial glia and neuronal migration, but did not reduce RhoA activation or the number of dividing progenitors, and the authors judge a dominant-negative action on cell division unlikely and raise a gain of function. The variant is therefore routed through a radial-glia and migration node, the knockdown's cytokinesis failure is a provisional branch carrying one SUPPORT and one REFUTE item, and the disagreement with the fly overexpression data is a HUMAN_MODEL_MISMATCH discussion. The variant node binds the actin-monomer and PI(4,5)P2-binding activities of MTSS2 without a modifier, because the variant lies outside the I-BAR domain and its effect on those activities has not been measured; no functional_impact_category is set because the model systems disagree.

    Naming: MTSS2-Related Neurodevelopmental Disorder, following the entry-naming criteria: the gene-related name is in recurring use in recent primary literature (the titles of PMID:37657631 and PMID:39890443). MONDO lists no synonyms for the term, and there is no GeneReviews chapter or ClinGen record.

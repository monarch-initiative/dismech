  summary: 'Review round 1: phenotype frequencies from the pooled 11-patient table'
  details: |
    Answers the review of PR #18305, which pointed to Table 3 of PMID:41641084 (already cached), a pooled table of all eleven reported patients that the first version did not use. Each change below quotes the table row verbatim (pipes dropped), graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS because the table pools other groups' patients.

    Blocking items: added a Facial dysmorphism phenotype (HP:0001999 Abnormal facial shape, 10/10, OBLIGATE), folding in the eleventh patient's bitemporal narrowing and ptosis and removing the separate single-patient Ptosis and Narrow forehead rows; corrected Hearing impairment from rare to 4 of 9 with a known status (FREQUENT), removing the PMID:39890443 'rare manifestations' quote it contradicted; corrected Autistic behavior from one patient to 3 of 9 assessed (FREQUENT).

    Suggestions taken: frequency bands from the table on intellectual disability (rebound from Mild intellectual disability to HP:0001249 Intellectual disability, 11/11, because one patient had severe disability; the synaptic node's edge was retargeted), microcephaly (11/11), ocular anomalies (9/11, VERY_FREQUENT) and seizures (rebound from Generalized-onset seizure to HP:0001250 Seizure, because the table counts seizures of any type; the table prints 36.7% for 4/11, which is 36.4%, FREQUENT either way); added Growth delay (2/10, OCCASIONAL) and Specific learning disability from the PMID:39890443 common-features sentence; reframed the ocular knowledge gap as variable specific findings rather than rare eye involvement; and replaced 'every variant arose de novo' with de novo in every patient whose parents were tested (9 of 11), citing the table's inheritance row.

    Not taken: the non-specific brain MRI, psychiatric and skeletal findings from PMID:39890443, which would only bind coarse HPO terms with no specific finding behind them.

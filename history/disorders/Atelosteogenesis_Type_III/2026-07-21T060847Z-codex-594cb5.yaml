  summary: 'Review: Atelosteogenesis Type III survival and mechanism audit'
  details: |
    Reframed FLNB-AO3 as a severe but variably survivable monoallelic FLNB gain-of-function disorder rather than uniformly perinatal lethal. Added current Orphadata identity, dual case-count and point-prevalence records, phenotype frequencies, congenital-to-adult progression, high but variable clinical burden, and explicit spectrum boundaries. Rebuilt the causal pathograph with evidence on every edge while preserving unresolved protein-interaction and tissue-bridge uncertainty; added molecular and radiographic diagnosis, individualized respiratory and orthopedic care, genetic counseling, and four major differentials. The 2026-07-21 ClinicalTrials.gov search found no AO3-specific studies; all new reference caches were generated through the repository helper.

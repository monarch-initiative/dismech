  summary: 'Create: Chitayat_Syndrome'
  details: |
    New entry for Chitayat syndrome (MONDO:0014956), the ultrarare autosomal dominant disorder caused by the recurrent ERF ETS-domain missense variant c.266A>G p.(Tyr89Cys). Falcon was requested but is not configured in this environment; the run fell back automatically to claude_code (research/Chitayat_Syndrome-deep-research-claude_code.md, 14/14 references resolved, one off-topic reference, PMID:17515308, which describes an unrelated syndrome of the same name). Evidence comes from the 1993 index report (PMID:8418638), the 2017 gene-discovery series (PMID:27738187), later case reports and series (PMID:30569521, 30728880, 32592542, 41567031), a 2025 literature review of 15 confirmed cases that supplies the phenotype frequencies (PMID:40763971), and ERF allelic-disorder papers used only for the craniosynostosis contrast and the predicted DNA-binding effect (PMID:23354439, 38824261, 39668184). The pathograph has the variant node, a predicted DNA-binding impairment node (computational and structural inference only; no functional assay exists), and edges with unknown intermediates to the core phenotypes. Two discussions record the open pathomechanism (why p.Tyr89Cys does not cause craniosynostosis, unlike ERF haploinsufficiency) and a 2025 report (PMID:40840652) that labels a truncating ERF frameshift as Chitayat syndrome; that report is not used as phenotype or treatment evidence. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (52/52), validate-disorders, check-causal-targets, check-entity-refs and check-duplicate-keys. The stub was deleted.

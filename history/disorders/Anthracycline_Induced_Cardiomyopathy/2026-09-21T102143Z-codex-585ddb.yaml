  summary: Review anthracycline cardiomyopathy mechanisms and risk-adapted care
  details: 'Comprehensive review of the original entry and matching deep research against all six original
    cited sources, using genuine full scientific bodies where available. Recovered the TTN study as canonical
    full XML, mitochondrial iron experiments, the 2024 clinical review, pediatric dexrazoxane guidance,
    the full ESC 2022 guideline and long-term childhood-survivor dexrazoxane follow-up. Consulted the
    full DCM GeneReviews context; its explicit exclusion of acquired DCM prevents importing nonsyndromic
    genetic-management recommendations. Canonical TOP2B knockout, Cardinale recovery and spironolactone
    trial records remain abstract-limited after retrieval attempts; failed CAPTCHA or metadata-only pages
    were excluded.


    Rebuilt the graph into eleven atomic processes, separating TOP2B/DNA injury, mitochondrial biogenesis,
    ABCB8/iron handling, oxidants, mitochondrial and sarcomere structure, cell death, remodeling and contractile
    impairment. Removed the unsupported serial TOP2B-to-iron and mitochondrial-to-sarcomere routes and
    universal irreversibility. Added clinical phenotypes, biomarker interpretation, diagnostic criteria,
    progression and risk-adapted prevention, HF management, interruption/rechallenge and surveillance.
    Corrected RARG functional evidence to cell experiments, qualified selected TTN cohort denominators
    and recovery findings, and retained limited spironolactone prevention evidence without clinical ranking
    claims. Added three animal and four culture models with actual readouts and translation limits. Updated
    the existing node-class example for this disorder''s renamed contractile-function node.


    Independent bounded peer review covered the TOP2B culture paper and applicable ESC care recommendations;
    the final independent topology/model integration check removed unproven sequestration-to-iron and
    biogenesis-to-ROS mediation arrows while preserving the measured outcomes as context and parallel
    branches. Authoritative validation passes schema, live ontology and 128/128 evidence snippets; all
    25 additional guards and whole-KB node-class example checks pass. History and final formatting hooks
    are checked before publication. No reference cache was hand-edited and the frozen dataset accession
    cache was neither read nor changed.

    '

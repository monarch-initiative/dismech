  summary: Create Anthracycline-Induced Cardiomyopathy conforming to cardiomyopathy_maladaptive_remodeling
  details: |
    New entry for the archetypal dose-limiting cardiotoxicity of cytotoxic cancer therapy, absent from the KB and explicitly named as a use case in the cardiomyopathy_maladaptive_remodeling module's own description.

    The entry turns on the isoform distinction, which is what makes the toxicity mechanistically interesting rather than merely dose-related. Proliferating tumour cells express topoisomerase II-alpha, which is the antitumour target; quiescent cardiomyocytes express topoisomerase II-beta instead, and disruption of that isoform is what injures the heart. The causal evidence is loss-of-function: silencing TOP2B in human iPSC-derived cardiomyocytes reduces doxorubicin-induced apoptosis and preserves mitochondrial and sarcomere ultrastructure. That experiment is also what licenses modelling mitochondrial and sarcomere injury as a node DOWNSTREAM of the trigger rather than as a parallel consequence, since removing the upstream lesion preserves both.

    Three pathophysiology nodes, two conforming to the module (Primary Cardiomyocyte Insult, Progressive Contractile Dysfunction). The exposure is wired in with influences_mechanisms and carries exposure_classifications recording that the route is parenteral and the duration intermittent, with risk driven by cumulative rather than per-cycle dose. Dexrazoxane is joined to the trigger node with INHIBITS, since it acts on the initiating injury rather than on established remodelling.

    The exposure binds the substance-level ECTO:0000509 (exposure to drug), with a notes line recording that dismech validates ECTO against sqlite:obo:ecto, so a term resolving in OLS is not sufficient to bind here. That constraint was established the hard way on PR 10366 earlier today and is recorded so the next curator does not repeat the round trip.

    Deep research was run with claude_code and is committed as provenance. No quote from it was curated; all six evidence snippets were independently sourced from PubMed and pre-verified against the local cache before being written, and all reference_title values were generated from cache rather than typed.

    Validated with just validate-disorders (batched sweep CI runs), just count-verified-snippets (8/8), just check-duplicate-keys, and a graph build showing 4 edges, no integrity issues, and the exposure and treatment both joined.

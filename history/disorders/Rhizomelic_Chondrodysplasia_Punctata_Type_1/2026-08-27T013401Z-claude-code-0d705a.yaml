  summary: Refresh ISDS provenance to 2023 revision; add Harrison's and ICIMD
  details: |
    Reviewed the existing chondrodysplasia_punctata assignment as part of a sweep over ISDS group 23. The assignment itself was correct but carried only 2019-revision provenance (group 21). Updated the notes to the 2023 revision with the row identifier NOS 23-0060 and the MIM number, retaining the 2019 provenance as the carried-forward record - the row number is quoted here because group 23 contains five rhizomelic-CDP rows differing only by gene. Added harrisons_chapter (GENETICS_ENVIRONMENT_DISEASE and ENDOCRINOLOGY_METABOLISM) and icimd_category peroxisomal_biogenesis, the last chosen over glycerophospholipid_metabolism because PEX7 is a peroxin and the lesion is at the import step - the discriminator from RCDP2/3/4. No content outside the classifications block was changed.

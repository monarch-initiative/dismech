  summary: 'Create: Spermatogenic_Failure_23'
  details: |
    Created the SPGF23 (TEX14, MONDO:0054727) entry from the stub, claimed in #14667. Pathophysiology is a chain: TEX14 loss -> failed germ cell intercellular bridge formation (CEP55/ALIX block on abscission) -> asynchronous spermatogonial differentiation, retrotransposon derepression and meiotic prophase I failure -> non-obstructive azoospermia. Phenotypes record the variable testis histology (spermatocyte arrest, spermatogonial arrest, Sertoli-cell-only) rather than one arrest stage. Evidence is from primary papers fetched by PubMed search (Gershoni 2017, Fakhro 2018, Krausz 2020, Li 2025, Xu 2026, the Tex14 mouse and pig models). Deep research: falcon was requested but the Edison key returned 403; the run used --fallback and OpenScientist produced research/Spermatogenic_Failure_23-deep-research-openscientist.md (first OpenScientist attempt failed with a ReadError and was retried). That report's references were retro-validated (18/18 resolved, 9/9 quotes found, 0 off topic); term validation 20/20 resolved; preflight-dr named TEX14 (70 mentions) with CEP55 as its binding partner. From the report, Fakhro 2018 (PMID:29790874) was added; its diagnostic-yield and karyotype papers were not used because they do not report TEX14 carriers. No GeneReviews chapter (check-genereviews NO_CHAPTER). A pre-PR red-team subagent review led to scoping the sperm-retrieval claim (Krausz recruited TESE-negative men), correcting one Krausz patient to compound heterozygous, crediting Krausz rather than Riera-Escamilla, dropping an inferred spermatogonial edge, and adding the Tex14 hypomorph model. Validated with just validate (54/54 snippets) and count-verified-snippets.

  details: |
    disease_term moved from MONDO:0005061 lung adenocarcinoma to MONDO:0005233 non-small cell lung carcinoma, and a mappings.mondo_mappings row records skos:narrowMatch to it (issue 10113, design decisions section 3a). The entry is named and described as an NSCLC stratum, and the driver also occurs outside adenocarcinoma histology, which is the reason ALK_Rearranged_NSCLC and BRAF_V600E_Mutant_NSCLC already anchor to NSCLC. Evidence describing adenocarcinoma as the predominant histology is unchanged and still accurate. Decision confirmed by Harry Caufield. Terms validated with just validate-terms.

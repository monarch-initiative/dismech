  summary: 'Create: Neurodevelopmental Disorder with Microcephaly, Impaired Language,
    and Gait Abnormalities (NEDMILG, NARS1)'
  details: |
    New entry for MONDO:0100348 / OMIM:619091 (NEDMILG), the AUTOSOMAL RECESSIVE arm of the NARS1-related neurologic disorder spectrum, caused by biallelic hypomorphic NARS1 (hgnc:7643) variants.

    Deep research providers: falcon was attempted first (the /curate default) but the Edison Scientific API returned HTTP 402 Payment Required, so no falcon report exists for this entry. Two substitute providers were run instead: claude_code (297s, 9 web searches, 8/8 references resolved, 0 unresolved, 0 off topic) and openscientist (1202s, 11/11 references resolved, 1/1 quoted claim valid, 0 unresolved, 0 off topic). Both reports are committed under research/. Named Entity Confusion preflight (just preflight-dr) was run against MONDO:0100348 for BOTH reports and returned PASS on each (claude_code: NARS1=38 mentions, report OMIM 619091/619092 vs MONDO xref 619091; openscientist: NARS1=56 mentions).

    DR outputs were treated as leads only, and several of their identifiers were wrong: the claude_code report gave HGNC:7645 for NARS1 (correct is hgnc:7643), CL:0002608 for radial glial cell (correct is CL:0000681), and attributed the organoid paper to "Lin et al." with only a PMC id and an incorrect related PMID (the real record is PMID:32788587, Wang et al.). Every ontology term and PMID in the entry was independently verified against OAK/OLS and the fetched abstracts rather than copied from the reports.

    GeneReviews baseline (mandatory step): PMID:40014750 "NARS1-Related Neurologic Disorders" was found, fetched, tagged GeneReviews in the top-level references block, and mined section by section. Every phenotype in its Clinical Characteristics list is now represented (global developmental delay, intellectual disability, microcephaly, ataxia, seizures, spasticity/hypotonia as the bidirectional tone abnormality, peripheral neuropathy with distal lower-limb atrophy, and the explicitly rare neurobehavioral/psychiatric manifestations at VERY_RARE), as is its multidisciplinary management list (supportive care, physical therapy, speech and language therapy, antiseizure pharmacotherapy, orthopaedic management of scoliosis/kyphoscoliosis, gastrostomy feeding, genetic counselling). GeneReviews lists no Agents/Circumstances to Avoid for this disorder.

    Content: 7-node pathophysiology chain forming a single connected pathograph (biallelic hypomorphic NARS1 variants -> reduced cytoplasmic asparaginyl-tRNA charging -> impaired global protein synthesis, which then branches to radial glial progenitor proliferation failure -> progressive cortical volume reduction, and in parallel to peripheral nerve involvement, both converging on combined CNS/PNS dysfunction); 23 phenotypes; genetic section with three curated variant entries including the recurrent recessive p.Arg545Cys; two experimental models wired to the pathograph via modeled_mechanisms with readouts (the patient-derived cortical organoid as flagship, plus patient fibroblasts/iNPCs); three diagnosis entries; three differential diagnoses; three discussions.

    Scope discipline: the allelic dominant entity NEDMILEG (MONDO:0030837 / OMIM:619092) and dominant NARS1 hereditary neuropathy are deliberately excluded and curated as differential diagnoses instead, with the mechanistic distinction (hypomorphic loss of function versus dominant-negative homodimer poisoning) recorded. Where a source reports on the whole NARS1 spectrum rather than the recessive arm, the evidence item is marked supports: PARTIAL and the explanation says so.

    Discussions: an EMERGING_HYPOTHESIS on asparagine supplementation (PMID:42381704 rescued patient fibroblast proliferation and prevented ISR activation, but only for the DOMINANT nonsense alleles R534X/R522X, so transfer to the recessive genotype is untested), carrying a REFUTE-tagged safety counterpoint from the nearest phenocopy where supplementation worsened seizures (PMID:27268761); a HUMAN_MODEL_MISMATCH recording that the organoid models only the developmental arm and the sole mammalian NARS1 knock-in carries a dominant neuropathy allele; and a KNOWLEDGE_GAP on the absence of genotype-phenotype correlation.

    The openscientist run contributed the asparagine synthetase deficiency (ASNS, OMIM 615574) differential, its congenital-microcephaly and simplified-gyral-pattern discriminators, and the supplementation safety signal. Its claim that asparagine is normal in NARS1 disease is recorded as an explicitly untested inference, not as a finding, because its cited sources address only the ASNS side; a proposed experiment to measure it in a NARS1 cohort was added.

    No datasets block: just discover-datasets returned no GEO candidates, and a gene-only NARS1 search would surface antisynthetase-syndrome series, so none was fabricated.

    Validation: just validate passed (schema, terms, references). just count-verified-snippets reported 107/107 snippets verified against cached references. just validate-disorders (the batched CI check, which is what CI runs) passed in full. just check-duplicate-keys passed. just check-title-snippets reported no findings for this file. Compliance 93.5 percent global, 93.9 percent weighted.

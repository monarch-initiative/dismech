  details: |
    Created Brunner Syndrome (MAOA deficiency, MONDO:0010379, X-linked recessive, hgnc:6833 MAOA) from the claude_code deep-research report. Curated a 10-node unbundled pathophysiology chain (MAOA LOF -> loss of MAO-A activity -> impaired oxidative deamination -> monoamine accumulation / depleted deaminated metabolites / elevated O-methylated metabolites -> peripheral serotonin excess and altered central monoaminergic neurotransmission, plus developmental and NMDAR branches), 11 HPO-bound phenotypes, genetic (MAOA with 7 variants and a ClinGen Definitive gene_disease_validity assertion), biochemical (serum serotonin, urinary normetanephrine up; 5-HIAA, VMA down), diagnosis, treatments (SSRI/SARI, clonazepam, low-amine diet, MAOI-avoidance, counselling), 5 discussions (warrior-gene overinterpretation controversy, developmental-vs-acute question, mouse aggression model mismatch, female carrier/XCI gap, MAOA/MAOB deletion scope). All 77 snippets verified exact against cached abstracts; validate, validate-terms, entity-refs, causal-targets, gene-activity-grounding, name-collisions, coarse-phenotypes, enum-values, duplicate-keys, block-scalar-comments, logical-rules, snippet-grading all pass. No GeneReviews chapter exists (confirmed offline+online with synonyms and MAOA gene symbol). Behavioral-genetics claims deliberately bounded: MAOA-uVNTR warrior-gene literature kept distinct from the rare complete-LOF syndrome.

  summary: 'Create: Epidermolytic_Palmoplantar_Keratoderma_1'
  details: |
    New entry for MONDO:0007758, the KRT9 form of epidermolytic palmoplantar keratoderma, curated from the stub (entry_type decided as DISEASE: a MONDO leaf with one causal gene and one pathograph); the stub is deleted in the same change. Curated together with a review of KRT9 gene function in ai4curation/ai-gene-review (branch claude/krt9-eppk-review, PR 7117); the two were compared and agree on domain boundaries, heptad register, conservation and the dominant-negative mechanism.

    Sources. The Asta retrieval report (research/Epidermolytic_Palmoplantar_Keratoderma_1-deep-research-asta.md) returned a general palmoplantar keratoderma reading list; just preflight-dr gives WARN on it because KRT1 is mentioned slightly more often than KRT9, which is expected for a list covering the KRT1 form too, and no evidence item was taken from it. Evidence comes from a direct PubMed search (query: KRT9[TIAB] OR keratin 9[TIAB], 108 records read by title) and the abstracts or PMC full texts cached with just fetch-reference. An OpenScientist disease-level run was submitted three times: the first was cancelled by the client at its 3600 s default timeout, the second was rejected because 9000 s exceeds the provider maximum, and the third (7200 s, the provider maximum) did not finish within two hours and was stopped without a report. An OpenScientist hypothesis run for k9_yap1_cytoplasmic_retention also ran for two hours without returning a report. No OpenScientist output was used, and no report or hypothesis directory is committed. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER).

    Computed for this entry (2026-11-26): variant positions against UniProt P35527; heptad register of coil 1A by hydrophobic phase fit; identity across the 28 reviewed human type I keratins (pyfamsa alignment); AlphaFold AF-P35527-F1 v6 pLDDT by domain; side-chain distances to the type II partner in PDB 6UUI, 4ZRY and 3TNU; gnomAD v4.1 gene constraint and allele counts through the gnomAD API; ClinVar classifications through E-utilities. The 1994-2006 literature numbers keratin 9 one residue lower than UniProt; all variant names in the entry use UniProt numbering with the legacy names as synonyms.

    Decisions. p.Cys406Arg and ClinVar p.Tyr558Ter are recorded in genetic notes as not credible causal alleles and are not listed as variants. Digital mutilation, palmar constriction and the L1 18 bp deletion are noted but not curated because PubMed holds no abstract for the reporting papers. No model identifier is recorded in this file by session policy.

    Validation: just validate-disorders (schema, terms, 86/86 snippets under --no-full-text), just count-verified-snippets, and the whole-repo KB gates listed in CLAUDE.md all pass; just check-gene-namespaces-online added the MGI:96696 Krt9 cache row. Four tracked reference caches that a re-fetch rewrote were restored to their committed versions and the snippets re-verified against those.

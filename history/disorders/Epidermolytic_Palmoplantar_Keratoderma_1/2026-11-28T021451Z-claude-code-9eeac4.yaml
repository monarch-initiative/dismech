  summary: 'Curate phenotypes: Epidermolytic Palmoplantar Keratoderma 1'
  details: |
    Phenotype pass. Added six phenotypes (palmoplantar blistering, friction-related accentuation, impaired temperature and tactile sensation, epidermal acanthosis, hypergranulosis) and enriched six existing ones (infantile onset and non-transgredient extent for the keratoderma, more pedigree and literature-tally evidence for the erythematous border, knuckle pads, hyperhidrosis, fissures and camptodactyly). New phenotypes are wired from existing pathophysiology nodes or as sequelae of the keratoderma. PubMed and Europe PMC were blocked by the network proxy, so the pass used cached references only, chiefly the two KRT9 literature tallies PMID:30666268 and PMID:31525823. Fungal superinfection, nail lesions, scaling and cancer cosegregation were recorded in notes as leads. HP:0010830 was resolved from the HPO 2026-09-01 release file because OLS was unreachable. just validate-disorders passed; 110/110 snippets verified. After the first review (PR #19222, approved with optional suggestions), the blistering snippet was trimmed to the clause that names blistering, and a note was added to the friction phenotype explaining the use of a focal HPO term for accentuation of a diffuse keratoderma.

  summary: 'Create: Peritonsillar Abscess'
  details: |
    Created a standalone Peritonsillar Abscess entry from the local infectious-disease aggregate and OpenScientist report.

    Added MONDO identity, synonyms, Danish annual-incidence evidence, Fusobacterium necrophorum and Streptococcus pyogenes infectious-agent evidence, an endogenous tonsillar-salivary-duct spread route, smoking exposure as a modifiable risk association, a pathograph spanning Weber/tonsillar infection through peritonsillar pus and split contiguous versus Lemierre-syndrome complications, HPO-backed or termless phenotype rows for the common presentation, drainage/antibiotic/steroid/tonsillectomy treatment rows, and diagnostic rows for pus confirmation, contrast CT, and intraoral ultrasound.

    Addressed first-round review by moving fever and cervical lymphadenopathy directly under the infectious node, replacing the bundled oropharyngeal pain/dysphagia node with direct sore-throat, odynophagia, dysphagia, and referred-otalgia edges from the pus collection, splitting aggregate deep-neck and hematogenous complications, adding smoking, adding sore throat, and removing the deprecated updated_date field from the new entry.

    Validated the entry with schema, ontology-term, causal-target, disconnected-phenotype, and exact-snippet checks before the final PR sweep.

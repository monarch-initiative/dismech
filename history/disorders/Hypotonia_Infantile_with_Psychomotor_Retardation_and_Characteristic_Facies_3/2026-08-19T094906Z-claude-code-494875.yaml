  details: |
    De-novo curation of IHPRF3 [MONDO:0014823, OMIM:616900, TBCK / hgnc:28261] as a standalone Mendelian entry.

    Duplicate preflight: git grep over origin/main kb/disorders plus GitHub PR and issue search found no existing entry and no in-flight PR. Open discussion issue #8451 - lump-vs-split of the IHPRF numbered series - recommends keeping TBCK separate from the NALCN/UNC80 channelosome pair; this entry follows that and records the rationale in the description and in an OPEN_QUESTION discussion.

    Deep research: the default falcon provider failed with HTTP 402 - the Edison account is out of credit - so two other providers were run instead, claude_code and openscientist. Both passed just preflight-dr against MONDO:0014823 with verdict PASS: TBCK was the dominant gene mention in each report and the report OMIM matched the MONDO xref 616900. Report reference validation: claude_code 9/9 references resolved, confabulation_rate 0.0; openscientist 20/20 resolved, confabulation_rate 0.0 but needs_review true for one unsupported quote from PMID:42563865, which was not used in this entry. The openscientist report also carried three incorrect identifiers - MONDO:0014635, ORPHA:494526, HGNC:28348 - so every identifier in the entry was taken from OAK lookups instead.

    GeneReviews baseline: PMID:40504974 TBCK-Related Neurodevelopmental Disorder was fetched, cached, and tagged GeneReviews in the top-level references block. Its Clinical Characteristics were cross-referenced item by item into phenotypes - hypotonia, non-ambulation, absent speech, dysphagia and gastrostomy, distal-onset motor neuronopathy, respiratory progression, seizures, regression, white-matter lesions and cortical atrophy, optic atrophy, contractures, neuromuscular scoliosis, coarsening facies, nephrolithiasis, recurrent UTIs, dyslipidemia, left ventricular hypertrophy - and into treatments. The Agents/circumstances to avoid warning about adverse reactions to bisphosphonate infusions is captured on the bisphosphonate treatment entry.

    Content: 14 pathophysiology nodes spanning the molecular-to-organism chain, with two competing curated mechanistic_hypotheses - the emerging TBCK-PPP1R21-FERRY3 RAB5-GAP endolysosomal model and the original mTORC1-downregulation model - and hypothesis-scoped causal edges rather than one blended chain. The negative result that mTORC1 is not inhibited in human neural progenitors or neurons is retained as REFUTE evidence and as a FAILS_TO_RECAPITULATE model link. Two animal models, four experimental models with readouts, and three discussions: the mTORC1 primary-versus-secondary knowledge gap, the proposed CLN15 classification, and the IHPRF series scope question. No lysosomal_storage classification is asserted while CLN15 remains a proposal. No datasets block was added: GEO returned zero hits for TBCK and just discover-datasets found no candidates, so none were invented.

    Validation actually run and read: just validate passed for schema and references; just validate-terms passed; just count-verified-snippets reported 157/157 verified against cached references; just check-duplicate-keys reported OK; just check-title-snippets reported no new title-quoting snippets; just validate-disorders - the batched pre-PR sweep CI runs, with --no-full-text - exited 0 with 157/157 snippets verified. Compliance was 98.2 percent global and 98.4 percent weighted.

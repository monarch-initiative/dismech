  summary: Enriched Pyruvate Kinase Deficiency with Harrison's classifications, PKLR gene/activity grounding, unbundled ATP depletion and 2,3-BPG accumulation nodes, anatomical and cell-type bindings, diagnostic workup, treatment modalities/target mechanisms, and full verbatim evidence snippets.
  details: >-
    Added Harrison's chapter classifications (ONCOLOGY_HEMATOLOGY,
    GENETICS_ENVIRONMENT_DISEASE) and icimd_category evidence. Grounded
    Erythrocyte Pyruvate Kinase Loss of Function with PKLR (hgnc:9020) and
    decreased erythrocyte pyruvate kinase activity (GO:0016301), split the
    bundled metabolic node into Erythrocyte Glycolytic ATP Depletion and
    Erythrocyte 2,3-Bisphosphoglycerate Accumulation backed by PMID:34744776,
    added blood/spleen locations and splenic red pulp macrophage cell types,
    and renamed the module-conforming hemolytic state node to Shortened
    Erythrocyte Survival and Chronic Hemolysis linked downstream to Chronic
    hemolytic anemia. Added a structured diagnosis section (PKLR molecular
    testing with indirect enrollment evidence and PK enzyme assay), replaced
    older truncated evidence fragments with full verbatim sentences, updated
    Splenomegaly/Jaundice phenotype categories, and enriched treatments with
    therapeutic modalities (OTHER on Red Cell Transfusion) and
    target_mechanisms.

  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 17 (DFNA17, MYH9)'
  details: |
    New Disease entry for DFNA17 (MONDO:0011350, OMIM:603622), MYH9 p.Arg705His autosomal dominant progressive sensorineural hearing loss. Six pathophysiology nodes. The central curation decision was to leave the lump/split question open rather than resolve it: PMID:24890873 argues explicitly that DFNA17 should not be a separate genetic entity but part of the MYH9-related disease spectrum, having found the same p.Arg705His allele in two families with full MYH9-RD haematology. That argument is curated as the leading differential diagnosis, as an open KNOWLEDGE_GAP discussion with a proposed resolving experiment, and in notes - and the MYH9-RD spectrum phenotypes are curated on this entry so that if lumping prevails the entry converts to a subtype without re-gathering evidence. Mechanism is curated as explicitly NOT haploinsufficiency: a heterozygous gene-trap Myh9 mouse with half-normal inner-ear mRNA has no hearing loss and no cochleosaccular degeneration, curated as a FAILS_TO_RECAPITULATE animal model with two UNCHANGED readouts. What the variant does instead - impaired motility with near-normal ATPase, reduced cross-bridge stiffness, thermal destabilization and aggregation - comes from the Dictyostelium R689H orthologue and is tagged IN_VITRO. Conforms to sensorineural_hair_cell_loss at the Cochlear Sensory Epithelium Insult node only, deliberately not at hair-cell mechanotransduction death, which has not been shown for this variant. GeneReviews MYH9-Related Disease (PMID:20301740) used as the phenotype baseline and tagged; its Agents/Circumstances to Avoid section curated as a treatment entry. Deep research: claude_code provider; preflight-dr PASS; report validation 18/19 verified, the single unresolved identifier being a markdown-mangled DOI for a paper already cited. Two of the report's suggested CL identifiers resolved to olfactory epithelial cell and phalangeal cell and were replaced with the correct cochlear hair cell terms. Validation: just validate passed, 48/48 snippets verified against cached references.

  summary: 'Review response: DFNA17 prevalence, phenotype placement, HP term'
  details: |
    Review-response session for PR #9246, superseding the state described in the CREATE record. Blocking item, fixed in fa724dd5 by ai4c-agent: the Japanese-cohort prevalence record carried prevalence_class ULTRA_RARE alongside rate_per_100000 153.0, three orders of magnitude apart in one record, and by the reviewer's survey the only one of 529 class-carrying prevalence records in the KB to combine the two that way. Applying the same test to phenotypes, Nephropathy and Presenile cataract were removed from phenotypes: and folded into the MYH9-RD differential with their GeneReviews evidence item: both rested only on statements about MYH9-RD and have not been reported in p.Arg705His carriers, so as phenotypes they exported disease-phenotype assertions the evidence did not carry, while on the differential they are the features whose appearance in a DFNA17 patient would settle the lump/split question. Macrothrombocytopenia and elevated liver enzymes stay, being directly evidenced in this allele. Bilateral profound hearing loss rebound from HP:0008619 to HP:0011476; a severity: SEVERE qualifier was added and then removed, because the term already encodes profound and SeverityQualifierEnum tops out at SEVERE which HPO grades as the adjacent lower band. The antibody cross-reactivity evidence item regraded SUPPORT to PARTIAL, since it limits the localization evidence rather than supporting the node. Snippet count moved 48/48 to 47/47 with the phenotype relocation. Validation: just validate-disorders passed; all five ungated CI gates clean.

  summary: 'LOINC tranche G: new audiometry row, no generic band'
  details: |
    The entry had no diagnosis: section. Added a Pure-Tone Audiometry row with the panel and 500/1000/2000/4000 Hz per-ear codes, all already cached from prior batches. No reference range is recorded: the entry's own cited cohort does grade severity, but on a generic dB scheme (mild/moderate/severe/profound by dB cutoffs) the disease does not own, the same kind of population grading the WHO/GBD scheme bound elsewhere also is. What the cohort reports as specific to DFNA17 is the rate of progression, not a static grade: hearing worsened by about 50 dB within 5 years in some cases, and head-domain variant carriers progress faster than tail-domain carriers, though both eventually reach bilateral profound loss. Part of LOINC tranche G batch 16 (projects/LOINC_DIAGNOSTICS.md).

    Review round: an earlier version of this record (and the entry's own notes) said the cohort "reports a deterioration rate rather than a single severity grade" -- that was wrong on the facts. PMID:41751538 does classify severity on a five-category dB scheme and reports patient counts per grade. The correct reason for not binding a band is that the scheme is generic (population-level, not DFNA17-specific), not that no grading exists.

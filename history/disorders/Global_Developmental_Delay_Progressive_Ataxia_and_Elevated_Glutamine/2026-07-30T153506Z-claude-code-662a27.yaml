  summary: 'Create: Global Developmental Delay, Progressive Ataxia, and Elevated Glutamine'
  details: |
    Created new entry for GDPAG (MONDO:0032733 / OMIM:618412), GLS glutaminase deficiency (GCA-repeat-expansion form). Curated the pathophysiology chain: 5'UTR GCA repeat expansion -> allele silencing -> phosphate-activated glutaminase deficiency -> impaired glutamine catabolism and glutamine accumulation -> neurodevelopmental and cerebellar phenotype. Phenotypes: global developmental delay, progressive cerebellar ataxia, cerebellar atrophy, hyperglutaminemia. Genetics: GLS, autosomal recessive. Prevalence: ultra-rare. Added ICIMD and Harrison classifications and two competing neuropathogenesis hypotheses (glutamate deficiency vs glutamine neurotoxicity). Evidence from three verified primary sources: PMID:30970188 (NEJM 2019), PMID:41865506 (Mol Genet Metab 2026), PMID:39699045 (Mov Disord 2025). Deep research provider: falcon (Edison). All snippets verified as exact substrings of cached abstracts; just validate passes; compliance 80.6%.

  details: |
    Answered the first review round on PR 11403. Blocking finding: the GPI-N-acetylglucosaminyltransferase node was bound to GO:0016757 (glycosyltransferase activity), the GO root for every glycosyltransferase, on the node carrying this disease's defining enzymatic lesion. Rebound to GO:0017176 (phosphatidylinositol N-acetylglucosaminyltransferase activity), which is an exact match for the preferred_term already recorded and is the term Developmental_And_Epileptic_Encephalopathy_38 (ARV1) uses on the structurally identical node. The term was already present in cache/go/terms.csv and the molecularfunctionterm enum cache, so no new cache rows were needed. Accepted the reviewer's suggestion to record why three pooled-cohort features from PMID:38456468 (corpus callosum anomalies 57 percent, central tegmental tract restricted diffusion 60 percent, renal anomalies 14 percent) are absent, so a reader can distinguish considered-and-excluded from missed. Before writing that note I checked every cached reference this entry cites for callosal or tegmental statements: the two hits are for other genes, the thin corpus callosum row in PMID:29310717 belonging to the HPMRS2 (PIGO) column and PMID:35562242 describing an SLC35C1 fucosylation disorder. Validation after the edit: just validate passed with 101/101 snippets verified, just validate-terms passed, check-duplicate-keys and check-enum-values clean, and just validate-disorders passed as the authoritative batched gate. just qc was not run because it exceeds the available tool timeout.

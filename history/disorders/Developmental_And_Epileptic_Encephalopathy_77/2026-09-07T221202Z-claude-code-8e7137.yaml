  summary: 'Create: Developmental_And_Epileptic_Encephalopathy_77'
  details: |
    New entry for DEE77 / PIGQ-CDG / MCAHS4 (MONDO:0032808, hgnc:14135 PIGQ), curated from the primary PIGQ literature plus a deep-research report.

    Deep research: falcon (Edison) was requested and returned HTTP 402 (out of credits); the run was launched with --fallback and openscientist produced the committed report (research/Developmental_And_Epileptic_Encephalopathy_77-deep-research-openscientist.md, fell_back: true, requested_provider: falcon, 1020 s). Its reference validation resolved 12/12 citations, confabulation rate 0.0, no unresolved references, 7/12 scored on topic. Its term validation carries needs_review: true for one obsolete CURIE (GO:0031225) and four label mismatches; none of those terms is bound in the entry. just preflight-dr returns WARN because 'GPI' is counted as a rival gene 82 times - a false positive, since GPI here is glycosylphosphatidylinositol rather than the glucose-6-phosphate isomerase gene; MONDO's OMIM xref (618548) matches the MCAHS4 number used in the primary literature.

    The report contributed PMID:11418246 (original GPI1/PIGQ characterisation with antisense knockdown), PMID:33607654 (neuronal Piga conditional-knockout mouse), PMID:35080266 (prospective vitamin B6 cohort in GPI deficiency) and PMID:17442906 (PIGM/butyrate proof of concept). Two of its citations were deliberately not used: PMID:19732866 (FOLR1 cerebral folate transport deficiency - the report itself calls the folinic-acid inference for PIGQ mechanistic conjecture) and PMID:40126049 (cannabidiol in monogenic epilepsies - names no PIG gene or GPI anchor). PMID:40718141 and PMID:31148362 were found outside the report by PubMed search.

    Hyperphosphatasia: the entry curates the observation, not the pathway inference. PMID:40718141 reports elevated serum alkaline phosphatase in 62% of the 13 published PIGQ patients, and PMID:29310717 documents elevation in PIGA patients (a partner subunit of the same first-step complex). That conflicts with PMID:22228761, which shows alkaline phosphatase is degraded rather than secreted in cell lines blocked before mannose addition, so a first-step block predicts a normal value. The conflict is recorded as a KNOWLEDGE_GAP discussion and in the entry notes rather than resolved; the caveat that the enzyme was not measured in every patient is recorded too. This deliberately does not follow the treatment given on the sibling PIGP entry, which states hyperphosphatasia arises only from late-stage defects.

    Named Entity Confusion controls: every sibling-gene or pathway-level result (PIGA, PIGM, PIGL/DPM2/PIGX, PIGV, and the 83-patient inherited-GPI-deficiency cohort) is graded SUPPORT with directness: INDIRECT and its explanation names the gene the result is actually about. The Piga conditional-knockout mouse is recorded in animal_models with fidelity: LOW and limitations naming the gene mismatch, because no PIGQ mouse exists.

    No conforms_to: there is no GPI-anchor-biosynthesis module, and the congenital_disorder_of_glycosylation module is scoped to N-glycosylation. Recorded as a discussion. No datasets block, to avoid a gene-keyed accession about an unrelated disease.

    Grouping: Developmental And Epileptic Encephalopathy 77 was added as a member_type: DISEASE member of kb/groupings/Disorders_of_GPI_Anchor_Biosynthesis.yaml; just check-groupings reports SATISFIED against the NECESSARY GO:0006506 criterion.

    Validation: just validate, just validate-terms, just validate-disorders (101/101 snippets verified), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-reference-titles, just check-environmental-evidence, just normalize-cache and just check-term-cache-integrity all pass. All snippets were extracted programmatically from references_cache rather than retyped; several sources carry non-breaking spaces, en dashes and hard line wraps.

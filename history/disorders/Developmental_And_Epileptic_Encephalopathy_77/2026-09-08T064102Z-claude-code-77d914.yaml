  details: |
    Answered the second review round on PR 11403. The reviewer found that the exclusion paragraph added in round 1 misattributed two source statements, and re-reading both cached files confirms the paragraph was wrong, though not in exactly the way the review described. PMID:29310717 is a six-column HPMRS comparison table and carries three separate callosal statements, not one: thin corpus callosum beside Hearing impairment 5 of 16 in the HPMRS2 PIGO column where the denominator of 16 matches that column's n; the same phrase inside the Further anomalies rare list in the HPMRS1 PIGV column; and Thin corpus callosum 9 of 26 in the HPMRS4 PGAP3 column. The round 1 note named only the PIGO column and wrote as though there were a single row, which understated the spread; the review named only the PGAP3 column, which omits the PIGO and PIGV occurrences. The corrected paragraph names all three with the denominator that fixes each to its column. On the second point the review is straightforwardly right and the round 1 note was wrong: the callosal sentence in PMID:35562242 belongs to GFUS-CDG, the GDP-L-fucose synthase disorder, and SLC35C1-CDG is the transporter disorder discussed in the preceding paragraph. The two were conflated when the note was written. The exclusion conclusion is unchanged and was never in doubt, since none of PIGV, PIGO, PGAP3 or GFUS is PIGQ. Validation after the edit: just validate passed with 101 of 101 snippets verified, and just validate-disorders passed as the authoritative batched gate. just qc was not run because it exceeds the available tool timeout.

  summary: Re-review dominant BEST1 retinopathy scope, graph, and translational evidence
  details: |
    Re-scoped the narrative and review notes to the MONDO/ClinGen dominant BEST1 umbrella while making the detailed phenotype graph explicitly BVMD-centered. Added the definitive ClinGen assertion, an established molecular definition, multimodal and genetic diagnosis, two differential diagnoses, current BIRD-1 and natural-history trial records, a patient-derived iPSC-RPE model, updated 2024-2026 natural-history and canine gene-therapy evidence, and three open mechanistic/translational discussions. Added evidence to every causal and EOG readout edge, connected all six phenotypes and the causal gene, repaired non-exact snippets, removed the overly broad generic bestrophinopathy synonym, and documented that no disease-specific public omics dataset was identified in the accession-level GEO review.

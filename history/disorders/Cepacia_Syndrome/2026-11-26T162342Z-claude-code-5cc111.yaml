  summary: 'Create: Cepacia_Syndrome'
  details: |
    De novo curation of cepacia syndrome (MONDO:0958151), the acute necrotizing pneumonia with bacteremia caused by Burkholderia cepacia complex, chiefly in cystic fibrosis. Bound BCC complex, B. cenocepacia, and B. multivorans to NCBITaxon. Modeled intramacrophage survival (conforms_to intracellular_pathogen_persistence), intrinsic multidrug resistance, LPS/TLR4 hyperinflammation, systemic dissemination/bacteremia, necrotizing pneumonia and septic shock, wired to 8 phenotypes. Treatments: combination IV/inhaled antimicrobials, adjunctive corticosteroids/cyclosporin, and lung transplantation (B. cenocepacia a contraindication, worse survival, recorded honestly). CF and CGD as predisposing environmental hosts; patient-to-patient transmission and segregation. Deliberately lumped BCC species and host contexts as one pathogen-defined syndrome. Evidence from primary case series, systematic review, transplant cohorts, and LPS/macrophage studies.

  summary: 'Edit: three competing cGKII downstream routes and two new animal models'
  details: |
    The entry previously modelled one downstream route from cGKII. The literature supports three, each established in a different system and none excluding the others: c-Raf-1 Ser43 with MAPK restraint (CANONICAL, the only route assayed against human AMDP alleles), SOX9 nuclear exclusion (ALTERNATIVE, from the cGKII-deficient KMI rat), and GSK-3beta inactivation with beta-catenin accumulation (ALTERNATIVE, the only route tested by genetic epistasis in a mammal). Two new pathophysiology nodes carry the alternative routes and all edges are tagged with their hypothesis group. Added the Prkg2-null mouse, including the negative CNP-rescue readout that places the lesion downstream of cGMP production, and the KMI rat. The vosoritide discussion was rewritten around a 2026 basket trial and now states the asymmetry that makes AMDP the harder case than NPR2 deficiency. A new discussion proposes the three-readout experiment that would arbitrate the routes. Pathograph GO coverage completed across all nodes, including collagen biosynthesis and extracellular matrix organization on the collagen-program node. Snippets 65/65 verified.

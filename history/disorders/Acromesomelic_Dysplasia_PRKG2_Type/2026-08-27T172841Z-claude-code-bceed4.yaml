  summary: 'Edit: address PR #9648 review findings'
  details: |
    Response to PR review findings 1, 3 and 5. Finding 1: the node 'Unrestrained FGF2-Induced ERK1/2 Signaling' asserted a direction the entry's own knowledge gap called unresolved. Renamed to 'Loss of cGKII Restraint on the c-Raf-1/ERK1/2 Cascade' and reworded the incoming edge and the canonical hypothesis to describe loss of regulation rather than an increase. The node description now records why the direction is hard to read from the sources: two of the three abstracts phrase the mutant effect ambiguously between reducing ERK activation and failing to reduce it, and only PMID:37789084 states it unambiguously, that the mutant was unable to down-regulate FGF2-induced MAPK signalling. The knowledge gap was rewritten to separate what is established (restraint is lost) from what is not (the magnitude and sign of the change in a growth plate). Finding 3: added an explicit empty treatments section, so the absence of published management is a curated statement rather than an omission. Finding 5: the Angus cattle link's limitations now record that dwarf cattle show COL10 increased while the human alleles downregulate COL10A1, so the model supports the regulatory claim and not the human direction of effect.

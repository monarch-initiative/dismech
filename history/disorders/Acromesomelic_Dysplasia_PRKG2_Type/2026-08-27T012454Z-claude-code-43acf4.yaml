  summary: 'Create: Acromesomelic Dysplasia PRKG2 Type'
  details: |
    De-novo curation while reviewing ISDS 2023 nosology group 16. Bound to MONDO:0030553 (OMIM 619636). The mechanism chain runs from biallelic PRKG2 loss, through loss of cGKII kinase activity downstream of CNP/NPR-B, failure to phosphorylate c-Raf-1 at Ser43, dysregulated FGF2-induced ERK1/2 signalling and a shifted SOX9-dependent COL10A1/COL2A1 program, to reduced endochondral longitudinal growth. The ERK1/2 node is annotated ABNORMAL rather than INCREASED, and a knowledge-gap discussion records why: the published assays are HEK293T transfection experiments whose reported phrasing differs between studies. Two naturally occurring animal models (Angus cattle PRKG2 R678X, Dogo Argentino splice-donor) are linked through modeled_mechanisms. There is no treatments section, because nothing is published; a knowledge-gap discussion records the vosoritide question instead of inferring a therapy. All 35 evidence snippets verified against the reference cache.

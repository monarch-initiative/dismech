  summary: 'Create: Craniometaphyseal Dysplasia'
  details: |
    Created the craniometaphyseal dysplasia (CMD, MONDO:0015465) entry from
    scratch; the disease was absent from kb/ entirely, with no prior PR.

    Shape. One Disease entry with two has_subtypes, AD-CMD (ANKH, bound to
    MONDO:0007397) and AR-CMD (GJA1, bound to MONDO:0009035). They share one
    clinical definition and radiographic phenotype and differ only in causal
    gene and mode of inheritance, so the discriminators are expressible as
    subtypes. The subtypes are NOT decorative: real subtype: back-references
    are carried by 7 phenotypes, both genetic records, and one imaging finding,
    and each subtype carries its own genes and inheritance block with evidence.

    Mechanism. Nine pathophysiology nodes. Two competing models are curated
    explicitly as mechanistic_hypotheses rather than picking one:
    ppi_depletion_model (CANONICAL) - reduced ANKH pyrophosphate export lowers
    extracellular PPi and lifts the brake on hydroxyapatite formation, supported
    by the frog-oocyte transport assay (PMID:17186460) showing CMD-mutant ANK
    transports no PPi, and by reduced plasma PPi in the knock-in mouse
    (PMID:39165910); and impaired_bone_cell_differentiation_model (ALTERNATIVE)
    - high bone mass arises principally from impaired osteoclast and osteoblast
    differentiation, supported by partial rescue of increased bone mass by bone
    marrow transplantation (PMID:21149338). Causal edges opt into the model they
    belong to via hypothesis_groups. Three findings that resist the canonical
    model are curated rather than smoothed over: the hyperostotic bone is itself
    hypomineralized and immature (PMID:19257826, curated as its own node),
    compensatory ENPP1 activity can leave extracellular PPi comparable to wild
    type (PMID:21149338, recorded as PARTIAL), and ENPP1-Fc restores plasma PPi
    without rescuing the skeleton (PMID:39165910). A KNOWLEDGE_GAP discussion
    records the resulting open question with two proposed experiments.

    Deliberately NOT conformed to defective_skeletal_mineralization. CMD sits at
    the opposite end of the same pyrophosphate axis as that module's
    inhibitor-excess arm: the module models mineralization FAILURE reached by
    substrate deficiency or uncleared pyrophosphate, whereas CMD is a
    high-bone-mass disease reached by pyrophosphate depletion. Conforming would
    require asserting impaired mineralization as the rate-limiting step, which
    is not what CMD does. osteoporosis_bone_resorption was also considered and
    rejected because its terminal direction is net bone LOSS. The full argument,
    including the one finding that could be mistaken for grounds to conform, is
    written into the entry notes.

    Discussions: one KNOWLEDGE_GAP on pyrophosphate-model sufficiency, one
    HUMAN_MODEL_MISMATCH on whether human CMD bone is hypomineralized as the
    mouse bone is (the finding rests entirely on the mouse), and one
    KNOWLEDGE_GAP on the AR/connexin-43 mechanism, since Cx43 ablation models do
    not phenocopy the R239Q knock-in (PMID:39848944) - that edge is therefore
    curated as INDIRECT_UNKNOWN_INTERMEDIATES rather than asserting a route.

    Models: two animal models (Ank Phe377del knock-in; Cx43 R239Q knock-in) and
    one experimental model (CMD patient and isogenic hiPSC-derived osteoclasts),
    all with modeled_mechanisms links carrying fidelity, limitations, readouts
    and evidence.

    Treatments: surgical decompression of narrowed cranial foramina (with the
    elevated complication rate recorded as PARTIAL), craniofacial contouring
    (with the bone-regrowth caveat), sensory aids/supportive care, and genetic
    counseling. No medical therapy that reverses the hyperostosis is asserted,
    because none is established.

    Prevalence is recorded as NOT_YET_DOCUMENTED with no rate. No population
    based estimate was found, and the falcon report independently reached the
    same conclusion; a rare-disease band would have been an inference, not a
    measurement. Phenotype frequency: was omitted throughout for the same
    reason.

    Named Entity Confusion check. MONDO nests craniodiaphyseal dysplasia
    (MONDO:0009031, MONDO:0021021) under craniometaphyseal dysplasia. These are
    different diseases whose names differ by one syllable. No craniodiaphyseal
    content was curated here; the two craniodiaphyseal mentions in snippets are
    inside verbatim multi-disorder lists from the cited papers. The nesting is
    flagged in notes as a possible MONDO NTR and deliberately not acted on.

    Deep research. `just research-disorder claude_code` timed out at 1800s and
    produced no report; asta is not available in this environment. A falcon run
    succeeded (research/Craniometaphyseal_Dysplasia-deep-research-falcon.md,
    789s, 6/6 references resolved, confabulation_rate 0.0). `just preflight-dr`
    against MONDO:0015465 returned SKIP because MONDO records no causal gene for
    the parent term, so the manual preflight was run instead: top gene mentions
    were ANKH=38 and GJA1=24, the two correct CMD genes, and the report OMIM
    123000 matches the MONDO:0007397 xref, so no entity confusion. Note the
    entry was curated from GeneReviews and primary literature BEFORE the falcon
    report existed; no curated claim is sourced from it. One falcon artifact is
    used: image-1.png, Figure 2 of PMID:39165910, attached to that paper's
    evidence item because it directly shows IMA2a failing to correct skull
    radiopacity, mandible size, and metaphyseal flaring.

    Validation, all run and output read: just validate (passed), just
    validate-terms (passed), just count-verified-snippets (75/75 verified
    against cached references), just check-duplicate-keys (whole KB, 4238 files,
    clean), just check-title-snippets (no new title-quoting snippets), just
    validate-disorders on the changed file (the batched schema+terms+references
    sweep CI runs), just check-term-cache-integrity and just check-cache-order
    (clean), and pytest tests/test_data.py filtered to subtype/conforms_to/
    unique-name/model-readout/environmental tests (15106 passed). Compliance
    87.2% global, 87.6% weighted.

    Two ontology bindings were wanted but could not be made, and were NOT worked
    around by hand-editing a cache file: HP:0012812 (Fullness of paranasal
    tissue) is genuinely reachable from HP:0000118 but is absent from the
    committed PhenotypeTerm enum membership cache and lazy expansion did not
    admit it, so that feature is described in the Craniofacial Hyperostosis node
    instead; and HP:0004493 is absent from the much smaller ImagingFindingTerm
    cache, so the cranial CT finding keeps a free-text preferred_term. Both are
    recorded in the entry notes as cache gaps.

    Also deletes stubs/Craniometaphyseal_Dysplasia_Autosomal_Dominant.yaml and
    stubs/Craniometaphyseal_Dysplasia_Autosomal_Recessive.yaml, the two stubs
    this entry curates, per the repo convention that a curation PR removes the
    stub it fulfils.

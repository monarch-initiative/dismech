  summary: "Review response: fix CDD gene error, add diagnosis/biochemical, curate ANKH substrate revision"
  details: |
    Response to review on PR #9130 (automated ai4c-reviewer CHANGES_REQUESTED,
    plus an independent pre-PR red-team pass). Snippets rose 75 -> 99, all
    verified.

    Corrections to errors in the first pass:

    - FACTUAL ERROR FIXED. The MONDO scope note claimed craniodiaphyseal
      dysplasia is "also ANKH-associated, which is presumably why MONDO files it
      beneath this term." That is wrong: MONDO records SOST (hgnc:13771) as the
      causal gene of MONDO:0021021 and no causal gene for MONDO:0009031.
      Verified with runoak. The note now states the correct gene and observes
      that a different causal gene strengthens rather than weakens the case for
      reclassification.
    - ONTOLOGY-BINDING NOTE CORRECTED. The first pass recorded HP:0012812 and
      HP:0004493 as permanent enum-cache gaps. They were not: the cause was the
      OLS lookup exceeding the validator's 5-second read timeout (seen
      explicitly as "Read timed out" on one run, silently on others). Both bound
      on retry and are now curated normally - HP:0012812 as its own phenotype,
      HP:0004493 on the CT imaging finding. The note now records the misleading
      failure mode and the retry lesson instead of a false gap.
    - evidence_source corrections. PMID:21149338 "peripheral blood cultures from
      CMD patients" retagged HUMAN_CLINICAL -> IN_VITRO (cultured cells, per the
      CLAUDE.md table). PMID:39165910 on Visual Impairment retagged
      HUMAN_CLINICAL -> OTHER (background framing of a mouse study).
    - PMID:17186460 bundled snippet split. "…do not transport pyrophosphate and
      cannot rescue the defects of Ank null mice" mixes an oocyte assay with a
      transgenic-mouse rescue; now two items, IN_VITRO and MODEL_ORGANISM.
    - Ontology semantics. GO:0015698 (inorganic anion transport) -> GO:0030505
      (inorganic diphosphate transport), the exact term. GO:0030500 (regulation
      of bone mineralization) + DECREASED -> GO:0030502 (negative regulation of
      bone mineralization) + DECREASED, since the unpolarized parent read as the
      inverse of the node's claim.
    - Subtype over-scoping. Five phenotypes (Wide Nasal Bridge, Hypertelorism,
      Mandibular Prognathia, Delayed Eruption of Teeth, Small Foramen Magnum)
      were scoped to AD-CMD on a source-coverage artifact - the GeneReviews
      chapter covers only the dominant form - which wrongly implied absence in
      AR-CMD. Small Foramen Magnum was the case that actively misled: the
      recessive form is the MORE severely sclerosing one. All five unscoped,
      explanations rewritten to distinguish AD-attested from AD-specific.
      Subtype back-references are now carried only by claims that genuinely
      differ: the two genetic records, and two AR-specific phenotypes.

    Substantive additions:

    - diagnosis: section (the reviewer's blocker), three entries - clinical and
      radiographic diagnosis, molecular confirmation with subtype assignment,
      and the radiographic differential among craniotubular dysplasias. The last
      matters because the entry argues MONDO mis-nests craniodiaphyseal
      dysplasia, so it now records how the two are told apart: CMD flares the
      metaphyses, craniodiaphyseal dysplasia thickens the diaphyses, and the
      Erlenmeyer flask deformity does NOT discriminate.
    - biochemical: elevated serum alkaline phosphatase, the diagnostically
      important mirror image of hypophosphatasia's cardinal low ALP - the point
      at which the entry's pyrophosphate-axis contrast becomes a bedside
      measurement.
    - ANKH substrate revision curated. PMID:39165910, already cited three times
      here, describes ANKH as a transporter of citrate and ATP rather than of
      PPi. Added as PARTIAL evidence on the trigger node, with the node
      description and the canonical hypothesis notes hedged accordingly, plus
      the caution that not every ANKH variant should be classed a simple null.
    - Ank null mouse (AnkKO/KO) added as PARTIALLY_RECAPITULATES: it reproduces
      the skull/foramen/ossicle features but not the mandibular, sinus, or
      metaphyseal phenotype, which is the mouse-genetics argument that CMD is
      not simply absence of ANK - the same shape as the Cx43 ablation argument
      already made for the recessive arm.
    - Four phenotypes added (Upper Airway Obstruction, Feeding Difficulties,
      Headache, Chiari Type I Malformation) plus an AR-scoped Lethal
      Intracranial Hypertension.
    - clinical_trials: NCT01630460, observational, phase NOT_APPLICABLE.
    - Historical and Unestablished Medical Therapy added (calcitonin, low-calcium
      diet with calcitriol, and the mouse dietary-phosphate result), explicitly
      recorded as historical rather than recommended.
    - Connexin 43 node given its full bone-cell set and the hemichannel term.
    - Craniofacial contouring retermed NCIT:C25351 Reconstructive Surgery.
    - Softened three overstatements: the foramen-magnum mortality explanation
      (the source hedges twice), the AR severity enum (the claim is comparative,
      not absolute), and the unsupported CPPD N-terminal localization. Removed
      an unsupported 25% AR recurrence figure whose only citation was the AD
      GeneReviews chapter, and added the GeneReviews surveillance quote that the
      supportive-care description asserted without evidence.

    Validation after the changes, all run and output read: just validate,
    just validate-terms, just count-verified-snippets (99/99 verified),
    just check-duplicate-keys (whole KB, 4257 files), just check-title-snippets,
    just check-folded-hyphens (no new splits), just validate-disorders (the
    batched sweep CI runs; 99/99), and pytest tests/test_data.py filtered to
    subtype/conforms_to/unique-name/model-readout/clinical-trial/diagnosis tests
    (13171 passed).

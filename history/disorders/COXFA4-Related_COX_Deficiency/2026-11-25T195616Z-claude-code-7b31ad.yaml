  summary: 'Gene-family review: COXFA4'
  details: |
    COXFA4 genetic record typed CAUSATIVE with variant_origin GERMLINE and its recessive inheritance block bound to HP:0000007 (the same anchored block serves the top-level inheritance). The gene_disease_validity block was removed: it copied ClinGen's Definitive tier for mitochondrial disease (MONDO:0044970, 2025-03-24), broader than this entry's MONDO:0033656; that tier, and the superseded Limited Leigh syndrome classification made under the symbol NDUFA4, are kept in a note and the Definitive tier is the basis for CAUSATIVE (founding pedigree PMID:23746447 and later families, PMID:42218136). The GO:0004129 descriptor on the activity node is described as the holoenzyme activity the non-catalytic subunit supports. The term label remains NDUFA4, the previous HGNC symbol, because the HGNC term cache still carries it; HGNC's current symbol is COXFA4.

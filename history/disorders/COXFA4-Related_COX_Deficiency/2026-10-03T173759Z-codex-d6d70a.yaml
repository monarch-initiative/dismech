  summary: Review COXFA4 deficiency using full-text clinical cohorts and functional studies
  details: 'Reviewed the existing entry and targeted literature-sweep artifact against the complete cached
    full text of PMID:23746447, PMID:38674434, PMID:39967265, PMID:42218136 and PMID:36763283. Read the
    COXFA4-specific row and diagnosis, management, surveillance, precautions and recessive-counseling
    sections of full GeneReviews NBK320989. Read the March 2025 ClinGen report: definitive validity for
    the broader COXFA4-related primary mitochondrial disease entity explicitly including MC4DN21. Used
    its generated URL cache because the structured assertion is absent from the local index and the upstream
    refresh checksum changed; did not repin unrelated data.


    Separated splice SNVs, donor nucleotide deletion, genomic deletions and deletion-insertion; distinguished
    genomic sequence loss from four-nucleotide intron retention and exon skipping. Modeled late complex
    IV maturation, residual enzyme, impaired respiration and partial COXFA4L2 compensation. The donor-deletion
    functional effect remains explicitly inferred because S6 cells were unavailable. Added the model-specific
    ODC/polyamine branch without asserting a resolved complex-IV-to-ODC mechanism. No universal ATP collapse,
    oxidative stress, RNA-decay pathway or human polyamine efficacy is inferred.


    Expanded human phenotype, variant, diagnostic, biochemical and histological coverage. Used source-specific
    clinical observations without pooled frequencies because the 2026 case counts and some historical
    tables are internally inconsistent. The deceased untested sibling in the 2025 family is not treated
    as a genetically confirmed case. General LSS care remains labeled as such; polyamine and gene-complementation
    experiments are preclinical. Distinguished patient fibroblasts, engineered iPSCs, SH-SY5Y, P19-derived
    cells, mosaic Xenopus embryos and whole-body mouse knockout. Verified and cached GSE182376; only the
    knockout/control iPSC subset is relevant to this mechanism study.


    The older targeted research artifact is incomplete and contains unsupported attribution and natural-history
    claims. Its two-family census, unknown adult course and 2013 mouse-knockout attribution are superseded
    or contradicted by primary full text. The 2023 mouse study does not establish human Dandy-Walker syndrome,
    a neuron-specific knockout or measured neuronal ATP collapse. The 2024 mildly elevated phytanic acid
    remains of uncertain significance. Primary c.42+1G>C is retained rather than a later secondary typo.
    No separate severity subtypes are established.


    Source access limits: the 2026 main text and both full clinical tables were read, but supplementary
    retrieval returned 404/timeouts; detailed supplemental case narratives were not used. The 2022 diagnostic
    cohort full-text COXFA4 passages and broader Leigh abstract were inspected, but their unavailable
    case supplements were not used to add unverified variants. Unused 2012/2018 abstract-only reference
    refreshes are excluded from this PR. Full GeneReviews sections were consumed despite the generic URL
    cache being misclassified as abstract-only by the snippet reporter. All reference markdown was generated
    by repository fetch or dataset-verification commands, never hand-authored.


    Updated the focal node-class example to the renamed mature-complex-IV node so the repository example
    continues to resolve. Validation: schema, ontology terms, 148 evidence snippets and 157 titles pass.
    All three targeted disorder/grouping tests pass after correcting therapeutic-agent descriptor placement.
    Grouping validation and strict criteria evaluation pass; disease and grouping pages render. Regenerated
    pre-existing PMID caches have no other disorder consumers on this base. Automated hooks normalize
    whitespace without changing quoted text.'

  summary: Address review evidence, clinical connectivity and phenotype coverage
  details: |
    Corrected the scoliosis evidence sentence and added explicitly indirect, incompletely resolved clinical links from impaired respiration to lactic acidosis, leukoencephalopathy and cardiomyopathy. Removed fibroblast enzyme-activity evidence from the three existing human clinical edges. Added direct human-muscle enzymology evidence to diagnosis and biochemistry, and six reported manifestations: pyramidal signs, dysphagia, ptosis, optic atrophy, cataract and supraventricular tachycardia. Renamed the broad ataxia phenotype while retaining the reported cerebellar description. Replaced raw HTML ampersand entities with transparent ellipses. Removed the misleading compensation-to-defect downstream arrow; the compensation branch remains connected through its induction node.

    Reviewed the optional binding and module suggestions against primary evidence. HP:0001639 requires hypertrophy unexplained by loading conditions; the 2025 confirmed infant also had a hypoplastic aortic valve and outflow obstruction, so retained general cardiomyopathy with a precise description. HP:0001251 is the canonical ataxia binding; retrieved cerebellar alternatives impose progression patterns not uniformly established. Retained only the supported complex-IV biogenesis conformance: the broader terminal-transfer/ATP module says ATP synthesis collapses, whereas the COXFA4 experiments measure enzyme activity and ATP-linked oxygen consumption, not cellular ATP depletion. Clinical links do not assert that stronger generic mechanism. The ClinGen structured rebuild was already attempted and returned no matching assertion; refreshing the upstream index failed the pinned checksum. The generated full-report URL remains the verifiable source, without unrelated manifest changes.

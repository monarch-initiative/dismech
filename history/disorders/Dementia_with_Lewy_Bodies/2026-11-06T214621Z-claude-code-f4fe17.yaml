  summary: Add nOH mechanism chain conforming to the module, and midodrine, droxidopa
    and fludrocortisone
  details: |
    Cardiac Sympathetic Noradrenergic Denervation now conforms to the module postganglionic lesion node. Its INDIRECT_KNOWN_INTERMEDIATES edge to Orthostatic Hypotension, whose named intermediate was failure of baroreflex vasoconstriction, is replaced by explicit conforming nodes: Deficient Norepinephrine Release on Standing and Failure of Baroreflex-Mediated Vasoconstriction. The edge evidence (PMID:15159482) moved with it. Added midodrine, droxidopa and fludrocortisone with target_mechanisms. There is no DLB-specific trial for any of them; evidence is the Palma 2018 Lewy body lesion-site rule, the note that droxidopa trials enrolled DLB patients, and a dementia falls cohort suggestion marked directness INDIRECT. All references already cached. Validated with just validate, validate-terms, count-verified-snippets (236/236), check-causal-targets, check-entity-refs and check-snippet-grading.

  summary: Add HGNC gene_term bindings to APOE/GBA/SNCA genetic entries
  details: |
    Added gene_term HGNC bindings to the three genetic entries per issue #7025: APOE (hgnc:613, preferred_term APOE), GBA (hgnc:4177, preferred_term GBA1), SNCA (hgnc:11138, preferred_term SNCA). On the GBA1-vs-GBA naming question the issue raised: used preferred_term GBA1 (the current HGNC-approved symbol since the 2022-06-09 rename) with term.label GBA (the canonical label returned by the local sqlite:obo:hgnc OAK adapter used for term validation), matching the existing repo convention in Gaucher_Disease.yaml and Parkinsons_Disease.yaml (both use preferred_term: GBA1 / term.label: GBA / id: hgnc:4177).

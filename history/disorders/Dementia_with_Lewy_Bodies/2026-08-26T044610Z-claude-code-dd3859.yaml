  summary: Add conforms_to bindings and PSG-diagnostic evidence (issue 9432)
  details: |
    Bound two existing pathophysiology nodes to established modules: Alpha-Synuclein Aggregation and Lewy Body Formation to parkinsonism_dopaminergic_degeneration#Alpha-Synuclein Aggregation and Lewy Pathology, and Autophagy-Lysosome Dysfunction to disabled_macroautophagy#Failure of Cytoplasmic Quality Control. This follows the small-independent-conformance step flagged in the automated pre-work research comment on issue 9432. Also added a second evidence item, PMID:28592453 (the DLB Consortium Fourth Consensus Report), to the existing REM Sleep Behavior Disorder phenotype, documenting that DLB clinical criteria weight RBD as a core feature only when polysomnographically confirmed, which is the PSG bar the rem_sleep_atonia_control_failure module's central node requires.

    Did not add a new pontine REM-atonia mechanism node or a conforms_to reference to that module: doing so needs new evidence establishing that diagnosed DLB patients (not just isolated RBD converters) show PSG-confirmed REM sleep without atonia, plus judgment calls about how it interacts with the entry's sparse three-node pathophysiology section. That is out of scope for a single conservative run and is left for issue 9432 to track.

    Validated with 'just validate-disorders kb/disorders/Dementia_with_Lewy_Bodies.yaml': schema, terms, and 18/18 snippets (including the new one) all passed, plus the offline check-folded-hyphens, check-snippet-length, check-title-snippets, check-duplicate-keys, and check-not4curation gates.

  summary: Add conforms_to bindings and PSG-diagnostic evidence (issue 9432)
  details: |
    Bound two existing pathophysiology nodes to established modules: Alpha-Synuclein Aggregation and Lewy Body Formation to parkinsonism_dopaminergic_degeneration#Alpha-Synuclein Aggregation and Lewy Pathology, and Autophagy-Lysosome Dysfunction to disabled_macroautophagy#Failure of Cytoplasmic Quality Control. This follows the small-independent-conformance step flagged in the automated pre-work research comment on issue 9432. Also added a second evidence item, PMID:28592453 (the DLB Consortium Fourth Consensus Report), to the existing REM Sleep Behavior Disorder phenotype, documenting that PSG-confirmed REM sleep without atonia in a person with dementia and an RBD history is by itself sufficient to justify a probable DLB diagnosis. This is a sufficiency claim: the consensus report includes RBD as a core clinical feature on clinical grounds (76% vs 4% in autopsy-confirmed cases), with PSG described as desirable whenever feasible and requested when there is doubt, not required in every case.

    Review round 1 (PR 9507): corrected that evidence explanation, which had originally inverted the source into a necessity claim; set evidence_source: OTHER on it, since the Fourth Consensus Report is an expert-consensus criteria document rather than primary clinical data; removed the free-text cross-file module-node reference from the explanation, since prose is not an entity reference and nothing would catch a rename; and substantiated both new conforms_to bindings by adding the module nodes' expected biological_processes - GO:0070841 inclusion body assembly (INCREASED) on the alpha-synuclein node, matching the Parkinsons_Disease precedent, and GO:0006914 autophagy (DECREASED) on the autophagy-lysosome node.

    Did not add a new pontine REM-atonia mechanism node or a conforms_to reference to that module: doing so needs new evidence establishing that diagnosed DLB patients (not just isolated RBD converters) show PSG-confirmed REM sleep without atonia, plus judgment calls about how it interacts with the entry's sparse three-node pathophysiology section. That is out of scope for a single conservative run and is left for issue 9432 to track.

    Validated with 'just validate-disorders kb/disorders/Dementia_with_Lewy_Bodies.yaml': schema, terms, and 18/18 snippets (including the new one) all passed, plus the offline check-folded-hyphens, check-snippet-length, check-title-snippets, check-duplicate-keys, and check-not4curation gates.

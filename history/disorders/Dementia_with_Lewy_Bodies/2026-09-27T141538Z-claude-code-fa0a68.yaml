  summary: Add proposed CETP inhibition from Mendelian randomization
  details: |
    Added a proposed CETP-inhibition treatment supported only by human genetic evidence: drug-target Mendelian randomization linking genetically lower CETP to lower Lewy body dementia risk, strongest in APOE-e4 carriers (PMID:39415269), and an independent drug-target MR study (PMID:39929371). Evidence is marked INDIRECT. therapeutic_agent left unbound because CHEBI:49205 is a role term outside the ChemicalEntityTerm enum and obicetrapib itself has not been tested in this disease.

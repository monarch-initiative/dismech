  summary: 'Review round: hypocretin node scope, co-pathology edge, evidence grading'
  details: |
    Review round on PR 15420. Blocking finding: the node named Hypothalamic Hypocretin Neuron Involvement bound CL:0011109 with modifier DECREASED, asserting loss of hypothalamic hypocretin neurons, while its only source (PMID:20531237) measured neocortical hypocretin immunoreactivity. Re-reading the cached record confirmed the paper states neuropathological hypocretin levels in DLB remain unexamined, and that its 60 percent hypothalamic neuron figure is from Parkinson disease. The node is renamed Reduced Neocortical Hypocretin Signalling, the cell-type binding no longer carries a modifier, the unsourced claim about CSF hypocretin in Parkinson disease dementia is removed, and the paper's own statement of what was unexamined is cited as the basis for asserting no neuronal loss. Removed the Concomitant Alzheimer Disease Co-Pathology edge to Visual Hallucinations: its only evidence was REFUTE and the graph drew it as an ordinary causal arrow, so the PMID:12771246 finding now sits as SUPPORT evidence on the node, whose description already claims hallucinations are less frequent at high tangle stage. Regraded the PMID:22038951 background sentence from MODEL_ORGANISM to OTHER because it rests on animal and human lesion studies together. Marked the PMID:16023355 edge INDIRECT, since thalamic nicotinic binding is higher with disturbed consciousness. Added the DLB-specific motor correlate from PMID:9798081 beside the 72 percent dopamine figure on the Bradykinesia and Rigidity edges. Added synonyms from MONDO:0007488's hasExactSynonym set read from OLS, omitting the susceptibility title form and the one related synonym, with the reason recorded in entry notes. Validation: validate-disorders 0 issues, 223 of 223 snippets verified and 226 titles checked on a tree with validator cache churn reverted.

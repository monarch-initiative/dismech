  summary: 'Deepen pathograph and progression: Dementia with Lewy Bodies'
  details: |
    Restructured the pathograph around the anatomical spread of Lewy pathology so that early and late phenotypes hang from different nodes. Added 15 pathophysiology nodes (peripheral autonomic and lower brainstem, cardiac sympathetic denervation, olfactory bulb, pontine REM-atonia lesion and atonia loss conforming to rem_sleep_atonia_control_failure, nigrostriatal degeneration and striatal dopamine deficiency conforming to parkinsonism_dopaminergic_degeneration, basal forebrain cholinergic degeneration, cortical cholinergic deficit, thalamocortical arousal dysfunction, limbic and neocortical Lewy pathology, occipital-parietal association cortex dysfunction, hypocretin involvement, and Alzheimer co-pathology as a modifier). Phenotypes went from 4 to 27, with 24 causally connected (previously 1 of 4); visual hallucinations, fluctuations, RBD and parkinsonism now have upstream mechanisms, and falls and aspiration pneumonia are reached through phenotype sequelae. Added a four-phase progression block (prodromal, MCI-LB, established dementia, advanced disease), three mechanistic hypotheses (body-first caudo-rostral, brain-first amygdala-centred, cholinergic basis of fluctuations, the last carrying REFUTE evidence), therapeutic agents and target mechanisms for cholinesterase inhibitors and a new levodopa treatment, and a KNOWLEDGE_GAP discussion for depression, anxiety, dysphagia and urinary urgency, which have no DLB lesion evidence and were left unwired. Deep research: one new claude_code report using templates/disease_phenotype_wiring_research.md (research/Dementia_with_Lewy_Bodies-phenotype-wiring-deep-research-claude_code.md); a falcon run with the same template failed on a 403 authentication error from the Edison API. Evidence was gathered from PubMed and checked against the fetched abstracts and full texts in references_cache. Validated with just validate (220 snippets, 0 issues), just validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys and check-coarse-phenotypes.

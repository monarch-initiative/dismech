  summary: Create environmental section; smoking null, caffeine protective
  details: |
    Created the environmental section, which did not previously exist, with two entries from
    the only case-control risk-factor study of this disease (PMID:23892702, 147 patients
    against two matched controls each, plus 236 Alzheimer disease comparisons).

    Smoking is null here, and that null is the point. It is curated as content with no
    mechanism link, graded REFUTE against the claim that smoking is a risk factor and
    equally against the claim that it is protective, so that the protective smoking
    association curated on the Parkinson disease entry is not read as applying across the
    synucleinopathies. The authors single smoking out precisely because it acts in opposite
    directions in the two diseases this one is most often compared with.

    Caffeine is inversely associated and more strongly than in Parkinson disease (OR 0.29),
    linked PROTECTS_AGAINST Alpha-Synuclein Aggregation and Lewy Body Formation with unknown
    intermediates. Reverse causation is a stronger objection here than in Parkinson disease
    because exposure was ascertained after diagnosis from records and informants, and the
    link description says so. The caffeine snippet necessarily carries the cancer result that
    shares its clause, which the explanation notes.

    The study's other risk factors (anxiety, depression, stroke, family history, APOE,
    oophorectomy) are not environmental exposures and are not curated in this section.

    Inserted at the genetic/diagnosis boundary deliberately. PR #15420 is in flight against
    this entry, deepening the pathograph from 3 nodes to 18 and adding progression and
    treatments; neither it nor main carries an environmental section, and the target node
    Alpha-Synuclein Aggregation and Lewy Body Formation exists under that exact name on both,
    so this link cannot dangle whichever merges first.

    Provider: OpenScientist (autonomous mode, 5 iterations, 52 citations, 20 minutes).
    The report is committed at research/Alpha_Synucleinopathies-environmental-exposures-deep-research-openscientist.md
    with its citations sidecar and HTML/PDF artifacts. Falcon was unavailable for this
    run (the configured Edison key returns 403), so no second provider corroborates it.

    Every quoted sentence was read from the cached abstract in references_cache/ rather
    than from the report, and several of the report's figures were corrected or qualified
    against source in the process. The report was treated as a lead throughout.

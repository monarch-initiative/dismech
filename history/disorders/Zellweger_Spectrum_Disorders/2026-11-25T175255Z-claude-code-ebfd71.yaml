  summary: 'Gene-family review: PEX1, PEX2, PEX3, PEX5, PEX6, PEX7, PEX10, PEX11B,
    PEX12, PEX13, PEX14, PEX16, PEX19, PEX26'
  details: |
    The six module nodes already grouped the peroxins by step, but four of them carried genes with no molecular function. Added: peroxisome signal sequence receptor activity (GO:0000268) on the PTS receptor node (PEX5, PEX7); the PEX14 docking adaptor (GO:0030674, PMID:19197237) and the PEX13 YG-domain conduit (GO:0008320, PMID:36520918) on the docking and translocation node, with the translocation process; the retrotranslocation channel activity (GO:0008320) beside ubiquitin protein ligase activity on the RING node, matching its existing PMID:36421406 evidence; the PEX19 carrier activity (GO:0140597, PMID:14709540) and the PEX3/PEX16 docking activity (GO:0043495, PMID:15007061, PMID:19114594) on the membrane assembly node; and membrane bending activity (GO:0180020, PMID:25910939, PMID:21113128) on the PEX11B division node. PEX26 was moved off the ATP hydrolysis node, since it is the membrane anchor rather than an ATPase, onto a new Export Module Membrane Anchor Failure node (GO:0043495, PMID:30366024, PMID:12717447) that feeds the ATPase node. PMID:31652724 now supports the statement that the import machinery spends ATP only on resetting itself. All fourteen genetic records are typed CAUSATIVE with germline origin; ClinGen classifies these genes for the parent MONDO:0019234 rather than for this entry's MONDO:0019609 or its subtype terms in the citation cache, so no tier was copied.

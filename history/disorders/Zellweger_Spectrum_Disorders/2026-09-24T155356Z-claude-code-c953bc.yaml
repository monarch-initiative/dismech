  summary: 'Genetics pass: add the fourteen gene-defined subtypes, six peroxin-step
    nodes, and fourteen gene records'
  details: |
    Genetics pass for issue #12233 (d2g series-026), Zellweger_Spectrum_Disorders
    half.

    Ruling on granularity. MONDO classifies this spectrum by genotype: fourteen of
    the fifteen direct subclasses of MONDO:0019609 are gene-defined. Those fourteen
    are curated here as has_subtypes rows, each bound to its MONDO id with its gene,
    alongside the three severity rows (Zellweger syndrome, NALD, infantile Refsum
    disease) the entry already carried. The two axes cross-cut, which the entry
    notes record, because PEX1 variants span the full severity range. The
    OMIM-numbered PBD classes below these rows stay as standalone entries, and a
    gene row does not retire their stubs.

    Content added. Fourteen gene-defined has_subtypes rows (PEX1, PEX2, PEX3, PEX5,
    PEX6, PEX10, PEX11B, PEX12, PEX13, PEX14, PEX16, PEX19, PEX26, plus PBD9B for
    PEX7). Six pathophysiology nodes for the peroxin steps: PTS receptor cargo
    recognition, docking and translocation module, RING ubiquitin ligase
    retrotranslocation, receptor export module ATPase, peroxisomal membrane
    assembly, and peroxisome division. Fourteen genetic records, each wired to the
    node for the step its gene acts at rather than listed together.

    Stub retired. stubs/Peroxisome_Biogenesis_Disorder_9B.yaml is removed: the
    concept it queued is now the PBD9B row, bound to MONDO:0013945. That stub
    proposed the concept as a subtype of Adult_Refsum_Disease, on the grounds
    that MONDO:0013945 carries "Refsum disease, adult, 2" among its synonyms.
    Current MONDO does not: the term carries only "peroxisome biogenesis
    disorder 9B" as an exact synonym and "PBD9B" as a related one. The row is
    curated where MONDO places the term instead, with the MONDO:0100307
    overlap recorded in the entry notes.

    Review of the inherited draft. Four MONDO claims were checked against OLS and
    three did not hold. The draft said every direct subclass of MONDO:0019609 is
    gene-defined; there are fifteen children and MONDO:0800298, peroxisome
    biogenesis disorder complementation group 2, is not gene-defined. It is now
    dispositioned in the notes rather than curated, because the PEX5 study cited on
    the PEX5 rows states that mutations in PEX5 are what define complementation
    group 2, which is the concept MONDO:0100262 already carries. The draft said
    MONDO:0013945 carries "Refsum disease, adult, 2" among its synonyms; current
    MONDO carries only "peroxisome biogenesis disorder 9B" as an exact synonym and
    "PBD9B" as a related one. The draft said the PBD9B row does not duplicate the
    Adult_Refsum_Disease Type 2 row because the two MONDO classes have separate
    placements; MONDO:0100307, the class that row is bound to, carries a textual
    definition saying it is scheduled to be merged with MONDO:0013945 because the
    two terms denote the same concept. The overlap is now recorded rather than
    asserted away, and Adult_Refsum_Disease is untouched. The draft also described
    MONDO:0019609's exact synonyms as entirely severe-end vocabulary; "Zellweger
    spectrum disorders" is itself an exact synonym.

    Evidence repaired. PMID:28765278 was cited nine times with three quotes, all of
    which sit outside the abstract in a full_text_html cache. Under
    linkml-reference-validator 0.3.0rc1 that cache is refused as stale and only the
    abstract is served, so those nine citations would have failed in the merge
    queue while passing locally. No claim was dropped: the PEX5 citations were
    re-sourced to PMID:9668159, the PEX13 and PEX14 citations to PMID:38632234, and
    the PEX26 citation was removed as redundant beside PMID:30366024, which states
    the same anchor role from an abstract-only cache. Seven prose fields were
    retightened to what the replacement quotes actually say.

    Review round 1. Four evidence items mixed a gene-function sentence with a
    human-genetics sentence under a single IN_VITRO grading, and were split so
    each half carries the grading its own quote supports: the PMID:38423277
    quote at three sites becomes an IN_VITRO item for the PEX11B molecular
    function and a HUMAN_CLINICAL item for the gene-disease relationship, and
    the PMID:33955040 quote becomes a HUMAN_CLINICAL item for the prevalence
    statement and an IN_VITRO item for the PEX1-PEX6 hexamer. The PEX6
    GeneReviews quote was regraded PRIMARY_RESULT to REVIEW_SYNTHESIS. Two node
    descriptions were narrowed to what their own evidence states: the receptor
    export module node no longer claims PEX6 is among the most frequently
    implicated genes, since the only frequency quote in the entry is about
    PEX1, and the division node no longer asserts that import-competent
    peroxisomes are still made. Four sentences of curation-process narration
    were removed from notes, with the MONDO facts kept.

    Validation. just validate, validate-terms, count-verified-snippets (155
    snippets), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-genereviews,
    list-gene-term-mismatches (offline and against live HGNC), and
    validate-disorders under 0.3.0rc1 all pass.

  summary: 'Create: U2AF2-related neurodevelopmental disorder'
  details: |
    New entry for MONDO:0957810 (developmental delay, dysmorphic facies, and brain anomalies), the U2AF2 de novo neurodevelopmental disorder, replacing the stub. Phenotypes and frequencies come from the 46-individual cohort in PMID:37962958 with case reports PMID:34112922, PMID:36747105, PMID:37092751, PMID:41090043 and the whole-gene deletion case PMID:42135263. Three-node pathograph: the RRM variant node (U2AF2 with GO:0030628 pre-mRNA 3'-splice site binding, decreased; conforms to the spliceosome_component_dysfunction germline variant node) leads to altered splicing of RNA-binding-protein transcripts (minigene, fly and ENCODE reanalysis evidence; conforms to the mis-splicing node), then to impaired neurite outgrowth, with edges to five neurological phenotypes on fly and hPSC evidence. Facial, growth and cardiac features are left unconnected and a knowledge-gap discussion records the open dosage versus altered-function question. Validated with just validate, validate-terms, count-verified-snippets (48/48) and validate-disorders.

  summary: 'Create: PDE6G-Related Retinopathy'
  details: |
    New entry for PDE6G-related retinopathy (MONDO:1040034), entry_type DISEASE. MONDO's only child, retinitis pigmentosa 57 (MONDO:0013315), is the same disease and is recorded as a skos:narrowMatch mapping plus synonyms rather than a has_subtypes row, following CNGA1-Related_Retinopathy. Deep research: one OpenScientist report (no fallback); 12/12 references resolved, 0 unresolved terms. Errors found in it: it gives PDE6G as HGNC:8788, which is PDE6D (flagged by preflight-dr), and its suggested NCIT treatment codes name unrelated concepts (C15431 is Hematopoietic Cell Transplantation, C15277 Mastectomy, C15917 Arterial Embolization). It frames the mechanism as loss of inhibitory control with excess PDE6 activity and does not cite the Pde6g null mouse (PMID:8638127), in which PDE6 activity is reduced and cGMP rises; the entry follows the knockout data. It also missed the second and third published families (PMID:28749477 exon 3-4 deletion; PMID:39160471 compound heterozygous child), found here by PubMed search and in the ClinGen Definitive assertion summary. Its Pde6b gene-therapy rescue papers (PMID:29721933, PMID:35195763) were not used because they are PDE6B, not PDE6G. Reduced visual acuity, listed in the HPO annotation set, was left out because the source describes acuity as relatively good. Validated with just validate, count-verified-snippets (52/52), validate-terms, check-entity-refs, check-causal-targets, check-gene-validity, check-snippet-grading/length, check-title-snippets, check-reference-titles, list-gene-term-mismatches, check-genereviews and validate-disorders, all passing.

    CI round: the PR's test (3.13) job failed two whole-repo gates. find_missing_reference_titles flagged the two ClinGen (CGGV) evidence items, which lacked reference_title; filled from the cache frontmatter with scripts/backfill_reference_titles.py. check_gene_activity_grounding flagged PDE6G on the PDE6G Loss of Function node, which bound no molecular function; bound GO:0004857 enzyme inhibitor activity (DECREASED), the molecular function GO annotates to PDE6G (QuickGO, P18545), label checked through ols:go. Both gates, check_folded_hyphens and validate-disorders pass after the change.

    Review round 1: added a diagnosis section (molecular genetic testing bound to NCIT:C15709 Genetic Testing, including copy-number analysis for the PDE6G deletions, quoted from PMID:20655036, PMID:39160471 and PMID:28749477; full-field ERG bound to NCIT:C18020 because an OLS search of NCIT found no electroretinography procedure term; optical coherence tomography bound to NCIT:C20828). Added a carbonic anhydrase inhibitor treatment for cystoid macular edema sourced from two retinitis pigmentosa systematic reviews (PMID:28987613, PMID:35652079), linked to the Cystoid macular edema phenotype. Changed the rod degeneration node's biological_scale to CELLULAR and added quote_role to the two stationary night blindness evidence items. Renamed the entry, this history directory and the OpenScientist report files from PDE6G-related_Retinopathy to PDE6G-Related_Retinopathy to match sibling entries; the report's artifact paths were updated to the new directory name, and this record's target slug and path point at the new file because the record had not yet merged.

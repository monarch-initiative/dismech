  summary: 'Create: High Altitude Pulmonary Edema'
  details: |
    New entry (MONDO:0031257), created after a 2026 lung-on-chip scan surfaced PMID:41786071 (perfluorocarbon in a canine plus lung-on-chip model, HIF-1alpha/HO-1). Built out from core HAPE literature rather than from the chip paper alone. Seven pathophysiology nodes model the pressure-primary account: sustained alveolar hypoxia, exaggerated and uneven hypoxic pulmonary vasoconstriction, pulmonary capillary hypertension, capillary stress failure of the blood-gas barrier, impaired alveolar fluid clearance as a modifier, secondary inflammatory amplification, and high-permeability flooding with a feedback edge back to the trigger. The causal ordering rests on PMID:11319198, where transcapillary transferrin escape was still normal in susceptible subjects whose capillary pressure had already risen; that negative result is curated explicitly rather than paraphrased. Two mechanistic_hypotheses record the pressure-primary CANONICAL versus inflammation-contributory ALTERNATIVE split. Three nodes conform to the new alveolar_capillary_barrier_failure module. The environmental exposure_term is deliberately left unbound: ECTO and XCO were both searched and neither carries a high-altitude or hypobaric-hypoxia exposure class, and the closest XCO candidates (XCO:0001406 hypobaric chamber, XCO:0000010 controlled air oxygen content) describe laboratory manipulations rather than the natural exposure. That rationale is recorded in the entry notes so it is not re-researched. A HUMAN_MODEL_MISMATCH discussion records that the chip applies hypoxia directly to the barrier and has no pulmonary circulation, so it cannot generate the capillary overperfusion that actually initiates HAPE. Validated: linkml-validate clean, linkml-term-validator clean, 33/33 snippets verified.

  summary: Replace non-substantive evidence on Cough and Tachycardia phenotypes
  details: |
    Self-review of the initial commit found two evidence items whose snippets did not substantively support their claims, which violates the evidence rule that a snippet must support the precise claim it is attached to. The Cough phenotype cited PMID:39331568 with a snippet describing the review's own scope ('This article presents a view of the physiopathology of HAPE by merging available data...'), which says nothing about cough. The Tachycardia phenotype cited PMID:38682380 with a snippet about patients seeking prevention advice, which says nothing about heart rate. Both were graded PARTIAL with explanations conceding the gap; grading a non-supporting quote PARTIAL is not a substitute for finding a real source. Replaced both with substantive quotes from two newly cached clinical sources: PMID:41316096, a 411-patient multi-centre inpatient cohort from Qinghai, which describes the dry-exertional-to-frothy cough progression and lists tachycardia among the examination findings in its diagnostic criteria; and PMID:42254115, a Nepalese case series, whose clinical diagnostic criteria name tachycardia as one of the qualifying physical signs. Both phenotypes now carry SUPPORT rather than PARTIAL, graded HUMAN_CLINICAL. The cohort paper also documents cough in 53.8 percent of 411 patients, which is the basis for the FREQUENT frequency already assigned. Validated: linkml-validate clean, linkml-term-validator clean, 35/35 snippets verified, all offline gates pass with no new baseline defects.

  details: |
    Acts on the one optional note in the approving re-review of PR 9715. The environmental entry described rapid ascent as 'the necessary and sufficient environmental exposure', which is false and contradicted the entry's own JAK2 note ('no single locus is necessary or sufficient') two sections away. The exposure is necessary but not sufficient: HAPE affects only a susceptible minority of those who ascend, which is precisely what the susceptibility loci and the hape_susceptibility_vasoreactivity_basis knowledge gap are about. Reworded to say so explicitly rather than just deleting the word 'sufficient', so the reason is on the page. Separately, the Classic HAPE subtype snippet stopped at 'a rapid ascent above 2500', truncating just before the en-dash in '2500-3000 m' and reading as cut off. Testing showed the full sentence including the en-dash is an exact substring of the cache and passes the reference validator, so the earlier caution about dash normalization was unnecessary; the snippet now runs to the end of the sentence. Both are prose-and-quote corrections with no structural effect. Validated: linkml-validate clean, linkml-term-validator clean, 44/44 snippets verified, reference validator zero errors, all four ref-based gates clean, folded-hyphen, snippet-grading, entity-ref and duplicate-key checks clean.

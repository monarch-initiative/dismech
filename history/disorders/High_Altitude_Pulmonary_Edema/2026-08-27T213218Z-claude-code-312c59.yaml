  summary: Withdraw unsupported CYP1B1 gene binding from HAPE genetic section
  details: |
    Acts on a non-blocking suggestion in the approving review of PR 9715, which questioned whether expanding the source's garbled 'P1B1 cytochrome genes' to CYP1B1 was licensed. It was not. A PubMed check returns zero papers for 'high altitude pulmonary edema AND CYP1B1', while CYP11B2 (aldosterone synthase) returns six and CYP17A1 one. The CYP1B1 reading is therefore very likely wrong, and the hgnc:2597 binding asserted a machine-readable gene-disease susceptibility claim with no support. Withdrew the gene_term entirely and renamed the entry to 'Unidentified cytochrome P450 locus'. Deliberately did NOT rebind to CYP11B2: reading 'P1B1' as '11B2' is an inference PMID:42254115 does not license, and substituting one guess for another would repeat the original error rather than correct it. The primary references behind that sentence's [7,8] citations were not consulted, and the notes now record the full reasoning - the source wording, the withdrawn binding, the PubMed counts, and the reason the likely-correct gene is still not bound - so a later curator can resolve it from the primary papers rather than re-deriving the problem. The evidence snippet is unchanged and still quotes the source verbatim; the entry retains relationship_type SUSCEPTIBILITY and supports PARTIAL. Validated: linkml-validate clean, linkml-term-validator clean, 44/44 snippets verified, all four ref-based gates clean, entity-ref and duplicate-key checks clean.

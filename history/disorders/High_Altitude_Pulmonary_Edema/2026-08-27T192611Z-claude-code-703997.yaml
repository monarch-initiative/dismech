  summary: 'Address PR review: add prevalence, diagnosis, subtypes, genetic sections'
  details: |
    Addresses finding 3 of the automated review on PR 9715, which observed that this entry under-consumed two reference cache files the same PR added. Added four sections, all sourced from text already in the branch. prevalence: two records from PMID:42254115 - a global range recorded as PERIOD_PREVALENCE / UNKNOWN because the reported incidence spans less than 0.01 percent to 31 percent and is conditioned on ascent rate rather than a fixed denominator, and a rate-conditioned estimate of approximately 4 percent for trekkers exceeding 600 m per day, given rate_per_100000 4000.0 and ABOVE_1_IN_1000. diagnosis: one Diagnosis record capturing the two-symptom plus two-sign clinical threshold from PMID:42254115, with the five-point Qinghai cohort criteria from PMID:41316096 summarised in notes. has_subtypes: Classic HAPE and Re-entry HAPE, the latter a genuine population variant (highland dwellers reascending after time at sea level) rather than a severity grade; a second evidence item records the authors' statement that the mechanism is likely identical for both, which is why this is split on population and presentation rather than pathophysiology. genetic: JAK2 (hgnc:6192), HRG (hgnc:5181) and CYP1B1 (hgnc:2597), all relationship_type SUSCEPTIBILITY and all graded PARTIAL because the case series cites them secondarily rather than reporting primary association data. The HRG deletion carries the one stated phenotypic correlate, earlier onset. The source prints CYP1B1 as 'P1B1 cytochrome'; the binding follows the intended gene and the snippet preserves the source wording unaltered. All three HGNC identifiers were verified against the HGNC REST API, not assumed. Also addressed the review's non-blocking suggestion on the Cough phenotype: the second evidence item previously quoted the cohort enrolment sentence while its explanation claimed a 53.8 percent figure the quote did not carry. The reviewer suggested quoting the Table 1 row, but that row extracts as 'Cough221 (53.8)65 (56.0)156 (52.9)0.640', which is four words and would trip check-snippet-length as a new short snippet. Instead the snippet was replaced with the early-symptom sentence, which substantively supports cough, and the cohort figure moved into the phenotype description as curator prose with the source named. Validated: linkml-validate clean, linkml-term-validator clean, 44/44 snippets verified, reference validator zero errors, all four ref-based CI gates clean against origin/main, entity-ref and duplicate-key checks clean, subtype foreign-key tests pass.

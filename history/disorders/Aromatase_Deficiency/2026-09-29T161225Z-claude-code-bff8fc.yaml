  summary: Record why no estrogen receptor gene is bound on the estrogen deficiency
    node
  details: |
    Fifth tranche of the estrogen-signalling pathograph work in issue #12925.
    The issue lists the Estrogen Deficiency and Androgen Excess node among
    fourteen that bind GO:0030520 while naming no gene, and itself flags it as
    a ligand-supply defect rather than a receptor defect. Read against the
    node's claim and sources, that is right: no receptor gene is bound, and the
    node carries a recorded reason instead. The issue treats that as a closed
    task rather than an avoided one.

    The defect is in ligand supply. CYP19A1 is bound on the upstream
    MOLECULAR-scale node, the receptors are intact, and no source cited in this
    entry reports a receptor measurement in aromatase deficiency. The one cited
    source that names the receptor, PMID:11305285, does so for the
    estrogen-resistant man with a mutant estrogen receptor-alpha gene, which it
    contrasts with aromatase deficiency as a separate disease. That disease,
    estrogen resistance syndrome (MONDO:0014148), is the seventh tranche of
    this issue, and the issue is explicit that this entry is not its target.

    A search was run before deciding. PubMed for aromatase deficiency in the
    title with ESR1 or estrogen receptor alpha in the title or abstract
    returned three records: PMID:11305285 as above, PMID:12466340 (a
    single-patient estrogen replacement report) and PMID:31971970 (a mouse
    study of hematopoietic aromatase loss). None reports a receptor defect in
    this disease. The same query with the bare phrase estrogen receptor
    returned the same three.

    Deep-research reports for this disease were read before any external
    source was consulted. The falcon report lists ESR1, ESR2 and GPER1
    symmetrically as signaling mediators affected by low estrogen, sourced to a
    review of aromatase contributions, and reports no measurement of any of
    them; the cyberian-codex report names no receptor gene. A symmetric list of
    three receptors with no measurement is the shape the third tranche's
    Breast_Carcinoma record declined, and it is declined here for the same
    reason.

    The node is ORGANISM-scale, a systemic hormonal state feeding uterine,
    skeletal, gonadotropin and metabolic consequences, and which receptor
    mediates each of those differs by tissue. A receptor gene here would name
    one molecular actor for a state the node does not localize to a cell. The
    tissue-specific downstream nodes are where such a claim would live; they
    do not bind GO:0030520 and are outside this issue's worklist, so nothing
    was added to them.

    No cache file changed. Checks: validate, validate-terms and
    count-verified-snippets passed on the file; validate-disorders over the
    whole tranche passed; the offline gates listed in the Heart_Failure record
    for this tranche passed with no new findings.

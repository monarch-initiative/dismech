  summary: Expand Rabies from stub to full mechanistic entry
  details: |
    Rebuilt the Rabies entry, which previously carried two untyped pathophysiology nodes, a single phenotype, and every evidence item sourced from one 2002 review (PMID:12144896), plus a large deep-research references block of title-as-statement placeholders.

    Pathophysiology now models the full neuroinvasion chain as 10 linked nodes with causal downstream edges, biological_scale tags, mechanism_confidence, and CL/GO/UBERON bindings: peripheral inoculation -> neuromuscular junction entry into motor neurons (nAChR colocalisation; p75NTR glycoprotein binding) -> p75NTR-dependent retrograde axonal transport -> CNS neuronal infection -> Negri body viral factories (GO viral transcription/genome replication; GO:0016234 inclusion body) and mitochondrial dysfunction/mitophagy -> neuronal dysfunction without substantial neuronal death -> acute progressive encephalomyelitis -> divergence into encephalitic vs paralytic forms, and centrifugal spread to salivary glands and extraneural organs. A mouse-only dorsal root ganglion selective-vulnerability node is included at HYPOTHETICAL confidence with an explicit scope note.

    Added: encephalitic/paralytic subtypes; nine phenotypes including hydrophobia (HP:0032505, diagnostic); four progression phases; Negri body and minimal-inflammation histopathology; a five-entry diagnosis block (brain FAT gold standard, nuchal skin biopsy antigen detection, RT-PCR, and the negative-test-does-not-exclude caveat with real-world 40 percent antemortem confirmation rates); Guillain-Barre differential; structured worldwide prevalence normalised from the 59,000 annual deaths estimate; and six treatments spanning wound care, HRIG, PEP, PrEP, and palliative care, three of which carry target_mechanisms edges onto the pathograph.

    The Milwaukee protocol is recorded deliberately as a REFUTE-supported treatment entry so the knowledge base captures what has been tried and abandoned, not only what is recommended.

    Evidence base expanded from 1 to 20 PMIDs, all fetched via just fetch-reference and snippet-verified. Aerophobia is described in prose rather than coded because HPO has no term for it. Validation: just validate, just validate-terms, and just validate-references all pass; 83/91 snippets verified against cached reference text (the 8 skipped are pre-existing DOI-prefixed entries in the legacy deep-research references block).

    Incidental: PMID_38376376 cache upgraded from abstract-only to full text. A cache-generation bug was found and avoided rather than worked around: just fetch-reference PMID:20881935 produces a cache file whose frontmatter title contains a literal triple-hyphen (Human rabies---Virginia, 2009.), which breaks YAML frontmatter parsing and crashes the reference validator. That citation was dropped in favour of PMID:38376376 and PMID:24348170; PMID_1899320.md in the committed cache has the same defect and is a candidate for a separate fix.

  summary: 'Address PR #7685 review: connectivity, claim-evidence fit, mAbs, knowledge
    gap'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7685. All seven IMPORTANT items and all seven SUGGESTIONS addressed.

    1. Orphan pathophysiology node: added an incoming causal edge from 'Inoculation of Virus into Peripheral Tissue' to 'Selective Vulnerability of Dorsal Root Ganglion Neurons' (INDIRECT_UNKNOWN_INTERMEDIATES), modelling the sensory branch of the bite-site infection alongside the motor-neuron route. The pathograph is now a single connected component.

    2. Claim-evidence mismatch on 'Excessive salivation': the reviewer was right that the postmortem antigen snippet (antigen in plexuses but NOT in acini or ducts) read backwards as support for a secretory phenotype. Replaced with a human clinical statement of hypersalivation as a common autonomic manifestation. The anatomical snippet remains only where it belongs, on the centrifugal-spread node.

    3. Model-organism-only support for 'Autonomic instability': added three human clinical evidence items (autonomic dysfunction as a common feature; the cardiopulmonary complication list; the hypothalamic/spinal/autonomic-ganglion attribution). The canine MRI item is retained but demoted in the explanation to corroborating rather than sole evidence.

    4. GO term: replaced the system-level GO:0050877 nervous system process with the cellular-scale GO:0007268 chemical synaptic transmission plus modifier ABNORMAL, matching the node's biological_scale: CELLULAR and its actual claim of derangement rather than mere occurrence.

    5. Missing DR-surfaced phenotypes: added Headache (HP:0002315, prodromal), Agitation (HP:0000713, encephalitic subtype, temporality RECURRENT, with the lucid-interval detail), and Dysphagia (HP:0002015, distinguished mechanistically from hydrophobia). Also added evidenced frequency bands to Hydrophobia (VERY_FREQUENT) and Paresthesia (FREQUENT) now that a quantitative source is cited.

    6. Monoclonal antibodies: added an 'Anti-rabies monoclonal antibody' treatment (therapeutic_modality MONOCLONAL_ANTIBODY, NCIT:C20401 agent) with a target_mechanisms INHIBITS edge onto the same neuromuscular-junction-entry node HRIG targets, plus the non-overlapping-epitope cocktail rationale. Added a clinical_trials block for NCT03961555 (PHASE_II) and NCT04644484 (PHASE_III), both SYN023 versus HRIG, both COMPLETED.

    7. Knowledge gap: added a discussions entry (rabies_neuronal_dysfunction_basis, kind KNOWLEDGE_GAP, status OPEN) attached to the 'Neuronal Dysfunction Without Substantial Neuronal Death' node, with two proposed_experiments (electrophysiological phenotyping of infected human iPSC-derived neurons; mitochondrial rescue), each carrying would_support and would_refute criteria. The top-level notes now point at it instead of carrying the gap as prose.

    Suggestions: added amantadine (CHEBI:2618) to the Milwaukee protocol agents and a second independent REFUTE source naming all three agents; extended the prevalence snippet through the confidence interval and corrected the notes CI to the quoted 25,000-159,000; added neuron, pyramidal neuron, and Purkinje cell bindings to the Negri body node; added a classifications block with harrisons_chapter INFECTIOUS_DISEASES; tagged the eight PMID:12144896 review evidence items evidence_source OTHER for internal consistency; backfilled links.prs 7685 on the initial history record; and added human clinical distinguishing features to the Guillain-Barre differential.

    One new source carries most of this: PMID:30747124 (Jackson, Rabies: a medical perspective, Rev Sci Tech 2018), a full-text human clinical review already cached from the first pass but unused. Plus PMID:39542064 for the mAb cocktail and the two ClinicalTrials.gov records.

    Not done: quantitative RT-PCR/ELISA accuracy figures from DR section 10.2 were left out, since the underlying sources are preprint/DOI-only entries in the legacy references block and would not snippet-validate against a fetched cache.

    Validation: just validate, just validate-terms, just validate-references all pass. Snippet verification rose from 83/91 to 102/110 (the 8 skipped remain the pre-existing DOI-prefixed legacy entries).

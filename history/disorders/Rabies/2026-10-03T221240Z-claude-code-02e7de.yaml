  summary: Backfill agent_life_cycle (#10115, R26)
  details: |
    Added agent_life_cycle for Lyssavirus rabies. Hosts: Canis lupus familiaris (NCBITaxon:9615, principal global reservoir), Chiroptera (NCBITaxon:9397, bats, sylvatic reservoir), Procyon lotor (NCBITaxon:9654, raccoon), Mephitis (NCBITaxon:30546, skunks, genus-level), Vulpes (NCBITaxon:9625, foxes, genus-level), Homo sapiens (NCBITaxon:9606, dead-end host). Skunks and foxes are bound at genus and bats at order because the sources say skunks, foxes and bats without naming species; raccoon is bound at species because Procyon lotor is the only North American raccoon in the role. No vectors: rabies has no arthropod vector. Three stages: maintenance in the domestic dog reservoir (PMID:29188797 and PMID:28846292, both snippets copied from the entry's existing transmission and other blocks with their OTHER grading unchanged), sylvatic maintenance in wild carnivores and bats (PMID:28643547 naming raccoons, skunks, bats and foxes as main reservoirs, graded OTHER with quote_role REVIEW_SYNTHESIS as a comprehensive review; PMID:32752569 confirming the same groups as the source of human transmission in the United States, graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS), and transmission to the dead-end human host (PMID:28846292 on the breadth of mammalian hosts). Two new references fetched: PMID:28643547 and PMID:32752569. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (647/647 across the tranche), check-granularity (MISSING_LIFECYCLE cleared) and validate-disorders (0 issues).

  summary: Bind the rabies antigen test as a LOINC measurement
  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and measurements: LOINC:31947-5 (Rabies virus Ag [Presence] in Specimen) to the Direct fluorescent antibody test on postmortem brain tissue row. The code is method-unspecified (not the narrower 'by Immunofluorescence' variant), matching the row's antigen-detection content without pinning the specific FAT method. No method-unspecified Rabies virus RNA code exists in the Monarch KG (all RNA presence codes are 'by Probe' or 'by NAA with probe detection'), so the RT-PCR row was left unbound. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch11 (LOINC_DIAGNOSTICS.md tranche B).

  summary: Map Treacher Collins syndrome to OMIMPS:154500
  details: |
    Checked actual series membership in January 2026 OMIM and class scope in September 2026 MONDO against the current Disease and its subtypes. PS154500 encompasses the TCOF1-, POLR1D-, POLR1C-, and POLR1B-related Treacher Collins forms already curated as TCS1 through TCS4. In the January 2026 OMIM snapshot these are OMIM:154500, OMIM:613717, OMIM:248390, and OMIM:618939; MONDO:0002457 has their corresponding four children and an exact series mapping in September 2026. Shared impaired ribosome biogenesis and cranial neural crest development explain the common craniofacial syndrome, while gene-specific pathways and dominant versus recessive inheritance remain internal distinctions. This maps the complete syndrome concept, not only the TCOF1 member, and does not merge other mandibulofacial dysostoses or POLR1C-related leukodystrophy on gene identity alone.
    Preserved existing verbatim source misspellings while adding line-local codespell annotations after checking the cached quotations.

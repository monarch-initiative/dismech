  summary: 'Genetics pass: bind defining genes on TCS1-TCS4 subtype rows'
  details: |
    Genetics pass for the d2g wiring campaign (issue #12207, epic #12189).

    Research first: GeneReviews chapter PMID:20301704 is already tagged on this
    entry and was the baseline; ClinGen gene-validity was consulted as a
    cross-check; Orphanet and the primary literature already cited in the entry
    were re-read. The entry's four causal genes (TCOF1, POLR1D, POLR1C, POLR1B)
    and its ribosome-biogenesis pathograph were already correct and already wired,
    so nothing was re-derived.

    Changes:
    - Bound the defining gene on each has_subtypes row: TCS1 to TCOF1 (hgnc:11654),
      TCS2 to POLR1D (hgnc:20422), TCS3 to POLR1C (hgnc:20194), TCS4 to POLR1B
      (hgnc:20454). Each MONDO subtype class is gene-defined, and the rows carried
      the gene only in prose, so the pair was invisible to any machine reader.
    - Added variant_origin: GERMLINE to all four genetic entries.

    Deliberately not changed: no case_fractions were added. The TCOF1 entry's
    existing notes record a considered decision not to assert a fixed gene
    attribution percentage, and the searches run for this pass found no cohort
    figure that would overturn it.

    MONDO reconciliation: MONDO:0007944 TCOF1, MONDO:0013385 POLR1D and
    MONDO:0030067 POLR1B are all present and now bound on their subtype rows.
    POLR1C (TCS3, MONDO:0009558) is curated here beyond MONDO's list for this
    entry. Noted for the PR rather than the entry: ClinGen classifies
    POLR1B-TCS4 and POLR1C-TCS3 as Moderate rather than Definitive; both remain
    CAUSATIVE here because both are diagnostic criteria in the GeneReviews
    chapter and the enum has no intermediate value.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (139/139), just list-gene-term-mismatches, and the offline gates all pass.

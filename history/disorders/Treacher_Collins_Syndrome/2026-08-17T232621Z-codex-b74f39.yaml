  summary: 'Publication-readiness review: Treacher Collins Syndrome'
  details: |
    Performed a deep publication-readiness review of the MONDO:0002457 Treacher Collins syndrome umbrella. Reconfirmed the four subtype and causal-gene boundary, dominant and recessive inheritance, and exclusion of POLR1A-related Cincinnati-type disease. Rebuilt an atomic evidence-calibrated ribosome-biogenesis to p53-dependent neural-crest-depletion graph; aligned phenotype frequencies and ontology bindings; expanded diagnosis, CT, differential, management, surveillance, counseling, experimental-model, dataset, and open-discussion coverage; and incorporated current GeneReviews, the 2024 European clinical consensus, and relevant 2024-2026 human cohorts and diagnostic studies. All reference records were generated only through just fetch-reference. An independent content audit approved the frozen content snapshot with no blockers. Focused validation passed schema, terms, references, 139/139 strict snippets, 17/17 phenotype connectivity, 4/4 causal-gene wiring, and 2/2 dataset accessions.

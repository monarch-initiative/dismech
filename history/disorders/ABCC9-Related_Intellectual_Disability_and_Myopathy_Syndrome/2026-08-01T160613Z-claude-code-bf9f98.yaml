  summary: 'Address review of PR #7668: add postural instability and hypotelorism
    phenotypes, heart-failure pharmacotherapy, lamotrigine evidence'
  details: |
    Closes the four blocking (IMPORTANT) items and three of five suggestions from the automated review of PR #7668. All added snippets are exact quotes from references_cache/PMID_31575858.md, chosen to avoid PDF-extraction ligatures and hyphenated line breaks so they pass both just validate-references (which does not normalise them) and scripts/check_snippets_verbatim.py (which does).

    1. Added phenotype Postural instability (HP:0002172, preferred_term 'Balance impairment'), frequency VERY_FREQUENT from the miniBESTest 6/6 denominator. The quoted span starts mid-sentence because 'moderate to severe deficits' is broken across a ligature; the severity grading is recorded in notes instead.
    2. Added treatment 'Heart failure pharmacotherapy' (NCIT:C15986 with therapeutic_agent NCIT:C247 ACE Inhibitor and NCIT:C29576 Beta-Adrenergic Antagonist), citing the index patient in whom an ACE antagonist plus beta-blocker was started, plus the cardiac-indication snippet. The description records the direction-of-effect contrast with Cantu syndrome, where ACE inhibitors are on the avoid list because they open channels that are already overactive; the Cantu avoid-list itself is still deliberately not transferred.
    3. Fixed the claim-snippet misalignment on 'Anti-seizure medication': added the PMID:31575858 sentence 'Lamotrigine treatment was partly effective.' as SUPPORT, added CHEBI:6367 lamotrigine as therapeutic_agent, and reworded the retained PMID:38217872 PARTIAL item's explanation, which had claimed no AIMS study reports anti-seizure drug outcomes.
    4. Added phenotype Hypotelorism (HP:0000601) with both the human-cohort sentence and the SUR2-STOP zebrafish cross-species sentence (MODEL_ORGANISM). No frequency band: the source says only 'some of the individuals', and the 4/6 figure comes from the OMIM:619719 HPO annotation set rather than from any reference this entry cites. Reason recorded in notes.
    5. Retagged the three PMID:37154692 'AIMS individuals show fatigability, muscle spasms, and cardiac dysfunction' items from HUMAN_CLINICAL to OTHER - the sentence is introductory framing in a mouse-model paper, not data that paper generated. Each explanation now says so and points at the human-cohort item alongside it.
    6. Added therapeutic_agent (CHEBI:9948 verapamil, NCIT:C333 Calcium Channel Blocker) to 'Avoidance of calcium channel blockers' so its binding is no longer identical to the generic supportive-care entry.
    7. Enriched the genetic features text with the founder-allele population genetics and added two gnomAD evidence items (Finnish heterozygote AF 0.0007, 18/24850; homozygous state absent), both tagged OTHER because they are reference-database lookups reported by the authors rather than cohort observations.

    Deliberately not done: OMIA Manchester Terrier ABCC9 dilated cardiomyopathy (no cached source and no structured-source pin available - #7622); the ClinGen 'no ABCC9 AIMS assertion' claim (an absence claim; the local ClinGen gene_validity cache does carry three other ABCC9 rows - Cantu Definitive, Brugada Disputed, DCM Limited - so a bare 'no assertions' statement would be wrong as written); the KATP-channelopathy grouping (out of scope for this entry); and module conformance, which remains unclaimed because it was not verified node-by-node in this pass.

    Validation: just validate PASS (schema, terms, references 141/141); just validate-references PASS 141/141; scripts/check_snippets_verbatim.py PASS 141 verified; scripts/check_folded_hyphens.py OK; just compliance 96.9% (282/291), weighted 97.2% - remaining gaps are datasets/evidence on proposed_experiments, which are experiments that have not been done.

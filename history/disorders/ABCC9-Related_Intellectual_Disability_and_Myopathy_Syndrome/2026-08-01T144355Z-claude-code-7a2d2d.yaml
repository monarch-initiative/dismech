  details: |
    Created the AIMS entry (ABCC9, hgnc:60; MONDO:0859224 intellectual disability and myopathy syndrome) from scratch. Deep research provider: claude_code (report at research/ABCC9-Related_Intellectual_Disability_and_Myopathy_Syndrome-deep-research-claude_code.md, 13 min, 4 web searches, 13 citations). No GeneReviews chapter exists for AIMS; PubMed searches on 2026-08-01 returned only the Cantu Syndrome chapter (PMID:25275207), which is the gain-of-function disease and is used here solely as the differential baseline, tagged GeneReviews together with the Permanent Neonatal Diabetes Mellitus chapter (PMID:20301620) used for the DEND differential. Curated: 13 atomic pathophysiology nodes forming one connected DAG with a single root (Biallelic ABCC9 Loss of Function) fanning into a skeletal-muscle arm, a cerebrovascular/white-matter arm and a cardiac arm; 20 HPO-bound phenotypes with frequency bands derived only from published cohort denominators; genetic, biochemical, diagnosis, treatment, animal-model, prevalence and inheritance sections; a mechanistic_hypotheses entry (aims_cerebrovascular_white_matter, EMERGING) with hypothesis_groups on the two edges it covers; a HUMAN_MODEL_MISMATCH discussion for the intellectual disability/anxiety phenotype against the formally negative SUR2-STOP mouse behavioural battery; a REFUTE evidence item against the CaV1.1 calcium-influx sub-hypothesis; and 7 differential diagnoses of which 5 carry bound MONDO terms (Cantu MONDO:0009406, ABCC8/SUR1 recessive hyperinsulinism MONDO:0019333, DEND MONDO:0019207, tuberous sclerosis MONDO:0001734, mitochondrial disease MONDO:0044970). Named-entity-confusion discipline: direction of effect is the discriminator, so every citation was checked to be biallelic loss-of-function ABCC9 material; Cantu (gain-of-function, dominant) and the ABCC8 paralogue diseases are curated as differentials rather than mixed in. Validation: just validate clean (schema + terms + references), 133/133 snippets verified by scripts/check_snippets_verbatim.py with 0 failures, check_folded_hyphens.py clean, compliance 96.7 percent.

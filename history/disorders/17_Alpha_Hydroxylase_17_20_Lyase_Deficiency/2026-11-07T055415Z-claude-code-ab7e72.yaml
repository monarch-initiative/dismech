  summary: 'Create: 17-Alpha-Hydroxylase/17,20-Lyase Deficiency, promoted from the
    CAH 17A-OHD subtype'
  details: |
    Promotes 17-OHD out of Congenital_Adrenal_Hyperplasia, where it had been a
    has_subtypes row, into its own Disease entry bound to MONDO:0008730. The parent
    keeps a pointer subtype carrying curated_in, so the concept is modelled once.
    Requested by the maintainer after PR #16594 recorded the promotion as a
    deliberate non-decision.

    Naming followed the entry-naming skill. The disease is single gene (CYP17A1,
    hgnc:2593 by RO:0004003 on the MONDO term), so rule 2 applies, but no
    established gene-related name exists: the MONDO label and all three of its
    exact synonyms are enzyme-named, there is no GeneReviews chapter, and the OMIM
    title is enzyme-named too. Step 7 therefore applies and the existing clear name
    is kept rather than coining a CYP17A1-Related dyad. The MONDO label, the other
    synonyms and 17OHD are in synonyms. The scope test passes: combined
    17-alpha-hydroxylase/17,20-lyase deficiency is CYP17A1 by definition, and
    isolated 17,20-lyase deficiency, which can also be CYB5A or POR, is a different
    entity the name excludes.

    Content. Nine pathophysiology nodes carry the two-branch mechanism: CYP17A1
    loss of function splits into a cortisol branch (cortisol synthesis failure to
    HPA activation to adrenal hyperplasia, and to precursor diversion) and a sex
    steroid branch (synthesis failure to hypergonadotropic drive). The
    mineralocorticoid arm is modelled explicitly, with 11-deoxycorticosterone
    (CHEBI:16973) and corticosterone (CHEBI:16827) accumulating, driving receptor
    overactivation, and suppressing renin and aldosterone. Fourteen phenotypes come
    from the Orphanet HPO annotations with their frequency bands, each citing its
    own table row. The 17,20-lyase molecular function is deliberately unbound, as in
    the parent entry: GO:0004508 is 17-alpha-hydroxylation only (RHEA:65760) and GO
    has no term for the lyase reaction.

    Deliberate omissions, each recorded in notes with what was searched:
    - No mineralocorticoid receptor antagonist treatment. A search for their use in
      this disorder returned only a review that assigns spironolactone and
      eplerenone to apparent mineralocorticoid excess rather than to CAH; the 17-OHD
      literature treats the hypertension by suppressing ACTH with glucocorticoid,
      and two cited reports record antihypertensives being stopped once replacement
      was adequate.
    - No bone mineral density content. One PubMed record matches the obvious
      search and it concerns abiraterone induced 17-hydroxylase blockade in
      prostate cancer, a pharmacological phenocopy.
    - No rate per 100,000. Orphanet's European point prevalence class is recorded;
      the only other figure available is a share of CAH, which is not a rate.
    - The GeneReviews near miss is named by title only. Writing its identifier made
      check-genereviews read the note as CITED_UNTAGGED, since the check cannot tell
      a citation from a note saying a chapter is the wrong disease.

    Evidence: 44 snippets across 10 references, 9 of them peer reviewed. ORPHA:90793
    was fetched for this entry; its cache file is stamped with the Orphadata release
    date 2026-06-23 rather than the manifest pin of 2025-12-09, which is the
    documented behaviour when the downloaded files are newer than the pin, and the
    rebuild warns about it. The preprint is cited for the carrier burden, the
    catalytic mechanism and the progesterone against cortisol contrast, and every
    item using it says it is not peer reviewed.

    Validation: just validate passed (44 snippets, 54 titles, 0 issues),

  details: |
    Review round 1 on #17037. (1) The note on mineralocorticoid receptor antagonists said every 17-OHD report read treated hypertension with glucocorticoid only; Case 4 of PMID:34524979 records a patient who remained on spironolactone after hydrocortisone was started. The note now reports that case and says why it is not recorded as a treatment (no stated indication). (2) The Partial subtype description now states that CYP17A1-caused isolated 17,20-lyase deficiency is covered by the subtype and that ILD from other genes (CYB5A, POR) is outside the entry, and quotes the PMID:38933733 sentence calling ILD a partial form of this disorder (BACKGROUND). Not addressed in this round: the deep-research requirement, because no deep-research provider is configured in the shepherd environment; the optional suggestions (hydrocortisone agent, 46,XY partial phenotypes, GnRH agonist treatment, biological_scale) were left for the author. just validate passed; all snippets verified.

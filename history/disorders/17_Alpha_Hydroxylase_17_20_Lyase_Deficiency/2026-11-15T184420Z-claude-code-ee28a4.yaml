  summary: Add partial-deficiency 46,XY undervirilization phenotypes
  details: |
    Took the reviewer's open suggestion on PR 17037. Added Micropenis (HP:0000054), Hypospadias (HP:0000047), Cryptorchidism (HP:0000028) and Gynecomastia (HP:0000771) as phenotypes scoped to subtype Partial, each quoting the case 5 presentation in PMID:34524979 plus that paper's discussion sentence placing the undervirilized 46,XY cases 5, 7 and 8 at the milder-mutation end. Hypospadias and gynecomastia also quote case 8. Hypospadias is bound to the general term because case 5 is glanular and case 8 is unspecified. Sex Steroid Synthesis Failure gains edges to micropenis, hypospadias and cryptorchidism; gynecomastia is left unconnected because the source gives no mechanism. Validated with just validate (59/59 snippets, 0 issues), check-causal-targets, check-entity-refs, check-name-collisions, check-duplicate-keys and check-coarse-phenotypes. The deep-research requirement is unchanged and still open.

  summary: 'Create: Multiple Mitochondrial Dysfunctions Syndrome 10 (CIAO1)'
  details: |
    Created kb/disorders/Multiple_Mitochondrial_Dysfunctions_Syndrome_10.yaml for
    MONDO:0975806 / OMIM 620960, CIAO1, closing the stub of the same name (deleted in
    this change) and issue #18437.

    Deep research. Two reports are committed under research/. The antigravity run was
    requested for this entry; its first attempt came back marked
    answer_status: unsuccessful (the agent answered without retrieving), so it was
    deleted and rerun, and the second attempt retrieved normally (48 retrieval calls,
    900 s, 13 citations) and is the committed report. No provider fallback was used. A
    claude_code report generated in an earlier session is committed alongside it. Both
    pass `just preflight-dr` against MONDO:0975806 with CIAO1 as the named gene (97 and
    38 mentions respectively), so neither is about a different disease. Both carry
    needs_review: true in their term-validation blocks; in each case the cause is the
    report naming a resolving CURIE after its ontology rather than after the term
    (MONDO:0975806 called "Mondo Disease Ontology", NCBITaxon:6239 called "Nematode"),
    not a fabricated identifier. No CURIE was taken from either report; every binding
    was resolved against a local ontology build in the step it was written.

    The antigravity report earned its place by surfacing PMID:41131702, a 2025
    C. elegans study absent from the earlier report, which knocks each of the three
    patient CIAO1 residues into the nematode and shows all three are hypomorphic. That
    paper supplies the second animal model, the variant-level functional evidence, the
    ClinVar classification of the three variants, and the in vivo basis for the
    fluoropyrimidine knowledge gap.

    Sources and scope. Only three primary sources exist for this disease and all three
    are cached as full text: PMID:38950322 (four patients, dystrophic myopathy),
    PMID:38411040 (two patients, lethal congenital neurodegeneration) and PMID:41131702.
    The two clinical reports are curated as one disease with a wide spectrum rather than
    split; the argument and its weakness are recorded in the entry's notes, which also
    records that the entry-level lump is the most contestable decision in it. No
    GeneReviews chapter exists for the disease or the gene, confirmed offline against the
    Bookshelf index and by an online title and gene-symbol search.

    What is in the entry: 11 pathophysiology nodes forming a connected chain from the
    biallelic lesion through loss of the CIA targeting complex and failed cluster
    delivery to the four client-loss branches, the secondary muscle mitochondrial defect,
    the central nervous system neurodegeneration and the proposed antiviral failure; 31
    phenotypes; one causative gene record; two animal models (the zebrafish ciao1
    knockout and the nematode patient-variant knock-in series, the latter with typed
    divergences); one treatment; and two knowledge gaps.

    Two discrepancies between the primary reports are recorded rather than resolved,
    because both are real and neither paper addresses the other. PMID:38411040 found
    POLD1, XPD and PPAT protein levels unchanged in its patients' fibroblasts, which
    contradicts a general loss of replication and repair clients; it is carried as a
    REFUTE evidence item on that node, with the differing readouts (iron incorporation
    and steady-state level in two patients against steady-state expression in two
    others) set out in the node description as a possible reconciliation that neither
    paper tests. The two reports also disagree about whether p.Arg65Trp destabilizes the
    protein, in different systems; that is recorded in the gene record's notes.

    An internal red-team review before the PR found both of those, plus a false statement
    in the treatment description (it said phenobarbital was the only drug treatment
    reported and that no respiratory support was documented, where the same paper records
    antibiotics, bronchial lavage, oscillator ventilation and intubation), a GO binding
    that asserted the assembly step the node says is intact (GO:0044572 replaced by
    GO:0140132 iron-sulfur cluster chaperone activity), HP:0001897 Normocytic anemia
    asserting a normal mean cell volume for a normocytic-to-macrocytic cohort (replaced
    by HP:0001903 Anemia), HP:0006466 asserting a flexion direction the source does not
    state (replaced by HP:0034677 Ankle contracture), four evidence items whose
    evidence_source or quote_role described the wrong material, two lysate-biochemistry
    items graded HUMAN_CLINICAL where the same assay elsewhere in the file was IN_VITRO,
    and one causal edge inferred without a source. All were fixed in this change. The
    inferred edge mattered: the mitochondrial defect was drawn as a cause of the
    myopathy, which neither report claims, while the entry's own notes refused the same
    inference for other phenotypes; the myopathy is now parented on the failed-delivery
    node with the authors' protein-turnover sentence as evidence.

    The review also supplied content the entry had omitted, all added here: the neonatal
    electroencephalographic abnormality (the feature the one reported treatment actually
    treats), bulbar weakness, complexes II and IV, a proteome/metabolome/lipidome
    remodeling node, the proteomics enrichment result behind the antiviral node, the
    nematode mortal-germline phenotype, and the recovery of DPD at lower culture
    temperature. Four antigravity suggestions were checked against the cached sources and
    deliberately not used, because the sources do not support them: generalized hypotonia
    (PMID:38411040 reports hypertonia), elevated transferrin saturation (iron homeostasis
    is explicitly unaltered), noninvasive ventilation as a documented intervention, and a
    claim that all four myopathic patients are alive on ongoing management.

    Validation, all run on the final tree. `just validate` passes with 89 of 89 snippets
    and 89 of 89 titles checked and 0 issues. Term validation passes with every prefix
    resolved against a local ontology build, since the OLS adapters were unreachable from
    this machine. `just compliance` reports 87.0 percent weighted. The per-file gates
    check-entity-refs, check-causal-targets, check-name-collisions, check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-coarse-phenotypes,
    check-logical-rules, check-delivery-system and check-block-scalar-comments all pass,
    as do the whole-repo ratchets check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-reference-titles, check-retired-support-prose and
    check-snippet-grading, the last of which covers the regraded evidence items.
    check-gene-namespaces, check-shared-disease-terms, check-granularity,
    check-cache-order and check-term-cache-integrity also pass. Eight term-cache and
    enum-cache rows were added for the terms this entry needs, in canonical order.
    21 of the 31 phenotypes are causally connected (67.7 percent, above the KB-wide
    floor); the ten left unconnected are listed with reasons in the entry's notes.

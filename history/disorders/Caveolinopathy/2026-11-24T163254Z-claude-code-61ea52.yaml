  summary: 'Create: Caveolinopathy'
  details: |
    New entry for CAV3 caveolinopathy (MONDO:0016146), following ClinGen's Definitive lumping of the allelic CAV3 phenotypes. Subtypes: LGMD1C (unbound, MONDO and Orphanet have merged it into rippling muscle disease 2), RMD2 (MONDO:0019947), HyperCKemia (MONDO:0007402; MONDO:0016103 deliberately not bound because it has no causal gene and also sits under dystrophinopathy), Tateyama as a curated_in pointer to Distal_Myopathy_Tateyama_Type, HCM (unbound, two-sibling report), and LQT9 (MONDO:0012736, ClinGen Limited for long QT, cited on the subtype rather than recorded as gene_disease_validity). Pathophysiology chain: CAV3 missense variant, Golgi retention and sequestration of wild-type caveolin-3, sarcolemmal caveolin-3 and caveolae loss, then impaired mechanoprotection, MG53/dysferlin mislocalization and membrane-repair failure (conforms to sarcolemmal_fragility_myofiber_necrosis#Sarcolemmal Membrane Repair Failure), T-tubule disorganization, mechanical hyperexcitability, and separate cardiac branches (Cav3-null cardiomyopathy with ERK1/2 hyperactivation; late sodium current increase for LQT9). Much of the mechanism evidence is reused verbatim from the existing Tateyama entry. Deep research: one Perplexity report (research/Caveolinopathy-deep-research-perplexity.md), preflight-dr PASS, 6/6 references verified; its suggested HPO terms were mostly mislabelled and none were used. Of its citations, PMID:12138167, PMID:20229577, PMID:15099591, PMID:10746614, PMID:11756609 were used; PMID:17405141 (a single-case rippling report) was not needed. The 2023 multicenter cohort PMID:37166430 supplies phenotype frequencies. The deep-research run rewrote two tracked reference caches (PMID_27312022, PMID_31036801); these were restored with git checkout and not committed. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), and validate-disorders.

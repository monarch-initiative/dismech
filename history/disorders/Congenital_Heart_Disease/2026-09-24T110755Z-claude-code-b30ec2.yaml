  summary: Requote TBX1 from a stable primary source after CI reference validation
  details: |
    CI reference-validation fix on PR #12668.

    `just validate-disorders` passed locally and failed in CI on two snippets attached to
    the Cardiac Neural Crest Migration and Outflow Tract Septation Failure node, both cited
    to PMID:17668378.

    The cause is where the quoted text sits in the cached record rather than anything about
    the committed bytes, which are identical locally and on the branch. PMID:17668378 is
    cached as `content_type: full_text_html`. Local validation reads that committed file;
    CI refreshes references during the run and refuses stale HTML full text as a possible
    repository landing page, falling back to the abstract. Both quoted sentences sit at
    byte offsets 6309 and 6581, past the Abstract header at 3263, so they exist only in the
    HTML body and disappear for the CI validator. The occurrence count is the diagnostic:
    the four TBX20 snippets taken from the same paper each appear twice, once in the
    `## Content` block and once in the duplicated Abstract, and were unaffected; the two
    TBX1 sentences appear once.

    The citation was independently the weaker of the two available. PMID:17668378 is the
    TBX20 paper, and both snippets were its introduction framing TBX1, which is why they
    carried `quote_role: BACKGROUND`. That grading was correct, but the entry's TBX1
    `genetic:` record already cites PMID:14585638, "Role of TBX1 in human del22q11.2
    syndrome" - a primary human TBX1 study, cached `abstract_only` and therefore not
    subject to the same refresh. Stability and attribution pointed the same way, so the
    node was requoted from that source rather than patched to a different sentence of the
    TBX20 paper.

    The replacement item binds TBX1 on its outflow tract phenotype, human point mutations
    with no 22q11.2 deletion producing conotruncal anomaly face syndrome and DiGeorge
    syndrome, and its explanation says that rather than claiming a neural crest mechanism
    the abstract does not state. The node's neural crest mechanism remains evidenced by
    PMID:32405705 and PMID:39000221, which were already there.

    Swept both entries for the defect class rather than the two reported instances. Of 191
    distinct PMID snippets, those two were the only quotes reachable solely through a
    `full_text_html` body; none remain. The `full_text_xml` quotes in both entries were
    left alone: CI did not flag them, and the validator's refusal message names HTML
    specifically.

    Self-review of the replacement explanation caught one over-specification. It first
    read "human point mutations in the gene alone"; PMID:14585638 says only "mutations in
    the coding sequence of TBX1" and never characterises them as point mutations, so the
    wording was corrected to "coding-sequence mutations". No other claim in the new text
    goes beyond the cited abstract.

    Re-swept both entries for the defect class independently rather than trusting the
    count above: of 231 PMID snippets across the two files (169 abstract_only, 42
    full_text_xml, 13 full_text_html, 7 full_text_pdf), none is now reachable only through
    a full_text_html body.

    Validation after the edit: the standard per-file loop, the whole-KB gates, and
    validate-disorders last. `just validate-disorders` upgraded thirteen unrelated
    reference caches from abstract to full text as a side effect; those were reverted and
    the snippets re-verified against the committed caches, so the commit carries only the
    entry and this record.

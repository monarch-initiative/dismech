  summary: Wire CHD genes into the pathograph; rule gene-defined concepts off the
    anatomic subtype axis
  details: |
    Genetics pass on the congenital heart disease root (genetics-gap series-024, issue #12231).

    ANCHOR. MONDO:0005453 re-checked against OLS and kept. It is the correct term for an
    umbrella entry, not an over-broad stand-in for a gene-named concept, so the #12184
    narrowMatch remedy does not apply. What it does mean is that every gene-defined
    descendant is attributed to this entry by the knowledge-graph comparison, which is how
    sixteen gene-defined concepts arrived as candidate subtype rows.

    SCOPE RULING: no gene-defined rows were added. This entry declares itself the
    mechanistic root of the CHD family and its seven has_subtypes rows are anatomic lesion
    classes (CTD, Septal, AVSD, LVOTO, RVOTO, HTX, APVR) chosen because differential
    genetic architecture has been reported for them. The gene-defined MONDO concepts
    cross-cut that axis rather than sitting under it - MONDO's own definition of
    GATA6-related congenital heart disease enumerates lesions spanning several rows at
    once - so adding them as rows would put a second overlapping partition in one slot.
    Ten are curated instead as genetic: records wired to the mechanism node the gene acts
    at; four are dispositioned; two are not heart malformations. The reasoning is recorded
    in the entry's notes, not only here.

    THE MEASURED GAP WAS PATHOGRAPH REACH, NOT MISSING GENES. Before this pass the entry
    bound twelve genes in genetic: and not one pathophysiology node carried a genes: list.
    Sixteen genes are now bound across six nodes: KMT2D/CHD7/RBFOX2 on gene dosage
    disruption, HAND1/HAND2 on progenitor and second-heart-field deployment, ZIC3/SMAD2 on
    left-right patterning, TBX1/TFAP2B/GATA6 on cardiac neural crest and outflow tract,
    NOTCH1/PLD1 on endocardial cushion EMT, and NKX2-5/GATA4/TBX5/TBX20 on the septation
    transcription factor network. Nodes with bound genes went 0/10 to 6/10.

    Seven genetic: records added, each with its own evidence and each wired: TBX20, SMAD2,
    GATA6, HAND1, HAND2, PLD1, TFAP2B. TBX20 is not on the issue list and was found during
    the ClinGen pass: it is graded Definitive against MONDO:0005453 itself, is named in
    this entry's own septation-network prose, and had no record. relationship_type:
    CAUSATIVE was backfilled on the twelve pre-existing gene records.

    DISPOSITIONS. ACTC1 (MONDO:0700352): syndromic distal arthrogryposis, no ClinGen CHD
    assertion, already bound in six other entries. NR2F2 (MONDO:0014344): already curated
    in Atrioventricular_Septal_Defect and Congenital_Diaphragmatic_Hernia; ClinGen's
    Definitive assertion is against a different concept (MONDO:0800458). GATA5
    (MONDO:0060663) and PLXND1 (MONDO:0859532): no ClinGen gene-disease validity assertion
    of any kind, and the literature found on a dated PubMed search is thin; recorded as
    open rather than disputed, since an absence of positive curation is not a refutation.

    MONDO FINDING WORTH REPORTING UPSTREAM. MONDO:0100090 and MONDO:0100097 (congenital
    alveolar dysplasia due to FGF10 / due to TBX4) are lung disorders, yet they are
    genuine descendants of congenital heart disease by this chain: each has MONDO:0100077
    'congenital alveolar dysplasia' as a parent; its only asserted parent is MONDO:0020295
    'congenital pulmonary veins anomaly'; and that term's only asserted parent is
    MONDO:0005453. The questionable step is filing alveolar dysplasia under a pulmonary
    veins anomaly - MONDO's own definition of MONDO:0100077 describes alveolar hypoplasia
    and atelectasis and says nothing about veins. An earlier draft of the entry's notes
    asserted these terms were not descendants at all; that was wrong and was corrected
    before push. Neither belongs on this entry either way, on disease grounds.

    ClinGen grades throughout were read from the Gene-Disease Validity CSV on 2026-09-24
    and recorded in prose with that date rather than as evidence items, because
    `just clingen-refresh` fails on a drifted pin (#10426) and `just fetch-reference`
    has no CGGV source, so none of the relevant assertions could be cached and quoted.

    Validation: just validate, validate-terms, count-verified-snippets (240/240 across both
    entries), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches (35 bindings, 0
    mismatches), check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-genereviews, validate-disorders.

    Self-review caught and fixed before push: a fabricated reference_title on two new
    evidence items (the title of a different paper); two prose claims about HAND1 and HAND2
    that no cited source supported, replaced with sourced statements plus the evidence to
    back them; a cytogenetic band quotable only inside a bracketed span the snippet
    validator strips; and the descendant claim described above.

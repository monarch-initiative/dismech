  details: |
    Review round 1 on PR #12668.

    THREE BLOCKING FINDINGS, ALL IN PROSE.

    1. The `notes:` contradicted itself about MYH6, listing it among the genes "now wired
    into the pathograph" while a later paragraph, and the pull request body, said it
    reaches no node. No node's `genes:` lists it. The reconciliation paragraph was
    rewritten as a durable statement of where each gene reaches the pathograph - sixteen
    records bound on a node, named node by node - with GDF1, FLT4 and MYH6 stated as
    reaching none. MYH6 appears only in the second list now.

    2. TFAP2B carried `subtype: Septal` on a rationale the Septal row does not support.
    That row is limited to communications across the interatrial and interventricular
    septum and mentions the arterial duct only in passing; a patent duct is not a septal
    defect. The reviewer offered either dropping the foreign key or widening the Septal
    row, and the first was taken: widening the row would be a larger claim about this
    entry's lesion axis than the evidence for one gene warrants. The record now sets no
    `subtype`, as KMT2D and CHD7 already do, and its notes say plainly that none of the
    seven lesion rows covers patent ductus arteriosus. The gene remains wired to the
    cardiac neural crest node.

    3. The new `notes:` narrated the curation session. Removed: the series number and
    issue reference, "The anchor was re-checked first", "sixteen such concepts were put
    forward as candidate subtype rows", "Added by this pass", "Added although the issue
    did not list it", "the campaign's rule is...", and the sentence recording that an
    earlier draft of the note had denied the alveolar-dysplasia descent - which CLAUDE.md
    names as exactly the "the first version of this entry said..." pattern to avoid. The
    PLD1 notes lost a sentence that qualified itself and told a reader nothing about PLD1.
    Every underlying fact was kept and rewritten as a plain statement: the anchor is
    correct and the dismech#12184 remedy does not apply; why gene-defined concepts are not
    rows on an anatomic axis, with MONDO's own GATA6 definition as the demonstration; the
    ACTC1, NR2F2 and GATA5/PLXND1 dispositions with their ClinGen and PubMed read dates;
    the questionable MONDO:0100077 to MONDO:0020295 edge; and the unwired genes.

    The process narrative removed from `notes:` belongs here: the gap list is dismech#12231
    (genetics-gap series-024) under epic #12189; sixteen gene-defined MONDO concepts were
    put forward as candidate subtype rows; ten were curated as `genetic:` records in the
    preceding session, four dispositioned and two ruled out as pulmonary disorders; TBX20
    was added although the gap list did not name it, having turned up in the ClinGen pass
    as Definitive against MONDO:0005453 itself. An earlier draft of the entry's notes
    asserted the alveolar dysplasia terms were not descendants of MONDO:0005453; they are,
    and the note was corrected before the first push.

    A sweep of every prose field in the entry for the same narration defect found one
    further instance beyond those the reviewer named - the PLD1 sentence - and two false
    positives on "before this", which refer to the cited publication rather than to this
    pull request.

    SUGGESTION TAKEN. The reviewer noted that TBX1's binding to the cardiac neural crest
    node rested only on background sentences in the TBX20 paper, and asked whether the
    TBX1 `genetic:` record already cited a primary human source. It cited nothing at all.
    PMID:14585638 was added to that record: human TBX1 point mutations in patients without
    a 22q11.2 deletion, producing conotruncal anomaly face syndrome and DiGeorge syndrome,
    which separates the gene's own contribution from the wider deleted region.

    PHENOTYPE CONNECTIVITY CHECKED. Unlike the sibling entry in this pull request, this one
    has no disconnected-phenotype problem: all 20 phenotype nodes are causally connected.

    Validation after the last edit: the standard per-file loop, the whole-KB gates, and
    validate-disorders last.

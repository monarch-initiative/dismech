  summary: 'Create: Congenital Heart Disease (MONDO:0005453) mechanistic root with
    seven lesion-class subtypes'
  details: |
    New root Disease entry for the congenital heart disease umbrella (MONDO:0005453), curated per the priority dashboard's CURATE_ROOT_WITH_SUBTYPES recommendation (issue #8916).

    SCOPE. Deliberately curated as the MECHANISTIC ROOT of the CHD family rather than a superset of the ~24 lesion-specific and many syndromic entries already in kb/disorders (Atrial_Septal_Defect, Tetralogy_of_Fallot, Coarctation_of_the_Aorta, Hypoplastic_Left_Heart_Syndrome, Dextro_Transposition_of_the_Great_Arteries, Persistent_Truncus_Arteriosus, Double_Outlet_Right_Ventricle, Ebstein_Anomaly, Visceral_Heterotaxy, 22q11.2_Deletion_Syndrome, CHARGE_Syndrome, Alagille_syndrome, Down_syndrome, Holt-Oram_Syndrome, Noonan_Syndrome, Turner_Syndrome, Kabuki_Syndrome and others). The entry models the shared cardiac developmental biology those entries individually assume but none asserts: (1) Developmental Gene Dosage Disruption (de novo variants in chromatin modifiers and high-heart-expression genes, CNVs, aneuploidy); (2) Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis; (3) Cardiac Progenitor Specification and Second Heart Field Deployment Failure; (4) Left-Right Patterning and Cardiac Looping Failure; (5) Cardiac Neural Crest Migration and Outflow Tract Septation Failure; (6) Endocardial Cushion Formation and Endothelial-to-Mesenchymal Transition Failure; (7) Cardiac Septation Transcription Factor Network Failure; (8) Flow-Dependent Cardiac Morphogenesis Failure ("no flow, no grow"); converging on (9) Structural Cardiac Malformation and (10) Altered Circulatory Physiology. Lesion-specific pathographs, post-operative course, and the shunt-to-Eisenmenger trajectory are referenced by entry name and NOT re-derived here.

    SUBTYPES. Seven has_subtypes lesion classes with short slug-friendly foreign-key names used by the phenotypes and genetic blocks: CTD (MONDO:0016581 conotruncal heart malformations), Septal (no single MONDO class covers the atrial-plus-ventricular septal group; constituent lesions curated separately), AVSD (MONDO:0859565), LVOTO, RVOTO, HTX (MONDO:0018677 visceral heterotaxy), APVR (MONDO:0017705). Classes follow the analytic groupings used in the CHD genomics and epidemiology literature rather than a surgical classification, because differential genetic architecture has actually been reported for those classes - notably the absence of a de novo variant excess in heterotaxy (PMID:26785492) and the distinctive isolated-CHD diagnostic yield in LVOTO (PMID:34440418). LVOTO, RVOTO and Septal carry no subtype_term because SubtypeDescriptor binds MONDO/NCIT only and no suitable MONDO class exists; HP:0032092 (Left ventricular outflow tract obstruction) is carried on the corresponding phenotype instead.

    DISEASE ENTRY VS GROUPING. Concluded that a Disease entry is correct here and a kb/groupings Grouping would be complementary rather than a substitute. The subtype classes are anatomical/developmental partitions of one mechanistic model, not a curated union over already-distinct Disease entries; the pathograph (10 nodes, 22 causal edges) is a single shared mechanism no member entry asserts, and a Grouping cannot carry a pathograph. A future Grouping recording the audited membership boundary over the existing lesion entries would follow the Familial_Hypertrophic_Cardiomyopathy precedent (umbrella Disease plus Grouping) and is recorded as the open discussion chd_root_scope rather than forced into this PR.

    DEEP RESEARCH. Provider: falcon (Edison Scientific Literature), 674s, research/Congenital_Heart_Disease-deep-research-falcon.md plus its .citations.md sidecar and one markdown artifact. Report reference_validation: 7/7 references resolved, confabulation_rate 0.0, no unresolved_references, no off_topic references. The report was DOI-keyed and mechanistically thin, so it was used as a LEAD SOURCE ONLY: its five DOIs were converted to PMIDs via the PMC ID converter API and every curated claim was re-anchored on primary literature independently searched through the PubMed E-utilities API and independently fetched with just fetch-reference.

    NEC CHECK. just preflight-dr research/Congenital_Heart_Disease-deep-research-falcon.md MONDO:0005453 returned SKIP as anticipated (MONDO records no causal gene RO:0004003 for this complex/multifactorial root term, so the gene-identity check cannot discriminate). Fell back to the manual CLAUDE.md section 2b checks against uv run runoak -i sqlite:obo:mondo info MONDO:0005453 -O obo: no OMIM xref exists for this term; every synonym ("congenital heart defect", "congenital anomaly of heart", "heart malformation", the MESH:D006330 variants) denotes the same concept with no eponymic, numbered-series, or acronym collision; and the report's top gene mentions (NKX2-5=9, GATA4=6, TBX20=6, TBX1=6, MYH6=6) are all canonical CHD genes consistent with the intended entity. Manual NEC check: PASS.

    GENEREVIEWS. No GeneReviews chapter exists for the CHD umbrella - PubMed esearch on 2026-08-19 with term "congenital heart disease[TI] AND GeneReviews[All Fields]" returned zero results. Expected for a complex multifactorial root term, and recorded in the entry notes. GeneReviews chapters do exist for several syndromic causes and are cited in those entries.

    EVIDENCE. 81 evidence snippets across 20 independently fetched and verified PMIDs. Core sources: Zaidi 2013 Nature PMID:23665959 (de novo chromatin-modifier burden, H3K4/H2BK120), Homsy 2015 Science PMID:26785492 (1213 trios; CHD/NDD/CA shared genetics; RBFOX2-HLHS; heterotaxy exception), Jin 2017 Nat Genet PMID:28991257 (2871 probands; GDF1 Ashkenazi founder, MYH6/Shone, FLT4/TOF, ~440 genes), Guijarro and Kelly 2024 PMID:38488639 (second heart field), cardiac neural crest review PMID:32405705, Zubrzycki 2024 IJMS PMID:39000221 (cardiac development), Garg 2003 Nature PMID:12845333 (GATA4-TBX5), Schott 1998 Science PMID:9651244 (NKX2-5 septation plus AV conduction), Garg 2005 Nature PMID:16025100 (NOTCH1 aortic valve), Gebbia 1997 Nat Genet PMID:9354794 (ZIC3), zebrafish flow-dependent morphogenesis PMID:26969993, Liu 2019 Int J Epidemiol PMID:30783674 and van der Linde 2011 PMID:22078432 (birth prevalence), Can J Cardiol 2024 prenatal risk-factor meta-analysis PMID:38996968 and AHA non-inherited risk factor statement PMID:17519397, Thangaratinam 2012 Lancet PMID:22554860 (pulse oximetry screening), Helm 2021 PMID:34440418 and Peterlin 2024 PMID:39337901 (genetic testing yield), prostaglandin E1 PMID:29162633, maternal pregestational diabetes PMID:35838899.

    ONTOLOGY. Three CL/GO terms used here were previously unused or near-unused in this knowledge base: CL:2000073 (migratory cardiac neural crest cell), which existing entries had been naming only as free text; GO:0003272 and GO:0003203 (endocardial cushion formation and morphogenesis), which had no prior use; and GO:0003198 (epithelial to mesenchymal transition involved in endocardial cushion formation), which had one. All terms were verified with OAK before use. Two ECTO exposure terms bound (ECTO:0300001, ECTO:0300003); maternal pregestational diabetes and maternal adiposity are deliberately left unbound with a note recording that ECTO was searched and has no class for a maternal metabolic disease state as an exposure.

    DISCUSSIONS. Four open discussions recorded: chd_root_scope (CURATION_TODO - what this adds over the existing entries and whether a complementary kb/groupings Grouping should enforce the boundary); chd_module_candidate (CURATION_TODO - whether the cardiac morphogenesis chain should be factored into a kb/modules mechanism module that the eight-plus lesion entries could declare conforms_to, since no module currently covers cardiac development); chd_flow_dependent_human_evidence (HUMAN_MODEL_MISMATCH - the direct evidence that haemodynamic force is a necessary morphogenetic input is zebrafish, human support is inferential, with a proposed fetal aortic valvuloplasty growth-trajectory experiment); chd_prevalence_ascertainment (KNOWLEDGE_GAP - reported prevalence variation is dominated by ascertainment rather than biology, which is why the prevalence records are curated as reported birth prevalence).


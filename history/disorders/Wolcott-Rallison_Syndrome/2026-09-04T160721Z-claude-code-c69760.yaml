  summary: 'Review round 1: reviewer findings + snippet-length CI'
  details: |
    Addressed the automated reviewer's CHANGES_REQUESTED and the red CI
    snippet-length gate on PR #10941 in one bundled push.

    CRITICAL (CI snippet-length, scripts/check_snippet_length.py, no grandfathering):
    six phenotype evidence items used sub-5-word clause fragments extracted from the
    PMID:38230874 enumeration ("skeletal abnormalities in 59.8%", "impaired growth in
    72%", "the kidney in 35.4%", "the nervous system in 37.6%", "insufficient
    haematopoiesis in 34.4%", "hypothyroidism in 14.8%"). All six now quote the full
    enumerating sentence from the cache, with evidence_source kept identical
    (HUMAN_CLINICAL) across every occurrence so check-snippet-grading does not diverge.
    scripts/check_snippet_length.py --against-ref origin/main now exits 0.

    IMPORTANT findings:
    2. Added an Exocrine Pancreatic Insufficiency phenotype (HP:0001738, OCCASIONAL,
       PMID:38230874 10.6%).
    3. Connected the five orphaned phenotypes (Growth Retardation, Renal Insufficiency,
       Global Developmental Delay, Neutropenia, Hypothyroidism) plus the new exocrine
       phenotype to the pathograph via downstream edges from "Unresolved Endoplasmic
       Reticulum Stress" with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES (research
       s6 branch D loss-of-adaptive-capacity).
    4. Added an environmental: block with three trigger exposures acting on
       "Stress-Triggered Hepatocyte Injury" (environmental_effect TRIGGERS), each with
       its own link-level and entry-level evidence: intercurrent viral illness
       (ECTO:3000001, PMID:25659842), general anaesthesia (ECTO:2000059, PMID:21050479),
       and iatrogenic hypoglycemia from tight glycemic control (unbound exposure_term
       with a review_notes line recording the ECTO search, PMID:32321554).
    5. Added an animal_models: block for the Perk (Eif2ak3) knockout mouse
       (PMID:17141632, MODEL_ORGANISM) with a modeled_mechanisms link to
       "ER-Stress-Induced Beta-Cell Failure" (RECAPITULATES, fidelity HIGH,
       model_scale CELLULAR, limitations, a DECREASED beta-cell-mass readout).
    6. Added a diagnosis: block (NCIT:C15709 Genetic Testing) covering EIF2AK3
       molecular confirmation and the islet-autoantibody-negative discriminator versus
       autoimmune type 1 diabetes, and attached the autoantibody evidence (PMID:32321554)
       to the previously-unevidenced claim in the "Insulin Deficiency" node description.

    Suggestions taken: top-level references: block for PMID:21050479 (title only, since
    the tags enum permits only GeneReviews); orthopedic surgical stabilization treatment
    (NCIT:C16186) targeting the Atlantoaxial Instability node; an Osteoporosis phenotype
    (HP:0000939, PMID:10932183 + PMID:21050479 "Bone fractures may be frequent") connected
    from the skeletal ossification node; and insulin therapeutic_modality changed from
    PEPTIDE to PROTEIN_REPLACEMENT (hormone replacement).

    The batched reference validator opportunistically upgraded seven committed abstract
    caches to full-text PDF and wrote local_pdf_path pointers to uncommitted files; those
    rewrites were reverted so the PR keeps the committed abstract caches (all 56 snippets
    still verify against them). Gates re-run green: validate, count-verified-snippets

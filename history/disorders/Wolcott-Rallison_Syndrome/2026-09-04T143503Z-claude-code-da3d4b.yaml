  summary: 'Create: Wolcott-Rallison syndrome'
  details: |
    Created a de-novo Disease entry for Wolcott-Rallison syndrome (MONDO:0009192;
    EIF2AK3/PERK, hgnc:3255; autosomal recessive; biallelic loss of function).

    Deep research: `just research-disorder claude_code Wolcott-Rallison_Syndrome`
    produced research/Wolcott-Rallison_Syndrome-deep-research-claude_code.md (33
    citations). The report's reference/term validation steps did not complete in
    this environment (outbound SSL to crossref/PMC-id-converter was blocked by the
    proxy), so every PMID and CURIE was treated as a lead and independently
    verified: PMIDs were resolved and fetched into references_cache/, ontology
    labels were checked with OAK (ols: adapters). Several report term suggestions
    were wrong and were corrected before binding — HP:0008205 (report labeled it
    "neonatal insulin-dependent DM"; it is actually "Insulin-dependent but
    ketosis-resistant diabetes") was replaced with HP:0000857; HP:0003400 (report
    labeled it "multiple epiphyseal dysplasia"; it is "Basal lamina onion bulb
    formation") was replaced with HP:0002656 Epiphyseal dysplasia. A false PubMed
    hit (PMID:16972080, a different microcephaly/diabetes syndrome) was discarded.

    No GeneReviews article exists for WRS (PubMed searched).

    Pathograph: 8 pathophysiology nodes forming a causal chain from biallelic
    EIF2AK3 loss -> failed eIF2-alpha phosphorylation / PERK-branch UPR ->
    unresolved ER stress, branching to ER-stress beta-cell failure -> insulin
    deficiency -> permanent neonatal diabetes; stress-triggered hepatocyte injury
    -> recurrent acute hepatic failure and impaired hepatic gluconeogenesis ->
    hypoglycemia; and impaired skeletal ossification -> multiple epiphyseal
    dysplasia and atlantoaxial instability. 10 phenotypes with HP terms and
    cohort-derived frequencies, genetic section (EIF2AK3 LOF with a genetic_context
    LOSS_OF_FUNCTION / HOMOZYGOUS block), AR inheritance, prevalence (ultra-rare;
    most common cause of PNDM in consanguineous populations), progression,
    treatments (insulin, liver/multi-organ transplantation, supportive care,
    genetic counseling), and two discussions (a HUMAN_MODEL_MISMATCH on the
    mouse-derived beta-cell developmental mechanism, and a KNOWLEDGE_GAP on
    possible genetic heterogeneity).

    Evidence: 10 PMIDs (mouse Perk-knockout mechanism papers graded MODEL_ORGANISM;
    human cohorts/reviews HUMAN_CLINICAL), 40/40 snippets verified against cached
    references. Validated with `just validate`, `just count-verified-snippets`,
    `just check-duplicate-keys`, `just check-entity-refs`,
    `just check-causal-targets`, `just check-qualifier-terms`, and the authoritative
    `just validate-disorders` (all passed). Deleted stubs/Wolcott-Rallison_Syndrome.yaml.
    Closes #10931.

  summary: 'Create: Genetic LCAT Deficiency (FLD and FED subtypes)'
  details: |
    New entry for genetic LCAT deficiency (MONDO:0018999), curated from the queue stubs Norum_Disease (MONDO:0009515) and Fish_Eye_Disease (MONDO:0007620), which are deleted. Lump/split: one entry with two subtypes, FLD (Norum disease) and FED (fish-eye disease), because both are allelic syndromes of the same enzyme deficiency, separated in the literature by whether esterification is lost on apoB-containing lipoproteins as well as HDL, and intermediate genotypes exist (PMID:16216249). Shared mechanism nodes (LCAT loss, failed HDL maturation, corneal deposition) are curated once; lipoprotein X accumulation and the nephropathy are scoped to FLD with pathophysiology subtypes, and anaemia is stratified by subtype with the systematic-review frequencies (91.6% FLD, 24.2% FED). Named Genetic LCAT Deficiency because the MONDO label also covers acquired autoantibody-mediated LCAT deficiency (PMID:42178263); prior names are in synonyms. Atherosclerosis risk is recorded as the literature stands: SUPPORT items for more atherosclerotic disease in FED (PMID:34256778, 35065092, 29748187, 21875686) and REFUTE items from Italian carrier families with thinner carotid walls (PMID:19687369) and the knockout mouse (PMID:11278414), with a KNOWLEDGE_GAP discussion. Investigational therapies (rhLCAT, CER-001, LCAT-expressing adipocytes) are single-patient reports. No GeneReviews chapter exists; the StatPearls chapter (PMID:38753926) is tagged for orientation; ClinGen has not curated LCAT. Validated with linkml-validate, the term validator, the reference validator (87 snippets, 89 titles), count-verified-snippets and the per-file GAPFILL checks.

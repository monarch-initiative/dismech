  summary: 'Create: STIM1_Deficiency'
  details: |
    Created the STIM1 deficiency entry (MONDO:0013008), the CRAC channelopathy sibling of the existing ORAI1_Deficiency entry, from primary literature checked against the fetched reference cache. The pathograph runs from biallelic STIM1 loss through failed ER store sensing and abolished store-operated calcium entry to five arms: the calcineurin-NFAT transcriptional failure and its T cell, regulatory T cell and humoral consequences, NK cytotoxic failure, skeletal muscle calcium handling, ameloblast enamel mineralization, and sweat gland secretion. All 15 phenotypes are causally connected.

    An OpenScientist deep-research run is committed alongside. preflight-dr returns WARN, on the ORAI1 mention count (STIM1 98, ORAI1 32) rather than on anything wrong, since ORAI1 is this disease's own partner protein. The report supplied the diagnostic workup and the antisense oligonucleotide note; every quote used was re-verified against the cache rather than taken from the report. The report offered HP:0000535 for the ocular phenotype, which is obsolete and is in any case Sparse and thin eyebrow, and an invented HP:0009925; neither was used.

    Also corrects a wrong identifier in the sibling entry: ORAI1_Deficiency's notes cited MONDO:0013006 as STIM1 deficiency, which is isolated growth hormone deficiency type IB. Corrected to MONDO:0013008, verified via OLS, and the note now names the STIM1 entry file.

    A pre-PR adversarial review found and this round fixed: three evidence explanations that stated false validator behaviour as the reason for truncating a quote (normalize_text spells out Greek letters and folds apostrophes, so the full sentences match and are now quoted in full), a notes sentence pointing at a node that did not exist, misreported preflight-dr counts, a description that merged two different kindreds at the mild end of the phenotype, a missing humoral arm, an unconnected mydriasis phenotype and a missing muscle weakness phenotype. One review finding was not taken: the bracketed variant nomenclature in the PMID:33733462 quote genuinely does not survive the reference validator, which strips bracketed spans before matching, so that quote stays short and its explanation now names the real reason.

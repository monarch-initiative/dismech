  summary: 'Create: Immunodeficiency_127 (TNF deficiency)'
  details: |
    De novo curation of IMD127 (MONDO:0975832), autosomal recessive inherited TNF deficiency causing selective susceptibility to pulmonary tuberculosis.

    Deep research: openscientist (research/Immunodeficiency_127-deep-research-openscientist.md). Falcon, the default provider, was unavailable (no EDISON_API_KEY/FUTUREHOUSE_API_KEY); the user selected openscientist explicitly rather than a silent substitution. The report's frontmatter reports 5/5 references resolved, confabulation_rate 0.0, needs_review true (3 of 5 relevance-assessed on topic; one obsolete GO term and three mislabelled terms flagged). Nothing was bound from the report's term suggestions: HP:0032251 was named 'Tuberculosis' by the report but is 'Abnormal immune system morphology', which is exactly the kind of mis-binding that section exists to catch.

    The report was treated as leads only. Every detail it contributed beyond the abstract - the c.190_191ins20 (p.P64Lfs*13) allele, the large consanguineous Colombian kindred, the two first cousins, ages at onset 19 and 18 with relapse, and TNFR1 as the receptor - was re-verified against the cached full text of PMID:39198650 before being written, and each is cited to that primary source rather than to the report.

    Pathograph: a four-node chain from biallelic TNF loss of function through absent macrophage TNF production and impaired respiratory burst to failure of macrophage control of M. tuberculosis, each edge separately cited. The TNF add-back rescue in iPSC-derived macrophages is carried as an experimental_models ModelMechanismLink with a RESTORED readout, since it is what establishes the edge as causal rather than correlative.

    Two negative findings that define how narrow this disorder is - preserved inflammatory response and normal blood leukocyte subset development - could not be modelled as phenotypes: ModifierEnum has no NORMAL value and Phenotype has no absence slot. They are recorded in the disease description and in the evidence on the relevant nodes instead.

    ECTO:3000134 'exposure to Mycobacterium tuberculosis' resolves in EBI OLS but is absent from the pinned sqlite:obo:ecto build that just validate-terms consults, so the environmental exposure_term was left unbound with a review_notes line recording the search. ECTO:3000133 (subsp. tuberculosis) is narrower than the claim and was not substituted.

    Validation: just validate passes (schema, terms, references); 20/20 snippets verified against cached references. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-environmental-evidence, check-snippet-length, check-title-snippets, check-folded-hyphens and check-snippet-grading all pass. Compliance 86.9% global / 89.5% weighted.

    No datasets: block. Searching GEO on TNF would return the general TNF literature rather than anything about this disorder, which is the Named Entity Confusion trap the dataset curation guidance warns about.

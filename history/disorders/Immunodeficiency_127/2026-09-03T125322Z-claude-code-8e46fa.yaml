  summary: 'Address PR #10491 review: listeriosis, uncited claims, structured variant'
  details: |
    Response to the automated review on PR #10491. All five blocking points accepted; none was a disagreement.

    1. Listeriosis. The entry framed tuberculosis as the only clinical event and asserted these individuals are 'not broadly infection-prone'. One of the two patients had culture-positive Listeria monocytogenes septic shock with chorioamnionitis at 28 weeks of pregnancy, and the authors devote a discussion paragraph to arguing TNF deficiency contributed. Added a Severe Listeria infection phenotype (HP:5210020), a Failure of Macrophage Control of Listeria monocytogenes pathophysiology node downstream of the burst node, and softened both the disease description and the ORGANISM node. The edge from the macrophage defect to the clinical phenotype is INDIRECT_KNOWN_INTERMEDIATES because the authors explicitly qualify pregnancy as a co-contributor, and that qualification is quoted as its own evidence item. The reviewer's framing that impaired control of intramacrophagic bacteria is the more general statement of the defect is adopted in the description.

    2. Anti-TNF tuberculosis risk was asserted in prose with no citation, and it is the entry's headline translational claim. Now carries the in-vitro blockade sentence from the primary paper plus PMID:29459143 for the clinical counterpart, the latter graded INDIRECT since it is a consensus safety review of therapeutic blockade rather than a study of inherited deficiency.

    3. Macrophage restriction was likewise uncited, and it is what the macrophage_restricted_burst_defect discussion rests on. Now carries both quotable sentences: normal ROS in neutrophils and monocytes, and the contrast with pan-phagocyte burst deficiency.

    4. Three references were fetched into the cache and never cited. All three now carry a claim: PMID:10878503 supports attributing the signal to TNFR1 rather than TNFR2, PMID:29459143 covers the anti-TNF risk, and PMID:32055999 anchors a new differential_diagnoses entry for IFN-gamma circuit MSMD.

    5. The causal allele lived only in free-text notes, so zygosity - the basis of the recessive claim - was not machine-queryable anywhere. Added Genetic.variants with the c.190_191ins20 (p.Pro64LeufsTer13) allele, its type, PATHOGENIC clinical_significance, a FunctionalEffect, and its own evidence; and genetic_context on the molecular node carrying zygosity HOMOZYGOUS, variant_origin GERMLINE, functional_impact_category LOSS_OF_FUNCTION.

    Non-blocking suggestions taken: pyrazinamide and ethambutol added to therapeutic_agent so the HRZE regimen is complete; a second model readout added for M. tuberculosis replication in alveolar macrophage-like cells, which is closer to the disease-defining endpoint than the burst; and a diagnosis section for the absent-TNF-production signature. A differential_diagnoses block for chronic granulomatous disease was added since the entry defines itself against that contrast.

    Non-blocking suggestion not taken: NCIT:C15615 was proposed as a more specific treatment term than NCIT:C15986 Pharmacotherapy. That CURIE resolves to 'gp100 Antigen/Incomplete Freund's Adjuvant', which is not a clinical action and is not reachable from NCIT:C25218. Kept NCIT:C15986.

    On the negative-phenotype question the reviewer answered: HPO's HP:0040285 'Excluded' is absent from FrequencyEnum, so the clean fix is a schema change rather than anything to do in this entry. Left as prose here.

    Validation after changes: just validate passes; 36/36 snippets verified, up from 20/20. All offline gates green. Compliance 91.3% global / 93.2% weighted, up from 86.9% / 89.5%.

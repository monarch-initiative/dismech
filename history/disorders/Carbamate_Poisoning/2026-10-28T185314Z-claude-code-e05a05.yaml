  summary: 'Create: Carbamate Poisoning'
  details: |
    New conformer of the acetylcholinesterase_inhibition module. Deep research via claude_code. No MONDO disease_term exists (documented in notes; broadMatch to MONDO:0029000). Mechanism chain conforms to the module; the carbamate-specific divergence (reversible carbamylation, no aging, no intermediate syndrome) is on the carbamylation node and progression. Evidence from PMID:25455666, 26563788 (shared reviews), 27252029 (Sri Lanka cohort), 15566582 (Eddleston protocol). Validated: validate, validate-terms, count-verified-snippets 21/21, validate-disorders.

    Review response (#15856). Added a biochemical cholinesterase-activity marker
    (red-cell AChE / plasma BChE) citing PMID:15566582, with the carbamate
    false-normal caveat. Added phenotypes Hypotension (HP:0002615), Bronchorrhea
    (unbound, noted), Muscle weakness (HP:0001324) and Coma (HP:0001259), each
    wired from its receptor arm, so the nicotinic and central arms now reach a
    phenotype. Cited PMID:27252029's NMJ-failure sentence on the nicotinic node
    for its previously unevidenced persistence claim. Regraded all nine
    PMID:15566582 items to OTHER + REVIEW_SYNTHESIS (treatment protocol, not a
    patient study). Noted therapeutic carbamate inhibitors are out of scope.

    Review round 2 (#15856). Fixed two precision defects in the round-1
    additions: the PMID:27252029 NMJ snippet is the authors' reading of a cited
    cohort (ref 25), so its quote_role moved from PRIMARY_RESULT to
    REVIEW_SYNTHESIS on both the nicotinic node and the Muscle weakness
    phenotype, and that phenotype gained directness: INDIRECT (the quote says
    NMJ failure, not weakness). Rebound the consciousness phenotype from
    HP:0001259 Coma to HP:0004372 Reduced consciousness, which the GCS snippet
    actually supports, renaming the node and its downstream target to match.

    CI fix. The check-environmental-evidence gate failed on both environmental
    entries: they carried evidence only inside influences_mechanisms, not at the
    entry level the gate requires. Added an entry-level evidence block (PMID:27252029)
    to each. This gate was missed in the pre-PR local sweep.

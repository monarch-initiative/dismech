  summary: 'Create: Spinocerebellar Ataxia, Autosomal Recessive 27'
  details: |
    New entry for SCAR27 (GDAP2, MONDO:0032706), claimed in issue 16794. Deep research was run with OpenScientist because the Edison (falcon) provider returned HTTP 403 for this session's API key; the report is committed under research/. The report was used as a lead only: its suggested UBERON identifiers for the pyramidal tract and inferior olive were wrong and were replaced after lookup, and its HP suggestions were checked against the term caches and OLS. Evidence comes from the defining Eidhof 2018 series (full text, including the autopsy), a 2025 Spanish family, a 2025 dysarthria-predominant family and the ClinGen Strong (AR) assertion, whose tier is copied into gene_disease_validity. The two 2020 Brain letters have no abstract in the cache and are not cited. The stress-susceptibility mechanism rests only on Drosophila knockdown data and is marked as indirect, with a knowledge gap and a human-model-mismatch discussion. Validated with just validate, validate-terms, count-verified-snippets (48/48) and the offline whole-repo gates.

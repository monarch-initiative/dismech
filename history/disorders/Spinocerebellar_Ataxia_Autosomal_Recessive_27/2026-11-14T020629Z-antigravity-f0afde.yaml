  summary: 'Review and enhance: Spinocerebellar Ataxia, Autosomal Recessive 27'
  details: >-
    Added evidence to Harrison's NEUROLOGIC (marked BACKGROUND) and GENETICS_ENVIRONMENT_DISEASE classifications, added ULTRA_RARE CASES_IN_LITERATURE prevalence block, added CL:0000540 (neuron) to Extracerebellar Neurodegeneration while keeping GDAP2 Loss of Function without molecular_functions/biological_processes/locations and degeneration nodes without apoptotic process annotations where biochemical activity and cell-death mode are untested, connected Loss of Independent Ambulation via sequelae from Progressive Cerebellar Ataxia (16/16 phenotypes connected), enriched diagnosis with NCIT bindings and Brain MRI cerebellar/cerebral atrophy evidence (PMID:30084953, PMID:40469082, PMID:42633453), and added supportive treatments (Physical Therapy, Speech-Language Therapy, Genetic Counseling) backed by PMID:42633453.

  summary: 'Create: HDAC3-Related Neurodevelopmental Disorder'
  details: |
    Created kb/disorders/HDAC3-Related_Neurodevelopmental_Disorder.yaml (MONDO:0700370, HDAC3 hgnc:4854) for claim issue #15408. Curated chiefly from the delineating cohort paper PMID:39047730 (AJHG 2024, full-text XML cached) with a narrative review PMID:40609820. Pathophysiology modelled as three partially-independent molecular lesions (catalytic deficiency; CoREST/NCoR corepressor-complex disruption, universal KDM1A loss; nuclear mislocalization) converging on transcriptional derepression -> impaired corticogenesis/neuronal migration -> abnormal neurodevelopment, with 12 phenotypes carrying HPO-mapped frequencies from the paper's Table 2. Deep research: falcon requested but unavailable (no key); re-run via claude_code provider. IMPORTANT: the research-anchor tooling and the stub both carried gene=TRA2B because MONDO:0700370 is mis-annotated upstream with TRA2B (not HDAC3) as its RO:0004003 causal gene; the first DR run was killed and re-run with the gene anchor overridden to HDAC3. Validated with just validate-disorders (schema + terms + 26/26 snippets + 2 titles, all pass), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values. Red-teamed in a fresh subagent; added genitourinary and failure-to-thrive phenotypes and fixed a facial-dysmorphism wording issue per that review. No GeneReviews/StatPearls chapter exists (verified offline + online).

  summary: 'Review round 1: diagnosis, transmission risk, p53 arm'
  details: |
    Addressed the first review of PR 14078. Added a diagnosis section with two items: histopathologic confirmation of adnexal tumors (NCIT:C18190) and CYLD molecular genetic testing (NCIT:C15709), both citing the GeneReviews DIAGNOSIS/TESTING sentence (PMID:32298062); the testing item also cites PMID:31085270 (tumor-restricted variants undetectable in blood, and the recommendation to test skin tumors when there is no family history) and PMID:34744449 (testing two or more tumors in mosaic presentations). Added the GeneReviews 50% offspring-risk and 'most inherit from a parent' sentences to the autosomal dominant inheritance block. Added an 'Impaired DNA Damage-Induced p53 Stabilization' node (GO:0030330, DECREASED) downstream of biallelic CYLD loss from DOI:10.1038/ncomms12508, graded IN_VITRO for the deubiquitination result and MODEL_ORGANISM for the C. elegans and mouse carcinogenesis results, with an edge to clonal expansion described as a hypothesis because no human CYLD tumor data were cited. The Avoidance of Radiotherapy treatment was not linked to the p53 node: GeneReviews gives DNA damage as the reason and does not invoke p53, so the link would be inference. Added the GeneReviews pulmonary cylindroma sentence to that phenotype. Re-ran OLS HPO searches (cylindrocarcinoma, spiradenocarcinoma, malignant cylindroma, malignant spiradenoma, adnexal carcinoma, sweat gland carcinoma, skin appendage carcinoma, skin carcinoma) for the malignant transformation phenotype; none named these tumors, but HP:0012842 Skin appendage neoplasm, defined as benign or malignant and a child of HP:0008069, is narrower than the previous HP:0008069 binding, so the phenotype was rebound to it with a notes field recording the searches, plus a PMID:32975300 background sentence stating the malignancies arise from adnexal tumors. Validated with just validate, count-verified-snippets (86/86), validate-terms, the entity-ref, causal-target, duplicate-key, qualifier, GeneReviews and block-scalar checks, the whole-KB gates, and validate-disorders.

  summary: 'Create: CYLD_Cutaneous_Syndrome'
  details: |
    New entry for MONDO:0011512 (MONDO/ClinGen label Brooke-Spiegler syndrome), named CYLD Cutaneous Syndrome after the GeneReviews chapter (PMID:32298062), which is the phenotype baseline. Deep research: falcon was requested twice (with --fallback) and both runs failed with '503 Failed to authenticate' before any provider task was created, so exactly one claude_code report was run instead (research/CYLD_Cutaneous_Syndrome-deep-research-claude_code.md). That report was thin (4 web searches, GeneReviews fetch blocked) and was used only as a lead. Rejected from it: HP:0100677 offered as Cylindroma (it is Vulval varicose vein), HP:0100782 offered as Trichoepithelioma (does not exist), and PMID 10873394 offered as the Bignell 2000 CYLD discovery paper (it is an ataxia-telangiectasia paper; the correct PMID is 10835629). just preflight-dr exited 2 because the local mondo.db is not present; it was not run. Curated: autosomal dominant inheritance plus a somatic mosaic arm (HP:0001442, PMID:31085270); subtypes FC (MONDO:0007565) and MFT1 (MONDO:0042977); MONDO:0012800 (MFT2, 9p21 locus, PMID:8752837) and MONDO:0011114 (parent of MFT1 and MFT2) deliberately not bound; pathograph conforming to germline_two_hit_tumor_predisposition (first hit, second hit with 16q LOH, biallelic loss, clonal expansion) with NF-kappaB, Wnt, TRK and MYB branches; ClinGen Definitive copied from the cached CGGV record; Orphanet prevalence; GeneReviews management and surveillance; TRAC pegcantratinib trial (negative) and salicylic acid pilot recorded as investigational. Gaps: spiradenoma has no HPO term (left unbound); no penetrance estimate; route from CYLD loss to TRK and MYB overexpression and the tumor cell of origin are recorded as a KNOWLEDGE_GAP. Validation: just validate, validate-terms, count-verified-snippets (74/74), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-genereviews, list-gene-term-mismatches, check-block-scalar-comments, the ungated snippet/title/grading/retired-prose/environmental/coarse/reference-title/enum gates, gene-activity grounding and folded-hyphen scripts, and just validate-disorders all passed.

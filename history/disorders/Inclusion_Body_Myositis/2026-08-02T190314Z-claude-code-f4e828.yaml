  summary: Explore and curate the amyloid-beta hypothesis of sporadic IBM
  details: |
    Explored the historical Askanas-Engel hypothesis that beta-amyloid and APP are abnormally and specifically present in sporadic inclusion body myositis, which the entry previously did not model at all. Separated the two embedded claims. Specificity is refuted: amyloid-positive ubiquitinated filamentous rimmed vacuoles occur in postpoliomyelitis chronic denervation (PMID:9781653), congenital childhood myopathy (PMID:16788822) and OPMD/familial IBM-like disorder (PMID:8268725), and head-to-head quantification found focal R1282 beta-amyloid immunoreactivity in 0.00 percent of IBM myofibres against 23 percent for sarcoplasmic TDP-43 (PMID:19533646). Abnormal presence is unresolved rather than refuted: the Abeta oligomer/ADDL immunoblots (PMID:20711838) are unrebutted but essentially single-laboratory, while laser-capture proteomics of rimmed vacuoles (PMID:28009083) does not report Abeta or APP among 213 enriched proteins, cultured IBM myotubes do not accumulate betaAPP (PMID:10599804), and the companion phospho-tau claim rests on antibodies that bind normal myonuclei and non-tau proteins (PMID:19626672). Citation-network analysis of this precise belief (PMID:19622839) documents authority built by citation bias, amplification and invention, which is why the hypothesis is curated DEPRECATED rather than ALTERNATIVE. Added: mechanistic_hypotheses entry amyloid_beta_proteotoxicity (DEPRECATED, 11 evidence items across SUPPORT/REFUTE/PARTIAL); pathophysiology node 'Amyloid-beta and APP Accumulation in Myofibres' (mechanism_confidence HYPOTHETICAL, hgnc:620, GO:0042982, GO:0034205) with two downstream edges opting into the hypothesis group, one carrying the reverse-ordering counterargument (PMID:25579751); discussion ibm_amyloid_beta_specificity (CONTROVERSY, OPEN) with three resolving experiments, all antibody-independent or independent-replication designs. Deliberately did not add a conforms_to edge to the amyloidogenesis module, since that would assert as fact the claim the exploration finds unsupported. Validation: linkml-validate clean; reference validator 131/131 snippets verified; term validator passed. All 13 new references fetched via the reference validator cache command; no cache file hand-written.

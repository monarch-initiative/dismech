  summary: 'Pre-PR red-team review fixes: Inclusion Body Myositis'
  details: |
    Self-review pass before opening the PR, run by a fresh-context subagent against the cached sources. Findings verified independently before acting on them; two were confirmed as genuine errors in the initial curation. CRITICAL 1 - prevalence_class was BAND_1_9_PER_1000000 while rate_per_100000 was 2.48; 24.8 per 1,000,000 normalises to 2.48 per 100,000, so the band was wrong by a factor of ten (pattern-matched on the source's 'per 1,000,000' phrasing rather than the normalised rate). Corrected to BAND_1_9_PER_100000. Schema validation cannot catch this because the band and the rate are independent slots. CRITICAL 2 - the entry framed the registrational anti-KLRG1 ulviprubart MUSCLE trial (NCT05721573) as a pending readout and built the central CONTROVERSY discussion around it as 'the most informative pending test'. The claude_code deep-research report records that topline results were announced 24 Feb 2026 and the trial missed its primary and key secondary endpoints in the overall population. Independently checked: no PubMed publication exists for ulviprubart, and the ClinicalTrials.gov record reports hasResults=false as of its 2026-01-29 update, so the only sources are sponsor press releases. Because no snippet-validatable reference exists, the negative result is recorded in a treatment-level notes field (per the repository rule that unquotable claims go in notes) rather than as a fabricated evidence item, with an explicit caveat that it is not peer-reviewed and that the mild-to-moderate subgroup trend must not be read as efficacy. Rewrote the treatment description, rewrote the discussion rationale to state that the decisive test has reported negative, and replaced the now-satisfied proposed_experiment with one targeting the open question (peer-reviewed publication reporting target engagement, to distinguish mechanistic failure from inadequate muscle-compartment depletion). Retained autoimmune_primary as CANONICAL with an explicit in-text justification and a flag to revisit on publication. IMPORTANT - Myofibre MHC Class I Overexpression was a graph root despite its own description and evidence stating it is IFN-gamma driven and T-cell-dependent; added the missing feed-forward edge from Cytotoxic T Cell Invasion, evidenced by the anti-CD3 depletion sentence in PMID:35044790. The graph now has three genuine roots. Replaced three phenotype terms with exact-match HP terms that exist and are more specific: HP:0002460 to HP:0031177 Finger flexor weakness, HP:0008994 to HP:0003731 Quadriceps muscle weakness, HP:0002015 to HP:0200136 Oral-pharyngeal dysphagia - these are the two diagnostic phenotypes of the disease, so specificity matters most here. Removed the unsupported OCCASIONAL frequency on Foot Drop (the cited snippet places foot extensors in the characteristic distribution and supports no band) with a note explaining the omission. Added an imaging_findings block for selective quadriceps fatty replacement on muscle MRI (PMID:40018748, PMID:38522330), an IVIG treatment curated as PARTIAL from the Cochrane review's explicit refusal to draw conclusions, and an Interventional Dysphagia Procedures treatment (PMID:41161903, PMID:33879596). MINOR - replaced two evidence snippets that did not bear on their claims (an 'enigmatic disease' quote on the HLA edge, a 'complexity of underlying disease mechanisms' quote on the aggregate node); softened the autophagy node description which asserted impaired flux that no cited evidence measured; fixed a self-contradiction describing FAP-mediated paracrine damage as cell-autonomous; dropped an unevidenced macrophage cell type; moved Falls to HP:0002359 Frequent falls; dropped a severity qualifier that contradicted its own description. Added the HLA protective alleles and the five-years-earlier age-of-onset modifier from PMID:38043487. Did NOT add a STAT3 gain-of-function node the reviewer suggested: the cited T-LGL paper does not mention STAT3 and no verifiable IBM-specific source was available, so it was left out rather than asserted. Re-validated: schema, terms and references all pass; all foreign keys resolve; compliance 92.7 percent.

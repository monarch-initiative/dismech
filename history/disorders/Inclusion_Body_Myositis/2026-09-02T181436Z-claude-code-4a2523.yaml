  summary: 'Integrate assessed OpenScientist findings: amyloid_beta_proteotoxicity'
  details: |
    Integrated the RETAINED/QUALIFIED claims of the existing assessment sidecar for the amyloid_beta_proteotoxicity OpenScientist report (kb/hypotheses/Inclusion_Body_Myositis/amyloid_beta_proteotoxicity/assessments/openscientist-assessment-by-claude-opus-5.yaml; verdict SUPPORTED, meaning the report agrees the hypothesis is refuted as stated and correctly DEPRECATED). Three changes. (1) New downstream edge on the 'Amyloid-beta and APP Accumulation in Myofibres' pathophysiology node to 'Mitochondrial Dysfunction and Somatic mtDNA Deletion', tagged hypothesis_groups amyloid_beta_proteotoxicity, carrying the MCK-betaAPP transgenic mouse result (PMID:22518836) as MODEL_ORGANISM SUPPORT with directness INDIRECT. This is the assessment's QUALIFIED claim mck-bapp-mouse-qualified-support; the edge description and the evidence explanation both state that the support is a forced APP-overexpression construct and does not establish the step in human IBM. (2) New evidence item on the amyloid_beta_proteotoxicity mechanistic_hypotheses entry citing the 2025 systematic review of IBM randomised trials (PMID:39843353), graded NO_EVIDENCE because no amyloid-directed agent appears anywhere in the trial record, with an accompanying description paragraph recording the therapeutic and genetic axes the entry previously asserted without citation (no BACE/gamma-secretase inhibitor or anti-amyloid antibody trialled; arimoclomol and sirolimus, the nearest proteostasis proxies, had no effect; no APP/PSEN1/PSEN2/BACE1/APOE susceptibility locus, against HLA/PTPN22 and VCP/SQSTM1/FYCO1). This is the RETAINED claim therapeutic-and-genetic-absence. (3) Qualification to the ibm_amyloid_beta_specificity discussion rationale recording that the single-laboratory character of the Abeta-oligomer data is now a checked absence (a targeted 2026 search for non-originating-laboratory replication returned no papers) rather than an inference from authorship, with the standard scope limit on a negative search. Deliberately not integrated: the report's il1b-promotes-app-production claim, which the assessment REJECTED as mis-sourced (PMID:23998706 is a 4-patient negative anakinra pilot and the IL-1beta/APP statement is background framing, not a result); the report's proposed status change (it recommends retaining DEPRECATED, which the entry already does); and the six other RETAINED/QUALIFIED claims, whose citations (PMID:39757935, 23496965, 21518451, 23294492, 28009083, 20711838, 19533646, 9781653, 16788822, 37739573, 29611059) were already curated in this file, including the LCM-MS peptide-library re-interrogation experiment the proteomics-not-reported-versus-absent claim asks for. Verified with check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens and count-verified-snippets (137/137).

  details: |
    Ran the OpenScientist hypothesis-search job for amyloid_beta_proteotoxicity via scripts/hypothesis_deep_research.py (862s, report + citations committed under kb/hypotheses/; the openscientist_artifacts/ directory is gitignored by repo policy and is not committed). Provider verdict: REFUTED as stated, correctly curated DEPRECATED, status recommendation retain - concordant with the curated assessment, but discounted as confirmation because the prompt template passes the full seed YAML including status DEPRECATED and the entire curated reasoning, so the provider was anchored on the conclusion it reached. Recorded a structured assessment sidecar at assessments/openscientist-assessment-by-claude-opus-5.yaml (overall_verdict SUPPORTED, 10 claim-level dispositions: 7 RETAINED, 2 QUALIFIED, 1 REJECTED); linkml-validate and dismech.hypothesis_assessment link/quote verification both pass. All 7 newly proposed PMIDs were fetched and read before use. One was REJECTED as materially mis-sourced: the report cites PMID:23998706 as in-vitro evidence that IL-1beta promotes APP/amyloid production, but that paper is a 4-patient negative anakinra pilot trial and the IL-1beta-to-APP statement appears only in its introductory framing, not its results - the same citation-amplification pattern PMID:19622839 documented for this literature, so it was recorded rather than silently dropped. PMID:23294492 was QUALIFIED: real causal-inversion evidence but in a rhabdomyosarcoma cell line, not the primary human muscle cells the report described. Promoted four verified leads into the entry: PMID:39757935 (REFUTE - cryptic HDGFL2 peptide in 79/122 IBM biopsies and absent across 197 disease controls, the positive counter-example to the specificity claim that the entry previously argued only from negatives), PMID:23496965 (REFUTE - APP non-significantly raised in GNE myopathy and correlated with generic cell-stress markers), PMID:21518451 (PARTIAL - human APP in Drosophila muscle causes weakness with no aggregates, dissociating toxicity from deposition) on the hypothesis, and PMID:23294492 (REFUTE, IN_VITRO, cell-line caveat carried in the explanation) on the amyloid-to-autophagy edge, upgrading the reverse-ordering counterargument from review-level opinion to experimental evidence. Added proposed experiment ibm_lcm_ms_peptide_library_reinterrogation to the ibm_amyloid_beta_specificity discussion - re-querying the existing LCM-MS peptide libraries for APP/amyloid-beta peptides is cheaper than the new prospective mass-spectrometry study already proposed and should precede it; it also addresses the report's fair point that PMID:28009083 not reporting these peptides is weaker than their absence. Hypothesis status unchanged (DEPRECATED). Validation: linkml-validate clean; reference validator 135/135 snippets verified; term validator passed.

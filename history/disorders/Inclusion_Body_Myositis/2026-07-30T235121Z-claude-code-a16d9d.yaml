  summary: 'Create: Inclusion Body Myositis'
  details: |
    De-novo curation of sporadic inclusion body myositis (MONDO:0007827). Deep research run with two providers: falcon (Edison Scientific, 758s, 36 citations) and claude_code. Both reports passed the NEC preflight against the MONDO record - sporadic IBM has no causal gene, and the hereditary IBM mimics GNE and VCP are explicitly excluded via differential diagnoses plus an entity-boundary note. No GeneReviews article exists for sporadic IBM (PubMed returned 0 hits), as expected for an acquired sporadic disease. Built a 10-node pathograph with causal edges spanning the two competing disease models, encoded as mechanistic_hypotheses (autoimmune_primary CANONICAL vs degeneration_primary ALTERNATIVE) with hypothesis_groups on the relevant edges. Curated 10 phenotypes, 4 histopathology findings, 2 biochemical markers (anti-cN1A, TDP-43 cryptic exon), 3 genetic entries (HLA-DRB1 SUSCEPTIBILITY, NT5C1A BIOMARKER, VCP/SQSTM1 DISPUTED), 2 structured prevalence records, 7 treatments including four deliberately negative results (corticosteroids REFUTE, arimoclomol REFUTE, bimagrumab REFUTE, sirolimus PARTIAL), 1 clinical trial, 4 differential diagnoses, and 3 discussions (CONTROVERSY on autoimmune-vs-degenerative primacy, KNOWLEDGE_GAP on unexplained muscle selectivity, HUMAN_MODEL_MISMATCH on the absence of a faithful animal model). Declared conforms_to on cellular_senescence for the fibro-adipogenic-progenitor senescence node. All evidence snippets independently verified as exact substrings of cached abstracts; every claude_code candidate quote flagged verify-verbatim was checked against the fetched abstract and all three confirmed. Term verification caught two errors before they landed: MONDO:0007833 was wrong for polymyositis (corrected to MONDO:0019127) and two HP terms are absent from the NCIT-rooted HistopathologyFindingTerm enum (moved to phenotype entries with the ontology gap documented in notes). Validated with just validate - schema, terms and references all pass. Compliance improved from 50.0 to 92.1 percent after backfilling 90 reference_title values with scripts/add_pmid_titles.py.

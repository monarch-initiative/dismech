  summary: 'Create: Stuve-Wiedemann Syndrome 2 (IL6ST), ISDS group 20 NOS 20-0030'
  details: |
    Curated as part of a completeness pass over ISDS 2023 nosology group 20 (Bent bones dysplasia group). The 2023 table lists six rows; three were already curated, this is one of the three that were not.

    Lump/split: curated as a separate entry from Stuve_Wiedemann_Syndrome_1 (LIFR), not folded into it. OMIM (601559 vs 619751), MONDO (0800043 vs 0030756) and the ISDS 2023 table (NOS 20-0020 vs NOS 20-0030) all split them, and the mechanistic difference is real: LIFR loss is ligand-chain-selective while IL6ST loss removes the shared transducer of the whole IL-6 family. The split is not made on severity. The IL6ST hyper-IgE and IL-11-selective craniosynostosis phenotypes are recorded as differentials, not subtypes.

    Sources: PMID:31914175 (Chen et al. 2020, delineating series, abstract only in cache), PMID:40835206 (2025 fetal case, sixth individual), PMID:38133879 (GP130 variant taxonomy, full text), PMID:33771552 (cytokine-selective IL6ST defects). Perinatal death curated under progression rather than phenotypes because the HPO death terms sit outside the PhenotypeTerm enum's HP:0000118 root, following existing repo convention.

    Validation: just validate passes; 43/43 snippets verified against cached references. stubs/Stuve-Wiedemann_Syndrome_2.yaml deleted. Stuve_Wiedemann_Syndrome_1.yaml updated: lump/split note now points at the entry rather than the stub, its ISDS note carries the NOS number and the exact 2023 row wording, and its STWS2 differential is bound to MONDO:0030756.

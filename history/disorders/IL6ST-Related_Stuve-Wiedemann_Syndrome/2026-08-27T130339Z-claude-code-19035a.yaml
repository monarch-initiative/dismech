  summary: Add GP130 lentiviral rescue as an experimental model; record GeneReviews
    negative search
  details: |
    Acting on review suggestions 1 and 3 from ai4c-reviewer on PR #9617.

    The lentiviral GP130 reconstitution in patient-derived cells was previously only an IN_VITRO evidence snippet on the Pan-IL-6-Family GP130 Signaling Failure node. It is now an experimental_models entry linked to that node with relationship RESCUES and fidelity HIGH, carrying a readout with direction RESTORED. This makes the isogenic-repair arm a queryable edge in the pathograph rather than a sentence, matching the pattern the sibling LAMA5 entry already uses. limitations records that it is a cellular rescue only and points at the existing delivery knowledge gap.

    GeneReviews: searches run and recorded in notes -- 'IL6ST GeneReviews' and 'gp130 deficiency GeneReviews' return nothing; 'Stuve-Wiedemann syndrome 2 GeneReviews' returns only PMID:40521311, the prenatal ultrasound series that searched GeneReviews as a literature source rather than being a chapter, which is the same hit the LIFR sibling entry already rules out. Recorded so the search is not repeated.

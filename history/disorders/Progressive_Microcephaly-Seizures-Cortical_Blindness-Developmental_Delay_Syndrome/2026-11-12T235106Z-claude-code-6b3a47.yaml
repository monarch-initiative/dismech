  details: |
    First review round on PR #17245. Blocking finding 1: six phenotypes present in over 10% of tabulated patients were absent from the entry and only implied in prose. Added rows for cerebral atrophy (HP:0002059), abnormal cerebral white matter morphology (HP:0002500), abnormal corpus callosum morphology (HP:0001273), optic atrophy (HP:0000648), failure to thrive (HP:0001508) and hypotonia (HP:0001252), each quoting the per-patient cohort table in the cached full text of PMID:39578953 or a case description in PMID:26463574. Parent terms were bound for the corpus callosum and atrophy rows because the tabulated findings are not one abnormality: a thin splenium and partial agenesis take different terms and the table records both. The optic row covers disc atrophy only; the thin chiasm and optic nerves reported in the Finnish patients stay on the white-matter row's quote, because imaging-thin nerves and examination disc atrophy are different observations. Blocking finding 2: the ex vivo patient T-cell adhesion and MTOC assay was graded HUMAN_CLINICAL and is IN_VITRO, since the cells were assayed out of the patient; regraded. The reviewer also asked for a deliberate call on a sentence mixing clinical immunophenotyping with in vitro stimulation assays: it was re-quoted to the immunophenotyping clause alone, leaving the activation and proliferation claim to the IN_VITRO items on the same node, rather than grading a mixed sentence under one source. Suggestions taken: GO:0001764 neuron migration was replaced with GO:0061351 neural precursor cell proliferation on the division and output node, since migration is a different claim resting on rodent data; the previously isolated complex IV node was given an incoming edge from the lesion marked INDIRECT_UNKNOWN_INTERMEDIATES, so the pathograph is one component and the unestablished route is stated rather than implied; and cerebral atrophy was wired from the cortical-output node. Suggestions declined with reasons given on the PR: the three-process shared node is kept whole, and bronchiectasis and short stature keep no causal inlink. Re-validated: validate-disorders 73/73 snippets and 73 titles with 0 issues, plus validate-terms, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-enum-values, check-duplicate-keys, check-logical-rules, check-name-collisions, check-qualifier-terms, check-block-scalar-comments, check-gene-activity-grounding and check-gene-namespaces.

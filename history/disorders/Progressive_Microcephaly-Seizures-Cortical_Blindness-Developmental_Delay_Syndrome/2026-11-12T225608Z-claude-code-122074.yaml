  details: |
    De novo curation of MONDO:0014714 from one OpenScientist deep-research report (research/Progressive_Microcephaly-Seizures-Cortical_Blindness-Developmental_Delay_Syndrome-deep-research-openscientist.md; 10/10 references resolved, 18/18 report quotes verified, confabulation_rate 0.0) plus the ClinGen SCID-CID GCEP Definitive assertion for DIAPH1 and the primary cohorts it names. just preflight-dr returned WARN: DIAPH1 mentioned 34 times, report OMIM 616632 matches MONDO's xref, and the flagged second gene SCBMS is the disease abbreviation rather than a gene symbol, which the heuristic lexicon could not tell apart because no local HGNC build is present. Mechanism curated as a single cytoskeletal lesion branching into neural, immune and mitochondrial arms; the neural arm is marked PROVISIONAL because the step from the demonstrated human-neural-precursor spindle defect to the cortical phenotype is an inference. Recorded a HUMAN_MODEL_MISMATCH discussion for the mouse knockout's grossly normal brain size, which ClinGen itself flags, with two proposed experiments. Three CURIEs the report suggested were wrong and were corrected from the caches: CL:0000098 is sensory epithelial cell not neuroepithelial cell (replaced with CL:0011020 neural progenitor cell), HP:0100704 is Cerebral not Cortical visual impairment, and CL:0000617 is GABAergic neuron rather than a cortical interneuron term (replaced with CL:0010011). One MGI identifier written from memory (MGI:1343675) did not exist and was replaced with MGI:1194490 after resolving mouse Diaph1 at the Alliance; twelve reference_title values initially taken from the report's abbreviated evidence table were replaced with the cached titles after check-reference-titles failed them. Validated with just validate-disorders (63/63 snippets, 63 titles, 0 issues), validate-terms, check-entity-refs, check-causal-targets, check-gene-namespaces-online, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-name-collisions and check-block-scalar-comments.

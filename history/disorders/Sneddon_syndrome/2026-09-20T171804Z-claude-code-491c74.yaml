  summary: 'Review round 1: regrade ADA2 and NOTCH3 from CAUSATIVE to UNKNOWN'
  details: |
    First review round on PR 12340. The reviewer raised NOTCH3 as a blocking finding and ADA2 as a suggestion; both are taken. GeneDiseaseRelationshipEnum defines CAUSATIVE as the ClinGen Definitive or Strong tier. NOTCH3 rests on one consanguineous family with no ClinGen curation for this gene-disease pair, which is Limited territory at best; the schema has no Limited or Moderate tier, so UNKNOWN - not yet classified - is the value that fits, and the record no longer contradicts its own notes. ADA2 is the subtler case and the notes now say so explicitly: the biology is not uncertain, since ClinGen curates ADA2 Definitive, but it curates it against deficiency of adenosine deaminase 2 (MONDO:0100317), a different disease term that this knowledge base curates separately. What is unclassified is ADA2 against Sneddon syndrome, which is the pair this entry's controlled field denotes. Consequence for the wiring metric, recorded so the number is not read as a regression: UNKNOWN is excluded from the gene-mechanism denominator, so this entry now measures 0/1 rather than 2/3, the remaining item being the F5 risk-factor record that is deliberately unwired. Both genes remain bound as genes: descriptors on the Monogenic Endothelial and Mural Cell Injury node, so nothing was removed from the pathograph. Note on the reviewer's stated rationale, which was corrected in the PR reply: regrading does NOT stop the edge being exported. gene_to_edge never reads relationship_type and hardcodes biolink:contributes_to, so all three genes still export at MONDO:0008436. That is issue 12320, reported in this PR's body; the regrade is justified by self-consistency and the enum's own definition, not by any export effect.

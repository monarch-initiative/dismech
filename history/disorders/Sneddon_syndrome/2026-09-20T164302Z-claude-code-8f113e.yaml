  summary: 'Genetics pass: first genetic block, with ADA2, NOTCH3 and F5'
  details: |
    Genetics pass for issue 12206. The entry had genetic: [] - an empty block - while MONDO records ADA2 as a causal gene. Research first, checklist after. Curated three genes with new evidence. ADA2 (CAUSATIVE): biallelic loss of function causes deficiency of adenosine deaminase 2, which dismech already curates separately on MONDO:0014306 and which is the entity ClinGen curates Definitive for this gene. It is recorded here because a minority of patients carrying the Sneddon diagnosis prove on testing to have DADA2 - 6 of 32 genotyped patients in the only adult Sneddon-spectrum series that genotyped one (PMID:30645994), where plasma ADA2 activity separated the groups with 100 percent sensitivity and specificity. The notes state explicitly that DADA2 is a diagnosis testing establishes rather than a Sneddon subtype. NOTCH3 (CAUSATIVE): a homozygous p.(Arg735Ter) nonsense variant in two siblings of one consanguineous family with childhood-onset Sneddon syndrome (PMID:32980981); single-family, not ClinGen-curated, and recorded with those limits. The same paper's negative result - no rare NOTCH3 or ADA2 variant in six further unrelated Sneddon patients - is curated as a second evidence item, because it bounds how much either gene explains. F5 (RISK_FACTOR): heterozygous factor V Leiden enriched in antiphospholipid-negative Sneddon syndrome (PMID:12765305), with that study's own negative clinical-correlate result curated alongside; deliberately left unwired to any mechanism node, with the reason stated in notes. Added a new upstream pathophysiology node, Monogenic Endothelial and Mural Cell Injury, carrying ADA2 and NOTCH3 and feeding the existing Occlusive vasculopathy node. Gene-to-mechanism wiring 0/0 to 2/3. Disagreement with MONDO recorded in the PR: the ADA2 edge on MONDO:0008436 traces to an abstract-less NEJM letter, and every authority names the entity DADA2.

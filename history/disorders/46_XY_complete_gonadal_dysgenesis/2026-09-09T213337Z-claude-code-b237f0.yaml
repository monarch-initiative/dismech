  summary: Prose fix superseded on main; this PR no longer edits the entry
  details: |
    Records that an earlier edit from this PR is gone, so the record beside it does not describe a change a reader can find in the file.

    On 2026-09-04 this PR removed the DHX37 MONDO:8000015 item from the notes sentence saying the local disease-term enum rejects a list of MONDO classes, because binding that class in the new 46,XY Sex Reversal 11 entry made the claim false for it. That is the session recorded in 2026-09-04T213337Z-claude-code-3c8a16.yaml.

    Main has since solved the whole problem rather than the one item: it bound all eight classes as subtype_term values on has_subtypes entries and deleted the sentence entirely. Merging main in produced a conflict between my one-item removal and main's wholesale deletion, and main's side is right — the sentence describes a constraint that no longer applies to any of the classes it named. I took main's version, so this PR's copy of the entry is now byte-identical to main and the PR no longer changes this file.

    The earlier record stands as written. It describes the session accurately, and its reasoning for declining to add a mappings.mondo_mappings entry for MONDO:8000015 is still worth having: a skos:narrowMatch there would have counted as curated coverage for a concept the new entry curates in its own right.

    That reasoning now has a live counterpart worth a curator's attention. Main binds MONDO:8000015 as the subtype_term of this entry's DHX37 subtype, while PR #10348 binds the same CURIE as the top-level disease_term of the standalone entry. Under the MONDO coverage rule both count as curated coverage, so the concept is claimed twice. That is not a defect introduced here and it is not mine to resolve; it is the lump/split question already open for @cmungall, now with a concrete consequence rather than a hypothetical one.

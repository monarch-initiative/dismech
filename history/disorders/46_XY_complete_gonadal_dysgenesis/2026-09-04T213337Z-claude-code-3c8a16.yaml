  summary: 'Correct stale enum-rejection note superseded by PR #10348'
  details: |
    One sentence in this entry's notes became false as a side effect of PR #10348 and is corrected here, in the same push as that PR's other review fixes.

    The notes recorded that certain MONDO phenotype-series cross-references are kept as prose rather than structured mappings because the local disease-term enum rejects them, and listed DHX37 MONDO:8000015 among eight such classes. PR #10348 binds MONDO:8000015 as the disease_term of a new entry, 46,XY Sex Reversal 11, which adds it to cache/enums/diseaseterm_f618932bb23f.csv. The stated reason therefore no longer holds for that one class. The other seven were checked and are unaffected, so only the DHX37 item was removed.

    The replacement sentence says the class is curated as its own entry rather than saying it now passes the enum. That is deliberate: the first is a durable fact about the knowledge base, the second is a statement about cache state of the kind CLAUDE.md warns will rot again.

    The reviewer also suggested optionally promoting MONDO:8000015 to a structured mappings.mondo_mappings entry here now that it validates. Declined. Under the MONDO coverage rules a skos:narrowMatch counts as curated coverage, so recording one here would attribute the concept to this entry while PR #10348 curates it as an entry in its own right. The two claims would compete for the same concept.

  summary: Bind subtype_term MONDO IDs for 8 gene-axis subtypes; remove stale enum-rejection
    note
  details: |
    Issue #11391 reported that the entry's notes: sentence justifying 8 unbound MONDO phenotype-series cross-references (claiming the local disease-term enum rejects them) was stale. A detailed automated-review comment on the issue re-verified all 8 CURIEs against live OAK/OLS4 lookups (root cause: an upstream OLS4 bug misrouting MONDO:0000001, fixed 2026-08-03 per dismech #7012) and found all 8 now resolve, and further identified that these 8 CURIEs are not lateral phenotype-series cross-references but MONDO's own gene-axis children of this entry's anchor MONDO:0010765, matching 8 of the 9 existing has_subtypes blocks (SOX8 has no MONDO term and was left unbound). Re-verified each of the 8 labels independently via a fresh 'uv run runoak -i ols:mondo info <CURIE>' lookup before writing (SRY MONDO:0020712 '46,XY sex reversal 1'; NR0B1 MONDO:0010226 '...2'; NR5A1 MONDO:0013066 '...3'; DMRT1 MONDO:0007938 '...4'; MAP3K1 MONDO:0013410 '...6'; DHH MONDO:0009301 '...7'; SOX9-regulatory MONDO:0014634 '...10'; DHX37 MONDO:8000015 '...11'). Added a subtype_term block to each of the 8 corresponding has_subtypes entries, following the 46_XX_Testicular_DSD.yaml pattern (subtype_term over mondo_mappings, since these are narrower-than-anchor gene-axis subtypes, not skos:relatedMatch/closeMatch cross-references). Deleted the stale notes: sentence outright per the review's explicit instruction not to replace it with a shorter restatement. Deleted stubs/46_XY_Sex_Reversal_11.yaml (MONDO:8000015), which is now retired by the DHX37 subtype_term binding; left stubs/46_XY_Sex_Reversal_3.yaml alone since PR #10349 already merged and removed it (MONDO:0013066/NR5A1). Did not touch the unrelated MONDO:0024573 (hypertrophic cardiomyopathy) parentage anomaly the review flagged as a separate, out-of-scope MONDO upstream issue. Validated with just validate, just validate-terms, just check-enum-values, just check-entity-refs, just check-duplicate-keys, and just validate-disorders; committed the resulting cache/enums/diseaseorsubtypeterm_*.csv (8 new rows) and cache/mondo/terms.csv (5 new rows; 3 of the 8 CURIEs were already cached) rows produced by the tooling, plus references_cache/*.md files that the validator opportunistically upgraded from abstract-only to full-text during this run.

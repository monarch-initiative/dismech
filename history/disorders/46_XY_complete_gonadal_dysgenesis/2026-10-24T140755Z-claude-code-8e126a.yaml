    Enriched the SRY branch from a just-completed ai-gene-review of SRY. Added founding and HMG-box mutation-spectrum evidence to the SRY genetic row (PMID:2247149 de novo HMG-box; PMID:1339396 de novo nonsense + Gly->Arg; PMID:1415266 3/5 CGD with SRY changes; PMID:8353496 5/22 HMG-box changes with affected sisters implying paternal gonadal mosaicism). Added two mechanistic pathophysiology nodes: 'Defective nuclear import of mutant SRY' (NLS variants R62G/R75N/R76P/R133W partly cytoplasmic PMID:12764225; inherited V60L/I90M shuttling defect with intact DNA binding/bending PMID:24003159; R75M cytoplasmic in 46,XY CGD with dysgerminoma PMID:28030592; M64I relocalized as NLS defect PMID:16762365; calmodulin-dependent import PMID:15746192) downstream to the transcriptional-network node; and 'Failure of SOX9 testis-specific enhancer activation' (SRY+SF1 activate hTES and patient alleles show reduced activation PMID:21412441; ~twofold SOX9 attenuation PMID:24003159; mouse Enh13 deletion causes XY sex reversal PMID:29903884) downstream to supporting-cell failure, wired from the network node. Added Koopman mouse transgenic sufficiency evidence (PMID:2030730, MODEL_ORGANISM). All snippets exact-verified; validate/validate-terms/validate-disorders and offline gates pass.

  summary: 'Review: 46,XY complete gonadal dysgenesis'
  details: |
    Re-reviewed the classic nonsyndromic complete phenotype against the Asta and Falcon research artifacts and current disease-specific literature. Rebuilt ten etiologic subtypes, inheritance, progression, causal mechanisms, phenotypes, biochemical findings, diagnosis, differentials, management, and reference closure; calibrated genotype scope and tumor-risk claims; and opened issue #6587 for expert resolution of age-stratified risk, gonadectomy timing, modifiers, and deferred-surgery surveillance. Three independent audit tracks and a final stable-snapshot audit found no remaining critical or important issues. Schema, ontology-term, cache-stable reference, causal-graph, YAML, compliance, and pre-commit validation passed; 151 evidence snippets and titles close exactly over 24 references.

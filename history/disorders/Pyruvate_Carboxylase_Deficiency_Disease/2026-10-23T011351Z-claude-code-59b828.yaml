  summary: Wire PC deficiency to the hepatic gluconeogenesis failure module
  details: |
    Declared conformance on one node: Impaired Gluconeogenesis -> hepatic_gluconeogenesis_failure#Failure of Hepatic De Novo Glucose Production. The node already binds GO:0006094 gluconeogenesis, the module node's process. The link is reported cell_type_absent: the module node binds CL:0000182 hepatocyte and this node binds no cell type. That was left as it is rather than closed. The three references the entry cites were checked and none localizes the gluconeogenic defect to the liver, so binding hepatocyte here would have been an unsourced claim, and an absent binding is a smaller defect than a manufactured one. The entry's Lactate Accumulation node was deliberately not wired to the module's Lactate Overproduction: the module's own description says that in PC deficiency the lactate is substantially anaplerotic, pyruvate being unable to enter the TCA cycle via oxaloacetate, rather than the substrate backup that node models. No evidence, terms or bindings were changed.

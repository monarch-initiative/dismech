  summary: Add carbon tetrachloride adduction node and exposure link (#10298)
  details: |
    Curated the carbon tetrachloride case of AOP 38's protein-alkylation initiating event. Added a 'Reactive Metabolite Formation and Covalent Protein Adduction' pathophysiology node (biological_scale MOLECULAR, GO:0008213 protein alkylation, CHEBI:27385 tetrachloromethane, UBERON:0002107 liver, CL:0000182 hepatocyte) placed upstream of the existing 'Hepatocyte Injury and Death' node via an INDIRECT_KNOWN_INTERMEDIATES downstream edge. Grounded on the measured 14CCl4 covalent-binding experiment in PMID:6511912 (rat liver microsomes, oxygen/glutathione series), the protein-bound-label localisation and cytochrome P-450PB dependence in PMID:7083393, and the bioactivation chemistry in PMID:12708612. Added a 'Carbon Tetrachloride Exposure' environmental entry bound to ECTO:9000048 with an influences_mechanisms link to the new node (environmental_effect TRIGGERS), carrying its own evidence separate from the entry-level evidence, following the Arsenic_Poisoning pattern. All new evidence is graded IN_VITRO, MODEL_ORGANISM or OTHER; none is HUMAN_CLINICAL, and the node and environmental notes say so explicitly. Thioacetamide was deliberately not curated here because its adduct is an acylation rather than an alkylation and would not be described by the GO protein-alkylation binding. Also rewrote the stale retired-enum prose in the Hepatotoxic Drugs evidence explanation, which still opened 'PARTIAL, and the mismatch is worth preserving:'. Validated with just validate, just validate-terms, just count-verified-snippets, just check-entity-refs, just check-causal-targets, just check-duplicate-keys and just check-enum-values.

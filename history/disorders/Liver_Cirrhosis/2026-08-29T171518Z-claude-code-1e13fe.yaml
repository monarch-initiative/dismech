  details: |
    Added biological_scale to three pathophysiology nodes as part of the AOP 38 / Akura Twin NAM mapping exercise for issue #10051: Hepatocyte Injury and Death (CELLULAR, aligning with KE 55 at AOP-Wiki LoBO Cellular), Hepatic Stellate Cell Activation (CELLULAR, KE 265 Cellular) and TGF-beta Signaling in Fibrogenesis (MOLECULAR; no KE maps to it - it is the exogenous TGF-beta1 stimulus arm - and the tag follows the sibling IL-11 Signalling node already tagged MOLECULAR). Kupffer Cell and Inflammatory Response was deliberately left untagged: it maps to two Key Events at two different levels of biological organisation (KE 1492 Cellular and KE 1493 Tissue), so no single value describes it under the single-value discipline in CLAUDE.md. That is recorded on projects/AOP_EMOD_ALIGNMENT.md as the finding rather than resolved by guessing; splitting the node would move curated modeled_mechanisms readouts and was not done here. No evidence, terms, or other content changed. Validated with just validate, just check-duplicate-keys and just check-entity-refs.

  summary: Repair disconnected fibrosis/cirrhosis pathograph
  details: |
    Repaired the disconnected pathograph reported in issue #10310. Added three new pathophysiology nodes following the Alcoholic_Liver_Disease and Wilsons_Disease templates: 'Excessive Hepatic ECM Deposition' (conforms_to fibrotic_response#Excessive ECM Deposition), 'Cirrhotic Architectural Distortion' (conforms_to fibrotic_response#Architectural Distortion and Organ Dysfunction), and 'Increased Intrahepatic Vascular Resistance' (conforms_to portal_hypertension#Increased Intrahepatic Vascular Resistance, following the Budd-Chiari_Syndrome precedent for interposing this node rather than folding the resistance step into intermediate_mechanisms). Wired the fibrogenic arm: Hepatic Stellate Cell Activation -> Excessive Hepatic ECM Deposition -> Cirrhotic Architectural Distortion -> {Increased Intrahepatic Vascular Resistance -> Portal Hypertension; Synthetic Dysfunction; Jaundice}. Gave Portal Hypertension downstream edges to Esophageal Varices, Ascites, Hepatic Encephalopathy, and Splenomegaly; gave Synthetic Dysfunction a downstream edge to Coagulopathy; added an Esophageal Varices -> Gastrointestinal Hemorrhage phenotype sequela. Connected 7 of 9 previously orphaned phenotypes to the mechanism layer (up from 0/9); Hepatomegaly and Fatigue are left explicitly unconnected with notes explaining why no single-mechanism edge is evidenceable. Added target_mechanisms to Antiviral Therapy (-> Excessive Hepatic ECM Deposition), Diuretics (-> Ascites), Beta Blockers (-> Portal Hypertension, plus treatment_term/therapeutic_agent for carvedilol/propranolol), Lactulose (-> Hepatic Encephalopathy), and Liver Transplantation (-> Cirrhotic Architectural Distortion, BYPASSES). Set evidence_source: OTHER on both occurrences of the PMID:38642564 'profibrogenic phenotype' sentence in this file (previously unset/HUMAN_CLINICAL-default in this entry vs OTHER in kb/modules/portal_hypertension.yaml) so the new edges reusing that sentence do not create a same-file grading divergence. All new evidence reuses the eight PMIDs already cited in this entry (39063116, 23255577, 38642564, 22164337, 37159031, 37780566) plus reuse of already-cited quotes; no new references were fetched. Confirmed the stale 'PARTIAL' prose the issue flagged in the Hepatotoxic Drugs environmental evidence had already been rewritten in a prior commit; no action needed there. Did not add a Splanchnic Vasodilation and Hyperdynamic Circulation node (module's beta-blocker drug-target pattern) since neither this entry nor its Budd-Chiari_Syndrome sibling conformer carries that node -- Beta Blockers targets Portal Hypertension instead, with the design-pattern rationale recorded in the edge description. Validated with linkml-validate (Disease), linkml-term-validator, linkml-reference-validator (79/79 snippets verified), check_causal_targets, check_entity_refs, check_snippet_grading (no new divergences), check_enum_values, check_duplicate_yaml_keys, check_qualifier_terms, check_source_defect_claims, check_title_snippets, and check_disconnected_phenotypes (7/9 phenotypes now causally connected, up from 0/9; every pathophysiology node now has both an incoming and outgoing edge except the root 'Reactive Metabolite Formation and Covalent Protein Adduction' node, which is fed by the Carbon Tetrachloride Exposure environmental entry via influences_mechanisms). This PR unblocks #10298 (protein-alkylation node upstream of the fibrosis mechanism), which required a fibrosis mechanism to exist in this entry before it could land.
- type: REVIEW
  outcome: changed
  sections:
  - pathophysiology
  - treatments
  summary: 'PR #12001 review round: add Splanchnic Vasodilation node, address optional nits'
  details: |
    Addressed the automated PR review on PR #12001. Blocking finding: the
    prior round's Beta Blockers target_mechanisms edge pointed at Portal
    Hypertension with a description apologizing for not modeling the
    portal_hypertension module's stated beta-blocker drug-target node
    ('Splanchnic Vasodilation and Hyperdynamic Circulation'). Reconsidered
    the earlier decision not to add that node (it had been justified by the
    Budd-Chiari_Syndrome precedent, which the reviewer correctly pointed out
    does not transfer -- Budd-Chiari has no beta-blocker treatment needing a
    target). Added the node, conforming to
    'portal_hypertension#Splanchnic Vasodilation and Hyperdynamic
    Circulation', mirroring the module node's role/biological_scale/GO terms,
    with a downstream edge to Portal Hypertension, both citing the
    already-quoted PMID:38642564 'hyperdynamic circulatory syndrome' clause.
    Left this occurrence's evidence_source unset rather than setting it to
    OTHER as the reviewer's literal suggested fix proposed, because three
    other occurrences of this exact sentence already exist ungraded
    elsewhere in this file (Portal Hypertension node, Splenomegaly evidence,
    IIVR->Portal Hypertension edge); setting only the new occurrence to
    OTHER would have created a same-file check_snippet_grading divergence
    rather than resolving one. Retargeted the Beta Blockers edge to the new
    node and replaced its apologetic description with the actual
    pharmacology (beta-1/beta-2 blockade mechanism). Took three optional
    (blue) suggestions: removed two cross-entry curation-provenance
    sentences from pathophysiology descriptions/explanations (biology slots
    should describe biology, not which sibling entries were used as a
    template); hedged the Portal Hypertension -> Esophageal Varices edge
    from DIRECT to INDIRECT_KNOWN_INTERMEDIATES (portosystemic collateral
    formation is the actual intermediate step, and the module carries a
    dedicated node for it); and added quote_role: REVIEW_SYNTHESIS to all 8
    occurrences of four PMID:37159031/33317250 sentences that report
    trial/meta-analysis results the citing narrative reviews did not run
    themselves. Did not add a Portosystemic Collateral Formation node as a
    separate entity (the reviewer offered a choice between that and hedging
    the edge; hedging was the narrower, sufficient fix). Declined the
    remaining optional suggestion (LSEC capillarization as its own node) as
    explicitly non-blocking. Re-validated: linkml-validate, term validator,
    reference validator (80/80 snippets verified), check_causal_targets,
    check_entity_refs, check_enum_values, check_duplicate_yaml_keys,
    check_qualifier_terms, check_snippet_grading (no new divergences),
    check_title_snippets, check_source_defect_claims, and
    check_disconnected_phenotypes (still 7/9 phenotypes connected; every
    pathophysiology node has an outgoing edge, and the only two without an
    incoming edge are the two legitimate root/parallel-trigger nodes,
    matching the portal_hypertension module's own structure where the
    amplifier node has no incoming edge either).

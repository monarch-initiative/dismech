  summary: Cite evidence for previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 3. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. This tranche used a hardened helper that pulls `reference_title` from the cache frontmatter rather than typing it, and asserts each snippet is non-empty, over 20 characters, at least 5 words, bracket-free and present in the cache -- the guards that the #8541 review showed were missing. Cited all four previously evidence-free `environmental:` exposures (Alcohol, Hepatitis B/C Virus, Obesity/Metabolic Syndrome, Hepatotoxic Drugs). Alcohol uses a sex-stratified dose-response meta-analysis rather than a single risk estimate, preserving the finding that women reach a given cirrhosis risk at substantially lower intake. Obesity/Metabolic Syndrome is graded COMPUTATIONAL because the cited NASH burden projection is Markov modelling rather than an observed cohort. Hepatotoxic Drugs is PARTIAL and the mismatch is deliberately preserved in the explanation: the citable acetaminophen evidence is for ACUTE liver failure, a different endpoint from the chronic fibrotic cirrhosis this entry models.

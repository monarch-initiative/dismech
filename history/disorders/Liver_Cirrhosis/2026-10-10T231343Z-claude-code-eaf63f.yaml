  summary: 'Edit: type ATP7B relationship in Liver_Cirrhosis'
  details: |
    The ATP7B genetic record had no relationship_type. Typed it RISK_FACTOR (with variant_origin GERMLINE) rather than CAUSATIVE, because Wilson disease is one of several etiologies of cirrhosis and biallelic ATP7B variants are not sufficient for cirrhosis. Added an evidence item from PMID:30576569 (cached) in which decompensated cirrhosis was 2 of 10 adult hepatic Wilson disease presentations. Clarified the association text and notes. HFE and SERPINA1 records in the same entry also lack relationship_type and were left for their owners. validate, count-verified-snippets (81/81) and validate-terms pass.

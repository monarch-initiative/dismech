  summary: Add the Akura Twin liver fibrosis MPS as an experimental model
  details: |
    Added the first liver fibrosis New Approach Methodology in the knowledge base: the 384-well Akura Twin microphysiological system of Schmidt and Suter-Dick (PMID:40754287, Toxicology 2025), a microplate of 168 interconnected well pairs carrying HepaRG hepatocyte microtissues with or without THP-1 monocytic cells in one compartment and hTERT-HSC stellate microtissues in the other. Curated as experimental_model_type CO_CULTURE, since the defining feature is compartmental multi-cell-type co-culture of 3D microtissues rather than microfluidic perfusion; namo_type was deliberately omitted because no NAMO class in use fits and inventing one is worse than leaving it unbound. Four modeled_mechanisms links: Hepatic Stellate Cell Activation (RECAPITULATES, MODERATE) with fibrosis-marker and matrix-remodeling readouts; Kupffer Cell and Inflammatory Response (PARTIALLY_RECAPITULATES, LOW, since THP-1 is a circulating monocytic line and not a resident Kupffer cell); Hepatocyte Injury and Death (PARTIALLY_RECAPITULATES, MODERATE, albumin loss only, no death assay reported); and TGF-beta Signaling in Fibrogenesis (PERTURBS, since recombinant TGF-beta 1 is applied exogenously in place of the endogenous latent-activation route). Every snippet is an exact substring of the cached abstract. The drug-challenge arm of the same system is curated separately on the Drug-Induced Liver Injury Module. Schema, term and reference validation pass; 48/48 snippets verified.

  summary: Split Kupffer Cell and Inflammatory Response into two atomic nodes (#10314)
  details: |
    Split the bundled pathophysiology node 'Kupffer Cell and Inflammatory Response' into two atomic nodes at different biological scales, per the AOP 38 mapping finding recorded in projects/AOP_EMOD_ALIGNMENT.md and issue #10314: 'Kupffer Cell Activation' (biological_scale: CELLULAR, cell_types Kupffer Cell CL:0000091, biological_processes macrophage activation GO:0042116) and 'Hepatic Pro-Inflammatory Mediator Release' (biological_scale: TISSUE, biological_processes inflammatory response GO:0006954), wired Kupffer Cell Activation -> Hepatic Pro-Inflammatory Mediator Release -> {Hepatic Stellate Cell Activation, TGF-beta Signaling in Fibrogenesis}. Moved both existing evidence items (PMID:33317250, PMID:36293428) unchanged onto the activation node. Added new node-level evidence for the mediator node from PMID:33317250 (CCL2/CCL5 chemokine secretion sentence, whitespace-normalized exact substring). Added a new downstream edge Hepatocyte Injury and Death -> Kupffer Cell Activation with its own fetched reference (PMID:25066777, Seki & Schwabe 2015 review) and exact quote, graded evidence_source OTHER (review synthesis). Split the Akura Twin experimental_models 'Kupffer Cell and Inflammatory Response' modeled_mechanisms link into two separate links (Kupffer Cell Activation keeping the THP-1 activation-marker readout and the THP-1-is-not-Kupffer-cell caveat; Hepatic Pro-Inflammatory Mediator Release keeping the PAI-1 readout), each carrying the missing-compartment and exogenous-TGF-beta-1 caveats. Updated the two stale rows in projects/AOP_EMOD_ALIGNMENT.md that referenced the old bundled node name and the 'left unset' biological_scale note. Did not touch kb/modules/fibrotic_response.yaml or kb/modules/drug_induced_liver_injury.yaml, which carry the same bundling pattern but are out of scope per the issue (left for a follow-up issue). Validated with just validate (schema+terms+references, 51/51 snippets verified), just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-enum-values, just check-folded-hyphens, just check-snippet-grading, and uv run pytest tests/test_data.py -k Liver_Cirrhosis (all pass).

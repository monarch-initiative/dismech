  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 9 (NDUFS6)'
  details: |
    New entry for MONDO:0032615, the recessive complex I deficiency caused by biallelic NDUFS6 variants, created from its stub (stub deleted). NDUFS6 is modelled as an accessory N-module subunit with structural molecule activity (GO:0005198) and a zinc-binding site (GO:0008270), both DECREASED: the Yarrowia NUMM ortholog work (PMID:25902503) shows the zinc site is needed for a late assembly step and for cluster N4, human knockout data summarised in PMID:41683799 show N-module dissociation without severe loss of activity, and patient cells show reduced NDUFS6 with co-depletion of NDUFA12, NDUFS4 and NDUFV1 (PMID:38217609, PMID:30948790, PMID:15372108). The isolated complex I deficiency node carries a REFUTE item for the hypomorphic c.309+5G>A allele, whose lymphoblasts showed no detectable bioenergetic defect (PMID:38459834). Phenotypes span the neonatal lethal form (PMID:15372108, PMID:19259137), infantile Leigh syndrome (PMID:30948790) and the neuropathy-predominant form (PMID:38217609, PMID:38459834, PMID:41683799, PMID:38549004); early-case features are quoted from the table of published patients in PMID:41683799 because the early papers are cached as abstracts only. Neonatal death (HP:0003811) was not bound because it is outside the PhenotypeTerm enum; it is stated in the descriptions. The 2022 C115F neonate (PMID:35801790) is noted but not used as phenotype evidence because of co-existing NHLRC2 FINCA syndrome. relationship_type CAUSATIVE: ClinGen rates NDUFS6 Definitive for mitochondrial disease (MONDO:0044970), a lumped term, so the tier is recorded in notes only. Mouse gene-trap model (PMID:22474353, PMID:23320803) and preclinical AAV9 gene therapy (PMID:40399258) included, with a HUMAN_MODEL_MISMATCH discussion on the cardiomyopathy no patient has shown. Validated: linkml-validate, term validation, reference validation (61/61 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen and gene-term checks.

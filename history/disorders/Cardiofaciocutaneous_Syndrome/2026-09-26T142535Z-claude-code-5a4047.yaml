  summary: 'Genetics pass: CFC1-4 subtype rows, RAS/RAF/MEK mechanism tiers, GeneReviews
    baseline'
  details: |
    Genetics pass for issue #12260 (d2g series-053), which listed the four numbered
    cardiofaciocutaneous MONDO classes as uncurated under this parent.

    Anchor check first: disease_term MONDO:0015280 cardiofaciocutaneous syndrome is
    exactly what the entry models, so the four numbered classes are genuine subtypes
    of it and not an artefact of an over-broad anchor. No rebinding needed.

    Baseline: the GeneReviews chapter PMID:20301365 existed and was not cited. It is
    now cited in the inheritance block and tagged GeneReviews in a new top-level
    references block, so check-genereviews reports TAGGED instead of
    UNTAGGED_CHAPTER. ClinGen's committed 2026-08-13 gene_validity.csv carries five
    cardiofaciocutaneous rows graded Definitive or better for BRAF, MAP2K1 and
    MAP2K2, Strong for KRAS and Limited for NRAS, plus PTPN11, RAF1, SHOC2 and SOS1
    as Disputed. Primary literature read: PMID:16439621, PMID:16474404,
    PMID:18413255, PMID:22301711, PMID:35524774, PMID:36308388.

    Added: four has_subtypes rows (CFC1/BRAF, CFC2/KRAS, CFC3/MAP2K1, CFC4/MAP2K2)
    with bound subtype_term, genes, per-row inheritance and cited evidence; reciprocal
    subtype foreign keys on the four gene records; case_fractions for BRAF, MAP2K1 and
    MAP2K2 from the 43-individual survey cohort in PMID:36308388; and three new
    pathophysiology nodes splitting the single RAS-MAPK node into the RAS, RAF and MEK
    tiers so each gene is wired to the tier it acts at. Six new causal edges, two of
    them reaching phenotypes.

    Merged and removed: three legacy genetic records named BRAF Mutations,
    MAP2K1/MAP2K2 Mutations and KRAS Mutations carried no gene_term, so they could
    never wire to the pathograph and duplicated the four gene records beside them.
    Their evidence and notes were folded into the corresponding gene records and the
    three were deleted; nothing in kb/ or history/ referenced them by name.

    Prose corrections made while touching these records. The BRAF note claimed CFC
    BRAF variants are "typically kinase-impaired but still activate the pathway
    through RAF dimerization (Q257R, E501G)". PMID:18413255 says "some" of the mutant
    proteins are kinase impaired, not typically, and says nothing about dimerization;
    PMID:22301711 calls Q257R the kinase-active allele, which contradicts the original
    sentence outright. The claim is now stated as the source states it, on the CFC1
    subtype row, with the quote attached. The inheritance description asserted
    complete penetrance and attributed the de novo rate to reduced reproductive
    fitness, neither sourced; it now follows the GeneReviews chapter, which records
    familial recurrence and a 50 percent transmission risk.

    Declined: NRAS is left with no relationship_type, no subtype assignment and no
    mechanism node. ClinGen grades it Limited for this disease and MONDO's four
    numbered subtypes are defined on the other genes, so placing it on a mechanism
    node would assert a causal role the evidence does not carry. It is the one record
    in the wiring denominator that stays unwired, by choice.

    Validation: just validate, validate-terms, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-genereviews all pass. Phenotype
    causal inlink coverage 0/11 -> 3/11; gene mechanism outlink 0/8 -> 4/5; subtype
    foreign-key coverage 0 -> 4/4 with all four WIRED_DIRECT.

    Review round 1 (PR #12907, ai4c-reviewer, CHANGES_REQUESTED). One finding on this
    entry, accepted.

    The MEK node's description carried "Unlike BRAF, no somatic mutations have been
    reported in the MEK genes", quoted correctly from a 2008 methods chapter and no
    longer true: somatic MAP2K1 variants are now widely reported. The sentence and its
    evidence item are removed. It also played no part in cardiofaciocutaneous
    pathophysiology, so nothing downstream depended on it.

    Suggestions taken: the GeneReviews diagnostic sentence, naming the four genes whose
    heterozygous pathogenic variants establish the diagnosis, is now cited in the
    inheritance block - it is the set this entry's four numbered subtype rows enumerate;
    and the MEK-to-Seizures edge's first explanation, which had been copied from the
    BRAF edge and referred to a kinase domain, now names the recurrent MAP2K1 p.Tyr130
    site that the cohort actually locates the MEK-side seizure burden to.

    Named as a follow-up at the reviewer's request: the GeneReviews chapter's Clinical
    Characteristics and Management sections are not mined here. Hypertrophic
    cardiomyopathy, feeding problems, eye findings, xerosis and hyperkeratosis, and the
    surveillance schedule are all in that chapter and belong in a phenotype and
    management pass on this entry, which this genetics-scoped pull request does not
    attempt.

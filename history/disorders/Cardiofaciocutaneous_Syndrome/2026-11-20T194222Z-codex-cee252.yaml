  summary: Map Cardiofaciocutaneous syndrome to OMIMPS:115150
  details: |
    Checked actual series membership in January 2026 OMIM and class scope in September 2026 MONDO against the current Disease and its subtypes. PS115150 covers the BRAF-, KRAS-, MAP2K1-, and MAP2K2-related cardiofaciocutaneous forms already represented as CFC1 through CFC4 in this Disease entry. The shared developmental RAS-MAPK disorder and characteristic cardiac, craniofacial, cutaneous, and neurodevelopmental phenotype support retaining one syndrome, while gene-specific mechanisms and seizure differences remain subtype annotations. The January 2026 OMIM snapshot contains OMIM:115150, OMIM:615278, OMIM:615279, and OMIM:615280; the September 2026 MONDO:0015280 class has the corresponding four children and an exact series mapping. This is not a mapping to CFC1 alone, to all RASopathies, or to cancers carrying somatic variants in these genes.
    Preserved existing verbatim source misspellings while adding line-local codespell annotations after checking the cached quotations.

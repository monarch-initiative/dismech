  summary: Bind the inheritance mode to an HPO term (HP:0000006 Autosomal dominant
    inheritance)
  details: |
    The entry's inheritance block carried a free-text name and description but no inheritance_term, so the mode of inheritance was not machine-readable. Bound it to HP:0000006 Autosomal dominant inheritance.

    CLAUDE.md names this as the common gap: an inheritance_term with only a preferred_term and no term: is unbound, and here even the inheritance_term wrapper was absent. Found while auditing which cardiac entries can be told apart as Mendelian or non-Mendelian from the data alone.

    Worth recording for the next curator: HPO has no 'Multifactorial inheritance' term. HP:0001426, which carried that label historically, is now 'Non-Mendelian inheritance', and the 23-member InheritanceTerm enum has no multifactorial concept at all. That is a plausible reason the two multifactorial blocks in this tranche were left as free text.

    Only the binding was added. The existing name, description and evidence are unchanged.

    Validated with linkml-validate against the Disease class, just validate-terms, and the four offline gates.

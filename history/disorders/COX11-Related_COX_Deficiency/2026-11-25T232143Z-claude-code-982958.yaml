  summary: 'Gene-family review: COX11'
  details: |
    COX11 genetic record typed UNKNOWN with variant_origin GERMLINE and its recessive inheritance block bound to HP:0000007. Three affected children from three families are reported (PMID:36030551, PMID:38068960) and ClinGen rates COX11 Limited (AR) only for mitochondrial disease (MONDO:0044970), broader than this entry's MONDO:0859520, so CAUSATIVE (Definitive/Strong) is not used and no tier is recorded. The node keeps GO:0016531 copper chaperone activity, matching COX11's delivery of copper to the CuB site of COX1.

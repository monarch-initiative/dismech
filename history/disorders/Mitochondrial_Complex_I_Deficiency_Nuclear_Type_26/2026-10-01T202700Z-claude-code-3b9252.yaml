  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 26 (NDUFA9)'
  details: |
    New entry for MONDO:0032630 (NDUFA9). Sources: van den Bosch 2012 (PMID:22114105, index case and complementation), Baertling 2018 (PMID:28671271, assembly analysis in two patients), Singh 2023 (PMID:37970307, adult dystonia case, PMC full text), Magrinelli 2025 (PMID:41069424, 12-case cohort, PMC full text), Stroud 2013 (PMID:23223238, TALEN knockout) and PMID:22653752 (NDUFA9 in the early Q-module intermediate, consistent with the MC1DN18 entry). Phenotype frequencies come from the 2025 cohort counts. Pathograph: variant -> misfolding/anchoring loss (PROVISIONAL, modelling) -> stalled assembly -> isolated complex I deficiency -> striatal/brainstem energy failure and white matter degeneration -> phenotypes. Conforms to complex_i_deficiency at three nodes. Three knowledge gaps recorded: genotype-severity correlation, selective striatal vulnerability, and viability of null alleles. PMID:36939934 (DNAJC30 + NDUFA9 letter) has no abstract, so it is named in notes but not cited. No deep-research report was run; evidence was taken directly from the fetched references. Validated with just validate, count-verified-snippets (61/61) and validate-terms.

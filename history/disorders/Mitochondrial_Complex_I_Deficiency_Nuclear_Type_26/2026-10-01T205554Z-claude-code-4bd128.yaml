  summary: Ground NDUFA9 on complex I activity; review round 1
  details: |
    CI's gene-activity grounding gate failed: NDUFA9 was wired only to the variant node, which carries no molecular function. Following the MC1DN18 entry, NDUFA9 is now also attached to the Isolated Complex I Deficiency node, which gains GO:0008137 NADH dehydrogenase (ubiquinone) activity, DECREASED; that node's existing evidence measures residual complex I activity of about 2 to 20 percent of control. The review's optional suggestions were taken in the same round: quote_role REVIEW_SYNTHESIS on the two quotes from the 2023 case-series table that summarise the 2012 index case; the retinitis pigmentosa and hearing loss descriptions now say the two sources attribute these features differently, instead of asserting index case only; strabismus, scoliosis and ataxia were added from the cohort sentence already cited, each wired from the complex I deficiency node with an INDIRECT_UNKNOWN_INTERMEDIATES edge. Thiamine was tried as NCIT:C874 but is outside the ChemicalEntityTerm enum, so the slot stays empty and the treatment note says why. Validated with validate, validate-terms, count-verified-snippets (64/64), the grounding gate and the offline gates.

  summary: 'Create: CNS Tumor with BCOR Internal Tandem Duplication (MONDO:0858966)'
  details: |
    New entry for the brain tumour defined by an internal tandem duplication of BCOR, on MONDO:0858966. Until now the knowledge base mentioned it only inside Sarcoma_with_BCOR_Genetic_Alterations, which carries the same duplication outside the brain. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only. Closes the claim issue 17027; part of the neuroblastoma-related series (issue 15822).

    Sources. 19 papers are cited, 16 of them new to the reference cache. PMID:26919435, PMID:35174661 and PMID:33920124 were already cached. Sentences of PMID:26919435 and PMID:33920124 that other entries quote keep the evidence_source used there. The sources are case reports and small series (the largest has ten patients), a 2025 systematic review of 69 reported cases, one outcome report from two trials, and laboratory studies of the BCOR protein and of neural stem cells.

    Shape. Five mechanism nodes in one chain: BCOR Internal Tandem Duplication, Disrupted PRC1.1 Assembly, Derepression of Polycomb Target Genes, Neuroepithelial Tumour Growth, and Local Recurrence and Late Dissemination. Six phenotypes, each reached by a causal edge. One genetic row (BCOR, SOMATIC_DRIVER). Four diagnosis rows, nine differential diagnoses, three treatments, two progression phases, one prevalence record, two epidemiology rows and three KNOWLEDGE_GAP discussions.

    Decisions a reader may want to check. The name is that of the 2021 WHO classification and of NCIT:C186556. MONDO writes the gene symbol of its label in lower case; the label is copied as MONDO has it. The duplication node carries a somatic genetic_context and a cell type, so the entry derives a cell of origin: neural progenitor cell (CL:0011020), with the authors' wording, primitive neuro-glial progenitor cell, as preferred_term. That cell is the inference of one study, whose authors call their arguments indirect; a second study proposes a neuroepithelial stem cell. The node description and a discussion say so. The edge from Disrupted PRC1.1 Assembly to Derepression of Polycomb Target Genes is typed INDIRECT_UNKNOWN_INTERMEDIATES, because the two findings come from separate experiments. No frequency band is set on any phenotype: the reviews give no rates. The prevalence record is CASES_IN_LITERATURE. Survival figures from cohorts defined by methylation class are marked as such, because that class also takes in tumours with a BCOR fusion. The chemotherapy row binds no agents, because the regimens differ from report to report, and one result against chemotherapy alone is a REFUTE item on it. The differential row for brain tumours with a BCOR or BCORL1 fusion has no disease term.

    Terms. Read through OLS, or from the local hgnc, ncit and icd10cm builds, on 11 November 2026. One negative finding, with its search run again before the commit: MONDO has no term for the brain tumour with a BCOR or BCORL1 fusion (an OLS search of MONDO for BCOR returned five terms, this entry's and four sarcoma terms). ICD-10-CM has no code for the tumour, so the mapping to C71 Malignant neoplasm of brain is a broad match.

    Left out. Any drug aimed at a kinase, and the expression findings that have been used to argue for one. A classifications block, histopathology rows (the histology is in the diagnosis section and in a mechanism node) and datasets. just check-genereviews reports no GeneReviews chapter, as expected for a tumour that is not Mendelian.

    Validation: just validate, validate-terms and validate-disorders pass; 162 of 162 snippets verify against the cached references; the whole-repo gates, the extra gates and the kb test lane were run locally and pass. Term validation added 6 rows to the label caches and 6 to the enum caches.

    After review. The first review approved the entry and made three suggestions, all taken. (1) The entry disagreed with itself on GFAP: the row for CNS neuroblastoma with FOXR2 activation said the tumour often expresses GFAP, after the 2016 study, while the histology row and the ependymoma row said little or none, after the two later pathology series. The sources do differ, so the histology row now says so and cites the 2016 sentence beside the later ones, and the FOXR2 row names the disagreement and cites the later series of ten. (2) The node Derepression of Polycomb Target Genes no longer binds a cell type. The neural stem cell it carried was the laboratory model of the experiment and could be read as the tumour cell; the description now says that it is the model and that the derepression has not been examined in tumour cells. The entry still derives one cell of origin, from the duplication node. (3) The chemotherapy row, whose modality is small molecule, now says that bevacizumab, the one antibody among the drugs listed, was an addition in some reports. After these changes 164 of 164 snippets verify, and the same validation and gates were run again and pass.

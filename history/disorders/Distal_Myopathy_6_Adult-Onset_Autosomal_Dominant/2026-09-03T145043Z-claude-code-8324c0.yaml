  summary: Structure penetrance/expressivity per PR review
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #10702.

    Requested change, made. Added `penetrance: INCOMPLETE` and
    `expressivity: VARIABLE` to the `inheritance:` block, with the PMID:39812845
    genotype-dependence snippet as its own evidence item. The reviewer's argument
    is right: both facts were already asserted in this entry's prose (the
    presymptomatic progression phase quotes the same sentence), so leaving them
    unstructured meant a query for autosomal dominant diseases with incomplete
    penetrance would miss MPD6 - which matters for an adult-onset dominant
    disease carrying a Genetic Counseling treatment. `penetrance_percentage` is
    deliberately absent: no cohort reports a figure.

    Suggestion 1, taken. Removed the `Asymmetric muscle weakness` phenotype added
    in 40f0ac5ec. It re-bound HP:0009053, already used by the
    `Distal lower limb muscle weakness` node, and was fully redundant - that node
    already carried the identical PMID:30900782 asymmetry snippet as evidence and
    already described the weakness as often asymmetric. Adding it was my error,
    not a judgment call.

    While there, sharpened the justification in the surviving node's
    description. It argued that no HPO asymmetry term exists by noting
    "HP:0031500 is Abdominal mass". That statement is factually correct -
    verified with OAK, HP:0031500 is indeed Abdominal mass - it is simply an
    irrelevant term to cite, since nothing would lead a curator to consider it
    for a laterality qualifier in the first place. An earlier draft of this
    record called it an unverified check, which was unfair to the original
    curator and is corrected here. Replaced with the terms actually relevant:
    the laterality modifiers
    under HP:0012831 are Bilateral, Unilateral, Right, Left and
    Alternating laterality, none of which expresses side-to-side asymmetry of
    severity, and the only asymmetry term in the region, HP:0007156, is
    Asymmetric limb muscle *stiffness*. Both verified with OAK rather than taken
    from the review.

    Suggestion 2 concerned the PR description, not the entry: it described
    UBERON:0001385 as "soleus muscle" when the term is tibialis anterior
    (soleus is UBERON:0001389). The YAML binding and cache row were always
    correct. Fixed in the PR body, which was generated by the Claude Code UI
    rather than by this session; the same body also miscounted the reference
    cache entries and the progression phases and omitted several added sections,
    so it was rewritten to match the diff.

    Validated: `just validate`, `just validate-disorders` (batched), 95/95
    snippets, check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-snippet-grading, check-snippet-length,
    check-title-snippets, check-folded-hyphens - all green. Compliance 98.5%
    (weighted 99.0%); the small drop from 98.6% is the removed duplicate
    phenotype, which had contributed a fully-scored node.

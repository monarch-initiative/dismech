  summary: 'Create: Distal Myopathy 6, Adult-Onset, Autosomal Dominant ACTN2'
  details: |
    Created new dismech entry for MONDO:0032853 MPD6, the ACTN2-related autosomal dominant adult-onset distal myopathy actininopathy. Curated the alpha-actinin-2 Z-disk pathophysiology chain: ACTN2 variant classes to alpha-actinin-2 aggregation and Z-disk/myofibrillar disorganization to distal muscle degeneration; phenotypes distal lower-limb weakness with anterior-compartment ankle-dorsiflexion onset, facial weakness, later proximal spread, rimmed vacuoles, centrally nucleated fibers, multi-minicores; ACTN2 gene entry; supportive care. Evidence from primary literature: Savarese 2019 PMID:30900782 original actininopathy, Savarese 2021 PMID:34386585 last-exon out-of-frame variants with facial weakness, Chen 2021 PMID:34170073 frameshift multi-minicore family, Ranta-Aho 2024 PMID:39095936 protein-aggregation mechanism, Ranta-Aho 2022 PMID:36116040 ACTN2 mutation update. Falcon deep research attempted. Validated with just validate schema+terms+references pass 17/17 snippets verified and just compliance 88.2 percent.

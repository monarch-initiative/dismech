  summary: 'Augment: MPD6 with second DR run, models, imaging, epidemiology'
  details: |
    Augmentation of an existing entry created by PR #7872. Compliance rose from
    81.7% to 98.4% (weighted 82.4% -> 98.9%); snippet count 30 -> 85, all
    verified.

    Deep research. Requested provider was falcon, per the /curate default. The
    Edison endpoint returned 403 (EDISON_API_KEY not valid in this environment),
    so the run was re-issued with `just dr_fallback='--fallback'` rather than a
    hand-picked substitute. openscientist produced the report, which is recorded
    in its frontmatter as fell_back: true, requested_provider: falcon, with the
    full provider_attempts list. Report used:
    research/Distal_Myopathy_6_Adult-Onset_Autosomal_Dominant-deep-research-openscientist.md
    (17 citations). The pre-existing falcon report from the 2026-08-02 session is
    unchanged and retained; the fallback rename briefly clobbered it and it was
    restored from origin/main before commit.

    Report validation (Step 3a). Reference validation: 17/17 resolved,
    confabulation_rate 0.0, no unresolved references; 12/17 scored on topic.
    Term validation: needs_review true, with three mislabelled terms -
    MONDO:0014138 offered as the MONDO id but is nemaline myopathy 8;
    UBERON:0011906 called "soleus" but is "muscle head"; UBERON:0011907 called
    "biceps femoris" but is "gastrocnemius medialis". None of these was bound.
    Every ontology term added here was independently resolved with OAK first;
    the soleus reference in prose uses no binding and the one UBERON binding
    added (UBERON:0001385 tibialis anterior) was OAK-verified.

    GeneReviews baseline (Step 3b): none exists. "ACTN2 GeneReviews[All Fields]"
    returns only the Nonsyndromic HCM (PMID:20301725) and Dilated Cardiomyopathy
    (PMID:20301486) overviews, which treat ACTN2 as a cardiac gene and are not a
    phenotype baseline for this skeletal entity; "distal myopathy GeneReviews[TI]"
    returns nothing. Recorded in the entry's review_notes.

    What was added. prevalence (CASES_IN_LITERATURE, no rate asserted, with the
    founder-ascertainment caveat); a three-phase progression; clinical_burden
    MODERATE with the cardiac/respiratory-sparing rationale; histopathology
    (EM Z-disk undulation, plus the cohort's non-specific biopsy finding that
    qualifies the diagnostic weight of the rest); imaging_findings (the
    37-patient MRI distribution and the ML-derived discriminating signature,
    including which muscles are preserved); biochemical (mildly elevated CK,
    NCIT:C113245, with the point that CK is a poor discriminator here);
    two phenotypes (HP:0003236, HP:0003325); a new upstream pathophysiology node
    "Alpha-actinin-2 conformational destabilization"; evidence on four of the
    five causal edges; mechanistic_hypotheses (the eccentric-load explanation
    for the distal predilection, EMERGING, carrying both its supporting quote
    and a refuting one); two animal_models and one experimental_model with
    modeled_mechanisms and readouts; variants (the two founder alleles and the
    last-exon frameshift class); two new differential_diagnoses (recessive
    biallelic ACTN2 myopathy, allelic congenital MsCD) plus distinguishing
    features and evidence on the pre-existing one; three treatments added and
    evidence on all six; evidence on both harrisons_chapter assignments; two new
    discussions (HUMAN_MODEL_MISMATCH on the animal models, KNOWLEDGE_GAP on the
    therapeutic window) and evidence added to the pre-existing nomenclature
    discussion.

    New references fetched and cited: PMID:39812845 (37-patient dominant cohort),
    PMID:38311799 (recessive biallelic ACTN2), PMID:30701273 (MsCD, zebrafish and
    AAV mouse), PMID:33458580, PMID:39017652, PMID:42111349, PMID:42481460,
    PMID:27287556, PMID:38352343.

    Cross-phenotype borrowing, flagged deliberately. ACTN2 is far better known
    as a cardiomyopathy gene, so several of the mechanistically useful papers
    are not about MPD6. PMID:42481460 and PMID:27287556 profile ACTN2
    hypertrophic-cardiomyopathy missense panels; PMID:30701273 models
    p.Leu727Arg, an allele of the allelic congenital core myopathy. Each is
    carried with directness: INDIRECT, an explanation naming the allele
    mismatch, and - for the models - explicit `limitations`. The animal models
    are PARTIALLY_RECAPITULATES at fidelity LOW for this reason, and the
    HUMAN_MODEL_MISMATCH discussion records that no model addresses the feature
    that defines MPD6 (adult onset selecting the anterior lower leg).

    Citations declined. The falcon report attributes the founding Savarese 2019
    MPD6 abstract to donkervoort2019o.18recessivemutationsin and
    amthor2019o.19pax7deficiencycauses, which are the UNC-45B and PAX7 abstracts
    printed on the same supplement page - a page-level misattribution, not the
    MPD6 abstract. The openscientist report cites PMID:21536590 for the Z-disk's
    vulnerability to eccentric damage; that paper is about alpha-actinin-3
    (ACTN3), a different gene, so it is not used for an ACTN2 mechanism. Both
    are recorded in the entry's review_notes.

    No datasets recorded, deliberately. `just discover-datasets` returns
    DIRECT-tagged GNE-myopathy mouse series (matched on the words "myopathy
    distal adult onset") and GENE_ONLY cardiac/iPSC series (matched on ACTN2).
    Both are the Named Entity Confusion pattern; none is about this entity, so
    the datasets block is left empty with the triage recorded in review_notes.

    Validation run. `just validate` passes; `just validate-terms` passes;
    `just count-verified-snippets` reports 85/85; `just validate-disorders`
    (the batched gate CI runs) passes schema, term and reference validation.
    Offline gates run and green: check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms plus
    check-qualifier-terms-online (needed because the NCIT:C86054 device
    qualifier is a qualifier-only CURIE the offline gate cannot see),
    check-enum-values, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-environmental-evidence, check-snippet-grading.
    check-snippet-grading initially failed on one real defect - the PMID:30701273
    patient sentence graded MODEL_ORGANISM in the new discussion and
    HUMAN_CLINICAL in a differential diagnosis; the sentence reports patients, so
    the discussion item was corrected to HUMAN_CLINICAL.

  summary: Address pre-PR red-team review of the MPD6 augmentation
  details: |
    Response to an adversarial pre-PR review of the augmentation committed in
    1fe372391. The review found no critical defects and confirmed the
    cross-phenotype borrowing was labelled, but raised several judgment-level
    findings. Compliance 98.4% -> 98.6%; snippets 85 -> 95.

    Corrected, because the reviewer was right:

    - Dropped `modifier: DECREASED` on GO:0051015 from the new
      "Alpha-actinin-2 conformational destabilization" node. No evidence item on
      that node mentions actin binding, and the actual actin-binding data in the
      two cited papers say "altered actin engagement" (PMID:42481460) and
      "not significantly different" (PMID:27287556) - so DECREASED was
      unsupported, and it contradicted the honest `ABNORMAL` on the same GO term
      one node earlier. Actin binding is also not the function the node's name
      describes.
    - That node had no incoming edge, making it a second disconnected root in
      the pathograph. Added the missing edge from "ACTN2 pathogenic variants
      alter alpha-actinin-2", with its own INDIRECT evidence.
      `check-causal-targets` cannot see this class of defect - it catches
      unresolvable targets, not absent edges.
    - The `supports: REFUTE` item under the eccentric-load hypothesis was wrong
      twice over. It reused a muscle-distribution snippet already used as
      SUPPORT twice elsewhere, and the refutation rested on my own assertion
      that glutei and hamstrings are not high-eccentric-load muscles. Hamstrings
      are the canonical high-eccentric-load group. Replaced with the
      genotype-dependence sentence, which genuinely competes with a load-only
      account (loading does not vary by allele), and rewrote the hypothesis
      description to say the muscle distribution settles nothing either way.
    - Renamed variant `ACTN2 c.1459T>C (p.Cys487Arg)` to `ACTN2 p.Cys487Arg`.
      The cDNA appears in no cited source; it came from a falcon report row
      whose citation this entry's own review_notes identifies as a page-level
      misattribution and declares unusable. Nothing referenced the old name.
    - Removed `clinical_significance: PATHOGENIC` from the two founder missense
      alleles. The attached evidence is haplotype and cosegregation only; no
      cited source states a classification, and this entry cites the ACTN2
      mutation update's caution that supporting data are limited for most
      reported missense variants. Kept on the protein-extending frameshift
      class, where PMID:39095936 explicitly recommends pathogenic
      classification.
    - Fixed a selective quotation of PMID:27287556. I had written that the
      authors judge the two variants "likely benign", truncating a two-clause
      conclusion whose second half says they are "likely to be genuine disease
      mutations".
    - Changed the destabilization -> aggregation edge from
      INDIRECT_KNOWN_INTERMEDIATES to INDIRECT_UNKNOWN_INTERMEDIATES; the cited
      authors frame that step as a proposal ("may be more likely to aggregate").
    - Rewrote the differential-diagnosis line claiming the ~20 dominant
      distal-myopathy genes share an anterior-compartment presentation. The
      quoted snippet supports the gene count, not a shared presentation, and the
      same review describes markedly different presentations (hands in Welander,
      vocal cord and pharynx in VCPDM).
    - Attached the mpd6_mechanism_variant_class_scope discussion to the
      destabilization node as well, so the HCM-panel caveat is carried by a
      structure that survives graph and KGX export rather than living only in
      `description` prose the exporters drop.

    Content gaps the reviewer identified, now filled:

    - Added a `diagnosis:` section, which was absent: multigene panel sequencing
      (the definitive test, and the thing that establishes inheritance mode
      rather than assuming it), lower-limb muscle MRI (which carries the
      discriminating weight precisely because biopsy is non-specific), and
      EMG with nerve conduction studies.
    - Added baseline cardiac evaluation (ECG/echocardiography, NCIT:C16525).
      This was the sharpest gap: for an entry whose central discipline problem
      is ACTN2's cardiomyopathy reputation, the one place that reputation has
      clinical consequence was missing. Recorded in `diagnosis:` rather than
      `treatments:` because it is an evaluation.
    - Added two variants already cited elsewhere in this file but missing from
      the variants block: c.2504delT (p.Phe835Serfs*66), and the Swedish
      family's second missense allele, recorded without an HGVS designation
      because the cited abstract does not name it.
    - Added an asymmetric-weakness phenotype, and reproductive options (prenatal
      diagnosis, PGT) to genetic counseling.

    Not changed, with reasons:

    - Treatments still carry no `target_mechanisms`. Supportive care,
      physiotherapy, orthoses and counseling do not act on a modelled mechanism
      node; asserting a link would be decorative. The pathograph link is
      appropriate for the models, which do act on specific nodes.
    - Serum CK remains modelled as both a Laboratory phenotype and a
      `biochemical` marker. HP:0003236 is a genuine phenotype and the biochemical
      record carries the reference-range discussion; the duplication is
      intentional.

    Also noted: seven references were fetched during the session and dropped
    before commit as uncited - PMID:19943616 and PMID:35975100 (the ACTN2-Nav1.5
    and idiopathic ventricular fibrillation branch), PMID:41066296 (muscle MRI in
    myopathy), PMID:21536590 (the ACTN3 paper declined as a wrong-gene citation),
    and PMID:33863518, PMID:37038366, PMID:37900606 (off-topic report citations).
    The Nav1.5 branch is a plausible future addition to the cardiac differential.

    Validated: `just validate`, `just validate-disorders` (batched
    schema/term/reference), 95/95 snippets, check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms-online, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-environmental-evidence -
    all green.

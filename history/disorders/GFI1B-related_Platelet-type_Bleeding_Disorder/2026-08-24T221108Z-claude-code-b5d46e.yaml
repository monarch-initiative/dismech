  summary: 'Create: GFI1B-related platelet-type bleeding disorder'
  details: |
    New entry for platelet-type bleeding disorder 17, MONDO:0008553, curated from four primary references located independently in PubMed. NEC preflight PASS against MONDO:0008553 with GFI1B mentioned 178 times. The central curation decision is that the dominant and recessive forms are two different molecular lesions rather than a dosage series, and the pathograph keeps them as separate trigger nodes converging on impaired megakaryocyte maturation: heterozygous zinc-finger variants act as dominant negatives over wild-type GFI1B, shown by reporter assays and abolished consensus-site binding, and are curated with functional_impact_category DOMINANT_NEGATIVE; the recessive kindred instead carries a homozygous insertion whose premature stop codon affects only the full-length p37 isoform, leaving the shorter p32 isoform expressed. A significant drafting error was caught and corrected before commit. I initially wrote the recessive lesion as loss of the p32 isoform, which is backwards, and built a knowledge-gap discussion around the resulting false paradox of unaffected erythropoiesis. The reference-title check rejected my guessed title for PMID:28550182, whose real title names p37 rather than p32; re-reading the full cached text showed the patients lose p37 and retain p32, which is the erythroid isoform, so erythropoiesis is spared for a straightforward reason and there was no paradox. The trigger node was rewritten, the stale attaches_to reference removed, and the discussion replaced with a HUMAN_MODEL_MISMATCH recording the genuinely open question, namely why homozygous Gfi1b deletion is embryonically lethal in mice through erythroid failure while human GFI1B disease presents as a platelet disorder. Two cached records, PMID:28096094 and PMID:28580815, are relevant by title but hold metadata only with no abstract, so nothing is cited from them rather than citing a title as a finding. Ectopic platelet CD34 is curated as a laboratory phenotype and screening aid rather than as a mechanism node, since no cited source shows it contributes to bleeding. Validated with just validate for schema and terms, 28/28 snippets verified against cached references, and the offline CI gates.

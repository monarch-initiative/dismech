  summary: Wire BDPLT17 to primary_hemostatic_plug_failure and into the grouping
  details: |
    Integrated the newly merged BDPLT17 entry (PR #9424, issue #9413) into the primary_hemostatic_plug_failure module and the Inherited_Platelet_Function_Disorders grouping, both of which landed on a branch cut after #9424 and so could not be referenced by it. No existing content, evidence or wording of the entry was rewritten; the changes are additive apart from one retargeted causal edge, described below.

    Conformance added at four existing nodes:
    - Dominant-Negative GFI1B Zinc-Finger Variants -> #Loss of a Platelet Primary-Hemostatic Component
    - Isoform-Selective Loss of Full-Length GFI1B-p37 -> #Loss of a Platelet Primary-Hemostatic Component
      (both triggers attach at the same module node; the module abstracts over component class, and the dominant/recessive distinction the entry is careful to preserve lives in functional_impact_category, not in the conformance target)
    - Large Granule-Deficient Dysfunctional Platelets -> #Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling
    - Bleeding Diathesis -> #Mucocutaneous Bleeding Diathesis

    Deliberately NOT conformed: Impaired GFI1B-Dependent Megakaryocyte Maturation. That node is the thrombopoiesis/maturation arm, which the module explicitly scopes out - impaired platelet production is a mechanistically distinct route that happens to share many genes (GFI1B among them, alongside FLI1, NBEAL2, MYH9, ACTN1, TUBB1). Conforming it would assert something the module does not model.

    One structural change. The entry had no node between 'Large Granule-Deficient Dysfunctional Platelets' and 'Bleeding Diathesis', so it did not pass through the module's central effector and could not satisfy the grouping's defining criterion. Added 'Failure of Primary Hemostatic Plug Formation' (TISSUE scale) as that intermediate, and retargeted the existing downstream edge onto it rather than leaving a redundant direct shortcut beside it. The retargeted edge keeps its original PMID:28401061 evidence, whose snippet ('human mutations of GFI1B produce bleeding disorders with low platelet count and abnormal function') supports the step as well as it supported the original; its `explanation` was reworded to describe the new target honestly rather than left pointing at the old claim. The new node carries the module convergence evidence (PMID:21781244, already cached and used at the same node in six sibling entries) plus the GFI1B-specific PMID:28401061 quote.

    This is a change to another curator's just-merged entry, made because the entry is now shared content on main and because the alternative - listing it as a grouping member that fails a NECESSARY_AND_SUFFICIENT criterion - would register as a curated contradiction, which is worse than either fixing it or leaving it out.

    Grouping: added as the ninth member of Inherited_Platelet_Function_Disorders on the secretion arm, alongside FLI1/BDPLT21 as the second megakaryocyte transcription-factor member, with differentiating_mechanisms recording the dominant-negative vs isoform-selective distinction and the boundary against NBEAL2 gray platelet syndrome (there the granule-packing machinery fails; here the maturation programme that builds the platelet does). Removed GFI1B (BDPLT17) from the outstanding-gaps list in the grouping notes.

    Validation: linkml-validate PASSED; linkml-term-validator PASSED; reference validation PASSED with 35/35 snippets verified (33 before this change, plus the two added). Grouping audit: all nine members SATISFIED on both criteria, structure OK, no contradictions and no unlisted candidates. check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-snippet-boundaries all clean.

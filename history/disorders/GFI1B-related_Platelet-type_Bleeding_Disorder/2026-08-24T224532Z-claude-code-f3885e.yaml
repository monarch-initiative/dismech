  summary: 'Review round 1: fix HP term misuse, add treatments and allele-frequency
    evidence'
  details: |
    Addresses the ai4c-reviewer review on PR 9424. The most important finding was the HP:0011875 misuse and it is fully corrected in three parts. The enlarged-platelet phenotype now uses HP:0040185 Macrothrombocytopenia instead of the generic morphology term. The ectopic CD34 phenotype no longer carries any term at all: reusing HP:0011875 there was a false match, since expression of a surface marker is not a morphological abnormality and the two are separately measured in the sources, by smear appearance versus immunofluorescence; the entry now records this as a new-term request in notes, on the principle that no term beats a bad one. Reduced platelet alpha granules, the defining grey-platelet feature, is added as HP:0033536 with evidence from two references. A treatments section was added with one entry, avoidance of immune-thrombocytopenia-directed therapy, evidenced from PMID:28550182 where a genetically confirmed patient had been splenectomised and treated with eltrombopag without improvement. The remaining management content the reviewer listed, platelet transfusion, tranexamic acid, hormonal therapy and iron supplementation, is deliberately not curated and the treatment notes say why: the deep-research report describing it carries no PMIDs and no cached reference for this entry contains quotable text for any of them, so curating them would require either an evidence-free block or a manufactured snippet. The genetic section was extended with variant classes and the only allele-frequency figure available from any cached reference, the rs150813342 splice-enhancer variant with minor allele frequency 0.009 associated with a mild phenotype attributed to residual p37 expression, which independently reinforces the isoform-dosage reading this entry curates, plus the hypomorphic recessive p.Leu308Pro allele in zinc finger 6. Penetrance was not added because no cached reference states it. Revalidated: schema and terms pass, snippets rose from 28/28 to 33/33 verified, offline gates clean, zero dangling entity refs, and a programmatic audit confirms every reference title matches its cached record.

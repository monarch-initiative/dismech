  summary: Upgrade Floating-Harbor syndrome with multi-node SRCAP chromatin/cell-division pathophysiology,
    progression, prevalence, diagnosis, and differential diagnoses
  details: 'Upgraded kb/disorders/Floating-Harbor_syndrome.yaml (issue #3017):

    - Added synonyms (Pelletier-Leisti syndrome, SRCAP-related Floating-Harbor syndrome), classifications
    (harrisons_chapter: GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC), prevalence (ULTRA_RARE, slightly more
    than 100 reported cases in DOI:10.3389/fgene.2022.846101), and two-stage progression (prenatal/infantile
    onset and age-dependent bone age normalization between 6 and 12 years).

    - Expanded pathophysiology from a single ungrounded node into a 5-node directed causal graph anchored
    on SRCAP (hgnc:16974) with molecular_functions GO:0140658 and GO:0140849: (1) SRCAP Truncation and
    Dominant-Negative Chromatin Remodeler Disruption -> (2) Defective H2A.Z Incorporation and Genome-Wide
    DNA Methylation Remodeling + (3) Impaired Mitotic Spindle and Cytokinesis Regulation -> (4) Delayed
    Endochondral Ossification and Growth Plate Maturation + (5) Aberrant Cranial Neural Crest and Neurodevelopmental
    Patterning, wired downstream to skeletal, craniofacial, and neurodevelopmental phenotypes.

    - Added Avascular necrosis of the capital femoral epiphysis (HP:0005743, Legg-Calve-Perthes disease)
    to phenotypes (PMID:23193612, PMID:32546215) and standardized evidence_source on PMID:23193612 to
    HUMAN_CLINICAL.

    - Added somatropin (CHEBI:749556) to Growth hormone therapy, added peripheral blood DNA methylation
    episignature analysis (NCIT:C63328) and bone age radiography (NCIT:C137876) to diagnosis, and populated
    differential_diagnoses (Silver-Russell syndrome, 3-M syndrome, SHORT syndrome, Rubinstein-Taybi syndrome).

    '

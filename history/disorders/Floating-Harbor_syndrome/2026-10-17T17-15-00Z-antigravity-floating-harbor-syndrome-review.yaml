  summary: Upgrade Floating-Harbor syndrome with multi-node SRCAP chromatin/cell-division pathophysiology,
    GeneReviews phenotypes and inheritance counseling evidence, progression, prevalence, diagnosis, and
    differential diagnoses
  details: 'Upgraded kb/disorders/Floating-Harbor_syndrome.yaml (issue #3017):

    - Added synonyms (Pelletier-Leisti syndrome, SRCAP-related Floating-Harbor syndrome), classifications
    (harrisons_chapter: GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC), GeneReviews genetic counseling evidence
    on inheritance (PMID:23193612), prevalence (ULTRA_RARE, slightly more than 100 reported cases in DOI:10.3389/fgene.2022.846101),
    and two-stage progression (prenatal/infantile onset and age-dependent bone age normalization between
    6 and 12 years).

    - Expanded pathophysiology from a single ungrounded node into a 6-node directed causal graph anchored
    on SRCAP (hgnc:16974) with molecular_functions GO:0140658 and GO:0140849: (1) SRCAP truncation-driven
    chromatin dysregulation -> (2) Defective SRCAP-Mediated H2A.Z Chromatin Incorporation + (3) Impaired
    Mitotic Spindle and Cytokinesis Regulation -> (4) Delayed Endochondral Ossification and Growth Plate
    Maturation + (5) Aberrant Cranial Neural Crest Development + (6) Neurodevelopmental Patterning Defect,
    wired downstream to skeletal, craniofacial, and neurodevelopmental phenotypes.

    - Added 17 GeneReviews-documented phenotypes (Small for gestational age HP:0001518, Atypical behavior
    HP:0000708, Clinodactyly HP:0030084, Short thumb HP:0009778, Broad fingertip HP:0011300, Abnormal
    clavicle morphology HP:0000889, Conductive hearing impairment HP:0000405, Strabismus HP:0000486,
    Hypermetropia HP:0000540, Seizure HP:0001250, Gastroesophageal reflux HP:0002020, Abnormal renal
    morphology HP:0012210, Hydronephrosis HP:0000126, Hypospadias HP:0000047, Cryptorchidism HP:0000028,
    Kyphoscoliosis HP:0002751, Celiac disease HP:0002608) alongside Avascular necrosis of the capital
    femoral epiphysis (HP:0005743, Legg-Calve-Perthes disease; PMID:23193612, PMID:32546215), added GO:0007399
    (nervous system development) on Neurodevelopmental Patterning Defect, and standardized evidence_source
    and quote_role across PMID:23193612, PMID:33909990, and PMID:34474679 citations.

    - Updated Growth hormone therapy to NCIT:C15986 (Pharmacotherapy) with therapeutic_modality: PROTEIN_REPLACEMENT,
    somatropin (CHEBI:749556), and GeneReviews evidence (PMID:23193612), added peripheral blood DNA methylation
    episignature analysis (NCIT:C63328) and bone age radiography (NCIT:C137876) to diagnosis, and populated
    differential_diagnoses (Silver-Russell syndrome, 3-M syndrome, SHORT syndrome, Rubinstein-Taybi syndrome).'

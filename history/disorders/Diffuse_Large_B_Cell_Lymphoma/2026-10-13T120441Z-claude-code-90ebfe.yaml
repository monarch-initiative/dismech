  details: |
    Review round 1 on PR 13886. The two PPR:PPR1277683 SUPPORT items on CAR-T Cell Therapy recorded subgroup differences, not support for CAR-T efficacy, so they were removed from the treatment evidence and recorded as effect_modifiers: bulky disease (BASELINE_SEVERITY, SMALLER_EFFECT on overall survival, CROSS_STRATUM_COMPARISON), with a REFUTE item quoting the full text that no factor other than ASCT + CAR-T stayed significant in the multivariable model (Table 3: bulky OS HR 2.310, P = 0.119); and ASCT combined with CAR-T versus CAR-T alone (CONCOMITANT_TREATMENT, LARGER_EFFECT), one entry each for PFS and OS, with the snippet extended to include the CAR-T-alone comparator. 'Followed by' was replaced with 'combined with', since the preprint gives no order or timing. The treatment description now names the investigational HuaDao CD19 CAR product (ChiCTR-OIN-15007668) and the loss of significance after adjustment. interaction_tested left unset because the source reports no interaction test. count-verified-snippets 28/28; just validate passed.

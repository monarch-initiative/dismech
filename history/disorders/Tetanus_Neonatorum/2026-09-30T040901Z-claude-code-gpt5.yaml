  details: |
    Added a standalone neonatal tetanus entry bound to MONDO:0001737 and the Clostridium tetani infectious agent.

    The seed captured the human host lifecycle, contaminated umbilical-stump acquisition, and a pathophysiology chain from umbilical spore contamination through anaerobic germination, local tetanospasmin production, motor-axon uptake, retrograde CNS trafficking, inhibitory-interneuron SNARE cleavage, neonatal spastic paralysis, and the tetanus neonatorum clinical syndrome.


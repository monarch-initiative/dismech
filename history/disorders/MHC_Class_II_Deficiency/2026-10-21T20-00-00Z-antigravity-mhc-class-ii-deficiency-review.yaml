  summary: Enhance MHC Class II Deficiency pathophysiology ontology bindings and downstream phenotype edges
  details: '- Added `GO:0003700` (`DNA-binding transcription factor activity`, for RFX complementation groups B, C, and D) and `GO:0003713` (`transcription coactivator activity`, for CIITA complementation group A) to `MHC-II regulatory gene disruption` with complementation-group-specific description. - Added `CL:0000451` (`dendritic cell`) to `MHC-II expression and antigen presentation failure`. - Added downstream phenotype edges connecting `Abnormal CD4:CD8 ratio`, `Decreased total T cell count`, and `Decreased mitogen-induced T-cell proliferation` from `CD4 T-cell selection and helper-function impairment`; `Panhypogammaglobulinemia` and `Acute otitis media` from `Combined cellular and humoral immune deficiency`; and `Pancytopenia` from `Tolerance perturbation and autoimmunity`.'

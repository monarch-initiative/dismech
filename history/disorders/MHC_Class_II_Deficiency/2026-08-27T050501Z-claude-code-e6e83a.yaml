  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review against all cited references, including the ORPHA:572 structured record and the two full-text-cached papers (PMID:29527204 five-patient Indian series; PMID:34211466 thymic epithelial study).

    BIGGEST GAP: the ORPHA:572 phenotype table. The entry curated 24 of the 38 HPO rows and had taken essentially all the Frequent and Very frequent ones, leaving the Occasional tier uncurated. Added 11 phenotypes from it: Autoimmune hemolytic anemia, Autoimmune thrombocytopenia, Decreased total neutrophil count (with the separate anti-neutrophil-antibody row as corroborating evidence), Pancytopenia, Decreased total T cell count, Abnormal CD4:CD8 ratio, Decreased mitogen-induced T-cell proliferation, Panhypogammaglobulinemia, Acute otitis media, Skin rash. Several are load-bearing rather than filler: the three autoimmune cytopenias are exactly what the existing "Tolerance perturbation and autoimmunity" node predicts, and were wired to it as downstream edges; and the pairing of Occasional "Decreased total T cell count" with Frequent "Decreased proportion of CD4-positive T cells" is the immunophenotypic signature that separates this disorder from a T-B+ SCID. Term note: ORPHA's display string for HP:0031381 is "Decreased lymphocyte proliferation in response to mitogen" but the canonical HPO label is "Decreased mitogen-induced T-cell proliferation"; the canonical label is in term.label and the ORPHA phrasing in preferred_term.

    NEW SECTION - differential_diagnoses. The entry had none, and PMID:29527204 devotes its discussion to one specific and consequential confusion: MHC class II deficiency misread as T-B+ SCID, because absolute B-lymphocyte counts are normal or elevated and TRECs are detectable. Added with four distinguishing features and three evidence items.

    NEW SECTION - clinical_burden (HIGH), with the era dependence made explicit: mean age at death 4 years untransplanted (PMID:8229525), versus 94% overall survival for HCT after 2008 (PMID:31932845).

    DIAGNOSIS. Added a negative diagnostic entry (presence: ABSENT) recording that TREC newborn screening does not detect this disorder - the block is downstream of TCR recombination, so measured TREC levels sit above the screening cut-off. This is stated twice in PMID:29527204 and is corroborated by both SCID-side sources in the sibling entry; it was entirely absent here. Also added the "diagnosis may be confounded unless HLA-DR expression is evaluated" sentence to the flow-cytometry entry, which converts that test from listed to justified.

    PROGRESSION (+3 phases). Later diagnosis in milder presentations up to 15 years of age; progressive viral meningoencephalitis / hepatitis / cholangitis / autoimmune complications; and death in childhood at a mean age of 4 years with overwhelming viral infection as the leading cause. The 30-patient natural-history series (PMID:8229525) was previously cited only for its first-year-of-life onset sentence; its prognosis and complication findings were unused.

    GENETIC. Added Genetic.case_fractions on RFXANK: more than two-thirds of all reported cases, recorded as a lower bound (case_fraction_low = case_fraction_percent = 67) because the source says "more than two-thirds", with the North African founder effect and the notable absence of RFXANK from the reporting cohort itself.

    PREVALENCE. Added a CASES_IN_LITERATURE record (over 150 patients worldwide, about two-thirds of North African descent, Mediterranean and consanguinity clustering), so the ultra-rare worldwide point-prevalence band is not read as a uniform rate. Removed the deprecated free-text percentage field from the existing record, folding its content into notes.

    PATHOPHYSIOLOGY. Added a PARTIAL evidence item recording that class I expression is also inconsistent and incomplete (PMID:8229525) - a real qualification of the node name that no cited evidence carried. Added the isotype/cell-type enumeration sentence supporting the cell types already bound on that node. Added the peripheral-tolerance sentence (defective Treg generation/function and B-cell tolerance breakdown) to the tolerance node, whose description asserted peripheral tolerance while its only evidence covered central tolerance.

    TREATMENTS. The HCT entry described "residual nonhematopoietic thymic epithelial defects" with no evidence for that clause. Added five items: the significantly lower CD4 counts in transplant survivors versus post-transplant disease controls; the PMID:34211466 conclusion that TEC defects limit the potential benefit of transplantation; the dependence of long-term survival on pre-existing viral infection; graft rejection from residual host immunity even under immunosuppression; and the functional outcome (survivors off immunoglobulin, protective tetanus and Hib vaccine responses, no significant infection or autoimmunity).

    Validation: schema pass, terms pass, entity-refs pass, duplicate-keys pass. Snippets 51 -> 108 verified individually; 264/264 in the batched three-file sweep. classifications.iuis_category untouched.

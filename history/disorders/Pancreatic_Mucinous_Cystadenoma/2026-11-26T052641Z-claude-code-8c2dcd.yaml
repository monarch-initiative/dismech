  details: |
    The KRAS record's association read PREDISPOSING, but its notes and evidence describe somatic activating KRAS mutations as the primary driver of pancreatic mucinous cystic neoplasms (50% of low-grade, 100% of high-grade or invasive lesions, PMID:35066614; PMID:28570009). Rewrote the association as a somatic activating driver mutation and typed the record SOMATIC_DRIVER, variant_origin SOMATIC. The 'KRAS-Driven Oncogenesis via MAPK Cascade' node named no gene; it now carries KRAS with GTPase activity DECREASED.

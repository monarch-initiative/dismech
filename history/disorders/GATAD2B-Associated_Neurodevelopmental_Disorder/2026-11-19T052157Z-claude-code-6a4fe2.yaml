  summary: 'Create: GATAD2B-Associated Neurodevelopmental Disorder (GAND)'
  details: |
    Curated from an OpenScientist deep-research run (research/GATAD2B-Associated_Neurodevelopmental_Disorder-deep-research-openscientist.md). The first run of this disorder timed out: it was third in OpenScientist's server-side queue and the job was cancelled at the 3600s client limit having spent most of the hour waiting. Relaunched with --timeout 6600 and it completed. The report is high quality: 34/34 references resolved, 29/29 quotes valid, confabulation_rate 0.0 on both references and terms.

    just preflight-dr returned WARN, not FAIL, and both warnings were checked and dismissed. The second-gene signal was 'CR2' at 52 mentions, which is the GATAD2B conserved region 2 domain and not the complement receptor gene; the heuristic lexicon read it as a gene because no local HGNC build is present. The report's second OMIM number, 614998, is the GATAD2B gene MIM against 615074 for the phenotype, a distinction the report itself calls out.

    Entry name follows the entry-naming skill rather than the MONDO label, which is a string of clinical features. GAND is MONDO's exact synonym and ClinGen's own curation gives 'GAND syndrome, or GATAD2B-associated neurodevelopmental syndrome' as the name in use; that sentence is quoted on the genetic row so the naming decision is sourced rather than asserted. The MONDO label and the MRD18/IDD18 serial designations are kept in synonyms.

    Phenotype frequencies are mostly omitted on purpose, and notes records why. The HPO annotation of OMIM:615074 derives entirely from the 2013 four-patient report, so every frequency-bearing term reads 4/4, and the two features that most distinguish the disorder are missing from it: macrocephaly (53% in the 19-patient cohort) and seizure. Importing those 4/4 figures would have propagated an artifact of a stale annotation. Only macrocephaly carries a frequency band, taken from the cohort paper that states 53%.

    The epilepsy phenotype carries a SUPPORT item from the 50-patient cohort and a REFUTE item from the 19-patient cohort, which found epilepsy uncommon, plus a third SUPPORT item for the published developmental and epileptic encephalopathy case. They are three items rather than one averaged claim because the two cohorts disagree and the disagreement is the finding.

    Not curated from the report: the MTA3-to-Wnt branch, demonstrated only in a non-neuronal stem cell under near-complete knockdown, and the Sufu-Gli/Hedgehog branch, whose relevance to this disorder is untested. The report's NCIT:C38120 for anticonvulsant agent names an unrelated tumour-infiltrating-lymphocyte concept; the entry binds NCIT:C264. Every ontology term was re-derived from OLS.

    One error of my own, caught by validation: GO:0006338 chromatin remodeling was placed in molecular_functions, where it failed the MolecularFunctionTerm enum because it is a biological process. The node now binds GO:0044877 protein-containing complex binding and GO:0042393 histone binding as molecular functions, which is also a more precise statement of what p66-beta does.

    Both model-organism gene bindings (MGI:2443225 Gatad2b, FB:FBgn0010762 simj) were read from the NCBI Gene records' own Gene-ref_db blocks rather than written from memory, after that failure mode produced three wrong MOD identifiers earlier in this session. just check-gene-namespaces-online confirms both.

    A first pass left the six facial-gestalt phenotypes and strabismus as a disconnected island at 53.8% connectivity. Rather than leave them unexplained, a Craniofacial and Ocular Developmental Patterning Defect node was added downstream of the NuRD uncoupling node, with every edge marked INDIRECT_UNKNOWN_INTERMEDIATES and the node's own description stating plainly that no craniofacial mechanism has been demonstrated for this gene and that the inference rests on the gestalt's consistency and its overlap with the CHD3 and CHD4 NuRDopathies.

    Validation: just validate-disorders passed (44 snippets, 46 titles, 0 issues); just validate-terms passed; check-snippet-grading, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, qualifier-terms, coarse-phenotypes, logical-rules, delivery-system, gene-namespaces-online and shared-disease-terms all clean. just check-genereviews --online reports NO_CHAPTER for the disorder and for GATAD2B. 13 of 13 phenotypes causally connected.

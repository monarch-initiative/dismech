  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #18444. All nine IMPORTANT items taken, plus all four suggestions.

    The blocking finding is mine and is the serious kind. The entry's notes claimed frequencies were left out because no cohort paper states them. PMID:31949314 is cached as full text and contains a quotable '## Table 1. Phenotypic Findings' with frequencies for nearly every phenotype. I asserted a negative existence claim without checking the cache, which is exactly the failure CLAUDE.md's rule about re-running the search a note claims describes. The phenotype block was rewritten from 13 to 29 phenotypes, every frequency quoting its Table 1 row or the text sentence as the snippet, and the notes paragraph now says where the frequencies come from and why the HPO 4/4 annotation is still not imported.

    Added from the cohort text and table: neonatal feeding difficulties 82%, polyhydramnios 42.2%, wide-based gait 91.1%, abnormal MRI 60% split into ventriculomegaly 35.6% and white matter abnormality 22.2%, astigmatism 41.3%, hypermetropia 30.4%, myopia 21.7%, anisocoria 13.6%, bicuspid aortic valve 10%, prominent/bulbous nasal tip 83.8%, prominent supraorbital ridges 62.2%, posteriorly angulated ears 59%, down-slanting palpebral fissures 45.6%, drooling, long fingers and sparse hair. Macrocephaly now carries both the 91.8%-at-assessment and 60.4%-at-birth figures, which makes the partly postnatal onset visible. Seizure carries 24% overall, the 57% missense enrichment, the 19-patient cohort's REFUTE, and the DEE case.

    Pathograph wiring. Seizure was a consequence of Impaired Learning and Behavioural Abnormality, which is not a cause of seizures; it now descends from Abnormal Cortical Patterning along with the MRI findings and the gait. Infantile Hypotonia and Macrocephaly Development were pathophysiology islands with no upstream edge; both are now reached from the cortical node with the same INDIRECT_UNKNOWN_INTERMEDIATES hedge the craniofacial node uses, and each node's description says the mechanism is not established. A new Cardiac Outflow Tract Patterning Defect node carries the bicuspid aortic valve on the same footing. Treatment target_mechanisms were pointing at the learning node while their own descriptions said otherwise: antiseizure medication now targets Seizure, speech therapy targets the two speech phenotypes.

    The antiseizure description overstated drug resistance. The cohort reports 75% (8/12) well controlled, which is now the main evidence item; the DEE case is presented as the exception.

    The inheritance description claimed parental mosaicism with no evidence for it; the cohort sentence reporting 96% de novo and two mosaic-inherited variants is now cited.

    Management was missing entirely, and with no GeneReviews chapter the cohort's recommendation paragraph is the closest thing to a baseline. Added Multidisciplinary Surveillance at Diagnosis and Physical and Occupational Therapy rows, both quoting that recommendation. NCIT:C15719 Surveillance, NCIT:C41188 Consultation and NCIT:C53607 Patient Monitoring are all outside the TreatmentActionTerm enum; NCIT:C124351 Clinical Evaluation is inside it and is what the surveillance row binds.

    PMID:31737996 is a review, so both items citing it moved from quote_role PRIMARY_RESULT to REVIEW_SYNTHESIS.

    Suggestions taken: the misexpression node's description now states that binding the lesion as loss of repression is a simplification of bidirectional misexpression, and that the neuron binding is a generalisation because the sequencing was of whole embryonic cortex including progenitors; the CR1 mislocalisation sentence is marked as an inference from the MBD2 dependence rather than a measured patient result; and the variant-class breakdown plus the missense/epilepsy difference are now on the genetic row.

    One error of mine inside this round: the phenotype rewrite dropped the Deeply set eye phenotype while the craniofacial node still named it, which just check-causal-targets caught as a dangling target. The phenotype was restored from the 19-patient cohort quote. A second was caught before it was written: a replacement asserted its target and failed, because the PMID:39976362 reference_title I typed was shorter than the cached one; after the fix every reference_title was re-normalized programmatically from the cache rather than typed.

    Validation after the round: just validate-disorders passed (76 snippets, 78 titles, 0 issues); just validate-terms passed; snippet-grading, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, qualifier-terms, coarse-phenotypes, logical-rules and cache-order all clean. 29 of 29 phenotypes causally connected.

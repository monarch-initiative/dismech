  details: |
    Fixes the two whole-repo gates failing on this branch. Both are listed in CLAUDE.md's whole-repo gate set; neither was run before the PR was opened.

    check_gene_activity_grounding. GATAD2B reached only 'De Novo Heterozygous GATAD2B Lesion', a genomic node asserting the lesion. The molecular functions were already bound one node downstream on 'Failure of NuRD Bridging by p66-beta' (GO:0044877 protein-containing complex binding and GO:0042393 histone binding, both DECREASED), so the fix is a genes: descriptor for GATAD2B on that node, which dismech.graph auto-links to the genetic entry. The claim is true independently of the gate: that node is about p66-beta's own binding, which is what its description and evidence already state. Binding a molecular function on the lesion node instead would have misdescribed a genomic claim as a molecular-activity one.

    check_snippet_length. The Downslanted palpebral fissures phenotype quoted 'down-slanting palpebral fissures (45.6%)', four words, which carries no proposition on its own. Extended to the neighbouring span of the same sentence, 'ocular hypertelorism (78.4%), down-slanting palpebral fissures (45.6%), epicanthal folds (29.7%)', verified as an exact substring of the cached PMID:31949314 full text. This matches how the sibling dysmorphology phenotypes in this entry already quote that sentence, in spans of two or three items rather than single cells. The frequency the phenotype asserts is unchanged.

    Re-ran after the edits: both gates clean; validate-disorders passed with 81 snippets and 83 titles, 0 issues, unchanged from the approved revision; gene-namespaces, folded-hyphens, folded-yaml, block-scalar-comments, entity-refs, causal-targets, name-collisions, duplicate-keys, enum-values, logical-rules, reference-titles, snippet-grading and cache-order all clean.

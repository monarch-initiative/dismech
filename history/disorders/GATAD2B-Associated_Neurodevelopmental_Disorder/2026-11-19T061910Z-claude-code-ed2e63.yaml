  summary: 'Review round 2: short philtrum frequency and three more dysmorphology
    features; record why long fingers is absent'
  details: |
    Addresses the second ai4c-reviewer review on PR #18444. Both IMPORTANT items and both suggestions taken.

    Item A is the same mistake as round 1's item 1, in a smaller place, and that is the part worth recording. After being corrected for claiming no cohort paper states frequencies, I wrote in the replacement text that the 50-patient cohort did not score short philtrum. It does: the dysmorphology results paragraph gives short philtrum 51.3%. I checked Table 1 and stopped there, rather than searching the full text for the feature itself; Table 1 does not list short philtrum but the results prose does. The lesson is that correcting a negative-existence claim is not the same as checking the replacement, and the same grep that found the table should have been run per feature.

    Short philtrum now carries frequency FREQUENT with the dysmorphology sentence quoted. The same sentence gave three further features over 10% that were also missing, all now added with frequencies from one quote each: wide nasal base 35.1% (HP:0000431 Wide nasal bridge), epicanthal folds 29.7% (HP:0000286 Epicanthus) and small recessed jaw 24.3% (HP:0000347 Micrognathia). Every label was read from OLS rather than taken from the review, as it asked. All four are wired off the craniofacial node with the same INDIRECT_UNKNOWN_INTERMEDIATES hedge.

    Item B, long fingers. It is in the MONDO label and in the OMIM title the label derives from, and the review was right that it should not silently drop out. It is not curated, because no cached source supports it: the strings 'long finger', 'long toe', 'arachnodactyly' and 'digit' appear in none of PMID:23644463, PMID:31949314, PMID:32688057, PMID:28077840, PMID:38238293 or PMID:39976362. The 2013 founding report is cached as abstract only, so if its tables score the feature they are not reachable from here, and the two cohorts that scored dysmorphology in detail do not list it. notes now says that, names the searches, and says a curator with the 2013 full text can add it. The alternative would have been to bind a phenotype on the authority of a disease label, which is what the label-versus-entry rule in the entry-naming skill warns against.

    Both suggestions taken: the Broad forehead phenotype now also quotes the cohort's own wording, a high wide forehead with frontal bossing, so the claim matches a quote rather than only the terser table row; and the multidisciplinary surveillance row now targets the three refractive-error phenotypes as well as strabismus and the bicuspid valve, which is what its own description implies.

    Validation after the round: just validate-disorders passed (81 snippets, 83 titles, 0 issues); just validate-terms passed; check-duplicate-keys, snippet-grading, entity-refs, causal-targets, name-collisions, enum-values, coarse-phenotypes, logical-rules and cache-order all clean. 32 of 32 phenotypes causally connected.

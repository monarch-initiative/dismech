  summary: 'Create: RFT1-congenital disorder of glycosylation (RFT1-CDG, CDG-In)'
  details: |
    New Disease entry for RFT1-CDG (MONDO:0012783), claimed via issue #9216.

    Lump/split decision: DISEASE. The stub carried one causal gene (hgnc:30220 RFT1) and no MONDO descendants, and the duplicate preflight against origin/main found no existing entry or grouping covering MONDO:0012783 or the RFT1-CDG label.

    Mechanism curated as a five-node chain: RFT1 loss of function -> block in transbilayer completion of the lipid-linked oligosaccharide -> accumulation of the truncated Man5 intermediate -> protein N-hypoglycosylation -> multisystem neurological and sensory disease.

    Deliberate epistemic choice: RFT1 is widely described as the flippase for Man5GlcNAc2-PP-dolichol, but PMID:39025454 reports that flipping proceeds without Rft1 in microsomes and in reconstituted proteoliposomes, and that at least one eukaryote does not require it for viability. The entry therefore does NOT assert the flippase role. The pathophysiology chain states only the step that fails (well evidenced), while the two readings are carried as competing mechanistic_hypotheses (rft1_flippase_model CANONICAL vs rft1_non_flippase_essential_role ALTERNATIVE) plus an open KNOWLEDGE_GAP discussion. A second KNOWLEDGE_GAP records probable ascertainment bias toward severe presentations.

    No treatments block: no therapy beyond supportive and anticonvulsant care is established, and curating one would require evidence that does not exist.


  summary: 'Gene-family review: RFT1; relationship typed UNKNOWN (ClinGen Moderate)'
  details: |
    The RFT1 record was CAUSATIVE while the ClinGen tier it already recorded for this disease (MONDO:0012783) is Moderate. CAUSATIVE is reserved for Definitive or Strong validity, so the record is now UNKNOWN with a note, matching the KB convention for ClinGen Moderate pairs. The RFT1 node binds intramembrane lipid carrier activity (GO:0140303) as decreased; this was re-checked against the 2024 reconstitution showing purified Rft1 translocates Man5GlcNAc2-PP-dolichol across a bilayer (PMID:38886340) and the 2026 mutagenesis study proposing that M5-DLO binding, more than scrambling, is the essential cellular role (PMID:42417535). The entry already cites both and states the open question, so the binding was left unchanged.

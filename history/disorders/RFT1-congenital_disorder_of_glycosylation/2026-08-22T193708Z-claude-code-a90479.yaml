  details: |
    Addressed the automated review on PR #9261. Added six phenotypes that were absent: generalized hypotonia (HP:0001290, VERY_FREQUENT - reported in all six described children), feeding difficulties (HP:0011968, VERY_FREQUENT), microcephaly (HP:0000252, subset), progressive cerebral atrophy (HP:0002059, clinical_course PROGRESSIVE on the descriptor, with a note contrasting it against the separately curated pontocerebellar hypoplasia since the serial-MRI patient had explicit cerebellar sparing), deep venous thrombosis (HP:0002625) and hepatomegaly (HP:0002240). Mined PMID:19701946, which was listed in references, cached as full text, and cited by zero evidence items: it now supports the DNase 1 secretion functional assay and its wild-type-cDNA rescue arm on the Protein N-Hypoglycosylation node, the two novel alleles p.K152E and p.E298K, the luminal-loop localization of the early allele set, the possible p.R67C founder effect, and - dated 2009, fifteen years before the reconstitution work - the accessory-role statement supporting the ALTERNATIVE non-flippase hypothesis. Expanded the genetic notes with the full allele spectrum (nine alleles across four papers), the all-missense biallelic variant class, and the caveat that p.G340S sits in a transmembrane helix so luminal-loop localization is a tendency rather than a rule. Corrected 14 wrong reference_title lines: 11 for PMID:19701946 (introduced in this session by reconstructing the title from memory rather than reading the cache) and 3 pre-existing ones for PMID:23111317, whose real title is 'RFT1-CDG in adult siblings with novel mutations'. Added the deep-research artifact the review asked for (falcon provider), with its Reference Validation section (9/9 resolved, 0 unresolved, 0 off topic) and an NEC preflight against MONDO:0012783 returning WARN only because the report cites the RFT1 gene MIM 611908 alongside the disease MIM 612015; gene mentions are RFT1=68 against 2 for the next gene. Validation: linkml-validate clean, linkml-term-validator passed, 64/64 snippets verified against cached references (was 49/49), all five ungated gates clean.

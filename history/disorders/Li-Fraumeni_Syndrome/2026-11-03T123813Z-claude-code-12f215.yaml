  summary: 'Review round 2: a MONITORING action may not carry target_phenotypes'
  details: |
    The reviewer identified the defect that had ejected this pull request from the merge queue twice, and that two rebases had not touched because it was never a rebase problem.

    The Neuroblastoma Surveillance treatment carried action_category MONITORING together with a target_phenotypes block. The check check_non_therapeutic_actions_do_not_use_treatment_targets in tests/test_data.py rejects that combination: target_phenotypes and target_mechanisms draw a treats edge in the pathograph, and a surveillance schedule finds a tumour rather than treating it. The target_phenotypes block is removed and the action category is unchanged. Nothing is lost by the removal, because a treats edge never counted toward causal connectivity and the treatment description already names what is screened for.

    Why this was missed. The test runs in the python pytest lane, which continuous integration selects by changed path, so a pull request touching only kb/ skips it while the merge queue runs it. The pre-push gate set used for this series ran eighteen checks, every whole-repository check script, and reference and term validation, but not pytest, so the entry passed every local gate and the queue rejected it three times. Worse, the existing Weaver_Syndrome surveillance row, which this treatment was modelled on, carries no target_phenotypes block at all; the block was added here on the curator's own initiative rather than copied, and copying the working pattern exactly would have avoided the defect.

    The gate script memory/newpr_saved/scripts/run_c4.sh now runs tests/test_data.py filtered to the changed entries as a nineteenth gate, so the same class of failure cannot reach the queue again from this series.

    Validation: all 19 gates pass, including the new pytest lane. 58 of 58 snippets verify.

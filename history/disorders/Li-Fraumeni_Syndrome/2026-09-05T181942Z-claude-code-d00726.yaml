  summary: Record why the coarse HPO binding is coarse (NO_HPO_TERM)
  details: |
    Declared coarse_binding_basis: NO_HPO_TERM plus a term_gap record on the Multiple Primary Cancers phenotype, which binds HP:0002664 (Neoplasm) while its preferred_term claims the narrower concept of multiple primary malignant neoplasms. The entry's notes already argued this; the slots make it queryable and record what was searched. Confirmed against OLS that HPO carries no term for neoplasm multiplicity as such: searches for multiple primary, metachronous and second primary malignancy return nothing, and the closest descendants named in the notes (HP:0007606, HP:0033714) are anatomically restricted. No term request has been filed yet, which term_gap says explicitly rather than implying one exists. Validated with linkml-validate, check_coarse_phenotypes, check_duplicate_yaml_keys, check_enum_values, check_entity_refs and check_causal_targets.

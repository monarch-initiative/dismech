  summary: Add neuroblastoma risk and its surveillance recommendation
  details: |
    Li-Fraumeni syndrome had no neuroblastoma content, although the 2017 AACR Childhood Cancer Predisposition Workshop recommends neuroblastoma surveillance for the syndrome when the germline TP53 variant is p.R337H. Added one Neoplastic phenotype, Neuroblastoma Predisposition, bound to HP:0003006, and one MONITORING treatment, Neuroblastoma Surveillance, bound to NCIT:C15406 and targeting that phenotype.

    Three evidence items, all from references already cached in the repository. The Brazilian single-institution series in which 7 of 83 children with neuroblastoma carried p.R337H (PMID:26452166) is graded SUPPORT, DIRECT, PRIMARY_RESULT, HUMAN_CLINICAL. Two sentences of the AACR review (PMID:28674118) are used: the statement that cases have been reported although neuroblastoma is not a classic Li-Fraumeni tumour, graded SUPPORT, INDIRECT, REVIEW_SYNTHESIS, HUMAN_CLINICAL, and the surveillance recommendation itself, graded SUPPORT, REVIEW_SYNTHESIS, OTHER. All three gradings and snippet strings are copied from the matching records already in Neuroblastoma.yaml, which carries the same claim from the germline side, so the two entries cannot disagree about the same sentence.

    No frequency is recorded on the phenotype. Neither source measures how often neuroblastoma occurs in Li-Fraumeni syndrome: the Brazilian series measures the reverse share, and the review counts reported cases. The phenotype description says so, and also records that the two sources are not independent, since the review cites that same series. The treatment description records that the recommendation is specific to p.R337H rather than to germline TP53 variants generally, and that the review says it is unclear whether other variants raise the risk.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-cache-order, check-logical-rules, check-qualifier-terms and validate-terms. 58 of 58 snippets verify against the cached references.

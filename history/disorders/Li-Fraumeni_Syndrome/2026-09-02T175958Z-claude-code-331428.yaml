  details: |
    Assessed kb/hypotheses/Li-Fraumeni_Syndrome/canonical_tp53_loss_genome_instability_multitumor_model/openscientist.md (verdict SUPPORTED; sidecar openscientist-assessment-by-claude-opus-5.yaml, 15 claims) and integrated its RETAINED/QUALIFIED findings. Added: PMID:34240179 evidence on the Loss of Heterozygosity (Second Hit) node quantifying LOH at 96.0% in core LFS spectrum tumors vs 45.5% in other tumors, plus a description sentence recording that the second hit is spectrum-dependent rather than absolute; PMID:15607980 (MODEL_ORGANISM) on the Mutant p53 Stabilization and Gain-of-Function node, the knock-in-mouse basis for allele-specific spectra that the node previously lacked; PMID:11498785 on Tumor Development for the tissue-selectivity claim its description already made unsourced; a new pathophysiology node Loss of cGAS/STING Innate Immune Activation bound to GO:0140896 (modifier DECREASED) with an incoming edge from TP53 Tumor Suppressor Loss and an outgoing edge to Tumor Development, evidence PMID:36638783 (IN_VITRO); PMID:21990040 evidence on the Choroid Plexus Carcinoma phenotype and PMID:29300620 on the Leukemia phenotype, both of which previously carried no evidence at all, with the Leukemia description extended to cover the hypodiploid ALL association; PMID:19542078 on genetic TP53 supporting the PIN3 and MDM2 SNP309 modifier claims the notes already asserted uncited, with the Brazilian cohort and subgroup sizes stated; PMID:34240179 plus a notes extension on biochemical TP53 Genetic Testing recording clonal-hematopoiesis and mosaic misclassification of blood-detected variants and under-ascertainment by phenotype-based criteria. Added a discussions block (the entry had none): lfs_tissue_specificity_mechanism, lfs_blood_tp53_variant_interpretation, lfs_metformin_mechanism_unresolved (all KNOWLEDGE_GAP) and lfs_cgas_sting_human_validity (HUMAN_MODEL_MISMATCH). Qualified the Choroid Plexus Carcinoma description from an unsourced 'approximately 50%' to 'roughly 36-50% of tested CPC patients across small single-centre series'. Deliberately unchanged: hypothesis status stays CANONICAL, as the report itself recommends; no ferroptosis edit, since that arm is already curated from PMID:25799988 and the report's stronger 'canonical effectors may be dispensable' framing rests on a xenograft readout; nothing added from PMID:17401424, which the report cites for gain of function although the paper attributes onset to loss of transactivation and states GOF data are too scarce to assess; the Brazilian R337H proportions were not tightened, since the report's '100% of CPCs carry R337H' is 2 of 2 cases; and the lung-cancer spectrum boundary was left alone, with the disagreement between PMID:11498785 and the pedigree analysis already cited in the entry recorded in the tissue-specificity discussion instead. Every snippet was re-derived from references_cache rather than copied from the report. Verified with count-verified-snippets (51/55, 4 skipped by prefix, no failures), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-folded-hyphens, all passing.

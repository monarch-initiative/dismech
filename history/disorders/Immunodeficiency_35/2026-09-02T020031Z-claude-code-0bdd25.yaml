  summary: 'Create: Immunodeficiency 35 (complete TYK2 deficiency, MONDO:0012682)'
  details: |
    De novo curation of immunodeficiency 35 (TYK2) from the stubs/ queue, claim issue #10463. entry_type recorded as DISEASE: one conserved pathograph in which loss of a single shared Janus kinase disables four cytokine circuits, producing two coherent branches (type I interferon -> antiviral failure; IL-12/IL-23 -> deficient interferon-gamma induction -> inadequate macrophage control).

    Scope decision, and the main risk on this disease: the entry covers COMPLETE TYK2 deficiency only. Three literatures a TYK2 search returns were screened out rather than used - TYK2 as an autoimmune GWAS locus, TYK2 as a pathway member in unrelated entries (it already appears in Ankylosing_Spondylitis, Dermatomyositis, Down_syndrome and Interleukin-10_Receptor_Deficiency), and the deucravacitinib/TYK2-inhibitor literature. Every citation was checked to be about a patient, cell or mouse carrying biallelic complete loss. The common hypomorphic P1104A allele is cited exactly twice and only in that role: as a named differential diagnosis, and inside the boundary knowledge gap. PMID:30578352 (Boisson-Dupuis 2018) is the only P1104A paper cited and it is never used to support a claim about complete deficiency.

    Gene-frequency preflight passes on this disease without discriminating, as the claim issue warned, so the check was done citation by citation instead. preflight-dr PASS against MONDO:0012682 (TYK2 mentioned 97 times, OMIM 611521 matches).

    Boundary curated as a KNOWLEDGE_GAP rather than resolved by assertion: PMID:36094518 shows impaired IL-23-dependent interferon-gamma induction is the ONE mechanism shared by all five forms including P1104A, so for the mycobacterial phenotype the spectrum is mechanistically continuous. The entry keeps the two apart on the extra pathways lost in complete deficiency and on the IUIS nosology listing them as separate rows, and records in the gap that nobody has tested whether the mycobacterial disease differs in kind once exposure is matched.

    Deep research: Falcon report research/Immunodeficiency_35-deep-research-falcon.md, which had independently scoped itself to complete deficiency. Used as leads; all 73 snippets verified against cached references.

    Validation (all exit 0): just validate (schema, terms, 73/73 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets. Two drafting errors were caught and fixed: treatment_effect CORRECTS does not exist in TreatmentEffectEnum (used RESTORES), and NCIT:C68931 resolves to Teglarinad Chloride, not Mepolizumab (used NCIT:C157376). HP:0002728 was bound with the repo cache label 'Chronic mucocutaneous candidiasis'; current OLS gives 'Recurrent mucocutaneous candidiasis', and the cache label was kept for consistency with the rest of kb/.

    Not curated: no prevalence rate (the only frequency statement is an order-of-magnitude comparison, so prevalence_class ULTRA_RARE with CASES_IN_LITERATURE), no biochemical block, no datasets or trials.

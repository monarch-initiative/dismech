  summary: 'Review round: wire phenotypes, re-source IUIS rows'
  details: |
    Wired four phenotypes into the pathograph with evidenced edges: Inadequate Macrophage Control of Intramacrophagic Pathogens to Mycobacterial disease and BCG disease, Failure of Cell-Intrinsic Antiviral Defence to Severe or recurrent viral infection, and Impaired IL-12 and IL-23 Signaling to Mucocutaneous candidiasis (with the non-penetrance caveat in the edge description). Phenotype connectivity rose from 0/6 to 4/6; notes record why the normal-immunophenotype and hyper-IgE phenotypes stay unconnected. Added MAIT (CL:0000940) and gamma-delta T cell (CL:0000798) bindings to the interferon-gamma node with the single-cell IFNG sentence from PMID:36094518, and dosing_interval per month / 30 days on mepolizumab. After merging main the three IUIS 2022 table-row snippets (PMID:35748970) no longer verify: the cache has no extractor_version, so the validator re-fetches the PMC XML, which lacks the tables. They were replaced with PMID:36094518 (P1104A IL-23-restricted defect) and PMID:40949057 (Salmonella susceptibility), and the notes paragraph about PDF-extraction artefacts was removed.

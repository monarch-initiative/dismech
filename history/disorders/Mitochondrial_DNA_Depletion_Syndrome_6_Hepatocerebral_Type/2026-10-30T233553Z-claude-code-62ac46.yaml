  summary: Add canine and yeast models, MCT diet and cofactor treatments
  details: |
    Follow-up to the three optional reviewer suggestions on PR 15842, all leads from the committed OpenScientist report. Added the naturally occurring canine MPV17 c.279insG truncation (PMID:26353863, full text) as an animal model: RECAPITULATES MPV17 loss of function (lymphocyte mRNA halved in homozygous dogs; truncated protein absent in transduced fibroblasts) and FAILS_TO_RECAPITULATE liver failure and peripheral nerve involvement, with typed SPECIES_MISMATCH, TEMPORAL_SCOPE and PROXY_QUANTITY divergences recording that the negative result rests on owner-reported health records and that liver and muscle mtDNA were not measured. Added a HUMAN_MODEL_MISMATCH discussion on why MPV17-null mice and dogs escape liver failure. Added the yeast SYM1 strains (PMID:30273399, PMID:34830106, full text) as an experimental model: patient missense alleles fail complex assembly, sym1-null mitochondria lose all four dNTPs, and ten repurposed drugs raise mitochondrial dTTP and reduce petite formation by a Sym1-independent bypass. Added an MCT-based diet and a coenzyme Q10/carnitine supplementation treatment from a four-infant case series (PMID:36753038, abstract only), marked INDIRECT because the series is uncontrolled. Validated with just validate, count-verified-snippets (141/141) and validate-terms.

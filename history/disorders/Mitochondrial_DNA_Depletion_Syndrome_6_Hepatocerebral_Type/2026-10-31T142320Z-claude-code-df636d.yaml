  summary: Regrade canine paralogue search; ground yeast rescue on petite frequency
  details: |
    Two non-blocking review suggestions from PR 16104. The PMID:26353863 sentence reporting no MPV17 paralogue in the dog genome describes a bioinformatic sequence search, so its evidence_source in the mpv17_null_animals_without_liver_failure discussion changes from MODEL_ORGANISM to COMPUTATIONAL. The yeast experimental model's RESCUES link to Aberrant mtDNA Integrity was grounded by a mitochondrial dTTP-pool readout, which measures the deoxynucleotide node rather than mtDNA integrity; it is replaced by a petite-frequency readout (DECREASED) quoting the PMID:34830106 results in the sym1R51W and sym1-null strains. The dTTP finding remains in the link's own evidence. Validated with just validate and count-verified-snippets (142/142).

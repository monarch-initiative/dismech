  details: |
    Responded to the 2026-10-28 review. Item 2: removed GO:0030302 deoxynucleotide transport from Mitochondrial Deoxynucleotide Insufficiency, because the entry itself says MPV17 has not been shown to transport a deoxynucleotide. The node now binds the measured deficit as chemical_entities dGTP (CHEBI:16497) and dTTP (CHEBI:18077) with modifier DECREASED, backed by the Mpv17-/- liver dNTP measurement from PMID:26760297, and a node note explains the choice. GO searches for l~dNTP homeostasis and l~dNTP metabolic returned nothing; the deoxyribonucleotide/deoxyribonucleoside triphosphate metabolic process terms describe a rate of metabolism, not a pool level, so they were not used. Item 3: bound therapeutic_agent CHEBI:17172 2'-deoxyguanosine, CHEBI:15698 2'-deoxycytidine and CHEBI:17256 2'-deoxyadenosine (labels from OLS) on Deoxynucleoside Supplementation, cited the two full-text sentences naming them, and removed the curation-process sentence from the description. Item 4: added the GeneReviews sib-risk sentence (PMID:22593919) to the inheritance block. Item 1, a deep-research run, was not done in this session and remains for the author. Validation: just validate passes, 101/101 snippets verified, entity-ref, causal-target, duplicate-key, logical-rule, snippet-length, snippet-grading and term-cache integrity checks clean.

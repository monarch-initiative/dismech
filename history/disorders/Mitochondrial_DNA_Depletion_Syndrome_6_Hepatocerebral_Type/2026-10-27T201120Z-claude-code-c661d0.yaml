  summary: 'Create: Mitochondrial DNA Depletion Syndrome 6 (Hepatocerebral Type)'
  details: |
    New entry for MPV17-related hepatocerebral mtDNA depletion syndrome (MONDO:0009747), claimed in issue 15765. Entry type decided as DISEASE: a MONDO leaf with one causal gene and no existing KB entry; MPV17 isolated axonal neuropathy is already the CMT2EE subtype of Charcot-Marie-Tooth_Disease_Type_2 and is cross-referenced rather than repeated. Navajo neurohepatopathy (homozygous p.R50Q) and the rare later-onset neuromyopathic form with multiple mtDNA deletions are recorded as has_subtypes. Pathograph runs MPV17 loss of function -> mitochondrial dGTP/dTTP insufficiency -> liver-predominant mtDNA depletion -> combined respiratory chain deficiency -> hepatocellular injury and liver failure and fasting hypoglycaemia, with a branch to ribonucleotide misincorporation and multiple deletions for the neuromyopathic form. Literature was found by a PubMed search for MPV17 in title/abstract and selected from the GeneReviews chapter (PMID:22593919), the 2006 discovery papers, the 2018 100-patient review, mechanism papers (dNTP measurement, channel electrophysiology, folate/uracil, rGMP incorporation), the Mpv17 knockout mouse and mpv17 zebrafish, South African founder-allele, imaging and zidovudine-exposure studies, and a UK liver-centre series. ClinGen's Definitive classification is for lumped mitochondrial disease (MONDO:0044970), so it is cited for inheritance only and no gene_disease_validity tier is recorded. ORPHA:255229 was not cited because the Orphadata bulk files were not available locally. The ECTO search for zidovudine returned nothing; ECTO:2000062 exposure to antiretroviral therapy is bound. Validated with just validate (schema, 97/97 snippets, terms) and validate-terms.

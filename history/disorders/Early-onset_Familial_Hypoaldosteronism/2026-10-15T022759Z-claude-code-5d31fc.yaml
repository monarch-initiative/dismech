  summary: 'Create: Early-onset_Familial_Hypoaldosteronism'
  details: |
    New entry for early-onset familial hypoaldosteronism (aldosterone synthase deficiency, MONDO:0035320), CYP11B2 (hgnc:2592), claim issue #14253. Deep research was attempted with the falcon provider (with --fallback) but failed with an Edison authentication error, so the literature was searched directly in PubMed. Twelve PMIDs were fetched into references_cache and cited with exact abstract snippets (40/40 verified). CMO I (MONDO:0008751) and CMO II (MONDO:0012524) are recorded as has_subtypes; MONDO models them as siblings of MONDO:0035320 under familial hypoaldosteronism, which the entry notes. Pathograph: CYP11B2 loss of function -> impaired zona glomerulosa aldosterone biosynthesis -> renal sodium wasting and potassium retention -> hyponatremia, hyperkalemia, dehydration, metabolic acidosis, renal salt wasting, failure to thrive and compensatory renin elevation; 8 of 9 phenotypes connected (vomiting left unwired). Treatments: fludrocortisone (CHEBI:50885) and sodium chloride (CHEBI:26710) under NCIT Pharmacotherapy. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and validate-disorders, all passing. The stubs for this disease and for the two CMO subtypes were removed.

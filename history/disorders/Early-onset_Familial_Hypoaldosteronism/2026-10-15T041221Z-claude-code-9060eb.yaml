  summary: Reconcile OpenScientist deep research; add prevalence, diagnosis and differential
    diagnoses
  details: |
    Deep research for this entry: a first OpenScientist run timed out and produced no report; an Asta run was off-topic and was not committed. A second OpenScientist run (15/15 references resolved) is committed under research/ and was cross-checked against the entry. Added from it: (1) a BIRTH_PREVALENCE record for CMO II in Jews of Iranian origin, 1 in 4000 births (rate_per_100000 25.0, BAND_1_5_PER_10000), PMID:8481357; (2) three diagnosis rows: the Japanese national clinical and laboratory diagnostic criteria (PMID:41905953), multisteroid profiling with the 18-OH-corticosterone to aldosterone ratio (PMID:22931312), and CYP11B2 genetic testing with the CYP11B1 homology caveat (PMID:39700478, PMID:22931312); (3) differential diagnoses for pseudohypoaldosteronism type 1 (MONDO:0019161) and salt-wasting 21-hydroxylase deficiency (MONDO:0017839), quoted from the full text of PMID:41905953. Not taken: the report's HP:0011046 and UBERON:0001228 suggestions, which the report's own term validation shows resolve to unrelated terms (incisor agenesis, renal papilla); the under-1-percent residual activity threshold (PMID:15134805, already cited elsewhere in the entry) and enzyme structure, dexfadrostat and fission-yeast assay papers (PMID:37827219, PMID:21237269), which add no disease-level claim the entry lacks; the aldosterone synthase-deficient mouse (PMID:20624970), whose cited use is renal kallikrein physiology rather than a model of this disease; and the report's inferred mineralocorticoid receptor to ENaC step, which it flags as inferred and which the entry already covers. All 53 snippets verified; validate-disorders passed.

  details: |
    Added Harrison's (ENDOCRINOLOGY_METABOLISM, KIDNEY_URINARY_TRACT, GENETICS_ENVIRONMENT_DISEASE) and ICIMD (steroid_hormone_metabolism) classifications; integrated Orphanet ORPHA:556030 (exact MONDO:0035320 match, worldwide prevalence, CYP11B2 validity, HPO frequency bands across 7 phenotypes, and new Hypotension and Feeding difficulties phenotypes); structured germline CYP11B2 CMO I/II variants; enriched adrenal zona glomerulosa, distal nephron, and juxtaglomerular GO/CL/UBERON groundings with 100% phenotype connectivity; and typed mineralocorticoid and sodium chloride treatments.

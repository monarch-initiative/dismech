  summary: 'Review round 1 (series-045): Inborn_Disorder_of_Methionine_Cycle_and_Sulfur_Amino_Acid_Metabolism'
  details: |
    Review round 1 on PR #12817. Rebound the GNMT liver-enzyme phenotype from HP:0031956 Elevated circulating aspartate aminotransferase concentration to HP:0002910 Elevated circulating hepatic transaminase concentration, renaming the phenotype and the matching bare-name downstream target on the GNMT S-Adenosylmethionine Disposal Block node in the same edit. Neither cited source names a specific enzyme: PMID:27207470 says "elevation of aminotransferases" and PMID:14739680 says "elevated serum liver transaminases", so the narrower AST binding asserted a specificity the sources do not carry. The phenotype and edge descriptions now say why the generic term is used. Also recorded in the GNMT genetic record why it is typed CAUSATIVE while TLL1 in Atrial_Septal_Defect, at the same ClinGen Limited grade, is typed UNKNOWN: the GNMT reports measure enzyme activity in a homozygous patient and identify the blocked step metabolite by metabolite, where the TLL1 report has genotypes with no segregation and no functional assay. Moved the Halitosis phenotype from category Metabolic to Oral, the system the finding belongs to rather than the system its mechanism belongs to.

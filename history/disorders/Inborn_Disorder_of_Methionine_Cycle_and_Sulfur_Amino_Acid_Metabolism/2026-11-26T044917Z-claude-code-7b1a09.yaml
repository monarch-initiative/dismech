  summary: 'Gene-family review: MAT1A, GNMT, MMACHC, MTHFR (+ CBS, CTH, SELENBP1 typing)'
  details: |
    Genetic records were typed and given ClinGen tiers only where the ClinGen MONDO term is the subtype term bound in this entry. MAT1A (MAT I/III deficiency, MONDO:0009607), MMACHC (cblC disease, MONDO:0010184), MTHFR (MONDO:0009353), CBS (classic homocystinuria, MONDO:0009352) and CTH (cystathioninuria, MONDO:0009058) are ClinGen Definitive and are now CAUSATIVE, germline, subtype-scoped, with the tier recorded from their CGGV records. GNMT (ClinGen Limited) and SELENBP1 (ClinGen Moderate) were typed CAUSATIVE and are now UNKNOWN with the tier recorded, following the convention that CAUSATIVE needs a Definitive or Strong tier; their notes now say so. Every record's inheritance block is bound to HP:0000007; MAT1A also carries a separate HP:0000006 block for dominant isolated hypermethioninemia from the single-allele p.Arg264His variant, whose product forms inactive heterodimers with the wild-type subunit (PMID:9042912) and which PMID:39511588 also describes. Four mechanism nodes named a gene but bound no molecular function; each now binds that gene's own catalytic activity as DECREASED: CBS GO:0004122 cystathionine beta-synthase activity; MTHFR GO:0106313 methylenetetrahydrofolate reductase (NADPH) activity (the NADPH-specific term the folate-family review adopted elsewhere); MAT1A GO:0004478 methionine adenosyltransferase activity; MMACHC GO:0033787 cyanocobalamin reductase (cyanide-eliminating) (NADP+) activity and GO:0016765 for its glutathione-dependent dealkylation of methyl- and adenosylcobalamin, cited to the primary biochemistry (PMID:18779575, PMID:19801555).

  summary: 'Genetics pass (series-045): Inborn_Disorder_of_Methionine_Cycle_and_Sulfur_Amino_Acid_Metabolism'
  details: |
    Genetics pass for the series-045 gap list (issue #12252). Three of the six checklist terms were accepted onto this pathway grouping and three were dispositioned elsewhere. Added CTH (hgnc:2501), GNMT (hgnc:4415) and SELENBP1 (hgnc:10719) as genetic records, as has_subtypes rows bound to MONDO:0009058, MONDO:0011698 and MONDO:0029144, and as three new pathophysiology nodes wired to the pathway step each enzyme acts at rather than to one flat gene list: a cystathionine cleavage block one enzyme distal to the existing CBS block, an S-adenosylmethionine disposal block whose raised S-adenosylmethionine is the discriminator from the existing MAT1A node, and a methanethiol oxidase deficiency. Each new node has a downstream edge, which needed four new phenotypes (Cystathioninuria HP:0003153, Halitosis HP:0100812, Hepatomegaly HP:0002240, Elevated circulating aspartate aminotransferase concentration HP:0031956). Declined the three molybdenum-cofactor sulfite-oxidase terms MONDO:0009644 (MOCS2), MONDO:0980701 (MOCS3) and MONDO:0014212 (GPHN): they are cofactor biosynthesis defects rather than methionine-cycle defects, and this repository already curates that branch under Molybdenum_Cofactor_Deficiency_Type_A plus the Sulfite_Oxidase_Deficiency_Due_To_Molybdenum_Cofactor_Deficiency stub. The decline and the contrasting reasoning for including SELENBP1 are recorded in the entry notes.

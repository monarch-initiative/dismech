  summary: 'Review round 1: swap preprint for published paper, correct splicing causality'
  details: |
    Worked the ai4c-reviewer changes-requested review on PR 9842. The substantive finding: the entry cited PMID:39464123, the bioRxiv preprint, where the peer-reviewed Nature Communications version PMID:41068108 exists - and the two differ where the entry leaned hardest. All eight evidence items were moved to the published paper and every snippet re-verified against the published text. Three preprint-only wordings were replaced, including 'in addition to its role on histones' which the published paper states as 'in addition to its role on chromatin'. More importantly the published Discussion says ZMYND11 did not largely regulate splicing, as few differentially spliced events overlapped chromatin binding, and attributes the splicing phenotype to increased RBFOX2 expression - so the edge from reader loss to the splicing node was regraded from DIRECT to INDIRECT_KNOWN_INTERMEDIATES and now carries that negative result as its own evidence item. The splicing node description previously contradicted the edge above it; it now states both literatures explicitly - direct chromatin-dependent intron retention via EFTUD2 antagonism in non-neural cells, indirect RBFOX2-mediated dysregulation in cortical cells - and says which one the causal grading follows and why. The deep-research report had cited the published version; the preprint came from my own PubMed search, so this was a regression against my own input. Other changes: the pathograph now reaches the clinic with two edges from the impaired-progenitor node to the intellectual disability and seizure phenotypes, both typed INDIRECT_UNKNOWN_INTERMEDIATES and graded PARTIAL because nothing connects the dish measurement to the clinical one in the same individuals. Added diagnosis, prevalence at CASES_IN_LITERATURE and ULTRA_RARE, and progression sections. variant_origin DE_NOVO was removed and the counselling text corrected after PMID:39696561 documented a 10p15.3 deletion inherited from a mildly affected father, which is a materially larger recurrence risk than the gonadal mosaicism the entry had claimed. Added motor delay. Recurrent infections now carries an explicit attribution caveat since its only source is a deletion cohort and no immunological mechanism is known for ZMYND11; short stature was dual-cited to a missense carrier so it does not rest on the deletion paper alone. Two GO modifiers changed to DYSREGULATED, and the 'rather than initiation' claim was softened. The reviewer suggested adding OMIM and ORPHA mappings; DiseaseMappings has no omim or orpha slot, so that is recorded in notes as a schema gap rather than forced. Validated with just validate at 48/48 snippets verified plus all six offline gates clean.

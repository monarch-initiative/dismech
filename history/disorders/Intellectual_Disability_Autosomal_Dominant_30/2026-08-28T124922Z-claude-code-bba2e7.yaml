  summary: 'Create: Intellectual Disability, Autosomal Dominant 30 / ZMYND11'
  details: |
    De novo curation of MRD30 / ZMYND11-related neurodevelopmental disorder, MONDO:0014486. ZMYND11 appeared in the KB only incidentally before this - as a binding partner named in the Bryant-Li-Bhoj H3.3 mechanism text and inside an evidence snippet in MED13L_Syndrome - and MONDO:0014486 appeared in no entry. Deep research: one openscientist report, research/Intellectual_Disability_Autosomal_Dominant_30-deep-research-openscientist.md, 18 citations, reference_validation 18/18 verified, confabulation_rate 0.0, 13/18 on topic and 0 off topic, so 5 were undecided rather than cleared. just preflight-dr against MONDO:0014486 returned PASS with ZMYND11 mentioned 79 times and no rival gene. One error was found in that report and not carried into the entry: it gives HGNC:29316 as the ZMYND11 identifier, which is actually ZSWIM6; the correct identifier hgnc:16966 was confirmed with runoak and used. Reference validation reported 0.0 confabulation for the same report, because it checks cited identifiers rather than identifiers asserted in prose. The report did contribute two substantive leads that improved the entry: PMID:25263594, the founding paper identifying ZMYND11 as an H3.3K36me3-specific reader that regulates intron retention by antagonising EFTUD2, and PMID:34818214, an intragenic deletion of the 5'UTR and first two exons that is the cleanest dosage argument for haploinsufficiency. Two discussions are recorded: a KNOWLEDGE_GAP on whether missense variants act by haploinsufficiency at all, and a HUMAN_MODEL_MISMATCH on the fact that the entire cellular arm of the pathograph rests on one human pluripotent stem cell model with no corresponding patient measurement. Validated with just validate at 38/38 snippets verified.

  details: |
    Added an experimental_models record for the ZMYND11-deficient human embryonic stem cell-derived cortical model (PMID:41068108), typed OTHER because it is hESC-derived and spans organoid and monolayer formats. Its ModelMechanismLink to 'Impaired cortical progenitor and neuron production' is PARTIALLY_RECAPITULATES with fidelity UNKNOWN and model_scale CELLULAR, with limitations covering the upward scale extrapolation, the delay-not-block result at day 30, and the absence of major brain malformations in patients; readouts for intermediate progenitor generation (DECREASED), TBR1-positive neuron generation (DECREASED) and ZMYND11 re-expression (RESTORED) each carry an exact snippet. The HUMAN_MODEL_MISMATCH discussion now also attaches to the model. Added Angelman syndrome (MONDO:0007113) as a differential diagnosis from PMID:27626064. Reworded the description sentence that read as if the splicing arm sat downstream of the de-repression arm. Replaced explanations naming the retired supports value PARTIAL. Not done: issue item 8 (the promoter and transcription-initiation findings of PMID:42262664 and the KMT2A findings of preprint PMID:41279818) remains unmodeled and is left for a follow-up.

  details: |
    Mechanical repair of 2 pathograph causal target(s) that were written with the `<kind>#<name>` entity-reference grammar in a slot that takes a BARE node name. `dismech.graph` matches these targets verbatim against another item's `name`, so a prefixed value matched nothing and the edge was silently dropped from the causal graph -- while the entry continued to pass LinkML validation, term validation and snippet verification, and the page continued to render. Only the `target:` values changed; no claim, evidence item, description or ontology binding was touched. Verified by rebuilding the causal graph before and after: edge count is unchanged and dangling targets drop to zero. Part of the issue #10112 sweep (175 targets across 32 entries); the new `just check-causal-targets` gate prevents recurrence.

  details: |
    New entry for MONDO:0014335 (QARS1, OMIM 615760), built from the stub. Deep-research provider: OpenScientist (the only report; preflight-dr PASS, QARS1 mentioned 50 times, OMIM matches). The report's reference validation flagged one unmatched quote for PMID:24656866 and five off-topic references; the off-topic ones are bacterial/fungal GlnRS enzymology papers and were not cited. The ISR and DARS2/PARS2 analogy material in the report is not QARS1-specific and was left out. References cited: PMID:24656866, 26869582, 25471517, 25432320, 28620870, 34774383, 39715963, 40448856, plus the ClinGen Definitive AR record (CGGV:assertion_6b0cbc0e...). Every snippet was checked against the fetched cache. Name kept as the MONDO/ClinGen label because no QARS1-related name is established (no MONDO synonym, no GeneReviews chapter, sparse literature use); OMIM title and literature names added as synonyms. No prevalence record: no published estimate. Validated with just validate, validate-terms, count-verified-snippets, the whole-repo offline gates and validate-disorders.

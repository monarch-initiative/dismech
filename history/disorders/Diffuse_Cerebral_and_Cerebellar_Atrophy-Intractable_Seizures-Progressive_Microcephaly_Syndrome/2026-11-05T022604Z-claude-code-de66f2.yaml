  details: |
    Addressed review 5778949830. Added reference_title to all 87 evidence items, copied by script from the references_cache title frontmatter. Added phenotypes from PMID:40448856 Table 1, each quoting the table rows: Delayed Myelination (HP:0012448), Thin Corpus Callosum (HP:0033725), Hypoplasia of the Corpus Callosum (HP:0002079), Ventriculomegaly (HP:0002119), Pachygyria (HP:0001302), Cerebral Visual Impairment (HP:0100704) and Facial Dysmorphism (HP:0001999); added two Table 1 hypomyelination rows to CNS Hypomyelination. No frequency qualifiers were added, because the table rows mix terms (thin vs hypoplastic, enlarged vs dilated) and overlap with earlier reports, so a band would be a count I composed rather than one the source states. Hypertonia, spasticity and dystonia each appear in one Table 1 row only and were not added. Regraded the PMID:24656866 cell-line aminoacylation item to IN_VITRO; rebound the para-infectious encephalopathy to HP:0006846 Acute encephalopathy and dropped temporality; dropped GO:0007420 from the tissue volume-loss node; replaced the p.Gly45Val evidence with the >10-fold reduction sentence; added diagnosis_term NCIT:C101295 Whole Exome Sequencing (OLS lookup). New phenotypes are not wired to mechanism nodes because no source states the edge. Validated with validate-disorders and the offline gates.

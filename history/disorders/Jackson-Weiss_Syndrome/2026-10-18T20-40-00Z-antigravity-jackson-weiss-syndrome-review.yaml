  details: Replaced deprecated percentage field in prevalence with measure_type CASES_IN_LITERATURE and
    prevalence_class ULTRA_RARE. Added inheritance_term (HP:0000006 Autosomal dominant inheritance) to
    Autosomal Dominant. Standardized genetic[0] to name FGFR2 with gene_term (hgnc:3689 FGFR2) and wired
    FGFR2 plus GO:0005007 (fibroblast growth factor receptor activity) into FGFR2 Gain-of-Function Signaling.
    Added Aberrant pedal chondro-osseous differentiation to pathophysiology and connected cranial and
    pedal pathophysiology nodes to Midface Retrusion, Broad Great Toes, Tarsal-Metatarsal Fusion, and
    Short First Metatarsal. Added progression (HP:0003577 Congenital onset) and differential_diagnoses
    (Crouzon syndrome MONDO:0007405, Pfeiffer syndrome MONDO:0007043, and Apert syndrome MONDO:0007041).

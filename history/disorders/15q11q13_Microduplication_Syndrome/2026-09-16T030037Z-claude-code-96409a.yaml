  summary: Rebind the facial phenotype from the organ-system bucket to the finding
  details: |
    The 'Abnormality of the face' phenotype bound HP:0000271, a coarse organ-region term. The cited sentence (PMID:19019226) reports facial dysmorphic features as absent or subtle, which is HP:0001999 Abnormal facial shape - a specific finding, not a bucket, and deliberately excluded from the coarse set because it is what dysmorphology actually reports. Rebound to HP:0001999 with preferred_term 'Subtle facial dysmorphism' so the display name carries the qualification the source makes. No claim strengthened: the entry still says the features are minor or subtle. Validated with linkml-validate, linkml-term-validator, the snippet audit (87/87), check_coarse_phenotypes, check_enum_values, check_duplicate_yaml_keys, check_entity_refs and check_causal_targets.

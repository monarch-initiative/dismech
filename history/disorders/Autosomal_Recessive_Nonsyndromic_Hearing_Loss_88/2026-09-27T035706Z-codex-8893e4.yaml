  summary: Review DFNB88 mechanisms, model limitations and clinical care using cached
    full text
  details: |
    Reviewed the complete entry, its CREATE history, the matching Falcon research narrative and citation list, and cached primary evidence. Eligibility: Mendelian disorder, no prior REVIEW event, and no overlapping DFNB88/ELMOD3 PR found before starting. Rebased before curation.

    Source consumption: read the scientific bodies and methods of Jaworek 2013 (PMID:24039609), Li 2019 (PMID:31628468), Turn 2022 (PMID:34818063), and the dominant-allele iPSC study (PMID:37708136), including relevant figure/supplement captions. Recovered and read Ivanova 2014 full text through generated PMC4036250 URL cache after the PMID supplied only an abstract and DOI retrieval supplied no body. Read the Turn correction in generated PMC9561853: duplicated Figure 4E double-knockout images with serum were replaced, with unchanged text and conclusions. The dominant family PMID:29713870 and contiguous-deletion PMID:30284680 abstracts were used only for disease boundaries. A DOI retrieval of the latter returned no quotable body; its abstract does not isolate causality for autism/intellectual disability. Unavailable retrievals are not cited as evidence. Reference caches were generated with the repository fetcher.

    Mechanistic changes: distinguish recombinant GAP assay-floor activity from proven absolute inactivity and from reduced ARL2 protein abundance in knockout cochlea. Add variant-specific stereociliary targeting failure in P2 cochlear explants and preserved weak F-actin co-sedimentation as a mechanistic constraint. Separate outer-hair-cell bundle degeneration from inferred amplification loss; retain indirect edges where intervention or direct transduction recordings are lacking. Add provisional fibroblast ciliogenesis, selective ciliary cargo localization, and Golgi cargo accumulation, without asserting a demonstrated cochlear causal chain. Record fast-cycling ARL3/ARL16 rescue as a cell experiment, not therapy or direct substrate proof. Do not import sigma-1 receptor inhibition assays of ELMOD1/2 as an ELMOD3 treatment. Remove module conformance that asserted unmeasured spiral-ganglion degeneration. Mouse hair-cell bodies largely persist.

    Clinical changes: remove unsupported disease-wide frequencies for mixed/conductive/sensorineural phenotypes; retain the primary-family audiograms and their component-specific severity. Correct the mouse timing to normal measured thresholds at one month and impairment from two months, retain early postnatal developmental findings, and remove speculative mouse-age-to-human-prenatal conversion. ABR/DPOAE alone cannot exclude a conductive contribution. CT examined V:2/V:11, not V:5 with the specifically described large gap; aeration does not exclude every conductive pathology. Reframe proposed middle-ear studies without claiming that abnormal tests establish ELMOD3 causation or normal tests prove artefact. Clarify isoform-limited antibody localization and limited human vestibular assessment.

    Content-completeness review: phenotype coverage adequate for the small defining family; no supported subtype subdivision; mechanism gaps addressed with explicit model limits; general hearing-loss diagnosis, hearing-aid fitting, implant candidacy, language/communication services and conditional recurrence counseling added from GeneReviews Genetic Hearing Loss Overview (NBK1434), without claiming DFNB88-specific efficacy. Genetic depth now includes the founding transcript-specific missense allele, segregation, functional evidence and analytical-versus-measured penetrance distinction. Diagnostic coverage includes audiometry and CT; no validated disease-specific biomarker or patient histopathology was identified. Cached disease-relevant primary evidence is incorporated, while dominant iPSC transcript enrichments, general Pakistani genetic-hearing-loss prevalence, and unrelated AAV therapies are out of scope. The research ciliary-trafficking attribution was traced to the actual 2022 primary study. ClinicalTrials.gov API queries for ELMOD3 and DFNB88 each returned zero studies on 2026-09-27; no trial was inferred from gene-therapy narrative. GeneReviews offline check found no disease-specific chapter; general clinical guidance was mined and tagged. No disease-specific dataset was identified in these sources.

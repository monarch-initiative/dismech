  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 88 (DFNB88, ELMOD3)'
  details: |
    Curated DFNB88 (MONDO:0014182, ELMOD3) as a standalone kb/disorders entry. entry_type DISEASE: one gene, one proximal molecular lesion (loss of ARL2 GTPase-activating activity), one clinical picture in one family; the MONDO parent MONDO:0019588 is an ontology grouping of unrelated DFNB loci, not a dismech entry. ELMOD3 was clear across kb/disorders before this change; the gene symbol was confirmed against the HGNC REST API (HGNC:26158 ELMOD3, previous symbols RBM29/RBED1/DFNB88). Seven-node pathograph from the homozygous p.Leu265Ser ELMO-domain allele through loss of ARL2 GAP activity to a disordered stereociliary actin cytoskeleton, separate inner and outer hair cell bundle arms, and cochlear transduction failure; one module conformance, at the terminal node only, against sensorineural_hair_cell_loss. Three phenotypes; Conductive Hearing Impairment is deliberately left unwired and carries an open KNOWLEDGE_GAP discussion because no part of the ELMOD3 mechanism explains the air-bone gap and no middle-ear data have been published. A second open discussion records the HUMAN_MODEL_MISMATCH between the prelingual human onset and the two-month onset of the Elmod3 knockout mouse. A falcon deep-research report is committed alongside; it passed just preflight-dr (ELMOD3 top gene, 53 mentions vs 11 for the next) and just validate-research-reference (7/7 references resolved, confabulation rate 0), and nothing in the entry was taken from it. Validated with just validate (43/43 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and the whole-KB offline gates.

  summary: 'Create: Reticular_Dysgenesis'
  details: |
    Created kb/disorders/Reticular_Dysgenesis.yaml for reticular dysgenesis (MONDO:0009973, AK2 / hgnc:362) as a leaf DISEASE entry, and deleted the corresponding stub. Curated 10 pathophysiology nodes as a single causal chain (AK2 loss in the mitochondrial intermembrane space -> adenine nucleotide imbalance and impaired oxidative phosphorylation -> oxidative stress and progenitor apoptosis -> lineage-restricted vulnerability -> promyelocyte-stage granulocytic arrest and T/NK differentiation arrest -> agranulocytosis and absent adaptive immunity), plus a separate two-node cochlear branch off the same trigger; 10 phenotypes; 3 treatments; 1 genetic, 1 inheritance, 1 animal model, 2 experimental models, 1 prevalence record, 1 discussion. 90 evidence items, all snippet-verified. Deep research: just research-disorder falcon Reticular_Dysgenesis (Edison, 681 s, 30 citations; reference_validation 7/7 verified, confabulation_rate 0.0; term_validation needs_review true but the single mislabelled term was the template placeholder string 'if available' against MONDO:0009973, not a real mis-binding). just preflight-dr PASS against MONDO:0009973 (AK2 mentioned 40 times, OMIM 267500 matches). No CURIE was lifted from the report; every ontology term was chosen and checked independently. Primary sources: PMID:19043416 and PMID:19043417 (the two 2009 AK2 gene-discovery papers), PMID:26150473 (zebrafish + iPSC, oxidative stress), PMID:26270350 (AK2 knockdown in primary human progenitors), PMID:39378586 (Blood 2024, metabolic checkpoint failure in late granulopoiesis), PMID:28331055 (international 32-patient survey), PMID:42112325 (10-patient single-centre cohort with HSCT outcomes), PMID:42169996 (single-cell profiling of the rhG-CSF response), PMID:31727854 (zebrafish sensory organ), PMID:29462620 and PMID:37949028 (iPSC models), PMID:29270983 (BJH review), PMID:31673062 (atypical Amish p.Ser208Pro case), PMID:32532877 (intronic splice variant case). Three modelling decisions worth flagging for review. First, the HSCT treatment deliberately carries target_mechanisms links to the two haematopoietic arrest nodes and NO link to either cochlear node, because HSCT does not replace inner-ear tissue; the absence of those links is the claim, and it is recorded in the treatment notes with a directness INDIRECT evidence item quoting PMID:42112325 on cochlear implantation performed after HSCT. Second, the G-CSF non-response is curated as a treatment that does not work, with a MODULATES link and a REFUTE evidence item from PMID:31673062 showing that a hypomorphic-allele patient did respond, so the refractoriness is scoped to classical RD. Third, the two cochlear nodes carry mechanism_confidence PROVISIONAL and HYPOTHETICAL and conform to sensorineural_hair_cell_loss; the human (stria vascularis) and zebrafish (hair cell) evidence implicate different compartments and that disagreement is recorded as a HUMAN_MODEL_MISMATCH discussion rather than resolved. No conforms_to target was adopted for the haematopoietic chain: myelosuppression is scoped to cytotoxic treatment toxicity, and mitochondrial_dysfunction and stem_cell_exhaustion are aging-hallmark modules terminating in age-related tissue dysfunction, while PMID:19043417 explicitly excludes a stem-cell defect in RD. No GeneReviews chapter exists for this disease (PubMed searched for 'reticular dysgenesis GeneReviews[All Fields]', no hits), so that baseline step does not apply. Not curated for want of a quotable abstract source: the Hoenig 2017 finding that 19 of 21 long-term survivors retained hearing impairment, and the cohort frequencies for anaemia and thrombocytopenia, both of which sit in that paper's full text while its cache entry is abstract-only. Validation: just validate, just count-verified-snippets (90/90), just validate-terms, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms-online, just check-reference-titles, just check-title-snippets, just check-snippet-length, just check-snippet-grading, just check-enum-values and the batched just validate-disorders were all run and read.

  summary: Address PR review on Combined Oxidative Phosphorylation Defect Type 21
  details: |
    Round of changes answering the ai4c-reviewer CHANGES_REQUESTED review on PR 9595.
    All four blocking items fixed and all five suggestions taken.

    Item 1, mortality was entirely absent. A three-phase progression section now
    carries it, with both quotes the reviewer identified as already sitting in the
    cache: three of eighteen died within the first two years of cardiorespiratory
    failure, and all four individuals with the p.(Arg327Gln) diabetes phenotype died
    before 24 months. Functional outcome among survivors is recorded alongside.

    Item 2, neonatal diabetes was not curated, leaving Pancreatic Beta Cell
    Dysfunction as a dead-end pathograph node. The phenotype is added and the node
    now has a downstream edge to it, so the branch reaches a clinical manifestation.
    The reviewer suggested HP:0008255; that term is Transient neonatal diabetes
    mellitus and the reported diabetes was insulin-treated and persistent, with one
    of the four diagnosed at 52 weeks rather than neonatally. HP:0000857 Neonatal
    insulin-dependent diabetes mellitus is used instead, and the reason is recorded
    in the phenotype's notes.

    Item 3, behavioural abnormalities at seven of eighteen are added with the
    FREQUENT band.

    Item 4, two evidence_source values were changed from HUMAN_CLINICAL to IN_VITRO.
    Both are internal inconsistencies as the reviewer described: one snippet opens
    "In vitro studies showed", and the same co-immunoprecipitation experiment was
    already graded IN_VITRO elsewhere in the file. The rest of the file was then
    swept programmatically for the same pattern, matching every snippet against
    regular expressions for in-vitro and model-organism vocabulary while graded
    HUMAN_CLINICAL; no further instances were found. just check-snippet-grading
    --against-ref origin/main also reports no new divergences.

    Suggestions. PMID:36150709 was listed in references but never cited; it now
    supports a new Refractory Hypokalemia phenotype and adds a second patient to the
    Sensorineural Hearing Impairment evidence, which matters because the largest
    cohort found none. PMID:26811336 now supports the aminoacylation node with
    direct enzymology for the p.Pro282Leu allele, showing activation, aminoacylation
    and proofreading all reduced together. A prevalence record was added with
    measure_type CASES_IN_LITERATURE and prevalence_class BELOW_1_IN_1000000; the
    notes state that the band is inferred from the published count of approximately
    28 individuals rather than from a population study, and that Orphanet's own
    class could not be cited because ORPHA:420733 is not in this repository's
    references_cache.

    The compound node Neurodevelopmental Impairment and Progressive Brain Atrophy
    was split into Progressive Cerebellar and Cerebral Atrophy (TISSUE) and
    Developmental Impairment and Regression (ORGANISM), with an edge between them.
    The two really are different claims measured differently, and they can diverge:
    a child can regress after an intercurrent illness without a new imaging finding.
    All eight references to the old name, including the discussion attaches_to,
    were updated in one pass and just check-entity-refs confirms every reference
    resolves. The other flagged name, Impaired Oxidative Phosphorylation and Lactate
    Accumulation, was deliberately left as it is: lactate accumulation is the
    readout of the same physiological event rather than a second mechanistic claim.

    The reviewer noted it could not independently verify the GeneReviews negative
    because curl was blocked in its environment. That search was run here and
    returned no chapter; the negative is recorded in the entry notes and is left
    unchanged.

    Validation, all run and read: just validate passed; just validate-disorders
    passed; Snippets checked: 96/96 verified against cached references, up from 82;
    check-entity-refs OK; check-title-snippets OK; check_snippet_length
    --against-ref origin/main OK; check_folded_hyphens --check OK;
    check-duplicate-keys OK; check-snippet-grading --against-ref origin/main OK. One
    new reference cache file (PMID_26811336) is added; no cache CSV rows changed by
    this round. Branch level with origin/main.

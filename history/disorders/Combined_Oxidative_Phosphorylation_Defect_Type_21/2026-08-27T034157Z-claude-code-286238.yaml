  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 21 (TARS2)'
  details: |
    New Disease entry for MONDO:0014398 (OMIM 615918, ORPHA 420733), the TARS2
    mitochondrial threonyl-tRNA synthetase disorder, curated from the stub at
    stubs/Combined_Oxidative_Phosphorylation_Defect_Type_21.yaml.

    Entry-type decision: DISEASE. The stub records no mondo_descendant_count, so
    MONDO holds this as a leaf, and genes: lists a single causal gene (TARS2). No
    existing dismech entry covers TARS2.

    Deep research: two runs, and the first one failed. just research-disorder falcon
    produced a report about TACO1, not TARS2. just preflight-dr returned FAIL with
    TARS2 mentioned zero times against TACO1 fifty-nine times. Per the SOP the
    report was discarded entirely and deleted rather than committed, since a
    wrong-entity file in research/ misleads the next curator and falsely registers
    provider coverage for this disease. This is a Named Entity Confusion failure of
    exactly the kind the numbered-series risk class predicts: "combined oxidative
    phosphorylation deficiency" is a numbered series and TACO1 causes a
    mitochondrial complex IV deficiency in the same clinical family, so a report
    about it reads as plausible and every citation in it would have validated. Only
    the gene-frequency check catches it. A second run with the claude_code provider
    returned a TARS2 report that passed preflight (TARS2 37 mentions, top rival
    VARS2 at 4, report OMIM 612805 and 615918 against the MONDO xref 615918), and
    that report is what is committed here.

    The claude_code report's own reference_validation reported 13/13 references
    verified, 0 not found, needs_review true because 2 of 9 quoted claims did not
    match. Both were checked: they are ellipsis-elided versions of real sentences in
    PMID:37454282, and the entry quotes the full unelided sentences, which verify.
    Nothing in this entry was curated from either report; every snippet was taken
    from a references_cache file fetched with just fetch-reference.

    Content: 8 pathophysiology nodes across two hypothesis groups. The canonical
    group runs from TARS2 loss of function through impaired mitochondrial
    threonyl-tRNA aminoacylation, impaired mitochondrial translation, combined
    respiratory chain complex deficiency and impaired oxidative phosphorylation to
    the neurodevelopmental endpoint. The emerging group runs from the same trigger
    through reduced Rag GTPase binding and mTORC1 dysregulation to the same endpoint
    plus a pancreatic beta cell branch. Both groups are declared in
    mechanistic_hypotheses with CANONICAL and EMERGING status, and the causal edges
    carry hypothesis_groups. 15 phenotypes, most with frequencies from the single
    pooled analysis of 28 individuals that is the only source reporting denominators.
    1 genetic entry, a zebrafish morpholino animal model with modeled_mechanisms
    against both arms, 3 diagnosis entries, 2 treatments, and 1 KNOWLEDGE_GAP
    discussion on the relative contribution of the two mechanisms.

    The mTORC1 arm is deliberately PROVISIONAL rather than ESTABLISHED. The binding
    experiments used transfected constructs whose basal expression was itself
    reduced to 39 to 66 percent of wild type, so reduced binding and reduced protein
    are confounded; mTORC1 activity was never measured in patient cells; and the in
    vivo evidence is a morpholino knockdown, which cannot separate a Rag-binding
    defect from general loss of the synthetase. Those three limitations are stated
    in the node description, in the hypothesis description, and in the model's
    limitations field.

    Deliberate omissions recorded in the entry notes: no prevalence record (roughly
    thirty patients described); no environmental section; no experimental_models
    section (the human functional work is co-immunoprecipitation of transfected
    constructs and fibroblast rescue rather than a characterised model system, and
    those results are curated as evidence on the nodes they bear on). Frequency was
    omitted for sensorineural hearing impairment because the two available
    denominators disagree, three patients in earlier literature against none of
    eighteen in the largest cohort.

    A tooling gap is recorded in the entry notes: ORPHA:420733 defines this disorder
    and states that the combined respiratory chain deficiency is present in muscle
    but not fibroblasts or liver. That tissue restriction is curated but sourced to
    the primary literature, because the ORPHA structured reference is not in this
    repository's references_cache and just refresh-orphadata currently fails on a
    drifted checksum in data/orphadata/MANIFEST.yaml.

    One snippet initially failed validation because it contained the bracketed spans
    [F323C] and [E342D], which are stripped before matching. The quote was shortened
    to a bracket-free span and the numeric detail moved into the explanation, rather
    than altering conf/reference_validator_config.yaml for one snippet.

    Validation, all run and read: just validate passed; just validate-disorders
    passed; Snippets checked: 82/82 verified against cached references;
    check-title-snippets OK; check_snippet_length --against-ref origin/main OK;
    check_folded_hyphens --check OK; check-duplicate-keys OK;
    check-term-cache-integrity OK; check-cache-order OK. Cache diff is exactly the
    four CURIEs this entry introduces (MONDO:0014398, GO:0004829, GO:0033108,
    hgnc:30740).

  summary: 'Create: Neurodegeneration_Childhood-onset_With_Cerebellar_Atrophy'
  details: |
    Created the CONDCA (AGTPBP1/CCP1) entry de novo from primary literature, using the Edison/falcon deep-research report at research/Neurodegeneration_Childhood-onset_With_Cerebellar_Atrophy-deep-research-falcon.md as leads only. GeneReviews baseline: searched PubMed for an AGTPBP1/CONDCA GeneReviews chapter ('AGTPBP1 GeneReviews[All Fields]' and a broader disease-name search); no chapter exists, so no GeneReviews phenotype baseline was available and none is tagged. Report handling: the falcon report was generated with an empty mondo_id, so a Named Entity Confusion preflight was run explicitly (just preflight-dr ... MONDO:0032650 --strict); it returned WARN only because TTLL1 is mentioned 10 times, but TTLL1 is the counteracting glutamylase central to this mechanism rather than a rival disease gene, and the report's OMIM ID 618276 matches the MONDO term, so the report is on-target. The report's own reference_validation reported 9/9 resolved and term_validation 41/41 resolved with matching labels, but the report carries 38 citations and contains ZERO PMIDs, so only 9 identifier-bearing citations were ever checked; the ~29 author-year-keyed citations were treated as unverified. Every DOI in the report was converted to a PMID via the PMC ID converter and re-fetched, so the entry cites 21 distinct PMIDs and NO DOI-keyed evidence at all -- every snippet is therefore covered by the gating CI validator, and no --unskip-prefix DOI run was needed. Content: 9-node causal pathophysiology chain (CCP1 deglutamylase deficiency -> tubulin hyperglutamylation -> impaired microtubule-based axonal transport and Purkinje cell ER stress -> Purkinje neuron degeneration and lower motor neuron/peripheral axon degeneration -> progressive cerebellar atrophy and motor neuronopathy -> cerebellar ataxia/movement disorder and progressive weakness), with edge-level evidence including the TTLL1 genetic rescue experiments. Three nodes declare conforms_to against cerebellar_purkinje_degeneration (#Cerebellar Neuron Insult, #Purkinje Neuron Degeneration, #Cerebellar Ataxia); the module's calcium/proteostasis amplifier node is deliberately NOT claimed because the CONDCA amplifier is a tubulin post-translational-modification and transport defect. 19 phenotypes, all with at least one HUMAN_CLINICAL evidence item (mouse data is never the sole support for a human phenotype). Deliberate omissions recorded in the file: has_subtypes is NOT used (the literature describes a continuous severity spectrum with no named nosologic entities, and Shashi et al. explicitly cautioned against a definitive genotype-phenotype correlation) -- recorded as discussion condca-subtype-structure; frequency: is omitted on all but one phenotype (neurogenic muscle atrophy, FREQUENT, from an explicit 'half of the patients' statement) because the published counts come from severity-ascertained case reports with differing denominators -- recorded as condca-frequency-data; the single 2023 dilated-cardiomyopathy case report is NOT curated as a phenotype because its journal has no PubMed record and no PMID-anchored snippet is possible -- recorded as condca-cardiac-involvement; childhood mortality is recorded under progression rather than phenotypes because HP:0003819 is outside the PhenotypeTerm dynamic enum; AGTPBP1-related teratozoospermia (PMID:37937809) is noted as out of scope. Five knowledge-gap discussions. Treatments: five supportive-care entries plus four clearly-labelled PRECLINICAL-ONLY investigational entries (AAV Ccp1 gene replacement, TTLL1-directed polyglutamylation reduction, rhVEGF-B, lacosamide/CRMP2), each with target_mechanisms linking to the pathograph. Treatment terms use NCIT throughout (MAXO is retired in this repo). No datasets block: just discover-datasets returned no GEO candidates, which is expected for an ultra-rare disorder. Validation: just validate passes (schema + terms + references, 107/107 snippets verified); check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length and check-snippet-grading all pass; compliance 86.3% global / 86.5% weighted. A red-team self-review (dismech-pr-review skill, run in a fresh-context subagent) was performed before opening the PR and found 6 critical and 11 important issues, all fixed in this same PR: three snippets truncated immediately before the clause carrying their claim (Nna1 deglutamatase, Delta2-tubulin, and the ataxia edge); two supports:REFUTE items pointed at objects they did not refute (the AGTPBP1 causal-gene entry, and a null result about a different drug attached to the rhVEGF-B entry); a bundled ataxia/spasticity/dystonia node whose causal attribution its own phenotype entry contradicted; two evidence items mixing IN_VITRO and MODEL_ORGANISM in one quote; a cultured-hippocampal-neuron result graded MODEL_ORGANISM; an inconsistent evidence_source policy for the PMID:34572343 review, now governed by an explicit rule recorded in notes (grade what the quoted sentence reports, not the paper's overall design); a cell-autonomy claim that wrongly excluded any glial contribution; and an ESTABLISHED confidence on a Purkinje-cell-degeneration node that no human study has ever confirmed. That last one produced the most substantive change: PMID:30420557 states outright that 'we could not yet obtain direct evidence for Purkinje cell degeneration in human patients as no postmortem examinations were conducted', so the node was downgraded to PROVISIONAL, that disclaimer was added as a supports:NO_EVIDENCE item, and a sixth discussion of kind HUMAN_MODEL_MISMATCH was added. The review also surfaced two content gaps now filled: a Tongue Fasciculations phenotype (HP:0001308) quotable from a snippet the entry already cited twice, and a microtubule-depolymerizer preclinical treatment from PMID:33004692. The frequency rationale was rewritten to state the real reason bands are mostly omitted (the counts sit in a table the reference cache does not capture as text, so no CI-verifiable snippet exists for them) rather than the post-hoc epistemic reason originally recorded.

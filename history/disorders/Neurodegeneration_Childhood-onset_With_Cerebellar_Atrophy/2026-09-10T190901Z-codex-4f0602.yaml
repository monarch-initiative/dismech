  summary: Review human phenotypes, neuronal mechanisms and the first CONDCA autopsy
  details: |
    Reviewed all 20 original phenotypes on source consistency, HPO specificity and causal explanation, plus missing clinical findings. Added 18 phenotypes with scoped patient evidence, separated reflex direction and removed two unsupported narrower frequency bands. Added neuronal-maintenance, callosal-white-matter and thymic-tissue mechanisms; represented supported indirect clinical links while preserving unresolved cardiac, regional neurological and gene-to-thymus attribution. Added the 2026 first human autopsy, which establishes Purkinje and anterior horn-cell loss; restored the 2019 primary full text and retained its NCAPD3 confound. Corrected transport mediation, model versus human evidence and the PCH1 developmental dichotomy. Preserved prior authorship and exact fetched evidence titles.
    Follow-up anatomy review removed the absent-thymus-to-thymic-aplasia identity edge and retained aplasia as a causal attribution gap. Reanchored cerebellar atrophy to Purkinje neuronal loss and lower motor neuron degeneration to qualified CCP1 deficiency, retaining the supported tissue-injury-to-manifestation links and the provisional thymus-to-lymphopenia hypothesis.

  details: |
    Response to the third review round on PR #11646.

    Blocking finding: the Microcephaly evidence item quoting PMID:30976113 reproduced a 17-line contiguous span in which the Fig. 1 legend for Family 1 and the running page header 1422 R. Sheffer et al. sit between the two halves of the supporting sentence. The quote was verbatim and passed every gate, but the rendered evidence card offered PCR-product and Sanger-sequencing text as support for reduced head circumference. Replaced with the elided form already used elsewhere in this entry for the PMID:30420557 eye-movement item: A progressive decline in the head circumference percentile ... for age was noted (Fig. S1), and at last examination at 45 months of age was measured to be 46 cm ( -2.7 SD). The reconstructed sentence is what the source says and the attribution to the second patient is unchanged. Snippet verification is unchanged at 182/187 with 5 DOI-prefixed snippets skipped by prefix.

    Suggestion on boilerplated endpoint edges: each of the twelve Motor Neuronopathy and Progressive Weakness downstream edges already carries a manifestation-specific second quote alongside the general PMID:30976113 attribution sentence, so the specific sentence was already preferred where one exists. What made the block read as boilerplate was that the edge description and the general item explanation were byte-identical across all twelve. Both now name the manifestation the edge is about, so a reader can tell which of the twelve attributions the general sentence is being offered for on that edge. No snippet, term, phenotype, HPO binding or causal edge changed.

    Suggestion on frequency data and on PDF extraction noise: declined, with reasoning recorded in the PR comment. The two denominators are already preserved verbatim as quoted evidence on the condca-frequency-data discussion.

    Validation on this branch: just validate passed schema, term and reference validation; count-verified-snippets 182/187; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-folded-hyphens all clean. check-snippet-length reports nine findings, all in Fragile_X_Syndrome, Hypermobile_Ehlers-Danlos_Syndrome and KCNH1_Associated_Disorder, which this PR does not touch.

  summary: 'Genetics pass: bind genes on the three MLASA subtype rows'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: MLASA spans the nuclear and mitochondrial genomes - PUS1
    (MLASA1) and YARS2 (MLASA2) are nuclear and recessive, MT-ATP6 (MLASA3) is
    mitochondrial and was reported de novo and heteroplasmic. The entry already
    modelled that split correctly, with two separate `inheritance:` blocks and a
    per-gene pathophysiology node for each of the three genes.

    The checklist keys PUS1 (MONDO:0024553) and YARS2 (MONDO:0013307); both terms
    and their gene attributions were verified against OLS and Monarch. MONDO:0010782
    (MLASA3) returns no causal gene from Monarch, which is expected rather than a
    gap: its OMIM xref is OMIM:500011, a 5-series mitochondrial entry, and
    mim2gene_medgen does not map mitochondrial loci.

    Changes:
    - Added the gene as a `genes:` descriptor on all three `has_subtypes` rows
      (MLASA1/PUS1, MLASA2/YARS2, MLASA3/MT-ATP6).

    Nothing else was needed. All three genes were already bound with
    `relationship_type`, `variant_origin` and their own pathophysiology node, which
    is why this entry's diff is the smallest in the tranche.

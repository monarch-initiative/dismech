  summary: Bind MT-ATP6 node to proton-transporting ATP synthase activity
  details: |
    Requested by the complex V gene-family review. The node 'MT-ATP6 complex V respiratory defect' named MT-ATP6 without a molecular function. Bound GO:0046933 proton-transporting ATP synthase activity, rotational mechanism, modifier DECREASED, as the holoenzyme activity to which subunit a contributes the FO proton path, matching how the NARP, Leigh and ataxia-polyneuropathy entries model MT-ATP6. Added two evidence items from PMID:27812026 (yeast model of the same m.8969G>A variant, atp6-S175N): ATP synthesis falls by 90 percent, and the mutation inactivates the ATP synthase proton channel. The existing patient-fibroblast evidence (PMID:25037980, decreased oligomycin-sensitive respiration) is retained. The MT-ATP6 curated summary (hgnc_7414) now names this node and verifies.

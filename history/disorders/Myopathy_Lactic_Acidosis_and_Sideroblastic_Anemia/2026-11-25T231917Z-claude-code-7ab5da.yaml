  summary: 'Gene-family review: PUS1, YARS2'
  details: |
    The PUS1 node now binds tRNA pseudouridine synthase activity (GO:0106029) DECREASED (absent or greatly reduced tRNA pseudouridylation in MLASA, PMID:15772074) and the YARS2 node tyrosine-tRNA ligase activity (GO:0004831) DECREASED (17-fold loss of catalytic efficiency, PMID:30026338). Both genetic records gain the entry's autosomal recessive inheritance block (HP:0000007), not the mitochondrial one that belongs to the MT-ATP6 form.

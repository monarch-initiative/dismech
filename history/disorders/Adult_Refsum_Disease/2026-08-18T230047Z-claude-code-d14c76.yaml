  summary: 'Record MONDO:0009958 as narrowMatch, not identity: it is axiomatized as
    PHYH-specific'
  details: |
    The entry is grounded to MONDO:0009958 'adult Refsum disease' and declares two subtypes, Type 1 -> MONDO:0100258 (phytanoyl-CoA hydroxylase deficiency) and Type 2 -> MONDO:0100307 (adult Refsum disease due to PEX7 defect). MONDO asserts MONDO:0009958 is_a MONDO:0100258, i.e. the reverse of the subtype relation this entry asserts, which made the two identity mappings plus the has_subtypes edge jointly unsatisfiable (Type 1 < Type 1; ProperSubClassOf is irreflexive).

    Resolution: MONDO is wrong, and dismech is right. MONDO:0009958 is defined clinically ('anosmia, early-onset retinitis pigmentosa...', no gene) but axiomatized via is_a MONDO:0100258, whose definition is 'any disorder of peroxisomal alpha oxidation in which the cause is a mutation in the PHYH gene'. That restricts adult Refsum disease to PHYH-caused disease. GeneReviews (PMID:20301527, already cited by this entry) gives PHYH >90% and PEX7 <10%, so the restriction is false. MONDO's own MONDO:0100307 is defined as 'an adult Refsum disease in which the cause is a mutation in the PEX7 gene', which cannot hold alongside that is_a edge; MONDO avoids the contradiction only by never asserting MONDO:0100307 is_a MONDO:0009958.

    MONDO has an open issue for exactly this: monarch-initiative/mondo#10377 (filed 2026-06-22) requests renaming MONDO:0009958 to indicate its monogenic nature and creating a new parent term for adult Refsum disease over the PHYH and PEX7 subtypes, citing the same GeneReviews source.

    Change made: added a mappings.mondo_mappings entry recording MONDO:0009958 as skos:narrowMatch rather than identity, since this entry (both genes) is broader than the MONDO class as currently axiomatized, with mapping_justification explaining the conflict and a tracked_issues pointer to mondo#10377. disease_term is deliberately UNCHANGED - it remains the closest available grounding, and dismech disease_term is a grounding rather than an identity claim. No phenotype, pathophysiology or evidence content changed.

    Validated with 'just validate' (schema + terms + references) and 'just count-verified-snippets' (111/111 verified).

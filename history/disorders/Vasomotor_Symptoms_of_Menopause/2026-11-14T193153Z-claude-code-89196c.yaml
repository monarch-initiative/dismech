  summary: 'Review response: frequency bands re-evidenced; first-line treatments curated'
  details: |
    Addresses the three Vasomotor Symptoms findings of the automated review of PR #17805.

    Finding 1, phenotype frequency bands. Hot Flashes moved from VERY_FREQUENT to FREQUENT: its only frequency evidence stated 70%, which is the FREQUENT band, and a search for a measured population figure in the 80-99% range found none. The band now rests on three cited measurements rather than one framing sentence - the pooled regional prevalences of 54.29% to 74.23% from a meta-analysis of 41 population-based studies in 28,955 women (PMID:42747278), hot flushes in 62% to 68% of a moderate-to-severe vasomotor cohort in the past week (PMID:34033602), and the prevalence trajectory rising through the perimenopause to about 60% after the final menstrual period (PMID:40330614). Night Sweats keeps FREQUENT but no longer rests on a methods variable label that carries no frequency: the same survey reports night sweats in 52% to 68% across three regions, and the SWAN outcome-definition quote is retained for the phenotype-pair claim with its explanation corrected to say it carries no frequency. Three figures above 80% were checked and rejected on stated grounds and are recorded in the entry notes with their identifiers: an introductory ceiling of up to 88% (PMID:21245182), 80-90% for persistent menopausal symptoms as a group rather than for hot flushes (PMID:42252432), and 86.5% in a survey of women recruited because they had vasomotor symptoms (PMID:37650213). A second prevalence record carries the meta-analysis figures, kept separate from the existing background-sourced record because the measure and basis differ.

    Finding 2, missing first-line treatments. Six treatment rows added, each with exact-quote evidence from a reference fetched in this pass. Menopausal Hormone Therapy, bound to NCIT:C15599 Hormone Replacement Therapy, which was read from OLS and confirmed to resolve under NCIT:C25218 as TreatmentTerm requires and to carry 'menopausal hormone therapy' as an NCIT exact synonym, so design decisions section 19's prohibition on off-label reuse of that class does not apply; agents 17beta-estradiol, conjugated estrogens and medroxyprogesterone acetate; linked to the Systemic Estradiol Withdrawal root node with treatment_effect RESTORES and its own edge evidence. Benefit and risk are curated together, not one without the other: the Cochrane 75% relative reduction and its 58% placebo arm (PMID:15495039), the low-dose MsFLASH result (PMID:24861828), the review statement of route-comparable efficacy (PMID:26348174), and from the WHI the vasomotor benefit in women aged 50-54, the shared stroke, thrombosis, gallbladder and incontinence harms, the persisting breast cancer elevation on the combined regimen, the absence of a mortality difference, and the investigators' own boundary between symptom management and chronic-disease prevention (PMID:24084921), with the timing hypothesis (PMID:30484736) and the breast-cancer-survivor contraindication (PMID:14663778). Low-Dose Paroxetine on the two 7.5 mg registration trials (PMID:24045678) plus the FDA-approval statement (PMID:26348174). Serotonergic Antidepressant Therapy covering escitalopram (PMID:21245182) and venlafaxine (PMID:24861828). Gabapentin on the 900 mg trial (PMID:12576259). Oxybutynin on ACCRU SC-1603 (PMID:32337497), linked to the Episodic Activation of Heat-Dissipation Effectors node with INHIBITS and its own evidence, that edge recorded as the trial's rationale rather than a measured mechanism because the endpoints were flush score and frequency, not sweat rate. Psychosocial Intervention including Cognitive Behavioural Therapy on a systematic review of 28 trials in 2,887 women (PMID:42252432), with its own caveat that the effect measured is bothersomeness rather than frequency or severity.

    What was deliberately not claimed. The paroxetine, serotonergic, gabapentin and psychosocial rows carry no target_mechanisms link, because no source cited in this entry places a serotonergic agent, gabapentin or a behavioural intervention at any node in this chain; each row records that in its own notes. A 20 mg daily paroxetine pilot in surgical menopause was checked and not used as the low-dose row's evidence - wrong dose, pilot design, 14% attrition, selected population - and is listed under references with the reason given in the row notes.

    Finding 3, the NK3R node over-count. The node description said three antagonists reduce flushes and that it is the node every drug in the entry acts on. Both were false after the treatments were added. It now names fezolinetant and elinzanetant as the two curated rows and MLE4901 as the third, cited as proof-of-concept evidence on the fezolinetant row and never developed past phase 2, and says where the hormonal and non-hormonal rows act instead.

    Validation. just validate (schema, terms, references) passed with 83 of 83 snippets verified and 106 titles checked; just validate-disorders passed; validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-block-scalar-comments, check-logical-rules, check-name-collisions, check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-folded-yaml and check-retired-support-prose all passed. CHEBI:749574 was resolved into the term and enum caches by the term validator; CHEBI:50114 estrogen was tried as a class agent and rejected as outside the ChemicalEntityTerm dynamic enum, so only the specific agents are bound.

    Not done. No clinical_trials rows were added for the new treatments, although NCT00000611, NCT01418209 and NCT00894543 are named in the cited reports. The TACR3 susceptibility GWAS, the Freedman alpha2-adrenergic account of the narrowed thermoneutral zone, and the finding that estradiol levels do not differ between symptomatic and asymptomatic women were read in a deep-research report for this entry and left as leads rather than curated, since each is outside the three review findings.

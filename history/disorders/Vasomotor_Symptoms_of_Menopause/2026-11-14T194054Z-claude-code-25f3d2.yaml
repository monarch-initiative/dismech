  summary: Add the TACR3 common-variant susceptibility record
  details: |
    Added a genetic: section, which the entry lacked entirely, carrying one SUSCEPTIBILITY record for TACR3 (hgnc:11528, already bound on a pathophysiology node in this entry and already in cache/hgnc/terms.csv). The lead came from the OpenScientist deep-research report committed in d6594e6bf; both papers were fetched and read before anything was written, and the quotes are from the cached abstracts rather than from the report.

    Evidence: PMID:28231077, the meta-analysis of three Women's Health Initiative GWAS (n=17,695), for the locus itself, quoted twice - once for the finding (14 SNPs on chromosome 4 in the TACR3 locus) and once for the authors' own weaker statement of what it licenses (Genetic variation in TACR3 may contribute to the risk of VMS). The genome-wide significance threshold sentence was deliberately not quoted: the cached extraction drops the superscript, so the source reads 'P < 5 x 10' with no exponent, and quoting it would reproduce a mangled figure.

    One variant, rs74827081, with a population_effects record rather than a bare description, because the replication (PMID:33906203, SWAN Genomic Substudy) reports the protective association in one stratum only. population carries the source's own wording; ancestry_terms binds HANCESTRO:0590 European American, looked up in OLS in the step it was written and chosen over HANCESTRO:0005 European ancestry because SWAN is a United States cohort whose race categories are self-reported, which is also why ancestry_basis is SELF_REPORTED. Not a reference-panel term. The row was written into cache/hancestro/terms.csv and the ancestryterm enum cache by just validate-terms.

    What this record deliberately does not claim: that vasomotor symptoms are a genetic disease; that the common variation has anything to do with the congenital TACR3 loss of function causing hypogonadotropic hypogonadism, which this entry already records as out of scope; or anything about severity, frequency, duration or course - the replication looked for a trajectory effect and found none, and the notes say so. The Zhao paper's separate menarche-polygenic-score finding in Black women is a different claim and was not curated.

    Validation: just validate (86/86 snippets, 109/109 titles, 0 issues), just validate-terms passed, just validate-disorders passed, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-coarse-phenotypes all OK, normalize-cache then check-cache-order OK.

  summary: 'Create: Vasomotor Symptoms of Menopause'
  details: |
    New entry for the vasomotor symptoms of menopause, the second of the three disorders of the
    transition that design decisions section 19 names as in scope.

    Naming. "Hot Flashes" was rejected under the entry-naming skill's scope test: flushing
    occurs in carcinoid, pheochromocytoma, thyrotoxicosis, mastocytosis and androgen
    deprivation, so a patient could have the named condition without this entry's defining
    cause. "Menopausal Hot Flushes" would exclude night sweats, which is half the phenotype
    pair. "Vasomotor Symptoms of Menopause" is the name the field uses - every cited phase 3
    trial is titled for "vasomotor symptoms associated with menopause" - and its scope matches
    the entry exactly. The "of Menopause" qualifier is load-bearing: the field distinguishes
    vasomotor symptoms associated with endocrine therapy, which is why the OASIS-4 result in
    that population is graded INDIRECT here, as the module grades it.

    Anchoring, and what could not be verified. The entry carries no disease_term, because
    MONDO has no class for the concept. Re-verified through OLS immediately before commit:
    "vasomotor symptom", "hot flash", "hot flush" and "menopausal syndrome" return no matching
    class, and of the 17 hits for "menopause" only four carry the word in the label (premature
    menopause, postmenopausal osteoporosis, postmenopausal atrophic vaginitis, and a
    polyneuropathy syndrome), which is what section 19 records. The ICD-11 Foundation route
    that section 19 mentions could not be taken, and that is a session limit rather than a
    finding: the WHO ICD-11 API at id.who.int requires an OAuth2 client credential and returns
    HTTP 401 without one, the ICD-11 browser's JSON search endpoints returned 404 or a
    redirect, OLS does not host ICD-11, cache/icd11f/terms.csv holds 24 rows and none is
    menopause-related, and the icd11f SQLite build the term validator would need is outside
    this session's disk budget. ICD-10-CM was reachable instead. The N95 block was read from
    the NLM Clinical Table Search Service, which returned five codes (N95.0, N95.1, N95.2,
    N95.8, N95.9), and ICD10CM:N95.1 "Menopausal and female climacteric states" was then
    resolved against the local ICD-10-CM build, which gives the same label and places it under
    N95 "Menopausal and other perimenopausal disorders" within N00-N99. It is recorded as
    skos:broadMatch, because the code also covers the sleeplessness, headache and poor
    concentration of the transition while this entry covers the vasomotor arm only. What was
    NOT verified is the code's inclusion notes: neither source read here returns the inclusion
    terms, so the mapping justification argues the code is broader from its label alone. A
    MONDO term request is recorded as a knowledge-gap discussion with the searches that
    establish the gap; it has not been filed.

    Mechanism. Six nodes. Three conform to kb/modules/menopausal_estrogen_withdrawal.yaml, at
    its systemic, receptor and KNDy nodes. The receptor-node substitution is deliberately
    narrower than the module's generic one - KNDy neuron (CL:4023125) in the arcuate nucleus
    (UBERON:0001932), with ESR1 only and not ESR2, because co-expression of kisspeptin,
    neurokinin B and that receptor has been identified only in arcuate neurons. The module's
    notes state that it stops at the KNDy neuronal state and that the narrowed thermoneutral
    zone, the median preoptic relay, cutaneous vasodilatation and sweating are the steps a
    vasomotor entry would add; those three nodes are below the conformance boundary and are
    this entry's own. The module's own Neurokinin-3 Receptor Antagonism treatment is not
    duplicated: the two treatment rows here are per-agent, target this entry's preoptic
    receptor node rather than the module's KNDy node, and carry their own trial evidence and
    registrations. check-conformance-content reports every link sharing a GO term with its
    module node, with no process_absent, cell_type_absent or edges_absent findings.

    The step the entry does not claim to have traced. The link from raised neurokinin-3
    receptor signalling to the narrowed thermoneutral zone is recorded as
    INDIRECT_UNKNOWN_INTERMEDIATES and is the subject of the entry's principal knowledge gap.
    Both ends are established - the arcuate hypertrophy and raised transcripts in human
    postmortem tissue, reversed by estrogen in ovariectomized monkeys; infused neurokinin B
    reproducing flushes in healthy premenopausal women; three receptor antagonists reducing
    flushes in randomised trials; and the interthreshold zone measured as collapsed - but no
    cited work traces one to the other, and the sign runs the wrong way: the cited review
    records that activating the receptor in the rat median preoptic nucleus REDUCES body
    temperature. That sentence is quoted as it stands rather than paraphrased, and the node's
    description says why it is awkward. The same ablation study showed estradiol's effect on
    tail-skin temperature was blocked in the light phase only, which is quoted as the reason
    the entry does not claim the KNDy route is the whole thermoregulatory story.

    One cell type is deliberately unbound. The preoptic thermoregulatory neuron carries a
    free-text preferred_term and no CL class: CL "preoptic" returns one cell class,
    CL:4072012 A15 dopaminergic neuron, with the remaining hits anatomical terms from UBERON
    and the brain atlases, and CL "thermoregulatory" returns nothing. Binding the A15
    population or a generic hypothalamic neuron would assert a cell identity the cited sources
    do not establish. The anatomical location (UBERON:0002625 median preoptic nucleus) is
    bound instead. Those searches were re-run against OLS immediately before commit.

    Phenotypes. Hot flashes (HP:0031217) and night sweats (HP:0030166), both verified against
    OLS, both with onset.onset_category PERIMENOPAUSAL - which section 19 added to OnsetEnum,
    and which is the right value here rather than POSTMENOPAUSAL because the stimulus is the
    rate of estrogen withdrawal and the SWAN cohort found premenopausal and early
    perimenopausal onset to predict the longest duration. Sleep disturbance (HP:0002360) is
    curated as a sequela of night sweats, graded INDIRECT, with the description stating that
    the attribution is partial and that the evidence is pharmacological rather than a
    demonstration that the sweats cause the fragmentation.

    Treatments and trials. Fezolinetant (NCIT:C171845) and elinzanetant (NCIT:C174774) as
    separate rows, because elinzanetant adds a neurokinin-1 arm and its programme measured and
    improved sleep disturbance. The MLE4901 proof-of-concept result is cited on the
    fezolinetant row as INDIRECT, through the shared target, and the transaminase rises that
    stopped its development are recorded in that row's notes. Four trial registrations
    (NCT04003155, NCT05042362, NCT05099159, NCT02668185) with phase and status read from the
    ClinicalTrials.gov API at curation time rather than written from memory.

    Progression and prevalence. Three progression phases carrying the SWAN duration data
    (median total 7.4 years, 4.5 years after the final menstrual period, 10.1 years in African
    American women) and the remission phase with the observation that a fresh estrogen
    withdrawal can reinstate the flushes. The prevalence record carries the two published
    figures as a range (70% to 80% of menopausal women), both quoted as BACKGROUND because
    both are framing sentences in papers whose own results are something else, with the
    denominator stated as menopausal women rather than the general population.

    Treatments deliberately not curated: menopausal hormone therapy, the SSRIs and SNRIs,
    gabapentin, oxybutynin and cognitive behavioural therapy. Each would need its own trial
    evidence, and hormone therapy would additionally need an account of the Women's Health
    Initiative risk findings; adding them on the strength of the cited reviews' passing
    mentions would put unsourced treatment rows in the entry. This is recorded in notes.

    Also recorded as out of scope: congenital TACR3 or TAC3 loss of function, which causes
    hypogonadotropic hypogonadism and which the module's notes forbid conforming to the KNDy
    node. It is named in the TACR3 gene descriptor so the distinction is visible where the
    gene is bound.

    Deep research. No `just research-disorder` provider was run. Five of the eleven references
    were already cached by the module (PMID:1708331, PMID:17488799, PMID:25683060,
    PMID:36924778, PMID:40454634) and are cited as primary papers, not as module content; the
    other six plus the four trial records were found by direct PubMed E-utilities search and
    fetched with `just fetch-reference`.


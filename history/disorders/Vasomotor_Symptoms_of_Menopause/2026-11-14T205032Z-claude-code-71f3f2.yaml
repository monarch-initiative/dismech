  summary: Backfill the clinical-trial reference titles
  details: |
    The four clinical_trials[].evidence items citing clinicaltrials:NCT records carried no reference_title, which the ungated whole-repo gate 'Check every evidence item has a reference title' fails on. Filled with scripts/backfill_reference_titles.py, which copies each title from the committed references_cache/clinicaltrials_NCT*.md frontmatter rather than typing it: NCT04003155, NCT05042362, NCT05099159, NCT02668185.

    Worth recording why this surfaced only now rather than on the PR's first CI run. The defect was present from the entry's first commit. The first run never reached the whole-repo gates step: it failed at the curation-scope step, which is the first step of the same job, because the PR touches kb/ together with the schema and the decision register. So the scope guard masked a real content gate for the whole first review round, and the gate only ran once the scope-override label let the job past it. A gate that cannot be reached reports nothing, not success.

    Validation after the fix: scripts/find_missing_reference_titles.py reports 0 gated findings (the three remaining findings are pre-existing and report-only - Restless_Legs_Syndrome, TOP2B-Related_Immunodeficiency_and_Congenital_Anomalies_Spectrum and the dopamine_receptor_agonism module, none touched by this PR). just validate-disorders passes on this file, check-duplicate-keys, check-block-scalar-comments, check-folded-yaml, check-folded-hyphens and check-enum-values all clean.

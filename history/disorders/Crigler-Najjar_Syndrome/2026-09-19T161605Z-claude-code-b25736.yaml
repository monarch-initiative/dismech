  summary: 'Genetics pass: bind UGT1A1 to both subtypes and record the allelic basis
    of the type 1/type 2 split'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12194, epic #12189). The
    genetics was re-derived from the primary literature before the issue's MONDO
    reconciliation checklist was opened. MONDO records UGT1A1 for both Crigler-Najjar
    type 1 (MONDO:0021020) and type 2 (MONDO:0011725); that gene was already curated
    and already wired to the glucuronidation-deficiency node, so the reconciliation
    was complete on the gene axis and the pass worked the allele axis instead.
    UGT1A1 is now bound as the gene of both has_subtypes rows, and three variant
    records were added: alleles abolishing activity (type 1), missense alleles with
    allele- and substrate-dependent residual activity (type 2, PMID:19830808 in
    vitro characterisation of ten missense mutants), and the UGT1A1*28 promoter
    TA-repeat allele shown in cis with structural alleles, recorded as a modifier
    rather than an independent cause. A top-level notes block was added recording
    the reconciliation and the verified absence of a GeneReviews chapter (checked
    offline against cache/bookshelf/genereviews.csv via just check-genereviews,
    which reports NO_CHAPTER). No second Crigler-Najjar gene was found. Validated
    with just validate, validate-terms, count-verified-snippets (25/25),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches, and
    validate-disorders.

  summary: 'Create: Crigler-Najjar Syndrome'
  details: |
    New entry filling a hepatobiliary gap: the severe end of the UGT1A1 activity-loss spectrum whose mild end (Gilbert's syndrome) was already curated. Modelled as one disease with two subtypes graded by residual enzyme activity (type 1 MONDO:0021020, type 2 MONDO:0011725), because the literature treats residual activity as the single variable distinguishing them. Three-node chain conforming across the unconjugated arm of the new bilirubin_conjugation_transport module. Subtype-restricted claims are kept explicit: kernicterus risk is assigned to type 1, and phenobarbital's efficacy is curated as an ACTIVATES link that applies only to type 2 because type 1 has no residual enzyme to induce. Liver transplantation is curated as ACTIVATES on the trigger node with post-transplant bilirubin normalisation as supporting evidence, and its costs recorded as PARTIAL. A KNOWLEDGE_GAP records that AAV gene therapy and autologous hepatocyte transplantation are investigational, with the paediatric vector-dilution problem stated. Validation: linkml-validate clean; linkml-term-validator passed; 21/21 evidence snippets verified against cached references.

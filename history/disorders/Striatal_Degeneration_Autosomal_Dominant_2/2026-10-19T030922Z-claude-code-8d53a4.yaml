  details: |
    Created the dominant PDE10A (GAF-B) disease entry, MONDO:0014835. Deep research: falcon was requested but returned 403 Failed to authenticate; the --fallback run moved to openscientist, which timed out after 3600 s and was cancelled. With the user's approval a claude_code report was then generated (research/Striatal_Degeneration_Autosomal_Dominant_2-deep-research-claude_code.md): 14/14 references resolved, 5/5 quotes valid, one harmless label paraphrase for MONDO:0044637. preflight-dr returned WARN only because the report cites the PDE10A gene MIM (610652) and the recessive disease MIM (616921) besides 616922; PDE10A is mentioned 57 times, so no entity confusion. Evidence comes from 9 primary and review papers with cached text (PMID:27058447 full text, 27058446, 29130591, 30345538, 31871190 full text, 18477562, 34155691 full text, 36805523, 38442915). PMID:28949041, 29165877 and 30777652 have no abstract and are not cited. The boundary with the recessive PDE10A disease (MONDO:0044637) is recorded as a differential diagnosis: it follows inheritance and phenotype rather than domain, because the homozygous GAF-B p.Asp295Asn family has the recessive phenotype (PMID:36805523). A matching boundary note was added to that disease's stub. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Validated with just validate, count-verified-snippets (all verified), check-entity-refs, check-causal-targets, check-enum-values and the other offline gates. A fresh-context review pass before the PR led to these changes: the pathograph root is now the GAF-B substitution itself, with the cAMP-binding defect and misfolding as parallel consequences, because PMID:31871190 attributes misfolding to the substitution rather than to lost cAMP binding; two edges were downgraded to INDIRECT_UNKNOWN_INTERMEDIATES; the PET node now cites PMID:31871190's statement that F300L carriers showed the decrease; the aggregation node binds GO:0070842 aggresome assembly; PDE8B differential features are cited (PMID:26769607, PMID:20085714); and the D295N in silico result is added to the misfolding-versus-stimulation knowledge gap.

  details: |
    Correction pass following an independent adversarial audit of PR #8325 at head 8cf34e0ceb0d98f2e31c229b08b2afdffc5f5a37. The audit returned CHANGES-NEEDED with thirteen findings. This record corrects two false claims made in the earlier REVIEW record, records the substantive content corrections applied to the entry, and notes three defects in the intervening provenance record. Neither earlier record is edited; both remain exactly as committed, and this record is the forward-only correction to both.

    === 1. TWO FALSE COUNTS IN THE REVIEW RECORD (2026-08-11T050627Z-claude-code-50112c.yaml) ===

    CORRECTION 1. That record states "~30 other disorder files carry animal_models without `name`". THAT NUMBER IS WRONG. The correct figure, measured across all 1925 files in kb/disorders/ with a full YAML parse, is 224 files. The claim was off by roughly 7.5x. Root cause: the counting command timed out and produced no output, and the number was then inferred from a different, head-50-truncated file listing. The figure is load-bearing, because the record uses it to size a deferred follow-up sweep -- a sweep scoped for 30 files is a different piece of work from one scoped for 224 -- so it is corrected here rather than left to a reader to discover.

    CORRECTION 2. That record states, under CHECKED AND LEFT ALONE, that therapeutic_modality BEHAVIORAL on the NCIT:C15240 genetic-counseling treatment "matches the three other KB entries using that term". THAT NUMBER IS WRONG AND THE INFERENCE DRAWN FROM IT WAS UNSOUND. Measured properly: 578 treatments across kb/disorders/ bind NCIT:C15240, of which 58 are tagged BEHAVIORAL, 37 OTHER, and 483 carry no therapeutic_modality at all. Root cause: the command was `grep -rl ... | head -40 | xargs grep -B6 ...`, capped at 40 files and 6 lines of context, so "3" was an artifact of truncation rather than a count. Two things follow. First, the count is wrong by roughly 19x. Second, and worse, it concealed a competing precedent: 37 entries tag the same term OTHER, so "matches existing convention" was never a safe basis for leaving the value unexamined. CLAUDE.md explicitly names NCIT:C15240 among the generic action terms that are "not in the mechanical table on purpose" and "needs a real per-entry look rather than a blind ID-based rule" -- the earlier review substituted a fabricated precedent count for exactly the per-entry look the guidance requires.

    Both errors are instances of the failure mode CLAUDE.md warns about under "Never claim a check you did not finish": a truncated or failed command reported as though it were a completed count. Note the contrast with the same record's validation figures, every one of which the auditor reproduced exactly (80/80, 66/66, 91.1%/91.6%, 10/14, 74 disorders / 125 unresolved targets, "No dataset accessions found", "Files updated: 0"). The pattern is that checks actually run were reported accurately and checks not run were estimated without being marked as estimates. The correct handling for an unmeasured quantity is to omit it or label it an estimate, not to state a number.

    RESOLUTION OF CORRECTION 2 ON THE MERITS. Having done the per-entry look: TherapeuticModalityEnum defines BEHAVIORAL as a "non-pharmacologic behavioral, physical, dietary, or lifestyle intervention". Genetic counseling is none of those four -- it is a risk-communication and decision-support service -- so the accurate value is OTHER, "modality not covered by the above categories". Changed to OTHER, with the reasoning and the 58/37/483 split recorded in the treatment's own notes field so the next curator sees it in place. A KB-wide reconciliation of this term is worth doing separately and is not attempted here.

    === 2. CONTENT CORRECTIONS TO THE ENTRY ===

    REMOVED THE NEURAL TUBE DEFECT CAUSAL EDGE (audit F3). The earlier review added a downstream edge from the pleiotropic-expression node to the Neural Tube Defect phenotype, carrying causal_link_type UNKNOWN and a single evidence item whose own explanation read "making the reported association biologically plausible without evidencing it". An edge whose sole evidence states in writing that it does not evidence the edge should not be in the graph. Two compounding problems, both now accepted: CausalLinkTypeEnum UNKNOWN is defined in the schema as "Directness has not yet been determined", so it presupposes the causal edge exists and hedges only its granularity -- it cannot carry a doubt about whether the edge exists at all, and using it that way made the edge assert MORE than intended; and the primary sources decline the claim themselves ("the possibility of association with neural tube defect is discussed"; "a neural tube defect has occurred in one presumed affected member"). The edge is deleted. Phenotype causal-inlink connectivity therefore falls from 10/14 to 9/14, and 9/14 is now stated in the entry notes as the honest figure. Self-flagging an edge as "the weakest edge in the graph" documents a problem without solving it.

    STRENGTHENED THE TWO REMAINING PLEIOTROPIC EDGES (audit F5). The Sensorineural Hearing Loss and Hematuria edges previously rested only on static YAP1 expression observations, which made two well-evidenced edges look like speculation. Each now leads with the actual causal claim -- the Williamson cosegregation sentence naming hearing loss and haematuria among the multisystem features segregating with the YAP1 allele at combined LOD 4.2 -- and retains the expression datum as a supporting PARTIAL item. The expression item on the hearing-loss edge was additionally upgraded to a better snippet: Holt et al. write that they "identified expression within the developing kidney and otic vesicle, consistent with its relevance to these additional phenotypes", i.e. the authors themselves make the correspondence claim, rather than the curator making it from a bare localisation. INDIRECT_UNKNOWN_INTERMEDIATES is retained as the correct link type for "A causes B but the steps are unknown".

    APPLIED THE evidence_source BACKGROUND-STATEMENT RULE CONSISTENTLY (audit F4). The earlier review established that a background statement of gene function takes evidence_source OTHER rather than HUMAN_CLINICAL, applied it to two items, and left structurally identical items untouched, so the entry ended up differently inconsistent rather than consistent. Three further items are now retagged: the DeYoung sentence on optic-fissure-closure developmental biology, which sits under the literal BACKGROUND heading of that abstract; the Ravine opening sentence about coloboma being usually sporadic, which is background rather than a result of the re-evaluation; and the Williamson "provides a plausible explanation" sentence, which is interpretive discussion. The third also carried a supports inconsistency the audit is right about: this entry marks "should result in NMD" and "likely results in NMD" as PARTIAL because the source hedges, but was marking "provides a plausible explanation" as SUPPORT. It is now PARTIAL/OTHER.

    REPLACED THE CIRCULAR RATIONALE FOR LEAVING INTELLECTUAL DISABILITY UNWIRED (audit F6). The earlier notes justified the exclusion by asserting that the pleiotropic node's correspondence set covers five organs "only". That is circular: brain IS inside the YAP1 embryonic expression domain, in both studies this entry cites -- the mouse whole-mount snippet on that very node reads "expressed in the eye, brain, and fusing facial processes", and Holt report "YAP1 expression in multiple regions of the developing human brain". The correspondence set had been written to exclude brain, so it could not then be cited as the reason for excluding brain. The conclusion was right and the reason was wrong. The rationale is now the authors' own: Holt et al. raise exactly this inference -- brain expression set beside reported intellectual disability in other YAP1 families -- and then caution that "such correlations must still be approached with caution". The notes record honestly that this caution is voiced about the autism-spectrum correlation in their own case and applies a fortiori here, and that the exclusion follows from the authors' caution rather than from the expression data.

    RE-BASED THE UVEAL COLOBOMA FREQUENCY BAND (audit F7). VERY_FREQUENT was derived from Kingston et al.'s "uveal colobomata being the most constant feature". That is a COMPARATIVE claim -- coloboma relative to the syndrome's other features -- not an absolute rate: coloboma in 9 of 12 subjects (75%) would still be the most constant feature while falling in FREQUENT. The band is retained but re-derived from the Orphanet definition under Pattern C of docs/frequency-evidence-guidelines.md: the entity is "characterized by" uveal coloboma while every other feature is qualified "variably associated", and defining/hallmark wording maps to VERY_FREQUENT (80-99%). The Kingston item's explanation now states explicitly that it supports the association and the variable-expressivity context but does NOT carry the band, and spells out the 9-of-12 counterexample so the reasoning is auditable. OBLIGATE remains rejected.

    SPLIT A BUNDLED MODEL READOUT (audit F8). The readout "Presence of coloboma and RPE deficiency in yap1 mutants" carried direction INCREASED while bundling two measurements that move in OPPOSITE directions -- coloboma incidence up, RPE cell number down. INCREASED was right for one and wrong for the other. Now two readouts: "Coloboma incidence in yap1 mutants" (INCREASED) and "Retinal pigment epithelium cell number in yap1 mutants" (DECREASED).

    ADDED A READOUT THAT ACTUALLY MEASURES ITS TARGET (audit F9, raised as SUSPECTED; accepted). The PERTURBS link targets "Reduced YAP-TEAD Transcriptional Output" but its only readout measured RPE-forming ability -- a cell-fate consequence, not transcriptional output. The schema check (readout.target == link.target) passes, but the readout did not measure the node. Added the Tead-responsive reporter transgene readout, which is the paper's direct measure of YAP-TEAD activity in the optic cup, and recorded no direction for it because the reporter localises activity in wild type and no mutant reporter measurement is reported. The RPE-ability readout is retained with its interpretation rewritten to say plainly that it measures the capacity the node's output confers rather than the output itself.

    MOVED THE ZYGOSITY CAVEAT ONTO THE STRONGER CLAIM (audit F10). The homozygous-null-versus-human-heterozygote limitation appeared only on the PERTURBS link and was absent from the RECAPITULATES link, which is the stronger claim and where a zygosity mismatch most undermines fidelity. It now leads that link's limitations.

    RECORDED THE DIFFERENTIAL-DIAGNOSIS EVIDENCE GAP EXPLICITLY (audit F11). just compliance reports differential_diagnoses[].evidence at 0.0% (0/7), and the earlier REVIEW record's claim to have audited "every clinical, mechanistic, diagnostic, treatment and genetic claim" did not cover those seven blocks, each of which carries specific checkable clinical assertions. Rather than overstate completeness or manufacture citations, the notes now name the unevidenced assertions block by block (CHARGE choanal atresia and semicircular canal hypoplasia, branchio-oculo-facial branchial skin defects, the cat-eye marker chromosome, PAX2 renal hypodysplasia with reflux, the Kabuki facies and fetal fingertip pads, Baraitser-Winter cortical malformations, MAC-spectrum heterogeneity) and state that none of the seven cached references supports any of them, that citing them would mean adding seven new references purely to support boundary prose, and that until that is done no claim is made that the differential blocks are evidence-backed. The evidence-first option was considered and deliberately not taken here: fetching seven new references to support prose is separately reviewable work, and the fabrication risk of sourcing boundary claims at speed is exactly what the evidence SOP warns against.

    CORRECTED THE AUDITOR'S NOTE ABOUT THE ORPHANET CACHE (audit F12). The note said the cached ORPHA_1473.md body "carries only the definition's first two sentences". It does not -- the MONDO and Orphadata texts are different definition texts of different vintages, opening differently ("is characterized by coloboma of the iris, bilateral cleft lip and palate" versus "A rare, genetic, multiple congenital anomalies/dysmorphic syndrome characterized by uveal coloboma (typically bilateral)"), not a full text and a truncation of it. A note written specifically to orient a future auditor must not describe a distinct text as a truncation, since that would send them looking for the case count further down the cached record. Corrected, with both openings quoted so the distinction is checkable.

    TWO SAFE SEMANTIC ITEMS FROM F13. The Microphthalmia edge cited an out-of-pedigree de novo case (PMID:35318877) when the entity's own pedigree source was already in the file; it now cites Ravine et al. ("autosomal dominant uveal coloboma and microphthalmos associated with cleft lip and palate"). And the Sensorineural Hearing Loss phenotype was bound to HP:0000407 when the more specific HP:0012781 "Mid-frequency hearing loss" exists and matches both the entry's own description and the cited snippet; rebound, with preferred_term "Mid-frequency sensorineural hearing loss" retaining the sensorineural qualifier the HPO label drops.

    NOT DONE, DELIBERATELY. The remaining F13 items are structural rather than semantic and are not attempted here: splitting the bundled "Uveal Coloboma and Colobomatous Microphthalmia" node, which carries two mechanistic claims and so strains the single-value biological_scale discipline; and the observation that several new edges re-quote evidence already present on the phenotype they point at, so the connectivity gain is partly achieved by duplication. Both are real and both want their own change with their own review.

    === 3. THREE DEFECTS IN THE PROVENANCE RECORD (2026-08-11T051431Z-claude-code-172152.yaml) ===

    That record is committed and is not edited; these are its forward-only corrections.

    (a) It states "The sections list is intentionally empty of KB content sections". The sections key is ABSENT from that record, not present-and-empty. The intent was right; the description of the artifact was wrong.

    (b) It states "The PR remains a draft with auto-merge disabled and no assignees". That was true when written and remains true now, but it freezes mutable GitHub state into an append-only artifact, where it will silently become false the moment the PR is marked ready. Live PR state does not belong in a history record; it belongs in the PR thread.

    (c) Its append-only argument overstates the documentation. It argued that docs/history.md's carve-out "does not extend to links", reasoning from the ABSENCE of a carve-out. What docs/history.md actually says is affirmative and narrower: once written, a record's target.slug and target.path are not rewritten later. It says nothing that freezes links either way. The append-only conclusion is still the right practice, but it rests on general append-only discipline, not on a specific documented prohibition, and the record should have said so. Relatedly, 2742 of the 4598 history records in this repo carry prs: [], so the condition that record was created to remedy is the repository's majority state; generalised, a dedicated second record per PR link would roughly double the history tree. A cheaper convention -- recording the PR link in the review record when the PR already exists, and otherwise letting the commit-to-PR mapping speak for itself -- would serve better, and is worth raising as a repository question rather than settled here.


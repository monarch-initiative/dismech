  summary: 'Review: YAP1 syndromic coloboma evidence, claim-evidence matching, and
    pathograph wiring'
  details: |
    Full-entry review of the YAP1 syndromic coloboma entry (MONDO:0007355 / OMIM:120433 / ORPHA:1473 / COB1), auditing every clinical, mechanistic, diagnostic, treatment and genetic claim against the seven cached references (PMID:7154042, PMID:9382148, PMID:24462371, PMID:26209646, PMID:28801591, PMID:35318877, ORPHA:1473). No reference cache file was created or edited; all seven were already cached and every snippet was read in its surrounding source context before being judged.

    Eligibility: the only prior history record for this slug is the 2026-08-01 CREATE (no REVIEW event), and no open PR or remote branch touches this file (the two coloboma-named branches, feat/microphthalmia-coloboma and goal/refverify-micro_coloboma, were diffed against origin/main and do not).

    BLOCKING DEFECT FIXED. The entry failed schema validation on main: animal_models[0] had no `name`, and `name` is an identifier slot on AnimalModel, so `just validate-disorders` -- exactly what CI runs on changed disorder files -- exited 1 before any of this review's changes. Any PR touching this file would have failed CI. Added `name: Zebrafish yap1 mutant, alone and with wwtr1 (taz)` plus `publication: PMID:26209646`. Note this is a KB-wide pattern, not unique to this entry (~30 other disorder files carry animal_models without `name`); only this file was fixed, since the rest are out of scope for a single-entry review.

    CLAIM-EVIDENCE CORRECTIONS. Two evidence items asserted more than their source does.

    (1) The strongest finding. In the `genetic` block, the Holt et al. item quoting "In addition to the eye anomalies, affected members of one family also exhibited variable extraocular features..." was tagged SUPPORT / HUMAN_CLINICAL with the explanation "Independently corroborates the YAP1 syndromic phenotype attribution." Reading the cached full text shows the sentence sits in Holt et al.'s introduction and carries their own citations 7 and 8 -- it is a secondary citation of Williamson et al., not an observation of Holt's. It is therefore not independent corroboration. This also contradicted the entry's own notes block, which already recorded that "Holt et al. 2017 cite Williamson together with a second report for the extraocular features of that family", and it was inconsistent with how the same entry treats an identical secondary citation on the Hematuria phenotype (correctly PARTIAL, with the reason spelled out). Changed to PARTIAL / OTHER with the citation structure stated in the explanation.

    (2) The Hippo-pathway edge cited "YAP1 encodes an effector of the HIPPO-pathway-induced growth response" as HUMAN_CLINICAL. That is a background statement of gene function, not a clinical result. Changed to OTHER, matching the entry's own precedent one node below, where the equivalent Holt et al. background sentence is already tagged OTHER with that reasoning given.

    OVERSTATEMENT HEDGED. The top-level description asserted flatly that Williamson et al. found the YAP1 variant "in this family", i.e. the same pedigree as the 1982 and 1997 reports. The entry's own notes block concedes that family identity across the three reports "is inferred, not stated in any abstract" and should be treated as strong-but-not-proven. The description now names the syndromic pedigree (family 132) and carries the inference caveat, so the summary no longer claims more than the notes concede.

    COMPLETENESS: PATHOGRAPH WIRING. `just compliance-connectivity` scored this entry 0/14 phenotypes connected -- the mechanism graph terminated one step short of every clinical feature, so no phenotype had an inbound causal edge. Added ten `downstream` edges, each with its own exact cached-snippet evidence and an honest causal_link_type:
      - Uveal Coloboma and Colobomatous Microphthalmia -> Uveal Coloboma, Iris Coloboma, Chorioretinal Coloboma, Optic Disc Coloboma, Microphthalmia (all DIRECT).
      - Impaired Fusion of the Facial Processes and Palatal Shelves -> Cleft Lip, Cleft Palate (DIRECT).
      - Pleiotropic YAP1 Requirement -> Sensorineural Hearing Loss and Hematuria (INDIRECT_UNKNOWN_INTERMEDIATES, evidence PARTIAL) and Neural Tube Defect (UNKNOWN, PARTIAL). These three make explicit, in machine-readable form, the one-to-one expression-domain correspondence the node description already asserted in prose; each edge description states that the support is an expression correlate, not a demonstrated causal chain. Connectivity is now 10/14.

    COMPLETENESS: MODEL LINKED INTO THE PATHOGRAPH. The zebrafish model declared no `modeled_mechanisms`, so per graph.py it was not a pathograph node at all -- a disconnected list entry. Added two ModelMechanismLinks with fidelity, limitations, readouts and two evidence layers: PERTURBS against Reduced YAP-TEAD Transcriptional Output (limitation: homozygous null and double mutants model a far deeper loss than a human heterozygous nonsense allele, so the model addresses the direction of the lesion, not its dose) and RECAPITULATES against Failure of Optic Fissure Closure (limitation: zebrafish morphogenesis is not the human weeks-5-to-7 window, and the model does not reproduce the clefting, hearing-loss, haematuria or intellectual-disability arms). Each readout repeats its link's target as the schema requires.

    FOUR PHENOTYPES DELIBERATELY LEFT UNCONNECTED, now documented as item (7) of the notes block rather than left as a silent gap: Cataract and Impaired Extraocular Movement (recorded in the entity's ocular spectrum, but neither is an optic fissure closure defect and no source explains either from reduced YAP1 dose) and Intellectual Disability and Specific Learning Disability (the pleiotropic node's correspondence claim covers retina, otic vesicle, palatine process, neural tube and renal tubules only; a brain-expression-to-cognition edge would exceed the evidence). Wiring any of these would assert mechanism the sources do not supply.

    AUDITABILITY NOTE ADDED. The notes block cited an "Orphanet definition citing 12 cases from three generations of a single family". That sentence is real but lives in the MONDO:0007355 definition text (attributed to Orphanet:1473); it is NOT in the Orphadata bulk-snapshot body cached as ORPHA_1473.md, which carries only the first two sentences of the definition plus cross-references. It is therefore not quotable as an ORPHA:1473 snippet, which is why the prevalence record cites PMID:7154042 for the count. Recorded so a later auditor does not go looking for it in the cache. Verified independently with `runoak -i sqlite:obo:mondo info MONDO:0007355 -O obo`, which also re-confirmed the entity identity (OMIM:120433, Orphanet:1473, RO:0004003 HGNC:16262 YAP1) and the glaucoma/ptosis features the notes already flag as uncitable from the current cache.

    Also completed the top-level `references:` list, which named only three of the seven sources actually cited; added PMID:26209646, PMID:28801591, PMID:35318877 and ORPHA:1473 with titles taken verbatim from their cache frontmatter.

    CHECKED AND LEFT ALONE. HP:0000589 Coloboma is the most specific HPO term available (HPO has no "uveal coloboma"). therapeutic_modality BEHAVIORAL on the NCIT:C15240 genetic-counseling treatment matches the three other KB entries using that term. The VERY_FREQUENT band on Uveal Coloboma is a documented departure from the frequency-mapping table, already justified in place, and the FREQUENT band on Specific Learning Disability derives correctly from the "one third of those affected" count. All snippets were re-read in cached context, including every full-text snippet from PMID:28801591 (a full_text_xml cache), and all remain exact.

    VALIDATION ACTUALLY RUN, with output read in each case:
      - `just validate-disorders <file>` (the batched schema + terms + references sweep CI runs): exit 0, "No issues found", "Validation passed", "All validations passed!", "Snippets checked: 80/80 verified against cached references". Before this review the same command exited 1 on the animal_models schema error.
      - `just count-verified-snippets <file>`: 80/80 verified (66/66 before the additions).
      - `just validate-graphs`: whole-KB sweep; this entry is NOT among the 74 disorders with integrity issues, i.e. all ten new edge targets resolve. The 74 failures and 125 unresolved targets are pre-existing on main in other files and untouched here.
      - `just verify-datasets <file>`: "No dataset accessions found" (the entry curates no datasets; none were added).
      - `just compliance <file>`: 91.1% global / 91.6% weighted before the review; connectivity 0/14 -> 10/14.
      - `just validate-history <this record>` and `just validate-history-all`.
      - Targeted pytest over tests/test_data.py covering model-readout target matching, animal models, graph integrity, foreign keys, history layout and uniqueness.

    Only two files are touched: the disorder YAML and this history record. `git status` showed no validator churn to restore -- the cache-normalization step in validate-disorders reported "Files updated: 0" and left references_cache/ and cache/ clean.

    Left for a follow-up, deliberately not done here: the missing `name` on animal_models in roughly thirty other disorder files is the same latent CI failure and wants its own sweep.

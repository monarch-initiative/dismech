  summary: 'Create: Uveal Coloboma-Cleft Lip and Palate-Intellectual Disability Syndrome'
  details: |
    De novo curation of MONDO:0007355 / OMIM:120433 / ORPHA:1473 / COB1, from GitHub issue #7711.

    NEC preflight: MONDO:0007355 verified with OAK before any content was written - label, OMIM:120433 xref, Orphanet:1473 xref, and the RO:0004003 HGNC:16262 YAP1 gene association - and independently against a freshly built references_cache/ORPHA_1473.md, which lists OMIM:120433 and MONDO:0007355 as exact matches. CHARGE syndrome (CHD7), cat-eye syndrome, branchio-oculo-facial syndrome (TFAP2A), COACH/Joubert and Baraitser-Winter were explicitly excluded; all but COACH/Joubert are recorded as differential_diagnoses so the boundary is auditable.

    Duplicate preflight: origin/main kb/disorders, all PRs and all issues searched by MONDO ID, preferred label and synonyms - no existing coverage.

    Deep research: Edison / falcon via just research-disorder, 528 s, 12 citations, 1 artifact. The report was read in full and checked for drift onto CHARGE or generic coloboma; none was found, and its own conclusions - YAP1, OMIM 120433, haploinsufficiency, single-family basis - match the independently verified identity. The report also surfaced the foundational Kingston 1982 paper, whose PMID (7154042) was recovered through the PMC ID converter from the DOI the report supplied; its abstract independently confirms the twelve-subjects-over-three-generations basis of the entity.

    Curated content: a seven-node pathograph running YAP1 haploinsufficiency, reduced YAP-TEAD Hippo output, failure of optic fissure closure, and uveal coloboma with colobomatous microphthalmia, plus a pleiotropic-expression node carrying the shared developmental mechanism that links optic fissure closure failure to facial process fusion failure (mouse Yap1 in the fusing facial processes; human embryonic YAP1 in retina, otic vesicle, lateral palatine process primordium, neural tube and renal tubules) and a HYPOTHETICAL alternative-transcription-start-site severity modifier with a matching EMERGING mechanistic_hypotheses group. Also fourteen phenotypes, the YAP1 genetic block, the c.1066G>T p.Glu356* variant, autosomal dominant inheritance with VARIABLE expressivity, a molecular-genetic-testing diagnosis entry, two KNOWLEDGE_GAP discussions with proposed experiments, seven differential diagnoses, and the zebrafish yap1/wwtr1 animal model.

    Deliberately kept small, per the ultra-rare single-family scope of the entity: only genetic counselling under treatments, and no prevalence rates, biomarkers, histopathology, imaging findings, clinical trials, or module conformance. Each omission is justified in the entry notes block. No GeneReviews chapter exists for YAP1 or for this syndrome.

    Evidence discipline: five PMIDs (7154042, 9382148, 24462371, 28801591, 35318877) plus ORPHA:1473, all obtained with just fetch-reference and just structured-rebuild-orphanet; no cache file was hand-written or hand-edited.

    Validation: just validate, just validate-terms and just validate-references all pass, with 66/66 snippets verified against cached references.

  details: |
    Second correction pass, following a fresh independent adversarial audit of PR #8325 at head 5491d95b2a0350aa39c1138e42906bb18710674e. That audit returned CHANGES-NEEDED and found that the FIRST correction pass, while fixing most of what it claimed, introduced new defects of its own. This record corrects those, withdraws a frequency band that should never have been kept, fills two schema slots the entry had left empty, and corrects two false statements in the immediately preceding history record. No previously committed history record is edited; all three remain byte-identical, and this is the forward-only correction to the third of them.

    === 1. TWO FALSE STATEMENTS IN THE PRECEDING RECORD (2026-08-11T055737Z-claude-code-cbd76c.yaml) ===

    CORRECTION A -- THE CACHE CLAIM IS FALSE. That record ends: "No reference cache file and no term cache file was created, edited or regenerated in this pass." That is untrue of the commit which carries it. `git log --oneline 9c71607ed1..5491d95b2a -- cache/` returns exactly one commit -- 5491d95b2a, that same pass -- which added the row `HP:0012781,Mid-frequency hearing loss,2026-08-10T22:51:57.888910` to cache/hp/terms.csv and the CURIE HP:0012781 to cache/enums/phenotypeterm_939f99dde0f5.csv. Both rows were written by linkml-term-validator as a side effect of `just validate-terms`, in canonical sorted position, with the ontology's own label and a real timestamp; no cache file was hand-written or hand-edited, and the underlying data are sound. So this is a provenance-accuracy defect rather than a data-integrity one -- but it is a flatly false statement inside an append-only record whose stated purpose was correcting false statements, which is the worst place for one. The accurate sentence would have been: "No cache file was hand-edited; cache/hp/terms.csv and one enum membership cache gained an HP:0012781 row as validator output, and those rows are committed per the CLAUDE.md rule that term caches are required for deterministic CI."

    CORRECTION B -- THE NCIT:C15240 SPLIT WAS STALE THE MOMENT IT WAS WRITTEN. That record, and the treatment notes it describes, stated "of 578 treatments bound to NCIT:C15240, 58 are tagged BEHAVIORAL, 37 OTHER and 483 carry no modality". 578 and 483 are right. 58/37 was the split BEFORE that same pass retagged this entry's treatment from BEHAVIORAL to OTHER. Measured now, with the change in place: 57 BEHAVIORAL, 38 OTHER, 483 unset. The note described the knowledge base as it was before its own edit. This is the third count error in three passes and the second to ship inside a commit titled as a correction of count errors, so the entry note is now both corrected and date-stamped, and states explicitly that such counts drift with every entry touching the term. The general lesson, recorded here rather than left implicit: a census taken to justify an edit must be retaken after the edit, or expressed in a form that does not go stale.

    === 2. DEFECTS THE FIRST CORRECTION PASS INTRODUCED, NOW FIXED ===

    N3 -- REVERTED AN HPO REBINDING THAT WAS A REGRESSION, NOT A REFINEMENT. The first pass rebound the Sensorineural Hearing Loss phenotype from HP:0000407 to HP:0012781 on the stated ground that HP:0012781 is "the more specific" term. It is not. Verified with OAK: `runoak ancestors -p i HP:0012781` returns HP:0000365 Hearing impairment and its ancestors, and does NOT pass through HP:0000407; `runoak descendants -p i HP:0000407` does not contain HP:0012781. The two are SIBLINGS on orthogonal axes -- audiometric frequency band versus sensorineural mechanism -- so the swap did not refine the annotation, it exchanged one axis for another and silently dropped the sensorineural claim from the only machine-readable slot that carried it. That axis is the load-bearing one for this entity: MONDO:0007355's definition says sensorineural, the disease synonyms say sensorineural, the title of PMID:9382148 says sensorineural, and both the phenotype and the pathophysiology node are named Sensorineural Hearing Loss with an otic-vesicle rationale. Reverted to HP:0000407 with preferred_term "Mid-frequency sensorineural hearing loss", which is the documented CLAUDE.md pattern for a preferred_term carrying more granularity than the bound ontology term. CONSEQUENCE FOR THE CACHE, stated because it is visible in the PR diff: the HP:0012781 rows added by the previous commit are now unused by this entry. They are left in place. They are valid validator-generated rows -- the CURIE exists, the label matches the ontology, the sort position is canonical -- and hand-removing rows from a generated cache is exactly what the CLAUDE.md term-cache rule forbids. An unused label/membership row is inert; a hand-edited cache is not.

    N1 -- CORRECTED THE STALE COUNT INSIDE THE ENTRY (see Correction B above for the numbers and the reasoning).

    N5 -- STOPPED ATTRIBUTING "COSEGREGATING" AND "LOD 4.2" TO A SNIPPET CONTAINING NEITHER. The first pass added the Williamson snippet "highly variable multisystem involvement, including hearing loss, intellectual disability, hematuria, and orofacial clefting" to two edges and explained each as "the causal claim itself: ... is part of the phenotype cosegregating with the YAP1 loss-of-function allele (combined LOD 4.2)". Read in the cached abstract, that clause belongs to the phenotype-CONTRAST sentence; "cosegregating" is in the preceding sentence and "A combined LOD score of 4.2" in the following one. The underlying claim is true of the paper and both those sentences are quoted correctly elsewhere in this entry, so this was over-attribution rather than fabrication -- but an explanation must describe the snippet it is attached to. Both explanations now say what the snippet actually is and point to the inheritance block for the cosegregation and LOD statements.

    N4 -- WIRED INTELLECTUAL DISABILITY, RESOLVING AN INCONSISTENCY THE FIRST PASS CREATED. Williamson et al. name FOUR features in that one sentence: hearing loss, intellectual disability, haematuria, orofacial clefting. After the first pass, three of the four were wired into the pathograph on the strength of that sentence and the fourth was excluded -- on Holt et al.'s caution, which is about reading cognition off brain-expression data. That caution addresses the mechanistic route; it says nothing about the disease-level attribution the other three edges actually rest on. Before the first pass the exclusion was coherent, because all of these features rested on expression alone; upgrading three of them to the disease-level sentence made it incoherent. Intellectual Disability is therefore now wired from the pleiotropic node on the same footing as its siblings, INDIRECT_UNKNOWN_INTERMEDIATES, with two evidence items: the Williamson sentence (SUPPORT), and Holt's "such correlations must still be approached with caution" carried as a PARTIAL QUALIFYING item. The edge description states in terms that the mechanism is NOT claimed and that no route through brain expression is asserted. Connectivity moves from 9/14 to 10/14, and the notes now state a single wiring rule -- wire a phenotype when a source states it is a feature of the disease caused by the YAP1 allele, otherwise do not -- so the four remaining exclusions can be checked against one criterion instead of four ad hoc ones. Specific learning disability stays unwired, and the notes now give the actual reason: it rests on Ravine et al.'s "one third of those affected" observation, which this entry deliberately keeps separate from the intellectual-disability claim, and wiring it on the Williamson sentence would silently merge the two claims the phenotype split exists to keep apart.

    N6 -- NOT ACTED ON, DELIBERATELY. The audit noted (as SUSPECTED) that the new Tead-reporter readout still does not measure YAP-TEAD output in the PERTURBED animals, since the reporter localises activity in wild type, and suggested moving the RPE-cell-number readout from the RECAPITULATES link to the PERTURBS link. That suggestion is not obviously right -- RPE cell number is the fate outcome that accompanies the coloboma being scored on the RECAPITULATES link, and moving it would weaken that link to make a point about the other -- and the cached abstract reports no mutant reporter measurement to put in its place. Left as it stands, with the readout's own interpretation already stating plainly that no mutant reporter measurement is reported. Recording the disagreement rather than silently declining it.

    === 3. THE FREQUENCY BAND IS WITHDRAWN, NOT RE-JUSTIFIED ===

    The first pass kept VERY_FREQUENT on Uveal Coloboma and re-derived it from Orphanet's "characterized by uveal coloboma" as hallmark wording under Pattern C. The audit rejected that, and it is right. "Characterized by" is not one of the frequency terms in the Pattern C table; it is the genus-differentia construction that opens essentially every Orphanet definition, so mapping it to VERY_FREQUENT would make the band vacuous by construction across the whole knowledge base. Worse, it repeats the exact defect it was meant to repair: "characterized by X, variably associated with Y" is a COMPARATIVE contrast between coloboma and the other features, just as "most constant feature" was. And diagnostic: true on the same phenotype makes the circularity plain -- if coloboma is how the entity is recognised, then every ascertained case has it, which measures ascertainment rather than penetrance of the allele. No numerator or denominator for the coloboma exists in any cached source. Per docs/frequency-evidence-guidelines.md -- "When in doubt, omit the frequency. A missing frequency is honest; a fabricated one is not." -- the frequency slot is now absent. Both evidence items keep their snippets and now state explicitly what they do and do not support: the association and the cardinal/diagnostic status, yes; a frequency band, no. The withdrawn Pattern C reading is recorded in place so a future curator does not re-derive it.

    === 4. TWO SCHEMA SLOTS FILLED FROM EVIDENCE ALREADY PRESENT ===

    Inheritance.penetrance: INCOMPLETE. The inheritance block already argued incomplete penetrance at length in prose and already carried the evidence for it -- the Holt et al. item recording a YAP1 loss-of-function allele "identified in the heterozygous state in the asymptomatic father". The enum value was simply never set, so the claim was invisible to any query. Set from the evidence already in the block; no new claim.

    Variant.type: nonsense, Variant.clinical_significance: PATHOGENIC, and Variant.functional_effects with function LOSS_OF_FUNCTION. All three were asserted in the entry's prose and none was in a machine-readable slot. A second Williamson evidence item ("two different cosegregating heterozygous nonsense mutations") is added as the basis for the nonsense type and the pathogenic call. The explanation states the limit of that call honestly: it is the authors' segregation-based attribution -- a nonsense allele in an established disease gene, cosegregating with the phenotype -- and NOT a formal ACMG/AMP classification, which no cached source reports. LOSS_OF_FUNCTION is likewise sourced rather than assumed: the independent de novo YAP1 case is argued on haploinsufficiency, and no cached source proposes a dominant-negative or gain-of-function mechanism for any YAP1 coloboma allele. Nothing here broadens beyond what the cached evidence carries.

    Note on snippet selection for the added item: the fuller quotation including the bracketed protein consequences was tried first and rejected by the reference validator, which strips bracketed spans before matching, so the committed snippet is the shorter bracket-free clause. Recorded because the same trap will catch the next curator quoting a variant sentence.

    === 5. AUDIT FINDINGS NOT ACTED ON, WITH REASONS ===

    G3 (biological_scale: ORGANISM on the bundled coloboma/microphthalmia node) is downstream of splitting that node, which remains deferred as previously recorded; changing the scale tag without splitting would move a symptom.
    G4 (discussions[].proposed_experiments[].evidence and .datasets at 0/3) is real and is the same class of gap as the differential_diagnoses one already recorded in notes item (8). Not curated here: proposed experiments are hypothetical by construction, and it is not clear that a proposed experiment should carry evidence at all, which is a schema question rather than a curation gap for this entry.
    G5 (the mondo_mappings skos:exactMatch pointing at the entry's own disease_term) is harmless and already justified in place as NEC-preflight corroboration.
    The two structural deferrals stand: splitting the bundled node, and de-duplicating the edges that re-quote evidence already present on their target phenotype.


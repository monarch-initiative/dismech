  summary: 'Round-2 review fix: split breast risk management, add ARID1A (PR #7636)'
  details: |
    Addresses the single remaining blocker from claude-review round 2 on PR #7636, plus one non-blocking suggestion.

    Blocker: the treatment 'Breast Surveillance or Risk-Reducing Mastectomy for Female CDH1 Carriers' bundled a prophylactic operation under action_category SCREENING with therapeutic_modality DEVICE and NCIT:C15406 Cancer Screening. Bilateral risk-reducing mastectomy is neither screening nor a device, and as curated a query for surgical prophylaxis in CDH1 carriers would have missed it entirely - in the entry's own highest-stakes content. Split into two treatments following the established repo pattern in Hereditary_Breast_and_Ovarian_Cancer_Syndrome, Cowden_Syndrome and Li-Fraumeni_Syndrome: 'Breast Surveillance for Female CDH1 Carriers' (SCREENING / DEVICE / NCIT:C15406) and 'Risk-Reducing Bilateral Mastectomy for Female CDH1 Carriers' (THERAPEUTIC / SURGERY / NCIT:C94445 Prophylactic Mastectomy, verified with OAK), the latter carrying a target_mechanisms INHIBITS edge on the CDH1 node as the breast counterpart of prophylactic total gastrectomy. The single IGCLC snippet supports both halves and is cited on both.

    Non-blocking suggestion taken: added ARID1A to genetic (hgnc:11110, SOMATIC_DRIVER, EBV-positive subtype) with a snippet-verified TCGA figure quantifying mutation in 55% of EBV-positive tumours and noting the characteristic rarity of TP53 mutation in that class. ARID1A was also added to the EBV pathophysiology node's genes so it is wired into the pathograph, keeping gene-to-mechanism coverage at 100%.

    Noted for the reviewer: the suggestion to cross-reference Gastric_Ulcer from the benign-ulcer differential was already implemented in the initial commit.

    Validation: just validate PASS, just validate-terms PASS, just validate-references PASS with 111/111 snippets verified, compliance 86.0%, compliance-connectivity fully connected (9/9 phenotypes, 11/11 causal genes), pytest -k Gastric_Adenocarcinoma 9 passed. Entry now has 18 pathophysiology nodes, 14 treatments, 11 genes and 111 evidence items.

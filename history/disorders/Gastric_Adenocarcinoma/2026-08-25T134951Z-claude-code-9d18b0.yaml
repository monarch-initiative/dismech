  summary: Link tobacco smoking into the Correa cascade and add the EBV exposure (#8302)
  details: |
    Companion to the Metastatic_Gastric_Cancer work for issue #8302, whose scope is that exposures should be present and pathograph-linked wherever appropriate. Two gaps here: the 'Tobacco smoking' exposure had no influences_mechanisms at all, and there was no environmental entry for Epstein-Barr virus even though the entry models an 'EBV-Driven Hypermethylation and Checkpoint Ligand Amplification' node. Linked smoking into 'Gastric Intestinal Metaplasia' as PREDISPOSES/INDIRECT_UNKNOWN_INTERMEDIATES, evidenced by the stage-resolved Wuwei cohort (PMID:36713177), which places smoking specifically at the atrophy-to-metaplasia transition, plus the cohort meta-analysis PMID:18293090 as PARTIAL because its endpoint is gastric cancer rather than the metaplastic step; the meta-analysis was also added at entry level, where the only prior evidence was an indirect GLOBOCAN risk-factor listing. Added an 'Epstein-Barr virus infection' exposure bound to ECTO:3000001 exposure to virus (ECTO has no Epstein-Barr or gammaherpesvirus exposure class as of 2026-08-25; same binding as the EBV exposure in Multiple_Sclerosis), evidenced by PMID:35963539 and PMID:32487043, and linked TRIGGERS/DIRECT into the EBV node with the TCGA snippet (PMID:25079317) that defines the node's features as properties of EBV-positive tumours. Validated with just validate (120/120 snippets verified), just validate-terms and the batched just validate-disorders sweep.

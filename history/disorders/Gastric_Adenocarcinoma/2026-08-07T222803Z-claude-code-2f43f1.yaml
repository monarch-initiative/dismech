  summary: Link H. pylori and dietary salt to the Correa first step
  details: |
    Backfill for issue #8085. Both linked exposures target the Helicobacter pylori chronic active gastritis node, the first step of the Correa cascade, and both cite the same Correa sentence already curated on that node, which states that the initial stages of gastritis and atrophy have been linked to excessive salt intake and infection with Helicobacter pylori. That sentence names each exposure and the node's own process, which is what earns supports SUPPORT rather than the disease-level grade used elsewhere in this tranche. The two are separated on the effect axis: the infection is TRIGGERS with DIRECT because the gastritis is its direct consequence, while salt is EXACERBATES with DIRECT because it injures the mucosa and potentiates colonisation but does not by itself cause the gastritis. Tobacco smoking was deliberately left unlinked. Its only evidence item quotes a GLOBOCAN sentence about targeting key cancer risk factors that never names gastric cancer, and the entry's own explanation already calls it indirect with the gastric-specific risk magnitude unquantified. The entry description asserts smoking is an established risk factor at both cardia and non-cardia sites, but no cited sentence supports that, so the gap is left visible rather than papered over with a link. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 114 of 114 verified.

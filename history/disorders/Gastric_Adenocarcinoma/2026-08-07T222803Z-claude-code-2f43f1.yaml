  summary: Link H. pylori and dietary salt to the Correa first step
  details: |
    Backfill for issue #8085. Both linked exposures target the Helicobacter pylori chronic active gastritis node, the first step of the Correa cascade, and both cite the same Correa sentence already curated on that node, which states that the initial stages of gastritis and atrophy have been linked to excessive salt intake and infection with Helicobacter pylori. That sentence names each exposure and the node's own process, which is what earns supports SUPPORT rather than the disease-level grade used elsewhere in this tranche. The infection link carries a second item, the sentence naming Helicobacter pylori as the main risk factor for the onset of gastric neoplasms, graded PARTIAL because it reaches the disease at the end of the cascade rather than the gastritis node. The two links are separated on both axes: the infection is TRIGGERS with DIRECT because the gastritis is its direct consequence, while salt is EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES because mucosal injury and the enhanced colonisation that follows are intervening steps that are understood but are not nodes in this graph. Tobacco smoking was deliberately left unlinked. Its only evidence item quotes a GLOBOCAN sentence about targeting key cancer risk factors that never names gastric cancer, and the entry's own explanation already calls it indirect with the gastric-specific risk magnitude unquantified. The entry description asserts smoking is an established risk factor at both cardia and non-cardia sites, but no cited sentence supports that, so the gap is left visible rather than papered over with a link. Validated with linkml-validate and just validate-terms; The same truncated fragment, which began after the sentence's subject and so never named the organism, appeared twice more in blocks this change did not otherwise touch, under the sporadic inheritance evidence and under the Helicobacter pylori exposure's own evidence. Both were replaced with the complete sentence as well, since leaving a known-bad quote in place because it sits outside the diff is how it becomes permanent. Their supports grades were left alone: both back disease-level claims that the full sentence does state. just count-verified-snippets reports 114 of 114 verified.

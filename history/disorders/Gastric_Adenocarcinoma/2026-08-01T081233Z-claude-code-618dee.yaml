  summary: 'Create: Gastric Adenocarcinoma (MONDO:0005036)'
  details: |
    De-novo curation of gastric adenocarcinoma as the histologic PARENT entry (MONDO:0005036), which was previously unused in the KB despite four adjacent aspect-specific gastric entries existing (Gastric_Cancer_H_pylori_Associated, HER2_Positive_Gastric_Cancer, EBV_Associated_Gastric_Cancer, Metastatic_Gastric_Cancer). Those are cross-referenced rather than duplicated; the boundary rationale is recorded in the entry notes.

    Deep research: 'just research-disorder falcon Gastric_Adenocarcinoma' (Edison/Falcon, 605 s, 43 citations). The report deliberately supplied DOIs rather than PMIDs; all five were resolved via the PMC ID Converter and every resulting title was checked against the cached record before use. No fabricated identifiers were detected in this run.

    Mechanism graph (16 nodes, all carrying biological_scale and role) models the two Lauren routes SEPARATELY rather than blending them: (1) the intestinal-type Correa cascade - H. pylori chronic active gastritis -> CagA/VacA delivery -> pro-tumorigenic inflammatory microenvironment -> atrophic gastritis and achlorhydria -> intestinal metaplasia -> dysplasia -> invasive carcinoma; and (2) the diffuse-type route - CDH1/CTNNA1 inactivation -> loss of epithelial cohesion and signet-ring formation -> diffuse infiltrative growth/linitis plastica, amplified by RHOA gain-of-function and CLDN18-ARHGAP fusion. Both converge on a shared peritoneal dissemination outcome node. Four further nodes carry the TCGA molecular classes and the checkpoint-engagement therapeutic vulnerability.

    Module conformance claimed: tumor_promoting_inflammation (Chronic Inflammatory Stimulus, Pro-Tumorigenic Inflammatory Microenvironment) - the module names H. pylori gastritis preceding gastric cancer as its archetype; invasion_and_metastasis (EMT Activation, Metastatic Colonization) - E-cadherin loss is the module's canonical initiating lesion; genome_instability_mutation (Mutator Phenotype and Chromosomal Instability) for both the MSI and CIN classes, which that node explicitly covers.

    has_subtypes deliberately carries THREE orthogonal axes with distinct classification values: histological_lauren (Intestinal/Diffuse/Mixed), molecular_tcga (EBV-positive/MSI/GS/CIN) and hereditary (HDGC). The Lauren and TCGA axes are explicitly documented as cross-cutting and non-interchangeable; the GS subtype description quotes TCGA's own 'enriched for the diffuse histological variant' wording to make the point that the relationship is association, not identity.

    HDGC and the prophylactic-gastrectomy recommendation are curated as the highest-stakes actionable content, including the moving threshold: the IGCLC 2020 guideline still recommends risk-reducing total gastrectomy for pathogenic CDH1 carriers, but now accepts expert-centre endoscopic surveillance for those who defer, and the revised 13-19% lifetime advanced-DGC risk estimate is quoted alongside. CTNNA1 is curated as moderate-penetrance and explicitly flagged as not manageable by extrapolation from CDH1.

    Boundary handling: gastric MALT lymphoma and gastroesophageal junction adenocarcinoma are modelled as structured differential_diagnoses with bound disease_terms, NOT as subtypes, with explicit distinguishing features. Juvenile polyposis gastric risk is curated as SMAD4-specific after evidence showed BMPR1A carriers do not share it.

    Ontology work: several DR-suggested or recalled IDs were rejected on inspection - NCIT:C152960 (Zolbetuximab) is a Retired Concept 2019 (used NCIT:C85475 instead); GO:0006306 is 'obsolete DNA methylation' (used GO:0045814); MONDO:0004954 is 'obsolete malt lymphoma' (used MONDO:0007650). Two genuine ontology gaps are documented in the entry notes: no signet-ring-cell term exists in the NCIT histopathology branch backing the HistopathologyFindingTerm enum, and NCIT:C3190 Linitis Plastica sits outside that branch.

    Validation: just validate PASS; just validate-terms PASS; just validate-references PASS with 97/97 snippets verified against cached references; just compliance 88.9% weighted 88.8%; just compliance-connectivity reports the file fully connected (9/9 phenotypes with a causal inbound edge, 10/10 causal genes wired to a mechanism). The ~7,600-file references_cache reformatting churn (issue #7393) was reverted; only the 19 newly fetched cache files and 38 new term-cache rows are staged.

  summary: 'Review response: drop cross-Lauren-route edge, correct smoking effect
    to PREDISPOSES'
  details: |
    Addressed the three blocking findings in ai4c-reviewer's CHANGES_REQUESTED review of PR #8504.

    1. Dropped the "Gastric Carcinogenesis Substrate -> E-Cadherin Loss and Diffuse Invasion" downstream edge. The Correa cascade quoted on the node is the intestinal-type carcinogenesis route; diffuse-type gastric cancer arises via CDH1/E-cadherin loss without passing through atrophy and intestinal metaplasia. Gastric_Adenocarcinoma.yaml states this in its own description ("Two largely distinct routes converge on the same organ"), so the edge asserted a lineage the KB's sibling entry denies. That claim was verified in the sibling file before the edge was removed.

    2. Removing the edge also removes the second finding: that edge's PMID:41710815 snippet was byte-identical to the one already on the target node, from a prognostic IHC study whose own explanation conceded it does not trace the tumor's Correa-cascade origin. No evidence was re-pointed or re-worded to preserve the edge.

    3. Node connectivity is unchanged in kind: the node is integrated through influences_mechanisms from the three environmental exposures, matching the Metastatic_HCC.yaml "Chronic Liver Disease Substrate" precedent this PR cites, whose substrate node carries no downstream edge either. A notes: line on the node now records why the edge is deliberately absent, so a later curator does not re-add it.

    4. Smoking influences_mechanisms: EXACERBATES -> PREDISPOSES. The cited snippet names smoking as a "risk factor for the development of gastric cancer" - predisposition, not aggravation of an already-established substrate. Metastatic_HCC.yaml uses PREDISPOSES for the analogous alcohol/aflatoxin link while reserving TRIGGERS for hepatitis B/C. This costs a compliance point, since only TRIGGERS/EXACERBATES are in qc_plugins.CAUSAL_PREDICATES; accuracy was preferred. The H. pylori TRIGGERS/DIRECT and high-salt EXACERBATES links were left as written, both endorsed by the reviewer.

    5. Softened the smoking notes: line, which made the same uncited aggravation claim in prose ("may worsen aggressive disease biology").

    6. Non-blocking suggestion applied: the node now carries biological_scale: TISSUE and locations UBERON:0001199 (mucosa of stomach), reusing the exact grounding Gastric_Adenocarcinoma.yaml uses on its own Correa-cascade nodes. The remaining non-blocking notes (four Correa stages bundled into one node; the pathograph's pre-existing disconnection) were left as-is.

    Validation: just validate (pass; one pre-existing unrelated EGA dataset WARN), just validate-terms (pass), just count-verified-snippets (22/28 verified, 6 skipped by prefix - down one from 23 because the duplicated edge snippet was removed with the edge), pytest tests/test_data.py -k Gastric (96 passed), just validate-disorders full pre-PR sweep (passed).

  details: |
    Fix pass addressing an internal red-team review plus the automated claude-review (CHANGES_REQUESTED) on PR #7636.

    CRITICAL fixes. (1) A documented 'ontology gap' in the entry notes was FALSE: the HistopathologyFindingTerm enum is also rooted at NCIT:C4741 Neoplasm by Morphology, from which NCIT:C5250 'Gastric Signet Ring Cell Adenocarcinoma' is reachable (verified with OAK ancestors). The false gap claim was deleted and the histopathology entry split into architecture (NCIT:C95744 Poorly Cohesive Malignant Cellular Infiltrate) plus cytology (NCIT:C5250). The NCIT:C3190 Linitis Plastica gap is genuine and was retained. (2) The prophylactic-gastrectomy treatment had a paragraph headed 'Threshold and timing' that gave no timing; the IGCLC age window (20-30 years, not recommended over 70 without mitigating circumstances), the annual-endoscopy alternative and the co-recommendation to eradicate H. pylori were added with four new snippet-verified evidence items.

    Most significant modelling fix: the bundled node 'Chromosomal Instability and Receptor Tyrosine Kinase Amplification' was split into 'Chromosomal Instability and Aneuploidy' (keeps the genome_instability_mutation conformance, TP53, GO:0007059) and 'Receptor Tyrosine Kinase Amplification' (ERBB2/FGFR2, GO:0038128). Trastuzumab and bemarituzumab target_mechanisms were rewired to the latter - previously the entry asserted that trastuzumab INHIBITS chromosomal instability, which is wrong.

    Other mechanism fixes: dropped GO:0001837 epithelial to mesenchymal transition from the cohesion-loss node, which contradicted its own description (diffuse gastric cancer loses E-cadherin structurally, not by TF-driven repression); added a second conformance tier for MMR deficiency at the module trigger node; added invasion_and_metastasis#Local Invasion and Intravasation on the diffuse-growth node so the module chain is not entered only at its terminus; clarified that the protein-tyrosine-kinase annotation on the CagA node refers to host SRC/ABL, since CagA is the substrate.

    New content: curative gastrectomy with D2 lymphadenectomy (the entry previously modelled no definitive operation for the actual cancer, only the prophylactic CDH1 one); ramucirumab second line plus a new VEGF/VEGFR2 angiogenesis node conforming to the tumor_angiogenesis module; breast surveillance or bilateral risk-reducing mastectomy for female CDH1 carriers (the lobular breast phenotype was curated but its management was absent). Two new references fetched: PMID:32861308 (Lancet gastric cancer seminar) and PMID:25240821 (RAINBOW).

    Evidence discipline: nine tangential evidence items were REMOVED rather than kept, per CLAUDE.md SOP section 4 - six phenotypes and three differential diagnoses were cited to treatment-guideline sentences that did not support the claim (e.g. ascites evidenced by a CT-staging sentence). Their descriptions are retained with an explicit note that no snippet-quotable source exists in the cited corpus. This deliberately lowered compliance from 89.1% to 86.0%. Three further items were downgraded SUPPORT -> PARTIAL (invasive-carcinoma endpoint, achlorhydria, inflammatory microenvironment), the CagA mechanism item was reclassified HUMAN_CLINICAL -> IN_VITRO, and the SMAD4 item -> PARTIAL because the association rests on a negative finding in a BMPR1A-focused study's comparator arm.

    Also: HP:0002027 Abdominal pain -> HP:0410019 Epigastric pain (the name, preferred_term and description all asserted epigastric); the mortality-share record was moved out of prevalence into progression, since a share of cancer deaths is not a prevalence; prevalence_class set to UNKNOWN because Orphanet point-prevalence bands must not be applied to an annual-incidence rate; structured penetrance added to the HDGC subtype; subtype_frequency added to the four TCGA classes; leucovorin added to FLOT; H. pylori 90% attributable fraction and IARC Group 1 status explicitly marked as unevidenced context.

    Lump/split: the notes claim that this entry 'points at those entries rather than duplicating their depth' was inaccurate for Route A, which does re-derive much of Gastric_Cancer_H_pylori_Associated. The claim was corrected and the question flagged in the entry notes for human adjudication by @cmungall.

    Validation after fixes: just validate PASS, just validate-terms PASS, just validate-references PASS with 109/109 snippets verified, compliance 86.0%, compliance-connectivity fully connected (9/9 phenotypes, 10/10 causal genes), pytest -k Gastric_Adenocarcinoma 9 passed. Entry now has 18 pathophysiology nodes, 13 treatments and 8 module conformances.

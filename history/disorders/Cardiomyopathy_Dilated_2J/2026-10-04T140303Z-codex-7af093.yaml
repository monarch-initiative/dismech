  summary: Review FLII cardiomyopathy using primary full texts, clinical supplements
    and ClinGen Moderate validity
  details: |
    Read both 2023 primary full texts and the earlier 2020 cohort abstract, cross-checked the Falcon deep-research report and citation list, and retrieved the primary article PDF and clinical supplement. The prior XML cache did not expose the clinical tables. Added ventricular tachycardia from the ECG caption, heart failure from Table 1, and mitral/tricuspid regurgitation, apical noncompaction and patent foramen ovale from Supplemental Table 1. Removed unsupported diagnostic discrimination and population-level inference from three patients. Recorded ClinGen Moderate validity for the exact FLII/CMD2J pair, with generator-refreshed source provenance; removed the stronger CAUSATIVE classification. Specified the four alleles and avoided double-counting the two families shared between publications. Separated Notch reporter and nuclear TAZ findings and corrected their severe-truncation-model provenance. Distinguished myofibril bundling from initial assembly, preserved the early normal-flow result, separated patient-equivalent zebrafish genotypes, severe truncation, cardiac deletion, R1245H knock-in and adult inducible deletion into six models with 12 scale-aligned links and typed limitations. Corrected the heterozygous-only mouse claim and retained thin-filament shortening as a provisional human mechanism, with partial AAV9-LMOD2 rescue confined to deletion mice. Added general pediatric heart-failure and family-assessment guidance from cached full ISHLT 2025 and GeneReviews PDFs without claiming FLII-specific efficacy. Verified GSE106121 as a reference expression dataset reused by the primary paper. Deep-research dimensions: clinical coverage expanded; no established subtypes; atomic model-qualified mechanisms; care guidance added; phased genetic/validity interpretation clarified; diagnosis and relatives assessment improved; central sources consumed including tables. Excluded unrelated general DCM prevalence/outcome statistics and did not import noncardiac FLII biology or the distinct susceptibility allele as CMD2J causation. Initial final validation passes schema, terms, all 91 snippets and 102 titles; entity/causal references, model scales, ClinGen consistency and dataset verification pass.

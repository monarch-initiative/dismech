  summary: 'Create: Dilated Cardiomyopathy 2J (MONDO:0957984, FLII)'
  details: |
    New standalone Disease entry for CMD2J (OMIM 620635), the FLII-related recessive infantile dilated cardiomyopathy.

    entry_type decision: DISEASE. dismech already curates the numbered DCM loci as standalone files - CMD2G (LMOD2), CMD1GG (SDHA), CMD1R (ACTC1) and roughly forty others are separate entries. MONDO records no descendants for MONDO:0957984 and a single causal gene, so this is a leaf. Confirmed there is no existing kb/ coverage under a different term by grepping origin/main for the MONDO ID and for FLII.

    The mechanism, and why it is not just another sarcomeric DCM. Flightless-I is a gelsolin-superfamily actin-remodelling protein, and the defining paper measured three separable consequences of losing it in the heart: myofibril disorganisation, failure of cardiomyocyte cell-adhesion complexes to concentrate into foci, and dysregulated Notch and Hippo signalling in the compact myocardium, all converging on defective ventricular trabeculation. That makes CMD2J a disease of ventricular chamber morphogenesis as much as of contraction, which fits presentation at 2-5 months.

    Two separate genetic claims about FLII, deliberately kept apart. PMID:37561591 reports biallelic hypomorphic variants causing recessive infantile DCM in three families - that is CMD2J. PMID:37126682 reports the common variant R1243H associated with cardiac remodelling in GWAS, studied in cardiac-deletion and knock-in mice, where the mechanism is sarcomeric thin-filament shortening with TMOD1 and where LMOD2 overexpression partially rescues. The thin-filament node is curated but marked PROVISIONAL and its edge typed INDIRECT_UNKNOWN_INTERMEDIATES for exactly that reason, and a KNOWLEDGE_GAP discussion asks whether it operates in the recessive disease at all. The LMOD2 rescue links this entry to Cardiomyopathy_Dilated_2G, curated here as a thin-filament-length disease; that convergence is recorded in notes and as a differential rather than acted on.

    A second discussion records a HUMAN_MODEL_MISMATCH that is easy to miss when reading the paper: the adhesion-complex and Notch/Hippo findings were all measured in the severe truncating fliiD110fs zebrafish line, not in the patient-mimicking knock-ins, which carry only the myofibrillar and contractile phenotypes. The paper is explicit about why - hypomorphic alleles give subtle differences - but that means the entry's title-level claim about adhesion is an extrapolation across alleles.

    animal_models: three linked models with modeled_mechanisms, readouts and per-link limitations - the patient-mimicking flii R1230C knock-in zebrafish (RECAPITULATES, HIGH/MODERATE), the severe flii D110fs line (RECAPITULATES at MODERATE for adhesion and LOW for signalling, with the allele mismatch stated in limitations), and the mouse cardiac Flii deletion / R1245H knock-in, which carries both a RECAPITULATES link for thin-filament shortening and a RESCUES link for the LMOD2 experiment.

    Evidence: 44/44 snippets verified. No DOI-prefixed citations, so nothing skipped by prefix. Sources: PMID:37561591 (defining paper, full text cached), PMID:37126682 (mouse/GWAS thin-filament work), PMID:32870709 (the earlier consanguineous cohort in which two of the three families first appeared, listed under references only).

    Phenotype wiring: dilated cardiomyopathy and reduced LVEF are wired from Impaired Ventricular Contractility. The secundum atrial septal defect and the tachycardia are deliberately left unwired, each with the reason in its own notes - no evidenced node in this entry causes atrial septation to fail, and the tachycardia-from-low-output edge is physiologically reasonable but is not asserted by the source.

    No frequency bands on any phenotype: three patients ascertained by starting from children who already had idiopathic early-onset DCM, so a proportion would describe the study design. Numerators are given per phenotype instead. No treatments block and no biochemical block, both by decision and both stated in notes.

    Deep research: falcon, disambiguated query. preflight-dr PASS (FLII x45, report OMIM 620635 matches MONDO). The report independently reached the same framing and explicitly makes the same R1243H distinction this entry insists on. Its Table 1 details - two of three patients presenting in overt heart failure, one with tachyarrhythmia, ages at last review 2, 6 and 9 years - are recorded in notes as uncited leads, and heart failure is consequently not curated as a phenotype.

    Validation: just validate, validate-terms, count-verified-snippets, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-stubs all pass; whole-KB check-title-snippets passes. Pathograph orphan audit: no orphan downstream, target_mechanisms or animal-model targets; every model readout target repeats its link target; no isolated nodes.

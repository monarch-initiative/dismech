  summary: 'Address pre-PR red-team review findings'
  details: |
    A red-team review was run against the entry before opening a PR, per step 7 of the
    initiate-new-disorder-creation skill. It returned REQUEST_CHANGES with six blocking
    findings. All were independently verified against the reference caches and OAK before
    being acted on; all were correct.

    Blocking findings and how each was resolved.

    1. Anaphora-hidden Named Entity Confusion. The deposition node quoted PMID:35831008
       "Their aerodynamic size enables the particles to escape the upper respiratory
       tract's primary defences...". Checking the preceding sentence in the cache shows
       "Their" refers to ambient PM2.5/PM0.1 in a passage about urban air-quality
       monitoring, not to coal mine dust. The exact-substring check cannot catch this
       because the referent sits in the previous sentence. Replaced with a coal-specific
       sentence from the same review.

    2. Background citations presented as primary evidence. Nine of thirteen PMID:36581638
       quotes came from that paper's Introduction, where it cites other work (the source
       text carries its reference brackets). The structural consequence was that the
       NLRP3 node and the Fibroblast Activation node — the declared central effector —
       had zero primary and zero coal-specific evidence. Replaced with the study's own
       results: in vivo NF-kB/NLRP3/cleaved-caspase-1 protein levels and BALF IL-1beta and
       CXCL2 in coal-dust-exposed mice, the in vitro p-NF-kB result with PPP inhibition,
       the NLRP3-inhibition-reverses-EMT loss-of-function result, and the COL-1/COL-3/
       alpha-SMA measurement. TGF-beta signalling is now sourced from PMID:35831008, a
       coal-and-silica review, rather than from generic pulmonary-fibrosis background.

    3. A truncated quote that inverted its source. The macrophage-death node quoted "CD
       exposure increased alveolar expression of the proapoptotic mediator Bax" from
       PMID:16966090. The full sentence begins "In rats exposed to BNF," — the result is
       conditional on beta-naphthoflavone co-exposure — and the paper concludes that "Bax
       and apoptosis were not the major determinants of early lung injury in this model".
       The quote is now given in full with directness: INDIRECT, and the paper's contrary
       conclusion is curated alongside it as a REFUTE item rather than omitted.

    4. An unevidenced headline claim. "PMF can progress after exposure ceases" was
       asserted in the description, the Complicated CWP subtype, the PMF node and the
       exposure-cessation treatment caveat, with no snippet anywhere supporting it — while
       the nearest evidence said the opposite. Two verbatim sentences already sat in
       cached, already-cited references (PMID:41411198 and PMID:31302880) and are now
       cited in three places.

    5. Missing diagnostic modelling. CWP is defined diagnostically by ILO-classified chest
       radiography read by NIOSH-certified B Readers, and the entry's own subtype
       definitions were stated in ILO terms, yet none of it was modelled. Added diagnosis:
       (exposure history plus ILO radiography, bound NCIT:C38103, including the measured
       over-reading by uncertified readers), imaging_findings: (rounded opacities mapping
       to macules and nodules; HRCT nodules in miners the film called category 0/0), and
       histopathology: (the coal macule, and mineral dust alveolar proteinosis at 70% vs
       37% in contemporary vs historical miners).

    6. Caplan syndrome was modelled as a CWP subtype; MONDO makes it a sibling.
       MONDO:0005690 is a direct subclass of MONDO:0015926 pneumoconiosis — the parent of
       MONDO:0006654 anthracosis — and arises on silicosis and asbestosis too. Because
       has_subtypes terms count as curated, leaving it there would also have retired
       MONDO:0005690 from the curation queue. Moved to differential_diagnoses with the
       term bound and the nosological reasoning recorded in notes.

    Non-blocking findings also acted on. Node and phenotype evidence that did not bear on
    the claim was replaced throughout: the phagocytosis node cited macrophage recruitment
    rather than phagocytosis; the ROS node claimed macrophage-derived oxidants while citing
    only epithelial IGF1/EMT work (now anchored on PMID:15364596, an in vivo coal-dust
    TBARS and protein-carbonyl study that was fetched but unused); the focal emphysema node
    cited mortality epidemiology for a morphologic claim; the silica-burden node cited
    mineralogy for a comparative-potency claim. Exertional dyspnea, chronic cough,
    emphysema, restrictive defect and pulmonary nodule all gained evidence that names the
    phenotype, two via newly fetched PMID:11952275 and PMID:35032040. Emphysema was
    rebound from the HP:0002097 parent to HP:0032966 Centrilobular emphysema, matching the
    entry's own morphology. Lung fibroblast rebound from CL:0000057 to CL:0002553
    fibroblast of lung. PMID:31302880 (a review) was graded HUMAN_CLINICAL in one place
    and OTHER in three; now uniformly OTHER. The conforming nodes gained the module's
    expected GO:0050900 and GO:0032964.

    Cigarette smoking was previously unbound and unlinked, with review_notes arguing that
    binding a tobacco term would imply smoking is etiologic. That reasoning does not
    survive contact with the schema: environmental_effect exists to separate TRIGGERS from
    MODULATES. Now bound to ECTO:0100003 with a MODULATES link to the mixed ventilatory
    defect node, evidenced by both the worse FEV1/FVC and DLCO in smoking PMF miners and
    the same study's conclusion that smoking does not account for the impairment.

    The IARC note claimed a lung-cancer curation that did not exist anywhere in the file.
    The association is now actually curated (PMID:24186945 HR=1.70 for coal mine dust but
    not respirable silica; PMID:36635098 on birth-cohort trends), and the note was
    corrected: IARC did evaluate coal dust as Group 3 and the schema enum does admit
    GROUP_3, so the omission is a judgement about coal dust versus coal *mine* dust rather
    than a schema limit, and it now says so.

    Nintedanib was listed as a therapeutic_agent with no citation and was removed, with the
    reason recorded in the treatment description. The bundled Macrophage Cytotoxicity and
    Dust-Mediated Alveolar Injury node was split into a CELLULAR macrophage-death node and
    a TISSUE injury node carrying the fibrotic_response#Tissue Injury conformance, which is
    the bundle pattern the single-value biological_scale rule exists to surface.

    Added a HUMAN_MODEL_MISMATCH discussion for the EMT branch. That branch rests entirely
    on PMID:36581638, whose in vitro arm used A549 (a lung adenocarcinoma line) and BEAS-2B
    and whose in vivo arm used coal dust nanoparticles rather than respirable mine dust,
    while the node binds CL:0002063 and asserts type-II EMT in human disease. Two resolving
    experiments are proposed. This is a mismatch, not a gap: the model evidence is real and
    its translational validity is the open question.

    Findings acknowledged but not acted on. The 0.33%-to-3.2% PMF figure is quoted from
    PMID:35353671's introduction; a caveat now says so and points at the primary
    surveillance reports, but the figure was not re-sourced. Several fetched references
    remain uncited (GBD 2019 global burden, the coal-versus-silica particle composition
    study, two rodent model papers that would support an animal_models section this entry
    does not have). Gene wiring stays at 0% because the Genetic class has no
    mechanism-target slot, which is why every sibling dust-disease entry reports the same.

    Validation after the review pass: just validate and just validate-disorders both pass
    with 103/103 snippets verified (up from 75). All offline and whole-KB gates OK.
    Compliance 85.4%. Page renders; derived HTML not committed.

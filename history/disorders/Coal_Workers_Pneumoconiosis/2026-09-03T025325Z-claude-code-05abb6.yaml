  summary: 'Create: Coal Workers Pneumoconiosis'
  details: |
    Created kb/disorders/Coal_Workers_Pneumoconiosis.yaml de novo (MONDO:0006654, canonical
    label "anthracosis"; "coal workers' pneumoconiosis" is an exact MONDO synonym).

    Duplicate preflight: git grep over origin/main kb/ for MONDO:0006654, "coal worker",
    "anthracosis", "coal dust" returned only Chronic_Obstructive_Pulmonary_Disease (a coal-dust
    mention, not a CWP entry); stubs/ had no match; GitHub PR and issue searches across all
    states returned zero. No claim issue existed.

    Deep research: claude_code provider only, via `just research-disorder claude_code
    Coal_Workers_Pneumoconiosis`. Run took 254s over 20 turns and 18 web searches, cost
    ~$1.22, 57 citations. The report carried no reference_validation or term_validation
    frontmatter block, so both were retro-fitted with `just validate-research-reference` and
    `just validate-research-terms`.

    Reference validation on the report: 31/31 resolved, 0 unresolved, 0 off topic. Nothing was
    excluded on validation grounds.

    Term validation on the report found 2 terms named as a different term and 4 worth a second
    look. Independent OAK checks found MORE wrong bindings than the validator flagged, because
    the validator only checked 14 of 36 names. Every suggested HPO term was re-derived from OAK
    rather than copied. Wrong report suggestions, all rejected:
      HP:0002105 report "Restrictive ventilatory defect" -> HP is Hemoptysis (NOT flagged by
        the validator; caught by direct OAK lookup). Correct term used: HP:0002091.
      HP:0009777 report "Rheumatoid nodules" -> HP is Absent thumb. Phenotype dropped.
      HP:0100750 report "Pulmonary nodule" -> HP is Atelectasis. Correct term used: HP:0033608.
      HP:0031246 report "Chronic cough" -> HP is Nonproductive cough. Correct term used:
        HP:0034315.
      HP:0002092 report "Pulmonary hypertension" -> HP is Pulmonary arterial hypertension, a
        Group 1 entity; CWP causes Group 3 PH. Bound HP:0004890 Elevated pulmonary artery
        pressure instead.
      NCIT:C64582 report "Oxygen" -> NCIT is "Hypopharyngeal Cancer pNX TNM Finding v6 and v7".
        Bound NCIT:C94624 Oxygen Therapy instead.
      UBERON:0002185 report "bronchiole" -> UBERON is bronchus; UBERON:0000115 report "lung
        parenchyma" -> UBERON is lung epithelium. Bound UBERON:0002188 respiratory bronchiole,
        which is where the coal macule actually forms.
    Every NCIT treatment term was checked for reachability from NCIT:C25218 before use.

    Citations: the report cites by URL and PMC id rather than PMID, and its .citations.md
    sidecar contains only the prompt. 21 PMC ids were converted to PMIDs via the PMC ID
    Converter API and cited as PMIDs; PubMed searches added further primary sources (NIOSH
    surveillance, the National Coal Workers' Autopsy Study PMF-typing paper, the 37-year
    mortality cohort, the UNOS transplant analysis).

    Content: 4 subtypes (simple, complicated/PMF, rapidly progressive, Caplan syndrome);
    13-node pathophysiology chain wired with `downstream` edges from dust deposition through
    macrophage phagocytosis, ROS, NLRP3/NF-kappaB, inflammatory amplification, EMT and
    fibroblast activation to the coal macule, focal emphysema, PMF and mixed ventilatory
    defect; a separate `Silica-Enriched Dust Burden` node carrying the contemporary
    silica-driven resurgence; 10 phenotypes; 2 environmental entries (coal mine dust with
    exposure_classifications and two influences_mechanisms links, plus smoking as an explicitly
    non-causal modifier); 3 susceptibility genes (TNF, TGFB1, H19); 3 prevalence records; 2
    biomarkers; 6 treatments; 1 clinical trial (NCT04461587).

    Five nodes declare conforms_to against fibrotic_response (Tissue Injury, Inflammatory
    Recruitment and Amplification, Mesenchymal Cell Activation, Excessive ECM Deposition,
    Architectural Distortion and Organ Dysfunction), matching the Asbestosis pattern.

    Deliberate omissions, recorded so they are not read as oversights:
      - No `datasets:` block. `just discover-datasets` returned 13 candidates, all GENE_ONLY
        via TNF/TGFB1/H19 and none about coal dust or pneumoconiosis (Crohn's disease, macular
        degeneration, ovarian cancer). A direct GEO search found exactly one plausible series,
        GSE311671, whose title says "Coal Mine Dust" but whose summary and overall design are a
        silica suspension murine silicosis model. Including it would have been the Named Entity
        Confusion failure the dataset-curation guidance warns about, so nothing was added.
      - No iarc_carcinogen_group on the coal mine dust exposure. Coal mine dust itself has no
        IARC group this entry is entitled to assert; crystalline silica's Group 1 listing
        belongs to the Silicosis exposure. The coal-dust/lung-cancer association is curated as
        cohort evidence instead.
      - ILO item 2.1.9 (COPD from coal dust) deliberately not claimed: it names a different
        disease outcome of the same exposure, curated under COPD.
      - No GeneReviews baseline. PubMed search for "pneumoconiosis GeneReviews[All Fields]"
        returned 0 hits, as expected for a purely acquired occupational disease.
      - Most `downstream` edges carry no edge-level evidence. Edge evidence was added only for
        the 8 edges where a source makes the causal claim itself; the rest were left uncited
        rather than reusing a node citation to paper over an unsourced edge.

    Validation run: `just validate` and `just validate-disorders` both pass, 72/72 snippets
    verified against the cached references. check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms and
    check-qualifier-terms-online all OK. Whole-KB content gates (snippet-length,
    title-snippets, folded-hyphens, snippet-grading, environmental-evidence) report no new
    violations. Compliance 84.7% (Silicosis 79.4%, Chronic Beryllium Disease 79.9%, Asbestosis
    88.6%). Page renders; the derived HTML was not committed.
- type: EDIT
  outcome: changed

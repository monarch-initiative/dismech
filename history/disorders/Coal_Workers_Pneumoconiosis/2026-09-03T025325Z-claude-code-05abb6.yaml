  summary: 'Wire biomarkers into the pathograph and regrade background quotes'
  details: |
    Follow-up within the same session, after reading the causal graph and re-reading the
    evidence gradings.

    Pathograph connectivity. `just compliance-connectivity --list-unconnected` reported
    Chronic cough and Cor pulmonale as disconnected phenotypes, and graph inspection also
    showed both serum biomarkers isolated. Chronic cough now hangs off the Sustained
    Inflammatory Cell Recruitment node with its own edge evidence; Cor pulmonale is a
    `sequelae` of the Elevated pulmonary artery pressure phenotype; KL-6 and osteopontin
    gained `biomarker_term` bindings (NCIT:C154724, NCIT:C124349, both OAK-verified) and
    READOUT_OF links to the alveolar epithelial injury and inflammatory recruitment nodes.
    All 10 phenotypes are now graph-connected (36 nodes, 36 edges, no orphan targets),
    against 78% for Asbestosis and 0% for Silicosis.

    Still disconnected, and deliberately so: TNF, TGFB1 and H19 (the `Genetic` class has no
    mechanism-target slot, which is why every sibling dust-disease entry also reports 0%
    gene wiring); Cigarette smoking (a modifier with no sourced mechanism edge — the cited
    cohort found COPD mortality elevated in never and former but not current smokers, which
    argues against asserting a simple synergy edge); and Supportive Respiratory Care, which
    targets infection and complications rather than a modelled mechanism node.

    evidence_source regrading. On re-reading the cached full text of PMID:36581638, nine of
    the thirteen quotes taken from it are Introduction sentences synthesizing prior work
    rather than that paper's own experiments. Because `evidence_source` classifies the
    evidence the cited publication presents, those were regraded IN_VITRO -> OTHER,
    following the convention `kb/modules/fibrotic_response.yaml` already uses for review
    syntheses. Two abstract-level conclusions ("ROS induced inflammation and EMT ... to
    accelerate PF" and the study's overall conclusion) rest on the paper's in vivo mouse arm
    and were regraded IN_VITRO -> MODEL_ORGANISM, since pulmonary fibrosis is an organismal
    outcome the cell work alone cannot establish. Only the quote naming alveolar epithelial
    cells specifically remains IN_VITRO. `just check-snippet-grading` stays green.

    Validation after these edits: `just validate` and `just validate-disorders` pass with
    75/75 snippets verified; all offline gates and all whole-KB content gates OK; compliance
    84.9%.

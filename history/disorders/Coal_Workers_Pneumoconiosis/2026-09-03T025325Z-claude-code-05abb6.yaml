  summary: 'Fix truncated snippet and act on reviewer suggestions'
  details: |
    Addresses the ai4c-reviewer review on PR #10697, which returned
    REQUEST_CHANGES with one blocking finding and five non-blocking suggestions.

    Blocking finding, and it was my error. The smoking modifier link quoted
    PMID:11952275 as "Smoking miners had even lower FEV1/FVC and DLCO than d" —
    truncated mid-word. The full sentence ends "...than did their non-smoking
    counterparts", and the comparator is the claim: the MODULATES edge asserts
    smoking adds burden on top of dust-driven impairment, which "lower than d"
    states not at all. Root cause was pasting a snippet out of a `cut -c1-N`
    truncated terminal read rather than out of the cache file. It passed
    validation because a truncation is still an exact substring.

    Swept the whole entry for the same defect afterwards, checking whether the
    character following each snippet in the cached text is alphanumeric. One real
    hit (this one) out of 103. Three apparent hits on PMID:36972614 are false
    positives — complete sentences followed by that paper's superscript inline
    citation numbers.

    Reviewer suggestions acted on.

    Suggestion 4 (Gremlin-1 and syndecan-4 quoted but not modeled): both are now
    Biochemical entries with READOUT_OF links — syndecan-4 against the matrix
    deposition node, gremlin-1 against mesenchymal activation, matching what each
    protein actually does. Neither carries an ontology term: NCIT has no
    measurement concept for either, and binding a broader proteoglycan or BMP
    term would name a different analyte. Recorded in notes per "no term beats a
    bad one".

    Suggestions 2 and 3 (no animal_models section; the mitochondrial branch of
    the research causal chain unrepresented) are one gap and are fixed together.
    Added a Macrophage Mitochondrial Dysfunction and Defective Mitophagy node
    (GO:0000423 mitophagy, DECREASED) between the ROS node and both macrophage
    death and inflammatory recruitment, plus an animal_models section with two
    models carrying modeled_mechanisms:

      - PMID:41894156, coal-silica mixed dust in mice with kinetin mitophagy
        rescue and PINK1 knockdown. RECAPITULATES the mitochondrial node with two
        readouts (DECREASED membrane potential and oxidative phosphorylation;
        RESTORED mitophagy on the rescue arm), and PARTIALLY_RECAPITULATES PMF at
        LOW fidelity — murine fibrosis after months of instilled dust is not the
        conglomerate mass lesion that defines human PMF after decades.
      - PMID:35057792, nine-month coal dust particle instillation in mice with a
        vitamin D arm. Its dust was characterized as under 5 microns with under
        10% silica, so unlike the model above it isolates a coal-predominant
        exposure. RECAPITULATES the tissue injury node; PARTIALLY_RECAPITULATES
        fibroblast activation at LOW fidelity, because its fibrogenic readout is
        transcriptional and macrophage-phenotypic rather than the
        alpha-SMA-positive myofibroblast the node names.

    The mitochondrial node is curated because the rescue arm makes it a testable
    causal claim rather than an observation, but its notes record that the
    evidence is murine and that the report itself flagged the human translational
    status as unconfirmed.

    Suggestions not acted on. Suggestion 5 (melanoptysis) was left out: it has no
    HPO term, and an unbound phenotype whose only content is a free-text name
    adds a row without adding a queryable claim. Suggestion 6 was an observation
    that 35 of 103 evidence items are graded OTHER, with the reviewer agreeing
    the convention is right; no change needed, and it is a conscious convention —
    a review's synthesis sentence is not itself a human clinical observation.

    Validation: just validate and just validate-disorders pass with 114/114
    snippets verified (up from 103). All offline and whole-KB gates OK. The
    model-link, entity-ref and animal-model test selection passes (16,242 tests).
    Graph is 42 nodes and 47 edges with no orphan targets. Compliance 84.0% —
    down from 85.4% because the two new animal models introduce
    modeled_mechanisms links whose optional recommended slots are not all filled,
    which is a denominator effect rather than a regression.

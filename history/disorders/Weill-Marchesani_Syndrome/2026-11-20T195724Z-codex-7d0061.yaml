  summary: Map Weill-Marchesani syndrome to OMIMPS:277600
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS277600 contains the four ADAMTS10-, FBN1-, LTBP2-, and ADAMTS17-related Weill-Marchesani forms in January 2026, matching the four subtypes here and the four children of MONDO:0018096. Fibrillin-microfibril organization and the overlapping ocular and short-stature syndrome support one Disease, with dominant FBN1 and recessive forms retained as distinct genetic subtypes. The mapping does not make every form recessive, identify all four proteins as fibrillin, or include Marfan syndrome and other allelic extracellular-matrix disorders on gene identity alone.

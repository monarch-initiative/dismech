  summary: 'Create: Weill-Marchesani syndrome'
  details: |
    De novo creation of the Weill-Marchesani syndrome (WMS) entry. GeneReviews baseline applied: PMID:20301293 fetched, tagged, and mined for clinical characteristics, management, surveillance intervals and the Agents/Circumstances to Avoid warning (ophthalmic miotics and mydriatics can induce pupillary block). Deep research: Edison/falcon; used to add the ADAMTS10 fibrillin-2 proteolysis arm (PMID:30201140) and a HUMAN_MODEL_MISMATCH, all independently verified against PubMed abstracts. Curated: nine-node pathograph in which four genes encoding secreted ECM proteins converge on a deficient fibrillin microfibril network, splitting into an ocular arm (zonular insufficiency to microspherophakia to pupillary block to glaucomatous optic neuropathy) and a systemic acromelic arm via BMP/SMAD1-5-8 dysregulation. Two nodes declare conforms_to against glaucoma_optic_neuropathy (Elevated Intraocular Pressure and Retinal Ganglion Cell Apoptosis), an organ-specific substitution where the upstream trigger is lens-driven pupillary block rather than trabecular meshwork outflow dysfunction. Four MONDO-bound subtypes, 10 HPO-bound phenotypes with gene-arm frequency splits from the 128-patient review, four genes, three discussions (two KNOWLEDGE_GAP, one HUMAN_MODEL_MISMATCH on the Adamts10-null mouse lacking ectopia lentis due to fibrillin-2 in the murine zonule). Note: local sqlite:obo:mondo returned stale labels for MONDO:0012013 and MONDO:0013176; live OLS labels were used and the term caches corrected. Validation: just validate passes, 58/58 snippets verified; compliance 88.8 percent global, 89.2 percent weighted.

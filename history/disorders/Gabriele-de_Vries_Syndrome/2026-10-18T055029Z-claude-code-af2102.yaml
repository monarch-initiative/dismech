  summary: 'Create: Gabriele-de Vries Syndrome'
  details: |
    Created the Gabriele-de Vries syndrome (MONDO:0044738, YY1) entry from the Perplexity sonar-deep-research report, run with --param reasoning_effort=low because default-effort requests were dropped by the network after about five minutes. Report validation: 25/25 references resolved, 0 off topic, no quotes checked; term validation 99 checked, 0 unresolved, 3 obsolete GO/CL terms (GO:0016573, GO:0044237, CL:0002609) not used; needs_review true. just preflight-dr PASS (YY1 mentioned 65 times, OMIM 617557 matches MONDO). GeneReviews chapter PMID:31145572 (NBK541730) tagged and used as the phenotype baseline; its abstract-listed features are all represented except schizoaffective disorder and lacrimal duct abnormalities, each named once in the abstract and not curated as phenotypes in this pass. Every PMID was found by PubMed esearch in the same step, not recalled. The organoid study is cited as the peer-reviewed Mol Psychiatry version PMID:39987231 rather than the bioRxiv preprint PMID:38405909. Not used: PMID:33638881 and PMID:37690905 (cached with empty bodies), PMID:37189872 (spinal dysraphism single case whose abstract attributes the variant to GNAS). ClinGen Definitive AD for YY1 is against complex neurodevelopmental disorder (MONDO:0100038), so no gene_disease_validity was recorded. Not conformed to epigenetic_machinery_neurodevelopmental_dysregulation: that module excludes sequence-specific transcription factors whose loss dysregulates target genes, and YY1 is one, although the H3K27ac loss at YY1-bound enhancers makes the case arguable. Histone-acetylation GO process terms are obsolete, so the H3K27ac node has no process binding. Phenotype-to-mechanism edges from the YY1 root use the founding-series syndrome definition with INDIRECT_UNKNOWN_INTERMEDIATES; organoid-to-clinical edges are marked directness INDIRECT. Validated with just validate, validate-terms, count-verified-snippets, the offline gates, and validate-disorders.

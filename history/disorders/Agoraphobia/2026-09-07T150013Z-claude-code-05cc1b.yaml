  summary: 'Create: Agoraphobia'
  details: |
    Created kb/disorders/Agoraphobia.yaml (MONDO:0003709), claimed via issue #11335.

    Coverage preflight: confirmed uncovered at origin/main eedf9251c. MONDO:0003709 appeared in kb/ only inside differential_diagnoses blocks of Panic_Disorder and Social_Anxiety_Disorder, never as a disease_term, has_subtypes term, or mondo_mappings entry. The MONDO parent MONDO:0003699 (phobic disorder) is likewise uncurated, so no parent-term entry already covered the concept. No stub, no other open claim issue among the 151 checked.

    Deep research: a claude_code run produced a report whose cited PMIDs all resolve and are on topic, unlike the sibling run for Intermittent Explosive Disorder. It was still treated as leads only: every reference cited here was re-located through the PubMed E-utilities API, every snippet was verified against the local cache, and every ontology term was resolved independently through OLS. The report's vestibular/space-and-motion strand was the useful contribution, since it is agoraphobia-specific rather than borrowed from panic disorder.

    Content: two parallel mechanistic strands converging on situational avoidance. The GLRB strand runs from non-coding glycine receptor beta subunit variation, through increased startle reflex and fear-network activation, to agoraphobic cognitions. The spatial-orientation strand runs from vestibular dysfunction, through a compensatory non-vestibular (proprioceptive/visual) balance control strategy demonstrated as surface dependence on posturography, to space and motion discomfort. Four phenotypes, one genetic susceptibility entry, a polygenic inheritance block, one animal model, three differential diagnoses, two treatments.

    Named entity discipline: the dominant risk for this entry is that most agoraphobia literature is conducted in panic disorder samples with agoraphobia as a modifier. Evidence was selected preferentially where the source reports an agoraphobia-specific outcome, phenotype or sample. Where it does not, that is annotated: the antidepressant treatment carries directness: INDIRECT because the quoted sentence reports the panic-attack outcome rather than the agoraphobia outcome, and the exposure-plus-antidepressant treatment carries a notes: line stating that the meta-analysis population is panic disorder with or without agoraphobia rather than agoraphobia alone.

    Two MONDO ids for the differential diagnoses were initially written from memory and were caught by the pre-edit term validation hook before the file was ever written: MONDO:0004746 is myopathy of extraocular muscle, not social phobia, and MONDO:0004994 is cardiomyopathy, not specific phobia. They were replaced with MONDO:0001247 and MONDO:0012000, both resolved through OLS.

    The Partial Glrb knockout mouse is recorded with fidelity: LOW and an explicit limitations statement: the human association is with non-coding regulatory variants while the model is a partial knockout, and agoraphobia is defined by situational cognitions about escape and help availability that have no faithful murine counterpart, so the reported agoraphobic phenotype is an avoidance-behavior analogue.

    Validation: just validate passes, 25/25 snippets verified against cached references, just validate-terms passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass.

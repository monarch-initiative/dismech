  summary: Bind LOINC S. Paratyphi serotyping and direct blood NAAT codes
  details: |
    LOINC tranche B batch 26. The blood culture and serotyping row takes LOINC:104448-6 (Salmonella paratyphi [Identifier] in Isolate by Agglutination), the serotyping step, which is what makes the Paratyphi-versus-Typhi distinction the row is about; its Isolate specimen is what serotyping is performed on after recovery from blood culture. The isolation half of the row is deliberately left unbound: LOINC has no S. Paratyphi culture code, and the genus-level Salmonella culture codes it does carry do not resolve the serovar, so binding one would assert a test that cannot make the row's own distinction.

    The blood qPCR row takes LOINC:104449-4 (Salmonella paratyphi DNA [Presence] in Blood by NAA with probe detection). Specimen and method match the row, which describes direct whole-blood qPCR; the genus-level Salmonella nucleic acid codes in blood are all qualified as testing an already positive blood culture, a different specimen. The code names the organism the result is reported for, while the assay's Inv A and ttr targets are conserved across S. enterica serovars rather than specific to Paratyphi - the limitation the row's own evidence records, and noted on the row so the code is not read as a serovar-specific target.

    Enumeration basis: Monarch KG LOINC set, query Salmonella Paratyphi, 38 results, total equalled shown so fully enumerated, retrieved 2026-10-17; no LOINC:LP Part code present. A separate query for Salmonella DNA, 18 results fully enumerated, established that every genus-level blood nucleic acid code is positive-blood-culture qualified.

    Neither code collides with the Salmonella codes being added by open PR 14191 (LOINC:17563-8 and LOINC:53956-9), which were checked specifically because that PR covers neighbouring enteric-fever entries.

    Both codes were absent from cache/loinc/terms.csv on origin/main and were seeded by the term validator against the Monarch KG; no label was typed by hand.

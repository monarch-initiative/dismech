  summary: Bind Paratyphi agent and serovar strata to NCBITaxon (#10115)
  details: |
    Bound the infectious agent and its three serovar strata, per the AgentSubtype class added in PR #10353. The entry already had a transmission: block, so check-granularity reported only UNBOUND_AGENT and UNBOUND_AGENT_STRATUM and no transmission work was needed. Chose shape (a) of the two honest options: one agent bound to NCBITaxon:59201 Salmonella enterica subsp. enterica, which is the narrowest NCBITaxon node covering all three serovars, with each stratum bound to its own serovar node - NCBITaxon:54388 Paratyphi A, NCBITaxon:57045 Paratyphi B, NCBITaxon:57046 Paratyphi C. All four CURIEs and labels were read from ols:ncbitaxon with runoak info at the time of writing. Rejected shape (b), three separate agent entries, because paratyphoid fever is one named clinical entity and the ladder in design decisions 3e lumps by default, carrying serovar identity structurally in the strata rather than splitting the agent. No node was fabricated for Paratyphi collectively: NCBITaxon has none, the three serovars are not a clade, and the agent description now says so. Validation: just validate and just validate-terms both passed; included in the ten-file just validate-disorders batch (0 issues); caches normalized and just check-term-cache-integrity passed. check-granularity now reports neither UNBOUND_AGENT nor UNBOUND_AGENT_STRATUM.

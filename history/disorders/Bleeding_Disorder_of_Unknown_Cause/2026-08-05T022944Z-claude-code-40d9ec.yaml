  summary: 'Create: Bleeding Disorder of Unknown Cause [BDUC]'
  details: |
    New disease entry created in response to the scope question posed by issue #5970 [kgap-scan: Bleeding Disorder of Unknown Cause]. The issue asked whether BDUC should become a disease entry or a research-synthesis document; it is curated here as a disease entry because BDUC has a formal ISTH SSC consensus definition [PMID:38518896], a reproducible and persistent phenotype, dedicated prospective cohorts, and an active mechanistic literature.

    Modeling stance: BDUC has no canonical pathophysiological chain, so the pathograph models five parallel, non-exclusive candidate mechanism arms - occult platelet function/secretion defect, impaired thrombin generation, natural anticoagulant excess, altered fibrinolytic balance, altered fibrin clot architecture - descending from a single definitional trigger node and converging on a shared "Impaired Hemostatic Plug Formation and Clot Stability" node. Each arm is opted into a corresponding mechanistic_hypotheses group. No hypothesis is CANONICAL; five are EMERGING, one [undetected monogenic cause] is ALTERNATIVE, and one [soluble thrombomodulin excess] is DEPRECATED with REFUTE evidence from the study that tested and failed it.

    Six discussions record the open state of the field: a CONTROVERSY over the direction of the fibrinolytic abnormality, since cohorts report both accelerated and reduced lysis; a KNOWLEDGE_GAP on the universal dissociation between assay abnormality and bleeding severity; an OPEN_QUESTION on whether BDUC is an entity or a residual category; a CURATION_TODO on the absent MONDO term; a KNOWLEDGE_GAP on the entirely extrapolated treatment evidence; and a KNOWLEDGE_GAP on the cohort mismatch underlying the platelet arm.

    Ontology gap: MONDO, HPO and NCIT have no term for bleeding disorder of unknown cause. disease_term is anchored to MONDO:0002243 hemorrhagic disease, whose exact synonyms include "bleeding disorder" and "bleeding tendency", with an explicit skos:broadMatch mapping recording that it is a strict superclass which also subsumes every entity BDUC is defined by excluding. This is the same class of upstream gap recorded for postpartum haemorrhage and preterm birth in issue #7837.

    Evidence discipline: 44 references were fetched with "just fetch-reference"; no cache file was hand-written or hand-edited. 104 of 104 snippets verified against cached references by "just validate-references". Three claims a naive reading would produce were checked and deliberately NOT curated, and are documented in the entry notes: an angiogenesis/VEGF/sFlt-1 arm, for which no BDUC study exists; low alpha2-antiplasmin, since PMID:28018998 found it HIGHER, contradicting the model usually attributed to it; and elevated VWF propeptide or increased vascular permeability, for which no BDUC study was found. Three further BDUC papers [PMID:37330263, PMID:38292351, PMID:39526290] were fetched but not cited because PubMed holds no abstract text for them, so no snippet could be verified; their content is covered by cited alternatives.

    One error caught by the validation stack during authoring and worth recording: an initially guessed MONDO identifier for von Willebrand disease in differential_diagnoses resolved to "retinal melanoma". It was corrected to MONDO:0024574 after checking the existing Hereditary_von_Willebrand_Disease entry.

    Validation: "just validate" passes across schema, term and reference validation. Snippets checked: 104 of 104.

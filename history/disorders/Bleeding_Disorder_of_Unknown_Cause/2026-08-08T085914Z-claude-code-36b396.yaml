  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7961.

    Blocking finding 1 (frequency bands not supported by cited evidence) - resolved by
    removing five frequency qualifiers rather than re-banding them. The PMID:36924834
    Vienna figures are persistence rates among patients who already had the symptom
    (symptom-specific denominators 245, 141, 132, 87, 14 inside a 392-patient cohort),
    not cohort prevalence, so they cannot support any band. Removed: Heavy Menstrual
    Bleeding (VERY_FREQUENT, qualitative only; the 80% figure is the female fraction of
    the cohort, not the fraction with menorrhagia), Epistaxis (FREQUENT, 42/132
    persistence), Easy Bruising and Spontaneous Hematoma (VERY_FREQUENT, 146/245
    persistence, and in the FREQUENT band even taken at face value), Oral and Gingival
    Bleeding (FREQUENT, 26/87 persistence, and in the OCCASIONAL band at face value),
    and Joint Bleeding (OCCASIONAL, supported only by a quality-of-life snippet with no
    frequency content). Each phenotype keeps its association evidence and gains an
    inline comment stating why the band was omitted, per
    docs/frequency-evidence-guidelines.md. Every explanation that asserted a band from a
    persistence rate was rewritten.

    Bands retained, with explanations made explicit about their denominators: Prolonged
    Bleeding After Surgery (44-75%, direct cohort figures), Prolonged Bleeding After
    Dental Extraction (36-84%, range straddles the FREQUENT/VERY_FREQUENT boundary so
    the conservative lower band is used), Postpartum Hemorrhage (band carried by the 34%
    14/41-delivery cohort; the concordant 26% 5/19 figure sits just below the boundary
    and is now labelled as such), Iron Deficiency Anemia (6% IDA), and the OBLIGATE
    defining phenotype.

    Blocking finding 2 (no deep-research artifact) - not resolved in this session; no DR
    provider was available to this run. Rationale recorded in a PR comment for a
    maintainer to accept or reject.

    Suggestion 4 (prevalence) - all three referral diagnostic-yield records moved from
    measure_type POINT_PREVALENCE / prevalence_class ABOVE_1_IN_1000 to UNKNOWN/UNKNOWN
    with rate_per_100000 dropped, so an export no longer reads 72500 per 100,000 as a
    population prevalence. The verbatim fractions stay in notes.

    Suggestion 3 (biochemical) - added a biochemical section with five markers (thrombin
    generation / endogenous thrombin potential, free TFPI-alpha, activated protein C
    antigen, plasma clot lysis time, and plasmin generation peak plasmin), each wired to
    its pathograph node via readouts and each reusing an evidence snippet already
    verified in this entry. No new references were introduced. Three markers are
    NCIT-bound (NCIT:C102266, NCIT:C202391, NCIT:C102272); clot lysis time and peak
    plasmin are deliberately left unbound because the only candidate NCIT terms describe
    different assays, and each records why in notes. The direction conflicts the entry
    already documents - a prolonged clot lysis time and a reduced peak plasmin both
    running against the hyperfibrinolysis reading - are carried in the markers'
    specificity fields rather than smoothed over.

    Validation: just validate passes (schema, terms, references); 114/114 snippets
    verified against cached references, up from 104/104 before the biochemical section.
    check-term-cache-integrity and check-cache-order both OK. Seven cache CSV rows were
    added by the validator: three new NCIT biomarker terms plus GO:0030195,
    MONDO:0002243, HP:0006298 and HP:0011891, which the entry already used but the
    branch had not cached. The roughly 7,700-file references_cache DOI-quoting churn
    that validate-references produces locally was reverted and is not in this commit.

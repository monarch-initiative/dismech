  summary: Migrate 26 retired PARTIAL values and restore 9 truncated reference titles
  details: |
    Shepherd round answering the 2026-08-30 review. Both blockers were main moving under the branch, not curation defects. (1) 26 'supports: PARTIAL' values, retired by the #7439 narrowing. The PMID:39231312 plasmin-generation item was split into a SUPPORT and a REFUTE quoting the same sentence, per the CLAUDE.md row for a quote that supports one part of a claim and contradicts another: reduced peak plasmin shows the fibrinolytic system is measurably abnormal (which is what the Altered Fibrinolytic Balance node claims) while running opposite to the accelerated-lysis direction the arm is classically framed around. Collapsing it to a bare SUPPORT would have erased one of the two direction conflicts this entry exists to preserve. Eight items became SUPPORT with directness INDIRECT because the cited cohort is not BDUC-defined: the two platelet studies recruited on abnormal aggregometry, the clot-permeability study on unexplained heavy menstrual bleeding, the tranexamic acid RCT and Cochrane review on heavy menstrual bleeding generally, the desmopressin item, and both levonorgestrel IUS items on inherited bleeding disorders. The remaining 17 took the straight #10003 migration with no directness added, since absent is the honest default for an unassessed item. Rewrote all 15 prose references to the retired value, including the knowledge-gap rationale paragraph, which now says the two platelet items are graded INDIRECT rather than naming a grade the schema no longer has. (2) Restored 9 truncated reference_title strings from the cache frontmatter across four PMIDs (32337845, 25909989, 40680469, 32003946); no cache file was edited. Merge conflicts were two additive HP term-cache row collisions, resolved by keeping both sides. Deliberately did not widen the PR to the 11 other kb/disorders files still carrying PARTIAL on main, as the reviewer asked.

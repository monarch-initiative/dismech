  summary: 'Create: ALPK3-Related Hypertrophic Cardiomyopathy (CMH27)'
  details: |
    Curated MONDO:0054838 (cardiomyopathy, familial hypertrophic 27; ALPK3, hgnc:17574) as a new Disease entry, and added it as a member of the existing Familial_Hypertrophic_Cardiomyopathy grouping. The session was dispatched as /curate familial hypertrophic cardiomyopathy; that concept (MONDO:0024573) is already curated as a Grouping whose grouping_rationale argues explicitly against a third Disease entry at that level, and the umbrella MONDO:0005045 entry already exists, so the user was asked and chose CMH27 from the grouping's remaining stub series instead. stubs/Cardiomyopathy_Familial_Hypertrophic_27.yaml was deleted.

    Deep research: falcon was requested but returned HTTP 403 on authentication (EDISON_API_KEY present but rejected). The run was re-issued with --fallback rather than substituting a provider by hand, and fell back to openscientist; that run had not returned by the time this entry was committed, so the entry as committed was built entirely from PubMed-sourced primary literature and structured sources, not from a deep-research report. Anything the fallback report adds will be folded in as a follow-up EDIT.

    Content: zygosity-split has_subtypes (biallelic autosomal recessive paediatric-onset; heterozygous autosomal dominant adult-onset) with bound HP inheritance terms and both ClinGen assertions (CGGV AR Definitive, AD Strong). A twelve-node causal chain runs ALPK3 loss of function -> loss of M-band scaffolding -> myomesin mislocalization and impaired sarcomere proteostasis -> sarcomere and intercalated-disc disorganization -> calcium-handling and contractility defects -> ventricular dilatation -> hypertrophy -> reactive interstitial fibrosis, with a separate extracardiac striated-muscle and craniofacial branch off the trigger node. Two nodes declare conformance to cardiomyopathy_maladaptive_remodeling (Primary Cardiomyocyte Insult, Ventricular Remodeling). 22 phenotypes, 3 genetic case_fractions, 2 animal models (Alpk3-/- null; Alpk3 K1420R kinase-dead knock-in), 3 experimental models (patient/hESC iPSC-CM, isogenic iPSC-CM proteomics, cardiac organoid), 4 treatments, 4 discussions.

    Scientific judgement recorded rather than resolved: whether ALPK3 is a pseudokinase scaffold or a genuine kinase is contested in the primary literature (Agarwal 2022 PMID:36321451 and the K1420R knock-in PMID:38048395 versus McNamara PMID:39196058), as is nuclear-envelope localization. This is curated as a CONTROVERSY discussion plus a REFUTE evidence item against the nuclear-envelope half of the scaffolding node, and the top-level description was written to avoid asserting either side. A FAILS_TO_RECAPITULATE model link plus a HUMAN_MODEL_MISMATCH discussion record that the constitutive knockout mouse lacks the interstitial fibrosis that dominates the human phenotype.

    Datasets: scripts/discover_datasets.py returned 5 DIRECT and 5 GENE_ONLY candidates. All five DIRECT hits matched only the generic phrase 'cardiomyopathy familial hypertrophic' and are about sarcomere-gene HCM, a phospholamban-knockout mouse, and ABRA deficiency - textbook Named Entity Confusion. The single relevant accession, geo:GSE215304, was the one tagged GENE_ONLY. Only that accession was curated, the reasoning is recorded in its notes, and just verify-datasets resolves it.

    GeneReviews: no ALPK3-specific chapter exists. The nearest, PMID:20301725 (Nonsyndromic Hypertrophic Cardiomyopathy Overview), is tagged in the top-level references block, but its cached PubMed record is a book citation with no abstract text and no ALPK3 mention, so it backs no claim and was not usable as a phenotype baseline; this is recorded in the entry notes.

    Term bindings needing a judgement call: NCIT:C158080 and NCIT:C50032 were both rejected on verification (they are Deep Gray Matter and Limiter Device respectively) and replaced with NCIT:C174901 and NCIT:C93238/NCIT:C80435. NCIT:C174901 (Mavacamten) then failed the ChemicalEntityTerm dynamic enum because NCIT classifies it under Inotropic Support rather than Pharmacologic Substance, and CHEBI has no mavacamten term in this build, so therapeutic_agent was left as free-text preferred_term with the reason recorded in treatment notes rather than binding a wrong term.

    Validation: just validate passes (schema, terms, references) with 106/106 snippets verified against references_cache. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-qualifier-terms-online, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-environmental-evidence and check-groupings all pass. just verify-datasets resolves the single accession. Compliance 89.6%. The grouping validates and both NECESSARY membership criteria are SATISFIED for the new member. No DOI-keyed evidence was used, so no --unskip-prefix run was needed.

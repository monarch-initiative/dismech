  summary: Expand ALPK3 primary-source evidence and qualify clinical and mechanistic
    claims
  details: |
    Partial review checkpoint; the full review is still in progress and no REVIEW event is claimed. Read the available GeneReviews chapter and primary clinical and experimental full texts, including the 2016 and 2020 cohort manuscripts, 2023 contiguous-deletion letter, kinase and localization studies, K201X and inducible knockout studies, and miniALPK3 and full-length replacement experiments. Add diagnosis and counseling baseline, measured-cohort denominators, missing clinical manifestations, documented sudden death and appropriate ICD therapies. Qualify residual protein, contested kinase activity, model-specific localization, force-buffering and proteostasis hypotheses, and uncertain missense alleles. Remove causal interpretations of temporal remodeling and an extracardiac syndrome umbrella. Preserve differences between primary experiments and review synthesis. Add separate full-length gene replacement and neonatal miniALPK3 evidence. Validate dataset GSE215304 through references_cache. Remaining work includes the apical-aneurysm cohort full text, assessment of the Liwen intervention evidence, final cross-section consistency and evidence grading, and complete pre-PR checks.

  summary: Address independent review suggestions for ALPK3
  details: |
    Addressed the optional suggestions from the independent approving review in one follow-up: verified and bound CHEBI:756998 mavacamten; added explicit Heterozygous tags to five Busse-cohort phenotypes and confined the diastolic-dysfunction description to its supporting cohort; added the direct ventricular-hypertrophy to right-ventricular-hypertrophy manifestation link using the Herkert clinical evidence; clarified the mavacamten safety question to name severe biallelic systolic disease. Retained the LVNC HPO binding because both clinical sources explicitly report noncompaction alongside HCM and added a note distinguishing that diagnosis from etiologic subtyping. Did not add fibrosis-to-arrhythmia/diastolic-dysfunction or contractility-to-hydrops links because the reviewed sources did not establish those specific causal steps.

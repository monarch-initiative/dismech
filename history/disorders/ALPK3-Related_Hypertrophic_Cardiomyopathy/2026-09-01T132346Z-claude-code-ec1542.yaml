  summary: 'Edit: ALPK3-Related Hypertrophic Cardiomyopathy - address pre-PR review;
    add deep-research report'
  details: |
    Second session on the same entry. Two inputs arrived after the initial commit: the --fallback deep-research report (openscientist, standing in for falcon after a 403) and a self-directed pre-PR red-team review. Both were acted on.

    Deep-research report, research/ALPK3-Related_Hypertrophic_Cardiomyopathy-deep-research-openscientist.md. Its own validation blocks were read first, per the skill. reference_validation: 23/23 verified, confabulation_rate 0.0, no unresolved identifiers, but only 15/23 assessed on topic - one of the off-topic citations is a paper on esophageal squamous cell carcinoma. term_validation: 43/44 resolved but 15 of 29 label checks mismatched, and needs_review is true. Most mismatches are table-cell artifacts rather than binding claims, but at least one is a genuine wrong binding that must not be copied: HP:0025169 is offered as 'LV aneurysm' when the ontology label is 'Left ventricular systolic dysfunction'. No term or claim was taken from the report. The report also states HGNC:17870 and 15q25.3 for ALPK3, both of which are wrong - the gene is hgnc:17574 (confirmed against the term cache and both ClinGen assertions) at 15q25.2 (per PMID:34263907). It corroborated the entry's structure - zygosity-dependent severity gradient, M-band scaffold, myomesin/MuRF/SQSTM1 proteostasis, 1-4 percent of adult HCM - but cited none of the four primary mechanism papers the entry rests on (PMID:36321451, PMID:39196058, PMID:38048395, PMID:34263907), so it added no claim the entry did not already carry better sourced. It is committed as a research input; nothing was curated from it.

    Review findings acted on. Overclaim removed: the entry and its genetic notes both said ALPK3 is the gene most often recovered from sarcomere-negative HCM re-analysis; PMID:41221624 says second or third in five of seven cohorts, behind cryptic-splice MYBPC3 and, in the French cohort, FLNC. Both statements corrected.

    Sudden cardiac death phenotype removed entirely. It had been asserted on the strength of an ICD referral rate. Re-reading every cached source, all sudden-death language is generic background about hypertrophic cardiomyopathy and no ALPK3-specific sudden death event is reported; the recorded deaths are heart-failure deaths. PMID:34263907 additionally reports no appropriate ICD shocks over 4.0 +/- 3.6 years and states that sudden-death risk could not be modelled in this genotype. That sentence is now cited on the risk-model discussion, the two sequelae edges were redirected, and the evidenced arrhythmic endpoint is cardiac arrest.

    Mouse lines de-conflated. PMID:36321451 states that the previously published C57BL/6J Alpk3-null line failed to recapitulate the rapidly progressive neonatal human disease, and that the authors acquired a separate C57BL/6N line (MRC Harwell, exon 3 deletion) with no survivors beyond 14 weeks. The entry had curated only the C57BL/6J line while contrasting the kinase-dead knock-in against 'the early mortality of the null', which is the other line. The curated line is now named by strain, carries the cited inadequacy in its limitations, the K1420R readout interpretation names which line it contrasts with, and the C57BL/6N line is added as its own animal model with a Ventricular Dilatation link.

    Disputed localization removed from structured form. The node was named Loss of M-Band and Nuclear Envelope Scaffolding and bound GO:0005635 while its own description called nuclear localization contested. Renamed to Loss of M-Band Scaffolding, GO:0005635 dropped, and the evidence explanation now says which half of the quoted sentence is relied on. PMID:38048395's finding that SQSTM1 T269/S272 phosphorylation is unchanged in K1420R hearts was added to the controversy discussion as the sharpest point of disagreement.

    Other corrections: fidelity HIGH downgraded to LOW on a FAILS_TO_RECAPITULATE link; apical and concentric hypertrophy frequencies dropped because both sources report the two patterns only as one combined figure; three ex vivo mavacamten evidence items regraded MODEL_ORGANISM to IN_VITRO; a biallelic-scoped LVOT statistic on the heterozygous hypertrophy node swapped for the heterozygous-scoped sentence from the same review; NCIT:C15289 Organ Transplantation replaced by the specific NCIT:C15246 Heart Transplantation, verified reachable from NCIT:C25218; two 'may cause' mechanism explanations and two flat pseudokinase assertions hedged to match the open controversy; Prolonged QT interval and Left ventricular noncompaction tagged subtype Biallelic; the two deliberately unconnected phenotypes now say in their descriptions why they are unconnected. A causal edge that had rested on a case report's introductory 'due to' gloss of another paper was made uncited with the reason recorded, since the primary source reports both findings without asserting causation.

    Additions: beta-blocker and non-dihydropyridine calcium channel blocker therapy (the reported standard of care, curated as such and not as disease-modifying) and cascade genetic testing with surveillance of carriers; a term-scope note recording that this entry deliberately spans both the recessive and dominant forms of CMH27 and that both ClinGen assertions are curated against MONDO:0005045 rather than MONDO:0054838; non-truncating alleles quantified in the genetic notes as an explicit unmodelled share.

    Grouping: two overclaims in the new member's differentiating_mechanisms were corrected. It is not the only member with a zygosity-dependent split - CMH4, CMH8 and CMH10 all curate a recessive biallelic arm - and the claim that it has the largest case share among sarcomere-negative probands is contradicted by the same source as the first finding, since MYBPC3 ranks ahead of it and is itself a member. Replaced with what is genuinely distinctive: the reverse direction of remodelling and the cardio-cranio-skeletal extracardiac branch.

    Review findings not acted on: the reviewer suggested binding NCIT:C174901 to the mavacamten therapeutic_agent. That was tried in the first session and fails term validation - NCIT classifies mavacamten under Inotropic Support, not under Pharmacologic Substance, so it is unreachable from either root of the ChemicalEntityTerm enum, and CHEBI has no mavacamten term in this build. The free-text preferred_term stands, with the reason recorded in the treatment notes. Moving the three histopathology findings into a histopathology block was left alone: they carry pathograph edges as phenotypes and moving them would break the chain for a presentational gain.

    Validation after changes: just validate passes with 112/112 snippets verified. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and the online variant, and verify-datasets all pass; the whole-KB baseline gates and check-groupings were re-run. Compliance 90.3 percent, slightly below the previous 91.6 because the added causal edges and model links enlarge the denominator; uncited edges were left uncited rather than papered over with node-level citations.

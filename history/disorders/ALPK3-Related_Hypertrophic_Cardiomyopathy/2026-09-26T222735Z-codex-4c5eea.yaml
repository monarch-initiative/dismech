  summary: Review ALPK3 cardiomyopathy against full-text clinical and mechanistic
    evidence
  details: |
    Completed full-text review of the cached ALPK3 literature, including the 2016 and 2020 biallelic series, 2021 heterozygous cohort, 2023 deletion report, mechanistic and model studies, gene-replacement studies, and Busse preprint. Mined the actual GeneReviews chapter for clinical, diagnostic, management and counseling evidence. Corrected universal age, morphology, disarray, fibrosis and loss-of-function claims; separated measured molecular findings from proposed causal mediation and preserved the catalytic-activity controversy. Added cardiac and extracardiac findings with cohort-specific denominators, deletion-aware diagnosis, qualified variant interpretation, clinical management and separate experimental interventions. The Busse quotes cite the available preprint version explicitly; no quotes are attributed to the unavailable published letter. Cross-checked the OpenScientist report and citations across all eight review dimensions: central phenotype, subtype, mechanism, treatment, genetic, diagnostic and reference coverage is adequate. No ALPK3-specific clinical trial was surfaced; acquired-hypertrophy miRNA experiments and general-HCM risk estimates were not promoted to inherited-ALPK3 evidence. Source identities and titles checked, with a wrong aneurysm HPO ID in the research report replaced by the verified ventricular-aneurysm term. Schema, ontology and reference validation pass with 214 snippets and 229 titles, no skipped or unavailable snippets; two scoped tests, entity-reference, causal-target and snippet-boundary checks pass. Short snippets checked against origin/main; GeneReviews is tagged. Dataset GSE215304 verified through its generated reference cache. Independent PR review remains the next gate.

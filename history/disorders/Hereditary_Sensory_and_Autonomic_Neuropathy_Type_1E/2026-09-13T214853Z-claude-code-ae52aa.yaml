  summary: 'Create: Hereditary_Sensory_and_Autonomic_Neuropathy_Type_1E (MONDO:0013584)'
  details: |
    De novo curation of HSAN1E, the sensory-neuropathy arm of DNMT1-related disorder. Deep research: one openscientist report, committed alongside. Report reference validation resolved 13/13 citations with confabulation_rate 0.0; term validation returned needs_review: true with 21 label mismatches, all of which are table-parsing artefacts where the validator read a category column as the label. Its obsolete_terms block was the useful part and changed the curation: it flagged HP:0030050 as obsolete Narcolepsy replaced by HP:0002524 Cataplexy, and HP:0002459 as obsolete Dysautonomia replaced by HP:0012332, both of which are now bound correctly. GeneReviews baseline: PMID:22338191 (DNMT1-Related Disorder) fetched, tagged, and used for the clinical characterisation and management. just preflight-dr returns WARN for two reasons, both benign and checked: the report cites OMIM 604121 alongside MONDO's 614116, and 604121 is ADCA-DN, which the report legitimately discusses as the allelic disorder; and the rival-gene detector reports HP mentioned 20 times, which is the HPO CURIE prefix being read as the haptoglobin gene symbol rather than a second disease entity. The entry is curated as a separate Disease from ADCA-DN, already on main, following PMID:24727570's own conclusion that the two are discrete clinical entities in one spectrum. A mechanistic_hypotheses block records the domain-position question, upgraded from the exon 20 / exon 21 shorthand to the sub-domain gradient reported by a 45-subject cohort (PMID:25678562), with the exon 21 HSAN counterexample curated as REFUTE against the exon framing. A second hypothesis records why a replication-coupled maintenance methyltransferase damages postmitotic neurons, with the authors' own statement that the trajectory is unknown. Two snippets are quoted short because the cached records are hard-wrapped PubMed-style text, and one because the reference validator strips bracketed spans before matching; each is flagged in its own explanation. Validation: schema, term and reference checks pass with 49/49 snippets verified; all five offline gates pass.

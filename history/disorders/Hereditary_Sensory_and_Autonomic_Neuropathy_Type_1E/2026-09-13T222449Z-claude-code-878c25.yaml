  summary: 'Review round 1: address five blocking findings, with three dispositioned
    as sourcing failures'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11797.

    Finding 1, GeneReviews partly mined. Added the GeneReviews DIAGNOSIS/TESTING statement to the diagnosis section, and four GENETIC COUNSELING items to inheritance: the disease-specific mode of inheritance, the 50 per cent transmission risk, the de novo statement, and the prenatal/PGT statement. Populated Inheritance.de_novo_rate with GeneReviews' own 'unknown'. The pre-existing PMID:21532572 item, which is about the HSAN1 group rather than this disease, is kept but marked directness INDIRECT.

    Finding 2, sedative/antipsychotic treatment. Added, with therapeutic_agent NCIT:C29710 Antipsychotic Agent and a target_mechanisms link to Central Nervous System Atrophy marked symptomatic rather than disease-modifying. Also added the GeneReviews caregiver education and psychological support recommendation as a second treatment.

    Finding 3, narcolepsy pharmacotherapy and cochlear implantation. Cochlear implantation added from PMID:32754641, which reports a measured outcome in a genetically confirmed p.T497P patient, using the CLAUDE.md device pattern (NCIT:C15329 plus an NCIT:C16830 qualifier carrying NCIT:C157820). The authors' timing caveat is curated alongside the result. Narcolepsy pharmacotherapy is NOT added, and the reason is recorded in notes: the deep-research report cites PMID:24727570 for modafinil and sodium oxybate, that paper is cached here and contains no treatment content whatsoever, and a targeted PubMed search found no publication reporting narcolepsy pharmacotherapy in DNMT1 disorder specifically.

    Finding 4, renal failure. Added as a phenotype bound to HP:0000083, from the same PMID:25678562 sentence the entry already quoted twice.

    Finding 5, missing phenotypes. Added six: impaired pain sensation (HP:0007328), impaired vibratory sensation (HP:0002495), painless neuropathic foot ulcers (HP:0200042), personality change preceding cognitive decline (HP:0000751), frontotemporal dementia-like presentation (HP:0002145), and cerebellar atrophy on imaging (HP:0001272, with a REFUTE item recording that the same patient had no definite clinical cerebellar ataxia).

    Two of the reviewer's suggested phenotypes are NOT added and are dispositioned in notes. Charcot arthropathy: the HP id offered, HP:0002828, is Multiple joint contractures rather than a neuropathic arthropathy (the correct term is HP:0002821), and no source on this branch reports neuropathic arthropathy in DNMT1 disorder - the only 'Charcot' occurrence in the caches is Charcot-Marie-Tooth in a family history, and the published Charcot-joint literature reachable from HSAN is CIPA/NTRK1 and HSAN II. Impaired temperature sensation: no cached source names it in this disease, only pain and vibration. The injury pathway that would produce a Charcot joint is curated from real sources instead.

    Suggestion on diagnostic breadth taken: added an Electrophysiologic and Imaging Characterization entry recording the modality set, the central-tractopathy case where peripheral sensory function was preserved, and a normal early nerve conduction study in an affected individual.

    Suggestion to split pathophysiology node 4 declined for now; the reviewer called it borderline and the two GO processes share the same downstream edges.

    New reference consumed: PMID:32754641, already present in references_cache on main and reproduced byte-identically by the fetch, so no cache churn.

    Validation: schema, term and reference validation all pass; snippets verified 74/74 (was 49/49). All nine offline gates run.

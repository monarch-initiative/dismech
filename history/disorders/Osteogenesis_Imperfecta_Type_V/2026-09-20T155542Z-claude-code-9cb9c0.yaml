  details: |
    Genetics pass for the d2g wiring-015 job (issue #12204, epic #12189). Genetics researched from the entry's own cited literature plus a GeneReviews baseline check (just check-genereviews), with MONDO/Monarch consulted only afterwards for reconciliation. ClinGen bulk refresh was unavailable (just clingen-refresh fails on a drifted pin, issue #10426), so no new ClinGen assertion was fetched. Every HGNC CURIE written here was read from cache/hgnc/terms.csv in the same step it was written; just list-gene-term-mismatches reports 0 findings over the changed files.

    The IFITM5 c.-14C>T Mutation record had no gene_term. Added gene_term hgnc:16644 (IFITM5) with modifier GAIN_OF_FUNCTION, relationship_type: CAUSATIVE, and the same descriptor on the IFITM5 Gain-of-Function node. GAIN_OF_FUNCTION rather than INCREASED because the entry's cited mechanism is a new upstream start codon producing an N-terminally extended protein, which is a qualitative change and not a process running above its normal level. This is the type V mechanism and is kept distinct from the collagen defects of types I-IV; no cross-cutting OI content was added. Wiring 0/1 to 1/1.

  summary: Review carotid artery occlusion mechanisms and treatment evidence
  details: |
    Reviewed Carotid Artery Occlusion against the existing Falcon report and citation sidecar, cached references, and available full text. Confirmed MONDO:0004450 via OAK; the gene-based preflight returns SKIP for a non-Mendelian entity. Manual scope is atherosclerotic complete ICA occlusion, predominantly chronic/extracranial or long-segment disease. This vascular disorder is within the requested campaign scope. GeneReviews baseline: NO_CHAPTER.

    Content-completeness assessment: (1) Phenotypes now include directly supported occlusion, ischemic stroke, TIA, limb-shaking TIA, amaurosis fugax, chronic visual loss, cerebral ischemia, limb weakness, speech disturbance, and retinal hemorrhage. Selected-cohort percentages and mixed stenosis/occlusion ocular frequencies are not generalized. (2) Temporal definitions are modeled as study-specific stages; dissection is a distinct etiology, and stenosis/near-occlusion are not subtypes or manifestations of complete occlusion. (3) Retained four atherogenesis-module mappings and expanded the causal model to plaque-associated thrombus, complete obstruction, collateral insufficiency, compensatory oxygen extraction, embolism, cerebral injury, and retinal ischemia. Full-text operative observations support thrombus, without inferring universal plaque rupture. Added phenotype and procedural join points. (4) Medical prevention, selected recanalization, and acute stroke reperfusion have distinct scopes. COSS published results replace protocol-only interpretation, CMOSS and its post hoc long-term follow-up are added, and registry statuses are refreshed. (5) The full GWAS methods show no complete-occlusion outcome; polygenic findings remain explicitly indirect vascular-risk context. The diabetes/plaque study used an exploratory P<0.10 threshold for its nine candidate SNPs; no occlusion gene validity or clinical score is asserted. (6) Added absent Doppler flow and increased PET oxygen extraction; diagnosis distinguishes residual patency from complete occlusion. No specific molecular diagnostic biomarker is established. (7) Full-text use includes COSS, CMOSS, the 2025 CMOSS follow-up, the disease-specific clinical review, both surgical cohorts, the 2025 spontaneous-recanalization scoping review, the carotid-stenosis review, and both genetic studies. (8) The report's central occlusion themes are represented. Stenosis-specific prevalence and CEA/CAS recommendations, speculative methylation-to-occlusion mechanisms, and unsourced rodent/veterinary models are not imported as occlusion facts.

    Important source qualifications: COSS randomized 195 patients; registry enrollment 700 is not substituted. CMOSS pooled ICA and MCA disease; its neutral two-year result and possible long-term benefit are separated, with post hoc design, missing follow-up, and nonsignificant per-protocol/secondary outcomes. The two Henan surgical cohorts may overlap; 2024 follow-up included only 102 of 162 patients. Recanalization percentages are technical success, not randomized clinical benefit. The spontaneous-recanalization review's 21.2% median includes dissection; non-dissection median 8.75% is distinguished and no surveillance schedule is inferred. Current ClinicalTrials.gov metadata were cached through fetch-reference for four trials. Publisher full text for the 2026 acute-stroke guideline was inaccessible through the fetcher; its official AHA summary supports the limited acute reperfusion claims, separately from chronic cervical occlusion interventions.

    Validation: validate-disorders passed schema and ontology checks with 105/105 cached snippets and 130 reference titles; no skipped/unavailable evidence. Causal targets, snippet boundaries, coarse phenotype bindings, and gene-activity grounding passed. All 2184 node-class examples resolved. Append-only REVIEW provenance; no existing history was edited. Final repository gates and pre-commit are recorded in the PR validation summary.

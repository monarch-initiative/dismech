  summary: Link hypertension, diabetes, and lifestyle to plaque formation
  details: |
    Backfill for issue #8085. All three exposures target the atherosclerotic plaque formation node and all three take the same grade, PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES, because the intermediates are exactly the steps the node already sets out: endothelial injury, lipid retention, foam-cell accumulation, and inflammatory remodelling. Hypertension and the combined smoking and diet exposure are graded identically because they rest on the same sentence of the same review, which states that these factors played the most salient role in plaque development. That sentence connects the exposures to this node's own process rather than to the disease in general, which is why these are supports SUPPORT while the equivalently structured risk-factor lists in other entries of this tranche are PARTIAL. Diabetes mellitus cites a case-control study whose subject is carotid atherosclerosis specifically, though the quoted sentence states the determinant relationship for atherosclerosis generally; the description notes that gap. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 31 of 34 with 3 pre-existing DOI-prefix skips.

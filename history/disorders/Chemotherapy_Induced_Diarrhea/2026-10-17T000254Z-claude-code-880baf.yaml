  details: |
    LOINC tranche H batch 2. Added a new diagnosis section with two rows for the pre-chemotherapy pharmacogenomic testing this entry's genetic section already describes as risk-factor evidence: Pre-Fluoropyrimidine DPYD Genotyping (LOINC:93199-8, DPYD gene targeted mutation analysis), reused unchanged from the batch-1 DPYD deficiency binding since the gene-symbol search already found the identity code, and Pre-Irinotecan UGT1A1 Genotyping (LOINC:95143-4, UGT1A1 gene TA repeats genotype), reused from the batch-1 Gilbert's Syndrome binding. Both codes were re-verified by a fresh Monarch KG entity lookup before writing, and both were re-seeded into cache/loinc/terms.csv since this branch started from origin/main and did not already carry the batch-1 PR's rows. Cited PMID:36443464, already in this entry's genetic section, for an exact sentence stating UGT1A1 testing must be performed prior to irinotecan treatment, and DOI:10.3390/ph18050727 for the pharmacogenetics-guided dosing sentence supporting the DPYD row.

  summary: 'Genetics pass (d2g series-044): Chemotherapy_Induced_Diarrhea'
  details: |
    Genetics pass for issue #12251 (d2g series-044). The issue proposed six inherited congenital diarrhea syndromes as subtypes of this drug toxicity; all six are declined, and the cause is the entry's anchor rather than the biology. The disease_term binding to MONDO:0001673 diarrheal disease asserted identity with a general stool-frequency class, and all fifteen OMIM-numbered inherited congenital diarrheas in MONDO are its hierarchical descendants. The binding is removed; MONDO:0001673 and MONDO:0800390 chemotherapy-induced toxicity are kept as skos:broadMatch cross-references, with the runoak searches establishing that MONDO has no chemotherapy-induced or drug-induced diarrhea class written into the mapping justifications. Wired the entry's two existing pharmacogenes into the pathograph: UGT1A1 and DPYD were recorded as germline RISK_FACTOR relationships but reached no pathophysiology node, and now sit on a new upstream node, Host pharmacogenetic variation in cytotoxic drug inactivation, that feeds the exposure trigger. Recorded where each declined disease belongs, including the two whose genes are already curated elsewhere in this KB. Validated with linkml-reference-validator 0.3.0rc1.

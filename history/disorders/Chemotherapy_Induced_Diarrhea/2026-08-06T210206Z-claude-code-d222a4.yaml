  summary: Link chemotherapy exposure and route into the pathograph
  details: |
    Backfill for issue #8085. Fluoropyrimidine-based chemotherapy exposure is TRIGGERS/DIRECT into the cytotoxic exposure and intestinal drug delivery node. Oral fluoropyrimidine administration is modelled differently, as EXACERBATES with INDIRECT_UNKNOWN_INTERMEDIATES into the paracellular barrier leak and mucosal break node, because route of administration modifies severity rather than causing the injury: the cited study compares oral with intravenous therapy among patients who already have chemotherapy-related diarrhoea and finds significantly more small-intestinal mucosal breaks with the oral route, without establishing the step that links route to break burden. Validated with just validate, just validate-terms and just validate-references; zero integrity issues.

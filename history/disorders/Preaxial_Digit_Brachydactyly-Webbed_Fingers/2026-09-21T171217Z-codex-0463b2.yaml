  summary: Curate PAX3 regulatory brachydactyly from the POSTRE reference set
  details: |
    Created MONDO:0859005 entry after upstream KB and all-state PR/issue preflight found no duplicate. GeneReviews online baseline: NO_CHAPTER. Separate EPHA4-containing deletion, altered enhancer contacts, model ectopic PAX3 expression (GOE), and digit morphogenesis; retain intact PAX3 and unresolved cellular intermediates. POSTRE hg19 input interval retained with unresolved B1-B3 exact family attribution. Human clinical phenotype, patient fibroblast contacts, and DelB mouse expression are independently anchored to PMID:25959774 full text; PMID:36999617 supplies only benchmark provenance. Required just research-disorder workflow initially failed with Claude exit1 and Perplexity quota failure; generated a recorded Asta fallback after disabling failing Claude for the retry. Initial broad Asta retrieval confused brachydactyly and polydactyly and was discarded; focused gene/locus query generated the retained Preaxial_Digit_Brachydactyly-Webbed_Fingers-deep-research-asta.md and citations. Its 28 references resolve; relevance flags for PMID:26340639 and DOI:10.3390/genes6030790 concern one generic chromatin review, read and not used as patient evidence. Report has no proposed CURIEs. NEC preflight SKIP because MONDO lacks a causal-gene annotation; manual MONDO synonym and primary PAX3/EPHA4 identity checks passed. Independent primary-source review found no material issue. Ten cached evidence snippets verified; final batch checks recorded in PR.

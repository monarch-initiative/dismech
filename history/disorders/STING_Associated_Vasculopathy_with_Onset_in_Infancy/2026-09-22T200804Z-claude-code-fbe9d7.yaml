  summary: 'Review: connect six detached phenotypes (IUIS Table 7)'
  details: |
    All six were detached across a chain that already separated the vascular and pulmonary arms. Four cutaneous and articular findings attach to the vasculopathy node, interstitial lung disease to the pulmonary node, and failure to thrive to the systemic interferonopathy node rather than to either organ arm.

    The nasal septum perforation edge notes that it occurs at a site with a marginal blood supply, which is why small-vessel disease destroys it and why it is one of the signs that makes this diagnosis on sight.

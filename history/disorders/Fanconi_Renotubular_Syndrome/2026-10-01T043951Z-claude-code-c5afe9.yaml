  details: |
    Genetics pass for dismech#12256 (d2g series-049), Fanconi renotubular syndrome.

    Anchor repair. disease_term was MONDO:0001083 Fanconi renotubular syndrome, whose own definition is "A genetic or acquired disorder characterized by impairment of the function of the proximal tubules of the kidney" and whose four children are MONDO:0100238 inherited Fanconi renotubular syndrome, MONDO:0060779 acquired Fanconi syndrome, MONDO:0060778 adult Fanconi syndrome and MONDO:0022948 Deal Barratt Dillon syndrome. This entry's description and notes exclude secondary and acquired Fanconi syndrome by name, so the bound class was broader than the entry. Rebound to MONDO:0100238, which contains all five subtype rows (FRTS1/2/3 through MONDO:0007600 primary Fanconi syndrome, FRTS4 and FRTS5 directly), and recorded MONDO:0001083 as skos:broadMatch so it stays in the curation queue. Children and definitions read from OLS4 v1 plus the typed v2 axiom endpoint.

    Issue rows. All five FRTS subtypes already existed as has_subtypes rows with their genes bound; only FRTS1 carried a subtype_term, so MONDO:0024525 was a spurious row (the gap list does not read has_subtypes[].subtype_term). Bound subtype_term on FRTS2 (MONDO:0013247, SLC34A1), FRTS3 (MONDO:0014275, EHHADH), FRTS4 (MONDO:0014458, HNF4A) and FRTS5 (MONDO:0030056, NDUFAF6). Each CURIE's MONDO axiom gene matches the gene already bound on the row. stubs/Fanconi_Renotubular_Syndrome_5.yaml deleted.

    Pathograph. Before this change no phenotype in the entry had an incoming causal edge: dismech.qc_plugins.causal_inlink_coverage reported 0/13, and the third pathophysiology node was a dead end. Added 11 downstream edges, each with its own evidence quoting a sentence already cached for this entry: the reabsorptive-failure node now reaches the eight renal solute phenotypes, the skeletal node reaches Hypophosphatemic rickets and Growth delay, and the primary-lesion node reaches Chronic kidney disease. causal_inlink_coverage is now 11/13 and no node lacks an outgoing edge. Nephrocalcinosis and Hyperinsulinemic hypoglycemia are left unconnected on purpose: both are FRTS4-specific features (nephrocalcinosis in HNF4A R76W carriers, the HNF4A beta-cell phenotype) whose mechanism this entry does not model, and an edge invented to clear the report would be worse than the gap. gene_mechanism_wiring_coverage was and remains 5/5.

    Validation on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 342 snippets checked, 0 issues; just count-verified-snippets reports 342/342 after reverting the fix-references-cache whitespace churn. just check-genereviews confirms no GeneReviews or StatPearls chapter exists for this disease against the committed 2026-09-10 Bookshelf index, and the entry carries synonyms so that is a verified negative.

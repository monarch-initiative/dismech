  summary: 'Review round 1: re-cite the hypophosphatemia edge to a primary FRTS cohort'
  details: |
    Review round 1 on dismech#13279, one suggestion.

    The Hypophosphatemia edge added earlier in this pull request cited PMID:40225330 with a snippet about low tubular reabsorption of phosphate. The reviewer noted two problems with that pairing: the paper is a reversible Fanconi syndrome caused by vitamin D deficiency rather than a primary inherited FRTS, and the quoted measurement is urinary phosphate handling rather than the serum phosphate the phenotype names. The edge now cites PMID:24285859 instead, the HNF4A R76W cohort already cited elsewhere in this entry, whose proximal-tubulopathy sentence names hyperphosphaturia in a primary dominant FRTS, which is the urinary loss that lowers serum phosphate. The edge description is unchanged.

    PMID:40225330 is left in place on the Hypophosphatemia phenotype record itself, where it predates this pull request. Removing it there would be a separate judgement about pre-existing content that this round did not investigate.

    Validation after the round, on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 349 snippets checked, 364 titles checked, 0 issues; just count-verified-snippets reports 349/349 after reverting the 18 reference-cache files the validator renormalised. causal_inlink_coverage stays 11/13 and gene_mechanism_wiring_coverage 5/5.

  summary: 'Gene-family review: SLC34A1 disputed; all five FRTS gene records typed'
  details: |
    ClinGen's Tubulopathy GCEP grades SLC34A1 for Fanconi renotubular syndrome 2 as Disputed (2022, re-evaluated 2025-12-03): one in-frame duplication in one proband (PMID:20335586), 0.5 of 12 genetic points, and no valid evidence remaining. Following the ZFYVE27 pattern in Hereditary_Spastic_Paraplegia, the FRTS2 has_subtypes row was removed, the SLC34A1 record is typed DISPUTED with the ClinGen row and its summary sentence quoted as evidence (CGGV:assertion_c8aec2b2-9433-4f9f-8015-5f3dd46369d0-2025-12-03T050000.000Z), SLC34A1 was removed from the shared proximal-tubule mechanism node, and the description and notes now list four curated subtypes. All five genetic records were untyped with no variant origin and EHHADH and HNF4A had no evidence. Now: GATM typed UNKNOWN with ClinGen Moderate (AD) recorded for FRTS1 (CGGV:assertion_6fd7df41-d1c7-415b-aac5-6308f039927d-2026-04-30T040000.000Z); EHHADH typed UNKNOWN with ClinGen Limited (AD) recorded for FRTS3 (CGGV:assertion_f938d7bc-f717-438c-bc27-962ba62dde93-2026-03-20T160000.000Z); HNF4A R76W typed CAUSATIVE for FRTS4 (PMID:24285859; ClinGen classifies HNF4A only for monogenic diabetes); NDUFAF6 typed CAUSATIVE for FRTS5 (nine homozygous affected Acadians, PMID:27466185; ClinGen classifies NDUFAF6 only for Leigh syndrome and mitochondrial disease). Each record now has germline origin, its subtype and a record-level inheritance block (AD for GATM, EHHADH, HNF4A; AR for NDUFAF6) quoting the subtype's own source. The shared node still carries GATM, EHHADH, HNF4A and NDUFAF6 with no molecular function; splitting it into gene-specific trigger nodes is left open.

  summary: Split HNF4A and EHHADH onto gene-specific nodes with molecular functions
  details: |
    Requested by the peroxisomal, insulin-secretion and complex I gene-family reviews. The shared node 'Proximal tubular transport and energy-metabolism defect' carried GATM, EHHADH, HNF4A and NDUFAF6 with no molecular function. Two genes now have their own upstream nodes feeding that node, so the shared node's edges to reabsorptive failure and chronic kidney disease are unchanged. 'HNF4A R76W transcription factor defect' binds GO:0001228 DNA-binding transcription activator activity, RNA polymerase II-specific, as DECREASED: earlier functional studies found decreased DNA binding (PMID:24285859) and in a Drosophila nephrocyte model the variant depletes wild-type HNF4 from the nucleus (PMID:31875549). 'EHHADH E3K mistargeting to mitochondria' binds the enzyme's two activities, GO:0004300 enoyl-CoA hydratase activity and GO:0003857 (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity, as ABNORMAL (mislocalization), with mitochondrion as cellular component: the variant creates a mitochondrial targeting motif, the mutant enzyme is mistargeted to mitochondria, and unaffected knockout mice indicate a dominant-negative effect (PMID:24401050). GATM and NDUFAF6 stay on the shared node without a molecular function: the dominant GATM variants act through intramitochondrial fibrillar aggregation (PMID:29654216), and NDUFAF6 has no established molecular function, so no term describes either lesion. The shared node's description now says it is the convergence point. The HNF4A curated summary (hgnc_5024) was refreshed and verifies.

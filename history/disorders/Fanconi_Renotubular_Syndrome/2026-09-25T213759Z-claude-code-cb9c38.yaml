  summary: 'Review round: regrade GATM functional-readout evidence'
  details: |
    The FRTS1 subtype evidence item quoting PMID:29654216 on ROS production, NLRP3 activation, IL-18 expression and cell death was graded HUMAN_CLINICAL. The abstract does not attribute those readouts to patients: its Methods list expression studies in biopsies and renal cells, knockout mice, and evaluations of mitochondrial morphology and function, and the quoted Results sentence names no system. Regraded to IN_VITRO with directness INDIRECT, and the explanation records that this is the best reading of the abstract. The full text (PMC6050927) could not be retrieved in this session: the PMC page served a captcha, the Europe PMC full-text endpoint returned 500, and a forced refetch returned the abstract only. Merged main.

  summary: Regrade migration phenotypes onto specific neuropathology quotes
  details: |
    Second review round, non-blocking items. Polymicrogyria had been graded SUPPORT on a GeneReviews quote that never names it, while Gray Matter Heterotopia two entries below graded the same quote PARTIAL for exactly that reason - one snippet carrying two strengths for the same kind of claim. Both now cite the specific human neuropathology sentences in PMID:9382874 naming lateral polymicrogyria and subcortical heterotopic neurons directly, so both are SUPPORT on evidence that names them, with the GeneReviews quote kept as a PARTIAL companion placing the findings among the congenital malformations. Both are graded OTHER rather than MODEL_ORGANISM: the sentences are introduction material reciting prior human Zellweger autopsy series in a paper whose own results are in mice, so the file now grades that PMID per sentence - OTHER for the human pathology it cites, MODEL_ORGANISM for the authors' own mouse results. Bound the plasmalogen biomarker to CHEBI:64611 ether lipid. A follow-up review then pointed out that heterotopia was still frequency OCCASIONAL while polymicrogyria was FREQUENT, although the two are described in adjacent clauses of one sentence as a single co-occurring picture; heterotopia is now FREQUENT with the reason stated. 36/36 snippets verified and independently re-checked as raw substrings.

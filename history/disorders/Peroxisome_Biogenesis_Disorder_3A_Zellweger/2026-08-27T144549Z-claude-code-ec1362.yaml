  summary: 'Create: Peroxisome Biogenesis Disorder 3A (PEX12)'
  details: |
    New entry for PEX12-related severe Zellweger spectrum disease, historically complementation group 3 (MONDO:0013927). Ten pathophysiology nodes running from biallelic PEX12 loss through the PEX2-PEX10-PEX12 retrotranslocation channel and failed PEX5 recycling to collapsed matrix import, then branching into the accumulation arm (VLCFA, branched-chain, C27 bile-acid intermediates) and the deficiency arm (plasmalogens), which converge on impaired cortical neuronal migration and diverge to hepatic and adrenal injury. The migration edges are INDIRECT_UNKNOWN_INTERMEDIATES because which substrate mediates the effect is not established. Curated as the severity counterpart to the existing PBD 1B (PEX1) and 4B (PEX6) entries. An INTERPRETATION discussion records the group-3 genotype-phenotype exception where a 2-bp frameshift eight codons in behaved as a mild allele because translation reinitiated at a downstream AUG, with the general lesson that predicted-truncating describes a reading frame rather than a protein. The Pex2-null mouse is curated as an animal model with limitations stating plainly that the gene is a paralogue, not PEX12. GeneReviews PMID:20301621 tagged and mined across all four sections, with phenotypes graded PARTIAL where the supporting sentence describes the milder end of the spectrum rather than the severe form. Ten suggested CURIEs were wrong, obsolete or nonexistent; the consequential one was GO:0033539, offered for peroxisomal beta-oxidation but actually the mitochondrial acyl-CoA dehydrogenase process, which would have inverted the mechanism. 25/25 snippets verified and independently re-checked as raw substrings; two GeneReviews quotes stop short of bracketed text the validator strips.

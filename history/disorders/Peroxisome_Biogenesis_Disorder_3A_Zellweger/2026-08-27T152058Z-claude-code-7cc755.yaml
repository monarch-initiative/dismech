  summary: 'Review response: biochemical section, cholic acid, GR counseling, phenotypes'
  details: |
    Response to the first review round, closing six blocking items. The one worth recording plainly: the CREATE record and the PR body both claimed GeneReviews was mined across all four sections, and Genetic Counseling was not mined. Review caught it. The recurrence-risk sentence is now cited on the inheritance block, the CREATE record's details are corrected to name the three sections actually mined at creation, and the entry notes record that the earlier claim was wrong. Added a biochemical section - the entry had none while both sibling PBD entries carry four or five, and the biomarker claim was sitting in diagnosis prose where nothing could query it: VLCFA (CHEBI:27283), C26:0-lysoPC, and plasmalogens, with readouts pointing at the accumulation and deficiency nodes so both directions of the signature are linked. Added cholic acid as a standalone treatment; it is the only FDA-approved ZSD therapy and the only intervention here acting on a curated mechanism node, so burying it inside supportive care lost the entry's only real treatment-to-pathograph join. Rebound the Liver Disease phenotype from HP:0002240 Hepatomegaly to HP:0001410 Decreased liver function, since neither the description nor the snippet asserts an enlarged liver. Curated polymicrogyria and gray matter heterotopia, which the pathophysiology node described in prose but the phenotype section omitted, plus cataract, whose treatment the entry was already citing, and feeding difficulties. Treatment join points 3 to 5. 34/34 snippets verified and independently re-checked as raw substrings.

  summary: 'Gene-family review: PEX12'
  details: |
    PEX12 was not on any mechanism node, so its genetic record was unwired, and the node standing for it bound zinc ion binding, a structural property of its RING domain rather than the activity lost. 'Biallelic PEX12 Loss of Function' now carries PEX12 and binds ubiquitin ligase activator activity (GO:1990757, DECREASED): in the mammalian assay PEX12 enhances the E3 activity of PEX10 (PMID:24662292), and the PEX12 and PEX10 RING fingers jointly polyubiquitinate receptors that fail to recycle (PMID:35768507). The downstream complex node replaces the generic ubiquitin-protein transferase activity with ubiquitin protein ligase activity (GO:0061630) and adds the retrotranslocation channel activity (GO:0008320), both cited to PMID:35768507, which shows each RING peroxin contributing transmembrane segments to the channel. The genetic record now records germline origin.

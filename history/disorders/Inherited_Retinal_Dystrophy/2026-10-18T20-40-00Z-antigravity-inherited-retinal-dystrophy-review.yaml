  summary: Expanded Inherited Retinal Dystrophy with molecular function grounding for all 6 genes, prevalence,
    progression, causal edge evidence, multimodal retinal diagnosis, and differential diagnoses.
  details: Added Harrison chapter classifications, evidence for autosomal recessive, autosomal dominant,
    and X-linked inheritance modes, global point prevalence (1 in 2,000 to 1 in 4,000), two-phase clinical
    progression, evidence on Cone-Rod Dystrophy subtype, molecular_functions grounding all 6 causative
    genes (RPGR, USH2A, RPE65, RHO, ABCA4, CHM) across their respective upstream pathophysiology trigger
    nodes, causal_link_type and evidence on all Photoreceptor Cell Death -> phenotype edges, reports_on
    readout on Abnormal Electroretinogram, multimodal retinal examination/ERG and NGS diagnostic entries,
    and Usher syndrome and Stargardt disease differential diagnoses.

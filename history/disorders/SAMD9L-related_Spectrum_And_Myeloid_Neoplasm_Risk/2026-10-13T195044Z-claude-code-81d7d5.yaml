  summary: 'Review round 1: SAMD9L-related_Spectrum_And_Myeloid_Neoplasm_Risk'
  details: |
    Response to the first automated review of PR 14047 and a CI failure. Added reference_title (copied from the cached CGGV frontmatter) to the four ClinGen evidence items. Added the GeneReviews (PMID:28570036) agents-to-avoid items as two treatment rows with exact snippets and no ontology binding: an OLS NCIT search for 'avoidance' returned only NCIT:C54264 Avoidance, which sits under Behavior/Activity, not Clinical Intervention or Procedure. Added the GeneReviews diagnostic-criterion sentence to the diagnosis row and the 50% transmission-risk sentence to the inheritance block. Added Neutropenia (HP:0001875) and Hypogammaglobulinemia (HP:0004313; labels and CURIEs checked on OLS) from Erlacher 2023 (PMID:37584291), described as coming from a selected cohort of seven children, wired downstream of the progenitor-restriction and B/NK nodes; Hypogammaglobulinemia is also targeted by immunoglobulin replacement. Added Dysarthria (HP:0001260) from the SCA49 paper and GeneReviews management text. Removed the unsourced edge from B/NK deficiency to interferon induction rather than citing PMID:28202457 for it: that quote reports infections preceding MDS, not interferon induction by those infections; the authors' 'IFN-driven, demand-adapted hematopoiesis' suggestion is now cited on the interferon node instead. CI gate check_gene_activity_grounding failed because the node SAMD9L lands on had no molecular function; bound GO:0030371 translation repressor activity (modifier INCREASED), supported by Russell 2021 (PMID:34417303) describing SAMD9L as an interferon-induced translational repressor. NCT04965597 was fetched and not added: the cached ClinicalTrials.gov summary does not mention SAMD9L, so the link could not be verified from the cache. Deleted the ATXPC (MONDO:0008038) and M7MLS1 (MONDO:0009646) stubs, whose mondo_id values exactly match has_subtypes terms in this entry.

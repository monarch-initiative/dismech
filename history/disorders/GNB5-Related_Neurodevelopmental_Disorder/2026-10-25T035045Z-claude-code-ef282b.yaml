  summary: 'Review round 1: add diagnosis, prevalence, progression'
  details: |
    Addressed the first automated review. Added a diagnosis section: GNB5 molecular genetic testing (GeneReviews criterion; RNA studies for intronic alleles, PMID:37994112), cardiac rhythm evaluation by Holter monitoring (PMID:41757252, GeneReviews at-risk-neonate recommendation), EEG (PMID:31631344) and ERG (PMID:31720979). Added a CASES_IN_LITERATURE prevalence record (44 patients, PMID:33172956) and a progression record (progressive sinus node dysfunction, increased early mortality). Added the GeneReviews recurrence-risk sentence to inheritance, the homozygous 15q21.2 whole-gene microdeletion (PMID:32477400) to the genetic record, an INDIRECT mouse-evidence edge from abnormal neuronal development to motor delay, a note that the mild ID row covers GeneReviews' mild-to-moderate figure, and a second KNOWLEDGE_GAP discussion for the unwired neurodevelopmental and gastrointestinal phenotypes. Did not add a mappings.mondo_mappings record for the anchor term: no predicate fits an entry broader than its own disease_term, so the explanation stays in notes. Validated with validate-disorders (69/69 snippets) and the offline KB gates.

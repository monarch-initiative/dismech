  summary: 'Create: GNB5-Related_Neurodevelopmental_Disorder'
  details: |
    New entry for the GNB5 spectrum, anchored on MONDO:0014957 (LADCI) with MONDO:0014953 (IDDCA) and MONDO:0014957 as has_subtypes, following the GeneReviews chapter (PMID:34436834), which treats both MONDO terms as one allelic-severity disorder. Both stubs are deleted: LADCI is curated here, IDDCA is recorded as a subtype. Deep research was requested from falcon with --fallback; falcon was not configured, so the report was produced by openscientist (research/GNB5-Related_Neurodevelopmental_Disorder-deep-research-openscientist.md). Its 19 references all resolved, preflight-dr passed for GNB5, and its one mislabelled term was MONDO:0014953 named by its IDDCA synonym. Most references were found by a direct PubMed search before the report finished; PMID:22371490 was taken from the report. The pathograph runs GNB5 loss of function to loss of Gbeta5-R7 RGS complexes, then branches to enhanced muscarinic I-K,ACh activation and exaggerated parasympathetic slowing of heart rate (sinus bradycardia, sick sinus syndrome), prolonged neuronal inhibitory GPCR signaling (ADHD), and retinal photoreceptor and ON-bipolar signaling (abnormal dark-adapted ERG). Seizures have no upstream edge, because no cited source links the signaling defect to epilepsy; a KNOWLEDGE_GAP discussion records this. GeneReviews agents to avoid (parasympathomimetics, beta blockers) are recorded as a treatment entry. Validated with just validate, validate-terms, count-verified-snippets (57/57) and validate-disorders, plus the offline KB gates.

  details: |
    Curates ependymoma (MONDO:0016698) as a single root entry with eight has_subtypes organised on the WHO CNS5 (2021) axis of anatomical compartment x molecular group, rather than the legacy histological variants: ST-ZFTA, ST-YAP1, PFA, PFB, SP-EPN, SP-MYCN, Myxopapillary and Subependymoma.

    Pathophysiology is a fully connected causal graph rooted at radial glial progenitor transformation, fanning out to the three compartment-specific driver mechanisms: chromothripsis-derived ZFTA-RELA fusion with constitutive NF-kB activation (supratentorial), EZHIP overexpression with global H3K27me3 loss and PRC2 inhibition (posterior fossa group A), and NF2 loss / MYCN amplification (spinal). Downstream convergence covers CIMP-positive infant tumours, leptomeningeal dissemination, and the CSF-adjacent niche exploited by locoregional CAR T-cell delivery.

    Evidence: 29 unique PMIDs and 95 snippets, all verified as exact substrings of cached abstracts by linkml-reference-validator. Deep-research provenance is research/Ependymoma-deep-research-openscientist.md.

    Follow-up recorded in issue #7082: this entry is the worked case for the proposed lump/split rule, and a staged split into per-compartment entries is recommended once that rule is agreed. This record covers the lumped root entry as merged.

    Merge maintenance in this session: refreshed the branch against origin/main and resolved conflicts confined to generated term-validation caches arising from the MAXO removal. The five MAXO term bindings in the entry were remapped to their NCIT equivalents: MAXO:0000004 to NCIT:C15329 Surgical Procedure; MAXO:0000014 to NCIT:C15313 Radiation Therapy; MAXO:0000647 to NCIT:C15632 Chemotherapy; MAXO:0001616 to NCIT:C63328 DNA Methylation Analysis; MAXO:0000424 to NCIT:C16809 Magnetic Resonance Imaging. Revalidated with just validate, just validate-terms, and just validate-references (95/95 snippets verified).

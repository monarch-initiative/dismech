  summary: 'Phenotype review: Congenital_Fibrosis_of_the_Extraocular_Muscles'
  details: |
    Campaign phenotype review (snippet consistency, HPO term optimality, pathograph connectivity) of all 19 phenotypes against cached sources and the Falcon report. All 108 snippets verified in whole-abstract context; no wrong-disease or negated-claim evidence found. Three HPO rebinds to more specific terms: Bilateral Congenital Ptosis HP:0000508->HP:0007911 (Congenital bilateral ptosis), Restrictive External Ophthalmoplegia HP:0000544->HP:0007831 (Nonprogressive restrictive external ophthalmoplegia), Syndactyly HP:0001159->HP:0006101 (Finger syndactyly). Connectivity raised 0/19 to 15/19 phenotypes by 16 new downstream edges from existing pathophysiology nodes (denervation-fibrosis fan-out to the defining ocular phenotypes; aberrant reinnervation to A-pattern strabismus; nerve hypoplasia to III-nerve imaging phenotype and CFEOM2 exotropia; KIF21A lesion to abducens hypoplasia; commissural failure to callosal dysgenesis; beta-tubulin lesion to facial palsy, axonal neuropathy, intellectual disability, TUBB2B polymicrogyria; clinical endpoint to chin-up posture, amblyopia, exposure corneal scarring). Gene wiring raised 0/5 to 5/5 by adding genes descriptors to the four molecular pathophysiology nodes. Deliberately left unexplained with KNOWLEDGE_GAP discussions: Optic Nerve Hypoplasia (no source mechanism for sensory-pathway involvement) and Tukel limb anomalies (gene unmapped at 21qter); Refractive Error left unwired per its own description, which records the absent causal step. Validated with just validate-disorders (schema, terms, references all green).

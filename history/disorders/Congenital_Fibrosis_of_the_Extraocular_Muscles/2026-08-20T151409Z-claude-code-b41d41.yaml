  summary: 'Create: Congenital Fibrosis of the Extraocular Muscles (CFEOM, MONDO:0007614)'
  details: |
    New root entry for the CFEOM phenotypic series (MONDO:0007614), curated with has_subtypes for CFEOM1 (KIF21A), CFEOM2 (PHOX2A/ARIX), CFEOM3A (TUBB3), CFEOM3B (KIF21A), CFEOM3C (locus-defined), CFEOM5 (COL25A1), and the Tukel syndrome variant.

    Modelled deliberately as a congenital cranial dysinnervation disorder (CCDD), not a primary myopathy. The pathograph runs from four molecular lesions (KIF21A autoinhibition loss, PHOX2A specification failure, TUBB3/TUBB2B microtubule dysfunction, COL25A1 loss) through oculomotor axon stalling and aberrant growth-cone guidance, to hypoplasia of the oculomotor and trochlear nerves, and only then to denervation-driven extraocular muscle maldevelopment and fibrosis. A REFUTE evidence item on the fibrosis node names the primary-myopathy model that the Engle 1997 neuropathology (PMID:9066352) refutes, and the Demer 2005 genotyped orbital MRI study (PMID:15671279) states the neurogenic-primary ordering explicitly. A parallel aberrant-reinnervation node carries the synkinetic residual eye movements, and a TUBB3/TUBB2B commissural and corticospinal arm carries the syndromic CFEOM3 features.

    Three discussions were recorded: a KNOWLEDGE_GAP on why ubiquitously expressed cytoskeletal lesions produce a phenotype restricted to nIII/nIV; a KNOWLEDGE_GAP noting that MONDO currently places MONDO:0007614 under myopathy of extraocular muscle and progressive muscular dystrophy, which the curated non-progressive neurogenic mechanism contradicts (recorded rather than reclassified, since resolution belongs upstream in MONDO); and a KNOWLEDGE_GAP on the large genetically unsolved ocular CCDD cohort (PMID:39033378).

    Cross-references rather than duplicates the existing Duane_Retraction_Syndrome and TUBB3-related_Tubulinopathy entries. Moebius syndrome and HGPPS were checked for and are not yet in kb/disorders, so they are named in the description only.

    Deep research: falcon, report at research/Congenital_Fibrosis_of_the_Extraocular_Muscles-deep-research-falcon.md. The NEC preflight (just preflight-dr) returned SKIP because MONDO:0007614 is a phenotypic-series root with no RO:0004003 causal gene, so the manual section 2b checks were run instead. The report's top gene mentions were TUBB3=22, KIF21A=20, PHOX2A=19, TUBA1A=8, TUBB2B=8, which is exactly the expected gene set for the CFEOM series root with no dominant foreign gene; the report keyed off the MONDO exact label rather than an ambiguous synonym; the report asserted no OMIM identifiers, so the OMIM cross-check was not applicable. Report reference_validation was 6/6 resolved, 0 unresolved, 0 off topic. The report was treated as leads only; every PMID and every snippet in this entry was independently fetched with just fetch-reference and verified against references_cache.

    Prevalence was deliberately omitted. The falcon report states that no reliable population-based prevalence, incidence, carrier-frequency, sex-ratio, or geographic estimate could be recovered, and no cited source supported a number, so recording one would have been fabrication.


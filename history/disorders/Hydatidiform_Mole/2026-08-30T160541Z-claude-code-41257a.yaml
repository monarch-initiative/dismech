  summary: 'Withdraw: Hydatidiform_Mole icdo_morphology (Trophoblastic Tumor) removed
    as non-neoplastic'
  details: |
    Removes the classifications.icdo_morphology = 'Trophoblastic Tumor' assignment added earlier in the same pull request (monarch-initiative/dismech#10163), and records the reasoning in the entry's notes instead. Raised as a judgement call by the automated reviewer and confirmed against NCIt: hydatidiform mole carries ICD-O morphology codes (9100/0 for the mole NOS, 9103/0 for the partial mole), which is what made the assignment look correct, but NCIT:C3110 (Hydatidiform Mole) does not descend from NCIT:C3422 (Trophoblastic Tumor). Its parents are Gestational Trophoblastic Disorder and Placenta Disorder; NCIt asserts no Neoplastic_Status for it; and NCIT:C4871 (Complete Hydatidiform Mole) and NCIT:C4293 (Partial Hydatidiform Mole) both sit under Placental Non-Neoplastic Disorder. WHO reserves gestational trophoblastic neoplasia for invasive mole, choriocarcinoma, PSTT and ETT, so a non-invasive mole is gestational trophoblastic disease but not GTN. ICDOMorphologyEnum applies only to neoplastic diseases, so the assignment failed the same NCIT-descent rule every other value in this tranche passes. Omitting the slot and recording why is the convention this pull request argues for, applied to its own work. The molar pregnancies that do progress are covered by the Gestational_Trophoblastic_Neoplasm entry, which carries Trophoblastic Tumor correctly. Validated with linkml-validate against the Disease class.

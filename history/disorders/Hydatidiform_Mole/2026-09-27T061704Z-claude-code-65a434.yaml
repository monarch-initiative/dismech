  summary: 'Genetics pass: curate the HYDM1-4 recurrent-mole series and wire six maternal-effect
    genes'
  details: |
    Genetics pass for the d2g series-062 gap list (issue #12269).

    Anchor check first: MONDO:0006248 hydatidiform mole is correct for this entry
    and contains every row it carries. It has seven descendants, of which four are
    the numbered recurrent-mole classes, each naming one gene in its OWL axioms:
    HYDM1 NLRP7, HYDM2 KHDC3L, HYDM3 MEI1, HYDM4 TOP6BL. The gap list named only
    HYDM3 and HYDM4, because NLRP7 and KHDC3L were already curated as genes, so the
    unit of work taken here was the whole four-member series rather than the two
    rows named.

    Bound subtype_term on the two pre-existing histological rows (MONDO:0016785
    complete, MONDO:0016786 partial) and added four gene-defined rows HYDM1 to
    HYDM4 with genes, autosomal recessive inheritance and evidence. HYDM1 and HYDM2
    are also listed as children of the Familial Biparental Mole row, which is the
    grouping the two subcortical maternal complex genes share; MONDO has no general
    recurrent-mole class for that row to bind. Retargeted the NLRP7 and KHDC3L
    genetic[].subtype foreign keys from the umbrella row to HYDM1 and HYDM2 and
    added the missing relationship_type on both.

    Added four gene records: MEI1 and TOP6BL from PMID:30388401, plus REC114 from
    the same study and PADI6 from PMID:29693651, neither of which has a numbered
    MONDO class. Searches recorded in the notes. Wired all six genes into the
    pathograph, taking gene-to-mechanism coverage from 0/2 to 6/6, and deliberately
    onto two different nodes: NLRP7, KHDC3L and PADI6 on the imprinting node,
    because their moles are diploid biparental and the lesion is absent methylation
    at maternal DMRs (PMID:26544189, PMID:31847873); MEI1, TOP6BL and REC114 on the
    aberrant-fertilization node, because their moles are genuinely androgenetic. The
    primary report states that distinction explicitly and also hedges its own
    claims, establishing MEI1 and possibly the other two, which is quoted on the
    REC114 record rather than smoothed over.

    The maternal-effect point is now stated explicitly in the description and notes:
    in all six genes the biallelic variants are the mother's and the conceptus need
    carry none of them. HPO has no mode-of-inheritance term for a maternal-effect
    disease (HP:0000005 has 40 descendants and none names one), so the inheritance
    blocks record autosomal recessive transmission of the maternal genotype and the
    distinction is carried in prose.

    Two phenotypes that no edge reached were wired from the trophoblastic
    hyperplasia node, taking phenotype causal inlink from 0/3 to 2/3; Elevated hCG
    stays a readout, which is the accurate modelling.

    hgnc:26197 is bound with label C11orf80 rather than TOP6BL: HGNC approved
    TOP6BL on 2023-05-18 but the OBO build behind term validation still carries the
    previous symbol, and using the approved symbol fails validation. This follows
    the GBA1/GBA arrangement in CLAUDE.md, with the approved symbol in
    preferred_term and the rename recorded in the gene notes.

    Self-review against the caches changed five prose claims that had passed every
    gate: the description had grouped PADI6 with NLRP7 and KHDC3L under a
    methylation claim no source makes for it; the polar-body mechanism had been
    asserted for all three meiotic genes where only Mei1 was demonstrated; an
    unsourced SPO11-partner claim for TOP6BL; an unsourced frequency comparison on
    HYDM2; and the PADI6 notes had said four molar pregnancies where pathology
    re-review of the four available products of conception found one mole.

    Validation: just validate 44 snippets and 44 titles clean; validate-terms
    clean; list-gene-term-mismatches 28/28 compared across both files, no wrong
    bindings (three advisory rows, all the TOP6BL/C11orf80 build lag);
    check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-case-collisions,
    check-coarse-phenotypes all clean. LRV 0.3.0rc3.

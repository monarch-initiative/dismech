  details: |
    Review round 2 on PR #13022, correcting two defects introduced by this PR's rebase onto main rather than by its original curation. The familial-biparental-mole split in this entry comes from main, not from this PR: while this branch was open, main gained a Familial Biparental Mole grouping row with children HYDM1 and HYDM2, plus its own HYDM1, HYDM2 and HYDM3 rows, each with a bound subtype_term, genes, classification and inheritance. Resolving the rebase conflict, this PR's own HYDM2 row was carried alongside main's, leaving two rows named HYDM2 both binding MONDO:0013671, so every subtype: HYDM2 foreign key matched two rows. No gate catches this: a repeated subtype name is invisible to just validate, check-duplicate-keys (which checks mapping keys, not list-item names) and check-entity-refs. The verification done at rebase time was also structurally incapable of finding it, because it compared sorted-unique name lists in one direction only - every name in main was present, which a duplicate does not disturb. This PR's row is deleted and main's richer row kept. Second, the grouping row's description had been left reading 'This row is the NLRP7 form, which MONDO numbers HYDM1', which is false for a row whose children are HYDM1 and HYDM2; main's wording is restored. The 55 percent NLRP7 figure that sentence carried is dropped rather than moved to the HYDM1 row: it was attributed to a figure in a cited paper rather than to a quotable sentence, and no cached reference in this entry states it, while the HYDM1 row already describes NLRP7 as the commonest monogenic cause. Kept from this PR: the two imprinting-node evidence items and the evidenced Vaginal bleeding and Elevated hCG edges. Validation after the fixes: just validate passes, no duplicate - name values remain in the entry, count-verified-snippets 173/173 across the three files changed in this round.

  summary: Split the familial biparental row into HYDM1/HYDM2 and wire NLRP7, KHDC3L
    and two phenotypes
  details: |
    series-064 genetics pass, receiving two rows routed from Gestational_Trophoblastic_Neoplasm. MONDO files hydatidiform mole, recurrent, 1 and 2 under both complete hydatidiform mole and gestational trophoblastic neoplasm, so they appeared on the GTN parent's gap list; NLRP7 and KHDC3L were already curated here, under a single Familial Biparental Mole row that lumped both genes and bound no MONDO class. Split that row into HYDM1 (MONDO:0009273, NLRP7) and HYDM2 (MONDO:0013671, KHDC3L), following MONDO's gene series, and repointed the two genetic records' subtype keys. Wired both genes onto the imprinting node with two new evidence items, taking gene wiring 0/2 to 2/2, and wired vaginal bleeding and elevated hCG from the trophoblastic hyperplasia node, 0/3 to 2/3. Severe nausea and vomiting is left unwired: the entry's own description attributes it to the hCG elevation, but no source reachable from this worktree states that causal step, and an unsourced edge is worse than a gap.

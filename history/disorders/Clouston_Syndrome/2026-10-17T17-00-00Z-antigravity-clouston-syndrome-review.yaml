  summary: Added GeneReviews baseline (PMID:20301379), synonyms, Harrison's classifications, inheritance,
    structured prevalence, progression phases, ClinGen GJB6 assertion, inner-ear Cx30 pathophysiology
    node, molecular function bindings with modifiers, and MONDO-bound differential diagnoses.
  details: 'Reviewed Clouston_Syndrome.yaml for issue #10531. Added synonyms (hidrotic ectodermal dysplasia
    2, hidrotic ectodermal dysplasia), tagged and mined the GeneReviews chapter (PMID:20301379) across
    inheritance, progression, phenotypes, diagnosis, and treatments, and added classifications (DERMATOLOGY,
    GENETICS_ENVIRONMENT_DISEASE), autosomal dominant inheritance (HP:0000006), structured global prevalence
    (~1:100,000, measure_type: UNKNOWN, prevalence_class: BAND_1_9_PER_100000), ClinGen Definitive GJB6
    assertion, GO:0055077 (gap junction hemi-channel activity, GAIN_OF_FUNCTION) on Aberrant Hemichannel
    Activity and ATP Release, GO:0005243 (gap junction channel activity, DECREASED) on Impaired Connexin
    30 Trafficking, a new Inner Ear Connexin 30 Dysfunction node, causal downstream edges with evidence,
    and MONDO-bound differential diagnoses for Pachyonychia Congenita (MONDO:0016471) and Keratitis-Ichthyosis-Deafness
    Syndrome (MONDO:0007850).'

  summary: Convert 50 unverifiable DOI references to PMIDs
  details: |
    The entry cited 50 evidence items against bare DOI references. DOI is listed in skip_prefixes in conf/reference_validator_config.yaml, so none of those 50 snippets was ever checked against anything - the entry scored 99.6% on compliance while resting on one verifiable PMID.

    Converted all three DOIs to their PMIDs: 10.1111/cge.13980 -> PMID:33960418, 10.1186/s12887-021-02922-7 -> PMID:34625039, 10.1073/pnas.0507685103 -> PMID:16537452.

    On first validation 101 of 103 snippets verified, which is the important result: the curator's DOI-cited quotes had been accurate all along, merely unverifiable. The two failures were the same quote used twice, spanning the bracketed HGVS span [Arg889Profs*12]; bracketed spans are stripped from snippets before matching unless they match a literal_bracket_patterns entry, and an HGVS protein change matches neither pattern. Rather than widen the global bracket config - which would affect every cached reference in the KB - the snippet was shortened to a verbatim span that does not cross the bracket.

    Now 103/103 verified. No claim was changed; only the reference identifiers and one quote boundary.

    Validation: just count-verified-snippets 103/103; included in the batched just validate-disorders run over 10 files.

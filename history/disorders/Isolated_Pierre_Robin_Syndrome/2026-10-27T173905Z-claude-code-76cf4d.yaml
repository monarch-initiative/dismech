  details: |
    Answered the 2026-10-24 review. Retargeted treatment target_mechanisms off the embryonic node Impaired Mandibular Outgrowth: airway support and surgical airway management now target Upper Airway Obstruction, nutritional support targets Feeding Difficulties. The surgery treatment kept the PMID:37728101 exclusion-criterion quote with an explanation that says only that the procedures are used in Robin sequence, and gained the paper's introduction sentence on escalation to surgical intervention, marked quote_role BACKGROUND. Corrected the earlier record of this PR, which named PMID:27429161 as the source of that evidence. Also took the optional suggestions: dropped GO:0003700 (parent of the retained GO:0000981), dropped the vague GO:0006355 process from the enhancer-deletion node, removed palate and tongue locations from the mandibular outgrowth node, noted that chondrocytes are the affected tissue rather than the site of the expression defect, and softened the unsourced cleft-palate edge to a proposed mechanism. Validated with just validate (27/27 snippets) and the entity-ref, causal-target, duplicate-key, enum and coarse-phenotype gates.

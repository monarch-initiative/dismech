  summary: Create isolated Pierre Robin syndrome with a SOX9 regulatory subtype
  details: |
    Created MONDO:0009869 after upstream, all-state PR, and issue duplicate preflight; the existing Agnathia-Otocephaly PR 8713 and issue 7666 only mentioned Pierre Robin as a differential. OAK confirmed the canonical label. GeneReviews and StatPearls baseline checks found no dedicated chapter. Curated the family F1 SOX9 upstream deletion from Benko 2009, refined by Gordon 2014 to hg19 chr17:68,663,923-68,748,011 inclusive with a 9 bp junction insertion; retained the different POSTRE Table 1 Nr2 75 kb interval only as benchmark provenance. Long 2020 enhancer experiments use engineered hESC-derived cranial neural crest cells, not patient cells or the full F1 deletion. Separate physical enhancer loss, context-restricted expression loss, and jaw undergrowth; classify experimental mLOE while marking patient extrapolation provisional, with intact SOX9 as regulatory target. Clinical features and supportive care use a prospective mixed Robin-sequence cohort without transferring pooled frequencies to isolated cases. Reviewed research/Isolated_Pierre_Robin_Syndrome-deep-research-asta.md and its validation: 28/28 identifiers resolved; no unresolved references. The report records requested Claude Code and actual Asta fallback. Relevance warnings were manually assessed: the Ukrainian Robin-sequence review is on-topic but its blanket sporadic-inheritance claim is not used; the Kniest/COL2A1 case is a syndromic differential and excluded. Automated named-entity preflight skipped because MONDO lacks a causal-gene annotation; manual label and synonym review confirmed isolated Robin sequence, and no syndromic findings were imported. The retrieval report informed scope only; YAML evidence was verified directly against Benko, Gordon, Long, Amarillo, the clinical cohort, and the consensus report. Schema, ontology terms, 19/19 exact snippets, causal targets, and entity references pass.

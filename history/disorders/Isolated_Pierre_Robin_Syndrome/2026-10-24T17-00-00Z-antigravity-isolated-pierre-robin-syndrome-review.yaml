  summary: Comprehensive review and enrichment of Isolated Pierre Robin Syndrome entry
  details: |
    - Added `classifications` (`harrisons_chapter: GENETICS_ENVIRONMENT_DISEASE`, `isds_skeletal_category: dysostoses_with_predominant_craniofacial_involvement`).
    - Grounded `SOX9` gene activity on `Modular Loss of SOX9 Expression in Cranial Neural Crest` with `molecular_functions` (`GO:0003700` DNA-binding transcription factor activity, `GO:0000981` DNA-binding transcription factor activity, RNA polymerase II-specific).
    - Enriched `pathophysiology` nodes with `cell_types` (`CL:0000333` migratory neural crest cell, `CL:0000138` chondrocyte), `locations` (`UBERON:0004362` pharyngeal arch 1, `UBERON:0001684` mandible, `UBERON:0001716` palate, `UBERON:0001723` tongue), `biological_processes` (`GO:0006355` regulation of DNA-templated transcription, `GO:0051216` cartilage development), and connected all 5 phenotypes via `downstream` causal links.
    - Standardized `phenotypes` categories (`Head and Neck`, `Respiratory`, `Digestive`).
    - Added `diagnosis` section (`NCIT:C114185` Polysomnography, `NCIT:C124351` Clinical Evaluation, `NCIT:C18477` Microarray Analysis) with verbatim evidence (`PMID:37728101`, `PMID:27429161`, `PMID:23532965`).
    - Enriched `treatments` with `therapeutic_modality`, `target_mechanisms`, and added `Surgical Airway Management (Mandibular Distraction Osteogenesis or Tracheostomy)` (`NCIT:C15329` Surgical Procedure) with verbatim evidence (`PMID:37728101`).

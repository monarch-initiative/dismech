  summary: 'Review round 1: rebind spastic weakness phenotype, add animal_models'
  details: |
    Round 1 review response for PR #11395 (ai4c-reviewer, REQUEST_CHANGES: one blocking
    ontology finding, two non-blocking). All three addressed in a single push, because
    dismiss_stale_reviews means a follow-up commit costs a full re-review cycle.

    BLOCKING - Spastic Paresis phenotype bound a term its own evidence contradicts.
    The record bound HP:0002313 (Spastic paraparesis), a lower-limb deficit, while its
    only evidence item quotes "Advanced osteosclerosis commonly causes severe spastic
    quadriparesis in flexion". Quadriparesis is all four limbs, and the entry's own
    mechanism - compression at the cervical canal - points the same way. The reviewer
    offered HP:0002510 (Spastic tetraplegia) or HP:0001257 (Spasticity). Neither was
    taken: HP:0002510 has the right distribution but HPO defines it as "Spastic
    PARALYSIS affecting all four limbs", so it over-claims severity against a source
    that says paresis, and HP:0001257 discards information the evidence supplies.
    Bound HP:0001285 (Spastic tetraparesis) instead - HPO defines it as "Spastic
    weakness affecting all four limbs" and carries "Spastic quadriparesis" as an EXACT
    SYNONYM, a word-for-word match to the quote. Neither the reviewer nor the
    deep-research report surfaced this term; it was found by searching HPO for
    tetraparesis after checking HP:0002510's definition. preferred_term is now
    "Spastic quadriparesis in flexion", the notes record both rejected candidates and
    why each is wrong in a different direction, and the "which is the term HPO
    carries" clause the reviewer flagged is gone (HPO carries all four).

    NON-BLOCKING 1 - no animal_models section, though the rodent work is load-bearing.
    Taken. Four models added, all from publications already cited as evidence in the
    changeset plus one re-fetched source:
    - NaF-exposed Swiss albino mouse (PMID:33057951): RECAPITULATES skeletal fluoride
      accumulation; RESCUES the fluorapatite node in the calcium/vitamin D arm, with a
      RESTORED readout.
    - Fluoride-intoxicated Wistar rat on manipulated dietary calcium (PMID:32770327):
      RECAPITULATES accelerated turnover, with INCREASED turnover and INCREASED
      trabecular separation readouts against DECREASED mineral content - the entry's
      central paradox measured directly; also RECAPITULATES the collagen/matrix node
      via DECREASED osteocalcin/osteonectin/osteopontin.
    - Inbred mouse strain panel A/J, SWR/J, 129P3/J (PMID:16920415, re-fetched - its
      cache had been pruned as uncited before the first commit). This is the important
      one. RECAPITULATES skeletal fluoride accumulation with a clean dose-response,
      and FAILS_TO_RECAPITULATE the mixed sclerosis/osteomalacia/osteoporosis node:
      fluoride accumulated, mechanical bone quality degraded in the susceptible
      strain, and bone mineral density barely moved - and increased bone mineral
      density is the radiographic sign this disease is diagnosed on. Carries an
      INVALIDATING SPECIES_MISMATCH divergence and a QUALIFYING TEMPORAL_SCOPE
      divergence, a REFUTE evidence item, and UNCHANGED / DECREASED readouts. One
      model, two links, opposite verdicts. It also pairs with the genetic records and
      locates susceptibility in bone quality rather than density.
    - Skeletal fluorosis model rat for the gut-bone axis (PMID:41380608):
      RECAPITULATES the tryptophan-metabolism node (the metabolite deficit was found
      in model rats and human patients in the same study) and RESCUES the AHR/Wnt node.
    Every link carries fidelity, model_scale and limitations. just model-scale-audit
    --strict reports no upward extrapolation from any of them; its one strict
    complaint is a pre-existing link in Methylmalonic_Acidemia_With_Homocystinuria_
    Type_cblJ, not from this entry.

    NON-BLOCKING 2 - two research-surfaced items. Half taken, and the taken half says
    something different from what was suggested. PMID:10878791 was characterised as a
    muscle-weakness phenotype; reading it, it is a NEGATIVE result that independently
    supports this entry's compressive thesis - 22 patients with established
    osteofluorosis, biopsies showing type I atrophy and grouping, "No myopathic
    changes were observed", and "There was no evidence of any primary muscle pathology
    due to fluorosis". Curated two ways: a Neurogenic Muscle Atrophy phenotype
    (HP:0003202) reporting on the myelopathy node, and two evidence items on the
    sf_neuro_mechanism discussion, whose rationale now notes that this rules out a
    DIFFERENT alternative (primary myopathy) than the one the discussion turns on
    (direct cord neurotoxicity) while pointing the same way. Its cache had also been
    pruned as uncited and was re-fetched.
    The candidate HUMAN_MODEL_MISMATCH discussion was NOT curated, and the entry's
    notes say why: the mismatch may be real, but this entry holds no citable source
    reporting any human outcome for calcium/vitamin D in skeletal fluorosis, so a
    discussion whose refuting half is unsourced would assert the mismatch rather than
    record it. What is recorded instead is the rodent evidence, labelled rodent-only
    on the treatment record, on both of its model links, and in the notes.

    Counts after this round: 152 evidence items (was 132), 152/152 snippets verified;

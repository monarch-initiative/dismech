  summary: 'Create: Skeletal Fluorosis'
  details: |
    New disorder entry for skeletal fluorosis (MONDO:0400003), the crippling bone and
    joint disease of chronic fluoride excess. Curated as an environmental-exposure
    entry at the user's request.

    Why this disease. The KB already curates Dental_Fluorosis, but nothing on the
    skeletal form. They are not the same disease: enamel fluorosis is fixed when the
    enamel forms and does not progress, while skeletal fluorosis accrues for as long
    as exposure continues, in a different tissue by a different mechanism. Duplicate
    preflight was clean on all three surfaces - no kb/ entry on origin/main, no PR,
    no issue - and the Dental_Fluorosis entry is scoped strictly to amelogenesis.

    Content. 16 pathophysiology nodes with a single root, running exposure ->
    skeletal fluoride accumulation -> fluorapatite substitution -> three parallel
    arms (osteoblast proliferation/activation, impaired collagen and matrix
    mineralization, osteocyte-driven osteoclastogenesis) -> accelerated but
    disordered turnover -> mixed osteosclerosis/osteomalacia/osteoporosis ->
    ligament and interosseous membrane ossification -> spinal canal and foraminal
    narrowing -> compressive myelopathy and radiculopathy. A separate gut arm
    (microbial tryptophan metabolism -> AHR underactivation -> Wnt hyperactivation)
    and a secondary hyperparathyroidism arm feed the same chain. 6 phenotypes, 5
    environmental exposures, 3 genetic records, 3 biochemical markers with reference
    ranges, 3 diagnosis records, 4 differential diagnoses, 4 treatments, 3 prevalence
    records, 4 discussions, 3 GEO datasets, plus an ICD-10-CM and ICD-11 mappings
    block taken from MONDO's own exactMatch assertions. After the pre-commit review
    round described below: 8 phenotypes, 5 genetic records, 5 treatments and 5
    prevalence records.

    132 evidence items, 132/132 snippets verified against committed caches. 7 REFUTE
    and 1 NO_EVIDENCE item. Compliance 84.0%.

    Deep research. Requested provider was falcon; EDISON_API_KEY is not configured in
    this environment, so the run was made with `just dr_fallback='--fallback'` and
    fell back to claude_code. The report records that itself - fell_back: true,
    requested_provider: falcon, and the provider_attempts list are in its frontmatter
    rather than asserted in prose, and the recipe named the file after the actual
    producer. 50 citations, 22 web searches.

    The report's own validation was mixed and is disclosed in the entry's notes.
    References resolved cleanly (43/43, no confabulation) with one flagged off topic
    - PMID:34769866, a paper about school meal access during COVID-19, not cited
    here. Term validation was not clean: six CURIEs are named as a different term,
    including UBERON:0002298 offered for "vertebral column" when it is brainstem,
    UBERON:0004123 for "femur" when it is myocardial layer, UBERON:0002417 for
    "posterior longitudinal ligament" when it is abdominal segment of trunk, and
    HP:0009758 for "enamel hypoplasia" when it is a nail-fold skinfold term, and
    HP:0100774 for "Osteosclerosis" when HPO calls it Hyperostosis. Five of those six
    are real mis-namings and none of the five is bound in this entry. The sixth is
    MONDO:0400003, this entry's own disease_term, flagged only because the report
    listed "Ontology Lookup Service" beside the correct label "Skeletal fluorosis" -
    a false positive, and the entry's notes say so rather than repeating the
    validator's count uncorrected. The osteosclerosis phenotype binds HP:0005789
    (Generalized osteosclerosis), which is what the cited Ethiopian surveys and
    occupational review describe.

    All references were found independently through PubMed E-utilities before the
    report finished, and every ontology term was resolved through OAK or OLS before
    binding.

    Three controversies are curated as discussions rather than resolved:
    - sf_oxidative_stress (CONTROVERSY). PMID:34769367 calls oxidative stress "an
      essential mechanism in the pathogenesis of fluorosis" and reports raised MDA
      correlating with calcineurin activity. Against that, PMID:12660366 measured the
      antioxidant defence system directly - in patients from a 5 ppm endemic area and
      in rabbits at 150 ppm - and found no difference from controls on any of seven
      measures. The two are less opposed than they look: the negative measured BLOOD,
      the positive is in BONE TISSUE. The entry carries no oxidative-stress node, but
      for the narrower reason that no curated source measures oxidative stress in
      human fluorotic bone - not because the negative refuted the mechanism.
    - sf_osteoblast_dose_response (INTERPRETATION). Fluoride raises proliferation of
      human Saos-2 cells at 0.2 mM (about 3.8 mg/L fluoride ion) and lowers it in
      mouse osteoblasts at 2.26 mg/L. Stated in one unit, the stimulatory result is
      at the HIGHER dose, which is the opposite of what "biphasic" implies; the word
      is not used. What separates them in the curated evidence is the cell system.
      Both are curated on the same node, the suppressive result as a REFUTE.
    - sf_tgf_beta_direction (INTERPRETATION). TGF-beta1 is raised in an exposed human
      population and drives a Smad2/3/CyclinD1 proliferative axis, while H3K9
      trimethylation represses TGFBR2 and SMAD3 with COL1A1 falling. Modelled as two
      separate nodes reaching different consequences rather than one averaged claim.

    A fourth discussion, sf_neuro_mechanism, records that the neurological
    complications are compressive rather than neurotoxic. This determines the shape
    of the graph: the chain to myelopathy runs through bone, and the surgical
    treatment record is treatment_effect BYPASSES for the same reason.

    Datasets. `just discover-datasets Skeletal_Fluorosis` returns 12 candidates, all
    GENE_ONLY matches reached through this entry's own genes (BMP2, ALOX15) and none
    about fluoride - the Named Entity Confusion pattern arriving through gene search
    - so GEO was queried directly. Three series are curated - GSE70719 and GSE57550 (human osteosarcoma
    cells exposed to fluoride, framed by their authors as fluorosis models) and
    GSE203511 (fluoride-tolerant mouse osteoblasts, a resistance rather than injury
    resource) - each with its description stating that it is a cell or mouse model
    rather than patient material. A fourth candidate, geo:GSE22217, was REJECTED on
    relevance: it is a dental-implant surface-engineering study of osteoblast
    response to fluoride-modified titanium, reached through the word "fluoride", and
    curating it would be Named Entity Confusion arriving through dataset search. The
    enamel-focused fluoride series were left to Dental_Fluorosis.

    Not curated, and why. No GeneReviews article exists - PubMed returns zero for
    `fluorosis[TI] AND GeneReviews[TI]`, expected for an environmentally caused
    disease. PMID:28292354 ("Treatment and Prevention of Skeletal Fluorosis") was
    fetched and is deliberately not cited: its cached record carries no abstract
    text, so nothing in it is quotable. There is no human interventional evidence
    anywhere in the entry: both mechanism-directed treatments (calcium plus vitamin
    D, and tryptophan supplementation) rest on rodent studies and say so on the
    record.

    Pre-commit review round. Before anything was committed, the finished entry was
    put through an adversarial read against its own cached sources. It found five
    blocking defects, all in unvalidated free text rather than in the evidence layer,
    and every one was independently confirmed against the caches before being fixed:

    - Serum soluble Klotho was curated `presence: Decreased`. PMID:32721666 reports
      the opposite - sKlotho rises with tea fluoride intake, is positively associated
      with disease severity, mediates 17.76% of that effect, and rose in the rat
      model. The record's own notes then denied asserting a direction while the
      `presence` slot asserted the wrong one, and its snippet quoted the study design
      rather than the result. Fixed to Increased, with the association, the mediated
      fraction and the rat result quoted.
    - Two `notes` sentences referred to `Kashin-Beck_Disease` as a neighbouring
      entry. It is not in the knowledge base. Both removed.
    - `notes` claimed no source in the changeset reports an outcome for calcium and
      vitamin D. PMID:33057951 and PMID:32770327 were both already cached and both
      report measured rodent outcomes. Calcium plus vitamin D is now a curated
      treatment with two pathograph links.
    - `notes` claimed none of the six mislabelled CURIEs is bound in the entry. One
      of the six is MONDO:0400003, the entry's own disease_term (a validator false
      positive). Corrected in both the entry and this record.
    - The `Fluorapatite Substitution in Bone Mineral` node's evidence never mentioned
      fluorapatite or the mineral phase. PMID:42336527 and PMID:38135514 now carry
      the mineral-crystal and incorporation claims the node's name makes.

    Also fixed in the same pass: a fabricated "metabolic superscan" claim in the
    diagnosis section that appears in no cached source; unsupported justifications on
    the Spastic Paresis phenotype; the `frequency` slot on two genetic records
    carrying study descriptions rather than frequencies; `reference_ranges[].population`
    carrying prose; and uncited prose about brick tea versus leaf tea, coal-dried
    foodstuffs, renal excretion as the "only" route, and a trend in inhalant case
    reports - each either cited or narrowed to what the sources say.

    Added in the same pass, from sources already cached: ESR1 rs9340799 (protective)
    and COL1A1 rs1800012 (Russian-specific risk) from PMID:39824337; Exostoses
    (HP:0100777) and Urinary incontinence (HP:0000020) phenotypes; Tanzanian
    (PMID:38135514) and Sri Lankan (PMID:30415519) prevalence records, so the entry
    is not China-only; and the Sri Lankan finding that all sixteen confirmed cases had
    been carrying an arthritis diagnosis, on the differential-diagnosis record.

    Two reviewer suggestions were declined with reasons recorded in the entry's
    notes: ECTO:0900294 ("exposure to fluoride via ingestion") resolves to no label in
    the ECTO build this repository validates against, and ECTO:9001138 (hydrogen
    fluoride) names a chemical species no curated source identifies in coal smoke.

    Validation. `just validate-disorders` passes with 132/132 snippets verified;
    validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-qualifier-terms-online, all whole-KB snippet and
    reference gates, check-term-cache-integrity, check-cache-order and check-stubs
    all pass. Pathograph audited independently: 16 nodes, one root, no orphans, every
    bare-name downstream target resolves.

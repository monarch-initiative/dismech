  summary: Record why the ESR1 protective-allele record is not wired to a mechanism
    node
  details: |
    Sixth tranche of the estrogen-signalling work in issue #12925. The ESR1
    rs9340799 genetic record reaches no pathophysiology node and stays that
    way, with the reason added to its notes.

    The record is a single unreplicated protective association
    (PMID:39824337) in a cross-sectional multi-ethnic cohort with brick-tea-type
    fluorosis. The study measures allele frequencies, not the receptor or
    estrogen signaling in bone. The entry models no estrogen-dependent
    mechanism, its sixteen pathophysiology nodes run from fluoride intake
    through mineral substitution, osteoblast activation, turnover and
    ossification to compression, and none is a plausible landing for a
    receptor gene on the strength of one association.

    Searches. PubMed for fluorosis with ESR1 or estrogen receptor in the title
    or abstract returned eleven records. Apart from PMID:39824337 they are
    dental-fluorosis polymorphism studies (PMID:41174690, PMID:36354656,
    PMID:35066749, PMID:32185656) or a study of sex hormone binding globulin in
    fluoride-exposed men (PMID:30677743). None reports estrogen receptor
    signaling as a mechanism of skeletal fluorosis. None was fetched, because
    none is quoted.

    The deep-research report (claude_code) was read first. It records the same
    association as a modifier and, separately, reports hypomethylation of the
    alpha receptor among fluorosis epigenetic changes from a secondary source it
    cites by PMC identifier. That is a lead for a future epigenetics pass, not
    support for wiring a germline susceptibility allele to a mechanism, and it
    was not pursued here.

    No cache file changed. Checks: validate, validate-terms and
    count-verified-snippets passed on the file; validate-disorders over the
    tranche passed; the offline gates listed in the Osteoporosis record for
    this tranche passed with no new findings.

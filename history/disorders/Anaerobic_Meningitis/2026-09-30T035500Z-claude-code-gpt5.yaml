  summary: 'Create: Anaerobic Meningitis'
  details: |
    Created an anaerobic meningitis child of Bacterial meningitis and Anaerobic Bacteria Infectious Disease from the OpenScientist fallback report and bound MONDO:0002000, Prevotella, Peptostreptococcus, Bacteroides, Fusobacterium nucleatum, Fusobacterium necrophorum, and Cutibacterium acnes as endogenous human anaerobic agents. Added postneurosurgical/device, ENT, odontogenic, traumatic, and contiguous-spread routes; a pathophysiology chain from endogenous barrier breach through CNS seeding, CSF replication, neutrophilic meningitis, Bacteroides capsular abscess formation, and CNS injury; fever, headache, and nuchal rigidity phenotypes; anaerobic CSF culture or molecular detection; and anaerobe-active antimicrobial therapy. Recorded the entry as a deliberate R9 lump for MONDO's physiology-scoped anaerobic term, noted the skipped automated gene preflight, and avoided the report's bad HP:0025432 CSF pleocytosis binding.

  summary: 'Review round: wire phenotypes, expand inflammatory cascade, add treatments/prevalence/progression'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review. Item 1: wired the three existing phenotypes (Fever, Headache, Nuchal rigidity) plus three new ones into the pathograph via bare-name downstream edges; list-disconnected-phenotypes now 6/6 connected. Item 2: added Reduced consciousness (HP:0004372, altered mental status), CSF polymorphonuclear pleocytosis (HP:0012756, replacing the report's wrong HP:0025432/Acanthoma), and Focal neurologic deficit (no HPO term; term omitted with a recorded OLS search). All three quote PMID:15509818/PMID:41479136. Item 3: added metronidazole therapeutic_agent (CHEBI:6909), a Surgical Source Control treatment (PMID:28089421, targets the barrier-breach node), and Adjunctive Dexamethasone (CHEBI:41879; PMID:41675892, PMID:40113367; graded INDIRECT as extrapolated from pneumococcal/general meningitis). Item 4: added a CASES_IN_LITERATURE prevalence block carrying the 2.4% (13/540) figure and the 27-case pediatric series. Item 5: split the compressed inflammatory node into TLR-Driven Innate Inflammatory Signaling (GO:0002224, GO:0030593) and Oxidative Stress and Blood-Brain Barrier Breakdown (GO:0006979, GO:0042554), both PMID:22618789 and graded INDIRECT, and added a HUMAN_MODEL_MISMATCH discussion recording that the cascade is extrapolated from pneumococcal models. Blue suggestions taken: CSF lactate biochemical marker (PMID:21382412), a Septic Thrombophlebitis/Lemierre node off CNS Seeding (PMID:41330476), Bacteroides abscess linked from CSF Replication, and a two-phase progression block. Moved preflight-dr/fallback process narration out of notes into this record. Fetched PMIDs 22618789, 28089421, 21382412, 41675892, 40113367. Validators: just validate, validate-terms, count-verified-snippets (39/39), check-folded-hyphens, check-causal-targets, snippet-grading, gene-activity, prose-figure-audit all pass.

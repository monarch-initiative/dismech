  summary: 'Create: Congenital Lactase Deficiency'
  details: |
    Created new disorder entry for LCT-related Congenital Lactase Deficiency, CLD, OMIM:223000, MONDO:0009115. NEC preflight: verified via OAK that MONDO:0009115 def text and OMIM:223000/Orphanet:53690 xrefs specifically match the rare autosomal recessive neonatal disorder with severe watery diarrhea from birth, and confirmed it is distinct from MONDO:0100345, lactose intolerance/adult-type hypolactasia, which has no OMIM xref and represents the common LCT/MCM6 regulatory-variant trait. Verified HGNC gene id hgnc:6530 for LCT via OAK. Sourced 9 PubMed abstracts directly via NCBI eutils, not deep-research tooling, covering locus assignment and Finnish founder effect PMID:9758622, the Finnish founder nonsense mutation Y1390X and molecular basis PMID:16400612, molecular differentiation from adult-type hypolactasia PMID:17345962, trafficking-incompetent LPH mutants PMID:35007711 in vitro, a biochemical/mutation review PMID:30813293, novel LCT mutations outside Finland PMID:19161632, hypercalcemia/nephrocalcinosis case series PMID:8523189, a 2025 infantile hypercalcemia case report PMID:40536626, and a Finnish epidemiology summary PMID:19432082. All references fetched via just fetch-reference and all snippets verified as exact substrings of the cached abstracts. Modeled pathophysiology as LCT loss-of-function to absent lactase-phlorizin hydrolase activity to failure to hydrolyze lactose to osmotic load/unabsorbed lactose to severe watery diarrhea plus a hypercalcemia/nephrocalcinosis branch. Used structured Prevalence slots, measure_type and prevalence_class, not the deprecated percentage field, for the Finland founder-population and worldwide ultra-rare bands. Treatment: lifelong lactose-free diet with target_mechanisms back to the osmotic-load node. Validated with just validate, just validate-references, and just validate-terms, all passed.

  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    LOINC tranche A batch 5 (issue 13642). On the existing newborn-screening diagnosis row: measurements bound to LOINC:50106-4 (3-hydroxyisovalerylcarnitine C5-OH in DBS) and LOINC:53187-1 (methylglutarylcarnitine C6-DC in DBS), both method-less quantitative DBS codes; diagnosis_term moved from NCIT:C15419 Disease Screening to NCIT:C81178 Newborn Screening. One reference range on the C5-OH code with the 0.6 umol/L recall cut-off stated by a Chinese MS/MS neonatal-screening series (PMID:25190158, cut-off <0.6 umol/L, September 2011 to March 2013; the abstract does not name the programme), with PMID:37994125 cited to place HMGCL deficiency among the disorders diagnosed after a C5-OH recall in a Shanghai series. The C6DC measurement carries no band: a PubMed search for C6DC or methylglutarylcarnitine with newborn or neonatal screening returned no abstract stating a cut-off. Second-tier DBS 3-hydroxy-3-methylglutaric and 3-methylglutaconic acid measurements are not bound because the Monarch KG searches returned no DBS code. On the biochemical 3-hydroxyisovalerylcarnitine marker, loinc_term bound to the Part LOINC:LP19309-1. Labels seeded by just loinc-seed-cache; validate, validate-terms, count-verified-snippets, validate-disorders, check-duplicate-keys, check-entity-refs and check-snippet-grading all pass.

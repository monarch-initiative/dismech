  summary: Review 3-hydroxy-3-methylglutaric aciduria evidence
  details: |
    Rebuilt the disorder record after reviewing every section and bibliography entry. Corrected disease scope and ontology, separated human ketogenesis and leucine-catabolism mechanisms from liver-knockout and intracerebroventricular HMG models, recalibrated cohort-specific phenotype frequencies, added imaging and biochemical readouts, tightened genetic and diagnostic claims, modeled conservative management, and expanded the C5-OH differential to include maternal 3-MCCD, multiple-carboxylase disorders, HSD10, beta-ketothiolase deficiency, and AUH-related MGA1. Validation and two independent audits passed. Expert follow-up remains necessary for comparative diet, carnitine and ketone adjunct efficacy, longitudinal surveillance, and model-to-human translation.

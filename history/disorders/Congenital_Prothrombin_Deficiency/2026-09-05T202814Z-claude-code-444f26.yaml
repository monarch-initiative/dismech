  details: |
    Created kb/disorders/Congenital_Prothrombin_Deficiency.yaml for congenital prothrombin (factor II) deficiency, MONDO:0013361, F2 (hgnc:3535). Deep research: just research-disorder falcon Congenital_Prothrombin_Deficiency -> research/Congenital_Prothrombin_Deficiency-deep-research-falcon.md (Edison/falcon, 625s, 33 citations; reference_validation 7/7 verified, confabulation_rate 0.0; term_validation needs_review=true because the report echoed the template placeholder 'if available' as the MONDO label and offered HP:0001020, which does not exist - that CURIE was not bound, and every HP/GO/CL/NCIT/CHEBI term used here was independently verified with OAK or the OLS API). just preflight-dr returned PASS (F2 mentioned 43 times; expected causal gene). GeneReviews: searched; the only F2 GeneReviews chapter is Prothrombin Thrombophilia (PMID:20301327), a distinct thrombotic disorder, so there is no GeneReviews phenotype baseline for this disease. Modelled as DISEASE with two has_subtypes, Type I (hypoprothrombinaemia) and Type II (dysprothrombinaemia); the antigen-versus-activity discrepancy is curated structurally in biochemical: with subtype attribution plus a readout link and severity interpretation_bands, not as prose. Pathophysiology is a 13-node causal chain from biallelic F2 variants through the prothrombinase step to a thrombin hub that fans out into five separate branches (fibrinogen to fibrin; PAR-mediated platelet activation; factor V/VIII/XI feedback amplification; factor XIII activation and fibrin cross-linking; thrombomodulin-protein C anticoagulant arm) converging on a weak, poorly cross-linked clot. Vitamin K-dependent Gla-domain carboxylation and membrane binding is curated as its own node because it explains why the acquired vitamin K-related deficiencies phenocopy the disease. Complete prothrombin absence is recorded as a constraint on the disease model, not as an observed human phenotype: two prothrombin-null mouse lines (PMID:9636195, PMID:9636196, graded MODEL_ORGANISM) and a zebrafish kringle-1 mutant (PMID:32132579) supply the lethality evidence, with a no_human_null_phenotype discussion recording that the human side of the claim is an absence of observations. Lupus anticoagulant-hypoprothrombinaemia syndrome is curated as a differential_diagnosis (PMID:40719111), never as a subtype. Umbilical stump bleeding was deliberately NOT curated: the reviewed sources assign it to factor XIII deficiency and afibrinogenaemia rather than to factor II deficiency; this is recorded in notes. No conforms_to: primary_hemostatic_plug_failure explicitly excludes coagulation-factor deficiencies from its scope and thrombogenesis models the inverse process. Validation: just validate passes (schema, terms, references); count-verified-snippets 76/76; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles all OK; just validate-disorders run as the final gate. Weighted compliance 83.2 percent; datasets: is empty and no dataset accession was curated.

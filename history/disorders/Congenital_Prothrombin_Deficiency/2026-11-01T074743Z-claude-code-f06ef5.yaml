  details: |
    Three optional review suggestions from PR 11183, recorded in issue 11452. (1) Added a notes paragraph recording that gastrointestinal hemorrhage (HP:0002239) was considered and not curated: in the cached reviews the GI-bleeding passages are about von Willebrand disease and factor VII, X and XIII deficiency, and the only prothrombin-specific bleeding-site sentence (PMID:28394285) names no GI bleeding. (2) Added a Peripartum Prothrombin Complex Concentrate Cover treatment from the factor II section of PMID:39022653 (RCOG-based labor/cesarean dosing, the 48-hour follow-up dose, and one reported case of menstrual PCC prophylaxis). Iron replacement and hormonal menstrual suppression were left out because no cached source names them for factor II deficiency. (3) Added the medaka thrombin-deficient genome-edited mutant (PMID:33589932, fetched with just fetch-reference; abstract only) as an animal model linked to Deficient Thrombin Activity at the Site of Injury at LOW fidelity. Validated with just validate, count-verified-snippets (83/83), validate-terms and the per-file structural gates.

  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). Bound method-less serum codes: HBsAg LOINC:5195-3, HBeAg LOINC:31844-4, quantitative HBV DNA LOINC:11258-1 (IU per volume) on the existing test rows and on the three biochemical markers. Added a serologic panel interpretation row (HBsAg, anti-HBs LOINC:22322-2, total anti-HBc LOINC:16933-4, IgM anti-HBc LOINC:31204-1) with the CDC 2023 triple-panel recommendation and Table 1 patterns as evidence (PMID:36893044, full text). The HBV DNA row carries two reference ranges from the AASLD 2018 guidance (PMID:29405329, full text): above 20,000 IU/mL in HBeAg-positive and above 2,000 IU/mL in HBeAg-negative chronic hepatitis B as the HBV DNA criterion of immune-active disease, with notes that it is one of two required criteria, that the guidance calls the cut-offs sufficient but not absolute, and that above excludes the threshold. No quantitative HBsAg band: the AASLD guidance says more validation of the 1,000 IU/mL figure is needed. Anti-HBs 10 mIU/mL is a vaccine-protection correlate and was not recorded as a disease band.

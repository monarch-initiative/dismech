  summary: 'Review round 1: recite the integration-to-HCC edge on a primary source'
  details: |
    The HBV DNA Integration -> Hepatocellular Carcinoma edge cited PMID:20378277, an epidemiology review whose quoted sentence states HBV's attributable fraction for HCC and says nothing about integration. Replaced it with PMID:33563643 (Peneau et al., Gut 2022), the viral-capture study of 177 HBV-related HCCs behind EGA study EGAS00001004629 already listed in this entry's datasets; the quoted RESULTS sentences report both routes the edge asserts, enhancer-driven oncogene overexpression and chromosome rearrangements altering TERT, TP53 and MYC at distance, so the item is PRIMARY_RESULT rather than BACKGROUND. The same PMID:20378277 quote stays on the Hepatocellular Carcinoma phenotype, where it is accurate, now graded quote_role REVIEW_SYNTHESIS because the article is a single-author review restating pooled figures.

  summary: Add long-term entecavir efficacy evidence (PPR:PPR1283362)
  details: |
    Added one EvidenceItem to the existing "Antiviral Medications" treatment block citing the Research Square preprint PPR:PPR1283362, a single-center retrospective cohort of 230 treatment-naive chronic hepatitis B patients on entecavir. The snippet quotes the reported virological response trajectory, the 10.2% partial virological response rate, and HBeAg seroconversion timing.

    Scoping of the preprint reference: preprint-scan policy requires that a preprint not be the sole support for a claim. The treatment block already carries five peer-reviewed PMIDs [26732483, 26054819, 32050881, 27742007, 41621642], so this item corroborates rather than carries the claim. Following PR review, the explanation was rewritten to state explicitly that the source is a non-peer-reviewed preprint, and to qualify the 100% year 4-5 figure as describing a shrinking survivor denominator in one center rather than a population-level suppression rate.

    Not done, and why: no therapeutic_agent binding was added for entecavir or tenofovir. CHEBI carries no plain "entecavir" term - only "entecavir hydrate" CHEBI:59902 and "entecavir anhydrous" CHEBI:473990 - and the block covers three drugs TDF, TAF and ETV under a generic NCIT:C16119 action term, so which agents to bind and in which form is a curator modeling decision rather than a mechanical one. Left for follow-up rather than guessed at.

    Validation run on this branch: just validate kb/disorders/Hepatitis_B.yaml passed; just count-verified-snippets reported 157/157 snippets verified against cached references.

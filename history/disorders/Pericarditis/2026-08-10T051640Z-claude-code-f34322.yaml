  summary: 'Review response: Pericarditis'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR 8280. All three blocking items addressed. First, the two electrocardiographic phenotypes are now curated, ST segment elevation bound to HP:0012251 and PR segment depression bound to HP:0031594. Both were already referenced in the diagnosis block and in a pathophysiology node description without existing as phenotypes. Second, aetiology-directed treatments are added. Antitubercular therapy is evidenced by the IMPI randomised trial, curated with all three of its relevant results, that antitubercular therapy alone is insufficient, that adjunctive prednisolone reduced constrictive pericarditis specifically, and that it did not change the primary composite outcome. That prednisolone result is the mechanistically interesting one, because it runs opposite to the corticosteroid evidence curated elsewhere in this entry for idiopathic disease. Intensified haemodialysis is added for the uraemic aetiology, evidenced by the reference already cited on that environmental entry. Third, the three subtypes with distinct MONDO identities now carry subtype_term bindings, constrictive pericarditis to MONDO:0006711, pericardial tuberculosis to MONDO:0005903, and idiopathic recurrent pericarditis to MONDO:0016662, the last requiring a new subtype since the previous recurrent subtype was broader than the idiopathic MONDO term. Validation after the changes. just count-verified-snippets reported 37 of 37 verified and just validate-terms passed.

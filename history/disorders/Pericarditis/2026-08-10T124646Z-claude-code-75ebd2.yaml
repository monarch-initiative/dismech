  summary: Evidence the recurrence frequency on the recurrent subtype
  details: |
    Adds an evidence item to the Recurrent pericarditis subtype, which asserted its own importance without citing anything. The CORP trial statement that recurrence is the most common complication of pericarditis affecting 10 to 50 percent of patients is what justifies curating recurrence as a subtype at all, and what makes prevention from the first episode the standard of care rather than a response to relapse. The reference was already cached and cited elsewhere in the entry. The description also now records why this subtype carries no subtype_term, namely that it covers recurrence of any cause and is therefore broader than MONDO:0016662, which is bound to the idiopathic subtype. This commit additionally re-triggers the pull_request workflows, which had not fired on the previous head. Validation after the change. just count-verified-snippets reported 38 of 38 verified, just validate-terms passed, and the subtype foreign-key tests reported 1920 passed.

  summary: 'Second review response: Pericarditis'
  details: |
    Response to the second ai4c-reviewer review on PR 8280. Two items, both accepted. First, and this was a correct and important catch, two of the three IMPI evidence items on the Antitubercular therapy treatment graded adjunctive prednisolone rather than antitubercular therapy. Because an evidence item supports or refutes the claim it hangs on, the REFUTE item asserted that antitubercular therapy itself was refuted, when the trial in fact assumes it as background standard of care in every arm. This is precisely the failure mode this entry's own notes block describes under a citation that does not support its claim, committed by the curator in the same commit that added that note. The PARTIAL and REFUTE items are moved onto the Corticosteroid therapy entry, where the contrast with the COPE result is now explicit and where the randomised intervention actually was the corticosteroid. The antitubercular treatment retains only the SUPPORT item establishing it as the platform therapy, and its description no longer narrates the prednisolone result it no longer evidences. Second, Intensified haemodialysis was rebound from the generic NCIT:C49236 Therapeutic Procedure to NCIT:C15248 Hemodialysis. Validation after the changes. just count-verified-snippets reported 37 of 37 verified and just validate-terms passed.

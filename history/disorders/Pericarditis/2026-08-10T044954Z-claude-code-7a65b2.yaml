  summary: 'Create: Pericarditis'
  details: |
    New entry for pericarditis, MONDO:0005904, curated from a claude_code deep-research report treated as leads only. It fills a complete gap, since the knowledge base had no pericardial disease entry at all. Nine pathophysiology nodes organised around two claims. First, that the pericardial response to injury is stereotyped and largely aetiology-independent, which is modelled as a single trigger node collecting viral, mycobacterial, uraemic, post-injury, radiation, malignant, and autoimmune causes. Second, that the engine of recurrence is autoinflammatory rather than autoimmune, running on the NLRP3 inflammasome and interleukin-1. Two conformances are declared to the fibrotic_response module, at the tissue-injury and excessive-ECM-deposition nodes. Conformance to granuloma_formation for the tuberculous subtype is deliberately not declared, because this entry cites no evidence for the granulomatous histology. Three deep-research ontology errors were caught and corrected. MONDO:0004770 is exophthalmos. HP:0025091 is Wrist sign and not pulsus paradoxus. HP:0031653 is Abnormal heart valve physiology and not pericardial friction rub. A fourth deep-research failure was a citation that does not support its claim, where a cohort frequency of about six percent for TNFRSF1A variants was attributed to a paper that is a two-patient case report. The gene is retained only on the qualitative claim that paper supports. A near miss of the same kind was caught during curation, where a fifty percent effusion figure counts extrapericardial rather than pericardial effusions. That evidence item was removed rather than reworded. Validation. just count-verified-snippets reported 33 of 33 verified. The pytest foreign-key and conformance selection reported 5902 passed.

    Weekly compliance sweep. All 72 compliance gaps in this entry were empty evidence slots; every ontology binding was already present. Added 12 evidence items across five previously uncited pathophysiology nodes (heterogeneous trigger, acute exudate, effusion accumulation, cardiac tamponade, fibrotic organization) and six phenotypes, from four newly cached references: PMID:31918837 (JACC state-of-the-art review), PMID:38804758 (rapid evidence review, diagnostic criteria and electrocardiographic findings), PMID:21844077 (Imazio prospective cohort of 500 first episodes, aetiology-specific constriction risk) and PMID:29873194 (pulsus paradoxus review). Three items are deliberately hedged in their explanations rather than overstated: the diagnostic-criteria quote is INDIRECT because a diagnostic rule is not a mechanistic claim; the pulsus paradoxus mechanism quote lists ventricular interaction among several mechanisms including intrapleural pressure swings and left ventricular afterload, which this entry does not model; and the PR-depression item supports the finding but explicitly does not support the entry's further claim that PR depression is the more specific of the two changes. Weighted compliance 60.9 to 68.8 percent. All 54 snippets verified against the cache.

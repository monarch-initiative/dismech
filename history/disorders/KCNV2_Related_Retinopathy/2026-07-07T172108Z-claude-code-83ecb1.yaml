  summary: 'Create: KCNV2-Related Retinopathy'
  details: |
    Created a new disorder entry for KCNV2-related retinopathy (cone dystrophy with supernormal rod electroretinogram, CDSRR; MONDO:1040063), the next medium-priority gene-level entry from issue #4008's lumping-guidance list. NEC preflight confirmed MONDO:1040063 def: causal gene HGNC:19698 (KCNV2), no mismatch. Falcon deep-research (Edison API) failed with HTTPStatusError 402 Payment Required - the Edison account appears to have exhausted its credits/quota; this is a new, non-transient failure mode distinct from the connectivity timeouts seen on the prior NDP entry. Rather than retry, the entry was built directly from 3 independently-verified PubMed sources fetched and cached via just fetch-reference: PMID:32441199 (2020 review), PMID:23115240 (2012 functional/heteromerization mechanism study), and PMID:18235024 (2008 foundational KCNV2-CDSRR association study, 13 families). Modeled a single pathophysiology node (Kv8.2/Kv2.1 heteromeric photoreceptor potassium channel dysfunction, both the non-conducting-heteromer and failed-heteromer-assembly mechanisms from PMID:23115240), 4 phenotypes (reduced visual acuity, color vision defect, foveal atrophy, and the pathognomonic supernormal rod ERG response bound to HP:0030466 Abnormal full-field electroretinogram), genetic (KCNV2/hgnc:19698), and 2 treatments (low vision rehabilitation, genetic counseling). No has_subtypes was modeled since CDSRR is a single clinical entity, unlike the multi-subtype CRX/NDP entries. All ontology terms (HP, GO, CL, MAXO, hgnc) verified via OAK before use. All evidence snippets are exact quotes from cached PubMed abstracts. Schema validation, term validation, and reference validation (via scripts/run_reference_validator.sh direct-invocation workaround) all pass; compliance 93.8% global / 96.6% weighted.

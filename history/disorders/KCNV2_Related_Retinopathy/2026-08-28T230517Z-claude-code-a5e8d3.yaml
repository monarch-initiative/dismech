    # Review: KCNV2-Related Retinopathy

    - **File:** `/home/user/dismech/kb/disorders/KCNV2_Related_Retinopathy.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical snippet audit:** 18/18 snippets verified against cached references
      (`uv run python -m dismech.reference_snippet_audit --schema src/dismech/schema/dismech.yaml --config conf/reference_validator_config.yaml`)

    ## Verdict: MINOR_ISSUES

    No claim-fidelity or misclassification finding rises to MAJOR/CRITICAL. Every snippet
    is verbatim, every claim is anchored in the right gene and the right disease, and the
    one genuinely delicate spot in this entry (the mouse model's ERG does *not* reproduce
    the human supernormal b-wave) has been handled carefully — the mouse paper is cited
    only for adaptation-disruption framing and for retinal structure/TUNEL, never for the
    supernormal-ERG phenotype itself, which is sourced from human cohorts.

    ## Findings

    ### 1. MINOR — animal-model evidence used for a node whose description mixes mouse and human observations
    - **Location:** `pathophysiology[3]` "Progressive Cone and Outer Nuclear Layer Loss";
      evidence `PMID:30820446` (×2, MODEL_ORGANISM) plus `PMID:38443311` (HUMAN_CLINICAL)
    - **Entry claims:** the node description opens with "photoreceptors are progressively
      lost", then attributes the ONL-limited change and TUNEL positivity to the Kv8.2 KO
      mouse and the bull's-eye maculopathy to patients.
    - **Paper says:** Hart et al. — *"the changes in six-month-old Kv8.2 KO retinae are
      largely limited to the outer nuclear layer (ONL), while outer segments appear intact"*
      and *"there is a significant increase in TUNEL-positive cells throughout the retina."*
      The paper's own discussion is more specific than the node: *"Overall cone loss at
      only 20% is however relatively mild, indicating a greater loss of rod photoreceptors."*
    - **Why it matters:** the node is titled "Progressive **Cone** and Outer Nuclear Layer
      Loss" and its only `cell_types` entry is retinal cone cell, but the model evidence
      cited actually shows the loss is predominantly **rod**-biased (retina thinned to ~60%
      of WT vs cones only reduced to ~80%). The human evidence (bull's-eye maculopathy,
      foveal EZ disruption) does support a cone-predominant *macular* lesion, so the node
      title is not wrong for humans — but the mouse snippets are being used under a
      cone-titled node whose own source says the mouse loses more rods than cones. Adding
      retinal rod cell to `cell_types`, or a sentence noting the rod-predominant mouse
      pattern, would remove the mismatch. Species labelling is correct throughout
      (`MODEL_ORGANISM`), so this is a precision issue, not a misattribution.

    ### 2. MINOR — a review is cited as `evidence_source: OTHER` with an explanation asserting the grading rationale, which is correct, but one of the two review citations carries a mechanistic claim not independently sourced
    - **Location:** `pathophysiology[1]` "Disrupted Photoreceptor Light Adaptation";
      evidence `PMID:32441199` (OTHER)
    - **Entry claims:** "Kv8.2 does not carry current itself; it shifts the activation range
      of the photoreceptor inner-segment potassium channels it heteromerizes into."
    - **Paper says:** *"This gene encodes Kv8.2, a voltage-gated potassium channel subunit
      that acts as a modulator by shifting the activation range of the K+ channels in
      photoreceptor inner segments."* — an exact match for the claim.
    - **Why it matters:** this is fine as far as it goes; the flag is only that the
      *activation-range-shift* mechanism rests solely on a review's summary sentence, with
      the primary functional work (`PMID:23115240`) attached to a different node. Not a
      defect — recorded for completeness because the node description states the mechanism
      as fact rather than as review consensus.

    ### 3. MINOR — the node description for the paradoxical ERG asserts a b:a ratio "at or above the upper reference limit" from a cohort of eight patients, stated without cohort hedging
    - **Location:** `pathophysiology[2]` "Paradoxical Supernormal Scotopic b-Wave with
      Delayed Response Timing"; evidence `PMID:38443311` (×3, HUMAN_CLINICAL)
    - **Entry claims:** "the a-wave is depressed or normal in amplitude but delayed at every
      intensity. The resulting b:a ratio sits at or above the upper reference limit."
    - **Paper says:** *"The a-wave amplitude was normal. The a-wave peak time was delayed in
      all stimuli. ... The b:a wave ratio was above or at the upper limit for the reference
      values."* Cohort: *"eight patients from seven families."*
    - **Why it matters:** two small drifts. (a) Sakti et al. report the a-wave amplitude as
      **normal**, not "depressed or normal"; the "depressed" half comes from the mouse paper
      and older literature (Hart et al.: *"In CDSRR, the amplitude of the a-wave is also
      reduced or even absent at lower flash intensities but ... may approach normal
      amplitudes at higher intensities"*), so the composite statement is defensible but is
      not what the cited-here paper says. (b) All the quantitative claims (the DA 0.002/0.01
      jump, "legal blindness before 25", the therapeutic window) come from a single
      retrospective eight-patient series, and the node and `pathophysiology[4]` present them
      without that denominator. `pathophysiology[4]`'s description does say "in every patient
      of one molecularly confirmed cohort", which is the right register; the earlier nodes
      are less guarded.

    ### 4. MINOR — an uncached PMID is cited in prose
    - **Location:** `treatments[0]` "Low Vision Rehabilitation", `notes:` — "An AAV-based
      gene replacement approach is under investigational (in vitro organoid) screening but
      has not reached human trials (PMID:41516321)".
    - **Status:** `references_cache/PMID_41516321.md` does **not** exist, so nothing in the
      repo validates this parenthetical. I checked it against PubMed: PMID 41516321 is Busson
      et al., *Int J Mol Sci* 2025 (DOI [10.3390/ijms27010449](https://doi.org/10.3390/ijms27010449)),
      "KCNV2-Deficient Retinal Organoid Model of Cone Dystrophy — In Vitro Screening for AAV
      Gene Replacement Therapy" — human iPSC-derived retinal organoids, eight AAV vectors
      assessed in vitro, explicitly framed as preclinical vector-potency selection. **The
      note's characterisation is accurate.** The finding is purely mechanical: a PMID
      referenced in prose but absent from `references_cache/` is invisible to
      `validate-references` and to the snippet auditor. Either fetch it
      (`just fetch-reference PMID:41516321`) or, if it is to stay prose-only, that is a
      tolerable state — but a reader cannot check it from the repo today.

    ### 5. MINOR — `treatments[1]` Genetic Counseling carries no evidence
    - **Location:** `treatments[1]`
    - **Entry claims:** genetic counselling for AR inheritance, carrier detection, family
      planning.
    - **Status:** the `notes:` field says so explicitly and honestly — "no KCNV2-specific
      genetic-counseling outcome study was identified to cite directly". Evidence is not
      schema-required here. Recorded only because it is the one uncited treatment block;
      the disclosure is the correct handling and I would not change it.

    ## Non-findings (checked and clean)

    - **Snippet verbatimness:** all 18 verified mechanically and spot-checked by hand against
      the five cached abstracts/full texts. No paraphrase, no title-as-finding. The one
      snippet that resembles a definitional sentence (`PMID:18235024`, "Cone dystrophy with
      supernormal rod response (CDSRR) is a retinal disorder characterized by ... elevated
      scotopic b-wave amplitudes at high luminance intensities") is a Purpose-section
      statement of the disease's defining electrophysiology, not the paper title, and it is
      the right quote for the "Abnormal full-field electroretinogram" phenotype it supports.
    - **`evidence_source` grading:** correct throughout. `PMID:23115240` (COS cell / Xenopus
      heterologous expression) → IN_VITRO ✓. `PMID:30820446` (Kcnv2/Kcnb1 KO mice) →
      MODEL_ORGANISM ✓. `PMID:18235024` (17 patients, 13 families) and `PMID:38443311`
      (8 patients) → HUMAN_CLINICAL ✓. `PMID:32441199` (narrative review) → OTHER ✓, with
      the reason stated inline in both explanations.
    - **No model-organism-only support for a human phenotype.** Every `phenotypes[]` item is
      supported by `PMID:18235024`, a human cohort. The mouse paper appears only on
      pathophysiology nodes, alongside human evidence in both cases.
    - **No same-sentence/different-`evidence_source` contradiction.** Each of the five
      references carries exactly one `evidence_source` value across the file; the repo-wide
      `check_snippet_grading.py` reports no finding for this file.
    - **Named Entity Confusion:** none. Every citation is KCNV2/Kv8.2/CDSRR. `PMID:23115240`
      is MeSH-indexed under "Retinitis Pigmentosa" (an indexing artifact), but its text is
      unambiguously about CDSRR and Kv8.2 — the entry does not inherit the wrong disease.
    - **Inheritance claim:** `HP:0000007` autosomal recessive supported by the segregation
      sentence from 13 families ✓.
    - **Ontology bindings:** `MONDO:1040063`, `HP:0007663`, `HP:0000551`, `HP:0025010`,
      `HP:0030466`, `CL:0000573/0000604/0000748`, `GO:0071805/0009416/0009583/0045494/0007601`,
      `GO:0001917`, `hgnc:19698` all present in `cache/*/terms.csv` with matching labels.
      Note `phenotypes[3]` uses `preferred_term: Supernormal rod electroretinogram response`
      over `HP:0030466 Abnormal full-field electroretinogram` — this is the documented
      preferred_term-more-specific-than-term pattern, correctly applied.
    - **`reports_on` foreign key** (`Kv8.2/Kv2.1 Heteromeric Photoreceptor Potassium Channel
      Dysfunction`) resolves to an existing pathophysiology node ✓.


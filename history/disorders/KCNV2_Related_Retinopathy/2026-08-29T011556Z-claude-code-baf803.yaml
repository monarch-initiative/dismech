  details: |
    # Fix summary: KCNV2-Related Retinopathy

    ## Findings fixed

    1. **MINOR — cone-titled node, rod-predominant mouse evidence** (review finding 1).
       Added a clause to `pathophysiology[3]` "Progressive Cone and Outer Nuclear Layer
       Loss" description stating that in the Kv8.2 KO mouse the loss is rod-predominant
       (cones only to ~80% WT vs ~60% overall photoreceptor-layer thinning), and that the
       cone-predominant pattern in the node reflects the human macular disease, not the
       mouse. Verbatim-supported by PMID:30820446 ("Overall cone loss at only 20% ...
       indicating a greater loss of rod photoreceptors"). cell_types left unchanged (node
       correctly cone-focused for the human macular lesion; adding rod cell would muddy the
       human claim, and the description now records the mouse discrepancy honestly).

    2. **MINOR — unsupported quantifiers** (review finding 3b + task item 2).
       - `pathophysiology[4]` "Early-Onset Progressive Central Visual Loss" description:
         removed "from childhood" (not in the cited 8-patient abstract) and replaced
         "in every patient of one molecularly confirmed cohort" with "in a molecularly
         confirmed cohort of eight patients" (states the denominator instead of an
         every-patient claim the abstract does not make).
       - `pathophysiology[3]` legal-blindness evidence explanation: "in all patients of
         the cohort" reworded so "all patients" attaches only to the foveal disruption
         (which the snippet supports) and not to the legal-blindness endpoint; added the
         eight-patient cohort size.

    3. **MINOR — "majority of patients" vs source's 9/17** (review finding, task item 3).
       `phenotypes` "Foveal atrophy" explanation changed from "in the majority of patients
       examined" to "in nine of the seventeen patients examined" (9/17 is not a majority),
       with the macular-defect range spelled out per the snippet.

    4. **MINOR — uncached PMID cited in prose** (review finding 4, task item 4).
       Fetched PMID:41516321 via `scripts/run_reference_validator.sh cache reference`.
       The `treatments[0].notes` parenthetical is now backed by a cache entry
       (`references_cache/PMID_41516321.md`, Busson et al., KCNV2 retinal organoid AAV
       screening). Kept as prose-only note; no evidence item needed.

    ## Findings intentionally skipped

    - **Review finding 2** (activation-range-shift mechanism rests on a review's summary
      sentence): report explicitly states "Not a defect — recorded for completeness". The
      snippet is an exact match for the claim. No change.
    - **Review finding 3a** (a-wave "depressed or normal" — cited paper says "normal"):
      report calls the composite statement "defensible", correctly noting the "depressed"
      half derives from the mouse paper / older literature that the entry also cites. A
      hedged judgment call; left as-is.
    - **Review finding 5** (Genetic Counseling has no evidence): report says the `notes`
      disclosure "is the correct handling and I would not change it". No change.

    ## New/changed references

    - Fetched `references_cache/PMID_41516321.md` (new).


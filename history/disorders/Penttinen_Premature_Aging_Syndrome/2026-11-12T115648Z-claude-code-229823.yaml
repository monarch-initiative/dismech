  summary: Review and enrich Penttinen_Premature_Aging_Syndrome
  details: |
    Added MONDO-verified synonyms, Harrison's chapters, prevalence, inheritance, diagnosis, and CHEBI-bound Imatinib and Dasatinib treatments. Addressed Round 1 review feedback on PR 17190: restored IN_VITRO evidence_source on in-vitro imatinib/dasatinib molecular findings and split Dasatinib evidence into IN_VITRO and HUMAN_CLINICAL items; fetched and integrated primary 4-proband cohort paper Johnston et al. 2015 (PMID:26279204) alongside PMID:34261502; restored Lipoatrophy (HP:0100578) and added Sparse hair (HP:0008070), Proptosis (HP:0000520), Hypoplasia of the zygomatic bone (HP:0010669), and Foot Acro-osteolysis (HP:0001870) while rebinding hand Acro-osteolysis to HP:0009839; split Dermal and Periarticular Connective Tissue Remodeling into Dermal and Subcutaneous Connective Tissue Atrophy and Focal Dermal and Periarticular Fibroproliferation, renamed Impaired Skeletal Stem Cell Osteogenesis (marking mouse D849V items directness: INDIRECT), added Distal Phalangeal and Craniofacial Bone Resorption with explicit unknown cellular mechanism, wired Limitation of Joint Mobility as a sequela of Joint Flexion Contractures, and documented Keloids binding and PDGFRB-spectrum nosology in notes.

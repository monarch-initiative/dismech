  summary: Review CYCS thrombocytopenia mechanisms against variant-specific evidence
  details: |
    Reviewed all existing references and expanded primary clinical and mechanistic literature through 2026, using full cached texts for the Thr20Ile family, His27Tyr pedigree, structure and peroxidase studies, and the 2014 fibroblast study. Replaced universal reduced-respiration/increased-apoptosis claims with atomic variant- and model-dependent mechanisms; marked the platelet-production bridge as unresolved. Added in-frame deletion and newer variants, bleeding manifestations, diagnostics, bounded management evidence, models and observational registry NCT07026578. Distinguished preliminary registry observations from posted results; retained unresolved proplatelet findings. Corrected mature-protein versus initiator-inclusive numbering and removed the obsolete bundled node-class example. No matching deep-research artifact or GeneReviews chapter was found. Population prevalence, complete penetrance, pooled family totals and comorbidity causation are not established. Process notes moved out of disease narrative.

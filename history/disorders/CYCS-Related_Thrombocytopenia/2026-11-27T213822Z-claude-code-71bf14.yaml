  summary: 'Curate phenotypes: CYCS-Related Thrombocytopenia'
  details: |
    Enriched the five existing phenotypes from already-cached full texts (PMID:35126455, PMID:39191490, and the repository PDF of PMID:24326104): carrier-level frequencies for thrombocytopenia (8/8 His27Tyr, 4/4 Tyr49His), bruising (4/8) and epistaxis (1/8); neonatal and childhood onset contexts; a second neonatal intracranial hemorrhage (His27Tyr proband, with concurrent infection noted); and additional petechiae and bruising evidence. No new phenotype was added: no further CYCS clinical report was found, and NCBI, Europe PMC and OLS were unreachable from the curation environment, so no new reference could be cached. The marrow megakaryocyte-maturation finding in the His27Tyr proband was not curated because the same marrow showed infection-related changes. Validated with validate, count-verified-snippets (88/88), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions.

  summary: 'Create: CYCS-related thrombocytopenia'
  details: |
    Created a new DisMech disorder entry for WP-023 after resolving the seed identity to MONDO:0012775 / OMIM:612004 thrombocytopenia 4. The curation keeps CYCS-related disease separate from the Complex IV deficiency grouping because CYCS encodes the soluble cytochrome c electron carrier rather than a COX holoenzyme subunit or assembly factor. The pathograph debundles CYCS missense variation through altered cytochrome c respiratory and apoptotic activity, dysregulated megakaryocyte platelet release, and thrombocytopenia. Evidence was fetched with just fetch-reference and validated with focused schema, reference, and term checks.

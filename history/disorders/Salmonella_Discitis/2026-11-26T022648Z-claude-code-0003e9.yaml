  summary: 'Create: Salmonella_Discitis'
  details: |
    Created the Salmonella discitis entry (MONDO:8000004) from the stub. Literature was found with PubMed searches for Salmonella spondylodiscitis, discitis and vertebral osteomyelitis; every snippet was checked against references_cache abstracts or PMC full text. A claude_code deep-research report (research/Salmonella_Discitis-deep-research-claude_code.md, with its citations sidecar) was run as a lead list; it contributed the Santos and Sapico 1998 review (PMID:9709878), the adult Salmonella osteomyelitis systematic review (PMID:33942967) and the infective native aortic aneurysm meta-analysis (PMID:42562227), each re-fetched and quoted from its own cache. preflight-dr returned SKIP because MONDO records no causal gene. The agent is bound at species level (Salmonella enterica, NCBITaxon:28901) because typhoidal and nontyphoidal serovars both cause the disease; the lump is recorded in review_notes. No infectious discitis grouping exists yet (stubs/Infectious_Discitis.yaml is marked GROUPING), so no grouping membership was added. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified) and the whole-repo gates.

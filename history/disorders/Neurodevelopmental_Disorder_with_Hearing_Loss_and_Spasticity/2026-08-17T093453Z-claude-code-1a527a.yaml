  summary: 'Create: Neurodevelopmental Disorder with Hearing Loss and Spasticity (AFG2B)'
  details: |
    De novo curation of neurodevelopmental disorder with hearing loss and spasticity
    (NEDHLS; MONDO:0859206, OMIM:619616), caused by biallelic AFG2B variants.

    NEC discipline. AFG2B (HGNC:28762) was formerly SPATA5L1 and is one suffix away
    from AFG2A (formerly SPATA5), which already has its own entry in this repository
    (AFG2A-Related_Encephalopathy, MONDO:0014698). The NEC preflight
    `runoak -i sqlite:obo:mondo info MONDO:0859206 -O obo` was run before any
    deep-research content was used and returned `RO:0004003 HGNC:28762 ! AFG2B` plus
    `xref: OMIM:619616`, matching the intended target on both gene and OMIM anchors.
    Literature was searched under BOTH symbols, since 14 PubMed records use SPATA5L1
    and only 2 use AFG2B. Every clinical citation was checked for which gene the
    reported cohort actually carries variants in; the single AFG2A cohort citation
    (PMID:41933351) is confined to differential_diagnoses and supports no phenotype
    of this entry. Two AFG2B papers describing renal/autoimmune phenotypes
    (PMID:34864870, PMID:41390732) were deliberately excluded as out of scope.

    Sources. Clinical: PMID:34626583 (founding 47-individual cohort), PMID:37902276,
    PMID:41375745. Mechanism: PMID:38554706, PMID:40268917, PMID:35354024,
    PMID:40760247. One Falcon/Edison deep-research run was performed and is committed
    under research/; it was treated as leads only, independently resolved the disease
    to AFG2B, and every PMID, snippet and ontology term was verified locally rather
    than taken from the report.

    Pathograph. Biallelic AFG2B loss of function -> 55LCC AAA+ ATPase complex
    dysfunction -> two parallel arms, namely impaired cytoplasmic pre-60S ribosomal
    maturation -> reduced global protein synthesis -> neuroepithelial vulnerability
    during differentiation, and replisome proteostasis failure with replication
    stress -> both converging on impaired neuronal and white matter development ->
    reduced brain growth and spastic-dystonic motor impairment; plus a cochlear
    sensory epithelium arm -> bilateral sensorineural hearing loss. Every node
    carries biological_scale and mechanism_confidence, and the chain terminates in
    organism-scale nodes that mirror the curated phenotype layer.

    Module conformance was evaluated, not assumed. Only the trigger node of
    sensorineural_hair_cell_loss is claimed, because rodent expression data place
    AFG2B in cochlear hair and pillar cells but no cochlear histology, hair-cell
    count, endocochlear potential or spiral ganglion study exists for this gene, and
    the module endpoint is progressive hearing loss whereas PMID:34626583 calls the
    phenotype nonprogressive. The gap is recorded as a KNOWLEDGE_GAP discussion.

    Frequency discipline. Only one band is asserted: sensorineural hearing loss
    VERY_FREQUENT from 47/47, with the ascertainment-bias caveat recorded on the
    phenotype. The 25/47 (53%) figure is a four-feature composite and was
    deliberately NOT redistributed onto microcephaly, developmental delay,
    intellectual disability, cerebral palsy, spasticity, dystonia or epilepsy.

    Ontology notes. Gene terms carry preferred_term AFG2B with term.label SPATA5L1
    because the cached HGNC adapter still resolves hgnc:28762 to the legacy symbol;
    this mirrors the documented lag in the sibling AFG2A entry and must not be
    "fixed" until the adapter is refreshed. MAXO treatment terms were replaced with
    in-enum NCIT terms because the cached TreatmentActionTerm enum expansion contains
    no MAXO terms and no MAXO term is used anywhere else in kb/.

    GeneReviews searched on 2026-08-15 with three queries
    (`SPATA5L1 GeneReviews[All Fields]`, `AFG2B GeneReviews[All Fields]`,
    `neurodevelopmental disorder with hearing loss and spasticity GeneReviews[All Fields]`),
    all returning zero records; the negative result is recorded in the entry notes.
    No animal model of AFG2B deficiency exists, so no animal_models block is present
    and the absence is recorded as a discussion.

    Validation: just validate (schema + terms + references; 75/75 snippets verified
    against the local cache), just validate-references, just validate-terms, plus the
    check_title_snippets and check_environmental_evidence CI gates.

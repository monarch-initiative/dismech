  summary: 'Phenotype review: Neurodevelopmental_Disorder_with_Hearing_Loss_and_Spasticity'
  details: |
    Campaign phenotype review (snippet consistency, HPO term optimality, pathograph connectivity) of all 18 phenotypes against cached PMID:34626583 (abstract), PMID:41375745 and PMID:37902276 (both full text). Snippets: all 79 verified; the one problem found was the Epilepsy item quoting a negation (no clinically confirmed seizures) as plain SUPPORT - now marked directness: INDIRECT with a corrected explanation. Term rebinds: Bilateral sensorineural hearing loss HP:0000407 -> HP:0008619 (bilaterality is the claim and both case reports document it); Absent or severely limited speech HP:0001344 -> HP:0000750 because the cited full text records 5-10 single words at 5 3/12 years, contradicting Absent speech, with a new full-text evidence quote added; Strabismus HP:0000486 -> HP:0000577 Exotropia per the full text's intermittent divergent strabismus of the right eye, with a new supporting quote. Connectivity: was 0/18 because the pathograph terminated in organism-level consequence nodes that never emitted edges to phenotype records; added 16 manifestation/decomposition downstream edges (hearing-loss node -> its phenotype; Reduced Brain Growth -> Microcephaly; Impaired Neuronal and White Matter Development -> 5 imaging phenotypes; Spastic-Dystonic Motor Impairment and Neurodevelopmental Disability -> 9 clinical phenotypes) carrying descriptions, with the parent nodes' existing evidence carrying the claims. Now 16/18. Craniofacial dysmorphism and Strabismus left deliberately unconnected - no mechanism is documented for either - and recorded in a new KNOWLEDGE_GAP discussion (afg2b_dysmorphism_strabismus_mechanism_gap) with proposed experiments. All validation gates pass (validate, 79/79 snippets, terms, duplicate keys, entity refs, snippet-length, validate-disorders).

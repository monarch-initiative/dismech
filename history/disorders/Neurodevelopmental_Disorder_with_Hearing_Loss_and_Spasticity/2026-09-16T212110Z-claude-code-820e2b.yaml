  summary: Bind DFNB119 (MONDO:0030480) as a has_subtypes entry
  details: |
    Claim issue #11973 asked whether DFNB119 (MONDO:0030480, OMIM:619615) should be a separate dismech entry or part of the existing AFG2B spectrum entry. Resolved as SUBTYPE. Added a has_subtypes entry named DFNB119, bound to MONDO:0030480, carrying the AFG2B gene descriptor (hgnc:28762), a subtype_frequency of 22/47 derived as the complement of the founding cohort's 25/47 neurodevelopmental burden, and four evidence items. Evidence: PMID:37902276 names both OMIM phenotype numbers and attributes both to biallelic AFG2B variants (quoted from its introduction, so quote_role BACKGROUND); PMID:34626583 supplies the 25/47 split and the founding report's own 'with or without' framing; PMID:37902276 again shows c.527G>T p.(Gly176Val) recurring in both isolated-hearing-loss and syndromic individuals, so no genotype partitions the split. Added entry note (10) recording the decision, its reasoning, and the residual asymmetry that the entry name is the syndromic OMIM label; added one sentence to the entry description. No pathophysiology, phenotype or treatment row was tagged to the subtype, because per-subtype detail is not resolvable from the cached sources. Verified the gene symbol independently: HGNC REST reports hgnc:28762 as AFG2B with prev_symbol SPATA5L1, and the local cache still resolves the label as SPATA5L1, which is why term.label reads SPATA5L1. PubMed searches for DFNB119 and SPATA5L1 run 2026-09-16 established that DFNB119 has no literature of its own. Stub stubs/Hearing_Loss_Autosomal_Recessive_119.yaml deleted, since the MONDO ID is now bound in kb/.

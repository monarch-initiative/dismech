  details: |
    Review round on PR #9771, plus a branch refresh from main.

    Item 1 (Retinal Detachment explanation mis-scoped a rate). The ORPHA:828 explanation said the Orphanet grouping band "conflicts with the two rates measured in type 1 specifically: 73% ... and 60% in PMID:20462780". Only the 73% (PMID:17675240) is type-1-specific. PMID:20462780's abstract opens "Stickler syndrome is a group of rare genetic conditions", so its 60% is whole-group -- which this same PR states correctly about the same paper in the Arthralgia explanation. The band is unchanged and still rests on the 73% STL1 cohort alone; the explanation now says so.

    Item 2 (Premature Osteoarthritis band had only grouping-scoped sources). Both available rates are Stickler-wide: the 75% is from the same whole-group narrative review, and the ORPHA row is grouping-scoped. The record kept a FREQUENT band while noting the mismatch in prose -- the shape Anti-pattern 5 rules out, and the reason Cataract and Skeletal Dysplasia lost their bands in this PR. The band is dropped for consistency, the description records why, and the PMID:20462780 explanation now states the grouping scope explicitly and says the rate is cited for occurrence rather than for a band.

    Branch refresh. The branch was ~1000 commits behind main and conflicting. Merged origin/main. The single conflict was main's own #10003 migration of this entry's ORPHA:828 retinal-detachment item (supports: PARTIAL -> SUPPORT, reference_title shortened); main's post-migration form was taken. The remaining branch-authored PARTIAL values, which were legal when the branch was cut and are not permissible under the merged schema, were migrated to SUPPORT + directness: INDIRECT per CLAUDE.md, and the prose that named the retired value was rewritten rather than left pointing at a value the schema no longer has.

    Cache files. The merge would have reverted 11 references_cache/*.md files to the branch's older fetcher output format (unquoted reference_id, added full_text_attempted, stripped trailing newline). Main's versions were restored; all snippets verify against them.

    Validation: just validate passes on both entries (58/58 and 35/35 snippets verified). check-enum-values, check-duplicate-keys and check-entity-refs clean. Diff against main is 4 files: the two entries and the two original history records.

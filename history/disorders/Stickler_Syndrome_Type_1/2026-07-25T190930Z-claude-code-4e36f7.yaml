  summary: 'Review: mark conflicting Orphanet frequency rows PARTIAL (ECM review)'
  details: |
    Claim-evidence correctness review of ECM disorders. Fixed: two ORPHA:828 evidence rows that CONTRADICT the entry's curated frequency band were marked SUPPORT; both retagged PARTIAL with explanations naming the conflict, following the Marfan_Syndrome spontaneous-pneumothorax precedent. Cataract: curated FREQUENT vs Orphanet 'Very frequent (99-80%)' - band retained, downgraded for type 1 because STL2/STL3 have more prominent cataract involvement. Membranous Vitreous: curated VERY_FREQUENT vs Orphanet 'Frequent (79-30%)' - band retained because PMID:11007540 reports the membranous anomaly in all affected individuals with COL2A1 haploinsufficiency. Both curated bands had sound stated reasoning and were left as-is; only the evidence grading changed. Deferred to issue #6951: roughly 18 further phenotypes take ORPHA:828 (the Stickler syndrome grouping, all types) verbatim as the STL1 frequency without the type-1 qualification this file applies well in the two cases above. Deferred to issue #6956: three prevalence records disagree by up to an order of magnitude (PMID:40146061 1-in-21844 births = ~4.6/100k; ORPHA 1-9/100k Europe point prevalence; ORPHA 1-5/10000 worldwide birth prevalence = 10-50/100k) with no note reconciling them; the second Orphanet row also quotes 'PMID:2012', a year captured as a PMID upstream in Orphanet. Validated with linkml-validate and an offline snippet-vs-cache substring check.

  summary: Reconcile discordant prevalence records with cross-referencing notes
  details: |
    Added reconciling notes to all three prevalence records: PMID:40146061 birth incidence ~4.6 per 100,000; ORPHA:828 European point prevalence 1-9 per 100,000; ORPHA:828 worldwide birth prevalence 10-50 per 100,000; these were previously mutually discordant with no explanation. Named PMID:40146061, the first population-based incidence estimate for Stickler syndrome, as the leading birth-prevalence figure and cross-referenced each record against the others, following the same retain-all-records-and-explain-in-notes pattern used for the analogous Marfan_Syndrome.yaml discordance. Did not change any supports values: each Orphanet evidence item is an exact, valid quote that genuinely supports its own record's stated class, unlike the phenotype frequency case where a single canonical value is being contested by multiple evidence items.

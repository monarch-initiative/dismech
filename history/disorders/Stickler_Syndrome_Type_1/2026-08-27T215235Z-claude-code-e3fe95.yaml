  summary: 'Apply Anti-pattern 5: drop Stickler-grouping frequency bands from the
    STL1 entry'
  details: |
    Applied the Anti-pattern 5 rule merged in PR #8767 to the 28 phenotypes of this entry. ORPHA:828 is 'Stickler syndrome' - the whole grouping, spanning STL1/STL2/STL3 - and 24 records took a frequency band from it or from another grouping-scoped source.

    Arm 3 (drop the band, record the reason in the cited row's explanation) applied to 24 records. Twenty had ORPHA:828 as their only evidence, so the band had no other source. Four needed individual judgment:
    - High Myopia had two scope problems at once: the VERY_FREQUENT band came from the grouping-wide 'Myopia' row (HP:0000545) while the record is about high myopia, which Orphanet bands separately and one tier lower (HP:0011003, Frequent).
    - Cataract and Skeletal Dysplasia kept a band downgraded from the grouping row on curator reasoning recorded only in prose. The reasoning is sound but is an inference rather than a measurement, and Anti-pattern 5 explicitly rules out keeping a band annotated by prose. Both bands dropped, the reasoning preserved in the explanation. Note these are the two records the filing issue cited approvingly as the file's existing good pattern; that judgment predates the merged rule and is flagged in the PR for review.
    - Arthralgia asserted VERY_FREQUENT on the strength of a 75% figure that is (a) an osteoarthritis rate rather than an arthralgia rate, (b) Stickler-wide, and (c) in the FREQUENT tier, not VERY_FREQUENT. The explanation claiming it supported VERY_FREQUENT was internally inconsistent and is corrected.

    Arm 2 (keep the band, attribute it to the narrower source) applied to four records:
    - Membranous Vitreous was already compliant and is unchanged.
    - Retinal Detachment is corrected VERY_FREQUENT to FREQUENT. Its own STL1-specific cohort (PMID:17675240) measures 73% in untreated patients and PMID:20462780 reports 60%; both are the FREQUENT tier. Only the grouping row said VERY_FREQUENT, and it is regraded SUPPORT to PARTIAL with the conflict named.
    - Sensorineural Hearing Loss keeps FREQUENT, which rests on the COL2A1-specific 52.2% figure in PMID:23110709.
    - Premature Osteoarthritis keeps FREQUENT on the measured 75% rate, with the residual limitation recorded that the measurement is Stickler-wide rather than STL1-specific.

    Validation: just validate passes, 58/58 snippets verified.

  summary: 'Review round 1: fix claim-evidence mismatches, add missing sections'
  details: |
    Addressed the round-1 review on PR 10128. All fixes drew on references already committed to this PR; no new sources were fetched.

    Three claim-evidence mismatches corrected. Hepatomegaly was evidenced by a liver-enzyme clause (the same quote reused for Elevated Hepatic Transaminases); it now quotes a span naming hepatomegaly and its count. Hemolytic Uremic Syndrome was evidenced by a thrombotic-microangiopathy sentence that never says HUS; it now leads with the sentence naming HUS, with the TMA sentence kept as a separate item for the separate claim. Recurrent Viral Infections was evidenced by a live-vaccine-strain sentence rather than the susceptibility claim; the susceptibility sentence is now first and the vaccine-strain observation is retained as a second item.

    Five phenotypes added: leukocytosis (8/15, the discriminator from classical HLH the pathophysiology already leaned on in prose), coagulopathy (7/15), acute liver failure (3/15), cerebral calcification (3/15), cerebral white matter abnormalities.

    Four sections added, all quotable from committed caches: differential_diagnoses (familial HLH naming PRF1/UNC13D/STXBP2/STX11/RAB27A/LYST, with normal NK cytotoxicity as the distinguishing feature), diagnosis (genomic screening recommendation plus HLH criteria), histopathology (hepatic necrosis with extramedullary haematopoiesis; interstitial and cholesterol pneumonitis), biochemical (serum LDH). clinical_burden added at HIGH with the mortality figures that were previously prose-only.

    Two things deliberately not done. Splenomegaly was not added: it appears exactly once in the cache, inside the generic definition of HLH ('HLH is characterized by fever, hepatosplenomegaly...'), not as an observed finding in these patients, so curating it would cite a definition as a cohort observation. And a quote of the HSCT recommendation was drafted and removed because the cached text truncates mid-word there.

    The reviewer's suggested spans for hepatomegaly and coagulopathy were three words each and failed check-snippet-length; both were extended to include enough surrounding context to be propositional while still naming the finding.

    Validation: 64/64 snippets verified (was 45/45), schema and terms clean, all offline gates clean.

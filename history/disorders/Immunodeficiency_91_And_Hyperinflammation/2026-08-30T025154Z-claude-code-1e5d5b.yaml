  summary: 'Create: Immunodeficiency 91 and Hyperinflammation'
  details: |
    New entry for ZNFX1 deficiency (MONDO:0030491), curated from seven primary references fetched into the cache for this PR.

    Sources were found by PubMed search rather than by a deep-research provider, so every PMID was real before it was cited and no CURIE came from a generated report. All ontology terms were verified against OLS before binding.

    The central curation decision is that the disease has two documented phenotypic poles that the literature has not reconciled: Vavassori 2021 (PMID:33872655, 15 patients) describes severe viral infection with fatal HLH-like inflammation, while Le Voyer 2021 (PMID:33876776, 4 patients) describes monocytosis and mycobacterial disease in patients who explicitly did not have severe viral illness. Both are curated as separate pathophysiology arms rather than merged into one phenotype list, and a CONTROVERSY discussion records what is open about their relationship, including ascertainment as a live alternative explanation.

    Two negative findings from the founding cohort are curated as load-bearing evidence rather than omitted: NK-cell degranulation and cytotoxicity are normal (separating this from familial HLH), and some patients progressed after the virus was cleared (which a purely trigger-driven model does not predict).

    The NLRP3-restraint mechanism (PMID:39333773) is graded PROVISIONAL throughout because it rests on cell lines and mice with no patient-tissue confirmation. Anakinra is curated with supports NO_EVIDENCE because the single reported use ended in death, which neither establishes nor refutes efficacy.

    Validation: schema clean, term validation passed, 45/45 snippets verified against cached references on the first pass, duplicate-keys and entity-refs clean, all evidence gates clean. One folded-hyphen finding was fixed by reflowing rather than by touching the baseline.

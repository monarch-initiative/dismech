  details: |
    De-novo curation of LBR-related regressive spondylometaphyseal dysplasia (MONDO:0018663, OMIM 618019) from a claude_code deep-research report (preflight PASS). Two-branch pathograph: LBR sterol C14-reductase deficiency -> cholesta-8,14-dien accumulation / impaired cholesterol biosynthesis -> disturbed endochondral ossification -> skeletal phenotypes; and reduced structural LBR dosage -> failed neutrophil nuclear lobulation (Pelger-Huet anomaly). AR inheritance, ClinGen Moderate copied with its CGGV row, two representative homozygous variants (p.Arg512Trp, p.Leu456Val). Ichthyosis Lbr-null mouse recorded as FAILS_TO_RECAPITULATE the sterol arm with a SPECIES_MISMATCH divergence (Tm7sf2/Dhcr14 redundancy). 28/28 snippets verified; validate-disorders, validate-terms, causal-targets, name-collisions, logical-rules, coarse-phenotypes, gene-activity-grounding, snippet-grading, model-scale-audit all clean.

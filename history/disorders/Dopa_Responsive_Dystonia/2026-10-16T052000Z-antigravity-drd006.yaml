  summary: Review and expand Dopa_Responsive_Dystonia root entry across monogenic subtypes, pathophysiology,
    phenotypes, genetics, diagnostics, and treatments
  details: Expanded and audited Dopa_Responsive_Dystonia (MONDO:0016812) as the root entry for dopa-responsive
    dystonias across GCH1 (AD-DRD), TH (AR-DRD), SPR, PTS, and QDPR deficiency. Added MONDO-bound subtype
    entries (MONDO:0971063, MONDO:0011551, MONDO:0012994) with curated_in pointers to child dismech records,
    ICIMD metabolic classifications, typed Orphanet POINT_PREVALENCE (BAND_1_9_PER_1000000, rate_low/rate_high
    0.1-0.9 per 100,000), clinical progression and surgical diagnostic-delay burden, connected all 18
    HPO phenotypes into the causal pathophysiology graph (0 disconnected phenotypes, including Equinovarus
    Deformity HP:0008110 and Limb Hypertonia HP:0002509), expanded CSF monoamine and blood phenylalanine
    biochemical markers, added differential diagnoses (HSP, cerebral palsy, AADC deficiency), and curated
    levodopa/carbidopa, 5-HTP, sapropterin, and selegiline therapies.

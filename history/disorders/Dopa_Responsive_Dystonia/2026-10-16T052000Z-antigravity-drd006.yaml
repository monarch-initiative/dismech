  summary: Review and expand Dopa_Responsive_Dystonia root entry across monogenic subtypes, pathophysiology, phenotypes, genetics, diagnostics, and treatments
  details: >-
    Expanded and audited Dopa_Responsive_Dystonia (MONDO:0016812) as the
    root entry for dopa-responsive dystonias across GCH1 (AD-DRD), TH
    (AR-DRD), SPR, PTS, and QDPR deficiency. Added MONDO-bound subtype
    entries, ICIMD metabolic classifications, Orphanet prevalence,
    clinical progression and surgical diagnostic-delay burden, connected
    all 18 HPO phenotypes into the causal pathophysiology graph (0
    disconnected phenotypes), expanded CSF monoamine and blood
    phenylalanine biochemical markers, added differential diagnoses (HSP,
    cerebral palsy, AADC deficiency), 5-HTP/BH4/selegiline therapies, and
    registered clinical trials.

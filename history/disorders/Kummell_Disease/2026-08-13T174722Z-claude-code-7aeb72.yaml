  summary: Link minor spinal trauma to avascular necrosis on the delay evidence
  details: |
    Backfill for issue #8085. Minor spinal trauma is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into Vertebral body avascular necrosis. The node's own description opens by following minor spinal trauma to disruption of the intraosseous blood supply and then to ischemic necrosis, so the intervening step is named in the graph and the link type follows it rather than following the quoted sentence, per the convention settled on PR #8408. The carried item is unusually well designed for a single patient: MRI taken immediately after a ground-level fall showed the vertebral integrity uninterrupted with even marrow signal, then after an asymptomatic interval of eight months the pain returned and collapse progressed. That delay is the signature of this disease and is what separates it from an ordinary compression fracture, so the temporal sequence is the argument. It is graded PARTIAL because it rests on one patient. Osteoporosis was NOT linked. It is a disease and a host state rather than an environmental exposure, the category error tracked in issue #8185, and it carries the entry's strongest quantitative evidence, a BMD T-score threshold correlated with the disease at P less than 0.001, which is exactly what would make linking it tempting and wrong.

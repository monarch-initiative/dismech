  summary: Conform ischemic bone necrosis nodes to ischemic_bone_necrosis_and_repair
  details: |
    Added conforms_to links to the ischemic_bone_necrosis_and_repair module on four nodes:
    Basivertebral foramen microcirculation compromise -> Bone Vascular Supply Interruption;
    Vertebral body avascular necrosis -> Ischemic Osteocyte and Marrow Cell Death;
    Pro-inflammatory osteoclastogenic signaling -> Necrotic Bone DAMP Release and
    Inflammatory Repair Bias; Progressive vertebral body collapse -> Structural Failure of
    Necrotic Bone under Mechanical Load. Left unconformed on purpose: Ischemia-induced
    HIF-1alpha signaling, which is the entry's hypoxia-sensing step upstream of the
    inflammatory node and has no counterpart node in the module (the module's amplifier
    cites the same HIF-1alpha/RANKL sentence as the route in), and the intravertebral
    vacuum cleft node, which is a radiological sign of nonunion specific to the vertebral
    body rather than a conserved mechanism. No node content was changed.

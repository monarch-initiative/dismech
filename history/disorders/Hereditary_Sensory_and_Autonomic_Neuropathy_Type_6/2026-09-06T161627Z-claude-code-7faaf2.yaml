  summary: 'Create: Hereditary Sensory and Autonomic Neuropathy Type 6 (MONDO:0013839)'
  details: |
    De novo curation of HSAN-VI (DST/dystonin).

    Lump/split: DISEASE. MONDO leaf, one causal gene, no descendants. DST also causes epidermolysis bullosa simplex (epithelial DST-e isoform) and a congenital myopathy (muscular DST-b); those are separate diseases from the same locus and are not curated here. The isoform-specificity is recorded in the genetic block because it is what makes them separable.

    Pathograph shape: the four cellular arms (cytoskeletal disorganisation, impaired fast axonal transport, ER/nuclear envelope stress, impaired autophagic flux) are drawn in PARALLEL converging on DRG sensory neuron degeneration, not as one linear chain. Two pieces of evidence force that: the ER defects precede the motor phenotype (PMID:18638474), and the milder Dstdt-Tg4 allele degenerates with no reduction in tubulin acetylation (PMID:29982604). A KNOWLEDGE_GAP discussion records which arm initiates as unresolved.

    Evidence balance: every mechanistic node below the gene is MODEL_ORGANISM. The dystonia musculorum mouse supplies the transport, ER-stress, autophagy, arrhythmia and Schwann-cell results; the human literature is ~15 patients. A HUMAN_MODEL_MISMATCH discussion records the translational gap explicitly with a proposed iPSC experiment, rather than leaving it implicit in the evidence_source grading.

    Four animal models curated with modeled_mechanisms, including two conditional models whose value is what they exclude: the Advillin-Cre model shows the arrhythmia is neurogenic and occurs without cardiomyopathy, and the P0-Cre Schwann-cell model gives only late-onset disease with sensory neurons intact.

    Deep research: one openscientist report. preflight-dr PASS (DST x59, OMIM 614653 matches). 22/22 references resolved. Two divergences from the report were deliberate. It did not cite the founding gene-discovery paper PMID:22522446, which was added from an independent PubMed search. Its causal chain also presents microtubule instability as a step leading to degeneration; PMID:29982604 states the opposite for initiation, and the entry follows the source.

    Self-caught defect: four reference_title values were first written from memory and failed the validator's title check. All titles were then re-derived from the reference cache. Worth noting that reference_title IS validated against the cache, which caught this immediately.

    Validation: just validate passes schema plus 43/43 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values all pass.

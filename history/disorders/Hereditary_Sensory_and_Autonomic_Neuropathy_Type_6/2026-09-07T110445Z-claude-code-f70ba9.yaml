  summary: 'Review round 1: corrected a contradicted frequency, mined the cached full
    text, connected two orphan pathograph arms'
  details: |
    Addressed the CRITICAL finding and all eight IMPORTANT findings from the automated review of PR 11243. The critical item was real: Neonatal hypotonia carried VERY_FREQUENT while the paper cited for it reports hypotonia at 41.1 percent, so the source contradicted rather than merely failed to support the band; corrected to FREQUENT. Attached the per-phenotype percentage paragraph from the cached PMID:40938507 to every phenotype whose band derives from it, since the previously cited listing sentence establishes presence and not frequency. Removed the frequency band from Global developmental delay entirely because no percentage exists for it in any cited source. Added thirteen phenotypes from the same cached paper: skin ulcer, dysphagia, growth delay, chronic diarrhea, facial dysmorphism, abnormal pupillary light reflex, hand clenching, bradycardia, tachycardia, corneal scarring, hyperpyrexia, areflexia, and a deliberately unbound abnormal sweating entry. Two term decisions differ from the review's suggestions: HP:0034252 is Absent corneal reflex, a different reflex from the absent light reflex the source reports, so the pupillary term HP:0007695 was used instead; and hyper/hypohidrosis is counted by the source as one combined category with no single HPO term covering both directions, so it is recorded with a free-text preferred_term and no binding rather than asserting a direction. Gave Alacrima the frequency the source reports and re-cited it to the sentence that names it explicitly. Added human clinical evidence for Arrhythmia alongside the mouse mechanism. Corrected evidence_source on PMID:29982604 from HUMAN_CLINICAL to MODEL_ORGANISM, since evidence_source classifies the cited publication and that is a dystonia musculorum mouse study. Connected Impaired Autophagic Flux to the cytoskeletal node so it is no longer drawn as an initiating lesion, and also connected Autonomic Neuron Degeneration to the gene lesion; the second orphan was not flagged in the review but is the same defect. Added the DST variant spectrum to the genetic section. Rewrote the treatments notes, which asserted that no citable evidence of any kind existed while this PR's own cache carries a disease-specific management paragraph; the claim is now narrowed to the true one, that no interventional study exists, with the management text cited and graded OTHER and with target_mechanisms joining the treatment to the pathograph. Sensory ataxia was left resting on model-organism evidence because no cited human source names it, and its description was corrected to say so rather than claiming it is part of the adult-onset human picture. Validation: schema passes, 68/68 snippets verified (was 43/43), term validation passes, and the whole-KB gates were run.

  details: |
    Created the PUS7-related neurodevelopmental disorder (IDDABS) entry anchored on MONDO:0032687 / OMIM:618342 / PUS7 (hgnc:26033), confirmed by the MONDO RO:0004003 gene-association relation before any curation began. Deep research provider: claude_code (just research-disorder claude_code PUS7-Related_Neurodevelopmental_Disorder; 17.5 min, 12 web searches, 95 turns, 47 citations); report committed under research/. No GeneReviews chapter exists (two PubMed E-utilities searches returned zero); absence documented in the entry notes together with a references_cache grep. Curated 16 connected pathophysiology nodes forming one DAG with a single root (biallelic PUS7 loss of function to loss of pseudouridine synthase activity to the tRNA-13, mRNA, tRNA-derived-fragment and 7SK substrate arms to deregulated global protein synthesis to impaired neuronal development, brain growth, somatic growth, synaptic remodelling, and the secondary HPRT1 or Lesch-Nyhan-like branch), 20 phenotypes with HPO bindings, an autosomal recessive inheritance record, a genetic section with 7 curated variants, 6 supportive treatments, 7 differential diagnoses of which 6 carry bound MONDO terms (PUS3, PUS1/MLASA1, Lesch-Nyhan, hyperlysinaemia, ADAT3 class, Smith-Magenis) and PUS7L deliberately unbound because MONDO has no PUS7L disease class, 2 mechanistic hypotheses and 5 discussions (2 HUMAN_MODEL_MISMATCH, 2 KNOWLEDGE_GAP, 1 CONTROVERSY). Frequency bands derived only from published individual-level denominators with arithmetic recorded per phenotype; bands omitted where sources are qualitative. Validation: just validate clean (schema, terms, references), scripts/check_snippets_verbatim.py 119/119 verified 0 failures, scripts/check_folded_hyphens.py clean, compliance 92.8 percent. Structured sources not cited: OLS4 ORDO search for PUS7 returns 0 hits and ClinGen has no PUS7 curation, and the local ORPHA/ClinGen manifests are stale per #7622.

  summary: Fix diagnosis[0] evidence mismatch and resolve evidence_source conflict
  details: |
    Second-round review fix for PR #7667 (re-review of 79d0df11).

    Blocking item — diagnosis[0] cited a snippet that did not support its claim. The
    snippet 'Both variants were associated with a specific reduction of Psi13 in
    their tRNAs.' says nothing about sequencing, yet the explanation asserted the
    variants 'were identified by exome sequencing'. Verbatim-valid but claim-invalid.
    Replaced with the trailing clause of PMID:30778726 cache line 144, 'exome/genome
    sequencing of children with intellectual disability will incorporate it in their
    annotation', and rewrote the explanation to state only what the quote supports.
    Added a second evidence item quoting the methods sentence 'Exome capture was
    performed using the TruSeq Exome Enrichment kit' so the claim that exome
    sequencing was the route actually applied to the founding cohort is grounded in
    the paper rather than inferred.

    Evidence_source conflict resolved. The identical Psi13 snippet was previously
    tagged HUMAN_CLINICAL on diagnosis[0] and IN_VITRO on diagnosis[1]. Because the
    Psi13 measurement was a CMCT assay on patient lymphoblastoid cell lines,
    IN_VITRO is correct; diagnosis[0] no longer uses that snippet at all, so the two
    entries no longer disagree about the same sentence.

    diagnosis[1] strengthened with the direct quote instead of an inferential
    bridge. The paper states the VUS-classification use outright ('this may also
    serve as a very helpful assay for the proper classification of variants of
    unknown significance'), so that is now the primary evidence item; the Psi13
    result is retained as a second IN_VITRO item establishing the functional readout
    the assay measures. The two clauses are non-overlapping substrings of the same
    sentence, which is the split the reviewer proposed.

    Non-blocking items taken. Added a fourth diagnosis entry, audiometric assessment
    for sensorineural hearing loss (NCIT:C38036 Audiometric Test, already present in
    cache/ncit/terms.csv and the treatmentactionterm enum cache, verified reachable
    from NCIT:C25218), quoting the cached sentence documenting that the hearing loss
    was initially misattributed to chronic middle ear effusion and only recognised as
    sensorineural after ventilation tubes failed. Also replaced the \u03a8 escape
    with a literal Psi character for readability, matching the rest of the file.

    Deliberately unchanged: the three pseudouridine-synthase differentials (PUS3,
    PUS1, PUS7L), the oncology-literature guardrail, the ORPHA:544510 retraction, and
    the pathograph. No evidence marker was strengthened; both new supports: values
    are SUPPORT on directly quoted text.

    Validation: schema clean, term validation passed, 125/125 snippets verbatim under
    both scripts/check_snippets_verbatim.py and just validate-references, folded
    hyphens clean, compliance 100% on all four diagnosis entries and their evidence.
    references_cache/ churn from #7507 reverted; cache/*.csv unchanged (no new terms
    needed).

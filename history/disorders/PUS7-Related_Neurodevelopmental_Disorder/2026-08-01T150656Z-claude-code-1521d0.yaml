  summary: Retract an unsourced ORPHA code; add the diagnosis section
  details: |
    Retracted ORPHA:544510 from prevalence notes. The identifier was unsourced - absent from the deep-research report and its citations sidecar - and contradicted the entry-level notes, which correctly record that no Orphanet entity exists. Confirmed independently: MONDO:0032687 carries no ORPHA xref, only DOID:0081265, GARD:0018516, MEDGEN:1675423, OMIM:618342 and UMLS:C5193039. Because the claim sat in prose rather than a snippet, the reference validator could not catch it. Added a diagnosis section with three entries - exome/genome sequencing, the tRNA pseudouridine-13 functional assay for variant interpretation, and neuroimaging plus EEG as exclusionary investigations - all quoted byte-exact from the already-cached PMID:30778726 full text. Refiled the misplaced Molecular Diagnosis by Exome Sequencing treatment as Genetic Counselling and Carrier Testing, with the diagnostic half moved to diagnosis. 122/122 snippets verify.

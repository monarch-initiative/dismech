  summary: 'Create: Desmosterolosis (DHCR24)'
  details: |
    New entry for desmosterolosis (MONDO:0011217; OMIM 602398; ORPHA:35107), caused by biallelic DHCR24 variants, created from stubs/Desmosterolosis.yaml, which is removed. The name is kept because desmosterolosis is defined by DHCR24 deficiency; DHCR24-related desmosterolosis is recorded as a synonym. DHCR24 is bound to GO:0050614 Delta24-sterol reductase activity (EC 1.3.1.72), DECREASED, from the enzyme characterisation and yeast expression of patient alleles (PMID:11519011). The pathograph runs from the lesion to desmosterol accumulation (PMID:12457401, PMID:9450875; Dhcr24-KO brain PMID:30891795) and impaired cholesterol synthesis (PMID:33524375), then to aberrant neuronal arborization (mouse, PMID:30891795), abnormal brain development (PMID:21559050, PMID:24961299, PMID:42454491) and disrupted embryonic morphogenesis (PMID:29175559), with a separate mouse-explant branch for growth-plate chondrocyte dysfunction and short limbs (PMID:21845517). Phenotypes come from the published case series because no GeneReviews chapter exists: the Bedouin kindred (PMID:21559050), the minimal-phenotype comparison (PMID:24961299), the first lethal and first living cases (PMID:9450875, PMID:12457401), later cases (PMID:21671375, PMID:29175559, PMID:36538928, PMID:41500862) and the 2023 pooled frequencies for 13 patients (PMID:38239854). ClinGen Definitive (2025, CGGV c0bfe726) is copied into gene_disease_validity. Treatments recorded are antiseizure medication (one case) and the unsuccessful cofactor trial (PMID:21671375). Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (100 snippets, 0 issues), count-verified-snippets 100/100, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, check-snippet-grading, list-gene-term-mismatches and check-genereviews (NO_CHAPTER) all pass.

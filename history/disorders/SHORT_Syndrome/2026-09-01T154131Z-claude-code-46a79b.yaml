  summary: 'Create: SHORT Syndrome'
  details: |
    De-novo curation of MONDO:0010026, claimed via issue #10377.

    Deep research: one openscientist run (research/SHORT_Syndrome-deep-research-openscientist.md, 17 min, 19 citations). The run landed without reference_validation or term_validation in its frontmatter, unlike the TFRC run from the same batch, so both were added by hand with just validate-research-reference and just validate-research-terms. Reference validation then returned 19/19 resolved, 0 unresolved, 19/19 on topic.

    Term validation caught a real error and it is worth recording: the report gives MONDO:0009159 as this disease's MONDO identifier, in its key-identifiers table and again in the running text. MONDO:0009159 is Ehlers-Danlos syndrome, cardiac valvular type. The correct term, MONDO:0010026, is what this entry binds. This is the failure mode issue #9888 predicts - the recipe sends an empty mondo_id, so the provider supplies its own - and it is the expensive shape of it, because the invented CURIE resolves cleanly and only a label check catches it. Reported on #9888 with the evidence. Nothing else in the report was wrong: the mechanism, the mouse model and the metabolic dissociation all check out against the primary papers.

    The entry was drafted first from the 2013 gene-discovery trio (PMID:23810378, PMID:23810379, PMID:23810382) plus the 32-patient clinical reappraisal (PMID:26497935). The report then contributed four substantial things, all verified against the primary sources before use: the Pik3r1 R649W knock-in mouse (PMID:26974159), the dissociation of insulin resistance from dyslipidaemia and hepatic steatosis (PMID:27766312), the pubertal timing of the diabetes with its age-stratified counts and the metformin/SGLT2-inhibitor regimen (PMID:32879144), and the systematic dental and craniofacial appraisal (PMID:34212753).

    Two curation decisions worth flagging. Hepatic steatosis and dyslipidaemia are curated as phenotypes carrying REFUTE evidence, because their absence alongside extreme insulin resistance is diagnostically informative rather than merely a negative. Growth hormone therapy is likewise recorded with a REFUTE item against the reading that it causes the diabetes, since the cited review attributes that to puberty; the case against growth hormone rests on lack of statural benefit.

    A discussion records a genuine tension the entry does not resolve: the pathograph routes everything through one reduced-PI3K-AKT node, while the 2016 study states these mutations impair insulin signalling only in some cellular contexts and reports one patient's cells where the binding defect did not propagate downstream. The node was kept single and the qualification recorded rather than splitting the pathograph on speculation.

    Four phenotypes are deliberately left unconnected - joint hypermobility, inguinal hernia, sensorineural hearing impairment, speech delay - because they are the features the cohort study grades as less specific and no source proposes a mechanism. Every other phenotype is reachable from the variant node.

    Validation: just validate passes with 111/111 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens all clean.

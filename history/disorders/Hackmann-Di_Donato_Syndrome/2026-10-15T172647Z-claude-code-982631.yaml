  summary: 'Create: Hackmann-Di_Donato_Syndrome'
  details: 'De novo curation of Hackmann-Di Donato syndrome (NKAP, MONDO:0026733) from the stub queue,
    claim issue #14370.


    Deep research: falcon (Edison) was requested and failed three times with ''503 Failed to authenticate''
    (providers --check reported falcon UNREACHABLE). Both dr_fallback=''--fallback'' and ''--fallback-provider
    claude_code'' were tried and did not hand over, because deep-research-client classes that 503 as a
    transient server error rather than a credential failure, so no fallback record was written. claude_code
    was therefore run directly (just research-disorder claude_code), which is a hand substitution; the
    report is research/Hackmann-Di_Donato_Syndrome-deep-research-claude_code.md (20/20 references resolved,
    3/3 quotes valid, 0 off topic, 64/64 terms resolved; needs_review was set only for a cosmetic NCIT
    label mismatch). just preflight-dr returned WARN on HDAC3 (18 mentions vs 47 for NKAP); read and judged
    benign, since HDAC3 is NKAP''s corepressor partner and OMIM 300766 is the NKAP gene record. The report''s
    18 PMIDs were the same set found by an independent PubMed sweep; the seven not cited (T cell, iNKT,
    HSC, kinetochore and NF-kB papers) are mouse immune biology with no human counterpart in this disease,
    except PMID:20610818, cited once in the HUMAN_MODEL_MISMATCH discussion.


    GeneReviews: just check-genereviews --online with synonyms in place reports NO_CHAPTER for GeneReviews
    and StatPearls. No ClinGen (CGGV) or Orphanet (ORPHA) record for NKAP is cached, so gene_disease_validity
    is absent.


    Content: eight-node pathograph (C-terminal missense variant -> loss of NKAP-HDAC3 corepressor function
    / perturbed spliceosomal exon-ligation association / reduced proliferation and senescence -> transcriptional
    dysregulation of long exon-rich genes -> cardiac morphogenesis gene dysregulation, impaired neurodevelopment,
    abnormal skeletal and connective tissue development; skewed XCI in heterozygous females), 20 phenotypes
    with frequencies from the Fiordaliso 2019 cohort (n=10) as tabulated in PMID:41917976 Table 2, X-linked
    recessive inheritance with the mouse XCI-skewing evidence, a CASES_IN_LITERATURE prevalence record,
    NKAP genetic record with p.Arg330Cys (likely pathogenic) and p.Arg204Ser (VUS) variants, diagnosis
    by exome/genome sequencing with the Lujan-Fryns differential, two supportive treatments, zebrafish
    and mouse animal models and the HEK293T experimental model with modeled_mechanisms, and two discussions
    (KNOWLEDGE_GAP on R-loops; HUMAN_MODEL_MISMATCH on truncating vs missense alleles). Craniofacial features
    whose only abstract-level source is the phrase ''dysmorphic features'' are graded directness INDIRECT
    with the cohort count in the description. Five craniofacial phenotypes and the single-case absence
    seizures are left without a causal edge on purpose.


    Validation: just validate, validate-terms (passed; new rows in cache/mondo, cache/hgnc and the diseaseterm
    enum cache), count-verified-snippets 68/68, check-entity-refs, check-causal-targets, check-coarse-phenotypes
    (HP:0001627 carries VARIABLE_SPECTRUM), check-enum-values, check-duplicate-keys, check-block-scalar-comments,
    check-snippet-length (one 3-word snippet lengthened), check-title-snippets, check-snippet-grading,
    check-retired-support-prose, check-reference-titles, check-folded-hyphens, check-term-cache-integrity
    all OK; compliance 91.6%. The final batched just validate-disorders run is recorded in the PR body.


    Pre-PR red-team review (fresh-context subagent following the dismech-pr-review skill) raised five
    important findings, all taken: the variant-to-proliferation edge was downgraded to INDIRECT_UNKNOWN_INTERMEDIATES
    because the mouse allele is an N-terminal in-frame deletion (c.5_127del) rather than a C-terminal
    missense change, and the mouse model now links to that node directly with the allele named in its
    genotype; the cardiac morphogenesis node was re-parented under the NKAP-HDAC3 node, which is the route
    PMID:38647244 asserts; the standalone mitral valve prolapse phenotype, whose only abstract-level snippet
    did not name it, was folded into the congenital heart defect description; the supportive-care treatment
    now records the case-level surveillance plan in the full text of PMID:41917976 instead of claiming
    no management literature exists; and repository-state and process prose was removed from notes. Also
    taken: Midface retrusion added (7/10, same footing as the other craniofacial rows), the human haemophilia-A
    carrier sentence added as BACKGROUND evidence on the inheritance block and the X-inactivation node,
    quote_role BACKGROUND on the exon 8-9 sentence, the co-IP/ChIP quote regraded IN_VITRO, the zebrafish
    link changed to PERTURBS, and wording fixes (eight families; reported rather than recurrent alleles;
    the p.Arg330 cardiac correlation qualified to the four cases reported to 2024). Not taken: a FAILS_TO_RECAPITULATE
    link from the mouse to the skeletal node, because the normal-skeleton observation is full-text only
    and that link requires quotable evidence; it is stated in the model description instead. After the
    round: 71/71 snippets verified, 13 of 20 phenotypes causally wired, compliance 92.3%. Six references
    fetched for the research report but not cited by the entry were left uncommitted.


    CI round: the gene-activity-grounding gate flagged NKAP as wired into the pathograph with no molecular
    function on its node; transcription corepressor activity and histone deacetylase binding (DECREASED)
    were bound on the variant node.


    PR review round 1 (ai4c-reviewer, CHANGES_REQUESTED). The reviewer''s premise, that full-text quotes
    from the cached PMID:41917976 pass validation, was tested against the exact CI gate (`just validate-disorders`,
    which passes --no-full-text) with a comparison-table row as a snippet, and it verified, so the earlier
    assumption that only abstract sentences are quotable was wrong. All four important items taken: Cryptorchidism
    and Hypospadias rows added (2/10 each, with the 5/10 any-genital-anomaly row), and the notes sentence
    that had claimed no abstract states them removed, along with the unsourced central-obesity claim;
    every frequency-bearing phenotype row now quotes its comparison-table row directly (DIRECT) instead
    of the ''dysmorphic features'' abstract sentence graded INDIRECT; Midface retrusion kept on HP:0011800
    with the paper''s ''hypoplasia of the midsection'' sentence quoted and the description saying the
    table words it as the bottom half of the face; supportive care now carries the four surveillance sentences
    of the single-proband plan as evidence, with the note rewritten. Suggestions taken: Mitral valve prolapse
    restored as its own row (3/10 plus the proband), Ventricular septal defect (both fetuses) and Increased
    nuchal translucency rows from the full text of PMID:38647244, with the VSD row wired from the cardiac
    morphogenesis node on the authors'' own model statement, and an ethosuximide single-case treatment
    row (CHEBI:4887) targeting the absence-seizure phenotype. The tetralogy-of-Fallot-like presentation
    is described on the VSD row rather than bound, because the source states it only as a possibility.
    After the round: 94/94 snippets and 106 titles verified by validate-disorders, 25 phenotypes with
    14 causally wired, compliance 93.6%.'

  summary: Enriched NF1 Microdeletion Syndrome with Harrison's and RASopathy classifications, GO molecular function grounding on all gene-linked pathophysiology nodes, genetic evidence, and treatment ontology bindings.
  details: Added NEUROLOGIC, ONCOLOGY_HEMATOLOGY, and GENETICS_ENVIRONMENT_DISEASE Harrison's chapters and RASopathy mechanistic classification backed by PMID:28213670 and PMID:38874808. Grounded all four gene-bearing pathophysiology nodes (NF1, SUZ12, CRLF3, and 3D chromatin reorganization) with non-protein-binding GO molecular functions, cell types, anatomical locations, and downstream causal links to all dermatologic, cardiovascular, craniofacial, and growth phenotypes. Completed genetic entries with inheritance terms and verbatim evidence, and enriched MPNST surveillance, selumetinib therapy, and surgical MPNST excision with NCIT treatment terms and modalities.

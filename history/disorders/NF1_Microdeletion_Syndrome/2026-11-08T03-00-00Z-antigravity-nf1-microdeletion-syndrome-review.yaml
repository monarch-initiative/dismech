  summary: Enriched NF1 Microdeletion Syndrome with MONDO synonyms, Harrison's and RASopathy classifications, GO/UBERON/CL pathophysiology grounding, evidenced downstream edges, genetic evidence, and treatment ontology and therapeutic_agent bindings.
  details: Added MONDO exact synonyms, NEUROLOGIC, ONCOLOGY_HEMATOLOGY, and GENETICS_ENVIRONMENT_DISEASE Harrison's chapters, and RASopathy mechanistic classification backed by PMID:28213670 and PMID:38874808. Grounded the 17q11.2 deletion node with NF1 GTPase activator activity (GO:0005096, DECREASED), Schwann-cell/neuronal cell types, anatomical locations, and evidenced downstream causal links to dermatologic, cardiovascular (ADAP2 and SUZ12), craniofacial, and growth phenotypes; bound SUZ12 to chromatin binding (GO:0003682, DECREASED) and the ESC/E(Z) complex (GO:0035098) while leaving CRLF3 and the 3D chromatin position-effect node free of unsupported molecular-function bindings. Completed genetic entries with inheritance terms and matched verbatim evidence (including RNF135 overgrowth/dysmorphism evidence from PMID:34168676), and enriched MPNST surveillance, MEK inhibitor therapy (binding selumetinib CHEBI:90227 and mirdametinib NCIT:C52195 under therapeutic_agent), and surgical MPNST excision with NCIT treatment terms.

  details: |
    Created the DNAJB2/HSJ1 entry for MONDO:0013947 from the stub. Deep research: requested falcon via just dr_fallback='--fallback' research-disorder; falcon was not configured (no EDISON_API_KEY), so claude_code produced the report (research/Neuronopathy_Distal_Hereditary_Motor_Autosomal_Recessive_5-deep-research-claude_code.md; frontmatter fell_back: true, requested_provider: falcon; no citations sidecar was written). Reference validation 22/22 resolved, 0 off topic; term validation 27/28 resolved, 0 mislabelled. just preflight-dr returned PASS (DNAJB2 mentioned 39 times, OMIM 614881 matches). All cited PMIDs fetched and read; PMID:27083531 (Frasquet 2016) cached with content_type unavailable after a --force retry, so it is listed in references but not used as evidence. Structure: 8-node causal chain from biallelic DNAJB2 LoF to loss of HSJ1 (molecular_functions GO:0001671 ATPase activator activity, GO:0030544 Hsp70 protein binding, GO:0031593 polyubiquitin modification-dependent protein binding, GO:0070628 proteasome binding, all ABSENT, grounded in the Sarparanta 2020 review and HSJ1a ataxin-3 cell data PMID:21625540) to impaired UPS client targeting and aggregate accumulation (edges INDIRECT_UNKNOWN_INTERMEDIATES, gain-of-function cell evidence marked directness INDIRECT), lower motor neuron axon degeneration, sensory axon loss, denervation and a provisional nigrostriatal branch. 16 phenotypes; 4 variants (c.352+1G>A founder, c.229+1G>A, c.145delG, 3.8 kb deletion). Key decisions: dHMN and CMT2 presentations curated as one disease rather than subtypes (MONDO lists DNAJB2-related CMT2 as an exact synonym; dHMN evolves into CMT2); the dominant DNAJB2a stop-loss neuromyopathy (PMID:37070754) and a heterozygous c.823+6C>T case (PMID:40423229) recorded in genetic notes only; depression/fatigue from the 2026 refugee cohort not curated as phenotypes because the authors flag migration stress as a confounder; historical CMT2T label for the p.Tyr5Cys family recorded as a nomenclature differential. No GeneReviews chapter (check-genereviews --online NO_CHAPTER). Validation: just validate 0 issues (83/83 snippets), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms (incl. --resolve), gene-activity grounding vs origin/main, check-snippet-length, check-title-snippets, check-snippet-grading (after aligning one duplicated Gess 2014 quote to IN_VITRO), check-folded-hyphens, check-coarse-phenotypes, check-term-cache-integrity and check-cache-order all OK.

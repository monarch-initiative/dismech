  summary: Grounded RPGR dysfunction at the photoreceptor connecting cilium in guanyl-nucleotide exchange factor activity (GO:0005085, DECREASED) and small GTPase binding (GO:0031267, DECREASED) with RCC1-like domain evidence, split progression into three age phases, and added ophthalmic imaging, full-field ERG, and RPGR ORF15 genetic testing diagnosis entries.
  details: Added modifier DECREASED and RCC1-like domain / small-GTPase evidence (PMID:27162334, PMID:33467000) to GO:0005085 and GO:0031267 on RPGR dysfunction at the photoreceptor connecting cilium while removing redundant gene/MF bindings from Variant-position-dependent rod versus cone bias; split progression into childhood onset, adolescent peripheral field loss, and adult central vision loss phases (PMID:26843488); separated Ophthalmic Examination and Retinal Imaging (NCIT:C120698), Full-Field Electroretinography (NCIT:C101217), and RPGR Molecular Genetic Testing (NCIT:C15709); and added NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE, and ciliopathy classifications.

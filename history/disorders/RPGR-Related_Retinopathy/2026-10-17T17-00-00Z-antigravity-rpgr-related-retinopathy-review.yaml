  summary: Documented RPGR N-terminal RCC1-like domain homology and the absence of an identified physiological GTP-binding partner on RPGR dysfunction at the photoreceptor connecting cilium, split progression into three age phases, and added ophthalmic imaging, full-field ERG, and RPGR ORF15 genetic testing diagnosis entries.
  details: Documented RPGR N-terminal RCC1-like domain homology and the absence of an identified physiological GTP-binding partner on RPGR dysfunction at the photoreceptor connecting cilium with SUPPORT / BACKGROUND (OTHER) evidence (PMID:27162334, PMID:33467000) without binding an unverified small-GTPase molecular function, while removing redundant gene/MF bindings from Variant-position-dependent rod versus cone bias; split progression into childhood onset, adolescent peripheral field loss, and adult central vision loss phases (PMID:26843488); separated Ophthalmic Examination and Retinal Imaging (NCIT:C120698), Full-Field Electroretinography (NCIT:C101217), and RPGR Molecular Genetic Testing (NCIT:C15709); and added NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE, and ciliopathy classifications.

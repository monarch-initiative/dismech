  summary: 'Create: Congenital Glutamine Synthetase Deficiency (GLUL, MONDO:0012393)'
  details: |
    New entry for the recessive loss-of-function GLUL disease (WP-004 row 1.9.01.01), separate from the dominant DEE116 entry. Pathograph: GLUL loss -> deficient glutamine synthesis -> systemic glutamine deficiency (developing-brain starvation, astrocyte glutamine-glutamate-GABA cycle failure, secondary NAD+ deficiency) and impaired high-affinity ammonia clearance -> hyperammonemia; E/I node conforms to epilepsy_excitation_inhibition_imbalance. Three hypothesis groups (glutamine starvation CANONICAL, hyperammonemia contribution ALTERNATIVE, NAD+ EMERGING). 15 PMIDs fetched with just fetch-reference; 96/96 snippets verified; schema and terms pass. One fetched reference (PMID:42570757, chlorfenapyr hepatotoxicity) was discarded as off-topic. ORPHA:71278 not cited because the Orphadata bulk file was unavailable.

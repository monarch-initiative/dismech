  summary: 'Review round 4: record the compound-het siblings'' contrary findings'
  details: |
    Responded to ai4c-reviewer round-4 CHANGES_REQUESTED. The two compound-heterozygous siblings from PMID:33150193 were counted toward the case total but their contrary findings were not recorded. Added REFUTE evidence on Hypoglutaminemia (normal glutamine), Hyperammonemia (normal baseline ammonia off valproate) and Abnormal cortical gyration / CNS hypomyelination (unremarkable neuroimaging); re-graded Hypoglutaminemia, Hyperammonemia and CNS hypomyelination from VERY_FREQUENT to FREQUENT against seven patients. Softened the prevalence note (variants not functionally tested; no biochemical signature). Replaced the carglumic-acid target-edge snippet (it quoted valproate's NAGS inhibition, not the GS defect) with the GS-inefficiency/urea-cycle sentence, and noted the authors' uncertainty about carglumic acid's mechanism. Added the siblings' p.Arg106*/p.Lys14Asn genotype to genetic variants. 105/105 snippets verified; all offline gates clean.

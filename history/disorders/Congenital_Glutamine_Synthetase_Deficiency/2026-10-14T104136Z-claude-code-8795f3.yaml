  details: |
    Changed Seizure and Global developmental delay from OBLIGATE to VERY_FREQUENT, because one index infant died on day 2 and one case was diagnosed prenatally. Added quote_role REVIEW_SYNTHESIS to the two minireview variant-activity snippets (PMID:27775558). Added PMID:24139043 evidence to the asparagine synthetase deficiency differential. Rewrote the multiorgan-failure review note to record the exact HPO searches (runoak ols:hp and OLS full text); none returned a term. Deep research could not be produced: the falcon, openai and claude_code providers all failed in the scanner environment. A direct PubMed esearch for GS deficiency and GLUL biallelic, homozygous or compound-heterozygous patients found no recessive patients beyond the five already cited; the post-2020 GLUL clinical papers concern the dominant DEE116 disorder. Merged origin/main to resolve a timestamp-only conflict in cache/hp/terms.csv.

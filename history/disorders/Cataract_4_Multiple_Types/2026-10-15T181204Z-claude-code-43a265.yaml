  summary: 'Review round 1: diagnosis section, sequelae source, surgical complications'
  details: |
    Addressed the automated review of PR 14399. Added a diagnosis section with three rows: slit-lamp examination (NCIT:C75583 Slit-lamp Examination, a descendant of NCIT:C25218 per OLS hierarchicalAncestors; evidence PMID:35222542, PMID:21031598, and background from PMID:22219628), multigene panel sequencing (NCIT:C198412; PMID:37337769 methods and molecular diagnostic yield) and targeted CRYGD Sanger sequencing (NCIT:C19641 Dideoxy Chain Termination DNA Sequencing; PMID:37480084). The slit-lamp row notes that morphology does not identify the gene, since cerulean cataract is most commonly documented with CRYBB2 (PMID:19633732) and coralliform cataract has been reported with a connexin 46 insertion (PMID:37480084). Moved the nystagmus and amblyopia sequelae from Visual impairment to Developmental cataract, because PMID:19084444 ties both to form deprivation by a dense congenital opacity and to the timing of its removal; each sequela edge carries that evidence marked INDIRECT, as the cohort was not genotyped. Added to the cataract surgery treatment a sentence and two evidence items from PMID:19084444 on secondary membranes requiring re-operation and glaucoma after paediatric cataract surgery, more frequent with surgery in the first four weeks. To clear the CI gate check_gene_activity_grounding (CRYGD reached a pathophysiology node with no molecular function), bound GO:0005212 structural constituent of eye lens on the CRYGD Pathogenic Variant node with modifier ABNORMAL, because the mutant protein is made and often folded but no longer stays in solution, a qualitative change rather than a reduced amount; added a supporting background snippet from PMID:37480084. No new references were fetched. Validation: just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments and validate-disorders.

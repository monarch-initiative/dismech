  summary: 'Create: Cataract 4, Multiple Types'
  details: |
    New entry for CRYGD-related autosomal dominant cataract (MONDO:0007281), replacing the stub skeleton and deleting stubs/Cataract_4_Multiple_Types.yaml. The pathograph has two allele-class routes that converge: surface alleles (R14C, P23T, R36S, R58H, E107A) that keep the native fold but lose solubility, leading either to crystallization (R36S, R58H) or to aggregation; and destabilizing alleles (W43R, C-terminal truncations) that expose hydrophobic surfaces and aggregate. Both lead to lens light scattering and the morphological phenotypes (coralliform, aculeiform, cerulean, crystalline, nuclear, lamellar), with visual impairment, nystagmus and amblyopia downstream. Four nodes conform to the cataract_lens_opacification module. Sources are primary family reports (PMID:9927684, 12676897, 15041957, 10915766, 22219628, 10521291, 16030500, 22669729, 19633732, 21031598, 37480084, 17724170, 14693780, 15064679), recombinant-protein biophysics (PMID:10688888, 11371638, 12729747, 15451671, 15709761, 21197114, 18421082, 27417136, 22655036, 20577655), mouse Crygd models (PMID:10704279, 12226711) and a published ClinGen-protocol curation (PMID:42091610). No ClinGen CGGV record for CRYGD is cached, so gene_disease_validity is omitted. check-genereviews --online reports no GeneReviews or StatPearls chapter. Crystalline and fasciculiform cataract have no HPO term; crystalline is bound to HP:0000519 and fasciculiform is noted only. The Santhiya 2002 P23T lamellar report (PMID:12011157) has no cached abstract and was not cited; the lamellar row cites a later paper's background summary instead. The openscientist deep-research report (research/Cataract_4_Multiple_Types-deep-research-openscientist.md) was then integrated. Its frontmatter reports 33/33 references resolved, 23 judged on topic, and term validation needing review. `just preflight-dr <report> MONDO:0007281` returned PASS (CRYGD mentioned 41 times; report OMIM 115700 matches MONDO), so there is no named-entity confusion with other crystallin genes; running it required fetching the local MONDO build with `just fetch-ontology-dbs mondo`.
    From the report's sidecar the entry gained: P23T aggregates retain a native-like fold (PMID:28474685), the inverted-solubility contact at residue 23 (PMID:31422822), P23T condensation in mammalian cells (PMID:28401204), Greek key 4 truncations Y151X and T160RfsX8 with stress-enhanced aggregation and alpha-crystallin rescue (PMID:39084439, also added Y151X as a variant), reduced soluble R36P protein (PMID:39563676), a second nystagmus and nuclear cataract family (S78F, PMID:35222542), a second Chinese P23T coralliform family noting the same allele with lamellar cataract (PMID:14767902), CRYGD among the three most frequent genes in a Chinese cohort (PMID:37337769), and treatment detail on lens aspiration with or without IOL and the 14-week critical period for dense bilateral congenital cataract (PMID:42216740, PMID:19084444, both cited as indirect because those cohorts were not genotyped). Snippets now 85/85.
    Report citations not used: PMID:34419537 (lanosterol and CRYBA1 G91del, a different crystallin gene), PMID:18056999 (CRYAA/CRYAB knock-in mice, other genes), PMID:30475834 (zebrafish alpha-A crystallin mutants with a non-pathogenic gamma-D I4F reporter, not a model of this disease), PMID:17327821, PMID:16879363 and PMID:1869417 (canine cataract, no CRYGD lesion), PMID:36484206, PMID:33313297 and PMID:42657226 (general cataract drug reviews not tested on CRYGD alleles), PMID:29338044 (general crystallin review), PMID:41155148, PMID:42272130, PMID:37578328, PMID:42288323 and PMID:42678450 (all-cause paediatric cataract diagnostics or surgical technique, adding nothing specific), PMID:38874774, PMID:39994538 and PMID:42111499 (single CRYGD families or cohort mentions redundant with the cited families). Report term suggestions rejected: HP:0000568 is Microphthalmia, not microcornea (the entry keeps HP:0000482); GO:0051082 is obsolete; CL:0000149 is visual pigment cell, not lens fiber cell (the entry keeps CL:0011004). Uncited reference caches fetched by me or by the report's validation were removed. Final validation: just validate, validate-terms, count-verified-snippets (85/85), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments and validate-disorders.

  summary: Rebind the EMT-control process to GO:0010717
  details: |
    The Corneal Endothelial-to-Epithelial Transdifferentiation node carried two process annotations. The second, whose preferred_term is 'Dysregulated epithelial-to-mesenchymal transition control', was bound to GO:0001837 epithelial to mesenchymal transition. The node does not claim that the corneal endothelium undergoes EMT; its description says the ZEB1 EMT axis that normally maintains the mesenchymal/endothelial state is dysregulated, which is a claim about the regulation of the transition rather than about the transition occurring. Rebound to GO:0010717 regulation of epithelial to mesenchymal transition, which is what the preferred_term already said. The GO:0060231 mesenchymal to epithelial transition annotation beside it is unchanged and is the source's own word for the event: PMID:29499165 states that mutations induce MET within the corneal endothelium, and PMID:31194824 names the endothelial to epithelial transition (EnET) as a MET-like transition.

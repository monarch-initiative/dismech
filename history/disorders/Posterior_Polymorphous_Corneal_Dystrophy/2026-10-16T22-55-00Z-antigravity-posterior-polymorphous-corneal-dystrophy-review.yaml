  summary: Review and enhance Posterior Polymorphous Corneal Dystrophy
  details: Reviewed Posterior Polymorphous Corneal Dystrophy (MONDO:0020364) against the deep-research
    report (Posterior_Polymorphous_Corneal_Dystrophy-deep-research-falcon.md) and cached PubMed references
    (including StatPearls PMID:28613630). Added classifications, prevalence, progression, biochemical
    markers (ectopic E-cadherin/Cytokeratin 7, COL4A3, and nuclear S552 phospho-beta-catenin), separate
    diagnostic modalities (slit-lamp biomicroscopy, non-contact specular microscopy, in vivo confocal
    microscopy, and OVOL2/ZEB1/GRHL2 genetic testing), differential diagnoses (Fuchs endothelial corneal
    dystrophy, congenital hereditary endothelial dystrophy 1, and Alport syndrome), and bibliography references;
    wired OVOL2, ZEB1, and GRHL2 with GO:0000981 molecular_functions on the ZEB1 EMT-axis node; moved
    the gnomAD ZEB1 LoF allele frequency snippet (PMID:33946386) from prevalence to genetic ZEB1; and
    strengthened direct clinical evidence and causal_link_type annotations across downstream phenotype
    edges.

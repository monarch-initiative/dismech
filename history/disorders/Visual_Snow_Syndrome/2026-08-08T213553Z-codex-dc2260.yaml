  summary: 'Review: Visual Snow Syndrome evidence and causal model'
  details: |
    Completed an independent evidence, completeness, ontology, and causal-graph
    review of Visual Snow Syndrome. Replaced the prior broad hyperexcitability
    and thalamocortical assertions with five atomic mechanism nodes and three
    explicitly emerging hypothesis groups. Preserved the published disagreement
    between increased gamma/reduced alpha-gamma coupling in the 2022 MEG study
    and intact average V1 excitation-inhibition measures with enhanced
    repetition-related plasticity in the 2025 MEG study. Added source-backed
    prevalence, chronic progression, clinical burden, neuropsychiatric
    associations, environmental exacerbators, functional imaging, diagnostic
    criteria, secondary-cause exclusions, differential diagnoses, and
    conservative treatment evidence. Removed overconfident benzodiazepine and
    generic CBT efficacy claims; retained lamotrigine, chromatic filters, and
    MBCT-vision with study-design limitations.

    Follow-up changes requested during formal review restored the source-backed
    FDG-PET finding as right lingual-gyrus hypermetabolism, mapped to
    UBERON:0002943, while keeping it anatomically distinct from the V1
    response-dynamics finding. Both documented environmental exacerbators now
    connect to Persistent Positive Visual Perception with explicit EXACERBATES
    edges, and the lighting claim is limited to the observed comparison of
    indoor and fluorescent lighting with natural outdoor lighting. MBCT-vision
    is grounded to NCIT:C64345 (Cognitive Behavior Therapy), the Photopsia
    evidence now includes the source's greater-than-33% frequency clause, and
    Tinnitus has an additional source-backed approximately-63% estimate.
    Treatment-modality tags were completed, and review notes now record the
    conservative benzodiazepine exclusion and absent HPO term for Visual Snow.

    Consumed all matching research artifacts and checked the manual source list
    against primary PubMed records. Disease-to-Phenotype suggestions were
    triaged rather than imported mechanically: independently supported migraine,
    anxiety, depression, sleep disturbance, depersonalization, and derealization
    were added, while nonspecific or insufficiently supported candidates were
    rejected. Those associations remain deliberately outside the causal graph
    because directionality is unknown. No unsupported gene, inheritance,
    animal-model, dataset, or interventional-trial assertion was added.

    Validation passed with 73 of 73 exact snippets, 94.8% weighted compliance,
    all eight core sensory phenotypes connected, no graph-integrity errors,
    successful isolated HTML rendering, and 15 initial plus 8 follow-up targeted
    graph, discussion, and render tests.

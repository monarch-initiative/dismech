  summary: Create the ANK2-related complex neurodevelopmental disorder record
  details: |
    Created a dedicated MONDO:0100038 entry for the definitive autosomal
    dominant ANK2 loss-of-function neurodevelopmental relationship. Modeled
    general ANK2 haploinsufficiency and giant-ankyrin-B axon branching as
    parallel, non-serial hypotheses; qualified cellular-to-clinical edges as
    indirect where causal intermediates remain unknown. Added evidence-backed
    intellectual disability, autistic behavior, and epilepsy phenotypes without
    unsupported frequencies, distinguished de novo complex neurodevelopmental
    disorder from a separate familial epilepsy-only allelic presentation, and
    added early exome/genome sequencing guidance. Three new reference caches were
    generated only with just fetch-reference. Schema, ontology-term,
    exact-reference, graph-integrity, connectivity, and compliance checks passed.

  summary: Unbind over-broad MONDO anchor; record it as a broad match
  details: |
    Anchor repair for issue #12238 (d2g series-031). The entry bound MONDO:0100038 complex neurodevelopmental disorder as its disease_term, which asserted identity with a grouping class whose sixteen direct children are other gene-defined disorders. That over-broad anchor is why ten unrelated diseases appeared under this entry in the Monarch-KG gene coverage comparison. Synonym-inclusive OLS searches of MONDO for ANK2 and for ankyrin return no class denoting the neurodevelopmental phenotype, so disease_term now carries the free-text preferred term ANK2-related complex neurodevelopmental disorder with no binding, following the remedy in issue #12184, and the grouping class is recorded in mappings.mondo_mappings as a skos:broadMatch so it stays in the curation queue. Updated notes with the disposition of each of the ten listed diseases: five are curated elsewhere in dismech and five (DEAF1, NACC1, MYH10, EMC1, GRIA2) have no entry and would need their own rather than a subtype row here. No genetics gap was found: ANK2 (hgnc:493) was already bound and already reaches three pathophysiology nodes. No evidence was added or removed.

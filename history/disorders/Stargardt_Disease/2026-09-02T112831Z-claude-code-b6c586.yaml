  details: |
    Reviewed kb/hypotheses/Stargardt_Disease/canonical_abca4_lipofuscin_retinal_degeneration_model/openscientist.md and wrote the assessment sidecar openscientist-assessment-by-claude-opus-5.yaml (verdict SUPPORTED, 14 claims: 8 RETAINED, 6 QUALIFIED). Integrated the RETAINED and QUALIFIED claims that were absent from the entry. Added the pathophysiology node 'Direct all-trans-retinal photoreceptor toxicity' (ferroptosis GO:0097707) with an upstream edge from the retinoid-adduct node and a downstream edge to macular photoreceptor degeneration (PMID:33334878). Added the environmental entry 'Retinal light exposure' bound to ECTO:0000007 with an EXACERBATES influences_mechanisms link to that node (PMID:33334878, PMID:26225634); EXACERBATES rather than TRIGGERS because the necessity claim is mouse-only. Added two discussions: a HUMAN_MODEL_MISMATCH on the Abca4(PV/PV) knock-in sufficiency paradox (PMID:25712131) and a KNOWLEDGE_GAP on the absence of human light-exposure epidemiology. Added evidence to existing nodes: cryo-EM substrate transport (PMID:34625547), Abca4 knockout mouse biochemistry (PMID:10412977), remofuscin lipofuscin removal rescue (PMID:35219849 SUPPORT) and the PV paradox (PMID:25712131 REFUTE), the optical-gap ordering counter-observation (PMID:25301883 REFUTE), and quantitative autofluorescence on the Lipofuscin biomarker (PMID:32891696). Added ABCA4 genetic evidence for the cis-acting modifier c.769-784C>T (PMID:33909047), second-allele progression effects (PMID:41677386), and the null-allele severity decade (PMID:29642238), and rewrote the notes sentence that called p.Gly1961Glu simply milder. Added REFUTE items to the gene-therapy and stem-cell target_mechanisms links (PMID:35248547, PMID:29884405), which previously carried only optimistic review-level evidence. Sourced hypothesis qualification 4 with PMID:37385300 (graded OTHER, review-level restatement). Left out: status remains CANONICAL as the report recommends; no protein-misfolding node, because the report's lead citation PMID:25712131 reports normal cellular localization and so contradicts its own ER-retention claim; the GSDME pyroptosis, NLRP3, ER-stress and ferritinophagy limbs were not source-checked and are recorded in the new node's notes as outstanding; the seed's CTNS/CEP290 and emisindiprost errors were already corrected in the entry. Verified with count-verified-snippets 149/149, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-environmental-evidence, check-folded-hyphens.

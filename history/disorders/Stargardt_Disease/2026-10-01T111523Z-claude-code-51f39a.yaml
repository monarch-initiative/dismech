  summary: 'Genetics pass: add the RDH8 STGD5 row, bind STGD3/STGD4, wire ELOVL4'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The series row MONDO:0980722 Stargardt disease 5 is curated as a new has_subtypes row with RDH8 bound. The subtype is late-onset relative to the rest of the entry, the evidence base is a single consanguineous Italian family, and the row says so rather than implying an established allelic series. Three existing subtype rows carried neither a MONDO term nor a gene and now carry both where one exists: STGD3 to MONDO:0010819 with ELOVL4, STGD4 to MONDO:0011370 with PROM1, and the STGD1 row gains ABCA4 plus a review_notes field explaining why no subtype_term is bound there - MONDO:0019353, this entry's own disease_term, opens its definition "Stargardt disease, also known as Stargardt 1 (STGD1)", so binding it on that row would assert the entry is a subtype of itself. A new MOLECULAR node, Impaired ELOVL4 Very-Long-Chain Fatty Acid Elongation, carries GO:0009922 fatty acid elongase activity DECREASED and wires ELOVL4 into the pathograph; genes wired 1/3 to 2/3. Its single downstream edge is marked INDIRECT and states that the ELOVL4 route converges with the ABCA4 route only at photoreceptor degeneration and does not pass through the retinoid-adduct or RPE lipofuscin steps. PROM1 stays unwired because prominin-1 has no molecular function the entry's sources state, and RDH8 is bound on its subtype row only, for the reason given in that row's review_notes. Six of fifteen phenotypes remain without an incoming causal edge; that is unchanged by this pass and is reported rather than papered over. Validation on the committed tree: just validate 0 issues, validate-terms passed, 163/163 snippets verified.

    Self-review round, same session: the STGD5 row's clinical description had been written from the OMIM/MedGen summary of the founding paper rather than from a citation in this entry, so it asserted onset in the fifth decade, mildly reduced acuity and normal electroretinographic amplitudes with nothing in the entry supporting them. Re-read the paper: all three are in it, so the description was rewritten to the paper's own figures (early signs of maculopathy at 40 years, acuity 20/25, evaluation at 62) and two evidence items were added quoting it. The ELOVL4 node's molecular-function evidence was also moved off PMID:20633576, whose relevant sentence already carries two different evidence_source values in this file and so could not take a third occurrence; it now cites PMID:38342437, which states the enzyme's identity in its own abstract and adds a measured very-long-chain PUFA deficit in the knockout. Snippets after the round: 166/166.

    Also added a review_notes field on the STGD4 row recording why PROM1 is bound there and in the genetic section but not wired to a mechanism node: prominin-1 is a photoreceptor disc membrane protein with no molecular function the sources cited in this entry state.

    Review round 1 (PR #13315): recorded why no functional_impact_category is asserted for the ELOVL4 allele on the STGD3 row. The review this entry already cites states that the dominant trait "can arise either as a result of haploinsufficiency of ELOVL4 or a dominant negative effect of the mutant protein", so the source names two candidate mechanisms without choosing between them; that sentence is now an evidence item on the row and the review_notes explains that the activity-level claim is separable and is made on the pathophysiology node instead. Snippets after the round: 167/167.

    Review round 2 (PR #13315): the round-1 review_notes on the STGD3 row said PMID:20633576 leaves the ELOVL4 allele mechanism open. It does not, and the review was right to call that out. The sentence I quoted frames the question; the rest of the same paragraph answers it - heterozygous Elovl4 knockout mice have normal retinae, which rules haploinsufficiency out, and co-expression experiments show mutant ELOVL4, which lacks the C-terminal di-lysine endoplasmic-reticulum retention motif, dragging wild-type protein into aggresome-like inclusions. So the mechanism is asserted: functional_impact_category DOMINANT_NEGATIVE in a genetic_context block on the ELOVL4 pathophysiology node, with both resolving sentences cited on the node as MODEL_ORGANISM and IN_VITRO and a description recording that no human functional study supports it and that the source hedges the enzymatic consequence. The row's review_notes now says where the mechanism is recorded and why it is not on the row itself: Subtype has no genetic_context slot. The two evidence items were first written inside the genetic_context block, which GeneticContext does not accept, and moved to the node's own evidence list. Snippets after the round: 169/169.

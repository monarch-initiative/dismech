  summary: 'Genetics pass: add the RDH8 STGD5 row, bind STGD3/STGD4, wire ELOVL4'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The series row MONDO:0980722 Stargardt disease 5 is curated as a new has_subtypes row with RDH8 bound. The subtype is late-onset relative to the rest of the entry, the evidence base is a single consanguineous Italian family, and the row says so rather than implying an established allelic series. Three existing subtype rows carried neither a MONDO term nor a gene and now carry both where one exists: STGD3 to MONDO:0010819 with ELOVL4, STGD4 to MONDO:0011370 with PROM1, and the STGD1 row gains ABCA4 plus a review_notes field explaining why no subtype_term is bound there - MONDO:0019353, this entry's own disease_term, opens its definition "Stargardt disease, also known as Stargardt 1 (STGD1)", so binding it on that row would assert the entry is a subtype of itself. A new MOLECULAR node, Impaired ELOVL4 Very-Long-Chain Fatty Acid Elongation, carries GO:0009922 fatty acid elongase activity DECREASED and wires ELOVL4 into the pathograph; genes wired 1/3 to 2/3. Its single downstream edge is marked INDIRECT and states that the ELOVL4 route converges with the ABCA4 route only at photoreceptor degeneration and does not pass through the retinoid-adduct or RPE lipofuscin steps. PROM1 stays unwired because prominin-1 has no molecular function the entry's sources state, and RDH8 is bound on its subtype row only, for the reason given in that row's review_notes. Six of fifteen phenotypes remain without an incoming causal edge; that is unchanged by this pass and is reported rather than papered over. Validation on the committed tree: just validate 0 issues, validate-terms passed, 163/163 snippets verified.

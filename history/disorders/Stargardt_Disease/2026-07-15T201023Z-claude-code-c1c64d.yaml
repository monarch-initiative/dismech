  summary: 'ABCA4 expansion: add CORD3 and RP19 as additional subtypes'
  details: |
    Closes the 'ABCA4 expansion' item tracked on issue #4008: the maintainer's lumping/splitting guidance recommended making Stargardt_Disease.yaml the canonical ABCA4-related-retinopathy (MONDO:0800406) entry and adding ABCA4-related cone-rod dystrophy as an additional subtype 'if desired'. PR #5688 previously added only the MONDO:0800406 broadMatch cross-reference; this PR completes the expansion. Added two new has_subtypes entries for MONDO:0800406's other two direct MONDO children: ABCA4-Related Cone-Rod Dystrophy (CORD3, MONDO:0011395) and ABCA4-Related Retinitis Pigmentosa (RP19, MONDO:0011137), each with subtype_term bindings, subtype_frequency (~5% and ~32% respectively, from a 37-patient Taiwanese ABCA4 cohort), and evidence from 3 verified sources: the landmark 1998 Cremers et al. family study (PMID:9466990) showing the same ABCA4 locus causes STGD/CRD/RP segregating with allele severity (null > partial-function > missense); a 2020 Taiwanese cohort (PMID:33261146) quantifying phenotype distribution and linking severe/null genotypes to more extensive arRP/dispersed-STGD1 phenotypes; and a 2023 JAMA Ophthalmology genotype-severity study (PMID:37498587) describing the spectrum from late-onset macular dystrophy to extensive cone-rod degeneration. Also added a supporting evidence item (PMID:38309476, 460-patient Iowa natural-history cohort) to the existing ABCA4 genetic-section severity note. Checked but did NOT add MONDO:0009549 (severe early-childhood-onset retinal dystrophy, SECORD) as a subtype -- OAK confirms it is_a Stargardt disease itself (synonym 'STGD1'), i.e. already subsumed by the existing STGD1 subtype rather than a distinct entity. Updated the mapping_justification on the existing MONDO:0800406 broadMatch to note the two new subtypes. Schema, term (after adding both new MONDO IDs to the DiseaseOrSubtypeTerm enum cache via scripts/refresh_disease_enum_cache.py), reference, and causal-graph validation all pass. Full test suite (1588 tests) passes.

  summary: Wire vision entries to new retinal mechanism modules
  details: |
    Part of a conformance-wiring pass across the Mendelian vision entries following creation of the phototransduction_cascade_dysfunction, retinoid_visual_cycle_disruption and anterior_segment_dysgenesis modules. Stargardt declares conformance from four nodes to retinoid_visual_cycle_disruption, entering through the retinoid CLEARANCE arm; it is deliberately NOT wired to photoreceptor_degeneration, whose chain is rod-first retinitis pigmentosa rather than cone-first macular dystrophy. The same pass wired Achromatopsia, Blue_Cone_Monochromacy, GUCY2D, PDE6A and RHO to the phototransduction module; RPE65 and RDH5 to the visual cycle module (supply arm); and Axenfeld-Rieger, Peters_Plus and Congenital_Glaucoma to anterior_segment_dysgenesis. 27 conforms_to edges in total. Validated: linkml-validate clean on all eleven files; the conforms_to foreign-key test passes.

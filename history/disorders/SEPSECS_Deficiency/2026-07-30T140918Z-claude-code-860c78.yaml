  details: |
    Re-audit for dismech#3691 (entries lacking a top-level disease_term). The entry notes previously asserted that no exact local MONDO term was resolvable; that was stale. MONDO:0013438 (pontocerebellar hypoplasia type 2D) carries xref OMIM:613811 - the entry's own WP-079 seed record - and is defined by MONDO as any non-syndromic pontocerebellar hypoplasia in which the cause of the disease is a mutation in the SEPSECS gene, i.e. the same gene-anchored entity. Added the top-level disease_term with preferred_term SEPSECS deficiency (mechanism-first wording retained) and term MONDO:0013438, and rewrote the stale note. Verified with runoak -i sqlite:obo:mondo info MONDO:0013438 -O obo. Validated with just validate and just validate-terms, both passing. No evidence, phenotype, or pathophysiology content changed.

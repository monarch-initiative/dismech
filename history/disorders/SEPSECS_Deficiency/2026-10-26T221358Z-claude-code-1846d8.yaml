  details: |
    Responded to the 2026-10-24 review. Trimmed the rehabilitation treatment to the referral for rehabilitation training that its only source (DOI:10.3389/fped.2021.805575) reports, removing the seizure-management claim, and set therapeutic_modality to BEHAVIORAL. Removed GO:0051402 neuron apoptotic process and the glial cell type from the cerebellocerebral injury node, since no cited source reports neuronal death or glial involvement. Reworded the Spasticity edge so it no longer claims upper motor neuron pathology. Removed the duplicated O-phosphoseryl-tRNA(Sec) selenium transferase activity from the Selenoprotein generation failure node. Added Cerebral atrophy (HP:0002059, wired from the cerebellocerebral injury node), Seizure (HP:0001250), Increased circulating lactate concentration (HP:0002151), Visual impairment (HP:0000505) and Myopathy (HP:0003198), each quoting the full-text case report's restatement of prior human reports (quote_role BACKGROUND). The lactate, visual and myopathy phenotypes are left without causal edges because the source attributes them only to unspecified mitochondrial deficiency; Seizure is also left unwired. Corrected the earlier record, which listed a mechanistic_category classification that was not added, and linked the PR.

  summary: 'Create: Sturge-Weber Syndrome'
  details: |
    De-novo curation of Sturge-Weber syndrome (somatic GNAQ p.Arg183Gln neurocutaneous disorder) using claude_code deep research. Granular unbundled pathophysiology chain: somatic GNAQ mutation -> constitutive Gq signaling -> leptomeningeal capillary-venous malformation -> impaired cortical venous drainage/hypoperfusion -> progressive cortical injury -> neuronal hyperexcitability (conforms epilepsy module) -> seizures (conforms) + neurological deficits. Evidence anchored on Shirley 2013 NEJM (PMID:23656586, GNAQ discovery + developmental-timing model + birth prevalence) and Jagtap 2013 cohort (PMID:22832777, seizures/glaucoma/cognitive outcome). Three KNOWLEDGE_GAP discussions: mutation-timing/phenotype-extent, presymptomatic treatment/neuro outcome, GNAQ-pathway-targeted therapy. All snippets verified as exact substrings; schema + term validation pass.

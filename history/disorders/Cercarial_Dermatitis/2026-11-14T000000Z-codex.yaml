  summary: 'Create: Cercarial Dermatitis'
  details: |
    Created a standalone infectious-disease entry for Cercarial Dermatitis [MONDO:0001260]. The curation separates swimmer's itch from the immediate cercarial skin phase of human Schistosoma infection in Schistosomiasis.yaml: this entry covers dead-end human skin invasion by avian and non-human mammalian schistosomes in the family Schistosomatidae. It records the gastropod-intermediate and avian/non-human-mammalian-definitive host cycle, the aquatic cercarial penetration route, acute allergic cutaneous inflammation with pruritic papules or maculopapules, the stronger re-exposure response, and symptomatic antihistamine or mild corticosteroid care, supported by cached PMID:25567226, PMID:35631108, and PMID:30302587.
    The local adversarial pass filed and fixed three issues before PR: it added
    the normal egg-producing adult definitive-host phase to the agent life
    cycle, weakened optional antihistamine and mild corticosteroid therapy so
    the entry does not overstate the source's "may be considered" language, and
    rephrased the primary-papule duration around cercarial penetration rather
    than established human infection.

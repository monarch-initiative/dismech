    summary: Thorough completeness review and enhancement of Glycogen_Storage_Disease_Type_VII.
    details: >-
      Added classifications (Harrison's chapters and ICIMD glycolysis/glycogen_metabolism
      nosology), the four clinical subtypes (Classic myopathic, Late-onset myopathic,
      Isolated hemolytic, Fatal infantile), a Polyglucosan Storage in Skeletal Muscle
      pathophysiology node driven by D-glucose 6-phosphate (CHEBI:14314) accumulation
      upstream of PFKM and linked to fixed muscle weakness, behavioral/dietary
      treatments including avoidance of pre-exercise carbohydrate ("out-of-wind"
      phenomenon), titrated exercise/rhabdomyolysis prevention, and dietary protein
      intake, Ashkenazi Jewish founder alleles in genetic notes, muscle biopsy
      histopathology (subsarcolemmal/intermyofibrillar glycogen and diastase-resistant
      polyglucosan bodies), differential_diagnoses (McArdle disease and distal
      muscle glycolytic enzymopathies), and an open knowledge-gap discussion on the
      unresolved genetic basis of the fatal infantile subtype.

  summary: Thorough completeness review and enhancement of Glycogen_Storage_Disease_Type_VII.
  details: Reviewed and enhanced Glycogen_Storage_Disease_Type_VII against cached GSD VII literature (PMID:18421897,
    PMID:22106711, PMID:30397902, PMID:27303362, PMID:32117019, PMID:39156960, PMID:26278982, PMID:6227635,
    PMID:22995305, ORPHA:371; the Asta deep-research report retrieved 18 papers on other glycogenoses
    and contained no GSD VII-specific literature). Added classifications (Harrison's chapters and ICIMD
    glycolysis/glycogen_metabolism nosology), the four clinical subtypes (Classic myopathic, Late-onset
    myopathic, Isolated hemolytic, Fatal infantile, including a REFUTE evidence item on Fatal infantile
    from PMID:22106711 noting it lacks PFKM mutations and appears to be a separate entity), a Polyglucosan
    Storage in Skeletal Muscle pathophysiology node (GO:0005978 glycogen biosynthetic process INCREASED)
    driven by elevated GYS1-to-GBE1 activity ratio downstream of D-glucose 6-phosphate accumulation and
    linked to fixed muscle weakness, Gout (HP:0001997) connected downstream of Pentose phosphate rerouting
    and exercise nitrogen catabolism, behavioral/dietary treatments including avoidance of pre-exercise
    carbohydrate ("out-of-wind" phenomenon, noting the PFKM enzymatic block itself is unchanged while
    avoiding insulin-mediated suppression of lipolysis and FFA mobilization), titrated exercise/rhabdomyolysis
    prevention, and adequate dietary protein intake (>=1.2 g/kg/day), Ashkenazi Jewish founder alleles
    in genetic notes, muscle biopsy histopathology (subsarcolemmal/intermyofibrillar glycogen and diastase-resistant
    polyglucosan bodies), differential_diagnoses (McArdle disease and distal muscle glycolytic enzymopathies
    including PGK1 and PGAM2 deficiencies), the Pfkm-null mouse animal_models entry with modeled_mechanisms
    targeting PFKM Molecular Function Deficiency, and an open knowledge-gap discussion on the unresolved
    genetic basis of the fatal infantile subtype.

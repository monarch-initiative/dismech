  summary: Prevalence band correction found by cross-entry sweep
  details: |
    Prevalence band correction, found by sweeping rather than by review. The re-review of the sibling PR #9206 flagged a prevalence_class that contradicted its own rate_per_100000. Because that is a class of error rather than a typo, every prevalence record across this session's three neurological entries was re-checked programmatically against the bucketing function in scripts/migrate_prevalence.py. This entry held a second instance the review had not flagged: rate_per_100000 of 230.0 carrying BAND_1_5_PER_10000, where 230 per 100,000 buckets to ABOVE_1_IN_1000. Corrected.

    The rate itself is unchanged and its interpretation is unchanged - it remains the 0.23% incidence of ODS among adults hospitalised with hyponatremia, an exposed-population rate rather than a population prevalence, which the population field and notes already state. Only the coarse band was wrong. Nothing in the repository gates on band/rate agreement, so this needed catching by eye or by sweep.

    All six prevalence records across the three entries now agree with their own rates.

    Validation: just validate clean; just validate-terms clean; 27/27 evidence snippets verified against the local reference cache; check-duplicate-keys clean.

  summary: 'Create: Osmotic Demyelination Syndrome'
  details: |
    New entry for osmotic demyelination syndrome (MONDO:0006692, MONDO label 'central pontine myelinolysis'), demyelination of the pons and extrapontine sites following correction of chronic hyponatremia.

    The mechanism turns on one asymmetry, and the entry is built on the sentence that states it: reuptake of organic osmolytes after correction is SLOWER than their loss during adaptation. The brain survives chronic hyponatremia by exporting osmolytes; correcting faster than they return leaves the same adapted cells osmotically stressed. So the protective adaptation and the vulnerability are the same fact seen from two sides, which is why the protective step is curated as its own node rather than as background.

    Curated the iatrogenic claim at the strength the evidence supports and no higher. The 2025 meta-analysis (11 cohorts, 26,710 patients) gives OR 3.16 (95% CI 1.54-6.49) for rapid correction - but the overall incidence is 0.23%, the rapid-correction incidence 0.73%, the non-rapid 0.10%, and the same paper states that some patients developed ODS WITHOUT rapid correction. Rapid correction is therefore neither necessary nor sufficient, and that qualification is curated as a PARTIAL evidence item on the environmental entry rather than left in prose. A KNOWLEDGE_GAP attaches to both the mechanism node and the exposure, because rate limits are the entire preventive strategy and a patient who develops ODS inside the limit is unexplained by the model that sets it.

    The relowering rescue treatment is a SINGLE CASE REPORT and the entry says so explicitly. One patient not developing a syndrome whose background rate is under one percent cannot demonstrate prevention; the evidence item is PARTIAL and the description states the n.

    Named 'Osmotic Demyelination Syndrome' rather than MONDO's 'central pontine myelinolysis' because the cited review uses the umbrella term explicitly embracing both CPM and extrapontine myelinosis, and the extrapontine form is the same lesion in a different place. MONDO label preserved verbatim in term.label; umbrella name in preferred_term.

    GeneReviews: a search for 'myelinolysis GeneReviews[All Fields]' returns one hit, PMID:20301384 - which is Charcot-Marie-Tooth Neuropathy Type 1, a different disease that merely mentions myelin, and is additionally marked RETIRED CHAPTER. Read rather than assumed; not cited. An All Fields hit is not the same as a chapter existing.

    Two snippets quoting the review end mid-word at 'movement d'. That is where the cached abstract itself is truncated, not a transcription error, and the notes say so.

    Deep research: claude_code provider. The report resolved 4/4 references with confabulation_rate 0.0 - but only four references, and the relevance pass assessed all four and scored none on topic (undecided band, not an off-topic flag). A four-reference report is thin; nothing from it is cited. Reference set assembled independently by direct PubMed search.

    Validation: just validate passed with 16/16 snippets verified on the first attempt, just validate-terms passed, all six offline gates clean, pathograph 4 nodes / 3 edges / 1 component with all treatment and environmental targets resolving.

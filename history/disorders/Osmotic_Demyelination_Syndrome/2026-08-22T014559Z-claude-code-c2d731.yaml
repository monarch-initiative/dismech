  summary: Fix prose that inherited the truncated quote
  details: |
    Residual of the truncated-snippet finding, in prose rather than in a snippet.

    The four evidence snippets that ended mid-word at "movement d" were extended in the previous commit, but the description of the Biphasic Neurological Deterioration node had been written from the truncated read and inherited its error. It said the second phase presents "with pontine dysfunction, impaired vigilance and movement disorder" - singular, and stopping where the truncated quote stopped. The source says "movement disorders, among other neurological abnormalities", so the entry was implicitly presenting a non-exhaustive list as exhaustive. The description now reflects the full sentence and states that the list is not exhaustive, which also explains why the curated phenotypes are the recurrent ones rather than the full range.

    This is the part of a truncated quote that no gate can reach. A snippet is checked against the cache; prose derived from a snippet is not checked against anything, so a truncation that has been corrected in the quote can survive in the sentence a curator wrote from it.

    Because of that, a generic check was run across all three neurological entries in this session rather than only this one: every evidence snippet was located in its cached reference and the characters immediately before and after the match were tested for word characters, which detects any quote that begins or ends mid-word. Zero findings across the three entries, so this was the only remaining instance.

    Validation: just validate clean; 27/27 evidence snippets verified against the local reference cache.

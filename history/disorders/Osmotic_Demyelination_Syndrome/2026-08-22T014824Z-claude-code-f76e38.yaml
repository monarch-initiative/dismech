  summary: Remove the third and final site of the false truncation claim
  details: |
    Third and final site of the same false claim, caught by the reviewer.

    The claim that the cached PMID:31587708 abstract was truncated mid-word appeared in three places, and each round of fixing removed only the surface I had searched for. The first commit extended the four snippets and deleted the notes paragraph, after grepping for "movement d". The second fixed a node description that had been written from the truncated read, after grepping for "movement". Neither search would find the third site, because it does not contain the word "movement" at all: an explanation field reading "The quote stops where the cached abstract is truncated mid-word."

    That left the entry asserting and retracting the same statement about the same source 375 lines apart, and the assertion validated cleanly because an explanation is free text that no gate reads. The explanation now describes what the quote actually is, including that it carries the source's own "among other neurological abnormalities" qualifier.

    The methodological point is worth recording because it is the second time this session that a generic check missed a residual it looked adjacent to. Last commit added a check for snippets that begin or end mid-word, which was correct and found nothing - but a snippet boundary and a claim about a snippet boundary are different objects, and only the first was being checked. The right generic search for this defect class is the claim itself, not its subject: a case-insensitive sweep for truncat, mid-word, cut off, garbled, "stops where", "no abstract", and similar assertions of a source defect, run across every entry rather than the one under review. That sweep was run across all three neurological entries in this session and now returns only the correction paragraph in this file, which is the one place the words should appear.

    Validation: just validate clean; 27/27 evidence snippets verified against the local reference cache; check-duplicate-keys and check-folded-hyphens clean.

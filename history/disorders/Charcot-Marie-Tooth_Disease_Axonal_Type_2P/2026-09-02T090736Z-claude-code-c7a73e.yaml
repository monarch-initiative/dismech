  summary: 'Review round 1: pain term rebinding, pain management, GeneReviews references,
    graph connectivity'
  details: |
    Response to the automated review on PR #10508 (three blocking items, eight suggestions). All three blocking items addressed; five suggestions taken.

    1. The Neuropathic Pain phenotype was bound to HP:0009830 Peripheral neuropathy, which does not mean pain and restates the diagnosis every other phenotype is a manifestation of. The stated rationale was wrong: the quoted snippet says 'adult-onset axonal and painful neuropathy', which does support a pain claim. Rebound to HP:0012531 Pain with preferred_term neuropathic pain, verified as a PhenotypeTerm enum member. HP:6000040 Neuropathic pain is not one.

    2. Added a Neuropathic Pain Management treatment. The reviewer's suggested source, PMID:40014417, turned out not to carry the quote - its abstract says symptomatic management is the only option but names no agents. Three sources at three scopes are used instead, each graded INDIRECT with its scope stated in the explanation: PMID:20301462, the CMT2 GeneReviews chapter, for symptomatic treatment of pain (correct scope, no agents); PMID:36793224, a CMT patient cohort, for the pain burden; PMID:20301684, the MFN2 CMT2 GeneReviews chapter, as the only cached source naming agent classes. The last is a different CMT2 subtype and the explanation says so explicitly - it is cited because the recommendation is generic symptomatic management of neuropathic pain in axonal CMT with nothing MFN2-specific in it, not because MFN2 disease is a proxy for CMT2P.

    3. Added a top-level references: block tagging PMID:20301532 (CMT Hereditary Neuropathy Overview) and PMID:20301462 (CMT Neuropathy Type 2) as GeneReviews. Both were already in references_cache from main; neither is used for snippet evidence beyond the pain item, since the Overview cache is a purpose statement only.

    Suggestions taken: the parkinsonism branch was a disconnected graph component and is now a downstream edge from the ubiquitylation-failure node, gated on the EMERGING hypothesis group; PMID:40721190 fetched and cited twice on the nigral node, which supplies the citation the phrase 'scattered later cases' previously lacked and reports DaT-SPECT evidence of presynaptic dopaminergic loss (and raises the count to seven descriptions); Foot Drop (HP:0009027) and Gait Disturbance (HP:0002317) added and wired into the pathograph, both quotable from a source already cited four times; the HYPOTHESIZED/HYPOTHETICAL prose mismatch corrected; PMID:40636623 regraded to OTHER on both its uses so one paper does not carry two study-type readings.

    Not taken: modifier genes (RAB7A interaction, gender), progression: and clinical_burden:, and target_mechanisms on treatments. All are reasonable but none is blocking, and the first rests on a single family's proposal.

    Validation: 54/54 snippets verified, up from 47. All gates pass including check-snippet-grading after the regrade.

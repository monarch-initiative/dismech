  summary: Review CMT2P allele mechanisms, clinical evidence and experimental
    models
  details: |
    Reviewed the full existing entry, retained openscientist report and citation report, and disease-specific cached sources. Research preflight passed for LRSAM1 / MONDO:0013753; erroneous research ontology suggestions were not reused. No prior REVIEW event or overlapping open PR was present.

    Corrected the universal truncated-protein/NMD explanation: dominant alleles include missense, in-frame and elongating frameshift variants; p.Leu708Argfs*28 lengthens the protein. The original recessive study demonstrated abnormal splicing and absent immunoreactivity, with similar qualitative RNA abundance and an explicit antibody-recognition alternative to degradation. Endosomal sorting remains hypothetical. Added Cys694Arg FUS/G3BP1 interaction and nuclear RNA-binding-protein findings, and 2026 mutant-protein/TSG101/PLIN2 localization results, preserving cell provenance, nonsignificant quantitative comparisons, artificial C675A membrane-assay context, and unchanged gross lipid content. Restored motor-specific mouse challenge limitations and the zebrafish and NSC34 models.

    Replaced generic phenotype evidence with direct LRSAM1 clinical findings; added sensory ataxia, vibration loss, hammer toes, cramps and CK elevation. Corrected the largest-series claim using the 72-patient/eight-family French study, without generalizing cohort proportions. Expanded allele classes/founder evidence, acknowledged early onset and variable penetrance, and separated parkinsonism association from established disease causality. Mined current CMT GeneReviews full text for rehabilitation, orthoses, surgery, pain treatment, diagnostic interpretation and family-specific counseling; removed retired/MFN2-specific treatment proxies. Levodopa evidence concerns co-occurring parkinsonism only.

    Full cached text read: PMIDs 20865121, 22012984, 23245322, 23519028, 26900582, 27462242, 27615052, 33568173 and 42799012. Sanctioned fetch upgraded 23519028 to full text and retrieved the new full-text sources. PMIDs 27686364, 28335037 and 33414056 remained abstract-only after refresh; 38330802 yielded an abstract. PMID30996334 supplied an abstract; PMC full-text URL served a challenge and Europe PMC URL returned 403. No full-text-only denominator from that paper was inferred. Supplements and figure images were not separately inspected. The RAB7A/CMT2B LRSAM1 modifier paper was read and excluded as CMT2P evidence.

    Research checklist: phenotype gaps repaired; AD/AR allelic scope and CMT2G synonym adequate; mechanistic omissions repaired; general symptomatic treatments covered, no verified LRSAM1 trial surfaced; genetic allele/penetrance depth improved; electrophysiology and MRI covered; relevant cached references consumed; remaining PMP22 longevity, non-LRSAM1 therapies, general hip dysplasia and other-disease modifier leads excluded. Existing research was materially under-consumed before this review.

    Ontology inspection confirmed HP:6000040 is a pain characteristic; live field validation rejects it outside the PhenotypeTerm ancestor closure. Retained HP:0012531 Pain with Neuropathic pain as preferred_term. Added terms were checked with OAK/OLS, not enum snapshot membership. Schema, term and reference validation passed on the revised clinical content, with 85/85 cached quotations verified; final prepublication checks are recorded in the PR.

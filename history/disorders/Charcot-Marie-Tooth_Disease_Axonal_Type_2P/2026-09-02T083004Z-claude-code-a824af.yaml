  summary: 'Create: Charcot-Marie-Tooth Disease Axonal Type 2P (MONDO:0013753, LRSAM1)'
  details: |
    De-novo curation of CMT2P (MONDO:0013753), the LRSAM1-associated axonal hereditary motor and sensory neuropathy.

    Deep research: one openscientist run (research/Charcot-Marie-Tooth_Disease_Axonal_Type_2P-deep-research-openscientist.md, 20/20 citations resolved, 2/2 quotes valid, confabulation_rate 0.0). Its term validation set needs_review, and the flagged bindings mattered: it proposed MONDO:0013749 for CMT2P, which resolves and is ventricular septal defect 3, and it offered NCIT:C15224 for pain management (actually Nutrition Research, Fats) and NCIT:C15633 for genetic counseling (actually Cancer Pain Management). None were used; the correct MONDO came from the stub and the treatment terms were selected from the cache. This is recorded in the entry notes as a worked case of clean citations coexisting with wrong ontology bindings. just preflight-dr PASSed against MONDO:0013753 with LRSAM1 mentioned 54 times.

    Curation decisions: dominant and recessive CMT2P are curated as one disease with two inheritance blocks and two upstream pathophysiology nodes converging on a shared ubiquitylation-failure node, because the difference is a property of the allele (whether a 3-prime premature termination codon escapes nonsense-mediated decay) rather than of the disease. The TSG101/ESCRT step carries mechanism_confidence: HYPOTHETICAL and two NO_EVIDENCE items, because the LRSAM1 localisation result and the unchanged TSG101 levels in patient cells both bear on it without supporting it. The parkinsonism association is curated in its own EMERGING hypothesis group and a HYPOTHESIZED node so the peripheral mechanism does not inherit its uncertainty. The mouse model carries one PARTIALLY_RECAPITULATES link and one FAILS_TO_RECAPITULATE link with its own evidence and limitations. HP:0001315 Reduced tendon reflexes was chosen over HP:0001284 Areflexia deliberately; the report wrote areflexia against HP:0001265, which HPO calls Hyporeflexia.

    Validation: just validate-disorders, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all pass. 47/47 snippets verified against cached references.

  details: |
    Re-reviewed the human OPLAH literature through 2026-07-16 and reframed the entry around the established autosomal-recessive biochemical trait: reduced 5-oxoprolinase function and persistent 5-oxoprolinuria. Removed unsupported clinical causal edges and frequency claims; retained selected clinical and imaging observations as explicitly uncertain, with nonsegregation counterevidence. Added structured diagnosis, inherited/acquired/secondary differentials, conservative management, genetic counseling, and an open clinical-causality controversy linked to issue #6615. Added or regenerated source caches only through just fetch-reference. Validation passed for schema, ontology terms, evidence snippets, per-file causal graph, touched-cache frontmatter, reference closure, duplicate node names, and diff whitespace.

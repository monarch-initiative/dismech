  summary: 'Create: Chromosome 17q12 Deletion Syndrome'
  details: |
    De novo curation of chromosome 17q12 deletion syndrome (MONDO:0013797) as a Disease entry rather than a has_subtypes line on HNF1B disease. The argument for a separate entry is asymmetric: the renal and pancreatic phenotype is HNF1B haploinsufficiency and is shared with HNF1B point mutations, while the neurodevelopmental and psychiatric phenotype is not, and the primary report concludes the syndrome is a contiguous gene syndrome extending beyond renal cysts and diabetes.

    GeneReviews baseline: PMID:27929632 (17q12 Recurrent Deletion Syndrome), fetched, cached and tagged GeneReviews in the top-level references block. All Clinical Characteristics features were cross-referenced into phenotypes, and the agents-to-avoid section is curated as two treatment records (transplant immunosuppression avoiding tacrolimus and mTOR inhibitors; lithium and antipsychotic cautions). Frequencies were taken from the GeneReviews figures because those were derived with a method intended to avoid ascertainment bias.

    Deep research: one openscientist run (research/Chromosome_17q12_Deletion_Syndrome-deep-research-openscientist.md, 17 citations, 2 artifacts). The run shipped with NO reference_validation and NO term_validation block because term validation aborted on a 5-second EBI OLS read timeout; this is dismech#10396 and I commented there with the reproduction. I retro-fitted the reference section with just validate-research-reference, which succeeded and reported 27/27 references resolved, 22 of 27 on topic, and 3 of 5 quoted claims found in source. The two failed quotes are near-misses, not confabulations: one is a Unicode Mg-squared-plus against the abstract's Mg(2+), the other an ellipsis-joined quote. just validate-research-terms failed on four consecutive attempts, each on a different CURIE (CHEBI:17234, HP:0000107, ORPHA:261265, ORPHA:93111), so this report carries no term-validation section and that is stated in the PR body rather than left as an absence. HP:0000107 is in cache/hp/terms.csv, so a cache-first path would have avoided it.

    Used from the report: PMID:32778765 (population birth prevalence of 1 in 4,000 from 12,252 unselected trios, which replaced a referral-cohort rate as the primary prevalence record), PMID:26340261 (hypomagnesaemia in 50-60% with high fractional magnesium excretion, replacing an INDIRECT monitoring-guidance quote with direct evidence), PMID:24897035 (the validated 17-item HNF1B score, curated as a PHENOTYPE_ALGORITHM definition with VALIDATED_AGAINST_GOLD_STANDARD status, AUC 0.78, NPV over 99% at cutoff 8), PMID:31498910 (deletion versus intragenic variant comparison across 82 studies, cited on the open genotype-phenotype discussion), and PMID:24204001 (PCBD1-HNF1B-FXYD2 route to distal tubule magnesium reabsorption, graded INDIRECT because the experiment interrogates PCBD1 loss in an overexpression cell line).

    Cache defect encountered: references_cache/PMID_24204001.md holds the same sentence twice, once with the italic gene name concatenated to its neighbours (theFXYD2promoter) and once clean. The snippet was taken from the clean occurrence.

    Two knowledge gaps are recorded: which of the fourteen non-HNF1B interval genes drives the neurodevelopmental phenotype, and why deletion carriers have less advanced kidney disease than point-mutation carriers (PMID:28420700, 40 of 78 versus 71 of 91 for CKD3-4/ESRD in the long term, P = 0.0003) when a pure haploinsufficiency model predicts equivalence.

    Correction made during curation: two snippets were initially written from memory and failed reference validation. One was replaced with the correct text; the other, PMID:22130109, turned out to report the 17q12 schizophrenia association as 'more common in schizophrenia cases but not significantly so', so the claim of independent replication was overstated. It is now cited with the accurate quote, graded directness INDIRECT, and the entry prose says the replication is partial.

    Validation: just validate passes; 50/50 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading, check-title-snippets and check-folded-hyphens all pass.

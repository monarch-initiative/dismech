  details: |
    Addresses an IMPORTANT review finding on PR #9260 that could not be verified by the reviewer, whose environment had no network egress. Checking PubMed found a GeneReviews chapter for Rotor syndrome (PMID:23236639) but none for Crigler-Najjar or Dubin-Johnson. The chapter supplied a substantive correction rather than just a citation: Rotor syndrome is inherited in an autosomal recessive DIGENIC manner, resembling monogenic recessive inheritance only because SLCO1B1 and SLCO1B3 are adjacent and do not segregate independently. Added a second Inheritance block bound to HP:0010984 Digenic inheritance alongside the existing HP:0000007, per the digenic/oligogenic conventions in CLAUDE.md, and a top-level references block tagged GeneReviews. Supportive Care modality changed from BEHAVIORAL to OTHER. Validation: schema, terms and snippets clean.

  summary: 'Create: Rotor Syndrome'
  details: |
    New entry filling a hepatobiliary gap. Conforms to the conjugated-transport arm of the new bilirubin_conjugation_transport module. Curates the feature that makes Rotor syndrome genetically unique among the hereditary hyperbilirubinaemias: OATP1B1 and OATP1B3 are functionally redundant, so both SLCO1B1 and SLCO1B3 must be lost, frequently via a single deletion spanning the adjacent loci. Both genes are recorded as CAUSATIVE with notes stating the joint requirement. The urinary coproporphyrin discriminator is curated with its own contradiction: the classical Rotor signature is recorded as SUPPORT and the case measurement that matched the Dubin-Johnson pattern instead as PARTIAL, with a KNOWLEDGE_GAP noting no study quantifies the test against molecular diagnosis. Validation: linkml-validate clean; linkml-term-validator passed; 16/16 evidence snippets verified against cached references.

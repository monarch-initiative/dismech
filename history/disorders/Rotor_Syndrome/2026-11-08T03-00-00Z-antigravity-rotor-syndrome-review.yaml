  summary: Enriched Rotor syndrome with Harrison's classifications, OATP1B1/1B3 molecular function grounding, causal downstream edges to phenotypes, porphyrinuria phenotype, diagnosis, and drug-toxicity monitoring.
  details: Added GASTROINTESTINAL and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications backed by PMID:36157610 and PMID:23236639. Grounded Combined OATP1B1 and OATP1B3 Deficiency with bilirubin transmembrane transporter activity (GO:0015127), basolateral plasma membrane (GO:0016323), and liver (UBERON:0002107), and added causal downstream edges from Failure of Hepatic Bilirubin Conjugate Reuptake and Storage to Conjugated Hyperbilirubinaemia and Intermittent Jaundice. Added Porphyrinuria (HP:0010473), molecular genetic testing and urinary coproporphyrin diagnosis entries, and pharmacotherapy monitoring for OATP1B1/1B3 substrate drug toxicity.

  summary: Enriched Rotor syndrome with Harrison's classifications, OATP1B1/1B3 molecular function grounding, GeneReviews clinical and diagnostic baselines, porphyrinuria causal wiring, and reconciled supportive management.
  details: Added GASTROINTESTINAL and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications backed by PMID:36157610 and PMID:23236639. Grounded Combined OATP1B1 and OATP1B3 Deficiency with bilirubin transmembrane transporter activity (GO:0015127), basolateral plasma membrane (GO:0016323), liver (UBERON:0002107), and a downstream edge to Porphyrinuria (HP:0010473, non-diagnostic), and linked Conjugated Hyperbilirubinaemia to Intermittent Jaundice via sequelae. Incorporated GeneReviews clinical characteristics (childhood onset, intermittent jaundice, conjunctival icterus, mixed hyperbilirubinemia), ordered diagnostic modalities starting with hepatobiliary cholescintigraphy (NCIT:C62667) followed by confirmatory SLCO1B1/SLCO1B3 molecular testing and urinary coproporphyrin analysis, and folded OATP1B1/1B3 substrate-drug precautions into Diagnosis and Reassurance without unsupported target_mechanisms edges.

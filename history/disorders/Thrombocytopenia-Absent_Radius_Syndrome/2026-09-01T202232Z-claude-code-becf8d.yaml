  summary: 'Create: Thrombocytopenia-Absent Radius Syndrome (MONDO:0010121)'
  details: |
    De novo curation of TAR syndrome, claimed via issue #10431.

    Scope decision: entry_type DISEASE. MONDO:0010121 records no descendants, one causal gene (RBM8A), and one conserved pathograph, so it is a disease rather than a grouping or a subtype. Preflight against origin/main found no existing coverage by MONDO ID, by label, or by gene symbol, and no open PR. The nearest existing entries are Inherited_Aplastic_Anemia.yaml, which lists five IBMFS but not TAR, and Fanconi_Anemia.yaml. Note a naive grep for 'TAR syndrome' matches Scimitar_Syndrome.yaml as a substring; that hit is spurious.

    Pathograph: Reduced RBM8A Gene Dosage -> Y14 Protein Insufficiency -> Exon Junction Complex Insufficiency -> (Megakaryocyte Maturation Failure -> Thrombocytopenia; Radial Ray Developmental Failure -> Bilateral radial aplasia).

    Two curation judgments worth review. First, the genotype-phenotype relation is modelled as a dosage threshold rather than haploinsufficiency, because 1q21.1 deletion carriers and individuals homozygous for the hypomorphic regulatory allele are both healthy. Second, the mechanism linking the regulatory SNPs to reduced Y14 protein is recorded as an open KNOWLEDGE_GAP rather than asserted in the causal edge: reporter assays show reduced promoter activity, but allele-specific expression in platelet RNA from healthy heterozygotes showed no difference, and the source authors state the mechanism remains open.

    Ontology note: 'Preserved thumbs' is deliberately left unbound. HPO has no positive term for a thumb preserved in the presence of radial aplasia, and binding a thumb-malformation term would assert the opposite of the finding. GO:0035145 (exon-exon junction complex) was initially placed in molecular_functions and moved to cellular_components after term validation rejected it; the CURIE and label were correct but the term is a cellular component.

    References: five, all fetched and title-verified before use. PMID:20301781 (GeneReviews), PMID:22366785 (Albers 2012, mechanism), PMID:17236129 (Klopocki 2007, microdeletion), PMID:12471199 (Greenhalgh 2002, 34-patient cohort frequencies), PMID:36872795 (birth prevalence). Three PMIDs recalled from memory during drafting proved to name unrelated papers and were discarded before use; all citations here were resolved via PubMed E-utilities and confirmed against the fetched title.

    Correction during curation: clinical_course: PROGRESSIVE was initially set on the Thrombocytopenia phenotype and removed. It contradicted the cited sources and this entry's own description, both of which state the thrombocytopenia remits with age. ClinicalCourseEnum offers only PROGRESSIVE and STABLE, neither of which describes a remitting course, so the slot is left absent and the natural history is carried in prose and evidence.

    Post-curation deep-research cross-check (falcon / Edison Scientific Literature,
    template_sha 1e7ea4ee). Run after the entry was curated from primary sources, so it
    was used as a gap-finder, not a source. Its preflight raised a Named Entity Confusion
    WARN on rival gene TPO at 41% of RBM8A mentions; investigated and cleared, because the
    TPO material is genuine TAR megakaryocyte biology rather than drift into congenital
    amegakaryocytic thrombocytopenia. Several of the report's own references were
    unusable (Unknown journal, no PMID/DOI) and were not cited. Four things were taken
    from it and independently re-verified before use: PMID:37611607 (Strauss 2023), which
    prompted softening the closed "one of two SNPs" claim because further TAR-associated
    SNPs are still being identified; clinicaltrials:NCT00027274 and NCT00086476; and the
    observation that no published model recapitulates the full triad, which corroborates
    the FAILS_TO_RECAPITULATE grading already recorded.

    Additions in the same pass: datasets geo:GSE5781 (the array CGH series from the
    Klopocki study already cited) and geo:GSE240611, both accession-verified; nine
    GENE_ONLY dataset candidates were rejected on relevance triage as Named Entity
    Confusion via RBM8A. Evidence added to the animal model, the RUSAT differential
    (PMID:26581901) and all three treatment mechanism links. Compliance rose from 90.8%
    to 95.6%; every remaining gap is deliberate - the unbound Preserved thumbs phenotype,
    the two dataset records which by repository policy carry publication and notes rather
    than evidence, and the two registry external assertions.

    Second pass from the report's full BibTeX citation list, which carried DOIs for
    entries the report's numbered list had shown only as "Unknown journal". Three were
    usable and filled a section the entry lacked entirely, prenatal care: Weinblatt 1994
    (DOI:10.1002/pd.1970140922) for sonographic detection, cordocentesis and in utero
    platelet transfusion; Bottillo 2013 (DOI:10.1186/1756-0500-6-376) for the prenatal
    presentation and for naming the recurrent hypomorphic allele rs139428292; and Bastida
    2021 (DOI:10.3390/ijms22094330), used only to establish a knowledge gap, since its
    reported TPO-RA diagnoses do not include TAR and it therefore cannot support a
    treatment claim here. Two citation-list entries (sanchez2020, clemence2023) remain
    journal-less with no DOI and were not used; the OpenTargets entry is a tool query,
    not a publication.

    Added in this pass: a diagnosis section (prenatal ultrasound, cordocentesis, molecular
    confirmation of both alleles), an In Utero Platelet Transfusion treatment, a variants
    entry for rs139428292, and a second KNOWLEDGE_GAP on TPO-receptor agonists.

    The rs139428292 variant is classified regulatory_category mLOE rather than LOE on the
    schema's own distinction: mLOE is modular loss of expression affecting only a subset of
    cell types, and the Albers reporter assays showed reduced activity in megakaryocytic and
    osteoblast lines but not in endothelial or HEK293 cells. That is the same cell-type
    restriction the entry uses to model the phenotype as tissue-selective.

    Note that linkml-reference-validator skips DOI-prefixed snippets ("46/52 verified, 6
    skipped by prefix"). All six were verified by hand against their cache files, and a
    separate whole-file check confirmed all 52 snippets are exact substrings.

    Trial status correction: NCT00086476 was initially recorded as RECRUITING from
    assumption and corrected to COMPLETED against the ClinicalTrials.gov API, which the
    cached record does not carry.

    Validation: just validate passes schema and term validation with 36/36 snippets verified against cached references. check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass.

  summary: Add PMID:42420238 non-coding RBM8A 3' UTR hypomorph (c.*6C>T)
  details: |
    Augments the existing TAR entry from lit-scan issue 6077. Adds the c.*6C>T 3' UTR variant in RBM8A as a second non-coding hypomorphic allele, in trans with a null allele, in three patients from two families (PMID:42420238, Clin Genet 2026). Evidence on the genetic RBM8A block is an exact quote verified against references_cache/PMID_42420238.md. The pathophysiology node description now lists the 3' UTR allele alongside the 5' UTR and first-intron SNPs. Not changed: the existing evidence, the inheritance and recurrence sections, and the prevalence block. The paper is a three-patient series, so it is recorded as an additional allele rather than a change to the disease's genetic architecture.

  summary: 'Create: BEST1-related vitreoretinochoroidopathy (ADVIRC)'
  details: |
    New entry for MONDO:0700240 (ADVIRC), curated from the stub. Falcon deep research was requested; it is not configured in this environment, so the run fell back to OpenScientist (research/BEST1-related_Vitreoretinochoroidopathy-deep-research-openscientist.md). The report's reference validation found no unresolved citations. preflight-dr warned that it gives HGNC:1114 beside BEST1; the entry binds hgnc:12703 from the HGNC cache, and its NCIT suggestions were not used. The report presents splicing and gain of channel function as one mechanism; the primary papers conflict, so the entry models them as competing hypotheses (gain of function EMERGING, splicing ALTERNATIVE with patient iPSC-RPE refutations) plus a CONTROVERSY discussion that also records the apical-mislocalisation finding. Phenotypes come from GeneReviews (PMID:20301346), family series and case reports; every snippet verifies against references_cache. The ADVIRC subtype row of BEST1_Bestrophinopathies gets curated_in pointing here. Orphanet features were not added because the Orphadata download is blocked in this environment.
    Review round 1 (PR 15199): added retinal neovascularization (HP:0030666) and choriocapillaris atrophy (HP:0030491) as phenotypes with edges from the peripheral RPE node (PMID:29774302, PMID:36712704); rebound iris dysgenesis from Hypoplasia of the iris to Abnormality iris morphology (HP:0000525), since the source says dysgenesis, not hypoplasia; added the MONDO:0008662 exactMatch mapping; marked the cataract-surgery evidence INDIRECT; added notes on the nanophthalmos binding and on angle-closure management.

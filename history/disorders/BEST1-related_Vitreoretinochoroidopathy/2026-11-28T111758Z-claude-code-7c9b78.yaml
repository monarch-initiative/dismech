  summary: 'Address review on PR 18162: restore treatment targets, re-anchor myopia,
    drop nystagmus edge'
  details: |
    Restored the original treatment targets (dorzolamide to Cystoid Macular Edema, cataract surgery BYPASSES Cataract) and pointed vitrectomy at Vitreous Fibrillar Condensation instead of Peripheral RPE Degeneration and Migration. Moved the Myopia edge from the ocular-growth node, which produces a short nanophthalmic eye, to Increased BEST1 Anion Conductance in RPE under the advirc_channel_gain_of_function hypothesis group, citing the PMID:41991505 conclusion as INDIRECT evidence. Removed the Photoreceptor Degeneration to Nystagmus edge, since the nystagmus is congenital and the degeneration is late. Added PMID:26849243 BACKGROUND evidence to the developmental node to Cataract edge, dropped the unsupported blood-retinal barrier clause, rebound the Electrophysiology diagnosis from NCIT:C101217 Retinal Examination to NCIT:C190539 Electrooculography with a note recording the NCIT search for an ERG term, and removed the NEUROLOGIC Harrison's classification.

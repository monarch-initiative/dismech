  summary: 'Review round 2 (PR 15229): correct LOINC negative-existence note; drop
    population reference ranges; soften prevalence note'
  details: |
    Response to ai4c-reviewer CHANGES_REQUESTED round 2 on PR 15229 (one blocking
    item plus two suggestions; the reviewer confirmed all five round-1 blocking
    items landed).

    Blocking (diagnosis note false negative). The diagnosis row's note said
    monochloroacetic acid "is not represented as a measurable analyte in the
    LOINC table". That negative-existence claim is false and was refuted by one
    search, the same failure shape CLAUDE.md flags under "Naming the query does
    not make the note true; re-running it does". Verified against the Monarch KG
    entity API (the authority LoincTerm validates against): LOINC:54945-1
    Monochloroacetate [Mass/volume] in Urine and LOINC:38654-0 Chloroacetate
    [Mass/volume] in Air both exist as ClinicalMeasurement nodes, and a
    monochloroacetate ClinicalMeasurement search returns only the urine code. The
    decision not to bind a LOINC on the plasma-confirmation diagnosis row is
    unchanged and still correct, because the two codes that exist are
    specimen-specific (urine, air) with no plasma or serum code, and a
    specimen-specific code is not bound for a test's identity. The note was
    rewritten to that narrower, true statement, naming the query and both codes.

    Suggestion (population reference ranges are not disease content). Dropped the
    four reference_ranges blocks on the biochemical markers (CK, cardiac troponin
    I, ALT, AST). CLAUDE.md: a population reference interval is true of everyone
    and is carried only where an interpretation band needs it as an anchor; none
    is needed here. The analyte identity (marker-level loinc_term / biomarker_term),
    the presence flag, the admission value and interval in notes, and the quoted
    Table 1 row in evidence are all retained, so nothing citable was lost. This
    also resolves the reviewer's second point, that Tao reports two different
    intervals for ALT and AST (Table 1 and Table 2, different laboratories) and
    the dropped blocks did not record which table.

    Suggestion (prevalence wording). The note's "most involve the corrosive burn;
    systemic poisoning after dermal absorption remains rare" was uncited and sat
    awkwardly beside the quoted "transdermal absorption is the main cause of acute
    poisoning". Softened to "the systemically poisoned cases that reach the
    literature remain few", which is consistent with the CASES_IN_LITERATURE /
    ULTRA_RARE encoding and asserts nothing uncited.

    Validated: just validate (schema, terms, 65 snippets, 72 titles, 0 issues),
    just validate-disorders, check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-block-scalar-comments, check-enum-values; caches
    unchanged.

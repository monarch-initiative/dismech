  summary: 'Create: Systemic Monochloroacetate Poisoning'
  details: |
    New Environmental toxin entry for systemic monochloroacetate (monochloroacetic acid/MCAA) poisoning (MONDO:0019545; Orphanet:90069 exactMatch). Deep research via the claude_code provider (6 web searches, 16 turns); report committed with a retro-fitted Reference Validation section (8/8 references resolved, 0 off-topic). Mechanism curated as a causal chain: dermal/oral/inhalational absorption -> corrosive contact burn plus intracellular sulfhydryl-alkylating inactivation of GAPDH (Sakai 2005, PMID:15720133) -> blocked gluconeogenesis/glycolysis -> severe hypoglycemia, lactate/pyruvate accumulation and lactic/metabolic acidosis -> multi-organ bioenergetic failure (heart, CNS/cerebral edema, kidney, skeletal muscle, lung, liver). The older aconitase-inhibition hypothesis (restated by Dote 2003 and Tao 2020) is recorded as refuted by Sakai 2005 in a node note rather than asserted. 13 evidence-backed phenotypes; phenotypes from the MONDO/Orphanet definition that lacked a citable literature snippet (vomiting, diarrhea, hypokalemia, hypocalcemia, anuria, myoglobinuria, arrhythmia, leukocytosis) were left out rather than left unevidenced. Two rat subcutaneous models (PMID:16898262 lung injury+hypoglycemia; PMID:21432300 hepatic/lactic) linked via modeled_mechanisms with route-of-exposure limitations. Dichloroacetate added as a candidate/regionally-approved antidote, cited to verbatim Tao 2020 (PMID:32975103) sentences (animal efficacy; Sweden approval / US trial stage); a fresh-context red-team review flagged that the citable quotes were present in the already-cited full text, overturning an initial omission. ORPHA:90069 structured cache not committed because local Orphadata drifted from the manifest pin (repin out of scope). GeneReviews: NO_CHAPTER (toxin, not Mendelian). Red-team round also corrected the evidence_source on the Sakai "We previously reported..." whole-animal lethal-dose quote (IN_VITRO -> MODEL_ORGANISM, quote_role BACKGROUND, two occurrences), added quote_role BACKGROUND to the Tao intro general-consequences quote, and directness INDIRECT on the cardiac-failure to impaired-contractility inference. Validated: just validate (schema+terms+references, 0 issues), just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-environmental-evidence, check-reference-titles, and validate-history all pass.

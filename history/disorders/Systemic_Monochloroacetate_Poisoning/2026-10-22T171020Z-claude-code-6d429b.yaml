  summary: 'Review round 1 (PR 15229): add phenotypes, progression, biochemical, diagnosis;
    fix scope rationale and claim-evidence'
  details: |
    Response to ai4c-reviewer CHANGES_REQUESTED on PR 15229 (five blocking items
    plus the actionable non-blocking ones).

    Blocking item 1 (scope rationale refuted by a committed cache). The original
    CREATE record and PR body said the excluded phenotypes "had no citable
    literature snippet"; that was false for several. Added Nausea (HP:0002018)
    and Vomiting (HP:0002013) from Tao 2020's early-stage-features sentence
    (graded HUMAN_CLINICAL, quote_role REVIEW_SYNTHESIS, since Tao is synthesizing
    refs 9 and 10 there), and Lethargy (HP:0001254) and Hypoxemia (HP:0012418)
    from a present-case sentence the entry already quoted. Lethargy is wired
    downstream of the CNS node and Hypoxemia downstream of the acute-lung-injury
    node; Nausea and Vomiting are left as unconnected early-symptom phenotypes
    rather than forced onto a mechanism the sources do not state. The remaining
    definition-derived phenotypes are not a "no snippet" case and the rationale is
    corrected accordingly: hypokalemia, hypocalcemia, anuria and arrhythmia are
    positively reported normal or absent in Tao's single survivor case; diarrhea
    and myoglobinuria appear only in the MONDO/Orphanet definition (whose ORPHA
    cache is not committed) with no committed literature snippet; leukocytosis is
    in the lab table but its only elevation (WBC 14.99) coincides with documented
    aspiration pneumonia, so it is not cleanly attributable to the poisoning.

    Blocking item 2 (latent interval). Added a progression block: corrosive
    contact injury, latent interval of roughly one to three and a half hours,
    systemic poisoning onset, and multi-organ failure, each phase evidence-backed.
    The latent interval is cited verbatim to Tao 2020. The description's "roughly
    one to four hours" was aligned to the committed figure "roughly one to three
    and a half hours"; the 1 to 4 hour figure is the uncommitted Orphanet
    definition's, not a committed source.

    Blocking item 3 (dermal claim-evidence mismatch). The "modest body-surface
    area can be lethal" claim had been supported only by a 25 to 30 percent BSA
    splash snippet. Added Tao "Contamination of more than 5 % of the skin can
    cause poisoning and even death" (supports the modest-area claim) and
    "transdermal absorption is the main cause of acute poisoning" (supports the
    main-route claim); the splash item's explanation was re-scoped to documenting
    the route and lethality.

    Blocking item 4 (prevalence Orphanet attribution). Dropped "Orphanet classes
    it below 1 in 1,000,000", which had no committed source. Rewrote the note
    grounded on the committed literature and added evidence (Tao "more than 100
    cases reported in the past ten years in China alone"). prevalence_class
    ULTRA_RARE with measure_type CASES_IN_LITERATURE retained.

    Blocking item 5 (diagnosis/biochemical). Added a biochemical block with CK
    (LOINC:2157-6), cardiac troponin I (NCIT:C17343 biomarker_term), ALT
    (LOINC:1742-6) and AST (LOINC:1920-8), each with the reference interval and
    the admission value quoted from Tao Table 1. Added a diagnosis block for
    plasma monochloroacetate confirmation (NCIT:C217390 Diagnostic Blood Testing);
    no LOINC analyte exists for monochloroacetic acid, so the measurement identity
    is carried in preferred_term and a note records that.

    Non-blocking addressed: therapeutic_modality SURGERY added to burn-wound
    surgical care (mechanical from NCIT:C15329); decontamination (NCIT:C49236) and
    supportive care (NCIT:C15747) deliberately left untagged, since CLAUDE.md's
    backfill table excludes generic action terms whose modality depends on the
    agent (item 6). Burn-wound binding kept broad at NCIT:C15329 because the
    treatment bundles debridement, escharotomy and grafting; a note records that
    NCIT:C51682 Debridement is the more specific term for the debridement
    component alone (item 7). Decontamination note records why NCIT:C68769 is not
    used (not reachable from NCIT:C25218), matching Sulfur_Mustard_Poisoning and
    Ricin_Poisoning (item 8). Dichloroacetate's pyruvate-dehydrogenase claim
    softened to the cited "acts directly on the affected enzymatic system" and
    "reduce or eliminate the effects of lactic acid poisoning"; a note records
    that PDH activation is a proposed and here-disputed mechanism not modelled in
    the entry (item 9). cell_types hepatocyte (CL:0000182) added to the Impaired
    hepatic gluconeogenesis node (item 12).

    Non-blocking not actioned, with reasons: conforms_to
    metabolic_intoxication_decompensation declined, because that module scopes to
    intoxication-type inborn errors of intermediary metabolism (a genetically
    deficient enzyme or transporter), whereas monochloroacetate chemically
    inactivates GAPDH, a different etiology (item 10). The original record's
    "Orphanet:90069 exactMatch" is correct: MONDO:0019545 carries obo_xref
    Orphanet:90069 with MONDO:equivalentTo, verified via OLS. dismech's
    DiseaseMappings schema has no orphanet_mappings slot, so no ORPHA mapping is
    asserted in the YAML; the equivalence is carried by the MONDO disease_term
    itself, so no YAML change was made (item 11). Tested-and-ineffective antidotes
    (glycerol monoacetate, ethanol) were not added: they appear only in the
    deep-research report and ECETOC review, with no committed reference-cache
    snippet to support them (item 13).

    Validated: just validate (schema, terms, 65 snippets, 72 titles, 0 issues),
    check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-qualifier-terms, check-environmental-evidence, check-coarse-phenotypes.

  summary: 'Genetics pass: subtype gene bindings and a CANT1 mechanism node'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: the entry already carried all seven MED genes bound in `genetic:`
    with subtype foreign keys. Each subtype row's MONDO term was independently
    re-derived by OLS search and cross-checked for gene agreement against the Monarch
    CausalGeneToDiseaseAssociation endpoint; all seven agree (EDM1/COMP, EDM2/COL9A2,
    EDM3/COL9A3, EDM5/MATN3, EDM6/COL9A1, rMED = MONDO:0009189 "multiple epiphyseal
    dysplasia type 4"/SLC26A2, EDM7/CANT1). The rMED binding was the one worth
    checking, since the row name and the MONDO label differ; MONDO's own definition
    for MONDO:0009189 names allelism with diastrophic dysplasia, which is SLC26A2.

    Changes:
    - Added the gene as a `genes:` descriptor on all seven `has_subtypes` rows.
    - Added a `CANT1 Golgi Nucleotidase Deficiency and Short Proteoglycan GAG Chains`
      pathophysiology node. CANT1 was bound in `genetic:` but reached no node, and it
      does not belong on either existing upstream node: it is neither an ER-retained
      matrix protein nor a sulfate transporter, but a Golgi UDP-hydrolysing enzyme
      whose loss shortens glycosaminoglycan chains on secreted proteoglycans.
      Evidenced from PMID:39334831 (Cant1 knock-out mouse) and PMID:39618316
      (CANT1-related MED across five families).
    - Reworded the convergence node's description, which named only two upstream
      mechanisms, to name all three.

    New references cached: PMID:39334831, PMID:39618316.

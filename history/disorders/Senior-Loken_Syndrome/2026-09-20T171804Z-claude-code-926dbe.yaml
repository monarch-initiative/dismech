  details: |
    First review round on PR 12340; a self-review addition rather than a reviewer finding. The previous commit bound all ten SLSN genes to the Ciliary Transition Zone Dysfunction node. Not all ten are transition-zone proteins in the strict sense - CEP164 is a distal appendage protein, WDR19 is IFT-A and TRAF3IP1 is IFT-B - so the node description now says this plainly and gives the reason they are grouped at one node: each defect produces the same functional outcome, a structurally present cilium that cannot gate its own membrane or cargo, which is what the node's three biological processes already describe.

  summary: Complete the SLSN numbered subtype series
  details: |
    Added has_subtypes rows for SLSN3 (MONDO:0011755, NPHP3), SLSN4 (MONDO:0011756, NPHP4) and SLSN9 (MONDO:0014712, TRAF3IP1), taking coverage of the nine children of MONDO:0017842 from five to eight. Each row binds its gene and cites gene-specific literature beside the existing Orphanet row. Wired the reciprocal subtype foreign keys on the NPHP3, NPHP4 and TRAF3IP1 genetic records, and added a case_fractions record for NPHP4 (2.9 percent of 74 molecularly solved patients, PMID:36990420). Corrected the CEP164 note, which claimed CEP164 causes SLSN10: MONDO and Europe PMC searches return no such concept, and the CEP164 disease is nephronophthisis 15 (MONDO:0013917), already bound in Nephronophthisis.yaml, so no subtype row was created here. Recorded the HGNC rename of TRAF3IP1 to IFT54 on 2026-03-20 while keeping the binding at the previous symbol the OBO build carries. Recorded why INVS takes no numbered row and why ClinGen validity grades for these genes are not transferable to the Senior-Loken classes. 62 of 62 snippets verified.

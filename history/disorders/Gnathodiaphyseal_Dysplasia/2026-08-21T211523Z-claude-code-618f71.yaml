  summary: 'Create: Gnathodiaphyseal Dysplasia (ANO5)'
  details: |
    Created the gnathodiaphyseal dysplasia (MONDO:0008151) Disease entry for issue #9198. Entry-type decision recorded as DISEASE: MONDO:0008151 has no MONDO descendants, its MONDO parent is an osteogenesis-imperfecta/reduced-BMD grouping term that dismech does not curate as an entry, and it carries one causal gene with a well-defined allele class, so it is neither a grouping nor a subtype nor out of scope.

    The mechanistic focus is the ANO5 allelic contrast. Dominant missense alleles clustered at residues 215/356/360/500/513/518 are curated with functional_impact_category: GAIN_OF_FUNCTION on the trigger node's genetic_context, following the CLAUDE.md slot rule (variant consequence goes on GeneticContext.functional_impact_category; pathway activity state goes on Descriptor.modifier, which is used separately on the scramblase node). The GOF assignment rests on Di Zanni et al. PMID:29124309, where the GDD T513I protein scrambles phospholipid at low cytosolic calcium, and PMID:32112655, which compared muscular-dystrophy and GDD alleles head to head in one assay system and found them moving in opposite directions. The biallelic-loss-of-function muscular dystrophy mechanism is deliberately NOT duplicated; it is referenced to Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy, and invoked only where the contrast does mechanistic work, namely the argument that GDD is not haploinsufficiency.

    Four discussions record what is genuinely unsettled rather than manufacturing a mechanism to fill the gap: a KNOWLEDGE_GAP on jaw selectivity, asking why a broadly expressed ER scramblase yields gnathic-restricted fibro-osseous lesions; a KNOWLEDGE_GAP on the gain- versus loss-of-function dispute, including the honest caveat that the null-carrier argument is an argument from absence in a population that has never been systematically skeletally phenotyped; a KNOWLEDGE_GAP on the challenged bone/muscle dichotomy, since PMID:34291158 reports p.Thr513Ile producing both phenotypes in one dominant kindred; and a HUMAN_MODEL_MISMATCH on the contradictory mouse models, where PMID:32455153 is a negative knock-in, PMID:34841576 a positive knock-in of a different allele, and PMID:30712070 a positive null, together with the non-conserved-residue construct-validity explanation from PMID:35982081. A variant-class-stratified GOF/LOF sub-entity hypothesis from PMID:35982081 is recorded as EMERGING, which is why bone mineral density is deliberately given no single direction and both Diaphyseal sclerosis and Osteopenia are curated as phenotypes.

    Deep research used the claude_code provider; the report is research/Gnathodiaphyseal_Dysplasia-deep-research-claude_code.md, whose own reference validation reported 48/48 references resolved, confabulation_rate 0.0, and needs_review true on account of unsupported quotes. No quote was taken from that report. Every snippet in the entry was re-derived directly from the cached abstract or cached full text and independently verified. No GeneReviews chapter exists for gnathodiaphyseal dysplasia, confirmed by PubMed search on 2026-08-21, so the GeneReviews baseline step was not applicable; the GeneReviews chapter that does exist covers ANO5 muscle disease, the allelic disorder curated elsewhere.

    A pre-PR red-team review was run against the draft using the dismech-pr-review conventions, and returned REQUEST_CHANGES with 2 critical and 11 important findings. All were addressed before the first commit, so the entry was never pushed in the reviewed state. The two critical ones are worth recording because both were cases of the entry being wrong about itself rather than about the biology. First, a treatment note asserted that PMID:33826556 "caches as metadata without an abstract, so no quotable finding is available" - that was simply false, the cached record carries a full CASE/CONCLUSION abstract, and the note has been replaced by two real evidence items quoting the fixation outcome and the first-report caveat. Second, the alternative hypothesis listed "ANO5 knockdown increases osteoblastogenesis" among its SUPPORTING observations, when Li et al. name that same result as partly contradicting their own model; it has been moved out of the supporting list and additionally curated as a REFUTE evidence item so the contradiction is visible in the data and not only in prose.

    The important findings drove the rest: cementoblast CL:0000061 was unbound on the jaw node because binding it would silently answer the lineage question the jaw-selectivity KNOWLEDGE_GAP declares open; the osteoblast-differentiation modifier moved from INCREASED to DYSREGULATED because three published directions exist and the node's own prose says so; human evidence was added for cortical thickening and alkaline phosphatase so neither rests on mouse data alone; a background-sentence snippet on the knock-in model was replaced with a measured result; the gain-of-function prose was scoped to p.Thr513Ile rather than generalized across all GDD alleles; the top-level description was hedged and now names all three live disputes; sclerosis evidence was added to the node whose defining feature it is; Li et al.'s knockout was curated as a fourth animal model, carrying the knockout-versus-knockout non-replication and a PTH RESCUES arm; pharmacotherapy was added (pamidronate, plus PTH marked preclinical) together with the clinically load-bearing point that an antiresorptive is directionally wrong for the osteosclerotic sub-entity and an osteoanabolic wrong for the osteopenic one; and diagnosis, biochemical, histopathology, a dentition phenotype and a prevalence class were added. Minor findings on role naming, evidence_source, the reversed-"respectively" quote in PMID:34291158, the male-only mouse phenotyping detail, additional variants and the cherubism differential were also applied.

    Validation run and read in full after those changes: just validate passed; just validate-terms passed; just count-verified-snippets reported 83/83 verified against cached references, up from 55/55 in the reviewed draft; just validate-disorders, the batched sweep CI runs, passed with 83/83. The five ungated CI gates were run and read - check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-duplicate-keys - all OK, as was check-not4curation, and an independent script confirmed every downstream, treatment, model, readout, hypothesis-group and attaches_to reference resolves. Three snippets were repaired during curation, each for a mechanical matching reason rather than a substantive one: a bracketed calcium-ion span that the validator strips was trimmed out of a PMID:35982081 quote; a second PMID:35982081 quote was shortened because an inline citation marker sits mid-sentence and breaks verbatim matching, with the omitted clause described in the explanation; and a four-word prevalence quote was extended to a full sentence to satisfy the snippet-length gate. The full tests/test_data.py suite was NOT run to completion locally - it exceeded its timeout twice without emitting output - so it is left to CI rather than reported as passed.

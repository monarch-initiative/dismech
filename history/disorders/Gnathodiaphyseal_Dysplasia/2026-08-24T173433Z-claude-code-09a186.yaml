  summary: 'Address review: signalling nodes, variants, diagnostics'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9396, plus the second-opinion research comment on issue #9198. The reviewer found no correctness errors - schema, terms, snippets, evidence_source and pathophysiology atomicity all passed, and it explicitly credited the evidence honesty and the avoidance of the ANO5 named-entity-confusion traps - but raised one blocking and six important content-completeness gaps.

    Finding 1, the blocking one: six 2023-2026 downstream-signalling papers with in vivo rescue data were entirely unmodelled, and the chain jumped from phospholipid scrambling straight to the differentiation node with no intervening signalling step. Two atomic nodes now fill that gap. `Pro-Osteogenic Signalling Dysregulation in Osteoblasts` carries the AMPK/glycolysis arm (PMID:41717545), the ATG9A-dependent autophagy arm (PMID:40067389), the miR-34c-5p/KLF4/beta-catenin arm (PMID:40508076) and the Akt arm (PMID:39866532, direction DECREASED). `Osteoclast Differentiation Blockade and Apoptosis` carries the RANKL/NF-kB arm (PMID:36989132), the ER-stress/CHOP apoptosis arm (PMID:40049314) and the Akt arm. The rescue agents are curated as `animal_models[].modeled_mechanisms` with `relationship: RESCUES` rather than as treatments, exactly as the reviewer directed, since none has human data: SC79 and Compound C on the genotype-matched Cys360Tyr knock-in, 3-MA and miR-34c-5p AAV on the Ano5 null.

    A distinction the review did not ask for but that the entry needed: two of the six papers use the p.Cys360Tyr knock-in, which carries an actual human GDD allele, while four use Ano5 nulls - a genotype that in humans causes myopathy rather than bone disease. Both new nodes state that split explicitly, because collapsing it would let null-mouse signalling results read as established for human GDD, which is the exact error the entry's HUMAN_MODEL_MISMATCH discussion exists to prevent.

    The remaining findings: five more variants curated (p.Cys356Arg/Gly, p.Cys360Tyr, p.Cys356Phe, p.Arg215Gly, p.Cys360Arg, p.Ser500Phe and the p.L370_A371ins insertion that anchors the low-bone-mass argument, the last with its PARTIAL-loss-of-function characterization); penetrance recorded as UNKNOWN with expressivity VARIABLE and a PARTIAL-graded evidence item explaining why the one published "high penetrance" statement is a pedigree impression rather than a measured estimate; `histopathology`, `diagnosis` and `biochemical` sections added; a dentition phenotype; a prevalence class; the ANO5 population-database absence; and the cherubism differential, which is a documented real-world GDD misdiagnosis. From the issue comment: a `progression` section built on the 41-year radiographic follow-up (PMID:40861765), which shows diaphyseal widening at age three while the jaws were still silent - diagnostically load-bearing, since the long-bone lesion precedes the gnathic one.

    Four review points were declined or answered differently, each recorded in the entry's `notes` rather than silently: frequency bands are omitted entry-wide because the aggregated percentages are not in any cached abstract and are ascertainment-biased in opposing directions; `has_subtypes` is not split because the allele-class rule that would assign a patient to a sub-entity is precisely what is unproven, so the split is carried as an EMERGING hypothesis that can be revised instead of as structure that cannot; muscle phenotypes stay in the dichotomy discussion rather than becoming disease-level phenotypes, since promoting them would blur the ANO5 bone/muscle distinction this entry exists to draw; and the PTH treatment is left without a `therapeutic_agent` because the source says "parathyroid hormone" while teriparatide is specifically PTH 1-34, so binding it would attribute an agent the paper does not name. The `conforms_to` reasoning now also covers `defective_skeletal_mineralization` and `loss_of_proteostasis`, both checked and declined with stated reasons.

    The reviewer's orphan-CHEBI suggestion was fixed by restoring `cache/chebi/terms.csv` from origin/main rather than hand-editing a row, per the term-cache guardrail; the legitimate pamidronate row is then regenerated by validation.

    Validation after all changes, every command run and its output read: just validate passed; just validate-terms passed; just count-verified-snippets reported 110/110 verified against cached references, up from 87/87; just validate-disorders passed. The ungated CI gates were all run and read - check-folded-hyphens, check-snippet-length, check-title-snippets, check-duplicate-keys, check-source-defect-claims (0 claims found) and check-snippet-boundaries - plus check-not4curation and check-term-cache-integrity, all OK, and an independent script confirmed every downstream, treatment, model, readout, hypothesis-group and attaches_to reference resolves. tests/test_data.py passed in full this round: 36,646 passed, 0 failed locally, and CI test (3.13) passed in 8m27s on the previous head.

    Three claims that could not be sourced from cached abstracts were deliberately NOT curated rather than approximated: the de novo severity association, the "DXA can be falsely reassuring" comparison, and the aggregated phenotype frequencies. Each is real in the literature but absent from the cached text, and asserting them would have meant a snippet that does not support its claim.

  summary: 'Gene-family review: MTRR modifier, origin, ClinGen'
  details: |
    MTRR modelling re-reviewed: biallelic loss of methionine synthase reductase, which keeps methionine synthase in its active methylcobalamin state. The node bound [methionine synthase] reductase (NADPH) activity (GO:0030586) with the qualitative LOSS_OF_FUNCTION modifier for variant-driven loss of a normal activity; it is now DECREASED. The genetic record lacked a variant origin, record-level inheritance and its ClinGen tier; it now records germline origin, an autosomal recessive inheritance block copied from the entry-level evidence, and the ClinGen Aminoacidopathy GCEP Definitive (AR) tier for MONDO:0009354, this entry's disease_term (CGGV:assertion_905575cf-cb80-4038-b82b-1de3ae1c469d-2021-07-02T160000.000Z).

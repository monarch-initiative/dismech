  summary: 'Address PR review: reference titles, frequency regrading, GeneReviews
    mining, two uncited references'
  details: |
    Address the ai4c-reviewer CHANGES_REQUESTED review on PR #9649. All 5 IMPORTANT items and all 3 suggestions were accepted and fixed; none were disputed.

    1. reference_title added to all 89 evidence items, filled verbatim from references_cache frontmatter by a script written for the purpose (kept for the other entries in this claim run, which have the same gap).
    2. Frequencies regraded from the PMID:2688421 counts over 11 patients, which the entry already quoted twice without using the numbers: Hypotonia 7/11 and Nystagmus 5/11 OCCASIONAL to FREQUENT, Global Developmental Delay 10/11 FREQUENT to VERY_FREQUENT. Failure to Thrive raised OCCASIONAL to FREQUENT to match Feeding Difficulties, which rests on the identical PMID:25526710 sentence. Each now carries a notes field recording the count and band so the grading is auditable.
    3. GeneReviews mining extended from 2 of 4 sections: the Genetic Counseling recurrence-risk statement added to the inheritance block, and two Management statements added to the hydroxocobalamin treatment (early institution improves survival, graded PARTIAL because it is explicitly qualified; and the thromboembolic/HUS treatment sentence, relevant because HUS is curated here). A disease-level notes field now records that CLINICAL CHARACTERISTICS was deliberately not mined because that paragraph names cblC as the prototype and its lists are cblC-specific - the reviewer agreed with the decision and asked only that it be recorded.
    4. PMID:17369066 (Elmore, Mtrr gene-trap metabolism), cached by this PR and previously uncited, now carries four evidence items. Two on the PARTIALLY_RECAPITULATES link: the human biochemical triad the model reproduces, and the authors' statement that the model is a deliberate hypomorph rather than a null - which is the actual justification for the PARTIALLY grading. Two in the HUMAN_MODEL_MISMATCH discussion: the preserved AdoMet/AdoHcy ratio, which is a mechanistic account of the mismatch rather than a restatement of it, plus the contrast that other hyperhomocysteinemia models DO show impaired methylation, making the preserved ratio specific to this hypomorph.
    5. The Ventricular septal defect readout was removed. It was attached to target Impaired Erythropoiesis with direction INCREASED, so the structured fields asserted the model showed increased erythropoietic impairment - the inverse of the interpretation text. The link's limitations field already made the point in prose.
    6. DOI:10.1023/A:1025159103257 (Vilaseca), cached and previously uncited, now supports the c.1361C>T mild-phenotype claim with two items, the mild-phenotype proposal graded PARTIAL because the authors propose rather than establish it on two patients.
    7. The Macrocytic Anemia note was rewritten. It had named "narrative reviews" as the contrary source when the real opponent is the 24-patient cohort PMID:25526710 quoted twice in the same file. The note now names it and says how the two reconcile.
    8. Homocysteine-Mediated Endothelial Injury is no longer a pathograph leaf; it now has downstream edges to the HUS phenotype (DIRECT) and Pancytopenia (INDIRECT_KNOWN_INTERMEDIATES, with a description saying two mechanisms converge and their relative contribution is not established).

    One defect found while fixing, not raised by the reviewer: both new DOI snippets initially failed manual verification because the cached Vilaseca record uses U+2010 HYPHEN rather than ASCII hyphen ("long-term", "FAD-binding"). This mattered because just count-verified-snippets reports DOI references as "skipped by prefix" and does not check them, so the mismatch would have shipped silently. Both snippets were corrected to the exact cached characters and verified by direct substring comparison against the cache file.

    Validation after fixes: just validate-disorders passes, 94/96 snippets verified with the 2 DOI items skipped by prefix and confirmed exact manually. check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all clean.

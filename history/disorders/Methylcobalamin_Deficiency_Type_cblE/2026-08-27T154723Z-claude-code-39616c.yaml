  summary: Correct Mtrr mouse erythroid model link and folate agent binding
  details: |
    Correction round on PR #9649 in response to review.

    The high-severity finding was correct and is fixed. The entry asserted a FAILS_TO_RECAPITULATE link from the Mtrr(gt/gt) gene-trap mouse to Impaired Erythropoiesis, on the reasoning that the original characterisation paper (PMID:18413293) measured only reproductive and cardiac endpoints. That is a claim about what one paper measured, not about the model, and it was wrong: PMID:30024025 (Padmanabhan 2018, J Physiol) is a dedicated haematological characterisation of the same line and reports macrocytic anaemia, extramedullary haematopoiesis and lymphopenia. PMID:32257815, already in the cache but uncited, recites the same result. The entry was asserting a false negative.

    What changed:
    - The link is now PARTIALLY_RECAPITULATES / MODERATE, cited to PMID:30024025, with two readouts (erythrocyte count and volume in adult females; marrow cellularity and splenic extramedullary haematopoiesis).
    - The partial grading is substantive rather than hedging. Three divergences are recorded in limitations: the murine anaemia is late adult-onset against an infantile human presentation; it is sex-limited, with males macrocytic but not anaemic; and the authors state they could not establish that it meets megaloblastic criteria.
    - The HUMAN_MODEL_MISMATCH discussion was rewritten. It no longer claims an absent haematological phenotype. The erythroid half now rests on a directional contradiction the authors themselves report - reticulocytosis in the mouse against the reticulocytopenia typical of human folate-deficiency megaloblastic anaemia - and the neurological half keeps the preserved AdoMet/AdoHcy argument, which was unaffected.
    - The animal-model description was rewritten for the same reason.

    Also fixed from the same review: the Folate Supplementation treatment bound folinic acid (CHEBI:15640, 5-formyltetrahydrofolic acid) while its only evidence quotes high-dose folic acid. Rebound to CHEBI:27470 folic acid.

    Worth recording as a process point: the original error came from treating one paper's methods section as the model's phenotype. A model's coverage is a property of the literature on that model, not of the paper that first described it, and a PubMed search for the model plus the phenotype in question is the cheap check that was skipped.

    Validation: just validate-disorders passes, 98/100 snippets verified (2 DOI references skipped by prefix and hand-checked as exact substrings). Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens.

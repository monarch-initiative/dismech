  summary: 'Create: Methylcobalamin Deficiency Type cblE (MONDO:0009354, MTRR)'
  details: |
    De novo curation of cblE (MTRR-deficient functional methionine synthase deficiency) from the claim in issue #9627.

    Deep research: the falcon/Edison provider returned HTTP 402 (API key out of credit), so the claude_code provider was used instead. Its report validated 14/14 references resolved, 6/6 quotes matched, 0 off topic. Report leads were combined with direct PubMed E-utilities searches.

    GeneReviews baseline: PMID:20301503 (Disorders of Intracellular Cobalamin Metabolism) fetched, tagged GeneReviews in top-level references, and its Agents/Circumstances to Avoid section curated as a treatment entry (nitrous oxide, prolonged fasting, methionine restriction).

    Seven-node pathograph from MTRR loss of function, through methionine synthase trapped in the oxidised cob(II)alamin state, to erythroid, endothelial and white-matter consequences. The cblE-vs-cblG in vitro discriminator (PMID:2688421) is curated on the trap node, and MTRR minigene rescue (PMID:15714522) is curated as functional confirmation.

    Judgement calls worth flagging for review:
    - Three PMIDs surfaced by search were dropped because their cached records carry no abstract text (PMID:9323567, PMID:35122617, PMID:38217084). No snippet could be quoted from them, so nothing was cited to them.
    - Macrocytic anemia was graded OCCASIONAL rather than VERY_FREQUENT, deliberately against the narrative reviews, on the strength of PMID:15714522 reporting macrocytosis in only 3 of 9 molecularly confirmed patients. The reasoning is recorded in the phenotype notes.
    - Cerebral atrophy frequency comes from a cohort that pools cblE and cblG (PMID:25526710); the notes say so rather than presenting it as a cblE-specific figure.
    - A HUMAN_MODEL_MISMATCH discussion records that the Mtrr gene-trap mouse (PMID:18413293) reports reproductive and cardiac phenotypes, not the megaloblastic anemia or neurocognitive disease that define the human disorder. Its FAILS_TO_RECAPITULATE link states explicitly that this is an absence of reported erythroid assessment rather than a documented negative marrow result.

    PMID:38736634 (2024) contributed an adult-onset hemolytic anemia phenotype, an adult-complications progression phase, and the LDH-monitoring / hydroxocobalamin dose-escalation point. It is graded VERY_RARE and its notes record that one of the two siblings had a concurrent parvovirus B19 infection, so the hemolysis and the viral trigger are not cleanly separable in that patient.

    Validation: just validate-disorders passes (schema, terms and references), 88/88 snippets verified against the cache. Also run: check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-empty-snippets, check-environmental-evidence. Five snippets initially failed check-snippet-length and were widened to full sentences rather than grandfathered.

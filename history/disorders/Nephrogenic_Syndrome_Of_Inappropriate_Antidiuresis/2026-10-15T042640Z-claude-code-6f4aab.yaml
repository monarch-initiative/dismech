  summary: 'Create: Nephrogenic Syndrome of Inappropriate Antidiuresis'
  details: |
    De novo curation of NSIAD (MONDO:0010356), the AVPR2 gain-of-function mirror of X-linked nephrogenic diabetes insipidus. The claude_code deep-research report was thin (57s, 2 web searches, only 2 of its PMIDs self-verified) and used strictly as leads; all literature work was done independently via NCBI E-utilities. Backbone PMIDs: 15872203 (Feldman NEJM 2005, R137C/R137L constitutive activation, undetectable AVP, named the syndrome), 22956819 (Carpentier JASN 2012, F229V, no spontaneous desensitization, tolvaptan/satavaptan silence it), 26131744 (Erdelyi Kidney Int 2015, I130N, constitutive cAMP, biased conformation, beta-arrestin-independent internalization), 22722264 (Vandergheynst 2012, fluid restriction + urea, vaptan non-response, furosemide), 30962325 (Miyado JASN 2019, germline GNAS Gsalpha GOF as a separate NSIAD cause, recorded as differential not folded in since MONDO term is AVPR2-defined). 12-node atomic pathophysiology chain from germline AVPR2 variant through ligand-independent V2R activation, constitutive adenylyl-cyclase cAMP, PKA-AQP2 phosphorylation, apical AQP2 insertion, collecting-duct water permeability, free water reabsorption/retention, physiologic AVP suppression, hypotonic hyponatremia, to cerebral water shift; plus a receptor-internalization branch. All 9 phenotypes causally wired (100%). Validated: just validate PASS, validate-terms PASS, 29/29 snippets verified, entity-refs/causal-targets/dup-keys/qualifier-terms/coarse-phenotypes/block-scalar all clean, GeneReviews NO_CHAPTER confirmed offline. preflight-dr WARN only for GNAS second-gene mentions (expected; handled as differential). Coordinator review pass before the PR: replaced two evidence items that did not support their claims (the cerebral-water-shift node and the Hyponatremia phenotype), added cited evidence for seizure/irritability/vomiting from PMID:29472987, 20631022 and 27355191, replaced an unsourced Lethargy phenotype with Hypotonia (named in PMID:29472987), dropped an unsourced Cerebral edema phenotype, added the L312S variant (PMID:27355191), and added Decaux 2010 (PMID:20631022) urinary AQP2 non-suppression as in-vivo evidence on the apical AQP2 node. Final: 37/37 snippets verified, 8/8 phenotypes connected, just validate-disorders passed with 0 issues. Review round 1 (ai4c-reviewer, changes requested): added a diagnosis section (water-load test with AVP/copeptin pitfall at urine osm 241, and AVPR2 sequencing), an environmental free-water-load entry linked to Free Water Retention (EXACERBATES), evidence on the Low serum osmolality and Inappropriately concentrated urine phenotypes, five adult-onset symptoms (malaise, dizziness->Vertigo, confusion, fatigue, headache) wired off Hypotonic Hyponatremia with ADULT onset and INFANTILE onset tagged on the infant symptoms, a carrier-female hyponatremia line plus the blurred-recessive caveat on inheritance, furosemide/NaCl therapeutic_agent bindings with demeclocycline and NaCl-alone outcome evidence, the GO binding on the permeability node corrected to GO:0070295 renal water absorption, and node-level evidence on Hypotonic Hyponatremia. All sourced from papers already cached in the PR. Re-validated: 54/54 snippets, 13/13 phenotypes connected, just validate-disorders clean. CI fix: bound GO:0005000 vasopressin receptor activity (GAIN_OF_FUNCTION) on the AVPR2 variant node so the gene is grounded, matching the XNDI sibling; clears the check-gene-activity-grounding gate.

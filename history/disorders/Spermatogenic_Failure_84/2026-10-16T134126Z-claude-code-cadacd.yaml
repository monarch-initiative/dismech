  summary: 'Create: Spermatogenic_Failure_84'
  details: |
    Created the SPGF84 entry for CFAP61-related male infertility (MONDO:0957301). Sources: a claude_code deep-research report (research/Spermatogenic_Failure_84-deep-research-claude_code.md, preflight WARN only because 'OAT' was read as a gene symbol; it is the abbreviation oligoasthenoteratozoospermia) used as leads only, plus PubMed searches. Evidence: Ma 2021 (three Pakistani families, 11 men, refetched as full text), Liu 2021 (splice allele plus knockout mouse), Hu 2023 (compound heterozygous carriers with OAT, ICSI live birth), Barbotin 2024 (splice allele, chromatin condensation defect, ICSI without pregnancy), Huang 2020 (independent knockout) and Tetrahymena CSC structure. Pathograph mirrors SPGF33/SPGF51 with the same CSC node names; the axonemal node adds central apparatus and inner dynein arm components and links to HP:0033525. Oligozoospermia is recorded with SUPPORT (OAT cohort) and REFUTE (normal counts in most of the family series) items; a CANONICAL hypothesis records the absence of PCD features with a Tetrahymena REFUTE item. A Leydig-cell knockdown study (PMID:37982895) was deliberately not used. ClinGen has not classified the pair and there is no GeneReviews chapter. All validation recipes passed, including validate-disorders. Stub deleted.

  summary: Add gene-anchored SCDO1-SCDO6 subtypes; pin STD/Jarcho-Levin to MESP2
  details: |
    Added a has_subtypes list to Spondylocostal_Dysostosis.yaml with the six numbered SCDO types, each grounded on its own MONDO term and HGNC gene: SCDO1/DLL3 MONDO:0020692, SCDO2/MESP2 MONDO:0012097, SCDO3/LFNG MONDO:0012349, SCDO4/HES7 MONDO:0013366, SCDO5/TBX6 MONDO:0007389, SCDO6/RIPPLY2 MONDO:0014694. All six MONDO IDs, their labels, and their RO:0004003 gene relationships were verified against sqlite:obo:mondo. The SCDO2 subtype carries display_name and description text that explicitly pins the spondylothoracic dysostosis STD / Puerto Rican Jarcho-Levin phenotype to MESP2, with geography Puerto Rico and Cornier et al. 2008 PMID:18485326 as evidence; the SCDO1 and SCDO5 descriptions flag that MONDO carries the STD synonym on the DLL3 and TBX6 terms, which is the named-entity-confusion hazard tracked in issue #4957. The disease-level notes block was extended to point at the new subtype list. Evidence: PMID:10742114 DLL3, PMID:16385447 LFNG plus the SCD1/SCD2 numbering, PMID:15122512 and PMID:18485326 MESP2, PMID:23897666 HES7/SCD4, PMID:23335591 TBX6 autosomal dominant, PMID:25343988 and PMID:33410135 RIPPLY2/SCDO6. Two initially suspected PMIDs, 15211407 and 18567016, turned out to be unrelated papers on fetch and were discarded rather than cited. Validated with just validate, just validate-terms, and a whitespace-normalized substring check of every evidence snippet against its references_cache file.

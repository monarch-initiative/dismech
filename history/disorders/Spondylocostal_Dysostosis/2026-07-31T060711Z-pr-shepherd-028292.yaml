  details: |
    PR Shepherd pass addressing items 1 and 2 of the ai4c-reviewer CHANGES_REQUESTED review on PR #7173.

    Item 1 (claim-evidence mismatch, SCDO6). The PMID:25343988 evidence item on the SCDO6 subtype quoted a generic SDV-background sentence ("Segmentation defects of the vertebrae (SDV) are caused by aberrant somite formation...") that never names RIPPLY2, while its explanation claimed the item established the RIPPLY2 association. Replaced with the paper's own concluding sentence from the same abstract, which names the gene explicitly: "We conclude that compound heterozygous mutations in RIPPLY2 are associated with SDV, a new gene for this condition." No new literature fetched - the replacement quote comes from the already-cached abstract. Explanation extended to record why the original snippet could not license the claim.

    Item 2 (SCDO5 inheritance contradicted its own description). The SCDO5 subtype listed only Autosomal Dominant, but its description - and the already-cached GeneReviews PMID:20301771 - state that biallelic TBX6 variants also cause autosomal recessive SCDO. Added an Autosomal Recessive Inheritance block citing the GeneReviews genetic-counseling sentence, and gave the existing Autosomal Dominant block a description plus its own evidence item so both modes are queryable rather than reachable only through subtype prose. The AD evidence quote is the PMID:23335591 sentence already used at subtype level.

    Deliberately NOT addressed, left for the PR author or a human:
    - Review item 3 (add a top-level genetic: section for the six causal genes) is a substantive curation addition rather than a correction, and is outside a shepherd's remit.
    - Review item 4 (MONDO:0007389 resolving to both TBX6-Associated_Congenital_Scoliosis.disease_term and the new SCDO5 subtype_term) is a nosology call flagged for a human.


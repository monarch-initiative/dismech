  summary: 'Create: Progressive Myoclonic Epilepsy Type 7 KCNC1 MEAK'
  details: |
    Created new entry for progressive myoclonic epilepsy type 7 EPM7/MEAK MONDO:0014521, caused by the recurrent KCNC1 Kv3.1 c.959G>A p.Arg320His dominant-negative variant. Deep research: falcon attempted but EDISON_API_KEY expired, fell back to claude_code and openscientist providers; GeneReviews KCNC1-Related Disorders PMID:41411464 used as phenotype baseline. Curated dominant-negative LOF to impaired fast-spiking interneuron repolarization to cortical excitation-inhibition imbalance conforms_to epilepsy_excitation_inhibition_imbalance to myoclonus/seizures, plus cerebellar dysfunction/ataxia. Phenotypes: progressive myoclonus, ataxia, tonic-clonic seizures, cerebellar atrophy, cognitive decline, loss of ambulation, generalized polyspikes and photoparoxysmal EEG. Added R320H knock-in and Kcnc1/Kcnc3 mouse models with modeled_mechanisms, the AUT00206/AUT00201 Kv3-modulator precision therapy target_mechanisms ACTIVATES and trial NCT05873062, and a discussion of the paradoxical fever improvement. Validated with just validate schema+terms, 27/27 snippets verified, validate-disorders CI sweep passed, compliance 88 percent.

  summary: 'Create: Spondyloepimetaphyseal Dysplasia Krakow Type (MONDO:0032571)'
  details: |
    De novo curation of SEMD Krakow type.

    The gene is SIK3, not PISD. The claim issue (#11868) named PISD, which was wrong. MONDO:0032571 records no causal gene (RO:0004003), so preflight-dr returns SKIP and cannot discriminate; the assignment was made from the MedGen concept for OMIM 618162, which links to NCBI Gene 23387 (SIK3), and confirmed against the defining report (PMID:30232230). PISD causes a radiographically similar but mechanistically unrelated SEMD and also Liberfarb syndrome, which dismech curates separately; both PISD papers are carried in the differential rather than cited as this disease. The Perplexity deep-research report had the gene right where the issue body did not.

    Four pathophysiology nodes: R129C impairs SIK3 kinase activity; DEPTOR accumulates and mTORC1/mTORC2 activity falls; in parallel HDAC4 is retained in the nucleus and blocks MEF2/RUNX2-driven chondrocyte hypertrophy; the growth plate fails to mature.

    The two arms have different evidentiary status and the entry keeps that visible. The DEPTOR/mTOR arm is measured in the patient's own cells. The HDAC4 arm and the tissue-level growth-plate phenotype are from SIK3-null mice, graded MODEL_ORGANISM, and carry a HUMAN_MODEL_MISMATCH discussion plus a proposed experiment, because a null allele is not the human missense one and R129C reduces rather than abolishes activity.

    Three phenotypes (platyspondyly, metaphyseal dysplasia, epiphyseal abnormality) are curated with ontology bindings and no evidence item. They are the three components the disease name asserts, and no source consulted contains a quotable sentence describing them in the reported patient; the defining report is a mechanism paper whose abstract does not itemise skeletal findings. Quoting a PISD paper's platyspondyly sentence would attach a different disease's phenotype description to this entry.

    Disproportionate short stature is graded MODEL_ORGANISM for the same reason: the human stature phenotype appears in the sources only through the disease name.

    The eponym is an author surname (Deborah Krakow), not the city. Recorded in notes because it invites a wrong inference about the reported family.


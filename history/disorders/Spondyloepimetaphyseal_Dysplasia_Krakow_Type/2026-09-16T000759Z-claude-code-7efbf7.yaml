  summary: 'Review round 1: mine cached full text for clinical content'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review (4 critical, 2 important). Root cause of every finding: references_cache/PMID_30232230.md is full_text_xml and was mined for mechanism only, so the entry's clinical content stopped at the abstract and in three places asserted things the full text contradicts.

    Corrected the Platyspondyly binding (HP:0000926), which the source contradicts - it reports 'rounded vertebral bodies' and never says platyspondyly. Renamed the node to Abnormal Vertebral Body Form and bound HP:0003312 'Abnormal form of the vertebral bodies', the parent form term; HPO has no 'rounded vertebral bodies' term and HP:0003300 'Ovoid vertebral bodies' names a different shape, so the parent is the most specific accurate binding. Updated the bare-name downstream target in the same edit.

    Evidenced the metaphyseal phenotype from the radiographic-findings sentence. Added four previously absent clinical phenotypes, all 2/2 penetrant and all quotable: severe unclassified immunodeficiency (fatal in one sibling, EBV-induced tumour at 10), global developmental delay, brain MRI abnormality, and mild hypercalcaemia with normal PTH. Added the synonym 'Immunoosseous dysplasia, Krakow type'.

    Corrected the JMC differential and the semdk_jmc_convergence discussion, which said SEMD Krakow type is not reported with a calcium phenotype. It is; the discriminator is normal PTH versus JMC's suppressed PTH, a sharper contrast than the one written. Corrected 'one homozygous R129C proband' to two affected siblings in both the notes and semdk_human_arm_is_one_patient, and folded in the two further unconfirmed cases the report identifies. Rebuilt the HUMAN_MODEL_MISMATCH premise: SIK3 protein is decreased >60% in patient cells, so R129C is destabilising as well as kinase-impairing.

    Added the beta-TrCP/proteasome degradation route as evidence on the SIK3->DEPTOR edge.

    Declined one reviewer suggestion: the epiphyseal phenotype stays uncited. The full text's only epiphyseal sentence describes a literature-review case from a different consanguineous family, not the index siblings, so quoting it would misattribute another patient's findings.

    Deleted the notes paragraph claiming the defining report is an abstract that does not itemise skeletal findings - it is full text and does itemise them - and replaced it with a record of that error.

    Gates: validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading all pass. Snippets 13/13 to 21/21 verified. check-snippet-length caught two sub-5-word snippets on the first pass; both were extended to full propositional clauses.

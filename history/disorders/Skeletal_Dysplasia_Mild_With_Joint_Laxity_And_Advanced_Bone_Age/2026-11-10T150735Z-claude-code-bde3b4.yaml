  summary: 'Create: CSGALNACT1-Congenital Disorder of Glycosylation (SDJLABA)'
  details: |
    New entry for MONDO:0030029 (OMIM 618870), claimed in issue 16966.
    Named CSGALNACT1-Congenital Disorder of Glycosylation per the entry-naming
    skill: the MONDO label fails the scope test because advanced bone age and
    joint laxity also occur in ACAN, XYLT1, CANT1 and IMPAD1 disorders, and
    "CSGALNACT1-CDG" is the title term of PMID:31705726 and is cited by the
    ClinGen CDG GCEP record. The file slug keeps the MONDO-label form.

    Deep research: one OpenScientist report
    (research/Skeletal_Dysplasia_Mild_With_Joint_Laxity_And_Advanced_Bone_Age-deep-research-openscientist.md).
    The recipe's built-in term validation timed out on the EBI OLS service
    during the run; validate-research-reference and validate-research-terms
    were re-run afterwards and both completed. Reference validation: 11/11
    resolved, one flagged off topic (PMID:32608461, a synthetic-chemistry
    paper, not used). Term validation: 37 terms, 1 unresolved (HP:0003504,
    offered for advanced bone age), 4 obsolete (including GO:0030206 and
    HP:0001388), 8 mislabelled (including CHEBI:52396 for dermatan sulfate
    and UBERON:0004624 for growth plate). None of those CURIEs were used;
    every binding in the entry was looked up in the committed caches or OLS.
    preflight-dr: CSGALNACT1 is the canonical gene; the competing "CS" token
    is chondroitin sulfate.

    Sources: the three case reports (PMID:27599773, 31325655, 31705726; the
    last cached as full text and the source of the per-proband table), two
    knockout-mouse papers (PMID:21148564, 20812917) and the ClinGen Moderate
    (AR) assertion. Phenotype frequencies were omitted because there are only
    four probands; per-proband counts are in descriptions. Features of P3
    attributed by the source authors to her mosaic trisomy 8 were not curated,
    and the neurodevelopmental features seen only in P2/P3 are recorded with a
    KNOWLEDGE_GAP discussion. The tissue-level pathophysiology nodes rest on
    mouse data only, which the node descriptions and model links state.
    `just list-gene-validity` reports `overstated` (CAUSATIVE vs ClinGen
    Moderate); the tier is recorded in gene_disease_validity and the
    trade-off is stated in the genetic notes. No GeneReviews chapter exists
    (`just check-genereviews --online`: NO_CHAPTER). No treatments are
    curated because no management has been published for this disorder.

    Validation: just validate, validate-terms, count-verified-snippets
    (59/59), the whole-repo offline gates, and just validate-disorders all
    pass.

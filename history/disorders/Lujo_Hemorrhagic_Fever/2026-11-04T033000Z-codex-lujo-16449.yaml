  summary: "Create Lujo hemorrhagic fever entry"
  details: |
    Created a Lujo hemorrhagic fever entry from the OpenScientist report `research/Lujo_Hemorrhagic_Fever-deep-research-openscientist.md`. The report resolved 26 of 26 references and had no unresolved citations; its term-validation block was marked needs-review because several suggested labels were wrong, so ontology bindings were rechecked against the live OLS-backed validators and the local caches before curation. The automated named-entity preflight skipped gene discrimination because infectious MONDO:0017872 has no causal gene.

    The entry records Mammarenavirus lujoense/Lujo virus infection, the documented nosocomial transmission route, the five recognized cases in the 2008 outbreak, NRP2/CD63-dependent entry, Z-protein budding and S1P glycoprotein maturation, the first-week systemic syndrome, the second-week shock/DIC phase, LUJV RT-PCR, empiric ribavirin-containing therapy in the sole survivor, and three whole-animal LUJV models. The natural reservoir is intentionally omitted because the source abstracts still describe it as unknown.

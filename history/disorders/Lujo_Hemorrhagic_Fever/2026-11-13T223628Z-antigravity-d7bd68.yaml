  summary: Review and enrich Lujo Hemorrhagic Fever
  details: 'Added INFECTIOUS_DISEASES classification and agent_life_cycle host role (Homo sapiens NCBITaxon:9606
    as accidental host, with BACKGROUND/HUMAN_CLINICAL outbreak grading on PMID:41118368) to complement
    infectious_agent, transmission, and progression. Enriched pathophysiology with host entry and maturation
    genes and molecular_functions (hgnc:8005 NRP2 and hgnc:1692 CD63 with GO:0001618 virus receptor activity;
    hgnc:15456 MBTPS1 with GO:0004252 serine-type endopeptidase activity), moved vascular endothelial
    (CL:0000115) and mononuclear phagocyte (CL:0000113) cell types onto Systemic Arenaviral Illness conforming
    to viral_hemorrhagic_fever_syndrome#High Viremia and Vascular Target Infection, and added Delayed
    Innate Response and Inflammatory Cytokine Storm conforming to cytokine_storm_hyperinflammation#IL-6-Driven
    Systemic Cytokine Storm (PMID:41118368, PMID:25520505) upstream of Consumptive Coagulopathy and Shock
    (viral_hemorrhagic_fever_syndrome#Consumptive Coagulopathy). Connected all 12 phenotypes including
    Gastrointestinal symptoms (HP:0011024, SOURCE_UNSPECIFIED) and Late-stage neurological signs (HP:0000707,
    SOURCE_UNSPECIFIED), added Unbiased Viral Metagenomic Sequencing (NCIT:C101293) and Supportive Critical
    Care (NCIT:C15747), linked macaque and guinea-pig animal_models to the immunopathology node, and
    scoped out preclinical in vitro countermeasures in notes.

    '

  summary: 'Address PR #7814 review: entity-scoped management, GATAD1 binding'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7814 (raised twice - the
    intervening push was a main merge, not a fix, so both items were still open). Both blocking
    items and all three non-blocking suggestions are addressed.

    BRANCH REFRESH. The branch carried a `Merge branch 'main'` commit, which the reviewer flagged
    as a minor process note against CLAUDE.md's preference for rebase. Since a push was needed
    anyway, the branch was rebased onto origin/main instead: the merge commit is gone and the
    branch is now one content commit plus this fix commit on top of current main. The rebase
    conflicted only on cache/mondo/terms.csv, resolved by taking main's side and re-deriving this
    entry's rows with 'just validate-terms' rather than hand-merging. Post-rebase scope is
    unchanged and additive.

    BLOCKING item 1 - no treatments: or diagnosis: block. Added both, entity-scoped rather than
    imported from the HCM umbrella. The test applied to each candidate was whether it follows
    from this entity's defining feature (no identified disease allele) or from a phenotype this
    entry already curates from the kindred.

    diagnosis: (4 entries) - transthoracic echocardiography (NCIT:C16525), framed around the point
    that surveillance here is not one arm of screening but the whole of it, because no relative
    can ever be genetically discharged; cardiac MRI (NCIT:C16809), framed around the specific
    question of whether the disarray-negative histology from two individuals generalises;
    cardiomyopathy gene panel (NCIT:C15709), whose most important property in this entity is what
    it cannot do - a completely negative panel is the EXPECTED result in a genuinely affected
    CMH21 patient, and reporting it without that context invites the reader to conclude the family
    is unaffected; and phenocopy exclusion testing (Fabry GLA, amyloid free light chains and PYP,
    Danon LAMP2, PRKAG2), which is the highest-yield remaining workup for a sarcomere-negative,
    disarray-negative family and matters because several of those causes are treatable.

    treatments: (4 entries) - genetic counseling and lifelong cascade clinical screening
    (NCIT:C15240), carrying the three things easy to get wrong: 50% first-degree risk from
    four-generation dominant transmission, a negative panel not excluding a relative, and PGT-M
    and prenatal diagnosis being unavailable precisely because the locus is unsolved; ICD
    (NCIT:C80435), in scope because sudden death is documented in the kindred, with the honest
    caveat that established HCM sudden-death risk models are built on sarcomeric cohorts and may
    not transfer to an entity with one family, no event rates, and atypical histology; heart
    transplantation and advanced HF management (NCIT:C15246), in scope because affected members
    reached end-stage heart failure; and supportive/guideline-directed care (NCIT:C15747).

    EVIDENCE HONESTY IN THE NEW BLOCKS. Every item is either evidenced from PMID:16651466 - the
    only primary source for this entity - or explicitly marked as guideline-generic with no
    snippet claimed. PMID:38718139 (2024 AHA/ACC) and PMID:37622657 (2023 ESC) were fetched with
    'just fetch-reference' as the review asked, and then NOT cited as evidence, because neither
    carries quotable recommendation text: the AHA/ACC record has only AIM/METHODS/STRUCTURE
    sections and the ESC record has no abstract at all, only an author list. Both are carried in
    the top-level references block for provenance and named in the notes of the items that rest
    on them. Several evidence items are deliberately PARTIAL with the reason stated - e.g. the
    CMR and phenocopy items cite the paper's histology finding as the motivation for the workup
    while stating that the paper itself names no imaging or phenocopy test, and the ICD and
    transplantation items cite the documented events while stating that the paper evaluates no
    therapy and reports no event rate.

    BLOCKING item 2 - GATAD1 differential unbound. Added disease_term MONDO:0013848 (dilated
    cardiomyopathy 2B), verified with OAK before use. This turns the anti-NEC guardrail from prose
    into an assertion tooling can resolve, which matters for a disease in the high-NEC-risk
    numbered-series class: a future agent scanning 7q21 for cardiomyopathy genes can now resolve
    "different entity" rather than having to read the warning.

    SUGGESTION 3 (taken) - the OMIM myofiber-disarray conflict is now machine-queryable. Added a
    Myofiber Disarray phenotype bound to HP:0031318 carrying a supports: REFUTE evidence item with
    the verbatim "did not demonstrate myocyte disarray and fibrosis" quote, per the DR report's
    Curation Recommendation #4. The phenotype notes warn against converting it to SUPPORT on the
    strength of the OMIM synopsis, and state that the correct reading is "refuted in the only
    individuals examined" (n=2), not "established as absent across the entity". The tissue
    observation remains in histopathology where it belongs; this phenotype exists specifically to
    make the source conflict resolvable. Note HP:0031318 cannot be used as a histopathology
    finding_term - it is not reachable from the HistopathologyFindingTerm enum roots, its
    ancestors running through HP:0001637 rather than HP:0025461 - which is why the REFUTE item is
    curated as a phenotype rather than attached to the existing histopathology entry.

    SUGGESTION 4 (declined, with the reviewer's own reasoning) - the Ventricular Dilation and
    End-Stage Heart Failure node is left bundled. Splitting it would force an edge asserting the
    dilation-to-heart-failure ordering, which the entry's existing edge description correctly says
    the available data do not resolve. The reviewer marked it defensible on exactly this ground.

    SUGGESTION 5 (taken) - clinical_course: PROGRESSIVE added to the congestive heart failure
    phenotype descriptor.

    SCOPE NOTE. The entry notes now record the management scoping decision explicitly: what was
    included and why (consequences of the gene-less status, or of curated kindred phenotypes), and
    what was deliberately excluded - cardiac myosin inhibitors, because they are indicated for
    obstructive disease and inappropriate in the dilated low-EF phase this family traversed, and
    all sarcomeric mechanism/GWAS/mouse-model material, which would misrepresent the evidence for
    a sarcomere-negative, disarray-negative entity.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_21.yaml' - the
    batched pre-PR sweep CI runs, with --no-full-text - passed in full: schema "No issues found",
    terms "Validation passed", references "All validations passed" with "Snippets checked: 30/30
    verified against cached references", up from 21/21 before this session. All new ontology terms
    (MONDO:0013848, HP:0031318, NCIT:C15240/C80435/C15246/C15747/C16525/C16809/C15709) were
    verified with OAK before use.

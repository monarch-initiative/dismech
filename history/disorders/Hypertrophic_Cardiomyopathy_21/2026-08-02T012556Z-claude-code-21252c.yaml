  summary: 'Create: Hypertrophic Cardiomyopathy 21 (locus 7p12.1-q21)'
  details: |
    Created a locus-defined disorder entry for CMH21 (MONDO:0013852, OMIM:614676). This entity has NO identified causal gene: MONDO defines it by "region 7p12.1-q21 variation" and the anchoring publication (PMID:16651466, Song et al., Circulation 2006) is a single-kindred genome-wide linkage study (4 generations, 32 individuals; maximum 2-point LOD 4.11; disease interval D7S506-D7S3314, 27.2 Mb) in which sarcomere-gene sequencing was negative and myocardial histopathology in two members lacked myocyte disarray and fibrosis. The genetic block is deliberately curated WITHOUT a gene_term. Pathophysiology is a deliberately short three-node chain (unidentified 7p12.1-q21 allele, then non-sarcomeric LVH, then ventricular dilation and end-stage heart failure) using INDIRECT_UNKNOWN_INTERMEDIATES edges; the terminal node declares conforms_to cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure. Four discussions record the open items: KNOWLEDGE_GAP for the unidentified causal gene, with a whole-genome-sequencing reanalysis proposed experiment; INTERPRETATION explicitly rejecting GATAD1 (7q21.2, autosomal recessive DCM, PMID:21965549) as a candidate on the basis of mere regional overlap; OPEN_QUESTION on whether a single unreplicated kindred supports a distinct entity; and CURATION_TODO on OMIM/MedGen clinical-synopsis features (atrial fibrillation, mitral valve prolapse) that cannot be snippet-verified from the paywalled full text, plus the synopsis listing of myofiber disarray that contradicts the primary paper. Deep research: the falcon/Edison provider was unavailable in this environment (no EDISON_API_KEY or FUTUREHOUSE_API_KEY), so the claude_code provider was used; its report independently concluded the locus remains unsolved and named no gene. All three PMIDs (16651466, 21965549, 20301725) were fetched with just fetch-reference and every snippet verified against the cached abstract. No CMH21-specific GeneReviews chapter exists; the parent-disease overview PMID:20301725 is tagged GeneReviews in the top-level references for completeness. Validation: just validate PASS, just validate-references PASS with 21/21 snippets verified, just validate-terms PASS; compliance 90.6 percent global and 92.0 percent weighted.

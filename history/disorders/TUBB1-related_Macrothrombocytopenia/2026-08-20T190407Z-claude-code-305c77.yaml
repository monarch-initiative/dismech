  summary: 'Create: TUBB1-related Macrothrombocytopenia'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified with just count-verified-snippets; just validate and just validate-terms pass.

    The haematological tubulinopathy. Beta-1 tubulin builds the platelet circumferential marginal microtubule band; variants leave it undetectable with frayed, disorganised microtubules, and diminish proplatelet formation to give fewer but larger platelets.

    Curated with a second tissue arm: TUBB1 is expressed in developing and adult thyroid, TUBB1 variants co-segregate with thyroid dysgenesis in three families, and Tubb1 knockout mice show impaired thyroid migration and hormone secretion. A discussion records that the reciprocal screening has not been done - thyroid-ascertained patients were checked for the platelet phenotype and had it, but macrothrombocytopenia-ascertained patients have not been screened for subclinical thyroid disease, which is the clinically urgent direction.

    functional_impact_category is LOSS_OF_FUNCTION, not the DOMINANT_NEGATIVE used for TUBA1A/TUBB3/TUBB8: mutant beta-1 tubulin is NOT incorporated into microtubules, whereas the dominant-negative tubulins are incorporated and poison the polymer from inside.

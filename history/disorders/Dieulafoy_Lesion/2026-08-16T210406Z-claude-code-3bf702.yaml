  details: |
    Removed the Hypertension, Chronic Kidney Disease, and Diabetes Mellitus environmental: entries (dismech#8302, the Dieulafoy_Lesion instance flagged in the tracker). All three cited only a within-case comorbidity prevalence sentence from a 101-case systematic review (PMID:35243119) and had no route to either of the entry's two pathophysiology nodes (both describe the congenital vascular anomaly itself, not acquisition or triggering) -- the same category error #8185 tracks. Re-modeled as three disease-disease comorbidity entries (kb/comorbidities/com_Essential_Hypertension__Dieulafoy_Lesion.yaml, com_Chronic_Kidney_Disease__Dieulafoy_Lesion.yaml, com_Diabetes_Mellitus__Dieulafoy_Lesion.yaml), directionality/effect_direction UNKNOWN since the only source is an unadjusted within-case proportion (mean age 66+-17) with no comparison population and no proposed mechanism -- per the dismech#8195 review precedent against overclaiming a directed RISK signal from within-case prevalence alone.

  summary: Record 2 entry-relative no-link decisions on environmental entries
  details: |
    Backfill for issue #8085. No pathograph link was added. This records, in the entry's own review_notes: field, that the exposure is deliberately left unlinked, and the reason specific to this entry.

    Entries dispositioned (2):
      - Hypertension
      - Diabetes Mellitus

    Hypertension: The cited sentence is a comorbidity prevalence table from a case series, hypertension in 29%, and reports what patients had rather than what it did. The lesion modeled here is a caliber-persistent submucosal artery, a congenital vessel, and no cited sentence connects blood pressure to it or to its erosion.

    Diabetes Mellitus: The cited sentence is a comorbidity prevalence table from a case series, diabetes in 21%, and reports what patients had rather than what it did. It is the same sentence that supports the Hypertension entry in this file, and it distinguishes neither.

    The reason is entry-relative, not categorical. An earlier version of this change asserted that a host state or demographic cannot originate a pathograph edge. The reviewer on PR #10980 showed that claim is false as a description of this knowledge base, and a scan confirmed it: 58 host-state or demographic exposures are already linked across 40 files, including Osteoarthritis (Age to Chondrocyte Senescence), Endometrial_Carcinoma (Obesity to Unopposed Estrogen Signaling) and Heart_Failure (Hypertension to Ventricular Remodeling). Writing the categorical rule into many entries would have propagated it. Each disposition now names what this entry's own evidence and nodes lack.

    Seventeen entries from the earlier version were dropped from this change entirely, because they have a node the exposure plausibly acts on and a sibling precedent: they belong in a linking tranche, not a disposition. Carotid_Stenosis is the clearest, since Carotid_Artery_Occlusion links the identical exposures to a node of the identical name.

    review_notes rather than notes: `notes:` is disease content and renders on the public disorder page, `review_notes:` is the curation record and renders nowhere. The docstring of scripts/check_environmental_evidence.py states that split. The waiver sentinel is a prefix match on a different sentence, so these do not trip it and the waiver count is unchanged at 4.

    Nothing was deleted, moved or regraded. No entry carried review_notes before and notes: was left untouched, so the change is insertion-only: 172 insertions and 0 deletions across 12 files.

    Validation: linkml-validate passed on all 12; count-verified-snippets 439/506 verified with 67 skipped by prefix and none failing; check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-environmental-evidence, check-folded-hyphens, check-title-snippets and check-snippet-length all OK.

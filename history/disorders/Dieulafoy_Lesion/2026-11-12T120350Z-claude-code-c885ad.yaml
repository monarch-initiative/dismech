  summary: Review, enrich, and address Round 1 PR review findings for Dieulafoy_Lesion
  details: |
    Initial enrichment added MONDO synonyms, Harrison GASTROINTESTINAL classification, 4-node vascular pathophysiology cascade, overt GI hemorrhage phenotypes, EGD/colonoscopy/angiography diagnostics, and hemostatic treatments. Round 1 PR review follow-up documented the congenital-vs-acquired etiological uncertainty in description and notes (quoting PMID:25901208), added structured epidemiology entries (1.5% upper GI and 3.5% jejunoileal bleeding shares, 2:1 male predominance and sixth/seventh-decade peak, and mortality decline from ~30% to 9%-13%), added early (<72 h) recurrence progression and NSAID/anticoagulant bleeding-promoting environmental factors, backed GO:0007596 blood coagulation with EGD adherent-clot evidence (PMID:37425531), renamed Mesenteric Angiography to match catheter-angiography evidence, updated procedure therapeutic_modality to OTHER, added the banding perforation caveat, and pruned three generic non-variceal upper GI bleeding references.

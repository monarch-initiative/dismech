  details: |
    Answers the 2026-11-06 review of PR 16685. Added a definitions entry for the 2019 ASTCT consensus CRS definition and grades 1 to 5 (DIAGNOSTIC_CRITERIA, ESTABLISHED_CRITERIA), each criterion quoted verbatim from the cached PMID:30592986 and graded HUMAN_CLINICAL / PRIMARY_RESULT to match how the entry already grades that paper. Marked the two PMID:42500657 items quote_role BACKGROUND, since both quote its introduction; list-background-citations Tier A now reports nothing. Added a Prophylactic Tocilizumab treatment citing the 704-patient meta-analysis (PMID:42485270, RR 0.29 for all-grade CRS, no loss of response) and a low-dose comparative cohort (PMID:42036267, 21% vs 55%), both newly fetched; the description states that the population is bispecific-treated myeloma, not CAR-T, and that grade 2 or higher reduction was not significant. Extended the first corticosteroid snippet leftward to keep its subject. Not taken: siltuximab, serum IL-6 biomarker, environmental trigger, ATG/TGN1412 scope and mortality (review suggestions 4, 5, 7, 8, 9), left for follow-up. Validated with just validate (65 snippets, 0 issues), check-snippet-grading, check-snippet-length, check-reference-titles, check-title-snippets, check-causal-targets, check-entity-refs, check-enum-values and check-duplicate-keys.

  summary: Correct the denominator on the prophylactic tocilizumab risk ratio
  details: |
    Fixes one evidence explanation in the Prophylactic Tocilizumab treatment, flagged as a non-blocking nit in the approving review on PR #16685 and verified here against the cached abstract. The explanation read 'Pooled estimate across 704 bispecific-treated myeloma patients', which attributes the RR 0.29 all-grade CRS risk ratio to a denominator that is not its own: PMID:42485270 reports 'Eight studies encompassing 704 patients were included, comprising 5 cohorts and 3 single-arm trials' and separately 'Meta-analysis of 3 comparative studies demonstrated' the risk ratio. The 704 figure is the whole review; the risk ratio comes from the 3 comparative studies, and the abstract reports no patient count for that subset. The snippet directly above the explanation already said '3 comparative studies', so the entry contradicted itself. Reworded to attribute the estimate to the 3 comparative studies, to give 704 as the full review's total across 8 studies, and to state that no count is reported for the comparative subset, rather than inventing one. The snippet is unchanged and was already exact. No other use of 704 or of the pooled figures in the entry needed correction; the treatment description was checked and is accurate on population, study designs and the non-significant grade 2 or higher result. Branched fresh from origin/main at 6f0de29a1 because PR #16685 is merged and a merged PR cannot carry follow-up work. Validation: just validate-disorders passed with 0 issues over 65 snippets and 74 titles; check-block-scalar-comments, check-duplicate-keys, check-folded-hyphens, check-retired-support-prose, check-snippet-length and check-reference-titles all clean with no baseline additions. Two stale untracked reference caches from the earlier session were removed before branching; main's committed copies are strictly richer, carrying PMC full text where the local copies were abstract-only.

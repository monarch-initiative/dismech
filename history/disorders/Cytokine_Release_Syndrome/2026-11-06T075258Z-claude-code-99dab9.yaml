  summary: 'Create: Cytokine Release Syndrome'
  details: |
    Created the entry for cytokine release syndrome (MONDO:0600008), previously uncurated despite being one of the three convergent routes named in the description of kb/modules/cytokine_storm_hyperinflammation.yaml. Seven-node causal chain from effector-cell antigen engagement through effector TNF, host myeloid IL-1/IL-6 amplification, systemic hypercytokinemia and endothelial activation to distributive shock, with a separate neurological arm. Six conforms_to links: five to cytokine_storm_hyperinflammation and one to il6_hypercytokinemia#Sustained Interleukin-6 Oversupply. Deep research: falcon was requested but has no key in this environment, so the run used --fallback and openscientist produced the report (research/Cytokine_Release_Syndrome-deep-research-openscientist.md, fell_back recorded in its frontmatter). Its reference_validation and term_validation both set needs_review: no CURIE was taken from it, since it offered HP:0040233 for Hyperferritinemia (that CURIE is Factor XIII subunit A deficiency) and HP:0100763 for Edema; every term in this entry was resolved against OLS at the point of writing. Its one unsupported quote was a truncation artifact rather than a fabrication. just preflight-dr returns SKIP because MONDO records no causal gene for a non-Mendelian entry; the report's top term is CRS, confirming subject. ICANS is modelled as a downstream arm with a KNOWLEDGE_GAP discussion rather than a separate entry, because MONDO carries no ICANS term and the ASTCT panel calls its pathophysiology unclear and distinct from CRS. Effector-derived TNF as upstream initiator is recorded as a mechanistic_hypotheses group at status EMERGING, not as part of the canonical chain, because the evidence is humanised-mouse. CRP and ferritin use reports_on/CORRELATES_WITH rather than causal edges, which deliberately does not improve the connectivity metric. Validation: just validate passed with 0 issues and 60 titles checked; count-verified-snippets 53/53; validate-terms passed; check-snippet-grading clean including cross-file, run locally because CI skips it on a kb-only PR; check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-logical-rules, check-name-collisions, check-shared-disease-terms all clean with no baseline additions; check-gene-validity raises nothing for this file; model-scale-audit 3/3 links scale-aligned with typed divergences; check-conformance-content 6 links, 0 process_absent; causal_inlink 81.2 percent; compliance 86.5 percent; check-genereviews NO_CHAPTER, correct for an iatrogenic syndrome. A pre-PR red-team review pass found and fixed: a hypoxia-grading snippet that described the prior CARTOX system rather than the ASTCT consensus; a corticosteroid claim whose evidence quoted a historical concern the panel rebuts one sentence later; four Gust snippets whose subject clause had been stripped, presenting severe-neurotoxicity-subgroup findings as general CRS facts; an unsourced GO:0032609 interferon gamma binding, now removed with the gap recorded in notes; a single evidence item spanning clinical and in vitro results, now split; and the top-level description stating a mouse result as human fact.

  summary: 'Address the five non-blocking follow-ups from the PR #16685 approval'
  details: |
    Works the five follow-ups the approving review on PR #16685 left open (its findings 4, 5, 7, 8, 9), on a fresh branch because that PR is merged. Finding 4, siltuximab: added as a Pharmacotherapy treatment with NCIT:C61084 and a target_mechanisms link to Systemic Hypercytokinemia, distinguishing direct IL-6 binding from the receptor blockade tocilizumab provides. Important provenance note: the deep-research report names siltuximab in exactly one place, a treatment table row with no citation, and the only identifier it offers is NCIT:C67256, which is the CURIE that report's own term_validation block listed under unresolved_terms. It does not exist in NCIT. Checked that independently via OLS before writing anything. Nearly every other NCIT id in that same table is also wrong: NCIT:C564 for dexamethasone is Ifosfamide, NCIT:C47657 for anakinra is Penicillin G Benzathine, NCIT:C128055 for emapalumab is Cervical Yolk Sac Tumor, NCIT:C82737 for ruxolitinib is MIR92A1 Pre-miRNA; only the tocilizumab row is right. So siltuximab was sourced from scratch rather than from the report: PMID:40176077, a 118-patient retrospective paediatric and young-adult CAR-T series, fetched and verified, which reports 19/65 treated patients receiving siltuximab, mostly for tocilizumab-refractory CRS. No efficacy claim is recorded because the study reports use, not a controlled comparison. The other agents in that table, emapalumab, ruxolitinib and hemoadsorption, were deliberately left out: they are for refractory IEC-HS or HLH-like disease, which this entry does not model. Finding 5, serum IL-6: added a biochemical record bound to NCIT:C20451 plus LOINC:26881-3, which was already in cache/loinc/terms.csv so it validates offline and needed no loinc-seed-cache run. Its readout to Systemic Hypercytokinemia is PREDICTS and PROGNOSTIC rather than READOUT_OF, because what PMID:29025771 establishes is that an early IL-6 peak forecasts neurological severity, not that the measurement reads out the node's state; both arms of the 5-of-5 versus 2-of-11 contrast are quoted so the timing rather than the magnitude is visible as the predictive feature. D-dimer and APTT were not added, having no cited figures in the sources held here. Finding 7, environmental: two entries rather than one, both TRIGGERS onto Effector Cell Engagement of Target Antigen, so the pathograph's initiating step is the drug administration it actually is. ECTO was searched through the OLS ECTO index, which serves 19657 terms, and every query is recorded verbatim in each entry's notes with its result. exposure to antineoplastic agent ECTO:9001737 covers the CAR-T and bispecific route; exposure to immunosuppressive agent ECTO:9001747 covers anti-thymocyte globulin as conditioning for a non-malignant indication. Nine further queries returned nothing, including monoclonal antibody, immunotherapy, cell therapy, antibody, chimeric antigen receptor, antithymocyte and iatrogenic exposure. Both CURIEs were already in cache/ecto/terms.csv. Both entries needed entry-level evidence as well as link-level evidence: check-environmental-evidence failed on the first attempt because only the links were cited, and the two layers are different claims, so each entry now carries a distinct entry-level quote. No waiver was used; real citations exist. Findings 8 and 9 were solved by one reference, PMID:42925737, ATG-triggered CRS in 91 systemic sclerosis autologous HSCT patients graded by ASTCT criteria. It gives the scope evidence the entry previously asserted without support, since notes claimed the entry is not scoped to one product while every mechanistic source was CAR-T or bispecific, and it gives the complete grade distribution including 2.2% grade 5. Its own caveat travels with the figure in three quotes: grading rested solely on respiratory criteria in 61.0% of grade 2 or higher cases, and the authors attribute that to pre-existing systemic sclerosis cardiopulmonary disease and conditioning fluid load rather than inflammation alone, proposing a distinct CRS phenotype, so the 89.0% rate is explicitly recorded as not comparable with the CAR-T figures. clinical_burden is VARIABLE, not LOW, and cites PMID:42178058, a 560-patient three-centre CD19 CAR-T cohort in which CRS severity was not independently associated with non-relapse mortality, survival or progression beyond day 30 while grade 3 or higher ICANS was, with the authors' own qualification that severe CRS may still contribute to early treatment-related mortality quoted so the negative finding is not read as CRS being prognostically inert. That asymmetry is recorded in notes as a second reason to keep the neurological arm prominent. The TGN1412 anti-CD28 superagonist route was considered and deliberately not given its own environmental entry, because the account rests on a single six-volunteer incident with a withdrawn compound; notes says so rather than leaving the omission silent. The unsourced effector-cell interferon gamma gap recorded in the previous session is unchanged and still recorded. Validation: just validate-disorders passed with 0 issues over 80 snippets and 92 titles, up from 65 and 74; count-verified-snippets 80/80; check-environmental-evidence passes after the fix described above; list-background-citations reports 0 findings in all three tiers, including the deterministic Tier A the reviewer used; check-snippet-grading clean including cross-file, run locally because CI skips it on a kb-only PR; environmental-term-audit shows both new exposures BOUND and pathograph-linked; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-qualifier-terms, check-logical-rules, check-coarse-phenotypes and check-name-collisions all clean with no baseline additions; causal_inlink 81.2 percent unchanged; compliance 89.1 percent. One unrelated observation not acted on: check-name-collisions reports that a grandfathered baseline row for Sarcoglycanopathy no longer collides and could be removed, which belongs in its own change rather than here.

  summary: 'Create: Long_QT_Syndrome_1'
  details: |
    New standalone entry for long QT syndrome 1 (MONDO:0100316), the KCNQ1-related form previously present only as the Type 1 has_subtypes row of Familial Long QT Syndrome. Curated a causal chain from heterozygous KCNQ1 loss of function (haploinsufficiency and dominant-negative classes) through reduced IKs repolarization reserve, an LQT1-specific sympathetic-activation trigger node, failed action-potential shortening under beta-adrenergic stimulation, prolonged action potential, early afterdepolarizations and torsades de pointes, reaching all 8 phenotypes. Genetic record cites the ClinGen KCNQ1 Definitive assertion, which is curated against MONDO:0002442 rather than this disease term, so it was cited as evidence and not copied into gene_disease_validity. Recorded the allelic relationship with JLNS1 and recessive LQT1 without deafness, founder variants A341V and R518X, beta-blocker, LCSD, ICD, trigger/drug avoidance and investigational KCNQ1 suppression-replacement gene therapy, and an iPSC cardiomyocyte model. Literature was limited to the existing reference cache because PubMed was unreachable from the curation environment; every snippet was verified against cached text (just count-verified-snippets 74/74) and terms were checked with just validate-terms. The LQT1-specific broad-based T wave was not asserted because no cached source states it.

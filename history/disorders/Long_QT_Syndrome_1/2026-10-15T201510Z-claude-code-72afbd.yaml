  summary: 'Recheck against deep research: Long_QT_Syndrome_1'
  details: |
    Rechecked the entry against research/Long_QT_Syndrome_1-deep-research-claude_code.md (preflight-dr PASS for MONDO:0100316 / KCNQ1). The report was written from background knowledge without lookups and was used only as a list of leads. Added: (1) PMID:17470695 (Moss 2007, 600 LQT1 registry patients) on the KCNQ1 variant node: transmembrane vs C-terminus and dominant-negative vs haploinsufficient variants each raise event risk. (2) PMID:8900283 (Sanguinetti 1996) on the IKs node: KvLQT1 coassembles with minK to form IKs. (3) PMID:15367556 (Priori 2004) on beta-blocker therapy: 10% breakthrough events in LQT1 vs 23% LQT2 and 32% LQT3. (4) NOS1AP as a MODIFIER genetic record, PMID:19822806 (Crotti 2009, South African KCNQ1 A341V founder population). (5) An environmental entry for physical exercise (ECTO:6000002) with a TRIGGERS link to Sympathetic Activation Trigger, citing PMID:11136691 and PMID:18606002. (6) An animal_models entry for the transgenic KCNQ1 Y315S rabbit (PMID:18464931) linked to the IKs and action-potential nodes. Deliberate omissions: LQTS prevalence (1:2000, Schwartz 2009) is LQTS-wide and belongs on the Familial Long QT Syndrome umbrella; JLNS1 deafness, stria vascularis branch and the Kcnq1 knockout mouse belong to the separate JLNS1 entry; seizure, palpitations and sinus bradycardia lacked an LQT1-specific source; age/sex risk pattern, Schwartz score, ESC 2022 criteria and the 1-2-3 LQTS-Risk calculator are cross-genotype LQTS material for the umbrella; KCNE1 D85N modifier and further founder variants (Finnish G589D) not sourced; LQT1 rabbit spontaneous torsade/sudden death claim is contradicted by the Brunner 2008 abstract, which reports sudden death only for LQT2 rabbits; QT-prolonging drug and electrolyte exposures already covered under trigger-avoidance treatment; mexiletine/ranolazine are LQT3 therapies; no LQT1 clinical trial identifiers verified. Several report PMIDs resolve to unrelated papers (11208699, 9140400, 8900284, 8589714, 19841300) and CHEBI:7445 is nafarelin, not nadolol (entry already uses CHEBI:7444). Validated with just validate, validate-terms, count-verified-snippets (83/83) and validate-disorders (0 issues).

  summary: 'Curate phenotypes: Long QT Syndrome 1'
  details: |
    Added four phenotypes (Palpitations, Arrhythmic Seizure, T-Wave Alternans, and an excluded Hearing impairment negative contrasting LQT1 with JLNS1). Enriched Prolonged QTc Interval (R518X and A341V founder QTc data), Syncope (childhood onset, recurrent temporality, age 7-20 risk window, sex crossover at 13, allele-dependent event rates) and Cardiac Arrest (A341V arrest/death counts). No disease-level frequencies were set because event rates range from 17% (R518X) to 82% (A341V). PubMed and Europe PMC were unreachable from the curation environment, so all evidence comes from already-cached full texts (PMID:17470695, 19822806, 24552659, 38825991, 18606002, 38790576, 39027806, 33498651) and ORPHA:101016. Notes updated for the Orphanet rows now cited, Orphanet-only leads (sinus bradycardia, hypokalemia), the frequency policy, and the GeneReviews Overview not being a usable baseline. Validated with just validate, validate-terms, validate-disorders (101/101 snippets), check-causal-targets, check-coarse-phenotypes, check-name-collisions, and check_snippet_length against origin/main.

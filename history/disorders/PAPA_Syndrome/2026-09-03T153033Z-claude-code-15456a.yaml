  summary: 'Create: PAPA Syndrome'
  details: |
    De-novo curation of PAPA syndrome (pyogenic sterile arthritis, pyoderma gangrenosum, and acne; MONDO:0011462; PSTPIP1/hgnc:9580, autosomal dominant). Deep research via 'just research-disorder claude_code' (report committed under research/). All references fetched with just fetch-reference and every snippet verified against the cache (30/30). Pathograph built as a causal chain: reduced PTP-PEST binding -> hyperphosphorylated PSTPIP1 -> increased pyrin binding -> pyrin-inflammasome (ASC speck) assembly -> IL-1beta overproduction -> neutrophilic sterile inflammation -> arthritis/PG/cystic acne/pathergy, plus a parallel cytoskeletal-adaptor branch. Anchor refs: Wise 2002 PMID:11971877 (CD2BP1 mutations; note the task-hinted PMID:12432392 was verified WRONG - a Nature neuroscience paper - and corrected), Shoham 2003 PMID:14595024 (pyrin binding, hyperphosphorylation, IL-1beta), Waite 2009 PMID:19584923 (ASC speck recruitment). A230T mouse model PMID:23293022 recorded as PARTIALLY_RECAPITULATES cytokine node / FAILS_TO_RECAPITULATE arthritis, with a HUMAN_MODEL_MISMATCH discussion. Treatments: IL-1 blockade (anakinra), TNF inhibition (etanercept/infliximab/adalimumab), corticosteroids. Deep-research errors caught and corrected during curation: HGNC:9581 (=PSTPIP2 paralog) -> hgnc:9580; HP:0031928 -> HP:0025452 (pyoderma gangrenosum); HP:0033798 (obsolete) -> HP:0040310 (sterile arthritis). No pyrin/IL-1 mechanism module exists in kb/modules and FMF declares no conforms_to, so none added. Validated: just validate, validate-terms, count-verified-snippets 30/30, check-causal-targets, check-duplicate-keys, check-entity-refs, check-qualifier-terms, and authoritative validate-disorders all pass.

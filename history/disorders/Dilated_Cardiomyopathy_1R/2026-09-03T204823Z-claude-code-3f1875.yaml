  summary: 'Create: Dilated Cardiomyopathy 1R (CMD1R, ACTC1)'
  details: |
    New Disease entry for MONDO:0013261 (CMD1R, ACTC1). entry_type decision: DISEASE - one conserved pathograph from an ACTC1 missense allele through altered thin-filament regulation to left ventricular dilation, its own MONDO term and OMIM 613424, and per-subtype DCM entries are settled convention here. Stub deleted.

    Named Entity Confusion handling. ACTC1 also causes hypertrophic cardiomyopathy, left ventricular noncompaction, atrial septal defect and a distal arthrogryposis syndrome, and those literatures are larger than the DCM one. The gene-level preflight passes trivially (ACTC1 mentioned 89 times) and is uninformative. The filter used instead was MONDO's own definition of this term - familial ISOLATED dilated cardiomyopathy - applied per citation. Three sources were excluded from the pathograph and moved to differential_diagnoses: PMID:31430208 (ACTC1 p.Gly247Asp kindred with penetrant atrial septal defect plus late-onset DCM - its myocardial ultrastructure and cardiomyocyte apoptosis work is genuine DCM mechanism but comes from a non-isolated phenotype, so the histopathology it would have supplied is deliberately not curated); PMID:37457373 (distal arthrogryposis with congenital heart defects, cited only for its one-sentence statement of the gene's allelic spectrum); and PMID:41033995 (LVNC in a patient also carrying COL4A4). Every pathophysiology citation is about a DCM-phenotype allele - R312H, E361G or A222Thr.

    Mechanism curated as three competing hypothesis groups rather than one story, because the ACTC1 literature genuinely disagrees: canonical calcium-desensitization (CANONICAL, carrying two REFUTE evidence items against itself), troponin-I phosphorylation uncoupling with loss of cardiac reserve (ALTERNATIVE, the E361G mouse, best in vivo support), and residual myosin activity under relaxing conditions (EMERGING, the 2022/2024 R312 work). A KNOWLEDGE_GAP discussion records that three laboratories measured R312H and disagree on the direction of the calcium-sensitivity shift, with the therapeutic consequence spelled out. A HUMAN_MODEL_MISMATCH discussion records that no human ACTC1 carrier has had contractile reserve measured.

    Evidential footing recorded explicitly: ClinGen grades ACTC1-DCM as Moderate (2025, DCM GCEP) against Definitive for ACTC1-HCM (2021, HCM GCEP). Both CGGV assertions are cited, the HCM one flagged directness INDIRECT and included solely to fix the asymmetry.

    No prevalence rate asserted - DCM cohort denominators are not ACTC1 denominators. Fatal infant outcome placed in progression rather than as a phenotype. No treatment carries a TreatmentEffectEnum value or a target_mechanisms link, since no CMD1R outcome data exist.

    Deep research: falcon provider, preflight-dr PASS. The report surfaced PMID:39759977 (de novo A222Thr infant case) and PMID:37457373, both used; it also surfaced the p.Gly247Asp ASD material, which is the contamination the entry fences off.


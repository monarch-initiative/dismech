  summary: 'Create: PARK7-Related Early-Onset Parkinson Disease (PARK-DJ1)'
  details: |
    De novo curation of autosomal recessive early-onset Parkinson disease 7 (MONDO:0011658, PARK7/DJ-1) for epic issue #1079. NEC preflight run first because the PARK numbered series is a high named-entity-confusion risk class: MONDO:0011658 verified with OAK to carry RO:0004003 HGNC:16369 PARK7, xref OMIM:606324, and the PARK7 synonyms; all evidence screened to exclude the locus-adjacent PARK2/PRKN and PARK6/PINK1 entities, with multi-gene source scope stated explicitly in each affected evidence explanation. Entry deliberately kept separate from the existing Parkinson's Disease entry MONDO:0005180, with the lump-vs-split rationale recorded in top-level notes. Pathophysiology curated as an explicit seven-node causal chain: biallelic PARK7 loss of function, via founder 14082 bp deletion and destabilising L166P missense, then loss of Cys106 redox sensing and cytoprotection, then impaired NRF2/KEAP1 antioxidant transcriptional response, then oxidative stress and mitochondrial dysfunction in nigral dopaminergic neurons, then nigrostriatal dopaminergic neurodegeneration, then striatal dopamine deficiency and basal ganglia circuit dysfunction; four nodes declare conforms_to against the parkinsonism_dopaminergic_degeneration module. The glyoxalase-vs-deglycase dispute is modelled honestly as two ALTERNATIVE mechanistic_hypotheses plus a CANONICAL redox-sensor hypothesis, with the dicarbonyl node and its downstream edge opting in via downstream hypothesis_groups rather than being asserted as settled, and a CONTROVERSY discussion carrying both the originating and the refuting evidence. Also curated: a HUMAN_MODEL_MISMATCH discussion for the DJ-1 knockout and parkin/DJ-1/PINK1 triple-knockout mice that retain normal nigral dopaminergic neuron counts, and a KNOWLEDGE_GAP discussion on the unknown synucleinopathy status from the single L172Q autopsy; all three discussions carry structured proposed_experiments. Prevalence uses the structured slots with a qualitative ULTRA_RARE band and no fabricated numeric rate; the gene share of early-onset PD is curated as three structured genetic case_fractions of 0.4 percent systematic review, 1-2 percent sporadic EOPD, and 5 percent Indian cohort with a pathogenicity caveat. Validation: just validate passes schema, term and reference validation with Snippets checked 74/74 verified against cached references. All 14 PMIDs fetched with just fetch-reference; no cache file was hand-written.

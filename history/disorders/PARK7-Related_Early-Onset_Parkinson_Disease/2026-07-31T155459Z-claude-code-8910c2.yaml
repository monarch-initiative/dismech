  summary: 'Create: PARK7-Related Early-Onset Parkinson Disease (PARK-DJ1)'
  details: |
    De novo curation of autosomal recessive early-onset Parkinson disease 7 (MONDO:0011658, PARK7/DJ-1) for epic issue #1079. NEC preflight run first because the PARK numbered series is a high named-entity-confusion risk class: MONDO:0011658 verified with OAK to carry RO:0004003 HGNC:16369 PARK7, xref OMIM:606324, and the PARK7 synonyms; all evidence screened to exclude the locus-adjacent PARK2/PRKN and PARK6/PINK1 entities, with multi-gene source scope stated explicitly in each affected evidence explanation. Entry deliberately kept separate from the existing Parkinson's Disease entry MONDO:0005180, with the lump-vs-split rationale recorded in top-level notes. Pathophysiology curated as an explicit seven-node causal chain: biallelic PARK7 loss of function, via founder 14082 bp deletion and destabilising L166P missense, then loss of Cys106 redox sensing and cytoprotection, then impaired NRF2/KEAP1 antioxidant transcriptional response, then oxidative stress and mitochondrial dysfunction in nigral dopaminergic neurons, then nigrostriatal dopaminergic neurodegeneration, then striatal dopamine deficiency and basal ganglia circuit dysfunction; four nodes declare conforms_to against the parkinsonism_dopaminergic_degeneration module. The glyoxalase-vs-deglycase dispute is modelled honestly as two ALTERNATIVE mechanistic_hypotheses plus a CANONICAL redox-sensor hypothesis, with the dicarbonyl node and its downstream edge opting in via downstream hypothesis_groups rather than being asserted as settled, and a CONTROVERSY discussion carrying both the originating and the refuting evidence. Also curated: a HUMAN_MODEL_MISMATCH discussion for the DJ-1 knockout and parkin/DJ-1/PINK1 triple-knockout mice that retain normal nigral dopaminergic neuron counts, and a KNOWLEDGE_GAP discussion on the unknown synucleinopathy status from the single L172Q autopsy; all three discussions carry structured proposed_experiments. Prevalence uses the structured slots with a qualitative ULTRA_RARE band and no fabricated numeric rate; the gene share of early-onset PD is curated as three structured genetic case_fractions of 0.4 percent systematic review, 1-2 percent sporadic EOPD, and 5 percent Indian cohort with a pathogenicity caveat. Sourcing provenance: NO deep-research artifact was generated. The entry was curated directly from primary literature located by targeted PubMed title/keyword search, a deliberate choice given the high named-entity-confusion risk of the PARK numbered series; several PMIDs recalled from memory during drafting turned out on verification to point at unrelated papers and were discarded and re-resolved by title search before use. The GeneReviews chapter PMID:20301402 is tagged in references but deliberately cited by no evidence item because its cached abstract is a bare purpose statement with no quotable clinical content, and there is no PARK7-specific GeneReviews chapter. Both decisions are recorded in the entry top-level notes.

    Validation history, stated accurately. The first commit on this branch was authored against a base predating commit 0729e8e5b, which removed the MAXO ontology from dismech and remapped treatment and diagnosis terms to NCIT. At that base, just validate passed all three steps including term validation. Against current main it did NOT: the single MAXO CURIE in this entry, MAXO:0000079 genetic counseling, failed the TreatmentActionTerm dynamic enum. This was caught by the automated PR reviewer on PR 7378 and fixed in a follow-up commit by remapping to NCIT:C15240 Genetic Counseling, after which just validate-terms passes again. This paragraph replaces an earlier version of these details that asserted term validation passed without that qualification.

    Automated review follow-ups also applied on PR 7378: the C. elegans glyoxal evidence item was retagged from IN_VITRO to MODEL_ORGANISM; the aggregate non-motor-burden phenotype had its over-broad HP:0000707 binding removed in favour of no term at all, keeping the free-text preferred_term and the evidence-backed FREQUENT band; diagnostic content was split out of treatments into a new diagnosis section with three records covering the sequencing-plus-exon-dosage requirement, clinical selection for recessive-gene testing, and documentation of levodopa responsiveness; the second prevalence record was demoted to a note because the 3.6 percent figure describes the parent early-onset PD population rather than this disease; the striatal/basal-ganglia node was retagged from ORGANISM to TISSUE scale; and a review-statement evidence item about the absence of human neuropathology was retagged from HUMAN_CLINICAL to OTHER.

    Final validation: just validate passes schema, term and reference validation, with Snippets checked 74/74 verified against cached references. All PMIDs were fetched with just fetch-reference; no cache file was hand-written or hand-edited.

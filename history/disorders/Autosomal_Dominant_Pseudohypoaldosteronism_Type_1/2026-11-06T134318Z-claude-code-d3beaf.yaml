  summary: 'Create: Autosomal_Dominant_Pseudohypoaldosteronism_Type_1'
  details: |
    New entry for NR3C2-related autosomal dominant (renal) pseudohypoaldosteronism type 1, MONDO:0008329. Deep research: one Perplexity report (research/Autosomal_Dominant_Pseudohypoaldosteronism_Type_1-deep-research-perplexity.md); its 5 extracted references all resolved, but 10 of 24 suggested ontology labels were mislabelled, so no CURIE was taken from it and all terms were looked up in the term caches or OLS. preflight-dr passed (NR3C2 named 116 times, OMIM:177735 matches). The report cited few primary papers, so the evidence base was built from PubMed searches: gene discovery (PMID:9662404), the Pujo 2007 cohort, Geller 2006 neonatal lethality and adult phenotype, functional studies of mutants, the MR knockout mouse, adult case-control studies of cardiovascular and HPA-axis effects, a microdeletion review, and case reports; ClinGen Definitive (CGGV assertion 8c78e824) and Orphanet ORPHA:171871 were cached through fetch-reference. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). Name kept as the MONDO label because no NR3C2-related name is established. HP:0003811 Neonatal death is outside the PhenotypeTerm enum, so neonatal mortality is recorded in the progression section. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), the whole-repo gates and validate-disorders.

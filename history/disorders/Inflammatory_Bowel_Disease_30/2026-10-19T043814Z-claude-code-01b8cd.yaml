  summary: Bind CARD8 molecular function to clear the gene-grounding CI gate
  details: |
    CI gate check_gene_activity_grounding failed on the approved head (615beae) because CARD8 was wired to the 'CARD8 T60 V44I Dominant-Negative Variant' node with no molecular function. Bound GO:0140678 molecular function inhibitor activity (DECREASED) on that node: GO defines it as inhibiting a target via non-covalent binding, which matches the cited PMID:29408806 finding that the mutant T60 CARD8 does not bind NLRP3 and inhibit its oligomerization. Label confirmed via OLS (runoak ols:go info). Re-ran just validate, just validate-terms and the gate against origin/main; all pass.

  summary: 'Create: Inflammatory_Bowel_Disease_30'
  details: |
    New entry for inflammatory bowel disease 30 (MONDO:0033643), CARD8 T60 V44I dominant-negative variant. Four-node pathograph (variant -> loss of CARD8 restraint on NLRP3 -> excess monocyte IL-1beta/IL-18 -> IL-1beta-driven intestinal inflammation), three nodes conforming to nlrp3_inflammasome_activation; four phenotypes, all causally connected; IL-1 blockade and anti-TNF treatments; two KNOWLEDGE_GAP discussions (single-kindred evidence and penetrance; NLRP1 de-repression and lack of a rodent model). Primary source Mao et al. 2018 (PMID:29408806), with the discovery group's review (PMID:30455704), CARD8-NLRP3 functional work (PMID:24517500), CARD8 T60-NLRP1 work (PMID:36426349) and a later VUS case (PMID:37724393). Deep research: falcon was requested and failed authentication (403); the automatic fallback to openscientist timed out after 3600 s and was cancelled; research/Inflammatory_Bowel_Disease_30-deep-research-claude_code.md was then run and used. Its 12 references all resolved; the entry cites 7 of them; one quote attributed to PMID:29408806 failed to match and was not reused; preflight-dr WARN on NLRP3 mentions, which are this disease's own mechanism. No GeneReviews or StatPearls chapter (check-genereviews --online NO_CHAPTER). A red-team review subagent then flagged a wrong fecal calprotectin binding (HP:6000502 serum term with an incorrect no-fecal-term note; rebound to HP:0034056), an over-specific abdominal pain phenotype (rebound to HP:0011458 Abdominal symptom), IL-1 blockade targeting the secretion node rather than the inflammation node, ex vivo monocyte evidence graded HUMAN_CLINICAL (now IN_VITRO), and an uncited meta-analysis claim (now PMID:26462578); all were fixed, IL-1 blockade was split into anakinra and canakinumab, treatment terms narrowed to NCIT:C15544 and NCIT:C15577, and the rodent caveat now cites PMID:32840892 (no murine CARD8 orthologue). Validated with just validate, count-verified-snippets (30/30), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes and validate-disorders. Deleted stubs/Inflammatory_Bowel_Disease_30.yaml.

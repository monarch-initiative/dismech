  summary: 'Review remediation: recalibrate WAGR mechanisms, phenotypes, and care'
  details: |
    Remediated independent review findings. Recalibrated WT1 second-hit biology to distinguish copy-neutral 11p LOH from independent somatic WT1 alterations and avoid extrapolating a heterogeneous cohort proportion to WAGR. Added a renal-precursor node and evidence-backed nephroblastomatosis and bilateral tumor structure. Added literature-estimated prevalence and tumor outcomes; corrected genital HPO mapping and obesity evidence; removed the unsupported BDNF-to-ASD edge while retaining cognition-adjusted and clinician-diagnosis null results; expanded the PAX6 pan-ocular phenotype and exact management evidence; removed unsupported prenatal/preimplantation testing language; and added WAGRO weight and genitourinary/urology management with treatment-to-phenotype join points. The formal reviewer suggested HP:0002718 for nephroblastomatosis, but that CURIE denotes recurrent bacterial infections; the entry uses the verified HP:0008643 Nephroblastomatosis term. Cohort-specific 78.9% nephrogenic-rest and 37.5% bilateral-disease estimates are encoded as phenotype contexts rather than syndrome-wide frequencies. Expanded the bilateral-Wilms evidence from a four-word table fragment to the complete supporting cohort sentence for snippet-quality conformance.

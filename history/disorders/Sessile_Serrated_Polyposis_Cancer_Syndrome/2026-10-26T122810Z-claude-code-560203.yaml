  summary: 'Create: Sessile Serrated Polyposis Cancer Syndrome'
  details: |
    New entry for MONDO:0014919 (RNF43-defined sessile serrated polyposis cancer
    syndrome); stub deleted. Lump/split: follows MONDO's split between this
    gene-defined term and the clinically defined parent hyperplastic polyposis
    syndrome (MONDO:0015524), recorded as a skos:broadMatch mapping so the
    parent stays in the queue. Two KNOWLEDGE_GAP discussions record the low RNF43
    yield in WHO-criteria SPS cohorts and the unresolved penetrance and
    surveillance-start age for carriers. The ClinGen Definitive (AD) tier is
    copied from the cached CGGV record. Pathograph: germline RNF43 first hit,
    somatic second hit (one family, Yan 2017), loss of Frizzled turnover,
    increased Wnt signalling, and a cooperating somatic BRAF node, wired to
    serrated polyps and colorectal carcinoma. Surveillance and colectomy
    evidence is from clinically defined SPS cohorts and is labelled as such.
    Deep research: openscientist returned off-target reports twice (the
    pipeline rerouted them to other diseases), so the claude_code report is
    committed; it was used only as a lead. Validated with just validate,
    validate-terms, count-verified-snippets, validate-disorders and the
    whole-repo gates.

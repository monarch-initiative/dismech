  summary: Review and enrich Sessile Serrated Polyposis Cancer Syndrome
  details: 'Audited all claims and snippets and enriched Sessile Serrated Polyposis Cancer Syndrome (MONDO:0014919).
    Added synonym RNF43-associated polyposis, removed uncited percentage rounding from top-level description,
    added Harrison''s chapter classifications (ONCOLOGY_HEMATOLOGY, GASTROINTESTINAL, GENETICS_ENVIRONMENT_DISEASE),
    and added structured ultra-rare prevalence from published RNF43 polyposis kindreds and population
    biobanks (PMID:41443981, PMID:39546056). Enriched pathophysiology nodes with epithelial and crypt
    stem cell types (CL:0002253, CL:0002250) and colon location (UBERON:0001155) including on all SOMATIC
    lesion nodes, grounded BRAF kinase activity (GO:0004674), linked nodes to germline_two_hit_tumor_predisposition
    module stages via conforms_to, and added multi-lesion somatic second-hit, BRAF/KRAS mutation, and
    RNA-seq Wnt pathway activation evidence from CORGI kindred Ox7 (PMID:41443981). Added therapeutic_modality
    SURGERY to colonoscopic surveillance with polypectomy.

    '

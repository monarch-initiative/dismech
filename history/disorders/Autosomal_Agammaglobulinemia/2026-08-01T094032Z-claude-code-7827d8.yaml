  summary: 'Create: Autosomal Agammaglobulinemia (MONDO:0011096)'
  details: |
    De novo curation of autosomal (non-Bruton) agammaglobulinemia for issue #7568. Deep research via Edison/Falcon (553 s); its 17 citations resolved to only four distinct works, so the entry was built primarily from an independent PubMed E-utilities sweep of the primary gene-discovery literature (Yel 1996 IGHM, Minegishi 1998 IGLL1, Minegishi 1999 CD79A and BLNK, Ferrari 2007 CD79B, Conley 2012 PIK3R1, Boisson 2013 TCF3, Anzilotti 2019 SLC39A7, Le Coz 2021 SPI1, Sawada 2003 LRRC8A). Gene-to-numbered-subtype mapping was re-derived independently from MONDO/OMIM with OAK rather than taken from the brief: two corrections resulted, LRRC8A is AGM5 (omitted from the supplied gene list) and AGM10 is SPI1 not TOP2B (TOP2B causes the separate syndromic MONDO:0012243). Two Falcon-supplied HP identifiers were semantically wrong on OAK check (HP:0030245 is Intrapartum fever, HP:0031693 is Severe Epstein Barr virus infection) and were discarded. GeneReviews has no chapter for the autosomal forms; the X-linked chapter (PMID:20301626) was mined for shared clinical and management content, always tagged supports PARTIAL. XLA is handled as a cross-referenced differential diagnosis rather than duplicated. A hostile pre-PR red-team pass (dismech-pr-review checklist, fresh-context subagent) found one CRITICAL and several IMPORTANT issues, all fixed before opening the PR: POU2AF1/BOB1 was scoped OUT of the entry (its defining report PMID:33571536 is titled 'Agammaglobulinemia with normal B-cell numbers in a patient lacking Bob1', so it has no pro-B to pre-B block) and moved to differential_diagnoses; the LRRC8A snippet was replaced (the original was verbatim but a vacuous mid-sentence fragment); MONDO-parentage claims for AGM8B and AGM10 were corrected (both sit under MONDO:0015977, not MONDO:0011096); an intrinsic germline myeloid defect was moved off an infection-to-neutropenia edge onto its own parallel edge; FNIP1 gained a subtype bound to MONDO:0100432 plus its cardinal hypertrophic cardiomyopathy phenotype; a diagnosis section was added (quantitative immunoglobulins, lymphocyte flow cytometry, IEI panel/exome, KREC newborn screening); Recurrent Infections was retermed to HP:0002718; and several prose overstatements were corrected. Validation: just validate PASS (95/95 snippets verified), just validate-terms PASS, just validate-references PASS, phenotype connectivity 19/19 (100 percent), gene-to-mechanism wiring 12/12 (100 percent).

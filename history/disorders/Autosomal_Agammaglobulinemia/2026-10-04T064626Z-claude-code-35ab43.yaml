  summary: Evidence-claim mismatch review (#12825)
  details: |
    Reviewed the 51 claims the saved Jev assessment rated MISMATCH overall,
    against the cached references.

    Corrected:
    - One sentence from the 2025 SPI1 cohort (Knox et al., Blood) about six
      clinically well relatives had been reused as the only cohort quote on
      seven claims. It did not name the carriers as carriers, and on most of
      those claims it said nothing about what the claim asserted. Replaced it
      with the sentence that fits each claim: the 81.8% penetrance estimate
      (autosomal dominant inheritance), the haploinsufficiency mechanisms
      (Reduced PU.1 Dosage or Activity, regraded IN_VITRO), progressive B-cell
      loss (lymphocyte flow cytometry), possible later disease in unaffected
      carriers (genetic counseling). AGM10, the SPI1 genetic record and the
      penetrance knowledge gap keep the relatives sentence, extended to name
      the heterozygous carriers; AGM10 and SPI1 also gained the adult-onset
      sentence their descriptions rely on.
    - Impaired TOP2B Activity: the variant-identification quote is now
      INDIRECT for the activity claim, and the edge to Impaired B-Cell
      Development now cites the Top2b mb1-cre marrow immunophenotyping
      (MODEL_ORGANISM, INDIRECT) instead of the family-identification sentence.
    - Defective TCF3 Transcription-Factor Activity: added the abstract's
      dominant-negative sentence, which the description's interference claim
      needed; the MyoD binding quote is kept.
    - Slc39a7 mouse model: removed an evidence item quoting the paper's
      "not blinded or randomized" statement as support; the limitation stays
      in notes.
    - Absent tonsils: Conley 2002 refers to X-linked agammaglobulinemia in
      that sentence, so directness is INDIRECT and the explanation says so.
    - Restored spaces lost before numbers in prose ("has22", "Its81.8%",
      "type1", "tested134", "patient1" and similar).

    Retained, with reasons:
    - Disease-scope flags on Hoffman syndrome (TOP2B), FNIP1 and SPI1 claims:
      the entry deliberately covers these as autosomal B-cell-poor
      agammaglobulinemias (see entry notes); the snippets match their gene.
    - Differential diagnoses (XLA, SCID, CVID, POU2AF1, secondary
      hypogammaglobulinemia): the quote describes the differential disease,
      which is what a differential claim needs, and existing explanations
      already note extrapolation.
    - FNIP1 knowledge-gap evidence: it documents what the B-cell assays
      measured, which is the basis of the gap's rationale.
    - Model-system readouts (ZIP7, LRRC8A, SPI1 HSPC, CD79B S2 cells,
      E555K): the snippets support the readouts; the flags concern the
      disease scope of a model, which the limitations fields already state.

    Validation: just validate, validate-terms, count-verified-snippets
    (265/265) pass.

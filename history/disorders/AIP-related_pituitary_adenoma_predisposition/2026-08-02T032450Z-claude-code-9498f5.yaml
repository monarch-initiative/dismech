  summary: 'Split mixed-source REFUTE evidence by evidence_source (PR #7116 review)'
  details: |
    Addresses IMPORTANT 3 of the ai4c-reviewer review on PR #7116.

    The REFUTE item on the somatotroph-cAMP -> hyperprolactinemia edge (PMID:24662816,
    'all prolactin-secreting tumors showed prominent Gai-2 protein levels, irrespective of Aip
    mutation status') was tagged evidence_source: IN_VITRO. That was wrong: the finding is
    tumor-tissue immunostaining, not a cultured-cell experiment, and the panel is described as
    spanning human and mouse GH-secreting pituitary adenomas.

    Per the CLAUDE.md rule that a paper mixing sources should be split so each item carries a
    single evidence_source, this is now two REFUTE items - one HUMAN_CLINICAL, one
    MODEL_ORGANISM - over the same quoted sentence. The explanations state that the paper does
    not report the prolactinoma subset separately by species, so the split records the mixed
    provenance rather than implying a species breakdown the source does not give.

    Verified: linkml-validate clean, snippets exact against references_cache.

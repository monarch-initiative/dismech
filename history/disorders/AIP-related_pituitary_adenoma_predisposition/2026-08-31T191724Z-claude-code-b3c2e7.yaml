  summary: Re-anchor disease_term to MONDO:1060231
  details: |
    MONDO NTR monarch-initiative/mondo#10131 was merged 2026-06-17, minting MONDO:1060231 'AIP-related pituitary adenoma predisposition' under MONDO:0020573 inherited disease susceptibility, per the requester's answer on the NTR thread. The entry recorded the re-anchor as blocked on propagation into a local sqlite:obo:mondo snapshot. conf/oak_config.yaml now routes MONDO through the ols:mondo adapter and the term resolves there, so the block no longer applies. Bound the top-level disease_term to MONDO:1060231 and rewrote the MONDO:0007052 mapping_justification, which had described itself as a placeholder awaiting exactly this re-anchor. MONDO:0007052 is kept as a skos:closeMatch rather than deleted because it carries OMIM:102200 and the exact synonym 'pituitary adenoma predisposition, autosomal dominant, somatic mutation', so it remains a genuine cross-reference even though its primary label is GH-skewed. MONDO:0017824 familial isolated pituitary adenoma is unchanged as skos:relatedMatch. Verified with just validate, just validate-terms, check-entity-refs, check-duplicate-keys, check-enum-values and check-term-cache-integrity.

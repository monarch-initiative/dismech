  summary: 'Create: Epithelioid Hemangioendothelioma'
  details: |
    De-novo curation of epithelioid hemangioendothelioma (EHE, MONDO:0015523) as a fusion-defined vascular sarcoma.

    NEC preflight: the MONDO record (low-grade malignant blood vessel neoplasm, epithelioid endothelial cells in cords/nests in myxohyaline stroma) was pulled with OAK and confirmed the intended entity, excluding the classic confusions - epithelioid sarcoma, epithelioid angiosarcoma, epithelioid hemangioma and Kaposiform hemangioendothelioma. The entry explicitly flags the MONDO/NCIT "epithelioid angiosarcoma" EXACT synonym as an ontology defect and models epithelioid angiosarcoma as a differential diagnosis instead.

    Duplicate preflight: no EHE/hemangioendothelioma/WWTR1/CAMTA1 hits in kb/ on origin/main, and no prior PRs; the only issues were the curation request (#7704) and the priority EPIC (#1079).

    Deep research: Edison/falcon run recorded at research/Epithelioid_Hemangioendothelioma-deep-research-falcon.md (469 s, 18 citations, 1 artifact). Treated as leads only - every PMID was fetched with just fetch-reference and every snippet verified as an exact substring of the cached abstract.

    Pathograph: eight atomic nodes with biological_scale tags. WWTR1-CAMTA1 fusion formation (promoter-switch mechanism) and the YAP1-TFE3 variant act as parallel triggers converging on constitutive nuclear TAZ-TEAD transcriptional activation, which feeds endothelial cell reprogramming and the CTGF-integrin-RAS-MAPK arm, then epithelioid endothelial neoplastic proliferation, with CDKN2A loss as a progression modifier and multifocal/serosal dissemination as the outcome-determining consequence.

    Module conformance (three, each independently evidenced and structurally aligned to the module node it claims): sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation on the CTGF-RAS-MAPK node (PMID:35443056); evading_growth_suppressors#Tumor Suppressor Inactivation on the CDKN2A node (PMID:36598859, PMID:31537895), which carries the module's cell-cycle-checkpoint processes as DECREASED and routes its downstream edge to the proliferation node mirroring the module's Tumor Suppressor Inactivation to Loss of Cell-Cycle Checkpoint Control edge; and invasion_and_metastasis#Metastatic Colonization on the dissemination node, anchored on the shared-genomic-breakpoint clonality evidence for multifocal hepatic EHE (PMID:31537895) plus the multifocality-as-early-metastasis outcome data (PMID:37444414). tumor_angiogenesis conformance was considered and deliberately NOT declared - EHE is itself an endothelial neoplasm, so its angiogenic transcriptional program is not the hypoxia/HIF-driven recruitment of host vasculature the module models.

    Also curated: two molecular subtypes bound to NCIT:C177552/C177553, four histopathology findings, ten phenotypes, four biochemical/biomarker entries including the emerging circulating GDF-15 readout, five genes, SEER-derived incidence, three progression records, four differential diagnoses (three MONDO-bound), seven treatments and two clinical trials (SARC033 trametinib and the EURACAN registry). Three treatments carry target_mechanisms joins into the pathograph: trametinib INHIBITS the CTGF-RAS-MAPK node, sirolimus INHIBITS the mTORC1 node, and investigational TAZ-TEAD-directed therapy INHIBITS the central-effector node. Discussions: three KNOWLEDGE_GAP plus one HUMAN_MODEL_MISMATCH, each with structured proposed experiments.

    Self-review pass before PR: an independent red-team review was run against the dismech-pr-review skill and its findings were incorporated. Substantive changes made in response: the YAP1-TFE3 frequency claim was reconciled with its own snippet (now a sourced <5% to ~10% range with three citations rather than a bare 5-10%); all site-involvement frequency bands were re-derived, because the SEER figures originally used measure presenting primary site in the broader malignant-hemangioendothelioma group rather than organ involvement in EHE - hepatic and skeletal bands were withdrawn with the reason recorded, pulmonary was re-based on the 59%-lung-involvement figure from a molecularly confirmed EHE cohort, and metastatic disease was re-based on that cohort's 70% distant-metastasis rate; soft tissue, the single most common primary site, was added as a phenotype, as was anaemia; the semantically empty HP:0002664 Neoplasm binding on metastatic disease was dropped with the reason recorded; NCIT:C47835 (Zellballen, a paraganglioma-specific pattern implying sustentacular cells) was replaced with its parent NCIT:C35892 Nested Pattern; sorafenib was removed as a therapeutic_agent because the cited case series does not support it, and bevacizumab, which it does support, was added; the "constitutive" Hippo-escape framing was qualified with the flagship paper's own conclusion that the fusion remains partly Hippo-regulable; the subtype prognostic difference is now reported with its non-significance (p = 0.095); the risk-stratification model is described as proposed with the independent nationwide validation attached; and the multifocality knowledge gap was narrowed to the multi-organ case, since intrahepatic clonality is already established.

    Deliberate gaps: the Liver Transplantation treatment carries no evidence item (the EHE transplant literature is registry/series-based with no abstract statement meeting the project snippet standard) and this is flagged in its notes; Active Surveillance omits a term binding because no suitable NCIT clinical-action term is reachable from NCIT:C25218.

    Validation (final state): just validate passed all three layers (schema, terms, references - 83/83 snippets verified against cached references); just validate-graphs reports no issues for this entry (its repo-wide failures are pre-existing in other files); 3545 relevant pytest checks pass; linkml-data-qc compliance 82.6 percent global / 83.1 percent weighted.

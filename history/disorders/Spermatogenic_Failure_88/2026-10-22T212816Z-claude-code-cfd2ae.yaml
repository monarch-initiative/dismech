  summary: 'Create: Spermatogenic Failure 88'
  details: |
    New entry for spermatogenic failure 88 (MONDO:0957821, OMIM 620547),
    autosomal recessive non-obstructive azoospermia from biallelic KASH5
    (CCDC155) variants. Scope is the male disease only; the female KASH5
    phenotype is a separate MONDO disease (premature ovarian failure 22,
    MONDO:0957822) with its own stub, and is mentioned only in notes.

    Pathograph: KASH5 loss of function -> uncoupling of meiotic telomeres
    from cytoplasmic dynein -> failed homolog pairing and synapsis ->
    persistent unrepaired meiotic DSBs -> spermatocyte arrest before
    pachytene with apoptosis -> spermatogenic arrest and NOA, with the last
    four nodes conforming to meiotic_prophase_failure. Evidence comes from
    five human reports (PMID:29790874, 35674372, 35587281, 36864840,
    42443317), the Kash5 knockout mouse (PMID:24062341), mouse spermatocyte
    and reconstitution studies of KASH5 as a dynein activating adaptor
    (PMID:22826121, 35703493, 36946995, 40501626), and an in vitro variant
    study (PMID:33980926). PMID:35708642 (female POI) is cited only for its
    in vitro localization result. No treatment curated: no cited report
    describes sperm retrieval or assisted reproduction in an affected man.

    Deep research: one openscientist report
    (research/Spermatogenic_Failure_88-deep-research-openscientist.md). It
    ran with causal_genes "not recorded" because the stub names KASH5 only
    in source_tags (issue #15216), but stayed on KASH5 (63 mentions;
    preflight-dr matched gene and OMIM 620547; SUN1 is the LINC partner, not
    a second disease). 9/9 references resolved; its citations overlap the
    set above and add nothing used here.


  summary: Added Harrison's classifications, testicular and nuclear-envelope ontology groundings, and diagnostic evaluations for Spermatogenic Failure 88.
  details: Added Harrison's chapter classifications (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) backed by verbatim snippets from PMID:36864840. Enriched KASH5 meiotic pathophysiology nodes with cellular component bindings (nuclear envelope, meiotic nuclear membrane microtubule tethering complex, synaptonemal complex, nucleus) and UBERON anatomical locations (testis, seminiferous tubule of testis). Added diagnostic flags to non-obstructive azoospermia and spermatocyte maturation arrest, germline variant origin to KASH5, and diagnostic entries for WHO semen analysis, testicular biopsy histopathology, and whole-exome sequencing.

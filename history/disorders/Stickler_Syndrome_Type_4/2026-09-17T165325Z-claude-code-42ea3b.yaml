  summary: 'Create: Stickler_Syndrome_Type_4 (COL9A1 autosomal recessive Stickler
    syndrome)'
  details: |
    De novo curation of MONDO:0013590, biallelic COL9A1 Stickler syndrome, as the COL9A1 sibling of the existing Stickler_Syndrome_Type_5 (COL9A2) and _Type_6 (COL9A3) entries. Deep research: one OpenScientist run (research/Stickler_Syndrome_Type_4-deep-research-openscientist.md), reference validation 25/25 resolved with no failed quotes. preflight-dr could not run the Named Entity Confusion gene check because MONDO records no causal gene for this term; manual fallback used the report's gene counts and OMIM identifiers. The report's substantive contribution was the Col9a1 knockout mouse literature: before reading it the cochlear node asserted that the step from collagen IX loss to deafness was not mechanistically worked out, which was wrong. That node was rewritten as Tectorial Membrane Collagen Disorganization and an animal_models block with two modeled_mechanisms links was added. The report's term validation flagged HP:0012609 offered as Megalophthalmos, which HPO calls Hypomagnesiuria; not bound. Its proposed canine oculoskeletal dysplasia model is COL9A2/COL9A3 and was deliberately excluded. GeneReviews PMID:20301479 (Stickler Syndrome) is tagged and mined; just check-genereviews reports TAGGED. One draft snippet quoted a paper title and was replaced with a findings sentence after the reference validator flagged it. Validation run in the worktree: just validate (schema, terms, references) 57/57 snippets verified, validate-terms, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-genereviews - all clean.

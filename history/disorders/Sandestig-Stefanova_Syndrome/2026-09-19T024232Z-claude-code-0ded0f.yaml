  summary: 'Create: Sandestig-Stefanova Syndrome'
  details: |
    De-novo curation of SANDSTEF (MONDO:0032926, biallelic NUP188) from primary literature; no deep-research report was used. entry_type decided DISEASE: MONDO records one causal gene (RO:0004003 HGNC:17859), no descendants, one is_a parent. Established that the Sandestig 2020 (PMID:32021605) and Muir 2020 (PMID:32275884) descriptions are one entity, and that the NUP188 fetal-akinesia association I was asked to check is actually NUP88 (PMID:30543681), a different gene. Six references cited, 169/169 snippets exact-quote verified. Pathograph: 11 pathophysiology nodes over two hypothesis groups (CANONICAL nuclear-import deficiency, EMERGING ciliary/moonlighting); 33 of 40 phenotypes causally wired, the 7 left unwired being single-case findings their own authors flagged as unconfirmed. No conforms_to declared; cataract_lens_opacification, cns_myelin_failure and ciliopathy_dysfunction were each examined and rejected on stated grounds recorded in notes. GeneReviews baseline verified absent offline against cache/bookshelf/. Death in infancy omitted as a phenotype because HP:0001522 sits outside the PhenotypeTerm enum. Corrected an incorrect gene CURIE supplied in the task brief (hgnc:18022 is TP53INP1, not NUP188).

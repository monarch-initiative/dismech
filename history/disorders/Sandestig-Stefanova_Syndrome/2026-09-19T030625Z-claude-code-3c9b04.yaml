  summary: 'Review round 1: Sandestig-Stefanova Syndrome'
  details: |
    Took all three non-blocking suggestions from the ai4c-reviewer approval on PR #12187, in a single push. (1) Ventricular septal defect: the frequency band was defensible from PMID:39911172 but not from the sentence attached to it, so a second evidence item now quotes the passage naming VSD in both Sandestig index patients, and the Disrupted Cardiac Morphogenesis node gained the report's Table 1 congenital-heart-defect row (nine of ten patients positive, one not tested) as the denominator behind 'most patients'. (2) Frequency banding made internally consistent: all ten single-case findings moved VERY_RARE to OCCASIONAL, because one patient in about ten is 10 percent, which is the OCCASIONAL band, and a notes paragraph now says the bands carry little information at this cohort size and points the reader at each description instead. (3) Intravenous immunoglobulin gained therapeutic_modality PROTEIN_REPLACEMENT, the only treatment that lacked one. One snag worth recording: the Sandestig-summary snippet initially failed reference validation because the cached text carries a numeric citation marker that the validator strips before matching, so the quote was trimmed to begin after it. Re-ran the full gate set; 171/171 snippets verified.

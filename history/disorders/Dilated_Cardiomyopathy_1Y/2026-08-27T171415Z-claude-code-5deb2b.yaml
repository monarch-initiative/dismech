  summary: Replace the misattributed model readout; move the ClinGen HCM assertion
    to the discussion
  details: |
    Second correction round on PR #9664, addressing the two findings the re-review raised that the first round did not cover. The re-review ran against the title-only commit 18fa332c6, so its critical finding A - PMID:28600229 cited as HUMAN_CLINICAL for human linkage and penetrance it only recites - was already fixed in deef4afc6, which re-sourced all six claims to Lakdawala 2010 (PMID:20117437). The reviewer asked for the [3] identity to be confirmed rather than taken on trust; it was, by fetching the paper and checking that its abstract carries the segregation, the penetrance denominator and the ATPase result the recitations were pointing at.

    Finding C is fixed and it was a real error. The readout "Calcium sensitivity of sliding velocity" was hung off the mouse model's link to Decreased Myofilament Calcium Sensitivity. Sliding velocity is regulated in vitro motility of recombinant D230N tropomyosin - no mouse tissue is involved - so it was never a readout of that model. Its own evidence item was graded IN_VITRO while sitting on an animal-model link, which is the tell the reviewer picked up on. Replaced with the two measurements actually made in myocytes isolated from the transgenic mouse: peak calcium transient amplitude (INCREASED) and the rates of contraction and relaxation (INCREASED), both MODEL_ORGANISM. The sliding-velocity result is not lost - it was already curated on the Decreased Myofilament Calcium Sensitivity pathophysiology node, which is where a recombinant-protein measurement belongs. The reasoning is recorded in the link's limitations field, since ModelMechanismLink has no notes slot.

    Finding B is fixed differently from how the first round handled it. The ClinGen TPM1/hypertrophic-cardiomyopathy Definitive assertion was graded SUPPORT on the TPM1-DCM gene record; the first round regraded it NO_EVIDENCE and kept it there. The reviewer is right that the placement rather than the grading was the problem: on a gene record whose claim is "TPM1 is causative for DCM1Y", an assertion about a different disease can only mislead an aggregator, whatever its grading. It is moved into the tpm1_dcm_gene_validity_asymmetry discussion, where the asymmetry is the claim - and there it is genuinely SUPPORT, because a Definitive classification for HCM alongside a Moderate one for DCM is exactly what that discussion is about. The gene record's notes now state that the omission is deliberate and where the assertion went, so it does not read as something that fell out.

    Two of the reviewer's corrections to their own earlier feedback are recorded here because they changed what was done. The specific heart-failure drug agents are not quotable from the cached abstracts, so the treatments section added in the first round names an ACE-inhibitor agent only where an evidence item supports it and does not manufacture quotes for metoprolol, furosemide or the rest. And CHF was indeed quotable from PMID:39684770, though the first round sourced it to Lakdawala instead, which is equally exact and gives the phenotype's frequency bound in the same sentence.

    Validation: just validate-disorders passes, 55/55 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-snippet-length.

  summary: 'Create: Dilated Cardiomyopathy 1Y (MONDO:0012744, TPM1)'
  details: |
    De novo curation of TPM1-related dilated cardiomyopathy (MONDO:0012744) from the claim in issue #9622.

    Deep research: claude_code provider (falcon/Edison returned HTTP 402, key out of credit). Report validated 12/12 references resolved, 0 unresolved, 11/12 on topic. Combined with direct PubMed E-utilities searching and with the repository's own ClinGen structured source.

    No GeneReviews chapter exists for dilated cardiomyopathy 1Y specifically, so the Step 3b baseline does not apply.

    Four-node pathograph: TPM1 missense variant to altered tropomyosin flexibility and actin binding to decreased myofilament calcium sensitivity to systolic dysfunction and ventricular dilation.

    The finding worth a reviewer's attention is the gene-disease validity asymmetry. Two ClinGen assertions already in references_cache/ classify TPM1 as Definitive for hypertrophic cardiomyopathy (2023-12-18) but only Moderate for dilated cardiomyopathy (2025-04-04). Two independent large reappraisals agree on the moderate tier, and one finds TPM1 enrichment restricted to specific patient subsets, possibly early-onset disease. Both CGGV assertions are cited in genetic[], with the DCM one graded PARTIAL because that is what a Moderate classification asserts, and the HCM one included specifically to make the asymmetry explicit rather than implied. A KNOWLEDGE_GAP discussion sets out the reconciliation - strong allele-level evidence for D230N alongside probable gene-level over-calling in adult DCM panels - and why it matters for weighting a TPM1 VUS.

    Second discussion covers a genuine contradiction: tropomyosin pseudo-phosphorylation (S283D/S61D) corrects abnormal actin affinity in vitro and is proposed as a rescue strategy, but a transgenic mouse highly expressing S283D develops lethal DCM within a month, and shows no change in calcium sensitivity. The mouse evidence item is graded REFUTE against the rescue proposal.

    Judgement calls:
    - An evidence item on PMID:28600229 is included specifically because the authors judged their own calcium measurements to lack sufficient experimental resolution. It is graded PARTIAL. Including a source's stated reservation alongside its positive finding seemed more honest than quoting only the result.
    - The D230N transgenic mouse link records in limitations that it is an alpha-MHC-driven overexpression transgenic rather than a knock-in, and notes why stoichiometry is not a neutral detail for a mechanism that turns on coiled-coil dimerisation and head-to-tail interdigitation.
    - Three alleles curated as variants (D230N, D84N, E54K) because they act by demonstrably different molecular routes - reduced overlap flexibility, weakened actin binding, and altered troponin I mobile-domain association respectively.
    - penetrance_percentage is a string in this schema, not a number; "80" rather than 80.0.

    Validation: just validate-disorders passes (schema, terms, references), 34/34 snippets verified. Also clean on check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading.

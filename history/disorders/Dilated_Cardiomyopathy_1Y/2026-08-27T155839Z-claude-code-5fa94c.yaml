  details: |
    Correction round on PR #9664 in response to review.

    The high-severity finding was correct and is fixed. Six human claims - the linkage in two multigenerational families, the 80% penetrance figure, the reduced ejection fraction with left ventricular enlargement, the founding-allele identity, the clinical severity, and the reconstituted-filament ATPase result - were cited to PMID:28600229, a transgenic-mouse biophysics paper. All six sentences sit in that paper's introduction and cite reference [3]; two of the quoted snippets even retain the [3] marker. The primary source is Lakdawala 2010 (PMID:20117437), which was not cached. It is now fetched and all six claims are re-sourced to it, with better quotes than the recitations gave: the penetrance item now carries the carrier count (16 of 20) rather than the bare percentage, and the ATPase item now comes from the study that ran the assay.

    PMID:28600229 remains cited nine times for its own work - thermal unfolding, sliding velocity, calcium transients, and the transgenic mouse - which was never in question.

    Also from this review:

    - treatments: section added (it was absent). Heart-failure pharmacotherapy with an ACE-inhibitor agent, heart transplantation, and cascade screening of at-risk relatives. The pharmacotherapy entry is deliberately hedged: the supporting observations are single carriers, and one of the three evidence items is the authors' note that 3 of 5 affected infants recovered spontaneously, which is quoted precisely because it means an uncontrolled series cannot separate treatment effect from natural history.
    - Four alleles added to the TPM1 variant spectrum. K30E (PMID:39684770) is the only reported de novo TPM1 variant here and is worth the space for that alone. M8R (PMID:39282088) is curated with a note that its flexibility change runs opposite to D230N's, so chain flexibility alone does not discriminate the phenotypes. E114Q (PMID:35029218) is an allele-spectrum entry with no functional work and is graded to say so. E40K and E45K are curated from Lakdawala's own sentence naming them as the weaker prior evidence.
    - PMID:11273725 (Olson 2001) cited on the variant node for the surface-charge-reversal rule separating DCM from HCM alleles. Note the cached record is abstract-only and does not name the two alleles it reports, so no allele names are attributed to it.
    - Congestive heart failure (HP:0001635) added, graded FREQUENT not VERY_FREQUENT, with the reason recorded: the same cohort describes screen-detected adults with asymptomatic left ventricular dysfunction.
    - GeneReviews PMID:20301486 tagged in a new top-level references: block and cited once. Its cached record holds only the chapter front matter, so the scope statement is the only assessable text; the Management and Clinical Characteristics sections are not present to mine and this is stated in the evidence explanation rather than worked around.
    - The ClinGen TPM1/hypertrophic-cardiomyopathy Definitive assertion was graded SUPPORT on the TPM1-DCM gene record. It is now NO_EVIDENCE: it is a validity assertion for a different disease and contributes nothing to this claim. It is retained because the Definitive-for-HCM against Moderate-for-DCM contrast is the substance of the curated knowledge gap.

    Two of the caches added on this branch, PMID:34309477 and DOI:10.1016/j.jchf.2022.07.009, returned no retrievable content, so nothing can be quoted from them and nothing is cited to them.

    Validation: just validate-disorders passes, 54/54 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length.

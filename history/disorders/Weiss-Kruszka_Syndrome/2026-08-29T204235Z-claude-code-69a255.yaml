  summary: 'Create: Weiss-Kruszka Syndrome (MONDO:0032836, ZNF462)'
  details: |
    De-novo curation of Weiss-Kruszka syndrome (WSKA), the ZNF462 haploinsufficiency disorder.

    Lump/split decision. Curated as its own kb/disorders entry. MONDO:0032836 is a leaf with one causal gene, and neither the term nor the label appeared anywhere in kb/ or in an open PR at claim time.

    Curation inputs. One Perplexity deep-research run (research/Weiss-Kruszka_Syndrome-deep-research-perplexity.md, committed alongside), independent PubMed E-utilities searching, and the GeneReviews chapter PMID:31670927 as the phenotype baseline. The report contains no PMID or DOI in its body, so it was used for orientation only and every claim is anchored to a separately fetched primary source.

    What makes this entry more than a phenotype list is that the mechanism moved from "zinc-finger protein of unknown function" - the defining paper's own words in 2017 - to a specific molecular account by 2023. ZFP462, the murine homolog, was found in a CRISPR screen for mediators of epigenetic silencing: it binds transposable elements acting as enhancers for pluripotency and meso-endodermal transcription factors, and recruits the H3K9 methyltransferase complex G9A/GLP to seed heterochromatin there. The conceptual point, which the entry states explicitly, is that G9A/GLP is broadly expressed and has no sequence specificity of its own; ZFP462 supplies the lineage and locus specificity. So the proposed basis of the neurodevelopmental phenotype is failure of cell-fate specification, not loss of a neuronal gene product.

    Structure. Four pathophysiology nodes: ZNF462 haploinsufficiency, failure of G9A/GLP heterochromatin seeding at enhancers, ectopic meso-endodermal gene expression in the neural lineage, and - as a separate node rather than only a diagnostic test - the altered blood DNA methylation signature.

    Grading discipline on the mechanism. The two mechanistic nodes are PROVISIONAL and the reason is stated in each: the entire account is from mouse embryonic stem cells and neural progenitors, and nothing equivalent has been measured in human cells carrying a ZNF462 variant. The step from mouse cell biology to human phenotype is carried by an evidence item graded SUPPORT with directness INDIRECT, quoting the authors' own "Our results suggest that...". That is the second discussion.

    The episignature is curated as a node, not only as a diagnostic. It is a measurable biological consequence of haploinsufficiency - differentially methylated regions enriched for neurodevelopment, neuron function and cell adhesion, partially overlapping other chromatin-regulator disorders - and separately it is a validated instrument for classifying a ZNF462 variant of uncertain significance. Both roles are curated, in the pathophysiology and diagnosis blocks respectively.

    Two animal models, both cited second-hand and both saying so. The Zfp462 heterozygous knockout mouse is the rare case where the genotype matches the human dosage state, and it shows developmental delay, low body and brain weights and anxiety-like behaviour. Its limitations record that the defining craniofacial phenotype is not reported in it, that the corpus callosum was not assessed in the cited material, and that excessive self-grooming is a weak proxy for the 33 percent autism rate in patients. The Xenopus knockdown is fidelity LOW and is included for one reason only, stated in its limitations: the rescue by human ZNF462 mRNA, which is what licenses reading the mouse and frog work as being about the same gene function. Both are graded directness INDIRECT because both reach this entry through the human delineation paper's introduction rather than through the primary studies - which is a real limitation on what can be quoted, and is recorded rather than hidden.

    Two source defects preserved rather than corrected. Evidence snippets must be exact substrings, so two errors are quoted verbatim and corrected in the prose instead. The GeneReviews diagnosis sentence says "deletion of 9p31.2" where HGNC and the rest of the literature place ZNF462 at 9q31.2, and the same chapter says 9q31.2 elsewhere. The delineation paper writes "the coding region of ZNF42" for ZNF462. Neither affects the substance of the cited claim; both are noted in the genetic notes and the trailing notes so a reader comparing snippet against prose knows why they differ. A third snippet carries inline reference markers from the cached full text and is likewise left as fetched.

    Historical entanglement recorded. The first reported case of what became this syndrome carried a t(2;9) translocation disrupting both ZNF462 and ASXL2 - ASXL2 being the gene of Shashi-Pena syndrome, curated in the same claim run. Its phenotype is presumed to be the sum of two disorders, and the genetic notes and differential-diagnoses block both say the pre-2017 literature on that translocation must not be attributed to ZNF462.

    An autoimmunity signal recorded as a discussion, not a phenotype. Two of roughly forty reported patients have an autoimmune disease (PMID:36688693, systemic lupus erythematosus; PMID:39069253, the second such case, which asks explicitly for functional studies). That is not an epidemiological signal, and the entry does not curate it as a phenotype. It is kept as an open KNOWLEDGE_GAP because the mechanism is not implausible for a chromatin-remodelling disorder and because the same pattern surfaced independently in Shashi-Pena syndrome. Both PMIDs are cached so the claim can be checked, and both are named explicitly in the discussion prose.

    Ascertainment noted in the prevalence record, because it shapes the phenotype. Nine of the fourteen new individuals in the delineation series were found through GeneMatcher - by matching an already-sequenced variant to another, not by recognising a phenotype. The facial gestalt was characterised afterwards, which is the reverse of the classical order and is why facial-analysis algorithms feature so prominently in this literature.

    Validation. Schema validation passes; 41 of 41 evidence snippets verified against cached primary references; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

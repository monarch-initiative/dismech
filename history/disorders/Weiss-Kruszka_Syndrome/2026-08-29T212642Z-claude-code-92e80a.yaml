  summary: 'Review round 1: connect the pathograph, add four phenotypes, penetrance
    and constraint'
  details: |
    Response to the automated review on PR #10100 (ai4c-reviewer, CHANGES_REQUESTED). All five blocking items and all four suggestions addressed. Nothing disputed. Snippets 41 to 52 verified.

    Blocking 1, the methylation node was orphaned. Correct, and it was the sharper form of the criticism that the node's own description asserted "This node is downstream of the molecular defect" while nothing in the graph said so - prose and structure disagreed. An edge now runs from ZNF462 Haploinsufficiency, marked INDIRECT_UNKNOWN_INTERMEDIATES because nothing traces the route from a lost zinc-finger scaffold to a specific set of differentially methylated probes in blood.

    The edge is drawn from the haploinsufficiency node rather than from the G9A/GLP node deliberately, and the description says why: the episignature is human data and the G9A/GLP account is entirely murine, so routing it through that node would assert a connection neither dataset makes. It would have made a tidier graph and a worse claim.

    Blocking 2, 3 and 4, three missing phenotypes. All correct and all quotable from text already cached in the PR. Added Short Nose and Bulbous Nose (46 percent, the fifth of the five most common facial features and the last piece of the gestalt the diagnosis section leans on - split across two HP terms because HPO has none for the combination), Hearing Impairment (distinct from the structural ear anomaly already curated; the functional deficit is what drives the audiology recommendation, and it is one of four prevalences the delineation series cites as its reason for recommending multidisciplinary evaluation), and Minor Limb Anomalies at the general level.

    Blocking 5, penetrance and gnomAD constraint. Both were sitting in the cached full text and both are now curated. The penetrance claim is the stronger counselling statement the inheritance block was reaching for without having: complete penetrance with variable expressivity means an inheriting child will be affected and only the severity is unpredictable. The constraint metric (o/e 0.03, 90% CI 0.01-0.09) is graded COMPUTATIONAL, because it is a population-genetic statistic rather than a clinical observation, and it is the independent quantitative argument for haploinsufficiency alongside the allele spectrum the node previously relied on alone.

    Suggestion 6, the chromatin-reader account. Added to the G9A/GLP node as a complementary rather than redundant mechanism: histone-peptide pull-downs show ZNF462 binding H3K9me3 directly and interacting with HP1-alpha, which is reader and writer-recruiter on the same mark. Both items are graded directness INDIRECT because they reach this entry second-hand through the delineation paper's discussion rather than from the primary biochemistry. The reviewer's point that this partly blunts the entry's own HUMAN_MODEL_MISMATCH concern is right and is why it was worth adding. The PBX1-HOXA9 account was not added: it appears only in the deep-research report, which carries no PMIDs.

    Suggestion 7, parental mosaicism. Added to inheritance with two evidence items - the delineation cohort's inheritance breakdown (17 of 21 de novo, the other four unknown, mosaic or dominant) and the documented mosaic transmitting mother with a 17 percent alternate allele fraction. This materially qualifies the 95 percent de novo headline: an apparently de novo variant is not proof a parent carries nothing, and the recurrence risk after one is not zero.

    Suggestion 8, craniosynostosis frequency. Left as OCCASIONAL. The reviewer explicitly did not block on it and the description already states that the band is an inference from a jointly quantified pair rather than a sourced figure, which is the honest form of the claim.

    Suggestion 9, treatment terms. Feeding Therapy and Gastrostomy rebound from the generic NCIT:C15747 Supportive Care to NCIT:C52006 Gastrostomy, with therapeutic_modality changed from BEHAVIORAL to SURGERY, since the escalation to a tube is the specific and consequential half of the recommendation.

    Checklist row 8, the narrowing was not signalled. Fixed in the entry rather than only in the PR thread. The notes now name what is deliberately narrower than the deep-research report - hypertelorism, low-set ears, epicanthus, obstructive sleep apnea, cryptorchidism, and the specific limb anomalies - and say why: none is quotable from a cached primary source, the report carries no PMIDs, and Orphanet's record for this disorder is not among the ORPHA files cached here. Naming them makes the narrowing visible instead of looking like an oversight.

    Validation after the round: schema validation passes; 52 of 52 evidence snippets verified; term validation, duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet and snippet-grading checks all pass.

  summary: 'Review and enhance: Thauvin-Robinet-Faivre Syndrome'
  details: >-
    Resolved Named Entity Confusion on MONDO:0014918 (OMIM:617107, ORPHA:500095): removed conflated 15q overgrowth syndrome (MONDO:0017806) and IGF1R subtype/pathophysiology/genetic records and moved 15q overgrowth syndrome to differential_diagnoses alongside Sotos, Weaver, Simpson-Golabi-Behmel, and Beckwith-Wiedemann syndromes; aligned display name to Thauvin-Robinet-Faivre Syndrome with MONDO label and TROFAS in synonyms and category Mendelian; grounded FIBP (hgnc:3705) with GO:0019838 (growth factor binding) and structured a 5-node atomic causal pathograph separating Dysregulated Intracellular FGF Signaling, Increased Cellular Proliferation, Disrupted Embryonic Renal Morphogenesis, and Disrupted Embryonic Neurodevelopment; rebound Tall Stature to HP:0011407 (Proportionate tall stature), declared coarse_binding_basis VARIABLE_SPECTRUM on HP:0012210 alongside specific renal HPO terms, and expanded phenotypes to 28 sourced features covering all frequent ORPHA:500095 manifestations plus varicose veins (PMID:26660953) and novel skeletal, airway, ocular, and cardiac findings from Cosentino et al. 2026; added c.652C>T, c.175_176insTAA, c.412-3_415dupCAGTTTG, and c.1003C>T/c.497_498del variant
    records and refined evidence grading, diagnosis, and supportive care.

  summary: 'Create: Congenital Myasthenic Syndrome 18 (SNAP25)'
  details: |
    Created the CMS18 (SNAP25-CMS, MONDO:0014590, OMIM #616330) entry de novo. NEC preflight: confirmed via OAK that MONDO:0014590 is gene-anchored to HGNC:11132 SNAP25 with xref OMIM:616330 and synonym CMS18, explicitly ruling out the common CMS19/COL13A1 confusion that the deep-research report also flagged. Deep research: the repo default provider falcon/Edison failed with HTTP 402 Payment Required from api.platform.edisonscientific.com - API credit exhausted, not a curation issue; claude_code ran successfully with 21 web searches over 31 turns and 14 citations, and its report was used as a lead source only, with every PMID, snippet, and ontology term independently verified. An openscientist run was also completed as a second provider (19 min, 16 citations); it independently corroborated the SNAP25/MONDO:0014590/OMIM #616330 anchoring and the presynaptic-release-defect treatment logic, and contributed the UK national CMS prevalence figure (PMID:41251564). Curated: a 5-node presynaptic pathograph running dominant-negative SNARE disruption to impaired calcium-triggered exocytosis to reduced evoked quantal release at the endplate to impaired NMJ transmission, with a parallel central-synaptic-dysfunction arm; 10 HPO-bound phenotypes; structurally-normal-NMJ histopathology as a discriminating negative finding; SNAP25 genetics covering both reported allele classes I67N missense and Q177Ter nonsense; 3 treatments including the amifampridine target_mechanisms link; 2 differential diagnoses; Orphanet-sourced prevalence; classifications; and an OPEN_QUESTION discussion on the CMS18 vs SNAP25-DEE nosological boundary with two proposed experiments. Key PMIDs: 25381298 Shen 2014 index report, 29355968 Engel 2018 full text for clinical detail plus endplate electrophysiology plus 3,4-DAP response, 36379720 Reynolds 2022 neonatal Q177Ter, 38411501 Kadkova 2024 eLife energy-landscape biophysics, 40533459 and 36835142 Ohno CMS reviews, 25792100 Engel 2015, 33299146 Klockner 2021 SNAP25-DEE. Validated with just validate covering schema, term, and reference checks: 52/52 snippets verified against cached references; compliance 92.1 percent global and 92.7 percent weighted.

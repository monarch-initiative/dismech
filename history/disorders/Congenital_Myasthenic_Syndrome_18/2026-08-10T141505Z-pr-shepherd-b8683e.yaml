  summary: 'Address blocking review: add diagnosis section and MG/LEMS differentials'
  details: |
    PR-shepherd pass addressing the two blocking IMPORTANT items in the 2026-08-09 ai4c-reviewer review of PR #7673.

    1. Added a `diagnosis:` section, which was absent entirely (Content-Completeness dimension 6), with six entries:
       - Repetitive nerve stimulation / single-fiber EMG [NCIT:C38056], the entry-level electrodiagnostic test
       - Molecular genetic testing [NCIT:C15709], which is what assigns the CMS subtype
       - Rapid whole-genome sequencing [NCIT:C101294], the diagnostic modality in the critically ill neonatal case
       - Electroencephalography [NCIT:C38054], documenting the central SNARE phenotype
       - In vitro intercostal endplate microelectrode study [NCIT:C38056], the definitive mechanistic diagnostic
       - Brain MRI [NCIT:C16809], presence NORMAL, curated as a diagnostically informative negative

    2. Added the two `differential_diagnoses` entries the review flagged as missing:
       - Autoimmune Myasthenia Gravis [MONDO:0009688], the first differential to exclude in a child with fatigable weakness and ptosis, distinguished serologically
       - Lambert-Eaton Myasthenic Syndrome [MONDO:0018556], the closest mechanistic mimic, sharing the presynaptic quantal-release defect, post-tetanic facilitation, and the 3,4-diaminopyridine response. The LEMS mechanistic parallel is named in the description, as the review asked.

    All 13 new evidence items quote abstracts already present in references_cache -- PMID:25792100, PMID:36835142, PMID:36379720, PMID:29355968, PMID:25381298, PMID:40533459 -- so no new references were fetched.

    One deliberate omission: the LEMS-like electrophysiology sentence in PMID:29355968 describes the UNC13A/Munc13-1 patient, not the SNAP25 patient, so it was NOT used as CMS18 evidence. The LEMS differential is evidenced instead by PMID:40533459, which assigns SNAP25 by name to the LEMS-like CMS group.

    Validation: `just validate kb/disorders/Congenital_Myasthenic_Syndrome_18.yaml` passed schema, term, and reference validation, reporting "Snippets checked: 65/65 verified against cached references" -- up from 52 before this change. Term validation added MONDO:0018556 to cache/mondo/terms.csv and cache/enums/diseaseterm_f618932bb23f.csv via linkml-term-validator. The validator's incidental re-normalization of roughly 7,681 unrelated references_cache files was reverted and is not part of this commit.

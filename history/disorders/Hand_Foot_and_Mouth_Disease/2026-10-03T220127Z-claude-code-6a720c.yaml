  summary: Rung-3 lump/split review (#10115, design decisions §3e)
  details: |
    Rung-3 lump/split review of the three enterovirus serotypes against the six differentiating axes of design decisions section 3e (R7-R12). Outcome: three subtypes added on the serotype axis. EV-A71 - severity and organ involvement (more severe and more often complicated than CVA16 disease; brainstem encephalitis and acute flaccid paralysis) plus a serotype-specific licensed vaccine; PMID:36284392, PMID:19681701, DOI:10.1186/s12929-023-00908-4. CVA6 - presentation, from a direct three-way cohort comparison in which bullous rash was roughly thirty times commoner than in EV-A71 or CVA16 disease and onychomadesis occurred in CVA6 cases and in neither sibling; PMID:38955319, PMID:36247893, DOI:10.2196/59604. CVA16 - the milder classical form, graded as the comparator against which EV-A71 is more severe, and carrying neither the bullous rash nor the onychomadesis of CVA6, with a falling surveillance share; PMID:36284392, PMID:38955319, DOI:10.1186/s12985-023-02169-x. PMID:38955319 and PMID:36247893 were newly fetched for this review; PMID:38955319 is the load-bearing source because it compares all three serotypes in one cohort. No MONDO class names a serotype-specific HFMD variant, and MONDO:0005721 coxsackievirus infectious disease is the organism-wide infection rather than a named HFMD variant, so subtype_term is omitted on all three per R12 and the checker reports the expected UNBOUND_SUBTYPE. One grading was corrected during the gate sweep: the EV-A71 vaccine sentence is already quoted in treatments[2] as evidence_source OTHER, so the subtype item was aligned to OTHER rather than leaving one sentence with two values in one file. disease_term, pathophysiology and infectious_agent bindings were not touched. Validated: just validate (95/95 snippets), just check-granularity, just check-snippet-grading.

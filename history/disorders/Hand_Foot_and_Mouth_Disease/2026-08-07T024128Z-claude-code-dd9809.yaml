  summary: Link transmission routes and exposure settings into the pathograph
  details: |
    Backfill for issue #8085. All three entries target the receptor-mediated viral entry node but are graded differently. Poor hygiene and sanitation is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES, since the file documents faecal-oral, oral-oral and respiratory droplet contact as the routes, all of which hygiene interrupts. Childcare and school settings and tropical climate are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES: the first concentrates susceptible children and multiplies opportunities for those routes without being a route itself, and the second records a seasonal incidence pattern with no established mediating step. The hygiene and childcare links reuse the transmission sentence carried elsewhere in the file rather than the entries' own citations, which address age distribution and prevention advice instead of transmission. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged. PR review then regraded the hygiene link from TRIGGERS to PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, matching the sanitation entries in Cholera and Shigellosis added in the same tranche. The original grading contradicted the route-versus-condition distinction this tranche was built on: hygiene enables the documented routes rather than delivering the virus, and TRIGGERS is a causal predicate, so the edge asserted that poor hygiene explains receptor-mediated viral entry. The snippet was also replaced with the on-point prevention sentence from the same cached abstract, which names handwashing and surface disinfection as the best methods of preventing spread; the previous snippet described transmission routes without mentioning hygiene at all. All three environmental entries in this file are now PREDISPOSES, which is correct, since none of them is itself a route of transmission.

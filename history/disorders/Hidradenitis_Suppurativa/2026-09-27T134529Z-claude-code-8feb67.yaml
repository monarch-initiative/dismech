  summary: 'Genetics pass: three gene-defined familial acne inversa subtypes and a
    gamma-secretase node'
  details: |
    Genetics pass for dismech#12267 (series-060), hidradenitis suppurativa parent.

    Anchor. MONDO:0006559 hidradenitis suppurativa is correct and unchanged. Its one
    child is MONDO:0024516 familial acne inversa, defined as an instance of
    hidradenitis suppurativa caused by an inherited modification of the genome, and
    its three grandchildren are the gene-defined numbered forms. Nothing in the
    subtree sits outside this entry's scope.

    Subtypes. The entry had no has_subtypes section. Three rows were added, bound to
    MONDO:0007728 (NCSTN), MONDO:0013397 (PSENEN) and MONDO:0013398 (PSEN1) - the
    gene each MONDO class asserts in its own definition and OWL axiom - with genes:
    descriptors for hgnc:17091, hgnc:30100 and hgnc:9508, each symbol and CURIE read
    live from rest.genenames.org, and an autosomal dominant inheritance block bound to
    HP:0000006.

    Genetics. The three genetic: records existed but reached no pathophysiology node,
    and each was typed only by a free-text association: Risk Factor. Each is now
    relationship_type CAUSATIVE, resting on a gene-specific sentence rather than on
    the founding report's sentence naming all three genes together, and carries a
    subtype: foreign key to its new row.

    Mechanism. A Gamma-Secretase Loss of Function node was added upstream of
    Follicular Hyperkeratosis, carrying the three genes, keratinocyte (CL:0000312),
    and GO:0007219 Notch signaling pathway with modifier DECREASED. The DECREASED
    modifier is supported on the node itself by the keratinocyte knockdown experiment
    that measured attenuated Notch pathway molecules. gene_mechanism_wiring_coverage
    moves from 0/3 to 3/3.

    A HUMAN_MODEL_MISMATCH discussion records the one result that cuts against that
    modifier: a zebrafish expression assay of the PSEN1 P242LfsX11 acne inversa
    truncation reports enhanced rather than reduced Notch signaling, while the
    keratinocyte measurements behind the node are NCSTN experiments. The direction of
    the Notch change is what the node asserts, so the mismatch is material, and
    whether the zebrafish result transfers to human follicular keratinocytes is left
    open with a proposed experiment.

    Three reference_title values written during drafting did not match the cached
    title: line and were corrected from the cache before commit; all 45 distinct
    (reference, reference_title) pairs in the file were then checked against
    references_cache/.

    Validation: just validate, validate-terms, count-verified-snippets (all snippets
    verified), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches --resolve,
    and the whole-repo gates, all under linkml-reference-validator 0.3.0rc3.

  summary: 'Review follow-up: generalize smoking prose to match the tobacco binding'
  details: |
    Follow-up on review feedback for PR #8473, in the same pull request as the
    ECTO:6000029 rebind recorded above.

    The exposure description still opened 'Cigarette smoking is strongly associated with HS
    onset and severity' while the entry had just been rebound to the general tobacco-smoking
    term on the grounds that neither its name nor its cited sentence is cigarette-specific.
    Rewritten to speak of smoking generically, with the binding rationale moved into the
    entry's notes slot rather than left in the description.

    The same description asserted flatly that 'Nicotine promotes follicular plugging and
    alters innate immune responses'. That claim is the entry's own reading -- the
    influences_mechanisms link on this exposure already says so explicitly, and grades itself
    INDIRECT_UNKNOWN_INTERMEDIATES at PARTIAL for exactly that reason. The description now
    hedges to match, so the two no longer disagree about what the cited sentence supports.

    Ontology check behind the rebind, run with 'runoak -i sqlite:obo:ecto ancestors -p i'
    and 'info -O obo': ECTO:6000029 is_a ECTO:6000013 (exposure to smoking), whereas
    ECTO:0100003 is_a ECTO:0100002 (exposure to smoking nicotine), which itself hangs
    directly off ExO:0000002. They share no ECTO ancestor below ExO:0000002, so
    ECTO:0100003 is not a narrower ECTO:6000029 and the two are disconnected branches.
    The earlier record in this directory was corrected on this point.

    A first draft of this record, and of the skill documentation in the same pull request,
    went on to describe the smoking pair as splitting behaviour versus substance. That is
    wrong and was corrected before merge: both smoking terms are behavioural. ECTO:0100003
    is defined as 'an exposure event involving nicotine cigarette smoking behavior' and its
    RO:0002309 anchor is an anonymous class, not a chemical; it is a product-specific
    behaviour term in an isolated branch. Only the alcohol pair genuinely splits behaviour
    (ECTO:0001082, involving NCIT:C16273) from chemical (ECTO:9000027, involving
    CHEBI:16236). No binding outcome depends on the distinction, but the guidance had to
    state it correctly.

    No evidence items were added, removed, or re-quoted; both snippets on this entry are
    unchanged and still verify against the cached reference.

  summary: 'Review follow-up: generalize smoking prose to match the tobacco binding'
  details: |
    Follow-up on review feedback for PR #8473, in the same pull request as the
    ECTO:6000029 rebind recorded above.

    The exposure description still opened 'Cigarette smoking is strongly associated with HS
    onset and severity' while the entry had just been rebound to the general tobacco-smoking
    term on the grounds that neither its name nor its cited sentence is cigarette-specific.
    Rewritten to speak of smoking generically and to state why the behaviour term is bound.

    The same description asserted flatly that 'Nicotine promotes follicular plugging and
    alters innate immune responses'. That claim is the entry's own reading -- the
    influences_mechanisms link on this exposure already says so explicitly, and grades itself
    INDIRECT_UNKNOWN_INTERMEDIATES at PARTIAL for exactly that reason. The description now
    hedges to match, so the two no longer disagree about what the cited sentence supports.

    Ontology check behind the rebind, run with 'runoak -i sqlite:obo:ecto ancestors -p i':
    ECTO:6000029 is_a ECTO:6000013 (exposure to smoking) is_a ECTO:6000016 (exposure to
    personal behavior), whereas ECTO:0100003 is_a ECTO:0100002 (exposure to smoking
    nicotine). They share no ECTO ancestor below ExO:0000002, so ECTO:0100003 is not a
    narrower ECTO:6000029; the pair is split by anchor -- behaviour versus substance -- not
    by specificity. The earlier record in this directory was corrected on this point.

    No evidence items were added, removed, or re-quoted; both snippets on this entry are
    unchanged and still verify against the cached reference.

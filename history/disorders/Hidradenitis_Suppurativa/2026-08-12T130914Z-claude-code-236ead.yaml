  details: |
    Backfill for issue #8085. Both exposures are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into follicular hyperkeratosis, the node where this entry's cascade begins and where an occlusion-promoting exposure would enter it. They are graded identically because they rest on the same sentence of the same paper, which lists them together among the associations that make the aetiology complex. The routes each exposure's description proposes, nicotine promoting follicular plugging and mechanical friction with pro-inflammatory adipokines, are the entry's own prose and appear in no cited sentence, which is why the intermediates are recorded as unknown rather than known. Separately, a snippet fidelity problem was found and fixed. The shared sentence was stored in the knowledge base with a straight ASCII apostrophe in the word disease's, while the cached source text uses the typographic apostrophe U+2019. The snippet was therefore not an exact quote. This had never been caught because the reference validator skips DOI-prefixed items entirely, so nothing in the stack had ever compared this snippet with its source. All six occurrences in this entry were rewritten to match the cached text. The link-generation script now folds curly quotes and dashes to ASCII before comparing, so that a genuine typographic difference does not read as a fabricated quote in future runs. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 109 of 119 with 10 DOI-prefix skips, which include the items touched here and were therefore checked by hand against the cache.

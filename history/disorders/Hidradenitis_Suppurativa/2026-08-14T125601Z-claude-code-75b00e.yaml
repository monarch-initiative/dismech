  summary: 'Fix: Rebind Smoking exposure CURIE to ECTO:6000029'
  details: |
    Resolved ECTO CURIE conflict by rebinding the 'Smoking' environmental entry from
    ECTO:0100003 (exposure to cigarette smoking) to ECTO:6000029 (exposure to tobacco smoking).

    Per the #8448 binding convention: "bind the term the entry's own name states."
    The entry is named "Smoking" (not "Cigarette Smoking"), and its evidence snippet
    uses generic "smoking" language without cigarette-specific qualification.
    Therefore the narrower ECTO:0100003 was not supported; ECTO:6000029 is correct.

    The related alcohol conflict (ECTO:0001082 vs ECTO:9000027) was verified to
    represent distinct concepts (behavioral/quantity vs chemical/metabolite) and
    left as-is. Documentation of both distinctions added to the dismech-terms skill.

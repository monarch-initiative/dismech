  summary: 'Fix: Rebind Smoking exposure CURIE to ECTO:6000029'
  details: |
    Resolved ECTO CURIE conflict by rebinding the 'Smoking' environmental entry from
    ECTO:0100003 (exposure to cigarette smoking) to ECTO:6000029 (exposure to tobacco smoking).

    Per the #8448 binding convention: "bind the term the entry's own name states."
    The entry is named "Smoking" (not "Cigarette Smoking"), and its evidence snippet
    uses generic "smoking" language without cigarette-specific qualification.
    Therefore ECTO:0100003 was not supported; ECTO:6000029 is correct.

    Two statements in the first draft of this record were corrected before the
    record was ever committed to main, because the same pull request went on to
    contradict them. ECTO:0100003 was described as "narrower" than ECTO:6000029;
    it is not, and the two terms are parallel branches rather than parent and
    child (see the later record in this directory). The alcohol conflict was
    described as left as-is; it was subsequently resolved in the same pull
    request. Documentation of the distinction was added to the dismech-terms
    skill and later rewritten.

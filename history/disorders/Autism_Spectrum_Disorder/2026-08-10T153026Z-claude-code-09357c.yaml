  summary: Add heavy metal exposure association and two open items
  details: |
    Addresses the knowledge-gap-scan issue #8134, raised from PMID:42540380
    (Trisha et al., GeoHealth 2026), a critical review of 36 human
    epidemiological studies of heavy metal exposure and ASD.

    The issue asked whether the entry should gain pathophysiology nodes for
    metal-specific mechanisms (Pb/Hg neurotoxicity via oxidative stress,
    synapse dysfunction, microglial activation). It should not, and the reason
    is recorded in the entry rather than left implicit. All available
    mechanistic detail is from rodent, zebrafish, and cell models
    (PMID:42541535; the zebrafish arm of PMID:41110787). Adding a human ASD
    mechanism node on that basis would repeat exactly the animal-only
    maternal-immune-activation claim that the 2026-08-05 publication-readiness
    review removed from this entry, and the source review itself declines to
    conclude that heavy metals cause ASD.

    What was added instead:

    - environmental: "Prenatal and early-childhood heavy metal exposure", a
      contested population-level exposure association bound to ECTO:9002163
      (exposure to heavy metal) with chemicals lead/mercury/cadmium/arsenic.
      Four evidence items keep the metal-specific asymmetry visible: the
      comparatively consistent adjusted Pb/Hg association, the inconsistent
      As/Cd finding, the authors' own bounding caveat, and the Shanghai Birth
      Cohort mixture association with early social and motor development
      (PMID:41110787, HUMAN_CLINICAL). All are supports: PARTIAL. No
      influences_mechanisms edge was added, matching the two existing
      environmental entries and avoiding an unsupported causal link into the
      pathograph.

      The same environmental entry carries a notes block naming the three
      candidate mechanisms the handoff asked about (oxidative stress with
      mitochondrial dysfunction and lipid peroxidation; impaired synaptic
      plasticity including altered NMDA receptor subunit composition;
      microglial and astrocytic activation), plus the zebrafish-nominated
      PPAR-linked metabolic route, each labelled explicitly as model derived
      and not demonstrated in human neurodevelopment. Three MODEL_ORGANISM
      PARTIAL evidence items from PMID:42541535 back those three named
      mechanisms so the entry documents them locally rather than only in the
      discussion rationale. The synaptic item deliberately does not link to the
      excitation-inhibition node, which is curated from genotype-defined human
      subgroup work.

    - discussions: two separated open items rather than one blended gap.
      gap_asd_heavy_metal_exposure_causal_status (CONTROVERSY) asks whether the
      human association is causal at all, given residual confounding, single-
      metal designs, and heterogeneous exposure assessment; its proposed
      experiment is a prospective mother-child cohort with repeated
      window-specific biomarkers, mixture models, sibling and negative-control
      comparisons, and mediation analysis.
      mismatch_asd_heavy_metal_model_mechanism (HUMAN_MODEL_MISMATCH, per the
      CLAUDE.md rule that model evidence exists but translational validity is
      the open question) asks whether the animal-model mechanisms operate at
      human-relevant developmental exposure levels; its proposed experiment is
      a dose-anchored human iPSC cortical organoid and microglia-containing
      assembloid exposure keyed to measured cord-blood concentrations. Each
      cross-references the other so the two questions are not conflated.

    Validation: just validate (schema + terms + references) passes; reference
    validation reports 89/89 snippets verified against cached references, with
    only the four pre-existing EGA/Metabolomics-Workbench dataset-accession
    warnings. Four new reference caches fetched with just fetch-reference
    (PMID:42540380, 42541535, 41110787, 26987277); every snippet was checked as
    an exact substring of the cached source. Two new ECTO rows (ECTO:0001571,
    ECTO:9002163) were written by the term validator and normalized in place.
    Unrelated reference-cache enrichment produced by the validate recipe's
    fix-references-cache step was reverted to keep the diff targeted.

  summary: Link valproate and heavy metals as population associations only
  details: |
    Backfill for issue #8085. Both links are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, and the predicate choice is deliberate throughout: neither is TRIGGERS, because this entry is careful in its own descriptions that these are population-level risk associations and not explanations for an individual diagnosis, and because PREDISPOSES is outside the causal-predicate set used for compliance scoring, so it cannot inflate a mechanistic-explanation score on associational evidence. Prenatal valproate is the better evidenced, resting on a population cohort that adjusted for maternal epilepsy, which is the confounder that would otherwise explain the association; the link description repeats the exposure's own caution that pregnancy treatment decisions require individualised assessment rather than abrupt medication changes. Heavy metal exposure carries its own contradiction on purpose. The same review that reports a comparatively consistent adjusted association for lead and mercury reports inconsistent associations for arsenic and cadmium, and bounds its own conclusion to certain populations and exposure conditions; all three sentences are carried on the link, so a reader of the pathograph meets the metal-by-metal disagreement rather than a uniform risk factor. The candidate mechanisms in that exposure's notes, including oxidative stress and altered synaptic plasticity, are recorded there as candidates and are asserted by no link. No cited sentence follows either exposure to a molecular step, so the intermediates are unknown despite the target node being molecular. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 93 of 93 verified.

  summary: 'Phenotypes: three DSM-5-TR criteria added with specific HPO terms'
  details: |
    Added Deficits in Social-Emotional Reciprocity (HP:0012760 Reduced social responsiveness, synonym Impaired social reciprocity; HP:5200136 Reduced social reciprocity was not used because HPO defines it more narrowly by responses to others' emotions), Echolalia (HP:0010529) and Fixated Interests (HP:4000070). Each cites the DSM-5-TR criterion text as quoted in the StatPearls Autism Spectrum Disorder chapter (PMID:30247851, newly cached and tagged StatPearls in references). Insistence on sameness (HP:5200130) was not added because the existing Inflexible Adherence to Routines phenotype already describes it. Validated with just validate-disorders.

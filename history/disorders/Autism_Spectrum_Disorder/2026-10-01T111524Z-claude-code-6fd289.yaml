  summary: 'Genetics pass: decline MONDO:0100299 under the entry''s own scope rule'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The series row MONDO:0100299, PAX5-related B lymphopenia and autism spectrum disorder, is declined under a rule this entry's notes already state - that individual gene-defined syndromes belong in their own disease entries - and the note now names the CURIE so the decision is findable from the identifier rather than only from the gene symbol. The concept's MONDO definition leads with PAX5 deficiency and an early B cell developmental block, with autism spectrum disorder as one neurodevelopmental feature, so it is not a subtype of the broad clinical spectrum MONDO:0005258 that this entry scopes. No other change. The entry's own wiring gaps are reported rather than closed: none of its four risk-factor genes reaches a mechanism node, ten of twelve phenotypes have no incoming causal edge, and two pathophysiology nodes have no outgoing edge. Those are not closable by the kind of binding this pass applies elsewhere - the nodes a gene would have to land on are explicitly heterogeneity and convergence nodes with no single molecular function to name, and the entry's notes argue at length for keeping gene-level claims as illustrative risk loci rather than mechanisms. Closing them properly is a scoped piece of work on this entry, not a side effect of a series row. Validation on the committed tree: just validate 0 issues, validate-terms passed, 93/93 snippets verified.

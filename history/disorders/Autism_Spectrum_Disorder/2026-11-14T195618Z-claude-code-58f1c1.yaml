  summary: 'Definitions: DSM-5-TR rule as criteria sets'
  details: |
    Added a DIAGNOSTIC_CRITERIA definition beside the existing prose case definition, from the DSM-5-TR criteria quoted in the StatPearls ASD chapter (PMID:30247851): criterion A (all 3 social-communication criteria), B (at least 2 of 4 restricted/repetitive criteria) and C-D (early developmental onset, clinically significant impairment); all sets required. No ICD-10-CM code was added because MONDO records none for MONDO:0005258. Criteria items that correspond to a phenotype in the entry carry the same HPO term. Labels on criteria items are not checked by just validate-terms (CriteriaItem.term has no enum binding), so each was matched against cache/hp/terms.csv or the HPO 2026-09-01 release before commit. Validated with just validate-disorders.

  summary: 'Create: Palmoplantar Keratoderma-Esophageal Carcinoma Syndrome'
  details: |
    Created from the MONDO:0007856 stub (claim issue dismech#16403). The deep-research input is research/Palmoplantar_Keratoderma-Esophageal_Carcinoma_Syndrome-deep-research-claude_code.md: the requested falcon (Edison) run failed with a 403 auth error and the run fell back to claude_code, which its frontmatter records. just preflight-dr returned WARN only because TOC, the disease abbreviation, outnumbers RHBDF2 mentions; the report is about this disease. Report content was used as leads only. Every evidence item cites a cached abstract or structured record (PMID abstracts, ORPHA:2198, the ClinGen CGGV record) with a snippet verified by just count-verified-snippets; PMID:28128203 was re-fetched as full text to grade the K16/K6 keratinocyte and patient-skin findings. The pathograph runs germline RHBDF2 gain-of-function variant, increased ADAM17 maturation and shedding, amphiregulin-driven EGFR hyperactivation, keratinocyte hyperproliferation with a wound-healing-like state, and the K16/K6 stress-keratin change to focal palmoplantar keratoderma, with a separate indirect edge from the germline variant to pre-dysplastic esophageal transcriptional change (RNA-seq of TOC biopsies) and on to esophageal leukokeratosis and squamous cell carcinoma. The RHBDF2 node binds keratin filament binding (GO:1990254, increased iRHOM2-K16 binding in TOC keratinocytes, from the full text) as its molecular function; no peptidase activity is bound because iRHOM2 is catalytically inactive. ClinGen Definitive AD validity is copied from the cached CGGV record. Variants from the South African, Chinese and 2026 Japanese reports were not recorded because their cache files have no abstract. Orphanet phenotype rows with no narrative source (poor suck, ascites, hepatomegaly and others) and review-table-only findings (follicular hyperkeratosis, dental findings) were not recorded. Validated with just validate, validate-terms, count-verified-snippets, the per-file checks and just validate-disorders.

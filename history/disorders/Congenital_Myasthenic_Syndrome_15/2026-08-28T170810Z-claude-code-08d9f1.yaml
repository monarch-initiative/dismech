  summary: 'Create: Congenital Myasthenic Syndrome 15'
  details: |
    De novo curation of MONDO:0014542 [congenital myasthenic syndrome 15, ALG14] from PMID:23404334 [Cossins 2013, founding cohort], PMID:28733338 [Schorling 2017, severe infantile form], PMID:34971077 [long-surviving siblings] and PMID:40533459 [2025 CMS gene review].

    Entry-type decision was DISEASE, following the precedent of Congenital_Myasthenic_Syndrome_6.yaml existing alongside the general Congenital_Myasthenic_Syndrome.yaml, whose has_subtypes are mechanism categories rather than numbered entities.

    Deep research was discarded. An openscientist run completed successfully and returned an 832-line report whose central claim was that CMS15 is caused by SLC18A3/VAChT. CMS15 is ALG14; MONDO states this in its definition text and exact synonyms, and PMID:23404334 established ALG14 and ALG2 together as CMS15 and CMS14. The report was not curated from and is deliberately not committed, because research/ outputs are indexed by disease name and a wrong-disease report would mislead the next curator. A -deep-research-fallback.md record replaces it, per existing repo convention. Two tooling gaps were filed: dismech#9888 [research-disorder passes a hardcoded empty mondo_id, so every deep-research run is ungrounded] and dismech#9889 [preflight-dr skips its gene-identity check when MONDO has no RO:0004003, even where the definition names the gene].

    Modelling decisions. The pathograph makes the indirectness of the mechanism explicit: the acetylcholine receptor is normal and the lesion is in a housekeeping glycosylation complex, so the chain runs ALG14 loss of function to hypoglycosylation of endplate proteins to endplate AChR deficiency to fatigable weakness, with a separate branch to impaired glycosylation in neural tissue for the severe pole. The entry curates the full allelic spectrum under one MONDO term and marks which pole each phenotype and each evidence item comes from, rather than curating only the myasthenic end.

    The neural-tissue node is deliberately marked as an association whose intermediate steps are unresolved: no specific hypoglycosylated neural glycoprotein has been identified, in contrast to the endplate arm where the siRNA experiment gives a named target. An OPEN_QUESTION discussion records the case for splitting this entry into a myasthenic entry and a CDG entry; a KNOWLEDGE_GAP discussion records the missing neural mechanism.

    Both treatment evidence items for the cholinesterase-inhibitor claims are graded PARTIAL: the severe-cohort benefit was explicitly temporary, and the broader CDG suggestion is an authors proposal rather than a trial result.


  details: |
    Review round 1 on PR #9891. All four requested items fixed, plus both suggestions.

    Item 1, reference_title for PMID:28733338: the entry carried "A new-CDG." in all 11 occurrences where the real title is "A new ALG14-CDG.". Nothing validates reference_title against the cache, so CI passed it. Fixed all 11. The reviewer was right that it deserved care rather than a mechanical sed: the dropped word is the gene name the entry rests on, in a PR whose headline finding is a gene misattribution elsewhere.

    Item 2, GeneReviews: added a references: block tagging PMID:20301347, copying the tag-only shape from Congenital_Myasthenic_Syndrome_6.yaml. No snippets, since that cache is GeneReviews boilerplate with no ALG14 content.

    Item 3, PMID:40533459 unused: now cited on the genetic block for the CMS gene-set claim, using the clean abstract sentence listing the 40 CMS genes, graded OTHER because the source is a review. Also added to references: with a title. I did NOT snippet the treatment-effectiveness claim: the supporting table row is "ALG14 CMS15 AR effective", four words, which check-snippet-length would reject, and the surrounding table text is ligature-corrupted and line-wrapped. Recorded rather than forced.

    Item 4, pyridostigmine target_mechanisms: added, pointing at Endplate Acetylcholine Receptor Deficiency with treatment_effect MODULATES, following the Myasthenia_Gravis precedent for the same drug.

    Suggestions taken: curated the remaining four alleles of the series as structured variants entries [p.Val141Gly, p.Arg109Gln from PMID:28733338; p.Val197Gly, p.Gly145Arg from PMID:34971077], which makes the allele-severity argument queryable rather than narrative; and dropped "endplate" from the two cell_types preferred_term values, since the endplate is a region of the fibre rather than a cell type and the localisation is already carried by locations GO:0031594.

    Validation: just validate-disorders passed; 32/32 snippets verified; terms validated; all ungated gates pass.

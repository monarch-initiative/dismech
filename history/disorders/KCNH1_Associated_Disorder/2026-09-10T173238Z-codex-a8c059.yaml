  summary: 'Respond to KCNH1 phenotype review: causal uncertainty and evidence metadata'
  details: |
    Responded to PR11614 review on ae65b375b6. Copied two missing evidence titles exactly from fetched frontmatter and audited every evidence item title. Restored three channel/network/DEE edges as INDIRECT_UNKNOWN_INTERMEDIATES within an emerging channel-to-network hypothesis, using source-proposed neurotransmission and heteromeric explanations with explicit native-neuron limitations. Added independent indirect KCNH1 gain-of-function edges to seizures, intellectual disability and global developmental delay for the supported etiologic relations without choosing candidate intermediates. The developmental relations combine explicit gain-of-function causation in PMID41656275 with the separately identified KCNH1 clinical subgroup in PMID33594261. Split functional and mosaic-carrier observations into consistently graded evidence items. Removed unsupported later increased-tone and orphaned thumbnail percentage prose. Consolidated eight repeated frequency notes and explained why pooled syndromic cohorts cannot supply separate TBS or ZLS1 bands. Retained source counts, anatomical union limitations, and the EEG READOUT_OF relationship. Final 23 phenotypes: three causally connected, 19 clinical causal-attribution gaps, one observational EEG readout. No HPO rebinds, new phenotypes or mechanism nodes. Preserves previous authorship and review history.

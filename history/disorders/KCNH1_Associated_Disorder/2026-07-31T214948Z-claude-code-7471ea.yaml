  summary: 'Create: KCNH1 Associated Disorder'
  details: |
    Created the gene-centric umbrella entry for the KCNH1 phenotypic spectrum (MONDO:0100485), the MONDO parent of Temple-Baraitser syndrome (MONDO:0012735) and Zimmermann-Laband syndrome 1 (MONDO:0024526), both of which already exist as separate dismech entries. The umbrella was curated because two arms of the spectrum have no syndromic label and therefore no home in the KB: the attenuated non-syndromic intellectual-disability group (PMID:33811134) and the isolated epilepsy / febrile seizure group (PMID:36285361, PMID:33494179). Modelled as a Disease rather than a Grouping because it is a MONDO disease entity with one causal gene and one shared molecular mechanism, and because two of its four arms are not themselves separate Disease entries. Deep research: falcon (Edison), 756s, 23 citations, 2 artifacts; its reference set (Tian 2023, von Wrede 2021, Gripp 2021, Napoli 2022, Bramswig 2015) was a subset of the independently assembled PubMed set and added no new primary sources, so it served as confirmation rather than as the evidence base. One falcon artifact was used: Figure 3 of Tian 2023 (KCNH1 transmembrane topology with variant sites colour-coded by epilepsy status), attached via the images slot to the S4/S6 hotspot evidence item it directly illustrates. Curated four has_subtypes arms, a seven-node pathophysiology chain (KCNH1 GoF variants to hyperpolarizing activation shift to Kv10.1/Kv10.2 heteromeric crosstalk to aberrant neuronal excitability to DEE, plus a parallel ciliary/Sonic-Hedgehog arm to extraneurological anomalies), 17 phenotypes, genetic, four treatments including the Kv10.1-directed precision-therapy target with its hERG-selectivity obstacle (PMID:40986435), diagnosis, three differentials, and one EMERGING mechanistic hypothesis for the ciliary arm. Two discussions record the open items honestly: a KNOWLEDGE_GAP for the unresolved step from potassium-conductance gain to seizures (sources state the epileptogenic mechanism is not understood), and a CONTROVERSY for the 2015 lumping-versus-splitting question. NEC preflight passed: MONDO:0100485 names KCNH1 (RO:0004003 HGNC:6250) and all citations are KCNH1 papers. No GeneReviews chapter exists for KCNH1, TBS, or ZLS (PubMed searches returned zero results), so that baseline does not apply. Validation: just validate passes schema, terms, and references with snippets verified against cached references. Revised in the same PR after review (ai4c-reviewer, changes_requested): reconnected the ciliary arm to the root node with an INDIRECT_KNOWN_INTERMEDIATES edge scoped to the ciliary hypothesis group; dropped the unsupported de_novo_rate; re-grounded every frequency band on the quantitative KCNH1 column of the Gripp 2021 cohort table (PMID:33594261), which corrected hypertrichosis FREQUENT to OCCASIONAL (3/16, 19%) and raised seizures and hypotonia to VERY_FREQUENT (24/27 and 25/27), and removed frequency from the facial features no source quantifies; specialised the cell types to CL:0000679, CL:0002551 and CL:0002586; added broad nasal tip and absent speech phenotypes, gingivectomy (PMID:39087232), and EEG and brain MRI diagnosis entries. Final validation: 75/75 snippets verified.

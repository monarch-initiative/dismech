  summary: Review KCNH1 phenotypes, frequency scope and causal gaps
  details: |
    Reviewed all 17 original phenotypes against their cited source context, HPO specificity, and causal explanations; entry now has 23 phenotypes. Replaced fragment or mismatched quotes with source propositions, removed 11 whole-spectrum frequency bands derived from syndromic or epilepsy-only denominators, preserved published counts and their ascertainment limits, corrected the hypotonia table/narrative discrepancy and overlapping-cohort claim, and moved the attenuated-subgroup negative gingival observation to notes. Rebound neonatal hypotonia and distal finger phalangeal hypoplasia; separated broad thumb from long thumb and proximal placement, added kyphosis, scoliosis, autistic behavior, and diffuse EEG slowing. Preserved absent speech as a precisely scoped finding. Removed three unproven direct mechanism edges, qualified the ciliary hypothesis and its unknown intermediates, and explicitly dispositioned the 22 clinical causal gaps. EEG slowing has one indirect observational readout link and is documented in a seizure-free patient; it is not caused by clinical seizure membership. Additional phenotype leads including isolated distal toe phalangeal hypoplasia (reported only in a combined finger-and/or-toe count), regression, and heterogeneous MRI findings were considered but not promoted without a suitable independently scoped clinical evidence item. Corrected ancillary PDF-snippet and retired-grade prose encountered in the whole-file audit. Preserved prior curation authorship. Falcon NEC preflight passed; report reference validation resolved all six extracted references with no off-topic references. Final validation results are recorded in the PR.

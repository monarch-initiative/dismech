  summary: Add RAB33B SMC2 diagnosis and model-fidelity discussion
  details: |
    Added a focused diagnosis section for RAB33B-related Smith-McCort dysplasia 2 covering clinical/radiographic recognition and molecular confirmation with PMID:28127940 evidence. Added an open HUMAN_MODEL_MISMATCH discussion noting that the Rab33b knock-in mouse only partially and sex-specifically recapitulates human disease, with proposed human skeletal-cell and expanded mouse phenotyping experiments grounded in PMID:37359363. Did not add a treatment section because the reviewed RAB33B-specific sources did not provide disease-specific management recommendations.

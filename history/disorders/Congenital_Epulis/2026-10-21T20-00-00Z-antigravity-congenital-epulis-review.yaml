  summary: Enrich Congenital Epulis with prevalence, prenatal progression, histopathology and diagnosis bindings, and differential diagnoses
  details: '- Added `prevalence` (`CASES_IN_LITERATURE`, `ULTRA_RARE`, fewer than 250 reported cases worldwide, PMID:42051968). - Added `Prenatal and congenital presentation` phase to `progression` (third-trimester ultrasound detection at 34 weeks gestation and congenital presentation at birth, PMID:39049934 and PMID:40860794). - Bound `Atrophic overlying epithelium` in `histopathology` to `NCIT:C120874` (`Degeneration and Atrophy`) with explanatory note, and `Histology and immunohistochemistry confirmation` in `diagnosis` to `NCIT:C18190` (`Histopathologic Examination`). - Added `therapeutic_modality: SURGERY` and `target_mechanisms` (with PMID:42051968 evidence) to `Local surgical excision`. - Added `differential_diagnoses` (`Granular cell tumor` bound to `MONDO:0006235` with S-100/CD68 immunophenotypic distinction from PMID:41925794, and `Epignathus (oral teratoma)` from PMID:15533573).'

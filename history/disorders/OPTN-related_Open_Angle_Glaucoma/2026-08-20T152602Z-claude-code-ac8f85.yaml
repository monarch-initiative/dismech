  summary: 'Create: OPTN-related Open Angle Glaucoma (MONDO:0100553)'
  details: |
    De-novo curation of MONDO:0100553 (OPTN-related open angle glaucoma, GLC1E)
    for issue #9029.

    LUMP/SPLIT DECISION. Curated as a standalone kb/disorders/ Disease rather
    than as a has_subtypes entry on Glaucoma. MONDO gives the concept a clean
    equivalence axiom (open-angle glaucoma AND RO:0004003 some OPTN) with no
    descendants, and the entity has its own conserved pathograph that is
    mechanistically disjoint from the umbrella entry's: the lesion is a
    cell-autonomous proteostatic defect in the retinal ganglion cell, and the
    disease characteristically occurs at normal intraocular pressure, so the
    trabecular-outflow and elevated-IOP arm that defines Glaucoma.yaml does not
    apply. The stub stubs/OPTN-related_Open_Angle_Glaucoma.yaml is deleted by
    this change.

    WHAT WAS CURATED. Six pathophysiology nodes with biological_scale tags:
    OPTN missense variant and optineurin misfolding (MOLECULAR, trigger) ->
    impaired autophagic flux in retinal ganglion cells (CELLULAR,
    central_effector) and disrupted Rab8-dependent vesicle trafficking
    (CELLULAR, modifier) -> impaired mitophagy and mitochondrial dysfunction
    (CELLULAR, amplifier) -> retinal ganglion cell apoptosis (CELLULAR,
    central_effector) -> progressive glaucomatous optic neuropathy at normal
    IOP (ORGANISM, consequence). All seven downstream edges carry their own
    evidence. Plus: five phenotypes; autosomal dominant inheritance with the
    age-dependent-penetrance caveat; OPTN as CAUSATIVE with the E50K variant
    typed PATHOGENIC, and M98K separately as SUSCEPTIBILITY (explicitly not as
    a Mendelian cause); two prevalence records, both marked as
    fraction-of-cases rather than population rates; four treatments (IOP
    lowering with the sub-10 mmHg target, filtration surgery, and two
    investigational entries with target_mechanisms links); three animal models
    and one experimental model, all with modeled_mechanisms links, link-level
    evidence, and readouts; four diagnosis entries; four differential
    diagnoses; three progression phases; two mechanistic_hypotheses; three
    discussions.

    MODULE CONFORMANCE. Two nodes conform to glaucoma_optic_neuropathy
    (#Retinal Ganglion Cell Apoptosis, #Progressive Glaucomatous Optic
    Neuropathy). Conformance to that module's #Elevated Intraocular Pressure
    and #Trabecular Meshwork Outflow Dysfunction nodes is deliberately NOT
    declared, and a note on the consequence node records why: the module's own
    notes flag normal-tension glaucoma as its partial exception, and this
    entity is that exception. The autophagy node additionally conforms to
    disabled_macroautophagy#Failure of Cytoplasmic Quality Control.

    RELATED EDITS. (a) kb/groupings/Glaucomatous_Optic_Neuropathies.yaml gains
    this entry as its third member, with a note recording that the grouping's
    NECESSARY_AND_SUFFICIENT criterion is anchored on the RGC-apoptosis node
    rather than the pressure arm, which is what allows a normal-tension entity
    to satisfy it. (b) kb/groupings/Macroautophagy_Deficiency_Disorders.yaml
    gains it as an OPTN-anchored member; that grouping previously named OPTN
    only in prose, carrying SQSTM1 via ALS as its representative
    autophagy-receptor gene. Unlike the two partial-mechanism members there,
    autophagy failure is this disease's defining lesion, not one contributor
    among many. just check-groupings reports all members of both groupings
    SATISFIED. (c) kb/disorders/Glaucoma.yaml: the OPTN genetic record's note
    said an NTG-specific source was still needed; PMID:16043855 supplies it and
    is added as a SUPPORT evidence item, and the note now points at this entry
    for the mechanism rather than restating it.

    EVIDENCE DISCIPLINE. Every PMID was fetched with just fetch-reference and
    every snippet checked against the cached abstract. Three snippets drafted
    from full-text regions of full_text_xml cache files were replaced with
    abstract-region quotes before the sweep, because just validate-disorders
    runs --no-full-text and would have rejected them. Model-organism and
    in-vitro evidence is tagged accordingly and never stands alone for a human
    clinical claim; review articles are tagged OTHER. Several items are graded
    PARTIAL where the source supports a weaker claim than the node makes, and
    each says so in its explanation.

    NEC PREFLIGHT. just preflight-dr against MONDO:0100553 returned PASS:
    canonical gene OPTN mentioned 125 times (next: TBK1=25, MYOC=6), and the
    report's OMIM 137760 matches the MONDO xref.

    DEEP RESEARCH. falcon (Edison), 661s, 46 citations, report at
    research/OPTN-related_Open_Angle_Glaucoma-deep-research-falcon.md. Its own
    reference validation: 14/14 resolved, 0 unresolved, 0 off topic,
    confabulation_rate 0.0. The report was used as corroboration and as a lead
    for the diagnosis/differential/progression sections; every PMID actually
    cited in the KB entry was independently fetched and snippet-checked rather
    than taken from the report. The report's suggested ontology IDs were not
    used as given - UBERON:0000978 in particular is not the optic nerve; terms
    here come from the local caches and pass just validate-terms.

    DATASETS. Two GEO accessions, both verified with just verify-datasets.
    Relevance triage was the binding constraint, not availability: just
    discover-datasets returns six DIRECT-tagged candidates, all of them
    trabecular-meshwork or generic-POAG studies, i.e. about the arm of glaucoma
    that specifically does not apply to this entity. Both curated accessions
    were instead found by searching GEO for the genotype ("optineurin E50K")
    and are OPTN(E50K)-specific. Neither carries an evidence block, per the
    bulk-dataset convention.

    VALIDATION RUN. just validate (schema + terms + references): passed,
    95/95 snippets verified. just validate-disorders over this entry and
    Glaucoma.yaml (the batched --no-full-text sweep CI runs): passed,
    128/128 snippets verified; the two reported WARN items are pre-existing
    ega:/metabolomics_workbench: accessions in Glaucoma.yaml with no fetcher,
    untouched by this change. just verify-datasets: 2/2 OK.
    just check-duplicate-keys: clean over all four changed KB/grouping files.
    just check-not4curation: no bound term flagged. check_title_snippets
    --check --against-ref origin/main: no new title-quoting snippets.
    just check-groupings: structure OK, all members SATISFIED.
    just compliance: 94.7% global / 94.6% weighted.

    KNOWN LIMITATIONS, recorded rather than papered over. No GeneReviews
    chapter exists for this disease (PubMed search returns only Primary
    Congenital Glaucoma), so the mandatory-baseline step does not apply. No
    biochemical markers are curated - there is no validated biomarker specific
    to this entity beyond the structural glaucoma measures already held as
    phenotypes. No clinical_trials: the deep-research clinical-trial search
    returned no OPTN-directed interventional trial, and none was found
    independently. The two investigational treatments are labelled
    INVESTIGATIONAL ONLY in their descriptions; the amlexanox result is a
    mouse knock-in finding and the trehalose/rapamycin results are mouse and
    human-cell findings, none of them clinical.

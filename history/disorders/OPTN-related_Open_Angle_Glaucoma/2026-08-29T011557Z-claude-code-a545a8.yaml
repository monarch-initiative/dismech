    # Fix summary: OPTN-related Open Angle Glaucoma

    File: `/home/user/dismech/kb/disorders/OPTN-related_Open_Angle_Glaucoma.yaml`

    ## Findings fixed

    1. **Finding 1 (PMID:26302410 is a review but tagged `IN_VITRO` six times).** Regraded all six
       items to `evidence_source: OTHER` and added the file's own justification sentence
       ("Evidence source is OTHER because this is a review") to each explanation, matching how the
       entry already handles PMID:26142952, 29951055, 27693724, 29875767 and 27413503. I regraded
       all six rather than a subset: PubMed types the paper as a Review, and the file states a
       single convention rather than a per-sentence one for review-summarised cell work. Because
       the same two quoted sentences appear more than once in the file, regrading the whole set is
       also what avoids a same-sentence grading divergence — `check_snippet_grading.py --all`
       reports none for this file.
    2. **Finding 2 ("retinal cells" is not "retinal ganglion cells").** Added the caveat to both
       explanations carrying that quote: the sentence says retinal cells, much of the review's
       underlying work is in RGC-5/661W lines, and PMID:33723228 — cited in this same entry —
       reports RGC-5 not to be of RGC origin. Each explanation now also names what does carry the
       ganglion-cell specificity of the node (NeuN-labelled knock-in mouse retina, human
       iPSC-derived RGCs).
    3. **Finding 3 (top-level description asserts a mitophagy block in RGCs that the node's own
       `notes` disclaim).** Reworded to keep the autophagic-flux block in retinal ganglion cells as
       stated but qualify the mitophagy half: asserted on mechanistic grounds and demonstrated in
       gene-edited non-neuronal cell systems, not in OPTN-mutant retina. This now matches
       `pathophysiology[2]` `notes` verbatim in substance.
    4. **Finding 4 (population-specificity rationale overstates PMID:14755458).** Replaced "were not
       detected in Japanese glaucoma patients" with what the paper reports: of the four alleles,
       two were not detected in any Japanese glaucoma patient studied and two were present at
       similar frequencies in patients and controls. The verified snippet was not touched.
    5. **Finding 5 (human phenotype supported only by mouse evidence).** Added a second evidence
       item to `phenotypes` → *Abnormal Retinal Nerve Fiber Layer Morphology* quoting the human NTG
       sentence from the already-cached PMID:27413503 ("progressive retinal nerve fiber layer
       thinning, characteristic visual field defects, open anterior chamber angles on gonioscopy"),
       and rewrote the node description accordingly. Graded `OTHER`, **not** `HUMAN_CLINICAL` as the
       review suggested: that exact sentence is already used at `diagnosis[2]` with `OTHER`, and
       grading one copy differently would have created precisely the same-sentence divergence the
       protocol forbids. It is graded `PARTIAL` because the statement describes normal-tension
       glaucoma generally rather than OPTN carriers. The sole-model-organism status is removed
       either way.
    6. **Finding 6 (two prose claims not covered by the evidence on their own block).**
       - *M98K non-replication in Caucasian populations* (`genetic[1]` `features`): attached two
         evidence items from sources already cached and cited elsewhere in this file —
         PMID:29951055 ("subsequent studies have revealed that M98K polymorphism is associated with
         glaucoma in Asian populations but not in Caucasian populations", `OTHER`, matching this
         file's grading of that review) and PMID:31238079 ("In some populations, generally Caucasian
         cohorts, the frequency of this mutation is similar among NTG patients and controls",
         `HUMAN_CLINICAL`, matching this file's consistent grading of that source).
       - *Thin cornea and tonometry* (`diagnosis[0]`): the cache does **not** contain the
         underestimation statement, only the CCT difference, so I did not manufacture support.
         Reworded the prose to state the sourced half (CCT is lower in NTG than POAG) and to flag
         the underestimation explicitly as a standard tonometry principle not established by the
         cited sources, and attached the CCT sentence as a `PARTIAL`/`OTHER` evidence item whose
         explanation says exactly what the source does and does not cover.

    ## Findings intentionally skipped

    - Nothing from the report was skipped outright. Two deliberate deviations from the report's
      suggested implementation are recorded above: the `HUMAN_CLINICAL` grade proposed in finding 5
      (would have created a same-sentence divergence) and the tonometry claim in finding 6, which
      is not in fact quotable from the cache and so was softened rather than cited as the report's
      framing implied.
    - The identical "thin cornea causes applanation tonometry to underestimate" phrasing also
      appears in `differential_diagnoses[2]`; the review flagged only `diagnosis[0]`, so I left the
      differential untouched rather than widening the edit.


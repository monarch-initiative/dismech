  summary: 'LOINC tranche G: normal-tension IOP threshold'
  details: |
    Bound LOINC:56844-4 (intraocular pressure) as a diagnosis measurement on the existing Glaucoma Workup row, with a reference range at the sub-21 mmHg normal-tension criterion the row's own cited narrative review (PMID:27413503) already states ('constantly below 21 mmHg'). This is the inverse case from Glaucoma.yaml's general IOP marker, where no band is bound because elevated pressure does not itself define POAG; here the sub-21 mmHg pressure is part of what distinguishes normal-tension from the more common high-tension presentation. Part of LOINC tranche G batch 10 (projects/LOINC_DIAGNOSTICS.md).

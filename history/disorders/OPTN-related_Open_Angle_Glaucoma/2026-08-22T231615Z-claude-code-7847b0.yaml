  summary: Drop overly broad NCIT:C1404 therapeutic_agent binding per re-review
  details: |
    Acts on the single non-blocking suggestion from the ai4c-reviewer
    re-review of PR #9259 (approved, 0 CRITICAL / 0 IMPORTANT / 1 SUGGESTION).

    CHANGE. Removed the NCIT:C1404 Protein Kinase Inhibitor binding from the
    therapeutic_agent list on the TBK1 Inhibition (Investigational) treatment.
    NCIT:C47395 Amlexanox remains as the only bound agent there.

    REASONING. I had added C1404 in the previous commit as a stand-in for
    BX795, which has no CHEBI or NCIT term. The reviewer's objection is
    correct: the class covers essentially every kinase inhibitor in existence,
    so it carries no queryable signal beyond what amlexanox already provides.
    Worse, it is actively misleading about what matters here - the therapeutic
    point of this entry is TBK1 SELECTIVITY, which a maximally broad kinase
    class does not express. A curator searching for TBK1-directed treatments
    learns nothing from C1404, and a curator searching C1404 gets this entry
    among a flood of unrelated ones. That is noise in a machine-queryable slot.

    The treatment description now records explicitly that BX795 is deliberately
    NOT stood in for by a broad class, and that its identity is carried by the
    description and the cited evidence instead. This is the more honest
    position than a class binding that looks like grounding without being it -
    the same principle as leaving an exposure unbound rather than binding a bad
    ECTO term (see the environmental-term-audit guidance in CLAUDE.md: no term
    beats a bad one).

    Note this was explicitly the curator's call - the reviewer wrote "Dropping
    it would lose nothing; keeping it is fine. Your call." I dropped it because
    the low-information-binding argument is the stronger one, not because it was
    required.

    NOT CHANGED. The other two treatments' bindings stand as they are:
    IOP Lowering keeps NCIT:C78568 Prostaglandin Analogue alongside CHEBI:3082
    betaxolol and CHEBI:3175 brimonidine, because Prostaglandin Analogue is a
    genuinely informative class at roughly the granularity of the Monoclonal
    Antibody example in CLAUDE.md, and it is named verbatim in the cited
    snippet. Autophagy Induction keeps CHEBI:9168 sirolimus.

    VALIDATION. just validate: passed. just validate-disorders over this entry
    and Glaucoma.yaml (the batched --no-full-text sweep CI runs): passed,
    130/130 snippets verified - unchanged, since this commit removes a term
    binding and adds prose, touching no evidence item.

    REVIEWER CROSS-CHECK WORTH RECORDING. The re-review independently
    reproduced the check-environmental-evidence anomaly reported in the
    previous history record and reached the same conclusion: its runner's
    checkout also has no merge base with origin/main, so the gate's
    grandfathering baseline is empty and the 5 pre-existing findings in
    Heart_Failure.yaml, Lyme_Disease.yaml and Merkel_Cell_Carcinoma.yaml read
    as new. None of those three files is in this PR. Confirmed as a checkout
    artifact from two independent environments, and green in the actual CI
    test job on both pushed heads.

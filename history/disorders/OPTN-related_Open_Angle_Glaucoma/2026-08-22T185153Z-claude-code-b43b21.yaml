  details: |
    Follow-up to the creation record, addressing the three 🔵 SUGGESTIONS in the
    ai4c-reviewer APPROVE review on PR #9259. Two acted on, one declined with
    reasoning.

    SUGGESTION 1 - therapeutic_agent bindings on the three NCIT:C15986
    treatments. Acted on. CLAUDE.md recommends therapeutic_agent whenever
    treatment_term is the generic Pharmacotherapy action term.
      - IOP Lowering: bound NCIT:C78568 Prostaglandin Analogue, CHEBI:3082
        betaxolol, CHEBI:3175 brimonidine. These were previously not named at
        all in this entry (the reviewer's list of prose-named agents actually
        belonged to the two investigational entries), so binding them required
        new evidence rather than just a term lookup: two PMID:27413503 items
        were added, both graded PARTIAL and tagged OTHER, with explanations
        stating that this is a general normal-tension-glaucoma review and
        establishes NTG management practice, NOT OPTN-specific efficacy. A
        treatment-level note records the same limit: none of these agents
        addresses the autophagy lesion; they lower pressure in an eye whose
        pressure was never high.
      - Calcium channel blockers appear in the quoted sentence but were
        deliberately NOT bound. They target the vascular-dysregulation model of
        non-Mendelian NTG, which is not this entity's mechanism, and binding
        them would import the differential's pathophysiology into this entry.
      - TBK1 Inhibition (Investigational): bound NCIT:C47395 Amlexanox and
        NCIT:C1404 Protein Kinase Inhibitor. BX795 is named in the description
        and in cited evidence but has no CHEBI or NCIT term (checked both), so
        it stays prose-only rather than being bound to an approximate term.
      - Autophagy Induction (Investigational): bound CHEBI:9168 sirolimus
        (rapamycin), which the cited PMID:33723228 abstract evidences directly.
        Trehalose was NOT bound: it appears only in the deep-research report's
        reading of PMID:39425218 full text, not in that paper's abstract, and
        this entry's evidence for the node is the abstract-level
        "mTOR-independent induction of autophagy" quote. Binding an agent the
        cited snippet does not name would overstate the evidence.

    SUGGESTION 2 - redundant case-variant DOI cache stubs. Acted on; both
    deleted. references_cache/DOI_10.4103_2008-322X.183914.md and
    DOI_10.4103_2008-322x.183914.md were created by the deep-research
    reference-validation pass, are content_type: unavailable stubs with an
    empty body, and are cited nowhere in kb/ - the paper (Update on Normal
    Tension Glaucoma) is cited throughout by PMID:27413503, which has a real
    cached abstract. Note the two files were not byte-identical as the review
    described: they differ in the DOI casing on three lines (reference_id, doi,
    and the body link). Independent of the redundancy, two paths differing only
    in case collide on case-insensitive filesystems, so removing at least one
    was warranted on its own. Neither file was hand-edited at any point.

    SUGGESTION 3 - optional environmental: section. Declined, as the reviewer
    itself allowed. Nocturnal hypotension, vasospasm and migraine are
    general-NTG risk context, not OPTN-specific, and are already routed into
    the "Non-Mendelian normal tension glaucoma" differential diagnosis where
    they belong. Adding them as environmental: entries on this entry would be
    exactly the error the deep-research report's own curation rule warns
    against - transferring general NTG statistics into an OPTN-specific field.
    An environmental: block with influences_mechanisms remains the right home
    if OPTN-specific exposure evidence emerges.

    ONE CORRECTION TO THE REVIEW RECORD, noted for provenance rather than as a
    dispute. The review observes that the DR report was generated with
    mondo_id: '' and infers the NEC preflight therefore had no MONDO anchor.
    The empty frontmatter field is real - the research template variable was
    not populated - but the preflight is a separate command that takes the ID
    as an argument, and it was run explicitly:
    `just preflight-dr research/OPTN-related_Open_Angle_Glaucoma-deep-research-falcon.md MONDO:0100553`
    returned PASS, with OPTN mentioned 125 times against TBK1 25 / MYOC 6, and
    the report's OMIM 137760 matching the MONDO xref. So the anchor check was
    performed against MONDO:0100553, not merely cleared by inspection.

    VALIDATION AFTER THESE EDITS. just validate: passed, 97/97 snippets
    verified (up from 95 with the two new evidence items).
    just validate-disorders over this entry and Glaucoma.yaml (the batched
    --no-full-text sweep CI runs): passed, 130/130 verified; the two WARN items
    remain the pre-existing ega:/metabolomics_workbench: accessions in

    # Review: OPTN-related Open Angle Glaucoma

    - **File:** `/home/user/dismech/kb/disorders/OPTN-related_Open_Angle_Glaucoma.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical audit:** `dismech.reference_snippet_audit` — **97/97 snippets verified** against cached references. No unverified snippets.
    - **Reviewer note:** report-only; no KB, cache, or history files were modified.

    ## Verdict: MINOR_ISSUES

    Every quoted snippet is an exact source substring, every snippet substantively supports the
    claim it is attached to, the gene/disease/direction pairing is correct throughout, and the
    entry is unusually disciplined about hedging (explicit `notes:` on the mitophagy node about
    non-neuronal cell lines; a `HUMAN_MODEL_MISMATCH` discussion about the mouse models; explicit
    PARTIAL grading where a review bundles mechanisms). The findings below are classification
    and prose-precision issues, not fabrications or claim-fidelity failures.

    ## Findings

    ### 1. MINOR — PMID:26302410 is a review but is tagged `IN_VITRO` in five places, contradicting the file's own convention

    - **Location:** `pathophysiology[0].downstream[0]`, `pathophysiology[1].evidence[0]`,
      `pathophysiology[1].evidence[1]`, `pathophysiology[1].downstream[1].evidence[0]`,
      `pathophysiology[4].evidence[0]`, `genetic[1].evidence[1]` — all `reference: PMID:26302410`.
    - **Entry claims:** each of these carries `evidence_source: IN_VITRO`.
    - **What the source is:** PubMed records PMID:26302410 (Sirohi & Swarup, *Exp Eye Res* 2016,
      "Defects in autophagy caused by glaucoma-associated mutations in optineurin",
      [DOI](https://doi.org/10.1016/j.exer.2015.08.020)) with `article_types: ["Journal Article",
      "Research Support, Non-U.S. Gov't", "Review"]`. The cached file carries no
      `publication_types` block, which is presumably how this was missed. According to PubMed, it
      is a review.
    - **Why it matters:** the entry itself tags every *other* review it cites (`PMID:26142952`,
      `PMID:29951055`, `PMID:27693724`, `PMID:29875767`, `PMID:27413503`) as `OTHER` with an
      explicit "Evidence source is OTHER because this is a review" sentence in the `explanation`.
      So the file states a convention and then breaks it six times for one paper. The quoted
      content is accurate and the underlying experiments summarised are genuinely cell-based work
      from that lab, so this is a labelling inconsistency rather than a fidelity error — but a
      consumer filtering on `evidence_source` gets a review counted as primary in vitro data.

    ### 2. MINOR — "retinal cells" in PMID:26302410 is not the same as "retinal ganglion cells"

    - **Location:** `pathophysiology[4] Retinal Ganglion Cell Apoptosis`, evidence PMID:26302410;
      and the same snippet on `pathophysiology[0].downstream[0]`.
    - **Entry claims:** node named *Retinal Ganglion Cell Apoptosis*.
    - **What the paper says:** "A glaucoma-associated mutant of optineurin, E50K, impairs
      autophagy as well as vesicle trafficking, leading to death of **retinal cells** by
      apoptosis." The review's underlying cell work is largely in RGC-5 / 661W lines — and
      PMID:33723228, cited in the same entry, states explicitly that "recent evidence identified
      RGC-5 cells as the 661 W photoreceptor cell line and indicated that RGC-5 cells are not of
      RGC origin".
    - **Why it matters:** low practical impact, because the node is independently anchored by
      NeuN⁺ ganglion-cell counts in E50K knock-in mouse retina (PMID:33723228) and by human
      iPSC-derived RGCs (PMID:39425218), and the `explanation` correctly says "retinal cell
      death" rather than upgrading it. Worth recording so the review quote is not later read as
      RGC-specific evidence.

    ### 3. MINOR — top-level `description` states the mitophagy block as established in retinal ganglion cells; the node it summarises says otherwise

    - **Location:** entry `description` (lines 26-30) vs `pathophysiology[2]` `notes`.
    - **Entry claims (description):** mutant optineurin "blocks autophagic-lysosomal flux **and
      OPTN-dependent mitophagy in retinal ganglion cells**".
    - **What the sources say:** the mitophagy evidence is PMID:37207627 (gene-edited HeLa-type
      lines and in vitro reconstitution: "Using gene-edited cell lines and in vitro
      reconstitutions, we show that OPTN utilizes the kinase TBK1…") plus a review sentence
      listing mitophagy among OPTN functions (PMID:26142952). Neither reports mitophagy failure
      in retinal ganglion cells.
    - **Why it matters:** the node's own `notes:` are candid — "The mitophagy work cited here is
      mechanistic cell biology in gene-edited non-neuronal lines, not a demonstration in
      OPTN-mutant human retina" — so the summary description asserts more than the entry's own
      evidence supports. Suggest softening the description to match the node (e.g. "and, on
      mechanistic grounds, OPTN-dependent mitophagy").

    ### 4. MINOR — the population-specificity discussion overstates PMID:14755458

    - **Location:** `discussions[1] optn_allele_population_specificity`, `rationale`.
    - **Entry claims:** "The OPTN alleles reported as risk-conferring or disease-causing in
      Caucasian cohorts **were not detected in Japanese glaucoma patients**."
    - **What the paper says:** "Out of four mutations reported to be associated with risk and to
      cause disease in Caucasian patients, sequence alterations in 458G > A and 691_692insAG were
      not detected in any investigated Japanese patients with glaucoma, and alterations in 1944G
      > A and 603T > A, were present in similar frequencies in glaucoma patients and control
      subjects." Two of four were absent; the other two were present but not enriched.
    - **Why it matters:** the quoted snippet used ("there may be certain racial differences
      between Japanese and Caucasians with respect to OPTN genotypes") is accurate and verified,
      but the surrounding rationale generalises "absent" over all four alleles. A one-clause fix
      ("two of the four … were not detected, and the other two were present at control
      frequencies") makes the rationale match the source.

    ### 5. MINOR — a human phenotype supported only by mouse evidence, where a human source is already in the cache

    - **Location:** `phenotypes[4] Abnormal Retinal Nerve Fiber Layer Morphology`, sole evidence
      PMID:20388642, `evidence_source: MODEL_ORGANISM`, `supports: PARTIAL`.
    - **Entry claims:** RNFL thinning as a phenotype of the human disease.
    - **What is cited:** the E50K transgenic *mouse* histology sentence. The entry discloses this
      honestly in the node description and grades it PARTIAL, which is the right handling of the
      repo rule that model-organism evidence should not be the sole support for a human phenotype.
    - **Why it matters:** the gap is closeable without new literature work — PMID:27413503, already
      cached and cited elsewhere in this file, contains the human NTG statement "progressive
      retinal nerve fiber layer thinning, characteristic visual field defects, open anterior
      chamber angles on gonioscopy". Adding that as a second `HUMAN_CLINICAL` item would remove
      the sole-model-organism status.

    ### 6. MINOR — two small prose claims are not covered by the evidence attached to their own block

    - `genetic[1] OPTN p.Met98Lys` `features:` says M98K is "**not replicated in Caucasian
      populations**"; the two evidence items on that block are the Japanese case-control study
      (PMID:15226658) and the mechanism review (PMID:26302410). The non-replication statement is
      in PMID:31238079 ("in some populations, generally Caucasian cohorts, the frequency of this
      mutation is similar among NTG patients and controls") and PMID:29951055, both cached and
      cited elsewhere in this file, but not attached here.
    - `diagnosis[0]` says "a thin cornea causes tonometry to underestimate the true pressure";
      the cited PMID:27413503 states only that "Central corneal thickness (CCT) in patients with
      NTG is lower than POAG subjects". The inference is standard ophthalmology but is not in the
      quoted source.
    - **Why it matters:** neither is wrong; both are cases where the supporting sentence exists in
      the local cache and could simply be cited on the block that makes the claim.

    ## Non-findings (checked and cleared)

    - **Same-sentence `evidence_source` divergence:** none in this file.
      `scripts/check_snippet_grading.py --all` reports no divergence for
      `OPTN-related_Open_Angle_Glaucoma.yaml`. PMID:27693724 legitimately carries two different
      values on two *different* sentences — `OTHER` for the review's framing sentence and
      `MODEL_ORGANISM` for "Here we show for the first time that amlexanox protects RGCs in Optn
      E50K knock-in mice", which is that manuscript's own new in vivo result. That is exactly the
      split the repo guidance asks for.
    - **`check_snippet_length` / `check_title_snippets`:** no hits for this file; no snippet is a
      bare paper title used as a finding.
    - **Numbers:** 16.7% of hereditary POAG families (PMID:11834836), ~1% of NTG for OPTN
      (PMID:31238079), ~2% single-gene NTG (PMID:37353142), 11 E50K subjects with presenting/peak
      IOP 15.3±3.0 / 16.5±2.5 mmHg, mean age 40.8±15 y, mean C:D 0.86±0.1, filtration surgery
      72.7% vs 25.3% (P=0.003), seven asymptomatic carriers aged 23-58 (all PMID:16043855), 28%
      retinal thinning in the transgenic line (PMID:20388642) — all match their sources exactly.
    - **Animal-model fidelity claims:** verified against PMID:33723228 full text — the knock-in
      line is indeed reported homozygous ("the OPTN (E50K) mice exhibited a homozygous mutation of
      148 (G > A)"), IOP is indistinguishable from WT (12.06±0.74 vs 12.71±0.61 mmHg, p=0.39),
      viable NeuN⁺ RGCs are decreased and cleaved caspase-3 increased. The `limitations` text on
      the model links is accurate rather than boilerplate.
    - **Prevalence modelling:** both records correctly use `measure_type: UNKNOWN` /
      `prevalence_class: UNKNOWN` with no `rate_per_100000`, and the `notes:` explicitly warn that
      16.7% is a proportion-of-families figure from an ascertainment-enriched cohort, not a
      population rate. This is the right handling of a fraction-of-cases number.
    - **Datasets:** `geo:GSE145069` / `geo:GSE173129` — their linked publications (PMID:32531194
      hPSC-derived OPTN(E50K) RGCs; PMID:35714595 OPTN(E50K) astrocytes) are both cached and both
      genuinely OPTN(E50K)-genotype-specific, matching the relevance-triage note. No evidence
      block, as the bulk-dataset convention requires.
    - **Scope discipline:** TBK1-related NTG is correctly excluded as a separate concept and
      curated only as a differential; the `Progressive Glaucomatous Optic Neuropathy…` node
      explicitly declines conformance to the module's elevated-IOP arm.


  summary: 'Create: Vitamin D-Dependent Rickets Type 2A'
  details: |
    De-novo curation of the VDR (receptor resistance) member. Models the alopecia as a separate branch off the receptor node, deliberately kept OFF the mineralization conformance chain because it is not part of that mechanism and is not corrected by normalizing calcium. Adds two animal models with modeled_mechanisms links: the VDR-null mouse (RECAPITULATES both the skeletal and alopecia nodes, with a hypertrophic-zone-width readout) and the keratinocyte-targeted ligand-binding-dead VDR transgene (RESCUES the alopecia node), which is the evidence that the hair-follicle role of the receptor is ligand independent. Alopecia frequency VERY_FREQUENT is backed by a direct quantitative count (97.6% of 42 patients), and seizure OCCASIONAL by 9.5% in the same series. Deep research: just research-disorder claude_code, report at research/Vitamin_D-Dependent_Rickets_Type_2A-deep-research-claude_code.md; its reference_validation block reports 27/28 verified with needs_review true, and the single unresolved DOI was not cited. just preflight-dr against MONDO:0010186 returned PASS (VDR mentioned 82 times; report OMIM 277440 matches the MONDO xref). Evidence: PMID:2849209, PMID:38872968, PMID:9275211, PMID:15591533. Validation: linkml-validate clean; just validate-terms passed; just count-verified-snippets 18/18 verified.

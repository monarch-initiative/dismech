  summary: 'Review: Vitamin D-dependent rickets type 2A'
  details: |
    Deep-reviewed VDDR2A against current primary and review literature. Corrected
    the disease boundary to usual biallelic VDR loss with a rare heterozygous
    dominant-negative mechanism. Decomposed allele-specific receptor defects into
    an atomic causal graph connecting mineral transport, secondary
    hyperparathyroidism, phosphate wasting, skeletal mineralization, and
    ligand-independent hair cycling.

    Replaced universal hormone-nonresponse and alopecia claims with
    genotype-calibrated frequencies and oral-response evidence. Added molecular
    diagnosis and response-stratified oral active-vitamin-D/calcium versus
    intravenous-calcium management without asserting an unsupported therapeutic
    trial. Added and independently verified the human GSE127314 fibroblast dataset
    and mouse GSE260988 Vdr Delta-AF2 dataset with explicit model limitations.

    Eligibility was established against authoritative main/HEAD
    dbe05cbd61bca5687d8ece2ff29ee1d7936b331c. A semantic scan of 5,826 history
    YAMLs used the exact predicate `.events[]?.type == "REVIEW"` and the effective
    target `.target.superseded_by.path // .target.path`; among 1,280 REVIEW
    records, none resolved to this target. All file lists for a stable snapshot of
    172 open PRs were fully paginated and checked using both `filename` and
    `previous_filename`. PR #7922 reported 7,728 files, beyond the API's 3,000-file
    cap, so the exact base c43343af4054eeeab847621eaab1e10da7efde84 to head
    1718953e560f96a66daacc93a8108ba7336200b5 diff was checked as a fallback. No
    collision was found.

    On the case-insensitive APFS worktree, the following six distinct HEAD/index
    entries and blobs were verified and guarded locally with `skip-worktree`;

  summary: 'Edit: address PR review on VDDR type 2A'
  details: |
    Addressed reviewer findings on PR #8975. (a) Claim-evidence mismatch: the Calcitriol-Unresponsive Intestinal Calcium Malabsorption link was cited to a treatment-arm count; replaced with the sentence stating the intestinal calcium and phosphate absorption defect despite high 1,25(OH)2D. (b) The Hypocalcemia phenotype reused the Rickets snippet; replaced with a hypocalcemia-specific sentence. (c) Added five phenotypes that clear the blocking threshold (hypophosphatemia, secondary hyperparathyroidism, elevated alkaline phosphatase, bowing of the legs, growth failure), noting on hypophosphatemia that presentations without hypocalcemia can be mistaken for FGF23-mediated disease. (d) Added a biochemical block for elevated 1,25(OH)2D - the analyte the grouping rationale rests on - and parathyroid hormone; no HP term is bound for elevated calcitriol because HP:0100512 states the opposite, recorded as a candidate for an HPO new-term request. Also corrected reference_title values stripped of trailing periods by an earlier scripted pass. Validation: linkml-validate clean; just validate-terms passed; just count-verified-snippets 27/27.

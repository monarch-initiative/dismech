  summary: 'Unstick PR 9375: merge main, fix reference_title'
  details: 'Conflict-resolution pass on a PR that had been approved since 2026-08-24 and sat
    un-mergeable against main. Merged origin/main into the branch (never rebased; branch is
    cmungall''s). The only conflicts were cache artifacts: cache/go/terms.csv, cache/hp/terms.csv
    and the molecularfunctionterm/phenotypeterm enum caches were union-merged on CURIE with
    main''s row winning same-key collisions, leaving two genuinely new GO rows over main (GO:0005499
    vitamin D binding, GO:0070644 vitamin D response element binding) and the HP caches byte-identical
    to main. cache/dataset_accessions.json was restored verbatim from main: that file was
    frozen after this branch was cut and must never be staged. Fixed a real defect the post-merge
    gates surfaced: diagnosis[0].evidence[2] and [3] carried reference_title ''Vitamin D Dependent
    Rickets Type I.'' against PMID:32596195, whose cached title is ''Diagnosis and Management
    of Vitamin D Dependent Rickets.'' The reference and both snippets are correct and verify
    against that cache; only the title string was wrong, and it named a different publication.
    Corrected to the cache frontmatter title, which is the form the three sibling VDDR entries
    already use for the same PMID. Also closed the reviewer''s one unresolved non-blocking
    question: it could not verify whether a GeneReviews chapter exists for VDDR2A because
    curl and WebFetch were denied in its environment. just check-genereviews, which now answers
    this offline from the committed Bookshelf index (snapshot 2026-09-10, 958 GeneReviews
    chapters), reports NO_CHAPTER, confirming the reviewer''s three local signals. Validation:
    just validate-disorders passes with 76/76 snippets verified; check-enum-values, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-case-collisions,
    validate-history-all and the whole-KB baseline gates all pass. Second defect surfaced
    by check-snippet-grading: genetic[0].evidence[2] graded the PMID:28377956 sentence ''The
    mutant had a dominant-negative effect on wild-type-VDR, and the ligand binding affinity
    of Q400LfsX7-VDR was completely impaired.'' as HUMAN_CLINICAL while pathophysiology[1].evidence[0]
    graded the same sentence IN_VITRO. evidence_source classifies the cited publication, so
    one sentence cannot carry two values in one file. In the abstract that sentence sits inside
    ''Functional studies revealed...'' - a cell-based transactivation and ligand-binding assay
    - and the genetic item''s own explanation already begins ''Functional testing identifies'',
    so IN_VITRO is correct and the HUMAN_CLINICAL grading was wrong. Regraded the genetic
    item to IN_VITRO rather than re-quoting, since its explanation was already describing
    the functional result. The paper''s human segregation sentences remain available if a
    later pass wants a separate HUMAN_CLINICAL item for the inheritance claim.'

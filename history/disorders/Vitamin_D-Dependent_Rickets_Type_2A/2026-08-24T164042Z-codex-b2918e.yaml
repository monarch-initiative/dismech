  details: |
    Draft PR #9375 received a formal exact-head CHANGES_REQUESTED review at
    c87f924e03ae710fbb0ee1edb2572f66ac59e1fe, with zero review threads. This
    append-only EDIT addresses only its three blocking groups: cardinal clinical
    findings, genetic completeness, and differential diagnosis/monitoring. The
    PR remains draft; no review, thread, ready-state, or auto-merge write was
    made.

    Added muscle weakness (HP:0001324), hypotonia (HP:0001252), bone pain
    (HP:0002653), enlargement of the costochondral junction (HP:0000920), and
    enamel hypoplasia (HP:0006297), each with exact local evidence. Frequencies
    remain unset because none of the selected sources supplies a quantitative
    disease-wide denominator. The review request's HP:0004464 mapping was
    rejected because that identifier is Postauricular pit; HP:0000920 is the
    evidence-aligned costochondral-junction/rachitic-rosary representation.
    HP:0000897 was neither used nor generated. A first immutable audit also
    caught unsupported bone-mineralization edges to muscle weakness, hypotonia,
    and enamel hypoplasia. Those edges and causal myopathy/progression prose were
    removed rather than manufacturing connectivity, leaving those three
    occurrence phenotypes intentionally unwired.

    Expanded the genetic account with consanguinity context, chromosome-12
    maternal uniparental isodisomy as an exceptional route to VDR homozygosity,
    compound heterozygosity, and representative p.Ile268Thr, p.Val26Met,
    p.Arg343His, p.Arg343Cys, splice-site, and truncating alleles. Local exact
    evidence establishes p.Ile268Thr as a ligand-binding-domain allele and
    p.Arg343Cys as an LBD pathogenic/segregating allele without inferring an
    unsupported RXR/coactivator-interface defect. The usual inheritance remains
    autosomal recessive and the previously curated rare dominant-negative
    autosomal-dominant mechanism remains explicitly exceptional. Penetrance is
    UNKNOWN, not COMPLETE: core skeletal/biochemical findings are consistent in
    reported affected families and ascertained cohorts, but those sources cannot
    estimate penetrance among pathogenic-variant carriers. Expressivity remains
    VARIABLE, with allele-dependent alopecia.

    Expanded diagnosis with explicit nutritional-rickets, VDDR1A, VDDR1B,
    VDDR2B, XLH, and other FGF23-mediated renal-phosphate-wasting differentials.
    The atypical normocalcemic, hypophosphatemic presentation is identified as an
    FGF23-disorder mimic. Exact local PMID:32596195 evidence supplies the excess-
    FGF23 mechanism, and the PMID:40383122 item now spans radiographic/rickets
    healing, phosphate normalization, and persistently elevated PTH so the
    longitudinal monitoring caveat is locally entailed.


  summary: 'Gene-family review: VDR node molecular functions'
  details: |
    VDR allele-class nodes re-reviewed. Three nodes carried VDR with no molecular function: the null-allele node now binds nuclear receptor activity (GO:0004879) as ABSENT; the coactivator-recruitment node binds transcription coactivator binding (GO:0001223) as decreased, matching the AF-2 mutant's inability to interact with coactivators (PMID:39164247); the dominant-negative node binds transcription corepressor binding (GO:0001222) as increased, since the p.Q400LfsX7 receptor binds NCoR strongly and does not release it after ligand (PMID:28377956). Two bindings were made specific: vitamin D binding (GO:0005499) became calcitriol binding (GO:1902098) on the ligand-binding node, and protein heterodimerization activity (GO:0046982) became nuclear retinoid X receptor binding (GO:0046965) on the RXR-heterodimerization node. The VDR record gains a record-level inheritance list (autosomal recessive, PMID:2849209; rare autosomal dominant for the dominant-negative class, PMID:28377956). No ClinGen VDR assertion exists.

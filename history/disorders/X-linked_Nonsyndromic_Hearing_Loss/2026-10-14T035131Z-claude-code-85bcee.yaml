  details: |
    Added a new Pure-Tone Audiometry row with the panel and eight per-ear frequency codes as measurements. No reference range is recorded: this entry spans both conventional sensorineural DFNX subtypes and the AIFM1-related auditory-neuropathy subtype, for which the entry's own content states that an OAE-present/ABR-absent pattern, not a pure-tone threshold or grade, is the discriminating finding -- a single WHO/GBD scheme would apply cleanly to some subtypes and misrepresent others. Part of LOINC tranche G batch 14 (projects/LOINC_DIAGNOSTICS.md).

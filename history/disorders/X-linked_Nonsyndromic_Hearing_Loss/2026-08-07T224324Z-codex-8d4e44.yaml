  summary: 'Review: tighten X-linked hearing-loss evidence scope'
  details: |
    Independent audit follow-up narrowed the negative Col4a6 knockout to
    refutation of simple loss of expression in that mouse model, not broad human
    COL4A6 causality, and added an OPEN HUMAN_MODEL_MISMATCH discussion with
    allele-matched mouse and isogenic human-model experiments. Removed the
    NCIT:C15747 binding from hearing-aid amplification while retaining the
    free-text preferred term and DEVICE modality. Removed or narrowed statements
    supported only by full text, replacing them with direct abstract-level
    evidence for the ABR/OAE pattern (PMID:10663046), TIMM8A
    deafness-dystonia-neurologic features (PMID:31903733), and general hearing-aid
    use (PMID:36633841). Norrie diagnostic details were retained only with exact
    eligible GeneReviews evidence (PMID:20301506). Targeted schema, term, and
    snippet validation passed with 71/71 cached snippets verified.

  summary: 'Review: X-linked Nonsyndromic Hearing Loss'
  details: |
    Reviewed the entry for completeness and exact evidence-claim alignment. Added the unresolved DFNX3 locus so the subtype list matches the established six-locus/five-gene classification, and removed category-share records that had been misrepresented as population prevalence. Distinguished definitive nonsyndromic-hearing-loss validity for POU3F4 and SMPX from definitive broader lumped spectra for PRPS1 and AIFM1. Recorded COL4A6 as LIMITED in the February 2022 ClinGen assertion, retained human family and minigene observations as variant-level partial evidence, and added the conflicting Col4a6-knockout mouse result as REFUTE evidence against a simple loss-of-expression mechanism. Added conservative pathograph links from POU3F4/IP-III and orphan COL4A6 nodes to hearing impairment without overstating causality. Added gene-specific female expressivity, structured PRPS1/AIFM1/COL4A5/OTOF/inner-ear-malformation differentials, and sourced TIMM8A/Mohr-Tranebjaerg and Norrie disease mimics. Added ABR/OAE/cochlear-microphonic and imaging workup, phrasing MRI as potentially valuable rather than universally indicated, plus the AIFM1 cochlear-nerve-hypoplasia cochlear-implant caveat. Reclassified patient enzyme and minigene assays as IN_VITRO, and narrowed unsupported DFNX and ANSD generalizations. Follow-up review bound cochlear nerve hypoplasia and incomplete cochlear partition to the closest available HPO terms, added cached GeneReviews baselines, restored the POU3F4 cohort fraction under Genetic.case_fractions, and added hearing-aid amplification. Verified ontology lookup for auditory neuropathy found no exact local HPO term, so it remains unbound rather than using a broader substitute. Schema, ontology, history, and exact snippet checks passed against the local reference cache.

  details: |
    Merging main into this branch (44d2059) took main's whole version of this entry, which #12578 had rewritten while the PR was open. That rewrite wires all nine ADPKD-spectrum genes to their own pathophysiology nodes, so the pathophysiology this PR had added was not re-applied - main's is the current curation and the node names differ. What the merge also dropped was the five-row has_subtypes block, which nothing on main replaced: no file in kb/ bound MONDO:0008263 (PKD1), MONDO:0054842 (PKD6), MONDO:0031062 (PKD7), MONDO:0971178 (PKD8) or MONDO:0700000 (ALG9), while the PR still deleted stubs/Polycystic_Kidney_Disease_1.yaml and still claimed those rows against #12256.

    This record covers putting that block back on main's version of the entry, unchanged in content, with its review_notes repointed at main's node names: the per-gene activity nodes converging on "Impaired polycystin maturation" for GANAB/DNAJB11/ALG5/ALG9, "Reduced NEK8 p.Arg45Trp kinase activity" into "Variant-dependent loss of ciliary polycystin-2 localization" for NEK8, and "Proposed loss of IFT140-mediated TULP3 binding" into "IFT140-associated ciliary dysfunction" for IFT140. The three old node names it used to cite do not exist on main.

    The two earlier ADPKD records on this branch (2026-10-01T044054Z-...-b6fac3 and 2026-10-01T052733Z-...-9615bb) describe pathophysiology edits that are no longer in the tree. They are left as they are; history is append-only and they accurately describe the sessions that ran.

    Validation: just validate (all passed), just check-entity-refs, just check-causal-targets (no new dangling targets), just check-duplicate-keys, just validate-history. Term validation added the five MONDO rows to cache/mondo/terms.csv and the diseaseorsubtypeterm enum cache.

  details: |
    Genetics pass for dismech#12256 (d2g series-049), autosomal dominant polycystic kidney disease.

    Anchor. disease_term MONDO:0004691 autosomal dominant polycystic kidney disease is exactly this entry's concept, its definition is "Autosomal dominant form of polycystic kidney disease", and all seven of its children are gene-defined ADPKD forms. The entry had no has_subtypes block at all, so the reciprocal test was vacuous, and the five issue rows are genuine children rather than an artifact of an over-broad anchor. No anchor change.

    Issue rows. All five genes named in the reconciliation checklist (PKD1, DNAJB11, ALG5, NEK8, ALG9) already had genetic records here with Orphanet, GeneReviews and ClinGen evidence; what was missing was any binding of the five MONDO classes. Added five has_subtypes rows: PKD1 (MONDO:0008263), PKD6 (MONDO:0054842, DNAJB11), PKD7 (MONDO:0031062, ALG5), PKD8 (MONDO:0971178, NEK8) and ALG9-associated ADPKD (MONDO:0700000). Each row's gene matches the gene MONDO asserts in that class's OWL axioms. stubs/Polycystic_Kidney_Disease_1.yaml deleted.

    Routing. Two of the seven children are curated as standalone entries instead, Polycystic_Kidney_Disease_2 for MONDO:0013131 and Polycystic_Kidney_Disease_3 for MONDO:0010916, and are deliberately not duplicated as rows. The five rows sit on the parent because they share a lesion with it, which the pathograph now models; the review_notes on the block records this and keeps promotion to a standalone entry open for PKD6 and PKD7, whose ADPKD/ADTKD-hybrid trajectory of non-enlarged kidneys with interstitial fibrosis differs from the parent's on the same grounds Polycystic_Kidney_Disease_3 records for GANAB.

    Gene wiring, the largest gain in this change. dismech.qc_plugins.gene_mechanism_wiring_coverage was 2/9: only PKD1 and PKD2 reached a pathophysiology node, and GANAB, DNAJB11, IFT140, ALG5, ALG9, NEK8 and ALG8 reached none. Two upstream nodes were added, both feeding the existing polycystin node. "Defective polycystin-1 maturation in the endoplasmic reticulum" carries GANAB, DNAJB11, ALG5, ALG8 and ALG9, with the founding reports for each gene showing that polycystin-1 maturation and ciliary localization require it and that one defective copy is enough. "Ciliary transport and inversin-compartment signaling defect" carries IFT140 and NEK8. Wiring is now 9/9. causal_inlink_coverage was and remains 26/26, and no node lacks an outgoing edge.

    What is deliberately not claimed. ALG8 is grouped on the maturation node but no enzymatic step is attributed to it: PMID:39899384 defines ALG8 and ALG9 as cystic kidney and liver genes without stating what ALG8 does, and that sentence is the cited basis for its placement. ALG9's ClinGen assertion is the only one of these five scored against the child class (MONDO:0700000) rather than against MONDO:0004691, and the ALG9 row says so.

    Validation on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 342 snippets checked, 0 issues; just count-verified-snippets reports 342/342 after reverting the fix-references-cache whitespace churn. just check-genereviews reports the ADPKD GeneReviews chapter PMID:20301424 as tagged.

  summary: Review ADPKD against full clinical guidelines and primary mechanistic and trial evidence
  details: |
    Reviewed the complete ADPKD entry and its two previous EDIT records. This inherited Mendelian disorder remains in the narrowed queue; urinary and cyst infections are complications and do not make the underlying disorder an infectious disease. Read the manual source-curation fallback report and the genuine falcon canonical-hypothesis report, citations and both evidence/experimental-design tables. The fallback is not represented as a completed provider report. The falcon report's Ift88 and universal 93% second-hit shorthand are corrected against the primary studies.

    Cached full-text use: recovered GeneReviews through the NCBI sites/books PDF route after the standard routes returned CAPTCHA; read all clinical, diagnostic, management, counseling and molecular-pathogenesis sections. Read the scientific sections of the official KDIGO 2025 executive summary (pp234–252), updating the older GeneReviews management where needed. The fetcher gives these PDF caches URL titles, so reference_title matches generated metadata while explanations identify the documents. No cache text was hand-created or edited. The associated GeneReviews PMID remains tagged and its clinical characteristics, diagnosis, management and genetic-counseling domains are each directly quoted.

    Read main text and relevant methods/results/discussion of PMID:26877954, PMID:23892607 and PMID:27007841. Cilia removal after polycystin loss suppresses cyst growth in conditional Kif3a/Ift20 models; timing matters, and distal/proximal ERK/cAMP results do not establish a universal downstream pathway. Ratiometric calcium imaging challenges obligatory flow-induced ciliary calcium influx, not every form of mechanosensation or the causal importance of polycystins. Separate proliferation, chloride-driven secretion, cyst expansion, tissue injury and vascular resistance; remove unsupported renal-cell-to-every-extrarenal-phenotype edges. Extrarenal vascular and hepatic processes have their own evidence. Eight associated phenotypes remain unconnected where the reviewed evidence does not establish a causal chain.

    Read human somatic-variant studies PMID:30042192 and PMID:39702469. Report 57/63 sequenced cyst epithelial samples in nine end-stage patients and 14/24 smaller whole cysts in six PKD1-positive end-stage patients separately. The latter uses duplicate UMI libraries, site-specific error modeling and orthogonal confirmation of available samples, with low variant allele fractions. Neither cohort directly observes initiation or phases every hit; detection depends on sampling, variant class and coverage. Keep a knowledge gap rather than turning either proportion into universal biological penetrance.

    Read PMID:37598857 and PMID:39899384 full main text, relevant methods and clinical tables. NEK8 is restricted to particular kinase-domain missense variants; PC2 localization defects in Nek8-null IMCD3 rescue assays are R45W/K157Q-specific and do not themselves prove dominant-negative interference. The abstract's patient-tubuloid R45W shorthand does not match the K157Q case in the results and is not propagated. ALG8/ALG9 clinical and genotype-first cohorts support variably penetrant cystic disease, with greater uncertainty about modifiers and clinically significant functional impairment. Minor-gene phenotype/prognosis is not forced into typical PKD1/PKD2 Mayo classification or tolvaptan trial assumptions. GeneReviews supplies the DNAJB11, GANAB, ALG5 and IFT140 distinctions. The prevalence band's legacy name is misleading but its schema range includes 93/100000; retain that valid band and correct the percentage to 0.093%. Remove the unsupported global INCOMPLETE penetrance assignment inferred from de novo frequency.

    Read PMID:27077126 main text and methods. Its bulk male mouse kidney metabolomics (14 kidneys, eight mutants) is distinct from paired immortalized renal epithelial fatty-acid oxidation assays; glycolysis was not increased in those assays. Sex, disease burden and uncertain human translation matter. Resolve metabolomics_workbench:ST000878 against its live repository without reading or updating cache/dataset_accessions.json. Replace discovery-router boilerplate with biological dataset context and a bounded metabolic knowledge gap; no human dietary efficacy is inferred.

    Read the recovered TEMPO full text (PMID:23121377), HALT-PKD full text (PMID:25399733), and REPRISE publication via its UCL full PDF plus PMID:29105594 abstract. TEMPO's primary volume endpoint, kidney-function endpoint, discontinuation and aquaretic/hepatic risks are kept distinct. REPRISE randomized 1370 after tolerability run-in; 1331 contributed to its primary analysis. A one-year eGFR benefit does not directly observe delayed dialysis, and run-in selection limits tolerability generalization. HALT-PKD's lower kidney-volume growth did not yield an overall eGFR benefit; dual renin-angiotensin blockade did not improve the principal outcomes. Verify both NCT00428948 and NCT02160145 as completed phase-3 records through the live registry; add REPRISE.

    Completeness assessment: phenotypes adequate after adding concentrating impairment, seminal vesicle cysts, abdominal wall hernias and incidental bronchiectasis with its imaging context; catalog frequency bands carry ascertainment limits. Preserve the very rare pituitary catalog association without inventing causation, and do not infer infertility from sperm findings. Genetics/mechanisms adequate with variant classes, tissue context, evidence-grade repair and nine causal genes connected. Diagnosis now covers actual age/family imaging criteria, genetic assay limitations, MIC scope, aneurysm screening and childhood BP surveillance. Differential diagnoses distinguish simple cysts, HNF1B, ARPKD, ADTKD and tuberous sclerosis/contiguous deletions. Treatments distinguish tolvaptan, age/stage/measurement-specific BP targets, sodium restriction, counseling, pain/infection management, kidney replacement and symptomatic liver interventions. Full KDIGO evidence supports long-acting somatostatin analogues for severe volume-related PLD, not generic renal protection. Primary references and full texts are actively consumed. No separate gene-defined subtype split is introduced; gene-specific clinical distinctions remain in this spectrum entry. Exploratory STING/DNA-structure leads without established clinical benefit remain nonblocking research context.

    Validation and the independent-review outcome are recorded in the PR. Initial complete draft has 146 verified cached quotations, 22/30 phenotypes with causal links and 9/9 causal genes wired; missing phenotype links are deliberately evidence-limited. Applicable entity/causal, qualifier, source-defect, boundary, knowledge-gap, delivery, coarse-phenotype and GeneReviews checks pass.

    Independent review approved the initial draft with optional suggestions. Added a direct REPRISE full-text quote documenting run-in exclusions; removed result-role annotations from registry purpose statements and the metabolic future-work statement. Added cholangiocyte and ACE inhibitor/ARB class bindings, standardized ALG8 naming and attached the REPRISE kidney-function phenotype. OLS lookup found the suggested GO:0072372 obsolete; used the current primary-cilium synonym GO:0097731 (9+0 non-motile cilium) after checking its definition and enum membership.

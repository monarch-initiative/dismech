  summary: 'Review round 1: split the IFT140/NEK8 node, add molecular functions, cite
    the IFT140 founding report'
  details: |
    Review round 1 on dismech#13279, blocking item 1 plus two suggestions.

    Node split. "Ciliary transport and inversin-compartment signaling defect" carried IFT140 and NEK8 and asserted on a DIRECT edge that both reduce ciliary polycystin content. Only the NEK8 half was sourced, by the p.Arg45Trp kinase-activity result; the IFT140 paper says the opposite, that understanding of how the IFT140 protein influences renal development and cystic disease is limited and the true mechanism of cyst development in ADPKD-IFT140 is unknown. Split into two atomic nodes. "IFT140 Intraflagellar Transport Defect" carries IFT140 alone, keeps intraciliary transport DECREASED, and its edge to the polycystin node is typed INDIRECT_UNKNOWN_INTERMEDIATES quoting that unknown-mechanism sentence; its description states that the node does not assert a drop in ciliary polycystin. "NEK8 Inversin-Compartment Kinase Deficiency" carries NEK8 alone and keeps the DIRECT polycystin-2 edge. The has_subtypes review_notes no longer says IFT140 reduces ciliary polycystin content. Node count goes from eight to nine; both new nodes have an outgoing edge and node names remain unique.

    Better source for IFT140. PMID:34890546, the report that established monoallelic IFT140 variants as an ADPKD-spectrum cause, was already committed in references_cache as abstract_only and was not being cited here. It supplies the complex membership ("IFT140 is a core component of the intraflagellar transport-complex A, responsible for retrograde ciliary trafficking and ciliary entry of membrane proteins"), the authors' own description of the protein ("our studies link a ciliary structural protein to the ADPKD spectrum") and the monoallelic phenotype. No new reference was fetched for this round.

    Molecular functions, which is what the CI gate wanted. scripts/check_gene_activity_grounding.py failed on this branch with seven ADPKD genes newly wired to nodes carrying no molecular_functions. Added, each sourced from evidence already on the node: glucosidase activity for GANAB, glucosyltransferase activity for ALG5, mannosyltransferase activity for ALG9 and protein-folding chaperone binding for DNAJB11 on the maturation node; structural molecule activity on the IFT140 node; protein kinase activity on the NEK8 node. The gate now reports no newly ungrounded genes. No baseline was touched, and ALG8 still has no activity attributed to it, which the node description states.

    Suggestions taken. quote_role BACKGROUND added to both uses of the PMID:31395617 "Dominantly inherited ... at least six other genes" sentence, which is that paper's framing of earlier work. The ALG9 enzymatic-step snippet was a bare relative clause and is now the full sentence from the same abstract.

    Validation after the round, on the committed tree: just validate and just validate-terms pass; just validate-disorders over the five changed files reports 349 snippets checked, 364 titles checked, 0 issues; just count-verified-snippets reports 349/349 after reverting the 18 reference-cache files the validator renormalised. gene_mechanism_wiring_coverage stays 9/9 and causal_inlink_coverage 26/26.

  summary: 'Create: PLACK_Syndrome'
  details: 'Created a standalone entry for PLACK syndrome (MONDO:0014574, CAST). Before this it existed
    only as the PLACK-CAST subtype row of Peeling_Skin_Syndrome; that row now carries curated_in: PLACK_Syndrome
    and the MONDO subtype_term. Promoted because MONDO does not place MONDO:0014574 under peeling skin
    syndrome (MONDO:0019347), the cleavage and apoptosis are in the upper stratum spinosum rather than
    the stratum corneum, and about a quarter of patients develop childhood dilated cardiomyopathy, which
    no sibling subtype has. Deep research: falcon was requested but failed with ''503 Failed to authenticate''
    on two runs, the second with --fallback, which did not switch providers. ''deep-research-client providers
    --check'' reported falcon UNREACHABLE and claude_code OK, so the report used is research/PLACK_Syndrome-deep-research-claude_code.md,
    run explicitly. Its validation showed 21/21 references resolved, 18/18 quotes valid and 31/31 terms
    resolved. Primary sources were PubMed searches and cached abstracts or full text; seven PLACK case
    reports had no cached abstract text and were not cited. The cardiac mechanism is recorded as an EMERGING
    hypothesis (calpain_driven_cardiomyopathy) supported only by mouse calpain-overexpression models (PMID:35986214,
    PMID:30874894), with a KNOWLEDGE_GAP discussion. The calpastatin-knockout mouse paper (PMID:18803809)
    is a behavioural study that does not report skin, so it was not used to claim a model mismatch. NCIT:C467
    Emollient and NCIT:C79837 MCT/LCT Lipid Emulsion are outside the ChemicalEntityTerm enum, so those
    treatments carry no therapeutic_agent. Validation: just validate-disorders on both changed files passed
    (90 snippets, 0 issues); count-verified-snippets reported 90/90; check-entity-refs, check-causal-targets,
    check-duplicate-keys and check-genereviews (NO_CHAPTER) were clean.


    A pre-PR review (fresh-context subagent) led to: rebinding the adhesion process to GO:0090136 epithelial
    cell-cell adhesion; edge evidence on the calpain-to-adhesion step (PMID:42256365, INDIRECT/BACKGROUND);
    dropping the unsupported knuckle-pad frequency; softening the claim that dilated cardiomyopathy explains
    every death; adding primary sudden-death evidence; and a sentence in Peeling_Skin_Syndrome''s protease-inhibitor
    node noting that CAST separation is suprabasal. Not added: blistering, silver hair, warts, cerebral
    atrophy (single reports or MeSH only, no quotable text), and a DCM-to-sudden-death sequela (the sudden
    deaths were not attributed to cardiomyopathy).

    '

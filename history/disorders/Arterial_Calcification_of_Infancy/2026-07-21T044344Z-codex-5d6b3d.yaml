  summary: 'Evidence and mechanism re-review: Arterial Calcification of Infancy'
  details: |
    Re-reviewed generalized arterial calcification of infancy against contemporary
    reviews, natural-history and survivor cohorts, primary mechanism studies, and
    the current ClinicalTrials.gov record. Rebuilt the causal model around ENPP1-
    and ABCC6-associated extracellular pyrophosphate failure, retained reduced
    AMP/adenosine signaling and ENPP1-related auditory dysfunction as explicitly
    provisional mechanisms, and connected arterial calcification and stenosis to
    the major vascular phenotypes. Added subtype-specific case fractions,
    ultra-rare prevalence, age-structured progression, calibrated phenotype
    frequencies, PPi and FGF23 readouts, controlled genetic assertions, structured
    diagnostic tests, differential diagnosis, and treatment-target links. Updated
    NCT07473973 to its recruiting Phase III status as rechecked on 2026-07-20.

    Preserved the evidence limits: the largest natural-history analysis did not
    establish a bisphosphonate survival benefit, and INZ-701 efficacy is supported
    by animal data while human efficacy remains under trial evaluation. Validation
    confirmed 58/58 normalized exact snippets, schema and ontology conformance,
    causal-graph integrity, 6/6 phenotype connectivity, 2/2 gene-to-mechanism
    wiring, and successful CX2 and KGX exports.

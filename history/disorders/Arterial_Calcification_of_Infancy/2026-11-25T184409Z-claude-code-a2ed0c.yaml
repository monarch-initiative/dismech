  summary: 'Gene-family review: ENPP1'
  details: |
    ENPP1 modelling re-reviewed: biallelic loss of function, as the entry already recorded. Both ENPP1 nodes carried the gene with no molecular function; each now binds ATP diphosphatase activity (GO:0047693) as decreased, the reaction its evidence describes (ENPP1 cleaves ATP into AMP and inorganic pyrophosphate at the cell surface, PMID:33005041) and the ai-gene-review core function. The pyrophosphate node also carries ABCC6, whose own molecular function was not added here. The ENPP1 record now carries the ClinGen Syndromic Disorders GCEP Definitive (AR) tier for MONDO:0008817, the ENPP1-related subtype's term (CGGV:assertion_50cf1e96-1629-41c5-a5db-1c37e8b24aaa-2025-11-23T050000.000Z), and a record-level autosomal recessive inheritance block (PMID:39343469).

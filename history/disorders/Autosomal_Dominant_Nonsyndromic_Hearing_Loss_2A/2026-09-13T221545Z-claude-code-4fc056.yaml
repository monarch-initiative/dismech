  summary: 'Review round 1: address 3 blocking and 3 optional findings on PR #11796'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11796 in a single push.

    Blocking item 1, vestibular phenotype overstated. The phenotype was named 'Absent vestibular involvement' and argued from a 2006 sentence whose premise (KCNQ4 expressed in vestibular hair cells) was overturned by PMID:23408425, already cached in this PR but uncited. Renamed to 'Subclinical vestibular dysfunction'; rewrote the description around postsynaptic calyx-terminal localization; added the human clinical characterization from GeneReviews as the REFUTE anchor for the clinical-level negative; kept the PMID:16437162 REFUTE item with a note that its premise is superseded but its observation is not; added two PMID:23408425 MODEL_ORGANISM items, the altered vestibulo-ocular reflex measurement and the localization finding, both marked directness INDIRECT.

    Blocking item 2, genetic counselling. Added the GeneReviews 50 per cent transmission-risk evidence item and the de novo statement, and populated Inheritance.de_novo_rate with the source's own 'unknown' rather than leaving it as unevidenced prose in the description.

    Blocking item 3, haploinsufficiency variant class unmodelled. Added a second pathophysiology entry node, 'KCNQ4 Haploinsufficiency from Truncating Variants', feeding the same conductance-loss node by an INDIRECT_UNKNOWN_INTERMEDIATES edge, with functional_impact_category LOSS_OF_FUNCTION. Evidenced from PMID:23776385 (three truncating families, haploinsufficiency proposed, and the review's own hedge), PMID:42162447 (late-onset high-frequency loss attributed to the haploinsufficient route), and PMID:35760561. Recorded the counter-evidence on the node: PMID:40898620 REFUTE, that heterozygous Kcnq4 knockout mice do not lose hearing. Rewrote genetic.notes around three functional variant classes and added evidence for each.

    Optional item 4, evidence_source regrading. Regraded the two background sentences from mouse papers (PMID:42162447, PMID:40898620) from HUMAN_CLINICAL to OTHER, and added PMID:15699719 as a primary human family series for the W276S hotspot.

    Optional item 5, unconsumed caches. Added a kcnq4 morpholino knockdown zebrafish animal model (PMID:41368761) with two typed divergences and a hair cell count readout; added PMID:41639121 (voltage-sensor R216H gating defect) and both PMID:35760561 items to genetic; added two PMID:40752593 items, one an independent report of spiral ganglion neuron degeneration and one a REFUTE on the noise-exacerbation link, which is the only experiment in this entry that tests that interaction rather than assuming it. All 18 fetched references are now cited.

    Optional item 6, prevalence. Added a discussions entry with kind KNOWLEDGE_GAP recording that no DFNA2A prevalence figure exists, with the 9.5 per cent share and the gnomAD carrier frequency cited as the two quantities that are not substitutes for one.

    Validation: schema, term and reference validation all pass; snippets verified 76/76 (was 53/53). All nine offline gates run.

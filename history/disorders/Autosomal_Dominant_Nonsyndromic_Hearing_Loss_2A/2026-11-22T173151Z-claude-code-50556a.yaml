  summary: Record ClinGen Definitive validity for KCNQ4 and wire the gene into the
    pathograph
  details: |
    Added a gene_disease_validity assertion copying the ClinGen Hearing Loss Gene Curation Expert Panel classification for KCNQ4 (Definitive, autosomal dominant, 2017-11-21). The panel files the record under MONDO:0019497 nonsyndromic genetic hearing loss, so the entry now maps that class as skos:broadMatch, which together with the bound autosomal dominant inheritance is the condition under which a hearing-panel record counts for a locus entry. Set relationship_type CAUSATIVE and variant_origin GERMLINE on the KCNQ4 record, which previously carried only the free-text association. Added a KCNQ4 gene descriptor to the two initiating pathophysiology nodes (dominant-negative incorporation, haploinsufficiency), which named the gene only in prose. The mechanism chain was compared with a fresh review of the KCNQ4 GO annotations and KCNQ family and needed no other change. The CGGV cache file was built from the ClinGen export downloaded 2026-11-11, newer than the pinned manifest snapshot. Validated with just validate, count-verified-snippets, check-gene-validity and validate-disorders.

  summary: Review DFNA2A clinical evidence and full-text channel therapy findings
  details: |
    Reviewed the complete DFNA2A entry after confirming no REVIEW event and no overlapping open PR at origin/main 66a955f8e3a. Prior CREATE/EDIT records were read; earlier PR reviews had not created a REVIEW history event. This is a genetic channelopathy, within the narrowed scope despite environmental modifiers.

    Read the matching OpenScientist scientific report, bibliography, validation appendix and citation sidecar. Named-entity preflight passed for KCNQ4, MONDO:0010817 and the relevant OMIM concept. Research mechanisms and proposed treatments were compared with the actual primary papers rather than importing suggested ontology IDs or treating model predictions as clinical findings.

    Read every original cited abstract and used the cached full texts for PMID:16437162 (mouse functional/histological results, discussion and methods), 23776385 (clinical/genetic/mechanistic review), 34316018 (variant classifications, channel assembly and pharmacology), 35760561 (systematic functional testing, knock-in validation and clinical interpretation limits), 40898620 (ASO design, human/mouse specificity, efficacy, toxicity, transcriptomics and discussion), 41639121 (voltage-clamp fluorometry and separately graded molecular dynamics), and 42162447 (base-editor selection, genotype-specific editing, auditory and cellular outcomes, safety and discussion). Full text was examined in the relevant scientific sections, not merely abstracts or snippets. Retrieved and read the full gene-specific GeneReviews chapter, primary human vestibular reports 9193215/11915881 and full diagnostic cohort 26969326 methods/results/Table 2.

    Re-fetching central abstract-only sources retained abstracts. EuropePMC metadata identified non-open-access PMC records for the channel-opener and vestibular-model studies; automatic direct PMC fetches returned CAPTCHA. The late-degeneration and 2025 cochlear-damage studies had no PMCID in that lookup. These sources are therefore represented within their cached abstract limits, not described as full-text verified. CAPTCHA caches are not committed. All cache additions were generated with just fetch-reference; no cache Markdown was hand-created or edited. The frozen dataset-accessions JSON was not accessed.

    Clinical corrections: silence about vestibular features in the GeneReviews abstract was incorrectly treated as REFUTE. The full chapter and two primary families document human vestibular hyperreactivity, including 3 of 11 tested W276S cases and motion sickness in two. Mouse calyx localization/reflex data moved to an animal model. Added family-specific congenital presentation, penetrance and reproductive-testing guidance, broad genetic testing and early family testing, school support and annual surveillance. Separated hearing aids from implant assessment. The severe-by-70 statement is attributed to the GeneReviews cohorts rather than treated as a deterministic prognosis for every allele. Six KCNQ4 diagnoses constituted 9.5% of 63 dominant diagnoses in a referred 1,119-person cohort; this is neither population prevalence nor an invariant worldwide fraction. GJB3/DFNA2B validity is explicitly qualified as challenged by GeneReviews.

    Mechanistic corrections: dominant-negative effects are allele and assembly dependent, not proof that every single mutant subunit disables every channel. Truncation does not establish NMD or haploinsufficiency, and the review documents a severe childhood stop-variant exception. The heterozygous null mouse counterexample is retained. Split inner hair cell degeneration from spiral ganglion loss; removed the causal edge inferred solely from their occurrence after OHC loss. Retained uncertain links from channel dysfunction with null-versus-dominant limits. Prestin mislocalization is a separate observed event, not evidence for IHC or neuronal apoptosis. Early amplification dysfunction now reaches the clinical outcome. Basal-first loss is not universal: the G322S model first loses apical/middle OHCs. The OHC-only hypothesis is an actual proposition with coherent SUPPORT/REFUTE assignments; expression patterns and strain comparisons do not independently prove primary lesions or background causation. Split reduced current from depolarized resting voltage in model readouts. Zebrafish mRNA rescue supports specificity without excluding every off-target effect or reproducing cochlear physiology.

    The 2021 pharmacology full text classifies G319D and R331Q as VUS despite mechanistic language elsewhere in the paper. Recorded the experimental gain-of-function and PIP2-dependent findings with this clinical uncertainty. Added experimental downregulation of hyperactive forced G319D heteromers without recommending channel inhibition to patients. The comprehensive screen supplies functional evidence within integrated variant interpretation: 344 of 456 initial VUS remained uncertain, and cDNA overexpression does not test endogenous splicing. Separated experimental voltage-sensor shifts from computational structural explanations.

    Therapeutic corrections: unresponsive homomeric pore mutants do not imply pore-variant carriers cannot benefit from openers; WT-plus-mutant coexpression shows total-current rescue attributed to residual WT homomers. ASO chemistry and neonatal round-window delivery are available in full text and are now described. At 15 micrograms the ASO only preferentially suppresses mutant transcript with partial hearing benefit through seven weeks; 30 micrograms suppresses WT transcript and reduces pup survival. Base editing used neonatal P2-P3 PSCC delivery and mouse G322S, equivalent to human G321S. The 21.4-28.9% figure is homozygote bulk-organ DNA correction, not heterozygote or per-OHC efficiency; heterozygote baseline-adjusted DNA correction was 7.9-16.7%. Benefit was frequency/time dependent and more durable at lower dose. Cochlear inflammation, RNA-editing increases and systemic exposure constrain safety claims. No human therapeutic window or cure is inferred. Aminoglycoside effects remain wild-type-cell mechanistic convergence, not demonstrated genotype-specific susceptibility; the complete PIP2 formula replaces a mid-token excerpt. Live OAK still returns no label for ECTO:9002231, so its prior free-text binding remains.

    Eight-dimension research assessment: (1) phenotypes adequate after restoring the missing human vestibular finding and qualifying onset/severity; (2) subtypes adequate with one KCNQ4 disease and no speculative splitting by functional assay class; (3) mechanisms adequate with atomic cell-loss nodes, channel/gating alternatives and bounded causal claims; (4) treatments adequate with clinical support and experimental openers, inhibitory assays, ASO and base editing, including dose and safety limits; no disease-specific Phase II+ trial was surfaced by the report; (5) genetics adequate with penetrance, variant classes, VUS limits and cohort denominator; (6) diagnostics/biomarkers adequate with panel/genomic testing, family evaluation and audiometry rather than experimental transcriptomics as a patient biomarker; (7) references adequate with exact titled quotes, full-text findings and primary/secondary distinctions; (8) overall consumption adequate, correcting overreach while retaining major research themes. Full GeneReviews clinical, diagnosis, management, counseling and agents-to-avoid domains are represented by evidence.

    Schema, terms and quotation validation are required, along with history, causal/entity links, GeneReviews tagging, snippet boundaries/length/grading and staged hooks. Formal author COMMENT, independent PR review and CI are separate readiness gates. The full-text reading limits and remaining human-mechanism uncertainty are preserved rather than resolved by inference.

    Final local validation passed for schema, ontology, history and 108 quotes before the last family-association evidence addition; final quotation count is rechecked before commit. Causal/entity links, GeneReviews tagging and snippet length/grading/title/boundary checks pass. The W275C human-family association is retained under genetics; the abstract mixes experiments and structural predictions, so its bundled structural sentence is no longer misclassified as a distinct experimentally proven mechanism in the zebrafish model.

    Final quotation validation verified 109/109 items. Staged hooks normalize YAML layout and cache EOF/whitespace only; an exact complete PIP2-depletion result replaces the aminoglycoside abbreviation sentence flagged by spelling checks.

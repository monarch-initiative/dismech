  summary: Regrade two background citations as HUMAN_CLINICAL plus quote_role
  details: |
    Two genetic-section items quote human clinical genetics (the ~9.5 per cent DFNA2 share, and the W276S hotspot) out of the introductions of two mouse therapy papers. Review of PR #11796 had settled them on evidence_source: OTHER, because HUMAN_CLINICAL asserted a study type neither publication ran, which left the record saying nothing about either fact. With quote_role they are HUMAN_CLINICAL + BACKGROUND, which states both. The human family series carrying the same hotspot claim (PMID:15699719) is marked PRIMARY_RESULT so the pair reads as a restatement and its source. Two further items citing PMID:21951272 are annotated from the deterministic tier of just list-background-citations, which placed one snippet in that paper's BACKGROUND AND PURPOSE section (quote_role: BACKGROUND) and the other in its KEY RESULTS (quote_role: PRIMARY_RESULT); their evidence_source values are unchanged. Snippets and supports values are unchanged throughout.

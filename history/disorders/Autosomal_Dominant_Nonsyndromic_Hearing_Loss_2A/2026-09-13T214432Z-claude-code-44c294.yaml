  summary: 'Create: Autosomal_Dominant_Nonsyndromic_Hearing_Loss_2A (MONDO:0010817)'
  details: |
    De novo curation of DFNA2A, the KCNQ4 half of the DFNA2 locus. Deep research: one openscientist report, committed alongside the entry. Report reference validation resolved 13/13 citations with confabulation_rate 0.0 and 15/15 quotes valid; term validation returned needs_review: true on 2 label mismatches, both table-parsing artefacts rather than wrong bindings. just preflight-dr returns PASS with OMIM agreement (600101 on both sides). GeneReviews baseline: PMID:20301388 (DFNA2 Nonsyndromic Hearing Loss) fetched, tagged in the top-level references block, and used for the clinical characterisation, diagnosis, management and agents-to-avoid content. The entry is curated as a separate Disease from Autosomal_Dominant_Nonsyndromic_Hearing_Loss_2B (GJB3) because the two share a locus designation but not a mechanism. A mechanistic_hypotheses block records the live disagreement about which cochlear cell type accounts for the late profound phase, with SUPPORT and REFUTE evidence curated on both sides from the founding mouse model, two expression studies, and the C3H/HeJ backcross. Three animal models are linked with modeled_mechanisms and readouts. Four treatments span amplification, KCNQ channel openers, allele-preferential antisense oligonucleotide knockdown and adenine base editing; three of the four are preclinical and each is marked as such. One term error of my own was caught by just validate-terms: HP:0001751 written from memory as 'Abnormality of the vestibular system' is 'Abnormal vestibular function'. Separately, the aminoglycoside exposure could not be bound: ECTO:9002231 is exact and resolves in OLS but returns a null label in the sqlite:obo:ecto build the config routes ECTO to, so the exposure_term carries a free-text preferred_term and a review_notes block; filed as issue #11795. Validation: schema, term and reference checks pass with 53/53 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass.

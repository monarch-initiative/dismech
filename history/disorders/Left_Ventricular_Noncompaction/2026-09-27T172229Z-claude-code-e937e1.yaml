  summary: 'Review round on PR 13022: withdraw the atrial-substrate claim on the AF
    edge'
  details: |
    Review round 1 on PR #13022. The edge to Atrial fibrillation was typed DIRECT on a single case report in which the atrial fibrillation predated the noncompaction diagnosis, and its description asserted 'atrial involvement of the same substrate'. Reading the relevant paragraph of PMID:25537996, already cited in this entry, showed the mechanism claim was not merely under-supported but contradicted: the paper reports that a large series identified 9 patients with atrial fibrillation among 238 with noncompaction, that no case of supraventricular tachycardia was noted, and that 'the authors concluded that the atria are not involved in the noncompaction process'. The edge is rewritten: causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, a description that records cohort-level occurrence without claiming the substrate extends into the atrium, a SUPPORT item carrying the 9-of-238 sentence (directness INDIRECT, quote_role BACKGROUND, since it restates a series this paper cites), and a REFUTE item carrying the not-involved conclusion. Two items rather than one, per the CLAUDE.md rule for a source that supports one part of a claim and contradicts another. The single-case item was removed; PMID:40182365 remains cited six times elsewhere. PMID:25537996 was not added to the references block because this entry does not maintain an exhaustive one - 13 of its 14 cited PMIDs are absent from it - and the evidence items carry reference_title. Validation: just validate and just validate-terms pass, count-verified-snippets 269/269.

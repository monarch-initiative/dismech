  summary: Correct dataset record errors surfaced by the GEO reference check
  details: |
    Corrected organism on two dataset records that declared Homo sapiens over mouse-only studies. NCBI esummary reports geo:GSE71912 (Mib1 mutants) and geo:GSE113251 (Nkx2-5 conditional mutants) each with taxon Mus musculus and no human samples, contradicting the records' own corrected titles. Both now record Mus musculus (NCBITaxon:10090). Descriptions were left alone: they characterize the series as public LVNC transcriptomic datasets and do not assert a species. Raised by automated review on PR #10162 and verified against NCBI before changing.

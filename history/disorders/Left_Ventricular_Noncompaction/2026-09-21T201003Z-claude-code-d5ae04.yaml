  summary: Add 8 novel LVNC-associated genes from NGS cohort study
  details: |
    Added genetic entries for TTN, CTNNA3, DSG2, FLNC, JPH2, NKX2-6, TNNC1, and JUP based on WGS analysis of 25 LVNC patients (Onofri et al., PPR1287587). Each gene was classified with pathogenic/likely pathogenic variants per ACMG criteria. Genes represent diverse functional categories: sarcomeric (TTN), adherens junction (CTNNA3), desmosomal (DSG2), cytoskeletal (FLNC), calcium-handling (JPH2), developmental transcription factor (NKX2-6), and contractile regulation (TNNC1, JUP). All validations pass.

  summary: Add 8 novel LVNC-associated genes from NGS cohort study
  details: |
    Added genetic entries for TTN, CTNNA3, DSG2, FLNC, JPH2, NKX2-6, TNNC1, and JUP,
    the eight genes (besides the already-curated MYH7) in which variants were detected
    in the 25-patient LVNC NGS cohort of Onofri et al. (PPR:PPR1287587).

    Review round (PR #12465): each entry now carries `evidence:` citing the preprint
    with exact abstract quotes; previously the source was named only in free-text
    `notes:`, which nothing validates. `association:` was changed from "Pathogenic and
    likely pathogenic variants" to "Candidate variant reported in a single LVNC cohort"
    and `relationship_type: UNKNOWN` was added, because the abstract reports 1
    pathogenic, 7 likely pathogenic and 5 uncertain-significance variants across nine
    genes with no per-gene breakdown -- there is no basis for asserting P/LP for all
    eight. Notes were rewritten to state candidate/reported status rather than
    established mechanism; the NKX2-6, CTNNA3 and TTN notes previously read as settled
    fact. TTN additionally cites PMID:34918480, a peer-reviewed review whose
    introduction reports the TTN genotype-phenotype correlation, tagged
    `quote_role: BACKGROUND`.

    references_cache/PPR_PPR1287587.md was regenerated abstract-only (1,731 -> 33
    lines). OpenAlex reports a bogus `full_text_url` for this preprint -- a Promega
    Maxwell CSC Genomic DNA Kit technical manual (TM677) in Italian, presumably
    harvested from the paper's own methods section -- so the default fetch cached
    1,690 lines of that manual as the paper's body. A snippet quoting the kit manual
    would have validated silently, since `just validate-kb-references` permits
    full-text matches.

    The regeneration used `just fetch-reference`'s underlying command with a config
    overriding `full_text_providers` to [pmc, epmc_preprint, unpaywall] -- openalex
    removed. The cache was never hand-edited. Excluding the provider rather than
    setting `fetch_full_text: false` matters: the full-text chain still runs and
    records `full_text_attempted: true` in the frontmatter, which is what stops
    `_maybe_retry_full_text` from re-fetching the Promega PDF on the next
    `just validate`. A plain abstract-only fetch omits that flag and gets re-inflated
    immediately; this was confirmed both ways before committing.

    references_cache/PMID_34918480.md was upgraded from abstract to full text so the
    TTN snippet resolves. Note the cached text uses an en dash in
    "genotype-phenotype"; the snippet is copied from the cache, not from the
    deep-research artifact, which had normalized it to a hyphen.

    Validation: `just validate` passes (schema + terms + references), 53/53 snippets
    verified (was 44).

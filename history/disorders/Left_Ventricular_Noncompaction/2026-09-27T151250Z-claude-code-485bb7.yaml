  summary: Add DTNA and MIB1 with LVNC1/LVNC7 subtype rows and wire all six phenotypes
  details: |
    series-064 genetics pass. Neither checklist gene was present in the entry: MIB1 appeared only inside a datasets record title and DTNA nowhere at all. Added both as genetic records with deliberately different typing. MIB1 is CAUSATIVE with a mechanism: the founding report shows autosomal-dominant pedigrees with reduced NOTCH1 activity, disrupted MIB1 dimerisation, and a mouse myocardial knockout that reproduces LVNC, so MIB1 is bound on the compaction node itself, the only gene in this entry whose lesion acts on compaction rather than on cardiomyocyte structural proteins. DTNA is typed UNKNOWN: the whole primary evidence is one family with a single P121L missense change whose phenotype included congenital heart disease, there is no ClinGen Gene-Disease Validity assertion for DTNA in the committed cache, and this matches the entry's existing typing for its other single-report genes. ClinGen's committed MIB1 record is for dilated cardiomyopathy graded Limited, a different disease, and is recorded as such rather than read across. Added LVNC1 and LVNC7 has_subtypes rows bound to MONDO:0011403 and MONDO:0014042; the entry previously had none. Phenotype inlink 0/6 to 6/6. Self-review caught a reference_title I had composed rather than copied from the cache.

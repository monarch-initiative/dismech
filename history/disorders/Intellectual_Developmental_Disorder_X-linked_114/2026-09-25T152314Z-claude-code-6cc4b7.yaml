  summary: 'Create: Intellectual Developmental Disorder, X-Linked 114'
  details: |
    New entry for XLID114 (MONDO:0975828, OMIM 301134), caused by hemizygous SRPK3 variants. It replaces the stub stubs/Intellectual_Developmental_Disorder_X-linked_114.yaml, which was removed. The disorder is curated as its own entry and not as a subtype of Non-Syndromic_X-Linked_Intellectual_Disability, because the defining report describes a syndromic disorder (declined as a subtype in #12227). That parent entry was not edited.

    Sources. The clinical and model content comes from the full text of the defining report, PMID:39073169 (Roychaudhury et al. 2024). It describes nine patients from five unrelated families: eight postnatal males and one fetus. The stub had said three families; five is correct, and three counts only the first missense families. Three further papers were used: PMID:38429495 (SRPK3/TTN digenic myopathy; hemizygous SRPK3 variants, including truncating ones, in males without myopathy), PMID:40662097 (Xq28 contiguous deletion including SRPK3) and PMID:16140986 (Srpk3-null mouse myopathy). No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). SRPK3 has no ClinGen gene-disease validity record.

    Deep research. The OpenScientist report research/Intellectual_Developmental_Disorder_X-linked_114-deep-research-openscientist.md was read in full. The first OpenScientist run timed out after 3600 s and was cancelled; this report is from the re-run. All six of its references resolve. just preflight-dr returned WARN only because the report also gives OMIM 301002, which is the SRPK3 gene entry; the report is about the right disease. From the report, three SRPK-family biochemistry papers were added as background or indirect evidence for the presumed phosphorylation-to-splicing steps: PMID:9472028, PMID:14555757 and PMID:16223727. They concern SRPK1 and SRPK2, and the evidence items say so.

    Report claims not used, and why:
    - ACC is shared by all 8 postnatal patients. The paper's case descriptions record it only in family 1, so imaging phenotypes carry no frequency and the callosal phenotype is bound to HP:0001273, not HP:0001274.
    - The course is static and the cerebellar atrophy is hypoplasia. Contradicted: the family 2 proband had rapidly progressive cerebellar atrophy starting in his twenties.
    - Cognitive severity is moderate to severe. Contradicted: the paper reports mild disability in families 1-3, and mild to moderate in family 1.
    - The zebrafish knockout confirms loss of function. Overstated: wild-type SRPK3 mRNA did not rescue the fish phenotype, and no kinase assay was done.
    - HP:0002317 for clumsiness. The report's term-validation section flags the label as mislabelled (the term is Unsteady gait), so it was not bound.
    - The GTEx cerebellar enrichment figures, the STRING interactome, the UniProt domain mapping, the gnomAD constraint figures and the ClinVar counts. These are the provider's own lookups with no committed data artifact or citable source. The cerebellar expression point is instead cited from the paper's BrainSpan analysis.
    - The synonym MRX114. Unsourced; OMIM's abbreviation XLID114 was used.
    - Carrier-female and X-inactivation statements, and physical, occupational and speech therapy recommendations. No disease-specific source.
    - PMID:19477182 and PMID:36273172. The first adds nothing beyond the papers already cited; the second is about Arabidopsis kinases. Their caches are kept because the report cites them.

    Modelling choices. The Srpk3-null mouse is linked to the variant node with PERTURBS and not FAILS_TO_RECAPITULATE, because its brain was not examined. The species mismatch is recorded as a HUMAN_MODEL_MISMATCH discussion. The splicing steps are marked HYPOTHETICAL, with a KNOWLEDGE_GAP discussion. Whether a hemizygous null SRPK3 allele is sufficient for intellectual disability is recorded as an open question, given the truncating alleles in gnomAD males and in the myopathy cohort.

    Validation. just validate-disorders passed (schema, terms, 97/97 snippets), and the entity-ref, causal-target, coarse-phenotype, snippet-length, title-snippet, folded-hyphen, reference-title, snippet-grading and enum-value gates all passed.

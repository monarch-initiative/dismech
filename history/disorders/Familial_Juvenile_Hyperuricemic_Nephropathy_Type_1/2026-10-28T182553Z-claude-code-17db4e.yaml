  summary: 'Create: Familial_Juvenile_Hyperuricemic_Nephropathy_Type_1'
  details: |
    New Mendelian entry for familial juvenile hyperuricemic nephropathy type 1 (ADTKD-UMOD, MONDO:0008073), claimed in issue 15836. Pathograph: heterozygous UMOD missense variant -> mutant uromodulin retained in the ER of thick ascending limb cells -> ER stress and unfolded protein response (IRE1-XBP1) with impaired autophagy -> tubulointerstitial injury and fibrosis -> CKD and kidney failure; second arm: loss of functional uromodulin -> impaired thick ascending limb salt reabsorption -> compensatory proximal urate reabsorption -> hyperuricemia and gout. The salt-handling arm is marked PROVISIONAL because it rests mainly on knockout and knock-in mice. Three mouse models linked. GeneReviews ADTKD-UMOD chapter used as phenotype baseline and tagged. Deep research: one OpenScientist report (24/25 references resolved; the one unresolved PMID failed on an NCBI 429 rate limit and is not cited). The report suggested NCIT C614 for allopurinol, which was not used; CHEBI:40279 is bound instead. UMOD added to the gene-activity-grounding baseline because the disease is a misfolding proteinopathy rather than loss of one molecular activity. Validated with just validate, count-verified-snippets and the whole-repo gates. Review round 1 on PR 15843: GeneReviews genetic-counseling, NSAID, ACE-inhibitor and allopurinol-in-pregnancy sentences quoted; knock-in evidence added to the ER retention to salt-reabsorption edge (PMID:23748428); Tg-Umod C147W mouse added with a calorie-restriction RESCUES link and readout (PMID:41632531); mTAL cell model added; GeneReviews surveillance rows and living-donor testing added; KDIGO evidence on the MUC1 and HNF1B differentials; salt-handling and urate nodes rescaled to CELLULAR.

  summary: 'Create: Aconitine Poisoning'
  details: |
    New entry created from PMID:41627141 (Wang et al., Clin Toxicol 2026), a
    single-patient case report of transient hepatic portal venous gas after
    resuscitated cardiac arrest in aconite poisoning.

    Scope decision. The nucleus PMID is an n=1 case report with an abstract-only
    cache and no mechanistic content beyond its own complication chain. It cannot
    carry a disease page by itself, so it was used for what it uniquely contributes
    - the shock to splanchnic ischaemia to portal venous gas arm, and the claim that
    the gas is reversible - while the core toxicology was built from primary
    literature located independently via Europe PMC: PMID:19514874 (Chan, Clin
    Toxicol 2009, the definitive review), PMID:15111916 (Taiwan national poison
    centre series, n=17), PMID:9760702 (Aconitum alkaloid pharmacology),
    PMID:24840785 (rat calcium and p38 arm), plus PMID:11976865 and PMID:19653334
    for the non-occlusive mesenteric ischaemia and portal venous gas literature.

    Ontology gaps, all verified rather than assumed. MONDO has no aconitine or
    aconite concept: checked by direct SQL scan of every value in the MONDO
    statements table for the substring, which returns only aconitase deficiency, the
    metabolic enzyme. A label search alone would not have excluded a synonym match,
    which is why the scan was done. No disease_term is bound; Arsenic_Poisoning is
    the in-repo precedent for an entry without one. HPO has no hepatic portal venous
    gas term, ECTO has no aconitine exposure term, ICD-10-CM has no aconite code,
    and NCIT has no cardiopulmonary bypass term. Each gap is recorded at the point
    of use together with the check that established it.

    Term choices worth recording. ECTO:9000271 exposure to alkaloid is bound as a
    true parent of aconitine exposure with a specific preferred_term, which is more
    specific than the ECTO:0000231 exposure to chemical fallback that
    Organophosphate_Poisoning uses. ICD10CM:T62.2 is bound as skos:broadMatch only -
    it is a billing container covering every toxic ingested plant part, not a synonym
    for this entry. GAIN_OF_FUNCTION rather than INCREASED is used on both sodium
    channel descriptors because the claim is qualitative: aconitine suppresses
    inactivation so the channel escapes normal voltage-dependent gating, which is the
    distinction CLAUDE.md draws for that pair.

    One near miss caught by reading a definition. GO:0002014, vasoconstriction of
    artery involved in ischemic response to lowering of systemic arterial blood
    pressure, is an almost perfect label match for non-occlusive mesenteric
    ischaemia. Its definition restricts it to vasoconstriction triggered by detection
    of high carbon dioxide in the CNS vasomotor centre - the central ischaemic
    response, not splanchnic sympathetic vasoconstriction. The plain parent
    GO:0042310 was bound instead and the rejection is recorded in the node notes.
    This is the same error class as the search-syntax trap recorded on Heart_Failure
    in the preceding session, reached from the other direction: there a null search
    result was mistaken for absence, here a matching label would have been mistaken
    for a matching meaning.

    A second instance of the same class was caught during term lookup: a runoak
    search for Pharmacotherapy piped through head -6 returned only Pharmacotherapy
    Initiation and Continuation, which would have supported a false conclusion that
    NCIT:C15986 does not exist. A direct lookup confirmed it does. Truncated output
    was the cause both times.

    Epistemic handling. The rodent calcium-overload and p38 MAPK apoptosis arm is
    curated as a parallel node that is deliberately NOT wired into the human causal
    chain to circulatory collapse, with a HUMAN_MODEL_MISMATCH discussion setting out
    why: the apoptotic arm predicts residual myocardial injury in survivors, which
    the clinical literature - complete recovery in 17 of 17, and 5.5 percent
    in-hospital mortality - does not describe. Charcoal haemoperfusion is curated
    with two PARTIAL evidence items pointing in opposite directions (the review says
    its role is not established; the case series used it in all four ventricular
    tachycardia patients and all recovered) and a KNOWLEDGE_GAP rather than being
    resolved either way, because an uncontrolled series in which everyone survives
    cannot separate treatment effect from natural history. The portal venous gas node
    records the mechanism without implying that conservative management is safe,
    since non-occlusive mesenteric ischaemia carries roughly 50 percent mortality and
    the discriminating features are not established; that is the third discussion.

    Frequency discipline. Only one phenotype carries a frequency band: ventricular
    tachycardia, OCCASIONAL, derived as 4 of 17 in the Taiwanese series with the
    derivation stated in the explanation. Every other phenotype is left unfrequenced
    because the sources report category-level counts (neurologic 17, cardiovascular
    14, gastrointestinal 9) that do not attach to individual phenotypes. Prevalence
    is recorded as CASES_IN_LITERATURE with prevalence_class UNKNOWN rather than as a
    rate, since a poison-centre denominator is ascertainment-limited.

    Validation. just validate passed with 54 of 54 snippets verified against cached
    references on the first pass; validate-terms passed; check-duplicate-keys,
    check-snippet-length, check-title-snippets, check-environmental-evidence and
    check-not4curation all clean; pytest -k Aconitine gave 16 passed.
    check-folded-hyphens initially FAILED on two real defects - lines ending in
    "after-" and "persistent-" inside folded scalars, which would have rendered as
    "after- depolarisations" and "persistent- activation" - and both were reflowed
    rather than baselined. Cache gained exactly three CURIEs (ECTO:9000271,
    GO:0098719, ICD10CM:T62.2), all written by linkml-term-validator. One reference,
    PMID:22084632, was fetched during research but not cited, and its cache file was
    deleted rather than committed.

    Note on this record's own metadata: the model field is intentionally absent.
    CLAUDE.md asks for it on AI-assisted curation, but the operating instructions for
    this session forbid putting a model identifier into any artifact pushed to a
    repository. The conflict is flagged on the pull request for a maintainer to
    settle rather than resolved silently here.

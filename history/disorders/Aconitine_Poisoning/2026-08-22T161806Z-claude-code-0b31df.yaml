  summary: 'Review round 1: fix atropine and bradycardia pharmacology; add DR artifact'
  details: |
    Response to review round 1 on PR #9251. All three blocking findings were valid.
    Each reviewer-quoted sentence was checked verbatim against the local cache before
    acting on it; all five matched.

    Finding 1 - atropine's target_mechanisms was pharmacologically self-contradictory
    and mis-targeted. My link said atropine "blocks the vagally mediated cholinolytic
    contribution", but atropine IS a cholinolytic - the same entry's own description
    called it a competitive muscarinic antagonist one field earlier. A cholinolytic
    cannot block a cholinolytic effect; it adds to it. Separately, the link asserted
    INHIBITS onto the ventricular tachyarrhythmia node while its only SUPPORT-level
    evidence said atropine treats bradycardia, and the same review states aconite
    ventricular arrhythmias are refractory to antiarrhythmic drugs. The rendered
    pathograph would have carried an edge claiming atropine inhibits the lethal
    arrhythmia. Fixed by retargeting to a new bradycardia mechanism node with an
    honest symptomatic description and the direct indication sentence as SUPPORT
    evidence.

    Finding 2 - the bradycardia phenotype's mechanistic attribution was not merely
    unevidenced, it inverted the source. I wrote "attributed in part to the vagally
    mediated actions of aconitine". The only vagally mediated action Chan describes
    is aconitine's own cholinolytic effect, which is vagolytic and would tend toward
    tachycardia. Chan states the actual mechanism plainly: hypotensive and
    bradycardic actions due to activation of the ventromedial nucleus of the
    hypothalamus. Replaced, with that sentence cited.

    Both errors share a root cause worth naming: I built a mechanistic claim from the
    one sentence in the source that contained the words I was looking for
    (vagus, cholinolytic) without checking that its direction matched the effect I
    was explaining. That is a different failure from the truncation errors recorded
    in the preceding session, and it is the failure the GO:0002014 rejection in this
    same entry avoided - there I read the definition rather than the label. I applied
    that discipline to ontology terms and not to prose.

    Finding 3 - no deep-research artifact. The dismech-pr-review skill requires one
    for new entries, and both precedents this entry cites for its conventions have
    one. Resolved properly rather than by argument: ran `just research-disorder
    claude_code Aconitine_Poisoning`, which reuses Claude Code credentials and needs
    no extra key. The artifact is genuine harness output - 343 seconds, 17 web
    searches, 27 turns, 47 citations, real timestamps - not hand-written frontmatter,
    which is the "fake deep research entry" the skill warns about and which I would
    have had to fabricate otherwise. Then ran `just validate-research-reference` on
    it: 35 of 35 references resolved, zero unresolved, zero off topic, two quoted
    claims unverified against abstract-only sources and flagged as such in the
    report.

    The deep-research report independently reproduces this entry's central design
    decision, which is the useful cross-check: it concludes the mechanism "maps to
    two parallel but interacting node types: an acute electrophysiological node
    (arrhythmia, minutes-scale) and a slower cytotoxic/apoptotic node (myocardial
    injury, hours-scale)", which is exactly the split curated here, and it
    characterises the channel state as a "pharmacological gain-of-function-like
    state", supporting the GAIN_OF_FUNCTION over INCREASED choice.

    NOTHING from the deep-research report was imported into kb/. Its citations are
    PMC links and PMIDs not in this repo's cache, and the DR SOP treats such output
    as leads requiring independent verification. Importing them would need a fetch
    and snippet-verification pass per reference, which is a larger increment than
    this review round. Consequently the two unverified quotes in the report do not
    touch curated content. Gaps the report surfaces and this entry still does not
    carry, offered as follow-up rather than half-imported: bidirectional ventricular
    tachycardia specifically (this entry curates plain VT), hepatic CYP3A4/2D6
    biotransformation as the rate-limiting detoxification step, the TRPV2 route for
    the calcium arm, and Nav isoform specificity.

    Four of the six non-blocking suggestions were also applied, because each was
    cheap and each closed a real gap rather than polishing: a Cholinergic Ileal
    Hypercontractility node, which connects the previously orphaned gastrointestinal
    phenotypes to the graph; a MODULATES target_mechanisms link on charcoal
    haemoperfusion, deliberately MODULATES and not INHIBITS because the intent is
    established and the effect is not; an intra-arterial vasodilator treatment for
    the non-occlusive mesenteric ischaemia arm, flagged in its notes as evidenced
    from the general NOMI literature and not from any aconitine series; and the
    septic shock outcome from the nucleus case report.

    Two ontology checks the reviewer asked for were run and recorded rather than
    assumed. NCIT has no haemoperfusion term under either spelling - a direct label
    scan of the release used here returns zero for both `hemoperfusion` and
    `haemoperfusion` - so the generic Therapeutic Procedure binding stands, now with
    that check written into the treatment notes. HPO has no septic shock term, so
    that phenotype binds the parent HP:0031273 Shock rather than inferring
    HP:0031275 Distributive shock, which the single cited case does not support.

    The new Cholinergic Ileal Hypercontractility node uses the same GO term as
    Neuromuscular Transmission Block, GO:0014055, in the opposite direction -
    acetylcholine release DECREASED at the skeletal neuromuscular junction and
    INCREASED at postganglionic enteric nerves. That is not a contradiction but two
    different synapses, and a note on the node says so, since the pair would
    otherwise look like an error to a later reader.

    Validation after the changes: validate passed with 63 of 63 snippets verified
    (was 54; the increment is entirely new evidence items), validate-terms passed,
    check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-environmental-evidence and check-not4curation all
    clean, pytest -k Aconitine 16 passed. Pathograph connectivity re-checked
    programmatically: ten edges, no dangling targets, and the only node with no edge
    is the rodent calcium arm, which is unwired by design.

    On the model-field question raised in the PR body and acknowledged by the
    reviewer: still unresolved and still for a human. Note that the deep-research
    artifact committed in this round carries model identifiers in its own frontmatter
    because the harness wrote them there. Those are tool-generated provenance, not
    authored by me, and stripping them would corrupt the artifact and defeat the
    authenticity check the review skill performs on that frontmatter. They are left
    intact.

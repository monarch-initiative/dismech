  summary: 'Create: Encephalopathy_Due_To_Hydroxykynureninuria'
  details: |
    New entry for MONDO:0009372 (OMIM 236800, ORPHA:79155), claimed in #16045.

    Lump/split: kept as its own Disease rather than a subtype of
    Congenital_Vertebral-Cardiac-Renal_Anomalies_Syndrome, where KYNU appears as
    VCRL2 (MONDO:0060555). Points weighed: both are KYNU deficiency with
    xanthurenic aciduria; but MONDO places the two terms in different branches
    (MONDO:0017350 inborn disorder of tryptophan metabolism versus MONDO:0020831),
    neither subsuming the other; Orphanet and the IEMbase seed list in #5558 list
    hydroxykynureninuria as its own inborn error; the only molecularly confirmed
    family (homozygous KYNU p.Thr198Ala, PMID:17334708) has no malformations and
    carries a hypomorphic allele (about 64% enzyme activity and 74% NAD in yeast
    complementation, per the full texts of PMID:31923704 and PMID:33942433), so
    the VCRL entry's embryonic NAD deficiency chain does not describe it. No
    encephalopathy-specific mechanism is established, and this is recorded in
    review_notes as a defensible alternative (one KYNU deficiency entry) for a
    reviewer to weigh. The VCRL entry was not edited.

    Sources: Christensen 2007 abstract (PMID:17334708) for gene, variant,
    biochemistry and diagnosis; the Orphanet record ORPHA:79155 (rebuilt with
    just fetch-reference from the 2026-06-23 Orphadata release, which differs
    from the manifest pin, as 51 committed ORPHA files already do) for
    definition, inheritance, prevalence class and the clinical phenotype table;
    Swarna 2004 (PMID:15168722) as indirect support for intellectual disability;
    Ehmke 2020 (PMID:31923704), Shi 2017 (PMID:28792876) and Goorden 2025
    (PMID:40714656) as explicitly indirect evidence from the allelic malformation
    disorder for xanthurenic aciduria, NAD synthesis and nicotinamide plus
    pyridoxine treatment; PMID:36465553 and PMID:35658075 for kynureninase
    enzymology. The pre-molecular case reports (PMID:14169454, 6015911, 649181,
    7152601) have no PubMed abstract; they were fetched but are cited only in
    notes. The Reduced Tryptophan-Derived NAD+ Synthesis node is marked
    HYPOTHETICAL, with a REFUTE item from PMID:17334708.

    Deep research: the openscientist report was used. Retro-fitted reference
    validation: 18/18 references resolved, 0 unresolved, 0 off topic, so
    needs_review is not triggered. just preflight-dr against MONDO:0009372
    returned PASS (KYNU named 58 times, OMIM 236800 matches). just
    validate-research-terms could not complete: OLS answered in about 25 s
    against the tool's 5 s read timeout, failing on every retry, so the report
    carries no Term Validation section. No CURIE was copied from the report;
    every binding was looked up independently, and the report's CHEBI:1547 for
    3-hydroxy-L-kynurenine was not used (CHEBI:17380 is bound). The report frames
    hydroxykynureninuria and congenital NAD deficiency as one spectrum and its
    claim that identical genotypes span both ends was not adopted, because the
    confirmed hydroxykynureninuria allele is hypomorphic. Its CNDD-specific
    content (malformations, maternal supplementation, NADSYN1 data) was left to
    the VCRL entry.

    GeneReviews: just check-genereviews --online returns NO_CHAPTER. The
    Congenital NAD Deficiency Disorder chapter covers only the allelic
    malformation disorder; this is recorded in notes.

    Validation: just validate, validate-terms, count-verified-snippets (46/46),
    check-entity-refs, check-causal-targets, check-coarse-phenotypes,
    check-qualifier-terms, check-enum-values, check-duplicate-keys,
    check-block-scalar-comments, check-logical-rules, check-delivery-system and
    list-gene-term-mismatches pass; the whole-tree gates pass; just
    validate-disorders passes. Seventeen of 22 phenotypes have no causal
    in-edge, because no source gives a mechanism for the neurological and
    acute systemic features.

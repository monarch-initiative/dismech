  summary: Link maternal exposures into the pathograph
  details: |
    Backfill for issue #8085. Five environmental entries linked, graded by what the evidence supports rather than uniformly. Maternal folate deficiency is TRIGGERS/DIRECT into the disrupted folate one-carbon metabolism node, since inadequate maternal folate and the depleted one-carbon pool are the same fact seen from outside and inside. Maternal valproate exposure is TRIGGERS with INDIRECT_UNKNOWN_INTERMEDIATES into the neuropore closure node, as an established human teratogen whose responsible step is still contested between folate antagonism and histone deacetylase inhibition. Maternal pregestational diabetes, obesity and hyperthermia are all PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES: each raises risk without being sufficient, and the cited sources are risk-factor attributions. Hyperthermia in particular is graded predisposing because its source states the association firmly but stops short of calling it an established human teratogen. Validated with linkml-validate, just validate-terms and just validate-references; integrity issue count unchanged from origin/main. PR review noted the valproate link was the weakest support carrying a TRIGGERS grade in this entry, since PMID:16639967 is a clinical question-and-answer column whose statement is hedged. Its supports value is now PARTIAL and its evidence_source OTHER rather than HUMAN_CLINICAL, and the explanation states both the hedging and that the source names neural tube defects generally rather than the cranial neuropore. The TRIGGERS grading is retained because valproate is an established human teratogen for neural tube defects. Re-validated: 46 of 46 snippets verified.

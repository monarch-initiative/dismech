  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The series row MONDO:0008791 anencephaly 1 is curated as this entry's first has_subtypes row, with TRIM36 bound and its own autosomal recessive inheritance block. It sits apart from everything else in the entry: every other gene here is a susceptibility or oligogenic contributor to multifactorial disease, whereas this is a single homozygous missense variant segregating in one consanguineous family, and the proposed mechanism - reduced protein stability with microtubule and mitotic spindle disruption impairing neural cell proliferation - is neither the folate one-carbon route nor the planar-cell-polarity route the entry models. TRIM36 is deliberately not added to the genetic section or wired to a node, and the row's review_notes gives that reason: a node would rest on one family plus cell-line transfection, and the authors state the neural-tube step as a suggestion rather than a measurement. Wiring numbers are unchanged and already complete at 5/5 genes and 5/5 phenotypes. Validation on the committed tree: just validate 0 issues, validate-terms passed, 48/48 snippets verified.

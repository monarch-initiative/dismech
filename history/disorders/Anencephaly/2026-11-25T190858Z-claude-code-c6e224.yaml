  summary: 'Gene-family review: MTHFR node molecular function'
  details: |
    The MTHFR susceptibility record (common c.677C>T variant) and its node were reviewed. The node Disrupted Folate One-Carbon Metabolism carried MTHFR with no molecular function; it now binds methylenetetrahydrofolate reductase (NADPH) activity (GO:0106313) as decreased, with evidence that the variant lowers MTHFR activity and makes the enzyme thermolabile (PMID:7647779). The MTHFR record now records germline origin; its SUSCEPTIBILITY typing was kept.

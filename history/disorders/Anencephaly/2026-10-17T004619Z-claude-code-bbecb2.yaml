  summary: Split screening from amniotic fluid confirmation; bind maternal serum and
    amniotic fluid AFP/AChE LOINC codes
  details: |
    LOINC tranche K batch 1. The single Prenatal Screening and Imaging diagnosis row bundled the non-invasive maternal serum AFP screen with the invasive amniotic fluid AFP/acetylcholinesterase confirmatory route, two claims with different evidentiary status. Split it into Maternal Serum AFP Screening, bound to LOINC:48802-3 (Alpha-1-Fetoprotein panel - Serum or Plasma), and Amniotic Fluid AFP and Acetylcholinesterase, bound to LOINC:58735-2 (Alpha-1-Fetoprotein panel - Amniotic fluid) and LOINC:76478-7 (Acetylcholinesterase panel - Amniotic fluid). All three are panel codes, the identity-level choice within each analyte's family. Note the two cited evidence snippets both support amniotic/serum AFP but neither independently names acetylcholinesterase, which is already named only in this entry's pre-existing description; the binding formalizes that existing claim rather than introducing a new one. All three codes verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

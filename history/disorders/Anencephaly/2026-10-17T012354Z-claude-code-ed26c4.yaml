  summary: 'Review fix: add missing evidence for the amniotic fluid acetylcholinesterase
    binding'
  details: |
    The Amniotic Fluid AFP and Acetylcholinesterase diagnosis row bound LOINC:76478-7 (acetylcholinesterase panel - amniotic fluid) with no evidence specifically supporting the acetylcholinesterase claim -- the one existing evidence item, from PMID:23790957, covers AFP generally and never names acetylcholinesterase, a pre-existing gap I deliberately did not fabricate a citation for when the binding was added, but which the review correctly flagged as leaving a queryable binding unsupported. Added two new evidence items citing PMID:27189655 ('Spina bifida.'), a neural tube defect review not previously cited in this entry: one quoting 'finding of an elevated concentration of alphafetoprotein (AFP) in amniotic fluid samples from pregnancies with anencephaly or MMC', which directly names anencephaly, supporting the amniotic AFP code; and one quoting 'Subsequently, assay of acetylcholinesterase in amniotic fluid was also shown to be diagnostic', which directly supports the acetylcholinesterase claim. Both snippets were confirmed as exact (whitespace-normalized) substrings of the cached reference before being added, and both verify under just validate.

  details: |
    Addressed the automated review on PR 7483. Wired the pathograph with downstream causal edges so folate one-carbon metabolism and the convergent-extension defect flow into failure of cranial neuropore closure, then into exencephaly and neural-tissue exposure/degeneration, and finally into anencephaly, absent calvaria/acrania, adrenal hypoplasia, and polyhydramnios. This took phenotype connectivity from 0/5 to 5/5 and gene-to-mechanism wiring from 0/5 to 5/5 via genes descriptors: MTHFR on a new Disrupted Folate One-Carbon Metabolism node, VANGL1/VANGL2 on the convergent-extension node, and PAX3/PDGFRA on the closure node. Fixed the Absent Calvaria HP term from HP:0045005 Neural tube defect, which is the disease parent class, to HP:0030716 Acrania. Replaced the assertion-free MTHFR snippet fragment with the meta-analysis conclusion sentence. Changed Anencephaly frequency VERY_FREQUENT to OBLIGATE and removed the unsourced Polyhydramnios frequency band. Made the prevalence record internally consistent with rate_low/rate_high and evidenced it with PMID:29205322. Softened VANGL2/PAX3 SUSCEPTIBILITY notes to flag that the human evidence rests on model-organism data. Dropped the NEC-risk synonym aprosencephaly-with-open-cranium, a distinct MONDO entity. Added UBERON locations, a classifications block, and evidence for the supportive-care treatment and the diagnosis entry; extended the oligogenic snippet; and trimmed the unsupported dose-dependent valproate claim. Validation: just validate passed with 21/21 snippets verified.

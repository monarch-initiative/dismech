  summary: Backfill mechanistic_category desmosomopathy (issue 7761)
  details: |
    Backfilled mechanistic_category: desmosomopathy per issue #7761 (unblocked once PR #7746 merged the enum value). Added a classifications block (harrisons_chapter + mechanistic_category) where absent. Boundary decision: desmosome dysfunction of any etiology (inherited or acquired/autoimmune) qualifies, per the issue's cited literature (PMID:39838950, PMID:36594662, PMID:29449846). Acquired/subtype-restricted entries (Pemphigus_Vulgaris, Pemphigus_Erythematosus, Peeling_Skin_Syndrome) carry a notes: qualifier documenting the etiology/subtype scope. Bullous_Pemphigoid, Epidermolysis_Bullosa entries, Left_Ventricular_Noncompaction, and Dilated_Cardiomyopathy were deliberately NOT tagged (hemidesmosomal or non-primary mechanism). Netherton_Syndrome and Eosinophilic_Esophagitis left as discretionary follow-ups per the issue's own scoping.

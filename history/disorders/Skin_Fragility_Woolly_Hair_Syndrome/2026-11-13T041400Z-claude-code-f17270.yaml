  summary: Addressed PR 17270 review feedback on cardiac clinical observations, precautionary
    echocardiography rationale, biallelic DSP trigger naming, EM tissue boundaries,
    and post-2011 literature
  details: |
    Removed unsourced cardiac-preservation genotype inferences from genetic[0].features and top-level notes, stating strictly the clinical cardiac observations from PMID:11841538, PMID:20738328, and the 2025 case report/review PMID:41064314. Aligned echocardiography diagnosis prose with PMID:19016709 and PMID:41064314 as precautionary surveillance grounded in myocardial DSP expression and cardiac disease association. Renamed the trigger node to DSP Biallelic Loss-of-Function with PARTIAL_LOSS_OF_FUNCTION impact category, restricted Desmosome-Keratin Detachment to epidermal keratinocytes/skin matching interfollicular EM scope, separated Hair Follicle and Nail Apparatus Adhesion Failure as a PROVISIONAL tissue node, softened Palmoplantar Keratoderma and Woolly Hair descriptions to match source scope, and incorporated PMID:41064314 covering post-2011 SFWHS cases through 2025.

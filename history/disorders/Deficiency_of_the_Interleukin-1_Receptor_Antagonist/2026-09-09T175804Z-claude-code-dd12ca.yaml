  summary: 'Create: Deficiency of the Interleukin-1 Receptor Antagonist MONDO:0013021'
  details: |
    Created from PubMed literature with a five-iteration OpenScientist deep-research job as a cross-check. The job sat queued for seventeen minutes before starting, which is atypical for this provider and worth noting only so a future reader does not read the delay as a failure; it then ran for twenty-nine minutes over five iterations.

    The mechanism-to-therapy correspondence is the cleanest of any entry in this series and drives several modelling choices. IL1RN encodes the endogenous interleukin-1 receptor antagonist; anakinra is recombinant interleukin-1 receptor antagonist. Treatment therefore replaces the exact protein the patient cannot make, which is why the anakinra target_mechanisms link uses treatment_effect RESTORES rather than INHIBITS, and why its therapeutic_modality is PROTEIN_REPLACEMENT. The history runs the same direction: a neonate responded to empirical anakinra and that response prompted sequencing of the IL-1 pathway genes, so the drug preceded the gene.

    The pathograph separates absent antagonism from unopposed signalling deliberately. The defect is loss of a competitive blocker rather than an increase in ligand, and keeping those as two nodes preserves the distinction that makes replacement therapy rational.

    Three qualifications are recorded rather than smoothed. First, the systematic review names canakinumab the drug of choice, but canakinumab neutralises IL-1 beta only while this defect leaves both IL-1 alpha and IL-1 beta unopposed; that mismatch is stated in the treatment description rather than presenting the agents as interchangeable. Second, one patient developed anaphylaxis to anakinra and required desensitisation, carried as REFUTE evidence on the treatment of choice, because mechanistic elegance is not safety. Third, the pooled analysis reporting 88 percent complete remission is paired with the same authors' statement that various side effects occur.

    Contrast with Majeed syndrome, curated earlier in this series, is stated explicitly in notes. Both diseases produce sterile multifocal osteomyelitis and both respond to IL-1 blockade, but Majeed is dysregulated IL-1 beta production through an unrestrained inflammasome while this is normal production with the antagonist absent. That difference is why anakinra is replacement in one and blockade in the other, and the two entries would otherwise look confusingly similar.

    Frequency bands derive from a single ranked list in a systematic review covering 29 patients across 18 articles, 94 percent of which were case reports. They express rank order rather than measured proportions, and that is stated. Where a manifestation sits inside a grouped category, such as fracture within the osteoarticular group, it is banded one level lower with the reason given in its evidence explanation.

    The deep-research job contributed one substantive addition, verified against its cited paper before use: a pooled analysis of 25 patients from 15 papers giving 88 percent complete remission on anakinra with mean improvements in haemoglobin, ESR and CRP. That replaced an efficacy claim that had rested only on individual case reports.

    The final check battery, run after the report was folded in, caught a mid-word truncation and three orphan phenotypes that reading had not. Both were fixed before commit.

    Validation: 42/42 snippets verified, term validation passes, qualifier terms pass, weighted compliance 100.0 percent, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets. Content_type was checked on all ten caches before writing; eight were full text.

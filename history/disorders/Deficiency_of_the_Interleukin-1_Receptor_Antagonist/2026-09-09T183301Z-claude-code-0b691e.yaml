  summary: 'Review round 1: bind nail changes and osteolytic lesions, add IN_VITRO,
    prevalence, biochemical, animal model'
  details: |
    Review round 1 on PR #11543 requested changes on six content-completeness findings. All six are addressed, and all six of the reviewer's non-blocking suggestions are addressed or answered.

    The two blocking findings were the same failure. The entry quoted one ranked sentence from the systematic review seven times and bound fever, fracture, pneumonia and thrombosis from it, but not nail changes or osteolytic lesions - and then justified the nail-changes omission in notes on evidentiary grounds that were not applied to the items that were included. Nail changes rank above two of the items that were kept. Both are now bound: HP:0008404 Nail dystrophy as OCCASIONAL, and HP:0003330 Abnormal bone structure for osteolytic lesions. The second is a compromise binding and is labelled as one, because every HPO osteolysis term is site-specific to hands, feet or clavicle and none fits a general osteolytic lesion; the specific finding is carried in the description. Both new phenotypes are wired into the pathograph rather than left free-floating - osteolytic lesions DIRECT from the bone-inflammation node beside fracture, nail changes INDIRECT_UNKNOWN_INTERMEDIATES from the skin node, because no cached source describes the nail histology or establishes that the same neutrophilic process reaches the nail unit.

    The third finding needed no fetching. The landmark in vitro result was already sitting in the committed full text of PMID:19494218: the truncated protein is not secreted, rendering cells hyperresponsive to interleukin-1 beta. That is the direct experimental support for the loss-of-function to absent-antagonism edge and it is what establishes why the antagonism is absent rather than inferring it. The entry had zero IN_VITRO evidence before this and now has one.

    Three findings were under-consumption of the deep-research artifact and are now consumed: a structured prevalence record (CASES_IN_LITERATURE, BELOW_1_IN_1000000, 29 patients across 18 articles), a biochemical block for the acute phase response with the pooled anakinra marker improvements, and an Il1rn knockout mouse animal model at PARTIALLY_RECAPITULATES with fidelity LOW. The mouse limitations record that its phenotype is background-dependent, presenting as arthritis or vasculitis depending on strain, and does not reproduce the human osteomyelitis and pustulosis distribution.

    On the suggestions. Late-onset variability is now recorded in the onset descriptor notes rather than left implicit, citing the girl who first presented at one year of age; the category stays NEONATAL because that is the presentation in the great majority of reported patients. Rilonacept and glucocorticoids are now curated as treatments from quotable sentences. Rilonacept takes therapeutic_modality OTHER because a decoy-receptor fusion protein is neither a monoclonal antibody nor replacement of a protein the patient lacks, and its dual IL-1 alpha and IL-1 beta binding is noted as a better match to the defect than canakinumab. The glucocorticoid mechanism link is MODULATES rather than INHIBITS, because the same sentence that reports improvement also reports no complete response and the target_mechanisms evidence enum has no PARTIAL value to carry that distinction. Mappings are added for MONDO:0013021 and NCIT:C119056. The deep-research artifacts directory is now committed.

    Two corrections against the review itself, both checked rather than asserted. The reviewer suggested ORPHA:361; that identifier is familial glucocorticoid deficiency, MONDO:0008733. The correct Orphanet cross-reference on MONDO:0013021 is Orphanet:210115, and OMIM:612852 is right. The suggested NF-kappa-B / MyD88-IRAK pathograph step is not added: none of the seven cached references contains NF-kappa-B, MyD88 or IRAK anywhere in its text, so adding that node would mean asserting a mechanism with no quotable source behind it. The gap is left visible in notes rather than filled from background knowledge.

    The reviewer could not check the GeneReviews baseline from their environment. There is no GeneReviews chapter for this disease; PubMed searches under both the disease name and DIRA return nothing. That is recorded in notes so the next reader does not repeat the search.

    A correction to the previous history record and to notes. Both said eight of ten cached references were full text. The entry has seven references, six of them full text. The prose is fixed in notes; this record states the correction rather than rewriting the earlier one.

    One repository observation, out of scope for this PR. CLAUDE.md documents MAXO:0000058 pharmacotherapy as the standard treatment action term, but TreatmentActionTerm now expands only from NCIT:C25218, so MAXO values fail term validation. Forty entries already use NCIT:C15986 Pharmacotherapy. This entry follows the code rather than the documentation.

    Validation after the change: 57/57 snippets verified, term validation passes, all repository content gates pass, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets, weighted compliance 100.0 percent.

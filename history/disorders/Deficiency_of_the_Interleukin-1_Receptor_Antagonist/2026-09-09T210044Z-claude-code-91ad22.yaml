  summary: 'Review round 3: clear stale band explanations, rename the nail phenotype,
    populate the founder prevalence slots'
  details: |
    Review round 3 on PR #11543. Four blocking items, all one-line edits in a single file, and three of them residue from the round-2 correction rather than anything new. The reviewer confirmed the round-2 work by re-deriving all fourteen frequency bands independently from the cached Results sentence and finding them all correct.

    Three items were stale explanation text that survived the rebinding. The Recurrent Fever block still carried an evidence explanation ending "which is the basis for the FREQUENT band" directly beneath frequency OCCASIONAL - that sentence is literally the one the original error was written from. The Pathologic Fracture block still said "which is why this is banded one level down", contradicting the explanation eight lines above it in the same block. Both ranked-prose evidence items are kept, because the contrast between the abstract's ordering and the paper's own measured proportions is informative, but each explanation now says plainly that it does not carry the band and points to the item that does.

    The third was worse than stale text. The phenotype was still named Nail Dystrophy while its preferred_term, its ontology term and its own description all said the sources do not support dystrophy. Name is the pathograph node label and the entity-reference key, so the rendered page would have shown a Nail Dystrophy node bound to a term that deliberately declines to claim dystrophy. Renamed to Abnormal Nail Morphology, with the incoming causal edge retargeted. The lesson is that changing a binding is not finished until the entity name changes with it.

    The fourth was a real omission. The new Puerto Rico BIRTH_PREVALENCE record had neither prevalence_class nor rate_per_100000, although its own quoted snippet gives one in 6,300 births. That is 15.9 per 100,000 and BAND_1_5_PER_10000. Both slots are now populated. The reviewer's point is the operative one: the reason that record is worth keeping separate from the worldwide case count is that a founder rate is comparable, and it can only be compared from a numeric slot. The record's notes now state the comparison explicitly rather than leaving it to be recomputed from the snippet.

    The suggestion to compress the self-correction narrative in notes is taken. Four correction paragraphs had accumulated there across three rounds and were crowding the disease content. They are compressed into two paragraphs: one listing the three wrong bindings and two wrong factual claims in a sentence each, and one carrying the single general rule worth keeping, which is to prefer a paper's Results section over its abstract whenever both are cached. The reasoning stays in these history records, which is where session narrative belongs. Nothing that a reader of the disease entry needs was removed: the periostitis banding caveat, the absence of a GeneReviews chapter, the reason no NF-kappa-B node is modelled, and the extension points all remain.

    Validation: 79/79 snippets verified, term validation passes, all repository content gates pass, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets, weighted compliance 100.0 percent.

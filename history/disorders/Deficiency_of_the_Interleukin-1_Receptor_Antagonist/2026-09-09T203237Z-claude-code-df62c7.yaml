  summary: 'Review round 2: rebind every frequency band against measured proportions
    in the committed full text'
  details: |
    Review round 2 on PR #11543. The reviewer found that the frequency bands were taken from the ranked prose in the abstract of PMID:40060136 while the full text of the same paper was already committed to this branch, carrying measured proportions across all 29 patients for every one of those findings. That is right, and it is the sharpest finding in either round.

    Four of eight bands were wrong. Pustular rash was FREQUENT against a measured 82.75 percent and is now VERY_FREQUENT. Osteolysis was OCCASIONAL against 55.17 percent and is now FREQUENT. Nail changes were OCCASIONAL against 41.37 percent and are now FREQUENT. Recurrent fever was FREQUENT against 27.58 percent and is now OCCASIONAL. The two errors on the skin-versus-bone axis ran in opposite directions, so the entry read as though bone disease dominated the skin disease when the review says the reverse. The four bands that were already right, osteomyelitis, pneumonia, fracture and thrombosis, now carry the measured sentence as well, so every band in the entry rests on the same source rather than four of them resting on rank order.

    The fever description was wrong in the same way. It said fever was the single most common symptom, ahead of the osteoarticular manifestations, which is what the abstract's ranked list implies. The Results give it as 27.58 percent, tied with arthralgia and a third of the pustular-lesion figure.

    Four phenotypes above the ten percent threshold were missing and are now curated with their measured proportions: arthralgia 27.58 percent, dyspnea 24.13 percent, joint contracture 13.79 percent, growth retardation 44.8 percent. Dyspnea is kept distinct from the pneumonia already in the entry because the review counts them separately and dyspnea is the more common of the two. Joint contracture binds HP:0034392, the general term, rather than HP:0001371 Flexion contracture as the review suggested, because the source says joint contracture without specifying flexion. Growth delay had been listed in notes as an unexplored extension point while its number sat in a committed cache.

    Two suggestions taken in full. A second prevalence record carries the Puerto Rican founder deletion at one in 6,300 births with a 1.3 percent allele frequency, as BIRTH_PREVALENCE alongside the existing worldwide CASES_IN_LITERATURE record; it is the only population-level rate available and is far higher than the case-report picture suggests. The acute phase node is quantified at 57.17 percent, and the leukocytosis at 48.27 percent and hypochromic microcytic anaemia at 37.93 percent are added as their own phenotypes on the laboratory denominator, with the difference in denominator stated rather than silently treated as the same.

    The nail binding moved from HP:0008404 Nail dystrophy to HP:0001597 Abnormal nail morphology. The reviewer's argument is right: dystrophy asserts a morphology that no source here describes, and the parent term is what the evidence supports. This is the second binding on this entry corrected in the direction of claiming less.

    One factual error in notes is corrected. The entry said the reported male predominance was at around four years of age and that this sat oddly against the neonatal onset, needing the full review text to reconcile. The paper says a mean age of four months. There was no tension and no text to fetch.

    The general lesson is narrower than "read the full text". Content_type was checked and the file was correctly labelled full text. The failure was quoting the abstract's prose when the same paper's Results section, in the same committed file, gave numbers. Prefer the Results section over the abstract whenever both are cached.

    Periostitis is the one phenotype whose band does not come from the measured sentence, because the review does not count it. Its band rests on the original nine-patient cohort where it is part of the defining triad, and notes say so rather than leaving the inconsistency unexplained.

    Three suggestions not taken, with reasons recorded in notes. Adalimumab in a late-onset case would need PMID:31467740 fetched. AA amyloidosis appears in this review only as "amyloid substance A" in one patient's laboratory column, which is too thin to curate. Bone pain and pseudoparalysis appear in the deep-research report but in none of the cached sources.

    Validation: 79/79 snippets verified, up from 57/57. Term validation passes, all repository content gates pass, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets, weighted compliance 100.0 percent.

  details: |
    Bound LOINC:43311-0 (Desmoglein 1 Ab [Units/volume] in Serum) to the Anti-desmoglein 1 ELISA diagnosis row, as part of dismech LOINC Diagnostics tranche C (autoantibodies). Deliberately avoided the joint LOINC:43309-4 'Desmoglein 1 and Desmoglein 3 Ab panel' code despite the panel-first convention: the row's own description states pure PF is anti-Dsg3 negative, so a Dsg3 component is not part of what this test is diagnosing in this entry -- desmoglein 3 is the pemphigus vulgaris antigen, and binding the joint panel would have asserted a serology this entry does not claim. [Units/volume] was chosen over [Presence] because the row's description explicitly discusses antibody levels rising with disease onset. Label verified against the Monarch KG entity API in the same step it was written. Confirmed absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

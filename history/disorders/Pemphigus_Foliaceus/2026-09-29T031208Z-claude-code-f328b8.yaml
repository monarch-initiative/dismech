  summary: 'Create: Pemphigus_Foliaceus'
  details: |
    New entry for pemphigus foliaceus (MONDO:0019324), an IgG anti-desmoglein-1 autoimmune blistering disease. Deep research: claude_code (research/Pemphigus_Foliaceus-deep-research-claude_code.md; the report gave no PMIDs by design, so all references were found via PubMed search). Pathophysiology built as a causal chain (HLA-DRB1 susceptibility -> anti-Dsg1 IgG -> IgG4 maturation -> loss of Dsg1 adhesion -> p38 signaling -> superficial acantholysis), conforming to the desmosomal_adhesion_failure module, plus a desmoglein-compensation node explaining mucosal sparing. Key PMIDs: 21605805 (clinical review), 10021453 (Mahoney compensation), 10882765/12535205 (fogo selvagem anti-Dsg1, IgG4 switch), 22798673 (LJM11 sand fly mimicry), 9027963 (HLA-DRB1), 19340014/29307589 (pathogenic EC1 epitope), 3905977 (passive-transfer mouse), 39725576 (canine/feline PF), 28342637 (RITUX 3), 42390708 (PF rituximab meta-analysis), 39906745 (drug triggers). Endemic sand-fly exposure left with a review_notes ECTO waiver; penicillamine bound to generic ECTO:0000509 with a specific preferred_term after ECTO:9000561 was found to be a wrong (guessed) id. No GeneReviews chapter (non-Mendelian). Validated: just validate (schema/terms/35 snippets), check-entity-refs, check-causal-targets, check-duplicate-keys.

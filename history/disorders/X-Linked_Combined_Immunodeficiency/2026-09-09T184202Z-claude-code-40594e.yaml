  summary: 'Create: X-Linked Combined Immunodeficiency (MONDO:0010730, IL2RG)'
  details: |
    New standalone entry for MONDO:0010730, resolved through its cross-reference to OMIM 312863 (combined immunodeficiency X-linked, CIDX) and confirmed as the moderate hypomorphic-IL2RG entity of Brooks et al 1990, distinct from SCIDX1 OMIM 300400. The gene is IL2RG, from the stub's MONDO genes block and from PMID:7883965 which identified the exon-7 missense allele. Decided DISEASE rather than a has_subtypes row on Severe_Combined_Immunodeficiency: both defining papers state the disorder is distinct from, and less severe than, X-SCID, and that entry already binds MONDO:0010315 for the X-SCID subtype. MONDO parents this term under T-B+ severe combined immunodeficiency, which disagrees with that reading; the disagreement is flagged in the entry notes rather than silently resolved. Seven pathophysiology nodes, thirteen phenotypes, no orphans and no dangling targets. The somatic-reversion node deliberately has no downstream edges because it is a partially compensating event rather than a disease-driving step. Two prose claims are explicitly marked as curator inferences in their own notes: the reconstructed c.812T>A notation for p.Leu271Gln, which the 1995 source reports only by codon change, and the statement that the disorder escapes X-SCID newborn screening. Validated with just validate, validate-terms, count-verified-snippets 40/40, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, validate-disorders and the whole-KB snippet checks.

  summary: 'Review round 1: mine GeneReviews, keep the atypical X-SCID scope, add
    alleles and presentations'
  details: |
    Round-1 review (PR 11556) blocked on an uncited GeneReviews chapter already in the cache (PMID:20301584, X-Linked Severe Combined Immunodeficiency) and on a mismatch between the entry's declared scope (atypical/leaky X-SCID synonyms) and what it curated. The GeneReviews abstract describes atypical X-SCID as a spectrum that explicitly includes an X-SCID combined immunodeficiency presentation with recurrent infections, warts and dermatitis, so the broad scope was kept. GeneReviews is now tagged and quoted in all four sections: clinical characteristics (atypical presentation, warts, dermatitis, autoimmunity, EBV-related lymphoproliferation), diagnosis (molecular criterion, and that atypical X-SCID usually escapes newborn screening, replacing a sentence the entry had marked as a curator inference), management (atypical treatment statement, agents to avoid, HSCT as a treatment goal for typical X-SCID graded INDIRECT) and genetic counseling (transmission by sex of offspring). Two further alleles were curated from caches the PR had already committed: p.Pro58Ser (DOI:10.1007/s10875-020-00745-2; reduced surface expression through ER/Golgi mislocalisation, reactive arthritis, bronchiectasis) and p.Arg328Ter (DOI:10.1111/cei.13405; impaired JAK3 binding with partial STAT5 phosphorylation, lethal EBV-related lymphoma). This contradicted the description's claim that all alleles leave surface expression normal, so the description and the signalling node now state the mechanism per allele, and the variant node was renamed from 'Missense Variant' because p.Arg328Ter is nonsense. Gene therapy was added from DOI:10.3389/fimmu.2020.608653 graded INDIRECT. New phenotypes: dermatitis HP:0011123, autoimmunity HP:0002960, EBV-related lymphoproliferation HP:0005523 (wired from the viral-susceptibility node), arthritis HP:0001369; CURIEs and labels read from cache/hp/terms.csv and OLS. Enteropathy, failure to thrive and candidiasis, named only by the deep-research report, were not curated because no cached source states them. Ten uncited reference caches were removed from the PR: five with no quotable text, one about a RAG2/IL2RG pig, one duplicating PMID:35052377 under its DOI, two theses on the same German family, and one on gamma-delta T cells. GeneReviews items carry quote_role REVIEW_SYNTHESIS. Merged origin/main; one hp term-cache row conflicted on timestamp only and took main's row.

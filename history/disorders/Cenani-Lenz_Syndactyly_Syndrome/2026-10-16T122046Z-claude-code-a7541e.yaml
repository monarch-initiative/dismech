  summary: 'Create: Cenani-Lenz Syndactyly Syndrome'
  details: |
    New entry for MONDO:0008931 (LRP4). Inputs: one Perplexity deep-research report run at reasoning_effort low, used as a lead only; its numbered citations were not used. The report body named PMIDs 20381006, 38013226, 37640745, 30569497 and 20610440. Added from PubMed searches: 15710123, 16207730, 16517118, 16963222, 20454682, 23636941, 23664847, 24924585, 25676610, 28559208, 29524275, 30041615, 30327840, 31750994, 31895055, 34857885, 42153583. Pathograph: biallelic LRP4 loss of function -> loss of LRP4 antagonism of LRP6 canonical Wnt signaling -> (limb) abnormal apical ectodermal ridge signaling -> defective digit separation -> limb phenotypes; (kidney) delayed ureteric budding -> failed metanephric mesenchyme induction -> renal agenesis/hypoplasia; (one beta1-propeller allele) impaired agrin-LRP4-MuSK signaling -> fatigable weakness. Judgement calls: the Wnt-to-ridge and Wnt-to-ureteric-bud steps rest on mouse evidence and are marked INDIRECT_UNKNOWN_INTERMEDIATES; APC and GREM1-FMN1 Cenani-Lenz-like families are recorded in notes as differentials, not as genetic rows; hypoglycaemia (one sibship) and Notch involvement (zebrafish) kept to notes; facial features, scoliosis and short stature left without a causal edge because no mechanism is published; GO:0030547 signaling receptor inhibitor activity and GO:0017147 Wnt-protein binding bound as LRP4 molecular functions; no prevalence record because Orphanet was not cached and no primary prevalence source was found; no GeneReviews chapter exists. Validation: just validate-disorders passed, 72/72 snippets verified, check-entity-refs, check-causal-targets, check-duplicate-keys, check-gene-activity-grounding OK; 14 of 20 phenotypes causally connected.
    Review round: added a diagnosis section (hand radiography, prenatal ultrasound, targeted LRP4 testing, exome sequencing) with case-report evidence including PMID:33179409, split carpal from metacarpal synostosis (HP:0009702 and HP:0009701), added cleft lip from PMID:28559208 without a causal edge, and trimmed a mouse-study snippet that also described human malformations; 83/83 snippets verified and all gates pass. A renal-ultrasound row was dropped before push because its only evidence was a case report with normal kidneys.

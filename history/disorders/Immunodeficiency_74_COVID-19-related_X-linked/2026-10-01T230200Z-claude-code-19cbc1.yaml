  summary: 'Pre-PR review fixes: Immunodeficiency_74_COVID-19-related_X-linked'
  details: |
    Applied the findings of a pre-PR review pass over the new entry. Six substantive fixes. (1) The environmental review_notes named ECTO:9000018 as the rejected 'exposure to virus' term; that CURIE is 'exposure to phosphoric acid'. The term meant is ECTO:3000001, which is the row in cache/ecto/terms.csv, and the note now also reports the grep output correctly (no sars/corona/covid rows; two virus rows, ECTO:3000001 and ECTO:2000053). The negative-existence claim was re-run against OLS and holds: no coronavirus or SARS-CoV-2 exposure class exists, while the virus branch carries Zika, yellow fever, hepatitis and HIV descendants. The binding decision is unchanged. (2) The mRNA-vaccination treatment description attributed to PMID:36342455 the explanation that nucleoside modification keeps the mRNA from being sensed; that paper concludes only that type I interferon induction is not required for the humoral response, and its discussion says modified mRNA may still be partially recognised by endosomal TLRs. Rewritten to the authors' actual conclusion. (3) The ARDS phenotype was evidenced by an ECMO-referral sentence, which supports severity rather than the diagnosis. The ARDS sentence from the same paper is now the first evidence item ('A CT-scan showed multiple diffuse ground-glass opacities and consolidations in all lung segments, meeting the criteria for ARDS.'); the ECMO quote is kept as a second item with an explanation that says what it supports. (4) Two nodes now declare conforms_to against innate_antiviral_interferon_response, the module that covers this cascade: the sensing-failure node to its PAMP-sensing node (as Influenza does for its TLR node) and the pDC interferon node to its type I/III induction and JAK-STAT node, whose partial fit is stated in that node's description and in review_notes. GO:0009597 detection of virus was added to the sensing node to match the module's claim. (5) The notes said both HP:0011116 and HP:0034513 were read from cache/hp/terms.csv; only HP:0034513 is there. Provenance corrected. (6) The lung immunopathology node's description claimed diffuse alveolar damage, which no cited source states and which the entry's own animal-model limitations contradict; replaced with the murine histology the node's evidence actually reports. Smaller fixes: directness INDIRECT added to the PMID:36780676 outcome item whose explanation already claimed that grade; the Severe viral infection edge moved off Hypoxemic COVID-19 Pneumonia, which it is part of rather than caused by, onto the viral-containment node; the MyD88-to-type-II-interferon edge regraded INDIRECT_KNOWN_INTERMEDIATES because IFN-gamma in stimulated PBMCs comes from T and NK cells via accessory cytokines; GO:0034343 type III interferon production bound on the replication node, where the murine measurement sits; CL:0000775 neutrophil added to the node named for neutrophil accumulation; the penetrance hypothesis no longer says the severe group was simply older, since its own quoted snippet spans 7 to 71 years; and review_notes lost the process-narration sentences, gaining instead the module-conformance decision and the reason standard severe-COVID care (early antivirals, dexamethasone, IL-6 blockade) is out of scope. Not taken: a progression: block for the early-viral and late-inflammatory phases, which needs sources on disease phases rather than on treatment timing. Validation: just validate, count-verified-snippets 83/83, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles, check-qualifier-terms and the batched just validate-disorders all pass. All five phenotypes remain causally connected. No cache rows changed: both added GO terms were already cached.

  summary: 'Create: Immunodeficiency_74_COVID-19-related_X-linked'
  details: |
    De novo creation of the X-linked recessive TLR7 deficiency (IMD74, MONDO:0026767) entry, curated as a Disease rather than a GROUPING or SUBTYPE: MONDO:0026767 is a leaf under immunodeficiency disease with a single causal gene (TLR7, hgnc:15631), one OMIM exact match (301051), and no descendants, and the disorder is a named clinical entity in the IUIS 2022 inborn-errors-of-immunity classification.

    Pathograph. Nine pathophysiology nodes forming one chain from the molecular lesion to the clinical endpoint: TLR7 Loss of Function -> Failure of Endosomal Single-Stranded RNA Sensing -> Abolished MyD88-Dependent Signal Transduction, branching to Deficient Plasmacytoid Dendritic Cell Type I Interferon Production, Impaired Type II Interferon Induction and Defective B Cell and Myeloid TLR7 Responsiveness, then Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract -> Lung Neutrophil Accumulation and Immunopathology and -> Hypoxemic COVID-19 Pneumonia, which wires through to all five phenotypes by bare-name targets. All five phenotype nodes are causally connected (just list-disconnected-phenotypes reports 5/5). The disease-defining exposure is modelled as an environmental entry linked with environmental_effect TRIGGERS, since the genotype is clinically silent until SARS-CoV-2 infection.

    Deep research. Exactly one openscientist deep-research report was commissioned and is committed with the entry, together with its citations sidecar and its two-file artifacts directory. just preflight-dr could not run: it exits 2 because the local MONDO build is absent and the recipe refuses to download it implicitly, so disease identity was checked by hand instead (the report names TLR7, Xp22.2 and OMIM 301051, matching the MONDO record's exact match). The report carried no Term Validation or reference-validation section despite the recipe passing --validate-terms and --validate-references, so every CURIE in this entry was resolved independently by lookup and none was taken from the report. Four of its leads were verified against the fetched abstracts and curated: the 21-cohort exome-wide burden estimate (PMID:36327219), TLR7 escape from X-inactivation as the buffer in heterozygous women (PMID:38481993), the paired early-outpatient and late-inpatient peginterferon-lambda trials (PMID:36780676, PMID:40818744), and the direct propofol inhibition of TLR7-MyD88 association (PMID:35899460), which is recorded as an INTERPRETATION discussion rather than a treatment caution because the evidence is biochemical and murine. Two leads were read and rejected, with the reasons recorded in the entry's review_notes.

    Evidence. 82 evidence snippets across 22 cited references, all exact-quote verified against references_cache (82/82). Two REFUTE items are deliberate: the normal human mRNA-vaccine B cell response against the B cell node, and the negative late-administration interferon trial against the interferon treatment. One HUMAN_MODEL_MISMATCH discussion records the opposite answers mouse and human give on whether B-cell-intrinsic TLR7 is needed for anti-SARS-CoV-2 antibody, with a proposed natural-infection experiment; one KNOWLEDGE_GAP records the single-case neurological-sequelae question and the ataxia-telangiectasia confound. Two unbound terms are recorded with the searches that justify them: no ECTO class exists for SARS-CoV-2 exposure (ECTO:9000018 exposure to virus was rejected on positive grounds, since this disorder's susceptibility is virus-specific), and no NCIT clinical-action term exists for the luciferase signalling assay. No biochemical block and no phenotype frequencies are curated, for reasons stated in notes: the interferon findings are ex vivo stimulated responses rather than circulating analyte concentrations, and every cohort was ascertained on COVID-19 severity.

    Validation. just validate, count-verified-snippets (82/82), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens, check-coarse-phenotypes, check-case-collisions, check-enum-values, check-genereviews (no GeneReviews or StatPearls chapter exists for this disorder in the committed Bookshelf index) and the batched just validate-disorders all pass. just normalize-cache added ten additive rows across eight cache files. The stub is deleted in the same commit.

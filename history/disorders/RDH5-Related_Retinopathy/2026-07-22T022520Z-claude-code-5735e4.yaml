  summary: 'Create: RDH5-Related Retinopathy'
  details: |
    Fresh curation of RDH5-related retinopathy (MONDO:0100443, fundus albipunctatus), from the retinopathy MONDO-coverage tracker (issue #4008) and projects/RETINOPATHIES.md's RDH5-family-umbrella target. Two-branch pathophysiology: RDH5 11-cis-retinol dehydrogenase deficiency -> delayed rod/cone chromophore regeneration -> (A) the typical stationary night-blindness/flecked-retina course (recoverable negative-configuration ERG after prolonged dark adaptation), and (B) an age-associated (>40yo), incompletely penetrant progressive cone dystrophy/macular atrophy subset, modeled as a separate has_subtypes entry and pathophysiology branch. 12 PMIDs independently fetched via just fetch-reference and verified snippet-by-snippet against cached abstracts (no DR tool used this session; sourced via a research subagent for leads, then independently verified). NEC preflight passed: MONDO:0100443's relationship RO:0004003 HGNC:9940 matches RDH5, OMIM:136880 (fundus albipunctatus) is a confirmed narrow synonym. Notes field documents that RPE65 mutations are a separate non-allelic phenocopy of the FA phenotype, not a digenic/modifier interaction with RDH5 -- no supporting literature found after a targeted search despite that being a plausible a priori hypothesis. Caught and avoided one bad citation: PMID:19955196's own abstract cites ClinicalTrials.gov NCT00478530 for its oral 9-cis-beta-carotene pilot trial, but that NCT ID actually resolves to an unrelated Avastin/CNV ERG trial on the registry -- omitted the clinical_trials block rather than citing a mismatched ID, cited the PMID directly instead. New MONDO:0100443 enum value manually appended in sorted order to cache/enums/diseaseterm_f618932bb23f.csv. Full validation suite (schema, references, terms) run before commit.

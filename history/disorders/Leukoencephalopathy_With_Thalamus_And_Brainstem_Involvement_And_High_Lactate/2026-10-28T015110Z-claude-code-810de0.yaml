  summary: 'Create: Leukoencephalopathy_With_Thalamus_And_Brainstem_Involvement_And_High_Lactate'
  details: |
    New entry for LTBL / COXPD12 (MONDO:0013971), caused by biallelic EARS2 variants (hgnc:29419, checked against the HGNC REST API).

    Sources. Deep research was run with the claude_code provider (research/Leukoencephalopathy_With_Thalamus_And_Brainstem_Involvement_And_High_Lactate-deep-research-claude_code.md). Its reference validation resolved 27/27 identifiers; one quote attributed to PMID:31839000 ("developmental disorders of myelination") was not found in the cached text, and that phrase is not used in the entry. Term validation found no unresolved CURIEs; every CURIE in the entry was looked up independently in OLS or the repository caches. just preflight-dr returned PASS (EARS2 mentioned 34 times, OMIM 614924 matching MONDO). A PubMed search for EARS2 and the disease name supplied further case reports. just check-genereviews --online reports no GeneReviews chapter.

    Content. Fourteen pathophysiology nodes run from EARS2 glutamyl-tRNA synthetase deficiency through impaired glutamyl-tRNA aminoacylation, impaired mitochondrial translation, combined respiratory chain deficiency and a glycolytic shift with lactate production, to tissue nodes for delayed myelination, deep white matter, thalamic, brainstem/cerebellar and basal ganglia lesions, antenatal developmental injury, atrophy, hepatic dysfunction and (single patient) B-cell mitochondrial dysfunction. Edges with no stated source carry a description saying they are inferred. Mild and severe forms are modelled as has_subtypes because the defining paper (PMID:22492562) names them as two groups. Thirty-seven phenotypes; frequency bands come from the review table of 21 patients in PMID:31839000. Diagnosis, biochemical lactate measures (LOINC), ten variants, treatments (cofactor supplementation, a single-patient glutamate supplementation report, ketogenic diet without benefit, antiseizure medication, physical therapy), two in vitro models and four differential diagnoses were added.

    Conformance. "Combined Respiratory Chain Complex Deficiency" conforms to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress (decreased OXPHOS and increased ROS both evidenced in patient material), matching the practice of the COXPD13 and COXPD42 entries. "Delayed Cerebral Myelination" conforms to cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath on imaging evidence of deficient myelin deposition; the module's trigger and oligodendrocyte nodes were not used because the primary lesion is not oligodendrocyte-specific. Rejected: complex_i_deficiency and complex_iv_assembly_deficiency (both scoped to isolated deficiencies), xenobiotic_oxidative_phosphorylation_blockade (requires an exogenous agent), hepatic_gluconeogenesis_failure (lactate there arises from a gluconeogenic block), deregulated_cellular_energetics (oncology), corticospinal_tract_axonopathy, cerebellar_purkinje_degeneration and neuroinflammation_glial_activation (no LTBL evidence for their nodes).

    References not used. PMID:23008233 (Talim 2013) and PMID:42778161 cached with no quotable text. PMID:33128823, PMID:33832841 and PMID:42724182 concern reversible infantile respiratory chain deficiency, where heterozygous EARS2 variants act as modifiers, a different disease. PMID:41096790 (serum FGF21) includes one EARS2 patient in a mixed cohort and was not disease-specific. PMID:33972171 (MRI patterns across mitochondrial synthetase disorders, abstract only) was not cited. PMID:22312165 describes the MRI-defined series before the gene was known and is cited with that caveat in the entry notes.

    Validation: just validate passed; count-verified-snippets 180/180; just validate-disorders passed (180 snippets, 202 titles, 0 issues); entity-ref, causal-target, logical-rule, coarse-phenotype, enum, duplicate-key and block-scalar checks passed; GeneReviews NO_CHAPTER; 29 of 37 phenotypes causally connected (the remainder are four lactate or enzyme readouts plus microcephaly, hypoglycemia, ptosis and failure to thrive, for which no source states a mechanism).

    Review response. The second ketogenic-diet evidence item (PMID:42863838, a
    neonate who died a week after starting the diet) is now NO_EVIDENCE, since
    it says nothing about efficacy. Cerebral atrophy drops its OCCASIONAL
    frequency and keeps the severe-subtype scoping: the only count (27% of 21
    patients) pools both subtypes and does not specify the cerebrum, while the
    severe group is defined partly by brain atrophy; a notes line records this.
    The PMID:31520968 title carried literal backslashes before its quotation
    marks in folded scalars; they were removed in all 13 places.

  summary: 'Create: Bone Marrow Failure Syndrome 6 (MONDO:0030015, MDM4)'
  details: |
    De novo curation of BMFS6 (OMIM 618849) as an MDM4 haploinsufficiency / p53-activating syndrome. Primary source: Sharma et al., Blood 2026 (PMID:41758987), the six-person cohort that established the gene; supporting mouse genetics from Simeonova et al. 2013 (PMID:23770245). Seven-node pathograph: germline heterozygous MDM4 LOF -> loss of MDM4-mediated p53 restraint -> p53 hyperactivation in HSPCs -> impaired self-renewal and multilineage output -> marrow failure, with a second branch to somatically acquired TP53 loss-of-function as maladaptive clonal rescue and thence to MDS/leukaemia. Both engineered systems curated as experimental_models with modeled_mechanisms and readouts; the p53-delta-31 mouse curated as an animal_model at PARTIALLY_RECAPITULATES/MODERATE because its primary lesion is in p53 rather than MDM4. GENE IDENTITY CORRECTION: the claim issue #10170 originally named MECOM. That was wrong; MONDO records no causal gene for MONDO:0030015 so the stub carried no genes block, and the gene was filled from memory. The openscientist deep-research run and OMIM 618849 both give MDM4, confirmed against the primary paper. Issue body corrected. The mouse telomere phenotype is deliberately NOT asserted for human BMFS6 and is recorded as a HUMAN_MODEL_MISMATCH discussion instead; no conforms_to declared against telomere_attrition. Validated with just validate, count-verified-snippets (31/31), check-entity-refs, check-duplicate-keys and the four baseline gates.

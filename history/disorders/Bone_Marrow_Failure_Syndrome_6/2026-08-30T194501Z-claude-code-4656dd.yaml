  summary: 'Address review: add founding paper PMID:32300648 and correct the telomere
    rationale'
  details: |
    Addresses the CHANGES_REQUESTED review on PR 10174. The blocking finding was correct: Toufektchan et al. Sci Adv 2020 (PMID:32300648) is the founding BMFS6 paper and was cited nowhere. It reports short telomeres, tongue squamous cell carcinoma and AML in the human p.T454M family, which makes the previous HUMAN_MODEL_MISMATCH rationale - that the telomere arm was a model-derived expectation and not a human finding - factually wrong. Changes: added the founding paper and a telomere-biology-disorder management review (PMID:35929966); new Telomere Shortening pathophysiology node downstream of p53 hyperactivation, declaring conforms_to telomere_attrition#Progressive Telomere Attrition; replaced the false discussion with two accurate ones - a KNOWLEDGE_GAP on whether telomere shortening extends beyond p.T454M (the 2026 cohort was never measured), carrying a proposed_experiment, and a narrowed HUMAN_MODEL_MISMATCH confined to the mouse telomere-maintenance gene program which genuinely has no human counterpart; added the Mdm4 p.T454M knock-in mouse at RECAPITULATES/HIGH, which resolves the limitation capping the p53-delta-31 mouse; added phenotypes for short telomeres, AML and tongue SCC; strengthened the MDS/leukaemia node with disease-specific AML evidence replacing the class-level-only caveat; wired the previously orphaned p53_activating_bmf hypothesis group onto five causal edges; added a prevalence CASES_IN_LITERATURE record; added the p.T454M variant; added telomere length measurement to diagnosis; added HSCT and androgen treatments curated from class-level guidance with directness INDIRECT and an explicit notes rationale. Also added variable-expressivity evidence to inheritance. Snippets 48/48 verified; schema, entity-refs, duplicate-keys and the four baseline gates all pass.

  summary: 'Address re-review: curate the MDM2/MDMX-inhibitor contraindication'
  details: |
    Addresses the single outstanding item from the second review on PR 10174. Added MDM2/MDMX inhibitors (nutlins and successors) as a treatment to avoid, following the contraindication pattern used in Allan-Herndon-Dudley_Syndrome: the treatment name carries the contraindication and the description carries the reasoning. The claim is that these agents raise p53 activity by design, which is the pharmacology this disease is already suffering from, so giving one would be expected to deepen the causal lesion. Cited to PMID:28673313 for the pharmacological premise only, graded OTHER with directness INDIRECT, and the description states explicitly that no publication makes this recommendation about BMFS6, no MDM4-haploinsufficient patient has received one, and no adverse outcome has been reported. Curated rather than omitted because these drugs are in clinical evaluation for haematological malignancy, which is the setting a BMFS6 patient with hypocellular MDS could plausibly reach. Also dispositioned the OMIM clinical-synopsis cytopenias in notes as a recorded decision rather than an unexplained absence: neither primary paper states them and the OMIM synopsis is not citable in this repository's evidence model. Snippets 49/49 verified; all gates pass.

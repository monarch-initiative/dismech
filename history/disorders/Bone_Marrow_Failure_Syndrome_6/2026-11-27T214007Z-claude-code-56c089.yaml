  summary: 'Curate phenotypes: Bone Marrow Failure Syndrome 6'
  details: |
    Phenotype curation pass. No new phenotypes could be added with citable evidence: the network blocked NCBI and EBI, so neither primary paper's full text could be cached. Enriched existing phenotypes from two already-cached full-text reviews (PMID:37834388, PMID:39371255): added review evidence for bone marrow abnormalities and short telomeres in five further carriers, a severity context for the most affected founding-family carrier (lymphocyte telomeres at or below the first centile), the age-27 onset of tongue squamous cell carcinoma in a genotyped carrier, an onset context for bone marrow failure (four weeks to 53 years), and a second MDS evidence item. Corrected two explanations that overstated their snippets: the bone marrow failure item claimed hypocellularity in all six cohort members, and the AML item said carriers had AML, when the abstract reports it at family level only. Wired four phenotypes from existing pathophysiology nodes (marrow failure, telomere shortening, progression to MDS and AML). Updated stale text in notes, prevalence notes, description, the telomere-penetrance discussion and the telomere-length diagnosis. Recorded neutropenia, B cell deficiency and the ungenotyped AML and HNSCC relatives from the founding paper's full text (PMC7148086, read but not cacheable) as leads in notes. Validation: validate, count-verified-snippets (59/59), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes, check-name-collisions all pass.

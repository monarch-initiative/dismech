  summary: 'Take review suggestions on PR #10449 (SGBS1)'
  details: |
    Second response round on PR #10449, after the reviewer approved the blocking fixes and left five suggestions.

    The substantive one was fidelity on the Gpc3-null FAILS_TO_RECAPITULATE link, changed from HIGH to LOW. The slot is defined as how faithfully the model captures the linked human mechanism, so on a link asserting the model does not reproduce IGF2 sequestration, HIGH states the opposite of what was meant. What was actually being encoded was 'this negative result is well characterised', which is a different claim and does not belong in that slot. The KB convention agrees: the overwhelming majority of FAILS_TO_RECAPITULATE links use LOW. This is worth recording because the same misreading was made independently on the POT1 entry in this series, where fidelity HIGH sat beside limitations that bounded the model.

    Also taken: the U+FB01 ligature note moved out of an evidence explanation, which renders as claim content, into the diagnosis block notes where cache mechanics belong; the GeneReviews 50% per-pregnancy transmission sentence added to inheritance; directness INDIRECT on the neonatal hypoglycemia item, whose snippet is a surveillance recommendation rather than a statement that hypoglycemia occurs; and the reason the mutation-update reference carries no snippet recorded in the PublicationReference findings slot rather than deleted, since a curator reading the YAML later would otherwise re-attempt to snippet an unavailable cache.

    Declined, with the reviewer agreeing on re-review: three GeneReviews findings with no stated frequency (diastasis recti and gastrointestinal issues, hearing and ophthalmologic surveillance). Adding them would have put the inference into the graph rather than into a reviewer's head. The distinction that decided it is what the source sentence is doing: neonatal hypoglycemia earns a phenotype because GeneReviews treats it as an urgent recognised complication phrased as an instruction, whereas 'annual audiologic evaluation' is a statement about good practice that does not assert the finding occurs above background. directness is a grade on evidence bearing on a claim, not a licence to manufacture the claim.

    Validation: 48/48 snippets verified; validate, validate-terms, reference-titles, entity-refs, causal-targets, qualifier-terms, duplicate-keys, enum-values, snippet-grading, snippet-length and title-snippets all clean.

  summary: 'Create: Simpson-Golabi-Behmel Syndrome Type 1'
  details: |
    De novo curation of Simpson-Golabi-Behmel syndrome type 1 (MONDO:0020602, GPC3) from a falcon/Edison deep-research report (research/Simpson-Golabi-Behmel_Syndrome_Type_1-deep-research-falcon.md) plus independent PubMed searching, with the GeneReviews SGBS1 chapter (PMID:20301398) as the phenotype baseline.

    The report's own validation resolved 9/9 references but flagged one unresolved term, HP:0001524, which does not exist in HPO; it was not bound. GO:0031225 was flagged obsolete and likewise not used.

    The mechanism is curated as the current hedgehog account rather than the original IGF2 account, and both are represented. Pilia 1996 (PMID:8589713) proposed IGF2 complexing from ligand blots; the Gpc3-null mouse (PMID:10402475) reproduced the overgrowth but found IGF-II levels unchanged, which is carried as a REFUTE evidence item on a HYPOTHETICAL-confidence IGF2 node that is deliberately left unconnected to the causal chain. Capurro/Filmus 2008 (PMID:18477453) supplies the supported mechanism: glypican-3 binds Hedgehog, competes with Patched, and drives ligand endocytosis and degradation, so GPC3 loss de-represses hedgehog signaling. The primary Dev Cell report was cited in preference to the Genome Biology review that restates it.

    Two evidence items initially quoted paper titles rather than findings and failed snippet verification; both were replaced with substantive abstract sentences (PMID:10814714 allele classes, PMID:9950367 the 13 bp frameshift deletion). A third intended item, PMID:17850639 on germline mosaicism, has a PubMed record with no abstract text, so no quote can be verified against the cache; the evidence item was dropped and the claim is instead attributed in prose in the GPC3 genetic notes, with the reason for that treatment stated there.

    Validation: just validate passed; 30/30 snippets verified; validate-terms passed; check-entity-refs and check-causal-targets clean; whole-KB duplicate-key, enum-value, folded-hyphen, snippet-length, title-snippet and snippet-grading gates clean. Stub stubs/Simpson-Golabi-Behmel_Syndrome_Type_1.yaml deleted.

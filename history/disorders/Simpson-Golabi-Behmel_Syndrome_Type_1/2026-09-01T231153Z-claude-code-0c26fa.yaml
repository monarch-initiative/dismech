  summary: 'Address review on PR #10449 (SGBS1)'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10449. All five blocking items verified against the repository before acting, then fixed.

    Item 1, reference_title: added to all evidence items, taken verbatim from each references_cache frontmatter. The reviewer's claim that this was the only file of 2,509 in kb/disorders with none was checked and confirmed by grep -rL before fixing. Note the same gap exists on the sibling branches for Denys-Drash and POT1 and is being fixed there too.

    Item 2, GeneReviews DIAGNOSIS/TESTING unmined: added a diagnosis: block carrying the GeneReviews statement of how the diagnosis is established, plus the CUGC sex-dependent testing order (MLPA first in female probands).

    Item 3, uncited cached references: PMID:30683921 (CUGC, cached as full_text_pdf) is now cited five times, for the quantitative variant spectrum, complete male penetrance, organomegaly, the MLPA-first testing order, and cardiac follow-up. DOI:10.1002/humu.23428 is cached content_type: unavailable so it carries no snippet; it is recorded in the top-level references: block with the reason stated, as the reviewer advised.

    Item 4, missing phenotypes: added Congenital Heart Defect, Genitourinary Anomaly, Scoliosis, Vertebral Fusion, Visceromegaly and Wide Mouth, taking phenotype count from 12 to 18. Cardiac carries both the GeneReviews finding and the CUGC longitudinal-surveillance sentence, and a matching Longitudinal Cardiac Surveillance treatment was added.

    Item 5, Gpc3-null mouse: added an animal_models entry with two modeled_mechanisms links. RECAPITULATES against the overgrowth node with a body-size readout, and FAILS_TO_RECAPITULATE against the IGF2 node with an UNCHANGED circulating IGF-II readout, which is the structural form of the refutation the entry previously carried only as a REFUTE evidence item.

    Suggestions also taken: downstream edges from the overgrowth node to Macrocephaly, Coarse Facial Features and Visceromegaly, which the node's own description already asserted in prose; evidence_source on the Capurro binding and trafficking sentence regraded MODEL_ORGANISM to IN_VITRO; a prevalence record as NOT_YET_DOCUMENTED; and the CUGC footnote that SGBS type 2 is PIGA-related disease recorded in the GPC3 notes.

    Two defects were introduced during this work and caught by the gates before pushing. The cardiac surveillance treatment was first bound to NCIT:C15406 (Cancer Screening), which is the wrong concept for cardiac follow-up; it now binds NCIT:C168126 (Cardiac Disease Screening). And the CUGC penetrance sentence was initially graded OTHER under prevalence and HUMAN_CLINICAL under genetic, which check-snippet-grading rejected; the prevalence evidence item was removed entirely rather than regraded, because that sentence does not speak to prevalence and citing it there would have misattributed the claim. The prevalence record now carries notes and no evidence.

    One snippet keeps a U+FB01 ligature deliberately. The CUGC cache is PDF-extracted and the gating validator does not fold ligatures, so replacing it with plain 'fi' makes the quote stop matching; the explanation says so.

    The reviewer's point that polydactyly and supernumerary nipples should not take invented downstream edges was accepted; twelve phenotypes remain deliberately unconnected.

    Validation: just validate passes; 48/48 snippets verified; 48/48 evidence items carry reference_title; entity-ref, causal-target, qualifier-term, duplicate-key, enum-value, title-snippet, snippet-length and snippet-grading gates all clean.

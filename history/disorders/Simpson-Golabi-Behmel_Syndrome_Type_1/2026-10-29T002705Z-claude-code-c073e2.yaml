  summary: Add a sourced neuroblastoma phenotype
  details: |
    Adds a Neuroblastoma phenotype (HP:0003006) after the Hepatoblastoma row, so the entry can join the neuroblastoma predisposition grouping. Part of the neuroblastoma expansion series (issue 15822).

    Evidence: a 2024 case series and literature review of molecularly confirmed patients (PMID:39158128, newly cached, full text) that lists a neuroblastoma and an adrenal neuroblastoma among the tumours other than Wilms tumour and hepatoblastoma; the GeneReviews sentence listing adrenal neuroblastoma among the embryonal tumours of increased risk; and the 2024 AACR surveillance update (PMID:39320341), which puts tumour types other than hepatoblastoma and Wilms tumour below 1% of 189 reported cases. That last item is graded INDIRECT because it does not name neuroblastoma. The explanations note that the review and the update share authors with the GeneReviews chapter, so they are not independent. Frequency VERY_RARE (<5%).

    No causal edge points at the row, and its notes say why: no cited source links the Persistence of Embryonal Progenitor Tissue node, or GPC3 loss, to neuroblastoma by mechanism.


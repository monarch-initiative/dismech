  details: |
    Self-review before opening the PR. The block attributed the study's SHH-signalling and primary-cilium pathway finding to the four recurrently mutated oligogenic genes; PMID:30508070 reports that pathway statement of the whole 180-gene variant set, not of the oligogenic subset. Rewritten to keep the two claims separate and say so explicitly. Also replaced the superlative claiming the strongest study design in the knowledge base, which collided with the one on Congenital_Hypothyroidism, with the narrower and checkable claim that this is the only multi-locus claim here tested against control populations. No snippet text changed.

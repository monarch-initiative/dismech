  summary: 'Phenotype review: SHH_Holoprosencephaly_Spectrum'
  details: |
    Reviewed all 25 phenotypes for snippet-claim consistency, HPO term optimality, and pathograph explanation. All snippets verified against cached sources in whole-abstract context; no wrong-disease or negated-context citations found. HPO bindings judged optimal; HP:0000202 Orofacial cleft deliberately kept over the narrower HP:0100629 Midline facial cleft because the entry's claim covers cleft lip and/or palate generally. Wired all 22 previously unexplained phenotypes into the pathograph using existing nodes only: subtype grades, seizures, hydrocephalus, and microcephaly from Impaired Forebrain Midline Separation; facial/nasal midline defects from Craniofacial Midline Deficiency; GDD, ID, and feeding difficulties from Neurological Impairment; anterior-pituitary axis deficiencies from Pituitary Dysfunction; eye phenotypes from Reduced SHH Signaling in Forebrain Patterning. Added human-clinical evidence for microphthalmia (PMID:39726469) and coloboma (PMID:12503095, Schimmenti SHH-deletion family behind MONDO:0012709), which were previously supported only by model-organism data. Added seizure frequency FREQUENT with PMID:12370462 (~50% of children). Marked the SMMCI-literature anomaly-list evidence for microcephaly and the choanal atresia edge as directness INDIRECT (the reviewed SMMCI cohorts are not SHH-restricted). Added genes: SHH to the signaling node, wiring the causal gene into the mechanism graph. Oligogenic background variation remains unwired by design (no single gene key). Validated with just validate, validate-terms, check-duplicate-keys, check-entity-refs, and validate-disorders; 132/132 snippets verified.

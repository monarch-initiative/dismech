  details: |
    PR Shepherd response to ai4c-reviewer CHANGES_REQUESTED on PR #7382. (1) Rebound the central diabetes insipidus phenotype and the desmopressin target_phenotypes from HP:0000873 Diabetes insipidus to the specific child HP:0000863 Central diabetes insipidus, so the bound term no longer subsumes nephrogenic DI. (2) Rebound the central hypothyroidism phenotype and the hormone-replacement target_phenotypes from HP:0000821 Hypothyroidism to HP:0011787 Central hypothyroidism. Both swaps align the entry with the already-correct HP:0011734 and HP:0008240 central terms used elsewhere in the same section. (3) Added a second consequence arm to the Hypothalamic Non-Separation node: a new pathophysiology node 'Hypothalamic Autonomic and Homeostatic Dysfunction' with a downstream edge from Hypothalamic Non-Separation, plus a matching Neurological phenotype bound to HP:0012332 Abnormal autonomic nervous system physiology. Evidence quoted from PMID:20104615 (hypothalamic dysfunction with disturbed sleep-wake cycles and temperature dysregulation) and PMID:39726469 (autonomic nervous system dysfunction), both already cached, so no new references were fetched. All three HPO terms were verified with OAK against sqlite:obo:hp before use. Validation: just validate passed, just validate-terms passed, just validate-references reported 99/99 snippets verified (up from 94/94).

  details: |
    PR Shepherd fix commit addressing the four IMPORTANT findings of the
    2026-08-04T15:30Z re-review of #7382.

    1. Mis-wired pathograph edge. The "Pituitary Dysfunction" downstream edge
    hung off "Craniofacial Midline Deficiency", but its own PMID:29761634
    snippet reads "as a direct result of brain midline defects" and its
    explanation said as much. Moved the edge to originate from "Impaired
    Forebrain Midline Separation" so the causal claim and the cited snippet
    agree.

    2. Structural term used for a functional claim. The "Pituitary Dysfunction"
    phenotype was bound to HP:0010627 Anterior pituitary hypoplasia (an
    underdevelopment term) while its supporting snippet reports "Anterior
    pituitary deficiency was found in 74% and 53% of patients". Rebound to
    HP:0000830 Anterior hypopituitarism, verified via OAK (its definition
    covers decreased secretion of one or more anterior pituitary hormones).
    Also removed diabetes insipidus from that description: DI is
    posterior/hypothalamic, and the entry already models it correctly as
    Hypothalamic Non-Separation -> Central Diabetes Insipidus, so listing it
    under an anterior-pituitary term contradicted the entry's own separation.

    3. Orphan node. "Modifier-Dependent Variable Expressivity" had no inbound
    or outbound downstream edges, so the pathograph was not a single connected
    component, and it lacked biological_scale. Added an edge into "Reduced SHH
    Signaling in Forebrain Patterning" (the wiring the reviewer proposed)
    carrying PMID:17525797, the Gas1/Shh genetic-interaction result already
    cited on the node, tagged MODEL_ORGANISM with an explanation noting the
    human counterpart is the PMID:29992659 oligogenic modifier synergy on the
    same node. Set biological_scale: ORGANISM as a judgement call, flagged for
    the author on the PR.

    4. Missing NCIT anchor. The Desmopressin treatment_term carried only a
    free-text preferred_term plus CHEBI:4450. Added term: NCIT:C15986
    Pharmacotherapy and moved preferred_term to the action name, matching the
    sibling "Endocrine Hormone Replacement" treatment and the CLAUDE.md rule
    that preferred_term describes the action, not the agent.

    Not addressed, deliberately: the SUGGESTIONs are left to the author. The
    registry-grade survival sources, the CL:0011020 rebinding, the
    classifications block, and the HUMAN_MODEL_MISMATCH discussion for
    PMID:20013843 are all content judgements rather than defects, and the
    deferrable DR content is new curation rather than review remediation.

    Validation: just validate green end to end (schema "No issues found",
    terms "Validation passed", references 100/100 snippets verified, up from
    99/99 with the new edge's evidence item). check-snippet-length and
    check-folded-hyphens ratchets both OK. pytest tests/test_data.py 14962
    passed, with test_non_therapeutic_actions_do_not_use_treatment_targets
    deselected as a pre-existing failure in Adrenal_Cortex_Adenoma.yaml that is
    unrelated to and untouched by this PR.

    Scope: only kb/disorders/SHH_Holoprosencephaly_Spectrum.yaml and this
    record are committed. just validate rewrote reference_id quoting in 7633
    references_cache/*.md files as a side effect; all of that churn was
    discarded and none of it is in the commit. Both new terms were already
    present in the committed term caches with matching labels, so no cache/
    rows changed.

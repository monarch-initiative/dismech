  summary: 'Augment: SHH Holoprosencephaly Spectrum [Holoprosencephaly-3, MONDO:0007733]'
  details: |
    Curation request was for "Holoprosencephaly-3". Duplicate preflight (origin/main git grep by MONDO ID, preferred label and synonyms; GitHub issue and PR search) established that HPE3 (MONDO:0007733, OMIM:142945, SHH) is already curated as kb/disorders/SHH_Holoprosencephaly_Spectrum.yaml, so this session augmented the existing entry rather than creating a duplicate file.

    Deep research: the pre-existing falcon report (research/SHH_Holoprosencephaly_Spectrum-deep-research-falcon.md, run 2026-04-04) was mined, and a NEW claude_code deep-research report was generated this session (research/SHH_Holoprosencephaly_Spectrum-deep-research-claude_code.md). A fresh falcon run was attempted but failed with HTTP 402 Payment Required from the Edison API (no credits on EDISON_API_KEY). An openscientist run also completed this session (research/SHH_Holoprosencephaly_Spectrum-deep-research-openscientist.md) and contributed the most valuable material: the SHH-genotyped cohort data (PMID:22791840, PMID:21940735), the mutation-positive-microform high-intellect finding (PMID:23112757), and a second endocrine cohort (PMID:25056824). One openscientist quote (a SIX3/ZIC2-vs-SHH severity sentence from PMID:21940735) failed exact-substring verification against the cached full text and was dropped rather than paraphrased.

    Deep-research outputs were treated as leads only. Every PMID was fetched with "just fetch-reference" and every snippet verified as an exact whitespace-normalized substring of the cached abstract or full text. Several DR-suggested HPO IDs were wrong and were corrected against OAK: alobar HP:0007169 -> HP:0006988, semilobar HP:0007193 -> HP:0002507, lobar HP:0007194 -> HP:0006870, SMMCI HP:0006313 -> HP:0006315.

    GeneReviews baseline: PMID:20301702 "Holoprosencephaly Overview" was fetched and tagged in a new top-level references block. Its PubMed abstract is an overview blurb with no Clinical Characteristics content, so it could not supply phenotype snippets; phenotype coverage was instead anchored on PMID:20104615 (Carter Centers management cohort) and PMID:16355806 (endocrine cohort, n=117).

    Added in this session: top-level references with the GeneReviews tag; mondo_mappings (skos:exactMatch MONDO:0007733 plus skos:closeMatch for the two absorbed entities already named in notes); prevalence restructured off the deprecated "percentage" field into two structured, evidenced records (1 in 250 conceptions; 1 in 10,000 live births); 2 new genetic entries (GAS1 modifier interaction, oligogenic background variation); evidence on the 3 previously unevidenced subtypes; 13 new phenotypes (alobar/semilobar/lobar HPE, global developmental delay, hydrocephalus, feeding difficulties, cyclopia, proboscis, pyriform aperture stenosis, central diabetes insipidus, central hypothyroidism, central adrenal insufficiency, secondary growth hormone deficiency) with cohort-quantified FrequencyEnum bands where the source gives a percentage; evidence backfilled on the 4 previously unevidenced phenotypes; 2 new pathophysiology nodes (Hypothalamic Non-Separation, Central Diabetes Insipidus); biological_scale tags on the scale-unambiguous nodes; evidence on all 4 previously bare downstream causal edges plus the 2 new ones; and new environmental, progression, diagnosis, treatments (6) and clinical_trials (2) sections. From the openscientist pass, SHH-genotyped genotype-phenotype data was added to the genetic and inheritance sections (SHH variants yield non-HPE microforms in 64% vs frank HPE 36%; truncating variants 49% vs non-truncating 35% frank HPE; SHH variants inherited in >70% of cases), plus the counselling-critical finding that mutation-positive microform HPE can present with above-average intellect.

    Also fixed the entry name from the underscored "SHH_Holoprosencephaly_Spectrum" to the conventional "SHH Holoprosencephaly Spectrum"; nothing in kb/ or projects/ referenced the old value.

    A scope caveat was added to notes: the prevalence records, survival statistics and complication frequencies derive from all-cause holoprosencephaly cohorts, not SHH-genotyped cohorts, and should not be read as SHH-specific rates.

    Validation: "just validate" passes (schema + term + reference validation). An independent script confirmed all 94 evidence snippets (24 distinct references) are exact whitespace-normalized substrings of their cached references and that every downstream, target_mechanisms and subtype foreign key resolves. The scoped pytest selection (graph, subtype, uniqueness: 3340 tests) passes. Compliance rose from 79.4% global / 80.0% weighted to 99.5% global / 100.0% weighted; only "datasets" remains unfilled, as no applicable dataset exists for this disorder.

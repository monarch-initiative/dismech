  summary: Address PR review findings for Arthrochalasia EDS
  details: |
    Addressed the outstanding findings from ai4c-reviewer round 3 (PR #11899) on Arthrochalasia_Ehlers-Danlos_Syndrome.yaml. (1) Fixed the Bruising Susceptibility claim-snippet mismatch: removed the PMID:10073586 evidence item (which supported general skin hyperelasticity/texture, not bruising specifically, and whose explanation incorrectly called it 'GeneReviews-adjacent' -- check-genereviews confirms NO_CHAPTER exists for aEDS) and added a quantitative table-row snippet from PMID:21801164 (4/7 haematomas in this case series vs 8/16 in the prior literature). (2) Added target_mechanisms to Hip Surgical Management (target: Joint Capsule and Ligament Laxity) and Bisphosphonate Therapy (target: Skeletal Fragility); Genetic Counseling left without one per established KB precedent. (3) Added the four missing >10%-frequency phenotypes the review named, all sourced from PMID:21801164's Table 1 comparison-to-literature or case narratives: Short Stature (HP:0004322, 4/7 series vs 2/6 literature), Blue Sclerae (HP:0000592, narrative), Clubfoot (HP:0001762, narrative), and Umbilical Hernia (HP:0001537, narrative); also added the quantitative scoliosis table row to the existing Kyphoscoliosis phenotype. (4) Added a disease-level clinical_burden block (burden_level: HIGH) citing the cohort's 4/12 wheelchair-bound/unable-to-walk-unaided figure the review asked for. (5) Wired all four new phenotypes into the pathograph (Joint Capsule and Ligament Laxity -> Clubfoot; Skeletal Fragility -> Short Stature; Loss of Connective Tissue Tensile Strength -> Umbilical Hernia, Blue Sclerae) and, while auditing for orphans, also fixed four pre-existing orphaned craniofacial/ectodermal phenotypes (Hypertelorism, Epicanthal Folds, Micrognathia, Sparse Hair) not previously flagged by the reviewer, via a new honestly-hedged 'Craniofacial and Ectodermal Dysmorphic Features' node (causal_link_type: UNKNOWN) since the cited sources report these as recognizable diagnostic clues without stating a mechanism linking them to the COL1A1/COL1A2 exon-6-skipping defect. Validated: just validate (49/49 snippets), just validate-disorders (batched with kEDS, 161/161), check-causal-targets, check-entity-refs, check-qualifier-terms, check-duplicate-keys, check-genereviews, and a manual zero-orphan-phenotype audit.

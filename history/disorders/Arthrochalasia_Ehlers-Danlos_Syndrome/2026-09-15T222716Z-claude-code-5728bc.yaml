  summary: 'Create: Arthrochalasia Ehlers-Danlos Syndrome'
  details: |
    New entry for arthrochalasia Ehlers-Danlos syndrome (aEDS, formerly EDS VIIA/B), anchored on MONDO:0007525 (Ehlers-Danlos syndrome, arthrochalasia type), which unlike the recently-curated kyphoscoliotic EDS is a genuine non-obsolete umbrella MONDO term. Two gene-specific has_subtypes entries are anchored on their own MONDO terms: Arthrochalasia Type 1 (COL1A1, MONDO:0020521) and Arthrochalasia Type 2 (COL1A2, MONDO:0040501), following the same pattern used for Musculocontractural_Ehlers-Danlos_Syndrome.yaml and the newly-created Kyphoscoliotic_Ehlers-Danlos_Syndrome.yaml. No GeneReviews chapter exists for this subtype specifically (confirmed via PubMed genereviews[book] search and just check-genereviews --online, both NO_CHAPTER); this is noted in the entry's notes: field, no action needed. Primary literature was fetched directly via PubMed search rather than relying solely on deep research, since a GeneReviews baseline was unavailable: PMID:32091183 (Ayoub et al. 2020, 12-patient clinical/molecular/management cohort -- the richest single source, establishing the core phenotype, genotype-phenotype COL1A1-vs-COL1A2 severity debate, and management data including fracture/bisphosphonate/surgery statistics), PMID:21801164 (Klaassens et al. 2012, full-text phenotype-expansion case series with electron-microscopy fibril morphology data and differential-diagnosis discussion), PMID:10073586 (Giunta et al. 1999, foundational clinical/molecular review establishing COL1A2 type VIIB mechanism and hip-surgery outcomes), and four classic 1986-1994 molecular papers establishing the exon-6-skipping/N-propeptide-retention mechanism for each gene (PMID:3082886 COL1A1, PMID:1990839 and PMID:1556139 COL1A2 splice mutations, PMID:8081389 further COL1A2 confirmation). The pathophysiology chain models two parallel gene-specific upstream nodes (COL1A1 Exon 6 Skipping Variant, COL1A2 Exon 6 Skipping Variant; genetic_context functional_impact_category DOMINANT_NEGATIVE, since only ~half of secreted chains are affected in the heterozygous state yet still produce disease, consistent with poisoning of the heterotrimer) converging on a shared 'Loss of Procollagen N-Proteinase Cleavage Site' node, then 'Retained Procollagen N-Propeptide' and 'Aberrant Collagen Fibril Assembly', explicitly noting in the node description how the resulting irregular-diameter/reduced-density fibril morphology differs from dermatosparaxis EDS's flattened 'hieroglyphic' ribbon morphology (dermatosparaxis is ADAMTS2 enzyme loss, biallelic; arthrochalasia is substrate mutation, heterozygous) -- an explicit cross-reference to the existing Dermatosparaxis_Ehlers-Danlos_Syndrome.yaml entry's terminal node naming convention, though the two entries do not share nodes (per the 'not DRY' module convention, this is not a conforms_to relationship since no module exists for this mechanism). Downstream tissue-level nodes branch to joint-capsule/ligament laxity (congenital hip dislocation, generalized joint hypermobility, recurrent dislocation, and an inferential/uncited link to hypotonia), skin fragility, and skeletal fragility (recurrent fractures, well-supported by the 9/12-patient cohort statistic). A diagnosis: block covers the differential-diagnosis boundary against Larsen syndrome and dermatosparaxis EDS. Deep research (falcon, with just dr_fallback='--fallback' since no EDISON_API_KEY/FUTUREHOUSE_API_KEY is configured in this environment) was launched in the background; this history record and commit reflect validated content built from independently-sourced primary literature and will be revised/re-validated once the deep-research report completes and is cross-checked for content gaps, following the same red-team review process used for the Kyphoscoliotic_Ehlers-Danlos_Syndrome.yaml entry earlier in this session. Validated so far with: just validate (schema/term/reference, 32/32 snippets verified), just check-entity-refs, just check-causal-targets (0 new dangling targets), just check-duplicate-keys, just check-enum-values, just check-qualifier-terms, just list-gene-term-mismatches (0 mismatches across 6 gene bindings), and just check-genereviews --online (NO_CHAPTER, confirming the notes: field claim). just validate-disorders (the CI-authoritative batched gate) has not yet been run for this file and will be run before this is considered final. Compliance (just compliance): 80.8% global / 81.2% weighted. datasets: left empty -- no GEO/other accession search was performed for this entry.

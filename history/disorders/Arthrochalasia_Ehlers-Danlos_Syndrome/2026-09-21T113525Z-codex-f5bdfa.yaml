  details: |
    Reviewed the entire entry and matching deep-research artifacts against all original available abstracts and cached full bodies. Rebuilt eight atomic collagen-processing and tissue events, separating substrate cleavage-site loss from enzyme deficiency and preserving the partial-deletion crosslink lysine. Added three patient-derived models with assay and specimen limits. Expanded clinical coverage to 39 findings, retaining selected-cohort, overlapping-family and contradictory table limits without unsupported frequency bands. Added molecular diagnosis and twelve supportive-care records, including individual brace/surgical outcomes, cardiac case findings, pregnancy planning and family counseling. Kept the new recessive exon31 COL1A1 arthrochalasia-like report as a boundary discussion without merging its untested mechanism into classic dominant aEDS. Read the complete relevant 2017 classification/rare-types sections, full 2012 and 2024/2025 primary cases, full fracture and vascular systematic studies and the 2026 overlap report; the 2020 cohort remains abstract-only after unsuccessful recovery. Corrected the mutation-negative-mother quote, neonatal-death overstatement, fracture-review mischaracterization and surgical-outcome omissions. Independent source and integration reviews found no material residual mechanism or care issue. Authoritative validation passes schema, live ontology and 188/188 exact excerpts. All 21 integrity guards and 2,189 whole-KB node-class examples pass. Generated caches were not hand-edited and the frozen accession cache was not accessed.

  details: |
    Addressed the blocking finding on PR #11542: the PFBMFT8/POT1 precedent is a has_subtypes row plus a matching genetic: record keyed by subtype, and only the has_subtypes half had been copied. Added an ACD-DKCA6 genetic record after the gene-level ACD record, with gene_term hgnc:25070, relationship_type CAUSATIVE, variant_origin GERMLINE, autosomal dominant inheritance only, subtype: DKCA6, and notes recording the p.Lys170del TEL-patch allele and the telomerase-recruitment-versus-telomere-binding distinction. It reuses the three PMID:25205116 snippets already verified in this branch with unchanged grading. Also took two of the three non-blocking suggestions: children: [DKCA6] on the gene-level ACD has_subtypes row, and a review_notes line on the DKCA6 row recording that the row was deliberately scoped to the dominant designation despite the stub listing an autosomal-recessive-7 synonym. Declined the third: MONDO:0100569 ACD-related short telomere syndrome spans dyskeratosis congenita, Hoyeraal-Hreidarsson syndrome, aplastic anaemia and pulmonary fibrosis, so it is broader than a has_subtypes row whose description is scoped to DC, and binding it there would over-claim. Revalidated: just validate, validate-terms, count-verified-snippets 97/97, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, validate-disorders.

  details: |
    Resolved MONDO:0014690 as OMIM:616553 DKCA6, the autosomal dominant ACD/TPP1 telomere biology disorder, from the MONDO cross-references (OMIM:616553, MEDGEN:904824) and the MONDO textual definition naming ACD at 16q22.1. Decided SUBTYPE rather than a standalone entry: Dyskeratosis_Congenita.yaml is this repository's telomere biology disorder home and already carries a gene-level ACD row. Added a DKCA6 row bound to MONDO:0014690 following the PFBMFT8/POT1 precedent from #10994, describing the p.Lys170del TEL-patch allele from Guo et al. 2014 (PMID:25205116), and added one clause to the existing ACD row pointing at it so the two rows do not read as duplicates. No new mechanism nodes or phenotypes; the row carries four evidence items, three from PMID:25205116 and one reusing the GeneReviews inheritance line already cited elsewhere in the file. Validated with just validate, validate-terms, count-verified-snippets (94/94), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens and validate-disorders.

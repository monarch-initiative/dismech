  summary: Bind MONDO:0013520 (DKCB3) to the WRAP53 subtype row
  details: |
    Curation outcome for MONDO:0013520 (dyskeratosis congenita, autosomal recessive 3; DKCB3, WRAP53/TCAB1, OMIM 613988) is SUBTYPE on the existing kb/disorders/Dyskeratosis_Congenita.yaml entry, bound to the gene-level 'WRAP53' has_subtypes row. The issue flagged that precedent in this entry is mixed, so the decision was made against the two patterns already present rather than by copying either. Dyskeratosis_Congenita_Autosomal_Recessive_8 exists as a standalone file because its own entry text argues its mechanism runs through nucleotide metabolism (TYMS/ENOSF1, thymidylate synthase deficiency) rather than through the telomere - a genuinely different pathograph. DKCB3 is the opposite case: WRAP53/TCAB1 traffics telomerase to Cajal bodies, so the lesion is a telomerase-delivery defect sitting on the same telomere-maintenance pathway as the rest of the entry. The second pattern in the entry is a separate numbered row beside a gene-level row - DKCA6 (MONDO:0014690) beside ACD, and PFBMFT8 beside POT1 - but that pattern exists because those genes cause both dominant and recessive disease and the numbered designation names only one half. WRAP53 DC is recessive throughout, so the gene-level row and DKCB3 cover the same patients and a second row would be redundant. Recorded that reasoning in the row's review_notes. Enrichment: bound subtype_term MONDO:0013520 (canonical label confirmed via the EBI OLS4 record, whose xrefs carry OMIM:613988 and whose definition names an autosomal recessive WRAP53 mutation), rewrote display_name and description, and added four evidence items - two from the defining report PMID:21205863 (patient identification graded HUMAN_CLINICAL; the Cajal-body mislocalization result graded IN_VITRO, because it is a cell-based localization experiment) and two from PMID:29514627 (recessive segregation in a consanguineous Han Chinese family homozygous for p.Arg298Trp, and the proband's sub-first-percentile lymphocyte telomere length). Hedged the carrier claim: the paper records that the three heterozygous relatives had no mucocutaneous symptoms and normal blood counts but were not examined by marrow biopsy or pulmonary function testing, so the description says unaffected on clinical grounds rather than asymptomatic. Deleted stubs/Dyskeratosis_Congenita_Autosomal_Recessive_3.yaml, safe because the identifier is now bound. No telomere grouping was created; one was declined earlier as over-broad. Validation: just validate (103/103 snippets verified; references are PMID and ORPHA only, so nothing was skipped by prefix), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values, check-stubs, validate-disorders, and whole-KB check-title-snippets, check-snippet-length, check-snippet-grading.

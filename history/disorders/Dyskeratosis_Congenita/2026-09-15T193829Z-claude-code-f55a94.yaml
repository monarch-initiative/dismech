  summary: 'Review: connect DC''s nine orphan phenotypes including the mucocutaneous
    triad (IUIS Table 9)'
  details: |
    Nine of twelve phenotypes had no incoming edge, including all three components of the classic diagnostic triad.

    The triad - nail dystrophy, reticular skin pigmentation, oral leukoplakia - now attaches to Stem Cell Exhaustion in High-Turnover Tissues, which is the node literally named for the mechanism that produces them; nail bed, skin and oral mucosa are three renewing epithelia failing the same way the marrow does. Marrow hypocellularity and immunodeficiency attach there too, the latter because lymphocytes are among the most proliferative cells in the body and the cited review groups immune cells with haematopoiesis as telomere-reserve-dependent.

    The two malignancy predispositions attach one node earlier, to Critically Short Telomeres and Replicative Senescence, and the reason is the substantive part: the route to cancer is genomic instability from chromosome-end dysfunction, not loss of stem-cell output. The two consequences of short telomeres diverge at that node - exhaustion gives the marrow failure, instability gives the clonal evolution - and attaching the cancers downstream of exhaustion would assert the wrong mechanism.

    The two severe-variant features, Hoyeraal-Hreidarsson cerebellar hypoplasia and Revesz exudative retinopathy, also attach to the telomere node rather than to tissue exhaustion, because neither cerebellum nor retina is a high-turnover tissue and the developmental route is unestablished. 105/105 snippets verify.

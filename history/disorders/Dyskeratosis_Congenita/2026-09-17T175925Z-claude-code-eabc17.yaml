  summary: Bind MONDO:0013522 (DKCA3) to the TINF2 subtype row
  details: |
    MONDO:0013522 (dyskeratosis congenita, autosomal dominant 3) resolves to SUBTYPE on this entry, bound as the subtype_term of the existing gene-level TINF2 row. The criterion this entry already uses for whether a numbered designation earns its own row beside the gene-level row is whether the gene causes both dominant and recessive disease: DKCA6 (ACD) and PFBMFT8 (POT1) are separate rows because those genes cause both, so the numbered designation names only half of what the gene-level row covers. TINF2 does not. ClinGen's Interstitial Lung Disease expert panel records the mode of inheritance for this gene-disease relationship as AD, and a targeted PubMed search for biallelic, homozygous or compound-heterozygous TINF2 disease returns ten records, none of which is a recessive TINF2 entity. The gene-level row and DKCA3 therefore cover the same patients, which is the same reasoning applied to DKCB3 on the WRAP53 row in PR 11992. Also records, in review_notes, that ClinGen draws the entity boundary wider than dismech does - it lumps DKCA3, Revesz syndrome, Hoyeraal-Hreidarsson syndrome and pulmonary fibrosis into one TINF2-related short telomere syndrome - and that dismech's standalone Revesz_Syndrome entry is deliberately not revisited by this change. Adds six evidence items: three ClinGen assertion rows and three from the founding 2008 TINF2 report. The stub is deleted, now safe because the identifier is bound. Diff is confined to two hunks inside the TINF2 row; seven references_cache files that the batch reference validator rewrote with cosmetic frontmatter churn were reverted. Validated with just validate (116/116 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-folded-hyphens.

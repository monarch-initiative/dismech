  summary: Bind ACD and NOP10 subtypes to MONDO; map five PFBMFT classes; retire nine
    stubs
  details: |
    Follow-up to issue 9866 steps 1-2, on the parts earlier PRs had not already done. The gene-level ACD row now binds MONDO:0800469 (ACD-related telomere biology disorder); its DKCA6 child keeps MONDO:0014690. The NOP10 row binds MONDO:0009136 (DKCB1), whose MONDO definition names NOLA3, the former NOP10 symbol, and cites the founding report PMID:17507419 with two exact quotes; the notes paragraph that said this binding was waiting for a citable source was rewritten. PFBMFT1 (TERT), PFBMFT4 (PARN), PFBMFT5 (ZCCHC8), PFBMFT6 (RPA1) and PFBMFT7 (NAF1) are skos:narrowMatch mappings on the matching gene-level rows, with ClinGen CGGV rows quoted for PARN, ZCCHC8 and NAF1. PFBMFT2 (TERC) was not mapped because the TERC row already binds DKCA1 as its identity. PFBMFT9 (NOP10, AD) was not mapped onto the recessive-only NOP10 row. Nine stubs now covered were deleted. Labels were checked against OLS MONDO and validated with just validate, validate-terms and count-verified-snippets (156/156).

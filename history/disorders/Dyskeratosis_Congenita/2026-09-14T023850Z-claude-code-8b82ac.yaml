  summary: 'Classify: IUIS 2022 Table 9'
  details: |
    Added a classifications block carrying iuis_category: bone marrow failure, backfilled from IUIS 2022 Table 9 (Tangye et al., PMID:35748970). The entry previously had no classifications block at all. Table 9 enters dyskeratosis congenita as fourteen gene rows sharing one Subcategory cell: DKCX1 (DKC1, XL), DKCA1 (TERC), DKCA2 (TERT), DKCA3 (TINF2), DKCA4 (RTEL1), DKCA5 (TINF2), DKCA6 (ACD), DKCB1 (NOLA3), DKCB2 (NOLA2), DKCB3 (WRAP53), DKCB4 (TERT), DKCB5 (RTEL1), DKCB6 (PARN), DKCB7 (ACD). The assignment is made against that block, and the notes say so. Two scope points recorded in the notes rather than left implicit. First, this entry's has_subtypes list is broader than the table: CTC1 and STN1 are curated here but appear in Table 9 under a separate Coats plus syndrome heading, and RPA1, POT1, POLA1, NAF1 and ZCCHC8 are not in Table 9 at all. Second, the DKCA5 row (TINF2, AD, OMIM 268130) is Revesz syndrome, curated as its own dismech entry and carrying the same assignment there. Two evidence items cited to PMID:35748970, graded OTHER, both snippets verified byte-exactly against the cache. Also added as a member of kb/groupings/Bone_Marrow_Failure_IEIs.yaml.

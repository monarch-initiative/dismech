  details: |
    Takes both non-blocking suggestions from the ai4c-reviewer approval on PR 12081. First, the variant series named in the TINF2 row's description - K280E in a proband and five affected relatives, R282H in three further unrelated probands, R282S in a fifth - was carried only as prose; it now has its own evidence item quoting the founding paper. That snippet also contains the founding paper's own link between this row and the standalone Revesz_Syndrome entry, since one of the three R282H probands had Revesz syndrome, which is the observation review_notes discusses when it explains why dismech keeps the two apart where ClinGen does not. Second, quote_role REVIEW_SYNTHESIS is added to the ClinGen snippet attributing the 2008 first report, with the explanation distinguishing it from the lumping snippet two items down, which is ClinGen's own primary product rather than a restatement. Both changes are inside the TINF2 row. Re-validated: just validate (117/117 snippets verified, up from 116), check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-folded-hyphens, and whole-KB check-snippet-grading, check-snippet-length and check-title-snippets. Seven references_cache files rewritten with cosmetic frontmatter churn by the batch reference validator were reverted again.

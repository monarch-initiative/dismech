  summary: 'Genetics pass: digenic TYMS-ENOSF1 and DCLRE1B rows, MONDO identity bindings
    (d2g series-038)'
  details: |
    Genetics pass over the gene-defined MONDO subtypes of dyskeratosis congenita (issue 12245, series-038).

    Anchor check: disease_term MONDO:0015780 verified against OLS; label matches and the class is the disease umbrella this entry models. Its descendants were enumerated in the local MONDO build: 20 classes besides the root, carrying 13 RO:0004003 gene edges across 12 of them (the digenic class carries two).

    The gene set was already complete for the telomerase, shelterin, CST and RNA-processing genes, so most of what this pass closed was MONDO identity rather than genes. DKC1 gained subtype_term MONDO:0010584 plus a broadMatch mapping to MONDO:0100152 and the ClinGen X-linked assertion; TERC gained subtype_term MONDO:0007485 and its ClinGen assertion. Where a row spans both dominant and recessive transmission the numbered single-mode class is recorded as a narrowMatch mapping instead of as the row's identity: TERT (MONDO:0013521) and RTEL1 (MONDO:0014076).

    Two new rows carry genes that were absent from the entry. DKCD is the digenic TYMS-ENOSF1 form, with HP:0010984 digenic inheritance both on the row and as a new disease-level Inheritance block, plus genetic records for TYMS (causative) and ENOSF1 (relationship_type COOPERATING, because the haplotype acts by silencing TYMS). DCLRE1B is Apollo/SNM1B exonuclease deficiency, which was not on the job's list at all; its description and evidence record that patient cells show telomere fragility without global telomere shortening, so the row is an explicit exception to the short-telomere diagnostic criterion the rest of the entry rests on, and lymphocyte telomere length testing will not find it.

    Two new pathophysiology nodes: Thymidylate Synthase Deficiency (TYMS + ENOSF1) feeding the existing Impaired Telomere Maintenance node, and Apollo Exonuclease Deficiency (DCLRE1B) feeding Stem Cell Exhaustion in High-Turnover Tissues directly, bypassing the critically-short-telomere node because the founding report says telomere length is not reduced.

    Neither of those two rows, and no PARN row, binds a subtype_term, and the reasons are in the entry notes. PARN's numbered class MONDO:0014600 is the disease_term of Dyskeratosis_Congenita_Autosomal_Recessive_6. MONDO:0859319, the class for the DCLRE1B disease, is the disease_term of Dyskeratosis_Congenita_Autosomal_Recessive_8 - an entry that accurately describes the digenic TYMS-ENOSF1 disease but is bound to the DCLRE1B identifier, and whose discussion block asserts that MONDO's DCLRE1B gene edge on that class is an error. The identifiers run the other way: MONDO:0859319 maps to OMIM:620133 and MedGen C5774257, whose definition is the Kermasson et al. 2022 Apollo phenotype with unshortened telomeres and whose OMIM gene number 609683 is DCLRE1B in NCBI Gene; MONDO:0031057 maps to OMIM:620040 and MedGen C5774217, whose definition is the Tummala et al. 2022 entity with the 5-FU reactions and whose OMIM gene number 188350 is TYMS. Correcting that entry is left to a maintainer, so this pass binds neither identifier rather than creating a second conflicting use.

    NOP10 was also left without a MONDO binding, for an unrelated reason: the committed ClinGen snapshot curates NOP10 only against MONDO:0957294 (Limited) and the GeneReviews abstract names the gene without the numbered designation, so there is no citable source for the DKCB1 equivalence.

    Known pre-existing failure, not introduced here: under linkml-reference-validator 0.3.0rc1 the two classifications-block snippets citing PMID:35748970 fail, because the validator re-fetches the committed 5,644-line full_text_pdf cache and gets a 175-line XML body without the IUIS tables. Reproduced on the unmodified HEAD version of this file, so it is the dismech#12672 / #12703 cache-downgrade class. The committed cache was restored with git checkout and both quotes are verbatim in it. Nothing was deleted or reworded.

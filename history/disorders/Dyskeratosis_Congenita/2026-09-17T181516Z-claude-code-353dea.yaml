  summary: Add PFBMFT3 (RTEL1) subtype row (MONDO:0014613)
  details: |
    MONDO:0014613 (pulmonary fibrosis and/or bone marrow failure, Telomere-related, 3) resolves to SUBTYPE on this entry, added as a NEW numbered has_subtypes row beside the existing gene-level RTEL1 row rather than folded into it. The criterion this entry uses is whether the gene causes both dominant and recessive disease; where it does, the numbered designation names only half of what the gene-level row covers. RTEL1 is unambiguously in that group: the gene-level row already records both modes with GeneReviews evidence, and ClinGen classifies the RTEL1 gene-disease relationship as SD, semidominant, explicitly lumping an autosomal dominant DC4 / autosomal recessive DC5 entity (OMIM:615190) with this one (OMIM:616373). PFBMFT3 names the dominant, adult, lung-led half. This is the same call made for PFBMFT8 (POT1) in PR 10994 and the opposite of the call made for DKCA3 (TINF2) in the sibling PR, and the two differ only on this criterion. Also adds a second genetic record keyed to the PFBMFT3 subtype, mirroring POT1-PFBMFT8, recording the heterozygous zygosity, adult onset and incomplete penetrance specific to this route. Seven evidence items across three sources: the ClinGen assertion, the Cogan 2015 familial interstitial pneumonia series (nine of 188 kindreds, short telomeres in unaffected carriers, increased T-circle formation) and the Stuart 2015 case-control burden replication. The preflight question about Bone_Marrow_Failure_Syndrome_6 was checked and answered: BMFS6 is an MDM4 entity and its RTEL1 mention is prose. The stub is deleted, now safe because the identifier is bound. Diff is two pure insertions, one after the RTEL1 subtype row and one after the RTEL1 genetic record, so no other curator's content is modified; seven references_cache files rewritten with cosmetic frontmatter churn by the batch reference validator were reverted. Validated with just validate (120/120 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-folded-hyphens.

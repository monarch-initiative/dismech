  summary: Add PFBMFT8 (POT1) subtype and Pot1a L261S mouse model
  details: |
    Resolved curation claim #10986 (pulmonary fibrosis and/or bone marrow failure syndrome, telomere-related, 8; MONDO:0957263) as a SUBTYPE of the existing Dyskeratosis congenita entry rather than a standalone disorder file or a new telomere-syndrome grouping. Identity: MONDO:0957263 xrefs OMIM:620367, and NCBI mim2gene_medgen maps MIM 620367 to GeneID 25913 (POT1); the defining publication is Kelich et al. 2022 (PMID:35420632), a Dutch family with heterozygous POT1 p.(L259S), short leukocyte telomeres, genetic anticipation and dominantly segregating IPF. Placement rationale: the Dyskeratosis congenita entry is already this repository's telomere-biology-disorder home and already carries per-gene subtypes for other members of the numbered PFBMFT series (PARN, NAF1, ZCCHC8), so an eighth locus belongs there. It was added as a NEW subtype rather than folded into the existing recessive POT1 subtype, because the allele, zygosity, inheritance mode, age of onset and lead organ all differ. Added: has_subtypes entry 'PFBMFT8' binding MONDO:0957263 with three cited evidence items; a second genetic record 'POT1-PFBMFT8' keyed to that subtype with autosomal dominant inheritance (the dominant-negative behaviour is recorded in notes because the Genetic class has no functional_impact_category slot); and a new animal_models section holding the Pot1a L261S knock-in mouse (PMID:40954016) with two modeled_mechanisms links - RECAPITULATES against Impaired Telomere Maintenance with a Q-FISH telomere-length readout, and PARTIALLY_RECAPITULATES against Pulmonary fibrosis with an increased-myofibroblast readout and an UNCHANGED Masson trichrome collagen readout that is the negative result capping the link. No new phenotypes were added: the Pulmonary fibrosis phenotype already existed and is already wired downstream of Stem Cell Exhaustion in High-Turnover Tissues. Seven tracked references_cache files that the batch reference validator silently upgraded from abstract-only to full text were reverted so the PR carries only the two new caches it cites. Validation: just validate, validate-terms, count-verified-snippets (90/90, no prefix skips), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders, check-stubs all pass. Stub deleted because the MONDO ID is now bound in kb/.

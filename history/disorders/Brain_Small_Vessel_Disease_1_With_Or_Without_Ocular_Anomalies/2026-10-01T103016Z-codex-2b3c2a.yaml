  summary: Review COL4A1 mechanisms, clinical evidence and experimental treatments
    against cached full text
  details: |
    Reviewed the complete existing entry, prior history and claude_code research report. Mined GeneReviews clinical, diagnostic, management and counseling sections and the 2025 consensus full text. Corrected penetrance and selected-cohort frequency interpretations, phenotype bindings, clinical source classifications and delivery/antithrombotic guidance. Rebuilt the causal graph to distinguish secretion, ER stress, extracellular matrix, developmental vascular, TGF-beta, NOTCH3, smooth-muscle, PIP2/calcium/TRPM4, MMP/barrier and renal mechanisms, with variant, tissue and model limitations. Added current clinical findings, preclinical benefit and harm, observational registries, animal and patient-derived models. Full-text chaperone evidence separates histology from MRI response and documents genotype-dependent muscle harm; variant-complementation evidence retains partial mutant rescue. No schema or disease-scope change. Facial paresis from the research report was not added without verified disease-specific clinical support; generic model and omics leads without a central missing claim remain non-blocking. Generated reference caches were used throughout, with abstract-only limits retained where full-text retrieval failed.

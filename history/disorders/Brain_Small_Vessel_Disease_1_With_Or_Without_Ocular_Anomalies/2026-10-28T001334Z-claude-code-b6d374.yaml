  summary: Evidence-claim mismatch review (#15756)
  details: |
    Reviewed the 19 active claims Jev labelled MISMATCH at the whole-claim level in the
    saved dismech-evals assessment (source revision 19a31ae, unchanged since), reading each
    cited passage in references_cache.

    Changed:
    - Renal tubular cell loss (ER-stress edge, Raw/Svc model link, node): the cleaved-caspase
      fragment named an apoptotic marker without tying it to tubules or ER stress. Replaced
      with the PMID:26839400 sentence assigning tubular disease to ER-stress-induced apoptosis.
    - ER stress node: replaced the "medullary atrophy" fragment with the Bip-then-CHOP sentence
      from PMID:26839400, which names the Col4a1 Raw mice.
    - Skeletal muscle basement-membrane node and its inbound edge: extended the PMID:31051113
      fragment to the full sentence and added the sentence attributing G394V 4PBA myopathy to
      a qualitative extracellular insult, which is what the node and edge descriptions assert.
    - Intracellular-vs-extracellular knowledge gap: replaced the fragment with the sentence
      stating the opposite 4PBA effects in the Delta-ex41 and G394V alleles.
    - FN1 candidate modifier: the first snippet now names FN1 as the candidate suppressor at
      MoGS1; the "no effect on ICH" fragment (REFUTE) became the full MoGS1 sentence (SUPPORT),
      which supports the claim's own scoping to ocular dysgenesis and myopathy.
    - NOTCH3 node: full sentence naming Col4a1 G498V for the 7/11 target-gene result, plus the
      sentence placing target-gene activation in microvessels rather than arteries.
    - Abnormal extracellular network -> TGF-beta edge: carried only a NO_EVIDENCE item. Added the
      PMID:35525525 hypothesis (collagen IV deficiency raising TGF-beta bioavailability) as
      SUPPORT, INDIRECT.
    - Renal basement-membrane node, hematuria and cyst edges: added the GeneReviews (NBK7046)
      sentence locating BM thickening to tubules, Bowman's capsule and interstitial capillaries
      in HANAC individuals with hematuria; the node description already said this without a
      source. Cyst-edge fragment extended to the full sentence.
    - Sodium phenylbutyrate and extracellular-network evidence: PMID:30351356 and PMID:35525525
      fragments extended to full sentences that state the limitation being cited.
    - Intellectual disability: description no longer claims correlation with hemorrhage extent,
      which no cited source states.
    - Muscle cramps: added the GeneReviews sentence that cramps are seen in all individuals
      with HANAC syndrome, and replaced the unsourced "early onset" wording with the GeneReviews
      statement that first episodes occur before age three years in HANAC families, cited as its
      own evidence item.

    Retained without change: the beta-blocker treatment (the GeneReviews sentence is an exact,
    direct recommendation), the cramp-mechanism edge (already graded INDIRECT with an
    explanation saying the mechanism is inferred), and the PARTIAL-level clinical-trial and
    PMID:23065703 discussion items.

    Validation: just validate (schema, terms, references) passes; 192/192 snippets verified;
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values,

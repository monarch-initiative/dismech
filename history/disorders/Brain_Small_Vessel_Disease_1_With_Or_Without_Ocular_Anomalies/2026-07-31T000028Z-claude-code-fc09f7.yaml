  details: |
    Created the COL4A1-related brain small vessel disease entry MONDO:0008289 BSVD1. Deep research: falcon/Edison and OpenScientist providers were unavailable so a claude_code deep-research report was used and cross-checked against primary literature. Phenotype baseline anchored on the COL4A1-Related Disorders GeneReviews chapter PMID:20301768 tagged GeneReviews plus 14 primary references including Gould Science 2005 PMID:15905400, Gould NEJM 2006 PMID:16598045, Plaisier HANAC NEJM 2007 PMID:18160688, Meuwissen Genet Med 2015 PMID:25719457, Jeanne AJHG 2012 PMID:22209247, Murray HMG 2014 PMID:24001601, Mao DMM 2017 PMID:28237965, Sibon Ann Neurol 2007 PMID:17696175, Lanfranconi Markus Stroke 2010 PMID:20558831, Kuo Gould HMG 2012 PMID:22914737, Jeanne Circulation 2015 PMID:25753534, Colin J Perinatol 2014 PMID:24374867. Modeled the collagen IV heterotrimer secretion and ER-stress dual mechanism, cerebral small-vessel fragility, ocular anterior-segment dysgenesis, and HANAC renal and muscular arm, with frequencies derived from the 52-carrier systematic review. All 71 evidence snippets verified as exact substrings of cached abstracts; just validate, validate-terms and check-reference-cache-frontmatter pass; compliance 98.8 percent.

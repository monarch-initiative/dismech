  summary: 'Create: Vulvodynia'
  details: |
    New disease entry for vulvodynia (MONDO:0021722), created from the coverage gap tracked in issue #7837, which has listed vulvodynia as absent since 2026-08-24. No stub existed for the term and no claim issue was open; the only prior mention of the concept in kb/ was an HP:0030943 phenotype binding inside Vulvar_Carcinoma describing vulvar pain as a cancer symptom. Nine pathophysiology nodes model the best-evidenced chain: antecedent vulvovaginal inflammatory exposure, site-restricted vestibular fibroblast Dectin-1/NF-kB hyperresponsiveness with IL-6 and PGE2 output, vestibular mucosal immune activation (B-cell infiltration and germinal centres), neuroproliferation, TRPV1-enriched nociceptor sensitization, vestibular allodynia, pelvic floor muscle hypertonicity, central pain amplification, and a hypothetical androgen-receptor node carrying the contraceptive gene-by-environment hypothesis. Two susceptibility genes (IL1RN, AR), one environmental exposure linked into the pathograph, five treatments, three differential diagnoses, two diagnosis records and three discussions (one CONTROVERSY, one KNOWLEDGE_GAP, one OPEN_QUESTION). Three claims carry recorded contradiction rather than a selected winner: mast cell involvement (SUPPORT plus REFUTE on one node from two case-control studies), topical lidocaine and oral desipramine (REFUTE on the randomized primary endpoint, SUPPORT for desipramine on the one secondary endpoint that separated), and the free-testosterone measurement in the androgen-receptor study, which runs opposite to the hypothesis it was offered to support. No conforms_to declared: nociceptor_sodium_channel_excitability is scoped to Mendelian sodium channelopathies and the one study that looked found Nav1.8 fibres scarce in cases and controls alike. Validation: just validate passes with 47/47 snippets verified; just validate-terms passes; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-enum-values all clean. Nineteen references fetched and committed. Ontology gaps recorded in notes: no UBERON vulvar vestibule term, no ECTO combined-hormonal-contraceptive exposure term, and a single undifferentiated HP vulvodynia term.

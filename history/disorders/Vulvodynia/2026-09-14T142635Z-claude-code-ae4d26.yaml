  summary: 'Address review of PR #11785: pathograph connectivity, comorbidity record,
    two missing treatments'
  details: |
    Review round on the initial Vulvodynia entry, answering the three blocking findings on PR #11785 plus the non-blocking treatment gap.

    Pathograph connectivity. Four of the six phenotypes had zero edges. Connected all four: Vestibular Allodynia -> Provoked Vestibular Pain (DIRECT); Nociceptor Sensitization in the Vestibular Epithelium -> Vulvar Burning Pain (INDIRECT_UNKNOWN_INTERMEDIATES, carrying the VR1 hypothesis sentence from PMID:14987622 as its own evidence, since TRPV1 is what would explain the burning quality and the component present outside contact); and Central Pain Amplification -> Anxiety and -> Depression (both INDIRECT_UNKNOWN_INTERMEDIATES). All targets are bare names, not the <kind>#<name> grammar. Also bound AR on the Androgen Receptor Signalling Insufficiency node so the AR genetic node reaches the graph. IL1RN is left unconnected on purpose: the entry frames its relation to the inflammatory nodes as mechanistic coherence rather than as evidence, and binding it to the Dectin-1/NF-kB node would assert more than the source supports.

    Co-occurring conditions. Recorded as an epidemiology entry rather than a comorbidities section, because Disease has no comorbidities slot; a two-disease association with its own statistics would be a separate kb/comorbidities/ file. Cites PMID:24807511 twice (the co-occurring pain conditions sentence and the 25% bladder-pain-syndrome figure, as separate items because they are separate claims) plus PMID:32355269 for the general clustering statement. Recorded why it is distinct from differential_diagnoses.

    Treatments. Added Oral Gabapentin from the 2018 placebo-controlled crossover RCT (PMID:29742655, newly fetched), with the neuropathic rationale as SUPPORT/INDIRECT and the negative conclusion as REFUTE/DIRECT. Added Electromyography-Guided Botulinum Toxin A Injection from the 2026 placebo-controlled RCT (PMID:41419152, newly fetched) against the Pelvic Floor Muscle Hypertonicity node - the entry's only positive placebo-controlled result, and it acts on the muscular arm rather than the mucosal one. Extended the negative_trial_base discussion to cover gabapentin and to note that contrast, and corrected the entry description, which claimed two drugs had failed against placebo.

    Direction of the psychiatric edges. Added a psychological_factor_direction OPEN_QUESTION discussion. The only source names anxiety and depression among the factors in onset and maintenance together, so it does not separate cause from consequence; the discussion records that drawing them as consequences is a modelling decision following this knowledge base's convention, not a finding.

    Not done. No deep-research artifact was produced - no DR provider is reachable from this environment. The other non-blocking suggestions (amitriptyline, topical hormones, MBL2/MC1R, has_subtypes) are not addressed here.

    Validation. Schema, terms and references all pass with 56/56 snippets verified. check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-environmental-evidence and check-term-cache-integrity are all clean. The pathograph now has 26 edges, no orphan targets, and no isolated node other than the IL1RN genetic node.

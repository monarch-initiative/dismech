  summary: 'Re-review: ADan amyloidosis evidence boundaries'
  details: |
    Re-reviewed the full ADan amyloidosis entry against primary human,
    animal-model, and in-vitro evidence. Rebuilt the pathophysiology around the
    amyloidogenesis module while separating canonical ADan production and
    accumulation from descriptive Aβ co-deposition, unresolved tau pathology,
    BRI2-loss/APP-metabolite hypotheses, glutamatergic model findings, the
    proposed rat vascular-leak/cerebellar-injury sequence, and acute synthetic
    ADan cell toxicity. Added explicit hypothesis groups, evidence on every
    causal edge, model genotypes, evidence-source corrections, and four open
    interpretation or human-model-mismatch discussions.

    Refined the natural history and phenotype terms, removed unsupported
    frequency bands and the unsourced rarity claim, added controlled germline
    causal genetics, narrowed diagnosis claims to what the cited studies show,
    classified management actions as counseling or therapeutic while retaining
    PARTIAL support for natural-history-derived care, and bound familial British
    dementia to MONDO:0008306 (ABri amyloidosis). Pruned duplicate or unused
    catalog references and added five primary-source reference caches using the
    repository fetch workflow.

    Validation completed at this stage included schema validation, ontology-term
    validation with a one-term maintained MONDO enum refresh, graph integrity
    (31 nodes, 29 edges, no orphan targets or integrity issues), and compliance
    scoring (93.5%, increased from the 82.1% baseline). Exact normalized snippet
    checks, targeted data tests, and final history validation were run before
    publication.

  summary: 'Comprehensive curation review of Ellis-van Creveld Syndrome (MONDO:0009162) for #3390: wired
    EVC and EVC2 into ciliary Hedgehog pathophysiology with GO molecular functions, removed deprecated
    percentage fields, and added progression and differential diagnoses.'
  details: >-
    Reviewed Ellis-van_Creveld_Syndrome.yaml against PMID:37903214 (GeneReviews) and
    PMID:17547743. Wired EVC and EVC2 genetic entries into Primary Cilium Dysfunction with
    GO molecular function bindings (GO:0005102, GO:0005515) and connected Primary Cilium
    Dysfunction -> Hedgehog Signaling Disruption -> Cardiac Septation Defect. Removed
    deprecated percentage slots from prevalence, added Harrison's chapter and ciliopathy
    mechanistic classifications, added echocardiography/prenatal ultrasound to diagnosis,
    replaced NO_EVIDENCE on Cardiac Surgery with SUPPORT from PMID:37903214, added
    progression and differential diagnoses (Weyers acrodental dysostosis, Jeune syndrome,
    McKusick-Kaufman syndrome, cranioectodermal dysplasia), and populated reference
    findings.

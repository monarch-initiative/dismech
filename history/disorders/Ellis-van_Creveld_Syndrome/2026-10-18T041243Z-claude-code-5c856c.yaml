  summary: 'Address review on PR 14699: HGNC bindings, sourced MF, GeneReviews inheritance/management,
    genetic heterogeneity'
  details: |
    Bound EVC (hgnc:3497) and EVC2 (hgnc:19747) on the genetic rows and on the Primary Cilium Dysfunction node, verified against the HGNC REST API, and dropped the legacy association field. Replaced the protein binding and signaling receptor binding molecular functions with smoothened binding (GO:0005119), backed by the Smo co-precipitation sentence from PMID:23026747, and replaced cilium assembly with protein localization to cilium (GO:0061512, DECREASED) plus ciliary base (GO:0097546), since EVC/EVC2-deficient cells still form cilia. Cut the node description back to the EvC-zone localization defect and removed the unsupported retrograde-IFT sentence. Added GeneReviews (PMID:37903214) evidence for autosomal recessive inheritance with the 25 percent sib risk, a new autosomal dominant inheritance block for the PRKACA/PRKACB form, genetic rows for DYNC2H1, DYNC2LI1, WDR35, SMO, PRKACA and PRKACB, and GeneReviews evidence on orthopedic, dental, respiratory and echocardiography rows plus new growth/developmental surveillance and pregnancy management rows. GeneReviews names the remaining locus only as GLI, so no GLI row was added. Removed the unsourced cranioectodermal dysplasia differential, bound Weyers acrodental dysostosis to MONDO:0008673, and added MONDO exact synonyms. Validated with just validate, validate-terms and count-verified-snippets (73/73).

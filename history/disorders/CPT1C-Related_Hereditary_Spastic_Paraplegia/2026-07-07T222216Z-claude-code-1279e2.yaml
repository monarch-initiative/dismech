  summary: 'Create: CPT1C-Related Hereditary Spastic Paraplegia SPG73'
  details: |
    Created new disorder entry for CPT1C-related hereditary spastic paraplegia SPG73 [MONDO:0014568, OMIM:616282, ORPHA:444099], the WP-010 row 4.1.07.01 flagged as genuinely missing in the issue coverage audit. NEC preflight confirmed MONDO:0014568 definition names CPT1C, gene HGNC:18540, matching OMIM/ORPHA. Debundled pathophysiology into four nodes: CPT1C neuronal-ER-isoform dysfunction -> disrupted ER protein-interaction network via atlastin-1/ATL1 -> impaired neuronal lipid-droplet biogenesis with dominant-negative effect -> corticospinal-tract axonal degeneration. All evidence from Rinaldi et al. 2015 JAMA Neurol PMID:25751282, the founding SPG73 paper; snippets verified as exact substrings of the fetched abstract and split by evidence_source. Modeled as a distinct entry rather than folded into CPT1A/CPT2 deficiencies because the phenotype is a neurodegenerative corticospinal disorder, not a systemic FAO defect. Validated with just validate / validate-terms / validate-references, all pass.

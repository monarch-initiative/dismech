  summary: Review CPT1C HSP with variant-specific causality and full-text mechanistic
    evidence
  details: |
    Reviewed the original adult R37C pedigree and clinical table, Hong family and construct assays, Brooks clinical cases and table, DAmore variant table, full primary lysosome/axon and SAC1/GluA1 studies, general HSP GeneReviews, and the newer loss-of-function cohort study and correction. Corrected the false inference of disrupted atlastin binding and established human distal degeneration; separated missense evidence from disputed haploinsufficiency. Added case-qualified phenotypes, alleles, diagnostics, care, models and open mechanistic questions. No matching CPT1C deep-research artifact was found. The corrected cohort article replaced an individual-level UKBB table; its generated DOI abstract is cited and the stale full-text PMID cache is excluded. Wang primary full text and the 2025 spastic-ataxia letters were not retrievable; secondary observations are qualified. All reference caches were generated or normalized by repository tooling.

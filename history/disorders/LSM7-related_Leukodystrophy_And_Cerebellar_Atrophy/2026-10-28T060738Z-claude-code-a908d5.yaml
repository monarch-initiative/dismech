  summary: 'Create: LSM7-related Leukodystrophy and Cerebellar Atrophy'
  details: |
    New entry for MONDO:0978294 from the two primary reports (PMID:35047835, homozygous p.Asp41Asn plus a p.Arg69Pro carrier family with fetal deaths; PMID:39420558, compound heterozygous p.Asp41Asn/p.Arg69Trp). Both sources show misassembly of both LSM1-7 and LSM2-8 rings (HEK293 AP-MS) and loss of both decay (PATL1, EDC4) and tri-snRNP partners; neither measures splicing, U6 snRNA level or mRNA decay. The two arms are therefore recorded as competing EMERGING mechanistic_hypotheses with hypothesis_groups on the downstream edges, plus a KNOWLEDGE_GAP discussion. The variant node conforms to spliceosome_component_dysfunction#Germline Spliceosome Component Variant because LSM7 is a core LSM2-8 (U6 snRNP) subunit whose loss reduces tri-snRNP association; no node conforms to the mis-splicing node because no mis-splicing has been shown. The zebrafish oligodendrocyte apoptosis node conforms to cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death. Fetal findings from the ungenotyped p.Arg69Pro family are kept in notes, not as phenotypes. No ClinGen record exists. Validated with just validate, validate-terms, count-verified-snippets (40/40) and validate-disorders.

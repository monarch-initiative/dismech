  summary: 'Review round 1: add Developmental Regression phenotype (PR #11385)'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES verdict on PR #11385. Blocking fix: added a Developmental Regression phenotype bound to HP:0002376, which HPO treats as distinct from HP:0001263 Global developmental delay. Regression rather than static delay is the cardinal feature of Leigh syndrome and is documented in three of the seven published patients, and the entry already leaned on the delay-versus-regression distinction narratively to separate the two clinical poles without it being queryable. Two evidence items from PMID:36450274, both verified as exact substrings of references_cache/PMID_36450274.md before committing rather than trusting the reviewer's transcription: the first preserves the source's non-ASCII hyphen in 'disease-causing' and the second reproduces the paper's own 'adquisicion' typo, both correct for exact quotes. Linked the new phenotype into the pathograph as a downstream target of Subacute Necrotizing Degeneration of Basal Ganglia and Thalamus, as the reviewer suggested. Took two of the four suggestions. Added therapeutic_agent to the levodopa treatment - NOTE the reviewer suggested 'CHEBI:15765 levodopa' but the canonical CHEBI label is 'L-dopa', so the binding uses label: L-dopa with preferred_term: levodopa per the ontology contract; the reviewer had explicitly asked for the CURIE and label to be confirmed against CHEBI, and this is what that check found. Added biotin (CHEBI:15956) and vitamin C (CHEBI:29073 L-ascorbic acid) as agents on the mitochondrial cofactor cocktail, completing the composition already named in its description; both are covered by the existing PMID:36450274 snippet naming carnitine, thiamine and biotin. Declined suggestion 4 (PMID:32000367, the 385-patient Leigh meta-analysis) - the reviewer called it genuinely optional and noted it could cut against the entry's deliberate calibration of frequencies to the seven-patient denominator, and adding it would mean staging a reference cache for a class-level claim the entry does not need. Declined suggestion 5 (HP:0001518 Small for gestational age) - one of seven patients, and the 2023 series explicitly reports none of theirs had it, so the narrative handling in progression notes is the more honest representation. No new references_cache files and no new term cache rows were needed: HP:0002376, CHEBI:15765, CHEBI:15956 and CHEBI:29073 were all already in cache/hp/terms.csv, cache/chebi/terms.csv and the corresponding enum caches. Validation after the change: just validate passed with 102/102 snippets verified (was 100/100), just validate-terms passed, and check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading and check-folded-hyphens are all clean.

  details: |
    New entry for COXPD51 (MONDO:0033631, PTCD3/MRPS39/mS39). Lump/split: curated as entry_type DISEASE. The stub records one causal gene, the parent MONDO:0000732, and no MONDO descendants; the OLS record confirms an OMIM:619057 equivalence, COXPD51 as the only synonym, and no children. That is the leaf signature, and the literature agrees - all seven published patients are PTCD3-biallelic and no sub-entity has been proposed.

    Deep research: 'just dr_fallback=--fallback research-disorder falcon' was used because falcon returns HTTP 402 (Edison account out of credits). The report was produced by OPENSCIENTIST, not falcon; the fallback is recorded in the report frontmatter (fell_back: true, requested_provider: falcon, provider_attempts). Report: research/Combined_Oxidative_Phosphorylation_Deficiency_51-deep-research-openscientist.md, with its .citations.md sidecar and an _artifacts/ directory holding OpenScientist's own HTML and PDF report. Validation as recorded in that report: references 10/10 resolved, 0 unresolved, confabulation_rate 0.0, 7/10 assessed on topic, 0 off topic; terms 32/33 resolved, 1 unverifiable, 0 mislabelled, 4/4 names correct. No needs_review key and no unresolved_references list, so nothing was excluded on that basis. 'just preflight-dr <report> MONDO:0033631' returned PASS (PTCD3 mentioned 35 times, report OMIM 619057 == MONDO OMIM xref).

    How the DR report was used. Its mechanism synthesis agrees with the primary literature and added nothing that the primary papers do not state, so no claim in this entry rests on it alone. It did contribute two class-level references that are cited with directness: INDIRECT - PMID:31967322 (166-patient Japanese Leigh syndrome mortality cohort) for the prognosis of the infantile pole, and PMID:34008913 (COXPD9/MRPL3) as a worked example of the mitoribosomal-protein differential. Each of those evidence items names, in its explanation, which disease and gene the cited study is actually about.

    The report's most consequential limitation: it did not find PMID:39544688 (Lace et al. 2024, 'The phenotypic spectrum of PTCD3 deficiency'), so it presents COXPD51 as uniformly severe infantile Leigh syndrome. The mild adult pole in this entry - the sibling pair in their thirties with optic atrophy, ataxia, tremor and motor polyneuropathy, worked up for years as hereditary ataxia - comes from primary-literature searching (PubMed esearch on PTCD3/MRPS39/COXPD51), not from the report. The Drosophila model (PMID:38074476) was likewise found independently.

    Named Entity Confusion handled. PTCD3 has a substantial cancer-expression and CRISPR-screen literature (colorectal PMID:40304977, prostate PMID:30132530, Myc-driven lymphoma PMID:27635472, sepsis/T2DM ferroptosis PMID:41194984). PMID:40304977 was among the DR report's own citations and is NOT cited here. The numbered COXPD disorders are sibling entities; class-level statements about mitochondrial translation defects or mitoribosomal protein disorders are kept at class level and labelled INDIRECT where they carry an inference to PTCD3.

    Claims deliberately not made. (a) The generic 'complexes I, III, IV and V fail together' formulation is not asserted: the PTCD3 patients show consistent complex I and IV deficits, a complex III deficit in one of two patients tested, and explicitly unaltered complex V and complex II subunit levels. Spared complex II is curated as a REFUTE biochemical item with the source's own measurement. (b) PMID:30706245 (the Letter arguing 'Leigh-like rather than Leigh') is discussed but not cited as evidence - its cached record is content_type: unavailable with no abstract or body, so nothing in it can be quoted exactly; the 2023 series' summary of the challenge is quoted instead. (c) The DR report's IMPC Ptcd3 knockout data (homozygous embryonic lethality, heterozygous impaired pupillary reflex) are NOT curated: the report gives no fetchable identifier for them. The mouse null phenotype is recorded only from the sentence in PMID:39544688 that states it. (d) No datasets: block - see the entry notes; a gene-symbol repository search would surface PTCD3 cancer datasets, which is the exact NEC trap. (e) Six downstream causal edges are left uncited rather than propped up with a neighbouring node's citation. (f) No GeneReviews chapter exists (PubMed title search returned nothing) and no Orphanet entry was found, so there is no expert-curated phenotype baseline.

    Module conformance: the 'Combined Respiratory Chain Deficiency with Complex II Spared' node declares conforms_to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress, matching what sibling entries Combined_Oxidative_Phosphorylation_Defect_Type_13 and Combined_Oxidative_Phosphorylation_Deficiency_42 do. No primary mitochondrial-translation module exists in kb/modules/; Type_26 records the same finding.

    Validation run to completion on the final tree: just validate (schema OK, terms OK, 100/100 snippets verified); just validate-disorders (schema OK, terms OK, 100/100 snippets verified); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-empty-snippets, check-snippet-boundaries all OK; whole-KB check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles all OK; check-source-defect-claims reports exactly one claim for this file, CONFIRMED (PMID:30706245 content_type: unavailable). normalize-cache made no changes; check-term-cache-integrity and check-cache-order OK. linkml-data-qc compliance 95.8% global / 96.1% weighted, the residual being datasets and the uncited causal edges described above. All 7 cited references are PMIDs, so no DOI-skip audit was needed.

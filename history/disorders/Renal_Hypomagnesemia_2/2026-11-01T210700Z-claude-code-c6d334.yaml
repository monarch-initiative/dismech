  summary: 'Create: Renal Hypomagnesemia 2'
  details: |
    Created the HOMG2 entry (MONDO:0007937, FXYD2 hgnc:4026, autosomal dominant). One OpenScientist deep-research report was used (research/Renal_Hypomagnesemia_2-deep-research-openscientist.md): reference_validation 13/13 resolved (1 flagged off-topic, PMID:11278761, which was read and not cited), term_validation 19/20 resolved with needs_review for mislabelled bucket tags that are an artifact of the report format, not wrong CURIEs; preflight-dr returned WARN, correctly flagging that the report writes HGNC:4028 (FXYD4) beside FXYD2 in three places, so FXYD2=hgnc:4026 was taken from HGNC and the structured ClinGen/Orphanet caches, not the report. The report's citations were used as leads and every snippet was verified against the cached reference abstract or full text. Causal chain runs from the heterozygous FXYD2 p.Gly41Arg variant through intracellular misrouting, dominant-negative retention of wild-type FXYD2, loss of DCT Na,K-ATPase regulation, reduced DCT magnesium reabsorption, renal magnesium wasting and hypomagnesemia, to neuromuscular hyperexcitability (cramps, tetany, seizures) and chondrocalcinosis. The unsettled Mg-wasting mechanism is recorded as two EMERGING mechanistic_hypotheses (pump destabilization vs basolateral Mg exit) and an INTERPRETATION discussion; the Fxyd2-null mouse is a HUMAN_MODEL_MISMATCH discussion. gene_disease_validity records the ClinGen Moderate (AD, Tubulopathy GCEP) tier copied from CGGV:assertion_aef2e6fc; relationship_type left unset to avoid an overstated finding per dismech#16102. Validated: just validate (61/61 snippets), validate-terms, validate-disorders, check-gene-validity (overstated 0), entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, enum-values, duplicate-keys, block-scalar-comments, logical-rules, snippet-length, title-snippets, reference-titles, folded-hyphens, snippet-grading, retired-support-prose, shared-disease-terms, gene-term-mismatches all clean. No GeneReviews chapter (NO_CHAPTER).

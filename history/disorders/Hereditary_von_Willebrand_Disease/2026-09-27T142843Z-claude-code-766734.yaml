  details: |
    Review round 1 on PR #13013. Mined the Clinical Characteristics and Management sections of the GeneReviews chapter PMID:20301765, which the entry had tagged while using only its Genetic Counseling and Diagnosis text.

    Phenotypes. Added six rows, each bound to an HP term read from the local HPO build in the same step it was written: Oral Cavity Bleeding (HP:0030140), Gastrointestinal Bleeding (HP:0002239), Prolonged Bleeding After Surgery (HP:0004846), Prolonged Bleeding After Dental Extraction (HP:0006298), Postpartum Hemorrhage (HP:0011891) and Joint Bleeding (HP:0005261). Each is wired as a bare-name downstream target of the existing pathophysiology node Von Willebrand Factor Deficiency or Dysfunction, so all nine phenotypes in the entry now carry a causal inlink. The three pre-existing phenotypes each gained the chapter's mucocutaneous-bleeding sentence alongside the review they already cited.

    Joint bleeding scope. Neither cited source attaches joint or musculoskeletal bleeding to a numbered VWD type: the chapter says "more severe forms of VWD" and PMID:21289515 says "in severe cases". No subtype foreign key is therefore set on that row, and the reason is recorded in its notes.

    Frequency bands. The new rows carry no frequency value. FrequencyEnum bands are defined by explicit patient percentages and neither cited source reports a frequency for any of these manifestations, so an absent band is the accurate state rather than an omission.

    Treatments. Desmopressin and the VWF/factor VIII concentrates each gained a management snippet from the chapter. Two new treatments: Antifibrinolytic Therapy (NCIT:C15986 Pharmacotherapy, therapeutic_agent CHEBI:48669 tranexamic acid, therapeutic_modality SMALL_MOLECULE) and Hormonal Therapy for Heavy Menstrual Bleeding (NCIT:C15445 Hormone Therapy, target_phenotypes Menorrhagia).

    Not added: the chapter's agents-and-circumstances-to-avoid list. The Treatment class has no contraindication or avoidance slot, so there is no structural home for it short of a schema change.

    Validation: schema clean; term validation clean; 52/52 snippets verified; whole-repo gates green.

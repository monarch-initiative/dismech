  summary: 'Genetics pass: rebind anchor to hereditary VWD, bind four subtype terms,
    add VWF'
  details: |
    Genetics pass for dismech#12267 (series-060), von Willebrand disease parent.

    Anchor. The entry was bound to MONDO:0024574 "von Willebrand disease (hereditary
    or acquired)", whose MONDO definition opens "Hereditary or acquired coagulation
    disorder" and whose two children are MONDO:0019565 hereditary von Willebrand
    disease and MONDO:0020460 acquired von willebrand syndrome. An entry named
    Hereditary von Willebrand Disease asserting identity with that class claims the
    acquired syndrome too. disease_term is now MONDO:0019565, the exact class, with
    MONDO:0024574 recorded as skos:broadMatch.

    Subtypes. All four existing rows (types 1, 2, 2N, 3) had no subtype_term and no
    genes. They are now bound to MONDO:0008668, MONDO:0013304, MONDO:0015631 and
    MONDO:0010191 respectively, each with VWF (hgnc:12726, verified live against
    rest.genenames.org) and an inheritance block bound to HP:0000006 or HP:0000007
    per the GeneReviews chapter's genetic-counseling section.

    Genetics. The entry carried no genetic: block at all, so its causal gene was
    invisible to any gene-level query. A VWF record was added, typed CAUSATIVE with
    variant_origin GERMLINE, and bound as a genes: descriptor on the Von Willebrand
    Factor Deficiency or Dysfunction node. gene_mechanism_wiring_coverage moves from
    0/0 (no denominator) to 1/1.

    Baseline. The GeneReviews chapter PMID:20301765 was uncited; it is now fetched,
    tagged GeneReviews in references:, and is the source for the per-type inheritance
    and for the diagnostic criterion naming VWF.

    MONDO reconciliation. All three checklist rows (MONDO:0008668, MONDO:0013304,
    MONDO:0010191, all VWF) are present as bound subtype rows. Two further children
    of the new anchor are recorded in notes: as outside this entry's scope -
    MONDO:0008332 platelet-type von Willebrand disease (GP1BA; MONDO's own record
    opens with an editor note to check the relationship to VWD) and MONDO:0010756
    Von Willebrand disease, X-linked form (no definition and no causal-gene axiom in
    MONDO).

    Validation: just validate, validate-terms, count-verified-snippets (all snippets
    verified), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches --resolve,
    and the whole-repo gates, all under linkml-reference-validator 0.3.0rc3.

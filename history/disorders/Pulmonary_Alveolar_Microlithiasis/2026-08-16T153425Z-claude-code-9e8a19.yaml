  summary: 'Create: Pulmonary Alveolar Microlithiasis (MONDO:0009928)'
  details: |
    New entry from a claude_code deep-research report. Seven pathophysiology nodes: biallelic SLC34A2 loss of function, loss of NaPi-IIb phosphate reuptake at the alveolar type II apical membrane, phosphate accumulation and calcium phosphate supersaturation of alveolar lining fluid, microlith formation, microlith-driven macrophage inflammation, alveolar phospholipidosis, and interstitial fibrosis with restrictive physiology conforming to fibrotic_response. The inflammation node carries a reversibility result rather than an association: microliths transferred into wild-type mouse lung produce macrophage inflammation that resolves as the stones clear, which fixes the direction of causation and makes stone burden a target rather than a marker. Non-recurrence of microliths in transplanted lungs is curated as a mechanistic inference (the defect is lung-epithelium-intrinsic, not systemic mineral handling) rather than only as an outcome, and lung transplantation carries RESTORES on the transport node for that reason. Two KNOWLEDGE_GAP discussions: discordant etidronate response and disease progression among relatives sharing identical variants (an unidentified-modifier signal), and the complete absence of gene-directed therapy for what is an unusually favourable target. NEC handling: preflight returned WARN because the tool's gene lexicon matched PAM, the disease's own acronym, against the unrelated gene PAM; verified by hand as a false positive (zero gene-like usages, OMIM 265100 matches on both sides). The real confusion risk flagged by the report is pulmonary alveolar proteinosis, which is separately curated in this KB and is recorded as the primary differential. Testicular microlithiasis is included as a differential specifically to record how weak the SLC34A2 link is (two rare variants, one synonymous and one noncoding, in a small subject group) and to avoid letting the source paper's title do work its results do not support. Errors caught in self-audit: a snippet that was the cited paper's TITLE rather than a finding, and which did not even match (replaced with the paper's actual positional-cloning result); and FOUR fabricated reference_title values written from context rather than copied from cache, all rewritten programmatically from the cache, one of which materially misdescribed its source (PMID:39735153 is a lung-function-decline study, not the comprehensive review I had invented). GO:0005436 required cache seeding via the local sqlite adapter after the configured OLS adapter timed out; conf/oak_config.yaml restored and verified clean. Validated: just validate passed; count-verified-snippets 24/24; title audit 24 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK.

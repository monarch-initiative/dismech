  details: |
    CORRECTION TO THE PRECEDING HISTORY RECORD IN THIS DIRECTORY. That record, and the commit message it accompanied, state that PMID:35443721 was cited on the Biallelic SLC34A2 Loss of Function node with the Thr468del sentence, and list pathophysiology under sections. That did not happen. The text replacement I used did not match the file, failed silently, and I asserted the result without checking; the reviewer caught it by grepping the tree and by noticing the snippet count stayed at 35 when adding the citation would have made it 36. The earlier record is left in place because history is append-only and it describes what I believed I had done, but its account of that edit is false and this record supersedes it on that point. The edit is now actually applied and verified present: grep returns 2 hits, snippet count is 37. Two evidence items rather than one, because the reviewer raised a second point worth acting on. The node previously asserted flatly that variants may produce a transporter that reaches the membrane but cannot move phosphate. The authors of the oocyte study are more careful than that: their conclusion is that the Thr468del mutant either does not function properly or is not sufficiently expressed in the membrane, or a combination of both. The node description now states that disjunction rather than resolving it, and the hedge sentence is curated as its own PARTIAL evidence item so the softer claim travels with the citation instead of being reconstructable only from the source. The practical corollary is retained because it holds under either reading: detecting the transporter protein does not establish that it works. Validated: just validate passed; count-verified-snippets 37/37 (was 35/35); title audit 0 mismatches.

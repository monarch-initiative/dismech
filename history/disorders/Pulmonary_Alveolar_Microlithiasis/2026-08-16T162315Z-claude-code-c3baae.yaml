  details: |
    Addressed all five IMPORTANT findings. The sharpest was that PMID:35443721 was committed to the cache by this PR and then never cited, leaving pathophysiology node 1's two-route claim unevidenced. Now cited as IN_VITRO with the sentence that actually proves the second route: the Thr468del construct was synthesised and expressed in the oocyte membrane yet moved no more phosphate than uninjected controls. That is why loss of transport does not require loss of protein, and it is also why immunodetection of the transporter cannot exclude the disease. Added diagnosis with the radiographic-plus-genetic standard and the incidental-detection route; this disease is unusual in that imaging can carry the diagnosis, so biopsy is avoidable, which is worth stating for a diffuse infiltrative lung disease. Note the cited sentence contains a typographical transposition of the gene symbol (SCL34A2) and is quoted verbatim as required, with the transposition noted in the explanation. Added biochemical for serum MCP-1 and SP-D, tagged MODEL_ORGANISM because the publication is the mouse study even though the human confirmation is reported within it. Added three phenotypes (nonproductive cough, chest pain, fatigue) from a snippet already verified in the entry. Split the bundled Etidronate and Other Attempted Pharmacotherapy record into separate treatments, and in doing so recorded WHY saline whole-lung lavage fails here rather than merely that it does: it is borrowed from alveolar proteinosis, where the alveoli are full of washable material, whereas these stones are frequently larger than the airway lumen. Added the two preclinical leads the entry's own knowledge-gap discussion leans on: EDTA chelation lavage (dissolve rather than rinse) and dietary phosphate restriction, both PARTIAL and MODEL_ORGANISM, with the human dietary-restriction failure noted so the murine reversibility result is not read as translated. Validated: just validate passed; count-verified-snippets 35/35 (was 24/24); title audit 35 citations 0 mismatches; check_folded_hyphens OK; check-title-snippets OK.

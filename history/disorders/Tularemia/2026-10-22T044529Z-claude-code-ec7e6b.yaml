  summary: Add the gastrointestinal pointer subtype required by design decisions 3e
  details: |
    PR Shepherd round on #14912. MONDO:0001916 is curated as Gastrointestinal_Tularemia but the parent carried no row for it, so the child was unreachable from the parent and design decisions 3e R20 was unsatisfied. check-granularity does not catch a missing pointer, only a mismatched one.

    Added a has_subtypes row mirroring the existing typhoidal pointer: classification clinical_form, curated_in: Gastrointestinal_Tularemia, subtype_term MONDO:0001916, and one evidence item quoting the cached PMID:19835784 sentence that names gastrointestinal tularemia as a human form acquired by ingestion, graded HUMAN_CLINICAL with quote_role: BACKGROUND to match its grading in the child entry. check-granularity on the parent now reports POINTER 4 with no DANGLING_POINTER or POINTER_TERM_MISMATCH.

    No subtype_frequency is recorded: the Norwegian surveillance series quoted for the other rows does not report an alimentary or gastrointestinal figure.

  summary: 'Create: Hypomyelinating_Leukodystrophy_9'
  details: |
    New entry for hypomyelinating leukodystrophy 9 (MONDO:0014506, OMIM 616140),
    caused by biallelic RARS1 variants (hgnc:9870, confirmed against the HGNC
    REST API).

    Sources. Deep research was run with the claude_code provider
    (research/Hypomyelinating_Leukodystrophy_9-deep-research-claude_code.md).
    Its reference validation resolved 13 of 13 references and 8 of 8 quotes;
    needs_review was set only by term-label paraphrases (MONDO:0014506 called
    "MONDO", MONDO:0010714 called "Parent grouping"), and no term from the
    report was bound without a separate lookup. preflight-dr returned WARN:
    RARS1 was mentioned 36 times and the second "gene" flagged was MSC, which in
    this report is the abbreviation for the multi-tRNA synthetase complex, not
    the MSC (musculin) gene; the report is about the right disease. The report
    also described a 2025 bioRxiv mouse preprint from search summaries only;
    it was not cited. Kim et al. 2024 (PMID:39542129, MSC structure) was not
    needed for any claim and was not used. Full-text papers used for phenotype
    mining: Mendes 2020 (PMID:31814314, 20 patients), Wan 2023 (PMID:37186453,
    29-patient review), Biglari 2024 (PMID:38618971, 33-patient review), Ji
    2018 (PMID:29451896, one patient), Fathi 2025 (PMID:40594583, Iranian
    cohort) and Matsumoto 2019 (PMID:31737794, cell model). Di Bella 2021 was
    read but not cited. No GeneReviews chapter names the disease
    (check-genereviews --online: NO_CHAPTER).

    Curation. Phenotype frequency bands come from the pooled counts in the
    2023 and 2024 literature reviews and the 20-patient series; single-patient
    findings carry no frequency. Death in childhood (HP:0003819) was dropped as
    a phenotype because it is outside the PhenotypeTerm enum; the deaths are
    recorded on the neuronal-involvement node instead. The pathograph runs from
    the variants through four allele-specific molecular branches (reduced
    protein stability, reduced long-isoform translation, reduced
    aminoacylation, lysosomal aggregation of p.Ser456Leu) to reduced MSC,
    reduced protein synthesis capacity, reduced S6 phosphorylation, impaired
    oligodendroglial differentiation and deficient CNS myelin, with separate
    branches for neuronal involvement and disordered cortical development in
    severe disease. Uncited edges carry a description saying the link is
    inferred.

    Conformance. Added cns_myelin_failure#Oligodendrocyte Differentiation
    Arrest and Death (on Impaired Oligodendroglial Differentiation) and
    cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath (on Deficient
    CNS Myelin Deposition). Not conformed: the cns_myelin_failure trigger node,
    because Mendes et al. leave open whether the primary lesion is
    oligodendroglial or neuronal and there is no evidence that oligodendrocytes
    depend disproportionately on ArgRS; the microglial, axonal-support and
    axonal-degeneration nodes, for lack of evidence; loss_of_proteostasis,
    because it models age-related network decline, not one overexpressed
    mutant protein; epilepsy_excitation_inhibition_imbalance, because no
    excitation-inhibition mechanism is described for RARS1;
    neural_progenitor_centrosome_spindle_dysfunction, because no progenitor or
    centrosome defect is shown; cerebellar_purkinje_degeneration,
    corticospinal_tract_axonopathy, mtorc1_hyperactivation and
    deregulated_nutrient_sensing, whose scopes do not cover this disease. No
    module exists for aminoacyl-tRNA synthetase or translation defects.

    Validation: just validate passes; count-verified-snippets
    98/98; validate-disorders passed (98 snippets, 100 titles, 0 issues);
    check-entity-refs, check-causal-targets, check-logical-rules,
    check-coarse-phenotypes, check-enum-values, check-duplicate-keys,
    check-block-scalar-comments, check-snippet-length, check-title-snippets,
    check-reference-titles, check-snippet-grading, check-retired-support-prose,
    check-folded-hyphens, check-folded-yaml and check-environmental-evidence
    all pass. check-gene-activity-grounding fails only on findings already on
    main; none names this entry. 22 of 29 phenotypes are causally connected.
    The cached PMID:40594583 record already on main was used unchanged.

    Review response. The incontinence phenotype was bound to Urinary
    incontinence although PMID:29451896 does not name the type; it is now
    Impaired Continence (HP:0031064), the parent covering urinary and fecal
    incontinence, and the explanation no longer calls the binding an
    assumption.

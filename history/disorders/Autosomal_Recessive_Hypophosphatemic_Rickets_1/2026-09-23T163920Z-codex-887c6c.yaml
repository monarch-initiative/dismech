  summary: Review DMP1 molecular scope, matrix and FGF23 mechanisms, clinical variability and treatment
    using full texts
  details: |-
    Reviewed the complete 2,263-line baseline and CREATE history; no REVIEW existed. Read the substantive Falcon research report (lines 983–1281), its unique citation-appendix content (458–490) and artifact00 after identifying the repeated prompt/template portions. The report has provider metadata and a substantive disease narrative. Preflight warns that FGF23 is mentioned more often than DMP1; canonical gene DMP1, MONDO:0009430 and OMIM:241520 establish correct identity, with FGF23 as a downstream mediator. Live open-PR preflight found no overlapping review. This Mendelian disease is in scope; infectious and environmental/poisoning entries remain excluded.

    Read complete cached scientific main texts/methods for the discovery papers PMID:17033621 and 17033625, including the former's 17-page PDF, clinical table and six figure captions. The latter's embedded table cells and separate supplements were unavailable. The discovery families include a normal/tall affected adult and rickets improving on phosphate/calcitriol despite persistent renal phosphate loss. Intact FGF23 was clearly high in only two of four affected individuals in the other discovery study. Removed obligatory lifelong low phosphate, uniform short stature and normal-PTH assumptions; age, treatment and assay context now qualify biochemical findings. Compound heterozygosity is established and excludes a homozygous-only genetic context.

    Read all scientific main text/methods of PMID:19007919 and 19796717. The c.1A>G construct has abnormal intracellular localization, but C-terminal frameshift protein is secreted and processed; loss of function does not mean absence of every protein species. The older deletion was at least 49 kb with incompletely localized boundaries, not a proven exact whole-gene deletion. The Turkish family's FGF23 assay was C-terminal, not intact. Dental radiographs show enlarged pulp chambers/thin dentin; trauma preceded early tooth loss and abscess. Avoided spontaneous-tooth-loss and primary-enamel-defect claims. Splice effects predicted without RNA analysis remain predictions. Selected-family genotype associations do not prove domain-specific clinical severity.

    Fetched PMID:29901142, resolving the research report's absent PMID, and read its abstract plus recruitment, DMP1 results, clinical tables VI/VII and segregation material in the full Gu 2018 PDF. The later discussion and technical sequencing-method detail were not completely read. One DMP1 case among 86 selected patients is not a population prevalence. Fetched the genuine publisher full text of Ni 2023 (PMID:36334264) through the article-minimal URL and read all scientific main text, methods, Table 1 and seven figure captions; separate supplements were not read. Apparent homozygosity became paternal start-loss plus maternal multigene deletion after parental/CNV analysis. LC-MS supports downstream reinitiation of c.1A>T, with secretion but absent 57-kDa cleavage fragment. The deletion encompasses DSPP, DMP1 and IBSP and part of MEPE; inconsistent printed coordinates were not propagated. Maternal absence of a dental phenotype does not prove every multigene deletion has no additional effect.

    Read all scientific main text/methods/captions in refreshed PMID:21507898, including six tables. Increased FGFR1/FRS2/PI3K phosphorylation was measured in bone; SU5402 suppression of Fgf23 was in cultured marrow stromal cells, not a treated mouse or an FGFR1-specific genetic knockout. FGFR2 participation and the molecular matrix-to-receptor link remain unresolved. Separated bone FGFR activation from osteocyte maturation and matrix mineralization. Non-additivity of Hyp and Dmp1 mutants does not prove direct DMP1-PHEX binding or make XLH a purely endocrine comparator.

    Read the full scientific main text/methods of PMID:37943605 and distinguished its experiments: adult male Dmp1-null mice, phosphate diet from six to twelve weeks, partial osteocytic Fgf23 deletion, cultured marrow stromal cells, recombinant-FGF23 MC3T3 experiments and coculture. Deletion lowers excess hormone by about 75% rather than eliminating it; normalized phosphate does not eliminate residual FGF23/PTH confounding. ALP differentiation rescue and persistent alizarin-red mineralization defects are different endpoints. Added direct FGF23 inhibition of osteoprogenitor differentiation without claiming that computational trajectories are lineage tracing or measured FGFR phosphorylation. Three biological samples and four computational barcode groups are not four biological replicates. GEO accessions were noted in the source but no dataset record was curated; the frozen shared accession blob was not accessed.

    Read the entire cached scientific main text, methods and captions of PMID:20734454, 21542006 and 16294270. Separate supplements and embedded table cells missing from the cache were not read. Full-length or 57-kDa Col1a1 transgenic rescue establishes experimental sufficiency, not a human replacement treatment. Early postnatal anti-FGF23 treatment rescues growth plates/secondary ossification more fully than cortical osteomalacia. The 2011 study followed bony protuberances to one year, contradicting the previous claim that aging phenotypes were never followed. Neonatal calvarial cultures mineralized with adequate phosphate, whereas 2023 marrow cultures retained defects; cell source, age and protocol qualify generalization. FTIR heterozygotes retain mineral-to-matrix ratio and phosphate but have altered crystallinity and calcium, so they are not normal in every endpoint. The 2017 phosphate-set-point paper PMID:28005411 remained abstract-only after refresh; a PMC URL returned a browser challenge and was neither used as full text nor committed.

    Read all cached scientific main text/methods of the Finnish long-term family PMID:20499351 and the burosumab brothers PMID:35896139, including the latter's figure captions. The Finnish FGF23 assay was C-terminal; affected DXA measurements were obstructed by ossification/prostheses. One untreated adult also developed extensive ossification, so treatment does not fully explain it. The brothers had one- and two-year burosumab follow-up; the younger remained hypophosphatemic at the four-week trough despite normal midpoint values. One pseudofracture nearly healed by five months. Mouth opening improved after corrective surgery during treatment, not proven drug reversal of enthesopathy. No paired human bone biopsy was reported. Cinacalcet provided clinically minor biochemical changes with dose intolerance in one brother and is represented as limited reported use. Partial clinical benefit is compatible with partial model rescue; replaced a false HUMAN_MODEL_MISMATCH with a knowledge gap.

    Read the complete abstract of PMID:41820620; publisher full text is subscription-only. Its abstract documents one adult's jaw osteonecrosis and treatment sequence, but does not quantify burosumab improvement. Carrier biochemical and bone findings do not establish dominant ARHR1 or a universal carrier-surveillance regimen. Read complete abstracts for PMID:20213538, 25180662 and 32920683; the last combines five new cases with 25 literature cases, not an unselected frequency cohort. Reviewed the available scientific main text of PMID:31843680; a short technical gene-panel passage was truncated, and embedded figures/tables were unavailable. SPP1 was a VUS with benign/tolerated predictions, not an established modifier. Decalcified biopsy does not prove osteomalacia. Read the complete Argentine case PMID:36315908, including c.55-1G>C segregation and conditional recurrence counseling. The 2024 DMP1 case PMID:39011543 informs broad testing and the normal-ALP counterexample. Other disorders in mixed cohorts are not counted as DMP1 patients.

    Read the full cached 2026 clinical review PMID:42412262 and selected general/phosphopenic-rickets management sections and tables of PMID:35352187. General care recommendations are OTHER/REVIEW_SYNTHESIS, not ARHR1 trial outcomes. Read sections 1, 2.1, 4 and 5 of the fetched August 2025 FDA burosumab label. Specified US indications and off-label ARHR1 use, the oral-phosphate/active-vitamin-D interaction, baseline phosphate/renal restrictions and new hypercalcemia warning. Added growth, mineral, urinary-calcium, renal and dental surveillance with class-level provenance. Biochemical monitoring during burosumab accounts for antibody-bound FGF23 assay interference. The offline GeneReviews check reports NO_CHAPTER for this entry; a disease-specific chapter is not fabricated from the XLH chapter.

    Removed unsupported phenotype frequency bands. Split fracture/pseudofracture, enthesopathy/ligament ossification, contractures/spinal ankylosis, high axial density/generalized sclerosis and dental abscess/early primary-tooth loss/pulp enlargement/jaw necrosis. Enthesopathy is not forced onto inflammatory enthesitis, and jaw necrosis is not forced onto an avascular-etiology term. Removed the bundled and redundant Rickets and Osteomalacia mechanism node, preserving separate growth-plate and osteoid outcomes. Osteomalacia occurs in children as well as adults. Unknown hyperostotic, auditory, jaw and enthesopathic mechanisms remain unconnected rather than fabricated. Unmineralized osteoid is not asserted to inflate DXA mineral density. Clinical background sentences in primary papers were classified OTHER/BACKGROUND; isolated-cell experiments are IN_VITRO.

    Completeness cross-check: phenotype coverage, atomic mechanisms, allele spectrum/segregation, diagnostics/biomarkers, conventional and emerging treatment, monitoring and central references are adequate after revision. No established DMP1 clinical subtypes were identified; other genes are differentials. No ARHR1 phase-II-or-later intervention trial was verified by the research; no XLH trial is relabeled as DMP1-specific. Proposed matrix replacement and unidentified signaling intermediates remain preclinical questions. All new evidence/publication titles were matched to cache identities, with findings identifying URL-backed papers. Caches were generated by the fetcher; no reference text was hand-authored. Schema, terms, quotations, history, graph references and repository checks are reported in the PR.

    Independent review follow-up: moved the FTIR readout to its own matrix-mineralization model link, matching link and readout targets; narrowed GO bindings to renal phosphate ion absorption and dentin mineralization; removed five stale explanations of deleted frequency bands; cited the Gu publisher full-text segregation sentence directly. Retained no population frequency bands because selected families do not establish ascertainment-independent proportions. Added the targeted disorder data test to verification.

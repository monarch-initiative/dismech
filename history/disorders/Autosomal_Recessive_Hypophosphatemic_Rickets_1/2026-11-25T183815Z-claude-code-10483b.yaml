  summary: 'Gene-family review: DMP1 and FGF23'
  details: |
    DMP1 modelling re-reviewed and found correct: biallelic loss of function, with the DMP1 node binding calcium ion binding (GO:0005509) as decreased, which matches the ai-gene-review core function. The node for increased osteocytic FGF23 production carried FGF23 with no molecular function; it now binds hormone activity (GO:0005179) as increased, matching its evidence that bone Fgf23 expression and circulating hormone rise in Dmp1-null mice (PMID:17033621) and that bone FGF23 staining is increased in patients (PMID:20499351). No ClinGen DMP1 assertion exists.

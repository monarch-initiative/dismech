  summary: 'Create: Autosomal Recessive Hypophosphatemic Rickets 1 (MONDO:0009430)'
  details: |
    De-novo curation of ARHR1 (DMP1-related; MONDO:0009430, OMIM 241520) from the skeleton file; stub stubs/Hypophosphatemic_Rickets_Autosomal_Recessive_1.yaml deleted. Lump/split: DMP1 disease only; ARHR2 (ENPP1) and XLH (PHEX) kept as separate entries and listed as differential diagnoses. Pathophysiology is an 11-node chain: Biallelic DMP1 Loss of Function -> Defective Osteocyte Maturation and Pericellular Mineralization -> Increased Osteocytic FGF23 Production (FGFR-dependent, unknown intermediates) -> Elevated Circulating Intact FGF23 -> Reduced Proximal Tubular Phosphate Reabsorption and Suppressed Renal Calcitriol Synthesis -> Chronic Hypophosphatemia -> Skeletal Mineralization Failure (also reached directly from the DMP1-intrinsic osteocyte defect, per Courbon 2023) -> Growth Plate Hypertrophic Zone Expansion -> Rickets and Osteomalacia; plus Dentin Hypomineralization. The four downstream nodes conform to defective_skeletal_mineralization (Phosphopenic Substrate Deficiency, Impaired Hydroxyapatite Deposition, Growth Plate Hypertrophic Zone Expansion, Rickets and Osteomalacia). 15 phenotypes, biochemical block (phosphate, TmP/GFR, intact FGF23, calcitriol, ALP, PTH/calcium), genetic block with LOSS_OF_FUNCTION and the full published allele spectrum, structured prevalence (CASES_IN_LITERATURE, ULTRA_RARE, ~30 reported patients), Dmp1-null mouse with five modeled_mechanisms links and readouts, four discussions (DMP1-to-FGF23 coupling gap, HUMAN_MODEL_MISMATCH on FGF23 blockade vs the DMP1-intrinsic matrix defect, adult hyperostosis/osteosclerosis mechanism gap, carrier phenotype gap), classifications (harrisons_chapter ENDOCRINOLOGY_METABOLISM + GENETICS_ENVIRONMENT_DISEASE; isds_skeletal_category abnormal_mineralization). Enthesopathy deliberately left unbound (HP:0100686 is inflammatory enthesitis), matching the XLH entry. Provider: Falcon (Edison) report research/Autosomal_Recessive_Hypophosphatemic_Rickets_1-deep-research-falcon.md, 11/11 references and 44/46 terms resolved; preflight-dr WARN (FGF23 mentioned 49x vs DMP1 45x) judged benign because FGF23 is the downstream hormone and OMIM 241520 matched. DOIs resolved to PMIDs via the PMC ID converter: 10.1038/ng1868->17033625, 10.1002/jbmr.105->20499351, 10.1210/en.2016-1642->28005411, 10.1172/jci.insight.156850->37943605, 10.1016/j.bonr.2024.101753->39011543, 10.3389/fendo.2022.1005189->36246908, 10.1007/s00467-022-05505-5->35352187, 10.1016/j.bone.2017.01.034->28159712 (cached, not cited), 10.3389/fendo.2024.1383681->38706696 (cached, not cited); 10.3892/ijmm.2018.3730 (Gu 2018) and 10.3390/endocrines3020025 (Nakanishi 2022) have no PubMed record and were not cited. Additional primary papers found via PubMed E-utilities: Feng 2006 (17033621), Ling 2005 (16294270), Farrow 2009 (19007919), Turan 2010 (19796717), Koshida 2010 (20213538), Lu 2011 (20734454), Zhang 2011 (21542006), Martin 2011 (21507898), Gannage-Yared 2014 (25180662), Whyte 2020 (31843680), Ni 2020 (32920683), Bai 2022 (35896139), Ni 2023 (36334264), Bastida 2023 (36315908), Sawalha 2026 (41820620), Ferreira and Imel 2026 (42412262). No GeneReviews chapter exists for ARHR1; the XLH chapter (22319799) was not cited because its usable sentences are XLH-specific. Not sourced: no quotable abstract sentence for orthopedic surgery or dental care specific to ARHR1, so those treatments carry INDIRECT evidence from the phenotype descriptions; Bhattacharyya 2012 (22921867) and Beck-Nielsen 2019 (30808384) were cached but not cited because their abstracts contain no ARHR1-specific sentence. Validation: just validate passed; just count-verified-snippets 152/152; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms OK; just validate-disorders passed (All 1 disorder file(s) passed validation, 152/152 snippets); whole-KB check-folded-hyphens, check-title-snippets, check-snippet-grading, check-reference-titles OK; check-snippet-length reports
  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Created a classifications block; the entry previously had none. Added harrisons_chapter (GENETICS_ENVIRONMENT_DISEASE, ONCOLOGY_HEMATOLOGY, IMMUNE_RHEUMATOLOGIC) and iuis_category: phagocyte defect.

    IUIS 2022 Table 5, section 4 (Other Non-Lymphoid Defects), cache line 3095: 'GATA2 deficiency GATA2 AD 137295', affected cells monocytes and peripheral dendritic cells, affected function multilineage cytopenias, associated features susceptibility to mycobacteria, HPV and histoplasmosis, alveolar proteinosis, MDS/AML/CMML and lymphedema.

    PARTIAL SCOPE, recorded in notes. IUIS names the row generically as 'GATA2 deficiency'; this entry is the Emberger presentation (MONDO:0013540). Emberger is squarely inside the row - lymphedema is named in the row's own associated-features cell, which is why a second evidence item quotes that cell - but it is one presentation among several. MonoMAC syndrome / DCML deficiency (MONDO:0013607) is the other main presentation, is not yet curated, and when it is will share this same Table 5 row rather than take a different one. iuis_category is single-valued and cannot be scoped to a subtype, so the restriction is prose.

    Two evidence items cite PMID:35748970: the GATA2 row itself, and the associated-features cell listing lymphedema. The features quote starts at line 3100 to avoid the fused 'Multi lineage cytopeniasS usceptibility' column boundary on line 3099.


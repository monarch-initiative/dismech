  summary: 'Create: HUPRA Syndrome (SARS2)'
  details: |
    New entry for HUPRA syndrome (MONDO:0013458), caused by biallelic SARS2 (mitochondrial seryl-tRNA synthetase) variants; the stub stubs/Hyperuricemia-pulmonary_Hypertension-renal_Failure-alkalosis_Syndrome.yaml is deleted, and the stub's proposed_name HUPRA_Syndrome is used as the file name, following MELAS_Syndrome and MERRF_Syndrome. It is curated as its own disease, not as a pulmonary hypertension subtype, as the stub and kb/disorders/Pulmonary_hypertension.yaml already argued. Mechanism: serine-tRNA ligase activity (GO:0004828) DECREASED, with poor tRNA binding and charging in vitro (PMID:36350636) and exon 13 skipping by the common missense alleles p.Asp390Gly and p.Arg402His (PMID:42220212); reduced charging and degradation of tRNA-Ser(AGY) (GO:0070158; PMID:21255763, PMID:36350636); impaired mitochondrial translation rescued by wild-type SARS2 in patient iPSCs; oxidative phosphorylation deficiency with a REFUTE item for normal muscle respiratory chain in the Spanish siblings (PMID:24034276); renal tubular energy failure with tubular atrophy, interstitial fibrosis and enlarged tubular mitochondria (PMID:33751860), and a multisystem node for pulmonary hypertension, anemia, failure to thrive, hypotonia and developmental delay (PMID:38264205). 20 phenotypes; frequencies only where the 2021 six-patient review states 'all six' (hyperuricemia, developmental delay, preterm birth) or the cardinal renal failure. Animal model: Sars2 patient-variant mice, embryonic lethal when homozygous (PMID:36350636). The SARS2 splice-variant spastic paresis (PMID:27279129) and the SPG4 modifier finding (PMID:36056923) are noted as out of scope; SARS1 is recorded as a differential to prevent the paralogue confusion. relationship_type UNKNOWN: ClinGen rates SARS2 Moderate for mitochondrial disease (MONDO:0044970). No GeneReviews chapter (offline and online checks). Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (51 snippets, 0 issues), count-verified-snippets 51/51, and the entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype and folded-hyphen checks all pass.

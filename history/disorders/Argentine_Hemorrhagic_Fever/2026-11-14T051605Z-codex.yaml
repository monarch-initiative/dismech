  summary: Create Argentine hemorrhagic fever
  details: >-
    Created a standalone Argentine hemorrhagic fever entry for MONDO:0017874
    from the infectious-disease stub. Curated Junín virus as the
    Mammarenavirus juninense infectious agent, Calomys musculinus and C. laucha
    reservoir hosts, rodent-associated transmission, the prodromal
    immune-plasma treatment window and later neurologic-hemorrhagic phase,
    human transferrin receptor 1 entry, noncytopathic endothelial infection,
    adherens-junction disruption and increased permeability, marrow hypoplasia
    with leukopenia and thrombocytopenia, immune-plasma treatment, and Candid #1
    live-attenuated vaccination from cached PubMed/PMC evidence. Added the
    disease as a member of the viral hemorrhagic fever grouping and removed the
    promoted stub.

    Local adversarial review removed unsupported Candid #1 licensing and vaccine
    target-mechanism wording, reclassified rodent field-study evidence as
    non-clinical, added direct full-text support for aerosolized rodent-excreta
    or contaminated-material exposure, and replaced weak phase-label support for
    abnormal bleeding with direct AHF hemorrhagic-manifestation evidence.

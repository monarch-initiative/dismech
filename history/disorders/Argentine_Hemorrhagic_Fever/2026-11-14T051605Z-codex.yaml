  summary: Create Argentine hemorrhagic fever
  details: >-
    Created a standalone Argentine hemorrhagic fever entry for MONDO:0017874
    from the infectious-disease stub. Curated Junín virus as the
    Mammarenavirus juninense infectious agent, Calomys musculinus and C. laucha
    reservoir hosts, rodent-associated transmission, the prodromal
    immune-plasma treatment window and later neurologic-hemorrhagic phase,
    human transferrin receptor 1 entry, noncytopathic endothelial infection,

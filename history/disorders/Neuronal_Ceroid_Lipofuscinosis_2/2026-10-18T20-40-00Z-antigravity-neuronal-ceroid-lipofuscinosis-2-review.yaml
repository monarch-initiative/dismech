    details: 'Updated Neuronal_Ceroid_Lipofuscinosis_2 (MONDO:0008769) by adding harrisons_chapter
      classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE), binding TPP1 (hgnc:2073)
      and GO:0008240 (tripeptidyl-peptidase activity, modifier: DECREASED) on the
      trigger node TPP1 lysosomal peptidase deficiency, wiring Progressive Neurologic
      Decline and Progressive Retinal Degeneration downstream to all 10 clinical phenotypes
      with edge descriptions, adding Hypokinesia (HP:0002375) and frequency qualifiers
      (VERY_FREQUENT on Ataxia and Myoclonus; FREQUENT on Spasticity and Dystonia),
      adding TPP1 Molecular Genetic Testing (NCIT:C15709) and TPP1 Enzymatic Activity
      Assay (NCIT:C64430) to diagnosis, and adding differential diagnoses for Progressive
      Myoclonus Epilepsy (MONDO:0020074), Infantile NCL / CLN1 (MONDO:0009744), and
      Juvenile NCL / CLN3 (MONDO:0008767).'

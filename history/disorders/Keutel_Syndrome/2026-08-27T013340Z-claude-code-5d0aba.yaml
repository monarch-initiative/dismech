  summary: 'Create: Keutel Syndrome (MGP)'
  details: |
    Curated as part of a sweep to complete ISDS Nosology group 23 coverage. Corresponds to nosology row NOS 23-0040. Keutel syndrome is the mechanistic inverse of the rest of its nosology group - loss of an extracellular inhibitor of mineralization rather than a defect in a biosynthetic pathway - and the entry says so explicitly in the isds_skeletal_category notes rather than leaving the placement unexplained. The Mgp-null mouse is modelled with two readouts on a RECAPITULATES link, with a limitations field recording that the mouse overstates the vascular lethality relative to the human disorder. Serum calcium and phosphate are curated as a diagnostically important negative in the biochemical section. An Epiphyseal Stippling phenotype was added on the strength of the review's description of the brachytelephalangism as involving punctate epiphyses, which is what makes the CDP-group placement substantive. Validated with the batched validate-disorders pass (41 snippets verified). Deleted the corresponding stub.

  summary: 'Create: Hypotrichosis 11 (SNRPE)'
  details: |
    New entry for MONDO:0014027 hypotrichosis 11, built from the founding SNRPE report (PMID:23246290, PMC full text) with background from PMID:36814386. Phenotypes are hair-only (eyebrows, eyelashes, scalp, axillary, complete scalp and body hair loss at the severe end) because the source states skin, nails, teeth and sweating were normal; no frequencies were sourced. The variant node conforms to spliceosome_component_dysfunction#Germline Spliceosome Component Variant. The mis-splicing node was not conformed because minigene and patient-lymphocyte splicing assays showed no major abnormality; this is recorded with the reduced-solubility node (in vitro, including a refuting patient-lymphocyte result) and a KNOWLEDGE_GAP discussion. SNRPE microcephaly reports (PMID:31671093, PMID:36814386) are noted as out of scope for this MONDO term. No deep-research run was made; no ClinGen record exists for SNRPE. Validated with just validate, validate-terms and count-verified-snippets (25/25).

  summary: Address ai4c-reviewer changes on Marshall-Smith_Syndrome (NFIX)
  details: |
    Addressed CHANGES_REQUESTED review on PR #10572. Added reference_title to all 45 evidence items (six cached PMIDs). Regraded two Schanze 2014 in-silico-prediction evidence items from IN_VITRO to COMPUTATIONAL and added directness: INDIRECT on the dominant-negative causal edge. Moved Cardiovascular Surveillance (echocardiography, NCIT:C16525) from treatments into a new diagnosis section and added a molecular genetic testing (NFIX sequencing + MLPA, NCIT:C15709) diagnosis entry per Schanze 2014. Downgraded three single-case-report phenotypes (aortic root dilatation, precocious puberty, craniosynostosis) from OCCASIONAL to VERY_RARE and cited Aggarwal 2017 on the two previously-unsupported dominant-negative causal edges. Added Osteopenia (HP:0000938) and Atypical Behavior (HP:0000708) phenotypes from already-quoted snippets. Added the Nfix-null mouse animal model (PMID:20673863) with three PARTIALLY_RECAPITULATES modeled_mechanisms and a HUMAN_MODEL_MISMATCH discussion recording the loss-of-function vs dominant-negative allelic mismatch. Converted all free-text frequency values to enum keys; completed the references block to all six PMIDs; noted DR provider unavailability. Deep-research providers unavailable (no API keys); no research/ artifact generated. Validated: schema, terms, 45/45 snippets, duplicate-keys, entity-refs, causal-targets, enum-values, snippet-length, snippet-grading all pass.

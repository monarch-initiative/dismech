  summary: 'Create: Marshall-Smith syndrome'
  details: |
    Curated Marshall-Smith syndrome (MONDO:0011244, NFIX hgnc:7788) as a new Disease entry distinct from Malan syndrome. Mechanism: NFIX frameshift/splice-site variants in exons 6-10 (incl. recurrent Alu-mediated exon 6-7 deletion) escape NMD and encode C-terminally altered truncated proteins with preserved DNA-binding/dimerization domain acting in a dominant-negative manner, versus exon-2 haploinsufficiency in Malan syndrome. Five-node pathograph (NMD escape to dominant-negative NFIX dysfunction to dysregulated osseous maturation, impaired neurodevelopment, craniofacial/upper-airway malformation). 18 HPO phenotypes, NFIX genetic block with DOMINANT_NEGATIVE functional_impact_category, NCIT treatments, structured ULTRA_RARE prevalence. Evidence from PMID:20673863 (Malan 2010 mechanism), PMID:24924640 (Schanze 2014 dominant-negative/exon6-7 deletion), PMID:26200704 (Martinez 2015 exon6-10), PMID:20949508 (Shaw 2010 natural history), PMID:28442439 (Aggarwal 2017 precocious puberty/aortic root), PMID:38647663 (Khurana 2024 craniosynostosis). No GeneReviews article exists for MSS. Validated: just validate (35/35 snippets), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values all pass.

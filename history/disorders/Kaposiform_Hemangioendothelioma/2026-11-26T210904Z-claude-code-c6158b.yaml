  summary: 'Kaposiform haemangioendothelioma: imaging findings'
  details: >-
    Added an imaging_findings section with seven rows; each gives the number imaged with each
    modality where the source states it, with methods items quoting it. Ill-defined infiltrative
    mass on MRI (unbound; the notes cite the margin, infiltrat and ill-defined searches and the
    in-branch terms the margin search returned): the 2020 review's ill-defined margins and fat
    stranding, its view of MRI as first-line beside the 2023 authors' view of ultrasound as the
    first choice and its limits, the 12-patient series (8 of 10 locally invasive, 3 well-defined),
    28 of 64 with enhancing infiltrative soft-tissue thickening, and well-defined margins for
    rapidly involuting congenital haemangioma and infantile haemangioma in the 2023 sources. T2
    hyperintense signal (NCIT:C182328 Hyperintensity, with a note on its breadth): T2 hyperintense
    in 64 of 64 with T1 hypo- or isointense, in 9 of 9, and in the 4 with MRI of the 2023 series,
    neither of the last two giving T1; the 2018 series (22 with MRI) differing on T1 and reporting
    speckled hypointense T2 foci in 17 (77%). Heterogeneous contrast enhancement (unbound; the notes
    cite the enhancement search and its eleven in-branch terms): heterogeneous enhancement in 8 of
    10, in 1 of 2 with contrast MRI, and more often diffuse than tufted angioma among 50 with MRI,
    with most infantile haemangiomas enhancing homogeneously according to earlier work cited in
    2023; degree notable in 15 and moderate in 3 of 18; feeding or draining vessels, seen as flow
    voids or linear enhancing vessels, in 15 of the 2018 series on CT or MRI; signal voids in 2
    patients of the 12-patient series (9 with MRI), flow voids in 2 of the 4 with MRI in the 2023
    series, and occasional in the 2023 table. Heterogeneous echogenicity on ultrasound (unbound; the
    notes cite the echo search): ultrasound for small superficial lesions, varying overall
    echogenicity (13, 9 and 4 of the masses in 27 infants, one without a mass; more often hypoechoic
    than tufted angioma), mixed echogenicity in 96.15% of KHE, ill-defined margins in all KHE,
    branch-shaped Doppler flow, both KHE and infantile haemangioma hypervascular, and the 2023
    table. Bone destruction or remodelling (HP:0002797 Osteolysis, covering
    destruction, not remodelling): common in the 2020 review, among the presenting features in 42.2%
    of 64, on MRI in 24 (34%) of 70, and in other series 4 patients of 12 (10 imaged), one
    osteolytic and three eroded or remodelled with the CT findings of the 2018 series (13 with CT),
    and 3 of 12 on CT and 1 of 4 on MRI in the 2023 series; the 2018 authors call CT useful for bone
    and the 2023 authors, citing them, say it shows it better; and, in 12 children with KHE confined
    to bone, permeative osteolysis in 7 (one with both patterns) and cortical excavation in 5,
    mainly metaphyseal (4 of 5), without significant periosteal reaction. Muscle-isodense mass on CT
    (NCIT:C28044 Isointense, covering the unenhanced finding): isoattenuating in the 13 with CT of
    the 2018 series and isodense, about 30 HU, in the 2023 series (12 with CT), with striated,
    lamellar or flocculent arterial-phase enhancement in 10 of 11. Diffusion on diffusion-weighted
    MRI (unbound, as Diffusion Restriction would assert one side; the notes cite
    the diffusion search): slight restriction in 5 masses of the 2018 series, whose authors say a
    low apparent diffusion coefficient helps separate KHE from infantile haemangioma and call for
    larger cohorts, against no significant restriction in the 2023 series. 80 new evidence items;
    six new reference cache files (PMID:28027747, PMID:29536769, PMID:31373042, PMID:36911036,
    PMID:37159688, PMID:41680958); label and enum-membership cache rows for NCIT:C28044.

  summary: 'Kaposiform haemangioendothelioma: the lymphatic programme, lymphoedema
    and how sirolimus acts'
  details: >-
    Deepened the lymphatic programme of the tumour, the signals the sources discuss, the lymphoedema
    it leaves and how sirolimus acts on it. Lymphatic-Type Endothelial Proliferation node: the 2020
    review's marker panel, with VEGFR-3 and LYVE1 (PMID:32014025); CD31 and D2-40 on the spindle
    tumour cells of all lesions examined in a thoracic series of 7 KHEs and 6 kaposiform
    lymphangiomatoses (PMID:31277673; the sentence pools the two diseases); CD31, Ki-67 and LYVE1 on
    CD31-positive cells cultured from three of six patients' tumours (PMID:41122025, IN_VITRO,
    INDIRECT); the review's hedged suggestion that the VEGF-C/VEGFR3 axis may contribute to
    aggressive behaviour (INDIRECT), beside serum VEGF-C lower with the Kasabach-Merritt phenomenon
    against an unstated comparison group (REFUTE, as an inference the authors do not draw, for the
    VEGF-C/VEGFR3 suggestion; INDIRECT as a different compartment, on the unshown premise that serum
    VEGF-C tracks the tumour's axis rather than the coagulopathy, and as reading the phenomenon as
    the aggressive behaviour the review means) and serum angiopoietin-2 raised 14-fold only with the
    phenomenon (INDIRECT), with the review's possibility of a paracrine effect (INDIRECT); the serum
    study's proposal of angiopoietin-2 as a marker of the coagulopathy and the review's further
    possibility, beside the paracrine one, of a role in the phenomenon are cited for the description
    and graded NO_EVIDENCE for the node, since they bear on the phenomenon rather than the
    endothelium (PMID:27990590, PMID:32014025); and the review's own suggested explanation of the
    rise, vascular remodelling such as vessel sprouting and inflammatory lymphangiogenesis
    (INDIRECT). The node's notes say why it is not conformed to the tumor_angiogenesis or
    mtorc1_hyperactivation modules, and that the cited sources name sirolimus as an mTOR inhibitor,
    that the 2020 review places mTOR in general signalling downstream of VEGFR-3, Tie-2 and
    G-protein-coupled receptors, that the platelet study's introduction (2023, PMID:37307200) says
    that variants in GNAQ-family genes and in PIK3CA reported in vascular tumours are supposedly
    associated with VEGF receptor activation and downstream PI3K/Akt/mTOR signalling in lymphatic
    endothelial cells, and that none measures mTOR activity in KHE. The node's edge to Locally
    Infiltrative Tumour Growth: a mouse model in which PROX1 overexpression made
    haemangioendothelioma cells invasive in vivo (MODEL_ORGANISM, INDIRECT; PMID:32014025). Edge
    from Locally Infiltrative Tumour Growth to Chronic Lymphedema: lymphatic stasis within the
    involved lesion and lymphoedema on the side of the lesion in a lymphoscintigraphy series
    (PMID:42701497), lymphoedema in one limb on the side of the tumour in the cohort of 118
    (DOI:10.1186/s13023-020-01595-2, the entry's existing identifier for this paper), both graded
    INDIRECT as spatial associations; the review's hedged mechanism of a tumour of the proximal
    limb, particularly at or near the inguinal or axillary nodes, the hypothesis it reports of
    obstruction during the acute Kasabach-Merritt phenomenon for such tumours, which routes through
    the phenomenon rather than the infiltrative growth, and its addition of inflammation, which it
    elsewhere also raises as a possible contributor to the tumour's aggravation (all INDIRECT); and
    the cohort's finding that, among 118 patients of whom 13 had lymphoedema, the phenomenon and
    sirolimus were not significant predictors, which with 13 cases does not exclude them (REFUTE for
    the obstruction hypothesis rather than the edge; INDIRECT since it tests a history of the
    phenomenon across the cohort rather than acute obstruction in tumours near the nodes).
    Chronic Lymphedema phenotype: the cohort's conclusion that it is a common sequela that can occur
    independently of the phenomenon and of sirolimus (the frequency band still follows the 11%),
    abnormal lymphoscintigraphy with lymphoedema in 22 of 24 limb tumours (INDIRECT for chronicity),
    and follow-up imaging, at an unstated interval, with no significant improvement in drainage in
    five of six (SUPPORT) and normal drainage regained in one (REFUTE), both INDIRECT as imaging
    drainage. Sirolimus target mechanism: a 2025 review's list of possible mechanisms
    (PMID:39369447), the 2020 review's legend placing it beside antilymphatic strategies, serum
    angiopoietin-2 falling after 12 months of treatment in kaposiform lymphangiomatosis and in KHE
    with the phenomenon, reported together, which may track the phenomenon, and ATG9B downregulation
    in cultured tumour-derived cells, all INDIRECT; the review statements this change adds that name
    no data, here and on the lymphoedema edge, are graded OTHER, while items already on the entry
    keep their grades. Descriptions are appended without rewrapping existing lines. 25 new evidence
    items; five new reference cache files (PMID:27990590, PMID:31277673, PMID:39369447,
    PMID:41122025, PMID:42701497). Left out: the platelet step and the Kasabach-Merritt phenomenon
    itself, beyond the serum markers; histology counts from adult series; treatment outcomes. Every
    snippet was checked against its cached source with the reference validator's own normaliser. The
    just validate, validate-terms and count-verified-snippets checks pass.

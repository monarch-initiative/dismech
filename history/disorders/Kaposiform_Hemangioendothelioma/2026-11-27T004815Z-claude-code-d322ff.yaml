  summary: 'Kaposiform haemangioendothelioma: histology and the marker panel'
  details: >-
    Added a histopathology section, before the diagnosis section, with seven rows. The morphology
    rows are infiltrating vascular nodules (the review's hallmark; a 33-case series, three adult
    cases, an eight-case series, and the contrast with kaposiform lymphangiomatosis), bound to
    Multinodular Pattern and marked diagnostic; glomeruloid islands with pericytes, haemosiderin and
    fibrin thrombi, which the 33-case series takes to be the likely sites of platelet consumption,
    bound to Glomeruloid Vessels Present; and lymphatic channels within and around the tumour (22 of
    33 in the 33-case series), bound to Vascular Channel Formation. The marker rows are each bound
    to Immunophenotypic Finding, because NCIT's histopathology branch has no finding term that could
    carry them, having one for CD34 alone and, for HHV-8, only positive-finding terms. They are
    CD31, CD34, FLI1 and ERG, with the adult cases' focal staining and the cells lining their
    slit-like spaces negative for von Willebrand factor; podoplanin (D2-40), PROX1, LYVE-1 and
    VEGFR-3, with where in the tumour each is reported, PROX1-negative pericytic spindle cells, and
    a 314-tumour survey's finding that PROX1 is not specific; absent GLUT1 and Lewis Y, which
    separate KHE from infantile haemangioma; and absent HHV-8, by immunostaining in an eight-case
    series and by RT-PCR in the 33-case series, which with the glomeruloid proliferations tells KHE
    from Kaposi sarcoma. Each binding note gives the NCIT searches behind it. The Kasabach-Merritt
    Syndrome entry keeps its own two histology rows; the nodule and lymphatic-channel rows here
    share a review sentence with each of them. 43 new evidence items; five new reference cache files
    (PMID:9322599, PMID:15105642, PMID:20975337, PMID:22067331, PMID:33722245); one NCIT term added
    to the term caches.

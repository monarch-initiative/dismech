  summary: 'Kaposiform haemangioendothelioma: which tumours go on to the Kasabach-Merritt
    phenomenon'
  details: >-
    Added a progression phase, Kasabach-Merritt phenomenon, between Onset and Outcome. On when it
    starts, it gives a 2018 series of 146 patients (the 146-patient series below) (in 102, 69.9%,
    defined as a platelet count below 100 x 10^9/L; median onset 1 month, at birth in 39.2% of them,
    within 6 months in 91.2%, after 1 year in four, after the lesion was first assessed in 48.0%,
    and before a tumour mass was found in four with deep lesions), a 2013 series of 107 referrals
    (71%, 11% after initial presentation) and a 2024 series of 70 children (78%, defined from
    platelet counts and coagulation indices, thrombocytopenia from a median of 27.8 days, with its
    stage counts adding up to 48), noting that the three rates are not strictly comparable. On which
    tumours develop it, it gives the 146-patient series' definitions of superficial, mixed and deep
    lesions; a younger age at discovery, size and mixed lesion type as the factors that remained
    after adjustment, with the adjusted and the univariate odds ratios each labelled and the rates
    by size band; the trunk only before adjustment, in the authors' words, and head-neck and
    extremity lesions less often; deep lesions as a group not significant, against, by site,
    mediastinal and peritoneal-cavity lesions all with it, 7 of 9 retroperitoneal ones (with the
    authors' caveat, citing an earlier report and graded BACKGROUND, that small retroperitoneal
    lesions without it may go undetected) and none of six confined to bone, joint and muscle, which
    the authors suggest are constrained from expanding and note are smaller; the 2013 series'
    figures, quoted as the abstract words them because it does not say whether they are odds ratios,
    and its finding that tumours limited to bone or presenting after infancy did not develop it; the
    2020 review's size statement, noting that it shares authors with the 146-patient series; and
    that series' limitations. The Thrombocytopenia phenotype adds the 146-patient series' definition
    (DIRECT) and its figure of 102 of 146 (INDIRECT, through that definition), and now says
    thrombocytopenia results from the platelet trapping and consumption. The edge from Locally
    Infiltrative Tumour Growth to Intralesional Platelet Trapping now names the 2013 series for its
    depth and site finding, quotes that series' fold figures as worded, and adds the 146-patient
    series' univariate finding that mixed lesions had about four times the odds of the phenomenon
    that superficial ones had (SUPPORT, INDIRECT). 36 new evidence items; one new reference cache
    file (PMID:29603128). The 2024 series' stage-specific rates (18%, 84%, 74%) are not used as a
    finding on which tumours develop it, because its stage counts (48 with the phenomenon) do not
    match the 78% of 70 it reports elsewhere; the counts are quoted only to show that mismatch.

  summary: 'Kaposiform haemangioendothelioma: trial records'
  details: >-
    Added a clinical_trials section with 13 of the 15 studies that ClinicalTrials.gov returned for
    the condition kaposiform hemangioendothelioma on 26 Nov 2026, leaving out two broad
    observational vascular-anomaly studies: a lymphatic-anomalies registry (NCT02399527) and a
    biomarker study (NCT03001180). Each row gives the registry phase and status, the enrollment
    (actual for completed or terminated studies, planned otherwise), and one evidence item quoting
    the registry's statement of purpose (for NCT07131644, whose summary states no purpose, its
    rationale), graded HUMAN_CLINICAL as the Kasabach-Merritt Syndrome entry grades such
    sentences. The studies: sirolimus in complicated vascular anomalies (NCT00975819); vincristine
    against sirolimus, terminated with 4 (NCT02110069); sirolimus with or without prednisolone in
    KHE with the Kasabach-Merritt phenomenon (NCT03188068); topical tacrolimus for superficial KHE
    and tufted angioma (NCT04056962); low-dose sirolimus (NCT04077515); prednisone shock plus
    sirolimus maintenance (NCT04409691); guided discontinuation against maintenance (NCT04448873);
    different sirolimus concentrations (NCT04775173); percutaneous sirolimus for superficial
    complicated vascular anomalies (NCT04921722); different maintenance doses (NCT05324384);
    vaccination during sirolimus, observational (NCT05351216); three discontinuation strategies
    (NCT07131644); and low- against high-dose sirolimus with prednisolone, phase 2/3 (NCT07656909).
    Five of them are also rows on the Kasabach-Merritt Syndrome entry (NCT02110069, NCT03188068,
    NCT04077515, NCT04448873, NCT04775173). The clinicaltrials-status-audit recipe found no status
    or phase drift. The entry's closing notes now say that this entry holds its own trial records,
    five of them also rows on that entry, instead of placing the trial records there. 13 new
    evidence items; seven new reference cache files (NCT04056962, NCT04409691, NCT04921722,
    NCT05324384, NCT05351216, NCT07131644, NCT07656909); the other six records were already cached.

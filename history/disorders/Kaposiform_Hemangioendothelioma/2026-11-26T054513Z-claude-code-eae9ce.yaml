  summary: 'Kaposiform haemangioendothelioma: joint motion, pain and bone changes'
  details: >-
    Added the musculoskeletal course of KHE without the Kasabach-Merritt phenomenon, from a 2018
    cohort of 29 such patients selected for decreased joint motion (PMID:30233248, full text). New
    phenotype row Limited Joint Range of Motion (HP:0001376 Limitation of joint mobility), with the
    cohort's selection and definition as methods items, onset within 2 years of KHE onset in 72.4%,
    onset after the first evaluation in 8, onset before the age of 12 months in only 2, the sites
    (of the 29 lesions, 26 involving the limbs; of all 29, 10 mixed-type lesions infiltrating
    muscle, bone and joints and 17 confined to the muscle, bone and joint regions; the knee, then
    shoulder and hip, as the joints the lesions most often involved), decreased motion in patients
    with partial involution, the authors' caveat that the cause is uncertain (SUPPORT, for the
    description's statement of it), their cited account of infiltration leading to fibrosis and
    joint contracture (BACKGROUND, INDIRECT), and their reading that it may be common without the
    phenomenon, with the selection stated in its explanation. A new causal edge from Locally
    Infiltrative Tumour Growth to the new row (INDIRECT_UNKNOWN_INTERMEDIATES) carries where the
    cohort's limb lesions sat (mostly on or next to large joints, in a cohort where every patient
    had lost motion) and the cited fibrosis route, both INDIRECT, and the authors' caveat that the
    cause is uncertain; the node's description gains one sentence on it. In the Pain row, chronic
    pain in 12 of the 29, including 4 of the 5 with spinal lesions, with the cohort's definition. In
    the Bone Destruction row, bone and joint changes, including erosion or destruction, in 22 of the
    29, the source giving no separate count for erosion or destruction (INDIRECT, as the figure
    pools changes of any kind), and a 2022 bone series' background that spread into bone is
    relatively common and primary bone disease rare (PMID:34606171, INDIRECT). In the outcome phase,
    the cohort's cited statements that residual tumour persists after long-term treatment in most
    patients and becomes fibrotic (BACKGROUND), and one patient whose joint motion fell after
    sirolimus was stopped and improved on further courses. This leaves out the authors' suspicion
    that decreased motion may be an independent complication of therapy, since the sentence does not
    make clear whether it means a complication of treatment or one independent of it;
    retroperitoneal and chest disease; the cohort's disability scores, which describe a cohort
    selected for the finding; and a clinical_burden section, for which no source in this change
    gives population-level figures. 23 new evidence items; two new reference cache files
    (PMID:30233248, PMID:34606171).

  summary: 'Create: Kaposiform Hemangioendothelioma'
  details: |
    New entry for kaposiform hemangioendothelioma (MONDO:0016236), a rare, locally aggressive
    vascular tumour of infancy and early childhood. Curated by hand from cached sources: a 2020
    review (full text), a 2024 single-centre cohort of 70 children (full text), a 2023
    platelet-function study (full text), the 2013 Boston series of 107 patients, a 2021 MRI
    series of 64, the 2016 GNA14 discovery study, a 2019 tufted angioma case, a 2020 sequencing
    and methylation series, the 2022 randomised trial of sirolimus with and without
    prednisolone, a 2025 randomised non-inferiority trial of low- against high-dose sirolimus, a
    2023 long-term sirolimus cohort of 167, a 2024 multicentre cohort of 159 that pools KHE with
    tufted angioma, a 2020 chronic lymphoedema cohort of 118, a 2022 quality-of-life study and a
    2025 consensus statement. The entry is cut around Kasabach-Merritt_Syndrome, which keeps the
    platelet-trapping mechanism, its treatment and the trial records; here the platelet step
    only hands over to that entry, and every sentence quoted in both entries carries the same
    evidence_source in both. The chain runs from a GNA14 node for tumours carrying a somatic
    activating variant (one KHE in the cited studies; it is not marked as the cancer-origin
    node, because the variant's causal role is open, and its causal edge belongs to an emerging
    mechanistic hypothesis; no cell is bound, because the cited sources do not establish in
    which cell the variant arises; the node binds G protein-coupled receptor binding, which the
    review states for the GNAQ family) through lymphatic-type endothelial proliferation and
    local infiltration to the mass, pain, joint involvement, bone destruction, chronic
    lymphoedema and the platelet step. GNA14 is recorded as DISPUTED: one KHE in the discovery
    study, none in a later series of five, and the review calls causation unknown;
    Kasabach-Merritt_Syndrome records it as a somatic driver. Seven phenotype rows name the
    cohort behind each frequency, because the series disagree, notably on how often the
    Kasabach-Merritt phenomenon occurs (42% to 78% in the KHE series cited). Diagnosis rows
    cover MRI and biopsy with immunohistochemistry; treatment rows cover sirolimus (two
    randomised trials, of sirolimus with and without prednisolone and of low- against high-dose
    sirolimus), corticosteroids, vincristine and surgery, each linked to a node: sirolimus,
    vincristine and surgery to the tumour nodes they act on, corticosteroids to the platelet
    trapping they are given for. Onset and outcome phases, an incidence row and a prevalence row
    complete it. The deep-research report generated for this entry was used as a lead and is not
    committed. Validated with just validate and count-verified-snippets (102 of 102).

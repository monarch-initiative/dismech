  summary: 'Kaposiform haemangioendothelioma: tufted angioma, one spectrum or two'
  details: >-
    Recorded how kaposiform haemangioendothelioma relates to tufted angioma. A mondo_mappings row
    maps tufted angioma (MONDO:0011927) as skos:relatedMatch rather than adding it as a subtype: on
    the spectrum reading the two are forms of one neoplasm, of which this entry covers the KHE form,
    and on the other they are separate diseases, so neither class is narrower. Two hypotheses record
    those readings. tufted_angioma_one_spectrum (CANONICAL) rests on the 2020 review, the
    Kasabach-Merritt phenomenon being defined as arising only with these two tumours, the WHO
    classification as a 2026 series and the eight-case series describe it (the one as suggesting
    they may be manifestations or stages of one tumour, the other as having combined them), a
    methylation study of 7 KHE and 3 tufted angiomas, the shared endothelial immunophenotype and a
    PROX1 study's reading of it, a 2003 report of one tumour changing between the two, a 2023 letter
    on tufted angioma after a treated KHE, and a 2022 review of the literature in which four of five
    comparative studies from 2019 to 2022 consider them one spectrum. tufted_angioma_two_diseases
    (ALTERNATIVE) rests on the 2003 report's statement that the classification then in use kept them
    apart, the one study in that review treating them as different (with the same sentence, which
    reports four studies the other way, also cited against it), the eight-case series' treatment of
    tufted angioma as a benign tumour to tell KHE apart from, and differences in location,
    behaviour, histology and imaging, which the hypothesis notes fit a spectrum as well. Both
    hypotheses say that no causal edge opts in to them. A CONTROVERSY discussion attaches to both.
    25 new evidence items; three new reference cache files
    (PMID:12771476, PMID:36604299, PMID:37497531); one MONDO term added to the term caches.

  summary: 'Codes and mappings: NCIT and ICD-11 Foundation, with ICD-O and ICD-10-CM
    left unbound'
  details: |
    Two disease codes added, each read at its own source, two left unbound with the reason recorded
    in the entry's notes, and a classifications block carrying harrisons_chapter
    ONCOLOGY_HEMATOLOGY, the entry having had no classifications block at all: the tumour is a
    neoplasm, and Harrison's files neoplastic disease under its oncology and haematology Part. The
    ICD-O morphology slot inside that same block is deliberately left unset, for the reason below.

    NCIT:C27510 is an exact match: NCIT carries a term for the disease itself rather than for a
    broader soft-tissue class. The ICD-11 mapping is icd11f:248477855, and it is deliberately
    neither of the two ICD-11 codes Orphanet lists against ORPHA:2122. Orphanet gives 2F72.Y, graded
    Narrower, and XH6PA4, graded Exact; neither is a numeric ICD-11 Foundation identifier of the
    kind this slot takes, and neither resolves in the Foundation build. The Foundation identifier
    used here was chosen because its own label is the disease name. The Foundation identifier was
    found by searching the British spelling, haemangioendothelioma, which is how the Foundation
    spells it; the American spelling returns nothing.

    ICD-O morphology is left unset because the enum carries no vascular or endothelial family. of
    its 23 values Sarcoma and Pericytic Neoplasm are the nearest, and neither describes an
    endothelial neoplasm of the intermediate behaviour the cited review reports. No ICD-O morphology
    code is asserted anywhere in this change. ICD-10-CM is left unmapped. ICD-10-CM has no entry for
    the tumour: searching the build for kaposiform, for hemangioendothelioma, for
    haemangioendothelioma and for the bare stem angioendothelioma each returns nothing - both
    spellings were run, because for a US clinical modification the American one is the spelling that
    could have matched. Its nearest code is C49.9, "Malignant neoplasm of connective and soft
    tissue, unspecified", where the entry's own cited review calls the tumour an intermediate type
    with locally aggressive characteristics. The entry's notes name every query behind this, so a
    reader can re-run them. Orphanet maps ORPHA:2122 to ICD-10 C49.9 and grades it Narrower, but
    ICD-10 and ICD-10-CM are different code systems, so that grading is context here and not the
    basis for the decision. Orphanet states a grade and gives no reason for it; no motive is
    attributed to it.

    The Orphanet record was built from the Orphadata XML and read, which was the first question: an
    Orphanet record is only worth transcribing if it carries rows, and this one does. It has rows:
    one epidemiology row, one gene, fourteen phenotypes and eight cross-references. It is committed
    with the change. No evidence item cites it, but the entry's notes make a checkable claim about
    what it records, and the row counts above are read off it, so a reader needs it in order to
    check either. The mappings were verified at NCIT and the ICD-11 Foundation rather than taken
    from Orphanet, and the incidence figure was already curated from PMID:32014025; Orphanet's
    single epidemiology row states no figure at all.

    Two things read but not acted on, left for whoever next curates this entry's phenotypes.
    Orphanet gives fourteen phenotype rows, each with a frequency band, and it gives "Age of onset:
    All ages". That is not in conflict with the cited review's "typically diagnosed in infancy or
    early childhood": the same review records the adult cases, attributing them to an inciting event
    such as trauma or pregnancy. The two differ in emphasis, not in substance. The GNA14 gene row
    Orphanet carries is out of scope here, this change covers codes and mappings, not the entry's
    genetics.

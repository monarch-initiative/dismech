  summary: 'Kaposiform haemangioendothelioma: older treatments and their harms'
  details: >-
    Extended the treatment rows. Corticosteroids: the 2020 review's doses; one cohort's dosing,
    whose discussion allows 5 to 6 mg/kg a day of methylprednisolone for extreme cases while its
    results list that dose, a haemostatic or immunoglobulin among the treatments given before
    surgery to every child with the Kasabach-Merritt phenomenon who was operated on, and whose
    abstract says 89% of those operated on had high-dose methylprednisolone beforehand; the review's
    recommendation of corticosteroids with vincristine or sirolimus for the severe phenomenon, and
    its note that the 2013 consensus recommendations rest on expert opinion; the harms of long-term
    use, from the review and from the 21-child series; weaning as soon as feasible; and the
    VASCERN-VASCA pathway's advice to taper them once the phenomenon has resolved. Vincristine: the
    review's dose of 0.05 mg/kg once a week, also recorded as the dosing interval; the
    consensus-derived first-line recommendation, the same expert-opinion caveat, and the later
    preference for sirolimus with corticosteroids; the central line it needs; its place in the
    VASCERN-VASCA pathway (a lesion compressing vital structures or in a life-threatening site,
    failure of sirolimus and corticosteroids, a tumour without the phenomenon that has not responded
    once the diagnosis is re-confirmed, and when to stop it); the review's mounting evidence that it
    fails alone in very severe disease; a single-centre series of 21 children (PMID:42246503), with
    its protocol, response, duration and recurrence figures, its 3 children with the severe
    phenomenon who began vincristine, its complications, its acknowledged preference for
    vincristine, and its account of how vincristine acts on the endothelial-proliferation step; and
    another cohort's statement that vincristine is given after corticosteroids fail but not
    routinely, because of its complications. Surgical resection: when the review and the pathway
    consider it, the risks during the active phenomenon, the review's separate point that
    manipulating the tumour can set off the phenomenon, surgery for residual tissue, one cohort's
    preparation of children with the phenomenon, outcomes in two cohorts and recurrence in
    one. New rows: antiplatelet agents (ticlopidine and aspirin, linked to the platelet-trapping
    step, with the pathway's caveat in the row); interferon alfa (variable response, spastic
    diplegia, not under one year of age); propranolol (variable response, not alone in the
    phenomenon); and transarterial embolisation (linked to the infiltrative-growth step). Interferon
    alfa and propranolol carry no target mechanism, since none of the cited sources says how they
    act in KHE. The 2013 consensus (PMID:23796341) is cited only through the review, because its
    PubMed record has no abstract. 72 new evidence items; two new reference cache files
    (PMID:41389323, PMID:42246503); one CHEBI term (ticlopidine) added to the term caches.

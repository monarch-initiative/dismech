  summary: 'Kaposiform haemangioendothelioma: differential diagnoses'
  details: >-
    Added a differential_diagnoses section with eight rows. Seven give distinguishing features; the
    neuroblastoma row records only that the two are hard to tell apart before surgery. Infantile
    haemangioma (MONDO:0011191 capillary infantile hemangioma, the class the Infantile_Hemangioma
    entry binds; the label search is in the row's notes): growth at about 5.5 to 7.5 weeks, GLUT1
    usually expressed and Lewis Y antigen named as an infantile haemangioma marker, KHE nodules
    negative for both with the authors' conclusion that these stains separate the two, no rounded
    nodules and no Kasabach-Merritt phenomenon, and a KHE first misdiagnosed as it.
    Congenital haemangioma (MONDO:0018715): its three forms, fully formed at birth with no
    progressive growth after it, mild consumption of clotting factors without bleeding that tends to
    resolve, one rapidly involuting case with profound transient thrombocytopenia and reports of
    severe, life-threatening phenomenon, a 2014 report naming KHE and tufted angioma as associated
    with the phenomenon beside the 2023 report's under 10% of congenital haemangiomas against 42% to
    71% of KHE, and, for the rapidly involuting form, no lymphatic markers.
    Tufted angioma (MONDO:0011927): imaging differences in 21 tufted angiomas and 40 KHE, the 2020
    review's definition of the phenomenon limited to the two tumours, its dermal histology, the view
    that the two are ends of one spectrum, and the 2021 series' report that the WHO soft-tissue
    classification has combined them. Kaposiform lymphangiomatosis (MONDO:0018736): multifocal or
    diffuse thoracic, abdominal and bone disease, later presentation with findings common to both in
    a 2019 thoracic series, shared spindled cells but a different arrangement, NRAS p.Q61R absent in
    KHE, less response to treatment in the 2019 series, and the two sources that disagree on how
    severe its thrombocytopenia is, both given. Venous malformation (no disease_term; the notes give
    the full label-and-synonym search and why MONDO:0003083 venous hemangioma, which has Venous
    malformation as an exact synonym but is defined as a benign tumour, is not used): the localized
    intravascular coagulopathy once misdiagnosed as Kasabach-Merritt syndrome, raised D-dimer shared
    with the phenomenon, the sources' two accounts of fibrinogen (low in a 2002 series and the 2020
    review; reduced in 3 of 29 in a 2022 study, two with signs of disseminated intravascular
    coagulation), normal or slightly low platelets, conversion to disseminated intravascular
    coagulation after triggering events, no ecchymotic tumour, its lifelong course and different
    treatment, and its histology. Infantile fibrosarcoma (MONDO:0004557 congenital fibrosarcoma,
    with infantile fibrosarcoma as an exact synonym, noted in the row): frequent misdiagnosis as
    haemangioma or KHE, a rare coagulopathy, a case first taken for KHE with the phenomenon in which
    the laboratory studies suggested disseminated intravascular coagulation, and a 2019 case with
    disseminated intravascular coagulopathy whose authors suggest a Kasabach-Merritt-like mechanism.
    Kaposi sarcoma (MONDO:0005055): Kaposi-like areas, HHV-8 positive in Kaposi sarcoma, and HHV-8
    not found in 3 and in 7 KHE. Neuroblastoma (MONDO:0005072): deep KHE with spinal involvement and
    no phenomenon is hard to tell before surgery from metastatic neuroblastoma or sarcoma. The
    infantile fibrosarcoma row leaves out the gene-fusion findings of its sources. 64 new evidence
    items; eleven new reference cache files (PMID:12181029, PMID:15105642, PMID:22937785,
    PMID:24252784, PMID:31373042, PMID:31956645, PMID:33722245, PMID:35834223, PMID:36551267,
    PMID:36911036, PMID:39528249); new cache rows for MONDO:0011927 and MONDO:0018736.

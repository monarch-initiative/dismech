  summary: 'Kaposiform haemangioendothelioma: sirolimus dose, stopping, relapse and harms'
  details: >-
    Deepened the Sirolimus treatment row: dose, trough levels, the prednisolone add-on, stopping and
    relapse, and harms. On dose and levels, a trough-level series of 21 patients, started on
    sirolimus alone once there was no sign of the Kasabach-Merritt phenomenon (0.8 mg/m2 twice a
    day; faster shrinkage above 10 ng/mL and no further gain above 15, in groups of 8, 7 and 6;
    PMID:33932303, its dosing and efficacy-measure sentences cited as methods items); the high- and
    low-dose trial's trough targets and endpoint (methods items) and its similar total and serious
    adverse events with fewer respiratory, skin and mucosal ones at the lower target
    (PMID:40107509); and a pharmacokinetic model of 17 children in which apparent clearance rose
    with age and was higher in boys, which the authors put down to body weight (PMID:31452734,
    COMPUTATIONAL). On the prednisolone add-on, in the patients with the phenomenon of a 52-patient
    series, no significant difference in tumour shrinkage between the 21 given prednisolone for
    severe symptoms and those on sirolimus alone (PMID:28486787), beside the randomised trial's
    better lesion responses at month 12 (DOI:10.1182/blood.2021014027). On stopping, rebound growth
    in 17.3% of the patients of the cohort of 167 who stopped sirolimus, the abstract not saying how
    many stopped, with early discontinuation and mixed lesion type (DOI:10.1002/ijc.34509), beside a
    series of 26, 25 of them with the phenomenon, with no recurrence over a median follow-up of 32
    months (PMID:31489702). The cohort's statement that nonresponse, relapse and long-term sequelae
    remained is graded REFUTE, for sirolimus as a complete answer in every patient. On harms,
    serious adverse events mostly in the first year and no unacceptable cumulative toxicity, total
    and grade 3-4 adverse events similar with and without prednisolone in the randomised trial, no
    permanent discontinuation for toxicity in the 52-patient series, mild side effects in the
    26-patient series, and Pneumocystis pneumonia with respiratory failure in an infant on sirolimus
    and a prednisolone taper, with the case report's advice on prophylaxis (PMID:29610164). Added
    dosing_interval (twice a day) with dosing_interval_days (0.5) and four effect_modifiers, each a
    cross-stratum comparison the source states: durable response by the phenomenon (no difference),
    response over 12 months without the phenomenon (smaller; the strata also differ in age and
    prednisolone, quoted), severe complications in boys (larger) and response of centrally placed
    tumours (larger, with the series' efficacy measure, speed of shrinkage, quoted). This change
    adds no platelet or fibrinogen responses; those belong to the Kasabach-Merritt entry. 33 new
    evidence items; five new reference cache files (PMID:28486787, PMID:29610164, PMID:31452734,
    PMID:31489702, PMID:33932303).

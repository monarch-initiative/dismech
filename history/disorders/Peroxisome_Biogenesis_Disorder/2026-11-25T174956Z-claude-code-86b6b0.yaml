  summary: 'Gene-family review: PEX1, PEX2, PEX3, PEX5, PEX6, PEX7, PEX10, PEX11B,
    PEX12, PEX13, PEX14, PEX16, PEX19, PEX26'
  details: |
    The single 'Peroxisome Biogenesis Defect' node carried all fourteen PEX genes with two molecular functions (peroxisome signal sequence receptor activity and protein-macromolecule adaptor activity) that are true of only a few of them. It is split into seven module nodes, each binding the activity of its own peroxins and feeding the retained hub node: PTS receptor recognition (PEX5, PEX7; GO:0000268; PMID:24662292, PMID:9090381), docking and translocation (PEX14 docking adaptor GO:0030674, PMID:19197237; PEX13 YG-domain conduit GO:0008320, PMID:36520918), the RING ligase and retrotranslocation channel (PEX2, PEX10, PEX12; GO:0061630 and GO:0008320; PMID:35768507, PMID:24662292), export membrane anchoring (PEX26; GO:0043495; PMID:12717447), the export AAA ATPase (PEX1, PEX6; GO:0016887; PMID:29884772, PMID:31652724), membrane protein insertion (PEX19 carrier GO:0140597, PMID:14709540; PEX3 and PEX16 docking GO:0043495, PMID:15007061, PMID:19114594) and division (PEX11B membrane bending GO:0180020; PMID:25910939, PMID:21113128). The fourteen genetic records are typed CAUSATIVE with germline origin, and each carries the ClinGen Definitive classification for MONDO:0019234 that its record already cited. The gene-less 'Other PEX Genes' record was removed because all fourteen PBD genes now have their own records; its evidence included a fungal PEX review. The disease-level autosomal recessive inheritance block is now bound to HP:0000007.

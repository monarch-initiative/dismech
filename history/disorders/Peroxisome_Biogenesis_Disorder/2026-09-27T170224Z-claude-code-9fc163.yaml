  details: |
    Genetics-gap issue 12275. MONDO:0100272 peroxisome biogenesis disorder due to PEX7 defect is a descendant of this entry's MONDO:0019234 anchor through MONDO:0100322 non-Zellweger spectrum disorder, and is recorded as a skos:narrowMatch. It is a grouping rather than a leaf: its two children are MONDO:0008972, bound as the disease_term of Rhizomelic_Chondrodysplasia_Punctata_Type_1, and MONDO:0100307, bound on the Type 2 row of Adult_Refsum_Disease, so both phenotypes are curated at their own entries while PEX7 as a gene stays here, which is the routing the notes of Zellweger_Spectrum_Disorders already described. Separately, five PEX genes were named in genetic records but bound on no node: PEX3, PEX16, PEX19, PEX14 and PEX11B were added to the Peroxisome Biogenesis Defect node, whose own cited snippet covers membrane assembly, matrix-protein import and peroxisome division. Gene wiring went 9/15 to 14/15 as measured by gene_mechanism_wiring_coverage; the remaining record is Other PEX Genes, a deliberately multi-gene record with no gene_term and so structurally unwireable. Phenotype inlink 15/15. No references fetched. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

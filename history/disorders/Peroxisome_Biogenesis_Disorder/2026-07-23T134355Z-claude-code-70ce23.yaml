  summary: Deep evidence review of peroxisome biogenesis disorder entry; fixed misapplied
    evidence, term binding, and prevalence
  details: |
    Manual claim-by-claim review (no scripting) of every evidence item against its cached abstract and against the claim it supports. Fixes applied: (1) Prevalence — removed misapplied PMID:34628380 evidence (a generic 'rare diseases ~2 per 10,000' definition that does not support an ultra-rare PBD-specific claim and is internally inconsistent with ULTRA_RARE); migrated deprecated free-text 'percentage: Very Rare' to structured Prevalence slots (population Japan, measure_type BIRTH_PREVALENCE, prevalence_class BAND_1_9_PER_1000000, rate_per_100000 0.125) anchored on the verified PMID:8914632 1-in-800,000 Japanese birth-incidence figure. (2) Renal Dysfunction phenotype — corrected term binding from HP:0012622 (Chronic kidney disease) to HP:0012211 (Abnormal renal physiology) to match preferred_term; CKD is not the characteristic renal lesion of ZSD (cysts/oxalate stones). (3) Chondrodysplasia Punctata phenotype — added missing ontology term HP:0010655 (Epiphyseal stippling), consistent with the ZSD and RCDP1 sibling entries. (4) Cardiomyopathy phenotype — removed two misapplied evidence items (PMID:25465824 on primary mitochondrial disorders; PMID:36870438 a generic pediatric-cardiomyopathy overview) whose own explanations conceded they do not mention PBD; replaced with an honest note (cardiac involvement in ZSD is mainly congenital heart disease in a minority; cardiomyopathy uncommon) and flagged the evidence gap. (5) Heart Failure phenotype — downgraded from an unsupported FREQUENT to OCCASIONAL with a note (modeled as a sequela of the uncommon cardiomyopathy). (6) Thrombocytopenia — added note clarifying it is secondary to hepatic dysfunction/coagulopathy and that a directly supporting citation is an outstanding gap. (7) Added CHEBI bindings to previously untyped chemical entities (VLCFAs CHEBI:27283, Bile Acid Intermediates CHEBI:3098, Plasmalogen CHEBI:64611) to match the ZSD entry. All reference snippets confirmed genuine substrings of cached abstracts via linkml-reference-validator (no fabrication found). Schema, term, reference, and causal-graph validation all pass post-edit. Outstanding items filed as GitHub issues: PBD cardiac-involvement evidence gap and thrombocytopenia evidence gap.

  summary: 'Create: Talc Pneumoconiosis'
  details: |
    New Disease entry for pneumoconiosis due to talc (MONDO:0001003), curated as two has_subtypes because the two exposure routes produce anatomically distinct disease: Inhalational Talcosis (occupational or heavy cosmetic dust, centrilobular and interstitial granulomas with stellate fibrosis) and Intravascular Talcosis (injected crushed-tablet excipients, perivascular granulomas progressing to pulmonary arterial hypertension).

    Deep research: Edison Falcon (research/Talc_Pneumoconiosis-deep-research-falcon.md, 11/11 references verified, confabulation_rate 0.0). needs_review was set for one off-topic reference and a label variant, neither a content defect. The report was unusually disciplined and shaped three decisions in this entry: it insisted that findings from intravenous cases must not be assigned to inhalational disease, it flagged the quartz/asbestos contamination attribution problem, and it warned explicitly that TNF, IL-1-beta/NLRP3, MAPK, PI3K-AKT, mTOR, Wnt and TGF-beta contributions in human talc pneumoconiosis are inferred from other pneumoconioses rather than demonstrated, and that silicosis or pleural-instillation findings must not be imported. All three warnings were acted on. The report was used as a lead set only; every citation was re-fetched and snippet-verified and every CURIE was looked up in OAK while writing.

    Pathograph: 6 nodes in two branches, each rooted at its own environmental exposure link, no orphans. Inhalational: respirable talc deposition -> alveolar macrophage uptake with impaired clearance -> foreign-body giant cell granuloma formation -> stellate centrilobular interstitial fibrosis -> dyspnea, pulmonary fibrosis, reduced FEV1. Intravascular: excipient embolization -> perivascular foreign-body granulomatosis -> pulmonary arterial hypertension.

    The central curation problem is attribution, and it is recorded as a CONTROVERSY discussion rather than resolved. Commercial respirable talc is a mineral mixture including tremolite, anthophyllite and quartz, and the pneumoconiosis mortality excess was highest where quartz content was higher (SMR 7.90 in miners), which is what a contaminant effect would look like. Against a pure-contaminant reading, the Wegman Vermont cohort was exposed to ore explicitly free of asbestos and silica and still showed radiographic opacities in never-smokers plus an exposure effect on lung function after smoking adjustment, and the hamster instillation study characterized its material with asbestos and quartz below detection. The entry therefore asserts a talc-attributable mechanism while recording that the occupational disease burden cannot be attributed to talc alone from the available cohorts. The discussion attaches to the deposition and fibrosis nodes.

    Other deliberate decisions, recorded in notes: (1) No FrequencyEnum bands on any phenotype; the quantitative human data are cohort counts (12 of 116 workers with opacities in one mine) and pooled standardized mortality ratios, neither of which is a phenotype frequency among affected individuals. (2) No genetic section; the disease is defined entirely by exposure. (3) No signalling pathway asserted, per the report's warning. The one in-vitro PI3K study is deliberately not cited as a mechanism of this disease because it used lung carcinoma cells in a pleurodesis context. (4) The intravascular branch is described as an excipient mixture rather than talc alone, since crushed tablets also deliver microcrystalline cellulose and crospovidone and a birefringent particle does not identify which one caused the lesion. (5) Two edges carry directness: INDIRECT where the source argues a preventive point rather than measuring an effect.

    animal_models carries the hamster intratracheal instillation model wired to the macrophage-clearance node with a phagocytosis readout, and limitations recording that instillation is not inhalation, the follow-up was 14 days against a human disease of years, only male animals were used, and hamster clearance differs from human.

    One error caught during curation: the reference_title for PMID:36287869 had 'of Cohort Studies' appended, which is not in the real title. A scripted audit of every reference_title against its own cache file caught it across 4 occurrences; it was replaced from the cache by script, and a re-run reports 7/7 titles matching.

    Validation run and read: just validate-disorders (60 snippets, 67 titles, 0 issues), just validate-terms (passed), just count-verified-snippets (60/60), just check-entity-refs (OK), just check-causal-targets (no new broken targets), just check-duplicate-keys (OK), just check-qualifier-terms (3 labels match cache). New terms were seeded by pointing conf/oak_config.yaml at local sqlite adapters for the validator run and then restoring it; conf/ is unmodified in the diff.

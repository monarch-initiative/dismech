  summary: 'Review round 3: drop the unsupported ambient-exposure mechanism link'
  details: |
    Two reviews landed against the same commit four minutes apart. Only the first was read and acted on in the previous round, so two findings from the second survived into that commit; both are fixed here. First, the ambient entry described fibrous talc as present at higher counts in urban than rural cases. The abstract supports a narrower comparison: counts in urban lung cancer cases were greater than in urban non-cancer, rural cancer and rural non-cancer cases. It never compares urban non-cancer with rural, so the original sentence converted a cancer-stratified finding into a general urban-versus-rural excess. The description and the evidence explanation now state the actual comparison and say explicitly that it does not establish a general urban excess. Second, the previous round weakened the environmental_effect from PREDISPOSES to MODULATES but left causal_link_type DIRECT in place underneath it, which is the same overclaim in a different field. Rather than weaken that field, the influences_mechanisms link was dropped entirely, which was the reviewer's stated preference and is the honest outcome: the source is a case-control count of lung fibres that does not identify ambient air as the route and says nothing about this disease, so an edge into the deposition node would contribute a claim rather than evidence. The entry is retained as context for non-occupational exposure, with a notes block recording that it deliberately carries no mechanism link and why, and the evidence explanation no longer says the study establishes ambient exposure as the source of the talc. The entry was also renamed from Ambient urban fibrous talc to Ambient fibrous talc in non-occupationally exposed lungs, since the urban attribution was the part the source does not support. The two suggestions in that second review, regrading the OTHER plus BACKGROUND items and strengthening the pulmonary hypertension support with the biopsy-confirmed paediatric case, were already completed in the previous round. Re-validated: 98 snippets, 108 titles, 0 issues; term validation passed.

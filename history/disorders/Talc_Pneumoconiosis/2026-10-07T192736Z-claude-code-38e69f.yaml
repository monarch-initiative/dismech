  summary: Enrich with non-occupational exposure routes and inhalational mechanism
    evidence
  details: |
    Enrichment pass requested after approval, drawing on three further references (PMID:34401315 cosmetic talcum powder case, PMID:27446215 immunocompromised cosmetic-talc case, PMID:9222135 urban non-occupational lung-burden study), all fetched into references_cache with full text for the first two. Two new environmental entries record exposure routes the entry did not model: non-occupational inhalation of cosmetic and household talcum powder, TRIGGERS on the deposition node with two case histories, and ambient urban fibrous talc, PREDISPOSES on the same node because the study measured lung burden without talcosis. Both are inhalational and are curated under the existing inhalational subtype rather than as new subtypes; the notes record that neither source claims cosmetic talc is hazardous in ordinary use and that the urban study's lung-cancer suggestion is graded NO_EVIDENCE because it concerns a different disease this entry asserts nothing about. Several claims that previously rested on intravenous case reports now carry inhalational evidence: the clearance-failure step on the macrophage node, granuloma formation and the granuloma-to-fibrosis edge, the fibrotic histological patterns, and the Dyspnea and Cough phenotypes. Two phenotypes were unscoped as a result: centrilobular nodules on computed tomography, since the inhalational distribution is upper-lobe predominant while the intravascular one spares the subpleural regions and fissures, and pulmonary arterial hypertension, since severe pulmonary hypertension is documented in an inhaled-cosmetic-talc case. Cough was wired downstream of the fibrosis node, closing the one phenotype left with no incoming edge after the review round. A latency progression phase records the months-to-four-decades range. The cessation treatment carries a REFUTE item stating that disease may progress after all exposure has ceased, so it is not read as disease-modifying. Re-validated: 98 snippets, 108 titles, 0 issues; term validation passed; 8 of 9 phenotypes causally connected, the exception being panacinar emphysema, left unwired because no mechanism for it is established here.

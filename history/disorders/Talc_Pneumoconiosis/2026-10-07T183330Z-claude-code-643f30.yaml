  summary: 'Review round 1: separate intravenous evidence from the inhalational chain'
  details: |
    Addressed all three blocking findings and every suggestion from the first review. Blocking: (1) three items in the inhalational chain were supported by intravenous case reports, which the entry's own notes said must not happen. The giant-cell granuloma node now rests on the occupational histology item plus the hamster giant-cell observation; the granuloma-to-Granulomatosis edge uses the occupational histology sentence instead of an intravenous computed tomography finding; the fibrosis-to-Dyspnea edge uses the occupational-lung-disease symptom sentence graded INDIRECT instead of a methadone case. (2) The intravascular progression phase quoted a pulmonary-function sentence that did not support stability over years; it now quotes the three-year follow-up sentence and carries a REFUTE counterweight from the review stating that most patients decline progressively, with the phase renamed from Stable to Variable course and the notes rewritten accordingly. (3) The cessation treatment's disease-level evidence now quotes the cessation recommendations directly from both sources, with the explanation recording that the explicit recommendation comes from the intravenous literature while the occupational arm rests on the dust-level item. Suggestions taken: the truncated sildenafil snippet extended to symptomatic improvement in both places; the pulmonary-hypertension mechanism link now cites the general vasodilator statement rather than one patient's regimen; the macrophage node carries the bronchoalveolar lavage inflammation result that its macrophage-activation term rests on; the loose Pulmonary infiltrates binding replaced by a radiographic-opacities phenotype bound to HP:0002207 plus a new intravascular computed-tomography nodule phenotype bound to HP:0025392, both now wired into the pathograph where neither had an incoming edge before; Pulmonary fibrosis unscoped with an intravascular item added; and three non-blocking additions from the caches, lower-lobe panacinar emphysema (HP:0032967), conglomerate masses as advanced fibrosis, and lung transplantation as a BYPASSES treatment. One quote was initially attributed to the wrong paper and repointed to PMID:40881529 after reference validation caught it. Re-validated: 74 snippets, 81 titles, 0 issues, term validation passed.

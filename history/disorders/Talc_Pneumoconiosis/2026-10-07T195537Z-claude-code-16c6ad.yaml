  summary: 'Review round 2: correct an unsupported claim about PMID:9222135 and regrade
    background quotes'
  details: |
    Addressed the blocking finding and both suggestions from the re-review of the enrichment commit. Blocking: the ambient urban talc entry asserted that PMID:9222135 found no talcosis. It did not: the cache is abstract-only, the study is about fibre burden and lung cancer in 211 women, and it never mentions talcosis. Not reporting talcosis is not the same as finding none, and the PREDISPOSES predicate had been justified on that false claim. Both sentences now say the study did not assess talcosis, and the predicate was weakened from PREDISPOSES to MODULATES, with the link description stating exactly what the source supports, that talc reaches the lung by this route and nothing more, and why TRIGGERS and PREDISPOSES both claim too much. Suggestion 1: the inhalational pulmonary hypertension case used to unscope that phenotype is confounded, an 82-year-old with chronic obstructive pulmonary disease, 30 pack-years and terminal leukaemia whose talcosis was never biopsied; the explanation now records those competing causes, and the reviewer's suggested alternative was verified in the cache and added, a 1977 case of a child who inhaled baby talcum powder once at age two and had biopsy-confirmed talcosis with pulmonary hypertension, which is the cleaner support. The cosmetic-powder environmental description now records that the second case was a clinical and radiological diagnosis with biopsy ruled out by thrombocytopenia. Suggestion 2: fourteen evidence items paired quote_role BACKGROUND with evidence_source OTHER, which is the pattern design decision 10262 was written to replace. Each was regraded to the evidence type its quoted text describes, HUMAN_CLINICAL for the sentences summarizing human cases, histology, imaging, symptoms, clearance physiology and clinical course, and the explanations rewritten so none still argues for OTHER. One item stays OTHER deliberately, the sentence calling household talc an overlooked cause, because it is the authors' judgement about clinical attention rather than a description of evidence; its explanation says so. A missing quote_role was added to the Cough edge so the same quoted sentence is described consistently in all three places it appears. Noted but not acted on: the term is HP:0002092 Pulmonary arterial hypertension while the sources say pulmonary hypertension; HP has no separate term for the latter in the phenotype enum, so the binding is unchanged. Re-validated: 99 snippets, 109 titles, 0 issues; term validation passed.

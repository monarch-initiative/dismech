  summary: 'Edit: Neurofibromatosis Type 1 - the juvenile xanthogranuloma association'
  details: |
    Adds a Juvenile Xanthogranuloma phenotype row, one of two rows recording the association of this disease, juvenile xanthogranuloma and juvenile myelomonocytic leukemia in neighboring entries (the other is on Juvenile_Myelomonocytic_Leukemia).

    The row binds MONDO:0015534 juvenile xanthogranuloma, the disease term of the Juvenile_Xanthogranuloma entry. The phenotype slot's enum admits a disease term for a complication or comorbidity, and HPO has no term for this lesion: OLS4 searches of HP on 2026-11-19 returned nothing for "juvenile xanthogranuloma", "JXG" or "nevoxanthoendothelioma", and two renal terms for "xanthogranuloma". Earlier drafts bound HPO terms. HP:0200036 Skin nodule was too narrow: HPO separates Papule from Skin nodule by size, and the systematic review cited on the row gives mean lesion sizes of 4.3 mm and 8.5 mm. Their parent, HP:0011355 Localized skin lesion, fits any circumscribed skin lesion and loses this one's identity. MONDO's definition of the disease says its lesions consist of cutaneous papules and nodules. Other entries bind a disease term in a phenotype row in the same way, for example opsoclonus-myoclonus syndrome on Neuroblastoma and sebaceous adenoma on Lynch_Syndrome. The Juvenile_Xanthogranuloma entry binds Skin nodule for its own cutaneous lesion, and that binding is not changed here.

    The row's core claim, that a subset of patients develop the lesion, rests on the 2023 systematic review's opening sentence. The row records that the steering committee of the 2021 consensus considered the lesion among the cutaneous findings and that it was not incorporated into the revised criteria, with the reasons given, although the first Delphi process had shown high consensus for adding it; the row is marked diagnostic: false. On what the lesion predicts it cites both sides. The 1995 literature analysis estimated a 20-fold to 32-fold higher leukemia risk with the lesion; that item is graded indirect, because the paper names the leukemia juvenile chronic myelogenous leukemia, which MONDO lists as an exact synonym of juvenile myelomonocytic leukemia, and its abstract does not make that identification. The 2023 review says the association is debated and very rare, that current guidelines do not recommend screening, that increased surveillance may be advisable in three groups of patients, and that the differences by family history and sex were not statistically significant in its data. A small case-control study found the lesion in 4 of 14 children with a malignancy and 6 of 29 without, and concluded that it does not appear to raise malignancy risk. No frequency is given: the review counts reported patients, and the case-control sample was chosen by malignancy status.

    All ten evidence items quote references already cached and cited by the Juvenile_Xanthogranuloma entry, and a sentence quoted in more than one entry carries the same evidence_source in each. Validated with just validate-disorders (schema, terms and references) and the repository's other gates over the two changed entries; term validation added MONDO:0015534 to the phenotype enum cache.

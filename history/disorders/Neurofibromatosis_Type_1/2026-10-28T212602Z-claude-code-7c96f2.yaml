  summary: Add a rare, unsettled neuroblastoma phenotype
  details: |
    Adds a Neuroblastoma phenotype (HP:0003006, frequency VERY_RARE, category Neoplastic) to the NF1 entry, directly after Pheochromocytoma. Part of the neuroblastoma expansion series (issue 15822).

    Evidence (six items from four references):
    - the 2017 AACR consensus (PMID:28674118), cited twice: a SUPPORT item for its statement that neuroblastoma has been reported in NF1 among other RASopathies, and a REFUTE item for its sentence that the reported NF1 cases may be fortuitous coincidence, so the risk may not be raised enough to warrant surveillance. The same paragraph says both, so the two directions are separate items.
    - the 2024 AACR RASopathy surveillance update (PMID:39196581), NF1 section: neuroblastoma is rare but occurs at higher frequency than in the general population.
    - the Finnish population-based NF1 cohort (PMID:30724342): one neuroblastoma among 524 people followed to age 20.
    - the Italian neuroblastoma registry study (PMID:36405824): eight children with neuroblastic tumours met NF1 criteria, five of them with neuroblastoma, and its background sentence that the incidence of the association is not known.

    The VERY_RARE band follows docs/frequency-evidence-guidelines.md (Pattern C for the 2024 update's word "rare", Pattern B for the Finnish count); no source measures a per-patient frequency. The description calls the association unsettled. No pathophysiology node, causal edge, surveillance or treatment row is added: the risk is unsettled, and the entry's tumour nodes model Schwann-cell and glial lineages, as the phenotype notes say. The PMID:28674118 SUPPORT sentence carries the same evidence_source and quote_role as its use in Noonan_Syndrome (PR 15859).

    New reference caches: PMID:30724342 and PMID:36405824 (full text). A re-extracted copy of PMID_39196581.md produced while drafting was not committed: it added rowspan markers to the update's tables, which broke an existing Costello_Syndrome snippet, and the committed copy already supports the new quote.

    Validation on the branch rebased onto main: the run_c4 gate set over Neurofibromatosis_Type_1 and Costello_Syndrome (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

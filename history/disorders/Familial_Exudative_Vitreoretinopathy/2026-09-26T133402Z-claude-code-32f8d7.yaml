  summary: 'Review round 1: unbind the KIF11 subtype term, regrade the ZNF408 cohort
    quote'
  details: |
    Two non-blocking suggestions on PR 12897, both taken. The KIF11 row carried subtype_term MONDO:0007918, which is the whole microcephaly-chorioretinopathy-lymphedema syndrome rather than its retinal component; binding it asserted that this FEVR subtype is that syndrome, which is false for a KIF11 proband with an isolated retinal phenotype. The row now carries no subtype_term and records MONDO:0007918 as a skos:broadMatch cross-reference instead, which keeps the term queryable while dropping the identity claim - a step further than the reviewer's suggestion to leave it simply unbound. The synonym-inclusive MONDO search behind the absence of a KIF11-specific exudative-vitreoretinopathy class is retained in the row's review_notes, together with the note that MONDO:0007918 is the class ClinGen curates KIF11 against. Separately, the PMID:39918476 evidence item was graded OTHER with quote_role BACKGROUND; the quoted sentence describes the gene panel that cohort study itself used, so it is the study's own methods rather than restated prior work. Regraded HUMAN_CLINICAL with quote_role removed, and the explanation now says it is a human FEVR cohort study.

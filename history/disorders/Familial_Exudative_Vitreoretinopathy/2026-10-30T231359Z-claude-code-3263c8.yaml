  summary: Add the current NDP-Related Retinopathies GeneReviews chapter for the X-linked
    subtype
  details: |
    The entry's only tagged GeneReviews chapter (PMID:20301326, Familial Exudative Vitreoretinopathy, Autosomal Dominant) is retired and has no successor. The current NDP-Related Retinopathies chapter (PMID:20301506) covers the X-linked NDP-FEVR subtype. It was added as evidence on the NDP-FEVR subtype (the Norrie disease / NDP-FEVR continuum) and on the X-linked recessive inheritance row (affected hemizygous males, rarely affected heterozygous females), and tagged GeneReviews in references. The retired chapter stays for the dominant-form claims. The notes record the GeneReviews index search that found no current chapter for the dominant forms. That search returned a CTNNB1 Neurodevelopmental Disorder chapter that mentions an FEVR-like finding, so the notes say so and do not claim no chapter mentions FEVR. The StatPearls FEVR entry (PMID:40334027) is not a baseline and was not added. just validate passes, and count-verified-snippets verifies 72/72 snippets.

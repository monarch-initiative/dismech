  summary: 'Genetics pass (d2g series-047): Familial_Exudative_Vitreoretinopathy'
  details: |
    Genetics pass on the FEVR umbrella for issue #12254 (d2g series-047). Confirmed the
    disease_term anchor MONDO:0019516 is correct: the term's own MONDO definition opens
    "Familial exudative vitreoretinopathy (FEVR) is a rare hereditary vitreoretinal disorder",
    so the entry is that class and no narrowMatch re-anchoring was needed. Bound subtype_term
    on all five pre-existing has_subtypes rows (FZD4 MONDO:1040041, LRP5 MONDO:0700228,
    TSPAN12 MONDO:0700231, NDP MONDO:0010588, KIF11 MONDO:0007918) and added two new rows,
    ZNF408-FEVR (MONDO:0014652) and CTNNB1-FEVR (MONDO:0033123), each with genes, inheritance
    and evidence. Added reciprocal genetic[].subtype foreign keys for all seven genes, so
    subtype-usage-audit reports 100 percent FK coverage and 14 WIRED_DIRECT subtype-gene pairs.
    Wired the two previously unwired genes into the pathograph: CTNNB1 onto the Norrin/
    beta-catenin node as the intracellular effector, and a new node "ZNF408 dysfunction
    impairing retinal vascular development" for ZNF408, kept separate from the receptor-complex
    node because the sources do not place ZNF408 in the Norrin/FZD4 complex. Gene-to-mechanism
    wiring went 5/7 to 7/7. Added ClinGen Gene-Disease Validity evidence (all Definitive) to
    the FZD4, LRP5, TSPAN12 and CTNNB1 records, building the CGGV_*.md caches with
    just clingen-rebuild --id. Declined two MONDO children of the anchor and recorded both in
    the entry's notes: MONDO:0979571 exudative vitreoretinopathy 8 (LRP6), whose sole primary
    report PMID:34896607 is a Letter served without an abstract so no snippet is available and
    which ClinGen has not curated, and MONDO:1040031 dyneinopathy, a DYNC1H1 spectrum term
    whose only MONDO children are CMT2O and MRD13 and which is asserted as a direct child of
    exudative vitreoretinopathy without any vitreoretinopathy descendant. The dyneinopathy
    placement is reported to the requester as a candidate upstream MONDO issue; no issue was
    filed. Validated with just validate, validate-terms, validate-disorders,
    list-gene-term-mismatches --resolve (41/41 compared, 0 mismatches) and the offline gate set.

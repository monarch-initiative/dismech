  details: |
    LOINC tranche J batch 1. Bound LOINC:30160-6 (Tau protein [Mass/volume] in Cerebral spinal fluid) to the CSF total tau biochemical marker, and added an exact-quote citation for the '>1400 pg/mL' cutoff already stated in the marker's notes ('Total tau levels were measured in the CSF of 140 cases using a commercial ELISA kit and values >1400 pg/mL were considered to be positive', PMID:34487324). Did not add interpretation_bands for this cutoff: the source states a strict '>' inequality on a continuous measurement, and this schema's band convention is inclusive at the lower bound, so an exact band would misstate a value of precisely 1400 pg/mL as positive -- a case where the schema cannot represent the source's own inequality exactly. Bound LOINC:101662-5 (Abnormal Prion Protein [Presence] in Cerebral spinal fluid by RT-QuIC) to the CSF RT-QuIC diagnosis row; this is one of only two LOINC entities found for 'RT-QuIC' (fully enumerated), the other being an [Interpretation] code not bound per the campaign's interpretation-field rule. Bound LOINC:31989-7 (14-3-3 Ag [Presence] in Cerebral spinal fluid) to the CSF 14-3-3 diagnosis row, found by scoping the search to 'Cerebral spinal fluid' to avoid the YWHAE-protein-family collision this tranche was deferred over. All three codes verified by a fresh Monarch KG entity lookup; 30160-6 was already cached from an earlier-merged Alzheimer entry, the other two confirmed absent from origin/main before seeding.

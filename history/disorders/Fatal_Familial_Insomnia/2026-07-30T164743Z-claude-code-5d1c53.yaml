  details: |
    Review-response round for PR #7134, covering the ai4c-reviewer REQUEST_CHANGES round and the APPROVE re-review.

    Blocking finding resolved: PMID:34487324 [Chinese national prion surveillance, 218 genetic prion disease patients] had entered the PR as 437 lines of full text but was consumed by only one snippet. It carries the D178N-specific diagnostic test-performance data the entry lacked. Added four diagnosis records and one biochemical marker: CSF RT-QuIC [15.8 percent positivity in D178N, the lowest of any genetic prion subtype, versus 63.6 percent for P102L GSS and 32.3 percent overall], CSF 14-3-3 [frequently negative in D178N], brain MRI [25.5 percent positivity in D178N versus 92.3 percent for P102L], EEG [periodic sharp wave complexes in 1 of 48 D178N cases], and CSF total tau [elevated in more than half of FFI cases, the one widely available CSF marker that is usually informative here, tagged specificity LOW]. The entry now states explicitly that a negative RT-QuIC, 14-3-3, or MRI does not exclude FFI. That PMID now supports 9 snippets instead of 1.

    Also addressed: dropped the unanchored VERY_FREQUENT from Dysautonomia; split the single modifier-locus record that bound SRSF11 as a stand-in for five loci into three real per-gene records [EXOC1L hgnc:53433, SRSF11 hgnc:10782, MSANTD3 hgnc:23370], with the two pseudogenes NR1H5P and GNA13P1 named in notes rather than given invented records.

    Correction recorded for future curators: during the first response round I asserted, in three explanation fields, that the reference validator matches literal substrings and cannot span hard-wrapped newlines in cache files. That is false - the validator normalizes whitespace. The belief came from misdiagnosing an early validation failure that was actually a transcription error [the source reads "some of whom may be", I had written "who may be"]. The reviewer disproved it with a counter-example merged on main [Incontinentia_Pigmenti.yaml L164 quotes a string spanning three wrapped lines of PMID_36147820.md]. I verified this empirically before acting. All three false explanation fields were removed and four truncated quotes were extended to full sentences: PMID:9222180 to "PrPres formation is the cause of neuronal dysfunction in prion diseases.", PMID:36472576 to the full sympathetic-hyperactivity clause, PMID:37626863 to the full programmed-cell-death sentence, and a new PMID:7607093 quote "All patients showed an early reduction in sleep spindles and K complexes" was added to anchor the VERY_FREQUENT band on the sleep-spindle phenotype, which had been asserted in the PR description but never actually quoted in the YAML. A second anchor from PMID:7607093, "impairment of sleep-wake regulation is a consistent distinctive feature of FFI", now anchors the VERY_FREQUENT band on Progressive insomnia.

    Added a curation note on the RT-QuIC record recording that PMID:34487324 is internally inconsistent about the GSS comparator allele - its abstract says P105L while its results and discussion say P102L - and that P102L is used here to match the body text and the quoted snippet, so a future reader does not reverse it against the abstract.

    Declined with reasoning: two GO terms in ORGANISM-scale nodes flagged as borderline organ-level physiology [kept as the most accurate available terms; dropping them costs queryability without gaining accuracy], and adding hypertension, hyperthermia, and weight-loss phenotypes [verified that none of the 18 cached sources, including the PMID:34487324 full text, mention these in FFI; adding them would require either unevidenced entries or a snippet that does not support the claim]. Also declined structuring the CSF tau 1400 pg/mL threshold as reference_ranges, since that would require a LOINC code that cannot be verified from the cached source.

    Validation after this round: just validate passes [schema, ontology term, and reference validation]. Compliance 88.1 percent global and 88.4 percent weighted, up from 86.3 and 86.7. Content grew to 85-plus evidence items, 8 diagnosis records, 2 biochemical markers, and 5 genetic records. The branch also absorbed an automation-driven merge of main [commit ad66d9c519]; my commits were rebased onto the branch tip rather than force-pushed, and the post-refresh diff against origin/main was verified as 22 files with zero deletions.

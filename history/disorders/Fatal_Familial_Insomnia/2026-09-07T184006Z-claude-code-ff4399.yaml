  summary: 'Phenotype review: Fatal_Familial_Insomnia'
  details: |
    Reviewed all 17 phenotypes for snippet/claim consistency, HPO term optimality, and pathograph connectivity. All 91 pre-existing snippets verified as exact substrings and none were wrong-disease or negation cases. Rebound three HP terms: loss of sleep spindles/K-complexes from the top-level HP:0002360 Sleep disturbance to HP:5200298 Abnormal sleep architecture; impaired attention and vigilance from HP:0000736 Short attention span (an ADHD-flavoured definition) to HP:0032044 Decreased vigilance; and Urinary incontinence (HP:0000020) broadened to Impaired sphincter control (HP:0031064 Impaired continence) because the cited source reports undifferentiated sphincter loss. Replaced a truncated GeneReviews snippet that stopped at gCJD and so omitted FFI, and extended the tachycardia HRV snippet to the full sentence carrying its comparator. Added PMID:1736158 (Manetto 1992 five-case clinicopathologic series), which supplies real evidence for hyperhidrosis (previously carrying only a notes-based claim), two missing core dysautonomia phenotypes (hyperthermia, hypertension), and a VERY_FREQUENT frequency anchor for the seven manifestations it reports as present in every case. Pathograph went from 0/17 to 19/19 connected: wired the sleep, autonomic, and thalamic-lesion nodes to their phenotypes with edge-level evidence, and added one new pathophysiology node, Extrathalamic Olivocerebellar and Cortical Degeneration, evidenced by the primary-lesion multisystem findings, to explain the somatomotor syndrome and the cortical features of the 129MV subtype. Dysphagia and sphincter loss carry INDIRECT_UNKNOWN_INTERMEDIATES because no source localizes them. Also cleaned up five stale explanation strings still citing the removed PARTIAL enum value, using directness: INDIRECT where the argument was genuinely about directness.

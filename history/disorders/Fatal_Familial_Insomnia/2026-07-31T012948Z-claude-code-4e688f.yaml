  summary: 'Address PR #7134 re-review: cite and correct the PrP-C conversion-propensity
    node'
  details: |
    Addresses the one open review item from the ai4c-reviewer re-review of 2026-07-30/31: the pathophysiology node
    "Destabilization of the PrP-C Native Fold" carried neither evidence nor notes while asserting that D178N "lowers the
    thermodynamic and kinetic barrier separating the native alpha-helical PrP-C fold from beta-sheet-rich conformers".

    The reviewer proposed fetching Surewicz-lab recombinant-D178N stability work to cite the claim. That was done, and the
    result inverted the fix. Swietnicki, Petersen, Gambetti and Surewicz (PMID:9813003) set out to test exactly this
    hypothesis and concluded against it: the D178N variant could not be assayed at all because it aggregated into inclusion
    bodies, P102L was indistinguishable from wild-type and E200K only very slightly destabilized, and the paper closes that
    "some hereditary forms of prion disease cannot be rationalized using the concept of mutation-induced thermodynamic
    destabilization of the cellular prion protein". Liemann and Glockshuber (PMID:10079068) independently measured all eight
    C-terminal familial substitutions and found that "destabilization of PrPC is neither a general mechanism underlying the
    formation of PrPSc nor the basis of disease phenotypes in inherited human TSEs". Wildegger, Liemann and Glockshuber
    (Nat Struct Biol 1999, PMID:10360358) additionally showed PrP-C folds in roughly 170 microseconds without detectable
    kinetic intermediates, undercutting the "kinetic barrier" half of the wording as well.

    So the node was not merely uncited - it asserted as mechanism a hypothesis the primary literature had tested and
    rejected. Curating it correctly meant changing the claim, not just attaching a citation to it.

    Changes:
    - Renamed the node to "Acquisition of a Conversion-Prone PrP-C State" and updated the single upstream
      downstream.target foreign key. The old name itself encoded the refuted model.
    - Rewrote the description to the property that is actually observed - the FFI M129/D178N recombinant protein is
      markedly aggregation-prone where P102L and E200K are recovered soluble - and dropped the thermodynamic and
      kinetic-barrier assertion entirely.
    - Added three evidence items, the entry's first IN_VITRO evidence on a disease whose core mechanism is conformational:
      PMID:9813003 SUPPORT for the aggregation-prone observation, PMID:9813003 REFUTE and PMID:10079068 REFUTE against the
      native-state-destabilization model. The REFUTE items are deliberate: they are the record of why the thermodynamic
      framing must not be reintroduced, which a bare deletion would not have preserved.
    - Added a notes block stating explicitly what the node does not claim, naming the removed wording, and pointing at the
      open strain-identity knowledge gap as the place the real mechanism remains unresolved.
    - Swapped the biological_process from GO:0043335 protein unfolding INCREASED to GO:0006457 protein folding ABNORMAL.
      GO:0043335 is defined as assisting in the disassembly of non-covalent linkages - a chaperone-like disaggregation
      activity - so it was a poor fit even under the old description, and actively wrong under the new one. ModifierEnum
      ABNORMAL is documented in the schema for exactly this case: "Qualitatively abnormal (e.g., misfolding ...)".

    The reviewer's second discretionary item - declaring conforms_to against loss_of_proteostasis - is still declined, and
    this round strengthens the reason. That module frames aggregation as downstream of chaperone and degradation-network
    failure; the evidence added here reinforces that FFI is autocatalytic templated conversion by an aggregation-prone
    mutant protein, with no asserted proteostasis-network defect. Left for a follow-up issue as the reviewer suggested.

    Unrelated but worth recording: just fetch-reference and the whole validator stack were failing locally with
    "rustc 1.85.1 is not supported ... horned-owl@1.4.0 requires rustc 1.88" while building py-horned-owl from source.
    Fixed by upgrading the Homebrew rust formula to 1.97.1. No repo files were involved; noting it because the next curator
    on an older toolchain will hit the same wall.


  summary: 'Create: Fatal Familial Insomnia'
  details: |
    De-novo curation of Fatal Familial Insomnia [MONDO:0010808, PRNP D178N in cis with codon-129 methionine].

    Deep research: falcon/Edison completed in 418s and is committed at research/Fatal_Familial_Insomnia-deep-research-falcon.md. Its 12 citations resolved to only 2 distinct sources [PMID:37626863 and PMID:35737759], so the evidence base was built primarily from targeted PubMed E-utilities searches rather than from DR output. A second provider run [claude_code] was attempted and timed out at 1800s, producing no report.

    NEC preflight passed: the MONDO:0010808 definition names PRNP as causal with xrefs OMIM:600072 and Orphanet:466, matching the gene and identifiers asserted throughout the DR report.

    GeneReviews baseline: PMID:20301407 [Genetic Prion Disease] was fetched, tagged GeneReviews in the top-level references block, and cross-referenced for phenotypes, reduced penetrance, age at onset, management, the 14-day surveillance interval, and predictive-testing guidance for minors.

    Curated content: a 5-node pathophysiology chain - D178N-129M haplotype, PrP-C native-fold destabilization, template-directed conversion to the 19 kDa type-2 conformer, gray-matter-restricted PrPres accumulation, and preferential mediodorsal/anteroventral thalamic neuronal loss - which then branches to thalamocortical sleep-oscillation collapse and loss of thalamolimbic autonomic restraint. Also 16 phenotypes; 2 codon-129 subtypes [129MM short course vs 129MV prolonged] with per-subtype phenotype foreign keys; 3 genetic records, with the codon-129 cis-phase modeled as a disease-determining second genetic component rather than merely a severity modifier; the 19 kDa PrP-Sc biochemical signature; 4 diagnosis records including the 13-21 month pre-symptomatic thalamic-hypometabolism window; 4 treatments including the investigational preventive doxycycline study; the ION717 PrP-lowering ASO trial; and 3 KNOWLEDGE_GAP discussions carrying 6 proposed experiments [thalamic selectivity, pre-symptomatic prevention surrogate, FFI-versus-sporadic-fatal-insomnia strain identity].

    Validation: 17 new reference cache files were fetched with just fetch-reference; all 69 evidence items carry reference_title, backfilled with scripts/add_pmid_titles.py. just validate passes end to end - schema, ontology term, and reference validation - with every snippet verified as an exact substring of its cached abstract. Compliance is 86.4 percent global and 86.7 percent weighted, against 51.6 percent for the sibling Gerstmann-Straussler-Scheinker entry.

    Known gaps and incidental findings: no prevalence block was added because no citable FFI-specific incidence or prevalence figure could be found - the falcon report itself states that reliable FFI-specific estimates are unavailable - and the Orphanet ORPHA:466 structured cache could not be built because just refresh-orphadata fails pinned-checksum verification on en_product1.xml, which is pre-existing upstream drift unrelated to this entry. Separately, references_cache/PMID_37626863.md was present locally as a PubOne error stub rather than a real abstract; it was regenerated correctly with just fetch-reference and the good version is committed here.

  summary: 'PR #7134 review minors: DEPRECATED hypothesis record, PARTIAL retag, third
    refuting reference'
  details: |
    Addresses the three minor items from the ai4c-reviewer re-review of commit ca3c0d5b. All three accepted; none declined.

    1. supports: SUPPORT -> PARTIAL on the PMID:9813003 inclusion-body item. The reviewer's objection is correct: E. coli
    periplasmic inclusion-body partitioning is an aggregation observation and a common recombinant-expression artifact, not
    a clean proxy for self-templating conversion propensity in vivo, and Swietnicki et al. draw no such inference - they
    report it only as the reason D178N could not be assayed. The explanation now states that limitation explicitly rather
    than leaving the reader to infer it.

    2. The two REFUTE items moved from the pathophysiology node to a new disease-level mechanistic_hypotheses block,
    hypothesis_group_id native_state_destabilization, status DEPRECATED. The reviewer is right that REFUTE was aimed at the
    wrong target: the schema defines REFUTE as evidence contradicting the claim of the annotated object, and after the
    previous commit rewrote the node it no longer claims destabilization - the refuted claim survived only as prose in
    notes. MechanisticHypothesis carries its own evidence slot and MechanisticHypothesisStatusEnum.DEPRECATED is documented
    as "Historical hypothesis no longer supported as the current model", so this is an exact fit. The refutation is now
    attached to the claim it actually refutes, and the rejected model is queryable across the KB rather than discoverable
    only by reading a notes paragraph. The node's notes block was shortened to point at the hypothesis rather than restate
    its content.

    3. PMID:10360358 (Wildegger, Liemann, Glockshuber, Nat Struct Biol 1999) was cited by author-and-year in notes with no
    resolvable identifier. Rather than just adding the PMID inline, it was fetched and promoted to a third REFUTE evidence
    item on the hypothesis, because it refutes a distinct half of the claim: the original wording asserted a lowered
    thermodynamic AND kinetic barrier, and stopped-flow folding of the structured domain with a half-life of about 170
    microseconds and no detectable intermediates removes the folding-intermediate route specifically. Two papers refute the
    thermodynamic half, one refutes the kinetic half; the hypothesis record is now complete.

    Also filed issue #7256 for the out-of-scope finding the reviewer raised: Gerstmann-Straussler-Scheinker_Syndrome.yaml
    on main carries the identical refuted framing (same node name, same GO:0043335 protein unfolding INCREASED, same
    thermodynamic/kinetic-barrier wording, no evidence). For GSS the contradiction is sharper than for FFI, because
    PMID:9813003 assayed P102L - the GSS variant itself - and found its stability "indistinguishable from those of
    wild-type PrP". Not fixed here: different file, on main, outside this PR's scope. All three references are now cached,
    so the fix is cheap for whoever picks it up.

    Validation: just validate passes; just validate-references passes with all four new snippets exact.

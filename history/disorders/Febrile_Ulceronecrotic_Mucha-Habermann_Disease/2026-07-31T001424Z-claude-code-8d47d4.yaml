  summary: 'Create: Febrile Ulceronecrotic Mucha-Habermann Disease FUMHD'
  details: |
    De-novo entry for FUMHD [MONDO:0023134], modeled as a deliberate split from the sibling Acute Lichenoid Pityriasis [PLEVA, MONDO:0024250] entry which retains FUMHD as a severity subtype; FUMHD is a MONDO subclass of acute lichenoid pityriasis. Deep research: Falcon/Edison was requested but returned HTTP 402 Payment Required [out of Falcon credits], so per user direction the run was switched to OpenScientist [openscientist provider]. The first OpenScientist run timed out at the client 3600s poll window [backend queue]; a retry with a 2h poll window completed in ~20min and produced research/Febrile_Ulceronecrotic_Mucha-Habermann_Disease-deep-research-openscientist.md [24 citations; NEC preflight confirmed the report is about FUMHD]. Entry built from verified primary literature: reuses the shared CD8+/TIA-1+ cytotoxic-T-cell PLEVA mechanism [PMID:38973067] and adds FUMHD-specific sources PMID:38959922 [systemic manifestations, coalescing ulcers, fever, treatment], PMID:34287852 [119-case mortality/risk-factor review: 12pct overall lethality, adult 20pct vs child 2pct; sepsis/systemic/mucosal risk factors], PMID:36483219 [mortality systematic review, treatment array, lack of defined criteria], PMID:8864599 [historical PLEVA onset], PMID:38457671 [HLH association, atypical CD8+ lymphomatoid infiltrate, angiocentric CTCL differential] and PMID:38234081 [IVIG rapid recovery]. Verified enrichments folded in from the OpenScientist report: PMID:15840118 [elevated serum TNF-alpha at PLEVA->FUMHD transition -> TNF-alpha amplification arm, GO:0033209], PMID:23391565 [TNF-alpha inhibitor/infliximab treatment], PMID:15583604 [monoclonal TCR clonality / CTCL continuum node], PMID:26695875 [Nofal diagnostic criteria], PMID:12894107 [infectious triggers - EBV/Toxoplasma/HIV], PMID:35950146 [~75pct male predominance, high-fever frequency]. A red-team review [dismech-pr-review] was applied pre-PR: rewired a dangling ulcer downstream edge, wired an orphaned hypothesis group, aligned the mucosal term/claim, swapped an inferential necrosis snippet for a literal one, and retagged supportive-care modality to OTHER. No GeneReviews article exists [non-Mendelian]. Validated: just validate passes schema+terms+references; all 43 evidence snippets independently verified as exact substrings of cached abstracts; pathograph fully connected with no orphaned hypothesis groups.

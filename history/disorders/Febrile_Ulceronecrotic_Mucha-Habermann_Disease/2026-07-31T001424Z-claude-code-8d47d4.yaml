  summary: 'Create: Febrile Ulceronecrotic Mucha-Habermann Disease FUMHD'
  details: |
    De-novo entry for FUMHD [MONDO:0023134], modeled as a deliberate split from the sibling Acute Lichenoid Pityriasis [PLEVA, MONDO:0024250] entry which retains FUMHD as a severity subtype; FUMHD is a MONDO subclass of acute lichenoid pityriasis. Deep research: Falcon/Edison was requested but returned HTTP 402 Payment Required [out of Falcon credits], so per user direction the run was switched to OpenScientist [openscientist provider; run in progress at commit time, report to be folded in as a follow-up]. Entry built from verified primary literature: reuses the shared CD8+/TIA-1+ cytotoxic-T-cell PLEVA mechanism [PMID:38973067] and adds FUMHD-specific sources PMID:38959922 [systemic manifestations, coalescing ulcers, fever, treatment], PMID:34287852 [119-case mortality/risk-factor review: 12pct overall lethality, adult 20pct vs child 2pct; sepsis/systemic/mucosal risk factors], PMID:36483219 [mortality systematic review, treatment array, lack of defined criteria], PMID:8864599 [historical PLEVA onset], plus two newly fetched FUMHD papers PMID:38457671 [HLH association, atypical CD8+ lymphomatoid infiltrate, angiocentric CTCL differential] and PMID:38234081 [IVIG rapid recovery]. No GeneReviews article exists [non-Mendelian]. Validated: just validate passes schema+terms+references; all 36 evidence snippets independently verified as exact substrings of cached abstracts.

  summary: 'Review round 1: MC1DN17 (mortality counter-evidence, quote_role, GO rebinding,
    notes cleanup)'
  details: |
    Review round 1 on PR #12802 (ai4c-reviewer, CHANGES_REQUESTED). Five important items and five suggestions, all addressed in one push.

    Item 1 - session narrative in `notes:`. The entry's top-level `notes:` and `genetic[].notes` carried process narration that CLAUDE.md assigns to this field instead: that the stub's entry_type was set and the stub deleted "by this change", a whole paragraph on the deep-research provider falling back, "the same call was made in the MC1DN18 and MC1DN22 entries", "at the time of writing (PR #12492 proposes both...)", "the fly work was not fetched or verified for this curation", and "These identifiers were read from the HGNC REST record ... not from memory". All removed from the entry; the disease facts they were wrapped around (MONDO leaf structure, FRTS5 relationship, the two ClinGen granularities, no ORPHA xref, the ascertainment argument, no NDUFAF6 mouse but a Drosophila Sicily homologue) were kept. The deep-research provenance now lives only here.

    Item 2 - an evidence item quoted one paper's summary of another. The ATP snippet on Impaired Mitochondrial ATP Production cited PMID:41982415, but the sentence is that review restating Sung et al. (its ref 29 = PMID:38720117), and the explanation claimed it as "independent support ... from the deep mutational scan". Confirmed against the cached full text: the sentence sits inside "Most notably, Sung et al. (29) systematically characterized NDUFAF6...". Added `quote_role: REVIEW_SYNTHESIS`, kept `evidence_source: IN_VITRO` (which grades the described work), and rewrote the explanation to say it is not independent and why the scan's own paper is not quoted instead - its cached full text carries no equivalent ATP-rescue sentence.

    Item 3 - the mortality knowledge gap omitted a cached cohort that cuts against it. The reviewer pointed at PMID:31967322, a Japanese national study which was fetched during the original curation but left out of the PR as an unused research-run artifact. It is a registry-ascertained series (166 patients via the J-MO Bank patient registry), which is exactly the study design the rationale's ascertainment argument called for, and it still finds NDUFAF6 outcomes better than other nuclear genotypes. The rationale was rewritten: "almost certainly ascertainment" is gone, the registry finding is stated, and the NDUFAF6 subgroup is quantified (8 individuals, 5 retaining head control, 3 dead or having lost it). The study also reports that within NDUFAF6 later onset went with better outcome, which makes age at onset a candidate confounder that would reconcile both 2026 figures; that is now the discussion's sharper question and has a proposed experiment (onset-stratified survival across the pooled cohorts). Three evidence items added, one graded REFUTE - against the ascertainment explanation specifically, not against the discrepancy.

    Item 4 - infection-triggered crises and the supportive-care components. Added a Metabolic Crisis Triggered by Intercurrent Infection phenotype; an `environmental:` entry for intercurrent infection linked by `influences_mechanisms` with EXACERBATES to the bioenergetic node; and two treatments (avoidance of metabolic stressors, dystonia management and rehabilitation), plus the management-components sentence on the existing Supportive Care entry.

    Item 5 - wrong GO binding. Respirasome Depletion carried GO:0032981 (complex I assembly), which is the upstream lesion. Repointed to GO:0097250 mitochondrial respirasome assembly, confirmed present in cache/go/terms.csv.

    Suggestions taken. Five phenotypes added: Bradykinesia, Ataxia, Exercise Intolerance, Muscle Weakness (the last three from the ClinGen feature list, each noted as carrying no numerator) and Global Developmental Delay, curated separately from Developmental Regression because the panel writes "developmental delay and/or regression". Evidence added to the two previously bare edges out of Bilateral Striatal Neurodegeneration. The Dystonia -> Dysarthria sequela now says the causal reading is the curator's inference, the source saying only "often accompanied by", and that the regression's language loss is a second uncontrolled contribution. The medium spiny neuron binding is now stated as inferred in the node description - CellTypeDescriptor has no `notes` slot, so it could not go on the descriptor. PMID:33097395 fetched and cited for the diagnostic caution: two adults with mild splice-variant disease, one with slightly reduced and one with frankly normal complex I activity, which is the strongest form of "a normal assay does not exclude".

    Two ontology decisions made during this round, both recorded in the entry with the searches that produced them. The metabolic-crisis phenotype is deliberately left unbound: HPO searches for "metabolic crisis", "metabolic decompensation", "decompensation", "episodic" and "illness" return febrile-seizure terms, HP:0033148, HP:0025215 (a clinical modifier, not a phenotypic abnormality) and HP:0006846 Acute encephalopathy, the last being a different claim from the source's. The infection exposure is bound to ECTO:3000000 exposure to organism, the nearest true ancestor: ECTO searches for "infection" return only HPV and infectious bronchitis virus, "exposure to infectious agent" / "biotic" / "febrile" return nothing, and "virus" returns ECTO:3000001 whose parent is ECTO:3000000. ECTO:3000001 was rejected because the source says "concurrent infections" without naming a pathogen class and childhood infections are frequently bacterial.

    Validation after the round: validate-disorders PASS (85 snippets, 89 titles, 0 issues), count-verified-snippets 85/85, validate-terms PASS, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-coarse-phenotypes, check-environmental-evidence, check-reference-titles all PASS, pytest -k Nuclear_Type_17 2 passed. Two references added to the PR (PMID:31967322, PMID:33097395) with their cache files.

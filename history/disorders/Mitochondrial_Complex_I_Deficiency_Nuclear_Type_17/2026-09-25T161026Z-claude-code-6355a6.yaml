  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 17 (MC1DN17,
    NDUFAF6)'
  details: |
    Created MC1DN17 (MONDO:0032622) as a standalone Disease entry; stub entry_type set to DISEASE and the stub deleted.

    Scope. The MC1DN series is curated one entry per numbered type (21 already on main) and MONDO:0032622 is a leaf under the grouping term MONDO:0100223, so series precedent and ontology agree on a standalone Disease. Shape follows Mitochondrial_Complex_I_Deficiency_Nuclear_Type_18.yaml from the same campaign. The gene anchor hgnc:28625 NDUFAF6 was confirmed against the HGNC REST record (symbol NDUFAF6, previous symbol C8orf38, 8q22.1) and independently against two ClinGen expert-panel assertions; the stub's MONDO fields were not re-derived.

    Deep research. Requested provider falcon returned HTTP 402 (account out of credits). Rather than substituting by hand, the run was re-issued with the recorded-fallback flag, which fell back to openscientist and recorded fell_back/requested_provider/provider_attempts in the report frontmatter. The report was renamed to the producing provider and is committed with its citations sidecar and artifacts. It had no validation sections, so both were retro-fitted with `just validate-research-terms` and `just validate-research-reference`: 16/16 references resolved with none off topic, 47/48 terms resolved with no confabulation. The entry was NOT built from the report - all claims come from PubMed records and ClinGen assertions fetched directly - and the report was read afterwards as a cross-check. Its one contribution was HP:0012707 (MRS brain lactate), now curated against a count from a source already cited.

    Evidence. 66 snippets across 14 references: 10 PMIDs, 2 ClinGen CGGV assertions, plus PMID:26425749 tagged GeneReviews and PMID:27466185 cited for the nosology boundary. Principal sources are the two 2026 systematic accounts (PMID:41924699, a 27-patient cohort; PMID:41982415, a 24-case review that names MC1DN17/OMIM 618239 explicitly), the mechanism papers (PMID:38720117 deep mutational scan, PMID:22019594 ND1 block, PMID:18614015 gene discovery), and the clinical series PMID:30642748 and PMID:27623250. All new caches are abstract_only or full_text_xml - no full_text_html - per issue #12672.

    Corrections made during curation, recorded because they are the kind that validate silently. (1) A protein-family claim for NDUFAF6 was written from memory as "UbiH/COQ6 family of FAD-dependent monooxygenases"; the cached abstract of PMID:28476317 says squalene and phytoene synthases. Both the snippet and the node description were corrected against the source. (2) Three frequency bands were wrong against the published rates: Developmental Regression and Bilateral Striatal Necrosis were VERY_FREQUENT on figures of 74% and 67% (both in the 30-79 FREQUENT band), Seizure was VERY_RARE on 2/27 (7%, OCCASIONAL), and Increased Circulating Lactate was FREQUENT on 14/17 (82%, VERY_FREQUENT). All four corrected and the top-level notes made consistent with the rule actually applied.

    Two knowledge gaps recorded rather than smoothed over. The two 2026 sources disagree on mortality (1/24 = 4% vs 12/27 = 37%); the discrepancy is ascertainment, the direction is predictable, and it matters because the low figure is being offered as a distinguishing feature of this genotype. Separately, NDUFAF6 also causes the Acadian variant of Fanconi syndrome, already curated as the FRTS5 subtype of Fanconi_Renotubular_Syndrome; the two are kept apart but the boundary is not demonstrated - one patient in the 27-patient cohort has both, on the Acadian allele.

    GeneReviews: no chapter for MC1DN17 or NDUFAF6 (`just check-genereviews --online`, NO_CHAPTER against the 958-chapter index plus live PubMed title search). PMID:26425749 tagged as the applicable Leigh spectrum overview but deliberately not cited as evidence - its cached record is the statement of purpose only and does not mention NDUFAF6. Orphanet: MONDO:0032622 carries no ORPHA xref (DOID/GARD/MEDGEN/OMIM/UMLS only, read from OLS).

    Two pre-existing references_cache files (PMID_26425749, PMID_27466185) were repeatedly truncated from rich to abstract-only by the validator and research runs, per issue #12672; both were reverted with git checkout and are not in this PR.

    Validation, all run on the final tree: validate-disorders PASS (66 snippets, 79 titles, 0 issues), count-verified-snippets 66/66, validate-terms PASS, check-entity-refs PASS, check-causal-targets PASS (no new dangling), check-duplicate-keys PASS, check-enum-values PASS, check-coarse-phenotypes PASS (one new HP:0002500 binding carries coarse_binding_basis SOURCE_UNSPECIFIED), check-qualifier-terms PASS, check-reference-titles PASS, check-genereviews TAGGED, list-gene-term-mismatches 3/3 compared against HGNC with 0 mismatches and 0 uncached, validate-stubs and check-stubs PASS. Phenotype causal connectivity raised from 3/12 to 6/15 by wiring two sourced Dystonia sequelae; the remainder are left unwired because no source makes the causal claim.

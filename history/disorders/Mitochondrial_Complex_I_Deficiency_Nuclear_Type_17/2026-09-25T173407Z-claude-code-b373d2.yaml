  details: |
    Review round 2 on PR #12802 (ai4c-reviewer, CHANGES_REQUESTED on 94ef09fd8c). One blocking item and one suggestion, both fixed in one push. The reviewer confirmed all five round-1 items and all round-1 suggestions as addressed, and called the rewritten mortality discussion "a better question than the original one".

    Blocking - an evidence item was attached to the wrong treatment, introduced by the round-1 fix itself. When the two new treatments (Avoidance of metabolic stressors, Dystonia management and rehabilitation) were inserted into the `treatments:` list, they landed between the two evidence items of `Supportive and symptomatic care`. YAML list nesting did the rest: the trailing PMID:35664867 item - "The proband underwent physical therapy and nutrient cocktail therapy, but his physical impairment gradually worsened." - was carried under `Dystonia management and rehabilitation`, which already had its own copy of that same snippet.

    Two consequences, both confirmed by reading the file rather than from the review text. `Dystonia management and rehabilitation` cited one sentence twice. `Supportive and symptomatic care` still described that physical-therapy course in its `description` ("recorded here because it is the only reported outcome of treatment in this disease") while citing no source for it - an unsourced claim created by a formatting accident, not by a curation decision.

    Which of the two duplicates to move was settled against git rather than by picking one: `git show a1e913cf3e` shows the original `Supportive and symptomatic care` item carried the explanation "The only reported treatment course and its outcome in a single patient, including that the impairment progressed under it", which is the second of the two duplicates. That item was moved back; the first, whose explanation is written for the rehabilitation claim, stays where it is. Both treatments now cite the sentence once each, for their own distinct claims, which is legitimate - one publication supporting two claims is not a grading divergence, and `check-snippet-grading` passes.

    Suggestion - the Ataxia `notes:` still said "full texts this curation could not reach", curation narrative of the kind round 1 removed elsewhere. Rewritten to the reviewer's preferred wording, which is this entry's own top-level phrasing: "the panel reviewed full texts this entry's sources do not reproduce". "None of the primary reports cached for this entry" was changed to "cited by this entry" in the same sentence, for the same reason - what is cached is a fact about a working tree, what is cited is a fact about the entry.

    That phrase was missed by a single-line grep because the folded YAML scalar wraps it across two lines ("this curation could not\n    reach"). The sweep was redone over whitespace-normalized text for ten such phrases - "this curation", "by this change", "cached for this", "could not reach", "not fetched", "sources reached here", "from memory", "at the time of writing", "read afterwards", "was not built from" - and all now return zero. Worth remembering: any probe against YAML prose has to normalize whitespace first, for the same reason a snippet probe has to normalize typography.

    Validation on the final tree: validate-disorders PASS (86 snippets, 102 titles, 0 issues, exit 0), count-verified-snippets 86/86, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values all PASS. No cache CSV rows changed this round; no new references. Re-running validation truncated PMID_26425749 and PMID_27466185 from full text to abstract-only again (issue #12672, fourth occurrence this session); both reverted and all 86 snippets re-verified against the committed versions afterwards.

  summary: 'Review: Biotin-Thiamine-Responsive Basal Ganglia Disease'
  details: |
    Reverified all evidence against generated reference caches; added age-defined presentations, explicit autosomal-recessive counseling risk, cohort outcomes, variant and transporter structural context, treatment boundaries, animal and patient-derived iPSC models, and explicit knowledge gaps. Follow-up audit fixed reference-title and exact-quote validation, restored the legacy update timestamp, traced the mouse knockout to Slc19a3tm1Said/JAX 017343 while preserving the unregistered-transgene caveat, documented why age-defined presentations lack disease identifiers, and retained the iPSC lines only as a model resource. Documented the absence of a verifiable public dataset accession and declined unsupported bulk phenotype import.

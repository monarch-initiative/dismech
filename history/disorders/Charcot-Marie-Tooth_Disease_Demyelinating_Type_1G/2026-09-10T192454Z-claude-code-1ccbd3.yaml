  summary: 'Review round 1: add upper-limb/sensory/tremor phenotypes, PMP2 knockout
    model, GeneReviews tag (PR #11637)'
  details: |
    Addressed all three IMPORTANT findings from the ai4c-reviewer review on PR #11637, plus three of four suggestions, in one push. (1) Added four phenotypes documented in both family series and quotable from caches already in this PR: Weakness of the intrinsic hand muscles HP:0009005, Intrinsic hand muscle atrophy HP:0008954, Decreased amplitude of sensory action potentials HP:0007078, and Postural tremor HP:0002174. Every HP CURIE was resolved by live OLS lookup in the same step it was written, and each label confirmed by a second lookup keyed on the identifier. The sensory finding is bound to the amplitude term rather than a conduction-velocity term because an absent SNAP is the extreme of reduced amplitude and HPO has no absent-SNAP term; the preferred_term carries the source's wording. (2) Added the top-level references block tagging the GeneReviews CMT overview PMID:20301532 with tags GeneReviews, as the machine-readable record that GeneReviews was checked; no evidence item cites it, because its cached record is content_type abstract_only with no PMP2 content, and the notes now say the four-domain mining checklist is not achievable rather than skipped. (3) Corrected the original history record for this entry, which falsely stated the Perplexity report carries no reference_validation or term_validation block. It carries both; term_validation reports needs_review true, confabulation_rate 0.111, unresolved HP:0003479 and HP:0003430, and obsolete HP:0002355 replaced_by HP:0001288. All three flagged terms were checked against the entry and none is used in it, so no bad term reached the KB. The same false claim was made in the PR descriptions of all five PRs in this batch and has been corrected in each; note that of the five reports, four carry both validation blocks and only the Immunodeficiency_76 report genuinely lacks them, which is a live instance of issue #9844. Suggestions taken: added the Pmp2 knockout mouse as a FAILS_TO_RECAPITULATE model with limitations covering both the genotype mismatch and possible species differences in myelin protein stoichiometry, and folded it into the pmp2_dosage_versus_allele knowledge gap as the third leg of the argument against simple haploinsufficiency; added onset CHILDHOOD with min_age_years 2 to the distal weakness phenotype; connected seven previously orphan phenotypes to the pathograph by bare-name downstream targets. Suggestion not taken: hammer toes are not quotable from either cached source. Scoliosis is deliberately left uncurated and recorded in notes because the two series directly contradict each other - the index study says all patients had pes cavus without scoliosis, the later series reports it in one adult and cites a 30-50% literature figure. Validation: just validate passed, 44/44 snippets verified (was 36/36), just validate-terms passed, entity-refs / causal-targets / duplicate-keys passed.

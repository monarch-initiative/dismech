  summary: Correct a false 'not quotable' note and curate Hammertoe (HP:0001765)
  details: |
    Follow-up push after the round-3 re-approval on PR #11637, correcting a false claim the reviewer found in the round-2 notes and curating the phenotype it wrongly excluded.

    THE FALSE CLAIM. The entry notes said "Hammer toes were checked for and are not quotable from either cached source, so they are likewise omitted." That is false. I verified it independently rather than taking the reviewer's word: references_cache/PMID_37238449.md contains "hammer toes" three times - in the narrative sentence for patient III-1 ("who presented with foot deformities (pes cavus and hammer toes), areflexia and lower-extremity weakness"), and in the clinical-table rows for III-1 and III-3. The half of the claim that holds is that PMID_26828946.md has zero occurrences of the word.

    Why it matters more than a nit. This is the same defect class as the CRITICAL finding on a sibling PR in this batch, #11644, where a note asserted that no cited paper reported Dandy-Walker malformation and the founding paper stated it twice in its own prose. In both cases the note's stated purpose is to stop a later curator re-asking the question, and as written it stops them with a wrong answer. In both cases the cause was a search that came back empty being recorded as an absence in the literature.

    WHAT WAS DONE. Hammertoe is curated (HP:0001765, OCCASIONAL) rather than merely un-omitted, with both quotable strings as separate evidence items - the narrative sentence and the independent table row for a second affected member. Two of the nine affected members in that series is 22 percent, which clears the threshold used for the other phenotypes in this entry, so declining it would have been a second judgement call resting on the same bad premise. The phenotype's own notes record that the index family's paper does not mention it, so a reader sees the asymmetry between the two sources.

    It is wired into the pathograph as a downstream target of the same node that emits Pes cavus, typed INDIRECT_UNKNOWN_INTERMEDIATES, with an edge description noting that both deformities are reported together in the two members who have either.

    The notes paragraph carries an explicit CORRECTION naming the old sentence, why it was wrong, and what replaced it. It also states that the scoliosis decision in the same paragraph is unaffected: that one rests on the two series explicitly contradicting each other - the index study says all patients had pes cavus without scoliosis, the later series reports one adult case - which is a different and still-sound basis.

    COST. This push drops a fresh approval, the second time in this batch. The judgement is the same one made on #11639: the deterministic auto-merge sweep requires a PR to be more than three days old, so an approval has no near-term cash value, while a false statement about a cited source is a defect the repository treats as blocking when a reviewer finds it. The reviewer explicitly said they were not asking for the phenotype; they were right that the premise was wrong, and the premise is the part that had to change.

    VALIDATION. just validate passes with 46/46 snippets verified, up from 44/44. just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all pass.

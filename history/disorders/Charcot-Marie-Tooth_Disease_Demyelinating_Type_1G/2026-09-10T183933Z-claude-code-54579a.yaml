  summary: 'Create: Charcot-Marie-Tooth Disease, Demyelinating, Type 1G (PMP2, MONDO:0033135)'
  details: |
    De novo curation of CMT1G (PMP2-related demyelinating neuropathy). Deep research: one Perplexity sonar-deep-research report, committed at research/Charcot-Marie-Tooth_Disease_Demyelinating_Type_1G-deep-research-perplexity.md. CORRECTION (review round 1, PR #11637): this record originally stated that the report carries no reference_validation or term_validation block. That was wrong. The report carries both, in frontmatter, with reference_validation 10/10 verified and confabulation_rate 0.0, and term_validation reporting needs_review true, confabulation_rate 0.111, unresolved_terms HP:0003479 and HP:0003430, and obsolete term HP:0002355 replaced_by HP:0001288. All three flagged terms were checked against the entry and none of them is used in it, so no bad term reached the KB - but needs_review true was an available signal that this record reported as absent. The accompanying claim remains accurate: the report body contains zero PMID: strings and cites bare URLs, so it was used for orientation only and every reference was located independently via PubMed E-utilities and cached with just fetch-reference. Notably, my first attempt to identify the founding papers from memory produced two PMIDs that resolved to unrelated articles (a salt-reduction review and a neuroblastoma review), which is why the citation set was rebuilt by title search. Evidence: PMID:26828946 and PMID:27009151 (founding), PMID:32277537 and PMID:37238449 (later families), PMID:34138518 and PMID:34758297 (P2 biophysics and lipid handling), PMID:39880678 (PMP2+ Schwann cell subtype, ALS-framed). Three modelling choices are recorded in the entry notes: functional_impact_category is UNKNOWN and lipid processes carry modifier DYSREGULATED because neither direction is supported; PMP2 Dosage Sensitivity is curated as a HYPOTHETICAL node from what was intended as the transgenic control arm; and Areflexia HP:0001284 is used rather than Hyporeflexia HP:0001265 because the source says areflexia. Ontology bindings were read from cache/ or resolved live against OLS and HGNC in the same step they were written - this caught HP:0000135, which I had written from memory as autosomal dominant inheritance and which is actually Hypogonadism; the correct term is HP:0000006. GeneReviews: no CMT1G-specific chapter; the general CMT overview PMID:20301532 was retrieved and read but its abstract does not discuss PMP2, so nothing is cited from it. Validation: just validate passed, 36/36 snippets verified, just validate-terms passed, entity-refs / causal-targets / duplicate-keys passed.

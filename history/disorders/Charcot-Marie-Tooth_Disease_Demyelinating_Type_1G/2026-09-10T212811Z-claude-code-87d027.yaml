  summary: Correct an edge description that misstated how many family members have
    pes cavus
  details: |
    One-clause correction following the round-4 approving re-review on PR #11637.

    The Hammertoe downstream edge added in the previous push carried the description "both are reported together in the two family members who have either." The reviewer flagged the phrasing as imprecise and they were right, but it is worse than imprecise: it asserts that only two members of the family have either deformity. Verified against references_cache/PMID_37238449.md - eight of the patient rows in that series record pes cavus, against two recording hammer toes. So the clause is false about the source, in the same way, if not to the same degree, as the "not quotable from either cached source" sentence the previous push existed to correct.

    Now reads: "the two members reported with hammer toes are both reported with pes cavus as well", which is what the rows actually support and what the edge is for.

    The reviewer explicitly judged this not worth a push given dismiss_stale_reviews, and the substantive counts elsewhere in the entry are correct - the Pes cavus phenotype is banded FREQUENT with its own evidence one section away, and the Hammertoe phenotype's notes record two of nine. So nothing downstream of this clause was wrong. It is fixed anyway because a false statement about a cited source is the defect this batch has now corrected four times, and declining to fix the fifth on grounds of size would be a different standard than the one applied to the other four.

    The immediately preceding history record in this directory carries the same phrasing in its narrative. It is append-only and left as written; this record supersedes that clause.

    VALIDATION. just validate passes, 46/46 snippets verified, unchanged from the previous push - no evidence was touched.

  summary: Bind CSF orexin-A LOINC code; found under the synonym, not the entry's
    own term
  details: |
    LOINC tranche J batch 1. Bound LOINC:91670-0 (Orexin-A [Mass/volume] in Cerebral spinal fluid) to the Cerebrospinal fluid hypocretin-1 biochemical marker. Searching 'Hypocretin Cerebral spinal fluid' (the entry's own term) returns zero LOINC entities; searching 'Orexin A Cerebral spinal fluid' (the synonym LOINC actually indexes under) returns exactly one, fully enumerated. No interpretation_bands were added despite the entry's own cited value (191 pg/mL against a source-stated 'normal values > 200 pg/mL'): the entry's own evidence establishes that low, intermediate, and normal CSF hypocretin-1 values all occur in confirmed ADCA-DN patients, so a diagnostic cutoff would misstate a disease this analyte cannot cleanly separate from the unaffected range -- this is different from the ICSD-3 narcolepsy type 1 cutoff, which does not apply to this disease's own diagnostic criteria. Code verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

  summary: 'Create: ADCA-DN (autosomal dominant cerebellar ataxia, deafness and narcolepsy)'
  details: |
    De novo curation of ADCA-DN (MONDO:0011397, OMIM 604121, ORPHA:314404, gene DNMT1 / hgnc:2976) from a 22-line stub. Deep-research provider: Edison/Falcon (research/ADCA-DN-deep-research-falcon.md, 39 citations). NEC preflight passed before any DR content was used: DNMT1 x121, ADCA-DN x44, HSAN1E x10, hypocretin x10, OMIM 604121 present, and the gene plus OMIM anchors match the MONDO:0011397 record, so the report is genuinely about the intended entity. Every DR-sourced PMID, snippet, and ontology term was independently re-verified against the cached abstract and against OAK; DR output was treated as leads only. Curated content: 10 fully connected pathophysiology nodes running DNMT1 exon-21 RFTS missense variant to relief of RFTS autoinhibition and DNMT1 destabilization to mutant DNMT1 mislocalization plus aggresome formation and cell-type-specific methylome/transcriptome disruption to selective central and peripheral neurodegeneration to five organ-system arms (hypothalamic hypocretin, cerebellar, auditory pathway, cortical/frontosubcortical, optic nerve and peripheral sensory axon); 20 HPO-bound phenotypes; 127 evidence items across 21 distinct references; 2 biochemical markers (CSF hypocretin-1 and cerebellar myo-inositol on proton MRS); a DNMT1 genetic block with 3 variant records including the exon-21 versus exon-20 targeting-sequence-domain genotype-phenotype split; structured prevalence (CASES_IN_LITERATURE, RARE, no percentage field); a 3-phase progression including the presymptomatic SOREMP and MRS window; 4 diagnosis entries; 3 differential diagnoses; 7 treatments; 1 animal model; 1 experimental model; and 7 discussions. Module conformance to cerebellar_purkinje_degeneration and sensorineural_hair_cell_loss was evaluated and DECLINED, because neither module central effector (Purkinje neuron degeneration; hair cell mechanotransduction failure and death) has been demonstrated in ADCA-DN; the reasoning is recorded in disease notes and in discussion open_adcadn_module_conformance_declined with a proposed neuropathology experiment. Evidence-scoping discipline: the widely quoted mean onset 37.7 years, average survival 53.6 years, and 89 percent cognitive decline by age 45 are attributed by PMID:25678562 to HSAN1E rather than ADCA-DN, so they are deliberately excluded from prevalence, progression, and prognosis and instead captured as an explicit KNOWLEDGE_GAP; cochlear-implant benefit (non-exon-21 DNMT1-complex and HSN1E patients) and the HSAN1E-allele knock-in mouse data are tagged PARTIAL with the scope stated in each explanation. Cataract is recorded as a phenotype but deliberately left unwired in the pathograph because no mechanism has been proposed, with an OPEN_QUESTION discussion explaining the choice. Validation: just validate PASS (126/127 snippets verified against cached references, 1 ORPHA snippet skipped by prefix config), just validate-terms PASS, just validate-references PASS, scripts/check_folded_hyphens.py OK, compliance 85.6 percent global and 85.8 percent weighted, connectivity audit 19/20 phenotypes connected with zero orphan pathophysiology nodes.

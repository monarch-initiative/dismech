  summary: 'Review: ADCA-DN publication completeness and evidence alignment'
  details: |
    Completed a publication-completeness and claim-evidence review after confirming
    record identity (MONDO:0011397, DNMT1, OMIM:604121). A current literature and
    trial search added the 2025 DNMT1-NSUN2 RNA m5C/mitochondrial mechanism study
    (PMID:40328247) and the recruiting CoRDS observational registry
    (NCT01793168), while explicitly distinguishing model evidence and a broad
    registry from ADCA-DN-specific human mechanism or interventional evidence.

    Corrected evidence polarity for variable sensory neuropathy and HLA context;
    softened overstrong statements about sporadic narcolepsy type 1; removed an
    unsupported neuronal-apoptosis process annotation; broadened auditory anatomy
    to the auditory system because the lesion site is unresolved; clarified that
    HLA typing is non-diagnostic; and limited cochlear-implant and sensory-injury
    management claims to their actual evidence scope. The new RNA methylation,
    oxidative-stress, and mitochondrial-dysfunction branch remains provisional and
    carries an explicit human/model mismatch caveat because the published abstract
    does not identify the mouse RFTS allele or establish equivalence to a classical
    ADCA-DN exon-21 allele.

    Targeted schema, reference, ontology-term, history, folded-hyphen, and record
    connectivity checks passed. Reference validation verified 131 of 132 snippets
    (one unsupported identifier prefix was skipped). ADCA-DN connectivity is 19 of
    20 phenotypes and 1 of 1 genes; cataract remains deliberately unwired because
    no supported mechanism was found. Repository-wide graph validation continues
    to report pre-existing failures in 74 other disorder records, with no ADCA-DN
    failure. Broad validator-induced reference-cache churn was reverted; the
    retained diff is limited to this disorder, its REVIEW history, PMID:40328247,
    and the two generated UBERON:0016490 cache rows.

  details: |
    Follow-up pass on the frozen exact-head state (56b1d217cd), applying four
    claim-scope corrections plus two refinements made while completing them.

    1. Residual elliptical evidence. Four `target_mechanisms` snippets on the
       Ruxolitinib, Tocilizumab, Anakinra, and Allogeneic HSCT treatments still
       used "..." to join non-adjacent source text, and the Macrocytic Anemia
       evidence was still truncated mid-token at "(10/11". The prior commit
       fixed only the two occurrences outside `target_mechanisms`. All five are
       now self-contained exact propositions. The bracketed count "[91%]"
       cannot be quoted at all: the reference validator reads "[...]" as an
       omission marker, which is why the truncation existed rather than a
       simple extension to the closing bracket.
    2. Over-generalized inflammation node. "Multi-Organ Neutrophilic
       Inflammation" asserted neutrophilic character across every involved
       organ, while the cited PMID:33108101 sentence specifies neutrophilic
       involvement only for skin and lung, listing chondritis and vasculitis
       without that qualifier. Renamed to "Multi-Organ Inflammation", with the
       node description and the inbound edge description stating the scope
       explicitly. The `attaches_to` reference in the HUMAN_MODEL_MISMATCH
       discussion was updated; no other reference to the old node name exists
       in the repository.
    3. Macrocytic anemia frequency. `VERY_FREQUENT` rested on 10/11 (91%) in an
       11-carrier genome-first cohort. Recalibrated to `FREQUENT` on the
       PMID:40787890 consensus statement that macrocytic anemia is "a common
       finding in VEXAS". This mirrors the thrombocytopenia recalibration in
       the prior commit.
    4. Stale top-level `notes:` rationale. The block listed plasma-cell
       dyscrasia among unmodeled details although MGUS (HP:0031047) is modeled
       at phenotypes, and gave "no verified exact-substring snippet available"
       as the reason, which the full-text PMID:40787890 cache committed by this
       PR contradicts. Rewritten to state the actual reason for withholding
       organ-specific frequency bands - the consensus ranges 75-100%, 55-95%,
       14-64%, and 20-50% straddle two FrequencyEnum bands, so per
       docs/frequency-evidence-guidelines.md frequency is omitted rather than
       guessed. Aseptic meningitis and orchitis remain listed as unmodeled,
       now with the reason narrowed to what is true of them specifically: no
       reference cached for this entry carries a claim-specific quotable
       snippet. Also dropped the "type-I-interferon-adjacent" characterization,
       consistent with the earlier removal of unsupported interferon prose.

    Also in this pass, and not required by the four items above:

    - `biochemical:` expanded from a single relapsing-polychondritis-scoped CRP
      marker to three. The PMID:40787890 sentence that ESR, ferritin, and CRP
      "are increased in most untreated patients" was added to CRP as a general
      SUPPORT item, and new markers were added for ESR (HP:0003565) and
      ferritin (HP:0003281). The existing PMID:35868738 item is retained as the
      quantitative sub-claim, with its `notes` narrowed so the 64-versus-10
      mg/L median comparison is scoped to the VEXAS-RP subgroup rather than
      caveating the whole marker.
    - The PMID:36692560 cohort evidence dropped from Macrocytic Anemia in
      item 3 was restored as a `PARTIAL` quantitative sub-claim with a
      bracket-free complete quote, so the correction repairs the evidence
      rather than deleting it. Its explanation states that an 11-carrier cohort
      does not by itself fix a population-level frequency band.
    - The `Multi-Organ Inflammation` cell type reverted from
      `preferred_term: "Neutrophil in cutaneous and pulmonary inflammation"` to
      `Neutrophil`. CL:0000775 is not too broad for the cell type; the
      anatomical scope of the claim belongs in the node description, where it
      now is.

    Reference cache: no cache file is modified by this commit. Running the
    reference validator regenerated churn in seven `references_cache/*.md`
    files (frontmatter re-serialization, `full_text_attempted: true` flags, and
    an opportunistic full-text fetch for PMID:36038944). None of it was
    produced by `just fetch-reference` and none is needed by any snippet in

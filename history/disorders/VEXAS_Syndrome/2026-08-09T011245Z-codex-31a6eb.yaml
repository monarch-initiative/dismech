  summary: 'Review: VEXAS Syndrome evidence and completeness'
  details: |
    Reviewed the VEXAS Syndrome entry claim-by-claim against cached sources and current literature. Corrected a frequency mismatch that used overall skin involvement to classify neutrophilic dermatosis. Removed unsupported MDS-progression, pathognomonic-vacuole, overly specific ocular and pulmonary, and treatment-mechanism claims. Separated the established canonical p.Met41 UBA1b-loss mechanism from a deliberately provisional non-Met41 functional-variant branch. Added evidence for myeloid-skewed HSPC dysfunction, nonspecific marrow vacuoles, CRP elevation in VEXAS-relapsing-polychondritis, expanded UBA1 variation, and 2025 international consensus guidance. Updated the guidance knowledge gap and completed the missing organism descriptor for GSE272816. Incorporated an independent initial audit and an independent post-edit audit. Final targeted validation passed schema, ontology, history, reference, and dataset checks with 61/61 snippets verified, 9/11 phenotypes conservatively connected, and the causal UBA1 gene wired to mechanism (1/1). MDS and venous thromboembolism remain deliberately unconnected because the curated evidence establishes association but not causal direction.

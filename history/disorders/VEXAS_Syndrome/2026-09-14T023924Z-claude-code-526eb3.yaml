  summary: 'Classify: IUIS 2022 Table 10'
  details: |
    Added classifications.iuis_category: phenocopy of IEI, backfilled from IUIS 2022 Table 10 (Tangye et al., PMID:35748970), first section, 'Associated with somatic mutations'. The row gives the genetic defect as a somatic UBA1 mutation, and the table footnote records VEXAS as one of the three entities new to Table 10 in the 2022 update. The placement is the point of the disease: the lesion is acquired postzygotically in haematopoietic progenitors rather than inherited, so it produces an inborn-error phenotype without being an inborn error. Phenocopy-versus-primary check: there is no germline UBA1 counterpart entry in dismech, so unlike ALPS-sFAS or autoimmune PAP there is nothing here to confuse the assignment with, and the value sits on the entry itself rather than on a subtype. Notes also record that VEXAS involves a dysplastic marrow and so superficially looks like a Table 9 candidate; it is not in Table 9, and iuis_category is single-valued in any case. Evidence graded OTHER, snippet verified byte-exactly. Existing harrisons_chapter assignments untouched.

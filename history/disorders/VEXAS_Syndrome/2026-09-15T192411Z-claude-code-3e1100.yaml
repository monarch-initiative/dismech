  summary: 'Review: VEXAS orphan phenotypes connected to the pathograph (IUIS Table
    10)'
  details: |
    Three phenotypes had no incoming causal edge, so they rendered on the page while sitting outside the graph: myelodysplastic syndrome, monoclonal gammopathy of undetermined significance, and venous thrombosis.

    MDS and MGUS now hang off Myeloid-Skewed Hematopoietic Dysfunction, grouped there because both are clonal complications of the same UBA1-mutant marrow compartment and neither is a manifestation of the inflammatory arm. Venous thrombosis hangs off Multi-Organ Inflammation: the source's word is unprovoked, which is what places it downstream of the systemic inflammatory state rather than among ordinary thrombotic risk factors.

    All three are INDIRECT_UNKNOWN_INTERMEDIATES and say so - whether the dysplastic change is driven by UBA1 itself or by co-occurring myeloid drivers is unsettled, and the route from inflammation to thrombosis is not demonstrated in VEXAS specifically. 75/75 snippets verify.

  details: |
    Response to a fresh independent exact-head audit of eebdf76d6e, which
    returned one blocker and eight non-gating suggestions.

    Blocker fixed. The evidence `explanation` on the `Multi-Organ Inflammation`
    node still read "Enumerates the multi-organ neutrophilic inflammatory
    manifestations driven by the disease", which contradicts that node's own
    `description` fourteen lines above and re-asserts exactly the overclaim
    eebdf76d6e set out to remove. The cited PMID:33108101 sentence attaches
    "neutrophilic" only to cutaneous and pulmonary inflammation and lists
    chondritis and vasculitis unqualified. The rename pass in eebdf76d6e
    updated the node name, the node description, the inbound edge description,
    and the `attaches_to` reference, but missed this string. The explanation now
    states the scope of the neutrophilic qualifier explicitly.

    Corrections to the immediately preceding history record
    (2026-08-10T212450Z-claude-code-751685.yaml). That record is append-only and
    is left in place; two of its statements are inaccurate and are corrected
    here rather than edited there.

    - Its item 1 says five elliptical or truncated snippets were replaced. The
      correct count is six: four "..." joins in `target_mechanisms` plus two
      separate mid-token `(10/11` truncations - one on the `Myeloid-Skewed
      Hematopoietic Dysfunction` -> `Macrocytic Anemia` downstream edge and one
      on the `Macrocytic Anemia` phenotype. Verified by counting the removed
      snippet lines in `git show eebdf76d6e`. An undercount, but the record
      should be accurate.
    - Its final bullet describes reverting the `Multi-Organ Inflammation` cell
      type from `preferred_term: "Neutrophil in cutaneous and pulmonary
      inflammation"` to `Neutrophil`. That is a truthful account of an
      intra-session round trip, but it reads as though the committed diff
      changed that field. It did not: parent 56b1d217cd already carried
      `preferred_term: Neutrophil`, the long form existed only in the
      uncommitted working tree, and the string appears nowhere in
      `git show eebdf76d6e`. The final-state assertion in that record is
      correct; only the implication of a committed change is wrong.

    Audit findings deliberately not acted on in this commit, all classified
    non-gating by the auditor and left for a separate pass so this commit stays
    a single auditable fix: the unsourced "about 96%" male figure in the disease
    description; the deprecated `prevalence.percentage` free-text slot
    (pre-existing, structured slots correct alongside); `frequency: FREQUENT`
    for Venous Thrombosis from the clean 50% consensus point estimate; a myeloid
    cell type on the `Myeloid-Skewed Hematopoietic Dysfunction` node; the
    PMID:35609174 snippet being drawn from the journal's "In This Issue" blurb

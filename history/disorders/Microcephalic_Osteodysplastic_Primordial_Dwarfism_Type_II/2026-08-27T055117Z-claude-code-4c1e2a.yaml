  summary: Wire 23/23 phenotypes into the pathograph
  details: |
    Pathograph-connectivity pass (0/23 at baseline). Wired the growth, skeletal, dental, haematologic and immune phenotypes off the progenitor-proliferation node; the moyamoya vasculopathy, aneurysms, stroke, hypertension, coronary disease and chronic kidney disease off the vasculopathy node; and insulin resistance, diabetes and hypercholesterolemia off the metabolic node. The cerebrovascular grouping matters clinically: it puts stroke downstream of the moyamoya lesion, which is what makes cerebrovascular surveillance the priority in this disorder. Near-normal intelligence despite extreme microcephaly is wired off the centrosome node as a recorded negative finding, with its description stating that no mechanism explains the cognitive sparing. Result: 23/23 connected.

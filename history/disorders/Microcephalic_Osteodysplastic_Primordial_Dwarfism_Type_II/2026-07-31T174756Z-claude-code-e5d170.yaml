  summary: 'Create: Microcephalic Osteodysplastic Primordial Dwarfism Type II'
  details: |
    De novo curation of MOPD II (Majewski osteodysplastic primordial dwarfism type II;
    PCNT; MONDO:0008872).

    Lump-vs-split decision, made before curation: MOPD I and MOPD II were curated as TWO
    records, not one, for the reasons recorded in the companion MOPD I history record
    (distinct genes, mechanisms, natural histories, identifiers, and GeneReviews chapters).
    Each entry carries the other as an explicit differential diagnosis with structured
    distinguishing_features.

    Deep research: the falcon/Edison provider returned HTTP 402 Payment Required and could
    not be run, so the claude_code provider was used instead
    (research/Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_II-deep-research-claude_code.md).

    GeneReviews baseline: PMID:34978779 was found, fetched, cached, tagged in the top-level
    references block, and cross-referenced. Its Agents/Circumstances to Avoid section
    (growth hormone supplementation without documented GH deficiency; excessive nutritional
    supplementation in infancy) is curated as a dedicated treatment entry so the
    contraindication is machine-visible.

    Pathograph curated: biallelic PCNT loss of function -> centrosome and mitotic spindle
    disorganization (conforms_to
    neural_progenitor_centrosome_spindle_dysfunction#Centrosome and Mitotic Spindle
    Perturbation) -> defective ATR-dependent checkpoint signaling -> reduced progenitor
    proliferation and global cell number deficit, with parallel global-vasculopathy and
    insulin-resistance arms.

    DR errors caught and corrected during curation: the MONDO ID (report gave MONDO:0008034;
    OAK-verified correct term is MONDO:0008872) and the PCNT HGNC ID (report gave HGNC:8720;
    OAK-verified correct ID is hgnc:16068). The report's smooth-muscle-cell HSF1/HMGCR
    atherogenesis mechanism and its statin-repurposing proposal were deliberately NOT curated
    as pathophysiology or treatment: the supporting 2023 JCI Insight article had no PMID
    recoverable in this session, so no snippet could be verified against a cached abstract.
    That mechanism is recorded as an explicit KNOWLEDGE_GAP discussion attached to the
    Global Vasculopathy node instead.

    Validation: just validate passes schema, term, and reference validation;
    52/52 snippets verified against cached references; weighted compliance 92.1%.

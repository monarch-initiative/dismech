  summary: Re-verify ISDS group 21 assignment against the 2023 Table 1
  details: |
    Group-21 re-verification pass. The existing assignment cited the 2019 revision (PMID:31633310) Table 1 group 19, part of the 2019-derived backfill the axis documentation flags as outstanding. Re-derived it from the 2023 Table 1 (PMID:36779427), where this entity is NOS 21-0100 (PCNT, OMIM 210720). Group value unchanged - only the provenance in notes was upgraded, and the assignment was confirmed correct. The note records that the 2023 gene symbol is PCNT rather than the older PCNT2 used in the previous note, and that dyadic renaming gives this row, the RNU4ATAC MOPD row and the six Seckel rows a shared printed name stem, so gene and OMIM number are what distinguish MOPD II within the group. Schema validation, folded-hyphen, duplicate-key and entity-ref checks all pass.

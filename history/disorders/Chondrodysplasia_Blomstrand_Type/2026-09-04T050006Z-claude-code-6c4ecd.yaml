  summary: 'Create: Chondrodysplasia Blomstrand Type (MONDO:0008970, PTH1R)'
  details: |
    De novo curation of Blomstrand osteochondrodysplasia (BOCD, MIM #215045), a perinatally lethal autosomal recessive osteochondrodysplasia caused by biallelic loss-of-function PTH1R variants. Seven-node pathograph runs from the receptor lesion through abolished PTH/PTHrP second-messenger signalling in growth plate chondrocytes, loss of the Indian hedgehog-PTHrP brake on chondrocyte differentiation, accelerated hypertrophic differentiation, growth plate hypoplasia, premature endochondral ossification, and the extraskeletal PTHrP-dependent breast and tooth arm. Thirteen phenotypes, of which frequency bands are asserted only where the denominator is the five-fetus prenatal series (PMID:35808914). ISDS 2023 group 28 (parathyroid hormone signalling cascade) classification recorded. Pth1r-null mouse linked to two pathograph nodes with readouts, plus a HUMAN_MODEL_MISMATCH discussion about the absence of reported osteosclerosis in the mid-gestation-lethal mouse. Perinatal lethality phenotype deliberately left unbound: HP:0003826 Stillbirth is outside the PhenotypeTerm dynamic enum and the mortality terms are clinical-course modifiers. Validated with just validate (schema, terms, references: 66/66 snippets verified), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms.

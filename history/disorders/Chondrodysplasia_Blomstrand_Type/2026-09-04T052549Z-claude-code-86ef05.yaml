  summary: Correct phenotype frequency bands to match their denominators
  details: |
    Self-review of the initial commit. Five phenotypes carried frequency: VERY_FREQUENT (80-99%) alongside notes stating 5 of 5 or 4 of 4 -- an observed fraction of 100%, which the band contradicts. Removed the band from all five and recorded in each phenotype's notes why: denominators of 4 and 5 cannot separate OBLIGATE from VERY_FREQUENT, and the series is a referred prenatal-diagnosis cohort rather than complete ascertainment. Changed perinatal lethality from VERY_FREQUENT to OBLIGATE; that one does not rest on the five-fetus series but on the whole literature, in which no survivor has ever been reported and lethality is definitional for this entity. Re-ran just validate (schema, terms, references 66/66 snippets) and check-enum-values.

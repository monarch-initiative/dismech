  summary: 'Review round: add type I/II subtypes and correct the P132L characterisation'
  details: |
    Addressed the two blocking findings on PR #10894. Finding 1, subtype completeness: added a has_subtypes block for BOCD type I and type II, cited to the Hoogendam 2007 JCEM abstract (DOI:10.1210/jc.2006-0300) that this PR had cached but never cited. Type I is complete PTHR1 inactivation, anchored on the homozygous R104X nonsense allele; type II is near-complete inactivation with low residual activity, anchored on the intronic splice-creating allele (legacy designation intron M4+27C>T) and the recurrent P132L missense allele. The disease-level description now names the axis. No subtype frequency is asserted: the source studied two type I and three type II families, which is a series and not a denominator. A review_notes entry records that no PTH1R mutation was found in the second type I family, so the type I group is defined clinically and is not fully accounted for molecularly. Finding 2, contradicted description: the root pathophysiology node said Blomstrand alleles abolish receptor function outright rather than merely reducing it, and that P132L destroys ligand binding. Checked both 1998 primary reports directly. PMID:9745456 (Zhang/Silve) reports PTH-induced cAMP severely reduced, inositol phosphate undetectable, and maximal specific radioligand binding under 10 percent of wild type with normal surface expression by GFP fusion. PMID:9832466 (Karaplis) reports no cAMP and no radioligand binding for the same allele. Hoogendam 2007 resolves the disagreement as low residual activity and assigns P132L to type II. The node description now separates the null end (R104X, the exon M5 splice allele) from the hypomorphic end (P132L), records that the two 1998 laboratories differ on how complete the defect is, and cites the 2007 re-analysis. Four evidence items were added to the node to carry those claims. The node's genetic_context previously asserted zygosity HOMOZYGOUS alongside prose saying homozygous or compound heterozygous, which PMID:27353973 supports; since the slot is single-valued and has no biallelic value, zygosity was removed rather than narrowed, with the reason recorded in the block description. Non-blocking items taken: the genetic notes allelic spectrum now includes R104X and the intronic allele with their own evidence, and states explicitly that c.1093delG is omitted because the 2025 review that reports it is not in references_cache. The bundled phenotype 'Absent nipples and breasts' bound to HP:0002561 Absent nipple was split into 'Absent nipple' (HP:0002561) and 'Breast aplasia' (HP:0100783), and the pathophysiology downstream edge was split to match. Coarctation of the aorta was added as a phenotype (HP:0001680), cited to the zebrafish PTHR1/Notch paper's background statement, graded MODEL_ORGANISM because that is the study type of the cited publication, with no frequency band and no causal edge because the same sentence says it is unclear whether PTHR1 deficiency causes coarctation directly. A notes entry on the breast/tooth node records why GO:0071374 is kept despite being broader than the preferred_term. The duplicate case-variant cache file DOI_10.1161_atvbaha.112.300590.md was deleted, keeping the uppercase form matching the publisher's DOI. Declined: pulmonary hypoplasia, which grep confirms is not quotable from any cached reference here, and which is already represented mechanistically by the curated Thoracic hypoplasia node and its lethality edge. Validation: just validate green including reference validation, validate-terms passed, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all clean, count-verified-snippets 73/85 with the 12 DOI-prefixed items skipped by the validator's skip_prefixes; those 12 were verified by an explicit exact-substring and frontmatter-title check against the cache files. Whole-KB check-title-snippets, check-snippet-length and check-snippet-grading report no new violations.

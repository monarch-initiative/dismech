  summary: 'Create: Platelet-type Bleeding Disorder 11'
  details: |
    New Disease entry for BDPLT11 (MONDO:0013623, GP6/glycoprotein VI deficiency), curated from the stub. Lump/split: curated as its own Disease - one conserved pathograph (biallelic GP6 loss of function -> absent surface GPVI/FcR gamma-chain -> failure of collagen-induced activation -> absent collagen-induced aggregation and secretion -> reduced thrombus growth and procoagulant activity under flow -> failure of the primary hemostatic plug -> mild mucocutaneous bleeding), with ClinGen rating GP6 Definitive for this MONDO disease under autosomal recessive inheritance. Conforms to primary_hemostatic_plug_failure at the adhesion arm (the arm the module designates for GPVI deficiency) and at the activation/secretion arm, both supported by the entry's own evidence. Deep research: falcon was requested but has no API key configured in this environment, so the run fell back to claude_code and the report is named for claude_code (fell_back: true, requested_provider: falcon in its frontmatter). Its Term Validation section flags four CURIEs it named as something else, including NCIT:C809 offered for tranexamic acid (NCIT calls it Ricin); none of the report's suggested CURIEs were bound. Every term in the entry was read from cache/<prefix>/terms.csv, HGNC's REST API (hgnc:14388 GP6) or ols:mondo. Every snippet was taken from a references_cache file fetched with just fetch-reference. No GeneReviews or StatPearls chapter exists (check-genereviews NO_CHAPTER), recorded in review_notes. Acquired anti-GPVI autoantibody deficiency is treated as a differential only. Validation: just validate pass, 41/41 snippets verified, just validate-terms pass, check-causal-targets / check-entity-refs / check-duplicate-keys / check-qualifier-terms / check-coarse-phenotypes / check-gene-validity pass, validate-disorders pass (41 snippets, 51 titles, 0 issues).

  summary: Correct false LOINC-absence claim; name the mismatched code
  details: |
    The chlorophacinone plasma-concentration marker's note claimed no LOINC code exists for chlorophacinone, based on two runoak l~ searches that returned zero results. A direct Monarch API search (q=chlorophacinone, category=biolink:ClinicalMeasurement) returns one hit, LOINC:87610-2 'Chlorophacinone [Mass/mass] in Specimen' -- the runoak l~ route missed it. The decision not to bind is unchanged and still correct: 87610-2 is a mass/mass measurement in an unspecified specimen, suited to tissue or bait analysis rather than the plasma concentration in microgram/mL or mg/L this marker describes. Rewrote the note to name the code and give the property/specimen mismatch as the reason, rather than asserting an absence that was not true.

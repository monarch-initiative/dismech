  summary: 'Create: Chlorophacinone Poisoning'
  details: |
    Created kb/disorders/Chlorophacinone_Poisoning.yaml de novo. Chlorophacinone is
    an indanedione anticoagulant rodenticide; the entry models the acquired vitamin
    K-antagonist coagulopathy it causes.

    No MONDO term exists. MONDO was searched live through OLS4 for chlorophacinone,
    indandione, anticoagulant rodenticide and rodenticide poisoning, and the 60
    hierarchical children of MONDO:0029000 (poisoning) were enumerated; none covers
    rodenticides or anticoagulants. The entry therefore carries no primary
    disease_term and records only a skos:broadMatch to MONDO:0029000, with the
    reasoning in the entry notes. A new MONDO term request is the correct follow-up.

    Deep research. The user asked for Edison falcon. The falcon provider could not
    run: EDISON_API_KEY from .env is rejected with HTTP 403 Forbidden at
    https://api.platform.edisonscientific.com/auth/login (edison_client raises
    "Failed to authenticate"). The key is well formed, 235 characters, unquoted, no
    whitespace, so this is a server-side credential rejection and not a local
    configuration fault. Two attempts were made. Deep research was therefore run
    with the claude_code provider instead, producing
    research/Chlorophacinone_Poisoning-deep-research-claude_code.md (798 s, 16 web
    searches, 58 turns).

    Report validation, per the skill's Step 3a. The report's own frontmatter records
    needs_review: true, 48 references checked, 47 resolved, 1 unresolved
    (PMID:34748846), confabulation_rate 0.021, 31 of 47 on topic, 0 off topic; term
    validation 45/45 resolved. PMID:34748846 is NOT cited anywhere in this entry.
    The six terms the validator lists as "named as a different term" are a report
    formatting artifact: the report wrote the string "not verified this session" in
    the label column rather than a wrong label. HP:0000132 (Menorrhagia) and
    HP:0001903 (Anemia) are used here and both were independently confirmed against
    the local HPO adapter.

    NEC check. just preflight-dr cannot run without a MONDO ID. The manual
    substitute was a gene- and agent-frequency count over the report body: 124
    mentions of chlorophacinone against 16 brodifacoum, 15 bromadiolone, 29 warfarin
    (mostly as the comparator), and 25 VKORC1. The report is about the intended
    entity.

    Curated content. Nine pathophysiology nodes forming a connected chain from
    systemic exposure through VKORC1 inhibition, reduced-vitamin-K depletion,
    failed gamma-carboxylation, functional factor II/VII/IX/X deficiency,
    prolonged coagulopathy and multicompartment haemorrhage to hypovolaemic
    shock and death, with hepatic accumulation and prolonged elimination as a
    parallel branch feeding the coagulopathy node. 19 phenotypes, 2 biochemical
    markers, 1 environmental exposure (ECTO:9002177) linked into the pathograph,
    3 treatments, 3 diagnosis entries, 3 progression phases, 3 epidemiology
    entries, 5 differential diagnoses, 2 animal models, 5 discussions, 109
    evidence items over 22 references. Connectivity was checked
    programmatically: no pathophysiology node lacks an incoming edge, and every
    downstream, influences_mechanisms, target_mechanisms, modeled_mechanisms,
    readout and attaches_to target resolves.

    Evidence discipline. Every snippet was pre-verified against the local
    references_cache before being written into YAML, using a
    whitespace-normalizing substring check, so no blocked write or re-emission
    was needed. Every reference_title was extracted programmatically from the
    cache title: line and re-checked against the cache after all edits; all 22
    match, and the set of cited PMIDs equals the set listed in the top-level
    references block.

    Class-level evidence and the directness slot. Most of the anticoagulant
    rodenticide literature reports the class rather than chlorophacinone. Note
    that the schema no longer accepts supports: PARTIAL, which CLAUDE.md still
    documents; supports is direction only and directness carries the inference
    step. One rule was applied to every one of the 109 items and no item is left
    untagged: INDIRECT where the quoted sentence is about the class rather than
    chlorophacinone, or comes from a non-human system, or is a therapeutic
    recommendation used as mechanism evidence; DIRECT where the sentence names
    chlorophacinone or the specific case and asserts the claim. That yields 75
    INDIRECT and 34 DIRECT. For evidence_source in reviews and guidelines the
    rule is OTHER for pharmacological assertions and management recommendations,
    HUMAN_CLINICAL for aggregated patient observations. An automated audit
    confirms no snippet carries two different tag combinations anywhere in the
    file.

    Adversarial self-review before the PR. A subagent review against the
    dismech-pr-review skill returned five blocking and six high findings; all
    were acted on. The frequency: FREQUENT band on Hematuria was removed, since
    39 of 88 comes from a case-report synthesis enriched for severe outcomes and
    the entry's own epidemiology records about 2 per cent morbidity across
    reported exposures; the sources support a rank, not a rate. The
    directness and evidence_source inconsistencies described above were the
    review's other two blocking findings and were fixed by the whole-file
    retag. Two chlorophacinone-specific papers already in this branch's cache
    but uncited were brought in: PMID:1522713, twenty poisoned patients and the
    only source giving a serum concentration below which bleeding risk has
    resolved, and PMID:23109180, which identifies three hydroxy-metabolites in
    rat and reports a hepatic plateau suggesting rapid elimination, both of
    which bear directly on the persistence discussion and one of which cuts
    against it. Also added on review: the lamb epizootic (PMID:17037620) as a
    second animal model, three missing differentials (warfarin/coumarin, liver
    failure, disseminated intravascular coagulation), the consensus
    out-of-hospital guideline (PMID:17357377), the Paris series recommendation
    to recheck the prothrombin time 48 hours after stopping vitamin K
    (PMID:2729812), coma and acute compartment syndrome as phenotypes, milk
    transfer as an exposure route, and an INTERPRETATION discussion on whether
    the published argument against CYP inducers, which rests on brodifacoum not
    being metabolised, transfers to a compound that is. The 39893780 snippet was
    swapped from an aims sentence to the paper's validation result, and the
    16716547 snippet from an "the authors discuss" sentence to the one reporting
    the case; the thrombosis discussion no longer says the death was attributed
    to chlorophacinone, since that paper calls the diagnosis suspicious and
    problematic. The factor VII half-life ordering is retained but now carries a
    note saying it is standard coagulation physiology not demonstrated in any
    cited source. Curation-process narrative was trimmed out of the rendered
    notes fields and lives here instead.

    Deliberate omissions, recorded in the entry notes so they are not
    re-attempted. HP:4000177 (Bleeding ameliorated by vitamin K) fits this
    disorder but descends from HP:0012823 Clinical modifier rather than
    HP:0000118, so it is outside the PhenotypeTerm dynamic enum; it was tried
    and removed. HP:0045063 (Increased PIVKA-II) is mechanistically apt but no
    cited source here reports PIVKA-II measurement in chlorophacinone poisoning,
    and the PIVKA-antigen clause that had been asserted in a node description
    was removed for the same reason. No datasets block: no omics or perturbation
    dataset for chlorophacinone exposure was found, only wildlife and livestock
    residue chemistry, which measures the compound rather than a host response.
    A VKORC1 or CYP2C9 pharmacogenomic susceptibility claim was NOT curated; it
    is mechanistically plausible but every available citation is a warfarin
    study. An unevidenced claim that vitamin K1 works by way of a
    warfarin-insensitive quinone reductase was written into a treatment
    description and then removed, because nothing cited here states it. The
    class-level clauses about greater VKOR affinity are explicitly not carried
    over onto the chlorophacinone node, because the same entry records that
    rodent-efficacy sources call it first-generation, which is a lower-potency
    claim.

    Discussions. Two knowledge gaps: whether loss of the vitamin K-dependent
    anticoagulants protein C and protein S explains the reported paradoxical
    thrombosis, and why hypocoagulability persists after plasma chlorophacinone
    falls. Two interpretation entries: chlorophacinone is called first-generation
    by rodent-efficacy sources and long-acting by human-toxicology sources, with
    the verbatim quote for each, because the first-generation label wrongly
    implies a warfarin-length treatment course; and whether the anti-CYP-inducer
    argument transfers. One knowledge gap on the widely repeated claim that
    indandiones uncouple oxidative phosphorylation, for which PubMed queries
    pairing chlorophacinone, indandione, diphacinone and pindone with uncoupling,
    mitochondria and oxidative phosphorylation returned no records; it carries
    the FXR-antagonism paper (PMID:27773686) so the entry is not read as
    claiming chlorophacinone has no off-target activity at all.

    Validation actually run and read. just validate (schema, terms, references) and
    just validate-disorders, the batched form CI runs: schema clean, terms passed,
    109/109 snippets verified against cached references. just check-duplicate-keys,
    just check-entity-refs (2832 files), just check-title-snippets, just
    check-folded-hyphens: all pass. just compliance: 96.6% global, 97.0% weighted.
    Term validation genuinely consulted the ontologies, confirmed by new rows
    appearing in cache/chebi, cache/ecto, cache/go and cache/hgnc terms.csv and in
    four cache/enums membership files. uv run pytest tests/test_data.py against the final file state: 47829 passed.

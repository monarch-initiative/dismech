  summary: Bind LOINC to the INR marker; record no code exists for chlorophacinone
  details: |
    Added loinc_term (LOINC:38875-1, INR in Platelet poor plasma or blood by Coagulation assay) to the existing International normalized ratio marker; no method-less INR code exists in LOINC, since INR is inherently derived from a coagulation assay's PT result. No reference range is bound: the INR here is an intervention trigger for vitamin K1 dosing, not a diagnostic severity grade. Recorded, on the existing Plasma chlorophacinone concentration marker, that no LOINC code exists for chlorophacinone specifically (searched the Monarch KG for both 'l~chlorophacinone' and 'l~Chlorophacinone', zero results both times), so no identity code is bound to that marker; also declined to formalize the marker's own 'below 1 microgram/mL' bleeding-resolution figure as a reference_ranges band, since it is a single 20-patient cohort observation and the entry's own notes already record a counter-example (persistent hypocoagulability at a low plasma level). LOINC:38875-1 was verified against the Monarch KG and confirmed absent from origin/main and from every other open campaign branch before being seeded as a new, additive cache row.

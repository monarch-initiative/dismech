  summary: 'Genetics pass (d2g series-068): map the OMIM-series HAE4 and HAE6 classes
    onto the existing PLG and non-F12/non-PLG rows'
  details: |
    Genetics-gap issue 12275. Both checklist rows were substantively already curated under different CURIEs. MONDO:0025712 angioedema, hereditary, 4 (OMIM:619360) and MONDO:0035220 PLG-related hereditary angioedema with normal C1inh are both direct children of MONDO:0019623, both assert PLG (hgnc:9071) in their OWL axioms, and neither carries a textual definition or a recorded rationale for being separate from the other; the Orphanet-derived class was already bound as the PLG-related row's subtype_term, so MONDO:0025712 is recorded on that row as a skos:exactMatch and reported as a probable MONDO duplicate pair. MONDO:0023660 angioedema, hereditary, 6 (OMIM:619363) asserts KNG1 (hgnc:6383) and is narrower than the Other normal C1-INH row, which covers four genes including KNG1, so it is recorded there as a skos:narrowMatch. The siblings MONDO:0030293, MONDO:0025713 and MONDO:0030298 assert no causal gene and carry no definition, so which gene each denotes cannot be read off MONDO and they are deliberately not mapped. Gene wiring unchanged at 3/4; the unwired record is Normal-C1-INH genetic heterogeneity, a deliberately multi-gene record with no single gene_term, whose four genes are all bound on the Normal C1-INH contact-system gene dysregulation node, so the 3/4 is a measurement artifact rather than a gap. Phenotype inlink 19/19. No references fetched. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

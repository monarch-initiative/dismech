  summary: 'Address PR #7264 review: danazol/TXA, trials, modalities, split bundle'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7264 (five IMPORTANT, three
    suggestions). All five blocking items and two suggestions are addressed.

    MERGE CONFLICT, resolved first. The branch had a genuine content conflict with main in
    kb/disorders/Hereditary_Angioedema.yaml, not just in generated caches: main had appended a
    datasets: block after references while this branch had appended further reference entries at
    the same point. Resolved by keeping BOTH sides - the branch's 77 lines of additional
    references continue the list, then main's datasets block follows - rather than taking either
    side wholesale. Verified by parsing the result and confirming 32 references and 1 dataset
    survive. Four generated cache CSVs also conflicted and were resolved to main's side with this
    entry's rows re-derived by just validate-terms.

    ITEMS 1 and 2 - missing danazol and tranexamic acid, and the orphaned plasmin node. Both added,
    and item 2 is fixed by item 1 as the review predicted: tranexamic acid carries a
    target_mechanisms INHIBITS edge onto Plasmin-mediated contact-system amplification, which had
    described tranexamic acid in its own text while having no treatment attached to it. Danazol
    attaches to the SERPING1 deficiency node with treatment_effect MODULATES, since attenuated
    androgens raise circulating C1-INH rather than inhibiting a downstream enzyme - it is the only
    prophylactic in this entry acting on the deficiency itself.

    Both are curated with an evidence caveat stated openly rather than hidden. The only quotable
    source in this entry's cache naming either drug is PMID:19477491, an FXII-HAE cohort in which
    danazol was used by 2 women and tranexamic acid by 1. That is far weaker than the drugs'
    actual evidence base - decades of data for danazol, guideline standing for both - but the
    cached WAO/EAACI guideline record contains no danazol or tranexamic acid text at all, so
    nothing stronger can be quoted. Both evidence items are PARTIAL and both treatments carry
    notes saying explicitly that the attached evidence understates the basis for use, and that for
    tranexamic acid the mechanistic placement on the plasmin node is the more important claim and
    follows from the drug class rather than from the cited cohort.

    ITEM 3 - no clinical_trials section. Added the three the review named: NCT05120830 (NTLA-2002
    phase 1/2), NCT06634420 (HAELO phase 3), and NCT05121376 (BMN 331, AAV5 hSERPING1). Statuses
    and phases were taken from the live ClinicalTrials.gov API rather than the research artifact -
    all three are ACTIVE_NOT_RECRUITING. The descriptions place each trial on the pathograph: the
    two NTLA-2002 trials act on the same plasma kallikrein node as lanadelumab and berotralstat but
    aim to knock down its precursor permanently in a single dose, while BMN 331 acts on the
    SERPING1 deficiency node at the head of the chain and is restricted to C1-INH deficiency, so it
    does not apply to the normal-C1-INH subtypes this entry also models. No corresponding treatment
    entries were created - these are investigational and curating them as treatments would imply
    availability.

    ITEM 4 - therapeutic_modality on only 2 of 7 treatments. Backfilled exactly as specified:
    C1-INH replacement PROTEIN_REPLACEMENT, icatibant and sebetralstat SMALL_MOLECULE, ecallantide
    PEPTIDE. With the split in item 5 and the two new drugs, all 10 treatments now carry a
    modality.

    ITEM 5 - lanadelumab and berotralstat bundled. Split into two treatments. The review's argument
    was right on its own terms (a mAb and an oral small molecule cannot share a modality tag) and
    the split is defensible on clinical grounds too, since modality, route and dosing interval are
    what drive the choice between them despite the shared target. Both retain the kallikrein
    target_mechanisms edge and their own trial evidence; each description states that they share a
    target and why they are nonetheless separate, so the split does not read as an oversight.

    SUGGESTION 6 taken - subtype case fractions from the already-cached PMID:39456231, added as a
    CASES_IN_LITERATURE prevalence record: type I about 85%, type II about 15%, normal-C1-INH about
    5-10%. The notes state why those do not sum to 100 - the normal-C1-INH figure comes from a
    differently ascertained denominator and is the least secure of the three, because
    normal-C1-INH disease cannot be found by C1-INH assay and requires genetic testing most centres
    do not perform. The type III evidence item is PARTIAL and notes that the source uses the
    superseded "type III" label for what this entry curates as the normal-C1-INH subtype group.

    SUGGESTIONS 7 and 8 not taken. CPN1 and DAB2IP as emerging normal-C1-INH genes, and the
    emerging therapies (deucrictibant, navenibart, ADX-324), are not supported by any snippet-
    quotable text in this entry's cached sources; the review itself marked both as conditional on
    being snippet-supportable. Adding them would require fetching new references for claims that
    are, by the review's own framing, optional.

    VALIDATION. 'just validate-disorders kb/disorders/Hereditary_Angioedema.yaml' passes in full -
    schema, terms, references - with "Snippets checked: 162/162 verified against cached
    references", up from 155/155 after the conflict resolution (the review counted 189 against the
    pre-rebase file). CHEBI:4315 danazol and CHEBI:48669 tranexamic acid were verified with OAK
    before use.

    Separately noted, not actioned here: the review's tooling finding that
    linkml-reference-validator reports "Total checks: 0" on this file while verifying zero
    snippets. That is the known upstream counter behaviour documented in CLAUDE.md - the affirmative
    signal is the "Snippets checked: N/N" line the wrapper appends, which reports 162/162 here.

  summary: 'Augment: Hereditary Angioedema contact-system pathograph, triggers, knowledge
    gaps'
  details: |
    Augmented the existing entry using Edison/Falcon deep research
    [research/Hereditary_Angioedema-deep-research-falcon.md; 30 citations; 576s runtime]
    plus targeted PubMed searches. The entry had previously been built only from a
    deep-research FALLBACK file, so this is its first real DR-backed pass.

    Pathophysiology: expanded the pathograph from a shallow 4-node chain into the
    explicit plasma contact / kallikrein-kinin cascade, adding Unrestrained factor
    XII activation, Plasma kallikrein activation including the reciprocal
    kallikrein-to-FXII amplification loop, High-molecular-weight kininogen cleavage
    and bradykinin liberation, Endothelial adherens junction destabilization, and
    Plasmin-mediated contact-system amplification, plus a C1-INH intracellular
    retention / ER-stress arm. Added biological_scale tags. Normal-C1-INH subtype
    genes now enter the graph at their distinct points: F12 at FXII activation, KNG1
    at kininogen cleavage, PLG at the plasmin arm, ANGPT1 and HS3ST6 at the
    endothelial node.

    Treatments: retargeted every drug target_mechanism onto the node it actually
    acts on. Ecallantide, lanadelumab, berotralstat, sebetralstat and donidalorsen
    now point at Plasma kallikrein activation; icatibant at bradykinin B2 receptor
    signalling. Added garadacimab, the anti-FXIIa monoclonal antibody, from the
    VANGUARD phase 3 trial PMID:36868261.

    Also added: an environmental section covering the clinically critical attack
    triggers - estrogens, ACE inhibitors, trauma and procedures, emotional stress;
    four sourced KNOWLEDGE_GAP discussions with proposed experiments covering the
    initiating trigger of contact activation, the bradykinin B1 receptor role, the
    unexplained phenotypic variability, and the normal-C1-INH definition and
    diagnostic-yield problem; per-gene inheritance evidence; and new top-level
    references.

    Prevalence migrated off the deprecated percentage field to structured
    measure_type, prevalence_class and rate_per_100000 slots.

    Confirmed that no GeneReviews chapter exists for hereditary angioedema, searched
    by disease name, by SERPING1 and by C1 inhibitor deficiency, and recorded that
    absence in notes. Deliberately did NOT assert conforms_to against the
    antisense_oligonucleotide_therapy module: prekallikrein transcript abundance is
    not abnormal in HAE, so that conformance would misstate the mechanism. Rationale
    recorded in notes.

    Validation: linkml-validate clean. linkml-term-validator clean, including all
    newly added GO, NCIT and CL terms. Causal graph clean under validate-graphs.
    Compliance rose from 83.7 to 89.4 percent, with downstream causal-edge evidence
    coverage going from 3 of 22 to 36 of 36.

    Reference validation is clean. Note for future curators: linkml-reference-validator
    prints Total checks 0 on a passing file, which reads as though nothing was checked.
    It is a mislabeled counter reporting issues found, not checks performed, as
    documented in issue 7252. The validator does work, confirmed here by injecting a
    fabricated snippet, which it caught with an exact location and an ERROR. An earlier
    revision of this record claimed the validator verified nothing; that was a
    misdiagnosis and is retracted.

    As a belt-and-braces check, all 155 evidence snippets and 34 reference
    supporting_text values were additionally verified programmatically as
    whitespace-normalized substrings of their cached sources, 155/155 and 34/34
    passing. One trailing period was normalized away in a PMID:19477491 snippet and
    corrected for exactness; the validator tolerates trailing punctuation, so this was
    a cosmetic fix rather than a caught fabrication.

    Separately, both project virtualenvs were repaired from Python 3.14 to 3.12 because
    pyhornedowl and therefore OAK could not import under 3.14, which had been blocking
    all term validation repo-wide. pyproject requires-python is >=3.12,<4.0, which
    permits the broken 3.14 selection.

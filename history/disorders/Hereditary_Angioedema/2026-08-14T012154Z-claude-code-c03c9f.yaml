  summary: Evidence the danazol treatment from an in-cache source and retract a false
    non-quotability claim
  details: |
    Re-review of PR #7264 found that the danazol treatment notes asserted its guideline/trial standing was 'not snippet-quotable from this entry's cached sources'. That was false: references_cache/PMID_20818888.md is committed, already cited in this entry, and carries a prophylaxis-specific attenuated-androgen sentence verbatim. Added it as a SUPPORT item (tagged OTHER - it is background framing in the introduction to an icatibant trial report, summarizing prior evidence rather than reporting that trial's own data) and rewrote the notes to drop the non-quotability claim. This matters because danazol's only prior evidence was PMID:19477491 at PARTIAL - two women in an FXII (normal-C1-INH) cohort - while its target_mechanisms edge points at the SERPING1 C1-INH deficiency node, i.e. the sole support came from the wrong subtype for the mechanism claimed. Also addressed three non-blocking suggestions: added edge-level evidence to the berotralstat target_mechanisms link reusing the APeX-2 snippet that names plasma kallikrein as the target; hedged the danazol edge description, which had stated flatly that attenuated androgens 'raise circulating C1-INH' when that mechanism is not fully settled; and replaced the tranexamic acid non-quotability note with the sourced limitation from PMID:20818888 that its efficacy has not been proved in controlled studies. The tranexamic acid statement is cited as prose rather than attached as an evidence item because it concerns acute attacks while the entry curates long-term prophylaxis, and attaching it would hang acute-attack data on a prophylaxis claim. Deliberately did NOT add edge evidence for the danazol or tranexamic acid mechanism links: the available in-cache quotes evidence the therapeutic effect, not the proposed mechanism each edge asserts. Verified: just validate-disorders (CI-equivalent, --no-full-text) passes; snippets 157/157 to 159/159 verified; check_folded_hyphens exits 0; no new snippet-length or title-snippet findings attributable to this entry; working tree checked for the in-place references_cache upgrade that a full-text validation run can cause, and nothing was rewritten.

  summary: 'Create: Hypotrichosis 2 (CDSN hypotrichosis simplex of the scalp)'
  details: |
    New entry for MONDO:0007805, claimed in issue 15587. Curated as a separate Disease rather than a subtype of Peeling_Skin_Syndrome, because that entry describes dominant hypotrichosis simplex of the scalp as a distinct phenotype of monoallelic CDSN variants. The pathograph runs from the heterozygous CDSN exon 2 stop variant, through truncated corneodesmosin amyloid aggregation and keratinocyte toxicity of the oligomers, to progressive hair follicle failure. The final step is recorded as INDIRECT_UNKNOWN_INTERMEDIATES and is tracked as a knowledge gap. Evidence comes from 8 PubMed records, all cached. Schema, term and reference validation passed; 29/29 snippets verified.

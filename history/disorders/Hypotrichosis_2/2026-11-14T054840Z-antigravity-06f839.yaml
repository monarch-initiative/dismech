  summary: Review and enrich Hypotrichosis_2
  details: |-
    Reviewed and enriched Hypotrichosis_2 (MONDO:0007805). Added MONDO and clinical synonyms (hypotrichosis caused by mutation in CDSN, Hypotrichosis simplex of the scalp). Grounded classifications.harrisons_chapter (DERMATOLOGY, GENETICS_ENVIRONMENT_DISEASE) with PMID:31663161 and PMID:16307662 evidence. Enriched pathophysiology nodes with cell_types (CL:0002560 hair follicular keratinocyte, CL:0000312 keratinocyte), UBERON anatomical locations (UBERON:0002073 hair follicle, UBERON:0001003 skin epidermis, UBERON:0000403 scalp), GO:0050839 cell adhesion molecule binding on CDSN Exon 2 Truncating Variant, and GO:0008219 cell death on Keratinocyte Toxicity of Corneodesmosin Oligomers. Added PROGRESSIVE clinical_course and YOUNG_ADULT onset on Near-Complete Scalp Baldness in Young Adulthood, added Scalp Skin Biopsy with Amyloid Dye Staining (NCIT:C51692) to diagnosis, and wired target_mechanisms on Topical Minoxidil with Oral Botanical Extracts.

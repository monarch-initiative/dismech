  summary: 'Genetics pass: FPLD8/FPLD9 subtypes, NOTCH3 and PLAAT3, six new mechanism
    nodes'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12196, epic #12189). This
    was the heaviest of the five entries.

    Research first. The entry's existing note that no GeneReviews chapter exists
    for familial partial lipodystrophy was rechecked offline against the committed
    Bookshelf index (cache/bookshelf/genereviews.csv, snapshot 2026-09-10, 958
    chapters) and holds; the note now names that source. ClinGen's committed
    gene-disease validity table was read for every gene in the entry, and eight
    CGGV assertion caches were generated with just clingen-rebuild and committed.

    Wiring. Every gene-defined has_subtypes row now carries a genes list, and every
    genetic record now carries a subtype foreign key except the two that
    deliberately have none. Six new pathophysiology nodes were added so each gene
    reaches the pathograph at the step it acts at rather than as a flat list:
    "Loss of PPARgamma-driven adipogenic transcription" (PPARG), "PLAAT3 loss and
    phospholipid remodeling of white adipose tissue" (PLAAT3, feeding the PPARgamma
    node), "Adipocyte lipid-droplet formation defect" (CIDEC, PLIN1),
    "Dysregulated adipocyte triglyceride lipolysis" (PLIN1, LIPE, ADRA2A),
    "Impaired adipose insulin and PI3K-AKT signaling" (AKT2), and "NOTCH3 gain of
    function and adipose senescence" (NOTCH3). The lipolysis node is tagged
    ABNORMAL rather than INCREASED because its three genes push in opposite
    directions, which the description spells out per gene.

    Two MONDO leaf classes were missing and are now curated as subtype rows.
    MONDO:0958022 (familial partial lipodystrophy type 8) was bound to the existing
    ADRA2A row, and MONDO:0958034 (type 9, PLAAT3) was added new with its gene, a
    description and cited evidence. Both were confirmed to be direct children of
    this entry's disease term MONDO:0020088 via the OLS MONDO parents endpoint, and
    their gene assignments traced through their OMIM cross-references (620679 and
    620683) in NCBI's mim2gene_medgen table. FPLD9 is syndromic - fat loss with
    variable demyelinating neuropathy and intellectual disability - and the row says
    so rather than presenting it as an isolated partial lipodystrophy.

    NOTCH3 (disagreement with MONDO, recorded not acted on). MONDO records NOTCH3
    as the causal gene of MONDO:0012072, familial partial lipodystrophy Koebberling
    type. That traces to OMIM: MONDO:0012072 cross-references OMIM:608600, and
    mim2gene_medgen maps that phenotype MIM to NOTCH3 through OMIM's GeneMap. The
    primary report (PMID:39652711) describes its gain-of-function NOTCH3 variants
    as causing "a novel subtype of FPL" and never calls the families Koebberling,
    and MONDO's own text definition of the class still reads "of unknown etiology".
    NOTCH3 is therefore curated as a genetic record and a pathophysiology node with
    relationship_type UNKNOWN, while the FPLD1 row keeps its clinical definition and
    carries a review_notes recording the whole chain. The paper also carries an
    erratum (PMID:41147879) whose content could not be retrieved from PubMed or
    Crossref, so what it corrects is unknown and no cache for it is committed.

    MFN2 (disposition). ClinGen curates MFN2 against autosomal recessive multiple
    symmetric lipomatosis with partial lipodystrophy (MONDO:1060153, OMIM 151800) at
    Definitive, in which every reported patient carries at least one p.Arg707Trp
    allele, not against a familial partial lipodystrophy term. MFN2 is kept in the
    genetic list, because MFN2 carriers appear in genetically screened FPLD cohorts
    and a curator reading such a result needs to find the disposition, but with no
    subtype and no relationship_type, and a note flagging it as a candidate for a
    separate dismech entry. It is the single gene the connectivity metric reports as
    unwired on this entry, which is the intended outcome.

    CAV1 has a subtype row, a gene binding, a MONDO term and ClinGen evidence but
    no pathophysiology node: ClinGen's Limited curation for the autosomal dominant
    CAV1 partial-lipodystrophy relationship records that no experimental data are
    available, so there was no mechanism to cite and none was invented. The note
    says this, and points at the CGL3 subtype of
    kb/disorders/Berardinelli_Seip_Congenital_Lipodystrophy.yaml where the
    Definitive CAV1 relationship is curated.

    The CAV1 row's subtype_term was nearly missed and the reason is recorded on
    the row. A first draft asserted that MONDO had no class for CAV1-related
    partial lipodystrophy, on the strength of a label search. That was wrong:
    MONDO:0011714 is the class for OMIM:606721 and carries "lipodystrophy,
    familial partial, type 7" as an exact synonym, but its primary label names
    the fuller syndrome (partial lipodystrophy, congenital cataracts, and
    neurodegeneration), so only a synonym-inclusive search finds it. Re-running
    the search before committing the note is what caught it. MONDO places that
    class under hereditary disease rather than under MONDO:0020088, unlike the
    other numbered FPLD classes, so binding it here is a curation judgement.

    AKT2, CAV1 and ADRA2A carry relationship_type UNKNOWN rather than CAUSATIVE
    because ClinGen rates the first two Limited and the third has no curation at
    all, and GeneDiseaseRelationshipEnum has no value between CAUSATIVE (defined as
    ClinGen Definitive or Strong) and DISPUTED. The reasoning is recorded on each
    record.

    Review round 1. Three prose over-reaches of my own were corrected in the same
    push, all in text I had written: the AKT2 node called AKT2 "the adipose- and
    muscle-predominant AKT isoform", which no cited source states, and now says
    what ClinGen records; the lipid-droplet node said CIDEC fuses nascent droplets
    into a single large droplet, a mechanism the cited abstract does not give, and
    now states what it does say; and the ADRA2A record said the ECLip consensus
    warns about "single-report" gene-disease claims, where the quoted sentence
    says proposed new genetic causes with variable supporting evidence.

    Two legacy prose figures in the entry's notes - a prevalence of roughly 1.7-2.8
    per million and a median diagnostic delay of about 10.5 years for FPLD2 - carry
    no citation anywhere in the entry, predate this pass, and were not re-derived.
    A line in the notes now flags them for sourcing or removal.

    Validation: just validate, validate-terms, count-verified-snippets (53/53),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-genereviews,
    list-gene-term-mismatches, compliance-connectivity, and the batched just

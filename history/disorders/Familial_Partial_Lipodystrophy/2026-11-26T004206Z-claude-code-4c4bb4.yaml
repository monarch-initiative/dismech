  summary: 'Gene-family review: LIPE, PLIN1, CIDEC'
  details: |
    Recorded ClinGen tiers for the three lipid-droplet genes, whose MONDO terms are this entry's FPLD4, FPLD5 and FPLD6 subtypes: LIPE Definitive (AR), PLIN1 Definitive (AD) and CIDEC Moderate (AR, classified 2026-07-19). Retyped CIDEC from CAUSATIVE to UNKNOWN, since Moderate is below the Definitive or Strong level CAUSATIVE requires, and replaced the note saying ClinGen had no CIDEC curation. Bound the LIPE and CIDEC inheritance items to HP:0000007 and added an autosomal dominant block to PLIN1. Added molecular functions to the two shared nodes, which had processes only: diacylglycerol lipase activity, decreased, for hormone-sensitive lipase on the lipolysis node (HSL is the rate-limiting adipocyte DG lipase, PMID:11717312), and lipid transfer activity, decreased, for CIDEC on the lipid-droplet node (Fsp27 transfers lipid between contacting droplets, PMID:22144693). PLIN1 gets no molecular function of its own: its FPLD4 effect is loss of ABHD5 sequestration, for which GO has no specific term. Also recorded the existing AKT2 Limited assertion structurally; that record was already UNKNOWN.

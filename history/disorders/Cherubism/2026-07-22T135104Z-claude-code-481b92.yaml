  details: |
    Created new Mendelian entry for cherubism (autosomal dominant SH3BP2 gain-of-function; rare autosomal recessive OGFRL1 form noted). Unbundled six-node pathophysiology cascade (SH3BP2 stabilization -> hyperactive SYK-ERK myeloid signaling -> macrophage TNF-alpha overproduction -> enhanced osteoclastogenesis -> excessive osteoclastic jaw bone resorption -> fibro-osseous giant-cell lesion). Deep research via just research-disorder claude_code. Evidence from GeneReviews (PMID:20301316), Ueki 2001 founding SH3BP2 paper (PMID:11381256), Ueki 2007 knock-in mouse (PMID:17218256, MODEL_ORGANISM), and a TNF/NFATc1 osteoclastogenesis mechanism paper (PMID:24916406). Added a HUMAN_MODEL_MISMATCH discussion (mouse systemic TNF-dependent inflammation vs jaw-restricted self-limiting human disease) and targeted therapies denosumab (PMID:39830148) and tacrolimus (PMID:25491283) with target_mechanisms joins. 28 evidence snippets all verified as exact substrings; schema/term/reference validation pass; compliance 90.1% weighted.

  summary: Add classification evidence, gallbladder anatomy and specific driver molecular functions, causal phenotype edges, ERBB2 genetic evidence, and treatment target_mechanisms and evidence for Gallbladder_Cancer.
  details: >-
    Added evidence blocks to classifications.icdo_morphology (PMID:38719336) and
    classifications.harrisons_chapter (PMID:38946839). Added gallbladder anatomical
    locations (UBERON:0002110) on Accumulation of Oncogenic Driver Alterations,
    Immunosuppressive Microenvironment and Immune Evasion, and Invasion and Metastasis,
    and added specific molecular_functions (GO:0003700 DNA-binding transcription factor
    activity DECREASED; GO:0004714 transmembrane receptor protein tyrosine kinase
    activity INCREASED; GO:0016303 1-phosphatidylinositol-3-kinase activity INCREASED) on
    Accumulation of Oncogenic Driver Alterations. Added downstream causal edges from
    Immunosuppressive Microenvironment and Immune Evasion to Invasion and Metastasis, and
    from Invasion and Metastasis to Jaundice, Palpable Abdominal Mass, Right Upper
    Quadrant / Abdominal Pain, and Weight Loss. Added literature evidence (PMID:34798839,
    PMID:41682001) to the ERBB2 genetic entry, and added target_mechanisms and evidence
    (PMID:38719336, PMID:34798839, PMID:39468006, PMID:38856639) to Radical
    Cholecystectomy, HER2 (ERBB2)-Targeted Therapy, and Systemic Chemotherapy
    (Gemcitabine-Cisplatin backbone) along with therapeutic_modality SMALL_MOLECULE on
    the chemotherapy entry.

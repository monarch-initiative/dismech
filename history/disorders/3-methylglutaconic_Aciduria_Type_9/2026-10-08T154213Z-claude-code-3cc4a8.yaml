  summary: 'Create: 3-methylglutaconic_Aciduria_Type_9'
  details: |
    New entry for 3-methylglutaconic aciduria type 9 (MONDO:0044724), the TIMM50-related autosomal recessive mitochondrial encephalopathy. Curated as a standalone Disease: MONDO lists it as a leaf under 3-methylglutaconic aciduria, it has its own gene and OMIM number (617698), and no existing KB entry covers TIMM50.

    The entry was first curated directly from PubMed; a falcon deep-research report (research/3-methylglutaconic_Aciduria_Type_9-deep-research-falcon.md) was then generated and reconciled. Its eight references all resolved and are the same papers already cited here (plus the vigabatrin letter); its two term-label mismatches are template placeholders ('if available', 'verify'), not wrong bindings. The report adds details that could not be anchored to a cached abstract and were therefore not added: the vigabatrin dose and seizure freedom (the Mir 2020 letter has no cached text), and digoxin-responsive dilated cardiomyopathy and 17-year follow-up with dystonia and wheelchair dependence (Tort 2019 full text, cache is abstract-only). just preflight-dr could not run because the local MONDO build is absent and was not downloaded (disk space); a manual check found the report is about TIMM50/MGCA9 throughout (TIMM50 named 42 times, no competing causal gene). Sources: the gene-discovery report (PMID:27573165, two Bedouin/Arab families with homozygous p.Arg217Trp and p.Thr252Met), the Italian compound-heterozygous family with fibroblast import and bioenergetic studies (PMID:30190335), the Spanish compound-heterozygous patient with cristae and OXPHOS assembly defects and CRISPR rescue (PMID:31058414), the Australian homozygous patient with TIM23-SORT proteomics (PMID:38828998), the eLife study of patient fibroblasts and TIMM50-knockdown mouse neurons (PMID:39680434; preferred over its bioRxiv preprint PMID:38826427), and an Iranian homozygous family (PMID:35019165). PMID:32369862 (vigabatrin case) is a letter with no abstract or full text in the cache, so it is mentioned in the treatment description only and not cited as evidence.

    Pathophysiology is a chain: reduced TIMM50/TIM23 core protein -> impaired TIM23-dependent import -> combined OXPHOS deficiency and abnormal cristae -> neuronal bioenergetic failure -> developmental delay and intellectual disability; a separate neuronal hyperexcitability node (mouse neurons, reduced KCNJ10/KCNA2) links to the epilepsy phenotypes. Edges into developmental and seizure phenotypes rest on author proposals from a mouse neuron model and are marked INDIRECT. The import-to-3-MGA edge is marked indirect because the biochemical route is not established. One patient (PMID:38828998) lacked 3-MGA; this is recorded as a REFUTE item on the 3-MGA phenotype.

    No GeneReviews chapter (just check-genereviews), no ClinGen CGGV record and no cached Orphanet record were found. Validation: just validate, validate-terms, count-verified-snippets (48/48), the offline gates, and validate-disorders.

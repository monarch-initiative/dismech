  summary: 'LOINC tranche G: new diagnosis section with audiometry and WHO hearing
    grades'
  details: |
    The entry had no diagnosis: section. Added a Pure-Tone Audiometry row (NCIT:C38036 Audiometric Test) with the pure-tone threshold audiometry panel (LOINC:89015-2) and eight per-ear frequency codes as measurements, plus both the Global Burden of Disease and earlier WHO (1991) better-ear-average hearing-loss grade bands (PMID:31656340), the same convention used on Autosomal_Dominant_Nonsyndromic_Hearing_Loss_2A and other hearing-loss entries in earlier LOINC tranche G batches. Grounded the GBD band's top, open-ended tier with GeneReviews' (PMID:20301703) own statement that WS1 hearing loss, present in about 60% of affected individuals, is most commonly bilateral and profound at >100 dB. Part of LOINC tranche G batch 9 (projects/LOINC_DIAGNOSTICS.md).

  summary: Add ATP1A3 cardiac conduction phenotype, mechanism node, and ECG surveillance
    treatment
  details: |
    Added the cardiac arm of ATP1A3-related-syndrome cardiac involvement (issue #7648, follow-up from PR #7454 CAPOS review by @Phillip-a-richmond). (1) A new 'Cardiac conduction abnormality' phenotype (HP:0003115 Abnormal EKG, frequency FREQUENT) evidenced by PMID:32913013's multicenter cohort (52/87 = 60% resting ECG abnormalities in AHC; normal echocardiography; ~3% requiring cardiac intervention). (2) A new TISSUE-scale pathophysiology node 'ATP1A3-Dependent Cardiac Conduction Dysfunction' downstream of the existing ATP1A3 pump-dysfunction node, carrying both the human ECG cohort evidence (HUMAN_CLINICAL) and the Atp1a3 knock-in mouse seizure-to-conduction-failure/sudden-death evidence (MODEL_ORGANISM) as separate evidence items. (3) A new 'Cardiac conduction surveillance' treatment (action_category MONITORING, treatment_term NCIT:C38053 Electrocardiography -- verified distinct from NCIT:C38054 Electroencephalography) evidenced by GeneReviews PMID:20301294 and PMID:32913013. Deliberately deferred per the issue's scoped ask: did NOT add conforms_to cardiac_ion_channel_repolarization (would auto-nominate AHC into the Inherited_Arrhythmia_Syndromes grouping via stem-only module matching -- a human call not made here), and did NOT touch CAPOS_Syndrome.yaml's second-pass frequency-banding work, which remains a follow-up. All snippets copied byte-for-byte from references_cache/PMID_32913013.md and references_cache/PMID_20301294.md (both pre-existing abstract_only caches). Validated with just validate, just validate-terms, just validate-references (48/48 snippets verified), and pytest tests/test_data.py -k Alternating (9 passed).

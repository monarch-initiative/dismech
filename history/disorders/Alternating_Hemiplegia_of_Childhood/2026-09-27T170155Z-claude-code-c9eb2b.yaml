  details: |
    Genetics-gap issue 12275. Two rows were attributed to this entry. MONDO:0007087 alternating hemiplegia of childhood 1 asserts ATP1A2 (hgnc:800); a new genetic record types it DISPUTED, citing the ATP1A3 discovery paper PMID:22842232 twice with supports REFUTE and quote_role BACKGROUND for the statements that the ATP1A2 assignment rests on one atypical familial case and that no sporadic AHC case had been attributed to ATP1A2, against PMID:35945798, a 2022 narrative review that still names ATP1A2 among the genes responsible, as the supporting side. Both MONDO:0007087 and its sibling MONDO:0013900 (ATP1A3) are recorded as skos:narrowMatch. MONDO:0010264 X-linked adrenal hypoplasia congenita is declined: it is asserted as a third child of MONDO:0016241 while its own definition describes an NR0B1 adrenal and endocrine phenotype, and HGNC records AHC as a previous symbol of NR0B1, so the extra parent is most likely an acronym collision. The finding is recorded in notes and flagged for a curator rather than filed upstream. No references fetched. Gene wiring 1/1 and phenotype inlink 9/9, both unchanged, since a DISPUTED gene is excluded from the wiring denominator by design. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

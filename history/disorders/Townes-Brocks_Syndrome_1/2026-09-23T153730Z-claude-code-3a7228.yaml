    Reference caches: of nine uncited cache files, all were written when the deep-research report's own citations were resolved. Seven were removed from the PR (PMID_15172686, PMID_26511275, PMID_38386912, PMID_41499068, and three DOI files that duplicate PMIDs the entry cites under their PMID). Two were kept: PMID_14627694 and PMID_9072124, which the report cites by PMID for claims that were deliberately not curated; their caches show no abstract, which is the stated reason those claims were left out.


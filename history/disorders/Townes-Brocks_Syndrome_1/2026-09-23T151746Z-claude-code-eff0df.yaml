  summary: 'Create: Townes-Brocks_Syndrome_1'
  details: |
    New Disease entry for SALL1-related Townes-Brocks syndrome 1 (MONDO:0054581), curated from the claim in issue 12584.

    Lump/split: curated as its own Disease entry rather than as the parent Townes-Brocks syndrome (MONDO:0007142) or a has_subtypes row on it. The parent's other child, TBS2 (DACT1, MONDO:0054582), has a different causal gene and pathway, so a lumped entry would carry two unrelated trigger chains. GeneReviews (PMID:20301618) is SALL1-scoped and ClinGen curates SALL1 against MONDO:0054581. TBS2 is listed as a differential.

    Deep research: exactly one report. falcon was requested and returned HTTP 402 (out of credits). A first attempt with the generic fallback started openscientist, but its parent recipe was terminated by SIGTERM before any report was written, and the orphaned client process was then stopped. Per the updated run brief, the report was then produced with the claude_code fallback: research/Townes-Brocks_Syndrome_1-deep-research-claude_code.md (fell_back: true, requested_provider: falcon). Reference validation: 19/19 resolved, 0 off topic. Term validation needs_review: true (HP:0002251 given for imperforate anus is Aganglionic megacolon; UBERON:0004907 and UBERON:0002544 mislabelled; GO:0005720 obsolete); none of the report's CURIEs were copied into the entry. just preflight-dr: PASS (SALL1 mentioned 59 times, OMIM 107480 matches). Report claims not carried into the entry because the cited source had no abstract in the cache: the ~50% congenital heart disease rate in p.Arg276Ter carriers (PMID:14627694, no abstract), germline mosaicism in 4 families (no citation), end-stage renal failure presentation (PMID:9072124, no abstract).

    Structured sources: ClinGen CGGV assertion 5883adb4 (Definitive, AD; mechanism recorded as haploinsufficiency or dominant-negative) cached from the current ClinGen CSV via the structured-source CLI with --cache-dir in the worktree; the pinned MANIFEST was not repinned. ORPHA:857 built from a scratchpad copy of the current Orphadata XML; it is the parent-concept record (SALL1 and DACT1), so its phenotype rows are cited for presence only.

    Most evidence was found by direct PubMed search and read from the cached abstracts or full text. Frequency bands come from GeneReviews and the 207-patient literature review in PMID:40348827. The dominant-negative versus haploinsufficiency question is modelled as two trigger chains, both PROVISIONAL, with a HUMAN_MODEL_MISMATCH discussion. The primary-cilium mechanism (PMID:29395072, PMID:32553112) is an EMERGING hypothesis group.

    Validation: just validate, just count-verified-snippets (140/140), just validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-reference-titles, list-gene-term-mismatches (0 findings), check-genereviews --online (TAGGED PMID:20301618) all passed; just validate-disorders run before push.

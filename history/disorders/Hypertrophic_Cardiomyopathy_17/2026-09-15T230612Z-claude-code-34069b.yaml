  summary: 'Review round 1: add ECG diagnosis entry, narrow cascade-screening treatment'
  details: |
    Addresses the two blocking items in the ai4c-reviewer CHANGES_REQUESTED review on PR #11283, plus the two non-blocking suggestions, in a single push.

    Blocking 1 -- ECG was missing from the new diagnosis section. Added a third diagnosis entry, 'Electrocardiography and Ambulatory Rhythm Monitoring', bound to NCIT:C38053 (Electrocardiography), which is already in cache/ncit/terms.csv and in the treatmentactionterm enum cache, so no new term work was needed. Cited to PMID:30235249 twice: the methods sentence recording that resting 12-lead ECG was part of the standard assessment of the Finnish families, and the short conduction-abnormality form already verified elsewhere in the file. ECG is the test that detects the third-degree AV block distinguishing the JPH2 presentation from classic sarcomeric HCM, so omitting it left a gap in the section this PR exists to create.

    Blocking 2 -- genetic testing sat in both diagnosis and treatments with the same NCIT:C15709 term, the same PMID:30681346 and the same snippet. Narrowed the treatment entry to 'Cascade Screening and Cardiac Surveillance of At-Risk Relatives', rebound to NCIT:C168126 (Cardiac Disease Screening; cached and enum-resident), and replaced its evidence with two PMID:30235249 items that support the cascade-screening claim specifically -- cosegregation across six founder families (why a relative's genotype is actionable) and the 71%/100% age-dependent penetrance figures (why a genotype-positive relative stays under surveillance). Proband diagnostic sequencing now lives only under diagnosis, and NCIT:C15709 appears exactly once in the file.

    Suggestion 1 -- softened the echocardiography description, which asserted 'first-line imaging' and a prescriptive 'should prompt ECG and JPH2 sequencing alongside the core HCM gene panel' that its snippet does not carry. It now states what the cited series actually did.

    Suggestion 2 -- regraded PMID:30681346 from HUMAN_CLINICAL to OTHER on the 'misclassification can lead to genetic misdiagnosis' snippet: that paper is a ClinGen expert-panel gene-disease validity curation, not a patient study. Deliberately left the separate 'only 8 (24%) were categorized as definitive' snippet from the same paper at HUMAN_CLINICAL, because it is used in eight files across the HCM series and regrading it here alone would create a cross-file divergence in check-snippet-grading. That consistency sweep belongs in its own PR.

    Validation on the branch: just validate (schema + terms + references, 44/44 snippets verified), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values all pass. Whole-KB check-snippet-grading reports two findings, both in unrelated files (MPI-Congenital_Disorder_of_Glycosylation, Wilsons_Disease) and both pre-existing on the base.

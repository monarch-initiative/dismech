  summary: 'Create: Hypertrophic Cardiomyopathy 17 (JPH2)'
  details: |
    New Disease entry for MONDO:0013474 (hypertrophic cardiomyopathy 17), the JPH2-attributed member of the numbered familial HCM series. Follows Hypertrophic_Cardiomyopathy_20.yaml (NEXN) as the precedent for a standalone numbered-HCM entry whose gene-disease relationship is not Definitive.

    Gene-disease validity, which claim issue #10799 specifically asked to check rather than assume: ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel grades JPH2 for autosomal dominant HCM as Moderate (SOP9, 2022-10-12). Cited directly from the structured ClinGen source as CGGV:assertion_378a727d-0c5b-4563-9c96-ac18a2902742-2022-10-12T160000.000Z, quoting the validity row, and corroborated with the ClinGen HCM gene-validity paper (PMID:30681346), which places JPH2 in the moderate tier alongside CSRP3 and TNNC1 against eight definitive sarcomeric genes. This is a stronger relationship than NEXN's Limited, and the entry says Moderate rather than implying either Definitive or disputed.

    Also recorded: the ClinGen cache carries two further JPH2 assertions for dilated cardiomyopathy - Strong for autosomal recessive, Limited for autosomal dominant. Noted in genetic notes and the description because it means allele and inheritance pattern both matter to interpretation; JPH2 is not simply an HCM gene.

    Deep research: 'just research-disorder claude_code Hypertrophic_Cardiomyopathy_17' (report and citations sidecar committed). The run emitted no reference_validation or term_validation frontmatter, so both were retro-fitted with 'just validate-research-reference' and 'just validate-research-terms' per the skill. Results: 9/9 references resolved, no confabulation; 23/24 terms resolved, one mislabelled (HP:0004758, reported as 'Paroxysmal atrial fibrillation', actually 'Effort-induced polymorphic ventricular tachycardia') - not bound in this entry. Note the report also lacks a template_sha, so which prompt version produced it is inferred rather than stamped.

    Mechanism is curated as a chain and deliberately framed as non-sarcomeric: Junctophilin-2 Structural Deficit -> Dyad Disruption and Uncoupling of the L-Type Channel from the Ryanodine Receptor -> Disordered Intracellular Calcium Handling -> Prohypertrophic Cardiomyocyte Remodeling -> Left ventricular hypertrophy, with a second branch to Arrhythmia typed INDIRECT_UNKNOWN_INTERMEDIATES because the arrhythmia link rests on knockout-mouse calcium data and the human intervening steps are not established.

    The mechanistic hypothesis (dyad_architecture_not_sarcomere, CANONICAL) states explicitly what the chain still lacks: no direct demonstration of dyad ultrastructural disruption in myocardium from a genotyped human CMH17 patient. The human step currently rests on reduced JPH2 protein in HCM tissue (PMID:21216834) rather than on imaging the junction.

    Added a has_subtypes entry for the Finnish p.(Thr161Lys) founder allele, which its authors describe as causing atypical HCM - prominent conduction disease including third-degree AV block, and progression to systolic failure with non-dilated geometry. Penetrance 71% by age 60 and 100% by age 80, recorded in inheritance and used in the genetic-counseling treatment.

    Prevalence is recorded as measure_type UNKNOWN with an explicit note that 3/388 is a yield within an HCM cohort, not a population prevalence.

    A top-level note records that general HCM management is not curated here as JPH2-specific, and that no JPH2-specific device evidence was found despite the reported conduction disease, so none is asserted.

    Validation: 'just validate' passed with 26/26 snippets verified (including the ClinGen row); 'just validate-terms' passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean. Five references fetched and committed; PMID:30681346, PMID:34526680 and the CGGV assertion were already cached on main and are cited unmodified. Incidental references fetched by the validator but not cited were removed from the diff. Two drafting errors were caught and fixed: an unquoted colon inside an explanation broke YAML parsing, and 'anatomical_entities' is not a Pathophysiology slot (the slot is 'locations').

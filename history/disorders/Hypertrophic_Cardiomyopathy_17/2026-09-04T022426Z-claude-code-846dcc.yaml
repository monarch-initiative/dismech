  summary: Address PR review on Hypertrophic Cardiomyopathy 17 (#10831)
  details: |
    Addressed all six findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #10831.

    Finding 1 (BLOCKING, just check-snippet-grading failed): the PMID:17509612 sentence 'Three novel HCM-susceptibility mutations: S101R, Y141H and S165F, which localize to key functional domains' was graded IN_VITRO on the pathophysiology node and HUMAN_CLINICAL in genetic. The reviewer offered two fixes and the better one was taken: rather than harmonising the grade, the pathophysiology item was re-quoted with an actual functional-characterisation sentence ('each human mutation caused (i) protein reorganization of junctophilin-2'), graded IN_VITRO, which is both a correct grade and a more apt quote for a node about structural deficit. The screening sentence remains only in genetic, where HUMAN_CLINICAL is right. Root cause: check-snippet-grading is an ungated whole-KB CI step listed in CLAUDE.md and was not run before this PR was opened; it was missing from the PR's validation table and is now included and clean.

    Finding 2: tagged PMID:20301725 in references: with tags: [GeneReviews]. Note the title is 'Nonsyndromic Hypertrophic Cardiomyopathy Overview.', not 'Hypertrophic Cardiomyopathy Overview.' - the reference validator caught the mismatch on first attempt.

    Finding 3: added reference_title 'JPH2 / hypertrophic cardiomyopathy (Moderate)' to the CGGV assertion evidence item, taken from the cache frontmatter.

    Finding 4: regraded PMID:25659516 from IN_VITRO to MODEL_ORGANISM. The reviewer is right - it is a review whose quoted claim about junctophilin deficiency preventing junctional membrane complex formation rests on knockout mouse data.

    Finding 5: the reviewer identified a genuine inaccuracy. The Arrhythmia edge was typed INDIRECT_UNKNOWN_INTERMEDIATES with a rationale stating the intervening steps are not established in human JPH2 disease. PMID:23973696 establishes them: reduced binding of E169K-JPH2 to RyR2 destabilizes the receptor, producing abnormal spontaneous SR calcium release events, in two HCM patients with juvenile-onset paroxysmal AF plus pseudoknock-in mouse models with an allele-specific control (A399S). The edge was retyped INDIRECT_KNOWN_INTERMEDIATES, the rationale rewritten to name the intermediate, and two evidence items added. The E169K allele is now also recorded in genetic notes.

    Finding 6: added an experimental_models: entry for the p.(Thr161Lys) patient-derived iPSC cardiomyocytes (PMID:37371654), experimental_model_type IPSC_DERIVED_MODEL, with two modeled_mechanisms links (Prohypertrophic Cardiomyocyte Remodeling and Disordered Intracellular Calcium Handling), each RECAPITULATES at MODERATE fidelity with readouts. The limitations field records the caveat that matters most for this specific disease: iPSC-derived cardiomyocytes have underdeveloped T-tubules, and the dyad is exactly the structure whose failure this disease is about, so fidelity is bounded by the very feature under study. The isogenic CRISPR-corrected control is noted as what makes the comparison attributable to the variant. This model corresponds to the has_subtypes entry already curated for the Finnish founder allele.

    Validation after changes: 'just validate' passes with 32/32 snippets verified (up from 26/26); 'just validate-terms' passes; 'just validate-disorders' passes; 'just check-snippet-grading' reports no findings for this file; check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values clean.

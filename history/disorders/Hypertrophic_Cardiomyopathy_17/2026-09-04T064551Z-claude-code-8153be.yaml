  summary: Carry the paper's own counter-argument on the shared-origin node; cite
    the ClinGen claims; declare model scale
  details: |
    Takes items 15, 16, 17 and 20 from the approving review round on PR #10831, which the reviewer classed as depth rather than defects and did not block on.

    Item 15 was taken anyway because it is the same defect class that was blocking on two sibling PRs in this batch: an entry's framing contradicting a paper it cites. The Disordered Intracellular Calcium Handling description asserted that one calcium disturbance drives both clinical arms, while Beavers et al conclude the opposite for E169K - they attribute its arrhythmogenicity to reduced JPH2-RyR2 binding and place HCM development in other cellular mechanisms still to be explored, having shown AF susceptibility in E169K mice with no structural cardiomyopathy at two months. Three quotes from that paper already sat beneath the framing. The description now states the shared origin as the canonical rather than settled reading and names the counter-position, and the refuting sentence is carried as a REFUTE evidence item on the node rather than left implicit.

    Items 16 and 17 cited claims that were asserted without a source. The 2024 ClinGen reappraisal (PMID:39132495) is added, showing JPH2 retained Moderate rather than being downgraded, so the grade cited here is current. The dilated cardiomyopathy gradings asserted in the notes now carry their two CGGV rows - Strong for the recessive mode, Limited for the dominant one.

    Item 20 declares model_scale: CELLULAR on both iPSC-cardiomyocyte modeled_mechanisms links. The link to Prohypertrophic Cardiomyocyte Remodeling (TISSUE) is therefore reported as a one-step upward extrapolation rather than UNDETERMINED; its limitations were already present and cover the immaturity and absent T-tubules that make the gap material. The link to Disordered Intracellular Calcium Handling (CELLULAR) has no scale gap.

    Item 19 was considered and declined. The reviewer suggested HP:0011711 as more precise than HP:0001678, but the cited sentence reads 'conduction abnormalities including third degree AV-block' and the node describes conduction disease up to that grade. Narrowing to complete AV block would discard the rest of the range and assert a severity the source does not, which is the over-specificity that was blocking on the sibling spermatogenic-failure PR. Item 18 (a diagnosis section) needs new sourced content and is left for a follow-up.

    Three reference_title values were initially written from memory rather than copied from cache frontmatter and failed validation; corrected against the cache. Validation: validate clean with 39/39 snippets verified, and check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-snippet-length, check-snippet-grading, check-title-snippets, check-folded-hyphens all OK.

  details: |
    Addresses items 13 and 14 of the third ai4c-reviewer round on PR #10831.

    Item 13 (blocking). The previous history record claimed E169K had been added to genetic notes; it had not. The allele is now recorded there, with the detail that makes it load-bearing for this entry's arrhythmia branch: E169K was found in 2 of 203 unrelated HCM probands (Beavers et al, PMID:23973696), both with juvenile-onset paroxysmal atrial fibrillation - an index case whose fibrillation began at 22 before significant atrial remodeling, and his father with supraventricular tachycardia. The A405S carrier from the same cohort had no atrial arrhythmia, as was true of every previously reported JPH2 HCM allele. Two evidence items were added carrying both halves of that contrast, so the arrhythmic phenotype reads as an E169K observation rather than a property of JPH2-associated HCM generally.

    Item 14 (folded into the same commit). The rationale on the Disordered Intracellular Calcium Handling to Arrhythmia edge named reduced JPH2-RyR2 binding as its intermediate. That step lies upstream of the source node, not between source and target, so the edge was typed INDIRECT_KNOWN_INTERMEDIATES on a step outside its own interval. The genuine intermediates are quotable from the same paper: cell-wide spontaneous calcium waves activate NCX, generate delayed afterdepolarizations, and produce the triggered activity. That sentence is now the first evidence item on the edge, the description names those steps, and the RyR2-binding item is retained but re-explained as upstream allele context - the reason the edge is engaged rather than a step within it.


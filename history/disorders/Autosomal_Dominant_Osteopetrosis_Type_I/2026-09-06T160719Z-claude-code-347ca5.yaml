  summary: 'Create: Autosomal Dominant Osteopetrosis Type I (MONDO:0011877)'
  details: |
    De novo curation of ADO1 / LRP5 high bone mass.

    Lump/split: curated as a DISEASE rather than a has_subtypes row on Osteopetrosis. ADO1 is mechanistically the inverse of the other osteopetroses (osteoblastic bone formation excess via LRP5 gain of function, not osteoclastic resorption failure), and the literature formally reclassified it out of the osteopetrosis group into the high-bone-mass diseases (PMID:20855225). Autosomal_Dominant_Osteopetrosis_Type_II and Autosomal_Recessive_Osteopetrosis already exist as separate entries, so a separate ADO1 entry matches the established shape. No kb entry carried hgnc:6697 for a bone phenotype before this one.

    Pathograph: LRP5 first-beta-propeller substitution -> constitutive canonical Wnt signalling in osteoblasts -> increased osteoblastic formation and (indirectly) reduced osteoclast number -> generalized osteosclerosis -> cranial foramina narrowing -> hearing loss, headache, anosmia. The osteoblast-to-osteoclast edge is recorded INDIRECT_KNOWN_INTERMEDIATES with directness: INDIRECT because the only source states it as an explicit speculation.

    Notable negative: 'Absence of increased fracture rate' is curated as a phenotype with frequency EXCLUDED. It is the discriminating feature against ADO2 and is a positive claim about this disease rather than missing data.

    Deep research: one openscientist report (research/Autosomal_Dominant_Osteopetrosis_Type_I-deep-research-openscientist.md), 30/30 references resolved, 13/13 quoted claims verified, 0 unresolved terms. preflight-dr PASS on identity (LRP5 x42, OMIM 607634 matches MONDO). Its 'rival gene HBM' warning is a false positive: HBM is the high-bone-mass abbreviation, not a rival gene.

    Two report leads changed the entry. It surfaced Lrp5 p.G171V and p.A214V knock-in mice (PMID:25808845), which falsified a claim in an earlier draft of notes that no ADO1 model existed; two animal_models with modeled_mechanisms were added and the note corrected. It also surfaced a 5.5/100,000 population prevalence (PMID:3829443) which the report presented as an ADO-I figure. That attribution was NOT followed: the 1986 Funen County survey predates both the type I/II split and the LRP5 discovery, so its dominant-osteopetrosis cohort is mostly what is now ADO2. The figure is recorded as an explicit upper bound with that caveat.

    Validation: just validate passes schema plus 46/46 snippets verified against cached references; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values all pass.

    Note for tooling: CLAUDE.md documents a Prevalence slot rate_denominator that does not exist in src/dismech/schema/dismech.yaml; using it as documented fails schema validation.

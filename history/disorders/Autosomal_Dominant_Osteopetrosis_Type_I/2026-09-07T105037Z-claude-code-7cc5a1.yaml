  summary: 'Review round 1: corrected a self-contradicting knowledge gap, added LRP6
    HBM differential'
  details: |
    Addressed both IMPORTANT items and both SUGGESTIONs from the automated review of PR 11242. The first finding was a real defect of my own making: the ado1_osteoclast_link_mechanism knowledge gap asserted that RANKL/OPG ratios were not measured in these patients and that no first-beta-propeller LRP5 knock-in mouse was identified, and both clauses are refuted by material in this same entry. PMID:16251418 reports a 40 percent nonsignificant increase in OPG in T253I patients and PMID:37659026 reports single-patient OPG and RANKL values, while the animal_models block I wrote lists Lrp5 p.G171V and p.A214V knock-ins from PMID:25808845. The rationale now states the gap that actually exists: OPG and RANKL have been measured individually but never as a ratio in a powered ADO1 cohort, and the knock-in mice were characterised for bone mass and sclerostin response rather than assayed for osteoblast-derived osteoclastogenic signalling. Added LRP6 high bone mass to differential_diagnoses with two exact quotes from the already-cached PMID:37659026 establishing that it is clinically identical to LRP5 HBM and that no feature distinguishes them, which is the strongest reason the entry's LRP5 sequencing diagnosis node exists. Ran the GeneReviews search the reviewer could not run: the GeneReviews book collection contains no chapter for LRP5 high bone mass or ADO1, the only osteopetrosis chapters being CLCN7-Related Osteopetrosis and TCIRG1-Related Osteopetrosis, and that search is now recorded in notes. Added four phenotypes from the same cached review: papilledema, increased intracranial pressure and Chiari malformation, all deliberately without frequency values because the source gives only a 19.4 percent aggregate for neurological involvement and not per-manifestation rates, plus elevated alkaline phosphatase at VERY_RARE with the 3.7 percent figure quoted, recorded because a normal ALP is the expected result and its absence does not argue against the diagnosis. One reference_title was written from memory during this round and was caught and replaced with the value derived from the cache frontmatter before commit. Validation: schema passes, 52/52 snippets verified (was 46/46), term validation passes, and the whole-KB gates were run.

  summary: Review LRP5 high bone mass using full-text clinical and mechanistic evidence
  details: |
    Substantive review of the entire LRP5 high-bone-mass entry, its CREATE/EDIT provenance, and genuine OpenScientist report plus citation artifact. Retains MONDO:0011877 and the modern/historical naming boundary. This inherited disorder is in scope for the queue excluding infectious and environmental diseases/poisonings; environmental modifiers of a Mendelian disorder do not exclude it.

    Full-text use: read methods, results, relevant tables/figures and limitations in cached PMID:37659026 (155-case historical review and A242T case), PMID:16251418 (T253I clinical stimulation and cell culture), PMID:25808845 (SOST/DKK1 challenge), PMID:24927689 (serum antagonists/RANKL/OPG), PMID:36971833 (new variant families and 113-case synthesis), PMID:42113468 (2026 global/conditional HBM and Wls experiments), and PMID:41431003 (surgical trigeminal-neuralgia case). Other primary abstracts, including PMID:29208525 and PMID:17052975, support only their available claims. Tried to refresh/recover full text for older primary genetics and receptor studies; publisher/PMC access did not yield usable full text. Generated all new caches through repository fetchers. Failed/CAPTCHA artifacts and uncited exploratory caches are excluded from the PR.

    Major corrections: remove the mixed historical osteopetrosis prevalence and carrier/asymptomatic estimates from structured LRP5-specific claims. The historical 155 cases include only 64 genetically tested patients, with separate denominators for facial changes, palatal tori and ALP. Add the in-frame insertion class and qualify the functionally untested cytoplasmic R1414S association. Replace constitutive, feedback-free activation with variant-dependent antagonist resistance and ligand-context dependence. Normal T3-stimulated formation is not evidence of elevated formation; cite direct dynamic mouse histomorphometry and identify older patient histology as background. Normal tested cultured osteoclast endpoints do not exclude all intrinsic defects, and proposed osteoblast-to-osteoclast mediation remains unresolved. The RANKL/OPG ratio was measured; local mediation, allele specificity and statistical power remain open questions. Separate cranial nerve passage narrowing from reduced intracranial space and do not assert exclusively late onset.

    Completeness assessment: phenotypes adequate after adding mandibular enlargement, facial palsy, trigeminal neuralgia and visual impairment with bounded literature fractions. Torus palatinus now has its specific HPO term; mandibular enlargement remains exact/unbound because nearby terms change the claim. Subtypes/differentials adequate: preserve LRP6/SOST/CLCN7 distinctions and the allelic low-bone-mass contrast, without treating each allele as a distinct subtype. Mechanisms adequate after qualifying feedback, trafficking, formation and resorption; incorporate human lamellar/mineralization observations and the 2026 Wls perturbation. Treatments adequate after adding hearing rehabilitation, mandibular reduction and reported decompression, distinguishing molecularly confirmed surgery from a genetically untested clinical case; no controlled disease-modifying efficacy is inferred. No disease-specific interventional trial emerged from the report/source review. Genetics adequate after variant-class and penetrance corrections. Biomarkers/diagnostics adequate with imaging, normal-marker limits and broader sequence-variant assessment. References adequate: primary caches used where available, synthesis graded separately, and assay/model endpoints retained. Overall, the research's central themes are consumed; speculative treatment transfer from resorption-defect osteopetrosis is not adopted. No LRP5-HBM-specific GeneReviews chapter was found; the CLCN7 and TCIRG1 chapters are explicitly differential sources.

    Model fidelity: 2015 challenge animals were homozygous knock-ins, not the usual heterozygous human genotype; some residual architectural and DKK1 responses remain. Cranial morbidity was unmeasured, not proved absent. Conditional Wls deletion did not rescue severe osteopenia and has resorption/localization confounders; avoid relying on conflicting CTx directions in the source text. Validation: schema, ontology bindings and all 100 cached quotations pass; entity/causal targets, snippet boundaries, source-defect claims, delivery, coarse bindings and knowledge gaps pass. Fifteen of 17 phenotype nodes and the sole causal gene are connected. The negative fracture-susceptibility entry and infrequent elevated ALP remain unconnected rather than inventing causal support. Text-ratchet checks and independent PR review are recorded in the PR.

    Independent review follow-up: bind mandibular size to the verified exact HPO term, structure surgery/rehabilitation and separate device-qualified cochlear implantation, add direct CTX/P1NP and inhibitor measurements with the family-versus-unrelated-control SFRP-4 distinction, and classify quoted human histomorphometry as HUMAN_CLINICAL plus BACKGROUND. Rename the skeletal-accrual mechanism to avoid case-only duplication with a phenotype; add reported spinal canal stenosis and qualified variable progression. Do not transfer the mixed historical 8–76-year range or infer a numeric prevalence threshold from publication counts.

    Final follow-up validation: 100/100 quotations verify. Restore a qualitative RARE class supported by the review wording without inferring an ULTRA_RARE prevalence threshold from the case count.

  details: |
    Response to the ai4c-reviewer REQUEST CHANGES review on PR #7783 (two IMPORTANT findings plus seven suggestions).

    IMPORTANT 1 - no treatment carried a treatment_term, and one entry bundled four interventions. The single "Supportive and symptomatic management" treatment was split into five atomic entries and every one now carries an NCIT treatment_term. Each ID was verified with OAK (label match) AND confirmed reachable from NCIT:C25218 by `runoak -i sqlite:obo:ncit ancestors -p i <ID> | grep C25218`: NCIT:C15747 Supportive Care (umbrella, therapeutic_modality OTHER); NCIT:C15986 Pharmacotherapy for anti-seizure treatment, with therapeutic_agent CHEBI:8069 phenobarbital and CHEBI:3387 carbamazepine, therapeutic_modality SMALL_MOLECULE, target_phenotypes HP:0001250 and HP:0032794; NCIT:C93322 Enteral Tube Feeding for nasogastric feeding (chosen over the reviewer-suggested NCIT:C15433 Nutritional Support because the quoted text names the route, and left without therapeutic_modality per the CLAUDE.md warning against auto-tagging nutritional support BEHAVIORAL); NCIT:C15192 Blood Transfusion; NCIT:C15240 Genetic Counseling with action_category COUNSELING_INFORMATIONAL and therefore no target_phenotypes. The deoxycytidine/deoxythymidine investigational entry gained NCIT:C15986 with CHEBI:15698 2'-deoxycytidine and CHEBI:17748 thymidine. Two new verbatim snippets were quoted from the already-cached PMID:34918187 full text to evidence the carbamazepine, transfusion and counselling entries; no new reference was fetched for any of them.

    IMPORTANT 2 - HP:0000505 Visual impairment retermed to HP:0100704 Cerebral visual impairment (label verified with OAK). No new evidence was needed; the two existing snippets (absent tracking, morphologically normal eyes) are exactly what the more specific term claims. The phenotype name was changed to match and no other section referenced the old name.

    Suggestions worked: causal_link_type explanation that read "curated as PROBABLE" (not an enum value) rewritten to name INDIRECT_UNKNOWN_INTERMEDIATES; the PMID:35346037 zebrafish-paper background sentence retagged HUMAN_CLINICAL -> OTHER; the normal-dTTP evidence on the flux node retagged REFUTE -> PARTIAL, because it refutes pool depletion while the node claims a flux block; a biochemical: section added with the fibroblast dTMPK numbers (0.62 vs 43.65 / 31.08 pmol/min/mg, plus the zebrafish control run tagged MODEL_ORGANISM) and the diagnostically load-bearing NORMAL metabolic screen; a histopathology: section added with four findings including the dentate-nucleus/brainstem sparing pattern; a clinical_trials: entry added for NCT04802707 (PHASE_II, no status asserted because the cached registry summary has no status field); and an autosomal-recessive-primary-microcephaly differential added (MONDO:0016660, verified with OAK).

    Declined, with reasons recorded in the entry notes rather than silently. No "multidisciplinary supportive/palliative care" treatment was created - literal case-insensitive searches for `supportiv`, `palliat`, `symptomatic`, `multidisciplinary`, `no cure`, `no specific`, `no effective`, `no disease-modif` across references_cache/PMID_34918187.md, PMID_40696808.md, PMID_31271740.md and PMID_34926941.md on 2026-08-01 returned zero hits, so there is no quotable basis for one. No finding_term bound on two histopathology entries: NCIT:C117277 Demyelination was audited and is NOT reachable from NCIT:C83490/C35867, and no NCIT Morphologic Finding term covers neuronal loss or a regional sparing pattern (NCIT:C50774 Tissue Degeneration and NCIT:C120874 Degeneration and Atrophy audited and rejected as too generic to carry the sparing claim). The research artefact's caveat that carbamazepine can exacerbate myoclonic seizures is recorded in the treatment notes explicitly as an UNSOURCED caveat, not curated as fact, because it appears in no cached reference. No frequency band added anywhere in the new sections.

    One new reference: PMID:35111754 (MCPH review), already present in references_cache for the Autosomal_Recessive_Primary_Microcephaly entry, cited only in the MCPH differential and only for statements about MCPH. Nothing was fetched. The entry's NEC guardrail note was amended because it previously asserted that every cited source names DTYMK in its title, which this addition makes false.


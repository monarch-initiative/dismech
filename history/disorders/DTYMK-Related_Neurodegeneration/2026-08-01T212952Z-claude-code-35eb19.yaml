  details: |
    Created kb/disorders/DTYMK-Related_Neurodegeneration.yaml for MONDO:0859241 (OMIM:619847, CONPM), causal gene DTYMK (hgnc:3061). Gene-disease anchor verified with OAK before curation (RO:0004003 HGNC:3061). Deep research via 'just research-disorder claude_code' (2026-08-01, 928s, 5 web searches, 61 turns, 21 citations); NEC gate passed with DTYMK at 102 word-boundary mentions vs next-highest TK2 at 5. All five differential/contrast MONDO terms verified with runoak rather than typed from memory (MONDO:0018866 AGS, MONDO:0014647 CAD/DEE50, MONDO:0011283 TYMP/MNGIE). Six references cited: PMID:34918187 (full text), PMID:31271740, PMID:40696808, PMID:35346037 (full text), PMID:34926941, PMID:38621447, plus the pre-existing clinicaltrials:NCT04802707 cache. Three errors in the pre-research draft were corrected from the report: dTTP was marked DECREASED when measured levels are normal (reframed as a block of flux); the mtDNA-depletion hypothesis was marked DEPRECATED before PMID:34926941 was read (corrected to ALTERNATIVE); and a false-absence claim that no source proposes nucleoside supplementation was removed after NCT04802707 was found to list DTYMK as an eligible genotype. Frequency bands asserted only for microcephaly and absent development (5/5) and for cerebral atrophy and seizures (3/3 of the imaged/reported subset), each with numerator and denominator stated in notes; all single-case features carry no band. Mortality is recorded under progression, not phenotypes, because HP:0003819 sits under Clinical modifier and is not a valid phenotype_term. No GeneReviews chapter exists (three literal PubMed searches, all zero). No ORPHA entity exists (two OLS4 ORDO searches, both numFound 0). Validated with just validate, validate-terms, validate-references (109/109 snippets), scripts/check_snippets_verbatim.py (109 verified, 0 failed), and check_folded_hyphens.py --check.

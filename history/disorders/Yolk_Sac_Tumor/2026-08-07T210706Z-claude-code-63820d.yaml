  summary: 'Independent audit fixes: Yolk Sac Tumor'
  details: |
    Independently audited the Yolk Sac Tumor record while preserving explicit
    pure-versus-mixed, anatomic-site, and age/developmental-context caveats.
    Added pediatric compressed PEB and JEB, postpubertal testicular IGCCCG/BEP,
    primary mediastinal poor-risk and residual-mass management, and
    component-directed treatment for somatically derived ovarian YST. Expanded
    the Klinefelter and mediastinal hematologic-risk evidence and represented
    associated GCT and blood cancer as parallel evolution from a shared
    precursor rather than settled YST-to-leukemia transformation.

    Added infant age-adjusted AFP interpretation; corrected SALL4 as commonly
    diffuse versus focal/variable AFP and glypican-3; scoped childhood copy-number data
    to its mixed childhood malignant-GCT cohort; corrected computational and
    in-vitro evidence types; changed unsupported RARE prevalence to UNKNOWN;
    expanded site-specific staging, surgery, differentials, BEP NCIT:C63488,
    dataset limitations, and trial-status handling; and removed duplicate text
    and evidence fragments. All new reference caches were generated with
    `just fetch-reference`.

    Restored granular site-scoped ovarian, abdominal, vaginal, and mediastinal
    phenotypes; connected the childhood, postpubertal, and somatic-lineage routes
    to the convergent differentiation program with appropriately uncertain
    edges; and retained the pediatric testicular YST PDX with MODEL_ORGANISM
    evidence alongside, but distinct from, clinical JEB evidence.

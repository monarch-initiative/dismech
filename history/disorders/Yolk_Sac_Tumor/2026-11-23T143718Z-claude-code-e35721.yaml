  summary: 'Yolk sac tumor: sacrococcygeal teratoma as a differential diagnosis'
  details: |
    Added a differential-diagnosis row for sacrococcygeal teratoma, bound to MONDO:0042727, at
    the end of the differential section. At the sacrococcygeal site the two tumors overlap: an
    overview article describes sacrococcygeal teratoma as an extragonadal germ cell tumor that
    develops in the fetal and neonatal periods and classes it as a type I germ cell tumor, in
    which only teratoma and yolk sac tumor arise at extragonadal sites (PMID:33906346, both
    quotes); an immunohistochemical series of 59 extragonadal yolk sac tumors had 27
    sacrococcygeal tumors among its 42 primaries (PMID:19574883); a meta-analysis gave a pooled
    estimate of 5% (95% CI 3-6%) for malignant recurrence after a mature sacrococcygeal
    teratoma, with 57 of 102 recurrences malignant, mostly yolk sac tumor, and its authors
    suggest that malignant components overlooked at the first pathological evaluation and
    progression of mature cells may play a role (PMID:33142194); and a single-institution series
    that classed teratomas with microscopic yolk sac tumor foci as mature associated those foci
    with recurrence and detected every malignant recurrence by a rising AFP (PMID:39016163).
    Three distinguishing features: age, since in a global retrospective cohort study of 3,407
    analyzed patients the risk of malignant transformation of the initial tumor rose with age,
    and its authors conclude that the risk of malignancy at initial resection rises with age to
    a plateau at 6 years (PMID:39248311, both quotes; the age item's explanation gives the
    study's definition of malignant transformation and says that the results give the age
    figures for the initial tumor and the conclusion reads them as malignancy at initial
    resection); AFP read against age in infants (PMID:6163129) and its slow fall after neonatal
    resection, which its authors say should not be confused with relapse (PMID:16621769, six
    infants, the measured mean and the conclusion); and how recurrences were detected, every
    malignant one through a rising AFP, though the abstract does not say whether AFP also rose
    in any child without a malignant recurrence (PMID:39016163). Items whose quoted sentence
    does not name yolk sac tumor bear on telling the two tumors apart only by inference and are
    graded INDIRECT for this row: the pooled 5%, the meta-analysis's suggested contributors, how
    recurrences were detected, both age quotes, the normal-infant AFP study, both quotes on AFP
    after resection and the overview article's fetal-and-neonatal sentence. The series of 59
    yolk sac tumors is graded DIRECT: it names yolk sac tumor and is cited only for its own
    make-up, which the description calls a description of that series rather than a frequency.
    The notes point to the Mature teratoma row for SALL4, say that a malignant recurrence can
    follow a teratoma resected as mature, with the meta-analysis's suggested contributors, and
    say that telling yolk sac tumor from a mature teratoma matters for prognosis: yolk sac tumor
    was among the histologies with a lower event-free survival than mature teratoma or
    gonadoblastoma (PMID:18302061, INDIRECT because sites are pooled, the abstract reports yolk
    sac tumor's event-free survival only within that list of histologies, and immature teratoma
    is in the same list). The entry's references list gains the five newly cited sources. Quotes
    the sacrococcygeal teratoma entry also carries keep its evidence_source and quote_role;
    directness is graded for this row's claim and differs from that entry for some. Quotes
    already in this entry keep their evidence_source. No new reference caches. Fifteen new
    evidence items. Validated with just validate-disorders, just count-verified-snippets, just
    check-snippet-grading and the other whole-repo gates CI runs, all passing.

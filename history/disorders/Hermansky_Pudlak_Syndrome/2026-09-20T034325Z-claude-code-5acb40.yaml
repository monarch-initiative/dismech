  summary: 'Review round 1 (PR #12317): swap the neutrophil GO binding to degranulation'
  details: |
    Review round 1 on PR #12317 (issue #12199). Approved with three optional
    suggestions; one taken here.

    Taken - suggestion 1. The "Leukocyte Granule Trafficking Failure" node bound
    GO:0030223 neutrophil differentiation, but both of the node's own evidence
    snippets are about granule protein mislocalization and lytic granule exocytosis,
    and the node description says the impairment is "of cytotoxic activity rather
    than of cell number alone". The only support for a differentiation claim, "AP-3
    is involved in neutrophil formation", sits on the downstream edge to Neutropenia
    rather than on the node. Swapped the binding to GO:0043312 neutrophil
    degranulation (label read from `runoak -i ols:go info GO:0043312`), which matches
    what the node's snippets assert; the differentiation claim stays on the edge
    where its evidence already is.

    Declined - suggestion 2, the "duplicated" CDH3 descriptor in
    Hypotrichosis_with_Juvenile_Macular_Dystrophy. The review's premise was that the
    HPS nodes in the same PR use node-level `genes:` only; they do not - all four HPS
    complex nodes carry both a node-level `genes:` list and a `genetic_context.genes`
    list, exactly as the hypotrichosis node does, so the two entries are consistent.
    The redundancy is load-bearing rather than cosmetic: dismech.graph reads the
    node-level `genes:` descriptor and does not read `genetic_context`, which is why
    Holoprosencephaly_9 scored 0/1 on genetic[].mechanism_outlink while already
    carrying `genetic_context.gene`. Dropping either slot loses something - the
    pathograph edge, or the variant-level detail.

    Declined - suggestion 3, the `association: Causative` slot added beside
    `relationship_type: CAUSATIVE` in Holoprosencephaly_9. The schema does not
    deprecate `association`; its own description of `relationship_type` says to use
    the enum "in addition to the free-text `association` slot". All six sibling
    entries in this tranche carry both, so removing it from this one would make it
    the odd entry out.

  summary: 'Genetics pass (wiring-010): wire the 11 HPS genes into the pathograph
    by protein complex'
  details: |
    Genetics pass for issue #12199 (epic #12189, d2g wiring-010).

    Research first. GeneReviews baseline PMID:20301464 was already cited and tagged.
    Re-read it plus the Huizing mutation update (PMID:31898847, fetched for this pass)
    and the BLOC-1 overview PMID:34685610 (also fetched).

    Finding: all 11 MONDO-recorded causal genes were already curated in `genetic:`,
    each with a `subtype:` foreign key. What was missing was pathograph reach - the
    metric `genetic[].mechanism_outlink` scored 0/11 because no pathophysiology node
    carried a `genes:` descriptor.

    Changes:
    - Added four complex-level trigger nodes upstream of "Defective Biogenesis of
      Lysosome-Related Organelles": BLOC-3 Complex Deficiency (HPS1, HPS4), AP-3
      Adaptor Complex Deficiency (AP3B1, AP3D1), BLOC-2 Complex Deficiency (HPS3,
      HPS5, HPS6) and BLOC-1 Complex Deficiency (DTNBP1, BLOC1S3, BLOC1S6, BLOC1S5).
      Each carries `genes:`, a GO `protein_complexes:` binding (GO:0031085,
      GO:0030123, GO:0031084, GO:0031083, all read from `runoak -i ols:go`), a
      `genetic_context` block, `subtypes:` foreign keys, and evidence quoting the
      complex-membership sentences of PMID:31898847 and PMID:34685610.
      This is the complex grouping the sources themselves argue for: PMID:31898847
      states that losing any single subunit destabilizes the whole complex.
    - Added "Leukocyte Granule Trafficking Failure", the AP-3-specific arm, with
      neutrophil / NK cell / cytotoxic T cell bindings and downstream edges to the
      Neutropenia and Immunodeficiency phenotypes, which previously had no inbound
      causal edge.
    - Added `genes:` to all 11 `has_subtypes` rows and `relationship_type: CAUSATIVE`
      to all 11 `genetic:` entries.

    Measured effect: genetic[].mechanism_outlink 0/11 -> 11/11;
    phenotypes[].causal_inlink 3/11 -> 5/11.

    References newly cited and cached: PMID:31898847, PMID:34685610.

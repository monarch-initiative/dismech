  summary: Map Hermansky-Pudlak syndrome to OMIMPS:203300
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS203300 contains HPS1 through HPS11 in the January 2026 OMIM snapshot, all eleven gene-defined forms already curated as subtypes of this Disease. Defective lysosome-related organelle biogenesis and the shared pigmentary and platelet phenotype support the syndrome-level alignment. The BLOC and AP-3 complex distinctions and variable pulmonary, immune, and gastrointestinal involvement remain internal; pulmonary fibrosis is not a necessary condition for every series member. MONDO:0019312 additionally organizes forms through phenotype-based intermediate classes, so direct-child counts are not a member count. The mapping aligns the HPS syndrome and does not include all albinism, bleeding disorders, or every additional MONDO descendant solely through hierarchy.
    Reworded a pre-existing prose sentence to use disrupts to avoid a codespell false positive. Evidence quotes are unchanged.

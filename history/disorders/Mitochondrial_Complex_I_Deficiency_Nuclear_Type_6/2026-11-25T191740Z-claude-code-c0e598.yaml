  summary: 'Gene-family review: NDUFS2'
  details: |
    The node Loss of the N2 Iron-Sulfur Cluster and Quinone Reduction carries only NDUFS2 but bound GO:0051539 4 iron, 4 sulfur cluster binding, with a preferred term conceding that cluster N2 is ligated by NDUFS7. That still assigned NDUFS7's ligand function to NDUFS2: N2 sits at the NDUFS2-NDUFS7 interface and is ligated by four NDUFS7 cysteines, while NDUFS2 residues such as the dimethylated R121 form its second coordination sphere (PMID:33640456). The cluster-binding term was removed; the node keeps NDUFS2's own activities, ubiquinone binding and NADH dehydrogenase (ubiquinone) activity, and its description now says that loss of N2 is recorded there rather than as an NDUFS2 activity. The entry notes said that current structural work places the N2 cluster in NDUFS2, contradicting the node; the sentence now places N2 at the interface, ligated by NDUFS7, and notes that NDUFS8 carries N6a and N6b. The genetic record (causative, germline) was checked and left unchanged.

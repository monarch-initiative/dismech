  summary: Address PR review on Mitochondrial Complex I Deficiency, Nuclear Type 6
  details: |
    Round of changes answering the ai4c-reviewer CHANGES_REQUESTED review on PR 9597.
    All six items addressed and both suggestions taken.

    The reviewer identified one root cause behind most of the findings and was
    right: references_cache/PMID_36462614.md is content_type full_text_xml and this
    entry consumed only its abstract. That is the exact failure the curation SOP
    warns about, and it cost four separate weaknesses.

    Item 1, the full text was mined. It contains NDUFS2-specific patient
    descriptions that now replace weaker proxies. Cardiomyopathy and Optic Atrophy
    are both supported by the homozygous R228Q siblings who had both and died within
    two years. Lactic Acidosis gains the compound heterozygote diagnosed with
    elevated plasma lactate within two hours of birth. Encephalopathy gains the
    R138Q/R333Q individual with Leigh syndrome, replacing a class-level attribution
    with a named NDUFS2 genotype. The progression section gains both fatal courses.

    Item 2, two passages mischaracterized that paper and both were wrong for the
    same reason. The assembly node claimed the study pooled variants across four
    subunits and said nothing NDUFS2-specific; it reports per-allele results, and
    those results split the NDUFS2 alleles into an assembly lesion (R228Q, loss of
    co-immunoprecipitation) and catalytic lesions (R138Q and Y141C, greatly
    diminished activity when assembled normally). That is now stated with the quote,
    and it materially improves the node: the two mechanistic arms of this entry turn
    out to be allele-dependent rather than competing accounts of one lesion. The
    knowledge gap claimed no study had measured amount and activity together; the
    R138Q/R333Q patient's fibroblasts had both measured (activity low, assembly
    about 50 percent). The gap is restated in the narrower form that survives: no
    study has measured both across the reported alleles under one protocol.

    Item 3, the Cardiomyopathy binding moved from HP:0001639 Hypertrophic
    cardiomyopathy to HP:0001638 Cardiomyopathy. The previous notes conceded no
    source specified the morphology, which meant the entry was asserting more than
    its evidence.

    Item 4, the PMID:15576045 NDUFS7 snippet was downgraded from SUPPORT to PARTIAL
    and demoted below the direct NDUFS2 evidence, with an explanation stating that
    it establishes neonatal cardiomyopathy within childhood complex I deficiency
    rather than in this gene.

    Item 5, four background/synthesis snippets from PMID:36462614 were regraded from
    HUMAN_CLINICAL to OTHER, keeping IN_VITRO for the bacterial experimental
    results. The paper reports E. coli modelling plus a literature synthesis and no
    primary human clinical data. The newly added patient-description snippets from
    the same paper are also graded OTHER for the same reason.

    Item 6, the GeneReviews tag is kept, and the decision is now stated explicitly in
    notes rather than left implicit: the tag records that PMID:26425749 is the
    correct GeneReviews source for this disease class, which is useful to the next
    curator; it does not claim a baseline was performed, and the reason one could
    not be is documented. Dropping the tag would lose the pointer without gaining
    accuracy.

    Suggestions. PMID:33465056 was cited in evidence but missing from the top-level
    references block and has been added. A minimal Supportive and Multidisciplinary
    Care treatment entry was added, which also gave a place to state plainly why
    idebenone and folic acid remain model readouts rather than treatments.

    One correction found while mining, not raised in the review. The entry asserted
    that the N2 iron-sulfur cluster is located in NDUFS2. PMID:33640456 does say
    that, but PMID:36462614 says the equivalent region contains no iron-sulfur
    clusters and assigns N2 to NDUFS7. N2 sits at the interface between the two
    subunits and the sources disagree about which to book it under. Rather than
    picking a side, the description, the node, and a new notes paragraph now state
    the interface position and both assignments, and record that neither mechanistic
    claim this entry makes depends on the choice: both sources agree NDUFS2 forms
    part of the ubiquinone-binding site, and the structural study shows directly
    that an NDUFS2 residue controls whether N2 forms. The competing sentence is
    curated as PARTIAL evidence on the node it bears on.


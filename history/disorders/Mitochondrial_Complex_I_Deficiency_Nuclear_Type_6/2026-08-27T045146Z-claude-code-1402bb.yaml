  summary: Curate the feeding-difficulty and respiratory-arrest phenotypes from an
    already-verified quote
  details: |
    Single blocking item from the review on PR 9597.

    The Lactic Acidosis phenotype already carried a verified quote from
    PMID:36462614 describing a patient diagnosed within two hours of birth with
    elevated plasma lactate, difficulty in swallowing and feeding, and respiratory
    arrest. Only the lactate was extracted; the other two clinical features were
    in the file, verbatim and snippet-verified, and appeared nowhere in phenotypes.
    Both are now curated, reusing the same quote, so no fetching was needed and no
    reference cache file changed.

    Feeding and Swallowing Difficulty in Infancy is bound to HP:0008872 Feeding
    difficulties in infancy. Respiratory Arrest is bound to HP:0005943 Respiratory
    arrest, which is an exact label match; the review suggested HP:0002104 Apnea as
    an option and the exact term was preferred. HP:0005943 was not previously in
    cache/hp/terms.csv, so this round adds exactly one cache row and one enum row.
    Both phenotypes carry evidence_source OTHER, consistent with the rest of this
    paper's citations, and no frequency, consistent with the entry-wide policy.

    Gene attribution was verified before curating, because this paper describes
    patients with variants in four different genes in adjacent sentences. The
    sentence quoted here is immediately followed by "They found a mutation human
    R138Q in NDUFS2 (NuoCD_R270Q), and the patient was compound heterozygous with
    R333Q, also in NDUFS2", so the subject is unambiguously an NDUFS2 patient. The
    review independently flagged the neighbouring descriptions as belonging to
    NDUFV1, NDUFS1 and NDUFS8 patients; none of those were curated, and a notes line
    on the new feeding phenotype records that deliberate exclusion so a later
    curator does not mine the rest of the paragraph without checking subjects.

    The branch was six commits behind origin/main and was rebased before this push,
    because the repository's diff-against-origin/main gates report phantom failures
    in untouched files when a branch falls behind. After rebasing, all four
    against-ref gates were re-run and pass.

    Validation, all run and read: just validate passed; just validate-disorders
    passed; Snippets checked: 88/88 verified against cached references, up from 86;
    check-entity-refs OK; check-title-snippets OK; check_snippet_length
    --against-ref origin/main OK; check_snippet_grading --against-ref origin/main
    OK; check_folded_hyphens --check OK; check-duplicate-keys OK;
    check-term-cache-integrity OK; check-cache-order OK. Cache diff is exactly the
    one new CURIE, HP:0005943.

  summary: Take the two non-blocking notes from the approving review
  details: |
    Two non-blocking notes from the approving review on PR 9597, both taken.

    Note 1: the reviewer pointed out that PMID:33640456's own body resolves the N2
    subunit-assignment question rather than leaving a standoff, and was right. The
    body states that N2 sits at the interface of NDUFS2 and NDUFS7, that it is
    ligated by four cysteines in NDUFS7, and that it lies about 12 angstroms above
    the quinone-binding site, with NDUFS2 residues in its second coordination
    sphere. The abstract's phrasing, "located in the NDUFS2/NUCM subunit", is
    shorthand for that interface position, so the two papers are consistent once the
    body is read rather than in conflict.

    The entry now states the resolved account instead of the standoff, in three
    places: the top-level description, the node description, and the notes. Two new
    evidence items from the body of PMID:33640456 carry it. The PMID:36462614
    sentence that had been curated as a competing assignment is regraded from
    PARTIAL to SUPPORT, because on the interface reading it is consistent rather
    than contradictory: the NDUFS2 region genuinely holds no cluster of its own, and
    NDUFS2's contribution is the quinone-binding site plus the second coordination
    sphere. The notes now also warn that a curator citing only the abstract of
    PMID:33640456 will reach the looser statement, which is how this arose.

    This also makes the mechanism coherent rather than merely accurate. The reason
    an NDUFS2 residue can abolish the cluster is precisely that it acts through the
    second coordination sphere of a cluster it does not hold, and that is now said.

    Note 2: the idebenone evidence item sat oddly on a supportive-care treatment
    entry. The result is now recorded where it belongs mechanistically, as a
    RESTORED readout on the NDUFS2 knockout cell line under experimental_models,
    with an interpretation stating explicitly that it is a rescue in a model and not
    a treatment given to a patient. The item is retained on the treatment entry with
    a rewritten explanation making clear it is cited to substantiate why nothing
    disease-directed is curated, not to support supportive care itself.


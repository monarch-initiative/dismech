  summary: Correct an over-claim about the R121 lesion and cite its assembly result
  details: |
    Blocking item from the review on PR 9597, and the reviewer was right that the
    entry asserted more than its source supports.

    The catalytic node said that an enzyme can be fully assembled, structurally
    intact and completely non-functional, and concluded that a normal complex I
    amount says nothing about whether the enzyme works. The second half of that is
    false for the very variants the claim rests on. PMID:33640456 is cached as full
    text and reports that complex I content fell to about 40 percent and 25 percent
    of wild type for R121M and R121K, that membrane enrichment fell by 60 to 75
    percent, and that mutations of R121 impair the assembly and stability of complex
    I. The cryo-electron microscopy phrase "within an otherwise intact enzyme" is
    about the particles that did assemble, not about how many assembled, and blue
    native gel electrophoresis is exactly the assay the paper ran, where the result
    was not normal.

    Three changes follow. The node claim is narrowed to what the structure licenses,
    which is that a particle which does assemble can be native-like and
    catalytically dead, and the node now states that R121 hits both arms of this
    entry at once. That is consistent with the allele-dependent framing adopted last
    round rather than an exception to it. The correcting sentence is curated as
    PARTIAL evidence on the same node so the qualification travels with the claim.

    The knowledge gap's diagnostic prediction is adjusted. It previously said the
    two lesion types make opposite predictions, with a catalytic lesion leaving blue
    native gel electrophoresis normal. It now says they make different but not
    opposite predictions, that what distinguishes them is the ratio of activity to
    assembled enzyme rather than either measurement alone, and that this is why the
    proposed experiment measures both in the same cells. The reviewer's observation
    that this is a better argument for the ratio design is correct and is now the
    stated reason. The R121 caveat in the same gap is extended: R121 is not a clean
    catalytic-only exemplar, and the gap should not lean on it as one.

    The R121 assembly and stability result is now cited on the Complex I Assembly
    Disruption node, which previously rested entirely on PMID:36462614. It is a
    second independent line of support, in a eukaryotic rather than a bacterial
    enzyme, which speaks directly to the reason that node is marked PROVISIONAL, and
    it supplies a molecular account: the authors propose the arginine acts as part
    of a key-and-lock holding NDUFS2 and NDUFS7 together during assembly.

    The non-blocking grading question was decided explicitly and recorded in notes.
    The Yarrowia lipolytica work stays IN_VITRO. Y. lipolytica is a yeast rather
    than an animal, so MODEL_ORGANISM as this repository defines it does not apply,
    and the experiments are spectroscopy, cryo-electron microscopy and enzyme assays
    on purified complexes and membrane preparations rather than observations in a
    living organism. The zebrafish, mouse and C. elegans work in this entry remains
    MODEL_ORGANISM.

    The branch was one commit behind origin/main and was rebased before pushing.


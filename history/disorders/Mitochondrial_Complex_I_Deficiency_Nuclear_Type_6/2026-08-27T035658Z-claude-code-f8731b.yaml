  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 6 (NDUFS2)'
  details: |
    New Disease entry for MONDO:0032611 (OMIM 618228), the NDUFS2 nuclear complex I
    subunit disorder, curated from the stub at
    stubs/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_6.yaml. The sibling entry
    kb/disorders/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_2.yaml (NDUFS8) was
    read first and its shape followed.

    Entry-type decision: DISEASE. The stub records no mondo_descendant_count, so
    MONDO holds this as a leaf, and genes: lists a single causal gene (NDUFS2). The
    MONDO record carries an intersection_of axiom (nuclear-type complex I deficiency
    AND caused-by NDUFS2), which is the gene-series pattern the sibling numbered
    entries follow.

    Deep research: just research-disorder falcon. The report's reference_validation
    block reported 2/2 references verified, 0 not found, 2/2 on topic. NEC preflight
    (just preflight-dr ... MONDO:0032611) returned PASS with NDUFS2 mentioned 81
    times against NDUFS4 at 4. The report was used as a lead only; every snippet in
    the entry was taken from a references_cache file fetched with just
    fetch-reference. Two of its suggestions were pursued and both improved the
    entry: the Ndufs4-versus-Ndufs2 model-substitution caveat, which is now a
    HUMAN_MODEL_MISMATCH discussion built on quoted evidence from PMID:35338200, and
    its list of Leigh-spectrum clinical trials, which is recorded in notes as
    deliberately not curated because none of those trials enrolled on NDUFS2
    genotype. One of its ontology suggestions was rejected: it proposed HP:0000007
    for a Leigh syndrome phenotype, then flagged its own error in the same table
    cell.

    Content: 8 pathophysiology nodes in one connected chain, with the trigger
    branching into two parallel molecular arms that are separately evidenced and
    that make opposite predictions about a diagnostic assay. The catalytic arm is
    loss of the N2 iron-sulfur cluster and quinone reduction, demonstrated by
    cryo-electron microscopy showing the cluster absent from an otherwise intact
    enzyme. The structural arm is complex I assembly disruption, demonstrated by
    modelling interface variants in a homologous bacterial enzyme. The assembly arm
    is marked PROVISIONAL because the evidence is bacterial and pools variants from
    four subunit genes. 7 phenotypes, 2 progression phases, 1 genetic entry, 1
    experimental model (NDUFS2 CRISPR knockout HEK293), 3 animal models (ndufs2
    knockout zebrafish, Ndufs2 hemizygous mouse, brain-specific Ndufs2 knockout
    mouse), 3 diagnosis entries and 2 discussions.

    Two negative results are curated structurally rather than as prose. The Ndufs2
    hemizygous mouse carries relationship FAILS_TO_RECAPITULATE, because one
    functional allele produces no phenotype and no significant complex I decrease;
    that negative is direct evidence that the human condition requires biallelic
    loss and that carriers are unaffected. The Ndufs4 model-substitution caveat is a
    HUMAN_MODEL_MISMATCH discussion rather than a note, because it is a statement
    about translational validity of the dominant model system in this disease class.

    One schema finding worth recording. HPO places Neonatal death (HP:0003811) and
    Death in infancy (HP:0001522) under Age of death (HP:0011420), which falls
    outside the PhenotypeTerm dynamic enum. A Neonatal Death phenotype was drafted,
    failed enum validation, and was converted into a progression phase instead,
    with the reason recorded in that phase's notes rather than silently dropped.

    Every phenotype in this entry deliberately carries NO frequency band, and the
    reason is stated in notes: the human literature on NDUFS2 consists of a founding
    report of three families whose abstract does not describe their phenotypes,
    single case reports, and cohort papers about complex I deficiency as a class.
    There is no denominator to band against, and taking one from a class-level
    statement would attribute to NDUFS2 a frequency measured across a genetically
    heterogeneous group.

    Other deliberate omissions recorded in notes: no prevalence record; no
    environmental section; and no treatments section at all. The two preclinical
    leads, idebenone in the knockout cell line and folic acid in the knockout
    zebrafish, are curated as model readouts rather than promoted to treatment
    entries, because neither has been tested in a patient with this disorder and a
    treatment entry would assert a therapy that does not exist.

    GeneReviews: the Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview
    (PMID:26425749) is the relevant chapter and is tagged in references, but its
    cached PubMed record contains only the chapter's purpose statement, names
    neither NDUFS2 nor any clinical characteristic, and therefore could not serve as
    a phenotype baseline. That limitation is stated in notes rather than left
    implicit.

    A cross-entry consistency point is recorded in notes for future curators. The
    sibling NDUFS8 entry says that subunit's ferredoxin consensus patterns were
    "long thought to provide the binding site for the iron-sulfur cluster N-2",
    quoting a 1998 paper, while current structural work places N2 in NDUFS2. These
    are a 1998 hypothesis and a 2021 structure rather than contradictory readings of
    the same evidence, and both entries report what their own sources say.

    Validation, all run and read: just validate passed; just validate-disorders
    passed; Snippets checked: 70/70 verified against cached references;
    check-title-snippets OK; check_snippet_length --against-ref origin/main OK;
    check_folded_hyphens --check OK; check-duplicate-keys OK;
    check-term-cache-integrity OK; check-cache-order OK. Cache diff is exactly the
    two CURIEs this entry introduces (MONDO:0032611, hgnc:7708).

  summary: 'Address review on PR 18161: remove unsupported edges and treatment mechanism
    links'
  details: |
    Removed the ten new downstream edges that carried no evidence and were not supported by the cited sources (Progressive Neuron Loss to Hypotonia, Hyperreflexia, Seizures, Nystagmus, Strabismus and Esotropia; Cortical Layering Defect to Microcephaly; Autonomic Nervous System Dysfunction to Postural Hypotension, Hypohidrosis and Anisocoria). PMID:40706141 lists these findings only as frequencies and says the pathomechanism of the autonomic symptoms is not understood. Kept the Cortical Layering Defect to Global Developmental Delay edge with the same INDIRECT mouse evidence used for the Intellectual Disability edge. Removed the four target_mechanisms links claiming that myotomy, artificial tears and GlcNAc modulate autonomic dysfunction, keeping their target_phenotypes. Added PMID:40979943 evidence to the Achalasia to Growth Impairment sequela and dropped the Global Developmental Delay to Severe Speech Delay sequela.

  summary: 'Create: Alacrima_Achalasia_and_Intellectual_Disability_Syndrome'
  details: |
    New entry for alacrima, achalasia, and intellectual disability syndrome / GMPPA-CDG (MONDO:0014219), claimed in issue 15339. Deep research: one Perplexity report (research/Alacrima_Achalasia_and_Intellectual_Disability_Syndrome-deep-research-perplexity.md). Three medium-effort runs were dropped by the API after about five minutes, so the report was produced with reasoning_effort=low (recorded in its provider_config). 24/25 report references resolved; the unresolved DOI was not used. preflight-dr returned WARN because GMPPB is mentioned 20 times; GMPPB is GMPPA's catalytic partner and part of this disease's mechanism, not a second disease, and no GMPPB-disease content was used. The report suggested the obsolete GO:0006486; GO:0009101 was bound instead.

    Phenotype baseline is the 2025 review of 26 patients (PMID:40706141, full text), with per-feature frequencies. Mechanism from the gene-discovery report (PMID:24035193), the Gmppa knockout mouse with dietary mannose rescue (PMID:33755596) and the GMPPA-GMPPB cryo-EM structure (PMID:33986552). ClinGen Definitive (CGGV record cached) recorded as gene_disease_validity with relationship_type CAUSATIVE.

    An internal red-team review before the PR found an unsourced compound-heterozygosity clause, an edge from neuron loss to developmental delay that the dietary-rescue result contradicts, an O-mannosylation binding no source supports, a mis-graded lymphoblast quote, a reversed turnover statement and missing intellectual-disability and eye phenotypes; all were corrected. Validation: validate-disorders (61/61 snippets), validate-terms, check-entity-refs, check-causal-targets, gene-activity grounding, check-gene-validity and check-genereviews (NO_CHAPTER) pass.

    PR 15351 review round 1: added severe speech delay (HP:0000750) and muscle weakness (HP:0001324); split the alpha-dystroglycan/myopathy node into a MOLECULAR alpha-dystroglycan node and a TISSUE myopathy node, pointed myopathy at muscle weakness and dropped the myopathy to gait edge, since the review attributes gait abnormality to ataxia or spasticity; added esotropia and astigmatism; noted mixed mouse/in vitro/human content in three explanations. The FCDGC natural history study and a further split of the GDP-mannose node were not taken.

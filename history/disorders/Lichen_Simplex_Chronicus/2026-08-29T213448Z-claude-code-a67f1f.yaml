  summary: 'Review: Lichen Simplex Chronicus evidence re-read against cached sources'
  details: |
    Re-read the cited reference and re-verified both evidence items. Both snippets span hard
    line-wraps in PMID:40855389's cached abstract and match exactly under the whitespace
    normalization the validator applies. The Lichenification (HP:0100725) quote is the review's
    definitional statement. No defects.

    As with Prurigo Nodularis, the finding is thinness. Recorded for follow-up:
    - PMID:38795165, a Mendelian randomization study, sits in references: with findings: []
      and grounds nothing, although its cached abstract has concrete quotable results
      (MMP-10 OR = 0.493, DNER OR = 0.651, GDNF OR = 1.871) that would support a
      cytokine-dysregulation node with evidence_source: COMPUTATIONAL.
    - No Pruritus phenotype, although the cited source defines LSC as a "chronic pruritic
      dermatosis" and itch is the cardinal symptom; Lichenification is the only phenotype.
    - No treatments: block although the cited review is explicitly about therapies.
    - pathophysiology[0]'s claim is "neuroimmune"; the quoted sentence establishes the
      itch-scratch cycle but not the neuroimmune character, which a different unquoted
      sentence of the same abstract does state.

  summary: 'Review: Netherton Syndrome evidence re-read against cached sources'
  details: |
    Re-read all cached references and re-verified all 77 evidence items - including the 31
    non-PMID items (20 DOI, 9 clinicaltrials, 2 GEO) that the validator does not check. Every
    snippet is an exact substring of its cache, including a preserved source typo in
    PMID:40607310. No Named Entity Confusion: the two obvious traps (PMID:40709761's mixed
    ichthyosis cohort, PMID:38601387's infant whose final diagnosis was not NS) are both
    cited correctly and graded PARTIAL.

    Fixed in this pass:
    - Two items on the KLK/IL-36 claim were graded MODEL_ORGANISM. The clause they rest on -
      that KLKs proteolytically regulate IL-36 - was demonstrated by cell-free recombinant
      digestion assay in the cited paper, not in mice. Both regraded IN_VITRO (kept
      consistent, since one sentence carries one grade).
    - pathophysiology[SPINK5 loss-of-function variants]: a human-genetics background sentence
      was graded MODEL_ORGANISM; regraded HUMAN_CLINICAL. Its snippet also began
      "AbstractNetherton syndrome", a PDF-extraction artifact gluing the heading to the first
      word; trimmed (still an exact cache substring).
    - prevalence: dropped the deprecated percentage field, and corrected two places that
      described PMID:39546052 as a "review". Its cached METHODS line reads "Case report of a
      9-week-old infant with NS treated with dupilumab"; the 1:200,000 figure is background
      it cites. Also recorded that the source says "incidence" while the record asserts
      BIRTH_PREVALENCE.

    Grading rule used for background sentences. Several items in this batch quote a
    paper's introductory background statement rather than its own result, and the
    question is what evidence_source such a sentence carries. The rule applied: grade
    by whether the citing publication presents human clinical material at all, since
    that is what the slot exists to keep honest. The SPINK5 background sentence here
    stays HUMAN_CLINICAL because that paper studies Netherton syndrome patients
    directly -- a consumer filtering for human evidence is right to surface it. The two
    background sentences in Oculocutaneous_Albinism went to OTHER because their paper
    is a mouse-model study whose only human component is melanocyte culture, graded
    IN_VITRO elsewhere in that entry; no patients appear in it, so HUMAN_CLINICAL
    would have been a false signal. The two cases look alike but differ on the point
    the slot is for.

    Recorded, not fixed:
    - pathophysiology[Hair shaft structural fragility from follicular protease imbalance]
      asserts a follicular protease mechanism; its quote reports phenotype co-occurrence only.
    - The corneodesmosome/desquamation node's quote mentions neither corneodesmosomes nor
      desquamation; NCT01545323's cached summary states it directly.
    - The IL-17/IL-36 -> Failure to thrive edge is unsupported; the entry's own PMID:38025195
      ties growth retardation to barrier failure and dehydration instead.

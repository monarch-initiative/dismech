  summary: 'Curate phenotypes: Netherton syndrome'
  details: |
    Expanded the phenotypes section from 7 to 27 entries using papers already in references_cache (PubMed, Europe PMC, OLS and Orphadata were not reachable; no GeneReviews chapter exists for this disease). Added ichthyosis linearis circumflexa, trichorrhexis invaginata (20/25), sparse eyebrows and eyelashes, ectropion, neonatal hypernatremic dehydration and hypothermia, sepsis, food allergy, asthma, allergic rhinitis, urticaria, angioedema, increased IgE (13/25), eosinophilia, short stature, chronic diarrhea, hypoalbuminemia, generalized aminoaciduria and adult cutaneous squamous cell carcinoma. Enriched erythroderma (25/25, congenital onset), the general hair-shaft phenotype (pili torti, trichorrhexis nodosa) and recurrent infections. Counts come from the 25-patient literature summary in PMID:36159989; proportions that a case report only cites from another series were kept in prose. Added a failure-to-thrive to short-stature sequela and 11 bare-name downstream edges from existing pathophysiology nodes. The two new HPO terms (HP:0025810, HP:0025811) were validated and cached against the HPO 2026-09-01 release file because OLS was unreachable. Death in infancy was left out as a phenotype because HP:0001522 is outside the phenotype enum. Validation: validate, validate-terms, validate-disorders, count-verified-snippets (128/128) and the offline graph and snippet gates all pass.

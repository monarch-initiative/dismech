  summary: Bind gene-stratified MONDO subtypes SYNS1/3/4 as narrowMatch mappings
  details: >-
    Added a disease-level mappings.mondo_mappings block (none existed before)
    with three skos:narrowMatch entries: MONDO:0008519 (multiple synostoses
    syndrome 1, NOG), MONDO:0013064 (multiple synostoses syndrome 3, FGF9),
    and MONDO:0054752 (multiple synostoses syndrome 4, GDF6). These three
    numbered forms were folded into this entry's coverage by PR #9855, which
    deleted their standalone stubs, but the coverage index does not read
    genetic[].gene_term, so seed-stubs could re-nominate them; the narrowMatch
    mappings close that gap per issue #9868. SYNS2 (GDF5) was not part of the
    folded-stub set this issue names, so it is left unmapped rather than
    guessed. All three CURIEs verified live (not obsolete) via OLS before
    writing. No new evidence added; the entry's existing genetic[] entries
    (NOG Mutations (SYNS1), FGF9, GDF6 Mutations (SYNS4)) already carry the
    causal claim these mappings anchor to.

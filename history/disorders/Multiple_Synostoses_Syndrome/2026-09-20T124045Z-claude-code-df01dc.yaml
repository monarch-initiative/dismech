  summary: 'Genetics pass: bind NOG/GDF5/GDF6 and add an FGF9 node'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: four SYNS loci are established (NOG/SYNS1, GDF5/SYNS2,
    FGF9/SYNS3, GDF6/SYNS4). The checklist keys FGF9 (MONDO:0013064) and GDF6
    (MONDO:0054752); both MONDO terms and their gene attributions were verified
    against OLS and the Monarch CausalGeneToDiseaseAssociation endpoint.

    This entry carried the largest real curation gap in the tranche: three of its
    four `genetic:` records - NOG, GDF5 and GDF6 - had no `gene_term` at all, so
    those genes were invisible to every gene-keyed export and query despite being
    named in the record titles and notes.

    Changes:
    - Bound `gene_term` on NOG (hgnc:7866), GDF5 (hgnc:4220) and GDF6 (hgnc:4221).
    - Gave the GDF6 record real evidence. It previously carried a one-sentence
      unsourced note. Now cites the founding SYNS4 report PMID:26643732 for the
      p.Y444N segregation and the noggin-resistance mechanism, plus PMID:34573339
      for the second family, where GDF6 expression is reduced by a breakpoint rather
      than the ligand being hyperactive - so the allelic spectrum is not uniformly
      gain-of-function.
    - Wired NOG, GDF5 and GDF6 onto the `BMP Signaling Dysregulation` node.
    - Added a separate `FGF9 Signaling Loss in the Joint Interzone` node rather than
      putting FGF9 on the BMP node. FGF9 p.S99N is secreted normally but binds FGFR
      poorly, so FGF signaling is *reduced*; putting it beside noggin-resistant BMP
      ligands would have asserted the wrong sign. Evidenced from PMID:19589401
      (receptor-binding defect) and PMID:28169396 (interzone formation in a mouse
      carrying the human allele, plus the Fgf9-to-Gdf5 link that makes the
      convergence real).
    - Added a SYNS2 (MONDO:0012394) narrowMatch mapping; the entry mapped SYNS1, 3
      and 4 but not 2, although GDF5 was curated.
    - Reworded the cavitation node, which described only the noggin route.

    New references cached: PMID:26643732, PMID:19589401, PMID:28169396.

  summary: 'Review response: Self-Limited Epilepsy with Autonomic Seizures (PR 7984,
    rounds 1-2)'
  details: |
    Append-only record of two review rounds on PR 7984. The CREATE record describes the entry as first written (39/39 snippets); this record describes what it became.

    The most consequential correction was an ontology-binding error. Ictal syncope was bound to HP:0001279 Syncope, whose HPO definition specifies transient loss of consciousness due to cerebral hypoperfusion. That is the wrong mechanism, since the event here is epileptic, and the irony was sharp: the entry lists syncope in differential_diagnoses as one of the conditions this syndrome is mistaken for, and then annotated the finding with syncope's own term, so a consumer querying HP:0001279 would have picked up an epileptic event as true syncope. Rebound to HP:0032755 Focal impaired awareness autonomic seizure, with preferred_term Ictal syncope carrying the clinical nuance.

    Evidence-source retagging. Twenty-four PMID:16950946 items moved from OTHER to HUMAN_CLINICAL. The quoted material is epidemiology, clinical features, and prognosis, which CLAUDE.md assigns to HUMAN_CLINICAL; OTHER was retained only on the two pathophysiology-proposal quotes and the management recommendations, which is the distinction the blanket tagging had flattened.

    prevalence_class was changed from COMMON to UNKNOWN. The recorded figure's denominator is children who already have afebrile seizures, which the notes state, but prevalence_class is a structured population-rate band and COMMON would have been consumed as contradicting the disorder's rare designation.

    Added: an Avoidance of Aggressive Acute Treatment entry, a treatment record for what not to do, carrying the source's warning that aggressive treatment may cause iatrogenic complications including cardiorespiratory arrest. This is a distinct hazard from the seizure-intrinsic risk already recorded in the self-limited-label discussion, harm from the response rather than from the event. Also added three phenotypes (focal to bilateral tonic-clonic at 50 percent, ictal incontinence, ictal hypersalivation), split cyclic vomiting syndrome into its own differential because it is the hardest of the mimics to exclude, completed a snippet that had been truncated mid-sentence on a line break, and dropped a target_mechanisms block whose own description retracted the effect type it asserted.

    Post-approval, two term bindings were refined on the reviewer's own correction: hypersalivation from HP:0002307 Drooling to HP:0003781 Excessive salivation, which carries Hypersalivation as an exact synonym, and the incontinence preferred_term set to Ictal incontinence so the rendered page does not assert urge under a heading saying incontinence.

    Final state: just validate passes with 46/46 snippets verified. Compliance 85.2 percent. Reviewer verdict APPROVED.

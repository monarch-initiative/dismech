  summary: 'Create: Self-Limited Epilepsy with Autonomic Seizures (MONDO:0020307)'
  details: |
    De-novo curation of self-limited epilepsy with autonomic seizures, the ILAE 2022 name for Panayiotopoulos syndrome, previously absent from dismech.

    Deep research: claude_code provider launched for this disorder; the entry was built from directly-fetched primary literature. Every PMID independently fetched and every snippet verified as an exact substring of the cached abstract.

    Model: a six-node chain from maturational seizure susceptibility of the developing brain, branching to multifocal cortical epileptogenicity with age-shifting foci and to age-specific vulnerability of central autonomic networks, converging on focal autonomic seizures, then autonomic status epilepticus and age-dependent remission. Two nodes conform to epilepsy_excitation_inhibition_imbalance.

    The entry deliberately models the location-independence claim as its own node. The published account holds that ictal discharges produce emesis irrespective of onset location because children's autonomic networks are particularly recruitable; the edge from the cortical node to the seizure node is therefore recorded as INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT, because the route is not established.

    Three discussions: (1) KNOWLEDGE_GAP on why the semiology is autonomic and location-independent when almost every other focal epilepsy localizes, and why the susceptibility closes with age; (2) CONTROVERSY on whether the syndrome is electrographically defined by occipital or multifocal spikes, recording that the 2023 EEG reappraisal proposed its age-stratified definition on explicitly limited evidence; (3) CONTROVERSY on whether the self-limited and benign labels adequately convey residual risk, given documented atypical evolution to ESES with IQ deterioration and the acknowledged rare cardiorespiratory arrest.

    No genetic section is curated, and the reasoning is stated in notes: no causative gene is established and the described mechanism is maturational rather than monogenic.

    Cache note: MONDO:0020307 was new to dismech and the live OLS lookup timed out during term validation. The DiseaseTerm enum cache and cache/mondo/terms.csv were seeded by a one-off validate run against the local sqlite:obo:mondo adapter; conf/oak_config.yaml was restored afterwards and is unmodified in this branch.

    Validation: just validate passes (schema, terms, references) with 39/39 snippets verified against cached references. Compliance 81.7 percent global.

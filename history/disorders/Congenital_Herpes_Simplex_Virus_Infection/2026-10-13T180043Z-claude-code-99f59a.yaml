  summary: Bind the HSV DNA NAAT as a LOINC measurement
  details: |
    Added measurements: LOINC:5014-6 (Herpes simplex virus DNA [Presence] in Specimen by NAA with probe detection) to the HSV Polymerase Chain Reaction row. The code is type-unspecified (not HSV-1 or HSV-2 specific), matching the row's generic 'HSV DNA' framing for neonatal disease, which can be caused by either type. 'By NAA with probe detection' is the standard LOINC NAAT-method category rather than an arbitrary interchangeable method choice (no type-unspecified NAAT code without this qualifier exists in LOINC for HSV), consistent with precedent elsewhere in the KB (e.g. Mycobacterium tuberculosis complex DNA, Streptococcus pyogenes DNA). Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch11 (LOINC_DIAGNOSTICS.md tranche B).

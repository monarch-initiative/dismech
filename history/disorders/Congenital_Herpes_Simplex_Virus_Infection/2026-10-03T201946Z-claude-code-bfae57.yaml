  details: |
    The ai4c-reviewer review of 2026-10-01 found that several changes described in record 2026-10-01T121738Z-claude-code-2a34d9 were not in the committed YAML. That record is left as written; this record describes what was actually applied in this round. Prevalence: measure_type changed from BIRTH_PREVALENCE to ANNUAL_INCIDENCE on both records, as the notes already said; the Americas rate of 13.3 per 100,000 moved to BAND_1_5_PER_10000. Added a diagnosis section with three items: HSV PCR (NCIT:C17003, PMID:23481105), placental histopathology (NCIT:C18190, PMID:33520322) and ophthalmological assessment (NCIT:C38060, PMID:38044450). Added an animal_models entry for the PMID:34696359 intravaginal HSV-2 pregnant mouse model, linked to Placental Inflammation and Fetal Injury with RECAPITULATES, fidelity MODERATE, model_scale TISSUE and limitations. Fetched PMID:33520322 and used its necrotizing placental inflammation finding in place of the PMID:36249599 aim statement on the placental node; PMID:36249599 has no result sentence in its abstract and was no longer cited, so its cache file was removed. Replaced the PMID:37559852 aim statement on the neuroinvasion node with its sentence on CNS presentations that range from nonspecific to evident neurological symptoms. Replaced the route-split evidence on the mucocutaneous replication node with the PMID:38044450 sentence naming isolated mucocutaneous lesions as a presentation. The snippetless PMID:37559852 seizure item was replaced by the PMID:11483781 sentence on seizures at initiation of therapy in CNS disease. Intravenous aciclovir and oral suppression now bind NCIT:C16119 Antiviral Therapy. Removed subtype SEM from Panuveitis, matching its review_notes. Removed chorioretinitis from the Intrauterine subtype description, and changed the notes to say MONDO lumps three transmission routes, not two. Extended the prophylaxis snippet through the RR confidence interval. Not taken: moving Fever off the CNS subtype or adding it under dissemination, because the only fever source is a CNS case report; disseminated-disease phenotypes (pneumonitis, DIC) still need a source. Validation: just validate 0 issues, count-verified-snippets 38/38, validate-terms passed; entity-refs, causal-targets, duplicate-keys, enum-values, snippet-grading, reference-titles, environmental-evidence and folded-hyphens gates OK; check-granularity reports no deterministic findings.

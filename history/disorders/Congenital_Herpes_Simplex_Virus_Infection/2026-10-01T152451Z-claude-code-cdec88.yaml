  summary: Close the disseminated-disease evidence gap with two new references
  details: |
    Closes the gap the previous record left open. The Haematogenous Multi-Organ Dissemination node was the highest-mortality presentation with no downstream phenotype and no outcome evidence, because the deep-research report's source for the organ involvement of disseminated disease was PMID:11483825, one of the five confabulated citations. Two real references were fetched rather than softening the prose. PMID:11483781, the Collaborative Antiviral Study Group natural history of 186 acyclovir-treated neonates, supplies three things: aspartate transaminase elevation at or above ten times the upper limit of normal at initiation of therapy is associated with mortality in disseminated disease, which is the hepatic organ involvement the node asserts; morbidity status is associated with the extent of disease across the skin-eye-mouth, CNS and disseminated categories, which sources the claim that the three-way classification determines outcome and therefore justifies carrying it as a subtype axis; and a significant minority of infants never have skin vesicles at presentation or during the acute illness, at 39% in disseminated disease, 32% in CNS disease and 17% in skin-eye-mouth disease. PMID:41185580, a twelve-centre Korean cohort, supplies 30-day mortality confined to the disseminated group. Changes: added an Elevated circulating aspartate aminotransferase concentration phenotype (HP:0031956, subtype Disseminated) as the node's downstream target, bound to the transaminase term rather than to HSV hepatitis (HP:5210394) because the source reports the enzyme elevation and does not diagnose hepatitis; added the mortality and extent-of-disease evidence to the dissemination node; and corrected the Vesicular skin eruption phenotype, whose description had called vesicles the first visible sign in any form. That was an over-generalization from a single intrauterine case, and the 39% absence figure is now carried on it as a REFUTE with directness INDIRECT against reading the phenotype as a reliable marker of the disease. Separately, all six citations of DOI:10.1002/jmv.29024 were switched to PMID:37592873, the same paper's PubMed record, after verifying the PMID cache carries every quoted sentence; DOI is in skip_prefixes so those snippets were previously not checked by the gating validator, and they now are. Snippet count rose from 28/28 to 32/32 verified, and count-verified-snippets --unskip-prefix DOI also reports 32/32. Note for whoever runs the gates next: check-snippet-length currently reports three findings in Behr_Syndrome.yaml and Beta_Mannosidosis.yaml, both untouched by this branch. All three snippets are pre-existing on origin/main and appear only because grandfathering is unavailable in that run mode; they are not introduced here.

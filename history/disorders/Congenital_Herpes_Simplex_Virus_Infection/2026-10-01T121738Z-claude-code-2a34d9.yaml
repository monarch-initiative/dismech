  summary: 'Pre-PR red-team review round: Congenital Herpes Simplex Virus Infection'
  details: |
    Self-review round before opening the PR, run in a subagent for fresh context per step 7 of the initiate-new-disorder-creation skill. Verdict was REQUEST_CHANGES with six blocking findings; all six are fixed, and every quoted passage the reviewer relied on was verified as an exact substring of its cache before I acted on it. Snippet count rose from 22/22 to 28/28 verified. (1) prevalence_class was BAND_1_9_PER_100000 on a rate of 13.3 per 100,000; the schema puts 10-99 in BAND_1_5_PER_10000 and scripts/migrate_prevalence.py _band_from_rate returns that for any rate at or above 10. Corrected. Nothing in the gate set compares a band against its own rate, which is why it survived. (2) HP:0002324 Hydranencephaly was bound from a source reporting only brain abnormalities on antenatal ultrasound; rebound to HP:0012443 Abnormal brain morphology with the rejection recorded in review_notes. This was the third instance in this entry of specificity invented past the source, after the Chorioretinitis and DIC cases caught during the build. (3) Panuveitis was hung off Placental Inflammation and Fetal Injury, a node declared operative only on the intrauterine route, on the strength of a case the source describes as presumed neonatal infection diagnosed on serum IgM; re-parented under the mucocutaneous replication node, the explanation softened to match the source's suggestive-of hedge, and the subtype annotation made consistent with its sibling. (4) Neonatal Viral Replication and Dissemination bundled three claims across two biological scales; split into Local Mucocutaneous Replication at the Portal of Entry (CELLULAR), Neuroinvasion and Central Nervous System Spread (ORGANISM) and Haematogenous Multi-Organ Dissemination (ORGANISM). The SEM/CNS/disseminated classification, which sets aciclovir duration and differs sharply in mortality, previously existed only as prose; it is now carried as three has_subtypes entries with children on Perinatal. The dissemination node deliberately has no downstream phenotype because no reference cited here reports the organ involvement of disseminated disease. (5) The maternal primary-versus-recurrent transmission risk, named in issue 13253 as the most decision-relevant fact in this disease, was an unsourced assertion whose cited snippet said only that a review summarized the topic; the risk-factor sentence from PMID:38044450, already cited in this entry, now carries it, and the viral-load and transplacental-antibody mechanism no cited source supports has been removed. The reviewer's suggestion to route this through environmental influences_mechanisms was checked and declined on evidence: ECTO has no herpes or simplexvirus term, so the slot could only be filled unbound, which check-environmental-evidence now gates. (6) Prevention was entirely absent; added maternal third-trimester antiviral prophylaxis from the Cochrane review PMID:18254066, which was cached and uncited in this same worktree, including a NO_EVIDENCE item for its explicit statement that evidence is insufficient to determine whether prophylaxis reduces the incidence of neonatal herpes. Medium and low findings also taken: measure_type changed from BIRTH_PREVALENCE to ANNUAL_INCIDENCE with a LIVE_BIRTHS denominator on both records, matching the source's own wording and the neonatal listeriosis precedent in Listeriosis.yaml, since about 95% of covered cases are acquired at or after delivery; curation rationales moved out of explanation into review_notes, including a DIC note that had been attached to the Fever item where it was a non-sequitur; a seizure evidence item dropped whose quote never mentioned seizures; human placental evidence added from PMID:33520322 so the intrauterine mechanism no longer rests solely on one mouse study; an animal_models entry added for that mouse model with modeled_mechanisms, fidelity MODERATE, model_scale TISSUE and limitations recording murine placentation divergence, so it joins the pathograph; skin erosion (HP:0200041) and retinopathy (HP:0000488) added from already-cited abstracts; a diagnosis section added with PCR, placental examination and ophthalmological assessment, which also moved a diagnosis sentence out of treatments where it was doing duty as a treatment claim and sourced the ocular-assessment claim the Panuveitis description had been paraphrasing uncited; subtype foreign keys applied to five phenotypes; treatment_term changed from NCIT:C15986 Pharmacotherapy to the more specific NCIT:C16119 Antiviral Therapy; two description claims softened that no cited source supported, the neurodevelopmental specificity of suppressive therapy and the mortality and sequelae assertion; and the second MONDO parent added. Two findings not accepted. The reviewer reported that the stub this PR deletes never existed; it did, committed in dcd1ea412c, and was staged as a deletion before the review ran, so there is nothing to change. The reviewer proposed conforms_to against viral_neural_progenitor_cytopathy and viral_polymerase_inhibition; both anchors exist, but they describe fetal neural progenitor infection and viral polymerase catalysis, and this entry models neither, so declaring conformance would assert content the entry does not implement. Worth revisiting when those nodes are evidenced. check-snippet-length caught one of my own fixes, a four-word retinopathy snippet, which was extended to the full sentence. Validation after the round: 28/28 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-environmental-evidence, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-stubs and the batched validate-disorders all pass.

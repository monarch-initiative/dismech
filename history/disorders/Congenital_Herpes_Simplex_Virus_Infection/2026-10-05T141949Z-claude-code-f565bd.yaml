  summary: 'Address re-review: remove the unsourced maternal mechanism'
  details: |
    Addresses the single remaining blocking finding from the 2026-10-03 re-review on PR 13331. The Maternal Genital HSV Infection and Shedding node's description still asserted that the three maternal infection categories differ in transmission risk because they differ in viral load and in transplacental antibody available to the neonate. That mechanism is supported by no reference cited in this entry, the node's own PMID:38044450 explanation said it had been removed, and the PR body said the same. It had in fact been removed from the evidence and not from the description, so the node contradicted its own evidence. The cause was a silent failure in my own earlier edit: the replacement string did not match the file's line wrapping and the guard I wrapped it in swallowed the mismatch instead of raising, so the batch reported success while leaving the clause in place. The description now says only that primary maternal infection is a recognised risk factor for transmission alongside vaginal delivery and prolonged rupture of membranes, which is what the cited sentence states. Also took the reviewer's first non-blocking suggestion, which was conditioned on a supporting sentence existing. Intravenous aciclovir previously targeted only the mucocutaneous replication node; it now also targets Neuroinvasion and Central Nervous System Spread and Haematogenous Multi-Organ Dissemination, each evidenced by the PMID:41185580 sentence that all patients in that cohort received intravenous aciclovir, graded directness INDIRECT because the sentence reports the whole cohort rather than naming the CNS and disseminated subgroups, which were 11 and 4 of 16 respectively. The other two suggestions were already dispositioned: the disseminated-disease phenotypes pneumonitis and DIC remain unsourced and recorded in review_notes, and Fever stays on the CNS subtype because the only source is a CNS case. While making the aciclovir change I introduced a duplicate evidence key by inserting the new targets above an existing evidence block, which orphaned the PMID:23481105 block onto the third target. just validate reported only a ruamel constructing-a-mapping error while PyYAML parsed the file without complaint, which is the exact divergence CLAUDE.md documents for duplicate keys; check-duplicate-keys located it and the block was reattached to its original target. The entry carried this defect for one local validation cycle and never reached a commit with it. Snippet count rose from 38/38 to 40/40 verified. Note on two gates: check-title-snippets and check-snippet-grading report findings in CANVAS.yaml, several COX-deficiency entries, CPLX1-Related_DEE.yaml and Autosomal_Recessive_Nonsyndromic_Hearing_Loss_104.yaml, none of which this branch touches. Both gates pass on origin/main. The branch was 273 commits behind, so its baseline predated those entries and their snippets scored as new; the branch has been rebased onto current origin/main to clear it.

  summary: 'Create: Congenital Herpes Simplex Virus Infection'
  details: |
    De novo curation of congenital herpes simplex virus infection (MONDO:0017381). dismech had no herpesvirus entry; Congenital_Zika_Syndrome.yaml was used as the structural pattern. Deep research: falcon was requested but has no API key in this environment, so the run used --fallback and claude_code produced the report, which records fell_back, requested_provider and provider_attempts; the report is research/Congenital_Herpes_Simplex_Virus_Infection-deep-research-claude_code.md. Both of its validation blocks reported needs_review: true. I audited all 25 cached references by title myself and found FIVE confabulated citations - real PMIDs for the wrong papers - of which the report's own validator flagged only one. They are PMID:2020171 (actually 'Subcritical flutter in collapsible tube flow', the one flagged), PMID:21793742 ('Integrating social media into emergency-preparedness efforts'), PMID:33055261 (a Babesia divergens parasitology paper), PMID:16501086 (CD8 responses to simian immunodeficiency virus) and PMID:11483825 (an AAP Committee on Psychosocial Aspects statement). None is cited in this entry. confabulation_rate read 0.0 because all five resolve, and four escaped the relevance check because a record with no abstract cannot be scored off-topic. This is the second consecutive report with exactly this profile; the HSTCL run had five confabulations with one flagged. Four ontology bindings the report offered were also wrong and are not used: HP:0002340 is Caudate atrophy not Hydranencephaly (correct term HP:0002324), HP:0000483 is Astigmatism not Chorioretinitis, HP:0005765 is Sacral meningocele not DIC, and CHEBI:60726 is procainamide 4-hydroxylamine not valacyclovir (aciclovir is CHEBI:2453). HP:0045023 does not exist at all. Every CURIE in the entry was resolved against OLS at the time of writing. Two claims were withdrawn during the build after reading the abstracts rather than the report: a Chorioretinitis phenotype bound to HP:0012424 was replaced with Panuveitis (HP:0012121) because PMID:38044450 reports panuveitis, blepharoconjunctivitis and keratitis and never chorioretinitis; and a disseminated intravascular coagulation phenotype was dropped and replaced with Fever because no reference cited in this entry reports DIC, although it is a genuine feature of disseminated neonatal HSV. Both rejections are recorded in the surviving items' explanation fields. Three of my own first-draft snippets quoted paper titles rather than findings, which is the defect check-title-snippets exists to catch; all three were replaced with real findings. Scope: MONDO:0017381 lumps intrauterine, perinatal and postnatal transmission, and the entry covers all three as one Disease with the routes as has_subtypes, justified by the quantitative split (5/85/10 percent from DOI:10.1002/jmv.29024) plus shared virus, diagnosis and treatment, and by MONDO offering no separate identifier for either route. The notes also record the partial overlap with Viral_Encephalitis.yaml, whose HSV Encephalitis subtype scopes adult HSV-1 frontotemporal disease and binds no MONDO identifier. Pathophysiology is a branching causal chain: maternal shedding to vertical transmission, which splits into placental inflammation and fetal injury on the intrauterine route and neonatal viral replication and dissemination on the intrapartum route, with phenotypes downstream of each. Validation: just validate passes with 22/22 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-environmental-evidence, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and the batched validate-disorders all pass.

  summary: Bind X-linked dominant inheritance term, expand fragment snippets, integrate GeneReviews (PMID:32134616) across clinical/diagnostic/counseling/management sections, and add treatment target_mechanisms for Danon disease
  details: Bound HP:0001423 (X-linked dominant inheritance) on the inheritance entry and expanded 13 short fragment snippets to full verbatim sentences across inheritance, pathophysiology, phenotypes, genetic, and treatments. Integrated GeneReviews (PMID:32134616) evidence across X-linked inheritance/genetic counseling, hypertrophic cardiomyopathy, dilated cardiomyopathy, retinal dystrophy, sex-specific phenotypic differences, LAMP2 molecular genetic testing diagnosis (NCIT:C15709), heart transplantation, and supportive cardiomyopathy/arrhythmia/multisystem management (NCIT:C15747). Added target_mechanisms to Heart transplantation (MODULATES on Cardiac autophagic vacuolar cardiomyopathy, DOI:10.1111/nan.12587) and Gene therapy (AAV9.LAMP2B) (RESTORES on LAMP2 protein deficiency, clinicaltrials:NCT03882437).

  details: |
    Addressed the first automated review of PR 13274. The SPRINTT sex effect-modifier row (NO_EFFECT in men) rested on separate within-sex results with no interaction test, for a multicomponent programme, so its two snippets now sit in the treatment evidence with that caveat. The SPPB baseline-function row is now POST_HOC_SUBGROUP, because SPRINTT ran the SPPB 8-9 analysis after finding an interaction, and its description states the multicomponent caveat. PMID:35234025 (exercise-associated reinnervation review of human master athletes) was regraded from OTHER to HUMAN_CLINICAL. Added reference_title to the 14 computational-model and clinical-trial evidence items that lacked it, copied from the references_cache frontmatter.

  summary: 'Review fixes: Sarcopenia (evidence grading, conformance, genetic slots,
    gap closure)'
  details: |
    Revision of the Sarcopenia entry after an adversarial pre-PR review (a fresh-context subagent running the dismech-pr-review skill). The review returned no CRITICAL findings - it independently re-verified all 78 snippets as exact and found no fabricated PMIDs, no Named Entity Confusion, and no off-disease citations - but it found nine IMPORTANT defects and a set of content gaps. All nine are fixed here.

    EVIDENCE_SOURCE MISGRADINGS (3 defects, 7 items). PMID:35053049 is publication_types [Journal Article, Review] and was graded HUMAN_CLINICAL in three places; PMID:27891296 is [Editorial] and was graded HUMAN_CLINICAL in three places. Both are now OTHER, consistent with how this entry already grades its other five reviews. PMID:25139155's C2C12 myotube result was graded MODEL_ORGANISM; C2C12 is a cultured cell line, so it is now IN_VITRO. The rat/cell split in that paper was already made correctly - only one half was mis-labelled.

    EVIDENCE THAT DID NOT SUPPORT ITS CLAIM (2 defects). Both on ModelMechanismLink evidence, where the claim is "this model is informative for this node". The first quoted a background prevalence sentence ("affects 5-13% of individuals aged over 60 years") that says nothing about the mouse, and additionally cited a 5-13% figure this entry's own prevalence block contradicts at 10-27%; replaced with the study's own conclusion that phenotypic muscle measurements rather than chronological age indicate muscle health. The second, on a link targeting Mitochondrial Dysfunction, quoted a sentence naming extracellular matrix, RNA processing and autophagy - not mitochondria - while its explanation claimed it established mitochondrial relevance; replaced with the sentence that does state rodents recapitulate the mitochondrial changes of human sarcopenia.

    INVERTED CONFORMANCE (1 defect). Anabolic Resistance (annotated GO:0038202 TORC1 signaling, modifier DECREASED) declared conforms_to deregulated_nutrient_sensing#Autophagy Suppression and Anabolic Bias. That module node describes *active* mTORC1 holding autophagy suppressed - the inverse claim. The conformance is removed and the reason recorded on the node, rather than silently retargeted to a node that also does not fit.

    ONTOLOGY PRECISION (1 defect). preferred_term "alpha motor neuron" was bound to CL:0000100 (motor neuron) when CL:0008038 is literally "alpha motor neuron". Rebound.

    GENETIC SLOTS CONTRADICTING THEIR OWN NOTES (1 defect, 3 entries). Every value in GeneDiseaseRelationshipEnum except BIOMARKER and UNKNOWN is defined in terms of variants. MSTN carried SUSCEPTIBILITY + variant_origin GERMLINE while its notes said the gene was recorded as a pharmacological entry point and its only evidence was a drug-mechanism sentence: now UNKNOWN, with variant_origin dropped. SCN4A carried MODIFIER while its notes said outright "not through a sarcopenia-associated germline variant": now BIOMARKER, which is the enum's expression-status value. ACTN3 carried SUSCEPTIBILITY with zero evidence: now UNKNOWN, with a NO_EVIDENCE citation of PMID:27861536, which genotypes the same R577X polymorphism but against exceptional longevity rather than sarcopenia. That item is deliberately NO_EVIDENCE and not REFUTE - it does not bear on the sarcopenia claim either way - and it records that the nearest cached primary source was examined and found off-claim, rather than leaving the gene silently unsourced.

    UNCITED CLAIM (1 defect). The Chronic Low-Grade Inflammation node asserted NF-kappaB activation driving the atrogene program, and annotated GO:0043123, on the strength of a snippet that never mentions NF-kappaB. PMID:38046952's FOXO/NF-kappaB atrogene sentence now substantiates it.

    SELF-INFLICTED ERROR CAUGHT BY VALIDATION. While adding the ACTN3 NO_EVIDENCE item I first wrote a paraphrased snippet with invented p-values. just validate rejected it as not a substring, and it was replaced with an exact quote. Recorded because it is precisely the failure the snippet gate exists to catch, and it was caught by the gate rather than by review.

    OVERCLAIMS SOFTENED. "reliably adds muscle mass" / "reliably increases thigh muscle volume" (twice) rested on a single n=24 phase-1 study in healthy volunteers whose own results state appendicular lean mass did not reach significance; both now state the study size, population, and that null result. modifier INCREASED was removed from GO:0017002 activin receptor activity - blockade benefit does not establish elevated signalling. frequency VERY_FREQUENT was removed from Decreased Muscle Mass, since its snippet gives diagnostic cut-offs and low mass is by construction absent in probable sarcopenia. The anabolic-hormone node now says which half of its claim the evidence covers. A readout named "Neuromuscular junction transmission failure" with direction RESTORED read as the opposite of what was measured and is renamed to the safety factor.

    GAPS CLOSED, using references already fetched but unused. New sections: biochemical (IL-6, TNF-alpha, IGF-1, with an explicit note that no reference_ranges are recorded because no marker has an established sarcopenia threshold), diagnosis (DXA versus office bioimpedance from PMID:38045877, including the sarcopenic-obesity masking pitfall; SARC-F from PMID:40711821, including the PPV of 0.31 that makes it a screen rather than a test), progression (two phases; the 60+ record quotes PMID:40898141 in full so its three null results for fracture, readmission and mortality stand beside the positive fall association rather than being trimmed away), clinical_trials (NCT06643780, denosumab, with phase and status recorded as unverified placeholders since the registry record was not fetched), inheritance (HP:0010982 polygenic), a GWAS genetic record (PMID:36771461, 78 SNPs across 73 loci), and two treatments (vitamin D repletion, explicitly recorded on association grounds with no interventional trial cited; RANKL inhibition at rationale stage). The ClC-1 compound is now named (NMD670) with a note explaining why therapeutic_agent is left unbound.

    DELIBERATELY NOT CHANGED. The review flagged that consensus statements (PMID:30312372, PMID:32033882) are graded HUMAN_CLINICAL across eight items where CLAUDE.md routes "expert consensus without data" to OTHER. Left as-is and argued in review_notes: these synthesize human cohort data and the quoted passages are diagnostic criteria derived from it. This is an arguable call, flagged for a reviewer rather than quietly settled.

    VALIDATION AFTER REVISION. just validate passes with 95/95 snippets verified (up from 78). check-entity-refs, check-duplicate-keys, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens all pass. All 5 dataset accessions re-verified. just test-kb passes in full (39,065 tests). Compliance rose from 83.8% to 86.2%. The stale review_notes claim that the entry had no datasets records - it has five - is corrected.

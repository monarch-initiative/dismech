  summary: Resistance-training mechanism, trials, and effect modifiers
  details: |
    Expanded how resistance training is represented, at the request of a maintainer who asked whether the entry covers mechanical load, biomechanics and computational models.

    Pathophysiology: added Blunted Load-Induced mTORC1 Signalling (cellular response to mechanical stimulus and TORC1 signaling, both DECREASED). It carries the candidate mechanosensors (costamere/integrin-FAK-TSC2-Rheb, DGKzeta-phosphatidic acid, filamin C-BAG3) from two reviews, and the age deficit from human biopsy studies (Fry 2011, Kumar 2009). It feeds Anabolic Resistance as the loading arm. No sensor gene is bound because the primary sensor is unsettled.

    Environmental: rebound the exposure from ECTO:6000002 exposure to exercise to the more specific ECTO:6000040 exposure to Resistance Training, with preferred_term 'regular resistance training'. Added PROTECTS_AGAINST links to mitochondrial dysfunction (Melov 2007, qualified by Robinson 2015, where endurance and combined training raised oxidative capacity), compensatory motor-unit remodelling (INDIRECT, lifelong-exercise reinnervation review) and the clinical endpoint (Casolo 2026, neural drive). The protein-balance link now cites mTORC1 and intensity dependence.

    Treatment: preferred_term changed to 'progressive resistance training'. NCIT:C154219 Resistance Training was considered and rejected because it is not under NCIT:C25218. Added effect-modifier evidence by age, sex, baseline function and individual response. The schema has no structured slot for effect modification, so this sits in the description and evidence items.

    Computational model: added the McColl/Clarke kinetic anabolic-resistance model (PMID:42464764) with typed divergences: feeding-only boundary, male-only population, small calibration set.

    Clinical trials: added NCT02582138 (SPRINTT), NCT04355299, NCT03752359, NCT01489930, NCT07513025 and NCT07821164. Added a KNOWLEDGE_GAP discussion on sex as an effect modifier.

    Validated with just validate, count-verified-snippets and validate-terms.

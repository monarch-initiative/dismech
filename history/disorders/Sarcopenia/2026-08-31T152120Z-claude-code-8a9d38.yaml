  summary: 'Create: Sarcopenia'
  details: |
    New Disease entry for sarcopenia, created in response to the knowledge-gap handoff in issue #6056 (Arnold et al., J Clin Invest 2026, PMID:42424105), which asked for an entry capturing NMJ transmission failure as a pathophysiology node, postsynaptic NaV1.4 loss as its mechanism, and ClC-1 inhibition as a therapeutic target. All three are implemented.

    ONTOLOGY BINDING - deliberate omission of disease_term. MONDO:0006516 (sarcopenia) is obsolete, retired with the reason "out of scope - MONDO:excludeBiologicalProcess. This term represent a natural aging process, and not a disease." There is no replacement term. NCIT does code Sarcopenia (NCIT:C186726) and Acute Sarcopenia (NCIT:C189016), but OAK ancestor traversal puts both under NCIT:C3367 (Finding), not NCIT:C2991 (Disease or Disorder), so they are unreachable from the NCITDiseaseOrFindingTerm dynamic enum and could not be used in mappings.ncit_mappings; they are recorded in prose instead. HPO likewise has no sarcopenia term, so the diagnostic triad is represented by component HP terms. The entry therefore omits disease_term and records ICD10CM:M62.84 under mappings.icd10cm_mappings, following the precedent set by Volumetric_Muscle_Loss. This is a substantive disagreement with MONDO's scope call rather than an oversight, is surfaced in the entry notes, and is worth an upstream MONDO ticket that this session did not file.

    DEEP RESEARCH. falcon was the requested provider but its account returned HTTP 402 (out of credits). Rather than substituting a provider by hand, the run was re-issued with --fallback, so the report records fell_back: true, requested_provider: falcon, and the provider_attempts trail itself. The report produced is research/Sarcopenia-deep-research-claude_code.md (48 citations, 30 web searches). The recipe did not emit validation sections despite the flags, so they were retro-fitted with `just validate-research-reference` and `just validate-research-terms`. Reference validation came back clean (37/37 resolved, 0 unresolved, 0 off topic). Term validation flagged MONDO:0006516 as obsolete, independently confirming the binding finding above, and flagged CL:0000188 as mislabelled in the report ("skeletal muscle fiber" where CL calls it "cell of skeletal muscle") - the entry uses CL:0008002 for skeletal muscle fiber instead.

    REPORT DEFECT FOUND. The report attributes to EWGSOP2 a definition of sarcopenia as "a condition characterized by loss of muscle mass and function occurring as a natural part of aging process". That sentence is not in PMID:30312372 and inverts the paper's actual position, which is that sarcopenia is a muscle disease rather than a normal ageing correlate. It was not used. Every snippet in this entry was taken from a locally cached reference rather than from the report body, and the report was treated as a lead throughout.

    CONTENT. 15 pathophysiology nodes wired as a causal chain rather than a category list, running from alpha motor neuron loss and NMJ transmission failure through mitochondrial dysfunction, inflammaging, satellite-cell exhaustion, anabolic hormone decline, anabolic resistance, myostatin/activin signalling, and ubiquitin-proteasome proteolysis to negative net protein balance, type II fiber atrophy, myosteatosis, and the clinical convergence node. Five causal edges carry their own evidence where a source makes the causal claim specifically; the rest are left uncited rather than papered over with a node's citation. Conformance is declared against the mitochondrial_dysfunction, inflammaging, stem_cell_exhaustion, and deregulated_nutrient_sensing modules. Two mechanistic_hypotheses: an EMERGING NMJ-excitability model and the CANONICAL multifactorial-convergence model. Also three subtypes, two prevalence records, seven phenotypes, three genetic entries, three environmental exposures each with influences_mechanisms and their own edge evidence, four treatments, two diagnostic definitions (EWGSOP2 and AWGS 2019), two animal models with modeled_mechanisms and readouts, five datasets, three differential diagnoses, and three discussions.

    The bimagrumab treatment records the mass-versus-function dissociation as a paired SUPPORT and REFUTE from the same trial rather than as one hedged item, since the study supports the mass claim and contradicts the strength claim.

    DATASETS. Five GEO accessions selected by manual relevance triage from `just discover-datasets` and all five verified with `just verify-datasets`. Rejections are recorded in the last dataset's notes: GSE279051 (cortical bone, not muscle), GSE276208 (sarcopenia as exposure driving tumorigenesis rather than as subject), and GSE304351/GSE304464/GSE315575 (sarcopenia named only in the summary). Per the dataset SOP these records carry publication and provenance notes but no evidence block.

    VALIDATION. `just validate` passes (schema, terms, references) with 78/78 snippets verified. `just validate-disorders` passes. check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles, check-term-cache-integrity and check-not4curation all pass; check-source-defect-claims reports nothing for this file. `just test-kb` passes in full (39,065 tests). check-snippet-grading initially failed on a real defect introduced here - one PMID:40678078 quote graded HUMAN_CLINICAL in one place and OTHER in two others - which was corrected to OTHER, the right grading for a review. Compliance is 83.8%.

    KNOWN GAPS, recorded in review_notes and in discussions. The genetic section is lead-quality: the ACTN3 R577X association is carried from the report without a verified primary source and deliberately carries no evidence item, tracked by an explicit knowledge-gap discussion. No biochemical/biomarker records despite GDF-15, IL-6, TNF-alpha, IGF-1 and myostatin being established candidates. No clinical_trials records. No comorbidity entries, despite sarcopenia being a documented convergence point for CKD, heart failure, COPD, cirrhosis and cancer. Sarcopenia is also a strong candidate for a kb/modules/ mechanism module in the disease-like-phenotypes family - Werner_Syndrome, Cushings_Syndrome and Ovarian_High-Grade_Serous_Carcinoma already reference it as a downstream convergence - but that family's convention expects both an HP and a MONDO identifier and sarcopenia has neither, so it was left out of scope.

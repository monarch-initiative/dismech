  summary: 'Address automated review on PR #10268 (trial phase, T2DM subtype, added
    sources, MONDO tracker provenance)'
  details: |
    Response to the automated review on monarch-initiative/dismech#10268. The review APPROVED with no blocking findings and four non-blocking suggestions; three are acted on here and one is confirmed as follow-up scope. Each suggestion was verified against the cited source before acting, not taken on the reviewer's word.

    FINDING 1 - clinical_trials phase. NOT_APPLICABLE asserts that a study does not follow FDA phase classification, which is a positive claim and almost certainly false for a randomised double-blind double-dummy drug trial. I fetched the registry record (just fetch-reference NCT06643780); it caches as a summary with no phase field, so the value could not be filled in for real. ClinicalTrialPhaseEnum has no UNKNOWN, so the phase slot is now omitted entirely, with the reasoning recorded in notes. status: UNKNOWN is a genuine enum value and is kept. The registry record is now cited as a second evidence item alongside the protocol paper.

    FINDING 2 - T2DM-related sarcopenia. Verified the reviewer's claim directly: PMID:38854688 states "Unlike sarcopenia, T2DM-related sarcopenia is characterized by a reduction in type I fibers, and it differs from disuse muscle atrophy as well." That inverts pathophysiology#Type II Myofiber Atrophy and Fiber-Type Shift, so it is a mechanistic divergence rather than an etiological label and is added as a fourth subtype with two evidence items. No pathophysiology nodes are curated for it; review_notes on the subtype says so and says a follow-up should either model the divergence or demote the subtype to a note under Secondary.

    FINDING 3 - genetic section lead-quality. No change, as the reviewer recommended. Already declared in review_notes and tracked by the sarcopenia_genetic_susceptibility_unverified discussion.

    FINDING 4 - uncited cached references. Two taken. PMID:41248895 carries the sentence "It has improved muscle mass in patients with sarcopenia and posthip fracture recovery, while only showing minimal improvements in mobility and strength.", verified present in the cache; it is a second, independent source for the bimagrumab mass-versus-function dissociation and extends it beyond the n=24 phase-1 study to sarcopenia patients and post-hip-fracture recovery. PMID:22111652 supports a new animal_models entry for naturally occurring sarcopenia in aged companion dogs and cats - a spontaneous rather than induced model, in a long-lived outbred species sharing the human environment, and the veterinary literature separates it from disease-driven cachexia in the same way this entry separates primary from secondary. Graded PARTIALLY_RECAPITULATES at LOW fidelity because the source reports lean body mass only, not the strength and performance measures that define human sarcopenia, and its principal subject is cachexia.

    MONDO TRACKER RESEARCH (prompted by a question from the user, not by the review). The obsoleted MONDO:0006516 records a term-tracker item, IAO:0000233 = monarch-initiative/mondo#6008. I read it: it is a bulk "review muscle tissue disorder branch" issue opened 2023-03-03 and closed 2023-06-28, labelled Branch Review / obsolete / on list, arising from a 2023-03-02 expert meeting. Sarcopenia is not discussed individually there - the per-term decisions live in monarch-initiative/mondo#5984 and an external spreadsheet - so there is no citable recorded rationale for this particular obsoletion beyond the comment on the term itself. Two searches of the MONDO tracker (for "sarcopenia" and for the CURIE) return only that one issue, so as of 2026-08-31 nobody appears to have disputed or revisited the decision. Recorded as a tracked_issues entry with role ontology_coverage_gap, and the disease-level notes now point at it. Still not filed upstream.

    PRE-EXISTING FAILURE RULED OUT, NOT THIS PR'S. just check-snippet-length reports 4 findings, all in kb/disorders/Hyperprolinemia_Type_2.yaml, which this branch does not touch. Established as a staleness artifact rather than a defect: the branch is 19 commits behind main, main rewrote that file (101 insertions, 97 deletions) including those snippets, and substituting main's version of that one file makes the check pass cleanly. CI evaluates the merge result, so it does not see this. No change made, and the branch was deliberately not synced - see below.

    BRANCH NOT SYNCED WITH MAIN, DELIBERATELY. 19 commits behind, no conflict (verified with git merge-tree --write-tree, clean tree, exit 0). Eleven files overlap, all cache CSVs plus references_cache/PMID_30312372.md, where main independently fetched the same EWGSOP2 reference; all six snippets this entry quotes from that PMID are present verbatim in main's copy, so nothing breaks on merge. Not synced because there is no conflict to resolve, main moved 19 commits in roughly three hours, and the repo's own pr-shepherd updates approved-behind branches.

    VALIDATION. just validate and just validate-disorders pass with 101/101 snippets verified (up from 95). check-entity-refs, check-duplicate-keys, check-snippet-grading, check-folded-hyphens, check-title-snippets, check-environmental-evidence and check-reference-titles all pass. check-snippet-length fails only on the unrelated pre-existing file described above.

  summary: Structure biomarker readout links for the three sarcopenia biochemical
    markers
  details: |
    Follow-up round to the therapeutic-pipeline pass. The three biochemical entries (IL-6, TNF-alpha, IGF-1) carried their pathograph mapping only as prose inside notes, so they contributed nothing to the graph and could not carry endpoint semantics. Added a BiomarkerReadout to each: IL-6 and TNF-alpha as READOUT_OF Chronic Low-Grade Inflammation, IGF-1 as READOUT_OF Declining Anabolic Hormone Signalling with direction NEGATIVE, since the linked node is a decline and higher IGF-1 tracks with less of it. Fetched PMID:38495887, a meta-analysis of 8,154 patients against 33,967 controls, which discriminates between the markers rather than endorsing all three: IL-6 is elevated with a significant odds-ratio signal, circulating TNF showed no significant difference, and the authors single TNF out as not usable. That is recorded as two REFUTE items on the TNF readout link rather than on the biomarker entry, because what fails is the claim that the analyte reports the node, not the claim that TNF-alpha participates in it; the TNF notes were rewritten to say so. endpoint_context is set only on IL-6, as MONITORING rather than DIAGNOSTIC, because the discriminating evidence is across age-related comorbidities generally and not a sarcopenia case-finding study. TNF-alpha and IGF-1 carry no endpoint_context, deliberately, as no use context is established for either. No regulatory_endpoint_refs: sarcopenia has no row in the FDA surrogate endpoint table and structurally cannot, since that table records endpoints that supported an approval and this disease has no approved therapy. One defect caught and fixed during this round: a reference_title written from memory rather than copied from the cache (PMID:38046952), which the reference validator rejected. Validated with just validate (156/156 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms. Note that biochemical.readouts[].target is not covered by check-causal-targets, so both targets were verified manually against the pathophysiology node names.

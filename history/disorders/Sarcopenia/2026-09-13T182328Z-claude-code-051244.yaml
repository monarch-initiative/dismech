  summary: Add sarcopenia therapeutic pipeline from NRDD 2026 review
  details: |
    Curated the therapeutic landscape of PMID:42706321 (Ancel, Le Moal, Wang & Blau, Nat Rev Drug Discov 2026) into the entry. Added 15 treatments covering the review's five strategy classes: mitochondrial/resilience agents (urolithin A, trigonelline, nicotinamide riboside, oleuropein), anabolic and autophagy agents (partial mTORC1 inhibition, 15-PGDH gerozyme inhibition, myostatin ligand neutralization, selective androgen receptor modulation), non-muscle systemic targets (JAK-STAT inhibition, apelin receptor agonism, VEGF signalling restoration, AT1 receptor blockade, BIO101), regenerative nutrition (nicotinamide plus pyridoxine), and the preventative case of muscle-sparing co-therapy during GLP1 receptor agonist weight loss. Added one pathophysiology node, Capillary Rarefaction and Impaired Muscle Perfusion, so the vascular treatments have a target; the entry previously had no vascular arm. Strengthened the existing bimagrumab treatment with the sarcopenia-specific phase 2 trial (PMID:33074327) including its negative functional primary endpoint. Added a KNOWLEDGE_GAP discussion on the mass-versus-strength endpoint dissociation, which recurs across bimagrumab, MK-0773 and landogrozumab. Every claim is cited to a primary paper fetched into references_cache in this session (28 new PMIDs); the review itself is cited only where it is the source of a landscape statement, and results that exist only as conference abstracts or company releases (MF-300 phase 1, COURAGE interim, STRIDES discontinuation, NAM/PN human RCT preprint) are described in notes rather than asserted as evidence. Validated with just validate (148/148 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-reference-titles, and the snippet-length/title/folded-hyphen gates.

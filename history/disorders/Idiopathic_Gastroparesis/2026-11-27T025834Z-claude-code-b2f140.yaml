  summary: 'Gene-family review: HMOX1'
  details: |
    The HMOX1 node (Loss of Heme Oxygenase-1 Cytoprotection and Oxidative Stress) named the gene with no molecular function. It now binds GO:0004392 heme oxygenase (decyclizing) activity as DECREASED, with a preferred term saying the loss follows from reduced expression: HMOX1 mRNA is decreased in idiopathic gastroparesis muscularis (PMID:29052298) and loss of HO-1 up-regulation raises reactive oxygen species in diabetic mice (PMID:18926825), both already cited on the node. HMOX1 has no genetic record here, which is correct.

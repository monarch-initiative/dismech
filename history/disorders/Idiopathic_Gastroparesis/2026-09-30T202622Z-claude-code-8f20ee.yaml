  summary: 'Create: Idiopathic Gastroparesis'
  details: |
    De novo curation of idiopathic gastroparesis (MONDO:0034150), replacing the skeleton and the stub. No other gastroparesis entry exists in kb/disorders; diabetic gastroparesis is left out of scope. Deep research: OpenScientist report research/Idiopathic_Gastroparesis-deep-research-openscientist.md (32/32 references resolved, 0 off topic, 24 on topic, 8 undecided; no needs_review key and no trigger met). Its term validation flagged UBERON:0006909 as mislabelled (lumen of digestive tract, not muscularis); that CURIE was not used and UBERON:0008856 stomach muscularis externa was looked up instead. just preflight-dr returned SKIP because MONDO records no causal gene for this term; identity was checked by hand: MONDO:0034150 carries no OMIM xref (Orphanet:558411, GARD, UMLS only) and the report is about idiopathic gastroparesis throughout. The report's statement that PMID:25041465 found CD206+ counts correlating with ICC counts is not true for the idiopathic group; the entry cites that paper as REFUTE on the macrophage-to-ICC edge. The report's SCN5A lead comes from an IBS cohort (PMID:24613995) and was not curated. Additional references beyond the report were found by PubMed search (GpCRC biopsy, transcriptome and proteome studies; NORIG, tradipitant phase 2 and 3, botulinum toxin, GES and G-POEM trials; post-viral case series). Mechanistic edges from the macrophage/heme oxygenase-1/oxidative-stress axis are cited to diabetic mouse models, grouped under an EMERGING hypothesis and a HUMAN_MODEL_MISMATCH discussion; human IG studies that do not reproduce parts of the chain are recorded as REFUTE items. Olmsted County prevalence and incidence are all-etiology gastroparesis rates with measure_type and rate_denominator set. No module conformance: no gastrointestinal motility, ICC or enteric neuromuscular module exists. GeneReviews check: NO_CHAPTER for GeneReviews and StatPearls. Validation: just validate, validate-terms, count-verified-snippets (85/85), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, snippet gates, validate-disorders all pass. Four phenotypes (abdominal pain, bloating, anxiety, depression) are intentionally left without a causal in-edge because no source ties them to a node.

    Review round 1 (PR 13290): added reference_title to all 90 evidence items, copied by script from the title frontmatter of each references_cache file. On the Muscularis Macrophage Phenotype Shift to Interstitial Cell of Cajal Loss and Injury edge, the PMID:29501441 conditioned-medium snippet was regraded from MODEL_ORGANISM to IN_VITRO because it is an explant result, a separate MODEL_ORGANISM item now quotes the in vivo result (11 of 15 diabetic Csf1op/op mice given CSF1 developed delayed emptying and damaged ICC), and the edge description was reworded to state those two results instead of claiming that mice lacking macrophages are protected. PMID:40976635 (AGA guideline) evidence was added for the recommendations against domperidone and nortriptyline as first-line therapies and for reserving gastric electrical stimulation and G-POEM for refractory patients. The three PMID:24005344 items (a systematic review and meta-regression of human prokinetic trials) were regraded from OTHER to HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS. After these changes validate, validate-terms, count-verified-snippets (90/90), check-snippet-grading, check-reference-titles, check-title-snippets, check-snippet-length, validate-disorders and check_gene_activity_grounding all pass.

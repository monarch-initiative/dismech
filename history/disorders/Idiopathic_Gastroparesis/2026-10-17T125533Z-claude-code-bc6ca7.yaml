  summary: Bind the solid-phase gastric emptying scintigraphy study code
  details: |
    LOINC Diagnostics tranche G, batch 26 (functional and provocative tests with diagnostic thresholds). Two sources were used and each answered a different question. Observation and panel codes were enumerated against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin; that export contains no LP or LG Part rows at all, so every Part question was put separately to the Monarch KG, and each KG query was paginated to its stated total rather than read off a first page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 549 snippets and 605 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:81602-5 (NM stomach views for gastric emptying, solid phase, with radionuclide PO) to the four-hour solid-meal scintigraphy row. The radionuclide-unspecified variant was chosen because the row specifies a solid meal but names no radiopharmaceutical; the technetium-99m sulphur colloid code LOINC:24997-9 would have asserted one. LOINC codes this test as a study rather than a number: its four solid- and unspecified-phase gastric emptying codes are nuclear medicine imaging studies whose result is a report, and no code in the release expresses gastric retention as a percentage, so the four-hour retention thresholds the test is read against have nothing to key an interval to. The KG, asked separately because the export has no Part rows, has no Part for gastric emptying and no record of any kind for gastric retention. The breath-test alternative the row mentions was declined because the release's only gastric emptying breath codes fix the substrate as 100 mg of sodium octanoate or sodium acetate and the row says a mixed meal without naming one.

  summary: 'Create: Pelger-Huet anomaly (MONDO:0008214, LBR)'
  details: |
    De-novo curation of MONDO:0008214 as a DISEASE entry, curated as an LBR haploinsufficiency: heterozygous loss-of-function allele, reduced lamin B receptor protein, failure of granulocyte nuclear lobulation. The biallelic state is a has_subtypes row rather than a separate entry, since it is the same lesion at a different dose. Before pushing, the full reference cache produced by the deep-research run was read rather than only the nine references the first draft used - a pattern flagged by review on sibling PR #11619. That changed the entry substantively: PMID:42622427 reports a homozygous proband with ovoid nuclei and no clinical symptoms, now curated as REFUTE against treating developmental delay, epilepsy and skeletal abnormalities as obligate features of the biallelic state; PMID:17403717 shows Dhcr14 disruption does not phenocopy the Lbr null and no sterol abnormalities are detectable, curated as REFUTE against the cholesterol-synthesis account and turning the first knowledge gap from a two-position into a three-position dispute; and the second knowledge gap, on why carriers are asymptomatic, turned out to have two directly contradictory published answers (PMID:18621876 finds bacterial killing intact, PMID:18550262 reports loss of critical functional responses), both now curated. Two mouse models added (ic/ic and Lbr GT/GT) with typed POPULATION_MISMATCH divergences marked INVALIDATING because both are homozygous against a heterozygous human trait in a dose-dependent phenotype. A veterinary differential added because canine hyposegmentation maps to LMBR1L rather than LBR (PMID:37347778). Validated: just validate (53/53 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass; whole-KB baselined checks (folded-hyphens, snippet-length, title-snippets, snippet-grading) show no new findings.

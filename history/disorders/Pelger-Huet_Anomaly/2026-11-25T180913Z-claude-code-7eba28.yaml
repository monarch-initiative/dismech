  summary: 'Gene-family review: LBR'
  details: |
    The LBR loss-of-function allele node carried the gene with no molecular function. Pelger-Huet anomaly tracks the dose of LBR protein at the inner nuclear membrane, so the activity the allele reduces is the structural one: added heterochromatin-nuclear membrane anchor activity (GO:0062239), DECREASED, supported by mouse Lbr mutants showing an LBR-dependent tether of peripheral heterochromatin to the nuclear envelope (PMID:23374351). The sterol reductase arm stays on its separate hypothetical node.

  summary: 'Review round 1: correct a false cache claim, regrade an in-vitro source,
    close the content gaps'
  details: |
    Round 1 of review on PR #11630. All five IMPORTANT findings and all five suggestions, in one push. Snippets 53 -> 67; six new references fetched and cited.

    Finding 1, a false claim about the reference cache. An explanation said the cached PMID:18550262 abstract truncates before the results, so the disagreement rested on the paper's title. It does not: the cache is full_text_html and carries the whole RESULTS paragraph. The snippet is now the reported result (abnormal chemotaxis) rather than the framing sentence, and the truncation clause is deleted. Recording this plainly: it was a false statement about repository state sitting in curated prose, which is the class check-source-defect-claims exists for and which that check did not fire on.

    Finding 2, evidence_source. The same item was MODEL_ORGANISM. Every result in that paper comes from an EML progenitor line derived from an ic/ic mouse and induced to mature in culture; there is no in vivo arm, so under the CLAUDE.md rules it is IN_VITRO. Regraded, and directness moved DIRECT since the snippet now asserts the claim.

    The regrade propagates. The lobulation knowledge gap framed the two-study disagreement as allele-and-assay differences with nothing to adjudicate it. The larger asymmetry is that one study measures granulocytes from a living animal and the other a cultured line, so a candidate adjudication does exist: repeat the chemotaxis and respiratory-burst assays on primary granulocytes. The rationale now says so instead of saying nothing adjudicates it.

    Finding 3, skeletal abnormalities. Added as a Homozygous PHA phenotype from the same clause of the same PMID:12118250 sentence that already supplied the developmental delay and epilepsy rows. Bound at HP:0000924 (system level) because the source says only 'skeletal abnormalities'; binding narrower would assert a granularity the sentence does not carry.

    Finding 4, the human LBR-independent causes. Two differentials added: SOPH syndrome (NBAS G5741A founder variant, with the 13 per 1000 Yakut carrier frequency curated as its own evidence item because ancestry is diagnostically useful here), and TMEM147-related syndromic pseudo-PHA. The second is mechanistically the closest differential in the entry: TMEM147 anchors LBR at the inner nuclear membrane, so losing it lowers LBR where it acts, which is why roughly 20 per cent of neutrophils are affected rather than nearly all.

    Finding 5, the diagnostic hazard. Curated as a diagnosis entry, 'Spurious Band-Form Count on the Automated Differential', from PMID:26634137. It is deliberately not clinical_burden: nothing happens to the patient because of their neutrophils, only because of what is inferred from them. The notes rationale for the absent clinical_burden section previously read as covering both this and infection susceptibility while only arguing the latter; it now separates them explicitly.

    Suggestion 6, the dose-response experiment. The lbr_domain_attribution rationale asserted 'what the dose-response experiment is usually taken to show' with no such reference anywhere in the entry. PMID:27684937 supplies it (65 per cent of segmentation variance explained by wild-type allele count across 26 subjects), curated as two items because the magnitude and the non-additive hysteresis-like shape are separate claims. The rationale now also says what that result does not show: dose-dependence on LBR quantity is silent on which domain does the work.

    Suggestion 7, the domain-swap rescue. PMID:22140257 reports that expressing the C-terminal sterol reductase domain alone rescues lobulation, growth arrest, lipid production and the respiratory burst in ic/ic cells. This favours the metabolic reading and is the one experiment in the gap that separates the two domains rather than arguing from mutation location. Graded INDIRECT and hedged in the rationale on two grounds: a sufficient rescue fragment is not the domain whose loss causes human disease, and it is the same cultured line whose in-vitro status finding 2 established.

    Suggestion 8, C/EBPepsilon. Added to the Failure of Granulocyte Nuclear Lobulation node as description plus two evidence items rather than as a separate upstream node, since C/EBPepsilon-driven LBR upregulation is normal physiology and a pathograph node would misrepresent it. It answers the question the node otherwise leaves open: why a ubiquitous nuclear-envelope protein produces a granulocyte-restricted phenotype.

    Suggestion 9, prevalence. A second record carries the published roughly 1 in 6000 (16.7 per 100,000, BAND_1_5_PER_10000) alongside the existing RARE/UNKNOWN record rather than replacing it, with its own notes saying the figure is background in a case report and rests on the same ascertainment the first record's caveat is about. The source calls it an incidence while describing a lifelong congenital trait; it is curated as a point prevalence and the wording is preserved in the quote rather than corrected.

    Suggestion 10, the heterozygous-studies sentence. Added to the lobulation gap from the PMID:18550262 cache this PR already ships. It sharpens the gap: the human functional literature is entirely heterozygous, and the paper names why it cannot easily be otherwise.

    Validation: schema clean, terms clean, 67/67 snippets verified, and entity refs, duplicate keys, causal targets, enum values and qualifier terms all clean.

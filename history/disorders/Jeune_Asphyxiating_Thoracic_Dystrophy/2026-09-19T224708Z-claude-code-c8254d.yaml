  summary: Correct SRTD numbering for the IFT80 and IFT-A subtypes
  details: |
    Review round on PR #12135. Corrected the IFT80-associated subtype's SRTD number from SRTD1 to SRTD2 in both display_name and description: MONDO:0012644 (the term this PR binds) carries synonyms SRTD2, ATD2 and 'IFT80 Jeune syndrome' with no SRTD1, and ClinGen's Skeletal Disorders GCEP pairs IFT80 with 'asphyxiating thoracic dystrophy 2' at Definitive. Also corrected the IFT-A subtype description, which read 'SRTD7 (IFT140)': MONDO's own definition of MONDO:0009964 (SRTD9) states the disease has its material basis in IFT140 mutation, and ClinGen pairs WDR35 - not IFT140 - with short-rib thoracic dysplasia 7 (MONDO:0013569) at Definitive. SRTD5 (WDR19) was already correct and is unchanged. No ontology bindings changed; both corrections are to free-text prose that contradicted the bound terms.

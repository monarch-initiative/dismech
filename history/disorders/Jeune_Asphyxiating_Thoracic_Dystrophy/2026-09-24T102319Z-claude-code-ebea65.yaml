  summary: Enumerate gene-defined SRTD subtypes and wire every gene to its protein
    complex
  details: |
    Gene-defined subtype enumeration for issue #12232 (genetics-gap series-025).

    Anchor check: MONDO:0018770 "Jeune syndrome" is the correct anchor. It carries
    "short-rib thoracic dysplasia" as an exact synonym, and the MONDO SRTD numbered
    series resolves under it, so the SRTD terms in the job checklist are genuinely
    subtypes of this entry rather than artefacts of an over-broad anchor.

    Curated: has_subtypes grew from 7 rows (2 with a bound MONDO term, 0 with genes)
    to 18 rows (16 with a bound MONDO term, 18 with bound genes and exact-quote
    evidence). All 16 checklist MONDO terms are now bound: SRTD2 IFT80, SRTD3
    DYNC2H1, SRTD4 TTC21B, SRTD5 WDR19, SRTD7 WDR35, SRTD8 DYNC2I1, SRTD10 IFT172,
    SRTD11 DYNC2I2, SRTD13 CEP120, SRTD14 KIAA0586, SRTD15 DYNC2LI1, SRTD17
    DYNLT2B, SRTD18 IFT43, SRTD19 IFT81, SRTD22 FGF4, and MONDO:0100583 GRK2.

    genetic: grew from 8 records to 18. Four pre-existing records carried no
    gene_term at all and were therefore invisible to any gene query: DYNC2H1, IFT80,
    IFT140 and WDR19. The IFT140 record also carried no evidence; it now cites
    PMID:23418020. Every record now has a gene_term, relationship_type CAUSATIVE, a
    subtype foreign key that resolves, and at least one verified snippet.

    Pathograph: no gene reached any pathophysiology node before this pass. All 18
    genes are now bound as genes: descriptors, organized by protein complex rather
    than as a flat list, because the complex a gene belongs to is what determines
    which transport step fails. The IFT-B node was narrowed to the anterograde
    particle (IFT80, IFT172, IFT74, IFT81) and the dynein-2 node to the motor
    (DYNC2H1, DYNC2I1, DYNC2I2, DYNC2LI1, DYNLT2B). Four nodes were added: IFT-A
    Complex Retrograde Transport Failure (IFT140, WDR19, WDR35, IFT43, TTC21B),
    Centriolar Assembly and Ciliogenesis Failure (CEP120, KIAA0586), Ciliary
    Hedgehog and Wnt Signal Transduction Failure (GRK2), and FGF4-Dependent Thoracic
    Skeletal Growth Failure (FGF4).

    Gene symbol renames were read from live HGNC lookups, not from memory:
    hgnc:28296 is DYNC2I2 (previous symbol WDR34), hgnc:21862 is DYNC2I1 (previous
    symbol WDR60), hgnc:28482 is DYNLT2B (previous symbol TCTEX1D2). The entry
    previously bound preferred_term "WDR34" to hgnc:28296, which
    list-gene-term-mismatches reported as an advisory symbol-not-named finding; the
    records now name both the current and the legacy symbol, and all 81 gene
    bindings across both files in this PR are clean.

    Two subtypes are flagged as weakly replicated in their own descriptions rather
    than presented as settled: GRK2 rests on a single 2024 case, and FGF4 on one
    2025 report whose authors describe the association as newly identified. FGF4 is
    also the one non-ciliary gene here; its node binds an anatomical site the source
    states and deliberately binds no signaling process, because no pathway assay was
    reported in those patients.

    SRTD9 (IFT140, MONDO:0009964) is deliberately NOT bound here. It is already
    curated as a has_subtypes row of IFT140-related_Recessive_Ciliopathy, so binding
    it twice would duplicate that curation. IFT140 still gets a row and a genetic
    record so the gene reaches this entry's pathograph, and the reason is recorded
    in both the row description and the entry description.

    Stubs deleted as now curated: Short-rib_Thoracic_Dysplasia_13, _15, _19.

    Validation: just validate (schema, terms, references) passes with all snippets
    verified against cached references; validate-terms, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values
    and list-gene-term-mismatches all clean. One duplicate cellular_components key
    was introduced during editing and caught by check-duplicate-keys; the two blocks
    were merged rather than one deleted.

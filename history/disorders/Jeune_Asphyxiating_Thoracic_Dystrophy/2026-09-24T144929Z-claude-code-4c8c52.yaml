  summary: 'Review round 1: re-cite the IFT140 subtype row and bind directional IFT
    GO terms'
  details: |
    Review round 1 on PR #12669, addressing the ai4c-reviewer CHANGES_REQUESTED verdict plus three of its optional suggestions.

    Blocking item: the IFT140-associated subtype row cited PMID:22791528, a review whose abstract lists IFT80, IFT122, IFT43, WDR35, WDR19 and TTC21B and never mentions IFT140, so nothing supported the row's own claim. Replaced it with the two PMID:23418020 quotes that do: the identification of IFT140 mutations in five JATD and two Mainzer-Saldino families, and the renal/retinal burden. PMID:22791528 remains cited by Short-Rib_Polydactyly_Syndrome, so its cache file is untouched.

    Suggestion taken: the anterograde node. The node formerly named "Intraflagellar Transport Dysfunction" now carries only IFT-B subunits (IFT80, IFT172, IFT74, IFT81), so it is renamed "IFT-B Complex Anterograde Transport Failure" and rebound from the parent GO:0042073 intraciliary transport to GO:0035720 intraciliary anterograde transport with modifier DECREASED. Nothing in the file targeted the old name (its only conforms_to is a cross-file module anchor), and check-causal-targets is clean. The directionality claim was previously prose only, so it is now sourced: PMID:28318499 states that the IFT-B particle "in association with kinesin-2 motors drives anterograde transport from the ciliary base to the tip", quoted as BACKGROUND.

    Suggestion taken: the dynein-2 node's preferred_term was "Retrograde Intraflagellar Transport" over GO:0035735 intraciliary transport involved in cilium assembly, which is not a directional term. Rebound to GO:0035721 intraciliary retrograde transport with modifier DECREASED, matching the IFT-A node. Three of that node's existing snippets state retrograde explicitly.

    Suggestion taken: the FGF4 subtype description said FGF4 is a growth factor "rather than a ciliary transport component" unlike every other subtype, which is untrue of GRK2 and of the centriolar genes. Reworded to "a fibroblast growth factor rather than a component or regulator of the cilium, so this form is not an IFT, dynein, centriolar or ciliary-signalling lesion". HGNC gives the approved name of hgnc:3682 as fibroblast growth factor 4.

    Suggestion taken: the DYNC2I2 genetic note called the product "dynein-2 intermediate chain 3". HGNC gives hgnc:28296 the approved symbol DYNC2I2, previous symbol WDR34, and the name "dynein 2 intermediate chain 2"; the note now records the rename and the approved name.

    Suggestion taken: the WDR19 genetic record's only citation was a generic prenatal-series sentence about the mutation spectrum. Added the three PMID:22019273 quotes that carry the record's own claims - the Dutch Jeune family, the Norwegian Sensenbrenner family, and the Moroccan isolated-nephronophthisis family - and corrected the note from "cranioectodermal dysplasia" to "Sensenbrenner (cranioectodermal dysplasia) syndrome and isolated nephronophthisis", which is what the source states. The prenatal series is kept as corroboration with its explanation narrowed.

    One self-caught error worth recording: the reference_title on the new PMID:23456818 evidence item was first written from memory as "Mutations in the cytoplasmic dynein 2 heavy chain gene, DYNC2H1, cause short-rib polydactyly syndrome..." and is in fact "Exome sequencing identifies DYNC2H1 mutations as a common cause of asphyxiating thoracic dystrophy (Jeune syndrome) without major polydactyly, renal or retinal involvement." Corrected by copying the cache frontmatter before commit.

    Validation: validate, validate-terms, count-verified-snippets (226/226 over both entries), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches (0 findings), check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-case-collisions, check-coarse-phenotypes, check-genereviews (NO_CHAPTER, unchanged), validate-disorders. Three references_cache files that just validate upgraded incidentally (PMID_22019273, PMID_24459070, PMID_38856159) were reverted and snippets re-verified afterwards.

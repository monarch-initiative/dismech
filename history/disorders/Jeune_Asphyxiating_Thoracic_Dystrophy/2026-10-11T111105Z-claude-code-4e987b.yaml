  summary: 'Ground gene activity: bind sourced MFs, baseline structural nodes'
  details: |
    Merged current main (cleared the generated term-cache conflict). Bound GO:0008569 minus-end-directed microtubule motor activity on Dynein Motor Complex Deficiency, at the level of the dynein-2 complex, sourced to PMID:23456818 (DYNC2H1 is the central ATPase subunit of the minus-end-directed IFT dynein-2 motor). Bound GO:0008083 growth factor activity on the FGF4 node, sourced to the FGF/FGFR background sentence in PMID:40259859. No modifier on either: no cited source measures the activity in patient material, and PMID:40259859 states the FGF4 variants' functional effect is untested. The IFT-A, IFT-B and centriolar-assembly nodes and GRK2 were added to tests/gene_activity_grounding_baseline.txt: the IFT and centriolar subunits are structural components with no single molecular function, and GRK2's kinase activity is not stated by its only cited source (PMID:38585547), so binding it awaits a citable source.

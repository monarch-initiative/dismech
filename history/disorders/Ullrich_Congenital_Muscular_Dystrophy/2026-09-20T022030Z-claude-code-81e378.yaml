  details: |
    Genetics pass for the d2g wiring campaign (issue #12207, epic #12189).

    Research first: the GeneReviews baseline for this disease is the chapter
    Collagen VI-Related Dystrophies (PMID:20301676), which just check-genereviews
    does not match by title because the entry is named for Ullrich CMD rather than
    for the collagen VI group; it was fetched and read for this pass. ClinGen
    classifies COL6A1, COL6A2 and COL6A3 against collagen 6-related myopathy
    (MONDO:0100225) as Definitive under both dominant and recessive inheritance.
    Orphanet ORPHA:75840 and the primary literature already cited were re-read. The
    four causal genes were already present and already wired to the pathograph.

    Changes:
    - Bound the defining gene on each has_subtypes row: UCMD1A to COL6A1
      (hgnc:2211), UCMD1B to COL6A2 (hgnc:2212), UCMD1C to COL6A3 (hgnc:2213),
      UCMD2 to COL12A1 (hgnc:2188), matching MONDO's RO:0004003 assertion for each
      child class.
    - Linked each genetic entry to its subtype row via the subtype slot, so the
      gene-to-subtype pair is machine-readable rather than only stated in prose.
    - Added the recurrent deep-intronic COL6A1 c.930+189C>T intron 11 variant as a
      variants record on the COL6A1 entry, with the dominantly acting in-frame
      pseudoexon mechanism, the 44-patient international cohort, and the
      consistently severe UCMD phenotype (PMID:40177858). This closes a real
      genetics gap: the variant is invisible to coding-only sequencing, so an
      entry that describes only coding mechanisms understates how COL6A1 disease
      is found.
    - Added PMID:40177858 to the references section, which was otherwise complete.
    - Tagged the GeneReviews chapter. just check-genereviews reported NO_CHAPTER
      for this entry because the chapter is filed under the collagen VI group name
      rather than the Ullrich name, so a title match cannot find it. The chapter is
      now a tagged reference and the check reports TAGGED by identity.
    - Took two genetics facts from that chapter that the entry did not carry:
      UCMD is typically caused by a de novo autosomal dominant variant in one of
      the three collagen VI alpha-chain genes, and parental somatic with
      concomitant germline mosaicism is not uncommon in the autosomal dominant
      collagen VI dystrophies, which qualifies recurrence counselling for
      apparently de novo disease. Both are on the autosomal dominant
      inheritance block.

    MONDO reconciliation: MONDO:0009681 COL6A1, MONDO:0958235 COL6A2 and
    MONDO:0958236 COL6A3 are all present and now bound on their subtype rows.
    COL12A1 (UCMD2, MONDO:0014654) is curated here beyond MONDO's list for this
    entry; the UCMD2 row already cross-references the fuller COL12A1 curation in
    kb/disorders/Myopathic_Ehlers-Danlos_Syndrome.yaml.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (88/88), just list-gene-term-mismatches, and the offline gates all pass.

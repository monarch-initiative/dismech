  details: |
    Genetics pass for issue #12199 (epic #12189, d2g wiring-010).

    CDH3 (hgnc:1762) was already curated as the sole causative gene, but reached no
    pathophysiology node: genetic[].mechanism_outlink scored 0/1.

    Changes:
    - Bound CDH3 as a `genes:` descriptor on "Loss of P-Cadherin-Mediated Cell-Cell
      Adhesion" and added a `genetic_context` block recording biallelic germline
      loss of function.
    - Added `genes:` to both `has_subtypes` rows and `relationship_type: CAUSATIVE`
      to the `genetic:` entry.
    - Corrected an unsourced figure in the gene notes: it read "Over 35 pathogenic
      variants have been reported", where the cited source (PMID:33837674) says
      35 variants in HGMD Professional as of January 2020. Rewrote to match and
      added an evidence item carrying that sentence as a snippet.

    Measured effect: genetic[].mechanism_outlink 0/1 -> 1/1.

    Lump/split note on EEM: MONDO:0009155 (EEM syndrome) is the MONDO term the gap
    list records for CDH3 here. It was already modelled as a `has_subtypes` row of
    this entry rather than as a separate entry, with the row description and its
    evidence (PMID:35038959) recording that HJMD and EEM are two presentations of
    CDH3-related disease. That decision was left as it stands; the only change was to
    bind CDH3 on the row.

    No new references were needed.

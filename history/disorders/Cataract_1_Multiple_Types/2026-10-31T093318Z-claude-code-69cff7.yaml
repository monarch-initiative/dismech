  summary: 'Create: Cataract_1_Multiple_Types'
  details: |
    New entry for GJA8 (connexin 50) cataract, MONDO:0007285, from claim issue 16152. Lump/split decision: one Disease entry covering autosomal dominant missense cataract with or without microcornea, rare recessive frameshift cataract, and the allelic severe phenotypes (microphthalmia, sclerocornea, aphakia, acorea), recorded as three has_subtypes rows, because MONDO has no child terms under MONDO:0007285 and the severe and isolated-cataract alleles co-segregate in the same families. Name kept as the MONDO numbered-series label to match the sibling Cataract_N_Multiple_Types entries; no gene-related name is established in MONDO synonyms or GeneReviews. Deep research: one OpenScientist report (research/Cataract_1_Multiple_Types-deep-research-openscientist.md); 24/24 citations resolved, 12/12 quotes valid; needs_review set by term-label mismatches only. just preflight-dr returned WARN because the report writes HGNC:4302 beside GJA8 (the correct identifier, hgnc:4281, was looked up in HGNC REST and validated by just validate-terms). The report was used as leads only; every claim was checked against references fetched with just fetch-reference. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). No ClinGen gene-disease validity record for GJA8 was found in references_cache or cache/clingen/gene_validity.csv, so gene_disease_validity is left absent. PMID:14627691 was cached with no quotable text and is not cited. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-enum-values, check-logical-rules and validate-disorders.

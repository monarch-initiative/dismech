  details: |
    Replaced the PMID:38667036 snippet on the PBP transpeptidase to Acquired Penicillin Resistance edge: the old sentence was about resistance to the alternatives to penicillin (macrolides, lincosamides), so it did not support PBP remodeling. The new quote states that high-level penicillin resistance in invasive pneumococci is caused by mutations in penicillin-binding protein genes. Marked the two PMID:22203377 items added in this PR (colonization to PBP edge and the beta-lactam target_mechanisms link) directness INDIRECT, because the review is mostly about E. coli. Added PMID:38667036 evidence that childhood conjugate vaccination decreased pneumococcal colonization frequency to the vaccine link, which claims reduced nasopharyngeal carriage. Validated with just validate, count-verified-snippets (24/24) and check-snippet-grading.

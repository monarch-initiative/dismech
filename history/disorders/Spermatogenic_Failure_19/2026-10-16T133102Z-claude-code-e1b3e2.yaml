  summary: 'Create: Spermatogenic Failure 19 (CFAP43)'
  details: |
    New entry for SPGF19 (MONDO:0054723, CFAP43). Deep research run with the claude_code provider (research/Spermatogenic_Failure_19-deep-research-claude_code.md); just preflight-dr returned WARN because the paralog CFAP44 is mentioned, which is expected for this gene pair, and the report was used only for leads. Primary sources fetched with just fetch-reference: Tang 2017, Coutton 2018, Sha 2018/2019, Wu 2019, the Pakistani, Palestinian (Awad 2025) and 2023/2026 Chinese families, the ciliate T/TH structural papers, the mouse IMT, airway and hydrocephalus papers, the Muronova 2025 mouse ICSI study, and the ClinGen CGGV records for SPGF19 (Definitive), PCD (Limited) and NPH (Disputed). Judgement calls: dynein complex binding (GO:0070840) bound as the molecular function, inferred from the ciliate T/TH complex; respiratory phenotypes recorded at VERY_RARE frequency from the single Palestinian family with SUPPORT and REFUTE evidence and an EMERGING motile-cilia hypothesis; missense alleles given a separate node and an EMERGING severity hypothesis because one compound-heterozygous missense patient was milder but a homozygous missense family was severe; monoallelic NPH and post-transplant respiratory reports kept out of the entry and described in notes. ClinGen named only Tang 2017 among its counted papers, so the other two counted publications could not be identified. No GeneReviews chapter. Validated with just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs, check-causal-targets, check-duplicate-keys, snippet/title gates, gene-activity grounding and validate-disorders.

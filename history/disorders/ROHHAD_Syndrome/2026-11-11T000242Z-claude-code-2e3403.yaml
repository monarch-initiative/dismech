  summary: 'Create: ROHHAD Syndrome (MONDO:0017408), with the cause written as two
    competing hypotheses'
  details: |
    New entry for ROHHAD (rapid-onset obesity with hypothalamic dysfunction, hypoventilation and autonomic dysregulation) on MONDO:0017408. Until now the syndrome was curated only as a differential diagnosis in the Congenital_Central_Hypoventilation_Syndrome entry. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only. Closes the claim issue 15845; part of the neuroblastoma-related series (issue 15822), because a neural crest tumour is reported in about half of the patients.

    Sources. 44 papers were read and 33 are cited, 31 of them new to the reference cache. PMID:17606542 and PMID:32958024 were already cached and are quoted in the ROHHAD row of the Congenital_Central_Hypoventilation_Syndrome entry; their sentences keep the grading used there. The sources are case reports, small series and two systematic reviews of published cases, and the entry says in its notes that every figure carries the uncertainty of small numbers.

    Shape. The cause is unknown, so the mechanism is not written as one chain. Five nodes: Neural Crest Tumour, Anti-Neural Autoimmunity, Hypothalamic Dysfunction, Impaired Central Control of Breathing and Autonomic Dysregulation. Two mechanistic hypotheses: paraneoplastic_autoimmune (EMERGING), whose two edges run from the tumour to the autoimmunity and from there to the hypothalamic dysfunction, both typed INDIRECT_UNKNOWN_INTERMEDIATES; and monogenic_germline (ALTERNATIVE), which has no edge because no gene is known and carries the negative candidate-gene, exome and genome studies and the discordant monozygotic twins as REFUTE items. Twenty phenotypes, 17 with an incoming causal edge; obstructive sleep apnoea, behavioural change and seizures have none, because no source read says what produces them. Five diagnosis rows, four differential diagnoses bound to the MONDO terms of their own entries (congenital central hypoventilation syndrome, Prader-Willi syndrome, HIDEA syndrome, Smith-Magenis syndrome), four treatments, four progression phases, one prevalence record (cases in the literature), two epidemiology rows and two KNOWLEDGE_GAP discussions.

    Decisions a reader may want to check. The tumour proportion is given as the systematic review's figure, 56 per cent. Growth hormone deficiency is bound to HP:0034323 (Reduced circulating growth hormone concentration), whose synonyms include "Growth hormone deficiency" (OLS, 10 November 2026), and not to HP:0000824, which names the result of a stimulation test. ZSCAN1 is not bound as a gene on any node: it is the target of an antibody, not a causal gene. Two statements about ZSCAN1 in rodents that do not agree (PMID:35466441 and PMID:38339072) are both quoted in a discussion and neither is preferred. Treatment failures are recorded as REFUTE items on the immunotherapy row and on the immune hypothesis. Recommendation and criteria sentences are graded evidence_source OTHER. There is no genetic section, because no causal gene is known. just check-genereviews reports no GeneReviews chapter for the syndrome.

    After review. The reviewer of the pull request suggested a mechanism link for setmelanotide, and onset and frequency values where a source gives them. Setmelanotide now has a target_mechanisms link to Hypothalamic Dysfunction; the authors' inference from one patient sits on the link as INDIRECT evidence. Onset is set on two phenotypes: CHILDHOOD on Rapid-Onset Obesity (medians of 3 and 3.5 years in two series; a third gives a mean of 5.1 years, just above the category) and JUVENILE on Central Hypoventilation (medians of 6.2, 5.33 and 7.2 years). A frequency band is set only where every count found puts the feature in one band: Hyperprolactinemia VERY_FREQUENT (27 of the 28 individually reported patients with a prolactin result in the 2018 systematic review, PMID:30584530, and every patient tested in two smaller series), Behavioural Change FREQUENT (60 per cent of the review's 48 individually reported patients, 36 per cent of its 110 patients from case series, five of 10 in one series) and Precocious Puberty OCCASIONAL (15 per cent of the 48). No band is set where the counts disagree, and the two cardinal features say so in notes: rapid obesity was counted in 83 per cent of the 48 and 65 per cent of the 110, and hypoventilation in 75 and 46 per cent, in a category that includes obstructive sleep apnoea, against all five children followed up in a sleep-study series. The other features either have counts that fall in different bands (for example growth hormone deficiency, 25 per cent of the 48 against four of six in an endocrine series) or have none. The counts come from the full text of the 2018 systematic review, which was already cached and cited. The re-review noted that one quoted sentence of that review gives a percentage without its denominator. The figures for the review's individually reported patients are therefore quoted from its Table 3, which states the denominator (48) and a count for each finding: rapid obesity 40, hypoventilation 36, obstructive sleep apnoea 21, central precocious puberty 7, behavioural disorders 29. Fifteen evidence items were added over the two rounds.

    Validation: just validate, validate-terms and validate-disorders pass; 213 of 213 snippets verify against the cached references; the whole-repo gates, the extra gates (name collisions, shared disease terms, knowledge-gap targets, cache order and integrity, welded headings, compliance-connectivity) and the kb test lane were run locally and pass. Term validation added cache rows for one new NCIT mapping term, NCIT:C121944.

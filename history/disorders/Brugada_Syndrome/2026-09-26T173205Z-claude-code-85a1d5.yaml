  summary: Add Brugada phenocopy differential diagnosis
  details: |
    Added a differential_diagnoses entry for Brugada phenocopy (issue #12917): definition, reported provoking conditions, a shared HP:6000984 phenotype, five distinguishing features, and ten evidence items from nine PMIDs. No MONDO or HP term for Brugada phenocopy exists (OLS search of mondo and hp), so no disease_term is set. The evidence surfaced a disagreement the issue did not anticipate. The phenocopy classification authors (PMID:25201124) state that sodium channel blockers do not cause a phenocopy but unmask latent Brugada syndrome, while PMID:41721816 calls a propafenone overdose a drug-induced phenocopy. PMID:29899727, which the issue listed as a flecainide-induced Brugada pattern, turned out to be a case of unmasked Brugada syndrome: ajmaline challenge after washout was positive. It is therefore cited as the counter-example, and the notes explain how a post-washout provocative test decides between the two readings. Two PMIDs from the issue were not used: PMID:23317529 has no retrievable abstract or full text, and the PMID:30177318 abstract does not mention the Brugada pattern. environmental[] influences_mechanisms links were deliberately not added, pending #10395. Deep research: falcon was requested but failed twice (once plain, once with --fallback) because the environment proxy returned 403 on Edison authentication, and the fallback could not engage before the failure. No report was produced, and the entry was written from the cached primary sources the issue had already gathered. Validation: just validate, validate-terms, count-verified-snippets (107/107), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, and validate-disorders all passed.

  summary: Add propofol infusion syndrome to the Brugada phenocopy differential
  details: |
    Added the reciprocal link from the Brugada phenocopy differential to Propofol_Infusion_Syndrome, deferred from PR #13129. The differential description now names propofol infusion syndrome as the setting the phenocopy term was coined for, and records that PMID:23094876 lists propofol among its Group 1 sodium-channel-blocking drugs that it concludes mostly cannot be considered phenocopies. Four evidence items added (PMID:23094876 x3, PMID:20544610), all quoting already-cached references; a notes paragraph records the tension without asserting a sodium-channel mechanism for propofol. Validated with just validate-disorders (122/122 snippets verified).

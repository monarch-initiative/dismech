  summary: Add computational models for Brugada syndrome
  details: |
    Curated two complementary kinetic electrophysiology models from the Tsumoto 2020 model family: a 300-cell myocardial strand for lateral-membrane sodium-conductance perturbation and conduction slowing, and a 600-cell spatially heterogeneous ring for phase-2-reentry-mediated reentrant tachyarrhythmia. Each separately versioned artifact is pinned and linked only to the exact pathophysiology node it directly perturbs or partially recapitulates.

    Both repositories were inspected and build-tested. The curation records their legacy Intel C Compiler and MKL/PARDISO requirements, the stale strand sample input, the absence of a ring input and paper-scenario manifests, indirect derivation of published CV and reentry labels, and conflicting Intel-confidential terms within a nominally GPL-3.0 source tree. The wild-type-only BioModels candidate was excluded because it does not encode a Brugada disease perturbation. The PubMed cache was generated through the repository fetch workflow and all evidence snippets validate against the cached primary full text.

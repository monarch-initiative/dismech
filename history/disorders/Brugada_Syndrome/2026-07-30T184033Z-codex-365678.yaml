  summary: Strengthen Brugada causal edge evidence
  details: |
    Reviewed Brugada syndrome for disease and subtype scope, phenotype completeness, gene wiring, causal graph integrity, treatment mechanisms, and evidence granularity. Preserved the root Brugada syndrome model with SCN5A-related disease as its best-supported monogenic subtype, added source-matched evidence to all 11 pathophysiology edges and all three treatment-target edges, and supported the cardiac-channelopathy classification. Narrow SCN5A case-series phenotypes reported by D2P were not promoted automatically to the root syndrome. Schema, terms, references, phenotype connectivity, causal-gene wiring, and compliance checks passed. Weighted compliance improved from 77.2% to 89.8%.

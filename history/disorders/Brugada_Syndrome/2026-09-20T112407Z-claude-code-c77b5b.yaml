  summary: 'Genetics pass (wiring-002): wire SCN5A and SCN3B into the depolarization
    node, add the GeneReviews baseline'
  details: |
    Genetics pass for issue #12191. SCN3B, the MONDO-recorded gene for MONDO:0013146 (Brugada syndrome 7), was already curated in depth with relationship_type: DISPUTED and both supporting and refuting evidence, including the ClinGen reappraisal (PMID:29959160). It reached no pathophysiology node, and neither did SCN5A outside the fever node. Bound both as genes: on Reduced Depolarization Reserve, which is the node the SCN3B record's own prose identifies as where those alleles were reported to act, with a node-level notes: recording that the two genes are not graded alike, that the allele-level verdict lives on the genetic: records, and that the KGX exporter reads neither relationship_type nor this note (dismech#12320). Separately, just check-genereviews reported the Brugada Syndrome chapter (PMID:20301690) as an uncited UNTAGGED_CHAPTER; it was fetched, tagged, and mined for one evidence item on the Oligogenic Brugada syndrome subtype recording that GeneReviews still lists 42 non-SCN5A genes as diagnostic while ClinGen disputed 20 of the 21 it curated. The fever-unmasking PHENOTYPE_ALGORITHM definitions and their ESTABLISHED_CRITERIA grading were not touched. Validated: just validate (76/76 snippets), validate-terms, check-genereviews, and the offline gate set.

  summary: Deep research on the Brugada phenocopy differential; drug-trigger question
    resolved as terminological
  details: |
    Ran the two deep-research passes issue #12917 recorded as outstanding after
    PR #12924: a general report against templates/disease_pathophysiology_research.md,
    and a phenocopy-focused report against a new
    templates/disease_phenocopy_research.md, which asks for the published
    classification, the etiologic categories, the contested drug category with a
    per-case table of post-washout challenge results, dose dependence, prognosis
    and a verdict. Both reports requested falcon and fell back to claude_code;
    the reports carry fell_back, requested_provider and provider_attempts, and
    align_research_provider renamed both to the provider that wrote them.

    The earlier session recorded the falcon failure as a network proxy blocking
    Edison authentication. That is not why the fallback failed here: the nested
    Claude Code run returns exit code 1 with empty stderr because the request is
    refused by a model-level safety classifier (stop_reason refusal, category
    bio), which deep-research-client surfaces only as "<no stderr>". Setting
    ANTHROPIC_MODEL for the client process steers the nested CLI past it, which
    --param cannot do because it reaches the primary provider and never the
    fallback.

    Both reports were produced with the provider's default working directory,
    which is the repository root, so CLAUDE.md was loaded into the nested
    agent's context. Each report contains a sentence about this repository as a
    result. In the general report that sentence claims a differential-diagnosis
    addition was just made to this entry, which the nested agent could not have
    read (its tool allowlist was WebSearch and WebFetch only), so it is an
    unsupported claim about repository state. The reports are committed as
    produced rather than edited, since editing provider output would falsify its
    provenance. Future runs of this provider should set working_dir outside the
    repository.

    Curation the research changed. The contested question, whether
    sodium-channel-blocker toxicity can produce a phenocopy, is a disagreement
    about naming rather than about biology, and the previous notes were wrong to
    say the post-washout provocative test reconciles the two positions. The
    classification's authors exclude drug-induced patterns and propose the
    separate label "acquired sodium channel dysfunction" (PMID:28958975), while
    the same letter accepts that a propafenone overdose may produce the pattern
    with no genetic predisposition. That letter is a reply to a specific
    propafenone-overdose case (PMID:28381391) whose post-washout ajmaline
    challenge and family history were both negative, so the case meets the class
    A criterion and the label was refused anyway. Added the tricyclic series
    (PMID:17697824), where the pattern follows 2.3% of 402 overdoses: that rate
    shows overdose-level exposure is not sufficient on its own, so host
    susceptibility contributes even at that level. An earlier draft of the notes
    read the same figure as making dose the discriminator, which contradicted
    the evidence item's own explanation and was corrected in review.

    Also recorded that the ambiguity is not specific to drugs: in the accepted
    hyperkalemia category one of five post-normalization flecainide challenges
    was positive and uncovered Brugada syndrome (PMID:30675825). The same cohort
    reports malignant arrhythmias in 40% and six in-hospital deaths, against none
    in the 27-case registry series already cited (PMID:29397883), so that second
    cohort is recorded as a REFUTE item and the divergence is explained in notes
    by the reading that a phenocopy carries no Brugada substrate and its
    mortality tracks the provoking illness (PMID:41259431, quoted in the
    source's own Portuguese). Added hyponatremia (PMID:40052011) and pleural
    empyema (PMID:40827221) as provoking conditions, and named hypokalemia,
    pectus excavatum, acute pericarditis, septic shock and acute coronary
    occlusion in the description.

    Also took the three non-blocking suggestions from the approving review of PR
    #12924, which that PR's author held back so as not to drop its approval:
    reworded the propafenone distinguishing feature to say the case was reported
    as a phenocopy, made the case-report reference singular, and bound the type 2
    pattern to HP:6000985 Saddle-back type ST segment elevation as a second
    phenotype.

    Two report-level flags left as they are, because a report is a lead rather
    than content. The focused report's own reference validation rejects one
    quote it attributed to PMID:28381391; that quote is a paraphrase, and the
    entry cites the paper's actual conclusion sentence instead. The general
    report has two quotes rejected against PMID:42123485, neither of which is
    used here. The focused report also flags as PLAUSIBLE-only a genetic-yield
    figure and a HRS/EHRA/APHRS consensus statement it could not quote directly;
    neither is cited in the entry.

    Nothing was added to environmental[] or influences_mechanisms, still pending
    issue #10395.

    Validation on the changed entry: just validate (117/117 snippets, 121
    titles), validate-terms, count-verified-snippets, check-duplicate-keys,

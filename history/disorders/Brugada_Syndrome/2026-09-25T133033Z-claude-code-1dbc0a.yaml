  summary: 'Genetics pass (d2g series-044): Brugada_Syndrome'
  details: |
    Genetics pass for issue #12251 (d2g series-044). Completed the numbered Brugada series mapping the entry's own notes had planned: Brugada syndrome 2, 3, 4, 5, 6, 8 and 9 are now bound as skos:narrowMatch mappings beside the existing Brugada syndrome 7, and each gene has a genetic record with relationship_type DISPUTED carrying the specific finding against it from the ClinGen Brugada gene-validity reappraisal and, where one exists, ClinGen's current SOP11 assertion. Seven genes dispositioned: GPD1L, CACNA1C, CACNB2, SCN1B, KCNE3, HCN4, KCND3. None is wired onto a pathophysiology node, because placing a disputed gene on the depolarization-reserve node would assert the causal role ClinGen declined to accept; the reasoning is recorded in the entry notes. Updated the SCN3B record and the Brugada syndrome 7 mapping because ClinGen has moved that gene from disputed to refuted since the 2018 reappraisal. Added ClinGen's current definitive SCN5A assertion, which is made against MONDO:1010181 SCN5A-related cardiac rhythm disorder rather than against Brugada syndrome, and recorded that this routing is why MONDO carries no direct gene edge on Brugada syndrome 1. Validated with linkml-reference-validator 0.3.0rc1.

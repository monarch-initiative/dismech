  summary: Lump Brugada syndrome 7 (MONDO:0013146, SCN3B) onto the Brugada root entry
  details: 'Curation target was Brugada syndrome 7 (MONDO:0013146). Outcome is a lump onto the existing
    Brugada_Syndrome.yaml root rather than a standalone entry, per the ruling in issue #8921 (closed not_planned
    by @sierra-moxon: the priority dashboard marks the term LUMP_INTO_PARENT and the claim-disease skill
    excludes such rows). Identity anchored on OAK, not on any research report: runoak confirmed MONDO:0013146
    is_a MONDO:0015263, intersection_of RO:0004003 HGNC:20665 (SCN3B), OMIM:613120; hgnc:20665 confirmed
    as SCN3B. Three changes: (1) mappings.mondo_mappings gains MONDO:0013146 as skos:narrowMatch, following
    the Alagille_syndrome narrowMatch precedent, with a justification stating why a disputed gene is not
    given has_subtypes weight beside the definitive SCN5A form; (2) a new genetic entry ''SCN3B variants''
    with relationship_type DISPUTED and seven evidence items, which moves the SCN3B claim out of prose
    in notes and into a machine-readable record; (3) a KNOWLEDGE_GAP discussion (gap_brs_nonscn5a_gene_validity)
    attached to pathophysiology#Reduced Depolarization Reserve and genetic#SCN3B variants, asking whether
    the non-SCN5A stratum is oligogenic or simply not Brugada genes. The stub stubs/Brugada_Syndrome_7.yaml
    is deleted; the entry_type decision is SUBTYPE in substance, and the reasoning is recorded durably
    in the parent entry''s notes and mapping_justification rather than in the deleted stub. Deep research:
    falcon was requested and returned HTTP 403 on authentication, so the run was re-issued with --fallback
    and openscientist produced research/Brugada_Syndrome_7-deep-research-openscientist.md, which records
    fell_back, requested_provider and provider_attempts in its frontmatter; no provider was substituted
    by hand. That report''s reference validation was 31/31 verified (confabulation_rate 0.0) but its term
    validation was poor, 9 of 15 labels mismatched including MONDO:0013481 offered as ''brugada syndrome
    7'' when it is chromosome 13q14 deletion syndrome, plus NCIT:C50032 ''Limiter Device'' offered as
    ICD and NCIT:C371 ''Chromomycin Antineoplastic Antibiotic'' offered as isoproterenol; no CURIE was
    taken from the report. The report also omitted PMID:20031595, the seminal SCN3B paper, which came
    from the issue thread instead, and it reported the ClinGen tier as ''limited'', which is the curator-team
    tier superseded by the expert panel''s disputed reclassification in the primary. What the report did
    contribute was PMID:23257389, the Japanese V110I cohort giving 3 of 178 SCN5A-negative patients, which
    corrected an initial draft that described the association as resting on a single proband. Validation:
    just validate (62/62 snippets verified), just validate-disorders (schema, terms and references, all
    passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values,
    check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens and check-stubs
    all clean with no new baseline rows. Pre-PR red-team review (dismech-pr-review skill, fresh-context
    subagent) found and this commit fixed: (1) the features block asserted that a 1 in 2500 population
    frequency exceeds a 1 in 2000 disease prevalence, which is arithmetically backwards, and drew the
    unsupported conclusion ''incompatible with a causal role'' - both replaced by the reappraisal''s own
    framing, at or above the population prevalence and incompatible with a highly penetrant monogenic
    causal role; (2) the entry claimed two SCN3B variants carry the association while PMID:39761910, already
    in this PR''s own reference cache, reports a third (T138del) with preserved surface expression, which
    also falsified the generalisation that all act by mistrafficking - the common mechanism is now stated
    as reduced sodium current and that paper is cited; (3) directness INDIRECT on the human proband observation
    was a strength judgement rather than a directness one and was inverted relative to the in-vitro items,
    corrected to DIRECT with the two-directional explanation trimmed; (4) evidence_source on the two expert-panel
    verdict snippets changed from HUMAN_CLINICAL to OTHER, since a consensus verdict is not primary clinical
    data; (5) the notes block stated the narrowMatch policy as executed across the series when only MONDO:0013146
    is bound, reworded as prospective and naming the seven unmapped terms; (6) the discussion prompt narrowed
    so it no longer reopens the oligogenic-architecture question the has_subtypes entry already answers;
    (7) PMID:21051419 added, reporting L10P, the original Brugada allele, in a lone atrial fibrillation
    cohort, which is direct support for the disputed call; (8) ''twenty-one genes reported'' corrected
    to ''curated'' (the reappraisal identified 23 and curated 21) and ''neither report provided segregation
    data'' to ''no report provided informative segregation data'', since PMID:20031595 does report one
    uninformative unaffected-brother data point. Separately, an independent exact-substring check found
    the PMID:39761910 snippet had been transcribed with ''beta3'' where the source has the Greek character;
    the reference validator normalises that and passed it 64/64, so the snippet was corrected to the source
    characters rather than left relying on normalisation. All 42 PMID snippets in the file were then re-checked
    and match. Left for follow-up: the entry still has no top-level references block and no GeneReviews
    baseline, a pre-existing gap that predates this session. A second round, after the ai4c-reviewer review
    on PR #10676, closed the one blocking finding: the Scn3b-null mouse phenotype had been asserted in
    the genetic features block and in the knowledge-gap rationale with no evidence item at all, although
    PMID:19796257 was already in the reference cache. That is now cited, and the model is curated as an
    animal_models entry with a modeled_mechanisms link. Two departures from the reviewer''s suggested
    fix, both because the source does not support it: the relationship is PARTIALLY_RECAPITULATES rather
    than FAILS_TO_RECAPITULATE, and the evidence item is SUPPORT/INDIRECT rather than REFUTE, because
    PMID:19796257 describes its atrial findings as complementing ventricular changes reported on an earlier
    occasion, so it does not establish that a ventricular phenotype is absent. The curated prose that
    said the mouse shows conduction disease ''rather than'' the right-ventricular substrate carried that
    same overclaim and was corrected in both places. A HUMAN_MODEL_MISMATCH discussion was added for the
    translational question and kept separate from the gene-validity KNOWLEDGE_GAP, which asks a different
    question. Also from that review: the literature-census snippet was regraded from HUMAN_CLINICAL to
    OTHER for consistency with the two expert-panel items, the PMID:21051419 reference_title restored
    to the cache-exact Greek beta, and three stray blank lines removed. A third round corrected a factual
    error introduced by the second. While defending the choice of PARTIALLY_RECAPITULATES over the reviewer''s
    suggested FAILS_TO_RECAPITULATE, a PubMed search for the ventricular study that PMID:19796257 refers
    to as ''an earlier occasion'' found PMID:19351516, Hakim et al. 2008, which reports that Scn3b-null
    mice have reduced peak sodium current in ventricular myocytes, shortened ventricular effective refractory
    periods, and inducible monomorphic or polymorphic ventricular tachycardia, with electrophysiological
    features the authors describe as similar to Scn5a heterozygous hearts. The curated prose asserting
    that the null phenotype is atrial and conduction dominated rather than right-ventricular was therefore
    wrong, not merely unsupported, and FAILS_TO_RECAPITULATE would have been badly wrong. Both prose sites
    were rewritten, PMID:19351516 was cached and cited, a second modeled_mechanisms link to Malignant
    Ventricular Tachyarrhythmia was added, fidelity on the depolarization-reserve link was raised from
    LOW to MODERATE now that reduced ventricular sodium current is directly measured, and the limitations
    were reduced to the two that survive: homozygous null against heterozygous human alleles, and murine
    versus human ventricular repolarization. The HUMAN_MODEL_MISMATCH discussion was rewritten around
    the mismatch that actually exists, which is allele-level rather than compartment-level: a strong null-mouse
    phenotype coexisting with human alleles that occur at roughly the prevalence of the disease. check-snippet-grading
    then caught the population-frequency snippet graded OTHER in the new discussion and HUMAN_CLINICAL
    in the genetic block; the HUMAN_CLINICAL grading was kept in both. 75/75 snippets verified.'

  summary: Lump Brugada syndrome 7 (MONDO:0013146, SCN3B) onto the Brugada root entry
  details: |
    Curation target was Brugada syndrome 7 (MONDO:0013146). Outcome is a lump onto the existing Brugada_Syndrome.yaml root rather than a standalone entry, per the ruling in issue #8921 (closed not_planned by @sierra-moxon: the priority dashboard marks the term LUMP_INTO_PARENT and the claim-disease skill excludes such rows). Identity anchored on OAK, not on any research report: runoak confirmed MONDO:0013146 is_a MONDO:0015263, intersection_of RO:0004003 HGNC:20665 (SCN3B), OMIM:613120; hgnc:20665 confirmed as SCN3B. Three changes: (1) mappings.mondo_mappings gains MONDO:0013146 as skos:narrowMatch, following the Alagille_syndrome narrowMatch precedent, with a justification stating why a disputed gene is not given has_subtypes weight beside the definitive SCN5A form; (2) a new genetic entry 'SCN3B variants' with relationship_type DISPUTED and seven evidence items, which moves the SCN3B claim out of prose in notes and into a machine-readable record; (3) a KNOWLEDGE_GAP discussion (gap_brs_nonscn5a_gene_validity) attached to pathophysiology#Reduced Depolarization Reserve and genetic#SCN3B variants, asking whether the non-SCN5A stratum is oligogenic or simply not Brugada genes. The stub stubs/Brugada_Syndrome_7.yaml is deleted; the entry_type decision is SUBTYPE in substance, and the reasoning is recorded durably in the parent entry's notes and mapping_justification rather than in the deleted stub. Deep research: falcon was requested and returned HTTP 403 on authentication, so the run was re-issued with --fallback and openscientist produced research/Brugada_Syndrome_7-deep-research-openscientist.md, which records fell_back, requested_provider and provider_attempts in its frontmatter; no provider was substituted by hand. That report's reference validation was 31/31 verified (confabulation_rate 0.0) but its term validation was poor, 9 of 15 labels mismatched including MONDO:0013481 offered as 'brugada syndrome 7' when it is chromosome 13q14 deletion syndrome, plus NCIT:C50032 'Limiter Device' offered as ICD and NCIT:C371 'Chromomycin Antineoplastic Antibiotic' offered as isoproterenol; no CURIE was taken from the report. The report also omitted PMID:20031595, the seminal SCN3B paper, which came from the issue thread instead, and it reported the ClinGen tier as 'limited', which is the curator-team tier superseded by the expert panel's disputed reclassification in the primary. What the report did contribute was PMID:23257389, the Japanese V110I cohort giving 3 of 178 SCN5A-negative patients, which corrected an initial draft that described the association as resting on a single proband. Validation: just validate (62/62 snippets verified), just validate-disorders (schema, terms and references, all passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens and check-stubs all clean with no new baseline rows.

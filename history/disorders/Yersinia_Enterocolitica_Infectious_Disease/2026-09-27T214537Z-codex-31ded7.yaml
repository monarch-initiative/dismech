  details: |
    Created the Yersinia enterocolitica infectious disease entry from an OpenScientist deep-research report, using MONDO:0042370 and NCBITaxon:630 as identity anchors. The entry captures pork-associated zoonotic transmission, the acute enteritis/terminal-ileitis/septicemia spectrum, invasin-mediated Peyer's-patch entry, mononuclear-phagocyte dissemination, pYV type III secretion with YopJ macrophage survival-pathway blockade, deferoxamine-potentiated systemic replication, core enteric and reactive-arthritis phenotypes, and antibiotic therapy for invasive disease. Refreshed the selected PubMed caches with just fetch-reference, verified 25/25 snippets, and reran just validate-disorders for the new YAML.

  summary: 'Create: Spermatogenic_Failure_45'
  details: |
    New entry for MONDO:0033671 (DNAH2-related SPGF45, OMIM 619094), curated from the open stub, which is deleted. Two just research-disorder falcon runs failed with a 503 Edison authentication error (deep-research-client providers --check reported falcon UNREACHABLE), and a run with dr_fallback='--fallback' failed the same way without falling back, so the report used is research/Spermatogenic_Failure_45-deep-research-claude_code.md from just research-disorder claude_code. preflight-dr returned PASS (DNAH2 mentioned 21 times). The report cites few primary sources, so curation rests on PubMed-found papers fetched with just fetch-reference: PMID:30811583, PMID:33771466 and PMID:40592014 (abstracts) and PMID:33968937 (full text, human family plus Dnah2 deletion mouse); PMID:40898283 supplies the cryo-EM-based placement of DNAH2, DNAH10 and DNAH12 as IDA f heavy chains. Causal chain: DNAH2 protein loss, loss of DNAH1 and RSPH3 from the flagellum (mouse), inner dynein arm and central pair loss with axonemal and mitochondrial-sheath disorganization, MMAF, phenotypes; a mouse-only spermiogenesis node (basal body and annulus mispositioning) links to head defects and oligozoospermia. The mouse link records that knockout sperm retain inner-arm electron densities, unlike patient sperm. No ClinGen classification exists for DNAH2. Validated with just validate (all snippets verified), count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-genereviews (NO_CHAPTER).

  summary: Rebind QRS duration to the plain whole-ECG LOINC code
  details: |
    The reviewer suggested the whole-ECG QRS duration code in place of the single-lead-qualified one bound in the prior round. The string LOINC:8633-2 they may have meant does not resolve; the correct code is LOINC:8633-0, plain 'QRS duration' with no lead qualifier, confirmed by a direct Monarch API search on the concept name (q=QRS duration returns total: 19, with 8633-0 the top hit). Rebound the Serial 12-lead electrocardiography diagnosis row's measurement from LOINC:44973-6 (QRS duration {Electrocardiograph lead}) to LOINC:8633-0, since the cited seizure/arrhythmia thresholds are whole-ECG QRS durations rather than a single named lead's measurement. Removed the now-orphan LOINC:44973-6 cache row (nothing in kb/ binds it structurally; it is mentioned in notes as context only).

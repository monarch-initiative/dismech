  summary: Bind LOINC measurement to the serial ECG diagnosis row
  details: |
    Added a LOINC-coded measurement (LOINC:44973-6, QRS duration {Electrocardiograph lead}, verified against the Monarch KG, confirmed absent from origin/main and from every other open campaign branch before seeding) to the existing Serial 12-lead electrocardiography diagnosis row. No reference range is bound: the cited 0.10 s / 0.16 s QRS cutoffs are a single retrospective cohort's statistical associations with seizures and arrhythmias respectively, that evidence item's own explanation already calls them observed cohort associations rather than deterministic boundaries, and a separately cited source in the same row reports a counter-example (normal QRS width with major complications).

  summary: 'Create: Acute Tricyclic Antidepressant Poisoning (MONDO:0018547)'
  details: |
    New entry for acute tricyclic antidepressant poisoning, bound to MONDO:0018547.

    Duplicate preflight was run across all three surfaces before starting - origin/main by MONDO ID and label, PRs in all states, issues in all states - and returned nothing.

    Deep research: falcon was requested and is not configured in this environment, so the run used --fallback and the report records fell_back: true, requested_provider: falcon. just preflight-dr returns SKIP, because MONDO records no causal gene for a poisoning and the gene-identity check cannot discriminate; the manual fallback check passes (the report's top genes are CYP2D6, CYP2C19, SCN5A, KCNH2). The report's own validation reports quotes_valid 2 of 9 checked and needs_review true, so no text was taken from it - it contributed four PMIDs (17453872, 9737495, 25939777, 33655968) and nothing else. Its ontology suggestions were checked and rejected: HP:0000615 offered as Mydriasis is Abnormal pupil morphology, HP:0002593 offered as Ileus is Intestinal lymphangiectasia, and NCIT:C1636 offered as Activated Charcoal is Therapeutic Steroid Hormone. Every CURIE in the entry was resolved from a live OAK lookup instead.

    Content: 17 pathophysiology nodes modelling five parallel molecular arms off one exposure node (cardiac fast sodium channel, hERG potassium channel, vascular alpha-1, muscarinic, monoamine transporter) plus a CNS arm; 18 phenotypes, all 18 causally connected; 11 treatments; 3 animal models linked to the pathograph via modeled_mechanisms; 32 distinct references; 140 evidence items, all snippet-verified against the committed cache.

    Three nodes declare conforms_to against kb/modules/xenobiotic_cardiac_channel_perturbation.yaml - both channel-blockade nodes to its trigger node and Altered Cardiac Action Potential to its key conformance target. Nothing downstream conforms, because the module's working-myocardium branch is afterdepolarization-driven triggered activity whereas this poisoning's ventricular arrhythmia is reentrant on a slow-conduction substrate.

    The pathograph contains one deliberate cycle: Systemic Acidaemia feeds back onto Cardiac Fast Sodium Channel Blockade, because acidaemia raises the ionized drug fraction that binds the channel. That loop is the reason deterioration is abrupt and it is what sodium bicarbonate is given to break.

    An adversarial pre-PR review with fresh context produced 22 findings, of which 21 were taken. The substantive ones: HP:0001942 Metabolic acidosis was rebound to its parent HP:0001941 Acidosis, because HPO defines metabolic acidosis as excluding a respiratory cause and the cited sources say only acidosis; GO:0098903 was replaced by GO:0098915, which names ventricular repolarization rather than its regulation; two explanations were rewritten where the quoted sentence did not say what the explanation claimed (a PMID:9377889 quote about resolution time cited for a QRS claim, and a PMID:17453872 quote about emesis cited as the guideline's charcoal position - the latter replaced by the guideline's actual charcoal recommendation, which is unfavourable and is now graded REFUTE); a miscount of REFUTE items in a treatment note was corrected; the VA-ECMO case count was scoped to its source review's November 2020 search date; and the physostigmine agent binding, documented as an unrun search, was researched and filled (NCIT:C81336). Prose claiming that seizures and hypoventilation generate the acidaemia was removed from four places, because no cited source states either and the graph models only the circulatory route.

    Validation: just validate-disorders passes with all snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens, check-environmental-evidence, check-case-collisions, check-not4curation, check-reference-titles and check-delivery-system are all clean; list-disconnected-phenotypes reports 18/18 connected; list-gene-term-mismatches reports 8 of 8 gene bindings naming the gene the entry names; prose-figure-audit reports no unsupported figure; check-genereviews returns NO_CHAPTER for GeneReviews and TAGGED for the StatPearls chapter it found. Cache changes are additive only.

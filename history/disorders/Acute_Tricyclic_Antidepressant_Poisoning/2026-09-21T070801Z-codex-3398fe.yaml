  details: |-
    Reviewed the full entry, matching deep-research output, all 32 originally cited PMID records and every available substantive full body and table. Recovered the full 2007 poison-center consensus, current StatPearls chapter, amitriptyline pharmacogenetic chapter, canonical hERG full text and subtype-specific GABAA experiments through the sanctioned fetcher. Split depolarization from repolarization; qualified indirect myocardial, seizure and pharmacokinetic mechanisms; corrected parent/metabolite, cohort-frequency, ECG-threshold and shock-scope claims. Added documented antimuscarinic, neurological and pulmonary findings, care/diagnostic gaps and experimental models with assay and clinical limits. An independent bounded care-source audit informed treatment revisions. Read the 2025 AHA sodium-channel section on its primary website; official automated full-body routes were blocked, so retained bibliographic context and exact care quotations from available sources without fabricating a cache. No applicable GeneReviews chapter. Full-text recovery changes are separately tested provider code; reference caches are generated, never hand-edited. Schema, live terms and 208/208 snippets passed before final formatting; remaining repository gates and final peer integration check are tracked separately.

    Final care/diagnosis integration audit found no material residual error; its full-sentence vasopressor quotation refinement was incorporated. All 25 repository guards and node-class integrity passed; final post-format authoritative validation remains tracked in the validation log.
    A separate independent integration audit read all 20 nodes and all nine models and found no blocking topology or model-scope conflation. Final live HPO definition/synonym inspection confirmed Hyperthermia is an EXACT synonym of HP:0001945 Fever; that specific binding replaces the provisional temperature-regulation parent. Added source-backed differential diagnoses and magnesium agent mapping.
    Final authoritative schema/live-ontology validation and 212/212 cached snippets passed, including the added differentials. The published NCIT magnesium label was outside the agent enum, so the validated CHEBI:32599 magnesium sulfate binding was used. The unsupported monitoring-action binding was omitted; counseling uses the validated action. The discarded unused NCIT lookup row was restored to the prior generated cache.

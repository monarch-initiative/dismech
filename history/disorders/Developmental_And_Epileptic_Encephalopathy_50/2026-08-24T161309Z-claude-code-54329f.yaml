  summary: 'Create: Developmental and Epileptic Encephalopathy 50 (CAD deficiency)'
  details: |
    De-novo creation of the DEE50 / CAD deficiency entry, MONDO:0014647, claimed via issue #9387.

    Deep research: `just research-disorder claude_code`. NEC preflight PASS (CAD
    dominant, 76 mentions; report OMIM 616457 matches the MONDO xref).

    IMPORTANT provenance note on that report. Its own reference validation set
    `needs_review: true`: 9/9 identifiers resolved and confabulation_rate was 0.0,
    but only 5 of 9 quoted claims were supported, with 4 unsupported quotes
    attributed to PMC:PMC10921618 and PMC:PMC7951104. This is exactly the case the
    curation SOP warns about - a 0.0 confabulation rate is not an all-clear,
    because it measures identifier resolution only. Consequently NO snippet in this
    entry was taken from the report; every snippet was read directly out of the
    cached reference and verified.

    The report's suggested ontology terms were likewise checked individually
    against OLS4 rather than trusted, and five were wrong: HP:0011273 was offered as
    "Anisopoikilocytosis" but is Anisocytosis (the real term is HP:0004823);
    HP:0011344 was offered as "Progressive developmental regression" but is Severe
    global developmental delay; HP:0011451 was offered as "Drug-resistant epilepsy"
    but is Primary microcephaly; HP:0012156 was offered for dyserythropoiesis but is
    Hemophagocytosis; and HP:0003132 (offered for orotic aciduria) does not exist.
    Most consequentially the report suggested GO:0004087 for CAD's carbamoyl
    phosphate synthetase activity - that is the ammonia-dependent CPS1 of the urea
    cycle, a different enzyme in a different compartment. The entry binds GO:0004088
    (glutamine-hydrolyzing), which is CAD's CPS-II.

    Content: 8-node pathograph from biallelic CAD loss of function through impaired
    de novo pyrimidine biosynthesis and pyrimidine/UDP-sugar pool depletion to the
    dyserythropoietic and neuronal arms and an epileptic-encephalopathy endpoint,
    plus an `Intact Uridine Salvage Pathway` modifier node that exists so the
    treatment can point at it. Oral uridine uses target_mechanisms with ACTIVATES on
    the salvage node and BYPASSES on the depletion node - the BYPASSES semantics is
    what distinguishes this disorder from an untreatable enzymopathy. 16 phenotypes,
    genetic, prevalence, 4-phase progression, 2 diagnosis entries, 1 treatment, the
    naturally occurring CAD-deficient Bengal cat animal model, 2 experimental models
    (the CRISPR CAD-knockout complementation line, which is simultaneously model and
    diagnostic assay, and patient fibroblasts), a DTYMK differential, and 2
    KNOWLEDGE_GAP discussions.

    Deliberate non-conformances, recorded in notes: NOT
    epilepsy_excitation_inhibition_imbalance (no excitation-inhibition measurement
    exists in CAD deficiency, so conforming would substitute a plausible route for
    an evidenced one) and NOT cerebellar_purkinje_degeneration (cerebellar atrophy
    here is an imaging finding with no Purkinje-specific lesion demonstrated).

    Curation corrections made during the run: two reference_title values were wrong
    against the cache and were corrected from it (PMID:25678555 and PMID:38454370);
    an evidence item quoting PMID:39447673's title was removed entirely, because
    that cached record carries no abstract and a title is not a finding - the
    oligomerization claim it supported is now carried by the feline variant paper,
    which states the mechanism as a result; and four snippets taken from the 2024
    review's summary table extracted as run-together mid-word fragments
    ("Hydrocephalus2/248Delayed myelination2/248") and were replaced with the
    paper's own prose sentence on imaging, which covers all three imaging
    phenotypes and their age dependence.

    Frequency bands come only from the 2024 pooled review, which states each figure
    against an explicit 42-patient denominator. Phenotypes whose counts exist only
    in the non-extractable table carry no band.

    Validation run and read: `just validate` (schema, terms, 73/73 snippets
    verified); the six ungated CI gates all clean; `just check-snippet-boundaries`
    and `just check-not4curation` clean; `just validate-disorders` run over the
    changed file.

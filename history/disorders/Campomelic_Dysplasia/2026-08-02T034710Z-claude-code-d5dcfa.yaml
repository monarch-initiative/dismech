  summary: Replace cross-entity mechanism transfer with CD-specific iPSC evidence
  details: |
    Acts on finding 4 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    The node 'Reduced SOX9 Stability and Matrix Defects' rested entirely on PMID:39854231 and asserted five CD-specific radiographic consequences. That paper studied a congenital vertebral malformation cohort and describes its TAM-domain variant as causing mild skeletal dysplasia and scoliosis, i.e. a distinct milder point on the SOX9 spectrum, not campomelic dysplasia.

    Renamed the node to 'SOX9 Dosage Insufficiency and Matrix Defects' and re-grounded it on PMID:40025280, a CRISPR-engineered human iPSC model built on a reported campomelic dysplasia SOX9 splice-site mutation, which shows chondrogenic failure at the heterozygous dosage relevant to CD and rescue of sulfated GAG and COL2A1 output when SOX9 is restored. The TAM-domain work is retained but downgraded to PARTIAL with its cohort scope stated in the explanation, so the stability route reads as a spectrum-level mechanism rather than an established CD-specific one.

    Also retagged a generic background sentence from HUMAN_CLINICAL to OTHER (it is background prose, not clinical data) and extended that snippet so it actually names campomelic dysplasia. Raised Bowing of the Long Bones from FREQUENT to VERY_FREQUENT: the source says campomelia is seen in most but not all patients, with acampomelic CD the recognized minority exception, which is the 80-99% band.

    Validated: schema, reference and term validation all pass.

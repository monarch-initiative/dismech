  details: |
    PR shepherd pass on PR #8074, addressing the single blocking review finding from ai4c-reviewer.

    Changed 'Bowing of the Long Bones' from frequency: VERY_FREQUENT back to FREQUENT. The prior VERY_FREQUENT band rested on an editorial inference from the author wording 'most but not all patients', which docs/frequency-evidence-guidelines.md maps to FREQUENT (30-79%); VERY_FREQUENT requires a quantitative >=80% figure that PMID:11754051 does not provide. The same abstract in fact bounds the band from above ('Half of the CD cases with 17q rearrangements have no or mild campomelia.'), which is incompatible with an 80-99% reading.

    Rewrote the explanation on the existing PMID:11754051 evidence item to state the default-mapping rationale instead of the inference, and added that bounding sentence as a second PARTIAL evidence item on the same reference (snippet verified verbatim against references_cache/PMID_11754051.md).


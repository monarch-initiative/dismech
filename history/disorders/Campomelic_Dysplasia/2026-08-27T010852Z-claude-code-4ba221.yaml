  details: |
    The isds_skeletal_category assignment cited only the 2019 revision (group 18). Re-verified against the 2023 table and rewritten to cite group 20 entry NOS 20-0010, "Campomelic dysplasia (CD), SOX9-related" (AD, SOX9, MIM 114290), keeping the 2019 provenance as history. No change to the classification value itself.

    Lumping recorded explicitly: NOS 20-0010 folds acampomelic campomelic dysplasia, mild campomelic dysplasia (MIM 602196), ischio-pubic-patellar dysplasia and some isolated Pierre-Robin sequence into this one row. dismech already curated ACD as a phenotypic variant here rather than as its own entry, so the note now states that the entry follows the committee's call rather than leaving the agreement implicit.

    Added harrisons_chapter GENETICS_ENVIRONMENT_DISEASE, which the entry lacked, for consistency with the other group-20 entries.

    Part of a completeness and consistency pass over ISDS 2023 nosology group 20 (Bent bones dysplasia group). After this pass all six 2023 rows are curated and classified, plus the post-revision CCN2 entity.

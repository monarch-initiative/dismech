  summary: 'Create: ZIC1-Related Craniosynostosis'
  details: |
    New entry for craniosynostosis 6 (MONDO:0014705), the autosomal dominant craniosynostosis caused by heterozygous final-exon ZIC1 variants. It records dominant inheritance (mostly de novo, with parental and gonadal mosaicism) and incomplete penetrance; the ClinGen Definitive assertion copied from the cached CGGV record (Craniofacial Malformations GCEP, 2024); four representative variants; 20 phenotypes; a seven-node pathograph running from the stable C-terminally altered protein through altered target-gene regulation to coronal suture fusion, deficient calvarial ossification, disordered brain development and a vertebral patterning defect; two animal models (the Zic1-null mouse, including a FAILS_TO_RECAPITULATE link for the suture, and the Xenopus ZIC1 RNA injection assay); diagnosis; cranial vault surgery; and five differential diagnoses.

    Deep research: falcon could not authenticate (HTTP 403) and the recipe fell back to openscientist (research/ZIC1-Related_Craniosynostosis-deep-research-openscientist.md). The report had no validation section, so one was added with validate-research-reference: 22 of 22 references resolved, none unresolved, the one checked quote was found, none off topic. preflight-dr passed (ZIC1 is the dominant gene, and the OMIM number matches MONDO). The report was used for leads only. Every citation in the entry was fetched and quoted from the reference cache. The report's reading of PMID:40151950 (ZIC1 overexpression in a femoral-defect xenograft) as a route to suture fusion was not adopted.

    Curation decisions. Scope is the final-exon class only, following the genotype-phenotype split in Watts 2026 (PMID:42028696) and ClinGen. The exon 1 and 2 loss-of-function neurodevelopmental disorder is excluded, and so is Dandy-Walker malformation from ZIC1/ZIC4 deletion, which is listed as a differential. The variant consequence is GAIN_OF_FUNCTION, as ClinGen and the founding report (PMID:26340333) state. The activity node uses DYSREGULATED, and the canonical gain-of-function hypothesis carries a REFUTE item for the reduced reporter-assay activity of p.Glu402Ter. A mixed loss- and gain-of-function model is recorded as emerging. The supraorbital engrailed 1 node is described as inferred from mouse expression and En1 genetics. Brain-imaging and strabismus frequencies from Watts 2026 pool the craniosynostosis and neurodevelopmental classes, and each explanation says so. Strabismus and downslanting palpebral fissures are left unconnected because no source proposes a mechanism for either. The 3q inversion near ZIC1 (PMID:37950019) is mentioned in the genetic notes but not recorded as a variant, because ZIC1 expression was not measured. No GeneReviews chapter exists (check-genereviews: NO_CHAPTER).

  summary: 'Create: Lichen Myxedematosus (MONDO:0018432) with scleromyxedema/localized
    subtypes'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report (research/Lichen_Myxedematosus-deep-research-perplexity.md). 22 evidence snippets, all verified by dismech.reference_snippet_audit against references_cache/.

    Lump/split decision: one Disease with three has_subtypes (Scleromyxedema, Localized LM, Atypical LM) following the Rongioletti-Rebora classification, rather than separate entries. Both main subsets share the defining pathograph -- fibroblast-driven dermal mucin deposition in a euthyroid patient -- and are separated by extent, paraproteinaemia and systemic involvement rather than by mechanism. A discussion flags that this call should be revisited if the localised forms turn out to have a distinct trigger, so the decision is auditable rather than silent.

    The central curation judgement concerns the monoclonal gammopathy. It is one of four diagnostic criteria for scleromyxedema and present in 27 of 30 patients in the largest series, and secondary sources routinely present it as the cause. Two verified findings block that: the classification itself defines an atypical category of scleromyxedema WITHOUT monoclonal gammopathy (PMID:11174386), and a paraprotein-negative patient is reported with entirely typical mucin deposition and fibroblast proliferation on biopsy (PMID:9816405). The second is carried as a REFUTE evidence item on the plasma-cell node, and the edge to fibroblast activation is typed INDIRECT_UNKNOWN_INTERMEDIATES.

    Two other deliberate evidence decisions. The IVIg target_mechanisms link is graded directness: INDIRECT because it is therapeutic response cited as validation of the mechanism it targets, in an uncontrolled retrospective series where IVIg was often combined with other drugs. And the same quoted sentence from PMID:23453242 is used twice with opposite supports values -- SUPPORT for IVIg efficacy, REFUTE for corticosteroid efficacy -- which is the claim-relative behaviour of that slot; evidence_source is identical in both, so check_snippet_grading passes.

    The dermato-neuro syndrome is recorded as a phenotype with an explicit mechanism gap rather than being attached to a speculative pathophysiology node: it is the characteristic cause of death (2 of 5 in the series) and no cited source proposes a mechanism for it.

    The report's term validation was the worst of the five in this run -- 27 of 53 labels mismatched -- so no ontology term was taken from it; all were resolved against the local caches.

    One snippet reproduces spelling errors present in the source ('glycosaminoglycanes', 'chondoitin' in PMID:8668693); the explanation says so, since a snippet must quote the source rather than correct it.

    Validation run in the worktree: linkml-validate (Disease) clean; linkml-term-validator validate-data --labels clean; reference_snippet_audit 22/22; check_duplicate_yaml_keys, check_entity_refs, check_causal_targets, check_enum_values, check_snippet_grading all clean.

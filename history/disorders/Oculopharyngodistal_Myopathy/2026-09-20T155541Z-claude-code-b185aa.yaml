  details: |
    Genetics pass for the d2g wiring-015 job (issue #12204, epic #12189). Genetics researched from the entry's own cited literature plus a GeneReviews baseline check (just check-genereviews), with MONDO/Monarch consulted only afterwards for reconciliation. ClinGen bulk refresh was unavailable (just clingen-refresh fails on a drifted pin, issue #10426), so no new ClinGen assertion was fetched. Every HGNC CURIE written here was read from cache/hgnc/terms.csv in the same step it was written; just list-gene-term-mismatches reports 0 findings over the changed files.

    Each of the four has_subtypes rows (OPDM1-4) is gene-defined but carried no genes: binding, so the gene-to-disease pairs MONDO records at the subtype terms were invisible to a knowledge-graph comparison. Added LRP12 to OPDM1, GIPC1 to OPDM2, NOTCH2NLC to OPDM3 and RILPL1 to OPDM4, and set relationship_type: CAUSATIVE plus the matching subtype foreign key on each genetic record (they carried only the free-text association: Causative). All four subtype MONDO terms were spot-checked against Monarch's causal_gene and agree. The genes already reached the pathograph through the shared Non-coding CGG-repeat expansion node, so mechanism wiring was already 4/4 and is unchanged. No evidence was added or altered.

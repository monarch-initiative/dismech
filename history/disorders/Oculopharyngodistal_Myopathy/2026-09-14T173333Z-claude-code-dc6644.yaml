    Bound subtype_term (MONDO:0020793 'oculopharyngodistal myopathy 1' and MONDO:0023671 'oculopharyngodistal myopathy 3') on the existing OPDM1 and OPDM3 has_subtypes entries. Follow-up to issue #9868: PR #9855 deleted stubs/Oculopharyngodistal_Myopathy_1.yaml and stubs/Oculopharyngodistal_Myopathy_3.yaml (numbered MONDO stubs folded into this already-curated parent entry) without binding the corresponding MONDO IDs anywhere the coverage index reads, so just seed-stubs would recreate them on the next run. IDs and canonical labels recovered from the deleted stub files in PR #9855's diff, then verified live via just validate-terms (both resolve and match current MONDO labels). OPDM2 (GIPC1) and OPDM4 (RILPL1) were not part of PR #9855's deleted-stub batch, so no numbered MONDO ID was recoverable for them; left unbound and still surfaced by the test_disorder_file subtype_term warning. Verified src.dismech.compare.mondo_priority.iter_covered_mondo_ids now reports both new MONDO IDs for this file. Validated with just validate, just validate-disorders, check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, check-term-cache-integrity, check-cache-order, and pytest -k subtype_foreign_keys.

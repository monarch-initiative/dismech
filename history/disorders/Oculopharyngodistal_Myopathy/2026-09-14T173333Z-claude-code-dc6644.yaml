  summary: Bind subtype_term MONDO IDs on OPDM1 and OPDM3
  details: |
    Bound subtype_term (MONDO:0020793 'oculopharyngodistal myopathy 1' and MONDO:0023671 'oculopharyngodistal myopathy 3') on the existing OPDM1 and OPDM3 has_subtypes entries. Follow-up to issue #9868: PR #9855 deleted stubs/Oculopharyngodistal_Myopathy_1.yaml and stubs/Oculopharyngodistal_Myopathy_3.yaml (numbered MONDO stubs folded into this already-curated parent entry) without binding the corresponding MONDO IDs anywhere the coverage index reads, so just seed-stubs would recreate them on the next run. IDs and canonical labels recovered from the deleted stub files in PR #9855's diff, then verified live via just validate-terms (both resolve and match current MONDO labels). OPDM2 (GIPC1) and OPDM4 (RILPL1) are also bound, to MONDO:0030134 and MONDO:0030712. An earlier draft of this record claimed no numbered MONDO ID was recoverable for them because they were not in PR #9855's deleted-stub batch; review of this round established that this was a limitation of the recovery method (reading the deleted-stub diff) rather than a fact about MONDO, and a single OLS search for "oculopharyngodistal" returns all five numbered subtypes. Both CURIEs were then read from OLS and confirmed non-obsolete before binding, and both are reachable from MONDO:0000001, so they satisfy the DiseaseOrSubtypeTerm dynamic enum. All four has_subtypes entries are now bound, so the seed-stubs recreation risk that motivated issue #9868 is closed for this entry rather than half-closed. Verified src.dismech.compare.mondo_priority.iter_covered_mondo_ids now reports both new MONDO IDs for this file. Validated with just validate, just validate-disorders, check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, check-term-cache-integrity, check-cache-order, and pytest -k subtype_foreign_keys.

  summary: 'Review round 1: split resistant-starch trial out of the psyllium treatment'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #10742. The cited trial (PPR:PPR1298203) used a psyllium-matched placebo, so its effects are the incremental effect of high-amylose resistant starch on a psyllium background, not an effect of psyllium. Removed the microbiota/anxiety claims from the 'Soluble Fiber (Psyllium)' treatment and created a separate 'High-Amylose Resistant Starch and Psyllium Blend' treatment carrying the trial's evidence plus an explicit snippet establishing the psyllium-matched comparator. Softened the Microbiome Dysbiosis node description from 'restoration' to a substrate-driven compositional shift, since the trial has no healthy-control arm; added directness INDIRECT, reference_title, and preprint disclosure to that evidence item. Added a target_mechanisms link (MODULATES) from the new treatment to Microbiome Dysbiosis. Validated with just validate, 48/48 snippets verified, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys.

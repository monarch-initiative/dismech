  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 2. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. Cited all five previously evidence-free `environmental:` exposures (Psychological Stress, Dietary Triggers, Gastroenteritis, Antibiotics, Early Life Stress). Two deliberate choices. First, the Antibiotics note asserted a microbiome mechanism the citable meta-analysis does not measure; it now states the measured risk (IRR 1.3) and marks microbiome disruption as the proposed mechanism, graded PARTIAL since the authors flag heterogeneity above 90%. Second, Early Life Stress carries two evidence items on purpose: a systematic review finding childhood sexual abuse associated with IBS (OR 1.87), paired with a meta-analysis finding the broader adverse-childhood-experience association uncertain given I2 = 93.58% and significant publication bias. That pairing is why the annotation says 'may predispose'. Dietary Triggers is PARTIAL because the FODMAP half is evidenced and the gluten half is not. Validated with `just validate`, `just count-verified-snippets` and the batched sweep.

  details: |
    Claim-evidence correctness review. The Microbiome Dysbiosis node was supported by a prevalence-and-burden snippet that says nothing about the microbiome; swapped for the sentence from the same PMID:37048642 that names gut microbiota composition. Set evidence_source IN_VITRO on four PMID:17241857 snippets describing rat dorsal-root-ganglion and mesenteric-nerve recordings, which had defaulted to HUMAN_CLINICAL. Corrected the geo:GSE36701 dataset record, whose own title says rectal mucosa while the description and tissue binding said jejunum (the jejunal study is GSE14841); retargeted to UBERON:0001052 and removed the sample_count carried over from the other study. Rebound the two microbiome datasets from NCBITaxon:9606 to NCBITaxon:408170 (human gut metagenome) and recorded that their 16S amplicon data is typed WGS only because DatasetTypeEnum has no amplicon value. Added a prevalence record (10-25% United States) from an already-cached snippet.

  summary: 'Review round: add Bile Acid Malabsorption node and bile acid sequestrant
    treatment'
  details: |
    Answered the review of PR 15559. The PMID:42462748 review lists bile acid metabolism as an IBS mechanism, and the entry had no bile acid content. Added a Bile Acid Malabsorption pathophysiology node (GO:0006699 bile acid biosynthetic process, INCREASED) backed by the Slattery 2015 SeHCAT meta-analysis (PMID:25913530; pooled 28.1% BAM in IBS-D) and the Walters 2009 FGF19 study (PMID:19426836), with a downstream edge to Diarrhea. Added a Bile Acid Sequestrants treatment (NCIT:C98148) targeting the node, from the 2025 sequestrant RCT meta-analysis (PMID:41090475). Replaced the noun-phrase snippet on Intestinal Barrier Dysfunction with the full clause, regraded it HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, and dropped the reference to the immune node from its explanation. Serotonin and carbohydrate metabolism remain without dedicated nodes.

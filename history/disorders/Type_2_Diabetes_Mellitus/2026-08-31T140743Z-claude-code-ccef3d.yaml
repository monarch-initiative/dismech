  summary: Add adipose inflammation, the FATP1 insulin-stimulated uptake arm, and
    human adipose NAMs to T2DM
  details: |
    Companion to the same session's MASLD edit, applying the Stahl laboratory's
    adipose-tissue work to the type 2 diabetes entry. Two mechanism gaps and one
    missing models section.

    Gap 1 -- adipose tissue inflammation was absent from the pathophysiology
    entirely. The Insulin Resistance node named adipose as a resistant tissue
    without saying what makes it resistant, and the only inflammation content in
    the entry sat around beta cells and pancreatic fat. Added a
    "White Adipose Tissue Inflammation" node (TISSUE) with M1 macrophages,
    crown-like structures, TNF and dysregulated lipolysis, anchored on Weisberg
    2003 (macrophage accumulation, with the human CD68 arm cited separately from
    the murine F4/80 arm), Hotamisligil 1993 (TNF neutralization restores
    insulin-stimulated glucose uptake -- an intervention, not an association) and
    the Lumeng/Saltiel review. Two downstream edges: to Insulin Resistance, and to
    the new FATP1 node.

    Gap 2 -- the entry modeled only the glucose arm of adipocyte insulin action.
    Added "Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1" (MOLECULAR,
    SLC27A1/SLC27A4) as the fatty-acid counterpart of the existing
    GLUT4/GULP1-ACAP1-ARF6 node: insulin drives FATP translocation to the plasma
    membrane within minutes, FATP1 carries the hormone-responsive component
    specifically (basal uptake is untouched in the null), and TNF-alpha suppresses
    it.

    The node is deliberately TERMINAL -- no edge into Insulin Resistance. The
    evidence is genuinely contradictory: TNF-alpha suppressing the arm reads as
    part of the insulin-resistant phenotype, but FATP1-null mice, which lack the
    arm outright, are completely protected from diet-induced obesity and insulin
    desensitization. Rather than pick a direction, the tension is carried by a new
    KNOWLEDGE_GAP discussion (kgap_t2d_fatp1_insulin_stimulated_fatty_acid_uptake)
    that states three surviving readings -- compensatory brake, pathogenic but
    confounded by lifelong adaptation and hepatic lipid redistribution, or
    timing-dependent -- and grades the FATP1-null protection REFUTE against the
    pathogenic reading. Its proposed experiment is an acute SLC27A1 knockdown in
    the human adipose MPS with and without M1 macrophages, chosen because that
    platform already validates insulin-stimulated fatty acid uptake as one of its
    three assays and because the chip has no liver compartment to mask the adipose
    readout the way the mouse does.

    New animal_models: the FATP1 knockout mouse, curated primarily for the
    protective result that bounds the node.

    New experimental_models: three human iPSC microphysiological systems.
    iADIPO-MPS MEASURES both Insulin Resistance and the FATP1 node -- its
    negative platform finding, that prior differentiation protocols yield
    already-insulin-resistant tissue, is recorded as a caution for reading insulin
    resistance out of any uncharacterized stem-cell adipose model. iMAC-iADIPO-MPS
    RECAPITULATES the new inflammation node. M1-iADIPO-iHEP-MPS RECAPITULATES
    Insulin Resistance and the inflammation node and MEASURES Hepatic Glucose
    Overproduction, whose PCK1 and insulin-suppression endpoints it reports
    directly.

    Treatments: GLP-1 Receptor Agonists gained a second target_mechanisms edge to
    the adipose inflammation node, supported by the compartment-selective chip
    result (semaglutide dosed on adipocytes alone reproduced the whole-system
    benefit; dosed on hepatocytes alone it did not), graded INDIRECT with the
    authors' own statement of why the rodent version of the experiment is
    confounded by feeding and body weight. Metformin's existing hepatic edge,
    which carried no evidence at all, gained the chip result showing metformin
    lowering PCK1 and restoring the insulin response in the hepatocyte compartment.

    Cross-entry note: the M1-iADIPO-iHEP-MPS is now curated in both this entry and
    MASLD, against different nodes. A `notes` line on the model records that and
    asks a future curator to keep the two consistent.

    Validation: linkml-validate clean; term validation passed; 86/86 snippets
    verified against the cache (32 newly added, all machine-checked as exact
    substrings before insertion); duplicate-key, entity-ref, folded-hyphen,
    snippet-length, title-snippet and snippet-grading gates clean.

    Deliberately not done: the heterochronic-serum aging chip is curated in MASLD
    but not here -- it models the same fat-liver axis and aging is the dominant
    T2DM risk factor, but it reports no glycemic or insulin-sensitivity endpoint,
    so a link would assert relevance the paper does not carry. Several other
    pre-existing target_mechanisms edges in this entry still have no evidence at
    all; only the two this session's sources actually bear on were filled, rather
    than manufacturing citations for the rest.

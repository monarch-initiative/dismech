  summary: Revise discrete_cluster_etiology evidence after OpenScientist hypothesis
    search
  details: |
    Ran an OpenScientist hypothesis search on discrete_cluster_etiology (kb/hypotheses/Type_2_Diabetes_Mellitus/discrete_cluster_etiology/openscientist.md). Its verdict was weak or partial support, with the evidence tilting toward the continuum reading. It flagged the PMID:42083025 three-cluster quote as absent from the abstract; the quote is in the cached full text (the unconstrained sensitivity analysis), so the item was kept and its explanation now says the primary analysis forced k = 4 and recovered the four subtypes. Added two continuum sources the search surfaced, after fetching and verifying them: McCarthy's palette model (PMID:28175964, REVIEW_SYNTHESIS) and Udler's finding that about 30% of patients sit in a single genetic-process top decile (PMID:30240442, INDIRECT). The report's two computational analyses are synthetic simulations whose code was not returned in the bundle, so nothing in the entry rests on them. No assessment record was written.

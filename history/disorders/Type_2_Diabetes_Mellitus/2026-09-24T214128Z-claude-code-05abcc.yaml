  summary: 'Review round 1: move the TBC1D4 allele frequency out of case_fractions'
  details: |
    Review round 1 on PR #12727.

    The TBC1D4 record carried a case_fractions block holding an allele frequency rather than a
    case fraction, with its own notes saying as much. case_fractions means the share of a disease's
    cases a gene explains, so the block asserted a quantity of a different kind under that slot. It

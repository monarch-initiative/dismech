  summary: Add myeloid lineage plasma proteomic aging clock biomarker
  details: |
    Curated the myeloid lineage aging clock from Ding et al. (PMID:42297981, Nat Med 2026) as a biochemical biomarker with a PREDICTS readout onto Beta Cell Dysfunction. Strongest cellular-aging predictor of incident type 2 diabetes in UK Biobank (HR 3.88, 95% CI 3.33-4.52), significant after adjustment for established risk factors including HbA1c, BMI, smoking and renal function. The distinctive claim, and the reason it is worth curating over a generic risk score, is that it stratifies risk among people who are still normoglycemic. The readout interpretation separates what was measured (the prognostic association) from the authors' proposed route (myeloid-derived cytokines inflaming the islet microenvironment), which is offered as consistency and must not be curated as an established causal edge. Bound to CL:0000763 myeloid cell, grounded to NCIT:C97139 Proteomic Profile. This entry had no biochemical section before. Validation: linkml-validate clean; term validation passed; reference validation --no-full-text exit 0; new snippets confirmed as exact literal substrings of the cached full text.
    Source of this curation: the Cell Reports Medicine Spotlight by Heikal & Salama
    (PMID:42612620, doi:10.1016/j.xcrm.2026.102996), which surveys Ding et al.
    All numbers were taken from the primary paper rather than the commentary.
    Companion records in the same tranche: Alzheimer_Disease (astrocyte, OPC,
    inhibitory neuron) and Amyotrophic_Lateral_Sclerosis (skeletal myocyte).

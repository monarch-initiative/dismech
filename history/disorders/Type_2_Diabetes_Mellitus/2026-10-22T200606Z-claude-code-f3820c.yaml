  summary: Wire incretin mimetic therapy to the GLP-1 receptor agonism module
  details: |
    Added a therapeutic_vulnerability pathophysiology node, GLP-1 Receptor Engagement (Incretin Mimetic Target), conforming to glp1_receptor_agonism#GLP-1 Receptor Agonist Binding and Activation, and pointed both the GLP-1 Receptor Agonists and GLP-1/GIP Dual Agonists treatments at it ahead of the disease nodes they already named. Unlike the opioid and beta-blocker cases, those treatments were already mechanism-linked; what was missing was the receptor the drugs act on, so the module had no anchor in this entry.
    Conformance is declared at the receptor step rather than against a downstream arm. For Obesity that is a deliberate restraint: PMID:42083883 finds no single dominant mechanism among the eight candidates for GLP-1 receptor agonist weight loss, so conforming Hypothalamic Dysregulation or Energy Imbalance would assert a route the evidence does not establish; those treatment links are kept because they record what the therapy improves rather than how. For Type_2_Diabetes_Mellitus the new node is kept distinct from Incretin Axis Dysfunction, which is the disease lesion (blunted GIP action, GLP-1 action relatively preserved) rather than the pharmacological engagement.
    The node carries no causal edge, and its description says why: the relation to the lesion is corrective, while a downstream edge asserts causation. Same treatment-anchor shape as the merged mu-opioid and beta-adrenergic conformers.
    Validated with just validate-disorders (206 snippets, 225 titles, 0 issues across both entries) plus the offline entity-ref, causal-target, duplicate-key, enum, block-scalar and gene-grounding gates.

  details: |
    Added an EMERGING mechanistic hypothesis, discrete_cluster_etiology, with applies_to_subtypes SIDD, SIRD, MOD and MARD, stating that the clusters are distinct pathophysiological kinds and naming the continuum reading as the competitor. Evidence: SUPPORT from the derivation study's cluster-specific genetic associations (PMID:29503172); REFUTE from the ADOPT/RECORD finding that continuous clinical features out-predict clusters (PMID:31047901) and from the Mediterranean cohort's three-cluster optimum (PMID:42083025). Added so an OpenScientist hypothesis exploration could be run against it.

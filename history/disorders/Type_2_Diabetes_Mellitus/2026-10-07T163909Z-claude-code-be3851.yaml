  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Added three diagnosis rows with LOINC measurements and ADA thresholds. HbA1c LOINC:4548-4 with normal below 5.7 percent, prediabetes 5.7 to 6.4 percent and diabetes 6.5 percent or higher; fasting plasma glucose LOINC:1558-6 with impaired fasting glucose 100 to 125 mg/dL and diabetes 126 mg/dL or higher; 2-h plasma glucose after a 75-g load LOINC:1518-0 with impaired glucose tolerance 140 to 199 mg/dL and diabetes 200 mg/dL or higher. Cited to the ADA Standards of Care 2025 classification chapter PMID:39651986 and the ADA 2010 position statement PMID:20042775. The WHO 110 mg/dL alternative IFG limit is disclosed in notes but not recorded as a range because the WHO document is not cited. No biochemical marker for HbA1c or glucose exists on the entry, so none was given a loinc_term.

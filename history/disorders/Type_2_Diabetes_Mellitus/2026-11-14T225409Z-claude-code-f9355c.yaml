  summary: Add Ahlqvist data-driven clusters as subtypes and subtype-keyed treatment
    effect modifiers
  details: |
    Added SIDD, SIRD, MOD and MARD (Ahlqvist et al. 2018, PMID:29503172) as has_subtypes rows with the new SubtypeDerivation block: boundary_type STATISTICAL_PARTITION, k-means and hierarchical clustering over six variables, derived in ANDIS (n=8980). Derivation evidence quotes the derivation abstract, the ADOPT/RECORD replication (PMID:31047901, SUPPORT) and the low bootstrap stability in a Mediterranean cohort (PMID:42083025, REFUTE). SAID was not added: it is the autoimmune cluster and belongs with LADA on Diabetes_Mellitus. No repository accession for ANDIS cluster data was found, so cluster_data is left empty with a note. Added Thiazolidinedione Monotherapy and Sulfonylurea Monotherapy treatments (ADOPT, PMID:17145742) with DISEASE_SUBTYPE effect modifiers pointing at SIRD and MARD via stratum_subtype, graded POST_HOC_SUBGROUP with interaction_tested unset because PMID:31047901 reports no drug-by-cluster interaction test; descriptions record that simple clinical features outperformed clusters for drug selection. All 151 snippets verified against cached references.

  summary: 'Gene-family review: KCNJ11'
  details: |
    The KCNJ11 record had no type and no evidence. It is now typed SUSCEPTIBILITY (germline) and cites the Finnish GWAS confirming the locus (PMID:17463248) and the E23K functional study (PMID:33568422). KCNJ11 moved from the generic Beta Cell Dysfunction node to a new upstream node, KCNJ11 E23K Reduced ATP Inhibition of the K-ATP Channel, binding ATP-activated inward rectifier potassium channel activity as INCREASED: K23/K23 beta-cell channels show decreased ATP inhibition and a raised glucose threshold for insulin secretion in a knock-in mouse (PMID:33568422). GCK and HNF1A appear only as perturbations of the Topp computational model and were not changed.

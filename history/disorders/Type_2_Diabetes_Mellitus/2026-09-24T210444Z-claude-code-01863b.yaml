  summary: Add CAPN10 and TBC1D4, dispositioned here from d2g series-030
  details: |
    Two genes from the d2g series-030 gap list (issue #12237) were dispositioned here rather than
    onto the diabetes mellitus umbrella they were listed under.

    TBC1D4, the gene behind MONDO:0014488 "diabetes mellitus, noninsulin-dependent, 5". MONDO's
    own text definition for that class is "Any type 2 diabetes mellitus in which the cause of the
    disease is a mutation in the TBC1D4 gene", so MONDO files it under type 2 diabetes and this
    entry is its home. Recorded as SUSCEPTIBILITY rather than CAUSATIVE: the Greenlandic
    p.Arg684Ter allele is common (17% allele frequency in the study population), acts essentially
    only in homozygotes, and raises risk markedly rather than being fully penetrant. It was bound
    as a genes descriptor on the Impaired GLUT4-Mediated Glucose Uptake node, which is the step
    its mechanism acts at, with two evidence items from the discovery paper: lower muscle TBC1D4
    and GLUT4 protein with increasing p.Arg684Ter dose, and severely decreased insulin-stimulated
    glucose uptake in muscle. That node previously carried only mouse GULP1/ACAP1/ARF6 evidence,
    so this adds a human genetic anchor to it.

    CAPN10, the gene behind MONDO:0011027 "diabetes mellitus, noninsulin-dependent, 1"
    (OMIM:601283). Recorded as DISPUTED. The 2000 positional-cloning report is cited so the MONDO
    class is traceable to its source, but the 2004 meta-analysis of 21 population-based and 5
    family-based studies found no significant association under additive or dominant models, and
    found the haplotype association became nonsignificant once the initial small positive studies
    were removed. A grep of data/clingen/gene_validity.csv returns no CAPN10 row for any disease,
    so no expert-panel classification exists either way. It is not wired to a pathophysiology
    node, because no mechanism in this entry is attributable to it on this evidence.

  details: |
    Addressed review of PR #13869. Split the bundled 'Ceramide and Diacylglycerol Lipotoxicity' node into 'Ceramide Accumulation' (GO:0046513; edges to Insulin Resistance and Beta Cell Dysfunction; skeletal muscle and beta cell) and 'Diacylglycerol Accumulation' (molecular function GO:0004697 diacylglycerol-dependent serine/threonine kinase activity, INCREASED; edge to Insulin Resistance only; skeletal muscle cell), each with its own PMID:42549109 quotes. Renamed the IAPP node to 'Islet Amyloid Polypeptide Oligomer Proteotoxicity' and rebound it from GO:1990000 amyloid fibril formation to GO:0051260 protein homooligomerization, because the review names soluble oligomers rather than inert fibrils as the cytotoxic species; node-level evidence now quotes that sentence. Added beta-cell cell_types. Corrected the earlier history record's links (issue vs PR). validate, validate-terms, count-verified-snippets (106/106), check-entity-refs and check-causal-targets pass.

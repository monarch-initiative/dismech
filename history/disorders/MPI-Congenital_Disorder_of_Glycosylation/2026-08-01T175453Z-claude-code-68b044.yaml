  summary: 'Create: MPI-congenital disorder of glycosylation'
  details: |
    De novo curation of MPI-CDG (MONDO:0011257, OMIM 602579, gene MPI). NEC preflight against the MONDO record - gene MPI at 15q24.1, OMIM:602579 xref, synonyms MPI-CDG / CDG-Ib / phosphomannose isomerase deficiency - confirmed the Edison/falcon deep-research report described the intended entity. Deep research was run with just research-disorder falcon MPI-Congenital_Disorder_of_Glycosylation (Edison, 588 s, 39 citations) and treated as leads only: every PMID was fetched with just fetch-reference and every snippet verified as an exact substring of the cached text. Content: a 9-node pathograph running MPI enzyme deficiency to GDP-mannose and lipid-linked-oligosaccharide depletion to protein hypoglycosylation, branching to protein-losing enteropathy, mixed coagulopathy, hyperinsulinaemic hypoglycaemia, hepatic ductal plate malformation and the neurologically spared multisystem outflow, plus an iatrogenic mannose-6-phosphate toxicity node; three conforms_to edges into the congenital_disorder_of_glycosylation module; 26 HPO-bound phenotypes with evidence-backed frequency bands drawn from the 2023 52-patient review PMID:37124179 and the 2020 consensus guideline PMID:32266963; genetics, biochemical markers, diagnosis, 8 treatments including the D-mannose BYPASSES target_mechanism, 5 differential diagnoses, 2 animal models, 2 discussions - a KNOWLEDGE_GAP on the hyperinsulinism mechanism and a HUMAN_MODEL_MISMATCH on murine mannose toxicity versus human safety - and trial NCT03404869. No GeneReviews chapter exists for MPI-CDG; the retired N-linked CDG overview PMID:20301507 carries no MPI-specific content, so the consensus guideline was used as the phenotype baseline, documented in the entry notes. Validated with just validate covering schema, terms and references: 132 of 132 snippets verified.

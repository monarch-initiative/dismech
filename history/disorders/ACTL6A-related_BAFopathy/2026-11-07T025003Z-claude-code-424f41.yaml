  summary: 'Create: ACTL6A-related BAFopathy'
  details: |
    De-novo curation of the ACTL6A BAFopathy (MONDO:0700121, ACTL6A/BAF53A hgnc:24124). Single-gene autosomal-dominant SWI/SNF (BAF) complex disorder. Primary sources: PMID:28649782 (defining 3-subject cohort, mechanism, haploinsufficiency, cell-biology), PMID:31994175 (recurrent p.Arg377Trp, dysmorphic facies + acral malformations), PMID:34906496 (independent BAFopathy exome cohort), ClinGen CGGV assertion (Moderate, AD, Syndromic Disorders GCEP). Pathograph: ACTL6A LoF -> BAF complex remodeling dysfunction -> neural-progenitor cell-cycle stall (Braun 2021, PMID:33602870: SOX2/ASCL1 accessibility loss) -> impaired neurogenesis (npBAF->nBAF switch, Yoo 2009 PMID:19561591) -> DD/ID/language delay; extra-neural BAFopathy phenotypes (digit, facial, GU, cardiac) left disconnected (no traced per-organ mechanism). ClinGen Moderate: relationship_type omitted (CAUSATIVE is defined as Definitive/Strong), tier recorded in gene_disease_validity. No GeneReviews chapter (offline+online). Deep research: openscientist (preflight-dr PASS, ACTL6A=67 mentions; report reference_validation 22/22, term_validation 32/32). The report's cell-cycle-stall/SOX2-ASCL1 mechanism (PMID:33602870, 19561591) was folded in; a report citation error (PMID:33408251 attributed to complex membership but actually a cisplatin-resistance paper) was caught and not used. Validated: validate-disorders PASS (19/19 snippets), terms/entity-refs/causal-targets/coarse/logical-rules/gene-validity/grounding/reference-titles all clean.

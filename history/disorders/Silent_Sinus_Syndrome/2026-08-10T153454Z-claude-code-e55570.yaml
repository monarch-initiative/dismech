  details: |
    Backfill for issue #8085. Four links across three exposures, entering this entry's cascade at its first two nodes. Trauma and surgery are graded together at TRIGGERS with DIRECT because a single sentence in the entry names both as acting through disruption of mucociliary clearance; that sentence is filed under the surgery exposure but names trauma explicitly, so it is reused on the trauma link rather than paraphrased. Surgery takes a second edge into ostiomeatal complex obstruction, the first node of the cascade, graded PARTIAL because the sentence is doubly hedged, saying orbital pathology may cause the occlusion which may then lead to atelectasis. Both edges are drawn for surgery because obstruction and ciliary failure are separate nodes here and the sources support each. Granulomatosis with polyangiitis is graded well below the other two at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, and the link description states the reason rather than leaving it to the grade: the entire evidence base is a single case report whose own authors describe it as the first of its kind, and the destructive sinonasal inflammation proposed as the route appears in this entry's description and in no cited sentence. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 59 of 60 with 1 pre-existing DOI-prefix skip, not on an item added here.

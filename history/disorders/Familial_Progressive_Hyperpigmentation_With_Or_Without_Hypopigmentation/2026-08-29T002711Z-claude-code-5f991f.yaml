  summary: 'Create: Familial Progressive Hyperpigmentation With Or Without Hypopigmentation'
  details: |
    New Mendelian entry for the KITLG gain-of-function pigmentary genodermatosis (MONDO:0007771, OMIM:145250).

    Deep research: falcon was requested but is not configured in this environment, so the run used --fallback and the substitution is recorded in the report frontmatter (fell_back: true, requested_provider: falcon, provider_attempts listing the falcon ProviderNotConfiguredError). The report was produced by claude_code. Its own validation flagged needs_review: true on both checks - 15 of 45 quotes unsupported, including one attributed to PMID:19375057, and two obsolete GO terms (GO:0014065, GO:0005615). No snippet and no ontology term was copied from the report. Every snippet in this entry was taken directly from references_cache and every CURIE was resolved through OAK. The report was used for coverage and for one scoping correction described below.

    GeneReviews: searched by disease name and by gene; no chapter exists, so no baseline was available.

    Pathograph: six nodes. The main chain runs KITLG gain-of-function variant in the VTNNV receptor-binding motif -> enhanced KITLG-KIT signaling in epidermal melanocytes -> upregulated MITF-driven melanogenic transcription -> increased tyrosinase activity and melanin synthesis -> progressive epidermal melanin accumulation. A sixth node covers somatic copy-neutral loss of heterozygosity at KITLG as a candidate account of the hypopigmented macules (revertant mosaicism). Confidence grading is deliberately uneven: the MITF node is PROVISIONAL because its only evidence is a base-edited cell model of one exon-4 allele, and the reversion node is HYPOTHETICAL because it rests on a single patient whose cafe-au-lait macules did not follow the same Blaschko-linear distribution.

    Scoping correction. The initial draft treated MONDO:0013648 as a labelling variant of this entry, and that was wrong. MONDO cross-references show MONDO:0013648 -> OMIM:614233, which is FPH1, a 19p13.1-pter locus with no identified gene (PMID:16709486). That is a genetically distinct disease and is now recorded as a differential rather than lumped in. MONDO:0017239 -> Orphanet:280628 carries no OMIM id and is read here as the Orphanet view of the same KITLG entity. The entry notes as an observation that MONDO currently asserts the 19p gene-unknown term as a parent of the KITLG term; no ontology change is proposed. The recessive biallelic KITLG auditory-pigmentary disorder is excluded as a separate entity and recorded as a differential.

    Treatments: only genetic counselling is curated. Cosmetic and depigmenting measures drawn from the general hyperpigmentation literature were deliberately not curated, because none has been reported in this disease and extrapolating them would manufacture a treatment section out of inference. KIT inhibition by imatinib is the mechanistically obvious idea and is confined to prose for the same reason.

    Datasets: none curated. No repository dataset exists for this disorder, and a gene-based search on KITLG would surface testicular germ cell tumour and pigmentation GWAS rather than this disease - the Named Entity Confusion case CLAUDE.md warns about - so dataset discovery was not run.

    Validation: just validate-disorders passes (schema, terms, and references); 45/45 snippets verified against the local cache; check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all clean. Weighted compliance 84.4%; the remaining gaps are datasets and evidence slots on external_assertions and proposed_experiments.

    Pre-PR adversarial review. A red-team pass over the finished entry found defects that the
    validators cannot see, and the entry was reworked before any PR was opened. The substantive
    ones: (a) eleven evidence items carried a reference_title that paraphrased PMID:33407466's
    content rather than quoting its title - only PublicationReference.title is machine-checked, so
    this passed validation; (b) a phenotype asserting the disease is skin-limited contradicted the
    entry's own oral-mucosal-pigmentation phenotype and generalised a single-pedigree negative to a
    VERY_FREQUENT disease-level claim - it was deleted and replaced with a KNOWLEDGE_GAP discussion
    presenting both the negative series and the contrary reports; (c) the node asserting that the
    mutant ligand engages KIT more effectively than wild type was graded ESTABLISHED while every
    evidence item attached to it tested the wild-type axis - the affinity increase is inferred from
    homology modelling and no binding or receptor-activation assay on a mutant ligand exists, so the
    node was downgraded to PROVISIONAL and the top-level description was rewritten to stop stating
    it as measured fact.

    Also corrected in that pass: HP:0000163 replaced by HP:0010284 (Intra-oral hyperpigmentation)
    for the oral phenotype; GO:0048066 (a developmental-process term) replaced by GO:0043473 for a
    node about lifelong postnatal progression; the bundled "Increased Tyrosinase Activity and
    Melanin Synthesis" node split into a MOLECULAR and a CELLULAR node per the single-value
    biological_scale discipline, both downgraded to PROVISIONAL given one paper, one allele, and
    exogenous ligand on an A375 melanoma line; the grafted-skin evidence re-graded IN_VITRO ->
    MODEL_ORGANISM and its explanation corrected to say the review is summarising work it cites;
    the disconnected reversion node wired into the graph; guessed frequency bands dropped from four
    phenotypes where no denominator exists in the literature; two Experiment would_support targets
    repointed off genetic#KITLG, where the proposed outcome could not bear on them; a structural
    claim over-extended from p.Glu113Lys to p.Ser78Leu narrowed to its source; the FPH2 synonym
    added and the "melanosis universalis hereditaria" collision with MONDO:0013648 recorded.

    Added on the review's prompting: a histopathology section, attributed carefully because the
    family it comes from (PMID:29186243) was screened for KITLG and had no mutation - so it is
    quoted for the tissue-level finding and, separately, as the concrete instance behind the
    locus-heterogeneity claim. Two review findings were not actioned: the suggested Kitlg mouse
    model could not be curated because PMID:41584853's cache body is empty, and no
    experimental_models or animal_models section was added for that reason.

    Post-review validation: just validate-disorders passes; 49/49 snippets verified; all six
    ungated checks clean. Weighted compliance moved 84.4% -> 81.7%, which reflects removing an
    over-claimed phenotype and adding sections with genuine gaps rather than a regression.

  summary: 'Create: Inherited_Prekallikrein_Deficiency'
  details: |
    New Disease entry for inherited prekallikrein deficiency (MONDO:0012901, KLKB1). Eight pathophysiology nodes form one chain from biallelic KLKB1 loss of function to the plasma deficiency, the loss of kallikrein feedback activation of factor XII, the rate-limited factor XII autoactivation that remains, the prolonged aPTT, and the preserved hemostasis that explains the absent bleeding phenotype, with branches for bradykinin generation, in vitro fibrinolysis and the murine thromboinflammation protection. Four phenotypes, three of them wired to a mechanism node. KLKB1 carries a copied ClinGen DEFINITIVE gene_disease_validity assertion (CGGV:assertion_ada3e3e0, AR, Hemostasis/Thrombosis GCEP) quoted from its cached record, plus four variant rows. Thrombosis is deliberately not a phenotype: it and the hypertension/cardiovascular association are recorded as two discussions, one HUMAN_MODEL_MISMATCH and one KNOWLEDGE_GAP, with an EMERGING mechanistic_hypotheses group for the bradykinin vascular-tone proposal. One OpenScientist deep-research report was used (completed, 19/19 references resolved, term_validation needs_review true for one obsolete GO term and four label variants, none of which were bound; preflight-dr WARN only because PK, the abbreviation of the disease protein itself, outranks KLKB1 on mention count, with OMIM 612423 matching). Validated with validate, validate-terms, validate-disorders (102/102 snippets verified), count-verified-snippets, check-genereviews (no chapter), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-grading, check-retired-support-prose, check-shared-disease-terms, check-gene-validity, list-gene-term-mismatches and check-term-cache-integrity.

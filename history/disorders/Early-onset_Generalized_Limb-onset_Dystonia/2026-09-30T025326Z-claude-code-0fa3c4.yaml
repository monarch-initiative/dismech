  summary: 'Review round: GeneReviews management, D216H modifier, diagnosis block'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #13194: three blocking items and every
    supportable suggestion. Evidence count 71 -> 90 snippets, all exact substrings of
    fetched caches (90/90 verified). No cache/*.csv churn: every ontology term bound in
    this round was already present in the label and enum caches.

    Blocking 1, GeneReviews tagging. `just check-genereviews` reported CITED_UNTAGGED for
    PMID:20301665. `just tag-references` had already been run against the entry before this
    session and had added the top-level `references:` block; re-running it confirmed the
    tag is canonical ("Already correctly tagged: 1", no files modified) and
    `just check-genereviews` now reports GeneReviews TAGGED, EXACT via 'DYT-TOR1A'.

    Blocking 2, GeneReviews Management section mined. It had been used only for clinical
    description and genetics. Added: the chapter's early-referral recommendation as evidence
    on the pallidal DBS treatment, which until now rested only on a single-centre outcome
    series (PMID:22811083), plus the chapter's separate statement that a movement disorder
    specialist should be involved early; two new supportive treatments, Physiatry and
    physical therapy (NCIT:C15302, BEHAVIORAL) and Occupational therapy (NCIT:C121351,
    BEHAVIORAL), each pathograph-linked; and the "agents/circumstances to avoid" caution
    modelled as an `environmental:` record with influences_mechanisms
    EXACERBATES -> Limb-onset dystonia. The environmental route was chosen over a treatment
    note because the caution is an exposure with a direction of effect acting on a named
    node. It carries entry-level evidence, so `check-environmental-evidence` passes without
    a waiver.

    Blocking 3, the false negative claim about penetrance modifiers. The
    dyt1_reduced_penetrance_determinants discussion asserted that no genetic modifier had
    been established. It had. Per the reviewer's instruction not to rely on their citation,
    the primary paper was located by independent PubMed search and fetched with
    `just fetch-reference PMID:17503336`; its title
    ("Intragenic Cis and Trans modification of genetic susceptibility in DYT1 torsion
    dystonia.", Risch, Bressman, Senthil, Ozelius, Am J Hum Genet 2007) and content were
    read from green open-access PMC full text before anything was quoted. Added a
    `genetic:` record TOR1A p.D216H, relationship_type MODIFIER, variant_origin GERMLINE,
    bound to hgnc:3098 (the same gene as the causative record, deliberately - the modifier
    is intragenic), with three exact-quote evidence items. Reworded the discussion to
    withdraw the claim explicitly rather than quietly soften it, and gave it its own
    evidence: the study's statements that 216H "explains only a small proportion of the
    reduced penetrance" and that nearly all manifesting carriers were D216 homozygotes, so
    the variable-expressivity question is untouched by the modifier. The gap remains a real
    gap, now for the reasons the primary study gives. Also added
    attaches_to: genetic#TOR1A p.D216H.

    Two further papers on D216H were fetched during this round (PMID:19380705,
    PMID:21322026) and are deliberately NOT cited and NOT committed: both returned
    content_type unavailable with an empty body, so neither has a quotable sentence. Their
    titles were not used as findings and no claim about their contents was written into the
    entry. Note for a future pass that PMID:21322026's scope, as its title states, is
    penetrance in DRD and general modification in primary dystonia, neither of which is the
    DYT1 GAG-deletion-carrier question Risch measured.

    Suggestions taken. Added a `diagnosis:` block (targeted TOR1A molecular genetic testing,
    NCIT:C15709 Genetic Testing) carrying both the diagnostic criterion and the >98%
    single-allele fact that makes targeted testing adequate here. Added Status dystonicus as
    a phenotype - the one life-threatening state in a disease that is otherwise
    non-degenerative with normal life span. Added Joint contracture (HP:0034392),
    Kyphoscoliosis (HP:0002751) and Hip dislocation (HP:0002827) as sequelae of Generalized
    dystonia, which the chapter names as what timely treatment prevents; all three are
    causally connected, taking the entry from 2/7 to 5/10 phenotypes with a causal inlink.
    Added the adult-onset tail (about 5% after age 30) as evidence on Limb-onset dystonia
    plus a structured onset descriptor (onset_category CHILDHOOD). Replaced the
    perinuclear-blebs readout snippet: it was the four-word fragment "whereas they lack the
    perinuclear", justified by an explanation claiming the source's internal quotation marks
    ended the quotable span. They do not - a single-quoted YAML scalar carries them - so the
    complete clause is now quoted and the false justification is withdrawn in place. Added
    the missing reference_title on the clinical_trials evidence item, copied verbatim from
    the cache frontmatter (the registry's German official title, not a translation).

    Also, unprompted but adjacent: the Reduced Striatal Dopamine Release node asserted in
    prose that levodopa does not increase dopamine release in these mice with no citation.
    Sourced it from PMID:30707939's own result sentence, reproducing the source's
    small-capital "ʟ-DOPA" verbatim.

    Decisions against change, each recorded in the entry where it applies rather than only
    here. (1) No levodopa-trial diagnostic item: the GeneReviews chapter does not mention
    levodopa at all, and the only fetched source that does is a mouse study whose levodopa
    content is a methods paragraph plus a release measurement - adding the item would have
    meant asserting a diagnostic pathway from a mouse experiment. (2) Status dystonicus is
    left unbound: HPO has no term. Searched l~dystonicus, l~status dystonicus,
    l~dystonic storm, l~dystonic crisis, l~dystonic attack through ols:hp, all empty, with
    l~dystonia on the same adapter returning 17 terms as a positive control so the negative
    is about HPO and not the adapter. HP:0001332 Dystonia was rejected on positive grounds.
    (3) Its frequency band is also omitted: the source says only "can occur but is not
    common" and every FrequencyEnum band carries a numeric range, so choosing one would
    manufacture a figure. (4) The immobilization exposure is left unbound: ten ECTO searches
    recorded on the record, with l~arsenic returning seven terms as a positive control;
    l~plaster does return ECTO:7000038 but that branch is plaster as a building material,
    not a limb in a cast. (5) The prevalence record keeps measure_type CARRIER_FREQUENCY
    while its notes now state that the source resolves neither reading - the quoted sentence
    says only that "this dominant mutation" has a "current high frequency" and closes on
    "disease allele frequencies", and PrevalenceMeasureEnum has no allele-frequency value
    (all eight permissible values checked). Changing it to UNKNOWN would have discarded a
    magnitude the source does support. The stale sentence this created in the entry's
    top-level `notes:` ("the Ashkenazi carrier frequency") was corrected in the same pass.

    Gates. validate, count-verified-snippets (90/90), validate-terms, validate-disorders,
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, check-environmental-evidence, check-genereviews, check-folded-hyphens
    and validate-history-all all pass. check-snippet-grading, check-snippet-length and
    check-title-snippets report findings on main content this branch does not touch
    (Bachmann-Bupp_Syndrome, Leishmaniasis, Avoidant_Restrictive_Food_Intake_Disorder,
    AA_Amyloidosis, Autosomal_Recessive_Spinocerebellar_Ataxia_15, Cholera,
    Complex_Hereditary_Spastic_Paraplegia, Cranioectodermal_Dysplasia); this entry is clean
    in all three, verified per-file, and no baseline was touched.

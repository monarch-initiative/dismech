  details: |
    Second review round on PR #13194. The re-review confirmed the three original blocking items
    fixed and raised one remaining finding; a failing CI gate the review had not flagged was found
    separately. Two changes, nothing else touched.

    1. Removed review-round narration from KB content (issues #8908, #12535 -- `notes:` is not a
    session log). Four locations, applying the reviewer's test: would a curator who has never seen
    the PR thread lose a fact about DYT1?

      - Top-level `notes:`: deleted the three trailing paragraphs beginning "Review round, PR
        #13194.", "Four judgements in that round went against making a change" and "Two corrections
        were made to first-pass content". Deleted rather than moved into this target's earlier record
        (2026-09-30T025326Z-claude-code-0fa3c4.yaml), because that record already carries every fact
        in them and in more detail: its "Blocking 1/2" paragraphs cover the GeneReviews mining and
        tagging, its "Decisions against change" block covers all of the judgements (five, not four --
        the entry's prose had merged the status-dystonicus binding and its frequency band), and its
        "Blocking 3" and "Suggestions taken" paragraphs cover both corrections. That earlier record
        is therefore unedited; nothing needed carrying over.
      - dyt1_reduced_penetrance_determinants `rationale`: deleted "An earlier version of this
        discussion stated that no genetic modifier had been established, which was wrong, and the
        claim is withdrawn here rather than quietly softened." The two sentences before it state the
        modifier, its direction, its phase dependence and the derived penetrance figures, so the
        positive claim stands on its own.
      - Perinuclear-blebs readout `explanation` (PMID:33468570): deleted from "An earlier version of
        this item quoted only..." to "...is withdrawn", leaving "Records the negative finding in
        full: the human patient-derived motor neurons lack the lesion that defines the mouse models."
      - TOR1A p.D216H `review_notes`: deleted "It was not taken on trust from a citation supplied in
        review." The preceding sentence -- how the paper was located, the fetch command, and that its
        title, journal, year and content were read before quoting -- is a recorded search and stays.

      One clause the reviewer did not name was trimmed as the same defect: the TOR1A p.D216H
      `description` closed "That is recorded on the dyt1_reduced_penetrance_determinants discussion,
      which this record reworded rather than removed." The trailing clause describes an edit to a
      previous version; the cross-reference before it is content and is kept.

      Everything else the reviewer explicitly asked be left alone was left alone: the in-place
      records on `diagnosis:` notes, the status dystonicus and environmental `review_notes`, and the
      prevalence notes all record searches or reasons attached to the thing they concern. A sweep for
      "review round", "earlier version", "first pass", "this round", "withdrawn", "reworded" and
      "supplied in review" now returns only four disease-content hits ("initially ... triggered by
      specific actions", "the originally affected limb", "an initially good response").

    2. Fixed the failing "Check for newly ungrounded genes" gate. `check_gene_activity_grounding.py
    --against-ref origin/main` reported TOR1A here: the `genes:` descriptor sits on 'Heterozygous
    TOR1A GAG Deletion', which carried genetic_context, cell_types and downstream but no
    `molecular_functions:`, while the adjacent downstream node 'Impaired TorsinA AAA+ ATPase
    Function' already bound GO:0016887. So the gene-to-molecular-function step the gate exists to
    require was one edge away from the gene. Bound GO:0016887 on the variant node itself rather than
    moving the gene downstream: TOR1A encodes torsinA, so the node about a variant in that gene
    legitimately carries that protein's molecular function, and moving the gene would have broken the
    pathograph's genetic entry point. Same shape as PR #13197 (HyperPP/SCN4A).

      Term choice. GO:0016887 'ATP hydrolysis activity' verified twice in the same step as writing
      it: `runoak -i ols:go info GO:0016887` returned 'ATP hydrolysis activity', and
      `runoak -i sqlite:obo:go info GO:0016887 -O obo` returned the same name with an intact
      definition and no obsoletion marker. Already in cache/go/terms.csv and in the
      molecularfunctionterm enum cache, so it validates offline. Searched for something more specific
      to torsinA's actual defect and found none: `descendants -p i GO:0016887` on the local
      sqlite:obo:go build returns the term itself and nothing else, so it is an is-a leaf and there is
      no narrower ATP-hydrolysis term to bind; `search "torsin"` on ols:go returns nothing at all,
      with `search "ATP hydrolysis activity"` on the same adapter returning five terms as a positive
      control, so that miss is the adapter answering rather than failing. `preferred_term` carries the
      specificity the GO label lacks ('cofactor-dependent torsinA ATP hydrolysis'), matching the
      adjacent node verbatim.

      Modifier. `modifier: DECREASED`, not LOSS_OF_FUNCTION. The claim is quantitative in CLAUDE.md's
      sense: the near-full-length mutant protein is impaired in the rate of the cofactor-driven
      hydrolysis cycle, it is not a process escaping its regulatory constraints, so DECREASED is the
      default and it keeps the PATO:0002301 grounding that the qualitative values would trade away.
      This is the mirror image of PR #13197, where GAIN_OF_FUNCTION was right because fast
      inactivation *is* the constraint and the lesion removes it. DECREASED also matches the modifier
      already on GO:0016887 at the adjacent node, so the two nodes make one consistent claim about
      one activity.

      The node's pre-existing genetic_context.functional_impact_category: LOSS_OF_FUNCTION is left in
      place and now co-occurs with the modifier. CLAUDE.md permits this and #13197 established it here:
      the category describes the allele's consequence and sits beside its own allele_type,
      variant_origin and zygosity, so it was not added to carry a value; the modifier describes the
      resulting activity state. They are not in tension -- a loss-of-function allele whose product
      retains reduced activity is exactly this disease.

      Evidence. One item added on the pathophysiology node, since MolecularFunctionDescriptor inherits
      from Descriptor and has no evidence slot. PMID:33468570, already cached and cited elsewhere in
      this entry: "It is caused by a heterozygous mutation in Torsin A (TOR1A), a gene encoding a
      membrane-embedded ATPase." -- an exact substring of the cached body, ASCII only, quoted nowhere
      else in the file. It carries the half of the binding the gate is about (this node's gene encodes
      an ATPase), so directness is INDIRECT rather than DIRECT: it asserts the gene-to-activity link,
      not the reduction, which the conserved-region glutamate-loss item above it and the cofactor-cycle
      evidence on the next node carry. Graded HUMAN_CLINICAL with quote_role BACKGROUND -- the sentence
      states the human genetic aetiology, but it is this in-vitro paper's framing of established
      genetics rather than its own result, which is the exact case #10262 added quote_role for. Other
      PMID:33468570 items in the file are IN_VITRO on different sentences; check-snippet-grading is
      keyed on the quoted sentence and reports no new divergence.

    Gate output. Before: 4 findings (TOR1A here, plus DCLRE1C/RAG1/RAG2 in
    Severe_Combined_Immunodeficiency). After: 3, the SCID ones only. Those are not a backlog and are
    not this branch's: `git log origin/main..HEAD -- kb/disorders/Severe_Combined_Immunodeficiency.yaml`

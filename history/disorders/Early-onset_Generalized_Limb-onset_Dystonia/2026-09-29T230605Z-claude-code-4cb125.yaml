  summary: 'Create: DYT1 early-onset generalized limb-onset dystonia'
  details: |
    Curated early-onset generalized limb-onset dystonia, DYT1 (MONDO:0007492), caused by the in-frame TOR1A GAG deletion removing a glutamate from torsinA. Fills the gap among the nine dystonia entries already in the knowledge base; DYT1 is the most common inherited early-onset generalized dystonia. Models reduced (~30%) penetrance explicitly rather than glossing it, and pallidal deep brain stimulation as the defining intervention. 71 evidence snippets, all exact substrings of fetched reference caches (71/71 verified by validate-disorders). Gene binding hgnc:3098 confirmed as TOR1A by bidirectional OAK lookup rather than taken from the issue body. Deep research used the claude_code provider after the Edison account returned HTTP 402; only 6 of that report's 16 cited PMIDs had disease-relevant titles, so citations were re-derived independently.

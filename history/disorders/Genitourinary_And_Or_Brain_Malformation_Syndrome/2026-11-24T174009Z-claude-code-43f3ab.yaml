  summary: 'Review round 1: GUBS (PPP1R12A)'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED. Renamed to the GeneReviews gene-specific name (PPP1R12A-Related Urogenital and/or Brain Malformation Syndrome). De-bundled the myosin node into 'Excess Actomyosin Contractility' (contractility quotes: zebrafish high pMRLC, overactive-myosin rescue), with the activity drop staying on the LoF node. Corrected the gut model: PMID:41805950 is a medaka (Oryzias latipes) mutant, not zebrafish, and its atresia arises from epithelial disorganisation 'without alterations in cell motility', so the intestinal node is rerouted from the contractility node rather than the migration node, and the medaka mutant is added as a second animal model (RECAPITULATES the intestinal node). Retyped the zebrafish divergence SPECIES_MISMATCH->INCOMPLETE_PHENOTYPE (the study did not examine the human sites, which fish possess). Added strabismus, microphthalmia and feeding-difficulty phenotypes (GeneReviews); mined GeneReviews for the diagnosis statement and for genetic-counseling (AD/de novo, 1% sib recurrence) and supportive-care evidence. Softened two unquantified frequencies. ACC left in description only (no citable abstract quote; Hughes has no PMC full text). 36/36 snippets verified; validate-disorders/terms/causal-targets/name-collisions/snippet-length clean.

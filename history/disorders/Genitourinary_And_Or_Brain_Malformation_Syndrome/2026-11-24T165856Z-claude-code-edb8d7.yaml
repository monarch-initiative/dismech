  summary: 'Create: Genitourinary and/or Brain Malformation Syndrome (PPP1R12A)'
  details: |
    De-novo curation of PPP1R12A/MYPT1-related genitourinary and/or brain malformation syndrome (GUBS; MONDO:0032934, OMIM 618820) from a claude_code deep-research report (preflight WARN was only AMH, the anti-Mullerian hormone of the genital phenotype, not a second disease). Mechanism: heterozygous LoF -> MYPT1 haploinsufficiency -> reduced myosin phosphatase activity / excess actomyosin contractility -> disrupted cell migration and epithelial morphogenesis, branching to forebrain (holoprosencephaly), genitourinary (46,XY DSD, gonadal dysgenesis, persistent Mullerian derivatives, hypospadias) and gut (intestinal atresia). AD inheritance; ClinGen Strong copied with its CGGV row; GeneReviews chapter tagged as the phenotype baseline. Zebrafish mypt1 mutant recorded as RECAPITULATES the contractility mechanism with a SPECIES_MISMATCH divergence. 26/26 snippets verified; validate-disorders, validate-terms, causal-targets, name-collisions, logical-rules, coarse-phenotypes, gene-activity-grounding, delivery-system, enum-values, duplicate-keys, entity-refs, model-scale-audit all clean.

  summary: Review BMP2 clinical evidence and distinguish human
    haploinsufficiency from knockout models
  details: |
    Reviewed the original KB, all five prior histories, the matching deep-research narrative and citation sidecar, and the available primary sources. Eligibility: Mendelian BMP2 disorder, no prior REVIEW, outside infectious/environmental exclusions. Rebased onto origin/main at da303fc58b617d298f5e207c56fb6cb20498b463 before edits.

    Eight-dimension assessment:
    1. Phenotypes: adequate after expansion from 32 to 53 entries. Recovered human rib, airway, skeletal-maturation, spine, facial, dental and cardiac findings from the 2017 full text and 2025 tables. Added 21 phenotypes. Removed frequency bands inferred from single cases or unspecified denominators. Combined table categories do not establish the frequency of each component. The 2025 hearing and scapula summary counts disagree with individual table cells, so no precise frequency is assigned to those features.
    2. Subtypes: no established BMP2 molecular subtypes were identified. Kept SCUBE3-related SSFSC2, regulatory-duplication-associated BDA2 and larger contiguous deletions as differentials. The 2025 31-gene deletion case (PMID:41282487) does not justify assigning seizures or metabolic findings to isolated BMP2 loss.
    3. Pathophysiology: adequate after correction. Replaced generic/other-disease signaling support with measured mandibular pSmad1/5/8 and pp38 results from PMID:30413887. Added separate p38 and neural crest chondrogenic-progenitor nodes. Removed the inappropriate migratory cranial neural crest cell binding. Complete lineage-specific and combined Bmp2/Bmp4 knockouts do not establish the magnitude of human haploinsufficiency, universal compensation, or a severity upper bound. Scoped limb chondrogenesis results, cardiac cushion findings, mechanical palate rescue and the speculative human osteolysis link. Corrected failed dorsal cervical vertebral fusion, which had been described as excessive fusion. Retained negative heterozygote long-bone and mechanical readouts. Added three experimental systems for patient RNA, palate rescue and chick AV coculture.
    4. Treatments/trials: adequate for available clinical evidence. Added reported cardiac ablation, physical/occupational therapy, mandibular distraction and scoliosis surgery. Growth hormone response remains a single multigene-deletion observation; another cohort patient received GH despite normal testing. No disease-modifying efficacy is inferred. ClinicalTrials.gov API v2 returned HTTP 200 and zero studies for the condition queries '"BMP2-related"', '"BMP2 haploinsufficiency"', and '"short stature facial dysmorphism"' on 2026-09-27. These bounded searches do not claim that no broader BMP2-related trial exists.
    5. Genetics: adequate. Captured five representative splice/nonsense/frameshift variants, the somatic and germline paternal mosaicism finding, negative routine blood sequencing followed by variant-specific testing in other tissues, and patient RNA splice products. Nonsense-mediated decay and an exact 50% secreted ligand reduction were not measured. In the BDA2 differential, full-text PMID:19327734 shows reporter enhancer activity but only proposes increased or ectopic endogenous BMP2 expression from the duplication.
    6. Diagnostics: adequate. Retained sequence/CNV diagnosis, endocrine and hearing evaluation; added ECG and echocardiographic follow-up. A case's annual echocardiography is not a universal interval. Removed unsupported assertions about normal cognition, normal lifespan and progression/onset of osteolysis. Discordance among relatives with the same deletion does not exclude a deletion contribution to developmental delay.
    7. References: consumed the full scientific text, tables and available figure/supplement captions of the major cached sources, including PMID:19116164, 17194222, 30413887, 21671386, 22965927, 33247540 and 39970956. Recovered the 2017 defining paper through its PMC URL using just fetch-reference when PMID fetching returned only the abstract; its generated HTML cache is included. Refetch recovered full PMID:19327734 and the missing 2025 tables. PMID:37125634 publisher HTML/PDF retrieval returned 403; PMID:16314491 and 40285376 remain abstract-only. No GeneReviews chapter matched the repository Bookshelf index dated 2026-09-10. Searches of all cited cached texts found no GEO/SRA/ArrayExpress/PRIDE or NCT accessions to curate; this does not assert no unexamined repository record exists. No retired dataset-accession blob was read or restored.
    8. Overall consumption: central genetic, clinical and mechanistic themes are covered. Other-gene mechanisms and multigene-deletion-specific metabolic/neurological claims were not imported as BMP2 causation. The newer cartilage/EGFR study was a secondary mechanistic lead, not necessary to establish the directly documented neural crest chondrogenic defect; its unused cache is excluded.

    All added evidence items carry source titles. Snippets are exact cached passages, with explicit ellipses where HTML markup interrupts table rows or italic gene names. Caches were generated exclusively with just fetch-reference. Validation: authoritative just validate-disorders passed schema, terms and all 155 snippets/173 titles, with zero skipped/unavailable references or issues. Entity and causal target checks, coarse-binding checks and snippet boundaries passed. History schema passed. All four whole-repository evidence ratchets passed: snippet length, grading, title snippets and reference titles. Pre-commit formatters were applied and parsed YAML semantic equivalence verified; codespell passed.

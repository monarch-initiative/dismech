  summary: 'Create: BMP2-Related Short Stature-Facial Dysmorphism-Skeletal Anomalies
    Syndrome'
  details: |
    Created MONDO:0100297 (SSFSC1, OMIM 617877, BMP2 haploinsufficiency) from the curation stub, which is deleted in the same change. Deep research: falcon was requested but its EDISON_API_KEY returns 403 (providers --check reports UNREACHABLE); the run was re-issued with --fallback so the substitution is recorded by the run rather than chosen by hand. The entry as committed is built from primary literature retrieved directly via the PubMed E-utilities API, not from a deep-research report. Anchors: PMID:29198724 (defining 12-patient series), PMID:39970956 (2025 seven-patient cohort, full text cached), PMID:21671386 (20p12.3 deletion cleft palate series), PMID:40285376 (osteolysis case), plus mechanism sources PMID:30413887 (Wnt1-Cre cranial neural crest conditional KO), PMID:17194222 (limb BMP2/4/7 genetics), PMID:16314491 (AV cushion EMT), PMID:17099713 (fracture-healing requirement), PMID:19327734 (BDA2 enhancer duplication), PMID:33308444 (SCUBE3 as BMP2 co-receptor), PMID:28586151 and PMID:37572998 (contiguous-gene and laterality caveats). No GeneReviews chapter exists for BMP2 or SSFSC1; PubMed searches for both returned nothing, and the absence is recorded in the entry notes. Named Entity Confusion was the main hazard and was handled explicitly: MONDO:0100297 (SSFSC1) versus MONDO:0030953 (SSFSC2, SCUBE3) differ only by a trailing digit and are separated by OMIM number throughout; brachydactyly type A2 is a BMP2 enhancer duplication and therefore mechanistically opposite; and Alagille/JAG1, hypopituitarism/PROKR2 and Wolff-Parkinson-White are contiguous-gene phenotypes of larger 20p12 deletions. All three are curated as differential diagnoses rather than as BMP2 phenotypes. No datasets curated: just discover-datasets returned 12 candidates, all GENE_ONLY with zero DIRECT, the top hit being a glioma cell line treated with recombinant BMP2; the negative result is recorded in notes. Two module conformances declared against pharyngeal_arch_patterning_serial_homology (trigger and consequence nodes); its central-effector node is deliberately not claimed because it is written around arch-identity mis-specification, which BMP2 does not show. Validation: just validate passes, just validate-disorders passes with 84/84 snippets verified against the cached references, term validation passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens all pass. linkml-data-qc reports 91.7 percent global compliance.

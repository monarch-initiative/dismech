  details: |
    Acts on the re-review of 1ab8f8e6b, which confirmed both previous blocking items fixed and all three suggestions taken, and raised one new blocking finding against the rib paragraph that commit added. The reviewer is correct and the finding is mine. My notes paragraph asserted that the only rib sentences in the reference cache concern the 13th rib of Bmp4 mutant mice and dismissed them as a different gene, a different rib and a different species. Reading the full sentence at references_cache/PMID_19116164.md line 66 shows the Bmp4 clause is prior art cited only to define the assay (Goldman et al. 2006), and the result the sentence actually reports is in Bmp2 heterozygotes: defects in formation of the 13th rib in 77 per cent of skeletons and cervical vertebral fusion in 33 per cent, n equals 9. So the genotype is the exact one this disorder has, not a different gene. The cause of the error was mechanical and worth recording because it has now happened twice in this entry: I grepped with a pattern that split on sentence-ending periods, read the first returned fragment as the whole finding, and asserted a conclusion the full sentence contradicts. The scoliosis error in the first review round had the same shape. Both times the false claim went into prose that renders on the disorder page, where it would have told a future curator not to look. Two changes follow. First, the notes paragraph is rewritten to state what the sentence actually reports, to record that the earlier text was a misreading rather than silently replacing it, and to give the correct reason the human rib count stays uncurated, which is that model-organism evidence must not be the sole support for a human phenotype rather than that the cache is silent. It also notes that mice carry 13 rib pairs and humans 12, so loss of the terminal pair is the species-appropriate counterpart of the human reduction. Hip dysplasia, coxa vara and osteopenia remain the genuinely silent cases and the paragraph now says so separately. Second, the measurement is promoted to an ExperimentalReadout on the modeled_mechanisms link of the existing Heterozygous Bmp2 knockout mouse, which previously rested only on PMID:29198724's qualitative statement of similarity to the human phenotype. This is the entry's only dose-specific skeletal measurement in a simple heterozygote, every other skeletal result being from a compound Bmp2 Bmp4 conditional knockout, so it grounds the haploinsufficiency link quantitatively rather than by resemblance. The snippet was extracted programmatically from the cache to preserve the unicode minus sign in the Bmp2 minus slash plus genotype string. On the reviewer's minor point that the clinodactyly and thin-upper-lip snippet from PMID:33247540 is an introduction sentence summarizing Tan et al. rather than a finding of that paper: I checked PMID:29198724's cached text for both features and neither appears, so there is no primary source to cite instead and the binding stays as is. Validation after changes: just validate passes with 109 of 109 snippets verified, term validation passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens and check-snippet-length all pass.

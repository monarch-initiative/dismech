  summary: 'Integrate later deep-research run: missense allele class, spectrum expansion,
    and two corrections'
  details: |
    A second openscientist run (the requested falcon provider 403'd again; the run fell back and recorded it) completed after the previous commit and carried better provenance than the report already committed: a machine-readable reference_validation and term_validation frontmatter block, a template_sha stamp, and 20 citations against 16. The committed report was replaced with it. Its two flagged unsupported quotes are both the report's own ellipsis-shortened renderings of sentences present verbatim in the sources, not fabrications; one matches an evidence snippet used in this entry word for word, which independently confirms that snippet. Reading its citations found a real gap and produced two corrections to claims this entry had asserted. First, PMID:37125634 (Genetics in Medicine 2023, an international 18-patient cohort) was missing entirely. It establishes monoallelic missense variants as a third disease-causing allele class, functionally validated in a zebrafish bmp2b ventralization assay, which means a negative deletion screen does not exclude the diagnosis; the genetic block, the prevalence count and a new zebrafish variant-function model entry now reflect that. It also adds neural tube defects, structural brain anomalies and endocrinopathies to the phenotype spectrum, curated at the lowest frequency band because the source gives no denominator. Second, PMID:33247540 overturns two positions taken in the previous round. Scoliosis, which the red-team review had correctly removed because the only cached mention was a JAG1/Alagille sentence, is reinstated: this patient has progressive thoracic scoliosis requiring surgery at 13 with an intragenic de novo BMP2 nonsense variant and no deletion, so no neighbouring gene explains it. Wolff-Parkinson-White, which this entry had excluded as a contiguous-gene phenotype of the wider 20p13p12 interval, occurs in that same intragenic-variant patient and is now curated as a rare cardiac phenotype rather than excluded; the differential-diagnosis entry and the notes were rewritten accordingly. The same report adds bicuspid aortic valve with aortic root and ascending aortic aneurysm, curated as a left-ventricular-outflow arm distinct from the atrioventricular cushion mechanism the rest of the cardiac chain runs through, and marked as resting on a single human observation rather than on a traceable mechanism. PMID:10362015 was added for the cushion mechanism: an antisense loss-and-rescue experiment in chick explant culture, plus the finding that BMP2 enhances rather than independently induces TGF-beta-driven transformation, which is a plausible reason cardiac penetrance is incomplete. Citations about other genes and disorders in the report (BMPER, BMPR1B, Dubowitz, Robinow) were deliberately not used as Named Entity Confusion risks. None of the report's ontology suggestions were adopted; term validation matched 1 of 4 checked labels, and it offered NCIT:C15192 as Speech Therapy when that code is Blood Transfusion. Two defects in my own work were caught by the gates and fixed before commit: a folded-scalar hyphen split across a line break, and one sentence graded HUMAN_CLINICAL in the genetic block and MODEL_ORGANISM in the animal-model block, which was resolved by quoting the cohort sentence in one place and the zebrafish sentence in the other rather than a snippet spanning both. Uncited reference caches pulled in by the report's own validator were pruned after re-deriving the cited-PMID list, and snippet verification was re-run on the pruned tree. Validation: just validate-disorders passes with 106/106 snippets verified, term validation passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all pass. Compliance 89.2 percent.

  details: |
    Acts on the ai4c-reviewer review of head 8eaf03d5, which requested changes on two internal-consistency findings and offered three suggestions. All five are addressed in this one push, at the reviewer's explicit request to bundle. Finding 1, the Congenital heart disease description asserted that no arrhythmia is curated as a BMP2 phenotype and that no cited source supplies rhythm evidence in a patient with an intragenic variant. Both halves were false as of the previous commit: Wolff-Parkinson-White is curated as its own phenotype bound to HP:0001716 on PMID:33247540, which reports it in a patient with an intragenic BMP2 nonsense variant and no deletion. The paragraph was prose left stale by that commit and rendered on the disorder page, so a reader of the cardiac section was actively misinformed. Rewritten to point at the curated phenotype, to record that the earlier neighbouring-gene attribution was correct on the evidence then available and is superseded, and to say why structural and rhythm phenotypes are kept as separate entries. Finding 2, the entry stated the size of the reported literature three times and gave three answers: roughly 50 to 60 in the prevalence notes, fewer than 40 in the datasets note, and roughly 36 in the toenail dysplasia frequency justification. The prevalence figure is the current one because it incorporates the 18-patient international cohort from PMID:37125634; the other two predate it and are now corrected to match. No frequency band changes, since 1/36 and 1/55 are both VERY_RARE. Suggestion 3, the top-level references index listed 14 entries against 17 cited PMIDs; PMID:37125634, PMID:33247540 and PMID:10362015 were missing, which are precisely the three the notes single out as having changed the entry's claims. Added. Suggestion 4 was raised as non-blocking on the grounds that no cached abstract carries a quotable sentence for the research-surfaced gaps. That is correct for 11 rib pairs, hip dysplasia, coxa vara and osteopenia, and I verified it independently: the only rib sentences anywhere in the reference cache are in PMID:19116164 and concern the 13th rib of Bmp4 mutant mice, a different gene, rib and species. A notes paragraph now records that these were considered and why they were left out, and names the full text of PMID:37125634 as where to check the rib count. But the same finding also listed fifth finger clinodactyly and thin upper lip vermilion as unsupportable, and that is not correct: PMID:33247540 carries a single summary sentence naming both, and it was unused. Both are now curated as real phenotypes bound to HP:0004209 and HP:0000219, with that sentence as the snippet, and connected to the pathograph rather than left orphaned. Suggestion 5, CL:0000008 migratory cranial neural crest cell is narrower than the node's claim, which concerns post-migratory CNC-derived osteogenic mesenchyme. CL has no post-migratory term, so the binding stays and the node description now records that it names the lineage rather than the developmental stage. Note the granularity caveat had to go in the node description, not a notes slot on the cell-type descriptor, which the schema rejects. Validation after changes: just validate passes with 108/108 snippets verified, term validation passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens and check-snippet-length all pass. check-title-snippets and check-snippet-grading each reported one finding, in IgG4-Related_Disease.yaml and Tay-Sachs_Disease.yaml respectively; neither file is touched by this branch, and both gates pass on a dry-run merge of origin/main, so the findings are artifacts of this branch sitting on an older base rather than defects introduced here. The merge was aborted rather than committed, per the repository guidance against routine merges into PR branches; CI checks out the merge result, which is why test (3.13) has passed throughout.

  summary: 'Review round: act on red-team findings and integrate deep-research report'
  details: |
    Pre-PR red-team review (dismech-pr-review skill, fresh-context subagent) plus integration of the deep-research report that landed after the first commit. Five blocking findings fixed. First, scoliosis was removed as a phenotype and as a causal edge: across every reference cached for this entry the word appears exactly once, inside a sentence about JAG1 deletions and Alagille syndrome in PMID:21671386, which is a contiguous-gene phenotype this entry excludes elsewhere. That was the single Named Entity Confusion escape and it is now recorded in notes so it is not reintroduced. Second, the chondrogenesis node misrepresented PMID:17194222: its chondrocyte-differentiation DECREASED annotation is contradicted by that paper, which reports chondrogenic differentiation proceeds normally without BMP2, and its osteogenesis finding is from a compound Bmp2/Bmp4 knockout rather than BMP2 alone. The node was renamed Reduced Osteogenic Output of Skeletal Progenitors, rebound to osteoblast differentiation, the compound-knockout qualification stated in the explanation, and the contrary result added as an explicit REFUTE item. Third, brachydactyly was over-graded from a single figure legend; real hand data (short fifth fingers segregating through three generations of the BMP2-only deletion family) was added from PMID:21671386. Fourth, two nodes bundled multiple mechanistic steps: the craniofacial node was split into Craniofacial Skeletal Hypoplasia and Failure of Tongue Descent and Palatal Shelf Elevation, which also let the entry record PMID:30413887's measured negative results, that BMP/SMAD activity is largely preserved in the mutant palate through BMP4 and BMP7 redundancy and that BMP2 is not an intrinsic regulator of shelf elevation. Fifth, the deep-research report is now present. Important fixes: frequency bands removed from six craniofacial phenotypes whose only source is a three-patient photographic figure legend; homozygosity caveats added to four causal-edge explanations that rest on homozygous conditional mouse mutants; the SCUBE3 evidence item now names SSFSC2 explicitly because its quoted phrase 'the human disorder' means the sibling entity; hypotonia rebound from HP:0001319 Neonatal hypotonia to HP:0008947 Floppy infant since both sources describe infancy; myringotomy and adenoidectomy rebound from generic NCIT:C15329 to NCIT:C70906 and NCIT:C51697; ten orphaned phenotypes connected to the pathograph, leaving two deliberately unconnected because no source proposes a mechanism; module-expected GO terms added to both conforming nodes; congenital heart disease frequency removed for want of a denominator and its arrhythmia claim reconciled with the entry's own Wolff-Parkinson-White exclusion. Minor fixes: better short-stature snippet carrying the actual 6/7 count, cranial neural crest cell rebound to CL:0000008, MONDO:0007216 added to the brachydactyly type A2 differential with a note that BMPR1B and GDF5 are the commoner causes, bone remodeling GO term added, speech therapy joined to the pathograph, and an unverifiable Cre-driver genotype softened to what the cached source supports. Deep research: the requested falcon provider returned 403 and the run fell back to openscientist, recorded in the report frontmatter. Reference validation 16/16 resolved, zero confabulations, one off-topic flag (PMID:24022823, not used). Term validation found 0 of 11 checked terms named correctly, so none of the report's ontology suggestions were adopted; one offered UBERON:0006618 for growth plate, which is the atrium auricular region. Two of its citations were adopted after reading them: PMID:19116164 for BMP2 dosage sensitivity, which supplies the dose claim the compound limb knockout does not, and PMID:22965927 for a second multigenerational deletion family that independently replicates the clefting phenotype and gives a second within-family developmental-delay discordance. Validation after changes: just validate-disorders passes with 92/92 snippets verified, term validation passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all pass. Compliance 89.3 percent, down from 91.7 because the denominator grew with the added nodes and evidence.

  summary: Address review round 2 on PR 9709
  details: |
    Addressed both blocking items from the second review round on PR 9709. The Lymphadenopathy evidence quoted a figure-legend fragment that began mid-word on the tail of inflam-mation and evidenced EBV-driven lymphoproliferation rather than lymph node enlargement; it verified as an exact substring, which is precisely why the offline gates did not catch it. Replaced with the sentence recording cervical lymph node enlargement with spontaneous regression in the eldest sibling. Immunoglobulin replacement was linked to Systemic Autoimmunity with BYPASSES while its own description said it covers the antibody deficit; replacement-dose immunoglobulin does not treat autoimmunity, so the edge asserted something clinically untrue. Added an Impaired Class-Switched B Cell Compartment node downstream of defective Treg suppression, evidenced from the low class-switched B cells clause of a sentence already verified in this file, and retargeted the treatment to it. Also took three suggestions: moved Hepatosplenomegaly from Gastrointestinal to Hematologic so it groups with the lymphoproliferative arm, added explicit evidence for the CMV half of the viral-susceptibility phenotype, and added a DECREASED surface-CTLA-4 readout to the Jurkat model link, which the previous history record's prose had claimed was already present when it was not. Normalised the links block of the earlier history record to the URL form. Snippets 33 to 36, all verified; pathograph nine nodes in one component.

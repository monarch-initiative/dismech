  summary: Address review on PR 9709
  details: |
    Addressed all five blocking items from the automated review on PR 9709. The most important was a genuine self-contradiction the reviewer caught: the Recurrent and persistent infections phenotype attributed bacterial sepsis and respiratory viruses to DEF6, when Table I of PMID:32562707 shows those occurred only in the two SKIV2L carriers and the paper states outright that the four unconfounded patients did not experience severe or opportunistic infections except EBV. The entry excluded the digestive and cardiac features as confounded and then re-admitted the infections that the same sentence excludes. The phenotype is now scoped to EBV and CMV, bound to Recurrent viral infections, and carries the restriction sentence as its evidence. Added Persistent EBV viremia, Lymphadenopathy and Hepatosplenomegaly phenotypes; the last is graded PARTIAL because the index cohort includes the SKIV2L carriers and the report does not resolve it per patient. Added the DEF6-knockout Jurkat line as an experimental_models entry linked to Reduced Surface CTLA-4 Availability with RECAPITULATES and its own readout evidence, since it is the strongest causality evidence in the disease and is precisely what the observational data cannot supply. Added immunoglobulin replacement, Treg-sparing immunosuppression and the refractory second-line regimen, all graded PARTIAL with the reason stated. Also took five suggestions: split the bundled autoimmunity/lymphoproliferation node, gave the EBV arm a downstream terminus so Lymphoma connects to the graph, corrected abatacept to PROTEIN_REPLACEMENT and HSCT to BYPASSES, and strengthened the SKIV2L discussion with the index authors own concurring statement. Snippets went from 22 to 33, all verified. Pathograph is one connected component of eight nodes.

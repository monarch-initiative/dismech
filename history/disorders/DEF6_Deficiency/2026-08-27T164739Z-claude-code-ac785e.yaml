  summary: 'Create: DEF6 Deficiency'
  details: |
    New Disease entry for DEF6 deficiency / immunodeficiency 87 and autoimmunity (MONDO:0030457, OMIM 619573). Lump/split call: DISEASE - one gene, one conserved pathograph running DEF6 loss to disrupted RAB11-dependent CTLA-4 vesicle trafficking to reduced surface CTLA-4 to defective Treg suppression, with a second arm for impaired EBV control. Abatacept is linked to the Treg-suppression node with treatment_effect BYPASSES, since CTLA-4-Ig substitutes extracellularly for the function the trafficking defect prevents. Evidence: 22 snippets, all verified against the local reference cache. The whole human evidence base is seven patients from three kindreds across two reports, and this is stated in the entry description rather than left implicit. A KNOWLEDGE_GAP discussion records that two of the three patients in the index report also carried a homozygous pathogenic SKIV2L variant, so the digestive and cardiac features attributed to DEF6 in that report are confounded; a second gap records that reduced surface CTLA-4 does not obviously explain the EBV susceptibility described only in the second family. One Edison falcon deep-research report is included; preflight-dr PASSed on gene identity. The report cites Serwas 2019 for fifteen of its twenty-four citation slots and never cites the second family report, so the SKIV2L confound and the EBV arm were added from the primary literature rather than from the report.

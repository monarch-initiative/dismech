  summary: 'AT/RT: cribriform neuroepithelial tumor and SMARCB1-mutant desmoplastic
    myxoid tumor as differential diagnoses'
  details: >-
    Adds two differential_diagnoses rows bound to MONDO terms, with 21 evidence items from cached
    sources, in the entry's American spelling. Cribriform neuroepithelial tumor (MONDO:1060254, six
    items): the 2017 series (PMID:27380723) on the much better outcome despite highly similar
    genetic and epigenetic profiles to the AT/RT-TYR group, its histology without rhabdoid tumor
    cells, SMARCB1 protein loss in all its tumors, the tyrosinase staining shared with AT/RT-TYR
    (against the study's control groups of 10 AT/RTs each), and its conclusion; and a review
    (PMID:29280680, REVIEW_SYNTHESIS, INDIRECT, since it speaks of malignant rhabdoid tumors at all
    sites) that most but not all malignant rhabdoid tumors contain rhabdoid cells. Its notes record
    that the existing row bundling this tumor with three others lists INI1 status, which does not
    separate this tumor from AT/RT, and an entity-specific DNA methylation and genomic profile,
    which may not separate it from AT/RT-TYR; and that outcome is left out of the distinguishing
    features. Desmoplastic myxoid tumor of the pineal region, SMARCB1-mutant (MONDO:1060253,
    fifteen items): the 2020 series' background that AT/RT occurs predominantly in infants
    (PMID:31732806, BACKGROUND), and, with the gradings the DMT entry gives the same sentences, its
    patients' ages, the pineal location, the histology, SMARCB1 protein loss in all its tumors, the
    methylation result (mostly unclassifiable, with similarities to AT/RT-MYC), its conclusion and
    its outcome after 48 months; the review (PMID:29280680, REVIEW_SYNTHESIS) that rare AT/RTs lose
    SMARCA4 rather than SMARCB1; a 2024 case report (PMID:38527786) whose tumor the composite
    NIH/NCI methylation profile classified as this type, its discussion (BACKGROUND) that all cases
    have been in the pineal region, and its discussion on the course and its uncertainty; and a
    2026 review (PMID:42058762, REVIEW_SYNTHESIS) on a less aggressive course and its caveat that
    behavior is incompletely defined. Its notes say every reported case has been in the pineal
    region and that the cited sources do not compare its site with AT/RT's, and point to the DMT
    entry for its WHO criteria, a 2026 review's methylation summary and later reports of rhabdoid
    cells and spread; the course is left out of the distinguishing features. Validated with just
    validate-disorders, just validate, just validate-terms, just count-verified-snippets, just
    check-snippet-grading and the other whole-repo gates CI runs.

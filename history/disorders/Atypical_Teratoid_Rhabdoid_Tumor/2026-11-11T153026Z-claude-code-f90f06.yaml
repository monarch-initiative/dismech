  summary: Bind the three consensus molecular subgroups to their MONDO terms
  details: |
    The four has_subtypes rows carried no subtype_term. TYR, SHH and MYC are now bound to MONDO:1060251, MONDO:1060249 and MONDO:1060250, each label read from the local MONDO build with runoak. The SMARCA4 row is left unbound: a label search for atypical teratoid returns the parent class and exactly those three subgroup terms, so no counterpart class exists for a stratum defined by the alternative driver gene rather than by a methylation subgroup. That search is recorded in the row's review_notes. Validated with just validate and just validate-terms; the first term-validation attempt on the sibling file timed out against EBI and was re-run to completion rather than accepted as passing.

  summary: 'Create: Kyphoscoliotic Ehlers-Danlos Syndrome'
  details: >
    New entry for kyphoscoliotic Ehlers-Danlos syndrome (kEDS), anchored on
    MONDO:0016002 (Ehlers-Danlos syndrome, kyphoscoliotic type 1 /
    PLOD1-related, ~90% of confirmed cases) since the umbrella MONDO:0034024
    is obsolete with no single non-obsolete replacement. FKBP14-related
    disease (kyphoscoliotic type 2) is modeled as a has_subtypes entry
    anchored on its own MONDO:0013800 term, following the precedent set by
    Musculocontractural_Ehlers-Danlos_Syndrome.yaml for a genetically
    heterogeneous EDS subtype. Both GeneReviews chapters (PMID:20301635
    PLOD1-kEDS, PMID:31132235 FKBP14-kEDS) were fetched, tagged, and mined
    for the full Clinical Characteristics / Diagnosis / Management / Genetic
    Counseling baseline (just check-genereviews --online confirms both
    chapters tagged). Deep research was performed via 'just
    dr_fallback=--fallback research-disorder falcon
    Kyphoscoliotic_Ehlers-Danlos_Syndrome': the requested falcon provider has
    no EDISON_API_KEY/FUTUREHOUSE_API_KEY configured in this environment, so
    the run fell back to claude_code per the documented fallback mechanism
    (report renamed to
    research/Kyphoscoliotic_Ehlers-Danlos_Syndrome-deep-research-claude_code.md,
    fell_back/requested_provider/provider_attempts recorded in frontmatter).
    The report's own term validation flagged needs_review: true with 9/42
    mislabelled ontology-term suggestions (e.g. NCIT:C2231 offered as
    'Adrenergic beta-Antagonist' but is actually Dofequidar Fumarate;
    HP:0025214 offered as 'Arterial dissection' but is actually 'Triggered by
    heat'; HP:0000023 offered as 'Congenital contractures' but is actually
    'Inguinal hernia') -- none of the report's suggested CURIEs were bound
    directly; every ontology term in this entry was independently verified
    via runoak/OAK lookup before use. The report's causal-chain and
    cited-paper pointers (Baumann et al./Rohrbach et al./Ishikawa &
    Bachinger/Colman et al.) were used only as leads and independently
    sourced: fetched and cited PMID:21699693 (Rohrbach et al., PLOD1
    biochemistry: telopeptide lysyl hydroxylation, collagen crosslink
    maturation mechanism, the 8.9-kb exon10-16 duplication, urinary
    lysyl-pyridinoline:hydroxylysyl-pyridinoline diagnostic ratio, and the
    ~1:100,000 live-birth incidence estimate), PMID:24821723 (Ishikawa &
    Bachinger, FKBP22/FKBP14 collagen-type III/VI/X substrate specificity and
    folding catalysis), and PMID:36054293 (Colman et al., FKBP14 variant
    spectrum and immunocytochemical evidence of intracellular type III/VI
    collagen retention). The pathophysiology chain models two convergent
    molecular starting points (PLOD1 loss-of-function -> deficient
    telopeptide hydroxylation; FKBP14 loss-of-function -> impaired
    procollagen folding/secretion) that converge on a shared 'Defective
    Collagen Crosslink Maturation' node before branching to
    skin/joint/vascular/ocular tissue-level consequences, with
    subtype-specific phenotypes (myopathy, hearing impairment, bifid uvula,
    subdural hygroma, bladder diverticulum, rectal prolapse) tagged via the
    has_subtypes 'subtypes'/'subtype' foreign keys. Also added a diagnosis:
    block (molecular genetic testing of PLOD1/FKBP14, plus the urinary
    pyridinoline-ratio biochemical screening test), both cited from the
    GeneReviews chapters.


    A pre-PR self-review was run via a fresh subagent using the
    dismech-pr-review skill (text report only, no gh pr review submitted
    since no PR existed yet). It independently re-verified 14 ontology-term
    bindings via runoak (all exact matches, including confirming the entry
    correctly avoided three specific mislabelled CURIEs the deep-research
    report had offered: NCIT:C2231, HP:0025214, HP:0000023) and spot-checked
    snippets/titles against references_cache (all exact substrings, no
    fabrication). It raised 3 blocking findings, which were fixed in this
    same session before commit: (1) added a Clubfoot/Talipes equinovarus
    (HP:0001762) phenotype for kEDS-FKBP14, cited from a GeneReviews
    management sentence already in the cache that had been overlooked; (2)
    added three phenotypes (Restrictive Ventilatory Defect HP:0002091,
    Recurrent Pneumonia HP:0006532, Cardiac Failure HP:0001635) as pathograph
    sequelae of the existing Kyphoscoliosis phenotype, cited from a
    GeneReviews clinical-characteristics sentence already in the cache; (3)
    connected the previously pathograph-orphaned 'Congenital or Early-Onset
    Hypotonia' and 'Kyphoscoliosis' phenotypes into the mechanism chain via a
    new pathophysiology node, 'Weakened Musculoskeletal and Paraspinal
    Connective Tissue', downstream of the existing 'Disorganized Dermal and
    Vascular Collagen Fibrils' node (uncited inferential tissue-level edge,
    consistent with the existing pattern used for the skin/joint/vascular/
    ocular branches). Also addressed a non-blocking finding: added an
    environmental: block (Joint-Stressing/High-Impact Physical Activity and
    Diagnostic Arteriography, both EXACERBATES-linked into the pathograph)
    capturing the GeneReviews agents/circumstances-to-avoid content, each
    with both entry-level and influences_mechanisms-level evidence (required
    by check-environmental-evidence).


    The reviewer also flagged an advisory (non-blocking) point worth a
    maintainer's attention: the disease_term anchor MONDO:0016002 is not a
    true parent/umbrella term the way Musculocontractural_Ehlers-Danlos_Syndrome.yaml's
    MONDO:0011142 anchor is -- MONDO:0016002 and MONDO:0013800 (the FKBP14
    subtype's term) are coordinate sibling leaf terms under MONDO:0020066, and
    the disease-level disease_term.term.id is therefore identical to the
    kEDS-PLOD1 subtype's own subtype_term.term.id. This is a considered
    choice (MONDO:0034024, the only real umbrella term, is obsolete with no
    replacement, and PLOD1-kEDS is ~90% of cases) but is flagged here for a
    maintainer to confirm rather than silently accepted, per CLAUDE.md's
    lump/split guidance.



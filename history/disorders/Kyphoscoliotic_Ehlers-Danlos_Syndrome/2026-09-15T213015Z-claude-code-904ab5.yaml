  summary: 'Create: Kyphoscoliotic Ehlers-Danlos Syndrome'
  details: |
    New entry for kyphoscoliotic Ehlers-Danlos syndrome (kEDS), anchored on MONDO:0016002 (Ehlers-Danlos syndrome, kyphoscoliotic type 1 / PLOD1-related, ~90% of confirmed cases) since the umbrella MONDO:0034024 is obsolete with no single non-obsolete replacement. FKBP14-related disease (kyphoscoliotic type 2) is modeled as a has_subtypes entry anchored on its own MONDO:0013800 term, following the precedent set by Musculocontractural_Ehlers-Danlos_Syndrome.yaml for a genetically heterogeneous EDS subtype. Both GeneReviews chapters (PMID:20301635 PLOD1-kEDS, PMID:31132235 FKBP14-kEDS) were fetched, tagged, and cross-referenced for the full Clinical Characteristics phenotype baseline per the GeneReviews-baseline workflow (just check-genereviews --online confirms both chapters tagged). Deep research was performed via 'just dr_fallback=--fallback research-disorder falcon Kyphoscoliotic_Ehlers-Danlos_Syndrome': the requested falcon provider has no EDISON_API_KEY/FUTUREHOUSE_API_KEY configured in this environment, so the run fell back to claude_code per the documented fallback mechanism (report renamed to research/Kyphoscoliotic_Ehlers-Danlos_Syndrome-deep-research-claude_code.md, fell_back/requested_provider/provider_attempts recorded in frontmatter). The report's own term validation flagged needs_review: true with 9/42 mislabelled ontology-term suggestions (e.g. NCIT:C2231 offered as 'Adrenergic beta-Antagonist' but is actually Dofequidar Fumarate; HP:0025214 offered as 'Arterial dissection' but is actually 'Triggered by heat'; HP:0000023 offered as 'Congenital contractures' but is actually 'Inguinal hernia') -- none of the report's suggested CURIEs were bound directly; every ontology term in this entry was independently verified via runoak/OAK lookup before use. The report's causal-chain and cited-paper pointers (Baumann et al./Rohrbach et al./Ishikawa & Bachinger/Colman et al.) were used only as leads and independently sourced: fetched and cited PMID:21699693 (Rohrbach et al., PLOD1 biochemistry: telopeptide lysyl hydroxylation, collagen crosslink maturation mechanism, the 8.9-kb exon10-16 duplication, urinary lysyl-pyridinoline:hydroxylysyl-pyridinoline diagnostic ratio, and the ~1:100,000 live-birth incidence estimate), PMID:24821723 (Ishikawa & Bachinger, FKBP22/FKBP14 collagen-type III/VI/X substrate specificity and folding catalysis), and PMID:36054293 (Colman et al., FKBP14 variant spectrum and immunocytochemical evidence of intracellular type III/VI collagen retention). The pathophysiology chain models two convergent molecular starting points (PLOD1 loss-of-function -> deficient telopeptide hydroxylation; FKBP14 loss-of-function -> impaired procollagen folding/secretion) that converge on a shared 'Defective Collagen Crosslink Maturation' node before branching to skin/joint/vascular/ocular tissue-level consequences, with subtype-specific phenotypes (myopathy, hearing impairment, bifid uvula, subdural hygroma, bladder diverticulum, rectal prolapse) tagged via the has_subtypes 'subtypes'/'subtype' foreign keys. Also added a diagnosis: block (molecular genetic testing of PLOD1/FKBP14, plus the urinary pyridinoline-ratio biochemical screening test), both cited from the GeneReviews chapters. Validated with: just validate (schema/term/reference, 49/49 snippets verified after the diagnosis-section addition), just validate-disorders (the CI-authoritative batched gate, passed), just check-entity-refs, just check-causal-targets (0 new dangling targets), just check-duplicate-keys, just check-enum-values, just check-qualifier-terms, just list-gene-term-mismatches (0 mismatches across 6 gene bindings), and just check-genereviews --online (both chapters TAGGED). Compliance (just compliance) prior to the diagnosis-section addition: 86.8% global / 87.2% weighted. datasets: left empty -- no GEO/other accession search was performed for this entry.

  summary: Address PR review rounds 1-3 findings for kEDS
  details: |
    Addressed all outstanding blocking/important findings from the three ai4c-reviewer rounds on PR #11899 for Kyphoscoliotic_Ehlers-Danlos_Syndrome.yaml. (1) Cited 12 of the 13 previously-uncached-but-unused references (PMID:21667916, 22265013, 28617417, 31288483, 31502696, 31949249, 34712265, 36860721, 37433679, 41366145, 41613374, DOI:10.1002/ajmg.c.31552); PMID:34850861 was deliberately left uncited and documented as off-topic (a musculocontractural-EDS/CHST14 mouse model misidentified in earlier research as a kEDS reference -- Named Entity Confusion). (2) Added an animal_models entry for the naturally-occurring equine Warmblood Fragile Foal Syndrome (PLOD1 c.2032G>A), the only genotype/phenotype-documented PLOD1/FKBP14 animal model found in cached literature, with honest limitations re: lethality severity mismatch. (3) Added evidence to all 7 previously-unevidenced pathophysiology nodes and their downstream edges, largely from full-text re-fetches of PMID:21699693 (EM ultrastructure findings) and PMID:28617417 (re-fetched for full text this session). (4) Split the mismatched 'Ocular Abnormality' phenotype (bound to Blue Sclerae but evidenced by a myopia/retinal-detachment snippet) into three atomic phenotypes: Refractive Error (HP:0000539), Retinal Detachment (HP:0000541), and Blue Sclerae (HP:0000592, kEDS-FKBP14 subtype). (5) Added a histopathology entry (dermal collagen fibril EM ultrastructure) and a diagnosis entry citing the 2017 International EDS Classification plus FKBP14 GeneReviews and the 28617417 cohort's explicit major/minor clinical diagnostic criteria. (6) Documented the recurrent FKBP14 c.362dupC founder allele in genetic.notes without fabricating the requested ~70% figure, which could not be verified in any cached source -- an independent case report (PMID:41366145) reporting an identical p.(Glu122Argfs*7) protein consequence under a c.362dupG cDNA notation was cited instead, with the discrepancy noted honestly. (7) Added target_mechanisms to 3 of 4 treatments (Physical Therapy, Orthopedic Management, Beta-Blocker Therapy), leaving Genetic Counseling without one per established KB precedent. (8) Fixed 11 additional pre-existing orphaned phenotypes (zero pathograph indegree) discovered via a manual PyYAML audit while wiring the above, not previously flagged by the reviewer. Validated: just validate (112/112 snippets), just validate-disorders (batched with aEDS, 161/161), check-causal-targets, check-entity-refs, check-qualifier-terms, check-duplicate-keys, check-genereviews, and a manual zero-orphan-phenotype audit.

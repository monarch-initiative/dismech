  summary: 'Create: Acquired Thrombotic Thrombocytopenic Purpura with caplacizumab
    nanobody'
  details: |
    New entry for acquired immune-mediated TTP MONDO:0019740. Curated the ADAMTS13 autoantibody to ultralarge-VWF/platelet microthrombosis to multiorgan ischemia chain; phenotypes thrombocytopenia, microangiopathic hemolytic anemia, schistocytosis, neurologic deficits; severely reduced ADAMTS13 activity biomarker; treatments led by caplacizumab, an anti-VWF single-domain immunoglobulin Nanobody with therapeutic_modality MONOCLONAL_ANTIBODY and agent NCIT:C128625, plus plasma exchange, rituximab, corticosteroids. Evidence from TITAN PMID:26863353, HERCULES PMID:30625070, Sadler review PMID:28768626, Tsai and Lian PMID:9828246, Furlan PMID:9828245; all PMIDs fetched and snippets verified as exact substrings. Deep-research providers not run due to missing API keys; anchored on primary NEJM/Blood literature with full anti-hallucination verification. Passed validate and validate-references; compliance 90.3 percent.

  summary: 'Create: Spinocerebellar_Ataxia_27A'
  details: |
    New entry for SCA27A (MONDO:0008654, FGF14). Deep research: claude_code provider (falcon not configured), report validated (35/35 references resolved). Pathophysiology is built as a chain from heterozygous FGF14 loss of function through reduced iFGF14 protein and a hyperpolarizing shift in Purkinje Nav inactivation to loss of tonic Purkinje firing, with the F145S knock-in mouse (PMID:41558966) as the main evidence for haploinsufficiency; the earlier in vitro dominant-negative result (PMID:17978045) is recorded as REFUTE/INDIRECT. Fever-triggered episodic ataxia is a HYPOTHETICAL node. SCA27B (GAA expansion) evidence was deliberately excluded. No GeneReviews chapter and no ClinGen record exist. ORPHA:98764 could not be cached (no local Orphadata XML) and is not cited. Validated with just validate (84/84 snippets verified) and the offline gates.

  summary: Review COX6B1 clinical spectrum and early versus late complex IV assembly
    roles
  details: |
    Reviewed the entire existing COX6B1 entry, both prior EDIT records, the complex-IV module and the relevant grouping member. No REVIEW existed on fresh main e6eea7c0b973b04eee5135e04053e534fd091cf2; no disease/history overlap was found in the refreshed open-PR file index. This Mendelian disorder remains in scope despite infection-associated deterioration. No matching deep-research artifact exists; the GeneReviews/StatPearls check returned NO_CHAPTER in the 2026-09-10 snapshot.

    Read the complete scientific text, methods and figures/captions of Massa2008 (PMID18499082) and the Abdulhag2014/2015 PMC article (PMID24781756, full text cited through its generated URL cache). Read Calvo2012 relevant diagnostic results, methods and tables1/3 (PMID22277967); unrelated diagnoses were not exhaustively curated. Read the 2024 and 2026 human-knockout studies (PMID39184436, PMID41419202), including results, discussion, methods and data availability. Read the ClinGen report and generated structured assertion, preserving its broader mitochondrial-disease scope and 2022 classification cutoff. Read the 2021 yeast and 2016 genetic-epistasis abstracts (PMID34937540, PMID26669719). Jennions2024 (PMID38842388) was read in full on the publisher page and its cached abstract consumed; repeated sanctioned full-text URL fetches returned403, so detailed claims unique to its inaccessible cache are not presented as verified full-text snippets. The Calvo supplement routes returned CAPTCHA; 2016 PMC/EuropePMC routes returned CAPTCHA,403 or500. These outputs are neither usable source text nor evidence of reading a supplement. No cache file was hand-created or hand-edited.

    Corrected infantile-only onset, universal protein absence and unsupported ATP-collapse claims. Arg20His fibroblasts retain total mutant protein but have impaired stable holoenzyme incorporation; Arg20Cys muscle retains approximately11% protein, not zero. The 2026 study adds early MT-CO2 maturation/incorporation to late structural stability. Human null-cell redox, glycolytic, ISR, ribosomal, translation, secondary-complex-I and cristae findings remain explicitly experimental. Preserved adenylate energy charge, lack of increased ROS in6BKO, failure of ISR inhibition to rescue complex I, and AOX respiratory bypass without normal native complex IV activity limit causal interpretation. Copper-transfer chemistry remains unresolved. Gene-to-activity grounding uses measured holoenzyme cytochrome-c oxidase activity and explicitly distinguishes structural contribution from an autonomous catalytic subunit.

    Completeness assessment: phenotype coverage expanded to19 findings across neurological, cardiac, growth, feeding and biochemical domains without unreliable frequency estimates; neonatal and childhood presentations retained within one spectrum rather than severity subtypes. Pathophysiology expanded to16 separate nodes with evidence-qualified edges. Genetics includes4 missense alleles with mature-protein nomenclature explained and ClinGen attribution; linkage-analysis penetrance assumptions were not treated as measured penetrance. Diagnosis, biochemical and histopathology sections capture tissue-dependent complex IV assays and neuroimaging. Reported shunting, gastrostomy, cardiac drugs and CoQ10 are distinct from preclinical AICAR/resveratrol/ascorbate experiments; no clinical efficacy is inferred from fibroblast rescue. The AICAR chemical binding is deliberately unresolved because the source's ribonucleotide expansion should not be silently conflated with the commonly used riboside reagent. Four experimental systems distinguish human patient/HeLa/HEK293 and yeast ortholog/human-protein expression designs. Three public proteomics accessions (PXD061618,PXD061621,PXD046331) were independently verified through PRIDE; no patient dataset accession was invented. The retired shared dataset cache was not read or generated. Reference titles and exact snippets were checked against generated caches. The grouping's COX6B1 member summary was updated to the same clinical and mechanistic scope. Validation results are recorded in the PR.

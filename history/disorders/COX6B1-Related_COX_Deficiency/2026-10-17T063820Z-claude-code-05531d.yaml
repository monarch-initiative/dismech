  summary: 'Bind LOINC: specimen-specific serum and CSF lactate'
  details: |
    Split the combined 'Elevated blood and CSF lactate' biochemical marker into two specimen-specific markers, 'Elevated serum lactate' (loinc_term LOINC:2524-7, Lactate [Moles/volume] in Serum or Plasma) and 'Elevated CSF lactate' (loinc_term LOINC:2520-5, Lactate [Moles/volume] in Cerebral spinal fluid), since a single loinc_term slot cannot carry both specimens. Bound because the entry's existing evidence (PMID:18499082) quotes both specimens' own numeric values for a named COX6B1 Arg20His patient (serum 2.6 mM, CSF 5.1 mM, both against a normal value <1.8) -- a disease-specific finding, not a generic mitochondrial-disease statement. Both LOINC codes were already cached from other kb entries. just validate-disorders passed with 0 issues.

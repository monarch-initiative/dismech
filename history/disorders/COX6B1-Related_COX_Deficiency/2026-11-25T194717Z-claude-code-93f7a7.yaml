  summary: 'Gene-family review: COX6B1'
  details: |
    COX6B1 genetic record typed CAUSATIVE with variant_origin GERMLINE and its recessive inheritance block bound to HP:0000007. The gene_disease_validity block was removed because it copied ClinGen's Definitive tier for mitochondrial disease (MONDO:0044970), broader than this entry's MONDO:0033637; the tier is kept in a note and is the basis for CAUSATIVE (five patients in the reported families, PMID:18499082, PMID:24781756, PMID:38842388). The GO:0004129 descriptor on the activity node is described as the holoenzyme activity the non-catalytic subunit supports.

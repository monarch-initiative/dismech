  details: |
    Removed the unsourced ~90% survival figure from progression notes and replaced it with the GeneReviews (PMID:20301448) qualitative prognosis sentence, quoted as a new evidence item. Rewrote the prevalence record: dropped the unsupported Italian-families claim and the founder/consanguineous population wording, and changed prevalence_class from ULTRA_RARE to RARE to match PMID:22982295 ('a rare form'). Dropped frequency VERY_FREQUENT from Serum IgM, which rested on a single case report. Removed GO:0003700 DNA-binding transcription factor activity from the SP110 loss-of-function node: no cited source states an SP110 molecular function, and SP110 remains grandfathered in tests/gene_activity_grounding_baseline.txt. Added the GeneReviews genetic-counseling sentence (autosomal recessive, 25/50/25 sibling risks) as inheritance evidence. Corrected the previous history record's Harrison's enum values and removed an unrelated issue reference. Not done: GeneReviews agents-to-avoid (cyclophosphamide, Senecio alkaloids) as environmental exposures, which needs ECTO exposure binding and mechanism links.

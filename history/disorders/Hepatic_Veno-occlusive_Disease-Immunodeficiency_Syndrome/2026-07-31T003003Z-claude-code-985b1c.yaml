  summary: 'Deep curation: SP110/VODI mechanism, GeneReviews phenotypes, classifications,
    drug safety'
  details: |
    Deep-curation pass on the existing VODI entry.

    Deep-research provider note: the user requested Edison (falcon). The EDISON_API_KEY present in this environment was rejected with HTTP 403 Forbidden by Edison's own auth endpoint (api.platform.edisonscientific.com/auth/login), verified both with and without the "dismech:" prefix, so no Falcon report could be produced. An OpenScientist run was submitted as a substitute and was still queued server-side at commit time. Curation therefore proceeded from targeted PubMed retrieval of the complete SP110/VODI literature, plus the previously cached Asta report and the GeneReviews baseline (PMID:20301448).

    Added in this pass:
    - Speckled-Protein chromatin-reader molecular mechanism on the SP110 node, with GO molecular_function (GO:0003682 chromatin binding) and cellular_component (GO:0016605 PML body) bindings (PMID:32386862).
    - The CD40L/IL-21-dependent late-B-cell differentiation defect as the specific humoral lesion (PMID:22621957).
    - Incomplete-penetrance framing of the hepatic veno-occlusive arm (PMID:22621957 high frequency; PMID:31721003 documents SP110 combined immunodeficiency with advanced liver disease but without VOD).
    - Three GeneReviews-documented phenotypes previously missing: HP:0002849 absence of lymph node germinal center, HP:0002728 chronic mucocutaneous candidiasis, HP:0001508 failure to thrive.
    - Sp110 flow-cytometry screening diagnosis entry (MAXO:0035055), noting that TREC-based newborn SCID screening misses VODI because it is not associated with severe T-cell lymphopenia at birth (PMID:28825155).
    - Staged progression (onset usually before 6 months; 100% untreated first-year mortality; treatment-modified course) and HIGH clinical_burden.
    - classifications block: Harrison's IMMUNE_RHEUMATOLOGIC and IUIS combined immunodeficiency.
    - GeneReviews "agents/circumstances to avoid" drug-safety warning as an environmental entry (cyclophosphamide, Senecio/pyrrolizidine alkaloids), mirrored into the HSCT conditioning description.
    - Expanded allelic and ancestral diversity evidence (PMID:22621957 not restricted to the Lebanese population; PMID:39380482 novel Iranian deletion-insertion allele).
    - HSCT real-world outcome nuance (PMID:23448538, successful in 3 of 5 transplanted patients).
    - Evidence added to five previously bare causal edges.

    Epistemic care: the SP110-to-hepatic-lesion causal edge is deliberately typed INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence. The genetic association is robust, but no molecular pathway from the chromatin-reader defect to sinusoidal endothelial injury has been demonstrated; this is flagged in the entry notes as the principal remaining mechanistic knowledge gap.

    Validation: just validate passes (schema + term + reference validators); just validate-terms passes; just check-reference-cache-frontmatter OK. An independent script confirmed all 49 evidence snippets are exact normalized substrings of their cached sources across 12 distinct references. All new reference cache files were created via just fetch-reference, never hand-written. Compliance rose from 92.8% global / 93.6% weighted to 99.3% / 100.0%.

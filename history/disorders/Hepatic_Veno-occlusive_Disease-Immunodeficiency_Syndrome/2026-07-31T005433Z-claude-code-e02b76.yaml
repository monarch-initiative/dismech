  summary: Fix incorrect IUIS table assignment and evidence-source errors found in
    red-team review
  details: |
    Corrections following an internal red-team review of the preceding deep-curation commit.

    CRITICAL correction - IUIS classification was wrong:
    The prior commit assigned iuis_category "combined immunodeficiency" (IUIS Table 1), reasoning from the phrase "combined immunodeficiency (CID)" in the primary literature, with a hedging note conceding Table 2 was "also defensible". That was backwards. IUIS 2022 (Tangye et al., J Clin Immunol 2022;42:1473-1507) lists SP110/VODI in Table 2, "Combined immunodeficiencies with associated or syndromic features", Other Defects subsection, with associated features hepatic veno-occlusive disease, thrombocytopenia, hepatosplenomegaly, and cerebrospinal leukodystrophy. Two independent confirmations: the dismech enum itself scopes "combined immunodeficiency" to "Table 1" in classifications/iuis_immunodeficiency.yaml, and the sibling Table 2 Other-Defects entry EPG5/Vici syndrome already uses "combined immunodeficiency with syndromic features" in this KB. Corrected the value, rewrote the note to state the Table 2 placement affirmatively, and demoted the PMID:23448538 evidence to PARTIAL with an explanation that it characterizes the clinical phenotype and does not itself assert an IUIS table. The error and its correction are recorded in the entry notes so the reasoning is not silently lost.

    Evidence-source and overstatement corrections:
    - PMID:32386862 (Trends in Immunology narrative review): evidence_source HUMAN_CLINICAL -> OTHER, supports SUPPORT -> PARTIAL. Rewrote the SP110 node description to attribute the SAND/PHD/bromodomain/CARD architecture to the Speckled Protein family collectively rather than to SP110 specifically, and to present the gene-silencing regulatory role as the authors' explicit proposal rather than established fact.
    - PMID:22621957 CD40L/IL-21 B-cell differentiation assay: evidence_source HUMAN_CLINICAL -> IN_VITRO. The snippet itself ends "in vitro"; cultured patient B cells are the textbook IN_VITRO case.
    - Softened the hepatic-arm penetrance claim from "some patients ... biallelic SP110 variants" to "at least one reported patient", and promoted PMID:31721003 from a bare mention inside another item's explanation to a real evidence item at PARTIAL, with an explanation flagging n=1 and that PubMed carries no abstract for this letter so only the title is quotable.
    - Removed a PMID:25755580 evidence item from the occlusion-to-stellate-cell-activation edge. The snippet described sinusoidal endothelial destruction, said nothing about stellate cells or fibrosis, and was already used verbatim one node upstream. The edge is now deliberately unevidenced with an inline note explaining why, which is preferable to mis-evidencing it.

    GeneReviews sections that the prior pass left unmined:
    - Genetic Counseling: added the quantitative sib recurrence risks (25/50/25) to the inheritance block with a verbatim GeneReviews snippet, and noted carrier and prenatal/preimplantation testing availability.
    - Surveillance: added a "Multisystem surveillance" treatment (MAXO:0000487 clinical assessment) carrying the full GeneReviews schedule.
    - Evaluation of relatives at risk: added a treatment covering presymptomatic molecular testing of sibs under 12 months to enable early IVIG/SCIG, Pneumocystis prophylaxis, and preemptive HSCT (MAXO:0000079 genetic counseling).

    Phenotypes added:
    - HP:0025618 Reduced plasma cell count, for "absent tissue plasma cells" - the paired hallmark of the already-curated absent germinal centers, and quoted in three snippets already in the file. Explanation notes HPO has no distinct "absent tissue plasma cells" class.
    - HP:0002415 Leukodystrophy at PARTIAL, since the GeneReviews statement is a surveillance recommendation rather than a direct presence or frequency claim.

    Minor:
    - Truncated the PMID:39380482 snippet to the WES finding alone, since the original mixed a clinical sequencing result with a computational protein-structure prediction in one item.
    - Added a second PMID:28825155 evidence item (IN_VITRO) quoting the intermediate carrier mean-fluorescence result, which the diagnosis "results" text asserted but the attached TREC snippet did not cover.
    - Failure to thrive recategorized Constitutional -> Growth, matching HP:0001508's placement under Growth abnormality and KB convention.

    Structural knowledge gap:
    Converted the prose-only mechanistic gap into a structured discussions entry (disc_vodi_sp110_hepatic_mechanism, kind KNOWLEDGE_GAP, status OPEN) attached to both the SP110 loss-of-function and hepatic-occlusion pathophysiology nodes, with two proposed discriminating experiments: an endothelial- versus hematopoietic-restricted SP110 conditional-knockout cell-autonomy test, and a comparison of hepatic trajectory before and after allogeneic HSCT (which reconstitutes immunity while leaving host liver endothelium SP110-deficient). Each carries an explicit decision_criterion stating which outcome favors which mechanism.

    Validation: just validate and just validate-terms pass. An independent script confirms all 55 evidence snippets are exact normalized substrings of their cached sources. Both discussions attaches_to foreign keys resolve to real pathophysiology node names. Compliance is 96.2% global / 96.7% weighted; this is nominally below the prior commit's 99.3%/100%, which is expected and accepted - the earlier figure counted the mis-attached PMID:25755580 item as evidence present, and the new discussions and proposed_experiments objects have unfilled optional evidence/datasets slots that would require fabricating citations for experiments that have not been performed. Correctness was preferred over the metric.

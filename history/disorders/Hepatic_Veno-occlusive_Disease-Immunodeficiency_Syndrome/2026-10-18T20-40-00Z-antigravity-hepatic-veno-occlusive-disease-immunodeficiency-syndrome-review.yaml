    summary: Add classifications, prevalence, progression, biochemical markers, environmental
      triggers to avoid, and GeneReviews evidence for Hepatic Veno-occlusive Disease-Immunodeficiency
      Syndrome.
    details: Populated classifications (IMMUNE_RHEUMATOLOGIC, GASTROINTESTINAL, and
      iuis_category combined immunodeficiency with syndromic features), prevalence
      (CASES_IN_LITERATURE, RARE from PMID:22982295), progression (infantile onset
      before 6 months and improved prognosis with early IVIG/SCIG, Pneumocystis prophylaxis,
      and defibrotide from PMID:20301448), inheritance (autosomal recessive recurrence
      risk from PMID:20301448), biochemical (decreased Serum IgG and Serum IgM), environmental
      (avoidance of hepatotoxic agents including cyclophosphamide and Senecio alkaloids
      from PMID:20301448), and registered GeneReviews PMID:20301448 under references.

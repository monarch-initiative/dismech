  details: |
    Review round 1 (PR #12865). Added a Genital Anomalies phenotype bound to HP:0000078 with coarse_binding_basis SOURCE_UNSPECIFIED and frequency VERY_FREQUENT from PMID:27859469 (genital anomalies in 30/35 fetal cases; the abstract does not name the anomalies), plus the major-criteria sentence; added it to the knowledge-gap attaches_to. No cached source quotes specific male/female genital anomalies beyond ambiguous genitalia and bicornuate uterus, which were already present. Replaced the PMID:24551978 Laryngeal Atresia snippet (FRAS1 confirmation sentence, retained under genetic FRAS1) with the CHAOS case-report sentence, marked directness INDIRECT because CHAOS is the prenatal presentation and the abstract does not name the level of obstruction. Laryngeal Atresia description now explains why no frequency is assigned (the 30/37 airway-anomaly figure is broader). Added the primary PMID:12205104 combined figure (imperforate anus or anal stenosis 34/117, 29%) to Anal Atresia and Anal Stenosis, and rewrote the explanations of all second-hand MOTA-introduction frequencies (PMID:21507892) so they no longer claim to derive from the 117-case review; the split 6.8%/12.8% does not sum to that review's 29%. Choanal Atresia gained a description stating the 7/117 figure covers stenosis and atresia together. Renal anomalies 37/38 were not assigned to Renal Agenesis (broader category) and no renal dysplasia phenotype was added (no cached human source quotes it). Validation: validate, validate-terms, check-entity-refs, check-coarse-phenotypes, check-snippet-grading, check-reference-titles OK; count-verified-snippets 120/120; validate-disorders run at end.

  summary: Map Fraser syndrome to OMIMPS:219000
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS219000 contains FRAS1-related type 1, FREM2-related type 2, and GRIP1-related type 3 (OMIM:219000, OMIM:617666, OMIM:617667). These are the three subtypes curated here and the three children of MONDO:0009046 in September 2026. Impaired embryonic epithelial basement-membrane anchorage and the shared congenital malformation syndrome support one Disease. The extracellular FRAS/FREM complex and intracellular GRIP1 trafficking roles remain distinct within its mechanism. The mapping does not turn FREM1-associated disorders or isolated renal malformations into Fraser syndrome merely through a shared complex or phenotype.

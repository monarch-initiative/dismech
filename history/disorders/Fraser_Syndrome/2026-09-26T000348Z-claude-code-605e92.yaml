onal epithelial-mesenchymal node to laryngeal, genital, anorectal, ear and nasal phenotypes, and an uncited renal agenesis->oligohydramnios sequela, were drafted and then removed because no cited source makes those edges; the gap is recorded as a KNOWLEDGE_GAP discussion instead. A Stillbirth phenotype (HP:0003826) was dropped because it is outside the PhenotypeTerm enum. Validation: just validate-disorders passed (schema, terms, references: 116 snippets checked, 0 issues); count-verified-snippets 116/116; check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles all OK for this file; check-genereviews: no Fraser syndrome chapter, FREM1 chapter (PMID:20301721) tagged GeneReviews. Causal inlink coverage 4/28 phenotypes.

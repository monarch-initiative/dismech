  details: |
    Addresses the one IMPORTANT finding from the ai4c-reviewer round on PR 12080: developmental delay and hypotonia were documented in the cached PMID:28853723 record and were neither curated nor explained away. Adds four phenotypes rather than the two asked for, because the same paragraph documents seizures (epileptiform EEG at presentation, clinical seizures two years later) and gastrostomy dependence at the same evidence level, and leaving those would have reproduced the same inconsistency the reviewer identified. All four are OCCASIONAL with their numerators stated, all four are wired as downstream targets of the Neonatal and Infantile Encephalopathy with Lactic Acidosis node, and the Leigh Syndrome description no longer carries the developmental delay as prose. The Global Developmental Delay item additionally cites the second report's summary of the founding family's survivors, graded HUMAN_CLINICAL with quote_role BACKGROUND because that sentence restates the 2008 report rather than reporting this paper's own finding. The notes section now records that four phenotypes rest on the single patient who has a paragraph-length individual clinical description, and that this is an artefact of how the reports are written rather than evidence the features are rare. Feeding Difficulties is explicitly marked in its notes as inferred from the intervention rather than from a described symptom. Re-validated: just validate (59/59 snippets verified, up from 52), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-grading and check-snippet-length.

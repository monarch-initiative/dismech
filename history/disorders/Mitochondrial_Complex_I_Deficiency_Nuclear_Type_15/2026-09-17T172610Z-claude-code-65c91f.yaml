  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 15 (MC1DN15,
    NDUFAF4)'
  details: |
    Curated MC1DN15 (MONDO:0032620, NDUFAF4) as a standalone kb/disorders entry, following the per-gene pattern the rest of the MC1DN series uses. entry_type DISEASE. The preflight NDUFAF4 hits on MC1DN3 and MC1DN34 were verified and are not coverage: MC1DN3's causal gene is NDUFS7 and MC1DN34's is NDUFAF8, and every NDUFAF4 occurrence in those two files sits in prose or in a quoted snippet rather than in a gene_term binding. The gene symbol was confirmed against the HGNC REST API (HGNC:21034 NDUFAF4, previous symbol C6ORF66). Seven-node pathograph from the biallelic variant through loss of NDUFAF4 from Q-module assembly intermediates, the characteristic accumulation of P- and N-module intermediates with no Q-module accumulation, supercomplex remodelling, and isolated complex I deficiency, branching to the severe neonatal-encephalopathy pole and the isolated-optic-atrophy pole. One module conformance, at Isolated Complex I Deficiency only, against mitochondrial_dysfunction. Eleven phenotypes, each with its numerator recorded in notes against a denominator of roughly twelve reported patients. One experimental model (patient fibroblast complementation, replicated independently in 2008 and 2017) and one animal model (Drosophila NDUFAF3/NDUFAF4 disruption, placed in animal_models rather than experimental_models because a fly is an animal) and two treatments (idebenone as a recommendation for the optic pole, and the preclinical TAT-NDUFAF4 protein replacement). One open KNOWLEDGE_GAP discussion on whether variant position predicts which pole a patient gets, with the counter-evidence from the founding family's antenatal cardiomyopathy patient recorded as a REFUTE item. A falcon deep-research report is committed alongside; NDUFAF4 is its top gene at 67 mentions against 6 for the next, 8/8 references resolved with confabulation rate 0, and its preflight-dr WARN is an OMIM-number artefact explained in the entry notes. Nothing in the entry was taken from it. Validated with just validate (52/52 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens and the whole-KB snippet gates.

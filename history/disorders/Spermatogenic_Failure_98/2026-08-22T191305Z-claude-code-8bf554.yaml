  details: |
    Addressed the automated review on PR #9268. Added PMID:39267058 (second independent 167-proband cohort; patient M827, compound heterozygous c.1540-4C>T + c.8642_8643del, oligoasthenozoospermia rather than MMAF/NOA) to the genetic section, broadening the recorded genotype-phenotype range. Curated ClinGen's explicit Lumping and Splitting conclusion as REFUTE evidence against curating SPGF98 separately, and argued the divergence explicitly in the discussion rationale rather than eliding it. Bound the CFAP54-PCD differential to MONDO:0100607 and added distinguishing_features, recording that the usual ciliary assays do not separate the two. Added PMID:32704025 (CFAP54-SPEF2-CFAP221 mouse genetic interaction) as MODEL_ORGANISM support for the assembly-machinery node, with the caveat that SPEF2 is a C1b rather than C1d component. Added the PMID:37725231 allele-matched knock-in mouse as a second animal model, PARTIALLY_RECAPITULATES on the infertility node because it manifests full PCD. Added PMID:41393159 to the open boundary discussion (eight PCD patients, twelve alleles; the proband is female, so the two presentations are not separable by sex). Listed PCD GeneReviews PMID:20301301 for navigability with a rationale in notes for why it is not mined (cached abstract_only, 448 characters). Replaced the generic NCIT:C49236 ICSI treatment term with NCIT:C185482 Intracytoplasmic Sperm Injection. Repaired a snippet truncated mid-variant. Validation: linkml-validate clean, linkml-term-validator passed, 36/36 snippets verified against cached references (was 28/28), all five ungated gates clean, term cache integrity OK.

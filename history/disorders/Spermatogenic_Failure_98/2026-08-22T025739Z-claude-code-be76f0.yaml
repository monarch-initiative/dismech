  summary: 'Create: Spermatogenic failure 98 (CFAP54)'
  details: |
    New Disease entry for spermatogenic failure 98 (MONDO:0700290), claimed via issue #9222.

    Lump/split decision: DISEASE. One causal gene (hgnc:26456 CFAP54), no MONDO descendants, no existing entry. SYCP3-related_spermatogenic_failure.yaml was the gene-anchored precedent.

    Mechanism curated as a four-node chain: CFAP54 loss of function -> flagellar axoneme disorganisation and assembly protein depletion -> multiple morphological abnormalities of the sperm flagella -> male infertility, with the MMAF node conforming to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction.

    The claim issue asked whether the human phenotype is flagellum-restricted or whether airway motile-cilia involvement is also evidenced. It is evidenced: CFAP54 is an established PCD gene (PMID:37725231, PMID:39362668) and the Cfap54 mouse has full PCD with hydrocephalus and mucus accumulation alongside infertility. The entry therefore does NOT assert an infertility-restricted phenotype. CFAP54-related PCD is curated as a differential, and whether isolated spermatogenic failure and CFAP54-PCD are distinct entities or one spectrum is recorded as an open KNOWLEDGE_GAP.

    That question is more than bookkeeping because C1d-defective PCD is specifically invisible to the standard diagnostic algorithm: normal situs, normal nasal nitric oxide, normal TEM ultrastructure, normal high-speed videomicroscopy, and unreliable PICADAR scoring. A man diagnosed with CFAP54 infertility could have genuinely undetected airway disease that every standard test called normal. Both readings -- undiagnosed PCD versus allele-specific separation -- are untested, and proposed experiments cover each.

    The Cfap54 gene-trap mouse is curated via ModelMechanismLink at two fidelities: RECAPITULATES for the axoneme node (C1d structural defect; reduced ciliary beat frequency) but PARTIALLY_RECAPITULATES for male infertility, with limitations recording that the mouse manifests full PCD rather than isolated spermatogenic failure and so cannot be used to argue that isolated infertility is the expected consequence of CFAP54 loss.

    Treatments block curated (unusually for these entries) because there is real evidence: favourable clinical pregnancy outcomes with ICSI using these men's sperm, which makes the diagnosis prognostically useful rather than only explanatory.

    Curation gap surfaced in notes: Primary_Ciliary_Dyskinesia.yaml exists in the KB but does not mention CFAP54, now an established PCD gene. Adding it, with the diagnostic-elusiveness point, is flagged as a worthwhile follow-up.


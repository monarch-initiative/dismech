  summary: 'Create: SPGF26 (TSGA10)'
  details: |
    Created from MONDO:0054730 (OMIM 617961, causal gene TSGA10 hgnc:14927). Deep research: OpenScientist. The first run returned a report about TDRD9 (spermatogenic failure 30) that never named TSGA10; just preflight-dr returned FAIL and the report was discarded unused (reported on #14907). For the second run the entry name was temporarily set to 'TSGA10-Related Acephalic Spermatozoa Syndrome (Spermatogenic Failure 26)' and then restored; that report passed the gene-identity check (TSGA10 mentioned 87 times) with a WARN only because it cites OMIM 607166, the TSGA10 gene record, rather than the disease number. 26/26 references resolved. Primary sources read from the cache: four case reports defining the allelic series (PMID:28905369, PMID:32410354, PMID:34409526, PMID:38317066), the Tsga10 heterozygous knockout mouse (PMID:32790169), the mouse Tsga10 fibrous sheath processing study (PMID:14585816), an ICSI cohort (PMID:34089195) and two reviews (PMID:32104701, PMID:42366926). ICSI outcomes are recorded as one SUPPORT and one REFUTE item because the reports disagree. The Tsga10 heterozygous mouse is infertile while human disease is recessive; that divergence is stated on the animal model. No GeneReviews chapter. Validation: just validate-disorders passed (36/36 snippets, terms, schema); check-entity-refs, check-causal-targets and check-coarse-phenotypes OK. Before review, CI's 'Check for newly ungrounded genes' gate flagged TSGA10, whose landing node has no molecular function. GO annotates TSGA10 only with protein binding (GO:0005515, IPI), so instead of binding an uninformative term the node was added to tests/gene_activity_grounding_baseline.txt, as the script's own guidance allows for a node with no real molecular function to name, and the reason was added to the entry notes.

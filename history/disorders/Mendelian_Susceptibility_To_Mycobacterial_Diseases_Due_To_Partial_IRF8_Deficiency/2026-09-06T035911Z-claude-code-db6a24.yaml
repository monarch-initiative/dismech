  summary: Join all phenotypes to the pathograph
  details: |
    Cross-applied a blocking finding the reviewer raised on the sibling PR 11177 (CARD11), where four of the entry's phenotypes had no incoming causal edge and were therefore invisible to the graph.

    Five of this entry's six phenotypes had the same problem. Only Disseminated BCG disease was connected.

    Edges added, with the reasoning for each in its description:
    - Abnormal dendritic cell count, DIRECT from Selective Depletion of CD1c-Positive Conventional Dendritic Cells. It is the phenotype-side statement of that node: the node is the loss of the CD1c-positive subset, the phenotype is the circulating count in which the loss is measured.
    - Immunodeficiency, DIRECT from Insufficient Interferon-Gamma-Dependent Macrophage Activation. The failure to activate macrophages against weakly virulent mycobacteria is what the narrow immunodeficiency phenotype names.
    - Lymphadenopathy, Fever and Granuloma as sequelae of Disseminated BCG disease rather than as downstream nodes of the signalling chain. They are manifestations of the mycobacterial disease itself, and their frequency bands come from a pooled MSMD cohort rather than from the two reported T80A carriers, which the descriptions already said and the edge descriptions now repeat.

    Verified by recomputing phenotype in-edges from the file after the change: zero orphans, no unresolved targets.


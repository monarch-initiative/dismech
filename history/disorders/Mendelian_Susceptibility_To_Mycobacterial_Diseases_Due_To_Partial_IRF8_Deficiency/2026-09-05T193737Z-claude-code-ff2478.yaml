  summary: 'Create: MSMD due to partial IRF8 deficiency (IRF8 T80A)'
  details: |
    De-novo curation of MSMD due to partial IRF8 deficiency (MONDO:0013957, IRF8
    T80A), claimed at #11153. entry_type resolved to DISEASE and the stub deleted.

    Deep research: one OpenScientist run, committed as
    research/Mendelian_Susceptibility_To_Mycobacterial_Diseases_Due_To_Partial_IRF8_Deficiency-deep-research-openscientist.md
    with its citations sidecar and artifacts. It contributed the IRF8
    dose-dependence argument (PMID:40680811), the HPO annotation set for
    OMIM:614893, the pooled 830-patient MSMD cohort figures (PMID:38341181), the
    IL-12/23-IFN-gamma convergence statement (PMID:42183200) and the
    dominant-negative allele as a fourth IRF8 phenotype (PMID:40072380).

    Report validation. The run exited 3 before writing either validation section,
    so both were retrofitted. Reference validation: 12/12 resolved, 0 unresolved.
    Term validation could not be run by `just validate-research-terms` at all until
    MedGen, GARD and DOID were passed as extra --skip-prefix values; the failure is
    deterministic rather than the transient timeout described in #10396, and that
    distinction was reported on that issue. With those skipped the section reports
    40 terms, 31 resolved, 0 unresolved, and one label mismatch that is an artifact
    of the template line 'MONDO:0013957 (if available)'.

    One report identifier was wrong and was not used: NCIT:C20495 offered as
    "Interferon Gamma" is Interferon Beta. The entry binds NCIT:C583 (Recombinant
    Interferon Gamma) instead. The report's own term validation did not check the
    NCIT terms, so nothing flagged it; it was caught by resolving every CURIE
    independently before binding.

    Scope decision. The entry covers the autosomal dominant partial form only.
    Complete (recessive K108E) IRF8 deficiency, the biallelic R83C/R291Q phenotype
    and the dominant-negative c.1279dupT phenotype are curated as differentials, on
    the grounds that the compartment lost, the inheritance and the outcome all
    differ. Two of them are candidates for their own entries.

    Two things deliberately not asserted. The IL-12 production node is inferred from
    the position of conventional dendritic cells in the MSMD circuit, not measured
    in a T80A carrier; its incoming edge is INDIRECT_UNKNOWN_INTERMEDIATES, its
    evidence carries directness: INDIRECT, and a KNOWLEDGE_GAP with a proposed
    whole-blood assay is attached. Frequency bands for lymphadenopathy, fever and
    granuloma come from the pooled MSMD cohort across 21 genes, not from the two
    reported T80A carriers, and are marked INDIRECT for that reason.

    No GeneReviews chapter exists for this disorder; PubMed searches for
    "Mendelian susceptibility to mycobacterial disease GeneReviews" and
    "IRF8 GeneReviews" both returned zero records.

    Validation: just validate passes schema, terms and 27/27 snippets;
    check-entity-refs, check-causal-targets, check-duplicate-keys and
    check-enum-values are clean. Seven references fetched during research but not
    cited by the entry were pruned from references_cache rather than staged.

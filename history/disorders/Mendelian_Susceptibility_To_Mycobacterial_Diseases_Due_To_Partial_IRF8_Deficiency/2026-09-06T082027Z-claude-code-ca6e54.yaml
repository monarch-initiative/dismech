  details: |
    Two defects found by auditing this entry against the same checks a reviewer applied to its sibling PRs, rather than by a review round. First, the PMID:21524210 sentence stating that K108E and T80A impair IRF8 transcriptional activity by disrupting protein-DNA interaction was graded HUMAN_CLINICAL. It is a molecular assay of the variant proteins, not an observation of the patients, and Immunodeficiency_32B on main grades the identical sentence IN_VITRO. Regraded, with the reason recorded in the explanation. The divergence was invisible to tooling: check_snippet_grading compares gradings within a single file, so the same sentence carrying two values across two entries passes. Second, Genetic Counseling and Avoidance of Live BCG Vaccination had no pathograph edge, the only unconnected treatment in the entry. It now carries target_phenotypes on BCGosis (HP:0020087), the phenotype its actionable content prevents. target_mechanisms was deliberately not used: no TreatmentEffectEnum value describes removing an exposure, so a targets edge into the causal chain would have overstated it, and the prevention-not-treatment distinction is carried by the description and by the INDIRECT grading on the entry's evidence. Validation: schema, terms, 31/31 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms all clean; five whole-KB gates report nothing naming this entry; graph recomputed with zero orphan phenotypes, zero unconnected treatments, zero unresolved targets; no cache change.

  summary: 'Review round 1: split a bundled node, structure the defining allele, fix
    the modality'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 11161. Four blocking findings; three taken as stated, the fourth split because half of it was not supportable.

    1. therapeutic_modality on recombinant IFN-gamma changed PEPTIDE to PROTEIN_REPLACEMENT. IFN-gamma-1b is a recombinant protein, and the sibling IL12B MSMD entry already uses PROTEIN_REPLACEMENT for the same treatment, so the old value made two adjacent entries non-comparable by modality.

    2. The node Insufficient Interferon-Gamma-Dependent Macrophage Activation bundled IFN-gamma production (GO:0032609, in NK and T lymphocytes) with IFN-gamma response (GO:0060333, in the macrophage), and its own description narrated the chain between them. Split into Reduced Interferon-Gamma Production by NK and T Lymphocytes and the macrophage node, both CELLULAR rather than TISSUE, following the sibling entry. The IL-12 node now feeds the production node, which feeds the macrophage node, which keeps the edges to Disseminated BCG disease and Immunodeficiency. The production node cites the MSMD review's own division of the 22 MSMD genes into those impairing production and those impairing the response, which is the argument for the split.

    3. The defining T80A allele lived only in free-text notes. Added a Genetic.variants record naming the allele, its DNA-binding-domain location, and how it differs from the biallelic K108E allele, reusing two snippets already quoted in the file so no new references were needed.

    4. Of the two missing HPO annotations, Childhood onset was taken and Lymphadenitis was not. Childhood onset is now structural, as onset_category CHILDHOOD on the BCGosis descriptor, replacing three prose assertions. Lymphadenitis is declined with the reason recorded: no cited source reports it in a T80A carrier, and the two cached references that mention the word are against it, one using it to name the local BCG reaction in explicit contrast to the disseminated form this entry curates, the other describing a patient with a different MSMD genotype.

    Suggestions taken: the BCGitis/BCGosis binding choice is now documented in notes and citable to the same contrast sentence; HP:0002719 Recurrent infections is documented as deliberately not adopted; the IFN-gamma therapeutic_agent narrowed from NCIT:C583 to NCIT:C100089 Interferon Gamma-1b, which is what the cited snippet names; and the treatment's mechanism link gained treatment_effect ACTIVATES plus its own evidence item.

    Process note. The lymphadenitis check was nearly wrong in the same way the CARD11 round-2 error was. My first search used a sentence-bounded pattern and returned nothing, which would have supported a categorical claim that no reference mentions it. Re-deriving the cited-PMID list and running a plain case-insensitive search found two references that do. The finding survived, but for a different and better-evidenced reason than the one I would have written.

    Validation: schema pass, term validation pass, 31/31 snippets verified against the local cache (was 27/27), entity refs, causal targets, duplicate keys, enum values and qualifier terms clean, whole-KB gates report nothing for this entry.

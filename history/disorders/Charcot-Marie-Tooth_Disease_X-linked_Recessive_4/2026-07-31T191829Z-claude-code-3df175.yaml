  summary: 'Review response: CMTX4 pathograph connectivity + content gaps (PR #7411)'
  details: |
    Addressed the ai4c-reviewer REQUEST_CHANGES on PR #7411 across two rounds. Round 1: debundled the AIF redox node and added a parallel Increased Caspase-Independent Neuronal Apoptosis arm; modeled the auditory-neuropathy mechanism on spiral ganglion neurons (CL:0011113, PMID:36751702); added Hammertoe (HP:0001765) and Abnormal Pyramidal Sign (HP:0007256); re-anchored distal/foot phenotype frequency bands on the 7/7 count (PMID:8666389); added histopathology, prevalence (NOT_YET_DOCUMENTED), progression, classifications (NEUROLOGIC/mitochondrial disease), audiology/ABR and muscle-MRI diagnostics, cochlear-implantation and orthopedic-surgery treatments, therapeutic_modality tags, structured onset (CHILDHOOD), penetrance/expressivity note, and HP:0002073 for progressive cerebellar ataxia. Fixed the CI check_folded_hyphens failure. Round 2: connected the final 3 orphaned phenotypes (Peripheral Axonal Neuropathy, Hammertoe, Abnormal Pyramidal Sign) into the pathograph, added PMID:17805014 evidence to the cerebellar-ataxia causal edge, and aligned the pyramidal-sign frequency band (OCCASIONAL) with cerebellar ataxia. Corrected two inaccurate reviewer-suggested terms (UBERON:0002227 is spiral organ not spiral ganglion; CL:0000601 is the ANSD-spared outer hair cell). Validation: schema+terms pass, 48/48 snippets verified; graph-model-links test passes; all 13 phenotypes now have an upstream causal edge.

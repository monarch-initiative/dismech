  summary: 'Gene-family review: AIFM1'
  details: |
    The AIFM1 record had no relationship type or variant origin; typed it CAUSATIVE and germline with X-linked recessive inheritance, on the basis of the multiple families and alleles it already cites. Set the NADH oxidoreductase activity on the redox node to ABNORMAL (altered kinetics, PMID:23217327, PMID:41957773). The protein-stability node carried the gene with no activity; added FAD binding (GO:0050660) as DECREASED, supported by the compromised FAD retention of recombinant p.Glu336Lys AIF (PMID:41957773).

  summary: 'Create: Charcot-Marie-Tooth Disease X-linked Recessive 4 - AIFM1/Cowchock'
  details: |
    De-novo curation of CMTX4/Cowchock syndrome MONDO:0010689, gene AIFM1. Textbook-anchored first pass from verified primary literature Rinaldi 2012 PMID:23217327 landmark, plus PMID:28888069, PMID:30031633, PMID:37173762, PMID:31523922, then supplemented with an OpenScientist deep-research run. Every OpenScientist-sourced PMID/snippet independently verified against cached PubMed abstracts before use: E336K mechanism PMID:41957773, original 1985 description PMID:3856385, Xq24-q26 linkage PMID:8666389, DBS-for-tremor PMID:36907087, auditory-neuropathy PMID:36751702, Harlequin mouse PMID:17805014, manifesting-female PMID:42329587. Pathophysiology chain: AIF redox dysfunction to OXPHOS supercomplex misassembly/CHCHD4 loss to neuronal mitochondrial dysfunction to distal axonal degeneration, conforming to peripheral_axonal_degeneration. Added a HUMAN_MODEL_MISMATCH discussion on the Harlequin knockdown vs human missense redox-shift. Corrected two DR errors: an unverifiable Cowchock PMID and a wrong NCIT DBS term NCIT:C38013 to NCIT:C21024. Validation: schema and terms pass, 32/32 evidence snippets verified; compliance 84 percent.

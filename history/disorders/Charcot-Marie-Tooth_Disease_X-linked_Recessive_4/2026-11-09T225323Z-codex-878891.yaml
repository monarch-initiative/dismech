  summary: Review CMTX4 variant-specific mechanisms and clinical evidence
  details: |
    Reviewed the complete existing CMTX4 entry against the OpenScientist report and citation list, all cited cached sources, and available primary full text. Eligibility was checked on main 08e5471: no REVIEW record, genetic rather than infectious/environmental etiology, and no overlap among 47 open PRs with complete file inventories.

    Mechanisms: distinguish E493V redox kinetics and apoptotic susceptibility with retained NADH-induced dimerization and respiratory-chain activity from F210L fibroblast assembly abnormalities with preserved AIF/MIA40 binding, and E336K protein instability, CHCHD4 reduction and supercomplex abnormalities. Separate molecular events and label inferred links to neuronal injury. Remove unsupported claims of demonstrated human auditory/cortical/retinal neuronal apoptosis and mouse-to-human phenotype mechanisms. E336K attenuated induced cell death, rather than increasing it. Retain the Harlequin model-mismatch discussion with these allele-specific limitations.

    Full-text mining: PMID:23217327 (founding family, recombinant protein, fibroblasts and muscle), PMID:28888069 (F210L; including one-subunit-per-complex assay limitation), PMID:41957773 (E336K clinical course, biochemical results, cochlear implant partial benefit and riboflavin intolerance), PMID:37173762 (L311V family and progression), PMID:42329587 (heterozygous female encephalomyopathy/cardiomyopathy; kept distinct from classic CMTX4), and refreshed PMID:36751702 (T260A/R422W/R451Q in 293T-derived cells, not auditory neurons). The production fetcher upgraded the latter from abstract to full HTML. A forced refresh of PMID:31523922 still returned an abstract, so no unobserved full-text or table findings were assumed.

    Additional primary sources: fetched/read full PMID:39601015; I433M remains an ACMG VUS despite a Cowchock-consistent presentation, so its severe respiratory/anterior-horn findings are not asserted as established CMTX4 natural history. Fetched/read full PMID:32337346; G399S-family ataxia stabilized after childhood, and neurological findings in the heterozygous woman had explicitly uncertain attribution due to non-genetic confounders. PMID:28967629 was already cached as an abstract; the fetcher returned abstract text with no retrieved full text. Its two-patient riboflavin results are included as uncontrolled AIFM1-ataxia observations, not established disease modification.

    Phenotypes: remove unsupported whole-disease frequency bands while retaining original-kindred counts (hearing loss 5/7; developmental/cognitive involvement 3/7, not 3/5 of all affected males; colour-vision deficiency 3/7 in the Irish family). Add cerebellar atrophy; distinguish normal imaging and variable sensory involvement. Replace a uniformly progressive ataxia term with Ataxia to accommodate documented clinical stabilization. Do not elevate nonspecific biopsy findings to diagnostic criteria or general ANSD physiology to a demonstrated uniform CMTX4 pattern. Remove unsupported population penetrance and universal progression claims.

    GeneReviews baseline: check-genereviews returned TAGGED_OVERVIEW, with no CMTX4-specific chapter. The PubMed purpose statement is not used as a phenotype baseline. Refetched the full NBK1358 Bookshelf chapter through the supported cache command, replacing legacy raw HTML with generated extracted text. Used general CMT rehabilitation, orthoses, orthopedic surgery, vincristine precaution and X-linked reproductive counseling, with scope explicit. No general CMT frequency or genotype-specific GJB1 feature was assigned to CMTX4. Refreshed titles come from cache metadata. All URL citations use the required url: prefix.

    Research completeness checklist: phenotype coverage adequate after family-scoped corrections and imaging addition; subtype coverage adequate for this named AIFM1 neuropathy (infantile encephalomyopathy/SEMD/isolated deafness are allelic scope boundaries, not silently added subtypes); pathophysiology adequate with measured/inferred and variant distinctions; treatment coverage adequate including DBS case series, direct CMTX4 hearing-device observations and limited riboflavin data; genetic depth adequate with segregation, variant-specific evidence and explicit VUS/penetrance limits; diagnostics adequate with electrophysiology, sequencing, hearing assessment and imaging; references actively consumed using full text. Experimental NADH rescue in other ANSD variants and Harlequin retinal/neurotoxin treatments are not clinical CMTX4 therapies. PMID:27102849 and PMID:37644805 were screened for allelic scope; their SEMD/neonatal encephalopathy findings were not imported. No disease-specific controlled trial was identified. The E336K study reports structural deposition PDB 9SZQ; no GEO/ArrayExpress accession was reported in the reviewed clinical and biochemical studies.

    Validation: just validate-disorders passed schema, ontology and reference checks (82 snippets / 87 titles). The targeted tests/test_data.py disorder test passed. Causal-target, entity-reference, name-collision, coarse-phenotype and logical-rule checks passed. Gene-activity grounding, snippet length, title-snippet, snippet-grading and reference-title ratchets passed against the exact base commit. All node-class examples resolved. The other entry sharing refreshed references retained 155/155 verified snippets. The generated page was inspected for the updated mechanisms, cerebellar atrophy, hearing-device outcome, riboflavin and variant caveats; generated HTML is excluded from the commit. Pre-commit formatting passed, and nine unrelated pre-existing cache files were preserved byte-for-byte.

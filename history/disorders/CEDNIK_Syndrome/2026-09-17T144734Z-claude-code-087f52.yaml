  summary: 'Create: CEDNIK Syndrome (SNAP29)'
  details: |
    De-novo curation of CEDNIK syndrome (MONDO:0012290), biallelic SNAP29 loss of function, from a Perplexity sonar-deep-research run (research/CEDNIK_Syndrome-deep-research-perplexity.md, 373s, 18 citations).

    The report was a lead only. It contains exactly one PMID string in its whole body (PMID:15968592), and its citations sidecar lists web URLs rather than identifiers, so all four references here were found independently through PubMed esearch and cached with just fetch-reference. Its ontology suggestions were not used: the run's own Term Validation section records mislabelled bindings including GO:0031017 offered as 'lamellar body' (GO: exocrine pancreas development), GO:0048812 offered as 'epidermal cell differentiation' (GO: neuron projection morphogenesis) and HP:0000579 offered as 'optic nerve hypoplasia' (HP: Nasolacrimal duct obstruction). Every CURIE in this entry was looked up against OLS in the step it was written; hgnc:11133 was read from the repository's own cache/hgnc/terms.csv.

    References: PMID:15968592 (Sprecher, founding description and the lamellar granule lesion in patient skin), PMID:21073448 (second homozygous allele, transfection proof of loss of function, human organotypic replication), PMID:26747696 (two knockout mouse models, lamellar body and autophagy readouts), PMID:31633066 (neurological/ophthalmological mouse model, and the 22q11.2 locus relationship).

    Curation judgements worth recording. The entry deliberately types its two arms differently: the epidermal chain is DIRECT because it is measured in patient skin and reproduced in both a keratinocyte-specific mouse and human organotypic culture, while every edge out of the Neuroectodermal Developmental Disruption node is INDIRECT_UNKNOWN_INTERMEDIATES because the shared neuroectodermal origin is an argument for expecting a connection, not a mechanism. Six clinical features are cited from the introduction of a mouse paper where that introduction states the human clinical picture; they carry evidence_source HUMAN_CLINICAL with quote_role BACKGROUND, because grading them MODEL_ORGANISM would assert that a mouse measured human deafness. The autophagy arm is recorded as a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap: the LC3B-II, p62 and CHOP readouts exist but only in mouse epidermis. Peripheral neuropathy and hearing impairment are bound to the nearest available HPO terms with the uncommitted clinical description kept in preferred_term, because no located source characterises either as demyelinating/axonal or sensorineural/conductive in genetically confirmed patients.

    Validation: just validate passed; 30/30 snippets verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all OK; 10 of 11 phenotypes causally connected (90.9%). just check-genereviews reports NO_CHAPTER, recorded in the entry's notes.

  summary: 'Review round 1: four phenotypes added, three bindings widened (PR #12041)'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #12041 in a single push.

    Blocking item 1 - four clinical features present in an already-quoted sentence but not curated. Taken in full. The reviewer's observation was correct and uncomfortable: PMID:31633066's introduction sentence was already quoted six times in the entry and lists eleven features, of which only five were curated. Added severe intellectual disability (HP:0010864), poor head control (HP:0002421), craniofacial dysmorphism (HP:0001999) and roving eye movements. The first three came from the reviewer's suggestions and were each re-resolved against OLS before binding rather than taken on trust.

    Roving eye movements needed a decision the reviewer left open: HPO has no term for them. A search returns nothing, and the nearest descendants of the eye-movement branch name saccadic, conjugate, paroxysmal and involuntary abnormalities, none of which is this. Bound the parent HP:0000496 Abnormality of eye movement, as the reviewer suggested as fallback, with the clinical description kept in preferred_term - a wrong sibling would have been worse than a correct parent.

    Severe intellectual disability is curated separately from the existing Global developmental delay rather than merged: delay is a statement about the rate at which milestones are reached and the source names the severity of the eventual cognitive outcome as well.

    Three of the four are wired into the Neuroectodermal Developmental Disruption node as INDIRECT_UNKNOWN_INTERMEDIATES, consistent with every other edge out of that node. Craniofacial dysmorphism is deliberately left unconnected: neither the matrix node nor the neuroectodermal node has any stated route to facial morphology, and an edge added to raise a connectivity number is worse than no edge.

    Blocking item 2 - three bindings narrower than their sources. Taken in full, and the reviewer is right that my original reasoning was wrong. I had bound the narrower term and parked the hedge in preferred_term; the bound CURIE is what exports and what queries hit, so that hedge does not travel. Peripheral demyelination HP:0011096 to Peripheral neuropathy HP:0009830, Sensorineural hearing impairment HP:0000407 to Hearing impairment HP:0000365, Generalized hypotonia HP:0001290 to Axial hypotonia HP:0008936. The first two were asserting a mechanism no source establishes (demyelinating rather than axonal, sensorineural rather than conductive); the third was a scope error, since the source says trunk hypotonia. The notes block that explained the old near-miss bindings has been rewritten to explain the new ones.

    Validation after fixes: just validate passed; 34/34 snippets verified (up from 30/30); just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all OK; 13 of 15 phenotypes causally connected (86.7%, up from 10 of 11).

    One process note: the first attempt at adding the four phenotypes produced invalid YAML because the evidence: key was omitted from each new block. just validate caught it as a parse error before anything was committed.

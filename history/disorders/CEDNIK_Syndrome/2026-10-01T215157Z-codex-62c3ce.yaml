  summary: Review CEDNIK against primary clinical and mechanistic full texts
  details: |
    Reviewed the complete entry, prior research and primary clinical literature, including the founding full text, 2021 six-patient cohort and supplementary table images, confirmed later cases, patient fibroblasts, human neuroepithelial and mitotic models, two mouse backgrounds, zebrafish and mouse ESCs. Corrected the claim of a purely developmental course, uniform early skin onset, all-null protein consequences and exclusive homozygous/deletion inheritance. Added primary evidence for demyelinating neuropathy, sensorineural hearing loss, callosal hypoplasia versus agenesis, regression and myelin loss, swallowing and supportive care. Separated lamellar lipid delivery, protease retention, desquamation, barrier and differentiation mechanisms. Located the 2016 LC3/p62/CHOP assays in cultured mouse fibroblasts and removed the unsupported claim that static markers prove blocked fusion; recorded context-dependent negative model results. Preserved and updated three existing discussions. Excluded the 2024 pyloric-stenosis case as evidence for confirmed CEDNIK because its reported genetic finding is a chromosome-2 homozygosity interval without a SNAP29 variant. Distinguished two truncating-variant deletion cases from two prediction-supported missense candidates in the 2013 series. Avoided questionable aggregated skin percentages and duplicate counting of the Brazilian sequence-variant/deletion case. Generated all reference caches through the fetcher; no GeneReviews chapter exists in the checked index.

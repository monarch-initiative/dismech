  summary: Reviewed EBV_Associated_Gastric_Cancer, added literature-backed evidence to classifications and treatments, separated epigenetic CDKN2A silencing from somatic ARID1A/BCOR inactivation in pathophysiology, and refined evidence metadata.
  details: >-
    1. Added literature-backed evidence (PMID:25079317) to classifications entries (icdo_morphology and harrisons_chapter: ONCOLOGY_HEMATOLOGY, GASTROINTESTINAL, INFECTIOUS_DISEASES).
    2. Added PIK3CA gene and GO annotations on PI3K-AKT Pathway Activation; annotated CDKN2A and cell-cycle checkpoint/CDK-inhibitor GO terms on Tumor Suppressor Gene Silencing with a downstream edge to Uncontrolled Cell Proliferation; and added a separate ARID1A and BCOR Somatic Inactivation node (with SOMATIC/LOSS_OF_FUNCTION genetic_context, ARID1A/BCOR gene bindings, GO:0006338 chromatin remodeling, GO:0003682 chromatin binding and GO:0003714 transcription corepressor activity molecular_functions, PMID:25079317 evidence, and a downstream edge to Uncontrolled Cell Proliferation).
    3. Removed variant_origin: SOMATIC from the epigenetically silenced CDKN2A entry in genetic, updated infectious_agent PMID:41280003 evidence_source to HUMAN_CLINICAL, added evidence to Surgical Resection (PMID:40647518, PMID:38966500) and Chemotherapy (PMID:38966500) with quote_role: REVIEW_SYNTHESIS on PMID:38966500 items, and updated Immune Checkpoint Inhibitors therapeutic_modality to MONOCLONAL_ANTIBODY.

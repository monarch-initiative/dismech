  summary: 'Review round: restore the genetics pass a bad merge resolution dropped'
  details: |
    Review round on PR 13029. A merge of main into this branch resolved the content conflicts on this entry by taking main's side, which deleted most of the genetics pass recorded in the 2026-09-27 session above. Restored here: the disease_term re-anchor to MONDO:0017784 Epstein-Barr virus-associated gastric carcinoma, the MONDO:0001056 skos:broadMatch mapping and its justification, the parents line (gastric carcinoma), the anchor and GAPPS notes, the JAK2 molecular_functions binding on the 9p24.1 node, the five downstream edges from Uncontrolled Cell Proliferation to Abdominal Pain, Weight Loss, Anemia, Hepatomegaly and Lymphadenopathy, and the Anemia to Fatigue sequela. Everything main added is kept.

    Main and this branch had independently split ARID1A and BCOR out of the methylation node into a node of their own. Main's node, ARID1A and BCOR Somatic Inactivation, is kept: it carries genetic_context, GO:0006338 chromatin remodeling, and GO:0003682 and GO:0003714, where this branch's node bound only GO:0003712 transcription coregulator activity, which an OLS hierarchicalAncestors query confirms is a parent of GO:0003714. The one thing main's node lacked, CL:0000066 epithelial cell, is folded in, because main's node declares variant_origin SOMATIC and so is a cancer-origin node. just check-cancer-origin still derives one origin, CL:0000066, as it did before.

    The JAK2 molecular function is restored with modifier INCREASED rather than this branch's earlier GAIN_OF_FUNCTION. The cited TCGA snippet reports a copy-number amplification at the locus and a proposal to test JAK2 inhibitors, not an escape from host regulation, and INCREASED matches how main grades the PIK3CA activity on the PI3K-AKT node in the same entry.

    Measured after the restore with dismech.qc_plugins: phenotype inlink 6/6 against 0/6 on origin/main, gene-to-mechanism wiring 7/7 against 4/4. just count-verified-snippets over both entries in this round reports 117/117.

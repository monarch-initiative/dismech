  summary: 'Genetics pass (d2g series-068): re-anchor to the EBV gastric carcinoma
    class, wire seven genes and all six phenotypes'
  details: |
    Genetics-gap issue 12275. The entry bound MONDO:0001056 gastric cancer, a site-based grouping whose children include gastric lymphoma, leiomyosarcoma, liposarcoma and germ cell tumour, and which is three levels above the GAPPS term the gap list attributed to this entry. MONDO:0017784 Epstein-Barr virus-associated gastric carcinoma exists, is a direct child of MONDO:0004950 gastric carcinoma, carries a definition matching this entry, and was bound nowhere in kb/; it is now the disease_term, with MONDO:0001056 retained as a skos:broadMatch cross-reference and the reasoning recorded in notes. Gene wiring went 0/4 to 7/7: PIK3CA onto the PI3K-AKT node, CDKN2A onto Tumor Suppressor Gene Silencing, a new Chromatin and Corepressor Gene Mutation node carrying ARID1A and BCOR rather than putting them on the methylation node whose evidence does not support them, and three new genetic records for the 9p24.1 amplicon genes JAK2, CD274 and PDCD1LG2, all bound on the 9p24.1 node whose own cited snippet names them. Phenotype inlink went 0/6 to 6/6, with Fatigue drawn from Anemia as a sequela rather than from tumour burden. MONDO:0017790 GAPPS is declined structurally in notes as a germline APC promoter syndrome. No new references fetched. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

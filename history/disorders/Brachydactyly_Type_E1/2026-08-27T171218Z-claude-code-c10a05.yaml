  summary: 'Review: wire pathograph, add phenotypes and 2025 diagnostic-yield data'
  details: |
    Final-pass review. Phenotype causal connectivity was 0/5, now 8/8. Added short distal phalanx of finger, the short broad thumb of BDD overlap, and round face. Added a second prevalence record from a 2025 Chinese series [PMID:40589517] - 135 BDE cases in 60,650 consecutive wrist radiographs - tagged PARTIAL because the cohort is hospital-referred and unsubtyped. The same paper strengthens the diagnosis section with phenotype-stratified diagnostic yields [19.1 percent isolated, rising to 75-83 percent with short stature, facial dysmorphism or intellectual disability] and the observation that solved cases were mostly syndromic genes such as GNAS, EXT1 and ACAN rather than HOXD13 - which is the practical reason a BDE hand is more often a clue to another diagnosis than to isolated type E1.

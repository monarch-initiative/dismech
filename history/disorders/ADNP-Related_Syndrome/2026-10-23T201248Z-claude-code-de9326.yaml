  summary: Link two Adnp knock-in mice to their MGI genotypes
  details: |
    From MGI allele records: Adnp<em1Goz> (MGI:7867540) is c.2154T>A p.Tyr718*, so the heterozygous p.Tyr718* knock-in maps exactMatch to MGI:7867699; Adnp<em1Ant> is a 14-nt deletion giving Leu822His and a stop after six residues, so the heterozygous c.2463_2476del frameshift maps exactMatch to MGI:7867619 (both cite PMID:42208149). The monarch-animal-models catalog had paired both genotypes with the complete-knockout and Adnp+/- models instead, on shared gene and disease; those models were left unmapped.

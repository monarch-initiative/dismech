  summary: Comprehensive ADNP-related syndrome review
  details: |
    Re-reviewed the ADNP-related syndrome entry against primary human cohorts, GeneReviews, mechanistic studies, animal models, and 2025-2026 literature. Replaced blanket disease-wide haploinsufficiency with explicit NMD-escaping and allele-specific true-null branches; rebuilt the evidence-backed causal graph; corrected phenotype frequencies and denominators; added progression, imaging, diagnosis, differentials, animal models, biomarker readout semantics, treatment targets, live trial metadata, and open research gaps. Preserved model-to-human and allele-specific uncertainty, including limits of the single p.C687R iPSC study, male-only 2026 mouse work, imaged-subgroup MRI estimates, open-label ketamine evidence, and preclinical davunetide evidence. Validation included LinkML schema, ontology terms, exact cached snippets, graph integrity and connectivity, treatment-action constraints, reference inventory closure, and reference-cache frontmatter.

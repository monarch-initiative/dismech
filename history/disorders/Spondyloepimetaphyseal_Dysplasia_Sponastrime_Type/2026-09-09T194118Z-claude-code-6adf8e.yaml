  summary: 'Create: SPONASTRIME dysplasia (TONSL)'
  details: |
    New entry for claim #11555 (spondyloepimetaphyseal dysplasia, sponastrime type, MONDO:0010068, TONSL). Preflight found nothing in kb/ mentioning TONSL or sponastrime. Curated from one OpenScientist deep-research report (research/Spondyloepimetaphyseal_Dysplasia_Sponastrime_Type-deep-research-openscientist.md; 15/15 references resolved, term validation needs_review true) plus the primary literature. Five-node pathophysiology chain from hypomorphic TONSL loss through failed H4K20me0-dependent recruitment of TONSL-MMS22L, impaired homologous-recombination repair at stalled forks, and replication stress with chromosome breakage, to loss of proliferating growth-plate chondrocytes. The last node is marked mechanism_confidence HYPOTHETICAL, carries no evidence item, and its incoming and outgoing edges opt into a mechanistic_hypotheses group (chondrocyte_depletion_model, status EMERGING) because no study has examined growth-plate chondrocytes in this disease; the chondrocyte step is an inference from which cells divide fastest. A KNOWLEDGE_GAP discussion with a proposed experiment records what would settle it. The Tonsl knock-in mouse is recorded as FAILS_TO_RECAPITULATE with limitations, since embryonic lethality is what establishes the hypomorphic requirement and simultaneously makes the model uninformative for every downstream node. Six of the report's suggested HP terms were wrong on lookup: HP:0000944 offered for platyspondyly is Abnormal metaphysis morphology, HP:0005789 offered for metaphyseal striations is Generalized osteosclerosis, HP:0001541 offered for delayed carpal ossification is Ascites, HP:0000601 offered for short dental roots is Hypotelorism, HP:0009900 offered for dentin dysplasia is Unilateral deafness, and HP:0001388 for joint laxity is obsolete. The correct terms were looked up and the two unresolvable rows were dropped rather than approximated. TONSL was resolved to hgnc:7801 from the HGNC REST API since it was absent from cache/hgnc/terms.csv. The neutropenia phenotype is graded MODEL_ORGANISM on purpose because the only quotable sentence reports it in the zebrafish model, not in patients. Validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-duplicate-keys and just validate-disorders.

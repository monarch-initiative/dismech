  details: |
    Round 1 on PR #11565. Finding B is the one worth recording precisely, because the reviewer identified circular reasoning rather than a missing fact. The PR body said no quotable management sentence exists 'in the sources this entry cites', and the reason none existed is that I had fetched PMID:40794898 and PMID:27149441 and then deleted both as uncited during the pre-commit cache prune. So the claim was true only because of a decision I had made, and it read as a statement about the literature. Both are now fetched, cited, and carry a treatments block: growth hormone (one six-month course in a molecularly confirmed patient, limited improvement, recorded as attempted rather than effective) and foramen magnum decompression for a reported Chiari malformation. Finding C was correct: neutropenia was asserted of humans on zebrafish evidence alone. PMID:40794898 reports it in a genotyped 6-year-old and lists it among recognised associated features; both are now the primary evidence and the zebrafish quote is retained as corroboration. Finding A: added frontal bossing, lumbar hyperlordosis, joint hypermobility, delayed skeletal maturation and Chiari malformation. Three of these carry notes recording that the available quote is broader than the phenotype claimed, rather than being dropped or silently over-claimed. Frontal bossing was initially cited to a four-word sentence that check-snippet-length rejected; re-sourced to PMID:40794898, which gives 82.2% and sets a frequency band. Finding D: added variants (the recurrent UBL-domain R934W and G973R with their structural mechanisms), imaging_findings, a second definitions record for molecular confirmation including the 10-of-13 yield and what the three unexplained cases mean, differential_diagnoses covering both the SEMD group and the striation-negative TONSL spectrum, and a top-level references block. The OMIM and ORPHA mappings the reviewer asked for cannot be expressed: DiseaseMappings has only icd10cm, icd11f, mondo and ncit slots. Finding E: the replication-stress node now has edges to Developmental cataract and Short dental root, the two branches research section 6c models, both opted into the hypothesis group and both marked INDIRECT_UNKNOWN_INTERMEDIATES. The group was renamed from chondrocyte_depletion_model to proliferative_tissue_depletion_model and its description broadened, since it now covers three tissues rather than one. On the reviewer's GeneReviews caveat: they could not check for lack of network access. I ran the searches. No chapter exists for SPONASTRIME dysplasia, TONSL, or spondyloepimetaphyseal dysplasia by title; all three return zero results. That is recorded in the entry's notes, with the consequence that the phenotype baseline here is two gene-discovery cohorts and case reports rather than an expert-curated chapter. Re-validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-snippet-length and just validate-disorders; 46/46 snippets verified, up from 28/28.

  summary: 'Bind LOINC: CSF HVA, MHPG, and 5-HIAA'
  details: |
    Added loinc_term LOINC:2434-9 (CSF homovanillic acid) to the 'Low CSF homovanillic acid' marker, LOINC:47538-4 (CSF 3-methoxy-4-hydroxyphenylglycol) to the 'Low CSF 3-methoxy-4-hydroxyphenylethylene glycol' marker, and LOINC:47544-2 (CSF 5-hydroxyindoleacetic acid, moles/volume) to the 'Normal CSF 5-hydroxyindoleacetic acid' marker. All three are the entry's own consensus-guideline diagnostic hallmark for TH deficiency (low CSF HVA and MHPG with normal CSF 5-HIAA); the normal-5-HIAA marker was bound even though its own value is a normal result, since the test is still performed and diagnostically decisive (the normal result is what distinguishes TH deficiency from AADC and BH4-pathway disorders), the same principle as binding a normal-result test elsewhere in this tranche. All three LOINC codes were newly seeded via just loinc-seed-cache. just validate-disorders passed with 0 issues.

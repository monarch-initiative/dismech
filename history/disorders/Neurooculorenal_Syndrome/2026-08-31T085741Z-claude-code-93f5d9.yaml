  summary: 'Create: Neurooculorenal Syndrome'
  details: |
    De-novo curation of neurooculorenal syndrome, MONDO:0957210, ROBO1 - the biallelic SLIT-ROBO guidance-receptor disorder. One OpenScientist deep-research run: 11/11 references verified, confabulation_rate 0.0; term_validation needs_review true with one obsolete and two unverifiable terms. No CURIE was taken from the report, and that was the right call again - its NCIT suggestions for the treatment section were wrong in the same way as on the other two entries in this run, proposing NCIT:C15366 as Kidney Transplantation when it is Platelet Transfusion and NCIT:C15431 as Hemodialysis when it is Hematopoietic Cell Transplantation. Correct terms were selected from cache/ncit/terms.csv instead. A naming trap is recorded in the entry notes: the defining paper never uses the phrase neurooculorenal syndrome, calling the entity syndromic CAKUT; the name comes from the OMIM entry created afterwards, so a text search for the disease name against its own primary source returns nothing. Every snippet is therefore keyed on ROBO1 and the organ phenotypes. The report contributed the pituitary dimension, which the syndrome name omits and which the entry now curates as its own phenotype plus a hormone-replacement treatment, with PMID:38444307 graded INDIRECT because that patient is heterozygous rather than biallelic. A tested and negative ciliopathy hypothesis is curated as REFUTE evidence rather than dropped. Validated with just validate - schema, terms, 52/52 snippets verified - plus the ungated whole-KB gates.

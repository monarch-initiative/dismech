  summary: Cite evidence for 5 previously evidence-free environmental exposures
  details: |
    Issue 8296 tranche 1. Sources were located by PubMed search, cached with `just fetch-reference`, and every snippet was verified as an exact quote from the cached abstract. Added an EvidenceItem to each of the five `environmental:` exposures (Appendectomy, Smoking, NSAIDs, Infections, Stress), which previously carried only a name and a one-line note. The counterintuitive protective-smoking claim named in the issue is now cited to a 2025 case-control meta-analysis (PMID:40246988). Two items are graded PARTIAL rather than SUPPORT: the Infections citation (PMID:39333475) evidences one specific infection, infectious mononucleosis, rather than the generic claim; and the Stress citation (PMID:10811330) found long-term but explicitly NOT short-term stress predicts exacerbation. Validated with `just validate`, `just count-verified-snippets` (66/66 for this file) and the batched `just validate-disorders` sweep.

  details: |
    Weekly compliance pass focused on disease classification for immune-mediated disorders. Added a classifications block assigning Harrison's Part GASTROINTESTINAL, cited to PMID:30837080. GASTROINTESTINAL rather than IMMUNE_RHEUMATOLOGIC follows the classification guidance to prefer the organ-system Part where the primary chapter would appear, and matches the placement given to Pouchitis in the same curation pass. Added evidence to the Fecal Calprotectin biochemical marker from PMID:40943053, newly fetched, a systematic review of non-invasive markers in ulcerative colitis. Left CRP and ESR unevidenced: no cached reference states their role in ulcerative colitis specifically. Left the 18 genetic entries unevidenced because attaching a single IBD GWAS to all of them without checking that each gene is named would repeat the error avoided in the Atopic Dermatitis entry in this same pass. Validated with just validate, just validate-terms, and just count-verified-snippets with 68/68 snippets verified. Weighted compliance rose from 76.8 percent to 77.6 percent.

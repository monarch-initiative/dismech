  summary: Add somatic clonal remodeling node (Kakiuchi 2020)
  details: |
    Added pathophysiology node 'Somatic Clonal Remodeling of Colonic Epithelium' from PMID:31853061 (Kakiuchi et al., Nature 2020): positively selected somatic mutations in NFKBIZ, TRAF3IP2, ZC3H12A, PIGR and HNRNPF in non-dysplastic UC epithelium, with genetic_context variant_origin SOMATIC and decreased IL-17 signalling (GO:0097400). Wired a downstream edge from Mucosal Inflammation. Snippets come from the cached abstract. Full-text figures (clone frequencies, rectal clone coverage) are in node notes. No HP:0001442 inheritance block was added and no genetic: rows were added, because these acquired clonal mutations are a consequence of chronic inflammation and not a cause of UC.

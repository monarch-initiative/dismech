  summary: Merge duplicated classifications blocks (#8623)
  details: |
    Same collision as Atopic_Dermatitis: two curation passes each added a
    top-level `classifications:` block at a different point in the file, git
    merged both without a conflict, and the entry ended up with two
    `classifications:` keys in one mapping. PyYAML keeps the last value silently,
    so nothing here surfaced it; the ruamel-backed linkml-reference-validator
    rejects the file outright.

    This one had gone unnoticed because the reference validator only runs on the
    files a PR changes, and nothing had touched this entry since the collision. It
    was found by a whole-KB duplicate-key sweep added in the same PR.

    Merged the two into the single block after `parents:`. Both harrisons_chapter
    values are retained: GASTROINTESTINAL (which now also carries the PMID:30837080
    review evidence from the later block) and IMMUNE_RHEUMATOLOGIC. Keeping both
    matches the sibling Crohn_Disease entry, which carries the same pair.

    The GASTROINTESTINAL explanation was trimmed of its closing argument that the
    immune Part should not be assigned, since that sentence contradicted the immune
    Part in the same block, and of its reference to a placement given to Pouchitis,
    which carries no classifications block. No evidence item, snippet, or reference
    was added or changed.

    Validated with `just validate-disorders` over this file and
    Atopic_Dermatitis.yaml: schema, terms, and references all pass, 133/133
    snippets verified against cached references.

  details: |
    # Evidence review — kb/disorders/Ulcerative_Colitis.yaml

    ## Stats
    - Evidence items checked: 51 (every `reference:` block in the file, across
      classifications, pathophysiology, mechanistic_hypotheses, phenotypes,
      biochemical, genetic, environmental, treatments, discussions,
      experimental_models).
    - References read: 38 distinct cached records (37 `PMID_*.md` plus the
      uncited `references:` block entries checked for duplication). All cache
      files present; no missing cache and no snippet absent from its cache
      (`count-verified-snippets`: 111/112 across the three assigned files, the
      single skip being a `DOI:` prefix in another file).
    - Verified clean (snippet exact, on-claim, grading and `evidence_source`
      defensible): 39 of 51.

    ## Findings

    1. **pathophysiology#Mucosal Inflammation (line ~76), PMID:39438660** —
       the snippet was the study's *methods/scale* sentence ("We generated ~1
       million single-cell transcriptomes, organised into 109 cell states, from
       216 gut biopsies (41 subjects), revealing disease-specific differences"),
       which establishes only that the study was done, while the `explanation`
       asserted "disease-specific inflammatory cell states in the colonic
       mucosa". Vague-fragment-as-finding. Severity: DEFECT.
       ACTION: fixed — replaced with the results sentence from the same cached
       abstract ("A systems biology-spatial analysis identified granuloma
       signatures in CD and interferon (IFN)-response signatures localising to T
       cell aggregates and epithelial damage in CD and UC.") and trimmed the
       explanation to what that sentence shows. Note this sentence is now quoted
       three times in the file (also under Dysregulated Immune Response and
       Epithelial Barrier Dysfunction); all three carry the same grading, so
       `check-snippet-grading` is satisfied, but a maintainer may prefer to
       diversify.

    2. **pathophysiology#Mucosal Inflammation (line ~68) and
       pathophysiology#NLRP3 Inflammasome-Mediated Pyroptosis (line ~373),
       PMID:38314135** — both quote "Reducing SLC6A14 decreased
       pyroptosis-associated proteins (ASC, IL-1β, IL-18, NLRP3)." with no
       `evidence_source`, which per CLAUDE.md reads as the HUMAN_CLINICAL
       default. That sentence sits in the abstract's cell-line block
       (sh-SLC6A14 in LPS-stimulated FHC and NCM460 cells); the paper's human
       data are the separate tissue-expression sentence. Severity: DEFECT
       (mis-graded source).
       ACTION: fixed — set `evidence_source: IN_VITRO` on both occurrences
       (changed together, as `check-snippet-grading` requires one value per
       quoted sentence). The sibling item quoting "SLC6A14 was increased and
       correlated with NLRP3 in UC tissues" is genuinely human tissue and was
       left at the HUMAN_CLINICAL default.

    3. **pathophysiology#Loss of Keystone SCFA Producers (line ~247),
       PMID:18936492** — `explanation` read "Sokol et al. demonstrated F.
       prausnitzii depletion is consistently observed in IBD", but the quoted
       sentence is about reduced *Firmicutes* abundance/biodiversity in *Crohn
       disease* patients — wrong taxonomic level and a disease generalisation
       the quote does not make. Severity: MINOR.
       ACTION: fixed — explanation now states what the quote states (Firmicutes,
       Crohn disease) and says why the item is PARTIAL for a UC node.

    4. **pathophysiology#Loss of Keystone SCFA Producers (line ~255),
       PMID:18936492** — snippet "F. prausnitzii exhibits anti-inflammatory
       effects on cellular and TNBS colitis models…" had no `evidence_source`,
       i.e. defaulted to HUMAN_CLINICAL, while the sentence reports Caco-2/PBMC
       work plus TNBS-induced colitis in mice. Severity: DEFECT.
       ACTION: fixed — set `evidence_source: MODEL_ORGANISM` (the sentence
       includes in vivo mouse data; CLAUDE.md routes any in vivo animal data
       there). Splitting the sentence into an IN_VITRO and a MODEL_ORGANISM item
       would be the fuller fix but is restructuring, so it was not done.

    5. **phenotypes#Fatigue (line ~571), PMID:27310658** — `explanation` said
       fatigue "correlates with disease activity and symptom severity", but the
       cited cohort explicitly concluded the opposite for activity: "There were
       no associations between fVAS scores and CRP, fecal calprotectin, or Mayo
       endoscopic scores." Explanation contradicted its own source.
       Severity: DEFECT.
       ACTION: fixed — explanation now says fatigue tracks reported symptom
       burden and records the cohort's null result for objective activity
       markers. Snippet and grading unchanged.

    6. **phenotypes#Bloody Diarrhea (line ~495), PMID:38724705** — the sole
       evidence for the entry's cardinal phenotype is the checkpoint-inhibitor
       colitis (irColitis) single-cell paper, quoting "Luminal epithelial cells
       in patients with irColitis expressed PCSK9, PD-L1 and interferon-induced
       signatures associated with apoptosis, increased cell turnover and
       malabsorption." That is a different disease (an immune-related adverse
       event, not UC), and the quote mentions neither bleeding nor diarrhea; the
       explanation supplies the whole inferential chain. Named Entity Confusion
       plus snippet-does-not-support-claim. Severity: DEFECT.
       ACTION: reported only — the irColitis cache contains no bloody-diarrhea
       sentence, so no same-reference substitution exists, and the fix policy
       forbids adding a reference. Recommended fix for a maintainer: cite
       PMID:31272578 ("Typical symptoms on presentation are bloody diarrhea,
       abdominal pain, fecal urgency, and tenesmus.") or PMID:30837080 ("The
       classic presentation of UC include bloody diarrhea with or without
       mucus…"), both already cached and already used elsewhere in this file.

    7. **pathophysiology#Epithelial Barrier Dysfunction (lines ~185, ~194),
       PMID:38724705** — two further items borrow the same irColitis paper as
       mechanistic support for UC barrier dysfunction. Both are graded PARTIAL
       and both explanations are carefully worded ("in inflammatory colitis",
       "in colitis") rather than claiming UC, so this is defensible
       cross-disease mechanism transfer rather than a misattribution — but the
       node's only non-UC-specific support is now two quotes from a
       checkpoint-inhibitor cohort. Severity: NOTE.
       ACTION: reported only.

    8. **pathophysiology#Decreased Butyrate Production (line ~300),
       PMID:23023125** — the node's only evidence item is the type-2-diabetes
       metagenome-wide association study, correctly and transparently graded
       `supports: NO_EVIDENCE` with an explanation saying so. The grading is
       honest, but the consequence is that a UC pathophysiology node carries
       zero supporting evidence while appearing to be evidenced.
       Severity: MINOR.
       ACTION: reported only (removing the item or sourcing a UC/IBD SCFA
       measurement is a curation decision, not a minimal fix).

    9. **pathophysiology#Loss of Microbial Diversity (line ~226),
       PMID:25307765** — the node claims decreased alpha diversity (Shannon,
       Chao1). The quote — "IBD has a consistent signature across studies and
       allows high classification accuracy of IBD from non-IBD subjects" —
       establishes a reproducible IBD microbiome signature, not a direction of
       diversity change. Graded PARTIAL, explanation honest about the weaker
       claim. Severity: MINOR (quote supports a neighbouring, weaker claim).
       ACTION: reported only.

    10. **pathophysiology#Increased Microbial Community Instability (line ~339),
        PMID:28836573** — the Anna Karenina paper is a Nature Microbiology
        perspective about *animal* microbiomes (corals, HIV lungs), and the item
        carries no `evidence_source`, so it reads as HUMAN_CLINICAL by default,
        which is wrong. Severity: MINOR.
        ACTION: reported only — the correct replacement is either OTHER
        (conceptual review) or MODEL_ORGANISM, and `scripts/check_snippet_grading.py`
        states explicitly that the review→HUMAN_CLINICAL/OTHER convention is an
        open maintainer decision, so I did not pick one.

    11. **treatments#5-Aminosalicylates (line ~1057), PMID:40701556** — the ACG
        guideline item quotes the guideline's own scope boilerplate ("These
        guidelines were developed to indicate the preferred approach to the
        management of adult patients with ulcerative colitis…"), which says
        nothing about 5-ASA; the substantive claim ("5-aminosalicylates are
        first-line therapy for mild-to-moderate disease") lives only in the
        explanation. `evidence_source: OTHER` is right for a guideline record.
        Severity: MINOR.
        ACTION: reported only — the cached record is abstract-only and contains
        no 5-ASA sentence, so no same-reference substitution exists. The
        adjacent PMID:21407188 meta-analysis item already carries the real
        efficacy evidence for this treatment.

    12. **treatments#Corticosteroids (line ~1071), PMID:31272578** — quote
        "Most cases are treated with pharmacological therapy to first induce
        remission and then to maintain a corticosteroid-free remission."
        supports the corticosteroid-free-maintenance goal but only indirectly
        the entry's claim that corticosteroids are used "for acute flares".
        Severity: NOTE. ACTION: reported only.

    13. **discussions#gap_uc_stroke_shared_genetic_architecture (line ~1290),
        PMID:42400809** — `evidence_source: IN_VITRO` on a quote that reports
        colocalization plus an in-silico prediction ("The rs7522794-T allele
        predicted to be more prone to bind SPI1…"). Judged by the quoted
        sentence, COMPUTATIONAL fits better; judged by the paper, which does
        include in vitro verification of the variant, IN_VITRO is not
        indefensible. Severity: MINOR. ACTION: reported only (genuinely
        ambiguous, so left for a maintainer).

    14. **biochemical#Plasma albumin (lines ~743, ~752), PMID:40973818** — the
        two Mendelian-randomization quotes are graded HUMAN_CLINICAL, while the
        file's other genetic-epidemiology sources (PMID:42443528 PGS×context,
        PMID:42400809 cross-trait GWAS/MR) are graded COMPUTATIONAL. Both are
        defensible readings of CLAUDE.md (epidemiology vs. in-silico analysis of
        clinical datasets), but the file is internally inconsistent about it.
        Severity: NOTE. ACTION: reported only.

    15. **biochemical#Fecal Calprotectin (line ~708), PMID:40943053** — the
        quote supports faecal calprotectin as a monitor of mucosal inflammation
        (the `context` field) but not the record's `presence: Elevated`.
        Severity: NOTE. ACTION: reported only.

    16. **phenotypes#Fatigue / #Weight Loss / #Anemia frequency bands** — only
        Weight Loss has a quantitative frequency quote (51% of UC subjects,
        supporting FREQUENT). Fatigue (FREQUENT) and Anemia (FREQUENT) carry
        association evidence but no frequency evidence, contrary to
        `docs/frequency-evidence-guidelines.md`. Severity: NOTE.
        ACTION: reported only.

    17. **`references:` block (lines ~1555-1575)** — three of the five entries
        duplicate references already cited by PMID elsewhere in the file
        (DOI:10.1038/s41590-024-01994-8 = PMID:39438660,
        DOI:10.1038/s41591-024-02895-x = PMID:38724705,
        DOI:10.3748/wjg.v30.i3.252 = PMID:38314135) and the remaining two
        (fucoidan review, "Novel Insights into the Pathogenesis of IBD") are
        never cited by any evidence item. All have empty `findings: []`.
        Severity: NOTE. ACTION: reported only.

    18. **Uncited node descriptions** — `pathophysiology#Dysregulated Immune
        Response` asserts a "Th2-skewed response with IL-13 driving epithelial
        dysfunction" and `pathophysiology#Impaired Colonocyte Energy Metabolism`
        asserts the butyrate/beta-oxidation switch; neither claim is carried by
        any cited quote in the file (the immune node's three items are about IFN
        signatures and IL-23 blockade). Severity: NOTE. ACTION: reported only.

    ## Sections reviewed
    classifications, pathophysiology, mechanistic_hypotheses, phenotypes,
    biochemical, genetic, environmental, treatments, discussions,
    experimental_models, computational_models, datasets, references

    ## Verdict
    Evidence quality is mixed and stratified by section: the genetic and
    environmental blocks are the strongest in the file — the GWAS items
    (IL23R, HNF4A, CDH1, IL10, PRDM1) quote genome-wide-significant result
    sentences and their explanations are unusually well hedged about
    region-versus-gene and CD-versus-UC, and the environmental items
    (appendicectomy RCT, smoking meta-analysis, NSAID relapse, infectious
    mononucleosis cohort, prospective stress cohort) all use honest PARTIAL
    grades where the source is narrower than the claim. The microbiome and
    single-cell pathophysiology block is the weak part: it leans on
    cross-disease sources (Crohn disease, checkpoint-inhibitor colitis, type 2
    diabetes, animal microbiomes) and on methods rather than result sentences,
    with several items whose `evidence_source` defaulted to HUMAN_CLINICAL over
    quotes describing cell lines and mouse colitis. Five defects were fixed in
    place; the one substantive unfixable defect is the cardinal Bloody Diarrhea
    phenotype being evidenced solely by a checkpoint-inhibitor-colitis paper
    when two correct, already-cached UC reviews are cited elsewhere in the same
    file.

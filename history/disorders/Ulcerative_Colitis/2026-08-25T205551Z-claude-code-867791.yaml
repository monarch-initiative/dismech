  summary: Add cuproptosis human/model mismatch discussion (#8397)
  details: |
    Answers monarch-initiative/dismech#8397 for the ulcerative colitis side. Adds discussion gap_uc_cuproptosis_evidence_hierarchy attached to pathophysiology#Intestinal Epithelial Cell Ferroptosis, pathophysiology#Epithelial Barrier Dysfunction and pathophysiology#Impaired Colonocyte Energy Metabolism, with one proposed experiment. Its kind is HUMAN_MODEL_MISMATCH rather than the KNOWLEDGE_GAP used on the four sibling entries, and that asymmetry is the substantive finding: UC is the only one of the five with a functional arm, and that arm is entirely rodent. Tetrathiomolybdate and penicillamine reverse DLAT oligomerization and restore FDX1/LIAS in DSS colitis (PMID:40969742), and copper chelation rescues colitis in Grx1-knockout mice (PMID:41985411), between them clearing copper dependence, lipoylated-protein aggregation, Fe-S destabilization and functional rescue in mice; human UC colon supplies only the descriptive half of the signature, and PMID:41985411 states outright that directly visualizing cuproptosis in vivo remains a future direction. Per CLAUDE.md that is evidence existing in a model with translational validity as the open question, which is HUMAN_MODEL_MISMATCH, not absent evidence. No cuproptosis pathophysiology node was added, for an entry-specific reason: Intestinal Epithelial Cell Ferroptosis is already curated as a metal-dependent regulated cell death converging on the same Epithelial Barrier Dysfunction node, so a cuproptosis node would have to be shown separable from it, and no study has run the two readout panels against each other in the same tissue. The proposed experiment is built around exactly that separation. The five-part canonical bar from PMID:42435071 is carried over verbatim in the decision_criterion. Validation: schema validation passes, term validation passes, 82/82 snippets verified against cached references, duplicate-key / folded-hyphen / snippet-length / title-snippet checks clean, and the entity-ref foreign-key test suite passes.

  summary: Link three experimental models into the pathograph, add KNOWLEDGE_GAP discussion
  details: |
    Added modeled_mechanisms links from all three experimental models to Epithelial Barrier Dysfunction: the ALI colonoid model (PMID:41589595, RECAPITULATES, HIGH), the cytokine-conditioned hiPSC organoid model (PMID:39435148, PARTIALLY_RECAPITULATES, MODERATE, also linked to Dysregulated Immune Response with a tofacitinib rescue readout), and the colon-on-chip model (PMID:31778828, MEASURES, LOW, a healthy-physiology PGE2-hydration readout that does not speak to UC-specific goblet-cell loss). Added a KNOWLEDGE_GAP discussion (uc_epithelial_barrier_intrinsic_vs_downstream) noting that the ALI colonoid model's defects persist ex vivo without an inflammatory stimulus, which is in tension with Epithelial Barrier Dysfunction being wired only as a downstream sink node with no outgoing edge. Updated projects/NAMO_RD_MODELS.md to move Ulcerative Colitis from 'Next Expansion Targets' into 'Disease Anchors' and replaced a retired PARTIAL evidence-support reference. All snippets reused already-cached PMIDs; no new references fetched. Validated with just validate, just check-entity-refs, just check-causal-targets, just check-enum-values.

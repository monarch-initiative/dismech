  details: |
    Weekly compliance pass. Added classifications.harrisons_chapter (GASTROINTESTINAL + IMMUNE_RHEUMATOLOGIC), matching the pairing already used on Crohn_Disease. Bound gene_term with an HGNC identifier on all 18 genetic records, which previously carried only a bare gene symbol. Added GWAS evidence for five of those loci: IL23R (PMID:17068223), HNF4A and CDH1 (PMID:19915572), IL10 (PMID:18836448) and PRDM1 (PMID:21297633). Explanations record locus-level limits where they exist: the 16q22 signal contains both CDH1 and CDH3, and PRDM1 is a candidate-gene annotation of an associated interval rather than a demonstrated causal gene. Backfilled reference_title on 4 evidence items. The remaining 13 GWAS loci are left unevidenced rather than attached to a source that does not name them. Weighted compliance 76.8 percent to 82.0 percent. Validated with just validate, just validate-terms and just count-verified-snippets (71/71 verified).

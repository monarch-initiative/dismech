  summary: Add eosinophil UDP-glucose/P2Y14 node to Ulcerative_Colitis (#7042)
  details: |
    Added one pathophysiology node, Eosinophil Accumulation and Activation via UDP-Glucose/P2Y14 Signaling, from PMID:38108401 (Int Immunol 2024). The node links to Mucosal Inflammation. Human evidence is limited to increased P2RY14 mRNA in UC mucosa; the eosinophil chain is shown in DSS-colitis mice and in cultured mouse eosinophils. No treatment or P2Y14 target node was added: the issue's question 3 is left open because no human P2Y14-inhibitor data were read here. Bound CL:0000771 and GO:0070372 from the local caches; P2RY14 was not bound because it is absent from cache/hgnc/terms.csv and was not looked up.

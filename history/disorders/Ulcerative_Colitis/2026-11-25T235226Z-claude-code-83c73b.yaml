  summary: 'Gene-family review: HNF4A'
  details: |
    The HNF4A record (20q13 locus, genome-wide significant in the WTCCC2 ulcerative colitis GWAS, PMID:19915572) was untyped; it is now typed SUSCEPTIBILITY with germline origin. The Epithelial Barrier Dysfunction node it lands on still names no molecular function for HNF4A (a transcription factor) or CDH1; binding HNF4A's activity there needs evidence that the risk allele changes HNF4A activity in colonic epithelium, which was not established in this pass.

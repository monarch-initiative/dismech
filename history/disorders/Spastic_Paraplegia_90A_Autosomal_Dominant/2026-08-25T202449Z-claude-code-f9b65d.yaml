  details: |
    Round-3 response to the automated review of PR #9488. One blocking factual error plus all
    four non-blocking suggestions.

    BLOCKING - recurrent-allele arithmetic in `description`. The sentence read "the recurrent
    p.Thr51Ile allele has now been reported in a third of the very small published cohort",
    which is simply wrong: PMID:40533086 states that only three patients had been reported and
    that p.Thr51Ile "was detected in two of the reported patients", and that report adds a
    fourth patient who also carries it. So the allele accounts for THREE OF FOUR published
    SPG90 patients, not a third of them. The reviewer was right, it had been raised before, and
    the previous round did not touch it. Corrected in the description, which now also states
    the more useful consequence: p.Thr51Ile is the only SPTSSA allele reported more than once.

    Where this response DIFFERS from the review, deliberately. The reviewer went further and
    argued that within the dominant pole the figure is three of three, because the remaining
    founding patient is the biallelic SPG90B case. That is plausible - OMIM does maintain
    620416 and 620417 as separate entries - but it is NOT verifiable from the cached abstracts.
    PMID:40533086 says SPG90 is caused by "monoallelic or biallelic variants" without assigning
    patients, and PMID:36718090's abstract reports "two different pathogenic variants ... in
    three individuals" without stating zygosity per patient. Curating "three of three SPG90A
    patients" would therefore import an inference the sources do not support, in an entry whose
    whole point is not doing that. The entry now states the four-patient denominator, which is
    fully supported, and says explicitly in two places that the pole assignment of the remaining
    founding patient cannot be resolved from the cached abstracts. This is recorded here so the
    divergence is auditable rather than looking like the suggestion was missed.

    Suggestion 1 (denominator phrasing) - taken, in both the genetic_context.description and
    the genetic[].notes, with the caveat above.

    Suggestion 2 (Genetic.variants[]) - taken. p.Thr51Ile now has its own `variants[]` block
    with `clinical_significance: PATHOGENIC`, its own evidence item, and a description noting
    that it is the allele that makes allele-specific approaches conceivable in this disease at
    all - which is what ties it to the small-subunit knockdown treatment added last round.

    Suggestion 3 (fly readout placement) - taken, and the reviewer's diagnosis was right: motor
    performance is not a readout OF the lipid node. The `Motor performance and lifespan` readout
    was moved onto a NEW second `modeled_mechanisms` link from the Drosophila model to
    `Distal Degeneration of Long Corticospinal Axons`, typed PARTIALLY_RECAPITULATES /
    fidelity LOW, with limitations stating that a fly has no corticospinal tract, no upper
    motor neurons and no myelin, so a fly motor deficit cannot evidence a length-dependent
    CENTRAL axonopathy specifically - it evidences that excess sphingolipid synthesis is
    neurologically damaging in a whole animal. The link evidence is marked PARTIAL for the
    same reason.

    Suggestion 4 (unverified-leads note) - taken and extended. The note now names normal
    NCS/EMG in all three founding patients (flagged as the single most valuable item to promote
    if the full text becomes quotable, because it is the electrophysiological anchor for the
    pure-upper-motor-neuron localisation this entry infers and is what separates SPG90A from
    SPTLC1 juvenile ALS) and the MRI/MRS findings of decreased N-acetylaspartate and increased
    lactate (the only in vivo human evidence of a bioenergetic component, which would justify a
    biochemical node). It also records that reviews listing seizures for this disorder may be
    pooling in the SPG90B patient.


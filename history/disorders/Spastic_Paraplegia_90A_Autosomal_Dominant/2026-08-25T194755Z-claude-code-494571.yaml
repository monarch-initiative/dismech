  details: |
    Addressed all three blocking items from the automated review of PR #9488, plus both
    non-blocking suggestions and the unverified-leads point.

    1. L-SERINE CONTRAINDICATION (blocking). Added a `treatments[]` entry "Avoidance of
       L-Serine Supplementation" with `action_category: COUNSELING_INFORMATIONAL`. This is a
       genuine hazard, not a completeness gap: L-serine is an established supplement strategy
       in HSAN1, caused by variants in the SAME serine palmitoyltransferase complex, where the
       lesion is substrate promiscuity and flooding the enzyme with its correct substrate
       outcompetes the deoxysphingolipid side reaction. SPG90A is the opposite lesion - the
       enzyme is unrestrained, not promiscuous - so more substrate would be predicted to drive
       the overproduction that causes the disease. Cited with the reviewer-supplied verbatim
       quote from the already-committed full-text cache of PMID:38788085; the authors' hedge
       ("would be predicted") is quoted intact and repeated in the notes, because no SPG90A
       patient has been given L-serine and reported.

       DELIBERATE DEVIATION: this treatment carries NO `target_mechanisms` link, and the entry
       says why in its `notes`. The curated action is WITHHOLDING an intervention, which
       neither inhibits nor activates a node; either edge would encode a clinical caution as a
       causal assertion and would export to KGX as a mechanistic claim that nobody made. The
       mechanistic content lives in the description and the quoted evidence instead.

    2. RATIONAL THERAPEUTIC AXIS (blocking). Added two entries, both explicitly not clinically
       available: "Partial Serine Palmitoyltransferase Inhibition (investigational)"
       (SMALL_MOLECULE, myriocin as the tool compound, CHEBI:582124) and "SPT Small-Subunit
       Knockdown (preclinical concept)". Both link by `target_mechanisms` INHIBITS to
       "Unrestrained De Novo Sphingolipid Synthesis". The toxicity caveat is carried inside the
       quoted evidence rather than appended to it, per the reviewer's request - complete SPT
       inhibition is systemically toxic, so only partial inhibition is rational. The knockdown
       entry uses `therapeutic_modality: OTHER` and no `aso_details`, because the source argues
       a theoretical advantage and reports no construct, modality, delivery route or efficacy
       result; its edge evidence is marked PARTIAL for that reason.

    3. STRUCTURED GENETIC CONTEXT (blocking). Added a `genetic_context` block to the
       pathophysiology trigger node "SPTSSA Activating Missense Variant" - the placement the
       reviewer corrected to, since `genetic_context` is a slot on Pathophysiology and not on
       Genetic. Carries gene SPTSSA, `allele_type: missense`, `zygosity: HETEROZYGOUS`, and
       `functional_impact_category: GAIN_OF_FUNCTION`, all supported by the already-verified
       PMID:40533086 snippet plus the review's characterisation of the SPTSSA variants as
       activating. The block's `description` states explicitly that this is a claim about the
       VARIANT's consequence and is a different assertion from the pathway-activity `modifier`
       values on the downstream ORMDL node.

       `variant_origin` is deliberately left UNSET, and the block's `notes` record why: deep
       research described SPG90A as "de novo-dominant", but the string "de novo" appears in
       none of PMID:40533086, PMID:36718090 or PMID:38788085. That is an unsupported inference
       in the report and was not imported.

    Non-blocking, both taken:
    - Baclofen now joins the pathograph via `target_mechanisms` INHIBITS on "Loss of
      Supraspinal Inhibitory Control of the Stretch Reflex". Its edge evidence is marked
      PARTIAL because the quoted review characterises the reflex-mediated component of
      hypertonia rather than naming baclofen or reporting a trial, and no antispastic trial
      specific to SPG90A exists.
    - "Supportive and symptomatic care" now carries `therapeutic_modality: OTHER` and
      `action_category: THERAPEUTIC`.

    Unverified leads recorded rather than curated: a paragraph was added to `notes` naming the
    findings deep research attributes to the founding paper's FULL TEXT - nevus flammeus and
    short stature in two of three patients, raised serum sphingolipids in all three, and
    rolandic epileptiform EEG activity - and stating that the cached record for PMID:36718090
    is abstract-only and contains none of those sentences, so they are leads for someone with
    full-text access rather than curated phenotypes. The note flags that epileptiform EEG
    activity and clinical seizures are different claims.


  summary: 'Create: Spastic Paraplegia 90A, Autosomal Dominant (SPTSSA, MONDO:0957308)'
  details: |
    Created kb/disorders/Spastic_Paraplegia_90A_Autosomal_Dominant.yaml for MONDO:0957308
    (OMIM #620416, SPTSSA / hgnc:20361).

    Entry-type decision: DISEASE. The MONDO record is a leaf (no descendants recorded) and
    carries a single causal-gene relationship RO:0004003 -> HGNC:20361 SPTSSA, so it is an
    identity-anchored disorder rather than a grouping or a subtype of an existing entry.
    Scoped deliberately to the MONDO/OMIM autosomal DOMINANT pole (#620416); the biallelic
    pole SPG90B (#620417) remains a separate stub and is not folded in.

    Deep research: NAMED ENTITY CONFUSION. `just research-disorder falcon` returned a report
    that was entirely about SPTAN1 (spectrin alpha, non-erythrocytic 1; OMIM 182810), not
    SPTSSA. `just preflight-dr <report> MONDO:0957308` returned FAIL - "Expected gene SPTSSA
    is never mentioned, but SPTAN1 is mentioned 49 times" (SPTSSA=0, SPTAN1=49; report OMIM
    182810 vs MONDO xref 620416). The report's own reference-validation pass had already
    flagged needs_review with an off-topic ankyrin/spectrin citation. Per the SOP the report
    was DISCARDED IN FULL and not cherry-picked, and it is not committed - a wrong-entity
    report in research/ would mislead the next curator and would falsely register provider
    coverage for this disease. A `claude_code` provider report was run in its place and IS committed: it returned 23
    references with 0 confabulations and preflight-dr gave WARN, whose only rival gene is
    SPTLC1 (48 SPTSSA mentions vs 20 SPTLC1) - the deliberately discussed sibling disorder,
    with report OMIM 620416/620417 matching the MONDO xref. Six full-text quotes in that
    report could not be verified against the cached abstract of PMID:36718090 and were
    therefore NOT curated. The DOI_*.md files written by the report's validation pass are
    content-free stubs and were deliberately left uncommitted. This
    entry was built independently from primary literature anchored on the SPTSSA gene and the
    OMIM #620416 xref.

    Pathograph (6 nodes, single connected component, all reachable from the trigger):
    SPTSSA activating missense variant (MOLECULAR, trigger) -> impaired ORMDL-mediated
    feedback inhibition of serine palmitoyltransferase (MOLECULAR, central_effector) ->
    unrestrained de novo sphingolipid synthesis (MOLECULAR, amplifier) -> branches to
    (a) distal degeneration of long corticospinal axons (TISSUE) -> loss of supraspinal
    inhibitory control of the stretch reflex (TISSUE) -> spasticity phenotypes, and
    (b) broader CNS neurodevelopmental and neurodegenerative involvement (ORGANISM) ->
    developmental delay, sensorineural hearing loss, progressive cognitive decline, dystonia,
    axial hypotonia, neurogenic bladder.

    Module conformance: three nodes declare conforms_to against
    kb/modules/corticospinal_tract_axonopathy.yaml (#Long-Axon Maintenance Machinery Defect,
    #Distal Length-Dependent Degeneration of Long CNS Axons, #Loss of Supraspinal Inhibitory
    Control of the Stretch Reflex). The module's own amplifier node (impaired axonal transport)
    is deliberately NOT claimed - no transport measurement exists in this disorder.

    Curated: 6 pathophysiology nodes, 9 phenotypes, 1 inheritance block, 1 genetic block,
    1 prevalence record, 2 animal models with modeled_mechanisms and readouts, 3 treatments,
    2 discussions, 53 evidence snippets over 8 references.

    Honesty caveats recorded in the entry rather than smoothed over:
    - No human neuropathology or neurophysiology exists for SPG90A. The corticospinal
      localisation is inferred from the clinical pattern of selective upper-motor-neuron signs
      plus class-level HSP knowledge, and the node says so.
    - The edge from sphingolipid excess to axonal degeneration is typed
      INDIRECT_UNKNOWN_INTERMEDIATES and its evidence is Drosophila and (for SPTSSB) mouse.
    - A HUMAN_MODEL_MISMATCH discussion records that no murine model of an SPT-related ALS or
      HSP variant exists, and that the Stellar mouse differs in gene, mechanism and phenotype.
    - A KNOWLEDGE_GAP discussion records that why the same loss-of-ORMDL-restraint lesion gives
      cHSP in SPTSSA but juvenile ALS in SPTLC1/SPTLC2 is unresolved.
    - `frequency:` is omitted from every phenotype. Four SPG90 patients have been published in
      total across both poles; no band is derivable, and prevalence is recorded as
      CASES_IN_LITERATURE / ULTRA_RARE.
    - Single-patient genitourinary findings are curated as one PARTIAL-supported phenotype
      (neurogenic bladder) with the authors' own "we propose" hedge preserved; the co-reported
      dRTA, nephrolithiasis, UTI and polydipsia are named in that phenotype's description
      rather than curated as separate phenotypes.
    - No `datasets:` block: no disease-specific omics accession was found.
    - No ORPHA evidence asserted. `just refresh-orphadata` is currently failing on a manifest
      checksum mismatch and no cached ORPHA record for this concept was available.


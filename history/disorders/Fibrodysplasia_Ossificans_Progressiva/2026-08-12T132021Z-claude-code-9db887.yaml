  summary: Link trauma and infection to the flare node with human evidence
  details: |
    Backfill for issue #8085. Trauma is TRIGGERS with DIRECT into the inflammatory flare node, which is the defining relationship of this disease and the reason trauma avoidance is its central management strategy. A human reference, PMID:41970064, was fetched for it because the only evidence attached to the exposure was a mouse drug study that supports the trigger sideways, through the phrase injury-induced models; that item is retained on the link at PARTIAL and is now tagged MODEL_ORGANISM, which it previously was not, having defaulted to HUMAN_CLINICAL. The viral illness exposure previously carried an item its own curator had marked NO_EVIDENCE, with the explanation that the snippet does not mention viral illness. That item was left where it is and a sentence that does bear on the claim is cited on the link instead, recording recurrent trauma- and infection-triggered flare-ups in one genetically confirmed patient. It is graded PARTIAL with unknown intermediates for two reasons stated in the link description: it reports infection rather than viral infection specifically, and it is a single patient's history. The evidence_source repair was initially applied only to the copy of the mouse study on the new link, leaving the exposure-level copies untagged and therefore defaulting to HUMAN_CLINICAL, so the same mouse snippet sat in the file tagged two different ways a few lines apart. Every item citing that study is now MODEL_ORGANISM. Validated with linkml-validate and just validate-terms.

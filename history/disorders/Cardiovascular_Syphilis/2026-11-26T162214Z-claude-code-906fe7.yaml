  summary: 'Create: Cardiovascular_Syphilis'
  details: |
    New entry for cardiovascular syphilis (MONDO:0004911), the cardiovascular form of tertiary syphilis. Syphilitic aortitis (MONDO:0006992) is recorded as the dominant subtype rather than a separate entry, because the cited sources treat aortitis as the lesion from which aneurysm, aortic regurgitation and coronary ostial stenosis follow, and MONDO's own definition of MONDO:0006992 describes the cardiovascular manifestations as a whole. A second, rare subtype covers syphilitic myocarditis and endocarditis (PMID:39832511, PMID:17469346). Both stubs (Cardiovascular_Syphilis, Syphilitic_Aortitis) were deleted. Syphilis.yaml was not edited: it lists tertiary syphilis as a stage, not a has_subtypes row, so there is no subtype to carry a curated_in pointer. Deep research: research/Cardiovascular_Syphilis-deep-research-claude_code.md (claude_code provider), used as leads only; just preflight-dr returned SKIP because MONDO records no causal gene. Every snippet was checked against the cached reference (count-verified-snippets 128/128) and term validation passed. The pathograph runs from persistent infection through adventitial invasion, lymphoplasmacytic periaortitis, obliterative endarteritis of the vasa vasorum, medial necrosis and intimal fibrosis to aneurysm, aortic regurgitation, ostial stenosis, rupture and dissection; all 18 phenotypes are causally connected. Main sources: the 90-patient necropsy series PMID:19932796, the review of 66 reported cases PMID:27982548, the aneurysm review PMID:30073493, the autopsy series PMID:21045381, surgical pathology PMID:31951962, and the CDC 2021 guideline PMID:34292926 for treatment, CSF and HIV testing, and the Jarisch-Herxheimer reaction.

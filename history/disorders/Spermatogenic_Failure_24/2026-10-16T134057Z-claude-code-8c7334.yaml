  summary: 'Create: Spermatogenic Failure 24 (CFAP69)'
  details: |
    New entry for spermatogenic failure 24 (MONDO:0054728), CFAP69-related MMAF. Deep research with the claude_code provider (research/Spermatogenic_Failure_24-deep-research-claude_code.md); just preflight-dr returned PASS for CFAP69. The report was used for leads only; every snippet was taken from references_cache after just fetch-reference. Chain: loss of CFAP69 (structural molecule activity, decreased; midpiece) -> failed flagellum assembly in spermatids -> axonemal disorganization with central pair loss -> MMAF -> male infertility and flagellar phenotypes. GO has no informative MF annotation for CFAP69; structural molecule activity was chosen on the basis of the predicted Armadillo repeats and the Chlamydomonas FAP69 C1b association (background quote, INDIRECT). Oligozoospermia is recorded with SUPPORT and REFUTE items because counts were low in two of five probands. ClinGen has no CFAP69 curation (checked data/clingen/gene_validity.csv) and no GeneReviews chapter exists (just check-genereviews). Mouse olfactory phenotype recorded as a knowledge gap rather than a patient phenotype. Stub stubs/Spermatogenic_Failure_24.yaml deleted. Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, the snippet/title gates, gene-activity grounding and validate-disorders.

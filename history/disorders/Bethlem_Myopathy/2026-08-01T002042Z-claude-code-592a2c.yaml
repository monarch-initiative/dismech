  summary: 'Create: Bethlem_Myopathy'
  details: |
    Created kb/disorders/Bethlem_Myopathy.yaml as a greenfield entry for MONDO:0008029, the mild end of the collagen VI-related dystrophy spectrum COL6A1/COL6A2/COL6A3, curated to be mechanistically consistent with the existing Ullrich_Congenital_Muscular_Dystrophy entry. A Named Entity Confusion preflight against the MONDO record - causal genes COL6A1/2/3, OMIMPS:158810, Orphanet:610, synonyms BTHLM1 and benign autosomal dominant myopathy - confirmed identity before any deep-research content was used. Deep research was run with falcon, the Edison Scientific provider, via just research-disorder falcon Bethlem_Myopathy, taking 608 seconds and returning 29 citations plus one artifact; the report converged on the same disease identity with no drift into Ullrich CMD or limb-girdle dystrophy, and was treated strictly as leads rather than ground truth. The GeneReviews chapter Collagen VI-Related Dystrophies, PMID:20301676, was fetched and tagged as the phenotype baseline, and every Clinical Characteristics item in its abstract is represented in the entry. Content: an 11-node single-connected-component pathograph running from COL6 alpha-chain gene defects through defective microfibril assembly and secretion, endomysial network deficiency, impaired matrix-to-sarcolemma anchoring, mitochondrial permeability transition pore dysregulation, defective autophagy, and myofibre apoptosis to degeneration and fibrosis, with parallel tendon and dermal connective-tissue arms and a restrictive respiratory arm; 24 phenotypes; three gene-defined MONDO subtypes; both inheritance modes; prevalence; three progression phases; biochemical, histopathology, and diagnosis sections; seven treatments including cyclosporin A and autophagy reactivation wired via target_mechanisms; one clinical trial NCT01438788; and two discussions, one HUMAN_MODEL_MISMATCH on Col6a1-null mouse fidelity to dominant-negative human disease and one KNOWLEDGE_GAP on the unidentified collagen VI basement-membrane binding partner. Module conformance was declared to disabled_macroautophagy#Failure of Cytoplasmic Quality Control; the aging-framed mitochondrial_dysfunction and fibrotic_response modules were considered and deliberately not declared. Validation: just validate passed covering schema plus ontology term validation, just validate-references verified 122 of 122 snippets as exact substrings of cached references, scripts/check_folded_hyphens.py reported no new folded-scalar hyphen splits, just validate-graphs was clean for this file, and pathograph connectivity was confirmed programmatically with 11 of 11 nodes in one component, no dangling targets, and no orphan phenotypes. Not verified: no ORPHA:610 structured cache record could be generated because just refresh-orphadata fails a checksum against the pinned data/orphadata/MANIFEST.yaml, so no ORPHA-sourced evidence is asserted; this limitation is recorded in the entry notes.

  summary: Review Bethlem clinical spectrum, collagen VI mechanisms, care and experimental
    evidence
  details: |
    Substantive review of the existing Bethlem myopathy entry. Three prior CREATE/EDIT histories contained no REVIEW, and a fresh open-PR file census found no overlap. The entry remains COL6A1/COL6A2/COL6A3 Bethlem disease, with COL12A1-related myopathy and the more severe allelic COL6 presentations distinguished.

    Completeness assessment:
    1. Phenotypes: 34 records cover proximal and axial weakness, gait, distal and larger-joint contractures, early skeletal findings, skin and respiratory manifestations. Removed unsupported aggregate frequencies and kyphosis without suitable evidence. Hip dislocation and clubfoot each occurred in four of 33 Bethlem patients in the 2023 cohort. Respiratory impairment can require ventilation during retained walking. Distinguish wheelchair assistance from complete loss of ambulation, and variable onset from universally congenital disease. CK can be markedly elevated but is not a reliable severity measure.
    2. Subtypes: retained the three ontology-bound gene subtypes and their gene links. Recessive Bethlem disease is not synonymous with myosclerosis; severe Ullrich and intermediate disease remain contextual comparisons rather than pooled denominators.
    3. Mechanisms and tissue: 15 atomic nodes distinguish intracellular assembly, secretion, extracellular network dysfunction, proposed anchoring, mitochondrial permeability, autophagy, apoptosis, degeneration, fibrosis, tendon, skin and respiratory consequences. Corrected the direction linking autophagy failure to damaged-organelle persistence. Added a bounded 2025 mouse TGF-beta bioavailability mechanism: protein association is not proven direct binding, and early weakness precedes fibrosis. Three experimental and four animal models include negative findings: skin knockout does not reproduce keloids, severe-fish drug results do not establish rescue in the mild Bethlem-like fish, and the Ltbp4 cross failed to rescue Col6a2-null disease.
    4. Care and trials: nine treatment records include multidisciplinary care, orthopedic avoidance/casting guidance, respiratory monitoring and ventilation, counseling, pregnancy support and moderate exercise. The diet pilot enrolled eight but analyzed seven patients (six Bethlem); only four-stair performance significantly improved, and weight/lean-mass loss limits interpretation. Static autophagy proteins do not demonstrate human flux. Cyclosporin A biopsy improvement in five mixed COL6 patients is not established functional efficacy. Exercise publication had six participants, versus seven in the registry. Six registry records were verified live on 2026-10-01; two UNKNOWN records retain historical recruiting status only in context. Broad CMD registry enrollment is not a Bethlem patient count.
    5. Genetics: primary COL6A1 exon-14 assembly/secretion experiments replace universal tetramer-poisoning assumptions. Exon-14 skipping does not guarantee a benign adult course. Ordinary heterozygous null alleles can be tolerated. Primary recessive COL6A2 functional and segregation findings are represented, while the 2025 two-variant proband assay is not presented as independent proof for each initially uncertain allele. Rare or uncertain COL6 variants in the 2023 biopsy series are not automatically pathogenic.
    6. Diagnostics and biomarkers: four diagnostic records, three compartment-specific biochemical readouts, nonspecific muscle histology and four differentials. Normal collagen VI/perlecan muscle staining in 13 of 15 dominant Bethlem biopsies directly contradicts universal mislocalization; muscle staining is separated from cultured-fibroblast secretion assays. Historical 62% coding-sequence yield is not current testing sensitivity. GeneReviews clinical, diagnostic, management and counseling domains are all supported with exact quotations, including recurrence risks and reproductive testing.
    7. References: used the existing research report and source inventory as leads, verified against primary sources. Read complete scientific text and relevant tables/captions for PMID21691338, 37569848, 36982625, 27656840, 25158062, 24339618, 40550965, 20338942 and the published 2025 JCI study PMID40309777. Read the full GeneReviews clinical chapter including differential tables and figure captions through its generated NCBI reader cache. PMID21078917 was consulted in targeted rehabilitation, orthopedic and cardiac sections rather than claimed as wholly consumed. Read all cited abstract-only primary sources, including discovery, allele function, longitudinal progression, exercise, mitochondrial/autophagy and cyclosporin studies. Alternate full-text attempts for several older mechanistic/therapy papers were unavailable; PMID15689448 apparent full HTML was an abstract/PDF notice, not consumed full text. The 2023 TGF-beta preprint was superseded by the published paper. New evidence titles match the generated caches, and human, experimental, animal and review/background evidence are distinguished.
    8. Overall: central source-backed clinical, genetic, diagnostic and experimental omissions are addressed. Unresolved matrix-to-myofibre intermediates remain explicit. Model results and small uncontrolled trials are not generalized into proven human mechanisms or routine disease-modifying treatment. Provider-report suggestions without credible source support are not promoted to facts.

    Validation: schema, ontology and references passed with 217 verified snippets, no skipped/unavailable snippets and 247 titles. Entity/causal links, coarse phenotypes, gene grounding, GeneReviews, source-defect claims, snippet boundaries/length/grading/title hygiene and reference-title checks passed; the renamed wound node also resolves in the pathograph class index. Reference caches were regenerated only through just fetch-reference. The new shoulder-contracture binding has generated term/enum cache rows.

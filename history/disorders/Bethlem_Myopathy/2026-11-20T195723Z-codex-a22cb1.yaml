  summary: Map Bethlem myopathy to OMIMPS:158810
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS158810 contains COL6A1-, COL6A2-, and COL6A3-related Bethlem myopathy 1A, 1B, and 1C plus COL12A1-related Bethlem myopathy 2 (OMIM:616471) in the January 2026 snapshot. MONDO:0008029 similarly has all four children. This Disease is explicitly restricted to the collagen VI-related Bethlem spectrum and lists COL12A1 disease as a differential diagnosis; the latter is curated separately as Myopathic Ehlers-Danlos Syndrome. The series is therefore a broader target than this entry, despite the matching umbrella label. Shared myopathy, contractures, and matrix pathology explain the historical grouping, but type VI and type XII collagen disease are not made molecularly interchangeable.

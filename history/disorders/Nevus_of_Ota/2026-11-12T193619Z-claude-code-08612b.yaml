  details: |
    Removed AI process narration ('Falcon research emphasized / highlighted / identified / found') across description, pathophysiology explanations, genetic notes, and top-level notes. Added MONDO/Orphanet/StatPearls synonyms, mondo_mappings exactMatch, Harrison's DERMATOLOGY and GENETICS_ENVIRONMENT_DISEASE classifications, and Orphanet ORPHA:263425 worldwide prevalence record. Resolved gene_activity_grounding defect on Mosaic GNAQ-GNA11 Melanocyte Signaling by binding GO:0003924 (GTPase activity, DECREASED) and genetic_context (SOMATIC, GAIN_OF_FUNCTION), added biological_scale and UBERON locations across all 5 pathophysiology nodes while preserving Dermal and Ocular Melanocyte Accumulation, added direct nevus of Ota somatic GNAQ biopsy evidence (PMID:19078957), harmonized review evidence grading (OTHER + REVIEW_SYNTHESIS) on PMID:35851619 and StatPearls PMID:32809409 (tagged in references), bound NCIT diagnostic terms (NCIT:C38060 Eye Examination, NCIT:C20828 Optical Coherence Tomography), and added DEVICE modality and target_mechanisms to laser therapy.

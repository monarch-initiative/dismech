  details: |
    Added an inheritance block bound to HP:0001442 (evidence: the PMID:26778290 tissue-versus-blood sentence already cited in the genetic section). Both GNAQ and GNA11 rows already carried variant_origin SOMATIC.Part of the somatic-mosaicism normalization tranche. Convention applied across the tranche: a disorder whose causal variant is post-zygotic (or which has a recognized post-zygotic arm) carries an inheritance block bound to HP:0001442 (Typified by somatic mosaicism) with its own snippet-backed evidence, plus variant_origin SOMATIC on the causal gene. Every evidence snippet reused here was already present and verified elsewhere in the same entry, or is an exact substring of an already-cached reference; no reference cache file was created or edited. Validation: just validate, just count-verified-snippets, just validate-terms, check-snippet-grading, check-enum-values, check-duplicate-keys, check-entity-refs and check-causal-targets all pass on the edited file. The entry was added as a member of the new kb/groupings/Somatic_Mosaic_Disorders.yaml grouping.

    Review round 1 (PR #13455). The reviewer found that the inheritance block claimed GNAQ/GNA11 variants are absent from blood in nevus of Ota while its only citation, PMID:26778290, concerns phakomatosis pigmentovascularis and extensive dermal melanocytosis and never names nevus of Ota. Correct: no cached source reports a paired lesion-versus-blood comparison for nevus of Ota. The description was rewritten to state the post-zygotic origin as a somatic GNAQ variant in a migrating melanoblast precursor whose timing sets the segmental extent, and to say explicitly that the blood-negative result is documented only for the related melanocytoses. Added PMID:21083380 (Van Raamsdonk 2010, the sentence naming nevus of Ota as a segmental lesion from a mutation in a precursor early during migration) and two sentences from PMID:19078957 (Van Raamsdonk 2009: the multi-structure distribution implying an early migrating melanoblast origin, and the mutation-specific assay recovering the variant in 1 of 14 cases). Both references were already cached from other entries; no cache file was created. The PMID:26778290 item is kept, graded directness INDIRECT, with its explanation saying it concerns the related conditions.

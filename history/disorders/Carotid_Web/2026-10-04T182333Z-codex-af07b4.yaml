  summary: Refine carotid web treatment targets and annotations after review
  details: |
    Addressed the independent review's optional treatment and phenotype suggestions. Added a RECURRENT qualifier, verified NCIT:C173064 Vitamin K Antagonist against OAK for the already quoted cohort use, and documented the exact negative NCIT TCAR query. Retained SURGERY for mechanical thrombectomy because the schema includes procedural interventions, and DEVICE for implanted stents; annotated unspecified IV thrombolysis as OTHER rather than assuming a small-molecule drug.

    The review's suggested PMID:40494576 did not contain the asserted pouch-exclusion passage. Retrieved PMID:32042485, whose canonical cache had no content, then generated and read its complete public PMC6927439 case report. The figure documents absent retrograde flow after stenting and the discussion describes pouch obliteration. Added a direct stenting-to-flow target and an explicitly indirect TCAR extrapolation, instead of asserting that the case demonstrates prevention of embolization. No comparative clinical efficacy is inferred from the single case.

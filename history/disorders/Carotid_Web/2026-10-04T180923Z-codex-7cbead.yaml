  summary: Review carotid web mechanisms, pathology, recurrence and treatment evidence
  details: |
    Reviewed the existing Carotid_Web entry and its Falcon deep-research report against cached literature, with live PubMed/Europe PMC and ClinicalTrials.gov checks through 2026-10-04. The disorder has only prior EDIT history and is a structural vascular arteriopathy within the requested noninfectious/non-environmental scope. Fresh open-PR file and title-issue checks found no competing curation. GeneReviews baseline check returned NO_CHAPTER.

    Read the scientific narrative, methods and limitations of the cached full-text CFD study (DOI:10.1038/s41598-024-60666-7), Choi CTA/pathology series (PMID:26228877), early recurrence cohort (PMID:39215397), long-term Afro-Caribbean cohort (PMID:34102760), multicenter revascularization cohort (PMID:40776764), and the 2025 review (PMID:40494576). Read the pathological findings and discussion of PMID:40873957 and targeted ultrasound-study sections (DOI:10.1186/s13244-024-01650-7). Retrieved the public full text for PMID:33970205 as the PMC8111564 URL cache and read its methods, results and limitations; the canonical PMID cache only contained the abstract. Added current 2026 pathological and TCAR series from their retrievable abstracts (PMID:41885481 and PMID:42710700). Attempts to retrieve the latter publisher full text/PDF returned 403. Protocol summaries and raw registry API caches preserve the trial-design and status evidence.

    Separated the intimal shelf, disturbed flow/stasis, local mural thrombosis, and downstream embolization into atomic nodes. Removed the unsupported platelet-activation assertion from the CFD node and the requirement for stroke or thrombus to diagnose the structural lesion. Histology now distinguishes the non-atheromatous web from possible coexisting atheroma. Retained the main ischemic phenotypes and added supported focal deficits and rare retinal arterial occlusion. Recurrence claims distinguish early thrombectomy-cohort events, the stroke-only MR CLEAN outcome, and the stroke/TIA composite in the Afro-Caribbean cohort. Cohort selection, small event counts, competing atrial fibrillation and nonrandom treatment allocation constrain the interpretation.

    Separated antithrombotic therapy, endarterectomy, stenting, TCAR, acute thrombectomy and intravenous thrombolysis. Observational low recurrence does not establish zero risk, procedure equivalence or randomized efficacy. The multicenter cohort abstract calls its recurrent event asymptomatic whereas the body calls it symptomatic; the description reports one recurrent stroke without assuming severity. Incidental webs are explicitly separated from symptomatic secondary prevention. Diagnostic coverage includes multiplanar CTA, dynamic contrast stasis, sonography, silent infarcts and dissection/plaque/thrombus differential; concordant imaging is identified as a review proposal. Family/genetic screening and youth prevalence are study aims, not results. Current UNKNOWN statuses replace outdated recruitment assumptions for CAROWEB, the Spanish registry and the Doppler study.

    OAK verified MONDO, HP, CL, UBERON, GO, CHEBI and NCIT bindings, including central retinal artery occlusion and stroke thrombectomy. The latest bioprinting perspective PMID:42826182 was inspected as a proposal, not treated as a new experimental validation or a source of established hormonal causation. No causal genes, molecular pathways or omics dataset accessions were invented from speculative leads; the CFD dataset is available on request. The broad ANTIQUE atherosclerosis registry was not presented as a web-specific therapeutic trial.

    Schema, ontology terms and reference validation passed with 65/65 snippets verified, 84 titles checked and none skipped. Causal-target, snippet-boundary, coarse-phenotype, gene-grounding and node-class checks passed. Final repository gates and pre-commit are recorded in the PR validation report.

  summary: 'Review round 2: HLA genetics + extracutaneous phenotypes'
  details: |
    Round 2 of ai4c-reviewer review on PR #19105 (re-review of commit ca6e3ca approved all four round-1 blocking fixes and raised two new blocking gaps). Added a genetic section: HLA-DRB1 (hgnc:4948) and HLA-B (hgnc:4932), both relationship_type SUSCEPTIBILITY, citing the DRB1*04:04 / HLA-B*37 associations and their distinctness from systemic sclerosis (PMID:36860340). Added four extracutaneous phenotypes on the Linear scleroderma subtype: Arthritis (HP:0001369), Myositis (HP:0100614), Uveitis (HP:0000554) and Headache (HP:0002315). Took the biologic suggestions: Tofacitinib (CHEBI:71200, JAK1/3 inhibitor linked to the IFN/JAK-STAT signature) and Abatacept (NCIT:C28898, CTLA4-Ig), both case-series directness INDIRECT, targeting the T-cell infiltration node. Recorded in entry notes that the en coup de sabre CNS phenotypes (seizure, headache) are left causally unwired because the skin-to-CNS mechanism is unresolved, and that lichen sclerosus co-occurs in ~6% of patients. 49/49 snippets verified; terms, gene-namespaces, entity-refs, causal-targets, name-collisions, coarse-phenotypes, snippet-grading, logical-rules and validate-disorders all pass.

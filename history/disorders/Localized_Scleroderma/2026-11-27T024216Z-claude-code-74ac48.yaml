  summary: 'Create: Localized Scleroderma (morphea)'
  details: |
    De-novo curation of localized scleroderma (MONDO:0019562) as a single Disease with plaque/generalized/deep/linear has_subtypes (linear bound to MONDO:0043294). Fibrotic pathograph (CD4+ T-cell dermal infiltration -> TGF-beta/IL-4 fibroblast activation -> excessive collagen/ECM deposition -> dermal/subcutaneous sclerosis with adnexal atrophy) conforms to fibrotic_response. 11 phenotypes, 4 treatments (UVA1 phototherapy, methotrexate, systemic corticosteroids, mycophenolate mofetil), SSc and pansclerotic-morphea differentials. Evidence from PMID:22741933 (Kreuter review), PMID:21536453 (Kurzinski/Torok cytokine review), PMID:36860340 (Morphea 2023 update); all 30 snippets verified, terms validated. Claim #19104; grouping tracker #19103.

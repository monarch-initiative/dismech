  summary: 'Create: Localized Scleroderma (morphea)'
  details: |
    De-novo curation of localized scleroderma (MONDO:0019562) as a single Disease with plaque/generalized/deep/linear has_subtypes (linear bound to MONDO:0043294). Fibrotic pathograph (CD4+ T-cell dermal infiltration -> TGF-beta/IL-4 fibroblast activation -> excessive collagen/ECM deposition -> dermal/subcutaneous sclerosis with adnexal atrophy) conforms to fibrotic_response. 11 phenotypes, 4 treatments (UVA1 phototherapy, methotrexate, systemic corticosteroids, mycophenolate mofetil), SSc and pansclerotic-morphea differentials. Evidence from PMID:22741933 (Kreuter review), PMID:21536453 (Kurzinski/Torok cytokine review), PMID:36860340 (Morphea 2023 update). Claim #19104; grouping tracker #19103. Review round 1 (ai4c-reviewer, PR #19105): added a required deep-research baseline (research/Localized_Scleroderma-deep-research-claude_code.md, claude_code provider, 22/22 references verified, 0 confabulation); added a Vascular Endothelial Injury node, the IFN-gamma/CXCL9-10 activity signature and early plasma-cell/eosinophil infiltrate, a biochemical section (ANA, CRP + AHA/ssDNA/eosinophilia/hypergammaglobulinemia notes), an environmental-triggers entry, and three topical treatments (corticosteroids, tacrolimus, calcipotriol); removed the Skin ulcer phenotype; rebound alopecia to HP:0004552; wired contracture/lipoatrophy/hemifacial hypoplasia to the sclerosis node; retargeted MMF and UVA1; switched the collagen node to GO:0032964 at TISSUE scale; added an eosinophilic fasciitis differential. 41 snippets verified; terms validated.

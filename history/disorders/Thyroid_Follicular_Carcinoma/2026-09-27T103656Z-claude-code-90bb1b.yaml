  details: |
    Genetics pass for the series-072 gap list (issue #12279). The checklist row for this parent was MONDO:0011836 thyroid Hurthle cell carcinoma, MONDO-attributed to NDUFA13 (hgnc:17194).

    Anchor check. The parent's disease_term MONDO:0005034 thyroid gland follicular carcinoma is at the right level and MONDO:0011836 is one of its direct children, so the row was not attracted by an over-broad anchor. The mechanism is in the child class instead: MONDO:0011836 carries no definition, two parents that assert different things (this histologic carcinoma class and MONDO:0003847 hereditary disease), synonyms that are all names for the histologic entity oncocytic carcinoma of the thyroid, and a single causal-gene axiom that belongs to the familial thyroid cancer predisposition reading.

    Row disposition. Not curated as a subtype row here. The predisposition reading already has a home in Familial_Nonmedullary_Thyroid_Carcinoma, which carries a TCO subtype and a Hurthle cell thyroid adenoma phenotype and whose cited linkage source records the TCO causal gene as not yet identified. The histologic reading is queued as stubs/Thyroid_Hurthle_Cell_Carcinoma.yaml with both open questions named, so whoever takes it answers them once. The disposition is recorded in the entry's notes.

    What changed in the pathograph. All seven somatic driver genes were listed in the genetic section and none reached a pathophysiology node. NRAS, HRAS, KRAS, PAX8 and PPARG are now genes descriptors on the RAS and PAX8-PPARG Driver Alterations node, whose own evidence names them; PTEN is bound on the MAPK and PI3K-AKT Pathway Activation node with two new evidence items, one giving its mutation frequency in a 168-sample cohort and one tying PTEN loss of function in that cohort to unchecked AKT activation; and TERT, which this entry consistently treats as a progression rather than a truncal event, got a separate TERT Promoter Mutation in Tumor Progression node feeding the metastasis node. Gene wiring moved from 0/7 to 7/7. Phenotype edges were added from the proliferation node to the thyroid nodule and from the metastasis node to metastatic bone pain and to dyspnea, moving phenotype causal inlink from 0/3 to 3/3. The seven genetic records gained the enum-backed relationship_type SOMATIC_DRIVER, matching what each record's free-text association already said.

    DICER1 is named in the entry notes as a real remaining gap rather than silently omitted: the same cohort reports it mutated in 15.5% of samples, above PTEN.

    Validation. just validate, validate-terms, count-verified-snippets (all snippets verified), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-cancer-origin (one origin node, one derived cell of origin, unchanged), list-gene-term-mismatches --resolve, the whole-repo gates, then validate-disorders.

    Self-review changed the new node's name and two of its sentences: the description had bundled the mutation's adult restriction with its metastasis association as though one source said both, and a causal-edge description named telomerase reactivation, which none of the cited sentences mentions.

  summary: 'Create: Combined Factor V and Factor VIII Deficiency'
  details: |
    New entry for combined deficiency of factor V and factor VIII (MONDO:0018175), lumping type 1 (LMAN1, MONDO:0009206) and type 2 (MCFD2, MONDO:0013331) as has_subtypes because the two genes encode the subunits of one ER-to-Golgi cargo receptor and PMID:12717434 reports an indistinguishable phenotype. Both stubs retired. Causal chain: biallelic LMAN1 or MCFD2 loss -> LMAN1-MCFD2 complex disruption -> impaired ER export of FV/FVIII -> reduced plasma FV and FVIII (and platelet FV) -> bleeding and laboratory phenotypes; a model-only alpha-1-antitrypsin ER retention branch is recorded without clinical downstream. Evidence was gathered from 14 PubMed records fetched directly plus two ClinGen gene-validity records (both Definitive). Deep research: falcon was requested but had no API key; run with --fallback, it was produced by openscientist (research/Combined_Factor_V_And_Factor_VIII_Deficiency-deep-research-openscientist.md). Its 39 references all resolved; its 3 unmatched quotes are elided versions of real abstract sentences. It was used as a cross-check and agreed with the entry; its suggestion of HP:0005261 for trauma bleeding was not taken because that term is Joint hemorrhage. No GeneReviews chapter exists (just check-genereviews, NO_CHAPTER). A fresh-context self-review led to: generic endothelial cell (CL:0000115) instead of an unsourced hepatic-sinusoid binding, the platelet FV edge moved to the plasma node, IN_VITRO/BACKGROUND grading on two mechanistic quotes, desmopressin as PEPTIDE, rFVIIa as OTHER, inferred PT/aPTT frequencies removed, and uncited prose facts given evidence. Validated with just validate, validate-terms, count-verified-snippets (64/64), check-entity-refs, check-causal-targets, check-snippet-grading and the other offline gates.

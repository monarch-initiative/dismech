- type: EDIT
  outcome: changed
  sections:
  - treatments
  summary: Replace MAXO treatment terms with clinically preferred NCIT terms
  details: |
    Follow-on to PR #7117. Migrated four of the five treatment_term bindings from MAXO to NCIT, choosing the most specific clinically preferred term rather than a blind xref swap:

    - Iron and micronutrient repletion: MAXO:0000106 -> NCIT:C15425 Nutritional Supplementation, the NCIT term MAXO:0000106 is itself defined from. Added a therapeutic_agent binding to CHEBI:18248 iron so the treatment is machine-queryable by agent, per the therapeutic-agent pattern in CLAUDE.md.
    - Behavioral intervention / applied behavior analysis: MAXO:0000010 -> NCIT:C15184 Behavioral Intervention. MAXO:0000010 conflates three distinct NCIT concepts as xrefs - C116519 Cognitive Intervention, C15184 Behavioral Intervention, C64345 Cognitive Behavior Therapy. ABA is purely behavioral, based on operant conditioning, which matches the C15184 definition exactly, so the un-conflated NCIT term is the more accurate binding.
    - Endoscopic or surgical bezoar removal: MAXO:0000004 surgical procedure -> NCIT:C50821 Foreign Body Removal. Substantial specificity gain - the procedure is extraction of ingested non-native material, not generic surgery.
    - Lead toxicity recognition and management: MAXO:0000124 -> NCIT:C15419 Disease Screening, a direct 1:1 xref of the MAXO term. Also declared action_category: SCREENING on this treatment, whose enum meaning in the schema is exactly NCIT:C15419, so the screening semantics are now explicit and queryable rather than implied by the term binding alone. The treatment uses neither target_mechanisms nor target_phenotypes, so it satisfies the non-therapeutic-action constraint that category carries.

    Intentionally NOT changed: the Environmental modification and caregiver supervision treatment retains MAXO:0000053 therapeutic avoidance of environmental exposure. NCIT was searched exhaustively - avoidance, environment, exposure reduction, hygiene, caregiver, counseling, risk reduction - and has no environmental-exposure-avoidance intervention concept. Every NCIT candidate would have been a semantic downgrade. The TreatmentActionTerm enum admits only MAXO and NCIT roots, so no third ontology was available.

    Validation: just validate passes for the entry - schema validation, term validation with --labels, and reference validation. All NCIT labels were fetched from the live source and match canonically.

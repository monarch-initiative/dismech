  details: |
    PR Shepherd pass on PR #7117, addressing the third ai4c-reviewer CHANGES_REQUESTED round.

    Finding 3 [NEW sub-finding]: references_cache/PMID_31659594.md had been committed with a PubOne fetch-error JSON blob in its Content section, despite frontmatter claiming content_type: abstract_only. It was therefore unquotable, and committing a cache file whose body is a fetch error is worse than omitting it. Regenerated with `just fetch-reference PMID:31659594` - never hand-edited - and then cited for the sickle cell disease route already named in the Pica description. Added as a new qualitative prevalence record: population "Children and adolescents with sickle cell disease", measure_type UNKNOWN, prevalence_class COMMON, no rate_per_100000, because the review reports a high prevalence across several studies without pooling a numeric estimate.

    Finding 6: added the two treatments the reviewer identified as missing. Both quote the Leung review DOI:10.2174/1573396315666190313163530, which was already cached and already cited elsewhere in the entry, so no new fetch was required.
      - "Lead toxicity recognition and management" - MAXO:0000124 disease screening, therapeutic_modality OTHER, supported by the "significant cause of anemia and lead poisoning" and "promptly recognized and treated" sentences. Deliberately not bound to MAXO:0001223 chelator agent therapy, since the cited source does not name chelation and that would over-specify beyond the evidence.
      - "Environmental modification and caregiver supervision" - MAXO:0000053 therapeutic avoidance of environmental exposure, therapeutic_modality BEHAVIORAL, supported by the discrimination-training/supervision sentence, with the housing/economic adjunct clause recorded as PARTIAL since the review frames it as secondary.

    Minor finding: the shared "Some authors have suggested..." snippet on the Gut Luminal Iron Sequestration node was retagged SUPPORT to PARTIAL so it reads consistently with the same quote's use in the luminal_iron_sequestration hypothesis group.

    Left open for the PR author: finding 5, no clinical_trials on any of the four entries. Curating the surfaced NCT records is a larger evidence task than this shepherd pass covers, and the seven other uncited cache files were left in place since their bodies are real abstract text.

    Validation: `just validate kb/disorders/Pica.yaml` passed schema, term and reference validation. All 30 evidence items in the file were independently re-verified as exact whitespace-normalized substrings of their references_cache bodies. `just check-reference-cache-frontmatter` OK.

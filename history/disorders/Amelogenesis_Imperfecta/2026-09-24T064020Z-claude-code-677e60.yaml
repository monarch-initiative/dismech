  summary: Enumerate 18 gene-defined subtypes and wire AI genes into the pathograph
  details: |
    Gene-defined subtype enumeration under the amelogenesis imperfecta umbrella (issue #12229, epic #12189). Sanity-checked the parent anchor first: MONDO:0019507 is the genuine umbrella and all 18 checklist terms descend from it, via MONDO:0015047 (AI type 1), MONDO:0015048 (AI type 2), MONDO:0968955 (hypocalcified AI) or directly; checked at the OLS MONDO endpoint. Added 18 gene-defined has_subtypes rows (AI1A, AI1B, AI1C, AI1E, AI1F, AI1G, AI1H, AI1J, AI1K, AI2A1-AI2A6, AI3A, AI3C, AIHHT), each with a bound subtype_term, bound genes, a mechanism-aware description and exact-quote evidence from the primary report. The three pre-existing Witkop phenotype-class rows are kept as a second, orthogonal axis. Added 11 genetic records (LAMB3, AMBN, FAM20A, ITGB6, ACP4, SP6, ODAPH, SLC24A4, GPR68, RELT, DLX3) and repointed the six existing ones from the Witkop classes to their gene-defined rows, adding relationship_type. Wired genes into the pathograph rather than listing them: three new pathophysiology nodes (Transcriptional Control of Ameloblast Differentiation for SP6 and DLX3; Defective Ameloblast Cell-Matrix Adhesion for ITGB6 and LAMB3; Defective Ameloblast Ion Transport and Enamel Matrix pH Regulation for SLC24A4 and GPR68), plus genes bound onto the existing secretion, processing/maturation and umbrella nodes. Gene-to-mechanism wiring moved from 0/6 to 16/17; FAM20A is deliberately unwired with the reason recorded. Recorded three MONDO disagreements found by lookup rather than working around them: MONDO:0010521 (AI type 1E) is parented under AI type 2; MONDO:0031084's primary label mixes a type-II prefix with the AI1K designation; MONDO:0032717 (AI3C) is parented under hypocalcified AI while the cited RELT report describes hypoplastic enamel. Also recorded that HGNC has renamed FAM83H to SACK1H while the repository term cache still carries FAM83H. Self-review removed three unsourced prose claims of my own (FAM83H as "the commonest dominant form", MMP20 "acts earlier than KLK4", the SLC24A4 exchanger family description) and added adjacent evidence for eight more. Validated with just validate, validate-terms, count-verified-snippets (80/80), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches (140/140 bindings correct across both files), check-genereviews, prose-figure-audit and validate-disorders.

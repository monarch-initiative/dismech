  details: |
    Review round 2 on PR #12655 (issue #12229). Addressed the reviewer's findings that touch this entry, and swept the rest of the diff for the same defect classes. Evidence-source regrading: the PMID:27843125 ACPT immunohistochemistry sentence was graded IN_VITRO in two places; the cited full text states the staining was performed on a developing molar from 8-day-old mice, so both are now MODEL_ORGANISM and the AI1J row, the ACP4 genetic record and the secretion-node explanation say the localization is shown in mouse. The PMID:33034243 sentence attributing the neomorphic FAM83H mechanism to knockout and knock-in mouse models was graded HUMAN_CLINICAL and is now MODEL_ORGANISM with quote_role REVIEW_SYNTHESIS, since the paper is a review restating those models. Swept every new evidence item in the diff for the same class by comparing snippet wording against grade; the ITGB6 maturation-expression item was already MODEL_ORGANISM but its descriptions did not name the species, so the cell-matrix adhesion node and the AI1H row now say "in mouse". Took the reviewer's non-blocking suggestion on ODAPH placement: the evidence for binding ODAPH to the processing and maturation node quoted the human enamel phenotype, which argues for hypoplasia or hypocalcification rather than for a maturation-stage placement, and now quotes the mouse post-secretory-transition expression sentence instead. Took the grading suggestion for the KLK4 hypomaturation-phenotype sentence, which describes a human clinical phenotype and is now HUMAN_CLINICAL rather than OTHER; declined it for the AMBN, SP6 and GPR68 sentences, which state protein or process biology rather than a study's evidence type. Removed curation-session narration from prose per CLAUDE.md: the FAM20A review_notes now records which searches were run instead of saying no evidence was found "in this pass", and the entry notes no longer describe a "subtype pass" while keeping the date and endpoint the MONDO observations were read from. Before regrading anything, ran an entry-wide census of every item citing each affected PMID to confirm no pre-existing item quoted the same sentence under the old grade. Validated with just validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-folded-hyphens, prose-figure-audit and validate-disorders.

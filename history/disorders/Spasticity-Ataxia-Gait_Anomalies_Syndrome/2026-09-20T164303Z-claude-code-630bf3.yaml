  summary: 'Genetics pass: correct a mis-bound disease term; wire SACS, SPG7, AFG3L2'
  details: |
    Genetics pass for issue 12206, and the most substantive finding of the tranche. The entry was bound to MONDO:0014803 and modelled a heterogeneous spastic-ataxia umbrella spanning ARSACS, SPG7 and SPAX5. MONDO:0014803 is not that concept: it is a single-gene leaf class with no children, synonyms SPAHGC and childhood-onset spasticity with variant non-ketotic hyperglycinemia, cross-referencing OMIM:616859 and Orphanet:401866, with GLRX5 recorded as its causal gene. The label MONDO uses is Orphanet's label for the GLRX5 disease. An earlier note in this entry, sourced to a Falcon deep-research report, claimed the label was not a standard clinical disease name; that claim was wrong and has been replaced with the corrected finding and a record of the searches run. Rebound disease_term to MONDO:0017845 spastic ataxia, the OMIM phenotypic-series grouping term under which this entry's content belongs, and renamed the entry to Spastic Ataxia. Verified that MONDO:0017845 is not a descendant of MONDO:0000437, so the exclusion recorded in kb/groupings/Cerebellar_Ataxias.yaml still holds; its prose was updated for the new name and id. Added subtype_term bindings and genes: descriptors to the three subtype rows - ARSACS to MONDO:0010041 with SACS, SPG7-associated spastic ataxia to MONDO:0011803 with SPG7, SPAX5 to MONDO:0013776 with AFG3L2 - plus classification gene_defined, relationship_type CAUSATIVE and subtype foreign keys. Wired SACS to the white-matter node and SPG7 to the mitochondrial node. SACS is deliberately the only gene on the white-matter node, because that node's own cited snippet reports the pattern in ARSACS but explicitly not in SPG7. SPG7 is on the mitochondrial node because paraplegin and AFG3L2 are subunits of the same m-AAA protease, evidenced by a newly fetched reference (PMID:30252181). Gene-to-mechanism wiring 1/3 to 3/3. GLRX5 disposition: not added here. It causes sideroblastic anaemia and a variant non-ketotic hyperglycinemia through impaired iron-sulfur cluster biogenesis, unrelated to the m-AAA and sacsin defects on this page, and belongs to a separate entry on MONDO:0014803 that dismech does not have. Two follow-ups are left for a maintainer and flagged in notes and in the PR: the filename still carries the retired label, and the ARSACS and SPG7 rows duplicate standalone entries that already exist, so the entry is a candidate for conversion to a grouping.

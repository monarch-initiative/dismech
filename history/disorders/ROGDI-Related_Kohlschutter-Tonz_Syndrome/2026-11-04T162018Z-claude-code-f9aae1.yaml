  summary: 'Create: ROGDI-Related Kohlschutter-Tonz Syndrome'
  details: |
    New entry for MONDO:0009185 (amelocerebrohypohidrotic syndrome / Kohlschutter-Tonz syndrome, ROGDI). Named ROGDI-Related Kohlschutter-Tonz Syndrome because SLC13A5 is a second gene for the clinical diagnosis (PMID:27600704) and is curated by MONDO as DEE25, so the bare eponym is broader than this ROGDI-bound term; the ROGDI-related form is used in recent titles (PMID:37974187, PMID:39445602). Deep research: falcon was requested but not configured (no EDISON_API_KEY), so the run fell back to claude_code via --fallback; the report research/ROGDI-Related_Kohlschutter-Tonz_Syndrome-deep-research-claude_code.md resolved 19/19 references, had one ellipsis-paraphrased quote (PMID:27600704; the entry quotes the exact sentence), and passed just preflight-dr. Additional sources were found by PubMed search. Pathograph: ROGDI loss of function -> impaired Rabconnectin-3-dependent V-ATPase assembly -> (a) defective ameloblast acidification -> hypomineralized enamel, and (b) presynaptic dysfunction -> epilepsy and neurodevelopmental phenotypes; the neuronal branch is marked as inferred and a KNOWLEDGE_GAP discussion records that V-ATPase assembly has not been measured in mammalian ROGDI-null cells. Renal (nephrocalcinosis, dRTA) and hypohidrosis phenotypes are left unconnected because no mechanism is established. ClinGen Definitive (AR) recorded from the cached CGGV record. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (54/54), check-entity-refs, check-causal-targets, check-name-collisions and the snippet baseline gates.

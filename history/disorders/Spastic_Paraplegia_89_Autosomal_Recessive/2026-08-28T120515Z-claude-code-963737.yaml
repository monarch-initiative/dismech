  summary: 'Create: Spastic Paraplegia 89 Autosomal Recessive, AMFR, MONDO:0957274'
  details: |
    De novo curation of SPG89 from claim issue #9818. The claim issue asked for a check that the evidence base supports a real pathograph rather than a single-family report; it does, and the entry notes record the check: 20 individuals from 8 unrelated consanguineous families with segregation, patient fibroblasts and neural stem cells, electron microscopy and a zebrafish model, plus an independent Algerian report of a further homozygous splice variant. Deep research: Perplexity sonar-deep-research resolved 16/16 identifiers with zero confabulation, but only 5 of 16 were assessed on topic with 3 flagged explicitly off topic, so it was used as a lead source only and every snippet is anchored to a PMID read directly. The mechanistic point recorded is that gp78 is an ERAD ligase but the demonstrated consequence in patient cells is disturbed lipid homeostasis, so the entry follows the demonstrated phenotype rather than the expected one. Statins are curated as a treatment marked NOT A TREATMENT FOR PATIENTS, graded PARTIAL and MODEL_ORGANISM, because the rescue is zebrafish-only and the authors hedge it as suggesting potential therapeutic implications. A HUMAN_MODEL_MISMATCH discussion records the specific gap: the statin rescue was measured on larval motor readouts, not on the lipid phenotype it is proposed to act through, so the drug improving the phenotype is consistent with but not equivalent to correcting the mechanism. No frequency in this entry is a measured proportion; each is assigned from the founding report's mainly pure but also complex wording and the phenotype descriptions say so. One ontology label was wrong on first pass and corrected: HP:0001256 is Mild intellectual disability. Validated with just validate, 22/22 snippets verified, plus check-entity-refs and check-duplicate-keys.

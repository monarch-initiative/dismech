  summary: 'Review round 3: correct a REFUTE grading I introduced, bind the statins'
  details: |
    Two items from the round-2 approving review. The first is a regression I introduced in the previous commit, not a pre-existing gap.

    1. The two ER-stress evidence items were graded REFUTE. That was wrong, and wrong in a way that would have exported a false claim. The supports value grades an evidence item against the claim it is attached to, and these items sit on a readout whose claim is its own measurement: ER stress response, direction UNCHANGED. The quoted sentences report exactly that measurement, so they support it. Graded REFUTE, they export as evidence refuting Blunted ERAD of HMGCR and INSIG-1 - a node the paper does not argue against but demonstrates. Both are now SUPPORT, with explanations recording the reasoning.

    The distinction against the ORO case is worth keeping straight, because the two look alike and are not: the ORO null is REFUTE on a RESCUES link, where the link's own claim is that statins rescue the lipid phenotype, and the null does refute that claim. Here the link is MEASURES and its claim is that the measurement was made. Same null-result shape, opposite grading, because the claim being graded against differs. The 'this excludes generalised proteostasis failure' inference stays where it belongs, in the readout interpretation and the link limitations.

    2. Bound atorvastatin (CHEBI:39548) and simvastatin (CHEBI:9150) as therapeutic_agent on the NCIT:C15986 treatment term. The entry already distinguishes the two drugs in three places - the description, the branching readout graded PARTIAL, and a proposed experiment - because atorvastatin corrected axon branching and simvastatin did not. Until now that distinction existed only in prose; binding both agents makes it machine-queryable, which is the point of recording it at all. Both CURIEs were already in cache/chebi/terms.csv and the chemicalentityterm enum cache, so this added no cache rows.

    Validation on this head: just validate passes with 47/47 snippets verified; working tree clean afterwards, no cache churn.

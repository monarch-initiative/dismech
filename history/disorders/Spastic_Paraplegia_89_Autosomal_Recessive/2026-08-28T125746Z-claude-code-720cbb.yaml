  summary: 'Review round 2: post-approval suggestions'
  details: |
    Addressed four of the five non-blocking suggestions from the approving review; the fifth is blocked upstream.

    1. Regraded two evidence items from SUPPORT to PARTIAL. Lower Limb Hyperreflexia cites the paper's general definition of HSP, which names spasticity and weakness but not hyperreflexia; Axial Hypotonia cites the generic complex-phenotype sentence, which does not name hypotonia. Both rates come from Table 1, whose de-tabulated cache rendering is a run-on string that would trip check-snippet-length, so the compromise stands and only the grade changes. Both explanations now say why.

    2. Trimmed the prose residue from the framing the previous round replaced. The gp78 node description and the AMFR genetic note both still said the mechanism departs from the gene's known biology, which contradicted the entry's own description of a route that runs through ERAD rather than away from it. Both now state the substrate-selective reading: the ERAD substrates that matter here are HMGCR and INSIG-1.

    3. Added Behavioral Concerns, the one Table 1 feature above the 10 percent threshold not previously modelled, at 3/19 (15.8 percent), bound to HP:0000708 Atypical behavior. Table 1 records it as a category without naming the behaviors, so the general HPO term is the accurate binding. Graded PARTIAL on the same basis as Axial Hypotonia.

    4. Added the ER stress negative result as a structured readout rather than leaving it in prose. The NSC model now carries a MEASURES link on Blunted ERAD of HMGCR and INSIG-1 with an UNCHANGED readout and two REFUTE-graded evidence items: ER stress was assessed in AMFR KO NSCs including under tunicamycin challenge and showed no clear difference, and no evidence for increased ER stress was found in patient fibroblasts either. This is the direct negative test of the proteostasis expectation the entry raises, and it is what makes the ERAD lesion substrate-selective rather than a global unfolded-protein failure. The limitations record that the null excludes a gross UPR but not a subtler or compartment-restricted defect.

    5. Orphanet cross-check not done. references_cache/ORPHA_* cannot be produced right now because just refresh-orphadata fails its pinned checksum, which is open issue 9687. Recorded rather than skipped silently.

    Validation on this head: just validate passes with 47/47 snippets verified (was 43/43); validate-terms, check-entity-refs and check-duplicate-keys clean.

  summary: 'Review round 1: curate from the full text, not the abstract'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #9835. The reviewer's summary of the root cause is correct and worth repeating: the entry was curated against the abstract of PMID:37119330 while the full text was in the cache file committed in the same PR, and that full text contradicted two central framing claims. Corrections made. Table 1 publishes per-phenotype rates for all 20 individuals, so the previous notes claim that no measured frequencies exist was false; every frequency is now derived from it, including the informative zero rows for speech delay, regression, ataxia and bladder dysfunction. Seven phenotypes above the 10 percent threshold were added: lower limb hyperreflexia 100 percent, learning problems 25 percent, epilepsy 20 percent, fever-induced seizures 10 percent, thin corpus callosum 55.6 percent of those imaged, axial hypotonia 10 percent, microcephaly 6.3 percent. The HUMAN_MODEL_MISMATCH discussion asserted the lipid readout was never taken under statin; it was taken and was negative, so the discussion is rewritten as a KNOWLEDGE_GAP around the dissociation, the negative Oil Red O result is modelled as an explicit UNCHANGED readout graded REFUTE, and the proposed experiment is re-scoped to human cells with sterol profiling rather than droplet staining. Atorvastatin corrected axon branching and simvastatin did not; the two are no longer flattened into statins. The departs-from-ERAD-reputation framing was wrong: the paper concludes the loss of AMFR ERAD function underlies the disease, acting on HMGCR and INSIG-1, so a Blunted ERAD of HMGCR and INSIG-1 node was added between the ligase and the lipid node, which is also what the statin rationale hangs on. GO:0055088 modifier changed from DECREASED to DYSREGULATED to match a balance disturbance. Added experimental_models for patient fibroblasts and AMFR-KO ESC-derived NSCs including the RING-mutant rescue arm, a progression section, and two symptomatic treatments including genetic counselling. Confirmed no GeneReviews chapter exists for AMFR or SPG89 and that the HSP Overview abstract has no minable content, recorded in notes. One near-miss during cleanup: PMID_20301682 was deleted as uncited and turned out to be tracked and cited by four other entries; restored. Revalidated: 43/43 snippets verified, check-entity-refs, check-duplicate-keys and check-snippet-length pass.

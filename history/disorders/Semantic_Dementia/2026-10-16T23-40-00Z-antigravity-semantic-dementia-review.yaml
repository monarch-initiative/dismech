  summary: Enhance Semantic Dementia entry with full mechanistic, clinical, genetic, biomarker, and diagnostic
    curation
  details: 'Reviewed kb/disorders/Semantic_Dementia.yaml against the three deep-research reports (cyberian-codex,
    falcon, perplexity), cached literature in references_cache/, and PR #14649 review feedback.

    Added synonyms (semantic variant primary progressive aphasia, svPPA, temporal variant frontotemporal
    dementia, progressive fluent aphasia, gogi aphasia), classifications (NEUROLOGIC; degenerative disease,
    proteotoxic disease), inheritance (Sporadic, HP:0003745, cited to PMID:34169147 and DOI:10.1093/brain/awaa317,
    with notes explaining why postmortem somatic TARDBP variants in two brains are modeled via variant_origin:
    SOMATIC on TARDBP rather than a disorder-level HP:0001442 inheritance arm), prevalence (two FTD-wide
    upper-bound records: 4-15 per 100,000 in general US/European cohorts paired with the 18.6% svPPA clinical
    proportion from PMID:22406228 implying ~0.7-2.8 per 100,000, and 28 per 100,000 in adults aged 60-70
    years from PMID:24966676), and progression (presenile onset in the 50s/60s or 40s and 10-12 year slowly
    progressive PPA course from PMID:24966676).

    Expanded pathophysiology from 2 disconnected nodes to a 6-node causal graph linking TDP-43 Type C
    Proteinopathy and Dystrophic Neurite Formation (binding TARDBP hgnc:11571 and ANXA11 hgnc:535 with
    GO:0003723; cited to DOI:10.1038/s41598-020-72847-1, DOI:10.1111/neup.12859, DOI:10.1093/brain/awaa317,
    PMID:39260416, PMID:40713859) -> Attenuated Temporal Inhibitory Self-Coupling and Abnormal Left Fronto-Temporal
    Excitatory Projection (TISSUE scale spectral DCM node, DOI:10.1038/s41598-020-72847-1 graded COMPUTATIONAL/INDIRECT),
    Bilateral Frontal Microglial Activation (pooled 30-patient FTD PK11195-PET cohort in PMID:36883644
    graded INDIRECT), Temporal Neocortex Degeneration (GO:0008219 cell death; PMID:11287367, DOI:10.1186/s13195-020-00600-x,
    DOI:10.1111/neup.12859), and Ventral and Temporal White Matter Tract Degeneration (PMID:21666264)
    -> Progressive Semantic Network Degeneration (PMID:41089414, PMID:34266501, PMID:30876954) -> clinical
    phenotypes.

    Curated 10 clinical phenotypes without unquantified frequency bands (Anomia, Impaired Single-Word
    Comprehension and Semantic Memory Loss, Dyslexia, Dysgraphia, Visual Agnosia, Prosopagnosia, Frontotemporal
    Cerebral Atrophy, Disinhibition, Atypical Behavior, Apathy, and Depression; supported by PMID:41089414,
    PMID:34266501, PMID:21325651, PMID:30876954, PMID:11287367, DOI:10.1111/neup.12859, DOI:10.1002/alz.055310,
    DOI:10.1038/s41598-020-72847-1, PMID:24966676), biomarkers (elevated CSF/plasma Neurofilament Light
    Chain NEFL readout of Temporal Neocortex Degeneration anchored to primary FTD proteomics cohort DOI:10.1101/2024.02.09.579529
    and background PMID:42297981; non-Alzheimer CSF Abeta42/tau profile from PMID:35841250 and PMID:24966676),
    genetic entries (somatic TARDBP variants SOMATIC_DRIVER from DOI:10.1093/brain/awaa317, rare germline
    C9orf72 expansions from PMID:22406228, and candidate TUBA4A frameshift variant SUSCEPTIBILITY from
    PMID:34169147), diagnostic workup (2011 Gorno-Tempini consensus criteria/neuropsychological assessment
    PMID:21325651, structural MRI PMID:34266501 and PMID:24966676, 18F-FDG-PET PMID:35841250 and PMID:24966676),
    specific MONDO differential diagnoses (Alzheimer disease / logopenic variant PPA MONDO:0004975, progressive
    non-fluent aphasia MONDO:0015059, and behavioral variant of frontotemporal dementia MONDO:0017160),
    and treatments with therapeutic_modality and ChEBI drug bindings (Speech and Language Therapy BEHAVIORAL
    with findings snippet from PMID:28286641 and PMID:34266501; SSRI pharmacotherapy SMALL_MOLECULE binding
    paroxetine CHEBI:7936, sertraline CHEBI:9123, and citalopram CHEBI:3723 for depression, and trazodone
    pharmacotherapy CHEBI:9654 for disinhibition and atypical behavior from PMID:24966676).

    '

  summary: Enhance Semantic Dementia entry with full mechanistic, clinical, genetic, biomarker, and diagnostic curation
  details: |
    Reviewed kb/disorders/Semantic_Dementia.yaml against the three deep-research reports (cyberian-codex, falcon, perplexity) and cached literature in references_cache/.
    Added classifications (NEUROLOGIC; degenerative disease, proteotoxic disease), inheritance (Sporadic, HP:0003745, cited to PMID:34169147 and DOI:10.1093/brain/awaa317), prevalence (FTD spectrum point prevalence of 4-15 per 100,000 overall and 28 per 100,000 in ages 60-70, PMID:24966676), and progression (presenile onset in the 50s or 60s, or 40s, and 10-12 year slowly progressive PPA course, PMID:24966676).
    Expanded pathophysiology from 2 disconnected nodes to a 6-node causal graph linking TDP-43 Type C Proteinopathy and Dystrophic Neurite Formation (DOI:10.1038/s41598-020-72847-1, DOI:10.1111/neup.12859, DOI:10.1093/brain/awaa317) -> Superficial Lamina GABAergic Interneuron Dysfunction and Fronto-Temporal Hyperconnectivity (DOI:10.1038/s41598-020-72847-1), Bilateral Frontal Microglial Activation (PMID:36883644), Temporal Neocortex Degeneration (PMID:11287367, DOI:10.1186/s13195-020-00600-x, DOI:10.1111/neup.12859), and Ventral and Temporal White Matter Tract Degeneration (PMID:21666264) -> Progressive Semantic Network Degeneration (PMID:41089414, PMID:34266501, PMID:30876954) -> clinical phenotypes.
    Added core phenotypes (Impaired Single-Word Comprehension and Semantic Memory Loss, Dysgraphia, Visual Agnosia, Frontotemporal Cerebral Atrophy, Disinhibition), biomarkers (elevated Neurofilament Light Chain NEFL readout of Temporal Neocortex Degeneration from PMID:42297981; non-Alzheimer CSF Abeta42/tau profile from PMID:35841250 and PMID:24966676), genetic entries (somatic TARDBP variants from DOI:10.1093/brain/awaa317, rare germline C9orf72 expansions from PMID:22406228, and rare TUBA4A frameshift variant from PMID:34169147), diagnostic workup (2011 Gorno-Tempini consensus criteria/neuropsychological assessment PMID:21325651, structural MRI PMID:34266501 and PMID:24966676, 18F-FDG-PET PMID:35841250 and PMID:24966676), differential diagnoses (Alzheimer disease / logopenic variant PPA, nonfluent/agrammatic variant PPA, and behavioral variant FTD), and symptomatic SSRI pharmacotherapy alongside lexical-retrieval speech therapy.

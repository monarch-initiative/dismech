  summary: Enriched Japanese Encephalitis with Harrison's classifications, de-bundled JEV-evidenced pathophysiology nodes, expanded neurological phenotypes, diagnostic criteria details, and phenotype-targeted supportive care.
  details: >-
    Added Harrison's chapter classifications (INFECTIOUS_DISEASES, NEUROLOGIC)
    backed by verbatim evidence from PMID:41755551 and PMID:35615063. Split the
    pathophysiology graph into four single-process nodes (Mosquito Inoculation
    and Transient Viremia, Blood-Brain Barrier Disruption and Neuroinvasion,
    CNS Parenchymal Tropism and Neuronal Injury, and Glial Activation and CNS
    Neuroinflammation) with UBERON/CL/GO groundings restricted to JEV-evidenced
    annotations from PMID:26856911, PMID:35615063, PMID:39147951, PMID:27741995,
    and PMID:31541214. Expanded phenotypes to cover Status epilepticus, Cranial
    nerve paralysis, Respiratory insufficiency, and Myelitis alongside Infectious
    encephalitis and Seizure, completed diagnosis presence/results, and linked
    Supportive Care to its downstream clinical phenotype targets (PMID:28187808).

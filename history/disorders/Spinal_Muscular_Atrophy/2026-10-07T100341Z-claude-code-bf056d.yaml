  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding LOINC:92005-8 Spinal muscular atrophy newborn screening panel as the test identity and LOINC:92002-5 SMN1 gene [Cycle Threshold #] in DBS by NAA with probe detection as the SMN1 observable; the Monarch KG has no method-less or presence-style SMN1 DBS code, and the searches tried are listed in the row notes. The label is quoted in the YAML because a plain scalar ends at space-hash, which the term validator caught as a truncated label on the first seed run. No reference range: the screen is qualitative and the cycle-threshold call point is not stated in the cited abstracts. Evidence from the New York State (PMID:32418989) and Wisconsin (PMID:35120759) programmes. No biochemical marker was bound; the entry's only marker is creatine kinase. Validated with the per-file gates, validate-disorders and the KB-wide snippet-grading gate.

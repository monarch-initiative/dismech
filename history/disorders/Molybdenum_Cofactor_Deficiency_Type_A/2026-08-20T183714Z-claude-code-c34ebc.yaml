  summary: 'Create: Molybdenum Cofactor Deficiency Type A (MOCS1)'
  details: |
    New Disease entry for molybdenum cofactor deficiency type A (MONDO:0009643, OMIM 252150), autosomal recessive, biallelic MOCS1 (hgnc:7190).

    Mechanism curated as 7 atomic nodes with a deliberate fork. MOCS1 loss blocks step one of molybdenum cofactor biosynthesis (GTP to cyclic pyranopterin monophosphate), which disables all four human molybdoenzymes at once. The entry then splits that combined failure into two arms that are curated separately because they behave differently: the sulfite oxidase arm (sulfite accumulation, S-sulfocysteine formation, NMDA-receptor excitotoxicity, neonatal encephalopathy) carries essentially the whole clinical disease, while the xanthine oxidoreductase arm (high xanthine, low urate) supplies the diagnostic biochemical signature and little of the morbidity. The evidence for that asymmetry is comparative: isolated sulfite oxidase deficiency mirrors most of the phenotype, and isolated xanthinuria is a stone-forming condition rather than an encephalopathy.

    The excitotoxicity step is the mechanistic centrepiece: S-sulfocysteine is a structural analog of glutamate and activates NMDA receptors, causing calcium influx and calpain activation. That is what converts a metabolic block into destructive brain injury and explains why the treatment window is so narrow.

    Scope discipline was the main curation risk and is recorded in two places. Types B (MOCS2) and C (GPHN) are clinically indistinguishable and appear throughout the literature, but only type A is treatable, so blending them would attach fosdenopterin to diseases it cannot help. Every claim here is from a type A or all-subtype statement; where a source gives combined figures the type A stratum is quoted instead (one-year survival 71.8 percent for neonatal-onset type A, not the 77.4 percent overall). The Mocs2 mouse model in PMID:27138983 is deliberately not curated and no animal_models section is asserted, with the reasoning in a HUMAN_MODEL_MISMATCH discussion: a type B model cannot test the cPMP-bypass argument because in that model cPMP is already being made.

    Both GeneReviews Agents/Circumstances to Avoid items are carried: valproate avoidance (its own treatment entry, noting the collision with the fact that these patients present with refractory neonatal seizures) and UV avoidance for patients on fosdenopterin.

    Three discussions: a KNOWLEDGE_GAP on the unquantified treatment window (GeneReviews says 'a very short window' with no number, and the excitotoxicity mechanism suggests hours rather than days, which would change whether to treat before molecular confirmation); a KNOWLEDGE_GAP on what the non-sulfite molybdoenzymes actually contribute; and the HUMAN_MODEL_MISMATCH above.

    Three differentials: isolated sulfite oxidase deficiency (same sulfite arm, intact purine arm, distinguished by normal urate), types B and C, and hypoxic-ischemic encephalopathy — the last being the differential that actually costs time, where a low serum urate is the cheap discriminator.

    Validation: just validate passed; 43/43 snippets verified; just validate-terms passed; check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean.

    Two errors caught during curation and worth recording. First, I initially bound MONDO:0009116 for isolated sulfite oxidase deficiency in the differential; the term validator rejected it and it turned out to be 'obsolete lactose intolerance'. The correct term, MONDO:0010089, was taken from the existing KB entry rather than guessed again. Second, one evidence snippet initially quoted an article title (PMID:21031595); check-title-snippets rejected it and it was replaced with the abstract sentence mapping each gene to its complementation group.

    GeneReviews baseline: PMID:34870926 exists and was used as the mandatory phenotype baseline, tagged in the top-level references block. Deep-research report was the cleanest of this batch — 23 of 23 references resolved, confabulation_rate 0.0, no needs_review flag.

  details: |
    PR Shepherd follow-up to the ai4c-reviewer CHANGES_REQUESTED review of 2026-08-20T18:49:05Z. All three findings addressed from material already committed in this branch; no new literature search and no new reference cache files. CRITICAL finding: the HUMAN_MODEL_MISMATCH discussion mismatch_no_type_a_animal_model_is_curated asserted that the only published mouse was a Mocs2 type B model. That premise was wrong - the deep-research artifact leads with a Mocs1 knockout mouse, PMID:15862276, MGI:1928904, whose cached abstract also states that an efficient therapy using a biosynthetic precursor of Moco was established in that model. Added an animal_models entry for the Mocs1-null mouse with two modeled_mechanisms links, RECAPITULATES against Sulfite Accumulation and S-Sulfocysteine Formation and PARTIALLY_RECAPITULATES against Neonatal Encephalopathy and Cerebral Injury, each with MODEL_ORGANISM evidence, fidelity and limitations, plus link-level evidence for the model being informative at all. Recorded in the model notes that the cited abstract names the disease but not the gene, so the Mocs1 genotype attribution comes from the deep-research artifact and MGI rather than from the quoted text. Replaced the retired discussion with mismatch_type_a_mouse_lacks_the_human_structural_lesion, which states the mismatch that actually survives - the mouse excluded morphological brain damage and died within two weeks, against human MRI structural destruction over an infancy-long course - and rewrote the proposed experiment to test whether that difference is one of kind or only of duration. Updated the top-level scope notes, which still said no animal model was curated. Second finding: PMID:25764214 was committed but uncited. Added its median 36-month survival to the Profound Neurodevelopmental Disability and Early Mortality node as an untreated-natural-history corroboration of the stratified figure, and its median 89-day diagnostic delay to the Molecular Genetic Testing diagnosis entry, where it quantifies the treatment-window gap the discussions describe qualitatively. Third finding: added the two missing GeneReviews phenotypes above the 10 percent threshold, Axial hypotonia HP:0008936 and Apnea HP:0002104, both quoting GeneReviews sentences the entry already cited elsewhere. No frequency band asserted on axial hypotonia, with the reason recorded in its notes. Validated with just validate - schema, terms and references all pass, snippets 51/51 verified against cached references - just check-duplicate-keys, and the model/target/discussion subset of tests/test_data.py, 17295 passed.

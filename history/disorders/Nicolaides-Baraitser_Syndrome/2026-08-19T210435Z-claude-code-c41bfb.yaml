  summary: 'Address review: add Hypotonia phenotype, drop orphan reference cache'
  details: |
    Round-3 review response for PR #7415, after rebasing the branch onto current main. The cache/*.csv rebase conflicts were all timestamp-only duplicates of rows main had independently added, so main's rows were kept and the branch's dropped; the branch now contributes zero cache rows and both cache guards pass.

    Added the Hypotonia phenotype HP:0001252, closing one of the three phenotype gaps the reviewer flagged as blocking and that the previous round had to defer. The Orphanet route the reviewer proposed is still unavailable: just refresh-orphadata was re-run and still fails its sha256 gate, observed df8d562a... against pinned fb2fbe8c..., and a rebuilt ORPHA_3051.md would additionally be stamped with the manifest's 2025-12-09 snapshot date while being derived from a different snapshot. Instead, a Europe PMC open-access sweep surfaced two NCBRS-specific case reports not previously cached. PMID:41497020 states at disorder level that neurological abnormalities include seizures, hypotonia, microcephaly and structural brain anomalies, curated SUPPORT. PMID:37970954 documents oral motor hypotonia in a molecularly confirmed NCBRS patient, curated PARTIAL because the observation is regional and n=1. No frequency band is asserted, since the Sousa 2014 19/51 denominator remains unquotable; this follows evidence-guidelines Pattern D and matches how Feeding Difficulties and Eczematous Dermatitis were handled. The phenotype was also wired into the pathograph as an INDIRECT_UNKNOWN_INTERMEDIATES edge from Impaired Neurodevelopment.

    Non-scalp hypertrichosis HP:0000998 and frequent infections HP:0002719 remain uncurated. All 82 PubMed records tagged Nicolaides-Baraitser were fetched and swept: every statement of hypertrichosis or frequent infections belongs to Coffin-Siris syndrome or to a mixed SWI/SNF cohort, PMID:34706719 with hypertrichosis 8/12, containing a single NCBRS patient, none attributable to NCBRS. Both are documented in the disease-level notes under SOP section 4 Option A together with the exact blocker.

    Also removed references_cache/PMID_27286846.md per reviewer suggestion 1: a J Neurol letter cached without an abstract and cited nowhere in the repo, so unusable as an evidence source.

    Validation run: just validate reported schema No issues found, term validation passed, reference validation All validations passed with Snippets checked 93/93 verified against cached references. just count-verified-snippets reported 93/93. just check-duplicate-keys OK. just check-title-snippets OK with no new title-quoting snippets. just check-cache-order OK. just check-term-cache-integrity OK across 18 term cache files and 24 enum cache files. just validate-disorders passed.

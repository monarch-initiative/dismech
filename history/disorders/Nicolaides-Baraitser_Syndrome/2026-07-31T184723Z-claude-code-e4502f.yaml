  details: |
    Created the Nicolaides-Baraitser syndrome entry (intellectual disability-sparse hair-brachydactyly syndrome; MONDO:0011053; OMIM 601358; SMARCA2) for issue #7217. Deep research provider falcon/Edison. NEC preflight passed - MONDO:0011053 carries OMIM:601358 and the SMARCA2 gene association. The entry is scoped against three attractors documented in notes: Coffin-Siris syndrome, which dismech already curates and which lists SMARCA2 among its BAF genes; the allelic SMARCA2 blepharophimosis-intellectual disability syndrome caused by variants outside the helicase domains; and the unrelated SMARCA2/BRM cancer literature. NCBRS is modelled as the distinct entity it is - de novo NON-TRUNCATING variants clustered in the ATPase region, acting by a mechanism that is deliberately left open. GeneReviews chapter PMID:26468571 fetched and tagged, with all four abstract sections mined including Genetic Counseling. Curated 5 pathophysiology nodes, 23 phenotypes with HPO terms, 2 structured prevalence records, genetics, 2 diagnostic modalities including the DNA methylation episignature, 11 treatments including a separate lamotrigine agents-to-use-with-caution item, and a KNOWLEDGE_GAP discussion on the dominant-negative versus SMARCA4-retargeting mechanism dispute. No conforms_to declared - epilepsy_excitation_inhibition_imbalance was evaluated and declined for lack of any excitation/inhibition evidence in SMARCA2. Validation: just validate PASS, just validate-terms PASS, programmatic snippet check 79 of 79 exact whitespace-normalised substrings with 0 mismatches, 0 dangling refs and 0 orphan nodes.

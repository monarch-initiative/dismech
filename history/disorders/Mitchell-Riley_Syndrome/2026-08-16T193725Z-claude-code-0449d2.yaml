  summary: 'Create: Mitchell-Riley Syndrome'
  details: |
    Created the Mitchell-Riley syndrome entry de novo for RFX6, MONDO:0017400 / OMIM:615710.

    Deep research: the falcon/Edison provider was unavailable, returning HTTP 402 from the Edison API, and the asta run returned off-topic retrieval results that were not used. The claude_code provider run was used and passed 'just preflight-dr' against MONDO:0017400 with verdict PASS: RFX6 was the top gene at 93 mentions, and the report OMIM 615710 matched the MONDO xref. One citation in that report, PMID:20040488, resolved to an unrelated planarian p53 study and was discarded. Every evidence item in the entry was verified against a fetched abstract rather than taken from the report text.

    Curated content: a 10-node pathograph spanning the two mechanistic arms - primitive-gut-tube endoderm patterning via the ParaHox genes PDX1 and CDX2, and NEUROG3-downstream islet plus enteroendocrine differentiation failure with its congenital GLP-1 deficiency branch. 15 phenotypes anchored on the HPO annotation set for OMIM:615710. Two subtypes covering classic neonatal onset versus the hypomorphic later childhood onset. Six treatments, including the liraglutide GLP-1-replacement target_mechanisms link and resection of heterotopic gastric mucosa. RFX6-MODY recorded as an allelic but distinct differential diagnosis. Two discussions: a KNOWLEDGE_GAP on the unresolved diarrhea mechanism and a HUMAN_MODEL_MISMATCH on the mouse enterochromaffin expansion.

    No GeneReviews chapter exists for this disease, so the HPO annotation set was used as the phenotype baseline instead.

    Validation: 'just validate-disorders' passed - batched schema, term, and reference validation with --no-full-text - reporting 86/86 snippets verified against cached references. Compliance 84.7 percent.

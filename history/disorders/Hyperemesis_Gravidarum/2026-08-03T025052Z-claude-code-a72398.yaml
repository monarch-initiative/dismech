  summary: 'Create: Hyperemesis Gravidarum'
  details: |
    New Disease entry for hyperemesis gravidarum [MONDO:0006791], curated for the obstetrics coverage gap in issue #7837. Models the canonical feto-placental GDF15 / brainstem GFRAL mechanism [Fejzo et al., Nature 2024, PMID:38092039] with maternal prepregnancy sensitivity as a distinct node, plus three non-canonical arms recorded as mechanistic_hypotheses: hCG thyrotropic ALTERNATIVE, H. pylori ALTERNATIVE, and psychogenic DEPRECATED. 11 pathophysiology nodes, 12 phenotypes, 4 susceptibility genes, 3 prevalence records, 7 treatments, 3 discussions. All 68 evidence snippets verified with just validate-references, 68/68. Two candidate references were discarded during verification: PMID:31548540 turned out to be an unrelated liver-imaging paper, and PMID:31515515 and PMID:38621783 cache without abstract text so no snippet could be verified from either. Schema, term and reference validation all pass.

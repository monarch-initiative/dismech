  summary: 'Genetics pass (wiring-002): per-transporter pathograph nodes and subtype
    gene bindings'
  details: |
    Genetics pass for issue #12191, and the largest structural change in the tranche. All six genes (SLC12A1, KCNJ1, CLCNKB, BSND, CLCNKA, MAGED2) were already curated in genetic:, but none reached the pathograph and none of the six has_subtypes rows carried a genes: descriptor. Two changes. First, bound each gene to its numbered subtype row, including both CLCNKA and CLCNKB on the digenic Type 4B row. Second, the entry had one flat convergence node (Impaired NaCl Reabsorption in Thick Ascending Limb) bundling the whole transcellular pathway, so four per-transporter trigger nodes were added, each wired to the step that gene occupies and each downstream to that convergence node: NKCC2 Apical Cotransport Failure (Type 1, SLC12A1, apical Na-K-2Cl entry), ROMK Potassium Recycling Failure (Type 2, KCNJ1, luminal K+ recycling that sustains NKCC2), ClC-Kb Basolateral Chloride Exit Failure (Type 3, CLCNKB, basolateral Cl- exit), and MAGED2-Dependent Cotransporter Trafficking Failure (Type 5, MAGED2, X-linked, transporter delivery rather than transporter function). The pre-existing ClC-K/Barttin node (Type 4) gained BSND, CLCNKA and CLCNKB. All evidence is exact-quoted from the already-cached review PMID:30519073; no new references were fetched. Three evidence_source values on newly added items were changed from OTHER to HUMAN_CLINICAL after check-snippet-grading found the same quoted sentence graded differently in the existing genetic: records. Validated: just validate (118/118 snippets), validate-terms, check-snippet-grading, and the offline gate set.

  summary: 'Create: 3-Methylglutaconic Aciduria Type I AUH MGA1'
  details: |
    WP-001 issue 5556 new-entry increment. Curated AUH-related 3-methylglutaconic aciduria type I MGA1, anchored MONDO:0009610, OMIM:250950. NEC preflight PASS: MONDO def, OMIM xref, and RO:0004003 all name AUH / HGNC:890. Six verified PMIDs with exact-quote snippets: 12434311 IJlst 2002 AJHG gene-disease, 12655555 Ly 2003 mutation spectrum, 16640564 Mack 2006 enzyme biochemistry IN_VITRO, 20855850 Wortmann 2010 adult leukoencephalopathy redefinition, 21840233 Mercimek-Mahmutoglu 2011 sibling heterogeneity, 23296368 Wortmann 2013 primary-vs-secondary classification. Three pathophysiology nodes; conforms to metabolic_intoxication_decompensation at the enzymatic-block and metabolite-accumulation nodes only. Acute decompensation and encephalopathy module nodes intentionally NOT applied because MGA1 is a slowly progressive leukoencephalopathy without acute catabolic crises. Added a KNOWLEDGE_GAP discussion on the unresolved metabolite-to-white-matter mechanism and poor genotype-phenotype correlation. Validated with just validate, just validate-references, a manual snippet substring check 24 of 24, and just validate-terms.

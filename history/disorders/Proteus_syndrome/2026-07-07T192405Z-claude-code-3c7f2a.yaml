  summary: Review remediation for issue 3592
  details: |
    Addressed the two-part curation review on issue #3592, keeping the entry as a
    single post-zygotic mosaic AKT1 p.E17K overgrowth disorder (no inheritance or
    PROS subtype series added, per the reviewer's disease-boundary guidance).

    1. Diagnosis section (blocking, review point 1): added four Diagnosis entries —
       (a) clinical diagnostic criteria (three general criteria plus clinical
       score, GeneReviews PMID:22876373); (b) mosaic AKT1 molecular testing on
       affected/lesional tissue, noting peripheral blood is frequently negative
       and a negative blood result does not exclude the diagnosis
       (DOI:10.1038/srep17162); (c) cardiothoracic/skeletal imaging for surveillance
       of pulmonary and thromboembolic complications (DOI:10.1038/s41598-021-86029-0);
       and (d) a differential-diagnosis entry pulling the existing
       differential_diagnoses (PROS/CLOVES, Klippel-Trenaunay, PTEN hamartoma/
       Proteus-like, NF1, isolated vascular malformations) into diagnostic context.
    2. Pathophysiology model/emerging labeling (review points 4/6): corrected
       evidence_source on model-based evidence that previously defaulted to
       HUMAN_CLINICAL — MODEL_ORGANISM for the mouse-chimera pAKT/non-cell-autonomous
       data (DOI:10.1093/hmg/ddz116) and IN_VITRO for the iPSC vascular-organoid
       preprint (DOI:10.1101/2024.01.26.577324, all occurrences) and the srep17162
       ARQ-092 cell assay. Added explicit "mouse-model" / "preprint organoid,
       emerging" framing to the three affected node descriptions, and added two
       HUMAN_MODEL_MISMATCH discussions (with proposed experiments) attaching to the
       non-cell-autonomous node and the two vascular-organoid nodes so they no longer
       read as equally established as the somatic AKT1 cause.
    3. Treatment standard-vs-investigational separation (review point 5): reframed
       miransertib/AKT inhibition as investigational, pathway-directed (not
       established disease-modifying standard) with therapeutic_modality; marked
       surgery as standard phenotype-directed care; added a standard
       multidisciplinary supportive/orthopedic management entry and a standard
       thromboembolism surveillance/prophylaxis entry (avoid procoagulants), both
       from GeneReviews.
    4. Surveillance/complication framing (review point 5): added descriptions to the
       DVT and PE phenotypes flagging them as leading morbidity/mortality drivers
       warranting surveillance and perioperative prophylaxis; imaging-diagnosis entry
       covers cardiopulmonary surveillance.
    5. Trials (review point 5): clarified the natural-history study (NCT00001403) as
       observational/non-therapeutic; the miransertib therapeutic trials and the
       expanded-access program remain distinctly labeled.

    Validation: schema and ontology-term validation pass; all new/reused snippets
    verified as exact whitespace-normalized substrings of their cached abstracts
    (validate-references reports "Total checks: 0", so snippets were checked
    manually).

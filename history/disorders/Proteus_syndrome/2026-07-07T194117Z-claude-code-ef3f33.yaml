  details: |
    Addressed the ai4c-agent CHANGES_REQUESTED review on PR #5717.

    Two IMPORTANT items (required):
    1. Added the missing high-frequency phenotype Pulmonary venous dilation
       (Cardiovascular, FREQUENT; HP:0030968 Abnormal pulmonary vein morphology,
       preferred_term "Pulmonary venous dilation"), the second most common
       cardiothoracic finding (62%) in the already-cited Mirmomen 2021 imaging
       cohort (DOI:10.1038/s41598-021-86029-0).
    2. Added a structured gene_term descriptor to the AKT1 genetic entry
       (hgnc:391) instead of leaving the HGNC id in free-text notes only.

    Suggestions addressed (from the same already-cited imaging cohort / survival
    paper, so no new sources introduced):
    - Added two further high-frequency imaging phenotypes: Band-like lung scarring
      (Respiratory, FREQUENT, 56%; HP:0002206 Pulmonary fibrosis) and
      Intramyocardial fat (Cardiovascular, FREQUENT, 45%; HP:0001637 Abnormal
      myocardium morphology).
    - Added a Premature mortality risk epidemiology entry quoting the Kaplan-Meier
      result (25% probability of death by 22 years of age; PMID:28661492),
      reinforcing the pediatric-surveillance framing.

    Suggestion intentionally not taken: sirolimus/rapamycin off-label mention. No
    PS-specific Phase II+ evidence exists and no clean exact-quote source was
    available, so per the reviewer's note that omission is acceptable it was left
    out rather than add weakly-sourced content.

    Validation: schema and ontology-term validation pass; the three new snippets
    verified as exact whitespace-normalized substrings of their cached abstracts.

  summary: 'Review round 1 on PR #12188: add the missing edema phenotype, narrow the
    endothelial cell binding'
  details: |
    Answers review 5254283281 in one push. The single blocking finding was correct: the PMID:8412642 sentence naming severe myalgia, skin tenderness, subcutaneous edema, altered liver function and pulmonary hypertension was already quoted four times in the file, and subcutaneous edema was the one item in it with no phenotype. Added as Edema bound to HP:0000969 rather than HP:0012398 Peripheral edema, because the source says subcutaneous, which is a tissue plane rather than a distribution, and the narrower term would assert a limb predominance the sentence does not carry. Also took the reviewer's blue suggestion to narrow the Vascular Endothelial Injury cell binding from CL:0000115 endothelial cell to CL:0002139 endothelial cell of vascular tree, which matches the descriptor's own preferred_term and was one level broader than the curator had written. Three blue suggestions were declined with reasons given on the PR. Two of the four claims the review listed as unconsumed from PMID:8412642 are in fact consumed: the 9 percent remission figure is the evidence snippet on progression[Early chronic phase], and non-necrotizing angiitis is inside the snippet supporting the Perivascular and Interstitial Inflammatory Infiltration node. Muscle cramps has no unqualified HPO term - the available ones are Exercise-induced and Cold-induced muscle cramps, and binding either would assert a trigger no source states - so it is left out, as psychologic disturbances is for being too unspecific to bind. The ORPHA:227972 mapping cannot be added as suggested: DiseaseMappings carries only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings, with no Orphanet slot, and just fetch-reference ORPHA:227972 returns no source in this checkout, so it could not be cited as a structured reference either. A diagnosis section remains a declared gap. Validation: just validate-disorders passes with 89/89 snippets verified; entity-refs, causal-targets, duplicate-keys, enum-values and qualifier-terms all clean.

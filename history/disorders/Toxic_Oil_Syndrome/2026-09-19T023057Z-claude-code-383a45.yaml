  summary: 'Create: Toxic Oil Syndrome (MONDO:0016421)'
  details: |
    New entry for the 1981 Spanish toxic oil syndrome epidemic. Deep research via the claude_code provider (the only one with credentials in this environment; falcon, asta, openscientist, perplexity and openai keys were all unset). Report validated retrospectively with just validate-research-reference (29 references checked, 28 resolved, 0 unresolved, 0 off topic) and just validate-research-terms (61 terms, 58 resolved, 0 unresolved, 2 obsolete and unused here). just preflight-dr returned SKIP because MONDO records no causal gene for a non-genetic disease; disease identity was checked manually against the report body instead. Every ontology CURIE was re-derived from a live OLS lookup at the point of writing and none taken from the report - which was the right call twice over: the report offered CL:0002548 as 'fibroblast of connective tissue' when it is fibroblast of cardiac tissue, and HP:0001880 is 'Increased total eosinophil count', not 'Eosinophilia' as memory suggested. Substantive curation decision: the report cites PMID:8285738 as evidence that TGF-beta and PDGF-AA drive the dermal fibrosis, and the paper found them in 0 percent of toxic oil syndrome skin specimens against 57 percent of eosinophilia-myalgia specimens, concluding the two diseases depend on different growth factors. That inversion is carried as a REFUTE item and the upstream edge to the fibrosis node uses INDIRECT_UNKNOWN_INTERMEDIATES because of it; the fibrosis_driver_unknown discussion records the gap. Four mechanistic_hypotheses are curated (direct toxic endothelial injury as CANONICAL, immune-mediated initiation as ALTERNATIVE, PAF-analogue signalling as EMERGING, and the minority rapeseed-oil-itself account), because the sources genuinely disagree on what initiates the lesion. Three discussions: the unidentified etiologic agent, the absence of any animal model (HUMAN_MODEL_MISMATCH, not KNOWLEDGE_GAP - evidence in animals exists and fails to reproduce the human lesion), and the unexplained cognitive deficit. A red-team review by a fresh-context subagent against dismech-pr-review returned 19 findings and all were applied. The ones worth recording: two self-contradictions I introduced mid-review (an evidence explanation referring to a reports_on link I had just deleted, and a notes paragraph counting six unwired phenotypes after I had added two more); five evidence-grading errors where the entry's own prose already stated the correct answer, including two items on MEDLINE-typed Review publications graded PRIMARY_RESULT; a mortality claim overstated in three places as pulmonary hypertension being 'raised' relative to the Spanish population when the cited sentence says only that it was not decreased, and the same abstract reports overall cohort mortality as lower than expected; both HLA records typed SUSCEPTIBILITY when the schema enum files HLA risk alleles under RISK_FACTOR and severity-only findings under MODIFIER; and a REFUTE item pointed at a claim the record it hung on did not make. The reviewer also found two rodent papers I had fetched and never read, which qualify the entry's absolute claim that no animal developed the disease - both are now curated as animal_models, and PMID:7779449 supplies the sharpest negative in the entry: intragastric PAP caused no toxicity in rats, though the human disease came from eating the oil. The phenotype-unwired note was rewritten to state the rule and point at just list-disconnected-phenotypes rather than enumerate, because the enumeration falsified itself within the hour. Every reference_title in the file is written programmatically from the cache frontmatter after I twice completed a truncated title from memory and the title gate caught it. Validation: just validate-disorders passes with 88/88 snippets verified; schema, terms, references, entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms (offline and --resolve), folded-hyphens, not4curation and case-collisions all clean. just check-genereviews returns NO_CHAPTER for both Bookshelf collections, which is what the entry notes claim. Phenotype connectivity is deliberately low at 9/21.

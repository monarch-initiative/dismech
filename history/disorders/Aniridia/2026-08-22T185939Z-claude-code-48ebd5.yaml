  summary: 'Create: Aniridia'
  details: |
    New entry for PAX6-related aniridia, previously absent from the KB despite Axenfeld-Rieger and Peters plus being curated. Six pathophysiology nodes modelling two arms from one haploinsufficient lesion: a fixed developmental arm through failed anterior segment and foveal differentiation, and a postnatally progressive arm through limbal stem cell deficiency to aniridia-associated keratopathy. Three nodes declare conformance to the new anterior_segment_dysgenesis module. Subtypes separate isolated aniridia from the contiguous 11p13 deletion WAGR form, with the Wilms tumour risk assigned to WT1 rather than PAX6. Phenotype frequencies are taken from a longitudinal cohort of 86 molecularly confirmed patients. Carries a Pax6-heterozygous mouse and a patient-derived iPSC corneal organoid, and a KNOWLEDGE_GAP on whether renal tumour surveillance can be stopped once an intragenic PAX6 variant is identified. Validated: linkml-validate clean, term validation passed, 35 of 35 snippets verified against cached references.

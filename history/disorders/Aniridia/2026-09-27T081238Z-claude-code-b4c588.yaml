  summary: 'Review round 1: reference_title, ELP4 explanation, WT1 edge strength'
  details: |
    Two blocking findings and one suggestion on PR 12990. The PMID:11087823 evidence item this PR added to the Aniridia 2 subtype row carried no reference_title; added, copied from the cache frontmatter. Note seven further items citing the same PMID pre-date this PR and are also untitled - they were left alone, since this round should not silently expand into pre-existing content, and which item the PR added was determined from the diff against origin/main rather than by position. Second, a ClinGen ELP4 explanation on that row read that the enhancer location is the basis for binding PAX6 rather than ELP4, while the row binds both genes and its review_notes explains why; reworded to say PAX6 is bound as the gene whose expression fails and ELP4 only as the host locus. Third, the edge from the WT1 node to Wilms Tumour was typed DIRECT; germline loss of one WT1 allele raises risk rather than producing the tumour, which needs a somatic second hit in a nephrogenic rest, and the cited sentence states the risk relation rather than the intervening steps. Retyped INDIRECT_UNKNOWN_INTERMEDIATES with the second hit stated in the description.

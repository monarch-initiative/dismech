  summary: 'Genetics pass: aniridia 1/2/3 subtype rows, TRIM44, WT1 pathograph node'
  details: |
    Genetics pass for issue #12270 (d2g series-063). Anchor check first: MONDO:0019172 aniridia is the class this entry models, and the checklist rows MONDO:0014937 (aniridia 2) and MONDO:0014938 (aniridia 3) are asserted children of MONDO:0007119 isolated aniridia, which is already a subtype row here. MONDO:0007119 has a third child, MONDO:0024507 aniridia 1, so the series was curated whole rather than to the checklist: three rows are added and declared through the Isolated aniridia row's children list. Aniridia 2 binds both PAX6 and ELP4, with a review_notes recording that they stand in different relations to the disease - ClinGen locates the lesion in PAX6 enhancer elements sitting inside ELP4 introns and states that ELP4 coding loss of function is not expected to cause eye disease, and the entry already records ELP4 structurally as the regulatory host locus. Aniridia 3 binds TRIM44 and a new genetic row is typed UNKNOWN rather than CAUSATIVE, because ClinGen grades that relationship Limited on a single pedigree and the schema reserves CAUSATIVE for Definitive or Strong. The TRIM44 mechanism is coding missense acting in trans on PAX6, not a cis-regulatory deletion. A new pathophysiology node, WT1 Haploinsufficiency in the Contiguous 11p13 Deletion, wires WT1 into the pathograph and connects the previously unexplained Wilms Tumour phenotype; gene outlink moves from 1/3 to 2/3 and phenotype inlink from 1/13 to 2/13. The PAX6 downstream regulatory region row deliberately carries no gene_term, so it cannot be matched by the wiring metric. Three evidence items quoting PMID:33300417 gained quote_role BACKGROUND: the quoted sentences are that report's framing of WAGR, while its own proband carried an isolated PAX6 nonsense variant. The WAGR GeneReviews chapter PMID:41818601 was cited and tagged. All 66 snippets verify.

  summary: Split the bundled glaucoma treatment and bind therapeutic agents
  details: |
    PR review finding 5. The single treatment 'Intraocular Pressure Control and Glaucoma Surgery' declared therapeutic_modality SMALL_MOLECULE while its description covered angle surgery and drainage devices, and used generic NCIT:C15986 Pharmacotherapy with no therapeutic_agent - the only such case in this PR. Split into a SMALL_MOLECULE arm bound to latanoprost and timolol, and a SURGERY arm bound to NCIT:C15331, each with its own target_mechanisms link and evidence. A first attempt bound a guessed CHEBI anti-glaucoma class term which turned out to be yohimban; caught by checking the label before committing.

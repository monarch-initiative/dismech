  summary: Review remediation for issue 3578
  details: |
    Addressed the two-part curation review on issue #3578, keeping scope to
    classic autosomal dominant FTL neuroferritinopathy (FTH1-related disease
    deliberately excluded).

    1. GeneReviews baseline (review point 1): added the standalone GeneReviews
       chapter (PMID:20301320, Chinnery, last updated 2022) as evidence on the
       inheritance, disease-course, orofacial-dystonia, diagnosis, and treatment
       claims, and tagged it as a top-level GeneReviews reference via
       scripts/tag_references.py.
    2. Diagnosis expansion (review point 2): added a clinical-and-family-history
       assessment entry (adult-onset progressive movement disorder plus AD family
       history; diagnosis established by clinical findings and/or FTL variant);
       enriched Brain MRI with T2*/SWI signal loss in globus pallidus/putamen and
       progressive putaminal/pallidal/caudate cavitation plus cerebellar atrophy
       (PMID:26142024).
    3. Serum ferritin (review point 3): clarified in the biochemical note that low
       serum ferritin is a supportive diagnostic clue only, a biomarker of the
       ferritin defect and not a cause of basal-ganglia disease. It remained a
       biochemical/diagnostic node, not a pathophysiology causal node.
    4. Pathophysiology bridge (review point 4): inserted a
       "Mutant ferritin co-assembly and inclusion body formation" node
       (dominant-negative co-assembly into 24-mers with disrupted 4-fold pores,
       attenuated iron incorporation, ferritin aggregation into inclusion bodies)
       as the tissue-level bridge from the FTL variant to abnormal cellular iron
       handling, and rewired the upstream edge accordingly (PMID:23908629).
    5. Disease course (review point 5): encoded focal/asymmetric adult onset
       (mean ~40y) generalizing over ~20 years with persistent asymmetry on the
       basal-ganglia-neurodegeneration node, and the orofacial speech dystonia /
       dysarthrophonia detail on the craniofacial-dystonia phenotype
       (PMID:20301320).
    6. Treatment scope (review point 6): framed symptomatic pharmacotherapy and
       physical therapy as standard care (GeneReviews-enumerated agents; botulinum
       toxin; avoid-iron-supplements note), and firmly reframed iron chelation as
       investigational/anecdotal with no established clinical benefit and not part
       of standard care.
    7. Differentials (review point 2): added Wilson disease, aceruloplasminemia,
       and PKAN with distinguishing_features alongside the existing Huntington
       disease.

    Validation: schema validation, ontology-term validation, and manual
    whitespace-normalized snippet-substring checks against the cached abstracts
    all pass. (validate-references reported "Total checks: 0", so snippets were
    verified manually.)

  summary: Wire FCAS to nlrp3_inflammasome_activation module
  details: |
    Wired two conforms_to edges onto existing Familial Cold Autoinflammatory Syndrome pathophysiology nodes against the new nlrp3_inflammasome_activation module. No new nodes, evidence, ontology terms, or prose were added.

    Constitutive NLRP3 inflammasome activation conforms to the module's central_effector, NLRP3 Inflammasome Assembly and Caspase-1 Activation. The FCAS node already carries GO:0044546 NLRP3 inflammasome complex assembly with modifier INCREASED and describes ASC and pro-caspase-1 recruitment; caspase-1 activation itself is completed by the entry's immediate downstream node, so the module node's requirement of an assembled, caspase-1-activating complex in the causal chain is met.

    Caspase-1 activation and IL-1beta overproduction conforms to the module's effector node, IL-1 Family Cytokine Maturation and Gasdermin D-Mediated Pyroptosis. This is an unusually exact match: the FCAS node already carries GO:0032611 interleukin-1 beta production and GO:0070269 pyroptotic inflammatory response, both INCREASED, and its description names gasdermin-D-dependent pyroptosis explicitly.

    The important negative: FCAS is deliberately NOT wired to the module's Activating Danger Signal node. The mutant sensor assembles with reduced or absent requirement for a second signal, so attaching a gain-of-function variant at the amplifier would assert the opposite of what the lesion does. This rule is now written into the module notes so a later curator does not add it.

    Validation: linkml-validate passed on the changed file, just validate-terms passed, and just count-verified-snippets was clean.

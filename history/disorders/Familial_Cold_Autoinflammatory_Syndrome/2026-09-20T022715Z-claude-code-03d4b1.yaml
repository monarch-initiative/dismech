  summary: 'Genetics pass: subtype gene bindings, NLRP12 evidence'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12196, epic #12189).

    Research first: GeneReviews baseline checked against the committed Bookshelf
    index (cache/bookshelf/genereviews.csv, snapshot 2026-09-10) - no GeneReviews
    chapter exists for FCAS or for the cryopyrin-associated periodic syndromes.
    The ClinGen gene-disease validity table committed in this repository
    (cache/clingen/gene_validity.csv) contains no row for NLRP3, NLRP12, PLCG2 or
    NLRP1, so no ClinGen classification is citable for any of them.

    Wiring. All four has_subtypes rows (FCAS1, FCAS2, FCAS3, NAIAD) now carry a
    genes list bound to lowercase hgnc CURIEs. The "Constitutive NLRP3
    inflammasome activation" node, the only mutation-proximal node with no gene,
    now binds NLRP3; the four lesion nodes already used the singular gene slot and
    were left as they were. Each genetic record gained relationship_type CAUSATIVE
    and variant_origin GERMLINE.

    New evidence. NLRP12 (FCAS2) was the one relationship worth re-examining. Two
    sources were added: a 17-patient paediatric NLRP12-AID series (PMID:37877365,
    described by its authors as one of the largest such cohorts), where a cold
    trigger was present in only three patients, and a 2025 systematic review of the
    whole reported NLRP12 literature (PMID:40556386), which assigns 49 of 60
    reported coding variants to a combined VUS/pathogenic/likely-pathogenic group
    and reports incomplete penetrance. The review's sentence does not separate
    those categories, so no VUS share is claimed in the entry. The FCAS2 subtype description and
    the NLRP12 genetic notes now record that "FCAS2" names a minority presentation
    of NLRP12-associated autoinflammatory disease rather than its usual form. The
    gene-disease relationship itself is not disputed, so relationship_type stays
    CAUSATIVE, with the caveats in notes and evidence.

    MONDO reconciliation: all four MONDO-recorded genes (NLRP1 hgnc:14374, NLRP3
    hgnc:16400, NLRP12 hgnc:22938, PLCG2 hgnc:9066) were already present in the
    genetic block and are now also bound at the subtype that carries each MONDO
    term. No disagreement with MONDO on this entry.

    Validation: just validate, validate-terms, count-verified-snippets (53/53),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-genereviews,
    list-gene-term-mismatches, and the batched just validate-disorders.

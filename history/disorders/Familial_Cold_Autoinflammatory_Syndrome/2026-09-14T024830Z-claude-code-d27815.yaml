  summary: 'Fix: FCAS4 subtype MONDO mis-binding (NLRC4 term on an NLRP1 disease)'
  details: |
    Corrected a MONDO mis-binding on the fourth has_subtypes entry of Familial Cold
    Autoinflammatory Syndrome.

    The defect. The subtype was keyed FCAS4, displayed as "FCAS4 (NLRP1)", and bound to
    MONDO:0014498 with preferred_term "familial cold autoinflammatory syndrome 4". Its own
    description, its cited evidence (PMID:27965258), its downstream pathophysiology node and
    its genetic entry all describe NLRP1 and NAIAD. MONDO:0014498 is a different disease:
    inspected with `runoak -i sqlite:obo:mondo info MONDO:0014498 -O obo`, it is "familial
    cold autoinflammatory syndrome 4", its causal gene under RO:0004003 is NLRC4
    (HGNC:16412), its OMIM cross-reference is 616115, and it carries the exact synonym "NLRC4
    familial cold autoinflammatory syndrome". So the entry was asserting an NLRC4 identity for
    an NLRP1 disease. IUIS 2022 Table 7 draws the same line: it has a "Familial cold
    autoinflammatory syndrome 4 NLRC4 AD GOF 616115" row in its inflammasome section, and
    separate "NLRP1 deficiency NLRP1 AR 617388" and "NLRP1 GOF NLRP1 AD GOF 615225" rows.

    The fix. The binding was moved to MONDO:0060457 "autoinflammation with arthritis and
    dyskeratosis" (AIADK), verified the same way: causal gene NLRP1 (HGNC:14374), OMIM
    cross-reference 617388, synonym AIADK. That OMIM record is the one the IUIS recessive
    NLRP1 row carries, and the subtype's description is a recessive-and-dominant NLRP1
    inflammasomopathy, so the recessive AIADK class is the correct target. preferred_term was
    changed to "NLRP1-associated autoinflammation with arthritis and dyskeratosis" and
    display_name to "NAIAD / AIADK (NLRP1)".

    Foreign keys. The subtype `name` is the foreign-key target for `subtype:` references
    elsewhere in the file, so leaving it as FCAS4 would have kept an incorrect designation in
    the key everything matches on. It was renamed to NAIAD and both internal references were
    repointed: the `subtypes:` list on the "NLRP1 inflammasome activation" pathophysiology node
    and the `subtype:` field on the NLRP1 genetic entry. A repository-wide grep confirmed
    FCAS4 appears nowhere else as a key -- the only other mention is inside an append-only
    history record from 2026-08-28, which is the record of the session that introduced the
    mis-binding and was correctly left untouched. `just check-entity-refs` and the
    `test_subtype_foreign_keys` / `test_entity_reference_file` pytest lanes (3124 tests) pass.

    Collateral prose. Three statements that repeated the conflation were corrected: the
    top-level description sentence that read "NLRP1 (FCAS4)", and two explanation strings
    reading "FCAS4/NAIAD". The description now says plainly that the FCAS4 designation belongs
    to an NLRC4 disorder this entry does not curate.

    Record. The correction is written into the subtype's review_notes so it is visible on the
    rendered page and not only in this history record. One IUIS evidence item quoting the
    recessive NLRP1 row was added to the subtype to ground the new binding. No REFUTE evidence
    item was added for the old binding, since the entry no longer makes that claim and a
    superseded assertion belongs in history rather than in an evidence block.

    Validation: linkml-validate, just validate-terms, just count-verified-snippets, just
    check-entity-refs, just check-duplicate-keys and the batched just validate-disorders all
    pass. MONDO:0060457 was added to cache/mondo/terms.csv and the
    diseaseorsubtypeterm enum cache by the validator, not by hand.

  summary: 'Create: Colchicine Poisoning'
  details: |
    New entry for colchicine poisoning (MONDO:0017859), curated as a two-clock
    toxicology entry: one molecular lesion (colchicine-tubulin binding, which blocks
    microtubule assembly) branching into a fast mitotic-arrest arm that kills, and a
    slow transport-failure arm that produces the therapeutic-dose neuromyopathy.

    Pathograph: 12 pathophysiology nodes, fully connected apart from the
    CYP3A4/P-glycoprotein clearance node, which is an intentional modifier entry
    point. Six conforms_to declarations across two modules - the complete
    myelosuppression chain (cytotoxic insult to progenitors, marrow suppression,
    multilineage cytopenias, cytopenia-related complications) and two nodes of
    peripheral_axonal_degeneration (axonal transport impairment, distal axonal
    degeneration). Both peripheral_axonal_degeneration conformances carry notes
    recording that they are partial: the module nodes name mitochondrial dysfunction
    and axonal/demyelinating fibre pathology, and the human sources cited here
    establish neither. A hepatorenal feedback edge closes a loop back onto the
    exposure node, since hepatic clearance carries most of the drug's elimination.

    Evidence: 84 evidence items over 10 references, all fetched with
    just fetch-reference, and every snippet pre-verified against the local cache
    before the YAML was written. Anchors are two systematic reviews (PMID:20586571,
    clinical toxicology review; PMID:36512928, systematic review of 143 neuromyopathy
    cases), a full-text management review carrying a 20-case series (PMID:36028733),
    and individual case reports for the marrow and G-CSF claims.

    Frequency discipline: FREQUENT is asserted only for the three gastrointestinal
    symptoms, and each explanation names the denominator (14 of 20 published adult
    case reports) and states that the series skews towards severe poisoning. No band
    is asserted for any cytopenia or organ-failure phenotype, because publication
    bias inflates exactly those figures.

    Claims deliberately not made: no bacterial-translocation claim on the neutropenic
    sepsis edge (blood cultures were positive in 5 of 20 patients but the route of
    entry was not established); no mitochondrial claim on the transport arm; Fab
    fragments and extracorporeal drug removal are recorded in notes as not curated,
    with the volume-of-distribution figure justifying the latter carried as a cited
    snippet rather than as bare prose.

    Deep research: just research-disorder claude_code produced a 95 KB report,
    59/59 references resolved, 0 unresolved, 0 off topic. NEC preflight returned SKIP
    (MONDO records no causal gene for a poisoning) and was cleared manually - CYP3A4
    and ABCB1 dominate the report's gene mentions, and those are colchicine's own
    metabolism and efflux genes. The report was used as leads only; zero snippets
    were taken from it. It did surface two genuine gaps in the draft, the cardiac
    branch and the hepatorenal feedback loop, and both were verified independently
    against papers already in the cache before being added.

    Validation: just validate-disorders (the batched sweep CI runs) passed; 84/84
    snippets verified; check-duplicate-keys, check-folded-hyphens,
    check-title-snippets, check-entity-refs, check-causal-targets and
    check-environmental-evidence all clean. Every reference_title was generated
    programmatically from the cache files, never typed.
    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED) raised two blocking
    omissions, both closable from references already cached. Both were correct.
    A diagnosis: section was added (exposure-history-plus-toxidrome recognition,
    the separate problem of recognising the chronic neuromyopathy, and MRI for
    biopsy targeting carrying its source's own hedge), plus a histopathology:
    entry for the vacuolar myopathy. A second environmental: entry was added for
    the plant-ingestion route (Colchicum autumnale, Gloriosa superba), bound to
    ECTO:9000271 exposure to alkaloid rather than ECTO:0000509 exposure to drug.

    The reviewer's second finding also exposed a hole in this entry's own
    reasoning: the original ECTO note rejected exposure to alkaloid on the grounds
    that the poisoning is medicinal, a scoping premise the entry never declared
    and that the plant route falsifies. That note was rewritten rather than
    patched around.

    Following the plant route into the literature added PMID:30888889, a
    297-patient Gloriosa superba cohort with a 10 percent case fatality. That
    figure is a population rate and is explicitly not comparable with the 14 to
    26 percent quoted elsewhere in the entry, which comes from published tablet-
    overdose case reports; the explanation says so. The same paper reports that
    plant ingestion caused only mild acute kidney injury and rhabdomyolysis, so
    both of those phenotypes now carry a route-dependence qualifier instead of
    implying a single severity. Its concentration-versus-outcome finding was also
    added to the exposure node, which previously rested only on the absence of a
    dose boundary.

    Non-blocking items also taken: P-glycoprotein efflux bound to GO:0042908 on
    the clearance node, the statin-myopathy interaction sentence added, and
    gastric lavage recorded in the charcoal treatment as a narrow adjunct rather
    than curated as a separate treatment.

    Review round 2 (ai4c-reviewer, CHANGES_REQUESTED) found one defect introduced
    by the round-1 fix: the plant-route notes: still said the sources gave no
    case-fatality figure for that route and that none was asserted, three lines
    below the evidence item quoting 10 percent (29/297) from PMID:30888889. The
    note was written before that paper was pulled in and was never revisited. It
    now states the figure and marks it as a population rate from one country's
    self-poisoning presentations rather than a case fatality for plant ingestion
    generally. The trigger node's "the two routes" phrasing was also updated, since
    the description now names three.

    Swept the rest of the entry for the same failure mode - prose that was true
    when written and falsified by later evidence. Every remaining negative claim
    about the sources was re-checked against its block, and every phenotype was
    cross-checked so that no frequency band coexists with an explanation saying
    none is asserted. None found.

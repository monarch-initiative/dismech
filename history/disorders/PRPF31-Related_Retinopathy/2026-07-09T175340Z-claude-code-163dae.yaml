  summary: 'Create: PRPF31-Related Retinopathy (RP11, MONDO:0800395)'
  details: |
    Fresh curation of PRPF31-related retinopathy (RP11, MONDO:0800395) for issue #4008. Modeled the two-part disease mechanism: (1) PRPF31 haploinsufficiency disrupting U4/U6.U5 tri-snRNP assembly and photoreceptor pre-mRNA splicing (notably RHO intron 3), converging on Rod Photoreceptor Apoptosis (conforms_to photoreceptor_degeneration module); (2) the well-characterized CNOT3 trans-acting modifier mechanism explaining RP11's unusually well-documented incomplete penetrance, modeled as a separate pathophysiology node plus a MODIFIER genetic relationship on CNOT3. Added a per-gene case_fractions entry (6% of US adRP cases). Added a KNOWLEDGE_GAP discussion on the open photoreceptor-vs-RPE primary-site question. All 7 PMIDs (11545739, 15659613, 18431455, 23144630, 26853529, 32014492, 35974011) independently sourced via WebSearch/WebFetch, verified for title match, and fetched into references_cache via just fetch-reference. All 18 evidence snippets confirmed as exact substrings of cached abstracts via manual whitespace-normalized script check. NEC preflight passed: gene (PRPF31/hgnc:15446) and OMIM (600138, on child term MONDO:0010828) both confirmed consistent with the MONDO record. Schema, term, and reference validation all pass.

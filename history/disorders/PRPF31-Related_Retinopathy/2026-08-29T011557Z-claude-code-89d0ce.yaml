  details: |
    # Fix summary: PRPF31-Related Retinopathy

    ## Findings fixed

    1. **MINOR — splicing-burden postulate stated as fact** (review finding 1).
       - `pathophysiology` "Impaired Pre-mRNA Splicing of Photoreceptor Genes" description:
         reworded "with an unusually high burden of pre-mRNA splicing to sustain
         phototransduction-gene expression" to "it has been postulated -- though the
         supporting evidence is inconsistent -- that they carry a correspondingly high
         pre-mRNA splicing burden ...", matching PMID:32014492's hedge ("evidence to
         support this hypothesis is inconsistent").
       - Top-level `description`: removed "preferentially ... highly-expressed" ("preferentially
         disrupting splicing of highly-expressed photoreceptor transcripts" → "disrupting
         splicing of photoreceptor transcripts"), which carried the same unsupported
         preferential-demand claim. The RHO-splicing link itself is retained (it is sourced).

    2. **MINOR — yeast-homology inference graded HUMAN_CLINICAL** (review finding 2).
       `pathophysiology` "PRPF31 Haploinsufficiency ..." PMID:11545739 item regraded
       HUMAN_CLINICAL → COMPUTATIONAL (the quoted sentence is a sequence-homology
       inference). Different sentence from the same PMID's HUMAN_CLINICAL mutation-report
       quote in the genetic section, so no grading conflict.

    3. **MINOR — composite CNOT3 quote spanning methods** (review finding 3).
       Split the PMID:23144630 composite quote on the "CNOT3-Mediated Modulation" node into
       two per-method items: an IN_VITRO item ("CNOT3 directly binds to a specific PRPF31
       promoter sequence" — the ChIP binding experiment) and a HUMAN_CLINICAL item (the NGS
       + study-level conclusion sentence). Both are exact contiguous substrings of the
       original verified quote. The conclusion sentence matches the genetic-section
       HUMAN_CLINICAL grading, so no divergence.

    4. **MINOR — in-vitro-only support for clinically-worded rod-apoptosis node** (review
       finding 4). Added a HUMAN_CLINICAL evidence item (PMID:30582903, already cached:
       "Only 6 patients had a non-recordable cone response ... rod function deteriorates
       before cone function") to the "Rod Photoreceptor Apoptosis" node, grounding its
       "progressive rod loss with secondary cone involvement / classic RP phenotype"
       clinical clause in human data rather than the IN_VITRO Yuan 2005 experiment alone.
       Also fixed the related wording drift on the upstream node: "Reduced PRPF31
       availability significantly inhibits splicing of intron 3 in the RHO gene" →
       "Experimentally, mutant PRPF31 significantly inhibits splicing of intron 3 ...",
       matching what PMID:15659613 actually tested (mutant protein expression).

    ## Findings intentionally skipped

    - None of the four review findings were skipped; all were clear low-risk fixes.
    - Non-flagged items (lowercase hgnc CURIEs, narrowMatch bookkeeping, FREQUENT band for
      spicular pigmentation) — review explicitly called these "conservative, not wrong". No
      change.

    ## New/changed references

    - No new references fetched (PMID:30582903 was already cached). Split one existing
      PMID:23144630 evidence item into two; regraded one PMID:11545739 item.


    # Review: PRPF31-Related Retinopathy

    - File: /home/user/dismech/kb/disorders/PRPF31-Related_Retinopathy.yaml
    - Review date: 2026-08-28
    - Mechanical audit: **18/18 snippets verified** against cached references (reference_snippet_audit)

    ## Verdict: MINOR_ISSUES

    All snippets are verbatim, every reference resolves in the cache, and the core mechanistic story
    (haploinsufficiency; missense insolubility with minor direct negative effect; CNOT3 as the
    trans-acting penetrance modifier; RHO intron-3 splicing inhibition; rod-before-cone
    deterioration) is faithfully sourced. Numeric claims were re-checked against the full-text
    caches and are correct: onset 8–12 y (nonsense/frameshift/indel) vs ~27 y (missense/in-frame),
    diagnosis at 20–30 y for truncating variants, 6% US case fraction with the 6–11.1% cross-cohort
    range, bone-spicule pigment in all affected individuals, 21 patients with no detectable rod
    b-wave / only 6 with non-recordable cone response. The genotype–phenotype, non-penetrance, and
    RPE-vs-photoreceptor knowledge-gap content matches the sources closely. Findings below are
    calibration-level, none rises to MAJOR.

    ## Findings

    1. **MINOR — hypothesis stated as fact** | pathophysiology → "Impaired Pre-mRNA Splicing of
       Photoreceptor Genes" (description; also echoed in the top-level `description`:
       "preferentially disrupting splicing of highly-expressed photoreceptor transcripts"). The node
       states photoreceptors carry "an unusually high burden of pre-mRNA splicing to sustain
       phototransduction-gene expression." The cited review (PMID:32014492) is explicitly more
       cautious: "It has been postulated that photoreceptor cells have a greater demand for pre-mRNA
       splicing factors to meet this metabolic demand, **but evidence to support this hypothesis is
       inconsistent**" (some studies report retina-enriched PRPF31 expression, others none). The
       entry does carry the RPE-vs-photoreceptor KNOWLEDGE_GAP discussion, but the node description
       asserts the splicing-demand postulate more strongly than the source does.

    2. **MINOR — evidence_source** | pathophysiology → "PRPF31 Haploinsufficiency and Tri-snRNP
       Assembly Defect" → PMID:11545739 (`evidence_source: HUMAN_CLINICAL`). The quoted sentence —
       "The level of sequence identity to the yeast PRP31 gene indicates that PRPF31 is also likely
       to be involved in pre-mRNA splicing" — is a bioinformatic/homology inference, i.e.
       COMPUTATIONAL evidence for the splicing-factor claim it is attached to. The paper as a whole
       is human genetics (linkage + mutation identification in RP11 families), and its second use in
       the `genetic` section (the mutation-report sentence) is correctly HUMAN_CLINICAL; per the
       repo's split-by-sentence rule, this particular quoted inference is not human clinical data.

    3. **MINOR — evidence_source (mixed-content quote)** | pathophysiology → "CNOT3-Mediated
       Modulation of Wild-Type PRPF31 Expression" and genetic → CNOT3 → PMID:23144630
       (`evidence_source: HUMAN_CLINICAL`). The quoted passage's leading clause — "CNOT3 directly
       binds to a specific PRPF31 promoter sequence" — reports a chromatin-immunoprecipitation /
       cell-based binding experiment (in vitro), fused with human NGS and the study-level conclusion.
       The same paper's other quote ("In asymptomatic carriers CNOT3 is expressed at low levels...",
       measured in patient-derived lymphoblastoid lines) is graded IN_VITRO, so the file itself
       recognizes the paper mixes sources. HUMAN_CLINICAL is defensible for the
       family-segregation-based conclusion sentence, but the composite quote straddles the boundary;
       consider splitting per the "one evidence_source per item" rule. Not a check-snippet-grading
       violation (different sentences).

    4. **MINOR — in-vitro-only support for a clinically-worded mechanism node** | pathophysiology →
       "Rod Photoreceptor Apoptosis" → PMID:15659613 (IN_VITRO, sole evidence on the node). The
       quoted experiment (mutant PRPF31 expression in primary retinal cell cultures reduces rhodopsin
       and causes apoptosis) supports the apoptosis mechanism, but the node description extends to
       "producing progressive rod photoreceptor loss with secondary cone involvement and the classic
       retinitis pigmentosa clinical phenotype" — a human-clinical claim not supported by the node's
       own evidence. The human rod-cone data live on the phenotype items (PMID:30582903), so the KB
       as a whole is covered; adding that human citation to this node (or trimming the clinical
       clause) would close the gap. Related wording drift: the upstream node says "Reduced PRPF31
       availability significantly inhibits splicing of intron 3 in the RHO gene," whereas the cited
       experiment tested *mutant PRPF31 protein* expression, not titrated reduction of wild-type
       availability — the haploinsufficiency framing comes from PMID:18431455 and is fairly bridged,
       but the sentence attributes Yuan 2005's result to a slightly different perturbation than was
       performed.


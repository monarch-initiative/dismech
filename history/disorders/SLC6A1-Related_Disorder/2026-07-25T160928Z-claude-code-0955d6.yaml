  details: |
    De-novo curation via claude_code deep research; every PMID/snippet verified as an exact substring of the cached abstract (GeneReviews PMID:36780407, Carvill 2015 PMID:25865495, Mermer 2021 PMID:34028503, Bain 2022 PMID:35761184). GAT-1 GABA-reuptake mechanism modeled as four separate low-bundling pathophysiology nodes (variant/GAT-1 loss of function -> impaired GABA reuptake/homeostasis -> thalamocortical E/I imbalance and generalized seizures [conforms_to epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony] -> impaired GABAergic signaling in neurodevelopment). Gene-anchored to SLC6A1 (hgnc:11042), MONDO:0014633 (=OMIM:616421, SLC6A1). Distinct from the phenotype-level Epilepsy_with_Myoclonic_Atonic_Seizures (Doose) entry. Two discussions: HUMAN_MODEL_MISMATCH (iPSC GAT-1 rescue translation) and OPEN_QUESTION (haploinsufficiency vs dominant-negative).

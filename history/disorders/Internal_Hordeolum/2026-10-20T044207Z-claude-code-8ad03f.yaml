  details: |
    Addressed the CHANGES_REQUESTED review on PR 14885. Split the bundled 'Chalazion or Eyelid Cellulitis Extension' node into 'Chalazion Formation' (PMID:28068454, PMID:28181687) and 'Preseptal Eyelid Cellulitis' (PMID:28181687, PMID:34607790). Added upstream 'Meibomian Gland Dysfunction and Chronic Blepharitis' (PMID:34379160, PMID:28068454 background, PMID:6218459, which was previously cached but uncited) and 'Meibomian Gland Orifice Obstruction' (PMID:28181687) nodes ahead of seeding; removed the neutrophil cell type from the seeding node. Added Eyelid Pain (HP:0034808), Eyelid Erythema (HP:0040323) and Eyelid Swelling (HP:0100540 Palpebral edema) phenotypes, looked up in OLS, wired from the suppuration node. Sourced the systemic-antibiotic stratification from PMID:28068454 and added the Cochrane no-trials gap to the antibiotic row; marked both PMID:42367702 items quote_role BACKGROUND. Epidemiology now quotes the 56.2 per 100,000 person-year rate and the K208 code covering external or internal hordeolum. Added a progression block. Removed the entry-level notes, which recorded curation process: the Falcon deep-research request fell back to OpenScientist with all 28 references resolving; the report's PMID:6218459 quote fragment and its UBERON/NCIT leads were not used; preflight-dr skipped gene identity checks because MONDO:0004917 records no causal gene. Corrected the actor name in the 2026-09-29 history record to codex to match its agent_tool. Skipped the optional tirzepatide environmental trigger (needs new research) and therapeutic_agent (no specific agent sourced).

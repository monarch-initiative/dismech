  summary: 'Create: Autosomal Dominant Nebulin-Related Myopathy (NEB)'
  details: |
    New entry for autosomal dominant nebulin-related myopathy (MONDO:1010152) from one OpenScientist deep-research report (research/Autosomal_Dominant_Nebulin-Related_Myopathy-deep-research-openscientist.md; 26/26 citations resolved, preflight-dr PASS). Claims were re-sourced from Sagath 2025 (PMID:40517164, PMC full text), Kiiski 2019 (PMID:30679003) and Kiiski 2021 (PMID:33933294) abstracts, and the ClinGen Moderate assertion. Report content drawn from recessive NEB nemaline myopathy or knockout models (hypotonia, feeding and respiratory involvement, thin-filament length, calcium sensitivity, super-relaxed state) was not carried over. Kept separate from the NEM2 subtype of Nemaline_Myopathy following ClinGen's lump/split call. A somatic-mosaicism block sits beside the dominant block for the two mosaic families. relationship_type is unset because ClinGen rates the pair Moderate. Validated with just validate (34 snippets), count-verified-snippets and the whole-repo offline gates.

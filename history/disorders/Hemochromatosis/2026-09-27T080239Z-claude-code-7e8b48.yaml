  summary: Add hemochromatosis types 4 and 5 with SLC40A1 and FTH1
  details: |
    Genetics pass for issue #12273 (d2g series-066). The entry carried types 1, 2A, 2B and 3 as bound has_subtypes rows and named SLC40A1 in its description without binding it anywhere. Types 4 (SLC40A1, MONDO:0011631) and 5 (FTH1, MONDO:0014225) were added with subtype_term, genes, HPO inheritance terms and evidence, plus genetic entries scoped to those rows by subtype foreign key. Two pathophysiology nodes were added: hepcidin-resistant ferroportin from SLC40A1 gain of function, and impaired ferritin H-subunit ferroxidase activity from the FTH1 iron-responsive-element variant. Both reach Systemic Iron Overload without passing through the hepcidin nodes, so that node's description was amended to say it is a convergence point rather than a hepcidin-only step, and a top-level autosomal dominant inheritance block was added because the entry previously recorded only autosomal recessive while its own BMP6 row was dominant. The pre-existing ferroportin-disease differential-diagnosis row attributed ferroportin disease to gain-of-function SLC40A1 variants; ferroportin disease is the loss-of-function class, and the row was corrected and cross-referenced to the new Type 4 subtype. A subtype-scoped phenotype and biochemical row record the features specific to the loss-of-function class. Validated with just validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, list-gene-term-mismatches --resolve and validate-disorders.

  details: |
    Backfilled reference_title on all 36 previously untitled inline evidence items across prevalence, epidemiology, pathophysiology, phenotypes, and treatments, plus the ORPHA structured-database record. Titles read verbatim from references_cache frontmatter. Re-ran just validate-references which pulled OpenAlex full text for PMID:30348195 and PMID:34530847 and verified all snippets remain exact substrings. Mined the PMID:34530847 full text and added three well-supported findings: an antibody-dependent cellular cytotoxicity complement-independent effector arm on the AQP4 endocytosis node with GO:0001788 and a verified snippet; eosinophil degranulation cytotoxic proteins ECP EDN EPX MBP on the granulocyte node; and a new High-Dose Corticosteroids acute-attack treatment IV methylprednisolone NCIT:C647 with target mechanism. Added a top-level reference finding recording that MS immunotherapies are ineffective or harmful in NMOSD. Schema, term, and reference validation all pass. Reverted unrelated repo-wide reference_id requoting churn keeping only this disease reference caches.

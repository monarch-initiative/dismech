  summary: 'Weekly compliance: classification + treatment mechanism evidence'
  details: |
    Weekly compliance pass focused on disease classification for immune-mediated disorders. Added a classifications block with Harrison's Parts NEUROLOGIC and IMMUNE_RHEUMATOLOGIC, both cited to the IPND consensus criteria PMID:26092914 with distinct exact-quote snippets: the inflammatory CNS syndrome sentence for the neurologic Part and the AQP4-IgG association clause for the immune Part. Added evidence to four of seven previously unevidenced treatment target_mechanisms links, citing PMID:33741809, which names the molecular target of eculizumab, inebilizumab, and satralizumab in one sentence. One of the four is marked PARTIAL because the abstract states the drug's molecular target rather than the downstream astrocyte-injury reduction claimed by that link. Investigated binding ontology terms to the unbound 2015 IPND criteria items and did not add any: HPO has no non-obsolete term for narcolepsy, no term for acute brainstem syndrome, and no transverse myelitis term beyond the already-used HP:0012486 Myelitis, and the imaging and laboratory criteria are findings rather than procedures so a generic NCIT MRI or assay term would be a wrong binding rather than a broad one. Validated with just validate, just validate-terms, and just count-verified-snippets with 55/55 snippets verified. Weighted compliance rose from 80.6 percent to 83.9 percent.

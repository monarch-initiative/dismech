  summary: 'Review round 1: address ai4c-reviewer CHANGES_REQUESTED'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #15574 in one
    bundled push, on top of the coordinator's gene-activity grounding fix
    (GO:0004314 on the MCAT node) and merge of origin/main, both kept.

    Blocking items fixed, each verified against the cached sources:
    1. Added reference_title to all 33 evidence items, copied verbatim from the
       title: frontmatter of the three cached reference files.
    2. Reworded the mechanistic_category note: the combined OXPHOS deficiency was
       measured directly in the multisystem patient's own fibroblasts and
       lymphoblasts (Webb 2023, PMID:36881526); what is missing is any
       bioenergetic measurement in the isolated-optic-atrophy patients.
    3. Replaced "first committed step" with "second step" in the top-level
       description, the Impaired Mitochondrial Fatty-Acid Synthesis node, and the
       upstream causal edge, matching Webb ("MCAT acts at the second step").
    4. Removed the retinal ganglion cell (CL:0000740) binding from the OXPHOS
       node and replaced it with the cells actually measured - fibroblast
       (CL:0000057) and lymphoblast (CL:0017005) - so the node no longer asserts
       the RGC OXPHOS link that the oxphos_to_rgc_death_unproven gap calls
       unproven.
    5. Added an Abnormal brainstem MRI signal intensity phenotype (HP:0012747)
       quoting Webb's full-text MRI sentence; removed "Leigh-like" (not in Webb's
       text) from the description in favour of the distribution Webb reports.
       Added Webb-sourced Microcephaly (HP:0000252), Short stature (HP:0004322),
       Esotropia (HP:0000565) and Hyperreflexia / brisk reflexes (HP:0001347),
       all noted as the single-proband multisystem presentation, and added the
       Webb abstract as a second evidence item on the Nystagmus row (previously
       only Gerber's retelling).

    Blue suggestions taken: functional_impact_category LOSS_OF_FUNCTION ->
    PARTIAL_LOSS_OF_FUNCTION (the genotypes are hypomorphic, not null) with the
    MCAT-node molecular_functions modifier changed to DECREASED to match;
    regraded the "MCAT is expressed in RGC" snippet HUMAN_CLINICAL ->
    MODEL_ORGANISM (the RGC expression data in Li 2020 are from the mouse); set
    quote_role: BACKGROUND on the Gerber retellings of the Chinese siblings
    (reduced acuity, nystagmus, blindness), on the Gerber "encodes a
    mitochondrial protein involved in fatty-acid biogenesis" framing (regraded to
    OTHER), and on the Gerber arLHON-context sentence; added Webb background
    evidence (mtFAS loss -> ETC complex loss, MODEL_ORGANISM) to the
    fatty-acid-synthesis -> OXPHOS edge; sourced the arLHON/sibling-gene claim to
    Gerber (NDUFS2, DNAJC30) and dropped NDUFA12 (only in PMID:37071596, which
    this entry does not cite to avoid churning a shared reference cache);
    added a diagnosis section (molecular testing by exome/targeted sequencing)
    and a treatments section recording the high-dose methylprednisolone that did
    not improve vision in the LHON-like case.

    Also fixed the CI folded-scalar hyphen split flagged by the coordinator: the
    RGC-degeneration node description wrapped "retinal-ganglion-cell-specific" at
    a hyphen; rewrapped so no hyphen sits at a line break.

    Validated (all green): just validate, validate-terms, count-verified-snippets
    (33 snippets, 36 titles), validate-disorders (batched gate), check-entity-refs,
    check-causal-targets, check-coarse-phenotypes, check-enum-values,
    check-qualifier-terms, check-duplicate-keys, check-folded-hyphens,
    check-folded-yaml, check-snippet-length, check-block-scalar-comments,
    check-snippet-grading, normalize-cache, and
    check_gene_activity_grounding.py --against-ref origin/main (stays OK). No new
    term-cache rows were needed - every added term was already cached.

    Also took two further re-review suggestions: dropped the overstated "in
    retinal ganglion cells" from the Biallelic MCAT Loss of Function node's
    lesion description (germline variants, cultured-cell instability data), and
    removed the duplicate GO:0004314 molecular-function binding from the Impaired
    Mitochondrial Fatty-Acid Synthesis node, leaving the enzyme-activity term on
    node 1 (where the gene is grounded) and the GO:0006633 process term on node
    2. Left the idebenone and structured-onset suggestions out this round as
    optional.

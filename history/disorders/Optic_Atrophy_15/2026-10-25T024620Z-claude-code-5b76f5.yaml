  summary: 'Create: optic atrophy 15 (MCAT)'
  details: |
    New de-novo entry for optic atrophy 15 (OPA15, MONDO:0957935), the
    autosomal recessive optic neuropathy caused by biallelic MCAT (hgnc:29622,
    verified by OAK lookup) variants. entry_type DISEASE: a single gene-defined
    Mendelian entity with a phenotypic spectrum (insidious childhood optic
    atrophy, adult LHON-like acute loss, severe infantile multisystem disease),
    not a grouping or subtype.

    Deep research: falcon was requested but failed authentication (403); the run
    fell back to openscientist, which produced
    research/Optic_Atrophy_15-deep-research-openscientist.md (6 references, all
    resolved, 0 off-topic, confabulation 0.0; term validation 21/25, 1 label
    variant that matched the canonical GO label I used). The report was verified
    to be about the correct disease by inspecting its citations (the two correct
    primary MCAT papers) and its gene naming (MCAT throughout).

    Evidence: every KB snippet was quoted directly from primary sources I fetched
    and read, not transcribed from the DR report. Three primary reports cited:
    Li 2020 (PMID:31915829, index consanguineous family, protein-instability and
    mouse RGC-knockdown data), Gerber 2021 (PMID:33918393, adult LHON-like
    compound-het case), and Webb 2023 (PMID:36881526, infantile multisystem case
    with directly measured combined OXPHOS deficiency and a C2C12 rescue that
    dissociates lipoylation from respiration). Pathograph is a four-node causal
    chain (MCAT LoF -> impaired mtFAS -> impaired respiratory-chain assembly /
    combined OXPHOS deficiency -> RGC/optic-nerve degeneration -> phenotypes),
    bare-name downstream targets, with a KNOWLEDGE_GAP recording that the final
    step (OXPHOS deficit -> selective RGC death) remains inferential.

    Named Entity Confusion preflight (just preflight-dr) could NOT be run: it
    requires the 1.3 GB local MONDO sqlite build, which was not downloaded under
    a disk-space constraint on this runner (the oaklib sqlite builds had filled
    the volume and were cleared). Entity match was instead confirmed manually as
    above. The arLHON review PMID:37071596 was read but deliberately NOT cited,
    because citing it would have required committing a churned full-text
    re-fetch of a cache file four other entries depend on; the arLHON-grouping
    claim is carried in description prose supported by the primary papers.

    No GeneReviews chapter exists (confirmed online with synonyms; recorded in
    notes). Validated: just validate, validate-terms, count-verified-snippets
    (23/23), validate-disorders (batched gate), check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,

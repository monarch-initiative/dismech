  details: |
    # Evidence review — Pouchitis.yaml

    ## Stats
    - Evidence items checked: 13 (`reference:` blocks)
    - Distinct references read from `references_cache/`: 8 (`PMID_20845425`, `PMID_25110406`, `PMID_40240062`, `PMID_7634977`, `PMID_25222658`, `PMID_22879519`, `PMID_27681447`, `PMID_33549868`) — all present
    - Snippets mechanically verified against cache: 13/13
    - Verified clean: 10
    - Items with a finding below: 3 (1 fixed, 2 reported only)

    ## Findings

    1. **pathophysiology → Mucosal Immune Dysregulation, line 93** — `PMID:7634977` (Patel et al., *Cytokine production in pouchitis is similar to that in ulcerative colitis*, Dis Colon Rectum 1995).
       Problem: the snippet **was the paper's own title**, quoted verbatim as a finding and graded SUPPORT. A title establishes that a topic was studied, not what was found — and here the node's actual claim is specific and quantitative: "increased pro-inflammatory cytokine production (TNF-alpha, IL-1beta, IL-6, IL-8)". The title carries none of that; it asserts only a similarity to UC, which is a different claim from elevation.
       Severity: DEFECT.
       ACTION: **fixed** — replaced with the paper's RESULTS sentence, an exact substring of the cache body: "IL-1 beta, IL-6, IL-8, and TNF alpha secretions were significantly greater in pouchitis and active UC than in the noninflamed ileoanal pouch and normal controls". This names all four cytokines the node lists, gives the direction (increased) and the comparator, and turns a title into a finding. The `explanation` was rewritten to describe the measurement rather than the UC-similarity framing. `supports: SUPPORT` is now correct rather than generous; the item had no `evidence_source`, and I left it absent rather than adding a value the review did not require. The new sentence appears once in the file, so no `check-snippet-grading` divergence is introduced.

    2. **phenotypes → Increased Stool Frequency (line 172) and phenotypes → Rectal Bleeding (line 200)** — `PMID:40240062`, the same snippet in both.
       Problem: the quoted sentence is a definitional one ("Pouchitis, defined as inflammation of the ileal pouch, is the most common complication following restorative proctocolectomy for refractory ulcerative colitis."). It establishes that pouchitis is pouch inflammation and nothing about diarrhea or hematochezia. Both items are graded `NO_EVIDENCE`, which is the honest grade — but both `explanation` fields then assert the phenotype anyway ("manifests clinically with diarrhea as a cardinal symptom of inflammation"; "Rectal bleeding is a direct manifestation of mucosal inflammation and ulceration"). The explanation is doing the work the quote does not do.
       Severity: MINOR (the `NO_EVIDENCE` grade correctly stops these from counting as support, so nothing downstream over-reads them).
       ACTION: **reported only** — the fix is either a better quote or removal. A better quote *does* exist elsewhere in the KB's cache: `PMID:27681447` (already cited twice in this file's `environmental:` section) contains "When a patient presents with symptoms of pouchitis, such as increased bowel movements, mucous and/or bloody exudates, abdominal cramps, and fever" — a single sentence that would properly evidence Increased Stool Frequency, Rectal Bleeding, Abdominal Pain **and** Fever. Repointing an evidence item to a different reference is beyond the conservative fix policy, so I am flagging it as the highest-value follow-up for this entry.

    3. **treatments (lines 263–302)** — four treatments, **zero** evidence items between them.
       Problem: two carry specific quantitative or product claims in their `description` with nothing behind them — Antibiotic Therapy asserts "Response rates are typically 80-90% for acute pouchitis", and Probiotic Therapy asserts VSL#3/Visbiome "has demonstrated efficacy in preventing recurrent pouchitis and maintaining remission". These are efficacy claims of the kind that normally require a cited trial.
       Severity: MINOR (schema-legal; `evidence` is recommended, not required, on `Treatment`).
       ACTION: **reported only** — adding references is outside the fix policy. Worth noting `PMID:40240062`, already in the file's cache, states "Antibiotics remain the first line of therapy for pouchitis, but the majority of patients develop subsequent episodes and some are refractory to antibiotic therapy" — which would evidence the first-line status while also tempering the unsourced 80–90% figure.

    ### Also noted (no action, not defects)
    - **The pathophysiology evidence is strong.** `PMID:22879519` (NOD2 Genetic Susceptibility) is the standout: an exact multicentre-cohort result sentence carrying the variant, the rsID, the p-value and both odds ratios, matched precisely to a node that claims exactly those things. `PMID:25222658` is used twice on the Epithelial Barrier Dysfunction node with two *different* result sentences — reduced ZO-1/claudin-1 for the barrier-loss claim, and early claudin-2 upregulation for the "initiating event" claim — each supporting the specific sub-claim its explanation names. `PMID:20845425` and `PMID:25110406` similarly quote result/conclusion sentences that match the dysbiosis node's direction (increased Clostridium/Eubacterium, decreased Lactobacillus/Streptococcus, decreased diversity).
    - **`PMID:40240062` under Mucosal Immune Dysregulation (line 83)** is graded PARTIAL with a quote that lists immune dysfunction among "putative mechanisms". The hedged grade correctly matches the hedged source wording ("putative"). Good calibration.
    - **`environmental:` section is well evidenced but pathograph-disconnected.** All three entries (Prior Ulcerative Colitis, Surgical Factors, NSAID Use) carry exact, on-claim, correctly tagged HUMAN_CLINICAL evidence — `PMID:33549868` in particular quotes the precise multivariable-results sentence naming hand-sewn vs stapled anastomosis, which is exactly what the Surgical Factors claim asserts. However none declares `influences_mechanisms`, so per CLAUDE.md none of them reaches the pathograph; they render as list entries only. Also, no entry carries an `exposure_term`, so `just environmental-term-audit` would classify all three UNBOUND. Both are curation gaps rather than evidence defects.
    - **Three phenotypes carry no evidence at all** (Abdominal Pain, Urgency, Fever) — see finding 2 for the single cached sentence that would cover all three plus the two currently mis-evidenced ones.
    - All eight `reference_title` values match their cache frontmatter.

    ## Sections reviewed
    pathophysiology, phenotypes, environmental, treatments, datasets, disease_term

    ## Verdict
    Mechanistically this is a well-evidenced entry: the four pathophysiology nodes and the three environmental risk factors are backed by exact result sentences from appropriate cohort and biopsy studies, with the NOD2 and tight-junction items especially precise. The defects cluster at the clinical surface — one title-as-finding snippet on the cytokine node (fixed here with the paper's own results sentence), two phenotypes evidenced by a definitional sentence that supports nothing they claim, and four unevidenced treatments carrying specific efficacy figures. A single already-cached sentence from `PMID:27681447` would close most of the phenotype gap.

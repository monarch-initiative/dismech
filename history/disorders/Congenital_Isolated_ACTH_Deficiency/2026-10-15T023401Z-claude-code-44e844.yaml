  summary: 'Create: Congenital_Isolated_ACTH_Deficiency'
  details: |
    New entry for congenital isolated ACTH deficiency (MONDO:0008720), scoped to the neonatal-onset TBX19 (TPIT) form. The stub stubs/Congenital_Isolated_Adrenocorticotropic_Hormone_Deficiency.yaml is deleted. Evidence comes from PubMed primary papers (Lamolet 2001 PMID:11290323, Pulichino 2003 PMID:12651888 and PMID:12651892, Vallette-Kasic 2005 PMID:15613420, Couture 2012 PMID:22170728, later case reports) and the Orphanet record ORPHA:199296, which supplied the phenotype frequencies. All 82 snippets verify against references_cache. The OpenScientist deep-research report (research/Congenital_Isolated_ACTH_Deficiency-deep-research-openscientist.md) was used as a lead source: 25/25 references resolved, none off topic; term validation needs_review because of five mislabelled CURIEs (HP:0011736, CL:0000152, CL:0002097, CHEBI:3650, CHEBI:17754), none of which is bound here. The report also gives a wrong Orphanet code (ORPHA 442); the entry uses ORPHA:199296 from the MONDO cross-reference. just preflight-dr returned WARN because POMC (the TPIT target gene and a differential diagnosis) and NFKB2 (DAVID syndrome differential) outnumber TBX19 mentions; the report is about the intended disease (OMIM 201400 matches) and only TBX19 content was curated. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). Pathograph: TBX19 loss of function, loss of TPIT-PITX1 activation of POMC, arrested corticotroph terminal differentiation, pituitary ACTH deficiency, adrenal cortex hypoplasia, glucocorticoid deficiency, then phenotypes; all 15 phenotypes are causally connected. HP:0003811 Neonatal death and HP:0008073 Low maternal circulating estriol concentration fall outside the PhenotypeTerm enum, so sudden neonatal death is bound to HP:0001699 Sudden death and maternal estriol is recorded as a diagnosis row. MONDO's parents (combined pituitary hormone deficiencies, genetic form; isolated congenital hypogonadotropic hypogonadism) do not describe an isolated corticotroph defect, so free-text parents are Adrenal Insufficiency and Hypopituitarism. The Orphanet cache file was rebuilt from local Orphadata files whose checksums differ from the manifest pin, so its Source line carries release 2026-06-23.

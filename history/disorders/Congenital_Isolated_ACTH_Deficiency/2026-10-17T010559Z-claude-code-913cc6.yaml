  details: |
    LOINC tranche K batch 2. The 'Maternal serum estriol on prenatal screening' row makes a qualitative claim (isolated low unconjugated estriol on the triple-marker screen), with no specific number or Multiple-of-the-median value cited, so per the coordinator's AFP MoM refinement earlier in this project this entry does not qualify for a MoM-family code. Searched 'Estriol unconjugated' (total=11, fully enumerated) and bound the Part code, LOINC:LP15559-5 (Estriol.unconjugated), specimen- and method-free, rather than the quantitative Mass/volume or Moles/volume codes (no reported number) or the Multiple-of-the-median variants (no reported MoM). No panel code exists for unconjugated estriol alone the way AFP has one; the triple-marker screen panel this analyte belongs to was not bound since the entry's claim is specifically about the isolated estriol component. Code verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

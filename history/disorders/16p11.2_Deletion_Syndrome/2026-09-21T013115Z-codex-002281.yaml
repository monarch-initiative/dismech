  summary: Complete ocular baseline and qualify primary-cohort estimates
  details: |
    Completed the GeneReviews ocular-baseline cross-check by fetching and reading the full ocular case-literature review (PMID:32373379). Added downslanted palpebral fissures, deeply set eyes, ptosis and hypertelorism as separate HPO phenotypes. The source calculates percentages from 43 cases selected for reported eye findings; no such percentage is assigned as a population frequency. These ocular associations remain without invented causal links.

    Fetched and read the complete primary Zufferey cohort (PMID:23054248). Added delayed gross motor milestones with its 32/85 clinically ascertained denominator, the primary 20% intellectual-disability estimate based on DSM-IV-TR IQ and adaptive-function criteria, and the selected 14 obese carriers underlying the hyperphagia observation. Qualified de novo estimates by cohort ascertainment and available parental data instead of treating the clinical review's inherited fraction as universal. The study's 41.3% versus 12.5% macrocephaly comparison concerns the idiopathic-autism Simons Simplex Collection, not deletion carriers, and was excluded.

    The automated reviewer approved the initial commit without critical or important findings. Its optional suggestions were assessed: the existing review_notes explicitly explains the causally unconnected associations; all health-supervision evidence already carries quote_role REVIEW_SYNTHESIS, alongside HUMAN_CLINICAL for clinical observations or OTHER for recommendations; the UNKNOWN registry state retains its last-known status and verification-date context. Independent peer review found no further semantic issues in this follow-up. Authoritative validate-disorders passed schema, live terms and all 90 evidence snippets; target/entity checks and the connectivity report passed (17/25 phenotypes connected). Whole-KB folded-hyphen, snippet-length, title-snippet, snippet-grading, environmental-evidence, reference-title and coarse-phenotype gates completed successfully. Full-text coverage now comprises seven cached full texts plus the online full GeneReviews chapter, its cached abstract, the trial-design abstract and the trial record. Reference caches were generated only with fetch-reference.

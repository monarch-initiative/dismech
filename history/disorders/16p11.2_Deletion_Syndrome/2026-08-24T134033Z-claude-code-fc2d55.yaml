  details: |
    Created proximal 16p11.2 (BP4-BP5) microdeletion syndrome (MONDO:0012756) from PMID:33667823 (Chung 2021 review). Modeled the recurrent ~600kb CNV and haploinsufficiency of ~27 genes; quantified phenotype frequencies (speech/language 70%, coordination 60%, autism 20-25%, seizures 24%, obesity 75% adult, IQ -1.8 SD). Schema + term validation pass; 11/11 snippets verified.

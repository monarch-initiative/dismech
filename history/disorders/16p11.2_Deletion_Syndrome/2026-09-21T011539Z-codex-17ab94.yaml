  summary: Review proximal 16p11.2 deletion syndrome against full-text evidence
  details: |
    Reviewed the complete proximal BP4-BP5 deletion entry against both original references and the full GeneReviews chapter, including inheritance, variable developmental severity, phenotype frequencies, diagnosis, surveillance and supportive care. Regenerated PMID:33667823 through fetch-reference to obtain actual PMC full text. Read and used actual cached full texts of PMID:33667823, PMID:36531974, PMID:38050025, PMID:25564734 and PMID:28984295; PMID:20301775 remains a cached GeneReviews abstract, while its full chapter was consulted online. The 2026 arbaclofen publication PMID:42080302 is a trial-design abstract, not an efficacy report. Checked NCT04271332 against the live registry, which reports UNKNOWN with last known ACTIVE_NOT_RECRUITING status. The neighboring 16p12.2-p11.2 deep-research report concerns a larger deletion and is outside this entry's scope; no matching proximal-deletion report was found.

    Corrected prevalence from birth prevalence to general-population point prevalence. Replaced the implication of uniform intellectual disability with the GeneReviews distinction between intellectual disability, learning difficulty and variable neurodevelopmental delay. Added age- and cohort-qualified speech apraxia, learning difficulties, ADHD, macrocephaly, hypotonia, tremor, hyperreflexia, vertebral anomalies, hearing impairment, sacral dimples, Chiari I, hyperphagia and subtle facial dysmorphism. Did not assign single-phenotype frequencies from grouped diagnoses or an upper-limit estimate. Added MRI brain-volume and white-matter observations, keeping tonsillar ectopia distinct from Chiari I and imaging association separate from causal explanation.

    Rebuilt the causal graph around atomic deletion and reduced-dosage events. PRRT2 attribution is provisional and limited to the infantile epilepsy subset; TBX6 compound dosage deficiency explicitly depends on the remaining hypomorphic allele, with carrier and functional evidence. Satiety is an organism-level process, without invented gene or circuit intermediates. Unresolved clinical intermediates remain explicit; hearing, sacral dimples, facial dysmorphism and Chiari I remain unconnected rather than assigning unsupported causes. Reconciled the primary seizure cohort's denominators, distinguished seizures from epilepsy, and bounded antiseizure-drug observations to a retrospective cohort. Expanded developmental support, genetic counseling, weight prevention and surveillance. Added arbaclofen trial design and two-line mouse-model evidence, including failure to rescue hyperlocomotion or vocalizations and the absence of demonstrated human efficacy.

    Independent peer review prompted removal of a hyperreflexia-only frequency, a broad neurodevelopmental rather than global-delay HPO binding, a source passage locating PRRT2 within the deleted interval, and removal of the unsupported direct satiety-to-hyperphagia link. Authoritative validate-disorders passed schema, live ontology terms and 81 of 81 exact evidence snippets against cached references. Ontology caches were generated and normalized by repository tools. All reference-cache changes were produced by fetch-reference; the frozen dataset-accession cache was neither read nor changed. Remaining limitations are clinical ascertainment and age dependence, unresolved gene-to-phenotype intermediates, indirect preclinical treatment evidence, and a trial registry record whose status has not been recently verified.

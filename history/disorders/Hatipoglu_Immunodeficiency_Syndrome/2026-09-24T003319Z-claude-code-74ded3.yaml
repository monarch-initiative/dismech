  summary: 'Review round 1: add nine clinical-table phenotypes, regrade one evidence
    item, bind two GO processes'
  details: |
    Answering the CHANGES_REQUESTED review on PR #12640.

    Blocking finding 1 - nine rows of the PMID:36112693 per-patient clinical table were
    present in the source and absent from the entry. Eight are now curated as phenotypes:
    Selective immunodeficiency (HP:0002721, no frequency - 2/2 assessed, 2 n.d.), Severe
    allergies (HP:0012393, severity SEVERE), Poor feeding (HP:0011968), Fair hair
    (HP:0002286), Slurred speech (HP:0001350), Autism spectrum disorder (HP:0000729),
    Downslanted palpebral fissures (HP:0000494) and Inguinal hernia (HP:0000023), each
    FREQUENT for 2/4 except the two-denominator row. The ninth, Infantile eczema
    (HP:0000964), is folded into the existing Atopic dermatitis phenotype rather than
    curated beside it: both table rows score the same two patients and HP:0000964
    Eczematoid dermatitis is the direct is-a parent of HP:0001047 Atopic dermatitis (OLS
    hierarchicalParents, checked 2026-09-24), so a separate entry would duplicate the
    finding at a broader term. The table row is carried as a second evidence item on that
    phenotype and the onset is now recorded as INFANTILE. A phenotype-scope paragraph in
    notes states the rule (every row positive in at least two of four children) and names
    the eight one-of-four rows left out.

    HPO identifiers - none were copied from the source table. Every CURIE above was
    resolved against cache/hp/terms.csv and re-checked live against ols:hp before binding.
    Two identifiers in the source table are wrong and are now recorded in notes: the table
    prints HP:0002373 against Broad forehead (that is the febrile-seizure term, which the
    same table also prints against its own Febrile seizures row) and HP:0000776 against
    Inguinal hernia (that is congenital diaphragmatic hernia). The inguinal hernia
    phenotype binds HP:0000023 while its snippet quotes the row verbatim, identifier
    included.

    Blocking finding 2 - the evidence item on Biallelic DPP9 Loss-of-Function Variants
    quoting 'these variants were shown to behave as hypomorphic or knockout alleles that
    failed to repress NLRP1' is regraded HUMAN_CLINICAL to IN_VITRO. The sentence it comes
    from opens 'Using patient-derived primary cells and biochemical assays', so it grades
    the cell-based work, not the clinical series. The quote occurs once in the file, so
    check-snippet-grading sees a single value for it.

    Optional suggestions, all three taken. The PMID:36112693 evidence item on the mouse
    FAILS_TO_RECAPITULATE link is regraded REFUTE to SUPPORT: supports is direction
    relative to the claim the item is attached to, and the claim there is that the model
    fails to reproduce the human haematological phenotype, which the quoted negative result
    supports. A Bone Marrow Stem and Progenitor Depletion to Petechiae edge is added as
    INDIRECT_KNOWN_INTERMEDIATES, with a description recording that the intermediate is
    platelet loss reported only as part of the pancytopenia and that the edge is therefore
    an inference rather than a measured platelet result. Loss of DPP9 Restraint on FIIND
    Inflammasome Sensors is bound to GO:0141086 negative regulation of inflammasome-mediated
    signaling pathway with modifier DECREASED, and CARD8 Inflammasome Activation in
    Hematopoietic Progenitors to GO:0140633 CARD8 inflammasome complex assembly with
    modifier INCREASED; both were resolved through ols:go at bind time.

    The HUMAN_MODEL_MISMATCH discussion now attaches to the speech-delay, slurred-speech
    and autism phenotypes as well, and its rationale records that the autism and the
    slurred speech are not scored in the same two children, so the cohort offers no single
    neurodevelopmental phenotype for a model to target.

    Validation: just validate (schema, terms, 75/75 snippets verified, up from 66/66),
    count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-folded-hyphens,
    check-environmental-evidence, check-coarse-phenotypes, check-case-collisions,
    check-reference-titles, check-genereviews, pytest tests/test_data.py -k Hatipoglu, and
    validate-disorders.

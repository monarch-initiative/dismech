  summary: 'Create: Hatipoglu_Immunodeficiency_Syndrome'
  details: |
    De novo curation of Hatipoglu immunodeficiency syndrome (MONDO:0957229, OMIM 620331), autosomal recessive DPP9 deficiency.

    Scope decision. The entry covers only the biallelic recessive disease. The de novo heterozygous DPP9 p.Arg252Pro dominant-negative patient with HLH-like hyperinflammation (PMID:37544411) is excluded, with the reasoning recorded in the entry notes: different inheritance mode, different genetic mechanism, and including it would make the per-patient counts in this entry uninterpretable.

    Pathograph. Seven nodes in a chain from the biallelic lesion through loss of DPP9 restraint on the FIIND sensors, then branching into the NLRP1/keratinocyte arm and the CARD8/HSPC arm. The CARD8 arm runs to caspase-1-dependent pyroptosis, marrow stem and progenitor depletion, and thence to the pancytopenia, anaemia and recurrent-infection phenotypes. DPP9 reaches the pathograph through a genes descriptor on the initiating lesion node.

    Phenotypes. Seventeen, taken from the per-patient clinical table of the founding cohort (PMID:36112693, four children from three families) plus the 2025 twin case report (PMID:41082409). Frequency bands are derived from counts out of four and the entry says so; hemivertebrae carries no frequency because it was assessed in only two patients.

    Module conformance. No conforms_to declared. The only inflammasome module in kb/modules is nlrp3_inflammasome_activation, whose description scopes it to the two-signal NLRP3 pathway; this disease is loss of a repressor acting on FIIND-domain sensors. Reasoning recorded in the entry notes.

    Deep research. falcon was requested and returned HTTP 402 (account out of credits); the run fell back to claude_code, which produced research/Hatipoglu_Immunodeficiency_Syndrome-deep-research-claude_code.md (fell_back: true, requested_provider: falcon, recorded in the report frontmatter). just preflight-dr returned WARN, not FAIL: DPP9 is mentioned 57 times and NLRP1 43 times, which is the expected mechanism partner rather than a second disease, and the report's OMIM identifier matches MONDO's. The report's reference validation was added with just validate-research-reference: 7 of 7 references resolved, 0 unresolved. The term-validation section could NOT be added: just validate-research-terms failed on all four attempts with a read timeout reaching www.ebi.ac.uk to resolve MONDO:0957229, so the committed report has no Term Validation section. Every CURIE bound in the entry was instead checked through just validate-terms, which passes, and the two new HP terms plus the MONDO and HGNC terms were resolved and cached by that run. No .citations.md sidecar was produced by the claude_code provider.

    Not curated for want of a source. Serum IL-1 beta and IL-18 concentrations, anakinra dosing and patient response, post-transplant outcomes, and per-variant gnomAD allele frequencies were all raised by the deep-research report, each flagged there as coming from a secondary summary rather than a primary read. None was confirmable against a cached primary source, so none is in the entry; the gap is recorded in the entry notes.

    Reference caches. Nine committed: the six the entry cites plus PMID:24223149, PMID:37544411 and PMID:42427515, which the deep-research report cites. Nine further caches fetched during the literature sweep were pruned because neither the entry nor the report needs them. Note the entry cites the J Clin Invest version of the humanized-mouse paper (PMID:42741941) rather than the bioRxiv preprint (PMID:42427515) the report cites, per the repo preference for the peer-reviewed version.

    Validation: just validate (schema, terms, references) passed with 65/65 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-reference-titles, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, list-gene-term-mismatches (0 findings), pytest tests/test_data.py -k Hatipoglu, and validate-disorders.

  summary: 'Review round: Turner differential, off-target report banner'
  details: |
    Round two on PR 11096, acting on the ai4c-reviewer REQUEST_CHANGES review. Both blocking findings were verified against the files before being acted on, and both were correct.

    Blocking finding 1, the committed openscientist report is off target with no warning inside the file. Confirmed: its own heading reads "Noonan Syndrome 6 (RAF1-Related)" and states Gene: RAF1, HGNC:9829, 3p25.2, while the body mentions RAF1 71 times and NRAS zero times. The reviewer's point was discoverability rather than correctness - scripts/index_research_artifacts.py indexes research/ by filename, so the next curator meets a confident NS6-titled report with nothing in it to signal the problem, and a history record on a different PR is not where they would look. Took the banner option rather than deletion, because the file is evidence of a real provider failure mode and preflight-dr recommends reconciling over discarding. A blockquote banner is prepended in two places, immediately after the frontmatter and at the top of the ## Output section, stating the wrong gene, the mention counts, the exact preflight-dr WARN text, and the four wrong NCIT bindings. It says explicitly that the report's own clean Reference Validation section (26/26 resolved, 0 off topic, 0.0 confabulation) must not be read as reassurance, since references are scored against the report's own vocabulary and that vocabulary is RAF1 vocabulary. The reviewer noted no such convention exists in the repo yet and that this wording will likely become the pattern, so it is written to be copied.

    Blocking finding 2, Turner syndrome missing from the differentials. Correct and worth having: Turner is the classic non-RASopathy mimic and the only differential here separated by karyotype rather than by a gene panel, which is exactly the case a sequencing-first workflow misses. Added as a fifth differential bound to MONDO:0019499, cited to PMID:34858328, whose background sentence states the phenotypic overlap and the differing genetic basis in one quote. Graded INDIRECT because it characterizes Noonan syndrome as a whole rather than the NRAS subtype, matching this entry's standing convention for parent-entity statements. Three distinguishing_features carry the karyotype, sex, and cardiac-lesion-pattern discriminators. The reviewer was right that the cached GeneReviews record has no quotable Turner sentence; that was checked rather than assumed, and a new reference was fetched.

    22q11.2 was considered and deliberately not added, with the reason recorded in notes. The falcon report lists it beside Turner, but the only sources found are a dual-diagnosis case report whose single usable sentence is its own title (which check-title-snippets gates against) and a passing remark that microarray may reveal a second diagnosis. Neither supports a standalone differential, and the karyotype/microarray discriminator now carried by the Turner entry covers the same diagnostic step. Its cache file was removed rather than committed uncited.

    Two of the three non-blocking suggestions were taken. The 1p13.2 differential now carries a notes line recording that MONDO was searched for a 1p13.2 deletion concept and has none, the nearest hit being MONDO:0014825 chromosome 11p13 deletion syndrome distal, a different locus - so the next curator does not repeat the search. The reused PMID:40518121 quote under mechanistic_category now carries directness: INDIRECT, matching its grading under differential_diagnoses; the claim is the same in both places and reaches NS6 through the parent entity either way.

    The third suggestion, that the PR body undercounts the change at three differentials and five references, was already fixed before the review ran. The re-run replayed the original workflow event payload, so the reviewer read the auto-generated body from PR creation rather than the corrected one; the current body says four differentials and lists all seven PMIDs. Said so in the reply rather than editing anything.

    Validation. just validate-disorders passes: schema clean, terms passed, 105/105 snippets verified, up from 104. check-enum-values, check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms all pass.

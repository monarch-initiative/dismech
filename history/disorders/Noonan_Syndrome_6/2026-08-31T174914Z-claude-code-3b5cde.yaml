  summary: Rewrite 41 explanations naming the retired PARTIAL grade; add directness
  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place. This entry therefore explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim - the specific limitation each item carries - restated in terms of the current enum, following the pattern set by PR 10120. Where that reason IS an inference step, meaning the finding reaches this entry through a parent entity, a model organism, a pooled cohort or a disease class rather than from this disorder directly, directness: INDIRECT is added, because that is the slot the reason was always describing. Where the reason is something else - a variable phenotype, an untested construct, an n-of-1 overclaim - the retired token is dropped without asserting a directness nobody assessed. A consistency check enforces both directions: no explanation claims INDIRECT without the item carrying it, and no item carries it without the explanation saying why. No supports value, snippet, reference, evidence_source or ontology term changed. The single worst entry in the KB for this residue at 41 items, and unusually uniform: nearly every caveat is that a GeneReviews or Orphanet statement characterizes Noonan syndrome as a whole rather than the NRAS-defined NS6 subtype, or that an Nras mouse result is model-organism rather than human evidence. Both are textbook inference steps, so 40 items gain directness: INDIRECT. The entry-level scope note, which documented the whole pattern by saying shared features are curated with GeneReviews evidence marked PARTIAL, is updated to describe the directness slot instead. Validated with just validate: 92/92 snippets verified.

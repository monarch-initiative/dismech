  summary: 'Create: Noonan Syndrome 6 (NRAS)'
  details: |
    De novo creation of the NRAS-associated Noonan syndrome subtype entry (MONDO:0013186, OMIM:613224), resolving issue #8756.

    Deep research: falcon (Edison) run, research/Noonan_Syndrome_6-deep-research-falcon.md. Its own reference-validation block reported 8/8 references resolved, 0 unresolved, 0 off topic, confabulation_rate 0.0 (5 of 8 undecided for relevance because the cached records carry no abstract). NEC preflight, "just preflight-dr research/Noonan_Syndrome_6-deep-research-falcon.md MONDO:0013186", returned WARN: canonical gene NRAS dominates the report (NRAS=81 mentions vs PTPN11=3, SOS1=2), and the only flag was that the report also cites the umbrella Noonan OMIM 163950 alongside the subtype number. That line was inspected in context (report line 986 names 613224 as NS6 and 163950 as the umbrella entry), confirming this is not a wrong-entity report.

    The report was nonetheless used only as corroboration and as a lead source. Every curated claim is anchored on primary literature located independently via PubMed E-utilities before the report landed, and cached with just fetch-reference: PMID:19966803 (Cirstea 2010, Nat Genet, establishing germline NRAS causation), PMID:28594414 (Altmuller 2017, the 19-case NRAS cohort), PMID:26467218 (Ekvall 2015, familial G60E, hyperpigmentation), PMID:22887781 (Kraoua 2012, 2/125 screen), PMID:22855653 (Denayer 2012, 3/115 screen), PMID:21263000 (Runtuwene 2011, zebrafish I24N/G60E, MEK rescue), PMID:31697451 (Garren 2020, embryonal rhabdomyosarcoma with p.G12R), PMID:33681212 (You 2021, NrasG12D mouse cardiac defects), PMID:23875798 (Rauen, The RASopathies), PMID:40041314 (De Brouchoven 2025, trametinib systematic review), plus GeneReviews Noonan Syndrome PMID:20301303 and the ClinGen NRAS/Noonan Definitive gene-validity assertion.

    GeneReviews baseline: there is no NRAS/NS6-specific GeneReviews chapter, so the parent Noonan Syndrome chapter (PMID:20301303) is tagged GeneReviews in the top-level references block and used as the clinical-characteristics baseline. Every claim drawn from it is marked supports: PARTIAL with an explanation saying it characterizes the parent entity rather than the NRAS subtype. Its Agents/Circumstances to Avoid warning (aspirin, bleeding diathesis) is carried in a dedicated treatment entry.

    Deliberate omissions: the detailed NRAS-cohort phenotype frequencies published by Altmuller et al. sit in the paywalled full text rather than the cached abstract, so they are not asserted here as evidence-backed frequency bands; the entry says so in its notes. Only the hyperpigmentation figure (50%, in the Ekvall abstract) carries a frequency enum derived from a quantitative quote. The Noonan Syndrome umbrella entry was not modified (a sibling agent is concurrently curating NS11); NS6 cross-references it via parents and notes instead.

    Content: 5 pathophysiology nodes (NRAS germline gain-of-function -> RAS-MAPK cascade hyperactivation -> disrupted embryonic cardiac development / disrupted early developmental patterning, plus an oncogenic-codon tumor-predisposition node), 20 phenotypes, a genetic block with two case_fractions records, inheritance, prevalence, 5 treatments (including a MEK-inhibitor entry with target_mechanisms on the cascade node), 2 animal models with modeled_mechanisms and readouts, and 2 discussions (one KNOWLEDGE_GAP on codon-dependent tumor risk, one HUMAN_MODEL_MISMATCH on animal-model allele strength).

    Validation actually run and read to completion: just validate (schema: no issues; term validation: passed; reference validation: 58/58 snippets verified against cached references); just validate-disorders kb/disorders/Noonan_Syndrome_6.yaml (batched schema + terms + references, all passed, 58/58 snippets verified); just check-duplicate-keys (OK); just check-title-snippets (no new title-quoting snippets).

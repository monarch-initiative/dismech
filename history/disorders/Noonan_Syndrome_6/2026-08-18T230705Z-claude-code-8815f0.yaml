  summary: 'Review fixes: pectus and ocular phenotypes, pathograph edges, MEKinRAS
    trial'
  details: |
    Addresses the single remaining blocking item from the ai4c-reviewer re-review of PR #8857, plus the cheap non-blocking suggestions.

    BLOCKING (finding 5, phenotype coverage). The GeneReviews sentence "Other findings can include broad or webbed neck, unusual chest shape with superior pectus carinatum and inferior pectus excavatum, cryptorchidism, varied coagulation defects, lymphatic dysplasias, and ocular abnormalities." was already quoted three times in this entry (webbed neck, cryptorchidism, bleeding diathesis) while its pectus and ocular clauses went unconsumed - an internal inconsistency rather than a scoping decision. Added four phenotypes, all sourced from references already committed to the cache:
    - Pectus Carinatum (HP:0000768) - GeneReviews PMID:20301303 chest-shape sentence plus the ORPHA:648 row "HP:0000768 | Pectus carinatum | Very frequent (99-80%)"
    - Pectus Excavatum (HP:0000767) - same GeneReviews sentence plus the corresponding ORPHA:648 row
    - Strabismus (HP:0000486, new Ocular category) - the GeneReviews "ocular abnormalities" clause plus "HP:0000486 | Strabismus | Frequent (79-30%)"
    - Downslanted Palpebral Fissures (HP:0000494) - ORPHA:648 row only
    All four carry supports: PARTIAL, consistent with this entry's discipline for parent-entity statements about Noonan syndrome as a whole. No frequency bands were asserted: the Orphanet bands annotate the parent entity, matching how the pre-existing Ptosis entry is handled.

    The reviewer's warning was honoured explicitly: PMID:41940405 is NOT cited for any ocular phenotype. Its ophthalmologic findings are cohort-wide across PTPN11/SOS1/NRAS and its conclusion reports no significant genotype relationships; the Strabismus description records that fact so a later curator does not re-add it.

    NON-BLOCKING suggestions applied:
    (a) "Disrupted Early Developmental Patterning" is no longer a dead-end node: added a downstream edge to Noonan Facial Gestalt, evidenced PARTIAL from PMID:21263000 ("The defects in zebrafish embryos are reminiscent of symptoms in individuals with Noonan syndrome and phenocopy the defects that other Noonan-syndrome-associated genes induce in zebrafish embryos."). PARTIAL because the resemblance is asserted for the embryonic defects as a whole, not for the human facial gestalt specifically.
    (b) "Disrupted Embryonic Cardiac Development" now emits edges to Pulmonic Stenosis and Septal Defects, both evidenced from the PMID:33681212 cardiac-malformation sentence already in the entry, tagged PARTIAL / MODEL_ORGANISM. Phenotypes with an incoming causal edge went from 6/21 to 8/25. Hypertrophic Cardiomyopathy was deliberately NOT wired: the mouse snippet reports hypertrabeculation and thin myocardium, not hypertrophy, so an edge from a morphogenesis node to postnatal hypertrophy would be unevidenced. The reviewer's own observation that HCM needs its own postnatal-hypertrophy node is the right fix and is left open.
    (c) frequency: VERY_RARE dropped from Severe Intellectual Disability - the single case report supplies no denominator. The explanation now says so rather than justifying a band.
    (d) preferred_term on the hyperpigmentation node changed from "Multiple lentigines" to "Lentigines and/or cafe-au-lait macules", matching the composite that the description and the 50 percent source actually describe; term.label stays at the canonical HP:0001003 string.
    (e) clinical_trials: added with the one defensible exception to the existing scoping note - NCT06555237 (MEKinRAS, PHASE_II, RECRUITING), which selects on a molecularly confirmed RAS-MAPK variant plus hypertrophic cardiomyopathy rather than on a clinical Noonan diagnosis, so it admits NS6 by genotype and substantiates this entry's own experimental trametinib treatment. The snippet is quoted verbatim from references_cache/clinicaltrials_NCT06555237.md including the registry's own "Hyperthropic" spelling. The notes: scoping paragraph was rewritten to name the trials that remain out of scope (NCT01529840, NCT00452725, NCT03435627, NCT05308927, NCT06668805) and to record why MEKinRAS is the exception.
    (i) merged origin/main into the branch (18 commits behind) so CI evaluates against current main.

    DECLINED, with reasons: suggestion (f) Perrino et al. 2024 and Reynolds et al. 2025 - neither is in the local reference cache and neither was fetched, so adding them would mean citing papers whose abstracts have not been checked against a quoted snippet; suggestion (g) a structured variant_origin for the parental mosaicism - the mosaicism report sits in the paywalled Altmuller full text, the same constraint already recorded in notes:, so it stays prose.

    Validation actually run: just validate (schema clean, term validation passed, 92/92 snippets verified), just count-verified-snippets 92/92, just validate-terms passed, just check-duplicate-keys OK, just validate-disorders (batched schema plus terms plus references) all passed at 92/92, and a targeted pytest selection over the foreign-key and downstream-edge tests (2017 passed). just check-title-snippets reports findings elsewhere in the tree with grandfathering unavailable against the local ref; an equivalent per-snippet comparison restricted to this file finds zero title-quoting snippets.

  summary: 'Review fixes: Noonan Syndrome 6 (NRAS)'
  details: |
    Follow-up session on the same PR (#8857), landing an internal red-team review of the entry created in the preceding record. The earlier record is left untouched (history is append-only); this one covers commits 3515a433b4, 035b47a2e8 and the review-fix commit that follows them.

    Review method: a fresh-context subagent applied the repo's dismech-pr-review skill to the entry, re-verifying every snippet offline against references_cache/ and every ontology CURIE against local OAK. It confirmed evidence fidelity (all snippets exact substrings, no fabrication), ontology grounding (all HP/GO/CL/NCIT/MONDO/hgnc ids real and label-exact), foreign-key resolution, and disease identity (no wrong-Noonan-number or wrong-RAS-gene content). Its findings were about claim calibration, not fabrication, and were addressed as follows.

    CRITICAL fixed: GO:0003924 (GTPase activity) carried modifier GAIN_OF_FUNCTION, which is biologically backwards for activating RAS alleles and contradicted the node's own description as well as KB precedent (Ocular_Melanoma, GNAS-related_pituitary_adenoma_3, Behr_Syndrome all pair this term with DECREASED for the same lesion class). Changed to DECREASED with a description recording that this is strictly the Gly12 statement, and moved the gain-of-function claim onto GO:0046579 positive regulation of Ras protein signal transduction.

    IMPORTANT fixed: (1) Four evidence items quoting PMID:19966803's opening background definition of Noonan syndrome were marked SUPPORT despite being parent-entity statements of exactly the kind this entry marks PARTIAL elsewhere; all four changed to PARTIAL with explanations saying why. (2) A compliance-driven filler snippet on the mouse model that said nothing about the model was replaced with a first-party characterization sentence. (3) frequency VERY_RARE on Myeloproliferative Disorder and Brain Neoplasm contradicted their own quoted denominator (1 of 19 cases = 5.3%); both changed to OCCASIONAL with the arithmetic stated in the explanation. (4) The 50% hyperpigmentation figure is a composite lentigines-and/or-CALM statistic; the phenotype was renamed Hyperpigmented Cutaneous Lesions, the composite basis stated, and the separate cafe-au-lait entry left without a frequency so the figure is not counted twice. (5) A diagnosis: section was added - GeneReviews' DIAGNOSIS/TESTING sentence names NRAS explicitly, so that item is SUPPORT rather than PARTIAL - covering RASopathy-panel molecular testing, germline confirmation on non-hematopoietic tissue, and baseline echocardiography. (6) The Oncogenic-Codon Germline Alleles and Tumor Predisposition node was an isolated pathograph component; it now has an incoming INDIRECT_UNKNOWN_INTERMEDIATES edge from the NRAS lesion node and outgoing edges to the three neoplasia phenotypes, and the cascade node was wired to Short Stature and Noonan Facial Gestalt. (7) An explanation over-claiming a neurodevelopmental dimension the quote did not mention was trimmed and backed with a GeneReviews cognitive-involvement quote.

    MINOR fixed: dropped an unsupported frequency band on Embryonal Rhabdomyosarcoma (single case, no denominator); swapped a second-hand background quote from PMID:21263000 for its first-party human sentence; removed a cohort nationality not present in the cached abstract; added PMID:41940405 as an independent clinical-cohort source for hearing loss in an NRAS mutation-positive patient; softened the exclusively-missense variant-class claim to note the reported in-frame switch-I duplication; changed a REFUTE on a KNOWLEDGE_GAP discussion to PARTIAL; and extended the scope note to record why datasets: and clinical_trials: are deliberately absent (dataset discovery returns only somatic NRAS-mutant cancer series reached by gene-only matching - the Named Entity Confusion trap - and the surfaced trials enrol Noonan syndrome generally with no NRAS subgroup).

    Not done, with reasons: no classifications: block (deferred, not raised as blocking); no progression/prognosis content (the available detail is parent-entity or paywalled full text); no NCIT term more specific than Supportive Care for cardiac surveillance was found.

    Validation actually run and read to completion after these changes: just validate kb/disorders/Noonan_Syndrome_6.yaml (schema: no issues; term validation: passed; 81/81 snippets verified against cached references); just compliance (97.4% global, 97.9% weighted, up from 94.3/94.8).

  summary: Add classifications, differential diagnoses and NRAS-dosage knowledge gap
  details: |
    Augmentation of an existing entry, not a creation: NS6 was already curated on main at 97.7% compliance with three prior sessions behind it, so this round filled the structural sections both sibling Noonan entries carried and this one did not.

    Added classifications: harrisons_chapter GENETICS_ENVIRONMENT_DISEASE and CARDIOVASCULAR, plus mechanistic_category RASopathy, which is the exact enum value for this entry - the causal lesion is a gain-of-function variant in a canonical RAS GTPase itself rather than in an upstream regulator or downstream kinase. Added differential_diagnoses with four entries: somatic NRAS-mutant myeloid neoplasia (the germline-versus-somatic call, which is the clinically consequential one here because the NS6 codons are the JMML somatic hotspots), other molecularly defined Noonan subtypes (NS6 is delimited by gene, not phenotype), Costello syndrome and the germline RASopathy group, and 1p13.2 microdeletion. Added a KNOWLEDGE_GAP discussion, ns6_haploinsufficiency_versus_gain_of_function, attached to both the NRAS variant node and the RAS-MAPK hyperactivation node: 1p13.2 deletions removing one NRAS copy produce an overlapping Noonan phenotype, which is a direct challenge to this entry's gain-of-function causal chain rather than an incidental observation, and the discussion records the three readings the published data do not separate. Its proposed experiment carries an NRAS gene binding and an ERK1/ERK2 cascade (GO:0070371) readout.

    Seven new references fetched and cached, all cited: PMID:42193013, PMID:41988663, PMID:41496802, PMID:40518121, PMID:40532825, PMID:40176696, PMID:27561113.

    Deep research. The falcon report from the 2026-08-18 session was used as the falcon basis rather than re-run, because re-running overwrites the committed artifact in place; it was given the Term Validation section it predated (51/51 terms resolved, every label matched). An independent openscientist run was commissioned for new leads and is committed, but it is OFF TARGET and must not be curated from: its body mentions RAF1 71 times and NRAS zero times, so it researched RAF1-related Noonan syndrome (NS5) throughout. just preflight-dr against MONDO:0013186 returns WARN with "Expected gene NRAS is never mentioned while RAF1 is mentioned 67 times". This is a textbook Named Entity Confusion case and a clean illustration of why the automated checks do not settle relevance: its reference validation is spotless (26/26 resolved, 0 off topic, confabulation rate 0.0) precisely because references are scored against the report's own vocabulary, which is RAF1 vocabulary. Its term validation separately flags four fabricated NCIT treatment bindings (NCIT:C2039 is Bevacizumab not beta-blockers, NCIT:C15380 is Telemedicine not heart transplantation, NCIT:C51756 is Roux-en-Y Anastomosis not septal myectomy, NCIT:C1968 is a Topoisomerase-II Inhibitor not growth hormone). Nothing from it was cited.

    Candidate rejected after checking. PMID:33855281 (Drosophila RASopathy models) looked like a strong third animal model, since its abstract names NRAS among the RASopathy genes and reports 13 transgenic lines each expressing a different human RASopathy isoform. The PMC full text itemizes the panel as six PTPN11, three RAF1, two BRAF, one KRAS and one HRAS isoform - there is no NRAS line. Adding it would have been fabrication from an abstract-level inference; its cache file was removed rather than committed uncited.

    Deliberate non-additions, both re-verified rather than assumed. The datasets block stays absent: just discover-datasets returns only GENE_ONLY candidates (AML, melanoma, glioma somatic NRAS series) with no DIRECT germline match, confirming the standing notes entry that dataset discovery for NS6 reaches only the Named Entity Confusion trap. A progression block was not added because the falcon report sources its entire temporal-development section to Altmuller 2017 (PMID:28594414), whose cache is a paywalled landing page carrying no quotable abstract - the same limitation the entry's notes already record for that cohort's frequency table.

    Validation. just validate-disorders passed over the changed file: schema clean, term validation passed, 104/104 snippets verified against cached references. Offline gates run and passing: check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-length, check-snippet-grading, check-title-snippets. Compliance reads 96.3% (232/241) against 97.7% (209/214) before: the compliant-item count rose by 23 while the rate dipped, because the new proposed experiment introduces datasets and evidence slots that a not-yet-run experiment cannot honestly fill.

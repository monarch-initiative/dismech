  summary: Record respiratory distress and the mouse-versus-human respiratory comparison
  details: |
    Follow-up to PR 16270, which curated this entry. Added a Respiratory distress phenotype (HP:0002098, OCCASIONAL) supported by the running-text feature list in the ClinGen gene-disease validity summary for NEMF; the earlier entry had left it unbound because the Martin et al. 2020 cohort reports it only in Table 1 (1 of 9 individuals). Added a HUMAN_MODEL_MISMATCH discussion comparing the Nemf D106 null mouse, which shows end-of-life respiratory distress with measured low oxygen saturation and phrenic nerve degeneration, with the human evidence: one tabulated individual (USA1-II:1, nonsense plus start-codon variants, phase undetermined) and no study of phrenic nerve or diaphragm in any patient. The discussion carries evidence from both sides and a proposed phrenic conduction and diaphragm assessment in patients. Updated the entry notes and the D106 readout interpretation, which had said no human phenotype was bound. Tremor stays unbound for the reason the notes give. Validated with just validate, validate-terms, count-verified-snippets (72/72) and the whole-tree gates.

  summary: 'Review round 1: deep-research sweep, evidence repairs, term corrections'
  details: |
    Answers the ai4c-reviewer changes-requested review on PR 16270. Blocker 1: ran the required deep-research sweep via just research-disorder claude_code (no provider API keys in this environment, so the claude_code provider that reuses Claude Code credentials was the available route); just preflight-dr returns PASS with NEMF named 36 times and OMIM 619099 matching. The sweep independently reproduced the same five-stage mechanism chain and the same GO bindings, which is some evidence the mechanism is right. Its Content-Completeness cross-check surfaced four real gaps, all now closed: a missing prevalence record (CASES_IN_LITERATURE, 26 cases in 14 kindreds), missing autistic-behavior, ADHD and flexion-contracture phenotypes, a missing orthopaedic-surgery treatment, and no differential_diagnoses; three differentials were added from the treating clinicians' own stated differential. The sweep also let the previously cached but uncited PMID:39312574 be cited properly, on the node whose description already reported its finding. Blockers 2 and 3 were real defects but the reviewer's suggested remedy could not work: quoting the Martin Table 1 grid rows is impossible because snippet normalization reduces non-word characters to spaces and so strips the plus and minus marks that carry the information, leaving the tremor row as the three words 'tremor n a' and the respiratory row as two words, both under the five-word floor and both asserting nothing. No running text in any cached source names tremor in a NEMF patient. So the Tremor and Respiratory distress phenotypes were removed, both findings recorded in entry notes with denominators, and the mouse respiratory finding kept as a readout on the D106 null model where phrenic nerve degeneration is motor axon degeneration rather than a separate organ phenotype. All five suggestions taken: HP:0002059 replaced by HP:0012444 Brain atrophy so no localisation is asserted that the source does not make, zygosity HOMOZYGOUS dropped because compound heterozygotes are reported, the D106 link changed to PARTIALLY_RECAPITULATES with its divergence split into PROXY_QUANTITY and TEMPORAL_SCOPE, CL:0000540 replaced by CL:0010012 cerebral cortex neuron, and denominators added to six frequency descriptions. The report carries one confabulated citation, PMID:19196966, which resolves to an unrelated gliomagenesis paper; it is not used anywhere in the entry and its cache file was not committed.

  summary: 'Create: Intellectual Developmental Disorder With Speech Delay And Axonal
    Peripheral Neuropathy'
  details: |
    Curated de novo from the stub (MONDO:0030849, NEMF) claimed in issue 16263. Mechanism is built as a five-node chain from biallelic NEMF loss of function through ribosome-associated quality control failure and accumulation of aberrant nascent chains, then forking into a developmental arm (impaired axon outgrowth and synapse assembly, from Nemf knockdown in cultured mouse cortical neurons) and a degenerative arm (motor axon loss with neuromuscular junction denervation, from three mouse models). GO had exact terms for both NEMF activities, including GO:0140708 CAT tailing, so the two-arm RQC defect is annotated rather than described only in prose. The ClinGen Strong (AR) tier is copied from its own CGGV record, which is for this exact MONDO term. Eighteen phenotypes bound to HP terms; six are deliberately left causally unconnected because the sources report them as findings without stating a mechanism, and that is recorded in notes rather than wired with invented edges. Two discussions: a KNOWLEDGE_GAP on whether the ubiquitylation-targeting or the C-terminal tailing arm is the operative defect in patients (the yeast experiments used missense-equivalent substitutions, while most human alleles are truncating and remove both), and a HUMAN_MODEL_MISMATCH on mouse nulls dying pre-weaning against patients surviving into their twenties with no cognitive phenotype measured in any mouse. No GeneReviews chapter exists, verified against the committed Bookshelf index and a live genereviews[book] PubMed query. During review of the first draft the reference validator caught two snippets misattributed to Ahmed 2021 that belong to Martin 2020; both were repointed to PMID:32934225.

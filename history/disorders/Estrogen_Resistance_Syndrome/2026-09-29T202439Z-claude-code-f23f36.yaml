  summary: 'Create: Estrogen Resistance Syndrome'
  details: |
    Curated MONDO:0014148 estrogen resistance syndrome, item 7 of #12925 and the claim in #13160. Deep research was requested from falcon, which is not configured in this environment; the run used --fallback and openscientist produced the report, which the runner renamed and stamped with fell_back and requested_provider rather than my substituting a provider by hand. The report reported needs_review true, with one unresolved reference (PMID:32934281), three unsupported quotes across PMID:32242619 and PMID:32152632, and six of sixteen references off topic; none of those was cited and no quoted material was reused from them. just preflight-dr returned WARN on a DES co-mention, which is diethylstilbestrol the drug rather than the desmin gene; ESR1 dominates the report at 39 mentions and the MONDO OMIM xref 615363 matches. Every ontology term was resolved from the committed caches or from OLS at the time of writing; the report's own CURIEs were not copied, and several were wrong, including HP:0003186 offered as Breast hypoplasia when that code is Inverted nipples, and HP:0000783 for primary amenorrhoea, which does not exist. PMID:30113650 was fetched and then not used because it is ESR2, a different gene. Thirty-five evidence items cite four papers: the 1994 male index case (PMID:8090165), the 2013 female index case (PMID:23841731), the 2017 consanguineous Algerian family (PMID:27754803), and a 2026 review distinguishing germline estrogen insensitivity from somatic breast-cancer ESR1 variants (PMID:42734155). Ten pathophysiology nodes carry the chain from the biallelic lesion through failed receptor transduction to the gonadotropic, ovarian, growth-plate, bone, breast, uterine and metabolic arms; all fifteen phenotypes are causally connected. An adversarial pre-PR review pass drove substantial revision. Four claims were narrowed or corrected against the entry's own sources: the receptor was described as expressed but non-transducing, which is true of the two missense alleles and false of the male index case's homozygous nonsense allele at codon 157; tall stature and the metabolic findings were stated as syndrome features when the female index case lacked both, and both now carry REFUTE evidence recording the discordance; dyslipidaemia was asserted in the description with no citation and was removed; and the uterine phenotype rested only on mouse knockout data until the human ultrasonography sentence was added. Two ontology bindings were changed: HP:0002663 Delayed epiphyseal ossification was dropped because it names late appearance of the ossification centre rather than failure of the physis to close, and that phenotype is now unbound with the three HPO searches recorded in its notes; HP:0000938 Osteopenia was replaced by HP:0000939 Osteoporosis because both measured cases exceed 2.5 standard deviations. The bone node was re-modelled from a mineralisation deficit to a remodelling imbalance, conforming to osteoporosis_bone_resorption#Bone Remodeling Imbalance, because both sources report increased turnover. Two evidence items graded HUMAN_CLINICAL were regraded IN_VITRO, since they describe bench work on the mutant receptor. Two bundled nodes were split and a missing intermediate, gonadotropin-driven ovarian steroidogenesis, was added so the ovarian findings hang off gonadotropin drive rather than directly off receptor failure. check-genereviews --online reports NO_CHAPTER for both Bookshelf collections with the four MONDO synonyms present. No prevalence record is curated and the reason is recorded in notes. Validated with just validate-disorders over this file and the four edited entries (291 snippets, 313 titles, 0 issues), plus validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes and list-gene-term-mismatches, all clean. Compliance 79.3 percent.
  summary: 'Create: Estrogen Resistance Syndrome'
  details: |
    Curated MONDO:0014148 estrogen resistance syndrome, item 7 of #12925 and the claim in #13160. Deep research was requested from falcon, which is not configured in this environment; the run used --fallback and openscientist produced the report, which the runner renamed and stamped with fell_back/requested_provider rather than my substituting a provider by hand. The report reported needs_review: true (1 unresolved reference PMID:32934281, 3 unsupported quotes across PMID:32242619 and PMID:32152632, 6 of 16 references off topic), so none of those were cited and no quoted material was reused from them. just preflight-dr returned WARN on a DES co-mention, which is diethylstilbestrol the drug rather than the desmin gene; ESR1 dominates the report at 39 mentions and MONDO's OMIM xref 615363 matches. Every ontology term was resolved from cache/hp, cache/go, cache/cl, cache/chebi or OLS at the time of writing; the report's own CURIEs were not copied, and several were wrong (it labels HP:0003186 'Breast hypoplasia', which is Inverted nipples, and HP:0002644 'Delayed epiphyseal ossification', which is Abnormal pelvic girdle bone morphology). Eleven evidence items cite five papers: the 1994 male index case (PMID:8090165), the 2013 female index case (PMID:23841731), the 2017 consanguineous family (PMID:27754803), a 2026 review distinguishing germline EIS from somatic breast-cancer ESR1 variants (PMID:42734155), and the long-term follow-up (PMID:32152632). PMID:30113650 was fetched and then not used because it is ESR2, a different gene. Estrogen pharmacotherapy is curated with supports: REFUTE, since the ligand reaches the tissue and produces no response. check-genereviews --online reports NO_CHAPTER for both collections with synonyms present. Validated with just validate (11/11 snippets, 13 titles), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms, all clean.

  summary: Rescue two items from the closed duplicate PR 13176
  details: |
    PR #13176 curated this disease in parallel with #13174 and was closed in
    favour of it. A content-by-content comparison against the merged entry found
    two things in that branch worth keeping; both are carried here and both were
    verified against the cached sources rather than taken on trust.

    First, a curation hazard warning, now the opening paragraph of notes. The
    germline biallelic ESR1 variants that cause this syndrome and the somatic
    ESR1 variants that emerge under endocrine therapy in breast cancer are
    opposite lesions in one gene, and a literature search on the gene symbol
    alone returns mostly the latter. The merged entry carried that contrast only
    inside an evidence explanation on the receptor-signalling node, where a
    curator opening this disease would not see it. The factual half is supported
    by PMID:42734155, already cited on that node; the search-behaviour half is
    stated as curation guidance rather than as a sourced claim.

    Second, an evidence item recording that alternative receptor-activating
    ligands were screened and failed. PMID:27754803 reports that a group of
    other potential ER activating ligands was tested and none overcame the
    insensitivity. The merged entry documented the failure of estradiol,
    diethylstilbestrol and tamoxifen in patients but not that a systematic
    ligand search had been tried, which is the stronger claim: the failure is a
    property of the receptor rather than of the particular ligand. Graded
    IN_VITRO and REFUTE, on the Estrogen Administration record beside the
    diethylstilbestrol items. The snippet was confirmed to be an exact substring
    of the already-committed cache file and to appear nowhere in the merged
    entry before this change.

    Five further pieces of that branch were examined and deliberately not taken.
    Its Breast hypoplasia (HP:0003187) is weaker than the merged Breast aplasia
    (HP:0100783), since every source describes breast development as absent. Its
    Ovarian cyst (HP:0000138) is broader than the merged Enlarged polycystic
    ovaries (HP:0008675). Its Reduced bone mineral density (HP:0004349) is the
    HPO parent of Osteoporosis (HP:0000939), which the entry already binds, so
    taking both would be a parent and child on one finding. Its Unfused
    epiphyses phenotype carries no term, and no suitable HPO term exists, so the
    merged entry's Failure of Epiphyseal Fusion mechanism node remains the right
    home for it. Its ten-node chain splits breast from uterus and adds a
    gonadotropin-driven ovarian steroidogenesis intermediate; both are
    defensible, but the merged seven-node shape came out of a review round and
    restructuring it now would risk regressions for a marginal gain.

    For the record, that branch cited 4 references against the merged entry's
    16, with none unique to it, and had no diagnosis, prevalence, progression,
    biochemical, animal model, differential diagnosis or mappings section.


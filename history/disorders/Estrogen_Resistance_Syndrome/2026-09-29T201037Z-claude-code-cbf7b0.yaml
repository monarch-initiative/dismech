  summary: 'Create: Estrogen_Resistance_Syndrome'
  details: |
    Seventh tranche of the estrogen-signalling work in issue #12925, the one
    disease in which ESR1 sits on a mechanism node by definition. Claim issue
    #13160. The IEMbase comparison note (IEMBASE-0130, July 2026) had judged
    this a true unmapped disease gap; no stub existed, so a stub was added in
    the commit before this one and retired by it. The MONDO cross-references are
    the phenotype record OMIM:615363 and Orphanet:785; OMIM:133430, which the
    IEMbase note recorded, is the ESR1 gene record, and the mapping justification
    says so. Aromatase_Deficiency is the differential, not the target.

    Deep research. falcon was requested and had no key in this environment, so
    the run used the recorded fallback and openscientist produced the report
    (fell_back, requested_provider and provider_attempts are in its frontmatter).
    Its reference validation resolved 17 of 17 citations with none off topic;
    four quoted claims were not found in the abstract-only sources, and none of
    those quotes is used here. Term validation was retro-fitted after a network
    reset aborted the in-run check: one invented HPO identifier (HP:0000783,
    offered as primary amenorrhea) and five mislabelled ones, none of which the
    entry uses; primary amenorrhea is bound to HP:0000786 from a live lookup.
    just preflight-dr passed: ESR1 named 39 times, OMIM 615363 matched. Three of
    the report's citations were adopted after reading their cached abstracts,
    the long-term follow-up of the first female case (PMID:32152632), the 1998
    skeletal review (PMID:9554463) and the 2022 overview of congenital estrogen
    disorders (PMID:34538723). The report's circadian, AMH-promoter, cryo-EM,
    bisphenol and breast-cancer citations are about the receptor's biology or a
    different disease and were not used. Its suggested bisphosphonate therapy
    carries no source and was not added.

    Primary sources were found by PubMed title search rather than from the
    report: the 1994 index male (PMID:8090165) and his bone follow-up
    (PMID:18505767), the first female (PMID:23841731), the Algerian siblings
    (PMID:27754803), the Jordanian sisters (PMID:35134944), the 2024
    adolescent case (PMID:39295121), the 2025 case with p.Met543Thr
    (PMID:40032016), the Q375H and R394H functional studies (PMID:32963012,
    PMID:32242619), the alpha-ERKO mouse (PMID:8248223), the ESR2 case used as
    a differential (PMID:30113650) and the 2026 review contrasting germline and
    somatic ESR1 variants (PMID:42734155). The heterozygous p.Ala207Thr variant
    in a woman with polycystic ovary syndrome (PMID:36401248) is excluded from
    the genetic record with the reason stated in its notes.

    No GeneReviews chapter exists; just check-genereviews reports NO_CHAPTER with
    synonyms present, and a PubMed book search agrees. Orphanet:785 could not be
    quoted because the Orphadata cache in this checkout has no record for it.

    Shape. The pathograph runs MOLECULAR (ESR1 loss of function, with
    genetic_context and GO:0030284 modifier LOSS_OF_FUNCTION, a qualitative loss
    of the receptor's own function) to CELLULAR (loss of receptor signalling,
    GO:0030520 ABSENT) and then branches to four consequences: loss of
    gonadotropin negative feedback (ORGANISM), failure of estrogen-dependent
    epiphyseal maturation and bone mineral accrual (TISSUE), failure of
    estrogen-dependent female reproductive development (TISSUE), and insulin
    resistance (ORGANISM). Every phenotype is reached by a causal edge. Two
    animal models are linked with readouts, the receptor-null mouse and the
    Q375H knock-in. The treatment record documents estrogen and
    diethylstilbestrol administration with REFUTE items for the skeletal and
    pubertal outcomes and one SUPPORT item for the metabolic benefit.

    Red-team review before opening the pull request found two blocking
    problems and they are fixed here. First, the description, the metabolic
    node and the inheritance block asserted as universal what the cached full
    text of PMID:23841731 contradicts: that proband lacked the pubertal growth
    spurt, stayed below the 50th height percentile, had a normal insulin
    resistance index, and was adopted with no parental samples. Tall stature
    and the metabolic phenotype are now reported as usual rather than
    invariable, with a REFUTE evidence item carrying the normal-metabolism
    sentence, and relatedness is stated for the four families that document
    it. Second, the skeletal node bundled growth-plate non-fusion with
    high-turnover bone loss, two mechanisms at one scale feeding different
    phenotypes; it is split into Failure of Epiphyseal Fusion and Increased
    Bone Resorption with Failed Mineral Accrual.

    The same review produced six further changes. GO:0030520 and GO:0071392 on
    the signalling node moved from ABSENT to DECREASED, because the
    ligand-binding-domain alleles retain measurable signalling at
    supraphysiological estradiol. The edge to the metabolic node moved from
    DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES. Uterine hypoplasia (HP:0000013)
    and absent pubertal growth spurt (HP:0031087) were added as phenotypes,
    both quoted from cached sources. A progestin treatment was added: it is
    the only reported intervention that changes a phenotype in this disease,
    and the source reads the ovarian response as intact
    progesterone-receptor feedback. Tamoxifen was split out of the estrogen
    treatment, since a selective modulator is a different class. A hepatic
    binding-protein record was added as the cleanest biochemical readout of
    the resistance: those proteins do not rise despite high estradiol.

    Review round on PR #13174. The reviewer found that
    Enlarged polycystic ovaries had no inbound edge, so the entry was at 14 of
    15 connected phenotypes and the pull request body claimed 15. The claim was
    stale rather than invented: the check had been run before a late edit that
    removed the ovarian target from the reproductive-development node's
    downstream list and did not re-home it. The count is now verified at 15 of
    15 after the fix rather than carried over.

    The underlying modelling problem the reviewer identified was real. The
    reproductive-development node carried two mechanisms: the receptor failing
    in breast and uterus, and ovarian enlargement driven by unopposed
    gonadotropins. The gonadotropin-feedback node now points at the ovarian
    phenotype directly, carrying the sister-pair evidence and the mouse
    evidence, and the reproductive node is scoped to the two tissues the
    receptor fails in, losing its ovary and granulosa-cell bindings and its
    ovarian-follicle process term.

    Four further review items were taken. Three snippets were trimmed: one
    began with a reference superscript carried in from the full text, and two
    ended mid-parenthesis at a figure callout. The 204 cm height quoted in the
    Tall stature description is in the cached abstract and is now cited, with
    the imperial conversion truncated because bracketed spans are stripped
    before matching, alongside a REFUTE item recording the proband who had no
    growth spurt. The entry description no longer says estrogen action is
    simply absent, since the signalling node is deliberately DECREASED for the
    hypomorphic alleles. A diagnosis record was added, reusing the
    high-estradiol-with-high-gonadotropins signature, the unraised hepatic
    binding proteins, and ESR1 sequencing.

    Checks after the review round: validate, validate-terms and
    count-verified-snippets (89/89) pass;
    check-genereviews NO_CHAPTER; list-gene-term-mismatches finds both ESR1
    bindings named by the entry; list-disconnected-phenotypes reports 15 of 15
    phenotypes connected; check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-qualifier-terms, check-enum-values and
    check-coarse-phenotypes pass. validate-disorders over the tranche and the
    remaining offline gates are recorded in the pull request.

  summary: 'Create: Aquarium Granuloma'
  details: |
    Created a de-novo Aquarium Granuloma entry for MONDO:0043314. Curated Mycobacterium marinum as the infectious agent; traumatic freshwater or saltwater inoculation as the acquisition route; papules, cutaneous nodules, ulceration, sporotrichoid nodular lymphangitis, tenosynovitis, septic arthritis, and osteomyelitis as connected phenotypes; tissue culture and histopathology as the diagnostic pathway; and multidrug antimycobacterial therapy plus surgical debridement for deep infection. Added cache-backed evidence from focused M. marinum and cutaneous nontuberculous-mycobacteria reviews plus a clinical series. Deep research: one claude_code run, committed; reference_validation resolved 55/55 references with 0 not_found and term_validation resolved 94/94 terms. just preflight-dr returned SKIP because MONDO records no causal gene for this infectious disease, so the gene-identity heuristic cannot discriminate; the MONDO ID, synonym set, and infectious-agent identity were checked independently before curation.

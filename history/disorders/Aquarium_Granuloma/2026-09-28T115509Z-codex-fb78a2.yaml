  summary: 'Respond to PR review: expand granuloma, exposure, and course coverage'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #13069. Split the original cutaneous-infection node into dermal inoculation/replication, granulomatous dermal inflammation, sporotrichoid lymphatic dissemination, and deep contiguous extension. The dermal granuloma node now conforms to granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation, carries macrophage, epithelioid macrophage, multinucleated giant-cell, and granuloma-formation bindings, and links onward to both lymphatic dissemination and deep extension. Added environmental records for aquatic skin-trauma exposure and lesion-site intralesional corticosteroid injection, with explicit influences_mechanisms targets. Added population incidence, incubation timing, plaque and tenosynovitis phenotypes and cohort frequencies, a histopathology block for the suppurative-to-well-formed-granuloma spectrum, T-SPOT.TB and hsp65 PCR/NGS diagnostic records, and cure-rate and surgical-debridement treatment evidence. Left the histopathology finding term unbound because NCIT:C3064 is outside the HistopathologyFindingTerm dynamic enum.

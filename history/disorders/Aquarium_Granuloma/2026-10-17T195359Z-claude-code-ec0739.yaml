  summary: 'Review round 1: replace IGRA concentration code with the ELISpot spot-count
    panel'
  details: |
    Review round 1 on PR #14689. The reviewer found that the note on the T-SPOT.TB row asserted LOINC:46217-6 was the T-SPOT.TB format, and that this is wrong: 46217-6 carries property Arbitrary Concentration with example units IU/mL, which is the whole-blood immunoassay readout, whereas T-SPOT.TB is an ELISpot reporting spot-forming cell counts. The reviewer could not reach the pinned table from the review sandbox and asked for the 33 stimulated gamma interferon rows to be checked for a count-type or ELISpot code.

    Checked, and such codes exist. Re-downloaded the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 448bc5a561a9f75ae0ef67f86777ea6f7bc5597562ec21066971e23dd7794551 verified against the manifest, snapshot_date 2026-10-07) and read all 112,405 rows. Of the 33 rows whose long common name contains stimulated gamma interferon, four carry property Number (count): 74277-5 (CFP10 Ag spot count), 74278-3 (ESAT-6 Ag spot count), 74280-9 (mitogen positive control spot count), and the panel 74281-7 (stimulated gamma interferon and spot count panel, class Microbiology Panels, paneltype Panel). The sibling panel 71775-1 is the concentration-only panel with no spot count.

    The binding was replaced accordingly: 46217-6 out; 74281-7 as the identity of the assay, per the panel-level identity rule, plus 74278-3 and 74277-5 as the two antigen spot counts the row's own description names as the basis for cross-reactivity with M. marinum. 74280-9 was left unbound as a run control rather than a measurement of the patient's response, and the note now says so.

    The cache row for 46217-6 was kept rather than removed: projects/LOINC_DIAGNOSTICS.md cites that CURIE as the generic tranche-B TB IGRA scope example, which the reviewer agreed is a legitimate use.

    The three new codes were seeded by the term validator against the Monarch KG, and the labels copied from cache/loinc/terms.csv; no label was typed. All three resolved with labels identical to the pinned export. The justfile has no loinc-seed-cache recipe on this branch, and the committed scripts/seed_loinc_cache.sh calls the linkml-term-validator console script, whose shebang bypasses the uv overlay; the module entry point was used instead.

    Validation: just validate-disorders over the three changed files, 0 issues, 258 snippets and 268 titles checked. check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments all clean. tests/test_loinc_measurement_schema.py 23 passed.

  summary: Bind LOINC TB IGRA and M. marinum nucleic acid codes
  details: |
    LOINC tranche B batch 27. The T-SPOT.TB row takes LOINC:46217-6 (Mycobacterium tuberculosis stimulated gamma interferon release by CD4+ T-cells, Blood), which is the T-SPOT.TB format described by what it measures. The M. tuberculosis antigen in the code name is correct rather than a mismatch: the assay is built on those antigens and this row exists precisely because M. marinum shares ESAT-6 and CFP-10 with them. The quantitative code was chosen over the qualitative interpretation code, which names a result field rather than a measurement.

    Finding the code required searching the indexed name rather than the brand name: a query for T-SPOT returns zero rows in the complete LOINC 2.83 table, while the indexed phrase stimulated gamma interferon returns 33. A zero on the brand name would have supported a false absence claim.

    The molecular species identification row takes LOINC:103625-0 (M. marinum DNA in Specimen by NAA with probe detection), specimen-level because the row names tissue or culture material rather than one site; LOINC's other M. marinum code is qualified to wound, which is narrower than the row.

    The tissue culture row is left unbound. No M. marinum culture code exists, and the only mycobacterial culture code is genus-level, which would not carry that row's species claim; it is also in flight on another branch.

    Absence and enumeration basis: the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows, so the result set is complete rather than a ranked page. Part-level questions were taken to the Monarch KG instead, because that export carries no LP or LG rows at all. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 261 LOINC rows added by all 44 open loinc PRs, enumerated with pagination: no collision.

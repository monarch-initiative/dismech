  summary: Detailed claim-by-claim evidence review of Papillary Thyroid Carcinoma;
    added evidence to 2 unsupported phenotypes and anchored driver node
  details: |
    Manual (non-scripted) claim-by-claim review of every evidence-bearing claim against its cited snippet.

    VERIFIED (all snippets confirmed exact substrings of the cited abstracts, cross-checked against references_cache; schema + term + reference validators all pass):
    - pathophysiology Driver Alterations / MAPK Hyperactivation / Aggressive Progression nodes (PMID:39502057, 41175860, 41368991) — snippets verbatim and semantically support the driver->MAPK->dedifferentiation model.
    - histopathology (PMID:21221869, >70% of thyroid malignancies), thyroglobulin IHC (PMID:21221869), molecular driver testing (PMID:39502057).
    - genetic BRAF/RET/RAS/TERT (PMID:41368991, 41419184, 39502057, 41175860) — all verbatim; BRAF nodal/recurrence association matches the 20,570-patient meta-analysis conclusion.
    - environmental radiation (PMID:21221869).

    FIXED immediate problems (unsupported claims now cited, all validate):
    - phenotype 'Thyroid Nodule' had NO evidence -> added PMID:24276450 (JCEM meta-analysis of 18,288 nodules; PTC = most common malignancy, 84%).
    - phenotype 'Cervical Lymphadenopathy' had NO evidence -> added PMID:29329789 (Int J Surg meta-analysis; LNM frequent in PTC).
    - Driver Alterations node described drivers as 'early' but its only citation (PMID:39502057) says 'common', not 'early'/'primary' -> added PMID:41175860 ('primary molecular events') to anchor the early/primary framing.

    OUTSTANDING (deferred to GitHub issue, not blocking): no structured prevalence: block; diagnostic PTC nuclear features (Orphan-Annie nuclei, grooves, psammoma bodies) absent from histopathology; several notes-field claims (RET radiation-association, childhood-radiation risk, serum thyroglobulin monitoring) are textbook but uncited; MAPK-node 'cell population proliferation' GO term not directly quoted by attached snippets; BRAF prognostic nuance (PMID:41419184 found no effect on distant mets/mortality) could be surfaced.

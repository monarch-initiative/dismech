  summary: Add cabozantinib (COSMIC-311) for VEGFR-TKI-refractory DTC
  details: |
    Curation-scanner (high_effort) run for issue #6067 (preprint-scan: treatment-resistance systematic review, PPR:PPR1274359). The preprint names cabozantinib in radioiodine-refractory differentiated thyroid cancer as one of six GRADE high-certainty therapeutic contexts. Both differentiated thyroid cancer entries already carried lenvatinib/sorafenib (first-line RAI-refractory) but had no coverage of the second-line, VEGFR-TKI-refractory setting. Added a Cabozantinib treatment (NCIT:C93352 Targeted Therapy, CHEBI:72317 cabozantinib, therapeutic_modality SMALL_MOLECULE) with exact-quote snippets from the peer-reviewed COSMIC-311 report (PMID:34237250) covering the refractory population, the randomised PFS benefit, and the grade 3-4 toxicity burden; the preprint is cited only as corroborating GRADE-certainty evidence alongside it, never as sole support. COSMIC-311 enrolled papillary and follicular histologies and their variants, which is why both entries are updated; the follicular entry quotes that eligibility sentence explicitly. The papillary entry additionally records the COSMIC-311 registration (NCT03690388, PHASE_III, ACTIVE_NOT_RECRUITING per the ClinicalTrials.gov API on 2026-08-16). Validated with linkml-validate (no issues), just validate-terms (passed), and the batched pre-PR sweep just validate-disorders over both changed files: 56/56 snippets verified, with only pre-existing EGA dataset-fetch warnings remaining.

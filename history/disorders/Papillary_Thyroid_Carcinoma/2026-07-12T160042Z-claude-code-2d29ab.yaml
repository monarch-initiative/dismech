  details: |
    Curation pass addressing the content gaps filed in GitHub issue #6306.

    Changes made:
    1. HISTOPATHOLOGY: Added "Papillary-Type Nuclear Features" entry (VERY_FREQUENT, diagnostic:true) describing
       nuclear grooves, optically clear chromatin, and intranuclear pseudoinclusions; evidenced by PMID:26271724
       (Tallini et al. 2015 multicenter microcarcinoma study, snippet: "nuclear grooves, optically clear nuclei").
    2. HISTOPATHOLOGY: Added "Psammoma Bodies" entry (OCCASIONAL) as notes-only (no evidence block per SOP
       option A; feature is universally recognized but no suitable abstract-level quote was available in the
       reference cache).
    3. PREVALENCE: Added structured prevalence block (measure_type: ANNUAL_INCIDENCE, prevalence_class: COMMON,
       population: Worldwide) citing PMID:21221869 (">70% of thyroid malignancies") and PMID:26462967 (ATA 2015
       guidelines "differentiated thyroid cancer is becoming increasingly prevalent"). Note on MONDO:0005075
       sharing with BRAF_Mutant_Thyroid_Cancer and RET_Fusion_Thyroid_Cancer sibling entries added to notes.
    4. BIOCHEMICAL: Added serum thyroglobulin surveillance evidence (PMID:26462967 ATA 2015 guidelines,
       snippet: "surveillance for recurrent disease using imaging and serum thyroglobulin"), complementing the
       existing IHC-at-metastatic-sites citation (PMID:21221869).
    5. GENETIC BRAF: Updated notes to reflect null finding on distant metastasis (OR=0.75) and disease-specific
       mortality (OR=0.97) from PMID:41419184 meta-analysis; added PARTIAL evidence item with the limiting
       conclusion quote from the same paper.
    6. PATHOPHYSIOLOGY: Removed GO:0008283 (cell population proliferation, INCREASED) from the
       MAPK Pathway Hyperactivation node. Neither PMID:41175860 nor PMID:41368991 uses the word
       "proliferation" in their abstracts; the GO:0000165 (MAPK cascade) term is sufficient.

    Not addressed in this pass (deferred):

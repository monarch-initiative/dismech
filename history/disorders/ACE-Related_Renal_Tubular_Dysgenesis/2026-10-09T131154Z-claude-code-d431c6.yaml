  details: |
    New entry for ACE-related renal tubular dysgenesis (MONDO:0700337), biallelic ACE loss of function. Curated from the OpenScientist deep-research report (research/ACE-Related_Renal_Tubular_Dysgenesis-deep-research-openscientist.md) plus primary literature fetched directly; preflight-dr returned PASS (ACE mentioned 72 times, OMIM 267430). The report reference_validation block reported 24/25 references verified with only PMID:14713115 unresolved (the kidney critmeter EPO paper), which was NOT cited; the term_validation block flagged label mismatches that were the report mislabelling HP/GO terms by phenotype type rather than wrong CURIEs, so each term was re-looked-up against OLS/caches before binding. 10-node hemodynamic causal chain from ACE LOF to proximal-tubule arrest, hypotension, Potter sequence, survivor CKD and anemia; 26 phenotypes (19 causally connected); Ace-null mouse (PARTIALLY_RECAPITULATES) and RAAS-deficient iPSC kidney organoid (FAILS_TO_RECAPITULATE) models; REN/AGT/AGTR1, drug-related, twin-twin-transfusion, ARPKD and RMND1 differentials; ClinGen DEFINITIVE gene-disease validity. Validated with just validate (79/79 snippets, 0 issues), validate-terms (passed), check-entity-refs, check-causal-targets, check-gene-activity-grounding (no new ungrounded genes), check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, validate-disorders. The cited ClinGen CGGV record was rebuilt from a ClinGen CSV snapshot dated 2026-10-04, newer than the pinned manifest (known issue dismech#13575). No GeneReviews chapter exists (NO_CHAPTER offline and online).

  summary: 'Create: CAPOS Syndrome, MONDO:0011038, ATP1A3 p.Glu818Lys'
  details: |
    Created kb/disorders/CAPOS_Syndrome.yaml de novo for cerebellar
    ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss
    syndrome, MONDO:0011038, ATP1A3 c.2452G>A p.Glu818Lys.

    NEC PREFLIGHT. MONDO:0011038 was verified with OAK before curation:
    OMIM:601338, Orphanet:1171, is_a MONDO:0700002 ATP1A3-associated
    neurological disorder. The ATP1A3 spectrum is a high named-entity-confusion
    risk class - AHC, RDP/DYT12, CAPOS and RECA/FIPWE are allelic but distinct -
    and residue numbering is a specific trap because the common AHC allele
    p.Glu815Lys is only three residues from the CAPOS p.Glu818Lys. Every
    genotype claim is anchored to the c.2452G>A nucleotide coordinate as well as
    the protein change. kb/disorders was checked for pre-existing ATP1A3
    entries: Alternating_Hemiplegia_of_Childhood.yaml and Auditory_Neuropathy.yaml
    already reference ATP1A3, but CAPOS itself was not curated.

    CONTENT. Six-node pathophysiology chain forming a single connected component
    with no orphan nodes: ATP1A3 p.Glu818Lys pump dysfunction (MOLECULAR) ->
    impaired neuronal transmembrane ion-gradient restoration (CELLULAR) ->
    febrile illness unmasking of pump reserve failure (ORGANISM) -> acute
    febrile encephalopathy and cerebellar decompensation -> incomplete recovery
    and stepwise deficit accrual (central effector), which branches to
    persistent multimodal neurological deficit and to auditory neuropathy with
    preserved outer hair cell function. Fifteen phenotypes with HPO bindings,
    each naming in its description the pathophysiology node that generates it.
    Structured prevalence using CASES_IN_LITERATURE and ULTRA_RARE, with
    rate_per_100000 deliberately omitted because the denominator is unknown and
    ascertainment is driven by targeted sequencing. A separate diagnosis section
    covering ATP1A3 targeted sequencing, OAE/CM-plus-ABR audiology and brain
    MRI, deliberately kept out of treatments. Five treatments including a
    mechanism-linked fever-management entry using target_mechanisms INHIBITS on
    the febrile-unmasking node. A definitions entry with derivation_basis
    MECHANISTIC_HYPOTHESIS and validation_status PROPOSED - a fever-associated
    acute ataxia EHR case-finding query - which attaches_to the fever-trigger
    and stepwise-accrual nodes and is modelled on the Brugada_Syndrome and
    Timothy_Syndrome worked examples. One mechanistic_hypotheses group,
    fever_triggered_pump_reserve_failure, status EMERGING. Three discussions:
    two KNOWLEDGE_GAP entries (degeneration versus persistent dysfunction;
    allelic lesion-set selectivity) and one HUMAN_MODEL_MISMATCH
    (heterologous-expression kinetics versus febrile human neurons).

    MODULE CONFORMANCE DELIBERATELY DECLINED for both candidate modules, with
    the reasoning recorded in the entry notes rather than left implicit.
    sensorineural_hair_cell_loss was rejected because its central effector is
    "Hair Cell Mechanotransduction Failure and Death", whereas CAPOS
    demonstrably preserves outer hair cell function (intact otoacoustic
    emissions and cochlear microphonic potentials) and the lesion is primary
    auditory-nerve dyssynchrony; declaring conformance would assert a mechanism
    the CAPOS evidence specifically excludes.
    cerebellar_purkinje_degeneration was rejected because its central effector
    is apoptotic Purkinje neuron loss with cerebellar atrophy and gliosis, and
    CAPOS has no published neuropathology, frequently unremarkable MRI, and only
    a single reported case of mild cerebellar atrophy; whether it eventually
    qualifies is exactly the capos_degeneration_vs_dysfunction knowledge gap.

    EVIDENCE. Ten references, all fetched with `just fetch-reference` and never
    hand-edited: PMID:20301294 (GeneReviews ATP1A3-Related Disorder, tagged
    GeneReviews in the top-level references block as the mandatory phenotype
    baseline), PMID:24468074 (Demos gene discovery), PMID:25895915 (Heimer CAOS
    third allelic disorder), PMID:27091223 (Maas genetic homogeneity and
    acetazolamide), PMID:28483396 (Duat Rodriguez systematic review and case
    count), PMID:29305691 (Tranebjaerg auditory neuropathy plus heterologous
    expression), PMID:30409907 (Roenn JBC E818K pump kinetics), PMID:34692702
    (Wang auditory neuropathy and cochlear implant outcomes), PMID:36192182
    (Vezyroglou phenotypic continuum), PMID:36484864 (Huang Chinese ATP1A3
    cohort). evidence_source was assigned by publication type, not by curation
    method: IN_VITRO for the Xenopus oocyte and heterologous-expression pump
    electrophysiology and biochemistry, COMPUTATIONAL for the in-silico
    structural destabilisation prediction, HUMAN_CLINICAL for the clinical
    series. No in vivo animal data are cited, so no MODEL_ORGANISM items appear.
    Conflicting evidence was retained rather than smoothed: acetazolamide
    prophylaxis carries two PARTIAL supports and one REFUTE, and cochlear
    implantation carries three PARTIAL items spanning a favourable and an
    unfavourable reported outcome.

    DEEP RESEARCH NOT PRODUCED - declared deviation. `just research-disorder
    claude_code CAPOS_Syndrome` was invoked at the start of the session but
    exits non-zero when the target disorder file does not yet exist in
    kb/disorders/ (it validates the disorder name against the existing KB). The
    run was not repeated after the file was created, because the session was
    interrupted twice (an account-level rate limit and a container restart) and
    the remaining budget was spent on validation and review-readiness instead.
    Curation was therefore built directly from primary literature identified via
    NCBI E-utilities PubMed search, with the GeneReviews ATP1A3-Related Disorder
    chapter as the mandatory phenotype baseline per the
    initiate-new-disorder-creation skill. This deviation is recorded explicitly
    in the entry notes as well as here, and a deep-research artifact for CAPOS
    remains an outstanding follow-up.

    VALIDATION. `just validate` - all validations passed. `just validate-terms` -
    validation passed. `just validate-references` - Snippets checked 78/78
    verified against cached references, 0 issues.

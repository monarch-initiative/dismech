  summary: 'Create: CAPOS Syndrome'
  details: |
    De-novo curation of CAPOS syndrome (MONDO:0011038, ATP1A3 c.2452G>A p.Glu818Lys). Built from the GeneReviews ATP1A3-Related Disorder baseline (PMID:20301294), the discovery paper (PMID:24468074, full text used for the 10-patient phenotype-frequency table), the original 1996 syndrome description (PMID:8733056), the definitive audiological/biophysical study (PMID:29305691), the E818K functional study (PMID:30409907), Han 2017 auditory synaptopathy (PMID:29184165, full text), and eight further CAPOS-specific reports; plus the Orphanet structured record ORPHA:1171. Content: 24 HPO-bound phenotypes (frequency bands only where a published count exists), 9 pathophysiology nodes with biological_scale tags and causal downstream edges modelling ATP1A3 alpha-3 pump dysfunction to impaired neuronal ion-gradient restoration to febrile decompensation to acute ataxic encephalopathy to cumulative cerebellar, auditory-synaptopathic, optic and peripheral-reflex injury; an explicit Febrile Illness trigger node plus an EMERGING mechanistic_hypotheses group (febrile_pump_reserve_failure) that the relevant causal edges opt into; a structured Prevalence record (CASES_IN_LITERATURE / ULTRA_RARE, no fabricated rate); a 3-phase progression; genetic and variants blocks for the recurrent p.Glu818Lys allele; 3 diagnosis entries; 3 differential diagnoses; 8 treatments with NCIT terms and therapeutic_modality; 1 observational clinical trial; and 2 discussions (KNOWLEDGE_GAP on the untested fever/temperature step, OPEN_QUESTION on the substrate of areflexia). Module conformance to cerebellar_purkinje_degeneration and sensorineural_hair_cell_loss was evaluated and deliberately DECLINED, with reasoning recorded in notes: CAPOS preserves outer hair cell function (otoacoustic emissions and cochlear microphonics intact) so the hair-cell-death module inverts the real mechanism, and no CAPOS study demonstrates Purkinje cell loss. Deep research: an Edison/Falcon report was read in full and used only as a lead generator; three of its suggestions were verified wrong and discarded (HGNC:806 instead of hgnc:801; HP:0031869 for auditory neuropathy, which is actually Recurrent joint dislocation; HP:0001250 for episodic ataxia, which is actually Seizure). Validation: just validate (schema plus terms plus references) passes with 115/115 snippets verified against cached abstracts; just validate-terms passes; compliance 85.5 percent global and 85.7 percent weighted. Note: CLAUDE.md still documents MAXO treatment terms, but MAXO was removed from the schema in #7228, so all treatment terms here use NCIT. No PR was opened: PR #7454 already covers this disorder and this branch is retained as an independent cross-check.

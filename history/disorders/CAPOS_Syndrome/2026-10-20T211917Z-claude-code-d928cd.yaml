  summary: 'Remove channelopathy_category: ATP1A3 is an ion pump'
  details: |
    Removed classifications.channelopathy_category (neurological channelopathy). ATP1A3 encodes the Na+/K+-ATPase alpha-3 subunit, an ion pump, and the new Channelopathies grouping requires an ion channel or ion channel regulator activity; the entry curates only GO:0005391 P-type sodium:potassium-exchanging transporter activity. The removed classification note is replaced by a paragraph in notes explaining the decision. The maintainer chose this narrower sense of channelopathy over admitting pumps. Validated with just validate-disorders and the strict offline grouping audit.

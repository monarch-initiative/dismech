  summary: 'Review response: deep-research artifact + cross-check curation (PR #7454)'
  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES on PR #7454 (one IMPORTANT process gap, no CRITICAL), plus the two 🔵 suggestions and the two outstanding one-click suggestions from the editorial pass.

    MERGE CONFLICT RESOLVED. The branch was DIRTY against main. Conflicts were confined to two generated term-cache CSVs (cache/enums/diseaseterm_f618932bb23f.csv, cache/mondo/terms.csv). Resolved by taking main's copy verbatim, locating its sorted prefix, and bisect.insort-ing only the genuinely-new CURIEs into that prefix, leaving main's out-of-position tail rows untouched. Verified with git diff --numstat origin/main: every touched cache file is +N -0, no deletions.

    IMPORTANT ITEM 1 - DEEP RESEARCH ARTIFACT. 'just research-disorder claude_code CAPOS_Syndrome' was re-run now that kb/disorders/CAPOS_Syndrome.yaml exists. It completed successfully (exit 0, ~19 min) and both outputs are committed: research/CAPOS_Syndrome-deep-research-claude_code.md and its .citations.md sidecar. This confirms the earlier non-zero exit was purely the file-must-exist ordering bug in the recipe, not a provider failure. The 8-dimension Content-Completeness cross-check was then run against the entry.

    CROSS-CHECK RESULT - CONTENT FILLED. Ten new phenotypes, all snippet-verified: Developmental regression (HP:0002376), Seizure (HP:0001250, OCCASIONAL), Visual impairment (HP:0000505), Cerebellar atrophy (HP:0001272), Coma (HP:0001259), Muscle weakness (HP:0001324), Myoclonus (HP:0001336), Wolff-Parkinson-White syndrome (HP:0001716), Abnormal EKG (HP:0003115, FREQUENT), Migraine (HP:0002076, preferred_term hemiplegic migraine). The first five come from the reviewer's named sentence in PMID:36484864 and other already-cached abstracts; the reviewer was correct that this was quotable from cache and uncurated. One new diagnosis entry: baseline and periodic electrocardiography (NCIT:C38053). Two new references fetched with just fetch-reference: PMID:32913013 (multicentre ATP1A3 cardiac cohort) and PMID:26453127 (Potic 2015, CAPOS with hemiplegic migraine).

    FREQUENCY BANDS. Three assigned, each with a quoted denominator: pes cavus 3/10 = 30% FREQUENT and seizures 1/10 = 10% OCCASIONAL from Demos Table 1 (the table title is quoted as its own evidence item so the denominator is read off the paper, not derived), and resting ECG abnormality 2/3 = 67% FREQUENT from PMID:32913013 where both numbers are in the quoted sentence. Deliberately NOT banded: the four cardinal acronym features are 10/10 in the Demos table, but that cohort was ascertained on them, so 100% would report the case definition rather than a frequency.

    DR ERRORS CAUGHT AND DISCARDED. The report proposed HP:0031815 as 'Auditory neuropathy'; OAK shows HP:0031815 is Abnormal oral physiology. It also proposed HP:0002083 for migraine with aura; HP:0002083 is Migraine without aura. Neither was used. All [P]-marked (possibly paraphrased) quotations in the report were discarded; every snippet in this entry is verbatim.

    FALSE-ABSENCE DISCIPLINE. No HPO class exists for auditory neuropathy / ANSD. Searches run 2026-08-01 against sqlite:obo:hp: t~auditory neuropathy, t~auditory synaptopathy, t~dyssynchrony, l^Auditory, l~cochlear nerve, and t~neuropathy filtered for auditory/cochlear/acoustic/eighth. Candidates audited and rejected: HP:0011396 and HP:0034585 are descendants of HP:0011391 Abnormal inner ear nerve MORPHOLOGY, while the CAPOS lesion is functional dyssynchrony in a structurally normal nerve; HP:0025112 and HP:5200410 are unrelated. HP:0006958 remains the correct binding. Likewise no HPO hemiplegic-migraine class (t~hemiplegic migraine, l^Migraine), so HP:0002076 Migraine carries a more specific preferred_term.

    REVIEWER SUGGESTIONS 2 AND 3. (2) GO:0033554 cellular response to stress was dropped from the ORGANISM-scale Febrile Illness Unmasking node - a cellular-scale process term added no discriminative value there and the node's claim is organism-level metabolic demand, not a cellular stress-response programme. (3) NCIT:C18020 Diagnostic Procedure replaced with NCIT:C85857 Evoked Response Audiometry on the OAE/CM+ABR entry, and with NCIT:C16809 Magnetic Resonance Imaging on the brain-MRI entry; both verified reachable from NCIT:C25218.

    OUTSTANDING EDITORIAL SUGGESTIONS APPLIED. The two pending one-click suggestions were applied: the 'staircase rather than a slope' framing on Incomplete Recovery and Stepwise Deficit Accrual was softened to mark the step reading as an interpretation, and Acute post-infectious cerebellar ataxia was bound to MONDO:0850107 postinfectious cerebellitis. RECA/FIPWE remains free text - a MONDO gap, not a curation gap.

    NARROWING STATED. Blindness, dysphagia, cognitive dysfunction and peripheral axonal neuropathy were surfaced by the cross-check and deliberately left out; the reasoning for each is recorded in the entry notes. Cardiac curation for the sibling Alternating_Hemiplegia_of_Childhood entry and any surveillance-interval treatment entry stay with issue #7648.

    VALIDATION. just validate, just validate-terms, just validate-references, scripts/check_snippets_verbatim.py (100/100, up from 78), scripts/check_folded_hyphens.py --check, and just validate-history-all all pass. pytest tests/test_data.py: 1 failed, 16430 passed - the single failure is the known pre-existing SETD5_Haploinsufficiency_Syndrome issue (#7729), unrelated. references_cache churn from the validators (#7507) was discarded; only the two newly fetched files are staged.

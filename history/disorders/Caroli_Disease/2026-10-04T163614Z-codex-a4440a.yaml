  summary: Review Caroli disease using cached clinical and mechanistic full texts
  details: |
    Reviewed the existing entry, matching Falcon report and citation sidecar, with manual MONDO identity preflight (no causal gene recorded for automated discrimination). Used full GeneReviews ARPKD-PKHD1 and EASL cystic-liver guidance, the 2024 heritable cholestasis review, full PKHD1 twin report and primary 2016/2018 experimental fibrosis papers. Separated simple Caroli disease from the CHF/ARPKD component; replaced universal fibrocystin-loss claims with genotype-scoped dysfunction; added atomic beta-catenin, NF-kB/IL-1beta, STAT3, chemokine, macrophage and integrin/TGF-beta mechanisms and model links. Checked the primary Notch-Hes1 abstract and corrected the report’s overstatement of Notch1–4 activation. Added clinical phenotypes with explicit small-cohort frequency scope, imaging, histology, biochemical findings, reported genotype, observational studies, and complication-directed treatments. Preserved conflicting UDCA recommendations by population and qualified cancer proportions as selected surgical cohorts. Do not transfer noncommunicating ADPLD cyst mechanisms or unrelated CHF genes to isolated Caroli disease. The cited 14-patient report was verified by DOI/PMID but its text is unavailable; numerical findings are explicitly sourced to the cached review. Preclinical interventions remain distinct from patient efficacy. Updated the closed original curation issue and replaced stale process notes. Schema/terms and 168 evidence snippets validate; graph references, node-class examples and gene grounding pass.

  summary: 'Debundle two pathophysiology nodes (PR #8116 review item B)'
  details: |
    PR #8116 review follow-up (ai4c-reviewer, 2026-08-08). Item B: split two bundled pathophysiology nodes into atomic ones, following the schema-valid spec the reviewer supplied.

    Split 1 replaces 'Bile Stasis, Hepatolithiasis and Recurrent Bacterial Cholangitis' with three TISSUE/ESTABLISHED nodes retaining UBERON:0003704 - 'Bile Stasis in the Dilated Segments' (inherits the inbound edge from Segmental Saccular Dilatation; DIRECT edges to Hepatolithiasis and to Recurrent Bacterial Cholangitis), 'Hepatolithiasis' (DIRECT edge to Recurrent Bacterial Cholangitis), and 'Recurrent Bacterial Cholangitis' (takes both pre-existing cholangitis evidence items unchanged and inherits both outbound edges to Chronic Biliary Inflammation and to Progressive Peribiliary Fibrosis). This fixes the gap the reviewer identified: the bundled node carried only cholangitis evidence, so the stasis and stone claims it named were unsourced. Both new nodes now cite PMID:32884228, which states that the destructive inflammatory state leads to recurrent episodes of cholangitis and the development of biliary stones.

    Split 2 replaces 'Chronic Biliary Inflammation and Cholangiocarcinogenesis' with 'Chronic Biliary Inflammation' (CELLULAR, ESTABLISHED, keeping CL:0002538 and GO:1904056, newly evidenced by the PMID:32884228 decades-of-destruction sentence) and 'Cholangiocarcinoma' (TISSUE, role consequence, PROVISIONAL, keeping the incidence and incidental-detection evidence), so PROVISIONAL now grades only the half whose derivation is actually uncertain. The inflammation-to-carcinoma edge carries its own INDIRECT_UNKNOWN_INTERMEDIATES CausalEdge evidence item graded PARTIAL, quoting the 'is postulated' sentence that justifies PROVISIONAL. mechanism_confidence was deliberately NOT placed on the CausalEdge - the reviewer corrected their own earlier suggestion, as CausalEdge has no such slot.

    Foreign keys updated: the Antibiotic Therapy for Cholangitis target_mechanisms now targets Recurrent Bacterial Cholangitis, and the caroli_cca_incidence_uncertainty discussion attaches_to now targets pathophysiology#Cholangiocarcinoma.

    Review item D (no deep-research artifact in research/) is NOT addressed: the reviewer escalated it to a maintainer decision and this run cannot execute a DR provider. Suggestions E-H are non-blocking and left open.

    Validation: linkml-validate clean; just validate-terms passed; just count-verified-snippets reported 50/50 verified against cached references (up from 46/46, so all four new snippets verified); pytest tests/test_data.py -k 'mechanism or attaches or foreign or pathophys or discussion' 9420 passed. No reference cache file was created or edited by hand - all four new snippets quote PMID_32884228.md, already committed on this branch.

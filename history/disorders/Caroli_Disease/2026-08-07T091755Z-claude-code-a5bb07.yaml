  summary: 'Create: Caroli disease (MONDO:0010913) with Caroli syndrome subtype'
  details: |
    New entry created by the automated curation scanner (high_effort tier) in response to issue #6526, which reported that Caroli disease had no dismech entry.

    NEC preflight. MONDO carries two live sibling terms — MONDO:0010913 (Caroli disease) and MONDO:0018808 (Caroli syndrome) — plus an obsolete MONDO:0000506. `just preflight-dr` is not applicable (no DR report was used; neither MONDO term records an RO:0004003 causal gene, so the automated check would return SKIP). Identity was instead confirmed manually against the MONDO records via OAK: the definition of MONDO:0010913 (Orphanet:53035, OMIM:600643) matches non-obstructive cystic dilatation of the intrahepatic bile ducts, and MONDO:0018808 is defined as that lesion plus congenital hepatic fibrosis. The two are modelled as one entry with two subtypes rather than two entries, since they share one ductal plate malformation mechanism; the rationale is recorded in the entry's notes and mappings blocks.

    Mechanism graph. Seven-node chain: fibrocystin loss from the cholangiocyte primary cilium (MOLECULAR, root) -> ductal plate malformation of the intrahepatic biliary tree -> segmental saccular dilatation of the large intrahepatic ducts -> bile stasis, hepatolithiasis and recurrent bacterial cholangitis -> progressive peribiliary fibrosis -> presinusoidal portal hypertension (ORGANISM), with a parallel consequence node for chronic biliary inflammation and cholangiocarcinogenesis. Two conformance declarations: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction on the root node, and fibrotic_response#Excessive ECM Deposition on the fibrosis node.

    Evidence discipline. Eight references, all fetched with just fetch-reference and verified: PMID:33824930 (Lasagni fibrocystic liver disease review — ductal plate / ciliopathy / PKHD1 mechanism), PMID:32884228 (Fahrner systematic review, 561 patients — CCA 6.6%), PMID:34294522 (German 17-centre series, 198 patients — CCA 7.1%), PMID:22197937 (Srinath CHF/ARPKD natural history, 1230 patients), PMID:14598246 (Masyuk PCK rat — tagged MODEL_ORGANISM), PMID:25327281 (Wang clinical classification, 30 patients), PMID:42438734 (the case report named in the issue), PMID:35728731 (EASL clinical practice guidelines; fetched but not ultimately cited, since its abstract carries no quotable disease-specific claim).

    Deliberate omissions rather than gaps of effort:
    - No prevalence record. No source in the evidence set states a population rate with a quotable figure; the widely repeated 1-in-1,000,000 estimate is not traceable to a citable abstract here.
    - No phenotype frequency bands, per docs/frequency-evidence-guidelines.md — the available snippets support the disease-phenotype associations but not quantitative bands.
    - Three evidence items are marked PARTIAL rather than SUPPORT where the source hedges or is single-patient: the planar-cell-polarity role of fibrocystin (the source says "unclear function ... supposedly involved"), the cholelithiasis phenotype (the source names cholestasis, not stones), and the beta-blocker / variceal-ligation treatments (n=1 case report showing initial benefit then long-term failure).
    - The cholangiocarcinogenesis node is mechanism_confidence PROVISIONAL: the inflammation-to-carcinoma link is inferred from the epidemiological association, not demonstrated in Caroli tissue.

    Two KNOWLEDGE_GAP discussions with proposed experiments: the wide (2.7-37.5%) spread in reported cholangiocarcinoma incidence with no identified risk factors, and the absence of any therapy targeting the ciliopathy mechanism.

    Validation: just validate kb/disorders/Caroli_Disease.yaml passes schema, term and reference validation; 43/43 snippets verified against cached references.

    Outcome is needs_followup: structured Orphanet provenance (ORPHA:53035 / ORPHA:480520 are not in references_cache and need an Orphadata refresh), a snippet-backed prevalence record, a hepatolithiasis-specific citation, and histopathology / imaging_findings blocks remain for a second pass. These are recorded on the entry's tracked_issues note.

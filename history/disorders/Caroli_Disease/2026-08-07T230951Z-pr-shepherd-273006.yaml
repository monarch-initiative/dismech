  details: |
    PR #8116 review follow-up (ai4c-reviewer, 2026-08-07). Item A: the 'Chronic Biliary Inflammation and Cholangiocarcinogenesis' pathophysiology node still asserted that cholangiocarcinoma arises 'at a notably younger age', which none of its four evidence items supported and which the PMID:22197937 evidence added elsewhere in the same file contradicts (mean age at CCA diagnosis 60.1 years). The clause is replaced with the corrected framing already applied at the phenotype level: onset is predominantly beyond 40 years, so the excess risk is one of incidence rather than of markedly earlier onset. Item C: added a top-level references block citing PMID:20301501 (GeneReviews, Autosomal Recessive Polycystic Kidney Disease - PKHD1) tagged GeneReviews, with one finding mined per GeneReviews domain - clinical characteristics (names the hepatobiliary presentation as Caroli disease and attributes it to ductal plate remodeling), diagnosis/testing (biallelic PKHD1), management (ascending cholangitis, cholestasis, portal hypertension, LTx/CLKTx), and genetic counseling (autosomal recessive, 25% sib recurrence risk). The cache file was created by just fetch-reference PMID:20301501, never hand-written. Outcome is needs_followup because two review items remain open and were deliberately not attempted here: item B (splitting the two bundled pathophysiology nodes, a structural change beyond a shepherd fix) and item D (no deep-research artifact exists for Caroli in research/, which this run cannot generate). Validation: just validate passed; just count-verified-snippets reported 44/44 verified; all four references findings supporting_text values were confirmed as exact whitespace-normalized substrings of the fetched cache.

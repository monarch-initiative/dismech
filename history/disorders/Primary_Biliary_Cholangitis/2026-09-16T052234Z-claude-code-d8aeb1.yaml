  details: |
    PR Shepherd review round for #11190.

    Blocking review item: the treatments section stopped in 2018. Added Elafibranor and Seladelpar, both granted FDA accelerated approval in 2024 for the inadequate-UDCA-response indication this entry's obeticholic acid record already claims. Each carries a target_mechanisms link to 'Progressive Ductopenia and Cholestasis' (INHIBITS, PPAR-agonist bile-acid-synthesis suppression) with link-level evidence, plus treatment-level efficacy and approved-indication evidence. All snippets are exact quotes from references_cache/PMID_39329760.md, already committed and already cited by this entry.

    therapeutic_agent bound to NCIT:C166574 (Elafibranor) and NCIT:C167015 (Seladelpar) rather than CHEBI. CHEBI terms exist for both, and CHEBI is the documented preference for specific small molecules, but CHEBI:747793 (elafibranor) is not reachable from the ChemicalEntityTerm enum roots in the current build and fails term validation; NCIT:C1909 is the other enum root and resolves both. Recorded here so the choice is not re-litigated as drift.

    Non-blocking review suggestions taken: link-level evidence attached to the Fibrates -> Pruritus edge, quoting the BEZURSO secondary-consistency sentence and graded INDIRECT because the trial was not powered on itch. A safety qualifier on obeticholic acid was already present on main.

    Merge with origin/main: four conflicting hunks in treatments, all from a concurrent PBC treatments curation that landed on main first. Resolved by keeping main's treatment_effect values, descriptions and link-level evidence, then folding back this branch's unique contributions rather than discarding either side: PMID:37945152 on UDCA, PMID:28427765 (EASL) on Fibrates, the Fibrates -> Pruritus edge, and the Liver Transplantation target_mechanisms block with PMID:42647757 and PMID:42486602. The one HEAD item deliberately dropped was a third quote from PMID:27532829 on obeticholic acid, which main already cites twice on the same record.

    Validation: just validate passed (43/43 snippets verified against the cache, up from 23/23); just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all clean.

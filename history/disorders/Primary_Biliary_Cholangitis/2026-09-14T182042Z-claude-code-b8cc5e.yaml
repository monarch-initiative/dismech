  summary: Move the post-transplant recurrence finding out of evidence into notes
  details: |
    Round 4 review. The Liver Transplantation treatment carried PMID:32275981 as supports: REFUTE, which asserts machine-readably that the literature contradicts transplantation as a treatment for PBC. It does not. The claim the grade attaches to is the treatment description, For end-stage disease, which is an indication; frequent post-transplant recurrence is a durability finding and a different proposition. The paper is a post-transplant management study whose own conclusion is a therapeutic positive, and the quoted sentence is the opening clause of its background rather than a finding about whether transplantation is indicated. Took the reviewer's preferred remedy: dropped the evidence item and folded the recurrence sentence into the treatment notes alongside the preventive-UDCA result from the same cohort, which was already there, with a line recording why both sit in notes rather than evidence. The treatment remains evidenced by PMID:39329760, which states the indication directly. references_cache/PMID_32275981.md is deliberately retained: the paper is still cited in prose and cache pruning is a separate, deliberate action. Also removed an unbacked frequency: FREQUENT band from the Hepatomegaly phenotype, for the same reason the same band was removed from Jaundice earlier in this PR, leaving the file internally consistent; the phenotype itself stays. Validated with just validate (32/32 snippets verified), just validate-terms, check-folded-hyphens, check-enum-values, check-duplicate-keys and check-entity-refs.

  details: |
    Addresses the review on PR 8803. Liver Transplantation: the previously cited PMID:32275981 quote states a limitation of transplantation rather than its indication, so the primary evidence is now the PMID:39329760 sentence saying untreated PBC might progress to cirrhosis and liver decompensation requiring liver transplant. The recurrence quote is retained as a second item regraded REFUTE, since it cuts against transplantation being curative. HLA-DRB1*08: the cited GWAS abstract names HLA-DQB1, never DRB1 and never the *08 allele, so the explanation now states plainly that the support is region-level and rests on linkage disequilibrium across HLA class II, with a notes block recording that an allele-level DRB1 typing study is still needed. Added a separate HLA-DQB1 genetic entry bound to hgnc:4944 quoting the DQB1 sentence with its odds ratio of 1.75, which this paper does support directly. Jaundice: the entry asserted advanced disease over a quote saying early stages. Both staging claims are dropped; the snippet is now the UDCA symptom sentence from the same cached full text, which carries no staging claim, and the unsupported FREQUENT frequency band is removed because no cited source reports a jaundice-specific rate. The murine PMID:24556277 item now carries evidence_source MODEL_ORGANISM and its explanation names the dnTGFbetaRII mouse model, so the human claim is visibly an extrapolation. Its supports value was migrated from the retired PARTIAL to SUPPORT. Also took the UDCA suggestion: the target_mechanisms edge asserting displacement of hydrophobic bile acids now leads with the matching mechanistic sentence from the cached PMID:39329760 full text, with the survival result kept as a second item. Filled in the empty links.prs on the prior history record. Validated with just validate, just validate-terms, and just count-verified-snippets reporting 27/27 verified.

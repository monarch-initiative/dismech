  summary: Map Primary Biliary Cholangitis to OMIMPS:109720
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. The January 2026 PS109720 snapshot contains five numbered primary biliary cirrhosis records, organizing familial and genetic susceptibility associations. This entry represents the clinical autoimmune disease now called primary biliary cholangitis, including genetic predisposition and environmental contributions. RelatedMatch connects the clinical disease to that genetic series without defining it as five Mendelian diseases or making a risk allele diagnostic. The historic series label does not require established cirrhosis in every patient. The MONDO:0005388 crosswalk is useful source context, but does not establish equivalence between the clinical disease and a susceptibility-locus collection.

  summary: Merge main; fold merge-created duplicate gene_term keys; add directness
  details: |
    Merged current main into the PR branch to clear the conflict that was preventing any workflow (including re-review) from starting. Three cache CSV conflicts were resolved in favour of main, whose rows are a strict superset of the branch's. The kb/ conflict was the PMID:24556277 murine-cholangitis evidence item, where both sides had migrated supports: PARTIAL to SUPPORT and the branch additionally added evidence_source: MODEL_ORGANISM; the branch side was kept. The merge itself introduced duplicate gene_term keys on the IL12A and IL12RB2 genetic entries, because main bound those genes above association: while this branch bound them below it. The blocks are byte-identical, so they were folded into one, keeping every value. Added directness: INDIRECT to two evidence items whose own explanations already state the inference step: the murine model supporting a human mechanism claim, and the region-level HLA class II GWAS supporting an allele-level HLA-DRB1*08 claim. The latter is the modern equivalent of the supports: PARTIAL the review asked for, which #10003 retired. Validated with just validate (33/33 snippets verified), just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-causal-targets and just check-enum-values.

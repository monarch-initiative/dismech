  summary: 'LOINC: bind ALP and bilirubin regulatory surrogate codes'
  details: |
    Bound LOINC:6768-6 (Alkaline phosphatase [Enzymatic activity/volume] in Serum or Plasma) to the Alkaline Phosphatase biochemical record and LOINC:1975-2 (Bilirubin.total [Mass/volume] in Serum or Plasma) to the Bilirubin biochemical record, as part of dismech LOINC Diagnostics tranche N (regulatory surrogate endpoints). Per the project's rule for this tranche, the code lands on the dismech Biochemical marker whose readouts[].regulatory_endpoint_refs already points at the FDA row (both markers already correctly carried endpoint_context: REGULATORY_SURROGATE paired with regulatory_endpoint_refs: [FDA-SE-adult-noncancer-092] before this session; nothing was added or changed there). Both codes are the plain total-analyte identity codes, not an isoenzyme fraction or panel, matching what each biomarker_term/readout actually measures. LOINC:6768-6 was already cached on origin/main and every other open loinc-*-batch* branch with an identical row (not a new addition); LOINC:1975-2 is newly seeded and confirmed absent everywhere. Both labels were verified against the Monarch KG entity API in the same step they were written.

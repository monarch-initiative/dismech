  summary: 'Compliance: bind treatment terms and evidence'
  details: |
    Weekly compliance pass on immune disease treatments. All four PBC treatments (UDCA, obeticholic acid, fibrates, liver transplantation) carried only a name and a one-line description: no treatment_term, no therapeutic_agent, no therapeutic_modality, no target_mechanisms and no evidence, scoring 0/4 on the treatments section. Bound each to an NCIT clinical-action term (NCIT:C15986 Pharmacotherapy for the three drug therapies, NCIT:C15271 Liver Transplantation for the surgical one), added CHEBI therapeutic_agent bindings (ursodeoxycholic acid CHEBI:9907, obeticholic acid CHEBI:43602, bezafibrate CHEBI:47612, fenofibrate CHEBI:5001), set therapeutic_modality, wired each treatment into the pathograph via target_mechanisms on 'Progressive Ductopenia and Cholestasis' (and 'Pruritus' for fibrates), and added six exact-quote evidence items from the POISE trial (PMID:27532829), the BEZURSO trial (PMID:29874528), the 2017 EASL PBC guideline (PMID:28427765), a UDCA treatment review (PMID:37945152), and two liver-transplant outcome papers (PMID:42647757, PMID:42486602). All 23 snippets verify against the cache; just validate passes.

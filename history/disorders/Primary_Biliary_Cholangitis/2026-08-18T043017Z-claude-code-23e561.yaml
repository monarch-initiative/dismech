  details: |
    Weekly compliance pass focused on immune-disease treatments. First, bound all four treatments to NCIT action terms with CHEBI therapeutic_agent and therapeutic_modality, and added trial-grade evidence: UDCA (Global PBC Study Group cohort, PMID:30980847), obeticholic acid (POISE phase 3, PMID:27532829), fibrates (BEZURSO phase 3, PMID:29874528), liver transplantation (PMID:32275981). Added target_mechanisms links from the three pharmacotherapies to the Progressive Ductopenia and Cholestasis node, each with its own evidence. Second, added HGNC gene_term bindings and relationship_type SUSCEPTIBILITY plus GWAS evidence (PMID:19458352) for HLA-DRB1, IL12A, IL12RB2. Third, added evidence for the IgM (PMID:31677185) and anti-sp100 (PMID:37032725) biochemical markers and the Jaundice phenotype (PMID:39329760). Fourth, corrected the Cholangiocyte cell type from CL:0000182 hepatocyte to CL:0002538 intrahepatic cholangiocyte. Validated with just validate (schema plus terms plus references): 24 of 24 snippets verified against cached references. Weighted compliance 64.7 to 89.7. Hepatomegaly phenotype evidence was deliberately left absent - no adequately specific citable source was found, and per the evidence SOP an incomplete entry is preferred over a weak citation.

  summary: Add CXCR5 mechanism and discussion
  details: |
    Resolved ai4c-reviewer feedback from PR review cycle on #8680.

    Added `discussions:` block with `kind: KNOWLEDGE_GAP` and `discussion_id:
    pbc_cxcr5_b_cell_ama_mechanistic_gap` to machine-query the three open
    questions from #8491:
    1. Does CXCR5-mediated B-cell homing directly drive AMA production, or is
       it a consequence of altered T-cell help?
    2. What is the relationship between IgM+ CXCR5+ B-cell infiltration and
       loss of tolerance to mitochondrial autoantigens?
    3. Are CXCR5+ B-cells producers of IgM-AMA or follicular helper B-cell
       effectors?

    The discussion attaches to `pathophysiology#CXCR5-Driven B-Cell Portal
    Infiltration` and captures the mechanistic gap explicitly rather than only
    as prose in node description.

    Pathophysiology work was complete from prior commits:
    - Two atomic nodes, split per review: Increased CXCR5 Expression (MOLECULAR)
      → CXCR5-Driven B-Cell Portal Infiltration (TISSUE)
    - Downstream edge to AMA is INDIRECT_UNKNOWN_INTERMEDIATES (not DIRECT),
      properly modeling the epistemic uncertainty
    - All biological_scale tags present
    - GO terms corrected (B cell chemotaxis, C-X-C chemokine receptor activity)
    - evidence_source corrected (IN_VITRO for TEAD3 mechanism)

  summary: 'Create: Intellectual Disability X-linked 100 (MRX100, KIF4A)'
  details: |
    De novo curation of MRX100 (MONDO:0010488, KIF4A) as a kb/disorders Disease entry. entry_type decision: DISEASE rather than a has_subtypes entry on Non-Syndromic_X-Linked_Intellectual_Disability. Two reasons. KIF4A carries a gene-specific published molecular chain (KIF4-PARP1-TrkB-KCC2 to chloride homeostasis and seizure threshold, plus dendrite and spine morphology) that is more mechanism than any of the eight MRX subtype blocks in the parent entry hold, and it has a knock-in mouse of its own; and the reported phenotype now includes epilepsy, polymicrogyria, microcephaly and hydrocephalus, so filing it under a parent whose defining feature is the absence of such features would record something the literature no longer supports. The parent entry is named in parents:. Two mechanistic_hypotheses: kif4a_synaptic_ei_imbalance (CANONICAL) and kif4a_mitotic_neurogenesis (EMERGING, because no KIF4A model has been shown to have a progenitor proliferation defect, so its edge to the malformation node carries unknown intermediates). The entry is calibrated to ClinGen's Limited classification throughout, and cites the ClinGen record for two things: the classification itself and the lumping-and-splitting decision that assigns the KIF4A dental phenotype (taurodontism, microdontia, dens invaginatus, no developmental delay) to a separate disease entity, which is respected here. One curatorial finding recorded as a KNOWLEDGE_GAP discussion: loss of KIF4 derepresses PARP1 (its C-terminal module suppresses PARP-1), while the R728Q substitution binds PARP1 harder and impairs its activity, which is why NAD rescues those mice. The two reported allele classes therefore push PARP1 in opposite directions while producing overlapping phenotypes, and the literature does not reconcile them. A second KNOWLEDGE_GAP covers the unproven mitotic arm, including the competing L1CAM-transport route. Named Entity Confusion controls: the founding paper reports KIF4A and KIF5C together and only KIF4A results are used, which is stated in notes; the dental phenotype is excluded per ClinGen; single-patient renal, lymphatic, ocular and hearing findings from the genotype-first 2021 series are not curated as phenotypes because that cohort's ascertainment would overstate them, and the same reasoning sets the Ventriculomegaly band at OCCASIONAL rather than the FREQUENT its within-series 4/11 would give. Antiseizure medication and developmental support are curated with no evidence item and an explicit notes line saying why, since no KIF4A report describes a regimen or an outcome. Gates: just validate exit 0 (58/58 snippets verified), validate-terms exit 0, check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens all exit 0. Deep research: falcon report, just preflight-dr PASS (KIF4A mentioned 61 times); the report's own reference validation flagged DOI:10.1083/jcb.202208108 as unresolved, so that paper is cited here by its PMID (36482480) with snippets verified against the cached full text.

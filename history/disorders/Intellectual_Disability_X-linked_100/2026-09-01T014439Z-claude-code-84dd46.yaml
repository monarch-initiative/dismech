  summary: Address CHANGES_REQUESTED review of the MRX100 entry
  details: |
    Review round on PR 10326, which requested changes on three phenotype omissions whose supporting sentences were already quoted elsewhere in the file. All three added, plus two of the three non-blocking suggestions. Added phenotypes: Global developmental delay (HP:0001263, FREQUENT), Atypical behavior (HP:0000708, OCCASIONAL - note the canonical HPO label is Atypical behavior, not the Behavioral abnormality the review named), Autism (HP:0000717, OCCASIONAL, a single case whose variant is ACMG-uncertain and carried by unaffected female relatives, which the block states), Strabismus (HP:0000486, OCCASIONAL) and Motor delay (HP:0001270, OCCASIONAL). The review was right that the existing notes exclusion covered only the single-patient ocular findings inside the genotype-first 2021 cohort and did not dispose of the strabismus reported in four of four males of a separate family; the notes paragraph now draws that distinction explicitly and says the rationale is about ascertainment, not organ system. Motor delay carries a notes line pointing at the reported negative case rather than curating that negative as an evidence item against the phenotype, since a single unaffected patient bounds a frequency without contradicting the phenotype. Added a differential_diagnoses section covering L1CAM-related X-linked hydrocephalus (the mechanistically interesting one, since KIF4A transports L1CAM and belongs to its recycling pathway, and since the KIF4A hydrocephalus patients were described by their own authors as resembling the L1CAM phenotype), other kinesinopathies with brain malformation (KIF7, KIF14), and the rest of the non-syndromic X-linked intellectual disability class for the presentation the MONDO term actually names. Declined the VP-shunt treatment suggestion: no KIF4A publication mentions shunting, and the hydrocephalus in the reported series is largely fetal or perinatally lethal or hydranencephaly, where shunting is not the management, so adding a third evidence-free treatment would assert management this literature does not describe. All gates re-run and exit 0; validate-disorders reports 69 of 69 snippets verified. No new cache rows - every added HP term was already in the label and enum caches.

  summary: Add reference_title to the ClinGen CGGV evidence items
  details: |
    Consistency fix carried across from the sibling DFNA67 review on PR 10325, which flagged the same gap there. The four ClinGen CGGV evidence items in this entry (two in genetic, one in prevalence, one on the ClinGen external assertion path) had no reference_title, while 710 of 753 CGGV references elsewhere in the KB carry one in the GENE / disease (Classification) form. Nothing gates on it - check-reference-titles catches mismatches rather than absences - but the missing title shows on the rendered page and in the cx2 and SEPIO exports, and the entry was below KB norm. Title taken verbatim from the cache frontmatter: KIF4A / complex neurodevelopmental disorder with or without congenital anomalies (Limited). No content change; 69 of 69 snippets still verified and no new cache rows.

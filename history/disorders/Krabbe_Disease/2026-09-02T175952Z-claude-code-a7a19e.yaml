  details: |
    Assessed the openscientist report for canonical_galc_deficiency_psychosine_demyelination_model (new sidecar openscientist-assessment-by-claude-opus-5.yaml, verdict PARTIALLY_SUPPORTED rather than the report's own SUPPORTED) and integrated its RETAINED and QUALIFIED claims. Added to mechanistic_hypotheses: two SUPPORT items from PMID:40449593 supplying the GALC-activity/onset dose-response (r > 0.94) and the inverse activity/psychosine relationship that the entry's notes previously asserted with no citation; two REFUTE items from PMID:37337846 and PMID:35290889 recording that saposin-D ablation and a UGT8 inhibitor deplete psychosine without preventing disease, which is the sufficiency limit the hypothesis text overstates. Added pathophysiology node Cell-Autonomous Neuronal Toxicity (CL:0000540; GO:0031175, GO:0099504) with a DIRECT edge from Psychosine Accumulation, evidenced by PMID:27780934 and PMID:41430252 -- the entry previously had no neuronal node at all, every node being glial, macrophage or myelin. Added a second citation (PMID:37337846) to GalCer-Driven Macrophage Pathology, notable because it comes from the study that eliminated psychosine. Added two discussions: a KNOWLEDGE_GAP for the three-way discordance among psychosine-depleting perturbations, and a HUMAN_MODEL_MISMATCH bounding the new neuronal node, each with a proposed experiment. Every snippet was re-derived from references_cache rather than copied from the report, which matters here because the report's quoted sentence for PMID:35290889 is a paraphrase, not the source wording. Deliberately not integrated: alpha-synuclein aggregation and sphingolipid fibril formation (QUALIFIED -- the alpha-synuclein paper found no Lewy body pathology and no conformation-specific labelling, and the fibril work is in vitro only); GALC heterozygosity in adult neurodegeneration (QUALIFIED and out of scope for a biallelic disorder entry); no status change, since the report itself recommends retaining CANONICAL and the notes already carry the qualifier text. The report's Gap 8 claim that no ClinGen gene-disease validity classification exists for GALC-Krabbe is REJECTED in the assessment: a Definitive assertion from 2022-06-15 is already cited in this entry.

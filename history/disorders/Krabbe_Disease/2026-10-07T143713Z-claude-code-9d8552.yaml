  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing Newborn Screening diagnosis row with diagnosis_term NCIT:C81178 Newborn Screening and two LOINC measurements: LOINC:62310-8 Galactosylceramidase [Enzymatic activity/volume] in DBS (first tier) and LOINC:93688-0 Psychosine [Moles/volume] in DBS (second tier). Added one reference range on the psychosine DBS code from the Illinois programme (PMID:34065072, open full text): negative below 2.0 nmol/L, intermediate 2.0 to 8.7 nmol/L followed only with two pathogenic GALC variants, abnormal at or above 8.7 nmol/L with immediate referral; the paper's note that the laboratory was moving the cut-off to 10 nM is quoted so the figure reads as the cited period's value. The GALC activity code carries no band because Illinois (at or below 16 percent of batch median repeat, at or below 13 percent positive) and New York State (PMID:26795590, at or below 12 percent of the daily mean) state the rule as a fraction of the run statistic, not in the code's unit; both rules are recorded as evidence on the row. Bound the LOINC Parts LP411706-7 Psychosine and LP14027-4 Galactosylceramidase as loinc_term on the two biochemical markers, which describe several specimens. Cache rows were written by just loinc-seed-cache (eight codes). Validated with just validate, validate-terms, count-verified-snippets (161/161), validate-disorders, check-duplicate-keys, check-entity-refs, check-snippet-grading and the LOINC schema test. Left alone: the confirmatory GALC Enzyme Activity Assay diagnosis row (leukocyte or fibroblast), which is outside the newborn-screening tranche.

  details: |
    Created the RYR1-Related Myopathy root/umbrella entry MONDO:0100150 per issue #9546, curated as CURATE_ROOT_WITH_SUBTYPES cross-referencing the existing Central_Core_Myopathy, Multiminicore_Disease, Centronuclear_Myopathy, and Malignant_Hyperthermia_of_Anesthesia entries rather than duplicating their content. Modeled both requested mechanisms distinctly on separate pathophysiology nodes: dominant gain-of-function/leaky-channel using genetic_context.functional_impact_category GAIN_OF_FUNCTION, molecular_functions modifier GAIN_OF_FUNCTION on GO:0005219 ryanodine-sensitive calcium-release channel activity, downstream biological_processes modifier INCREASED on SR calcium release regulation; and recessive hypomorphic/reduced-expression using functional_impact_category PARTIAL_LOSS_OF_FUNCTION, modifier DECREASED throughout. has_subtypes covers Dominant RYR1-Related Myopathy and Recessive RYR1-Related Myopathy using the children slot to nest MHS1, KDS, and CFTD-RYR1, plus Malignant Hyperthermia Susceptibility Type 1 the allelic axis, King-Denborough Syndrome, and Congenital Fiber-Type Disproportion RYR1-Related. Deep research: ran just research-disorder falcon RYR1-Related_Myopathy, report at research/RYR1-Related_Myopathy-deep-research-falcon.md; just preflight-dr returned PASS, RYR1=49 mentions vs next-highest AR=2; the report's own reference_validation block showed 6/6 references resolved, 0 confabulation, 0 off-topic with 4 of 6 undecided due to missing abstracts -- clean signal, but the entry's evidence was built independently from primary literature not lifted from the DR report, then cross-checked against it after initial drafting. Primary sources: Lawal et al 2020 unified-nomenclature review PMID:33190635 full text, Todd et al 2018 diagnostic/therapeutic review PMID:30406384 full text, Dowling et al 2011 King-Denborough series PMID:21514828, the large RYR1 cohort study and MH/CCD review already cited in Central_Core_Myopathy.yaml PMID:22473935 and PMID:16917943, the retired CFTD GeneReviews chapter PMID:20301436 for the RYR1 share of CFTD cases, and Todd et al 2024 published phase 1 ARM210/Rycal trial results PMID:38318125 found via the falcon report and independently fetched and verified, added as a target_mechanisms-linked treatment and clinical_trials entry. No dedicated RYR1-Related Myopathies GeneReviews chapter was found in PubMed via esearch; used the two reviews above as the GeneReviews-baseline substitute. Validation: just validate schema plus terms plus references all pass, 53/53 snippets verified; just count-verified-snippets 53/53; just check-duplicate-keys no duplicates; just validate-disorders batched pre-PR sweep run before opening PR.

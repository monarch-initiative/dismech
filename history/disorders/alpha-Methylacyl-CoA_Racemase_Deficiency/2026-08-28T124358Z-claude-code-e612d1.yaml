  details: |
    CORRECTION TO AN EARLIER RECORD IN THIS DIRECTORY. The history record 2026-08-28T120941Z-claude-code-2d08ac states that the eight DOI-prefixed snippets were verified manually against the cache, 8/8 exact substrings. That claim is false. Two of the eight were not exact: they used ASCII hyphens where the cached publisher text uses en-dashes (U+2013) in the numeric ranges 30-61 and 3-69. The cause was my verification script, which included a fallback that retried each candidate with hyphens replaced by en-dashes and counted a hit as verified, so the check reported OK for exactly the mismatches it was written to catch. History records are append-only, so the earlier record stands as written and this one corrects it. Fix applied: all eight snippets now cite PMID:39313810 rather than the DOI. That matters beyond the two bad quotes, because conf/reference_validator_config.yaml lists DOI under skip_prefixes alongside dataset accessions, so no DOI-cited snippet is machine-checked at all; on the PMID the same snippets are validated by the normal gate and all 50 in the file now verify. Re-fetching PMID:39313810 upgraded its cache from abstract_only to full_text_xml via PMC; Inborn_Disorder_of_Bile_Acid_Synthesis also cites it and was revalidated at 45/45 unaffected. Also addressed the remaining review items: added a mappings.mondo_mappings narrowMatch to MONDO:0008967, which is already curated as the BASD Type 4 subtype of Inborn_Disorder_of_Bile_Acid_Synthesis; de-duplicated Sensorimotor Peripheral Neuropathy by renaming the pathophysiology node to Peripheral Nerve Axonal Degeneration and pointing it at the phenotype; added Retinal Photoreceptor Degeneration and Progressive Liver Fibrosis and Cirrhosis nodes; wired twelve downstream phenotypes# edges; added gallstones 2/12 and glucosuria phenotypes; added functional_impact_category LOSS_OF_FUNCTION and the c.154T>C variant with an explicit note that the commonest-allele claim is not assertable from cached sources; added cell types; re-evidenced Seizure from a patient report rather than a mouse paper's background sentence; and corrected the description's overstatement that all three original patients were diagnostic mimics when the third was a child without neuropathy.

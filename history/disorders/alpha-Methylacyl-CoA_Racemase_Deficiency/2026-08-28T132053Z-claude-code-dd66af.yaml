  summary: 'Review round 4: byte-exact snippet audit'
  details: |
    Acted on the round-3 reviewer's note that a strict exact-substring check found whitespace-character substitutions. I ran the same check across all 57 snippets in the entry and classified every divergence rather than fixing the four that were reported.

    Result before this commit: 42 byte-exact, 14 divergent. After: 47 byte-exact, 10 divergent, 0 real mismatches. The 14 fall into three classes that need different treatment, and conflating them is how the round-1 en-dash finding got mis-diagnosed.

    Class 1 - typographic spaces inside HGVS notation (4 snippets, all added in round 3, all mine). The source writes the variants with a thin space around the operator and a non-breaking space after the position: c.154T U+2009 > U+2009 C, and c.364 U+00A0 C U+2009 > U+2009 T. I transcribed all of these as ASCII spaces. Fixed by using the source characters. These are invisible in an editor, so the history record names them explicitly: a later curator who 'tidies' them back to ASCII spaces is reintroducing the divergence, not fixing a typo.

    Class 2 - a sentence-initial capital (1 snippet, pre-existing). The PMID:34267495 snippet began 'for all three' where the source sentence begins 'For all three'. Lowercased at some point to read as an embedded clause. Fixed to the source's capital. This was the only divergence in the file that was not whitespace, and the only one the whitespace-normalizing comparison would not have caught if I had only checked what was reported.

    Class 3 - line-wrap newlines in the cache rendering (10 snippets). The cached markdown wraps long paragraphs, so a sentence reads 'retinitis pigmentosa \nwas detected' where the published sentence has a single space. These are deliberately NOT changed. The newline is an artifact of how the cache file is rendered, not a character in the source sentence, and embedding a raw newline into a YAML snippet to match a rendering artifact would make the quote less faithful to the paper, not more - and would break the moment the cache is regenerated with different wrapping. Recording the reasoning here so this class is not repeatedly re-reported as a defect.

    None of this was visible to any gate: the reference validator's normalize_text collapses all whitespace before substring matching, which is why 57/57 verified both before and after. That is the same blind spot that let the round-1 en-dash substitutions through, and the round-2 reviewer's observation that the dashes never actually blocked anything is the same point from the other side.

    Validation on this head: just validate passes with 57/57 snippets verified; working tree clean afterwards, no cache churn.

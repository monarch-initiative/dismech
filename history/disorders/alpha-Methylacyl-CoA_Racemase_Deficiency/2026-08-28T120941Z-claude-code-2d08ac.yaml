  summary: Add Perplexity deep-research report and natural-history phenotypes
  details: |
    Adds the Perplexity sonar-deep-research report, which succeeded on the seventh attempt after six Server disconnected failures; the successful run used reasoning_effort=low and ran from the worktree. Report validation: 8/8 identifiers resolved, 0 confabulation, 6/8 on topic. The report's own reference-validation step fetched two directly useful papers the earlier PubMed searches had missed, and both are now cited: a 12-patient natural-history cohort DOI:10.1186/s13023-024-03358-9 and PMID:34267495 on asymptomatic retinal dysfunction. Four other fetched references were discarded as uncited, two of them the prostate and hepatocellular carcinoma AMACR-overexpression papers that are the Named Entity Confusion hazard this entry already warns about. Substantive changes from the cohort: retinopathy upgraded to Retinitis Pigmentosa at FREQUENT with the 24-year median diagnostic delay recorded, which is the most actionable fact in the entry; new phenotypes for ataxia, cognitive decline, the thalamic and brainstem MRI pattern, and hepatocellular carcinoma; and a progression section separating the childhood hepatic phase from the adult neurological phase after age 40. Also corrected a framing error: the hepatocellular carcinoma seen in the cholic acid trial had been recorded as an unexplained adverse event, and the cohort shows it is better read as a disease risk requiring active surveillance; the treatment note now says so. One ontology label was wrong on first pass, HP:0007378 is a gastrointestinal neoplasm term, corrected to HP:0010663 Abnormal thalamus morphology. Note for validation: the eight DOI-prefixed snippets are reported by just validate and just validate-disorders as skipped by prefix and were therefore verified manually against the cache file, 8/8 exact substrings.

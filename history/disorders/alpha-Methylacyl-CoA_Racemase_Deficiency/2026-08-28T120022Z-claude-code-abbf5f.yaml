  summary: 'Create: Alpha-Methylacyl-CoA Racemase Deficiency, AMACR, MONDO:0013681'
  details: |
    De novo curation of AMACR deficiency from claim issue #9817. Structured around the fact that one racemase gates two chemically unrelated substrate streams, pristanoyl-CoA from dietary phytol and the C27 bile acid intermediates, and that the childhood hepatic and adult neurological presentations follow that split. Records the dietary phytol dependence as an environmental entry with influences_mechanisms, left with a free-text exposure_term because ECTO was searched and has no phytol or phytanic acid exposure term; the nearest candidates name an intervention or an avoidance rather than an intake, so binding one would misstate the exposure. The Amacr-null mouse is linked three ways: RECAPITULATES for metabolite accumulation, PARTIALLY_RECAPITULATES for the hepatic node, and FAILS_TO_RECAPITULATE for the sensorimotor neuropathy that defines the human adult disease, with the limitation noting the mouse may not survive long enough for a chronic neuropathy to appear. A HUMAN_MODEL_MISMATCH discussion records that the mouse is healthy on standard chow while patients on an ordinary diet are not, and what that does and does not license about dietary therapy. Notes the Named Entity Confusion hazard that AMACR is far better known as the prostate cancer marker P504S, and none of this entry is sourced from that literature. Three ontology bindings were wrong on first pass and corrected against OLS: CHEBI:35044 is Ulifloxacin not pristanic acid, corrected to CHEBI:51340; HP:0010964 is a long-chain fatty acid term, replaced with the precise HP:0034721 Elevated circulating pristanic acid concentration; HP:0012202 label is Increased serum bile acid concentration. Deep research pending: Perplexity sonar-deep-research has failed six times on this disease with Server disconnected without sending a response, while succeeding for the other four in this run; the entry is committed on verified primary literature and the report will be added before the PR is opened. Validated with just validate, 34/34 snippets verified, plus check-entity-refs, check-duplicate-keys and check-environmental-evidence.

  summary: 'Review round 3: variant spectrum from full text, zygosity, suggestions'
  details: |
    Addressed both IMPORTANT items and five of the seven suggestions from review round 2. Both IMPORTANT items were side-effects of the PMID re-fetch performed in round 2, which upgraded PMID_39313810.md from abstract_only to PMC full text: one entry statement became obsolete, another was contradicted.

    IMPORTANT 1 - zygosity. The pathophysiology node's genetic_context carried zygosity HOMOZYGOUS and allele_type VARIANT. The upgraded cache shows three of twelve cohort patients were compound heterozygous and two siblings carried a whole-gene deletion from a 5p13.3 chromosomal deletion, so neither slot describes the cohort. ZygosityEnum is single-valued with no biallelic member and both slots are optional, so both are now unset, with a genetic_context description recording why rather than leaving the omission unexplained.

    IMPORTANT 2 - the variant note asserted a source limitation that no longer existed. It said c.154T>C could not be quoted cleanly because it appears only in a run-on patient table, and on that basis carried a weak PARTIAL-graded snippet about novel variants generally. That was true of the abstract-only cache; the full text states it in prose. The snippet is now the sentence naming the variant and its three homozygous carriers, graded SUPPORT, and the stale note is gone. This is the round-1 lesson applied a second time: a claim about what a source does not contain has to be re-read whenever the source changes.

    The same sentence supplies the rest of round-1 finding 8, so two further variants are now curated. c.364C>T (p.His122Tyr) is homozygous in three patients, the same number as c.154T>C, and unlike it was not previously reported - which is why secondary sources name Ser52Pro as the characteristic allele and omit this one. The 5p13.3 deletion is curated as a distinct mechanism class (enzyme absent rather than catalytically dead), with the contiguous-gene caveat that phenotype in those siblings cannot be attributed to AMACR alone.

    Suggestions taken: Gallstones now has an incoming edge from C27-Bile Acid Intermediate Accumulation, graded INDIRECT_KNOWN_INTERMEDIATES because the biliary-composition step is established in general bile acid physiology but not measured in AMACR deficiency. Coagulopathy rebound from HP:0001892 Abnormal bleeding to HP:0003256 Abnormality of the coagulation cascade, which is what the source word names; bleeding is the consequence. Hepatic Fibrosis added as a phenotype at 1/12 with both the screened-rate caveat and the paediatric negative quoted. Thalamic and Brainstem MRI Abnormality moved VERY_FREQUENT to FREQUENT: 9/12 is 75 percent, inside the FREQUENT band. The bare synonym Congenital bile acid synthesis defect 4 removed, since a synonym asserts the identity that skos:narrowMatch declines to assert; the mapping justification now records that.

    Not taken: Glucosuria keeps no incoming edge - it is an incidental screening finding in one child and no cited source proposes a mechanism for it. Cirrhosis is not curated as a phenotype: the cohort states the fibrosis-cirrhosis-HCC risk as a surveillance rationale and reports no cirrhotic patient. The out-of-scope cache upgrades noted in suggestion 8 are left in place; they were verified harmless by the reviewer and by revalidating Inborn_Disorder_of_Bile_Acid_Synthesis at 45/45, and reverting shared cache files carries more risk than the churn does.

    Validation on this head: just validate passes with 57/57 snippets verified (was 50/50).

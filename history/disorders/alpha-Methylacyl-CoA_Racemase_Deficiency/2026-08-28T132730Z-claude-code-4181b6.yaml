  summary: Revert the unicode-space substitutions from the previous record
  details: |
    Corrects the immediately preceding history record (2026-08-28T132053Z-claude-code-dd66af.yaml), which is append-only and stands as written; this record supersedes its conclusion on one of its three classes.

    That record described substituting the publisher's thin space (U+2009) and non-breaking space (U+00A0) into four HGVS snippets to make them byte-exact against the cache. I have reverted all four to ASCII spaces. The sentence-initial capital fix in the same commit is kept, so the net delta against the previously approved commit is one character: 'for all three' to 'For all three'.

    The reviewer's round-3 analysis, which landed after that commit was pushed, settles the question against me on evidence I did not have. Three points, in order of weight:

    First, byte-exactness is unattainable by construction. The reference caches hard-wrap at roughly 80 columns, so any snippet longer than one line necessarily contains a newline the published sentence does not. There is no version of the file in which all snippets are byte-exact, so byte-exactness cannot be the standard CLAUDE.md's 'exact source substring' refers to; it can only mean exact modulo the validator's normalize_text.

    Second, the KB-wide census: 51,939 snippets byte-exact against 78,726 matching only after whitespace normalisation. ASCII transcription is not a lapse, it is the established convention across the knowledge base, and a handful of unicode-space snippets in one entry would be the anomaly.

    Third, the cost I had not weighed: a snippet containing U+2009 is un-greppable. A curator searching the KB for 'c.154T > C' would not find it. That is a real loss of utility in exchange for a form of exactness that the first point shows is not achievable anyway.

    What survives from the previous record is the part that mattered: the audit found one divergence that was not whitespace at all - a sentence-initial capital - which checking only the four reported instances would have missed. Auditing the whole file rather than the reported subset was the right method even though one of its conclusions was wrong.

    Recording this because the previous record's Class 1 paragraph explicitly instructs a future curator not to 'tidy' the unicode spaces back to ASCII. That instruction is now withdrawn: ASCII spaces are correct here, and this record is the reason.

    Validation on this head: just validate passes with 57/57 snippets verified; working tree clean, no cache churn.

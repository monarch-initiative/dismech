  summary: Add phenotype evidence to pyridoxine-dependent epilepsy
  details: |
    Weekly compliance sweep. Only 2 of 8 phenotypes carried evidence. Added 9 evidence items so all 8 are now cited, using PMID:24664088 (fetal ventriculomegaly case report with a neuroimaging-findings survey) plus three references already cited elsewhere in the entry: PMID:20301659 (GeneReviews PDE-ALDH7A1), PMID:20554659 (Mills et al., genotypic and phenotypic spectrum), PMID:26026794 (triple therapy neurodevelopmental outcome). PMID:26026794 supplies the 75 percent figure for developmental delay and intellectual disability persisting despite adequate seizure control. Also ran just backfill-reference-titles to populate reference_title on all 22 evidence items. Verified with just validate, just validate-terms, just validate-disorders, and just count-verified-snippets (22/22 verified).

  summary: 'Gene-family review: ALDH7A1 record evidence and ClinGen note'
  details: |
    ALDH7A1 modelling re-reviewed and found correct: the antiquitin node binds L-aminoadipate-semialdehyde dehydrogenase [NAD(P)+] activity (GO:0004043) as decreased. The ALDH7A1 genetic record had no evidence; it now quotes the GeneReviews diagnostic definition by biallelic ALDH7A1 variants (PMID:20301659) and the gene-discovery study showing that patient variants abolish the P6C/alpha-AASA dehydrogenase activity (PMID:16491085), and gains a record-level autosomal recessive inheritance block. ClinGen's ALDH7A1 Definitive assertion is filed against the parent MONDO:0009945 pyridoxine-dependent epilepsy rather than this entry's MONDO:0020741, so the tier is noted, not copied. The rename and grouping proposed in issue #14963 were not done here; the PLPBP disease has its own entry, PLPBP_Deficiency (added on main in #19070, which this review's separate PLPBP entry duplicated and so was dropped).

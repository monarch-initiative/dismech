  summary: 'GO term audit: correct and complete pathway bindings'
  details: |
    Added the disease-defining GO bindings the entry lacked. It previously carried exactly one GO term, GO:0004029 (aldehyde dehydrogenase (NAD+) activity), which is true of ALDH7A1 but generic. Added GO:0004043 (L-aminoadipate-semialdehyde dehydrogenase [NAD(P)+] activity) as the specific antiquitin molecular function, and GO:0019477 (L-lysine catabolic process) on both the enzyme-deficiency and metabolite-accumulation nodes. Both terms are ALDH7A1's own GOA annotations (UniProt P49419), and the lysine-degradation block is already stated in the entry's own cited snippet (PMID:26026794: 'impaired lysine degradation and subsequent accumulation of alpha-aminoadipic semialdehyde'). Validated with just validate-terms and just validate.

  summary: 'Create: Pyridoxine-Dependent Epilepsy'
  details: |
    De-novo curation of pyridoxine-dependent epilepsy - ALDH7A1 / antiquitin deficiency (MONDO:0020741), a treatable autosomal recessive metabolic epilepsy. GeneReviews baseline PMID:20301659 (tagged). claude_code deep research. Granular unbundled pathophysiology of the treatable mechanism: antiquitin (ALDH7A1) deficiency -> alpha-AASA/P6C accumulation -> P6C inactivates pyridoxal-5-phosphate (active B6) -> secondary PLP deficiency -> impaired PLP-dependent GABA synthesis and E/I imbalance -> hyperexcitability -> pyridoxine-responsive neonatal seizures; parallel neurodevelopmental-impairment effector. Three conforms_to links to the epilepsy module. Evidence snippet-verified: 20301659 (GeneReviews), 16491085 (Mills 2006 antiquitin discovery), 20554659 (Mills 2010 spectrum incl. prenatal footprint), 26026794 (Coughlin triple therapy; 75% DD/ID). Biochemical alpha-AASA marker, diagnosis, and prevalence (BIRTH_PREVALENCE band, modeling-based) sections included. Discussions: neurodevelopment-vs-seizure dissociation, triple-therapy benefit hypothesis, and prenatal-window gap. All snippets confirmed as exact substrings; validation and folded-hyphen pass.

  summary: 'Create: Usutu Virus Disease'
  details: |
    Created de-novo entry for Usutu virus disease, the human illness caused by Usutu virus (USUV, NCBITaxon:64286), an emerging neuroinvasive flavivirus (Japanese encephalitis serocomplex, West Nile relative). Curated WITHOUT a MONDO disease_term binding: no MONDO term exists for human USUV disease (the only concept, MONDO:1015078, is the non-human-animal infection and is deliberately not bound); disease_term carries preferred_term only and the gap plus the intent to support a MONDO term request are recorded in notes. Deep research via the claude_code provider (research/Usutu_Virus_Disease-deep-research-claude_code.md; 8/8 references resolved, 0 off-topic; needs_review true only because 1 of 2 report quotes was abstract-only, not a confabulation). Pathophysiology chain: cutaneous inoculation + flaviviral type I interferon antagonism -> viremia/systemic dissemination -> CNS neuroinvasion/neuronal infection -> neuroinflammation -> meningoencephalitis -> encephalitis/meningitis/seizures. Evidence anchored on two reviews (PMID:32858963 European epidemiology, full text; PMID:40590537 WNV/USUV neuropathology) plus primary/surveillance sources from the report: Weissenbock emergence (PMID:12095429), the ECDC EU/EEA 2012-2021 epidemiology+diagnosis report (PMID:37589592), and a STAT1/type-I-IFN in-vivo mouse study (PMID:40694555, MODEL_ORGANISM, directness INDIRECT). Added a diagnosis block (serology with flavivirus cross-reactivity + RNA detection + isolation) and a progression block (mostly asymptomatic/mild febrile; minority neuroinvasive). Validation: just validate (schema+terms+references) pass, 13/13 snippets verified, check-granularity deterministic classes 0 (NO_PROGRESSION cleared), entity-refs/causal-targets/name-collisions/logical-rules/coarse-phenotypes/duplicate-keys/qualifier-terms clean, check-genereviews NO_CHAPTER (not Mendelian). preflight-dr SKIP (arbovirus, no causal gene); report confirmed about USUV (top term USUV=37). Not added to the Viral_Hemorrhagic_Fevers grouping: USUV is a neuroinvasive flavivirus, not a hemorrhagic fever. Red-team review round (dismech-pr-review via fresh-context subagent): rebound the interferon-antagonism process from GO:0032480 (negative regulation of type I interferon production) with modifier DECREASED - which reads backwards, since the virus increases that suppression - to GO:0039502 (symbiont-mediated suppression of host type I interferon-mediated signaling pathway), the purpose-built viral-antagonism term that needs no inverting modifier; added a prevalence record (CASES_IN_LITERATURE, RARE) with the ECDC 105 human cases / 12 neuroinvasive over 2012-2021; and softened the neuroinvasive-phase note on immunocompromise after the ECDC series found none of its neuroinvasive cases immunocompromised. 14/14 snippets verified after the round.

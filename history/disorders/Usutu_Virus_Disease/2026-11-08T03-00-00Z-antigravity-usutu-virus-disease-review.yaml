  summary: Enriched Usutu Virus Disease with Harrison's classifications, anatomical/cellular grounding and evidence on pathophysiology nodes, Dysmetria phenotype, and specific serologic/molecular diagnosis and supportive-care bindings.
  details: >-
    Added INFECTIOUS_DISEASES and NEUROLOGIC Harrison's chapter classifications
    with verbatim literature evidence. Grounded pathophysiology nodes with
    anatomical locations (skin of body, blood, brain, central nervous system,
    blood brain barrier), cell types (hematopoietic cell on viremia; endothelial
    cell, astrocyte, and pericyte on BBB neuroinvasion), biological processes,
    and supporting evidence from PMID:40694555 and PMID:12095429, and wired
    Jaundice, Resting tremor, and Dysmetria as downstream Clinical phenotypes.
    Split diagnosis into specific serologic/neutralization (NCIT:C217458) and
    nucleic acid amplification (NCIT:C20055) rows, and added therapeutic_modality
    and supportive-care evidence on Supportive care.

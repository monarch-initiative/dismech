  summary: Enriched Usutu Virus Disease with Harrison's classifications, anatomical/cellular grounding and evidence on pathophysiology nodes, Dysmetria phenotype, and completed diagnosis and treatment bindings.
  details: Added INFECTIOUS_DISEASES and NEUROLOGIC Harrison's chapter classifications with verbatim literature evidence. Grounded pathophysiology nodes with anatomical locations (skin of body, blood, liver, brain, central nervous system, blood brain barrier), cell types (hematopoietic cell, endothelial cell, astrocyte, leukocyte), biological processes, and supporting evidence from PMID:40694555, and wired Jaundice, Resting tremor, and Dysmetria as downstream phenotypes. Completed diagnosis_term and results on serologic and molecular confirmation and added therapeutic_modality, target_mechanisms, and evidence on supportive care.

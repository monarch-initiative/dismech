  details: |
    Review round on PR 9544 addressing the two blocking items from the ai4c-reviewer review. First, the Regional Lymphadenitis description asserted a tender node for both patients, but PMID:32163377 says patient 2 swelling was erythematous but not tender, the opposite of patient 1. The description now records the inter-patient difference, with node sizes, rather than flattening it, and a second exact-quote evidence item documents the patient 2 finding. Second, fever was uncurated despite leading the presentation in both patients; it is now a Constitutional phenotype bound to HP:0001945, carrying both presentation quotes, which were already verified in the file as evidence for other phenotypes. Its description also records the prolonged unremitting high fever at the HLH-like relapse fourteen months after the BCG-osis diagnosis. Filled in the empty links block on the 2026-08-26 record of this same PR, which named issue 9295 in its summary without linking it. The reviewer non-blocking suggestions to scope the four laboratory phenotypes as two of two patients and to curate patient 2 low erythrocyte sedimentation rate were not taken, because the only source sentence for the patient 2 laboratory panel is hyphen-split across a line wrap in the cached PDF text at leuko-cytosis, so no clean exact quote covering that panel is available; this is the same constraint the earlier session recorded for conjugated hyperbilirubinaemia. Validated with just validate, just validate-terms, just count-verified-snippets at 46 of 46, just check-entity-refs, just check-duplicate-keys, just check-folded-hyphens, just check-snippet-length and just validate-history.

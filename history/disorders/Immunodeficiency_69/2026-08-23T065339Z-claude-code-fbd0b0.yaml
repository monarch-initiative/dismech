  summary: 'Create: Immunodeficiency 69 (IFNG deficiency, MSMD)'
  details: |
    Created the dismech entry for immunodeficiency 69 (MONDO:0033541), autosomal recessive complete IFN-gamma deficiency presenting as Mendelian susceptibility to mycobacterial disease.

    Sources: the primary report of the IFNG etiology (PMID:32163377, Kerner et al., J Clin Invest 2020) and two comprehensive MSMD reviews (PMID:25453225, PMID:30264912). The IUIS classification cites PMID:35748970.

    Curated a five-node pathograph from the causal lesion to the clinical phenotype: complete loss of IFN-gamma production -> failure of T and NK cell IFN-gamma secretion -> defective IFN-gamma-dependent macrophage activation -> uncontrolled intramacrophagic mycobacterial replication -> mycobacterial and Salmonella disease. The macrophage-activation node declares conforms_to granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation.

    Recorded the therapeutic asymmetry that distinguishes this etiology: because the lesion is in the ligand and not the receptor, recombinant IFN-gamma can engage an intact receptor. This is captured as a target_mechanisms ACTIVATES edge, with an explicit KNOWLEDGE_GAP discussion stating that no treatment outcome has been published for this genotype, so it must not be curated as evidenced-effective therapy.

    Deliberate omissions: prevalence, progression and treatment-outcome sections are absent rather than extrapolated. Only two patients have been reported worldwide, and the population figures in the MSMD literature describe a genetically heterogeneous population, not this etiology.

    Term-binding note: five phenotype terms initially drafted from recall were all wrong and were caught by term validation; each was replaced with an OAK-verified term (HP:0020087 BCGosis, HP:0032283, HP:0011274, HP:0033253). The non-typhoidal Salmonella phenotype is deliberately left unbound because HPO has no matching class, with the reasoning recorded in a notes field.

    Validation: linkml-validate clean; term validation passed; reference snippet audit 15/15 verified against cached references; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates all clean.

  details: |
    Scheduled medium-effort curation scan (issue #9295, IMD69 sub-tranche). 1) Added a second evidence item citing PMID:30264912 (previously declared in references: with no evidence item) to the Mycobacterial and Salmonella Disease pathophysiology node. 2) Added CADD-score/MSC/MAF variant-pathogenicity detail to the IFNG genetic block, with the CADD-vs-MSC comparison recorded in prose (notes:) rather than as a snippet because the source sentence is hyphen-split across lines in the cached PDF text, plus a clean exact-quote evidence item for the MAF (less than 3x10^-6) claim. 3) Extended the Antimycobacterial Therapy treatment to cover patient 1's initial amikacin+levofloxacin regimen and its replacement by isoniazid/rifampicin/ethambutol, plus patient 2's rechallenge without adverse effects, each with its own exact-quote evidence item (amikacin/levofloxacin CHEBI ids reused from Mycetoma.yaml/Legionnaires_Disease.yaml). 4) Added 8 new phenotypes sourced from the same cached case report (PMID:32163377): Leukocytosis, Anemia, Thrombocytosis, Elevated Liver Enzymes (all from one shared patient-1 lab-panel quote), Regional Lymphadenitis, BCG Injection-Site Ulceration, Cerebral White Matter Lesion, and Leptomeningeal Enhancement (patient 1's CNS HLH relapse; HP:0032070 newly added to the HP term cache). Deliberately left out of scope, per the issue's own framing: conjugated hyperbilirubinaemia as a standalone phenotype (only source sentence is hyphen-corrupted, hyperbil-irubinemia, across a line wrap, so no clean exact quote is available; the claim remains in the treatment's free-text description as before); a diagnosis section; the GO:0009617 specificity question; and the HP:0033253 phenotype/measurement-granularity question. All four need a human curation judgment call rather than a mechanical fix. Validated with just validate, just validate-terms, just count-verified-snippets (43/43), just validate-disorders, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, check-duplicate-keys, check-entity-refs, check-not4curation, check-cache-order, check-term-cache-integrity, and pytest tests/test_data.py -k Immunodeficiency_69 (18 passed).

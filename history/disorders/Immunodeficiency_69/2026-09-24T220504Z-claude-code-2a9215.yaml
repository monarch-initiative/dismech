  summary: Correct false ECTO-gap claim in BCG vaccination exposure note
  details: |
    The environmental entry's notes claimed ECTO has no vaccination, vaccine, BCG or Mycobacterium exposure class at all. Re-running the OAK searches (l~vaccin, l~mycobact, l~BCG, l~bovis, l~Calmette) shows ECTO does carry a generic vaccination class (ECTO:2000129) and several species-level Mycobacterium exposure classes, but none specific to BCG or Mycobacterium bovis. The generic vaccination term is not bound because it is a label-less dangling node in the sqlite:obo:ecto build the term validator uses (runoak returns no label) and is unreachable from the ExposureTerm dynamic enum, tracked upstream as dismech#10738. The note was rewritten to state this precisely instead of asserting a blanket absence, matching the phrasing already used in X-linked_Mendelian_Susceptibility_to_Mycobacterial_Diseases_due_to_CYBB_Deficiency.yaml and ZAP70_Deficiency.yaml. No exposure_term binding was added; that remains blocked on #10738.

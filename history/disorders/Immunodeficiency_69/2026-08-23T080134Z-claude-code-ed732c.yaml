  summary: Correct false no-treatment-outcome claim; add HLH course, progression,
    environmental
  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES review on PR #9286. Three CRITICAL findings, all correct, all traceable to reading only part of the primary source's clinical narrative.

    CRITICAL 1 (corrected). The entry claimed recombinant IFN-gamma was 'not a reported treatment outcome in the two IFNG-deficient patients themselves', and a KNOWLEDGE_GAP asserted that 'no treatment outcome for cytokine replacement in this genotype has been published'. Both were FALSE. PMID:32163377 reports that patient 1 received IMUKIN at 50 micrograms/m2 three times weekly starting 18 months after presentation. The treatment entry now carries that as evidence, its notes record the correction explicitly, and the KNOWLEDGE_GAP was re-scoped to the real and defensible gap: efficacy is unevaluable because n=1 and the course was confounded by an HLH-like syndrome, its immunochemotherapy, a CNS relapse, and a fatal transplant.

    CRITICAL 2 (addressed). Added the HLH-like hyperinflammatory syndrome, deliberately WITHOUT a term binding: HPO has no hemophagocytic lymphohistiocytosis class, and HP:0012156 Hemophagocytosis would be positively wrong because the source states no hemophagocytosis was found in the bone marrow. Evidence graded PARTIAL for that reason. The evidenced component features are curated separately as splenomegaly, pancytopenia, hyperferritinaemia and hypertriglyceridaemia.

    CRITICAL 3 (addressed). Added a progression section recording the only published disease course: BCG-osis in infancy, IMUKIN from 18 months, HLH-like syndrome, remission on HLH-04, CNS relapse, allogeneic HSCT from a matched sister at age 3, death nine days later. Marked explicitly as one patient's course, not a natural history.

    IMPORTANT items addressed: added a top-level references block (4 sources, including PMID:30264912 which was previously cached but uncited); added HLH-directed immunochemotherapy and allogeneic HSCT as treatments, the latter with a REFUTE evidence item for the fatal outcome; added an environmental entry for BCG vaccination with entry-level evidence and a TRIGGERS influences_mechanisms link; added complete-penetrance and population-database evidence to the genetic section.

    Term correction: the 'Susceptibility to Tuberculosis' phenotype was bound to HP:0011274 Recurrent mycobacterial infections, which carries neither tuberculosis nor susceptibility semantics. HPO has no generic tuberculosis class, and the evidence does not specify pulmonary versus extrapulmonary, so the binding was removed and the reasoning recorded, matching how the Salmonella phenotype is handled.

    The BCG exposure_term is also left unbound: ECTO was searched for vaccination, vaccine, BCG and Mycobacterium exposure classes and has none.

    A Perplexity deep-research artifact was added for this disorder in a separate commit, addressing the reviewer's process finding.

    Validation after changes: linkml-validate clean; term validation passed; reference snippet audit 29/29 verified; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates all clean.

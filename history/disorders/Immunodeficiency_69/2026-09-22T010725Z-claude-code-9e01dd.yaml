  summary: 'Review: connect IMD69''s entirely detached clinical layer (IUIS Table
    6)'
  details: |
    All twenty phenotypes had no incoming causal edge. The IFN-gamma mechanism chain was complete from the germline lesion through failed macrophage activation to uncontrolled intramacrophagic replication, and reached no clinical finding.

    Nine infection and constitutional phenotypes attach to the Mycobacterial and Salmonella Disease node. Nine more are sequelae of the HLH-like syndrome, which is itself drawn from that node: the HLH-2004 criteria cluster - fever, hepatosplenomegaly, pancytopenia, hyperferritinaemia, hypertriglyceridaemia - plus the transaminase rise and the two MRI findings of the CNS relapse.

    The absent IFN-gamma production phenotype is a reports_on readout of the secretion-failure node rather than a causal edge, because it is that node being measured. The repo's list-disconnected-phenotypes counts only causal edges, so the entry reads 19 of 20 causally connected with one observational readout - which is the correct end state, not a remaining gap.

  summary: 'Address review on PR 14886: phenotype wiring, subtypes, prevalence, environment,
    agents'
  details: |
    Addressed the automated CHANGES_REQUESTED review. Rebound Honey-colored crusts from HP:0200042 Skin ulcer to HP:0200041 Skin erosion (impetigo erosions are superficial; ulceration defines ecthyma). Removed the duplicate Honey-Colored Crusted Erosions pathophysiology node and pointed downstream edges at the phenotype names (Nonbullous Pyogenic Epidermal Infection to Vesicles, Pustules, Honey-colored crusts; acantholysis node to Flaccid bullae and Honey-colored crusts). Split the bundled barrier/colonization trigger into Epidermal Barrier Disruption -> Superficial Bacterial Colonization and dropped the unsupported GO:0019730 antimicrobial humoral response DECREASED annotation; added atopic dermatitis evidence from PMID:31755570. Regraded PMID:21282415 (introduction sentence) to evidence_source OTHER with quote_role BACKGROUND. Added Nonbullous/Bullous has_subtypes (bullous bound to MONDO:0018182, looked up via ols:mondo), a Pustules phenotype (HP:0200039), prevalence from PMID:26317533 and PMID:33105179, a three-phase progression block, retapamulin (CHEBI:166679), ozenoxacin (CHEBI:136050, PMID:29898217) and fusidic acid (CHEBI:29013, Cochrane PMID:15106198) as topical agents, dicloxacillin (CHEBI:4511) and cephalexin (CHEBI:3534) as oral agents, EEFIC fusidic-acid and mupirocin resistance evidence (PMID:37358399, PMID:38726693), and an environmental section (scabies, crowding, poor hygiene, hot and humid climate) linked to the barrier and colonization nodes. Moved the deep-research provenance (falcon to openscientist fallback, preflight-dr SKIP, rejected report identifiers MONDO:0001366, MONDO:0005295, CHEBI:4508 and obsolete GO:0005615) out of the entry notes; it is recorded in the earlier history records. Not done: regional lymphadenopathy (no cited or cached source quotes it), APSGN/ARF split of the post-streptococcal node, and StatPearls tagging. Validation: just validate, validate-terms, count-verified-snippets (49/49) pass.

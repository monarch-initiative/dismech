  details: |
    Second review round on PR #11892. The BCG Vaccine Disease phenotype, added in the previous round at the reviewer's suggestion, arrived with evidence and an HP term but no join point and was an orphan pathograph node. Added as a second DIRECT downstream target of Uncontrolled Mycobacterial Replication and Failed Granuloma Containment, with a description saying why BCG disease is that node's earliest expression rather than a separate one. Verified programmatically that all eight phenotypes are now edge targets and that the only pathophysiology node without an incoming edge is the root variant node. Note just check-causal-targets does not catch this class of defect - it gates dangling targets, not unreferenced nodes. Removed the first prevalence record, which carried measure_type POINT_PREVALENCE, prevalence_class BAND_1_9_PER_100000 and rate_per_100000 2.0 against population Worldwide while its own notes said the figure was for MSMD as a whole rather than this genotype; two per 100,000 worldwide is on the order of a hundred thousand people against eleven ever described. The structured slots are the queryable claim and they contradicted the prose. Folded the MSMD context into the notes of the surviving CASES_IN_LITERATURE / ULTRA_RARE record and moved the 1-in-50,000 evidence item there with directness INDIRECT and an explanation that it bounds the aetiology from above rather than measuring it. This matches how the three sibling MSMD aetiology entries handle the same problem. Also corrected an off-by-one in review_notes: the IL-12 receptor sentence was a new evidence item rather than one of the eight regraded from OTHER. Snippets stay at 40/40; all structural gates clean.

  summary: 'Review round 1: diagnosis section, pathograph connectivity, evidence regrade'
  details: |
    Addressed the ai4c-reviewer changes-requested review on PR #11892 in one push. Added a four-entry diagnosis section (IFN-gammaR2 surface expression by flow cytometry, functional IFN-gamma responsiveness of patient cells, IFNGR2 sequencing, plasma IFN-gamma), all snippet-verified against already-cached references. Connected the disconnected graph component: 'Uncontrolled Mycobacterial Replication and Failed Granuloma Containment' now has an INDIRECT_KNOWN_INTERMEDIATES edge to 'Sustained IFN-gamma Production Without Receptor Response', citing the IL-12 to T/NK induction step as the named intermediate. Attached the three orphan phenotypes (Lymphadenopathy, Hepatosplenomegaly, Osteomyelitis) plus a new pulmonary phenotype to Disseminated Mycobacterial Disease via sequelae. Regraded all eight evidence_source OTHER items on the two narrative MSMD reviews (PMID:32025907, PMID:25453225) to HUMAN_CLINICAL, matching how the sibling Immunodeficiency_69 entry grades the same paper. Added a BCG-associated disease phenotype (HP:5210408) and a structured INFANTILE onset descriptor. Added target_mechanisms join points for recombinant IFN-gamma and antimycobacterial therapy. Declined two suggestions with reasons recorded in review_notes: a lost-negative-feedback edge, because no cached reference mentions feedback, downregulation or SOCS; and narrowing the agent term to Interferon Gamma-1b, because the curated claim is a negative one about exogenous IFN-gamma of any formulation. The reviewer also offered HP:0005381 and HP:0005385 as BCG-specific phenotype terms; HP:0005381 is Recurrent meningococcal disease and HP:0005385 does not exist, so the real BCG term HP:5210408 was looked up and used instead. Snippets 31/31 to 40/40; all structural gates clean.

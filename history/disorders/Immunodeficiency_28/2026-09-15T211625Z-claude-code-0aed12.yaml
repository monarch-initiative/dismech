  summary: 'Create: Immunodeficiency 28 (IFNGR2-related MSMD)'
  details: |
    De novo curation of MONDO:0013953 from a Perplexity sonar-deep-research report (research/Immunodeficiency_28-deep-research-perplexity.md). Report preflight (just preflight-dr) returned PASS with IFNGR2 mentioned 161 times. The report supplied 7 resolvable reference identifiers for a 113 KB document and its reference-validation block reported 7/7 resolved with a 0.0 confabulation rate; one of those 7, PMID:34242561, is a paper about CD28 deficiency rather than IFNGR2 and was not used. That citation resolved cleanly and was not flagged off topic, which is a limit of relevance scoring against a report's own vocabulary rather than an error in this report's prose. The reference set was rebuilt from PubMed: PMIDs 15356149, 23161749, 25135595, 25453225, 30814731, 31222290, 31497017, 32025907, 32909233, with three PMC identifiers from the citation sidecar resolved through the NCBI ID converter. Pathophysiology is curated as a six-node chain from the IFNGR2 loss-of-function variant through failed hexameric receptor assembly, lost STAT1 signal transduction, defective macrophage activation and failed granuloma containment, plus a branch for sustained IFN-gamma production that cannot signal. The IFNGR2 allelic series (AR complete, AR partial, AD haploinsufficiency) is curated as has_subtypes because the three share one pathograph and differ in residual signalling. Recombinant IFN-gamma is recorded as a treatment with REFUTE evidence, since it has no target in complete deficiency. Validated: just validate-disorders (schema, terms and references, batched) passed, 31/31 snippets verified, check-entity-refs, check-causal-targets and check-duplicate-keys all OK. Three snippets initially failed because bracketed citation markers inside the quoted sentences are stripped before matching; they were retrimmed to bracket-free spans rather than reworded.

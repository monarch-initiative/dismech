  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 47'
  details: |
    Claimed via issue #12713 and curated from the general dismech curation stub queue. Ran just research-disorder claude_code first (research/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_47-deep-research-claude_code.md), which established that DFNA47 is a mapped-but-gene-unidentified locus (9p21-22, D'Adamo et al. 2003, PMID:12634859): a single large Italian kindred, no independent replication family in the 20+ years since, and no causal gene ever cloned. Critically, the research report flagged that MYO1A -- the gene an agent working from memory might guess, since it is a cochlear-expressed deafness gene from the same era -- is actually the DFNA48 gene (15q22-q25), a different locus, and that MYO1A's own proposed deafness association has itself since been refuted (PMID:27759032). Verified every identifier independently via runoak/PubMed rather than trusting the report: this caught that the report's own PMC-derived citation for the Shahin et al. 2010 DFNB83 paper resolved to the wrong PMID (20602914, an unrelated DFNB82/GPSM2 paper) -- the correct PMID is 19888295. Also corrected UBERON:0001846 (internal ear, too broad) to UBERON:0001844 (cochlea), and CL:0000201 (obsolete) to its replacement CL:0000202 (auditory hair cell), though CL:0000202 was not ultimately used since no cell-type-specific claim is supported for this locus. Given the extreme evidentiary sparsity (no gene, no mechanism beyond phenotype-level pattern-matching, no model organisms, no GeneReviews chapter confirmed via just check-genereviews --online, no disease-specific treatment data), the entry is deliberately narrow: locus mapping and inheritance (from the 2003 founding paper), one phenotype (progressive sensorineural hearing impairment), a genetic entry recording the locus and explicitly why MYO1A is excluded (five evidence items, mixing NO_EVIDENCE/REFUTE grades to document the excluded candidate rather than omitting the reasoning), audiometric/exclusion-based diagnosis, a CASES_IN_LITERATURE prevalence record noting the single-family denominator, and generic standard-of-care treatments (hearing aids, cochlear implantation, genetic counseling) explicitly marked as not DFNA47-specific. Independently corroborated the founding family's audioprofile via a second source, a 2023 DFNA comprehensive review (PMID:37371710) whose own summary table still lists DFNA47's gene as unknown. Validated with just validate-disorders (schema/terms/references clean, 13/13 snippets and titles verified), just check-folded-hyphens, check-duplicate-keys, check-entity-refs, check-causal-targets, and check-qualifier-terms, all clean. Deleted stubs/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_47.yaml.

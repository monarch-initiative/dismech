  summary: 'Edit: Beckwith-Wiedemann_Syndrome - neuroblastoma screening row for the
    CDKN1C subgroup'
  details: |
    Adds a SCREENING row, 'Neuroblastoma surveillance (CDKN1C subgroup)', bound to NCIT:C15641 Screening for Neuroblastoma, after the existing Wilms tumor/hepatoblastoma surveillance row, as part of the neuroblastoma curation project (#14976, slate item P-b BWS). The row has no target_phenotypes (screening actions carry none, as in #8337); the restriction to the CDKN1C subtype is carried by its name, description and notes because the Treatment class has no subtype slot.

    The row records the risk basis (2-5% in the 2017 AACR recommendations, PMID:28674118; 4 of 126 reported patients, 3.2%, in the 2024 AACR Wilms tumor and hepatoblastoma update, PMID:39320341), the agreed recommendations (abdominal ultrasound every 3 months to age 7, 2018 international consensus recommendation 61, PMID:29377879; neuroblastoma screening without AFP, AACR 2024), and the open disagreement on urinary catecholamine metabolites (not recommended by consensus recommendation 65; listed by the 2017 AACR protocol and proposed by the 2025 Italian BWSp association update, PMID:41126215). Both the consensus and the Italian update state that there is no evidence that neuroblastoma screening improves outcome, and the row says so. The 2024 AACR neuroblastoma update (PMID:38860978) is cited from its abstract only (no PMC full text when checked), so the AACR test list given is the 2017 one.

    Grading: each guideline source is split into a data item (restated cohort figures, HUMAN_CLINICAL) and a recommendation item (OTHER); all are quote_role REVIEW_SYNTHESIS. One further item on the Neuroblastoma phenotype quotes the 2016 meta-analysis (PMID:27372391; CDKN1C mutations with neuroblastic tumors, OR 7.2), graded INDIRECT because neuroblastic tumors include ganglioneuroma and ganglioneuroblastoma and the comparison is within BWS.

    Not changed: the existing Wilms tumor/hepatoblastoma surveillance row. New reference caches: PMID:27372391, PMID:29377879, PMID:38860978, PMID:41126215; one new NCIT term row (C15641). Validated with just validate-disorders, count-verified-snippets --strict, validate-terms and the offline gates.

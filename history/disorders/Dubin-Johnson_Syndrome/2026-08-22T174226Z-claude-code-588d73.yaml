  summary: 'Create: Dubin-Johnson Syndrome'
  details: |
    New entry filling a hepatobiliary gap. Conforms to the conjugated-transport arm of the new bilirubin_conjugation_transport module. Three nodes: loss of canalicular MRP2 bilirubin conjugate export -> MRP3-mediated sinusoidal diversion producing the plasma conjugated rise -> hepatocellular pigment accumulation. The MRP3 step is curated explicitly because without it a canalicular export block would trap pigment intracellularly rather than raise plasma bilirubin. During review the urinary-coproporphyrin discriminator was corrected: an initial draft stated the rule backwards. It now records the canonical signature (normal total, >80% isomer I) plus a PARTIAL evidence item from PMID:36157610 showing a genetically confirmed Rotor patient with a Dubin-Johnson-compatible profile, so the readout is curated as suggestive rather than definitive. Treatment is diagnosis and reassurance only, with the suggested-but-unestablished drug-toxicity susceptibility recorded as PARTIAL and as a KNOWLEDGE_GAP rather than a management claim. Validation: linkml-validate clean; linkml-term-validator passed; 18/18 evidence snippets verified against cached references, and the authoritative linkml-reference-validator run with --no-full-text also passed.

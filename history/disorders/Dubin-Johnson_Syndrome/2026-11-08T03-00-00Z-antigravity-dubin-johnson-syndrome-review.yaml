  summary: Added MONDO synonyms, Harrison's classifications, and diagnostic workup, enriched pathophysiology ontology bindings and causal edge evidence, and refined phenotype and biochemical annotations for Dubin-Johnson Syndrome.
  details: >-
    Added MONDO synonyms (Dubin-Sprinz disease, Sprinz-Nelson syndrome, chronic
    idiopathic jaundice, hyperbilirubinemia type 2, DJS) and Harrison's chapter
    classifications (GASTROINTESTINAL, GENETICS_ENVIRONMENT_DISEASE) with
    verbatim evidence snippets. Enriched ABCC2/MRP2 pathophysiology nodes with
    anatomical locations (liver, bile canaliculus), apical plasma membrane
    cellular component, and snippet-backed downstream/sequelae causal chain from
    MRP3-Mediated Sinusoidal Diversion through Conjugated Hyperbilirubinaemia to
    Intermittent Jaundice. Added diagnostic entries for serum bilirubin
    measurement, urinary coproporphyrin isomer analysis, and ABCC2 genetic
    testing, added BACKGROUND quote_role on cited coproporphyrin background
    statements, and removed retired PARTIAL prose from explanations.

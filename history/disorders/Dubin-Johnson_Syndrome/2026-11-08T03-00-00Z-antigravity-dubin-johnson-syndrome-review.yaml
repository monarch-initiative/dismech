  summary: Added Harrison's classifications and diagnostic workup, enriched pathophysiology ontology bindings and downstream edges, and refined phenotype/treatment annotations for Dubin-Johnson Syndrome.
  details: Added Harrison's chapter classifications (GASTROINTESTINAL, ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) with verbatim evidence snippets. Enriched ABCC2/MRP2 pathophysiology nodes with anatomical locations (liver, bile canaliculus), apical plasma membrane cellular component, and downstream causal links to Conjugated Hyperbilirubinaemia and Intermittent Jaundice. Added diagnostic entries for serum bilirubin measurement, urinary coproporphyrin isomer analysis, and ABCC2 genetic testing, and cleaned up evidence explanations.

  summary: 'Create: Cataract_9_Multiple_Types'
  details: |
    New entry for CRYAA cataract (MONDO:0011413) with autosomal dominant (heterozygous missense: R12C, R21W, R21Q, R49C, R54P, R116C, R116H, putative G98R) and autosomal recessive (homozygous W9X, R54C) subtypes. Pathograph: dominant missense and recessive loss-of-function variant nodes (both carrying CRYAA with GO:0044183 molecular function) feed loss of alpha-crystallin chaperone capacity, abnormal oligomer assembly, crystallin aggregation/insolubility, UPR activation and lens cell apoptosis (R49C knock-in mouse), converging on loss of lens transparency (conforming to cataract_lens_opacification) and on a hypothesized lens-anterior segment developmental node for microcornea, corneal opacity and iris coloboma. Phenotypes, diagnosis (slit lamp, genetic testing), a CRYGD/GJA8 differential, cataract surgery and the experimental oxysterol chaperone (compound 29) are evidenced from 20 cached PubMed abstracts or full texts. Input: a Perplexity sonar-deep-research report generated via a locally streaming-patched deep-research-client (dismech#9357, deep-research-client#94); its 18 references all resolved, but its PMIDs were used only as leads and each snippet was re-read from the cache. Not used from the report: the 2024 molecular dynamics study (PMID:39485632; computational, adds no disease claim), the human lens membrane study (PMID:38339214; age-related cataract, not CTRCT9), the Y118D mouse (PMID:33929105; engineered allele not reported in humans), the R54C mouse paper (PMID:18282497; no abstract available), conference abstracts and surgical-trial/QoL citations lacking PMIDs or CRYAA relevance. Additional primary papers found by PubMed search: PMID:11123904, 22045060, 22140512, 20833134, 30475834, 17937925, 23288997. Validation: just validate, validate-terms, count-verified-snippets (62/62), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, the gene-activity grounding gate against origin/main, and validate-disorders all passed. check-genereviews --online found no GeneReviews or StatPearls chapter.

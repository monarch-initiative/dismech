  summary: 'Create: Griscelli Syndrome Type 3'
  details: |
    New entry for Griscelli syndrome type 3 (MONDO:0012220, MLPH), curated from
    research/Griscelli_Syndrome_Type_3-deep-research-perplexity.md plus targeted
    PubMed fetches. The report's reference validation was 18/18 resolved, 0 off
    topic, no unresolved references (no quote check recorded). Its term
    validation flagged needs_review only because MONDO:0012220 was labelled
    "MONDO" in a table; no terms were unresolved. Report citations not used:
    PMID:31721180 (cache has no abstract text), PMID:39359785 (a GS2-like case
    whose abstract misdescribes GS3), PMID:38760591 (quail model, not needed
    for the core chain). Leaden-mouse and tripartite-complex papers
    (PMID:11504925, 11929602, 11856727, 12861011) were found by PubMed search.
    One PMID recalled from memory for the leaden paper (11504946) resolved to
    an unrelated SMA paper; it was discarded and the correct PMID searched.

    Content: 4 pathophysiology nodes in a chain (MLPH loss -> tripartite complex
    failure -> perinuclear melanosome clustering -> defective transfer to
    keratinocytes and hair) wired to all 4 phenotypes (silver-gray hair,
    generalized hypopigmentation, large hair-shaft pigment clumps, white
    eyelashes); conforms_to lysosome_related_organelle_biogenesis at the same
    nodes as Griscelli_Syndrome_Type_2. MYO5A F-exon deletion recorded as a
    DISPUTED phenocopy, since the describing paper classed it as GS1.
    Differentials GS1 and GS2; leaden mouse animal model with two
    modeled_mechanisms links. 39 evidence items over 9 PMIDs.

    preflight-dr: WARN (MLPH 60 mentions; MYO5A 22 and RAB27A 22 are the
    complex partners, not a second disease). check-genereviews --online:
    NO_CHAPTER for GeneReviews and StatPearls.

    Validation: validate, validate-terms, count-verified-snippets (39/39),
    check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-block-scalar-comments, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-retired-support-prose,
    check-coarse-phenotypes, check-reference-titles and validate-disorders all
    passed. Phenotype connectivity 4/4, gene wiring 1/1, gene activity
    grounding 1/1.

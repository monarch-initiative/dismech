  details: |
    First review round on PR #9937. The review's verdict was that the entry stopped early rather than that it fabricated anything, and that is what this round fixes.

    Cited PMID:22770980 (Kim 2012), which was already tracked on main and which the entry had fetched and then dropped as uncited. It supplies three things the entry was missing: the primary source for the single-gene attribution the scope argument rests on (previously sourced secondhand from a background sentence), SCN3A de-repression with reduced LSD1 promoter occupancy measured in lymphoblastoid lines from two translocation patients, and the zebrafish morphant with craniofacial abnormalities plus neuronal apoptosis, now curated as the entry's only animal model at PARTIALLY_RECAPITULATES / LOW fidelity.

    Rewrote the phf21a_dosage_to_transcription knowledge gap, both halves of which were falsified by that paper. The remaining gap is narrower and stated as such: lymphoblastoid cells are not neurons, two named targets are not a transcriptome, and a morphant does not identify the transcriptional targets that carry the craniofacial requirement. Added a proposed experiment at the right dose and lineage.

    Added frequencies. The claim that the denominator did not support one was wrong: the defining cohort's cache is full text with a complete per-patient table, and three later series take the literature to roughly forty individuals. Every band is bound to a quote stating a figure for the named phenotype. Two limits are recorded in notes - the later series re-count previously reported patients so are not independent, and the digital-anomaly rows of Table 1 do not survive text extraction unambiguously, so those phenotypes carry no band.

    Added phenotypes: atypical behavior (the feature the disease is named for), global developmental delay, ADHD, postnatal overgrowth, epileptic encephalopathy, tapered finger, clinodactyly, syndactyly.

    Fixed Delayed Speech and Language Development, which was graded PARTIAL to cover a snippet that did not mention speech. PARTIAL is for evidence that partly supports a claim, not evidence silent on it.

    Dropped the neuron cell-type annotation from the HeLa/crystal node. Changed the de-repression node from GO:0006357 DYSREGULATED to GO:0000122 DECREASED, which preserves the direction the snippet states.

    Added structured Genetic.variants (class distribution, 100 percent de novo, the p.Arg580* recurrence and the negative genotype-phenotype result at it), a diagnosis section, and treatments (vigabatrin in infantile spasms, PARTIAL on a single case; antiseizure medication response rate).

    Three snippets first drafted from Table 1 rows were rejected by check-snippet-length and replaced with prose sentences. The gate was right and the review's suggestion to quote the table was not: an OCR row whose plus-minus columns do not survive extraction carries no propositional content. gnomAD constraint figures were left out and the omission documented, because no cited publication states them and there is nothing to attach an exact quote to.

    Validation: 43/43 snippets verified (was 16/16). validate, validate-terms, check-entity-refs, check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens, check-snippet-grading all pass. One root, no dangling targets, no unreached phenotype.

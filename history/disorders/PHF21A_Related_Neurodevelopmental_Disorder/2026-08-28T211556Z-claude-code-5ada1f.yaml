  summary: 'Create: PHF21A-related neurodevelopmental disorder'
  details: |
    De novo curation from an OpenScientist deep-research report (10 of 10 references verified, zero confabulation, 7 of 10 on topic). Gene identifier verified against HGNC before use and correct this time: PHF21A is hgnc:24156. All eight quotes lifted from the report were re-verified against primary abstracts and all eight matched exactly. The scope call is what this entry turns on. PHF21A lies at 11p11.2 inside the Potocki-Shaffer deletion interval, so a large part of the literature describes the phenotype in a contiguous-gene context where several genes are missing at once. Building an entry indiscriminately from that literature would attribute multigene-deletion features to a single gene, which is the same failure the MBD5 entry needed to avoid with EPC2. What makes single-gene attribution safe here is a specific evidence class: patients whose PHF21A is disrupted by a balanced translocation, and patients with intragenic point mutations. In both, PHF21A is affected and its neighbours are not. Every phenotype in this entry is sourced from those, and the Potocki-Shaffer deletion literature is used only for context. The quote chosen for intellectual disability and facial dysmorphism is deliberately the longer one that names both evidence classes and distinguishes them, rather than a shorter quote that would have read more cleanly while losing the distinction that licenses the attribution. Pathograph runs from haploinsufficiency through impaired reading of unmethylated H3K4 to de-repression of LSD1-CoREST targets and then the clinical syndrome. The molecular node is graded IN_VITRO throughout because the binding, structure and knockdown are all cell and crystal work with nothing shown in patient cells. A knowledge gap records two things the pathograph does not establish: the de-repression evidence is a knockdown, which gives direction but not magnitude at half dosage, and haploinsufficiency is precisely a claim about half dosage; and the craniofacial arm reaches facial dysmorphism from a transcriptional node without naming any target that would produce it, with neural crest absent from all cited evidence. No frequencies: seven patients give no denominator. Validation: just validate passes, 16 of 16 snippets verified, entity refs and duplicate keys clean, one root, no dangling targets, every phenotype reached.

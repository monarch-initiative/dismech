  summary: 'Review round 2: craniofacial sub-features, sleep disturbance, lesion-discriminating
    diagnostics'
  details: |
    Second review round on PR #9937. The round-2 CRITICAL - three fabricated reference_title values - was already fixed and pushed before the review landed; check_reference_titles caught it in CI.

    Added the four craniofacial sub-features named in PMID:36876344: broad forehead (HP:0000337), broad nasal tip (HP:0000455), anteverted nares (HP:0000463), full cheeks (HP:0000293). All four quote the same sentence, which also states that no recognizable facial gestalt is associated with the disorder. Both halves are curated deliberately: each description says the features are shared but not diagnostic, so a facial examination cannot make or exclude the diagnosis. None carries a frequency band, because "shared amongst some individuals" is not a count.

    Added sleep disturbance (HP:0002360), FREQUENT, at 33.33 percent of twelve. The figure is last in its list and pairs by position; the explanation records that it also falls in the same band as the two figures either side, so the band does not depend on the positional reading.

    Restructured the diagnosis section from one WES record carrying the lesion-discrimination argument in prose into three records: exome sequencing for intragenic variants, microarray for the 11p11.2 deletion, and karyotype/FISH for the balanced translocation. The scope argument turns on telling those three lesions apart, so each modality is now queryable rather than described. Added two differential diagnoses: Potocki-Shaffer syndrome, distinguished by exostoses and parietal foramina, and the overgrowth-intellectual disability syndromes, which are resolved by sequencing rather than by examination.

    Cosmetic: dropped the two OCR-inherited leading words from the language/developmental delay snippet.

    Four NCIT identifiers were invented in this round before being caught by term validation - C171192 is Electronic File Size, C16512 is DNA-directed DNA Polymerase, and C25922 and C16768 exist but are outside the TreatmentActionTerm enum. Replaced with NCIT:C101295, C18477 and C63326, all found through OAK rather than recalled. This is the third time this session that a CURIE written from memory has failed validation; the working rule going forward is that no NCIT, HP or GO identifier gets written without an OAK lookup in the same step.

    Not taken: a correction to the review's credit. It credits the entry with declining HP:0008872 for postnatal overgrowth on the grounds that the identifier is actually Feeding difficulties in infancy. That is not what happened - HP:0001548 was found by OAK lookup and the report's suggestion was never consulted, so the right term was reached by not looking rather than by looking carefully.

    Validation: 52/52 snippets verified (was 43/43). validate, validate-terms, check-entity-refs, check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens, check-reference-titles all pass. One root, no dangling targets, no unreached phenotype.

  summary: 'Create: Spinocerebellar_Ataxia_Type_4 (promoted from ADCA-I subtype row)'
  details: |
    New entry for SCA4 (MONDO:0010847, ZFHX3 exonic GGC/polyglycine expansion), promoted from the SCA4 has_subtypes row of Autosomal_Dominant_Cerebellar_Ataxia_Type_I as item 1 of issue 13103. That row now carries curated_in: Spinocerebellar_Ataxia_Type_4, and the entry was added to the Cerebellar_Ataxias grouping (item 2). The stub stubs/Spinocerebellar_Ataxia_Type_4.yaml was deleted. Deep research was attempted and failed with every available provider: falcon returned 503 Failed to authenticate, claude_code refused to run in an untrusted workspace, and the openai fallback reported its model as not found. No report is committed. The entry was curated directly from primary literature fetched with just fetch-reference: the GeneReviews chapter (PMID:39666847) as phenotype baseline, the three 2024 discovery papers (PMID:38684900, 38035881, 38197134), the Swedish neuropathology and imaging series (PMID:38973251), the 2006 German autopsy (PMID:16362839), repeat-length/anticipation (PMID:39095619), founder haplotype (PMID:39635987), cohort screens (PMID:42236257, 40898875, 40459184) and the original linkage paper (PMID:8755926). Mechanism nodes conform to loss_of_proteostasis, disabled_macroautophagy and cerebellar_purkinje_degeneration; the autophagy and aggregation nodes are PROVISIONAL because the data are from fibroblasts and undifferentiated iPSCs, and a KNOWLEDGE_GAP records the unresolved toxic-versus-normal gain of function. Validated with just validate (85/85 snippets verified), just validate-terms, check-genereviews, check-entity-refs, check-causal-targets, check-duplicate-keys, check-granularity on the parent, and check-groupings.

  summary: 'Create: Growth Restriction, Hypoplastic Kidneys, Alopecia and Distinctive
    Facies (GKAF, ZPR1)'
  details: |
    Identity resolved from the stub's MONDO xref chain, since MONDO records no causal gene for MONDO:0859146: OLS gave OMIM:619321, NCBI mim2gene_medgen mapped that MIM to GeneID 8882, and NCBI Gene resolved it to ZPR1 (11q23.3). Coverage recheck by gene against origin/main found no kb/ entry for ZPR1 (the only matches were an unrelated Wilson's-disease Biomni expression table), so this is a new Disease rather than a fold-in.

    Evidence base: two clinical reports totalling six children in five families (PMID:29851065 Ito 2018, four children from three New Mexican Hispanic families; PMID:40776660 2026, two sisters, identifying c.587T>C as a Middle Rio Grande Valley founder variant), plus three ZPR1-deficiency mechanism papers (PMID:17068332 cell cycle and transcription, PMID:15767679 Zpr1-null mouse, PMID:16648254 Zpr1-deficient mouse neurodegeneration). Both clinical papers are abstract-only in the cache; the abstracts are unusually complete and carry the whole phenotype list, the mortality, the variant, the structural modelling and the fibroblast result.

    Mechanism curated as a general proliferation defect: p.Ile196Thr (predicted to disrupt the hydrophobic core, COMPUTATIONAL) -> no detectable ZPR1 protein in patient fibroblasts -> G1 cell cycle arrest, and in parallel disrupted subnuclear localisation of SMN and NPAT -> reduced proliferation in developing tissues -> the twelve organ phenotypes. That breadth is the point: the constraint is on proliferation itself, which is why one lesion touches growth, brain, kidney, hair, ear, gonad, liver and endocrine axis.

    The interpretive problem is recorded rather than smoothed over. Almost all ZPR1 biology comes from spinal muscular atrophy research, and the viable Zpr1+/- mouse develops axonal pathology and neurodegeneration, which no reported patient has. The Zpr1+/- model link to Global Developmental Delay is therefore curated as FAILS_TO_RECAPITULATE with both required limitations and evidence, and a HUMAN_MODEL_MISMATCH discussion sets out the three open explanations (dose difference, early renal death, or nobody looked). A second KNOWLEDGE_GAP records that one allele in one founder population cannot separate the gene's phenotype from p.Ile196Thr's, and notes the tension that a true ZPR1 null is embryonic lethal in mouse while these children were liveborn.

    Two phenotypes are deliberately left with preferred_term and no term:. Growth Hormone Resistance - HPO has no term for growth hormone resistance or insensitivity (52 'growth hormone' matches searched, plus targeted searches for resistance, insensitivity and Laron), and binding the laboratory findings that would establish it would assert measurements the abstract does not report. Death in Early Childhood - HP:0003819 and HP:0001522 sit in the HPO Mortality/Aging branch, outside the PhenotypeTerm dynamic enum; this follows the precedent in Autosomal_Recessive_Spondylometaphyseal_Dysplasia_Megarbane_Type, and the mortality is also recorded under progression.

    Deep research: falcon, on topic (ZPR1 50 mentions, p.Ile196Thr 15, no substituted disease; preflight-dr SKIPs because MONDO records no canonical gene, so substitution was checked by manual gene grep). Nothing was bound from the report; its own term validation flagged two mislabelled CURIEs.

    Validation: just validate (schema + terms + references) passed; 52/52 snippets verified, no prefix skips; check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all clean. Every phenotype is wired; the only node with no incoming edge is the variant, which is the root.

  summary: Qualify the single-allele claims after PMID:42281740
  details: |
    Review response to the CHANGES_REQUESTED on PR #11036. PMID:42281740 (Verdi et al., Clin Case Rep 2026;14(6):e72899) reports a thirteen-month-old with an overlapping phenotype carrying two compound heterozygous ZPR1 variants of uncertain significance: c.84del, maternally inherited and predicted to truncate, and p.(Leu149Ser). Phasing was never established, so the founder-allele framing and the knowledge gap both stand, but every absolute single-allele statement in the entry becomes a qualified one. Fetched and committed references_cache/PMID_42281740.md; added the reference to references:; curated all three alleles as genetic[].variants with clinical_significance (PATHOGENIC for the founder allele, UNCERTAIN_SIGNIFICANCE for both new ones); added 10 verified snippets across genetic, the founder-variant pathophysiology node and the single-allele knowledge gap. Rewrote 17 propagation sites, not only the four the reviewer named: description (twice), inheritance description and evidence explanation, the founder-variant node, growth-restriction and death-in-early-childhood denominators, genetic notes and evidence explanation, prevalence notes, diagnosis, genetic counselling, the heterozygous-mouse description and its FAILS_TO_RECAPITULATE link description and limitations, the HUMAN_MODEL_MISMATCH prompt, and the knowledge-gap prompt and rationale. No phenotype was added from the new report because the genotype is unconfirmed; that decision is recorded in the genetic notes. Also adopted two non-blocking review suggestions: biological_scale ORGANISM -> TISSUE on Reduced Cell Proliferation in Developing Tissues (with its description reworded to match), and removal of the duplicate DOI:10.1111/cge.13388 cache. Validation: just validate all three lanes clean, 65/65 snippets verified with no prefix skips; validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms clean; whole-KB check-title-snippets, check-snippet-length and check-snippet-grading clean. No orphan graph targets (21 targets, 0 unresolved; the founder-variant node is the graph root and correctly has no incoming edge).

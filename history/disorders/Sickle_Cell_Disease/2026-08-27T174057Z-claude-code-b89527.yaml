  summary: Cite cold exposure, high altitude and infection triggers
  details: |
    Added evidence to the three remaining bare environmental entries. High Altitude cites PMID:7340130, which quantifies crisis risk in mountains versus pressurised air travel. Infections cites PMID:39568431 for the statement that infections trigger complications of the disease itself. Cold Exposure is the careful one: the human evidence (PMID:34540479) is a seasonal correlation with a weak coefficient, so it is graded PARTIAL and paired with a sickle mouse study (PMID:37774369, MODEL_ORGANISM) that shows the causal step with genotype and temperature controls. The entry's note was rewritten from the unqualified 'Triggers vaso-occlusion' to state what the evidence actually supports. Part of #8296.

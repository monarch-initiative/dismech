  summary: Link dehydration and hypoxia to polymerization; repair a truncated snippet
  details: |
    Backfill for issue #8085. Dehydration is TRIGGERS with DIRECT and supports SUPPORT into the haemoglobin polymerisation node, an unusually exact fit whose reason is physical: polymerisation depends steeply on intracellular haemoglobin S concentration, so removing water from the cell acts on the node directly, and the cited sentence states precisely that. Hypoxia points at the same node and is also DIRECT, because the node is about deoxygenated haemoglobin S, so falling oxygen tension acts on it with nothing in between; it is graded PARTIAL despite that tight fit, because the only available sentence concerns oxygen tension regulating ion transport pathways and never states that hypoxia promotes polymerisation. The directness there comes from the node's own wording rather than from the evidence, which the link description says. Three exposures, cold, high altitude and infection, carry no evidence at all and could not be linked; they are part of the gap recorded in issue #8296. Two pre-existing defects in this entry were repaired while it was open. One evidence item quoted the polymerisation sentence truncated mid-clause, ending at cellular Hb S concentration and cutting off the words that state what dehydration does; it was extended to the whole sentence, the same defect blocked on in PRs #8168 and #8301. Separately, three items citing this review were classified inconsistently, one tagged HUMAN_CLINICAL and two untagged and therefore defaulting to it; the paper is a review, so all three are now OTHER, matching the copies on the new links. The claim that all three items citing this review were retagged was wrong when written: two exposure-level items were still untagged. All items citing it are now OTHER. Validated with linkml-validate and just validate-terms.

  summary: Add three computable phenotype definitions (PheKB 615, HDR UK PH304 and
    PH3021)
  details: |
    Added definitions[] for three computable phenotypes. PheKB 615 (Michalik et al., Medical College of Wisconsin) was transcribed by hand from the PheKB algorithm document cached as PHEKB:615: eight ICD-9-CM qualifying codes, a trait-dominance exclusion on 282.5, and a utilization rule (two outpatient visits at least 30 days apart or one hospitalization) combined with the diagnosis rule by ALL_OF. Validation PPV and sensitivity are quoted from PMID:27979750. The document's prose lists HbSS 282.60 but its Table 1 omits it; the code list follows the table and notes the discrepancy. HDR UK PH304 (CALIBER) and PH3021 (OpenSAFELY / NHSD SICKLE_COD) were converted by just hdruk-definition from the library API; CPRD medcodes in PH304 have no dismech code system and were dropped, as notes records. PH304 carries the library's own MONDO:0011382 tag, matching disease_term. All code lists pass just check-codelists against the cached records; the entry passes just validate.

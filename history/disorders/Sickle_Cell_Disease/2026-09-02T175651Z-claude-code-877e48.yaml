  summary: 'Integrate assessed OpenScientist findings: polymerization kinetics, multicellular
    vaso-occlusion, dehydration loop'
  details: |
    Integrated the assessed findings of the openscientist hypothesis-search report for canonical_hbs_polymerization_vasoocclusion_model (assessment sidecar: kb/hypotheses/Sickle_Cell_Disease/canonical_hbs_polymerization_vasoocclusion_model/assessments/openscientist-assessment-by-claude-opus-5.yaml, verdict SUPPORTED).

    Added. (1) Two evidence items on the Hemoglobin Polymerization node supplying the kinetic mechanism the entry asserted but never cited: the Ferrone/Hofrichter/Eaton double-nucleation paper (PMID:4020873) and Ferrone's 40-year delay-time reassessment (PMID:25645011). (2) A new pathophysiology node, Endothelial Activation and Leukocyte Recruitment, carrying the multicellular half of vaso-occlusion, downstream to Vaso-Occlusion and fed from Red Blood Cell Sickling and Chronic Hemolysis, with four evidence items spanning the proposing review (PMID:11844991), Berkeley-mouse intravital intervention (PMID:17932253), the MSH neutrophil-count association (PMID:8982148) and a 140-patient soluble-CAM series (PMID:41206783). (3) A new pathophysiology node, Erythrocyte Dehydration, closing the Gardos/KCC amplification loop back onto polymerization, evidenced from PMID:15618480 and the dehydration review already cited in the entry. (4) Two evidence items and a notes block on the Voxelotor treatment, which previously carried no evidence at all. (5) Three discussions: a KNOWLEDGE_GAP on the polymerization-inhibition threshold with a dose-response experiment, a HUMAN_MODEL_MISMATCH on whether complement activation drives crisis in patients, and a KNOWLEDGE_GAP on the inflammation-to-clinical-heterogeneity link.

    Deliberately not changed. The hypothesis status stays CANONICAL and its description and notes are untouched, since the report recommended retaining CANONICAL and the three qualifications it wanted added were already written into the hypothesis notes by an earlier pass. The hemolysis-vasculopathy axis the report presents as a qualification is already fully curated on the Chronic Hemolysis and Vaso-Occlusion nodes. The report's claim that voxelotor's market withdrawal was caused by its failure to reduce crises was not curated: neither cited source supports that causal step and the withdrawal followed a postmarketing safety signal, which the existing description already states correctly; the notes block records the correction. The mouse comparison of IL-1beta against P-selectin blockade (PMID:39568425) was verified but not integrated, being comparative therapeutics rather than a missing mechanism step.

  summary: Bind newborn-screening LOINC measurements
  details: |
    LOINC tranche A batch 5 (issue 13642). The entry had no diagnosis section; added one newborn-screening row (NCIT:C81178) describing the dried-blood-spot hemoglobin pattern screen (FS, FSC, FSA with S above A, and the rarer FSE, FSD-Punjab and FSO-Arab patterns) with measurements bound to LOINC:64116-7 (hemoglobin observations newborn screening panel), LOINC:64117-5, LOINC:64118-3 and LOINC:64119-1 (most, second and third most predominant hemoglobin in DBS) and LOINC:46765-4 (sickle cell anemia newborn screen interpretation). No reference range: the screen is a presence-type pattern and the cited programmes state no HbS-fraction cut-off, so LOINC:56476-5 is not bound; the method-specific DBS pattern codes (LOINC:54103-7, 54104-5, 54105-2) are not bound because no method-less pattern code came back from the Monarch KG search. Evidence from the Madrid 15-year programme (PMID:32451712, HPLC phenotypes FS, FSA, FSC, FSE, FSDPunjab, FSOArab) and the Florida programme preterm false-positive study (PMID:21584936, IEF and HPLC methods, FS as the disease-suggesting pattern, FSA often resolving to trait, preterm false positives). On the biochemical HbS marker, loinc_term bound to LOINC:4625-0 (Hemoglobin S/Hemoglobin.total in Blood, method-less) because that marker is the blood electrophoresis fraction. The fetal hemoglobin marker was left without a code. Labels seeded by just loinc-seed-cache; validate, validate-terms, count-verified-snippets, validate-disorders, check-duplicate-keys, check-entity-refs and check-snippet-grading all pass.

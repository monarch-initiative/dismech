  summary: Review Centronuclear Myopathy genetics, mechanisms and clinical evidence
  details: |
    Reviewed cached abstracts, available full texts, the matching Falcon report and its citation/artifact files, the full X-Linked Myotubular Myopathy GeneReviews chapter, primary genetic and natural-history studies, and current ClinicalTrials.gov API snapshots. Corrected BIN1 inheritance, added CCDC78, MAP3K20 and CACNA1S spectrum coverage, and removed misleading broad subtype mappings. Separated gene-specific molecular effects, triad and excitation-contraction defects, muscle contractile dysfunction and provisional liver trafficking mechanisms; removed unsupported weakness-to-histology, ocular and hepatic causal links. Added subtype-scoped clinical findings, diagnostics, genetic counseling, supportive care, surveillance, anesthetic precautions and trial safety/status evidence. Cohort frequencies are not population penetrance; claims-code frequencies are not genetically confirmed clinical prevalence; model-organism findings and provisional mechanisms are explicitly qualified. GeneReviews evidence covers clinical characteristics, diagnosis, management and genetic counseling. High-value full-text findings include survivor-cohort limitations, untreated cholestasis, allele-specific DNM2 abundance, CCDC78 protein complexes and limited zebrafish bile-transport rescue. Secondary model pathways and broader RYR1-only therapeutic findings were not asserted as established pan-CNM mechanisms or treatments. Deterministic validation passed schema, terms, 163 exact snippets and 165 titles, with zero skipped or unavailable snippets. Formal independent PR review remains required.

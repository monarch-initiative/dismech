  summary: 'Genetics pass: add SPEG and TTN, wire RYR1, bind all six subtype rows'
  details: |
    Genetics pass for #12192, and the one entry in the tranche with a real missing gene. SPEG was the gap the issue names: a `has_subtypes` row 'SPEG-CNM' existed and was correctly mapped to MONDO:0014418, but no `genetic:` record bound hgnc:16901 and no node carried the mechanism. Researched it afresh - the gene-discovery paper (PMID:25087613, SPEG as an MTM1-interacting protein, three unrelated probands) and an independent replication series (PMID:28624463) - and added a `genetic:` record, a 'SPEG deficiency and impaired triad maturation' node upstream of the shared triad lesion, and the subtype gene binding. TTN was in the same state minus the MONDO term: added a `genetic:` record and a 'Titin truncation and sarcomeric backbone disruption' node from PMID:23975875, kept deliberately off the triad chain because that paper's own conclusion is that titin reaches the CNM phenotype by a different route. RYR1 was curated but unwired; bound it to the excitation-contraction coupling node, which is the step RyR1 performs. All six subtype rows now carry genes. Also replaced an unsourced prose incidence figure ('approximately 1 in 50,000 male births') in the prevalence record with the Orphanet review's own 2/100,000 estimate (PMID:18817572), quoted and structured, and recorded that the figure is that source's estimate rather than a measured rate. MONDO reconciliation: MTM1, DNM2, BIN1 were already present; SPEG was added.

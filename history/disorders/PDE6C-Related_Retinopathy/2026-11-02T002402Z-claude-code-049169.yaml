  summary: 'Create: PDE6C-Related Retinopathy'
  details: |
    New autosomal recessive cone photoreceptor disorder entry (MONDO:1040028, PDE6C). Deep research via claude_code provider (preflight-dr PASS, 55 PDE6C mentions). Pathophysiology built as a chain conforming to phototransduction_cascade_dysfunction (trigger, cGMP/Ca set-point loss, light-response failure, cGMP/Ca overload degeneration handoff). Evidence from the PDE6C gene-discovery cohort (PMID:19615668), a PDE6C patient cohort (PMID:33001157), biochemical null-allele characterization (PMID:21127010), a PDE6C rhesus macaque model (PMID:39641747), the ClinGen Retina GCEP Definitive validity curation (CGGV assertion), and the GeneReviews Achromatopsia chapter (PMID:20301591, tagged GeneReviews). Validated with validate-disorders (0 issues), 35/35 snippets verified, gene-validity clean, conformance registered. Closes #16296.

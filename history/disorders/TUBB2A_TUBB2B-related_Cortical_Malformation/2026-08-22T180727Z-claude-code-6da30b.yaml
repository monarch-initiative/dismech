  summary: 'Add 2026 Turkish cohort findings: probable SUDEP and movement disorders'
  details: |
    QA-pass currency update from PMID:42472988, a 2026 multicentre Turkish tubulinopathy cohort (15 patients, 12 families, seven genes including TUBB2A and TUBB2B). Two additions. First, a SUPPORT evidence item on the existing Epilepsy / Seizures phenotype recording the first report of probable sudden unexpected death in epilepsy (SUDEP) in a TUBB2A patient; the explanation preserves the authors' own 'probable' hedge and notes that a single patient establishes that the risk exists, not its magnitude. Second, a new Movement Disorder phenotype (dystonia, HP:0001332) recording dystonia and mirror movements in 33.3 percent of the cohort. No frequency band is asserted on the new phenotype because the percentage is across all seven cohort genes, not TUBB2A/TUBB2B-specific. The description notes that mirror movements point at the migration module's axon-guidance branch rather than its migration branch. Validated: schema OK, 82/82 snippets verified against cached references.

  summary: 'Review: TUBB2A/TUBB2B-related cortical malformation'
  details: |
    First structured REVIEW of the combined beta-tubulin cortical-malformation entry. Reconciled the older polymicrogyria-like label to HP:0032398 Dysgyria, broadened the cohort-level ocular-frequency assertion to an evidence-matched parent term, and added source-backed TUBB2A/TUBB2B imaging and clinical phenotypes without importing unsupported external frequencies. Added molecular/cellular/tissue scale and role tags, explicit causal-link types, evidence on every retained edge, TUBB2A and TUBB2B trigger-gene wiring, and complete phenotype connectivity while marking association-only routes PARTIAL with unknown intermediates. Added ultra-rare/onset evidence, a representative TUBB2A p.Gly98Arg variant, MRI and molecular diagnosis, and evidence-backed anti-seizure, rehabilitative, and counseling management. The direct TUBB2B RNAi migration evidence is deliberately only PARTIAL for the shared TUBB2A/TUBB2B edge. The existing human-organoid mismatch and lump/split knowledge gaps remain open. D2P source gaps were reviewed: internal capsule, cerebellar vermis, brainstem, and olfactory bulb abnormalities were added from exact local evidence; thalamic, ADHD, ataxia, macrocephaly, and narrower eye/seizure terms were not imported without claim-matched local evidence. Validation at review time: schema/ontology/reference checks passed, 66/66 snippets verified, graph 3 pathophysiology nodes and 16 phenotypes with all targets resolved and every edge evidenced, no new short snippets, and no dataset accessions.

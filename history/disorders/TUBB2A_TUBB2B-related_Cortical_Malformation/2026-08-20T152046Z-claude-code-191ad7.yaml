  summary: Refresh lumping gap, add Uner Tan boundary, MONDO mappings and subtype
    terms
  details: |
    Recommendations 6, 8 and 9 of docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

    Refreshed gap_tubb2ab_lumping_boundary. Its original premise - that TUBB2A had only nine reported individuals and so would make a stub entry - no longer holds: TUBB2A now has a 28-patient epilepsy cohort with a genotype-phenotype correlation, a recurrent Arg391 E-site hotspot across unrelated families, and an adult ataxia phenotype with preserved ambulation at 40 years. The lump is not thereby refuted, but the discussion now states that the split decision must be argued on mechanism rather than settled by default on thin evidence, and names the concrete question a future curator should answer.

    Added gap_tubb2ab_functional_impact_class recording why functional_impact_category is UNKNOWN for these two genes. Impaired heterodimer formation is evidenced for both, but does not discriminate a dominant-negative poisoning mechanism from a reduced functional heterodimer pool - and the distinction decides whether isotype-compensation strategies should be expected to work here.

    Added gap_tubb2b_uner_tan_boundary and a relatedMatch mapping for MONDO:0100144. Uner Tan syndrome is an is-a descendant of MONDO:0100153 caused by a TUBB2B variant, but it is biallelic/recessive, explicitly lacks the basal ganglia malformation this entry curates as core, and its R390Q lesion does not impair folding, heterodimer assembly or microtubule incorporation. relatedMatch deliberately does not retire the concept from the curation queue.

    Added subtype_term values binding the TUBB2A and TUBB2B subtypes to CDCBM5 and CDCBM7, and an entry-level mappings block.

    Verified: just validate passed with 80/80 snippets verified; just validate-terms passed.

  summary: 'Address review on PR 18150: GO process placement and snippets'
  details: |
    Moved the GO biological processes off the multisystem injury node back onto the nodes they describe: homocysteine metabolic process and L-methionine metabolic process onto Impaired methionine synthase activity and remethylation, propionyl-CoA catabolic process onto the methylmalonyl-CoA mutase node; restored cobalamin transport (GO:0015889) on the absorption/transport node and cobalamin metabolic process (GO:0009235) on the cofactor-synthesis node, beside the molecular functions added earlier. Retagged the multisystem injury node biological_scale ORGANISM. Restored the entry-level notes paragraph breaks to match main (wording unchanged). Phenotype evidence: Hyperhomocysteinemia now quotes the PMID:39390411 sentence stating hyperhomocysteinaemia; Hypomethioninemia keeps the PMID:27905001 item and adds the GeneReviews management-goal sentence on plasma methionine as directness INDIRECT, since no cited source reports low methionine directly; Intellectual disability replaces the adult cognitive-decline sentence with PMID:35013307 (severe cognitive impairment in cblC) and PMID:38617190 (intellectual disability in HCFC1/ZNF143 forms), both introduction sentences recorded as BACKGROUND. Betaine and L-carnitine supplementation changed from BEHAVIORAL to SMALL_MOLECULE. The nitrous oxide avoidance link changed from INHIBITS to MODULATES, with a description saying avoidance prevents worsening rather than reducing the existing impairment. Added PR 18150 to the earlier history record's links. Not changed: the MMACHC/MMADHC oxidoreductase and MMAA/MMAB molecular-function bindings.

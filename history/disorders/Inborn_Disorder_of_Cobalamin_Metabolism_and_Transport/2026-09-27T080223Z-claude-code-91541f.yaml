  summary: Bind the cobalamin complementation-group subtype rows
  details: |
    Genetics pass for issue #12273 (d2g series-066). All ten pre-existing has_subtypes rows carried a free-text name and description and no subtype_term, genes or inheritance; each now binds the MONDO class for its complementation group, the HGNC gene, and an HPO mode-of-inheritance term, with evidence from the GeneReviews chapter on disorders of intracellular cobalamin metabolism and from ClinGen gene-validity assertions. An eleventh row was added for cblL (THAP11, MONDO:0975798), whose MONDO record carries no definition, synonym or gene axiom and is reachable only through its OMIM:620940 equivalence. HCFC1, THAP11 and ZNF143 were named in prose but bound nowhere; they now have genetic entries and a new pathophysiology node for reduced MMACHC expression from the HCFC1-THAP11-ZNF143 complex, wired upstream of the existing cofactor-synthesis node. The entry description was corrected: it asserted autosomal recessive inheritance for the whole group, which the X-linked HCFC1 form contradicts. Validated with just validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, list-gene-term-mismatches --resolve and validate-disorders.

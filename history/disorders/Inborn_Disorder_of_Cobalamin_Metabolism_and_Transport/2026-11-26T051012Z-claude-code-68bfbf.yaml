  summary: 'Gene-family review: MMACHC, MMADHC, LMBRD1, ABCD4 (+ MTR, MTRR; THAP11/ZNF143
    typing)'
  details: |
    No mechanism node in this grouping entry bound a molecular function, and only four genes had genetic records. MMACHC's record (cblC) is now CAUSATIVE, germline, with HP:0000007, the ClinGen Definitive tier for MONDO:0010184 and record-level evidence (PMID:32071835). New subtype-scoped records with bound inheritance, a ClinGen tier and a primary citation: MMADHC (cblD; ClinGen Definitive against this entry's own term MONDO:0019220, recorded without a subtype; PMID:18385497), LMBRD1 (cblF, Definitive; PMID:19136951), MTR (cblG, Definitive; PMID:8968737), MTRR (cblE, Definitive; PMID:9501215) and ABCD4 (cblJ, ClinGen Moderate, so typed UNKNOWN; PMID:22922874). THAP11 (ClinGen Limited) and ZNF143 (ClinGen below Strong) were typed CAUSATIVE and are now UNKNOWN, following the convention that CAUSATIVE needs a Definitive or Strong tier. Node molecular functions added, each the gene's own activity, DECREASED: ABCD4 GO:0015420 ABC-type vitamin B12 transporter activity, with LMBD1's role recorded as GO:0061462 protein localization to lysosome; MMACHC GO:0033787 decyanase and GO:0016765 glutathione-dependent dealkylase activities (PMID:18779575, PMID:19801555); MMADHC GO:0031419 cobalamin binding, since its Cys-261 coordinates MMACHC-bound cobalamin (PMID:40996799); MTR GO:0008705 and MTRR GO:0030586. The transport node had called LMBRD1 a lysosomal cobalamin exporter; reconstituted liposome assays show ABCD4 exports cobalamin in an ATPase-dependent way while LMBD1 has no transport activity and is needed to bring ABCD4 to the lysosome (PMID:33845046), so the description now says that. The MTR and MTRR changes were requested by the folate-family review. Note for curators: ClinGen re-curated ZNF143 to Limited (2026-04-10); the cited 2024 record still reads Moderate.

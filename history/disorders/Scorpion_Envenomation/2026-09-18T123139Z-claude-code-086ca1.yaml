  summary: 'Create: Scorpion Envenomation (MONDO:0018755)'
  details: |
    New entry for scorpion envenomation, curated from a claude_code deep-research
    run (research/Scorpion_Envenomation-deep-research-claude_code.md, 257.89s, 23
    web searches, 62 citations).

    Disease choice and duplicate preflight. The first candidate was lathyrism; the
    Step 1 preflight found it already curated and merged (PR #4213, June 2026) and
    it was dropped before any work was done. A second pass enumerated the 72 MONDO
    descendants of MONDO:0029000 poisoning against every MONDO CURIE referenced
    anywhere in kb/, which left 44 unused; scorpion envenomation was chosen from
    that list. Preflight on the chosen disease: no kb/ or stubs/ file, no PR and no
    issue naming scorpion or MONDO:0018755. The only related entry is
    Snakebite_Envenoming, which is a sibling rather than an overlap.

    Report validation. Reference validation was clean - 47/47 references resolved,
    confabulation_rate 0.0. Term validation set needs_review: true, and the four
    mislabelled terms split into two harmless and two seriously wrong. The harmless
    two were HP:0001649 and HP:0001662, where the report had prefixed the ontology
    labels ("Sympathetic predominance: tachycardia"). The wrong two were CL:0011105,
    offered as "parasympathetic neuron" and actually dopamanergic interplexiform
    cell, and UBERON:0001911, offered as "skin of body - sting site" and actually
    mammary gland. A third was caught by reading rather than by the validator:
    HP:0031297 was offered as "Skin ulcer" but is an obsolete coronary sinus atrial
    septal defect term, replaced by HP:0011643; the real Skin ulcer is HP:0200042.
    None of the report's suggested CURIEs was used. Every binding in the entry was
    looked up independently against OLS or the pinned local ECTO build at the moment
    it was written.

    preflight-dr returned SKIP, as expected for a disease MONDO records no causal
    gene for, so disease identity was checked by hand against the report's Section 1:
    it names MONDO:0018755, ICD-10-CM T63.2, MeSH Scorpion Stings, and describes
    buthid envenomation throughout. No Named Entity Confusion.

    Content: ten pathophysiology nodes in one chain with two branches and a parallel
    hypothesis arm. The spine runs venom neurotoxin binding at the sodium-channel
    voltage sensor -> loss of fast inactivation and repetitive firing -> autonomic
    neurotransmitter storm -> catecholamine-mediated myocardial injury -> cardiac
    dysfunction and pulmonary oedema. The storm node fans out to eight symptom
    phenotypes, each cited to a sentence that names which transmitter produces it.
    Sixteen phenotypes, all sixteen causally connected.

    The entry's substantive argument is that two accounts of what kills are on the
    table and they prescribe differently, so both are curated as
    mechanistic_hypotheses with edges opting in via hypothesis_groups.
    adrenergic_catecholamine_storm (CANONICAL) is the classical adrenergic
    myocarditis account, supported by human clinical review and by prazosin's
    measured benefit. il1r_pge2_cholinergic_axis (EMERGING) is PMID:33116136, in
    which IL-1R signalling drives PGE2, PGE2 drives excessive vagal acetylcholine,
    and that cholinergic arm causes the heart failure - with IL-1R knockout,
    dexamethasone, atropine and vagotomy each abolishing mortality in mice, and the
    authors noting the pathway is untouched by antivenom. Status is EMERGING rather
    than ALTERNATIVE because nothing in it has been tested in humans.

    That claim is also curated as a HUMAN_MODEL_MISMATCH rather than a knowledge
    gap, on the distinction CLAUDE.md draws: the evidence is not absent, it exists
    and is good, and what is open is whether it transfers. The discussion records
    three specific reasons to hold it open - an intraperitoneal bolus is not a
    sting, Tityus serrulatus is not the genus causing most of the world's
    mortality, and the only human data are correlational (PMID:41327440, cited
    INDIRECT for exactly that reason). A second discussion,
    which_autonomic_arm_kills, records the disagreement itself and notes that the
    two bodies of evidence are asymmetric in kind, so neither could refute the
    other.

    has_subtypes splits Neurotoxic (Buthidae) from Cytotoxic (Hemiscorpius
    lepturus) because these are two mechanisms, not one spectrum: PMID:9679690
    reports that buthid venom is neurotropic and noncytotoxic and induces no
    cutaneous reaction at all, while HL venom is cytolytic. The cytotoxic branch has
    its own chain - phospholipase activity -> intravascular haemolysis with acquired
    ADAMTS13 deficiency -> thrombotic microangiopathy and acute kidney injury - and
    shares none of the autonomic nodes. Every phenotype carries a subtype key.

    conforms_to: the IL-1R node declares
    nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1
    Activation, which the source supports directly - it reports NLRP3-, ASC- and
    caspase-1-dependent IL-1 beta release after venom. No conformance was declared
    to any cardiac module: cardiac_ion_channel_repolarization scopes itself to
    inherited arrhythmia syndromes in structurally normal hearts, which this is not.

    Ontology decisions worth recording. GO:0005248 voltage-gated sodium channel
    activity carries modifier GAIN_OF_FUNCTION rather than INCREASED, because the
    claim is qualitative - the gate that terminates channel opening has been
    disabled by a bound peptide - and there is no host variant, so nothing for
    functional_impact_category to describe. An earlier draft bound GO:0035725 in
    molecular_functions and failed the MolecularFunctionTerm enum, correctly: it is
    a biological process.

    ECTO has no scorpion, venom, arthropod, bite or sting class. The neurotoxic
    exposure binds ECTO:0000730 exposure to neurotoxin, anchored on CHEBI:50910,
    and the cytotoxic one binds the broader ECTO:0000537 exposure to toxin because
    its agent is a cytolytic enzyme rather than a neurotoxin. Six searches and their
    outputs are written verbatim into the exposures' notes, including the two
    substring false positives that 'l~sting' returns, so the next curator re-runs
    them rather than guessing. Neither term is flagged Not4Curation.

    NCIT has no generic antivenom class - OLS q=antivenom and q=antivenin against
    ncit each return only NCIT:C87794, a coral-snake product - so the antivenom
    treatment binds the generic NCIT:C15986, matching what the sibling
    Snakebite_Envenoming entry does, with the searches recorded. HPO has no
    sting-specific term either; HP:0020014 Local paresthesia at bite site is worded
    for a bite and the specificity is carried in preferred_term, with q=sting and
    q=envenomation against hp recorded as returning nothing usable.

    One edge is deliberately INDIRECT_UNKNOWN_INTERMEDIATES: the local pain edge.
    The source attributes the pain to venom penetration without naming the receptor
    or afferent population, and the obvious candidate - the same sodium-channel
    action on nociceptors - is not what the sentence says, so the intermediates are
    recorded as unknown rather than assumed.

    Sources refused. The report cited Medscape, Wikidata, icd10data.com, a UN
    guidance PDF and several journal landing pages. None was used. Where such a
    passage named a real finding a peer-reviewed source was located for it
    instead - the seven risk regions and the 2.3 billion denominator came from
    PMID:18579104, the severity grading from PMID:37902581.

    References: 18 distinct (16 literature plus the NCT and ICTRP trial
    registrations), all cited with exact quotes. PMC identifiers in the
    report were resolved to PMIDs through the NCBI converter before fetching, and
    DOIs to PMIDs through esearch, so PMID-keyed evidence is used throughout rather
    than the DOI-keyed form the validator skips. One fetched cache was pruned
    (PMID_21876146, the same PNAS paper the report cites by DOI and which the entry
    does not cite); the cited set was re-derived immediately before pruning and no
    orphans remain.

    Red-team review before PR. A subagent reviewed the entry with fresh context
    against the dismech-pr-review skill and returned one CRITICAL and ten
    IMPORTANT findings; all were verified independently against the caches and
    ontologies before being acted on, and all were fixed in this same session
    before any commit.

    The CRITICAL one is worth recording in full because it is the failure mode
    the repo's own guidance names. The NLRP3 conformance evidence had been
    quoted as "TsV increased NLRP3, Asc, and Casp1/11" - truncated mid-clause.
    The source reads "TsV increased NLRP3, Asc, and Casp1/11-dependent IL-1 beta
    release": those three names qualify "dependent", so the paper says release
    REQUIRED the inflammasome components. As truncated, the snippet asserted
    instead that venom upregulated them - which is transcript-upregulation
    evidence, exactly what the NLRP3 module's node description excludes as
    insufficient for conformance. Worse, the explanation justified the
    truncation by claiming the full clause could not be quoted because of a
    superscript; that was false. The full clause is an exact substring, the
    character between "11" and "dependent" being U+2212 MINUS SIGN rather than a
    hyphen. Fixed by quoting the full clause and removing the false
    justification. Every gate passed in both states, which is the point: nothing
    in the stack reads which claim a true quote is attached to.

    Other findings fixed: three storm-to-symptom edges (hyperhidrosis, vomiting,
    priapism) cited a transmitter-mapping sentence that does not name them, and
    were re-cited to sources that do; six quote_role values on PMID:37902581
    were REVIEW_SYNTHESIS when that paper's publication_types is Journal Article
    only and the quotes come from its introduction, so they are now BACKGROUND;
    PMID:41327440 was graded HUMAN_CLINICAL on a sentence that describes animal
    studies and is now MODEL_ORGANISM, with a second item added for its actual
    human result; the discussion prose claimed IL-1 beta tracks with cardiac
    AND pancreatic complications when that study found the pancreatic
    association insignificant, and now says so; CL:0000166 chromaffin cell was
    replaced by the exact CL:0000336 adrenal medulla chromaffin cell;
    HP:0002307 Drooling was replaced by HP:0003781 Excessive salivation, which
    is the secretory-drive concept the mechanism claims rather than the
    orofacial-overflow one; two ADAMTS13 evidence items were moved onto the
    sentences that state their claims; a node named Cytotoxic Venom
    Phospholipase Activity asserted an enzymology nothing cited supports and was
    renamed Cytolytic Venom Membrane Damage with the reason recorded; and an
    edge whose own description said the inflammatory arm runs in parallel was
    drawn from the storm node anyway, and is now drawn from the exposure so the
    graph says what the curation says.

    Process note worth recording. Two evidence additions earlier in the session
    printed success while silently doing nothing, because the edits used
    str.replace without asserting the anchor matched. They were caught only by
    reading the compliance breakdown, which showed the canonical hypothesis and
    one discussion at zero evidence. Every subsequent edit asserts its anchor
    count.

    Content added in the review round, against the skill's
    Content-Completeness Checklist: an animal_models entry for the C57BL/6
    Tityus serrulatus model, with three typed ModelMechanismLinks carrying
    fidelity, model_scale, readouts, limitations and SPECIES_MISMATCH /
    BOUNDARY_OMISSION divergences. This matters because the entire EMERGING
    hypothesis and four pathophysiology nodes rest on that one model, and the
    translational caveats were previously trapped in discussion prose where
    nothing can query them. Also added: a clinical_trials block carrying
    NCT00685230 (the Boyer trial) and CTRI/2013/09/004002 via its WHO ICTRP
    record, which is the non-ClinicalTrials.gov registry case CLAUDE.md
    documents - fetched with just ictrp-fetch, and its retrospective
    registration quoted rather than asserted because it bears on how the result
    reads. A second prevalence record carries a real rate with its denominator
    (70 per 100,000 inhabitant-years, Brazil) alongside the worldwide count.

    Deliberately not done, and why. There is no datasets block: the disease has
    no disease-specific omics resource in the report, and a GEO search on
    scorpion venom returns venom-gland transcriptomes of the animal rather than
    host-response data, which is the Named Entity Confusion case CLAUDE.md
    describes reached through dataset search. Several phenotypes the report
    describes (pancreatitis, stroke, the neuromuscular hyperexcitability
    cluster) and several treatments (atropine, levosimendan, nanobody
    antivenoms) are left out of this first pass rather than curated thinly; the
    cached sources for them are committed, so the next round has them to hand.


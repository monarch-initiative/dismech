  summary: 'Review round 1b: diagnosis section, ventilation join, four blue suggestions'
  details: |
    Second push on the same review. The formal review body landed on the API after the first push, and it carries detail the summary comment did not: two parts of the blocking findings and four blue suggestions. My mistake was answering from the summary rather than waiting for the review object, which cost a cycle. This push closes everything remaining.

    Remaining parts of the blocking findings.
    - diagnosis: section added, which finding 1 asked for explicitly and the first push did not deliver. Transthoracic echocardiography (NCIT:C16525) and serial ECG with cardiac monitoring (NCIT:C38053). Echocardiography is curated as a diagnosis rather than as a biomarker because it is the endpoint every marker in the biochemical: section is evaluated against - sST2 and FABP3 report AUCs against cardiac ultrasound, proBNP is correlated against ejection and shortening fraction - and its notes say so, so the two sections read together rather than as duplicates. The ECG record's notes state that the tachycardia/bradycardia split is the bedside signal bearing on which autonomic arm dominates, and state explicitly that no cited source claims ECG resolves that question.
    - Mechanical ventilation and intensive supportive care now carries target_mechanisms to Cardiac Dysfunction and Pulmonary Edema (MODULATES). The evidence is the 36.7% requirement figure, graded directness INDIRECT, with the explanation saying plainly what it does and does not establish: the node drives the need for ventilation, and no cited source here measures what ventilation does to the node once started.
    - PMID:28390429, the controlled-trial meta-analysis, was uncited and is now cited twice on the antivenom treatment - the pooled Centruroides RR across 322 children, and the species-specific conclusion, which is what makes this treatment species-specific antivenom rather than antivenom.

    Blue suggestions, all taken.
    - S1 neuromuscular cluster: Fasciculations and Tremor added, both wired off Autonomic Neurotransmitter Storm. Note the reviewer offered HP:0002378 for Fasciculations; that CURIE is Hand tremor. The correct term is HP:0002380, which is what is bound. Both were looked up rather than copied.
    - S2 pancreatitis: Acute pancreatitis (HP:0001735) added with PMID:2028471, which was fetched and uncited. The edge from the storm node is INDIRECT_UNKNOWN_INTERMEDIATES on purpose - the human study measures pancreatic injury and proposes no route, and the murine IL-1R/NO work behind Hyperglycemia concerns islet function rather than acinar damage, so nothing in the sources identifies the intermediates. That is stated in the edge description rather than glossed.
    - S3 beta-NaTx and KTx: recorded as an explicit exclusion in the entry notes, with the reason - the chain rests on the structurally resolved site-3 mechanism and adding the others would mean asserting a chain the cited sources do not resolve.
    - S4 uncited caches: six of the seven the reviewer listed are now cited. The seventh, PMID:26135709, cannot be cited: it is a Letter with content_type unavailable and no abstract in PubMed, so there is no quotable text. The reviewer suggested pruning it; it is cited by the committed deep-research report, so pruning it would break that, and the entry notes record instead that the entry does not cite it and why. The cited-PMID set was re-derived from the entry, report and sidecar immediately before this decision rather than reused from earlier in the session.

    An earlier draft of that notes paragraph said the cache 'has been pruned'. That was false - the re-derivation showed the report cites it - and it was corrected before commit. Prose describing repository state is content and it rots, which is exactly the case CLAUDE.md warns about.

    Validation: just validate-disorders passes; 123/123 snippets verified offline, up from 111. Weighted compliance 93.4%, up from 92.8%. All 19 phenotypes causally connected. Causal graph orphan_targets empty (45 nodes, 47 edges). Offline gates green: entity-refs, causal-targets, qualifier-terms, duplicate-keys, enum-values, environmental-evidence, snippet-length, title-snippets, snippet-grading, reference-titles. Every snippet verified as an exact substring before being written; every script edit asserted its anchor matched exactly once, and one of those assertions caught a wrong anchor before anything was written.

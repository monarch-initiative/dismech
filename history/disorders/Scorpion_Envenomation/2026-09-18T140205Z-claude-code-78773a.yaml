  summary: 'Review round 1: biochemical section, prevalence band, treatment joins'
  details: |
    Addresses the three IMPORTANT findings in the automated review of PR #12127, in one push.

    1. No biochemical/diagnosis section, with four diagnostic references fetched and committed but never cited. Added a biochemical: section with five markers, each carrying readouts joined to the pathograph: NT-proBNP (NCIT:C88524), CK-MB (NCIT:C122778), cardiac troponin (NCIT:C17343), soluble ST2 (NCIT:C106011) and heart-type FABP3 (NCIT:C20974). NT-proBNP carries two readouts against Cardiac Dysfunction and Pulmonary Edema - PREDICTS/PROGNOSTIC from the admission value and CORRELATES_WITH/NEGATIVE against ejection and shortening fraction. CK-MB is the only one pointed at Catecholamine-Mediated Myocardial Injury rather than at the terminal node, because it reports myocyte injury rather than ventricular performance. Troponin carries a REFUTE item: PMID:33994108 found no separation on conventional troponin I (P=0.051) where proBNP did separate, against PMID:39842516's ultrasensitive assay AUC 0.89. Both recorded; the likely explanation (different assay, different endpoint) is stated rather than one result dropped. sST2 has no NCIT term for the soluble isoform, so it binds the parent protein with the three OLS queries and their returns written out in notes.

    The fourth reference, PMID:32899951 (systematic review of autopsy findings), is not a biomarker and was cited instead on the Cardiac Dysfunction and Pulmonary Edema node: once for cardiotoxicity with terminal pulmonary oedema as the usual mechanism of death, and once for the cholinergic route to respiratory failure, which is human post-mortem material bearing on the arm the emerging hypothesis names. The second item's explanation states explicitly that it is not evidence for the IL-1R pathway.

    2. Brazil prevalence band. Corrected ABOVE_1_IN_1000 to BAND_1_5_PER_10000. Verified against _band_from_rate in scripts/migrate_prevalence.py, which maps any rate in 10-99 per 100,000 to that band, and against the enum description in the schema, which says the key combines the Orphanet 1-5 and 6-9 per 10,000 classes into one decade-spanning band. 70 per 100,000 is in that decade. The reviewer was right and my original value was wrong.

    3. Treatment-to-pathograph join points.
       - Dobutamine was unjoined and rested on one review's 'inotropes ... when indicated' line. Now joined to Cardiac Dysfunction and Pulmonary Edema with treatment_effect MODULATES (beta-1 agonism raises output against a depressed myocardium; it does not remove the cause), and cited from PMID:32428515, the dedicated 21-patient Swan-Ganz dose-ranging study, which was already cached and uncited. Its dosing sentence is quoted with the source's own non-breaking space before the unit, since the reference validator matches bytes.
       - Atropine added. It is the drug the two hypotheses disagree about, so it is curated as a disagreement rather than as a treatment: a SUPPORT target_mechanisms edge to Excessive Vagal Acetylcholine Release at the Heart from the mouse rescue result, and a REFUTE entry-level item from PMID:22826633's recommendation against routine human use, alongside the narrow bradycardia/AV-block indication the same review accepts. The notes record that the stated reason against routine use - leaving the sympathetic arm unopposed - is itself what the canonical hypothesis predicts, so the mouse and human positions are not simply in conflict.
       - Cytotoxic branch, previously untreated, now has two treatments at two different nodes. Plasma exchange and renal replacement therapy joins Thrombotic Microangiopathy and Acute Kidney Injury (MODULATES, directness INDIRECT), cited from PMID:40034936; the edge description states explicitly that the case establishes the combination was given and the child recovered, not that plasma exchange produced the recovery. An anti-heminecrolysin nanobody (therapeutic_modality NANOBODY) joins Cytolytic Venom Membrane Damage, cited from PMID:24891523's in vivo neutralisation result, and is described as a candidate rather than a treatment. Both carry their ontology-search records in notes, including why NCIT:C20401 Monoclonal Antibody was rejected for a single-domain fragment.

    Validation on the changed file: just validate passes (schema, terms, references), 111/111 snippets verified offline against the local cache. Weighted compliance 92.8%, up from 91.4%. Phenotype connectivity unchanged at 16/16. Causal graph has an empty orphan_targets set (42 nodes, 43 edges), so the new biomarker readouts and treatment edges all resolve to real node names. Offline gates green: entity-refs, causal-targets, qualifier-terms, duplicate-keys, enum-values, environmental-evidence, snippet-length, title-snippets, snippet-grading.

    Every snippet added in this round was verified as an exact substring of its cached reference before being written, and every edit to the YAML asserted that its anchor matched exactly once, after two silent no-op replaces cost a round earlier in this curation.

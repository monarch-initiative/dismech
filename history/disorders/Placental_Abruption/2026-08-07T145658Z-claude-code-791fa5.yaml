  summary: Link exposures and susceptibility markers to the vascular nodes
  details: |
    Backfill for issue #8085. Abdominal trauma is the one mechanically distinct link, TRIGGERS/DIRECT into decidual haemorrhage and retroplacental haematoma formation, because shearing tears decidual vessels without any preceding vasculopathy. Cocaine use is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into spiral artery failure via vasospasm, and carries the largest relative risk in the entry at 4.55. Cigarette smoking, hypertensive disorders, prior caesarean delivery and prior abruption are all PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the same vasculopathy node. Prior abruption is included deliberately even though it is not an exposure: it marks a persisting vascular susceptibility, with recurrence of 3.35 percent versus 0.66 percent, and is the strongest predictor in the entry. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 117 of 117 verified; integrity issue count unchanged.

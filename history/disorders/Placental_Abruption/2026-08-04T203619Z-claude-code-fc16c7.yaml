  summary: 'Address PR #7938 review: clinical trials, biochemical, thrombophilia,
    CP/PPROM'
  details: |
    Response to ai4c-reviewer CHANGES_REQUESTED on PR #7938. All six blocking items addressed, plus the suggestions and a CI fix.

    CI FIX (test 3.13): the failure was an enum-cache miss, not a data error. UBERON:0000453, GO:0007598 and GO:0070493 are valid (OAK-verified) but were absent from the committed cache/enums CSVs, so CI fell back to a live OLS lookup that timed out. Root cause was that my validation runs happened in the primary checkout, which silently seeded its own caches, while CI built from the worktree. Audited ALL 44 ontology CURIEs in the entry against the enum caches and seeded the 11 that were missing across 4 cache files (5 HP, 1 NCIT, 2 UBERON, 3 GO). Several of those were latent failures from the original commit that only passed because the live lookup happened to succeed. HGNC CURIEs are not enum-cached at all and validate without cache entries.

    BLOCKING ITEM 1 - clinical_trials: added five trials with phase/status verified live against the ClinicalTrials.gov API rather than taken from the research report. NCT05840471 (TXA, COMPLETED, n=116), NCT00186069 (MgSO4 tocolysis, COMPLETED, n=30), NCT02299414 (CHAP, PHASE_IV, COMPLETED, n=2408, curated as prevention rather than treatment), and the two TERMINATED biomarker studies NCT03782168 (n=1) and NCT01279369 (n=3), deliberately curated as a negative result documenting that abruption prediction has a track record of failing to complete.

    BLOCKING ITEM 2 - biochemical: fibrinogen with a one-sided pregnancy-specific reference range and three interpretation_bands anchored on PMID:17087729 (NPV 79% above 4 g/L, PPV 100% at or below 2 g/L). loinc_term deliberately omitted: this project has no configured LOINC adapter, so a LOINC code could not be verified, and per curation guidance no term beats an unverifiable one. Kleihauer-Betke added as a dosimetric rather than diagnostic test.

    BLOCKING ITEM 3 - thrombophilia: this is where I did NOT do what was asked. The reviewer requested F5 and F2 as SUSCEPTIBILITY citing PMID:16595080, but reading that source shows it cuts both ways: the abstract states significant risks were established for thrombophilic defects collectively in abruption, while the body text reports that FVL-specific subgroup estimates were NOT significant, and the same review's context is that thrombophilia screening is not recommended for placenta-mediated complications. Curated both genes as relationship_type: DISPUTED with supports: PARTIAL and notes explaining the split evidence. Recording them as settled susceptibility genes would overstate the evidence and imply a screening action that is not supported.

    BLOCKING ITEMS 4-5 - phenotypes: added Cerebral palsy (HP:0100021) with the PMID:22805996 finding that abruption was the single leading causative factor at 26% of hypoxia-attributed CP, and PPROM (HP:6000310) with both the CSF-2 paper and PMID:16251427.

    BLOCKING ITEM 6 - treatments: magnesium sulfate (CHEBI:32599), tranexamic acid (CHEBI:48669, with a target_mechanisms link to the coagulopathy node), induction of labour (NCIT:C92814) and emergency hysterectomy (NCIT:C15256).

    SUGGESTIONS applied: HP:0000083 replaced with the more precise HP:0001919 Acute kidney injury; the bundled 'Uterine Hypertonicity and Non-Reassuring Fetal Status' phenotype split into two, with hypertonicity left unbound because HPO has no uterine-hypertonus term; added back pain (HP:0003418) and neonatal asphyxia (HP:0012768); added decidual neutrophil infiltration and Amsterdam-consensus maternal vascular malperfusion to histopathology.

    One reviewer-suggested snippet was caught by the pre-write hook: I initially quoted the CHAP trial title, which lives in cache frontmatter rather than the cached body, and the reference validator correctly rejected it. Replaced with a body quote.

    Validation: just validate passes. 108/108 snippets verified (up from 81). Weighted compliance 97.9% (up from 97.7%). check-snippet-length, check-folded-hyphens and check-term-cache-integrity all pass against current origin/main.

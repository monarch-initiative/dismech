  summary: 'Create: Placental Abruption (MONDO:0004846)'
  details: |
    De novo curation of Placental Abruption (MONDO:0004846), closing issue #7929 and one of the named obstetric gaps in #7837.

    Deep research provider: claude_code (just research-disorder claude_code Placental_Abruption). The report ran clean (36 unique PMIDs, no truncation) and every quote spot-checked against the real cached abstract verified exactly, including the PMID:31420459 stroke effect sizes and the PMID:40140972 / PMID:35365209 / PMID:10214847 risk-factor quotes. All DR-supplied HGNC IDs (ABCC8 hgnc:59, KCNJ11 hgnc:6257, ZNF28 hgnc:13073, CTNND2 hgnc:2516, ADAM12 hgnc:190, IRX1 hgnc:14358) were independently confirmed with OAK before use. Literature was also sourced directly from PubMed rather than only from the DR report, particularly the Lockwood decidual tissue factor series.

    Mechanism modelled as a six-node wired pathograph: decidual vasculopathy and spiral artery failure (trigger) -> decidual hemorrhage and retroplacental hematoma formation (central effector) -> placental separation and loss of exchange surface (effector), with decidual tissue factor exposure and thrombin generation (amplifier) driving both thrombin-driven myometrial contraction and membrane weakening and consumptive coagulopathy, terminating in fetal hypoxic-ischemic injury. All nodes carry downstream causal edges with their own evidence, so no node is orphaned. A CANONICAL mechanistic_hypotheses entry records the chronic-ischemic-placental-disease framing.

    Deliberate curation decisions:
    - Stillbirth phenotype left unbound. HP:0003826 sits outside the HP:0000118 subtree the PhenotypeTerm dynamic enum is reachable from, exactly as flagged in issue #7837. The pre-write hook caught this; the phenotype is retained with an explicit in-entry note rather than being force-fit to a wrong term.
    - MPATH deliberately NOT used. Per curator direction, MPATH is treated as deprecated for this project. The Xogenesis-style curation note in notes: records the retroplacental hematoma as an OGMS:0000078 pathological anatomical structure arising by OGMS:0000081 pathological derivation at UBERON:0000453 decidua basalis, and omits the MPATH species term that the create-module skill would otherwise call for. The create-module skill and several existing kb/modules/ notes are stale on this point.
    - Sher severity classes 0-3 curated as stages with NO evidence items. The originating paper (Sher G, J Reprod Med 1978, PMID:722694) has no abstract indexed in PubMed, so no snippet is verifiable. Rather than fabricate a quote or launder the claim through a secondary source, the citation is recorded in the top-level references block and the stage descriptions are left unevidenced, with the reason stated in stages[0].notes.
    - genetic: opens with an explicit 'No Mendelian gene' entry so the section reads as a real negative finding rather than an uncurated blank. The six GWAS loci are all relationship_type SUSCEPTIBILITY with supports: PARTIAL, since every association is suggestive rather than genome-wide significant and single-ancestry (Peruvian PAGE/PAPE cohorts).
    - Four discussions record the epistemic state: the umbrella review found ZERO class I or II evidence risk factors (PMID:35365209), so every effect size in environmental: is suggestive at best; GWAS single-ancestry non-transferability; absence of any sensitive antenatal diagnostic test (ultrasound sensitivity 24%, PMID:12164566); and a HUMAN_MODEL_MISMATCH covering the fact that human trophoblast invasion depth is not reproduced in laboratory animals and that mice lack a CXCL8/IL-8 ortholog, which is why nearly all mechanism evidence here is human tissue or human decidual cell culture.
    - Long-term maternal cerebrovascular risk curated under progression with explicitly non-causal framing, mirroring how Preeclampsia handles the same association. The equal hazard ratios for ischemic and hemorrhagic stroke are noted as arguing for a shared vascular diathesis rather than a thrombotic sequela.

    Upstream ontology defect found: MONDO:0004846 carries the definition 'Vaginal bleeding preceding the 20th week of gestation' (inherited from NCIT:P378), which is wrong. Abruption is separation of a normally implanted placenta in the second half of pregnancy; bleeding before 20 weeks is threatened or spontaneous abortion. HP:0011419 is correct. Recorded in notes: for upstream reporting to MONDO.

    Validation: just validate passes (schema + terms + references). 77/77 snippets verified against cached references. Weighted compliance 97.6%. Note that term and reference validation had to be run from the primary checkout, since the fresh worktree venv exits 1 with no output.

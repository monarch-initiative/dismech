  details: |
    Second round of PR #7938 review response. Two remaining blocking items, one of which was a genuine error on my part.

    ITEM 1 - I MISREAD PMID:16595080 AND THE REVIEWER WAS RIGHT. In the previous round I curated F5 and F2 as relationship_type: DISPUTED, arguing on the PR that the source contradicted itself. It does not. The sentence I relied on ('...were not significantly associated with placental abruption') spans a PDF page break in the cached text, and its subjects are MTHFR homozygosity, antithrombin/protein C/protein S deficiency, anticardiolipin antibodies and acquired APC resistance - NOT Factor V Leiden or prothrombin. I noticed the page-break problem at the time, explicitly told myself to find the real results section rather than quote a headless fragment, and then built the argument on the fragment anyway.

    Verified Figure 9 directly in the cached text before conceding. It gives: FVL homozygous z=1.39 (p=0.17, n=3 - the number I had quoted); FVL heterozygous z=2.12 (p=0.03); prothrombin heterozygous z=4.25 (p=0.00002, the strongest association in the figure); and MTHFR, antithrombin, protein C, protein S, anticardiolipin and acquired APCR all non-significant. So the heterozygous forms of both genes I curated are significantly associated, and I had quoted the one non-significant subgroup as though it characterized the gene.

    Both genes recurated as relationship_type: SUSCEPTIBILITY with supports: SUPPORT, each carrying the verbatim Figure 9 forest-plot row as evidence (quoted including the PDF extraction artifacts so it matches the cached text exactly). The screening caveat is retained but moved to notes where it belongs: the reviewer correctly distinguished contested clinical utility of screening from contested validity of the association, and only the latter is what DISPUTED means in this schema.

    ITEM 2 - CACHE DETERMINISM FIX WAS HALF DONE. My previous remediation audited only cache/enums/*.csv and missed the label caches. A clean validate would still have written 15 label rows across cache/{go,hgnc,hp,mondo,ncit,uberon}/terms.csv plus MONDO:0004846 in the disease-term enum cache - including GO:0007598, GO:0070493 and UBERON:0000453, the exact three that broke CI originally. Seeded all 16 rows from verified label lookups. Re-audited all 45 ontology CURIEs in the entry against BOTH the label caches and the enum caches; zero rows remain for a clean run to write. CI was green throughout, so this was latent non-determinism rather than a live break, but it would have resurfaced.

    SUGGESTIONS APPLIED:
    - Couvelaire uterus added to histopathology (PMID:35880101), with the clinically important point that a blood-infiltrated myometrium contracts poorly, which is the bridge from placental problem to intractable postpartum hemorrhage and emergency hysterectomy.
    - phase: NOT_APPLICABLE added to NCT05840471 and NCT00186069, matching what the ClinicalTrials.gov API reports for those studies. The two TERMINATED studies genuinely have no phase recorded and are left absent rather than guessed.
    - Fibrinogen band boundary caveat documented in reference_ranges notes. The source states thresholds as strictly greater than 4 and less than or equal to 2, while interpretation_bands use half-open intervals; the two disagree at exactly 4.0 and exactly 2.0. Rather than nudge the bands with fabricated boundary values, the discrepancy is stated explicitly with instruction to follow the source at those exact values.
    - loinc_term deliberately left absent, with the reasoning restated: no LOINC adapter is configured in conf/oak_config.yaml, so a code cannot be verified, and an unverifiable code is worse than none. Noted that adding the adapter would let this be filled in properly.

    Validation: just validate passes. 111/111 snippets verified. Weighted compliance 97.9%. check-snippet-length, check-folded-hyphens and check-term-cache-integrity all pass against current origin/main.

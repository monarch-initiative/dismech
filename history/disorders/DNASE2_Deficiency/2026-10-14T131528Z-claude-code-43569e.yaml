  summary: 'Create: DNASE2 Deficiency'
  details: |
    De novo curation of DNASE2 deficiency (MONDO:0800132, OMIM:619858), an autosomal recessive type I interferonopathy caused by biallelic loss of lysosomal DNase II. Lump/split: single leaf Disease entry (entry_type DISEASE); MONDO term has one causal gene, no disease children, and no existing kb/ entry covers DNASE2. Stub deleted.

    One OpenScientist deep-research report was used (research/DNASE2_Deficiency-deep-research-openscientist.md). The recipe's own term-validation step timed out reaching OLS, so the run exited code 3; both retro-fit validations were re-run in the worktree with just validate-research-reference and just validate-research-terms. Report reference validation: 18/18 resolved, 0 off topic, 0 unverifiable. Term validation: 42/46 resolved (4 unverifiable prefixes), 2 named-as-different (both benign: MONDO:0800132 and UBERON:0002217 paraphrases) and 7 worth-a-second-look (all benign paraphrases of the canonical labels, e.g. Severe anemia for HP:0001903 Anemia). No report-suggested CURIE was bound unchecked; every ontology term was looked up in OLS when written.

    just preflight-dr research/DNASE2_Deficiency-deep-research-openscientist.md MONDO:0800132 returned WARN: DNASE2 is mentioned 43 times and the OMIM identifier matches MONDO (619858); the warning is that TNF is the second most mentioned gene (31). Those TNF passages describe the interferon-independent, TNF-driven arthritis of Dnase2/Ifnar1 double-knockout mice, which is part of this disease's mechanism, not a second disease entity, so no report section was excluded.

    Content curated chiefly from primary literature read directly: PMID:29259162 (Rodero 2017 Nat Commun, three index patients, the defining clinical and mechanistic source), PMID:41472683 (2025 Research Square preprint, c.511+5G>A splice variant, two patients, ruxolitinib response, patient-total context; cited as a preprint because no peer-reviewed version was found), PMID:42491852 (2026 Cureus, antenatal/hydrops presentation, ruxolitinib), PMID:41608114 (IUIS 2024 classification Table 7 row). Mouse mechanism: PMID:11375492 (DNase II required for fetal-liver definitive erythropoiesis), PMID:15568025 (IFN-beta-driven lethal anemia rescued by Ifnar deletion), PMID:17066036 (Dnase2-/-Ifnar1-/- TNF-dependent polyarthritis), PMID:26371324 (cGAS deletion rescues DNaseII-/- autoimmunity; cGAMP accumulation), PMID:23132945 (STING loss rescues both phenotypes), PMID:34901991 (STING-TBK1 interferon-independent arthritis arm), PMID:26114879 (AIM2 drives joint inflammation), PMID:25548216 (endosomal TLR/Unc93b1 drives autoantibodies), PMID:31464028 (Dnase2-/-Ifnar1-/- recapitulates human features).

    Pathophysiology built as a causal chain conforming to two modules: lysosomal_substrate_accumulation (first two nodes only, DNA as stored substrate) and cgas_sting_pathway_activation (sensing and TBK1-IRF3 nodes, the DNASE2-specific lysosomal-nuclease substitution the module notes anticipate). Two parallel inflammatory arms modeled separately: interferon-dependent (JAK-STAT, erythropoiesis suppression, organ inflammation) and interferon-independent STING-TBK1-NF-kB cytokine arm (TNF/IL-6, arthropathy), plus an endosomal-TLR autoantibody arm and an AIM2 joint arm. Phenotypes wired into the graph via bare-name downstream targets. Two animal_models with modeled_mechanisms (Dnase2-/- and Dnase2-/-Ifnar1-/-). Added DNASE2 Deficiency as a member of kb/groupings/Autoinflammatory_Disorder_IEIs.yaml (IUIS Table 7); membership criterion SATISFIED.

    References rejected/not used: PMID:31775019 (Hong et al. JAK inhibition / baricitinib) had no fetchable abstract in the cache (content unavailable), so baricitinib is mentioned in prose only and only ruxolitinib, with verifiable quotes, is curated as a treatment. PMID:32222431 reports a single heterozygous DNASE2 variant, which does not fit the recessive model, so that case is noted but not counted.

    Validation (all pass): just validate (schema OK, term validation passed, 53/53 snippets verified, 54 titles), just validate-disorders (batched, 0 issues), count-verified-snippets 53/53, check-entity-refs OK, check-causal-targets OK (no new dangling), check-duplicate-keys OK, check-enum-values OK, check-block-scalar-comments 0, check-coarse-phenotypes no new, check-snippet-length 0 new (fixed one 2-word IVIG snippet), check-title-snippets OK, check-genereviews NO_CHAPTER (no GeneReviews chapter for DNASE2 deficiency; offline check), normalize-cache and check-term-cache-integrity clean, validate-grouping-batch passed. just check-genereviews --online crashed with a ValueError in src/dismech/bookshelf.py rank() (match kind not in MATCH_KINDS); the offline check ran fine.

  details: |
    Addressed the first automated review on PR 14131. Blocking items: added Proteinuria (HP:0000093) with a sequela edge from membranoproliferative glomerulonephritis, Subcortical White Matter Lesions (HP:0030890) and Learning Difficulties (HP:0001328) from the index report (2 of 3 patients), Failure to Thrive (HP:0001508, index report and the 2025 splice-variant report) and Reduced Growth Hormone Response (HP:0000824), so the description's growth claim is now backed; possible basal ganglia calcification is described but not bound because the source reports it as possible. The white matter lesions have no incoming causal edge because no cited source tests their mechanism. Retargeted the Dnase2/Ifnar1 double-knockout model link from membranoproliferative glomerulonephritis to Hepatic Fibrosis, which the cited quote names; the renal link was dropped because no quotable renal pathology exists for that model. Suggestions taken: Chilblains (HP:0009710) as its own phenotype; transfusion rebound to NCIT:C15192 Blood Transfusion with Thrombocytopenia as a second target; the cord-blood interferon-alpha erythroid progenitor apoptosis result now carries an IN_VITRO evidence item. Declined hemophagocytosis (HP:0012156): the antenatal case report states the patient did not fulfil HLH-2004 criteria and describes no tissue hemophagocytosis. Reverted an incidental regeneration of references_cache/PMID_41871482.md, which no entry in this PR cites. All quotes verified against cached references and all new HP and NCIT terms looked up in OLS; validate, count-verified-snippets (62/62), entity-ref, causal-target, enum, coarse-phenotype, snippet-length, title-snippet and grading checks pass.

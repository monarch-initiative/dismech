  details: |
    Evidence-integrity review of all 45 evidence items against 17 cached references, re-reading each cited publication, plus the 11-entry top-level references block. Two defects fixed, both narrow quote-selection problems: (1) the MEF2D Rearrangement genetic item quoted a subject-less mid-sentence fragment ("distinct gene expression profile, the most common of which is MEF2D-BCL9.") that asserts neither existence nor recurrence of the fusions - replaced with the full exact sentence from the same cache (PMID:27824051) naming the five MEF2D partner genes in 22 B-ALL cases, and rewrote the explanation; (2) the Ph-positive subtype item's explanation claimed the paper identifies BCR-ABL as a recurrent abnormality while quoting a leukocyte-count finding - swapped to the sentence in the same cache that makes that claim (PMID:32902203) and rewrote the explanation. Subtype-identity check across all 18 genetically defined subtypes is clean: every subtype cites its own lesion (BCR::ABL1, KMT2A-r, hypodiploidy, TCF3::PBX1, ETV6::RUNX1, trisomy 4+10, IGH::IL3, iAMP21, DUX4-r, PAX5alt, ZNF384, TCF3::HLF, NUTM1, PAX5 P80R, IKZF1 N159Y, BCL2/MYC) with no cross-subtype quote and no title-as-finding. Left unfixed with reasons: the high-hyperdiploidy item rests on a favorable-trisomy sentence but already hedges to exactly that; three CNS claims quote a framing sentence of an organoid study (true, propositional, correctly graded IN_VITRO; a stronger genotype-linked alternative is enrichment, not repair); the Ph-like description's ICC-split assertion is a citation gap in prose, not a bad snippet; review/consensus sources graded OTHER vs HUMAN_CLINICAL for primary cohorts is internally consistent. Validation: just validate passes; strict snippet audit 128/128 across this and the two sibling files reviewed in the same session.

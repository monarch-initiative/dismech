  summary: Add missing WHO-5/ICC 2022 B-ALL genetic subtypes
  details: |
    Added six missing WHO-5/ICC-2022 genetically defined B-ALL/LBL subtypes: TCF3-HLF t(17;19), MEF2D-rearranged, NUTM1-rearranged, PAX5 P80R, IKZF1 N159Y, and MYC-rearranged BCL2/MYC emerging-provisional. Each carries an NCIT subtype_term binding and a verified PMID evidence snippet [PMID:26214592 TCF3-HLF; PMID:27824051 MEF2D; PMID:30872366 NUTM1; PMID:30643249 PAX5 P80R / IKZF1 N159Y / BCL2-MYC], plus a matching genetic driver entry with HGNC gene_term. Backfilled NCIT subtype_term bindings on six existing subtypes that lacked them [Ph-like, TCF3-PBX1, iAMP21, DUX4-rearranged, ZNF384-rearranged, PAX5-altered] and noted the ICC ABL-class vs JAK-STAT split in the Ph-like description. NCIT was used for the subtype_term bindings because the newer B-ALL subtype MONDO terms are not in the materialized DiseaseOrSubtypeTerm enum cache and fail the live per-value reachability check in linkml-term-validator progressive mode. Root cause (verified by instrumenting the plugin, not the runoak CLI): OLS traversal works, but EBI OLS4's ancestor closure for these newer MONDO terms reaches MONDO:0700096 human disease and MONDO:0005070 neoplasm yet does NOT include the enum source node MONDO:0000001 disease, so the term is judged not-reachable. The local sqlite:obo:mondo build DOES include MONDO:0000001 in the closure; this is an OLS-vs-local graph difference at the disease root, not an adapter or NotImplementedError limitation. NCIT terms pass because OLS returns their source roots (NCIT:C2991/C4741/C7062) in the closure. Durable fix (not applied here): point the MONDO adapter at sqlite:obo:mondo in conf/oak_config.yaml, or add MONDO:0700096 as an additional enum source_node. Validated: just validate schema+terms pass, just validate-references pass, snippet substring checks 9/9 pass, pytest test_data.py subtype/schema selection 1620 passed.

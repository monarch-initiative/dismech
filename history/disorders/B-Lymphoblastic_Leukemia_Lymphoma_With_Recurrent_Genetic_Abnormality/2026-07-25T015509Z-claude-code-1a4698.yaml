  summary: Add missing WHO-5/ICC 2022 B-ALL genetic subtypes
  details: |
    Added six missing WHO-5/ICC-2022 genetically defined B-ALL/LBL subtypes: TCF3-HLF t(17;19), MEF2D-rearranged, NUTM1-rearranged, PAX5 P80R, IKZF1 N159Y, and MYC-rearranged BCL2/MYC emerging-provisional. Each carries an NCIT subtype_term binding and a verified PMID evidence snippet [PMID:26214592 TCF3-HLF; PMID:27824051 MEF2D; PMID:30872366 NUTM1; PMID:30643249 PAX5 P80R / IKZF1 N159Y / BCL2-MYC], plus a matching genetic driver entry with HGNC gene_term. Backfilled NCIT subtype_term bindings on six existing subtypes that lacked them [Ph-like, TCF3-PBX1, iAMP21, DUX4-rearranged, ZNF384-rearranged, PAX5-altered] and noted the ICC ABL-class vs JAK-STAT split in the Ph-like description. NCIT was used for the subtype_term bindings because the newer B-ALL subtype MONDO terms are not present in the materialized DiseaseOrSubtypeTerm enum cache, and on a cache miss the MONDO ols:mondo adapter cannot perform the live reachable_from check (oaklib OLS backend raises NotImplementedError for ancestor queries), so those terms are rejected; the terms are in fact correctly placed subclasses of MONDO:0000001. NCIT resolves via a local sqlite adapter that supports the reachability query, so cache-missed NCIT terms validate live. Validated: just validate schema+terms pass, just validate-references pass, snippet substring checks 9/9 pass, pytest test_data.py subtype/schema selection 1620 passed.

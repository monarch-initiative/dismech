  summary: 'Review round 1: add diagnosis section and minor phenotypes'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 15076. Added a diagnosis section with four rows: exome sequencing (NCIT:C101295 Whole Exome Sequencing), multi-gene panel sequencing (NCIT:C198412), chromosomal microarray for 22q13.1 deletions (NCIT:C18477 Microarray Analysis), and a minigene splicing assay for synonymous or splice-region variants, left without a diagnosis_term because OLS searches of NCIT for minigene, RNA splicing assay and splicing returned no assay or procedure term. NCIT labels were read from OLS and cache/ncit/terms.csv. Added single-patient phenotypes from PMID:38404251: decreased body weight (HP:0004325), strabismus (HP:0000486) and amblyopia (HP:0000646). Bound GO:0060090 molecular adaptor activity (modifier DECREASED) on the Reduced miRISC Scaffold Function node, so TNRC6B lands on a molecular function; this fixes the CI gate check_gene_activity_grounding, which flagged TNRC6B on the first push. GO:0030674 protein-macromolecule adaptor activity was considered; the broader parent was chosen because the OLS definitions lookup for GO:0030674 returned only a usage note pointing scaffolds to GO:0140378, whereas GO:0060090 is defined as bringing together two or more molecules so they function in a coordinated way, which matches TNRC6B docking Argonaute and the deadenylase complexes. Set frequency FREQUENT on joint hypermobility (8/17 in the founding series) and removed the duplicated mitral valve prolapse clause from the aortic root aneurysm description. No supportive therapy rows were added because no TNRC6B-specific source supports a therapy row: the only management statement found (feeding guidance and rehabilitation training, PMID:41147347) concerns a patient who also carries an MECP2 deletion, and PMID:38404251 recommends growth and metabolic monitoring rather than a treatment.

  summary: 'Create: TNRC6B-Related_Neurodevelopmental_Disorder'
  details: |
    New Disease entry for MONDO:0030995 (global developmental delay with speech and behavioral abnormalities, OMIM 619243), named by its causal gene TNRC6B (hgnc:29190) following the kb/disorders convention for gene-defined neurodevelopmental disorders; the MONDO label is the disease_term and a synonym. Scope decision: a single Disease entry. MONDO records no descendants and one causal gene, and all reported patients share one mechanism (heterozygous TNRC6B loss of function), so no grouping or subtype split applies. The stub stubs/Global_Developmental_Delay_With_Speech_And_Behavioral_Abnormalities.yaml is deleted. Deep research: exactly one openscientist report (research/TNRC6B-Related_Neurodevelopmental_Disorder-deep-research-openscientist.md). Its reference validation resolved 19/19 identifiers with one off-topic flag (PMID:34847178, MOV10-FMRP-AGO2 and Dicer1; not used). The term-validation mislabel list is a table-parsing artifact (labels read from the 'Course' column). just preflight-dr returned PASS (TNRC6B mentioned 75 times, OMIM 619243 matches MONDO). The report gives the gene as HGNC:28368, which HGNC resolves to METTL22; the entry binds hgnc:29190. The report's uncited pLI claim was not carried over. Report leads that were used after reading the cached abstracts: PMID:28811219 (Tnrc6 knockout mice), PMID:17167072, PMID:29576456, PMID:32661162, PMID:19470757, PMID:25228304 (TCF20/TNRC6B resequencing, used as a REFUTE item on autistic behavior). Other references came from PubMed searches: the founding 17-patient series (PMID:32152250), two later case reports (PMID:38404251, PMID:39115759), a three-generation 22q13.1 deletion family (PMID:42074582), the childhood apraxia of speech and developmental language disorder cohorts (PMID:29463886, PMID:38300321), and miRISC mechanism papers (PMID:16289642, PMID:19383768, PMID:21981923, PMID:19838187, PMID:34108231). PMID:37348364 (epilepsy and ASD case) has no quotable text in the cache and is not cited; PMID:41147347 (TNRC6B plus MECP2 deletion) was not used for phenotypes because of the second diagnosis. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). ClinGen classifies TNRC6B as Definitive only for the broader complex neurodevelopmental disorder (MONDO:0100038), so no gene_disease_validity assertion was recorded. No module was a good conformance target. Validated with just validate, validate-terms, count-verified-snippets, the offline gates, compliance-connectivity and validate-disorders.

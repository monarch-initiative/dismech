  summary: 'Strengthen: Loeys-Dietz_Syndrome_1'
  details: |
    Fetched the two primary sources behind the reported sex-dependent aortic risk in TGFBR1 carriers: Tran-Fadulu et al. 2009 family study (PMID:19542084, abstract) and the Montalcino Aortic Consortium international registry of 441 TGFBR1/TGFBR2 carriers (Jondeau et al. 2016, PMID:27879313, full text). Both report more aortic events/dissections and earlier death in male than female TGFBR1 carriers, with no sex effect in TGFBR2. The lds1_sex_specific_aortic_risk KNOWLEDGE_GAP was therefore set RESOLVED with a resolution_note and primary evidence, and its proposed registry analysis removed because the registry performed it. Sex-specific registry figures were added to the Aortic and Arterial Dissection node and the Aortic Dissection phenotype (with Table 1 TGFBR1 type A/type B counts), and a new progression phase records registry survival (80% at 60 years; median age at death 28.4 years). A pooled-gene Mayo series (PMID:40482834) was added as INDIRECT support. The multiple self-healing squamous epithelioma differential now binds MONDO:0007566, verified via OLS. The entry notes record that a PubMed prevalence search found no LDS1-specific population estimate. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), validate-disorders and the offline gate set.

  details: |
    Addressed the PR 14339 review suggestion. The 'Aortic and Arterial Dissection' node description attributed dissections at 3.9-4.0 cm to LDS1, but the cited source (PMID:24577266) pools LDS types 1-3 ('dissections have occurred in individuals with LDS 1, 2, or 3'), and the same description reports that no TGFBR1 carrier in the Montalcino registry (PMID:27879313) dissected at or below 45 mm. The description now states the figure is pooled across LDS1-3 and not specific to TGFBR1. Evidence items unchanged. Validated with just validate-disorders.

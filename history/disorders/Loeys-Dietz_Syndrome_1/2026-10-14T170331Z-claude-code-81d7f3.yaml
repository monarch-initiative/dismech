  summary: 'Create: Loeys-Dietz_Syndrome_1'
  details: |
    New standalone entry for TGFBR1-related Loeys-Dietz syndrome 1 (MONDO:0012212), previously curated only as the Type 1 has_subtypes row of the Loeys-Dietz Syndrome umbrella entry (the umbrella was not edited). Modelled on the LDS4/LDS6 sibling entries: pathophysiology chain from a heterozygous TGFBR1 kinase-domain variant (inactivating with a modest dominant-negative effect, PMID:22414221) through lineage-dependent impaired cell-autonomous signalling and the paradoxical aortic-wall pSMAD2 increase (Tgfbr1 M318R mouse, PMID:24355923, PMID:30614814) to medial degeneration, aortic/arterial dilation and dissection, plus developmental (craniofacial, skeletal, congenital heart) and immune branches; 25 phenotypes, all causally connected. TGFBR1-specific evidence includes genotype-split comparisons with TGFBR2 (surgical histopathology and type B dissection, PMID:33408307; paediatric aortic dimensions, PMID:38774681; enamel defects, PMID:32152251; extra-aortic aneurysm counts, PMID:40533122) and the TGFBR1-specific surgical thresholds of the 2022 ACC/AHA guideline (PMID:36322642). The reported male-biased aortic risk in TGFBR1 families is recorded as an open KNOWLEDGE_GAP because the primary study is not cached. The ClinGen Definitive TGFBR1 assertion is for the umbrella MONDO:0018954, so it is cited as evidence but no gene_disease_validity tier was copied. Literature was limited to the existing reference cache because PubMed was unreachable; pooled TGFBR1/TGFBR2 evidence is marked directness INDIRECT. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified offline), check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

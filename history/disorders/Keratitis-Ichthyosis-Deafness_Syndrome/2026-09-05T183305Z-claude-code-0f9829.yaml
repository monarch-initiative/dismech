  summary: 'Create: Keratitis-Ichthyosis-Deafness Syndrome'
  details: |
    De novo curation of autosomal dominant KID syndrome (MONDO:0007850, GJB2/connexin 26; rare GJB6). Built an 11-node causal chain from the heterozygous gain-of-function missense variant through hyperactive Cx26 hemichannels (loss of extracellular-Ca2+ restraint; direct Ca2+ permeability for G45E) and the heteromeric Cx43/Cx30 route, into three organ arms: keratinocyte Ca2+ overload/ATP release to epidermal barrier failure, infection and SCC; corneal epithelial gap-junction dysfunction to vascularizing keratitis and limbal stem cell deficiency; and cochlear supporting-cell hemichannel hyperactivity to hair cell dysfunction (conforms_to sensorineural_hair_cell_loss). 16 phenotypes, 2 genes, 2 subtypes (lethal neonatal G45E/A88V; HID), 6 treatments, 2 mouse models, 1 patient keratinocyte line, 2 mechanistic hypotheses and 2 discussions (HUMAN_MODEL_MISMATCH on the cochlear arm; CONTROVERSY on homomeric vs heteromeric hemichannel). 37 references, 82/82 evidence snippets verified against cached references. Perplexity sonar-deep-research was the lead source; its citations validated 11/11 but term_validation.needs_review was true with 18 mislabelled CURIEs, 3 nonexistent HP terms (HP:0007393, HP:0001021, HP:0002727) and 1 obsolete UBERON term, so every ontology term was re-selected independently with OAK via the ols adapter and none of the report's CURIEs were copied. preflight-dr returned WARN because the report discusses AP1B1 (56 mentions) more than GJB2 (40); the AP1B1 (KIDAR) and VPS33B (ARKID) recessive material was excluded as separate diseases and recorded in notes and differential_diagnoses. Report content not used: the AP1B1/VPS33B sections (wrong disease), PMID:35144013 and PMID:41453769 (both AP1B1 KIDAR), PMID:37555193 (no abstract cached), and PMID:36444857/DOI:10.1111/pde.15201 (one-sentence abstract with no quotable finding). Validation run: just validate (schema, terms, references) passed; count-verified-snippets 82/82; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms (plus the online variant), check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles all passed; compliance 88.1 percent; validate-disorders run as the final gate.

  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Evidence-integrity review of all 52 evidence items against 21 unique cached references (5 PMIDs, 13 DOIs, 3 ClinicalTrials.gov records), re-reading each cited publication in references_cache/. All 28 DOI/clinicaltrials snippets that the repo validator skips by prefix were manually substring-verified against their caches; all exact. Two defects found and fixed: (1) a snippet-grading divergence in which the FL/MZL indolent-neoplasm quote (DOI:10.1007/s00428-022-03432-2) was graded HUMAN_CLINICAL at differential_diagnoses but OTHER in the references stub - aligned both to HUMAN_CLINICAL; (2) the tisagenlecleucel treatment item quoted a definitional sentence while its explanation claimed efficacy - replaced with the ELARA trial's conclusion sentence stating safety and efficacy in extensively pretreated relapsed/refractory FL. Confirmed sound: MODEL_ORGANISM grading of the mouse-model sentence; transformed-FL survival explanations matching the cached abstract (RS 54 percent vs 67 percent); FLIPI, watch-and-wait and B-symptom claims; all three CAR-T/bispecific trial items. Left unfixed with reasons recorded: unevidenced Fatigue/LDH and three unevidenced treatments (coverage gaps, not misuse), a cosmetic snippet truncation, one HP term-fit question (a terms issue, not evidence), and title-statement deep-research stubs carrying no evidence claims. Validation: just validate, count-verified-snippets --strict, and the offline snippet gates all pass; no baselines touched.

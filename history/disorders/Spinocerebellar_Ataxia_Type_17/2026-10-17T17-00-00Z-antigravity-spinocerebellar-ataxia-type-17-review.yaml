  summary: 'Upgraded Spinocerebellar Ataxia Type 17 curation for issue #3584: added classifications, removed
    deprecated prevalence percentage field, annotated GO molecular functions on TBP transcriptional dysregulation,
    connected terminal cerebellar and striatal degeneration nodes to clinical phenotypes, and added differential
    diagnoses and reference findings.'
  details: Added classifications (nervous system disorder, Mendelian disease, and proteotoxic disease),
    removed deprecated percentage field from prevalence, and annotated GO:0000981 and GO:0000978 on Polyglutamine-expanded
    TBP disrupts transcriptional programs. Wired Cerebellar Purkinje cell degeneration to Progressive
    gait ataxia and Dysarthria, and Striatal and caudate degeneration to Chorea, Dystonia, Parkinsonism,
    Cognitive impairment, and Dementia. Added differential diagnoses (Huntington disease MONDO:0007739,
    HDL2 MONDO:0011671, DRPLA MONDO:0007435, SCA1 MONDO:0008119, and SCA2 MONDO:0008458) and structured
    reference findings for PMID:29427105 and PMID:30532692.

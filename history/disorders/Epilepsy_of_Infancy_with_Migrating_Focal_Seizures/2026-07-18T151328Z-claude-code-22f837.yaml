  summary: 'Create: Epilepsy of Infancy with Migrating Focal Seizures'
  details: |
    De-novo curation of EIMFS (MONDO:0100025), a KCNT1 developmental and epileptic encephalopathy and pediatric-epilepsy gap entry. Granular unbundled pathophysiology: KCNT1 gain-of-function -> increased Slack (KNa) potassium current -> disrupted neuronal firing / interneuron dysfunction -> multifocal cortical hyperexcitability (conforms epilepsy module) -> migrating focal seizures (conforms) -> severe DEE. Evidence: Barcia 2012 (PMID:23086397, de novo GOF KCNT1, constitutive activation, 6/12 cohort) and a KCNT1 systematic review (PMID:39093319, quinidine 44.6%, ketogenic diet 62.5%, conventional ASM rarely beneficial). Treatments include quinidine (precision, target_mechanisms->Slack current), ketogenic diet, AEDs. Three discussions: GOF-hyperexcitability paradox (KNOWLEDGE_GAP), quinidine variable response (HUMAN_MODEL_MISMATCH), KCNT1 genotype-phenotype (KNOWLEDGE_GAP). claude_code deep research used as leads; NEC clean (KCNT1/MMPSI/MONDO:0100025). All snippets verified exact; schema + term validation pass.

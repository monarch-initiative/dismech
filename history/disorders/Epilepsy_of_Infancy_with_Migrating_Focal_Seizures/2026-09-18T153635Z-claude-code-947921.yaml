    Weekly compliance pass. Weighted compliance 64.2% -> 88.8%. Added exact-quote evidence to all 13 previously bare pathophysiology downstream edges, to the two pathophysiology nodes that had none (Disrupted Neuronal Firing and Interneuron Dysfunction; Multifocal Cortical Hyperexcitability), to four phenotypes (Migrating Focal Seizures, Refractory Status Epilepticus, Epileptic Encephalopathy, Severe Developmental Delay), to the worldwide prevalence record, and to the quinidine target_mechanisms link. Introduced two references not previously cited in the entry: PMID:35346832 (Kcnt1 knock-in mouse, parvalbumin interneuron excitability) for the interneuron-disinhibition mechanism, and PMID:24591078 (quinidine reverses KCNT1 gain of function in Xenopus oocytes) for the quinidine target engagement claim. Validated with just validate (38/38 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-snippet-grading, check-title-snippets, check-snippet-length.

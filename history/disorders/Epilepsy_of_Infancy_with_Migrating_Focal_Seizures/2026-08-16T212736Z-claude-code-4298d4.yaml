  summary: Fix EIMFS node-name collision and wire pathograph to phenotypes
  details: |
    Weekly compliance pass focused on pathograph connectivity.

    Two problems found.

    (1) Node-name collision. A pathophysiology node and a phenotype node were both named
    "Migrating Focal Seizures". build_causal_graph keys nodes by name, so the two collapsed
    into one node typed "phenotype": the pathophysiology node silently disappeared from the
    rendered pathograph, and its outgoing edge to Severe Developmental and Epileptic
    Encephalopathy was emitted from the phenotype instead. This also made the file's
    connectivity read 1/8 rather than 0/8 - the one "connected" phenotype was the absorbed
    mechanism node, not a genuinely wired manifestation.

    Fixed by renaming the pathophysiology node to "Migrating Focal Seizure Generation"
    (matching the naming style already used elsewhere in the KB for discharge-generation
    nodes) and updating the two internal references: the upstream downstream target on
    Multifocal Cortical Hyperexcitability, and the readout target in the
    eimfs-quinidine-variable-response discussion. The phenotype keeps its original name and
    HP:0032786 binding.

    (2) No causal edge reached any phenotype. Added downstream CausalEdges -
      - Migrating Focal Seizure Generation -> Migrating Focal Seizures, Refractory Status
        Epilepticus, Autonomic Manifestations (Apnea, Cyanosis)
      - Severe Developmental and Epileptic Encephalopathy -> Epileptic Encephalopathy,
        Severe Developmental Delay, Developmental Regression, Acquired Microcephaly,
        Axial Hypotonia

    Acquired microcephaly and axial hypotonia use INDIRECT_UNKNOWN_INTERMEDIATES; the cited
    GeneReviews source lists them as neurologic features without specifying a mechanism, so
    the edge descriptions record that the intermediates are unresolved.

    No new ontology terms, evidence items, or PMIDs.

    Validation: just validate passed (schema + terms + references; "Snippets checked: 12/12
    verified against cached references"). just validate-graphs reports no dangling targets
    for this file after the rename. Phenotype connectivity 8/8; gene-to-mechanism wiring was
    already 1/1 (KCNT1) and was not touched.

  summary: 'Create: Intellectual Developmental Disorder, X-Linked, Syndromic 37 (ZFX
    / MRXS37)'
  details: |
    De novo creation of the MRXS37 / ZFX-related neurodevelopmental disorder entry (MONDO:0958322, OMIM:301118, gene ZFX = hgnc:12869).

    DEEP RESEARCH PROVIDERS. The default provider, falcon (Edison Scientific), FAILED: the API returned HTTP 402 Payment Required and produced no report, so there is no research/*-falcon.md artifact for this entry. Fallbacks were used instead: claude_code (completed, 254s, 13 web searches, report committed) and openscientist, both of which completed. The claude_code report's own reference-validation section reported 9/9 citations resolved, 0 unresolved, 0 off topic. NEC preflight against MONDO:0958322 returned PASS (ZFX mentioned 53 times; next-ranked gene HNRNPH2 at 3; report OMIM set includes the MONDO xref 301118).

    DEEP-RESEARCH ERROR CAUGHT AND NOT PROPAGATED. The claude_code report asserted HGNC:12874 for ZFX. That identifier is ZIC3, verified with runoak against sqlite:obo:hgnc. ZFX is hgnc:12869, which matches the RO:0004003 causal-gene relationship recorded on MONDO:0958322. The report's identifier was discarded. This is the standard DR hallucination category 3, an invented or mis-assigned ontology identifier, and it is recorded here because it would have been invisible to snippet validation. Three further PMIDs the report cited but did not verify were independently checked and all resolved correctly to on-topic papers: PMID:2500252 and PMID:1970799 for human ZFX escaping X inactivation, and PMID:2052543 for mouse Zfx being subject to X inactivation. Two sources the report named without a PMID were located and cited properly: the PLoS One 2025 germline-ZFX/PHPT series is PMID:40779536 and the Cell 2007 Zfx self-renewal paper is PMID:17448993.

    GENEREVIEWS. Searched PubMed for a GeneReviews chapter for ZFX/MRXS37; none exists, with an empty result set for both the all-fields and title-field searches. This is expected for a 2024-described entity, so no GeneReviews baseline was available.

    WHAT WAS CURATED. Nine pathophysiology nodes forming a two-arm causal graph: two allele-class trigger nodes, truncating versus zinc-finger missense, plus the constitutive escape-from-X-inactivation node, converging on impaired ZFX-dependent transcriptional activation at CpG island promoters, then increased Pol II promoter-proximal pausing, then impaired stem and progenitor self-renewal, then the organism-level neurodevelopmental and craniofacial node; the missense node additionally routes to a separate parathyroid chief-cell proliferation node. Thirty-four phenotypes with HPO bindings across neurologic, behavioural, craniofacial, ophthalmologic, auditory, cardiovascular, neuroimaging, gastrointestinal, dermatologic, musculoskeletal, endocrine and neoplastic categories. Genetic, inheritance using the neutral HP:0001417 X-linked inheritance term rather than asserting dominant or recessive because ZFX escapes X inactivation, diagnosis, four treatments including a parathyroidectomy entry with target_mechanisms into the endocrine node, one zebrafish and one mouse animal model plus two experimental_models, differential diagnoses, two mechanistic_hypotheses, and three discussions.

    DELIBERATE OMISSIONS. Frequency bands were omitted for all phenotypes except the facial gestalt, the only one with a frequency-bearing statement in a primary source, quoted as in all subjects and mapped to VERY_FREQUENT. No prevalence block, because no published estimate exists. No datasets block: no MRXS37-specific omics dataset exists, and attaching a ZFX cancer-cell-line ChIP-seq series would be gene-level rather than disease-level relevance, the Named Entity Confusion risk the dataset SOP warns about. The gnomAD pLI value and the exact de-novo fraction of the founding cohort circulate in secondary summaries but no quotable primary source was found, so both were left out and the omission is recorded in the entry notes.

    DISCUSSIONS. One HUMAN_MODEL_MISMATCH: mouse Zfx is subject to X inactivation while human ZFX escapes it, so a heterozygous Zfx mouse is a cellular mosaic and does not model a heterozygous ZFX human, a species difference in exactly the variable the female-dosage mechanism turns on. Two KNOWLEDGE_GAPs: first, the neural-progenitor route is an extrapolation, since every direct ZFX self-renewal measurement is in embryonic or haematopoietic stem cells and none in neural progenitors; second, the missense-only association with hyperparathyroidism may reflect small numbers and age-dependent ascertainment rather than biology, and the founding paper explicitly declines to say whether the DNA-binding-domain missense alleles gain or lose activity.

    VALIDATION. just validate passes, with schema reporting no issues and term validation passing. just validate-disorders, the batched no-full-text sweep that CI runs, passes and reports Snippets checked: 117/117 verified against cached references. just check-duplicate-keys is OK. just check-title-snippets reports no new title-quoting snippets. Weighted compliance is 93.1 percent with term and reference_title both at 100 percent; the residual is the absent datasets block and evidence on proposed_experiments, both explained above. All ontology terms were verified against OAK before use; two initially chosen HPO IDs were wrong and were corrected before curation, since HP:0008207 is Primary adrenal insufficiency rather than hyperparathyroidism, corrected to HP:0000843, and HP:0200023 is Priapism rather than long palpebral fissure, corrected to HP:0000637.

    PRE-PR SELF-REVIEW (red team). Before opening the PR the entry was reviewed against .claude/skills/dismech-pr-review by an independent agent with fresh context. It re-verified all snippets, all 54 ontology term labels, all cross-references, and the NEC preflight, and found the evidence-integrity layer clean: no fabrication, no wrong PMIDs, no mismatched labels. It found real defects at the claim-strength layer, all fixed before commit. Item 1, critical and correct: the description asserted that hyperparathyroidism had been reported with a missense allele in every reported instance so far. That is falsified by PMID:40779536, which this entry cites five times, because of its three germline-ZFX PHPT patients the third carries an in-frame insertion p.(Gly151_Val153dup), and one of the two missense carriers is p.(Arg536Cys), outside the C-terminal zinc fingers. The universal claim was removed and replaced with what the sources support, and the same overstatement was softened in the missense pathophysiology node, in the Hyperparathyroidism phenotype, and in an evidence explanation that had rendered found in four families with missense variants as restricted to missense families. Item 2: four evidence items were downgraded from SUPPORT to PARTIAL where the snippet did not carry the specific claim, namely a ZFX plus ZNF711 DOUBLE-knockout result cited for a ZFX-alone claim, a clinical hyperparathyroidism statement cited for a chief-cell-proliferation node, a suggested-to-be-implicated Turner-syndrome hypothesis, and a proliferation readout cited on a transcription node. Item 3: two snippets quoted a paper's methods or rationale sentence rather than its result, the same substantively-empty failure family as a title snippet, and one of them was the sole evidence for the CANONICAL hypothesis; both were swapped for the corresponding result sentence from the same paper. Item 4: the self-renewal node was annotated with cell type neural stem cell CL:0000047 while the entry's own knowledge gap states that no neural-progenitor data exist, so it was replaced with the cell types actually assayed, embryonic stem cell CL:0002322 and hematopoietic stem cell CL:0000037, ensuring the pathograph does not assert what the prose denies. Item 5: the two mechanistic_hypotheses were declared but orphaned, with no edge carrying hypothesis_groups, so they partitioned nothing; the truncating and missense arms now opt into haploinsufficiency_model and altered_dna_binding_specificity_model respectively. Item 6: the terminal node bundled neurodevelopment with craniofacial patterning and congenital anomalies, and was split into Disrupted Neurodevelopment and Disrupted Craniofacial Patterning and Congenital Anomaly Formation per the single-claim discipline. Item 7: the word genitourinary appeared in prose with no evidence anywhere in the file and no corresponding phenotype, and was removed rather than curated because no quotable primary source was found. Item 8: external eye abnormalities are part of the gestalt reported in all eighteen founding-cohort subjects but had no phenotype entry, so one was added with HP:0000478 and VERY_FREQUENT, and the over-broad Ophthalmological abnormalities entry, whose term was the narrow HP:0000602, was renamed Ophthalmoplegia to match its term and evidence. Item 9, minor fixes: PMID:39940742 added to the top-level references block; two unused DOI reference-cache files that no YAML slot cites removed from the changeset; redundant GO:0006357 dropped in favour of its child GO:0045944; GO:0004402 histone acetyltransferase activity removed from molecular_functions because ZFX recruits acetylation complexes rather than possessing that activity; and the escape-from-X-inactivation edge relabelled in prose as modulating rather than causal, with causal_link_type deliberately left unset because the schema enum encodes only directness and has no modulation value. Item 10: the pathograph reached no phenotype, since both terminal nodes had no outgoing edges and the endocrine phenotypes were disconnected from the arm that explains them; fourteen pathophysiology-to-phenotype edges were added, each with its own evidence, and the graph now has no terminal pathophysiology node. Snippet count rose from 98 to 117 across the review round, all verified.

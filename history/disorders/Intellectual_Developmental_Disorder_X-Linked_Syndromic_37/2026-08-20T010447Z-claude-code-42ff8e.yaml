  summary: 'Fix CI snippet-length gate and apply reviewer suggestions (PR #9014)'
  details: |
    Response to CI failure and reviewer feedback on PR #9014. The CREATE record for this entry is the sibling file dated 2026-08-19T092433Z; this record is append-only follow-up, not a revision of it.

    CI FAILURE FIXED. The test (3.13) job failed on scripts/check_snippet_length.py with four new evidence snippets under the five-word floor: two occurrences of "smooth and/or long philtrum" on the Long philtrum and Smooth philtrum phenotypes, and two of "inguinal and umbilical herniation" on the Inguinal hernia and Umbilical hernia phenotypes. This gate is a CI ratchet that was not run locally during the original curation, which is why the defect reached CI rather than being caught pre-commit. Both were fixed the way the gate intends, by quoting the full source sentence rather than the bare clause: the philtrum entries now quote the founding cohort's complete facial-gestalt sentence from PMID:38325380, and the hernia entries quote the complete phenotype-list sentence from PMID:41077274. Both replacement sentences were already used elsewhere in the entry and were already snippet-verified. Each affected explanation was rewritten to name which clause within the longer sentence carries the claim, so the evidence does not merely pass the length gate but still points at the right words. Snippet count is unchanged at 117/117 verified.

    REVIEWER SUGGESTIONS. The ai4c-reviewer bot approved with no critical and no important issues, and four optional suggestions. Two were adopted, one was checked and correctly declined, one needed no action.

    Adopted, suggestion 1: the Parathyroidectomy treatment used the generic NCIT:C15329 Surgical Procedure and now uses the specific NCIT:C51593 Parathyroidectomy, per the prefer-the-most-specific-term rule. Verified with OAK before use; no cache row was needed because the term was already present.

    Adopted, suggestion 4: the Neoplastic phenotype was named Tumor predisposition while its term is HP:0002664 Neoplasm and its evidence is correctly PARTIAL, since the founding cohort reports enrichment of tumour types with no denominator, comparison population or risk estimate. Predisposition asserts a quantified risk the source does not give, so the phenotype was renamed Neoplasm and the description now states why the narrower name was chosen.

    Declined with evidence, suggestion 2: the reviewer suggested a monitoring-flavoured NCIT term for Cardiac and Endocrine Surveillance in place of NCIT:C15747 Supportive Care. The candidate NCIT:C15719 Surveillance was checked with runoak ancestors and is NOT reachable from NCIT:C25218 Clinical Intervention or Procedure, so it is not a valid value of the TreatmentTerm dynamic enum and would fail term validation. No other suitable clinical-action term was found. Left as is, which is the no-term-beats-a-bad-one outcome the reviewer themselves allowed for.

    No action, suggestion 3: two treatments carry no evidence items. Both are generic standard-of-care statements with no disease-specific citable claim, and the reviewer agreed manufacturing a quote would be worse.

    VALIDATION AFTER THE CHANGES. just validate-disorders passes with 117/117 snippets verified. The four CI ratchet gates that were missed the first time were all run locally this round and pass: check_snippet_length, check_title_snippets, check_folded_hyphens and check_environmental_evidence, each against origin/main. check_duplicate_yaml_keys OK over 2389 files, term_cache_integrity OK over 18 term and 24 enum caches, check-cache-order OK. Graph integrity re-checked programmatically: no dangling downstream or target_mechanisms references. Note that a local uvx ruff check reports fifteen pre-existing E402 errors in repository scripts this branch does not touch; CI's own ruff step passed on this PR, and those were deliberately left alone rather than widening the PR.

  summary: 'Connect orphaned craniofacial node to the pathograph (PR #9014 review)'
  details: |
    Response to the CHANGES_REQUESTED review on PR #9014. Append-only follow-up to the CREATE record dated 2026-08-19T092433Z and the EDIT record dated 2026-08-20T010447Z.

    THE DEFECT, AND WHERE IT CAME FROM. The reviewer found that the pathophysiology node "Disrupted Craniofacial Patterning and Congenital Anomaly Formation" had in-degree zero, splitting the pathograph into two disconnected components and leaving the recurrent facial gestalt, the disorder's clinical hallmark and the subject of the founding paper's own title, unreachable from either ZFX variant trigger node. This was verified independently before fixing: an in-degree computation over all nine pathophysiology nodes confirmed the craniofacial node at zero, and a reachability walk from the two variant triggers confirmed it unreachable.

    The defect was introduced by this curation, not inherited. In the pre-PR red-team round the original terminal node bundled neurodevelopment with craniofacial patterning and congenital anomalies, and was split into two nodes per the single-claim discipline. The incoming edge was re-pointed to the neurodevelopmental half and no edge was ever created for the craniofacial half. The graph check run at the time tested only OUT-degree, looking for terminal nodes with no outgoing edges, and so reported the graph closed while an orphaned root sat in it. Testing out-degree alone cannot detect an unreachable node; both directions are needed.

    WHY THE REVIEWER IS RIGHT THAT OMISSION WAS THE WORSE OPTION. The craniofacial node's own description had justified having no incoming edge on the grounds that no craniofacial developmental programme has been examined in ZFX deficiency. That is true but it is an argument about the MECHANISM, not about the ASSOCIATION. That ZFX variants produce this gestalt is not an inference at all, it is the disease definition, and the entry already quotes and snippet-verifies the founding paper's sentence saying so. The route to the neurodevelopmental phenotype is equally unexamined and that edge was nonetheless drawn, as INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence plus a KNOWLEDGE_GAP discussion. Drawing no edge was therefore the less accurate choice, not the more cautious one, and it contradicted the adjacent node's own prose, which states that both nodes follow from the same upstream transcriptional defect.

    THE FIX. One downstream edge added from "Impaired ZFX-Dependent Transcriptional Activation at CpG Island Promoters" to the craniofacial node, with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES and hypothesis_groups haploinsufficiency_model, evidenced by the founding paper's genotype-to-gestalt sentence marked supports PARTIAL, with an explanation stating that it evidences THAT ZFX variants produce the gestalt and not the developmental route to it. The transcriptional node was chosen as the parent rather than the self-renewal node, which the PR body had described: parenting on self-renewal would assert that a progenitor deficit is the route, and no craniofacial progenitor data exist to support that stronger claim. The reviewer independently reached the same conclusion about parent choice.

    Also added, mirroring the existing zfx_neural_progenitor_gap: a KNOWLEDGE_GAP discussion zfx_craniofacial_route_gap attached to the craniofacial node, recording that cranial neural crest specification and migration, pharyngeal-arch patterning, and every other craniofacial developmental programme are unexamined in ZFX deficiency in any model system, with two proposed experiments. The node description was rewritten so it no longer presents the missing edge as a deliberate choice, and instead states that the unexamined route is a reason to draw the edge as indirect rather than a reason to omit it.

    VERIFICATION AFTER THE FIX. In-degree recomputed: the craniofacial node is now 1 and is reachable from both variant triggers. The only remaining root among the non-trigger nodes is "Escape of ZFX from X Inactivation", which is correct, since it is a constitutive property of the locus rather than something a variant causes. No dangling downstream, target_mechanisms or modeled_mechanisms references. All declared hypothesis groups are used by at least one edge and every used group is declared. All four discussion ids are unique.

    just validate-disorders passes with 118/118 snippets verified, up one from the added edge. All four CI ratchet gates pass against origin/main: snippet-length, title-snippet, folded-hyphen and environmental-evidence. Duplicate-keys OK over 2389 files, term-cache-integrity OK, cache-order OK. Weighted compliance 91.5 percent; the small drop from 93.1 is the new discussion's proposed_experiments carrying no evidence, which is expected for proposals.

    A NOTE ON PROCESS. A local run of just test-schema during the previous round regenerated src/dismech/datamodel/dismech.py and dismech_pydantic.py. Those are generated artifacts whose committed versions were stale relative to schema changes made by other contributors on main, and this branch touches no schema file, so they were discarded rather than committed. Regenerating them is separate maintenance and does not belong in a curation PR.

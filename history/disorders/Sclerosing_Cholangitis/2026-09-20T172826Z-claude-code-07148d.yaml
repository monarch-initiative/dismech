  summary: 'Review round 2: drop unsourced attributions and a contradicted zygosity'
  details: |
    Round 2 of review on PR #12339 (dismech#12205). Two blocking findings, plus
    three defects I found while checking them.

    Blocking, from the review:
    - The "French cohort"/"French series" attribution for PMID:27319779 was removed
      from all three places it appeared. That reference's cached record is
      abstract-only and carries no affiliation, so the country was an inference.
      The other half of the same contrast is kept, because it is sourced:
      PMID:27469900's full text states "NSC patients seen at King's College
      Hospital". Both descriptions now say explicitly that no geography is asserted
      for the second series.
    - `zygosity: HOMOZYGOUS` was removed from the `Cholangiocyte Primary Cilium
      Loss` node's `genetic_context`. The node's own cited snippet reports four
      homozygous and two compound heterozygous patients, so the structured claim
      contradicted the evidence beneath it. `ZygosityEnum` has no biallelic value,
      so the slot is now omitted and the description says why - the same convention
      this entry's sibling files already use for the PHO SLCO2A1 and PROS1 cases.

    Found while acting on the above, not raised by the reviewer: two prose fixes I
    had written during self-review before the first push were never actually
    applied. The script that made them raised an AssertionError on a later
    replacement and exited before its single terminal write, and I read the next
    command's "validations passed" line as confirmation they had landed. Both are
    now applied:
    - The DCDC2 node no longer claims the cholangiocyte "loses its ciliary mechano-
      and chemosensory apparatus". No cited source establishes what the cilium
      contributes functionally; the node now records the structural loss and the
      cholangiopathy that accompanies it, and says that is the limit of what the
      sources support.
    - The CLDN1 node no longer claims loss of claudin-1 exposes "the duct
      epithelium to bile constituents", which is not in PMID:15521008, and no
      longer infers that the epidermal defect "produces" the ichthyosis. It now
      states the two sourced facts - claudin-1 absent from skin as well as liver,
      and this subtype being the one distinguished clinically by ichthyosis.

    Not changed, deliberately: the CLDN1 node keeps `zygosity: HOMOZYGOUS`. Unlike
    the DCDC2 case, nothing cited contradicts it - PMID:37814412 states that most
    ILVASC cases described to date were attributed to homozygous truncating
    variants. The description now names that basis and records that the founder
    missense allele's zygosity is not stated in the cited record, so the slot
    carries the modal reported state rather than a claim about every case.

    Suggestion taken: the entry-scope `review_notes` was promoted from under the
    CLDN1 genetic record to a top-level slot, where a reader looking for what is
    *not* in this entry would find it.

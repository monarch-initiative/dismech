  summary: 'Genetics pass: first genetic block - DCDC2 and CLDN1 neonatal forms'
  details: |
    Genetics pass for dismech#12205 (d2g wiring-016).

    This entry had no `genetic:` block at all and named no gene anywhere, including
    in prose, despite carrying two Mendelian neonatal subtypes whose causal genes
    have been known since 2004 and 2016. This was the largest real curation gap in
    the job.

    Changes:
    - A new `genetic:` block with two records: DCDC2 (`hgnc:18141`) for isolated
      neonatal sclerosing cholangitis (MONDO:0018816) and CLDN1 (`hgnc:2032`) for
      neonatal ichthyosis-sclerosing cholangitis / ILVASC (MONDO:0011874). Both
      `CAUSATIVE`, `GERMLINE`, and linked to their subtype.
    - Two new pathophysiology nodes so the genes reach the pathograph rather than
      sitting in a list: `Cholangiocyte Primary Cilium Loss` (DCDC2, downstream to
      Bile Duct Fibrostenosis) and `Cholangiocyte Tight-Junction Failure` (CLDN1,
      downstream to Bile Duct Inflammation). Each carries a `genetic_context` and
      `subtypes:` scope. Wiring is 2/2.
    - `genes:`, an `inheritance:` block and evidence on the two neonatal
      `has_subtypes` rows, which previously carried only a one-line description.
    - `case_fractions` on the DCDC2 record: 7 of 24 patients with available DNA (6
      of 19 families) in the King's College Hospital series, with the caveat that
      the exome-sequenced subgroup was selected for consanguinity, so it is not a
      population estimate.

    New references fetched and committed: PMID:27469900, PMID:27319779,
    PMID:15521008, PMID:37814412.

    Deliberate scope limit, recorded in `review_notes` on the block: no primary
    sclerosing cholangitis susceptibility locus is curated. PSC genetics was out of
    scope for this pass rather than investigated and rejected, and the note makes no
    claim about what that architecture is.

    Two things the CLDN1 node states as proposals rather than facts, because the
    source does: the paracellular-permeability mechanism ("may lead to", "may be
    related to") and, on the DCDC2 node, what the cilium contributes functionally -
    the cited papers establish the structural loss, not an intervening functional
    step, and the node says so.

    Verification: full offline gate list passes. `just check-snippet-length` caught
    one four-word snippet I had written and it was replaced with the full-text
    sentence carrying the allele counts.

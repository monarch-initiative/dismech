  summary: Add IMT synonym, classification and subtype evidence, somatic variant origin and driver typing, kinase molecular function, phenotype causal edges, and treatment target_mechanisms.
  details: >-
    Added the IMT synonym and PMID:34244015 evidence to classifications.harrisons_chapter
    (and documented in top-level notes why icdo_morphology is omitted for this ICD-O
    8825/1 intermediate myofibroblastic neoplasm). Added literature evidence to all 4
    molecular subtypes in has_subtypes (ALK-Positive, ROS1-Fusion, NTRK-Fusion, and
    ALK-Negative, with PMID:34244015, PMID:25612511, and PMID:15602716). Added
    genetic_context (variant_origin SOMATIC) to Clonal Receptor Tyrosine Kinase Gene
    Rearrangement, GO:0004713 (protein tyrosine kinase activity, INCREASED) to
    Constitutive Tyrosine Kinase Activation, and downstream causal edges from
    Myofibroblastic Proliferation and Inflammatory Recruitment to Soft Tissue / Visceral
    Mass, Fever, Anemia, Thrombocytosis, Elevated Erythrocyte Sedimentation Rate,
    Hypergammaglobulinemia, and Leukocytosis. Replaced legacy inheritance Somatic blocks
    on all 5 genetic entries (ALK, ROS1, NTRK, RET, and PDGFRB rearrangements) with
    structured variant_origin SOMATIC and relationship_type SOMATIC_DRIVER. Added
    target_mechanisms links to all 3 treatments (Surgical Resection, Crizotinib (ALK/ROS1
    Inhibitor), and Next-Generation ALK Inhibitors (Alectinib, Ceritinib)) and added
    PMID:15602716 surgical outcome evidence to Surgical Resection.

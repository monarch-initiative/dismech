  summary: Add the epithelioid inflammatory myofibroblastic sarcoma subtype
  details: |
    Adds one has_subtypes row, EIMS (displayed as Epithelioid Inflammatory Myofibroblastic Sarcoma), bound to MONDO:0850127. OLS confirms the label, and the term's only MONDO parent is MONDO:0015798, the entry's disease_term. The row is classification: histological, because EIMS cuts across the four fusion-defined rows rather than adding a fifth. Part of the neuroblastoma expansion series (issue 15822).

    The row describes an ALK-rearranged variant of IMT defined by epithelioid morphology and a nuclear membrane or perinuclear pattern of ALK staining. RANBP2-ALK tumors show nuclear membranous staining and RRBP1-ALK tumors cytoplasmic staining with perinuclear accentuation. Small case series, and a review pooling the reported cases, describe a more aggressive course than conventional IMT. Six evidence items come from three papers: the original 2011 series (PMID:21164297, newly cached, abstract only), a review's pooled FISH count (PMID:27460384, newly cached, full text), and the RRBP1-ALK paper the entry already cited (PMID:27874193). The new PMID:27874193 items are graded HUMAN_CLINICAL / PRIMARY_RESULT because the quoted sentences report immunostaining and FISH on patients' tumors; the paper's two existing IN_VITRO items quote its mass-spectrometry sentence and are unchanged.

    The entry's top-level notes said EIMS 'almost always harbors RANBP2-ALK fusions', citing PMID:27874193, whose abstract reports RANBP2-ALK in two of three EIMS cases and a new RRBP1-ALK fusion in the third. The sentence now says RANBP2-ALK fusions with nuclear membranous staining are described and RRBP1-ALK fusions have also been found, and it points to the new subtype.

    The row carries no treatment content. The 2011 abstract's sentences on chemotherapy and on a patient given an experimental ALK inhibitor are not quoted, and two papers that mention EIMS but report ALK-inhibitor treatment were not used. Cache files for references the entry already cited were left unchanged.

    Validation, on the branch rebased onto main: just validate-disorders, count-verified-snippets --strict, check-snippet-grading, the whole-repo offline gates that CI runs, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

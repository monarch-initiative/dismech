  summary: Add the epithelioid inflammatory myofibroblastic sarcoma subtype
  details: |
    Adds one has_subtypes row, EIMS (displayed as Epithelioid Inflammatory Myofibroblastic Sarcoma), bound to MONDO:0850127; OLS confirms the label, and its only MONDO parent is MONDO:0015798, the entry's disease_term. The row is classification: histological, because EIMS cuts across the four fusion-defined rows rather than adding a fifth. Part of the neuroblastoma expansion series (issue 15822). Classification only, under the user's decision D6 for ALK-adjacent PRs.

    The row describes an ALK-rearranged variant of IMT with epithelioid or round cells and a nuclear membrane or perinuclear ALK staining pattern; RANBP2-ALK goes with nuclear membrane staining and RRBP1-ALK with cytoplasmic staining with perinuclear accentuation; it has a predilection for the abdomen, and small case series and a review pooling the reported cases describe a more aggressive course than conventional IMT. Six evidence items: the original 2011 series (PMID:21164297, newly cached, abstract only), a review's pooled FISH count (PMID:27460384, newly cached, full text), and the RRBP1-ALK paper the entry already cited (PMID:27874193), graded HUMAN_CLINICAL / PRIMARY_RESULT because the quoted sentences report immunostaining and FISH on patients' tumours (the paper's two existing IN_VITRO items quote its mass-spectrometry sentence).

    The entry's top-level notes said EIMS 'almost always harbors RANBP2-ALK fusions' citing PMID:27874193, whose abstract reports RANBP2-ALK in two of three EIMS and a new RRBP1-ALK fusion in the third; the sentence now says RANBP2-ALK fusions with nuclear membranous staining are described and RRBP1-ALK fusions have also been found, and points to the new subtype.

    No treatment content: the 2011 abstract's sentences on chemotherapy and on a patient given an experimental ALK inhibitor are not quoted, and two papers that mention EIMS but are ALK-inhibitor clinical papers were not used; a grep of the added lines finds no ALK-inhibitor term. The workflow's transcripts were scanned for safety-classifier stops (none). Re-extracted copies of already-cited caches produced during drafting were not committed.

    Validation on the branch rebased onto main: the run_c4 gate set (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

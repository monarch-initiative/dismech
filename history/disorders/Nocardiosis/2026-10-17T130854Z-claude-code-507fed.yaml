  summary: Bind LOINC Gram stain and method-less Nocardia identification codes
  details: |
    LOINC tranche B batch 28. The Gram-stained smear row takes LOINC:664-3 (Microscopic observation in Specimen by Gram stain), matching method and leaving the site unqualified as the row does. The molecular species identification row takes LOINC:55096-2 (Nocardia sp identified in Isolate).

    That second binding corrects an earlier assessment of this entry rather than adding to it. This entry was examined in batch 26 and rejected on the grounds that its molecular row names 16S sequencing, MLSA, MALDI-TOF, whole-genome and metagenomic sequencing while the only Nocardia molecular code is a nucleic acid amplification assay, so no code matched the method. That reasoning was looking for a method match and did not notice the method-less identification code, which is the preferred identity level anyway and is the correct answer precisely because the row names five methods: binding any one of them would narrow the row to a single technique. The Isolate specimen matches identification performed on cultured material, and the code reports an identity, which is the species-level answer the row is for.

    The general lesson is that a row naming several methods should prompt a search for a method-less code, not a search for whichever method happens to be coded.

    Sources: observation-code existence and absence from the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows with status and deprecation checked per code, so each result set is complete rather than a ranked page; Part-level questions from the Monarch KG, which the export cannot answer because it carries no LP or LG rows. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 273 LOINC rows added by all 45 open loinc PRs, enumerated with pagination: no collision.

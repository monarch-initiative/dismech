    Round-2 ai4c-reviewer fixes (phenotype coverage). Added chest-CT phenotypes Pulmonary cavity (HP:0033655; PMID:37185005 higher cavitation in immunosuppressed) and Mediastinal lymphadenopathy (HP:0100721), both subtype Pulmonary and wired from Pulmonary Suppurative Inflammation. Added CNS phenotypes Headache (HP:0002315) and Reduced consciousness (HP:0004372, altered mental state), subtype Disseminated or CNS Nocardiosis, wired from CNS Abscess Formation (PMID:35700710 'focal neurological deficits...headache, fever, and altered mental state'). Ground-glass opacity, pleural effusion, consolidation and seizure were not added: the cache line-wraps their percentages mid-number so no clean quotable substring exists, and consolidation has no HP term. Suggestions taken: rebound molecular species ID NCIT:C101293 -> NCIT:C18194 Molecular Diagnostic Method (covers MALDI-TOF/16S, not just NGS); added a Pulmonary Suppurative Inflammation -> Hematogenous Dissemination edge and dropped the generic GO:0006954 inflammatory-response binding on the dissemination node. Skipped calcineurin evidence and SOT prevalence (PMID:27090987 line-wraps the OR and incidence figures). 43/43 snippets, 11/11 phenotypes connected, all gates green.

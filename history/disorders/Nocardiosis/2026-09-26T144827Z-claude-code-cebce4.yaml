  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED. Added the host half of the two-hit model: an Impaired Cell-Mediated Immunity pathophysiology node (role: disposition; T cell + macrophage; PMID:23429356 inherited IL-12p40 deficiency, PMID:38915339 anti-GM-CSF) feeding Intraphagocytic Nocardia Survival and Hematogenous Dissemination, plus an Iatrogenic immunosuppression environmental entry (influences_mechanisms PREDISPOSES -> that node; PMID:35700710 corticosteroid 55.8%, entry evidence PMID:39254072 methylprednisolone/CMV). Dropped the intracellular_pathogen_persistence conforms_to (both its nodes assert beta-lactam exclusion, which Nocardiosis contradicts with carbapenems/ceftriaxone) and recorded why in notes. Split the bundled 'Pulmonary, Cutaneous, and Hematogenous Abscess Formation' node into Pulmonary Suppurative Inflammation, Cutaneous Actinomycetoma Lesion, Hematogenous Dissemination, and CNS Abscess Formation, each wired to its phenotype. De-bundled the host immune defect out of Intraphagocytic Nocardia Survival (kept pathogen survival + N. brasiliensis protease virulence). Added a diagnosis section (microscopy NCIT:C16853 PMID:36636850; molecular species ID NCIT:C101293 PMID:42258415; chest CT NCIT:C17204 PMID:37185005). Added Pulmonary nodule (HP:0033608) and Abnormal sputum (HP:0032016) phenotypes; tagged site subtypes; wired all 7 phenotypes (100% connected, up from 60%). evidence_source fixes: PMID:37527397 HUMAN_CLINICAL->IN_VITRO (broth microdilution/WGS of isolates, all occurrences); PMID:39780099 OTHER->HUMAN_CLINICAL+BACKGROUND; PMID:33956121 clinical-picture sentence OTHER->HUMAN_CLINICAL+BACKGROUND and protease sentence MODEL_ORGANISM+BACKGROUND. Dropped the generic GO:0051701 on the trigger node. Fixed a memory-written reference_title on PMID:37185005. All gates green.

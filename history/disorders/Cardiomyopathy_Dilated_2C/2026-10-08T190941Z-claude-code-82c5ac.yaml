  summary: 'Create: Cardiomyopathy_Dilated_2C'
  details: |
    Created the CMD2C (PPCS deficiency disorder, MONDO:0032592) entry for claim issue #13717. Deep research provider: claude_code (falcon fallback); the report's gene identity and references were validated beforehand. Evidence base: 12 patients in 8 families from Iuso 2018 (PMID:29754768, families A and B), Lok 2022 (PMID:35616428) and Zhang 2025 (PMID:40745475, which re-reports family B as F6), plus the patient iPSC-line report PMID:35397396. Pathophysiology chain: two trigger nodes (homozygous missense; compound heterozygous) -> Reduced PPCS Protein Stability -> Cellular Coenzyme A Deficiency (established in fibroblasts and iPSC-derived cardiac cells, rescued by wild-type PPCS) -> Impaired Long-Chain Fatty Acid Activation (provisional; includes a REFUTE item for normal fasting RQ) -> Cardiomyocyte Energy Deficit (hypothetical) -> Cardiomyocyte Contractile Dysfunction -> Dilated Cardiomyopathy. Sarcomere disorganization and arrhythmogenicity nodes come from in vitro iPSC-CM and heart-patch data; a catabolic-stress decompensation node is hypothetical. 26 HP phenotypes, frequency set only for DCM (10/12 from Table 1). Drosophila dPPCS1 animal model and two experimental models (iPSC-CMs and patches; fibroblasts) linked via modeled_mechanisms. Four discussions: small evidence base, cardiac CoA and tissue selectivity gap, cysteine toxicity hypothesis, model mismatch. No ClinGen record exists, so gene_disease_validity is left empty. check-genereviews --online: NO_CHAPTER. Validation: just validate passed; count-verified-snippets 139/139; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, snippet-length, snippet-grading, title-snippets and coarse-phenotypes all OK; model-scale-audit has no warnings after a SCALE_EXTRAPOLATION divergence was changed to PROXY_QUANTITY. Deleted stubs/Cardiomyopathy_Dilated_2c.yaml.

    Review fixes: consanguinity corrected to 7 of 12 patients (2025 Table 1 row added as a snippet), and F3 noted as non-consanguineous. F6:IV.1's death at 21 from SARS-CoV-2 after four years on pantethine added to progression and treatment. The fatty-acid node was renamed Impaired Long-Chain Fatty Acid Oxidation; its description now separates the 2018 low-acylcarnitine data from the crisis data, which suggest a downstream block. Two edges were downgraded to INDIRECT_UNKNOWN_INTERMEDIATES. A mis-graded sarcomere snippet and the ERP evidence were replaced, and the arrhythmogenicity description was corrected; it is deliberately not linked to Prolonged QT. 2025 fibroblast CoA evidence was added and that link's fidelity lowered to MODERATE. relationship_type CAUSATIVE was removed because PPCS has no external validity tier. Nine phenotype edges were added. The F2:II.1 lactate conflict is recorded, and F1:II's biopsy, global brain atrophy and 3-methylcrotonylglycine excretion were added. Phenotypes now 27, 18 causally connected; count-verified-snippets 149/149.

  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR 8774 (findings 2, 4, 7). Finding 4: the two frequency EXCLUDED phenotypes (HP:0000966 Hypohidrosis, HP:0000668 Hypodontia) previously cited PMID:28297138, a HOXC13 paper, as class-level support for the PHNED sparing rule. Both now cite the family-specific sentence in Raykova 2014 (PMID:24714551), the only reported ECTD7 family: 'The affected individuals were otherwise healthy including normal skin, dentition and self-reported normal'. The quote deliberately stops one word short of 'sweating' because that word is hyphen-folded across a line break in the cached text ('sweat-' / 'ing'); the explanation field records this rather than relying on a folded-hyphen match. A negative asserted of one family should be evidenced from that family's own report. Finding 2: added a diagnosis block covering the panel-versus-single-gene strategy and the in-trans confirmation requirement for a recessive entity, plus three differential_diagnoses, the sharpest being the allelic trap where heterozygous KRT74 variants cause dominant woolly hair curated separately as Isolated_Woolly_Hair. Finding 7: recorded in genetic.notes that the Raykova snippet says 12p11.1 while KRT74 and the type II keratin cluster are on 12q, flagged as a probable paper-side error and explicitly marked do-not-correct so a later curator does not turn a verbatim quote into a misquote. Verification: validate-disorders passed; snippet audit 12/12 verified against cached references.

  summary: 'Create: KRT74-Related Pure Hair-Nail Ectodermal Dysplasia (ECTD7)'
  details: |
    De-novo curation of ECTD7 (MONDO:0013975) from Edison (falcon) deep research plus independent primary-literature verification. The Edison report research/KRT74_Ectodermal_Dysplasia-deep-research-falcon.md passed 'just preflight-dr' against MONDO:0013975 (KRT74 41 mentions vs KRT85 3, HOXC13 3) and its single extracted reference resolved. Edison's own finding that the entire disease-specific evidence base is one 2014 report of one consanguineous Pakistani family (PMID:24714551) is carried through into the entry: no frequency bands are asserted on the hair and nail phenotypes, and the paper's approximate one-per-million figure is recorded in prevalence notes as a Hardy-Weinberg extrapolation rather than as a measured rate. Two Edison-suggested HPO CURIEs were corrected after OAK validation: HP:0012203 proposed for onycholysis is actually 'Unusual fungal nail infection' (correct term HP:0001806), and HP:0001813 proposed for micronychia does not exist (used HP:0001792 'Small nail' with preferred_term Micronychia). The KRT74 allelism trap flagged in the issue thread is handled explicitly: entry notes distinguish recessive ECTD7 from the dominant-negative heterozygous KRT74 woolly-hair phenotype already curated as the ADWH subtype of Isolated_Woolly_Hair, and no evidence is shared between them. Validation run: schema validation via the pre-edit hook; 'just validate-terms' passed; 'just count-verified-snippets' 12/12 verified against cached references; 'just validate-disorders' run once as the pre-PR sweep.

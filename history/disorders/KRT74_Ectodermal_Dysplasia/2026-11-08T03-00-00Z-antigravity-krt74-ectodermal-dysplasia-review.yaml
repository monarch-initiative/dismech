  summary: Added MONDO synonyms and classifications, enriched KRT74 pathophysiology ontology bindings and downstream edges, added Distal Onycholysis evidence, and refined diagnosis and treatment annotations for KRT74-Related Ectodermal Dysplasia.
  details: >-
    Added MONDO label and exact/abbreviation synonyms for MONDO:0013975 and
    confirmed GeneReviews NO_CHAPTER. Added Harrison's chapter classifications
    (DERMATOLOGY, GENETICS_ENVIRONMENT_DISEASE) and intermediate filament
    disease mechanistic category backed by verbatim evidence from PMID:24714551.
    Grounded Keratin-74 Intermediate Filament Instability with KRT74 gene,
    intermediate filament cellular component, anatomical locations, and
    epithelial cell types, and wired downstream links to Micronychia and Distal
    Onycholysis. Added verbatim Figure 1B full-text evidence to Distal
    Onycholysis and updated its notes accordingly, added NCIT Genetic Testing
    binding and zygosity-accurate results to diagnosis, added carrier-phenotype
    evidence to Genetic Counseling, and kept Symptomatic and Supportive
    Management unlinked from pathophysiology with background context graded
    quote_role: BACKGROUND and directness: INDIRECT.

  summary: Added classifications, enriched KRT74 pathophysiology ontology bindings and downstream edges, added Distal Onycholysis evidence, and completed diagnosis and treatment annotations for KRT74-Related Ectodermal Dysplasia.
  details: Added Harrison's chapter classifications (DERMATOLOGY, GENETICS_ENVIRONMENT_DISEASE) and intermediate filament disease mechanistic category backed by verbatim evidence from PMID:24714551. Grounded Keratin-74 Intermediate Filament Instability with KRT74 gene, intermediate filament cellular component, anatomical locations, and epithelial cell types, and wired downstream links to Micronychia and Distal Onycholysis. Added verbatim evidence to Distal Onycholysis, added NCIT Genetic Testing binding and results to diagnosis, and added target mechanisms and verbatim evidence to treatments.

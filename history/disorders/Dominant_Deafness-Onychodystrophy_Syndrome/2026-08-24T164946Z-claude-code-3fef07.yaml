  summary: 'Address review on PR 9201: deep-research artifact, diagnosis section,
    and corrected implant-outcome claim'
  details: |
    Second curation round on DDOD, responding to the ai4c-reviewer CHANGES_REQUESTED on PR 9201 and to second-opinion feedback left on issue 9199. Blocker resolved: the falcon deep-research report returned after the first commit and is now committed under research/, together with its citations sidecar and artifact directory. NEC preflight was run against MONDO:0007420 and returned PASS with ATP6V1B2 mentioned 46 times against TBC1D24 at 4, and the report OMIM ids including 124480 matching the MONDO xref; the issue commenter predicted a WARN here on the grounds that ATP6V1B2 is canonical for DDOD, ZLS2 and part of DOORS, so the OMIM agreement rather than the gene frequency is what carries the verdict. Substantive corrections found by cross-checking the report against the entry, each verified against the cached abstract rather than taken from the report: the V-ATPase node was renamed from Impaired V-ATPase Assembly to Weakened V-ATPase Subunit Interaction because assembly still takes place with the truncated subunit and only the E to B2 interaction is weak, which is also why the dominant-negative reading stays live; the cochlear implantation claim that outcomes are good was corrected, since follow-up of implanted DDOD patients found language rehabilitation unsatisfactory despite a well-functioning device, attributed to learning and memory problems; and a new KNOWLEDGE_GAP discussion records that cognitive sparing in DDOD is supported at the level of frank intellectual disability but not demonstrated at the level of subtle learning and memory, with a deafness-matched control arm proposed as the experiment that would settle it. Additions: a diagnosis section covering molecular testing, ABR and the informative negative that temporal bone imaging is normal; auditory nerve fibre demyelination and the mitochondrial cytochrome c release step added to the cochlear degeneration node; enamel hypoplasia as a dental phenotype; CPT-cAMP lysosomal reacidification curated as an explicitly preclinical treatment targeting the rate-limiting acidification node, with the caveat that its demonstrated benefits are on the neurological arm that classic DDOD largely lacks; and independent isogenic CRISPR replication of the raised lysosomal pH, which removes the overexpression caveat from the original transfection result and sharpens the bidirectional pH knowledge gap. Reviewer suggestions addressed: PMID:34232384 now backs a real evidence item in the diagnosis section rather than sitting uncited in references; the p.Arg506-stop variant record gained clinical_significance PATHOGENIC and two evidence items including absence from 1053 controls. Declined: splitting the spiral ganglion and hair cell node, since no evidence separates their timelines in the same model and the reviewer marked it non-blocking. Validation: just validate and just validate-terms passed; just count-verified-snippets reported 87/87 verified against cached references; check-folded-hyphens, check-snippet-length, check-title-snippets, check-duplicate-keys and check-term-cache-integrity all clean; no cache rows were required by this round after re-deriving.

  summary: 'Create: Dominant Deafness-Onychodystrophy Syndrome, DDOD, ATP6V1B2'
  details: |
    De novo curation of DDOD, MONDO:0007420, the ATP6V1B2 p.Arg506-stop dominant deafness-onychodystrophy syndrome. Entry type decided as DISEASE: a MONDO leaf with its own OMIM identity 124480, and dismech already curates Zimmermann-Laband and DOORS as separate entries. Curated a five-node mechanistic chain: C-terminal truncation and impaired V-ATPase assembly, impaired endolysosomal acidification, autophagic flux blockade, apoptotic spiral ganglion neuron and hair cell degeneration, and impaired nail matrix and distal digit development. Also 10 phenotypes, 2 treatments, 3 animal models, 1 iPSC experimental-model pair, and 2 differential-diagnosis blocks for ZLS2 and DOORS that state the ATP6V1B2 continuum explicitly rather than leaving it implicit. Four discussions record what is genuinely unresolved: haploinsufficiency versus dominant negative for p.Arg506-stop; the opposite-direction lysosomal pH results between the DDOD truncating allele and the ZLS2 missense alleles, which were never measured side by side; the entirely unmeasured nail-matrix mechanism; and a HUMAN_MODEL_MISMATCH on the knock-in mice having normal early hearing via Atp6v1b1 paralogue compensation. functional_impact_category set to LOSS_OF_FUNCTION deliberately as the superordinate call the literature supports, NOT DOMINANT_NEGATIVE, since the route is explicitly left open by the cited review. Conformance declared only to sensorineural_hair_cell_loss, at the Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration node; conformance to lysosomal_substrate_accumulation deliberately NOT declared because the substrate-storage data come from ZLS2 missense lines rather than DDOD cells. Literature assembled directly from PubMed E-utilities searches over the ~30-paper ATP6V1B2 deafness/onychodystrophy corpus, and every cited abstract was read in full before curation; no GeneReviews article exists for DDOD, confirmed by PubMed search. A falcon deep-research run was launched as an independent cross-check but had not returned by the time this entry was completed, so nothing in this entry derives from it and no deep-research report is committed with it. Validation: just validate and just validate-terms passed via the pre-edit hook; just count-verified-snippets reported 68/68 verified against cached references, after two initially-unverified iPSC snippets were rewritten as exact abstract quotes; check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-duplicate-keys were all clean; 8921 selected tests in tests/test_data.py passed; just validate-disorders was run as the batched pre-PR sweep.

  summary: 'Create: IFNAR2 Deficiency (immunodeficiency 45)'
  details: |
    New Disease entry for MONDO:0014727 (immunodeficiency 45), curated as IFNAR2 Deficiency following the STAT2_Deficiency precedent for gene-defined type I interferon inborn errors.

    Deep research: 'just research-disorder claude_code IFNAR2_Deficiency' (report committed). Its validation sections flagged needs_review on three counts, none of which affect this entry: one quote attributed to PMID:35442417 was a paraphrase of that paper's introduction (not reused here - the PMID:35442417 snippets in this entry were taken directly from the cached abstract); HP:0025143 and HP:0025047 were reported under labels belonging to different terms (neither is bound here); and HP:0002264 did not resolve (not bound here).

    GeneReviews baseline: searched PubMed for an IFNAR2 GeneReviews chapter ('IFNAR2 GeneReviews[All Fields]'); none exists, so no GeneReviews baseline was available. Phenotypes were taken from the primary case literature instead.

    Pathophysiology is curated as a causal chain rather than a list: IFNAR2 Loss of Function -> Absent Type I Interferon Receptor Signaling -> (Failure of Interferon-Stimulated Gene Induction -> Unrestricted Viral Replication and Cytopathicity -> phenotype nodes) and -> Natural Killer Cell Functional Dysregulation -> Hemophagocytosis. The NK-to-HLH edge is typed INDIRECT_UNKNOWN_INTERMEDIATES because Passarelli et al describe the relation between HLH and defective type I IFN responses as unclear and frame NK dysregulation as a contributor rather than a demonstrated cause.

    Recorded as a mechanistic hypothesis (narrow_phenotype_redundancy, status EMERGING) rather than as mechanism: the dissociation between a complete in vitro signalling defect and a narrow in vivo phenotype. The entry states the competing ascertainment-bias reading explicitly rather than asserting redundancy as settled.

    Deliberately NOT claimed: broad or recurrent susceptibility to ordinary respiratory viruses. Duncan et al report the opposite for the index patient, so no 'Recurrent viral infections' phenotype was added despite it being the obvious enum value for an immunodeficiency; the negative observation is carried in the hypothesis instead. The Inuit p.Ser53Pro allele frequency (0.034) is recorded as measure_type CARRIER_FREQUENCY with a note warning it must not be read as a disease rate.

    Validation: 'just validate' passed with 28/28 snippets verified against the cached references; 'just validate-terms' passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean. Five references were fetched and committed (PMID:26424569, PMID:35442417, PMID:33193576, PMID:39436454, PMID:36439115); PMID:33729549 was already in the cache on main and is cited without modification. References the deep-research validator fetched incidentally but this entry does not cite were removed from the diff.

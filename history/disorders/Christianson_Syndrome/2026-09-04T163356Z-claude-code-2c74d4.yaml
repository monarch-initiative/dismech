  summary: 'Create: Christianson Syndrome MONDO:0010278'
  details: |
    Created from PubMed literature with a five-iteration OpenScientist deep-research job as a cross-check.

    The iteration count was chosen deliberately. A two-iteration run on the previous entry (aneurysmal bone cyst) produced three findings sections and no epidemiology at all, and missed five items a reviewer subsequently found in cached sources. This five-iteration run produced nine findings sections and 33 citations in 1059 seconds, against three sections and 29 citations in 757 seconds for two iterations. Roughly 40 percent more runtime for three times the structured findings.

    The report earned its place. It supplied a mechanism for a phenotype this entry had explicitly graded UNKNOWN. High pain tolerance is a core feature present in 91 percent of patients and the entry initially attached it to the graph with causal_link_type UNKNOWN, because no cached source proposed a mechanism. The report pointed to work showing NHE6 expression in nociceptors, reduced cell-surface TRPV1, and blunted nocifensive responses to thermal, mechanical and chemical stimuli in Nhe6-null mice. That was verified directly against PMID:32569089 before use and the edge was upgraded to INDIRECT_KNOWN_INTERMEDIATES. The report also surfaced a TrkB agonist rescue experiment (PMID:39341363) and a pH-independent CDK5 scaffolding role (PMID:42051037), both fetched and verified.

    The BDNF-TrkB node was consequently regraded from HYPOTHETICAL to PROVISIONAL. The original grading reflected that TrkB and Akt phosphorylation had been measured in the mouse organ of Corti, in a hearing-loss study, and extending that to forebrain arborisation was inference. The rescue experiment supplies the missing forebrain evidence: 7,8-dihydroxyflavone restores dendritic spine density and both functional and structural long-term potentiation in Nhe6-null hippocampal neurons. Rescue is stronger than correlation. The edge onward to arborisation remains INDIRECT_UNKNOWN_INTERMEDIATES because spine density and arborisation are related but not the same measurement.

    Two modelling decisions. First, the pathograph branches deliberately into a developmental arm (arborisation to postnatal microcephaly, intellectual disability, non-verbal status, epilepsy, hyperkinesia) and a degenerative arm (lysosomal storage to Purkinje cell loss, ataxia, regression, cerebellar atrophy). Collapsing them would lose the clinically important fact that a child can be developmentally static for a decade and then begin losing skills. Second, the direction of the pH defect is stated explicitly because intuition runs the other way: NHE6 exports protons, so losing it over-acidifies the endosome. The point is sharpened by p.Gly218Arg, a probable gain-of-function allele that alkalinises the endosome and still causes the core syndrome while sparing the later motor deterioration, so the node is framed as loss of pH control rather than as acidification.

    Process note. Four of the twelve cached references are full text rather than abstracts, and content_type in the cache frontmatter was checked before writing rather than after. The natural-history figures throughout come from reading those full texts. One artefact worth recording: PDF-derived full text carries interleaved line numbers that break sentences, so two snippets initially failed verification and were shortened to contiguous fragments.

    Topology was verified by parsing the file and printing every node with its outgoing edges. The first run found eight orphan phenotypes, which were connected before any commit. Final state: one root, no orphans, no dangling targets.

    On prevalence. No quotable prevalence or incidence figure exists in the cached sources, and the deep-research report independently reached the same conclusion, describing precise figures as undefined. The absence is recorded as a property of the literature rather than left as an unexplained gap.

    Validation: 59/59 snippets verified, term validation passes, weighted compliance 100.0 percent, all content gates clean.

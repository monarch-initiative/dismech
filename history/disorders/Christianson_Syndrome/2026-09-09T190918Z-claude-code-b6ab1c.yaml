  summary: 'Review round 1: correct frequency bands, read the core-criteria sentence
    one way, mine the GeneReviews sections'
  details: |
    Review round 1 on PR #10961 requested changes on five findings. All five are addressed, plus the one non-blocking suggestion.

    Two frequency bands contradicted the numbers in their own verified snippets. Pain insensitivity was FREQUENT against a quoted 91 percent and is now VERY_FREQUENT. Developmental regression was OCCASIONAL against a quoted 50 percent and is now FREQUENT. Both explanations now state what the band was before, so the correction is visible in the entry rather than only in this record.

    The more interesting finding was one sentence read six ways. The core-criteria sentence from the longitudinal study was being read as OBLIGATE for non-verbal status, intellectual disability and epilepsy, and as FREQUENT for microcephaly, ataxia and hyperkinesia - three items from the identical list. All six are now VERY_FREQUENT from the stated greater-than-85-percent, and each carries the same sentence as its band evidence with the same explanation of why. Universal presence between ages 6 and 16 is an age-window statement, not a lifespan-wide obligate finding, and that reading is now applied uniformly instead of selectively. Ataxia was separately wrong in kind: its band was evidenced by the 30 to 60 percent rate of cerebellar atrophy on imaging, which is a different phenotype's number. That figure stays on Cerebellar Atrophy where it already sat, and the ataxia evidence item now says explicitly that it supports the cerebellar basis and does not carry the band.

    The GeneReviews failure is the one worth recording, because it is the same failure as on the A20 haploinsufficiency entry earlier in this series. PMID:29334451 is GeneReviews and is now tagged. It is cached as abstract_only, which is honest, but its abstract is sectioned, and an earlier draft mined CLINICAL CHARACTERISTICS and stopped - leaving the GENETIC COUNSELING recurrence risk and the MANAGEMENT surveillance schedule unread in a file already committed to this branch. Checking content_type does not catch this, because the label is correct; the only fix is to read a GeneReviews record section by section regardless of what content_type says. The 50 percent transmission risk and its split by sex of offspring are now curated under inheritance. The surveillance recommendation is now a treatment, Regression Surveillance, targeting the Developmental Regression node with treatment_effect MODULATES and a description stating that surveillance does not prevent regression, only changes when it is recognised. That recommendation sits squarely on this entry's own thesis about the biphasic course, which is why leaving it unmined was worse than an ordinary omission.

    Three phenotypes added, all quotable from references already committed to this branch. Eye movement abnormality binds HP:0000496 at FREQUENT; the review estimated about 79 percent but the tabulated counts in the cohort are 69 and 70 percent, so FREQUENT is the band the numbers support. Hypotonia binds HP:0001252 from a GeneReviews sentence the entry was already quoting elsewhere. Upper motor neuron dysfunction binds HP:0002493 at FREQUENT from greater-than-50-percent over age 10; the previous notes paragraph named corticospinal involvement as an unmodelled extension point, which was not a scoping rationale when the evidence was already in the file.

    All three are wired into the pathograph. Hypotonia and eye movement abnormality hang off the arborisation node as INDIRECT_UNKNOWN_INTERMEDIATES, the latter because no cached source localises the eye movements to a circuit and assigning them to the cerebellar arm on plausibility would be a mechanism claim without a source. Upper motor neuron dysfunction hangs DIRECT off the neurodegeneration node, since the cohort contrasts the corticospinal findings with the cerebellar ones directly. A pre-existing orphan was also fixed: failure to thrive is now linked as INDIRECT_KNOWN_INTERMEDIATES with hypotonia and dysphagia as the named intermediates, from the sentence that states all three.

    One term error caught by validation rather than by reading. The surveillance treatment initially bound NCIT:C25243, which I had assumed was a monitoring term. It resolves to "Vertical". The binding is now NCIT:C124351 Clinical Evaluation, verified as a descendant of NCIT:C25218 before use.

    The notes sentence saying four of ten cached references were full text is corrected: there are twelve references and five are full text.

    Validation: 76/76 snippets verified, up from 59/59. Term validation passes, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets, weighted compliance 100.0 percent. The two repository gates that fail, check-snippet-grading and check-title-snippets, fail on unrelated files and report no findings in this entry.

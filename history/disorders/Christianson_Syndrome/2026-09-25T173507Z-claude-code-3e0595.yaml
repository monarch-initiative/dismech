  summary: 'Review round 2: re-anchor natural history to the published J Med Genet paper; add secondary
    symptoms'
  details: 'Round-2 review (PR 10961) found the natural-history claims resting solely on a medRxiv preprint
    (PMID:37987014). Fetched the peer-reviewed version, PMID:39237363 (J Med Genet 2024), as full text
    via PMC, and re-quoted all 23 preprint evidence items against it; only five preprint sentences survived
    verbatim, so each snippet was re-derived from the published text and checked as a normalized substring.
    Per-feature core-symptom rates now come from the published sentence giving ID 100, epilepsy 100, non-verbal
    100, microcephaly 95, ataxia 95 and hyperkinesia 93 percent. Regression now uses the published 54
    percent result with its age gradient, replacing a preprint snippet that quoted the prior 14-proband
    study and carried a PDF margin line number (''73''). Eye movement abnormality moved from 69/70 percent
    to the cohort-wide 68 percent. The 30-60 percent cerebellar atrophy figure is marked quote_role BACKGROUND
    because both versions cite it from earlier series. The pathophysiology description saying there is
    no recurrent allele contradicted the published paper (five recurrent mutations, 45 percent de novo)
    and was corrected with a new evidence item. The preprint was removed from references and its cache
    file deleted. Added seven phenotypes from the published secondary-symptom sentence and scoliosis sentence:
    unprovoked laughter HP:0000748 (62), GERD HP:0002020 (56), constipation HP:0002019 (55), sleep disturbance
    HP:0002360 (51), reduced visual acuity HP:0007663 (52), contractures HP:0001371 (36), scoliosis HP:0002650
    (39), all FREQUENT and left without incoming causal edges because no cited source gives a mechanism;
    all CURIEs and labels read from cache/hp/terms.csv and the phenotype enum cache. The round-2 review''s
    43/76 laughter and the earlier 69/70 eye-movement figures came from the preprint''s Supplementary
    Table 1, which stratifies by inheritance and mutation type, not from cohort-wide rates. Moved three
    notes paragraphs that narrated review round 1 (frequency-band corrections, the six-way reading of
    the core-criteria sentence, and GeneReviews section mining) out of notes, replacing them with a short
    factual paragraph on how the core-feature bands are derived, and removed explanation text describing
    earlier drafts, per CLAUDE.md on notes versus history records. Updated the extension-points paragraph
    where the published cohort answers it (no genotype-phenotype association; three deaths among 44).
    Merged origin/main with no conflicts. Validation: just validate passes, 84/84 snippets verified, and
    the offline gates (duplicate keys, entity refs, causal targets, enum values, qualifier terms, case
    collisions, folded hyphens, snippet length/title/grading, reference titles, coarse phenotypes) are
    clean. Round 3 follow-up in the same session: contractures rebound from HP:0001371 Flexion contracture
    to its parent HP:0034392 Joint contracture, because the source gives neither joint nor direction (the
    first binding had been justified with an incorrect statement that HP:0001371 is the general class);
    the frequency band removed from Hypotonia, whose only evidence is a GeneReviews feature list with
    no rate; and the Cerebellar Atrophy explanation now states that the 30-60 percent range lies inside
    the FREQUENT band.'

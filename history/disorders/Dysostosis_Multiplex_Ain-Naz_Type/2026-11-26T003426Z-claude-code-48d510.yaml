  summary: 'Gene-family review: LYSET; bind its GlcNAc-1-phosphotransferase binding
    activity'
  details: |
    The LYSET loss-of-function node carried only the process protein stabilization, with no molecular function. LYSET is a small Golgi transmembrane protein that binds GlcNAc-1-phosphotransferase (GNPTAB) and is required to retain and stabilize it in the Golgi; it has no catalytic activity (QuickGO lists only protein binding). The node now binds enzyme binding (GO:0019899, preferred term GlcNAc-1-phosphotransferase binding) as decreased, supported by the co-immunoprecipitation result that the patient allele p.(Arg45Trp) is expressed but severely defective in binding GNPTAB and fails to rescue lysosomal enzyme sorting in LYSET knockout cells (PMID:36074821). The record stays CAUSATIVE: four families with homozygous LYSET alleles (PMID:33252156, PMID:40171858, PMID:41858182) and two independent functional studies (PMID:36074821, PMID:36074822); ClinGen has not classified the gene.

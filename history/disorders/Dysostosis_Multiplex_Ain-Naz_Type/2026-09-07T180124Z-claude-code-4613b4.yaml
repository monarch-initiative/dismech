  summary: 'Create: Dysostosis_Multiplex_Ain-Naz_Type'
  details: |
    De-novo curation of dysostosis multiplex, Ain-Naz type (MONDO:0859156,
    OMIM:619345), an ultra-rare autosomal recessive disorder of the
    mannose-6-phosphate lysosomal enzyme-targeting pathway caused by biallelic
    LYSET (TMEM251/GCAF) loss of function.

    LUMP/SPLIT. Curated as entry_type DISEASE. The stub records one causal
    gene and no MONDO descendants, the leaf signature. The scope question put
    to this curation was whether MONDO:0859203 "rhizomelic dysplasia, Ain-Naz
    type" is the same entity. It is not. MONDO:0859203 xrefs OMIM:619598,
    whose MedGen record describes rhizomelic limb shortening, platyspondyly,
    and large hands and feet, and which corresponds to the GNPNAT1 disorder of
    PMID:32591345 (Ain et al., J Med Genet 2021). MONDO:0859156 xrefs
    OMIM:619345 and is the LYSET disorder of PMID:33252156. Different gene,
    different skeletal pattern, different OMIM entry; the shared eponym
    reflects only that Ain NU and Naz S are the first and last authors of both
    reports. The two are mechanistically adjacent — GNPNAT1 makes the
    UDP-GlcNAc that GlcNAc-1-phosphotransferase consumes — which is a reason to
    cross-reference them, not to merge them. The rhizomelic disorder is
    recorded here as a named differential diagnosis; its own stub was left
    untouched, since editing it is separate work.

    DEEP RESEARCH. `just research-disorder falcon` was requested but Edison
    returned HTTP 402 (account out of credits) on two attempts. The run was
    re-issued with `--fallback` and OpenScientist produced the report, which is
    committed as
    research/Dysostosis_Multiplex_Ain-Naz_Type-deep-research-openscientist.md
    with its citations sidecar and artifacts directory; the report's own
    frontmatter records fell_back: true and the provider_attempts list. Its
    reference validation was clean: 17/17 references resolved, 0 unresolved,
    9/9 quoted claims found in source, 0 off topic. term_validation reports
    needs_review: true with 6 mislabelled terms, but all six are table-parsing
    artifacts in which the report's frequency column ("Core (all)", "Frequent",
    "1 patient", "Where tested") was read as the term label rather than a wrong
    binding. One of those rows is a real error and was NOT followed: the report
    suggests HP:0003128 (Lactic acidosis) for "elevated plasma lysosomal
    enzymes". It also suggests HP:0001522 (Death in infancy) for premature
    death, which is the wrong age band. Neither was bound.

    `just preflight-dr <report> MONDO:0859156` returned WARN. The warning is
    the rival-gene heuristic firing on GNPTAB (8 mentions against 20 for
    LYSET/TMEM251), which is expected because mucolipidosis II is the
    comparator disease throughout. Identity was then checked by hand as the
    dismech-references skill requires: the report's OMIM number (619345)
    matches MONDO's xref, and the canonical gene matches. The named Named
    Entity Confusion risk for this gene — its large cancer and SARS-CoV-2
    host-factor literature — was handled by citing those papers only for the
    M6P-pathway mechanism they establish, grading them IN_VITRO, and carrying
    none of their oncology or virology conclusions into the entry; a note in
    the entry records this.

    WHAT WAS CURATED. A seven-node causal chain from biallelic LYSET loss
    through GlcNAc-1-phosphotransferase destabilization and Golgi
    mislocalization, loss of M6P tagging, hydrolase missorting and
    hypersecretion, multisystem lysosomal substrate accumulation, to skeletal
    and cardiac-valve storage disease, with a parallel chondrocyte-differentiation
    branch. Two nodes conform to lysosomal_substrate_accumulation. Eleven HP-bound
    phenotypes, the mucolipidosis-pattern biochemistry (raised plasma enzyme
    activities with reduced fibroblast activities; abnormal urinary GAGs and
    sialic acid), the four reported LYSET alleles, autosomal recessive
    inheritance, a CASES_IN_LITERATURE prevalence record, four differential
    diagnoses, the Lyset knockout mouse and tmem251 knockout zebrafish with
    typed modeled_mechanisms links, one supportive-care treatment, and four
    discussions.

    VALIDATION. `just validate-disorders
    kb/disorders/Dysostosis_Multiplex_Ain-Naz_Type.yaml` passed: schema clean,
    term validation passed, 56/56 snippets verified against the reference
    cache. Also run to completion and clean: check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, check-snippet-grading, check-snippet-length,
    check-title-snippets, check-folded-hyphens, check-reference-titles,
    check-environmental-evidence, check-term-cache-integrity,
    check-cache-order, normalize-cache, and the conforms_to / entity-reference
    pytest selections. Compliance was 81% before the last additions.

    WHAT WAS DELIBERATELY NOT DONE, AND WHY.
    - No GeneReviews baseline exists. PubMed was searched on 2026-09-07 for
      "LYSET GeneReviews" and "TMEM251 GeneReviews"; both returned zero hits.
    - isds_skeletal_category and icimd_category were left empty. The ISDS slot
      may only be assigned to disorders the Nosology itself lists and it could
      not be confirmed that this 2021-described disorder appears in the 2023
      revision; ICIMD 2021 predates the gene-disease association. Recorded in
      the entry's notes rather than guessed.
    - No HPO mortality term was bound. HP:0003819 (Death in childhood) sits in
      the HPO Mortality/Aging branch, which is outside the PhenotypeTerm
      dynamic enum's subtree and was rejected by term validation. The
      natural-history fact is recorded in a `progression` phase instead.
    - Hemivertebrae, dental abnormalities, and a ventricular septal defect
      appear in the deep-research phenotype table with no citation attached and
      could not be traced to a quotable passage in any cached primary report.
      They were not curated; a CURATION_TODO discussion records them.
    - The treatment block carries no evidence, deliberately. No treatment
      study, trial, or guideline exists for this disorder. The candidate
      disease-modifying strategies the report surfaced (HSCT, zoledronic acid,
      enzyme cross-correction, GNPTAB exon-skipping ASOs) are all mucolipidosis
      II work; two of them are cited on the dmant_no_therapy discussion instead,
      with explanations stating explicitly that they are mucolipidosis II
      studies and say nothing about a LYSET patient.
    - No `datasets:` block. No omics dataset for this disorder was identified,
      and a gene-symbol dataset search for LYSET would return the cancer
      cell-biology corpus, which is the Named Entity Confusion failure mode the
      dataset guidance warns about.
    - Eight references the deep-research report cites were fetched into
      references_cache by its own validation pass but are not cited by the
      entry; they were not staged.

    Two frequency bands (Dysostosis multiplex, Severe short stature) are
    VERY_FREQUENT as explicitly labelled curator estimates under pattern D of
    docs/frequency-evidence-guidelines.md, on the basis that every published
    family shows them. No other phenotype carries a frequency band, because
    four families cannot yield one.

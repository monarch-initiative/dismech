  summary: 'Review round 1: add diagnosis block (PR #11382)'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES verdict on PR #11382. Blocking fix: added a top-level diagnosis: block with two records - Plasma and Fibroblast Lysosomal Enzyme Panel (NCIT:C19770) capturing the paired raised-plasma / reduced-fibroblast hydrolase signature that is the biochemical key to this disease, and Molecular Diagnosis by Genome or Panel Sequencing (NCIT:C101294). Three evidence items, all exact quotes from references this PR had already cached (PMID:41858182 twice, PMID:40171858 once); no new references_cache files were needed. Also took three of the reviewer's non-blocking suggestions. Added osteoblast (CL:0000062) to the Skeletal and Connective-Tissue Storage Disease node's cell_types, since the research names chondrocyte, osteoblast and fibroblast and only the first and third were present. Populated Inheritance.penetrance (COMPLETE) and expressivity (VARIABLE) - note both slots are enum-bound rather than free text, so the reasoning behind each value is recorded in the inheritance description instead: penetrance is COMPLETE on an absence of counterexamples across four families rather than a measured figure, and expressivity is VARIABLE in severity and survival while the core skeletal phenotype stays constant. Changed the contracture phenotype binding from HP:0001371 (Flexion contracture) to HP:0034392 (Joint contracture), because the cited snippet says only 'hand contractures' and does not state flexion - the narrower term asserted a directional detail the source does not license. Both new term CURIEs were already present in cache/cl/terms.csv, cache/hp/terms.csv and the corresponding enum caches, so no cache rows were added. Declined suggestion 5 (node names joining two things with 'and') - the reviewer explicitly noted both are defensible as single molecular events and that this was not a debundling request. Suggestion 6 (GOLPH3/GOLPH3L and MBTPS1/S1P as unestablished modifiers) is not taken in this round: its source PMID:39587297 is not among this PR's committed reference caches, and adding it would mean staging a new cache file for a lead the source itself calls unestablished. Validation after the change: just validate passed with 59/59 snippets verified (was 56/56), just validate-terms passed, and check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values and check-snippet-grading are all clean.

  summary: Rebind the enzyme panel from Molecular Analysis to Laboratory Procedure
  details: |
    Corrects a diagnosis term binding that passed validation while naming the wrong concept. The plasma and fibroblast lysosomal enzyme activity panel was bound to NCIT:C19770, whose canonical label is Molecular Analysis. Because the label matched the CURIE, linkml-term-validator accepted it, but molecular analysis means DNA or RNA testing and this diagnosis is an enzyme activity measurement. The gate compares label against CURIE, not concept against claim, so it cannot catch this class of error. Rebound to NCIT:C25294 Laboratory Procedure, which is reachable from NCIT:C25218 and is what Mucolipidosis_Type_II already uses for the identical plasma lysosomal enzyme test. The preferred_term is unchanged and remains more specific than the ontology term, which the ontology term contract permits. Root cause recorded for reuse: the curation prompt supplied NCIT:C19770 glossed as Enzyme Assay. That gloss was wrong. The agent used the CURIE for an enzyme panel, term validation flagged the label mismatch, and the agent corrected the label, which left a canonical label attached to a concept that does not describe the test. Three other NCIT identifiers in the same prompt were also glossed wrongly and were checked across the whole batch: NCIT:C49286 is Hematology Test not Complete Blood Count, NCIT:C51962 is Real Time PCR not Bone Marrow Aspiration, and NCIT:C16502 is Diagnostic Imaging Testing not Radiography. None of those three was bound anywhere. This fix was prepared while PR 11382 was still open but could not be pushed, because GitHub rejects pushes to a branch sitting in the merge queue; it is delivered here as a follow-up now that 11382 has merged. Validation: just validate-terms passed, just validate passed with 59 of 59 snippets verified, and just validate-disorders passed as the authoritative batched gate. just qc was not run because it exceeds the available tool timeout.

  summary: 'Create: MERRF Syndrome'
  details: |
    De novo curation of MERRF syndrome (MONDO:0010790). Built a thirteen-node pathograph running from the MT-TK m.8344A>G heteroplasmic variant through loss of the transfer RNA lysine wobble taurine modification, defective mitochondrial translation, and respiratory chain failure, then branching into a cortical hyperexcitability arm (progressive myoclonic epilepsy) and a dentate/cerebellar degeneration arm (ataxia), plus muscle and multisystem arms. Two nodes conform to epilepsy_excitation_inhibition_imbalance and two to cerebellar_purkinje_degeneration; the scope note records why the graph joins the epilepsy module at the hyperexcitability node rather than at its ion-channel trigger, and why the module's intermediate epileptogenesis node is deliberately not claimed. Curated three discussions: a CONTROVERSY on the disconnect between measured heteroplasmy and phenotype (including whether MERRF is a discrete syndrome or one pole of an mt-tRNA-Lys spectrum), and KNOWLEDGE_GAPs on the unexplained regional selectivity of the degeneration and on the untranslated preclinical rescue strategies. Frequency bands were asserted only where a non-circular denominator exists; myoclonus deliberately carries no band because it is definitional for the syndrome.

    Review response, same session, PR #8028. Addressed all six IMPORTANT findings and the suggestions from the automated review. Corrected the module conformance count from three to two and explained the deliberately unclaimed epileptogenesis node. Replaced a contentless review-scope snippet that had been reused on three unrelated claims with directly on-point quotes mined from the cached full text, namely lactate elevation at rest and after exertion, and the explicit progressive-myoclonic-epilepsy differential naming Lafora and Unverricht-Lundborg disease. Added the GeneReviews surveillance schedule, hearing aid and cochlear implant, cardiac pharmacotherapy, and pregnancy monitoring treatments. Split the mitochondrial-toxin avoidance rule out from the valproate rule so each carries its own snippet and its own mechanism. Swapped HP:0012032 Lipoma for HP:0001012 Multiple lipomas, HP:0001250 Seizure for HP:0002197 Generalized-onset seizure, and HP:0001251 Ataxia for HP:0002073 Progressive cerebellar ataxia. Added Action myoclonus and Pigmentary retinopathy phenotypes and a clinical-criteria diagnosis entry quoting the four canonic features. Added a classifications block. Lengthened two evidence snippets that the CI minimum-snippet-length check flagged as under five words. Generated the deep-research artifact with the claude_code provider, which the initial submission had omitted.

    Validation after review response: schema passed, term validation passed, 91/91 evidence snippets verified against cached references, snippet-length check clean.

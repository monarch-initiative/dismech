  summary: 'Create: MERRF Syndrome'
  details: |
    De novo curation of MERRF syndrome (MONDO:0010790). Built a twelve-node pathograph running from the MT-TK m.8344A>G heteroplasmic variant through loss of the transfer RNA lysine wobble taurine modification, defective mitochondrial translation, and respiratory chain failure, then branching into a cortical hyperexcitability arm (progressive myoclonic epilepsy) and a dentate/cerebellar degeneration arm (ataxia), plus muscle and multisystem arms. Three nodes conform to epilepsy_excitation_inhibition_imbalance and two to cerebellar_purkinje_degeneration; the scope note records why the graph joins the epilepsy module at the hyperexcitability node rather than at its ion-channel trigger. Curated three discussions: a CONTROVERSY on the disconnect between measured heteroplasmy and phenotype (including whether MERRF is a discrete syndrome or one pole of an mt-tRNA-Lys spectrum), and KNOWLEDGE_GAPs on the unexplained regional selectivity of the degeneration and on the untranslated preclinical rescue strategies. Frequency bands were asserted only where a non-circular denominator exists; myoclonus deliberately carries no band because it is definitional for the syndrome. Validation: schema passed, term validation passed, 83/83 evidence snippets verified against cached references.

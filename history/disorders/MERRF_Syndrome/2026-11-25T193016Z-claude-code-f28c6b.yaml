  summary: 'Gene-family review: MT-TK and MT-TF; MT-TP added'
  details: |
    MT-TK now sits on the node for the lost wobble taurine modification of tRNA-Lys, which binds the tRNA's molecular function, triplet codon-amino acid adaptor activity (GO:0030533), with modifier DECREASED. The primary evidence is PMID:11532943: purified m.8344A>G tRNA-Lys loses almost all translational activity for its cognate lysine codons while aminoacylation and EF-Tu affinity are preserved, so the lost function is decoding itself; the node already cited the review stating that neither lysine codon is read (PMID:17132941). The MT-TK and MT-TF genetic records gain variant_origin GERMLINE and a Mitochondrial inheritance block (HP:0001427) quoting the GeneReviews statement that MERRF variants are maternally transmitted (PMID:20301693). MT-TF remains the representative record for the minority of MERRF caused by other mt-tRNA genes; it is not wired to a mechanism node because the single MT-TF MERRF case cited (PMID:16414077) reports no functional work on the variant.
    MT-TP is added as an UNKNOWN record with a Mitochondrial inheritance block: GeneReviews lists it among the mitochondrial tRNA genes described in a subset of MERRF (PMID:20301693), but no MT-TP MERRF case is cited and the MT-TP case literature mainly describes mitochondrial myopathy and progressive external ophthalmoplegia.

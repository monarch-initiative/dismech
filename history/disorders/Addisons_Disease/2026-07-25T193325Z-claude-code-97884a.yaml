  summary: 'Review: veterinary evidence mis-tagged as human, prevalence restructured'
  details: |
    Correctness review. (1) Three canine studies (PMID:20357943 'Canine hypoadrenocorticism', PMID:24428320 aldosterone in dogs, PMID:8680923 atypical Addison's in the dog) carried no evidence_source, which defaults to HUMAN_CLINICAL. Project policy is explicit that veterinary observations are MODEL_ORGANISM; tagged accordingly. The dog aldosterone study was also the FIRST evidence item on the human 'Aldosterone decreased' biochemical marker and was graded SUPPORT - regraded to PARTIAL, leaving the human ALD case report (PMID:32101828) as the human support. (2) Mineralocorticoid Replacement cited PMID:476980 as SUPPORT via a sentence reporting that fludrocortisone was UNNECESSARY for sodium balance in a subset of patients - that qualifies rather than establishes the claim; regraded to PARTIAL, noting PMID:24755997 carries the affirmative evidence. (3) Replaced a free-text 'percentage: Rare' prevalence record (no measure type, no rate) with a structured record: POINT_PREVALENCE, BAND_1_9_PER_1000000, 7.8 per 100,000 (range 3.9-11.7), matching the 39-117 per million figure in the cited Norwegian study. Not fixed here: all 90 evidence items in this entry lack evidence_source - tracked separately.

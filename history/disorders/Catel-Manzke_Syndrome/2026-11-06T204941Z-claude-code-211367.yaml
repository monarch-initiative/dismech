  summary: 'Create: Catel-Manzke Syndrome'
  details: |
    New entry for TGDS-related Catel-Manzke syndrome (MONDO:0014507), claim issue #16695. Deep research: one OpenScientist report (research/Catel-Manzke_Syndrome-deep-research-openscientist.md; 14/14 references resolved, preflight-dr WARN with TGDS=50 and UXS1=27 mentions, UXS1 being the downstream enzyme in the mechanism, not a second disease). The report was used for leads only; every evidence item quotes a fetched PMID abstract or full text, the Orphanet ORPHA:1388 record, or the ClinGen CGGV record (TGDS Definitive, AR). Mechanism chain follows Jacobs et al. 2025 (PMID:40836090): TGDS loss, deficient UDP-4-keto-6-deoxyglucose, UXS1 inactivation, reduced skeletal glycosaminoglycan synthesis, abnormal cartilage development; zebrafish (PMID:41159851) and mouse bub (PMID:29208648) models attached. Lump/split: KYNU (VCRL) and IMPAD1/BPNT2 (gPAPP chondrodysplasia) Catel-Manzke-like patients are recorded as differential diagnoses pointing to their existing entries; Desbuquois dysplasia 1 and Temtamy preaxial brachydactyly as further differentials. No X-linked inheritance recorded: no cached source supports it for OMIM 302380. No GeneReviews chapter (check-genereviews --online NO_CHAPTER). No treatment block: no cached source describes management. Validated with just validate, validate-terms, count-verified-snippets (66/66), find_missing_reference_titles, and the per-file and whole-repo offline gates.

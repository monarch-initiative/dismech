  summary: Link four exposures modulating transdermal absorption
  details: |
    Backfill for issue #8085. All four entries target the transdermal nicotine absorption node but modulate it in different ways. Wet tobacco leaf contact is TRIGGERS/DIRECT, the exposure the disease is named for, since dew dissolves nicotine into a film that contacts skin. Lack of protective clothing and heat with physical exertion are both EXACERBATES/DIRECT rather than triggers: neither supplies nicotine, the first removes the barrier limiting how much crosses and the second shunts blood to the absorbing compartment, so the same surface dose is taken up faster. Work inexperience is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, a proxy covering unlearned protective habits and absent tolerance rather than a mechanism; the same study finding tobacco users at lower risk supports the tolerance component. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 54 of 57 with 3 pre-existing DOI-prefix skips; integrity issue count unchanged from origin/main. PR review noted a sharper snippet was already cached in this entry. The wet tobacco leaf link previously cited incidence density by task and by time spent in wet clothing, an indirect proxy; it now cites the sentence naming harvesting wet leaves directly among the risk factors, which is the exposure the link records. Re-review found the snippet swap had left two lines of the previous explanation behind, so the field ended in a subjectless fragment attributing wet-clothing workday data to a paper that reports none. The snippet itself was correct and verified throughout; only the prose was broken. The trailing lines are removed. Re-verified: 54 of 57 with 3 pre-existing DOI-prefix skips.

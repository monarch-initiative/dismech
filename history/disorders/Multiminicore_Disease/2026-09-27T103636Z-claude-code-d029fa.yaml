  summary: 'Genetics pass: bind SELENON subtype to MONDO:0100100 and wire all four
    genes into the pathograph'
  details: |
    Genetics pass for the series-072 gap list (issue #12279). The checklist row for this parent was MONDO:0100100 congenital myopathy 3 with rigid spine, MONDO-attributed to SELENON (hgnc:15999).

    Anchor check. The parent's disease_term MONDO:0018948 multiminicore myopathy is at the right level: MONDO:0100100 is one of its five direct children, so the row was not attracted by an over-broad anchor. Mechanism found instead was an unbound row - the entry already carried a SELENON has_subtypes row with neither subtype_term nor genes, and a SELENON genetic record that reached no pathophysiology node.

    What changed. Bound the SELENON row to MONDO:0100100 and added its genes descriptor; added the ClinGen Congenital Myopathies Gene Curation Expert Panel Definitive assertion for SELENON against that same MONDO class as row evidence. Added genes to the RYR1 row and recorded MONDO:0009712 there as a skos:narrowMatch rather than as that row's subtype_term, because the MONDO class is autosomal recessive only while the row also covers dominant RYR1 disease. Added TTN and MYH7 genes to the Other row with per-gene evidence. Bound SELENON and RYR1 as genes descriptors on the pathophysiology nodes their own evidence already describes, and added a new Sarcomeric protein defect (TTN, MYH7) node feeding the shared minicore lesion, so gene wiring into the pathograph moved from 0/4 to 4/4. Added phenotype edges from the SELENON node to axial weakness, spinal rigidity, scoliosis and respiratory insufficiency; from the RYR1 node to external ophthalmoplegia and malignant hyperthermia susceptibility; and from the minicore lesion node to the biopsy finding, moving phenotype causal inlink from 0/12 to 7/12. Gave the four genetic records the enum-backed relationship_type CAUSATIVE, and replaced the TTN and MYH7 notes, which described the state of a past research session rather than the disease, with sourced statements plus evidence including the ClinGen rows for both.

    Validation. just validate, validate-terms, count-verified-snippets (all snippets verified), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches --resolve (26 of 26 gene bindings compared against HGNC, 0 findings), and the whole-repo gates, then validate-disorders.

    Self-review found and fixed one invented factual string in the first draft: an evidence explanation attributed PMID:33458581 to "Kurz" where the cached authors line reads Topaloglu H. Also softened three claims that went beyond the sentence cited for them.

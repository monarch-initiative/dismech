  summary: Review and enrich Multiminicore_Disease
  details: |
    Added synonyms, Harrison's chapter (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) and channelopathy_category (skeletal muscle channelopathy) classifications, top-level inheritance, prevalence, progression phases, and NCIT-bound diagnostic procedures (Muscle Biopsy NCIT:C51895, Magnetic Resonance Imaging NCIT:C16809, Genetic Testing NCIT:C15709); grounded SELENON loss of function, RYR1 dysfunction and abnormal SR calcium release, and Sarcomeric protein defect (TTN, MYH7) with GO molecular_functions and separated downstream biological_processes onto biochemical/cellular nodes; wired disconnected phenotypes (Hypotonia, Nocturnal hypoventilation, Reduced bone mineral density, Fatigue, Subclinical cardiac abnormalities); added ClinGen Definitive gene_disease_validity for SELENON and therapeutic_modality/target_phenotypes/target_mechanisms on treatments.

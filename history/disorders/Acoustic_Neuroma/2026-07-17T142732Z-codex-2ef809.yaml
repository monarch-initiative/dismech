  details: |
    Re-reviewed the lesion-level Acoustic Neuroma entry and rebuilt it around
    vestibular schwannoma evidence. Clarified sporadic unilateral versus
    NF2-related etiologic contexts; added structured incidence, prevalence, and
    natural-history evidence; reconstructed the NF2-merlin, receptor-control,
    YAP/TAZ-TEAD, cochlear-secretome, cranial-nerve, and advanced-mass-effect
    graph; separated somatic driver from germline predisposition; updated MRI,
    audiology, observation, surgery, radiation, and selected NF2-related
    bevacizumab content; and added evidence-backed model and discussion records.

    Deliberately omitted unsupported routine proton therapy, lapatinib,
    everolimus, compression-only hearing-loss claims, unsupported phenotype
    frequencies, and empty dataset placeholders. Trigeminal sensory disturbance
    remains preferred-term-only because the available HPO alternative is too
    narrow.


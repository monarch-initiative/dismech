  summary: Address PR review findings on Salivary Gland Polymorphous Adenocarcinoma
  details: |
    Responded to the ai4c-reviewer CHANGES_REQUESTED review on PR #8839, which raised four blocking findings. All four were legitimate and all four were addressed.

    1. HP term specificity: cervical lymph node metastasis was bound to HP:0002716 Lymphadenopathy; swapped to HP:0025289 Cervical lymphadenopathy.

    2. Unevidenced comparative prognostic claim (the substantive one). The Perineural Invasion pathophysiology node and histopathology finding both asserted that, unlike in adenoid cystic carcinoma, perineural invasion is not an adverse prognostic factor in PAC. Neither carried evidence, and no cached reference contained the string "perineural" — confirmed independently. Fetched PMID:10421256, the 164-case AFIP series, and restated the claim at the strength the evidence supports: neurotropism is frequent (histopathology finding now carries frequency FREQUENT) and coexists with approximately 97.6% of patients alive or dead without disease at an average of 115.4 months after excision alone. The comparative assertion was demoted to notes on both objects, stating explicitly that no cited source analyses perineural invasion as an independent prognostic variable within PAC, and that the 164-case series attributes the prognostic separation from ACC to the entity rather than to perineural invasion specifically.

    3. Missing diagnosis section, with a diagnostic claim miscurated as treatment evidence. Added a diagnosis section with four entries: incisional biopsy (NCIT:C15386), immunohistochemical panel (NCIT:C23020), PRKD1 hotspot sequencing (NCIT:C19641), and PRKD1/2/3 rearrangement testing (NCIT:C101293). The "diagnosis is mainly based on an incisional biopsy" evidence item was moved off the Wide Surgical Excision treatment into the diagnosis section and replaced there with two genuine treatment-evidence items from PMID:10421256. Note that NCIT:C16722 Immunohistochemistry is NOT reachable from NCIT:C25218 and fails the TreatmentActionTerm enum; NCIT:C23020 Immunohistochemistry Staining Method is reachable and was used instead. Imaging work-up (MRI/CT/ultrasound) was deliberately NOT added: the only source for it was the falcon deep-research report, and unverified DR content is not curated into this entry.

    4. Biomarker term specificity: PRKD1 E710D hotspot testing now uses NCIT:C202963 (PRKD1 NP_002733.2:p.E710D, the analyte) rather than NCIT:C95258 (the protein); PRKD1/2/3 rearrangement testing gained NCIT:C201783 PRKD1 Gene Rearrangement, having previously had no biomarker_term.

    Suggestions also acted on: softened the CL:0009005 preferred_term from "salivary gland ductal epithelial cell" to "salivary gland cell", since the term asserts neither epithelial nor ductal identity and the cell of origin is not established; and added a KNOWLEDGE_GAP discussion (pac_no_model_systems_gap) on the absence of PAC experimental models, with three proposed experiments, attached to the two nodes whose connecting edge is INDIRECT_UNKNOWN_INTERMEDIATES for exactly that reason.

    New conflict discovered and recorded rather than smoothed over: PMID:10421256 states that adjuvant therapy does not appear to alter the prognosis, which contradicts the systematic review (PMID:42438055) describing resection plus adjuvant radiotherapy as conventional and effective. This is now a REFUTE evidence item on the Adjuvant Radiotherapy treatment, and the treatment description records the benefit as unestablished. The same source also prompted a wording change on Wide Surgical Excision, which now notes that sources differ on conservative versus wide excision.

    Deliberately not done: supportive and rehabilitative care treatments, and symptomatic phenotypes such as pain and dysphagia (reviewer suggestions 6 and 8). The only source for either was the DR report, which supplies no PMIDs and no frequencies; adding them would trade a coverage gap for an evidence gap.

    Validation: just validate passes (schema, terms, references); 73/73 snippets verified against cached references, up from 62/62; weighted compliance 86.5%; check-duplicate-keys and check-title-snippets clean; 6,035 targeted integrity tests pass.

    Note: the model id is omitted from this record because the operating environment prohibits writing the model identifier into repository artifacts.

  summary: 'Create: Salivary Gland Polymorphous Adenocarcinoma'
  details: |
    De-novo curation of polymorphous adenocarcinoma (PAC) of salivary gland, formerly polymorphous low-grade adenocarcinoma (PLGA).

    Deep research: falcon (Edison Scientific) run, research/Salivary_Gland_Polymorphous_Adenocarcinoma-deep-research-falcon.md. The report corroborated the PRKD-driven model but had a thin citation base (2 distinct sources) and one unverifiable figure: it asserted an odds ratio of 801.32 with counts "PAC 38/39 vs ACC 1/155" for the p63+/p40- pattern, which is NOT present in the cited abstract (PMID:35507302). That figure was discarded and replaced with the verified meta-analysis percentages. All other evidence was sourced independently from PubMed.

    NEC preflight: "just preflight-dr" returned SKIP because the anchor MONDO term records no causal gene, so the manual check was run instead. Gene mentions in the report are dominated by PRKD1 (17) with PRKD2/PRKD3 present; "pleomorphic adenoma" appears only twice and in differential-diagnosis context; there is no PLAG1/HMGA2 (pleomorphic adenoma) or MYB-NFIB (adenoid cystic carcinoma) signal. This disease is NEC-prone because "polymorphous adenocarcinoma" collides with the benign "pleomorphic adenoma" and with adenoid cystic carcinoma; the manual check cleared it.

    Ontology decision: MONDO has NO class for polymorphous adenocarcinoma (searched labels and exact synonyms; no MONDO term xrefs NCIT:C35702 or its parent NCIT:C8021). disease_term is therefore anchored to the nearest MONDO superclass, MONDO:0000521 salivary gland carcinoma, with exact identity carried in mappings.ncit_mappings as skos:exactMatch to NCIT:C35702. This is recorded as an open CURATION_TODO discussion (pac_mondo_term_gap) proposing a MONDO term request. Subtypes are grounded to NCIT:C201781 (conventional) and NCIT:C201786 (cribriform).

    Mechanism is modeled as a five-node pathograph converging on one pathway: the PRKD1 p.Glu710Asp hotspot mutation and PRKD1/2/3 rearrangement are mutually exclusive parallel drivers that both feed a Deregulated Protein Kinase D Signaling node, then architecturally polymorphous infiltrative growth, then perineural invasion and regional nodal metastasis. The one-entity-versus-two-entity question about cribriform adenocarcinoma (CASG) is recorded as competing mechanistic_hypotheses (CANONICAL single-spectrum vs ALTERNATIVE pathogenetic dichotomy) rather than silently resolved, plus a CONTROVERSY discussion, because it has real surgical consequences for neck management. Two KNOWLEDGE_GAP discussions cover the ~21.6% PRKD-wild-type cases and the unresolved prognostic significance of PRKD alterations.

    Validation: just validate passes (schema, terms, references); 59/59 snippets verified against cached references. Weighted compliance 86.3%. Remaining compliance gaps are datasets (no relevant public omics dataset for this rare tumor) and evidence on proposed_experiments (hypothetical future work).

    Note: the model id was omitted from this record because the operating environment prohibits writing the model identifier into repository artifacts.

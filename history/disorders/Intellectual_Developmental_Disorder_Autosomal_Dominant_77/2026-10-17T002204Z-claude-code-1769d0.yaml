  summary: Bind molecular functions on the LRRC7 landing nodes
  details: |
    CI gate check_gene_activity_grounding failed on PR 14598: LRRC7 was wired to two pathophysiology nodes that carried no molecular_functions. Bound GO:0030674 protein-macromolecule adaptor activity (DECREASED) on LRRC7 Loss of Function, as densin-180 is a postsynaptic scaffold and haploinsufficiency lowers it, and GO:0008157 protein phosphatase 1 binding (DECREASED) on Densin-180 LRR and PDZ Domain Interaction Disruption, since the node's evidence (PMID:39256359) shows LRR missense variants abolish PP1 alpha binding. Both terms were already in the GO label cache and the MolecularFunctionTerm enum cache. Re-ran just validate, validate-terms, count-verified-snippets (48/48) and the gate against origin/main, all passing.

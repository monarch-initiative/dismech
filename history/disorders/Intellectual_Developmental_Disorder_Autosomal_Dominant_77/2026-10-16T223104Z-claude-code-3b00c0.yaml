  summary: 'Create: Intellectual_Developmental_Disorder_Autosomal_Dominant_77'
  details: |
    New entry for MRD77 (LRRC7, MONDO:0980748), curated mainly from the defining 33-patient cohort (Willim et al. 2024, PMID:39256359; full text cached) and three Lrrc7/densin-180 mouse papers (PMID:22072671, 28363979, 31582721), plus one VUS case report (PMID:41916897). Pathograph: LRRC7 loss of function and LRR/PDZ missense disruption lead to loss of CaMKII-PP1 scaffolding, reduced postsynaptic mGluR5 and Cav1.2, impaired LTD and reduced dendritic arborization, and on to intellectual disability and aggression. Hyperphagia is deliberately left without an upstream node because the source says its mechanism is unknown. Deep research: falcon was requested with --fallback; falcon returned 403 'Failed to authenticate' and the fallback handed over to openscientist. The openscientist report was about ZBTB7A, not LRRC7 (LRRC7 never mentioned). just preflight-dr failed it, so it was discarded uncommitted and none of its content or reference caches were used. A claude_code report was then run and committed; it passed preflight-dr (LRRC7 mentioned 34 times, OMIM 621415 matching MONDO). Its 3 unmatched quotes and its wrong first author ('Sachdev') were not reused; every snippet in the entry was taken from the cached sources directly. No GeneReviews chapter and no ClinGen validity record exist for LRRC7. Validation: just validate (schema and terms) passed, count-verified-snippets 46/46, check-entity-refs and check-causal-targets OK, and just validate-disorders was run before the PR. A pre-PR review pass (fresh-context subagent) found nothing blocking; applied: the scaffold-to-LTD edge downgraded to INDIRECT_UNKNOWN_INTERMEDIATES with an added background snippet, a subject-less snippet replaced, the unsupported hippocampal cell type dropped, GO:0099645 for mGluR5 postsynaptic localization, HP:0100716 self-injurious behavior added, and genotype-phenotype notes added. Not taken: a C. elegans let-413 model (it tests epithelial polarity, not neuronal function) and a treatments section (only supportive care exists, with no disease-specific evidence).

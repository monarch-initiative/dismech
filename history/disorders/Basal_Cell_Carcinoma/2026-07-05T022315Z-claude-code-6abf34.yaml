  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled reference_title on 18 inline evidence items across pathophysiology genetic environmental treatments and histopathology nodes covering 10 unique PMIDs. Re-verified all inline evidence snippets as exact whitespace-normalized substrings of their cached sources and confirmed each genuinely supports its claim. Ran validate-references to sync caches and attempt full text which returned 403 for all paywalled sources so enrichment drew on cached abstracts. Added two verified evidence items to previously evidence-free pathophysiology nodes. The SMO Activating Mutations node gained PMID 41515948 confirming about 50 percent of SMO-inhibitor-resistant tumors harbor mutated SMO. The GLI Transcription Factor Activation node gained PMID 29274272 confirming PTCH1 and GLI1 are Hedgehog target genes establishing positive feedback. Retracted 56 top-level references-block findings whose statement supporting_text and snippet were meaningless PubMed citation strings or author lists or a vacuous generic sentence keeping each reference as a titled literature pointer with reference title and found_in. Assessed hallmark and oncogenesis module conformance and followed the sibling Gorlin entries precedent of no forced conformance because the Hedgehog morphogen mechanism has no clean fit among the RTK RAS PI3K RB p53 telomere and angiogenesis hallmark modules. Kept only this disease reference caches with full_text_attempted flags and reverted the repo-wide reference_id requoting churn on unrelated caches.

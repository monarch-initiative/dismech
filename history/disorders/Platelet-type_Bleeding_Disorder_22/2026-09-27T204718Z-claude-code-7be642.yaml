  summary: Repair a folded-scalar hyphen split in the extrapolated-treatment description
  details: |
    The treatment named 'Extrapolated inherited-platelet-disorder haemostatic management' carried its compound term split across a fold boundary in the description: a line ended in 'inherited-platelet-' and the next began 'disorder repertoire'. YAML folding joins those with a space, so the loaded value read 'the general inherited-platelet- disorder repertoire'. This was a defect in the entry's rendered text, not only a lint finding -- the corrupted string was what any reader, renderer or export saw.

    Reflowed the description so the compound stays on one line. The only change to the loaded value is the removal of that one spurious space; verified by loading the string before and after and asserting the two differ by exactly that substitution. No wording, claim or citation changed, and the treatment's own caveat that this is class-level guidance untested in this disorder is untouched.

    Caught by 'just check-folded-hyphens' in CI, which is one of the two gates whose baseline was deliberately removed (#11760), so a finding has to be repaired rather than grandfathered. The preceding review had re-run just validate, check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys on the merged tree and approved it -- none of those reads folded-scalar line endings, which is why an approved tree was still red.

    Not swept, against the standing review suggestion: references_cache/DOI_10.1182_blood-2018-04-845644.md and references_cache/DOI_10.3324_haematol.2020.248153.md were twice reported as uncited duplicates of already-cited PMIDs, and recommended for removal the next time this file was touched. Re-deriving the citation list on this tree shows both DOIs are cited -- by research/Platelet-type_Bleeding_Disorder_22-deep-research-falcon.md and its .citations.md sidecar, at sidecar items 9, 10, 12 and 13, both of which this PR commits. validate-research-reference resolves a report's citations against references_cache, so deleting either file would strand the committed report's citations. They stay.

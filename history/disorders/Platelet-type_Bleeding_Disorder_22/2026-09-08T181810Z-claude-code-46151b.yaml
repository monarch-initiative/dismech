  summary: 'Create: Platelet-type Bleeding Disorder 22 (EPHB2, MONDO:0032765)'
  details: |
    Resolved claim issue #11470 as entry_type DISEASE: a standalone kb/disorders/ entry for bleeding disorder, platelet-type, 22 (MONDO:0032765).

    Gene identity. The stub carried no gene and MONDO records none, so identity was resolved outside MONDO. The ClinGen gene-disease validity table shipped in this repository (data/clingen/gene_validity.csv) has an exact row keyed on the MONDO ID: EPHB2 / HGNC:3393 / bleeding disorder, platelet-type, 22 / MONDO:0032765 / AR / Limited / Hemostasis-Thrombosis Gene Curation Expert Panel / 2024-09-04. That is an independent authority keyed on the same identifier, not a second MONDO read. The gene was then re-checked against kb/ under its own name rather than the numbered label: EPHB2 appears only in kb/groupings/Inherited_Platelet_Function_Disorders.yaml, in a notes list of known uncurated gaps, so no gene-named umbrella entry already covered it.

    Validity recorded in front, not in a footnote. ClinGen classifies EPHB2-BDPLT22 as Limited: two affected siblings in one consanguineous French family, with the panel calling the overall package borderline between limited and moderate and holding at limited for want of a second family. The genetic block therefore uses association: Limited ClinGen gene-disease validity with relationship_type: UNKNOWN, following the convention already established for Limited-validity genes in Arrhythmogenic_Right_Ventricular_Cardiomyopathy, since the enum has no Limited value.

    Mechanism. Eight pathophysiology nodes from the homozygous p.Arg745Cys kinase-domain variant through halved EPHB2 autophosphorylation to failure of the primary hemostatic plug. Four of them declare conforms_to against primary_hemostatic_plug_failure, entering by that module's signalling arm; just check-groupings now surfaces this entry as a candidate member of Inherited_Platelet_Function_Disorders, which is the self-completing behaviour that grouping was designed for. The entry is not added to the grouping's member list here - BDPLT12 is in the same state, so that sync is a separate pass.

    The mechanistic point the entry is built around is a dissociation, and it is sourced: the variant halves autophosphorylation while leaving ephrin-induced clustering intact, and the GPVI signalling failure is measurable without platelet-platelet contact. That is what places EPHB2 as a positive input to GPVI and GPCR signalling rather than as the contact-dependent adhesion molecule the classical Eph model would predict.

    Deep research. A falcon run was executed for this entry (research/Platelet-type_Bleeding_Disorder_22-deep-research-falcon.md, 1159 s). preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0032765, so the gene-identity discriminator could not run; that is UNCHECKED, not passed. The manual substitution check was therefore done by hand: EPHB2 is mentioned 52 times and is the top gene at 46 occurrences against AR=2, HP=2, MAF=1, GP6=1, the report names p.Arg745Cys and the correct OMIM number 618462, and no other platelet-disorder gene appears more than once. The report is about the right disease. Its own reference validation resolved 3 of 3 citations with a 0.0 confabulation rate and 3 of 3 on topic; term validation verified 33 of 35 with no unresolved CURIEs, one label mismatch on MONDO:0032765 itself where the template variable leaked the string 'if available', and two unverifiable Taxon-prefixed terms. No ontology term was bound from the report; every CURIE in the entry was verified independently against the repository term caches or OLS first.

    Things deliberately constrained. No prevalence figure (one family). The treatments section carries only what can be sourced: iron replacement, recorded for the sibling who became anemic from gastrointestinal blood loss, and the general inherited-platelet-disorder haemostatic repertoire, labelled in both its description and its notes as class-level guidance extrapolated to a disorder in which none of it has been tested. The deep-research report independently searched for BDPLT22-specific therapy, response-rate data and trial registrations and found none, which is why the extrapolation is stated as an extrapolation. The Normal Platelet Count phenotype carries no HP term and is deliberately left unwired to the pathograph, with the reason recorded in its notes: it is a negative finding constraining the differential, not a consequence of any node. No frequency band is given for the gastrointestinal bleeding, which affected one of the two siblings.

    Evidence. 33 snippets, all exact substrings of cached references, spanning PMID:30213874 (the founding Blood paper), PMID:33147934 (Nurden review, full text), PMID:25370417 (mouse EphB2 cytoplasmic-domain model) and the ClinGen CGGV assertion record. PMID:30409892, the Blood commentary on the founding paper, was fetched and found to have no retrievable content, so it was dropped rather than cited from its title.

    Orphan audit. Every downstream, sequelae and reports_on target was diffed against the node and phenotype names: zero orphans. The only items with no incoming edge are the trigger node, which is correct, and the deliberately unwired normal-count phenotype.

    Validation. just validate (32/33 verified with 1 skipped by prefix, because the extrapolated-treatment entry cites a DOI; re-run with --unskip-prefix DOI it is 33/33), validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-groupings, check-stubs, plus whole-KB check-title-snippets, check-snippet-length and check-snippet-grading.

  summary: Fix disease_term, term-slot placement and NSP4 snippet bridging
  details: |
    PR Shepherd round answering the deterministic findings of the 2026-10-22 review.

    disease_term was MONDO:0001166, which is nephritis; the label 'rotaviral enteritis' beside it was written from memory, so the binding was self-consistent in the file and wrong against the ontology. MONDO has no 'rotaviral enteritis' class (OLS, ontology=mondo, searched 'rotaviral enteritis' and 'rotavirus infectious disease'); the nearest term is MONDO:0005194 'Rotavirus infection', now bound, with the specificity carried in preferred_term. The cache row was re-derived by just validate-terms rather than typed.

    Three hard term errors fixed by moving terms to the slot whose enum admits them, not by changing the terms: FUT2 (hgnc:4013) and ANO1 (hgnc:21625) moved from gene_products, whose GeneProductTerm enum is NCIT-rooted, into genes; and GO:0005229 'intracellularly calcium-gated chloride channel activity', a molecular function, moved out of biological_processes into its own molecular_functions block, leaving the genuine process term GO:1902476 behind.

    Six snippets from the Morris and Estes NSP4 abstract (DOI:10.1152/ajpgi.2001.281.2.g303) were faithful verbatim quotes that failed verification because the source writes its own abbreviation gloss '([Ca2+]i)' inline and the validator strips bracketed spans from the query side only (issue #8597). Each is now bridged with ' ... ' across that gloss alone; no quoted wording was otherwise altered, and each retains the calcium term the claim rests on. The alternative fix, a literal_bracket_patterns entry for the Ca2+ span, was not taken: conf/reference_validator_config.yaml records that its patterns were chosen by replaying every bracketed snippet in kb/, so widening it has repo-wide blast radius and is a maintainer call rather than a shepherd repair.

    Three snippet failures are deliberately left in place, on PMID:32940644 (a shigellosis paper) x2 and PMID:37764167 (a cryptosporidiosis and giardiasis paper). Those are the references the review's item 4 requires dealt with, so making their quotes verify would have hidden the defect behind a green gate. The entry's evidence sourcing, the uncited host-genetics claim and effect_modifiers stratum, the absent deep-research artifact, and the Tetanus and Malaria evidence items remain open for the author.

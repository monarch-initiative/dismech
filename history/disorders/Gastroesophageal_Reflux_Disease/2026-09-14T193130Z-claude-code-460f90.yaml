  summary: 'Review round: split tight junction/DIS node, regrade evidence, wire pathograph,
    add reference titles'
  details: |
    Addressed the six blocking findings of the ai4c-reviewer CHANGES_REQUESTED review on PR #10667, which augmented this entry with a tight junction / dilated intercellular space (DIS) mechanism and a Na+,K+-ATPase beta1 gene therapy treatment, both sourced from PMID:42562993 (Schiralli Lester et al., Gene Ther 2026).

    1. reference_title. All four PMID:42562993 evidence items were missing it, while every other evidence item in the file carries one. Added the title copied verbatim from the title: frontmatter of references_cache/PMID_42562993.md rather than written from the abstract.

    2. evidence_source regrade. The DIS-hallmark snippet ("Dilated intercellular space (DIS) is a hallmark pathological feature of the esophageal squamous epithelium in individuals with GERD.") was graded MODEL_ORGANISM. The sentence is explicitly about humans, and in the cached full text it is the opening line of the introduction carrying citation marker [9] — background attributed to an earlier study, not a result of this paper. Regraded to OTHER and rewrote the explanation, which had claimed "confirmed through human histology and animal models" — a claim neither the tag nor the quote supported.

    3. Ontology binding. The biological process moved from GO:0034330 (cell junction organization) to GO:0120193 (tight junction organization), which is the node's actual subject. Confirmed present in cache/go/terms.csv (line 3203) and in cache/enums/biologicalprocessterm_dd47231dca51.csv before use, so it validates offline.

    4. Node atomicity. The bundled node "Tight Junction Disruption and Dilated Intercellular Spaces" joined a cause to its consequence with "and". Split into "Tight Junction Protein Loss" (CELLULAR) and "Dilated Intercellular Spaces" (TISSUE), joined by a DIRECT downstream edge. Evidence was routed to the claim each item actually supports: the human-biopsy snippet (HUMAN_CLINICAL) to the protein-loss node, the DIS-hallmark snippet (OTHER) to the DIS node. The treatment's target_mechanisms target was repointed from the deleted bundled name to "Tight Junction Protein Loss", since both quoted results are about restoring junction proteins and the DIS reduction follows through the new downstream edge.

    5. Pathograph wiring. The augmentation had added a node reachable only from the treatment. "Dilated Intercellular Spaces" now has a DIRECT downstream edge to the pre-existing "Esophageal Mucosal Injury" node, cited with the paper's own consequence sentence ("One consequence of the reduced barrier function and increased intercellular space ... resulting in cell injury, inflammation, and in turn, tissue repair."), graded OTHER for the same introduction/background reason as the DIS-hallmark quote. Both pathograph targets are bare names, not <kind>#<name> entity refs. No edge was added to "Barrett's Esophagus Metaplastic Adaptation": the paper's statement of that link is hedged ("it is believed that these cells ... generate BE") and per the evidence rules an uncited or weakly-cited edge was not worth manufacturing here.

    Reviewer suggestions also taken: the verbatim Greek character in beta1 is now used in all four snippets and in the surrounding prose (each snippet re-verified as an exact substring of the cache, not relying on the validator's Greek-letter normalization); the treatment description and a new notes: line record that the approach is preclinical (rabbit cardiomyectomy model plus cultured EPC1 cells, no human data, no trial registration), since it otherwise read as clinically available beside PPIs, fundoplication and LINX; GO:0005391 (P-type sodium:potassium-exchanging transporter activity, verified in cache/go/terms.csv and the molecularfunctionterm enum cache) was added to molecular_functions so the Na+,K+-ATPase claim in the prose is queryable; and PMID:42562993 was added to the top-level references: block with its exact cached title.

    Not done: the reviewer's non-blocking deep-research cross-check (an LPS-TLR2-IL-6-claudin-1 upstream axis and CLDN1/CLDN18 junctional genes from research/Gastroesophageal_Reflux_Disease-deep-research-falcon.md) is left for a follow-up PR, as it is outside this PR's scope and would need its own sources. The reviewer's alternative remedy for finding 2 — citing the primary source behind reference [9] and grading it HUMAN_CLINICAL — was not taken; that paper is not in references_cache and fetching it would widen the PR, so the OTHER grade the reviewer offered as the first option is used instead.

    Validation run on the edited file: just validate (schema, terms, references — passed, 23/23 snippets verified), just validate-terms (passed), just count-verified-snippets (23/23), just check-entity-refs (OK), just check-causal-targets (OK, no new broken targets), just check-duplicate-keys (OK), just validate-history on this record. Two unrelated references_cache files (PMID_38177402, PMID_38449873) were rewritten by the validator's network full-text fetch during the run and were reverted rather than committed, so this change stays confined to kb/ and history/.

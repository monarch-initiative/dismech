  summary: Cite evidence for 6 previously evidence-free environmental exposures
  details: |
    Issue 8296 tranche 1. Sources were located by PubMed search, cached with `just fetch-reference`, and every snippet was verified as an exact quote from the cached abstract. Added an EvidenceItem to each of the six `environmental:` exposures (Obesity, Hiatal Hernia, Smoking, Alcohol, Dietary Factors, Medications), which previously carried only a name and a one-line note. Two are graded PARTIAL to preserve real qualifications in the sources: the obesity meta-analysis (PMID:16952280) found the association only after stratification by country, and the evidence-based lifestyle review (PMID:16682569) supports the physiologic LES effect of dietary exposures while finding no published evidence that dietary avoidance improves GERD outcomes. Validated with `just validate`, `just count-verified-snippets` (18/18 for this file) and the batched `just validate-disorders` sweep.

  summary: 'Review round 1: record the sourced ranitidine caveat on the H2 antagonist
    treatment'
  details: |
    Applied the review's fourth suggestion on PR #15689.

    The 'H2 Receptor Antagonists' treatment binds famotidine and ranitidine, and this PR wires it to a module
    that deliberately leaves ranitidine unbound because NDMA contamination led to recalls and registration
    suspensions. The reviewer agreed that changing the agent roster does not belong in a module-wiring PR, but
    noted the two records now disagree, and offered either removing the agent or adding the evidence item.

    Took the second option. The treatment description now records that ranitidine is retained as curated, that
    the recalls mean it is not necessarily available, that the module leaves it unbound for that reason, and
    that whether to drop it is a clinical-content decision not made here. PMID:35696227 is added as
    treatment-level evidence, with its explanation saying it bears on the agent roster rather than on whether
    H2 antagonism treats this disease -- the claim the treatment itself makes.

    Removing ranitidine is left as a follow-up. It is another curator's clinical call recorded before this PR,
    and the caveat makes the record consistent and sourced without pre-empting it.


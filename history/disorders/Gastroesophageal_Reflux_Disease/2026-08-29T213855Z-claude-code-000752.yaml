  details: |
    # Evidence review: Gastroesophageal_Reflux_Disease.yaml

    ## Stats
    18 evidence items checked; 10 cached references read (all PMID); 18/18 snippets verified against cache after edits (`just count-verified-snippets`); 15 items verified clean; 3 items edited; 7 additional observations reported only.

    ## Findings
    1. pathophysiology / Esophageal Mucosal Injury (PMID:38177402, first item) — the snippet was the clearance sentence ("Reflux clearance mechanisms ... are critical to prevent mucosal damage."), which belongs to (and is also correctly used verbatim on) the neighboring Impaired Esophageal Clearance node; graded SUPPORT for a node it addressed only obliquely. Severity: DEFECT. ACTION fixed: replaced with the exact mucosal-injury sentence from the same cache ("Alterations of the oesophageal mucosal integrity, such as macroscopic oesophagitis or microscopic changes, determine the perception of symptoms.") and rewrote the explanation.
    2. pathophysiology / Gut Microbiota Dysbiosis (PMID:38449873, first item) — explanation claimed the MR study "establishes causal relationships" where the quoted result sentence says "suggested protective roles" / "emerged as potential ... risk factors". Severity: MINOR (explanation overreach). ACTION fixed: softened to "suggests causal relationships ... potentially protective and risk-associated groups"; snippet and SUPPORT grade unchanged.
    3. pathophysiology / Gut Microbiota Dysbiosis (PMID:38449873, second item) — explanation claimed the study "confirms a genetic basis for the gut microbiome's causal role" where the quote says the analysis "indicates a genetic link". Severity: MINOR (explanation overreach). ACTION fixed: reworded to match the quote's strength.
    4. pathophysiology / Lower Esophageal Sphincter Dysfunction (PMID:38177402, second item) — the mucosal-integrity quote does not bear on LES function; the item is honestly graded PARTIAL with a candid explanation, and after fix 1 the same sentence now also (correctly) supports the mucosal-injury node, leaving this item redundant. Severity: NOTE. ACTION reported only: removal would be restructuring; grade is honest.
    5. pathophysiology / Visceral Hypersensitivity (PMID:38177402) — quote ("The intensity of the symptoms is affected by peripheral and central neural and psychological mechanisms.") supports neural modulation of symptom intensity; SUPPORT for the specific hypersensitivity-with-minimal-acid-exposure claim is slightly generous (PARTIAL arguable). Severity: NOTE. ACTION reported only.
    6. pathophysiology / Gut Microbiota Dysbiosis — `evidence_source` is unset on both PMID:38449873 items, defaulting to HUMAN_CLINICAL; a bidirectional Mendelian randomization analysis of GWAS summary statistics sits between genetic epidemiology (HUMAN_CLINICAL) and in-silico inference (COMPUTATIONAL) under the repo's rules. Ambiguous, so not changed. Severity: NOTE. ACTION reported only for a curator ruling.
    7. evidence_source convention is inconsistent within the file: reviews PMID:28258452, PMID:29199166, and guideline PMID:34807007 are explicitly OTHER, while the reviews PMID:38177402 (5 items) and PMID:29195669, PMID:1591872 default to or carry HUMAN_CLINICAL. Defensible sentence-by-sentence (the quoted sentences report human physiology/experiments), so left unchanged. Severity: NOTE. ACTION reported only.
    8. environmental — all five snippet-bearing exposure items check out: PMID:16952280 (obesity meta-analysis, honestly PARTIAL with the US-stratification caveat), PMID:28258452 (hiatal hernia), PMID:1591872 (smoking/LES pressure), PMID:29195669 (alcohol, with the trigger-vs-cause caveat recorded), PMID:16682569 (dietary factors, deliberately PARTIAL because the same review found no outcome evidence for dietary avoidance). Severity: NOTE. ACTION reported only: exemplary honest grading. Obesity, Hiatal Hernia, Dietary Factors lack `exposure_term` bindings and no environmental entry declares `influences_mechanisms` (env-term audit scope, not evidence defects).
    9. Coverage gaps (not defects): all five phenotypes (Heartburn, Regurgitation, Dysphagia, Chronic Cough, Hoarse Voice), the biochemical Esophageal pH record, the genetic FOXF1/MHC records, and five of six treatments (all but PPIs) carry no evidence at all. Severity: MINOR (completeness). ACTION reported only: adding references is outside the review mandate.
    10. Term-binding observations incidental to the review: Heartburn is bound to HP:0410281 (Dyspepsia) and Regurgitation to HP:0002020 (Gastroesophageal reflux — essentially the disease term itself); both merit a look under the dismech-terms skill. Severity: NOTE. ACTION reported only (ontology scope, not evidence).
    11. Validation side effect: the prescribed `just validate` run re-fetched references_cache/PMID_38177402.md and PMID_38449873.md (frontmatter normalization + full-text attempt) via the repo's own tooling; no cache file was hand-edited. Severity: NOTE. ACTION reported only.

    ## Sections reviewed
    pathophysiology, phenotypes, biochemical, genetic, environmental, treatments, classifications, datasets, references

    ## Verdict
    The evidence that exists is in good shape — snippets are exact, mostly result-bearing sentences, and the environmental block in particular shows careful, honest PARTIAL grading with recorded caveats. The three fixes were one misattached snippet swapped for the on-claim sentence from the same reference and two explanations softened to match what the Mendelian randomization quotes actually claim. The entry's main weakness is coverage, not fidelity: most phenotypes, treatments, and genetic records are unevidenced, and the microbiota pathophysiology node rests on a single MR study.

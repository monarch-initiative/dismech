  summary: Conform GERD to the new h2_receptor_antagonism module
  details: |
    Wires this entry to the new h2_receptor_antagonism module (GPCR project, Workstream A).

    Adds one pathophysiology node, 'H2 Receptor Antagonist Occupancy of Gastric Parietal Cells', conforming to
    the module's trigger. It carries no downstream edge, which is the pattern used by every drug-occupancy
    conformer in this series: the relation to the mechanism below it is inhibitory, and a downstream edge
    would assert that antagonist occupancy causes the injury the drug is given to prevent. The entry models
    the drug rather than the mechanism, so it anchors at the trigger rather than at the module's key
    conformance target, the acid-secretion effector -- and this entry has no acid-secretion node of its own to
    anchor to, which is consistent with that choice rather than a gap introduced here.

    The existing 'H2 Receptor Antagonists' treatment is wired to the new node with an ACTIVATES
    target_mechanisms link, merged into the treatment's existing structure rather than added as a second
    block, and gains therapeutic_modality: SMALL_MOLECULE, which it lacked.

    Deliberately not changed: the treatment already binds ranitidine (CHEBI:8776), which the new module leaves
    unbound because of the NDMA recalls. Changing an existing agent roster is a clinical-content decision
    separate from wiring a module, and it is another curator's call recorded before this PR, so it is left
    alone and raised on the PR instead of altered here.


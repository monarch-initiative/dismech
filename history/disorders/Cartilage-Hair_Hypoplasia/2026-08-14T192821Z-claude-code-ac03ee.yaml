  summary: 'Address PR #8500 review findings'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED findings on PR #8500. Finding 1 (missing high-frequency phenotypes): added Short metacarpal (HP:0010049) and Coxa vara (HP:0002812, OCCASIONAL from 27 percent, 19/71) sourced to PMID:25764362, which was fetched for this purpose because the deep-research report flagged it as paraphrase-only; and Decreased total neutrophil count (HP:0001875) with no frequency band, since the sources describe single patients. The reviewer's fourth suggestion, Decreased circulating immunoglobulin concentration (HP:0004313) at 19 percent, was NOT added: the proposed supporting sentence describes symptoms of humoral immunodeficiency, a clinical category, not measured immunoglobulin concentration, and PMID:42170584 states directly that hypogammaglobulinemia is rare in CHH and that some individuals are hypergammaglobulinemic. Curated the supported phenotype instead, Decreased specific antibody response to vaccination (HP:0032140), carrying the contradicting quote as evidence so the distinction is recorded in the entry rather than only in the PR thread. Finding 2: added a clinical_trials block for NCT02383797 with the trial record fetched via just fetch-reference. Finding 3: added a negative growth-hormone treatment entry, but sourced to PMID:42170584 rather than to GeneReviews as the reviewer stated, because the cached GeneReviews record contains no growth-hormone statement; included the coexisting-GH-deficiency carve-out and the independent negative erythroid result from PMID:10690856. Suggestion 4 accepted: added gap_chh_hsct_effect_on_linear_growth, sourced to the reviewer-unmentioned but quotable sentence in PMID:42170584 recording two promoter-variant patients who normalized growth after transplant, rather than to the deep-research report's GeneReviews attribution which the cached record does not support. Suggestion 5 (anti-TNF for granulomas) declined: the cached GeneReviews record contains no TNF or granuloma text and PMID:42170584 describes rituximab and HSCT for CHH granulomas, so the claim is unsourceable from cached evidence. Also wired two previously dangling phenotypes (Scoliosis, Abnormal spermatogenesis) into the pathograph. Validated with just validate and just validate-disorders, both passing with 207/207 snippets verified against cached references; pathograph re-checked for a single root, no dangling phenotypes and no model-organism-only phenotype support; just check-title-snippets clean; compliance 86.1 percent global (383/445 fields, up from 352/445 in absolute terms).

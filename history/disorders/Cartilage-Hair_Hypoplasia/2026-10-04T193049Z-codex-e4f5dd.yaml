  summary: Review cartilage-hair hypoplasia mechanisms and clinical evidence
  details: |
    Reviewed the existing entry against its deep-research report, GeneReviews and cached primary literature, reading available full scientific texts, including the RNase MRP complex/ribosome, patient-cell cycle, small-RNA, chondrocyte, immune, lymphoma, lung, vaccine and recent clinical studies. Abstract-only sources remain qualified; supplementary files were not systematically reviewed. Full-text retrieval for PMID17701897 remained inaccessible, so its abstract was not treated as full-text evidence.

    Separated regulatory promoter effects, RNA abundance, transcribed-region variants and intact RNase MRP complex loss. Distinguished measured pre-rRNA/ribosome, mRNA turnover, G2, telomere and small-RNA findings from hypotheses about tissue consequences. Split thymic output, activated T-cell death and clinical immune dysfunction; qualified lymphoma, autoimmunity, airway, hair and enteric mechanisms. Revised the overview and knowledge-gap experiments to avoid causal conclusions unsupported by the cited experiments.

    Corrected numeric birth-prevalence bands and phenotype frequency denominators, added joint pain and neonatal respiratory observations, and incorporated the Brazilian founder cohort. Reworked HSCT/growth, GH, vaccination and exploratory sirolimus interpretation; added pulmonary, nutritional, pubertal and pregnancy/neonatal care. Moved malignancy screening to diagnosis, corrected immune testing and antiviral targets, and replaced unsupported differential citations with GeneReviews evidence. Kept anauxetic-dysplasia-specific care distinct from CHH.

    Added patient-derived chondrocyte, engineered K562 and primary mouse T-cell culture models and five verified datasets. Corrected G2 transit-time direction and zebrafish larval viability/proliferation/apoptosis interpretation. Registry NCT02383797 is UNKNOWN on live API, with last-known ACTIVE_NOT_RECRUITING status from 2019; protocol statements are separate from published clinical outcomes.

    Completeness cross-check: phenotype, spectrum/differential distinctions, mechanisms, treatment/trial, genetics, diagnostic/surveillance and high-value reference/dataset coverage addressed. No new disease subtype split was warranted. Validation: schema and ontology terms passed; 279 snippets and 296 titles matched cached sources before automatic tagging of the differential GeneReviews citation. All five datasets verified; all 477 snippets in six other consumers of refreshed shared references matched. Pathograph target check passed. Cache changes are fetcher-generated or validator normalization; no reference markdown was manually created or edited.

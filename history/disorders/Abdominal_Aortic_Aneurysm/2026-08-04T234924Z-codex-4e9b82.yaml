  details: |
    Full publication-readiness review of the Abdominal Aortic Aneurysm entry. Audited every claim-evidence pair for source type, polarity, snippet alignment, causal scope, and certainty; downgraded prospective circulating IL-6/MMP-9 associations from direct causal support to PARTIAL. Debundled progressive dilatation from rupture, added biological-scale tags, repaired pathograph connectivity, and supported the proposed ECM-degradation-to-VSMC-apoptosis edge explicitly. Cross-checked the existing Claude Code deep-research artifact and searched current disease-specific literature through 2026-08-04. Added the 2023 141-locus GWAS/polygenic architecture, a wired PCSK9/non-HDL susceptibility mechanism, and carefully scoped investigational PCSK9 inhibition (PMID:37845353); the 2024 platelet/GPVI intraluminal-thrombus mechanism, progression feedback, and soluble-GPVI biomarker study (PMID:38900973); 2024 ESVS and specific SVS ultrasound-surveillance guidance (PMID:38307694; PMID:29268916); the 2022 ruptured-AAA symptom meta-analysis, including low-certainty pain, syncope, hypotension, and pulsatile-abdominal-mass estimates (PMID:35220634); the negative underpowered 2025 randomized MetAAA trial (PMID:40311839); and the conflicting 2026 observational/Mendelian-randomization metformin signal (PMID:42487515). Added polygenic inheritance, smoking exposure, ultrasound imaging grounding, treatment modalities, and explicit limits on investigational GABA, PCSK9-inhibitor, and metformin claims. Scoped the entry to common degenerative AAA rather than conflating uncommon infected, inflammatory/IgG4-related, or syndromic etiologies. New references were fetched with just fetch-reference; no reference cache files were hand-edited. Targeted schema, term, reference/snippet, history, compliance, connectivity, and focused tests were run.

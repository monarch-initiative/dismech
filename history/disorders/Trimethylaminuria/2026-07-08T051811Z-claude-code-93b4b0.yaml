  summary: Create Trimethylaminuria (FMO3-related, WP-006)
  details: |
    First methylamine-metabolism new-entry increment for IEMbase WP-006 (#5561). Curated primary FMO3-related trimethylaminuria anchored to MONDO:0018767 / OMIM:602079 / ORPHA:468726. NEC preflight confirmed gene FMO3 (hgnc:3771), OMIM:602079, and ORPHA:468726 all match the MONDO term. Pathophysiology: impaired hepatic TMA N-oxidation -> TMA accumulation/excretion -> fishy body odour + psychosocial impact. Phenotypes: Fish odor (HP:0410020), Trimethylaminuria (HP:0003614), Depression (HP:0000716). Biochemical: increased urinary free TMA; reduced TMA-to-TMAO conversion capacity (<90%). Treatments: dietary precursor restriction, gut-flora antibiotics, activated charcoal. Evidence: PMID:9398858 (Dolphin 1997), PMID:21451776 (Mackay 2011), PMID:31240165 (Doyle 2019). All 23 evidence snippets verified as exact abstract substrings; schema and term validation pass.

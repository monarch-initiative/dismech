  summary: 'Round-4 review: separate the two H4K16 nodes, name the recurrent allele,
    add ADHD'
  details: |
    Addressed all four findings from the round-4 review on PR #9662. Each was verified against
    the cited source before acting; three were confirmed exactly as reported, and one had a
    correct diagnosis with an unusable prescription.

    Finding 1 (duplicate GO binding) - real, fixed differently than requested. Both the KAT8
    Loss of Function node and the Loss of Nucleosomal H4K16 Acetylation node carried
    GO:0046972 with LOSS_OF_FUNCTION, which does make them ontologically indistinguishable.
    The requested fix was to rebind the mark node to GO:0043984 (histone H4-K16 acetylation)
    in biological_processes with DECREASED. That term is obsolete, and its obsoletion comment
    states the reason: "This term was obsoleted because it represents a molecular function."
    Its three regulation terms (GO:2000618, GO:2000619, GO:2000620) are obsolete for the same
    reason. GO has therefore ruled that this concept is a molecular function, which is what
    the entry already encodes, and there is no live biological-process term to move it to.
    Separated the nodes by modifier instead: the enzyme node keeps LOSS_OF_FUNCTION
    (qualitative - missense substitutions impede the activity itself) and the mark node
    becomes DECREASED (quantitative - the mark is depleted from a lineage). That is the
    INCREASED/DECREASED versus GAIN/LOSS_OF_FUNCTION distinction CLAUDE.md already draws, and
    DECREASED is PATO-bound so the node stays queryable. Recorded the obsoletion and the
    reasoning in the node notes so the next curator does not retry the same rebinding.

    Finding 2 (recurrent allele is named in the cache) - confirmed and fixed. The variant
    entry asserted that the cached full text states the recurrence without naming the allele.
    That was false: PMID_31794431 line 508 reads "The recurrent variant in individuals T1, T2,
    and T3 alter Tyr90" and line 677 gives p.Tyr90Cys. Folded the standalone entry into the
    chromobarrel-domain class, which already names p.Tyr90Cys, so the same allele is no longer
    listed twice, and moved both recurrence evidence items onto it with the naming sentence
    added.

    Finding 3 (Intellectual Disability frequency) - confirmed and fixed. ID was VERY_FREQUENT
    on a snippet carrying no frequency information, while Global Developmental Delay from the
    same source sentence was deliberately FREQUENT. Regraded ID to FREQUENT and gave it the
    "frequently observed" sentence, which names intellectual disability directly. The notes
    record that deep research reports 9 of 9, which would justify VERY_FREQUENT, but that
    count lives in supplementary material the cache does not carry.

    Finding 4 (ADHD missing) - confirmed and added. Cache line 474 gives "1 individual
    displayed characteristics of attention deficit hyperactivity disorder", 1 of 9, bound to
    HP:0007018 at OCCASIONAL, mirroring the existing Autistic Behavior entry. Trimmed the
    borrowed ADHD clause out of that entry's description now that ADHD stands on its own.

    Validation: just validate (51/51 snippets verified, up from 49), check-entity-refs,
    check-duplicate-keys, validate-terms, check-not4curation, check-snippet-grading,
    check-snippet-length, check-title-snippets, check-folded-hyphens all pass.

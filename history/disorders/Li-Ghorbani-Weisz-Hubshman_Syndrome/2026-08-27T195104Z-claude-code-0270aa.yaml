  summary: Repair two badly-cut snippets; cite the NSL complex review
  details: |
    Two snippet repairs and one added citation.

    Repaired two snippets on the Loss of Nucleosomal H4K16 Acetylation node that were quoting
    badly. One began mid-word - "gest that KAT8 may act through both MSL and NSL complexes" -
    because the cached two-column text breaks "suggest" as "sug -\ngest" and the reference
    validator cannot bridge a hyphenated split. Starting the quote after the broken word
    gives a clean clause that verifies and reads as a sentence; the hedge it lost is already
    carried by supports: PARTIAL and by the explanation. The other quoted a fragment starting
    mid-sentence and carrying figure and citation markers - "MSL1 and MSL2 in KAT8 activation
    (Figure 8D, lanes 1-5) (55)." The full sentence turned out to be split by a clean line
    wrap rather than a hyphen, which the validator does normalise, so "MSL3 cooperates with
    MSL1 and MSL2 in KAT8 activation" verifies and is a proper sentence.

    Also removed a cache artefact from rendered prose: the node description had copied
    "neuro  epithelium" with the source's internal double space out of the snippet and into
    its own text. The snippet keeps it, because a snippet must be an exact substring and this
    one does not verify without it; the description now reads normally. The note explaining
    the artefact still stands.

    Cited PMID:31267707, which was fetched into the cache and left unused. It supports the
    NSL half of the node's dual-complex claim: mutations in other NSL complex members also
    cause human neurodevelopmental disorders, which is the pattern the KANSL1 and MSL3
    comparison depends on.

    Left uncited deliberately: PMID:17694080 is a Drosophila-focused MOF and dosage
    compensation review, too far from any claim this entry makes; PMID:37155735 reports the
    first selective KAT8 inhibitors, which is the opposite pharmacological direction from a
    loss-of-function syndrome and would be misleading cited here.

    Validation: just validate (49/49 snippets verified), check-entity-refs,
    check-duplicate-keys, validate-terms, check-snippet-grading, check-snippet-length,

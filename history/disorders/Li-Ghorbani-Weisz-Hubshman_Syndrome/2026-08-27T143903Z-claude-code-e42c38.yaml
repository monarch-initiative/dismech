  details: |
    De novo curation of Li-Ghorbani-Weisz-Hubshman syndrome (KAT8, MONDO:0033547) from the claim in issue #9621.

    Deep research: claude_code provider (falcon/Edison returned HTTP 402, key out of credit). The report validated clean (3/3 references resolved, 0 off topic) but was thin - only three references, which is what an ultra-rare disorder with roughly one substantive publication looks like. The bulk of this entry comes from direct PubMed E-utilities searching and from the full text of PMID:31794431, which is cached in full rather than abstract-only.

    No GeneReviews chapter exists for this disorder; the PubMed search returned nothing, so the Step 3b baseline does not apply.

    Six-node pathograph: KAT8 loss of function to loss of nucleosomal H4K16 acetylation to impaired NSPC expansion to aberrant neurogenesis with neuroepithelial apoptosis to cerebral hypoplasia.

    Judgement calls worth flagging:
    - Dual inheritance is curated as two Inheritance blocks, not one. Eight of the nine founding individuals had de novo heterozygous variants, but PMID:41347281 reports a homozygous variant segregating recessively in a consanguineous Pakistani family, and the founding study had already flagged one individual (T9) whose variants behaved differently. A KNOWLEDGE_GAP discussion sets out the residual-activity hypothesis that would reconcile the two and notes it is directly testable with the same assay the founding study already used.
    - The valproate treatment entry carries a mechanistic rationale (valproate is an HDAC inhibitor, so it might offset the acetylation deficit) but is deliberately hedged in both the description and a KNOWLEDGE_GAP discussion. Two responders is not a trial, nobody has measured H4K16ac in a treated patient, and valproate is a broad-spectrum anticonvulsant. The target_mechanisms evidence item is graded PARTIAL because the authors write "may ameliorate".
    - Autistic behavior graded OCCASIONAL (2 of 9), not treated as a core feature, despite appearing in the abstract's feature list.
    - Cardiac anomalies (4 of 9) curated as a phenotype so the entry does not read as purely neurological.

    Evidence-mechanics notes for a reviewer:
    - An evidence item citing PMID:17694080 was written and then removed. Its snippet was the article title, which is not a finding, and it contributed only nomenclature context.
    - Two snippets were re-quoted after `just validate-disorders` rejected them: the fast snippet counter tolerated spans crossing line breaks in the cached full text, but the authoritative validator did not. The replacements begin or end mid-word ("gest that KAT8...", "...brain MRI anom-") because the cached text hyphenates across lines and snippets must be exact substrings. The explanation fields say so.
    - One snippet was re-quoted to fix a check-snippet-grading divergence: the same summary sentence was graded HUMAN_CLINICAL in genetic[] and MODEL_ORGANISM on the animal-model link. The animal-model item now quotes a sentence about mouse Kat8 specifically.

    Validation: just validate-disorders passes (schema, terms, references), 39/39 snippets verified. Also clean on check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-empty-snippets.

  summary: Rebind the H4K16 acetylation node, fix inheritance evidence and GDD frequency,
    add founding variants
  details: |
    Correction round on PR #9662 in response to Cursor Bugbot's six findings. Four were correct and are fixed; one was already fixed; one is fixed differently from how it was reported.

    The acetylation node finding was correct and the fix goes further than the report. Loss of Nucleosomal H4K16 Acetylation was bound to chromatin organization (GO:0006325) with modifier DECREASED, in biological_processes. That was wrong twice over. The term is a broad parent process far above H4K16 acetylation, and the modifier ran the wrong way as biology: H4K16 acetylation opposes chromatin compaction, so losing it makes chromatin more compact, not less organised. Rebound to GO:0046972 histone H4K16 acetyltransferase activity, which names exactly the activity the variants impair. Because that is a molecular function it also moves from biological_processes to molecular_functions, which the report did not mention. The modifier is LOSS_OF_FUNCTION rather than DECREASED: the claim is qualitative, since the missense substitutions impede the acetyltransferase activity itself and not merely its level.

    The dominant-inheritance evidence finding was correct. The autosomal dominant block was supported only by a sentence describing individual T9's biallelic variants acting differently - which documents the exception, not the rule. The direct statement, that all except T9 carry heterozygous de novo variants, is now the supporting item. The T9 sentence is kept but regraded PARTIAL and re-explained as the boundary of the claim, so the exception travels with the rule instead of being discovered later.

    The GDD frequency finding was correct. VERY_FREQUENT rested on the phrase "frequently observed" with no count. Regraded FREQUENT with the reasoning in notes.

    The founding-variants finding was correct in substance. Three variant entries added: the chromobarrel-domain missense class (p.Tyr90Cys, p.Arg98Gln, p.Arg99Gln, curated as one entry because the study tests them as one functional class), the c.523A>T nonsense allele truncating at codon 176, and the recurrent de novo allele shared by three unrelated individuals. One correction to the report: it describes the recurrent allele as p.Tyr90Cys, but the cached full text states the recurrence without naming which allele it is, so no identifier is asserted - the entry says explicitly that the name is not in the source.

    The brain-malformation finding was correct. An Abnormal Brain Morphology phenotype is added, bound to the general HP:0012443 rather than to thin corpus callosum, heterotopia or ventriculomegaly. Those specific malformations are in the paper's supplementary figures and table, which the cached full text does not carry, so asserting them would be curating from a figure caption I cannot read. Graded OCCASIONAL because "several individuals" of nine gives no count and the companion sentence calls the defects variable. The notes record that splitting into specific malformations with counts is the right move if the supplementary table is obtained.

    The reference_title finding was already resolved in an earlier commit on this branch.

    Two mechanical notes. Merging the new GO-term rationale into this node produced a duplicate notes key, caught by check-duplicate-keys before commit and fixed by merging both blocks rather than dropping either. And several snippets from this paper end mid-sentence or mid-word: the cached full text is a two-column PDF extraction with frequent hyphenated line breaks, and the reference validator rejects line-spanning snippets, so the truncation is recorded in each explanation rather than left to look like carelessness.

    Validation: just validate-disorders passes, 48/48 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length.

  summary: 'Publication-readiness review: Autosomal Recessive Ataxia Beauce Type'
  details: |
    Publication-readiness review covering publication completeness and
    claim-evidence alignment. Full per-recommendation dispositions are recorded
    in review_notes on the entry itself.

    Baseline was already healthy: schema-valid, 100% recommended-field
    compliance, 46/46 verified snippets, no unconnected phenotypes. So this
    pass targeted content rather than structure.

    Completeness work:
    - Added has_subtypes for the three GeneReviews-defined presentations
      (cerebellar ataxia / childhood-onset multisystem / AMC) so severe-end
      features can be curated without leaking into the adult-onset Beauce
      founder phenotype.
    - Added 21 source-backed phenotypes: the component UMN signs (spasticity,
      hyperreflexia, lower limb hyperreflexia, Babinski sign), the component
      LMN signs (amyotrophy, reduced reflexes, fasciculations), oculomotor
      findings (square-wave jerks, jerky pursuit, strabismus), extracerebellar
      features (scoliosis, pes cavus, respiratory dysfunction), bulbar
      (dysphagia), attentional deficit, and the subtype-scoped severe-end
      features (intellectual disability, muscle weakness, decreased fetal
      movement, neonatal hypotonia, arthrogryposis, clubfoot).
    - Wired all 21 into the pathograph, clearing every
      local_phenotype_unlinked_to_pathograph finding. Routing was chosen per
      phenotype: cerebellar-explained findings hang off the degeneration node,
      motor-neuron component signs off the LINC node alongside the existing
      UMN/LMN umbrella edges, and severe-end plus extracerebellar features off
      the primary SYNE1 lesion with INDIRECT_UNKNOWN_INTERMEDIATES, since the
      cerebellar mechanism does not explain them.
    - Declared conformance to cerebellar_purkinje_degeneration at the
      Cerebellar Neuron Insult and Purkinje Neuron Degeneration nodes.
    - Tagged biological_scale on all three pathophysiology nodes.
    - Converted the free-text prevalence record to structured measure_type,
      prevalence_class, and rate_per_100000.
    - Added three differential diagnoses (ARSACS, Friedreich ataxia, primary
      mitochondrial disease).

    Claim-evidence alignment defects found and fixed:
    - The EMERGING synaptic-isoform hypothesis cited only a generic
      LINC-complex review whose quoted sentence never mentions an isoform. Now
      cites the primary source (PMID:25843669) for both the KASH-less
      cerebellar isoform and its mossy-fibre/granule-cell localization.
    - Dysarthria asserted "present in essentially all patients in the founder
      cohort", which no cited source states, together with an unjustified
      VERY_FREQUENT band. Description corrected; band retained but explicitly
      justified as a qualitative mapping with a note to revisit if a
      quantitative figure appears.
    - The FREQUENT band on upper motor neuron dysfunction is now tied to the
      source word "many" rather than left unexplained.
    - Component motor-neuron signs were deliberately curated WITHOUT frequency
      bands: the source quantifies the UMN and LMN arms as wholes, not the
      individual signs.
    - The prevalence record now states that 2.67/100,000 is a minimum
      founder-population figure, not a worldwide rate.

    New open question recorded (syne1_proximal_cerebellar_target): the entry
    asserts Purkinje-cell vulnerability and now conforms to a Purkinje
    degeneration module, but no cited source demonstrates Purkinje neuron loss,
    and the direct localization work puts the abundant cerebellar nesprin-1
    isoform at mossy-fibre glomeruli and granule-cell dendrites rather than the
    nuclear envelope. The mainstream annotations are retained but flagged, with
    three proposed experiments.

    D2P phenotype-completeness findings went 36 -> 19. The 19 remaining are all
    explicitly dispositioned as not-adopted in review_notes, with reasons. The
    largest cluster is peripheral neuropathy, which is deliberately NOT added
    because normal nerve conduction studies are part of how this disorder is
    defined and how it is separated from Friedreich ataxia and ARSACS.

    Validation: just validate passes; snippets went 46/46 -> 96/96 verified;
    just validate-graphs reports no findings for this entry;
    just compliance-connectivity reports no unconnected phenotypes.
    tests/test_data.py passes apart from a pre-existing, unrelated grouping FK
    failure in Hedgehog_Pathway_Holoprosencephaly that was fixed upstream in
    #8050 and is resolved by the rebase onto current main.

    Infrastructure issue surfaced, outside this entry: just refresh-orphadata
    fails a checksum check against the pinned manifest because upstream
    Orphadata has drifted. ORPHA:88644 therefore could not be cached, and
    Orphanet frequency rows were unavailable as evidence. This blocks
    Orphanet-backed frequency curation repo-wide. A cache file built from the
    unverified download was deliberately discarded rather than committed.

  summary: 'Create: Pan-Chung-Bellen Syndrome (FRYL)'
  details: |
    New entry for Pan-Chung-Bellen syndrome (MONDO:0975953, OMIM:621049), the autosomal dominant FRYL haploinsufficiency disorder. Entry type decided as DISEASE: MONDO records one causal gene and no descendants. Phenotypes and frequencies come from the founding 14-person cohort (PMID:38479391) and one prenatal case adding congenital diaphragmatic hernia (PMID:40864423). The pathograph runs from FRYL haploinsufficiency to impaired neuronal development (Drosophila furry evidence, tagged MODEL_ORGANISM and INDIRECT) and to disrupted organ morphogenesis (human cohort plus Fryl-null mouse kidney and zebrafish knockdown data), with every phenotype wired to one of those nodes. A KNOWLEDGE_GAP discussion records that FRYL's mammalian molecular mechanism (NDR kinases, Homer/YAP-Wnt, NOTCH1) is untested in development. Deep research: one openscientist report (18/18 references resolved; preflight-dr PASS, FRYL mentioned 73 times); its PMIDs were used as leads, and its 7-patient phenotype counts were not used because they disagree with the primary cohort paper. PMID:42430062 (FRYL plus SUPT16H case) has no PubMed abstract and is not cited. No GeneReviews chapter exists. Validated with just validate, validate-terms, count-verified-snippets (34/34), check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

  summary: 'Review round 1: add missing cohort phenotypes, diagnosis, CI fixes'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 15260. Added seven phenotypes quoted from the cached full text of PMID:38479391 and PMID:40864423, with HP terms looked up in OLS: structural brain abnormalities (HP:0012443, 2 of 6 imaged), jejunal atresia (HP:0005235) and microcolon (HP:0004388) from the gastrointestinal anomalies sentence, sternal anomalies (HP:0000766, non-union of the sternum and pectus carinatum), vertebral segmentation defects (HP:0003422, fetal case), horseshoe kidney (HP:0000085) and coagulopathy (HP:0001928). All but coagulopathy are wired from Impaired Neuronal Development or Disrupted Organ Morphogenesis; coagulopathy has no known mechanism and is left unwired. Impaired Neuronal Development gained a human structural-imaging evidence item. Added a diagnosis row for exome sequencing (NCIT:C101295) quoting the trio-sequencing methods and the prenatal exome case. Declined a short stature node: mean current height Z was -1.1 with no per-patient count below -2 SD, so HP:0004322 would overstate the source. Declined a treatments section: no disease-specific therapy exists. CI fixes: replaced two four-word snippets with the full source sentence, and grandfathered FRYL in tests/gene_activity_grounding_baseline.txt because GO's only molecular-function annotation for FRYL is protein binding (GO:0005515) and the founding paper states the molecular functions of mammalian Furry proteins are largely unknown.

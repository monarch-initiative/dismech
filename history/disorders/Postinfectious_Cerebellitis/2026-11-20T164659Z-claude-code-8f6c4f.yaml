  summary: 'The fulminant course: herniation, raised pressure, death and neurosurgical
    rescue'
  details: |
    Adds the severe end of the course. A new pathophysiology node, Brainstem Compression and
    Tonsillar Herniation (located in the brainstem, UBERON:0002298), sits beside the
    hydrocephalus phenotype off the swelling node: tonsillar descent on imaging in 8 of 9
    children seen by one neurosurgical service, in 11 of 15 of an acute cerebellitis series in
    which no child died, in both children of one two-child report and in a second two-child
    report that describes its pair together, and in a 12-year-old boy treated with a shunt. Its
    edge from the swelling node rests on a case report's background naming swelling,
    hydrocephalus and brainstem compression together, a review that gives herniation as a
    complication of the swelling, and that boy's CT, which shows the swollen hemispheres
    compressing the fourth ventricle and the brainstem. Its edge to a new Sudden death row is
    drawn through unknown intermediates: it carries the two of the three child deaths from
    cerebellitis that the cited sources report case by case that their cached abstracts
    attribute to brainstem involvement or failure, graded indirect because neither abstract says
    the dead child's brainstem was herniated or that the death was sudden, a later report's
    restatement that the 13-year-old who died suddenly had brainstem compression on imaging, and
    two case reports' statements that the disease can be fatal through herniation, hydrocephalus
    or brainstem compression. The Sudden death row (HP:0001699, scoped to the fulminant subtype)
    rests on the 13-year-old's report (direct), the 9-year-old's report and the three-child
    series' conclusion (indirect, since neither speaks of sudden death) and a series'
    introduction; its notes record why the term is bound (HPO's Death in childhood sits outside
    the phenotypic-abnormality branch) and that no cited source gives a death rate for the
    fulminant form in children. A new Increased intracranial pressure row (HP:0002516) rests on
    Orphanet, one series' definition, a review and the shunted boy, with an edge from the
    swelling node of unknown intermediates; a new Papilledema row (HP:0001085) rests on that
    boy's fundus examination and is left unconnected. The swelling node gains a review's
    statement that diffuse swelling is the most characteristic MRI finding of acute cerebellitis
    (PMID:12879984); its description now says, citing that review, that swelling is not confined
    to the fulminant tier and that mass effect is also reported in children whose reports do not
    call their disease fulminant, and drops the sentence that scoped it to the fulminant
    subtype; the immune-response edge into it now says what that review says. The
    swelling-to-hydrocephalus edge's description, which said no cited source describes how the
    outflow is blocked, is rewritten: the edge gains the review's statement that the swelling is
    often complicated by hydrocephalus (direct), one series' account of extrinsic compression of
    the aqueduct of Sylvius (graded indirect because the series does not say what compresses it)
    and the boy's CT (graded indirect because it gives the compression and the hydrocephalus
    together). The Encephalopathy row gains altered mental status in 4 of 9 children seen by the
    neurosurgical service, drowsiness among a series' commonest first symptoms (graded indirect)
    and that series' definition of the syndrome as an encephalopathy. The surgical row's
    description and notes are rewritten. It gains drainage in 4 of 9 children seen by the
    neurosurgical service, surgery for triventricular hydrocephalus in one child of another
    nine-child series, an emergency drainage case, the shunted boy's recovery and his authors'
    reading that the ventricular decompression saved his life, cerebrospinal fluid diversion in
    both children of a two-child report of the fulminant form, the one cited posterior fossa
    decompression with its outcome, a two-child report in which one child was drained and one
    was not and both recovered (graded indirect for the procedure), and two reviews' and a
    learning point's statements that drainage or surgery may be needed. It stays one row because
    its existing evidence covers both procedures together, and its notes now say that the
    three-child series is the only cited source with drainage at different times and different
    outcomes, and which of the cited reports call their patients' disease fulminant. A new
    progression phase, Outcome of the severe course, records the high risk of morbidity,
    mortality or death that three sources state, a pooled review's complete recovery in 69.2% of
    its 13 fulminant cases and its one death, an adult with a COVID-19-associated necrotising
    encephalopathy, and the outcomes of the children seen by the neurosurgical service. Older
    text the new sources made untrue or loose is corrected: the lumbar puncture notes, which now
    say that the cited sources do not settle whether swelling should stop the test and no longer
    assert a contraindication no cited source states; the tumour differential's description of
    the paediatric series; and the explanations of the PMID:29166939 item on the hydrocephalus
    edge and of the PMID:32160830 item on the surgical row. The Dysmetria row gains its source
    for being among the commonest findings (PMID:14552515). The review notes now give the
    reasons for the one frequency band, for the main counts left without a band (altered mental
    status, headache and vomiting in the children seen by the neurosurgical service, cerebellar
    atrophy and dysmetria at follow-up, and learning problems and cognitive deficits in two
    series too far apart for one band), and for the three unconnected phenotypes, and no longer
    call Encephalopathy the one non-cerebellar row. The review-notes paragraph holding these
    reasons was also rewritten by #18563, merged first; the version here keeps its sentences on
    cerebrospinal fluid cut-offs and adds the frequency sentences. Nine references are cached
    for the first time. Left out: a 1998 case report with a review of the literature
    (PMID:10726838), whose comparison of published children treated or not treated with
    high-dose steroids would need the steroid row reworded, and bradycardia, reported in a case
    with only subtle swelling. Validated with just validate, count-verified-snippets and the
    pre-PR gates.

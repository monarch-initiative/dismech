  summary: 'Edit: Postinfectious_Cerebellitis - tissue findings'
  details: |
    Adds a histopathology section with the three tissue findings the cited sources describe.
    Two are biopsies bound to NCIT Inflammatory Infiltrate (NCIT:C35978), which NCIT defines
    as acute, subacute or chronic inflammation in a tissue sample: a subacute, pathogen-free
    cerebellitis in a child who needed emergency posterior fossa decompression for
    herniation, and an inflammatory process, which its authors call possibly viral, in a
    15-year-old with pseudotumoral hemicerebellitis who needed a decompressive craniectomy
    and whose abstract reports no preceding infection. The third, bound to NCIT Lymphocytic
    Infiltrate (NCIT:C35983), is a Mycoplasma review's report of lymphocytic infiltration in
    the cerebellar tissue of a case it calls late onset, a timing term the review counts
    from the respiratory illness and that two further items from the review explain; the
    review reads cerebellitis as most likely the indirect, immune-mediated type. A case
    report's discussion that biopsy can be used for a definite diagnosis in rare
    circumstances explains why tissue reports are few. The pathogen-free biopsy is also
    added, graded INDIRECT, to the immune response node, and the two operated cases are
    added to the cerebrospinal fluid diversion and decompression row: the explanation of the
    row's earlier posterior fossa decompression item no longer calls it the only such case
    with an outcome, and the row's notes now say that two of its reports call the condition
    self-limiting. No step for T-cell infiltration or Purkinje cell loss is added: no cached
    source reports T cells or Purkinje cell loss in this disease's tissue. PMID:11490187, a
    fatal case cited for the death, says its paper includes histopathology and a post-mortem
    evaluation, which the cached abstract does not describe; it is the lead if its full text
    is ever cached. Validated with just validate, validate-terms and count-verified-snippets
    (355 of 355).

  summary: 'Review round: rescope the single-antigen sentence and except pericentrin'
  details: |
    Review round on PR 18506. The description of the pathophysiology node Autoantibodies Binding
    Neural Tissue said no single antibody is found in most patients, which a reader could take
    as contradicting the biochemical row Anti-centrosome antibodies, where antibodies to one or
    more centrosome antigens were found in 11 of 12 children with ataxia after varicella
    (PMID:14503922). It now says no study cited here found a single antigen targeted in most of
    its patients: in that study the commonest single antigen, PCM 1, was found in 6 of the 12.
    The next sentence said the centrosome antibodies are also found after varicella without
    ataxia, which read as including pericentrin, the one centrosome antibody the same study
    found in none of its comparison sera; it now says so. The reviewer's other suggestion, a
    quote_role on the case-definition item of the row Neural autoantibody panel in serum and
    cerebrospinal fluid, is not taken: the quoted sentence is the study's case definition, a
    methods statement that none of the three quote_role values describes, so no quote_role is
    recorded. Validation: just validate passes and all snippets verify.

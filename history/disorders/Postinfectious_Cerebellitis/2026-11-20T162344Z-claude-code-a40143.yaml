  summary: 'Differential diagnoses: stroke, infection, and passages narrowed to this
    disease'
  details: |
    Follow-up to #18521, which added the differential diagnoses and merged before its last
    review round could be pushed; this change carries that round. The stroke row now cites a
    Swiss population-based registry of 43 children with posterior-circulation arterial ischaemic
    stroke (PMID:31345132), in which ataxia and one-sided motor or sensory signs were the
    commonest clinical signs and most children presented with nonspecific complaints; a referral
    centre's series of 120 cases of acute ataxia (PMID:27071467), which lists cerebellar stroke
    among the causes without a frequency in its abstract; and the varicella series already cited
    (PMID:25063723) for the timing contrast between stroke, 2 to 26 weeks after the rash, and
    the other complications, a median of 5 days after it, graded indirect because the acute
    group pools every other complication. The row stays bound to the general stroke class and
    still says no cited source gives how often ataxia was the only sign. A new row, central
    nervous system infection (MONDO:0024619 central nervous system infectious disorder), cites
    the pooled analysis's 8.1% for infection and inflammation together (indirect), the referral
    centre's list of causes, the emergency-department review on lumbar puncture, one series' age
    comparison (indirect, as on the ADEM row), and the referral centre's report of cerebrospinal
    fluid pleocytosis in 40% of its patients with post-infectious cerebellar ataxia, so
    pleocytosis is not confined to infection. Passages narrowed to what the sources say of this
    disease: the mimicry sentence (no cited source shows a shared epitope in a patient with this
    disease); the autoantibody sentence (no single neural antigen targeted in most patients,
    beside antiphospholipid antibodies in 75% of children with post-varicella ataxia); the
    review note on cerebrospinal fluid cut-offs; the review note on population rates; and the
    entry notes' sentence on the kinds of cited source, which now names the gene-mutation and
    vestibular physiology studies and the disease's Orphanet record (ORPHA:624244, cited since
    an earlier change). Two references are cached for the first time (PMID:31345132,
    PMID:27071467), and the new binding adds two MONDO cache rows, one in the label cache and
    one in the disease-term enum cache. The round was checked before #18521 merged by an
    evidence check and a bindings-and-hygiene check, whose findings are applied. After the
    review, as the reviewer suggested, the pooled age comparison is dropped from the distinguishing
    features of the infection row and, for the same reason, of the acute disseminated
    encephalomyelitis row; both descriptions still state it. Validated with just validate,
    count-verified-snippets and the pre-PR gates.

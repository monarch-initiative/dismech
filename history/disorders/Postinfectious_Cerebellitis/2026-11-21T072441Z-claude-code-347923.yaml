  summary: 'Edit: Postinfectious_Cerebellitis - recovery by tier, relapse, atrophy
    and cognitive sequelae'
  details: |
    Gives recovery for acute cerebellar ataxia and acute cerebellitis, the fulminant tier
    keeping its existing phase, without treating the tier names as a prognostic ladder, as
    the entry's notes already say. The recovery phase now carries the one within-cohort
    comparison by tier, a systematic review of 73 published cases in which complete recovery
    was no higher in acute cerebellar ataxia than in the two severe tiers, with its
    denominators stated; a national Australian surveillance series, in which all 7 children
    followed to 12 months had reduced Liverpool Outcome Scale scores; and 35 adults with
    acute cerebellitis of any cause from one case report's literature review, half with
    neurological sequelae. It records as a pair, with their populations, an Italian series
    of 124 mostly benign-tier children in which abnormal admission imaging went with
    sequelae, and a series of 15 children with acute cerebellitis in which MRI did not
    predict the outcome.

    Two new phases, scoped to the ACA and AC subtypes, give the series cited for each tier.
    For acute cerebellar ataxia: complete recovery without sequelae in all 39 children of
    one series; complete recovery from ataxia in all the children with chickenpox and 39 of
    44 others in another, which also reports sustained learning problems in 5 of 60; and the
    Italian series' 5% with sequelae, a figure for the series, since the abstract does not
    give the tier. For acute cerebellitis, outcomes that range widely: complete recovery in
    8 of 9 children in one series, full recovery in 6 of 9 in another and in both children
    of a two-child report, residual ataxia in 4 of 15 at a median of 12 months, neurological
    sequelae in 5 and cognitive deficits in 6 of 11 children followed for an average of 4
    years and 4 months, and a favourable outcome (a modified Rankin Scale score of 2 or
    less, not a count of complete recoveries) in 24 of 36 children after a median of 3
    months, in a series whose case definition admitted antibody-positive children with a
    normal cerebellar MRI and in which the antibody-positive children did better; several of
    these sources count fulminant features as acute cerebellitis. The phase notes the two
    pairs of these reports that share authors, since their abstracts do not say whether they
    share patients. Two quotes moved from the recovery phase into these phases, one of them
    extended by the sentences around it. A new Relapse phase records the higher relapse rate
    with spinal fluid oligoclonal bands in one series, its advice for recurrent ataxia, and
    one boy whose ataxia improved and then worsened again after mumps and varicella.

    The cognitive sequelae row now gives its sources by tier and method: transient
    difficulties in a fifth and sustained learning problems in 5 of 60 after acute
    cerebellar ataxia; cognitive deficits on a parental questionnaire in 6 of 11, and memory
    difficulties in a 15-child series, after acute cerebellitis; cognitive impairment as the
    commonest residual deficit in a neurosurgical series; and neurocognitive sequelae in a
    minority after hemicerebellitis. The cerebellar atrophy row adds a review of acute
    cerebellitis and a review of hemicerebellitis. All sources were already cached.
    Validated with just validate, validate-terms and count-verified-snippets (399 of 399).

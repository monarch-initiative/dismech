  summary: Add the autoantibody branch and a biochemical section for the antibodies
    found
  details: |
    Adds an Autoantibodies Binding Neural Tissue node (molecular scale, bound to immunoglobulin
    production), reached from the immune response node by a new edge and with no edge onward,
    because whether any of the antibodies injures the cerebellum is not settled; the existing
    controversy on glutamate receptor delta 2 now attaches to the new node as well, and gains a
    review's report that rabbit antibodies against the receptor caused transient ataxia in mice
    (PMID:26377184, graded indirect). The edge cites, both graded indirect, the conclusion of a
    serology study of children with ataxia after varicella (PMID:11097523) and a case report
    reading the antibody as a product of the response to Epstein-Barr virus (PMID:23892968). The
    node cites a review's tally that every reported case of cerebellar ataxia with antibodies
    against glutamate receptor delta 2 followed or accompanied an infection or vaccination and
    none had a tumour (PMID:26377184), pericentrin antibodies in 5 of 12 children after
    varicella and in none of the comparison groups (PMID:14503922), and 10 of 36 children with
    acute cerebellitis antibody-positive in a multicentre series (PMID:38284996). Antibodies
    against GAD65 are left out, and the node's notes say why: the immune-mediated cerebellar
    ataxia review already cited on the immune node counts GAD65 antibody-associated ataxia as a
    separate disease. A new biochemical section holds five rows, each with a readout to the new
    node: the glutamate receptor delta 2 antibody (three case reports and the review);
    anti-centrosome antibodies, found nearly as often after uncomplicated varicella, so not
    specific, with the abstract's and the results section's differing counts noted; the
    pericentrin antibody, with the tissue-staining result graded in vitro; the anti-GQ1b
    antibody, from one adult case whose authors extend the anti-GQ1b antibody syndrome to
    isolated cerebellar ataxia, and an all-cause acute ataxia series listing it among common
    markers (PMID:40787651, PMID:41321459); and the neural antibody panel of the multicentre
    series, bound to NCIT autoantibody measurement, whose notes say why its 28% is not an
    unselected rate. The five sentences that counted sources are rewritten without counts, in
    the same words as PR 18503 so that the two merge cleanly, and that PR's correction of the
    PMID:29166939 explanation is carried here too. Two more are narrowed: review_notes no longer
    says the cerebrospinal fluid findings in the cited series correlate with nothing (they are
    reported without cut-offs, and the multicentre series relates antibody status to outcome),
    and the plasma exchange row now says no cited source reports how many received it in this
    disease, adding the review's passing statement, graded indirect, that it had a therapeutic
    effect in individual patients. Five new caches are committed. Validation: just validate
    passes, all snippets verify, term validation passes, and the targeted gates pass.

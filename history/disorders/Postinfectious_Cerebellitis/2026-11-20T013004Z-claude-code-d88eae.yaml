  summary: Add differential diagnoses for acute ataxia in a child
  details: |
    Adds a differential_diagnoses section with nine rows for the causes of acute ataxia in a
    child that the cited sources set beside postinfectious cerebellitis: drug or toxin
    intoxication (MONDO:0029000 poisoning), posterior fossa tumour (MONDO:0037736 infratentorial
    neoplasm), opsoclonus-myoclonus syndrome (MONDO:0015247), acute disseminated
    encephalomyelitis (MONDO:0019383), Miller Fisher syndrome (MONDO:0005851), stroke
    (MONDO:0005098 stroke disorder), inherited episodic ataxia (MONDO:0016227 hereditary
    episodic ataxia), vestibular ataxia (MONDO:0100312) and paraneoplastic cerebellar
    degeneration (MONDO:0044877). Each row lists the features the cited sources use to tell the
    condition apart, and says where they give none (intoxication, stroke) and where a feature
    does not separate it: headache, vomiting, ataxia and obstructive hydrocephalus, which acute
    cerebellitis shares with a tumour, though a tumour's history runs to weeks; anti-GQ1b
    antibodies, found in an isolated cerebellar syndrome after infection; recurrence, seen in
    postinfectious ataxia as well as in episodic ataxia; hearing loss, which pointed to a
    central lesion in one case of vertigo. The paraneoplastic row describes the anti-Yo form,
    its most common variant, which is what most of its sources cover. Frequencies come from a
    pooled analysis of 1,167 children from eleven studies (PMID:41325013), series of 76, 88, 99
    and 257 children with acute ataxia (PMID:38008790, PMID:36462247, PMID:38000948,
    PMID:41321459), a series of 15 children with acute cerebellitis (PMID:32160830), a series of
    389 children with opsoclonus-myoclonus syndrome (PMID:28959231), a prospective UK study
    cited in a review of the syndrome (PMID:35260471) and a systematic review of 379 patients
    with anti-Yo antibodies (PMID:36334195); a figure for a wider group than the row's condition
    is graded indirect. Six references are cached for the first time: PMID:41325013,
    PMID:23683541, PMID:27789117, PMID:31327588, PMID:36462247 and PMID:38000948. The stroke row
    has a note on its binding, since MONDO has no human cerebellar stroke class. No row was
    written for central nervous system infection or inflammation, the pooled analysis's third
    commonest category, or for metabolic causes, nor for the other differentials the research
    report names, such as transverse myelitis, myositis, functional and post-ictal ataxia,
    Guillain-Barré syndrome itself, Bickerstaff brainstem encephalitis and Borrelia infection.
    Outside the new section, sentences the new references made false are narrowed: four say the
    rodent-model steps are not shown in a patient with this disease, rather than in any patient;
    one says no cited source reports a randomised comparison in this disease; and four mentions
    of the largest paediatric series, which was already not true of the cited series, now say a
    multicentre paediatric series. Four sentences about that series are also brought into line
    with what it reports: children with a higher clinical score on admission were more likely to
    receive intravenous steroids, and its cerebrospinal fluid findings did not correlate with
    symptoms or clinical outcome. Four passages that the new references also bear on are changed
    by open changes to this entry and are left as they stand here: that molecular mimicry is
    named nowhere in the entry's references (#18503), now that the Guillain-Barré and ADEM
    reviews name it for those diseases; that no source states a cerebrospinal fluid threshold
    and that no cited source gives a prevalence rate (#18506, #18503); and the shared notes
    paragraph's description of the cited studies (#18503, #18506, #18509). The change carries,
    byte for byte, the count-free rewording that #18503, #18506 and #18509 make in seven
    passages, where a count of cited sources would change whenever a source is added. Validated
    with just validate, count-verified-snippets (all snippets verified), validate-terms and the
    pre-PR gates.

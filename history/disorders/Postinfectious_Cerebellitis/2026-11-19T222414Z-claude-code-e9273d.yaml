  summary: Add the herpesvirus triggers and varicella vaccination as environmental
    rows
  details: |
    Adds an environmental section with five rows, each linked to the Preceding Infection node,
    which carries the existing link on to the immune step. Varicella-zoster virus infection
    (TRIGGERS, causal role component cause): chickenpox preceded 15 of 45 cases in Dutch
    prospective surveillance, which also estimates 5 cases per 100,000 infections in children up
    to 5 years (PMID:19186201); acute cerebellar ataxia was the commonest of the neurological
    complications in 84 children admitted to one children's hospital with complications of the
    virus (PMID:25063723, graded indirect because the series may include infections of the
    cerebellum itself); a quarter of 73 consecutive children in a 1994 series had chickenpox
    (PMID:8210223). The row binds the generic ECTO virus-exposure term because ECTO has no
    varicella-zoster term; the searches are recorded in its notes. Epstein-Barr virus infection
    (TRIGGERS, component cause): one of 39 children in a two-centre series (PMID:14552515), 5 of
    73 pooled patients (PMID:42649322), 2 of 194 Polish children with the infection
    (PMID:26933545, a commentary, graded indirect), and two adult case reports in which the
    virus was found in the blood while testing of the cerebrospinal fluid was negative
    (PMID:31905189, whose authors favour a post-infectious reading; PMID:27558189, graded
    indirect). Cytomegalovirus and human herpesvirus 6 infection carry causal role associated
    only and links with no effect predicate: one of 15 children in a single-department series
    (PMID:32160830) with a systematic review's potential association (PMID:38549138), and one
    child co-infected with adenovirus (PMID:25425177). Varicella vaccination (PROTECTS_AGAINST,
    no causal role recorded) has three link quotes, all graded indirect: the Dutch projection
    from 5 cases per 100,000 infections against 0.15 reports per 100,000 vaccine doses, whose
    per-dose source the abstract does not give; a fall of about 60% in varicella-associated
    neurological complications in Bavarian children's hospitals after universal vaccination
    (PMID:27749651), in which ataxia was 3.1% of the complications and was not shown falling on
    its own; and the Australian authors' conclusion that varicella is an infrequent cause in a
    vaccinated population (PMID:35546546). The new sources made some sentences elsewhere false,
    and they are changed. Five sentences that counted sources (the immune node's count of
    sources naming an immune mechanism, the hydrocephalus edge's count of sources asserting it,
    the hydrocephalus row's count of sources using the words obstructive hydrocephalus, the
    steroid row's count of sources never mentioning a steroid, and the entry-level notes on
    source types, abstracts and the single surveillance series) are rewritten without counts, in
    words shared with the other open edits of this entry so that they merge cleanly. Six more
    are narrowed: the Preceding Infection edge no longer says molecular mimicry is named nowhere
    in the references (one case report names molecular mimicry and another antibodies that
    cross-react with cerebellar epitopes, both in their discussions and without testing it); the
    prevalence notes, a prevalence explanation and review_notes no longer say no cited source
    gives a population rate (the Dutch estimate does, but its abstract does not give the period
    the rate covers, so it is not recorded as a rate); the antiviral note now says no cited
    source reports an outcome for antivirals separable from the steroids given with them; and
    the progression latency explanation now says the 8.8-day figure is the only series-level
    figure for this syndrome's interval, and that the nine-day case followed a respiratory
    infection rather than varicella. One error already on main is corrected: the explanation on
    the hydrocephalus row's quote from PMID:29166939 called it one of the sources that use the
    words obstructive hydrocephalus, which its cache does not. Eight new caches are committed.
    Validation: just validate passes, all snippets verify, term validation passes with three new
    ECTO rows, and the targeted gates pass.

  summary: 'Edit: Postinfectious_Cerebellitis - immunoglobulin, plasma exchange and
    the untested second-line immunotherapies'
  details: |
    Adds the evidence on intravenous immunoglobulin and plasma exchange. The immunoglobulin
    row now cites how often it is given (19 of 73 pooled patients, and 8 of 15 and 6 of 9
    children in two acute cerebellitis series, nearly all of whom also had steroids); a
    case-based systematic review of cerebellitis after COVID-19, which says immunoglobulin
    is prescribed when corticosteroids fail and that all of those cases improved, and calls
    its efficacy unconfirmed; and three single cases that point different ways: the first
    child reported with glutamate receptor delta2 antibodies, as a review of Purkinje cell
    antibodies recounts, whose symptoms immunoglobulin and methylprednisolone did not
    ameliorate (graded REFUTE); a 6-year-old boy with influenza A, on oseltamivir, whose
    ataxic gait resolved within 13 days of presentation, with immunoglobulin given on day 4,
    and whose authors read his illness as active infection although influenza was not found
    in his cerebrospinal fluid, which puts him at the entry's border; and a 22-year-old
    woman given immunoglobulin with no other treatment named, who improved and whose authors
    read the case as extending the anti-GQ1b antibody syndrome. The review's statement that
    all cases of cerebellar ataxia with glutamate receptor delta2 antibodies were preceded
    or accompanied by infection or vaccination is cited for the trigger. The corticosteroid
    row gains the same first child, the review's second patient, who recovered after
    methylprednisolone, and its third, whose ataxia improved spontaneously (graded
    NO_EVIDENCE for the drug), and a series of 15 children with acute cerebellitis, 14 given
    steroids, whose authors suggest that steroids can increase the chance of recovery
    (graded INDIRECT: they reason from the absence of deaths, not from a comparison).
    Immunoglobulin is linked to the immune response node with the target inferred from the
    drug class, and plasma exchange with the target inferred from the procedure, both graded
    INDIRECT, as the corticosteroid link already was. The plasma exchange row now gives its
    indication in the source's words, refractory cases.

    Three statements of the existing text are corrected. The immunoglobulin row said that
    the 8 children given immunoglobulin in the 15-child series were among the 14 given
    steroids, which the abstract does not say; it said the anti-GQ1b woman was given
    immunoglobulin alone, where her abstract only names no other treatment; and the plasma
    exchange row's explanation pointed to a sentence of the immune-mediated cerebellar
    ataxias review that the entry did not cite anywhere, which is now cited on the plasma
    exchange link.

    A new knowledge gap asks whether immunoglobulin or plasma exchange adds anything to
    corticosteroids; the three single cases and the COVID-19 review are graded INDIRECT
    there. Its notes record a ClinicalTrials.gov search on 21 November 2026 that found
    no interventional trial whose conditions name this disease or a post-infectious
    cause; the three searches were run again before the push and returned the same
    trials. All sources were already cached. Validated with just validate,
    validate-terms and count-verified-snippets (366 of 366).

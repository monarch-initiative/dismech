  summary: Add imaging findings for the tiers, one-sided disease, enhancement and
    follow-up atrophy
  details: |
    Adds an imaging_findings section with five MRI rows. Normal neuroimaging in acute cerebellar
    ataxia (subtype ACA): a review's statement that the mildest cases have normal imaging, with
    its note of considerable overlap between the tiers (PMID:22805251), and two opposite views
    on whom to image, only atypical or non-improving cases (PMID:14552515) or every child at
    admission (PMID:28606112), all three graded indirect for this row. Bilateral T2
    hyperintensity and swelling of the cerebellar cortex, bound to HP:0030915 Cerebellar edema,
    located in the cerebellar cortex and marked diagnostic because the entry defines the acute
    cerebellitis tier by imaging and a review of adult cases makes brain imaging a requirement
    of the diagnosis (PMID:29166939, graded indirect): bilateral symmetrical change with
    swelling, and tonsillar herniation in 11 and obstructive hydrocephalus in 4 of the same 15
    children (PMID:32160830); grey-matter T2 signal as a strong indication of the diagnosis in
    two patients (PMID:11826604, graded indirect); abnormal imaging at the severe end
    (PMID:22805251, graded indirect, with its prognostic ordering noted as not borne out by the
    pooled review); and the two series that point different ways on prognosis while comparing
    different things, an abnormal MRI or CT going with sequelae in 124 Italian children who were
    nearly all in the benign tier (PMID:28606112), against MRI not predicting outcome among 15
    children with acute cerebellitis (PMID:32160830). Swelling of one cerebellar hemisphere
    (hemicerebellitis), bound to the same HPO term, located in the cerebellar hemisphere and not
    marked diagnostic, because the appearance can mimic a tumour: a review of 35 cases
    (PMID:24423631), a neurosurgical review that calls MRI the key to the diagnosis
    (PMID:23958482), and a primary case with left cerebellar swelling (PMID:17008044).
    Cerebellar atrophy on follow-up MRI, bound to HP:0001272: 9 of 12 children rescanned
    (PMID:32160830) and a review linking follow-up structural change with long-term sequelae
    (PMID:29888646, graded indirect). Leptomeningeal enhancement (subtype AC), bound to
    HP:0032070: a systematic review's framing of the tiers (PMID:42649322) and one case of
    meningeal enhancement (PMID:17049194, graded indirect because it does not say
    leptomeningeal). The MRI diagnosis row now says the prognostic weight of an abnormal scan is
    unsettled, and its Lancella explanation says the 15-child series disagrees. One sentence the
    new sources made false is narrowed: review_notes no longer says no source joins the
    inflammatory injury to later atrophy, since the hemicerebellitis review finds atrophy on the
    same side in up to half of cases. The six passages that counted sources are rewritten
    without counts, in the same words as PR 18503, which also carries the correction of the
    PMID:29166939 explanation. Three new caches are committed. Validation: just validate passes,
    all snippets verify, term validation passes with new UBERON and enum rows, and the targeted
    gates pass.

  summary: Further triggers, vaccination before onset, and the border with direct
    infection
  details: |
    Adds the triggers beyond the herpesviruses already curated, vaccination before onset, and
    the border with direct infection. Five environmental rows. Influenza A virus infection
    (ECTO:3000107) is graded as an association: a pooled review counts influenza among the
    identified triggers (5 of 73), a hospital series found it in one child of 15, and case
    reports list influenza A and B among the reported possible triggers, but both cited
    influenza case reports read their own case as active or direct infection (a 6-year-old read
    as active infection, graded indirect against the post-infectious reading, and an adult with
    the virus in her cerebrospinal fluid read as acute influenza cerebellitis). SARS-CoV-2
    infection (ECTO:3000173) is graded as a trigger: a pooled review's 24 of 73, a case-based
    review's mean interval of about 15 days and its post-infectious framing (graded indirect,
    since its 18 cases are mixed cerebellar syndromes), a case nine weeks after the infection
    that its authors suspected to be post-infectious and autoimmune, and six children, three of
    one centre and three from the literature, with onset during the infection. Mycoplasma
    pneumoniae infection (ECTO:3000220) is graded as a trigger: 5% of 39 children, Orphanet's
    statement on adults, one child of 15, a systematic review of movement disorders with the
    bacterium (graded indirect for this disease), and a review classing cerebellitis, as most
    likely, among the indirect, immune-mediated manifestations. Mumps virus infection
    (ECTO:3000001, since ECTO has no mumps term) is graded as a trigger on one series (20% of 39
    children, and the longest course). Vaccination before onset (ECTO:2000129) is graded as an
    association: 3% of 73 children, a case report after a meningococcal B vaccine whose review
    of six published cases, among them reports after meningococcal C and varicella vaccines,
    gives a mean interval of 6.8 days and judges causality unproved, and the Dutch and
    Australian national findings against. A paragraph of the entry notes describes cases with
    the pathogen in the cerebrospinal fluid as the border of the entry's scope. Older sentences
    the new sources make untrue are corrected. The edge from the infection to the immune
    response now says that no cited source shows a shared epitope in a patient with this disease
    (the review of Mycoplasma pneumoniae names mimicry for the class of neurological
    manifestations that includes cerebellitis, without showing it in cerebellitis), the
    narrowing #18563 also makes in the same sentence, and no longer counts two case reports
    naming a route: three name one (molecular mimicry, or antibodies cross-reacting with
    cerebellar antigens) in their introductions or discussions, and none tests cross-reactivity.
    The corticosteroid row and its discussion now give the COVID-19 child series'
    treated-against-untreated contrast as well as the fulminant case report's, and both cite
    each source's own sentences for its contrast, graded indirect: the series because those
    children's onset during the infection puts them at the border of this disease, the case
    report because its abstract does not name the immunomodulatory therapy it compares. The
    corticosteroid row's note on antivirals now records the antiviral outcomes reported in
    single influenza and COVID-19 cases, several at the border with an infection of the
    cerebellum, and the COVID-19 review's reading that remdesivir alone may be insufficient or
    the disease severe; no other cited outcome of an antiviral is separable from the treatment
    given with it. The latent-interval explanation names the reviews' means beside the one
    series' figure. Ten references are cached for the first time, and two ECTO terms add one row
    each to the label and exposure-term enum caches. Left out: an encephalitic influenza case
    with no reading (PMID:38991160), a Mycoplasma meningoencephalitis in an adult
    (PMID:40547937), a risk-factor study whose definition includes surgery and head trauma
    (PMID:34089111) and a review of infections of the cerebellum (PMID:25439297), none of them
    cached; a 2023 Tunisian paediatric series and case reports of rotavirus, dengue, parvovirus
    B19, Salmonella Typhimurium and Streptococcus pyogenes, named in the deep-research report
    without a cached record; and further infections named only in the sources' introductions or
    discussions, Borrelia among them, which the report names only as a differential. Validated
    with just validate, count-verified-snippets and the pre-PR gates.

  summary: Classifications, mappings from the Orphanet record, and epidemiology
  details: |
    Adds three sections, two prevalence records and count-free wording for four passages.
    Classifications: the neurologic part of Harrison's. Mappings: the MONDO class this entry
    binds, as the exact match that Orphanet's record for ORPHA:624244 also gives; and ICD-10-CM
    G04.8 Other encephalitis, myelitis and encephalomyelitis as a broad match, taken from the
    same record, which lists the WHO ICD-10 code with the relation Narrower; the note says that
    in ICD-10-CM the code is a subcategory with three children. Epidemiology: age at onset, from
    Orphanet's age of onset (all ages) and its statement that the disease mainly affects young
    children and sometimes adults, two paediatric series (a mean of 4.8 years in 39 children
    with acute cerebellar ataxia, PMID:14552515, and a median of 9.5 years in 15 with acute
    cerebellitis, PMID:32160830), a series of children with acute ataxia in which acute
    cerebellitis began later than acute postinfectious cerebellar ataxia (PMID:41321459), and a
    systematic review's 73 pooled patients aged 7 months to 74 years (PMID:42649322); and
    disease in adults, from Orphanet and a literature review of 35 adult cases with a median age
    of 36 years and no cause found in 34% (PMID:29166939). Prevalence: two records for
    Orphanet's annual incidence and point prevalence classes, both unknown. Because the Orphanet
    record is a new cited source, four passages that counted the cited sources (an immune
    mechanism, the hydrocephalus association, steroids, and the study types in the entry notes)
    take count-free wording, the same text word for word as the other changes to this entry in
    progress. The Orphanet record is cached for the first time; the other sources were already
    cited. Validation: just validate passes, all 99 snippets verify, and the targeted gates
    pass.

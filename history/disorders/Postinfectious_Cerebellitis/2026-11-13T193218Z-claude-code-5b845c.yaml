  summary: 'Create: Postinfectious Cerebellitis'
  details: >-
    New entry for postinfectious cerebellitis (MONDO:0850107), curated by hand from the twenty cached references it cites, and replacing the stub, which this PR
    deletes.


    The entry is organised around the severity spectrum the field uses, because that is what the
    sources classify by: acute cerebellar ataxia, acute cerebellitis and acute fulminant
    cerebellitis, recorded as three has_subtypes rows with classification severity_tier. The tier
    names are a severity classification and not a prognostic ladder, and the pooled data do not
    order the way the names suggest - complete recovery was lowest in the benign tier, 58.8% against
    69.2% in the other two. The entry says so rather than letting the labels imply an ordering.


    The pathograph runs preceding infection, immune response directed at the cerebellum, microglial
    activation and TNF-alpha release, Purkinje cell intrinsic hyperexcitability, cerebellar
    dysfunction, with a second arm out of the immune response to cerebellar swelling and mass effect
    that carries the fulminant tier's hydrocephalus. Eleven phenotype rows sit below it and nine of them are causally connected: six off cerebellar
    dysfunction and three off the swelling arm. Encephalopathy and cerebellar atrophy are left
    unconnected on purpose, and the review notes say why.


    The middle of that chain is rodent work and the entry does not hide it. Microglial activation
    through TLR4, TNF-alpha release and the change in Purkinje cell excitability are each shown in
    rat or mouse cerebellum, graded MODEL_ORGANISM or IN_VITRO, and none is shown in a patient by
    any cited source. That is recorded on the edges and again as a HUMAN_MODEL_MISMATCH discussion,
    because the authors of the model say in terms that their animals were not ataxic while the human
    disease is defined by ataxia, and they name the gap as a gap.


    Two further discussions. A CONTROVERSY on the anti-glutamate-receptor-delta2 autoantibody, which
    two case reports read in opposite directions - one as a cause, one as a consequence of
    cerebellar damage - which is why the immune-response node names no effector. And a KNOWLEDGE_GAP
    on corticosteroids: three quarters of pooled patients receive them, no cited source compares
    them against no treatment, and the largest paediatric series reports that the children who got
    intravenous steroids were the ones with the higher clinical score on admission, so its outcome
    data are confounded by indication. That series closes by asking for randomised trials.


    Denominators are named wherever a number appears, because the sources differ in kind and the
    shares differ with them. A pooled review of published cases over-represents the severe ones; a
    hospital series counts who reached that hospital; a prospective surveillance network counts
    cases as they arise. The fulminant tier is 17.8% of the pooled literature and 10% of the
    surveillance series, and both figures are recorded with their source. No prevalence rate is
    recorded at all: no cited source gives one, and the case-mix fractions that exist are recorded
    as case-mix fractions.


    Treatments are corticosteroids, intravenous immunoglobulin, plasma exchange and, for the
    fulminant tier, cerebrospinal fluid diversion and posterior fossa decompression. The surgical
    row's only source on timing is a three-case series in which the fatal case was the one whose
    drainage was delayed; the row says that is a reason to act and not a measured effect, and that
    the delay is confounded with the misdiagnosis that caused it. A fifteen-child acute cerebellitis
    series in which no patient needed decompression is cited beside it.


    Validation: just validate passes, with 80 snippets and 80 titles verified against the cached references and no
    issues. Every snippet was checked against its cache at the moment it was
    written, and every reference_title was read from the cache's own title line rather than typed.


    Two adversarial verification passes ran before the first push and found real defects on an entry
    that passed every gate. Five sentences claiming that no cited source said something were refuted
    by a reference the entry itself cites: a nine-day latent interval in a case report,
    plasmapheresis named in a guidelines review, a treated-against-untreated contrast in a two-child
    case report, the words obstructive hydrocephalus in four caches, and a frequency claim. Four
    universal quantifiers - every source, every cited series, every one of them - were false over
    twenty sources and are replaced by counts. Five phenotype frequency bands were removed: a band
    asserts a percentage range and their sources state only that a sign is the commonest. One of the
    five was contradicted by its own quote, which gives 27% against a band of 30 to 79. Three
    reference titles carried literal backslashes because the cached title is a double-quoted YAML
    scalar and the helper that read it stripped the quotes without parsing the escapes; the helper
    is fixed and every title in the file was rewritten from the parsed cache value. Two consecutive
    blank lines in review_notes would have failed the yamlfix hook with an error message pointing at
    the wrong cause.

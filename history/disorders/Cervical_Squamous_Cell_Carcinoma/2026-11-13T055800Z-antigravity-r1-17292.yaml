  summary: >-
    Address PR #17292 Round 1 review on Cervical Squamous Cell Carcinoma
    systemic therapies, clinical trials, PD-L1 node split, and evidence grading
  details: |
    Added second-line and first-line systemic therapies Cemiplimab (NCIT:C121540), Tisotumab Vedotin (NCIT:C113164, with CONJUGATE/ANTIBODY/F3 delivery_system), and Bevacizumab (NCIT:C2039), plus four Phase III clinical_trials rows (NCT03635567 KEYNOTE-826, NCT04221945 KEYNOTE-A18, NCT03257267 EMPOWER-Cervical 1, NCT04697628 innovaTV 301). Split PD-L1 Amplification and Adaptive Immune Resistance into CD274/PDCD1LG2 9p24.1 Amplification (MOLECULAR) and PD-L1-Mediated Adaptive Immune Resistance (CELLULAR, retaining module conformance and adding DOI:10.20517/cdr.2023.120 88% PD-L1 positivity evidence), renamed Genomic Instability and CIN Progression to APOBEC Mutagenesis and Genomic Instability, marked PD-L1-Mediated Adaptive Immune Resistance -> Stromal Invasion as INDIRECT, added Human Papillomavirus 18 (NCBITaxon:333761) and Human Immunodeficiency Virus Infection (ECTO:3000289) plus smoking/HIV PREDISPOSES links to Persistent High-Risk HPV Infection, calibrated PIK3CA genetic notes with TCGA SMG confirmation, added systematic review PMID:16762128 on postcoital bleeding, and added REVIEW_SYNTHESIS quote_role with calibrated HUMAN_CLINICAL vs OTHER grading across review/guideline items.

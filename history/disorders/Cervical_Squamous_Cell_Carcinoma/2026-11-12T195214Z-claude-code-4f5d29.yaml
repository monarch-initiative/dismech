  summary: Review and enrich Cervical Squamous Cell Carcinoma mechanism, genetics,
    diagnosis, and StatPearls baseline
  details: |
    Audited all existing snippets, reference titles, CURIEs, and evidence_source/quote_role tags (reclassifying narrative reviews and guidelines to OTHER with REVIEW_SYNTHESIS). Added MONDO exact synonyms, cited and tagged StatPearls chapter PMID:32644501 in references, populated infectious_agent (NCBITaxon:333760), histopathology (NCIT:C2929), somatic genetic drivers/predictors (PIK3CA, TGFBR2, CD274), and four NCIT diagnostic procedures. Expanded pathophysiology to eight atomic viral_oncogenesis- and immune_checkpoint_blockade-conforming nodes while preserving protected node Persistent High-Risk HPV Infection with ectocervical squamous cell grounding (CL:0000076) and without host somatic variant_origin on the viral node, wired all six phenotypes, and enriched treatments with therapeutic_modality and evidence-backed target_mechanisms.

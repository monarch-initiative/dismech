  summary: Align DBP deficiency gene node with HSD17B4 normal function; add ClinGen
    validity
  details: |
    Replaced the molecular-function bindings on the HSD17B4 node -- GO:0004300 enoyl-CoA hydratase activity (a generic parent term) and GO:0035380 very long-chain (3S)-3-hydroxyacyl-CoA dehydrogenase activity (wrong stereochemistry for DBP) -- with the D(R)-specific activities DBP actually carries (GO:0080023 (2E)-enoyl-CoA hydratase activity, EC 4.2.1.119; GO:0106386 (3R)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity), matching the ai-gene-review HSD17B4 core functions, with evidence from PMID:9089413 and PMID:9482850. Added GO:0033540 alongside GO:0140493 on that node. Added a ClinGen Definitive AR gene_disease_validity assertion (CGGV cache rebuilt with just clingen-rebuild). Added evidence for the Type II (PMID:10400999) and Type III (PMID:9482850) subtypes. Validated with just validate, count-verified-snippets (35/35); also added a genetic_context (GERMLINE, LOSS_OF_FUNCTION) to the gene node, evidenced by the ClinGen mechanism statement and validate-terms.

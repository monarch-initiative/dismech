  summary: Comprehensive review of ARX-related XLAG
  details: |
    Re-reviewed MONDO:0010268 as strict X-linked lissencephaly with abnormal genitalia (XLAG), separating classic XLAG from other ARX allelic disorders. Rebuilt the causal graph into atomic, evidence-bearing mechanisms; added and refined phenotype, imaging, histopathology, genetic, diagnosis, differential, model, natural-history, management, and human-model-mismatch content. New literature cache files were generated only with just fetch-reference; targeted ontology validation added deterministic imaging-term cache rows. Deep-research output was used only as a search lead, and its unverified ontology table was not imported. Broad observational registries were omitted because their generated caches did not preserve deterministic ARX-specific eligibility text. Targeted checks passed: schema, ontology terms, folded-scalar hyphens, isolated graph integrity, 15/15 phenotype connectivity, 1/1 causal-gene wiring, and a read-only evidence audit covering 120 exact snippets with 20/20 bibliography closure and matching cache titles. The repository-wide graph recipe still reports pre-existing orphan targets in 81 unrelated disease files; the isolated ARX graph passes.

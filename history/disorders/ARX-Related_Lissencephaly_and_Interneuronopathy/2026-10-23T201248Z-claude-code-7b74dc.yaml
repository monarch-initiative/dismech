  summary: Link the Arx Dlx5/6-CIG conditional mouse to its two MGI genotypes
  details: |
    The Arx conditional-loss model is one line that MGI records as two genotypes from PMID:19439424: hemizygous males (MGI:3844352) and heterozygous females (MGI:3844353). Both mapped narrowMatch. The driver Tg(mI56i-cre,-EGFP)1Kc was confirmed as Dlx5/6-cre-IRES-EGFP from its MGI synonyms. MGI annotates these genotypes to early-infantile DEE rather than XLAG; the disease difference is left for the epic's disagreement review.

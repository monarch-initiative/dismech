  summary: 'Create: Hypomyelinating Leukodystrophy 4'
  details: |
    New entry for HSPD1-related hypomyelinating leukodystrophy 4 (MONDO:0012824, claim issue #13480), curated from the Perplexity deep-research report as a lead plus 11 cited papers fetched into references_cache. The recessive p.Asp29Gly form (Magen 2008 kindred, Kusk 2016) is the defining subtype; heterozygous de novo HSPD1 variants (p.Leu47Val, p.Ala536Val/Pro) are lumped as a second subtype with a knowledge-gap discussion on whether they should be split. SPG13 appears only as an allelic differential. Pathophysiology runs from the HSPD1 variant through HSP60 oligomer destabilization, impaired matrix protein folding, matrix proteome depletion, mitochondrial dynamics and cholesterol-synthesis effects, and reduced mature oligodendrocytes to diffuse CNS hypomyelination (conforms to cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath) and progressive neurodegeneration. The report's mislabelled GO, UBERON and NCIT CURIEs and unresolved HP:0007319 were not used; every term was looked up in OLS or the term caches. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified) and validate-disorders.

  summary: Enriched CBX1-related Neurodevelopmental Disorder with Harrison's classifications, CBX1 molecular function and cellular component bindings, neurodevelopmental phenotype edges, and structured diagnosis and supportive AAC care.
  details: Added Harrison's chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) backed by PMID:37087635 findings. Enriched CBX1 pathophysiology nodes with gene bindings (hgnc:1551), homodimerization/heterodimerization molecular functions (GO:0042803, GO:0046982) backed by direct IP-MS interaction evidence, neuron/brain/heterochromatin annotations (with an entry-level note clarifying non-neuronal biochemical assay lines vs primary mouse neurons), and downstream causal links from Abnormal Brain Development to the five neurodevelopmental phenotypes (leaving craniofacial and growth phenotypes disconnected where no mechanism is published). Deduplicated Frontal bossing evidence, added Whole-Exome Sequencing diagnosis, and recorded supportive care scoped to documented augmentative and alternative communication (AAC) use without therapeutic_modality on generic NCIT:C15747.

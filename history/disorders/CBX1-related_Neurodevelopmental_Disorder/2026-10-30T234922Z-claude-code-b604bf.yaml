  summary: 'Create: CBX1-related neurodevelopmental disorder'
  details: |
    De novo creation of CBX1-related neurodevelopmental disorder (MONDO:0700367), claim issue #16100. Mechanism curated as dominant-negative: de novo chromodomain missense variants in CBX1 (HP1-beta) abolish H3K9me2/3 reader activity, and because HP1-beta dimerizes, mutant protein sequesters wild-type HP1 proteins, impairing heterochromatin organization and transcriptional silencing (GLP/G9a and PRC1.6 complexes) in developing neurons. Six reported chromodomain variants listed. Phenotypes (GDD, ID, hypotonia, autistic behavior, speech delay, broad forehead, frontal bossing) and a Cbx1 W52L knock-in mouse model with modeled_mechanisms are evidenced from the two definitive primary papers: PMID:37087635 (Kuroda et al., Genet Med 2023, founding cohort + functional/mouse study) and PMID:42867044 (Carrillo et al., Clin Genet 2026, spectrum expansion). Deep research launched via just research-disorder openscientist (queued server-side at time of writing); curation was built directly from fetched primary sources with 17/17 snippets verified against the reference cache. GeneReviews/StatPearls: no chapter exists (just check-genereviews --online NO_CHAPTER with synonyms recorded). Nystagmus was considered from general knowledge and dropped as unsupported by either source. Validated with just validate-disorders (schema+terms+references), check-entity-refs, check-causal-targets, check-gene-activity-grounding, model-scale-audit, and the offline KB gate suite.

  summary: 'Create: CBX1-related neurodevelopmental disorder'
  details: |
    De novo creation of CBX1-related neurodevelopmental disorder (MONDO:0700367), claim issue #16100. Mechanism curated as dominant-negative: de novo chromodomain missense variants in CBX1 (HP1-beta) abolish H3K9me2/3 reader activity, and because HP1-beta dimerizes, mutant protein sequesters wild-type HP1 proteins, impairing heterochromatin organization and transcriptional silencing (GLP/G9a and PRC1.6 complexes) in developing neurons. Six reported chromodomain variants listed. Phenotypes (GDD, ID, hypotonia, autistic behavior, speech delay, broad forehead, frontal bossing) and a Cbx1 W52L knock-in mouse model with modeled_mechanisms are evidenced from the two definitive primary papers: PMID:37087635 (Kuroda et al., Genet Med 2023, founding cohort + functional/mouse study) and PMID:42867044 (Carrillo et al., Clin Genet 2026, spectrum expansion). Deep research: a claude_code run produced research/CBX1-related_Neurodevelopmental_Disorder-deep-research-claude_code.md (committed); an openscientist run was also launched but remained queued server-side. just preflight-dr confirmed no Named Entity Confusion (CBX1 mentioned 17x, canonical gene matches). Curation was built directly from fetched primary sources with 18/18 snippets verified against the reference cache. GeneReviews/StatPearls: no chapter exists (just check-genereviews --online NO_CHAPTER with synonyms recorded). Nystagmus was considered from general knowledge and dropped as unsupported by either source. An independent red-team review pass corrected evidence_source grades (molecular-modeling quote to COMPUTATIONAL; IP-MS/ChIP mechanism quotes to IN_VITRO; H3K9-silencing background quote to IN_VITRO + quote_role BACKGROUND), extended a truncated edge snippet, re-grounded the intellectual-disability snippet to the patient table, and added reference_title to every evidence item. Validated with just validate-disorders (schema+terms+references), check-entity-refs, check-causal-targets, check-gene-activity-grounding, model-scale-audit, snippet-grading, and the offline KB gate suite.

  summary: 'Create: TUBGCP6-related Microcephaly and Chorioretinopathy (MCCRP1)'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified; just validate and just validate-terms pass.

    The second gamma-TuRC component disorder and the prototype of the microcephaly-with-chorioretinopathy group. Biallelic loss of function; microcephaly recognisable prenatally, visual impairment evident in the first year.

    The clinically load-bearing point, curated in the diagnosis section: the presentation resembles congenital toxoplasmosis and cytomegalovirus infection, so the differential is between an inherited disorder with a 25% sibling recurrence risk and an acquired condition with none.

    Includes an epidemiology block quantifying the entire evidence base - seven molecularly confirmed patients from five families, plus four more - and a discussion arguing that a phenotype built from a dozen microcephaly-ascertained patients is likely the severe tail. The comparison case is explicit: the closely related TUBG1 tubulinopathy turned out on wider sequencing to include a normocephalic individual with a normal MRI.

    One evidence item quotes the TUBGCP4 paper to establish what the gamma-TuRC does, since the TUBGCP6 clinical papers state complex membership without describing the complex's function.

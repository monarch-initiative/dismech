  summary: 'Evidence and mechanism review: TUBGCP6-related MCCRP1'
  details: |
    Re-reviewed the existing MONDO:0009624 TUBGCP6-related microcephaly and
    chorioretinopathy 1 entry against seven cached primary or review records.
    Kept MCCRP1 distinct from TUBGCP4-, TUBGCP2-, TUBG1-, KIF11-, PLK4-, and
    Seckel-spectrum diagnoses. Rebuilt the mechanism as atomic, parallel branches
    from reduced TUBGCP6 function to reduced centrosome-driven microtubule
    nucleation and centriole-duplication failure, followed by monopolar-spindle
    mitotic arrest and reduced proliferation. The human cerebral, chorioretinal,
    and somatic-growth endpoints remain indirect, unknown-intermediate bridges
    from the acute DLD-1 model. The founding p.Ter1820Gly allele remains explicitly
    predicted rather than functionally proven.

    Confirmed the disease term and parent categories unchanged. Changed or
    reconsidered description, references, inheritance,
    pathophysiology, phenotypes, genetic association, epidemiology, diagnosis,
    imaging findings, differential diagnoses, discussions, notes, and their
    evidence. Added source-local pachygyria, short stature, global developmental
    delay, seizure, retinal-detachment, cerebellar-vermis, ventriculomegaly, WGS,
    and structural-deletion context without assigning unsourced disease-wide
    frequency bands. The only numeric phenotype frequency retained is epilepsy
    in 2/9 people (22%) in the original cohort, represented by HP:0001250 Seizure.
    Retagged TUBGCP4 evidence as differential-only and did not transfer PLK4 cell
    or zebrafish experiments. Considered treatments, clinical trials, experimental
    models, datasets, and population prevalence; none was added because the
    inspected records supplied no disease-specific outcome, direct animal model,
    trial, patient dataset, or population-prevalence evidence. No matching deep-
    research artifact or disease-specific GeneReviews baseline was present.

    Reference-cache acquisition was generator-only and independently collision-
    gated for each new path. For PMID:25344692, the stable exhaustive OPEN-PR scan
    against main 29226621e191e55ab26bb9e291af5d422a4564a8 enumerated
    100/100/25/0 PR-list pages (225 OPEN; digest
    da1124e213ca9909a2bf577f2b2ac2589c63f7aac70211a5bbe4d2b9e499d4bd),
    scanned filename and previous_filename through empty per-PR file pages, and
    found zero path hits. Declared/API totals were 14,715/12,987 across 223
    ordinary PRs; capped anomalies #7922 and #9240 were checked with immutable
    base...head Git diffs (7,728 and 4,384 files respectively), also with zero
    hits. Only after literal CLEAR was `just fetch-reference PMID:25344692` run;
    it produced an abstract-only 2,791-byte cache with SHA256
    9644e457dea0a0f5669b84ea41c927e66ef5e50abeb9fa8169c8639764a52e58.

    For PMID:31874114, a wholly fresh stable scan against main
    145d8af1dd648fdf88f3798881771c42c9c1bea2 enumerated 100/100/24/0 pages
    (224 OPEN; digest
    12ed07039e35204faa2a8777405a6203298715c4677d9eb5eb4ce1ad32920119),
    again exhausted filename and previous_filename pages and found zero hits.
    Declared/API totals were 14,714/12,986 across 222 ordinary PRs; the same two
    capped anomalies received immutable Git fallbacks with zero exact-path hits.
    Only after literal CLEAR was `just fetch-reference PMID:31874114` run; it
    produced a full-text-XML 77,511-byte cache with SHA256
    bf0a1b9d514c44c75d4e26e9e41376523e06212e456c44918999910064b42be9.
    Both generated caches retain their original final byte and no-final-newline
    state.

    The approved content freeze was based on live main
    145d8af1dd648fdf88f3798881771c42c9c1bea2. The target SHA256 was
    c7012b5066f78228dda1086c0a9dd2635b8c23c7138f141eda2b56a760617dda
    (Git blob 99b385909b51b33446015a1605c3669f8b1d71bd); the three-path

    32fd93d751a1164a9be6035f932b173372ecb399382f2c2f43cba46715ad4711.
    Authoritative `just validate-disorders` passed schema, ontology terms, and
    references with 55/55 verified snippets. Boundary, duplicate-key, folded-
    hyphen, short-snippet, title-snippet, empty-snippet, environmental-evidence,
    reference-cache-frontmatter, and source-defect gates passed; the single

  summary: Split alcohol into its own bound exposure (review round 3)
  details: |
    Addresses an optional finding in the third ai4c-reviewer review of PR #9434: the depressant exposure entry carried preferred_term 'exposure to alcohol or sedative agents' bound to ECTO:9001748 exposure to sedative, so the display name claimed more than the binding supported. Convention allows preferred_term to be more specific than the ontology term, not less. Alcohol is now its own environmental entry bound to ECTO:9000027 exposure to ethanol, with its own influences_mechanisms link; the sedative entry's preferred_term now matches its binding exactly.

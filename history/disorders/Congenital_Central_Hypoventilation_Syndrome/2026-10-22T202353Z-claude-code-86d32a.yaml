  summary: 'Edit: Congenital_Central_Hypoventilation_Syndrome - neuroblastic tumour
    risk by PHOX2B genotype'
  details: |
    Adds numbers and evidence to the 'Neuroblastic Tumour' phenotype, as part of the neuroblastoma curation project (#14976, slate item P-b CCHS).

    Phenotype: binding (HP:0004376 Neuroblastic tumor) and overall band (OCCASIONAL) unchanged; a notes field records that the band sits at the lower edge of OCCASIONAL and averages over a sharp genotype split. New evidence: GeneReviews (PMID:20301600, the three neural crest tumour types), Trochet 2005 (PMID:15657873; 10 of 188 probands, 5.3%; malignant tumours in missense or frameshift carriers), Armstrong 2015 (PMID:26011159; high-risk neuroblastoma in a 20/33 polyalanine-expansion carrier, the published exception), Heide 2016 (PMID:26375764; tumour histology and stage in non-polyalanine-mutation carriers, INDIRECT because the series was selected for having a tumour) and the 2020 European guideline (PMID:32958024; 3-5%). Three phenotype_contexts: pooled (OCCASIONAL), PHOX2B non-polyalanine repeat mutations (FREQUENT; about 45% in the 2017 AACR summary, PMID:28674118; 6 of 13 in Trochet) and polyalanine repeat expansions (VERY_RARE; about 1-2%; 2 of 161 in Trochet). Every figure is stated as a risk of any neural crest (neuroblastic) tumour, not a neuroblastoma risk.

    Pathophysiology: new edge from 'Generalised Autonomic Dysregulation and Neural Crest Complications' to 'Neuroblastic Tumour' (INDIRECT_UNKNOWN_INTERMEDIATES), with two Trochet 2005 sentences, both INDIRECT.

    Diagnosis: new row 'Genotype-directed neural crest tumour screening' with the 2010 ATS imaging recommendation, the 2020 European guideline recommendation and its Table 2 follow-up row (20/28-20/33 expansions and non-polyalanine mutations; schedule and tests).

    Not changed: Hirschsprung frequency and wiring, the other phenotypes, the PHOX2B record and the existing NPARM/PARM statements elsewhere in the entry. Heide 2016's genomic findings are not used. New reference caches: PMID:15657873, PMID:26011159, PMID:26375764, PMID:32958024. Validated with just validate-disorders, count-verified-snippets --strict, validate-terms and the offline gates.

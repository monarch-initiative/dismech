  summary: Add a Haddad syndrome subtype and a ROHHAD differential
  details: |
    Adds Haddad syndrome (MONDO:0020493), CCHS with Hirschsprung disease, as a third has_subtypes row, and the entry's first differential_diagnoses section with one row for ROHHAD (MONDO:0017408). Part of the neuroblastoma expansion series (issue 15822).

    Haddad syndrome: the subtype follows MONDO's clinical definition. Its description cites Trochet et al. 2005 (PMID:15657873) for the name and for the finding that Hirschsprung disease also occurs with polyalanine expansions, so expansion length does not predict it; Berry-Kravis et al. 2006 (PMID:16888290) for the higher prevalence of Hirschsprung disease with non-polyalanine repeat mutations; and the ClinGen curation (CGGV:assertion_07133a39-00fb-43c4-a7e2-a465c3c0c4ca-2021-06-15T152906.892Z), which classifies PHOX2B as Definitive for autosomal dominant Haddad syndrome in a curation scoped to non-polyalanine repeat mutations. The two definitions are kept separate in the text. The ClinGen classification is also recorded as gene_disease_validity on the PHOX2B genetic record (DEFINITIVE, CLINGEN, subtype Haddad Syndrome), quoting its validity-table row; list-gene-validity now reports no backfill for this entry. The Hirschsprung Disease phenotype is unchanged.

    ROHHAD: what the two share (alveolar hypoventilation with autonomic dysregulation) and what separates them (rapid-onset obesity first, then hypothalamic dysfunction; negative PHOX2B sequencing in the cohort that named ROHHAD) are quoted from Ize-Ludlow et al. 2007 (PMID:17606542) and the 2020 European CCHS guideline (PMID:32958024). The row states the ATS requirement of a PHOX2B mutation to confirm CCHS (PMID:20208042) alongside the guideline's caveat that a subset of CCHS-phenotype patients has no PHOX2B mutation, so a negative result does not by itself exclude CCHS. The row does not point to any ROHHAD entry.

    New reference caches: PMID:16888290, PMID:17606542 and the ClinGen assertion. Validated with run_c4 (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present and check-gene-validity.

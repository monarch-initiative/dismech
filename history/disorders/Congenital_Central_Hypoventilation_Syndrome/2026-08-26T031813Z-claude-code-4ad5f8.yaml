  summary: Rename ethanol exposure entry to match KB naming convention
  details: |
    Renamed the CCHS environmental entry from "Alcohol" to "Ethanol Exposure",
    following Esophageal_Carcinoma, HPV_Negative_Head_and_Neck_Cancer and
    Oral_Cavity_Squamous_Cell_Carcinoma, which all bind ECTO:9000027 under that name.

    The previous round added a notes: block asserting the entry was "Named and bound
    for the chemical", but the name was still the colloquial "Alcohol" - so the notes
    described a convention the entry only half-followed. The name is also what
    `just environmental-term-audit` keys on: it reported
    "alcohol: ECTO:0001082 x3, ECTO:9000027 x1", the x1 being this entry. After the
    rename the audit reports one conflicting name instead of two, the remaining one
    (smoking tobacco) being pre-existing and unrelated to this branch.

    The notes: block now also records the rename and cites the third precedent entry,
    which the previous wording omitted.

    Safe because grep finds no environmental# entity reference to the old name
    anywhere in the file, so no foreign key pointed at it.

    Validated: schema, terms and references clean with 46/46 snippets verified;
    duplicate-key, folded-hyphen and snippet-length gates pass with no new baseline
    entries. The diff touches zero snippet: and zero reference: lines.

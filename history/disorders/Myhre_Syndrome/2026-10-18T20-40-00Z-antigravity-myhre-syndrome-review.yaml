  summary: 'Review Myhre syndrome (MONDO:0007688): add progression, diagnosis, differentials, SMAD4
    node bindings and LAPS synonyms.'
  details: |
    Added the synonyms "LAPS syndrome" and "Laryngotracheal-Arthropathy-Prognathism-Short Stature syndrome" (PMID:40476377 calls LAPS and Myhre syndrome allelic disorders).
    Added three progression phases with no onset terms bound: "Antenatal and Infantile Growth Restriction", "Childhood Neurodevelopmental, Facial, Skin, and Joint Progression" and "Adolescent and Adult Cardiopulmonary and Vascular Fibrosis", evidenced from the French (PMID:35907855) and MGH (PMID:38779990) natural-history cohorts.
    On the pathophysiology node "SMAD4 Gain-of-Function Variants Dysregulating TGF-beta/BMP Signaling" added genes: SMAD4 (hgnc:6770) and molecular_functions GO:0070412 R-SMAD binding and GO:0003700 DNA-binding transcription factor activity. The genetic: section was not changed.
    Replaced the two-to-three-word GeneReviews snippets on the Maxillary Hypoplasia and Narrow Mouth phenotypes with the full GeneReviews facial-features clause (PMID:28406602).
    Added a diagnosis row "SMAD4 Molecular Genetic Testing" (NCIT:C15709 Genetic Testing) quoting the GeneReviews diagnostic criteria.
    Added differential diagnoses Loeys-Dietz syndrome (MONDO:0018954, PMID:27302097) and juvenile scleroderma (PMID:32917212), and added PMID:32917212 to references.
    Removed the empty datasets: [] list.
    No biochemical, clinical_trials or phenotype-qualifier changes were made in this session.

  summary: 'Compliance: add SYNGAP1 dataset record and spine-maturation evidence'
  details: |
    Weekly compliance pass focused on datasets. The entry had an empty datasets list; added geo:GSE252400, whole-hippocampal RNA-seq across six arms of wild-type and Syngap1 heterozygous mice given saline, carrier nanosphere, or the p300/CBP activator CSP-TTK21, verified through just verify-datasets on 2026-08-27. This is the only SYNGAP1 disease dataset in GEO as of that date; a search across all fields returns seven other series, none of which studies SYNGAP1 loss of function, and the record notes say so. GEO lists no linked PMID, so the publication recorded is PMID:39878322, matched to the series on summary and design. Also added MODEL_ORGANISM evidence from PMID:23141534 to two previously unevidenced pathophysiology nodes: Premature Excitatory Synapse and Dendritic Spine Maturation, and Neuronal Network Hyperexcitability. Both explanations record that the measurements are mouse hippocampal, not human cortical. All five candidates the discovery script scored DIRECT were rejected: they matched the phrase intellectual disability autosomal dominant and concern AFF3, TCF4, or TLK1/MDM1.

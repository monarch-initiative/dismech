  summary: 'Create: SYNGAP1-Related Developmental and Epileptic Encephalopathy'
  details: |
    De-novo curation of SYNGAP1-related DEE / SYNGAP1-ID / MRD5 (MONDO:0012960), an autosomal dominant synaptopathy. GeneReviews baseline PMID:30789692 (tagged). claude_code deep research. Granular unbundled pathophysiology: SYNGAP1 haploinsufficiency -> reduced SynGAP at excitatory PSD (Ras/Rap GAP brake) -> dysregulated Ras signaling + AMPA trafficking -> premature excitatory synapse/dendritic-spine maturation -> cortical E/I imbalance -> hyperexcitability -> generalized epilepsy (incl. Doose subset); parallel impaired-cognition and autism effectors. Three conforms_to links to the epilepsy module. Evidence snippet-verified: 30789692 (GeneReviews), 26912996 (Mind the Gap - SynGAP as Ras/AMPA brake), 31025938 (Rumbaugh adult re-expression reversibility), 39807402 (Graglia therapy roadmap), 30541864 (Vlaskamp distinctive DEE). Diagnosis + prevalence (CASES_IN_LITERATURE) sections included. Discussions: developmental-window/adult-reversibility gap, dosage-sensitivity upregulation-therapy hypothesis, and mechanism-to-phenotype gap. Caught two mis-cited PMIDs during fetch-verify (23141539 = HDAC4 paper, not Clement). All snippets confirmed as exact substrings; validation and folded-hyphen pass.

  summary: 'Create: ALG6-congenital disorder of glycosylation (ALG6-CDG, CDG-Ic)'
  details: |
    De novo curation of ALG6-CDG (MONDO:0011291) from a Perplexity sonar-deep-research report used as leads only; the report cited by URL rather than PMID, so the evidence base was rebuilt from PubMed and every snippet quoted from a freshly fetched abstract. NEC preflight returned WARN, not PASS: ALG6 gene dominance was unambiguous (240 mentions vs 6 for the next gene) but the report cited OMIM 604566 where MONDO:0011291 xrefs 603147. Resolved in MONDO's favour using independent evidence - the ALG6 clinical utility gene card (PMID:25052310) gives 603147 as the OMIM number of the disease - and the discrepancy is recorded in the entry notes rather than silently dropped. Declares conformance to three congenital_disorder_of_glycosylation module nodes (ER LLO assembly defect, protein hypoglycosylation, multisystem glycoprotein dysfunction). The Enterocyte Heparan Sulfate Loss node deliberately does NOT declare conformance: it is an ALG6-specific branch with no module counterpart, and its edge to protein-losing enteropathy is curated INDIRECT_UNKNOWN_INTERMEDIATES because the source states the step as a possibility. Two KNOWLEDGE_GAPs recorded: the unresolved pathogenicity of the common p.Tyr131His allele (complementation says severe, allele frequency says it cannot be fully penetrant, and the one informative homozygote had normal transferrin), and which hypoglycosylated protein drives the enterocyte heparan sulfate loss. The ALG6 p.Phe304Ser modifier is curated with relationship_type MODIFIER and flagged in notes as a claim about PMM2-CDG rather than about this disease. Validation: schema clean; 36/36 snippets verified; term validation passed first try; conforms_to foreign-key test passed (2353 tests); all five ungated CI gates clean.

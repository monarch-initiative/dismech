  summary: Fix model readout target drift that ejected the PR from the merge queue
  details: |
    The PR's own checks were green, but it was ejected from the merge queue four times on 2026-09-23 (runs 35829612529, 35833307176, 35838446743, 35844035580). Every ejection was the same failure in the ungated merge_group lane (recipe _test-python-kb): tests/test_data.py::test_disorder_file for this entry, check_model_readout_targets_match_link reporting experimental_models[0].modeled_mechanisms[0].readouts[0].target='Protein Hypoglycosylation' against link target 'ALG6 Alpha-1,3-Glucosyltransferase Deficiency'. The PR's own CI never ran that lane because it is path-gated on schema and Python changes, and this is a kb/-only branch. Retargeted the readout onto the link's own target rather than adding a second modeled_mechanisms link for Protein Hypoglycosylation: the model's stated limitations say failure of one rescue readout is not proof of human organ pathology, so asserting that the yeast complementation assay recapitulates human protein hypoglycosylation would contradict the curator's own caution. The CPY glycoform is the assay's instrument; the claim it supports is about ALG6 deficiency, and the readout's interpretation text already names CPY hypoglycosylation, so nothing is lost. direction: INCREASED still reads correctly (failure of rescue means more deficiency). Verified: tests/test_data.py 7245 passed on the merged tree, just validate-disorders passed with 141 snippets and 163 titles checked and 0 issues, and check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all clean.

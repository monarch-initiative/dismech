  summary: Review ALG6-CDG diagnosis, cohort phenotypes, molecular mechanisms and care
  details: |-
    Reviewed the complete 1,446-line baseline, matching deep-research report and citation sidecar after a fully paginated live scan of 147 open PRs found no exact target overlap, and confirmed the existing history contained only CREATE. All original cited abstracts and actual available full bodies were consumed; a full-text metadata label was not accepted as proof of a body. Read the full original founding-gene, historical puberty and mortality papers; independently audited the complete structural enzyme paper including Methods and extended legends. Recovered complete institutional PDFs for the 2016 clinical cohort and South African five-case series, the clinical utility gene card, infantile epilepsy and cardiomyopathy reports, and the complete retired GeneReviews chapter. No reference Markdown was hand-edited; no dataset-accessions cache was accessed.

    The most consequential correction is the later reclassification of the woman described in the 2011 puberty paper as NR2F1-related Bosch-Boonstra-Schaaf optic atrophy syndrome (PMID:32407885). The generated primary abstract supplies the diagnostic revision and normal fibroblast/serum glycosylation; a peer independently checked available publisher clinical/methods text. Complete later Results remained inaccessible. Secondary sources conflict over the NR2F1 residue, which was not imported. Removed that patient's unsupported ALG6 puberty, dysarthria and cortical-visual attribution; independently re-sourced hyperinsulinemic hypoglycemia, myoclonic seizures and callosal hypoplasia from the larger ALG6 cohort. Replaced the obsolete p.Tyr131His knowledge gap with a documented resolution. The combined paternal Tyr131His/Ser308Arg yeast construct does not establish isolated Tyr131His causation. Normal adult transferrin alone is not a universal exclusion rule for CDG.

    Rebuilt eight atomic nodes distinguishing biallelic variants, reduced enzyme function, incomplete precursor glucosylation, reduced oligosaccharyltransferase-mediated transfer, protein under-occupancy, clinical organ dysfunction, enterocyte heparan sulfate loss and intestinal protein leakage. The founding Ala333Val allele fails CPY rescue but partially rescues synthetic yeast growth: the full paper explicitly excludes complete enzyme inactivation. Removed the universal-null and every-allele-tested assertions. Added distinct yeast complementation, patient-fibroblast and purified yeast enzyme models. The structural paper tests engineered catalytic-site mutants rather than patient variants, leaves donor/acceptor geometry and binding order partly unresolved, and does not establish human activity thresholds. Model timing, species, assay and rescue limitations remain explicit. The single-boy enteropathy association is not converted into a proven universal HS pathway; full retrieval attempts for PMID:11106564 were blocked by PMC challenges and a PDF403, so that branch remains bounded to its generated abstract.

    Replaced ambiguous abstract-derived frequency claims with the 2016 narrative's feature-specific counts: hypotonia 40, epilepsy 30, ataxia 20, nystagmus 18, strabismus 25, failure to thrive 25, PLE 6, cardiomyopathy 3 and nonspecific facial findings 15 among the reported 41 clinical participants. This corrects universal ataxia/epilepsy and very-rare facial claims. Behavioral/mood14 is not an autism denominator; diagnosed autism 5 remains distinguished. The coagulation group combines increased bleeding time and bruising and is mainly subclinical, not overt hemorrhage in 18. Laboratory ascertainment was incomplete. Documented internally inconsistent table rows, a 42-case caption and age/death discrepancies, avoiding reconstructed survival estimates. The cohort incorporates the five South African cases and original cardiomyopathy report; its 60-person genetic registry and 22-person genotype analysis are separate. Expanded to 28 supported phenotypes without creating population penetrance from selected cohorts.

    Expanded diagnosis and 11 care approaches: biochemical/genomic confirmation and diagnostic reassessment, nutrition/feeding, individualized antiseizure treatment, selected PLE support/octreotide, rehabilitation, vision, coagulation planning, metabolic/endocrine/liver/cardiac follow-up, cardiomyopathy treatment, behavioral/sleep care and family counseling. Single-case initial phenobarbital response is followed by persistent refractory epilepsy; psychiatric improvement with escitalopram/risperidone remains a single abstract-supported case with extrapyramidal effects. Neither establishes a preferred regimen. The full retired GeneReviews overview was consumed across clinical characteristics, diagnosis, management/prevention and family evaluation, supplementing the ALG6-specific gene card and primary cohort. Its outdated puberty citation was not reused. The natural-history registry supplies purpose, not current recruitment or treatment efficacy. The PMM2-specific Phe304Ser association was removed from structured ALG6 modifier relationships and retained as scoped discussion.

    Authoritative validate-disorders passes schema, live ontology bindings and 141/141 snippets after correcting an anticonvulsant drug-class term to the treatment-action term. The full node-class tree resolves all 2,192 examples. The 20 repository guards were run; the first pass found a four-word PLE quote and missing resolution date/note. Both were corrected. Remaining final peer review and post-format validation are recorded in the follow-up validation note before publication.

    Independent clinical/care review read the complete cohort Methods/Results/Discussion and relevant GeneReviews care/family sections. Its two claim-local refinements were incorporated: the feeding-support edge now cites tube-feeding guidance rather than only the failure-to-thrive count, and four elemental-diet plus two octreotide recipients are not assumed disjoint. The historical general drug-metabolism precaution is explicitly scoped rather than converted to an ALG6-specific contraindication. No broader clinical blocker was identified. All twenty guards now pass after the two repairs, including the whole-KB reference and cache checks; the full node-class gate passes. Final authoritative validation and commit hooks follow these evidence-local refinements.

    Final authoritative validation passed again after peer refinements and ontology binding additions: schema, live terms and 141/141 snippets. Resolved-discussion dates use full ISO date-time syntax. The generated Patient Monitoring term was outside the allowed action enum and its unused cache addition was reverted; no forced binding was retained. A second fully paginated pre-publication scan covered 152 open PRs and found no ALG6 overlap.

    Repository commit hooks normalized curation YAML layout and generated-cache trailing whitespace/newlines. The only parsed curation-data difference was paragraph spacing in notes; clinical claims and evidence were unchanged.

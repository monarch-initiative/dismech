  summary: 'Create: Hearing Loss Autosomal Dominant 78 (DFNA78, SLC12A2)'
  details: |
    De novo curation of DFNA78 from primary literature plus one openscientist deep-research run. The entry is organised around the exon-21 restriction of the pathogenic allele spectrum and the inner-ear-restricted isoform that exon encodes. Variants are recorded LOSS_OF_FUNCTION on the measured oocyte chloride-influx data rather than DOMINANT_NEGATIVE; the route to dominance is left as an open question because the splice allele's reduced exon-21 transcript level argues for isoform dose while a missense subunit in a dimeric transporter could poison its partner. A HUMAN_MODEL_MISMATCH discussion records that the exon-21-skip mouse reproduces the mechanism only as a homozygote. Validated: schema, terms, 34/34 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms.

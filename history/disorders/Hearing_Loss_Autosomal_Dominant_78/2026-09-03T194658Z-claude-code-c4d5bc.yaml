  summary: 'Review round 1: address ai4c-reviewer findings on #10759'
  details: |
    Addressed six findings from the automated review. (1) The top-level description still described a DOMINANT_NEGATIVE call the entry had already abandoned - an edit that silently failed to match earlier in the session, so the entry's own introduction contradicted its genetic_context, its discussion and its history record. (2) The immunohistochemical localisation of SLC12A2 to strial marginal cells was graded HUMAN_CLINICAL; the reviewer read the full text and found the cochleae came from Macaca fascicularis, so it is regraded MODEL_ORGANISM with the species disclosed - the anatomical anchor of the mechanism rests on non-human primate tissue. (3) HP:0008568 Vestibular areflexia does exist and is already used in six entries including the sibling SLC12A2 disorder; the phenotype is rebound to it and the notes claiming no narrower term existed are deleted. (4) The bundled 'Reduced Endolymph Production and Strial Atrophy' node is split into two, recovering the endolymph-to-strial-remodelling edge the bundling had hidden. (5) A treatments section is added following the sanctioned no-evidence pattern from Autosomal_Recessive_Nonsyndromic_Hearing_Loss_104, including a loop-diuretic avoidance record because the drug class targets the transporter the disease has crippled. (6) Two introductory statements from a mouse paper regraded HUMAN_CLINICAL to OTHER. Also took two suggestions: GO:0071805 for the basolateral transport node, and collapsing the severe-hearing-loss phenotype into a severity field rather than a causal sequela of its own parent term. Revalidated: schema, terms, 33/33 snippets, all offline gates plus check-qualifier-terms-online.

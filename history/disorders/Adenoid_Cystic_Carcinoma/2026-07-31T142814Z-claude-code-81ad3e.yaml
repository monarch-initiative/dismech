  details: |
    De-novo curation of Adenoid Cystic Carcinoma [MONDO:0004971], a salivary/exocrine gland
    malignancy absent from the KB. Duplicate preflight run against origin/main, all PRs, and
    all issues: no hits.

    Deep research: claude_code provider, report at
    research/Adenoid_Cystic_Carcinoma-deep-research-claude_code.md [21 web searches, 26 turns].
    Treated as leads only. Every DR-sourced PMID was independently re-fetched via
    just fetch-reference and every snippet verified as an exact substring of the cached
    abstract. Two DR-supplied HGNC IDs were wrong and were corrected against OAK: the report
    gave NFIB as hgnc:7784, which is actually NFIA, and MYBL1 as hgnc:7548, which is actually
    MYBL2. The correct IDs hgnc:7785 and hgnc:7547 are used. NEC preflight against the MONDO
    record confirmed the report describes the intended entity. No GeneReviews article exists
    for this sporadic cancer, PubMed search returned zero hits, so that baseline does not apply.

    Curated an 11-node atomic pathophysiology graph covering the three mutually exclusive
    oncogenic routes: MYB-NFIB t6;9 fusion with loss of the 3prime UTR microRNA brake, MYBL1
    rearrangement / MYB amplification, and TERT promoter mutation. Also curated the MYB
    super-enhancer positive-feedback loop, the intercalated-duct cell of origin from
    single-cell data, the biphasic myoepithelial-luminal architecture, NOTCH1
    hyperactivation, neurotropic perineural invasion, and late haematogenous metastasis
    which declares conforms_to invasion_and_metastasis#Metastatic Colonization.

    Added 4 histopathology findings with NCIT terms, 7 phenotypes with HPO terms, 3
    biomarkers, 5 somatic driver genes, 6 treatments including two Notch-directed agents
    wired with target_mechanisms edges, one EMERGING mechanistic hypothesis on BDNF
    neurotropism, and two KNOWLEDGE_GAP discussions with proposed experiments.

    Validation: just validate passes. Schema OK, term validation OK, 53/53 evidence snippets
    verified against cached references. Weighted compliance 83.4 percent. All internal
    foreign keys verified to resolve: downstream targets, target_mechanisms, attaches_to,
    conforms_to.

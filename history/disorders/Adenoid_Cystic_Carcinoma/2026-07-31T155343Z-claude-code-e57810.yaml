  summary: 'Address PR #7353 review: NOTCH1 frequencies, hypothesis wiring, module
    conformance'
  details: |
    Addressed the automated dismech review on PR #7353, which requested changes on two
    IMPORTANT items. Both accepted as correct after independent verification.

    1. NOTCH1 frequency in genetic notes. The notes claimed roughly 14-20 percent of primary
    and about 26 percent of recurrent/metastatic tumors. Verified against the cached
    references: PMID:31483290 reports NOTCH1 at 8.5 percent primary vs 26.3 percent R/M,
    while the 13.7 percent and 20.5 percent figures in PMID:27870570 come from a mixed
    primary-plus-recurrent cohort of 102 tumors and are NOTCH1-alone vs broader
    Notch-pathway respectively. The original text conflated two denominators and obscured
    the roughly three-fold R/M enrichment that the pathophysiology node argues for.
    Rewritten with explicit per-source attribution and an explicit warning that the two
    denominators are not comparable.

    2. Orphaned mechanistic_hypotheses group. The bdnf_neurotropism group was declared but
    no causal edge opted into it, leaving it unreachable from the pathograph. Added
    hypothesis_groups: [bdnf_neurotropism] to the Biphasic Myoepithelial-Luminal Tumor
    Architecture to Neurotropic Perineural Invasion edge, which is the invasion-front edge
    the BDNF model actually explains.

    Also took three of the optional suggestions:

    3. Completed conformance to invasion_and_metastasis#Metastatic Colonization by adding the
    module node's expected biological process GO:0008283 cell population proliferation
    [INCREASED] to the Late Haematogenous Metastasis node.

    4. Added a second hallmark conformance: the TERT node now declares conforms_to
    enabling_replicative_immortality#Telomere Maintenance Reactivation with the module's
    GO:0007004 telomere maintenance via telomerase [INCREASED]. The node description states
    explicitly that the module's downstream chain is not replicated because the cited ACC
    genomic series characterise the lesion and its mutual exclusivity rather than measuring
    telomerase activity or telomere length in ACC.

    5. Added a classifications block: icdo_morphology Carcinoma [MONDO xref ICDO:8200/3],
    harrisons_chapter ONCOLOGY_HEMATOLOGY, nih_research_priority NIH_HT_42 rare cancers.

    Deliberately not done, with reasons given on the PR: a numeric prevalence rate [the
    cached SEER abstract carries no quotable incidence figure and no ORPHA record exists for
    ACC, so the existing documented gap stands rather than inventing a number]; evidence for
    the Paresthesia phenotype and the cribriform/tubular histopathology patterns [no
    quotable snippet in the cached sources]; splitting the Cranial Neuropathy and Late Local
    Recurrence node [defensible but a structural change beyond the review scope].

    Validation after fixes: just validate passes, schema and terms OK, 54/54 evidence
    snippets verified against cached references. Compliance 82.8 percent weighted [down from
    83.6 because the added classifications and descriptor slots enlarge the denominator;
    numerator rose from 135 to 137]. No orphaned hypothesis groups remain, both conforms_to
    targets resolve to real module nodes.

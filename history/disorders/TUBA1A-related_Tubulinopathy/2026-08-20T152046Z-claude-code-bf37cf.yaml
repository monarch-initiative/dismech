  summary: Raise TUBA1A to parity per review recommendation 3
  details: |
    Recommendation 3 of docs/reports/tubulinopathies-grouping-review-2026-08-20.md: TUBA1A was the thinnest entry in the Tubulinopathies grouping (78.9% compliance, 5 references, newest 2017) for what is the commonest and most severe tubulinopathy.

    Added: a structured inheritance block bound to HP:0000006 (previously asserted only in prose); an epidemiology block quantifying the TUBA1A share of lissencephaly cohorts; three diagnosis entries including prenatal neurosonography; three progression phases; clinical_burden; two animal models with modeled_mechanisms and readouts - the founding ENU mouse the entry already cited as evidence, and the R402C/R402H in utero expression model; biological_scale tags on all three pathophysiology nodes; a genetic_context recording DOMINANT_NEGATIVE with the dynein-poisoning evidence; and seven clinical phenotypes.

    The clinical phenotypes are the notable addition. The entry notes had explicitly recorded that intellectual disability, motor delay, drug-resistant epilepsy and ocular impairment were left in prose because no quotable abstract snippet existed. That constraint has lifted: 2025-2026 cohort and review literature states them directly, so they are now evidenced phenotypes. Note one ontology gap handled explicitly - HPO has no term for drug-resistant epilepsy, so that phenotype binds to HP:0001250 Seizure with the drug-resistance claim carried by preferred_term and a notes line, with epileptic spasms and focal seizures curated separately.

    Compliance rose from 78.9% to roughly 88%. Verified: just validate passed with 56/56 snippets verified against cached references; just validate-terms passed.

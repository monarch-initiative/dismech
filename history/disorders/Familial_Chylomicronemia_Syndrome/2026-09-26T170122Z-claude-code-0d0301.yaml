  summary: 'Genetics pass: four gene-defined subtype rows and accessory-gene pathograph
    wiring'
  details: |
    Genetics pass for issue #12261 (d2g series-054). Verified the parent anchor
    first: MONDO:0018637 familial chylomicronemia syndrome is the multigene FCS
    umbrella this entry models, and the four MONDO classes the gap list attributes
    to it are all direct children of it, so no anchor change was needed.

    Added a has_subtypes section (the entry had none) with four gene-defined rows,
    each bound to its MONDO child class and carrying genes, autosomal recessive
    inheritance, and its own evidence: FCS-LPL (MONDO:0009387), FCS-APOC2
    (MONDO:0008810), FCS-GPIHBP1 (MONDO:0014412 hyperlipoproteinemia, type 1D) and
    FCS-LMF1 (MONDO:0009527 lipase deficiency, combined). Added reciprocal
    genetic[].subtype foreign keys and relationship_type: CAUSATIVE on all five
    genetic records, case_fractions for LPL (76 percent of 33 FCS patients in a
    Chinese cohort) and LMF1 (1 to 2 percent of reported FCS cases), and evidence to
    the four genetic records that previously carried none.

    Wired the four accessory genes into the pathograph with a new upstream node,
    Defective LPL Maturation Trafficking and Activation, carrying LMF1, GPIHBP1,
    APOC2 and APOA5 with GO:0051006 positive regulation of lipoprotein lipase
    activity DECREASED, and a DIRECT edge to the existing Lipoprotein Lipase
    Deficiency node evidenced by the reduced measured LPL activity reported in
    GPIHBP1, LMF1 and APOA5 patients. Gene-to-mechanism wiring moved from 1/5 to 5/5.

    Declined an APOA5 subtype row on ontology grounds rather than on the biology:
    MONDO has no FCS-scoped APOA5 class, and the only APOA5-associated class its
    searches return, MONDO:0007762 hyperlipoproteinemia type V, defines itself as
    not caused by reduced lipoprotein lipase activity. The reasoning and the exact
    searches are recorded in that record's review_notes. APOA5 still reaches the
    pathograph through the new node.

    Nine references were added, all fetched with just fetch-reference. Orphanet
    could not be consulted: no ORPHA cache file exists for this disease in the
    repository and populating one needs a maintainer-level bulk refresh. The
    committed ClinGen gene-validity download has no row for LPL, APOC2, APOA5,
    GPIHBP1 or LMF1.

    Validation: just validate passed with 0 issues, just validate-terms passed,
    count-verified-snippets 57/57, list-gene-term-mismatches --resolve reported 0
    findings with full coverage, and the whole-repo gates listed in CLAUDE.md all
    returned OK. Run under linkml-reference-validator 0.3.0rc3.

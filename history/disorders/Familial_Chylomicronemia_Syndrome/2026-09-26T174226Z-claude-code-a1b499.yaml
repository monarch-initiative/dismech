  details: |
    Review round 1 on PR #12919. No blocking finding touched this entry; the changes
    here are two self-found corrections and two accepted suggestions.

    Self-found: two has_subtypes display_name values invented a classification
    label. FCS is not numbered into types in the literature -- the numbering belongs
    to the hyperlipoproteinemia nomenclature -- so "FCS type 1 (LPL deficiency)"
    became "Familial lipoprotein lipase deficiency (LPL)" and "FCS type 1D (GPIHBP1
    deficiency)" became "Hyperlipoproteinemia type 1D (GPIHBP1)", which is the label
    MONDO:0014412 carries. The name values are untouched, so no foreign key moved.

    Accepted suggestion: two explanations asserted facts their own snippets did not
    contain. The LMF1 genetic record now quotes the sentence reporting markedly
    reduced LPL activity alongside the FCS clinical picture, rather than the
    clinical sentence alone, and its explanation no longer says "post-heparin",
    which is stated in the paper's methods rather than in the quoted sentence. The
    GPIHBP1 PMID:42309774 item is split in two: the case-identification sentence
    keeps an explanation about the case, and a second item quotes "Serum preheparin
    LPL mass was markedly reduced, and circulating GPIHBP1 was undetectable." so
    that the biochemical facts are carried by the sentence asserting them. The same
    whole-sentence quote is now used on the node's downstream edge in place of a
    truncation of it.

    Accepted suggestion: GO:0051006 positive regulation of lipoprotein lipase
    activity describes the APOC2 and APOA5 cofactor step, and more loosely the LMF1
    maturation step, but not GPIHBP1, which transports and anchors the enzyme
    instead of regulating its activity. Added GO:0034394 protein localization to
    cell surface as a second biological_processes entry on the same node rather than
    replacing the first, since the four genes do not share one process. The node's
    own cited sentence, "GPIHBP1 attaches to lipoprotein lipase (LPL), subsequently
    carrying the enzyme and anchoring it to the capillary lumen.", is what supports
    it, and the node description now says which process covers which gene.

    Validation after the round: just validate 0 issues, just validate-terms passed
    including the new GO term against its dynamic enum, count-verified-snippets
    58/58 for this entry and 123/123 across both, and the per-file and whole-repo
    gates in CLAUDE.md all returned OK. Run under linkml-reference-validator
    0.3.0rc3.

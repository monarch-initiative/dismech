  summary: 'Gene-family review: LPL, GPIHBP1, LMF1, APOC2, APOA5'
  details: |
    Added germline origin to all five causative records, which had none. Grounded the four non-LPL genes, which landed on a node with processes only: the LPL maturation, trafficking and activation node now binds lipoprotein lipase activator activity (apoC-II and apoA-V cofactors), protein folding chaperone (LMF1, the ER chaperone that matures LPL) and lipase binding (GPIHBP1, which binds LPL and carries it to the capillary lumen), all decreased, each supported by the node's existing evidence (PMID:38503616, PMID:39537501, PMID:37951027). The LPL node (lipoprotein lipase activity decreased) was reviewed and left unchanged.

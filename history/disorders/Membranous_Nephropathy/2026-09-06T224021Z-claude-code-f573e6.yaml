  details: |
    PR Shepherd round addressing the CHANGES_REQUESTED review on #9147. (1) therapeutic_modality BEHAVIORAL to OTHER on all three herbal formulas - these are orally dosed multi-component botanical drugs, not the non-pharmacologic lifestyle intervention BEHAVIORAL denotes. (2) The Shenqi target_mechanisms link quoted a clinical-use sentence while asserting an mTOR/ULK1 mechanism; it now quotes the mechanism sentence and the description is narrowed to autophagy enhancement. (3) evidence_source on the three mechanism links corrected from OTHER to the design recorded in Table 1 of the cited review - Shenqi IN_VITRO (puromycin-aminonucleoside MPC5 podocytes, no in vivo arm), MFSD and Jianpi Qushi Heluo MODEL_ORGANISM (passive Heymann nephritis rat, no in vitro arm). (4) Formula-identity conflation resolved by splitting rather than asserting an unsourced equivalence - the review keeps Jianpi Qushi Heluo Formula (preclinical PINK1/Parkin) separate from Jian Pi Qu Shi Formula (RCT n=30 plus case series n=15), so the mechanism now sits on its own treatment entry and JPQSF carries clinical evidence only, each with a notes block recording the split. (5) The programmed-cell-death node was an orphan; it now has an inbound downstream edge from the complement-activation node, evidenced by the review sentence naming complement-dependent and complement-independent pathways as jointly initiating the cell-death programmes. (6) The node claimed four PCD modalities but bound only two; added pyroptotic inflammatory response GO:0070269 and ferroptosis GO:0097707, with modifiers on all four. Also added biological_scale CELLULAR, treatment_term NCIT:C15986 plus therapeutic_agent NCIT:C129986 on the herbal entries, and recorded the review's Shenqi Particle versus Shenqi Granule naming inconsistency in notes. Verified separately that the three pre-existing PARTIAL evidence grades were already migrated on main by #10003 and that the merge takes main's side, so they were left untouched here to avoid conflicting with that migration. Validated with just validate (52/52 snippets verified), validate-terms, check-folded-hyphens, check-duplicate-keys and check-entity-refs.

  summary: Split bundled PCD node into atomic modalities; sharpen GO terms and TCM
    evidence
  details: |
    Addresses the review of PR #8454 on the PCD and TCM additions to Membranous_Nephropathy.

    Split the bundled pathophysiology node "Programmed cell death dysregulation in podocytes" into four atomic nodes plus one convergence node. The bundled node carried four GO terms and four evidence items, one per death modality, which is the signal that it was four mechanistic claims under one name; as curated, no query could distinguish ferroptosis from pyroptosis and the TCM treatment edge pointed at all four at once.

    New nodes, each biological_scale CELLULAR, each downstream of "Podocyte structural injury", each reusing the evidence item that was already written for it:
    - Podocyte apoptosis, GO:0006915 apoptotic process, modifier INCREASED, CXCL12/CXCR4/STAT3 evidence
    - Podocyte pyroptosis, GO:0070269 pyroptotic inflammatory response, modifier INCREASED, NLRP3/GSDMD evidence
    - Podocyte ferroptosis, GO:0097707 ferroptosis, modifier INCREASED, lipid peroxidation evidence
    - Podocyte autophagy dysregulation, GO:0006914 autophagy, modifier DYSREGULATED, dysregulated-autophagy evidence

    Autophagy takes DYSREGULATED rather than a direction because the quoted sentence is explicitly bidirectional: either insufficient or excessive autophagy exacerbates podocyte injury. The review suggested ABERRANT, which is not a permissible value in this branch's ModifierEnum; DYSREGULATED is the value that carries the same meaning.

    Added a lean convergence node "Podocyte depletion from programmed cell death" (biological_scale TISSUE) downstream of the four modalities and upstream of "Glomerular filtration barrier failure and proteinuria", so the shared consequence keeps a single target while the modality-specific claims stay on the atomic nodes.

    Replaced two generic GO proxies with the exact terms, which the review verified exist and which just validate-terms now confirms: GO:0006954 inflammatory response was standing in for pyroptosis and is now GO:0070269; GO:0006979 response to oxidative stress was standing in for ferroptosis and is now GO:0097707. The oxidative-stress term in particular asserted something both weaker and different from the cited evidence, since it fires in most forms of podocyte injury whereas ferroptosis is a specific iron-dependent lipid-peroxidation program.

    Repointed the TCM treatment's target_mechanisms from the single bundled node to the four specific modalities, so the graph records which death modality the formulas are evidenced against.

    Trimmed the TCM description to match its evidence and added the missing quote. The description had asserted that three named formulas demonstrated efficacy in improving remission rates with favorable safety compared to conventional immunosuppression, while the attached snippet was the review's generic summary sentence, which names no formula and makes no comparison. The head-to-head comparison is now attributed to Shenqi Particle specifically and backed by a verbatim quote reporting one RCT and one prospective cohort against glucocorticoid plus cyclophosphamide. The description also now records that the trial base is small and predominantly single-country and that TCM for MN is not reflected in current KDIGO guidance.

    Bound the TCM treatment_term, which was previously absent. NCIT:C129986 Traditional Chinese Medicine Formulation is a Pharmacologic Substance rather than a clinical action, so it cannot sit in treatment_term; it is bound as therapeutic_agent under treatment_term NCIT:C15986 Pharmacotherapy.

    Validation: just validate passed; just validate-terms passed, confirming the two new GO terms and the NCIT agent binding; just count-verified-snippets reported 62/62 verified, up from 50/50, with every new snippet an exact substring of the cached reference; no duplicate mapping keys; all pathophysiology downstream targets and treatment target_mechanisms targets verified to resolve against node names, with no dangling reference left to the removed bundled node.

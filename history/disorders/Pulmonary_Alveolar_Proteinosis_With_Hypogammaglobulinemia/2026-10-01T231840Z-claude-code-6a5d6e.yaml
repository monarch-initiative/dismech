  summary: 'Pre-PR review fixes: Pulmonary_Alveolar_Proteinosis_With_Hypogammaglobulinemia'
  details: |
    Pre-PR review fixes. Respiratory insufficiency evidence replaced: the previous snippet was the PMID:29455859 abstract's general definition of PAP; it now cites the PMID:34145065 statement that all six patients had respiratory insufficiency and the PMID:29455859 onset range (39 days to 5 months). That general-PAP sentence is kept on the Alveolar Surfactant Accumulation node and its edge but marked quote_role BACKGROUND, and the edge gained the Table 1 cause-of-death row. Added phenotypes from PMID:34145065 that were missing: Failure to thrive (HP:0001508), Diarrhea (HP:0002014, as a sequela of gastrointestinal inflammation) and mild interstitial lung disease (HP:0006530). Failure to thrive and interstitial lung disease are left unwired because no source attributes them to a mechanism. Added raw-count phenotype frequencies (6/6 from PMID:34145065; leukocytosis 5/5 and splenomegaly 4/5 from PMID:29455859 Table 1) and rewrote the notes sentence that had claimed frequencies were given when none were. Added a diagnosis section (whole exome sequencing NCIT:C101295 with deep sequencing for parental mosaicism, bronchoalveolar lavage NCIT:C38042, chest CT NCIT:C191501, lung biopsy NCIT:C51748). Rebound the skin rash to HP:0000988 Skin rash and corrected the GI preferred_term. Replaced the review's GM-CSF receptor quote, which misnames A76V as A72V, with the primary PMID:34145065 monocyte result (directness INDIRECT, since alveolar macrophages were not assayed). Added GO:0071888 macrophage apoptotic process. Replaced the background-rationale snippet on the translational-arrest to apoptosis edge with experimental findings. Added primary PMID:34145065 evidence for the monocytopenia and hypogammaglobulinemia counts, and corrected the B-cell wording. Dropped the AT2 cell binding from the surfactant node. Added HSCT outcome evidence, including transplant-related deaths. Not taken: splitting the B-cell apoptosis/differentiation node (the source states the two together and gives no ordering between them). Validated: validate, count-verified-snippets (64/64), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-grading/length/title-snippets, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles, check-enum-values and validate-disorders all pass; 11/13 phenotypes causally connected.

  summary: 'Review pass: Pulmonary_Alveolar_Proteinosis_With_Hypogammaglobulinemia'
  details: |
    Review of the initial curation before PR. The Recurrent respiratory infections phenotype quoted a sentence about fever and rash only; replaced it with the full PMID:34145065 sentence that names viral-like airway infection, and added the PMID:29455859 statement that onset resembled a viral infection. Added evidence to the Hypogammaglobulinemia to Recurrent respiratory infections sequela. Wired Monocyte and Macrophage Apoptosis to Myeloid-Driven Systemic Autoinflammation (which previously had no inbound edge) and to the monocyte-count phenotype, so all 10 phenotypes are now causally connected. Marked the translational-arrest-to-apoptosis rationale sentence as quote_role BACKGROUND. Rebound HSCT from NCIT:C15431 to the more specific NCIT:C46089 Allogeneic Hematopoietic Stem Cell Transplantation, and whole lung lavage from NCIT:C38042 Bronchoscopy with Bronchoalveolar Lavage (a bronchoscopic diagnostic procedure, not therapeutic whole lung lavage) to NCIT:C38068 Lavage, matching Autoimmune_Pulmonary_Alveolar_Proteinosis; both terms looked up via OLS and present in the term and enum caches. Added conforms_to innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT Signaling on the interferon-induced OAS1 expression node. Correction to the CREATE record: PMID:29185156 is not cited by the entry. The single openscientist report was not re-run. Validated: validate, count-verified-snippets (46/46), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, snippet length/title/grading, environmental evidence, folded hyphens, coarse phenotypes, check-genereviews (NO_CHAPTER) and validate-disorders all pass. preflight-dr exited 2 because the local MONDO build is absent.

  summary: 'Create: Pulmonary Alveolar Proteinosis With Hypogammaglobulinemia'
  details: |
    De novo curation of PAPHG (OAS1-associated polymorphic autoinflammatory immunodeficiency / OPAID, MONDO:0020840), an autosomal dominant inborn error of immunity caused by heterozygous gain-of-function OAS1 missense variants. Curated the OAS1 gain-of-function to RNase L overactivation to monocyte/macrophage and B-cell apoptosis pathophysiology chain (9 nodes), wired through to pulmonary alveolar proteinosis, respiratory insufficiency, hypogammaglobulinemia, recurrent infection, autoinflammatory fever/rash/GI features, splenomegaly and leukocytosis; genetic (OAS1 CAUSATIVE, DE_NOVO, RNASEL as the downstream effector gene), autosomal-dominant inheritance (HP:0000006) with maternal-mosaicism note, ultra-rare CASES_IN_LITERATURE prevalence, treatments (allogeneic HSCT curative, whole lung lavage bridge, IVIG), and the exact MONDO mapping. Evidence from the two primary human genetic series (PMID:29455859 Cho 2018, PMID:34145065 Magg 2021) plus the 2026 OAS-RNase L review (PMID:41512080) and two HSCT/lavage case reports (PMID:34647697, PMID:29185156). One openscientist deep-research report was produced for this disease (research/Pulmonary_Alveolar_Proteinosis_With_Hypogammaglobulinemia-deep-research-openscientist.md; 19/19 citations verified, correct-disease) and used as corroborating leads alongside direct PubMed curation of the primary sources. Validated: just validate, count-verified-snippets (42/42), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms(-online), check-snippet-length/-title-snippets/-snippet-grading/-environmental-evidence/-folded-hyphens/-coarse-phenotypes, check-genereviews (NO_CHAPTER), and the batched validate-disorders all pass; 9/10 phenotypes causally connected (monocytopenia left as a lab readout).

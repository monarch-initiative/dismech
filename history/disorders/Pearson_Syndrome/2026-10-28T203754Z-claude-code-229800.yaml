  details: |
    Addressed the 2026-10-24 review. Split the bundled Exocrine Pancreatic and Multisystem Energy Failure node into Pancreatic Acinar Dysfunction, Proximal Tubular Dysfunction and Hepatic Dysfunction, each fed from the OXPHOS node, and moved the Lactic acidosis edge onto the OXPHOS node. Exocrine pancreatic insufficiency now has Failure to thrive as a sequela. Removed the unsupported pancreatic fibrosis claim. Added Hypotonia, Elevated hepatic transaminases, Hepatomegaly, Short stature, Cardiac conduction defect, Diabetes mellitus and Adrenal insufficiency, quoting GeneReviews PMID:20301382 and the Yoshimi 2022 review PMID:36253820 (prose and Table 1 rows). Added frequency bands where a quotable sentence or Table 1 row supports them. Marked edges whose snippets only list phenotypes as directness INDIRECT and reworded their explanations so they no longer claim the mechanism. Dropped GO:0032042 from the trigger node and tagged it MOLECULAR. Added the GeneReviews and Yoshimi agents-to-avoid statements to the supportive-care treatment and a MONITORING surveillance treatment (CBC for transfusion needs, ferritin, fecal fat and elastase). Added PMID:7794775 and PMID:29337599 to references. Restored references_cache/PMID_36253820.md to the main copy. Sodium bicarbonate and HSCT were not added: the bicarbonate sentence in the cached full text is split mid-word by PDF extraction, and HSCT evidence in the review is limited to case reports with high transplant mortality. just validate passes (57/57 snippets).

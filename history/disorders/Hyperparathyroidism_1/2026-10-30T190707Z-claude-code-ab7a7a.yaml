  summary: 'Create: Hyperparathyroidism_1'
  details: |
    New entry for MONDO:0007767 hyperparathyroidism 1 (OMIM 145000), the CDC73-related form of familial isolated primary hyperparathyroidism. Lump/split: curated as a DISEASE entry restricted to the isolated presentation. MONDO and OMIM keep it separate from hyperparathyroidism-jaw tumor syndrome (OMIM 145001, MONDO:0007768), which has no KB entry; HPT-JT is described in notes rather than modelled as a subtype, because it is a distinct MONDO term and not a subtype of FIHP. GeneReviews CDC73-Related Disorders (PMID:20301744) is the tagged phenotype baseline; its jaw, renal and uterine features and its HPT-JT carcinoma frequency are recorded in notes as out of scope. Causal chain: germline CDC73 first hit, somatic second hit, loss of parafibromin and the PAF1 complex, loss of antiproliferative and proapoptotic control, chief cell neoplastic proliferation, autonomous PTH hypersecretion, conforming to germline_two_hit_tumor_predisposition; all six phenotypes are causally connected. Germline and somatic variant_origin follow the convention in Parathyroid_Gland_Carcinoma. ClinGen gene_disease_validity was not recorded because the only CDC73 ClinGen assertion is for MONDO:0007768. Curation started from PubMed; the openscientist deep-research report was then read and used. Its recipe exited 3 because term validation timed out against OLS (5 s read timeout), so reference and term validation sections were added with validate-research-reference and validate-research-terms (the latter needed several retries). Reference validation: 31/31 resolved, 0 unresolved, 0 off topic; quotes not checked. Term validation: 0 unresolved, 9 labelled as different terms (notably HP:0008207 offered for primary hyperparathyroidism is Primary adrenal insufficiency, and HP:0010766 offered for jaw neoplasm is Ectopic calcification; neither was used), 1 obsolete GO term. preflight-dr PASS (CDC73 mentioned 76 times, OMIM 145000 matches). The report treats HRPT1 as the whole CDC73 spectrum including HPT-JT; only claims applicable to the isolated form were taken, from PMIDs 16487440, 29142233, 32590342 and 34157106. Validation: just validate, validate-terms, count-verified-snippets (56/56), entity-ref, causal-target, coarse-phenotype, qualifier-term, enum, duplicate-key, block-scalar, logical-rule and gene-term checks, the whole-tree gates, and validate-disorders all passed.

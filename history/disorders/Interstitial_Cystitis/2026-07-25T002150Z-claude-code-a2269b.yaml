  summary: 'Create: Interstitial Cystitis'
  details: |
    De novo curation of Interstitial Cystitis/Bladder Pain Syndrome (IC/BPS, MONDO:0018301), triggered by knowledge-gap-scan issue #6057 (PMID:42399658, Jee et al. Exp Mol Med 2026, stromal-immune-vascular crosstalk). Deep research performed via the claude_code provider (just research-disorder claude_code Interstitial_Cystitis); the falcon (Edison) provider was also attempted but failed with a 402 Payment Required billing error and produced no report. Modeled two convergent pathophysiology streams: a urothelial-centric arm (GAG barrier dysfunction -> leaky urothelium -> mast cell activation/degranulation -> neurogenic inflammation -> central sensitization) and an HLA class II-associated autoimmune arm specific to the Hunner-lesion subtype (HLA-DQB1/HLA-DPB1 peptide-binding-groove risk alleles -> pancystitis with clonal B-cell expansion and epithelial denudation), both converging on chronic pelvic/bladder pain, with TLR4-dependent nociception evidence from a URO-OVA autoimmune-cystitis mouse model on the convergence edge. Curated has_subtypes (Hunner-lesion vs non-Hunner-lesion IC/BPS), 6 phenotypes, 4 genetic risk factors (HLA-DQB1, HLA-DPB1, ATP2C1, ATP2A2 -- the latter two from a 2025 medRxiv preprint exome study, cited as such), 2 environmental factors, structured RAND RICE prevalence data, and 6 treatments with target_mechanisms links. All 13 PMIDs fetched and cached via just fetch-reference; every evidence snippet is an exact quote verified against the cached abstract/full-text. Ontology terms (MONDO, HP, CL, GO, HGNC, CHEBI, NCIT, MAXO) verified via OAK. The MONDO disease_term enum cache lacked this newly-added term because the repo's configured ols:mondo OAK adapter does not implement ancestors/descendants graph traversal in the installed oaklib version (a known linkml-term-validator/oaklib OLS limitation, not a data issue) -- worked around by one-time progressive-mode cache population using a local sqlite:obo:mondo adapter (verified via runoak to give the same true ancestry: MONDO:0018301 is-a chain to MONDO:0000001 disease), after which standard validate-terms with the committed ols:mondo config passes from cache. just validate (schema + terms + references), just validate-graphs, and just compliance (100% weighted) all pass.

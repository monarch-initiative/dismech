  summary: Add temperature-sensitivity (TRPM8 cold-channel) mechanism and phenotype
  details: |
    Added a new MOLECULAR pathophysiology node, TRPM8 Cold-Sensing Channel Upregulation on Bladder Sensory Afferents (gene TRPM8/hgnc:17961, cell type CL:3000004 peripheral sensory neuron, process GO:0050965 detection of temperature stimulus involved in sensory perception of pain), evidenced by human bladder-biopsy TRPM8 upregulation correlating with pain severity (PMID:33045289, HUMAN_CLINICAL) and a TRPM8-knockout mouse mechanistic study showing Akt/mTOR-mediated afferent sprouting and pain hypersensitivity (PMID:39528242, MODEL_ORGANISM); downstream DIRECT edge into the existing Neurogenic Inflammation and Peripheral Sensitization node. Also added a new phenotype, Cold-Induced Bladder Allodynia (HP:0012533 Allodynia), evidenced by a human ice-water-test study showing 76.5% of IC/BPS (PBS) patients report significant pain on cold intravesical instillation versus none of the controls or bladder-overactivity comparison groups (PMID:17192176, HUMAN_CLINICAL). All 3 new PMIDs fetched via linkml-reference-validator cache reference; snippets manually verified as exact substrings of the cached text. just validate (schema + terms + references) passes.

  summary: Add oligodendrocyte silencer-loss hypothesis, OpenScientist exploration
    and its assessment
  details: |
    Added the mechanistic hypothesis oligodendrocyte_silencer_loss_model (status
    EMERGING, scoped to the Upstream Deletion-Related ADLD subtype), commissioned an
    OpenScientist dataset-anchored exploration of it against 4D Nucleome data,
    assessed that report, and curated the one paper the exploration surfaced that
    this entry did not already cite.

    Why the hypothesis block. The entry already modelled both published mechanisms
    for the upstream deletions as pathophysiology nodes - Forebrain Enhancer
    Adoption and Loss of Oligodendrocyte-Specific LMNB1 Silencer Control - without
    recording that they are competing explanations advanced by different groups for
    the same deleted interval. PMID:39910058 states that whether silencer loss alone
    is sufficient is open; PMID:39078102 reports a boundary-crossing inter-TAD
    duplication that caused no disease, which argues boundary loss is not sufficient
    either. The hypothesis group records that contention explicitly so the competing
    edges can be grouped and so the open question is queryable rather than implicit
    in two node descriptions. Status is EMERGING, not ALTERNATIVE or CANONICAL: the
    silencer evidence is a mouse oligodendrocyte-lineage line plus reporter assays,
    with no human oligodendrocyte measurement.

    The provider run. templates/hypothesis_deep_research_datasets.md, job
    36689e2d-5f95-4ab5-b97d-4d3c31c3d1d2, 34 minutes, seeded with five 4DN dataset
    groups resolved against the portal beforehand. Recovered into canonical paths
    with scripts/hypothesis_deep_research.py fetch rather than re-run, so the
    committed report is the job that actually ran; term validation was then applied
    as the run path would have. The provider bundle held only HTML and PDF
    renderings of the report, so it is not committed and both of the report's
    analyses are assessed REPORTED_ONLY / UNVERIFIABLE.

    What the exploration was worth. Its central conclusion is correct and useful:
    every supplied dataset is wild type, the hypothesis concerns the counterfactual
    effect of deleting the silencer, so no wild-type-only dataset can settle it. The
    decisive experiment needs an ADLD allele in an oligodendrocyte-lineage cell and
    no such public dataset exists. That is a documented data absence rather than a
    curation gap. It also surfaced PMID:39078102, patient chromosome-conformation
    capture, RNA-seq and postmortem histopathology across more than twenty families,
    which this entry did not cite.

    Evidence added, all quotes verified against the fetched cache:
    - Forebrain Enhancer Adoption node: the forebrain-specific misexpression result
      from inter-TAD deletions or duplications.
    - Astrocyte LIF-Support Dysfunction node: the astrocyte result, which that
      node's own description had flagged as needing patient-tissue corroboration.
      Marked directness INDIRECT because it does not test the LIF/LIF-receptor axis
      the node names.
    - Hypothesis block: the non-pathogenic boundary-crossing duplication, as the
      asymmetry that keeps the silencer model in contention.

    Assessment and independent replication. The provider deposited no code, so its
    two analyses were re-run independently from the same public files; the scripts
    and their outputs are committed beside the assessment. The RNA-seq result
    reproduces (astrocyte, excitatory-neuron and microglia medians identical; the
    7-versus-8 oligodendrocyte count difference is one set with no openly mirrored
    table). The HiChIP result reproduces in direction under an independently defined
    metric, and the report's own single-donor values fall outside its later
    eight-donor ranges, so its normalization changed between iterations without
    being redefined. Defects recorded: a malformed candidate identifier
    (GO:0006classes), which the term validator structurally cannot catch because it
    is never extracted as a CURIE; and 42 sets described as openly mirrored where 40
    carry an open-data URL.

    One lead not promoted. Splitting the oligodendrocyte RNA-seq samples by
    mature-myelin marker level reverses the within-donor direction (myelin-high
    donors 0.31, 0.31, 0.64; myelin-low 0.87 to 1.75), which is what a silencer
    acting in mature oligodendrocytes would predict. It stays in the assessment and
    out of the entry: n=7 donors and the split is perfectly confounded with donor
    cohort and sampled region. A single-nucleus dataset resolving precursors and
    mature oligodendrocytes within the same donors would separate the two.

    Validation: just validate, count-verified-snippets (127/127 before the
    hypothesis block, re-run after), validate-terms, validate-disorders,
    validate-hypothesis-assessment, and the offline kb gates.

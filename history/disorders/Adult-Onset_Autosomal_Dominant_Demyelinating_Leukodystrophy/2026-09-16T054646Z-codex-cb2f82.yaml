  summary: Separate LMNB1 structural lesions, regulatory hypotheses, and expression
    findings
  details: |
    Audited the mechanism chain for the three curated regulatory structural variants. Added separate initiating nodes for the upstream deletion class and inverted duplication with controlled variant_type and genomic_contexts under genetic_context. Kept the deletion target LMNB1 distinct from physically deleted neighboring genes. Split the prior enhancer-adoption root into a physical lesion and a HYPOTHETICAL enhancer mechanism, and represented the inverted-duplication chromatin contact as a separate HYPOTHETICAL computational prediction. Renamed the shared silencer node to loss of silencer control because inverted duplication retains the silencer DNA; marked the human mechanism PROVISIONAL and grounded it with indirect mouse-cell deletion/reporter evidence. Added GO gene expression with modifier INCREASED to the measured LMNB1 overexpression node, preserving the actual frontal-brain and fibroblast measurements and the unchanged peripheral-blood result for the independent 249 kb deletion. No GOE classification was inferred from quantitative expression changes. Updated the existing discussion foreign key after renaming the physical deletion node. Reused verified reference caches without modification. Independent review removed a misleading REFUTE grade because unchanged blood expression in another carrier does not refute the tissue-scoped positive findings. Reinspection of the 2015 full text classified its enhancer interpretation as composite indirect evidence from cultured-fibroblast 4C, cultured-cell reporters, and embryonic mouse assays, separate from direct human postmortem expression. Fast snippet audit verified 122 of 122 snippets including DOI; final batched validation is coordinated by the parent agent.

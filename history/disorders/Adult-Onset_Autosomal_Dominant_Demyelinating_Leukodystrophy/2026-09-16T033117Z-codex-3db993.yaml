  summary: Curate three LMNB1 structural variants with regulatory effects
  details: |
    Added allele-level records for the approximately 660 kb ADLD-1-TO upstream deletion, the independent 249 kb Japanese-family deletion, and the approximately 475 kb inverted duplication. Separated physical SV type and coding/intronic/intergenic overlap from the regulatory effect on LMNB1; the upstream deletions spare LMNB1 but can remove neighboring genes. Recorded unchanged peripheral-blood LMNB1 expression for the 249 kb deletion and distinguished measured fibroblast expression from computationally predicted silencer contacts for the inverted duplication. Qualified enhancer adoption as a proposed contributor whose necessity remains unresolved alongside experimentally supported silencer loss. No LOE/GOE category was forced onto increased expression in normally expressing cells. Primary papers and existing generated reference caches were inspected; the original 2015 reference was regenerated with just fetch-reference and remained abstract-only, while its publicly available full text supplied coordinates and neighboring-gene content. Schema, term, and reference validation passed. The default cached snippet audit verified 96 of 114 snippets with 18 existing skipped-prefix items; explicitly including DOI verified all 114 of 114 snippets. Final batched validation is handled with the complete curation tranche.

  details: |
    Populated the new oligonucleotide_details block on this entry's siRNA treatment(s), which previously carried mechanism and delivery platform only as free text in the treatment description. Recorded oligonucleotide_mechanism RNAI_KNOCKDOWN, target_gene (HGNC id reused from an already-validated binding elsewhere in the KB rather than looked up fresh), target_transcript, and — where the drug is approved and the platform documented — conjugation plus delivery_platform. Added dosing_interval / dosing_interval_days for approved agents whose maintenance interval is a label fact. Intervals not sourceable from the reference cache were left empty rather than guessed (plozasiran). Delivery and chemistry left unset for preclinical or allele-selective proof-of-concept siRNAs, where no platform has been chosen. oligonucleotide_chemistry was left unset throughout: stabilized siRNA duplexes mix 2'-OMe and 2'-F, and the slot is single-valued, so populating it would force an unsourced choice. Validated with just validate.

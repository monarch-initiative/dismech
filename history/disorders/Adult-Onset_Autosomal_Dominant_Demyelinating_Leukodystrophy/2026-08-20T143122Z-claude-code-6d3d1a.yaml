  summary: Bind MONDO:0700286 (atypical ADLD) as a subtype term and curate the LMNB1
    upstream-deletion form
  details: |
    Scoping decision (option a). Issue #8951 targeted MONDO:0700286 "leukodystrophy, demyelinating, adult-onset, autosomal dominant, atypical". MONDO records it as is_a MONDO:0008215 with xref OMIM:621061 (ADLDAT). OMIM 621061 is the LMNB1 upstream-deletion form, and OMIM has correspondingly retitled 169500 as ADLDTY (typical, LMNB1 duplication). The existing entry already carried an "Upstream Deletion-Related ADLD" has_subtypes stub for exactly this entity, so the correct deliverable was to bind and enrich that subtype, not to open a new Disease entry. A separate entry would have duplicated the shared LMNB1 gain-of-expression pathograph while splitting a phenotype contrast that only reads as a contrast when both forms sit in one file.

    Deep research. Reused research/Adult-Onset_Autosomal_Dominant_Demyelinating_Leukodystrophy-deep-research-falcon.md as LEADS ONLY. "just preflight-dr" returned SKIP because MONDO records no RO:0004003 causal gene for this term. Manual section 2b fallback: gene check passed (LMNB1 dominates at 69 mentions against 3 for the next-highest); the OMIM check showed report=169500 against MONDO xref=621061, which is the documented parent/child relation rather than a wrong entity, and the report's atypical arm cites Nmezi 2019 and Giorgio 2015 correctly. No Named Entity Confusion. All curated evidence was taken from directly fetched primary abstracts and PMC full text, not from the report.

    Content added.
    - external_assertions: OMIM:621061 (ADLDAT) added; the OMIM:169500 description clarified as the typical form.
    - has_subtypes "Upstream Deletion-Related ADLD": bound subtype_term MONDO:0700286, added display_name, classification, an LMNB1 gene descriptor, an autosomal-dominant Inheritance block, an expanded description recording the lump-versus-split rationale, and four new evidence items.
    - has_subtypes "LMNB1 Duplication-Related ADLD": added display_name, classification, and gene descriptor for symmetry.
    - pathophysiology: enriched "Enhancer Adoption From Upstream Deletion" (TAD-boundary critical region, Alu/LINE repeat-mediated origin, increased LMNB1 in patient cells) and added a new node "Loss of the Oligodendrocyte-Specific LMNB1 Silencer Element" from PMID:39910058 (Nat Commun 2025), the CTCF/PRC2 element whose loss unifies the duplication and deletion routes and supplies the otherwise unexplained oligodendrocyte specificity.
    - phenotypes: four subtype-scoped entries (hypophonia at presentation, dysarthria, limb muscle weakness, and a deliberate negative-contrast entry for absent early autonomic involvement).
    - imaging_findings: three subtype-scoped entries (corticospinal-tract hyperintensity with its caudal-extent contrast, cord sparing below the uppermost cervical level, temporal-lobe white-matter burden).
    - genetic: new subtype-scoped "LMNB1 upstream regulatory deletion" record with the 250-670 kb nonrecurrent noncoding size range and the exome-sequencing blind spot that follows from the lesion being noncoding.
    - progression: an earlier-onset phase for the deletion subtype (32 to 52 years).
    - diagnosis: PMID:40933505, the 2025 modified-Delphi consensus practice guideline, on high-resolution structural-variant testing over exome sequencing.
    - discussions: new KNOWLEDGE_GAP gap_adld_deletion_dysautonomia_spinal_cord asking whether spinal-cord sparing explains the absent early dysautonomia. It records that the source labels this a hypothesis built on a prior hypothesis and resting on spinal MRI from two deletion carriers, and that a second family contradicts the cerebellar-sparing half of the atypical definition. Includes a proposed genotype-stratified imaging and autonomic-phenotyping study.

    Frequency qualifiers were deliberately omitted on every new phenotype: the deletion cohorts number 5 and 2 patients and no source supports an HPO frequency band.

    Validation. just validate PASS. just validate-terms PASS (MONDO:0700286 newly resolved into cache/mondo/terms.csv and the diseaseorsubtypeterm enum cache by the validator). just count-verified-snippets: 86/104 verified against cached references, 18 skipped by DOI prefix, zero failures. just check-duplicate-keys PASS. scripts/check_snippet_length.py, scripts/check_folded_hyphens.py, scripts/check_title_snippets.py all PASS. just validate-disorders PASS.

  details: |
    Added measurements: LOINC:42641-1 (Babesia sp DNA [Presence] in Specimen by NAA with probe detection) to the NAAT row, and LOINC:43926-5 (Babesia sp Ab [Presence] in Serum) to the serology row. Both codes are genus-level and method/Ig-class-unspecified, matching the rows' own generic 'species-appropriate' / 'validated nucleic acid amplification test' framing rather than committing to a species (e.g. B. microti-specific) or Ig class the rows do not assert. Labels verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch13 (LOINC_DIAGNOSTICS.md tranche B).

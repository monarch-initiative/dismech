  summary: 'Review round 1: correct HLH and splenic rupture descriptions against source'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #11780.

    Both new phenotype descriptions contradicted the full text of PMID:28202022, which this PR had itself committed.

    Splenic rupture: the description said the complication is reported mainly in splenectomized, asplenic or immunosuppressed patients with high-grade parasitemia. The source concludes the opposite - 'It is reasonable to conclude from published cases of splenic rupture that this is a complication of the immunocompetent individual' - and the sentence was internally incoherent, since an asplenic patient has no spleen to rupture. Rewritten to state the immunocompetent-host finding and the mechanism the paper actually proposes: subclinical splenomegaly from splenic erythrophagocytosis rendering the spleen susceptible to rupture with minor trauma. Dropped the high-grade parasitemia claim; the source records that parasitemia in the immunocompetent host rarely exceeds 5 percent.

    Hemophagocytic lymphohistiocytosis: the description claimed high-grade parasitemia as the trigger and immunosuppression as the usual host context. The source's Table 2 records parasitemias of 7, 13, 3, under 1, and 4 percent across the reported cases, and the cases span both immunocompetent hosts and two with an immunosuppressive context. Rewritten to reflect the reported range and the mixed host context, consistent with the caveat this entry already carries that not all subjects with end-organ dysfunction had high-grade parasitemia.

    HP:0012156 binding retained with a notes block recording the rationale, following the precedent in Immunodeficiency_69. Confirmed via OLS that HPO has no hemophagocytic lymphohistiocytosis class and that HP:0012156's own definition names hemophagocytic syndrome. Recorded that hemophagocytosis is one of the eight HLH-2004 criteria rather than a superclass of HLH, and that the paper's index case showed dyserythropoiesis rather than hemophagocytosis on bone marrow biopsy.

    Connected both orphan phenotypes to the pathograph. Added a downstream edge from Parasitemia-associated multisystem dysfunction to Hemophagocytic lymphohistiocytosis, and a sequelae edge from Splenomegaly to Splenic rupture, which is the mechanism the paper proposes. Both are bare-name targets, per the pathograph convention. Each carries its own evidence quoting the cached full text.

    Validation: just validate passed with 156/162 snippets verified (6 skipped by prefix); check-causal-targets, check-entity-refs, check-duplicate-keys and validate-terms all clean. check-title-snippets reports 6 findings, all in unrelated files and all present on the pristine branch before these edits - stale-branch artifacts against the origin/main baseline, not introduced here.

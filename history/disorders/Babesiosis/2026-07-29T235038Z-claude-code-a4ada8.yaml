  summary: Add prevalence, hemolytic-anemia module conformance, severe phenotypes,
    and prevention
  details: |
    Enhancement pass on an already-mature entry (compliance was already 100% on all tool-checked recommended fields), so work targeted genuine content gaps rather than field coverage.

    Added:
    - prevalence: the block was entirely absent. Two structured records: Orphanet European point prevalence (BELOW_1_IN_1000000) and CDC peak U.S. state annual reported incidence (Rhode Island, 18.0 per 100,000 in 2015, BAND_1_5_PER_10000). Notes explicitly flag the CDC figure as a reported-case lower bound, not seroprevalence or a true infection rate, since asymptomatic infection and 27 non-reporting states are uncaptured.
    - conforms_to on the 'Babesia-mediated erythrocyte lysis' node -> hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction. Babesiosis reaches the conserved destruction step by an infectious route (direct parasite-mediated lysis plus splenic removal of parasitized cells); the shared step is the destruction, not the upstream cause. This is the first infectious conformer to that module, which previously held only hereditary causes.
    - phenotypes: Myocardial infarction (HP:0001658), Coma (HP:0001259), Anorexia (HP:0002039), each with a matching downstream causal edge on the appropriate pathophysiology node.
    - treatments: tick-bite avoidance counseling (NCIT:C181743 Behavioral Counseling, COUNSELING_INFORMATIONAL/BEHAVIORAL). There is no babesiosis vaccine, so this was the one absent arm of management. It was initially given a target_mechanisms edge to the host-entry trigger node; tests/test_data.py::test_non_therapeutic_actions_do_not_use_treatment_targets correctly rejected that, since informational actions do not themselves act on the pathograph. The edge was removed and the mechanistic link (avoidance behavior prevents the inoculation event) is stated in the description prose instead.
    - Enriched the 'Impaired host clearance and persistent parasitemia' node with CDC risk-factor evidence. The specific risk set is mechanistically informative: B-cell lymphoma and rituximab implicate humoral immunity alongside the CD4/IFN-gamma cellular arm that the existing mouse evidence covers.

    Deliberately NOT added, with reasoning recorded in review_notes:
    - Congestive heart failure and venous thrombosis/hypercoagulability are in the Orphanet phenotype table, but CDC lists congestive heart failure as a predisposing risk factor for severe babesiosis. Asserting it as a manifestation would invert the causal direction, so it is described in the host-clearance node instead.
    - Photophobia, depression, recurrent pharyngitis, limitation of joint mobility, and clinodactyly of the 5th toe were left out as implausible for an acute protozoal infection and most likely Orphanet annotation noise.

    Incidental fix: one pre-existing MMWR evidence snippet was not an exact substring of its cached source. The cached PDF text hyphenates 'black-legged' across a line break, so the quoted string was never contiguous. It went undetected because 'DOI' is listed in the reference validator's skip_prefixes, meaning CI never checks DOI-referenced snippets. The snippet was trimmed to the verifiable portion and the explanation now carries the remaining context.

    Validation: linkml-validate schema OK; term validator OK (--labels, OAK-backed); all 156 evidence snippets verified as exact whitespace-normalized substrings of their references_cache files via an ad-hoc checker, because the repo reference validator reported 'Total checks: 0' in this environment on every file tried, including untouched established entries such as Hereditary_Spherocytosis. That validator limitation is environmental and pre-existing, not caused by this change.

    Post-MAXO-retirement reconciliation. Main retired MAXO entirely (#7228, commit 0729e8e5b): cache/maxo/ was deleted and the treatmentactionterm enum was re-rooted on NCIT:C25218, so this branch's two cache edits became obsolete and were dropped. Main independently remapped the four pre-existing MAXO bindings in this entry (blood smear, NAAT, serology, blood transfusion) and those merged cleanly. The one binding this branch introduced, MAXO:0000043 communicable disease avoidance, was not in the frozen crosswalk docs/superpowers/maxo_ncit_final_map.tsv because the branch postdates the freeze; it was first migrated to NCIT:C15900 Lifestyle Therapy and is now NCIT:C181743 Behavioral Counseling, which matches the treatment's action_category COUNSELING_INFORMATIONAL and follows the crosswalk precedent MAXO:0000077 behavioral counseling -> NCIT:C181743. The preferred_term was also updated from the retired MAXO label to 'tick-bite avoidance counseling'.

    Prevalence-note correction (credit to the merge commit on this branch): an earlier revision of the CDC prevalence note claimed '27 states that did not report babesiosis', which was not sourced. The MMWR footnote states babesiosis is not a reportable condition by law in exactly 10 states (Alaska, Colorado, Hawaii, Idaho, Mississippi, Nevada, New Mexico, North Carolina, Oklahoma, Pennsylvania); it was reportable in 41 states during 2011-2019, 37 reported cases, and 10 met the trend-analysis inclusion criteria. The long state list in the figure legend is 'did not meet inclusion criteria for the analysis', not 'did not report'. The corrected wording is retained.

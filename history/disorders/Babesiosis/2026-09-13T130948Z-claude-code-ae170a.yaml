  summary: 'Add HLH and splenic rupture phenotypes (issue #6309)'
  details: |
    Added two phenotype entries surfaced by the parasitic-disorders review tracker (#6309), which flagged Babesiosis as lacking dedicated HLH/ARDS/splenic-rupture phenotype nodes despite the already-cached PMID:28202022 abstract naming both. Hemophagocytic lymphohistiocytosis is bound to the closest available broader HP term (HP:0012156 Hemophagocytosis; HPO has no dedicated HLH term) with preferred_term carrying the specific name, mirroring the SSPE-in-Measles precedent from PR #9127. Splenic rupture is bound exactly to HP:0012223. Both cite the same already-cached PMID:28202022 sentence used by the existing DIC phenotype entry in this file, so evidence_source (HUMAN_CLINICAL) stays consistent across all three uses of that quote. No frequency: band was assigned to either new phenotype since the source gives no quantitative frequency -- deliberately avoiding the exact 'unsupported frequency band' pitfall the same issue's Section B calls out. Validated with just validate, just validate-disorders (154/160 snippets verified, 6 skipped by prefix), just count-verified-snippets, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-duplicate-keys, check-entity-refs, check-not4curation, and pytest tests/test_data.py -k Babesiosis (2 passed). Chagas_Disease and Babesiosis were the only two entries in #6309's checklist with no open PR against them; this addresses one bounded item within Babesiosis (HLH/splenic-rupture phenotypes) and leaves the remaining Babesiosis gaps (Lyme/anaplasmosis co-infection modeling, asplenia as an explicit risk-factor annotation beyond prose, severity-mechanism nodes) and all of Chagas_Disease for a future tranche.

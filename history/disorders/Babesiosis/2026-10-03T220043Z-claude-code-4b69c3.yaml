  summary: Rung-3 lump/split review (#10115, design decisions §3e)
  details: |
    Rung-3 lump/split review of the five Babesia agents against the six differentiating axes of design decisions section 3e (R7-R12). Outcome: four subtypes added, on the species axis (classification: etiologic_species). B. microti - geography (north-eastern and northern midwestern United States, plus China), rodent reservoir, Ixodes scapularis vector; PMID:34832603, PMID:28202022. B. divergens - European geography, cattle reservoir, Ixodes ricinus vector, and the decisive severity and at-risk-population difference, fulminant disease almost exclusively in asplenic patients; PMID:34832603, PMID:28202022. B. duncani - far-western United States geography against B. microti's range elsewhere in the country; PMID:29445365 (quote is that mouse study's introduction describing human case distribution, so graded HUMAN_CLINICAL with quote_role BACKGROUND). B. venatorum - Europe plus endemic transmission in Heilongjiang province, north-eastern China, and milder presentation than B. divergens; PMID:34832603. PMID:34832603 was newly fetched for this review. The genus-level 'Babesia' agent record is not a stratum and was left alone. No MONDO class names a species-level babesiosis variant (searched ols:mondo for 'Babesia microti' and 'Babesia divergens', both returning nothing), so subtype_term is omitted on all four rather than bound to the parent MONDO:0005661, per R12; the checker reports these as UNBOUND_SUBTYPE, which is the expected advisory state. disease_term, pathophysiology and infectious_agent bindings were not touched. Validated: just validate (170/170 snippets), just validate-terms, just check-granularity (TAXON_LUMP cleared).

  summary: 'Create: SSR4-Congenital Disorder of Glycosylation'
  details: |
    New entry for SSR4-CDG (CDG-Iy, MONDO:0010490, OMIM:300934, ORPHA:370927), X-linked recessive, SSR4 (hgnc:11326, verified against the HGNC REST API). Deep research: one Perplexity report, research/SSR4-Congenital_Disorder_of_Glycosylation-deep-research-perplexity.md (model sonar-deep-research, run through the streaming transport shim used as the dismech#9357 workaround). Its reference validation resolved 8/8 references with 7 judged on topic; the one not on topic is PMID:40066443 (SSR4 as an esophageal squamous cell carcinoma biomarker) and is not cited. just preflight-dr returned WARN only because it read the disease acronyms SSR4-CDG/CDG as second genes, a false positive. The report was used as a lead only; its HPO suggestions include ten mislabelled CURIEs and none were bound without a fresh lookup. References were re-derived from a PubMed esearch on SSR4 and glycosylation/TRAP (32 hits) and fetched with just fetch-reference: the founding case (PMID:24218363), the 2015 eight-male series with fibroblast western blots (PMID:26264460), the 22-patient review (PMID:38805916), the 28-case systematic review (PMID:41960028), the connective-tissue series (PMID:33300232), later case reports on splice, frameshift and in-frame alleles (PMID:39653760, 41210240, 41441028, 42463952), the CDG cardiomyopathy series (PMID:38917675), the TRAP knockout cell study (PMID:33523898) and a TRAP review (PMID:32453970). Chain: SSR4 Loss of Function -> TRAP Complex Destabilization -> Reduced N-Glycosylation Efficiency at the Translocon -> type I transferrin profile, a multisystem neurodevelopmental hub and a connective-tissue node, with an unwired ER stress branch. The TRAP destabilisation node carries a REFUTE item from engineered knockout cells that retain the other subunits. 25 HP-bound phenotypes, all causally wired. GeneReviews: the only chapter is the retired N-linked overview (PMID:20301507), tagged as in the COG4-CDG entry. Validation: just validate, validate-terms, count-verified-snippets (88/88), check-entity-refs, check-causal-targets and check-duplicate-keys pass.

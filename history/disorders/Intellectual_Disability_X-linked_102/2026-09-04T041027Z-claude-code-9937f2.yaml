  summary: 'Create: Intellectual_Disability_X-linked_102'
  details: |
    De novo curation of the DDX3X-related neurodevelopmental disorder (MONDO:0010497, MRX102, Snijders Blok type) from a single Edison/falcon deep-research report plus independent literature retrieval. The seed placeholder file was replaced entirely.

    Source screening. research/Intellectual_Disability_X-linked_102-deep-research-falcon.md passed `just preflight-dr` against MONDO:0010497 (PASS; DDX3X mentioned 68 times; OMIM 300958 agreeing between MONDO and the report). The preflight had to be run manually because the report's frontmatter carries an empty mondo_id (dismech#10335). The report's reference_validation reports 13/13 resolved and its term_validation 34/36 resolved with 2 unverifiable (OMIM, ORPHA prefixes, which have no resolver).

    Three defects in that report were found and corrected rather than propagated.
    1. The report cites DOIs only and no PMIDs. Each DOI actually used was resolved to its PMID via a PubMed [DOI] esearch and cited as PMID:, so no evidence item sits on the DOI: prefix that reference-validation CI skips.
    2. Two proposed HPO bindings name the wrong term while the report's own Term Validation section reports them clean. The report offers HP:0007370 labelled 'Abnormality of the corpus callosum'; HPO's canonical label is 'Aplasia/Hypoplasia of the corpus callosum'. It offers HP:0001344 labelled 'Severe expressive language delay'; HP:0001344 is 'Absent speech', a different clinical concept. Every HP, GO, CL, UBERON and NCIT CURIE bound in this entry was independently re-derived against the EBI OLS4 API before use, and the canonical label copied from there.
    3. The report proposes MONDO:0018709 as the disease term rather than the MONDO:0010497 the curation queue targets, and attributes the anxiety/self-injury comparative study to the wrong first author. The correct source is Ng-Cordell et al. 2023 (PMID:35536379), which is what is cited.

    Claims deliberately not curated, all recorded in the entry's notes: the report's prospective-cohort figures of 60% autism and 53% ADHD (attributed to a reference whose cached abstract does not contain them, so autism and ADHD carry no frequency band), its 7-12% polymicrogyria prevalence and its pooled 53-patient series figures (no traceable quotable source in the cached records, so polymicrogyria carries no frequency), and its facial-phenotyping benchmark claim (no citation given).

    Two curation decisions worth recording.

    First, the MONDO term's placement. MONDO:0010497 is a child of MONDO:0019181 (non-syndromic X-linked intellectual disability) and carries the design-pattern synonym 'DDX3X non-syndromic X-linked intellectual disability', while also carrying the synonym 'intellectual developmental disorder, X-linked, syndrome, Snijders Blok type'. The literature is unambiguously syndromic: the founding cohort (PMID:26235985) reports hypotonia, movement disorders, behaviour problems, corpus callosum hypoplasia and epilepsy, and PMID:30936465 describes the same 1-3% population as syndromic intellectual disability. The syndromic phenotype is curated and the conflict recorded as an INTERPRETATION discussion (non_syndromic_label_mismatch) rather than resolved silently. MONDO:0010497 is retained as disease_term because its causal-gene edge (RO:0004003 to HGNC:2745) is correct and it is the term the queue targets.

    Second, the sex difference is modelled as two separate pathophysiology entry points onto a shared node, not merged. 'Partial Escape from X-Chromosome Inactivation' (PMID:40164730, PMID:36299587) and 'Hemizygous Partial Loss of DDX3X Function in Males' (PMID:29490693, PMID:40164730) both feed 'DDX3X RNA Helicase Deficiency'. Allele class is branched independently of sex: the severe-missense granule branch (PMID:32135084) is kept distinct from dosage loss, because it is that allele class that correlates with polymicrogyria.

    Module conformance. Three progenitor nodes declare conforms_to against neural_progenitor_centrosome_spindle_dysfunction (Abnormal Progenitor Division and Fate Choice; Progenitor Pool Distortion; Abnormal Cortical Neuron Output and Gyration), with the module's GO annotations reproduced. The module's entry node, Centrosome and Mitotic Spindle Perturbation, is deliberately not claimed: DDX3X reaches the progenitor cell cycle through translational control rather than the centrosome, and the module's own description admits cell-cycle as well as centrosomal entry points.

    Clinical trials were checked directly against the ClinicalTrials.gov v2 API rather than taken from the report. Five studies mention DDX3X; two selinexor DLBCL trials are unrelated somatic-context studies and were excluded. NCT03718910 (completed observational, Mount Sinai) and NCT04436588 (observational episignature study, status UNKNOWN) are curated. NCT01238250 (Simons Searchlight) was fetched but not curated: it is a generic multi-condition registry rather than a DDX3X study.

    Evidence discipline. 107 snippets, all exact substrings of cached references, all verified. One intended GeneReviews quote was dropped because the cached text contains a non-breaking space inside it; a shorter exact span was quoted instead. No environmental block was created: no environmental contribution to this disorder is established, and an uncitable block would be worse than its absence.

    Validation, all run to completion. just validate (passed), just validate-disorders (schema + terms + references batched, 107/107 snippets verified), just validate-terms (passed), just count-verified-snippets (107/107), just check-entity-refs (OK), just check-causal-targets (OK, no new broken targets), just check-duplicate-keys (OK), just check-qualifier-terms (OK), just check-enum-values (OK), just check-folded-hyphens (OK), just check-snippet-length (OK), just check-title-snippets (OK), just check-snippet-grading (OK), just check-environmental-evidence (OK), just check-reference-titles (OK), just check-not4curation (OK), just check-term-cache-integrity (OK). No baseline file was modified.

    One schema correction was needed during curation: differential_diagnoses[].distinguishing_features is multivalued, and the initial draft supplied a string.

    stubs/Intellectual_Disability_X-linked_102.yaml deleted. The nine existing kb/disorders entries that mention DDX3X were read and left untouched; in all of them DDX3X is a comparator or gene-list member and none is about this disease.

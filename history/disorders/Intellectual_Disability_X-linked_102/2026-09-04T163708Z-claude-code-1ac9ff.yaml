  summary: 'Address review on PR #10885'
  details: |
    Addressed the five required findings and two of three suggestions on the ai4c-reviewer CHANGES_REQUESTED review of PR #10885.

    Finding 1 - added the missing top-level references: block. It lists all 17 references the entry cites (15 PMIDs plus the two ClinicalTrials.gov records), each title copied programmatically from the cache file frontmatter rather than retyped, with tags: [GeneReviews] on PMID:32852922.

    Finding 2 - mined the GeneReviews GENETIC COUNSELING section, which had no evidence item anywhere in the entry. Two GR items were added to the Genetic Counselling and Reproductive Testing treatment: the residual sib recurrence risk from parental germline mosaicism (<1%) and the availability of prenatal and preimplantation genetic testing once the familial variant is known. These are the two claims the record's description asserted while citing PMID:40164730, whose snippet supports neither; that item was kept but its explanation now scopes it to the de-novo-versus-inherited counselling step it does support. Two further GR items were added to the disease-level X-linked recessive inheritance block: the 50% per-pregnancy transmission risk from a carrier mother, and the statement that females inheriting a male-associated allele are heterozygotes not expected to manifest a neurodevelopmental phenotype. The inheritance block description was extended to match.

    Finding 3 - rebound the Abnormal Muscle Tone phenotype from HP:0001252 Hypotonia to HP:0003808 Abnormal muscle tone. The node name, its description (explicitly 'not uniformly hypotonia'), and its frequency evidence ('muscle tone abnormalities (17/23, 73.9%)') are all the parent concept. preferred_term changed to 'Muscle tone abnormality'.

    Finding 4 - rebound the Movement Disorder phenotype from HP:0001276 Hypertonia to HP:0100022 Abnormality of movement. Hypertonia is a muscle-tone concept and duplicated the node above; the node's evidence names dyskinesia, spasticity and abnormal gait. preferred_term changed to 'Movement disorder'.

    Finding 5 - added the three GeneReviews phenotypes that were omitted although their supporting snippet was already verified in the file: Hearing Impairment (HP:0000365, bound to the general term because GR does not qualify the mechanism), Congenital Heart Defect (HP:0001627 Abnormal heart morphology), and Respiratory Difficulties (HP:0002795 Abnormal respiratory system physiology). The reviewer offered HP:0002088 Abnormal lung morphology for the last of these; that was not used, because both sources describe a functional respiratory problem and HP:0002088 is defined as 'Any structural anomaly of the lung' - binding it would assert a structural lesion neither source reports. Each new phenotype carries the GR 'Other findings' sentence; the cardiac and respiratory records additionally carry the GR MANAGEMENT surveillance sentence and the PMID:30349862 phenotype-expansion sentence already cited in the genetic block. No frequency band was recorded on any of the three, since no source gives a rate; that is stated in per-phenotype notes.

    Finding 6 (suggestion, applied) - the Multidisciplinary Supportive Care record now carries the GR sentence 'Starting at age eight years, assess girls for evidence of precocious puberty.', the only DDX3X-specific surveillance instruction in the chapter, plus HP:0000826 Precocious puberty as a target_phenotype. Its description was updated accordingly.

    Finding 7 (suggestion, applied) - added mappings.mondo_mappings recording MONDO:0018709 (X-linked intellectual disability-hypotonia-movement disorder syndrome) as skos:closeMatch. MONDO:0010497 is retained as disease_term, which the reviewer agreed with. closeMatch is deliberate: per CLAUDE.md it is a cross-reference and does not retire the mapped concept from the curation queue. The notes block records the reasoning.

    Finding 8 - no change requested or made on lump/split.

    Ontology derivation. Every CURIE added or changed was re-derived independently rather than trusted from the review: labels were read from cache/hp/terms.csv and cache/mondo/terms.csv, confirmed against 'uv run runoak -i sqlite:obo:hp info' (and ols:mondo for MONDO:0018709), membership confirmed in cache/enums/phenotypeterm_939f99dde0f5.csv, and HP:0002088 and HP:0002795 were separated on their OAK definitions before choosing between them.

    Evidence grading. All six new GeneReviews evidence items are graded HUMAN_CLINICAL, matching the 16 GR items already in the file, so PMID:32852922 is not graded two ways in one entry. check-snippet-grading confirms no new divergences.

    Snippet verification. Every new snippet was confirmed as an exact substring of references_cache/PMID_32852922.md or references_cache/PMID_30349862.md with grep -F before it was written. No new literature was fetched and no reference cache file was created or edited.

    Validation. just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and the slow validate-disorders all pass. Verified snippets went from 107/107 to 120/120. Whole-KB baselines check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-not4curation all report no new defects. git status after validation showed no references_cache churn; the only cache rows added are MONDO:0018709 in cache/mondo/terms.csv and cache/enums/diseaseterm_f618932bb23f.csv, both for the CURIE this change uses.

  details: |
    Correction to the CREATE record: Table 1 of PMID:36732302 (30 individuals) is present in references_cache/PMID_36732302.md; the earlier record wrongly said it was not. From that table, added n/N frequencies with table-row snippets to 13 existing phenotypes, and replaced vague proportions in descriptions with the table figures. Added six phenotypes from the table: neonatal respiratory distress (16/22), persistent respiratory distress (12/25), premature birth (10/22), hypotonia (5/19), facial dysmorphism (20/20, HP:0001999) and congenital heart defect (11/25, HP:0001627; both terms are excluded from the coarse set). None of the six is wired to a mechanism node, because no source proposes one. Renal disease (3/11, three different lesions at 1/11 each) and the single-case hepatomegaly and feeding findings were left out. Bound GO:0061751 neutral sphingomyelin phosphodiesterase activity on the SMPD4 root node for the gene-activity grounding gate. Added the PMID:42389936 ferret evidence for impaired primary cilia (description updated) and for disrupted spindle orientation (GO:0000132 on the progenitor node). Reworded the PMID:38690959 diagnosis explanation to match its snippet. Changed insulin therapeutic_modality to PROTEIN_REPLACEMENT. Validated with validate-disorders (95/95 snippets), validate-terms, check-gene-activity-grounding against origin/main, entity-ref, causal-target and offline snippet gates.

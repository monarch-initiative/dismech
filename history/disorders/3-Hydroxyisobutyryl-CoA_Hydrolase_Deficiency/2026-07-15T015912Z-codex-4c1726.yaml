  summary: Review HIBCH deficiency evidence and clinical scope
  details: |
    Rebuilt the HIBCH-deficiency record using current clinical, imaging, biochemical, and mechanistic evidence. Distinguished the established HIBCH catalytic block and reactive valine-derived intermediates from variable secondary PDH/respiratory-chain abnormalities and preclinical lysine-methacrylation findings; added denominator-aware phenotype, imaging, and biomarker evidence; tightened molecular diagnosis, valine-restricted nutrition, catabolism prevention, supportive care, and avoidance language; regenerated four PMID caches through just fetch-reference; and recorded unresolved expert questions in issue #6566. Schema, ontology, graph, formatting, exact-quotation, and bibliography-closure checks passed. Two independent final reviews returned GO.

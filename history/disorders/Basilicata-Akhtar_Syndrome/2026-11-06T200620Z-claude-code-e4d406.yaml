  summary: 'Create: Basilicata-Akhtar Syndrome'
  details: |
    New entry for Basilicata-Akhtar syndrome (MONDO:0026730, MSL3), claimed in issue 16696 on behalf of bpow. Deep research: one OpenScientist report (research/Basilicata-Akhtar_Syndrome-deep-research-openscientist.md); its 15 references all resolved and 18/18 quotes matched, but it was used only as a source of leads. Every evidence snippet was taken from references_cache files fetched with just fetch-reference (PMID:30224647, 33173220, 40767387, 41216464) plus the ClinGen CGGV record (Definitive, XL). HPO, GO, CL, NCIT and CHEBI terms were read from the committed term caches or OLS search; the report's suggested GO:0043984 is obsolete and was not used. just check-genereviews --online found no GeneReviews chapter, so the 25-individual cohort (PMID:33173220) is the phenotype baseline. Inheritance is bound to HP:0001417 X-linked inheritance rather than X-linked dominant because the cited cohort papers say X-linked affecting both sexes and do not use the word dominant. Edges from the transcriptional node to clinical phenotypes are INDIRECT_UNKNOWN_INTERMEDIATES. The Msl2 conditional-knockout mouse is mentioned in notes but not recorded as a model, since it models a different MSL subunit. Validated with just validate, count-verified-snippets (59/59), validate-terms and the offline whole-repo gates.

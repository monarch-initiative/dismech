  summary: 'Review round 2: model section placement and diagnostics'
  details: |
    Second review round on PR 11202 (ai4c-reviewer, CHANGES_REQUESTED). Blocking finding: the mtef4-null Caenorhabditis elegans model was curated under experimental_models with experimental_model_type OTHER, which is the pre-8199 workaround; ExperimentalModel is for non-animal systems and AnimalModel's own schema description names itself the home for animal models. Moved it to animal_models with species 'Caenorhabditis elegans', genotype and category Genetic, keeping the RECAPITULATES link to 'Defective Respiratory Chain Complex Assembly' and both evidence layers intact. The NCBITaxon:6239 binding could not be carried across because AnimalModel has no organism term slot (schema limitation, flagged by the reviewer). The yeast guf1-null complementation assay stays in experimental_models: S. cerevisiae is not an animal. Suggestions taken in the same push: model_scale added to all four modeled_mechanisms links (ORGANISM for the two mouse links and the worm link, CELLULAR for the yeast complementation assay, whose readout is colony growth); brain magnetic resonance imaging added to diagnosis bound to NCIT:C16809 as an exclusionary modality, citing the cohort-level imaging sentence with directness INDIRECT; reference_title added to the two ORPHA:697160 evidence items for convention consistency. Suggestion not taken: no GenCC classification recorded, because it could not be verified programmatically (the GenCC search UI is a client-rendered app with no usable API response) and an unverified rating does not belong in notes prose; the PanelApp AMBER/RED lines added in the previous round already carry the same caution. Validation after the edits: just validate, validate-terms, count-verified-snippets (37/37), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-title-snippets, check-snippet-length, model-scale-audit --strict (exit 0, no upward extrapolation introduced), and the authoritative validate-disorders all pass. Previous round's record remains unedited per append-only policy; its details describe that round's rationale as it stood.

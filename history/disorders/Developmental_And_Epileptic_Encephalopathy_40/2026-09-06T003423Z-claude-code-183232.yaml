  summary: 'Create: developmental and epileptic encephalopathy, 40'
  details: |
    De novo curation of DEE40 (MONDO:0014895), the first GUF1 (hgnc:25799) entry in the KB and a mitochondrial-translation DEE distinct from the ion-channel DEEs. Claim issue 11070. Deep research: falcon (Edison) was requested but returned HTTP 402 (account out of credits) on every attempt; the run used the repository fallback mechanism (just dr_fallback='--fallback') and was produced by claude_code, with fell_back/requested_provider/provider_attempts stamped in the report frontmatter. Report reference validation: 13/13 identifiers verified, 14/14 quotes valid; preflight-dr PASS against MONDO:0014895 (GUF1=58 mentions, OMIM 617065 matches; mondo_id passed manually per issue 10335). Entry: 4-node pathophysiology chain (biallelic GUF1 variants -> impaired mitochondrial translation elongation fidelity -> defective respiratory chain complex assembly -> neuronal energy failure/epileptic encephalopathy), 5 HP-bound phenotypes, AR inheritance bound to HP:0000007, GUF1 genetic block with p.(Ala609Ser) variant detail, CASES_IN_LITERATURE prevalence (4 reported patients), mtEF4 knockout mouse (FAILS_TO_RECAPITULATE the neurological endpoint, substantiated), yeast and C. elegans experimental models, one KNOWLEDGE_GAP and one HUMAN_MODEL_MISMATCH discussion. Phenotypes reported only in OMIM's synopsis or the primary paper's full text (hypotonia, spasticity, absent speech, microcephaly) were deliberately omitted because the cached record carries only the abstract and no exact quote can be validated; recorded in entry notes. No conforms_to declared: mitochondrial_dysfunction (aging-hallmark scope) and complex_iv_assembly_deficiency (requires human COX enzymology, none exists for GUF1 patients) were considered and rejected, reasoning in entry notes. No antiseizure pharmacotherapy curated: neither human report documents a drug response in a GUF1 patient; the 2023 cohort's regimen prose concerns its Dravet patient (named-entity confusion risk). Validation: just validate, validate-terms, count-verified-snippets (35/35), check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, and the authoritative validate-disorders all PASS. Branch fast-forwarded to origin/main before final validation to clear stale-base title-snippet noise from IgG4-Related_Disease.

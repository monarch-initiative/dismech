  summary: 'Review round 2: repoint the fleck acuity claim at its real source; ground
    and soften two erosion edges'
  details: |
    Review round 2 on PR #12748. Two findings, one blocking for this entry.

    The blocking one was a false attribution, and it is the class of defect no gate can reach. On the Corneal Stromal Endosomal Sorting Defect -> Corneal Opacity edge, the explanation said the paper that identified PIKFYVE "characterises the dystrophy as one in which acuity is unaffected", offered as the reason no edge runs from that node to visual impairment. It does not. Grepping references_cache/PMID_15902656.md for "acuit", "vision", "visual", "asymptomatic" and "symptom" returns nothing at all; the abstract is silent on acuity. The statement is true but belongs to the MONDO:0007376 definition, which reads "with no effect on visual acuity" (re-read from OLS in the same step this note was written), and which the FCD subtype row had already attributed correctly. The edge explanation now names that definition and says explicitly that the cited abstract does not address acuity.

    Two reviewer suggestions were taken on this entry.

    The ERED -> Recurrent Corneal Erosions edge previously rested entirely on the junctional epidermolysis bullosa sentence, which is about the recessive skin disease. It gains a second evidence item from the same paper's abstract naming the dominantly inherited recurrent erosion dystrophy in which COL17A1 was identified, and the edge description now cites the MONDO:0007381 definition ("recurrent episodes of epithelial erosions from childhood in the absence of associated diseases", re-read from OLS) for the phenotype. No IC3D edition 3 sentence was used: the ones describing ERED's erosions sit outside the abstract, and validate-disorders runs the reference validator with --no-full-text, so such a snippet passes locally under the lenient recipe and fails the gate.

    The Meesmann -> Recurrent Corneal Erosions edge description said the epithelial category "presents with episodic erosion rather than with progressive opacity". That overstates how typical erosion is in Meesmann dystrophy, and the cited source does not rank presentations. It now records that erosion episodes occur and states that no claim about their relative frequency is made.

    Validator runs during this round rewrote 26 committed references_cache files again as a side effect; all were reverted and every snippet re-verified against the reverted tree. The branch was rebased onto origin/main (21 commits behind) before this round; the rebase was clean with no conflicts, including none in cache/.

    Validated with linkml-reference-validator 0.3.0rc1.

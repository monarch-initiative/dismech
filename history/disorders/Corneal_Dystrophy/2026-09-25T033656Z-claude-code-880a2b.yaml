  summary: 'Genetics pass: eight gene-defined IC3D entity subtypes plus five layer-specific
    mechanism nodes'
  details: |
    Genetics pass for the d2g series-036 gap list (issue #12243): enumerate the gene-defined IC3D entities under the corneal dystrophy family root and wire their genes into the pathograph.

    Anchor check first. MONDO:0018102 corneal dystrophy resolves in OLS as the family root and is not obsolete; its direct children include the four intermediate terms this entry already binds as its anatomic categories (MONDO:0000763, MONDO:0000764, MONDO:0020213, MONDO:0000766). The anchor is correct and no narrowMatch re-anchoring is needed.

    Eight of the ten diseases on the gap list are now curated as classification: entity rows in has_subtypes, each bound to its own MONDO term with its causal gene: MECD1 (KRT12, MONDO:0020791), MECD2 (KRT3, MONDO:0032904), GDLD (TACSTD2, MONDO:0008777), ERED (COL17A1, MONDO:0007381), LECD (MCOLN1, MONDO:0010425), CHED (SLC4A11, MONDO:0009019), FCD (PIKFYVE, MONDO:0007376) and PPPCD (PRDX3, MONDO:0859248). The four anatomic category rows name the entities beneath them through the children slot, so the entity axis nests inside the existing anatomic axis rather than competing with it. PPPCD is left unparented because MONDO files it as a direct child of the family root while IC3D groups it with the pre-Descemet dystrophies.

    Two gap-list diseases were dispositioned OUT OF SCOPE rather than curated, in a new discussion (mondo_files_two_non_dystrophies_under_this_family). MONDO:0007848 autosomal dominant keratitis (PAX6) has corneal vascularization and foveal hypoplasia, is absent from IC3D edition 3, and ClinGen curates PAX6 only as PAX6-related ocular dysgenesis (Definitive, AD); the gene-identification paper places the disease with the PAX6 anterior segment malformations. MONDO:0014089 corneal intraepithelial dyskeratosis-palmoplantar hyperkeratosis-laryngeal dyskeratosis syndrome (NLRP1) is a multisystem inflammasome disorder; the cached IC3D edition 3 full text contains no occurrence of "dyskeratosis" or "NLRP1". Both are disagreements with MONDO's placement, not with its gene edges.

    Five layer-specific mechanism nodes were added so each gene reaches the pathograph at the layer it acts in rather than through one flat list: cornea-specific keratin filament fragility (KRT12, KRT3), epithelial basement membrane adhesion failure (COL17A1), subepithelial corneal amyloid deposition (TACSTD2), keratocyte endosomal sorting defect (PIKFYVE) and corneal endothelial sodium-borate cotransport failure (SLC4A11). They run in parallel with the pre-existing family-level trigger node, which keeps its IC3D classification evidence unchanged. MCOLN1 and PRDX3 are bound on that family-level node instead, because for Lisch dystrophy and PPPCD the affected layer is known and the mechanism is not; no mechanism node was invented for either.

    The new nodes also connect phenotypes for the first time in this entry: recurrent corneal erosions from the two epithelial-adhesion nodes, corneal opacity from the amyloid, fleck and endothelial nodes. No edge was drawn from the fleck node to visual impairment, because the same source that establishes the gene characterises fleck dystrophy as leaving acuity unaffected.

    Gene symbols were read live from HGNC in the same step their CURIEs were written (retrieved 2026-09-24). Two carry previous symbols that the primary literature still uses: PIKFYVE was PIP5K3 in the gene-identification paper, and TACSTD2 was M1S1. Both are recorded in the relevant explanation fields so a reader is not left matching a symbol that HGNC no longer approves.

    The MCOLN1 attribution was checked rather than assumed. MCOLN1 is at 19p13.2, an autosome, which contradicts the "X-linked dominant" synonym MONDO still carries on MONDO:0010425; ClinGen has no corneal-dystrophy assertion for the gene. IC3D edition 3 states in its abstract that Lisch epithelial corneal dystrophy, previously reported as X-linked, has been discovered to be autosomal dominant with MCOLN1 mutations on chromosome 19 — so the gene edge is right and the retained X-linked synonym is the stale part.

    No disease-level genetic: section was added. A flat per-gene list at the family root would assert one genetic architecture for a family that has four; each gene's detail sits either on its entity row here or in the child entry that owns the entity.

    All snippets are exact substrings of committed references_cache files and were quoted from abstracts wherever the claim allowed. One snippet on the CHED node reuses a sentence from PMID:38359414 that sits outside the abstract; it is a sentence the entry already carried twice before this pass, and that cache file is full_text_xml, which the current validator still serves. A draft edge from the keratin node to loss of corneal transparency was dropped rather than kept, because the only sentence available for it was about deposition of opaque substances and Meesmann dystrophy deposits nothing. Validator runs during this pass rewrote 27 committed references_cache files as a side effect; all 27 were reverted with git checkout and every snippet in both entries was re-verified against the reverted tree afterwards. Only the eight newly fetched cache files are committed.


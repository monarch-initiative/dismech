  summary: Address PR 17275 review feedback by debundling lactate overproduction,
    replacing/qualifying genotype-undetermined PMID:16737791, and adding LVNC
  details: |
    Split Increased Glycolytic Lactate Production (GO:0019249, INCREASED) out of Bioenergetic Failure and Multisystem Energy Deficit (GO:0006119, DECREASED) and wired it directly to Lactic acidosis. Replaced genotype-undetermined PMID:16737791 on Lactic acidosis with SDHA-confirmed PMID:20551992 and PMID:22972948, marked remaining PMID:16737791 items on Failure to thrive, Supportive and Metabolic Care, and Riboflavin supplementation as directness: INDIRECT with explicit SDHA-undetermined qualification, and added SDHA-specific PMID:20551992 hypotonia evidence to Muscular hypotonia. Added Left ventricular noncompaction (HP:0030682) phenotype wired from Bioenergetic Failure and Multisystem Energy Deficit, removed the unevidenced adult optic atrophy-ataxia-myopathy clause from top-level description, qualified proton MRS succinate elevation in Cranial and Spinal Magnetic Resonance Imaging description, and removed tooling narration from notes.

  summary: Added MAF gene/molecular function bindings on pathophysiology nodes, Harrison's classifications,
    literature case prevalence, onset/progression phases, and differential diagnosis evidence for Ayme-Gripp
    syndrome.
  details: Bound MAF (hgnc:6776) and DNA-binding transcription factor activity (GO:0003700) on the GSK3-Dependent
    Phosphodegron Disruption and MAF Protein Accumulation node and on the Altered MAF-Dependent Transcriptional
    Programs node (plus GO:0006357 regulation of transcription by RNA polymerase II). Added classifications
    (GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC), CASES_IN_LITERATURE prevalence (21 patients in 19 families,
    PMID:32333448), progression (congenital/infantile onset and childhood-to-adulthood progression of
    arthropathy/chondrolysis), evidence snippets on all four differential diagnoses (Down, Fine-Lubinsky,
    Marshall, and Stickler syndromes), and expanded the top-level references list.

  summary: Added Harrison's chapter classifications, ultra-rare literature case-count prevalence, onset and progression entries with GeneReviews evidence, decomposed MAF ubiquitination vs transcriptional pathophysiology nodes, and added evidence to differential diagnoses.
  details: 'Reviewed Ayme-Gripp_Syndrome.yaml for issue #14380. Added classifications (GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC, DISORDER_OF_EAR), ULTRA_RARE prevalence entry with measure_type CASES_IN_LITERATURE (citing the 8 unrelated individuals in PMID:25865493), congenital/infantile onset and infancy/early-childhood progression entries backed by GeneReviews (PMID:32027476), decomposed MAF ubiquitination/proteasomal turnover (GO:0016567, GO:0043161) from dysregulated MAF-dependent transcription (GO:0003700, GO:0006357) in pathophysiology, and added evidence items to the four existing differential diagnoses (Down syndrome direct; CHARGE, Stickler and Marshall syndromes marked directness: INDIRECT).'

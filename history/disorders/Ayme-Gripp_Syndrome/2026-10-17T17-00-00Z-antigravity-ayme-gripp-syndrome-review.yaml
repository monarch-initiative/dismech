  summary: Added Harrison's classification, ultra-rare literature case-count prevalence, onset and progression entries with GeneReviews evidence, decomposed MAF ubiquitination vs transcriptional pathophysiology nodes, and added MONDO bindings on differential diagnoses.
  details: 'Reviewed Ayme-Gripp_Syndrome.yaml for issue #14380. Added classifications (NEUROLOGIC, OPHTHALMOLOGIC_OTOLARYNGOLOGIC), ULTRA_RARE prevalence entry with measure_type CASES_IN_LITERATURE (citing the 8 unrelated individuals in PMID:25865493), congenital/infantile onset (HP:0003577) and childhood-to-adulthood progression entries backed by GeneReviews (PMID:32027476), decomposed MAF ubiquitination/proteasomal turnover (GO:0016567, GO:0043161) from dysregulated MAF-dependent transcription (GO:0003700, GO:0006357) in pathophysiology, and added MONDO disease_term bindings and directness annotations across differential diagnoses (Down syndrome MONDO:0008608, CHARGE syndrome MONDO:0008965, Stickler syndrome MONDO:0019356, Marshall syndrome MONDO:0007960).'

  summary: Review and enrich Parainfluenza_Virus_Infection
  details: |
    Added MONDO synonyms, INFECTIOUS_DISEASES and RESPIRATORY classifications, R9 lump rationale in review_notes, two-phase clinical progression, four-node pathophysiology cascade from HN/F epithelial membrane fusion to croup and bronchiolitis reaching all six phenotypes, cached evidence snippets for all previously unevidenced phenotypes, RT-PCR and clinical croup diagnosis, and dexamethasone/nebulized epinephrine croup treatments. Addressed PR #17187 review feedback by sourcing the 12-to-48-hour croup progression interval and HPIV-specific upper respiratory phase from PMID:27486735 and adding quote_role: REVIEW_SYNTHESIS to the Cochrane review citation (PMID:36626194).

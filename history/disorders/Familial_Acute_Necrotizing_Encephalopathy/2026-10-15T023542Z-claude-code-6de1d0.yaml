  summary: 'Review round 1: Familial_Acute_Necrotizing_Encephalopathy'
  details: |
    Addressed the automated review of PR 14261. Added reference_title, copied from the references_cache title frontmatter, to the three GeneReviews evidence items that lacked it (Acute necrotizing encephalopathy onset statement, the pertussis-vaccine caution under vaccination, and infection avoidance); a whole-file scan found no other evidence item without a title. Supportive intensive care now cites two RANBP2-positive sources (PMID:34593382 four-patient series treated in intensive care for every attack; PMID:40868426 genetically confirmed case recovering with immunosuppressive and supportive treatment) in place of PMID:42629733, a RANBP2-negative sibling report, whose cache file was dropped from the commit. The interleukin 6 phenotype description now records that one series including RANBP2-related ANE found raised CSF IL-6 with normal serum IL-6; HPO search for a CSF interleukin 6 term (ols:hp search 'CSF interleukin', 'cerebrospinal fluid interleukin', 'interleukin 6') returned only circulating IL-6 terms, so HP:0030783 is kept for the serum finding. Notes now state that the ANE severity score, ferritin, AST, shock and brainstem involvement are outcome predictors from ANE cohorts whose RANBP2 status was not reported (PMID:24931733, PMID:38295717), and so are not curated. Oseltamivir was not added: no RANBP2-positive quotable source was found.

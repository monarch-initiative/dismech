  summary: 'Create: Familial_Acute_Necrotizing_Encephalopathy'
  details: |
    New entry for RANBP2-associated familial acute necrotizing encephalopathy (ANE1, IIAE3; MONDO:0011953), curated from the stub. Scope: genetic, familial or recurrent ANE with a heterozygous RANBP2 variant; sporadic ANE and RANBP2-negative familial ANE are treated as differentials, and the latter is recorded as a knowledge gap. Sources: the OpenScientist deep-research report (20/20 references resolved, none off topic; term section flagged one obsolete GO term, GO:0070265, which was not used; preflight-dr PASS, RANBP2 mentioned 51 times), plus a PubMed pass. The GeneReviews chapter (PMID:25473726) is retired; it is tagged and cited as an archival expert summary for clinical characteristics, diagnosis, management, agents to avoid and genetic counseling. Orphanet ORPHA:88619 supplied phenotype frequencies and the prevalence class; the ClinGen Moderate AD classification (CGGV assertion 7e375774) is copied into gene_disease_validity, and relationship_type is SUSCEPTIBILITY because CAUSATIVE implies Definitive or Strong and disease expression requires an infectious trigger. Pathophysiology is a causal chain from the germline variant and the febrile viral illness through cytokine overproduction, hypercytokinemia and blood-brain barrier disruption to symmetric deep grey matter necrosis and its phenotypes, with three hypothesis groups: cytokine_storm (CANONICAL), viral_replication_restraint (EMERGING, PMID:41651846 knock-in) and mitochondrial_energy_failure (EMERGING, COX11 binding and Ranbp2 heterozygous mouse). Death in childhood (HP:0003819) was dropped because it is outside the PhenotypeTerm enum; mortality is stated in the description. Polyneuropathy is left without an upstream edge because no source states its mechanism. Report citations not used: 24931733, 38295717, 33358123, 41714597, 36529001 and 10834515 concern ANE without a RANBP2 genotype; 40976348 and 18949001 are background. Validation: just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-genereviews (TAGGED) and validate-disorders.

  summary: 'Evidence-claim mismatch review (issue #14056)'
  details: |
    Reviewed the six assertions the Jev evaluation (dismech-evals, assessed at revision e7b43a48) labels MISMATCH for the whole claim, plus the gene records with the highest MISMATCH probability among PARTIAL claims.

    Changed:
    - DEE59 (GABBR2), PMID:25262651: the snippet stated suggestive evidence for 'three additional genes' without naming them. Replaced with an ellipsis quote that carries the earlier sentence naming GABBR2, FASN and RYR3, so the 'suggestive' description is tied to GABBR2.
    - Epileptic Encephalopathy Component node, PMID:28276062: replaced the sentence that only announces new terminology with the ILAE definition of the epileptic-encephalopathy component (epileptiform activity causes cognitive slowing and regression; controlling it may improve development), which is what the node asserts.
    - Hypotonia phenotype: the only evidence was an INDIRECT fragment naming a 'movement and musculoskeletal' comorbidity domain. Kept it and added two direct quotes naming hypotonia in genetic DEE cohorts: TMEM63B (PMID:37421948, generalized hypotonia evolving to spastic quadriparesis in 13/17, which also supports the description's evolution to spasticity) and the GRIN2D GeneReviews chapter (PMID:35914066).
    - SV2A gene record: its sole evidence was the levetiracetam non-response sentence, which supports the notes but not the CAUSATIVE relationship. Added the R383Q homozygous variant sentence and the authors' conclusion that an SV2A mutation can cause epilepsy (PMID:26002053).
    - FGF13 gene record: added the causal conclusion and the gain-of-function sentence (PMID:33245860) the notes rely on; the existing snippet only established gene identity and X-linkage.
    - LGI1 gene record: added the biallelic-variant cohort sentence and the reduced secretion/ADAM22-binding result (PMID:40455867) for the causal claim and notes.

    Retained:
    - DEE121 evidence quoting the monoallelic LGI1 / ADEAF sentence: it sources the description's contrast with the dominant disease and is already marked quote_role BACKGROUND.
    - DEE115 evidence quoting the shared hypomorphic p.Val102Ile in mildly affected individuals: it sources the description sentence about the mild pole curated elsewhere.
    - Subtype rows flagged only at the name/term/gene aspects (e.g. DEE85, DEE108, DEE114, DEE118): those snippets support phenotype or mechanism sentences of the description, and other evidence on each row establishes the gene-subtype identity.

  summary: 'Genetics pass: 28 gene-defined DEE subtype rows, 27 wired causal genes,
    and phenotype wiring (series-006 part 2, series-007 part 3)'
  details: |
    Genetics pass over the DEE umbrella for the two d2g gap issues that share this
    parent, dismech#12213 (series-006 part 2, 25 rows) and dismech#12214 (series-007
    part 3, 5 rows). The two row lists were confirmed disjoint from each other and
    from part 1 (dismech#12212): three sets of MONDO ids extracted from the issue
    bodies, pairwise intersections all empty.

    Anchor audit on the parent disease_term MONDO:0100062 before curating anything.
    Over-broad test: the entry is the genetic-DEE umbrella and the term is that
    class, with no causal gene asserted in its OWL axioms. Reciprocal test: all 23
    has_subtypes rows already on the entry resolve as descendants of MONDO:0100062,
    and so do all 30 rows from the two issues, each as a direct child. Children read:
    they are the numbered and gene-named DEE classes the entry enumerates. No
    re-anchoring needed, so neither the ANK2 broadMatch remedy nor design-decision
    3a L4 narrowMatch applies here. One observation on the term itself rather than on
    the binding: the first element of its OLS4 description list is a GABRB3-specific
    editor comment, which does not belong on an umbrella class; its second element is
    the generic umbrella definition. Reported, not acted on.

    28 new has_subtypes rows for 30 checklist concepts, each with a MONDO-bound
    subtype_term, an hgnc-bound gene read live from rest.genenames.org in the same
    step, a research-derived description, and one to four exact-quote evidence items
    from the founding or defining report. Two concepts did not become rows:
    MONDO:0700339 DNM1-encephalopathy, which is the gene-scoped parent of
    MONDO:0014598 and is curated as the separate DNM1_Encephalopathy entry; and
    MONDO:0800503, which denotes the same disease as MONDO:0979238 DEE118 and is
    recorded as a skos:exactMatch on the DEE118 row instead of as a second row.

    27 matching genetic entries with relationship_type CAUSATIVE and a subtype
    foreign key, and the 27 genes bound as genes descriptors on the two lesion nodes:
    13 on Genetic Lesion in an Ion Channel or Synaptic Gene and 14 on Genetic Lesion
    Beyond the Channelopathies. Both node descriptions were extended to name each
    new gene and its function, following the convention part 1 established that each
    functional assignment comes from the publication cited on that subtype's own row.

    Pathograph repair. Before this pass, 0 of 11 phenotypes had an incoming causal
    edge and both terminal mechanism nodes, Epileptic Encephalopathy Component and
    Developmental Encephalopathy Component, had no outgoing downstream edge, so the
    graph stopped at the pathophysiology layer. Added eight downstream edges and one
    sequela: the seizure node now reaches Drug-Resistant Seizures, Status Epilepticus
    and Abnormal EEG Background; the epileptic component reaches Developmental
    Regression; the developmental component reaches Developmental Delay, Intellectual
    Disability, Autistic Behavior and Movement Disorder; and Drug-Resistant Seizures
    leads to Premature Mortality through SUDEP. Hypotonia and Feeding and
    Gastrointestinal Difficulties were deliberately left unwired: the reviews this
    entry cites name them as comorbidity domains without attributing them to either
    arm, and an unsourced edge would be worse than none.

    Also folded in four improvements that PR #12875's reviewer suggested on part 1
    and that merged without them, each re-checked here: the ACTL6B subtype
    description no longer asserts a chromatin-regulator-versus-channelopathy class
    distinction the entry does not make and instead states that nBAF is the
    chromatin-regulator arm of the node ACTL6B is actually wired to; a sentence about
    the writing session's own environment was removed from an SV2A note while its
    three re-runnable PubMed queries stay; and four evidence items quoting two review
    papers gained quote_role REVIEW_SYNTHESIS, confirmed by each paper stating in its
    own abstract that it is a review and by each quoted sentence being that review's
    synthesis rather than its own result.

    Separately, three explanation fields still named the retired supports value
    PARTIAL. Each was rewritten and given directness INDIRECT, which is the migration
    CLAUDE.md records for that case.

    Measurements. gene_mechanism_wiring_coverage 29/31 to 56/58 (the two that remain
    unwired are the heterogeneity meta-record and PCDH19, both explained in notes).
    causal_inlink_coverage 0/11 to 9/11. Pathophysiology nodes with no outgoing
    downstream 2 to 0.

    Validation on the committed tree, after reverting the 14 committed reference
    caches that validate-disorders normalised as a side effect: just validate-disorders
    passed with 272 snippets checked, 272 verified, 279 titles checked and 0 issues;
    just validate-terms passed; check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-case-collisions, check-environmental-evidence and
    check-coarse-phenotypes all reported OK with no new findings;
    check-term-cache-integrity OK over 19 term and 24 enum cache files.
    list-gene-term-mismatches reports 161 of 164 bindings naming the entry's own gene
    and three advisory rows, all of which are the pre-existing hgnc:10152 RNU2-2P
    binding whose HGNC rename the OBO build has not caught up with.

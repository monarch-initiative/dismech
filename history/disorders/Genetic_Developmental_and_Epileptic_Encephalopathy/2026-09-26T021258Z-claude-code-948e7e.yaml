  summary: 'Genetics pass (d2g series-005 part 1): 23 gene-defined subtype rows, 29
    genes wired into the pathograph'
  details: |
    Genetics pass for the d2g series-005 gap list (issue 12212), part 1 of the
    subtype series under this umbrella entry.

    Checked the parent anchor first: disease_term is MONDO:0100062 genetic
    developmental and epileptic encephalopathy, the genuine umbrella class, so the
    over-broad-anchor pattern of dismech#12184 does not apply.

    Added 23 has_subtypes rows (DEE23, DEE35, DEE36, DEE37, DEE58, DEE61, DEE68,
    DEE70, DEE73, DEE75, DEE76, DEE90, DEE98, DEE100, DEE102, DEE104, DEE106,
    DEE110, DEE113, DEE119, DEE120, DEE121, MCSZ), each with a subtype_term bound to
    its MONDO ID, a genes descriptor with a lowercase hgnc CURIE, a sourced
    description and two or three abstract-quoted evidence items. Added a reciprocal
    genetic record with subtype foreign key for each.

    Wired 29 genes into the pathograph. dismech.qc_plugins.gene_mechanism_wiring_coverage
    moves from 0/8 causal genes wired on origin/main to 29/31 here; the two
    remaining are the narrative genetic-heterogeneity record, which names no
    single gene, and PCDH19. Phenotype causal_inlink is unchanged at 0/11 and is
    left for a separate pass. The existing root node Genetic Lesion in an
    Ion Channel or Synaptic Gene gained 14 genes descriptors, six of which its own
    description already named, and one description paragraph naming the eight new
    channel and synaptic subtype genes with the function each publication states.
    Added one new node, Genetic Lesion Beyond the Channelopathies, carrying the
    other 15 genes with downstream edges to Impaired Synaptic Maturation and
    Neurodevelopment and to Neuronal Excitation-Inhibition Imbalance.

    Declined two rows from the gap list and recorded both in the entry notes.
    MONDO:0100079 (DEE 6A, SCN1A) is already curated as Dravet_syndrome, bound to
    MONDO:0100135, and SCN1A is a genetic record on this umbrella; a subtype row
    would duplicate an existing entry. MONDO:0032880 (DEE 82, GOT2) already has its
    own entry, Developmental_And_Epileptic_Encephalopathy_82.

    Findings a reviewer should see. MONDO:0100079 and MONDO:0100135 are sibling
    classes under MONDO:0100062 that both assert RO:0004003 HGNC:10585 SCN1A and are
    linked only by mondo#disease_shares_features_of; whether they are one concept is
    a MONDO question, flagged in the PR and not filed upstream. DEE113 (SV2A) rests
    on a single consanguineous family and no independent replication was found; the
    searches run and their dates are recorded in the row itself. DEE36 (ALG13) is
    filed by MONDO under congenital disorder of glycosylation type I while its
    largest clinical series reports normal transferrin electrophoresis and leaves
    the glycosylation association open; the row records that rather than repeating
    the classification. HGNC renamed HGNC:10152 from RNU2-2P to RNU2-2 on
    2024-11-15, so RNU2-2 is bound with preferred_term RNU2-2 and term.label
    RNU2-2P, matching the OBO build the repository validates against, following the
    existing GBA1 precedent. PCDH19 is the one gene in the genetic section left
    unwired because no reference cited in this entry characterises the protein.

    Orphanet and ClinGen could not be consulted from the worktree: only the
    ORPHA cache files something in kb/ already cites are committed, and
    data/clingen/ holds only MANIFEST.yaml.

    Deleted stubs/Developmental_And_Epileptic_Encephalopathy_36.yaml and
    stubs/Developmental_And_Epileptic_Encephalopathy_73.yaml, both now recorded as
    has_subtypes rows on this entry.

    A self-review pass after the first draft removed or sourced every prose claim
    that no snippet in the same entry supported: cohort sizes, sex distributions,
    per-patient genotypes, protein product names written from memory rather than
    read from HGNC, and several mechanism details. Fifteen further abstract-quoted
    evidence items were added in the course of it, and the remaining claims were
    trimmed to what the cited abstracts state.

    Validation under linkml-reference-validator 0.3.0rc1: validate-disorders over
    163 snippets and 170 reference titles with 0 issues, validate, validate-terms,
    count-verified-snippets, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-enum-values, check-qualifier-terms,
    check-snippet-grading, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-case-collisions, check-stubs and validate-disorders.
    Every snippet is taken from a paper abstract, so none relies on the stale
    full_text_html path described in dismech#12672. One PHACTR1 snippet containing
    square brackets was requoted, not reworded, because the reference validator
    normalises brackets out of the comparison.

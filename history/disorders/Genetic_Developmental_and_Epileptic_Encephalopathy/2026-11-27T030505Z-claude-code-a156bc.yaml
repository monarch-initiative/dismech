  summary: 'NTRK2 (DEE58): record de novo origin of the recurrent Y434C variant'
  details: |
    Requested by the lipids and obesity gene-family review. The NTRK2 (DEE58) record had no variant origin. Added variant_origin DE_NOVO, citing PMID:41525844, which describes the recurrent Y434C variant behind most NTRK2-related DEE as de novo, and recorded in the notes that Y434C lowers mature TrkB and impairs BDNF-mediated TrkB signalling in cell lines (same source). Not changed: the shared node 'Genetic Lesion Beyond the Channelopathies' binds transmembrane receptor protein tyrosine kinase activity (GO:0004714) for NTRK2 without a modifier. That node carries 29 genes and 16 molecular functions, none with a modifier, and its genes do not share one direction of effect, so a modifier was not set there; a gene-specific NTRK2 node would be needed to record the decreased activity. The NTRK2 curated summary (hgnc_8032) now states the de novo origin and verifies.

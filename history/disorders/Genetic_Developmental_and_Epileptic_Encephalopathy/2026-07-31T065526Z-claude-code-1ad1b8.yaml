  summary: Fix truncated snippets whose explanations asserted the omitted words; correct
    two claims in earlier history records
  details: |
    Covers commits 6a4bf272 and this one, which previously had no provenance record, and carries two corrections to the earlier records in this directory. The earlier records are left as honest snapshots of what was believed at the time -- history is append-only, so corrections belong here rather than as retro-edits.

    CORRECTION 1 to record 2026-07-31T060336Z: that record states "Stiripentol carries no therapeutic_agent binding because no CHEBI or NCIT term for it could be verified". The CHEBI half is true; the NCIT half is false. NCIT:C152433 Stiripentol exists and was already present in the committed enum cache cache/enums/chemicalentityterm_b3afbb412a9e.csv. It is now bound. Root cause worth recording: NCIT:C152433 appeared in grep output during that same session, in the results used to confirm the cannabidiol and fenfluramine CHEBI terms, and was read past. A negative was asserted in a curated description from a search that had not actually been run against NCIT.

    CORRECTION 2 to record 2026-07-31T060336Z: that record states target_mechanisms was added "linking every treatment back into the pathograph". At that commit it was on four of seven treatments. Commit 6a4bf272 extended it to all seven. An earlier attempt to fix this by hand-editing the 060336Z record was itself a mistake -- it violated the append-only convention documented in docs/history.md and src/dismech/schema/history.yaml -- and has been reverted.

    Changes in 6a4bf272: corrected prevalence_class on both New Zealand records from BAND_1_5_PER_10000 to ABOVE_1_IN_1000, since rates of 112.0 and 169.0 per 100,000 both exceed the 100/100,000 boundary that scripts/migrate_prevalence.py _band_from_rate uses; bound NCIT:C152433 stiripentol and NCIT:C264 Anticonvulsant Agent; extended target_mechanisms to all seven treatments, each with its own evidence, adding Anti-Seizure Medication to the seizure node, Multidisciplinary Supportive Care to the Developmental Encephalopathy Component, and Precision Medicine to the upstream Genetic Lesion node; added therapeutic_modality to Precision Medicine; reconciled the two PCDH19 statements so the observed inheritance pattern and its deferred mechanistic explanation no longer read as contradictory; normalised links.prs to the schema uri form.

    Changes in this commit: fixed five evidence snippets that were truncated mid-clause. The most serious was on Anti-Seizure Medication, where the quote stopped at "determined both by epilepsy" while both explanations asserted "syndrome and aetiology" -- precisely the span the quote omitted, so the explanation claimed words the snippet did not contain. Also completed truncated quotes on Precision Medicine, Fenfluramine and Supportive Care, where the cuts had left dangling constructions such as ">50%" with no object.

    Additionally replaced the Anti-Seizure Medication target_mechanisms evidence with the sodium-channel-blocker sentence from PMID:39237642, which states directly that SCBs may exacerbate seizures in Dravet syndrome while gain-of-function EIDEE patients may respond to them. The entry's most clinically consequential claim is now carried by a quote that actually makes it, rather than by a generic management sentence.

    Validation: just validate passes; all snippets verified as exact whitespace-normalized substrings; prevalence bands verified consistent with their rates; target_mechanisms 7/7 with all targets resolving to real pathophysiology node names.

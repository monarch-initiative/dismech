  summary: 'Self-review round: correct eight prose claims the adjacent quote did not
    support, four of them false'
  details: |
    Self-review round on PR #13273, after the reviewer had already approved it. Eight
    sentences I had written myself were corrected because the quote sitting beside
    each one did not support what the sentence said. Four of the eight were false
    rather than merely imprecise, which is why this went in despite costing the
    approval: a false claim in kb/ persists and is cited, a re-review cycle does not.

    The four that were false:

    Developmental Regression edge. The description read "The developmental arm alone
    produces static delay". PMID:39858526, cited in this same entry, attributes
    "severe delay or regression of psychomotor development" to the DEE group rather
    than to one arm, so the sentence was contradicted by a source the entry already
    carries. Rewritten to say what this component adds, deterioration on a background
    of established impairment, without claiming the other arm produces only static
    delay.

    Premature Mortality sequela. The description called sudden unexpected death in
    epilepsy "the single largest identified cause of death" in the cited cohort. The
    abstract reports 19 of 42 deaths, 48 per cent, and does not enumerate the
    remaining causes, so the superlative was an inference beyond the quote. Now states
    the count and drops the ranking. "the proximate route" also softened to "a
    proximate route".

    Movement Disorder edge. Said the epilepsy-dyskinesia genes "map to" the same
    ion-channel and synaptic pathways as the lesion nodes. The quoted sentence says
    "most mapping to", so the universal was wrong; now "most of".

    Intellectual Disability edge. Said the developmental arm's features persist when
    seizures are controlled. The node's own description says they may persist despite
    adequate seizure control, so the universal was again stronger than the source. Now
    matches the node.

    The other four were imprecision rather than falsity, and rode along in the same
    push rather than being deferred: "multiple" dropped from a seizure-type claim the
    cited sentence does not make; an unsourced mechanistic condition ("in a
    sufficiently unstable network") removed from the Status Epilepticus edge while its
    two sourced percentages stay; and two claims about repository state rewritten to
    say where a fact is rather than what the entry lacks, which is the rot pattern
    dismech#12775 and #12897 were blocked on. Those were the DEE105 description
    asserting it is "the one subtype in this entry" pairing DEE with pituitary
    insufficiency, and the DEE115 description asserting the concept "has no dismech
    entry of its own".

    No snippet, reference, CURIE, gene binding, subtype row, genetic record or
    pathograph edge changed in this round. That was verified rather than assumed: both
    trees were parsed and the snippet multiset and the (snippet, evidence_source)
    pair multiset are identical across the two commits, which is why the three
    baseline-grandfathered snippet gates could not change their verdict and were not
    re-run.

    Re-validated after the corrections, on the tree committed: just validate-disorders
    passed with 272 snippets checked, 0 skipped, 0 unavailable, 279 titles checked and
    0 issues; just count-verified-snippets 272/272 after reverting the 14 committed
    reference caches the validator normalised again; schema and term validation
    passed; check-folded-hyphens, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms and check-enum-values all OK.

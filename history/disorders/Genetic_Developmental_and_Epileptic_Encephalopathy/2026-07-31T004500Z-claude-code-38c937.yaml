  summary: 'Create: Genetic Developmental and Epileptic Encephalopathy'
  details: |
    Created the umbrella entry for genetic DEE [MONDO:0100062], verified by direct OAK lookup and distinct from the ~40 gene-specific DEE entries already in the KB, which MONDO places as its children. Duplicate preflight across origin/main, PRs and issues found no existing coverage.

    Deep research providers: falcon [Edison] and claude_code, both run via `just research-disorder`. Reports and citations committed under research/. Both reports agreed on the core mechanism; falcon additionally cautioned against assigning an unverified umbrella identifier, and the claude_code report misidentified the umbrella MONDO as MONDO:0010246 -- the OAK-verified MONDO:0100062 was used instead.

    Modeled the two-component DEE mechanism from the 2017 ILAE classification: a genetic lesion in an ion-channel or synaptic gene drives excitation-inhibition imbalance, which branches into a seizure/epileptic-encephalopathy arm and an independent impaired-neurodevelopment arm. Conforms to the epilepsy_excitation_inhibition_imbalance module at the E/I-imbalance and hyperexcitability nodes.

    Curated 48 evidence items across pathophysiology nodes, causal edges, phenotypes, genetic, prevalence, inheritance, diagnosis and treatments. Added four causative genes -- SCN1A, KCNQ2, SCN2A, STXBP1 -- with per-gene case fractions from the Italian national survey [PMID:39613335], plus a genetic-DEE-specific prevalence figure from the same source and DEE-overall figures from the New Zealand population cohort [PMID:36581463], marked PARTIAL since they cover DEE of all etiologies.

    Corrected two claims during curation: the gene count was raised from "over one hundred" to "more than nine hundred" per PMID:39237642, and the inheritance section was reworked to distinguish gene-count from case-count -- more DEE genes follow autosomal recessive than dominant inheritance, while 77 percent of diagnosed cases involve autosomal dominant genes.

    Validation: `just validate` passes for schema, terms and references. All 48 snippets were independently verified as exact whitespace-normalized substrings of their cached PubMed abstracts via a standalone check, an earlier note in this record claimed `just validate-references` was a no-op false-green because it reports "Total checks: 0"; that was wrong. A deliberate-corruption test showed it correctly rejects fabricated snippets against both abstract-only and full-text caches -- "Total checks" counts issues found, not snippets examined. Compliance 98.2 percent global / 99.1 percent weighted.

  summary: 'Review round 1: rebind recurrent pulmonary infections, retype T cell edge,
    source COPA differential'
  details: |
    Answering the automated reviewer's CHANGES_REQUESTED review on PR #12697.

    Blocking finding. The presenting phenotype was bound to HP:0002205 Recurrent respiratory infections, with a description and a notes paragraph justifying the general term on the grounds that the source says 'pulmonary' without naming an anatomical level. That justification was false: pulmonary names the lung, and the lung is the lower respiratory tract. The cited sentence in PMID:41676145 reads 'Patients with COPG1 deficiency present with recurrent pulmonary infections'. The phenotype is now bound to HP:0002783, whose canonical label was read from cache/hp/terms.csv as 'Recurrent lower respiratory tract infections'; the term is already in cache/enums/phenotypeterm_939f99dde0f5.csv, so it validates offline. The node name and the pathophysiology downstream target naming it were renamed to match, and the false justification was removed from both the phenotype description and the notes 'Ontology bindings' paragraph.

    Causal edge typing. The edge from Increased Apoptosis of Activated T Cells to Abnormal T cell proliferation was typed INDIRECT_KNOWN_INTERMEDIATES, but no intermediate is established: in specific-pathogen-free mutant mice the T cells show increased apoptosis with normal proliferation, and the proliferation defect appears only after pet-store exposure. Retyped INDIRECT_UNKNOWN_INTERMEDIATES and the description rewritten to state what the data do and do not show.

    COPA syndrome differential. Its two distinguishing features previously rested on an in-vitro snippet about interferon activation in COPG1-null cells, which supports neither. Two evidence items were added from the introduction of PMID:35484149, both verified as exact substrings of the committed cache and graded quote_role BACKGROUND with evidence_source HUMAN_CLINICAL: the autosomal dominant inheritance sentence and the clinical-presentation clause naming interstitial lung disease, arthritis, kidney disease and autoantibodies.

    Diagnosis naming. 'Biallelic COPG1 variant on exome sequencing' claimed a testing modality its only snippet does not mention. Renamed to 'Molecular genetic testing for biallelic COPG1 variants', and the explanation now states that the quoted sentence supports the functional-confirmation step only.

    Declined. The reviewer's fifth item suggested GO:0036498 and GO:0036499 on the ER stress node and said in the same sentence that the abstract does not support them. No source in the cache states the IRE1-XBP1 or PERK-CHOP arm for this disorder, so the terms were not added.

    Validation under linkml-reference-validator 0.3.0rc1: validate, count-verified-snippets (51/51), validate-terms, validate-disorders, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-coarse-phenotypes, check-snippet-grading, check-title-snippets, check-snippet-length, check-reference-titles, and pytest tests/test_data.py -k Immunodeficiency_128 all passed. No baseline file was updated.

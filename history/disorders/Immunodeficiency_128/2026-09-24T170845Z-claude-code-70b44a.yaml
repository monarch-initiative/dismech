  summary: 'Create: Immunodeficiency_128'
  details: |
    De novo curation of immunodeficiency 128 (MONDO:0975834, OMIM:620983, ORPHA:718017). The stub named no gene; identity was established from the MONDO term's own cross-references (exact match to OMIM:620983, whose Orphanet counterpart ORPHA:718017 is titled 'Combined immunodeficiency due to COPG1 deficiency') and then from the primary report, PMID:33529166 (Bainter et al., J Clin Invest 2021), describing five siblings of a consanguineous Omani kindred homozygous for COPG1 p.K652E. A PubMed title/abstract search for COPG1 found no second family and no second allele. Curated as its own Disease entry: the knowledge base holds no COPG1 or coatomer entry for it to be a subtype of, and the pathograph is a single conserved chain. MONDO has scheduled MONDO:0975834 for merger into MONDO:0800136; the term was still live at curation, so it remains the primary disease_term and the successor is recorded as a skos:exactMatch mapping. Deep research: falcon was requested and returned HTTP 402 (out of credits), so the claude_code fallback produced research/Immunodeficiency_128-deep-research-claude_code.md; just preflight-dr returned SKIP (MONDO records no causal gene for the term, so the gene-identity check cannot discriminate) and the report's dominant gene, COPG1, agrees with the independently established identity. The report carries needs_review: true for one unsupported quote and one mislabelled placeholder HPO term, neither of which was used. The entry is deliberately thin. The primary report is available to the reference cache only as its abstract, so clinical details it reports in full text (organisms cultured, bronchiectasis in three siblings, one death at 3.5 years, immunoglobulin replacement) are absent rather than asserted; patient-level clinical and immunological features come instead from the introduction of PMID:41676145, carrying quote_role BACKGROUND. No prevalence figure, no GeneReviews chapter, no clinical trial and no human treatment could be sourced; the only therapeutic result is tauroursodeoxycholic acid rescue in the knock-in mouse. Validated with just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes, check-genereviews --online, list-gene-term-mismatches, pytest tests/test_data.py and validate-disorders, the snippet gates under linkml-reference-validator 0.3.0rc1.

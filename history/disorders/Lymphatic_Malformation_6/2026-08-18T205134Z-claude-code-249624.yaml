  summary: 'Create: Lymphatic malformation 6 (PIEZO1)'
  details: |
    Created kb/disorders/Lymphatic_Malformation_6.yaml for MONDO:0014797 (OMIM:616843, Orphanet:568062) - PIEZO1-related generalized lymphatic dysplasia of Fotiou, also called hereditary lymphedema type III.

    Identity anchoring: MONDO:0014797 carries no textual definition, so identity was anchored on the OMIM:616843 / Orphanet:568062 xrefs and on the MONDO RO:0004003 causal-gene relationship to hgnc:28993 PIEZO1, verified with OAK (sqlite:obo:mondo, -O obo). Deliberately kept distinct from the unrelated Lymphatic_Filariasis entry and from the Hennekam lymphangiectasia-lymphedema entries (the latter is curated as a differential diagnosis).

    Deep research: falcon, research/Lymphatic_Malformation_6-deep-research-falcon.md. The report's own Reference Validation section reported 10/10 references resolved, 0 unresolved, 0 off topic. NEC preflight (just preflight-dr research/Lymphatic_Malformation_6-deep-research-falcon.md MONDO:0014797) returned PASS: canonical gene PIEZO1 mentioned 54 times, next-ranked genes ANGPT2=7, FOXO1=6, TIE1=4, PIK3CA=4. The report was used as a lead source only; every snippet in the entry was taken from the cached reference file for the cited PMID, not from the report.

    Content curated: a six-node pathograph with causal edges (PIEZO1 loss of function -> impaired lymphatic endothelial mechanotransduction -> disrupted ANGPT2-TIE-FOXO1 signaling and defective lymphatic valve formation/lymphangiogenesis -> generalized lymphatic dysplasia and lymph transport failure -> chylous effusion/fetal fluid accumulation and chronic peripheral and facial lymphedema); 11 phenotypes bound to HPO terms with frequency bands justified from reported counts in the founding cohort; a PIEZO1 genetic block (relationship_type CAUSATIVE, germline) with four curated variants; two mouse conditional-knockout animal models wired into the pathograph via modeled_mechanisms with readouts and limitations; diagnosis (molecular testing, lymphoscintigraphy); treatments (dietary fat restriction/MCT, octreotide, decongestive supportive care, genetic counseling, investigational PIEZO1 agonism recorded as PARTIAL/preclinical); two differential diagnoses; and prevalence recorded as ULTRA_RARE / CASES_IN_LITERATURE with an explicit note that the widely quoted 1-in-6000 GLD figure must not be used as an LMPHM6 prevalence.

    Deliberate omissions: no GeneReviews chapter exists for this disorder (PubMed searched 2026-08-18; the lymphatic GeneReviews chapters retrieved are Milroy disease (FLT4) and lymphedema-distichiasis syndrome (FOXC2), which are different disorders) - recorded in the entry notes. No ORPHA:568062 structured citation was added: that record is absent from the committed references_cache and just refresh-orphadata failed on a network error (ChunkedEncodingError) at curation time; this is recorded in the entry notes rather than worked around.

    Two ontology IDs drafted from model recall were caught and corrected by term validation before commit: NCIT:C17057 (actually Radioimmunoassay) was replaced with the verified NCIT:C67262 Lymphoscintigraphy, and MONDO:0008164 (actually otosclerosis 1) was replaced with MONDO:0008689 dehydrated hereditary stomatocytosis with or without pseudohyperkalemia and/or perinatal edema.

    Validation actually run: just validate kb/disorders/Lymphatic_Malformation_6.yaml (schema: no issues found; term validation: passed; reference validation: passed) and just count-verified-snippets kb/disorders/Lymphatic_Malformation_6.yaml reporting 59/59 snippets verified against cached references, plus just validate-disorders kb/disorders/Lymphatic_Malformation_6.yaml as the batched pre-PR sweep. All 59 evidence references are PMID-prefixed; the entry cites no DOI, ORPHA, or dataset accessions, so nothing was skipped by the reference validator's skip_prefixes list and the 59/59 covers every evidence snippet in the file.

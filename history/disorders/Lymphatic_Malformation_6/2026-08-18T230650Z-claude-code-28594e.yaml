  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR 8856.

    BLOCKING FIX (IMPORTANT): the PMID:38747287 (Du et al., J Clin Invest 2024) evidence item on the "Impaired Lymphatic Endothelial Mechanotransduction" pathophysiology node was tagged evidence_source: HUMAN_CLINICAL. The paper reports mouse and cultured HDLEC experiments only, and the quoted sentence was an introduction/background statement citing prior work rather than a finding of the study. Replaced the snippet with an actual result of the study - the ex vivo Yoda1 / endothelial-Piezo1-null mouse mesentery experiment showing PIEZO1-dependent FOXO1 shuttling - and retagged it MODEL_ORGANISM. This addresses both the mis-tag and the CLAUDE.md section 6 "a background sentence is not a finding" concern.

    NON-BLOCKING SUGGESTIONS ADDRESSED:
    - Added treatment_effect to all four target_mechanisms blocks: RESTORES for the investigational PIEZO1 agonism against the PIEZO1 Loss of Function node, MODULATES for dietary fat restriction, octreotide, and decongestive supportive care. (The fifth treatment, genetic counseling, has no target_mechanisms block and correctly remains without one.)
    - Added type and clinical_significance to the four existing PIEZO1 variants (nonsense / splice donor site / missense; PATHOGENIC, except p.Trp1287Ter which the source paper itself classifies as likely pathogenic). Did not add functional_impact_category, which is not reachable from Genetic.
    - Added a Polyhydramnios phenotype. NOTE: the review and the deep-research report both cite HP:0002023 for polyhydramnios; that CURIE is Anal atresia. Verified with OAK and curated HP:0001561 (Polyhydramnios) instead. Two independent case quotes from PMID:40792030 (GLD07 and GLD09).
    - Added a progression block modeling two onset arms: the classical prenatal / early-childhood course and the adolescent / adult-onset arm from family GLD08 (homozygous I2270T), which the entry previously did not represent at all.
    - Recorded the pseudo-dominant pedigree pattern in the inheritance description with two supporting quotes (homozygous I2270T segregating in three members of one consanguineous family; the proband's father independently affected from age 30). The source paper does not use the phrase "pseudo-dominant", so that term appears only in curator prose, not in a snippet or an evidence explanation of the paper's wording.
    - Added the I2270T variant to the genetic section. Deliberately left clinical_significance unset: the source paper interprets the GLD07-09 variants collectively as "LP or VUS" and gives no per-variant classification.
    - Added a pleurodesis / thoracic-duct ligation / pleuro-peritoneal shunting treatment, evidenced from PMID:40792030 with the caveat carried in the description and both explanations: the source documents these interventions being used and effusion control proving difficult, not efficacy. supports: PARTIAL on both items.

    NOT DONE, with reasons: pulmonary lymphangiectasia (no quotable snippet found in any cached reference for this entry); consumption of the five cached-but-uncited references (no claim in this entry needs them, and the reviewer noted no action was required); ORAI1/KLF2/NOTCH and FOXC2/GATA2/GJA4/ITGA9 pathophysiology nodes (enrichment beyond the review's scope, and the reviewer rated the existing six-node backbone correct and atomic).

    Validation actually run: just validate (schema + terms + references) passed with 70/70 snippets verified against cached references (was 59/59 before this session); just count-verified-snippets 70/70; just validate-terms passed; just check-duplicate-keys OK; just validate-disorders batched sweep run as the reviewer requested.

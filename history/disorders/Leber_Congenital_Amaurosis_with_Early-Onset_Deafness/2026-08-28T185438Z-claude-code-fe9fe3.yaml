  summary: 'Follow-up #9787: normalize the cochlear-implantation treatment term binding'
  details: |
    Part of the KB-wide cochlear-implantation term sweep opened from issue #9787, where the COQ6 item turned out to be one instance of a pattern rather than a one-off.

    Census on origin/main: of seventeen cochlear-implantation treatments across kb/disorders, twelve bind NCIT:C15329 (Surgical Procedure), three bind NCIT:C15315 (Rehabilitation) and two bind NCIT:C15747 (Supportive Care). Each of the five divergent ones was read individually rather than normalized to the majority; only one turned out to be an outright defect, and one is left unchanged on purpose. Per-file rationale is in the pull request.

    Independently verified with OAK rather than repeated from the entries that assert it: NCIT:C157820 Cochlear Implant is defined as a two-part electronic device, and runoak ancestors -p i returns zero C25218 ancestors for it, so it cannot be used as a TreatmentTerm. NCIT:C15329 does have C25218 as an ancestor. That reasoning had been re-derived independently in at least four separate entries and is now written into CLAUDE.md.

    Validation: just validate-disorders over all four touched files passed, exit 0, Snippets checked: 189/189 verified against cached references. No evidence items were added or altered by this sweep - only treatment_term bindings, preferred_term strings, and notes.

  summary: Add MONDO:1060115 TUBB4B-related ciliopathy broadMatch mapping
  details: |
    QA-pass finding while auditing tubulin-family MONDO coverage. MONDO:1060115 (TUBB4B-related ciliopathy) is the direct is-a parent of this entry's MONDO:0060650 and was the only tubulin-family MONDO disease concept not referenced anywhere in the KB. Added as skos:broadMatch rather than exactMatch: the MONDO definition states that diagnoses under the umbrella can include primary ciliary dyskinesia as well as Leber congenital amaurosis, and the PCD-predominant TUBB4B presentations are not curated in this entry. Per the repository's MONDO coverage rule a broadMatch is a cross-reference and does not retire the mapped concept from the curation queue, which is the intended outcome here. Mappings-only change. Validated: schema OK.

  summary: 'Create: Cataract_39_Multiple_Types'
  details: |
    New entry for cataract 39, multiple types (MONDO:0014075), the CRYGB
    cataract. The only human report is one three-generation Kuwaiti family
    (PMID:23288985) with an exon 2 frameshift (anterior polar cataract), an
    intron 1 deletion (lamellar cataract) and one compound heterozygote with
    complete cataract. The entry records that a 2026 crystallin gene curation
    under ClinGen methods (PMID:42091610) and a 2026 review (PMID:41868570)
    judge the human evidence limited or inconclusive, and relationship_type
    on the CRYGB record is left unset for that reason; no gene_disease_validity
    record was added because no ClinGen assertion or cached GenCC record exists.

    The pathophysiology chain is built from mouse Crygb alleles and is graded
    MODEL_ORGANISM or IN_VITRO throughout: nop (misfolding, intranuclear
    amyloid-like inclusions, primary fiber disorganization; PMID:9782080,
    PMID:12426373), I4F Clapper (destabilization, high-molecular-weight
    complexes with alpha-crystallin, interfiber spaces; PMID:15878859) and
    S11R (cysteine disulfide crosslinking, membrane-associated aggregates,
    F-actin loss, raised calcium, crystallin degradation, inner fiber
    degeneration; PMID:18172107, PMID:35726360, PMID:20844585). The Cx46
    knock-in rescue of S11R is recorded as an animal model with RESCUES links.
    Two discussions record the open questions: whether the human alleles share
    the mouse aggregation mechanisms, and whether the intron 1 variant affects
    splicing.

    Conformance to cataract_lens_opacification: Lens Homeostasis Insult (the
    variant node), Loss of Crystallin Solubility and Chaperone Capacity (the
    misfolding node and the disulfide-crosslinking node), Crystallin
    Aggregation and High-Molecular-Weight Complex Deposition (the intranuclear
    inclusion node, the alpha-crystallin complex node and the
    membrane-associated aggregate node), and Loss of Lens Refractive
    Transparency and Light Scattering. loss_of_proteostasis was not used
    because it models age-related decline of the proteostasis network, not a
    germline structural-protein variant; amyloidogenesis was not used because
    it models extracellular amyloid deposits, while the gamma-B inclusions are
    intranuclear.

    Deep research: claude_code provider. Its reference validation resolved all
    26 references with no failed quotes; term validation flagged no
    unresolved terms, but two of its suggested HPO identifiers were wrong
    (HP:0001133 offered for anterior polar cataract, HP:0010920 offered for
    total cataract); both were looked up and not used. preflight-dr passed.
    Not used: PMID:12011157 (UniProt source for CRYGB S73I) because no text
    could be retrieved; the posterior polar cataract exome study
    (PMID:41669784) and the promoter SNP association studies (PMID:41581034,
    PMID:21941057) because they do not report Mendelian CTRCT39 alleles; they
    are mentioned only in notes. GenCC and PanelApp tiers quoted in the report
    were not independently retrievable and are not recorded. No GeneReviews
    chapter exists (check-genereviews NO_CHAPTER).

    Validation: just validate, validate-disorders, count-verified-snippets
    (51/51), entity-ref, causal-target, logical-rule, coarse-phenotype, enum,
    duplicate-key and block-scalar checks, and the whole-tree snippet gates
    all passed; all 3 phenotypes are causally connected.

    PR review response (reviewer approved; optional findings): removed the
    GO:0051260 protein homooligomerization binding from the membrane-associated
    aggregate node, because the S11R aggregates are disulfide-crosslinked
    deposits of probably mixed gamma-crystallins rather than a regulated
    homo-oligomer. Replaced the diagnosis evidence, which quoted a methods
    sentence, with the sequencing result sentence. Recorded the HPO query
    (OLS4 "total cataract", "complete cataract") behind the note that no
    complete-cataract term exists; re-run and confirmed before committing.

  summary: 'Review and enhance: Cataract 39, Multiple Types'
  details: |
    Added CRYGB-related congenital cataract synonym, Harrison's (GENETICS_ENVIRONMENT_DISEASE) and mechanistic_category (proteotoxic disease) classifications with PMID:23288985/PMID:12426373 evidence, and ULTRA_RARE prevalence from PMID:23288985 and PMID:41868570. Enriched all 12 pathophysiology nodes with UBERON:0000965 lens anatomy, CL:0011004 lens fiber cell grounding, and node-appropriate GO biological_processes/cellular_components (keeping GO:0036438 maintenance of lens transparency on the terminal opacity node and GO:0018158 protein oxidation on the recombinant S10R oxidation node). Re-verified obsolete Total cataract (HP:0010700) via live OAK HPO search, added Eye Examination (NCIT:C38060) to diagnosis, added CRYGC/CRYGD cataract differential diagnoses distinguished by Definitive vs Limited curation strength and CRYG cluster sequencing, and added target_phenotypes plus BYPASSES target_mechanisms on Cataract Surgery.

  summary: 'Gene-family review: complex I genes; LRPPRC and PDHA1 activity bindings'
  details: |
    ClinGen's Mitochondrial Disease GCEP classifies many complex I genes for Leigh syndrome (MONDO:0009723, this entry's own disease term), but the entry recorded only NDUFS4 and NDUFV1, and named MT-ND5 on its complex I node without a genetic record. Genetic records were added, typed CAUSATIVE with the ClinGen Definitive tier copied from the cited CGGV record, for MT-ND1, MT-ND3, MT-ND4, MT-ND5 and MT-ND6 (mitochondrial inheritance), NDUFS1 and NDUFS2 (core subunits, autosomal recessive) and NDUFAF2, NDUFAF5 and NDUFAF6 (assembly factors, autosomal recessive); each quotes the ClinGen table row and the curation summary. The six subunit genes were added to the Complex I deficiency node, whose bound activity (NADH dehydrogenase (ubiquinone) activity) is the holoenzyme activity the subunits contribute to; the three assembly factors were left off that node because they have no such activity. Complex I genes ClinGen rates Moderate or Limited for Leigh syndrome were not added. In the complex IV branch, LRPPRC was removed from the node bound to cytochrome-c oxidase activity, which it does not carry: it now has its own node bound to mRNA binding, decreased, on evidence that pathogenic LRPPRC variants including A354V reduce intrinsic RNA binding (PMID:42688402), linked to the complex IV deficiency node. The pyruvate dehydrogenase node gained PDHA1's own activity, pyruvate dehydrogenase (acetyl-transferring) activity, decreased.

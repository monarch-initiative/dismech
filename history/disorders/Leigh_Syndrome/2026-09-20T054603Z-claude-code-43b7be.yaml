  summary: Set subtype foreign keys, add ClinGen assertions, and record the umbrella
    scope rule
  details: |
    Genetics pass for the d2g wiring-012 tranche (issue #12201).

    LRPPRC, the single gene the reconciliation checklist names, was already present
    and already bound at the complex IV node, but its `genetic:` record pointed at no
    subtype - so the link to the `French-Canadian` row, whose `subtype_term` is
    MONDO:0009069, existed only in prose. That foreign key is now set, as is
    MT-ATP6 to `MILS`, and both rows carry their gene. `Leigh with cardiomyopathy` and
    `Adult` are left without genes: neither is a gene-defined concept.

    All six gene records are now typed `relationship_type: CAUSATIVE` and five of them
    carry a ClinGen definitive assertion recorded against this entry's own MONDO
    anchor (MONDO:0009723): NDUFS4, NDUFV1, SURF1, LRPPRC and PDHA1. Worth noting for
    the reconciliation: ClinGen asserts LRPPRC against the parent Leigh syndrome class
    rather than against the Saguenay-Lac-Saint-Jean leaf that MONDO uses, so the two
    sources agree on the gene while keying it to different terms. The LRPPRC record
    says so.

    Umbrella discipline. Leigh syndrome has more than 75 monogenic causes by the count
    in the review this entry already cites, and a flat gene list would say nothing
    about mechanism. A top-level `notes:` block now states that the `genetic:` block is
    deliberately incomplete and gives the selection rule: at least one worked exemplar
    per biochemical node, spanning the three inheritance modes the entry declares. It
    also names the one asymmetry a reader would otherwise trip over - MT-ND5 is bound
    at the complex I node as an mtDNA-encoded subunit exemplar but has no `genetic:`
    record, because MT-ATP6 is this entry's worked mtDNA cause.

    Incidental repair: the NDUFV1 evidence item's explanation ended "hence PARTIAL",
    prose left behind by the retirement of that enum value. The item is now typed
    `directness: INDIRECT` with an explanation that says what the inference step is,
    and the ClinGen assertion added beside it is the direct support.

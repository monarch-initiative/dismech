  summary: 'Review: add MT-ND2 (m.4681T>C; ClinGen Limited) genetic record'
  details: |
    Added MT-ND2 as a genetic record (relationship_type UNKNOWN, germline, mitochondrial inheritance HP:0001427) and to the genes of the Complex I deficiency node. The record copies ClinGen's Limited classification for MT-ND2 and Leigh syndrome (MONDO:0009723, this entry's own disease term; CGGV:assertion_80f1dcc9-aaf3-45f7-987a-4e0d83140913-2021-04-14T040000.000Z) into gene_disease_validity. The evidence is the m.4681T>C (p.Leu71Pro) case report, with isolated complex I deficiency in fibroblasts, blood and muscle, transfer of the defect in cybrids and accumulated assembly intermediates (PMID:16996290); the earlier report of the same variant in a boy with Leigh disease, whose pathogenicity call is bioinformatic (PMID:16738010); and ClinGen's summary, which scores a single case and holds the classification at Limited for that reason. ClinGen's separate Moderate classification of MT-ND2 for the lumped term mitochondrial disease (MONDO:0044970) is recorded in notes only. The entry-level notes, which describe the genetic block as six exemplar genes and say MT-ND5 has no genetic record, already disagreed with the block (every one of its records carries a ClinGen Leigh classification) and were not revised here. Validated: linkml-validate, term validation, reference validation (105/105 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen, snippet-grading and gene-term checks.

  summary: Review and enrich Leigh_Syndrome
  details: |
    Added synonyms, Harrison's NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE classifications, mitochondrial disease mechanistic category, ICIMD categories, and NCIT-bound diagnostic procedures (Magnetic Resonance Imaging, Lactic Acid Measurement, Genetic Testing). Grounded GO:0004739 on Pyruvate dehydrogenase complex deficiency and removed redundant downstream biological processes on molecular lesion nodes. Wired Energy-dependent neuronal vulnerability and Oxidative phosphorylation deficiency to all 12 previously disconnected phenotypes, added evidence to Nystagmus and genetic inheritance entries, and added therapeutic_modality to treatments.

  summary: 'Create: IKZF2-related_Combined_Immunodeficiency'
  details: |
    De-novo curation of MONDO:1010177 (IKZF2-related combined immunodeficiency). Deep research: Perplexity report (research/IKZF2-related_Combined_Immunodeficiency-deep-research-perplexity.md), run at reasoning_effort=low because default-effort requests were repeatedly cut off. The in-run reference and term validation aborted on an OLS timeout; the orchestrator then ran just validate-research-reference and just validate-research-terms to add the Reference Validation and Term Validation sections. Term validation flagged HP:0001064 (athelia) as unresolved; it was not bound (athelia belongs to the ICHAD entry anyway). Its MONDO label warning is a false positive from the template text '(if available)'. just preflight-dr returned PASS (IKZF2 named 37 times). Scope decision: entry_type DISEASE, treated as the gene-level umbrella with two subtypes: HELIOS deficiency (MONDO:0800139, curated in full) and ICHAD syndrome (MONDO:0979234, pointer with curated_in: ICHAD_Syndrome). The split follows IUIS 2024 (separate Table 1 and Table 2 rows) and the ClinGen recuration note that split ICHAD from HELIOS deficiency. MONDO:1010177 cites only the ICHAD paper (PMID:40295428) in its definition and is not the MONDO parent of either narrower term, so it is possible that ClinGen meant it for the dominant-negative arm alone; this could not be confirmed because MONDO tracker issue 8090 was not reachable from this environment. MONDO:0979233 (IMDIA, OMIM 621233) is an obsoletion candidate describing HELIOS deficiency and is recorded as a synonym; its separate stub remains in the queue. Evidence was drawn from the primary reports (PMID:34826260 Y200X pedigree, abstract only; PMID:34920454 Blood Advances cohort and PMID:34826259 homozygous I325V, both full text), the 2025 IKZF review PMID:42169761 found by a PubMed search outside the report, the Helios review PMID:39354708, IUIS 2024 PMID:41608114, the ClinGen CGGV record (Moderate, MONDO:0800139), and mouse data PMID:26472910 (MODEL_ORGANISM, used only for the Treg mechanism and an animal_models link). Report citations not used: the Perplexity DOI duplicates of the same papers, PMID:25330735 (ICF2, a differential diagnosis), PMID:33766139 and PMID:36359748 (general IEI reviews). No GeneReviews chapter (just check-genereviews: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments and validate-disorders all passed.

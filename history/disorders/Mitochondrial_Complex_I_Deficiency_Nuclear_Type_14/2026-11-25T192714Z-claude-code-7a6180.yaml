  summary: 'Gene-family review: NDUFA11'
  details: |
    The NDUFA11 lesion node had no molecular function. NDUFA11 is an accessory membrane-arm subunit; the splice variant is predicted to remove its first transmembrane domain and destabilise the complex (PMID:18306244, quoted as a prediction). The node now binds structural molecule activity, decreased. The genetic record lacked a variant origin and is now germline. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

  summary: 'Address review: add H9c2 NDUFA11 knockdown model, wire phenotypes into
    the pathograph'
  details: |
    Revision addressing the CHANGES_REQUESTED review on PR #10613. Both findings
    were verified before acting and both were correct.

    FINDING 1 - a cached reference was cited nowhere. The deep-research run's
    reference validation wrote references_cache/DOI_10.1038_s41598-018-36040-9.md
    (Jang & Javadov 2018) and the entry used it nowhere, not even in `references`.
    Checking it showed it is direct mammalian NDUFA11 knockdown evidence, which is
    the strongest non-patient evidence available for this entity and the thing the
    supercomplex node most needed. This was a genuine miss.

    While fixing it I found the DOI-keyed cache was abstract-only, and that its nine
    snippets were being silently skipped by the snippet verifier ("31/40 verified,
    9 skipped by prefix"). Re-fetched under PMID:30531981, which returns full text
    (41,916 chars). All references were switched to the PMID form, and the entry now
    verifies 43/43 with nothing skipped.

    The full text also settled a question I had deliberately left open. Against the
    abstract-only cache I had recorded that the cardioblast line's species was
    unstated and declined to name it; the full text names H9c2 embryonic rat
    cardioblasts (ATCC) and siRNA silencing explicitly, so the model is now curated
    with its real identity, NCBITaxon:10116 organism, cell_source and
    culture_system, and the note about deliberate omission was removed as obsolete.

    Added an `experimental_models:` entry (CELL_LINE) with two ModelMechanismLinks
    and seven readouts, all quantified from the full text:
      - respirasome level DECREASED (13% / 30%, two independent siRNAs)
      - complex III activity DECREASED (72% / 63%)
      - complex IV activity DECREASED (71% / 72%)
      - respirasome after SDHC knockdown UNCHANGED - the specificity control, and a
        real negative result: losing a complex II subunit does not disintegrate the
        respirasome, so the NDUFA11 effect is attributable to NDUFA11
      - cellular ATP DECREASED (to 48%)
      - mitochondrial membrane potential DECREASED (47% / 14%)
      - mitochondrial ROS INCREASED (62% / 30%)

    `Impaired Supercomplex Assembly` moved HYPOTHETICAL -> PROVISIONAL on that
    evidence, and `Impaired Mitochondrial NADH Reoxidation and ATP Synthesis` gained
    the GO:0072593 reactive oxygen species metabolic process INCREASED annotation.
    That last point was a 🔵 note in the review and a real inconsistency: the node
    declares conformance to mitochondrial_dysfunction#Bioenergetic Decline and
    Oxidative Stress, whose module node carries that INCREASED ROS process, and the
    conforming node had never evidenced it. The cardioblast ROS measurement supplies
    it.

    An honest disagreement between model and disease is now curated rather than
    hidden: NDUFA11 knockdown takes complex III and IV activity down with complex I,
    while the patients' biochemistry is on record as an *isolated* complex I
    deficiency. It appears in the link `limitations`, in the node description, and
    in the supercomplex discussion, framed as two testable alternatives.

    FINDING 2 - all three phenotypes were orphaned in the pathograph. Confirmed:
    no downstream edge reached them, and `check-causal-targets` passed only because
    every written target resolved. Confirmed also that patho->phenotype edges are
    established convention (3,668 of them across kb/disorders). Added
    Energy Deficit in Heart and Brain -> Cardiomyopathy and -> Encephalopathy.

    For the third phenotype the review offered a choice between linking and
    collapsing a near-duplicate. Took a third option: renamed the pathophysiology
    node `Lactic Acidemia` to `Cytosolic Redox Shift and Lactate Accumulation` and
    linked it to the `Lactic Acidosis` phenotype. The node names the mechanism (a
    raised cytosolic NADH/NAD+ ratio driving pyruvate to lactate) and the phenotype
    names the clinical finding, so the duplication disappears without losing the
    mechanistic step. No phenotype is orphaned now.

    Also from the 🔵 notes: recorded the GeneReviews decision in `notes:` following
    the MC1DN24 precedent (no chapter covers NDUFA11; PMID:26425749 does not mention
    it, and tagging a Leigh overview would import the class membership this entry
    declines); and reworded the "not reported" claims about the clinical split,
    enzyme values and treatment to say they are not quotable from the cached
    abstract-only record rather than that the source never reported them.

    Validation after revision, all exit 0: validate (43/43 snippets verified),
    validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys,
    check-causal-targets, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-environmental-evidence, check-folded-hyphens,
    check-stubs, check-term-cache-integrity. pytest -k "model_readout or
    failure_to_recapitulate or entity_ref or causal": 10809 passed.

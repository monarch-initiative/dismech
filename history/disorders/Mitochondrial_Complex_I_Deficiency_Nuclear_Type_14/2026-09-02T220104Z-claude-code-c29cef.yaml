  summary: Re-grade H9c2 evidence INDIRECT; add the membrane-potential specificity
    control
  details: |
    Third and fourth revision sessions on PR #10613, both responding to reviewer
    notes. Recorded in one record because they were one continuous piece of work.

    SESSION 3 - directness re-grading (commit c35b2428, plus a rebase).

    The reviewer left a non-blocking note that the three PMID:30531981 items under
    `pathophysiology` were graded `directness: DIRECT` while the porcine cryo-EM and
    C. elegans items in the same file were INDIRECT. Checked before acting, and the
    note was right in the strong sense: CLAUDE.md's table maps "right mechanism,
    inverted or non-human model system" to `SUPPORT` + `directness: INDIRECT`, and
    the schema's own DirectnessEnum.INDIRECT description names "a result from an
    inverted or non-human model system". H9c2 is a rat cardioblast line. The
    "tests-vs-infers" reading I had used was a redefinition of the axis rather than
    an application of it, and it had also been argued for in the PR body.

    All three re-graded to INDIRECT; no DIRECT items remain in the entry. Chose
    re-grading over the alternative the reviewer offered (a `notes:` line explaining
    the local convention), because such a line would have documented a convention
    that contradicts the global one and left the next reader to decide which to
    believe. The per-item explanations and the entry description were rewritten to
    match, stating the point the mis-grading was reaching for: strength of evidence
    and directness diverge here, `mechanism_confidence` carries the strength, and
    the only DIRECT-eligible evidence would come from a patient.

    Also rebased onto origin/main (9a04ca7). `check-snippet-grading` had begun
    failing on kb/disorders/Bullous_Pemphigoid.yaml, a file this PR does not touch.
    The reviewer attributed this to a shallow clone on their runner; it reproduced
    on a full clone, so the cause was staleness rather than environment - these
    gates measure against current origin/main with grandfathering off, so a branch
    can go red on a file it never touched simply by sitting still while main moves.
    Rebase was clean, no conflicts, no cache-CSV collisions, and all three snippet
    gates pass afterwards.

    SESSION 4 - the three remaining non-blocking notes from the re-approval.

    1. The ROS limitation said the SDHC effect was "of similar size". Verified
    against the full text: NDUFA11 raised mitochondrial ROS by 62 and 30 percent,
    SDHC by 114 and 82 percent - roughly double. The paper's own prose does describe
    them as "similar effects", so the wording was not invented, but it was imprecise
    against the figures. Rewritten to give both numbers and to attribute the
    "similar" characterisation to the paper. The conclusion is unchanged: the ROS
    rise is not specific to NDUFA11.

    2. The same check surfaced something better, which the reviewer had spotted and
    this entry had missed - a second specificity control. "In contrast to NDUFA11,
    SDHC silencing by both siRNAs did not affect the ΔΨm." So while the ROS readout
    is non-specific, the membrane-potential readout IS specific to NDUFA11, which is
    exactly what one would predict if the depolarisation follows from losing a
    proton-pumping complex rather than from reduced respiration in general. Added as
    an evidence item on the membrane-potential readout, with the interpretation and
    the link limitations updated to draw the ROS/ΔΨm contrast explicitly.

    3. Fixed a long line in the folded description block - and while doing so found
    that an earlier edit in session 2 had destroyed a paragraph break, joining "That
    disagreement is curated, not smoothed over." to "Second, this entry does not
    curate Leigh syndrome." on one line. Both fixed.

    Note on process: the script applying these edits aborted partway on a failed
    assertion and wrote nothing, while reporting a traceback that could have been
    mistaken for a partial success. The file was re-checked with grep before any of
    this was described, per the repo's own guidance.

    Validation after both sessions, all exit 0: validate (44/44 snippets verified,
    none skipped), validate-terms, validate-disorders, check-entity-refs,
    check-duplicate-keys, check-causal-targets, check-snippet-grading,
    check-snippet-length, check-title-snippets, check-folded-hyphens,
    check-environmental-evidence, check-stubs, check-term-cache-integrity,
    validate-history-all.

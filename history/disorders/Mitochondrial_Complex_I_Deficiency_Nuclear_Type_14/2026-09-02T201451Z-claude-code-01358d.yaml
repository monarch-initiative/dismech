  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 14 (NDUFA11)'
  details: |
    Created kb/disorders/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_14.yaml for
    MONDO:0032619 (NDUFA11), claim issue #10607.

    Entry-type decision: DISEASE. MONDO:0032619 is a leaf term whose only parent is
    MONDO:0100223 (mitochondrial complex I deficiency, nuclear type), with no Leigh
    syndrome ancestor anywhere in its closure. It therefore sits beside the MC1DN
    types already curated as standalone entries (1, 6, 23, 24, 34) rather than under
    any of them, and the settled per-subunit convention applies. The Leigh
    relationship curated for type 1 does not transfer: it is not in this term's
    ancestry, and the only mention of Leigh's disease in the defining paper's
    abstract is a sentence describing complex I deficiency as a class.

    Evidence base. The disease-specific clinical literature is two papers.
    PMID:18306244 (Berger 2008) defines the entity - six patients, three unrelated
    families, homozygosity mapping, a splice-site allele predicted to abolish the
    first transmembrane domain, presenting as encephalocardiomyopathy or fatal
    infantile lactic acidemia. PMID:31074871 (2019) is titled as reporting missense
    variants in late-onset myopathy, but `just fetch-reference` returns
    content_type: unavailable for it - no abstract, no full text - so nothing is
    curated from it. It is listed in `references` and its unreadability is recorded
    as a KNOWLEDGE_GAP discussion.

    Because that base is thin, most of the mechanism is carried by evidence that is
    not about NDUFA11 patients, and every such item is marked directness: INDIRECT:
    PMID:27626371 (gene-edited human knockout lines for every complex I accessory
    subunit), PMID:27654917 and PMID:27912063 (two independent mammalian respirasome
    cryo-EM structures that place NDUFA11 at the complex I/complex III interface),
    and PMID:34106255 (C. elegans nduf-11 knockout and RNAi knockdown). Node
    confidence is graded to match - HYPOTHETICAL for the supercomplex and cristae
    nodes, PROVISIONAL for the predicted helix loss and the tissue-selectivity node.

    The C. elegans work is curated in `animal_models:` with two ModelMechanismLinks
    (RECAPITULATES against the destabilisation node at MODERATE fidelity, and
    against the cristae node at LOW), each with limitations and readouts whose
    target repeats the link target. A HUMAN_MODEL_MISMATCH discussion records the
    specific mismatch: the worm null is L2-lethal while human patients are born and
    present in infancy homozygous for their allele.

    Ontology note. HP:0001522 (Death in infancy) is NOT in the schema's PhenotypeTerm
    dynamic enum - HPO places it under clinical course rather than under phenotypic
    abnormality - so the fatal infantile outcome is curated as a `progression:` phase
    instead of a phenotype, with the reason recorded in its notes. GO:0005747
    (mitochondrial respiratory chain complex I) is obsolete, replaced by GO:0045271;
    the deep-research report proposed it and the term validator flagged it. Neither
    was used.

    Deep research. A Falcon run was made specifically for this entry and is committed
    under research/. `just preflight-dr ... MONDO:0032619` PASSES: NDUFA11 is
    mentioned 41 times and is the dominant gene in the report, and the OMIM ID in the
    report (618236) matches MONDO's. Its own reference validation resolved 9/9 with 0
    possible confabulations; its term validation flagged 1 obsolete term (GO:0005747)
    and 0 unresolved. The report contains variant-level detail from Berger 2008
    full-text pages that this repository's abstract-only cache does not hold (a legacy
    IVS1+5G>A nomenclature, an activated cryptic splice site, a transcript missing the
    final 78 bp of exon 1). None of it is asserted as evidence; it is recorded in
    `notes` as an uncited lead for anyone with journal access.

    Deliberately absent, and recorded in `notes`: Leigh syndrome; a hypertrophic
    qualifier on the cardiomyopathy (the source word is encephalocardiomyopathy, which
    names the organ not the morphology); phenotype frequencies (the one sentence
    describing the cohort's presentation is disjunctive and gives no split, so there is
    no denominator); enzyme activity values and reference intervals; and any treatment
    section, since no management is reported for any NDUFA11 patient and a class-level
    mitochondrial cofactor prescribing practice is not this disease's evidence.

    Validation: just validate, validate-terms, validate-disorders, count-verified-snippets
    (31/31 verified), check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, check-folded-hyphens, check-stubs, validate-stubs
    all exit 0.

    Retires stubs/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_14.yaml.

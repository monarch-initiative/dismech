  details: |
    New entry for HLD2 (MONDO:0012125). Deep research was attempted with falcon (503 authentication failure, also with --fallback) and openai (401, invalid key); an openscientist run was still in progress at the time of this commit, so the entry was written from primary literature fetched with just fetch-reference: the GeneReviews PMLD1 chapter (PMID:29276893), the founding GJA12 report (PMID:15192806), channel, UPR and promoter studies, the Cx47/Cx32 mouse models and the AAV gene-therapy study. Six fetched references that ended up uncited were removed. ClinGen Definitive AR (CGGV assertion 9bb53a46) recorded as gene_disease_validity. Pathophysiology conforms to cns_myelin_failure at four nodes. Validated with just validate, validate-terms and count-verified-snippets (50/50); all 19 phenotypes are causally connected.

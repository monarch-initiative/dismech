  details: |
    Addressed the automated review on PR 14673. Added Dysdiadochokinesia (HP:0002075 Dysdiadochokinesis, FREQUENT, from the GeneReviews cerebellar-signs sentence), Mild intellectual disability (HP:0001256, frequency left unset because GeneReviews says 'normal cognitive skills or mild intellectual disability' for most patients without a proportion), and Seizures (HP:0007359 Focal-onset seizure, OCCASIONAL) supported by PMID:23143715 (newly fetched; severe frontal lobe epilepsy in the most affected branch of one family, none in the mildest patient) and the GeneReviews Management sentence listing epilepsy. Focal-onset seizure was chosen over the reviewer's HP:0001250 Seizure because the only case report specifies frontal lobe epilepsy; 'runoak -i ols:hp search "frontal lobe epilepsy"' and the OLS4 search API (q=frontal lobe epilepsy, ontology=hp) both returned no term. All three wired from CNS Hypomyelination with INDIRECT_UNKNOWN_INTERMEDIATES edges. Added a direct imaging quote from PMID:21871435 ('All patients with PMLD have extensive white matter disease consistent with abnormal myelination on MRI') to the OBLIGATE CNS hypomyelination phenotype. Changed Supportive Care therapeutic_modality from BEHAVIORAL to OTHER since it includes drug management of spasticity and seizures. Validated with just validate, validate-terms, count-verified-snippets (58/58) and check-folded-hyphens.

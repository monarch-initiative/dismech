  summary: 'GO term audit: correct and complete pathway bindings'
  details: |
    GO:0006520 (amino acid metabolic process) was bound DECREASED on the enzyme-deficiency node and INCREASED on the substrate-accumulation node within the same file. These contradict: N-acetylated amino acids accumulate because the catabolic process runs below normal, not above it. Re-bound both occurrences to GO:0042219 (modified amino acid catabolic process) with modifier DECREASED. The new term is also more specific to what ACY1 does - hydrolysis of N-acetylated (modified) amino acids - than the generic GO:0006520 that GOA assigns the protein. Validated with just validate-terms and just validate.

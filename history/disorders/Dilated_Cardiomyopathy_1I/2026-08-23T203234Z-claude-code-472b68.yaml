  summary: 'Create: Dilated Cardiomyopathy 1I (DES)'
  details: |
    Curated CMD1I (DES, MONDO:0011482; ClinGen Definitive). Cytoskeletal rather than sarcomeric: loss of the desmin intermediate filament network that links Z-discs to sarcolemma, mitochondria and nucleus, degrading lateral force transmission and mechanical registration. Two allele classes curated as separate inheritance blocks (dominant missense disrupting assembly; recessive truncating abolishing desmin, evidenced by a homozygous p.Arg150Ter case with complete absence of protein and unaffected carrier parents). Scope relative to the existing Myofibrillar_Myopathy entry stated explicitly: CMD1I is the cardiac-predominant pole of the desminopathy spectrum, MFM the skeletal-predominant one, meeting at the shared Z-disc/aggregation node. Evidence-scope caveat recorded (rests substantially on one desmin-null case report; conduction phenotype marked PARTIAL). Stub deleted; added to grouping. 12 snippets verified.

  summary: Grounded DES molecular function, added intermediate filament disease classification and diagnostic procedures, and enriched pathograph and treatment links in Dilated Cardiomyopathy 1I.
  details: Added verbatim evidence to Harrison's chapter classifications and added the intermediate filament disease mechanistic category. Grounded the DES trigger node with GO structural constituent of cytoskeleton (modifier ABNORMAL), heart and skeletal muscle UBERON locations, cardiac and skeletal muscle CL cell types, and intermediate filament organization biological process, and wired downstream edges from the filament disorganization node to Cardiac Conduction Abnormality, Skeletal Muscle Weakness, and Respiratory Insufficiency. Added Next-Generation Sequencing of DES and Muscle Biopsy diagnostic blocks, linked heart failure pharmacotherapy to ventricular remodeling and heart failure, and targeted pacemaker device therapy (`BYPASSES`) to Cardiac Conduction Abnormality while leaving the overview-only GeneReviews chapter unquoted.

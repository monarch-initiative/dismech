  summary: 'Create: 3-methylglutaconic_Aciduria_Type_VIIA'
  details: 'New entry for the autosomal dominant CLPB disorder MGCA7A (MONDO:0859237, OMIM 619835), claimed
    in #14953. Scoped against the existing recessive entry 3-methylglutaconic_Aciduria_Type_VIIB (OMIM
    616271) and against severe congenital neutropenia type 9 (OMIM 619813, isolated neutropenia), which
    is a separate MONDO concept and is not curated here. Evidence from SCN9 patients (PMID:34115842, PMID:36170828)
    is used only for the shared dominant-negative mechanism and is marked directness INDIRECT; cohort
    figures that pool all monoallelic patients (PMID:41719910) say so in their description. Deep research:
    falcon was requested but not configured in this environment, so the run used --fallback and openscientist
    produced the report (research/3-methylglutaconic_Aciduria_Type_VIIA-deep-research-openscientist.md).
    That report confuses this disease with the recessive form: it gives OMIM 616271, a wrong CLPB HGNC
    id (18542), and describes mostly biallelic disease; just preflight-dr returned WARN on the OMIM mismatch.
    Its reference validation was clean (17/17 resolved; one quote failed only on a superscript). It added
    no source specific to the dominant form beyond PMID:34140661 and PMID:41719910, so the entry was curated
    from those plus GeneReviews (PMID:27891836), the 2025 review PMID:40194906, the de novo p.R561W case
    report PMID:41560087, and mechanistic papers found by a PubMed search (PMID:32573439, PMID:42244541,
    PMID:35499078, PMID:39644357). The report''s CHEBI:28123 for 3-methylglutaconic acid resolves to diethanolamine
    and was not used. The open question of whether MGCA7A and SCN9 are one disorder is recorded as a KNOWLEDGE_GAP
    discussion. Validation: just validate passes (schema and terms); count-verified-snippets 52/52; check-genereviews
    TAGGED; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments
    and the snippet ratchets all pass. The death-in-childhood row is left without a phenotype_term because
    HP:0003819 is outside the PhenotypeTerm enum, following the VIIB entry.


    A pre-PR self-review (fresh-context subagent using the dismech-pr-review skill) led to these changes:
    the neurodevelopmental and 3-MGA nodes were connected to the CLPB lesion with INDIRECT_UNKNOWN_INTERMEDIATES
    edges; an unsourced statement about brain expression was removed; mixed-oligomer evidence covering
    the MGCA7A variant K404T (PMID:40194906) was added to the dominant-negative node; cataract was recorded
    as a REFUTE phenotype; GeneReviews G-CSF and blood-count surveillance recommendations, spasticity
    (PMID:35499078) and a REFUTE item on the differentiation half of the granulocyte node (PMID:39644357)
    were added; the unsupported VERY_FREQUENT frequency and the duplicate Sporadic inheritance row were
    removed. After those changes: count-verified-snippets 63/63 and validate-disorders passes.


    Review round 1 on #14960 (automated reviewer, changes requested). GeneReviews Clinical Characteristics
    quotes were added to neutropenia, seizures, intellectual disability, movement disorder and spasticity,
    marked INDIRECT because the chapter pools both inheritance forms. The pooled-cohort cataract REFUTE
    item (PMID:41719910) was removed and the cataract description softened to ''not reported''. The granulocyte
    node was split into Granulocytic Precursor Apoptosis and Impaired Neutrophil Differentiation so the
    PMID:39644357 REFUTE sits on the differentiation half only. Edge-level evidence was added to the seizure
    and developmental-delay edges. A myeloid malignancy phenotype was added from PMID:41560087 (quote_role
    BACKGROUND); PMID:38589208, which the research report cited for this, only lists CLPB among SCN genes
    and was not used. Two experimental models were added (patient fibroblasts, PMID:34140661; progenitors
    expressing SCN9 variants, PMID:34115842). After the round: count-verified-snippets 75/75, validate
    passes, model-scale-audit 3/3 aligned.

    '

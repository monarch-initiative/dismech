  summary: 'Edit: move myeloid malignancy edge onto the marrow defect'
  details: 'Follow-up to the optional review notes on #14960. The Myeloid malignancy phenotype was a sequela
    of Congenital neutropenia; in severe congenital neutropenia transformation is attributed to the underlying
    marrow maturation defect, not to the low count. The edge now runs from the Impaired Neutrophil Differentiation
    node (INDIRECT_UNKNOWN_INTERMEDIATES), and the sequela on neutropenia was removed. The phenotype term
    was changed from HP:0001909 Leukemia to HP:0012324 Myeloid leukemia, the closest HPO term for the
    source''s ''myeloid malignancies''; notes record that it omits MDS and the OLS searches run (myeloid
    neoplasm, myeloid malignancy: no HP result; myelodysplasia: HP:0002863, a separate term). Validated
    with just validate, count-verified-snippets 75/75, check-causal-targets, check-entity-refs.


    Review round on #15048 (approved with two suggestions). The phenotype note said HPO has no term spanning
    MDS and myeloid leukemia; HP:0004377 Hematological neoplasm does, though it also covers lymphoid neoplasms,
    so the note now says no myeloid-specific term exists and names HP:0004377 as too broad. The new differentiation-to-malignancy
    edge gained a BACKGROUND, INDIRECT quote from PMID:41560087 tying transformation risk in congenital
    neutropenia to the marrow differentiation defect. count-verified-snippets 76/76.

    '

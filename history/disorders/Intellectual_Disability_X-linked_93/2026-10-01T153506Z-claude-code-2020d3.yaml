  summary: 'Review fixes: Intellectual_Disability_X-linked_93'
  details: |
    Applied independent review of the initial curation. JAK-STAT edge downgraded to INDIRECT_UNKNOWN_INTERMEDIATES (RNAi screen hit, PMID:16094372). Unsourced KDM5 -> transcription edge removed; KDM5 node is terminal. 586 kb deletion reworded to match PMID:38813790 (only disease-associated gene is BRWD3). Tall-stature description corrected to a 4/17 minority finding that does not distinguish from other OGID syndromes, with the PMID:31714006 differential sentence added as evidence. Added the PMID:23479607 CRL4 substrate-receptor conclusion snippet and an orthology caveat (the paper names fly BRWD3 the homolog of human WDR9/BRWD1). Added directness INDIRECT to the PMID:31714006 JAK/STAT background item. Split the transcription/dendrite node into Neuronal Transcriptional Dysregulation and Impaired Dendrite Morphogenesis, both downstream of Excess Histone H3.3 Deposition, with targets, animal-model links and attaches_to updated. Added phenotypes Deeply set eye (HP:0000490), Broad foot (HP:0001769) and Scoliosis (HP:0002650) from PMID:24462886 and PMID:38813790; no separate Atypical behavior phenotype because aggression, ADHD, autistic behavior and shyness are already curated. Cited PMID:30628072 on Intellectual Disability. Added two proposed_experiments (mammalian Brwd3 knockout; patient iPSC neurons measuring KDM5, H3K4me3, H3.3, dendrites) to the HUMAN_MODEL_MISMATCH discussion. Cache files PMID_15543602, 16904300, 26323392, 27588417, 30086552 and 36926587 were kept because the committed DR report cites each of them. Validation: just validate 0 issues; validate-disorders passed; entity-refs, causal-targets, duplicate-keys, qualifier-terms, snippet-length, title-snippets, snippet-grading, folded-hyphens, coarse-phenotypes, term-cache-integrity, cache-order OK; grounding gate (baseline origin/main) no newly ungrounded genes.

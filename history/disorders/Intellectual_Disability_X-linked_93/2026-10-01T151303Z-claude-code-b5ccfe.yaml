  summary: 'Create: Intellectual_Disability_X-linked_93'
  details: |
    New entry for intellectual disability, X-linked 93 (MONDO:0010393, BRWD3), replacing stubs/Intellectual_Disability_X-linked_93.yaml, as the Non-Syndromic_X-Linked_Intellectual_Disability entry recommended. Slug follows the stub's proposed_name and the existing Intellectual_Disability_X-linked_NNN convention. Deep research: requested falcon with fallback; falcon was not configured (no Edison key) and the run fell back to claude_code (research/Intellectual_Disability_X-linked_93-deep-research-claude_code.md, fell_back recorded in frontmatter). Its reference validation resolved 22/22 identifiers; 2 quotes flagged as unsupported were ellipsis-joined abstract excerpts (PMID:17668385, PMID:36414205), and all snippets in the entry were instead copied from references_cache. just preflight-dr returned PASS (BRWD3 mentioned 40 times). Curated: X-linked recessive inheritance with de novo and affected-female caveats; a BRWD3 loss-of-function root node bound to GO:1990756 ubiquitin-like ligase-substrate adaptor activity (CRL4 substrate receptor; Drosophila BRWD3 with human CRL4 components, PMID:23479607), three Drosophila-derived downstream nodes (KDM5 stabilisation/H3K4 methylation, PMID:37722046; excess H3.3 deposition, PMID:25666827; reduced JAK-STAT signalling, PMID:16094372) graded INDIRECT, a transcription/dendrite node linked to intellectual disability and macrocephaly only as INDIRECT_UNKNOWN_INTERMEDIATES; 21 phenotypes with frequencies from PMID:36414205 and PMID:31714006; CASES_IN_LITERATURE prevalence; supportive therapy per PMID:31714006; Drosophila model; a knowledge gap on macrocephaly/obesity (the DDB1-BRWD3 adipogenesis data, PMID:34161765, predict the opposite direction) and a human-model mismatch discussion. Key decisions: ClinGen Definitive is against MONDO:0020119 (X-linked syndromic ID), so it is cited as evidence but not recorded as gene_disease_validity; the BRWD3 missense partial-epilepsy cohort (PMID:36514184) is noted, not modelled as a subtype; no PP2A/autophagy-lysosome claim was included because no source for it was found. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). Validation: just validate 0 issues; validate-disorders passed (58 snippets, 58 titles); check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-coarse-phenotypes, check-term-cache-integrity, check-cache-order all OK; gene activity grounding gate reports no newly ungrounded genes.

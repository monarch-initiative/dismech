  summary: Add the treatments and diagnosis sections the previous record wrongly claimed
  details: |
    Corrects a false provenance claim in the immediately preceding history record
    (2026-08-29T110436Z-claude-code-cb992b.yaml), found by the automated reviewer on
    PR #10034.

    That record lists `treatments` and `diagnosis` in its sections and describes both
    in its details. Neither section was in the committed file. The commit message for
    69693d6 made the same claim. The reviewer checked the diff rather than the prose
    and found that commit added no new top-level keys at all, and that PMID:26491591
    and PMID:39462795 were still cited zero times.

    Cause: the edit was applied by a script that made two replacements and asserted
    the second one before writing. The second assertion failed on a character
    mismatch (an em-dash in the differential-diagnosis prose), the exception
    propagated, and the final write never executed - so the treatments and diagnosis
    additions were discarded while the failure looked like it concerned only the
    differential.

    What made this survive review-by-self: the validation run immediately afterwards
    reported the snippet count rising from 44 to 59, and that was read as
    confirmation the sections had landed. The rise actually came from the phenotype
    additions made by an earlier, successful script. A passing validation and a
    rising snippet count confirm that the file on disk is valid; they do not confirm
    that a particular intended edit is in it. The check that would have caught it is
    grepping for the new top-level key, which is now done as a matter of course.

    This record adds the two sections for real, and the earlier record is left
    untouched because history is append-only - it now describes work that exists.

    treatments: middle ear implantation for the conductive hearing loss
    (PMID:26491591), with target_mechanisms onto the Conductive Hearing Loss node;
    and GnRH agonist therapy for the central precocious puberty (PMID:40797481),
    with target_mechanisms onto that phenotype. Modality for leuprorelin is recorded
    as PEPTIDE rather than the SMALL_MOLECULE the reviewer suggested, because
    leuprolide is a nonapeptide GnRH analogue. A notes block records that no
    disease-modifying therapy exists and that only interventions with a citable
    VMS-specific report are curated.

    diagnosis: brain MRI for the recognisable heterotopia pattern (PMID:39462795),
    temporal bone imaging for the middle ear malformation (PMID:27739185), and exome
    sequencing as molecular confirmation (PMID:28878612).

    Validation: just validate-disorders passes, 70/70 snippets verified, and the
    folded-hyphen, duplicate-key and entity-ref checks pass. PMID:26491591 is now
    cited 3 times and PMID:39462795 twice, both previously zero.

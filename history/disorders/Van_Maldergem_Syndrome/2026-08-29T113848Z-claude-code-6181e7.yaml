  summary: Bind diagnosis terms; add zebrafish and Drosophila models
  details: |
    Third review round on PR #10034, which requested diagnosis_term bindings as the
    sole remaining blocker, plus long-standing non-blocking suggestions.

    diagnosis_term added to all three diagnosis entries: NCIT:C16809 Magnetic
    Resonance Imaging, NCIT:C17204 Computed Tomography, NCIT:C15709 Genetic Testing.

    Two deviations from the terms the review named. It gave NCIT:C19770 as
    "molecular genetic testing"; NCIT calls that identifier "Molecular Analysis", and
    since term.label must match the canonical label exactly, using it as written
    would have failed validation. NCIT:C15709 Genetic Testing was used for the exome
    entry instead, which is also what the PAX1 otofaciocervical entry curated in the
    same session uses for the same purpose, so the two entries stay consistent. Both
    identifiers are in heavy KB use (C19770 in 344 files, C15709 in 403), so this is
    a choice between conventions rather than a correction.

    Two animal models added, closing the last of the unconsumed on-topic caches: the
    maternal-zygotic dchs1b zebrafish mutant and the neuron-specific fat knockdown
    Drosophila. Both are curated at fidelity: LOW with PARTIAL evidence, and the
    limitations state why. The zebrafish phenotypes are in the single-celled and
    gastrulating embryo and have no human counterpart, so the paper is evidence
    about DCHS1 protein function rather than a disease model - its value here is
    that it shows a Fat-independent DCHS1 role, which qualifies the
    receptor-ligand-pair framing this entry rests on. The Drosophila work uses a
    homologue and measures neuromuscular junction structure and photoreceptor axon
    targeting rather than cortical migration; the authors offer the human connection
    as a consideration, and the curation says so.

    A third reference_title error was caught during this round, by the exact-match
    audit rather than by CI. PMID:28488382's title had been copied from a truncated
    PubMed search listing and was missing the words "terminal branches".
    check-reference-titles passed it, because that check baselines at 0.85 similarity
    and the truncation is a small fraction of a long title - so the repository's own
    gate does not catch this class of error at short truncations. The exact-match
    audit does, and now reports 0 problems across all three entries curated in this
    session: 3MC 70/70, Van Maldergem 72/72, PAX1 67/67.

    That is the third instance in this session of the same underlying mistake:
    taking a fact from a convenient secondary rendering instead of the primary
    artifact. Previously a passing validation run read as confirmation an edit
    landed, and a reviewer's shortened paper titles copied without opening the
    cache. Here it was this session's own truncated search output.

    Validation: just validate-disorders passes, 72/72 snippets verified,
    check-reference-titles, check-folded-hyphens, check-duplicate-keys and
    check-entity-refs all pass.

  summary: 'Create: Van Maldergem Syndrome'
  details: |
    De-novo curation of van Maldergem syndrome as a single Disease entry covering
    both numbered forms. DCHS1 and FAT4 encode a heterophilic receptor-ligand pair
    that binds each other and acts in one planar cell polarity system, so the two
    forms share a pathograph rather than merely a phenotype.

    Deep research: one openscientist report,
    research/Van_Maldergem_Syndrome-deep-research-openscientist.md. Its term
    validation flagged needs_review, and the flagged item mattered: the report
    offered MONDO:0018852 as "Van Maldergem syndrome", which MONDO calls
    "achromatopsia". That binding was not used; the entry uses MONDO:0017813,
    verified against OLS. The report also suggested HP:0002778 for tracheal
    anomalies, which fits the source wording better than the tracheomalacia term
    used in the first pass, so that binding was changed and its grading raised from
    PARTIAL to SUPPORT.

    Two mechanistic routes to the heterotopia are curated separately and
    deliberately: a Hippo/Yap-mediated progenitor-differentiation imbalance, and a
    loss of Fat-PCP directional guidance for migrating neurons. Both are supported
    by distinct experiments, they are not competing hypotheses, and collapsing them
    into one node would lose the distinction. A 2026 Dchs1 intracellular-domain
    deletion mouse was added from the report's leads; it measures the Hippo shift
    directly, as a reduced pYAP1 to YAP1 ratio, alongside increased periventricular
    proliferation.

    The FAT4 allelism with Hennekam lymphangiectasia-lymphedema syndrome 2 is
    recorded as a differential diagnosis rather than re-curated, since that entry
    already exists in the knowledge base.

    Validation: just validate passes for schema, terms and references, with 44/44
    snippets verified against the local reference cache.

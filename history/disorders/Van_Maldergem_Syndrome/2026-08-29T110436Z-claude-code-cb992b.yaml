  summary: 'Address review: connect craniofacial arm, add treatments and diagnosis'
  details: |
    Review round on PR #10034. The automated reviewer requested changes, and the
    blocking finding was structural: the pathograph was two disconnected components.

    Impaired Craniofacial and Middle Ear Morphogenesis had no incoming edge, so the
    entire craniofacial and hearing-loss arm hung off nothing. PMID:31358536 was
    already cached in the branch and supplies the missing link through the same
    Yap-Tead mechanism as the neural arm. Added a new node, Impaired Osteoblast
    Differentiation, fed by the molecular root and feeding the craniofacial node,
    and recorded the Yap/Taz specificity the paper establishes: Yap is required for
    osteoprogenitor proliferation and is the deranged arm, while Taz-Tead activity
    is unaffected in mutants. This also gives osteopenia a mechanism it previously
    lacked.

    The craniofacial node's own evidence did not support its claim. Its only snippet
    was a descriptive list of what the syndrome looks like, not evidence that
    Fat-PCP signalling causes it. Replaced with the PMID:31358536 sentence that
    attributes craniofacial abnormalities to the cadherin pair, keeping the clinical
    description as a second item.

    Corrected an over-claimed differential. The entry offered intestinal
    lymphangiectasia as a discriminator against Hennekam syndrome, but PMID:31063239
    reports intestinal lymphangiectasia in van Maldergem syndrome and is titled as
    challenging that very distinction. The discriminator is now lymphedema alone,
    and notes record the overlap. That reference is a Letter with no abstract in the
    cache, so it carries no snippet and is cited nowhere as evidence.

    Added the organ systems the report surfaced and the entry omitted: renal
    (unilateral renal agenesis, ureterovesical junction obstruction), endocrine
    (hypogonadotropic hypogonadism, breast aplasia, central precocious puberty),
    plus scoliosis, short fourth metacarpal and poor coordination.

    Added treatments, both with target_mechanisms into the pathograph: middle ear
    implantation for the conductive hearing loss, which is the syndrome's chief
    morbidity, and GnRH agonist therapy for the precocious puberty. Added a
    diagnosis section covering the recognisable brain MRI pattern, temporal bone
    imaging, and molecular confirmation by exome sequencing.

    Recorded FAT4's second, Hippo-independent mechanism - juxtacrine tuning of RET
    signalling in kidney development (PMID:30853441) - on the FAT4 genetic entry
    rather than as a pathophysiology node, because it is a mouse kidney-development
    result not demonstrated in patients.

    Also fixed a CI failure from the first push: two lines in the description ended
    in a hyphen inside a folded scalar, so folding would have produced
    "blepharo-naso- facial" and "lymphangiectasia- lymphedema". That was missed
    because the whole-KB checks had been run in a sibling worktree, which does not
    contain this file.

    Validation after the round: just validate-disorders passes and 61/61 snippets
    verify.

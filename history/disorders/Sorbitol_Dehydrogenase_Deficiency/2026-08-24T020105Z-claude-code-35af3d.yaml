  summary: 'Edit: address PR #9343 review (reflexes, term specificity, allele spectrum)'
  details: |
    Addressed the ai4c-reviewer review on PR #9343 (REQUEST CHANGES: two IMPORTANT items, four suggestions). Every sentence the reviewer quoted was checked against the committed cache before acting; all were genuine.

    IMPORTANT 1 - deep tendon reflexes were missing, and they are the diagnostic signature. Accepted; this was a real gap. Two phenotype records added rather than one, because the finding is a dissociation: ankle reflexes reduced or absent (HP:0001315, FREQUENT from the qualitative "more typically", with independent support from PMID:34819907), and upper-limb and patellar reflexes retained or brisk (HP:0001347, deliberately no frequency because the source counts "retained or even increased" together and the ontology term names only the brisk end). The reporting authors read the brisk pattern as possible subclinical CNS involvement; that item is curated PARTIAL and the record asserts the reflex observation only, since the same paper reports no relevant imaging change.

    IMPORTANT 2 - Distal Upper Limb Weakness was bound to the generic HP:0002460, indistinguishable at the ontology level from the separate lower-limb record. Rebound to HP:0008959 Distal upper limb muscle weakness.

    Suggestion 3 accepted: the inverted upper-limb-over-lower-limb sensory gradient was asserted in prose with no snippet supporting it. Now cited (76% versus 27%, PMID:39938083).

    Suggestion 4 accepted: c.458C>A (p.Ala153Asp) and the recurrent SORD/SORD2P gene-pseudogene inversion promoted to variants records, making the allele spectrum queryable rather than only described in genetic prose.

    Suggestion 6 accepted, but filed differently from the reviewer's proposal: carrier frequency went into prevalence with measure_type CARRIER_FREQUENCY (0.0046, 3 of 650 Chinese Han controls, 460 per 100,000) rather than into genetic notes, because the schema has a measure type for exactly this. The record's notes warn that a carrier rate must not be compared with the disease rates in the same block.

    Suggestion 5 declined, with reason: no quantitative gait or running-difficulty statement exists in any cached reference. The 85% and 88% figures the reviewer cites come from the deep-research report, not from a cached paper, so curating them would mean citing a snippet that cannot be verified. The reviewer had already called this non-blocking and largely a functional restatement of the dorsiflexor weakness already curated. Noting for the record that the reviewer's own caution here was correct and worth keeping: the research artifact suggests HP:0002136 for running difficulty, and that term is Broad-based gait.

    Validation after the changes: just validate passes; 106 of 106 snippets verified against cached references; just validate-disorders (the CI check) passes; all five ungated CI gates pass; just check-not4curation clean; compliance 92.8 percent weighted.

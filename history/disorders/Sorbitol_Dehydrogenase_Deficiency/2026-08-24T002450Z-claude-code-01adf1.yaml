  summary: 'Review: red-team self-review fixes before PR (SORD)'
  details: |
    Pre-PR red-team self-review pass (dismech-pr-review skill, run in a fresh-context subagent against commit fc417e832), and the fixes it produced. Recorded as a separate append-only event rather than folded into the CREATE record, because these are corrections to work already committed.

    One blocking defect, in the grouping rather than the disorder entry: the new "Sorbitol Dehydrogenase Deficiency" member block had been inserted between the two evidence items of the "Distal Hereditary Motor Neuronopathy Type 9" (WARS1) member, so the WARS1 non-canonical-arm evidence (the TrpRS angiostatic/VE-cadherin item) was re-parented onto the SORD member while the WARS1 member lost it. That produced a wrong-disease evidence item attached to SORD deficiency, and left the WARS1 differentiating_mechanisms prose arguing a two-armed mechanism whose second arm's evidence had moved elsewhere. Invisible to schema validation, to check-groupings (criteria evaluation does not inspect member evidence) and to snippet verification (the quote is genuine and correctly cached, just attached to the wrong member). The block was moved after the WARS1 member's final evidence item; member-to-reference attribution was re-checked by parsing the file.

    Factual correction: SORD is at 15q21.1, not 15q26.1. The wrong locus appeared four times in the claude_code deep-research report and had been copied into the genetic section unverified. Corrected against NCBI Gene 6652. This is the CLAUDE.md section 2a failure mode reaching a field no validator checks.

    Evidence and classification corrections. A PMID:40580554 item quoting a SERUM polyol measurement had been attached to the urine biomarker record and explained as confirmation of the urine signature; it was moved onto the serum-sorbitol record with the compartment named explicitly. Four frequency bands were wrong against docs/frequency-evidence-guidelines.md and are fixed: distal upper limb weakness OCCASIONAL to FREQUENT (its own snippet says 50%); mild scoliosis VERY_RARE to OCCASIONAL (4 of 45 is 8.9%, and the explanation had asserted the arithmetic incorrectly); distal amyotrophy FREQUENT to VERY_FREQUENT, now citing the Brain 2025 "98% of cases" sentence; and the elevated-creatine-kinase frequency was removed entirely, since it rested on a single case report that describes itself as isolated. Two evidence_source values were corrected from HUMAN_CLINICAL to OTHER (a definitional background sentence and a limitations statement). A mixed-system snippet used for treatment target engagement was replaced with a fibroblast-only quote so its IN_VITRO tag is unambiguous, and the one remaining mixed-system sentence now discloses the split in its explanation. The pes cavus binding was widened to HP:0001760 Abnormal foot morphology, because every cited cohort says "foot deformities" and none names pes cavus. The word "invariably" was removed from the nerve-conduction description, since a genetically confirmed patient with normal conduction has been reported. The North America/Europe prevalence measure_type was changed from CASES_IN_LITERATURE to UNKNOWN, as it is a modelled estimate rather than a case count. The inheritance prose now gives the real figures (55% sporadic, 18% consanguineous) with evidence, instead of implying consanguinity plays no part.

    Content added in response to the review. A diagnosis section now carries the pseudogene-aware molecular testing strategy (long-read sequencing and the SORD/SORD2P inversion allele) and biochemical case finding; that material had previously been filed under a genetic-counselling treatment, whose sole evidence item was an aims sentence rather than a finding and has been replaced by a note explaining the absence. Male sex as a severity and progression modifier was added to progression with two evidence items. The competing mechanisms are now modelled structurally rather than argued in prose: three mechanistic_hypotheses (osmotic_myelin_injury_model CANONICAL, mitochondrial_oxidative_model ALTERNATIVE, redox_cofactor_imbalance_model EMERGING), a new HYPOTHETICAL "Osmotic Stress in Schwann Cells and Myelinated Axons" node carrying the ballooned-myelin evidence, and hypothesis_groups tags on the competing causal edges out of the accumulation node. The KNOWLEDGE_GAP discussion now attaches to that structure instead of substituting for it. A note records the relationship to the MONDO:0015363 umbrella entry, which is both the parent term and now a co-member of the same grouping.

    Left deliberately unchanged: the INSPIRE trial status stays COMPLETED. The reviewer read it as unsourced, but it was checked directly against the ClinicalTrials.gov API during curation (actual completion 2026-06-01, status verified 2026-06) and is not from a company announcement. The cached reference record carries only title and design summary and cannot be quoted for it, so the trial description now states where the status came from and explains that the 2025 paper cited beside it said "ongoing" because that was true when it was written. No trial outcome is curated either way.

    Validation after the fixes: just validate passes; 97 of 97 snippets verified against cached references; just validate-disorders (the CI check) passes; all five ungated CI gates pass; just check-not4curation clean; just validate-grouping and just check-groupings pass with both NECESSARY criteria SATISFIED for the new member and member-evidence attribution confirmed correct; pytest tests/test_data.py filtered to conforms_to, unique, subtype_foreign, grouping, model_readout, failure_to_recapitulate, history and hypothesis passed (14231 tests). Compliance 92.2 percent weighted.

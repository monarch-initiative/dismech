  summary: 'Create: Sorbitol Dehydrogenase Deficiency (SORD, MONDO:0030055)'
  details: |
    New Disease entry for sorbitol dehydrogenase deficiency (SORDD / CMT-SORD / dHMN AR8), the SORD-related recessive axonal neuropathy. Claimed as issue #9336 after the two-phase pick (open claim issues, then the stub queue); the stub stubs/Neuronopathy_Distal_Hereditary_Motor_Autosomal_Recessive_8.yaml is deleted in the same change, and the entry is added as a member of the Distal_Hereditary_Motor_Neuropathies grouping with differentiating_mechanisms.

    Deep research: one provider, claude_code (just research-disorder claude_code Sorbitol_Dehydrogenase_Deficiency), report at research/Sorbitol_Dehydrogenase_Deficiency-deep-research-claude_code.md. Its own reference_validation block reported needs_review: true with 8 of 10 references resolved; both unresolved identifiers were malformed DOI strings with a URL glued on (for Brain 2025 and Brain 2024). Neither was cited: those two papers were located independently by PubMed search and cited as PMID:39938083 and PMID:38538210. NEC preflight (just preflight-dr against MONDO:0030055) returned PASS, with canonical gene SORD mentioned 66 times and the report OMIM 618912 matching the MONDO xref. The report was used as a lead list only; every PMID was fetched with just fetch-reference and every snippet taken from the cached record.

    GeneReviews baseline: not applicable. PubMed searches for "sorbitol dehydrogenase deficiency GeneReviews" and "SORD deficiency GeneReviews" both returned zero records, recorded in the entry notes.

    Curation decisions recorded rather than silently taken: the entry spans the CMT2/dHMN clinical split as one disease (interpretation_cmt2_dhmn_split discussion), because cohorts assign the same genotype to different labels in different proportions; conformance to peripheral_axonal_degeneration is declared on four nodes but deliberately not on the module's axonal-transport/mitochondrial amplifier, since no axonal-transport evidence exists in SORD deficiency; the polyol-pathway link to diabetic neuropathy is described but NOT curated as conformance to diabetic_vascular_complications, because patients are normoglycaemic; and no clinical efficacy is claimed for govorestat, since the completed INSPIRE trial (NCT05397665) has no peer-reviewed report and company announcements are not used as evidence. Two open discussions carry the substantive unknowns: a KNOWLEDGE_GAP on the route from trapped sorbitol to motor-axon loss and on the motor-over-sensory selectivity, and a HUMAN_MODEL_MISMATCH on the C57BL/LiA mouse that shows no neuropathy despite reduced SORD, each with two proposed experiments.

    Validation run and read: just validate (schema, terms, references) passed; just count-verified-snippets reported 85 of 85 verified against cached references; the five ungated CI gates all passed (check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, check-duplicate-keys); just check-not4curation was clean; just validate-grouping and just check-groupings on the edited grouping passed with both NECESSARY criteria SATISFIED for the new member; and pytest tests/test_data.py filtered to conforms_to, unique, subtype_foreign, grouping, model_readout, failure_to_recapitulate and history passed (11911 tests). just compliance reported 85.1 percent weighted before the causal-edge and model-level evidence pass. Datasets remain absent by choice, since no dataset accession was verified with just verify-datasets. The model identifier is omitted from this record per this session's policy against writing model identifiers into repository artifacts; the deep-research report's own frontmatter carries the provider run metadata.

  summary: 'Create: RP1-Related Retinopathy'
  details: |
    Fresh curation of RP1-Related Retinopathy (issue #4008 long-tail gene list). Modeled as a single gene-series entry using MONDO:0800400 (RP1-related dominant retinopathy) as primary disease_term with a Recessive has_subtypes entry (MONDO:0800399, RP1-related recessive retinopathy), since RP1 is unusual in causing both dominant and recessive RP from the same locus depending on truncating-variant position within its single large exon 4 (middle-clustered = dominant-negative adRP; N-/C-terminal biallelic = loss-of-function arRP). Noted and worked around a MONDO data quality issue: the def: text for MONDO:0800399/0800400 appears to have dominant/recessive swapped relative to their labels and is_a axioms; used name+is_a as source of truth. 6 PMIDs (15269252, 20664799, 22317909, 32005865, 32565670, 33681214) plus ORPHA:791 for standard RP phenotype frequencies. Caught and corrected several fabricated/misattributed quotes from an initial WebFetch-based literature pass -- cross-checked every snippet against the actual references_cache content after fetch-reference and fixed onset-age claims that had been fabricated (recessive onset had been asserted as before-10-years/legal-blindness-by-20 from a source whose real abstract instead reports mean onset 14.9y/range 4-30y with a later-onset exon-2-missense subgroup; a dominant-form 20s-30s-to-50s-60s claim was dropped entirely as unverifiable). All 23 evidence snippets now verified via just validate-disorders (23/23), schema and term validation both clean.

  summary: 'Create: SPOP-Related Neurodevelopmental Disorder'
  details: |
    De novo curation of SPOP-related NDD (Nabais Sa-de Vries syndrome, MONDO:0032942 / OMIM:618828, with NSDVS type 2 MONDO:0032943 / OMIM:618829 carried as a subtype). Anchored on the defining cohort study PMID:32109420 (Nabais Sa et al. 2020 AJHG): de novo SPOP missense variants split into a gain-of-function class (p.Arg121Gln, p.Asp144Asn; increased substrate degradation; congenital microcephaly, type 1) and a dominant-negative class (p.Thr25Ala, p.Tyr83Cys, p.Gly132Val, p.Arg138Cys; impaired degradation; relative macrocephaly and hypertelorism, type 2). Pathophysiology modeled as a branching chain from the variant through the two opposite CUL3-SPOP substrate-degradation states to BET protein depletion/accumulation (PMID:28805821) and aberrant neurodevelopment, with genetic_context functional_impact_category on each class node and a bet_bidirectional_dysregulation EMERGING hypothesis group; the substrate-to-brain step is marked INDIRECT_UNKNOWN_INTERMEDIATES and recorded as a KNOWLEDGE_GAP discussion (functional assays were in Ishikawa endometrial cancer cells, not neural systems). Deep research: falcon (Edison) report research/SPOP-Related_Neurodevelopmental_Disorder-deep-research-falcon.md, reference_validation 8/8 verified, term_validation 23/23 verified, preflight-dr PASS against MONDO:0032942. The report surfaced the mouse Spop-null GLI3/Hedgehog branch (PMID:27930311, PMID:28412462), curated as an animal model with a PERTURBS link plus a HUMAN_MODEL_MISMATCH discussion. Case-report phenotypes and variants from PMID:35892095, PMID:36063898, PMID:36259278, PMID:39918173, PMID:42147571; SPOP structural role from PMID:19818708. GeneReviews: searched PubMed, no article exists for this disease. Validated with just validate, just validate-terms, just count-verified-snippets (62/62 verified), check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, and the batched just validate-disorders gate.

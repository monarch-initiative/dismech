  summary: Review SPOP phenotypes, variant scope, and causal evidence
  details: |
    Reviewed all 24 existing phenotypes and Falcon candidates against the discovery cohort and later primary case reports. Added 39 atomic case-scoped findings, separated absolute from relative macrocephaly, removed three unsupported population-frequency bands, and corrected umbrella versus subtype MONDO scope. Replaced cancer-only BET extrapolation with germline-allele cellular evidence; kept neuronal differentiation as a qualified head-growth hypothesis and broader genotype-to-developmental relations without asserting that intermediary. Added clinical ventriculomegaly-to-head-size and constipation-to-enuresis links plus qualified dysphagia-to-choking/growth-failure relations. Distinguished experimentally tested variants from inferred functional classes and unconfirmed Met117Ile segregation. Reviewed remaining clinical causal attribution gaps, model translation and source access limitations; Galli cerebral visual impairment interpretation and unquotable detailed findings remain scoped discussion/notes. Preserved prior authorship and verified exact titles for every new/replaced evidence item.

  summary: 'Address PR 10551 review: type-2 phenotypes, phenotype edges, diagnosis'
  details: |
    Review response for PR 10551 (ai4c-reviewer CHANGES_REQUESTED). Added the type 2 systemic phenotype set (Cardiovascular Anomalies, Epilepsy, Sleep Disturbance, Endocrine Anomalies, Short Stature, Failure to Thrive), all subtype-keyed to Type 2 and quoted from the pleiotropy sentence in PMID:42147571; added Patent Ductus Arteriosus and Patent Foramen Ovale as specific cardiac phenotypes (PMID:42147571, PMID:36259278) and Ventriculomegaly (PMID:36259278 MRI sentence). Kept the general Congenital Heart Disease phenotype un-subtyped with a justifying description because its cited case is a type 1 patient; the type 2 cardiac claim is carried by the new subtype-keyed Cardiovascular Anomalies phenotype. Connected the pathograph to the phenotype layer: Aberrant Neurodevelopment now has downstream edges to Global Developmental Delay, Intellectual Disability, and Language Disorder, and the head-size phenotypes route from the class-specific BET nodes (Reduced BET Protein Abundance -> Congenital Microcephaly; BET Protein Accumulation -> Relative Macrocephaly) as INDIRECT_UNKNOWN_INTERMEDIATES edges in the bet_bidirectional_dysregulation hypothesis group. Added a diagnosis section (Trio Exome Sequencing, NCIT:C101295) quoting PMID:36259278; no consensus clinical criteria exist. Softened the sensorineural overclaim in the Hearing Impairment description. Removed the two uncited case-variant DOI cache files for 10.1158/0008-5472.CAN-22-2801. OMIM mappings suggestion: the DiseaseMappings class has no OMIM slot (only ICD10CM/ICD11/MONDO/NCIT), so OMIM:618828/618829 remain recorded in the subtype descriptions and entry notes rather than in a structured mapping. Re-validated: just validate, validate-terms, count-verified-snippets (78/78), check-duplicate-keys, check-entity-refs, check-causal-targets, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, and the batched just validate-disorders gate.

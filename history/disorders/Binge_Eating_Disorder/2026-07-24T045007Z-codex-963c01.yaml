  summary: Re-review Binge Eating Disorder diagnosis, mechanisms, and evidence
  details: |
    Expanded the record with a carefully bounded DSM-5-TR/ICD-11 diagnostic definition, prevalence and longitudinal course, evidence-backed screening and clinical assessment, treatment targets and limitations, differential diagnoses, a translational mouse model, a dbGaP GWAS dataset, two clinical trials, and three explicit knowledge gaps. Marked reward, inhibitory-control, and cognitive-behavioral mechanisms provisional; retained increased body weight as an associated non-diagnostic phenotype rather than forcing a causal edge. Curated 23 bibliography sources supporting 49 exact-match evidence items; the causal graph now connects three of four phenotypes, with the remaining weight association intentionally unlinked. Follow-up review removed the deprecated duplicate prevalence percentage, classified the model-derived GWAS consistently as computational evidence, restored the pre-existing legacy updated_date rather than refreshing the deprecated field, documented why GO:0007631 remains appropriate for the organism-scale feeding-behavior node, and made the mouse model traceable to its reported Vglut2-Cre allele and Jackson Laboratory stock.

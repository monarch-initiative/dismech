  summary: 'Review round: qualify Juniver efficacy claim, record trial limitations'
  details: |
    Review round on PR #9645; ai4c-reviewer requested changes on three items.

    IMPORTANT 1, the trial sample is not BED. The reviewer asked for the efficacy evidence item to be regraded from SUPPORT to PARTIAL. PARTIAL no longer exists - issue #7439 retired it and #10003 migrated the KB, both after this branch was cut - and CLAUDE.md's replacement, SUPPORT with directness: INDIRECT, needs a slot this branch's vendored schema also predates. Kept SUPPORT and carried the entire qualification in the explanation instead, which is what the reviewer's second sentence asked for in any case. The explanation now states that inclusion was self-identified eating disorder of any diagnosis with no diagnostic assessment, that 37% (n=131) reported purging which is exclusionary for BED under DSM-5, that the primary outcome is global EDE-Q symptomatology rather than binge frequency, and that in the prespecified binge-only subgroup (n=193) the objective binge-eating difference had attenuated by the week-12 primary endpoint (-1.97 [95% CI, -5.51 to 1.57]; P = .272) while EDE-Q global, clinical impairment and anxiety did hold. So the item now says it supports benefit in a mixed sample and reaches BED only by generalization.

    IMPORTANT 2, missing limitations in notes. Added three blocks. Attrition: 38.1% (n=136/357) provided week-12 primary outcome data falling to 17.9% (n=64) at week 24, with the control group less likely to be missing at every randomized timepoint (week 12 OR 0.26 [95% CI, 0.16 to 0.42]; p < .001), so the arm that did better was observed less completely. Competing interest: the preprint declares that EF is the founder and CEO of Juniver and holds equity in the company. Sole-support caution: this is currently the only evidence for the treatment entry and it is a single non-peer-reviewed preprint, the situation issue #6353 warned about.

    IMPORTANT 3, missing history record. This record.

    All figures were verified against references_cache/PPR_PPR1274137.md before being written. They are recorded as notes rather than as evidence snippets because the cached full-text results section carries ti-ligature corruption, which the reviewer had already flagged and which makes that text unquotable; the notes say so explicitly. check-folded-hyphens caught a line-ending hyphen in the first draft of that note (conflict-of-/interest split across a folded scalar) and it was rephrased rather than baselined.

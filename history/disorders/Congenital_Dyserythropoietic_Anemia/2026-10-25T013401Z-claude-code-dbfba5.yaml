  summary: Add RACGAP1 CDA IIIb; split GATA1/KLF1 row into bound CDA IV and GATA1
    subtypes; wire both TF genes
  details: |
    Picks up the Congenital_Dyserythropoietic_Anemia deferral recorded in #12897 and tracked on #12931. (1) New CDA IIIb subtype bound to MONDO:0030711 with a RACGAP1 genetic record (PMID:36200420, PMID:34818416); RACGAP1 and GO:0097149 centralspindlin complex added to the CDA III cytokinesis node, whose description now covers both centralspindlin genes. (2) The bundled 'CDA transcription-factor-related' row is split into 'CDA IV' (KLF1, MONDO:0013355; PMID:21055716, PMID:36798023) and 'GATA1-related CDA' (GATA1, MONDO:0019031, the Orphanet-derived class under both CDA and MONDO:0010308; PMID:10700180); genetic subtype keys updated. (3) GATA1 and KLF1 were the entry's two unwired genes; a new 'Erythroid transcription factor dysfunction' node carries both, feeds Ineffective erythropoiesis, and links to a new Thrombocytopenia phenotype scoped to the GATA1 subtype. Not done: the recessive KLF1 form (MONDO:0975829, CDA IVb) keeps its own stub because no cached source with an abstract establishes it yet; the broader GATA1 thrombocytopenia classes keep their stubs.

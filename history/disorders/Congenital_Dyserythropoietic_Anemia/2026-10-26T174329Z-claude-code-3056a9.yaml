  summary: 'Review round: split KLF1 and GATA1 transcription-factor node'
  details: |
    Addressed the blocking review on PR 15564. The node 'Erythroid transcription factor dysfunction' bundled the KLF1 (CDA IV) and GATA1 lesions, so megakaryocyte differentiation and the Thrombocytopenia edge also applied to KLF1, which CDA IV does not show. Split into 'KLF1 dominant-negative transcriptional defect' (KLF1, GO:0000981 ABNORMAL, erythrocyte differentiation DECREASED, PMID:21055716, edge to Ineffective erythropoiesis) and 'GATA1-FOG1 interaction loss' (GATA1, GO:0001221 transcription coregulator binding DECREASED, erythrocyte and megakaryocyte differentiation DECREASED, PMID:10700180, edges to Ineffective erythropoiesis and Thrombocytopenia). biological_scale set to CELLULAR on both, since they carry cell-differentiation processes. Optional suggestions taken: directness INDIRECT on the PMID:10700180 Thrombocytopenia edge evidence; congenital onset and severity SEVERE on the Thrombocytopenia phenotype, both stated in the cited snippet. Validated with just validate, validate-terms, count-verified-snippets (69/69), check-causal-targets, check-entity-refs and validate-disorders.

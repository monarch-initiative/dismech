  summary: 'Create: DENND5A-Related Developmental and Epileptic Encephalopathy (DEE49)'
  details: |
    New Disease entry for DENND5A-related developmental and epileptic encephalopathy (DEE49, MONDO:0015002, OMIM 617281), autosomal recessive, caused by biallelic loss-of-function variants in DENND5A (hgnc:19344).

    Mechanism curated as 13 atomic pathophysiology nodes tracing the developmental chain: biallelic variants -> reduced DENND5A protein -> loss of the conformation-gated DENND5A-MUPP1/PALS1 apical polarity interaction -> mitotic spindle misorientation in apical neural progenitors (WT 57.1 deg vs KO 26.0 deg) -> loss of symmetric proliferative division -> premature neuronal differentiation and progenitor pool depletion -> shortened neurogenesis -> microcephaly, cortical malformation and compensatory ventriculomegaly -> aberrant connectivity of prematurely born neurons -> seizures. A parallel Rab-GEF/neurotrophin-receptor arm from the 2016 founding study is retained as an ALTERNATIVE mechanistic hypothesis rather than merged into the spindle chain.

    Module conformance attaches at epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures (the clinical endpoint) and deliberately NOT at the excitation-inhibition or hyperexcitability nodes, because no source measures excitation-inhibition balance, network synchrony or intrinsic excitability in DENND5A-deficient neurons. That absence is recorded as an open KNOWLEDGE_GAP.

    Five discussions: a CONTROVERSY on the R710H gain-of-interaction finding versus the loss-of-function model; KNOWLEDGE_GAPs on the unexplained route from the polarity complex to spindle angle (the obvious trafficking explanation is excluded by the PALS1 localization negative result), on the evidence for the seizure step, and on which progenitor stage is affected; and a HUMAN_MODEL_MISMATCH on the adult mouse subventricular zone standing in for embryonic cortical neurogenesis.

    Negative results preserved rather than dropped: PALS1 still localizes apically in knockout rosettes (UNCHANGED); GFAP-positive SVZ stem-like cells do not fall significantly (UNCHANGED); no spontaneous seizures in the knock-in mouse (UNCHANGED, driving PARTIALLY_RECAPITULATES); and relative brain size is not significantly reduced in the mouse, curated as FAILS_TO_RECAPITULATE with REFUTE evidence.

    Validation: just validate passed; 73/73 snippets verified against cached references; just validate-terms passed; check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean.

    Evidence base is two cached primary sources: PMID:27866705 (founding report, abstract only) and PMID:39174524 (2024 Nature Communications cohort and mechanism study, full text). PMID:27431290 was fetched and deliberately not used because its retrievable abstract does not mention DENND5A. Three ontology terms proposed by the deep-research report were rejected after OAK checking (GO:0051654, CL:0002608, CL:0000060 are mitochondrion localization, hippocampal neuron and odontoblast respectively) and replaced with GO:0000132, CL:0000681 and CL:0011020.

  details: |
    Addresses the CRITICAL finding, all four IMPORTANT findings and the three suggestions in the ai4c-reviewer CHANGES_REQUESTED review of PR #9101.

    CRITICAL - global developmental delay absent. A real and material omission: GDD is present in 23 of 24 reported individuals (96 percent), making it MORE frequent than the seizures the entry led with, and it is the 'D' in developmental and epileptic encephalopathy. Added at VERY_FREQUENT rather than OBLIGATE because the source names a single exception (participant 8, biallelic missense, also the only cohort member with no intellectual disability). Also added intellectual disability at VERY_FREQUENT with the severity distribution in the evidence (9 severe, 3 profound, 2 moderate, 1 none among those assessed after age 5) - curated as the general term rather than four severity phenotypes because the source reports one assessment per patient across a spectrum, not co-occurring findings. Also added inability to walk independently at FREQUENT (16/24 derived from the stated 8/24 who could), with the microcephaly-motor association statistic.

    IMPORTANT 2 - five evidence items tagged HUMAN_CLINICAL for in-vitro results. All five retagged IN_VITRO. Per CLAUDE.md, IN_VITRO covers cultured cells human or animal; human-derived does not make a result clinical. The clearest case names iPSCs in its own snippet. The roughly twenty cohort-frequency items remain correctly HUMAN_CLINICAL.

    IMPORTANT 3 - HP:0002069 dropped the focal onset that the phenotype name and its own snippet both assert. Rebound to HP:0007334 bilateral tonic-clonic seizure with focal onset.

    IMPORTANT 4 - the genetic counseling evidence was the paper's generic closing sentence about being clinically informative, which did not state the 25 percent recurrence risk or the reproductive options the description asserted. Replaced with the on-point paragraph naming genetic counselors, carrier testing of the second parent, and IVF with preimplantation genetic diagnosis. Added a second PARTIAL item recording that 13 percent of the cohort did not meet DEE criteria - the counseling-relevant reading of the same 3-of-24 already on the seizure endpoint node.

    IMPORTANT 5 - neuroimaging absent from diagnosis. Added brain MRI (NCIT:C16809), framed as how these patients reach genetic testing rather than how the diagnosis is made. CT is noted as an acceptable substitute but not separately curated, with the reason given.

    SUGGESTION 6 - hypotonia. Deliberately still omitted, and the omission is now recorded in notes with its reason: it comes from the OMIM clinical synopsis via the research report, not from either primary source, and neither cached paper states it quotably. The cohort's counted motor findings are curated instead.

    SUGGESTION 7 - the previous history record and the PR body both said 13 pathophysiology nodes. The file has 14. History records are append-only so the earlier record is not rewritten; the correction is recorded here instead, and the PR body was updated.

    SUGGESTION 8 - the variant-class prognostic gradient is in genetic.association rather than genetic.notes as the review supposed, with both statistics attached. It is now also referenced from the new motor phenotype, which is where it has clinical consequence.

    Beyond the review: added a differential_diagnoses section with four entries - pseudo-TORCH/OCLN-related band-like calcification (the closest mechanistic mimic, since OCLN also disrupts progenitor symmetric division, distinguished by polymicrogyria and by basal ganglia dysplasia), congenital cytomegalovirus infection, LIS1-related lissencephaly (distinguished by absent calcifications and by bidirectional corpus callosum variation), and the tubulinopathies. The imaging material for all four was already in the cached full text and was previously used only in prose. The LIS1 and tubulinopathy entries carry no disease_term, with the reason recorded in each: MONDO has no single class term for either as the source uses them.

    Validation: just validate passed, snippets 84/84 verified (was 73/73); just validate-terms passed; check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean. No new references were needed - every addition came from PMID:39174524, already committed in this PR.

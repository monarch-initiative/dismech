  summary: Bind the cerebellar ataxia complication to postinfectious cerebellitis
  details: |
    Adds acute cerebellar ataxia as a phenotype, bound to MONDO:0850107 postinfectious
    cerebellitis, the disease term of the Postinfectious_Cerebellitis entry, which curates the
    complication in full; until now this entry named the complication only in prose. The
    evidence is a series of 73 consecutive children with acute cerebellar ataxia seen at one
    hospital over 23 years, of whom 26% had chickenpox, and in which every child with chickenpox
    followed for four months or longer recovered completely from the ataxia (PMID:8210223,
    already cached and graded as the Postinfectious_Cerebellitis entry grades it). The phenotype
    enum cache gains the MONDO term. Validation: just validate passes, all 73 snippets verify,
    and the targeted gates pass.

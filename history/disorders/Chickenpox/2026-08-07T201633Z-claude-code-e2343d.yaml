  summary: Link seasonality, crowding, and immunosuppression to VZV nodes
  details: |
    Backfill for issue #8085. The three exposures act at two different nodes and take three different effect values. Immunosuppression is EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES into the T-cell-associated viremia node: cell-mediated immunity is what contains that viremia, so the exposure removes a brake on a stage already under way rather than starting the infection. Seasonal variation is MODULATES, the one place in this tranche where that value is correct, because transmission rises and falls with the calendar rather than moving in one direction; the intermediates are left unknown because the paper cited is itself an investigation of which seasonal driver is responsible. Overcrowded living conditions is PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES and supports PARTIAL. Its pre-existing evidence item quotes only an outbreak report title, whose cached record carries no abstract, so the link instead cites a prospective household study already curated in this entry that puts the varicella secondary attack rate at 75 percent. That measures household contact rather than crowding as such, which is why it is partial. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 69 of 69 verified.

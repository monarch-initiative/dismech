  summary: 'Create: Thyroid dyshormonogenesis 5 (DUOXA2)'
  details: |
    New Disease entry for thyroid dyshormonogenesis 5 (MONDO:0010137), claimed via issue #9217.

    Lump/split decision: DISEASE, but this was a genuine judgement call and is recorded as an auditable discussion in the entry rather than left implicit. Congenital_Hypothyroidism.yaml already carries a Dyshormonogenesis has_subtypes entry bound to MONDO:0010132 -- the direct MONDO parent of this entry's term -- and names DUOXA2 in prose. That subtype carries no per-gene mechanism, and a lumped subtype cannot distinguish a maturation-factor defect from a defect in a hormone-synthesizing enzyme, which is the point of interest for TDH5. The repository has precedent both ways (Central_Congenital_Hypothyroidism is standalone alongside a Central subtype in the same parent entry). Recorded in discussion tdh5_boundary_with_congenital_hypothyroidism_entry, noting the open Loeys-Dietz reconciliation may change the convention.

    Mechanism curated as a five-node chain plus one modifier node: DUOXA2 loss of function -> failure of DUOX2 maturation and apical trafficking -> deficient apical hydrogen peroxide generation -> partial iodine organification defect -> goitrous congenital hypothyroidism. The distinguishing feature preserved throughout is that DUOXA2 is a maturation factor, not a synthetic enzyme: its loss strands DUOX2 in the ER rather than removing a catalytic step.

    The DUOXA1 partial-compensation model is curated as a separate role: modifier node at PROVISIONAL confidence, not folded into the main chain, because the evidence is one in-vitro study plus a single-proband severity comparison that cannot separate paralogue compensation from allele-specific residual function or from ascertainment (the proband was found by screening a partial-organification-defect cohort, which selects against severe cases). An open KNOWLEDGE_GAP records this.


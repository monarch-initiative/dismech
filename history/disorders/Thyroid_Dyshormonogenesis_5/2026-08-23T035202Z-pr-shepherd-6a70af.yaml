  summary: 'Review fixes: drop permanent-only framing, correct biallelic-only claim'
  details: |
    Addressed findings 2, 3 and 4 of the ai4c-reviewer CHANGES_REQUESTED review on
    PR #9262. Each is a claim the entry asserted that its own cached references
    contradict; each was re-verified against the cache before editing.

    Finding 3 (permanent-only framing). The pathophysiology node "Goitrous
    Congenital Hypothyroidism" asserted "permanent rather than transient congenital
    hypothyroidism", and the "Congenital Hypothyroidism" phenotype opened
    "Permanent primary congenital hypothyroidism". Both contradicted the entry's own
    notes ("Do not restore a permanent-only reading") and its own Transient
    Congenital Hypothyroidism phenotype. Reworded to span both outcomes, with the
    phenotype cross-referencing the transient arm.

    Finding 2 (genetic frequency). "Biallelic in all reported TDH5 patients" is
    false per PMID:28100324, cached in this PR, which reports 2 homozygous and 4
    monoallelic heterozygous DUOXA2 patients. Replaced with a statement scoped to
    the index families that records the monoallelic cohort carriers and marks their
    sufficiency unresolved.

    Finding 4 (denominator). The Transient CH phenotype claimed transience is "the
    more common outcome in DUOXA2 disease, not the exception". Per PMID:28100324 the
    4/6 transient majority is carried by monoallelic heterozygotes, and the two
    p.Tyr246Ter homozygotes split one transient and one mild permanent. Rewritten to
    keep the refutation of the permanent-only reading while stating that the
    biallelic balance is unresolved on n=2. The same caveat was added to the
    corresponding evidence explanation and to the entry notes.

    Deliberately not addressed, left for the entry author (hence outcome
    needs_followup): finding 1 (PMID:27349010 describes monoallelic dizygotic twins
    carrying variants in different genes, and is the sole evidence for the "Thyroid
    Enlargement with Preserved Gland" phenotype); finding 5 (five phenotypes over
    two distinct HPO terms, with duplication); finding 6 (no deep-research
    artifact); finding 7 (iodine supplementation and the trial-off-levothyroxine
    strategy unmodeled as treatments). Each requires restructuring or removing
    phenotype entries, which admits several valid resolutions rather than one
    determined fix.

    Validation on the changed file: just validate (passed), just validate-terms
    (passed), just count-verified-snippets (31/31 verified against cached
    references), plus the ungated CI gates check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-environmental-evidence and
    check-duplicate-keys (all OK). No reference cache files were created or edited.

  summary: 'Genetics pass: subtype gene bindings, GeneReviews FS1 baseline'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12196, epic #12189). The
    lightest of the five entries: both causal genes were already curated with HGNC
    bindings and both already reached the pathograph.

    Research first. check-genereviews reported a CANDIDATE_CHAPTER, "Feingold
    Syndrome 1" (PMID:20301770, NBK7050), which the entry did not cite. It was
    fetched, read, tagged in a new top-level references block, and quoted twice:
    the diagnostic criterion ("a heterozygous pathogenic variant in MYCN") on the
    MYCN genetic record, and the familial-transmission figure with its explicit
    statement that the de novo proportion is unknown on the inheritance block.
    ClinGen has no row for MYCN or MIR17HG in the validity table committed here.

    MIR17HG. The gene is a microRNA cluster host gene rather than a protein-coding
    gene; hgnc:23564 was confirmed against the committed HGNC term cache and
    resolves to the MIR17HG symbol, so the existing binding stands.

    Wiring. Both has_subtypes rows gained a genes list (Type 1 MYCN, Type 2
    MIR17HG). Two mechanism nodes that named a gene only in prose now bind it:
    "Reduced PI3K signaling in limb mesenchyme" binds MYCN and "Increased TGF-beta
    signaling in limb mesenchyme" binds MIR17HG, matching the mouse evidence each
    node already carried. The shared downstream node "Impaired embryonic
    morphogenesis" was deliberately left without genes.

    MONDO reconciliation: both MONDO-recorded genes (MYCN hgnc:7559, MIR17HG
    hgnc:23564) were already present and are now bound at the subtype carrying each
    MONDO term. No disagreement with MONDO on this entry.

    Validation: just validate, validate-terms, count-verified-snippets (48/48),
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-genereviews,
    list-gene-term-mismatches, and the batched just validate-disorders.

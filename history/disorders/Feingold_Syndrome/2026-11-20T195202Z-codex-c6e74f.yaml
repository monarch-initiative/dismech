  summary: Map Feingold syndrome to OMIMPS:164280
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS164280 contains MYCN-related Feingold syndrome 1 (OMIM:164280) and MIR17HG-related Feingold syndrome 2 (OMIM:614326). Both are already curated as subtypes here and are the two children of MONDO:0015267 in the September 2026 snapshot. Shared microcephaly and digital developmental abnormalities support the syndrome-level Disease, while the transcription-factor and microRNA-cluster lesions and their downstream signaling differences remain explicit. Gastrointestinal atresia is less typical in type 2 and is not imposed on every member. This aligns the full syndrome rather than type 1 alone or all MYCN-related conditions.

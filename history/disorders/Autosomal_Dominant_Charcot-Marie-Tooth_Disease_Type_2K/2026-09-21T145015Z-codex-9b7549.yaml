  summary: Review dominant GDAP1 neuropathy across clinical, structural and model
    evidence
  details: |
    Read the complete entry, matching deep-research report and citation assessment, all inherited cached sources, the retired GDAP1 GeneReviews chapter and current CMT GeneReviews baseline. Full scientific bodies were consumed for the dominant-family cohort, Korean cohort, sensory series, atypical respiratory case, structural studies, recessive iPSC and knockout models, and newly recovered dominant-fibroblast bioenergetic and JPH1 papers. Independent peers audited the two structural sources and complete JPH1 manuscript, then checked their integrated records. Sources remaining abstract-only are identified in the review notes; no inaccessible methods were invented. Replaced the bundled mitochondrial-to-axon chain with eleven atomic observations and explicitly qualified causal bridges. Purified thermal stability is not cellular turnover or a demonstrated fusion mediator; complex-I, ATP, ROS and apoptotic susceptibility remain assay- and allele-specific. R120W and C240Y fibroblasts differ in oxidative stress, and resveratrol remains an in-vitro observation. JPH1 is a one-family candidate modifier, with negative co-immunoprecipitation and mitochondrial-blocker rescue limits preserved. Null mouse and recessive patient-neuron models do not establish dominant-allele mechanisms. Expanded clinical coverage and diagnostic care while removing unrepresentative pooled frequencies, correcting patient/family/VUS denominators and retaining source-internal inconsistencies. Current general-CMT supportive care is distinguished from GDAP1-specific efficacy. Verified new bindings and rejected an HPO pain-characteristic modifier as a phenotype binding. Authoritative validation passes schema, live terms and all 153 cached excerpts; scoped and whole-KB reference/content guards pass. No reference cache was hand-edited; all added or refreshed records came through sanctioned fetching.

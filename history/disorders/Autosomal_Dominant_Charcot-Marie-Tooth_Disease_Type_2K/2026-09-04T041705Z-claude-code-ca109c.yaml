  summary: 'Self-review fixes: AD-CMT2K evidence and binding corrections'
  details: |
    Adversarial self-review pass over the entry created earlier in this session, run in a fresh-context subagent against the dismech-pr-review skill. Six real defects were found and fixed. (1) The Foot Deformity phenotype bound HP:0001761 Pes cavus, but its only evidence (PMID:28236508) says 'foot deformities' without specifying pes cavus, and the entry elsewhere quotes PMID:35656516 saying 'no pes cavus' - the binding was both unsupported and contradicted by a source the entry itself cites. Rebound to HP:0001760 Abnormal foot morphology with the reason recorded in the description. (2) The dominant-allele node carried mitochondrial fission modifier ABNORMAL, which contradicts that node's own description and attributes the recessive lesion to the dominant form; removed, as no cited source supports altered fission in dominant CMT2K. (3) The claim that thermal destabilization is 'the structural basis for a dominant rather than loss-of-function effect' was an unsupported inference, and is contradicted by PMID:37058526, which reports the same destabilization for the recessive R120Q allele; reworded to state that dominance is not established at the protein level, and PMID:37058526 cited on the node. (4) Three uncited assertions fixed: the gene locus 8q21.11 appears in no cited reference and was removed; the alleles A247V and R282H and the statement that GDAP1 has no demonstrated catalytic activity are now both cited to PMID:37058526. (5) 'Areflexia' in a pathophysiology description was uncited and cut against PMID:35656516's 'normal reflexes in four out of the five subjects'; rewritten to state that reflexes are not uniformly lost, naming both the severe case and the mild series. (6) HP:0003710 Exercise-induced muscle cramps was narrower than the evidence, which says only 'cramps'; rebound to HP:0003394, the repo's convention for generic cramps. Two substantive gaps were also closed: a genetic entry for reduced penetrance and variable expressivity, quoting PMID:28236508, PMID:35656516 and PMID:29372391 - this matters because incomplete penetrance is the mechanism behind the ascertainment hypothesis the entry's own severity KNOWLEDGE_GAP proposes testing, which was previously argued without curating the supporting datum - and a diagnosis section covering the axonal nerve-conduction pattern with the caveat that mild dominant carriers may have near-normal studies, plus confirmatory GDAP1 testing. An experimental_models block was added for the hiPSC-derived motor neuron model (PMID:34440148), curated as PARTIALLY_RECAPITULATES / fidelity LOW with a REFUTE evidence item, because the patient carries a homozygous premature-termination-codon allele (a recessive loss-of-function genotype, described by the authors as CMT2H) and because ATP production was preserved, so the bioenergetic half of the target node is not reproduced. One unsupported cell_types binding (motor neuron on a node evidenced only by HeLa transfection work) was removed. Two quote errors of my own were caught by the validator during these edits and corrected against the cached source: an inexact crystal-structure quote from PMID:37058526 and a truncated reference_title for PMID:34440148. Validation after fixes: just validate and just validate-disorders pass; 53/53 snippets verified; duplicate-key, entity-ref, causal-target, qualifier-term and enum-value checks OK; model-scale-audit --strict exits 0.

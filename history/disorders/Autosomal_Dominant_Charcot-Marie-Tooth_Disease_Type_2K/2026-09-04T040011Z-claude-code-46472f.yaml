  summary: 'Create: Autosomal dominant Charcot-Marie-Tooth disease type 2K'
  details: |
    De novo curation of AD-CMT2K (MONDO:0020558, GDAP1). Deep research: falcon was requested but is unusable in this environment - EDISON_API_KEY is set but authentication fails, and --fallback did not engage because the Edison client raises during construction before fallback logic runs (tried plain --fallback and explicit --fallback-provider). The run that produced the committed report is research/Autosomal_Dominant_Charcot-Marie-Tooth_Disease_Type_2K-deep-research-claude_code.md. That report's own validation returned needs_review: true with quotes_valid 1 of 9 despite confabulation_rate 0.0, and its term validation flagged CL:0000097 (actually 'mast cell') labelled 'sensory neuron' plus two mislabelled UBERON terms and one unresolved HP term. No quote or ontology term was taken from the report. Every snippet in the entry was copied verbatim from the locally cached abstract of the cited PMID, and every ontology binding was taken from the already-validated local term caches. The report was used only as a lead source; PMID:35656516 (mild predominantly sensory heterozygous GDAP1 presentation) came from it. GeneReviews baseline: PMID:20301711 (GDAP1-Related HMSN, retired chapter) fetched, tagged GeneReviews in the top-level references block, and its Clinical Characteristics cross-referenced; its Agents/Circumstances to Avoid section is curated as a treatment entry. Key curation decision: the pathophysiology chain was built on PMID:19782751, which shows recessive GDAP1 alleles reduce mitochondrial fission while dominant alleles interfere with fusion and raise ROS. An initial draft had the dominant mechanism as impaired fission, which is the recessive lesion; this was corrected against the source. The Gdap1 knockout mouse is curated as PARTIALLY_RECAPITULATES with fidelity LOW and an explicit REFUTE evidence item, because a null allele models the recessive lesion rather than the dominant one. No molecular_functions term is bound on the initiating node because GDAP1 has no demonstrated catalytic activity or in vivo substrate. The AD-versus-AR severity question is curated as an open KNOWLEDGE_GAP carrying both supporting cohorts and the contradicting cohort (PMID:28495047) rather than asserting the tidy 'dominant is milder' version. Resveratrol restoring complex I in patient fibroblasts is recorded in notes, deliberately not as a treatment. Validation: just validate passes; 42/42 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK on the file; check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens all report no new violations KB-wide; model-scale audit clean.

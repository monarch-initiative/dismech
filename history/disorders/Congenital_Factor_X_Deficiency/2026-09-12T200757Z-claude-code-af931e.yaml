  details: |
    Answers the CHANGES_REQUESTED review on PR #11744 in one push.

    Blocking items addressed:
    1. reference_title added to all 57 pre-existing evidence items, each copied verbatim from the title: frontmatter of the corresponding references_cache file by script, never typed. check-reference-titles passes.
    2. Antifibrinolytic therapy added to treatments, citing the two sentences already present in references_cache/PMID_35059555.md. Bound tranexamic acid (CHEBI:48669, read from cache/chebi/terms.csv). epsilon-aminocaproic acid is named in the description but deliberately not bound as a second therapeutic_agent because it has no row in the local CHEBI cache.
    3. Menorrhagia phenotype added (HP:0000132, label read from cache/hp/terms.csv), banded FREQUENT, plus a downstream edge from Systemic Bleeding Tendency so it is connected in the pathograph rather than orphaned.
    4. animal_models added: F10 total knockout mouse (PMID:12161341), f10-/- zebrafish (PMID:28576875), and naturally occurring feline factor X deficiency (PMID:9290823). All three carry modeled_mechanisms links to Systemic Bleeding Tendency with fidelity, model_scale and limitations; all evidence graded MODEL_ORGANISM.

    Suggestion taken: a biochemical FX:C marker with a 50-150 IU/dL reference range and three interpretation_bands for the severe/moderate/mild strata, which gives the fx_activity_severity_discordance knowledge gap something concrete to attach to. biomarker_term is left unbound because NCIT has no factor X activity measurement term in the local cache.

    Departure from the review, argued in the PR reply: the reviewer's suggested menorrhagia sources (PMID:35059555, PMID:34024682) do not contain the word, and PMID:18403394 carries it only as per-patient table fragments that would fail check_snippet_length. A new systematic review of 332 women (PMID:30901144) was fetched instead, which reports heavy menstrual bleeding in 25 percent.

    Not done: no top-level references: block. That slot is for references with key findings and is optional; Asthma and Amyotrophic_Lateral_Sclerosis carry none. reference_title on each evidence item is the convention that actually guards against fabricated titles, and that is now complete.

    Validation: 69/69 snippets verified, schema and term validation pass, no duplicate keys.

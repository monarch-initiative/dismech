  summary: 'Create: Congenital Factor X Deficiency (F10, MONDO:0009212)'
  details: |
    De novo curation of congenital factor X deficiency from claim issue #11738.

    Mechanism curated as a six-node chain from biallelic F10 loss-of-function variants through reduced functional plasma factor X, impaired prothrombinase complex activity, reduced thrombin generation and impaired fibrin clot formation to a systemic bleeding tendency. Factor X was chosen as a single non-redundant common-pathway step, which is what makes the chain short and the laboratory picture (simultaneous PT and aPTT prolongation) derivable from the mechanism rather than merely listed.

    Type I and type II are modelled as has_subtypes rather than separate diseases: they converge on the same prothrombinase defect and differ only in whether the defective protein is absent or present but non-functional. The subtype definitions are anchored to PMID:35059555, a variant database over 427 case reports, rather than to any single cohort, because at least one curated cohort (PMID:26222694) reports uniformly reduced antigen and then labels those patients type II, inverting the usual convention.

    Deep research: one openscientist report was run and is committed alongside the entry (research/Congenital_Factor_X_Deficiency-deep-research-openscientist.md). just preflight-dr returned WARN for a rival gene GLA at 27 percent of F10 mentions; that is a false positive, since every GLA occurrence in the report is the gamma-carboxyglutamic acid domain of factor X and not the GLA gene. The report's own Term Validation section flagged two genuine confabulations in its HPO table, HP:0040189 offered as Reduced factor X activity (HPO calls it Scaling skin) and HP:0031364 offered as umbilical stump bleeding (HPO calls it Ecchymosis), plus one nonexistent identifier HP:0002320. None of those reached this entry: every CURIE here was read from cache/ or an OAK lookup at the moment it was written, so the entry uses HP:0008321 and HP:0011884 instead. The report contributed the type I/II definition, the four-domain protein architecture and the variant spectrum, each cited to its own PMID.

    No pathophysiology node declares conforms_to. kb/modules/ was searched for a coagulation-cascade module and none covers a single-factor common-pathway defect.

    Validation: just validate passed with 57/57 snippets verified against the local reference cache; just validate-terms passed; check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms all clean. The cache diff carries three row reorderings on main that normalize-cache corrected (MONDO:0009872/0009874 and MONDO:0030719/0030723/0030724); these are surfaced rather than reverted, per the cache ordering rules.

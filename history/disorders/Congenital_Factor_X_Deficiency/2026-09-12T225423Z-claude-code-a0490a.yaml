  summary: 'Review round 2: correct the menorrhagia frequency band, add two obstetric
    phenotypes'
  details: |
    Answers the single blocking finding of the round-2 re-review, plus both of its suggestions, in one push.

    Blocking: the Menorrhagia frequency band was FREQUENT, which the schema defines as 30-79 percent. The cited figure from PMID:30901144 is 72/284 (25 percent), which is OCCASIONAL (5-29 percent). The reviewer is right and I introduced this error in the previous round: I set the band and then wrote an explanation asserting the quote was its source, so the band contradicted both the number and the two prose fields pointing at it. Changed to OCCASIONAL and reworded the explanation to say why the 47 percent case-report subset does not govern: it is the ascertainment-biased half of the same pooled estimate. The description no longer says 'a large minority'.

    Suggestion taken 1: added two further phenotypes from the same already-cached abstract, so no new fetch. Postpartum hemorrhage (HP:0011891, verified in cache/hp/terms.csv and by a live ols:hp lookup), 22 percent of deliveries, OCCASIONAL. Hemoperitoneum from ovulation bleeding or a ruptured haemorrhagic ovarian cyst (HP:0011854, read from cache/hp/terms.csv), 2.4 percent, VERY_RARE. Both get downstream edges from Systemic Bleeding Tendency so they join the pathograph rather than dangling. Preterm birth and neonatal death from the same abstract are not curated: they are outcomes of the pregnancy rather than phenotypes of the proband, and the entry has no obstetric-outcome slot that would not misfile them.

    Suggestion taken 2: corrected the reference-range note. It claimed the source's implicit 5-6 percent gap 'is not closed here', but the moderate band carries upper_bound 6.0 and the half-open [lower, upper) convention does assign 5-6 percent to moderate. The note now states the encoding accurately instead of disclaiming something the data does not do. This was my inaccuracy about my own encoding, not a data defect.

    Verification beyond the standard gates: wrote a cross-check comparing every frequency band in the entry against the percentages appearing in its own evidence snippets. All three pass. The reviewer noted correctly that check_enum_values cannot catch this class, because it checks that a value is permissible in its slot, not that it agrees with the evidence beneath it.

    Validation: 71/71 snippets verified, schema and term validation pass, all nine whole-KB gates green.

  details: |
    The entry had no diagnosis: section. Added a Pure-Tone Audiometry row with the panel and eight per-ear frequency codes as measurements, plus the Global Burden of Disease hearing-loss grade bands (PMID:31656340), the same convention used on prior LOINC tranche G hearing-loss entries. Notes explain that DFNB37's congenital profound loss falls in the scheme's top band while DFNA22's progressive course (quantified in the entry's own cited PMID:32143290 at 0.57 dB/year, accelerating to 1.07 dB/year after age 40) is not a single severity but a rate the bands cannot represent on their own. Part of LOINC tranche G batch 12 (projects/LOINC_DIAGNOSTICS.md).

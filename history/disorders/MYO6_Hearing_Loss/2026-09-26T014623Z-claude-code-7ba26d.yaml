  summary: 'Review round 1: fix self-inflicted GeneReviews CITED_UNTAGGED; trim edit-history
    prose'
  details: |
    Review round 1 on PR #12870.

    Blocking finding, accepted. The GeneReviews note added in the previous round
    named the family-level overview chapter by PMID. The GeneReviews checker reads a
    chapter identifier appearing anywhere in the file as a citation, so the note made
    check-genereviews report CITED_UNTAGGED - a class --strict gates on - where it
    had reported NO_CHAPTER before the note existed. The note now names the chapter by
    title only and records why, and check-genereviews reports NO_CHAPTER again with
    --strict exiting 0.

    The alternative fix, tagging the chapter as GeneReviews in references:, was not
    taken. The chapter is a real GeneReviews chapter and it does cover this gene
    family, but tagging it would read as this entry having its GeneReviews baseline,
    and it has none: the chapter's cached record contains no sentence mentioning MYO6,
    DFNA22 or DFNB37, so it supports no claim here.

    Three suggestions accepted, all removing sentences that described the edit rather
    than the disease. The mapping_justification no longer says the class was
    previously bound as disease_term, nor why no descendant count is given; it states
    the present mapping and its reason. The case_fractions note no longer says the
    figure used to sit in a deprecated prevalence percentage slot. The Orphanet
    paragraph keeps the search and its result and drops the advice about what
    refreshing Orphadata needs.

    One suggestion accepted on wording: the Cardiac Involvement to Hypertrophic
    cardiomyopathy edge now states the causal claim directly rather than reporting
    what the cited work says.

    Gates re-run after the edits: validate-disorders 0 issues, 30/30 snippets, 30/30
    titles; validate-terms passed; 5/5 gene bindings name the gene the entry names;
    duplicate-keys, entity-refs, causal-targets, enum-values and qualifier-terms all
    OK. Seven reference cache files rewritten by the validator were reverted before
    staging, per dismech#12672.

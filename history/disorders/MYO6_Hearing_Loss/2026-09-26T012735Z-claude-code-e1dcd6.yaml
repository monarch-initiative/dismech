  summary: 'Genetics pass: fix over-broad MONDO anchor, bind DFNA22/DFNB37 subtype
    terms, wire phenotypes'
  details: |
    Genetics pass for the d2g series-001 gap list (issue #12208), whose 25 diseases
    were attributed to this entry.

    Anchor correction. This entry bound MONDO:0019497 nonsyndromic genetic hearing
    loss as its disease_term, asserting identity between a MYO6-specific entry and
    the class covering every nonsyndromic genetic hearing loss. That is the
    over-broad anchor pattern of issue #12184, and it is why the coverage comparison
    attributed 25 MONDO diseases to this entry when only two of them are MYO6
    diseases. Following the ANK2_Related_Complex_Neurodevelopmental_Disorder
    precedent, disease_term now carries the free-text preferred term with no binding
    and MONDO:0019497 is recorded in mappings.mondo_mappings as skos:broadMatch,
    which leaves that class in the curation queue rather than retiring it here.
    A synonym-inclusive MONDO search for MYO6 returns only the two subtype classes;
    a search for myosin VI returns none.

    Subtypes. The two DFNA22 and DFNB37 has_subtypes rows now carry bound
    subtype_term values (MONDO:0011660 and MONDO:0011912), a MYO6 genes descriptor,
    an inheritance block, and their own evidence. The two stubs keyed on those MONDO
    ids are deleted.

    Genetic records. The single MYO6 genetic record was split into a dominant
    DFNA22 record and a biallelic DFNB37 record, each with a reciprocal subtype
    foreign key, so the subtype rows are stratified rather than only declared. Every
    existing variant and evidence item is preserved; the DFNB37 record gains the
    PMID:12687499 cosegregation sentence and a note that ClinGen has classified MYO6
    only under autosomal dominant inheritance.

    Prevalence to case fraction. The deprecated prevalence percentage 2.4 for
    Japanese ADSNHL families was not a population prevalence but the share of a
    disease cohort explained by MYO6, so it moved to
    genetic[DFNA22].case_fractions with the same source, quotation and explanation,
    plus cohort_size 1336. No prevalence record remains, because no source in this
    entry reports the occurrence of MYO6-related hearing loss in a population.

    Pathograph. All four phenotypes were disconnected; the check now reports 4/4
    causally connected, by adding downstream edges from the Progressive
    Sensorineural Hearing Loss node to the two hearing phenotypes and from the
    Cardiac Involvement node to the two cardiac phenotypes. The three
    dominant-specific phenotypes carry subtype DFNA22.

    Notes added for the verified GeneReviews negative, the Orphanet records not
    being reachable from a worktree, and the 6q13 versus 6q14.1 locus notation
    difference between the quoted papers and HGNC's current record.

    Validation under linkml-reference-validator 0.3.0rc1: 30/30 snippets verified,
    validate-terms passed, 5/5 gene bindings name the gene the entry names, and
    validate-disorders passed. Nine reference cache files rewritten by the validator
    were reverted before staging, per dismech#12672.

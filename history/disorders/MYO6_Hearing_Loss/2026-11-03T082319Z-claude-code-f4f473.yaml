  summary: 'Edit: MYO6_Hearing_Loss - mechanism chain, variants, phenotypes, models,
    preclinical therapies'
  details: |
    Augmented the existing entry from the committed falcon deep-research report (research/MYO6_Hearing_Loss-deep-research-falcon.md, no new provider run) plus PubMed lookups. Pathophysiology: added a molecular root node (myosin VI motor and dosage dysfunction; Tailchaser D179Y ATPase data PMID:18833301 and the Belgian overexpression family PMID:18212818) feeding the stereocilia node, and a hair cell degeneration node (PMID:31103816, PMID:42665733); added Snell's waltzer stereocilia fusion evidence (PMID:10525338, PMID:7493015), espin1 microvillus in-vitro evidence (PMID:32143290), GO:0120045 stereocilium maintenance, edge evidence, and biological_scale on every node. Replaced the DOI-keyed Yin 2023 citation with PMID:37258513. Phenotypes: added postlingual SNHI (HP:0008596), congenital SNHI (HP:0008527) and profound SNHI (HP:0011476), all wired from the cochlear lesion node. Genetic: Korean 6.2% case fraction and variants C442Y, R205X, G223R/T158R, IVS23+2321T>G, Arg925Ser, cis Trp793Gly;Lys794Asn, R1166X, E216V (PMID:29607572, PMID:39664812, PMID:38274113, PMID:12687499). Treatments: preclinical allele-selective Cas9 editing (PMID:34174443) and failed neonatal AAV replacement in the null mouse (PMID:42665733, REFUTE). Animal models: names and modeled_mechanisms links on Snell's waltzer and C442Y, new Tailchaser and zebrafish myo6b entries. Diagnosis: molecular genetic testing row. Mohiddin 2004 (PMID:15060111) was re-fetched with --force but full text is unavailable, so it stays uncited. Validated with just validate (61/61 snippets), entity-ref, causal-target, enum, logical-rule and baseline snippet gates.

  summary: Record ClinGen Definitive validity for MYO6 (DFNA22) and correct two GO
    bindings
  details: |
    Added a gene_disease_validity assertion on the DFNA22 gene record copying the ClinGen Hearing Loss Gene Curation Expert Panel classification for MYO6 (Definitive, autosomal dominant, 2018-02-20), scoped to the DFNA22 subtype; the entry already cited the record and already mapped MONDO:0019497 as a broad match. ClinGen has no autosomal recessive MYO6 hearing-loss record, so the DFNB37 gene record carries no tier. Set variant_origin GERMLINE on the DFNA22 record. Two nodes bound GO:0000146 microfilament motor activity; they now bind GO:0060001, the minus-end directed term, since reverse directionality is what defines myosin VI. Removed the endocytosis ABNORMAL binding from the stereocilia node: the Snell's waltzer paper the node already cites reports FM1-43 uptake in mutant hair cells, and that sentence is now quoted on the node. The CGGV cache file was built from the ClinGen export downloaded 2026-11-11, newer than the pinned manifest snapshot, where it was not already committed. Validated with just validate-disorders, count-verified-snippets, check-gene-validity and the offline whole-repo gates.

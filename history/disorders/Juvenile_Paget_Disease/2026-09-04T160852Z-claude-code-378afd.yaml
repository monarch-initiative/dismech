  summary: 'Review round 1: reviewer findings'
  details: |
    Addressed 4 blocking reviewer findings + worthwhile suggestions in one push. (1) Rebound the OPG-decoy node from GO:0045453 bone resorption+LOSS_OF_FUNCTION (which read 'resorption is lost', inverted) to GO:0045779 negative regulation of bone resorption + LOSS_OF_FUNCTION, and dropped the editorializing preferred_term parenthetical. (2) Resolved the uncited SP7 claim: added an SP7 genetic entry (hgnc:17321, de novo) with two exact-quote snippets from PMID:32298837 (Whyte, Bone 2020) including 'mutation of SP7 represents a third genetic cause of JPD'. (3) Added a diagnosis section: TNFRSF11B molecular testing WITH CNV/deletion analysis (Whyte 2002 homozygous-deletion snippet grounds why sequencing alone is insufficient), skeletal radiography, bone turnover markers, and audiometric/ophthalmologic/vascular surveillance, with validated NCIT procedure terms. (4) Added an Anti-VEGF Intravitreal Therapy treatment (bevacizumab CHEBI:749495 + aflibercept CHEBI:750062) linked via target_mechanisms to the Angioid Streaks and Retinopathy node, cited to PMID:40223037. Suggestions: rebound auricular ossification HP:0000377 to HP:0005103 Calcification of the auricular cartilage; dropped rate_per_100000 (unsupported by its literature-count snippet), letting prevalence_class carry it; added a progression section (PMID:32298837); added a Vertebral Compression Fracture phenotype (Czech PMID:40775369); rebound the osteoclast-precursor cell type from CL:0000092 osteoclast to CL:0000576 monocyte. Deferred: mappings for OMIM #239000 / ORPHA:2801 (DiseaseMappings has no OMIM/ORPHA slot; only icd10cm/icd11f/mondo/ncit). All gates green; 64/64 snippets verified.

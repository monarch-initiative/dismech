  summary: 'Create: Juvenile Paget disease'
  details: |
    De novo curation of Juvenile Paget disease (JPD; MONDO:0009394, OMIM #239000), the autosomal-recessive TNFRSF11B/OPG-deficiency osteopathy. Kept distinct from adult Paget_Disease_of_Bone. Pathograph: biallelic TNFRSF11B LOF -> loss of OPG decoy inhibition of RANKL -> unopposed RANK-RANKL osteoclastogenesis -> accelerated osteoclastic resorption -> compensatory woven-bone formation -> generalized high-turnover osteopathy -> deformity/fractures/ALP; plus a cochlear OPG-deficiency arm (SNHL) and a hypothesised vascular/Bruch-membrane calcification arm (retinopathy, aneurysm). 13 phenotypes, ALP biochemical with LOINC reference range + interpretation band, 4 treatments (bisphosphonates, denosumab, recombinant OPG, calcitonin), Opg-KO mouse model, and an open-question discussion on retinopathy/skeletal uncoupling. All 53 evidence snippets exact-verified against fetched references (Whyte NEJM 2002 PMID:12124406 core). Deep-research report used only as leads.

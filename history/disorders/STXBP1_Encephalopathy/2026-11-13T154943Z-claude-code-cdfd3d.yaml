  summary: 'Review: STXBP1_Encephalopathy gene wiring, targets, models'
  details: |
    Named STXBP1 on the haploinsufficiency and SNARE-fusion nodes, with GO:0017075 syntaxin-1 binding, GO:0030674 protein-macromolecule adaptor activity and GO:0035493 SNARE complex assembly (all DECREASED), taken from the ai-gene-review core functions. Set relationship_type CAUSATIVE on the genetic record and biological_scale on the cascade nodes. Fixed two dangling causal targets (EEG Abnormality and Intellectual Disability, which named no node) and wired epileptic spasms, tonic seizures, tremor and hypotonia, raising connected phenotypes from 4/10 to 10/11; the two grandfathered rows were removed from the causal-target baseline. Added MONDO exact synonyms. Mined the tagged GeneReviews chapter (PMID:27905812) for feeding difficulties. Added the Stxbp1 heterozygous mouse (PMID:29538625) with modeled mechanisms and named the existing null model, both bound to MGI:107363. ClinGen classifies STXBP1 as Definitive only for the broader developmental and epileptic encephalopathy (MONDO:0100062), so no validity assertion was copied.

  summary: Correct experiment_design on the mouse-to-human trajectory comparison
  details: |
    exp_stxbp1_mouse_human_trajectory_comparison carried HUMAN_OBSERVATIONAL, which its own arms contradict: it phenotypes Stxbp1+/- mice and patient iPSC neurons against an isogenic-corrected control, and uses existing human natural-history data only as a comparator rather than conducting a cohort study. Set to METHOD_DEVELOPMENT, the first use of that value in the KB. What identifies it is outside the experiment: it sits under the gap_stxbp1_mouse_model_fidelity discussion (kind HUMAN_MODEL_MISMATCH), its stated aim is to quantify where the mouse under-represents human severity, and its decision criterion is whether the mouse is a faithful model. The object under test is the model system, which is what METHOD_DEVELOPMENT means; the perturbations are how the comparison is made, not what it is about.

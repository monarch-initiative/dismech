  summary: 'Address PR #5470 review: GeneReviews, prevalence, references, hypotonia'
  details: |
    Addressed the ai4c-agent review of PR #5470 for the STXBP1 flagship entry.

    - Added a top-level `references:` index of key papers: the discovery paper
      (PMID:18469812), the phenotype cohort (PMID:26865513), the SNAREopathy
      review (PMID:32559416), and the GeneReviews chapter tagged
      `tags: [GeneReviews]`.
    - GeneReviews correction: the review (and PR shepherd) cited the STXBP1
      GeneReviews chapter as PMID:35188714, but that PMID resolves to an
      unrelated chemistry paper ("Acridine-Functionalized COFs ..."). The
      correct chapter is "STXBP1 Encephalopathy with Epilepsy" (Bookshelf
      NBK396561), PubMed PMID:27905812 (Mercimek-Andrews S), which was fetched
      and cached via the reference validator.
    - Added a `prevalence:` block (prevalence_class: RARE, qualitative) with a
      notes field; no numeric birth-prevalence claim was made because no
      snippet-verifiable population figure was available.
    - Added a Hypotonia phenotype (HP:0001252) sourced from two verified
      snippets: the GeneReviews "abnormal tone" clinical-characteristics line
      (PMID:27905812) and a molecularly confirmed STXBP1 case presenting with
      hypotonia (PMID:32815282). Note: neither the Stamberger 2016 abstract nor
      the GeneReviews summary contains the literal word "hypotonia" as the
      review assumed, so the phenotype is sourced from a case report that does.

    Validation: schema, term, and reference validation all pass;
    folded-hyphens and offline enum-cache checks pass. The same top-level
    `references:` + `prevalence:` treatment was applied to the seven sibling
    SV-cycle entries. Deep-research artifacts (review item 1) were not
    generated; that is a larger discretionary effort tracked separately.

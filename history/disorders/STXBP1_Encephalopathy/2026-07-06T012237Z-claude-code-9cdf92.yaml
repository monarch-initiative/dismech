  summary: 'Create: STXBP1 Encephalopathy'
  details: |
    Created STXBP1 Encephalopathy (MONDO:0012812, DEE4). Pathophysiology conforms to synaptic_vesicle_cycle module (Munc18-1 haploinsufficiency -> impaired syntaxin-1 chaperoning/SNARE fusion -> reduced neurotransmitter release -> cortical E/I imbalance and impaired network development) plus epilepsy_excitation_inhibition_imbalance. References PMID:18469812 (Saitsu discovery/haploinsufficiency), PMID:26865513 (Stamberger 147-patient spectrum), PMID:10657302 (Verhage Munc18-1 null), PMID:32559416 (SNAREopathies DDx). Validated: schema, terms, and independent exact-substring snippet check (30/30).

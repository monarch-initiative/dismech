  summary: 'Create: Greenberg Dysplasia (HEM skeletal dysplasia, LBR)'
  details: |
    Curated as part of a sweep to complete ISDS Nosology group 23 coverage. Corresponds to nosology row NOS 23-0050. The central modelling decision was to represent LBR's two functions as separate pathophysiology nodes and to record the structural-function route to the skeletal phenotype as a refuted alternative (supports REFUTE on both evidence items, causal_link_type UNKNOWN), because the cited uncoupling experiment established that Greenberg-causing missense alleles abolish sterol C14-reductase activity without measurably disturbing nuclear structure. That is also the basis for the sterol_metabolism ICIMD assignment rather than treating the entry as a laminopathy. The other LBR phenotypes are recorded as an allelic series in differential_diagnoses rather than as subtypes. Validated with the batched validate-disorders pass (28 snippets verified). Deleted the corresponding stub.

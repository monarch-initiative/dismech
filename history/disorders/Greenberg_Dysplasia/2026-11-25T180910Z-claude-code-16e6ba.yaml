  summary: 'Gene-family review: LBR'
  details: |
    The LBR sterol C14-reductase node carried the reductase activity (GO:0050613) with modifier LOSS_OF_FUNCTION, a value the schema reserves for loss without a host mutation; the mutation-driven loss is already recorded in the node's genetic_context. Set the modifier to ABSENT, matching the node's claim that biallelic Greenberg alleles abolish the activity and the failure of patient alleles to rescue C14 reductase-deficient yeast (PMID:21327084). ClinGen rates LBR Moderate for this disease (recorded); the CAUSATIVE type is kept.

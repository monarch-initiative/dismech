  summary: 'Gene-family review: PEX19'
  details: |
    PEX19 landed on 'Biallelic PEX19 Loss of Function', which named no molecular function. The node now binds protein carrier activity (GO:0140597, DECREASED): PEX19 binds newly made peroxisomal membrane proteins in the cytosol and delivers them to the membrane as both chaperone and import receptor (PMID:14709540). The genetic record was already typed CAUSATIVE with germline origin; ClinGen's PEX19 assertion is for the parent MONDO:0019234, so no tier was copied here.

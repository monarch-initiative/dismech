  summary: 'Create: Peroxisome Biogenesis Disorder 12A (Zellweger), PEX19'
  details: |
    New standalone entry for MONDO:0013951 (OMIM 614886, PEX19, complementation group J). Decided DISEASE rather than a has_subtypes row on Peroxisome_Biogenesis_Disorder.yaml, which carries no has_subtypes block at all, following the PBD2B precedent from #11030; the case is stronger here because PEX19 is a peroxisomal membrane protein import receptor rather than a matrix-import peroxin, so its mechanism diverges from the sibling entries at the first step. Ten pathophysiology nodes, eighteen phenotypes, all wired except Polyhydramnios which is deliberately unwired with its reason in notes. Evidence from PMID:10051604 (the founding complementation-group-J report), PMID:10704444, PMID:28281558, PMID:39757991 (the 2025 Saudi PEX19 family), PMID:12457713 and GeneReviews PMID:20301621, plus the ClinGen PEX19 Definitive assertion. Early neonatal death is recorded in progression rather than as a phenotype because HPO mortality terms fall outside the PhenotypeTerm dynamic enum. The normal VLCFA profile of the 2025 proband is curated as a REFUTE evidence item on the accumulation node rather than omitted. Deep research: the first falcon run substituted PEX3 (PBD10A) for PEX19 and was discarded; a re-run with a disambiguating disease_name is recorded in the entry notes. Validated with just validate, validate-terms, count-verified-snippets 59/59, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, validate-disorders and the whole-KB snippet checks.

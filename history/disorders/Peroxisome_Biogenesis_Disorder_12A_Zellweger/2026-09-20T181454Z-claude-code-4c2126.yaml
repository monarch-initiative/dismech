  details: |
    Review round on PR #11557, answering the ai4c-reviewer CHANGES_REQUESTED review in a single push.

    Blocking item 1, GeneReviews GENETIC COUNSELING: the transmission-risk sentence (25% affected / 50% carrier / 25% unaffected non-carrier) is now an evidence item on `inheritance:`, and a new `diagnosis:` record "Carrier and prenatal testing" carries the carrier-testing and prenatal-testing sentences. Both graded INDIRECT, as every other spectrum-level GeneReviews claim in this entry is.

    Blocking item 2, two skipped GR clinical features: added `Chondrodysplasia Punctata` (HP:0005841 Calcific stippling of infantile cartilaginous skeleton) and `Feeding Difficulties` (HP:0011968). The term choice for the stippling is recorded in the phenotype's own notes with the OLS queries behind it: HPO has no term labelled "chondrodysplasia punctata", HP:0002832 is defined as soft-tissue calcification and HP:0010655 is epiphysis-restricted so it does not cover the patella, which is cartilaginous at birth. The GR snippet stops before the source's bracketed gloss because `literal_bracket_patterns` in conf/reference_validator_config.yaml strips an unmatched bracketed span from the query side only, so a quote spanning "[chondrodysplasia punctata]" cannot verify; the full source phrase is recorded in the evidence explanation.

    Blocking item 3, the three cached-but-uncited case papers. Two are now consumed and one cannot be.

    Mohamed 2010 (DOI:10.1002/ajmg.a.33560) is cited eleven times: poor sucking, the c.320delA allele, elevated C26:0 with raised C26:0/C22:0 and C24:0/C22:0 ratios on the VLCFA node and the biochemical marker, absence of peroxisomes on immunofluorescence on the membrane node, the fibroblast functional panel as a new `diagnosis:` record, the stormy PICU course on the severe progression phase, and two new phenotypes, `Renal Tubular Dysfunction` and `Cholelithiasis`. The VLCFA snippets are quoted with the source's own missing space in "increasedC26:0" rather than silently corrected.

    Adiyapatham 2023 (DOI:10.1136/bcr-2022-252014) supplies six new phenotypes from its anomalies sentence (micrognathia, corneal opacity, hypospadias, cryptorchidism, talipes equinovarus, cerebellar vermis hypoplasia) plus a distinct `Ventricular Septal Defect` record, and its exome diagnosis is cited in `genetic:`.

    Ebberink 2011 cannot supply the 4/613 = 0.65% PEX19 share the review asked for, and that figure is now deliberately absent rather than curated. The DOI form (DOI:10.1002/humu.21388) fetches to a Wiley 403 and caches with `content_type: unavailable` and an empty body; refetching by PMID recovers PMID:21031596, whose abstract was in fact already committed on main from #7299. The per-gene breakdown is in the paper's tables, not the abstract, so no committed source in this repository contains it. The paper is instead cited for what its abstract does state -- the >600-cell-line complementation survey as the reference frequency distribution, and the finding that no further complementation group exists -- on `prevalence:`, `genetic:` and the new fibroblast-diagnosis record. `prevalence_class` stays NOT_YET_DOCUMENTED. Point nine of the entry's `notes:` records this so the next curator does not re-derive it.

    Two further review points were answered by contradicting them, with sources:

    The PEX3/PEX16 "named intermediate" on the node 2 -> node 3 edge is deliberately not written in. DOI:10.1002/1873-3468.13340 (Jansen & van der Klei) states that no consensus exists on how Pex3 and Pex19 operate and names direct membrane insertion and ER-derived vesicle budding as both still live; both sentences are now evidence on that edge, quoted with `quote_role: REVIEW_SYNTHESIS`. The edge stays DIRECT with the dispute recorded rather than resolved.

    The review described Adiyapatham as a second independent source for the REFUTE VLCFA item, on the strength of "normal routine metabolic tests". That phrase is not in the cached abstract -- grep for normal/unremarkable/metabolic returns only "Inherited metabolic syndromes frequently masquerade as malformations" -- so the REFUTE item still rests on the single 2025 case and is not represented otherwise.

    Also in this round: `clinical_trials:` added with NCT01668186 and NCT06190626 (both NOT_APPLICABLE / RECRUITING, statuses read from the ClinicalTrials.gov v2 API; no `target_phenotypes` on the retinopathy study because no published PEX19 patient is reported to have retinal degeneration). A new `experimental_models:` section curates the CHO group-J mutant ZP119 and the PBDJ-01 patient fibroblast line from PMID:10051604, which was already cited -- both with `modeled_mechanisms`, `model_scale: CELLULAR` and `limitations`. `therapeutic_agent` added to Anti-Seizure Medication (NCIT:C264 Anticonvulsant Agent) and Adrenal Replacement Therapy (CHEBI:50858 corticosteroid, after NCIT:C2322 failed the ChemicalEntityTerm enum), both bound at class level with notes saying GeneReviews names no agent. The Cholic Acid description was trimmed to what its snippet carries, with the unsourced bile-acid rationale moved into notes. The `notes:` claim that there is no animal-model section was restated: the search behind it was a PubMed title search for Pex19 with mouse/mice/knockout, which is a claim about mice, and the review cataloguing invertebrate and vertebrate peroxisome-deficient models (DOI:10.3389/fphys.2013.00335) caches with an empty body so its content cannot be quoted from anything committed here.

    The case-colliding cache pair flagged as a non-blocking suggestion was a `just check-case-collisions` failure, not a nit: references_cache/DOI_10.1194_jlr.m021204.md removed with `git rm --cached`, keeping the publisher's .M021204 capitalisation.

    Three phenotypes are now deliberately unwired, each with its reason in its own notes: Polyhydramnios as before, plus Renal Tubular Dysfunction and Cholelithiasis, because Mohamed's own abstract calls the association with a peroxisome biogenesis disorder previously unrecognised and proposes no route from peroxisome loss to either.

    Validated: just validate (schema + terms + references, 102/102 snippets verified, up from 59/59), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-case-collisions, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-genereviews (TAGGED), list-disconnected-phenotypes (26/29 connected), and validate-disorders.

  summary: 'Create: Paroxysmal Extreme Pain Disorder'
  details: |
    New entry for PEPD, MONDO:0008179, formerly familial rectal pain syndrome. Identified as a gap while reviewing the Mendelian peripheral nervous system disorders: the KB held the other two SCN9A neuropathic pain syndromes - Primary_Erythermalgia and, through Congenital_Insensitivity_to_Pain, the loss-of-function arm - but not the impaired-fast-inactivation member of the allelic series.

    Pathophysiology follows the impaired-inactivation route rather than a generic gain of function: SCN9A missense variant impairing Nav1.7 fast inactivation -> persistent non-inactivating sodium current -> nociceptor AND autonomic neuron hyperexcitability -> trigger-evoked pain paroxysms plus paroxysmal sympathetic dysregulation. All four upstream nodes conform to the new nociceptor_sodium_channel_excitability module. The dual sensory/sympathetic node is what accounts for the autonomic-first neonatal presentation.

    Carbamazepine is curated with a target_mechanisms edge onto the persistent-current node, citing the experiment showing it blocks the PEPD persistent current but not the erythromelalgia activation shift, PMID:17145499 - the drug response is mechanistic evidence, not just management.

    An EMERGING mechanistic_hypotheses entry records the competing view that PEPD and inherited erythromelalgia are a biophysical continuum rather than discrete entities, from the A1632E variant producing both defects and a mixed phenotype, PMID:18945915.

    Frequency bands are taken from the 77-patient, 15-family international series, PMID:17679678: flushing OBLIGATE, harlequin colour change and tonic attacks FREQUENT. Attack-territory phenotypes carry no band because the series reports territories qualitatively without per-site counts; this is stated in notes.

    One deliberate binding compromise, recorded in a phenotype-level note: HPO has no term for a tonic NON-epileptic attack, so HP:0010818 Generalized tonic seizure is bound as the closest descriptor with an explicit note that the sources classify these attacks as non-epileptic and that misdiagnosis as epilepsy is this disorder's commonest error.


  summary: 'Review: remove unsupported Constipation phenotype and two overreaches'
  details: |
    Coherency and evidence review pass over the entry as created earlier in this branch.

    REMOVED the Constipation phenotype. Its only evidence was GeneReviews' management recommendation to use stool softeners, and the explanation reasoned from that recommendation to the phenotype. No cached source - GeneReviews, the 77-patient international series, or the founding genetic paper - states that PEPD patients are constipated. The claim was clinically plausible and entirely unsupported, which is the failure mode the evidence SOP exists to prevent. A notes stanza now records that the phenotype was considered and deliberately not curated, and why, so it is not re-added.

    Removed the VERY_FREQUENT band on Paroxysmal rectal pain. It contradicted this entry's own notes, which state that attack-territory phenotypes carry no band because the series reports territories qualitatively without per-site counts.

    Ocular pain: re-cited from PMID:18945915, an in vitro electrophysiology paper whose intro mentions the territory, to GeneReviews - a clinical source for a clinical phenotype - and deleted the uncited claim that attacks are frequently accompanied by ipsilateral conjunctival injection.

    Bradycardia: the sources report bradycardia accompanying syncope, not during the pain paroxysms. Reworded and added an explicit statement of what the sources do not report.

    Added pathophysiology-to-phenotype edges so every phenotype is reachable from the mechanism graph: the pain node to the three attack territories, the sympathetic node to the five autonomic phenotypes.

    Validation after the pass: linkml-validate clean; term validation clean; validate-disorders clean.

  details: |
    Added the missing transmission block; infectious_agent was already present. Three routes: respiratory droplet spread of toxigenic C. diphtheriae between people, contact with cutaneous lesions (the most frequent contact route by the French series' own ranking), and zoonotic acquisition of toxigenic C. ulcerans from companion and farm animals. Evidence PMID:39324172, DOI:10.4314/ajcem.v24i2.2, PMID:37957801 and PMID:39841756 - all already cited by this entry, graded as they are elsewhere in the file. Validated with just validate (147/147 snippets) and just count-verified-snippets; both clean.

  summary: 'Edit: Diphtheria - bind environmental exposures to ECTO, add West Africa
    outbreak prevalence, wire the beta-lactam node'
  details: |
    Review round addressing three items. First and blocking: both environmental exposures were left unbound on a note claiming ECTO's nearest terms cover only chemical and supplement exposures. That note was wrong. ECTO:3000000 exposure to organism exists, is already in cache/ecto/terms.csv and the exposureterm enum cache, and is already used by 19 KB entries including the Brucellosis livestock exposure, which is the same situation. The earlier search missed it because the label contains no bacterial vocabulary. Both exposures are now bound to ECTO:3000000 with the organism and route carried in preferred_term, the same general-but-accurate-ancestor pattern this entry already uses for the pseudomembrane phenotype, and both notes are corrected. just environmental-term-audit no longer lists this entry as linked-and-unbound. Second, a West and Southern Africa 2023-2024 outbreak prevalence record was added from DOI:10.1186/s12982-024-00352-1, whose cache was empty on the first fetch attempt and populated on a retry. It is recorded as CASES_IN_LITERATURE rather than a rate because the source aggregates suspected cases across five national denominators it does not give. Third, the beta-lactam target node gained a downstream edge to Iron-Regulated Diphtheria Toxin Expression, so it reaches the graph the way its macrolide sibling does; the edge description states the mechanistic difference between the two routes, since a beta-lactam reduces toxin output only by reducing the number of producers while a ribosome inhibitor suppresses synthesis in living cells. One reference_title was again written from the deep-research report's paraphrase and was caught by scripts/check_reference_titles.py before pushing; it now carries the cached title. All 142 evidence snippets re-verified as exact substrings.

  summary: Bind LOINC Corynebacterium culture, Elek toxigenicity and antitoxin codes
  details: |
    LOINC tranche B batch 26. The culture and toxigenicity testing diagnosis row takes three measurements, covering both steps it describes. Isolation: LOINC:16676-9 (Corynebacterium diphtheriae [Presence] in Specimen by Organism specific culture) and LOINC:104373-6 (Corynebacterium ulcerans [Presence] in Specimen by Organism specific culture), one per organism the entry names as an agent, because LOINC codes the members of the C. diphtheriae species complex separately and has no code for the complex itself. Toxigenicity: LOINC:24102-6 (Corynebacterium toxin [Presence] in Specimen by Immune diffusion (ID)), which is the Elek test under the method name LOINC uses for it.

    That third code was nearly missed and the near-miss is the point: a query for Elek returns 0 results, which read alone would have produced a false claim that LOINC carries no phenotypic toxigenicity code. It was found by enumerating the genus instead. Monarch KG LOINC set, query Corynebacterium, 37 results, total equalled shown so fully enumerated, retrieved 2026-10-17; no LOINC:LP Part code present.

    The serum diphtheria antitoxin titre biochemical marker takes loinc_term LOINC:34625-4 (Corynebacterium diphtheriae toxin Ab [Units/volume] in Serum): antibody to the toxin rather than to the organism, which is what an antitoxin titre measures, reported as a concentration matching the marker's IU/mL cut-offs, and method-less so it covers both the toxin neutralization test and ELISA that the marker's notes name.

    The brain natriuretic peptide and creatine kinase MB marker was left unbound: those are cardiac markers, not pathogen-specific assays, so they fall outside this tranche.

    All four codes were absent from cache/loinc/terms.csv on origin/main and were seeded by the term validator against the Monarch KG; no label was typed by hand.

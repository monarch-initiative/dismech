  summary: 'Create: Diphtheria (MONDO:0005504)'
  details: |
    De novo curation of diphtheria as a single Disease entry with anatomical has_subtypes (faucial, laryngeal, anterior nasal, nasopharyngeal, cutaneous), following the CURATE_ROOT_WITH_SUBTYPES guidance in issue 9042. Concept decision is recorded in the entry notes: all presentations share one conserved pathograph (phage-encoded tox, DtxR-derepressed expression, proHB-EGF binding, endocytosis and catalytic-domain translocation, eEF2 diphthamide ADP-ribosylation, translational arrest and apoptosis) and differ only in colonization site and toxin absorption, so myocarditis, demyelinating neuropathy and acute kidney injury are modelled as downstream pathophysiology and phenotypes rather than as subtypes. Two antibiotic target nodes conform to bacterial_protein_synthesis_inhibition and bacterial_cell_wall_synthesis_inhibition; antitoxin, toxoid vaccination and tracheotomy reach the pathograph via target_mechanisms. Deep research used the falcon (Edison) provider: 760 seconds, 37 citations, reference validation reported 11 of 11 references resolved with no confabulations. preflight-dr returned SKIP because MONDO records no causal gene for an infectious disease, so the manual synonym preflight was used instead. All 105 evidence snippets were independently re-verified as exact substrings of their cached references, and three were corrected to restore exact Unicode and spacing from the source.

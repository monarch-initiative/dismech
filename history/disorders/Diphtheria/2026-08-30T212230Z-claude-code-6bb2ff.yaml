  summary: 'Edit: Diphtheria - rebase onto main and migrate the retired PARTIAL supports
    value'
  details: |
    Two changes, both driven by the branch being rebuilt on a much newer main. First, a merge of main into this branch had dropped an enum-cache row belonging to an unrelated entry: GO:0046982 (protein heterodimerization activity, used by Acromesomelic_Dysplasia_Grebe_Type) and this entry's new GO:0047286 sort into the same slot, so the conflict resolution kept one side instead of both. Rather than hand-restore a cache row, the branch was rebuilt on current origin/main with the five content files and 36 reference caches reapplied, and the term caches re-derived with just validate-terms and just normalize-cache. The cache diff against main is now 26 additions and 0 deletions. Second, main had since retired the PARTIAL value from EvidenceItemSupportEnum (issue 7439), which split direction from directness. All 12 PARTIAL items in this entry were assessed individually rather than migrated mechanically, because the retired value was carrying several different meanings here. Eleven became SUPPORT with directness INDIRECT, where the quote asserts something the claim follows from by an inference step. One became SUPPORT with directness DIRECT: the erythromycin-resistance item on the macrolide treatment, whose quote directly reports the resistance caveat the treatment description records, and whose former PARTIAL was expressing a strength reservation that the schema explicitly states directness is not. The vaccination item's explanation now separates its directness grade from its strength caveat for the same reason. All 140 evidence snippets were re-verified as exact substrings after the migration, and the supports distribution is now uniformly SUPPORT.

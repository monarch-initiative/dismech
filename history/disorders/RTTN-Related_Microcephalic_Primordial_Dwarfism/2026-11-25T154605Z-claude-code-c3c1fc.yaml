  details: |
    De novo curation of MONDO:0018764 (RTTN, AR microcephalic primordial dwarfism / MSSP). claude_code deep research. Mechanism: biallelic hypomorphic RTTN -> impaired centriole elongation (downstream of STIL; PPP1R35 complex) -> mitotic spindle dysfunction/centrosome amplification -> neural progenitor apoptosis/depletion -> primary microcephaly; ciliary-signalling and neuronal-migration branches for PMG and lissencephaly/heterotopia. Mouse null model FAILS_TO_RECAPITULATE (embryonic-lethal laterality phenotype); iPSC organoid RECAPITULATES progenitor depletion. 28/28 snippets verified; all gates pass; no GeneReviews chapter exists.

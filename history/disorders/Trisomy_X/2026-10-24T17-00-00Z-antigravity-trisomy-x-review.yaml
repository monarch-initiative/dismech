  summary: Comprehensive review and enrichment of Trisomy X entry
  details: '- Added Harrison''s chapter classifications (`GENETICS_ENVIRONMENT_DISEASE`, `ENDOCRINOLOGY_METABOLISM`)
    with literature evidence from PMID:20459843.

    - Added `inheritance` entry for Sporadic inheritance (`HP:0003745`) arising from meiotic or postzygotic
    nondisjunction (`PMID:20459843`).

    - Enriched `pathophysiology` nodes (`Additional X Chromosome (47,XXX)`, `X-Inactivation Escape / Gene
    Dosage Imbalance`, `Neurodevelopmental Vulnerability`, `Ovarian Dysgenesis`) with `biological_scale`,
    `cell_types` (`CL:0000023` oocyte, `CL:0000540` neuron), `locations` (`UBERON:0001434` skeletal system,
    `UBERON:0000955` brain, `UBERON:0000992` ovary), `biological_processes` (`GO:0016321`, `GO:0007059`,
    `GO:0009048`, `GO:0010468`, `GO:0007399`), and connected all 14 phenotypes via `downstream` causal
    links.

    - Updated `Tall Stature` (`VERY_FREQUENT`) and `Attention Deficit Hyperactivity Disorder` (`FREQUENT`)
    frequencies to match PMID:20459843, added `Constipation` (`HP:0002019`), `Anxiety` (`HP:0000739`),
    and `Depression` (`HP:0000716`), and standardized HPO organ-system categories across all 14 `phenotypes`.

    - Enriched `diagnosis` with ontology terms (`NCIT:C16768` Karyotyping, `NCIT:C18280` Cytogenetic Analysis)
    and verbatim evidence from PMID:20459843 and PMID:24502039.

    - Enriched `treatments` with `therapeutic_modality`, `target_mechanisms`, and verbatim evidence from
    PMID:20459843.

    '

  summary: 'Create: Hallermann-Streiff Syndrome'
  details: |
    New entry for ISDS Nosology 2023 group 21 row NOS 21-0070 (OMIM 234100), the only row in the group printing neither an inheritance mode nor a gene. The entry is deliberately mechanism-light: a single pathophysiology node with mechanism_confidence HYPOTHETICAL recording that the etiology is unknown, no causal gene, and no inheritance_term, because none is established. GJA1, CHD6 and ZMPSTE24 appear in the literature as non-recurrent variants in individuals carrying the diagnosis and are named in the node description without being promoted to a causal claim. A KNOWLEDGE_GAP discussion records the more fundamental problem raised by the 2026 review (PMID:41742277): the original reports likely described heterogeneous conditions, so the diagnostic category may not be one disease, and any mechanism curated for HSS risks describing whatever mixture the label denotes. No GeneReviews chapter exists. Validation: just validate-disorders passes, 12/12 snippets verified.

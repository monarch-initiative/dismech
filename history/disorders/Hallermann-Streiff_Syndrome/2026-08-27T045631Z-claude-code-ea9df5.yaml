  summary: Add airway phenotypes, airway/anaesthetic management and a prevalence estimate
  details: |
    The deep-research report completed after the entry was written and identified disease-specific airway content the initial searches had missed. Added: obstructive sleep apnoea, micrognathia and midface hypoplasia as phenotypes; a treatments section covering non-invasive ventilation for OSA (PMID:36405833, curated PARTIAL as a single successful case, with the paper's own statement that management is poorly documented as the context), anaesthetic airway precautions (PMID:9136243), and staged craniofacial/dental reconstruction (PMID:29578805, PARTIAL as one patient followed 20 years); and a Japanese point-prevalence record of about 1 in 10 million, curated PARTIAL because the citing paper reports it secondhand. Deliberately NOT added: the report's management suggestions that it itself labels as extrapolated from other disorders rather than disease-specific. The same restraint was applied to the DONSON and SCUBE3 entries, whose reports state explicitly that no disease-specific management data exist - inventing treatment sections there would be the fabrication risk the evidence SOP warns about, so both entries remain without one. Report checks: NEC preflight SKIP (MONDO records no causal gene, as expected for this entity); manual check confirms OMIM 234100 matches and the top genes are exactly the non-recurrent GJA1/CHD6/ZMPSTE24 candidates the entry already names. Reference validation 20/20 resolved. Validation after the edit: just validate-disorders passes, 21/21 snippets verified.

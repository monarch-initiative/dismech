  summary: 'Review round 1: consume full-text 2025 cohort (PMID:41001736)'
  details: |
    Answers the CHANGES_REQUESTED review on PR 12659, which found that the cached full text of the German 2025 cohort (PMID:41001736, references_cache/PMID_41001736.md) had been used only for its abstract. (1) The coarse Abnormal Movements phenotype (HP:0100022), whose snippet did not mention movement and whose explanation wrongly said the full text was uncached, is replaced by Dystonia (HP:0001332) and Ataxia (HP:0001251), both FREQUENT, quoting the 7/13 dystonia and 7/14 ataxia sentence. (2) The ketogenic-diet knowledge gap is reworded from untried to uncontrolled and confounded: it cites F7 (seizures controlled only after serine and pyridoxine despite prior multiple ASMs and a ketogenic diet) and F1 (KD given concurrently with serine, pyridoxine and ASMs); the Bolsterli 'None of them was treated with KD' item is kept and scoped to the four founding patients. Medium-chain triglycerides and triheptanoin are mentioned as rationale-only options. (3) The serine/pyridoxine treatment is updated from two uncontrolled patients to the cohort figures (7/13 supplemented, 6/7 partial or complete seizure control, F10 ASM withdrawal), with the ASM-only seizure control in 7 patients and the F3 no-clear-benefit pyridoxine trial as qualifying/REFUTE items. (4) New cohort-quoted phenotypes: Developmental Regression, Absent Speech, Inability to Walk, Muscle Weakness, Skeletal Muscle Atrophy, Ventriculomegaly, Autistic Behavior, Irritability, Sleep Disturbance, Bowel Incontinence, Urinary Incontinence, Short Stature, Thin Upper Lip Vermilion; every HP CURIE and label was looked up before binding. Joint contractures and scoliosis (optional) were not added. (5) Frequencies re-based on the cohort: Feeding Difficulties and Axial Hypotonia to FREQUENT, Failure to Thrive given FREQUENT, cohort figures quoted for spasticity, microcephaly and intellectual disability; Cerebellar Vermis Hypoplasia frequency removed and the cohort's 'relatively preserved' cerebellum sentence added as REFUTE; Cerebral White Matter Abnormality given a frequency from the 7/11 T2 signal change, with the description separating signal change from the founding patients' absent myelin paucity. Suggestions taken: the dried-blood-spot normal-or-increased serine sentence added as REFUTE under Hyposerinemia; seizure types and median onset of 5 months added to Infantile-Onset Seizures; directness INDIRECT on the pancreatic-cancer knockdown item under Malate-Aspartate Shuttle Failure. Not added: the cohort's pyridoxine adverse-effect sentence.

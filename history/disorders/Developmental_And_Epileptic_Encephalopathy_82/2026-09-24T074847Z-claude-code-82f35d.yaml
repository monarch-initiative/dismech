  summary: 'Create: Developmental_And_Epileptic_Encephalopathy_82'
  details: |
    New entry for DEE82 / GOT2 deficiency (MONDO:0032880), claim issue monarch-initiative/dismech#12616. Deep-research input: a Perplexity sonar-deep-research report run through a session-local streaming workaround for #9357; its citations were mostly bare URLs, so it was used as a lead only. Its reference validation resolved 3/3 identifiers; its term validation listed 4 mislabelled CURIEs (HP:0002439, HP:0011641, GO:0050136, CL:0010012), none of which were bound. just preflight-dr printed PASS (GOT2 mentioned 207 times) and on the first run then crashed on a malformed local mondo.db (sqlite3.DatabaseError: database disk image is malformed) while another session was rebuilding it; a later re-run completed with PASS. Phenotype connectivity is partial (11 of 23 phenotypes causally connected): features whose mechanism the sources do not state (dysmorphism, recurrent infections, feeding difficulties, hyperhomocysteinaemia, tone changes, abnormal movements) were deliberately left unwired. Evidence comes from six PubMed records found by the report and by E-utilities searches: van Karnebeek 2019 (PMID:31422819, founding report), German 2025 (PMID:41001736, 15-patient cohort), a compound heterozygous case (PMID:37977948), the Broeks 2021 malate-aspartate shuttle review (PMID:33990986, full text), Bolsterli 2022 (PMID:36079864, full text, which re-tabulates the four founding patients), and Kerk 2022 (PMID:35815941, GOT2 knockdown in pancreatic cancer cells, cited as indirect in vitro support for NADH accumulation). Pathograph: variant -> GOT2 transaminase deficiency -> shuttle failure -> cytosolic NAD+/NADH imbalance -> serine synthesis defect and lactate, with a separate aspartate branch -> secondary urea cycle defect -> hyperammonaemia and citrulline, reaching the phenotypes and an epilepsy-module conformance node. The founding abstract calls the cytosolic redox state 'highly oxidized', which is the opposite of the direction the review and the shuttle's mechanism give; this is recorded in the redox node's notes. White matter involvement is carried with a REFUTE item because the four founding patients lacked myelin paucity while the 2025 cohort reports it as common. Curated as a standalone Disease rather than as has_subtypes of a generic genetic DEE entry (#12212 lists it as a candidate) because the mechanism is a metabolic shuttle defect with a treatable secondary serine deficiency, while that entry's subtypes are ion-channel and synaptic. check-genereviews --online: NO_CHAPTER. Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys, the offline snippet and term gates, and validate-disorders.

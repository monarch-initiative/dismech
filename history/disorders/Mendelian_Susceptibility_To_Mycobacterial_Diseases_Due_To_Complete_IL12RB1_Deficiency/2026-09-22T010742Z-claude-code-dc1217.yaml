  summary: 'Review: attach the IFN-gamma measurement as a readout (IUIS Table 6)'
  details: |
    Identical treatment to the IL12B sibling entry: decreased circulating interferon-gamma is curated as a reports_on readout of the impaired IFN-gamma production node rather than as a causal edge, because it is that node being measured.

    The two entries are deliberately handled the same way. They describe the same pathway broken at adjacent points - cytokine versus receptor - and an assay finding common to both should not be modelled two different ways.

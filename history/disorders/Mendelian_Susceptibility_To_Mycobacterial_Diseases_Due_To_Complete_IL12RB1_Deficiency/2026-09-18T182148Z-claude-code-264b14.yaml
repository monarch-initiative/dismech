  summary: 'Create: MSMD due to complete IL12RB1 deficiency'
  details: |
    De novo curation of MSMD due to complete IL12RB1 deficiency (MONDO:0013955) from an openscientist deep-research report plus independent PubMed work.

    Deep research: just research-disorder openscientist; report committed at research/Mendelian_Susceptibility_To_Mycobacterial_Diseases_Due_To_Complete_IL12RB1_Deficiency-deep-research-openscientist.md. Frontmatter: reference_validation 26/26 verified, 9/9 quotes valid, confabulation_rate 0.0.

    The report's term validation caught a genuine wrong binding, which is worth recording because it is the case the check exists for. It offers HP:0032256 as 'Tuberculosis'; HPO calls HP:0032256 'Unusual Histoplasma capsulatum infection'. Not a near miss - a different organism and a different disease. The entry uses HP:5210111 'Tuberculosis infection', resolved independently against OLS before the report landed. Two of the other three flagged labels are the table-column parsing artifact seen in the CLIPPERS and COXPD28 reports (MONDO:0013955 'reported as' MONDO).

    The entry was written first from the primary literature (de Jong and Altare 1998, Fieschi 2003, de Beaucoudrey 2010), then augmented from the report. Four additions were substantive: the complementation experiment from PMID:11424023, which establishes causality rather than association; the two siblings in that same paper who share one homozygous allele and diverged completely (disseminated BCG in one, resistance to three live-BCG inoculations and abdominal tuberculosis at eighteen in the other), which is the strongest available evidence that penetrance here is not genotype-determined; an environmental block for BCG vaccination as the obligate second hit; HSCT as the only treatment directed at the lesion; and the Il12rb1-null mouse (PMID:35891311), which was built to attack the incomplete-penetrance question and returns an awkward answer - both innate and PPD-specific IFN-gamma responses correlated positively with bacterial burden, and the authors conclude IFN-gamma alone might not contain BCGitis. That is folded into the IFN-gamma knowledge gap with the correlation-versus-causation caveat stated, not smoothed.

    Four snippets in the first draft were written from memory of what an Altare abstract would say and were caught by the reference validator as not present in the source. PMID:9603732 turned out to be about granuloma formation, not what I assumed; reading it properly produced a better fact than the invented one - mature granulomas still form on residual IL-12-independent IFN-gamma and are nonetheless not protective, which dissociates macrophage activation from granuloma assembly and separates this disease from IFN-gamma receptor deficiency. Recorded because the failure mode matters: the fabricated snippets read as fluently as the real ones.

    The environmental exposure_term is deliberately left unbound. ECTO has no vaccination exposure class in the build the term validator resolves against (runoak on sqlite:obo:ecto returns no label for ECTO:2000129; the ECTO term cache has no vaccination, BCG or Mycobacterium exposure class), though OLS does return the term, so the local build lags. The search and its outcome are recorded verbatim in review_notes rather than as an unexplained gap, and no over-broad binding was substituted.

    Validation: just validate passes with 44/44 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-environmental-evidence all pass. GeneReviews: NO_CHAPTER, confirmed independently against PubMed with two genereviews[book] title queries, both returning zero records.

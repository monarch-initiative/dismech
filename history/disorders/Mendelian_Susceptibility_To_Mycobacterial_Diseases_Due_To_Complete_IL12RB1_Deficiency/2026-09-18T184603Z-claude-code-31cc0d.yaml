  details: |
    Single bundled round for the ai4c-reviewer CHANGES_REQUESTED review on PR #12165.

    The blocking finding was correct and worth more than the one-line fix it looked like. The entry is scoped to COMPLETE IL12RB1 deficiency, and what makes a case complete rather than partial is absent IL-12Rbeta1 surface expression - which existed only as a trailing clause inside another diagnosis entry's description, with no structured entry and no evidence behind it. The criterion defining the entry's own scope was neither queryable nor cited.

    Now a structured diagnosis entry with three evidence items from PMID:12591909, already cited and already cached. The third is the one that makes the entry better rather than merely compliant: patient 10.II.2, carrying a large in-frame deletion, expressed the beta1 chain on both cell types while remaining functionally deficient. That is why surface staining and the functional IL-12 response assay are complementary rather than redundant, and why the defining cohort accepted one, the other, or both. The description says so.

    Suggestion taken: the FREQUENT bands on disseminated BCG disease and non-typhoidal salmonellosis were supported by recurrence counts, which speak to how often disease returns rather than how often it occurs. Both now lead with a prevalence figure - isolated BCG disease in 43 index patients from PMID:21057261, and disseminated non-typhoid salmonellosis in 21 of 34 patients from PMID:12591909 - with the recurrence snippets retained beneath, because rare mycobacterial recurrence against more frequent salmonellosis recurrence is itself a characteristic of this disease rather than a restatement.

    One error of mine in this round, caught by the validator before commit: I attributed the salmonellosis prevalence sentence to PMID:21057261 when it is from PMID:12591909. Both are cited in the entry and both are cohort papers on the same disease, which is exactly the situation where a misattribution is easy to make and hard to see. The reference validator caught it because the snippet is not a substring of the wrong paper's cache; nothing else would have.

    Suggestions not taken: the neopterin negative-biomarker caveat and the antifungal/surgical supportive care additions. Both are real but neither is in a cached reference this PR commits, and I would rather not fetch new literature into a review round whose other findings were all closeable from what is already here. Noted in the PR reply as deferred rather than declined.

    Validation after the round: just validate passes with 49/49 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values pass; pytest test_disorder_file passes for this entry.

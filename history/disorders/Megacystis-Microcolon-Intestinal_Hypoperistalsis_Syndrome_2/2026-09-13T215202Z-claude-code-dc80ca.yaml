  summary: 'Create: Megacystis-Microcolon-Intestinal_Hypoperistalsis_Syndrome_2 (MONDO:0025708)'
  details: |
    De novo curation of MMIHS2, the MYH11 form of megacystis-microcolon-intestinal hypoperistalsis syndrome. Deep research: one openscientist report, committed alongside. Report reference validation resolved 22/22 citations with confabulation_rate 0.0 and 1/1 quotes valid; term validation returned needs_review: true with 9 label mismatches, all table-parsing artefacts. GeneReviews baseline: PMID:31070878 (MMIHS Overview) fetched and tagged. just preflight-dr returns WARN for two reasons, both checked. First, ACTG2 is mentioned 14 times; that is correct rather than a second disease entity, since ACTG2 is the dominant MMIHS gene and the report covers the syndrome's genetic heterogeneity. Second, the report cites OMIM 155310 and 160745 where MONDO:0025708 xrefs 619351; 155310 is the syndrome-level Berdon entry and 160745 is the MYH11 gene, so the report is pitched at MMIHS generally rather than at MMIHS2 specifically. That drift is real and the entry handles it explicitly: a scope note names which statements are syndrome-level rather than MYH11-specific, and the cohort frequencies, the 762 reported cases and the management data are each flagged as such in their own notes. No OMIM identifier is recorded in the entry. The report also supplied the histopathology section, which is a negative finding with diagnostic weight: MYH11-variant visceral myopathy shows no diagnostic change on light microscopy, electron microscopy or MYH11 immunohistochemistry, so a normal biopsy does not exclude the diagnosis and molecular genetics is the route. That preserved MYH11 immunoreactivity also sits awkwardly beside the Western blot showing reduced protein in a different patient, and both are recorded rather than reconciled. Two mechanistic_hypotheses blocks: whether the mechanism of MYH11 disruption rather than the gene determines vascular versus visceral disease, and whether residual function sets age of onset along a continuum. Validation: schema, term and reference checks pass with 43/43 snippets verified; all five offline gates pass.

  summary: 'Review round 1: address all six blocking findings plus three suggestions
    on PR #11798'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11798 in a single push.

    Finding 1, wrong ontology term. Rebound the prune belly phenotype from HP:0003270 Abdominal distention to HP:0010318 Aplasia/Hypoplasia of the abdominal wall musculature, matching the convention in Prune_Belly_Syndrome.yaml. The old binding named a co-occurring finding rather than the muscle deficiency the description claims.

    Finding 2, female predominance. Added an epidemiology section with a Female predominance record carrying minimum_value 70.6 and maximum_value 84.2, evidenced from four sources including the Japanese national survey (16 of 19), which is not subject to the publication bias the literature reviews are. Added a discussions entry, kind OPEN_QUESTION, laying out the three candidate explanations (ascertainment against posterior urethral valves in males, sex-specific modification of a pathway dominated by ACTG2 rather than MYH11, and differential survival) and recording that nothing in the curated sources distinguishes them.

    Finding 3, no animal models. Added the Myh11+/- mouse from PMID:41797110 with two modeled_mechanisms links, three typed divergences and a post-void residual readout. The genotype divergence is stated prominently rather than smoothed: the mouse is heterozygous where the human disease is biallelic recessive, so the phenotype arises at the human carrier dose.

    Finding 4, contradicted hypothesis. Widened myh11_allelic_mechanism_dichotomy from a two-mechanism to a three-mechanism hypothesis and retitled it, since the dichotomy framing does not survive PMID:31944481. Added that paper twice: a REFUTE item on the dominant-equals-vascular reading, and a SUPPORT item for its own statement of the two mechanisms it adds a third to.

    Finding 5, treatments. Split Parenteral Nutrition and Ostomy into Total Parenteral Nutrition and Decompressive Enterostomy. Added Gastrostomy (NCIT:C52006), Cutaneous Vesicostomy (NCIT:C15218 Cystostomy), Clean Intermittent Catheterisation, and Isolated Intestinal Transplantation (NCIT:C157985), the last also carrying the combined living-related liver and bowel case from PMID:18280270. Every new treatment carries a target_mechanisms link.

    Clean intermittent catheterisation is bound broadly to NCIT:C49236 Therapeutic Procedure with a review_notes explaining why: NCIT:C38045 Catheterization exists and is not reachable from NCIT:C25218, so it fails the TreatmentActionTerm dynamic enum, and every alternative NCIT offers under a searchable name is a device rather than a clinical action.

    Finding 6, Hirschsprung exclusion. Added a histopathology entry, Ganglion cells present excluding Hirschsprung disease, from PMID:23943250, which defines the variants-of-Hirschsprung category by the presence of ganglion cells and names MMIHS inside it. The description separates this negative from the existing one: a normal muscularis propria does not exclude MMIHS, whereas present ganglion cells do exclude the main alternative.

    Suggestions: survival figures now carried as an epidemiology record spanning 19.7 to 88 per cent with the denominators and the reason the range moves over time, so the 88 per cent outlier is no longer presented alone. Hydronephrosis and renal dysplasia split into two phenotypes with their own bindings. gnomAD constraint NOT added, with the reason in notes: gnomAD is not a fetchable reference prefix here, so the figures could only be entered as uncited prose.

    Schema note: ModelDivergenceTypeEnum has no INCOMPLETE_PHENOTYPE value, which is the exact description of the mouse reproducing the bladder half and not the bowel half. Recorded as BOUNDARY_OMISSION with the limitation stated in the description, and commented on the existing issue #11743 rather than opening a new one.

    Validation: schema, term and reference validation all pass; snippets verified 73/73 (was 43/43). Cache diff is three additive NCIT label rows and two enum rows for terms this entry introduced. All nine offline gates run.

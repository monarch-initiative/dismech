  details: |
    Second review round on PR #11798. Two blocking findings, both treatment-term bindings, plus all six non-blocking suggestions taken.

    Blocking 1, wrong enterostomy binding. Decompressive Enterostomy was bound to NCIT:C15257 Ileostomy while its own evidence reports jejunal stomas in eleven patients and colonic in five, with no ileostomy count. Rebound to NCIT:C52005 Enterostomy, which is the exact concept and validates inside the TreatmentActionTerm enum. The reviewer's guess that the branch was reachable was right.

    Blocking 2, preferred_term echoing a broader label. Multivisceral Transplantation carried preferred_term 'organ transplantation' against NCIT:C15289 Organ Transplantation, which discards exactly the specificity the binding loses. Changed to 'multivisceral transplantation'. The binding itself is correct; NCIT has no multivisceral term.

    Suggestion, missing SCALE_EXTRAPOLATION divergence. Added on the mouse link to Bladder Failure with Megacystis, where model_scale TISSUE sits below the node's biological_scale ORGANISM. The audit listed this as one of three links KB-wide that are typed but missing the scale divergence; model-scale-audit --strict no longer lists this entry.

    Suggestion, missing SPECIES_MISMATCH divergence. Added as a second, independent gap alongside the allele-dose one, naming the prenatal presentation the mouse study does not assess.

    Suggestion, hypothesis id still said dichotomy. Renamed myh11_allelic_mechanism_dichotomy to myh11_lesion_type_determines_affected_bed. Confirmed by grep that nothing in kb/, src/ or scripts/ references the old id, so there is no foreign-key risk.

    Suggestion, one paper graded both ways on one hypothesis. The PMID:31944481 item graded REFUTE was refuting the two-mechanism label that the previous round retired. Regraded to SUPPORT, with the explanation stating that it was REFUTE in the prior round and why the grading followed the label rather than flipping silently.

    Suggestion, maximum_value 88.0 with no in-block evidence. Added the PMID:41387873 sentence that carries both the figure and its denominator (23 of 26 patients) to the epidemiology record, so it is self-contained. Also rewrote the pathophysiology node prose that asserted survival is 'substantially better than the syndrome's historical reputation suggests' on the strength of that outlier; it now points at the 19.7 to 88 per cent range and the denominators, which removes the conflict with the epidemiology record.

    Suggestion, unbound ganglion-cell finding_term with no recorded reason. Added notes explaining that the finding is the presence of a normal cell population and the ontologies for this slot describe abnormalities, so binding an aganglionosis or abnormal-morphology term would assert the opposite of what is meant. HP, NCIT and CL searched.

    One self-caught error worth recording: the first draft of that note cited CL:0000117 as the enteric neuron, written from memory. The correct term is CL:0007011, confirmed by lookup before the note was committed. That is the eighth identifier written from recall in this run and the eighth to be wrong.

    Validation: schema, term and reference validation all pass; snippets verified 74/74 (was 73/73). All nine offline gates plus model-scale-audit --strict run. Cache diff is two additive rows for NCIT:C52005.

  details: |
    LOINC tranche H batch 2. The entry's existing Immunosuppressive agents treatment row already states that pharmacogenetic testing for TPMT and NUDT15 variants is recommended before azathioprine dosing, but had no structured diagnosis row or LOINC binding. Added a new top-level diagnosis section with one row, Pre-Azathioprine TPMT/NUDT15 Pharmacogenetic Testing, bound to LOINC:93193-1 (TPMT gene and NUDT15 gene targeted mutation analysis), the joint panel code -- correct here, unlike in Thiopurine_S-methyltransferase_Deficiency, because this entry's own TPMT/NUDT15 claim is explicitly joint and does not scope NUDT15 out as a separate disease. Searched both 'NUDT15' (gene symbol, which found the code) and 'nudix hydrolase 15' (spelled-out gene name, which found nothing) before concluding the gene-symbol search was the productive direction for this analyte. Evidence cites PMID:40709433, already in this file's treatment evidence, for its sentence naming NUDT15/TPMT testing as a real pre-azathioprine consideration in CCS management (in that patient it was not performed, which is still evidence that the test is a recognized consideration). Code verified by a fresh Monarch KG entity lookup and seeded into cache/loinc/terms.csv.

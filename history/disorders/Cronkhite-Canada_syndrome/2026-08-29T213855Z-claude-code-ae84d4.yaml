  details: |
    # Evidence review: Cronkhite-Canada_syndrome.yaml

    ## Stats
    - Evidence items checked: 39 (pathophysiology, phenotypes, biochemical, treatments, differential_diagnoses)
    - References read: 9 (PMID:33163187, PMID:39470508, PMID:38297356, PMID:40709433, PMID:32459145, PMID:36781513, PMID:34002159, PMID:32669505, PMID:37674882)
    - Verified clean without edits: 35; edited: 4 (2 snippet replacements, 2 explanation corrections). Post-edit mechanical check: 39/39 verified; `just validate` passes.

    ## Findings
    1. Location: pathophysiology "Epithelial barrier dysfunction and protein-losing enteropathy" (evidence item 1); reference PMID:33163187. Problem: snippet "The prognosis of CCS is poor, with a 5-year mortality rate of 55%" is a prognosis statistic that says nothing about barrier dysfunction or protein loss — snippet attached to a claim it does not support; the explanation asserted PLE complications the quote never mentions. Severity: DEFECT. ACTION: fixed — replaced with the exact same-reference quote "Intestinal mucosal changes in CCS patients lead to malabsorption, hypocalcemia, and vitamin D deficiency" and a matching explanation.
    2. Location: phenotype "Protein-losing enteropathy" (evidence item 1); reference PMID:33163187. Problem: same misattached 5-year-mortality snippet used for the PLE phenotype claim. Severity: DEFECT. ACTION: fixed — replaced with the exact same-reference quote "Severe and refractory protein-losing enteropathy induced by CCS could be treated by surgery", which documents PLE as a CCS manifestation, plus matching explanation.
    3. Location: pathophysiology "Helicobacter pylori infection and dysbiosis" (evidence item 2); reference PMID:39470508. Problem: the quote ("Pathological analysis indicates that the extent and severity of lesions in the middle and lower gastrointestinal tract are more substantial than in the upper tract.") contains nothing about H. pylori; the abstract never mentions Hp, and worse-distal-than-proximal severity if anything cuts against the Hp-gradient argument the companion review makes (Wu 2020 notes severity increasing toward the gastric antrum as the pro-Hp observation). No Hp-relevant quote exists in this cached reference to substitute. Severity: DEFECT. ACTION: reported only — fix policy forbids removing evidence or adding references; recommend deleting this evidence item (the node keeps its solid PMID:33163187 Hp quote: "54% of patients with CCS had Hp infection...").
    4. Location: pathophysiology "Autoimmune and IgG4-mediated inflammation" (evidence item 2); reference PMID:39470508. Problem: quote reports eosinophil/mast-cell infiltration and "a positive IgG result" — inflammation yes, but not IgG4 or autoimmunity; support for the node's IgG4/autoimmune framing is partial. Explanation is honest about what the quote says. Severity: MINOR. ACTION: reported only — SUPPORT vs PARTIAL is judgment-call territory, not plainly wrong; node is independently anchored by the PMID:33163187 IgG4 quote.
    5. Location: pathophysiology "Hamartomatous polyp formation" (evidence item 2); reference PMID:39470508. Problem: explanation called the source a "Comprehensive case series"; it is a single case report with literature review. Severity: MINOR. ACTION: fixed — explanation now says "Case report and literature review".
    6. Location: treatment "Immunosuppressive agents" (evidence item 2); reference PMID:32459145. Problem: explanation claimed tacrolimus "confirmed... as effective therapeutic options" while the quote says agents "have been shown to exhibit partial effects" — explanation overstated the quote. Severity: MINOR. ACTION: fixed — explanation now mirrors "partial effects".
    7. Location: treatment "Supportive care" (evidence item 1); reference PMID:33163187. Problem: snippet "Symptomatic treatment and nutritional-support therapy" is a bare list-item fragment, non-propositional; it establishes the treatment was reported but states no finding. Severity: NOTE. ACTION: reported only — exact substring, claim is uncontroversial, and the second (39470508) item carries substantive support.
    8. Location: treatment "Corticosteroids" (evidence item 4); reference PMID:36781513. Problem: explanation calls a 17-patient Mayo series a "Large cohort study". Severity: NOTE. ACTION: reported only (cosmetic; quote and grading correct).
    9. Location: biochemical "Serum iron"; reference PMID:32459145. Problem: single-case evidence, and the quoted lab value "anemia (serum iron, 74 g/L)" carries the source paper's own implausible unit (g/L); the quote is verbatim-correct and must not be "corrected". Severity: NOTE. ACTION: reported only.
    10. File-wide: no evidence item declares `evidence_source` (all default to HUMAN_CLINICAL). Acceptable per repo convention for these case reports/series, but the review articles (PMID:33163187, and review-derived sentences in 32459145) would be more precisely tagged; also phenotype `frequency:` values (VERY_FREQUENT/FREQUENT) carry no frequency-specific quantitative evidence. Severity: NOTE. ACTION: reported only — bulk re-tagging is outside the conservative fix scope.

    ## Sections reviewed
    pathophysiology, phenotypes, biochemical, treatments, differential_diagnoses

    ## Verdict
    Mostly sound curation with exact quotes and correct claim attachment, but it contained the review's two clearest defects: the same prognosis statistic pasted onto two protein-losing-enteropathy claims it did not support (both now fixed with better same-source quotes), and one PMID:39470508 quote propping up the H. pylori node despite that paper saying nothing about H. pylori (reported; recommend removal). Explanations showed a mild systematic tendency to inflate source strength ("comprehensive case series", "large cohort", "effective" for "partial effects"), two instances of which were corrected.

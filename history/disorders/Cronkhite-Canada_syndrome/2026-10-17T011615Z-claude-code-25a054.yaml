  summary: 'Review fix: correct a claim-evidence mismatch on the TPMT/NUDT15 testing
    row'
  details: |
    Corrected a claim-evidence mismatch caught in review on PR #14618. The Pre-Azathioprine TPMT/NUDT15 Pharmacogenetic Testing row claimed testing is done before starting azathioprine, cited to PMID:40709433 with the snippet 'The patient tolerated azathioprine without any adverse events; therefore, NUDT15/TPMT testing was not deemed necessary.' That snippet is an exact quote and verifies, but it states the reverse of the claim: testing being skipped after the drug was tolerated, not performed beforehand. Replaced the citation with PMID:41618934 (the CPIC thiopurine dosing guideline, already cited elsewhere in the companion Thiopurine_S-methyltransferase_Deficiency entry with evidence_source HUMAN_CLINICAL), quoting its statement that starting doses of azathioprine are adjusted based on TPMT and NUDT15 genotypes -- which requires the genotype to be known before the starting dose is set, directly supporting the pre-treatment-testing claim. Also removed a sentence from the row's description that explained a curation choice by referencing a different entry ('since CCS reports do not scope NUDT15 out the way a TPMT-deficiency-specific entry does') -- that reasoning belongs here, in the history record, not in disease-facing description prose. The reasoning itself still holds: the joint TPMT+NUDT15 panel code is correct for this row because CCS's own claim is explicitly joint, unlike Thiopurine_S-methyltransferase_Deficiency, which scopes NUDT15 out as a separate disease and so binds the TPMT-only panel instead.

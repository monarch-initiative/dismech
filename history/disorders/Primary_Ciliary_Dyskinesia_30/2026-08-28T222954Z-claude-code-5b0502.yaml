  details: |
    Third review response on PR #9924.

    Blocking item, and it was my own false claim about the repository rather than a curation gap. The notes paragraph added last round said MIM 616037 was recorded in prose because DiseaseMappings has no OMIM slot. The first half is true; the conclusion was not, and I had asserted it without checking. external_assertions is the established home for an OMIM disease record and 168 disorder files already use it. Verified against the schema (ExternalAssertion requires only source and external_id, and accepts evidence) and against the exemplar the reviewer named, 15q11q13_Microduplication_Syndrome.

    Fixed by adding an external_assertions block carrying OMIM:616037 with assertion_type disease_record, and the quotable sentence tying that number to ODAD3 disease specifically as evidence. The notes paragraph is trimmed to what remains true: mappings is not the place for it, external_assertions is, and the deep-research report's use of the umbrella 244400 is the error worth flagging.

    This was blocking for the right reason. The paragraph was a statement about the repository, and a curator reading it would have concluded there is nowhere to put an OMIM identifier and repeated the workaround. It is the same defect class as the animal-model and neuropathology overreaches corrected on the sibling FAR1 branch: an assertion about something outside the entry, made without checking the thing.

    Non-blocking suggestions taken.
    The nasal nitric oxide biochemical block gains presence: Decreased, matching the umbrella entry's wording for the same marker.
    The 77 nl/min cut-off is now structural, as a one-sided reference_range with lower_bound 77 and no upper_bound, plus two interpretation_bands - below the cut-off flagged LOW with the interpretation that it supports referral for ultrastructural and genetic testing without diagnosing PCD or naming a gene, and at-or-above flagged NORMAL with the caveat that it does not exclude PCD since some genotypes such as RSPH1 retain higher values. The notes on that range record why upper_bound and loinc_term are deliberately unset: it is a diagnostic threshold rather than a laboratory interval, and nasal nitric oxide has no LOINC code in this repository's caches.
    genetic_context.description still said the alleles are "all truncating", the residue of the sentence corrected two lines above in the previous round. It now gives the three-nonsense, three-frameshift, one-splice-donor breakdown, and the genetic notes heading changed from "all truncating" to "all loss-of-function" for the same reason.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 55/55 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. Render test passes. No cache diff.

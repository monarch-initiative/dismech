  summary: 'Create: Primary Ciliary Dyskinesia 30 (ODAD3/CCDC151)'
  details: |
    De novo curation of primary ciliary dyskinesia 30 / CILD30 (MONDO:0014465, ODAD3 / CCDC151, hgnc:28303) as a standalone kb/disorders Disease entry.

    entry_type decision: DISEASE, taken against the alternative of a has_subtypes entry on kb/disorders/Primary_Ciliary_Dyskinesia.yaml. That umbrella entry has no has_subtypes section and curates ODAD1 (CCDC114), the paralogous member of the same docking complex, as a causal gene in its genetic: block, so a standalone ODAD3 entry does create an asymmetry. The asymmetry is recorded in the entry's notes with the reasoning: the Subtype class has slots for name, display_name, subtype_term, mappings, description, evidence, review_notes, locations, geography, classification, children, genes, subtype_frequency and inheritance, and no pathophysiology, phenotypes or animal_models, so a subtype entry could not have carried the docking-complex causal chain, the three model organisms, or the two discussions. Primary_Ciliary_Dyskinesia_47_and_Lissencephaly is the existing precedent for a numbered PCD form as a standalone entry. The right later fix is to promote ODAD1, not to demote ODAD3.

    Sources: PMID:25192045 (Hjeij 2014, defining series, five individuals from three families), PMID:25224326 (independent homozygous Arabic case), PMID:33719352 (Chinese case report, full text), PMID:32490514 (Han-Chinese Kartagener family, full text), PMID:30504913 (Chinese case with situs inversus), PMID:31383820 (Ccdc151 knockout mouse, hydrocephalus), PMID:38920681 (Odad3 conditional knockout mouse, spermatogenesis, full text), PMID:24067530 (zebrafish/Drosophila discovery work), PMID:27486780 (TTC25/ODAD4, differential).

    PMID:32286033 was fetched and then dropped: its cache entry is content_type unavailable, so nothing from it could be cited, and the cache file is not committed.

    Pathograph: biallelic ODAD3 loss -> docking complex assembly failure (ODAD1 and ODAD2 and DNAH5 all absent from the axoneme) -> absent outer dynein arms -> motile ciliary beat failure, which conforms to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction -> mucociliary clearance failure and randomised laterality.

    Three animal models with modeled_mechanisms links. The Ccdc151 constitutive null is graded RECAPITULATES for laterality and PARTIALLY_RECAPITULATES for beat failure, because perinatal lethality prevents any study of airway disease. The Odad3 adult conditional deletion carries the MMAF flagellar readout and the heterozygote fertility finding. The zebrafish morphant carries the docking-complex assembly step.

    Discussions. HUMAN_MODEL_MISMATCH on mouse hydrocephalus: a first draft asserted flatly that human ODAD3 disease does not cause hydrocephalus, which overstated the case, because PMID:32490514 lists hydrocephalus among the recognised consequences of ciliary dysfunction in PCD. The discussion was rewritten as a mismatch of frequency and severity rather than of kind, and now carries that citation as PARTIAL evidence. OPEN_QUESTION on the Odad3 heterozygote fertility effect, which has a direct counselling implication and no human evidence either way. KNOWLEDGE_GAP on the absence of any ODAD3-specific natural history or treatment study, which is why the entry has no treatments and no progression block.

    Deep research: falcon. NEC preflight WARN with ODAD3 mentioned 63 times against DNAH5 at 4; the sole warning is that the report cites the umbrella PCD OMIM 244400 rather than 616037 for CILD30. Report and citations sidecar committed under research/.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 41/41 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. check-folded-hyphens caught two real defects, both fixed.

  summary: 'Fourth review response: read the ORPHA phenotype table, add neonatal distress
    and male fertility phenotypes'
  details: |
    Fourth review response on PR #9924. A review at 22:53Z superseded the 22:43Z approval on the same commit. Both blocking findings were verified against the cache before acting and both held up; all five ORPHA rows the reviewer quoted are exact substrings of references_cache/ORPHA_244.md, which is tracked and already cited twice by this entry.

    Root cause, which the reviewer named correctly: the ORPHA:244 cache was cited in prevalence but its 46-row frequency-annotated phenotype table was never read.

    Finding 1. Neonatal respiratory distress was excluded on a notes claim that it was not quotable and that the only route was journal access to the 2014 paper. The premise was true - that paper's cached record is abstract_only and carries nothing - but the conclusion was wrong, and the note would have sent the next curator to a paywall for something already in the repository. Curated as HP:0002643 with frequency FREQUENT from the Orphanet row, onset_category NEONATAL, and a description separating the class-level band that carries it from the uncited four-of-five lead in the deep-research report.

    Finding 2. Male infertility was absent while female infertility was curated, and Orphanet grades male Frequent against female Occasional - so the entry carried the rarer of the pair and omitted the commoner. The reviewer's argument that this applied a stricter standard than the entry uses elsewhere is correct: recurrent otitis media and nasal polyposis are curated from narrative summaries, and ventricular septal defect and hearing impairment from a single varied-phenotypes sentence. Added Male Infertility (HP:0003251) and, separately, Abnormal Sperm Motility (HP:0012206), each carrying the Orphanet band plus gene-specific mouse evidence already cited in this entry. They are kept as two phenotypes because the models separate them: adult Odad3 deletion gives abnormal motility short of azoospermia, while the constitutive null has no sperm in the tract at all.

    The notes paragraph now records the mistake rather than deleting it, and names it as the second instance of one pattern - a section excluded on a confident claim about what the repository could supply, premise checked and conclusion not. The first was the OMIM identifier excluded from mappings on the correct observation that DiseaseMappings has no OMIM slot and the incorrect inference that nothing else took one.

    Suggestions taken. Eight already-curated phenotypes gained their Orphanet frequency band and a corroborating row: bronchiectasis, productive cough, chronic sinusitis, recurrent otitis media, nasal polyposis, situs inversus totalis, female infertility, and hearing impairment - the last confirming independently the OCCASIONAL band previously reasoned from a narrative hedge. The hydrocephalus HUMAN_MODEL_MISMATCH discussion now carries the Orphanet Very rare (<4-1%) row, which makes its frequency-not-kind argument numeric rather than impressionistic. Recurrent Otitis Media recategorised from Respiratory to Otological to match Hearing Impairment.

    Not changed: the stale GO:0005515 enum-cache row, which the reviewer assessed as derived, additive and a true enum-membership fact.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 69/69 snippets verified, up from 55/55; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. Render test passes. No cache diff.

  summary: 'Second review response: nasal NO, corrected allelic spectrum, split the
    bundled airway node'
  details: |
    Second review response on PR #9924. The entry had been approved at 21:30; a second, deeper review at 21:55 requested changes on three new findings, all of which were correct.

    Finding 1: nasal nitric oxide was missing, and an ODAD3-patient-specific value sits in a cache this PR already commits - 6 nl/min against a PCD cut-off of 77. The reviewer's point was that omitting it while keeping weaker class-level material cuts against the standard this entry sets for itself, which is right. Added as a biochemical marker matching the umbrella entry's shape, and as a first diagnosis entry ahead of the ultrastructural one, since nNO is the first-line screen. Both record that it is one patient and that a low value triages rather than diagnoses.

    Finding 2: the trigger node claimed "every reported disease allele is truncating: nonsense or frameshift" and enumerated four. PMID:33719352, committed in this PR, reports seven likely loss-of-function ODAD3 alleles including two further frameshifts and one canonical splice-donor variant, c.244+1G>A, which is neither nonsense nor frameshift. The claim now says loss-of-function, gives the three-three-one breakdown, cites the seven-allele sentence, and explains why the splice allele still does not give a graded phenotype to calibrate a missense variant against - donor-site loss generally lands back in the same functional class. The genetic notes' transcription caution is extended: the same review renders the two Hjeij alleles as p.(Gly309*) and p.(Ser409*) against p.(Glu309*) and p.(Ser419*) used here, so there are now two independent discrepancy classes recorded, nucleotide and protein, neither resolvable from an abstract-only primary record.

    Finding 3: "Mucociliary Clearance Failure and Suppurative Airway Disease" bundled a four-step chain under an "A and B" name while the other five nodes were atomic. Split into three chained nodes - Mucociliary Clearance Failure (TISSUE, effector), Chronic Airway Infection and Neutrophilic Inflammation (TISSUE, amplifier, typed that way because each infection-inflammation cycle degrades clearance further), and Bronchiectasis and Airway Wall Destruction (ORGANISM, outcome). The KNOWLEDGE_GAP attaches_to reference was repointed to the terminal node, and the evidence was redistributed so each node carries what actually supports it rather than the composite's pooled set. The pathograph remains one connected component.

    Non-blocking suggestions all taken. A non-genetic clinical differential was added - cystic fibrosis, primary immunodeficiency and aspiration pneumonia, quotable from the Kartagener case - with the note that laterality is what redirects the workup and that its absence excludes nothing. The OMIM identifier MIM 616037 for CILD30 is recorded in notes rather than in mappings, because DiseaseMappings has no OMIM slot, with an explicit statement that the deep-research report's use of the umbrella 244400 is the error. Neonatal respiratory distress is recorded in notes as searched-and-not-quotable, with the reason (abstract-only primary record, full_text_attempted true) so the next curator does not repeat the search.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 53/53 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. Render test passes. No cache diff.

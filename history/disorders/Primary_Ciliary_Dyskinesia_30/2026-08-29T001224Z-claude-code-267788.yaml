  summary: 'Fifth review response: apply the Orphanet band rule symmetrically'
  details: |
    Fifth review response on PR #9924, addressing the 00:02:49Z CHANGES_REQUESTED review.

    Context worth recording: two review runs examined commit 54f2ab04 concurrently. The 00:02:49Z run found a new defect; the 00:07:56Z run approved, and its own text shows it was evaluating the commit against the 22:53:51Z review rather than against the 00:02 finding, which it never saw. The approval is therefore not an informed reversal of the 00:02 finding. The finding was verified independently before acting on it and it holds, so the fix ships even though it dismisses a standing approval.

    The defect: two frequency values were set to an Orphanet class band that the entry's own text says is too low. Bronchiectasis carried OCCASIONAL while the explanation on the very evidence item supplying it said the band "sits lower than the individually described ODAD3 patients would suggest" - and both described ODAD3 patients have bronchiectasis. Situs Inversus carried OCCASIONAL while the entry's description says roughly half of PCD patients have normal situs, which puts laterality defects in the FREQUENT band.

    Verified against the umbrella entry rather than taking the review's word: kb/disorders/Primary_Ciliary_Dyskinesia.yaml quotes these two identical Orphanet rows and handles both the other way - frequency FREQUENT with the ORPHA row graded supports PARTIAL and an explanation that the band understates. So the child entry was contradicting the parent on the same source row while holding the stronger gene-specific evidence.

    Both are now FREQUENT with their ORPHA rows graded PARTIAL and the disagreement stated, matching the umbrella.

    The deeper point in the review was the asymmetry, and it is the part worth fixing structurally: the class band had been allowed to raise male infertility to FREQUENT on no human ODAD3 data at all, while also lowering bronchiectasis below what every described ODAD3 patient shows. That is one rule applied in one direction only. The notes block now states the rule explicitly - an ORPHA row supplies frequency and is graded SUPPORT where the entry has no gene-specific evidence bearing on it; where gene-specific evidence contradicts the band, the gene-specific reading sets frequency and the row is graded PARTIAL with the disagreement stated - and works through all three cases so the next curator applies it symmetrically.

    Non-blocking suggestions taken. Recurrent Respiratory Infections was the only phenotype with no frequency and now carries FREQUENT from HP:0005425 recurrent sinopulmonary infections, graded PARTIAL with the term mismatch stated explicitly, since that row is narrower than the HP:0002205 term bound here. Hearing Impairment gains the HP:0000405 conductive row as corroboration of both its band and the conductive mechanism its description gives, without changing the decision to bind the general term. Situs Inversus recategorised from Developmental to Cardiovascular so the two laterality manifestations sit together.

    Validation: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 71/71 snippets verified, up from 69/69; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. Render test passes. No cache diff.

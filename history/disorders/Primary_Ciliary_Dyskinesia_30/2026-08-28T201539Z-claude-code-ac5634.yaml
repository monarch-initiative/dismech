  summary: 'Review response: infertility evidence, four phenotypes, unquotable laterality
    figure removed'
  details: |
    Review response on PR #9924, plus items from the automated research comment on issue #9902.

    Blocking review items fixed.
    1. The Female Infertility evidence quoted "Female infertility in PCD related to ODAD3 variants has not been reported", which evidences novelty rather than the phenotype. Replaced with the directly supporting sentence from the same cache: "The 35 year-old female patient exhibited chronic sinusitis, diffuse bronchiectasis, dextrocardia and infertility." The novelty statement is described in the explanation instead of being quoted.
    2. Four research-surfaced phenotypes added, all with verbatim sentences from caches this PR already commits: HP:0002205 recurrent respiratory infections (two independent patients), HP:0031245 productive cough, HP:0001629 ventricular septal defect and HP:0000365 hearing impairment. The last two come from a gene-specific phenotype summary rather than an individually described patient, and are graded OTHER with that stated.

    A prose defect the review caught indirectly, and the most important fix here.
    3. The entry twice asserted that four of five individuals in the defining series had a laterality defect. That figure is not in the abstract-only cached record; it comes from the deep-research report's reading of the full text. Both statements were rewritten: the description no longer gives a fraction, and the pathophysiology node records the figure explicitly as an uncited lead. The description's claim of neonatal respiratory distress went the same way and was removed, since it had the same provenance.

    Non-blocking suggestions taken.
    4. GO:0005515 protein binding dropped from the docking-complex node; the co-immunoprecipitation evidence still carries the interaction claim and the node keeps its GO:0070286 axonemal dynein complex assembly term.
    5. evidence_source on "we found Ccdc151 expressed in vertebrate left-right organizers" corrected from HUMAN_CLINICAL to MODEL_ORGANISM, which was the inconsistency flagged.
    6. The defining series' own alleles, c.925G>T p.(Glu309*) in two Arabic-origin pedigrees and c.1256C>A p.(Ser419*) in a UK-Pakistani family, added to the genetic notes as uncited leads, together with the deep-research report's warning that some secondary summaries render the second as C>T where the primary text gives C>A.
    7. GeneReviews PMID:20301301 added to references with the GeneReviews tag and a note explaining why it is not cited as evidence, matching the treatment given in MC1DN2 and MC1DN6.

    Addition beyond the review.
    8. ORPHA:244 added as a prevalence evidence row carrying Orphanet's birth-prevalence class for PCD as a whole. Orphanet holds one epidemiological record for the entire disease and lists 53 causal genes in it, ODAD3 among them, which is directly relevant to the lump/split argument.
    9. The notes now address the scaling question raised on issue #9902: there are 49 PCD stubs in the queue, all UNDECIDED, so this file's shape is likely to be copied dozens of times. Recorded both counter-arguments honestly - Orphanet does not split PCD by gene, and the umbrella entry's own genotype_ultrastructure_severity hypothesis already reasons along an ultrastructural-defect axis that would give all 49 a home - and stated that the class-level policy call belongs to a maintainer with the whole queue in view, along with the fact that this entry's content transfers cleanly if the ruling goes the other way.

    Branch rebased onto origin/main.

    Validation after the changes: just validate exit 0; just validate-terms exit 0; just validate-disorders exit 0 with 47/47 snippets verified; check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all exit 0. Cache diff is empty after the edits.

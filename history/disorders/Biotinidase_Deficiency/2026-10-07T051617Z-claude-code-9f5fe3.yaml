  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing Newborn screening for biotinidase deficiency diagnosis row with a MeasurementDescriptor bound to LOINC:75217-0 Biotinidase [Enzymatic activity/volume] in DBS (label read from the Monarch KG). No reference range was recorded on that code: the cut-offs the cited programmes state are not in the code's enzymatic-activity-per-volume property. Sweden set 25 percent, later 20 percent, of the same-day sample mean (PMID:20224900) and a Turkish referral study derived 59.5 and 50.5 MRU kit-relative cut-offs (PMID:37119528); both are quoted as evidence on the row and the two PubMed queries that found no absolute-unit DBS cut-off are recorded verbatim in the row notes. The existing Biotinidase enzyme activity biochemical marker describes the confirmatory serum assay, so it received the serum code LOINC:1982-8 Biotinidase [Enzymatic activity/volume] in Serum or Plasma rather than the DBS code. Cache rows seeded and normalized. Validated with just validate, validate-terms, count-verified-snippets (155/155), check-duplicate-keys, check-entity-refs, the LOINC schema pytest, a scratchpad render, and the batched validate-disorders sweep.

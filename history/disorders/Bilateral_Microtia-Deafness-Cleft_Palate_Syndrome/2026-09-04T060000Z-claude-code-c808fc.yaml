  summary: 'Create: bilateral microtia-deafness-cleft palate syndrome (MONDO:0012854,
    HOXA2)'
  details: |
    New curation of the HOXA2-related microtia spectrum. MONDO:0012854 is labelled for the recessive microtia-hearing impairment-cleft palate presentation but its synonyms also carry the dominant 'microtia with or without hearing impairment' form; both are HOXA2 allelic disorders acting through the same second-pharyngeal-arch mechanism, so they are curated as one entry with two has_subtypes (AR-MHIC, p.Q186K homeodomain missense, with partial cleft palate; AD-Microtia, nonsense haploinsufficiency, no cleft) rather than as separate diseases. Mechanism curated as: HOXA2 loss of function -> impaired transactivation of the long-range HMX1 enhancer and loss of second-arch neural crest identity -> homeotic transformation of second-arch skeletal derivatives (duplicated middle-ear ossification centres) and failed auricular morphogenesis -> bilateral microtia, hearing impairment, cleft palate. Three nodes conform to kb/modules/pharyngeal_arch_patterning_serial_homology.yaml; HOXA2 is a new trigger class for that module (arch-identity selector lesion, not ribosome biogenesis and not EDN1-DLX dorsoventral code). Three mouse models are linked through modeled_mechanisms with readouts, including the stage-conditional 2013 study whose late-inactivation arm is the closest model of the human auricle. A HUMAN_MODEL_MISMATCH discussion records that the mouse null is perinatally lethal with a full homeotic transformation while every human patient is viable, and separates the candidate explanations (allele dose, timing, species) rather than assuming one; a second KNOWLEDGE_GAP records that the sensorineural component of the recessive family's mixed hearing loss is unexplained by the arch mechanism, and that no cited paper characterises the inner ear in HOXA2 loss of function. The p.Q186K DNA-binding consequence is graded COMPUTATIONAL with directness INDIRECT because it is a homology-modelling prediction, not a functional assay. No phenotype carries a frequency band: five published families is a case-series denominator. Validated with just validate (57/57 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms (offline and --resolve), and validate-disorders.

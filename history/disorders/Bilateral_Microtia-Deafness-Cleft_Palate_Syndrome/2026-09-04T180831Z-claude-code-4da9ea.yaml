  summary: 'Review round 1 fixes: prevalence band, two ontology rebindings, deep-research
    pass, pathograph joins'
  details: |
    Addressed the CHANGES_REQUESTED review of 2026-09-04T06:58Z on PR #10909. All four blocking items fixed and all three suggestions taken, in one push.

    BLOCKING 1 (fixed). prevalence_class on the all-causes microtia birth-prevalence record was BAND_1_9_PER_100000 while the recorded interval is 10.0-12.5 per 100,000, so the whole interval sat above the band ceiling. Changed to BAND_1_5_PER_10000, which the schema defines as 1-9 per 10,000 equals 10-99 per 100,000. Rate numbers and notes unchanged; the arithmetic was already correct.

    BLOCKING 2 (fixed). Ran a falcon deep-research pass and committed research/Bilateral_Microtia-Deafness-Cleft_Palate_Syndrome-deep-research-falcon.md with its citations sidecar, artifact, and the eleven DOI reference caches the run fetched. 30 citations, 11 of 11 references verified at 0.0 confabulation, 2 on topic, 1 flagged off topic, 29 of 29 terms resolved. just preflight-dr against MONDO:0012854 returns PASS with HOXA2 mentioned 54 times. The report's outcome is recorded in the entry-level notes:

     - One real gap found. Meddaugh and Zambrano 2020 (PMID:31567444) is a sixth published HOXA2 family, a four-generation pedigree with microtia and variable hearing impairment, which the manual sweep missed. It cannot be curated as evidence: both the PubMed record and the DOI record are abstract-free, so the caches are title-only and there is no quotable sentence. Recorded in notes rather than added to references: as a tagged-but-not-mined citation, following the same reasoning the sibling hearing-loss entries use for the GeneReviews overview. The report attributes a truncating allele around Glu229 to that family; that is unverified and is explicitly not asserted anywhere in the entry. Softened the two family-count statements (the Bilateral Microtia phenotype notes and the CASES_IN_LITERATURE prevalence notes) so they read as counts of citable families rather than of the literature, without moving the ULTRA_RARE band.
     - One lead checked and not taken. Wilderman et al. 2024 describe a roughly 600-kb noncoding global control region between NPVF and NFE2L3 driving anterior HOXA expression, whose mouse deletion produces orofacial clefts resembling the Hoxa2 null. That is upstream regulatory architecture for the cluster, not a HOXA2 lesion in any reported patient with this disease; the report says so itself. Recorded as a candidate for a future regulatory-variant node.
     - One independent confirmation. The report's management citations are all general microtia and aural-atresia literature - international consensus recommendations, integrated atresia management, a national treatment guideline - and none is HOXA2-specific. That corroborates the treatments section's existing statement that no HOXA2-specific outcome data exists, which had rested on the curator's own search.

    BLOCKING 3 (fixed). Rebound the Loss of Second Pharyngeal Arch Neural Crest Identity cell type from CL:0000333 migratory neural crest cell to CL:0000008 migratory cranial neural crest cell, which matches the node's own preferred_term. Verified through OAK and it passes validate-terms and dynamic-enum membership; both CURIEs were already cached so no cache CSV changed.

    BLOCKING 4 (fixed). Rebound the Auricular Reconstruction treatment term from the generic NCIT:C15329 Surgical Procedure to NCIT:C25351 Reconstructive Surgery. Confirmed through OAK that NCIT:C25351 has NCIT:C25218 Clinical Intervention or Procedure among its ancestors, so it is a valid TreatmentTerm.

    SUGGESTION (taken). Added target_mechanisms to the two therapeutic treatments, using bare pathograph names rather than entity-reference syntax. Auricular Reconstruction targets the Bilateral Microtia phenotype and Hearing Amplification targets the Hearing Impairment phenotype, both with treatment_effect: BYPASSES, because neither corrects the developmental lesion. Verified with dismech.graph.build_causal_graph that both edges resolve and orphan_targets is empty. Neither link carries evidence, and each treatment's notes now says why: no published series reports outcomes in HOXA2-mutant patients, so a quote would have to come from the general microtia literature and would attribute to this disease something no source says about it.

    SUGGESTION (taken). Replaced the ambiguous attaches_to: animal_models#Mouse on the HUMAN_MODEL_MISMATCH discussion, which resolved against species and so pointed at all three mouse models indistinguishably, with the two specific model names the mismatch concerns: Hoxa2 null mouse (Rijli 1993) and Hoxa-2 null mouse (Gendron-Maguire 1993). Both resolve under check-entity-refs.

    SUGGESTION (taken, in a different form than proposed). Bilaterality is now carried on the Bilateral Microtia phenotype_term's preferred_term, which reads Bilateral microtia against the HP:0008551 Microtia binding. A laterality qualifier was considered and rejected: HP has no non-obsolete bilateral-microtia term (HP:0040111 is obsolete), no dismech entry uses a laterality predicate-value qualifier so there is no precedent to follow, and CLAUDE.md records that qualifier terms are invisible to validate-terms and have previously hidden 32 wrong bindings. Carrying the specificity in preferred_term is the pattern the Ontology Term Contract endorses.

    Validation. just validate, validate-terms, count-verified-snippets (57/57), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass on the file. Whole-KB check-folded-hyphens, check-title-snippets, check-snippet-length and check-snippet-grading report no new divergences. check-source-defect-claims reports nothing for this entry. qc-deep-research on the new report shows 11 cited references not consumed into the entry, which is an advisory census and well inside the normal range. No cache/**.csv changed.

  summary: Review HOXA2 microtia using full clinical texts and bounded care/model
    evidence
  details: |
    Reviewed the complete entry, its four CREATE/EDIT histories, and the scientific body and citations of the matching Falcon report. No prior REVIEW event or overlapping open PR was present at selection. Named-entity preflight matches HOXA2, MONDO:0012854 and the original disease concept; GeneReviews/StatPearls index checks identify no disease chapter.

    Read the complete scientific text, methods, results, discussion and figure captions of Alasti 2008 (PMID:18394579; recovered full text through a generated PMC URL cache) and Brown 2013 (PMID:23775976). The former documents grade II microtia, severe bilateral canal stenosis, malformed/fixed ossicles, left inner-ear agenesis in one relative and right facial paresis in another; nerve hypoplasia was only suspected. Four relatives were affected, but only three underwent the detailed examination/imaging, so no family-derived frequency band is asserted. Brown's full text documents mild-to-severe mixed hearing loss in dominant disease, including one illustrated conductive-only ear, thickened helices, normal canals, and direct operative ossicular findings. Corrected the prior claims that dominant audiology and human inner-ear anatomy were unavailable.

    Read all nine original cited PubMed abstracts and the new Ohnemus dosage-study abstract (PMID:11578867). Attempts to fetch publisher/DOI full text for the older mouse studies and the 2020 Chinese assay paper did not yield usable complete text; model claims are limited to the available source. The complete Piceci-associated university thesis was generated into the cache; read its HOXA2 section on pages 68–71, not the unrelated OAVS/MYT1/CNV case material. It supplies normal hearing in examined p.Glu224* relatives, auricular details and genotype data for the same journal pedigree, not an additional family. Read the relevant Hoxa2/lineage discussion and figures in the Cox 2014 review, including its criticism of treating the entire pinna, tragus and root as one second-arch compartment.

    Separated directly observed human ossicular dysplasia from the complete-null mouse homeotic phenotype. Qualified the mouse identity, palate and dose inferences, removed unsupported normal migration/survival and measured residual-activity claims, and changed the palate link from known to unresolved intermediates. Added the p.Lys213* variant, a bounded HMX1 reporter model, tongue-free palate explants and a mouse transcriptional-dose model. Impaired reporter activation is not equated with abolition, and inferred haploinsufficiency is not treated as measured patient nonsense-mediated decay or protein reduction. Preserved the two allelic subtypes and existing module conformance.

    Read the full scientific text, tables and figure captions of the 2022 integrated microtia/atresia management paper (DOI:10.3389/fsurg.2022.944223). Read the relevant feeding, speech and palatal-surgery sections of the 2024 ACPA Parameters of Care. Added explicitly extrapolated hearing, reconstruction, cleft, feeding and speech guidance without claiming HOXA2-specific outcomes or copying historical device-approval ages. Observation remains an option for microtia, and hearing rehabilitation accounts for mixed loss and cochlear reserve. Added imaging and variant-interpretation evidence and the FGF3 differential. ClinicalTrials.gov API query for HOXA2 on 2026-10-01 returned zero studies; this does not exclude general microtia studies.

    Removed the nonspecific all-cause microtia prevalence row, stale world-family counts, and the curation diary from disease notes. The research report's Alasti DOI and nucleotide spelling were not copied; protein notation avoids silently normalizing inconsistent historical coordinates. Meddaugh 2020 (PMID:31567444) remains an unresolved full-text lead with no usable finding in the retrieved cache; no genotype or phenotype claim was inferred from its title. A mistakenly retrieved WDR45 DOI and unrelated HOXA2-RCHY1 mechanistic paper are excluded from the PR. Reference markdown was generated only through just fetch-reference. All 132 evidence snippets and 147 titles validate, with no skips or unavailable snippets; final graph, evidence-hygiene, ontology and commit checks accompany the PR.

    Completeness assessment: phenotypes, two allelic subtypes, molecular/developmental mechanisms, care/trials, variant interpretation, diagnostic anatomy and primary reference consumption are adequate within the stated access limits. Unresolved sensorineural biology and human-mouse model differences remain explicit discussions rather than false absence-of-data claims.

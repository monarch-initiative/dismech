  summary: Remove fabricated cleft-palate mechanism; curate the two published mouse
    accounts
  details: |
    Review of PR #10909 found a fabricated mechanism in an ungated prose field: the Cleft Palate Repair treatment's target_mechanisms description asserted that the cleft was caused by 'ectopic second-arch cartilage obstructing elevation of the palatal shelves'. No cited reference says this. All nine references cited in the entry were grepped for palate, cartilage, shelf, shelves, tongue, hyoglossus and hyoid: the only near neighbour is PMID:7903600's duplicated Meckel's cartilage beside the otic capsule, a middle-ear finding that says nothing about the palate, and PMID:7903600's statement that the mouse null is born with cleft palate, which is the fact and not the mechanism. The falcon deep-research report does not contain the claim either; its own wording is the hedged 'abnormal palate development provides a route to cleft palate'.

    The clause was removed and replaced with the two mouse accounts that are actually published, each curated as a pathophysiology node with quoted evidence.

    1. Barrow and Capecchi 1999 (PMID:10529419, fetched via just fetch-reference): mis-attachment of the extrinsic tongue and hyoid muscles, with the abnormal trajectory of the styloglossus and stylohyoideus blocking the hyoglossus attachment to the greater horn of the hyoid, correlating exactly with cleft palate; and the authors' suggestion that the resulting tongue posture blocks palatal shelf closure. Curated as two nodes so that the observation and the interpretation carry separate evidence, with the Hoxa1/Hoxa2 double-mutant rescue as the support for the link. Added the double-mutant mouse as an animal model with two RESCUES links.

    2. Smith et al. 2009 (PMID:19653318, found by PubMed search for HOXA2 AND palatogenesis): Hoxa2 expression in the palate itself, reduced fusion of Hoxa2-null shelves cultured without a tongue, and the authors' explicit conclusion that the cleft is not solely due to the tongue musculature. Curated as the Intrinsic Palatal Shelf Fusion Defect node hanging off HOXA2 Loss of Function.

    A CONTROVERSY discussion, hoxa2_cleft_palate_tongue_versus_intrinsic_palate, records that the two accounts are both mouse, are compatible, have not been weighed against each other, and have not been examined in a HOXA2-mutant patient. The entry now asserts neither as the mechanism of the human cleft.

    The downstream edge from Homeotic Transformation of Second-Arch Skeletal Derivatives to Cleft Palate was removed: no source links the skeletal transformation to the cleft. Its evidence, that the mouse null is born with cleft palate, is a genotype-level co-occurrence and was moved to the Cleft Palate phenotype, where the description already made that statement.

    Smaller prose corrections found in the same sweep: the treatment notes said 'seven cited references' and there are now nine; a model readout interpretation turned 'penetrance dramatically reduced' into 'most double mutants', which the abstract does not support; the HMX1 enhancer node stated Hoxa2-Hmx1 enhancer binding without the 'in mouse' qualifier the source carries; CL:0000008 carried a preferred_term broader than the ontology label; and the notes now record that the falcon report argued against lumping the dominant families and why that was not followed.

    Validation: just validate (schema, terms, references - 77/77 snippets verified), validate-terms, count-verified-snippets, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, validate-disorders. Pathograph wiring was checked by hand: no dangling bare-name targets, no node without an incoming edge except the root, and every phenotype is a target.

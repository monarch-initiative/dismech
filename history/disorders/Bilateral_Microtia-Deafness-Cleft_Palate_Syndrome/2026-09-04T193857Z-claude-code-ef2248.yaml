  details: |
    Addressed the CHANGES_REQUESTED review of 2026-09-04 on PR #10909.

    BLOCKING (IMPORTANT) — cleft palate repair missing from treatments. Added a Cleft Palate Repair treatment bound to NCIT:C168380 (Palatorrhaphy), the term already used for cleft repair in Kniest_Dysplasia, Treacher_Collins_Syndrome, Apert_Syndrome and Cardiofacioneurodevelopmental_Syndrome, and confirmed present in the treatmentactionterm enum cache. therapeutic_modality SURGERY; target_mechanisms link to the Cleft Palate phenotype with treatment_effect BYPASSES, matching the auricular-reconstruction pattern already in the entry (the operation closes the cleft after the fact and does not touch the prenatal arch-identity lesion). Deliberately evidence-free with the reason stated in notes: none of the seven cited references carries any management content (grepped), and quoting the general cleft-palate literature would attribute to this disease something no source says about it.

    The review asked for the treatment to be subtype-scoped to AR-MHIC. The Treatment class has no subtype slot and no treatment in any KB entry carries one, so the restriction is recorded in the treatment notes instead. Flagged to the reviewer.

    SUGGESTION — Mixed Hearing Impairment was an orphan pathograph node. Wired with a downstream edge from Homeotic Transformation of Second-Arch Skeletal Derivatives, in parallel with the existing edge to Hearing Impairment, causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES. Evidence reuses the PMID:23775976 middle-ear-development sentence already used on the sibling edge, graded identically. The edge description states explicitly that only the conductive half follows from this node and that the sensorineural half remains unexplained, which is what the hoxa2_sensorineural_component_unexplained discussion covers.

    SUGGESTIONS — extended the entry-level 'not curated for want of a citable source' list with the unilateral cochlear absence in one of the four affected members of the Iranian family (falcon report sources it to Alasti's 2009 thesis, no PMID and no DOI, so it cannot be cached or quoted) and the Marx type II microtia grade.

    NOT CHANGED: BMP4/BMP5/TWSG1 remain unmodeled, as the review itself allowed.

    Validation on the changed file: just validate pass; validate-terms pass; count-verified-snippets 58/58 (no DOI references, nothing skipped by prefix); check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all OK; validate-disorders pass. Whole-KB check-title-snippets, check-snippet-length and check-snippet-grading all clean with no new baseline rows. Orphan sweep over every downstream/sequelae/target_mechanisms/modeled_mechanisms target: zero dangling targets, zero phenotypes without an incoming causal edge.

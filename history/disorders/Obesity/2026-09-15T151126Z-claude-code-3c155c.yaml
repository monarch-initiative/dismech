  summary: Add microbial weight-maintenance axis and pasteurized A. muciniphila MucT
    treatment
  details: |
    Curated from the Nature Medicine randomized controlled trial of pasteurized Akkermansia muciniphila MucT for weight-loss maintenance (PMID:42120725, NCT05417360), supplied as a PDF. Added four pathophysiology nodes connecting a gut-microbial axis into the existing pathograph: Depletion of Mucosal Symbiont Akkermansia muciniphila -> Intestinal Barrier Dysfunction and Metabolic Endotoxemia -> Chronic Low-Grade Inflammation (existing node); Efficient Intestinal Energy Harvest -> Energy Imbalance (existing node); and Post-Weight-Loss Weight Regain -> Increased Body Mass Index (existing phenotype), which is the step maintenance therapy targets rather than weight loss itself. Added the treatment Pasteurized Akkermansia muciniphila MucT Supplementation with three target_mechanisms links, a clinical_trials record for NCT05417360, and a KNOWLEDGE_GAP discussion on baseline-abundance-dependent response. The NCIT agent term for the product (NCIT:C200541) is carried as a treatment_term qualifier because it is not reachable from NCIT:C1909 and so cannot sit in therapeutic_agent. Supporting references fetched and committed: PMID:23671105, PMID:27892954, PMID:31263284, PMID:32167023, PMID:30655624, PMID:39558077, PMID:39879980. Validated with just validate (56/56 snippets verified), check-duplicate-keys, check-enum-values, check-entity-refs, check-causal-targets, check-qualifier-terms and check-qualifier-terms-online.

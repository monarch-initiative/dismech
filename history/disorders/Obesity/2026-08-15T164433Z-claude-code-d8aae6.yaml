  summary: Cite evidence for previously evidence-free environmental exposures
  details: |
    Issue 8296 item 2, tranche 3. Sources located by PubMed search, cached with `just fetch-reference`, every snippet verified as an exact quote from the cached abstract. This tranche used a hardened helper that pulls `reference_title` from the cache frontmatter rather than typing it, and asserts each snippet is non-empty, over 20 characters, at least 5 words, bracket-free and present in the cache -- the guards that the #8541 review showed were missing. Cited all four previously evidence-free `environmental:` exposures (High-Calorie Diet, Sedentary Lifestyle, Obesogenic Environment, Psychological Stress). High-Calorie Diet uses the NIH inpatient randomized crossover trial in which diets were matched for calories, energy density, macronutrients, sugar, sodium and fibre, so the excess intake and weight gain are attributable to ultra-processing itself. The important correction is Sedentary Lifestyle: its note asserted reduced energy expenditure, but the prospective-cohort meta-analysis found small, inconsistent and non-significant associations between sedentary behaviour and body weight, with a significant odds ratio only for becoming overweight or obese in the highest versus lowest category. The note now states that qualified picture instead, graded PARTIAL. This is less settled than it is usually assumed to be.

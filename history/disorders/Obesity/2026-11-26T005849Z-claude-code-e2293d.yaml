  summary: 'Gene-family review: LEP, LEPR, POMC, MC4R'
  details: |
    Grounded the four leptin-melanocortin genes on the hypothalamic dysregulation node, which carried only feeding behavior: LEP hormone activity, LEPR leptin receptor activity, POMC-derived type 4 melanocortin receptor binding and MC4R melanocyte-stimulating hormone receptor activity, all decreased, matching the bindings in Obesity_Due_to_MC4R_Pathway_Disruption. Added autosomal recessive inheritance blocks to the LEP, LEPR and POMC records. Relationship types reviewed and kept: the biallelic monogenic causes CAUSATIVE, heterozygous MC4R RISK_FACTOR.

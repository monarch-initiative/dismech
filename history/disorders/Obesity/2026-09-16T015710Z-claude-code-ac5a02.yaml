  summary: Wire existing obesity treatments into the pathograph; bind drug agents;
    add naltrexone-bupropion
  details: |
    Follow-up to the same-day A. muciniphila commit, closing gaps that pass became visible. Bound CHEBI agents on the drug treatments that had none (semaglutide CHEBI:167574 and liraglutide CHEBI:71193 on GLP-1 Receptor Agonists; tirzepatide CHEBI:194186 on GLP-1/GIP Dual Agonists), so the entry is queryable by drug rather than naming them only in prose. Set therapeutic_modality on the five treatments that lacked it (PEPTIDE on both incretin entries, SMALL_MOLECULE on Orlistat, BEHAVIORAL on Lifestyle Modification). Added 11 target_mechanisms links across six treatments; before this pass only the A. muciniphila entry linked into the causal graph at all. Nine links carry their own evidence; three are description-only where the link is definitional or where the cited trials measure weight rather than the mechanism, and each says so. New references fetched and committed: PMID:28266779 (semaglutide mechanism-of-action crossover), PMID:35441470 (STEP 1 withdrawal extension), PMID:38078870 (SURMOUNT-4 randomized withdrawal), PMID:16371744 (entero-hypothalamic gut hormones after bariatric surgery), PMID:39783852 (orlistat fecal fat pharmacodynamics), PMID:38285378 (CBT/BT network meta-analysis), PMID:20673995 (COR-I). Added the treatment Naltrexone-Bupropion, which the guidance statement already quoted twice in this entry strongly recommends but which was not curated; setmelanotide, the fourth drug in that sentence, is left in Obesity_Due_to_MC4R_Pathway_Disruption where its indication sits. Gave Behavioral Therapy its first evidence item and recorded in notes why it carries no target_mechanisms: it is bound to a counseling action term, which the schema excludes from mechanism links. Two structural results worth noting: Post-Weight-Loss Weight Regain, added in the previous commit, is now the shared target of four treatments, three of them through randomized withdrawal or maintenance designs; and Efficient Intestinal Energy Harvest is targeted by orlistat and by pasteurized A. muciniphila through unrelated routes. Validated with just validate (67/67 snippets verified), check-duplicate-keys, check-enum-values, check-entity-refs, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading.

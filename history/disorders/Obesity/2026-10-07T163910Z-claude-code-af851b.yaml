  details: |
    Added a body mass index diagnosis row with LOINC:39156-5 and the adult WHO classification: healthy weight 18.5 to 24.9, pre-obese 25.0 to 29.9, obesity grades I, II and III, quoted from Table 1 of the 2015 European Guidelines for Obesity Management in Adults PMID:26641646, with the WHO 2000 consultation PMID:11234459 as row evidence. The WHO expert consultation on Asian populations PMID:14726171 retained the WHO categories and proposed public health action points instead of separate Asian categories, so no Asian range is recorded and the action points are in notes.

  summary: 'Gene-family review: add KSR2'
  details: |
    Added KSR2, previously absent from the KB, as a SUSCEPTIBILITY gene with germline origin: sequencing 2,101 people with severe early-onset obesity found rare KSR2 variants that disrupt RAF-MEK-ERK signaling and cellular fatty acid and glucose oxidation, with carriers showing hyperphagia, low basal metabolic rate and severe insulin resistance (PMID:24209692). The gene is not wired to a mechanism node; KSR2 acts outside the leptin-melanocortin circuit this entry's hypothalamic node models.

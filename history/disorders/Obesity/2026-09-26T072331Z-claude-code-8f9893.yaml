  summary: 'Genetics pass: wire leptin-melanocortin genes into the pathograph, type
    gene relationships, record monogenic homes'
  details: |
    Genetics-gap pass for issue #12253 (d2g series-046), Obesity parent entry.

    Anchor check: disease_term MONDO:0011122 obesity disorder is correct and was
    left alone. Read as a whole list, that class's OLS description carries both "A
    disorder involving an excessive amount of body fat" and the editor note "Obesity
    is a complex disease that may involve multiple environmental and genetic causes.
    See the subclass monogenic disease for genetic subtypes". This entry is the
    complex common disease and is that class, so the six gene-defined diseases in the
    issue are genuine descendants rather than an artefact of an over-broad binding.
    The inflated anchor in this family was on Obesity_Due_to_MC4R_Pathway_Disruption,
    which was bound to the same class; see that entry's history record.

    The gap in this entry was gene wiring. Five genes were bound in the genetic
    section and not one of them reached a pathophysiology node, which is exactly what
    this campaign measures. LEP, LEPR, POMC and MC4R are now bound as genes
    descriptors on the Hypothalamic Dysregulation node. LEP and LEPR are supported by
    the node's own existing evidence (PMID:38490517 states that leptin acts through
    LepRb expressed mainly in the hypothalamus to induce negative energy balance);
    POMC and MC4R needed a further node-level evidence item, so PMID:35528826 was
    added, which states that biallelic POMC, PCSK1 and LEPR variants disrupt
    signalling through the melanocortin-4 receptor pathway to produce hyperphagia.
    The node description now says which arm each gene sits in.

    FTO is deliberately not wired. It is a common-variant susceptibility locus and no
    node in this entry models its mechanism; wiring it to a node whose evidence does
    not mention it would be an unsourced binding. Its notes record that, alongside
    the 1.67-fold odds figure already sourced in its own evidence item.

    relationship_type and variant_origin were added to all five genetic records as a
    faithful translation of the free-text association values already there: FTO and
    MC4R RISK_FACTOR, LEP, LEPR and POMC CAUSATIVE. MC4R stays a risk factor in this
    entry because the cited figure is heterozygous variants in 1-5% of severely obese
    individuals, not a Mendelian claim. Three records that carried no evidence at all
    (MC4R, LEPR, POMC) now carry one each, from references already cached for this
    family.

    A notes block was added recording where the monogenic and syndromic forms of
    obesity are curated, so a reader arriving at the class entry can find them:
    Congenital_Leptin_Deficiency for LEP; the LEPR, POMC, PCSK1, MC4R and SIM1
    diseases as subtypes of Obesity_Due_to_MC4R_Pathway_Disruption; CEP19 as a
    Bardet-Biedl syndrome disease gene in Bardet-Biedl_Syndrome on Orphanet's gene
    list; Prader-Willi_Syndrome and Bardet-Biedl_Syndrome for syndromic obesity. No
    monogenic subtype rows were added to this entry, because duplicating them here
    would claim the same MONDO leaf classes in two places.

    Self-review corrected two inaccurate prose claims in the first draft: a
    description of MC4R deficiency as biallelic, which the cited sources do not
    support (they describe heterozygous MC4R variants and reserve biallelic for POMC,
    PCSK1 and LEPR), and a "commonest single-gene contribution" superlative replaced
    by the 1-5% figure the snippet actually carries.

    Validation: just validate and validate-terms pass; count-verified-snippets
    71/71; check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-enum-values, check-qualifier-terms pass.

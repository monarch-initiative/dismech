  summary: Add the COG hyperinflammatory/HLH arm and corticosteroid prophylaxis
  details: |
    Added the inflammatory arm of COG deficiency from PMID:42269412, a three-patient case series plus systematic review.

    New pathophysiology node Hyperinflammatory episodes and hemophagocytic lymphohistiocytosis, downstream of the combined N-/O-glycosylation defect on an INDIRECT_UNKNOWN_INTERMEDIATES edge, because the source states the glycosylation-to-immune-dysregulation link as a suggestion rather than a demonstration. Two phenotypes: hemophagocytosis (HP:0012156) and recurrent unexplained fever (HP:0001954, FREQUENT from the review's ~40% figure). The latter is deliberately distinct from the entry's existing Recurrent hyperthermia phenotype, which is thermoregulatory and comes from the original COG7 series.

    Treatment: early or prophylactic corticosteroid therapy during febrile episodes, with target_mechanisms INHIBITS on the new node. The mechanism-link evidence is PARTIAL - an uncontrolled observation in three patients supports the direction of effect but not its magnitude. therapeutic_agent bound to CHEBI:50858 corticosteroid after NCIT:C2322 was rejected by the ChemicalEntityTerm dynamic enum.

    KNOWLEDGE_GAP on the route from a Golgi tethering defect to HLH, noting the untested cytotoxic-granule-exocytosis hypothesis and the unresolved question of whether these are infection-triggered secondary HLH.

    Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets 84/84.

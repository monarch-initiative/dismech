  summary: Add MONDO mapping for retired stub term
  details: |
    Added a mappings.mondo_mappings row for MONDO:0010687 nephrolithiasis,
    X-linked recessive, with renal failure (OMIM:310468), with
    skos:narrowMatch. The term is a CLCN5-related presentation of Dent
    disease 1, which the entry curates as its DD1 subtype, and the entry
    already lists X-linked recessive nephrolithiasis as a synonym. MONDO keeps
    it as a separate class, so it is recorded as narrower rather than
    identical. Without the row, the genetics-gap scan nominated the term as a
    stub, which PR 14854 deletes. Validated with just validate and
    just validate-terms.

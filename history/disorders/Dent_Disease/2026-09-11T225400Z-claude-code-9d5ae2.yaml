  summary: 'Create: Dent Disease'
  details: |
    De novo curation of Dent disease (MONDO:0015612), closing issue #11701 and
    deleting stubs/Dent_Disease.yaml.

    Scope and lump/split. Curated at the Dent disease group level with both
    genetic forms as has_subtypes: DD1 (CLCN5, MONDO:0010225) and DD2 (OCRL,
    MONDO:0010359). Lowe syndrome was deliberately left as its own entry --
    kb/disorders/Lowe_Syndrome.yaml already frames itself as split from Dent
    disease-2, and this entry's notes record the reciprocal decision so the
    OCRL allelic spectrum is represented once on each side of the clinical
    boundary rather than duplicated. The justification is cited: the guideline
    states the proximal tubular manifestations overlap between DD1 and DD2, and
    the largest DD2 cohort concludes DD2 is distinct from Lowe syndrome.

    Content. 11 pathophysiology nodes forming a two-entry-point chain (ClC-5
    loss and OCRL deficiency) converging on megalin/cubilin trafficking failure,
    then branching to protein reabsorption failure, vitamin D/PTH loss,
    generalised solute wasting, calcium supersaturation, and fibrosis. 17
    phenotypes, 8 treatments with target_mechanisms links, 4 animal models with
    modeled_mechanisms and readouts, 3 progression phases, 2 definitions
    (diagnostic criteria and a genetic-testing case definition), 3 differential
    diagnoses, and 4 discussions.

    Module conformance. Two nodes conform to
    nephrolithiasis_crystal_nucleation -- "Urinary Calcium Supersaturation" to
    #Urinary Supersaturation (substituting calcium as the lithogenic solute,
    with the module's GO:0007588 and GO:0006816 bindings carried through) and
    "Calcium Crystal Nucleation and Retention" to #Crystal Nucleation and
    Growth.

    Evidence. 140 evidence snippets across 12 PMIDs, every one verified as an
    exact substring of a fetched references_cache entry. Load-bearing sources
    are the 2025 ERA/ESPN clinical practice recommendations (PMID:39794284) and
    the 2010 Orphanet review (PMID:20946626), both open-access full text. Where
    the two disagree -- notably on whether hypercalciuria is a mandatory
    diagnostic criterion -- the newer source is followed and the disagreement
    recorded as a REFUTE evidence item rather than smoothed over. REFUTE items
    are also used for the three places where an intuitive inference is wrong:
    endosomal acidification failure is not the whole mechanism (knock-in mouse),
    CLCN5 variant class does not predict severity, and the standard
    hypophosphataemic-rickets vitamin D regimen must not be transferred to this
    disease.

    Deep-research triage. research/Dent_Disease-deep-research-claude_code.md was
    used as a lead list only. Nine of its PMIDs resolve to papers on unrelated
    subjects and were rejected after fetching and reading each cache file:
    PMID:11115835 (ulcerative colitis), PMID:12815099 (HIV in Langerhans cells),
    PMID:33710298 (Streptomyces rpoB), PMID:14158899 (halothane anaesthesia),
    PMID:20950533, PMID:26296266, PMID:26154403, PMID:11279143, PMID:25911330.
    Four of those nine were misattributed to real, relevant Dent disease papers
    in the report's own reference list, so the citation text looked correct.
    The report's MONDO subtype identifiers were also wrong (MONDO:0010655 is
    X-linked intellectual disability with marfanoid habitus; MONDO:0010371 is
    Aland island eye disease); the correct terms were taken from the stub's
    mondo_descendants and re-verified against MONDO via OLS. The rejections and
    the MONDO correction are recorded in the entry's own notes so a later
    curator does not re-import them.

    Ontology bindings. hgnc:2023 (CLCN5) was derived from
    `runoak -i sqlite:obo:hgnc search "l^CLCN5"` and independently corroborated
    by a curator note in
    kb/disorders/Hypopigmentation_Organomegaly_And_Delayed_Myelination_And_Development.yaml;
    hgnc:8108 (OCRL) from cache/hgnc/terms.csv and the existing Lowe syndrome
    binding. GO:0062158 (chloride:proton antiporter activity) and GO:0048388
    (endosomal lumen acidification) were resolved live via the ols: adapter.
    NCIT:C29372, NCIT:C49185, NCIT:C837, CHEBI:5778 and CHEBI:3654 were each
    looked up rather than recalled; the report's CHEBI:32029 for potassium
    citrate was rejected (it is potassium acetate).

    Validation. `just validate-disorders` passes (schema, terms, references,
    140/140 snippets). Also green: validate, validate-terms,
    count-verified-snippets, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-reference-titles, check-folded-hyphens, check-environmental-evidence.

    Known gaps. No datasets, biochemical reference ranges, clinical trials, or
    experimental_models block. Kidney cysts and metabolic acidosis appear in the
    guideline frequency table but have no supporting prose in the cached
    sources, so they were left uncurated rather than given a table-row-only
    phenotype record; this is stated in the entry's notes.

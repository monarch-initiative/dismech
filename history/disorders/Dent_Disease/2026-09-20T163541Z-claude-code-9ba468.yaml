  summary: Add GeneReviews baseline, wire the fibrosis node, narrow the cataract binding
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #11723 (review 5260975812), on a PR authored by AO33, at the request of the repository maintainer. Also carries an earlier merge commit resolving six derived cache-file conflicts against main. CRITICAL finding, GeneReviews baseline absent: fetched PMID:22876375 (NBK99494, 'Dent Disease.'), added the top-level references block with the GeneReviews tag, and mined all four clinical domains the abstract carries. Clinical characteristics back the chronic kidney disease phenotype (thirty to 80 percent developing ESRD between ages 30 and 50) and scope the cataract phenotype to Dent disease 2. Diagnosis and testing became a new diagnosis section, which the entry previously lacked entirely, covering the establish-the-diagnosis statement, how heterozygous females come to attention, and the annual surveillance schedule. Management backs thiazide diuretics, where GeneReviews states both the calciuria effect and the tolerability limit, and produced a new Avoidance of Nephrotoxic Agents treatment carrying the agents-to-avoid list, linked to the fibrosis node. Genetic counselling backs the inheritance block with the 50 percent maternal transmission figure and the affected-male transmission pattern. check-genereviews now reports TAGGED. Important to record: the cached GeneReviews record is abstract-only, so three claims the reviewer asked for from that chapter (roughly 74 percent of CLCN5 variants private to a single family, sequence-analysis detection rates of about 92 and 95 percent, and germline mosaicism in carrier mothers) are NOT in the cached text and were deliberately not curated; they sit in the full chapter body. That constraint is recorded in the entry notes rather than worked around. IMPORTANT finding, pathograph island: Tubulointerstitial Fibrosis and Progressive Nephron Loss had no inbound causal edge, only a treats edge from Potassium Citrate, so the CKD arm was detached. Added a downstream edge from Failure of Proximal Tubular Protein Reabsorption with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, carrying two PMID:39794284 snippets already on the node, one attributing fibrosis to maladaptive proximal tubular cell responses and one stating that the transition mechanism remains to be deciphered, which is why the link type is unknown-intermediates rather than direct. IMPORTANT finding, over-general binding: the Cataract phenotype bound HP:0000518 while its own description reads 'Punctate, non-dense lens opacities' and exists to contrast with Lowe syndrome's dense congenital cataract. Rebound to HP:0007648 Punctate cataract, found by runoak search against ols:hp. Not done: the reviewer's non-blocking suggestion to add quote_role REVIEW_SYNTHESIS across the existing guideline-derived OTHER items was applied only to the new GeneReviews items, because a clinical practice recommendation can state its own Delphi result as a primary finding and each existing item needs a per-item read. A correction to record, because it was my error and it reached both the PR thread and an earlier draft of this record: I reported the 25-65 percent and 30-70 percent incomplete-Fanconi figures in the pathophysiology description as absent from the cached sources. They are not absent. Table 1 of PMID:39794284 is cached in full at lines 248-268 and carries the row 'Incomplete Fanconi syndrome | 25-65 | 30-70'. My grep spelled the range with a hyphen where the cache uses an en dash, so the negative result was an artifact of the query rather than a fact about the source, which is the failure mode CLAUDE.md records for the l~anaesthetic search. The same applies to the other two prose-figure-audit flags on this entry: the prevalence figures are in the same source as '1 in 400 000 and 1 in 1 000 000', written with spaces where the entry writes commas. All three audit hits on this file are character-level formatting mismatches, not unsourced claims, and the entry's figures and its notes attribution to Table 1 are accurate as written. Validation: just validate-disorders passes, 152/152 snippets verified, up from 140/140; check-genereviews TAGGED; entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms, reference-titles, snippet-grading, title-snippets, snippet-length, folded-hyphens and case-collisions all pass; gene-to-mechanism wiring 2/2. Two reference caches re-acquired cosmetic frontmatter churn during validation and were restored.

  details: |
    Answers the first automated review and the failed gene-grounding CI gate. Bound guanyl-nucleotide exchange factor activity (GO:0005085) and DNA-binding transcription factor activity (GO:0003700) on the EEF1D landing node, the two activities of the two EEF1D products, so the gene now lands on a molecular function. Split the bundled node Abnormal Brain Development and Neuronal Stress Vulnerability: Abnormal Brain Development is now the endpoint shared by both hypotheses, and a separate Neuronal Stress Vulnerability node sits on the heat-shock branch only, carrying the long-isoform knockout mouse evidence (PMID:30333725) and the mouse model link. Added a diagnosis section (whole exome sequencing NCIT:C101295, brain MRI NCIT:C16809) quoting PMID:38083972 and PMID:28097321. Cited the previously uncited PMID:25436608 (eEF1B subunit ablation in human cell lines, IN_VITRO, INDIRECT) on the exchange node. Set model_scale ORGANISM on both mouse links, since a whole animal is what the model observes. The eight isolated phenotypes (motor, growth, ocular, craniofacial) were left unwired: no cached source links any of them to a mechanism node. Validated with just validate, count-verified-snippets (52/52), check-entity-refs, check-causal-targets and check_gene_activity_grounding against origin/main (no EEF1D finding).

  summary: Review and enrich IDH_Mutant_Astrocytoma
  details: |
    Added WHO CNS5 synonyms, bound grade-specific MONDO subtype_terms (MONDO:0956994 grade 2, MONDO:0956995 grade 3, MONDO:0956981 grade 4) alongside skos:narrowMatch mapping justification, added registry epidemiology (Belgium and Spain cohorts) and grade 2 to grades 3-4 malignant transformation progression, and backed Glioma icdo_morphology and Harrisons chapters; expanded pathophysiology into 8 atomic multi-scale nodes separating TP53 somatic inactivation, ATRX somatic inactivation, alternative lengthening of telomeres (ALT), blocked glial differentiation (module-conformant, backed by single-cell RNA-seq PMID:28360267 and preclinical differentiation-induction PMID:38760442), and diffuse cerebral parenchymal infiltration; sourced clinical-presentation phenotypes (Seizures at VERY_FREQUENT up to 80%, Headache, Cognitive Impairment, Hemiparesis, and Aphasia) from EANO guidelines (PMID:33293629) and Rudà et al. (PMID:38760442); added MYCN amplification and MSH6 (PMRDIA) cooperating genetic entries; rebound Maximal Safe Resection to NCIT:C15329 Surgical Procedure, added PCV Polychemotherapy (NCIT:C63491) and CATNON support on Temozolomide Chemotherapy, added the Phase 3 INDIGO trial (NCT04164901) in clinical_trials, and annotated review citations with quote_role: REVIEW_SYNTHESIS.

  summary: 'Address PR #10493 round 4: overstated transplant negative, phenobarbital
    reversal, Doss discriminator, diagnosis'
  details: |
    Fourth round of review response on PR #10493. All four findings accepted; three of six suggestions taken.

    1. The Liver Transplantation description asserted precursor levels were 'unchanged in both the peripheral and central compartments' after transplantation. That is true of the adult in PMID:41377573 and false of the infant in PMID:42396593, cited in the same treatment block, whose overproduction fell by about half. I had generalized one patient's result across both. Corrected to state both outcomes, and the reviewer is right that the corrected version is the stronger claim: substantial hepatic correction that still failed to arrest neurological decline is better evidence for an extrahepatic or CNS-autonomous source than an absent biochemical response would be. Same defect class as the round-2 finding - a description asserting more than the snippet under it supports.

    2. The antiseizure treatment block, whose name is 'with Non-Porphyrinogenic Agents', quoted the initial regimen 'He was treated with levetiracetam and phenobarbital' and stopped there. The same paper records that phenobarbital was subsequently tapered off because barbiturates induce hepatic ALAS1. Quoting the start of the regimen and not the reversal read as endorsing a barbiturate in a porphyria. Added the taper sentence as its own evidence item and rewrote the description. Also noted there that the avoidance rationale is inherited from AIP, where hepatic induction is the driver, and is therefore weaker in principle in this disorder - though it was acted on clinically.

    3. The precursor_toxicity_vs_cns_heme_deficit discussion framed the question as undiscriminated. PMID:41731635, already cited four times in this entry, carries a human biallelic natural experiment that narrows it: Doss porphyria from biallelic ALAD variants raises ALA but not PBG, and produces severe peripheral polyneuropathy with no CNS involvement, implying ALA elevation alone is insufficient for white matter disease and PBG is the likelier of the two precursors. Added with its quote. The rationale now sets that against the PBGD-deficient mouse, which points toward heme deficiency, and says explicitly that the two point in different directions - which is why the gap stays open rather than closes.

    4. diagnosis: block added, three entries. The framing is that the diagnosis turns on zygosity rather than on finding an HMBS variant at all: one pathogenic allele is AIP, two are this disease, several biallelic alleles are themselves known AIP alleles, and the treatment expectations differ. Sequencing with segregation, erythrocyte HMBS activity separating patients from carriers, and CSF precursor measurement, which is not part of a routine porphyria workup and is the measurement that distinguishes the disorder mechanistically.

    Suggestions taken: frequency added to the infantile Hypotonia and Global developmental delay entries.

    Suggestions not taken. The ocular frequency asymmetry was left: optic atrophy is reported in two of three index patients while the gaze, convergence and nystagmus findings come from a clause that does not give a count, so FREQUENT versus OCCASIONAL reflects a real difference in what the source states rather than an inconsistency. The R167Q publication: still points at PMID:41377573 because that is the source this entry actually read for those findings; citing the primary mouse paper would mean claiming a source I have not fetched. The same reasoning covers the secondhand MODEL_ORGANISM provenance point - the grading is right, the quote is genuinely from a case report's discussion, and re-attributing it to the primary study without reading that study would be worse than the current one-step-removed provenance.

    Validation: just validate passes; 53/53 snippets verified, up from 46/46. All offline gates green including check-snippet-length.

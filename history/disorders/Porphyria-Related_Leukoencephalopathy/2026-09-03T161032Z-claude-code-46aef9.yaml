  summary: 'Address PR #10493 round 6: self-contradiction from a half-applied fix,
    cataract frequency'
  details: |
    Sixth round of review response on PR #10493. Both findings accepted.

    1. The previous round's fix was half applied and left the entry contradicting itself. I softened the notes block to 'most reported individuals have no AIP attacks, though a minority do' and the disease description still said 'affected individuals do not have the episodic neurovisceral attacks that define AIP'. Both render on the same page. The reviewer is right that this is worse than the state it replaced: an entry that overstates consistently is at least coherent.

    The mechanism of the failure is one I have now hit twice in this PR series and should name. My string replacement for the description did not match, and the script reported success anyway because I only validated that the resulting YAML parsed. The same thing happened on PAICS in an earlier round, where a history record claimed a biological_scale change that never landed. The fix applied here is to assert on every replacement anchor before writing, and this edit does that - all four replacements are asserted, so a non-matching anchor now aborts rather than passing silently. I also grepped every occurrence of 'attack' in the file and checked each one rather than fixing only the line the reviewer quoted, which is what I should have done last round.

    2. Cataract was raised to FREQUENT with only a single-patient snippet attached, which supports the phenotype existing and not its frequency. The sentence that carries the frequency - 'Bilateral cataracts, optic nerve atrophy, and cerebellar abnormalities were also common' - was in a cache file this entry cites four times and quoted nowhere. Attached to Cataract, and also to Optic atrophy, whose FREQUENT had been resting on two affected members of a single three-person kindred.

    Also corrected in the same description: I called PMID:41731635 'the most recent review'. It is a case report in J Med Case Rep; the sentence sits in its introduction summarising thirteen prior cases. Reworded to say what it is. PMID:42396593 is the paper whose title actually claims a review of prior reported cases.

    Validation: just validate passes; 59/59 snippets verified, up from 57/57. pytest -k porphyria 124 passed. All offline gates green.

  summary: 'Create: Porphyria-Related_Leukoencephalopathy (biallelic HMBS)'
  details: |
    De novo curation of porphyria-related leukoencephalopathy / LENCEP (MONDO:0958226), the autosomal recessive disorder of biallelic HMBS variants. Distinct from acute intermittent porphyria, which dismech already curates separately as Acute_Intermittent_Porphyria and which is the monoallelic, dominant, attack-based disease from the same gene.

    Entry-type decision. The claim issue asked whether this should be a Disease or folded into Acute_Intermittent_Porphyria as a phenotype or subtype. Curated as its own Disease. The reported individuals do not have AIP attacks at all, the MRI lesion is a recognizable and reproducible pattern across independent kindreds, the inheritance mode differs, and - decisively - the therapies that work in AIP do not work here. Folding it into AIP would attach a false prognosis and a false treatment expectation to it. The Acute_Intermittent_Porphyria entry mentions no leukoencephalopathy or white matter change, so nothing was duplicated.

    Deep research: openscientist (research/Porphyria-Related_Leukoencephalopathy-deep-research-openscientist.md). Falcon, the repo default, was unavailable (no EDISON_API_KEY/FUTUREHOUSE_API_KEY); openscientist was chosen explicitly rather than substituted silently. The report shipped without reference_validation or term_validation frontmatter, so both were retro-fitted in place. References: 32/32 resolved, 0 unresolved, 0 off topic, 15/17 quoted claims found in source. The 2 quote failures are false positives - the validator prints an identical 'closest text in source' for both, so the mismatch is whitespace or encoding, not fabrication. Terms: 37 checked, 0 unresolved, 0 obsolete; the 3 'named as a different term' entries are markdown-formatting artifacts where the extractor captured surrounding prose as the label, not wrong bindings.

    Two things were taken from the report, each verified against a freshly fetched primary source rather than cited to the report. First, PMID:11478735, showing that ALA inhibits muscimol binding at GABA-A receptors in human as well as rat cortical membranes; this gives the precursor-toxicity arm of the central knowledge gap a concrete molecular candidate and is graded SUPPORT with directness INDIRECT, because the experiment used millimolar ALA on membranes from unaffected brain and was framed around AIP rather than this disorder. Second, the observation that no animal model reproduces the biallelic CNS leukodystrophy, recorded as its own KNOWLEDGE_GAP explaining why this entry carries no animal_models block and why the two competing pathogenic hypotheses remain untestable.

    Deliberately not taken from the report: its ALAS1 de-repression step. That is the AIP attack mechanism, and it is specifically what does not apply here - liver transplantation leaves CSF precursor concentrations unchanged. Writing it into this entry would have contradicted the entry's own evidence. Also not taken: the report's PRES material and the AIP-with-PRES case reports surfaced during search (for example PMID:40186107, PMID:36597305), which describe the reversible monoallelic phenocopy and belong to Acute_Intermittent_Porphyria, not here.

    Pathograph: four nodes from biallelic HMBS deficiency through porphyrin precursor accumulation and constitutive CNS precursor exposure to cerebral white matter degeneration. The last two edges are INDIRECT_UNKNOWN_INTERMEDIATES on purpose - the neuropathological step is explicitly unestablished in the literature and the entry should not imply otherwise.

    Both failed therapies are curated as treatments with REFUTE evidence rather than omitted, because 'liver transplantation does not help' is the most clinically actionable fact about this disorder. The transient 12-month improvement in one patient is carried separately as SUPPORT with directness INDIRECT, since it is what motivated further attempts.

    Validation: just validate passes (schema, terms, references); 34/34 snippets verified. check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values all pass. Compliance 90.9% global / 91.7% weighted before the final two additions.

    No datasets: block; no transcriptomic or omics dataset for this disorder was identified, and searching HMBS returns the acute intermittent porphyria literature.

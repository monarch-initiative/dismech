  summary: 'Address PR #10493 round 5: overstated claims made to match their sources'
  details: |
    Fifth round of review response on PR #10493. All four findings accepted; all four suggestions taken.

    The reviewer named the pattern and is right about it: every one of these four is a description or rationale asserting more than the snippet beneath it supports, and in every case the sentence needed was already in a cache file this entry cites. That is the third consecutive round with the same defect class - round 2 on the enzyme-activity claim, round 4 on the transplant negative, and now four more. The failure is not in sourcing but in writing prose from memory of what a paper said and then attaching whichever nearby quote looked supportive, rather than writing the prose from the quote. Recording it because the fix is a habit change, not four edits.

    1. The entry twice claimed categorically that affected individuals do not have AIP attacks. PMID:41731635, cited four times here, says 'most of them did not present acute porphyric attacks' and separately describes an adult with biallelic HMBS who 'suffered from dysarthria, ataxia, and acute porphyric attacks'. The index patient in PMID:41377573 had fleeting neurovisceral pain that recurred after transplant. The defensible claim is non-inducibility, quotable verbatim: 'None of these patients have been reported to have attacks in response to classical porphyrinogenic stimuli'. Both passages softened to that and the quote attached as evidence on the inheritance block.

    2. The intravenous haem block read as though haem does nothing biochemically. It does, peripherally - roughly 50% transient reductions in urinary ALA, PBG and porphyrins. Stated, with the quote, graded SUPPORT for the peripheral effect. This makes the entry's central argument stronger rather than weaker: the peripheral compartment responds while the central one does not, which is the compartmental dissociation the pathograph already models and the same argument the liver transplantation block makes.

    3. Round-4 finding 3 was half done. The Doss porphyria paragraph reached the discussion rationale but the discussion's evidence list never gained the snippet. Added.

    4. The PBGD-mouse description asserted that ALA was normal or only twofold raised and that the authors concluded heme deficiency can cause the neuropathy; neither attached snippet carried either claim. Both are in one sentence in PMID:10207164, now added as a MODEL_ORGANISM item.

    Suggestions taken: cataract raised from OCCASIONAL to FREQUENT, since the most recent review groups it with optic atrophy and cerebellar change as 'also common'; the prevalence note corrected from thirteen to fourteen, since the source describes thirteen previously published patients plus its own index case; and the white matter location preferred_term made specific to periventricular and deep cerebral white matter while keeping the general UBERON binding. The transient-subjective-improvement phrasing is retained and is now covered by the peripheral-response evidence added under item 2.

    Validation: just validate passes; 57/57 snippets verified, up from 53/53. pytest -k porphyria 124 passed. All offline gates green.

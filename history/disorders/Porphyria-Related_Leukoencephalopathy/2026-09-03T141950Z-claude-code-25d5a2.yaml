  summary: 'Address PR #10493 second review: failing test, model CNS phenotype, term
    split'
  details: |
    Second round of review response on PR #10493. All four findings accepted; all three suggestions taken.

    1. A failing test, and I should have caught it. tests/test_data.py::test_animal_model_mechanism_targets failed on this entry: I pointed a modeled_mechanisms target at 'Intravenous Haem Therapy', a treatment, when that slot must name a pathophysiology or phenotypes node. Reproduced locally before fixing. The relationship was also backwards - I used FAILS_TO_RECAPITULATE to say the mouse matches the human non-response to haem, which is what RECAPITULATES means.

    Worth recording why this reached review: CI selects pytest by changed path, and a curation PR touches only kb/, matching neither the python nor the schema filter, so test (3.13) passed green while this test was never run. That is the exact gap CLAUDE.md documents as the reason check-entity-refs and check-duplicate-keys are ungated CI steps rather than only tests. The practical lesson for me is to run pytest -k on the relevant tests for any entry that adds a cross-referencing block, not to rely on the offline just check-* gates plus green CI.

    Rather than delete the link as suggested, it was retargeted onto Cerebral White Matter Degeneration, where FAILS_TO_RECAPITULATE is both valid and true - which the reviewer's own finding 2 supplies the evidence for.

    2. The entry claimed twice that the R167Q mouse's CNS phenotype was uncharacterized. PMID:41377573, which this entry already cites four times, reports that CNS histopathology is normal and brain haem is about 80% of wild type. That is a reported negative, not absent data, and it is more informative than the hedge: the closest genetic model does not produce the defining lesion despite carrying the constitutive precursor elevation. Both passages corrected, and the finding is now the evidence on the retargeted FAILS_TO_RECAPITULATE link, graded REFUTE. It also bears on the central mechanism gap - neither the precursor burden nor a central haem deficit was sufficient to produce white matter pathology in that animal.

    3. A snippet stopped one word short of what its explanation claimed, ending at 'and are non'. The cause was a U+2010 hyphen in 'non-responsive' rather than an ASCII one. Extended through 'haem provision' and moved onto the surviving link.

    4. HP:0000496 still bundled vertical gaze palsy with convergence palsy after the earlier nystagmus split. Split into HP:0025721 Limited vertical extraocular movement and HP:0000619 Impaired convergence. HP:0025721 was chosen over a supranuclear term because the source describes the deficit without establishing its localization.

    Suggestions taken: the cerebellar atrophy edge the entry already asserted in prose is now drawn, with its own evidence; a prevalence block records the thirteen published patients; and PMID:8563760, the 1996 primary description of the PBGD-deficient mouse fetched by this PR but uncited, now sits alongside the 1999 follow-up on that model.

    The six orphan ocular phenotypes remain unlinked. As the reviewer allowed, the mechanism genuinely is not known and drawing those edges would be inventing it.

    Validation: just validate passes; 46/46 snippets verified, up from 41/41. tests/test_data.py passes on the animal-model, entity-ref and causal-target selections (16,039 tests). All offline gates green.

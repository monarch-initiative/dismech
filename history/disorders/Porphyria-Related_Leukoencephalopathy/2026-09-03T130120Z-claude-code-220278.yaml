  summary: 'Address PR #10493 review: two animal models, enzyme-activity claim, term
    specificity'
  details: |
    Response to the automated review on PR #10493. All four blocking items accepted; both suggestions taken.

    1. Two animal models existed and this PR had fetched both papers without citing them. Added an animal_models block. The PBGD-deficient mouse (PMID:10207164) is the more important of the two and it is discriminating, not merely confirmatory: its neuropathy developed chronically and progressively while plasma and urinary ALA were normal or only twofold raised, which is the opposite of what a precursor-toxicity model predicts, and the authors conclude heme deficiency and hemeprotein dysfunction can cause it. That evidence is now attached to the precursor_toxicity_vs_cns_heme_deficit discussion, graded SUPPORT with directness INDIRECT, since the model is a partial deficiency with a peripheral phenotype rather than the biallelic central disease. It constrains the mechanism question without settling it, and the discussion says so.

    The biallelic R167Q mouse is the model-treatment join the reviewer identified. It has constitutively high PBG and ALA in brain and CSF, normal ALAS1 transcript before and after porphyrinogenic stimuli, and no response to haem provision - the same three features that make hepatically directed therapy fail in patients. Linked with RECAPITULATES against the CNS precursor node and FAILS_TO_RECAPITULATE against the intravenous haem treatment, the latter carrying the required limitations and evidence.

    The no_animal_model_of_the_biallelic_cns_disease discussion was overstated and is now narrowed to what is true: the peripheral neuropathy and the biochemical compartment are both modelled; the leukodystrophy is not.

    2. The Biallelic HMBS Deficiency description asserted activity 'far below the roughly 50% seen in heterozygous AIP carriers' while its own cited snippet gives a 50-66% decrease, that is 34-50% residual, which overlaps the heterozygous range. Only the 18% kindred supported the strong claim. Rewritten to state the actual range and to say that residual activity is not uniformly below the heterozygous range and tracks the specific allele pair.

    3. HP:0001251 Ataxia replaced with HP:0002073 Progressive cerebellar ataxia, which matches the preferred_term, the source sentence, and the clinical_course that was being carried separately. The now-redundant clinical_course: PROGRESSIVE was removed since the term carries it.

    4. HP:0000496 bundled nystagmus with the gaze palsies. Nystagmus split out to HP:0000639, named verbatim in the snippet. The remaining entry keeps HP:0000496 for the vertical gaze and convergence palsy, with a description saying why it is bound at the general level.

    Suggestions taken. Three previously orphan phenotypes are now wired into the pathograph from Cerebral White Matter Degeneration - cognitive impairment, and the infantile seizure and developmental delay - all as INDIRECT_UNKNOWN_INTERMEDIATES, since the anatomical correlation is asserted in the clinical literature rather than demonstrated. Cataract, optic atrophy and the eye movement abnormalities were left orphan deliberately: no source connects them to the white matter lesion, and inventing those edges would be worse than leaving them unconnected.

    Non-porphyrinogenic anticonvulsant guidance added as its own treatment, citing the levetiracetam sentence. Its description flags that the rationale is inherited from AIP practice rather than demonstrated here, where hepatic induction is not the driver.

    Validation after changes: just validate passes; 41/41 snippets verified, up from 34/34. All offline gates green. Compliance 87.7% global / 88.2% weighted.

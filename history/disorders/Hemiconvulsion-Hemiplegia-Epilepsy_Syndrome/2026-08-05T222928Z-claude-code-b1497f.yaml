  summary: 'Create: Hemiconvulsion-Hemiplegia-Epilepsy Syndrome'
  details: |
    Created the HHE entry as an eight-node pathograph running from prolonged unilateral febrile status epilepticus through inflammation and blood-brain-barrier breakdown to acute unilateral cytotoxic oedema, then splitting into hemiplegia and progressive cerebral hemiatrophy, and converging on epileptogenic reorganization of the damaged hemisphere and drug-resistant focal epilepsy. Two nodes declare conformance to epilepsy_excitation_inhibition_imbalance. Two discussions are attached: a knowledge gap on why injury is confined to one hemisphere, and a controversy on the immature-brain resistance paradox. Deep research was run with the falcon provider; that report states in its own limitations section that it could not supply reliable abstract quotations and deliberately omitted PMIDs, so it was used as a completeness cross-check only and contributed no snippets. All 31 snippets were verified against their own fetched caches, and term validation passes.

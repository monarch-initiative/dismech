  summary: 'Address PR #9106 review: add A/B-spanning rebalancing therapy class, GeneReviews
    references, GO rebindings'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9106. All three
    IMPORTANT items addressed, plus all four non-blocking suggestions. Nothing was
    declined.

    IMPORTANT 1 - missing A/B-spanning rebalancing therapy class. Added a
    'Hemostatic Rebalancing Prophylaxis' treatment covering fitusiran (antithrombin-
    lowering siRNA) and the anti-TFPI monoclonal antibodies concizumab and
    marstacimab. The reviewer's argument is correct and is the same lumping logic
    this root already rests on: emicizumab belongs on Hemophilia_A because a
    bispecific FVIIIa mimetic substitutes for the missing cofactor and cannot help a
    patient missing the protease, whereas rebalancing agents act on the anticoagulant
    side downstream of the tenase step and are therefore indifferent to which subunit
    is absent. Their pivotal trials enrolled hemophilia A and B together and across
    inhibitor states, an experimental design only a genuinely factor-agnostic
    mechanism permits. Two target_mechanisms edges were added: RESTORES on 'Loss of
    the Propagation-Phase Thrombin Burst' and BYPASSES on 'Refractoriness to Factor
    Replacement', the latter giving that node a therapy for the first time. Four new
    Phase 3 references fetched with just fetch-reference and quoted verbatim from the
    cached abstracts: PMID:37003287 (ATLAS-INH, hemophilia A or B with inhibitors),
    PMID:37003278 (ATLAS-A/B, without inhibitors), PMID:37646676 (explorer7,
    concizumab) and PMID:40584300 (marstacimab). No snippet was taken from the falcon
    report. therapeutic_modality is single-valued and is set to SIRNA for the
    fitusiran arm, with the antibody modality of the other two agents recorded in
    notes; no aso_details block was added, because fitusiran is an siRNA and not an
    antisense oligonucleotide.

    IMPORTANT 2 - untagged GeneReviews. Added a top-level references: block tagging
    both chapters this root mines, PMID:20301578 (Hemophilia A) and PMID:20301668
    (Hemophilia B), following the pattern at Hemophilia_B.yaml lines 232-237.

    IMPORTANT 3 - over-general GO:0065003. Rebound the 'Intrinsic Tenase Complex
    Failure' node to GO:0007597 (blood coagulation, intrinsic pathway), verified
    against OAK. GO:0065003 (protein-containing complex assembly) was a near-root
    term with no coagulation semantics and would have pulled the node into unrelated
    query results. The reviewer offered dropping term: with an NTR note as the
    alternative; GO:0007597 was chosen because it is genuinely true of this node
    rather than merely harmless, at the cost of repeating the term used one node
    earlier - a real but minor redundancy, and preferable to an unbound descriptor.

    SUGGESTIONS, all taken. GO:0007596 to GO:0072377 (blood coagulation, common
    pathway) on the thrombin-burst node, which is where the prothrombinase burst
    actually occurs. GO:0006955 to GO:0002455 (humoral immune response mediated by
    circulating immunoglobulin) on the inhibitor node, which is precisely what a
    factor inhibitor is. Both verified against OAK. The inhibitor arm was reconnected
    into the main pathograph component with an explicit downstream edge from
    'Refractoriness to Factor Replacement' back to 'Residual Factor Activity-Graded
    Hemostatic Reserve', on the reasoning that neutralization of infused factor
    returns effective circulating activity to the untreated baseline - so an inhibitor
    moves the patient back down the same severity axis replacement moves them up,
    making the inhibitor arm a reversible re-entry into the shared mechanism rather
    than a separate process. A clinical_trials: block was added for the three
    A/B-spanning registrations (NCT03417102 ATLAS-INH, NCT03754790 ATLAS-OLE,
    NCT04083781 explorer7), all cached with just fetch-reference. NCT03754790 was
    independently confirmed against the ClinicalTrials.gov API before being cited:
    281 participants, Phase 3, 'Hemophilia A or B, With or Without Inhibitory
    Antibodies to Factor VIII or IX' - the reviewer's figure is accurate.

    Validation: just validate-disorders over all three changed files passed, 88/88
    snippets verified (up from 78/78); just count-verified-snippets on Hemophilia.yaml
    reports 34/34; just validate-terms passed, with the three new NCIT drug terms and
    the GO rebindings newly derived into the caches by the validator; just
    check-duplicate-keys OK over 4254 files; check_snippet_length.py --against-ref
    origin/main, check_folded_hyphens.py and check_title_snippets.py all OK. The
    folded-hyphen gate caught one genuine new defect on first run - a compound
    'anti-tissue-factor-pathway-inhibitor' split across lines inside a folded scalar,
    which would have rendered with a space mid-compound - and the prose was reflowed
    rather than the finding grandfathered.

    Committed on top of the existing branch; the review was not dismissed and nothing
    was force-pushed.

  summary: 'Create: Hemophilia root over existing Hemophilia A and B entries'
  details: |
    Root-over-existing-subtype-subtree curation for MONDO:0018660, following the
    pattern established in PR #8903.

    Scoping decision - Disease root with has_subtypes, not a kb/groupings/ Grouping.
    Two reasons. First, the unifying lesion here is a single enzyme complex rather
    than a family resemblance: factor VIIIa and factor IXa are the cofactor and the
    protease of the same intrinsic tenase complex, so hemophilia A and hemophilia B
    are the two ways of disabling one enzymatic step, and every node downstream of
    the initiating lesion is genuinely shared. That is precisely the case a thin
    Disease root exists to express, unlike Diabetes_Mellitus or
    Ehlers-Danlos_Syndromes, whose members have divergent causal branches and are
    therefore modelled as Groupings. Second, Grouping.members[].member is a foreign
    key to an existing Disease.name enforced by tests/test_data.py; hemophilia B
    Leyden (MONDO:0850054) has no dismech entry, so a Grouping structurally could
    not carry the third subtype the issue asks for, whereas has_subtypes can.
    MONDO's own subsets do not discriminate between the two options: marginal zone
    lymphoma (MONDO:0017604) carries the identical disease_grouping plus
    ordo_group_of_disorders pair and was curated as a Disease root in PR #8903.

    No F8 or F9 content was re-derived. Hemophilia_A.yaml and Hemophilia_B.yaml were
    touched only to add 'hemophilia' to their parents lists, so the root is reachable
    from its members, matching the PR #8903 convention. The root carries six shared
    pathophysiology nodes (intrinsic tenase subunit deficiency, tenase complex
    failure, loss of the propagation-phase thrombin burst, residual-activity-graded
    hemostatic reserve, alloimmune inhibitor response to replacement factor,
    refractoriness to factor replacement), three family-level phenotypes, both genes
    as pointers only, two family-level treatments with target_mechanisms, and two
    KNOWLEDGE_GAP discussions.

    Scope decisions recorded as discussions rather than resolved silently. MONDO
    places congenital factor XI deficiency and acquired hemophilia beneath
    MONDO:0018660 while the same term's own textual definition restricts it to
    factor VIII or IX deficiency; this entry follows the definition. Factor XI is
    upstream of, not part of, the intrinsic tenase complex; it is autosomal rather
    than X-linked; and its bleeding phenotype does not track factor level, so it
    fails all three of the claims this root makes. Acquired hemophilia has no
    germline lesion and sits closer to the inhibitor node than to the trigger node.
    Separately, MONDO:0850054 is asserted only as is_a hemorrhagic disease and so
    sits outside the MONDO:0018660 subtree entirely; that is flagged as a candidate
    upstream MONDO report rather than worked around by choosing a different term.

    Deep research: research/Hemophilia-deep-research-falcon.md, treated as leads
    only. just preflight-dr returned SKIP, as expected for a grouping term with no
    RO:0004003 causal gene. The manual section 2b fallback cleared it: gene mentions
    are balanced across both members (F8=22, F9=15) rather than dominated by
    hemophilia A, both member OMIM identifiers (306700 and 306900) are present, the
    report's own scope note states it concerns congenital hemophilia A and B and
    explicitly excludes acquired hemophilia, and bare 'hemophilia' is not a MONDO
    synonym of hemophilia A, so the umbrella-versus-member alias collision did not
    occur. The report independently recommends that the A and B entities remain
    separate children beneath a congenital hemophilia parent, which corroborates the
    scoping choice above. The report does contain identifier errors - it assigns
    MONDO:0010603 and ORPHA:98878 to hemophilia B, both of which are wrong - so no
    identifier was taken from it; every MONDO CURIE in this entry was derived from
    OAK directly.


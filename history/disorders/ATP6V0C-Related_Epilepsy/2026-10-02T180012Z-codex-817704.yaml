  summary: Review ATP6V0C epilepsy against full-text clinical and functional evidence
  details: |
    Reviewed the entry against the Falcon research narrative, citation artifact and cohort table, and all 12 originally cited cached references. Read the disease-specific full text of PMID36074901 (methods, clinical results, functional assays and discussion), PMID35600075 (case narratives and clinical table), PMID40085430 (adult cases, methods and table), the ATP6V0C section of review PMID39273013, and the relevant primary results/methods of PMID29652249. The remaining sources were abstract-only; regeneration of PMID30155790 and PMID30245510 did not provide full text. PMID36074901 HTML lacks table cells; a supplementary attempt to retrieve Europe PMC XML returned HTTP 500, so only claims supported by its accessible narrative were curated. No caches were hand-edited.

    Corrected homozygous CRISPR worm knock-ins, assay-dependent yeast residual function, and preclinical versus human drug responses. Full-text case data resolve an overgeneralized familial-study abstract: one proband had seizure freedom on valproate and the other on valproate/nitrazepam/lamotrigine. Dominant-negative action, NMD escape and downstream neuronal mechanisms remain hypotheses. Split acidification from loading, marked inferred nodes, and linked the genetic lesion to core developmental phenotypes through unknown intermediates. Added the yeast experiment and preserved negative/normal model readouts.

    Added clinical presentations, adult Dravet-like features, precise cardiac/enamel/vermian terms and molecular diagnosis. Removed population prevalence classification and phenotype frequency bands unsupported beyond small selected cohorts; retained attributable counts. Recorded LZTR1 and 20q-deletion confounding, duplicate-case overlap, and uncertain attribution of adult parkinsonism. Replaced the generic cardiac root and narrowed EEG binding with source-supported specific HPO terms verified with OAK. Added source titles and a biological knowledge-gap discussion. PMID20839327 remains a zebrafish isoform lead, but its abstract only establishes altered excitability and does not support directional hyperexcitability; removed it from that claim.

    Research completeness: phenotypes, presentations, pathophysiology, genetics, diagnosis/imaging, treatment and high-value references covered. Trafficking/autophagy routes retained as an explicit open question rather than established ATP6V0C patient-cell defects. Research provided no trial identifier or validated diagnostic biomarker requiring additional structured records. Bookshelf baseline (2026-09-10 index; checked 2026-10-02) found no disease-specific GeneReviews or StatPearls chapter. Clinical seizure/developmental branches are connected; rare/confounded observations are not assigned invented cellular causes.

    Author validation: schema, ontology terms and all 87 evidence snippets/98 titles passed the final validate-disorders sweep. Render succeeded. Repository QA, snippet grading and commit hooks are recorded in the accompanying PR review after completion. Independent current-head review is required; this record is an author review, not self-approval.

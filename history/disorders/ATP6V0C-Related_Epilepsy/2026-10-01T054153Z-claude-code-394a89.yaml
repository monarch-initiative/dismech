  summary: 'Create: ATP6V0C-Related Epilepsy'
  details: |
    New entry for MONDO:0958196 (early-onset epilepsy 3, ATP6V0C). Built from the primary literature: the 27-patient founding cohort (PMID:36074901, full text), the familial FS/EFS+ report (PMID:35600075, full text), independent case series (PMID:37161035, PMID:33190975), the Dravet-like severe end (PMID:40085430), fever-sensitive epilepsy (PMID:42526150), the 16p13.3 deletion papers (PMID:30245510, PMID:33090716), and V-ATPase synaptic biology (PMID:29652249, PMID:30155790, PMID:20839327). Falcon deep research (research/ATP6V0C-Related_Epilepsy-deep-research-falcon.md) agreed with this source set; its reference block set needs_review because of one ellipsis-shortened quote of the PMID:36074901 abstract (the entry quotes the full sentence) and a template placeholder in place of the MONDO label, and its one additional source, the 2024 V-ATPase review (PMID:39273013), is cited for one synthesis claim. Steps downstream of reduced pump activity (vesicle loading, release, excitability) are not measured for patient alleles and are carried in two EMERGING hypothesis groups. Developmental delay and intellectual disability are deliberately not wired into the pathograph. just preflight-dr was not run: it requires a local mondo.db, which this environment does not have. just check-genereviews --online raised a ValueError in bookshelf.py rank() on this entry; the offline check reports NO_CHAPTER for GeneReviews and StatPearls, matching a PubMed genereviews[book] search. A fresh-context review pass found missing reference titles, an over-specific congenital heart binding, an unsourced mosaicism claim and treatment wording; all were fixed before commit. Validation: just validate, validate-terms, count-verified-snippets (50/50) and the offline gates pass.

  details: |
    Addressed the independent review on PR13401 in one revision. Restored structured frequencies as phenotype_contexts scoped to the founding cohort: tonic-clonic 12/19, focal 7/19, atonic 6/19, myoclonic 5/19, developmental delay 21/23, intellectual disability 16/16, callosal abnormalities 5/21 imaged and delayed myelination 4/21 imaged. Added onset-qualified contexts for seizures before age two (14/18 with onset information) and first febrile seizure at 7–8 months in the six affected familial cases. These remain cohort observations rather than population penetrance.

    Also restored the drug-neutral familial myoclonic-seizure observation and historical testing-panel ascertainment caveat without a prevalence class. Added indirect gene-to-MRI/autism links while leaving confounded cardiac findings and parkinsonism without invented causal edges.

    Recovered and read the founding paper's complete Table 1 using the PMC reader view, cached only through just fetch-reference url:https://pmc.ncbi.nlm.nih.gov/articles/PMC10319782/?report=reader. The ordinary PMID HTML cache omitted its table cells; PDF/XML/table URL attempts returned CAPTCHA pages, Europe PMC returned 403/500, and the DOI route returned only an abstract. These unused retrievals were excluded from the PR. The generated reader cache supports infantile spasms (patients6,7,24; patient7 has another deletion), non-verbal status (patients6,10,16,19), and regression (patients2,9,14,27). Added the three phenotypes with exact table snippets and retained the separately observed lack of regression in the two adult Dravet-like cases. OAK verified HP0012469, HP0001344 and HP0002376.

    Schema, ontology and reference validation passed: 111/111 snippets and 123 titles. Page rendering included the newly added table phenotypes. The companion reply records targeted QA and hook results after completion. Existing history was left unchanged.

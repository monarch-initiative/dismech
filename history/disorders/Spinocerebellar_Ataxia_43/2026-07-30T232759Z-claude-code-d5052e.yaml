  summary: 'Create: Spinocerebellar Ataxia 43 [MME/SCA43]'
  details: |
    Created de-novo SCA43 [MONDO:0014867, MME/neprilysin, autosomal dominant]. NEC preflight confirmed gene MME [HGNC:7154] and OMIM:617018 against MONDO. Four pathophysiology nodes: neprilysin dysfunction, impaired neuropeptide catabolism, peripheral axonal degeneration [conforms_to peripheral_axonal_degeneration], cerebellar Purkinje/vermis degeneration [conforms_to cerebellar_purkinje_degeneration]. 14 HPO-termed phenotypes, MME genetics with recessive CMT2T contrast, supportive treatments. Evidence from PMID:27583304 [Depondt discovery], PMID:27588448 [Auer-Grumbach AD MME neuropathy], PMID:26991897 [Higuchi recessive CMT2T], PMID:42132968 [2026 phenotype expansion]. Falcon deep research initiated. Validated: just validate passes.

  summary: 'Answer review of #15545: remove overstated bindings from the deletion
    node, fix the SULF1 catalytic term, restore the carpal caveat'
  details: |
    Removed molecular_functions, cell_types and locations from the 8q13 deletion node: GO:0022857 transporter activity contradicted the entry's own evidence that SLCO5A1 function is unknown, GO:0008484 repeated the sulfatase-loss claim of the next node, LOSS_OF_FUNCTION overstated a heterozygous deletion, and skeletal cell types do not apply to a constitutional lesion. Both genes are already grandfathered in tests/gene_activity_grounding_baseline.txt. On Loss of Heparan Sulfate 6-O-Endosulfatase Activity, replaced GO:0008201 heparin binding and the broad parent GO:0008484 with GO:0008449 N-acetylglucosamine-6-sulfatase activity (DECREASED); QuickGO annotates SULF1 (UniProt Q8IWU6) to GO:0008449 with EXP, IDA and IMP evidence, and the OLS label matches. Added directness INDIRECT to the acral-synostosis evidence and restored the caveat that the abstract does not name the fused bones. Removed the ISDS classification evidence item, whose snippet does not name this disorder; the classification notes keep the exact nosology row. Reworded the Harrison's evidence explanation to tie it to the genetics-axis tag, and added the PR link to the 2026-10-24 record.

  summary: 'Create: Mesomelia-Synostoses Syndrome'
  details: |
    De-novo curation of row NOS 15-0140 of ISDS Nosology 2023 group 15, the Verloes-David-Pfeiffer type. A contiguous-gene 8q13 microdeletion syndrome removing exactly SULF1 and SLCO5A1. Both genes are curated rather than collapsing to SULF1: the defining study concludes only that SULF1 haploinsufficiency contributes and suggests that combined SULF1 and SLCO5A1 haploinsufficiency, or a position effect, could be necessary, so SULF1 is CAUSATIVE and SLCO5A1 COOPERATING with PARTIAL evidence. The mechanism node explains why an endosulfatase loss is a growth-factor-availability lesion rather than a structural one, and cites the tissue-expression argument that makes SULF1 the better candidate. A KNOWLEDGE_GAP discussion records that the two-gene requirement has never been tested against the one-gene alternative, and why a diagnostic laboratory will eventually need the answer. All 13 evidence snippets verified; schema, term and reference validation pass.

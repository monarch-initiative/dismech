  summary: Reviewed and enriched Mesomelia-Synostoses Syndrome with classification evidence, molecular
    function and anatomical/cellular grounding across pathophysiology nodes, phenotype diagnostic flags,
    genetic association and origin metadata, diagnosis presence/results, and MONDO bindings for differential
    diagnoses.
  details: Added evidence to classifications.harrisons_chapter and isds_skeletal_category; grounded SULF1
    and SLCO5A1 on GO molecular functions (GO:0008484 and GO:0022857) and added CL (osteoblast, chondrocyte)
    and UBERON (skeleton, cartilage tissue, bone element, limb) terms across pathophysiology nodes; added
    diagnostic flags to phenotypes; removed legacy PARTIAL wording from explanation fields; added association
    and variant_origin to SULF1 and SLCO5A1 genetic entries; added presence and results to diagnosis;
    and added MONDO disease_term bindings and distinguishing_features to differential_diagnoses.

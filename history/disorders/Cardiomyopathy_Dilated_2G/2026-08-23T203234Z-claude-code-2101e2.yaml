  summary: 'Create: Dilated Cardiomyopathy 2G (LMOD2)'
  details: |
    Curated CMD2G (LMOD2, MONDO:0030887; ClinGen Definitive, autosomal recessive). A geometric lesion unique in the series: leiomodin-2 nucleates and elongates actin at the thin-filament pointed end and sets its length, so biallelic loss builds the filament to the wrong specification and degrades thin-thick overlap while motor, calcium regulation, Z-disc scaffold and quality control remain intact. Also the most severe member - biallelic loss means the neonatal heart never has functional leiomodin-2, so presentation is at birth and frequently lethal, in contrast to the adult-onset dominant members. Evidence from patient-derived iPSC-cardiomyocytes plus a matched mouse model. Evidence-scope caveat recorded (single study of the first reported allele p.Trp398Ter; SRF-signalling arm curated as observed accompaniment not established causal step). Stub deleted; added to grouping. 12 snippets verified.

  summary: Review LMOD2 cardiomyopathy onset, allele-specific mechanisms, clinical
    care, and model evidence
  details: |
    Reviewed the entry against cached full texts of the five clinical family reports, the 2024 nonsense-mediated decay and patient-derived cardiomyocyte studies, the 2015 knockout/rescue experiments, and the 2026 pointed-end polymerization study. No matching CMD2G deep-research artifact exists. Corrected homozygous-only and neonatal-only descriptions, unsupported severity comparisons and phenotype frequencies, and invariant protein-null claims. Captured compound heterozygosity, late-infantile onset, allele-dependent transcript/protein effects, calcium dysregulation, and an explicitly emerging actin-MRTFB-SRF hypothesis. Added clinical imaging, segregation, family assessment, arrhythmias, regurgitation, histological variability, transplant and mechanical support; distinguished general GeneReviews/ISHLT pediatric guidance from LMOD2-specific observations. Recorded experimental gene replacement and steric-blocking oligonucleotides as preclinical, with model-specific evidence and limitations. Verified the mixed-species GSE271871 RNA-sequencing series through GEO and the dataset fetcher. Regenerated the exact March 2026 ClinGen CMD2G assertion and its source-manifest pin. Considered adult heterozygous association evidence without redefining recessive CMD2G as a high-penetrance dominant disease. Excluded unrelated ELMOD3/FLII cache hits and did not infer core manifestations from intercurrent infections, intestinal malrotation, or untested relatives. Schema, ontology, and reference validation passed with 94/94 snippets and 110 titles; entity links, causal targets, model scale, ClinGen consistency, and dataset verification passed.

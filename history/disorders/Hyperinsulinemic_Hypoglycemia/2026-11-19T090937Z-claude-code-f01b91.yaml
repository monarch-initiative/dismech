  details: |
    Reviewed the Jev evidence-claim assessments (11 MISMATCH, 146 PARTIAL at claim level). Repaired: Exogenous insulin differential, replaced a case-report sentence about an endogenous patient with the source's statement that detectable C-peptide confirms endogenous disease, and added the 2023 international guideline (PMID:37454648) rows listing drug-induced HI from insulin and sulfonylureas and the C-peptide / sulfonylurea / toxicology screen of the critical sample. Idiopathic ketotic hypoglycemia differential, rewrote the description (toddlers and intercurrent illness had no source) to what the Norway nationwide cohort (PMID:38963811) supports, and added two quotes from it. Insulinoma differential, added three guideline quotes covering the two-year age threshold, solitary tumours and MEN1. Glucose-disposal to brain-substrate-deprivation edge, added the review's sentence on loss of both glucose and ketone bodies. Human beta-cell ODE readout, completed the truncated gKATP snippet so it states the sodium-channel-block condition. Retained: the remaining PMID:24391482 computational-model items, which accurately describe a normal-donor cell model whose limitations are already recorded; the sirolimus REFUTE item, which correctly refutes routine use; definition and treatment PARTIAL items where the snippet supports the claim at a less detailed level. Validated with just validate, count-verified-snippets (all verified), check-snippet-grading and validate-disorders.

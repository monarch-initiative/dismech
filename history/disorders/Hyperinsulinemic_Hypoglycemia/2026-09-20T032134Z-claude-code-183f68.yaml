  details: |
    Genetics pass for issue #12199 (epic #12189, d2g wiring-010).

    This entry was already the strongest of the seven: 9/9 mechanism-relevant genes
    wired, each to the node it acts at (K-ATP channel, glutamate dehydrogenase
    amplifier, glucose set-point, alternative secretagogue import, transcription
    factor programme, focal 11p15 lesion), and 17/17 phenotypes causally connected.
    MONDO's single recorded gene for the gap list, GLUD1 for MONDO:0011717, was
    already curated.

    Changes:
    - Added `genes:` to the five `has_subtypes` rows whose own description makes a
      gene-defining claim: Diffuse HI (ABCC8, KCNJ11), Focal HI (ABCC8, KCNJ11),
      Atypical HI (ABCC8, GCK, HK1), HI/HA Syndrome (GLUD1), Diazoxide-Unresponsive
      HI (ABCC8, KCNJ11).
    - Deliberately did NOT add `genes:` to Diazoxide-Responsive HI, Perinatal
      Stress-Induced HI, Syndromic HI or Adult-Onset HI. The first is a
      pharmacological stratum defined by an intact channel rather than by a gene set
      (its description lists the non-K-ATP etiologies including UCP2, which this
      entry itself grades DISPUTED); the other three are not gene-defined in this
      entry's model.
    - Set `genetic[].subtype: HI/HA Syndrome` on GLUD1, the one gene here whose
      subtype assignment is single-valued. The K-ATP genes span several subtype rows
      and `Genetic.subtype` is scalar, so they were left unset rather than forced.
    - Added `case_fractions` for six genes from the Norwegian nationwide cohort
      (PMID:38963811, 77 CHI probands): ABCC8 52% (percentage as reported by the
      authors), GLUD1 2/77, KCNJ11 1/77, HADH 1/77, HNF4A 1/77, HK1 1/77. Where the
      authors report a count rather than a percentage the notes say so and give the
      arithmetic, and where the testing strategy makes the share a lower bound (the
      pre-2019 Sanger arm screened non-channel genes only as phenotype indicated) the
      notes say that too. The HK1 variant was classified VUS+ by the authors, which
      the notes record.

    No new references were needed; all snippets come from records already cached.

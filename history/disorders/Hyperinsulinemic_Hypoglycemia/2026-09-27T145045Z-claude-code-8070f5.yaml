  details: |
    Merged origin/main into the PR branch. Two problems, both created by main moving while this branch sat open, neither a defect in the curation. First, the only merge conflict was app/models/data.js, the generated computational-models browser index. It is resolved by taking main's version, so this PR no longer modifies that file at all. That is now the documented rule: the file is regenerated wholesale by just gen-models-data and committed by the generate-pages workflow, and committing it from a curation PR makes any two concurrent model PRs conflict on it and nothing else. The comment in tests/test_models_export.py names this PR as one of the nine that deadlocked that way, and the assertion tying the committed file to the committed KB was deliberately removed as the fix, so dropping the file is safe; tests/test_models_export.py passes 8/8 without it. Second, linkml-validate rejected supports: PARTIAL on the PMID:24391482 evidence item under the Human Beta-Cell Electrophysiology and Calcium ODE, on its MEASURES link to Dysregulated Beta-Cell Insulin Secretion. That value was legal when this branch was written and was retired from the schema afterwards, with main migrated but this in-flight branch not. Regraded to supports: SUPPORT with directness: INDIRECT, which is what the retirement guidance prescribes for a claim reached through an inference step: the model reports voltage and calcium, the node is insulin secretion, and the item's own explanation already said it stops short of an explicit insulin-output model. The quoted snippet, evidence_source: COMPUTATIONAL, the link's MEASURES relationship and its LOW fidelity are unchanged. Earlier history records for this entry describe evidence they graded PARTIAL at the time; they are append-only and were left as written. Revalidated: just validate-disorders passes with 206/206 snippets verified, and check-enum-values, check-duplicate-keys, check-entity-refs, check-causal-targets, check-case-collisions, check-term-cache-integrity and check-cache-order all pass.

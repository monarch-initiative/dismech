  summary: Bind GLUD1 and HADH activities on GDH node; add variant_origin
  details: |
    GDH amplifier node named GLUD1 and HADH but carried only a regulation-of-insulin-secretion BP. Added GO:0004353 L-glutamate dehydrogenase [NAD(P)+] activity (INCREASED; PMID:21130127 GTP-insensitive activating GLUD1 variants) and GO:0004857 enzyme inhibitor activity (DECREASED; PMID:20670938 SCHAD inhibition of GDH). Set variant_origin GERMLINE on HNF4A, HNF1A and SLC16A1 records. Left UCP2 (relationship DISPUTED) without variant_origin: the cited review does not establish the reported variants as pathogenic, and states the UCP2 role needs further investigation. Reworded the UCP2 evidence explanation that argued for the retired PARTIAL grade.

  summary: 'Gene-family review: GCK, HNF1A, HNF4A, ABCC8, KCNJ11, GLUD1, HADH, SLC16A1,
    HK1, FOXA2'
  details: |
    None of the genetic records carried an inheritance block; each causal record now binds its HP mode (GCK, HNF4A, HNF1A, GLUD1, SLC16A1, HK1 autosomal dominant; ABCC8 and KCNJ11 recessive and dominant; HADH recessive), with evidence (PMID:37725835, PMID:35089870, PMID:25733449, PMID:21130127, PMID:17701893, PMID:40033430). The K-ATP loss-of-function node gains SUR1's potassium channel regulator activity beside Kir6.2's channel activity; the shared GCK/HK1 set-point node gains hexokinase activity (INCREASED, ectopic HK1) beside glucokinase activity. HNF1A was retyped CAUSATIVE to UNKNOWN: five carriers in the largest multicentre cohort and no ClinGen classification (PMID:35089870). HK1 gained the discovery and replication evidence (PMID:36333503, PMID:40033430). FOXA2, previously absent, is added under Syndromic HI as an UNKNOWN record (few patients; ClinGen rates it Moderate only against combined pituitary hormone deficiency) with a node binding FOXA2 transcription activator activity as DECREASED (PMID:33999151, PMID:38605124). UCP2 was left DISPUTED and without a molecular function, as its node explains.

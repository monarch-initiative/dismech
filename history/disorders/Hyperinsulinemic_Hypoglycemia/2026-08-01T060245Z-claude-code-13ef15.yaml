  summary: 'Create: Hyperinsulinemic_Hypoglycemia'
  details: |
    Created the umbrella dismech entry for hyperinsulinemic hypoglycemia MONDO:0005803, issue #7558. EXTEND-VS-NEW DECISION: kb/disorders/Congenital_Isolated_Hyperinsulinism.yaml MONDO:0019010 Orphanet:657 already existed and covers the nonsyndromic congenital genetic forms with per-gene subtypes. MONDO:0005803 is a distinct, broader MONDO disease_grouping entity xrefs HP:0000825 OMIMPS:256450 Orphanet:443095 that additionally spans perinatal-stress-induced/transient, maternal-diabetes-associated, syndromic and acquired adult disease. A new entry was therefore created and deliberately scoped to the etiology-agnostic final common pathway plus the etiologies and clinical artifacts the narrower entry excludes; a top-level notes block records the scope split so the two entries stay complementary rather than duplicative. DEEP RESEARCH: falcon Edison via just research-disorder falcon Hyperinsulinemic_Hypoglycemia, 604s, 26 citations, 1 artifact. Falcon supplied DOIs rather than PMIDs; all were resolved via the PMC ID Converter and fetched with just fetch-reference. NEC preflight passed: the OAK MONDO:0005803 definition names kcnj11/abcc8, matching the report dominant genes. GENEREVIEWS: PMID:20301549 Nonsyndromic Genetic Hyperinsulinism Overview fetched, cached and tagged; the full NBK1375 chapter was mined for Clinical Characteristics, the differential-diagnosis list, and the Agents/Circumstances to Avoid section on prolonged fasting, which drove the differential_diagnoses block and the Prolonged fasting environmental entry, recorded in notes as provenance because the chapter body is not in the cached abstract. MODELING: 9 pathophysiology nodes, each with biological_scale and role, wiring four etiologic triggers -- K-ATP loss of function, fuel-sensing/amplifier defects, focal lesion formation by paternal K-ATP variant plus somatic maternal 11p15 LOH, and perinatal-stress threshold reset -- into a convergent Dysregulated Beta-Cell Insulin Secretion node, then splitting into insulin-driven glucose disposal and suppression of lipolysis and ketogenesis, which converge on an explicit Dual Glucose and Ketone Substrate Deprivation of the Brain node and terminal Neuroglycopenic Brain Injury. 8 has_subtypes model the diffuse/focal/atypical histological split, diazoxide responsive versus unresponsive, perinatal-stress/transient, syndromic and acquired adult forms. Also added structured biochemical critical-sample analytes with reference_ranges and interpretation bands, a DIAGNOSTIC_CRITERIA definition, histopathology of the focal/diffuse split, 9 genetic entries, 7 treatments with target_mechanisms, 4 environmental exposures, 3 diagnosis entries, 7 structured differential_diagnoses with 6 bound MONDO disease_term values, and 2 clinical trials. VALIDATION: just validate PASS; just validate-terms PASS; just validate-references PASS with 143/143 snippets verified; just compliance 95.5 percent global and 95.8 percent weighted; just compliance-connectivity shows all phenotypes causally connected and all causal genes wired. SELF-REVIEW: a red-team pass against .claude/skills/dismech-pr-review before opening the PR produced fixes applied in the same commit -- corrected the focal-lesion second hit from a deletion to loss of heterozygosity with segmental paternal isodisomy (the mechanism the entry's own IGF2 claim requires); added an HI/HA Syndrome subtype bound to MONDO:0011717 and repointed the hyperammonemia phenotype and biochemical marker to it instead of the incorrect Diazoxide-Responsive HI key; removed an unsupportable FREQUENT band on global developmental delay derived from a composite neurologic-sequelae figure; renamed Acquired Adult HI to Adult-Onset HI because a germline GCK duplication is not acquired; bound subtype_term MONDO identifiers on the focal, diffuse and diazoxide-unresponsive subtypes; deleted two GeneReviews evidence items that quoted the chapter's purpose statement and supported nothing, moving the attribution into notes; swapped the HK1 evidence for PMID:38963811 which states the variant is noncoding, matching the de-silencing claim; downgraded overstated 18F-DOPA accuracy and oral beta-hydroxybutyrate items to PARTIAL; added therapeutic_agent to glucagon and intravenous dextrose and moved dextrose off the cancer-scoped NCIT Supportive Care term; removed a self-referential MONDO:0005803 disease_term from the exogenous-insulin differential; dropped a misleading epithelial-channelopathy classification; and corrected the GSD I glucagon-response rationale and the free-fatty-acid interpretation band. OPEN FOR HUMAN ADJUDICATION: both MONDO:0005803 and MONDO:0019010 are MONDO disease_grouping terms, so whether this pair is better expressed as a kb/groupings/ Grouping plus a shared kb/modules/ module is a lump-versus-split question raised in the PR body rather than settled here.

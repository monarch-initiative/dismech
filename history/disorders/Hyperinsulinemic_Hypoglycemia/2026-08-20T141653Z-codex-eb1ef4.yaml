  summary: Add computational models for hyperinsulinemic hypoglycemia
  details: |
    Curated three complementary kinetic models: a pinned ABCC8 loss-of-function glucose-insulin progression artifact, a fitted pediatric KATP-HI insulin/C-peptide kinetic model, and a reusable human beta-cell electrophysiology model. Linked each model only to mechanisms it explicitly perturbs, measures, or partially recapitulates. Recorded disease-validation boundaries, code availability, licenses, immutable artifact identifiers, static smoke checks, and limitations. Evidence caches were generated with the repository fetch workflow and model claims were checked against primary full text. Review follow-up added the exendin-(9-39) treatment and its completed NCT00897676 crossover trial so clinical efficacy evidence is represented outside the computational-model notes.

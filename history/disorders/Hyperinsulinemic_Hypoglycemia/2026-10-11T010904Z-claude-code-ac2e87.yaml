  summary: Split SLC16A1/UCP2 node; bind HNF4A/HNF1A and SLC16A1 molecular functions;
    UCP2 germline and dispute evidence
  details: |
    Split the shared 'Alternative Secretagogue Import and Loss of Mitochondrial Uncoupling' node into 'Ectopic Beta-Cell MCT1 Monocarboxylate Import' (SLC16A1; GO:0015650 lactate:proton symporter activity INCREASED, described as ectopic beta-cell expression) and 'Impaired UCP2 Mitochondrial Carrier Function' (UCP2). No molecular-function term is bound for UCP2: its causal role is disputed, and no study shows which activity (proton leak versus C4-dicarboxylate/phosphate antiport, PMID:24395786) the hyperinsulinism variants reduce. The node and genetic-record prose no longer state UCP2 proton leak as fact. Added PMID:19065272 (primary UCP2 report) as evidence, set UCP2 variant_origin GERMLINE from its parentally inherited variants, and added a REFUTE item for the 206-patient negative series. Bound GO:0001228 DNA-binding transcription activator activity, RNA polymerase II-specific, DECREASED, on the HNF4A/HNF1A transcription-factor node, consistent with the ai-gene-review core functions of both genes. Validated with just validate, validate-terms and count-verified-snippets.

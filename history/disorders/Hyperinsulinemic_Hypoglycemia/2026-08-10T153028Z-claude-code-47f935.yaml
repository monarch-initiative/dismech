  summary: Link the perinatal stresses and fasting into the pathograph
  details: |
    Backfill for issue #8085. Three of the four exposures are named in the text of the perinatal-stress node itself, which holds the acquired form of the disorder in which there is no germline lesion, so maternal diabetes, perinatal asphyxia with growth restriction, and intrapartum maternal dextrose all point there at TRIGGERS with DIRECT and are graded identically; all three appear in the same risk-factor sentence and act by the same route of driving fetal insulin secretion before delivery. Prolonged fasting is deliberately graded differently, as the only EXACERBATES link in this entry, because fasting does not cause the secretory defect; it converts a defect that is always present into clinical harm. It targets the dual glucose and ketone substrate deprivation node with INDIRECT_KNOWN_INTERMEDIATES, the intervening step being the suppression of both hepatic glucose output and ketogenesis that this entry models explicitly. Its evidence is graded PARTIAL on two counts stated in the link description: it runs in the opposite direction, reporting that frequent feeding reduces episodes rather than that fasting provokes them, and it stops at hypoglycaemic episodes rather than reaching the brain substrate deprivation at the node. The GeneReviews prolonged-fasting-avoidance wording is recorded in the exposure's notes as provenance rather than quoted, because it is in the chapter body and not the cached abstract; that pre-existing arrangement was left as it is. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 168 of 168 verified.

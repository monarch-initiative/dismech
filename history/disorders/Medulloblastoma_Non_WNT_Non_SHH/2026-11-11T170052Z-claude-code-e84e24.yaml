  summary: 'Review round 1: wire the pathograph, add phenotypes, staging, drivers
    and surgery'
  details: |
    Addresses every blocking item of the first review. The pathograph was fragmented: the three driver nodes had no edges and nothing reached the lesion. They now run into Failure of Rhombic Lip Differentiation, the arrest and the perivascular niche run into a new Proliferating Posterior Fossa Mass node, and that carries a chain through Fourth Ventricular Outflow Obstruction to hydrocephalus and the raised-pressure syndrome, with a separate Metastatic Dissemination at Diagnosis branch that conforms_to invasion_and_metastasis. Phenotype causal connectivity went from 0/1 to 8/8. Seven phenotypes were added, each with a cached quotable source; quotes taken from a paper's introduction carry quote_role BACKGROUND rather than being graded as that paper's own result. Three phenotypes the review asked for are not added because no cached source states them: macrocephaly in infants, back pain from spinal drop metastases, and the group-specific metastatic frequencies. Five genetic records were added, all somatic, and the CBFA2T3 claim-evidence mismatch was fixed by citing the convergence sentence that names CBFA2T3 rather than the CBFA2T2 sentence that was there. Surgery was added as the first step of standard therapy, linked to the obstruction node because restoring CSF flow is one of its two stated goals. Modified Chang staging and a risk-assignment progression phase were added. OTX2 and CDK6 have no genetic records: Northcott's cached text carries no sentence about either. Genetic has no functional_impact_category slot, so the neomorphic call on KBTBD4 is recorded in that record's notes. The KBTBD4 node now binds GO:1990756, which the source states directly; the GFI1/GFI1B and PRDM6/SNCAIP nodes are grandfathered in the gene-activity baseline because their sources decline to assign a function and the PRDM6 node carries two genes sharing none.

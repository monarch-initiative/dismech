  summary: 'Create: Medulloblastoma, Non-WNT/Non-SHH'
  details: |
    New entry on MONDO:0850198 with Group 3 (MONDO:0956966) and Group 4 (MONDO:0956967) as subtype rows rather than separate entries, which is the lump decision the entry's mechanistic_hypotheses group records the evidence for: transcriptional profiling places tumours as intermediates on a bipolar continuum, and methylation subgrouping recovers eight subtypes that cut across the Group 3 and Group 4 line. Built from a fresh claude_code research report run with --no-cache; the report states explicitly that none of its own candidate quotes is a certified exact quote, so all 26 snippets were re-derived from cached references and verified. The pathograph runs from the human rhombic lip progenitor pool through the transforming event in a Protogenin-positive rhombic lip stem cell to the differentiation failure, the OTX2-maintained block, the Group 3 perivascular niche, and three structural or neomorphic driver nodes. The somatic genetic_context sits on the transformation node alone, so the derived cell of origin is the rhombic lip progenitor rather than MYC amplification, which the literature places as a later progression event. Content fence (b) excludes the chromosome 1p36, 11q and 17q changes, chromothripsis and isochromosome 17q, which removes two published whole-chromosomal-aberration risk schemes; that omission is recorded in the entry's review_notes. Term bindings were read from the local MONDO, HGNC and OLS CL sources in the step they were written; just validate-terms initially could not run because EBI OLS was unreachable and was re-run to completion rather than treated as passing.

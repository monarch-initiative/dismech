  summary: 'Create: TMEM165-Congenital_Disorder_of_Glycosylation'
  details: |
    New entry for TMEM165-CDG (MONDO:0013870). The required deep-research input was the Perplexity report (research/TMEM165-Congenital_Disorder_of_Glycosylation-deep-research-perplexity.md); just preflight-dr returned PASS (TMEM165 mentioned 278 times, OMIM 614727 agrees). The report's 15 cited references all resolved, but it was used as a lead only: every claim in the entry was re-sourced from primary papers found through PubMed (TMEM165[tiab], 73 hits) and quoted from the cached text.

    Report content not carried over: (1) cardiomyopathy as a TMEM165-CDG phenotype - the cited 2025 review (PMID:41583011) discusses cardiomyopathy only in the context of other CDGs and does not report it in a TMEM165 patient, so only the structural heart defects from the case reports (VSD, PDA, PFO) are curated; (2) a constant O-glycosylation defect - the founding paper (PMID:22683087) found normal serum O-glycans and apoC-III, so the O-glycan node and the apoC-III marker carry a REFUTE item alongside the supporting ones; (3) the report's HP/GO/NCIT CURIEs, of which 3 HP terms were unresolved and 10 NCIT/GO terms named other concepts - all bindings in the entry were looked up afresh with runoak (ols:) and the HGNC REST API; (4) the report's ClinVar/MalaCards variant list and Orphanet prevalence, which have no cached, quotable source here (ORPHA:314667 is not pre-cached). The DOI-keyed caches written by the research run are committed but not cited.

    Chain: biallelic TMEM165 loss -> loss of Golgi Ca2+/Mn2+-proton antiport -> Golgi Mn2+ insufficiency (plus a PROVISIONAL Ca2+/pH branch) -> impaired Mn2+-dependent glycosyltransferases -> N-glycan hypogalactosylation, O-glycan truncation, glycolipid and glycosaminoglycan defects; the GAG arm continues through TGF-beta/BMP dysregulation and premature chondrocyte hypertrophy to disordered endochondral ossification and the skeletal phenotypes, and a HYPOTHETICAL multisystem hub carries the non-skeletal phenotypes. All 35 phenotypes are causally connected.

    Validation: just validate, validate-terms, count-verified-snippets (124/124), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-folded-hyphens and validate-disorders all passed. check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles could not run in their just form (--against-ref origin/main extracts a copy of kb/ and the disk was full); the same scripts run against the committed baselines passed. check-genereviews reports NO_CHAPTER for the name and all synonyms.

  summary: 'Review round 1: missense genotype and skeletal phenotype'
  details: |
    Addressed the automated review on PR 13111. The founding report (PMID:22683087) summarises its missense-allele patients as lacking the skeletal phenotype, but its own case descriptions distinguish them: case 4 (p.Arg126His homozygous) had no clear skeletal anomalies, case 5 (p.Arg126Cys/p.Gly304Arg) had osteoporosis, vertebral and rib dysplasia and kyphoscoliosis. The description, genetic notes, SEMD phenotype description and genotype-skeletal knowledge-gap rationale now state this, and case 5 was added as a second genotype on Osteoporosis. The nephrotic-syndrome description no longer implies the older sibling's cause of death, which PMID:26238249 does not give. Hypotonia gained a description and a REFUTE item for the p.Glu108Gly neonate's hypertonia with opisthotonic posture. Re-validated: just validate passed, 126/126 snippets verified, check-snippet-grading and check-folded-hyphens clean.

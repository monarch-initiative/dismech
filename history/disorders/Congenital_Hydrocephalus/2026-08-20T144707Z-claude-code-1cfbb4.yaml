  summary: 'Create: Congenital Hydrocephalus (MONDO:0016349)'
  details: |
    De-novo curation of congenital hydrocephalus (MONDO:0016349) for issue #8958 (CURATE_ROOT_WITH_SUBTYPES).

    Structure: eight has_subtypes covering the axis named in the issue - HSAS (L1CAM, MONDO:0010611), HYC1 (CCDC88C, MONDO:0009360), HYC2 (MPDZ, MONDO:0014085), HYC3 (WDR81, MONDO:0054794), Chiari II-associated (myelomeningocele), Dandy-Walker-associated (MONDO:0017110), post-haemorrhagic and post-infectious. Twelve pathophysiology nodes converge on a shared central effector node (Progressive Ventricular Dilatation and Raised Intracranial Pressure).

    Two competing mechanistic_hypotheses are curated rather than blended: csf_dynamics_model (CANONICAL, the International Hydrocephalus Working Group definition) and neural_stem_cell_dysgenesis_model (EMERGING, Furey 2018 / Jin 2020). They predict different things about what CSF diversion can achieve, so causal edges opt into one group or the other and an OPEN_QUESTION discussion records the unresolved case-assignment problem.

    Module conformance is declared at three nodes: ciliopathy_dysfunction#Planar Cell Polarity and Non-Canonical Wnt Disruption, ciliopathy_dysfunction#Motile Cilia Beat Dysfunction, and glymphatic_dysfunction#Impaired Perivascular CSF-ISF Exchange and Solute Clearance. Both cilia links are bounded by a HUMAN_MODEL_MISMATCH discussion anchored on PMID:36341771 (human motile ciliopathies infrequently cause hydrocephalus; human ventriculomegaly begins before ependymal cilia mature). The glymphatic link is bounded by a KNOWLEDGE_GAP discussion quoting the source's own statement that whether perivascular/lymphatic efflux disturbance participates in human hydrocephalus is not yet known; the link asserts the anatomical route, not settled causal mechanism, and inherits the module's unresolved convective-versus-diffusive controversy.

    Deep research: falcon (research/Congenital_Hydrocephalus-deep-research-falcon.md; 11/11 references resolved, confabulation_rate 0.0, no unresolved or off-topic references). just preflight-dr returned SKIP because MONDO records no causal gene (RO:0004003) for this umbrella term, so the manual CLAUDE.md section 2b fallback was run: runoak -i sqlite:obo:mondo info MONDO:0016349 -O obo confirmed the definition, OMIMPS:236600, Orphanet:2185 and NCIT:C98876 with no rival eponym or synonym pointing elsewhere, and the report's top gene mentions (L1CAM=16, SMARCC1=12, MPDZ=9, CCDC88C=9, TRIM71=9) match the canonical congenital hydrocephalus gene set. No NEC detected. The falcon report cited DOIs rather than PMIDs and was used as leads only; every evidence item in the entry was independently anchored on a PMID fetched with just fetch-reference and read against the cached text.

    Curation discipline notes: one initially drafted evidence item quoted the CRB2 paper's title and was replaced with two abstract sentences stating findings. A PARTIAL evidence item was deliberately retained on the planar-polarity node recording that apicobasal polarity and junctional molecules were NORMAL in the CRB2 fetal cases, so the node is not read as asserting generalized loss of ependymal polarity. WDR81 carries no evidence block (CLAUDE.md SOP option C) because no primary gene-discovery snippet was verified.


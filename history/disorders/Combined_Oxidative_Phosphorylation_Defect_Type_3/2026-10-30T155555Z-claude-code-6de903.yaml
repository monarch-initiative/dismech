  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 3 (TSFM)'
  details: |
    New entry for MONDO:0012512 (OMIM:610505, ORPHA:168566), caused by biallelic TSFM (hgnc:12367, checked against the HGNC REST record) variants. entry_type DISEASE; no subtypes, because the same homozygous p.Arg333Trp allele gives cardiac, neurological and hepatic presentations in different families. Pathophysiology is a chain from EF-Ts loss of function through a destabilised EF-Ts/EF-Tu pool and impaired mitochondrial translational elongation to a combined respiratory chain deficiency, cellular energy failure, and cardiac, neural and hepatic branches; four nodes conform to primary_oxphos_deficiency. Phenotype frequencies come from the pooled literature summary in PMID:35071363. One openscientist report was used (research/Combined_Oxidative_Phosphorylation_Defect_Type_3-deep-research-openscientist.md): 11/11 references resolved, 1/1 quotes valid, 0 off topic. Its term_validation needs_review flag comes from nine HP terms whose frequency column was parsed as a label, which is harmless. just preflight-dr returned WARN because the report gives HGNC:11701 (TDGF1) beside TSFM; no gene identifier was taken from the report. All cited references were fetched with just fetch-reference and every snippet verified (just validate, just count-verified-snippets). The Traschuetz 2019 cannabinoid report (PMID:30297209) and the Finsterer 2019 comment (PMID:31377874) have no abstract in the cache and are not cited; the cannabinoid response is carried only via the later report that cites it. No ClinGen assertion exists for this exact MONDO term (TSFM is Definitive for mitochondrial disease MONDO:0044970 and Moderate for Leigh syndrome), so no gene_disease_validity is recorded. No animal model was found.

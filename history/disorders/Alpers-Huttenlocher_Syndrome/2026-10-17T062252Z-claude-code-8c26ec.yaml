  summary: 'Bind LOINC: blood and CSF lactate, CSF protein'
  details: |
    Split the single 'Blood and cerebrospinal fluid lactate' biochemical marker into two markers, Blood Lactate (loinc_term LOINC:32693-4, Lactate [Moles/volume] in Blood) and Cerebrospinal Fluid Lactate (loinc_term LOINC:2520-5, Lactate [Moles/volume] in Cerebral spinal fluid), since the existing evidence (PMID:28471437) already reported the two specimens' frequencies separately (blood lactate elevated in 12/20 patients at presentation, CSF lactate elevated in 2/5 patients tested) and a single loinc_term slot cannot carry both specimen-specific findings. The cited paper is a disease-specific cohort of early-onset POLG-related disease (the Alpers-Huttenlocher spectrum), reporting CSF lactate as the entry's own presentation-time laboratory finding with a disease-specific frequency, not as a generic unattributed mitochondrial-disease statement, so the CSF lactate code is bound. Added loinc_term LOINC:2880-3 (Protein [Mass/volume] in Cerebral spinal fluid) to the existing 'Elevated cerebrospinal fluid protein' marker. LOINC:2520-5 was newly seeded via just loinc-seed-cache; the other three codes were already cached. just validate-disorders passed with 0 issues.

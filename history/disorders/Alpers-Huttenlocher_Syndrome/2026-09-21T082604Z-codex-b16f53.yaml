  summary: Review Alpers clinical scope, atomic POLG mechanisms, models and current
    treatment evidence
  details: |
    Comprehensive review of the full original Alpers entry, matching falcon deep-research narrative, all original references, and actual cached full scientific bodies. Scope now distinguishes molecularly defined recessive POLG Alpers from the broader early-onset POLG spectrum and historical clinically defined cases. Complete GeneReviews chapter was read through clinical course, diagnosis, differential diagnosis, management, surveillance, counseling and molecular mechanisms. Full original clinical and pathology sources were checked against their Methods, Results, Discussion, tables and captions; PMID30021052 was regenerated from abstract-only to genuine full XML. The 2017 paper's correction was checked and concerns case identifiers/citations, not phenotype results.

    Replaced bundled mechanisms with 16 atomic nodes. Allele-specific catalytic impairment, accessory-subunit assembly, protection from LONP1 degradation, protein abundance, mtDNA maintenance, respiratory deficiency, ATP availability, oxidative stress, neuronal loss, proposed inhibitory-network dysfunction, seizures and hepatic injury are separate claims. Human postmortem protein staining is not a direct electron-flux assay, ATP luminescence measures cellular content, and organoid markers do not establish lineage tracing. The A449T/A467T proteolysis mechanism depends on impaired accessory-subunit protection rather than faster intrinsic degradation of free mutant protein. The mouse retains normal measured OXPHOS/lifespan and resists tested valproate exposure despite mild mtDNA defects and slower chemical-injury recovery. One mouse and six experimental systems include measured readouts and species, lineage, allele and rescue limitations.

    Expanded the phenotype set to 17, with clinical denominators taken only from the explicit 19-person Alpers subgroup of the 2017 study. Liver dysfunction is not converted to a liver-failure frequency; pooled mixed-POLG growth, lactate, survival and status-epilepticus estimates are not relabeled Alpers-specific. Developmental delay is not automatically global delay, and normal early MRI, muscle histology, biochemical testing or mtDNA results do not exclude disease. Diagnosis, progression, biochemical abnormalities, histopathology, inheritance, family counseling and overlapping differential diagnoses were revised from the complete chapter and primary clinical cohorts.

    Expanded care to 21 records, preserving the valproate/divalproex contraindication, rapid evaluation when POLG disease is suspected, individualized antiseizure/status treatment, monitoring, nutrition, rehabilitation, sensory/respiratory support and palliative care. The 2024 expert consensus distinguishes not-contraindicated advice from proven efficacy. The 2010 common-polymorphism association and 2018 small null monotherapy comparison do not relax the contraindication in biallelic disease. Muscle-cell and yeast valproate experiments do not establish human hepatocyte regeneration or HDAC causality. Inherited discussion proposals that implied otherwise or proposed drug exposure in affected children were replaced with qualified mechanistic gaps.

    Nicotinamide riboside remains a one-donor organoid intervention. Full 2024 and 2026 deoxynucleoside trial papers were read completely: six Alpers patients among the initial ten, later expanded to 25 mixed-POLG participants, are overlapping reports from the same program. Unblinded exploratory outcomes, cointerventions, changing denominators, biomarker censoring, deaths/withdrawals and survivor selection preclude proven Alpers-specific efficacy or survival benefit. Pediatric quality of life alone was nonsignificant in the later report. Full posted vatiquinone registry results show a nonsignificant randomized primary motor-seizure endpoint; later open-label safety results do not prove comparative safety or efficacy. Four live trial statuses were checked on 2026-09-21, including a completed registry record whose own limitations describe early termination. No outcome is inferred from registration alone.

    Added full generated sources PMID33956154,38385069,38576261,38822839,38860231,38975049,42296640 and regenerated PMID39091670; complete scientific bodies were consumed locally or by named independent peer source audits. PMID16024923 and30255931 remain abstract-supported, without invented methods. The 2026 metformin paper was screened and excluded because its donor represents a different POLG phenotype. GEO GSE207007 was verified through its generated per-record cache; its broader POLG collection is not treated as an Alpers-only cohort. All caches were produced by just fetch-reference; none was manually edited, and the frozen shared accession file was never accessed.

    Independent peers audited the complete 2010 valproate and 2021 assembly/proteolysis studies; a separate final graph/model pass confirmed scope and identified a day-four necrosis snippet that was repaired using the positive result. Authoritative validate-disorders passed schema, ontology terms and 197/197 snippets. Dataset verification, entity/causal links, GeneReviews baseline and scoped integrity checks passed; whole-KB guards and history validation were completed before publication. Node-class resolution was inspected without inventing missing annotations. Research completeness dimensions were checked; remaining experimental-to-human and temporal causal gaps are explicit.

  summary: 'Create: Alpers-Huttenlocher Syndrome'
  details: |
    Created the Alpers-Huttenlocher entry as a nine-node pathograph running from biallelic loss of DNA polymerase gamma function through failure of mitochondrial DNA replication, tissue mtDNA depletion and respiratory chain deficiency, to selective interneuron and pyramidal neuron loss in occipital cortex, intractable focal epilepsy with epilepsia partialis continua, developmental regression, hepatocellular failure, and valproate-precipitated fulminant hepatic failure. The valproate arm is deliberately modelled as pathophysiology rather than as an adverse effect, because it is a causal path the disease routinely takes through ordinary competent care. Two nodes conform to epilepsy_excitation_inhibition_imbalance, at the excitation-inhibition node and the recurrent-seizure node; the first was added on the strength of post-mortem evidence that the respiratory chain deficiency falls preferentially on inhibitory GABAergic interneurons, after the first draft had explicitly declined that conformance. Three discussions: the refuted mechanism of valproate hepatotoxicity, the POLG testing threshold, and the narrowed occipital selectivity gap. Deep research with the falcon provider changed the entry materially by surfacing the neuropathology paper the first draft had missed. All snippets verified against their own fetched caches.

  summary: 'Review: connect nine orphans; one readout; one recorded non-connection
    (IUIS Table 5)'
  details: |
    Eleven of fifteen phenotypes had no incoming edge. Nine are wired, one is a readout, and one is deliberately left unconnected.

    Elevated serum GM-CSF is curated as a reports_on readout of the receptor-dysfunction node, not a consequence of it: the ligand accumulates in front of a blocked receptor, which makes it a measurement of the block. It is also the finding that separates hereditary PAP from the autoimmune form, where GM-CSF is neutralised by autoantibody instead.

    Autoimmune antibody positivity is left unconnected. Orphanet reports it as occasional, which the evidence supports, but no node in this entry reaches B-cell tolerance by any cited route. The note keeps that distinct from the differential point the description makes - that the anti-GM-CSF autoantibodies DEFINING autoimmune PAP are absent here. General autoantibodies occasionally present and the specific pathogenic autoantibody absent are two different claims, and this entry carries both. Checked before assuming a contradiction.

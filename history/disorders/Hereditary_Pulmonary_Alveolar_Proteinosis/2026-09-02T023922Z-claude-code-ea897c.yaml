  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Created a classifications block; the entry previously had none. Added harrisons_chapter (RESPIRATORY, GENETICS_ENVIRONMENT_DISEASE) and iuis_category: phagocyte defect.

    IUIS 2022 Table 5, section 4 (Other Non-Lymphoid Defects). This entry covers BOTH pulmonary alveolar proteinosis rows: CSF2RA (XL, biallelic mutations in a pseudoautosomal gene, MIM 300770, cache lines 3102-3109) and CSF2RB (AR, MIM 614370, lines 3110-3111). Affected cells alveolar macrophages, affected function GM-CSF signaling. The notes make the point that the failing phagocyte here is the tissue macrophage rather than the neutrophil, which is why a lung disease sits in the phagocyte table.

    Source typo recorded: line 3111 prints the gene as 'CSFR2B'. The gene is CSF2RB (hgnc:2436), which is what this entry binds. The transposition is preserved inside the quoted snippet because the quote belongs to the source, and the notes say explicitly that it must not be propagated into any gene_term or prose.

    Disambiguation recorded: autoimmune pulmonary alveolar proteinosis (anti-GM-CSF autoantibody) is a Table 10 phenocopy, not a Table 5 row, and is curated separately. This matters because both PAP entries bind CSF2RA and CSF2RB, so a gene-based match hits both - they have to be split on mechanism.

    Three evidence items cite PMID:35748970: the CSF2RA row, the CSF2RB row, and the shared affected-cells/function/features cells.


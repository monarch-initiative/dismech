  summary: 'Genetics pass: add SMDP4/SMDP5 subtype rows, bind receptor genes, split
    surfactant-production arm into differentials'
  details: |
    Genetics pass for issue #12249 (d2g series-042). Enumerated the hierarchical descendants of MONDO:0012580 through the OLS4 hierarchicalDescendants endpoint and found eight, one more than the issue listed: MONDO:0016323 chronic respiratory distress with surfactant metabolism deficiency (Orphanet:217566), which the Monarch knowledge graph keys on SFTPC from an Orphanet source. Read every descendant's Monarch gene edges and MONDO description before deciding placement.

    Split the descendants on pathogenetic mechanism, which is the distinction this entry's own content rests on. MONDO:0010424 (SMDP4, CSF2RA) and MONDO:0013712 (SMDP5, CSF2RB) are this entry's disease and were added as has_subtypes rows with subtype_term, genes and evidence from the sources the entry already cited; the two causal-gene records gained relationship_type, variant_origin and a subtype foreign key, and both genes were bound as gene descriptors on the GM-CSF receptor trigger node, which previously named them in prose only and bound neither.

    The remaining six descendants denote failures of surfactant production or processing rather than of clearance, so they were recorded in differential_diagnoses with their MONDO terms bound rather than as subtypes: MONDO:0009929 (SFTPB), MONDO:0024465 (SFTPC), MONDO:0012582 (ABCA3) and MONDO:0014206 (MARS1), with MONDO:0018603 and MONDO:0016323 noted inside the SFTPC differential as two further classes for the same concept. The basis for the split is the Nature Reviews Disease Primers classification quoted in the SFTPB differential, which separates hereditary PAP (CSF2RA or CSF2RB) from congenital PAP (genes involved in surfactant production); the treatments curated here follow from failed clearance and do not transfer.

    Recorded in notes why those five appear as descendants at all: MONDO:0012580 carries OMIMPS:265120, the OMIM surfactant-metabolism-dysfunction phenotypic series, as a cross-reference, and carries congenital PAP and inborn error of surfactant metabolism among its exact synonyms, so the class is broader than its primary label. Also recorded that NKX2-1, the fourth gene of the standard surfactant-disorder set, has no descendant under this parent and is therefore neither a subtype nor a differential here, and that Orphanet records for the four surfactant-production codes could not be consulted because no ORPHA cache file exists for them in this checkout.

    Two observations on gene edges, reported rather than acted on. MONDO:0009929 (SMDP1, the SFTPB disease) carries an Orphanet-sourced ABCA3 edge alongside its OMIM SFTPB edge; SMDP1 is the SFTPB disease and the ABCA3 disease is MONDO:0012582. MONDO's own description of MONDO:0018603 states it is scheduled for merge into MONDO:0024465, so the issue's checklist lists one SFTPC concept twice.

    An unsourced claim that CSF2RA lies in the pseudoautosomal region was written into the SMDP4 description and removed before commit; the HGNC record gives Xp22.32 and Yp11.3, but the statement was not needed and the entry's IUIS classification note already carries the source-quoted inheritance qualifier. Réunion was corrected to the accented spelling in the MARS1 reference titles, snippet and prose, matching the cached record.

    Gates: validate, validate-terms, count-verified-snippets (66/66), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches and validate-disorders all clean under linkml-reference-validator 0.3.0rc1. Note that just validate alone reports three spurious errors on this entry's pre-existing IUIS table snippets: it re-fetches references_cache/PMID_35748970.md, replacing a committed 5,644-line full_text_pdf with a 175-line body. That is dismech#12672 and #12703, not a defect in the entry; the cache was reverted and the authoritative validate-disorders gate passes against the committed file.

  summary: 'Create: Gray Platelet Syndrome (MONDO:0007686)'
  details: |
    De novo curation of MONDO:0007686 (gray platelet syndrome), scoped to NBEAL2-related autosomal recessive GPS.

    Deep research: claude_code provider (research/Gray_Platelet_Syndrome-deep-research-claude_code.md), 14 references, all resolved, but needs_review=true with 4 of 7 checked quotes unsupported (PMID:34408521, PMC:PMC4780761). Every snippet in this entry was independently verified against the cached abstracts rather than reused from the report; the flagged quotes were not used.

    just preflight-dr returned WARN: the expected gene NBEAL2 dominates (60 mentions) and the OMIM xref matches (139090), but GATA1 (15) and GFI1B (11) are rival genes in the report. Those sections describe the X-linked GATA1 p.Arg216Gln disorder and the dominant GFI1B disorder, which produce a similar smear but are distinct entities. They were excluded from the mechanism curation and are curated as differential diagnoses instead; the scope decision is recorded in the entry notes.

    Content: nine pathophysiology nodes (NBEAL2 loss of function; failure of alpha-granule cargo packaging; constitutive megakaryocyte cargo release into marrow; macrothrombocytopenia and impaired platelet function; progressive myelofibrosis; splenomegaly and extramedullary haematopoiesis; leukocyte granule deficiency; reduced effector T cell CTLA-4 expression; autoimmunity and autoantibody production) under three mechanistic hypothesis groups. Seven phenotypes, a disease-level Inheritance block bound to HP:0000007, NBEAL2 as CAUSATIVE, serum vitamin B12 as a biochemical marker, prevalence recorded as CASES_IN_LITERATURE (the disorder is too rare for a rate), two progression phases capturing the biphasic natural history, clinical burden MODERATE with the counterweight stated, two diagnosis entries, two treatments, the Nbeal2 knockout mouse with two modeled_mechanisms links and readouts, two differential diagnoses, and three discussions including a HUMAN_MODEL_MISMATCH for the mouse neutrophil azurophilic-granule discrepancy.

    The myelofibrosis edge is deliberately recorded as INDIRECT_UNKNOWN_INTERMEDIATES with a KNOWLEDGE_GAP discussion: the primary literature states plainly that the basis of myelofibrosis remains unknown, and the entry quotes the hedged form of the growth-factor claim rather than the confident version.

    Deliberate omissions: quantitative claims whose sources resolved only to journal/PMC URLs or whose quotes the report's own validator flagged as unsupported were not curated — the 26%/59% autoimmune and autoantibody figures, the 58% myelofibrosis rate and median age 28.5 years, the median platelet count, the bleeding-severity distribution, the zebrafish morpholino percentage, the proinflammatory-megakaryocyte/metastasis-resistance mouse work, and the desmopressin and splenectomy management points. Platelet transfusion is curated with a note explaining why it carries no treatment-level evidence item.

    Validation: just validate (47/47 snippets verified), just validate-terms, just validate-disorders, just compliance (86.8% global), the offline gates, and the entity-reference/foreign-key pytest selection (16285 tests). One ontology binding was corrected during validation (NCIT:C927 is 'Drug Vehicle', not cyanocobalamin; replaced with NCIT:C64333).

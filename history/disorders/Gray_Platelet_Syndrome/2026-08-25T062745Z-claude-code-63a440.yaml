  summary: Record the prevalence ceiling as rate_high rather than as a point estimate
  details: |
    Round-3 review follow-up. The reviewer flagged, as non-blocking and explicitly "for a future pass", that this record paired prevalence_class: BELOW_1_IN_1000000 with rate_per_100000: 0.1 while the source (PMID:31710726) gives only a ceiling - "a rare (<1/1 000 000) and inherited platelet function disorder".

    Fixed now rather than deferred, because the schema's own slot documentation settles it rather than leaving it a matter of taste: rate_per_100000 is defined as a "Normalized point estimate of occurrence expressed as cases per 100,000" and says explicitly "Leave absent for band-only or qualitative records; use rate_low/rate_high for ranges." rate_high is defined as the "Upper bound of the occurrence rate per 100,000 when the source gives a range or a band." A "<1/1 000 000" statement is a band. So the previous value was not merely imprecise - it used a point-estimate slot for a bound, contrary to the slot's documented contract.

    Now records rate_high: 0.1 with rate_per_100000 absent, and the notes: explain that the figure is a ceiling and why the slot choice follows from that.

    This is the same reasoning that motivated the measure_type: UNKNOWN correction in the previous commit, and the reviewer said as much. Both are instances of the same failure mode: taking a qualitative or bounded statement from a source and recording it in a slot that asserts something more specific than the source supports.

    Audited the rest of this session's tranche for the same pattern while here - Glanzmann_Thrombasthenia, Scott_Syndrome, Platelet-type_Bleeding_Disorder_8 and Platelet-type_Bleeding_Disorder_18 carry no rate_per_100000, rate_low or rate_high values at all, so this was the only instance.

    Also checked for untracked files before committing, which is the lesson of the earlier bf560a1 commit: the round-1 fix commit staged only kb/ and history/ and left the newly fetched references_cache/PMID_31710726.md untracked, so local validation passed against the working tree while a fresh CI clone would have failed. Nothing untracked this time.

    Validation: 37/37 snippets verified, schema and terms clean.

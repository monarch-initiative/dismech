  summary: Restore evidence-backed content dropped in the duplicate-curation reconciliation
  details: |
    Follow-up to the #9459/#9456 duplicate-curation reconciliation. The round-5 reviewer asked the right question of that merge - "did any evidence get silently dropped?" - and flagged that something had. Rather than wait for the finding, I ran the check myself: a set-difference of every (reference, snippet) pair between this branch's superseded 871-line entry and the reconciled file.

    Result: 14 of my 34 evidence items were absent from the reconciled entry, against 57 items present overall - a large net gain, but the count alone does not answer the question. Triaged each for whether it represented a lost CLAIM or merely alternative support for a claim already covered:

    COVERED, no action (11 items): the granule-absence and macrothrombocytopenia characterizations (#9459 evidences both from other sources); the zygosity pattern (#9459's 65% homozygous / 35% compound heterozygous from PMID:34408521 is better); the alpha-granule background description; the "rudimentary precursors" maturation-not-initiation point (present, 4 mentions); all three Nbeal2-mouse items (PMID:23861251 is cited 3 times); the vitamin B12 level; the prevalence ceiling (deliberately superseded by CASES_IN_LITERATURE pedigree counts).

    GENUINELY LOST, restored (3 claims):
      1. The `gap_nbeal2_molecular_function` KNOWLEDGE_GAP in full. #9459 carries a myelofibrosis gap but nothing on how NBEAL2 loss mechanistically causes the packaging defect - the source's own "remains unknown" statement, the caveat that its predicted WDFY3/LYST interactors are "entirely based on computational predictions", and a proposed proximity-labelling interactome experiment. Re-anchored to #9459's node name (`Failure of Alpha-Granule Cargo Packaging`) and re-keyed as `gps_nbeal2_molecular_function_unknown` to match that entry's id convention.
      2. Three granule-biology differential diagnoses: Chediak-Higashi (the sister BEACH-domain protein), the storage pool disease classification, and ARC syndrome (VPS33B/VIPAS39, the other genetic route to alpha-granule deficiency and the comparison that places NBEAL2's step late in biogenesis). #9459's two differentials (GFI1B, GATA1) are thrombocytopenia mimics - a different and complementary axis - so these were ADDED alongside rather than replacing them.
      3. Two additions to #9459's myelofibrosis gap: the fibronectin-overexpression alternative hypothesis (a matrix mechanism rather than a cargo-release one, zero prior mentions in the file, and one that predicts differently about whether suppressing megakaryocyte output would slow fibrosis), and the methodological obstacle that has kept the gap open - the fibrotic marrow itself prevented the original authors from harvesting enough megakaryocytes to culture, which is why the mouse is the tractable system.

    Snippet count on the reconciled entry rose 71 -> 76 -> 78 across these restorations, all verified exact against the cached references.

    Method note worth keeping: comparing section names between two versions of an entry is not sufficient to detect dropped content, because equivalent sections can carry different claims. The set-difference over (reference, snippet) pairs is the check that actually answers it, and it is cheap - a few lines of YAML walking. This is the second time in this PR that a mechanical audit found something a reading pass had missed, the first being the 397-title reference_title sweep.

    Validation: 78/78 snippets verified, schema and terms pass, grouping audit nine members all SATISFIED on both criteria, duplicate-key and folded-hyphen gates clean.

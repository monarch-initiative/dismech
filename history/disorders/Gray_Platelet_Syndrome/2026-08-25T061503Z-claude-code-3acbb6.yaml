  summary: 'Review response: Gray Platelet Syndrome (PR #9459)'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9459.

    The review's core finding was correct: references_cache/PMID_34408521.md is stored as full text (content_type: full_text_xml), and the entry treated it as abstract-only. All eight citations to it quoted abstract sentences, so its Management section and body figures went unmined, and the notes asserted several claims were unverifiable when they were sitting in the cached file.

    Now curated from that full text: haematopoietic stem cell transplantation as the one curative option, with a target_mechanisms link to Progressive Myelofibrosis — the reported resolution of marrow fibrosis after transplant is also the closest thing to a patient-level test of the entry's leakage model; non-specific haemostatic measures with NSAID avoidance; a thrombopoietin-receptor-agonist entry curated as a caution with NO_EVIDENCE plus the fibrosis-promotion rationale, since the drug class's known effect coincides with this disease's defining complication; splenectomy, whose limited effect supports the entry's account of where the thrombocytopenia comes from. Phenotype frequencies added with supporting quotes: myelofibrosis FREQUENT (58%), autoimmunity FREQUENT (around half), infection susceptibility OCCASIONAL (17%), macrothrombocytopenia and bleeding tendency VERY_FREQUENT with the median platelet count quantified.

    Corrected a species mis-attribution the review caught. The Leukocyte Granule Deficiency node asserted reduced NK number and degranulation as a human finding; the cited review says explicitly that whether the NK compartment is altered in human GPS is an open question. The description now scopes the NK claim to the mouse, MODEL_ORGANISM evidence from PMID:28783043 (fetched into the cache by this PR but previously uncited) supports it, and the human neutrophil claim is kept separate with its HUMAN_CLINICAL support, including the in-vitro-differentiation result that distinguishes failed retention from failed synthesis. The Nbeal2 mouse now carries a PARTIALLY_RECAPITULATES link to that node with the azurophilic-granule divergence and the more severe murine infection phenotype recorded as limitations.

    Also: bound disease_term on both differential diagnoses (MONDO:0008553 for the GFI1B disorder, curated in this repo by #9424; MONDO:0010745 for the GATA1 disorder) and rewrote the evidence explanations so they claim only what the quote supports; replaced NCIT:C64333 Cyanocobalamin with NCIT:C64817 Vitamin B12 Measurement, which is the analyte rather than a pharmaceutical vitamer; substantiated the "independently generated by more than one group" claim with the spontaneous 8bp deletion model (PMID:26950939); added a downstream edge from Leukocyte Granule Deficiency to the infection phenotype; changed platelet transfusion to CELL_THERAPY and replaced its inaccurate no-source disclaimer with the review statement plus a narrowed note; and keyed the discussion attaches_to on the model name rather than its species.

    Validation after changes: just validate (66/66 snippets verified, up from 47), validate-terms, validate-disorders, duplicate-key/snippet-length/title-snippet/folded-hyphen gates, compliance 89.0% (up from 86.8%), and the entity-reference/foreign-key/model-readout pytest selection.

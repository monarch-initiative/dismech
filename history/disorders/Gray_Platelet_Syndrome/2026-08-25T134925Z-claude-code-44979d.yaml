  summary: 'Reconcile duplicate curation: adopt PR #9459''s entry, port module wiring
    and three gaps'
  details: |
    Gray Platelet Syndrome was curated twice, independently and concurrently. PR #9459 merged into main at 2026-08-25T13:08Z with a 1611-line entry; this branch (PR #9456) carried its own 871-line entry curated as part of the inherited-platelet-function-disorders tranche. The pr-shepherd bot hit the add/add conflict, correctly declined to resolve it mechanically on the grounds that neither side was stale, and left it as a curator call.

    RESOLUTION: adopt the merged #9459 entry wholesale as the base, and port onto it only what this branch had that it genuinely lacked. Reasons for that direction rather than the reverse:
      - #9459 is already on main; reverting a merged curation to prefer an unmerged one would discard another curator's work by default.
      - It is substantially richer: 11 cited PMIDs to 6, and it carries classifications, mechanistic_hypotheses, progression, clinical_burden and a 239-line treatments block. That treatments block independently closes review finding 2 on this PR, which this branch's version had answered with a deferral note.
      - Its immune arm is more mechanistically specific: it models Reduced Effector T Cell CTLA-4 Expression as a node, where this branch had only a generic 'NBEAL2-Dependent Granule Defects in Leukocytes'.
      - Its prevalence record is better evidenced: CASES_IN_LITERATURE with 86 variants across 69 pedigrees (PMID:34408521), against this branch's '<1/1 000 000' ceiling band from a single perioperative case report.

    PORTED FROM THIS BRANCH (four items, each verified genuinely absent from #9459's entry):
      1. conforms_to wiring to primary_hemostatic_plug_failure on 'NBEAL2 Loss of Function' (component-loss trigger) and 'Macrothrombocytopenia and Impaired Platelet Function' (secretion arm). Without this the entry would sit outside the module and outside the Inherited_Platelet_Function_Disorders grouping.
      2. A 'Failure of Primary Hemostatic Plug Formation' node conforming to the module's central effector, with an incoming edge from the platelet-function node and an outgoing edge to phenotypes#Bleeding tendency. #9459's entry went from platelet dysfunction straight to phenotype, so it did not pass through the node the grouping's NECESSARY_AND_SUFFICIENT criterion names. Same repair previously applied to the GFI1B, PT-VWD and BDPLT21 entries.
      3. The phenotype 'Absence of platelet alpha-granules' (HP:0012526), OBLIGATE. #9459's entry binds the alpha granule as a GO cellular component on pathophysiology nodes but had no phenotype entry for the defining diagnostic finding - the one the disorder is named for.
      4. A diagnosis entry recording that bleeding severity tracks neither platelet count nor functional test results (PMID:31710726), which has direct perioperative-management consequence and appeared nowhere in #9459's entry.

    NOT PORTED, deliberately: this branch's prevalence record (superseded by a better-evidenced one), its generic leukocyte-granule node and reduced-leukocyte-count phenotype (#9459 covers the immune arm better, and adding marginal phenotypes to another curator's entry is not warranted), and its biochemical serum-B12 record - see below.

    AN ERROR OF MINE THIS RECONCILIATION EXPOSED. This branch had moved elevated serum vitamin B12 out of phenotypes: and into biochemical:, with a note asserting that the HPO offers no term for an elevated circulating B12 concentration - only a directionally neutral parent (HP:0040126) and a decreased child (HP:0100502). That was wrong. HP:6000016 'Elevated circulating vitamin B12 concentration' exists and is exactly the needed term; #9459's entry uses it correctly. The claimed ontology gap was an artefact of my searching an older ID range and not finding a 6-series term. Adopting #9459's entry removes the incorrect note along with the record that carried it. Worth recording because the failure mode generalizes: asserting that an ontology lacks a term is itself a claim that needs checking, and a negative search result is weak evidence for it.

    Earlier history records in this directory describe this branch's superseded 871-line entry. They are append-only and are left as written; this record supersedes them for the current file state.

    Cache conflicts on cache/hgnc/terms.csv (hgnc:31928 NBEAL2) and cache/mondo/terms.csv (MONDO:0007686) were identical CURIE and label rows differing only in fetch timestamp; main's newer rows were kept.

    Validation after reconciliation: 71/71 snippets verified, schema and terms pass, grouping audit shows all nine members SATISFIED on both criteria, folded-hyphen / snippet-length / title-snippet / duplicate-key gates clean, validate-history-all clean over 6702 records. The merge also cleared the stale check-snippet-length finding on NDP_Related_Vitreoretinopathy that had been flagged across three review rounds as main-drift on an untouched file.

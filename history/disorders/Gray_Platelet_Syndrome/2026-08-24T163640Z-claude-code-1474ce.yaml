  summary: 'Create: Gray Platelet Syndrome (MONDO:0007686, BDPLT4)'
  details: |
    Curated gray platelet syndrome as a secretion-arm conformer of primary_hemostatic_plug_failure. Stub deleted.

    Two arms, one gene, and only one of them is the module's. The haemostatic arm (NBEAL2 loss -> failed alpha-granule packaging -> granule-deficient platelets -> failure of the plug -> mild-to-moderate mucocutaneous bleeding) conforms. The marrow arm (progressive myelofibrosis, splenomegaly, deepening thrombocytopenia) carries the long-term prognosis and is curated on its own nodes, outside the module.

    Evidence discipline: the Constitutive Marrow Release of Megakaryocyte Growth Factors node is curated at PARTIAL support with an INDIRECT_UNKNOWN_INTERMEDIATES downstream edge, because the source that proposes it says in the same sentence that the basis of the myelofibrosis remains unknown. It is included as a named hypothesis rather than omitted, so the open question is visible in the pathograph, but it must not be read as an established pathway.

    The immune arm (NBEAL2-dependent granule defects in neutrophils, monocytes and CD4 lymphocytes; reduced leukocyte counts; autoimmunity) rests on a single deep-phenotyping cohort, PMID:32693407, and is flagged in notes as not independently replicated.

    Curation correction made during this session: elevated serum vitamin B12 was first written as a phenotype bound to HP:0040126, which is not in the PhenotypeTerm dynamic enum. Rather than substituting a term that merely validates, it was moved to biochemical: where it belongs - it is a laboratory marker - with the HPO gap (no term for an ELEVATED circulating B12; only a neutral parent and a decreased child) recorded in its notes.

    Second correction, caught by the grouping audit rather than by validation: the entry initially annotated the laboratory findings and omitted the clinical one, so it failed the Inherited_Platelet_Function_Disorders NECESSARY bleeding criterion. Fixed by adding an Abnormal bleeding phenotype with its own evidence, not by weakening the criterion.

    Validation: linkml-validate PASSED; linkml-term-validator PASSED; reference validation PASSED with 34/34 snippets verified. One label mismatch (HP:0001882 is 'Decreased total leukocyte count', not 'Leukopenia') was corrected to the canonical label with the clinical name kept in preferred_term.

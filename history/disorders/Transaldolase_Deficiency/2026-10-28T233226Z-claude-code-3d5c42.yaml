  summary: 'Evidence-claim mismatch review: Transaldolase_Deficiency'
  details: |
    Reviewed the Jev evidence-claim-match assessments for this entry (issue 15759), concentrating on the findings with the highest MISMATCH probability. Corrections: (1) Elevated alpha-fetoprotein marker: the context asserted unsupported age-dependence and nodule association; rewrote it to what the sources show (AFP elevated in many patients, falls with and without NAC, can be normal despite dysplastic nodules), added a direct elevation quote (PMID:24497183), a decline-without-NAC quote (PMID:34572178) and a normal-AFP-with-nodules quote (PMID:34677006), and re-explained the pre-NAC decline quote (PMID:29923087) as support for the caveat, not the elevation. (2) N-acetylcysteine treatment: replaced a snippet that argued against NAC with the PMID:29923087 sentence citing a prior patient whose AFP fell on NAC, which is the limited human support the description claims; marked quote_role BACKGROUND. (3) Antioxidant cofactor depletion -> Mitochondrial dysfunction edge: the description claimed mitochondrial oxidative damage, which no snippet shows; rewrote it as co-occurrence of NADPH/GSH depletion with loss of transmembrane potential, and replaced the lymphoblast snippet with the PMID:18498245 sentences reporting NADPH depletion and diminished membrane potential. (4) Mitochondrial dysfunction node: extended the PMID:18498245 snippet to include the diminished membrane potential the description relies on. (5) Portal hypertension -> Edema edge: removed the hypersplenism/cytopenia quote, which says nothing about edema, and narrowed the description to ascites. (6) Liver transplantation -> hepatic fibrosis BYPASSES link: replaced the post-transplant death quote (already carried at treatment level) with the PMID:41823103 passage reporting a fibrosis-free graft alongside progressing renal dysfunction. (7) Premature skin wrinkling phenotype and edge: the PMID:23315216 quote reports cutis laxa, not premature wrinkling; marked directness INDIRECT and said so in the explanation. Retained without change after review: urinary erythronic acid, diagnosis polyol age-dependence, supportive-care, mouse HCC and definition evidence, where the flagged snippet supports a caveat or context sentence the claim explicitly carries. Validated with just validate (schema, terms, 225/225 snippets) and the per-file KB gates.

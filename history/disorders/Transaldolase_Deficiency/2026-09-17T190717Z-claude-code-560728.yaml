  summary: Re-apply outstanding OpenScientist findings
  details: |
    Batch-2 re-application of the OpenScientist assessment sweep that could not be merged onto current main. Four citations absent from main were re-derived from references_cache on disk and applied: PMID:17603756 to diagnosis 'Urinary polyol and seven-carbon sugar testing' (the LC-MS/MS method paper behind the sedoheptulose / sedoheptulose-7-phosphate panel that node's description already names but did not cite); PMID:37071763 to phenotypes 'Hepatocellular carcinoma' (independent explant pathology in an infant with TALDO deficiency, syncytial giant cell variant, from a second centre); two items from PMID:39992042 to treatments 'Liver transplantation' (size of the reported transplant series at seven prior cases, and resolution of coagulopathy with stable graft function at one year); PMID:30323337 to mechanistic_hypotheses canonical_taldo1_ppp_redox_model (CRISPR screen in HER2-amplified breast cancer reaching the same NADPH/ROS consequence of transaldolase loss, graded IN_VITRO with directness INDIRECT because the effect required concurrent HER2 blockade in an unrelated cell type). Skipped as already covered by main's parallel curation: the old sweep's 'Adolescent and adult course' progression phase (main has 'Variable childhood-to-adult progression' with the same PMID:41806563 source plus PMID:41823103), and its fibrosis-to-carcinoma causal edge (main built an explicit Hepatocarcinogenesis pathophysiology node with its own downstream edge to the phenotype, a better route than the one the sweep proposed). Both prose corrections the sweep made are moot on main: the overstated NAC explanation sat on a PMID:31769880 evidence item that main no longer carries, and main's rewritten liver-transplant description no longer calls the evidence insufficient. The sweep's six discussions were not carried over: main folded the same epistemic caveats into mechanistic_hypotheses.notes and promoted the mTOR/PON1/antiphospholipid arm into the pathograph as caveated nodes, so two of the discussions would have contradicted main's structure. The missing assessment sidecar openscientist-assessment-by-claude-opus-5.yaml was copied across verbatim and validates; it sits alongside main's existing codex assessment of the same report. Verified with linkml-validate (no issues), count-verified-snippets (223/223), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and validate-hypothesis-assessment.

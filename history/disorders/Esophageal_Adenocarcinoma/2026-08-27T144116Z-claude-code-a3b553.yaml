  summary: 'Add experimental_models NAM record: patient-derived organ chip'
  details: |
    Recorded the patient-derived, stroma-inclusive EAC organ chip (PMID:40410759, Pal/Ingber/Ferri) as a structured experimental_models entry. One link, to Chromosomal Instability, PARTIALLY_RECAPITULATES, framed in its limitations as an explicit substrate-fidelity claim rather than a mechanistic one: the publication reports that the source tumour's genetic landscape and histological architecture are preserved, but makes no measurement of chromosomal instability as a process, so missegregation, whole-genome duplication and copy-number evolution are not readouts of this system, and the chip's epithelium-plus-fibroblast composition structurally excludes the CIN-linked myeloid axis curated elsewhere in the entry. The link evidence is graded PARTIAL for that reason. The chip's headline result - accurate neoadjuvant chemotherapy response prediction - is a treatment-level property and was left where it was already cited, on the neoadjuvant CROSS treatment, rather than duplicated. Notes record the honest gap: no pathophysiology node in this entry covers tumour-stroma crosstalk or chemoresistance, which is what this model is actually built to interrogate. Adding such a node is a substantive mechanistic addition and was left as follow-up rather than asserted. Schema, term, entity-ref, duplicate-key and snippet gates all pass.

  details: |
    # Evidence review — Esophageal_Adenocarcinoma.yaml

    ## Stats
    - Evidence items checked: 39 (has_subtypes, pathophysiology, phenotypes, diagnosis, differential_diagnoses, genetic, treatments, clinical_trials, experimental_models, datasets).
    - Distinct references read: 19 (PMID_21267790, PMID_32119349, PMID_34503107, PMID_40874980, PMID_37794034, PMID_31724072, PMID_26086965, PMID_25957861, PMID_27214976, PMID_8012079, PMID_40277743, PMID_33891478, PMID_33789008, PMID_40410759, PMID_20224883, clinicaltrials_NCT02743494, clinicaltrials_NCT03189719, GEO_GSE316127, GEO_GSE316062). All caches present.
    - Snippets verified against cache: all literature/GEO-summary snippets matched; whole-file audit 71/74 with 3 geo: dataset accessions skipped by prefix.
    - Verified clean: 38 of 39 after the one fix below.

    ## Findings

    1. pathophysiology "Adaptive Immune Resistance" > evidence, PMID:31724072 (Fassan 2020, "PD-L1 expression in gastroesophageal dysplastic lesions"), `supports: PARTIAL`, `evidence_source: HUMAN_CLINICAL`. Severity: MINOR. The node description and old `explanation` said "Barrett-associated dysplastic … lesions." The cited series is 125 *gastroesophageal* dysplastic lesions (esophageal + gastric); the abstract does not characterize the esophageal lesions as Barrett-associated, so "Barrett-associated" over-specified the source. The snippet does honestly support PD-L1 enrichment in esophageal and adenocarcinoma vs low-grade lesions, and PARTIAL is the correct honest grade. ACTION: fixed (explanation only) — reworded to "PD-L1 pathway activation in esophageal dysplastic and adenocarcinoma lesions, although the series is a mixed gastroesophageal one that does not identify lesions as Barrett-associated…". Snippet, grade, source unchanged. (Node `description` line 238-240 still says "Barrett-associated"; left untouched per conservative fix policy — flagging for a curator, as rewriting descriptions is out of scope.)

    2. pathophysiology "Chromosomal Instability-Linked Innate Immune and Myeloid Signaling" > evidence[0], reference `GEO:GSE316127`, `evidence_source: IN_VITRO`, snippet "Chromosomal instability (CIN), a pervasive feature of esophageal adenocarcinoma (EAC), drives tumor aggressiveness and metastasis." Severity: NOTE. Snippet is an exact substring of the GEO summary and correctly on-topic (EAC CIN). The GSE316127 series is the isogenic CP-A cell-line/bulk-RNA-seq arm, so IN_VITRO is the right classification; the companion snRNA-seq human arm (GSE316062) is separately graded HUMAN_CLINICAL on the next item. Grades are internally consistent. Note: the item's own `reference_title` snippet quoted here is a background sentence, not a result, but it substantively frames CIN as the pervasive driver the node asserts. ACTION: reported only — clean.

    3. pathophysiology "…Innate Immune and Myeloid Signaling" > evidence[1], `GEO:GSE316062`, `evidence_source: HUMAN_CLINICAL`, snippet "Coupling in situ CIN detection with single-nucleus RNA sequencing and multiplex immunophenotyping of human EAC, we link CIN to tumor-intrinsic innate immune activation, CXCL8 expression, and myeloid cell-mediated immunosuppression." Severity: NOTE. Exact substring; the snRNA-seq/immunophenotyping was performed on human EAC tumors, so HUMAN_CLINICAL is defensible. ACTION: reported only — clean. (Aside: the datasets[] block cites GSE316127 with a distinct CP-A snippet that also verifies.)

    4. T Cell Exhaustion and Immune Escape > evidence, PMID:26086965 ("T-cell exhaustion in the tumor microenvironment"), `evidence_source: OTHER`. Severity: NOTE. This is a general cancer-immunology review, not EAC-specific; OTHER is the correct conservative classification and the `explanation` explicitly frames it as a review supporting a mechanistic-consequence claim. No overreach. ACTION: reported only — clean.

    5. phenotype "Odynophagia" evidence, PMID:27214976 (mixed oesophageal-cancer review), `supports: PARTIAL`, and phenotype "Gastroesophageal Reflux" evidence, PMID:25957861, `supports: PARTIAL`. Severity: NOTE. Both correctly downgraded to PARTIAL with explanations noting the source is not EAC-specific (27214976 mixes OSCC/OAC) or frames reflux as a risk factor rather than a presenting symptom. Honest grading. ACTION: reported only — clean.

    6. phenotype "Weight Loss" evidence[1], PMID:40277743, `supports: PARTIAL`, snippet reports ">10% weight loss in 54%." Severity: NOTE. The explanation correctly discloses this is a mixed gastric/GEJ/esophageal surgical cohort, not EAC-only, and uses it only to justify the FREQUENT frequency band. Appropriate use of PARTIAL. ACTION: reported only — clean.

    7. phenotype "Gastrointestinal Hemorrhage" evidence, PMID:8012079 (single case report), `supports: PARTIAL`, `evidence_source: HUMAN_CLINICAL`. Severity: NOTE. A single-patient case report ("74-year-old man had the chief complaints of hematemesis and melena") supporting hematemesis/melena as a *possible* presentation; PARTIAL is honest and the claim is appropriately weak ("Some tumors present with…"). ACTION: reported only — clean.

    8. treatments "Neoadjuvant CROSS…" evidence[1] and experimental_models organ-chip items, PMID:40410759, `evidence_source: IN_VITRO`. Severity: NOTE. The organ-chip is a human patient-derived microphysiological system; IN_VITRO is the correct source class for this NAM platform. The Chemotherapy Resistance node's own item (PMID:40410759, `evidence_source: OTHER`, background sentence "Most patients with EAC experience poor outcomes because of the inherent or acquired resistance to chemotherapy") is deliberately and correctly graded OTHER with an explanation stating it is a background disease-assertion, not a result — good discipline. The chip readout snippets ("EAC chips also accurately predict…", "EAC chips more accurately recapitulate inpatient pathological and objective responses…") are exact and are results. ACTION: reported only — clean.

    9. treatments CROSS/esophagectomy/endoscopic/nivolumab, genetic (TP53/ERBB2/CDKN2A/SMAD4), diagnosis, differential_diagnoses, has_subtypes, and clinical_trials NCT02743494/NCT03189719 — all snippets are exact substrings substantively supporting their claims with honest SUPPORT/PARTIAL grades. TP53 "mutated in 70 to 80%" reused across four sites all keep `evidence_source: HUMAN_CLINICAL` (no grading conflict). NCT registration snippets graded HUMAN_CLINICAL per dominant KB convention. Severity: NOTE. ACTION: none — clean.

    ## Sections reviewed
    has_subtypes, pathophysiology, phenotypes, diagnosis, differential_diagnoses, genetic, treatments, clinical_trials, experimental_models, datasets, classifications, references.

    ## Verdict
    Evidence quality is high and notably self-aware: the entry consistently downgrades non-EAC-specific and mixed-cohort sources to PARTIAL, marks background/disease-assertion quotes as OTHER, and separates the IN_VITRO (CP-A / organ-chip) from HUMAN_CLINICAL (snRNA-seq human tumor) arms of the same studies. The only correction was one over-specified `explanation` that called a mixed gastroesophageal PD-L1 series "Barrett-associated"; fixed in the explanation. A residual mention of "Barrett-associated" remains in that node's free-text `description` and is flagged for a curator (out of scope for the conservative snippet-fix policy). No Named Entity Confusion, no fabricated snippets, no title-as-finding misuse.

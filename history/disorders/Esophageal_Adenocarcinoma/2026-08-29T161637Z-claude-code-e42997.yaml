  details: |
    Follow-up to PR #9665, addressing the reviewer's observation that the Chemotherapy Resistance node's description made two claims while its single evidence item covered only one. The description asserted that resistance is a property of the epithelium together with its stroma; the node's evidence (PMID:40410759, graded OTHER as a background assertion) only said resistance drives poor outcomes. Added a second evidence item quoting the organoid-comparator result, graded IN_VITRO and directness: INDIRECT because it is a comparison between model systems from which the stromal contribution follows by an inference step. Also softened the description: the comparator sentence supports resistance being reproduced more faithfully by stroma-inclusive systems than by epithelium-only culture, not that it is observable only in them. The node still asserts no causal edge, and its notes still say why.

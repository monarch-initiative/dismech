  summary: Rung-3 lump/split review (#10115, design decisions §3e)
  details: |
    Rung-3 lump/split review of the seven trematode agents against the six differentiating axes of design decisions section 3e (R7-R12). Outcome: five subtypes added at the named-disease level, each MONDO-bound, since that is the level at which the field names these as separate diseases and at which the strata differ. Clonorchiasis (MONDO:0005705) and Opisthorchiasis (MONDO:0005884) share organ (biliary), vehicle (raw freshwater fish) and drug (praziquantel) and are separated on geography - eastern Asia versus southeastern Asia and eastern Europe - per DOI:10.1128/cmr.00009-23; the two Opisthorchis species are kept in one row because only range separates them, which that row records. Fascioliasis (MONDO:0004668) carries the decisive first-line-therapy difference, triclabendazole rather than praziquantel, plus a plant-borne vehicle and a ruminant reservoir; DOI:10.1371/journal.pntd.0011073, DOI:10.1007/s40588-024-00231-y. Paragonimiasis (MONDO:0005895) is the organ-involvement outlier, the adult fluke developing in the respiratory tract and the vehicle being crabs and crayfish; DOI:10.1007/s40588-024-00231-y, DOI:10.1371/journal.pntd.0011073. Echinostomiasis (MONDO:0005739) is intestinal rather than biliary or pulmonary, with avian as well as mammalian definitive hosts and niclosamide as an additional option; DOI:10.1007/s40588-024-00231-y, PMID:19597009. No new references were needed; every quote came from the entry's existing cached references. No standalone entry exists for any of the five, so none carries curated_in, and the entry was deliberately not converted to a Grouping - that is the eventual shape under rung 1 once the member diseases are curated, and is noted in the PR rather than acted on here. disease_term, pathophysiology and infectious_agent bindings were not touched; the pre-existing NO_PROGRESSION advisory is out of scope for this review. Validated: just validate (37 titles, all snippets), just validate-terms, just check-granularity (TAXON_LUMP cleared, no UNBOUND_SUBTYPE).

  summary: 'Compliance pass: evidence for the flow-theory chain, ductal dependence
    and three phenotypes'
  details: |
    Weekly compliance sweep. Added 11 evidence items across the five previously uncited pathophysiology nodes (obstruction to left heart inflow or outflow, reduced flow, progressive hypoplasia, ductus-dependent perfusion, circulatory collapse on ductal closure), three phenotypes (hypoplastic left ventricle, patent ductus arteriosus, endocardial fibroelastosis) and the Evolving HLHS subtype. No new references were fetched: every item draws on a reference already cited elsewhere in the entry, principally PMID:25052401 (fetal aortic valvuloplasty, first 100 patients), which is the human test of the flow theory and was cited only in the discussions rather than on the chain it bears on. Five items are graded INDIRECT or carry quote_role BACKGROUND with the shortfall named: the ductal-dependence and PGE1 quotes come from the introduction of a trial about apnoea prevention and speak of ductal-dependent lesions as a class, not of this disease, and they do not support the retrograde coronary perfusion the node also asserts. The reduced-flow explanation records that the valvuloplasty comparison is between outcome groups rather than assigned treatments, and that selection for achieving a biventricular circulation is not independent of how large the left heart already was. One compliance gap was deliberately not closed: genetic[3].gene_term carries no term, and its own notes explain why, since the lesion is a chromosome rather than a locus and no single gene is being asserted. Filling it would be the error the ontology-term contract warns against. Weighted compliance 66.3 to 73.3 percent. All 55 snippets verified against the cache.

  summary: Remove unsupported EMT annotation from the endocardial fibroelastosis node
  details: |
    Removes the GO:0001837 epithelial to mesenchymal transition annotation from the endocardial fibroelastosis node. The reviewer on PR 8281 flagged it as a non-blocking suggestion and the curator agreed it was a real defect rather than a preference. The literature describes endothelial to mesenchymal transition, which is a distinct process in which endocardial endothelium rather than epithelium acquires a mesenchymal phenotype. GO has no term for that process outside the endocardial cushion and heart valve formation contexts, which are developmental events different from this fibroelastic lesion, so no substitute term is available. More decisively, the evidence cited on this node establishes only that the lesion exists and is unexplained by the flow model, and does not establish either transition, so binding either term would attach a mechanism claim this entry cannot support. The annotation is removed rather than replaced and the reasoning is recorded in the node notes. Cell types are retained because the cellular participants are not in doubt. Validation after the change. just count-verified-snippets reported 44 of 44 verified and just validate-terms passed.

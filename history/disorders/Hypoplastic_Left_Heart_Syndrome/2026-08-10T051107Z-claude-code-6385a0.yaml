  summary: 'Create: Hypoplastic Left Heart Syndrome'
  details: |
    New entry for hypoplastic left heart syndrome, MONDO:0004933, curated from a claude_code deep-research report treated as leads only. Nine pathophysiology nodes. The distinguishing feature of the entry is that it curates three competing mechanistic_hypotheses groups rather than selecting one, because the disagreement about how this disease starts is real and current. The flow theory is CANONICAL, the intrinsic myocardial defect account is ALTERNATIVE, and a reconciling account placing the myocardial defect upstream of the flow deficit is EMERGING, resting on a single tissue-restricted rescue experiment in zebrafish. Causal edges opt into hypothesis groups so a reader can see which parts of the pathograph each model owns. No module conformance is declared. The obvious candidate, cardiomyopathy_maladaptive_remodeling, would assert that late systemic right ventricular failure is remodelling in response to load, which is precisely the question the entry leaves open. Two deep-research ontology errors were caught and corrected. UBERON:0002094 is the interventricular septum and not the left ventricle, and UBERON:0002078 is the right cardiac atrium and not the right ventricle. The correct terms are UBERON:0002084 and UBERON:0002080. Validation. just count-verified-snippets reported 32 of 32 verified, just validate-terms passed, and the pytest foreign-key, conformance, and hypothesis selection reported 7956 passed.

  details: |
    Third review round on PR #12126. Closes the one item left open by the
    2026-09-21 re-review and answers the two leads and the suggestion it offered,
    so nothing is deferred to a further round.

    `Mitral atresia` (the required item) now carries evidence. The description
    restated three clauses of PMID:40386366 almost word for word without citing it.
    All three sit in one contiguous passage in the cached full text -- the valve is
    atretic rather than stenotic, that change is invariably linked to aortic
    atresia, and left ventricular inflow is lost as a result -- so a single quoted
    span covers the whole description rather than three separate items. The earlier
    decline was about `has_subtypes` and, as the reviewer said, did not reach this
    slot.

    `Aortic valve atresia` (offered lead, taken). Cites the retrograde-conduit
    sentence already used on the `Ductus-dependent systemic and coronary perfusion`
    node. The reuse is deliberate and the explanation says why the same sentence
    belongs in both places: it is the anatomical lesion in the phenotype slot and
    the resulting circulation on the pathophysiology node. Graded identically in
    both (HUMAN_CLINICAL / REVIEW_SYNTHESIS), so `check-snippet-grading` stays
    clean -- the same quoted sentence must not carry two different
    `evidence_source` values.

    `Coarctation of the aorta` (offered lead, taken as the honest-citation option
    rather than the decline). The reviewer was right that the available sentence
    reaches only the co-occurrence. It is cited with `directness: INDIRECT`,
    because it gets there through a prenatal imaging description rather than
    asserting the association, and the explanation states plainly which two parts
    of the description it does not support: the ductal-insertion location, and the
    relevance via compromised retrograde systemic supply. Both are standard
    clinical accounts but neither is in this source, so they are recorded as a gap
    rather than papered over. The description was left unchanged; narrowing it to
    fit the one citable clause would have discarded true content.

    Suggestion answered: `directness: INDIRECT` applied to the PMID:25052401 item
    on the flow-hypothesis node. The quote reports a size difference between
    outcome groups, and "flow is an input to growth" follows only by an inference
    step, which is what INDIRECT records. The non-randomised design and the
    selection confound were already named in the explanation; the slot now makes
    that machine-readable instead of leaving it to prose.

    The PR body paragraph claiming no quotable review exists was edited in the same
    round. The previous record retracted it, but the body still asserted it.

    Validation: `just validate` passes (schema + terms + references); 61/61
    snippets verified, up from 58. `check-entity-refs`, `check-duplicate-keys`,
    `check-causal-targets`, `check-enum-values`, `check-qualifier-terms`,
    `check-folded-hyphens`, `check-snippet-length`, `check-title-snippets`,
    `validate-history` all clean. `check-snippet-grading` fails only on
    Meckel_Syndrome and Wilsons_Disease, which are pre-existing and red on main.

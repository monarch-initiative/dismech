  summary: 'Review response: evidence_source regrading and full-text citations'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review of 2026-09-21 on PR 12126, addressing both IMPORTANT items and suggestion 1 in one push.

    IMPORTANT 1. The two new items citing PMID:40386366, on the Progressive hypoplasia pathophysiology node and the Hypoplastic left ventricle phenotype, were graded evidence_source: OTHER with the explanation stating that the source is a scoping review rather than a primary study. That is the reasoning issue #10262 identifies as a defect: evidence_source grades the evidence the quoted text describes, and the quoted sentence is a synthesis of human clinical studies. Both are regraded to evidence_source: HUMAN_CLINICAL with quote_role: REVIEW_SYNTHESIS, which is also what the pre-existing prevalence item citing the same reference already used, so the entry no longer says two different things about one publication. The OTHER rationale sentence is dropped from each explanation. PMID:42200818 is left alone: it is graded OTHER at the one new site and at four pre-existing sites, so it is internally consistent and changing only the new one would create the divergence this item is about.

    IMPORTANT 2. The PR body claimed no review with quotable sentences covering the anatomic subtype spectrum could be found. The premise was wrong because the search was scoped to abstracts; PMID_40386366.md was already cached and already cited twice by this PR, and its full-text body carries the sentences. Three are now used, each verified as an exact substring of the cache before use. The Ductus-dependent systemic and coronary perfusion node asserted retrograde coronary perfusion that its own explanation admitted the PGE1 snippet did not support; that gap is now closed by the sentence stating that in aortic atresia the hypoplastic ascending aorta supplies the coronary arteries in a backward flow, and the PGE1 explanation now points at it rather than leaving the gap open. The Aortic atresia and Aortic stenosis with mitral stenosis subtypes carried no evidence at all and now each carry one item: the same retrograde-flow sentence for the former, and for the latter the sentence distinguishing a severely constricted but perforate aortic valve from an atretic one. The mitral-atresia sentences were read and deliberately not used, because neither curated subtype is a mitral-atresia subtype and quoting them there would attach a claim about a different phenotypic type.

    Suggestion 1. quote_role: BACKGROUND added to the new PMID:25052401 item on the Obstruction to left heart inflow or outflow node. The sentence was re-read in the cache before tagging, as the suggestion asked: it is the opening sentence of the structured BACKGROUND section and restates established practice, while this paper's own result is the 100-patient cohort quoted elsewhere in the entry, so BACKGROUND is correct rather than PRIMARY_RESULT.

    Validation. just validate passed for schema, terms and references. just count-verified-snippets reports 58 of 58 verified, up from 55, so all three added snippets verified against the cache. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-qualifier-terms pass on the entry; check-title-snippets and check-folded-hyphens pass whole-KB. check-snippet-grading reports three findings, all in Meckel_Syndrome.yaml and Wilsons_Disease.yaml, which this PR does not touch and which differ from origin/main only because the branch predates their repair on main; no finding involves this entry, and the branch was not refreshed because that gate is not run by CI and freshness alone does not warrant a merge.

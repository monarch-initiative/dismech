  summary: Correct a false claim in the EFE node notes about term availability
  details: |
    Corrects a factual error introduced by the previous history record's change, and is filed as a new record rather than by editing that one, which is append-only and accurately describes the session as it ran. The endocardial fibroelastosis node notes stated that GO has no term for endothelial to mesenchymal transition outside the endocardial cushion and valve formation contexts. That is false. GO:0140074 cardiac endothelial to mesenchymal transition exists, carries EndMT and EndoMT as exact synonyms, is_a GO:0048762 mesenchymal cell differentiation, and its definition explicitly reaches beyond cushion and valve formation to the generation of cardiac fibroblasts and smooth muscle cells. The curator reached the false conclusion by truncating the output of an ontology search and inferring absence from a partial list. The error mattered because notes renders on the disorder page, so a claim that no substitute term is available would steer a future curator away from an apt term even if they arrived with evidence supporting it. The note now names GO:0140074, states that it is deliberately not used, and gives the reason on evidence grounds alone, namely that the node's evidence establishes only that the lesion exists and is unexplained by the flow model and does not establish that any cell-state transition occurs. It also directs a future curator with evidence for the transition to that term. The annotation itself remains removed, which the reviewer confirmed was the correct resolution. Validation after the change. just count-verified-snippets reported 44 of 44 verified and just validate-terms passed.

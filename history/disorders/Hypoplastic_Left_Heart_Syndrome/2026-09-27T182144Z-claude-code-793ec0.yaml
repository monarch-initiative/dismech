  summary: 'Genetics pass: gene wiring, phenotype wiring, HLHS2 mapping'
  details: |
    Genetics pass for the d2g gap list in issue 12280. The issue's single row for this parent was
    MONDO:0013752 hypoplastic left heart syndrome 2, whose MONDO definition reads "Any hypoplastic
    left heart syndrome in which the cause of the disease is a mutation in the NKX2-5 gene" and
    whose OWL axiom records hgnc:2488.

    Anchor audit first. The entry binds MONDO:0004933 hypoplastic left heart syndrome, which is
    exactly the disease the entry models. Read live from OLS4: it has two children, MONDO:0009433
    HLHS 1 (GJA1) and MONDO:0013752 HLHS 2 (NKX2-5), so the row reached this checklist through a
    correct anchor rather than an over-broad one. Nothing to re-anchor.

    Row disposition, and a decline. NKX2-5 was already curated in the genetic section as a
    SUSCEPTIBILITY contribution, with notes recording that no frequency or effect size is asserted
    and that it stands at the same evidential strength as NOTCH1. The concept is therefore recorded
    as a skos:narrowMatch in mappings.mondo_mappings rather than as a has_subtypes row. A
    gene-defined subtype row would assert a Mendelian form of the disease that this entry's own
    cited evidence does not reach: the entry's inheritance section argues, from PMID:38884762, that
    the inheritance is complex rather than simple and that single causal variants are not found in
    most patients. narrowMatch is the predicate used because the mapped class is a subset of this
    entry, following the pattern already in kb/disorders/Caroli_Disease.yaml and
    kb/disorders/Restrictive_Cardiomyopathy.yaml, and because narrowMatch retires the concept from
    the MONDO curation queue as CLAUDE.md documents.

    Pathograph wiring, which is where the real gap was. Before this change none of the five causal
    genetic records reached a pathophysiology node and only one of nine phenotypes had an incoming
    causal edge. Four gene descriptors were bound on the node whose own description is about which
    classes of gene contribute, and MYH6 additionally on the systemic right ventricle node, whose
    own cited evidence is the recessive MYH6 study. Every gene CURIE was read live from
    rest.genenames.org in the same step it was written: hgnc:2488 NKX2-5, hgnc:7881 NOTCH1,
    hgnc:7576 MYH6, hgnc:9906 RBFOX2. Six phenotype edges were added.

    Measured with dismech.qc_plugins on the committed tree, before and after:
      genetic[].mechanism_outlink      0/5 -> 4/5
      phenotypes[].causal_inlink       1/9 -> 7/9
      pathophysiology nodes with no downstream edge  1 -> 0

    Three deliberate declines. The Cytogenetic abnormality genetic record is left unwired: its
    lesion is a chromosome rather than a locus, it binds no gene term, and there is nothing to
    match against a node. Patent ductus arteriosus is left unwired because the entry's own evidence
    records its patency as maintained pharmacologically, so a causal edge from a malformation node
    would misattribute it. Coarctation of the aorta is left unwired because the phenotype's own
    review_notes already record that the cited source supports co-occurrence only and that no
    source in the cache reaches the mechanism.

    Two pre-existing issues are reported rather than fixed, both outside this change's scope.
    Endocardial fibroelastosis exists as both a pathophysiology node and a phenotype with the same
    name, which dismech.graph collapses into one node; that collision is why the before figure was
    1/9 rather than 0/9. And five evidence explanations still read "Graded PARTIAL because ...",
    prose left behind by the retirement of that enum value in issue 10003, which CLAUDE.md records
    as its own worklist.

    Validation on the committed tree: just validate, just validate-terms and just validate-disorders
    all pass; 61/61 snippets verified by just count-verified-snippets after reverting the 15
    reference caches that fix-references-cache renormalised during the run. No new reference was
    fetched for this entry. just check-genereviews reports NO_CHAPTER for GeneReviews, confirmed
    against cache/bookshelf/genereviews.csv, and an untagged StatPearls chapter (PMID:32119463),
    which is never a baseline and is not cited here.

    One related gap is noted for a future pass rather than curated: MONDO:0009433 HLHS 1 attributes
    the disease to GJA1 and is bound nowhere in the knowledge base. It is not a row of this issue.

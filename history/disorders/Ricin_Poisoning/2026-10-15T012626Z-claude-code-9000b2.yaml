  summary: 'LOINC tranche I: bind ricin and ricinine identity codes'
  details: |
    Bound LOINC:35493-6 (Ricin, Presence, generic Specimen) as measurements on the Direct identification of ricin in serum or body fluid by LC-MS/MS diagnosis row, and LOINC:54934-5 (Ricinine, Mass/volume, Urine -- the CDC biomonitoring program's own urinary biomarker code) on the Ricinine measurement in blood, urine or postmortem tissue row. Direct Monarch API searches for a ricinine blood or serum/plasma code both return zero results, confirmed rather than assumed from cache silence, so no code is bound for the blood or postmortem-tissue specimens that row also names. Merged a new notes sentence into the ricin row's pre-existing notes field rather than creating a duplicate key.

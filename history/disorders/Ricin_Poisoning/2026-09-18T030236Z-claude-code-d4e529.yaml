  summary: 'Address PR #12109 review suggestions'
  details: |
    Round two on PR #12109. The automated review approved with zero critical and zero important findings; these are the five optional suggestions plus its second opinion on clinical_burden, all acted on at the user's request.

    clinical_burden HIGH to VARIABLE. The reviewer's argument is the one the entry's own rationale was already making - burden depends on the route, and the schema's VARIABLE description covers variation across contexts explicitly. A three-orders-of-magnitude spread in lethal dose between ingestion and inhalation is about as wide as context-dependence gets, and HIGH was the one place this entry flattened a distinction it works hard everywhere else to preserve. The reason for the change, and the fact that HIGH remains defensible on its mortality-risk clause, are recorded in a notes field beside the level.

    Differential diagnoses. The sepsis entry gained three quotes that were sitting unused in an already-committed cache - the review's 'can mimic several common medical conditions, most notably septic shock' and its 'as bacterial sepsis, particularly when no history of ricin exposure is available' - plus PMID:16168316 for the mimicry claim from a peer-reviewed source rather than StatPearls. A second differential entry was added for toxin-induced wide-complex tachycardia, from PMID:41788434, a 2026 case report that also produced a new phenotype.

    The reviewer suggested adding the biothreat differential (tularemia, Q fever, staphylococcal enterotoxin B, phosgene) from primary biodefense literature. PubMed searches for a peer-reviewed source making those comparisons for ricin specifically returned nothing usable; that list reaches this entry only through StatPearls. Recorded as a genuine gap in the differential's notes rather than filled with an invented citation.

    Depurination RT-PCR assay - suggestion accepted in principle, not actionable. It would be the one diagnostic reading out this entry's own central node, but the paper has no PubMed record and its cached entry carries content_type: unavailable with no retrievable abstract, so no exact quote exists. Recorded in the diagnosis notes with the reason and a standing instruction to add it once a quotable record appears. Adding it with a paraphrase would be the fabrication the evidence rules exist to prevent.

    Yeast necessary-but-not-sufficient result. Added PMID:17101666 as two REFUTE items on the translational-arrest to apoptosis edge: A-chain mutants that depurinated and arrested translation as fully as wild type still failed to kill. Note the reviewer placed this on 'the depurination to apoptosis edges, which are currently the two uncited ones' - that is a misreading. The uncited edges are apoptosis to the gastrointestinal and hepatic/renal lesions; the depurination path runs through translational arrest and the ribotoxic stress response, both of which were already cited. The result qualifies the arrest edge, which is where it now sits, and it makes the parallel stress-kinase branch load-bearing rather than decorative.

    Splenic necrosis - declined, with the reason recorded. HP:6000232 exists, but the systematic review of fatal human cases never mentions the spleen; the finding is murine only and is carried on the murine model rather than promoted into the human clinical picture.

    RVEc added as a second vaccine treatment (PMID:26546259), including the stopped 100-microgram arm, since a dose-limiting finding is part of what is known about a candidate. That paper registers two NCT identifiers, which the deep-research report had not surfaced, so a clinical_trials block was added for NCT01317667 and NCT01846104 - closing the one checklist dimension the reviewer marked as having a gap for a reason other than absent literature.

    New phenotype: Bidirectional ventricular tachycardia (HP:0034040), wired from the shock node with an INDIRECT_UNKNOWN_INTERMEDIATES edge because the case report offers its mechanism as a hypothesis, having excluded re-entry rather than shown triggered activity.

    Two snippets from the systematic review were rejected by linkml-reference-validator after passing count-verified-snippets, because they crossed words the scanned PDF hyphen-breaks across lines. Worth knowing the two tools differ here: the fast counter normalizes cache defects and reports it, the gating validator does not. Both were re-quoted from clean spans.

    Post-round state: 200/200 snippets verified offline, 26/26 phenotypes causally connected, validate-disorders passing, all offline gates green.

  summary: 'Review round: Ricin Poisoning'
  details: |
    Pre-PR red-team review round against the entry created earlier in this session, run by a subagent following .claude/skills/dismech-pr-review. Three blocking findings, all verified independently against the cached sources before acting.

    BLOCKING. First, both immunotherapy treatments linked target_mechanisms to the RTB lectin-binding node with treatment_effect INHIBITS, described as acting before the B chain can engage a cell. The cited paper says the opposite: of the two antibodies raised, only the anti-RTA one (RicE5) protected in vivo, while the anti-RTB one (RicE8) neutralised in culture and failed in animals. RiVax is itself a recombinant A chain, so the antibody it raises cannot act on B-chain binding at all. Both edges were repointed to the delivery node, both descriptions rewritten, and the RicE8 negative added as evidence because the in-vitro/in-vivo dissociation is mechanistically informative and was being discarded.

    Second, two downstream edges from the apoptosis node - to the gastrointestinal lesion and to the hepatic/renal lesion - carried an autopsy-findings sentence as edge evidence. That sentence establishes the target lesions exist and says nothing about apoptosis causing them; the word does not appear in that paper. This is node-level evidence papering over an unsourced edge, which is the failure mode the repository warns about. The evidence was removed and both edges left uncited with the reason stated in the edge description. The mismatch between apoptosis and haemorrhagic necrosis as death modes is noted there too.

    Third, the environmental notes asserted that ECTO has no ricin exposure class. That was false. ECTO:9001524 exposure to Ricin is live, reaches ExO:0000002, and satisfies the ExposureTerm enum; it was absent from cache/ecto/terms.csv only because nothing in kb/ had ever bound it. All three route exposures were rebound from ECTO:0000537 to ECTO:9001524 and the note rewritten to record the error, since an absent cache row is not evidence that a term does not exist.

    HIGH. The human hypoglycaemia snippet was truncated immediately before the word 'human' while graded HUMAN_CLINICAL - as quoted it mentioned only porcine. Replaced with the paper's actual clinical-report sentence, and the same paper's macaque negative added as a REFUTE item, which materially changes the hypoglycemia_human_status discussion. A Cough phenotype whose only support was a vigilance recommendation that never uses the word was deleted. Three manufactured narrower matches were rebound to what the sources say - HP:0008151 to HP:0001928, HP:0031956 to HP:0031865, HP:0001878 for haemolysis - and an Oliguria phenotype inferred from 'multi-organ failure' was removed outright. The hepatic necrosis item was moved off an apologetic paraphrase onto the full text's own 'hepatic necrosis' sentence. Human evidence available in already-committed caches was added for Dyspnea, Pulmonary edema, Thrombocytopenia, Hypotension and the cytokine-release node, which were animal-only without needing to be. Eleven evidence_source: OTHER values were regraded (ten to IN_VITRO, the Markov autopsy quote to HUMAN_CLINICAL); four were left as OTHER deliberately. Two items whose explanations already described them as prior work gained quote_role: BACKGROUND and directness: INDIRECT.

    MEDIUM AND LOW. Five phenotypes the entry asserted in prose but never modelled were added and wired: Nausea, Fever, Increased total leukocyte count, Hemolytic anemia and Capillary leak. The bundled 'Reduction and Retrotranslocation' node was split in two, since it needed a separate citation for the reduction step. A diagnosis entry for direct LC-MS/MS identification of ricin in serum was added (PMID:33499033, PMID:35173958), closing the entry's weakest completeness dimension. The top-level description now hedges the inhalational and parenteral syndromes as animal-derived rather than stating them flatly. A notes claim that every StatPearls-sourced item was covered by a cited peer-reviewed source was false and was replaced with an accurate statement that the content was not carried over. The murine cardiac lesion moved from histopathology, which otherwise holds human autopsy findings, into the murine model where the species is unmissable. An uncited RiVax point-mutation claim was removed, and the CDC Category B / Chemical Weapons Convention status in the description gained a citation.

    Two snippets that matched only after cache-defect normalization were replaced with clean spans, because the systematic review is a scanned PDF that hyphen-breaks words across lines.

    Post-review state: 181/181 snippets verified offline, 25/25 phenotypes causally connected, validate-disorders passing, and all eleven offline gates green.

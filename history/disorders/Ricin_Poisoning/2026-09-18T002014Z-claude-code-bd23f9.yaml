  summary: 'Create: Ricin Poisoning'
  details: |
    New Disease entry for ricin poisoning (MONDO:0035511), an acute toxin-exposure intoxication with no prior coverage in kb/disorders/. Duplicate preflight was clean on all three surfaces: git grep over origin/main for the MONDO ID and for 'ricin' returned only amphotericin/griseofulvin substring hits, and GitHub PR and issue searches returned zero results.

    Deep research: one run with the claude_code provider (just research-disorder claude_code Ricin_Poisoning), producing research/Ricin_Poisoning-deep-research-claude_code.md plus its citations sidecar. The report predates the in-line validation blocks, so just validate-research-reference and just validate-research-terms were run over it afterwards; the retro-fitted sections record 31/31 references resolved with zero unresolved, and 46/47 CURIEs resolved with one obsolete (GO:0030433, not used here). The report cites almost entirely by URL rather than by PMID, so its PMC and DOI links were converted through the PMC ID Converter and the resulting PMIDs cited; its Wikipedia, FBI and news-article sources were not used at all. Every ontology binding in the entry was re-derived by a fresh OLS lookup rather than copied from the report - which mattered, because the report proposed HP:0001395 for hepatic necrosis where the correct HPO term is HP:0002605.

    Content: a fifteen-node causal chain from route-dependent delivery through RTB lectin binding, endocytosis, retrograde transport to the ER, A-chain retrotranslocation, sarcin-ricin loop depurination, and then branching into translational arrest and the ribotoxic stress response, converging on apoptosis and cytokine release and then on the three route-specific organ lesions and shock. 22 phenotypes, all causally connected (just list-disconnected-phenotypes reports 22/22). Three environmental exposures, one per route, each pathograph-linked. Five treatments including the investigational antibody, vaccine and Retro-2 arms. Three animal models with typed modeled_mechanisms links. Three discussions: a KNOWLEDGE_GAP on host genetic modifiers of cellular susceptibility (which is also why there is no genetic: section), a HUMAN_MODEL_MISMATCH on the inhalational syndrome being known only from animals, and a KNOWLEDGE_GAP on whether ricin hypoglycaemia is a human finding or murine.

    Validation: just validate-disorders passed (schema, terms, references batched), 162/162 snippets verified against the local cache with no network fetches; just validate-terms passed; just compliance reports 91.8% weighted. Offline gates run and passing: check-folded-hyphens (one finding introduced and fixed by reflowing 'route-dependent'), check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-entity-refs, check-causal-targets, check-case-collisions. just check-genereviews --online returns NO_CHAPTER for both Bookshelf collections, which the entry's notes record.

    Two bindings were deliberately left broader than the treatment they describe and the reason recorded in notes: NCIT has no gastric lavage term and NCIT:C68769 Decontamination is not reachable from NCIT:C25218, so gastrointestinal decontamination binds NCIT:C49236 Therapeutic Procedure; and NCIT:C77524 Activated Charcoal is not under NCIT:C1909 Pharmacologic Substance while CHEBI has no activated charcoal class, so therapeutic_agent is left empty there.

    Reference cache hygiene: 11 references fetched during research but cited by
    neither the entry nor the committed report were removed before commit. The
    cited-identifier list was re-derived from the entry immediately before
    pruning, and just count-verified-snippets was re-run on the pruned tree and
    still reports 162/162 verified offline. The eight DOI_* cache files and the
    report-cited PMIDs were kept deliberately, so the report's own retro-fitted
    "## Reference Validation" section stays reproducible without network access.

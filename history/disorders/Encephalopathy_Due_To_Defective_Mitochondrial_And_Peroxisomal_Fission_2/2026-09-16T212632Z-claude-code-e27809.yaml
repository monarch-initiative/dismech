  details: |
    Created kb/disorders/Encephalopathy_Due_To_Defective_Mitochondrial_And_Peroxisomal_Fission_2.yaml (EMPF2, MFF deficiency) from claim issue #11964. Deep research: openscientist. As with the DOCK2 and CMS7 runs in the same batch, the run's term-validation step aborted on an EBI network timeout, so the report carried no reference_validation or term_validation frontmatter; the ## Reference Validation section was added afterwards with just validate-research-reference (16/16 resolved, 0 unresolved, 0 off topic, 14 of 16 weighed on topic). Pathograph: 5 nodes from MFF loss through failure of DRP1-mediated scission into a peroxisomal maturation arm, a neuronal calcium/ROS arm, and regional neuronal loss. The peroxisomal node records a result that inverts the usual expectation - overall peroxisomal biochemistry is normal and what is lost is import competence, so a conventional peroxisomal screen looks clean. Two animal models: the Mff-null mouse, curated with a FAILS_TO_RECAPITULATE link against the neurological node because its lethal phenotype is cardiac, plus a RESCUES link for the Mfn1 rescue; and the Bullmastiff MFF frameshift, which is the closest organism-level match but localises to cerebellar nuclei rather than basal ganglia. Three evidence weaknesses are flagged in place rather than hidden: optic atrophy and peripheral neuropathy are named in PMID:26783368's title but not its cached abstract, so their snippets establish the source and their explanations say so, with a review_notes on the neuropathy asking for full-text re-verification; secondary microcephaly is retained with no evidence item at all and a review_notes recording which cached bodies were searched and with what terms. Nine reference_title values written from memory were wrong and were corrected against the cache frontmatter after the validator's title check caught them. Validation: just validate and just validate-disorders pass (25/25 snippets verified); duplicate-key, entity-ref, causal-target, enum-value, qualifier-term gates clean; list-gene-term-mismatches clean.

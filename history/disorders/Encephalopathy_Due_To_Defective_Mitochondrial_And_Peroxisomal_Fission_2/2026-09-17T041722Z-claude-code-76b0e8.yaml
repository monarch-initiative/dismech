  summary: 'Review round 1: correct a false claim about a cached abstract, re-evidence
    four claims, add five phenotypes'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #11984, answered in one push. The CRITICAL finding was correct and the error was mine.

    The error. The first version of this entry asserted, in the PR body, the top-level notes, two explanation fields and two review_notes, that PMID:26783368's cached abstract does not state optic atrophy, peripheral neuropathy or microcephaly, that the abstract 'stops before the case descriptions', and that a search of the cached body for 'microcephal-', 'head circumference' and 'OFC' returned no quotable hit. Every part of that is false. The abstract's RESULTS section states all three in two consecutive sentences: 'The patients became symptomatic within the first year of life, exhibiting seizures, developmental delay and acquired microcephaly. Dysphagia, spasticity and optic and peripheral neuropathy developed subsequently.' The same sentences appear at line 573 of this entry's own committed deep-research report. I verified the cache file directly before accepting the finding rather than taking the review's word for it.

    What makes this worse than a missing citation is that the prose was a claim about repository state, of exactly the kind CLAUDE.md warns rots in place, and it was written to look like diligence. A future curator reading it would have believed the full text was needed to close a gap that the committed abstract already closed. just check-source-defect-claims did not fire because the phrasing was bespoke rather than one of the patterns it matches.

    Fixes for the five CRITICAL items:
    1. Optic atrophy was cited to a BACKGROUND sentence about a prior index patient. Now carries the 'developed subsequently' result sentence, plus the paper's own CONCLUSIONS sentence making optic and peripheral neuropathy with seizures the trigger for MFF testing, and is marked diagnostic on that basis.
    2. Peripheral neuropathy was cited to 'Mitochondria are dynamic organelles which undergo continuous fission and fusion', which supports nothing. Now carries the same result sentence; the review_notes asking for full-text re-verification is deleted because there is nothing left to verify.
    3. Secondary microcephaly carried no evidence and the false search note. Now carries the 'acquired microcephaly' sentence, which also supports the acquired-not-congenital distinction the phenotype turns on.
    4. The top-level notes block is rewritten as an explicit correction rather than silently repaired, so the record of what was wrong survives.
    5. The Regional Neuronal Dysfunction and Loss node was cited to 'Here we investigated three new patients from two families', which establishes the source rather than the finding. Now cited to the imaging sentence naming the basal ganglia and subthalamic nucleus, which is what the node claims.

    IMPORTANT item on the diagnostic signature: the entry asserted the Leigh-like-MRI-with-normal-respiratory-chain dissociation in the description, the diagnosis description and the PR body, and evidenced it nowhere. The diagnosis record now carries both halves as separate evidence items, both from the same cached abstract.

    IMPORTANT item on phenotype coverage: five phenotypes added. Seizures, Dysphagia and Visual impairment are evidenced with exact quotes. Hypsarrhythmia and Hyperreflexia are added uncited, each with a review_notes saying precisely why: the HPO frequency annotations in the research report derive from PMID:26783368's full text, the cached abstract says 'seizures' without the semiology or the EEG and names spasticity without the reflexes. That is the same shape of note the microcephaly entry used to carry, with the difference that this one is true. The remaining annotated phenotypes (motor delay, hypotonia, muscle weakness, optic disc pallor, external ophthalmoplegia, absent speech, epileptic spasm) are not added; adding seven more uncited records would be padding rather than curation.

    All new phenotypes are wired from the Regional Neuronal Dysfunction and Loss node.

    Suggestions: a progression block was added with the two phases the abstract states explicitly, presenting features within the first year and the later-developing group, with the interval left unquantified because the source does not give one. The supportive-care treatment was NOT split into anticonvulsant, antispastic and feeding records: no cached source names a specific agent or regimen in an EMPF2 patient, so the three records' therapeutic_agent slots could not be filled from evidence. target_phenotypes for seizure, spasticity and dysphagia were added instead, which makes the management queryable without inventing agents, and the reasoning is recorded in the treatment notes. The animal-model attaches_to keying on species rather than name is noted as understood; it resolves and no change was made.

    Validation: just validate clean, 35/35 snippets verified (up from 25/25), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean.

  summary: 'Apply ai4c-reviewer suggestions from PR #8240 review'
  details: |
    Applied all five non-blocking suggestions from the ai4c-reviewer approval on
    PR #8240. The review found no CRITICAL or IMPORTANT issues and approved; these
    changes are polish, and each was assessed rather than applied mechanically.

    1. evidence_source consistency. Two evidence items quoting background or
       recommendation prose were retagged IN_VITRO to OTHER, matching the convention
       the entry sets elsewhere: the PMID:31435640 item on developmental GABRB3
       expression, which is intro framing citing prior work, and the PMID:33585817
       item stating that raising tonic currents should be safe and effective in
       loss-of-function variants, which is the authors' therapeutic recommendation
       inferred from their electrophysiology rather than a measured result. Both
       explanations now say why.

    2. Removed the one derived frequency band. Cortical dysplasia carried
       OCCASIONAL, inferred from "Neuroimaging was abnormal in 10 patients" — an
       upper bound of 10/26 = 38.5% for abnormal imaging overall, with the
       cortical-dysplasia subset itself unquantified. The band is dropped and the
       explanation now records why, matching the two sibling imaging phenotypes from
       the same source sentence, which never carried one. This is the conservative
       reading of docs/frequency-evidence-guidelines.md.

    3. Added a frequency-provenance and scope caveat to notes. The percentage-backed
       bands come from GABRB3-related-epilepsy cohorts rather than DEE43-restricted
       series; the 26-patient Yang cohort supplying most of them also contains one
       febrile-seizures-plus, one Dravet, and one myoclonic-atonic case. The notes
       now state that the bands apply to GABRB3-related epilepsy broadly and are
       close to, but not identical with, the DEE43 subset this entry is scoped to.

    4. Added two differential_diagnoses entries linking the existing
       Lennox-Gastaut_Syndrome and Epilepsy_of_Infancy_with_Migrating_Focal_Seizures
       KB entries. Both are framed explicitly as electroclinical syndrome
       presentations rather than competing aetiologies, since that is what they are;
       each carries distinguishing_features stating that the syndromic label does not
       identify the gene, and the EIMFS entry records that within GABRB3 it marks the
       reduced-desensitization gain-of-function subgroup — the group in which
       vigabatrin is hazardous. Three new evidence items, all snippet-verified.

    5. Removed unrelated cache churn. cache/mondo/terms.csv had picked up
       MONDO:0007754 (hyperhidrosis palmaris ET plantaris) from a rejected first
       draft of this entry. The file was restored from origin/main and regenerated
       with just validate-terms rather than hand-edited, leaving only the
       MONDO:0014921 row this entry needs. The equivalent row had already been
       removed from cache/enums/diseaseterm_*.csv before the first commit.

    Validation actually run and read after these changes:
    - just validate: passes, schema plus terms.
    - just count-verified-snippets: 88/88 snippets verified against cached
      references, up from 85/85 with the three new differential-diagnosis items.
    - just compliance: 99.5% global, 100.0% weighted; the single outstanding slot
      remains the deliberately empty datasets.
    - just validate-disorders, the batched pre-PR sweep CI runs: passed, exit code 0.
    - pytest tests/test_data.py -k "unique_names or subtype_foreign": 1887 passed.
    - just check-term-cache-integrity and just check-cache-order: both OK.

    Note that pushing this dismisses the reviewer's approval, because main is
    protected with dismiss_stale_reviews. That is the accepted cost of applying the
    fixes; a fresh review will be requested rather than the stale one restored.

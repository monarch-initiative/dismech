  summary: 'Create: GABRB3-Related Developmental and Epileptic Encephalopathy (DEE43)'
  details: |
    New de-novo curation of DEE43 — MONDO:0014921, GABRB3, OMIM:617113 — anchored on
    the two-class gain-of-function versus loss-of-function architecture of GABRB3
    variants and the resulting variant-class-dependent pharmacology: vigabatrin is
    beneficial in loss-of-function patients but causes a hypersensitivity reaction
    with hypotonia, sedation, and respiratory suppression in gain-of-function
    patients.

    Deep research: claude_code provider only, via `just research-disorder claude_code
    GABRB3-Related_Developmental_and_Epileptic_Encephalopathy`. The run did 25 web
    searches over 34 turns; the report is committed at
    research/GABRB3-Related_Developmental_and_Epileptic_Encephalopathy-deep-research-claude_code.md
    with its citations sidecar. NEC preflight against MONDO:0014921 returned PASS:
    GABRB3 mentioned 68 times, next-ranked gene UBE3A at 6, and the report's OMIM ID
    617113 matches the MONDO xref.

    Duplicate preflight: origin/main kb/ searched for MONDO:0014921, DEE43, EIEE43,
    and GABRB3 — no dedicated entry existed; GitHub PR and issue searches for GABRB3
    and the MONDO ID returned no prior or in-flight curation.

    GeneReviews baseline: PubMed searched for a GABRB3 GeneReviews chapter. None
    exists, so no GeneReviews baseline applies. Documented, no action needed.

    Three errors in the deep-research report were caught and corrected before
    curation, and are recorded in the entry notes so they are not reintroduced:
    GABRB3 was given as HGNC:4082, which is GABRB2 — the correct identifier is
    hgnc:4083; HP:0032500 was proposed for migrating focal seizures, but that term is
    Exacerbated by tobacco use; and HP:0002518 was proposed for Lennox-Gastaut
    syndrome, but that term is Abnormal periventricular white matter morphology.
    Every ontology term in the entry was verified against OAK.

    Pathophysiology: 9 nodes forming two parallel functional branches that converge
    on a shared excitation-inhibition node, with conformance declared against all
    five nodes of the epilepsy_excitation_inhibition_imbalance module. All 11 causal
    edges carry their own evidence.

    The `datasets` slot is deliberately left empty. All 12 `just discover-datasets`
    candidates were tagged DIRECT but were about other DEE genes — GLUL, CDKL5,
    SCN1A/Dravet, SCN8A, PNPLA8 — surfaced by a text match on the phrase
    "developmental epileptic encephalopathy" in the entry name. That is Named Entity
    Confusion reached through dataset search, so no accession was curated; the
    rationale is recorded in the entry notes.

    Validation actually run and read, at the time of writing:
    - 15 PMIDs fetched with `just fetch-reference`; no reference cache file was
      hand-written.
    - `just validate` on the entry: all validations passed, schema plus terms.
    - `just count-verified-snippets`: 85/85 snippets verified against cached
      references.
    - `just compliance`: 99.5% global, 100.0% weighted; the single outstanding slot
      is the deliberately empty `datasets`.
    - `just validate-disorders` on the changed file, the batched pre-PR sweep CI
      runs: schema, terms, and reference validation all passed, exit code 0, with
      85/85 snippets verified under --no-full-text.

    Known repository issue found but not fixed here: a ClinGen gene-disease validity
    assertion could not be cited because the pinned gene_validity.csv checksum in
    data/clingen/MANIFEST.yaml no longer matches the upstream file, so
    `just clingen-refresh` fails on a checksum mismatch. That is independent of this
    entry and is noted in it.

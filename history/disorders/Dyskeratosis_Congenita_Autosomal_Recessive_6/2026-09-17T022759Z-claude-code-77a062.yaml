  details: |
    Addresses the REQUEST_CHANGES review of 36df0cc0a (run 35173428875). One IMPORTANT finding, and it was correct.

    The sentence this entry already quotes for Esophageal stricture reads: esophageal and urethral stenosis, hip avascular necrosis. Two of the three features it names were not curated. The entry's stated exclusion rule did not cover the gap, as the review pointed out: that rule excludes GeneReviews family-level features not reported in a PARN patient, and these two were reported in a PARN patient, in a snippet already verified.

    Both are now curated, at deliberately different strengths, and the difference is a second rule the entry had not written down. The authors' own conclusion names the constellation it attributes to Hoyeraal-Hreidarsson syndrome: intrauterine growth retardation, central nervous system calcifications, cerebellar hypoplasia, esophageal or urethral stenosis, and cytopenias. Urethral stenosis is in that list; avascular necrosis is not. So urethral stenosis is curated as a disease feature and carries the conclusion sentence as a second evidence item, while avascular necrosis is curated as a finding reported in a patient but not claimed by its reporters as part of the syndrome, with that stated in its description.

    The review offered a reasonable alternative disposition, that a single adolescent's hip avascular necrosis post-transplant is attributable to treatment rather than genotype. That does not hold on the text. The transplant was at age fourteen and the patient died day plus 119; the only steroids described are post-transplant, given for graft versus host disease. The necrosis appears in the medical history preceding transplant. So treatment attribution is excluded by the source rather than merely unlikely, and the reason it is curated at lower strength is the authors' constellation, not a suspected treatment cause. Both facts are recorded.

    Term selection. The review named its candidates as leads and said explicitly not to take them from the comment. All three resolve correctly, which is the first time in this batch that a reviewer-supplied CURIE has. HP:0008661 Urethral stenosis matches the source wording exactly and is used. For the necrosis the choice was between HP:0010885 Avascular necrosis and HP:0005743 Avascular necrosis of the capital femoral epiphysis; the source says hip avascular necrosis without specifying the femoral head growth plate, so the narrower term would assert a site the paper does not, and HP:0010885 is used with hip carried in preferred_term.

    Declined: pruning the seven added but uncited references_cache files. Consistent with the same decision on the sibling PRs. They are the deep-research screening set, and pruning caches against a cited-reference list is how a file the entry still needs gets deleted, which happened once earlier in this session.

    Validation: just validate passed with 45/45 snippets verified, up from 42/42. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-genereviews (TAGGED), check-snippet-length, check-title-snippets and check-snippet-grading all OK.

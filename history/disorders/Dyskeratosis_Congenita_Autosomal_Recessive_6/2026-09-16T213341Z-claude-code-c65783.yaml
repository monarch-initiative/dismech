  details: |
    Created kb/disorders/Dyskeratosis_Congenita_Autosomal_Recessive_6.yaml (MONDO:0014600, PARN) as a per-genotype telomere biology disorder entry, following the precedent of Dyskeratosis_Congenita_Autosomal_Recessive_8. Deep research: Perplexity sonar-deep-research (359s). The run exited 3 because term validation hit a 5-second OLS read timeout on a single UBERON CURIE, and that failure discarded the reference-validation section as well, so the report was written with neither block. Both were retro-fitted afterwards with just validate-research-reference and just validate-research-terms; the term validation needed several attempts before OLS responded within the timeout. Retro-fitted sections carry the markdown but no frontmatter summary, so read the sections at the bottom of the report rather than the frontmatter. Reference validation reports 'No PMID or DOI references were found in this report' -- zero of the report's 20 citations are checkable identifiers, they are URLs. Term validation found 11 of 49 checked labels naming a different term, including MONDO:0009280 offered as 'dyskeratosis congenita' (MONDO: monosodium glutamate sensitivity) and HP:0003765 as 'Oral leukoplakia' (HPO: Psoriasiform dermatitis). just preflight-dr returned WARN: the report cites OMIM 604212, which is the PARN gene MIM, where MONDO:0014600 xrefs the phenotype MIM 616353. Nothing was taken from the report. Four evidence items carry quote_role BACKGROUND or REVIEW_SYNTHESIS, which is not incidental: with roughly nine reported patients, most statements about this disease's clinical picture appear in the introductions of molecular papers or in a GeneReviews chapter about the disorder family. Validated: just validate (42/42 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-length, check-snippet-grading, check-enum-values.

  summary: 'Pre-review pass: connect the cerebellar node and correct a frequency band'
  details: |
    No review has landed on this PR yet. This is a self-audit against the systematic defects the reviewer found on the sibling PRs from the same curation batch (#11983, #11985, #11986), applied here before this entry's own review runs. Two of the three were present; the GeneReviews check already reported TAGGED and the chapter is genuinely mined, so that one did not apply.

    Orphan pathophysiology node. Developmental Failure of Cerebellum and Growth had two outbound edges but no inbound edge. Its description already said the step from short telomeres to cerebellar hypoplasia is not established and named impaired ribosome biogenesis as an untested alternative, which is honest about the mechanism but leaves the node unconnected — and an unconnected pathophysiology node renders at the leftmost layer as an initiating step, presenting the Hoyeraal-Hreidarsson features as a separate primary lesion. That claims more than an unresolved route does. It is now a downstream target of Telomerase Insufficiency and Telomere Shortening with INDIRECT_UNKNOWN_INTERMEDIATES, and the edge description carries the same caveat the node description already made.

    Frequency without a denominator. Bone marrow hypocellularity was VERY_FREQUENT with no published fraction for this genotype and no definitional status; it is now FREQUENT. Short telomere length stays VERY_FREQUENT because it is the diagnostic test — telomere length below the first centile is how a telomere biology disorder is identified, so every ascertained patient has it by construction. That basis is now stated in the description, along with the contrast against the marrow finding, so the bands read as reasoned rather than assigned. With roughly nine reported patients there is no PARN-specific denominator for either.

    Validation: just validate passed with 42/42 snippets verified, unchanged since no evidence was added. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-genereviews (TAGGED), check-snippet-length, check-title-snippets and check-snippet-grading all OK.

  summary: 'Create: Griscelli_Syndrome'
  details: |
    Created during a review of Mendelian skin disorder coverage. Curated de novo from primary PubMed literature; no deep-research provider output was used. Every evidence snippet was verified as an exact substring of its cached PubMed abstract with just count-verified-snippets. Schema validated with linkml-validate against the Disease class; ontology terms validated with just validate-terms; just check-duplicate-keys, check-not4curation, check-title-snippets, check-snippet-length and check-folded-hyphens all pass. Where an ontology term was too broad or absent (Darier nail banding, palmoplantar pits) the finding is recorded in prose rather than bound to an ill-fitting term.
    Scoped to GS2 (RAB27A) rather than curated as an umbrella over all three Griscelli forms: MONDO has obsoleted its umbrella term (MONDO:0000083), leaving three sibling terms with no current parent, and promoting one sibling's term to stand for all three would have been a false umbrella. GS1/MYO5A and GS3/MLPH are recorded in the entry notes for their own future entries, with a Grouping over the three flagged as the right structure if all are curated.

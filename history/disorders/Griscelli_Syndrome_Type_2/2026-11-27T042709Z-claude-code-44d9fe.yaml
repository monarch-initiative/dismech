  details: |
    Added PMID:12058346 ('Most patients with GS display the hemophagocytic syndrome...') as evidence for the VERY_FREQUENT band on the HLH phenotype, which previously rested on a single case report. Marked the PMID:12058346 item on the Loss of Cytotoxic Granule Exocytosis -> Recurrent Infections edge directness INDIRECT and reworded its explanation, because the quote does not mention infection; the direct quote in the asta report comes from DOI:10.32677/ijcr.2019.v05.i06.002, whose fetch returns no abstract or full text, so it cannot be cited. Removed zygosity HOMOZYGOUS from the trigger node, because GS2 is biallelic and also occurs as compound heterozygous; the genetic_context description now says so. Changed the prevalence band from ULTRA_RARE to RARE to match the quote. Changed Genetic Counseling's therapeutic_modality from BEHAVIORAL to OTHER.

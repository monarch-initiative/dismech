  details: |
    Added conforms_to declarations attaching existing pathophysiology nodes to the new lysosome_related_organelle_biogenesis module. No mechanism content, evidence or ontology bindings changed. Attachment points were chosen to reflect where each disorder's pigmentary failure actually lies rather than to make the three entries look uniform: only Griscelli attaches at the module's delivery central effector, because only there is the melanosome fully built and pigmented and simply never transferred; Hermansky-Pudlak transfers under-loaded melanosomes and Chediak-Higashi giant poorly-transferred ones, so both attach at the melanosome arm and the other-LRO arm instead. Validated with linkml-validate, the conforms_to foreign-key tests in tests/test_data.py, count-verified-snippets (118/118) and check-duplicate-keys.

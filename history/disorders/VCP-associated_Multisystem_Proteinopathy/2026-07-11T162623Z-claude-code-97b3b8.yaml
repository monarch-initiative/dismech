  details: |
    Added an investigational preclinical AAV.hBAG3 gene-therapy treatment to the existing VCP-associated multisystem proteinopathy entry, with MODEL_ORGANISM evidence from PMID:42423109. target_mechanisms uses treatment_effect RESTORES against the 'Defective autophagosome maturation' node; therapeutic_modality GENE_THERAPY; treatment_term MAXO:0001001. Also added VCP-related hereditary inclusion body myositis / hIBM synonyms. Rationale: lit-scan issue #6144 proposed a NEW hIBM entry, but VCP-hIBM is the myopathy arm of this existing VCP-MSP/IBMPFD entry -- same gene, same TDP-43 and autophagy-lysosome mechanism -- so a separate entry would duplicate. Validated with just validate, validate-references, and validate-terms; all pass.

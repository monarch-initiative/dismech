  summary: Add hIBM synonyms to VCP-MSP entry
  details: |
    Added three synonyms VCP-related hereditary inclusion body myositis, hereditary inclusion body myositis, and hIBM to the existing VCP-associated multisystem proteinopathy entry MONDO:0008178. Rationale: lit-scan issue 6144 proposed a NEW hIBM entry, but VCP-hIBM is the myopathy arm of this existing VCP-MSP/IBMPFD entry - same gene VCP, same TDP-43/autophagy-lysosome mechanism - so a separate entry would duplicate. The AAV.hBAG3 gene-therapy content from triggering paper PMID:42423109 was already merged via PR 6326; these synonyms are the only non-redundant remainder, also carried in conflicted form by the now-superseded draft PR 6182. Synonyms-only change; no evidence or ontology-term additions.

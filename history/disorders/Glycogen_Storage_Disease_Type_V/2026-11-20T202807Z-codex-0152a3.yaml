  summary: Map Glycogen Storage Disease Type V to OMIMPS:232200
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS232200 contains OMIM:232600, glycogen storage disease V, together with hepatic, lysosomal, and other muscular glycogenoses. This entry is the PYGM-related muscle glycogen phosphorylase deficiency known as McArdle disease, making the general series a broader target. The mapping preserves the specific MONDO:0009293 disease identity and does not equate McArdle disease with all glycogen storage disorders.

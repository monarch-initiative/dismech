  summary: 'Create: NKGCD / MCM4 deficiency (IMD54)'
  details: |
    De-novo curation of NKGCD / MCM4 deficiency (MONDO:0012383, IMD54), claimed at
    #11154. entry_type resolved to DISEASE and the stub deleted.

    Scope. kb/disorders/Familial_Glucocorticoid_Deficiency.yaml already mentions
    MONDO:0012383 in a notes block and records that MONDO models the full NKGCD
    phenotype as a distinct immunodeficiency disease rather than a numbered FGD
    subtype. This entry is that separate record and curates the adrenal arm only to
    the extent that it is MCM4-specific.

    Deep research: one OpenScientist run, committed with the entry. It contributed
    the dormant-origin mechanism (PMID:21641805), the NK replication-stress work
    (PMID:38809096) and the CMG helicase differential. Its own validation: 13/13
    references resolved, 37 terms with 34 verified and one obsolete.

    Two report terms were wrong and are not bound. HP:0032152, offered as
    "Herpesvirus infection", is Keratosis pilaris. HP:0000833 for glucose
    intolerance is obsolete. The report's term validation caught the obsolete term
    and not the mislabelled one, because it checked only 9 of the 37 terms it
    extracted; reported on #10459.

    Two claims deliberately not asserted. No neoplasia phenotype is curated: the
    founding paper suggests increased neoplastic risk and the Chaos3 mouse develops
    mammary adenocarcinoma in over 80% of homozygous females, but no human case is
    reported, so the claim lives in a KNOWLEDGE_GAP rather than in a phenotype slot.
    The adrenal edge is typed INDIRECT_UNKNOWN_INTERMEDIATES because the supporting
    histology is murine and the clinicians who described the syndrome wrote that the
    FGD presentation was delayed and might be a secondary phenotype.

    The Mcm4-Chaos3 mouse is linked to two nodes with per-link limitations. The
    first records that its hypomorphism arises by a different route from the human
    allele (destabilizing missense versus frameshift rescued by downstream
    re-initiation), so it models residual-activity biology but not the isoform
    switch. A model-level note records that no in vivo model of the NK phenotype
    exists at all: Chaos3 was characterized for instability and tumours, not for NK
    subsets.

    The MCM4/PRKDC naming in PMID:22499342 is preserved verbatim in its snippet
    rather than corrected to MCM4, and the explanation says why: the two genes are
    adjacent at 8q11 and that paper reports the locus, not the resolved gene.

    Validation: just validate-disorders passes schema, terms and 23/23 snippets.
    check-entity-refs, check-causal-targets, check-duplicate-keys and
    check-enum-values are clean. preflight-dr PASSes with MCM4 mentioned 32 times
    and the OMIM number matching. Twelve references fetched during research but not
    cited were pruned from references_cache rather than staged.

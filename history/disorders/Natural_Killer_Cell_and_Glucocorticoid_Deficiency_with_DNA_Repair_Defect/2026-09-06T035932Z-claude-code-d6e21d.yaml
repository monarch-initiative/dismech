  summary: Add glucocorticoid replacement; join all phenotypes to the pathograph
  details: |
    Cross-applied two blocking findings the reviewer raised on the sibling PR 11177 (CARD11): a missing treatments section for a disease with a documented management step, and phenotypes with no incoming causal edge.

    Treatments. The entry had no treatments section at all, for a syndrome whose adrenal insufficiency is life-threatening and routinely treated. Added glucocorticoid replacement with target_phenotypes on Primary adrenal insufficiency and target_mechanisms on Loss of Steroidogenic Cells in the Zona Fasciculata, quoting a sentence already present in the cached full text of PMID:22354167 recording that three of the four index-kindred patients required corticosteroid replacement. The mechanism-link description states that replacement acts downstream of the lesion rather than on it.

    Deliberately not added, with the reason recorded in notes: the deep-research report also proposes antiviral surveillance and haematopoietic stem cell transplantation. It derives the first from general NK-deficiency management principles and the second by analogy to POLD1 deficiency, so neither is evidence about this disease. The report itself notes that transplantation would not correct the adrenal or growth phenotype, since those compartments are not haematopoietic.

    Pathograph. Two of five phenotypes had no incoming edge. Abnormal distribution of CD56 bright/dim natural killer cells is now DIRECT from Failure of CD56-dim NK Cell Maturation, being the phenotype-side statement of that node. Chromosome breakage is DIRECT from Replication Stress and Genomic Instability, the cytogenetic readout of that node. Verified by recomputing in-edges: zero orphans.

    Validation: schema pass, term validation pass, 25/25 snippets verified against the local cache, entity refs, causal targets, duplicate keys and enum values clean. Whole-KB gates report nothing for this entry. No cache change.

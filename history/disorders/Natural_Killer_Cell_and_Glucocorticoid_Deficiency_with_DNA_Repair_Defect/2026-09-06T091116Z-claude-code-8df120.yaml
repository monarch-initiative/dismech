  summary: 'Review round 2: three prose claims contradicted by the committed full
    text'
  details: |
    All three blocking findings were correct and share one cause: the entry reasoned from abstracts while committing the 1,133-line full text of PMID:22354167, whose Methods and Discussion say more. First, the notes and the cancer knowledge gap both said no human neoplasia case had been reported. The founding report describes an EBV-driven lymphoproliferative disorder of the small bowel in the index case P1.3, resected at two years nine months, the authors list lymphoma in their own summary of the syndrome, and the IUIS row this entry already quotes lists B cell lymphoma. Curated as a phenotype bound to HP:0005523 at OCCASIONAL, with an INDIRECT_UNKNOWN_INTERMEDIATES edge from the instability node, and the knowledge gap kept and rewritten to ask for the risk estimate rather than to deny the case. Second, three of the four index-kindred patients miscounted the source: kindred A has five affected children, the quoted sentence covers the four besides index case P1.3, and P1.3 had adrenal insufficiency too, so it is four of five in kindred A and five of six across both kindreds, with P1.1 the only exception. Corrected, with the index case's own adrenal sentence added as evidence. Third, the stated reason for excluding transplantation was that it rested on the report's analogy to POLD1 deficiency; P2.1 in kindred B underwent bone marrow transplantation at age eight. Transplantation is now curated with the hedge the source forces, carrying no mechanism or phenotype link because no outcome is reported, and the notes record the correction. Both suggestions taken: pulmonary fibrosis (FREQUENT, three of six patients, two of the reported deaths respiratory) and bronchiectasis (OCCASIONAL) added as sequelae of the recurrent viral infections, and a notes paragraph records that kindred B is an unrelated family independently confirming the phenotype. Three of my own errors were caught before the push rather than by a reviewer: a reference_title written from memory that was actually the companion paper's title, an inserted causal edge that split an existing edge and duplicated its description key (caught by check-duplicate-keys), and a treatment block inserted into the diagnosis list (caught by schema validation). The transplantation snippet is quoted around a hyphenated line break in the cached extraction, since the full sentence is not a substring; the explanation says so and gives the whole sentence. Validation: schema, terms, 33/33 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms clean; five whole-KB gates report nothing naming this entry; graph recomputed at 8 phenotypes with zero orphans; the transplantation entry is deliberately the one unconnected treatment; no cache change.

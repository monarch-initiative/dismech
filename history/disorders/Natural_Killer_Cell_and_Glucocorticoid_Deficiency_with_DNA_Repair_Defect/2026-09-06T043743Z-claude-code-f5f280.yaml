  summary: 'Review round 1: therapeutic_agent, an evidence regrade, and a frequency
    the source contradicts'
  details: |
    Addressed the ai4c-reviewer review on PR 11170. The reviewer's job errored before it could submit the formal review, so the findings arrived as a comment; they are correct either way and are treated as blocking.

    1. The glucocorticoid treatment carried the agent class in the action slot ('corticosteroid replacement therapy' as treatment_term.preferred_term) and had no therapeutic_agent, so the drug identity was unqueryable. CLAUDE.md is explicit on both halves. Now Pharmacotherapy in the action slot with cortisol (CHEBI:17650) as therapeutic_agent, matching Familial_Glucocorticoid_Deficiency, which is the entry this one is deliberately scoped against, so the two are now cross-queryable on the adrenal arm.

    2. The NK maturation snippet was graded HUMAN_CLINICAL. It reports an in vitro result: the cached full text shows the dependence was established by CFSE labelling and IL-2 stimulation of cultured patient NK cells. Regraded IN_VITRO, which also removes an internal inconsistency, since the fibroblast complementation from the same paper was already IN_VITRO. The clinical observation that patients lack the subset stays HUMAN_CLINICAL where it appears on the phenotype and the diagnosis.

    3. Primary adrenal insufficiency was OBLIGATE, which the schema defines as 100%. The sentence this entry quotes twice says adrenal insufficiency developed in three patients while P1.1 was less severely affected. Lowered to VERY_FREQUENT. The description now states the observed fraction and explicitly declines to choose between incomplete penetrance and later onset, because no cited source settles it.

    Suggestions taken: the treatment's mechanism link gained treatment_effect BYPASSES, which is what its own description was already saying in prose; and an iuis_category classification was added, citing the IUIS 2022 table's own description of MCM4 deficiency rather than only the framework paper, so the placement is evidenced and not just asserted in notes.

    Not taken: replacing the review-based dormant-origin citation with a primary reduced-MCM2-7 mouse paper. That would need a new reference and new research, and the reviewer marked it a suggestion.

    Validation: schema pass, term validation pass, 26/26 snippets verified against the local cache (was 25/25), entity refs, causal targets, duplicate keys, enum values and qualifier terms clean, whole-KB gates report nothing for this entry.

  details: |
    The review's third suggestion was that the dormant-origin node, the entry's central mechanistic idea, rested on a review article (PMID:21641805) and would be anchored harder by a primary reduced-MCM2-7 mouse paper. I deferred it as needing new research. It did, and the research is now done. PMID:23975433 (Wallace et al., Oncogene 2013) is a primary study in the Mcm4 Chaos3 allele, which is the same mouse this entry already curates as an animal model, and its abstract states the node end to end: an amino-acid alteration destabilizing the MCM2-7 helicase, fewer dormant replication origins, more stalled forks, and consequent genomic instability and cancer. Added as a second evidence item alongside the review, which stays because it states the general rule across MCM2-7 hypomorphs. Worth recording that two other candidate PMIDs I considered from memory turned out on lookup to be a smoking-inequalities study and a school-trauma pilot; the metadata was checked before anything was cited, which is the rule that keeps invented citations out. 27/27 snippets verified, up from 26/26. Schema, terms, entity refs, causal targets, duplicate keys, enum values, qualifier terms clean; five whole-KB gates report nothing naming this entry; no cache change; one reference cache file added.

  summary: 'Create: Dihydropyrimidinase Deficiency'
  details: |
    Created kb/disorders/Dihydropyrimidinase_Deficiency.yaml for MONDO:0009111 (label dihydropyrimidinuria), the DPYS step of pyrimidine catabolism, as a sibling of the existing Dihydropyrimidine_Dehydrogenase_Deficiency entry which mentions DPYS only in passing.

    Deep research: one OpenScientist run (research/Dihydropyrimidinase_Deficiency-deep-research-openscientist.md). Its validation blocks reported 20/20 references resolved and 25/27 terms resolved with no term named as a different term. just preflight-dr returned PASS (DPYS mentioned 32 times against DPYD 4, OMIM 222748 matching MONDO's xref). Four citations were taken from the report after reading each abstract: PMID:9718352, PMID:35961217, PMID:30384990 and the recurrence of p.R302Q. The rest of the entry was built from a PubMed sweep run before the report completed.

    The report's most useful contribution was PMID:9718352, which reports no significant difference in residual enzyme activity between the variants carried by symptomatic and by asymptomatic individuals. That is a direct measured refutation of the obvious explanation for this disease's variability, so it is cited as REFUTE on the neurotoxicity hypothesis and the genetic notes were rewritten from 'has not been shown to predict it' to say what was actually measured.

    Deliberately not asserted. The neurological phenotype is not placed downstream of the metabolite disturbance in the pathograph, because biochemically identical siblings differ in whether they are affected (PMID:18600547, PMID:17383919); that link is an EMERGING mechanistic hypothesis instead, the same treatment the sibling DPD entry gives the same problem. The fluoropyrimidine-toxicity arm is modelled but kept thin: it rests on one attributed case (PMID:14555507) plus two cohorts that disagree, and the cohort finding no association (PMID:38215018) is cited as REFUTE on the same node rather than omitted, with its scope difference (common variants genotyped, not rare ones sequenced) stated in the explanation.

    Two prevalence records are carried because the published case count (fewer than 40) and a quoted estimate of 2 in 20,000 are different quantities in open tension; the notes say so and say not to quote them as one number.

    The report also offered a GTEx-based argument that DPYS is a liver and kidney enzyme not expressed in brain, implying the CNS effect is non-cell-autonomous. That is a genuinely interesting lead but it is the provider's own analysis with no citable source found for the human tissue distribution, so it was left out rather than written in unsourced.

    Validation: just validate, just validate-disorders (48/48 snippets, 48 titles, 0 issues), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-enum-values, check-genereviews (NO_CHAPTER, which the entry's notes record).

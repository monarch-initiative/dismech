  summary: 'Review round 1: phenotype frequencies, treatments, hypothesis-group edges'
  details: |
    Review round 1 on PR #14301, answering the reviewer's three items and an adversarial self-review.

    Reviewer item 1, phenotype frequencies. PMID:38199782 is cached as full text and its Table 3 pools 35 patients, which the entry cited eight times without mining. Added intellectual disability (16/35, FREQUENT), hypotonia (9/35, OCCASIONAL), feeding difficulties (8/35) and failure to thrive (6/35), and banded the existing seizure, developmental delay, white-matter, autism, microcephaly and vomiting rows from the same table. Where the paper's table and its prose disagree on hypotonia, 9 of 35 against 10 of 35, the table row is cited and the discrepancy is stated rather than averaged. The Seizure description no longer says frequency cannot be banded; it says a pooled figure exists and is subject to ascertainment bias, which is the honest reason to read it carefully.

    Reviewer item 2, prevalence. prevalence_class was ABOVE_1_IN_1000 against rate_per_100000 10.0, which is two bands out: the schema puts 10 per 100,000 in BAND_1_5_PER_10000. Corrected, and measure_type moved to UNKNOWN because the source says only an estimated prevalence of 2/20,000 without saying whether it is point or lifetime.

    Reviewer item 3, the disconnected phenotypes. The claim in the first PR body that this entry treated the neurotoxicity link the same way as the sibling DPD entry was false: that entry keeps the link as downstream edges tagged with its hypothesis group, so its graph stays connected. This entry declared the group and drew no edge, leaving every clinical phenotype an island at 2/10 connected. Added INDIRECT_UNKNOWN_INTERMEDIATES edges from the metabolite node to the seven neurological phenotypes, each tagged dihydropyrimidine_accumulation_neurotoxicity, which keeps the link unasserted while connecting the graph. Now 9/14. The gastrointestinal, cardiac and parkinsonism phenotypes are deliberately left unwired, since no source proposes a route.

    Self-review findings taken. Two evidence items were graded SUPPORT for sentences saying the claim is unestablished, with explanations that admitted it; regraded NO_EVIDENCE, which is what a sentence recording an open question is. The PMID:9718352 REFUTE item keeps its direction but gains directness INDIRECT and moves to IN_VITRO, since the activities were measured in an expression system, and its explanation no longer says the metabolite disturbance cannot be what decides the phenotype, because the comparison is one symptomatic against five asymptomatic individuals. Vomiting was bound to HP:0002013 on a snippet about gastrointestinal abnormalities generally; it now cites the vomiting row and keeps the general sentence as INDIRECT. Three VERY_FREQUENT bands rested on single-patient snippets and now cite the all-patients statement from the pooled review. Two bindings were coarser than their own sources: complete atrioventricular septal defect to HP:0001674 and levodopa-responsive juvenile parkinsonism to HP:0002548. Two framing sentences gained quote_role BACKGROUND, one REVIEW_SYNTHESIS on a pure case report became BACKGROUND, and an enzymology sentence graded HUMAN_CLINICAL became IN_VITRO. An uncited organ-distribution clause was removed. The edge to fluoropyrimidine cytotoxicity was DIRECT with no evidence and asserted that no pharmacokinetic study was found; it is now INDIRECT_KNOWN_INTERMEDIATES, cites the 5,6-dihydro-5-FU back-conversion route from the cached review, and narrows the negative claim to what was actually searched.

    Added a treatments block: fluoropyrimidine avoidance or dose reduction, and levodopa for the parkinsonian presentation. The entry previously called parkinsonism treatable while carrying no treatment. One CURIE worth recording: the committed research report offers NCIT:C739 for levodopa, which is Phenobarbital. The lookup gave NCIT:C611, which is what is bound. That is the second wrong-CURIE catch in this run and the first to come from a deep-research report rather than from memory.

    Validation: just validate-disorders (66/66 snippets, 66 titles, 0 issues), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-coarse-phenotypes.

  summary: 'Review round 2: remove misleading NCIT binding on drug avoidance'
  details: |
    Review round 2 on PR #14301. The reviewer confirmed all three round-1 blocking items fixed and raised one new item, which was right.

    The Fluoropyrimidine Avoidance treatment was bound to NCIT:C15986 Pharmacotherapy. That treatment consists of not administering a drug, so the binding asserted the opposite of the record's meaning, and a query for pharmacotherapy treatments would have returned a drug-withholding record. Removed the term rather than replacing it, and recorded in notes which searches were run and what each returned, because a negative-existence claim is the one assertion no gate can reach.

    The searches, against ols:ncit: l~drug avoidance, l~drug withholding, l~dose reduction and l~drug discontinuation return nothing; l~avoidance returns NCIT:C54264 Avoidance, a behavioural concept, plus questionnaire items; l~contraindication returns NCIT:C50646 Medical Contraindication and NCIT:C37933 Contraindicated, a finding and a qualifier rather than clinical actions; l~treatment modification returns protocol-administration items only. None is a clinical action, so no term is bound and the free-text preferred_term carries the meaning.

    therapeutic_modality moved from BEHAVIORAL to OTHER. A prescribing decision is not the behavioural, physical or dietary intervention that value describes.

    Took the suggestion as well: nine of 35 published patients were asymptomatic at diagnosis, which is the closest thing to a penetrance figure this disease has. Added to the neurotoxicity hypothesis as a REFUTE item, since it counts against the metabolite disturbance being sufficient, and quantified in the hypothesis notes.


  summary: 'Address automated review on PR #16352'
  details: |
    Addressed the automated reviewer's CHANGES_REQUESTED verdict on PR #16352, after re-verifying every claim against the cached PMID:40931063 full text rather than taking the findings on trust. All were confirmed real: (1) corrected overstated per-patient counts for Leukopenia (was "all five", corrected to 4/5: P1-P4), Thrombocytopenia (corrected to 4/5: P2,P3,P4,P5), and Anti-dsDNA antibody positivity (corrected to 3/5: P1-P3; P4 is anti-Sm/anticardiolipin, P5 is MPO-ANCA) by re-reading each of the five case descriptions; (2) fixed the baricitinib RESCUES link's readout and link-level evidence, which quoted the glomerular IgG/C3 deposition sentence while the readout and interpretation described renal gene expression -- both now quote the renal inflammatory/interferon-stimulated gene-expression clause of the same source sentence; (3) re-graded two ex vivo patient-PBMC assays (the baricitinib treatment-response qPCR and the exonuclease residual-substrate assay) from HUMAN_CLINICAL to IN_VITRO, since both are cell-culture experiments on patient cells rather than clinical observations; (4) added two missing renal phenotypes documented in a majority of the five-patient cohort -- Crescentic glomerulonephritis (HP:0008653, 4/5: P1,P2,P3,P5) and Stage 5 chronic kidney disease (HP:0003774, 2/5: P3,P5 progressed to maintenance haemodialysis) -- wired as downstream targets of the Immune Complex-Mediated Lupus Nephritis node. Also took the reviewer's optional suggestions: added quote_role BACKGROUND (and evidence_source OTHER) to the PLD4-biology snippet taken from the paper's introduction; added a GO:0060337 (type I interferon-mediated signaling pathway, INCREASED) biological_process alongside the existing GO:0032481 on the Type I Interferon Pathway Hyperactivation node; bound STING1 (hgnc:27962) to the STING-Dependent Signal Amplification node (no suitable positive cGAS-STING GO biological_process term exists in GO at the time of writing -- only a symbiont-suppression variant and the STING complex cellular-component term -- so no process term was added there, per the Ontology Term Contract's rule against manufacturing a term that does not fit); and fixed the Leukopenia descriptor's preferred_term from "leucopenia/lymphopenia" to "Leukopenia", since lymphopenia specifically is not reported. Declined the reviewer's request for a dedicated research/*-deep-research-*.md artifact: ran a targeted web search instead (not a full deep-research pass) confirming no newer case reports or follow-up papers exist beyond the 2025 discovery paper; the only related prior work is the pre-existing Pld3/Pld4 double-knockout (2018) and Pld4-thss BALB/c (2023) mouse studies, which describe an HLH-like phenotype and TLR9-dependent lupus-like disease respectively in different, older mouse models, not a human SLE case series, and are out of scope for this single-paper disease entry. Re-ran the full validation suite after every fix: just validate, just count-verified-snippets (38/38), just validate-disorders, just check-causal-targets, just check-gene-activity-grounding, just check-entity-refs, just check-coarse-phenotypes, just check-duplicate-keys, just check-block-scalar-comments, just check-enum-values, just check-logical-rules, just check-term-cache-integrity, just check-cache-order, and just check-snippet-grading (whole-KB) -- all clean, with no new cache rows needed since all four newly-cited CURIEs (GO:0060337, hgnc:27962, HP:0003774, HP:0008653) were already cached from other KB entries.

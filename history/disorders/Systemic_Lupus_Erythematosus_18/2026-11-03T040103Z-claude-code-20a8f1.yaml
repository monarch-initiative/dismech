  summary: 'Create: Systemic Lupus Erythematosus 18'
  details: |
    De-novo curation of PLD4-deficiency-related monogenic SLE (MONDO:1060185, SLEB18), nominated by the dismech-genetics-gap-campaign. Sourced entirely from the single discovery publication, Wang et al. 2025 Nature (PMID:40931063), which reports five patients with biallelic PLD4 loss-of-function variants and a Pld4-deficient mouse model. Modeled the mechanism as PLD4 loss of 5' exonuclease activity -> endolysosomal ssDNA/ssRNA accumulation -> TLR7/TLR9 hyperactivation (with a cGAS-STING-dependent amplification step evidenced by STING inhibitor and PLD4/STING1 double-knockout rescue) -> type I interferon/NF-kB/MAPK hyperactivation concentrated in plasmacytoid dendritic cells and monocytes -> cell-intrinsic plasmacytoid dendritic cell and plasma cell expansion with anti-dsDNA/anti-dsRNA autoantibody production -> immune-complex-mediated lupus nephritis. Curated 11 phenotypes (renal, hematologic, cutaneous, articular, serosal, immunologic), the PLD4 gene-disease validity (ClinGen Moderate AR via the Monogenic Systemic and Incomplete Lupus Erythematosus GCEP), baricitinib as a mechanism-targeted treatment (ex vivo patient PBMC and mouse evidence only, not yet clinical), and the Pld4 knockout mouse model with both a RECAPITULATES link (autoantibody/plasma cell expansion) and a RESCUES link (baricitinib normalizing the type I interferon phenotype). Named 'Systemic Lupus Erythematosus 18' per the established MONDO/OMIM/ClinGen numbered form rather than a PLD4-related gene-dyad name, since the discovering authors' own coined name ('PLD4 deficiency disorder', PLDD) is not yet established by recurring literature use. Checked for duplicate/overlapping coverage against origin/main, tmp/claims.json, and open PRs before claiming; none found. No GeneReviews chapter exists yet (just check-genereviews: NO_CHAPTER), as expected for a disease first described in 2025. Validated with just validate-disorders, just check-duplicate-keys, just check-block-scalar-comments, just check-enum-values, just check-entity-refs, just check-causal-targets, just check-logical-rules, just check-coarse-phenotypes, just check-qualifier-terms, just check-delivery-system, just check-gene-activity-grounding, just check-shared-disease-terms, and just check-genereviews, all clean; just check-snippet-grading run whole-KB and clean for this file. Deleted the corresponding stub, stubs/Systemic_Lupus_Erythematosus_18.yaml.

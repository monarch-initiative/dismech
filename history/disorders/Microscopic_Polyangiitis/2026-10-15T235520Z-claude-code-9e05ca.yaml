  summary: 'LOINC: bind MPO-ANCA and PR3-ANCA codes'
  details: |
    Bound LOINC:17316-1 (Myeloperoxidase Ab [Presence] in Serum, method-less) to the MPO-ANCA (p-ANCA) biochemical record and LOINC:63310-7 (Proteinase 3 Ab [Presence] in Serum by Immunoassay) to the PR3-ANCA (c-ANCA) record, as part of dismech LOINC Diagnostics tranche C (autoantibodies), ANCA-vasculitides cluster. No method-less [Presence] code exists for proteinase 3 antibody in the Monarch KG (only by-Immunoassay and by-Immunofluorescence variants), so the by-Immunoassay variant was chosen as the narrowest defensible option; this asymmetry with the MPO code (which does have a bare method-less [Presence] variant) was confirmed by enumerating the full PR3 search result set. A combined panel code (LOINC:57777-5, Myeloperoxidase Ab and Proteinase 3 panel) exists but was not used here because the entry carries these as two separate biochemical records with distinct clinical-weight narratives (MPO-ANCA ~58% of cases, PR3-ANCA ~26%), not a single joint diagnostic action. Both labels were verified against the Monarch KG entity API in the same step they were written. Confirmed both CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

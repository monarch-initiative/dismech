  summary: Cite 2 evidence-free environmental exposures, issue 8296 tranche 5
  details: |
    Both environmental exposures cited. The silica note carried an explicit curator
    breadcrumb -- the association was recorded as coming from epidemiologic case-control
    studies but deliberately not quoted -- so this session supplied the citation that
    breadcrumb was waiting for: PMID:23820041, the meta-analysis of exactly those six
    case-control studies, with a pooled odds ratio of 2.56 for ever-exposure and an
    MPA-specific estimate of 3.95.

    What the citation does NOT cover is recorded rather than glossed: the note also
    asserts silica is an NLRP3-inflammasome activator that primes neutrophils. That
    mechanism is not in the cited meta-analysis and remains uncited; a review_notes
    entry says so and points at pathophysiology as where it belongs.

    Drug-induced AAV: PMID:24276086 names four of the five culprit agents the note
    lists, and PMID:41213309 supports causality rather than mere association for
    hydralazine, propylthiouracil and levamisole plus checkpoint inhibitors, and
    supports the note's statement that management begins with drug withdrawal.
    Penicillamine, the fifth listed agent, is not covered by either and the explanation
    says so.

    Validation: just validate, just count-verified-snippets, the batched
    just validate-disorders sweep, just check-title-snippets.

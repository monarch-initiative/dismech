    Added three transmission records; the existing genus-level infectious_agent record (Candida) was left untouched. Routes: endogenous translocation from gastrointestinal colonization (PMID:36503341, PMID:32604030 - including the strain-identity evidence that bloodstream isolates match the patient's own gut strains); commensal carriage rather than environmental or person-to-person acquisition, recorded as a route in its own right because it is what this genus does not do, unlike Aspergillus or Cryptococcus (PMID:32604030); and direct intravascular introduction via an indwelling catheter, which selects for C. parapsilosis, the one Candida species that colonizes skin (PMID:32604030, PMID:11923339). New reference caches: PMID_36503341, PMID_32604030, PMID_11923339 - the entry's existing references carried nothing quotable on route. just validate clean (36 titles). No other section touched.

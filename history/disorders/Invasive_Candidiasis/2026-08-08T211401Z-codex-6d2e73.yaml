  summary: Create Invasive Candidiasis echinocandin target conformer
  details: |
    Created a deliberately minimal target-only invasive-candidiasis entry using
    MONDO:0044067, with Candida (NCBITaxon:5475) as the genus-level infectious
    agent and Candidemia (MONDO:0044070) as a subtype. Added one molecular
    pathophysiology node for Fks glucan synthase, annotated with
    GO:0006075 and GO:0003843 and conformed to the module's exact target anchor.
    Clarified that FKS1 is the principal catalytic-subunit gene and that FKS2 is
    additionally relevant in species such as Candida glabrata. Added
    anidulafungin (CHEBI:55346) as a PEPTIDE echinocandin treatment with an
    evidence-bearing INHIBITS target_mechanisms edge to that local node. Reused
    already cached reviews PMID:31159914, PMID:26190298, and PMID:21694887; no
    reference cache was fetched or hand-edited. Targeted disorder validation
    passed schema, term, cached-reference, and 4/4 exact-snippet checks.

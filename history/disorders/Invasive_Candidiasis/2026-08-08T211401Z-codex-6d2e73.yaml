  summary: Create and clinically ground Invasive Candidiasis conformer
  details: |
    Created an invasive-candidiasis entry using
    MONDO:0044067, with Candida (NCBITaxon:5475) as the genus-level infectious
    agent and Candidemia (MONDO:0044070) as a subtype. Added one molecular
    pathophysiology node for Fks glucan synthase, annotated with
    GO:0006075 and GO:0003843 and conformed to the module's exact target anchor.
    Clarified that FKS1 is the principal catalytic-subunit gene and that FKS2 is
    additionally relevant in species such as Candida glabrata. Added
    anidulafungin (CHEBI:55346) as a PEPTIDE echinocandin treatment with an
    evidence-bearing INHIBITS target_mechanisms edge to that local node.
    In response to review, expanded the entry through the permitted
    minimum-clinical-content route: added classification and cautiously scoped
    epidemiologic context, risk factors, candidemia and deep-organ phenotypes,
    blood-culture and beta-glucan diagnostics, and a connected path from fungal
    cell-wall viability through sterile-site invasion and hematogenous
    dissemination to clinical outcomes. Added explicit review notes deferring
    additional echinocandin records
    until disease-specific evidence is curated. References were obtained only
    through the sanctioned fetch-reference workflow; no cache was hand-edited.

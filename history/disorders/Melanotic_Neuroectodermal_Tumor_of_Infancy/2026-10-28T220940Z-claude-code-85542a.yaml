  summary: 'Create: Melanotic Neuroectodermal Tumor of Infancy'
  details: |
    New entry for melanotic neuroectodermal tumour of infancy (MNTI; MONDO:0002072; NCIT:C3717), a generally benign neural-crest tumour of early infancy that can be mistaken for metastatic neuroblastoma. Part of the neuroblastoma expansion series (issue 15822); claim issue 15844.

    Content: an age-at-presentation row; a published-case-literature prevalence row; a local recurrence progression row (with the reasons the review gives, and the jaw-versus-skull/brain difference in metastasis); two pathophysiology nodes, a biphasic melanocyte-like and neuroblast-like tumour cell population leading to expansile destructive local growth (maxilla, mandible, skull, brain, epididymis); a biphasic histopathology finding; three phenotypes (rapidly growing jaw mass, FREQUENT from the 472-case site shares; osteolytic bone destruction, HP:0002797, with no band because neither series gives a count; raised urinary VMA, with no band because most cases in the pooled review were untested); an immunohistochemistry diagnosis row; differentials against neuroblastoma (PHOX2B-negative in MNTI), rhabdomyosarcoma and Ewing sarcoma, each limited to what Xia 2021 and Sharma 2025 report; and surgical excision (NCIT:C15232) and chemotherapy for inoperable, metastatic or recurrent disease, with the small-numbers caveat. 41 evidence items from 10 references, 9 of them newly cached. The small-cell population is left unbound to CL because CL:0002676 'neural crest derived neuroblast' would assert a neuroblast identity and a neural-crest origin that the sources call putative; the OLS searches are in the node notes. No genetic record and no origin node: no source names a recurrent somatic lesion, as the notes say.

    The coordinator added the Osteolytic Bone Destruction phenotype and its edge from Expansile Destructive Local Growth after the drafting run: the drafting review flagged phenotype coverage, and the finding is quoted in two series (Xia 2021, PMID:34094962; Sharma 2025, PMID:40278957), with the edge citing the systematic review PMID:16876064.

    Source report: research/Melanotic_Neuroectodermal_Tumor_of_Infancy-deep-research-claude_code.md (claude_code provider), re-validated before commit, 40 of 40 references resolved; its earlier unresolved identifiers were NCBI rate-limit failures. The report's own quoted claims were found in source for 9 of 38 (18 of the others were searched against abstracts only); the entry quotes none of them, and every KB snippet is verified against its own cache. preflight-dr returned SKIP (MONDO records no causal gene). Not committed: 22 uncited caches from the research and design runs, including PMID:10463291, whose results include a chromosome 1p deletion test.

    Validation on the branch rebased onto main: the run_c4 gate set (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-shared-disease-terms, check-logical-rules, check-qualifier-terms, check-delivery-system, check-cancer-origin (advisory: no origin node, as intended) and check-genereviews (no GeneReviews chapter) all passed; all three phenotypes are causally connected.

  summary: 'Review round 1: pigmented swelling, melanin production, presenting symptoms,
    methylation knowledge gap'
  details: |
    Review round 1 on PR 15869, answering a CHANGES_REQUESTED review: the required item plus three of the four optional suggestions. The edits were made by a sub-agent in the PR's worktree; its transcript was scanned for safety-classifier stops (none), and the coordinator reviewed the diff before committing.

    Required. The tumour's pigment is now recorded. New phenotype 'Bluish-Black Pigmented Swelling' (Craniofacial, no frequency band), quoting the 2024 jaw review (PMID:38681460): the melanin content makes the lesion appear as a bluish-black swelling draped by oral mucosa, and a maxillary swelling with a bluish-black hue and a rapid course in an infant is called a clinical pathognomonic sign; the review's own case is quoted too. It is left unbound: HP:0010284 Intra-oral hyperpigmentation and its parent HP:0100669 Abnormal pigmentation of the oral mucosa describe pigment in the mucosa itself, while the source describes the tumour's own melanin seen through mucosa; HP:0030793 Jaw swelling and HP:6000307 Jaw mass describe the swelling without its colour; the OLS searches recorded in the phenotype's notes returned no pigmented oral or jaw swelling term. Melanin production is recorded on the node 'Biphasic Melanocyte-Like and Neuroblast-Like Tumor Cell Population' as GO:0042438 melanin biosynthetic process (no modifier, because no source compares melanin amount with normal melanocytes), with two evidence items (PMID:30407852, PMID:34094962), and a DIRECT edge from that node to the new phenotype.

    Optional, applied. (2) Facial Asymmetry (HP:0000324), Feeding Difficulties (HP:0011968) and Epistaxis (HP:0000421), each from PMID:38681460's statement that symptoms depend on the size of the swelling, with edges from Expansile Destructive Local Growth (epistaxis INDIRECT_UNKNOWN_INTERMEDIATES, since the source gives no mechanism) and no frequency bands; all seven phenotypes are now causally connected. (3) A KNOWLEDGE_GAP discussion, mnti_shared_progenitor_with_group_3_medulloblastoma, attached to the cell-population node, quoting Lopez-Nunez et al. 2021 (PMID:33572349): MNTI shares a methylation profile with group 3 medulloblastoma, and the role of an early cranial neural crest progenitor and the reasons for MNTI's benign course deserve further investigation; no node or edge is added, and the entry notes now point to the discussion. (4) The jaw review's statement that Ki-67 or CD99 positivity of the neuroblast-like cells appears to be associated with an aggressive type of MNTI is added to the Ewing sarcoma differential's CD99 point.

    Optional, not applied: the StatPearls chapter is not cited (the reviewer notes it misstates a BRAF result).

    18 new evidence items, all from references already cached; no new cache files or term rows.
    Validation: the run_c4 gate set (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules, check-qualifier-terms and check-cancer-origin all passed; list-disconnected-phenotypes reports 7 of 7 phenotypes causally connected.

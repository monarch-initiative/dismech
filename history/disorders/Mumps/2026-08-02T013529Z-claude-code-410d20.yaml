  details: |
    Issue #6433 section A flagged that oophoritis and encephalitis are named in prose (description, pathophysiology Neuroinvasion node) but were not curated as standalone phenotype entries, even though Orchitis and Aseptic meningitis (their counterparts/co-occurring complications) already had phenotype entries. Added Oophoritis (HP:0031259) and Encephalitis (HP:0033993, Viral encephalitis) phenotype entries, both backed by the same already-cached Lancet review sentence (PMID:18342688) that is reused elsewhere in the file for Orchitis and Aseptic meningitis: 'Aseptic meningitis and encephalitis are common complications of mumps together with orchitis and oophoritis, which can arise in adult men and women, respectively; other complications include deafness and pancreatitis.' No frequency band was added for either new phenotype since the source snippet is qualitative ('common complications') rather than quantitative, consistent with CLAUDE.md section 6 guidance to omit frequency rather than fabricate justification. The other section A Mumps note (the 'Twelve genotypes (A-N)' internal-inconsistency in infectious_agent text, which has no existing citation) was intentionally left out of scope for this bounded PR and remains open on the issue.

  summary: 'Review round 1: rescope infection/immune branch, add biochemical/onset/fever'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on #13513. Two blocking findings, both on the infection/immune branch where the swab-culture evidence (S. aureus/Candida in skin lesions) was being used for a broader claim. Fixes: (1) dropped the 'Recurrent infections' phenotype (HP:0002719) - the swab data shows secondary cutaneous infection, not systemic recurrence, and no cached source documents recurrence; (2) renamed the 'Impaired Immune Function' pathophysiology node to 'Cutaneous Bacterial and Fungal Superinfection' (consequence, TISSUE) and removed its uncited T-cell/neutrophil mechanism claim, so the node now states only what the swab evidence supports, with a corrected explanation (51.4% is of culture-positive patients). Suggestions taken in the same push: removed the scale-mismatched GO:0006882 (cellular process) from the organism-level Systemic Zinc Deficiency node and added a biochemical: block for decreased serum zinc (CHEBI:29105, cited); added onset_category INFANTILE to the dermatitis phenotype; added a Fever phenotype (HP:0001945, 16.8%); added the transient-neonatal-zinc-deficiency (SLC30A2) differential to the diagnosis description; recorded PR 13513 in the CREATE record links. 26/26 snippets verified; all terms validated; full gate suite green; model-scale audit 2/2 aligned.

  summary: 'Create: Acrodermatitis Enteropathica'
  details: |
    New Mendelian entry for acrodermatitis enteropathica (AE), MONDO:0008713, SLC39A4/ZIP4. Curated de novo after confirming no KB entry, no stub-collision, and no competing claim issue (distinct from the matentzn-claimed hereditary folate malabsorption). Deep research via the claude_code provider (web-grounded; report was lead-only with no verbatim quotes and CURIEs flagged, so all snippets were taken from freshly fetched cache). preflight-dr PASS (SLC39A4 x7, OMIM 201100 match). Modeled the transporter-loss causal chain: SLC39A4/ZIP4 loss of function -> impaired apical intestinal zinc absorption -> systemic zinc deficiency -> (impaired zinc-dependent enzyme/zinc-finger function -> dermatitis, alopecia, immune dysfunction; intestinal epithelial/Paneth-cell dysfunction -> diarrhea; growth retardation; low alkaline phosphatase). Seven causally wired phenotypes. Evidence anchored on the two 2002 gene-discovery papers (Kury PMID:12068297 Nat Genet, abstract-only; Wang PMID:12032886 Am J Hum Genet, ZIP4 apical enterocyte localization), the Geiser 2012 PLoS Genet intestine-specific Zip4 knockout mouse (PMID:22737083, two modeled_mechanisms, scale-ALIGNED) and the Frontiers 2025 pediatric real-world review (PMID:40584104) for clinical frequencies and treatment response (91.4% respond, 1-3 mg/kg/day). Autosomal recessive inheritance block, zinc-supplementation treatment (zinc sulfate CHEBI:35176), prevalence ~1/500,000, diagnosis and histopathology. GeneReviews NO_CHAPTER (no chapter exists; StatPearls is never a baseline). The Acta Derm Venereol case report PMID:26351177 cached with no quotable text and is not cited. 25/25 snippets verified; all terms validated; full gate suite green. A pre-PR red-team review (fresh-context subagent) found no blocking defects; its quality fixes were folded in before the first push: the zinc-dependent-function node's snippet was swapped from the clinical-triad sentence to Wang's metalloenzyme/transcription-factor statement (which actually supports the molecular claim), a top-level notes caveat was added that the pooled PMID:40584104 frequencies are not SLC39A4-specific, the over-narrow HOMOZYGOUS zygosity was dropped (AE is often compound heterozygous; biallelic is captured in the inheritance block), and the isolated Irritability phenotype was wired downstream of systemic zinc deficiency.

  summary: Review inherited acrodermatitis enteropathica using full-text clinical
    and functional evidence
  details: |
    Reviewed inherited SLC39A4-related acrodermatitis enteropathica after rebasing to main 45aa019e3d0. No REVIEW history or open overlapping PR/claim was present. Infectious disease and acquired/environmental zinc deficiency remain outside the campaign scope; the latter is retained only as a differential.

    Phenotypes: retained the clinical core, anchored dermatitis/alopecia/diarrhea to hereditary-disease sources and a molecularly confirmed child, and represented incomplete triad and absent growth delay as counterevidence to universality. Pooled irritability, fever, and alkaline-phosphatase observations are locally qualified as indirect, mixed-etiology evidence without SLC39A4-specific frequencies. DR nail/ocular suggestions were not promoted to inherited-disease claims without directly attributable evidence.
    Subtypes: no new molecular subtypes; acquired, lactogenic SLC30A2, and metabolic AE-like disorders are differentials, not SLC39A4 subtypes.
    Mechanisms: separated missense, truncating, splice-site, and upstream-deletion triggers; allele-specific transcript reduction; ER retention; cell-surface depletion; processing and uptake effects. Added local intestinal zinc depletion, Paneth reprogramming, compartment-specific TORC1 changes, and reduced proliferation, with model-derived mechanisms explicitly provisional. Avoided treating immature glycosylation as a proven cause of transport loss. Mouse P200L transport results and human P200L mistrafficking differ by ortholog/assay and are qualified rather than flattened. Human upstream regulatory element identity and splice product remain unresolved.
    Treatments: replaced pooled response/dose assertions with the separately reported SLC39A4 subgroup in the 2025 review, including its nonresponder and incomplete dose reporting; added molecularly confirmed longitudinal treatment and copper monitoring. Added clioquinol-plus-zinc as preclinical rescue only, including incomplete rescue and toxicity uncertainty. No clinical trial was established by the consumed sources.
    Genetics: added variant classes, segregating p.Arg95Cys/c.1287+2T>C on stated NM_130849.2, upstream deletion and allele-specific expression; no unsupported pathogenic assignment for P84L, no universal residual-function assumption, and no genotype-prognosis rule.
    Diagnostics: broad coding/splice-boundary analysis, regulatory/structural limitations, relapse history without recommending diagnostic zinc withdrawal, and blood-zinc severity limitations. Skin histology remains nonspecific and explicitly mixed-etiology.
    References: deep-research preflight PASS, matching gene SLC39A4 and OMIM 201100. Used cached 2002, 2010, 2012, 2013, 2009 processing, 2020 transport, 2021 trafficking, and 2025 review full texts plus relevant abstracts. Source titles were read from cache. The Panzer PMID/DOI yielded no quotable text and its PDF route returned 404. The 2015 clinical-utility gene card yielded no quotable full text via PMID/DOI, PMC browser checks, or the login-limited publisher page; EuropePMC returned 403. These were not quoted or used to launder unsupported report assertions. All cache files were generated by the sanctioned fetcher; unused unsuccessful fetches are not part of the PR.
    Overall: direct literature review across all eight dimensions. Model limitations distinguish acute intestinal mouse deletion from human germline disease, and heterologous-cell assays from patient enterocytes. GeneReviews NO_CHAPTER in the 2026-09-10 committed snapshot; StatPearls was not substituted as a baseline.

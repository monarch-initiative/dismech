  summary: Correct assay provenance and add ClinGen validity after review
  details: |
    Addressed the independent review in one round: both upstream-deletion allele-expression evidence items now use IN_VITRO, matching the patient lymphoblastoid RNA methods. Patient genomic deletion evidence remains HUMAN_CLINICAL. The failure-to-thrive preferred term matches its existing HPO binding, and two mouse observations attached to human mechanism nodes are INDIRECT. Added the ClinGen Definitive SLC39A4–MONDO:0008713 classification, approved 2024-09-13, from the fetched official assertion page; the assertion identifier was cross-checked against the local ClinGen CSV. The fetch-reference recipe does not resolve CGGV or ORPHA prefixes in this checkout, so the ClinGen evidence uses its generated URL cache. Orphanet reports prevalence as unknown online, but both official page fetches cached an interstitial rather than disease content; neither is cited. Replaced the mouse-paper background estimate of 1 in 500,000 with qualitative rarity supported by PMID:19370757. DOI:10.1111/pde.12555 retrieved only the same abstract as PMID:25780817, and the publisher full-text route returned 403; no normal-zinc claim is inferred from the title. All caches were fetched using just fetch-reference. Unused fetches are excluded from the PR.

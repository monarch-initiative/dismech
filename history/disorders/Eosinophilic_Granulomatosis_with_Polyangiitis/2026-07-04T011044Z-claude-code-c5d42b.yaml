  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled reference_title on all untitled references: PMID 23044708 French Vasculitis Study Group 383-patient cohort, ORPHA 183 Orphanet structured-database record on all sixteen phenotype rows, and three ClinicalTrials.gov records NCT02807103 NCT02020889 NCT06046222. Re-verified every existing evidence snippet as an exact whitespace-normalized substring of the synced cache and confirmed each supports its claim. Mined the full text of the Fagni 2021 pathophysiology review and the Srikantharajah 2025 cardiac review to add new well-supported findings: a new Eosinophil-induced prothrombotic state pathophysiology node with GO positive regulation of blood coagulation and downstream to a new Thrombosis phenotype HP Abnormal thrombosis, a group 2 innate lymphoid cell type plus supporting evidence on the type 2 polarization node, an in vitro eosinophil cationic protein cardiotoxicity mechanism on the cardiac node, and a cardiac MRI meta-analysis sensitivity finding on the CMR diagnosis item. Improvements: added therapeutic_modality to glucocorticoid mepolizumab and rituximab treatments and replaced the generic monoclonal antibody agent on mepolizumab with the specific NCIT Mepolizumab term. Schema terms and reference validation all pass.

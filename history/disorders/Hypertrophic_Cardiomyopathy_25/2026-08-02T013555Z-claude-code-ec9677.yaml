    HEADLINE FINDING: ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel classifies TCAP-hypertrophic cardiomyopathy as DISPUTED (downgraded from Limited on 2022-09-14; CGGV:assertion_c35abc20-c04c-49ec-af02-1bd270b0b50b-2022-09-14T160000.000Z), against Definitive for TCAP-LGMD R7/2G and Limited for TCAP-DCM. The entry states the dispute plainly rather than asserting a confident mechanism: genetic relationship_type is DISPUTED, every pathophysiology node carries mechanism_confidence HYPOTHETICAL or PROVISIONAL, and the single mechanistic_hypotheses group (Z-disc stretch-sensor gain-of-interaction) is status EMERGING carrying a REFUTE evidence item quoting ClinGen's "The mechanism for disease is unknown."


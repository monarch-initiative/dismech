  summary: 'Address PR #7817 review: narrow unevidenced node, add anticoagulation'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7817, which raised one blocking
    item and three optional suggestions. All four are addressed.

    BLOCKING - the pathophysiology node "Sarcomeric Z-Disc Disorganization and Cardiomyocyte
    Hypertrophy" bundled two cellular events and the disorganization half was unevidenced. The
    node's single evidence item (PMID:40330574, endomyocardial biopsy showing cardiomyocyte
    hypertrophy and focal fibrosis) says nothing about sarcomere or Z-disc architecture, leaving
    the GO:0045214 sarcomere organization (ABNORMAL) annotation unsourced.

    Of the two remedies the review offered - split into two sourced nodes, or narrow and drop the
    GO term - the second was taken, after checking that the first was not available. Every cached
    reference for this entity (13 PMIDs) was grepped for disarray / disorganization /
    myofibrillar: no hit in any of them. A split node would therefore have had no evidence to
    stand on. The node was renamed to "Cardiomyocyte Hypertrophy", GO:0045214 removed, the
    description's "disorganised myofibrillar architecture" phrase dropped, and both incoming
    downstream edges retargeted. A node-level note records the change and its reasoning, including
    the point that matters most for this particular entity: Z-disc disorganization is a plausible
    expectation for a Z-disc protein, and plausibility is exactly what a ClinGen-Disputed entity
    must not encode as observation. The note also states what would justify re-adding it - a TCAP
    biopsy or model that actually reports myofibrillar architecture - so a future curator can act
    on new evidence without re-deriving the reasoning.

    SUGGESTION 1 - heart transplantation was bound to the generic NCIT:C15289 Organ
    Transplantation. Replaced with the specific NCIT:C15246 Heart Transplantation.

    SUGGESTION 2 - anticoagulation added, since atrial fibrillation is already curated as a
    phenotype of this entity (both affected carriers of the Portuguese p.C57W allele, plus
    biatrial enlargement in the frameshift proband). Bound at drug-class level (NCIT:C263
    Anticoagulant Agent under NCIT:C15986 Pharmacotherapy) with a target_phenotypes join to
    HP:0005110. Evidence is PARTIAL and says why: the cited report documents the arrhythmia but
    does not state whether these carriers were anticoagulated, or report any thromboembolic
    event. The notes record that the indication itself is guideline-directed HCM management with
    no TCAP-specific study, that no snippet is claimed for it, and - to forestall a
    misreading - that this is management of a curated phenotype rather than a claim that TCAP
    variants cause thromboembolism.

    SUGGESTION 3 - the original history record for this entry had links.prs: []. Added the PR
    URL. Note this edits an existing append-only record: only links was touched, which describes
    current repository state rather than what happened in that session; target.slug and
    target.path are untouched.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_25.yaml' passes
    in full - schema, terms, and references - with "Snippets checked: 75/75 verified against
    cached references", up from 74/74 (the one added snippet is the anticoagulation evidence
    item, re-quoting an already-cached source). NCIT:C15246 and NCIT:C263 were verified with OAK
    before use. The branch was also rebased onto current origin/main.

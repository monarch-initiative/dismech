  summary: 'Create: Singleton-Merten_Syndrome_2'
  details: 'New entry for Singleton-Merten syndrome 2 (MONDO:0014575), curated from the stub as a Disease
    entry: a MONDO leaf with one causal gene, RIGI (hgnc:19102, labelled DDX58 in the HGNC build the validator
    reads).


    Sources. Phenotypes and variants come from the primary family reports (PMID:25620203, PMID:30574673,
    PMID:33495304, PMID:38752537, PMID:41467011) and two case reports; mechanism from biochemical and
    structural studies of the variants (PMID:26609812, PMID:30047865, PMID:30270105, PMID:35580046, PMID:42459549)
    and of wild-type RIG-I (PMID:22000019, PMID:15208624). No GeneReviews chapter exists (`just check-genereviews
    --online` reports NO_CHAPTER). An Asta literature run returned mostly unrelated papers and was deleted,
    not committed. OpenScientist disorder and hypothesis runs were submitted; their status is in the pull
    request.


    Variant placement was computed, not recalled. UniProt O95786 features and sequence, PDB 5E3H, 3ZD7,
    4AY2, 7TNX, 4ON9 (human) and 4A2W (duck, autoinhibited) were downloaded and read with Biopython; residue
    identity at each number was checked against O95786 for every chain used, and shortest side-chain distances
    to nucleotide, RNA and neighbouring residues were measured. Conservation is from pairwise global alignments
    to mouse, pig, dog, duck, frog and zebrafish RIG-I and human MDA5 and LGP2. Constraint and allele
    counts are from the gnomAD v4.1 API; ClinVar records were read through E-utilities. The AlphaFold
    file server returned 403 from this environment, so no AlphaFold model was used.


    Decisions. The lupus-nephritis variant R109C and the dominant-negative G731R are described in notes
    and not curated as causes of this disease. The vascular calcification mechanism rests on one mouse
    study and is carried as an EMERGING hypothesis group with a knowledge-gap discussion. Tooth, tendon
    and bone edges are marked UNKNOWN. Acro-osteolysis has no HPO binding because HPO has only site-specific
    terms.


    Validation. `just validate`, `just validate-terms` and `just count-verified-snippets` (118 of 118)
    pass, as do the offline gates listed in CLAUDE.md for a kb change.


    Reconciliation and pre-submission review. The variant placement was compared with the independent
    analysis in ai4curation/ai-gene-review (branch claude/rigi-sms2-co-review); numbering, contacts, constraint
    figures and GO terms agree, and the entry notes record what that analysis adds. An independent read
    of every cited source before submission led to these changes: the blood interferon result in the Q517H
    family was corrected (normal in the proband); the published statement that D550 is not at the CARD
    interface in the duck structure is now quoted beside the measured linker contact; a second ruxolitinib-treated
    child and the lack of vascular response were added; the calcification hypothesis edge now leaves the
    MAVS node; three unevidenced edges to dental, tendon and bone phenotypes were removed and replaced
    by a knowledge-gap discussion; acro-osteolysis was bound to HP:0009839 and split from periarticular
    calcification; contracture, lipodystrophy, cataract, diagnosis rows and two differential diagnoses
    were added.'

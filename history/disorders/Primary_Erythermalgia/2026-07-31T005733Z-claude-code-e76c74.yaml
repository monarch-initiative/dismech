  summary: 'Create: Primary Erythermalgia (SCN9A/Nav1.7 gain-of-function channelopathy)'
  details: |
    Created new distinct Mendelian entry for primary erythermalgia (MONDO:0007571, OMIM:133020, SCN9A/HGNC:10597), scoped as the SCN9A-EM entity distinct from the umbrella complex entry erythromelalgia.yaml (MONDO:0016028) and from sibling SCN9A syndromes (PEPD, small-fiber neuropathy). GeneReviews baseline PMID:20301342 fetched, tagged, and cross-referenced for phenotypes/management/inheritance. Mechanistic pathograph (SCN9A gain-of-function to nociceptor hyperexcitability plus sympathetic hypoexcitability to episodic neurovascular pain flares) built from primary literature: gene discovery PMID:14985375, Nav1.7 electrophysiology PMID:15385606 and PMID:16988069, sympathetic-vs-sensory opposing excitability PMID:16702558, carbamazepine-responsive V400M PMID:19557861, pediatric systematic review PMID:30416015. 18 evidence items, all snippets verified as exact substrings of cached abstracts. Deep research: OpenScientist provider run initiated at user request (Falcon credits exhausted); findings to be integrated. Validated with just validate and just validate-references (all pass); compliance 91.8 percent (93.5 percent weighted).

  summary: 'Create: Hydrolethalus_Syndrome_1'
  details: |
    New Mendelian entry for hydrolethalus syndrome 1 (MONDO:0009365), claimed in issue 15835. Pathograph: biallelic HYLS1 variants (Finnish founder D211G) -> loss of centriole distal-end integrity (CEP120 interaction lost; knock-in mouse) -> defective ciliary gate and cilium assembly (C. elegans) -> defective ciliary Hedgehog signaling (PIPKIgamma/GPR161, mammalian cells; D211G directly fails Hh activation) -> embryonic midline brain, craniofacial and limb malformation (PROVISIONAL, linked to hydrocephalus, keyhole occipital defect, polydactyly, micrognathia, lung lobation, cleft palate, hypothalamic hamartoma, cortical dysplasia, cerebellar hypoplasia and perinatal lethality). Conforms to three ciliopathy_dysfunction module nodes, matching the sibling Hydrolethalus_Syndrome_2 entry. Perinatal lethality left unbound because the HPO mortality terms are outside the PhenotypeTerm enum. Deep research: one OpenScientist report (16/16 references resolved; preflight anchored on HYLS1; OMIM 610693 it cites is the gene record). A Romanian case without an HYLS1 variant cited in the report (PMID:22029171) is not used. The bioRxiv version of the knock-in study (PMID:38496445) is cited only for details absent from the abstract of the published version (PMID:40009365). HYLS1 added to the gene-activity-grounding baseline: the demonstrated defect of D211G is a lost protein interaction and mislocalization, and no specific GO molecular function is shown to be lost. Validated with just validate, count-verified-snippets and the whole-repo gates.

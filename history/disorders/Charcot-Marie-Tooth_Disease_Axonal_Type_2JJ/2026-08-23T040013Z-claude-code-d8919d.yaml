  summary: 'Review response: correct two unsafe/misattributed phenotype claims, consume
    the discovery paper'
  details: |
    Addressed two CRITICAL findings on PR #9269, both verified against the cached sources before acting. First, the Preserved Ambulation node attributed the European BAG3-NMD cohort's ten non-p.Pro209Leu patients to CMT2JJ; PMID:40493734 shows those patients carried p.Arg309*, p.Val505Glyfs*6 and p.Pro209Gln, had pure distal motor weakness with ENMG compatible with dHMN in seven of nine, and the same paper places p.Pro209Ser outside that cohort entirely. The node is rebuilt on the paper's allele-specific sentence and now states explicitly what is NOT claimed. Second, the 'without cardiorespiratory involvement' claim was clinically unsafe: PMID:28754666 reports four cardiac deaths in a p.Pro209Ser family, one at age 46, and concludes a CMT2 diagnosis may surface subclinical potentially life-threatening cardiac disease. A separate Cardiac Risk Requiring Surveillance phenotype (HP:0001645) now carries that, and the two claims are reconciled on the word 'overt' rather than one silently overriding the other. Also consumed the under-used discovery paper: sensory predominance, absence of proximal weakness (curated as REFUTE), a biochemical section for CK and the EMG denervation-without-myopathy discriminator, the third codon-209 substitution p.Pro209Gln with the IPV-motif structural reason the codon is phenotype-determining, the surrounding allelic landscape (p.Arg309*, p.Val505Glyfs*6, p.Pro470Ser), and HSPB8 as stronger corroboration for the neuron-specific step than the HSPB1 analogy. Added a KNOWLEDGE_GAP recording that no treatment is approved and that the metformin zebrafish rescue is for the MYOPATHIC arm, so curating it here would be the codon-resolution error this entry exists to prevent. Tagged the CMT GeneReviews overview for consistency with sibling entries, matching how Charcot-Marie-Tooth_Disease_Type_1 lists it (tagged in references, not cited in evidence, since the cached record is abstract-only boilerplate). Deep research was attempted but the provider returned a proxy 503; no artifact was produced and none is claimed. Validation: linkml-validate clean, linkml-term-validator passed, 36/36 snippets verified against cached references (was 27/27), all five ungated gates clean - the snippet-length gate caught a 3-word quote I had added and it was extended to the full sentence.

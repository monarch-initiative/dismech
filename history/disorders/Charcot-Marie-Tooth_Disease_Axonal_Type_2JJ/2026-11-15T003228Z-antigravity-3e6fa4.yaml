  summary: Ground BAG3 molecular functions, fix retired support prose, wire disconnected
    phenotypes, and add prevalence and progression
  details: |
    Added GO molecular_functions (protein-folding chaperone binding GO:0051087 and heat shock protein binding GO:0031072) to the BAG3 IPV Motif Variant germline lesion node. Replaced retired PARTIAL support prose on Misfolded Protein Aggregation in Peripheral Neurons (PMID:35832504) with directness: INDIRECT. Wired Adult-Onset Axonal Sensorimotor Neuropathy to downstream phenotypes (Axonal Sensorimotor Polyneuropathy, Distal Muscle Weakness, Sensory-Predominant Involvement) with cached clinical evidence (PMID:31853710, PMID:28754666). Added ultra-rare prevalence and adult-onset progression blocks (PMID:40493734, PMID:31853710, PMID:28754666), bound NCIT diagnosis_term descriptors, and documented the purpose-statement-only GeneReviews overview (PMID:20301532) in notes.

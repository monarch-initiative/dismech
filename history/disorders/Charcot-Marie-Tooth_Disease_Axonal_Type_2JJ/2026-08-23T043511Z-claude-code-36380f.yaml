  summary: Rebind the cardiac phenotype from Sudden cardiac death to Palpitations
  details: |
    The Cardiac Risk Requiring Surveillance phenotype added in the previous commit bound HP:0001645 Sudden cardiac death, which outruns its evidence. Verified: the string 'sudden' appears zero times in PMID:28754666, which reports only that four family members 'died of a cardiac death'; those four relatives were neither examined nor genotyped. The HPOA exporter emitted that as unqualified POSITIVE rows asserting MONDO:0976227 has_phenotype HP:0001645, in a disease where PMID:40493734 states p.Pro209Ser causes no overt cardiac disease. Structurally that is the same error class as the wrong-patient attribution corrected in the previous commit, pointed the safe direction. Rebound to HP:0001962 Palpitations, the only cardiac finding directly observed in an examined and genotyped subject ('One subject we evaluated (75767-0001) had a history of cardiac issues (palpitations)'), with that quote added as the node's first evidence item. The pedigree cardiac deaths are retained as a second evidence item and in the description, since they are the reason the node exists, with an explanation stating explicitly what the source does not say. Re-ran the exporter to confirm: rows now carry HP:0001962, and no HP:0001645 row is emitted. Also added frequency EXCLUDED to the Absence of Proximal Weakness phenotype as belt-and-braces alongside supports REFUTE, so the negation survives if someone later regrades the evidence. Validation: linkml-validate clean, linkml-term-validator passed, 37/37 snippets verified against cached references (was 36/36), all five ungated gates clean, title audit 0 mismatches.

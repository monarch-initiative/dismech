  summary: 'Create: Charcot-Marie-Tooth disease, axonal, type 2JJ (BAG3)'
  details: |
    New Disease entry for CMT2JJ (MONDO:0976227), claimed via issue #9223.

    Lump/split decision: DISEASE. One causal gene (hgnc:939 BAG3), no MONDO descendants, no existing entry for the neuropathy phenotype.

    Mechanism curated as a four-node chain with conformance to two modules: BAG3 IPV motif variant -> chaperone-assisted selective autophagy failure (conforms_to loss_of_proteostasis#Loss of Proteostasis) -> misfolded protein aggregation in peripheral neurons (conforms_to loss_of_proteostasis#Misfolded-Protein Aggregation) -> adult-onset axonal sensorimotor neuropathy (conforms_to peripheral_axonal_degeneration#Peripheral Neuropathy).

    The claim issue flagged BAG3 pleiotropy as the interesting curation problem, and it resolved into something sharper than expected: the recurrent CMT2JJ allele p.Pro209Ser (c.625C>T) and the myofibrillar myopathy allele p.Pro209Leu (c.626C>T) affect the SAME CODON, one nucleotide apart, yet produce a peripheral neuropathy and a childhood myopathy with cardiomyopathy respectively. That contrast is curated explicitly in the genetic notes and carries its own open KNOWLEDGE_GAP.

    Deliberately NOT curated as a clean allelic partition. A p.Pro209Leu patient has been reported with a CMT-like axonal polyneuropathy and no cardiomyopathy (PMID:30145633), so the phenotypes overlap rather than partition. Notes warn a later curator against tidying this into one gene with three neat allele-selected phenotypes.

    Two nodes are PROVISIONAL for a stated reason rather than from vagueness: the CASA-failure mechanism was characterised for p.Pro209Leu and is only assumed for p.Pro209Ser, and the aggregation-causes-neuropathy step rests on an analogy with HSPB1 p.Pro182Leu in CMT2 that the reviewing authors themselves offer as an avenue for future research. A second KNOWLEDGE_GAP records that no study has shown aggregates in CMT2JJ nerve tissue, and notes this is unusually tractable since sural nerve biopsy is already part of the diagnostic workup.

    The BAG3 cardiomyopathy and myofibrillar myopathy pathographs are NOT restated here; they are already curated elsewhere (MFM6 as a subtype of Myofibrillar_Myopathy, and BAG3 DCM across several Dilated_Cardiomyopathy entries) and appear here as differential diagnoses, which is the actual clinical task.

    No treatments or animal_models blocks: no functional study of the p.Pro209Ser allele, no model and no treatment evidence exists.


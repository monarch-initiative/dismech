  summary: 'Correct a self-contradiction: the codon-209 discussion called the CASA
    node PROVISIONAL when it is ESTABLISHED'
  details: |
    The cmt2jj_codon209_genotype_phenotype discussion's rationale asserted that the aggregation-and-sequestration mechanism was 'characterised for p.Pro209Leu, and simply assumed for p.Pro209Ser, which is why the CASA node in this entry is PROVISIONAL'. Both halves were wrong, and each is contradicted by content in this same file. The Chaperone-Assisted Selective Autophagy Failure node carries mechanism_confidence: ESTABLISHED, and its own description states the mechanism 'was demonstrated for the Pro209 mutant class including p.Pro209Ser, which is why this node is ESTABLISHED rather than inferred from the myopathy allele'; its cited evidence PMID:32472079 reads 'We found that all BAG3_Pro209 mutants have acquired a toxic gain-of-function'. The node that is PROVISIONAL is Misfolded Protein Aggregation in Peripheral Neurons, and for an unrelated reason - the aggresome work was done in cell lines rather than patient nerve tissue. The rationale now states the mechanism is shared across the Pro209 class, names the correct PROVISIONAL node and its actual reason, and sharpens the open question to why one shared mechanism produces two diseases. Found when an automated review of PR #9320 traced a false cross-file claim about this entry's mechanism_confidence back to this discussion, which the grouping prose had faithfully echoed. Verified: schema validation clean, term validation clean, 37/37 snippets verified against cached references, and all five ungated CI gates green.

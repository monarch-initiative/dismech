  summary: Create Indian tick typhus
  details: |
    Created a de novo Indian tick typhus entry from the OpenScientist deep-research report, with Rickettsia conorii subsp. indica identity, Rhipicephalus transmission, Sca2/Arp2/3-to-endothelium invasion biology, TXA2-dependent platelet activation and microthrombus formation, cohort-backed R. conorii phenotypes, PCR and IFA diagnostics, doxycycline and azithromycin treatments, and a C3H/HeN R. conorii Malish infection mouse model.
    Broadened the cohort-backed neurologic phenotype from Infectious Encephalitis to SOURCE_UNSPECIFIED Neurologic Involvement because the evidence reports neurological involvement without naming encephalitis.

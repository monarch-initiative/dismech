  summary: Bind LOINC group-level SFG serology code to the IFA diagnosis row
  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and diagnosis[].measurements binding LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Indirect immunofluorescence assay serology row. The row's own description already states that IFA supports spotted-fever-group rickettsiosis serodiagnosis (not species-level ITTR specificity), so the group-level code matches the row's stated scope exactly; no additional entry-level caveat sentence was needed. A separate row in this entry (Rickettsial PCR and gene sequencing) already carries its own NCIT:C17003 PCR term and is unaffected. No new cache/loinc/terms.csv row was required -- 22474-1 was already cached from earlier LOINC tranche-B batches.

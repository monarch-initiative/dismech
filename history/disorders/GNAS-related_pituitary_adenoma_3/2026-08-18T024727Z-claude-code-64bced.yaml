  summary: 'Compliance: bind PITA3 disease_term, classifications, edge/finding evidence'
  details: |
    Weekly compliance pass, endocrine classification/taxonomy focus. Bound the missing disease_term to MONDO:0054665 pituitary adenoma 3, multiple types (PITA3; OMIM:617686; RO:0004003 to HGNC:4392 GNAS; is_a familial isolated pituitary adenoma), verified with runoak against sqlite:obo:mondo. This was the single highest-weight compliance gap in the entry. The existing mappings.mondo_mappings block claimed no gene-specific PITA3 term existed in the local ontology snapshot and used skos:closeMatch to the parent grouping term on that basis; the claim was false, so the predicate is corrected to skos:broadMatch and the stale justification replaced rather than silently deleted. Added a classifications block: harrisons_chapter ONCOLOGY_HEMATOLOGY (somatic gsp-driven neoplasm) plus ENDOCRINOLOGY_METABOLISM (hormone-secreting pituitary tumor presenting as acromegaly; both diagnosis nodes and both treatments are endocrine). Left icdo_morphology empty because ICDOMorphologyEnum carries only malignant classes and this is a benign adenoma; left mechanistic_category empty because there is no G-protein/cAMP signalling oncogenesis value. Both recorded in a notes block. Added edge-level evidence to all 4 previously bare pathophysiology downstream edges, evidence to all 6 references findings, and evidence to both treatments target_mechanisms links (the somatostatin-receptor-ligand link recorded as PARTIAL because biochemical control was statistically indistinguishable between gsp+ and gsp- patients). Backfilled 3 missing reference_title values from references_cache. Validated with just validate: schema, terms and references all pass, 38/38 snippets verified. Weighted compliance 81.0 percent to 97.9 percent. Remaining: root datasets, and harrisons_chapter evidence (notes preferred for taxonomy placements).

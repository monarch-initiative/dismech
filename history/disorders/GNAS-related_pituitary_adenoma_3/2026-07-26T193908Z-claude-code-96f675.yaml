  summary: 'Review: GNAS-related pituitary adenoma 3'
  details: |
    Manual correctness review of claim-evidence matching.

    Two nodes (diagnosis 'Biochemical assessment of acromegaly' and treatment
    'Multimodal acromegaly therapy') rested solely on one sentence of PMID:25356808
    that enumerates the guideline's scope ('including the appropriate biochemical
    assessment, a therapeutic algorithm, ...'). That is a table-of-contents sentence,
    not a finding - the same failure mode corrected in Congenital_Adrenal_Hyperplasia
    in the previous review batch.

    - Diagnosis: added PMID:37923946 (14th Acromegaly Consensus Conference) with the
      operative criterion (IGF-I > 1.3x ULN for age confirms the diagnosis) and the
      qualification on random GH; kept the scope sentence as PARTIAL.
    - Treatment: added PMID:33079318 (Pituitary Society update) for the biochemical
      control target, the SRL + weekly pegvisomant combination option, and the SRS/FRT
      radiotherapy control rate; kept the scope sentence as PARTIAL.
    - Diagnosis 'Somatotroph tumor GNAS sequencing' cited the methods fragment 'GNAS1
      sequencing was performed by Sanger.', which does not establish that the assay is
      run on tumor tissue or that it classifies tumors. Replaced with the results
      sentence (gsp found in 54/136 patients) plus the tumor-level correlate.

    All snippets re-verified as exact substrings of references_cache; linkml-validate,
    term validation, and graph edge-target validation pass.

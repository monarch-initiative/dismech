  summary: 'Create: Nephrotic Syndrome 15 (MAGI2)'
  details: |
    Curated nephrotic syndrome 15 (MONDO:0033262, OMIM 617609), autosomal recessive steroid-resistant nephrotic syndrome caused by biallelic MAGI2 loss of function. Gene identity (MAGI2, hgnc:18957) confirmed from MONDO RO:0004003 causal-gene restriction, OMIM 617609 xref, and the primary papers (Bierzynska 2017 PMID:27932480; Ashraf 2018 PMID:29773874). Lump/split: single DISEASE; neurologic involvement is variable expression, not a subtype (GeneReviews lists MAGI2 SRNS as +/- neurologic impairment under one OMIM number). Deep research: one openscientist report succeeded (preflight-dr PASS, MAGI2 mentioned 69 times); treated as leads only, all CURIEs bound from lookups. Pathophysiology chain: MAGI2 LOF -> loss of slit-diaphragm scaffolding / loss of MAGI2-RapGEF2-Rap1 signaling -> actin disorganization + dendrin nuclear translocation/podocyte loss -> foot process effacement -> glomerular filtration barrier failure -> proteinuria. Two conforms_to to nephrotic_podocyte_injury. Three animal models (constitutive and podocyte-specific Magi2 mouse KO, magi2a zebrafish). Validated: just validate, validate-terms, validate-disorders all pass; 36/36 snippets verified; all offline KB gates pass including gene-activity-grounding.

  summary: 'Review round 1: evidence, diagnosis, transplant'
  details: |
    Answers review round 1 on PR #16140 (ai4c-reviewer, CHANGES_REQUESTED on de19526ff). Item 1, claims not supported by their snippets: removed the Hypoalbuminemia phenotype rather than leave it bound to a general SRNS background sentence; no cached reference states serum albumin in a MAGI2 patient, PMC5407720 is not open access and a forced re-fetch does not upgrade past the abstract, so the HPOA annotation (3/3 probands, PMID:27932480) is unquotable and is recorded in notes instead. Re-evidenced Kidney Failure on PMID:28539383 as MODEL_ORGANISM ('they exhibited massive proteinuria, glomerulosclerosis, and kidney failure') plus PMID:32317330 as HUMAN_CLINICAL with directness INDIRECT (monogenic SRNS patients reached transplantation), with the limits stated on the phenotype. Softened the disease description's blanket human kidney-failure claim. Strengthened Proteinuria and Nephrotic Syndrome with human sentences from PMID:31171376 and gave Proteinuria a direct MODEL_ORGANISM measurement; recorded on Generalized Edema that the only direct observation is the zebrafish. Item 2: added a diagnosis section with molecular genetic testing (NCIT:C15709; whole-exome and targeted MAGI2 exon sequencing, plus the GeneReviews rare-gene panel caveat) and kidney biopsy with MAGI2 immunohistochemistry (NCIT:C51699; absent or diminished podocyte MAGI2 on patient sections). Item 3: added Kidney Transplantation (NCIT:C15265) citing PMID:32317330, with the explanation stating the finding is for monogenic SRNS as a class; added the same paper as HUMAN_CLINICAL REFUTE to Calcineurin Inhibitor Therapy. Optional suggestions taken: Ashraf's dexamethasone sentence as an IN_VITRO REFUTE on corticosteroid therapy; a notes paragraph on the pTSNS versus SRNS labelling; the GeneReviews claim rephrased as reasoning from the primary reports because the gene table yields no clean quote; AAV-MAGI2 added as a clearly labelled preclinical direction (PMID:37950637, diabetic kidney disease model with intact MAGI2 alleles). Declined: binding specific neurologic features, since Ashraf's Supplementary Table 1 is not accessible. Fetched PMID:32317330. Reverted incidental trailing-whitespace churn that the reference-cache normalizer made to the committed GeneReviews HTML cache. Validation: just validate, validate-terms, validate-disorders pass; 48/48 snippets verified; all offline KB gates pass.

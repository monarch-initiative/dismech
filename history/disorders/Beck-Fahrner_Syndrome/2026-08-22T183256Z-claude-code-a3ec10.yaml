  summary: 'Create: Beck-Fahrner syndrome (TET3, MONDO:0032922)'
  details: |
    Curated de novo while reviewing Mendelian intellectual disability coverage; the disorder was absent from kb/disorders and open in stubs/ (now deleted). TET3-related Beck-Fahrner syndrome is explicitly placed by GeneReviews within the Mendelian disorders of the epigenetic machinery, so the entry is wired as the eraser-class conformer of the new epigenetic_machinery_neurodevelopmental_dysregulation module - and specifically the DNA-methylation rather than histone-mark arm, since TET3 oxidises 5-methylcytosine to initiate DNA demethylation. Four-node pathophysiology: TET3 dioxygenase deficiency -> impaired 5mC oxidation and DNA demethylation -> dysregulated neurodevelopmental gene expression -> neurodevelopmental and growth phenotype; three of the four declare conforms_to. Two points curated deliberately against the usual MDEM expectation and flagged in the description: growth is disrupted in only about half of individuals and overgrowth predominates over undergrowth (the opposite direction from Kabuki or Cornelia de Lange), and the facial features are nonspecific so there is no diagnostic gestalt. The earlier autosomal recessive framing of biallelic cases is recorded as superseded - GeneReviews now reads these as dominant inheritance with variable expressivity. The available DNA-methylation episignature is curated as a diagnostic adjunct only, consistent with the module's standing KNOWLEDGE_GAP that episignatures are biomarkers rather than demonstrated mediators. Prevalence deliberately omitted: no population estimate exists for this recently delineated disorder. Frequency bands on epilepsy (OCCASIONAL, one third), strabismus and refractive error (FREQUENT, about half) each carry their own quantitative snippet. Validation: linkml-validate clean; linkml-term-validator passed; 29 of 29 snippets verified against cached references.

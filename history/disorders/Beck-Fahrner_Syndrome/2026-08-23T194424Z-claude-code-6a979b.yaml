  details: |
    Adversarial pathograph and evidence-claim review of the entry created earlier in this branch. Three changes. (1) An explanation asserted that TET3 variants produce a reproducible change in DNA methylation in affected individuals; the cited sentence says only that methylation profiling helps confirm variant pathogenicity. Rewritten as weak corroborative evidence that is consistent with a methylation defect but does not itself measure one, cross-referencing the module's standing KNOWLEDGE_GAP on episignatures. (2) An explanation bridged from 'TET enzymes have roles in development and neuronal function' straight to dysregulated neurodevelopmental transcription being the consequence of losing TET3; rewritten to state what the quote establishes and to mark the remaining step as an inference supported for this disorder by the MDEM classification in the following item. (3) Added a conforms_to edge from 'Impaired 5-Methylcytosine Oxidation and DNA Demethylation' to the module's chromatin-state node, which the node's own text supports (retained methylation shifting the local chromatin state toward repression) and which the sibling writer-class conformer already declared. All 29 snippets re-verified after the edits.

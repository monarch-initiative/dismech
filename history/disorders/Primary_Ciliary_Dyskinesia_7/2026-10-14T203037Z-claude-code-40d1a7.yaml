  summary: 'Create: Primary Ciliary Dyskinesia 7 (DNAH11)'
  details: |
    New gene-specific entry for CILD7 (MONDO:0012748, DNAH11). Deep research: falcon (Edison) returned 503 'Failed to authenticate' on every attempt, including with --fallback, which did not engage, so the report used is research/Primary_Ciliary_Dyskinesia_7-deep-research-claude_code.md, run directly with the claude_code provider. preflight-dr returned WARN only because the report cites OMIM 603339, the DNAH11 gene record, rather than the phenotype record 611884; the report is about DNAH11 PCD and was used only as a lead. Pathograph: DNAH11 loss of function, then a proximal-only outer dynein arm deficiency that standard TEM misses, then stiff, hyperkinetic beating with reduced bending, then impaired clearance and laterality randomization. iv mouse modelled with a partial-recapitulation caveat (static, not hyperkinetic, cilia). ClinGen Definitive tier copied from the cached CGGV record. Same validation set as PCD3.

  summary: 'Edit: address PR review; correct muscle-tone phenotype from 6/6 hypertonia
    to a 3/3 hypertonia-hypotonia split'
  details: |
    Review-response round on PR #8852, after the entry was created earlier in the same session.

    Addressed an automated review that set CHANGES_REQUESTED twice. Round 1 added the eight >=50%-frequency phenotypes that were absent entirely (hypertonia, absent speech, delayed gross motor development, hyperreflexia, inability to walk, short stature, aggressive behavior, scoliosis), the two neuroimaging phenotypes (CNS hypomyelination, thin corpus callosum), brain MRI and EEG diagnosis entries, a tone- and movement-directed treatment matching the antiseizure entry's epistemic footing, gnomAD constraint prose in genetic.notes, the PMID:23945283 citation for the megaconial histology that distinguishes the CHKB disorder, and notes recording why the CHKA-in-cancer references are cached but deliberately unconsumed.

    Round 2 corrected a substantive factual error introduced in round 1. The entry asserted hypertonia in 6 of 6 individuals. Table 1 of the open-access copy of PMID:35202461 (PMC9630884) actually reads Hypertonia / Hypertonia / Hypotonia / Hypotonia / Hypertonia / Hypotonia across individuals 1.1, 1.2, 2, 3, 4 and 5, so hypertonia is 3 of 6 and hypotonia, previously absent from the entry entirely, is also 3 of 6. The wrong count came from the openscientist report's frequency table, restated in the review, and was curated without being checked against the primary source; the claude_code report had it right. This is the failure mode the repo's evidence discipline exists to prevent, and it mattered because the entry's own notes argued the movement phenotype is mixed while its phenotypes asserted it was uniformly spastic.

    The correction adds Abnormal muscle tone (HP:0003808) as the parent that carries the fully penetrant claim, corrects Hypertonia (HP:0001276) to 3 of 6 with the verbatim table row recorded, adds Hypotonia (HP:0001252) at 3 of 6, rescopes the movement-treatment description which had claimed hypertonia and spasticity in all individuals, and corrects the hyperreflexia description, since Table 1 records brisk reflexes in the hypotonic individuals 2 and 3 as well. The earlier 6 of 6 error is stated in the entry's notes rather than silently amended.

    One reviewer suggestion was declined with evidence: short stature was said to read 3 of 6, but Table 1 records Yes for 1.1 and 1.2, Yes (82 cm, -4 SD) for 2, No for 3 and 4, and Yes (106 cm, -2.3 SD) for 5, which is 4 of 6. The verbatim values were added to notes and the reviewer subsequently withdrew that suggestion. Two further suggestions were declined with reasoning posted on the PR: the movement parent terms HP:0100022 and HP:0002071 are retained rather than removed as redundant, because HP:0100022 carries the entry's only quotable movement evidence and HP:0002071 covers a hyperkinetic subset that hypertonia does not subsume; and CL:0000128 oligodendrocyte was not added to any pathophysiology node, because no study has measured myelin lipid composition or oligodendrocyte function in CHKA deficiency and the term would assert an unshown mechanistic link.

    Also fixed during this round: a check_folded_hyphens CI failure caused by a folded-scalar line ending in a hyphen, which would have rendered as phosphatidyl- ethanolamine; and a merge conflict with main in two sorted term caches, where main added MONDO:0859287 at the same point this branch added MONDO:0859282 - both rows kept in canonical order with nothing dropped.

    Validation after all changes: just validate, just validate-terms and just validate-disorders pass; just count-verified-snippets reports 75/75 verified against cached references; folded-hyphen, duplicate-key, snippet-length, title-snippet, cache-order and term-cache-integrity checks all pass. CI test (3.13) green; the automated reviewer approved.

  details: |
    New Mendelian entry for NEDMIMS (MONDO:0859282, OMIM 620023), the autosomal recessive CHKA (choline kinase alpha) disorder of the CDP-choline/Kennedy pathway.

    Deep research: falcon was attempted first as the default provider and the Edison API returned HTTP 402 Payment Required, so no falcon report exists for this entry. Two reports were produced and both were used: claude_code (5 minutes, 10 web searches, 12 citations) and openscientist (21 minutes, autonomous mode, 5 iterations), which completed after the first draft and supplied the CHKB AAV6 gene-therapy and CDP-choline/citicoline leads now recorded as a fourth discussion. The claude_code report's own reference-validation block reports 6/6 identifiers resolved with confabulation_rate 0.0 but needs_review true, because both quoted claims it checked - both attributed to PMID:41308990 - failed to match the cached source. Neither of those two quotes is used in this entry. The openscientist report resolved 9/9 identifiers with confabulation_rate 0.0. Every snippet was re-derived directly from the cached reference text; no snippet was copied from either report.

    Named-entity-confusion preflight: just preflight-dr against MONDO:0859282 returned PASS on the claude_code report, with CHKA mentioned 48 times against 5 mentions of the nearest rival gene CHKB, which is curated deliberately as a differential diagnosis, and the report OMIM set containing the MONDO xref OMIM:620023. The same check on the openscientist report returned WARN on a false positive: the flagged rival gene PC is that report's abbreviation for phosphatidylcholine, not the pyruvate carboxylase gene. CHKA still dominates that report with 45 mentions, its OMIM set is exactly 620023 and 118491 (the phenotype and the gene), and its narrative is entirely about CHKA, so the WARN was resolved as a lexicon artefact rather than a wrong-entity report. Both preflight verdicts are recorded in the entry notes.

    GeneReviews baseline: a PubMed search for a GeneReviews chapter on CHKA or NEDMIMS returned no results, so no GeneReviews phenotype baseline was available. Phenotype coverage was taken from the single published clinical cohort, PMID:35202461.

    Content curated: an eight-node pathograph running from biallelic hypomorphic CHKA variants through the Kennedy-pathway block, phosphatidylcholine depletion and membrane lipid remodelling, compensatory CCTalpha translocation to the inner nuclear membrane, mitochondrial fragmentation with reduced respiratory efficiency, oxidative stress and lipid peroxidation, to impaired neuronal dendritic and synaptic development and the clinical outcome, with evidence on every causal edge. Nine phenotypes, a genetic block with a PARTIAL_LOSS_OF_FUNCTION genetic_context, two biochemical research readouts, diagnosis, three treatments, two animal models (the constitutive Chka null recorded as FAILS_TO_RECAPITULATE because it is embryonic lethal before E7.5), two experimental models with readouts including the FCCP rescue, three differential diagnoses, and three discussions: a KNOWLEDGE_GAP on why CHKA loss causes brain disease while CHKB loss causes muscle disease, a HUMAN_MODEL_MISMATCH on the absence of any hypomorphic CNS model, an OPEN_QUESTION on the unstated zygosity of the knockout mouse in PMID:42034046, which cannot be a constitutive homozygous null given the reported embryonic lethality, and an OPEN_QUESTION on therapeutic tractability recording the paralogous Chkb AAV6 rescue (PMID:31216357) and the CDP-choline bypass hypothesis (PMID:27769579), both explicitly marked PARTIAL because they concern CHKB rather than CHKA.

    Evidence-scope decision, recorded in the entry notes: the founding report PMID:35202461 caches as abstract only because the publisher PDF returns HTTP 403. Five phenotypes rest on quotable abstract text and carry evidence; four full-text-only phenotypes (extrapyramidal movement abnormalities, nystagmus, abnormal retinal pigmentation, developmental regression) carry an ontology term and an explicit no-evidence notes line explaining why, rather than a fabricated snippet. The residual-activity discrepancy between the two sources (20 and 15 percent in the founding report, 25 and 17 percent in the later mechanistic paper) is preserved and explained in genetic.notes rather than silently reconciled.

    Validation: just validate, just validate-terms and just validate-disorders (the batched check CI runs) all pass; just count-verified-snippets reports 74/74 verified against cached references; just check-duplicate-keys and just check-title-snippets pass. Compliance is 87.9 percent global, 88.2 percent weighted; the remaining gaps are the deliberately evidence-free treatments and differential-diagnosis entries described above.

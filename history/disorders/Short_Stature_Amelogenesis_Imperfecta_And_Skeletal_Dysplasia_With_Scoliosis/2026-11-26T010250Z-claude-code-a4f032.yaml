  summary: 'Gene-family review: SLC10A7; record why no molecular function is bound'
  details: |
    Reviewed SLC10A7 modelling. The loss-of-function node carries no molecular function, and none is added: SLC10A7 is an orphan member of the SLC10 family with no demonstrated transport substrate (PMID:34999954), and its characterised role is to lower store-operated calcium entry and ER/Golgi calcium content (PMID:32350310, PMID:39779512), with direct inhibition of STIM1, Orai1 or SERCA2 only proposed. A transporter term (as in the ai-gene-review core function) or a channel-inhibitor term would assert an unmeasured activity, so the node now carries a note saying so; the calcium and glycosylation processes stay on the downstream nodes. The record (CAUSATIVE, germline, ClinGen Definitive recorded) was already correct.

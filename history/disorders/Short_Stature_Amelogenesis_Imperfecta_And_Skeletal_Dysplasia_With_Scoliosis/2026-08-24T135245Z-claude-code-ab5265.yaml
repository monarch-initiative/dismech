  summary: 'Create: Short Stature, Amelogenesis Imperfecta, and Skeletal Dysplasia
    with Scoliosis (SLC10A7-CDG)'
  details: |
    De-novo creation of the SSASKS (SLC10A7-CDG) entry, MONDO:0032703, claimed via issue #9361.

    Deep research: `just research-disorder claude_code` (one provider run, 13 web
    searches, 22 turns). The report's own reference-validation block reported 8/8
    references resolved, 2/2 quoted claims valid, 8/8 on topic and did not set
    needs_review, so no citation was dropped on that basis.

    NEC preflight: `just preflight-dr` returned WARN, not PASS. SLC10A7 dominated
    (40 mentions) but LTBP3 appeared 10 times. Inspection showed the LTBP3 material
    was confined to the report's own differential-diagnosis and "Important Curation
    Caveat" sections, where the report itself flags the SSASKS/LTBP3-DASS confusion
    as a named-entity-confusion hazard. No LTBP3-derived content was curated as
    SSASKS biology; the confusion is recorded instead as a differential_diagnoses
    entry with an explicit curation-hazard note.

    The report's suggested ontology IDs were NOT trusted and were checked
    individually against OLS4. Several were wrong and were corrected before use:
    HP:0009805 (given as "hypoplastic amelogenesis imperfecta") is actually
    Low-output congestive heart failure; CL:0000414 (given as ameloblast) is an
    obsolete class, the real ameloblast is CL:0000059; GO:0006486 (given as protein
    glycosylation) is obsolete, replaced with GO:0006487; HP:0006247 (given as
    advanced carpal ossification) is Enlarged interphalangeal joints, replaced with
    HP:0004233; UBERON:0001754 and UBERON:0002514 were both mislabelled and were not
    used. The report's "delayed tooth eruption 91.6%" and "oligodontia 88%"
    frequencies had no traceable SSASKS source and were not curated.

    Content: 9-node pathograph from biallelic SLC10A7 loss of function through
    secretory-pathway calcium dyshomeostasis, the Golgi glycosylation and
    glycosaminoglycan defect, and defective post-Golgi glycoprotein delivery, to the
    growth-plate, ameloblast and joint arms and a progressive-dysplasia endpoint.
    Two nodes declare conforms_to against congenital_disorder_of_glycosylation
    (#Golgi N-Glycan Processing and Trafficking Defect, #Protein Hypoglycosylation).
    21 phenotypes, 2 biochemical markers, genetic, prevalence, progression,
    diagnosis, differential diagnoses, 4 treatments, 2 animal models and 2
    experimental models with modeled_mechanisms and readouts, and 3 discussions
    (2 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH for the mouse's absent joint
    dislocation, which is curated as a FAILS_TO_RECAPITULATE link).

    Deliberate non-conformances, recorded in notes: defective_skeletal_mineralization
    (none of its three trigger arms applies — the lesion is failure to deliver a
    normally composed organic matrix) and osteoporosis_bone_resorption (no increased
    osteoclastic resorption reported). No ISDS classification assigned: the
    nosology group description for "dysplasias with multiple joint dislocations"
    does not list SLC10A7, and the slot instructs assigning only listed entries.

    Frequency discipline: with roughly a dozen reported individuals, bands were
    assigned only where a source gives a complete cohort denominator (amelogenesis
    imperfecta and facial abnormality, each 6/6 in the founding cohort). Everything
    else is unbanded.

    No GeneReviews chapter exists for SLC10A7 or SSASKS (PubMed search returned no
    results, 2026-08-24), so the GeneReviews baseline step did not apply. No
    datasets block: `just discover-datasets` found no GEO candidates, as expected at
    this cohort size.

    Validation run and read: `just validate` (schema OK, term validation OK,
    109/109 snippets verified against cached references); `just
    count-verified-snippets` 109/109; `just check-snippet-boundaries` clean; the six
    ungated CI gates all clean (check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-environmental-evidence, check-duplicate-keys,
    check-source-defect-claims); `just check-not4curation` clean; `just
    validate-disorders` (the batched pre-PR sweep CI runs) run over the changed
    file; conforms_to foreign-key test passes. The full tests/test_data.py suite
    passes (36582 tests).

    A pre-PR self-review round was run with a fresh-context subagent following
    .claude/skills/dismech-pr-review and its findings were applied. The
    substantive ones: a VERY_FREQUENT band on `Flat face` rested on a
    six-of-six denominator that belonged to facial dysmorphism as a class, so
    the band moved to a new `Abnormal facial shape` (HP:0001999) phenotype and
    the component features are now unbanded; the joint-instability node was
    re-parented from the post-Golgi trafficking node to the glycosaminoglycan
    node, since routing it through trafficking collapsed the very distinction
    the enamel node exists to express; the trigger node's blanket claim that
    missense variants reduce SLC10A7 protein was narrowed, because
    PMID:31191616 reports the opposite for p.Pro303Leu; the conforming
    hypoglycosylation node gained the module's expected downstream edge, graded
    PARTIAL since no hypoglycosylated client protein has been tied to an SSASKS
    phenotype; and the `notes` frequency policy was rewritten to match the three
    bands actually assigned. Missing phenotypes found in the founding cohort's
    clinical table were added: tooth agenesis (3/6), joint contracture, patellar
    dislocation, atrial septal defect, butterfly vertebrae, coronal cleft
    vertebrae and ptosis. Two evidence items were downgraded SUPPORT to PARTIAL;
    a mangled multi-patient table-extraction snippet in `diagnosis` was replaced
    with a single clean row; cell types were made more specific (CL:0002620 skin
    fibroblast, CL:1000217 growth plate cartilage chondrocyte); and the module's
    expected GO processes (GO:0006491, GO:0006493, GO:0048193) were added to the
    conforming Golgi node. Final weighted compliance 97.2%, 122/122 snippets
    verified.

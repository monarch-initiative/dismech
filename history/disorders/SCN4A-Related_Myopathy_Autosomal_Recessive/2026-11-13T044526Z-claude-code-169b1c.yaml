  summary: 'Create: SCN4A-Related Myopathy, Autosomal Recessive'
  details: |
    Created the entry for MONDO:0100121 from the stubs/ queue (stub deleted). Scope follows the ClinGen lumping (Definitive, AR, Congenital Myopathies GCEP, CGGV assertion f71b22d2, cached and quoted): all recessive SCN4A presentations are one entity, recorded as three has_subtypes rows bound to MONDO terms: CM22B severe fetal (MONDO:0957265), CM22A classic (MONDO:0957247) and CMS16 (MONDO:0013620). CM22A and CM22B are not MONDO children of MONDO:0100121 although its definition covers fetal hypokinesia; this is recorded in review_notes as a MONDO inconsistency. CMS16 had no structured representation anywhere in kb/ (Congenital_Myasthenic_Syndrome.yaml mentions it only in notes, saying it is uncurated); that entry was not edited here.

    Name kept as the MONDO and ClinGen label; SCN4A-related congenital myopathy added as a synonym but not used as the name because it would exclude the myasthenic presentation.

    Pathograph: Nav1.4 loss of function (conforms to neuromuscular_transmission_failure#Endplate Component Lesion) branches to an attenuated muscle fiber action potential, then reduced force generation feeding the myopathic phenotypes, and to loss of the endplate safety factor (conforms to neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission) feeding fatigability, decrement and episodic weakness. Fetal hypokinesia has sequelae for polyhydramnios, contractures, pulmonary hypoplasia and hydrops. 22 of 23 phenotypes are causally connected; craniosynostosis is deliberately left unwired because its link to the channel defect is unexplained. Perinatal death is not a phenotype row because HP:0003811 is outside the PhenotypeTerm enum (validate-terms rejected it); it is described on the CM22B row instead.

    Sources: primary literature fetched with just fetch-reference (Zaharieva 2016 Brain cohort PMID:26700687 as the phenotype baseline, Tsujino 2003, Arnold 2015, Habbout 2016, Elia 2019, Gonorazky 2017, Berghold 2022, the 2020 P1650L CMS report, the Nav1.4 null mouse PMID:27048647, the 2023 literature review PMID:38187266 for frequencies, a 2024 prenatal report and a 2026 review). No GeneReviews chapter is specific to this disease; check-genereviews --online lists only the dominant periodic paralysis chapters and the Overview-format CMS chapter as candidates. The openscientist deep-research report (10/10 references resolved, 0 unresolved, 0 off topic; 27/28 terms resolved, the one mislabel being a 'Mondo' heading) was read and used as a cross-check; preflight-dr PASS (SCN4A mentioned 52 times). Every PMID it cites was already in the entry. All 87 snippets verified against the cache; validate, validate-terms and the whole-repo gates passed.

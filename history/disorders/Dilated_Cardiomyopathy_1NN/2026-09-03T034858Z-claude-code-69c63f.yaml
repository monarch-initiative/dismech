  summary: 'Edit: address CHANGES_REQUESTED review on PR #10650'
  details: |
    Addressed the three blocking evidence findings from the automated review of PR #10650.

    Item 1 - diagnosis 'Cardiomyopathy Gene Panel Including RASopathy Genes' cited PMID:29696744 as a single SUPPORT item, but that paper's own dilated-cardiomyopathy result is negative. Split into three evidence items per the CLAUDE.md rule that a source supporting one part of a claim and contradicting another becomes two items, each quoting the sentence that carries it. The SUPPORT item keeps the background sentence establishing why RAF1 sits on a cardiomyopathy panel, extended to include its '(Dhandapany et al., 2014)' attribution so the quote shows it is a citation and not a result, regraded to directness INDIRECT, with an explanation that no longer reads as an endorsement. Two new REFUTE items quote the study's null yield in its 419-patient DCM sub-cohort ('No variants of clinical significance were identified in the DCM sub-cohort') and its recommendation ('there appears little, if any, benefit to testing individuals with DCM'). The entry description was rewritten to state the negative result rather than only hedging that hypertrophic yield is highest.

    Item 2 - pathophysiology node 'RAF1 Missense Variant Altering Kinase Activity' described the same reference as an 'Independent restatement'. The source sentence ends '(Dhandapany et al., 2014)', citing the discovery paper already used on that node, so the claim of independence was wrong. Snippet extended to include that attribution, evidence_source changed HUMAN_CLINICAL -> IN_VITRO (the sentence restates kinase biochemistry, not a clinical result from this sequencing cohort), directness DIRECT -> INDIRECT, explanation rewritten to say the source is a citation of the discovery paper.

    Item 3 - treatment 'Heart Failure Pharmacotherapy' had a bare NCIT:C15986 with no therapeutic_agent and no evidence. Added five NCIT drug-class agents, each CURIE verified against NCIT via OLS rather than taken from the deep-research report: NCIT:C247 ACE Inhibitor, NCIT:C190796 Angiotensin Receptor-Neprilysin Inhibitor, NCIT:C29576 Beta-Adrenergic Antagonist, NCIT:C101255 Aldosterone Receptor Antagonist, NCIT:C98083 SGLT2 Inhibitor. The falcon report's suggested NCIT:C2478 for 'ACE inhibitor' resolves to Dinitrophenyl and was not used. Loop diuretic was deliberately left unbound because no source cited in this entry states that indication for dilated cardiomyopathy, and the omission is recorded in the treatment description. Two new references fetched with just fetch-reference: PMID:39064249 (names the four-pillar class set as standard HFrEF therapy) and PMID:37876955 (a 30-year childhood dilated-cardiomyopathy cohort documenting real ACE-inhibitor, aldosterone-antagonist and beta-blocker use).

    Non-blocking suggestions taken: PMID:36927384's 'The experimental data suggest...' snippet regraded COMPUTATIONAL -> IN_VITRO, since that sentence summarises the prior kinase measurements the paper sets out to explain rather than its own molecular-dynamics result, which is cited separately and stays COMPUTATIONAL. Both truncated snippets extended past the cache's run-together HTML-italics artifact so their subject or attribution is visible. Both treatments joined to the pathograph via target_mechanisms: pharmacotherapy MODULATES 'Ventricular Dilation and Systolic Dysfunction' (neurohormonal blockade acts on remodelling, not on the RAF1 lesion), heart transplantation BYPASSES 'Heart Failure'.

    Deliberately not done: CMD1NN still not added to kb/groupings/Familial_Dilated_Cardiomyopathy.yaml. PRs #10647 and #10649 are editing that file concurrently and the grouping rationale needs a prose edit to admit a signalling-kinase mechanistic class; the deferral is flagged for the maintainer in the entry notes.

    Validated: just validate (schema + terms + references, 33/33 snippets verified), validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-source-defect-claims, validate-disorders. No cache/ churn: both new NCIT CURIEs were already present in cache/ncit/terms.csv and the chemicalentityterm enum cache with matching labels.

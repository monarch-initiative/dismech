  details: |
    Addressed both CHANGES_REQUESTED findings, both of which were contradicted by the full text of PMID:24777450 cached in this PR (content_type: full_text_xml). Finding 1: three places stated or implied every reported allele is missense, but the discovery study's North Indian cohort yielded a frameshift truncation (p.R254fs) that was functionally characterised alongside the missense alleles. Corrected the inheritance description, renamed the pathophysiology node from 'RAF1 Missense Variant Altering Kinase Activity' to 'RAF1 Variant Altering Kinase Activity' (verified the old string occurred only at its definition, so no bare-name downstream target or pathophysiology# entity reference dangles), and rewrote the node description to name the truncating allele. Added two evidence items quoting the discovery paper directly: the Group 2 variant-identification sentence, and the sentence showing p.R254fs behaves like the kinase-impairing p.Leu603Pro allele. The second is graded IN_VITRO because the kinase-activity and ERK-activation measurements are cell-based assays. The truncating allele strengthens rather than weakens the node's argument that no single gain-of-function or loss-of-function label fits the allele set. Finding 2: three places described the zebrafish work as constitutive transgenic expression; the mutants were delivered by mRNA microinjection at the one-cell stage, and the paper's only transgenic line is the Tg(cmlc2:EGFP) cardiac reporter. Corrected all three, which strengthens the stated limitation since transient overexpression is further from a heterozygous endogenous allele than a transgenic line would be. Also merged origin/main, resolving additive conflicts in cache/enums/diseaseterm and cache/mondo/terms.csv by union with every CURIE from both sides preserved. Validation: just validate 35/35 snippets verified (up from 33), validate-terms passes, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-grading, check-snippet-length and check-title-snippets all clean.

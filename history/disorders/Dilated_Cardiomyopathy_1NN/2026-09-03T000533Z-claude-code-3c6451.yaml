  summary: 'Create: Dilated_Cardiomyopathy_1NN'
  details: |
    Created kb/disorders/Dilated_Cardiomyopathy_1NN.yaml (MONDO:0014396, OMIM 615916, RAF1 hgnc:9829) replacing a seed-stub placeholder. Lump/split call: curated as a standalone Disease rather than a has_subtypes entry on Noonan_Syndrome. Justification is functional rather than positional - the Noonan RAF1 hotspot alleles raise kinase activity and enhance ERK activation and produce hypertrophic cardiomyopathy (PMID:17603483), whereas the dilated-cardiomyopathy alleles leave ERK activation largely unaltered and hyperactivate AKT in a BRAF-dependent manner (PMID:24777450). The CR2-versus-CR3 domain segregation proposed in the commissioning issue was checked and NOT asserted: the six discovery alleles span the CR2-CR3 linker, the kinase domain and the C-terminal tail, and the C-terminus carries both classes (DCM L603P vs HCM S612T/L613V, PMID:36927384). Pathograph: RAF1 missense variant altering kinase activity -> BRAF-dependent AKT hyperactivation -> mTOR pathway activation -> ventricular dilation and systolic dysfunction -> heart failure, with three nodes conforming to cardiomyopathy_maladaptive_remodeling. Zebrafish overexpression model curated with a RESTORED rapamycin-rescue readout and a HUMAN_MODEL_MISMATCH discussion about transgenic overexpression versus heterozygous human dosage. Absence of a ClinGen RAF1-dilated-cardiomyopathy gene-disease validity assertion recorded as a KNOWLEDGE_GAP discussion; PMID:30762279 recorded as a REFUTE evidence item on the gene because every pathogenic RASopathy-gene finding in that panel cohort came from a hypertrophic-cardiomyopathy referral. References fetched with just fetch-reference: PMID:36927384, PMID:30762279, PMID:29696744, PMID:30384889, PMID:26380542. Validated: just validate (schema+terms+references, 28/28 snippets verified), validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, validate-disorders. Not done: CMD1NN was not added to kb/groupings/Familial_Dilated_Cardiomyopathy.yaml despite being a MONDO child of its mapped term, because a concurrent branch is editing the same file and the grouping rationale would need a prose edit to admit a signalling-kinase mechanistic class.

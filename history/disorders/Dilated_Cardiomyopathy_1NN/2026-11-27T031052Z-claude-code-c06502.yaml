  summary: 'Gene-family review: RAF1'
  details: |
    The RAF1 record was typed CAUSATIVE with no origin. Its evidence is one discovery study (rare functional RAF1 variants in about 9% of childhood-onset DCM in three cohorts, with altered kinase activity and AKT hyperactivation; PMID:24777450) and a clinical panel cohort whose RAF1-positive patients were all tested for HCM, none for DCM (PMID:30762279, recorded as REFUTE). ClinGen has not graded RAF1 for this disease. Retyped UNKNOWN with variant_origin GERMLINE and a note; the 'RAF1 Variant Altering Kinase Activity' node (protein serine/threonine kinase activity ABNORMAL) matches the altered, not uniformly increased, kinase activity reported and was left unchanged.

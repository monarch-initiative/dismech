  summary: Audit evidence grading and enrich classifications, pathophysiology grounding,
    phenotype causal edges, diagnosis, and subtype-scoped treatments
  details: |
    Added ICD-O morphology (Neuroendocrine Neoplasm) and Harrison's chapter classifications (ENDOCRINOLOGY_METABOLISM, ONCOLOGY_HEMATOLOGY). Grounded Clonal Expansion of an Adenohypophyseal Cell Lineage with adenohypophyseal cell types, proliferation GO process, molecular_functions (GO:0000981, GO:0003924, GO:0101005, GO:0004930), and GERMLINE_AND_SOMATIC genetic_context. Wired all 8 phenotypes via bare-name downstream edges, added frequencies and cohort/trial evidence (PMID:38567166, PMID:7915824), bound NCIT diagnosis terms across MRI, hormone measurement, and transcription-factor IHC, added context-scoped dopamine agonist, transsphenoidal surgery, somatostatin receptor ligand, and radiotherapy treatments with target_mechanisms, and corrected review/background quote_role grading on PMID:29687298 and PMID:37074863.

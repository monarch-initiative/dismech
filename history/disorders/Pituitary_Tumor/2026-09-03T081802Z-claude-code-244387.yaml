  summary: Anchor MONDO:0006373 pituitary gland adenoma as a narrowMatch
  details: |
    Issue #10069 asked for a new entry for pituitary gland adenoma, MONDO:0006373. That entry already exists here under the parent term MONDO:0017611 pituitary tumor, created 2026-08-19, with the lineage-based has_subtypes and the hypersecretion/mass-effect split the issue proposed.

    Added a mappings.mondo_mappings block - the entry previously had no mappings: block at all - binding MONDO:0006373 with skos:narrowMatch. Per CLAUDE.md, narrowMatch counts toward MONDO coverage, so this retires the term from the curation queue and stops the priority dashboard re-nominating it.

    narrowMatch rather than exactMatch is deliberate: this entry is genuinely broader than adenoma, since its subtypes include pituitary carcinoma MONDO:0002109 and posterior pituitary tumors MONDO:0003257, neither of which is an adenoma. Recording it as exactMatch would be the bare parent-term reuse that design-decisions L4 warns against.

    Validation: just validate and just validate-terms both pass; the conforms_to foreign-key test suite passes.

  summary: 'Create: ETV6-Related Thrombocytopenia (MONDO:0014536)'
  details: |
    New entry for thrombocytopenia 5 (ETV6-related thrombocytopenia), curated from primary literature and the GeneReviews chapter (PMID:33226740, tagged as the phenotype baseline). The name follows the established gene-related form used in the literature (PMID:27365488 title, PMID:35586967); the MONDO label and the GeneReviews title are kept as synonyms. ClinGen Definitive (AD) tier copied from CGGV:assertion_92a8c1cb-91c1-45cd-adbe-4180b1f6da7d-2020-01-22T170000.000Z. The causal chain runs from dominant-negative cytoplasmic retention of mutant and wild-type ETV6 (XPO1-dependent nuclear export for p.Pro214Leu, PMID:40238870) to loss of transcriptional repression, then branches to megakaryocyte maturation arrest, cytoskeletal dysregulation and impaired proplatelet formation (thrombocytopenia, platelet dysfunction, bleeding), to dyserythropoiesis (variable macrocytosis), to HDAC3/NCOR2 mislocalisation with interferon response gene derepression, to sterile marrow inflammation and impaired B-lymphoid development (mouse, PMID:35803545), and to clonal leukaemic transformation with somatic loss of the wild-type allele. Kept separate from somatic ETV6-altered leukaemia entries. One openscientist deep-research report was used as leads only: 16/16 references resolved, preflight-dr PASS (ETV6 mentioned 109 times). Its term section flagged HP:0001972 (Macrocytic anemia), which the report used for macrocytosis; the entry binds HP:0005518 Increased mean corpuscular volume instead, since carriers are not anaemic. Its 10-45% malignancy risk figure is pooled across RUNX1, ETV6 and ANKRD26, so it was not used; the ETV6-specific ~30% leukaemia figure from PMID:31248877 is cited instead. PMID:37597896, 33475741 and 37985135 were fetched but returned no usable content and are not cited. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-genereviews (TAGGED) and the whole-repo gates.

  summary: Review, enrich, and address Round 1 PR review findings for Primary_Progressive_Aphasia
  details: |
    Initial enrichment added NEUROLOGIC and proteotoxic disease classifications, 4-node language-network cascade, C9orf72 cohort case fraction, neuroimaging/neuropsychological diagnostics, and speech-language therapy mechanism link. Round 1 PR review follow-up added five variant-defining phenotypes (Anomia, Agrammatism and Effortful Speech, Impaired Single-Word Comprehension, Surface Dyslexia, and Impaired Sentence Repetition) scoped to their canonical subtypes and wired from Progressive Language Network Degeneration, replaced the study-aim snippet on Language and Neuropsychological Assessment with Gorno-Tempini 2011 consensus diagnostic criteria (PMID:21325651), replaced the imaging-methods snippet on the white-matter disconnection edge with DTI lexical-retrieval correlation evidence (DOI:10.3389/fneur.2013.00212 and PMID:34266501), removed unsupported OCCASIONAL frequency on Speech Apraxia, replaced unproven GO:0051402 neuron apoptotic process with GO:0008219 cell death, retagged Focal Left-Hemisphere Language Cortex Degeneration to TISSUE scale, rebound cortical nodes to CL:0010012 cerebral cortex neuron, and documented GO:0006006 as the FDG-PET hypometabolism proxy.

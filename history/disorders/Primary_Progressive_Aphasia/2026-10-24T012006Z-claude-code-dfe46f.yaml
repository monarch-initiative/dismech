  summary: 'Genetics pass: repair the severed pathograph, correct MAPT, route the
    GRN subtype to the FTD entry'
  details: |
    Genetics pass for issue 12278 (series-071), one of four parents deferred from PR 13315.

    Measured before and after with dismech.qc_plugins: phenotype causal inlink 0/2
    to 2/2; pathophysiology nodes with no outgoing downstream edge 1 to 0; genes
    wired 0/2 before and after, by the reasoning below; has_subtypes rows carrying
    a bound subtype_term 0/3 to 1/3.

    The entry had one pathophysiology node, it was a dead end, and neither
    phenotype had an incoming causal edge, so the pathograph was two disconnected
    islands while check-causal-targets was green. Both repair edges are drawn from
    evidence already in the entry.

    The checklist row MONDO:0011842 is not curated here and the reasoning is in the
    entry's notes. Its MONDO definition calls it a frontotemporal dementia of
    variable, typically behavioural presentation; MONDO gives it MONDO:0017276 as a
    second parent; and Frontotemporal_Dementia.yaml already wires GRN as a causal
    gene where this entry wires nothing. The subtype row was added there instead.

    MAPT was curated as Causative on the strength of a review sentence about the
    FTD spectrum. PMID:25765123, already listed in this entry's references with an
    empty findings list, screened MAPT, GRN and C9ORF72 in 100 PPA patients and
    found MAPT in none. That is now a REFUTE item and the association text and
    review_notes qualify the claim. GRN carries the PPA-specific case fraction from
    the same cohort, 3 of 100, and a review_notes recording why it is bound but not
    wired: progranulin has no molecular function the cited sources state, so an MF
    binding would read as sourced when it is inferred from the protein's name, and
    the check-gene-activity-grounding ratchet would require one on any landing node.
    C9ORF72, found in 2 of 100 by the same cohort, is recorded in notes as a gap
    rather than added, since adding a gene the gap list did not raise was out of
    scope.

    The logopenic row is bound to MONDO:0016644, a direct child of this entry's
    term and bound nowhere else in the knowledge base. The other two variants are
    deliberately left unbound: MONDO:0010857 is the disease_term of
    Semantic_Dementia and MONDO:0015059 is already a has_subtypes row on
    Frontotemporal_Dementia.

    Synonyms added from MONDO:0019806's exact synonyms, so the GeneReviews
    no-chapter verdict is a verified negative; re-running just check-genereviews
    confirms the unproven-verdict note is gone. The six PMID:19300609 evidence
    items were graded OTHER, since the publication is a review and they were
    relying on the absent-value HUMAN_CLINICAL default.

    A MONDO structural problem is recorded in notes and was not filed upstream:
    MONDO reaches both the nonfluent/agrammatic and semantic PPA variants only
    through the GRN-defined term, and files semantic dementia under the nonfluent
    variant and under behavioural-variant FTD.

    Validation on the final tree: just validate, just validate-terms and
    just count-verified-snippets clean; 15/15 snippets verified after reverting the
    validator's reference-cache renormalisation.

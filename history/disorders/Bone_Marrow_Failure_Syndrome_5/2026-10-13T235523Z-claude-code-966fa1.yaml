  summary: 'Create: Bone_Marrow_Failure_Syndrome_5'
  details: |
    New entry for bone marrow failure syndrome 5 (MONDO:0032573), germline TP53 activation syndrome caused by heterozygous C-terminal truncating TP53 frameshifts. Curated from four case-report abstracts (PMID:30146126, PMID:35084091, PMID:35362179, PMID:42104732; seven patients), three reviews (PMID:37834388, PMID:30624728, PMID:36198537) and the p53-delta-31 mouse paper (PMID:23770245). One deep-research report was used as a lead only: the falcon provider failed authentication (503 Failed to authenticate) on two attempts and on a later providers --check, so the claude_code provider was used instead; its OMIM-summary leads (infantile onset, developmental delay) were not used except where a cached abstract states them. preflight-dr exited 2 because the local mondo.db is absent. Lump/split: kept as a separate DISEASE, not a Diamond-Blackfan anaemia subtype and not a Li-Fraumeni subtype; Li-Fraumeni cancer risk not imported. Gaps recorded: cancer risk unknown (no malignancy in the four abstracts), mechanism of hypogammaglobulinaemia unknown and left unwired, extra-haematopoietic edges rest on mouse data under an EMERGING hypothesis group, heterozygous-human versus homozygous-mouse dosage mismatch, no ClinGen assertion for this disease, no GeneReviews chapter, case-report full texts not cached. Validated with just validate, validate-terms, count-verified-snippets (62/62), entity-ref, causal-target, duplicate-key, qualifier, genereviews, gene-term-mismatch, block-scalar, the ungated snippet/title/grading/retired-prose/environmental/coarse/reference-title/folded-hyphen gates, check_gene_activity_grounding --against-ref origin/main, and validate-disorders, all passing.

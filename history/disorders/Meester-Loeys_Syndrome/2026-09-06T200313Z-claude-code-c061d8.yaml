  summary: 'Create: Meester-Loeys Syndrome'
  details: |
    De novo curation of Meester-Loeys syndrome (MONDO:0010515, X-linked BGN-related syndromic aortopathy). Drafted from primary literature; the openscientist deep-research report arrived before the PR and was reconciled in, contributing the surveillance treatment entry. Preflight returned WARN on ATP2B3, which is the contiguous-gene hypothesis for one deletion patient rather than entity confusion. Four pathophysiology nodes run from loss-of-function BGN variants through loss of biglycan from the arterial matrix (with elastic fibres preserved, unlike Marfan medial degeneration) and increased aortic-wall TGF-beta signalling to tree-wide arterial dilatation. A CONTROVERSY discussion records that the aortic-wall TGF-beta finding is replicated but that reporter assays showed the opposite direction and patient dermal fibroblasts showed no difference at all. A second KNOWLEDGE_GAP records that no missense-only pathogenic allele exists across 18 probands and that the group reporting it uses a filter that would exclude one. Reference titles and snippets were taken from the reference cache rather than a metadata API, which is how a title mismatch was caught. Validated: just validate (40/40 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-enum-values all pass.

  details: |
    Round 1 rebound two ontology terms and renamed two nodes but left the description sentence that argued for each old binding, so the prose asserted the opposite of the YAML and would have rendered that way on the disorder page. The aneurysm phenotype said it was bound to the general aortic aneurysm term when it is now HP:0002617 Vascular dilatation, and the pectus phenotype said it was bound to the carinatum term when it is now HP:0000766 Abnormal sternum morphology. Both are rewritten to justify the terms actually bound, keeping the clause about the source not specifying pectus direction, which was correct and is the reason the parent term is right. Also corrected an overstatement introduced by round 1 itself: the new histopathology description said the contrast is with Loeys-Dietz and Marfan, while the paper draws it with Loeys-Dietz only; the description is narrowed and the comparator sentence is added as a second evidence item so the comparative claim carries its own citation. Added a notes paragraph recording that MPATH and PATO were searched for the histopathology finding_term and neither has a term for the conjunction of preserved elastic fibres with low to normal collagen, so it stays free text. Added a second notes paragraph recording the pattern itself, since this is the third time in this review batch that a description was found still arguing for a replaced binding: rebinding a term means editing the sentence that justified the old one, and nothing validates prose. Validated: just validate (44/44 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-enum-values; grep confirms no residual references to HP:0004942, HP:0000768 or the old term names.

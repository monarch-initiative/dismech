  summary: 'Review round 1: address ai4c-reviewer CHANGES_REQUESTED on PR #14972'
  details: |
    Addressed the automated review of PR #14972. Fixed the radiation-therapy claim/evidence mismatch (dropped the snippet that did not mention radiotherapy; recorded case-level/unsourced use in notes). Removed icdo_morphology: Sarcoma because AFH is ICD-O 8836/1 (intermediate, rarely metastasizing) and no ICDOMorphologyEnum value fits a /1 behaviour; reason recorded in review_notes. Added a diagnosis section (EWSR1/FUS break-apart FISH plus RT-PCR/RNA-NGS molecular confirmation, PMID:19801966 and PMID:25804255; supportive IHC panel, PMID:10571514). Added a Morphologic variants histopathology item (PMID:24043718). Swapped the anemia phenotype from a background statement to a primary observation of microcytic anemia (PMID:29932283). Softened the CDKN2A/B metastasis edge from "marks and enables" to "restricted to the metastatic cases". Noted the context-dependent proliferative program (fusion lethal in stem cells) on the proliferation edge. Recorded the HPO lymph-node-metastasis search on the nodal-metastasis phenotype and the crizotinib omission in review_notes. Re-validated: just validate-disorders (44/44 snippets, 0 issues), check-causal-targets, check-entity-refs, check-duplicate-keys all clean. Weighted compliance 85.9%. Follow-up: the whole-repo CI gates (not part of validate-disorders) failed on two new findings - a 4-word snippet ("Less than 5% metastasize.") and five genes landing on a fusion node with no molecular_functions. Fixed by lengthening the metastasis snippet (PMID:23199525 nodal-metastasis sentence) and binding GO:0003700 DNA-binding transcription factor activity (GAIN_OF_FUNCTION) on the FET-CREB fusion node; also added a second IHC snippet (PMID:10571514 S100/CD34-negative panel) per an optional reviewer note. Re-ran check_snippet_length and check_gene_activity_grounding against origin/main, both clean.

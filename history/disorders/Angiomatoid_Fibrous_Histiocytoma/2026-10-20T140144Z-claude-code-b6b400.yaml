  summary: 'Create: Angiomatoid Fibrous Histiocytoma'
  details: |
    De novo curation of angiomatoid fibrous histiocytoma (MONDO:0012809), a FET-CREB fusion-driven soft tissue neoplasm. Deep research via claude_code provider (Edison/falcon was requested but its API key returned 403; switched to claude_code at the user's direction). Built a causal pathograph: FET-CREB fusion -> constitutive CRE-dependent transcription -> neoplastic myoid proliferation and tumor IL-6 overproduction -> multinodular tumor architecture and paraneoplastic inflammatory syndrome -> phenotypes and metastasis, with a contested IL-6 autocrine-growth edge (SUPPORT PMID:29932283 / REFUTE PMID:34221525) tracked as a mechanistic_hypothesis and CONTROVERSY discussion. Genes EWSR1/CREB1/ATF1/FUS/CREM as SOMATIC_DRIVER. Evidence from primary fusion papers (17724745, 18094413, 11063792, 19801966), case series (10571514, 2174650, 228836), IL-6/tocilizumab reports (26165403, 32546510, 29932283, 34221525), and reviews (25927151). Validated with just validate-disorders (schema+terms+41/41 snippets, 0 issues), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, list-gene-term-mismatches (0), and check-genereviews (NO_CHAPTER, expected for a somatic neoplasm). Weighted compliance 87.4%.

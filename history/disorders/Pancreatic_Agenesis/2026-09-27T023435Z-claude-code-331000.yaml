  summary: 'Genetics pass: bind pancreatic agenesis 1-3 subtypes and curate ZNF808'
  details: |
    Genetics pass for issue dismech#12264 (d2g series-057). Verified the parent anchor: MONDO:0009832 is the correct class and all three MONDO-numbered children (pancreatic agenesis 1/2/3) are direct hierarchical children of it, so the re-nomination mechanism here is absent has_subtypes rows rather than an over-broad anchor. Added four has_subtypes rows: GATA6 (unbound subtype_term, with MONDO:0100540 recorded as skos:broadMatch because MONDO files GATA6 pancreatic involvement under a congenital heart disease class outside MONDO:0009832), PAGEN1 bound to MONDO:0024547, PAGEN2 to MONDO:0014406, PAGEN3 to MONDO:0975839; each carries genes and, except where no source states it, an inheritance block with exact-quote evidence. Curated ZNF808 (hgnc:33230, read live from rest.genenames.org) as a new causal gene from PMID:37973953, with a mechanism-specific pathophysiology node for loss of transposable-element silencing and misdirected endodermal cell fate, a disease-level autosomal recessive inheritance block, and reciprocal genetic subtype foreign keys. Added relationship_type CAUSATIVE to all four genetic rows. Added a references block tagging the GeneReviews permanent neonatal diabetes chapter (PMID:20301620), which is the nearest GeneReviews baseline; check-genereviews reports no chapter titled for pancreatic agenesis itself. Recorded in notes that MONDO:0009832 carries pancreatic agenesis type 1 as an exact synonym while MONDO:0024547 is the class so labelled, and that Orphanet and the bulk ClinGen CSV could not be consulted from this checkout. Validation: just validate passed, validate-terms passed, 48/48 snippets verified, gene-term identity 28/28 compared against HGNC with 0 findings.

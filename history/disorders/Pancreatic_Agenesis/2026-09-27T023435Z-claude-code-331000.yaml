  summary: 'Genetics pass: bind pancreatic agenesis 1-3 subtypes and curate ZNF808'
  details: 'Genetics pass for issue dismech#12264 (d2g series-057). Verified the parent anchor:
    MONDO:0009832 is the correct class and all three MONDO-numbered children (pancreatic agenesis
    1/2/3) are direct hierarchical children of it, so the re-nomination mechanism here is absent
    has_subtypes rows rather than an over-broad anchor. Added four has_subtypes rows: GATA6
    (unbound subtype_term, with MONDO:0100540 recorded as skos:broadMatch because MONDO files
    GATA6 pancreatic involvement under a congenital heart disease class outside MONDO:0009832),
    PAGEN1 bound to MONDO:0024547, PAGEN2 to MONDO:0014406, PAGEN3 to MONDO:0975839; each carries
    genes and, except where no source states it, an inheritance block with exact-quote evidence.
    Curated ZNF808 (hgnc:33230, read live from rest.genenames.org) as a new causal gene from
    PMID:37973953, with a mechanism-specific pathophysiology node for loss of transposable-element
    silencing and misdirected endodermal cell fate, a disease-level autosomal recessive inheritance
    block, and reciprocal genetic subtype foreign keys. Added relationship_type CAUSATIVE to
    all four genetic rows. Added a references block tagging the GeneReviews permanent neonatal
    diabetes chapter (PMID:20301620), which is the nearest GeneReviews baseline; check-genereviews
    reports no chapter titled for pancreatic agenesis itself. Recorded in notes that MONDO:0009832
    carries pancreatic agenesis type 1 as an exact synonym while MONDO:0024547 is the class
    so labelled, and that Orphanet and the bulk ClinGen CSV could not be consulted from this
    checkout. Validation: just validate passed, validate-terms passed, 48/48 snippets verified,
    gene-term identity 28/28 compared against HGNC with 0 findings. Review round 1 (#12972):
    split the ZNF808 node in two on the reviewer''s I1, because it bundled a molecular step
    and a cellular one while carrying a single biological_scale. ZNF808 Loss and Transposable
    Element Derepression (MOLECULAR, GO:0010526 DECREASED) now flows into Endodermal Fate Misspecification
    Toward Hepatic Identity (CELLULAR, GO:0001714 ABNORMAL), which flows into the existing convergence
    node; the in vitro snippet states both steps and is cited on both nodes with the same grading.
    Trimmed repository-state prose out of notes. Sources searched and not cited, recorded here
    rather than in notes: no references_cache/ORPHA_2805.md file exists for the Orphanet record
    MONDO:0009832 cross-references, and populating one would need a maintainer bulk refresh
    of Orphadata; none of the 664 committed references_cache/CGGV_*.md files carries a gene-disease
    validity row for GATA6, PDX1, PTF1A or ZNF808, and the bulk gene_validity.csv is gitignored
    and absent. Self-review before the verdict landed removed unsourced wording: ZNF808 having
    no rodent counterpart where the source says primate-specific, a stem-cell-derived in vitro
    system the abstract does not name, and a count of four population datasets taken from a
    list the quoted snippet truncates before.'

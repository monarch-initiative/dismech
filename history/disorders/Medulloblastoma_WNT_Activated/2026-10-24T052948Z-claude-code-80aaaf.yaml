  summary: Add GEO datasets to Medulloblastoma_WNT_Activated
  details: |
    Added a datasets block with geo:GSE41842 geo:GSE163810. Candidates came from targeted NCBI GEO DataSets title searches for the molecular stratum (not the parent disease), because just discover-datasets returned mostly generic parent-disease hits. Each accession was resolved with just verify-datasets, which wrote its references_cache/GEO_*.md record. Titles are copied verbatim from GEO; each record carries one evidence item quoting the cached GEO summary, and sample_count/data_type come from GEO esummary metadata. Validated with just validate-disorders (all snippets and titles verified).

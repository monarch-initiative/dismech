  summary: 'Create: Kaya-Barakat-Masson Syndrome (YIF1B)'
  details: |
    Created de-novo entry for Kaya-Barakat-Masson syndrome / YIF1B-related neurodevelopmental disorder (MONDO:0030878, OMIM 619125), autosomal recessive. Causal chain: YIF1B loss of function (MOLECULAR) -> impaired anterograde ER-to-cell-membrane trafficking with Golgi and primary-cilium alterations (CELLULAR) -> disrupted brain development (TISSUE) -> the neurodevelopmental, movement, ophthalmologic and autonomic phenotype. relationship_type CAUSATIVE with a recorded ClinGen gene_disease_validity assertion (DEFINITIVE, AR, Syndromic Disorders GCEP, CGGV:assertion_c0891180-...). All 14 phenotypes causally connected. GeneReviews chapter (PMID:39265055, YIF1B-Related Neurodevelopmental Disorder) tagged in references: and used as the phenotype baseline; it added ophthalmologic involvement and hypoventilation, and I dropped an initial memory-based temperature-dysregulation claim and a scoliosis claim that the cached sources (GeneReviews + PMID:33103737 Brain 2020 mechanism paper + PMID:34373908 2021 cohort + PMID:36948290 2023 case/review) do not support. Evidence graded by source: GeneReviews synthesis quotes carry quote_role REVIEW_SYNTHESIS; the primary-cilium fibroblast result is IN_VITRO and the Yif1b-KO CNS result MODEL_ORGANISM. prevalence CASES_IN_LITERATURE (~24 patients to 2023). Added a KNOWLEDGE_GAP (no disease-modifying therapy) and a supportive-care treatment. Deep research: openscientist (key set) is non-functional in this environment (missing agentapi binary); DR run via the claude_code provider (report committed), reference_validation 3/3 on-topic, term_validation 25/25 resolved, just preflight-dr PASS (YIF1B x17, OMIM 619125 matches). Bound GO:0005515 protein binding (YIF1B's only QuickGO MF annotation) on the gene node to satisfy gene-activity grounding. A fresh-context red-team self-review (dismech-pr-review) was run before any PR; its blocking findings were applied in one pass: added a diagnosis: section mining the GeneReviews Diagnosis/Testing statement; added the variant spectrum (truncating/whole-gene-deletion n=18 vs missense n=6), the two recurrent founder alleles (p.Ala63fs in five families, p.Glu200* in three Somali families) as variants:, and the truncating-vs-missense genotype-phenotype correlation from PMID:34373908; added Autistic behavior (HP:0000729, 4/13 = 30.8% from PMID:34373908 Table 1) wired into the pathograph; and renamed the generic "Movement disorder" node to "Hypotonia" to match its HP:0001252 binding (resolving a name/term self-consistency gap). Validated with validate-disorders (30/30 snippets, 30/30 titles), validate-terms, check-folded-hyphens and check-snippet-grading (whole-tree, no new divergences), and the offline check-* gates (entity-refs, causal-targets, logical-rules, enum-values, block-scalar-comments, duplicate-keys, coarse-phenotypes, qualifier-terms, gene-validity, gene-activity-grounding) - all pass; 14/14 phenotypes causally connected. Closes claim issue #16348.

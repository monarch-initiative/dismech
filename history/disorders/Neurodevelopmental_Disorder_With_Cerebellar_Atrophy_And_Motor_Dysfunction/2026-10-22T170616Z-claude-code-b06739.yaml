  details: |
    New entry for NEDCAM (MONDO:0859152, OMIM:619333), autosomal recessive, biallelic GEMIN5 (hgnc:20043; label confirmed against HGNC REST).

    Deep research: one OpenScientist run, committed at research/Neurodevelopmental_Disorder_With_Cerebellar_Atrophy_And_Motor_Dysfunction-deep-research-openscientist.md. Its reference validation resolved 13/13 citations (12 on topic, none off topic or unresolved); term validation resolved 24/26 with no unresolved CURIEs. just preflight-dr could not run because the local MONDO build is absent and was deliberately not downloaded. Identity was checked by hand instead: OLS shows MONDO:0859152 has material basis in germline mutation in HGNC:20043 and an OMIM:619333 xref, and the report names GEMIN5 44 times and OMIM 619333 five times, with no rival gene. The research template recorded "Causal gene(s): not recorded; OMIM: not recorded", so the provider was not given the identity anchors. The report was used as a lead only. Its HPO-annotation frequency table (for example hypotonia 26/29) was not used because it cannot be quoted from a cited source; frequencies come from the cohort texts (PMID:33963192, PMID:35295849, PMID:38773790). Report citations PMID:31799608 (dimerization domain structure) and PMID:40176294 (review) were not needed for any claim.

    Every claim is backed by a fetched PMID or the ClinGen CGGV record with an exact snippet. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER).

    The CoQ10 paper (PMID:38316953) was read critically: two patients who share p.Arg1016Cys, fibroblast and fly data, and an uncontrolled treatment with unchanged MRI. It is curated as a PROVISIONAL node, an EMERGING hypothesis, an investigational treatment and a CONTROVERSY discussion, not as an established mechanism. SMN upregulation with nusinersen is curated as preclinical only (PMID:37369805). The entry is kept distinct from spinal muscular atrophy. Early death in the severe infantile form is recorded on the infantile subtype because HP:0003819 Death in childhood is outside the PhenotypeTerm enum.

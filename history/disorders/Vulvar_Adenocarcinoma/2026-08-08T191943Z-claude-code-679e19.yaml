  details: |
    Reviewed the entry against the Falcon deep-research report, current MONDO
    scope, all cited cache text, two 2025 full-text subtype reviews, and current
    ClinicalTrials.gov records. Corrected parent synonyms and subtype grounding;
    separated subtype-specific findings from broader vulvar-cancer or cross-site
    EMPD evidence; repaired the causal graph; and added structured relative
    frequency, histopathology, biomarkers, FIGO-stage evidence, progression,
    differential diagnosis, trial, and knowledge-gap content.


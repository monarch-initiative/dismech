  summary: Review vulvar adenocarcinoma scope, staging, and EMPD evidence
  details: |
    Reviewed the entry against the Falcon deep-research report, cited reference
    caches, primary FIGO staging source, MONDO hierarchy, and current
    ClinicalTrials.gov records. Retained the broad MONDO:0024336 anchor and
    represented every official descendant, explicitly marking the sebaceous,
    eccrine and porocarcinoma, apocrine, Skene-gland, clear-cell
    hidradenocarcinoma, and Bartholin adenoid-cystic branches as under-curated
    rather than silently treating the four evidence-rich branches as complete
    scope.

    Replaced the invalid population-prevalence structure with an epidemiologic
    relative histology-share statement. Replaced cohort percentages presented
    as stages with the FIGO 2021 anatomic stage and substage definitions, and
    moved the intestinal-type case distribution into progression. Added the
    vulvar-specific pruritus HPO term, an erythematous eczematoid plaque
    phenotype and causal edge, and cohort-specific vulvar EMPD recurrence and
    five-year overall-survival outcomes.

    Preserved cross-site HER2 evidence as partial while naming trastuzumab and
    its monoclonal-antibody modality. Added small-molecule metadata for topical
    imiquimod, connected photodynamic therapy to vulvar Paget disease, and
    separated chemotherapy from the explicit radiotherapy component of
    concurrent chemoradiation.

    Validation passed schema and ontology-term checks, verified 103 of 103
    evidence snippets against cached references, found no causal-graph or
    discussion-anchor integrity errors, and measured 6 of 6 phenotypes connected
    in the rendered pathograph. Reflowed the FIGO explanation so the compound
    "extracapsular-spread" remains intact under YAML folding. The D2P comparison
    returned five local HPO terms and no OMIM or Orphanet phenotype records for
    the MONDO anchor.

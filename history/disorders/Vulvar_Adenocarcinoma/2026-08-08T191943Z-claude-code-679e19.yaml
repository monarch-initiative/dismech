    biomarker, and treatment assertions are explicitly partial for vulvar EMPD.
    Also moved nodal staging from treatments to diagnosis and retained general
    vulvar-cancer risk, symptom, imaging, and chemoradiation evidence only with
    explicit partial-support boundaries.

    Validation covered schema, ontology terms, exact cached snippets, graph
    integrity, pathograph connectivity, D2P comparison, and history. The target
    reached complete phenotype connectivity; catalog-wide graph failures that

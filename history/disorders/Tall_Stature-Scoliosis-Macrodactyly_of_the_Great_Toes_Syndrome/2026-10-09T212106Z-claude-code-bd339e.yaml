  summary: 'Create: Tall_Stature-Scoliosis-Macrodactyly_of_the_Great_Toes_Syndrome'
  details: |
    Created from the required Perplexity deep-research report (preflight-dr PASS: NPR2 mentioned 41 times, OMIM 615923 matches MONDO). The report's 12 references all resolved; claims were taken only where a cached PubMed record could be quoted. Lump decision: MONDO:0014401 carries the OMIM 615923 xref (OMIM title epiphyseal chondrodysplasia, Miura type) and lists the Miura name as a related synonym, so both names are one NPR2 gain-of-function entity; Orphanet ORPHA:329191 also links recessive NPR3-related Boudin-Mortier syndrome (MONDO:0859194), kept separate as a differential. Added PubMed sources found from the report's leads: Hannema 2013 (PMID:24057292, p.Arg655Cys, extreme tall stature without skeletal deformity, recorded as a boundary allele), Robinson 2013 (PMID:23827346) and Dickey 2017 (PMID:28450398) receptor biochemistry. Not used: the 2023 nosology (PMID:36779427) because its cached full text does not contain the classification table; ClinVar classifications and Orphanet prevalence because no quotable cache exists (ORPHA bulk XML absent locally); Moffatt 2025 used only for the NPR3 differential. The causal chain runs variant -> constitutive/CNP-hypersensitive guanylyl cyclase (GAIN_OF_FUNCTION modifier, since mutants escape ligand, ATP and desensitization control) -> chondrocyte cGMP -> CREB-driven hypertrophic chondrocyte proliferation (mouse, PROVISIONAL) -> growth plate widening -> endochondral overgrowth -> phenotypes; edges from overgrowth to scoliosis, coxa valga, genu valgum, SCFE, pseudoepiphyses and broad hallux are INDIRECT_UNKNOWN_INTERMEDIATES and uncited because no source establishes the transition. No disease-specific GeneReviews chapter (check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (73/73) and validate-disorders.

  summary: Add GeneReviews baseline (PMID:22497028)
  details: |
    Added the Bietti Crystalline Dystrophy GeneReviews chapter as a top-level tagged reference. Two substantive gains. The progressive-visual-loss frequency band was a Pattern D clinical estimate flagged in the previous coherency review; GeneReviews' 'legal blindness in most if not all affected individuals' upgrades it to a Pattern C mapping. And the chapter supplies a component the entry omitted: the crystalline deposits variably involve the corneal limbus, not only the retina, which is why the disease is also called Bietti crystalline corneoretinal dystrophy. The description was amended accordingly.

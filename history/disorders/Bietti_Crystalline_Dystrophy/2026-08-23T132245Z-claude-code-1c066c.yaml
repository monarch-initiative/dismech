  summary: 'Create: Bietti Crystalline Dystrophy'
  details: |
    New entry for CYP4V2-related Bietti crystalline dystrophy. Six pathophysiology nodes: CYP4V2 loss of function to polyunsaturated fatty acid overload in the RPE, then two parallel demonstrated effector arms - IRE1-alpha-driven ER stress with mitochondrial failure, and NCOA4-associated iron accumulation with lipid peroxidation and ferroptosis - converging on RPE and chorioretinal atrophy and post-fourth-decade visual loss. Both arms are supported by rescue experiments, and the entry does not adjudicate between them; a KNOWLEDGE_GAP records that the published single-agent rescues cannot distinguish two parallel routes from one route measured twice, and proposes the epistasis experiment that would. The entry is explicit that the eponymous crystals are the least mechanistically informative feature and fade as atrophy advances. Both treatments are preclinical and marked PARTIAL accordingly. Validated: linkml-validate clean, term validation passed, 22 of 22 snippets verified.

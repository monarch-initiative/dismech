  details: |
    Evidence-integrity review of ~30 evidence items against 18 cached references (17 PMIDs plus NCIT:C1796), re-reading each cited publication. Three defects found and fixed: (1) the TNFR2 non-canonical NF-kB pathophysiology item (PMID:26258847) graded a T-cell expression experiment HUMAN_CLINICAL - reclassified IN_VITRO with a rewritten explanation, while the sibling patient-frequency sentence from the same paper correctly remains HUMAN_CLINICAL; (2) the total skin electron beam treatment item (PMID:16207183) quoted an introduction framing sentence ("treatment of choice") as if it were a finding of the 7-patient series - replaced with the paper's conclusion sentence; (3) the narrowband UVB explanation over-generalized a 20-patient stage IA-IB study - scoped to the studied cohort. Checked and accepted: MF-vs-Sezary named-entity discipline (genomics and CTCL-trial evidence is honestly scoped as MF-spectrum CTCL rather than over-claimed as MF-only); spatial-transcriptomics quotes exact and on-target; review sources tagged OTHER per open repo convention. Validation: just validate and count-verified-snippets --strict pass (all non-DOI snippets verified; DOI snippets manually confirmed exact).

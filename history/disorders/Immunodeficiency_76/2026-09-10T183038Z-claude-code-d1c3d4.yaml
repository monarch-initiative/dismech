  summary: 'Create: Immunodeficiency 76 (FCHO1, MONDO:0030898)'
  details: |
    De novo curation of immunodeficiency 76 (biallelic FCHO1 deficiency). Deep research: one Perplexity sonar-deep-research report, committed at research/Immunodeficiency_76-deep-research-perplexity.md. The report carries no reference_validation or term_validation block and cites URLs rather than identifiers (zero PMID: strings in the body), so it was used for orientation only; every reference in this entry was located independently through PubMed E-utilities and cached with just fetch-reference. Evidence rests on the two founding cohorts, PMID:30822429 (five patients) and PMID:32098969 (ten patients); both are open access, so several snippets are quoted from full text and from cohort-table rows rather than from the abstract. Frequency bands are derived from patient counts in those two tables because no review reports pooled frequencies for this disease. Ontology bindings were read from cache/ or resolved live against OLS and the HGNC REST API in the same step they were written; FCHO2 resolved to hgnc:25180. No GeneReviews chapter exists for this disease (PubMed search returned nothing). Validation: just validate passed, 42/42 snippets verified against the local cache, just validate-terms passed, and check-entity-refs, check-causal-targets and check-duplicate-keys all passed.

  summary: 'Review round 1: curate cohort disagreements, developmental arm, humoral
    arm (PR #11635)'
  details: |
    Addressed all four IMPORTANT findings from the ai4c-reviewer review on PR #11635, plus four of five suggestions, in a single push. (1) Added the impaired calcium mobilisation evidence to the TCR node, with GO:0019722 calcium-mediated signaling. (2) Added an Impaired Thymic T-Cell Development node carrying the chlorpromazine DN3-to-DP experiment, and rewrote the T-Cell Lymphopenia description so it records that the two founding cohorts disagree about peripheral loss versus developmental block rather than asserting the peripheral account; the developmental node is graded HYPOTHETICAL because its evidence is pharmacological CME inhibition in vitro rather than an FCHO1-deficient thymus, and carries the Calzoni thymic-output exclusion as a supports REFUTE item. (3) Curated the transferrin contradiction: Calzoni reports transferrin internalisation minimally detectable, Lyszkiewicz reports TfR endocytosis apparently unaffected, same cargo and same cell type, so the Lyszkiewicz conclusion is added as a supports REFUTE item on the Defective Clathrin-Mediated Endocytosis node and the node description records the disagreement instead of absorbing it. (4) Connected the humoral arm to the pathograph via a new Impaired Humoral Immunity node reached by bare-name downstream targets, graded HYPOTHETICAL because no source tests whether the B-cell deficit is T-cell-dependent or B-cell-intrinsic and FCHO1 is expressed in B cells. Suggestions taken: bound the IVIG treatment to NCIT:C121331 Intravenous Immunoglobulin Therapy with therapeutic_agent NCIT:C80829 Human Immunoglobulin G and modality PROTEIN_REPLACEMENT (NCIT:C572 Immunoglobulin was rejected by the ChemicalEntityTerm dynamic enum, as NCIT:C2322 Corticosteroid had been earlier); added the selective cytokine defect with its TNF-alpha internal control; added CL:0000625 CD8-positive alpha-beta T cell to the TCR node with the evidence that both compartments fail to proliferate; added Hepatosplenomegaly. Suggestion not taken: the deep-research AML lead, which the reviewer itself flagged as unverifiable because that report cites bare URLs with no PMID strings. All quotes were verified verbatim against references_cache/PMID_32098969.md before use; no new reference fetch was required. Validation: just validate passed, 54/54 snippets verified (was 42/42), just validate-terms passed, entity-refs / causal-targets / duplicate-keys / qualifier-terms all passed.

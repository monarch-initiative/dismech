  summary: 'Review and enrich Hartsfield Syndrome: ground FGFR1 molecular functions,
    expand phenotypes, prevalence, diagnosis, and treatments'
  details: |
    Repaired baseline gene-activity grounding defect on 'FGFR1 pathogenic variants' by adding molecular_functions (GO:0005007 fibroblast growth factor receptor activity, GO:0004714 transmembrane receptor protein tyrosine kinase activity) and biological_scale/node_class annotations across all 4 pathophysiology nodes while preserving protected node 'Impaired Limb Bud Patterning' (conforms_to limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification). Added autosomal recessive inheritance, Orphanet point-prevalence and literature case-count prevalence records (ORPHA:2117, PMID:26937548), Harrison's chapter classification, ClinGen CGGV gene_disease_validity assertion, 8 additional GeneReviews/cohort phenotypes (split Cleft lip and Cleft palate, Arrhinencephaly, Cerebellar vermis hypoplasia, Spasticity, Feeding difficulties, Central diabetes insipidus, Micropenis, Cryptorchidism) with 15/15 causal phenotype connectivity, 3 NCIT-bound diagnostic modalities, Desmopressin therapy (CHEBI:4450) plus evidenced target_mechanisms on all treatments, and primary FGFR1 cohort evidence (PMID:23812909, PMID:26931467, PMID:30787447).

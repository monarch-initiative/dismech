  summary: Reconcile ORPHA:2117 and GeneReviews phenotypes, audit cohort frequencies,
    and retarget symptomatic treatment target_mechanisms
  details: |
    Addressed PR #17262 review feedback: reconciled ORPHA:2117 and GeneReviews (PMID:26937548) phenotypes against molecularly confirmed FGFR1 cohorts (PMID:23812909, PMID:26931467, PMID:30787447) by adding 8 corroborated phenotypes (Polydactyly HP:0010442, Syndactyly HP:0001159, Absent septum pellucidum HP:0001331, Abnormality of temperature regulation HP:0004370, Sleep-wake cycle disturbance HP:0006979, Postnatal growth retardation HP:0008897, Hypotelorism HP:0000601, and Hypertelorism HP:0000316) with 23/23 causal phenotype connectivity from Impaired Forebrain Midline Patterning and Impaired Limb Bud Patterning, and documented in top-level notes why uncorroborated pre-molecular ORPHA:2117 80-99% HPO frequencies were not imported. Audited phenotype frequency bands by adding primary Simonis et al. (PMID:23812909) Table 1 counts and removing unsourced frequency enums on Arrhinencephaly and Cerebellar vermis hypoplasia; updated Spasticity and Feeding difficulties to cite the GeneReviews clinical-characteristics quote. Retargeted symptomatic and reconstructive treatment target_mechanisms from embryonic Impaired Forebrain Midline Patterning to Central diabetes insipidus, Seizures, Cleft lip, Cleft palate, Global developmental delay, and Spasticity, and added Hand and foot rehabilitation and reconstructive surgery (NCIT:C15315) targeting Ectrodactyly.

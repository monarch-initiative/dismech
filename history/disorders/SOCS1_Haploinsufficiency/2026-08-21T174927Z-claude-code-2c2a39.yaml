  summary: 'Review response: split STAT phenotype, and correct an overstated immunodeficiency
    arm'
  details: |
    Addressed the reviewable items from the ai4c-reviewer review of PR 9187, verifying each claim against the cached reference before acting. The most substantive correction is one the review is right about and that changes the entry's framing: SOCS1 loss does NOT uniformly raise cytokine signalling. PMID:34421895 states verbatim that STAT1 phosphorylation is enhanced comparably with STAT1 gain-of-function mutations while STAT3 phosphorylation is reduced with concurrent reduction of Th17 cells, and that reduced SOCS1 shows clinical overlaps with both STAT3LOF and STAT1GOF. Both sentences are now curated, the STAT1/STAT3 one deliberately as PARTIAL because it qualifies the hypersensitivity node as much as it supports it. Second correction: my immunodeficiency arm was overstated. In the founding cohort of ten patients none had infectious complications except one with recurrent bronchopulmonary infection, and IgG levels were normal; what that cohort shows instead is a maturation defect, low marginal zone and/or switched memory B cells in seven of ten. The node description now says the entry initially overstated this, the Recurrent Infections phenotype is recurated as a genuine but minority feature, and a new phenotype records the B-cell maturation defect - noting it was also present in three of four asymptomatic carriers, so it is not sufficient for disease. The reduced-STAT3/Th17 axis is noted as a candidate route to the infection susceptibility that is real, by analogy with STAT3 loss-of-function disease, but the incoming edge stays INDIRECT_UNKNOWN_INTERMEDIATES because that is inferred from a shared signalling lesion rather than demonstrated in these patients. IMPORTANT: the review's flagship Treg quote, 'Thus, SOCS1 deficiency leads to a defective Treg compartment', does NOT appear in either cached reference - exact-string search returns zero matches in both PMID_33087723.md and PMID_34421895.md. The Treg substance may well be correct, since the fragmentary PDF text does show lower CD25 on patient Tregs, but the quote as given is not verifiable and curating it would have fabricated a snippet. No Treg node was added on that basis; this is reported on the PR. Three of my own errors were caught by the gates during this pass and fixed: a snippet of four words under the five-word minimum, lengthened to a verbatim six-word span with the line-break truncation explained in the explanation; a guessed HP:0012176 which is actually Abnormal natural killer cell morphology; and an HP:0030384 label taken from OAK search output that the validator rejected in favour of 'Decreased marginal zone B cell proportion'. Snippets rose from 19/19 to 25/25. Validated: just validate passed; just validate-terms passed; count-verified-snippets 25/25; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

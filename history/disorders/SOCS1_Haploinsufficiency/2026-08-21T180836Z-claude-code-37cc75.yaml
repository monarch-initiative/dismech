  summary: 'Review round 2: repairing defects the previous fix commit introduced'
  details: |
    Second review round on PR #9187. All six blocking items verified independently before acting.

    Every one of these was introduced by the preceding fix commit rather than by the original entry - the pattern the CRMO review named on #9188: a commit that resolves real findings while quietly making new claims untrue.

    1+2+5. Pathograph connectivity. 'Reduced STAT3 Phosphorylation with Th17 Reduction' had no incoming edge and no downstream key, and 'Loss of SOCS-Box E3 Ligase Function' had no incoming edge, so the graph was three components rather than one. Split the bundled node into 'Reduced STAT3 Phosphorylation' (MOLECULAR) -> 'Th17 Compartment Reduction' (CELLULAR), which fixes the scale bundling and the orphaning together. Wired the STAT3 arm from 'Loss of JAK-STAT Negative Feedback' as a sibling of the hypersensitivity arm - the same loss of feedback raises STAT1 and lowers STAT3, so neither is downstream of the other - and the SOCS-box arm from 'Heterozygous SOCS1 Loss of Function', since one halved gene relieves both of SOCS1's activities. Verified afterwards by walking the graph: 11 nodes, 14 edges, one component, one root, no dangling targets.

    3. GO term inverted the claim. GO:0042509 is 'regulation of tyrosine phosphorylation of STAT protein'; with DECREASED that asserts less regulation, which implies more phosphorylation - the opposite of the finding. Replaced with GO:0007260 'tyrosine phosphorylation of STAT protein', verified via OAK. This is the kind of error no gate catches: the CURIE existed, the label matched, and the term validated.

    4. notes stated 'No frequency bands are assigned to any phenotype' while four carried OCCASIONAL. Rewrote to state the actual policy - bands only where a source gives an explicit denominator - and to account for the unbanded ones including the new hypogammaglobulinaemia entry.

    6. Hypogammaglobulinaemia was asserted in the Humoral Immunodeficiency node's prose but unsupported by its snippet and had no phenotype entry. Added with HP:0004313 and the CVID-like quote from the cached text, deliberately without a frequency band: the source describes it in one patient as one of several alternative presentations, which is an observation and not a rate.

    Validation: just validate passed with 38/38 snippets verified (up from 36), just validate-terms passed, check-duplicate-keys OK, and the folded-hyphen and snippet-length ratchets report no new findings.

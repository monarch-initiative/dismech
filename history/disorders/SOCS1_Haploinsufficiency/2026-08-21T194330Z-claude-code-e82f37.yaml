  summary: 'Post-approval: two suggestions taken, one declined with reason'
  details: |
    PR #9187 was APPROVED on e14d97716 with no CRITICAL or IMPORTANT items remaining. These are the two SUGGESTIONs the reviewer named as most worth picking up, applied knowing the push resets the approval - per the repo's guidance that an approval to be lost is not a reason to hold a fix.

    Taken: extended the B-cell snippet from 'counts were both low in seven patients' to 'The marginal zone and/or switched memory B cell counts were both low in seven patients'. The fragment began mid-sentence and did not say WHICH counts were low, so it was weaker evidence than the source supports.

    Taken: banded Autoimmune Cytopenia FREQUENT against its explicit denominator - five of ten founding patients - with its own evidence item quoting the count. A frequency is a separate quantitative claim from the disease-phenotype association, so it gets its own evidence rather than leaning on the association's.

    Declined, with reason: the reviewer described both truncated snippets as having 'clean forms already used elsewhere in the same file'. That is true of the B-cell one and NOT of the other. Line 283 of references_cache/PMID_33087723.md ends 'None had infectious complications, with the excep-' with 'tion' beginning line 284, so the sentence cannot be quoted whole from the cache; and trimming to 'None had infectious complications' gives four words, under the five-word minimum that check-snippet-length enforces. The existing snippet plus its explanation, which already documents the PDF line-break, is the best available form. Left unchanged and explained on the PR rather than silently skipped.

    Separately filed issue #9193 for the underlying test gap the reviewer identified: tests/test_data.py enforces the attaches_to foreign key for definitions but not for discussions, which is why the Review #4 dangling reference passed every gate. The issue records two traps for whoever implements it - attaches_to supports many section prefixes beyond pathophysiology, and some entries use singular where the section is plural - both found by writing a bad version of the check first.

    Validation: 39/39 snippets verified (up from 38), terms clean, and the duplicate-key, folded-hyphen, snippet-length, title-snippet and cache-order gates all clean.

  summary: 'Review round 4: repairing a regression my own previous fix introduced'
  details: |
    Fourth review round on PR #9187. Two blocking findings, both verified before acting, and both were regressions from MY previous commit rather than from the original entry.

    1. Dangling attaches_to. The previous commit split 'Reduced STAT3 Phosphorylation with Th17 Reduction' into two nodes and did not update the Th17 KNOWLEDGE_GAP that pointed at the deleted name, so the discussion was attached to nothing. Repointed at BOTH successor nodes - 'Reduced STAT3 Phosphorylation' and 'Th17 Compartment Reduction' - because the split separated a single disputed finding (Michniacki reports reduced STAT3 phosphorylation WITH concurrent Th17 reduction; Hadjadj looked and saw no Th17 imbalance) into two nodes, so the disagreement bears on both.

    This is exactly the pattern I described in the previous commit message as characterising the bot's commit - a fix that resolves real findings while quietly making new claims untrue - and I then did the same thing. The reviewer's note on why no gate caught it is the important part: tests/test_data.py enforces the attaches_to foreign key for definitions but NOT for discussions, so schema, term, snippet and all six offline gates pass with the reference broken.

    2. In-line frequency justification contradicted the file. The previous commit fixed the top-level notes ('No frequency bands are assigned to any phenotype' while four carried OCCASIONAL) but missed a duplicate of the same claim inside the Recurrent Infections phenotype description, which still read 'the rest of this entry carries none'. Rewritten to state the actual policy: bands only where a source gives an explicit count, which is true of four phenotypes.

    Verification note: I wrote an ad-hoc sweep for dangling attaches_to across all of kb/ and it reported thousands of hits. It was wrong - attaches_to legitimately supports many section prefixes (treatments#, genetic#, diagnosis#, biochemical#, clinical_trials# and others) and my checker only resolved pathophysiology and phenotypes. The sweep was discarded rather than acted on. A correct per-file check confirms all four attaches_to references in this entry now resolve.

    Validation: just validate passed with 38/38 snippets verified, just validate-terms passed, and check-duplicate-keys, folded-hyphen and snippet-length gates clean.

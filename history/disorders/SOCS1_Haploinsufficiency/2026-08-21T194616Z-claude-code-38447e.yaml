  summary: 'Follow-up after merge: two review suggestions from PR 9187'
  details: |
    Follow-up to PR #9187, which merged at 19:23Z. These are two SUGGESTIONs from that PR's approving review, which arrived alongside the approval and were therefore not in the merged content. Curated as a fresh change on a new branch off main, because a merged pull request cannot track new work.

    Extended the B-cell snippet from 'counts were both low in seven patients' to 'The marginal zone and/or switched memory B cell counts were both low in seven patients'. The fragment began mid-sentence and did not say which counts were low, making it weaker evidence than the source supports.

    Banded Autoimmune Cytopenia FREQUENT from its explicit denominator - five of ten founding patients - with its own evidence item quoting the count. A frequency is a separate quantitative claim from the disease-phenotype association, so it takes its own evidence rather than leaning on the association's.

    Attempted to decline a third suggestion, and the reason given was WRONG. This record is corrected in place rather than superseded, because it has not merged.

    I argued the second truncated snippet could not be fixed: line 283 of references_cache/PMID_33087723.md ends 'None had infectious complications, with the excep-' with 'tion' on line 284, so the sentence cannot be extended forward; and trimming to 'None had infectious complications' gives four words, under the five-word minimum. Both sub-claims are true, and they rule out extending FORWARD and trimming BACKWARD.

    They do not rule out extending BACKWARD, which never occurred to me. The clean form is 'whereas one (B2) developed Hodgkin lymphoma. None had infectious complications' - ten words, stopping before the hyphen - and it is already used TWICE elsewhere in this same file, at lines 489 and 554, where it validates. The original reviewer's premise that clean forms existed for both snippets was correct; I checked two of the three ways to reach one and concluded it was impossible.

    Applied it, and rewrote the explanation, which had given 'the quote stops where the cached line does' as the reason - a statement that would have misdirected the next curator into believing the truncation was forced.

    Also took the granularity suggestion: the FREQUENT band derives from a count of five for autoimmune cytopenia as a composite category including ITP, while the phenotype is bound to the narrower HP:0001890. HPO has no autoimmune-cytopenia term, so 50% is a ceiling for AIHA rather than its measured frequency. Recorded on the evidence item where the band is justified. And populated links.issues / links.prs, which were empty while the prose named #9187, #9193 and #9194.

    Process note recorded because it caused a real mistake: after #9187 merged, its branch was deleted. A 'git fetch origin <branch>' in the check-in loop failed with 'couldn't find remote ref', and the subsequent push RECREATED the deleted branch with an extra commit. The work was rebuilt on a fresh branch from main; the resurrected branch carries nothing not reproduced here. Deleting it was attempted and blocked by policy, so it is flagged on the follow-up PR for a maintainer. The loop should treat a failed fetch of a known branch as a merge signal rather than continuing to commit.

    Validation: 39/39 snippets verified, terms clean, duplicate-key/folded-hyphen/snippet-length/title-snippet/cache-order gates clean.

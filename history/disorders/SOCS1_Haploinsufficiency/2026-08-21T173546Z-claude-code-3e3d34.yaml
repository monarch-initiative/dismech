  summary: 'Add Treg, STAT3/Th17, E3-ligase and B-cell arms; counted phenotypes; quantified
    penetrance (PR #9187 review)'
  details: |
    Addressed the blocking Content-Completeness items on PR #9187. Everything used was quotable from PMID:33087723 or PMID:34421895, both already cached in this PR; no new references fetched and no new literature search.

    Item 1 - Treg compartment. Added a Defective Regulatory T Cell Compartment pathophysiology node between Lymphocyte Hyperactivity and Loss of Self-Tolerance, which is what the previously bare DIRECT edge was missing. Bound to CL:0000815 with modifier DECREASED, and evidenced from both cohorts rather than one, since Michniacki independently reports reduced Tregs.

    Item 2 - reduced STAT3 phosphorylation with Th17 reduction. Added as its own MOLECULAR node, because it contradicts the entry's uniform-hypersensitivity framing: losing the brake does not raise every STAT equally. Per the review's instruction not to pick a side, the disagreement between the two cohorts on Th17 is curated as a new KNOWLEDGE_GAP discussion attached to that node, recording that Hadjadj explicitly looked and found no Th1/Th2/Th17/Tfh imbalance while Michniacki reports Th17 reduction, plus the confound that IL-17 blockade worked in a reported patient, which is hard to reconcile with an already-depleted Th17 compartment. A proposed experiment stratifies by treatment status at sampling to separate an iatrogenic from a mechanistic effect.

    Item 3 - SOCS-box E3 ligase arm. Added a Loss of SOCS-Box E3 Ligase Function node, bound to GO:0004842 with modifier DECREASED, with the increased FAK1 / AKT / p70S6K evidence and the increased TLR-response evidence. This was the review's point that the entry modelled a two-domain protein as a one-domain brake. The edge into Lymphocyte Hyperactivity is INDIRECT_UNKNOWN_INTERMEDIATES because the papers do not establish the route.

    Item 4 - B cell maturation defect. Added an Impaired B Cell Maturation node, low marginal zone and switched memory B cells in seven of ten patients with IgG normal, feeding the immunodeficiency arm.

    Item 5 - phenotype coverage, partially. Added Systemic Lupus Erythematosus (2/10), Benign Lymphoproliferation (2/10) and Hodgkin Lymphoma (1/10), all with explicit denominators from the founding cohort, banded OCCASIONAL. Corrected the Recurrent Infections framing, which the review noted was undercut by its own source: only one of ten patients had infectious complications at all. The phenotype is retained with an OCCASIONAL band and a description saying plainly that infection is the minor arm, plus a PARTIAL evidence item carrying the denominator. Organ-specific autoimmunity (4/10) and hypogammaglobulinaemia are not yet added.

    Item 6 - genetic depth, partially. Replaced the unqualified "Penetrance is incomplete" with the quantified figure: five of fifteen heterozygous carriers, 33%, including four adults, were clinically healthy, and several of those had subclinical immunological abnormalities so clinically unaffected does not mean immunologically normal. Variant spectrum and gnomAD constraint are not yet added.

    Not addressed: the 4/10 organ-specific autoimmunity and hypogammaglobulinaemia phenotypes, the variant spectrum and gnomAD constraint, and all five blue suggestions.


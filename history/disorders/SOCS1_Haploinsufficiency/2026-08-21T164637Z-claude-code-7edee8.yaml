  summary: 'Create: SOCS1 Haploinsufficiency (autoinflammatory syndrome with immunodeficiency)'
  details: |
    New entry for autoinflammatory syndrome with immunodeficiency (MONDO:0800130, OMIM 619375), autosomal dominant heterozygous loss of function in SOCS1 (hgnc:19383) with incomplete penetrance. Deep research: claude_code provider; report resolved 16 of 17 references at confabulation_rate 0.059 with needs_review true. The single unresolved identifier is a markdown-link parsing artefact rather than a fabricated DOI, and one quote attributed to PMC:PMC11070515 was unsupported; neither is used, and the reference set was assembled by direct PubMed search with every snippet quoted from the cached record. GeneReviews baseline checked and found ABSENT: zero results for SOCS1 in GeneReviews. Six pathophysiology nodes running from heterozygous loss of function through loss of JAK-STAT negative feedback and measurable cytokine hypersensitivity to lymphocyte hyperactivity, which then branches into the autoimmune and immunodeficient arms. The immunodeficiency edge is INDIRECT_UNKNOWN_INTERMEDIATES because no source establishes how a hypersensitive immune system becomes an inadequate one. Two treatments with target_mechanisms: JAK inhibition against the cytokine-hypersensitivity node, evidenced by in vitro reversal of patient STAT activation by ruxolitinib rather than by a trial outcome, which the description states explicitly; and targeted IL4Ralpha/IL-17 blockade against the autoimmunity node. Two KNOWLEDGE_GAP discussions: how one defect yields both autoimmunity and immunodeficiency, including whether the immunodeficient arm is partly iatrogenic in patients treated for their autoimmunity first; and why a two-cytokine blockade controlled disease in a patient hyper-responsive to many axes. No frequency bands assigned: ten patients from five families in the founding cohort and case reports since, with reviews describing the phenotype as pleiotropic and variable rather than giving proportions. PMID:36890397 is topically central but caches with an empty abstract, so nothing is quoted from it and it is not listed in references; this is recorded in notes. One schema error caught during validation: GO:0001960 was initially placed under molecular_functions when it is a biological process, and was moved. Validated: just validate passed; just validate-terms passed; count-verified-snippets 19/19; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

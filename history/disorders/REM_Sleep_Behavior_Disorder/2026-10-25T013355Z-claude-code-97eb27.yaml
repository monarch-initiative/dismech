  summary: Create environmental section; smoking reversed vs Parkinson disease
  details: |
    Created the environmental section, which did not previously exist, with five entries
    drawn from the one multicentre case-control study of exposures in this disorder
    (PMID:22744670, 347 cases and 347 controls across 13 centres).

    The headline finding is a reversal: smoking is a risk factor here (OR 1.43), where the
    pooled Parkinson disease estimate is 0.59. The entry records that reversal as the most
    important exposure fact on it and deliberately does not reconcile it, listing instead the
    explanations that remain open (reverse causation in the Parkinson disease literature that
    this prodromal population may be early enough to escape; polysomnographic sleep-clinic
    ascertainment; an 81% male case series). Averaging the two directions, or treating either
    as the error, would both be wrong.

    Occupational pesticide exposure is the one exposure whose direction agrees with Parkinson
    disease (OR 2.16), which is consistent with this disorder being a prodrome of it, though
    a single self-reported case-control result is weak evidence for that and the link says so.

    Farming (OR 1.67) is curated as a proxy that is not separable from the pesticide exposure
    reported alongside it. Head injury (OR 1.59) carries the reverse-causation objection
    explicitly, since dream enactment itself causes injury and this entry holds a node for
    sleep-related injury.

    The caffeine and alcohol null is curated as content: caffeine is inversely associated with
    both Parkinson disease and dementia with Lewy bodies, so its absence of effect here is a
    point of divergence between the prodrome and both diseases it converts to, not a gap.

    All links point at Alpha-Synuclein Pathology in the Brainstem REM-Atonia Circuit, the
    initiating pathology, as PREDISPOSES with unknown intermediates. Note that three node
    names in this entry exist as both pathophysiology and phenotype, which the flat target
    namespace collapses; the brainstem node was chosen partly because it is unambiguous.

    Provider: OpenScientist (autonomous mode, 5 iterations, 52 citations, 20 minutes).
    The report is committed at research/Alpha_Synucleinopathies-environmental-exposures-deep-research-openscientist.md
    with its citations sidecar and HTML/PDF artifacts. Falcon was unavailable for this
    run (the configured Edison key returns 403), so no second provider corroborates it.

    Every quoted sentence was read from the cached abstract in references_cache/ rather
    than from the report, and several of the report's figures were corrected or qualified
    against source in the process. The report was treated as a lead throughout.

  summary: 'Create: PBRM1-Related BAFopathy'
  details: |
    New entry for MONDO:0700122, curated from PMID:34906496 (the exome reanalysis that proposed PBRM1 as a candidate BAFopathy gene) and PMID:42893407 (a microglial Pbrm1 conditional knockout mouse). This entry is deliberately shaped around a mismatch: the mechanism is better evidenced than the disease. The mouse chain is detailed and internally consistent, running from PBRM1 binding and repressing the Ccl5 promoter, through CCL5 acting on neural stem and progenitor cells via CCR1 and CCR5 to beta-catenin, to excessive neurogenesis and autism-like behaviour, with a pharmacological CCR1/5 blockade rescue arm. The human side is one patient with a predicted splice-altering variant that was never tested by RNA study, in a paper that calls PBRM1 a candidate and itself records that a 31,058 parent-offspring trio study did not find PBRM1 significantly associated with developmental disorders. The genetic row is therefore graded DISPUTED rather than CAUSATIVE, carrying both the supporting and the opposing evidence items, with the variant marked UNCERTAIN_SIGNIFICANCE; a DISPUTED row emits no gene-to-disease edge in the KGX export, which is the intended outcome. Every modeled_mechanisms link carries fidelity UNKNOWN rather than a tier that would imply a known relationship to human disease, plus typed divergences for the microglia-only boundary and for the homozygous conditional null standing in for a heterozygous predicted splice change. A HUMAN_MODEL_MISMATCH discussion attached to the mouse-derived nodes and to the gene states the open question. The single phenotype is bound from the model and the ASD risk-factor literature with directness INDIRECT, because the exome paper gives no phenotype for its PBRM1 patient. Nothing from the large PBRM1 clear cell renal carcinoma literature is used, since somatic tumour-suppressor biology is a different claim and would lend this pair borrowed support. The mouse gene identifier was read from the Ensembl cross-reference for ENSMUSG00000042323 and then confirmed by just check-gene-namespaces-online against the Alliance API. Validation: just validate-disorders passed with 12 of 12 snippets and 12 titles verified; check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-genereviews and check-gene-namespaces-online all pass. The OpenScientist report for this disease is in the third batch after the timeout failures described in dismech#10387, and will be reconciled against the entry before the pull request is opened.

  details: |
    Addresses the three IMPORTANT items of the second review round on dismech#18384, plus both suggestions, in one push.

    Session narrative removed from entry content. The notes paragraph beginning 'The human evidence summary was rebalanced after review. The first version said...' is deleted. It described how this entry was edited rather than anything about the disease, which is what CLAUDE.md rules out for notes (dismech#8908, dismech#12535); that account already lives in the round-2 history record, which is where it belongs. The clause 'and was missing from the first version of this record' is cut from the de novo evidence item's explanation for the same reason.

    HUMAN_MODEL_MISMATCH rationale rebalanced. It still gave the pre-round-1 one-sided summary, describing the human side as one patient with an untested splice variant and leaving out the de novo origin and the DDD and denovo-db variants. It now states the evidence in both directions, matching the entry description and the gene notes: for, the de novo origin, the selection on predicted loss-of-function intolerance, and the further de novo variants; against, the absent RNA study, the null 31,058-trio association, the lack of enrichment over gnomAD, and the reporting study's own candidate-not-confirmed framing.

    pLI selection now cited. The claim that PBRM1 was selected on its intolerance to loss of function appeared in both the description and the gene notes with no source anywhere in the entry. A SUPPORT item on the gene row now quotes the sentence from PMID:34906496, with the bracketed pLI threshold bridged using the validator's two-dot syntax since the claim does not depend on the threshold value.

    RNA-gap item moved rather than regraded. The item quoting 'the lack of RNA studies ... obscured a clear understanding of the biological significance of this variation' sat on the gene row as SUPPORT while its sentence describes a gap in the gene-disease claim rather than support for it. Rather than keep it there with directness INDIRECT, it is moved to the HUMAN_MODEL_MISMATCH discussion, which is the claim it genuinely supports: that discussion already names an RNA study of the reported variant as one of the two things that would resolve the question. On the discussion the grade SUPPORT reads correctly and directly.

    Excluded renal cell carcinoma family recorded. The deep-research report describes a family with germline PBRM1 loss of function and renal cell carcinoma predisposition. It is deliberately not used in this entry, because it is a different disease from the proposed neurodevelopmental one and folding it in would merge two gene-disease claims with different evidence into one record. A sentence in notes now says so, so the next curator does not re-add it.

    Not changed. relationship_type stays DISPUTED, and the round-1 history record is left as written, both as the review asked. The CAUSATIVE-versus-tier question does not arise here since there is no ClinGen record for this pair.

    Validation: just validate passes.

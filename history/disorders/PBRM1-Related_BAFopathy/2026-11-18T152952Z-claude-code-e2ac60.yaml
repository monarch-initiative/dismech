  summary: 'Review round 1 and deep research: PBRM1-Related BAFopathy'
  details: |
    Addresses the first review round on PR 18384 and adds the deep-research artifact. The substantive change is that the human evidence was presented one-sidedly. The entry argued the pair is DISPUTED but gave only the thin supporting evidence and all the opposing evidence, so a reader saw a weaker case than the literature makes. Two supporting strands were missing from PMID:34906496 and are now recorded: the reported variant arose de novo and heterozygous in Patient N5, and further de novo PBRM1 variants appear in Deciphering Developmental Disorders and denovo-db. A second opposing strand is also now recorded, that predicted loss-of-function variants were no more abundant in the patient cohort than in gnomAD, together with the authors' own caveat that the lack of significance may reflect the methods and sample cohort used. That caveat is why the row stays DISPUTED rather than becoming REFUTED, and the grade now rests on stated evidence rather than on curator judgement alone. The entry description and the gene notes were rewritten to set out both directions explicitly, and the notes record that the earlier summary left the supporting side short. The review's enrichment finding was nearly rejected: the sentence sits beside a SMARCC1 discussion, and only reading the whole paragraph showed it covers all four candidate genes including PBRM1, so the reviewer was right. The Autism phenotype's evidence item was graded MODEL_ORGANISM in error for a sentence that is the mouse paper's background statement about human ASD genetics; it is now HUMAN_CLINICAL with quote_role BACKGROUND, which is the dismech#10262 pattern, and a separate MODEL_ORGANISM item quoting the paper's own autism-like-behaviour result sits beside it. Two schema limits were hit: Variant has no genetic_context slot, so the de novo status moved to the pathophysiology node, which had no genetic_context at all and now carries DE_NOVO and HETEROZYGOUS with a note that the mouse model is a homozygous conditional knockout instead. The reviewer's suggestion to check the parents value against the ACTL6A sibling entry was checked and needs no change: that entry uses the same parents BAFopathy. Worth flagging for whoever settles the relationship_type question across these entries, the ACTL6A sibling leaves relationship_type unset entirely despite carrying a ClinGen Moderate tier, which is a third convention alongside CAUSATIVE on the TRAC entry and DISPUTED here. Deep research: openscientist failed on every attempt, so claude_code was substituted by hand and recorded, as described on dismech#18386. The committed report verifies 143 of 143 references at a confabulation rate of 0.0, and just preflight-dr against MONDO:0700122 returns PASS with PBRM1 mentioned 413 times. Only 49 of the 143 references scored on topic, which is expected because PBRM1's literature is dominated by clear cell renal cell carcinoma; none of that is used in the entry. Validation: validate-disorders passes, and the entity-ref, causal-target, coarse-phenotype, enum-value, logical-rule and gene-grounding gates all pass.

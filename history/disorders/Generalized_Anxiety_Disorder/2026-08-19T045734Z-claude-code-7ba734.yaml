  summary: Add structured zebrafish animal_models with modeled_mechanisms (#4873)
  details: |
    Curation-scanner high_effort run for issue #4873 (NAMs from the NAMeRS symposium), plan item 1: the zebrafish anxiolytic New Approach Methodology.

    The entry already cited PMID:19643124 as MODEL_ORGANISM evidence on the "GABA System Dysfunction" and "Serotonin Dysregulation" nodes, but the model itself existed only as prose inside evidence explanations, so it was invisible to the pathograph. Added an animal_models: section with three zebrafish assays, each carrying modeled_mechanisms links with per-link fidelity and limitations, plus readouts with their own evidence:

    1. Adult novel-tank diving assay (PMID:19643124) - PERTURBS "Serotonin Dysregulation" (buspirone) and PERTURBS "GABA System Dysfunction" (diazepam positive; chlordiazepoxide curated as an UNCHANGED readout, a real negative result at behaviourally active doses).
    2. Larval dark-flash thigmotaxis assay (PMID:22197677) - PERTURBS "GABA System Dysfunction", with bidirectional diazepam/caffeine validation.
    3. Larval edge-preference assay (PMID:22155488) - PERTURBS "GABA System Dysfunction", and FAILS_TO_RECAPITULATE "Serotonin Dysregulation" because acute fluoxetine left edge preference unchanged while diazepam in the same assay did not.

    Also added one HUMAN_MODEL_MISMATCH discussion (gad_zebrafish_anxiolytic_class_mismatch) recording the conflict between the zebrafish anxiolytic drug-class profile and the human GAD treatment hierarchy, attached to both nodes, with a proposed acute-versus-sub-chronic SSRI exposure experiment. The limitations text is explicit that the fluoxetine and chlordiazepoxide nulls are assay-scope findings and are not evidence against serotonergic or GABAergic mechanisms in human GAD.

    Purely additive: no existing node, edge, or evidence item was modified. Two new references (PMID:22197677, PMID:22155488) were fetched with `just fetch-reference`; nothing in references_cache was hand-written.

    Validation run: `just validate` (schema + terms + references) passes, reporting 30/30 snippets verified against cached references; `just check-duplicate-keys` OK; `just check-title-snippets` reports no new title-quoting snippets; `just validate-history` passes. tests/test_data.py has one pre-existing, unrelated failure in Travelers_Diarrhea.yaml (non-PMID URL references) that reproduces unchanged on origin/main.

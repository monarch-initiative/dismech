  summary: 'Phenotypes: DSM-5 evidence for all symptoms; concentration rebound; muscle
    tension unbound'
  details: |
    Each of the seven DSM-5 symptom phenotypes now cites the StatPearls Generalized Anxiety Disorder chapter (PMID:28722900, newly cached and tagged StatPearls in references), which lists the criteria; six of the seven previously had no evidence and the seventh had only a NO_EVIDENCE GWAS quote. The explanations state that the source does not support the frequency bands. Difficulty Concentrating now binds HP:0031987 Diminished ability to concentrate instead of HP:0000736 Short attention span, which HPO defines by distractibility and impulsivity. Muscle Tension no longer binds HP:0003552 Muscle stiffness, whose HPO definition (muscles that cannot be moved quickly without pain or spasm) does not describe GAD muscle tension; HPO has no muscle-tension term (runoak -i ols:hp search 'muscle tension' returns none), so the phenotype is unbound with a note. Validated with just validate-disorders.

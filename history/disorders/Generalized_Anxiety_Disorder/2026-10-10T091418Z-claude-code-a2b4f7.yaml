  summary: Bind validated instruments and their severity bands as LOINC measurements
  details: |
    Added a diagnosis section with a GAD-7 row. Panel LOINC:69737-5 bound as the measurement; total score LOINC:70274-6 carries bands 0-4, 5-9 mild, 10-14 moderate and 15 or more severe, quoted from the Kroenke 2010 systematic review by the instrument developers (PMID:20633738), which also gives 10 or more as the optimal cutpoint. The Spitzer 2006 development paper (PMID:16717171) is row evidence; its abstract does not state the cut point value. Diagnosis term NCIT:C15419 Disease Screening. Pfizer LOINC copyright notice verbatim in the row notes. No instrument items are quoted.

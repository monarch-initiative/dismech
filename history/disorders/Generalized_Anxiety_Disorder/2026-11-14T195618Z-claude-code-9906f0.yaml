  summary: 'Mappings: ICD-10-CM F41.1; definitions: DSM-5 rule'
  details: |
    Added ICD10CM:F41.1 (Generalized anxiety disorder) as skos:exactMatch, copied from MONDO's exact cross-reference (MONDO mapping set mondo.sssom.tsv retrieved 2026-11-14 (md5 1a9da85954d80718f635a32792802f05)). Added a DIAGNOSTIC_CRITERIA definition from the StatPearls GAD chapter (PMID:28722900): excessive, hard-to-control worry for at least six months (both items required) and at least 3 of 6 associated symptoms, with a distress requirement and a substance/medical exclusion. Criteria items that correspond to a phenotype in the entry carry the same HPO term. Labels on criteria items are not checked by just validate-terms (CriteriaItem.term has no enum binding), so each was matched against cache/hp/terms.csv or the HPO 2026-09-01 release before commit. Validated with just validate-disorders.

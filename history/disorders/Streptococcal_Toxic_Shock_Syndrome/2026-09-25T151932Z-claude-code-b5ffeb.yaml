  summary: 'Create: Streptococcal Toxic Shock Syndrome'
  details: |
    Created a standalone Streptococcal Toxic Shock Syndrome entry for MONDO:0020544,
    promoted from the existing Toxic_Shock_Syndrome subtype after duplicate preflight.
    The ignored-file-inclusive local search found the MONDO ID and names only in the
    Toxic Shock parent, generated pages/research/history, and the rare-disease ICD
    worklist; `git grep origin/main -- kb/disorders` found only the parent; and GitHub
    PR/issue searches found no open or closed standalone STSS work.

    DEEP RESEARCH. Ran `just research-disorder openscientist
    Streptococcal_Toxic_Shock_Syndrome --param timeout=7200`. The report is
    `research/Streptococcal_Toxic_Shock_Syndrome-deep-research-openscientist.md`, with
    the generated citation sidecar and HTML/PDF artifacts committed alongside it. The
    report resolved all 34 references. Term validation resolved 24 of 25 terms and
    correctly flagged several lead-quality CURIE errors: `NCBITaxon:1114` is not in the
    configured NCBI Taxonomy source, `HP:0007503` is generalized ichthyosis rather than
    generic desquamation, `UBERON:0002385` is muscle tissue rather than fascia, and
    `CL:0000842` is mononuclear leukocyte rather than antigen-presenting cell. Those
    report-proposed bindings were not used.

    NEC. `just preflight-dr
    research/Streptococcal_Toxic_Shock_Syndrome-deep-research-openscientist.md
    MONDO:0020544` returned SKIP because MONDO records no RO:0004003 causal gene for
    this acquired infection. Manual identity review matched the report to the intended
    MONDO entry: MONDO:0020544 is the S. pyogenes subtype of toxic shock syndrome,
    xrefs Orphanet:99918, carries the streptococcal TSS synonym, and sits under toxic
    shock syndrome and streptococcal infection.

    CONTENT. Curated S. pyogenes as the infectious agent; the necrotizing invasive GAS
    focus; streptococcal superantigen production; the MHC class II/TCR Vbeta
    cross-linking cascade through polyclonal T-cell activation, cytokine storm,
    endothelial injury, distributive shock, and multi-organ dysfunction; clindamycin
    non-susceptibility as adaptive escape; penicillin and protein-synthesis-inhibitor
    therapeutic vulnerabilities; 9 causally wired phenotypes; the Working Group case
    definition; microbiologic diagnosis; source control, penicillin, adjunctive
    clindamycin/linezolid, IVIG, and resuscitation/vasopressor therapy; and an open
    IVIG mortality-benefit controversy retaining both SUPPORT and REFUTE evidence. The
    OpenScientist report contributed a host-HLA support item on the MHC/TCR node, a
    hypertoxigenic M1UK emm1 S. pyogenes lineage modifier of SpeA output, and an
    HLA-transgenic SpeC-expressing GAS mouse model.

    SOURCES. Reused the parent Toxic Shock Syndrome evidence where exact cached
    snippets already supported the STSS-specific claim. Added the 2018 STSS IVIG
    meta-analysis, the 2023 Japanese iGAS IVIG null cohort, the 2020 adjunctive
    clindamycin cohort, the 2022 STSS prognostic-factor meta-analysis, the 2025
    Active Bacterial Core surveillance paper on rising invasive GAS incidence and
    clindamycin non-susceptibility, Kotb et al. for HLA class II presentation, Lynskey
    et al. for the SpeA-high M1UK lineage, and Pandey et al. plus Nookala et al. for
    HLA-humanized mouse models. All reference-cache files were generated by
    `just fetch-reference` or validators; none were hand-written.

    VALIDATION. `just validate kb/disorders/Streptococcal_Toxic_Shock_Syndrome.yaml`
    passed with 57 snippets checked, 0 skipped/unavailable, and 57 titles checked.
    `just count-verified-snippets` reported 57/57 snippets verified. `just
    check-causal-targets`, `just check-entity-refs`, `just check-duplicate-keys`, `just
    check-qualifier-terms`, `just list-disconnected-phenotypes`, `just
    check-cache-order`, and `just check-term-cache-integrity` all passed after the
    final edits.

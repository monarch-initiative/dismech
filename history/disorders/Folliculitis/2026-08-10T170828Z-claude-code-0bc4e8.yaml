  summary: Link the water and HIV exposures to their organism-specific nodes
  details: |
    Backfill for issue #8085. Two links, both DIRECT, and both land on nodes this entry has already separated out by organism or host state rather than on a generic inflammation node. Contaminated recreational water exposure is TRIGGERS into non-staphylococcal follicular colonisation, because this entry keeps staphylococcal and non-staphylococcal colonisation as distinct nodes and the hot-tub organism belongs to the second; the evidence is unusually clean for an exposure link, naming the organism, the facility type and a latency of eight to forty-eight hours, so the temporal sequence is measured rather than assumed. Advanced HIV immunosuppression is PREDISPOSES into the node named for it, eosinophilic follicular inflammation in advanced HIV, with nothing intervening because the node and the exposure describe the same clinical situation; predisposing rather than triggering because immunosuppression permits the eosinophilic phenotype rather than initiating an episode of it, and because the cited sentence frames the association as a CD4 threshold marker rather than as an event with an onset. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 104 of 122 with 18 pre-existing DOI-prefix skips, none on items added here.

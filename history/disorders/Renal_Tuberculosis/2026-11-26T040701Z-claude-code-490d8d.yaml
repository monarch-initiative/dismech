  details: |
    New entry for renal tuberculosis (MONDO:0005938), curated from the claim in issue 18988 and the stubs/Renal_Tuberculosis.yaml stub, which is deleted. Deep research: research/Renal_Tuberculosis-deep-research-claude_code.md (claude_code provider); used as leads only and preflight-dr returned SKIP because MONDO records no causal gene. Every snippet was re-verified against references_cache and every CURIE looked up in OLS or the term caches. The pathograph runs from primary pulmonary infection through bilateral cortical seeding and latency, unilateral reactivation, caseating papillary necrosis, cavitation and calcification (putty kidney), descending spread to ureter and bladder, fibrotic strictures and contracted bladder, to obstructive and reflux loss of renal function. M. tuberculosis, M. bovis (with cattle as reservoir) and renal disease after intravesical BCG are lumped, with the reasoning in review_notes. HIV, kidney transplantation and dialysis are recorded as predisposing exposures; their sources concern genitourinary or any-site tuberculosis, not renal disease specifically. Corticosteroids for ureteric stricture are recorded as debated, supported only by a case report and reviews. Much of the clinical evidence is for genitourinary tuberculosis as a whole; the notes field says so. Validated with just validate, validate-terms, count-verified-snippets (105/105) and the whole-repo gates.

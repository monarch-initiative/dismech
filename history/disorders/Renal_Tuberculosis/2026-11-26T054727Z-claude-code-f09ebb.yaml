  summary: 'Review round 1: Renal_Tuberculosis'
  details: |
    Answered the first automated review of PR 19003. Added a Proteinuria phenotype (HP:0000093, 68% in the Philippine genitourinary TB series, with the same not-renal-only caveat as pyuria), linked from parenchymal destruction with an association-level edge citing PMID:30071831. Added cell types (macrophage CL:0000235 on the seeding node; epithelioid macrophage CL:0002150 and multinucleated giant cell CL:0000647 on the caseating node) and GO:0002432 granuloma formation on both granuloma nodes; check-conformance-content no longer reports cell_type_absent, and the remaining process_absent is GO:0002432 standing in for the module's broader inflammatory response term. Optional items taken: Hypertension phenotype from PMID:34827337; Weight loss and Night sweats from a literature table in PMID:34503465 (graded BACKGROUND, no frequency set); nephrostomy split into its own row bound to NCIT:C94443; M. bovis pyrazinamide resistance added to the chemotherapy row from PMID:34272074. Declined: a granulomatous interstitial nephritis branch (only discussion-level mentions are cached, no primary source); Kulchavenya staging (no PMID-indexed quotable source found); the 36.94% renal-function-impairment figure as a CKD frequency (it is impairment at presentation, not chronic kidney disease after treatment).

  details: |
    New entry for ARCL1A (MONDO:0009052), biallelic FBLN5. Input: research/Cutis_Laxa_Autosomal_Recessive_Type_1A-deep-research-perplexity.md (Perplexity sonar-deep-research, reasoning_effort medium); the report cited mostly web resources (MedGen, OMIM, MedlinePlus, MIT gene page) and only one PMID (17035250), and its 12 checked NCIT/HP label pairs were all mislabelled, so every term was looked up independently via OLS/sqlite and every reference was found by PubMed search and fetched. preflight-dr: PASS (FBLN5 106 mentions; OMIM 219100). GeneReviews chapter FBLN5-Related Cutis Laxa (PMID:20301756, NBK5201) tagged and mined for clinical characteristics, diagnosis, management (treatments, surveillance, agents to avoid) and genetic counseling; the chapter covers both recessive and dominant FBLN5 disease, so only recessive or shared statements were used, each paired where possible with a recessive-family primary source (Loeys 2002 PMID:12189163, Hu 2006 PMID:17035250, Elahi 2006 PMID:16691202, Callewaert 2013 PMID:22829427, case reports PMID:24962763, 30640789, 36777703, 33509220). Mouse models: Nakamura 2002 PMID:11805835 and Yanagisawa 2002 PMID:11805834. Pathograph: 10 nodes from biallelic FBLN5 variants through misfolding/reduced secretion, ER stress and fibroblast apoptosis, loss of matrix fibulin-5, defective elastic fiber assembly, then skin/lung/arterial/visceral tissue nodes to phenotypes; 11 of 18 phenotypes causally connected, the rest are single-case or unattributed findings left unwired. No ClinGen validity record exists for this disease. Validation: just validate, validate-terms, count-verified-snippets (105/105), check-causal-targets, check-entity-refs, check-duplicate-keys, check-genereviews (TAGGED), check-block-scalar-comments and validate-disorders all pass.

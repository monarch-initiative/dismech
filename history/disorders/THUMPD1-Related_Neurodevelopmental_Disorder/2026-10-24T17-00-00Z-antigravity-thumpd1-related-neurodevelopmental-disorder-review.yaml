  summary: Review and enrich THUMPD1-Related Neurodevelopmental Disorder with Harrison's classifications,
    GO/CL/UBERON pathophysiology grounding, downstream phenotype edges, and molecular diagnosis
  details: '- Added Harrison''s chapter classifications (`NEUROLOGIC`, `GENETICS_ENVIRONMENT_DISEASE`)
    alongside existing `non_mitochondrial_trna_metabolism` ICIMD classification.

    - Grounded `THUMPD1 Loss of Function` with `THUMPD1` (`hgnc:23807`) and GO molecular functions (`GO:0003723`
    RNA binding, `GO:0030674` protein-macromolecule adaptor activity); grounded `Reduced tRNA ac4C Acetylation`
    with `GO:0006400` (`tRNA modification`); grounded `Ribosome-Mediated Translational Stress` with `GO:0006412`
    (`translation`) and `GO:0140467` (`integrated stress response signaling`) and indirect downstream
    links to `Neurodevelopmental Dysfunction` and non-CNS syndromic features (`Facial Dysmorphism`, `Ocular
    Anomalies`, `Hearing Impairment`); and grounded `Neurodevelopmental Dysfunction` with `CL:0000540`
    (`neuron`), `UBERON:0000955` (`brain`), `GO:0007399` (`nervous system development`), and downstream
    links to CNS phenotypes (`Global Developmental Delay`, `Speech Delay`, `Intellectual Disability`,
    `Behavioral Abnormalities`).

    - Added `THUMPD1 Molecular Genetic Testing` (`NCIT:C15709` Genetic Testing) diagnosis entry backed
    by PMID:35196516.

    '

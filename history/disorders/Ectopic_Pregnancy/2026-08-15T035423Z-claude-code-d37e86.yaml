  summary: Curate GEM3 as a clinical trial keyed on its WHO ICTRP (ISRCTN) record
  details: |
    GEM3 (methotrexate + gefitinib for tubal ectopic pregnancy) was previously curated only as publication evidence on the gefitinib treatment, with a note stating it could not go in clinical_trials because it is registered as ISRCTN67795930 rather than a ClinicalTrials.gov NCT identifier. That rationale no longer holds: added a clinical_trials entry keyed on ISRCTN67795930, citing ICTRP:ISRCTN67795930 (scientific title row) alongside the primary publication PMID:36738759 as REFUTE, and updated the treatment note. No target_phenotypes: HP:0031456 (Ectopic pregnancy) sits under Past medical history, not Phenotypic abnormality, so it is not a valid PhenotypeTerm - recorded in the trial's notes rather than substituting a loosely-fitting term. Validated: linkml-validate (no issues), linkml-term-validator (passed), linkml-reference-validator batch run with --no-full-text (passed, 112/112 snippets verified across this file and Progressive_Supranuclear_Palsy).

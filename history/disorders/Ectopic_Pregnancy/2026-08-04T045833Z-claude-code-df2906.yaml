  summary: 'Address PR #7918 review: diagnosis, biochemical, differentials, cache
    hygiene'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #7918. All three IMPORTANT items and all five suggestions were taken.

    IMPORTANT 1 (cache hygiene): cache/mondo/terms.csv had been hand-seeded with two EOF-appended rows sharing a synthetic timestamp, and was missing three MONDO terms entirely. Root cause was that this worktree's venv was Python 3.14, on which the validators exit 1 with no output, so the caches had been seeded by hand as a workaround. Fixed properly: rebuilt the worktree venv on Python 3.13, reverted all three cache files to origin/main state, and re-ran just validate-terms so the validator regenerated every row itself. The five MONDO rows now carry per-row microsecond timestamps and sit in sorted interior positions (lines 50 and 2887-2893 of 3180), not at EOF. Ten cache files now carry 26 pure insertions covering the newly added NCIT/CL/GO/HGNC terms as well.

    IMPORTANT 2: added a diagnosis: block with three entries - transvaginal ultrasonography (NCIT:C17644), serial serum beta-hCG measurement (NCIT:C75387), and diagnostic laparoscopy (NCIT:C16969) as confirmatory. All three cite the already-cached Chong 2024 sentence naming the two non-invasive foundations.

    IMPORTANT 3: added a biochemical: block for serum beta-hCG (NCIT:C2275, the analyte itself rather than the measurement procedure). Two evidence items: the diagnostic-foundation sentence, and the PMID:21644936 finding that hCG correlates positively with trophoblast invasion stage, which is the mechanistic reason the analyte carries prognostic weight. Numeric thresholds deliberately NOT curated - the deep-research artifact flags its own hCG band table as unverified and no cached abstract supplies a quotable interval.

    Suggestions taken: (a) added Psychological Distress phenotype, bound to HP:0100851 Abnormal emotional state rather than Anxiety or Depression because the source says 'psychological distress' without naming a syndrome; (b) rebound Salpingotomy from NCIT:C16969 Laparoscopy (an access route) to NCIT:C15329 Surgical Procedure with the specific operation in preferred_term, and gave it a target_mechanisms edge; (c) added a notes gap statement to Hypotension matching the pattern already used for Pelvic Pain; (d) added a differential_diagnoses block with heterotopic pregnancy (the classic trap - a visible intrauterine sac does not exclude ectopic pregnancy, and the trap is worst after ART) plus a grouped non-pregnant tubal/ovarian differential; (e) gave gefitinib a target_mechanisms edge documenting the refuted EGFR hypothesis.

    Scope discipline: just validate runs normalize-cache, which reformatted 7744 references_cache files and re-sorted one unrelated GO pair in molecularfunctionterm cache. All of that churn was reverted; only the 10 term-cache files with genuine additions for this entry are staged.

    Validation after changes: schema clean, term validation passed, 59/59 snippets verified (up from 53), compliance 89.2% global / 89.5% weighted on a larger denominator (173/194 absolute, up from 157/174).

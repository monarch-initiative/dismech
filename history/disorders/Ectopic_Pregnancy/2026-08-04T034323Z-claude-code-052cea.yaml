  summary: 'Create: Ectopic Pregnancy'
  details: |
    De novo curation of Ectopic Pregnancy (MONDO:0000755), category Complex.

    Deep research: claude_code provider (just research-disorder claude_code Ectopic_Pregnancy), 670s, 18 web searches, 49 turns, report at research/Ectopic_Pregnancy-deep-research-claude_code.md. The report was treated as leads only; every PMID, snippet, and ontology term was independently re-verified against fetched abstracts and OAK before use.

    Pathograph: an 11-node two-hit causal chain following the accepted aetiological model (Shaw 2010, PMID:20071358) in which impaired embryo-tubal transport and aberrant tubal receptivity are modelled as two upstream arms converging on tubal implantation. Chlamydia (TLR2/NF-kappaB/PROKR2) and smoking (cotinine/nAChR alpha-7/PROKR1) converge on the receptivity node; ciliary destruction (IL-1) and endocannabinoid CB1 tone converge on the transport node; downstream runs implantation without decidua, CSF1/CSF1R-driven trophoblast invasion, tubal rupture with haemoperitoneum, and hypovolaemic shock.

    Subtypes: five, four bound to MONDO (tubal, cornual/interstitial, ovarian, abdominal). Caesarean scar pregnancy is curated deliberately WITHOUT an ontology binding because MONDO has no term for it.

    Notable curation decisions:
    - HP:0031456 Ectopic pregnancy was NOT used as a phenotype_term: it sits under HP:0032443 Past medical history, outside the PhenotypeTerm enum root (HP:0000118). This is the gap flagged in issue #7837.
    - Prevalence carries an explicit denominator caveat: the 1-2% figure is per pregnancy, not per population.
    - GEM3 (gefitinib+methotrexate) curated as supports: REFUTE, and kept out of clinical_trials because it is an ISRCTN not an NCT.
    - CNR1 curated as relationship_type DISPUTED with supports: NO_EVIDENCE, preserving the authors' own negative result.
    - A HUMAN_MODEL_MISMATCH discussion records that tubal ectopic pregnancy is restricted to primates, so the mouse CB1 evidence covers the retention arm but cannot reach the human implantation endpoint.
    - No GeneReviews chapter exists (confirmed by PubMed search, 0 hits); no ORPHA or OMIM record was invented.
    - PMID:30416277 was fetched but discarded: the cache contained only publisher paywall boilerplate with no abstract, so it was not cited and its cache file was removed.

    Validation: linkml-validate schema clean; term validation passed (all MONDO/HP/GO/CL/UBERON/CHEBI/NCIT/HGNC terms OAK-verified); reference validation 53/53 snippets verified against cached abstracts. Compliance 90.2% global / 90.6% weighted. Two fabricated reference titles were caught by the reference validator and corrected against the caches. Validators were run from the primary checkout because the worktree venv is Python 3.14 and fails silently.

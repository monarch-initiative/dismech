  summary: Link tubal exposures to the nodes the entry already models
  details: |
    Backfill for issue #8085. Two of the three exposures are modelled by this entry as pathophysiology nodes in their own right, so those links are identities rather than causal steps: Chlamydia trachomatis infection is TRIGGERS/DIRECT into the Chlamydia tubal infection node, and cigarette smoking is TRIGGERS/DIRECT into the cigarette smoke exposure node, from which the entry routes smoke to endocannabinoid tone dysregulation rather than to infection-driven scarring, so the two exposures damage the tube by different routes. Prior tubal damage from surgery or infection is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into ciliated epithelial destruction, bundling surgical and post-infective injury which differ in their intermediates but converge on the same scarred, transport-incompetent tube. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 62 of 62 verified; integrity issue count unchanged.

  summary: 'Create: Developmental and Epileptic Encephalopathy 81 (MONDO:0032858,
    DMXL2)'
  details: |
    Claim #10616. entry_type DISEASE: MONDO:0032858 was bound nowhere in kb/, MONDO places DEE81 directly under genetic developmental and epileptic encephalopathy with no closer curated parent, and the KB already curates numbered DEEs as standalone Disease entries (DEE 50, 83, 84, 89, 116). The pathograph is specific enough to stand alone - a V-ATPase assembly failure, which no other curated entry models.

    Named Entity Confusion control. DMXL2 causes three distinct human diseases: recessive DEE81, dominant non-syndromic deafness DFNA71, and a polyendocrine-polyneuropathy syndrome. Gene-frequency preflight does not separate them, so separation was done by reading each candidate. The DEE81 clinical literature is exactly two papers - PMID:31688942 (Esposito, Brain 2019; three sibling pairs, three unrelated families) and PMID:40180340 (BMJ Case Rep 2025; one consanguineous neonate). Both were confirmed to be about the biallelic neurological phenotype. The two further references cited (PMID:40646309, PMID:34249946) are gene- and complex-function sources with no disease claim attached to them. The hair-cell and mouse-cochlea Dmxl2 literature (PMID:39147590, PMID:40118164) was found and deliberately not used: it is written against DFNA71, and DEE81 deafness is cited from Esposito instead. DMXL2 in Aromatase_Excess_Syndrome was checked and is a neighbouring-locus artefact - heterozygous 15q21.2 rearrangements deleting DMXL2 exons while creating a chimeric CYP19A1 transcript - not coverage.

    No deep-research run. The whole DEE81 clinical literature is two papers, both read in full abstract; a DR pass would have added retrieval risk across the three DMXL2 diseases without adding sources.

    Mechanism. Eleven pathophysiology nodes from biallelic DMXL2 loss of function through failed mRAVE-dependent V-ATPase assembly, branching into the endolysosomal/autophagic arm (patient fibroblasts) and the synaptic-vesicle arm, converging on hyperexcitability, seizures, developmental encephalopathy and progressive atrophy. Two nodes conform to epilepsy_excitation_inhibition_imbalance.

    Which arm actually generates the seizures is unresolved, so the two routes are curated as competing mechanistic_hypotheses groups (synaptic_vesicle_route, lysosomal_autophagy_route), both EMERGING, with the edges into hyperexcitability marked INDIRECT_UNKNOWN_INTERMEDIATES and opted into their group. A KNOWLEDGE_GAP discussion with a proposed experiment attaches to the three nodes involved. A second KNOWLEDGE_GAP records the three-disease allelic heterogeneity.

    Evidence grading. PMID:31688942 is graded three ways on purpose, per sentence: HUMAN_CLINICAL for family genotypes, clinical course and MRI; IN_VITRO for the fibroblast and cultured-neuron experiments; OTHER for the two sentences that are background (the DMXL2 function summary and the Ohtahara definition). The Dmxl2-silenced mouse hippocampal neurons are IN_VITRO, not MODEL_ORGANISM: a dissociated primary culture is not a whole animal, so they are in experimental_models as PRIMARY_CELL_CULTURE and there is no animal_models section.

    Fatal outcome (five of six died within nine years) is in progression:, not phenotypes:, because HPO files death in infancy/childhood under clinical course.

    Frequencies. OBLIGATE is asserted only where the source says all patients. Cerebral atrophy and leukoencephalopathy carry no frequency because their denominator is the three patients with follow-up scans, not the cohort; focal-onset seizure carries none because it rests on one case.

    Every ontology term was resolved through OLS4 and label-checked against the API response. HP:0007260 was rejected during that check: it is Type II lissencephaly, not a hypomyelination term; HP:0006808 Cerebral hypomyelination is the correct one.

    Validation: just validate (exit 0, 48/48 snippets verified), validate-terms (exit 0), check-duplicate-keys, check-entity-refs, check-causal-targets, check-snippet-length, check-title-snippets, check-environmental-evidence, check-folded-hyphens, check-stubs all exit 0.

  summary: 'Review: Triphalangeal Thumb-Polysyndactyly Syndrome'
  details: |
    Deep evidence and ontology review corrected the entry identity from preaxial polydactyly type 2 (MONDO:0008270; OMIM:174500) to the file-named triphalangeal thumb-polysyndactyly syndrome (MONDO:0017454; OMIM:190605; ORPHA:2950). Rebuilt the LMBR1-hosted ZRS/pZRS regulatory gain-of-ectopic-expression genetics and connected pathograph; curated six core limb phenotypes, molecular diagnosis, phenotype-directed reconstructive surgery, patient-fibroblast and transgenic-mouse models, and a testable chromatin-contact knowledge gap. Documented that no disease-specific GeneReviews was found and excluded GSE44325 because it studies general Sost/Sostdc1/Gli3 digit-number biology rather than human ZRS/pZRS TPT-PS. Evidence was checked against cached primary-source text; ontology terms and graph/model foreign keys were validated.

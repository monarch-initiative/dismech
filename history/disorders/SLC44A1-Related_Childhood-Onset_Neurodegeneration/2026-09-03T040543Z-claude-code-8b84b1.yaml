  summary: 'Address CHANGES_REQUESTED review on PR #10657'
  details: |
    Addressed the six blocking items from the ai4c-reviewer CHANGES_REQUESTED review.

    (1) reference_title added to all 57 evidence items via 'just backfill-reference-titles', which copies each title from the reference cache frontmatter rather than from memory; added a top-level references: block for the four PMIDs.

    (2) The genetic: block cited the founding paper's opening background premise ('Cerebral choline metabolism is crucial for normal brain function...') to support a claim about three named frameshift alleles. Replaced with the sentence reporting the alleles and families, same HUMAN_CLINICAL grading.

    (3) Split the bundled node 'Oligodendrocyte Maturation Failure and Myelin Lipid Imbalance' into 'Myelin Membrane Lipid Composition Imbalance' (MOLECULAR) -> 'Oligodendrocyte Maturation Failure' (CELLULAR), joined by a downstream edge, each carrying the evidence that actually measures it. Retargeted the Kennedy-pathway downstream edge, the citicoline target_mechanisms link, both zebrafish modeled_mechanisms links and their readouts, and the developmental_vs_maintenance_myelin_failure discussion attaches_to.

    (4) The 'Vulnerability to Iron-Mediated Cellular Injury' node claimed a knowledge gap that did not exist. Added discussion iron_vulnerability_and_basal_ganglia_signal (KNOWLEDGE_GAP) attaching to that node and to the basal ganglia MRI phenotype, with both sides of the gap cited.

    (5) Frequency made consistent. Removed VERY_FREQUENT from the four phenotypes that carried it: all eight clinical features come from one enumerating sentence in a four-patient series with no per-feature counts, so no band is derivable. Corrected the basal ganglia MRI finding from OCCASIONAL to FREQUENT - the source counts it as 2 of 4 individuals, 50%, which is the FREQUENT band (30-79%), not OCCASIONAL (5-29%). The policy is recorded in entry notes.

    (6) Narrow scope recorded as an explicit decision in notes, including what the SLC44A1 PubMed sweep returned and which sections are asserted empty rather than merely unfilled. The failed deep-research run is left recorded as it was; no provider report existed.

    Non-blocking suggestions taken: added a diagnosis: section (molecular confirmation, brain MRI); added a biochemical: entry for preserved membrane phosphatidylcholine with a BiomarkerReadout on the Kennedy-pathway node, biomarker_term deliberately unbound because NCIT has no analyte term for it; added CHILDHOOD onset descriptors to the four core phenotypes; recorded OMIM:618868 as an external_assertion, since DiseaseMappings has no OMIM slot.

    GeneReviews: searched PubMed with 'SLC44A1 AND GeneReviews[book]' and a title-based variant; both returned zero records. Recorded as a negative search result in notes.

    One reference added from the literature sweep: PMID:40540401 (oligodendroglia-specific Slc44a1 conditional knockout mouse), curated as a second animal model with two mechanism links and readouts, and supporting both halves of the split node.

    Validation: just validate, validate-terms, count-verified-snippets (57/57), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-reference-titles, check-folded-hyphens, check-snippet-length, check-title-snippets and just validate-disorders all pass.

  summary: 'Create: SLC44A1-Related Childhood-Onset Neurodegeneration'
  details: |
    Created kb/disorders/SLC44A1-Related_Childhood-Onset_Neurodegeneration.yaml for MONDO:0030028 (CONATOC), autosomal recessive SLC44A1/CTL1 deficiency. Decided entry_type DISEASE: a distinct MONDO term, a single causal gene (hgnc:18798, verified against HGNC), a conserved pathograph from biallelic frameshift through transporter loss, Kennedy-pathway constraint, oligodendrocyte maturation failure to the clinical quartet, and no existing parent entry to fold it into. Consumed and deleted the corresponding stub.

    NO DEEP-RESEARCH PROVIDER REPORT BACKS THIS ENTRY. The Edison/falcon provider was reported out of credits (HTTP 402) by the orchestrator, and the documented claude_code fallback was attempted once here and failed with 'WARNING - agentapi not found in PATH' followed by 'ERROR - Error: Claude Code exited with code 1: <no stderr>'. The entry was therefore curated from primary literature retrieved directly via PubMed E-utilities, with every reference fetched through just fetch-reference. No preflight-dr was run because no report exists.

    Verified the issue's premises rather than assuming them. hgnc:18798 does resolve to SLC44A1. The pre-existing SLC44A1 mention in kb/disorders/Mixed_Neuronal-Glial_Tumor.yaml is prose describing the somatic SLC44A1::PRKCA fusion in papillary glioneuronal tumor, not a genetic: binding, so it is not prior coverage. The issue's mechanism claim - CTL1 loss starving myelin of its phosphatidylcholine precursor - holds only in part, and the entry says so: PMID:31855247 measured diminished choline transport with membrane phosphatidylcholine content explicitly unchanged, and PMID:33789160 (same lab) reports phosphatidylcholine preserved in patient cerebrospinal fluid as well, attributing the residual Kennedy-pathway flux to the CTL2 paralogue. The phosphatidylcholine-pathway disruption is demonstrated in the oligodendrocyte lineage in vivo (PMID:41317319) but not in accessible human tissue. That tension is curated as a KNOWLEDGE_GAP discussion carrying a REFUTE evidence item, not resolved by assertion.

    Named Entity Confusion was actively managed. CONDCA (childhood-onset neurodegeneration with cerebellar atrophy, AGTPBP1, MONDO:0032650) is a separate entity curated elsewhere in this repository; no AGTPBP1 material was used, and an entry-level note plus a differential_diagnoses entry record the distinction. The MONDO synonym for this entity is CONATOC.

    Content: 8 pathophysiology nodes with biological_scale tags, 11 phenotypes, 1 genetic block, 4 treatments (choline and citicoline both curated explicitly as preclinical, plus supportive care and genetic counseling), 1 experimental_model (patient fibroblasts) and 1 animal_model (Slc44a1b-deficient zebrafish) both linked into the pathograph via modeled_mechanisms with readouts, 3 differential diagnoses, and 2 discussions (KNOWLEDGE_GAP and HUMAN_MODEL_MISMATCH). Three cited references, all fetched into references_cache: PMID:31855247, PMID:41317319, PMID:33789160. A fourth (PMID:36365192) was fetched during screening, was not cited in the entry, and was deliberately not committed.

    Validation: just validate passed; validate-terms passed; count-verified-snippets 44/44 after the snippet-grading fix described below (45/45 before it); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading and check-environmental-evidence all OK; just validate-disorders run as the final gate. One snippet-grading divergence was found and fixed by removing a redundant background-citation evidence item rather than by re-grading a copied quote.

  summary: 'Review: Polymyositis duplicate phenotype and mismatched evidence'
  details: |
    Claim-evidence audit as part of a 10-disorder muscular-disease review.
    Fixes: the entry carried two proximal-weakness phenotypes - 'Proximal Muscle Weakness' bound to HP:0003690 (Limb muscle weakness) and 'Proximal muscle weakness' bound to HP:0003701 - and the HP:0003690 one was supported by a snippet about serum creatine kinase correlating with CD8+ T cell invasion, which says nothing about weakness. Removed the duplicate HP:0003690 node (HP:0003701 is the precise term and is Orphanet-sourced) and relocated the creatine-kinase snippet to the 'Elevated circulating creatine kinase concentration' phenotype, whose reports_on edge already points at the CD8+ cytotoxicity node - the claim it actually supports.
    Noted but not changed: pathophysiology nodes carry no downstream causal edges, and the four treatments carry no evidence; the Orphanet-derived 'Hypotonia very frequent' row is attributed but clinically surprising for an adult inflammatory myopathy; and the entry does not address the modern nosology in which most historical 'polymyositis' is reclassified as IMNM, antisynthetase syndrome, or IBM.
    Validated: linkml-validate, linkml-term-validator, linkml-reference-validator, pytest tests/test_data.py (subset).

  summary: Add causal graph, treatment evidence, differentials, and nosology discussions
  details: |
    Addresses dismech#6968 (all four items).

    Item 1 - causal graph. Added downstream edges so the seven previously isolated pathophysiology nodes form a connected pathograph: Aberrant MHC Class I Expression -> CD8+ T Cell-Mediated Cytotoxicity (DIRECT; in-vitro OT-I / H2KbOVA myotube model, PMID:31257434, PARTIAL because the human antigen is unknown) and -> ER Stress and Unfolded Protein Response (DIRECT; ectopic H-2Kb induces the UPR in C2C12 cells, PMID:15934115); CD8+ cytotoxicity -> Apoptosis of Muscle Fibers (DIRECT, PMID:32936839) and -> Necroptosis and DAMP Release (INDIRECT_UNKNOWN_INTERMEDIATES, PMID:37483632, whose own text says the mechanism of fibre death is unresolved); Necroptosis and DAMP Release -> Pro-inflammatory Cytokine Production (DIRECT) and -> Proximal muscle weakness (DIRECT, MODEL_ORGANISM, from the necroptosis/HMGB1 inhibition rescue in the murine PM model); Pro-inflammatory Cytokine Production -> Aberrant MHC Class I Expression (DIRECT, IN_VITRO, PMID:9655472), closing a feed-forward loop; ER Stress -> Proximal muscle weakness (INDIRECT_UNKNOWN_INTERMEDIATES, PARTIAL). Evidence was added to the two previously evidence-free nodes: Myositis-Specific Autoantibodies (PMID:23568993) and Pro-inflammatory Cytokine Production (PMID:9655472).

    The Myositis-Specific Autoantibodies node deliberately gets no downstream edges. The pathogenic role of MSAs is unknown, and the leading alternative interpretation makes them a consequence of muscle damage rather than a cause, so a causal edge in either direction would assert more than the literature supports. Recorded as the pm_msa_pathogenic_role discussion and as a note on the node.

    Item 2 - treatment evidence. All four treatments gained NCIT/CHEBI term bindings, therapeutic_modality, and evidence. Corticosteroids and the steroid-sparing rationale come from PMID:29669460; the Cochrane 2025 review (PMID:40787733) is cited as a deliberate counterweight, showing that methotrexate and azathioprine rest on single very-low-certainty trials and that IVIg benefit is established for refractory dermatomyositis while the review states outright that the polymyositis data are not reliable.

    Item 3 - nosology. Added four differential_diagnoses (sporadic inclusion body myositis, dermatomyositis, immune-mediated necrotizing myopathy MONDO:0016098, antisynthetase syndrome) and a CONTROVERSY discussion pm_nosological_status citing PMID:12913190, PMID:41068877 and PMID:39132766. The issue offers three options (scoping note / discussion / reposition relative to sibling IIM entries); this record takes the discussion option and explicitly leaves the repositioning decision to a maintainer. Also added a KNOWLEDGE_GAP discussion pm_treatment_evidence_base linking the thin treatment evidence base to the nosological question, since trials enrolling "PM" have been enrolling a mixed population.

    Item 4 - Orphanet frequency. Added a note to the Hypotonia phenotype flagging that its VERY_FREQUENT band is an unchecked inheritance from the ORPHA:732 bulk import and should be re-checked against a clinical cohort. The band itself was left unchanged rather than silently downgraded.

    Validation actually run: just validate, just validate-terms, just count-verified-snippets, and the full batched just validate-disorders sweep all pass on this file; 55/55 evidence snippets verified against cached references; the 6054 selected tests in tests/test_data.py pass; build_causal_graph reports no referential-integrity issues. Seven new references were fetched with just fetch-reference; no cache file was hand-written. The regenerated pages/disorders/Polymyositis.html was reverted rather than committed, per the derived-artifact rule.

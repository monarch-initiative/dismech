    Promoted the Subdural_Empyema stub to a MONDO:0006984 infectious-disease entry. Curated Streptococcus as a representative agent, human endogenous contiguous and post-traumatic/postoperative seeding routes, a subdural-pus to mass-effect/cortical-inflammation pathograph wired to fever, headache, vomiting, altered mental status, focal deficits, seizure, and increased intracranial pressure, contrast-enhanced MRI diagnosis, broad intravenous antibiotic and neurosurgical drainage treatments, and a three-phase progression block with PMID-backed exact-quote evidence.


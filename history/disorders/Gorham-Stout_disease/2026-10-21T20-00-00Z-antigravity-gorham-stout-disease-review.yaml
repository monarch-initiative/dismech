  details: Reviewed Gorham-Stout_disease.yaml against cached full text of PMID:40102890. Added synonyms (vanishing bone disease, disappearing bone disease, massive osteolysis); bound anatomical locations (bone element, pleura, pleural cavity) and wired downstream edges from Progressive osteolysis, Skeletal pain state, and Chylothorax formation to Osteolysis, Pathological fracture, Bone pain, and Chylothorax; added Pathological fracture phenotype (HP:0002756); replaced indirect pleural effusion snippet on Chylothorax with direct chylothorax cohort evidence; wired Sirolimus therapy and Bisphosphonate therapy to Abnormal lymphangiogenic activation and Progressive osteolysis via target_mechanisms; and added verbatim evidence to Cross-sectional imaging, Histopathologic evaluation, diffuse lymphatic malformation, and fibrous dysplasia.

  summary: Separate APC promoter deletion from measured allelic silencing
  details: |
    Added a germline promoter 1B deletion trigger using controlled variant_type, separated from the existing allele-specific expression defect. Classified expression from the silenced allele as DECREASED gene expression and scoped ESTABLISHED confidence to assayed RNA rather than all tissues. Kept UTR overlap on the approximately 11 kb allele only, since the 6858 bp abstract does not resolve transcript-relative overlap. Added explicit regulatory_target_gene roles: both sequence gene and target for the exon-overlapping allele, target-only for the second allele. Changed functional-effect wording from transcription to gene expression because the RNA readout does not distinguish RNA synthesis from stability. Existing LOE/mLOE uncertainty retained; primary evidence preserved and independently reviewed.

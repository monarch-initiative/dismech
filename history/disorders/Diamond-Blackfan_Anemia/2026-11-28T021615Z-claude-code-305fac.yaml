  summary: 'Curate phenotypes: Diamond-Blackfan Anemia'
  details: |
    Expanded phenotypes from 8 to 21 using cached full texts (2008 consensus PMID:18671700, Ulirsch 2018 whole-exome cohort PMID:30503522, Gazda 2008 PMID:19061985, NCI eADA cohort PMID:23252420, Liu and Karlsson 2023 review PMID:37973818, 2024 consensus abstract PMID:38697731, GeneReviews). Added reticulocytopenia, elevated eADA (31/37), elevated HbF, neutropenia, thrombocytopenia, nonimmune hydrops fetalis, low birth weight, hypertelorism, cleft lip and/or palate, thumb anomalies, congenital heart defects (41/286), genitourinary anomalies (19/286) and colon cancer. Replaced the Congenital Malformations phenotype, which was bound to HP:0004439 Craniofacial dysostosis, with Craniofacial Anomalies bound to HP:0000271 (VARIABLE_SPECTRUM) and retargeted its causal edge. Removed unsourced frequency bands from AML, MDS, osteosarcoma and triphalangeal thumb and added literature case counts. Added onset where stated and wired new phenotypes from existing pathophysiology nodes. PubMed, Europe PMC and Orphanet were blocked by the session proxy, so no new references were fetched. Validated with just validate, count-verified-snippets (123/123), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes, check-name-collisions and check_snippet_length.

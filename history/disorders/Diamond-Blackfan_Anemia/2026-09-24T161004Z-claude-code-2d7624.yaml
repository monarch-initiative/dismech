  summary: 'Genetics pass: fourteen numbered DBA subtypes wired to genes and subunit-specific
    nodes'
  details: |
    Genetics pass for the d2g series-027 gap list (issue #12234). Converted the four
    mondo_mappings narrowMatch entries into has_subtypes rows and added ten more, so
    all fourteen numbered MONDO Diamond-Blackfan anemia classes on the gap list are
    now curated rows carrying their causal gene, their evidence and a reciprocal
    genetic[].subtype foreign key.

    Split the single Ribosomal Protein Haploinsufficiency node into a small-subunit
    assembly node (RPS19, RPS24, RPS17, RPS7, RPS10, RPS26, RPS29), a large-subunit
    assembly node (RPL5, RPL11, RPL35A, RPL26, RPL15, RPL17) and a nuclear-import
    node (HEATR3), all converging on the original node, which now carries no genes
    of its own. Added genetic records for RPL26, RPL15, RPS29, RPL17 and HEATR3, and
    first evidence for RPS24, RPS17, RPS7, RPS26 and RPS10, which previously carried
    none. Added case_fractions for RPS19 (25%) and RPS24 (1.4%) and a GATA1
    downstream edge to Pure Red Cell Aplasia.

    Review of the inherited draft found and fixed three prose defects: the entry
    description described two published case-share figures as the yield of the
    screens that reported them when they are the prior state of knowledge in each
    paper; the DBA5 row said "several probands were ascertained through chromosome
    3q deletions" where the source reports two patients; and the DBA1 row asserted a
    ClinGen classification whose record was cited only in the genetic section, now
    cited on the row itself with a note that ClinGen curates RPS19 against the
    umbrella class MONDO:0015253 rather than against MONDO:0007110.

    Verified every reference_title against the cache frontmatter, every CURIE and
    gene symbol against live OLS and HGNC lookups, and the HGNC "S ribosomal
    proteins" / "L ribosomal proteins" gene-group claims against the HGNC REST API.
    Gates: validate, validate-terms, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (44 gene descriptors, 0 findings), check-genereviews
    (TAGGED), and validate-disorders with linkml-reference-validator 0.3.0rc1
    (81/81 snippets verified).

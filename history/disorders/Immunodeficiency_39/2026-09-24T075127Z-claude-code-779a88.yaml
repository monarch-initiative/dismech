  summary: 'Create: Immunodeficiency_39'
  details: |
    De-novo curation of autosomal recessive IRF7 deficiency (immunodeficiency 39, MONDO:0014597). Deep-research report research/Immunodeficiency_39-deep-research-perplexity.md is a Perplexity sonar-deep-research run generated through a session-local streaming workaround for #9357, kept as a lead only. preflight-dr PASSED (IRF7 mentioned 321 times; OMIM 616345 matches). Report reference/term validation reviewed: 1/1 reference resolved, term validation clean apart from the expected 'if available' MONDO mislabel. Primary literature located via PubMed E-utilities and fetched with just fetch-reference. Six-node causal chain from IRF7 loss of function through failed IRF7-dependent interferon amplification (conforms_to innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT Signaling), absent pDC interferon production and impaired epithelial cell-intrinsic immunity, to enhanced respiratory viral replication reaching severe influenza/SARS-CoV-2/RSV phenotypes; IRF7 gene wired into the pathograph via genes descriptors. No GeneReviews chapter (check-genereviews NO_CHAPTER). Validated: validate, validate-terms (32/32 snippets), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-folded-hyphens, check-reference-titles, and validate-disorders. Cited references: PMID:25814066 (Ciancanelli 2015), PMID:35670811 (Campbell 2022 cohort), PMID:32972995 (Zhang/Bastard 2020).

  summary: 'Gene-family review: SLC26A6 MF term and typing'
  details: |
    The SLC26A6 trigger node bound the generic oxalate transmembrane transporter activity (GO:0019531); the reported p.R507W variant reduces chloride-dependent oxalate transport (PMID:35115415), which is the exchange GO:0160046 oxalate:chloride antiporter activity names, so the node now binds that child term as decreased. The record was typed CAUSATIVE on a single family; Europe PMC search for SLC26A6 with hyperoxaluria, nephrolithiasis or oxalate from 2021 to 2026 found no further human families, and ClinGen has no SLC26A6 assertion, so the record is now typed UNKNOWN with the reason in its notes. Record-level autosomal dominant inheritance added (cosegregation in the family, PMID:35115415).

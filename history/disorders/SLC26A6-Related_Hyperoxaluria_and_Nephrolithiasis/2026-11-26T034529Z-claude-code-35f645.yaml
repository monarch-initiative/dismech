  details: |
    Searched PubMed (three queries on SLC26A6 with hyperoxaluria/nephrolithiasis/oxalate/kidney stone/hypocitraturia), GeneReviews/StatPearls index (no chapter), and the citing literature. Only one human family (PMID:35115415, full text cached) carries clinical detail; PMID:18951670 found no pathogenic variants and adds no phenotype. Added Hypocitraturia (mild), enriched Hyperoxaluria (both carriers, father) and Calcium oxalate nephrolithiasis (recurrent, bilateral, no nephrocalcinosis), added two downstream edges to the phenotypes. No frequencies recorded: the series is one proband and one carrier father. Validated with validate, count-verified-snippets, validate-terms, validate-disorders and the causal-target, coarse-phenotype and name-collision checks.

  details: |
    PR-shepherd fix for a review finding on PR #7840 (the 'New (small, identical pattern to #2)' item). The ABCB4 genetic record carried a self-imposed 'No ICP-specific evidence item is attached yet' note while the meta-analysis already cached in this PR (PMID:42178310) reports two genome-wide-significant 7q21 signals annotated to the locus. Attached the stronger row (rs59934297, p=1.7e-49, OR 0.60 95% CI 0.56-0.64, effect-allele frequency 0.13) as a verbatim snippet and rewrote the notes to separate established locus-level association from the still-open rare-coding-variant effect size, mirroring the ABCB11 treatment applied in c403e01001. The locus annotation is 'ABCB1/4' and does not discriminate between the two adjacent genes; that ambiguity is stated explicitly in both the notes and the evidence explanation rather than being silently resolved in favour of ABCB4. Validated: just validate passed, just validate-references 26/26 snippets verified, just validate-terms passed, check-term-cache-integrity and check-cache-order OK.

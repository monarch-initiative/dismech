  summary: 'Genetics pass: add ICP1 and ICP3 subtype rows, attach ATP8B1 evidence,
    wire three genes and three phenotypes'
  details: |
    d2g genetics pass for the two rows of dismech#12274 under this parent
    (MONDO:0007829 ICP1 / ATP8B1 and MONDO:0013995 ICP3 / ABCB4). Neither CURIE
    appeared anywhere in kb/ before this change.

    Anchor test. MONDO:0100429 is correct and unchanged. It has exactly two children,
    both are the issue's rows, and both carry a causal gene in their logical axioms.

    Rows. Both are now `has_subtypes` rows, ICP1 with ATP8B1 and ICP3 with ABCB4,
    each described as what it is: a gene-keyed designation in the OMIM and MONDO
    numbered series rather than a Mendelian subtype, since the reported alleles are
    heterozygous and the arms are not clinically separable. Neither row scopes a
    phenotype, prevalence or progression record, and the descriptions say so.

    The ATP8B1 record previously ended "No ICP-specific evidence item is attached
    yet". Three items were added and that sentence replaced: two from PMID:28924228
    (five potentially damaging ATP8B1 variants in 147 sequenced patients, and the
    targeted 545-case follow-up screen for the recurrent Asn45Thr allele) and one
    from PMID:15888793 (two heterozygous ATP8B1 substitutions in a British series
    selected for normal gamma-GT). The ICP3 row carries a fourth new item from
    PMID:28924228 listing twelve ABCB4 variants, which is the rare-variant half of
    the support for that arm beside the common-variant 7q21 association already on
    the ABCB4 record.

    Wiring. Gene-to-mechanism coverage went 3/6 to 6/6: ABCG5, ABCG8 and CYP8B1 were
    bound as `genes:` descriptors on the Genetic and Hormonal Susceptibility of
    Hepatobiliary Transport node, whose description already states that the
    genome-wide meta-analysis implicates a broader set of loci and which cites the
    same GWAS those three genes' evidence quotes. Phenotype causal inlink went 2/5 to
    5/5: increased serum bile acids, elevated transaminases and premature birth wired
    from the Maternal Bile Acid Accumulation node. The preterm-birth edge is typed
    INDIRECT_UNKNOWN_INTERMEDIATES and its description says the route is partly
    iatrogenic, which is what the cited meta-analysis sentence distinguishes.

    Two new reference caches are committed: PMID_28924228.md and PMID_15888793.md.
    Validation on the committed tree: `just validate` clean, `just validate-terms`
    clean, and the file's share of a 643/643 snippet verification across the ten
    files this PR touches. One snippet caught in self-review had been copied with its
    tail altered ("and stillbirth" for "and neonatal unit admission") and was
    corrected against the cache before the gate ran.

  details: |
    Audited and enriched Intrahepatic Cholestasis of Pregnancy (MONDO:0100429). Added classification evidence and GENETICS_ENVIRONMENT_DISEASE, resolved all 6 gene_activity_grounding gaps by binding canalicular transporter GO molecular functions (GO:0090554, GO:0015126, GO:0140346, GO:0034041) on Genetic and Hormonal Susceptibility of Hepatobiliary Transport and separating NR1H4 (GO:0004879) and CYP8B1 (GO:0004497) onto dedicated molecular nodes, added UBERON locations across pathophysiology, attached explicit 2p21 evidence on ABCG8, added 3 NCIT-bound diagnostic procedures (serum bile acids, aminotransferases, multigene transporter sequencing), added target_mechanisms and target_phenotypes on treatments, and updated stale ATP8B1 rationale prose in discussions.

  summary: 'Create: Intrahepatic Cholestasis of Pregnancy'
  details: |
    New entry filling part of the obstetric gap identified by a coverage survey (the KB held ~25 neoplastic vs 7 non-neoplastic women's-health entries, with obstetrics represented by only Preeclampsia, Peripartum Cardiomyopathy and GTN).
    Modeled as a five-node chain: genetic and hormonal susceptibility of hepatobiliary transport (ABCB4/ABCB11/ATP8B1/NR1H4 plus the GWAS bile-acid-synthesis and lipid loci, unmasked by third-trimester sex steroid metabolites) -> impaired hepatocellular bile acid export -> maternal bile acid accumulation -> transplacental transfer and fetal accumulation -> fetal cardiomyocyte electrophysiological disturbance -> stillbirth. A CANONICAL mechanistic_hypotheses group (fetal_bile_acid_cardiotoxicity_model) captures why ICP stillbirth is sudden and unpredictable rather than preceded by growth restriction.
    Evidence discipline: all five PMIDs were fetched into references_cache and every snippet was verified as an exact substring by linkml-reference-validator. Two initially guessed PMIDs resolved to unrelated papers on fetch and were discarded rather than used. UDCA is curated honestly: it carries supports: REFUTE on the PITCHES randomised trial (no reduction in adverse perinatal outcomes) alongside PARTIAL in-vitro support for its proposed fetal antiarrhythmic mechanism, with a target_mechanisms edge that explicitly notes the mechanism did not translate.
    Ontology note: the Stillbirth phenotype is deliberately left unbound. HP:0003826 exists but sits under Mortality/Aging and Prenatal death, outside the HP:0000118 root of the PhenotypeTerm dynamic enum, and MONDO has no stillbirth class; binding a coarser parent would misrepresent the disorder's key outcome. Recorded as an ontology gap in the phenotype notes.
    A HUMAN_MODEL_MISMATCH discussion records that the arrhythmia mechanism rests on rodent and in vitro human fetal cardiac models and has never been observed in a human fetus in vivo.

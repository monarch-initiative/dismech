  summary: 'Gene-family review: ABCG5, ABCG8'
  details: |
    The ABCG8 susceptibility record had no evidence. Added the meta-analysis row for the 2p21 lead variant rs4148211, which the study annotates to ABCG5/8 jointly (PMID:42178310), and removed the cross-reference to the ABCG5 record that stood in for it. The seven-gene hepatobiliary susceptibility node still carries no molecular function; it collects transporters, a nuclear receptor and a hydroxylase with no shared activity, so binding one term was not attempted.

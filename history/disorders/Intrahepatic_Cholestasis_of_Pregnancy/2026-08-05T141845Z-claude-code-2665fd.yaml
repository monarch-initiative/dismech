  summary: Attach ICP-specific GWAS locus evidence to transporter and synthesis genes
  details: |
    PR-shepherd pass addressing review findings #2 and #3 on PR #7840. Attached the genome-wide significant 2q31 ABCB11 locus row from PMID:42178310 (already in this PR's reference cache) to the ABCB11 genetic entry, replacing the self-imposed 'No ICP-specific evidence item is attached yet' note. Added three new genetic entries for previously unconsumed loci from the same meta-analysis: ABCG5 (hgnc:13886) and ABCG8 (hgnc:13887) for the 2p21 sterol-transport locus (rs4148211, p=5.8e-113, the strongest signal in the study), and CYP8B1 (hgnc:2653) for the 3p22 bile-acid-synthesis locus (rs12494055, p=1.2e-14). HGNC identifiers were verified against sqlite:obo:hgnc with OAK before use. Corrected the gap_icp_transporter_variant_evidence discussion rationale, which asserted something factually wrong about its own reference (the cached GWAS does carry a genome-wide significant ABCB11 row); the rationale now distinguishes locus-level association, which is established, from rare-coding-variant effect size, which remains open. Validation: just validate clean, 25/25 snippets verified. Reference-cache frontmatter churn produced by the validator run was discarded, not committed.

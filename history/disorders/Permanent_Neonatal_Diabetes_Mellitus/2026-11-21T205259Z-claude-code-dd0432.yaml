  summary: Create from the Diabetes_Mellitus umbrella's PNDM catalogue
  details: |
    Part of retiring the Diabetes_Mellitus umbrella Disease entry (step 5 of docs/curation-notes/diabetes-mellitus-grouping-refactor.md). Subtype rows PNDM1-4, PNDM-PCAS, EIF2B1-NDM and an NDM-CH pointer, and their gene rows, moved as unchanged blocks; umbrella-relative notes reworded. New content from the GeneReviews chapter (PMID:20301620): inheritance (dominant, mostly de novo, and recessive by gene), insulin deficiency, phenotypes at diagnosis, insulin therapy and sulfonylurea transfer; mechanism nodes for the K-ATP channel, complete glucokinase deficiency, proinsulin misfolding and pancreatic agenesis, each with its GO molecular function. EIF2B1 is not wired to a node because no cited source states its molecular defect.

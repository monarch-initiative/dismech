  summary: 'Create: Glomerulopathy With Fibronectin Deposits 2'
  details: |
    Created the FN1-associated fibronectin glomerulopathy entry (MONDO:0011165) from the stub, with 10 pathophysiology nodes, 17 phenotypes, 4 treatments, 2 diagnosis rows and 2 patient iPSC lines, 93 evidence items over 28 PubMed records and the ClinGen CGGV record. The causal chain runs from heterozygous FN1 heparin- and integrin-binding domain variants, through altered heparin and integrin binding (direction differs by variant, so modifiers are ABNORMAL) and a hypothesised loss of solubility of hepatocyte-derived plasma fibronectin (with an in vitro REFUTE item, PMID:28745050), to mesangial and subendothelial plasma fibronectin deposition, lobular glomerular enlargement, filtration barrier dysfunction (conforms to nephrotic_podocyte_injury#Glomerular Filtration Barrier Breakdown), progressive kidney failure and allograft recurrence. 16 of 17 phenotypes are causally connected; renal tubular acidosis is left unwired because no source states its mechanism. ClinGen Moderate is copied into gene_disease_validity; relationship_type is left unset because the schema maps CAUSATIVE to Definitive or Strong. The name keeps the MONDO and OMIM numbered-series label: the only dyad in MONDO is a design-pattern synonym and PubMed has one FN1-associated title. No GeneReviews chapter covers the disease. The single deep-research report is openscientist (18 references, 18 resolved, 0 unresolved, 16/16 quotes found; term validation 31 of 32 resolved, 10 named as a different term, including four wrong NCIT treatment CURIEs that were not used); preflight-dr returned PASS. Leads taken from it: PMID:10964510, PMID:39285372, PMID:40529320 and the sacubitril/valsartan use in PMID:41642109; every snippet was checked against the cached reference. Validation: just validate, validate-terms, count-verified-snippets (93/93), check-causal-targets, check-entity-refs, check-coarse-phenotypes, check-qualifier-terms, check-name-collisions, check-gene-namespaces, check-gene-activity-grounding, check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-cache-order and validate-disorders all pass.

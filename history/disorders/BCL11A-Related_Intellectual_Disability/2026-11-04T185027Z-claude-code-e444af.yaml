  summary: 'Create: Dias-Logan_Syndrome'
  details: |
    Created the entry for Dias-Logan syndrome (MONDO:0014914, OMIM 617101), named BCL11A-Related Intellectual Disability after the GeneReviews chapter (PMID:31556984), with the MONDO/OMIM label kept as a synonym. Sources: the founding report (PMID:27453576), the 77-person clinical series that supplies most phenotype frequencies (PMID:39448799), the GeneReviews abstract, the ClinGen Definitive AD assertion (copied into gene_disease_validity), erythroid studies of BCL11A as the gamma-globin repressor (PMID:19056937, PMID:25938782, PMID:26019277, PMID:33938942, PMID:34634037), the BAF subunit proteomics (PMID:23644491), and mouse studies of cortical and Purkinje cell roles (PMID:26182416, PMID:25972180, PMID:35766181, PMID:40855003). The pathograph runs from BCL11A haploinsufficiency to gamma-globin derepression (and so persistent HbF), dysregulated neuronal transcription, cortical projection neuron development, Purkinje cell dysfunction and reduced brain growth; edges resting on homozygous or conditional knockouts are marked INDIRECT. Larger 2p15-p16.1 contiguous deletions are scoped out as a separate syndrome. Erythroid BCL11A enhancer editing is mentioned in notes as context and is not listed as a treatment. The OpenScientist deep-research report had not arrived when the entry was built, so no report content is used. ClinGen assertion id: the current export carries CGGV:assertion_9630f9a3-...-2020-09-01T100000.000Z, while cache/clingen/gene_validity.csv still lists the same assertion with a 2020-09-13T171807.228Z suffix; the entry cites the current id. Checks run: just validate, count-verified-snippets (91/91), validate-terms, check-genereviews --online (TAGGED), and the offline whole-repo gates.

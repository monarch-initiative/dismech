  summary: 'Create: BCL11A-Related_Intellectual_Disability'
  details: |
    Created the entry for Dias-Logan syndrome (MONDO:0014914, OMIM 617101), named BCL11A-Related Intellectual Disability after the GeneReviews chapter (PMID:31556984), with the MONDO/OMIM label kept as a synonym. Sources: the founding report (PMID:27453576), the 77-person clinical series that supplies most phenotype frequencies (PMID:39448799), the GeneReviews abstract, the ClinGen Definitive AD assertion (copied into gene_disease_validity), erythroid studies of BCL11A as the gamma-globin repressor (PMID:19056937, PMID:25938782, PMID:26019277, PMID:33938942, PMID:34634037), the BAF subunit proteomics (PMID:23644491), and mouse studies of cortical and Purkinje cell roles (PMID:26182416, PMID:25972180, PMID:35766181, PMID:40855003). The pathograph runs from BCL11A haploinsufficiency to gamma-globin derepression (and so persistent HbF), dysregulated neuronal transcription, cortical projection neuron development, Purkinje cell dysfunction and reduced brain growth; edges resting on homozygous or conditional knockouts are marked INDIRECT. Larger 2p15-p16.1 contiguous deletions are scoped out as a separate syndrome. Erythroid BCL11A enhancer editing is mentioned in notes as context and is not listed as a treatment. Deep research: research/BCL11A-Related_Intellectual_Disability-deep-research-openscientist.md (OpenScientist) was read and integrated after the first build. Its reference validation resolved all 16 references (0 unresolved, 0 off topic); its term validation resolved 31 of 32 terms with none unresolved, and needs_review is set because 13 terms carry the report's category headings rather than names. One of those is a real mislabel: the report gives CHEBI:5386 as 'hemoglobin F component', but CHEBI calls it globin; it is not used. just preflight-dr passed (BCL11A mentioned 54 times, OMIM 617101 matches MONDO). Added from the report: cortical progenitor proliferation and Nr2f1 repression (PMID:34963132) and layer IV sensory-area identity (PMID:27100196) on the cortical development node, downslanted palpebral fissures and epilepsy evidence plus HbF diagnostic use from PMID:32903878. Not used: PMID:23230003 (null knockout lymphopoiesis, not the heterozygous state), PMID:23495096 and PMID:28573701 (deletions that also remove PAPOLG and REL), PMID:39217489 (single case adding nothing new), PMID:15465497 (expression only), and PMID:38661449/PMID:42274009 (exa-cel, context only). Where the report is wrong: it says penetrance is complete, that cases are essentially all de novo and never inherited, and that germline mosaicism is not reported; the 77-person series it cites reports 83% de novo, two families with apparent germline mosaicism and two inherited from mildly affected or unaffected parents (PMID:39448799), which is what the entry records. It also suggests HP:0002365 (brainstem hypoplasia) and HP:0012332 for the small pons and autonomic features; the entry keeps the more specific HP:0012110 for the pons and HP:0002270 for autonomic dysfunction. ClinGen assertion id: the current export carries CGGV:assertion_9630f9a3-...-2020-09-01T100000.000Z, while cache/clingen/gene_validity.csv still lists the same assertion with a 2020-09-13T171807.228Z suffix; the entry cites the current id. Checks run: just validate, count-verified-snippets (all verified), validate-terms, check-genereviews --online (TAGGED), and the offline whole-repo gates.

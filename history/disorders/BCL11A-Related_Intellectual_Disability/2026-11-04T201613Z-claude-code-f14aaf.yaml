  summary: 'Review round 1: BCL11A-Related_Intellectual_Disability'
  details: |
    Review round 1. Added craniofacial phenotypes from Table 1 of PMID:39448799, each quoting its table row: thick or everted lower lip vermilion (HP:0000179 Thick lower lip vermilion, 22/41, FREQUENT; the source counts thick and everted together), wide nose (HP:0000445, 21/41, FREQUENT), full cheeks (HP:0000293, 19/41, FREQUENT), epicanthus (HP:0000286, 12/41, OCCASIONAL), and cleft or high palate (HP:0000174 Abnormal palate morphology, 6/41, OCCASIONAL), bound to the common parent because the table row lumps cleft and high palate. Added gastroesophageal reflux (HP:0002020) and feeding difficulties (HP:0011968) from the GeneReviews management and surveillance text, with no frequency, and listed them with constipation as target_phenotypes of the supportive-care treatment. Added VERY_FREQUENT to delayed speech (36/39) and motor delay (gross 37/39, fine 24/26) from Table 1 rows. On the Dysregulated Neuronal Transcription node, replaced chromatin remodeling (DECREASED) with regulation of gene expression (GO:0010468, DYSREGULATED), which is what the mouse RNA-seq measured. Regraded the human fetal cerebellum immunohistochemistry evidence from OTHER to IN_VITRO. Removed the evidence item on the pons edge, which stated a gap rather than supporting the link, and moved the gap into the edge description. Table-row snippets bridge the stripped [colspan=2] markup with an ellipsis.

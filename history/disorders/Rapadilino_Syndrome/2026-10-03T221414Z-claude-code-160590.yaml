  summary: 'Create: RAPADILINO Syndrome'
  details: |
    New entry for RAPADILINO syndrome (MONDO:0009955), curated from the Perplexity deep-research report research/Rapadilino_Syndrome-deep-research-perplexity.md plus primary literature fetched into references_cache. The report was used as a lead only: its HGNC identifier for RECQL4 (HGNC:9943) is wrong (the gene is hgnc:9949), all 14 NCIT treatment CURIEs it offered resolve to unrelated concepts, it cites PMID:10413338 (a 1999 Teratology case report with no abstract) and quotes MedlinePlus/Orphanet text that is not cached, and its MedlinePlus-attributed prevalence figure was not used. Claims were kept only where a cached abstract or full text names RAPADILINO specifically, or where a RECQL4-spectrum statement is marked as such (cancer surveillance from the Baller-Gerold GeneReviews chapter is graded INDIRECT). Pathophysiology chains the exon 7 founder allele to helicase/ATPase loss and nuclear retention failure, then to replication-initiation failure, progenitor proliferation failure, p53 activation and defective skeletal development, following the Baller-Gerold entry for the shared RECQL4 nodes. The 2003 report of no significant cancer risk is recorded as a REFUTE item beside the 2009 follow-up (6 of 15 patients with osteosarcoma or lymphoma). Validated with just validate, count-verified-snippets (77/77), validate-terms and the offline gate set.

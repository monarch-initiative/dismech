  summary: 'Review round 1: three term rebindings, connect phenotypes, four added
    phenotypes'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES on PR #11380. All seven blocking findings applied, plus a reasoned decline on one suggestion. Every proposed term was verified against OLS before rebinding.

    Finding 1: Delayed anterior fontanelle closure rebound from HP:0000270 (Delayed cranial suture closure) to HP:0001476 (Delayed closure of the anterior fontanelle). Sutures and fontanelles are different structures.

    Finding 2, the most serious: Hooding of the eyelids was bound to HP:0000508 (Ptosis) with a description asserting Ptosis was the closest available HPO concept. HP:0030820 (Hooded eyelid) exists. Rebound, and the false rationale removed rather than softened. Ptosis is levator dysfunction; eyelid hooding is a fold of the upper lid.

    Finding 3: Growth failure was bound to HP:0008897 (Postnatal growth retardation) while its description and snippet both asserted prenatal onset. Split into two phenotypes rather than rebound, since the quoted sentence supports both: Intrauterine growth retardation (HP:0001511) at FREQUENT, because the source says growth failure is often of prenatal onset rather than always, and Postnatal growth retardation at VERY_FREQUENT for the lifelong sub-fifth-centile deficit.

    Finding 4: all phenotypes were orphan nodes. Added downstream edges from the cranial neural crest node to the three skull and midface phenotypes it actually accounts for, as INDIRECT_KNOWN_INTERMEDIATES since the intermediate is identified but only in mouse, and from the organism-level node to the remaining seventeen as INDIRECT_UNKNOWN_INTERMEDIATES. Verified programmatically: 20 of 20 phenotypes connected, no dangling targets.

    Finding 5: added Wide nose (HP:0000445) and Abnormality of the dentition (HP:0000164), the two discriminating features named in a snippet already in the file.

    Finding 6, spectrum-level policy consistency: added Myopia (HP:0000545) and Congenital heart disease (HP:0001627) from the same GeneReviews sentence that already supplied three curated phenotypes. The reviewer suggested adopting the deep-research report's stronger reason for the limb omission, that limb defects are typically absent or mild in HDAC8-CdLS. That was checked and not adopted: PMID:30158690 was fetched for the purpose, and neither it nor PMID:24403048 states it. The second says only that HDAC8 and RAD21 phenotypes become more variable and sometimes atypical. The notes now record what was checked and what the papers actually say, and the limb omission stands on the checkable ground rather than the report's.

    Finding 7: node 1 rebound from GO:0004407 (histone deacetylase activity) to GO:0033558 (protein lysine deacetylase activity), since the entry's whole thesis is that the substrate is the non-histone cohesin subunit SMC3. The now-unused GO:0004407 cache rows, which this PR had introduced, were removed rather than left behind.

    Declined with a reason recorded in the node description: CL:0000008 (migratory cranial neural crest cell). The mouse work deletes Hdac8 in the cranial neural crest lineage and reads out skull patterning; it does not establish that the affected population is specifically the migratory one.

    Validated: just validate (60/60 snippets), just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-term-cache-integrity, check-cache-order.

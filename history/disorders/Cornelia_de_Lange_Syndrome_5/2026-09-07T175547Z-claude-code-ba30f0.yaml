  summary: 'Create: Cornelia de Lange Syndrome 5 (HDAC8-related)'
  details: |
    De novo curation of MONDO:0010471 (Cornelia de Lange syndrome 5), the X-linked HDAC8 form of the cohesinopathy spectrum. Follows the series precedent already in the repository: CdLS1 (NIPBL) and CdLS4 (RAD21) are standalone entries and the parent CdLS entry has no has_subtypes block, so MONDO:0010471 was unbound anywhere in kb/ before this. Pathophysiology is a causal chain from loss of SMC3 deacetylase activity through persistent SMC3 acetylation, failed cohesin recycling and altered cohesin occupancy to the developmental phenotype, with the mouse-derived cranial neural crest branch curated separately and labelled as such. 55 evidence snippets, all exact-quote verified. GeneReviews baseline used: the CdLS chapter PMID:20301283, tagged; there is no HDAC8-specific chapter, so shared phenotype frequencies are spectrum-level and the entry says so. Deep research: one openscientist run, committed, 18/18 citations verified. It surfaced two references the manual search missed, the Hdac8 mouse skull/neural-crest work (PMID:19605684) and the HDAC8 cohort reporting maternal mosaicism (PMID:26671848). Its term validation correctly flagged GO:0016575 as obsolete; that term is not used. An episignature diagnostic the report proposed was deliberately not curated because the cited paper makes no CdLS5-specific claim. Validated with just validate, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and the four snippet gates, all passing.

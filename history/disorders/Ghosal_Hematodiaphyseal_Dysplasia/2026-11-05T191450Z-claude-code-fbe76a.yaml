  summary: 'Create: Ghosal_Hematodiaphyseal_Dysplasia'
  details: |
    New entry for MONDO:0009274 (TBXAS1, AR). OpenScientist deep research was used as a lead only; every claim cites a primary PubMed abstract or full text, Orphanet ORPHA:1802, or the current ClinGen record (CGGV ...2025-04-07, Definitive, which supersedes the 2023 Moderate assertion in the committed ClinGen CSV). Seven pathophysiology nodes from TXAS deficiency through PGH2 shunting, osteoblast RANKL/OPG change, diaphyseal hyperostosis, marrow fibrosis, systemic inflammation and the platelet arachidonic-acid aggregation defect; inferred edges are marked INDIRECT. BDPLT14 (MONDO:0013597) kept separate as relatedMatch plus differential, because ClinGen reports GHDD patients do not bleed and the OMIM 614158 bleeding patients were never genotyped; for the same reason no conformance to primary_hemostatic_plug_failure. TBXAS1-associated CNO recorded as a knowledge gap, not a phenotype. Validated with just validate, count-verified-snippets (98/98), validate-terms, the offline gates, and validate-disorders.

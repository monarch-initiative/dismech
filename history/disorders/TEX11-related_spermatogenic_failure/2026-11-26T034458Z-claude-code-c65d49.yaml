  summary: 'Curate phenotypes: TEX11-related spermatogenic failure'
  details: |
    Added meiotic maturation arrest phenotype (HP:0031038) with three evidence items (PMID:25970010, PMID:29661171, PMID:32741963), wired from the Spermatogenic Arrest at Meiosis I node. Added human evidence for male infertility and a second-family azoospermia item. Corrected the hormone note: the one TEX11 patient with a reported FSH (PMID:32741963) was within range. Searches: Europe PMC TEX11 azoospermia/infertility, GeneReviews/StatPearls index (no chapter), cached Yatsenko 2015, Yang 2015, Sha 2018, Krausz 2020, the 2021 monogenic male infertility review (PMID:34498060) and the 2018 spermatogenesis genetics review (PMID:29527098), neither of which gave further TEX11 phenotype detail; testis volume and hormone data not stated for other cases.

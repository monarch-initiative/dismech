  summary: 'Create: TEX11-related spermatogenic failure (MONDO:0010647, SPGFX2)'
  details: |
    New entry for the TEX11-associated X-linked spermatogenic failure, bound to MONDO:0010647 (OMIM 309120, SPGFX2).

    The claim that produced this entry named the wrong disease, and correcting that is the main thing this session established. Issue #10847 claimed MONDO:0056795 (X-linked spermatogenic failure 1) intending to curate TEX11. MONDO:0056795 is a different disease: verified against OLS, its definition is a Sertoli-cell-only phenotype in which only Sertoli cells line the seminiferous tubules and no sperm cells are present, with synonyms Del Castillo syndrome and germinal cell aplasia and xref OMIM:305700, and no causal gene is mapped for it. Verified against OMIM esummary that 305700 and 309120 are separate current entries titled SPGFX1 and SPGFX2 respectively. TEX11 is 309120. The signal that should have caught this before the claim was in the stub itself: stubs/X-linked_Spermatogenic_Failure_1.yaml carries no genes block, and per CLAUDE.md an absent block means MONDO records no causal gene, which is a positive statement rather than missing data. A gene-less stub for something about to be curated as a single-gene disease should have stopped the claim.

    This also corrects the automated research comment on #10847, which read the Sertoli-cell-only definition as a legacy artifact of OMIM 305700 before it was renamed SPGFX1 and assigned to TEX11. That is not what happened; 305700 was never assigned to TEX11, and the two entries still coexist. The comment's biology, the ZZS complex framing, the grouping phrasing problem and the TESE-prognosis literature were all correct and were used.

    Deep research: one claude_code run, filed under the old name (research/X-linked_Spermatogenic_Failure_1-deep-research-claude_code.md). Its reference validation was clean, 17/17 resolved, 0 unresolved, 1/1 quoted claim found in source. Its most valuable output was a nomenclature note at the head of the report distinguishing SPGFX1 from SPGFX2 and stating that SPGFX1 has no molecular literature to report, which is what prompted the verification above. The report is committed under its original filename because that is the run that happened; the entry it informed carries a different name.

    Pathograph: five nodes from TEX11 loss of function through asynapsis with reduced crossover formation to two separate points of germ cell loss, pachytene checkpoint apoptosis for spermatocytes with asynapsed autosomes and meiosis I nondisjunction for those that escape it, converging on spermatogenic arrest at meiosis I. The two-point loss is curated as two nodes rather than one because the source distinguishes them explicitly and it is what makes the histology mixed rather than a uniform block. Conformance declared to three nodes of meiotic_prophase_failure; deliberately not to the ovarian follicle depletion node or the somatic DNA repair and cancer predisposition node, since TEX11 is male-restricted and meiosis-specific with no reported somatic phenotype.

    Mouse evidence graded MODEL_ORGANISM with directness INDIRECT throughout. One evidence item is graded REFUTE: three human TEX11 missense alleles were modelled in transgenic mice and two were non-causative, which refutes the general proposition that a missense variant in this gene is pathogenic by virtue of being in it. That result is also the basis for a HUMAN_MODEL_MISMATCH discussion, since the mouse is currently the only functional assay applied to these variants and nothing establishes that murine spermatogenesis has the same tolerance for a given substitution as human spermatogenesis.

    Genetic section carries three case_fractions with their cohorts rather than a population prevalence, because every figure available is a share of a clinical cohort and not a population rate.

    The treatment modelled is a negative one: withholding or not repeating testicular sperm extraction, on the basis that TEX11 is one of only three genes with enough reported retrieval-negative cases to act on. This is an unusual shape for a treatment entry and is the clinically actionable part of the diagnosis.

    Also added TEX11-related spermatogenic failure to kb/groupings/Meiotic_Gametogenic_Failure.yaml, and fixed that grouping's description, which opened by calling the group autosomal recessive. TEX11 is X-linked, and SYCP3 is a dominant-negative heterozygous counterexample already sitting outside the members list, so the inheritance claim was wrong before this entry as well. The description now states that inheritance is autosomal recessive for most members but is not a membership criterion. just check-groupings reports TEX11 SATISFIED on the necessary-and-sufficient criterion.

    Deleted stubs/X-linked_Spermatogenic_Failure_1.yaml. SPGFX1 has no mapped gene and no established molecular mechanism, so there is no pathograph for dismech to carry; it is not curatable as a mechanism entry until a gene is found. This is recorded in the new entry's notes so the concept is not re-nominated as a single-gene disease.

    Not done: no separate entry for SPGFX1 itself, and no MONDO ticket, although the SPGFX1 and SPGFX2 naming is a genuine trap worth reporting upstream.

    Validation: just validate, just validate-terms, just count-verified-snippets (17/17 verified), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just check-stubs, just validate-grouping and just check-groupings all pass.

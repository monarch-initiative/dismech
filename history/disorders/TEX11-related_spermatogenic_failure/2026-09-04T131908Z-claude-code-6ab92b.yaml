  summary: 'Address review on PR #10921: diagnosis, histopathology, animal model,
    treatments, report rename'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10921. Six of the seven flagged items are closed by adding content; the seventh is closed by explaining an omission rather than filling it.

    1. Diagnosis block added: karyotype with Y-chromosome AZF microdeletion analysis as the two exclusions that precede gene-level testing, testicular biopsy, and TEX11 sequencing on a non-obstructive azoospermia panel. The sequencing step records that copy-number analysis belongs alongside sequencing, because the recurrent multi-exon deletion was found by array comparative genomic hybridisation and exon sequencing alone would miss it.

    2. Histopathology block added, which the reviewer correctly identified as the intellectual centre of the entry sitting only in prose. Meiotic arrest with germ cells present, with notes recording that focal Sertoli-cell-only tubules can coexist in the same biopsy and that such a report therefore does not exclude the diagnosis. The mixed pattern is tied back to the mechanism rather than left as an observation: spermatocytes whose only asynapsed chromosomes are the sex chromosomes escape the pachytene checkpoint and are lost later, so tubules arrest at different points. A second family's biopsy report was fetched (PMID:29661171) so the histology rests on two independent series rather than one.

    3. Elevated FSH is the one item not filled, and the reason is recorded rather than left implicit. The reviewer was right that the entry's own description asserted a hormone profile it did not model. Rather than bind HP:0008232 to a source that does not state it, the description was rewritten to attribute the profile to primary testicular failure generally rather than to TEX11 specifically, and a notes paragraph records that none of the cached sources states it for this disease, that a targeted PubMed search for one returned nothing quotable, and that binding the term would need a reference fetched for that purpose. Fixing the unsupported assertion was the more important half of this item.

    4. Animal models block added for the Tex11-null mouse, with two modeled_mechanisms links against the asynapsis node and the pachytene checkpoint node, both RECAPITULATES with fidelity HIGH, model_scale CELLULAR, and limitations recording that the mechanism is established in mouse and inferred for human spermatocytes. The link-level evidence for treating the model as informative is taken from the human founding series rather than from the model's own authors. This gives the existing HUMAN_MODEL_MISMATCH discussion a model object to be about, which was the reviewer's point.

    5. Treatments: genetic counselling added, with the reason it matters here rather than as boilerplate. Because the allele is X-linked, a daughter conceived through assisted reproduction using the father's retrieved sperm is an obligate carrier, so transmission is a foreseeable consequence of the treatment rather than an incidental family finding. Micro-TESE with ICSI was not added as a separate treatment: the entry's existing treatment already models the retrieval decision, and the cached source states that sperm were recovered in none of 17 TEX11 patients, so curating ICSI as standard care for this disease would assert something the source contradicts.

    6. treatment_term changed from NCIT:C15329 Surgical Procedure to NCIT:C94427 Sperm Retrieval. A notes line was added recording that therapeutic_modality SURGERY here tags the intervention being withheld rather than one administered, which the reviewer flagged as misparseable.

    7. Research report renamed with git mv from X-linked_Spermatogenic_Failure_1-deep-research-claude_code.md to TEX11-related_spermatogenic_failure-deep-research-claude_code.md, with its citations sidecar. Verified the reviewer's diagnosis directly against src/dismech/render.py, which globs research/<disorder_slug>-deep-research-*.md, so the pre-correction filename would have left the report invisible on the disorder page. This was a real defect introduced by the mid-curation retarget and would not have been caught by any gate.

    Suggestions also taken: the TESE snippet was replaced with the Discussion sentence stating that sperm were not recovered in any of 17 TEX11 patients, which is a finding, in place of the LIMITATIONS sentence previously quoted, which was a caveat about the study; the weaker sentence is retained as a second evidence item rather than discarded. GO:0007130 synaptonemal complex assembly added alongside GO:0007129 on the asynapsis node for tighter alignment with the module node it conforms to.

    Suggestions not taken: oligozoospermia and decreased testicular size were left out because no cached source for this entry states either, and adding them would repeat the mistake item 3 was about. No prevalence block, since the three case_fractions already carry the gene-share question and every available figure is a cohort share rather than a population rate.

    Validation: just validate, just validate-terms, just count-verified-snippets (28/28 verified, up from 17/17), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values and just check-groupings (TEX11 SATISFIED) all pass.

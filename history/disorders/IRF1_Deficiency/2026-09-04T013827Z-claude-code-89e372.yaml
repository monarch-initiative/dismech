  summary: 'Create: IRF1 Deficiency (immunodeficiency 117)'
  details: |
    New Disease entry for MONDO:0958011 (immunodeficiency 117), curated as IRF1 Deficiency - an MSMD etiology described in 2023.

    Deep research: 'just research-disorder claude_code IRF1_Deficiency' (report committed). Its validation set needs_review, and one flagged item is directly relevant: the report misquoted the central Rosain et al sentence as 'IRF1-deficient mononuclear macrophages do not control mycobacteria or related intramacrophagic pathogens normally in response to IFN-gamma', where the paper reads 'IRF1-deficient mononuclear phagocytes do not control mycobacteria and related pathogens normally when stimulated with IFN-gamma'. This entry uses the correct wording, taken from the cached abstract rather than from the report. Six terms the report named after a different ontology term (HP:0100646, HP:0410030, HP:0002960, GO:0000785, UBERON:0002370, NCIT:C1666 - the last reported as 'Interferon Gamma' but actually Tyrphostin A30) are not bound in this entry.

    GeneReviews baseline: searched PubMed for 'IRF1 GeneReviews[All Fields]'; no chapter exists. Phenotypes come from the primary description plus two MSMD reviews.

    Naming: the KB carries both conventions for these entities - gene-named (STAT2_Deficiency) and MONDO-label-named (Immunodeficiency_86, _88, _69). This entry uses the gene-named form, matching STAT2_Deficiency as the closest analogue on the same interferon axis, and records 'immunodeficiency 117' and IMD117 as synonyms so the numeric form still resolves. Flagged in the PR for a reviewer who prefers the other convention.

    Mechanism is curated as a chain: IRF1 Loss of Function -> Failure of the IFN-gamma-Induced Transcriptional Programme -> Loss of Macrophage Antimycobacterial Effector Function -> BCGosis / Non-tuberculous mycobacterial infection.

    Recorded as a CANONICAL mechanistic hypothesis (irf1_interferon_arm_asymmetry): IRF1 is induced by both interferon types yet is essential only for the IFN-gamma arm. CANONICAL rather than EMERGING because the antiviral negative is experimentally demonstrated across nine viruses in patient fibroblasts, not merely unobserved clinically.

    Treatment reasoning worth noting: recombinant IFN-gamma is deliberately NOT listed. It benefits MSMD patients whose defect is impaired IFN-gamma production; IRF1 sits downstream of the receptor, so supplying more cytokine has no route to restore the missing transcriptional response. That reasoning is recorded in the HSCT treatment's notes so it is not silently re-added.

    Scope note: 'Unusual Salmonella infection' is cited from an MSMD-wide review ('about half of them might develop non-typhoidal salmonellosis'); the phenotype description says explicitly that this is a group-level figure and that the published IRF1 cohort is too small to establish its frequency in this etiology.

    Validation: 'just validate' passed with 18/18 snippets verified; 'just validate-terms' passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean. Two references fetched and committed (PMID:36736301, PMID:36867972); PMID:38025345 was already cached on main and is cited unmodified. Incidental references fetched by the deep-research validator but not cited here were removed from the diff. An initial draft used a mechanistic_hypotheses status of ESTABLISHED, which is not in the enum; both the value and the prose that named it were corrected to CANONICAL.

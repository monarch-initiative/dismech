  summary: Address PR review on IRF1 Deficiency (#10830)
  details: |
    Addressed all six IMPORTANT findings and four of six suggestions from the ai4c-reviewer CHANGES_REQUESTED review on PR #10830. All additions come from the already-committed references_cache/PMID_36736301.md full text; no new references were fetched.

    I1 (no structured variant data): added Genetic.variants records for c.385C>T (p.R129*) in P1 and c.103C>T (p.Q35*) in P2, each clinical_significance PATHOGENIC, type nonsense, with consanguinity evidence and, for P1, the immunoblot showing no truncated protein. Note the reviewer suggested genetic_context with functional_impact_category; that slot does not exist on Genetic (the slot is variants, range Variant, which has no zygosity or functional_impact_category). Homozygosity and complete loss of function are carried in the variant descriptions and evidence instead, and Genetic.variant_origin GERMLINE is set at the section level.

    I2 (antimycobacterial pharmacotherapy missing): added a Broad-Spectrum Antimycobacterial Pharmacotherapy treatment with a target_mechanisms link to Non-tuberculous mycobacterial infection, quoting both that both patients received the drugs and that disease recurred on them.

    I3 (phenotype evidence strength inverted): added Unusual Histoplasma capsulatum infection (HP:0032256), observed in P1, with both the intramacrophagic-fungus rationale and the IL-12p70 route the authors propose. Kept Unusual Salmonella infection but its description now states explicitly that it is group-level and was not observed in either IRF1 patient.

    I4 (Salmonella orphaned): added downstream edges from Loss of Macrophage Antimycobacterial Effector Function to both Unusual Salmonella infection and the new histoplasmosis phenotype.

    I5 (prevalence snippet does not support the claim): replaced it. The CASES_IN_LITERATURE record now cites 'We studied two unrelated children, P1 and P2.' A second, separate prevalence record carries the MSMD group-level figure (POINT_PREVALENCE, BELOW_1_IN_1000000, rate_per_100000 0.1) with notes scoping it explicitly to MSMD as a whole rather than to IRF1 deficiency.

    I6 (no diagnosis block): added two entries - whole-exome sequencing, and IRF1 protein detection with preserved upstream STAT1 phosphorylation, which is the result that localises the lesion below the receptor and below STAT1 and so separates this from the defects it phenocopies.

    S1 taken: rebound the mononuclear phagocyte cell type from CL:0000235 (macrophage) to CL:0000113 (mononuclear phagocyte), the exact match.
    S2 taken: dropped GO:0060333 type II interferon-mediated signaling, which sat in tension with the node's own description that IFN-gamma signals normally through an intact receptor. GO:0071346 cellular response to type II interferon is retained.
    S5 taken: recorded in the HSCT treatment notes that P1 was in fact receiving recombinant IFN-gamma and mycobacterial disease recurred anyway, so a future editor does not reverse the exclusion without the argument. The clinical course supports the mechanistic reasoning rather than contradicting it.
    S6 taken: reviewer confirmed keeping IRF1_Deficiency as the entry name; no change needed.
    S3 not taken: Irf1-/- mouse data and the candidate stromal IL-15 HUMAN_MODEL_MISMATCH would need the mouse-specific claims verified against quotable text, which was not done in this round; left for a follow-up rather than added on a thin basis.
    S4 not taken: GEO GSE216489 would need 'just verify-datasets' to confirm relevance, not merely existence, before being added.

    Connectivity after changes: the pathograph went from leaving Unusual Salmonella infection orphaned to a fully connected graph - 13 nodes, 11 edges, zero isolated nodes.

    Validation after changes: 'just validate' passes with 32/32 snippets verified (up from 18/18); 'just validate-terms' passes; 'just validate-disorders' passes; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean.

  summary: 'Create: Familial Visceral Neuropathy 2 (ERBB2)'
  details: |
    De-novo curation of familial visceral neuropathy 2 (MONDO:0030399) resolving curation claim #10294. The first draft attributed this concept to ERBB3; it is ERBB2. The two familial visceral neuropathy concepts run opposite to the gene numbering - VSCN1/OMIM:243180 is ERBB3 and VSCN2/OMIM:619465 is ERBB2 - and the stub carried no genes block to contradict the assumption. The OpenScientist deep-research run flagged it and the correction was then verified independently against MedGen gene-disease links (VSCN2 -> Gene 2064 ERBB2; VSCN1 -> Gene 2065 ERBB3) rather than accepted from the report. A correction comment was posted on the claim issue. Second precision point: the defining paper (PMID:33497358) reports eight individuals across both genes, so its phenotype list must not be copied wholesale - arthrogryposis with multiple pterygiums and intrauterine growth retardation belong to the ERBB3 fetuses of families F3 and F4. Only what family F5 was reported to have is curated: severe constipation easing after age five, short-segment Hirschsprung disease in the brother, axonal peripheral neuropathy, ptosis, sensorineural hearing loss and clubfeet. The mechanism is a kinase defect - ERBB3 binds NRG1 but is catalytically weak, ERBB2 has no ligand but supplies the kinase - and the homozygous p.Ala710Val kinase-domain variant drastically reduces phosphorylation of both receptors. The conditional ErbB3 mouse is linked as PARTIALLY_RECAPITULATES rather than RECAPITULATES because it targets the partner receptor, not the disease gene. Deep research: one OpenScientist run, committed, 5/5 references resolved and on topic; note two of its suggested NCIT bindings are badly wrong (NCIT:C157763 offered as surgical procedure is a bladder carcinoma term; NCIT:C1516 offered as supportive care is Lisofylline), which its own term validation flags - this entry binds no NCIT terms. Validated with just validate (22/22 snippets verified), just validate-terms, check-entity-refs and the snippet/folded-hyphen gates.

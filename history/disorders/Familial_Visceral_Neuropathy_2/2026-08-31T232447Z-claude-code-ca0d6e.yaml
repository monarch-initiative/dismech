  summary: 'Review fixes: smooth-muscle rescoping, arthrogryposis, treatments'
  details: |
    Three review rounds on PR #10305. Round 1 removed a false claim that arthrogryposis belonged only to the ERBB3 fetuses (Table 1 of PMID:33497358 scores it positive in both ERBB2 siblings), rescoped the CIPO framing, and connected all six phenotypes to the pathograph with bare-name downstream targets. Round 2 retracted the intestinal smooth muscle abnormality as an ERBB2 finding: Table 1 marks that row NA for both ERBB2 patients and positive only in an ERBB3 patient, so the cohort-wide abstract sentence does not license a gene-scoped claim. The CL:0002504 enteric smooth muscle cell annotation was dropped and the gut-histopathology diagnosis rescoped with the extrapolation named as such. Round 2 also consumed PMID:33720042 for the ERBB2-specific enteric progenitor expression and PMID:9338783 for the Schwann-cell-precursor step, refined GO:0038127 to GO:0038133 and CL:0011012 to CL:0000333, and added surgical management and genetic counselling treatments. Arthrogryposis was then curated with a SUPPORT plus REFUTE pair because the source contradicts itself: Table 1 scores it positive for both ERBB2 siblings while the prose assigns it to the three fetuses. Round 3 finished the smooth-muscle retraction in the three prose slots that still asserted it (top-level description, mechanistic hypothesis description, discussion rationale), lengthened a line-fragment snippet to the full sentence covering the nerve-fibre hyperplasia and the colon resection specimen, and corrected a stale note claiming the entry binds no NCIT terms. Validated with just validate (29/29 snippets), validate-terms, check-entity-refs, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading.

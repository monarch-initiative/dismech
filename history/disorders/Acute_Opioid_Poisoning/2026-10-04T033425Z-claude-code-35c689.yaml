  summary: 'Create: Acute Opioid Poisoning'
  details: |
    New entry for the acute opioid poisoning toxidrome (MONDO:0018173), curated de novo after confirming no KB entry, stub, or claim issue, and distinct from the chronic Opioid_Use_Disorder entry (MONDO:0005530). Deep research via claude_code provider (lead-only, 4 refs verified, no needs_review); all snippets taken from freshly fetched caches. Models the mu-opioid receptor cascade: systemic opioid exposure -> central mu-opioid receptor overactivation (Gi-coupled, adenylate cyclase inhibition) -> brainstem respiratory center suppression (pre-Botzinger), cortical/thalamic arousal suppression, Edinger-Westphal parasympathetic pupillary constriction, and reduced GI motility -> seven causally wired phenotypes (respiratory depression, depressed consciousness, miosis, constipation, respiratory arrest, noncardiogenic pulmonary edema, hypothermia), all 7 connected. Four differential diagnoses per the user request: clonidine/imidazoline toxicity (the classic mimic, PMID:41292070), sedative-hypnotic toxidrome (respiratory depression absent, Boyer), cholinergic/organophosphate poisoning (MONDO:0800386-bound, miosis plus cholinergic excess, PMID:32626615), and pontine hemorrhage (structural mimic with focal signs, PMID:31246723). Treatments: naloxone (competitive MOR antagonist, target_mechanisms wired) and assisted ventilation. Evidence anchored on Boyer NEJM 2012 full-text review (PMID:22784117), Montandon OIRD review (PMID:35965031), and the DDx sources. 25/25 snippets verified; all terms validated; full offline gate suite green.

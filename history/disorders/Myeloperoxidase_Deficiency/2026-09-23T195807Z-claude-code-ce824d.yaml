  details: |
    New entry for hereditary myeloperoxidase deficiency (MONDO:0009694, MPO), replacing stub stubs/Myeloperoxidase_Deficiency.yaml (claim issue #12618). The pathograph runs from MPO pathogenic variants through defective precursor maturation (ER retention and proteasomal degradation) to loss of neutrophil and monocyte MPO activity, then branches to impaired hypochlorous acid generation, failed NET formation and a compensatory respiratory-burst node; the first two converge on impaired candidacidal activity, which a hyperglycemia node (diabetes as the main clinical modifier) also feeds. 8 pathophysiology nodes, 7 phenotypes (all causally connected), 49 evidence items citing 26 PubMed records, all snippets verified against abstracts. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER); the StatPearls chapter PMID:29262241 is cited and tagged. One OpenScientist report was used: research/Myeloperoxidase_Deficiency-deep-research-openscientist.md. Its generation run exited non-zero because the report's term-validation step timed out against OLS (5 s read timeout); the report body and artifacts were written. Reference validation was then added with just validate-research-reference (19/19 resolved, 0 unresolved, 0 off topic) and term validation with the research term validator using local sqlite MONDO/HP adapters (25/27 resolved, 0 unresolved). Its HPO and NCIT suggestions that term validation flagged as naming different terms (for example NCIT:C305, NCIT:C1471, NCIT:C1505, HP:0200037) were not used; all bindings came from separate OLS and local OAK lookups. The report's statement that the DHR assay is normal in MPO deficiency (citing PMID:7813334) was not used because PMID:17384005 and PMID:27301573 show complete MPO deficiency gives a strongly reduced DHR signal. just preflight-dr returned PASS. Validation: just validate-disorders passed (schema, terms, 49/49 snippets); check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles all OK; list-gene-term-mismatches found no mismatch; list-disconnected-phenotypes reports 7/7 phenotypes connected.

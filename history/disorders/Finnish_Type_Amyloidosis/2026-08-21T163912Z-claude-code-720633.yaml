  summary: 'Create: Finnish Type Amyloidosis (GSN / AGel)'
  details: |
    New entry for hereditary gelsolin amyloidosis (MONDO:0007097, OMIM 105120), autosomal dominant GSN (hgnc:4620) codon 187 variants. Deep research: claude_code provider; report resolved 36/36 references with confabulation_rate 0.0 but carried needs_review true because the relevance pass flagged PMID:33375500 as off topic - that paper is 'Standoff Distance in Ultrasonic Pulsating Water Jet', genuinely unrelated, and is cited three times in the report body. It is not cited in this entry and the caveat is recorded in notes. Reference set assembled by direct PubMed search rather than from the report. GeneReviews baseline checked and found ABSENT: zero results for both GSN and gelsolin amyloidosis in GeneReviews. Five pathophysiology nodes tracing the distinctive two-compartment mechanism: a domain-2 calcium-binding variant lets the domain unfold, unfolding exposes a cryptic furin site cleaved in the Golgi, a second extracellular cleavage releases the 8 and 5 kDa fragments, and those deposit systemically. Three conforms_to links into the amyloidogenesis module, all anchors verified against kb/modules/amyloidogenesis.yaml; the proteolysis node is deliberately mapped onto the module's generic precursor node because in this disease the precursor is manufactured by host proteases rather than being the intact variant protein. The gelsolin loss-of-function question is curated as PARTIAL evidence with the open question stated, rather than asserted. A KNOWLEDGE_GAP records that nothing in the mechanism explains the cornea-nerve-skin tropism. No frequency bands assigned: the largest cited series is 29 patients selected for having had facial corrective surgery, an ascertainment that would inflate any facial-palsy frequency drawn from it. Adding this disease to the existing Hereditary_Systemic_Amyloidoses grouping, which names it as an intended member, is deliberately left as a separate change. Validated: just validate passed; just validate-terms passed; count-verified-snippets 18/18; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

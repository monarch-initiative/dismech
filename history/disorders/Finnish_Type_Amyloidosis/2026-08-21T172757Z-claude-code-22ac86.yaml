  summary: 'Correct contradicted stabilisation claim; refresh stale abstract-only
    claims; add D187N mouse (PR #9186 review)'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #9186. Everything used was already in references_cache in this PR; no new references fetched.

    CRITICAL - the headline therapeutic claim contradicted its own cited source. The ATTRv differential asserted that "TTR stabilisation has no analogue here, because the species that deposits does not exist until after the protein has been cut", with a matching distinguishing_feature saying precursor-stabilising drugs do not apply. PMID:22360545 argues the opposite: it proposes a pharmacologic chaperone or kinetic stabiliser for the second domain of D187N/Y plasma gelsolin in the secretory pathway, and cites the transthyretin/tafamidis programme as the precedent. Rewrote the differential description and the distinguishing_feature so the claim is what the source supports - the stabilisation target relocates to the uncleaved precursor upstream of furin rather than disappearing - and added the stabiliser sentence as its own evidence item, with an explanation recording that the naive reading of the fragment mechanism is exactly what it rules out.

    IMPORTANT - three claims were stale against a cache holding full PMC text rather than only the abstract.

    First, the tissue-tropism KNOWLEDGE_GAP opened "Nothing in the mechanism explains the distribution", but the cached text gives the local-synthesis hypothesis with transgenic-mouse support: amyloidogenesis occurs only in tissues synthesising human D187N gelsolin despite circulating C68. Rewrote the rationale so the gap is what it actually is - whether the mouse finding generalises to the human cornea-nerve-skin triad - and attached that sentence as evidence on the discussion.

    Second, the proposed experiment treated the second protease as unidentified. MT1-MMP is named in the cached text as the protease performing that cleavage, at least in HT1080 cells, with the caveat that other extracellular proteases may contribute. Rewrote the experiment to separate two measurable things - local GSN synthesis and second-step protease activity across the same tissues - and recorded why the mouse cannot settle tropism on its own, since its muscle-specific promoter imposes the tissue distribution rather than discovering it.

    Third, the genetic section left loss of function open. The cached text closes it three ways: FAF appears to be caused by a gain-of-toxic function; gelsolin knockout mice develop and live normally with only a mild bleeding-time and cell-motility phenotype; and D187N homozygotes have earlier, more severe disease but no loss-of-function symptoms. Rewrote the association to state the gain-of-toxic-function conclusion and narrow the residual uncertainty to whether local gelsolin dysfunction modulates severity, and added two evidence items.

    IMPORTANT - added the missing animal_models entry for the D187N transgenic mouse, which appeared in the cached references but nowhere in the entry. It carries two ModelMechanismLinks: RECAPITULATES with HIGH fidelity against the two-step proteolysis node, and PARTIALLY_RECAPITULATES with MODERATE fidelity against systemic deposition, since deposition is confined to transgene-expressing tissue and the mice additionally develop an inclusion-body-myositis-like intracellular phenotype not established in patients. The deposition link carries a readout with its own evidence.

    Not addressed, and left for the author: the phenotype expansion from PMID:26422119 (trigeminal, oculomotor, hypoglossal, vestibulocochlear, plus renal, autonomic, bulbar, corneal-erosion and cardiac-conduction findings) and the genetic depth items (penetrance, zygosity as severity modifier, variant spectrum). Both are substantial additive curation rather than corrections of a wrong claim.

    Validation run. just validate: schema, term and reference validation all passed, 0 issues. just count-verified-snippets: 25/25 verified against cached references. just check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence: all OK, no new findings. pytest tests/test_data.py -k "model_readout_targets_match_link or failure_to_recapitulate": 4485 passed.

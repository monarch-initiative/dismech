  summary: 'Review round 3: the clinical layer the mechanism was missing'
  details: |
    Third review round on PR #9186. Two blocking items, both verified against references_cache/PMID_22360545.md before acting rather than taken on the reviewer's word.

    Item A2 - five phenotype families above threshold. Added Decreased Corneal Reflex (HP:0008000), Bulbar Dysfunction (HP:0001283), Autonomic Dysfunction with Orthostatic Hypotension (HP:0001278), Proteinuria (HP:0000093, two evidence items covering the heterozygous and homozygous renal courses) and Cardiac Conduction Abnormality (HP:0031546). All six new snippets are verbatim from the cached full text; no new literature search was needed.

    The sharpest finding was one the reviewer named precisely: the entry's own description asserted 'renal involvement following' with no phenotype and no evidence item anywhere behind it. That is the same defect - an assertion the committed sources were never asked to support - that this batch has hit repeatedly. It now has a curated phenotype and two quotes.

    Item B2 - Inheritance.penetrance was empty while the source states complete penetrance outright. Set penetrance: COMPLETE. Separately, genetic.association described homozygotes as having 'earlier and more severe disease'; the source is harder than that - nephrotic syndrome and end-stage renal failure is a different renal course, not a shifted one - so the wording now says so.

    Also strengthened the frequency-bands note ahead of being asked: the founding review says outright that per-symptom frequencies are unknown, which is a better general licence for omitting bands than the ascertainment argument that only covered facial palsy. Added the mortality drivers to notes, which had no home in the entry despite the description calling the course relentless.

    Validation: just validate passed with 34/34 snippets verified (up from 28), just validate-terms passed, check-duplicate-keys OK, and the folded-hyphen, snippet-length and title-snippet ratchets all report no new findings.

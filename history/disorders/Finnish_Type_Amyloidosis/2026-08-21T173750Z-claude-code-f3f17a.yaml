  details: |
    Completes the ai4c-reviewer review of PR 9186 on top of commit 4d9eaa67c, which ai4c-agent[bot] pushed to this branch and which I adopted rather than re-pushing my own version. I independently verified the CRITICAL finding against references_cache/PMID_22360545.md before accepting it: my original claim that TTR-style precursor stabilisation has no analogue in AGel amyloidosis was contradicted by the very review I cited for it, which proposes a pharmacologic chaperone or kinetic stabiliser binding full-length D187N gelsolin in the secretory pathway to keep G2 folded and prevent the furin cleavage, and explicitly cites the tafamidis programme as precedent. The error came from mining only the abstract of a cache holding full PMC text. The bot's replacement states the position correctly - the stabilisation target relocates upstream rather than being abolished - and is better than what I would have written, so it stands unchanged. Also verified in the same cache and now reflected: MT1-MMP is named as able to perform the second cleavage, so the earlier possibly-an-MMP hedge was stale. Remaining items I addressed in this commit: added a Multiple Cranial Neuropathy phenotype curating the PMID:26422119 results, which had been cited three times for one triad sentence while its actual findings went unused - all 29 patients with facial and trigeminal dysfunction, two-thirds oculomotor and hypoglossal, half vestibulocochlear; and added complete penetrance to the genetic association with its own evidence item. Deliberately did NOT assign frequency bands from those proportions, and said why in the phenotype description: the cohort was assembled from patients undergoing facial corrective surgery, so it is selected for severe facial involvement and its cranial-nerve proportions are not disease-wide frequencies. Attempted a penetrance slot on Genetic and removed it after schema validation rejected it; the claim is carried by prose and evidence instead. Snippets rose from 18/18 to 28/28. Validated: just validate passed; just validate-terms passed; count-verified-snippets 28/28; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

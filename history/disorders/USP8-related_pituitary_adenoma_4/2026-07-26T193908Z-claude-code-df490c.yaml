  summary: 'Review: USP8-related pituitary adenoma 4'
  details: |
    Manual correctness review of claim-evidence matching and ontology bindings.

    Evidence that does not support its claim:
    - Pathophysiology node 'Increased corticotropin secretion' and phenotype 'ACTH
      excess' both rested on the background sentence "Cushing's disease is caused by
      corticotroph adenomas of the pituitary", which never mentions ACTH or any
      increase. Repointed the node to PMID:25675982 (ACTH secretion by resected
      USP8-mutant tumor cells falls on USP8 knockdown or EGFR blockade) and the
      phenotype to PMID:28529722 (hypercortisolism driven by ACTH over-secretion);
      the background sentence is retained as PARTIAL on the node for disease context.
    - Phenotype 'Hypercortisolism' snippet elided 'adrenocorticotropic hormone (' from
      the source, making it a modified rather than exact quote. Corrected.

    Ontology bindings:
    - 'ACTH excess' was bound to HP:0011043 Abnormal circulating adrenocorticotropin
      concentration, a directionless parent, for a claim of excess. Rebound to
      HP:0003154 Increased circulating ACTH level.
    - 'Hypercortisolism' was bound to HP:0003117 Abnormal circulating hormone
      concentration. Rebound to HP:0011744 Secondary hypercortisolism, whose HPO
      definition is exactly ACTH-driven hypercortisolism.
    - 'Glucose intolerance' was bound to HP:0003074 Hyperglycemia with the stated
      rationale that HPO lacks a narrower term. HP:0001952 Glucose intolerance exists
      and matches the source wording exactly; rebound and corrected the explanation.

    All snippets re-verified as exact substrings of references_cache; linkml-validate,
    term validation, and graph edge-target validation pass.

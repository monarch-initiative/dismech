  summary: 'Review: Pemphigus vulgaris - reconcile implausible Orphanet frequency
    bands'
  details: |
    Several phenotype frequency bands were transcribed wholesale from ORPHA:704 without clinical reconciliation. Verified each row against the cached Orphanet record: the transcriptions are faithful, so the defect is uncritical import. Removed the VERY_FREQUENT band from Atypical Scarring of Skin, since PV is an intraepidermal blistering disease that characteristically heals without scarring - absence of scarring discriminates it from subepidermal bullous diseases - and documented the discrepancy. Removed the band from Urticaria, where the same Orphanet record annotates Urticaria as very frequent and Urticarial plaque as very rare; both cannot be correct. Removed the band from Recurrent Cutaneous Abscess Formation and from Feeding Difficulties in Infancy, the latter a neonatal-pemphigus feature that was asserted unscoped at the disease level for an adult-onset disease. Raised Anti-Desmoglein-3 Antibody Positivity from FREQUENT to VERY_FREQUENT on the 97 percent ELISA sensitivity already cited in the entry, which contradicted the Orphanet band. Removed a Pain evidence item whose snippet was a methods fragment naming a visual analogue scale. Normalized category Dermatologic to Dermatological. Orphanet rows retained as provenance with PARTIAL support. Validated: schema, terms, references all pass.

  summary: 'Gene-family review: MT-TE; TRMU and EARS2 added as modifiers'
  details: |
    The MT-TE node binds the tRNA's molecular function, triplet codon-amino acid adaptor activity (GO:0030533), DECREASED, supported by the existing Northern blot evidence of reduced steady-state tRNA-Glu (PMID:21194154). The MT-TE inheritance block gains its HP:0001427 binding. Two nuclear modifiers are added as MODIFIER records: TRMU, whose down-regulation lowers 2-thiouridylation and worsens the m.14674 translation defect (PMID:23814040), and EARS2, the mitochondrial glutamyl-tRNA synthetase, whose heterozygous variants accompany the homoplasmic variant in reported patients (PMID:42724182, a 2026 review of 55 cases in which 24 carried nuclear modifiers, EARS2 in 9 and TRMU in 6). Neither modifier is wired to a mechanism node.

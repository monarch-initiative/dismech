  details: |
    Genetics pass for the d2g wiring campaign (issue #12207, epic #12189).

    Research first: the offline Bookshelf index (cache/bookshelf/genereviews.csv,
    2026-09-10 snapshot, 958 chapters) has no GeneReviews chapter for ZC4H2,
    Wieacker-Wolff syndrome, or ZC4H2-associated rare disorder, so there is no
    GeneReviews baseline to take for this disease; ORPHA:3454 and the primary
    literature already cited were used instead. ClinGen classifies ZC4H2 against
    X-linked syndromic intellectual disability (MONDO:0020119) as Definitive,
    X-linked. ZC4H2 was already the sole curated gene, already wired to its
    pathophysiology node, and the two-arm subtype split was already correct.

    Changes:
    - Bound ZC4H2 (hgnc:24931) on both has_subtypes rows. MONDO records ZC4H2 for
      both MONDO:0010758 and MONDO:0026762, and the two children are separated by
      inheritance and variant class rather than by gene, which the descriptor
      descriptions now say.
    - Added a disease-level inheritance block bound to HP:0001417 X-linked
      inheritance. The entry had no disease-level inheritance at all; the two
      subtype rows already carried HP:0001419 X-linked recessive and HP:0001423
      X-linked dominant respectively. The spectrum-level term is the correct one
      for the umbrella precisely because binding either child's mode there would
      assert it of the other, and the block's description says so.

    MONDO reconciliation: MONDO:0010758 ZC4H2 and MONDO:0026762 ZC4H2 are both
    present and now bound on their subtype rows.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (93/93), just list-gene-term-mismatches, and the offline gates all pass.

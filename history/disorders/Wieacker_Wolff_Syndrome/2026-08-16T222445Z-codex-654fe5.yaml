  summary: Repair PR 8667 disease identity and subtype model
  details: |
    Exact-head audit repair for draft PR #8667. Retargeted the disease root from the classic X-linked recessive child MONDO:0010758 to the shared Wieacker-Wolff syndrome spectrum MONDO:0025445, and modeled the two direct MONDO children as sibling subtypes: classic X-linked recessive Wieacker-Wolff syndrome (MONDO:0010758; OMIM:314580) and female-restricted X-linked dominant Wieacker-Wolff syndrome (MONDO:0026762; OMIM:301041). Moved inheritance assertions into their respective subtype records, bounded Orphanet prevalence/onset/frequency scope to the classic arm, and recorded that pooled ZARD cohort claims remain spectrum-level while arm-specific claims remain qualified. The local MONDO SQLite authority confirmed both child relationships, labels, and xrefs. The required term-cache rows were generated only by just validate-terms; no reference cache was edited.

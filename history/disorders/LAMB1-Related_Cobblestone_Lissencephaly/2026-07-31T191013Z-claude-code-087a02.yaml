  summary: 'Create: LAMB1-Related Cobblestone Lissencephaly'
  details: |
    De-novo curation of LAMB1-related cobblestone lissencephaly / lissencephaly type 5, MONDO:0014077, OMIM 615191: autosomal-recessive cobblestone type II lissencephaly from biallelic LAMB1 laminin subunit beta-1 loss of function. Deep-research providers: Edison/falcon requested first but blocked by provider-side errors, 402 Payment Required then auth failure after key update; openscientist attempted twice but the backend returned 522 during status polling; claude_code used as working fallback. Curation grounded in independently-verified primary PubMed literature. Mechanism modeled as a three-node chain, pial basement membrane laminin deficiency to neuronal overmigration through the pial surface to cobblestone cortical malformation, each conforming to the pial_basement_membrane_radial_glial_endfoot_failure module. Phenotypes include type II lissencephaly, cerebellar dysplasia, brainstem hypoplasia, occipital encephalocele, abnormal cerebral white matter, hydrocephalus, seizures, global developmental delay, cerebellar cysts, corpus callosum hypoplasia, plus the defining absence of muscular involvement versus alpha-dystroglycanopathies, and ULTRA_RARE prevalence with about 11 patients reported. Anchor PMID:23472759; phenotype-expansion PMIDs 37466007, 29888467, 33542858. Validated with just validate: schema, terms, 20/20 snippets verified. Compliance 94.6 percent global, 96.2 percent weighted. No GeneReviews chapter exists.

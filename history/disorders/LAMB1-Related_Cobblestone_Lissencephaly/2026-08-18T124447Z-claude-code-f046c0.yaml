  details: |
    Added a discussions: block with two entries to the only conformer of the eight cortical-malformation modules that carried no structural gap annotation. gap_lamb1_pial_boundary_human_model_translatability, kind HUMAN_MODEL_MISMATCH: no Lamb1 pial-basement-membrane mouse model exists, so the rodent evidence for this entry's endfoot-detachment and overmigration chain comes from laminin gamma1 PMID:12122064 and Lamb2/Lamc3 PMID:22961762 alleles; the latter is heterozygous-dose-sensitive while human LAMB1 carriers are unaffected PMID:32548278. gap_lamb1_allelic_spectrum_phenotype_determinants, kind KNOWLEDGE_GAP: the biallelic LAMB1 spectrum runs from lethal fetal hydranencephaly PMID:33542858 through cobblestone lissencephaly to adult-onset leukoencephalopathy with no cortical dysgenesis PMID:32548278 on a cohort of about 11 patients PMID:37466007, so the truncating-versus-missense correlation recorded in the entry's genetic notes is not established. Additive only: no pathograph, phenotype, ontology-term, or prose edits. Two new references fetched with just fetch-reference. Validation: just validate schema, term and reference passed with 46/46 snippets verified against cached references; just validate-disorders passed; just check-duplicate-keys and just check-title-snippets clean.

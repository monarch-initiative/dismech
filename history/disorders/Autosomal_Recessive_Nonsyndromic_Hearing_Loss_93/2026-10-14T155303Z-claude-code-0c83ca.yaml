  summary: Bind LOINC audiometry measurements to the existing audiological testing
    row
  details: |
    Added a LOINC-coded pure-tone audiometry measurement set (panel plus 500/1000/2000/4000/8000 Hz per ear) to the existing combined audiological-testing diagnosis row, with a clarifying sentence stating the codes represent the pure-tone audiometric component only, not the tympanometry, otoacoustic emissions, or ABR also described in that row. No reference range is bound: the entry's own phenotype section documents a moderate-to-severe range in most families and a separately reported severe end in one Iranian family, plus two different audiometric configurations (U-shaped mid-frequency, reverse-slope), so a single WHO/GBD better-ear average would not represent the spread. The cited source tests down to 125 Hz; no LOINC code exists below 500 Hz, so the bound set covers 500-8000 Hz. Two new LOINC cache rows (LOINC:89028-5, LOINC:89029-3, the 8000 Hz per-ear codes) were seeded via scripts/seed_loinc_cache.sh after verifying no row for them existed on origin/main.

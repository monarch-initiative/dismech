  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 93 (DFNB93, CABP2)'
  details: |
    De novo curation of DFNB93 from MONDO:0013963. entry_type DISEASE: CABP2 has one phenotype, a conserved single-gene pathograph running from the splice allele through enhanced CaV1.3 inactivation to reduced spiral ganglion firing, and its own OMIM/DFNB identity, so it is not a subtype of Auditory Neuropathy despite belonging to the same mechanistic class. That class membership is asserted in the pathophysiology section with the two publications that state it (PMID:28183797 concluding DFNB93 is an auditory synaptopathy, PMID:40927552 stating the same for the human disease) rather than being left as prose. ClinGen Hearing Loss GCEP rates CABP2-nonsyndromic hearing loss Definitive; recorded as an external_assertion citing the newly generated CGGV cache. Two animal models curated under animal_models with modeled_mechanisms: the Cabp2 LacZ/LacZ single knockout (RECAPITULATES the channel node and the amplification/ABR dissociation) and the Cabp1/Cabp2 double knockout with AAV rescue (RECAPITULATES the exocytosis node, RESCUES the organism node), the latter with an explicit limitation that two genes are removed rather than one. Hearing aids curated with a free-text preferred_term because NCIT has no clinical-action term for hearing-aid fitting, and with both the reported patient benefit and the contradicting class-level statement cited; the tension is recorded as a KNOWLEDGE_GAP rather than resolved. A second KNOWLEDGE_GAP records that progression is asserted only in the mouse. Validated: just validate exit 0, just validate-terms exit 0, count-verified-snippets 42/42.

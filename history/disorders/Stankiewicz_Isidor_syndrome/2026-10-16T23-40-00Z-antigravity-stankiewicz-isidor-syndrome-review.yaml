  summary: Enhanced Stankiewicz-Isidor syndrome entry with classifications, prevalence, progression, inheritance
    penetrance/expressivity, biochemical biomarkers, differential diagnoses, diagnosis, treatments, references,
    ClinGen gene-disease validity, GO cellular/process bindings on PSMD12 haploinsufficiency, expanded
    phenotypes, and coarse phenotype binding bases.
  details: Reviewed kb/disorders/Stankiewicz_Isidor_syndrome.yaml against cached primary and review literature
    (PMID:34906456, PMID:39641441, PMID:39220754, PMID:37256937) and local caches. Added Harrison's chapter
    (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) and mechanistic category (proteotoxic disease) classifications;
    ultra-rare prevalence entry; congenital-to-neonatal onset and late-childhood progression phases; COMPLETE
    penetrance and VARIABLE expressivity on autosomal dominant inheritance; GO cellular component (GO:0000502
    proteasome complex, GO:0022624 proteasome accessory complex) and biological process (GO:0010498 proteasomal
    protein catabolic process) bindings on PSMD12 haploinsufficiency; INDIRECT_UNKNOWN_INTERMEDIATES causal
    link typing on mTORC1/mitophagy remodeling and Type I interferon gene signature downstream phenotype
    edges; ClinGen DEFINITIVE gene-disease validity and CAUSATIVE relationship_type on PSMD12; SOURCE_UNSPECIFIED
    coarse_binding_basis on Abnormality of the skeletal system (HP:0000924) and Abnormality of the kidney
    (HP:0000077); Chilblains (HP:0009710), Oligodontia (HP:0000677), and Cholesteatoma (HP:0009797) phenotypes;
    differential diagnoses (proteosome-associated autoinflammatory syndrome MONDO:0009726, PSMC3-related
    neurodevelopmental disorder, and Aicardi-Goutieres syndrome MONDO:0018866); Type I interferon gene
    signature testing diagnosis (NCIT:C19770); peripheral blood type I interferon signature biochemical
    biomarker; genetic counseling and multidisciplinary supportive care treatments; and top-level reference
    findings.

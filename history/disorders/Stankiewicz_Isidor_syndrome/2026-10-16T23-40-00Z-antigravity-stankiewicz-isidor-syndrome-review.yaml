  details: >-
    Reviewed kb/disorders/Stankiewicz_Isidor_syndrome.yaml against cached primary
    and review literature (PMID:34906456, PMID:39641441, PMID:39220754,
    PMID:37256937) and local caches. Added Harrison's chapter (NEUROLOGIC,
    GENETICS_ENVIRONMENT_DISEASE) and mechanistic category (proteotoxic disease)
    classifications; ultra-rare prevalence entry; congenital onset and late-childhood
    progression phases; GO molecular function (GO:0005198), cellular component
    (GO:0000502), and biological process (GO:0010498) bindings on PSMD12
    haploinsufficiency; ClinGen DEFINITIVE gene-disease validity and CAUSATIVE
    relationship_type on PSMD12; SOURCE_UNSPECIFIED coarse_binding_basis on
    Abnormality of the skeletal system (HP:0000924) and Abnormality of the kidney
    (HP:0000077); differential diagnoses (CANDLE/PRAAS MONDO:0009723 and PSMC3
    neurodevelopmental syndrome MONDO:0030972); peripheral blood type I interferon
    signature biochemical biomarker; genetic counseling and multidisciplinary
    supportive care treatments; and top-level reference findings.

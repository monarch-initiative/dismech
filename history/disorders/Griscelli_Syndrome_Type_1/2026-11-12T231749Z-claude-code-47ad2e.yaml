  summary: 'Create: Griscelli Syndrome Type 1 (MYO5A)'
  details: |
    New entry for MONDO:0008962 (MYO5A), replacing stub stubs/Griscelli_Syndrome_Type_1.yaml. Research: claude_code deep-research report (research/Griscelli_Syndrome_Type_1-deep-research-claude_code.md; preflight-dr PASS; reference validation 33/33 resolved after re-run, the two initially unresolved PMIDs were NCBI 429 transport failures), supplemented by PubMed E-utilities searches. Pathograph: MYO5A loss of function branches into a melanocyte arm (failed myosin Va recruitment to melanosomes, failed peripheral capture, defective transfer to keratinocytes and hair shaft; conforms to lysosome_related_organelle_biogenesis at trigger, positioning and delivery nodes like GS2/GS3) and a separate neuronal arm (loss of neuronal myosin Va; failed smooth ER transport into Purkinje spines; reduced IP3-mediated calcium release; loss of parallel fiber LTD; deficient climbing fiber innervation) converging on Primary Neurological Impairment through edges marked INDIRECT_UNKNOWN_INTERMEDIATES because the neuronal chain is rodent-only. Six discussions: GS1 vs Elejalde nosology (CONTROVERSY), rodent cerebellar mechanism vs human phenotype (HUMAN_MODEL_MISMATCH), exon-F branch point and classification (INTERPRETATION), immune sparing (KNOWLEDGE_GAP), NAP-mouse endosome/mitochondria (EMERGING_HYPOTHESIS), diagnosis without silvery hair (INTERPRETATION). ClinGen Definitive AR copied from the CGGV record. Validation: just validate passes, snippets verified, entity refs and causal targets clean, all 8 phenotypes connected.

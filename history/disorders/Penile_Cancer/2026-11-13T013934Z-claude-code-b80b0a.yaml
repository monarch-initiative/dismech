  summary: Review and enrich Penile Cancer
  details: |
    Removed deprecated updated_date; replaced broad MONDO synonym with exact synonyms; added Harrison's and ICD-O morphology classifications; added Phimosis and Tobacco Smoking (ECTO:6000029) to environmental risk factors and updated Chronic Inflammatory Dermatosis influences_mechanisms to PREDISPOSES / INDIRECT_UNKNOWN_INTERMEDIATES without meta-commentary; separated somatic HRAS gain-of-function lesion (with DECREASED GO:0003924 intrinsic GTPase hydrolysis) from TP53/CDKN2A tumor suppressor loss while keeping HPV E6/E7 viral transformation non-somatic; split Invasive Squamous Cell Proliferation and Nodal Spread into Invasive Squamous Cell Proliferation and Local Invasion (invasion_and_metastasis#Local Invasion and Intravasation) and Inguinal Lymphatic Metastasis (invasion_and_metastasis#Metastatic Colonization) and aligned treatment target_mechanisms accordingly; added PIK3CA (hgnc:8975) and TERT (hgnc:11730) somatic driver entries; added Phase II HERCULES chemo-immunotherapy clinical trial (NCT04224740); added VARIABLE_SPECTRUM coarse phenotype basis and StatPearls review citation/tag; added structured diagnostic procedures.

  details: |
    Backfill for issue #8085. Two links, both TRIGGERS with DIRECT. Lichen sclerosus and other chronic dermatoses point at the HPV-independent tumour suppressor loss node, which names chronic inflammation with lichen sclerosus as its example and describes it as the background against which the somatic mutations accumulate. Penile intraepithelial neoplasia points at the invasive squamous proliferation node, the precursor progressing to the invasive carcinoma being a single step rather than a route with intermediates. Both snippets were widened from the pre-existing fragments to whole sentences, because in each case the sentence does work the fragment loses: one sets the two carcinogenic pathways against each other, and the exposure belongs to only one of them; the other is the review's own grading sentence. The circumcision and genital hygiene exposure was deliberately left unlinked, and the reason comes from the source rather than from curatorial preference. The review sorts its own risk factors into two tiers, calling HPV and penile intraepithelial neoplasia indisputable and filing everything else among the widely debated, and it supplies no route from circumcision status to any node in this entry. The description of that exposure proposes chronic local inflammation, phimosis and HPV exposure as possible routes, but that is the entry's prose rather than evidence, and drawing an edge on it would repeat the mistake avoided for the retinoid arm of Isolated_Anophthalmia-Microphthalmia_Syndrome in PR #8294. Note also that penile intraepithelial neoplasia is a precursor lesion rather than an exposure, the same modelling question as cirrhosis in issue #8185; pre-existing here and not re-modelled. The penile intraepithelial neoplasia item was regraded to PARTIAL after review, for consistency with the choriocarcinoma link in the same tranche: the sentence is about risk of the disease and says nothing about the invasive proliferation or nodal spread the target node holds. The lichen sclerosus item keeps SUPPORT, since its sentence places chronic dermatoses as the background of the HPV-independent route, which is the node's own framing. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 35 of 35 verified.

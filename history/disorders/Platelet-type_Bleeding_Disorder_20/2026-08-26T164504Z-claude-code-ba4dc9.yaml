  summary: 'Create: Platelet-type Bleeding Disorder 20'
  details: |
    New entry for SLFN14-related platelet-type bleeding disorder 20 (MONDO:0014830). Eight pathophysiology nodes form a single connected component from the heterozygous SLFN14 variant through reduced protein abundance and redirected endoribonuclease substrate specificity to dysregulated ribosomal RNA turnover, impaired megakaryocyte maturation and proplatelet formation, macrothrombocytopenia and dense granule deficiency, and mucocutaneous bleeding. The two competing mechanistic accounts are curated explicitly as mechanistic_hypotheses (dominant_negative_degradation CANONICAL, redirected_substrate_specificity EMERGING) with causal edges opting into the groups, and the disagreement is recorded as a CONTROVERSY discussion. Two animal models are curated: the PF4-Cre conditional knockout (RECAPITULATES) and the global K208N knockin, which is FAILS_TO_RECAPITULATE with its limitations and evidence, paired with a HUMAN_MODEL_MISMATCH discussion. Validated with just validate (35/35 snippets), term validation, and the offline duplicate-key, entity-ref, folded-hyphen and snippet-length gates.

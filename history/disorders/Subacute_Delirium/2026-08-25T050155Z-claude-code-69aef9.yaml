  summary: 'Create: Subacute Delirium (MONDO:0004629)'
  details: |
    De novo curation of MONDO:0004629. "Subacute" is curated as a temporal qualifier on the delirium pathograph rather than as a distinct mechanism, because ICD-10 F05 bundles "acute or subacute confusional state" under one code and no study found during curation stratifies mechanism by onset tempo; the scope decision is stated in the entry description, in notes, and as a KNOWLEDGE_GAP discussion attached to the Protracted and Persistent Course node.

    Deep research: claude_code provider (research/Subacute_Delirium-deep-research-claude_code.md), 36 references, reference_validation needs_review=true with one unresolved identifier (a malformed DOI string), which was not cited. just preflight-dr returned SKIP because MONDO records no causal gene for this term, so disease identity was checked manually against the MONDO/MedGen/ICD-10 synonym set.

    Content: eight pathophysiology nodes (reduced cognitive reserve; systemic inflammatory insult; blood-brain barrier permeability increase; microglial activation and neuroinflammation; cholinergic-dopaminergic imbalance; cortical feedback connectivity loss; neuronal and astrocytic injury; protracted and persistent course) organized by four mechanistic hypothesis groups. The cholinergic/dopaminergic model is recorded as ALTERNATIVE with both of its failed therapeutic predictions curated as REFUTE evidence (rivastigmine, PMID:21056464; MIND-USA haloperidol/ziprasidone, PMID:30346242). Also curated: eight phenotypes, two biochemical markers, APOE as SUSCEPTIBILITY, two environmental exposures with influences_mechanisms links, prevalence, two progression phases, clinical burden, two diagnosis entries, three treatments, one animal model (ME7 prion mouse + systemic TNF-alpha) with modeled_mechanisms and a readout, two differential diagnoses, and three discussions.

    Deliberate omissions: claims whose deep-research sources resolved only to journal or PMC URLs — the APOE GWAS effect estimate, thalamic/caudate functional-connectivity findings, the S100B/NfL biomarker systematic review, and recent dexmedetomidine strategy trials — were left uncurated and are listed in the entry notes plus a CURATION_TODO discussion.

    Validation: just validate (schema + 57/57 snippets verified against cached references), just validate-terms, just validate-disorders, just compliance (88.1% global), and the offline gates check-duplicate-keys, check-snippet-length, check-folded-hyphens, check-title-snippets, check-environmental-evidence. The entity-reference and foreign-key pytest selection (14063 tests) passed.

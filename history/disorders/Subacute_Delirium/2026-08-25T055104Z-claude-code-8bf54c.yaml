  summary: 'Review response: Subacute Delirium (PR #9455)'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9455.

    The review found a factual error in the entry's own provenance prose, and it was right. Three claims were said to be uncurable for lack of a resolvable identifier; the deep-research run's reference validation had already cached all three, and they are now curated: the APOE multi-ancestry GWAS (PMID:41286463), the S100B/NfL systematic review (PMID:40889075), and the 4D dexmedetomidine trial (PMID:41160116). Only the thalamic/caudate connectivity record genuinely lacks quotable text (content_type: unavailable) and remains uncurated. The corrected notes block records the mistake and its lesson rather than silently deleting the claim.

    Changes: genetic#APOE now carries two evidence items and no longer claims the GWAS was unresolvable; the CURATION_TODO discussion was replaced with an OPEN_QUESTION about how APOE confers risk, since the citation task is done and the mechanistic question is what actually remains. Added a dexmedetomidine treatment and a clinical_trials entry for NCT03317067, with both the positive composite result and the bounding secondary outcomes curated, and narrowed the therapeutic-nihilism prose in the description and in the supportive-care treatment so it no longer overstates. Added S100B/NfL evidence to the Neuronal and Astrocytic Injury node and to the S100B biochemical entry, including the review's own "remain investigational" qualifier. Added the graded MMSE dose-response (PMID:25239680) to Reduced Cognitive Reserve, converting a categorical risk factor into a quantified one. Added the LPS mouse model (PMID:30962497) with two readouts including the TLR4-blockade rescue arm that makes it causal rather than descriptive.

    A duplicate `notes:` key was introduced and caught during revalidation while merging the APOE blocks; it was fixed by folding both into one block rather than dropping either.

    Validation after changes: just validate (71/71 snippets verified, up from 57), validate-terms, validate-disorders, check-duplicate-keys, check-snippet-length, check-title-snippets, compliance 89.8% global (up from 88.1%), and the entity-reference/foreign-key/clinical-trial pytest selection.

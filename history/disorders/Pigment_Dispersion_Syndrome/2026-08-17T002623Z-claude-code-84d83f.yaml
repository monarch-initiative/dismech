  summary: 'Create: Pigment Dispersion Syndrome (MONDO:0010896)'
  details: |
    New entry curated from an Edison Falcon deep-research report. Five pathophysiology nodes running posterior iris concavity and iridozonular contact, liberation of iris pigment epithelial granules, dispersion through the aqueous, trabecular meshwork pigment loading, and glaucomatous optic neuropathy. Conforms to glaucoma_optic_neuropathy at two nodes, with the disorder-specific substitution being that trabecular dysfunction is caused by loading with liberated iris pigment rather than by primary trabecular pathology. The organising decision is that the trabecular node is a THRESHOLD rather than a step: trabecular cells phagocytose small amounts of pigment harmlessly, and the entry curates the source's own statement that the same deposited pigment behaves benignly in some eyes and malignantly in others. That divergence is the central KNOWLEDGE_GAP, and it matters clinically because gonioscopic pigment burden appears to answer the question of who needs treatment and does not. A second KNOWLEDGE_GAP covers peripheral laser iridotomy, which targets the initiating mechanism directly and whose anatomical effect is undisputed, but whose effect on clinical outcome a systematic review calls unknown; the treatment carries REFUTE for the efficacy claim alongside PARTIAL for the proposal, because mechanistic plausibility is doing work evidence normally would. Genetics recorded as SUSCEPTIBILITY with no gene bound: association loci and measured heritability, not a Mendelian gene, and the DBA/2J mouse melanosomal genes deliberately NOT curated as human disease genes, which the source report explicitly flags as an error to avoid. Provider note: Falcon cites by DOI and by internal corpus keys rather than PMIDs, and the reference validator skips DOI-prefixed snippets, so all six report DOIs were resolved to PubMed records via esearch and every snippet is cited and verified against a PMID instead. Validated: just validate passed; count-verified-snippets 20/20; title audit 20 citations 0 mismatches; check_folded_hyphens, check-title-snippets and check_environmental_evidence OK; pytest tests/test_data.py -k Pigment_Dispersion 16 passed.

  summary: Replace a methods-sentence citation with the study's actual result and
    curate the two GWAS loci
  details: |
    Self-caught after approval, from sweeping every entry in this batch for methods-shaped snippets after that defect was the central finding on the vein of Galen PR.

    The genetic section cited the GWAS with the sentence 'Two-sample Mendelian randomization was used to determine whether refractive error and intraocular pressure exert causal effects over PDS.' That is a methods sentence. It records that the question was asked, not what the answer was, and it validated cleanly as an exact quote because it is one. The answer sits a few lines below in the same cached abstract: Mendelian randomisation showed significant evidence that myopia exerts a direct causal effect over PDS, p = 8.86e-7. That result is what justifies treating myopia as upstream of the disease rather than as a trait that travels with it, which is the position the entry already took and, until now, did not evidence.

    The same abstract also names the two genome-wide significant loci, which the entry did not curate at all. GSAP, GRM5 and TYR are now individual genetic entries, all typed SUSCEPTIBILITY, with the lead SNPs and p values. GRM5 and TYR are each PARTIAL because the source reports the locus jointly as GRM5/TYR and the signal cannot be assigned to one gene; they are listed alongside each other rather than picking one. TYR is the tempting one to promote, since tyrosinase is the rate-limiting enzyme of melanin synthesis and this is a disease about liberated pigment granules, but a mechanistic story that fits is a reason for interest and not a reason to upgrade a joint-interval association. That reasoning is recorded in the notes so it is not re-litigated.

    The polygenic entry's existing framing is unchanged and still correct: no causal gene is bound, the DBA/2J melanosomal genes remain deliberately uncurated, and the new entries reinforce rather than contradict that, since the authors' own register is common SNPs relating to genes, associated with risk.

    This push drops an approval that was already granted. That is the intended trade: leaving a methods-sentence citation in place, one line above the result it stands in for, would be inconsistent with the finding I spent this session fixing elsewhere.

    Validated: just validate passed; count-verified-snippets 33/33 (was 29/29); pytest -k Pigment_Dispersion 16 passed; folded-hyphen and title-snippet gates OK.

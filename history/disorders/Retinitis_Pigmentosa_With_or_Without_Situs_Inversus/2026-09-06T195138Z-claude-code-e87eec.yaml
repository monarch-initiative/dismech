  details: |
    De novo curation of RP66 / ARL2BP-related rod-cone dystrophy (MONDO:0014186). An openscientist deep-research report was generated and used as leads; preflight returned WARN on two counts that both changed the curation. ARL2 is mentioned 19 times against 61 for ARL2BP and the report cites PMID:25422369, which is about RP2 and X-linked RP2 rather than this disease; it is not cited here. The report also gives OMIM 615407, the ARL2BP gene MIM, where MONDO xrefs the RP66 phenotype MIM 615434, so no OMIM external_assertion is recorded. Six pathophysiology nodes branch one ciliary axoneme defect into an obligate retinal arm and a variable motile-cilia arm (situs inversus, sperm, olfactory), with a KNOWLEDGE_GAP on why the retinal arm is obligate and the other is not. Arl2bp knockout mouse and patient fibroblasts are both linked via modeled_mechanisms with scale and limitations. Validated: just validate (38/38 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys all pass.

  summary: 'Review round 1: address REQUEST_CHANGES on PR #11266'
  details: |
    Addressed all three blocking items from the automated review plus every optional suggestion. IMPORTANT 1: added HP:0001133 Constriction of peripheral visual field and HP:0007737 Spicular pigmentation of the retina, both quoted from the full text of PMID:38649918 already committed in this PR. IMPORTANT 2: added five variants to genetic.variants (c.101-1G>C; c.134T>G p.Met45Arg; c.22_23delAG p.S8Lfs*10; c.294-1G>C; and c.100+1G>T, which was found by following the reviewer's prevalence lead and is absent from the deep-research report's variant table), each with a verified quote from a cached source, and added penetrance COMPLETE with expressivity VARIABLE to the inheritance record, evidenced by two biallelic sisters who had no situs inversus. IMPORTANT 3: the reviewer was correct that the notes misrepresented the deep-research report, which does distinguish gene MIM 615407 from phenotype MIM 615434 in three places; the note is corrected and an external_assertions record carries OMIM:615434 cited to PMID:38649918 rather than to the report. Suggestions taken: a three-phase progression section from the long-followed case; the prevalence evidence replaced, having quoted a variant report rather than an occurrence measure, with the 1 in 72 cohort figure from PMID:40384762; the absent treatments section recorded as a KNOWLEDGE_GAP discussion attached to treatments# carrying the Cochrane statement at directness INDIRECT, with the description softened to match; motile-cilia node biological_scale changed from ORGANISM to CELLULAR; CL:0000573 retinal cone cell added. Two reference caches added (PMID:32573764, PMID:40384762). Two self-inflicted defects were caught and fixed during the round: a reference title written from memory rather than from the cache, caught by the reference validator; and a scripted replacement that silently deleted the disease_term, synonyms, parents, references and inheritance sections, which every gate accepted because all five slots are optional and which was caught only by a structural diff against HEAD. All sections were restored and a structural comparison confirms nothing lost or shrunk. Validated: just validate-disorders (55/55 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-qualifier-terms-online.

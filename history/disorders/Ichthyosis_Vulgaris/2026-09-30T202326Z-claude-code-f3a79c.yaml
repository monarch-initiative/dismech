  summary: 'Create: Ichthyosis Vulgaris'
  details: |
    New entry for FLG-related ichthyosis vulgaris bound to MONDO:0007810, curated from the claimed stub (stub deleted). Subtypes Mild IV (MONDO:0100474, heterozygous FLG) and Severe IV (MONDO:0100475, biallelic FLG) follow the semidominant gene-dose model; inheritance bound to HP:0032113 Semidominant inheritance. Pathophysiology is a causal chain: FLG null variants -> profilaggrin/filaggrin deficiency -> reduced keratohyalin granules and defective corneocyte formation, and reduced natural moisturizing factor -> reduced stratum corneum hydration -> permeability barrier failure -> retention hyperkeratosis (fine scaling) and percutaneous allergen penetration -> type 2 sensitization -> atopic dermatitis, asthma, allergic rhinitis, peanut allergy. Nodes conform to epidermal_cornification_failure (four nodes) and epithelial_barrier_dysfunction (two nodes). Environmental low humidity is linked as EXACERBATES. STS recorded as a MODIFIER from a single family report. Flaky tail mouse recorded under animal_models with the matted background caveat. No ClinGen FLG validity record is cached, so no gene_disease_validity. Deep research: OpenScientist report research/Ichthyosis_Vulgaris-deep-research-openscientist.md completed; its validation sections were missing from the generated report and were retro-fitted with just validate-research-reference (32/32 references resolved, 2/2 quotes found, 0 off topic) and just validate-research-terms (1 unresolved CURIE, NCIT:C177, and several mislabelled NCIT/HP suggestions; none of the report's suggested CURIEs were used). just preflight-dr MONDO:0007810 returned PASS (FLG mentioned 74 times; OMIM 146700 matches). Report citations used: 22158554, 27519469, 30021537, 33462753, 28242341, 38841231, 34608691, 23343419, 26872425, 32115871, 36159354, 36165597, 19349982, 23301728; the rest came from PubMed searches. Kezic 2008 (PMID:18305568, NMF reduction) has no abstract in PubMed and was not cited. just check-genereviews --online reports NO_CHAPTER; only a StatPearls chapter exists. Validation: just validate, validate-terms, count-verified-snippets (97/97), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, snippet-length/title/grading/folded-hyphen/environmental gates and validate-disorders all pass. Pruritus remains causally unconnected because no source states its mechanism in ichthyosis vulgaris.

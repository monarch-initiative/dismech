  summary: 'Red-team review: source-system wording, Chundru FDR caveat, anxiety phenotype'
  details: |
    Adversarial review of the new entry. Changes: (1) PMID:36527595 is abstract-only and says the knockdown experiments were in 'nerve cells' without naming a species; descriptions that said 'rat neural cells' or 'rat neurons' now say cultured nerve cells, keeping 'rat' only for the ischemic stroke model. The main description now says breast cancer cells rather than epithelial cancer cells (PMID:40768362 uses MDA-MB-231 breast models). (2) Genetic notes and the prevalence explanation now state that HECTD4 passed FDR < 5% but not Bonferroni correction in Chundru et al. 2024, on two biallelic LoF probands. (3) The E3-ligase class sentence on the substrate-ubiquitination to corpus callosum edge and the 'well-controlled seizures' sentence on the antiseizure treatment now have explanations that state their limits (no callosal mechanism; no named drug or outcome). (4) Added Anxiety (HP:0000739) as a notes-only synopsis phenotype, which the Atypical behavior description listed but the entry lacked. (5) Removed five uncited untracked reference caches. Retained: MedGen/OMIM description as REVIEW_SYNTHESIS for the defining phenotypes (Faqeih full text not OA; abstract used for inheritance, cohort, LoF and differentials); CAUSATIVE call; five-family count derived from the abstract (10 patients/7 families minus 3 UBE3C patients/2 families).

  details: |
    Applied the three optional suggestions from the automated review of PR #14980. (1) Added evidence-free phenotype rows for five OMIM:620250 clinical-synopsis features previously folded into other rows' notes: Apraxia (HP:0002186), Overgrowth (HP:0001548), Obesity (HP:0001513), Thoracic kyphosis (HP:0002942) and Hypoplasia of teeth (HP:0000685); provenance is recorded in notes, matching the existing Autism/Anxiety pattern, because the synopsis items are HTML list entries in the MedGen cache, not quotable sentences. The Macrocephaly, Scoliosis and Hypodontia notes no longer mention them. (2) Added an IMPC Hectd4 knockout sentence to the knowledge-gap rationale, checked against the IMPC gene page (significant in vision/eye, immune, homeostasis/metabolism and hematopoietic systems of 16 tested; no nervous-system phenotype listed). The page is a rendered table, not quotable, so it is not cited as evidence. (3) Fetched the Genomics England PanelApp HECTD4 page and added its sentence 'All seven patients had severe (4 cases) or moderate (3 cases) intellectual disability.' as evidence on Intellectual disability, with frequency 7/7 and severity 'Moderate to severe'. Validated with just validate (52/52 snippets) and the offline gates.

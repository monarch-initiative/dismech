  details: |
    New entry for MONDO:0859516 (HECTD4, autosomal recessive), from the claude_code deep-research report plus primary literature. Sources: Faqeih et al. 2023 (PMID:36401616; abstract only, full text not open access), Chundru et al. 2024 (PMID:39313616; full text, independent gene-burden replication), MedGen C5830296 copy of the OMIM description (url:https://www.ncbi.nlm.nih.gov/medgen/1840932) for the defining phenotypes, and HECTD4 biochemistry from PMID:40768362 (cancer cells) and PMID:36527595 (rat ischemia). Mechanistic edges beyond HECTD4 loss of function are INDIRECT; the GluN2B arm is an EMERGING hypothesis. relationship_type CAUSATIVE on two independent human genetic lines plus patient RNA evidence; no ClinGen record, so gene_disease_validity is absent. No GeneReviews chapter (just check-genereviews). The report's three candidate follow-up papers were checked: PMID:39313616 was used; PMID:42016445 cites Faqeih only as a contributing program; PMID:38274568 does not mention HECTD4. Synopsis-only phenotypes carry notes and no evidence. Validated with just validate (49+ snippets verified), check-gene-activity-grounding, check-causal-targets and the offline content gates.

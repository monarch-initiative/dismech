  summary: 'Review fixes: Nager Syndrome (PR #9728)'
  details: |
    Address ai4c-reviewer findings on PR #9728. C2: removed the biologically false cranial-neural-crest to radial-limb edge and re-parented Preaxial and Radial Limb Ray Deficiency to the SF3B4 haploinsufficiency node (radial ray derives from lateral-plate-mesoderm limb bud, not neural crest). Removed unevidenced frequency bands justified only by list membership. Split the bundled neural-crest node into atomic migration-deficit and apoptosis nodes. Added Upper Airway Obstruction phenotype (PMID:18947886, PMID:8882111) wired via glossoptosis; feeding difficulty and Robin sequence recorded in notes (no quotable snippet). Added Xenopus sf3b4 animal_models with modeled_mechanisms and a HUMAN_MODEL_MISMATCH discussion (homozygous model vs heterozygous human). Added expressivity VARIABLE; documented why the limb-patterning module was not mapped; added Rodriguez syndrome mention; recorded no-GeneReviews-chapter check. PMID:24003905 verified as a primary human cohort so evidence_source HUMAN_CLINICAL is retained (reviewer's review characterization inaccurate). 47/47 snippets verified; schema and term validation pass.

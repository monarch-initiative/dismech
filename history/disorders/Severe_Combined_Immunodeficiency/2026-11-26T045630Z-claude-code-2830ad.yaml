  summary: 'Gene-family review: ADA'
  details: |
    ADA modelling re-reviewed. The ADA genetic record was untyped; it is now CAUSATIVE and germline, with an inheritance block bound to HP:0000007 and the ClinGen Definitive tier for ADA-deficient T-B-NK- SCID (MONDO:0007064, the ADA deficiency subtype's own term; CGGV:assertion_664ba77c-3db6-47da-941e-316ac819432a-2020-11-19T170000.000Z) recorded with subtype set. The ADA node (Toxic purine metabolite accumulation) bound only a process; it now binds the enzyme's two deaminase activities, GO:0004000 adenosine deaminase activity and GO:0046936 2'-deoxyadenosine deaminase activity, both DECREASED, and the deoxyadenosine catabolic process (GO:0006157) beside the adenosine one, matching its description that deoxyadenosine and dATP are the main lymphotoxic metabolites (PMID:32181275, PMID:20301656 already cited). The other twelve SCID genes were outside this review and were not changed.

  summary: 'Review: SCID - source the 1/58,000 incidence, correct thymus term and
    subtype tags'
  details: |
    Manual expert claim-evidence review.
    Fixed: (1) prevalence notes asserted 'approximately 1 in 58,000 live births' but the cited PMID:33551023 abstract contains NO incidence figure at all (its quoted snippet is about state adoption of screening). Fetched and cited the actual source, PMID:25138334 (Kwan 2014, 11 US TREC programs), added structured measure_type/prevalence_class/rate fields, and downgraded the old citation to PARTIAL with a note that it does not contain the number. (2) Phenotype 'Aplasia of the thymus' (HP:0005359) was wrong: in typical SCID the thymic rudiment is present but hypoplastic/dysplastic because it is unpopulated by thymocytes; true athymia is complete DiGeorge/FOXN1. Retermed to HP:0000778 Hypoplasia of the thymus, and replaced the evidence (which never mentioned thymus) with PMID:32181275 quotes, including one showing CORO1A SCID has a normal-sized thymus, so no frequency band is asserted. (3) 'Decreased total B cell count' was tagged subtype RAG1/RAG2 deficiency and 'Reduced total NK cell count' subtype X-linked SCID, but both cite the ADA-deficiency GeneReviews - retagged to ADA deficiency to match their evidence.

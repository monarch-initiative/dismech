  summary: 'Review fixes: CORO1A allele wording, Arp2/3 modifier, merge-added GO bindings'
  details: |
    PR Shepherd pass on the round-2 review. The merge commit 6653b7ac1 added molecular_functions bindings to the SCID nodes (DNA-dependent protein kinase activity and DNA ligase (ATP) activity on Defective V(D)J recombination and DNA repair; signaling receptor and signaling receptor complex adaptor activity on Receptor-proximal T-cell receptor signaling defect; Arp2/3 complex binding on Defective thymocyte egress); this record covers them. On Defective thymocyte egress and the CORO1A genetic record, replaced the claim that the Ptcd mouse carries the same lesion as the patient: PMID:18836449 reports Ptcd as an E26K gain-of-function allele that increases Arp2/3 inhibition, and says it does not phenocopy Coro1a-null mice, which lose mature thymocytes through reduced survival; the patient lacks CORO1A expression. The Arp2/3 complex binding modifier changed from LOSS_OF_FUNCTION to ABNORMAL, and two evidence items from the same paper were added (the non-phenocopy sentence, MODEL_ORGANISM; the absent-expression sentence, HUMAN_CLINICAL). CD3D node binding narrowed from GO:0038023 to GO:0004888 transmembrane signaling receptor activity. The thymus-size caveat moved from CORO1A features to notes. Validated with just validate (157/157 snippets).

  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review against all eight cited references. Two of them (PMID:32181275 Genes Dis review, PMID:25138334 JAMA newborn-screening study) are cached as full text and were being cited only for one or two abstract-level sentences each; most of the additions come from their bodies.

    FIDELITY FIXES (overreach). (1) X-linked SCID was described in two places as "~50% of cases" with no evidence. PMID:25138334 found IL2RG in only 19% of population-screened SCID and states explicitly that this contrasts with "nearly half of cases in published cohorts from referral centers", attributing the gap to better ascertainment of autosomal recessive SCID by unbiased screening. Both descriptions were rewritten to distinguish the two populations, the referral-vs-screened contrast added as evidence, and the reasoning recorded in review_notes. (2) The DCLRE1C genetic entry claimed hairpin opening, NHEJ repair, and radiosensitivity while citing only a gene-count fragment ("RAG2 (17), JAK3 (15), DCLRE1C (13), IL7RA (9)") that supports none of them; three PMID:32181275 sentences were added covering the ARTEMIS nuclease role, the T-B-NK+ arrest, and ionizing-radiation sensitivity. (3) The "Cytokine receptor signaling defect" node cited the X-SCID molecular-diagnosis sentence, which says nothing about JAK-STAT or IL-7; three mechanism sentences added. (4) The "Defective V(D)J recombination and DNA repair" node cited a generic SCID definition sentence that never mentions V(D)J; replaced with the RAG recombinase sentence, "In the absence of VDJ recombination, T cell undergoes apoptosis", the ARTEMIS sentence, and the radiosensitivity sentence. (5) Unevidenced quantitative claims ("~15% of SCID" for ADA, "about 80% of affected individuals") were given their sources.

    NEW MECHANISM CLASS. The entry modelled three mechanism classes and its own notes said so; reticular dysgenesis (AK2) is a fourth and was absent. Added a has_subtypes entry, a genetic entry (hgnc:362), and the pathophysiology node "Defective haematopoietic precursor survival" (GO:0004017 AMP kinase activity, GO:0030097 hemopoiesis) with three downstream edges. This is the only SCID mechanism whose consequences leave the lymphoid lineage - absent granulocytes alongside absent lymphocytes - so the new phenotype "Absence of circulating granulocytes" (HP:0012234) hangs off it.

    NEW SECTIONS the entry entirely lacked, all supportable from already-cited sources: diagnosis (4 entries - lymphocyte subset flow cytometry, TREC newborn screening with its ZAP70/MHC-II/late-ADA blind spot, molecular genetic testing, ADA enzyme and metabolite testing), progression (5 phases - median onset 2.5mo and diagnosis 5mo from the 277-child Indian cohort; pre-screening presentation at 3-6 months; the post-screening asymptomatic-infant presentation; the later-onset atypical X-SCID spectrum; death by 1-2 years untreated), clinical_burden (HIGH; 75.8% mortality and only 8.3% transplanted in India versus 87% survival under US newborn screening - burden dominated by access and time-to-diagnosis), and definitions (the four PIDTC 2022 criteria sets: typical SCID, leaky/atypical SCID, Omenn syndrome, and the thymic-stromal-defect scope exclusion that keeps complete DiGeorge and FOXN1 athymia out of this entry).

    PER-GENE CASE FRACTIONS. Added Genetic.case_fractions for IL2RG (19% screened, 22.2% Indian cohort), RAG1 (15%), IL7R (12%), ADA (11%), each with population and cohort_size, because the numbers differ roughly twofold by ascertainment and by ancestry.

    PREVALENCE. Added the Navajo Nation founder-population record (1/3500, CI 1/630-1/4000, from a DCLRE1C founder variant causing SCID in about 1/2000 births) and the worldwide literature range (1/40,000-1/75,000). The entry previously carried only the US screened figure.

    PHENOTYPES (+10). Four Omenn features from the RAG-defect sentence in PMID:32181275 (Erythroderma, Increased total eosinophil count, Increased circulating IgE concentration, Lymphadenopathy); three ADA extra-immune features (Dermatitis, Hemolytic anemia, Pulmonary alveolar proteinosis); two atypical X-SCID features (Autoimmunity, Bronchiectasis); and Absence of circulating granulocytes for reticular dysgenesis. Dermatitis was bound to HP:0011123 rather than to a dermatitis subtype because the sources say only "extensive dermatitis".

    TREATMENTS. Added a missing management pillar - protective isolation and avoidance of live vaccines (including for household contacts) and non-irradiated blood products - evidenced from both GeneReviews and the 11-programme screening practice. Added the radiosensitive-genotype conditioning caveat to HSCT as PARTIAL evidence. Added the ADA gene-therapy treatment-related T-cell leukaemia (4.7 years post-GT) and the 88% 2-year intervention-free survival, so gene therapy is not presented as risk-free. Added the ERT-as-bridge sentence establishing that ERT is discontinued at HSCT/HSC-GT rather than continued alongside it.

    Validation: schema pass, terms pass, entity-refs pass, duplicate-keys pass. Snippets 46 -> 113 verified individually; 264/264 in the batched three-file sweep. check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-not4curation all clean. classifications.iuis_category untouched.

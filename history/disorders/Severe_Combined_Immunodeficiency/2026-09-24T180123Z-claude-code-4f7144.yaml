  summary: 'Review round 1: CD3D node wording, evidence_source regrades, drop unsourced
    thymus claim'
  details: |
    Review round 1 on PR 12703. Corrected the receptor-proximal T-cell receptor signalling node, which described the receptor complex as assembled but non-signalling. That fits LAT, which acts below an intact receptor, but not CD3D: CD3delta is an invariant chain needed to build a signalling-competent receptor, and no cited snippet supported the assembled wording. The node and its downstream edge now state the two routes separately. Regraded the coronin-1A egress quote from HUMAN_CLINICAL to MODEL_ORGANISM, because the egress and Arp2/3 work it reports was done in mouse strains while the human patient in the same paper contributes only genotype and immunophenotype, which the second quote already covers. Regraded the LAT background sentence to MODEL_ORGANISM and marked it quote_role BACKGROUND, since it rests on the LAT-deficient mouse and sits in the abstract's background section. Removed the assertion that the thymus is present and of normal size in coronin-1A deficiency: neither cited report states it. The node now rests on the mouse egress block, which is quoted and graded as model-organism evidence, and records that no claim about human thymus size is made.

  summary: 'Genetics pass: five genes wired to mechanism nodes, three declined'
  details: |
    Genetics pass for the d2g series-029 gap list. Verified the parent anchor MONDO:0015974 against OLS; it is correct and needed no change. Declined to add has_subtypes rows for the gap-list genes, because this repository already curates the sibling leaf entities as their own Disease entries (CD3E, CD3G, CD247, ZAP70) and the entry carried a recorded ruling against enumerating every SCID gene as a subtype. Instead bound five genes to the pathophysiology node each acts at: PRKDC and LIG4 to the existing V(D)J recombination and DNA repair node, and CD3D, LAT and CORO1A to two new nodes. The two new nodes exist because receptor-proximal T-cell receptor signalling and thymocyte egress are mechanism classes in their own right, which the entry did not model. That also corrects a claim in the entry notes that the CD3 subunits and CORO1A fell inside one of the four classes already present; they do not. Declined LCK, CD70 and BCL11B with reasons recorded in notes: IUIS 2022 places LCK in the combined-immunodeficiency section explicitly less profound than SCID, files CD70 deficiency under Epstein-Barr-virus susceptibility and immune dysregulation with normal lymphocyte counts, and files BCL11B deficiency with the syndromic combined immunodeficiencies. MONDO labels the first two as severe combined immunodeficiency; neither label is supported by the sources read here, and both are reported for upstream consideration rather than filed. Gene-to-mechanism wiring went from 8/8 to 13/13.

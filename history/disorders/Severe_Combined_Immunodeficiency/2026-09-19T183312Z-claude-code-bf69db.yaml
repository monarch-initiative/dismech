  summary: Curate the extra-immune arm of ADA-SCID on the SCID umbrella
  details: |
    Closes the gap #10621 named: the SCID umbrella carried ADA-SCID's immunological arm only, and every edge out of 'Toxic purine metabolite accumulation' led to 'Blocked T-lymphocyte development'.

    Added one pathophysiology node, 'Non-lymphoid tissue purine metabolite toxicity' (biological_scale: CELLULAR), downstream of the existing purine node. It binds the two molecular routes the anchor review gives for extra-immune damage: 2'-deoxyadenosine inactivating S-adenosylhomocysteine hydrolase (GO:0004013 DECREASED, GO:0032259 DECREASED, CHEBI:16680 INCREASED) and dATP inhibiting ribonucleotide reductase (GO:0004748 DECREASED, GO:0006260 DECREASED, CHEBI:16284 INCREASED).

    Added five phenotypes, all tagged subtype: ADA deficiency - Cognitive impairment (HP:0100543), Hyperactivity (HP:0000752), Sensorineural hearing loss (HP:0000407), Costochondral abnormalities (HP:0000919), Elevated hepatic transaminases (HP:0002910). Six downstream edges wire those five plus the pre-existing Pulmonary alveolar proteinosis phenotype to the new node, so six previously disconnected phenotypes now have a causal inlink.

    Added one KNOWLEDGE_GAP discussion (ada_extraimmune_mechanism) attached to the new node, recording that the review states the mechanism of the CNS pathology has not been investigated and that the two bound molecular routes are carried over from lymphocytes by inference from ubiquitous ADA expression.

    Evidence discipline. The anchor PMID:27579027 (Whitmore & Gaspar 2016) is a review, so every quote taken from it carries quote_role: REVIEW_SYNTHESIS, with evidence_source graded from what the quoted text describes (HUMAN_CLINICAL for the patient cohorts, IN_VITRO for the biochemistry, OTHER for the review's own framing). The costochondral edge carries a REFUTE item quoting the review's own statement that the causal assignment to purine metabolism is unknown for bone, rather than omitting the caveat. The hepatic arm is marked in notes as the thinnest human evidence, with a second quote recording that hepatic dysfunction is rarely reported in patients and that the severe hepatic phenotype is murine.

    Validation: just validate (schema + terms + references) passed with 135/135 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-grading, check-title-snippets, check-folded-hyphens, check-snippet-length all clean. Two term-cache rows added by validation (HP:0000919, CHEBI:16284).

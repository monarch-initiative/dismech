  summary: Bind MONDO subtype_term to all six SCID has_subtypes entries
  details: |
    Claim #10615 (severe combined immunodeficiency due to adenosine deaminase deficiency, MONDO:0007064) resolved as entry_type SUBTYPE rather than a standalone disease entry.

    ADA-SCID was already curated inside kb/disorders/Severe_Combined_Immunodeficiency.yaml: a has_subtypes entry with hgnc:186, a genetic: record with the purine-metabolic mechanism and a GeneReviews quote, a dedicated 'Toxic purine metabolite accumulation' pathophysiology node (GO:0006154, CHEBI:17256, CHEBI:16335, CL:0000893) with a causal edge into 'Blocked T-lymphocyte development', two phenotypes tagged subtype: ADA deficiency, and two ADA-specific treatments (pegademase ERT and retroviral HSC gene therapy). The only thing missing was an ontology binding, so no tool could see the coverage.

    Added subtype_term to all six subtypes, not just ADA, following the #9911 rule that binding half a section teaches the next reader the unbound half is deliberate:
      X-linked SCID          MONDO:0010315 (OMIM:300400)
      ADA deficiency         MONDO:0007064 (OMIM:102700)
      RAG1/RAG2 deficiency   MONDO:0011086 (OMIM:601457)
      IL7R deficiency        MONDO:0015701 (Orphanet:169154)
      JAK3 deficiency        MONDO:0010938 (OMIM:600802)
      Artemis deficiency     MONDO:0011225 (OMIM:602450)

    Every CURIE was resolved through the EBI OLS4 MONDO API before binding: non-obsolete confirmed, canonical label copied from the API response rather than typed, and the OMIM/Orphanet cross-reference checked against the gene the umbrella assigns to that subtype. The RAG1/RAG2 and Artemis pair needed that check because both are T-B-NK+; MONDO:0011086's own definition names RAG1/RAG2 null mutations and MONDO:0011225 is the DCLRE1C term, so the assignment follows the umbrella.

    No mechanism, phenotype, evidence, treatment, or prose in the umbrella was changed.

    Retires three stubs, confirmed by just tidy-stubs: the claimed ADA stub plus two unclaimed siblings (MONDO:0011086, MONDO:0010315) that no open claim issue covers.

    Validation: just validate (exit 0), just validate-terms (exit 0), just check-stubs (exit 0, advisories only).

  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    LOINC tranche A batch 5 (issue 13642). Extended the existing TREC newborn screening row with measurements bound to LOINC:62333-0 (SCID newborn screening panel), LOINC:62320-7 (T-cell receptor excision circle copies per volume in DBS by NAA with probe detection) and LOINC:62321-5 (SCID newborn screen interpretation). The TREC code is method-specific because LOINC's only DBS copy-number code names the method and quantitative PCR is the method the measurement is defined by; the Monarch KG search returned no method-less copy-number code. Two reference ranges on LOINC:62320-7 in copies per microlitre, abnormal direction low, from the Catalonia (Spain) universal programme on the EnLite Neonatal TREC assay: detection cut-off 20 copies/uL across 2017-2023 (PMID:42079620) and the tiered algorithm from the 2017-2018 report (PMID:31695692): first-sample positive at or below 10 copies/uL for term newborns and 5 for preterm infants, second sample requested when retest values are at or below 20, retest threshold 34 in 2017 and 24 from 2018. One range per gestational-age stratum. The source thresholds are inclusive and the half-open bands keep the stated boundaries, with the one-point discrepancy noted. KREC is not bound because the search returned nothing and the row describes TREC alone. Labels seeded by just loinc-seed-cache; validate, validate-terms, count-verified-snippets, validate-disorders, check-duplicate-keys, check-entity-refs and check-snippet-grading all pass.

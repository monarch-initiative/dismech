  summary: Complete clinical-table phenotype coverage in Baraitser-Winter review
  details: |
    A final pass over the recovered 2015 Table 2 identified five missing manifestations: long palpebral fissures, full cheeks, prominence of the nasal bridge on profile, ventriculomegaly, and lower-limb spasticity. Added these with source-verified HPO labels, clinical evidence, and indirect links from the actinopathy. Nasal prominence is distinct from width; long fissures are distinct from downslant; ventricular enlargement is not equated with hydrocephalus. The lower-limb spasticity count is restricted to the assessed ACTB subgroup (7 present, 14 absent; ACTG1 unavailable). The entry now has 73 phenotypes. Follow-up validation passes schema, ontology terms, 258 snippets and 259 titles; all 258 snippets pass boundary checking and both scoped data tests pass.

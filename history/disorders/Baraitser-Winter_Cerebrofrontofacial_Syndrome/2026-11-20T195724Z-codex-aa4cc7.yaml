  summary: Map Baraitser-Winter syndrome to OMIMPS:243310
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS243310 contains ACTB-related Baraitser-Winter syndrome 1 (OMIM:243310) and ACTG1-related type 2 (OMIM:614583), the two subtypes curated here and the two children of MONDO:0017579. Their developmental actinopathy and overlapping cerebrofrontofacial phenotype support a syndrome-level Disease, while allele- and model-dependent mechanisms are retained. ExactMatch is not a claim that every ACTB or ACTG1 variant causes this syndrome or that all actin-related hearing loss and developmental disorders belong to the series.

  summary: 'Review round 1: add missing phenotypes, progression, diagnosis'
  details: |
    Responded to the automated review on PR 15292. Added six phenotypes quoted from PMID:33764426 and PMID:33851776: global developmental delay (HP:0001263), dysarthria (HP:0001260), thin corpus callosum (HP:0033725), progressive lower limb spasticity (HP:0002061), abnormal retinal pigmentation (HP:0007703), and basal ganglia iron deposition bound to HP:0012675 Iron accumulation in brain. All HP CURIEs and labels were looked up in OLS. Marked Cerebellar vermis atrophy clinical_course PROGRESSIVE and added the serial-MRI volume-loss evidence to it and to Cerebellar Neurodegeneration. Regraded the two BACKGROUND evidence items from OTHER to IN_VITRO. Added a diagnosis block (sequencing with long-read phasing and RNA analysis; electron microscopy of patient cells). Not changed: no Progressive cerebellar ataxia binding, because no source states that the ataxia itself progresses; no neonatal onset on Hypotonia, because only one sibship is reported as neonatal; sensorineural hearing loss not added, because it is a single mild case in a patient with other atypical features. Validation: validate, validate-terms, count-verified-snippets 47/47, snippet-length, snippet-grading, title-snippet and coarse-phenotype gates, and validate-disorders all passed.

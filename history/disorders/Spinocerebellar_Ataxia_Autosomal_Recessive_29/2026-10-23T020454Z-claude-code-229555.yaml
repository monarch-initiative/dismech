  summary: 'Create: Spinocerebellar Ataxia, Autosomal Recessive 29 (VPS41)'
  details: |
    New entry for SCAR29 (MONDO:0030312), caused by biallelic VPS41 variants. Curated from the defining series (PMID:33764426), the HOPS/mTORC1-TFE3 functional study (PMID:33851776), the VPS16/VPS41 dystonia cohort (PMID:32808683), the HOPSAND review (PMID:33871597) and a 2026 long-read case (PMID:42656169). The pathograph runs VPS41 loss of adaptor function -> HOPS dysfunction -> delayed lysosomal cargo delivery -> abnormal lysosomal compartment and mTORC1/TFE3 dysregulation -> microglial lysosomal accumulation and cerebellar neurodegeneration -> ataxia, vermis atrophy, nystagmus, dystonia. A claude_code deep-research report was used as leads only. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets and validate-disorders. preflight-dr was not run (no local MONDO build).

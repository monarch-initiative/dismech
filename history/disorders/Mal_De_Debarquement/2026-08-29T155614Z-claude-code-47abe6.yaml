  summary: 'Create: Mal De Debarquement'
  details: |
    De-novo curation of mal de Debarquement syndrome, MONDO:0016217, as a Disease. Deep research: OpenScientist, research/Mal_De_Debarquement-deep-research-openscientist.md, 21 citations, 798s, 22/22 references verified with 0 percent confabulation. Mechanism curated as a five-node chain: prolonged passive oscillatory motion exposure, velocity storage cross-axis maladaptation, persistent oscillatory self-motion perception, limbic-vestibular network reorganization, and functional impairment. The Barany Society consensus criteria are curated as a definitions block with derivation_basis ESTABLISHED_CRITERIA, and the three temporal designations are curated as progression phases rather than has_subtypes because they are observation-window qualifiers on one disease. The non-motion-triggered presentation is recorded as an open KNOWLEDGE_GAP rather than folded into the entry, since the entry's mechanism starts from an oscillatory conditioning stimulus that such cases lack. Uses the post-issue-7439 evidence model throughout: supports carries direction only and directness is set separately, with INDIRECT on the monkey conditioning data, the computational velocity-storage model, and the inference from treatment response back to mechanism. One REFUTE item records that iTBS added no benefit over VOR rehabilitation in a randomised trial. No GO term is bound for the vestibulo-ocular reflex: the research report offered GO:0060013 under that name, the report's own term_validation block flagged the label mismatch, and OLS confirms GO:0060013 is righting reflex, so the nodes name the process in prose instead. ECTO:6000033 exposure to travel is bound for the trigger with its imprecision recorded in notes. Validated with just validate-disorders, 32/32 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys, all five snippet gates, a 10-pair reference-title cross-check against the cache, and 15509 structural and conformance tests.

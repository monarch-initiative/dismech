  summary: 'Review round 1: address ai4c-reviewer REQUEST_CHANGES on PR 10062'
  details: |
    Addressed the reviewer's REQUEST_CHANGES. The substantive error was the cardinal phenotype: it was bound to HP:0002321 Vertigo, whose HPO definition is an abnormal sensation of spinning, on a phenotype whose own preferred_term and evidence snippet both say non-spinning. Rebound to HP:4000033 Non-spinning vertigo, whose definition transcribes the Barany criterion and whose HPO annotation names mal de debarquement syndrome explicitly. Verified against OLS before changing. This is the same class of error the entry congratulates itself for catching in the research report's GO:0060013 suggestion, committed by me one section later. Added an epidemiology block citing PMID:23674832 for the 41-46 percent migraine comorbidity and PMID:34864753 for the sex-hormone proposal, graded INDIRECT since it concerns vestibular disorders as a class; those claims had been asserted in the top-level description with no citation anywhere in the file. Added the two omitted controlled trials: tDCS PMID:27117283 as a treatment, and the sham-controlled optokinetic study PMID:30410464 as evidence on the readaptation treatment, where the absence of a placebo effect matters more than the response rate because the entry offers treatment response as evidence for the mechanism. Added evidence to the two uncited phenotypes and four new phenotypes named in prose but never modelled: visual motion intolerance, spatial disorientation, impaired cognition, depression. Added clinical_burden HIGH with the flight-time dose-response, the 6-month prognostic threshold on Persistent MdDS, and the motion-triggered versus spontaneous treatment-response discriminator onto the open KNOWLEDGE_GAP, which is the first concrete evidence bearing on that question. Trimmed a trailing mid-sentence fragment from the discussion snippet. Separately: while writing these fixes I invented three reference_title values from memory again, the third session running. Rather than fix them individually I rewrote every reference_title in the file programmatically from its cache frontmatter, which is the durable fix; four instances across three PMIDs were wrong. Also caught by check-snippet-length that I had copied a 4-word fragment verbatim from the review rather than quoting a sentence, and expanded it. Validated with all ten just qc gates rather than the six CLAUDE.md lists, 45/45 snippets verified, boundaries clean, and 15509 tests.

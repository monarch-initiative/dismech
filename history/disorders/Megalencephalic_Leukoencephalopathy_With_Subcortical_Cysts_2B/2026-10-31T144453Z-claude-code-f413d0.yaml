  summary: 'Create: Megalencephalic_Leukoencephalopathy_With_Subcortical_Cysts_2B'
  details: |
    New Disease entry for MLC2B (MONDO:0013491), the autosomal dominant remitting HEPACAM form of MLC, curated as its own Disease rather than a subtype of the recessive MLC2A entry: inheritance mode, course and proposed mechanism all differ, and ClinGen's own curation records that the HEPACAM disorders were split into two entities by its Lumping and Splitting rules. Seven pathophysiology nodes trace the dominant-negative chain from a heterozygous IgV missense allele through interference with wild-type GlialCAM trafficking, loss of junctional MLC1 and ClC-2, impaired astrocyte volume regulation and intramyelinic edema, to a terminal node for the remission itself; an eighth node carries the candidate developmental route for the intellectual disability and autistic features. Eleven phenotypes, 10 of them causally wired. Three progression phases model the remitting trajectory. The two gaps that define the disease are recorded as KNOWLEDGE_GAP discussions (why it remits; why autism is commoner than in the progressive forms) with proposed experiments, plus a HUMAN_MODEL_MISMATCH discussion for the tissue-level nodes, which rest entirely on mice because no GLIALCAM patient brain has been studied. ClinGen Definitive (AD) copied onto the causal gene record as gene_disease_validity with the CGGV assertion quoted; check-gene-validity reports 0 findings. One OpenScientist deep-research report was used (20 min, 19 citations): reference validation 20/20 verified, 0 not found, 1 off topic (PMID:42586097, a vanishing-white-matter trial, correctly not cited); term validation 24/26 verified with 5 label mismatches that are table-column artifacts rather than wrong CURIEs; both blocks set needs_review. just preflight-dr returned WARN and caught the report offering HGNC:17027 for HEPACAM at two places, which is SLC16A10; the entry binds hgnc:26361 read from cache/hgnc/terms.csv, and no identifier was copied from the report. The report's substantive contributions over the PubMed work were two references: PMID:41654199, an astrocyte-specific Lrrc8a knockout showing that loss of the VRAC pore subunit alone leaves volume recovery normal and produces no white matter edema, now a REFUTE item on the volume-regulation node and on its downstream edge; and PMID:32507665, serial MRI in an 11q24 deletion patient, now a primary source under the Jacobsen differential. Validated with validate, validate-terms, validate-disorders (119/119 snippets, 120 titles, 0 issues), check-genereviews (chapter PMID:20301707 tagged), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-grading, check-retired-support-prose, check-shared-disease-terms, list-gene-term-mismatches (7 gene descriptors, 0 mismatches) and check-term-cache-integrity. Hypotonia is the one phenotype left unwired, because no source states a mechanism for it in this form.

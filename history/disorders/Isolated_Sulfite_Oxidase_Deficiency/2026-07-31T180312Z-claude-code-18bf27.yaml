  details: |
    Automated curation-scanner run addressing the CHANGES_REQUESTED review on PR #7270.

    BLOCKING ISSUE FOUND BEYOND THE REVIEW: the branch predated commit 0729e8e5b6
    "Remove MAXO ontology; remap all treatment/diagnosis terms to NCIT" (#7228), so all
    five treatment_term bindings still used MAXO IDs and would have reintroduced a removed
    ontology. Merged origin/main into the branch (resolving a one-line timestamp conflict
    in cache/go/terms.csv in favour of main) and remapped each MAXO term to the NCIT target
    used by the canonical removal commit: MAXO:0000167 -> NCIT:C64172, MAXO:0001346 ->
    NCIT:C52006, MAXO:0000088 -> NCIT:C15447, MAXO:0000950 -> NCIT:C15747, MAXO:0000079 ->
    NCIT:C15240.

    Review items addressed:

    1. Added tags: [GeneReviews] to the PMID:28933809 top-level reference.

    2. Corrected three evidence_source labels from HUMAN_CLINICAL to MODEL_ORGANISM (two
       PMID:41178722 mouse-study framing sentences, one PMID:31001109 zebrafish framing
       sentence) and added human-sourced companion evidence so that neither the Sulfite
       Accumulation edge nor the S-Sulfocysteine Accumulation node rests on model-organism
       evidence alone.

    3. Dropped both over-read frequency bands. The Axial hypotonia OBLIGATE band rested on
       a 100% figure covering the disjunction "axial hypotonia and/or peripheral
       hypertonia"; the Neonatal seizure VERY_FREQUENT band rested on an 84% any-age
       seizure figure applied to a neonatal-onset term (neonatal onset was 57%). Evidence
       explanations and entry notes now record why the bands are absent. Global
       developmental delay retains VERY_FREQUENT because its 97% is a clean single figure.

    4. Split the bundled node "NMDA Receptor Overactivation and Loss of GABAergic
       Inhibition" into three atomic nodes chained by DIRECT edges: "NMDA Receptor
       Overactivation and Calcium Influx" (MOLECULAR) -> "Calpain Activation and Gephyrin
       Degradation" (MOLECULAR) -> "Loss of GABAergic Inhibition" (CELLULAR, which retains
       the epilepsy_excitation_inhibition_imbalance conformance). Updated the
       HUMAN_MODEL_MISMATCH attaches_to references and the notes prose accordingly, and
       replaced GO:1904862 with GO:0097112 per the review suggestion.

    5. Connected the therapeutic layer to the pathograph. New Dextromethorphan treatment
       INHIBITS the NMDA node and carries the PMID:39749013 REFUTE item so the therapeutic
       hypothesis is not presented as settled. New investigational sulfite-scavenging
       treatment INHIBITS Sulfite Accumulation on PMID:41178722 model-organism evidence
       only. Dietary restriction now targets Sulfite Accumulation. Anti-seizure medication
       deliberately carries NO target_mechanisms edge, documented in a treatment-level
       note, because the GABAergic synapses such drugs act through are the ones being
       destroyed - the absent edge is the mechanistic statement.

    6. Added a five-entry diagnosis: section - urinary sulfite dipstick screening, the
       sulfur metabolite panel, discrimination from molybdenum cofactor deficiency via
       preserved xanthine dehydrogenase, SUOX molecular genetic testing, and brain MRI -
       mined from the already-cached GeneReviews DIAGNOSIS/TESTING section.

    7. Applied review suggestions: connected the previously orphan Ectopia Lentis node via
       an INDIRECT_UNKNOWN_INTERMEDIATES edge opted into a new EMERGING
       mechanistic_hypotheses group (zonular_disulfide_reduction), so the pathograph is a
       single connected component without asserting the unsourced zonular mechanism; added
       the two unmined GeneReviews management items (spasticity medication, chest
       physiotherapy); filled therapeutic_modality on all pharmacological and procedural
       treatments.

    Not done, with reasons: ORPHA:99731 caching requires the gitignored Orphadata bulk XML,
    which is not present in this checkout. The suggested "harrisons_part" slot does not
    exist in the schema - the real slot is harrisons_chapter, which no sibling inborn-error
    -of-metabolism entry populates. No deep-research artifact was produced because the
    high-effort curation-scanner path builds directly from fetched primary literature
    rather than from a deep-research provider.

    Validation: just validate, just validate-terms and just validate-references all pass
    (100/100 snippets verified against cached references); python -m dismech.render renders
    cleanly; a pathograph foreign-key check confirms no dangling downstream or
    target_mechanisms targets and no undeclared hypothesis groups. No references_cache file
    was created or hand-edited.

  summary: 'Create: Isolated Sulfite Oxidase Deficiency (SUOX, MONDO:0010089)'
  details: |
    New disease entry for IEMbase WP-002 row 1.5.09.01 (SUOX-related isolated sulfite oxidase deficiency), created by the automated high_effort curation scanner from issue #5557.

    NEC preflight: the MONDO record for MONDO:0010089 was pulled with `runoak -i sqlite:obo:mondo info MONDO:0010089 -O obo`. Its causal-gene relationship (RO:0004003 HGNC:11460 SUOX) and OMIM xref (OMIM:272300) both match the gene and OMIM identifier on the WP-002 issue row, and Orphanet:99731 matches the ORPHA column, so the entity identity is confirmed and no named-entity confusion is present. A repo-wide grep for "SUOX" and "sulfite oxidase" under kb/ returned nothing before this change, confirming the entry is genuinely new rather than a duplicate of an existing disorder.

    Scope decision: created as a standalone kb/disorders/ entry rather than a subtype of an existing file. Its pathograph skeleton (sulfite to S-sulfocysteine to NMDA-receptor excitotoxicity) is not shared with any curated entry; the closest neighbour, Ethylmalonic_Encephalopathy, is a different enzymatic lesion in the same ICIMD group. Molybdenum cofactor deficiency is captured as a differential_diagnoses entry, not as a subtype, because its lesion is in cofactor biosynthesis rather than in SUOX.

    Content: 11 pathophysiology nodes across two mechanistic arms (the excitotoxic S-sulfocysteine arm and the newer sulfite/persulfidation-H2S arm), two subtypes (Classic and Late-onset ISOD), 19 phenotypes, 6 biochemical markers, one genetic block, 5 treatments, one differential diagnosis, and two discussions. The "NMDA Receptor Overactivation and Loss of GABAergic Inhibition" node declares conforms_to epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance, specializing the module's GABAergic-neuron and GABA-signalling substrate with the disease-specific SSC agonism and calpain-gephyrin arm.

    Evidence discipline: 10 PMIDs, all fetched with `just fetch-reference`; no references_cache file was hand-written. Every one of the 48 evidence snippets was verified as an exact whitespace-normalized substring of its cached record before the entry was written. Frequency bands are backed by the quantitative counts in the PMID:28980090 47-patient review (100 percent hypotonia gives OBLIGATE, 84 percent seizures and 97 percent developmental delay give VERY_FREQUENT) and by the explicit "(rarely)" qualifier in GeneReviews for hemiparesis, giving VERY_RARE.

    Two deliberate epistemic markers were added rather than glossed over. First, a HUMAN_MODEL_MISMATCH discussion records that the SSC/NMDA-receptor/calpain/gephyrin chain was demonstrated in molybdenum cofactor deficiency models and primary murine neurons, not in ISOD patients, and it carries a REFUTE evidence item (PMID:39749013) showing that glutamate-receptor blockade did not rescue SSC toxicity in HT-22 cells. Second, a KNOWLEDGE_GAP discussion records that no primary evidence was found for the commonly repeated claim that sulfite cleaves zonular disulfides to cause ectopia lentis, so that mechanism is stated as a hypothesis in the node description and excluded from the evidenced causal chain.

    Known limitation: HP:0001522 (Death in infancy) is outside the Phenotypic abnormality subtree used by the PhenotypeTerm dynamic enum, so mortality is modeled as a pathophysiology consequence node instead of a phenotype; this is noted in the entry's notes field.

    Validation run before commit: schema validation via `just validate` (pass), ontology term and label validation via `just validate-terms` (pass), `just validate-references` (pass), plus the manual substring check of all snippets described above.

  summary: 'Address review: snippet precision and male breast cancer grading'
  details: |
    Second session record for this entry, covering the response to the second ai4c-reviewer round. The first record describes the pre-review state and is left unedited because records are append-only. Four evidence snippets were bare number fragments that could not identify their own subject; each was replaced with the full propositional sentence from the same cached paragraph. The worst case was the c.1100del odds ratio, whose source paragraph contains five different odds ratios, so the fragment did not establish which allele the 2.66 figure belonged to. Male breast carcinoma was asserted as a phenotype while ACMG places it in the same insufficient-evidence list used to justify keeping colorectal, thyroid and kidney out of the phenotypes section; both sides are now cited on the phenotype itself, as a SUPPORT item giving the allele-specific ten-fold male risk for c.1100delC and a REFUTE item quoting the ACMG grading, with the description stating why the phenotype is retained and what would justify moving it. Also added variant_origin GERMLINE to all three genetic entries, Variant.functional_effects distinguishing complete kinase abrogation from reduced-but-not-abolished function, and a review_notes block warning a future curator not to normalise the two relationship_type values or misread the gnomAD allele frequencies as case shares. Five remaining DOI caches, all DOI-keyed duplicates of cited PMIDs, were dropped. Validated with just validate (45/45 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets and check-reference-titles.

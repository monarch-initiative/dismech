  summary: Review CHEK2 variant risks, tumor mechanisms and clinical evidence
  details: |
    Reviewed the existing entry, research report and cached references, using full GeneReviews, ACMG guidance, primary pathology and CARRIERS studies, genome-first cancer ascertainment, biallelic tumor genomics and phenotype data, mouse and biochemical experiments, and screening microsimulation. Corrected the p.Ile157Thr risk attribution and separated germline loss, somatic second hits, signaling, apoptosis and model-specific instability. Preserved checkpoint and HRD limits, added pathology with denominators, diagnostic origin pitfalls, individualized surveillance and tumor-specific olaparib eligibility, and verified six registry statuses. The biallelic cohort results, rather than its inconsistent discussion sentence, supply the multiple-tumor denominator. Updated evidence provenance and ontology bindings. Clinical, genotype, mechanism, treatment/trial, diagnostic, prognosis and reference completeness were cross-checked against the research report; no established clinical subtype was missing.

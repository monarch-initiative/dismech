  summary: 'Create: CHEK2-related Cancer Predisposition'
  details: |
    Created the entry for germline CHEK2 cancer predisposition. Deep research was run with falcon; the report resolved 10/10 of its references but cited only DOIs, so each was converted to a PMID through the PMC ID converter and cited as a PMID. The report's own term validation flagged HP:0030766 as bound to 'multifocal breast carcinoma' when HPO calls it 'Ear pain', and GO:0090305 as obsolete; neither was used. The GeneReviews baseline (PMID:40440438, tagged GeneReviews) was retrieved and cross-referenced, together with the ACMG clinical practice resource (PMID:37490054). Three curation judgements are worth recording. First, the pathograph does not assert a failed p53 checkpoint: the mechanism review states CHK2's role in activating p53-dependent arrest is dispensable, so the node is curated as attenuated ATM-CHK2 signalling and the edges to tumour phenotypes are INDIRECT_UNKNOWN_INTERMEDIATES, with a KNOWLEDGE_GAP discussion recording that the primary series calls the mechanism uncertain. Second, the refuted Li-Fraumeni association is curated as a CONTROVERSY discussion carrying two REFUTE evidence items rather than being omitted, because the claim persists in older literature. Third, colorectal, thyroid and kidney associations were NOT curated as established phenotypes: GeneReviews grades them less well established or conflicting, and my initial draft asserting them was corrected. Validated with just validate (33/33 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-snippet-grading.

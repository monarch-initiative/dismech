  summary: 'Create: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete
    ISG15 Deficiency'
  details: |
    New Disease entry for MSMD due to complete ISG15 deficiency (MONDO:0014502,
    OMIM:616126, ORPHA:319563), gene ISG15 (hgnc:4053), autosomal recessive.

    Lump/split decision: curated as ONE entry covering both the mycobacterial (MSMD)
    and the type I interferonopathy presentations, not split. Both come from the same
    biallelic ISG15 null genotype, and the founding MSMD patients were later found on
    CT to have the same basal ganglia calcification that brought an unvaccinated
    kindred to attention through neurology. The presentation split tracks BCG exposure,
    not genotype. Recorded in the entry `notes` so the decision is visible without the
    PR thread.

    Pathophysiology is modelled as one lesion with two arms: (a) loss of secreted free
    ISG15 -> reduced IFN-gamma from NK/T cells -> failed macrophage activation ->
    uncontrolled mycobacterial replication; (b) loss of free intracellular ISG15 ->
    accelerated SKP2/ubiquitin-dependent USP18 degradation -> sustained type I IFN
    signalling and ISG over-amplification -> tissue inflammation (skin ulceration,
    basal ganglia calcification, seizures, interstitial lung disease, autoantibodies),
    with enhanced cellular antiviral resistance as a separate consequence of the same
    node. The ISG-amplification node declares
    `conforms_to: jak_stat_pathway_activation#Sustained STAT-Driven Target-Gene
    Transcription`; that module node's own description names an interferon-stimulated
    gene signature as one of its disorder-specific output programs. The module's
    sibling node `Loss of SOCS-Mediated Negative Feedback` was considered and rejected:
    it names SOCS1/SOCS3 explicitly, and USP18 is a different brake.

    Sources: PMID:22859821 (Science 2012, founding MSMD report, full text),
    PMID:25307056 (Nature 2015, USP18 stabilisation and interferonopathy, full text),
    PMID:32402279 (Cell Rep 2020, necrotising skin lesions, full text), PMID:27193971
    (Nat Commun 2016, species divergence in antiviral immunity), PMID:38115997 (Front
    Immunol 2023, baricitinib), PMID:40318816 (Gene 2025, missense allele, infant),
    PMID:39365299 (J Clin Immunol 2024), PMID:38025345 (MSMD review, for the IUIS gene
    set), ORPHA:319563.

    Negative-existence claims, each verified by running the query rather than asserted:
    - No GeneReviews chapter. `just check-genereviews --online` returns
      GeneReviews NO_CHAPTER=1 / StatPearls NO_CHAPTER=1; PubMed `ISG15[TI] AND
      genereviews[book]` returns zero records.
    - No ClinGen gene-disease validity assertion for ISG15. The full Gene-Disease
      Validity table was downloaded (file created 2026-09-23, 3,676 assertions) and
      contains no ISG15 row, while carrying other MSMD genes such as STAT1.
    - ECTO has no BCG-specific exposure class. `runoak -i sqlite:obo:ecto search`
      for `l~BCG`, `l~Calmette` and `l~bacille` each return nothing; `l~mycobacter`
      returns only M. tuberculosis and M. avium exposure classes. The environmental
      entry is therefore bound to ECTO:2000129 `exposure to vaccination`, the most
      specific true class, with the vaccine identity in `preferred_term`. An earlier
      draft of this entry would have claimed ECTO had no vaccination class at all,
      following the sibling IL12B entry's note; re-running the search refuted that,
      which is why the binding exists.

    Species mismatch recorded as a HUMAN_MODEL_MISMATCH discussion
    (`isg15_mouse_human_antiviral_mismatch`) plus a `FAILS_TO_RECAPITULATE` animal-model
    link, rather than as prose: Isg15-null mice are virus-susceptible and
    ISG15-deficient humans are not, and PMID:27193971 gives the mechanistic reason
    (human ISG15 sustains USP18, mouse Isg15 does not).

    Known gaps, left open rather than filled: no published frequency for interstitial
    lung disease, recurrent pneumonia, developmental delay or skin ulceration; no pooled age at onset for BCG disease in this
    etiology specifically (the onset descriptor carries the category and a note saying
    why no mean is recorded); no recombinant IFN-gamma treatment entry, because no
    cited source reports it being given in ISG15 deficiency - the MSMD-general
    production-versus-response therapeutic split would have been a weaker adjacent
    citation; no `datasets:` block; HPO has no term for a transcript-level interferon
    signature, so the laboratory phenotype binds the circulating IFN-alpha term and
    the notes record the difference.

    Deep research: one report, `just dr_fallback='--fallback' research-disorder
    falcon <Slug>`. Falcon returned HTTP 402 (account out of credits) and the run
    fell back to openscientist, which produced the report in 1,950 s. The output
    file keeps the `-falcon` suffix, but its frontmatter records
    `provider: openscientist`, `fell_back: true`, `requested_provider: falcon` and
    the full `provider_attempts` list. `just preflight-dr <report> MONDO:0014502`
    returned WARN, not FAIL: the expected gene ISG15 is mentioned 63 times and the
    rival gene USP18 26 times, which here reflects USP18 being ISG15's binding
    partner in the mechanism rather than a second disease mixed into the report.
    The report carried no validation sections, so they were added in place with
    `just validate-research-reference` and `just validate-research-terms`: 12/12
    references resolved with no confabulations, and of 39 terms, 3 are named as a
    different term and 6 are worth a second look.

    Three CURIEs the report suggested were rejected after independent lookup, none
    of which reached the entry: CHEBI:145303 offered as baricitinib resolves to
    MG(18:1(11Z)/0:0/0:0) (the entry uses CHEBI:95341, whose canonical label is
    baricitinib); HP:0031381 offered as "increased circulating interferon" resolves
    to Decreased mitogen-induced T-cell proliferation; NCIT:C1471 offered as
    Interferon Gamma resolves to Lamivudine. The report's own term-validation
    section flags the latter two.

    Four references were added from the report as leads and then read against the
    primary source before use: PMID:37984483 (two siblings with the same Y140X
    allele presenting differently, one with recurrent parenchymal pneumonia - the
    source for the recurrent-pneumonia phenotype and the intrafamilial-expressivity
    sentence in `inheritance`), PMID:41743834 (interferon-driven fibrosis and
    impaired wound healing - the source for the fibrotic-scarring phenotype),
    PMID:38381212 (an Aicardi-Goutieres post-mortem showing extensive intracranial
    calcification despite baricitinib from two months of age, added to the JAK
    inhibition treatment as an explicitly cross-disease caveat graded INDIRECT,
    because no ISG15-specific long-term neurological follow-up exists), and
    PMID:38115997's developmental-delay observations. PMID:29100055 was taken the
    same way, and names the receptor for the extracellular arm: free ISG15 signals
    through LFA-1 (CD11a/CD18), binding the CD11a alphaI domain.

    The committed report's reference validation resolved and cached five PMIDs the
    entry does not itself cite (20591702, 23579383, 28165509, 29100055, 38381212 -
    the last is now cited). Those cache files are committed with the report, since
    the validation section the report carries was produced from them.

    Validation: `just validate`, `just count-verified-snippets` (80/80),
    `just validate-terms`, `just check-duplicate-keys`, `just check-entity-refs`,
    `just check-causal-targets`, `just check-qualifier-terms`, `just check-enum-values`,
    `just list-gene-term-mismatches` (0 findings, 2/2 compared),
    `just check-genereviews --online`, `just check-snippet-length`,
    `just check-title-snippets`, `just check-snippet-grading`,
    `just check-folded-hyphens`, `just check-environmental-evidence`,
    `just check-coarse-phenotypes`, `just check-reference-titles`,
    `just backfill-reference-titles` (added 0 titles - every item already had one),
    `just list-disconnected-phenotypes` (10 of 12 phenotypes causally connected; the
    two laboratory readouts attach via `reports_on`, which is observational by
    design), and `just validate-disorders` as the final gate.

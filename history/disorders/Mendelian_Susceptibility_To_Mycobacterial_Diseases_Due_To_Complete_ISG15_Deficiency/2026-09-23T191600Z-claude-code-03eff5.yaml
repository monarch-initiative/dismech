  summary: 'Review round 1: regrade three ex vivo PMID:22859821 items to IN_VITRO'
  details: |
    ai4c-reviewer[bot] review 5293351880 gave CHANGES_REQUESTED with one blocking
    item: three PMID:22859821 evidence items graded HUMAN_CLINICAL are ex vivo
    leukocyte experiments and should be IN_VITRO. Verified each against the cached
    reference text before changing it, and agreed:

    - The ISG15-blockade edge evidence ("ISG15 blockade markedly decreased IFN-γ
      secretion.") is an anti-ISG15 antibody added to whole blood from 10 healthy
      donors ex vivo - no patient sample - so IN_VITRO.
    - The add-back evidence ("The addition of recombinant human ISG15 restored
      IFN-γ concentrations to almost normal levels") is recombinant protein added
      to patient whole blood in culture, so IN_VITRO.
    - The control-leukocyte secretion evidence ("BCG induced the release of ISG15
      into the supernatants of control leukocytes...") is a culture-supernatant
      measurement, so IN_VITRO.

    The two patient whole-blood IFN-γ diagnostic measurements ("Whole blood
    leukocytes from P1, P2 and P3...produced only small amounts of IFN-γ", at two
    locations) were left HUMAN_CLINICAL, as the reviewer advised, because they are
    diagnostic measurements on patient samples.

    No other change. The reviewer's non-blocking suggestions were dispositioned in
    the PR comment: the -falcon-suffix sentence was already corrected by the
    coordinator's rename commit f1764cd and PR-body update, and the ECTO-note
    correction in the IL12B / Immunodeficiency_88 / Immunodeficiency_69 entries is a
    separate follow-up left out of this PR.

    Re-validated after the change: just validate (80/80 snippets), just

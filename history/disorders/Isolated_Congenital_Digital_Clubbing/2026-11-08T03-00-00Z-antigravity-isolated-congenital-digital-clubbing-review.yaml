  summary: Enriched isolated congenital digital clubbing with Harrison's classifications, HPGD and SLCO2A1 pathophysiology grounding, diagnostic terms/results, and clinical screening follow-up.
  details: Added DERMATOLOGY and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications backed by PMID:18805827. Grounded the HPGD variant node with gene and wild-type 15-PGDH molecular function (GO:0016404, leaving decreased catabolic activity on the downstream enzymatic node), added a SLCO2A1 prostaglandin transporter impairment node grounded with prostaglandin transmembrane transporter activity (GO:0015132), prostaglandin transport (GO:0015732), and downstream evidence from PMID:36833358 (including normal systemic PGE2 in the tested family), and enriched the distal digital connective tissue proliferation node with inferred fibroblast cell type and increased cell proliferation (GO:0008283). Added NCIT diagnosis_term bindings, presence, and results to diagnostic entries, diagnostic flags on both clubbing phenotypes, germline/AR annotations on genetic records, and a SCREENING action (NCIT:C15419 Disease Screening) for periodic clinical follow-up backed by PMID:36833358.

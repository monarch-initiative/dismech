  summary: 'Create: Isolated_Congenital_Digital_Clubbing'
  details: |
    New entry for isolated congenital digital clubbing (MONDO:0007343), claimed in issue 15341. Deep research: one Perplexity report (research/Isolated_Congenital_Digital_Clubbing-deep-research-perplexity.md; 13/13 extracted references resolved). The report body cites inline reference numbers (up to [440]) that do not correspond to its 51-entry citation list, so no claim was taken from the report on its word; every claim was re-anchored to a PubMed abstract or open full text fetched into references_cache. The report's suggested GO:0006694 for prostaglandin catabolic process is in fact steroid biosynthetic process and was not used (GO:1905344 bound instead). Its claim that p.Ser193Pro raises urinary PGE2 less than twofold could not be traced to a citation and is not recorded; the gene-discovery paper is MeSH-indexed for urinary PGE2 but its full text was not available.

    Lump/split: kept as its own Disease rather than a PHO subtype, because MONDO classifies it under inherited isolated nail anomaly and it is defined by the absence of PHO features; the allelic overlap with PHOAR1 (same c.577T>C allele reported with PHO, PMID:29282707) is recorded. SLCO2A1 isolated-clubbing families recorded as locus heterogeneity. relationship_type left unset for both genes because CAUSATIVE is defined as ClinGen Definitive/Strong and no ClinGen record exists.

    An internal red-team review before the PR found an unsupported negative claim (no PGE2 measurement) and an over-generalized shared-PGE2 statement contradicted by normal PGE2 in the SLCO2A1 family (PMID:36833358); both were corrected, along with toe-frequency, quote_role and uncited-claim fixes. Validation: just validate, validate-terms, count-verified-snippets (30/30), check-entity-refs, check-causal-targets, check-snippet-grading and check-genereviews (NO_CHAPTER) all pass.

    PR 15348 review round 1: the CI gate "Check for newly ungrounded genes" failed because HPGD was attached to the variant node, which carries no molecular function. HPGD was moved to the 15-PGDH catabolism node that carries GO:0016404, and nail bed and nail matrix UBERON locations were added to the connective-tissue node at the reviewer's suggestion.

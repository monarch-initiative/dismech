  summary: Address ai4c-reviewer on PR #7276 — port 5 dropped FUMHD items + suggestions
  details: |
    Review-response round for PR #7276. The reviewer approved the lump itself but
    flagged five pieces of FUMHD content dropped during the merge (all with
    already-cached, already-verified evidence) plus non-blocking suggestions.
    Ported/fixed:
    (1) HLH association — restored the systemic_hyperinflammatory_escalation_model
        mechanistic_hypotheses group (status EMERGING, PMID:38457671 "7 of 9
        HLH-2004 criteria" PARTIAL), wired it onto the escalation node's
        downstream DIC edge via hypothesis_groups, and folded HLH into the
        escalation node description.
    (2) Restored the fumhd_escalation_driver KNOWLEDGE_GAP discussion
        (attaches_to pathophysiology#Ulceronecrotic systemic inflammatory
        escalation in FUMHD; PMID:38959922).
    (3) Restored the Cutaneous CD8-positive necrotizing angiocentric
        lymphoproliferative disease differential (PMID:38457671) — the clinical
        partner to the retained atypical-CD8 histopathology node.
    (4) Added FUMHD-specific clonality evidence to the retained clonal node:
        PMID:15583604 (monoclonal T-cell population by Southern blot) and
        PMID:36483219 (monoclonal TCR rearrangement -> worst prognosis), with a
        FUMHD prognostic clause in the node description.
    (5) Restored the FUMHD structured prevalence record (subtype-tagged
        CASES_IN_LITERATURE / ULTRA_RARE; PMID:34287852, PMID:35950146).
    Suggestions: restored biological_scale (ORGANISM on the escalation node,
    CELLULAR on the clonal node); dropped the unsupported interstitial
    pneumonitis/ARDS parenthetical on the pulmonary phenotype; standardized
    evidence_source to HUMAN_CLINICAL for all PMID:34287852 and PMID:35950146
    items (previously mixed OTHER). The two acknowledged ontology-granularity
    mismatches (HP:0000155 Oral ulcer for mucosal involvement; HP:0008066 for
    hemorrhagic bullae) were left as-is per the reviewer (documented in their
    explanation fields). Validated: just validate passes all three stages; the
    7 newly added snippets independently re-verified as exact whitespace-
    normalized substrings of their cached abstracts (the reference validator
    reports Total checks: 0 for this file); edge hypothesis_groups, discussion
    attaches_to, and the prevalence subtype FK all resolve.

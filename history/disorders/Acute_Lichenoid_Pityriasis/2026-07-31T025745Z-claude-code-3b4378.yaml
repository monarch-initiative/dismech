  summary: Address ai4c-reviewer round 2 on PR #7276 — connect FUMHD escalation node + 3 suggestions
  details: |
    Second review-response round for PR #7276. The reviewer verified all five
    round-1 ports restored and approved everything except one structural
    blocker, plus filed non-blocking suggestions.
    (1) BLOCKING FIX — the FUMHD escalation node
        (Ulceronecrotic systemic inflammatory escalation in FUMHD) had no
        incoming pathophysiology edge, leaving two disconnected mechanism
        components inside the lumped file. Added a downstream edge from
        "Keratinocyte death and epidermal necrosis" -> that node
        (causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES), stating the
        severe-branch relationship that is the entry's thesis. Evidence
        PMID:15840118 "Our case demonstrates the clinical and histological
        continuum between 'classical' PLEVA and FUMHD" (PARTIAL,
        HUMAN_CLINICAL) — already cached/cited on the node; verified as an
        exact whitespace-normalized substring of references_cache/PMID_15840118.md.
    Suggestions addressed:
    - Standardized evidence_source to HUMAN_CLINICAL throughout for the two
      internally-split FUMHD case/mortality reviews PMID:36483219 (7 items) and
      PMID:38959922 (1 item) — both are pooled human case data per CLAUDE.md.
    - Added measure_type: UNKNOWN + prevalence_class: RARE to the PLEVA-level
      prevalence record (matching its "rarity without a rate" notes), removing
      the asymmetry with the FUMHD record below it.
    NCIT-resolution correction to the first event above: that event's details
    say the three treatment actions were converted to NCIT:C15986
    (Pharmacotherapy); the subsequent origin/main merge (10bbafee) superseded
    those with the more specific NCIT:C15620 (Antibiotic Therapy, erythromycin),
    NCIT:C122078 (Topical Corticosteroid Therapy), and NCIT:C122080 (Systemic
    Corticosteroid Therapy); the skin-biopsy NCIT:C51692 was unchanged. This
    branch's tree carries main's more specific terms.
    Deliberately NOT changed: the new differential
    "Cutaneous CD8-positive necrotizing angiocentric lymphoproliferative
    disease" is left without a disease_term. The closest MONDO term
    (MONDO:0015811, primary cutaneous aggressive epidermotropic CD8+ T-cell
    lymphoma) is epidermotropic, not angiocentric — a genuine entity mismatch,
    so per the reviewer leaving the term off is the correct call.
    Validated: just validate passes schema+terms+references; the newly added
    escalation-edge snippet verified against its cached abstract.

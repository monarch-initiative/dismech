  summary: Fold FUMHD into Acute Lichenoid Pityriasis as an enriched subtype
  details: |
    Lumped Febrile Ulceronecrotic Mucha-Habermann Disease (FUMHD; MONDO:0023134)
    into this Acute Lichenoid Pityriasis (PLEVA; MONDO:0024250) entry as an
    enriched clinical_severity_variant subtype, and retired the standalone
    kb/disorders/Febrile_Ulceronecrotic_Mucha-Habermann_Disease.yaml entry (and
    its history record) that had briefly landed via PR #7224. Rationale: FUMHD is
    a severity variant of PLEVA (MONDO subclass), which per dismech convention is
    modeled as a subtype rather than a distinct entry; the sibling already
    modeled FUMHD as has_subtypes[0], so a standalone entry created a parallel,
    drift-prone model. FUMHD MONDO identity is preserved on subtype_term.
    Ported verified FUMHD-specific content (all subtype-tagged where applicable):
    systemic/severe phenotypes [pulmonary HP:0002086, cardiac HP:0001626, GI
    HP:0011024, CNS HP:0000707, seizures HP:0001250, DIC HP:0005521, sepsis
    HP:0100806, cutaneous necrosis HP:0033126, hemorrhagic bullae HP:0008066,
    mucosal involvement HP:0000155 with the mortality REFUTE conflict, cytopenias
    HP:0001873/HP:0001882]; the TNF-alpha amplification arm on the FUMHD
    escalation node [GO:0033209, PMID:15840118] with downstream edges to
    DIC/sepsis; FUMHD treatments IVIG [NCIT:C121331, PMID:38234081], TNF-alpha
    inhibitor/infliximab [NCIT:C1789, PMID:23391565, 42178566] with a
    target_mechanisms INHIBITS join to the escalation node, ciclosporin
    [CHEBI:4031, PMID:35950146], and antimicrobial/infection control [NCIT:C258,
    PMID:36483219, 42178566]; the atypical CD8 lymphomatoid histopathology node
    [PMID:38457671]; the Nofal diagnostic-criteria node [PMID:26695875]; a FUMHD
    optimal-treatment knowledge-gap discussion; and male-predominance data
    [PMID:35950146] on the subtype. Also converted all four pre-existing MAXO
    terms in this entry to NCIT per maintainer instruction (skin biopsy
    -> NCIT:C51692; three treatment actions -> NCIT:C15986 Pharmacotherapy with
    existing CHEBI/NCIT therapeutic_agent). Deep research provenance for FUMHD is
    the OpenScientist run at research/Febrile_Ulceronecrotic_Mucha-Habermann_Disease-deep-research-openscientist.md
    (Falcon/Edison was 402/out-of-credits). Validated: just validate passes
    schema+terms+references; all newly added PMID snippets verified as exact
    substrings of cached abstracts; no MAXO remains; subtype foreign keys and
    pathograph downstream/target_mechanisms all resolve.

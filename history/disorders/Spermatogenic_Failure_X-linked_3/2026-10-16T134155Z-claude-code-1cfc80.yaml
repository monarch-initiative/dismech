  summary: 'Create: Spermatogenic Failure X-linked 3 (CFAP47)'
  details: |
    New entry for SPGFX3 (MONDO:0025354), X-linked recessive asthenozoospermia/MMAF caused by hemizygous CFAP47 variants. Deep research with the claude_code provider (research/Spermatogenic_Failure_X-linked_3-deep-research-claude_code.md; preflight-dr matched CFAP47) was used as leads only; PubMed search added the central-apparatus cryo-ET study with two truncating-allele men (PMID:40473901), a recurrent missense family (PMID:37424856), PCD-like reports (PMID:37723893, PMID:40636384) and an AOA case series (PMID:42522280). Inheritance bound to HP:0001419. ClinGen Limited (XL, 2023) copied from the CGGV record; ClinGen's Disputed PKD curation is noted only. Pathograph: CFAP47 loss (GO:0008017 microtubule binding and GO:0005200, DECREASED) -> C1-C2 bridge loss -> reduced motility (and, mechanism unknown, MMAF) plus CFAP65 mislocalization -> MMAF. Two hypotheses: phenotypic spectrum (MMAF vs asthenozoospermia with normal morphology) and sperm restriction vs PCD, with REFUTE items and stated weakness of the PCD evidence. Two mouse models, one FAILS_TO_RECAPITULATE MMAF, with SPECIES_MISMATCH divergences. ICSI outcomes including AOA, X-linked counselling, exome/CNV testing, semen analysis, TEM, immunofluorescence. No GeneReviews/StatPearls chapter. Stub stubs/Spermatogenic_Failure_X-linked_3.yaml deleted. Validated with the same gates.

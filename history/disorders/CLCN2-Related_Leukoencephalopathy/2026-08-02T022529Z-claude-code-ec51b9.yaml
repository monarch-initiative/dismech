  summary: 'Create: CLCN2-Related Leukoencephalopathy (LKPAT, MONDO:0014292)'
  details: |
    New deep curation of leukoencephalopathy with mild cerebellar ataxia and
    white matter edema (LKPAT / CC2L), MONDO:0014292, OMIM:615651, CLCN2
    (hgnc:2020).

    NEC preflight was run with OAK before any content was written. `runoak info
    MONDO:0014292 -O obo` gives `RO:0004003 HGNC:2020`, xref OMIM:615651 and
    `is_a MONDO:0019046 leukodystrophy`; `runoak relationships -p RO:0004003
    --direction down HGNC:2020` returns exactly three CLCN2 disease terms
    (MONDO:0014292 this entry, MONDO:0011576 familial hyperaldosteronism type
    II, MONDO:0011875 EIG11) and only the first is curated here. Three
    off-target records returned by the `CLCN2 leukoencephalopathy` PubMed
    search were read and discarded whole rather than cherry-picked:
    PMID:40140900 (corn-snake pigmentation), PMID:39232641 (a GJB1 case report
    in which CLCN2 is only a differential), and PMID:29079544 (an MLC1
    biochemical retrospective).

    Pathograph: nine nodes running from biallelic loss-of-function CLCN2
    variants through reduced ClC-2 function and surface expression (separable
    gating and trafficking/turnover defects), the GlialCAM/HEPACAM-MLC1
    auxiliary-subunit arm, loss of the channel from the panglial syncytium,
    failure of glial chloride and extracellular ion homeostasis, intramyelinic
    oedema and myelin vacuolation, tract-selective white matter involvement,
    impaired conduction in the affected tracts, and the mild cerebellar and
    pyramidal syndrome - plus two parallel arms for retinal pigment epithelial
    and Sertoli-cell channel loss.

    The mandatory allelic contrast with familial hyperaldosteronism type II
    (heterozygous gain of function, dominant, adrenal zona glomerulosa) is
    curated as a differential diagnosis with six distinguishing features and
    four evidence items, plus a genetic notes block and an OPEN_QUESTION
    discussion asking why loss of function spares the adrenal and gain of
    function spares the brain. kb/disorders/Familial_Hyperaldosteronism.yaml
    was read before writing and was NOT modified.

    Six discussions record the genuine gaps: loss/gain tissue specificity; the
    retracted CLCN2 idiopathic-generalized-epilepsy association (PMID:12612585,
    retracted by PMID:19710717) that MONDO:0011875 and OMIM 607628 still carry;
    the human male-fertility conflict (documented azoospermia versus a patient
    who fathered two children); the unexplained tract selectivity; the total
    absence of human neuropathology (the ultrastructure is mouse, and the human
    electron microscopy was performed on control brains); and unmeasured
    penetrance arising from imaging-first ascertainment in every published
    cohort.

    Term bindings changed or rejected during curation, not merely confirmed:
    GO:0030104 (water homeostasis) and GO:0005615 (extracellular space) are
    both obsolete and were replaced; HP:0001145 (Chorioretinopathy) is obsolete
    so HP:0000532 is bound with the clinical term kept in `preferred_term`;
    HP:0001251 is labelled Ataxia with Cerebellar ataxia as an EXACT synonym,
    so no separate cerebellar-ataxia identifier was invented; GlialCAM's
    HGNC-approved symbol is HEPACAM (hgnc:26361), not GLIALCAM. No frequency
    bands, no penetrance figure and no prevalence rate derived from the
    Japanese founder-allele frequency are asserted anywhere in the entry.


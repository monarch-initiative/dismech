  summary: 'Review response: GeneReviews tag, node rename, finer NCIT binding'
  details: |
    Addressed reviewer findings on PR #7845.

    IMPORTANT (1/1): added `tags: [GeneReviews]` to the top-level `references:` entry
    for PMID:26539602 so GR-baseline audit tooling keys on it. The chapter was already
    exhaustively mined (27 evidence citations across all four GR domains); only the
    machine-readable tag was missing.

    SUGGESTION 2: renamed `phenotypes[14]` from "Psychiatric manifestations" to
    "Depression" so the node name agrees with its single bound term HP:0000716. The
    broader psychiatric context - including the deliberately unbound
    "schizophrenia-like symptoms" wording and the reason it is not bound to
    HP:0100753 - remains in the node description and notes, and the evidence snippet
    still quotes the full GeneReviews phrasing intact. No `attaches_to` reference
    pointed at the old node name.

    SUGGESTION 3 (reviewer premise rejected): rebound `treatments[3]` "Evaluation and
    surveillance of at-risk relatives" from NCIT:C15747 (Supportive Care) to
    NCIT:C92803 (Genetic Screening). The reviewer wrote that "no clearly better
    clinical-action term under NCIT:C25218 presents itself"; that is not correct.
    Verified with OAK on 2026-08-01: NCIT:C92803 is_a NCIT:C15709 (Genetic Testing),
    and its ancestor closure includes NCIT:C15419 (Disease Screening) and the
    NCIT:C25218 root the TreatmentTerm dynamic enum requires, so it is both valid and
    strictly more specific than the previous binding. NCIT:C15747 was additionally a
    poor fit here: its definition is cancer-supportive-care flavoured, it is_a
    NCIT:C49236 Therapeutic Procedure rather than a screening action, and it was
    already carried by treatments[0], so the same term was doing two different jobs.
    The sibling term NCIT:C62694 (Mutation Carrier Screening) was considered and
    rejected: sibs of a proband in an autosomal recessive disorder are at 25% risk of
    being affected, and the GeneReviews recommendation's stated purpose is early
    diagnosis and routine surveillance, not carrier ascertainment. The rationale and
    the OAK check are recorded inline in the treatment's `notes`.

    Independent re-verification performed beyond the review findings:
    - Confirmed with OAK on 2026-08-01 that the entry's existing "no finer term
      exists" notes are accurate rather than asserted: HP:0001145 is obsolete;
      a label search for "cerebellar ataxia" returns no non-obsolete term, so
      HP:0001251 with `preferred_term` is correct; HP:0007166 and HP:0032615 each
      return only themselves under `descendants -p i`, so both "has no children"
      claims hold.
    - Spot-checked quantitative prose against references_cache: PMID:23707145
      ("Seven patients met our inclusion criteria, three with adult-onset disease and
      four with childhood-onset disease" / mutations identified "in three adult and
      three paediatric patients", matching the entry's 7-recruited / 6-solved
      phrasing); PMID:38173802 (12 patients, three novel likely pathogenic missense
      variants, prominent seizures / severe spastic paraplegia / developmental delay);
      PMID:40199115 (c.61dupC allele frequency 0.002152 in the Japanese population,
      onset after age 30, "One male patient had two children"); PMID:20071672
      (photoreceptor loss at 14 days of age preceded by RPE apical microvillus
      elongation).
    - Ancestry check: the "reported in 2026 in a Chinese man" prose traces to the
      source text of PMID:41822756 ("we reported a Chinese man who presented with
      dizziness"), not inferred from the Shanghai author affiliations.
    - Abstract-only check: PMID:26539602 is cached `content_type: abstract_only`, but
      the GeneReviews PubMed record is a four-section structured summary covering
      CLINICAL CHARACTERISTICS, DIAGNOSIS/TESTING, MANAGEMENT and GENETIC COUNSELING,
      and every one of the 27 snippets drawn from it verifies against that cached
      text. No prose claim in this entry depends on GeneReviews full text that is not
      in the cache.

    Not addressed: the "no deep-research artifact in research/" observation, which is
    being handled separately at the batch level.


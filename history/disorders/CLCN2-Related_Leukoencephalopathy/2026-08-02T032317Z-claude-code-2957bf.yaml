  details: |
    Remediation pass over the initial curation, applying an independent adversarial verifier's findings.

    1. differential_diagnoses[0].distinguishing_features: corrected the FH-II recurrence claim. The prose said p.Arg172Gln had been seen "four times independently and twice de novo". references_cache/PMID_29403011.md states "Among the four kindreds with p.Arg172Gln, one mutation (in kindred 318) occurred de novo" and "Among other probands, the p.Met22Lys variant was de novo" - i.e. one de novo Arg172Gln, the second de novo event being a different allele. Rewritten to match.

    2. pathophysiology locations: replaced the parent binding UBERON:0001887 (internal capsule of telencephalon) with UBERON:0014527 (posterior limb of internal capsule) in both places it occurred, and UBERON:0003544 (brain white matter) with UBERON:0002437 (cerebral hemisphere white matter, exact synonym "cerebral white matter"). The previous note asserted that neither finer term was found in UBERON by OAK search; that assertion was false - both resolve via runoak against sqlite:obo:uberon - and it has been replaced with a note recording the actual granularity of each of the four bindings. UBERON:0002437 was already present in cache/enums/anatomicalentityterm_c7eab8227a65.csv on main; UBERON:0014527 is newly added.

    3. phenotypes: the node named "Dysarthria" carried preferred_term "Scanning speech" bound to the parent HP:0001260 (Dysarthria) with no justifying note, while HP:0002168 (Scanning speech) exists and was already in the phenotype enum cache. Renamed the node to "Scanning Speech" and bound HP:0002168, matching the cited snippet from PMID:31291907.

    4. Ancestry and nationality inferred from author affiliation removed. PMID:38173802 was described as a "Brazilian/UK series"; its abstract states no patient nationality and the label came from author affiliations, so it is now "multicentre series". In genetic[0].notes, "(Portuguese paediatric case)" for p.Trp570*, "(China)" for p.Arg753* and "(Italy, subclinical)" for p.His590Pro were likewise unsupported by cached text and were removed; the note now states explicitly that ancestry is not asserted where the source does not state it. Retained: the Japanese attributions (PMID:40199115 states "four Japanese patients" and that c.61dupC has not been reported outside Japan) and the p.Ala506Val attribution (PMID:41822756 states "we reported a Chinese man").

    5. The Vertigo phenotype evidence snippet was lengthened from "hearing loss, tinnitus, vertigo" (4 words) to "auditory symptoms in some (hearing loss, tinnitus, vertigo)", the same verbatim span already used on two sibling phenotype nodes, to clear scripts/check_snippet_length.py --against-ref origin/main.


  summary: 'Create: Cataract_5_Multiple_Types'
  details: |
    New entry for HSF4-related cataract (MONDO:0007290), covering the autosomal dominant DNA-binding-domain form (lamellar and Marner cataract) and the autosomal recessive C-terminal truncation form as has_subtypes rows, since MONDO has no separate term for the recessive families. Inputs: one Perplexity sonar-deep-research report (research/Cataract_5_Multiple_Types-deep-research-perplexity.md; 12/12 cited references resolved). The pathograph runs from the two variant classes to reduced HSF4 transactivation, then four branches (crystallin and beaded filament expression, p53-dependent epithelial cell cycle exit, DLAD-mediated denucleation, ATG9A-dependent autophagic organelle clearance) converging on loss of lens transparency, which conforms to cataract_lens_opacification. Five mouse, fish and dog models are linked to nodes. Five PMIDs recalled from memory before searching PubMed resolved to unrelated papers and were discarded; every cited PMID was taken from the report or an NCBI esearch result and its title checked. validate, validate-terms, check-entity-refs, check-causal-targets pass; 45/45 snippets verified. No GeneReviews chapter exists (check-genereviews: NO_CHAPTER with synonyms).

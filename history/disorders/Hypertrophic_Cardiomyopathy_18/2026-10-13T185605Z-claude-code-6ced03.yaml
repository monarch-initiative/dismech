  summary: 'Review: Hypertrophic Cardiomyopathy 18 evidence and term fixes'
  details: |
    Adversarial review against the cached sources. Removed claims the cited papers do not make: that the phospholamban-null mouse develops no hypertrophy (the cited works report only absence of heart failure into old age), an uncited 2024 ClinGen reappraisal, and that ClinGen's Definitive tier rests largely on dilated and arrhythmogenic alleles. Corrected the dilated cardiomyopathy onset ages (homozygotes in adolescence and early adulthood, heterozygous brothers at 27 and 28) and stopped describing hypertrophy-to-dilatation progression as the rule in L39X homozygotes, since it is documented in one. MLVWT is now reported as the source abbreviates it. Rebound the two ventricular cardiomyocyte cell types from CL:0000746 to CL:2000046. Added Mayo-proband palpitation and Australian-proband dyspnea evidence, marked Landstrom's summary of the Chiu proband as REVIEW_SYNTHESIS, and graded the mouse REFUTE item INDIRECT. relationship_type CAUSATIVE kept: numbered HCM and DCM entries consistently use CAUSATIVE when ClinGen rates the gene Definitive or Strong for a broader lumped disease (for example HCM 1, 4, 7, 8, 10, 11, 13, 28), and the generic Hypertrophic_Cardiomyopathy and Dilated_Cardiomyopathy_1P entries treat PLN the same way.

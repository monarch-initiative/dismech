  summary: 'Create: Hypertrophic Cardiomyopathy 18 (PLN, MONDO:0013475)'
  details: |
    New entry for CMH18 (PLN), replacing the stub. Deep research: research/Hypertrophic_Cardiomyopathy_18-deep-research-claude_code.md (claude_code provider; preflight-dr PASS, PLN mentioned 51 times); report treated as leads only, all claims re-sourced from cached references. Pathograph: L39X truncating variant (loss of SERCA2a inhibition, no dominant-negative effect) -> loss of phospholamban brake -> enhanced SR calcium uptake/contractility (mouse-null evidence, INDIRECT) -> hypertrophic remodelling (Haghighi 2003 hypothesis, INDIRECT_UNKNOWN_INTERMEDIATES) -> HCM, LVH, apical HCM, and (indirect) DCM and heart failure. A separate HYPOTHETICAL promoter-variant node records -77A>G (raises promoter activity) and -42C>G (lowers it). relationship_type CAUSATIVE on HCM-specific evidence (multigenerational L39X cosegregation, independent L39X in an Australian FHC cohort, hypertrophic heterozygotes in two kindreds, Bonferroni-significant HCM case excess in Walsh 2017). gene_disease_validity left empty: ClinGen's only PLN records are Definitive for intrinsic cardiomyopathy (MONDO:0000591, which explicitly lumps CMH18 with CMD1P) and Moderate for ARVC; neither is this entry's MONDO term, so the Definitive record is cited as evidence (list-gene-validity: other_disease). GeneReviews: only the HCM overview (PMID:20301725) applies; tagged. Discussions: mouse/human mismatch, opposing promoter-variant directions, unexplained atrial fibrillation association. Nine single-proband phenotypes (AF, symptoms, NSVT, LA enlargement, MR, WPW) are left without causal edges because no source links them to the mechanism. Validation: validate, validate-terms, count-verified-snippets 81/81, check-causal-targets, check-entity-refs, check-duplicate-keys, check-gene-validity, gene-activity grounding against origin/main, validate-disorders.

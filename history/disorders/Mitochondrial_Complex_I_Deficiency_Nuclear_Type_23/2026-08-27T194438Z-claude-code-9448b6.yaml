  summary: Record the published NDUFA12 heterogeneity exchange
  details: |
    Recorded the published NDUFA12 correspondence exchange, which had been fetched into the
    cache and left uncited.

    PMID:34888988 ("Phenotypic heterogeneity of Leigh syndrome due to NDUFA12 variants is
    multicausal") and PMID:34888984 (the Response to it) argue in print the exact question
    this entry's ndufa12_identical_genotype_variable_phenotype discussion raises. Both are
    indexed without abstracts - the cache records content_type: unavailable for each - so
    neither can carry an evidence snippet, and quoting a title as a finding is precisely what
    check-title-snippets exists to stop. They are listed in the top-level references: block,
    and the discussion rationale now says the exchange exists and that its arguments are
    deliberately not summarized here. The point is to stop a reader concluding the question
    has only ever been raised in passing.

    Left uncited deliberately: PMID:34849584 and PMID:39395749 are Ndufs4 knockout mouse
    papers - the canonical Leigh model, but a different gene, and this entry makes no claim
    that rests on them; PMID:22972949 and PMID:10649489 are general complex I deficiency
    reviews; PMID:34767441 and PMID:38372588 are complex I structure and assembly papers that
    duplicate background the entry already cites more specifically.

    Validation: just validate (61/61 snippets verified), check-entity-refs,
    check-duplicate-keys, validate-terms all pass.

  details: |
    Third correction round on PR #9674. One of the two remaining review findings was correct and is fixed; the other rests on a search that missed the source text, and the underlying material is restored rather than removed.

    The Optic Atrophy frequency error was real and was mine. The first correction round rewrote the phenotype's notes and added the 7/18 cohort quote arguing for FREQUENT, but never changed the frequency field itself - the edit anchored below it. The entry therefore contradicted itself, with prose arguing one band and the machine-readable slot holding the other, which is worse than either alone because a reader checking the reasoning would conclude the value was right. Now FREQUENT.

    The lactate finding was graded CRITICAL as an invented number attributed to the source. It is not invented. The reviewer searched the cache for "2/8", "two of eight" and "2 of 8" and found nothing, and concluded the claim was fabricated. The source prints "two out eight" - the paper is missing an "of" - which is why all three searches failed. The sentence is: "Finally, we highlight that increased lactate levels were detected in only two out eight cases of our new cohort when this testing was performed, whereas plasma pyruvate level was increased in one case with normal plasma lactate."

    Both figures are real and they are not in conflict, because the denominators differ: 10 of 13 is the pooled cohort including previously published cases, two of eight is the authors' own new series. The paper reconciles them itself - "This proportion is lower than in previously reported cases, which is in keeping with a higher prevalence of LLS phenotype in our series" - so the proportion of patients with a normal lactate tracks where in the phenotypic spectrum they sit.

    The record now carries all three sentences with their denominators distinguished, and the notes say what the pair means together rather than leading with either. Both new snippets are quoted exactly, and the explanation on the new-cohort item records the "two out eight" spelling explicitly, so the next reader who searches for the ordinary phrasing and finds nothing does not repeat the same conclusion.

    Worth separating two things the second round did conflate, since the reviewer was right about the effect if not the cause: the previous notes led with the two-of-eight figure and built a "should not be treated as a screening test" framing on it, which understated how often lactate is abnormal. That framing was wrong even though the number was not. Leading with the pooled figure and keeping the new-cohort one as the counterweight is the accurate reading.

    Validation: just validate-disorders passes, 61/61 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-snippet-length.

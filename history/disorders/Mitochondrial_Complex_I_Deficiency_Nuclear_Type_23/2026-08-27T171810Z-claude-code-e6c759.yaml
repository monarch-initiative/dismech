  summary: Add the asymptomatic homozygote and the cohort lactate frequency
  details: |
    Second correction round on PR #9674, adding the two items the re-review raised that the first round did not have. The re-review ran against the title-only commit 2d973c14b, so its findings 2 through 8 - the unmined full text, the missing treatments and biochemical sections, the second variant, the optic atrophy frequency, the bundled terminal node and the inverted NDUFAF2 edge - were already fixed in f57b0d308.

    The asymptomatic homozygote is added to the ndufa12_identical_genotype_variable_phenotype discussion, and the reviewer was right that it strengthens the strongest part of the entry. One reported family includes an asymptomatic sibling of two affected individuals carrying the same variant homozygously, which the authors read as incomplete penetrance. It matters because it sets the range at zero: whatever the modifier is, it can abolish the phenotype entirely rather than merely shifting severity, which rules out any explanation depending on the genotype alone being sufficient. The rationale now says that explicitly and the sentence is cited.

    The cohort lactate figure is added to the plasma lactate biochemical record. Lactate was raised in 10 of 13 patients in whom blood, urine or CSF was measured, so an elevated lactate is the usual finding rather than an occasional one - which is close to the opposite of what the previous notes implied by leading with the counter-case. The notes now give the cohort frequency first and keep the counter-case second, and the explanation records that the denominator counts any of three fluids, so it is not a plasma-specific figure.

    On the reviewer's suggestion to re-source Motor Regression rather than regrade it: the frequency stays OCCASIONAL. The suggested substitutes - delayed milestones in 5 of 18, gait impairment as a presenting feature in 10 of 18 - are different phenotypes, and using either to support a regression band would be the same category error the original grading made. Regression itself is documented in one patient and is not in the pooled manifestation table, which is what the notes already record.

    On the reviewer's correction to their own earlier finding about pathograph-to-phenotype edges: they withdrew it as a convention violation after finding only 6 files in the KB use the pattern. The edges added in the first round are kept. They are correct on their own terms - the tissue-vulnerability nodes do cause the phenotypes they now point at - and a rare pattern is not a wrong one.

    Validation: just validate-disorders passes, 59/59 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-snippet-length.

  summary: Fix inverted compensation edge, split terminal node, add clinical sections
  details: |
    Correction round on PR #9674 in response to review.

    The Bugbot high-severity finding was correct. The NDUFAF2 Compensatory Association node carried a DIRECT downstream edge into Reduced NADH Dehydrogenase Activity, which reads as compensation causing the enzyme deficit. The reduced activity is already caused by the assembly-and-stability node upstream of both. CausalEdge has no polarity slot, so a mitigating relationship cannot be drawn as a downstream edge at all - the edge was removed and a node-level note records why, so the omission is not mistaken for an oversight later.

    Bugbot's two frequency findings were also correct and are fixed:
    - Optic Atrophy was OCCASIONAL; the pooled 18-patient review reports visual impairment in 7 of 18 (38.9%), which is FREQUENT. The MRI n=2 figure I had been reasoning from is a different measure over a different denominator, and the notes now say so.
    - Motor Regression was FREQUENT on the strength of the founding case alone. The pooled review does not list regression among the main or minor manifestations and reports delayed milestones in 5 of 18, so it is now OCCASIONAL with that bound quoted.

    From the reviewer's findings:
    - The terminal node bundled basal ganglia and optic nerve while binding only the former. Split into Basal Ganglia Vulnerability (UBERON:0002420) and Optic Nerve Vulnerability (UBERON:0000941). The split is the point rather than tidying: the two tissues dissociate in the same series, under identical homozygous truncating genotypes, and visual involvement can appear years after a purely motor presentation - which is now curated with the authors' surveillance recommendation attached.
    - The pathograph now reaches the phenotypes. Both new tissue nodes carry downstream edges to phenotypes# targets.
    - PMID:35141356 was cached with full text and only four snippets had been taken from it. It is now the source for a biochemical: section (complex I activity, plasma lactate, plasma pyruvate, each with its published reference interval), a treatments: section, a second variant, three further phenotypes and a prevalence record.
    - treatments: added. Both entries are deliberately negative or neutral. The mitochondrial cocktail is graded PARTIAL because the same sentence that records the prescription records the patient being lost to follow-up. The dystonia entry is graded REFUTE - levodopa and anticholinergics did not work, which is the clinically actionable fact and distinguishes this dystonia from the dopa-responsive dystonias it resembles at presentation.
    - biochemical: added with reference_ranges. Lactate is curated in both directions, with the normal-lactate/raised-pyruvate patient quoted as the counter-case, because a normal lactate does not exclude the diagnosis.
    - Three phenotypes added from the pooled frequency table: kyphoscoliosis (6/18, FREQUENT), seizure (2/18, OCCASIONAL, with the intractable-focal-seizure case quoted as a PARTIAL counterweight to "sporadic"), and dysarthria (OCCASIONAL, with a note that no cohort figure supports a higher band).
    - prevalence: CASES_IN_LITERATURE / ULTRA_RARE, bounded from two directions - 18 published patients, and the negative screen of 122 complex I deficient patients.
    - PMID:41694149 was fetched and uncited without explanation. It is now a diagnosis entry: an NDUFA12 patient initially labelled idiopathic intracranial hypertension. That is a real differential for this entry's readers, since optic atrophy can be the only manifestation with unremarkable brain MRI.

    One term correction found in passing: UBERON:0000941's canonical label is "cranial nerve II", not "optic nerve". The preferred_term keeps the clinical name.

    Validation: just validate-disorders passes, 57/57 snippets verified. Also run: check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens. One new snippet failed check-snippet-length at four words and was widened to the full sentence rather than grandfathered.

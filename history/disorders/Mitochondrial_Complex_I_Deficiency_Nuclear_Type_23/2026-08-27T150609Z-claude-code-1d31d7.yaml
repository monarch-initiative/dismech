    NDUFA12)'
  details: |
    De novo curation of NDUFA12-related mitochondrial complex I deficiency (MONDO:0032627) from the claim in issue #9624.

    DEEP RESEARCH QUALITY - flagged. The claude_code report set needs_review: true. It resolved 11/11 references but validated 0 of 1 quotes, naming PMID:21617257 - the founding NDUFA12 paper, which this entry cites heavily - as carrying an unsupported quote, and scored 9/11 on topic. No quoted material was taken from the report; every snippet was read directly from the cached abstract and all 35 verify against the cache. This is the second consecutive entry in this session where the claude_code report failed quote validation on a paper the entry then cited (the previous was #9623/SRTD6, where 2 of 3 quotes failed). Worth someone looking at whether the provider's quote extraction is systematically unreliable. Falcon/Edison remained unavailable (HTTP 402).

    GeneReviews: PMID:26425749 (Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview) fetched and tagged in top-level references. Its cached record contains only the chapter's purpose statement, not a Clinical Characteristics section, so no phenotype could be cross-referenced from it and nothing is cited to it as evidence. Recording that so it is not mistaken for an unread baseline.

    Five-node pathograph: NDUFA12 loss of function to impaired complex I Q-module assembly and stability, branching to NDUFAF2 compensatory association and to reduced NADH dehydrogenase activity, then to basal ganglia and optic nerve vulnerability.

    Two genuine conflicts in the literature are curated as KNOWLEDGE_GAP discussions rather than resolved by picking a side:

    1. Assembly requirement. miRNA knockdown shows NDUFA12 is necessary for a functional holoenzyme (PMID:24717771), but patient cells with a nonsense allele and no detectable protein still contain fully assembled, enzymatically active complex I (PMID:21617257). The patient-cell evidence item is graded REFUTE against the strict-requirement reading. The proposed bridge is NDUFAF2 paralogue compensation, which PMID:32335026 shows is specific to NDUFA12-mutant cells and absent in cells mutated in other subunits - the specificity control is curated explicitly, because without it the NDUFAF2 association would just be a generic complex I disease response. The discussion names the experiment that would settle it.

    2. Genotype-phenotype disconnect. Protein absence is complete and uniform across reported cases, yet onset and course differ, including within families carrying the same variant. Since the primary lesion does not vary, the modifier lies elsewhere; the discussion argues NDUFAF2 compensation efficiency is the most tractable candidate because it is already measurable by blue native PAGE in existing patient fibroblast lines.

    Judgement calls:
    - The Leigh syndrome phenotype is bound to HP:0012751 (Abnormal basal ganglia MRI signal intensity) rather than to a disease term, with a notes field saying why: within a Disease entry the phenotype slot should carry the observable finding, and Leigh syndrome itself is recorded in parents. A reviewer may disagree; the reasoning is stated rather than left implicit.
    - PMID:34888988 and PMID:34888984 (a published disagreement about whether NDUFA12 Leigh phenotypic heterogeneity is multicausal) were fetched and then not cited, because their cached records contain no abstract text and no snippet could be quoted. That exchange is directly relevant to the genotype-phenotype discussion and should be revisited if the full text becomes available.
    - The rarity item (no mutations among 122 screened complex I deficient patients) is graded PARTIAL because it is a bounding negative result, not positive evidence about the gene.

    Validation: just validate-disorders passes (schema, terms, references), 35/35 snippets verified. Also clean on check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading.

  summary: 'Gene-family review: NDUFA12'
  details: |
    The NDUFA12 lesion node had no molecular function. NDUFA12 is an accessory subunit and paralogue of NDUFAF2 needed late in assembly or for stability of complex I (PMID:21617257); the node now binds structural molecule activity, decreased, with two new evidence items from that paper. The genetic record lacked a variant origin and is now germline. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

  summary: 'Create: ABCB1-Related Acute Transient Encephalopathy'
  details: |
    De-novo curation of OMIM 620950 / MONDO:0975801, claimed in issue 15071 and
    seeded from stubs/Encephalopathy_Acute_Transient.yaml, which this change
    deletes.

    Scope decision. Curated as a Disease entry rather than as a pharmacogenetic
    gene-drug interaction or as a has_subtypes row on another entry. The lesion
    is a rare biallelic germline loss of function rather than a common ABCB1
    polymorphism; the index family's episodes were precipitated by intercurrent
    illness with no drug consistently implicated, so the phenotype does not
    require a substrate exposure; and both reported presentations converge on
    one mechanism. The drug precipitant is carried as an environmental entry
    with an influences_mechanisms TRIGGERS link onto the substrate-accumulation
    node, per the pattern in CLAUDE.md. The reasoning is recorded in the entry's
    own notes as well as here.

    Deep research. One openscientist run,
    research/ABCB1-Related_Acute_Transient_Encephalopathy-deep-research-openscientist.md,
    33 minutes, 12 references all resolved, confabulation_rate 0.0, 9 PMIDs
    cited. Its term_validation block set needs_review, and reading it was worth
    the time: it offered NCIT:C15226 as "Supportive Care" (the ontology calls
    that Dilation and Curettage) and NCIT:C70742 as "Fluid/Hydration Therapy"
    (Treat), plus an obsolete GO:0042493. No CURIE was taken from the report.
    Every term in the entry was looked up through ols: in the step it was
    written. just preflight-dr returned PASS, with ABCB1 mentioned 43 times and
    the MONDO and report OMIM numbers agreeing on 620950.

    Two openscientist jobs were in fact submitted, and only one report is
    committed. The first launch was detached in a way that made it look as
    though it had been killed, so it was relaunched; the original had in fact
    survived and placed a second, date-suffixed report 12 minutes after the
    one used here. The unused report and the reference caches its validation
    pass fetched were deleted rather than committed. The committed report is
    the run the curation was done from and the one preflight-dr was run
    against.

    The report was used as corroboration and for three additions: the
    GABAergic and glutamate-gated chloride conductance step in the drug branch,
    the CF-1 mouse and MDR1-mutant dog models, and the P-gp substrate-breadth
    citation on the avoidance treatment. It converged independently on the same
    two human reports found by PubMed search before it finished.

    Evidence. 67 snippets, 67/67 verified by just count-verified-snippets and 0
    issues from the batched just validate-disorders run. The second family's
    primary report (PMID:32813957, a NEJM letter) caches with no abstract and no
    full text on two fetches, the second with --force, so it is listed under
    references but cited by no evidence item; the claims it would support are
    taken from the 2026 review that reproduces the case (PMID:41837342) with
    quote_role REVIEW_SYNTHESIS. That substitution, and the fact that the
    review's rendering of one allele's coding change contains a letter that
    cannot be a nucleotide (so that allele is recorded at protein level only),
    are written into the entry's notes.

    Phenotypes were cross-checked against the MedGen clinical-feature list for
    the MONDO term. Ataxia, diplopia and abnormal pyramidal sign are on that
    list and are deliberately absent, because their source is the uncitable
    letter; review_notes records that and names them as the first additions if
    its text becomes quotable. just check-genereviews --online returns
    NO_CHAPTER for both Bookshelf collections, so there is no expert phenotype
    baseline.

    No module conformance. blood_brain_barrier_breakdown scopes itself to
    tight-junction disassembly and vasogenic oedema and
    neuroinflammation_glial_activation terminates in bystander neuronal injury;
    this disorder has a structurally intact barrier, normal imaging and full
    reversibility, so conforming would assert either module's terminal node.
    The reasoning is in the entry's notes.

    Validation. just validate (0 issues, 67 snippets, 3 titles),
    just validate-terms, just count-verified-snippets (67/67),
    just validate-disorders (the batched gate), just normalize-cache,
    just check-term-cache-integrity, just check-cache-order,
    just check-duplicate-keys, just check-entity-refs, just check-causal-targets,
    just check-qualifier-terms, just check-coarse-phenotypes,
    just check-enum-values, just check-folded-hyphens,
    just check-block-scalar-comments, just check-snippet-length,
    just check-title-snippets, just check-snippet-grading,
    just check-retired-support-prose, just check-environmental-evidence,
    just check-case-collisions, just check-shared-disease-terms,
    just check-not4curation, just compliance-connectivity and
    just model-scale-audit all pass. 7 of 10 phenotypes are causally connected;
    the three that are not (fever, vomiting, abdominal pain) belong to the
    precipitating illness rather than to the mechanism, and are left unwired
    deliberately. just check-gene-activity-grounding fails, with 387 findings,
    identically on an unmodified checkout of the same commit and with no finding
    naming this entry; that is the pre-existing state recorded in issue 13900.

    Cache rows added: ECTO:9002436, GO:0008559, GO:1990962, MONDO:0975801 and
    the matching enum-membership rows. Reference caches added for the eight
    PMIDs the entry cites plus PMID:32813957.

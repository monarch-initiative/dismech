  summary: 'Review round 1 on PR 15078: coma snippet alignment and three suggestions'
  details: |
    Round 1 from ai4c-reviewer requested changes on one item and offered three
    suggestions. All four are taken in one push.

    Blocking item. The Coma phenotype and the Acute Reversible Neuronal
    Dysfunction to Coma edge both cited PMID:41837342 with snippets that
    verified but did not contain the finding: one quoted the recovery clause,
    the other the dose clause, with explanations that said so. The sentence
    naming the coma is in the same cached record and its em dashes fold under
    normalization, so an ASCII quote verifies. Both places now carry
    "developed severe neurotoxicity including coma and focal neurological
    deficits after a single oral prophylactic dose of ivermectin (0.23 mg/kg)",
    and the recovery sentence is kept as a second item on the phenotype so the
    reversibility stays attested.

    Suggestion 1, taken. That quote also names focal neurological deficits, so
    a Focal neurologic deficit phenotype is added and wired from the same
    upstream node. HPO has no focal-neurologic-deficit term: searches for
    l~focal neurologic, l~neurologic deficit, l~neurological dysfunction and
    l^Focal return nothing that fits. It is bound to HP:0012638 Abnormal
    nervous system physiology, which is coarse, with
    coarse_binding_basis: SOURCE_UNSPECIFIED, because the source says the
    deficits were focal and nothing more. Same binding an existing entry
    (oligoastrocytoma) uses for the same concept.

    Suggestion 2, taken. The Acute encephalopathy descriptor gains
    onset: {onset_category: CHILDHOOD, min_age_years: 5.5}, and the age
    sentence from PMID:32627353 is added as an evidence item on that phenotype
    so the onset is snippet-backed rather than only quoted on an edge. The
    descriptor's own notes record that 5.5 years is the earliest onset on
    record and not a cohort minimum, since the second family's age is not in
    the account available here.

    Suggestion 3, taken. The Delayed Clearance of Proinflammatory Cytokines
    from Brain node was bound to GO:0006954 inflammatory response, which names
    the response and not the failure to clear it. It is rebound to GO:0150104
    transport across blood-brain barrier with modifier DECREASED, the parent of
    the GO:1990962 xenobiotic branch used one node upstream. The node's notes
    record why, and the searches showing nothing narrower exists for the
    mediators themselves: l~cytokine transport returns only GO:0010184
    cytokinin transport, l~cytokine catabolic only GO:0009823 cytokinin
    catabolic process, and l~cytokine clearance and
    l~interleukin-1 beta transport return nothing. All four searches were
    re-run against ols:go immediately before the note was written.

    Suggestion 4 needed no change: the reviewer recorded the three unwired
    illness phenotypes as a correct call, not a finding.

    review_notes was updated so its account of the MedGen features stays true,
    since the two features the reviewed case report does name are now both
    recorded.

    Validation after the round: just validate (0 issues, 71 snippets, 3
    titles), just count-verified-snippets (71/71), just validate-terms,
    just validate-disorders, just validate-history, and the offline gate set
    including check-coarse-phenotypes, check-entity-refs, check-causal-targets,
    check-snippet-grading and check-enum-values all pass. Phenotype
    connectivity is 8 of 11. The CI-mode gene-activity grounding check still
    reports no newly ungrounded genes.

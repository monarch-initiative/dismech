  summary: Added classifications, grounded KHK/ALDOB molecular functions and SHPK tissue expression bindings in pathophysiology, expanded diagnostic testing, and added genetic counseling for Isolated Sedoheptulokinase Deficiency.
  details: >-
    Added Harrison's chapter classifications (ENDOCRINOLOGY_METABOLISM,
    GENETICS_ENVIRONMENT_DISEASE) with verbatim evidence from PMID:25647543.
    Grounded the KHK and ALDOB bypass pathophysiology node with ketohexokinase
    (GO:0004454) and fructose-1-phosphate aldolase (GO:0061609, with
    preferred_term naming sedoheptulose-1-phosphate cleavage by aldolase B)
    molecular function GO terms and cytosol cellular component, and aligned
    SHPK enzymatic activity deficiency locations with liver, kidney, pancreas,
    and heart expression sites without unsourced cell-type bindings. Expanded
    diagnosis with SHPK molecular genetic testing (including the workup note
    on variant interpretation) and fibroblast enzyme assay entries, and added
    autosomal recessive genetic counseling with indirect carrier and
    consanguinity evidence while recording in notes that no disease-specific
    metabolic treatment is established.

  summary: Added classifications, grounded KHK/ALDOB molecular functions and tissue/cell-type ontology bindings in pathophysiology, expanded diagnostic testing, and added supportive and genetic counseling treatments for Isolated Sedoheptulokinase Deficiency.
  details: Added Harrison's chapter classifications (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) with verbatim evidence from PMID:25647543. Grounded the KHK and ALDOB bypass pathophysiology node with ketohexokinase and fructose-bisphosphate aldolase molecular function GO terms, cytosol cellular component, and liver/kidney locations, and added hepatocyte/kidney epithelial cell and tissue location terms to SHPK enzymatic activity deficiency. Expanded diagnosis with SHPK molecular genetic testing and fibroblast enzyme assay entries and added clinical observation/etiological workup and genetic counseling treatments.

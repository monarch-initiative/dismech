  summary: Wire FENIB to serpinopathy module
  details: |
    Wired the ER Loop-Sheet Polymerization node to the serpinopathy module (conforms_to serpinopathy#Serpin Polymerization), the second real conformer of that module and the follow-up its PR (#15927) announced once it reached main. The node is a clean instance of the module key node: destabilised neuroserpin forming loop-sheet polymers retained in the neuronal ER, bound to the same GO:0051258 protein polymerization (INCREASED). Also updated the entry notes, which had said no serpinopathy or ER-stress module exists (true when FENIB was curated, stale once the module merged); the rewrite records the conformance and keeps the reasons loss_of_proteostasis and amyloidogenesis remain inapplicable. No other content changed; re-validated with validate-disorders and check-entity-refs.

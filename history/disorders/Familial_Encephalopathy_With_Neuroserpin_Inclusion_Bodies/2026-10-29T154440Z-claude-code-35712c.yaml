  summary: Wire FENIB to serpinopathy module
  details: |
    Wired FENIB as the neuronal conformer of the serpinopathy module (follow-up its PR #15927 announced once the module reached main), beside the hepatic AATD conformer. Conformance across the chain: ER Loop-Sheet Polymerization -> Serpin Polymerization (key node; same GO:0051258 protein polymerization INCREASED), Neuroserpin Fold Destabilization -> Serpin Conformational Instability (same GO:0006457 protein folding DECREASED), Collins Body Accumulation -> Intracellular Polymer Retention (the retained-polymer inclusions, neuron substituting for the generic secretory cell), and ER Overload Response -> Polymer Proteotoxicity (GO:0006983 ER overload response, the ER-overload framing the module node was written to cover). The key-node link went in first; the other three were added in review round 1 after the reviewer noted more conformance was available. Deliberately NOT wired: Loss of Neuroserpin tPA Inhibition carries GO:0004867 inhibitor activity DECREASED, which matches the module's Circulating Serpin Deficiency on content but not in kind -- neuroserpin is a local CNS serpin, not a circulating/plasma one, so the module's loss-of-function arm (framed on plasma serpins) is not a clean instance here. Also updated the entry notes, which had said no serpinopathy or ER-stress module exists (true when FENIB was curated, stale once the module merged); the rewrite records the conformance and keeps the reasons loss_of_proteostasis and amyloidogenesis remain inapplicable. Round 2: linked the Embelin treatment (experimental anti-polymerization) to the ER Loop-Sheet Polymerization node via target_mechanisms (INHIBITS), reusing its existing verified IN_VITRO snippet (PMID:26732982) so the conformer's drug-target pattern mirrors the module's own investigational polymerization inhibitor; and rewrote the conformance note so it describes the four-node conformance rather than only the key node. Re-validated with validate-disorders, check-entity-refs and check-causal-targets.

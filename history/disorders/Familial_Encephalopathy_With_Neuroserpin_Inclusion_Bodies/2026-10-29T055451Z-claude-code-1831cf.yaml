  summary: 'Create: Familial Encephalopathy With Neuroserpin Inclusion Bodies (FENIB)'
  details: |
    De-novo curation of FENIB (MONDO:0011412, SERPINI1) from a claude_code deep-research report. Single DISEASE entry (variant detail in genetic[].variants; dementia-vs-PME is a variant-severity phenotypic spectrum, not has_subtypes). Atomic unbundled pathograph: SERPINI1 missense variant -> neuroserpin fold destabilization -> ER loop-sheet polymerization -> Collins body accumulation, branching to ER-stress/mitochondrial dysfunction and (secondary, inferred) loss of tPA inhibition -> neuronal loss -> dementia/cortical atrophy/dyskinesia and seizure/myoclonus. No module conformance: loss_of_proteostasis is an aging hallmark and amyloidogenesis is cross-beta, neither fits a Mendelian serpin loop-sheet proteinopathy; reasoning recorded in notes. G392E transgenic mouse linked via modeled_mechanisms. Every snippet verified against cached abstracts and every CURIE/reference_title read from cache/OLS (the report quotes were untrusted leads; one did not match source, and two titles were corrected). All offline gates pass; 19/19 snippets verified.

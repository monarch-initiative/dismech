  summary: 'Create: Familial Encephalopathy With Neuroserpin Inclusion Bodies'
  details: |
    De novo curation of FENIB (MONDO:0011412), autosomal dominant SERPINI1 serpinopathy. Built the polymerization -> ER retention (Collins bodies) -> ER overload response/NF-kappaB, ERAD/autophagy clearance, oxidative/mitochondrial stress, hyperexcitability and neurodegeneration cascade with bare-name causal edges wiring 9/11 phenotypes. conforms_to loss_of_proteostasis (two nodes) and epilepsy_excitation_inhibition_imbalance. Three animal models (Syracuse/Portland mice, G392E mice, Drosophila) with modeled_mechanisms; one KNOWLEDGE_GAP on GOF vs LOF contribution. Evidence from 23 PMIDs fetched via just fetch-reference; all 47 snippets exact-quote verified. No GeneReviews chapter (confirmed with synonyms, online). Validated: schema, terms, references, causal targets, entity refs, snippet grading all clean.

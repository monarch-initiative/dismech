  summary: Review and enrich Familial Encephalopathy With Neuroserpin Inclusion Bodies
  details: 'Audited all claims, snippets, and reference titles in Familial Encephalopathy With Neuroserpin
    Inclusion Bodies (MONDO:0011412). Repaired three reference_title mismatches against cached PubMed
    records (PMID:27618835, PMID:11559315) and replaced unbacked family-count prose in prevalence with
    evidence-backed ULTRA_RARE literature case/family counts (PMID:36417830, PMID:12103288). Added top-level
    description, categories, parents, classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE, proteotoxic
    disease), and references block. Enriched pathophysiology with neuronal cell types (CL:0000540), ER
    and MAM cellular components (GO:0005783, GO:0044233), brain-region locations (UBERON:0000956, UBERON:0001870,
    UBERON:0002038), and Collins-body regional pathology evidence (PMID:11559315). Added phenotype descriptions
    and frequencies, bound NCIT:C120945 (Inclusion Body) on histopathology, enriched Embelin and supportive/counseling
    treatments with therapeutic_modality, NCIT terms, target_mechanisms, and evidence, and added hgnc:8943
    gene binding plus transgenic S49P/S52R mouse model (PMID:17392169).

    '

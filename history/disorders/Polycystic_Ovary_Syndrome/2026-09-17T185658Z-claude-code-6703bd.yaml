  summary: Re-apply outstanding OpenScientist findings
  details: |
    Re-applied the part of the earlier OpenScientist integration sweep (branch os-review-fable) that never merged, rebuilt against current main rather than merged from the old branch. All 16 outstanding citations were absent from main and all were re-applied; every snippet was re-derived from freshly fetched references_cache records rather than copied, and two had to be re-cut because the cached full text uses non-breaking spaces inside the p-value parentheses (PMID:39815717, trimmed before '(p < 0.01 for all)') or because the abstract wording differed (PMID:25304843, now quoting the CONCLUSIONS sentence, which states the claim more directly than the 2-day RESULTS sentence did). Applied: androgen_first_feedback_model gained a notes block recording the PARTIALLY SUPPORTED verdict plus its three qualifications, and five evidence items (PMID:28320971 x2 global and neuron-specific androgen-receptor knockout, PMID:17710731 the review's own androgen-first developmental hypothesis, PMID:32574161 x2 including the authors' limitations statement). insulin_hyperinsulinemia_first_model gained a notes block and three items (PMID:17559844 diazoxide, PMID:26312838 insulin-induced AKR1C3, PMID:26416764 Mendelian randomization). neuroendocrine_lh_first_model gained PMID:16434454, which substantiates qualification (4) in its pre-existing notes (BMI affects pituitary response, not hypothalamic GnRH drive) and was previously uncited. gap_pcos_causal_hierarchy_by_adiposity gained PMID:41180187 and PMID:42026183. Two new KNOWLEDGE_GAP discussions were added: gap_pcos_androgen_to_insulin_resistance_directness (PMID:28320971, PMID:42171672 marked INDIRECT because it is a non-PCOS transmasculine cohort) and gap_pcos_11_oxygenated_androgen_causality (PMID:35696182 marked INDIRECT, PMID:35560164). A new biochemical marker 11-Oxygenated Androgens was added with two PMID:39815717 items and no pathophysiology node, because the supporting evidence is diagnostic discrimination rather than mechanism. The DENND1A genetic entry and the Metformin treatment each gained their first citation ever (PMID:31184707; PMID:25304843), and both notes blocks were corrected - DENND1A now records that the functional route runs through the truncated variant 2 isoform, and Metformin no longer says 'no supporting evidence item curated yet' but instead records that the androgen-lowering effect precedes any insulin-sensitising one, so metformin response is not evidence for the insulin-first ordering. Prenatal Androgen Exposure gained PMID:34529765. Nothing was skipped as already covered: main's own parallel curation added AR and CYP17A1 genetic entries, two environmental exposures, and four emerging treatments, all from PMID:42531755, and none of it touched the sections this change edits. Hypothesis status values are unchanged (ALTERNATIVE, ALTERNATIVE, ALTERNATIVE, EMERGING). Deliberately not carried over: the proposal to retype the androgen-to-insulin-resistance edge, which rested on a misread flutamide trial and is recorded as an open question instead, and all four proposed ontology identifiers, which name different biology. No assessment sidecar was copied; kb/hypotheses/Polycystic_Ovary_Syndrome already carries openscientist-assessment-by-codex records for all three groups on main. Verified with linkml-validate (no issues), count-verified-snippets (104/104), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values - all OK.

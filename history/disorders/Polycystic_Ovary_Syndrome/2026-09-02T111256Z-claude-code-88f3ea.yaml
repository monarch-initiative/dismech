  summary: Integrate assessed OpenScientist findings for the three PCOS causal-priority
    hypotheses
  details: |
    Repo-wide OpenScientist review sweep. All three hypothesis folders under kb/hypotheses/Polycystic_Ovary_Syndrome/ already carried an openscientist-assessment-by-codex.yaml, so no new assessment sidecar was written; integration was driven from the RETAINED and QUALIFIED claims in those three files. Every snippet below was re-derived from references_cache/ after 'just fetch-reference', not copied from the reports.

    androgen_first_feedback_model (PARTIALLY_SUPPORTED). Added a notes: block to the hypothesis entry recording the verdict, the reason status: stays ALTERNATIVE (no PARTIALLY_SUPPORTED value exists in MechanisticHypothesisStatusEnum, and temporal primacy is undemonstrated), and the three assessment qualifications. Added four evidence items: PMID:28320971 x2 (global and neuron-specific androgen-receptor knockout in the DHT mouse, MODEL_ORGANISM), PMID:17710731 (the review's own peripubertal-androgen hypothesis, OTHER), PMID:32574161 x2 (reproductive-cluster DENND1A enrichment plus the authors' own limitations sentence, so the 21-23% figure is not read as a population prevalence). Added PMID:31184707 and PMID:32574161 evidence to genetic: DENND1A, which previously had none, and extended its notes to name DENND1A.V2 as the functional route. Added PMID:34529765 to environmental: Prenatal Androgen Exposure (prenatal-AMH phenotypes require the androgen receptor in kisspeptin cells; mouse only). Added a KNOWLEDGE_GAP discussion gap_pcos_androgen_to_insulin_resistance_directness with PMID:28320971 and PMID:42171672.

    insulin_hyperinsulinemia_first_model (PARTIALLY_SUPPORTED). Added a notes: block recording the co-driver verdict, what survived source check, and the three claims the assessment rejected (the false 'GWAS does not point to insulin genes' claim, the misreported 28-52% NK3-antagonist testosterone contrast, and the metformin meta-analysis treated as proof of parallel pathways). Added evidence PMID:17559844 (diazoxide in lean PCOS), PMID:26312838 (insulin-induced adipose AKR1C3, IN_VITRO) and PMID:26416764 (Mendelian randomization inferring a causal role for insulin resistance). Added PMID:25304843 to treatments: Metformin, which previously had none, and replaced its 'no supporting evidence item curated yet' note with the point that its androgen-lowering effect precedes any insulin-sensitising one.

    neuroendocrine_lh_first_model (PARTIALLY_SUPPORTED). Only one integration candidate remained: PMID:16434454 was added to the hypothesis entry, substantiating qualification (4) in its existing notes (obesity masks pituitary LH output while hypothalamic GnRH pulse frequency stays elevated), which had been asserted without a citation.

    Shared. Added PMID:41180187 and PMID:42026183 to the existing gap_pcos_causal_hierarchy_by_adiposity discussion, since both bear on whether one causal ordering holds across the syndrome. Added a biochemical: 11-Oxygenated Androgens marker with PMID:39815717, and a KNOWLEDGE_GAP discussion gap_pcos_11_oxygenated_androgen_causality with PMID:35696182 and PMID:35560164.

    Deliberately not done. No status: change on any hypothesis group; the reports' 'PARTIALLY SUPPORTED' recommendation is not a permissible enum value and ALTERNATIVE remains correct for three competing causal-priority models. No pathophysiology node was added for 11-oxygenated androgens: the evidence is diagnostic discrimination plus a cell model and a rare-disease cohort, so it is curated as a biochemical marker and an open question instead. No androgen-to-insulin edge was removed or retyped, because the report's argument for doing so rests on a misread flutamide trial that the assessment rejected. Nothing was integrated from REJECTED claims, including the report's proposed CL and GO CURIEs (CL:4023070, CL:0011110, GO:0032274, GO:0060131), all of which name different biology. No ontology term was added anywhere in this change.

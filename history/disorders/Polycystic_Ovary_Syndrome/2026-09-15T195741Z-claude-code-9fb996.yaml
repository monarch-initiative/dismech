  details: |
    PR-shepherd round addressing the round-2 review on PR #8900.

    Blocking item: the Microbiota Modulation Therapy evidence item was regraded
    HUMAN_CLINICAL -> OTHER. The reviewer's point holds - the quoted sentence is the
    review's own forward-looking framing ("represents an emerging strategy"), not a
    reported clinical result, and the entry's own notes already call probiotics and
    FMT investigational in PCOS. Applying the regrade by claim type rather than by
    sentence brings this fourth emerging-therapy entry in line with its three
    siblings. The sentence it quotes is distinct from the one those three share, so
    check-snippet-grading stays clean.

    Suggestion taken: Air Pollution Exposure is now bound to ECTO:8000036 (exposure
    to air pollution), an exact match already present in cache/ecto/terms.csv, so it
    no longer renders as free text beside its two bound siblings. The
    Endocrine-Disrupting Chemicals entry is left unbound on purpose, with a notes
    line recording that ECTO was searched and carries no class-level term at that
    generality - no term beats a bad one.

    Branch state: merged origin/main into the branch (no rebase, no force-push). The
    single conflict was in the environmental: block, where main had meanwhile
    enriched Prenatal Androgen Exposure with a hedged note and two PMID:31499494
    evidence items. Resolution takes main's version of that entry verbatim and keeps
    this PR's two new entries after it; nothing from either side was dropped. Cache
    files auto-merged.

    Not taken this round, and why: the suggested target_mechanisms pathograph links,
    the FMT split out of Microbiota Modulation Therapy, the AR notes rewording, and
    the FSHR cross-citation are all real improvements but are curation judgement
    calls on scientific content rather than review-blocking defects, so they are left
    for the entry's author or a curator rather than decided by the shepherd.


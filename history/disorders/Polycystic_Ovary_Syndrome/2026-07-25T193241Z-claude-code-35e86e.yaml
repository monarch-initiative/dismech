  summary: 'Review: PCOS - four SUPPORT labels on non-matching snippets, misread RCT,
    unannotated standard treatments'
  details: |
    Manual claim-evidence review. Fixed: (1) the Chronic Low-Grade Inflammation node's explanation claimed the astaxanthin RCT (PMID:39036884) 'demonstrat[es] elevated TNF-alpha, IL-18 and IL-6 levels in PCOS patients at baseline' - it does not: the quoted result is treated-arm versus placebo-arm within PCOS, which cannot establish elevation relative to healthy controls; rewritten and downgraded to PARTIAL; (2) four evidence items were labelled SUPPORT on snippets that do not contain the claim - Hirsutism cited a generic 'hyperandrogenism may be causative' sentence, Irregular Menstruation and Infertility both cited AMH/follicle-count sentences that mention neither menstruation nor fertility, and the decreased-SHBG biochemical finding cited a sentence about bioactive androgens that never mentions SHBG; all four downgraded to PARTIAL with explanations stating what is and is not supported; (3) the six standard-of-care treatments (COC, metformin, spironolactone, letrozole, clomiphene, lifestyle modification) had no treatment_term, no therapeutic_agent and no evidence, while the speculative in-silico targets from a computational paper were fully annotated - added MAXO/NCIT treatment terms and CHEBI therapeutic agents to all six, with notes flagging the missing evidence.
    Outcome needs_followup: the bundled 'Granulosa Cell Ferroptosis-Autophagy Crosstalk' node duplicates four atomic nodes in the same file and is referenced by three discussions' attaches_to lists, so restructuring needs a curator decision - filed as issue #6964. No prevalence block exists for a disorder affecting 8-13% of reproductive-age women.

  summary: 'Review: duplicate granulosa-cell nodes - resolved independently on main'
  details: |
    Correctness review finding, recorded for provenance; no change is carried by this branch.

    At review time the pathophysiology graph carried two overlapping nodes for the same
    mechanism, both from the same source (PMID:42178591) and both pointing downstream to
    Ovulatory Dysfunction: 'Autophagy-Ferroptosis Crosstalk in Granulosa Cell Death' and
    'Granulosa Cell Ferroptosis-Autophagy Crosstalk'. This branch originally consolidated
    them by deleting the former and repointing the upstream 'Oxidative and Endoplasmic
    Reticulum Stress' edge to the latter.

    That edit was dropped when the branch was rebased onto main. Main had independently
    resolved the same duplication, and resolved it the other way and better: it kept
    'Autophagy-Ferroptosis Crosstalk in Granulosa Cell Death' as the canonical node and
    repurposed the redundant second node into 'Circadian Disruption and Epigenetic
    Reprogramming in Granulosa Cells', giving it a distinct description, its own
    circadian/epigenetic biological processes, and its own evidence snippet rather than
    reusing the duplicated one. Replaying this branch's version would have deleted the
    node main kept and left a dangling downstream target, so main's resolution was taken
    wholesale and the entry is unchanged relative to main.

    Remaining overlap still worth considering, unaffected by either resolution:
    'Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation' restates the PCSK9 arm that
    is also embedded in the autophagy-ferroptosis node.

  details: |
    Round-3 review blocking item, and a defect the shepherd introduced in the
    previous push rather than one inherited from the entry.

    The Endocrine-Disrupting Chemicals entry carried a notes sentence claiming ECTO
    had been searched and had no term for EDCs as a class. That claim is false:
    ECTO:9001630 'exposure to endocrine disruptor' is in cache/ecto/terms.csv, is in
    the exposureterm enum cache, and is already bound by Mixed_Germ_Cell_Tumor.
    just environmental-term-audit names it as the reuse candidate for this exact
    entry - which is the trap CLAUDE.md records under that recipe for issue #8430,
    where a gap was assumed without running the audit first.

    The sentence was worse than an unbound slot, because it tells a future curator
    not to look. The entry is now bound to ECTO:9001630 with preferred_term
    'exposure to endocrine-disrupting chemicals', keeping the curator-facing wording
    more specific than the ontology label, and the false sentence is deleted rather
    than reworded.

    All four Polycystic_Ovary_Syndrome exposures now audit as BOUND.


  summary: 'Debundle granulosa-cell crosstalk node per PR #7116 review'
  details: |
    Addresses IMPORTANT 1 of the ai4c-reviewer review on PR #7116: the earlier merge produced a
    bundled 'Granulosa Cell Ferroptosis-Autophagy Crosstalk' node carrying at least five distinct
    mechanistic claims.

    Debundled into atomic nodes:
    - Trimmed the crosstalk node to the autophagy-ferroptosis crosstalk itself plus the
      selective-autophagy (ferritinophagy/mitophagy) amplification arm. It keeps only
      GO:0097707 ferroptosis and GO:0006914 autophagy, and only the two evidence items that
      speak to those claims.
    - Restored a dedicated 'Circadian Disruption and Epigenetic Reprogramming in Granulosa
      Cells' node carrying GO:0007623 and GO:0040029 with its own PMID:42178591 evidence item,
      pointing downstream at the crosstalk node. This restores the original topology, in which
      circadian/epigenetic reprogramming entrenches the imbalance rather than being part of it,
      and makes the crosstalk node's name match its remaining GO terms again.
    - Dropped GO:0006979 and GO:0034976 from the crosstalk node; they duplicated the upstream
      parent node 'Oxidative and Endoplasmic Reticulum Stress', where the stress hub belongs.
      The evidence item quoting the OS/ERS initiating-factor sentence was likewise a verbatim
      duplicate of the one already on that parent node and was removed.
    - Removed the PCSK9 sentence from the crosstalk description. It asserted PCSK9-driven
      apoptosis as 'an upstream driver of granulosa cell death' while the sibling node
      'Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation' states in its own description
      that it is independent of the ferroptosis-autophagy crosstalk. The entry no longer
      asserts both.
    - Removed the gut-ovarian axis clause, which duplicated the separate
      'Gut Microbiome Dysregulation and Gut-Ovarian Axis Inflammation' node.
    - Replaced the merge notes. The previous rationale claimed the deleted node had 'the same
      downstream target', which was factually wrong: the circadian node's edge pointed at the
      crosstalk node, while the crosstalk node pointed at Ovulatory Dysfunction.
    - Tagged both nodes biological_scale: CELLULAR.

    Verified: no dangling downstream targets, no GO term shared between a node and its own
    parent, linkml-validate clean, all snippets exact against references_cache.

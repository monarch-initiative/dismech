  summary: Retire bundled Granulosa Cell Ferroptosis-Autophagy Crosstalk node
  details: |
    Retired the 'Granulosa Cell Ferroptosis-Autophagy Crosstalk' pathophysiology node, which bundled five distinct mechanistic claims (OS/ERS hub, PCSK9-AMPK/GSK-3beta apoptosis cascade, ferritinophagy/mitophagy-amplified ferroptosis, gut-ovarian axis dysregulation, circadian/epigenetic reprogramming) that mostly duplicated four existing atomic nodes: Oxidative and Endoplasmic Reticulum Stress; Autophagy-Ferroptosis Crosstalk in Granulosa Cell Death; Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation; Gut Microbiome Dysregulation and Gut-Ovarian Axis Inflammation. Added a new atomic node, 'Circadian Disruption and Epigenetic Reprogramming in Granulosa Cells' (GO:0007623, GO:0040029), citing the same PMID:42178591 snippet previously used only in the bundled node, with a DIRECT downstream edge into Autophagy-Ferroptosis Crosstalk in Granulosa Cell Death, matching how the Oxidative/ERS node already feeds that same target. Re-pointed the two discussions that referenced the bundled node by name (gap_pcos_granulosa_apoptosis_pcsk9's attaches_to and two proposed_experiments readout targets/would_support; gap_pcos_pcsk9_granulosa_mouse_model_mismatch's attaches_to) to Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation, since both discussions are specifically about the PCSK9-AMPK/GSK-3beta cascade rather than the generic ferroptosis-autophagy crosstalk. GO:0007165 signal transduction, flagged as uninformative filler, was removed along with the retired node since it was only present there. No downstream edges were duplicated: the retired node's edge to Chronic Low-Grade Inflammation is already independently carried by the Gut Microbiome Dysregulation atomic node's own downstream edge to that target. Validated with just validate, just validate-references, and just validate-terms-file; pytest tests/test_data.py foreign-key/discussion checks pass.

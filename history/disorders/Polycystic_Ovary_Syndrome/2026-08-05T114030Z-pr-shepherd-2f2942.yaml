  summary: Remap MAXO treatment terms to NCIT; fix folded-scalar hyphen splits
  details: |
    Follow-up PR Shepherd commit on PR #7840, fixing two CI gates that could not run while the branch was conflicted.

    MAXO REMOVAL FALLOUT. Merging origin/main brought in the repo-wide MAXO removal, which invalidated four MAXO terms still bound in this PR's entries. These were valid when the entries were written and when the review was performed; main retired the ontology afterwards. Term validation failed with "Value 'MAXO:...' not in dynamic enum 'TreatmentActionTerm'". Remapped each to its NCIT equivalent, verified with OAK before use, rather than stripping the treatment_term blocks as main's own MAXO removal did for PCOS - stripping would have discarded this PR's added treatment structure.

    - MAXO:0000088 dietary intervention to NCIT:C15447 Dietary Intervention in Gestational_Diabetes_Mellitus. This mapping is documented explicitly in CLAUDE.md.
    - MAXO:0000861 labor induction to NCIT:C92814 Induction of Labor in Intrahepatic_Cholestasis_of_Pregnancy.
    - MAXO:0000234 aromatase inhibitor agent therapy to NCIT:C15525 Aromatase Inhibition Therapy in Polycystic_Ovary_Syndrome.
    - MAXO:0010130 oral contraceptive agent therapy in Polycystic_Ovary_Syndrome had no NCIT clinical-action equivalent - NCIT:C389 and NCIT:C29640 are an agent and a preparation, not actions, and are not reachable from NCIT:C25218. Applied the CLAUDE.md therapeutic-agent pattern instead: generic action NCIT:C15986 Pharmacotherapy plus therapeutic_agent NCIT:C389 Oral Contraceptive. This preserves machine-queryable drug identity rather than forcing an ill-fitting action term.

    Zero bound MAXO terms remain anywhere in kb/; the only surviving reference is an explanatory prose note in Paroxysmal_Dyskinesia.yaml, which is unchanged and on main already.

    FOLDED-SCALAR HYPHEN GATE. check_folded_hyphens.py reported three new findings, all lines inside folded scalars ending in a hyphen, which folds into a broken compound word. Reflowed each so the compound stays on one line: large-for-gestational-age in Gestational_Diabetes_Mellitus, tertiary-lymphoid-structure in Hashimotos_Thyroiditis, third-trimester in Intrahepatic_Cholestasis_of_Pregnancy. No wording was changed, only line breaks.

    Validation: all four touched entries pass schema and term validation. Reference validation: 22/22 on Gestational_Diabetes_Mellitus, 22/22 on Intrahepatic_Cholestasis_of_Pregnancy, 72/72 on Polycystic_Ovary_Syndrome, 53/54 on Hashimotos_Thyroiditis with one skipped by prefix. check_folded_hyphens.py now reports OK with no new findings. check-term-cache-integrity OK at 17 term and 24 enum files; check-cache-order OK.

    Cache rows for the five NCIT terms plus CHEBI:3752 clomiphene and CHEBI:6413 letrozole were derived by validate-terms and inserted in sorted position. The two CHEBI rows appear now only because Polycystic_Ovary_Syndrome previously aborted term validation at the MAXO error before reaching them. No cache file was hand-written and no references_cache file was created or edited.

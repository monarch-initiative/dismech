  summary: 'Create: Specific Antibody Deficiency'
  details: |
    De-novo curation of specific antibody deficiency, MONDO:0019093 - an IUIS-recognised predominantly-antibody inborn error of immunity with no causal gene. One OpenScientist deep-research run: 20/20 references verified, 11/11 quotes valid, confabulation_rate 0.0; term_validation needs_review true. This entry is the run's test of how the schema handles a disease defined by a functional assay rather than a locus. There is no genetic section and no inheritance block, because there is none to have: the defining review states the origin and molecular defect are unknown, and that statement is curated as a NO_EVIDENCE item on the mechanism node so the absence reads as a finding rather than an omission. Category is Complex rather than Mendelian for the same reason. The report contributed the adult outcome literature the entry now rests on: PMID:40097777, a 55-patient multicenter adult cohort giving the only quantified treatment effect in this disease - antibiotic courses falling from 7.9 to 0.7 per year on immunoglobulin replacement - and the diagnostic-delay-to-bronchiectasis association that is the strongest argument for testing early. PMID:34290713 is included but graded INDIRECT because its 29 patients were common variable immunodeficiency and IgG subclass deficiency rather than SPAD. Three snippets initially failed reference validation because the validator strips square-bracketed spans such as interquartile ranges before matching; they were rewritten to quote spans without brackets, and the constraint is recorded in an evidence explanation. Validated with just validate - schema, terms, 34/34 snippets verified - plus the ungated whole-KB gates.

  summary: Add differential diagnoses to Achoo Syndrome
  details: |
    Added a differential_diagnoses block with seven entries covering the clinically relevant mimics of the photic sneeze reflex: allergic rhinitis (MONDO:0011786), idiopathic/vasomotor non-allergic rhinitis (MONDO:0006004), snatiation (stomach-fullness sneeze reflex), sneezing induced by sexual ideation or orgasm, trigeminal irritant-induced sneezing, psychogenic (intractable) sneezing, and sneezing secondary to CNS pathology (lateral medullary syndrome, MONDO:0006827 - the one non-benign arm). Each entry carries a description of the clinical/mechanistic overlap, explicit distinguishing_features, and snippet-verified evidence. New references: PMID:19617285 (Songu and Cingi sneeze-reflex review), PMID:27434218 (Eifan and Durham, pathogenesis of rhinitis), PMID:19092028 (Bhutta and Maxwell, sexually induced sneezing), PMID:21853666 (intractable/psychogenic sneezing), plus PMID:2769729 and PMID:2325110 recorded as top-level references only (abstract-less letters, so no quotable snippet; the snatiation claim is carried by the review citation instead). Validation: linkml-validate passed; ontology term validation passed; all 29 evidence snippets in the file verified individually against cached abstracts with linkml-reference-validator validate text (0 failures); pytest tests/test_data.py -k achoo 9 passed.

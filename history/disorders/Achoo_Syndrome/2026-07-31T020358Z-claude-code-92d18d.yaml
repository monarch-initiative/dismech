  summary: Add differential diagnoses to Achoo Syndrome
  details: |
    Added a differential_diagnoses block with seven entries covering the clinically relevant mimics of the photic sneeze reflex: allergic rhinitis (MONDO:0011786), idiopathic/vasomotor non-allergic rhinitis (MONDO:0006004), snatiation (stomach-fullness sneeze reflex), sneezing induced by sexual ideation or orgasm, trigeminal irritant-induced sneezing, psychogenic (intractable) sneezing, and sneezing secondary to CNS pathology (lateral medullary syndrome, MONDO:0006827 - the one non-benign arm). Each entry carries a description of the clinical/mechanistic overlap, explicit distinguishing_features, and snippet-verified evidence. New references: PMID:19617285 (Songu and Cingi sneeze-reflex review), PMID:27434218 (Eifan and Durham, pathogenesis of rhinitis), PMID:19092028 (Bhutta and Maxwell, sexually induced sneezing), PMID:21853666 (intractable/psychogenic sneezing), plus PMID:2769729 and PMID:2325110 recorded as top-level references only (abstract-less letters, so no quotable snippet; the snatiation claim is carried by the review citation instead). Validation: linkml-validate passed; ontology term validation passed; all 29 evidence snippets in the file verified individually against cached abstracts with linkml-reference-validator validate text (0 failures); pytest tests/test_data.py -k achoo 9 passed. Follow-up after PR review: split the combined CNS entry into separate lateral medullary syndrome (MONDO:0006827) and epilepsy (MONDO:0005027) entries so both are machine-queryable; added a gustatory rhinitis entry (PMID:18426138) to complete the trigger taxonomy alongside snatiation; recorded on the snatiation entry that MONDO's only candidate term, MONDO:0007645 gastric sneezing (xref OMIM:137130), is obsoleted, making this a MONDO new-term-request candidate. The DifferentialDiagnosis.phenotypes slot was deliberately left unpopulated: it has zero usage across the corpus and the disorder template does not render it, so populating it here would introduce an unrendered convention in a curation PR rather than establish one deliberately. Second review round: recorded on the gustatory rhinitis entry that MONDO has no term for it and that the available neighbours (MONDO:0003014 rhinitis parent, MONDO:0006004 vasomotor rhinitis sibling) are unsuitable rather than merely imprecise, making it a second NTR candidate; removed the misleading onset-timing discriminator from the epilepsy arm since epilepsy commonly begins in childhood and a lifelong history is therefore not reassuring; added the population caveat to the 69% gustatory-rhinitis figure (dermatology-clinic self-report, not a general-population prevalence) and an 'almost all foods can be implicated' evidence item tempering the hot/spicy framing; converted links.prs to the full PR URL per corpus convention. All 32 evidence snippets re-verified (0 failures). Third review round: recorded an ontology caveat on the vasomotor rhinitis entry - MONDO asserts is_a MONDO:0011786 (allergic rhinitis) for MONDO:0006004, placing a non-allergic entity under allergic rhinitis and contradicting both this differential's framing and MONDO's own logical definition (intersection_of is rhinitis + regulation of vasoconstriction, with no allergic component). The term is retained as the correct and best-available entity; the asserted parentage is flagged as an upstream MONDO defect to report, not a curation claim. Corrected the 'sibling' wording in the gustatory rhinitis note accordingly.

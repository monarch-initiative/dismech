  summary: 'Review round: address ai4c-reviewer findings'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #11191 (ai4c-reviewer, nine
    important findings and four suggestions). Every quote below was taken from
    the committed reference cache, not from the deep-research report.

    Important findings.

    1. Nephrolithiasis now carries frequency FREQUENT, from a stone-specific
       figure already in the cached source: "The major clinical manifestation of
       xanthinuria is the formation of xanthine calculi in the urinary tract in
       about 40% of the affected individuals." The description now separates that
       from the cohort's 7-of-20 symptomatic figure, which counts symptoms of any
       kind. The binding also moved from HP:0000787 Nephrolithiasis to the more
       specific HP:0000804 Xanthine nephrolithiasis, which the same sentence
       supports directly.
    2. The Myalgia snippet was the 7-of-20 sentence, which never mentions muscle.
       Replaced with "Less frequent manifestations are myopathy, arthropathy and
       duodenal ulcers." The VERY_RARE band was removed with it: its stated anchor
       was the 7-of-20 figure, and the replacement quote supports no band.
    3. Added Crystalluria, Recurrent Urinary Tract Infections, Renal Colic and
       Arthropathy, all named in the cached line-44 paragraph.
    4. Added subtype terms MONDO:0010209 and MONDO:0011346 with their OMIM numbers.
       The review named the slot disease_term; on Subtype the slot is subtype_term.
    5. PMID:23024809 on Hypouricemia was graded HUMAN_CLINICAL. Splitting it was
       not available, because the human and mouse observations are in one sentence
       and two items quoting the same sentence with different evidence_source
       values is what check-snippet-grading gates. The second review argued that
       re-grading alone is also not enough, since the human clause is background
       the paper restates rather than data it reports, and PMID:20228523 already
       carries real human data for the same claim. Taken: the item was removed
       from the phenotype and the sentence moved onto the animal-model link, where
       it is evidence that the model carries the defining human biochemistry.
    6. The definition sentence reused as a snippet three times was replaced with
       three distinct specifics from the same abstract: the pyelolithotomy stone
       composition on the supersaturation edge, "The calculi consisted of pure
       xanthine." on the crystal-formation node, and "It is an uncommon cause of
       stone formation in children." on the phenotype.
    7. Added a genetic section for XDH (type I) and MOCOS (type II), each with
       representative pathogenic variants quoted from the cohort paper.
    8. Added the RENF mouse as an animal_models entry with a modeled_mechanisms
       link to Obstructive and Crystal-Induced Kidney Injury, two histology
       readouts, and limitations recording that the mice are in renal failure by
       four weeks whereas the human disease is usually benign, and that the cited
       abstract reports no xanthine calculi in the model.
    9. Added NCT06092346 as a clinical_trials entry, phase NOT_APPLICABLE, status
       RECRUITING, verified against the ClinicalTrials.gov v2 API.

    Suggestions taken: a diagnosis section (purine profile, molecular
    confirmation), a surgical stone-removal treatment grounded in the cached
    pyelolithotomy case rather than in modern techniques no cached source
    describes for this disease, a prevalence record (RARE / UNKNOWN measure), and
    the human nephrectomy histopathology.

    Second review round, taken in the same push: the mouse item moved off
    Hypouricemia (above); a second XDH nonsense allele, c.2473C>T p.(Arg825*),
    added from the cache; and the treatments section diversified, since one
    sentence from PMID:20228523 was the snippet on all four treatment evidence
    items. The two treatment-level items now quote "Management includes high
    fluid intake and avoidance of purine and fructose-rich foods" from
    PMID:34356852, leaving the older sentence on the target_mechanisms links.

    The allele annotations deserve care and are recorded in review_notes. Three
    different strings were in play for what looked like one variant: the
    deep-research report's p.Lys722Ter, the first review's repetition of it, and
    the second review's c.2473C>T p.(Arg825*). The cache resolves it: c.2164A>T is
    written by the paper as p.(Lys825*), and c.2473C>T p.(Arg825*) is a separate
    allele in a different family. Both are curated, separately. The paper's
    annotation of the first is copied as written even though c.2164 falls in codon
    722 rather than 825, because a snippet never corrects its source; the entry
    asserts no view on which annotation is right.

    One error of mine: the new MOCOS gene_term was first written as hgnc:29506,
    which is SRCIN1; corrected to hgnc:18234.

    Three bindings are deliberate compromises and are recorded in review_notes so
    they are not normalised away later: Crystalluria on the generic HP:0020074
    (HPO has no xanthine crystalluria term), Renal colic on HP:0030157 Flank pain
    (HPO has no renal colic term), and the histopathology finding with no
    finding_term at all, because NCIT:C34965 and HP:0012330 both exist but neither
    is reachable from the HistopathologyFindingTerm enum roots.

    Validation: just validate passes, snippets 57/57 verified against cached
    references (was 34/34), validate-terms passes with --labels, and
    check-entity-refs, check-causal-targets, check-duplicate-keys and
    check-enum-values are clean.

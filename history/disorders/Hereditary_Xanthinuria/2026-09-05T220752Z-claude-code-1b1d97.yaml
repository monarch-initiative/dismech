  summary: 'Create: Hereditary Xanthinuria'
  details: |
    New entry for hereditary xanthinuria (MONDO:0018106), curated from an Edison falcon deep-research report (research/Hereditary_Xanthinuria-deep-research-falcon.md) plus primary literature resolved from the report's DOIs through the PMC ID converter. Snippets were extracted programmatically as exact substrings of the cached references. The pathograph carries two parallel molecular entry points, biallelic XDH loss (type I) and molybdenum cofactor sulfuration failure from MOCOS loss (type II), converging on failure of hypoxanthine and xanthine oxidation, then hypouricemia with xanthine accumulation, urinary xanthine supersaturation, crystal and stone formation, and obstructive and crystal-induced kidney injury. Three nodes declare conforms_to against nephrolithiasis_crystal_nucleation (Urinary Supersaturation, Crystal Nucleation and Growth, Crystal-Induced Tubular Injury and Inflammation). Seven phenotypes, two behavioural treatments, two subtypes. The tubular-injury limb rests mainly on the Xdh-nonsense RENF mouse and both items from it are tagged MODEL_ORGANISM with the inference stated in the node text. Allopurinol and urinary alkalinisation are deliberately excluded from treatments and the reasons are recorded in notes; the case report cited in the entry does recommend alkalinisation, and that disagreement is stated rather than hidden. NCIT:C15325 was suggested for fluid therapy and is actually Skin Transplantation; term validation caught it and NCIT:C116537 is used. Validated with 'just validate': 34/34 snippets verified, terms clean. check-entity-refs, check-duplicate-keys pass; pytest -k conforms_to passes (2897). Compliance 98.8% global, 100.0% weighted; the gap is datasets, and just discover-datasets returned no GEO candidates.

  summary: 'Genetics pass: gene-defined ARO/ADO subtype rows, gene-to-pathograph wiring,
    MONDO reconciliation'
  details: |
    Genetics pass for the d2g series-035 gap list (issue #12242), parent entry Osteopetrosis.

    Scope decision. Osteopetrosis is kept as the umbrella for failure of osteoclast-mediated
    bone resorption. The has_subtypes list now carries the clinical groupings (ARO, ADO2, IRO)
    plus the gene-defined OMIM/MONDO numbered forms as children of the ARO row: ARO2
    (TNFSF11), ARO4 (CLCN7 biallelic), ARO5 (OSTM1), ARO6 (PLEKHM1), ARO7 (TNFRSF11A) and
    ARO8 (SNX10), with ADO3 (PLEKHM1 heterozygous) and OSMD (LRRK1) alongside. Each row binds
    its MONDO term and its gene. CLCN7 is deliberately split into two genetic records, one
    biallelic keyed to ARO4 and one heterozygous keyed to ADO2, because the recessive and
    dominant CLCN7 diseases have different inheritance, prognosis and MONDO terms.

    Pathograph wiring. Every causal gene now reaches a pathophysiology node. TCIRG1, CLCN7
    and OSTM1 are bound to the acidification node; TNFSF11 and TNFRSF11A to the
    osteoclast-poor differentiation node, which also gained downstream edges it lacked. Two
    new nodes were added: osteoclast vesicular transport and ruffled-border failure (SNX10,
    PLEKHM1) and LRRK1-dependent RAC1/CDC42 activation (LRRK1).

    MONDO reconciliation. Eight of the ten gap-list genes are curated here. FERMT3
    (MONDO:0013016, leukocyte adhesion deficiency 3) is dispositioned to the leukocyte
    adhesion deficiency entries; AMER1 (MONDO:0010310, osteopathia striata with cranial
    sclerosis) warrants its own entry and keeps its stub; LRP6 (MONDO:0980938) is declined on
    mechanistic grounds, since the gene's identifying report describes a Wnt gain-of-function
    high-bone-mass phenotype contrasted with its own separately genotyped Albers-Schoenberg
    series. Two descendants the gap list omitted were found by enumerating MONDO:0017198
    directly: MONDO:0012679 (ARO6, PLEKHM1), now a subtype row, and MONDO:0957262 (ARO9),
    left uncurated because it rests on one patient. The notes field records the disposition
    of every remaining descendant.

    Upstream MONDO observations recorded in the entry: MONDO:0012859's definition spells the
    gene symbol TNFRS11A, and MONDO:0957262 carries no causal-gene axiom.

    Verification. Every HGNC CURIE, MONDO CURIE and MONDO definition quoted in the entry was
    read from a lookup against the local MONDO and HGNC builds in the same step it was
    written. Two prose claims inherited from an earlier session were corrected: a MedGen
    statement that could not be checked offline was replaced with a MONDO statement that can,
    and a claim that PMID:37065631 reported a second LRP6 family was reworded to match what
    that paper says about itself.

    Review round 1 (PR #12741). The reviewer noted that the ADO2 row's only evidence,
    PMID:19953639, states that CLCN7 mutations give very different phenotypes but says nothing
    about heterozygosity or dominance, which is what the row claims. The GeneReviews sentence
    already cited on the ARO4 row, which names the heterozygous route to a CLCN7-related
    osteopetrosis diagnosis, is now cited on ADO2 as well, and the cohort study's explanation
    says what it does and does not cover. A second suggestion, splitting the third LRRK1-node
    evidence item because its snippet spans the mouse knockout and the human OSMD mutation, was
    declined: no other sentence in that abstract covers the human half, so splitting would
    either drop the human claim or require a snippet that does not exist. The item is already
    marked quote_role BACKGROUND.

  summary: Rename Pyridoxine-Dependent_Epilepsy to ALDH7A1-Related_Pyridoxine-Dependent_Epilepsy
  details: |
    Renamed the entry from Pyridoxine-Dependent Epilepsy to ALDH7A1-Related Pyridoxine-Dependent Epilepsy. In MONDO, and as the International PDE Consortium uses the term (PMID:40832147), pyridoxine-dependent epilepsy (MONDO:0009945) is a clinical category with ALDH7A1 and PLPBP children, and this entry only ever covered the ALDH7A1 disease (MONDO:0020741, unchanged). The umbrella name now belongs to the new grouping kb/groupings/Pyridoxine-Dependent_Epilepsy.yaml. Added synonyms (the GeneReviews title, the OMIM title and its EPD symbol) and the parent Pyridoxine-Dependent Epilepsy. Earlier history records were moved to the new slug directory with superseded_by blocks; the research report, the gene summary hgnc_877.md, the node-class example, the pediatric epilepsy census script and prose mentions in PNPO_Deficiency and Early-Infantile_Developmental_and_Epileptic_Encephalopathy were updated. The one grandfathered short snippet (Intellectual disability is common) was extended to the full GeneReviews sentence and its snippet-length baseline row removed instead of moved. Deleted stubs/Pyridoxine-dependent_Epilepsy.yaml, which nominated MONDO:0009945; the grouping now covers it. Validated with just validate, count-verified-snippets, genes-verify on hgnc_877.md.

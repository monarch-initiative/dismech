  details: |
    Addressed the single blocking item from the 2026-08-27 ai4c-reviewer re-review of PR 9730: check-snippet-grading failed because one PMID:17668388 sentence was graded two ways in the same file. pathophysiology[0].evidence[0] carried the full sentence as HUMAN_CLINICAL while genetic[0].evidence[1] carried a short form of the same sentence as IN_VITRO.

    Changed the pathophysiology item to IN_VITRO. The sentence states its own warrant -- "as suggested by calculation of free-binding energy of the modeled NOG-GDF5 complex and functional analysis of the micromass culture system" -- so the claim rests on bench work, not on patient observation. The paper's human-genetics contribution is the separate mutation-identification sentence, which remains correctly graded HUMAN_CLINICAL in genetic[0].evidence[0].

    Note the sentence mixes a modelling result with a culture assay, so COMPUTATIONAL is arguable for the free-binding-energy half. IN_VITRO was chosen because the micromass culture assay is the functional evidence carrying the loss-of-function claim, and because check-snippet-grading keys on the quoted sentence -- grading this item COMPUTATIONAL would simply move the divergence rather than resolve it.

    Validated: just check-snippet-grading (passes, no new divergences), just validate, just count-verified-snippets (24/24).

  summary: 'Create: Multiple Epiphyseal Dysplasia, Beighton Type (EDMMD, COL2A1 p.Arg704Cys)'
  details: |
    De-novo curation of MONDO:0007562 (OMIM 132450, ORPHA 166011) as a standalone Disease entry. Entry type decided DISEASE, not SUBTYPE: the existing Multiple_Epiphyseal_Dysplasia entry curates the COMP/MATN3/COL9A1-3/SLC26A2/CANT1 forms whose mechanism nodes are mutant-protein ER retention and SLC26A2 sulfate-transport failure, and COL2A1 is not among its genes; this disorder belongs to the type II collagenopathy allelic series instead. Sources: PMID:699354 (index Afrikaner kindred), PMID:9800905 (COL2A1 exon 39 Arg704Cys in four affected members of that kindred), PMID:16155195 (independent R704C probands, 'Stickler dysplasia with brachydactyly'), PMID:29439465 (recombinant R704C: normal folding, trypsin resistance, ER-to-Golgi trafficking, no XBP-1 splicing, no caspase-3 - the negative results that motivate the extracellular-interference mechanism), PMID:26443184 (COL2A1 mutation update). Thirteen phenotypes, all wired into the pathograph; no frequency bands because the denominator is one small kindred. Validated: just validate (34/34 snippets verified, all PMID references, no DOI citations), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders, plus whole-KB check-title-snippets, check-snippet-length and check-snippet-grading. A Falcon (Edison Scientific Literature) deep-research run was attempted and discarded: given only the entry name it produced a full report on spondyloepimetaphyseal dysplasia with joint laxity type 1 (B3GALT6, OMIM 271640), a different disorder that shares the 'Beighton type' eponym. `just preflight-dr <report> MONDO:0007562` failed it (B3GALT6 mentioned 28 times, COL2A1 zero times, report OMIM ids 271640/615291/615349 against MONDO's 132450), so no research artifact is committed and none of its content was used. The name collision is recorded in the entry's notes.

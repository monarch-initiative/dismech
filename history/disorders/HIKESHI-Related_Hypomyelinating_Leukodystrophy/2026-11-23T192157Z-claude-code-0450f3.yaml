  summary: 'Review round 1: ground HIKESHI molecular function and split sudden-death
    hypotheses'
  details: |
    Responding to the review of PR 18804. (1) Bound GO:0061608 nuclear import signal receptor activity and GO:0030544 Hsp70 protein binding, both DECREASED, on the Biallelic HIKESHI Loss of Function node; both terms are GO's own experimental annotations for HIKESHI (QuickGO, IDA from PMID:22541429), with a PMID:22541429 snippet on the carrier activity. This clears the gene activity grounding gate. (2) The Unrepaired Heat-Induced Nuclear Damage to Sudden death edge had cited PMID:26545878's sentence attributing the deaths to extra-nuclear HSP70 and immune activation. That sentence now supports a new emerging node, Extra-nuclear HSP70 Accumulation with Immune Activation, with INDIRECT edges into Sudden death and Myopericarditis; the nuclear-damage edge is re-cited with the authors' alternative sentence. The two paths are grouped as EMERGING mechanistic_hypotheses, and the entry description, node description and notes were rewritten to match. (3) Added PMID:34111619 febrile-illness evidence to the GENETICS_ENVIRONMENT_DISEASE classification, and short stature and anarthria phenotypes from the PMID:40649816 index case. Septic shock and multiorgan failure were not added because no cached source states them. Validated with validate, validate-terms, count-verified-snippets, check-causal-targets, check-entity-refs, check-snippet-grading, check-name-collisions, the gene activity grounding gate and validate-disorders.

  summary: 'Create: HIKESHI-Related Hypomyelinating Leukodystrophy (MONDO:0014813)'
  details: |
    New Disease entry for MONDO:0014813 (HLD13), claimed in issue 18798 and
    curated from stub stubs/Hypomyelinating_Leukodystrophy_13.yaml, which this
    change deletes. Lump/split decision: DISEASE. MONDO:0014813 is a
    gene-anchored single-gene term (RO:0004003 HGNC:26938 HIKESHI) with one
    conserved mechanism (loss of HIKESHI-mediated HSP70 nuclear import), so
    it is curated as its own Disease entry rather than as a subtype or
    grouping. Named HIKESHI-Related Hypomyelinating Leukodystrophy following
    the entry-naming skill: the gene-related form is used in the titles of
    PMID:34111619 and PMID:40649816 and the MONDO label and series name are
    kept as synonyms.

    Deep research: falcon was requested by default but EDISON_API_KEY was not
    set, so the run used --fallback and claude_code produced the report
    (research/HIKESHI-Related_Hypomyelinating_Leukodystrophy-deep-research-claude_code.md;
    frontmatter records fell_back and requested_provider). Its reference
    validation resolved 19/19 identifiers; needs_review was set because one
    quoted phrase attributed to PMID:28000699 was not matched, and no quoted
    material from the report was reused. just preflight-dr passed (HIKESHI
    mentioned 33 times, OMIM 616881 matches MONDO). The report was used as a
    lead list only; every snippet was taken from references_cache files
    fetched with just fetch-reference.

    No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). The
    phenotype baseline comes from PMID:26545878, PMID:34111619, PMID:28000699,
    PMID:38922739 and PMID:40649816. ClinGen Definitive (AR) was copied from
    the CGGV assertion cache file into gene_disease_validity.

    Pathograph: biallelic loss of function -> impaired HSP70 nuclear import ->
    (a) loss of nuclear HSP70 protection of SOX10 -> oligodendrocyte
    differentiation arrest -> CNS hypomyelination (conforms to
    cns_myelin_failure at the differentiation and myelin-sheath nodes);
    (b) dysregulated HSF1 heat-shock response; (c) unrepaired heat-induced
    nuclear damage -> fever-associated deterioration and sudden death. The
    edges in (c) are graded directness INDIRECT because the case-series
    authors present them as speculation. Febrile illness is an environmental
    entry with influences_mechanisms (EXACERBATES), supported by the iPSC
    heat-stress result in PMID:40649816; no ECTO term fits an endogenous
    fever and the searches run are recorded in its notes. The p.Cys4Ser
    filamin A gain-of-function result (PMID:33535532) is recorded in notes
    only, because patient cells show absent protein.

    Validation: just validate, validate-terms, count-verified-snippets
    (72/72), check-causal-targets, check-entity-refs,
    check-environmental-evidence, check-snippet-grading and
    validate-disorders were run on the entry.

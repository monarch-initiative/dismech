  summary: 'Create: Mesomelic Dysplasia, Kantaputra Type'
  details: |
    De-novo curation of the Kantaputra type of mesomelic dysplasia, row NOS 15-0110 of ISDS Nosology 2023 group 15. That row's label lumps the Kim/Korean, Kantaputra and Fryns types; this entry is keyed to the Kantaputra type, which has its own MONDO class and the largest published pedigree, and the other two are curated as differential diagnoses because MONDO keeps them separate and the Fryns type is delimited in the literature as an upper-limb-only condition. The pathograph models a regulatory rather than coding disease: a 2q31 copy-number rearrangement, reallocation of enhancer-promoter contacts across the HOXD topological boundary, ectopic proximal expression of HOXD13, and the limb phenotype. The engineered-inversion mouse is curated with both its RECAPITULATES link and the in-cis Hoxd13-null RESCUES link that establishes necessity. A KNOWLEDGE_GAP discussion records that no published rule maps rearrangement geometry onto which limb segments are affected, which is what a family with a newly found 2q31 rearrangement actually needs. All 24 evidence snippets verified against the reference cache; schema, term, reference, entity-ref, duplicate-key, snippet-length and title-snippet checks pass.

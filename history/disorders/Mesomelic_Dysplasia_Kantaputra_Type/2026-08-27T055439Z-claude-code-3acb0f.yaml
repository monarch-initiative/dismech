  summary: Wire the pathograph and add the HOXD-negative differential
  details: |
    Final-pass review. Phenotype causal-inlink went from 0/4 to 4/4 and gene wiring to 100 percent via a HOXD13 descriptor on the rearrangement node. The synostosis edges carry the specific argument that HOXD13 is normally autopod-specific, so expressing it outside its domain disturbs the segmentation separating carpal and tarsal elements. Added PMID:37846940 as a differential: a Brazilian family over three generations with a Kantaputra-like phenotype, no synostosis, and neither a CNV nor an exome candidate. It is a caution against reading a Kantaputra-like phenotype as a HOXD rearrangement, which matters because the entry's own mechanism is so locus-specific.

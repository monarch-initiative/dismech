  summary: 'Create: Epilepsy with Myoclonic Absences'
  details: |
    De novo curation of epilepsy with myoclonic absences (MONDO:0019487), one of the three ILAE childhood generalized epilepsy syndromes. Seven-node pathograph from heritable thalamocortical susceptibility through the three-hertz generalized spike-wave oscillation, which is deliberately described in the same terms as the sibling childhood and juvenile absence entries because the discharge really is the same, then into the node that makes this syndrome distinct: cycle-locked recruitment of motor output, in which each spike-wave cycle carries a time-locked muscle burst with a separately building tonic contraction superimposed. That feeds rhythmic myoclonus with progressive tonic contraction, myoclonic absence status epilepticus, and a drug-resistant course with cognitive decline in a subset. Two nodes conform to epilepsy_excitation_inhibition_imbalance. Three discussions: a CONTROVERSY on whether this is a distinct syndrome or childhood absence epilepsy with a prominent myoclonic accompaniment, curated with the literature's own description of it as a somewhat controversial entity on one side and the current ILAE classification on the other; a KNOWLEDGE_GAP on why the same oscillation recruits the motor system here and produces a motionless stare in childhood absence epilepsy, which is unusually well-posed because the oscillation is the controlled variable; and a CONTROVERSY on whether the sharp prognostic split by associated generalized tonic-clonic seizures reflects two diseases sharing a seizure type or one disease with a severity gradient, complicated by a newer series identifying an atonic component as a separate strong predictor of medication failure. Carbamazepine aggravation is curated as a mechanism-derived contraindication with a within-patient observation. Deep-research artifact generated with the claude_code provider and committed. Validation: schema passed, term validation passed, 44/44 evidence snippets verified against cached references, snippet-length check clean.

  summary: 'Review response rounds 1-6: Epilepsy with Myoclonic Absences'
  details: |
    Five commits of review-driven curation after the initial CREATE, which reported the entry as it stood at 44 snippets with no genetic section and a single diagnosis record. The entry now carries 61 verified snippets, a genetic section, and four diagnosis records. Added across the rounds: an atonic seizure phenotype at 40 percent, which the entry had argued about in prose while omitting from phenotypes even though its own outcome controversy proposes the atonic component as the stratifying variable; a valproate-with-lamotrigine treatment record, curated separately from the topiramate one because the two sources disagree, the sibling report favouring topiramate having done so specifically after lamotrigine failed; a genetic section with SLC2A1 and SYNGAP1, both snippet-verified, with SLC2A1 carrying the honest qualifier that myoclonic absences are rarely reported in glucose transporter deficiency so it is a cause to exclude rather than a common explanation; a ketogenic diet record for the SLC2A1 subgroup; brain MRI, lumbar puncture with paired CSF and blood glucose, and cytogenetic testing under diagnosis, which together close the loop the genetic section opened by modelling the tests that find the treatable cause; and the Doose myoclonic-atonic differential, whose omission became conspicuous once the atonic phenotype was curated. Corrections to my own earlier work in this entry: quantitative review-derived items retagged from OTHER to HUMAN_CLINICAL, since a frequency band justified by a source tagged non-clinical undermines itself, while nosological-opinion items correctly stay OTHER; the cytogenetic diagnosis_term corrected from Karyotyping to Cytogenetic Analysis, since the record argues the cytogenetic-versus-sequencing boundary rather than a specific platform; and reference_title values for two PMIDs corrected against their caches after I had written them from memory rather than copying them, which produced titles for papers that do not exist. One reviewer finding was resolved by correcting my diagnosis rather than the entry: I had reported the MRI record as blocked because validate-references called the reference abstract-only, when the cache is full text and the real failure was a snippet crossing a PDF line-wrap hyphen. Filed as repository issue 8048. Validation: schema passed, term validation passed, 61/61 evidence snippets verified against cached references, snippet-length check clean.

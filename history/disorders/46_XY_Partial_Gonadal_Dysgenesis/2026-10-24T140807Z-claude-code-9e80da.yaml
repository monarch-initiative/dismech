  summary: Record uncertain SRY S18N allele in partial GD against ai-gene-review
  details: |
    From the SRY ai-gene-review. The entry had deliberately omitted SRY on the basis that every located citation reported the complete (sex-reversed) phenotype. The review surfaced the one located partial-GD SRY allele: familial S18N 5' of the HMG box (PMID:9521592), present in the affected proband but also in the fertile father and a phenotypically normal brother. Added SRY as a genetic row with relationship_type UNKNOWN (segregation in unaffected carriers makes causality unproven) rather than a causal subtype, and updated the scoping note accordingly (SOX9 still has no subtype). Snippets exact-verified; all gates pass.

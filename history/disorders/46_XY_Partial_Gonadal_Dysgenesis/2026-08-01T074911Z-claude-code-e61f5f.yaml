  details: |
    Correction and update record for 46,XY partial gonadal dysgenesis, superseding details in the CREATE record 2026-08-01T063918Z-claude-code-bd69a0.yaml. That record described the entry as first drafted and is now inaccurate on two counts; history is append-only, so it is corrected here rather than edited.

    CORRECTIONS to the CREATE record:
    - Subtype count is SEVEN, not nine. The SRY-related and SOX9-regulatory subtypes named in that record were REMOVED during pre-merge review (see below). Current subtypes: NR5A1-related, MAP3K1-related, WT1-related, DHH-related, DHX37-related, ZFPM2-related, Molecularly unresolved.
    - Snippet count is 177 verified, not 156.

    WHY THE TWO SUBTYPES WERE REMOVED. A self red-team review before merge found that both rested on evidence reused from the sibling entry kb/disorders/46_XY_complete_gonadal_dysgenesis.yaml, where those same snippets support the COMPLETE subtype. The same snippet cannot evidence both a complete and a partial phenotype. Checking the SOX9 source full text confirmed its 46,XY cases are uniformly described as sex reversal, and a PubMed search for a hypomorphic or mosaic SRY partial case returned nothing quotable. Both genes are retained as genetic records with relationship_type UNKNOWN and notes stating the limitation.

    OTHER EVIDENCE-FIDELITY CORRECTIONS in the same pass:
    - WT1 genotype-severity: the quoted sentence from PMID:25613702 is that paper's BACKGROUND statement of prior belief, and its CONCLUSIONS argue against it. Regraded PARTIAL and paired with a REFUTE evidence item; prose rewritten so the correlation cannot be used to reassure about a deletion genotype.
    - PMID:34070473 biopsy-sampling snippet: provenance disclosed (that patient had complete androgen insensitivity, not partial dysgenesis); regraded PARTIAL.
    - PMID:38206718 Mullerian claim: the entry read an MRI negative as complete regression, but ultrasound in the same case found a probable primordial uterus. Both now cited and the discordance made the point.
    - PMID:35309143 background sentence retagged IN_VITRO to OTHER.
    - Hypergonadotropic hypogonadism narrowed to the FSH-only quote and regraded PARTIAL, since testosterone was elevated in that patient.
    - Gonadotropin-drift claim regraded PARTIAL (n=10, mismatched denominators).
    - DHH Leydig-cell annotation re-evidenced from PMID:25927242, which reports Leydig-cell loss directly and adds an independent second family.

    AUTOMATED REVIEWER ITEMS ADDRESSED (ai4c-reviewer, PR 7617):
    - GO bindings made specific: GO:0006702 androgen biosynthetic process and GO:0120178 steroid hormone biosynthetic process, replacing the over-general GO:0006694.
    - WT1 GeneReviews DIAGNOSIS/TESTING section mined into the molecular-testing diagnosis entry.
    - Added phenotypes HP:0034546 presence of uterus in 46,XY individual (deliberately with no frequency band, since the cohort percentages are full-text-table only), HP:0000054 micropenis, HP:0031103 decreased AMH, and HP:0000846 adrenal insufficiency scoped to the NR5A1 subtype. Added an Inhibin B biochemical record.
    - SRY and SOX9 relationship_type changed from CAUSATIVE to UNKNOWN so the controlled vocabulary matches the notes; CAUSATIVE is defined as sufficient to cause the disease, and the disease of this file is the partial entity.
    - Declined with reasons: no biomarker_term for AMH or inhibin B (no CHEBI terms exist, verified with OAK); no ZFPM2 inheritance block (source reports mixed zygosity).

    Also added OTX2 and PROP1 as MODIFIER genetic records so the digenic inheritance block's cross-reference resolves.

    Validation at this point: 177 of 177 snippets verified; schema, term, history, folded-hyphen and reference-cache-contract checks all pass; weighted compliance 97.5 percent; targeted test_data tests pass. Branch rebased onto main to resolve an additive term-cache CSV conflict with parallel curation PRs.

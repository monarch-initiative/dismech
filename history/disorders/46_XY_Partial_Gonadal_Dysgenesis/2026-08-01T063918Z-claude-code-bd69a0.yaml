  summary: 'Create: 46,XY partial gonadal dysgenesis (MONDO:0016674)'
  details: |
    De-novo curation of 46,XY partial gonadal dysgenesis [MONDO:0016674] fulfilling issue #7595, modelled as CURATE_ROOT_WITH_SUBTYPES.

    Deep research: "just research-disorder claude_code 46_XY_Partial_Gonadal_Dysgenesis" -- provider claude_code, 20 web searches, 58 turns, 43 citations. Falcon was unavailable in this environment because no EDISON_API_KEY / FUTUREHOUSE_API_KEY is set. The DR report was treated as leads only: every PMID was independently fetched with "just fetch-reference" and every snippet was re-derived as an exact substring of the cached abstract rather than copied from the report, which explicitly warned that its own snippets were page-summarisation paraphrases.

    GeneReviews baseline: PMID:20301714 -- Nonsyndromic Disorders of Testicular Development Overview -- exists but its PubMed abstract is a purpose statement only, so it is tagged in top-level references without inline phenotype evidence. PMID:32352694 -- WT1 Disorder -- is a substantive GeneReviews chapter and supplies the WT1 subtype, the steroid-resistant nephrotic syndrome and Wilms tumour phenotypes, the surveillance schedule, and the agents-to-avoid warning that the glomerulopathy must not be treated with immunosuppressants.

    Modelling: the entry is deliberately built as the complement of the existing 46_XY_complete_gonadal_dysgenesis.yaml [MONDO:0010765], which was NOT edited. The organising contrast is residual testicular tissue -- hypoplastic seminiferous tubules rather than fibrous streaks, partial fetal AMH and androgen, ambiguous rather than typically female genitalia, variable rather than uniform Mullerian retention, potential for spontaneous puberty in 80 percent of PGDm with a retained gonad and for discordant pubertal virilization in 42 percent of PGDf with gonads, a lower tumour gradient of 33.8 percent CGD versus 19.7 percent PGDf versus 8.8 percent PGDm in one registry, and a genuine gonad-retention risk/benefit trade-off that does not arise in the complete form.

    Nine subtypes: NR5A1-related as the characteristic partial gene, MAP3K1-related, SRY-related, WT1-related spanning the Denys-Drash/Frasier continuum, DHH-related with minifascicular neuropathy, DHX37-related, SOX9-regulatory, ZFPM2-related, and Molecularly unresolved. A top-level Digenic inheritance block bound to HP:0010984 captures the documented DHX37 plus NR5A1 double heterozygotes.

    Three discussions: two KNOWLEDGE_GAP entries covering the retained-gonad tumour-incidence denominator problem and the roughly 50 percent molecularly unexplained fraction, plus one HUMAN_MODEL_MISMATCH recording that NR5A1 p.R92W masculinises human 46,XX gonads but not XX mice [PMID:27833742].

    Validation: just validate, just validate-terms and just validate-references all pass; 156 of 156 snippets verified against cached references; weighted compliance 97.3 percent. All HP, GO, CL, CHEBI, NCIT, HGNC and MONDO terms verified with OAK.

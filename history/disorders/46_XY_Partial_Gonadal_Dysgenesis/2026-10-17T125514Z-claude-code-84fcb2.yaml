  details: |
    LOINC Diagnostics tranche G, batch 26 (functional and provocative tests with diagnostic thresholds). Two sources were used and each answered a different question. Observation and panel codes were enumerated against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin; that export contains no LP or LG Part rows at all, so every Part question was put separately to the Monarch KG, and each KG query was paginated to its stated total rather than read off a first page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 549 snippets and 605 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:72410-4 and LOINC:72409-6 (serum testosterone pre and post dose hCG) as the two measurements of the hCG stimulation test, and LOINC:72409-6 as the loinc_term of the stimulated-testosterone marker. The dose- and timing-unqualified pair was chosen because the row names neither: the other seven hCG-qualified testosterone codes in LOINC 2.83 all fix a 5000 unit intramuscular dose and a sampling point between 4 hours and 4 days. No Part exists for a stimulated testosterone; the KG's testosterone records were paginated in full, 104 of 104, and its five testosterone Parts are the unqualified component plus its bound, free and weakly bound fractions, none carrying the hCG challenge. No reference range was added: the only figure the row carries is a rise to more than double the patient's own basal level, a within-patient ratio with no code on the bound scale to key it to, and the row itself records that the association was not significant and is not a prediction rule.

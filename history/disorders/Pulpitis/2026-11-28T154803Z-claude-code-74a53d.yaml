  summary: 'Create: Pulpitis'
  details: |
    New entry for pulpitis (MONDO:0006937). Modelled reversible, symptomatic irreversible and asymptomatic irreversible pulpitis as has_subtypes, with pulp necrosis and apical periodontitis as progression phases and pathophysiology nodes. The causal chain runs from caries biofilm penetration of dentine (or traumatic/operative insult) through odontoblast TLR sensing, neurogenic inflammation and leukocyte recruitment to bacterial invasion of the pulp, necrosis and apical periodontitis. Agents are bound at genus level only for taxa named in cited sequencing studies (Lactobacillus, Olsenella, Pseudoramibacter, Streptococcus, Fusobacterium, Prevotella), with a Deliberately lumped review note. Treatments follow the ADA 2019 antibiotic guideline, the Cochrane review, vital pulp therapy and pulpotomy meta-analyses and an RCT of pulpotomy versus root canal treatment; antibiotics are recorded as restricted to systemic involvement. HPO has no toothache term, so pain phenotypes bind HP:0012531 Pain. Deep research: research/Pulpitis-deep-research-claude_code.md (claude_code; preflight-dr SKIP because MONDO records no causal gene); its leads were re-verified against cached abstracts before use. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified) and the whole-repo gates.

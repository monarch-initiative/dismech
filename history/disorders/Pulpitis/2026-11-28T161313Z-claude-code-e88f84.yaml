  summary: 'Review round 1: Pulpitis'
  details: |
    Addressed the PR #19244 review. Reworded the Cochrane antibiotic finding to insufficient evidence of benefit (description and explanation). Replaced the pulpotomy target_mechanisms evidence, which described root canal treatment, with the full-pulpotomy definition from PMID:42426147. Sourced the reduced inferior alveolar nerve block success in irreversible pulpitis from PMID:26069400 (about 30% versus 70% in uninflamed pulps; 14-39% for the block alone; supplemental infiltration 50-65%). Added a pulpal nociceptor TRP channel sensitization node from PMID:41516061, fed by leukocyte TNF-alpha and leading to lingering and spontaneous pain. Marked the biomarker-based neurogenic inflammation to spontaneous pain edge directness INDIRECT. Added a rat LPS pulpitis animal model linked to the leukocyte and cytokine node, and periodontal disease as an environmental insult, both from PMID:33540711. Removed YAML anchors so repeated evidence items are written out in full.

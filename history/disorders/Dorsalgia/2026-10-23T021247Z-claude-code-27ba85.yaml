  summary: Remove MONDO root binding from disease_term
  details: |
    disease_term was bound to MONDO:0000001 (disease), the MONDO root, which asserted identity with every disease in MONDO and broke coverage accounting (issue #12184). MONDO has no back-pain/dorsalgia disease class: OLS searches of MONDO for back pain, low back pain, dorsalgia, lumbago and dorsopathy returned none. The term was removed, leaving the free-text preferred_term, and notes was rewritten to record the search. MONDO:0004866, suggested in the issue, is eustachian tube disorder and was not used. Validated with just validate-disorders.

  summary: Enhance Dorsalgia with sulfate/collagen/aggrecan disc genetics, mechanical loading, nociceptive
    sensitization, and full causal phenotype connectivity
  details: Enhanced kb/disorders/Dorsalgia.yaml across clinical subtypes (Discogenic Low Back Pain, Lumbar
    Radiculopathy and Sciatica, and Degenerative Lumbar Spinal Stenosis), Harrison's
    classifications (CARDINAL_MANIFESTATIONS, NEUROLOGIC), structured
    population prevalence, onset progression, and an 11-node causal pathophysiology graph (Impaired Sulfate
    Transport and Proteoglycan Sulfation in Intervertebral Discs; Aberrant Spinal Mechanical Loading and
    Motion-Segment Stress; Intervertebral Disc Extracellular Matrix Degradation and Endplate Remodeling;
    Intradiscal Pro-Inflammatory Cytokine, NF-kappaB, and ROS Signaling; Nerve Ingrowth and Neoinnervation
    of the Degenerating Intervertebral Disc; Intradiscal Nociceptive Neuropeptide Signaling and Primary
    Afferent Sensitization; Facet Joint Osteoarthritis; Ligamentum Flavum Hypertrophy; Spinal Nerve Root
    and Cauda Equina Compression; Intraneural Ischemia, Edema, and Axonal Conduction Impairment; and
    Peripheral and Central Nociceptive Sensitization in Chronic Back Pain). Grounded all gene activities
    in GO molecular functions/biological processes, connected all 10 phenotypes into the causal graph,
    added ACP guideline-backed NSAID pharmacotherapy and Exercise Therapy alongside surgical decompression, and
    added evidence-backed differential diagnoses.

  summary: Curate Dorsalgia with sulfate/collagen/aggrecan disc genetics, mechanical loading, nociceptive
    sensitization, and full causal phenotype connectivity
  details: Restored original creation_date and curated Dorsalgia across clinical subtypes (discogenic
    low back pain, lumbar radiculopathy/sciatica, and degenerative lumbar spinal stenosis), structured
    population prevalence, onset progression, and 6-node causal pathophysiology graph (sulfate transport/proteoglycan
    sulfation, aberrant spinal mechanical loading, extracellular matrix degradation/endplate remodeling,
    intradiscal TNF/NF-kappaB/ROS nociceptive signaling, secondary facet/ligamentum flavum stenosis, nerve
    root compression with microvascular ischemia/edema, and peripheral/central nociceptive sensitization).
    Grounded all gene activities in GO molecular functions/biological processes, connected all 10 phenotypes
    into the causal graph, added first-line analgesic/anti-inflammatory and central neuromodulatory pharmacotherapy
    alongside physical therapy and surgical decompression, and added evidence-backed differential diagnoses
    (Piriformis Syndrome, Axial Spondyloarthritis, Tuberculous Spondylitis).

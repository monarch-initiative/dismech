  summary: 'Address review on PR #9706: GO term on the degeneration node, animal models,
    and optional polish'
  details: |
    Response to the automated review on PR #9706. Both blocking items and seven of
    the eight optional suggestions were addressed. One part of blocking item 2 was
    NOT actioned, for reasons recorded below and in the entry's notes.

    Blocking item 1 (accepted): the Retinal Ganglion Cell Axon Loss and Optic
    Atrophy node carried GO:0021554 optic nerve development with modifier ABNORMAL,
    a developmental term on a node describing adult-onset degeneration at ages
    29-50. Replaced with GO:1990535 neuron projection maintenance / DECREASED,
    mirroring the peripheral axon node.

    Blocking item 2 (partly accepted). Added an animal_models: section with two
    models whose findings are quotable from a fetched cache: the dPdxk mutant
    Drosophila complementation system (PMID:31578392, MEASURES on the enzyme node)
    and the vitamin B6-deficient rat (PMID:31187503, MEASURES on the PLP depletion
    node). The Drosophila evidence item was regraded OTHER to MODEL_ORGANISM.

    I did NOT add the dietary PLP-deficient mouse the reviewer asked for. The DR
    report describes it (abnormal walking, axonal neuropathy with preserved myelin,
    reversed by PLP) and attributes it to PMID:31187503, but that paper's cached
    full text does not contain it, and PubMed searches for such a model returned
    nothing matching. This is the third unsupported claim traced to this same DR
    report; the first two were already recorded in the entry's notes and the third
    is now recorded alongside them. The reviewer's own instruction was to use only
    snippets verifiable against a fetched cache, and there is nothing to fetch.

    I also recorded a factual correction in the model's limitations field: the
    reviewer described PMID:31578392 as studying "the actual disease variants". It
    does not. The four human alleles it expressed in flies (D87H, V128I, H246Q,
    A243G) are population variants and a gestational-diabetes variant, not
    p.Ala228Thr, p.Arg220Gln, p.Asn75Lys or p.Thr148Met. The model is curated as an
    assay for residual enzyme activity, with that limitation stated explicitly, so
    a later curator does not read it as disease-allele evidence.

    Optional items addressed: structured onset (onset_category: CHILDHOOD on the
    neuropathy phenotype, with two supporting quotes; per-patient ages are in a
    table absent from the cache, so no numeric fields are asserted);
    clinical_significance PATHOGENIC added to p.Ala276Pro (following the paper's
    functional reclassification, with the prior VUS call noted) and p.Thr148Met;
    gnomAD and control-cohort frequency evidence added to both founding variants;
    reduced visual acuity/colour vision and progressive VEP amplitude loss added as
    phenotypes; the bundled rehabilitation treatment split into physical therapy
    (BEHAVIORAL), ankle-foot orthoses (DEVICE) and foot/ankle surgery (SURGERY);
    the on-point CNS-sparing quote from PMID:33912895 added to the CONTROVERSY
    discussion; and a differential_diagnoses section added.

    The differential section departs from the reviewer's suggested list. Rather
    than a general list of optic-atrophy-plus-neuropathy mimics, for which no
    quotable source was found, it curates the two differentials that can be
    evidenced: pyridoxine-induced sensory neuropathy, which is mechanistically the
    same axis running the other way and is common in neuropathy clinics
    (2.5-12.4% in two cohorts), and UCHL1/SPG79 from PMID:39083076.

    On the NCIT term suggestion: NCIT was searched for a vitamin-therapy
    clinical-action term and none exists. The candidates returned are substance
    concepts not reachable from the Clinical Intervention or Procedure root the
    treatment enum requires. NCIT:C15433 is kept, with the search recorded in the
    treatment's notes; the specific agent is already carried by therapeutic_agent.

    Two ontology IDs guessed during this round were caught by just validate-terms
    before commit: HP:0000651 is Diplopia, not an evoked-potential term (corrected
    to HP:0000649).

    GeneReviews: not acted on, per the reviewer's own note that it could not run
    the canonical check and is accepting the documented assertion.

    Validation after the edits, run and read: just validate (passed);
    just count-verified-snippets (Snippets checked: 70/70 verified against cached
    references); just validate-terms (Validation passed); just validate-disorders
    (All 1 disorder file(s) passed validation); just check-duplicate-keys,
    check_folded_hyphens, check_snippet_length --against-ref origin/main,
    just check-title-snippets, just check-reference-titles,
    just check-snippet-grading, just check-cache-order,
    just check-term-cache-integrity all OK. Rebased onto origin/main first.
    check_folded_hyphens caught one new split introduced by this round
    ("peripheral-versus-" at a line end) and it was reflowed before commit.

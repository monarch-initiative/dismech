  summary: 'Create: Neuropathy Hereditary Motor And Sensory Type VIc With Optic Atrophy
    (PDXK, MONDO:0032792)'
  details: |
    De-novo creation of the PDXK-attributed leaf entity HMSN VIc / CMT6C
    (MONDO:0032792, OMIM 618511), curated with the treatable-metabolic-neuropathy
    mechanism as the centre of the entry.

    Entry-type decision: DISEASE. The stub records no mondo_descendant_count (leaf)
    and one causal gene (hgnc:8819 PDXK). The parent MONDO:0019551 is
    cross-referenced via mappings.mondo_mappings with skos:broadMatch.

    Deep research: falcon (Edison). Its reference_validation block reported 4/4
    references resolved, 0 unresolved, 0 unverifiable, 4/4 on topic. NEC preflight
    (just preflight-dr ... MONDO:0032792) returned PASS: PDXK mentioned 40 times,
    and the report's OMIM (618511) matched the MONDO xref exactly. SLC25A46 and
    SLC52A2 appear in the report as differential diagnoses, not rival identities.

    Two DR claims were rejected rather than curated, and the rejections are recorded
    in the entry's notes. First, the report asserted that isoniazid, levodopa,
    gentamicin and D-penicillamine reduce functional PLP and that antiepileptic
    drugs enhance PLP catabolism, attributing this to PMID:31187503; that paper's
    cached full text does not contain those statements, so no environmental: entry
    was created. Second, a 2023 review (PMID:37508330) gives the PLP dose as
    50 mg/kg, which contradicts the 50 mg/day reported by the treating authors in
    PMID:31187503; the primary source is cited for the dose.

    Pathophysiology: 5 atomic nodes, 4 edges, single root, all nodes reachable, all
    four biological_scale values represented. Chain: biallelic PDXK variants impair
    pyridoxal kinase catalysis (MOLECULAR) -> systemic PLP depletion (ORGANISM) ->
    cofactor insufficiency for PLP-dependent enzymes in neurons (CELLULAR, marked
    mechanism_confidence: PROVISIONAL) -> length-dependent axonal degeneration
    (TISSUE) and, in parallel, retinal ganglion cell axon loss and optic atrophy
    (TISSUE).

    The treatment is modelled with three target_mechanisms links rather than one,
    because the reported rationale is kinetic rather than a simple bypass: PLP
    RESTORES the depleted cofactor pool, MODULATES the mutant enzyme itself (PLP is
    hydrolysed to pyridoxal, raising substrate at an enzyme whose defect is a raised
    Km), and MODULATES the axonal degeneration node (evidenced by stable
    electrophysiology and by plasma NfL falling to the normal range, not by symptom
    report). A treatment note records that pyridoxine must not be substituted: it is
    a substrate of the deficient enzyme and high-dose pyridoxine independently causes
    a sensory neuropathy.

    Two discussions. A CONTROVERSY records the conflict between the tissue-sparing
    account (rat data plus a 2023 review stating that B6-dependent impairment is
    limited to peripheral signalling) and the 2026 report of two siblings with
    vitamin-B6-dependent neonatal seizures. A KNOWLEDGE_GAP records that no one has
    identified which PLP-dependent enzyme fails first in the axon; both the founding
    authors and a later review state the mechanism is unknown.

    Frequency bands are asserted only where a number is published (axonal neuropathy
    100%, optic involvement approximately 80%, both VERY_FREQUENT, from the pooled
    review PMID:41888341). Areflexia and the neonatal-seizure presentation carry no
    frequency. Prevalence is CASES_IN_LITERATURE / NOT_YET_DOCUMENTED, cited to the
    13-patients-from-6-families count.

    One ontology binding was deliberately omitted: plasma neurofilament light chain.
    HPO has only a CSF-specific term (HP:0032928) and the measurements were made in
    plasma; the reason is recorded on the biochemical entry. Two term IDs guessed
    during drafting (HP:0032678, HP:0032807 for a B6-responsive seizure) were caught
    by just validate-terms as wrong labels and corrected against OAK before commit.


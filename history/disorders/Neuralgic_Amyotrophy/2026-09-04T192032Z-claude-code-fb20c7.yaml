  summary: 'Create: Neuralgic Amyotrophy (MONDO:0017362)'
  details: |
    New entry for neuralgic amyotrophy (Parsonage-Turner syndrome), MONDO:0017362. Seven
    references, 33/33 snippets verified.

    SCOPE. This entry covers the acquired, idiopathic form only. Hereditary neuralgic
    amyotrophy, caused by SEPTIN9 duplication, is a separate MONDO concept with a different
    initiating lesion. MONDO itself supports the split: MONDO:0017362's parent is "acquired
    peripheral neuropathy". The deep-research report blends the two, and reports the OMIM
    number for the hereditary form (162100); that is why the entry's scoping is stated
    explicitly in its description rather than left implicit.

    The pathograph is built on a three-factor susceptibility model (genetic predisposition,
    biomechanical vulnerability of the plexus, immune trigger) rather than a single initiating
    lesion, because that is what the literature supports. All six phenotypes are wired into it.

    The hourglass nerve constriction question is curated as a CONTROVERSY discussion rather
    than resolved: whether the constrictions are a cause of the deficit or a consequence of
    the inflammatory attack is genuinely unsettled, and the entry does not choose.

    ENVIRONMENTAL TRIGGER. A hepatitis E virus entry is linked to the inflammatory-attack node
    with environmental_effect TRIGGERS. This is the substantive addition from the
    deep-research report. It earns curation because the association is clinically
    distinctive rather than incidental: HEV-associated attacks are enriched for phrenic nerve
    involvement and diaphragmatic paralysis, and one 13-patient series found normal liver
    enzymes in every case, which is why the trigger is missed. Two sources, both small and
    uncontrolled, and the entry says so.

    exposure_term is bound to ECTO:3000001 (exposure to virus) with "exposure to hepatitis E
    virus" in preferred_term. Whether ECTO codes hepatitis E exposure specifically is NOT
    established: the local ECTO index returned nothing for a control query as well as for the
    real one, so the search was uninformative rather than negative, and the entry's notes say
    that rather than asserting an absence. This distinction matters - on the concurrent NUBPL
    PR I asserted an ontology absence I had not checked, and it was false.

    DELIBERATELY NOT CURATED, both recorded in notes so they are not re-litigated:

    1. The feline model. The report offers feline hypertrophic brachial plexus neuritis
       (PMID:29925717) as a naturally occurring comparative-species analogue. Reading the
       source rather than the summary, that cat had a chronic hypertrophic DEMYELINATING
       neuritis with onion-bulb formation, which its own authors compare to human CIDP. NA is
       an acute, painful, multifocal AXONAL process. Shared brachial plexus inflammation is
       not enough to make it a model of this disease.

    2. Module conformance. peripheral_axonal_degeneration was checked and does not fit: it
       scopes to length-dependent distal degeneration, while NA is multifocal and proximal.
       No conforms_to is asserted.

    TERM DISCIPLINE. No CURIE in this entry came from the report, and the report's own Term
    Validation section shows why that matters: 8 of its 23 checked terms name a different
    concept, including every treatment term it proposed - NCIT:C198 "Prednisone" is
    Acetaminophen, NCIT:C1409 "Corticosteroid" is Carbenicillin Indanyl Sodium, NCIT:C579
    "Immunoglobulin therapy" is Inorganic Chemical, NCIT:C15296 "Physical Therapy" is
    Isolated Chemotherapeutic Perfusion, UBERON:0001824 "brachial plexus" is mucosa of larynx,
    UBERON:0001379 "deltoid" is vastus lateralis. UBERON:0003732 "phrenic nerve" does not
    exist. The report also proposed MONDO:0100053 for this disease, which is anaphylaxis; the
    entry uses MONDO:0017362 from the stub, verified against the ontology.

    EVIDENCE BASE. Recorded in the entry's notes because it is not visible from the evidence
    items: four of the seven references are narrative reviews carrying MEDLINE publication
    type "Review", three report original human observations (a four-patient biopsy series and
    two small HEV series). All seven are graded HUMAN_CLINICAL, which is the schema's
    definition and the KB's dominant convention, but a reader cannot tell a review from a
    biopsy series at the evidence item. See dismech#9421.

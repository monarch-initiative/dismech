  summary: 'Review round 1 on PR #10998: consume the primary studies the entry''s
    own notes said were missing'
  details: |
    The review's central criticism was correct and is the thing worth recording: this entry's own
    notes complained that its evidence base was thin because four of seven references were
    narrative reviews, while the deep-research report committed in the same PR contained the
    primary studies that fix it. An RCT, a 246-patient series and a prospective matched
    case-control were sitting in the artifact, unread. Seven of the report's 40 verified
    references had been used.

    This is the same defect the NUBPL PR was pulled up on an hour earlier, in a different guise:
    there, the unread source was a 1,095-line full text mined only for its abstract; here it was a
    committed report mined for a fraction of its citations. The general form is treating a source
    as consumed once something has been taken from it.

    Blocking 1 - Paresthesia frequency was OCCASIONAL (5-29%) on a snippet that carried no
    frequency at all. Corrected to FREQUENT on PMID:16371410's 78.4% sensory involvement, with the
    original snippet's explanation rewritten to say explicitly that it supports occurrence and not
    frequency. Recorded that the 246-patient denominator mixes 199 idiopathic with 47 hereditary
    cases while this entry scopes to the acquired form, and that the paper reports no separate rate
    by subtype.

    Blocking 2 - Fatigue (HP:0012378) added, FREQUENT, and wired DIRECT from the Reduced Nerve
    Endurance node. It is the clinical readout of this entry's central claim. The second evidence
    item is the load-bearing one: fatigue does not correlate with residual paresis on the MRC
    scale, which is the dissociation that separates the endurance model from simple deconditioning
    and is why the phenotype hangs off that node rather than off axonal injury.

    Blocking 3 - Rehabilitation cited two review sentences for the intervention this entry argues
    is disease-modifying. Added PMID:36697215, the only RCT in this disease, with both the adjusted
    group difference and the responder analysis, and noted that the CI nearly touches zero and 47
    randomised became 37 analysed. Added PMID:39402917 for the explicit negative that strength
    training may worsen symptoms - curated because the obvious rehabilitation approach to a weak
    limb is the wrong one here, and an entry recording only what to do leaves that trap in place.

    Blocking 4 - Only hepatitis E was curated as a trigger, and it is the weakest-evidenced one,
    while the first pathophysiology node depends on a general immune trigger. Added an
    "Antecedent infection or vaccination" environmental entry from PMID:39364568, the prospective
    matched case-control with central serology: 26.3% microbiologically confirmed infection, 12.3%
    COVID-19 vaccination as potential trigger, 38.6% confirmed overall, and the association of
    acute viral infection with bilateral plexus involvement. The description states that 38.6%
    means most attacks have no identified trigger, so this is a precipitant and not a necessary
    cause. HEV remains as the clinically distinctive instance rather than the only one.

    Blocking 5 - The diagnostic action implied by the HEV finding was absent. Added a
    "Hepatitis E serology in phrenic or diaphragmatic involvement" diagnosis entry, explicitly at a
    lower confidence than the imaging entry: it rests on two uncontrolled series plus a suggestion
    in the case-control study, and no study has evaluated it as a strategy, so its yield is unknown.

    Suggestions taken: corticosteroid comparative data (PMID:19321467, with the authors' own
    "pending a prospective, randomised trial" caveat), imaging yields (PMID:36214185, 90% and 74%,
    with the timing distribution that makes a repeat scan the right response to a normal early
    one), the surgical comparative series quoted as counts rather than percentages because the arms
    are 11 and 13 (PMID:32868098, self-graded Therapeutic IV), a three-phase progression section
    (PMID:16371410), and phrenic nerve reconstruction (PMID:36031309) linked to the diaphragmatic
    weakness phenotype, which previously had no treatment - flagged in its own description as a
    review across all causes of phrenic injury with no NA-specific outcome.

    Suggestion 11 declined: splitting the multifactorial susceptibility node. The node's claim IS
    the conjunction - that no single factor is sufficient - so splitting it would assert three
    independent mechanisms the literature does not. Recorded here rather than silently ignored.

    Suggestion 12 taken: the controversy rationale said "the edge is marked PROVISIONAL"; it is the
    node's mechanism_confidence. causal_link_type records directness, not confidence.

    The reviewer resolved the open ECTO question with a working adapter: ECTO genuinely has no
    hepatitis exposure term. The notes now record a confirmed absence rather than an uninformative
    search, and name what was searched. The distinction matters - a claim that a term does not
    exist needs a search behind it, which is the error I made on the concurrent NUBPL PR.

    The NCIT:C2322 note now points at dismech#10978, which I filed earlier today and which the
    reviewer had asked be opened; no duplicate was created.

    The entry's evidence-base note is rewritten. It previously described a seven-reference base
    that was mostly reviews; there are now sixteen references, ten of them reporting original human
    observations, and the note lists each with its design and size. The point it makes is
    unchanged and now sharper: an RCT, a 246-patient series, a four-patient biopsy series and a
    two-patient case report all carry an identical evidence_source: HUMAN_CLINICAL, and a reader
    cannot tell them apart at the evidence item.

    Validation: 54/54 snippets verified, up from 33/33. Schema, terms, entity refs, causal targets,
    duplicate keys, qualifier terms, enum values and environmental evidence all clean. All seven
    phenotypes are the target of a downstream edge - checked explicitly, since check-causal-targets
    does not detect orphans.

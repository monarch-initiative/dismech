  summary: Completed focused review of CD27-related immune disorder, evidencing all
    causal edges, separating autoinflammation from EBV-driven disease, correcting
    the persistent-EBV term, and folding IUIS classification work.
  details: |
    Added exact human evidence to the combined-immunodeficiency edge. Moved
    uveitis, arthritis, and periodic fever from the EBV-driven
    lymphoproliferation branch to a distinct autoinflammatory immune-
    dysregulation node because the cohort establishes their association but
    does not establish EBV as their cause. Corrected persistent EBV viremia to
    HP:0020072 in both the phenotype and surveillance target. Folded the IUIS
    immune-dysregulation classification from overlapping PR #6936. Rare D2P
    case findings lacking exact locally cached support were not imported.

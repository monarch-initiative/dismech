    Manual (non-scripted) claim-by-claim review of every evidence snippet against its cached source. Findings and fixes: (1) Six specific phenotype claims (short stature, coarse facies, corneal opacity, hearing impairment, spinal cord compression, hepatosplenomegaly) previously cited a generic 'multisystem clinical manifestations' snippet (PMID:27814620) that never named the specific feature = over-reach; replaced with feature-specific full-text substrings from PMID:27134829. (2) Carpal tunnel syndrome had no supporting quote; added PMID:20980181 which lists carpal tunnel syndrome among MPS VI features. (3) HSCT treatment cited a snippet that never mentioned transplantation (WRONG_SUPPORT); replaced with PMID:25345097 (HSCT named as one of two specific MPS VI treatments) and PMID:20980181 (CIBMTR 45-patient allogeneic HSCT cohort). New references PMID:20980181 and PMID:25345097 fetched via linkml-reference-validator lookup. All new snippets verified as exact whitespace-normalized substrings; schema validation passes. NEC check: clean (ARSB/MPS VI throughout).

  summary: Add rapidly/slowly progressing MPS VI subtypes
  details: |
    Added a has_subtypes block binding MONDO:0017171 (rapidly progressing) and MONDO:0017172 (slowly progressing), which the entry previously referenced only through evidence snippets about the rapidly progressing phenotype. The subtype descriptions record why the MPS VI split differs in kind from the MPS I and MPS II splits: it is about rate of somatic dermatan sulfate accumulation, not CNS involvement, because heparan sulfate is not an ARSB substrate and intelligence is preserved in both subtypes. Evidence reuses PMID:27134829 and PMID:20980181, both already cited in this file. Also corrected the reference_title on the PMID:20980181 citations, which carried an invented title.

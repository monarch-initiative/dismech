  details: |
    Up-to-date augment pass using the claude_code deep-research report (research/ER_Positive_Breast_Cancer-deep-research-claude_code.md). Added two pathophysiology nodes: PI3K-AKT-mTOR Pathway Activation (conforms_to sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation) and ESR1 Mutation-Driven Endocrine Resistance; added conforms_to on Cell Cycle Progression (evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control). Replaced the misattributed PALOMA-3 evidence (previously cited for CDK4/6i, alpelisib, elacestrant, fulvestrant regardless of drug) with correct trial-specific validated evidence: MONALEESA-2 overall survival (PMID:35263519) and monarchE adjuvant IDFS (PMID:32954927) for CDK4/6 inhibitors; SOLAR-1 (PMID:31091374) for alpelisib; EMERALD ESR1-mutant PFS (PMID:35584336) for elacestrant. Added new treatments capivasertib (CAPItello-291, PMID:37256976) and everolimus (BOLERO-2, PMID:22149876), each with target_mechanisms to the PI3K-AKT-mTOR node. Added target_mechanisms edges for CDK4/6i, alpelisib, elacestrant, fulvestrant. Added gene_term + evidence to ESR1 and PIK3CA genetic entries (PMID:34392831, PMID:31091374). Added TCGA driver evidence (PMID:23000897) and Pan/EBCTCG 20-year late-recurrence evidence (PMID:29117498). Did NOT change disease_term: the more precise MONDO:0006512 (estrogen-receptor positive breast cancer) is rejected by the stale committed DiseaseTerm enum cache, so the entry keeps the luminal A subtype term MONDO:0021116; the correct-term repoint is deferred to a cache-refresh PR (tracked in issues/issue_er_bc_disease_term.md). All snippets verified as exact substrings; just validate and just validate-references pass; compliance 84.0% global / 85.6% weighted.

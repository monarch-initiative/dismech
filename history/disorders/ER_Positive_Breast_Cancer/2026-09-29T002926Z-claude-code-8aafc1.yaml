  summary: Bind ESR1 on the two estrogen-receptor pathophysiology nodes
  details: |
    First tranche of the estrogen-signalling pathograph work in issue #12925.
    Both pathophysiology nodes in this entry that bind GO:0030520 named no
    gene, so the pathway was annotated and the receptor driving it was not.
    Each now carries a genes: descriptor bound to hgnc:3467 (ESR1), with its
    own evidence item.

    Estrogen Receptor Activation. The node's own description names estrogen
    receptor alpha, so the gene is ESR1 rather than ESR2. Evidence is the
    wild-type clause of PMID:34392831, which states that wild-type ESR1 is
    bound by estrogen ligand to enable coactivator recruitment; that is the
    ligand-dependent step the node describes. Graded IN_VITRO with
    quote_role REVIEW_SYNTHESIS: the sentence sits in a review and reports
    biochemical work the review did not perform.

    ESR1 Mutation-Driven Endocrine Resistance. The node name states the gene
    and the hotspots it lists (Y537S, Y537N, Y537C, D538G) are ESR1
    ligand-binding-domain substitutions. Added a second evidence item from
    the same paper's introduction, which names the gene, its product, and the
    mutated domain in one sentence. Graded HUMAN_CLINICAL with quote_role
    BACKGROUND: the claim is about patients, and the sentence restates
    established knowledge rather than this paper's own result.

    Both snippets are exact substrings of the cached full text of
    PMID:34392831, which was already in references_cache and required no
    fetch. The two sentences are distinct from each other and from the
    abstract snippet the resistance node already carried, so no quoted
    sentence carries two evidence_source values in this file.

    Direction was checked on both. Neither node is a loss-of-signalling
    claim: one is ligand-dependent activation, the other constitutive
    ligand-independent activation, and ESR1 is the correct gene for each.

    Adding the descriptors also wires the entry's genetic: ESR1 record into
    the pathograph, which is the second half of this entry's task in the
    issue. Before this change the entry bound ESR1 only under genetic:, where
    it reached no mechanism node; the gene_mechanism_wiring metric counts a
    gene as wired when a pathophysiology node shares its genes: descriptor.

    Checks: validate-disorders passed with 28 snippets and 28 titles checked
    and no issues; validate-terms passed; list-gene-term-mismatches examined
    five gene bindings in this file, all compared against HGNC and all named
    correctly by the entry, with no mismatch; check-enum-values,
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-folded-hyphens, check-reference-titles,
    check-snippet-grading, check-title-snippets and check-snippet-length all
    passed with no new findings.

    Both nodes also gained a molecular_functions descriptor bound to
    GO:0030284 nuclear estrogen receptor activity. Wiring a gene to a node
    carrying only a biological process skips the middle GO level: the graph
    stated what the cell does without stating what the protein does, which is
    what check_gene_activity_grounding gates on. Neither grandfathering case
    applies here, since each node carries one gene and the estrogen receptor
    has a well-defined molecular function. The activation node takes
    modifier INCREASED, the quantitative default. The resistance node takes
    GAIN_OF_FUNCTION, because ligand-binding-domain substitutions stabilize
    the active conformation without estrogen, so the receptor leaves ligand
    control rather than merely running higher.

    GO:0038054 G protein-coupled estrogen receptor activity was rejected: it
    is GPER1, a different gene from ESR1.

    No genetic_context was added to the resistance node. A somatic
    genetic_context there would make it the derived cancer cell of origin,
    and the acquired resistance lesion arises years after the disease starts.

    Not done here. The other eleven entries on the issue's GO:0030520
    worklist, the module-node binding question, and the estrogen resistance
    syndrome entry are separate tranches.

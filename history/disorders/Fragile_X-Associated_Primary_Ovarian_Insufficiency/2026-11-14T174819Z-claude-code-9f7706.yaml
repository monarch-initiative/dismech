  summary: Conform three nodes to the menopausal estrogen withdrawal module
  details: |
    Added conforms_to on the three nodes whose claim is identical to the module's rather than adjacent to it: Accelerated ovarian follicle depletion to menopausal_estrogen_withdrawal#Ovarian Follicle Pool Exhaustion, Hypergonadotropic hypogonadism to #Hypergonadotropic Feedback Disinhibition, and Chronic estrogen deficiency to #Systemic Estradiol Withdrawal. Recorded the reasoning in the entry-level notes, including the two candidate links that were rejected.

    Rejected: Granulosa cell dysfunction and death to the module's granulosa node. Both name granulosa cells, but the chain runs the other way - in the module the compartment stops secreting because the pool is exhausted, while here granulosa death is the primary premutation lesion and the pool depletion is its consequence, so the two nodes sit on opposite sides of the same edge. The bound processes differ to match (apoptosis here, estrogen biosynthesis and hormone secretion there) and this node is PROVISIONAL. Also rejected: Estrogen-deficiency bone remodeling imbalance, which already conforms to osteoporosis_bone_resorption, the module the withdrawal module explicitly leaves the bone arm to.

    Chronic estrogen deficiency was weighed against the module's Convergent Multi-System Estrogen Deficiency node, which it resembles in prose and cites the same POI guideline sentence for. The systemic node wins on position: this node sits between the hypergonadotropic state and the bone lesion and carries a downstream edge, where the module's convergence node is terminal.

    just check-conformance-content: the follicle-depletion link is clean on all four classes, sharing GO:0001541 and CL:0000023 with the module node. Chronic estrogen deficiency reports process_absent and Hypergonadotropic hypogonadism reports process_absent plus cell_type_absent, in both cases because the node binds no term at all rather than a divergent one. No module term was copied in to clear them: binding CL:0000437 or the gonadotropin-secretion processes here would need this entry's own evidence to name them, and the cited GeneReviews and POI-review sentences do not.

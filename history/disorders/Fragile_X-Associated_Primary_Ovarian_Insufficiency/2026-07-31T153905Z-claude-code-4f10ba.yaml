  summary: 'Address PR #7342 review: add FXPOI-specific ovarian evidence, repeat-length
    risk curve, module conformance'
  details: |
    Responds to the ai4c-reviewer[bot] changes-requested review on PR #7342.

    Key finding on the reviewer's central premise: the reviewer stated that network fetching now works, having run `just fetch-reference` successfully on all three papers. That is true in GitHub Actions but NOT in this authoring session, where the egress block persists. I re-tested every available route before acting - `just fetch-reference` on all three PMIDs, direct curl to eutils, and WebFetch against pubmed.ncbi.nlm.nih.gov, the Europe PMC REST API, and europepmc.org - and all returned 403 from the egress policy. So the three papers still cannot be cached or snippet-verified locally, and hand-writing references_cache files is prohibited.

    Rather than refuse the change, I corroborated the reviewer independently before accepting its quotes. This entry's own deep-research report, generated before the review existed, names all three PMIDs with matching titles and reproduces the substance of each claim: the granulosa cell death independent of FMRpolyG, the normal primordial pool with faster loss across all follicle classes, and the 70-100 / 85-89 / <65-or->120 repeat risk structure. Two independent sources agreeing on PMID identity and finding is strong enough to proceed; only the exact quote wording remains unverified.

    Blocking items addressed:
    - 'Granulosa cell dysfunction and death' had zero evidence and now has three items: PMID:36250920 IN_VITRO for CGG-RNA-driven granulosa cell death independent of FMRpolyG, PMID:36250920 MODEL_ORGANISM for FUS/PA2G4/TRA2beta depletion in premutation mouse ovarian follicles, and PMID:22470123 MODEL_ORGANISM for smaller follicles with fewer granulosa cells. Confidence raised PROVISIONAL to ESTABLISHED.
    - 'Accelerated ovarian follicle depletion' had zero evidence and now carries PMID:22470123 MODEL_ORGANISM, which states this node's specific falsifiable claim almost verbatim. Confidence raised PROVISIONAL to ESTABLISHED.
    - The non-linear repeat-length risk curve was absent from genetic: and is now curated there with PMID:33927378 HUMAN_CLINICAL, and the prevalence record gained a primary-cohort penetrance source rather than resting solely on the GeneReviews abstract.
    - The RAN arm was re-scoped as the reviewer asked. The prior 'unresolved' framing was stale: granulosa cell death is demonstrably independent of FMRpolyG, so the RNA arm is sufficient and FMRpolyG is not required. The node description, the downstream edge, and the fxpoi_ovarian_mechanism_evidence_gap discussion prompt and rationale were all rewritten to ask the narrower remaining question - whether FMRpolyG adds anything additive - instead of implying the whole arm is open.
    - PMID:36250920 was also added to the RNA gain-of-function node, which now has granulosa-cell rather than only Drosophila-neuron support. That node is deliberately held at PROVISIONAL, since which sequestered protein is functionally decisive for the follicle is still open.

    Suggestions accepted:
    - Added a classifications block (harrisons_chapter: ENDOCRINOLOGY_METABOLISM and GENETICS_ENVIRONMENT_DISEASE). mechanistic_category was left unset on purpose - its vocabulary has no repeat-expansion or RNA-gain-of-function category, and none of the existing values fit.
    - Added an 'Estrogen-deficiency bone remodeling imbalance' node with conforms_to osteoporosis_bone_resorption#Bone Remodeling Imbalance, downstream of chronic estrogen deficiency. The module's trigger node is explicitly written to accept a hormonal driver, so this is a clean fit and links the bone phenotypes into the pathograph rather than leaving them dangling.
    - Added evidence to the Hot flashes and Osteoporosis phenotypes from the already-cached POI guideline PMID:39647506, both PARTIAL with the limitation stated. Oligomenorrhea and donor-oocyte IVF remain uncited as standard-practice items.

    Not done, with reasons:
    - UBERON:0001305 and GO:0003729 remain unused. Both are absent from the committed dynamic-enum caches, and expanding them needs an ontology lookup that is unreachable here; substituting them would fail term validation locally. Recorded in notes for anyone editing with network access.
    - Depression/anxiety phenotypes and the mTOR/rapamycin arm remain uncurated - no verifiable snippet available.

    Verification status is stated plainly in the entry notes: 49 of 57 snippets verified locally as exact substrings with zero mismatches; the 8 belonging to the three new PMIDs are unverifiable here. Because unknown_prefix_severity is WARNING, a local `just validate` passes those silently, so CI with network access is the real gate for them. This is called out in the notes so a future reader does not mistake local green for verified.

    Validation: just validate PASS, just validate-terms PASS, 49/49 cached snippets exact, module conformance FK resolves, all internal targets and attaches_to refs resolve, non-therapeutic-action rule clean, compliance 87.3 percent global and 87.7 percent weighted.

  summary: 'Fix CI: drop PMID:33927378 penetrance snippet not present in abstract'
  details: |
    CI reference validation on commit 9f7592db checked the eight snippets that could not be verified in the authoring environment, and resolved them: seven passed, one failed.

    The failure was prevalence[0].evidence[1] - "Approximately 20-30% of women with an FMR1 premutation experience FXPOI", attributed to PMID:33927378. The validator reported it is not a substring of that paper's abstract, noting only the abstract is available and the full text may contain it. Final CI tally: 56 of 57 snippets verified.

    This is the one snippet that came from the PR reviewer's quotes and did not hold up, and it is a useful confirmation that carrying unverifiable quotes on corroboration alone was the right call only because CI was set up as the gate. The other seven reviewer-supplied snippets, including both PMID:36250920 items and both PMID:22470123 items, verified exactly.

    Fix: removed the failing evidence item rather than rewording it. Rewording would require reading the abstract to source a correct quote, and the egress block that prevented fetching in the authoring session is still in place - eutils, Europe PMC, and direct PubMed all still return 403 here. Inventing a replacement quote is precisely the failure mode the repo guards against.

    Nothing of substance is lost. The prevalence record still carries its verified GeneReviews evidence for the 20-percent-of-carriers versus 1-percent-of-general-population figure, so the claim remains fully evidenced; what was dropped is a corroborating primary-cohort citation that the reviewer had suggested as an enhancement. PMID:33927378 remains cited in the genetic section for the non-linear repeat-length risk curve, where its snippet verified in CI. Re-adding a correctly quoted penetrance figure from that paper is a clean follow-up for an editor with network access.

    Also rewrote the evidence-provenance paragraph in notes to record the actual two-stage verification outcome rather than the pre-CI uncertainty, and kept an explicit warning that unknown_prefix_severity: WARNING makes a local `just validate` pass silently over uncached references - local green is not verification for an uncached PMID.

    Validation after fix: just validate PASS with 7 reference checks and no errors, just validate-terms PASS, 56 evidence snippets all cited, internal targets and attaches_to refs resolve, non-therapeutic-action rule clean.

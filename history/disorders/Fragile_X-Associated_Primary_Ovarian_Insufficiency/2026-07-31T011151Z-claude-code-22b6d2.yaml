  summary: 'Create: Fragile X-Associated Primary Ovarian Insufficiency (FXPOI, MONDO:0010706)'
  details: 'De-novo curation of FXPOI (OMIM premature ovarian failure 1 / POF1) as a new Disease entry
    anchored on MONDO:0010706 (FMR1, HGNC:3775).


    Duplicate preflight: origin/main kb/disorders had no FXPOI entry; MONDO:0010706 appeared only as a
    differential-diagnosis reference inside 46_XX_Gonadal_Dysgenesis.yaml. GitHub PR and issue searches
    for "premature ovarian failure" / "ovarian insufficiency" returned no existing or in-flight curation
    for this entity.


    NEC preflight: the queried name "premature ovarian failure 1" resolved unambiguously against the MONDO
    record (OAK sqlite:obo:mondo) - causal gene FMR1 (RO:0004003 HGNC:3775), OMIM:311360 xref, and "premature
    ovarian failure 1" present as an EXACT synonym. The entry name follows current clinical usage (FXPOI
    / primary ovarian insufficiency); the OMIM/MONDO label is retained under synonyms.


    Deep research: claude_code provider via `just research-disorder claude_code`, 21 web searches over
    20 turns, 37 citations; report at research/Fragile_X-Associated_Primary_Ovarian_Insufficiency-deep-research-claude_code.md.
    Falcon is the skill default but no EDISON_API_KEY/FUTUREHOUSE_API_KEY was available in this environment.


    GeneReviews baseline: PMID:20301558 (FMR1 Disorders) was located, already cached, tagged GeneReviews
    in the top-level references block, and cross-referenced section by section. Its Clinical Characteristics,
    Diagnosis/Testing, Management, Agents-to-avoid (tobacco), and Genetic Counseling content are all reflected
    in the entry.


    Evidence limitation (the reason outcome is needs_followup): this session ran under an egress policy
    that blocked eutils.ncbi.nlm.nih.gov, www.ebi.ac.uk, api.crossref.org, api.semanticscholar.org, api.openalex.org
    and doi.org, so `just fetch-reference` could not cache any new reference. All 42 evidence snippets
    were therefore drawn from the 8 references already present in references_cache, and each was independently
    verified as an exact whitespace-normalized substring of its cached abstract. The FXPOI-specific primary
    literature surfaced by deep research - granulosa-cell CGG-RNA toxicity, CGG knock-in mouse follicle
    depletion, and the cohorts establishing the non-linear repeat-size risk curve - is described in the
    discussions and notes but deliberately NOT cited, because those snippets could not be verified. Adding
    those citations is the top follow-up for this entry.


    Evidence discipline: claims transposed from FXTAS or from general-POI sources carry supports: PARTIAL
    with an explicit reason in the explanation, and the two ovarian mechanism nodes carry mechanism_confidence:
    PROVISIONAL with a KNOWLEDGE_GAP discussion attached.


    Ontology limitation from the same network block: UBERON:0001305 (ovarian follicle) and GO:0003729
    (mRNA binding) exist in the ontologies but are absent from the committed dynamic-enum caches and could
    not be expanded offline; UBERON:0000992 (ovary) is used instead and the molecular-function annotation
    is omitted. This is recorded in the entry notes.


    Validation: `just validate` PASS (schema + terms + references), `just validate-terms` PASS, independent
    snippet substring check 42/42, compliance 87.3% global and 87.8% weighted.


    Pre-PR self-review against the dismech-pr-review rubric, and the resulting fixes:

    - Debundled the pathophysiology graph. The RNA-toxicity node was split into "RNA gain-of-function
    and sequestration of CGG-repeat-binding proteins" and "RAN translation and FMRpolyG production", matching
    how the sibling FXTAS entry models the same two arms, and the granulosa node was split into "Granulosa
    cell dysfunction and death" (CELLULAR) and "Accelerated ovarian follicle depletion" (TISSUE). "Chronic
    estrogen deficiency and its sequelae" was renamed to "Chronic estrogen deficiency". The graph is a
    single connected chain of seven nodes.

    - Removed GO:0008585 (female gonad development) from the hypergonadotropic hypogonadism node: that
    node is organ-level endocrine feedback, not a developmental process, so the GO annotation was inappropriate
    there.

    - Content-completeness gaps found against the deep-research report and closed: delayed puberty / primary-amenorrhea
    presentation added as a phenotype; ovarian-reserve assessment and the karyotype/autoimmune exclusion
    workup added to diagnosis; donor-oocyte IVF and bone-health surveillance added to treatments; AGG-interruption
    and X-inactivation-skewing modifiers recorded in the variant description; the mouse mTOR premature-follicle-recruitment
    arm recorded in the follicle-depletion node description and in notes rather than asserted as an evidence-backed
    node.

    - Two real defects were caught by replicating the cross-file test logic, and fixed: the bone-health
    treatment carried target_phenotypes while having action_category MONITORING, which test_non_therapeutic_actions_do_not_use_treatment_targets
    rejects; and the KNOWLEDGE_GAP discussion''s attaches_to refs still pointed at the pre-split node
    names.


    Test note: tests/test_data.py could not be run to completion in this environment (repeated timeouts,
    since collection spans ~15k parametrized cases and several need the blocked network). The checks bearing
    on this entry were replicated directly instead and all pass: unique disorder name across kb/disorders,
    required fields present, every evidence item carrying a reference, all downstream / sequelae / target_mechanisms
    targets resolving to real nodes, all discussion attaches_to refs resolving, and the non-therapeutic-action
    target rule. Full CI is expected to confirm.


    Final state: 46 evidence snippets across 8 cached references, each independently verified as an exact
    substring; `just validate` PASS; compliance 84.6% global, 85.0% weighted.'

  summary: 'Re-review follow-up: fix stale confidence prose, downgrade granulosa node
    to PROVISIONAL'
  details: |
    Responds to the ai4c-reviewer re-review of commit 21b46112, which closed both prior blocking findings and left one blocker plus a set of suggestions.

    Accepted the reviewer's substantive judgment call and downgraded 'Granulosa cell dysfunction and death' from ESTABLISHED back to PROVISIONAL. The reviewer's argument is right: the node's support is an ectopic-expression granulosa cell model plus premutation mice, with no observation in granulosa cells from carriers themselves, and CLAUDE.md cautions against letting model-organism evidence carry a human claim alone. The node's own prose still opened with 'The proposed cellular lesion', so ESTABLISHED was also internally inconsistent with the text. Left 'Accelerated ovarian follicle depletion' at ESTABLISHED, per the reviewer's own distinction - accelerated loss of ovarian reserve in premutation carriers is a clinical observation, not only a mouse result.

    Fixed the three stale prose statements the reviewer identified, all left over from the earlier confidence upgrade:
    1. The granulosa node description said it was 'marked PROVISIONAL' while mechanism_confidence read ESTABLISHED. Now consistent, and states the specific reason for PROVISIONAL rather than gesturing at a knowledge gap.
    2. exp_fxpoi_granulosa_foci_fmrpolyg.would_support said detection would move the nodes 'from PROVISIONAL toward ESTABLISHED' when they already were. Rewritten to name what the experiment would actually change - replacing ectopic-expression and mouse support with patient-derived evidence.
    3. fxpoi_nonlinear_repeat_size_risk.rationale said the cohort studies could not be fetched and snippet-verified. PMID:33927378 is now cited and verified in the genetic section, so that reason is void. Rewritten to separate the observation, which is settled, from the explanation, which is genuinely open.

    Also caught and fixed a fourth stale statement the reviewer did not flag: the fxpoi_ovarian_mechanism_evidence_gap rationale asserted that the granulosa and follicle-depletion nodes 'now rest on ovarian data' while the RNA and RAN nodes remain PROVISIONAL. After the downgrade that no longer described the file, so it now states which three nodes are PROVISIONAL and distinguishes the two different reasons.

    NOT fixed, and the reason outcome is needs_followup: the three references_cache files for PMID:36250920, PMID:22470123 and PMID:33927378 are still uncommitted. This is the reviewer's sole remaining blocker and it is correct. Fetching still returns 403 from this environment - retested at the time of this edit - and hand-writing references_cache files is the single most explicitly prohibited action in CLAUDE.md. The reviewer fetched and verified all three in CI and tried to push them itself, but github-actions[bot] lacks write access. Resolution requires a human with network access and push rights to run the three fetch-reference commands and commit only those three files, keeping the ~7,300-file reference_id quoting churn out of the branch.

    Deferred with the reviewer's agreement: UBERON:0001305 and GO:0003729 substitutions, premutation carrier frequency in prevalence, depression/anxiety phenotypes, and a re-quoted penetrance figure from PMID:33927378 to replace the item dropped in 21b46112.

    Validation: just validate PASS (7 reference checks, 0 errors), just validate-terms PASS, internal targets and attaches_to refs resolve, non-therapeutic-action rule clean.

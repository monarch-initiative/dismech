  summary: Add antigen-release feedback edge to Myocarditis pathograph
  details: |
    Adds the causal edge Cardiomyocyte Necrosis and Contractile Failure -> Anti-Cardiac Myosin Autoimmunity (INDIRECT_KNOWN_INTERMEDIATES, opted into the postinfectious_autoimmunity hypothesis group, evidenced by PMID:11334481).

    This is the one item left open by the review of PR #9954. Before the edge, Anti-Cardiac Myosin Autoimmunity had no incoming edge and rendered as a graph entry point, which implies tolerance breaks spontaneously. Mechanistically it is downstream: cardiac myosin released by dying myocytes, presented in an inflamed myocardium, is what breaks tolerance. The edge closes an amplification loop (injury releases the autoantigen, autoimmunity sustains the injury), which is why the chronic phase persists after the initiating virus is cleared.

    The cycle was checked before adding. The reviewer of #9954 walked the downstream edges of every disorder and module and found closed loops in 40 files, and confirmed both exporters handle them deliberately: browser_export._longest_path_length falls back to _longest_simple_path_length on a failed topological sort, and the cx2 layered layout runs nx.condensation before topological_sort so a strongly connected component collapses into one layer. KGX is an edge list with no DAG assumption.

    This lands as a separate PR only because PR #9954 was auto-merged at its previous head commit while GitHub had not yet synced the PR to the pushed commit carrying this edge; the content is unchanged from what was reviewed and endorsed there.

    Validation: just validate passed with 107/107 snippets verified; check-entity-refs and check-duplicate-keys passed.

  summary: 'Create: Myocarditis (MONDO:0004496)'
  details: |
    Curated the myocarditis root as a CURATE_ROOT_WITH_SUBTYPES Disease entry per issue #9040.

    Concept decision: a Disease, not a Grouping. The aetiological forms share one conserved pathograph (insult, innate amplification, adaptive T-cell-mediated myocyte injury, necrosis and contractile failure, fibrotic remodelling to inflammatory dilated cardiomyopathy, plus an arrhythmogenesis arm) and differ mainly at the trigger, so has_subtypes is the right structure. Five subtypes carried: Viral (MONDO:0023161), Lymphocytic (no MONDO term exists), Giant Cell (MONDO:0023232), Eosinophilic (no MONDO term), ICI-Associated (no MONDO term). The subtype set deliberately mixes an aetiological and a histological axis because that is how the biopsy report and the clinical literature are organised; this is recorded in the entry notes.

    Deep research: falcon (research/Myocarditis-deep-research-falcon.md), 8 of 8 report references verified, confabulation_rate 0.0, no needs_review flag. The report was used for framing and scope only. Every evidence snippet in the entry was sourced independently via PubMed E-utilities and cached with just fetch-reference, because the falcon report cited mostly DOI keys rather than PMIDs.

    Three pathophysiology nodes declare conforms_to against cardiomyopathy_maladaptive_remodeling: Cardiomyocyte Necrosis and Contractile Failure to #Primary Cardiomyocyte Insult, Post-Inflammatory Ventricular Remodeling to #Ventricular Remodeling, and Inflammatory Dilated Cardiomyopathy to #Structural Cardiac Impairment and Heart Failure.

    Conformance to immune_checkpoint_blockade was deliberately NOT declared for the checkpoint-inhibitor node, contrary to the suggestion in the issue. That module models anti-tumour efficacy only (neoantigen generation, anti-tumour T cell response, adaptive immune resistance, T cell exhaustion) and carries no immune-related-adverse-event or off-target-toxicity node, so every available anchor would misdescribe what happens in the myocardium. Recorded as a CURATION_TODO discussion (ici_myocarditis_module_gap) proposing that the module gain a shared irAE arm, rather than forcing a bad anchor.

    Two competing mechanistic_hypotheses curated with causal edges opting in: postinfectious_autoimmunity (CANONICAL) and viral_persistence (ALTERNATIVE). Also curated a KNOWLEDGE_GAP on why only some patients progress to dilated cardiomyopathy, and a HUMAN_MODEL_MISMATCH on the translational validity of the CVB3 and experimental autoimmune myocarditis rodent models, which carry most of the mechanistic content here.

    Validation: just validate passed with 90/90 snippets verified against cached references; just validate-terms passed; check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all passed; just validate-disorders run as the final batched gate.

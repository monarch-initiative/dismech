  summary: 'Create: Spondyloepimetaphyseal Dysplasia with Joint Laxity Type 3'
  details: |
    New entry for SEMDJL3 (MONDO:0032724; OMIM:618395; ORPHA:642085), autosomal recessive, caused by biallelic EXOC6B (hgnc:17085) loss of function. Replaces stub stubs/Spondyloepimetaphyseal_Dysplasia_With_Joint_Laxity_Type_3.yaml.

    Deep research: one Perplexity report (sonar-deep-research), research/Spondyloepimetaphyseal_Dysplasia_with_Joint_Laxity_Type_3-deep-research-perplexity.md, generated through a streaming transport shim that works around dismech#9357; the model is the standard sonar-deep-research. Reference validation 4/4 resolved; two of the four (PMID:18841068, PMID:37226647) concern other SEMD-JL types (leptodactylic/Hall type and SEMDJL2) and are not cited. The report's term suggestions were mostly mislabelled (34 of 54 labels named a different term) and none were copied; every CURIE was looked up in the term caches or OLS. The report also attributes the Campos-Xavier 2018 family to PMID:36150098, which is the Simsek-Kiper 2022 series; the Campos-Xavier paper (PMID:30284759) has no PubMed abstract and is not cited. OMIM 607880 in the report is the EXOC6B gene record. Preflight WARN flagged disease acronyms as second genes; the report is about EXOC6B.

    Evidence was re-derived from PubMed: the GeneReviews chapter (PMID:37229238, tagged GeneReviews) is the phenotype and management baseline; the founding family (PMID:26669664), the 2022 series with patient-fibroblast exocytosis and ciliogenesis data (PMID:36150098), an ATDC5 Exoc6b-knockdown chondrogenesis study (PMID:38305850), an EXOC6B autophagy/cilium-length cell-line study (PMID:42068746) and a 2026 arthroplasty case report (PMID:42231408, full text). ISDS 2023 nosology group 5 is cited from the existing cached nosology PDF.

    Pathophysiology: EXOC6B loss of function -> impaired exocytosis (patient fibroblasts) and reduced basal autophagy (cell lines) -> impaired primary ciliogenesis -> attenuated Hedgehog signalling -> dysregulated chondrocyte differentiation -> abnormal endochondral ossification -> radiographic and growth phenotypes. Every step past the cellular level is INDIRECT_UNKNOWN_INTERMEDIATES; the joint-dislocation and laxity edges rest only on the discoverers' KIF22 shared-mechanism hypothesis and are grouped under an EMERGING hypothesis, with KNOWLEDGE_GAP discussions for the joint mechanism and the ciliopathy model. CNS findings (ID, hydrocephalus, thin corpus callosum) come from a single individual and are described as such.

    Validation: just validate, validate-terms, count-verified-snippets (94/94), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes pass. Two snippets from PMID:26669664 were shortened to end before a bracketed HGVS variant, which the snippet matcher strips as an editorial insertion.

  details: |
    Reviewed the full umbrella entry against the TUBB3 primary cohorts, mechanistic rescue work, and the Tubulinopathies Overview GeneReview. Corrected the allele-dependent scope: CFEOM3 characterizes the axon-guidance arm but can be absent in cortical-malformation variants. Removed the redundant generic ocular phenotype, broadened the callosal HPO term from agenesis to abnormal morphology, normalized polymicrogyria-like language to cortical dysgyria/abnormal gyration, atomized the bundled cortical-pontocerebellar node, and calibrated genotype-associated outcomes with unknown intermediates rather than invented routes. Added role/scale annotations, gene wiring, evidence on every causal edge, diagnosis, progression, clinical burden, treatment evidence, a representative p.Arg262His variant, an explicitly limited knock-in mouse model, and explicit empty dataset/human-model sections. Final checks passed: schema and ontology terms, 53/53 strict cached snippets, 12/12 edge evidence with graph integrity, 8/8 phenotype connectivity, 1/1 causal-gene wiring, reference-cache contract, snippet-length ratchet, all-history validation, and diff hygiene.

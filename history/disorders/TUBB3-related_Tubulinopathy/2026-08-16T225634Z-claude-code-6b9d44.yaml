  summary: Fix unprefixed GeneReviews references failing test_evidence_items_have_references
  details: |
    PR #8393 merged with 16 references to the GeneReviews 'Tubulinopathies Overview' chapter written as a bare URL (https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf) with no reference prefix. 15 of these are evidence items, which made tests/test_data.py::test_evidence_items_have_references fail on main. Added the allowed 'url:' prefix to all 16.

    Deliberately did NOT convert these to PMID:27010057 (the GeneReviews chapter's PubMed record) even though that identifier exists: the cached PubMed record is the GeneReviews stub (purpose statement plus author information, ~1050 characters) and 0 of the 15 snippets appear in it, because the snippets are quotes from the chapter's full text and tables. A PMID switch would have traded one prefix failure for 15 snippet-validation failures. The existing references_cache entry for the url: form is content_type full_text_pdf and holds the full chapter text, which is why all 64 snippets in this file verify.

    Also normalized 10 reference_title fields that had been set to the URL string itself to 'Tubulinopathies Overview.', matching the sibling entries that already used that title. The top-level references[] title for the url: entry is intentionally LEFT as the URL string because it must mirror the cached title, and the PDF cache has no derivable title; the PMID:27010057 entry's title was already correct and is unchanged.

    Validation: tests/test_data.py::test_evidence_items_have_references now passes across all 1977 disorder files; just validate passes (schema, terms, references) with 'Snippets checked: 64/64 verified against cached references'.

  summary: Add DOMINANT_NEGATIVE genetic_context and CDCBM1/CFEOM3A mappings
  details: |
    Recommendations 6 and 8 of docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

    Added a genetic_context to the trigger node recording functional_impact_category DOMINANT_NEGATIVE. The evidence for this was already on the node and simply unlabeled: the founding study shows that although the substitutions impair heterodimer formation, folded mutant heterodimers still polymerize into microtubules where they alter dynamic instability and, for a subset of residues, disrupt the microtubule-kinesin interaction. A mutant subunit that incorporates and degrades a motor-binding surface acts on the wild-type polymer rather than subtracting a gene dose.

    Qualified the de novo variant_origin with an inherited-allele evidence item: a maternally inherited TUBB3 c.211G>A allele associated with milder features in a Korean cohort.

    Added a mappings block with narrowMatch to MONDO:0013541 (CDCBM1) and MONDO:0010912 (CFEOM3A), both of which this entry subsumes under its broader disease_term MONDO:0100154 but neither of which was formally retired from the curation queue.


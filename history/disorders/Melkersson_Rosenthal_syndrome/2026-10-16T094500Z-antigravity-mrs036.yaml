  summary: Enhanced Melkersson-Rosenthal syndrome with classifications, inheritance, progression, diagnosis,
    top-level references, gene-to-pathophysiology links, causal phenotype edges, directness annotations
    on indirect cytokine evidence, and abstract-verified snippets.
  details: 'Added classifications (NEUROLOGIC, IMMUNE_RHEUMATOLOGIC, DERMATOLOGY), Sporadic inheritance
    (HP:0003745), progression (Onset), and diagnosis (Clinical Diagnosis NCIT:C15607 and Histopathologic
    Examination NCIT:C18190). Removed inflammatory cytokine entries (TNF, IFNG, IL12B) from genetic while
    keeping them on the upstream Th1/Th17 cytokine pathophysiology node with specific receptor-binding
    GO molecular_functions (GO:0005164, GO:0005133), and bound candidate SCN1A (hgnc:10585) in genetic
    and on a trigger pathophysiology node with GO:0005248. Marked indirect therapeutic-response and hypothesis-based
    cytokine evidence with directness: INDIRECT in pathophysiology and biochemical. Corrected the granulomatous
    inflammation GO term to GO:0002432 (granuloma formation), added downstream causal edges connecting
    all 4 phenotypes (0 disconnected phenotypes), restored single-line abstract-verified snippets in treatments
    and other sections, and populated top-level references.'

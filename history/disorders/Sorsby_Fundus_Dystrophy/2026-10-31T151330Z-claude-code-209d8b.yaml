  summary: 'Create: Sorsby_Fundus_Dystrophy'
  details: |
    De novo curation of Sorsby fundus dystrophy (MONDO:0007640, TIMP3, autosomal dominant). Thirteen pathophysiology nodes form a chain from the heterozygous cysteine-altering TIMP3 variant through aberrant disulfide bonding and multimerization, resistance to turnover from the extracellular matrix, accumulation in Bruch's membrane and sub-RPE deposit formation, then branching into the transport-barrier arm (vitamin A deprivation, night blindness), the angiogenic arm (loss of VEGFR2 inhibition, raised MMP2 activity and bFGF release, neovascular membrane formation) and the degenerative arm (choriocapillaris flow impairment, oxidative-stress susceptibility, glucose and glutamine metabolic dysregulation, photoreceptor and RPE degeneration). Sixteen phenotypes, 15 of them causally wired; Emphysema is left isolated because no pulmonary mechanism is curated here. ClinGen Definitive (AD, Retina GCEP) recorded in gene_disease_validity with the CGGV row quoted. The MONDO descendant MONDO:0009918 (recessive pseudoinflammatory form, OMIM 264420) is deliberately left out rather than added as a subtype: its source family was later shown to carry a heterozygous TIMP3 variant, ClinGen records the recessive proposal as refuted, and MONDO records no causal gene for that term; both statements are cited. One OpenScientist deep-research report was used (27/27 references verified, confabulation_rate 0.0, 19/27 on topic, 32/35 terms verified with 13 label mismatches including UBERON:0001782 offered as Bruch's membrane, which is actually pigmented layer of retina; every binding here was looked up independently). just preflight-dr returned WARN only because the string RPE is counted as a gene symbol; the report cites the correct OMIM 136900 and names TIMP3 38 times. The report's proposed ADAM17/TNF-alpha inflammatory arm was NOT encoded as a mechanism node because one of its own cited reviews records that the Ser179Cys variant inhibits ADAM17 as well as wild-type TIMP-3; the adalimumab single case report is recorded as a treatment with that contradiction cited as REFUTE evidence. No GeneReviews chapter exists (three PubMed genereviews[book] searches and the committed Bookshelf index). Validated: validate, validate-terms, validate-disorders, count-verified-snippets 171/171, check-entity-refs, check-causal-targets, check-logical-rules, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-grading, check-retired-support-prose, check-shared-disease-terms, check-gene-validity, list-gene-term-mismatches (0 findings), check-genereviews, term cache integrity.

  summary: 'Phenotype review: Giant_Axonal_Neuropathy_1'
  details: |
    Campaign phenotype review (snippet consistency, HPO binding, pathograph connectivity) of all 24 phenotypes. Snippet-to-claim check: every quoted snippet re-verified in whole-paper context against the cached sources (PMID:39680150 German cohort Table 2 rows, PMID:20301315 GeneReviews, PMID:34114613 natural history cohort, PMID:38507752 NEJM gene therapy trial, PMID:11062483 gene discovery, ORPHA:643); no wrong-disease citations, no title-as-snippet, frequency bands all consistent with quoted denominators; no snippet fixes needed. HPO check: rebound the white-matter phenotype from HP:0002500 Abnormal cerebral white matter morphology to the more specific HP:0030890 Hyperintensity of cerebral white matter on MRI (source states T2 hyperintensity); confirmed no combined sensorimotor-axonal HPO term exists so HP:0003477 stands; other bindings match the cohort's own HPO coding. Connectivity: the entry had 24/24 phenotypes causally unconnected despite a complete internal pathophysiology chain; added 24 downstream edges from existing nodes (Distal Axonal Degeneration -> 14 peripheral/musculoskeletal/respiratory phenotypes; Central Nervous System Degeneration -> 6 central phenotypes; Intermediate Filament Aggregation -> kinky hair via keratin and autonomic dysfunction via myenteric plexus inclusions; Progressive Neurological Decline -> vision loss and feeding difficulties). Edge-level evidence quoted from cached full text where the mechanistic link is itself a claim (keratin-hair attribution, corticospinal tract pathology, MRI window, myenteric plexus inclusions with directness INDIRECT, FVC-motor correlation with directness INDIRECT, bulbar symptoms); obvious summary edges carry descriptions. Vision loss wired INDIRECT_UNKNOWN_INTERMEDIATES because no cited source specifies the ocular lesion. Also wired causal gene GAN into the pathograph via a genes descriptor on Gigaxonin Loss of Function, and added a FREQUENT band to Vision loss from the 22/45 (49%) reduced-visual-acuity figure. Validated with just validate-disorders (95/95 snippets verified).

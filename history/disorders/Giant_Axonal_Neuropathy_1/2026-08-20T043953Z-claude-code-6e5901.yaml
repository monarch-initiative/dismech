  summary: 'Create: Giant_Axonal_Neuropathy_1 (GAN, MONDO:0009749)'
  details: |
    De novo curation of giant axonal neuropathy 1 (MONDO:0009749), claimed via issue #9034.

    DEEP RESEARCH: falcon (Edison), 510s run, 31 citations. Report at research/Giant_Axonal_Neuropathy_1-deep-research-falcon.md with one artifact. The report's own reference validation reported 13/13 references resolved, confabulation_rate 0.0, 0 off-topic. NEC preflight (just preflight-dr against MONDO:0009749) returned PASS: canonical gene GAN mentioned 52 times and dominant over all rivals (NEFL=5, INA=4), so the report is about the intended entity.

    DR ERROR CAUGHT: the falcon report suggested HP:0002224 as "Kinky hair". OAK shows HP:0002224 is "Woolly hair". The entry uses the verified HP:0002212 "Curly hair" instead. This is the invented/mismatched-ontology-label failure mode; no DR-suggested term was used without OAK verification.

    GENEREVIEWS BASELINE: PMID:20301315 ("GAN-Related Neurodegeneration") found, fetched, cached, and tagged GeneReviews in the top-level references block. Its Clinical Characteristics framing drove the structural decision below. Its management and inheritance statements are cited directly.

    LUMP/SPLIT DECISION: curated as a single Disease at MONDO:0009749 (the gene-specific term) with the classic severe and milder CMT-like presentations as has_subtypes, NOT as separate entries and NOT at the MONDO parent. MONDO:0000128 "giant axonal neuropathy" is an OMIM phenotypic-series grouping essentially coextensive with GAN1, so curating both would create a near-duplicate pair. GeneReviews independently treats the whole range as one continuum from one mechanism. Reasoning recorded in the entry's notes block.

    CONTENT: six-node pathophysiology chain (gigaxonin loss -> impaired IF degradation -> IF transport failure -> IF aggregation -> giant axon formation -> distal axonal degeneration -> progressive neurological decline), with the degeneration node declaring conforms_to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination. The transport-failure arm is curated as parallel to, not downstream of, the degradation defect; the source's own oligomer-saturation linkage is explicitly speculative and is flagged as not asserted, in the node's notes.

    FREQUENCIES: eleven phenotypes carry frequency bands sourced from the HPO-coded Table 2 of PMID:39680150 (German cohort, n=15), each with its own quoted count as evidence per the frequency-evidence SOP. A prose/table discrepancy for hypotonia (46.7% at onset vs 93.3% cohort-wide) is reconciled in the evidence explanation rather than silently picking one number.

    TREATMENT DISCIPLINE: the scAAV9/JeT-GAN gene therapy is curated with supports: PARTIAL on the trial's own hedged conclusion, plus a second evidence item recording that sensory-nerve action potentials remained absent in 8 of 14 participants. The description states explicitly that this is investigational, that results were dose-dependent, and that the highest dose did not meet the efficacy threshold.

    DATASETS: none recorded. just discover-datasets returned only GENE_ONLY candidates, all false matches on "GAN" as the Gubra-Amylin NASH ("GAN diet") mouse model rather than the GAN gene. Relevance triage rejected all; recorded in the entry notes as Named Entity Confusion reached through dataset search.

    KNOWLEDGE GAP: one KNOWLEDGE_GAP discussion on what determines position on the phenotypic continuum, attached to the Progressive Neurological Decline node, with evidence that no genotype-phenotype correlation or mutation hotspot has been found, plus a proposed CRIM-status/genotype correlation experiment.

    VALIDATION: just validate passes (schema + terms + references). just validate-disorders (the batched sweep CI runs, --no-full-text) passes with "Snippets checked: 52/52 verified against cached references". Also passing: check-duplicate-keys, check-title-snippets, check-empty-snippets, check-snippet-length (ten table-row snippets were lengthened past the five-word minimum, re-verified afterwards), check-environmental-evidence. Compliance run; remaining gaps are datasets (deliberately empty, see above) and proposed_experiments sub-slots.

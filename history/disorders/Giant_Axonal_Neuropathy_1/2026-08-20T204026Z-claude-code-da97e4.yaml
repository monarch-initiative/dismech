  summary: Correct trial status to COMPLETED; add autophagy arm, A49E knock-in model,
    model-fidelity mismatch
  details: |
    Follow-up after PR #9065 merged. Corrects a factual error I introduced and curates leads from the claim-issue second-opinion comment that I failed to read during the original session.

    PROCESS FAILURE THIS RECORD EXISTS TO DOCUMENT: an automated second-opinion agent posted a detailed dossier on issue #9034 at 04:08:59Z, roughly thirty minutes before the enrichment pass began. The claim-disease skill instructs the curator to check back for that comment. I never did. It contained the MONDO parent fact I got wrong and only caught two hours later by red team, and the correct clinical trial status. Both defects below were avoidable.

    1. CLINICAL TRIAL STATUS - FACTUAL CORRECTION. NCT02362438 was curated as ACTIVE_NOT_RECRUITING, inferred from the 2024 publication describing the study as ongoing with enrollment closed in August 2020. That inference was wrong and was already stale when made. The ClinicalTrials.gov v2 API reports overallStatus COMPLETED with an ACTUAL completion date of 2026-04-10 (record last updated 2026-08-14, queried 2026-08-20). Status corrected to COMPLETED; the explanation that documented the inference has been replaced. No evidence item quotes the status: the cached registry record predates completion and carries no recruitment-status field, so the fact is recorded in trial notes with its provenance rather than as a fabricated snippet. The lesson is that the correct response to a missing field in a cached record is to query the authority, not to infer and disclose the inference.

    2. AUTOPHAGY-LYSOSOME FAILURE ARM (PMID:40059823). New pathophysiology node capturing a feed-forward limb absent from the original entry: neurofilament accumulations disrupt autophagy by two distinct routes - interfering with autophagic organelle distribution and lysosome fusion, and sequestering 14-3-3 so that TFEB is mislocalized. Direction is explicitly curated and noted, because it inverts easily: accumulation causes autophagy failure, not the reverse. The return edge to Intermediate Filament Aggregation is INDIRECT_KNOWN_INTERMEDIATES because the source demonstrates the autophagy defect and proposes its pathogenic contribution rather than measuring the effect back on filament load. Node notes record why this is deliberately NOT conformed to loss_of_proteostasis#Misfolded-Protein Aggregation: GAN aggregation is failure of regulated degradation of correctly folded intermediate filaments, not misfolding.

    3. GAN A49E KNOCK-IN MOUSE (PMID:41402936), and a consequent downgrade of an existing claim. The knock-in reproduces giant axons, demyelination and neurofilament compaction, which the knockout strains do not. Added as a second animal model with modeled_mechanisms, readouts and evidence. Critically, the same paper reports that the earlier knockout strains exhibit mild late-onset symptoms with no overt degeneration and an absence of giant axons and NF compaction. The existing Gan knockout model entry claimed RECAPITULATES / fidelity MODERATE against Intermediate Filament Aggregation; that overstated what the model supports and has been downgraded to PARTIALLY_RECAPITULATES / LOW with the contradicting quote attached as PARTIAL evidence. Also added a HUMAN_MODEL_MISMATCH discussion: the preclinical package supporting the first-in-human trial rests largely on strains lacking the two lesions the therapy targets, with a proposed replication of the gene-transfer experiment in the A49E strain, powered for the reported female-biased severity.

    4. ORPHANET. Built references_cache/ORPHA_643.md via just structured-rebuild-orphanet --id 643 (required just refresh-orphadata first; the bulk XML was absent). NOTE - the second-opinion comment predicted this would be the cleanest source for a prevalence record with prevalence_class. It is not: ORPHA:643 has no Epidemiology section at all. Other ORPHA records in the cache do have one, so this is a genuine absence of Orphanet prevalence data for this disorder, not a build problem. No prevalence record was added; the existing CASES_IN_LITERATURE record (~75 families) remains the only defensible occurrence figure. The record's definition was used instead as independent corroboration of the hair phenotype ("characteristic kinky hair in most cases"), agreeing with the German cohort's 93.3% and the VERY_FREQUENT band.

    5. MONDO PARENT MAPPING. Added MONDO:0000128 as skos:broadMatch with notes recording that it spans this entry's GAN/gigaxonin disease and the distinct DCAF8 disease MONDO:0012411, and that broadMatch does not retire the parent from the curation queue since GAN2 remains uncurated.

    TWO ERRORS MADE AND CAUGHT DURING THIS SESSION, recorded because both are instructive: (a) a scripted edit inserted reference_title lines at the wrong indentation, producing invalid YAML - caught by the parser; (b) the same edit created a duplicate evidence key inside a modeled_mechanisms link, which safe_load silently accepts and only the ruamel-backed reference validator rejects. Fixed by merging the two blocks and keeping both evidence items, per the duplicate-key policy, not by deleting either. A single assert across multiple string replacements also masked one replacement failing silently; per-replacement assertions were used afterwards.

    VALIDATION: just validate and just validate-disorders (the batched sweep CI runs) both pass with "Snippets checked: 83/83 verified against cached references" (was 76). check-duplicate-keys, check-snippet-length, check-title-snippets and check-empty-snippets all clean. Pathograph verified programmatically: 9 nodes, single root, no orphans, no dangling targets. Compliance 91.2% (the denominator grew with the new model and discussion).

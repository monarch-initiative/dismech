  summary: 'Address red-team review: CNS arm, orphan node, diagnosis section, frequency
    and evidence defects'
  details: |
    Applied fixes from a pre-PR red-team review of the entry created in the previous commit. All findings were independently verified before acting; the review's own suggestions were checked rather than trusted.

    BLOCKING FIXES:

    1. CNS arm was missing (the graph routed all central disease through distal peripheral axon loss). Cerebellar signs, cognitive decline and vision loss cannot descend from distal peripheral degeneration, and the GFAP-in-astrocyte aggregation that was already curated had no outgoing edge. Added a "Central Nervous System Degeneration" node (TISSUE scale, astrocyte CL:0000127, GO:0051402) fed by Intermediate Filament Aggregation and feeding Progressive Neurological Decline, evidenced by human CNS involvement (PMID:34114613), human white-matter MRI (PMID:39680150), and brain inclusion pathology plus cortical/spinal neuron loss in the Gan-/-;TgPer model (PMID:37137704). Node notes record that the model-organism source claims only that IF disorganization "can drive some neurodegenerative changes", so the edge is not curated as a sole-cause claim.

    2. Intermediate Filament Transport Failure was an orphan root with no upstream cause, and the previous history record described an edge the YAML did not contain. Added the Gigaxonin Loss of Function -> Intermediate Filament Transport Failure edge with its own evidence (PMID:37043392). The pathograph now has exactly one root, no dangling targets, and two parallel arms converging on the terminal node.

    3. GeneReviews was only partially mined - the DIAGNOSIS/TESTING section was uncited and there was no diagnosis block. Added a diagnosis section (molecular genetic testing quoting the GeneReviews diagnostic statement; nerve conduction studies/EMG; brain MRI) and a histopathology section for the pathognomonic giant axons on sural nerve biopsy.

    EVIDENCE AND FREQUENCY DEFECTS:

    - Distal Axonal Degeneration cited a quote that skipped the axonal-loss step it asserted. Replaced with the sentence from PMID:38507752 that states it directly; kept the original as a secondary item.
    - PMID:23316953 was tagged HUMAN_CLINICAL; it reports patient-fibroblast and Gan-knockout-mouse work. Retagged IN_VITRO, which also removes an internal inconsistency with the same PMID's correct tagging elsewhere in the file.
    - Gait disturbance was VERY_FREQUENT on a 15/15 row; corrected to OBLIGATE, with the explanation stating that this is obligate within the cohort rather than a penetrance claim. Same treatment applied to the newly added muscle weakness (15/15).
    - Respiratory phenotype bound HP:0002093 (matching the 53.3% "abnormality of the respiratory system" row) while taking its OCCASIONAL band from the narrower 13.3% ventilatory-support row. Rebound to HP:0004887 so term and band come from the same row.
    - Vision loss was bound to HP:0000648 Optic atrophy, a lesion the evidence does not state. Rebound to HP:0000572 Visual loss.
    - Subtype-scoped frequencies (intellectual disability, seizures) used a whole-cohort denominator; explanations now state the denominator and give the subtype-scoped recomputation.
    - The sensorimotor neuropathy frequency explanation claimed a denominator its snippet does not carry; rewritten as an explicit qualitative mapping.
    - Giant Axon Formation -> Distal Axonal Degeneration downgraded from DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES, since whether the swellings cause degeneration or are a parallel manifestation of the same accumulation is unsettled.
    - Mixed-source evidence item (patient fibroblasts plus Gan-/- mice under one IN_VITRO tag) split into IN_VITRO and MODEL_ORGANISM items.

    FACTUAL CORRECTION TO THE LUMP/SPLIT RATIONALE: the previous notes claimed MONDO:0000128 is "essentially coextensive with GAN1". That is false - it has two gene-specific children, GAN1 (GAN, MONDO:0009749) and GAN2 (DCAF8, MONDO:0012411), verified with OAK. The decision to curate at the gene-specific child is unchanged and in fact better supported: curating at the parent would conflate two genes. Also added a naming caution, because GAN2's own synonyms include "CMT2 with giant axons" and could be confused with this entry's "CMT-like GAN" subtype, which is the mild end of the GAN/gigaxonin continuum and a different disease.

    PHENOTYPE COVERAGE: added nine phenotypes at or above 13% from the same HPO-coded Table 2 already mined for the others - muscle weakness, skeletal muscle atrophy, frequent falls, autonomic dysfunction, abnormal foot morphology, pyramidal signs, delayed gross motor development, feeding difficulties - plus cerebral white matter abnormality (no frequency asserted, none given by the source). Phenotype count 11 -> 24.

    OTHER: trial description now states that three of four doses missed the 95% posterior-probability threshold rather than implying only the highest did, and records the 8-of-14 sensory-nerve non-responders. Clinical trial ACTIVE_NOT_RECRUITING status was unevidenced; added the enrollment-window and follow-up-schedule evidence and stated explicitly in the explanation that the status is inferred because the cached registry record carries no recruitment-status field. Conformance to peripheral_axonal_degeneration strengthened with Schwann cell and axon ensheathment descriptors. Prevalence explanation corrected to say families rather than cases.

    NOTE ON A REVIEW SUGGESTION NOT TAKEN AS GIVEN: the review proposed GO:0070997 (neuron death) for the degeneration nodes. Term validation showed it is obsolete, so GO:0051402 (neuron apoptotic process) was used instead.

    VALIDATION: just validate and just validate-disorders (the batched sweep CI runs) both pass with "Snippets checked: 76/76 verified against cached references" (up from 52). check-duplicate-keys, check-snippet-length, check-title-snippets and check-empty-snippets all clean. Pathograph connectivity verified programmatically: one root, no orphan nodes, no dangling downstream targets. Compliance 51.9% -> 93.0%.

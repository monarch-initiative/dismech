  summary: Address review of SLC25A3 treatment binding and negative functional evidence
  details: |-
    Addressed both blocking findings and all accepted suggestions from the independent review of PR 13529 on 14ba92ffdb93f410362d37379a5485189b2ae812. Mitochondrial transplantation is an unbound clinical-action descriptor, with the three live NCIT searches and their actual results recorded; modality OTHER reflects organelle rather than whole-cell transfer. Preserved maximal phosphorylation in patient fibroblasts is now REFUTE evidence for the reduced-ATP-synthesis node. The L200W neutral yeast result is REFUTE in both affected records, scoped to the original deleterious prediction. Preserved bulk cardiac ATP was moved to the animal model, where it supports the documented compensatory phenotype without implying that energetic stress was absent. Blood-lactate wording no longer implies universality; the adult survivor's exertional symptom onset is explicitly early childhood. All findings bundled with this append-only EDIT record in one follow-up push.
     Added explicit REFUTE evidence for the normal-lactate case and tightened the interpretation of normal respiratory-chain activity alongside carrier depletion.

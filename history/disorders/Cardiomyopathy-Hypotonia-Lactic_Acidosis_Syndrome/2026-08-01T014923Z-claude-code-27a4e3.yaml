  summary: 'Create: Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome (SLC25A3)'
  details: |
    REJECTED DEEP-RESEARCH REPORT (Named Entity Confusion). The Edison/Falcon run at
    research/Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome-deep-research-falcon.md is a
    confirmed NEC failure and was NOT used as a curation source. It contains zero mentions of
    SLC25A3 or "phosphate carrier" across 102KB and 57 mentions of MIPEP, and its executive
    summary maps the disease name to MIPEP-related combined oxidative phosphorylation deficiency
    31 (COXPD31 / Eldomery-Sutton syndrome, OMIM 617228) rather than to SLC25A3 /
    MONDO:0012557 / OMIM 610773 / ORPHA:91130. Per the CLAUDE.md NEC rule the report was
    discarded entirely rather than cherry-picked; the report, its citations sidecar, and its
    artifacts directory are still committed as DR provenance. MIPEP/COXPD31-specific features
    (left ventricular noncompaction, cataracts, seizures, Wolff-Parkinson-White) were
    deliberately NOT curated into this entry. See tracking issue #7510.

    Target identity was verified independently with OAK against MONDO:0012557
    (relationship RO:0004003 HGNC:10989 SLC25A3; xref OMIM:610773; xref Orphanet:91130; the
    definition names the exon 3A SLC25A3 mutation). The entry was then rebuilt from primary
    literature anchored on SLC25A3.

    Anchor papers (all fetched with just fetch-reference and read in full):
    PMID:17273968 Mayr 2007 AJHG - index report, two Turkish sisters, homozygous exon 3A
    c.215G>A p.Gly72Glu, yeast complementation, muscle-versus-fibroblast ATP-synthesis
    dissociation; PMID:21763135 Mayr 2011 - family with three affected children, homozygous
    c.158-9A>G, reduced carrier protein with NORMAL respiratory-chain enzyme activities;
    PMID:25681081 Bhoj 2015 - two new patients, phenotype expansion (isolated cardiomyopathy
    without myopathy or lactic acidosis), compound heterozygote; PMID:38656665 - infantile
    Pompe mimic; PMID:40944834 - 2026 case report plus literature review, 32-year-old survivor;
    PMID:24658400 Kwong 2014 - cardiac-specific Slc25a3-null mouse; PMID:29237729 Boulet 2018 -
    SLC25A3 as mitochondrial copper transporter required for COX biogenesis; PMID:39671292
    Li 2024 - SLC25A3 hiPSC-cardiomyocyte disease model; PMID:40362619 Zabit 2025 - TAT-mPiC
    protein replacement; PMID:8980128 Dolce 1996 and PMID:9712911 Fiermonte 1998 - exon
    IIIA/IIIB isoform tissue distribution and transport kinetics.

    Curated content: 8 pathophysiology nodes forming a single connected chain (tissue-specific
    exon 3A/3B splicing -> carrier loss in heart/skeletal muscle -> reduced matrix inorganic
    phosphate -> ATP synthase substrate limitation and impaired oxidative phosphorylation ->
    striated-muscle energy deficit -> cardiomyocyte hypertrophy/ventricular remodeling, with a
    parallel compensatory-glycolysis/lactate branch and a PROVISIONAL copper/COX arm);
    9 phenotypes with HPO terms; 4 biochemical markers; 1 genetic block with 3 SLC25A3 variants;
    3 progression phases; 1 diagnosis and 1 differential-diagnosis entry; 5 treatments; and
    2 discussions (a HUMAN_MODEL_MISMATCH on the copper/COX arm versus normal patient
    respiratory-chain enzymes, and a KNOWLEDGE_GAP on the unexplained genotype-phenotype
    severity spectrum). 73 evidence snippets, all exact substrings of cached abstracts.

    Module conformance: asserted against kb/modules/cardiomyopathy_maladaptive_remodeling.yaml
    at #Primary Cardiomyocyte Insult (the metabolic/bioenergetic cardiomyocyte insult) and
    #Ventricular Remodeling (supported directly by the cardiac Slc25a3-null mouse). The module's
    intervening neurohormonal-activation step is explicitly NOT asserted because no
    disease-specific evidence exists for it.

    Deliberate omissions and modeling decisions: no phenotype frequency bands are asserted
    anywhere - the published cohort (fewer than about a dozen molecularly confirmed patients)
    cannot support them. Prevalence uses measure_type CASES_IN_LITERATURE with
    prevalence_class ULTRA_RARE, never the deprecated percentage field. Death in infancy is
    curated under progression rather than phenotypes because HP:0001522 sits in the HPO
    Mortality/Aging branch, outside the PhenotypeTerm dynamic enum (matching the precedent in
    Isolated_Sulfite_Oxidase_Deficiency and MOPD Type I). No GeneReviews chapter exists (PubMed
    search "SLC25A3 GeneReviews" returned 0 hits on 2026-07-31), so the usual GeneReviews
    phenotype baseline was unavailable; this is documented in the entry notes. ORPHA:91130 was
    NOT cited: upstream Orphadata en_product1.xml has drifted from the sha256 pinned in
    data/orphadata/MANIFEST.yaml (54026799 vs 53331679 bytes), so just refresh-orphadata fails
    its checksum gate and the ORPHA cache file could not be built reproducibly against the
    pinned snapshot. PMID:40505409 (Spanish family, Med Clin Barc 2025) was fetched but has no
    abstract in PubMed, so it could not supply a verifiable snippet and is not cited. No
    reference_ranges were added for lactate because no citable interval could be sourced.
    No clinical trials exist for this disorder. Two treatments (TAT-mPiC protein replacement,
    mitochondrial transplantation) are labelled investigational/preclinical in name, description,
    and context so they cannot be mistaken for clinical options.

    Validation: just validate PASS (schema + terms + references); just validate-terms PASS;
    just validate-references PASS with 73/73 snippets verified against cached references;
    just compliance 89.0% global / 89.4% weighted; just validate-graphs shows no errors for this
    entry (pre-existing failures in other files only); pytest tests/test_data.py conformance and
    foreign-key subset 6841 passed. Treatment terms initially drafted with MAXO:0000088 and
    MAXO:0000079 were switched to NCIT:C15447 (Dietary Intervention) and NCIT:C15240 (Genetic
    Counseling) because the TreatmentActionTerm dynamic enum is reachable only from NCIT:C25218
    and rejects MAXO ids, despite CLAUDE.md listing MAXO terms as usable there - worth flagging
    as a documentation/schema inconsistency.

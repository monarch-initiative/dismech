  summary: Review SLC25A3 clinical spectrum, allele function and phosphate/copper mechanisms using
    cached full texts
  details: |
    Reviewed the full existing entry against primary SLC25A3 sources, including recovered full texts for the 2007 and 2015 clinical reports; 2014 cardiac deletion; 2016 patient-cell/yeast experiments; 2018 copper transport; 2021 substrate separation; 2024 G72E/copper/mitochondrial-structure experiments; 2025 TAT-mPiC; and the explicitly labeled 2025 meclizine and 2026 myotube preprints.

    Entity preflight rejected the matching Falcon report: SLC25A3 was absent and the narrative concerned MIPEP-related disease. The report was discarded in full, consistent with the earlier CREATE record and issue 7510. The eight completeness dimensions were assessed directly against primary literature:
    1. Phenotypes: retained established cardiac/myopathic findings and added full-text failure to thrive, cyanosis, low-output failure, lactate:pyruvate ratio and a qualified single-case thin corpus callosum. Did not promote perioperative seizures or transient neonatal shunts to primary defining manifestations. Frequency and prognosis claims were narrowed to observed cases.
    2. Subtypes: prenatal, neonatal and later presentations treated as a spectrum; sources do not establish independently classified molecular subtypes.
    3. Mechanisms: replaced normal splicing as an initiating lesion with variant-specific roots; separated RNA, protein abundance, phosphate import, ATP synthesis, glycolysis/lactate, copper/COX, fusion, cristae and calcium findings. Preserved bulk ATP compensation in the mouse model and distinguished engineered copper-selective rescue from patient-tissue evidence.
    4. Treatment: added documented infant supportive regimens, transplantation with limited follow-up, and explicitly preclinical meclizine. Retained empirical adult supplements/diet without efficacy attribution; specified TAT HeLa rescue and engineered hiPSC mitochondrial transplantation. No human trial efficacy is established by these sources.
    5. Genetics: qualified transcript-dependent G72E nomenclature, intronic splice effects versus predicted truncation, and discordance between original in silico L200W prediction and subsequent yeast assays. Removed unsupported blanket likely-pathogenic classification of the compound genotype and a claimed mild splice-allele prognosis.
    6. Biomarkers/diagnosis: corrected blanket normal fibroblasts and respiratory-chain claims; added intact-mitochondrial testing, muscle ultrastructure and biochemical assay context.
    7. References: incorporated disease-specific full-text findings rather than treating abstract availability as a scope ceiling. Used generated URL caches for the 2015 and 2016 full texts when PMID routes returned abstracts. PMID:40505409 remained unquotable after retry; the broader ataxia-cohort abstract did not support SLC25A3-specific ataxia. PMID:39671292 and its DOI did not yield full text, so the cardiomyocyte-transplantation claim remains limited to the retrieved abstract.
    8. Overall consumption: clinical, allele, mechanistic and translational omissions addressed; preprints distinguished from peer-reviewed work. Experimental and animal models linked to mechanism nodes with explicit context. Copper-related patient/model differences reframed by allele, tissue and assay rather than blanket refutation.

    GeneReviews check: NO_CHAPTER in the 2026-09-10 snapshot. Ontology candidates queried through live OLS; canonical terms validated. All evidence titles copied or checked against generated caches. REVIEW is for this inherited disorder and respects the campaign exclusion of infectious/environmental diseases and poisonings.

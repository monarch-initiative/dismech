  summary: 'Create: SLC25A12-Related Developmental and Epileptic Encephalopathy DEE39'
  details: |
    New entry for DEE39 MONDO:0013056, AGC1/aralar deficiency. Deep research via "just research-disorder claude_code"; NEC preflight PASS with SLC25A12 mentioned 36 times and report OMIM 612949 matching the MONDO xref. Note the report carried two malformed DOI strings flagged as unresolved in its own reference_validation block and one off-topic reference; none was cited. No GeneReviews chapter exists for SLC25A12, confirmed by PubMed search. Pathophysiology de-bundled into 13 atomic nodes running two independent routes from one transport defect: a bioenergetic route through malate-aspartate shuttle failure to impaired activity-dependent respiration, and a biosynthetic route through aspartate depletion to reduced N-acetylaspartate and the acetyl-group supply to oligodendrocytes. The astroglial glutamine failure and the nigrostriatal dopaminergic arm are modeled as separate branches. Four discussions, the central one a CONTROVERSY on whether the hypomyelination is primary oligodendrocyte disease or a leuko-axonopathy secondary to neuronal dysfunction, which the longitudinal MRI evidence bears directly on. Two snippets were dropped or requoted during validation: a title quote on PMID:23216354 and a sentence interrupted by a stripped citation marker. Validated with just validate 62/62 snippets verified, just validate-terms passed, check_snippet_length, just check-duplicate-keys, and just check-title-snippets.

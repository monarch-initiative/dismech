  summary: Re-review autoimmune polyendocrinopathy
  details: |
    Re-reviewed the umbrella autoimmune polyendocrinopathy record against primary
    literature, current ClinicalTrials.gov records, and public GEO metadata.
    Clarified the scope boundary with the dedicated APS-1 record and retained the
    traditional APS-1 through APS-4 taxonomy while documenting its instability.
    Corrected the mechanism model to distinguish organ-specific autoantibodies as
    biomarkers from T-cell-mediated endocrine injury, while preserving functional
    anti-Th17 cytokine autoantibodies as an APS-1 antifungal-defense mechanism.
    Added evidence-backed mechanisms, phenotypes, genetics, biomarkers, diagnostic
    guidance, differentials, treatments, four audited trials, three GEO datasets,
    an Aire-deficient mouse model, limitations, and proposed experiments. Retained
    the pre-existing deprecated updated_date unchanged.

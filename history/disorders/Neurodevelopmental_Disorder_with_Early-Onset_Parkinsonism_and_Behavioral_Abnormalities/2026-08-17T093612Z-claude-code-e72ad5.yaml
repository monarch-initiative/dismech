  summary: 'Review round 1: address six PR review findings on PR #8686'
  details: |
    Round-two curation in response to the automated review on PR #8686 (six findings) and an independent red-team pass over the same file. All six findings addressed, plus both optional suggestions.

    1. Pathograph wiring. The three terminal pathophysiology nodes had no `downstream:` edges, so no phenotype was reachable from the mechanism graph. All seven nodes are now wired through to the phenotype layer per the PCDH19_Clustering_Epilepsy convention: 27/27 phenotypes reachable, previously 0. Dementia is attached to the degeneration node as INDIRECT_UNKNOWN_INTERMEDIATES because the arm is assigned on temporal coupling alone; the six phenotypes belonging to no curated arm (gait ataxia, sensorimotor neuropathy, hypersomnia, generalized seizure, exotropia, pectus excavatum) hang off the root lesion, each with the reason it is unassigned. Gait ataxia is explicitly recorded as neither parkinsonian nor spastic and is deliberately not placed on either motor arm.

    2. Missing phenotypes. Added Sensorimotor neuropathy (HP:0007141), Hypersomnia (HP:0001262 Excessive daytime somnolence), Postural tremor (HP:0002174), Depression (HP:0000716), Speech apraxia (HP:0011098) and Stuttering (HP:0025268), all from sentences already cited in the entry. Renamed Tremor to Resting tremor now that postural tremor is curated separately.

    3. Diagnosis. Added a `diagnosis:` section (genomic confirmation; exclusion of metabolic, structural and cytogenetic mimics) with NCIT:C101295 and NCIT:C25294 bindings, so the panel-inclusion claim no longer props up a counseling treatment.

    4. Snippet integrity (the most serious finding). One truncated snippet had inverted its own meaning: the source reads "...functional studies of the reported variants and studies of patients' derived cells were not performed", and the clip ended before the verb, deleting the negation. Restored in full and retagged evidence_source: OTHER, since it is a bibliographic-absence claim rather than an experimental result. Two further snippets had been clipped before the word "levodopa" itself, which is the sole basis for the presynaptic dopaminergic inference; both restored to the full sentence.

    5. Evidence precision. Replaced the boilerplate supportive-care citation with two on-point sentences; restored the authors' hippocampal-coverage caveat to the MRI snippet and softened the corresponding claim; fixed four evidence_source misclassifications; removed a REFUTE item from the causative-gene block where it read as refuting PTRHD1 causation (the negative Parkinson-disease cohorts remain under the Parkinson's Disease differential, whose name now resolves to the real KB entry).

    6. Overstatement and frequency discipline. Softened the consanguinity claim (characteristic, not universal), "formally excluded", the UBL-domain-binding-site clustering claim (PTH2 spans 115 of 140 residues, so that localization is a weak constraint, and the review predates three of the six alleles), and the description's neurodevelopment/neurodegeneration bridge assertion. Corrected the prevalence tally note. Dropped unsupported GO annotations. Dropped or rebased frequency bands that the cited evidence did not independently justify, per docs/frequency-evidence-guidelines.md.

    7. Recorded the deep-brain-stimulation non-recommendation as a note rather than a treatment entry, there being no citable PTRHD1-specific source.

    Full-text sourcing, checked explicitly because the reviewer raised it: 13 of 99 snippets resolve only against the PMC full text rather than the abstract, 11 of them from the original gene-discovery paper (PMID:27753167), whose abstract is too short to carry its mechanistic discussion. Those 11 were already green in CI. The repo validates with full text enabled and the cache is committed, so the two new PMID:36699000 full-text sentences were kept rather than dropped.

    Validation after the round: `just validate` passed (schema + terms + references), `just validate-references` 99/99 snippets verified (up from 87/87), `just validate-terms` passed.

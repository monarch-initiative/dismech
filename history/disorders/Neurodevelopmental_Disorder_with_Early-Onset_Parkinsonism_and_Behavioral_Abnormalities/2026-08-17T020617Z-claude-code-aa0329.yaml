  summary: 'Create: Neurodevelopmental Disorder with Early-Onset Parkinsonism and
    Behavioral Abnormalities (PTRHD1)'
  details: |
    De-novo curation of NEDPBA (MONDO:0958323 / OMIM:620747), an ultra-rare autosomal recessive PTRHD1 disorder, resolving issue #8536.

    NEC preflight (this entity sits in the high-risk "neurodevelopmental disorder with ..." OMIM series): `runoak -i sqlite:obo:mondo info MONDO:0958323 -O obo` confirmed three agreeing identity anchors - `RO:0004003 HGNC:33782 ! PTRHD1`, `xref: OMIM:620747`, `xref: MEDGEN:1857802` - before any deep-research content was used. Every cited paper was screened to be about PTRHD1 and not one of the locus- or phenotype-adjacent early-onset parkinsonism genes (PRKN, PINK1, PARK7, ATP13A2, SYNJ1, DNAJC6, FBXO7, PLA2G6, VPS13C, RAB39B); those are curated as differential_diagnoses instead.

    Sourcing: one deep-research run (falcon, 2026-08-15, 516 s) was used only as a lead generator and was NEC-screened by gene-mention frequency (PTRHD1 42 mentions vs 1 each for the adjacent genes, 0 for ADORA1). It surfaced two systematic reviews (PMID:34630269, PMID:36699000) and the Open Targets CENPO caveat but supplied no verbatim patient-level quotations. All cited PMIDs were located by direct PubMed E-utilities search on PTRHD1 (18 hits, all triaged), fetched with `just fetch-reference`, and quoted from the cached text. No GeneReviews chapter exists for PTRHD1 (PubMed search `PTRHD1 GeneReviews[All Fields]` returned no results) - documented in the entry `notes`. The historical ADORA1 misattribution (PMID:27134041 / PMID:29143421) is documented in `notes` and ADORA1 is deliberately not curated as a causal or modifier gene.

    Content: modeled the biphasic neurodevelopment-to-neurodegeneration course explicitly - two `progression` phases (a static neurodevelopmental phase from late infancy, then a progressive motor-neurodegenerative phase in the third/fourth decade), a seven-node pathograph with `biological_scale` on every node, and phenotype `onset` / `clinical_course: PROGRESSIVE` qualifiers. Dopaminergic-neuron vulnerability is its own node conforming to `parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration`, but marked `mechanism_confidence: HYPOTHETICAL` because no neuropathology and no DaT-SPECT has ever been published for a PTRHD1 patient. The ubiquitin-proteasome model is curated as an EMERGING `mechanistic_hypotheses` entry rather than as fact, with four `discussions` (three KNOWLEDGE_GAP, one OPEN_QUESTION) covering the unknown molecular function (recombinant human PTRHD1 has no peptidyl-tRNA hydrolase activity, PMID:27235175), the missing neuropathology/imaging, the absence of any animal or cellular model, and parkinsonism penetrance. Levodopa is curated with `target_mechanisms` onto the striatal dopamine node. Deliberate counter-evidence is retained: REFUTE items for rigidity and postural instability (explicitly absent in the Pakistani family, PMID:41918506) and for PTRHD1 as a typical-Parkinson-disease risk gene (negative European, Taiwanese and Chinese cohorts).

    Validation (all run from the worktree, not the parent checkout): `just validate` passed (schema + terms + references); `just validate-references` verified 87/87 snippets against cached references; `just validate-terms` passed; `just compliance` reported 86.7% global / 87.0% weighted; the full `tests/test_data.py` suite passed (8165 passed).

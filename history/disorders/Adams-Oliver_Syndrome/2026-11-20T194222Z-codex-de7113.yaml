  summary: Map Adams-Oliver syndrome to OMIMPS:100300
  details: |
    Checked actual series membership in January 2026 OMIM and class scope in September 2026 MONDO against the current Disease and its subtypes. PS100300 represents the Adams-Oliver clinical syndrome centered on scalp aplasia cutis congenita and terminal transverse limb defects. The January 2026 OMIM snapshot lists six numbered forms involving ARHGAP31, DOCK6, RBPJ, EOGT, NOTCH1, and DLL4; MONDO:0007034 has their corresponding children and maps exactly to the series in September 2026. This entry retains one clinically defined syndrome across dominant and recessive causes and distinct Notch, cytoskeletal, and VCP mechanisms. The VCP-associated form already curated here was reported in April 2026 (PMID:41979051), after the inspected OMIM snapshot. ExactMatch aligns the syndrome concept, not an exhaustive frozen list of causal genes. It neither makes one inheritance pattern or pathway universal nor includes unrelated causes of isolated aplasia cutis or limb reduction.

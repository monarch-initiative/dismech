  summary: 'Review round: drop unsupported VSD, reframe truncus, add supported phenotypes,
    add diagnosis/treatments, add openscientist deep-research report'
  details: |
    Second session on PR #15492, responding to the ai4c-reviewer
    CHANGES_REQUESTED review (review 5638861036). Every change was verified
    against the cached full text before acting.

    Blocking items addressed:
    - Dropped the Ventricular septal defect phenotype. Confirmed in the full
      text of both PMID:38419169 and PMID:42792942 that the only PRKD1 VSD is in
      homozygous (recessive) MICE; the human heterozygous clinical summary lists
      pulmonary stenosis, AVSD, coarctation and bicuspid aortic valve but never
      VSD, and no human CHDED patient in the PMID:42792942 Table 1 has a VSD.
    - Reframed Truncus arteriosus: its only evidence (PMID:25713110) is biallelic
      homozygous-truncating (recessive) variants, so its description now states
      plainly it belongs to the related recessive phenotype, not the dominant
      CHDED syndrome, and that truncus has not been reported in the dominant
      syndrome. Removed truncus and VSD from the entry description's core-defect
      list; fixed the "this families'" typo.
    - Added phenotypes verified by exact quotes in already-cited papers: Atrial
      septal defect, Bicuspid aortic valve, Coarctation of aorta, Multicystic
      kidney dysplasia, Nephrocalcinosis, Bifid uvula, Increased intracranial
      pressure, Dry skin, and single-case adult extensions (Carotid artery
      dissection with aortic dilatation, Male infertility, Hypospadias). New
      cardiac lesions wired to the outflow-tract/septal node; bifid uvula wired
      to the craniofacial node; renal/vascular/single-case extensions left
      disconnected and documented in review_notes.

    Suggestions taken: dentition coarse_binding_basis VARIABLE_SPECTRUM ->
    SOURCE_UNSPECIFIED (source says only "teeth...defects"); HDAC-MEF2 node
    PMID:38419169 quote_role REVIEW_SYNTHESIS -> BACKGROUND (an intro restating
    known model-system biology; evidence_source kept MODEL_ORGANISM as the
    hypertrophy/HDAC/MEF2 work is predominantly murine); dropped the weak
    GO:0042826 histone deacetylase binding molecular function from that node;
    added a review_notes sentence on the deliberately disconnected features; added
    diagnosis (trio whole-exome sequencing, PMID:38677542) and treatments
    (surgical repair of CHD and emollient/keratolytic skin therapy, PMID:42792942).

    Deep research: the previously missing report was produced this session.
    openscientist succeeded (DISABLE_CLAUDE_CODE_PROVIDER=true set so the
    disk-filling claude_code fallback could not run), writing
    research/Congenital_Heart_Defects_And_Ectodermal_Dysplasia-deep-research-openscientist.md
    with its citations sidecar and artifacts. The report's own validation records
    confabulation_rate 0.0 over 14 references and 44 terms (one mislabelled term,
    HP:0007394 for telangiectasia, which the KB entry correctly binds as
    HP:0001009 instead). This supersedes the DR-gap note in the CREATE record.

    Validation (all pass): just validate, just validate-terms,
    count-verified-snippets (45/45), validate-disorders (authoritative),
    check-entity-refs, check-causal-targets, check-enum-values,
    check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms,
    check-gene-activity-grounding (--against-ref origin/main: 0 new; PRKD1 is
    grounded by GO:0004674 on its node), check-snippet-length (hypospadias snippet
    lengthened past the 5-word floor), check-snippet-grading (incl. cross-file),
    validate-history. Entry now has 29 phenotypes, 16 (55%) causally connected.

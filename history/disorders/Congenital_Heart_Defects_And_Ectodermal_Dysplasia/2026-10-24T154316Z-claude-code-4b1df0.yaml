  summary: 'Create: congenital heart defects and ectodermal dysplasia'
  details: |
    De-novo curation of congenital heart defects and ectodermal dysplasia
    (CHDED/CHDFIDD; MONDO:0044303, OMIM 617364), an autosomal dominant PRKD1
    developmental syndrome, closing claim issue #15485 and deleting the stub.

    Deep research: the requested provider (falcon/Edison) failed authentication
    (403, invalid API key), and the --fallback run (claude_code) was aborted
    after it exhausted the container disk. No deep-research report was produced.
    Curation therefore proceeded from direct primary-literature retrieval via
    the NCBI E-utilities API, fetching and quoting the foundational cohort and
    case series. This is an acknowledged gap, not a silent substitution.

    Sources used (all cached, exact-quote snippets): PMID:27479907 (Sifrim 2016,
    Nat Genet - the genome-wide-significant discovery of PRKD1 as a syndromic-CHD
    gene; de novo missense, gain-of-function pattern); PMID:25713110 (Shaheen
    2015 - PRKD1 mapped in truncus arteriosus, biallelic/recessive extreme;
    Prkd1-/- mouse background); PMID:38419169 (2024 J Anat - Prkd1 loss-of-function
    mouse heart model and the HDAC/MEF2/TBX5 transcriptional axis); PMID:38677542
    (Leduc 2024 - TEBC review, ectodermal/brachydactyly/telangiectasia/microcephaly
    spectrum); PMID:36308391 (Alghaith 2023 - CHDED, de novo); PMID:39740729 (2025
    - brain calcification and seizures); PMID:41136760 (2026 - familial inherited
    variant, TOF and craniosynostosis); PMID:42792942 (2026 - explicit GOF framing,
    adult, hearing impairment).

    Content: 5 pathophysiology nodes forming a causal chain (PRKD1 kinase
    dysfunction -> dysregulated HDAC-MEF2 transcriptional control -> impaired
    cardiac outflow-tract/septal morphogenesis, impaired ectodermal appendage
    development, impaired craniofacial/neural development), wired to 18 phenotypes
    (12/18, 67%, causally connected). Genetic section: PRKD1 (hgnc:9407), CAUSATIVE,
    autosomal dominant; origin node carries variant_origin GERMLINE and
    functional_impact_category GAIN_OF_FUNCTION. A KNOWLEDGE_GAP discussion records
    the unresolved GOF-missense-vs-LOF mechanism question and the related recessive
    truncus arteriosus phenotype.

    Mechanism/lump-split caveats surfaced: (1) the dominant syndrome is driven
    predominantly by de novo missense GOF variants, but inherited and LOF alleles
    are reported and the mouse model is LOF, so the genotype-mechanism map is
    heterogeneous (recorded in genetic notes and a discussion); (2) the HDAC-MEF2
    developmental link is an inference extrapolated from cardiac-hypertrophy
    biology (edges marked INDIRECT); (3) this germline developmental syndrome is
    kept entirely separate from the somatic PRKD1-driver neoplasm entries (design
    decisions 3a) - no somatic entry was touched.

    GeneReviews: no chapter exists for CHDED/PRKD1 (verified offline against the
    committed Bookshelf index and via a live PubMed genereviews[book] title search;
    the only loose [book] match, PMID:32027476, is the unrelated Ayme-Gripp syndrome
    chapter). Recorded in review_notes.

    Validation (all pass): just validate, just validate-terms, just
    count-verified-snippets (30/30), and the authoritative gate just
    validate-disorders. Also green: check-entity-refs, check-causal-targets,
    check-enum-values, check-duplicate-keys, check-coarse-phenotypes,
    check-qualifier-terms, check-shared-disease-terms, check-snippet-grading
    (including cross-file).

  details: |
    Backfill for issue #8085, tranche 43. One influences_mechanisms link: High-Risk Drug Exposure TRIGGERS 'Drug-HLA Direct Interaction', causal_link_type DIRECT. The node is the culprit drug binding the risk HLA molecule without processing, so the drug is a constituent of that step rather than something upstream of it.

    Evidence copied verbatim from items already in this file: PMID:22322005 from the target node (carbamazepine presented by HLA-B*1502 without intracellular metabolism or antigen processing) graded directness DIRECT, since it states the interaction and names a drug from the exposure entry's high-risk list; and PMID:7477195 from the exposure entry (crude relative risk 172 for trimethoprim-sulfamethoxazole and other sulfonamides) graded INDIRECT, since it sizes the exposure and reaches the p-i step only through the disease. The first is IN_VITRO and its evidence_source was carried across unchanged, so the cell-based origin of the mechanistic claim stays visible.

    The link points at the drug-HLA step rather than at 'HLA-Mediated Genetic Susceptibility', which is a host genotype and not something a drug exposure acts on.


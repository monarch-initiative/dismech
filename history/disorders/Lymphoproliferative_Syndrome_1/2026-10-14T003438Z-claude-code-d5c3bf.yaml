  summary: 'Create: Lymphoproliferative Syndrome 1 (ITK deficiency)'
  details: |
    De novo curation of lymphoproliferative syndrome 1 / ITK deficiency (MONDO:0013081), autosomal recessive combined immunodeficiency from biallelic ITK loss of function. Pathograph: ITK LOF -> defective TCR calcium/PLCg1 signalling -> iNKT deficiency, CD4 lymphopenia, impaired EBV control, reduced IFN-gamma, defective FasL upregulation -> EBV-driven B-cell lymphoproliferation, Hodgkin lymphoma, B-cell lymphoma, HLH, EBV smooth muscle tumor, autoimmunity, and (EBV-naive) tuberculosis. Evidence from primary case reports/series (Huck 2009 PMID:19425169, Linka 2012, Serwas 2014, Bienemann 2015, Ghosh 2014 and Ghosh 2018 reviews), IUIS 2024 classification (Table 1 combined immunodeficiency), Orphanet ORPHA:538963 prevalence <1/1,000,000, and ClinGen CGGV Definitive AR assertion for this MONDO term. Itk-/- mouse model linked with modeled_mechanisms. Falcon deep research was unavailable (503), so one claude_code report was generated and used ONLY as a lead; every claim verified against cached primary sources. Gaps recorded as discussions: whether lymphoma/hypogammaglobulinemia are EBV-independent (OPEN_QUESTION); murine MHV-68 model does not reproduce EBV susceptibility (HUMAN_MODEL_MISMATCH). EBV not yet added as an environmental node; ECTO:3000273 (exposure to human gammaherpesvirus 4) noted for a follow-up. Deleted stub. All offline gates pass.

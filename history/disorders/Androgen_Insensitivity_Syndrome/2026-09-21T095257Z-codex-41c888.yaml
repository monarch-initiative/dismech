  summary: Review AIS mechanisms, variant interpretation, clinical spectrum and care
  details: |
    Read the full baseline and matching CAIS/PAIS research, all original cached sources, complete GeneReviews chapter and AIS guideline sections. Consumed generated primary full texts and the full conditional/global AR-knockout manuscript, with independent MAP3K1 and care integration checks. Added MAIS and an 18-node causal graph separating ligand binding, DNA binding, transcription, fetal AMH and pubertal endocrine regulation. Removed established MAP3K1 modifier attribution and treatment efficacy based on the now benign/likely-benign Ser176Arg allele. Preserved subtype-specific Orphanet bands with age and comparator qualifications; expanded diagnosis, differential diagnosis, bone and gonadal care, two mouse and two exploratory human-cell models, and the completed hormone crossover trial. Distinguished benign stromal tumors from germ-cell neoplasia and primary trial results from secondary metabolic analysis. Documented source-internal genotype, cohort percentage and annotation inconsistencies. Updated renamed node-class examples. All reference-cache changes were generator-produced; the frozen dataset-accession cache was not accessed.

  details: |
    Follow-up EDIT to the merge recorded in 2026-08-20T042247Z-claude-code-4132f4.yaml, covering the review-response changes made after that record was written. Appended rather than amending it, since history records are append-only.

    Changes in commit 4f64ae5ac:

    1. inheritance[0].description was CAIS-specific text carried verbatim onto a slot that, after the merge, describes the whole spectrum. It opened "Complete androgen insensitivity syndrome is inherited...". Reworded to the spectrum, and scoped the X-linked claim explicitly to the AR arm: the MAP3K1 modifier curated on the partial subtype is at 5q11.2 and is autosomal, so a contributing MAP3K1 variant does not follow the X-linked pattern. Both supporting snippets state X-linked recessive AR inheritance for androgen insensitivity as a whole, so the reworded subject is what the cited evidence supports.

    2. Restored a provenance note dropped in the merge: ORPHA:754, the Orphanet record for the androgen insensitivity syndrome parent concept, is absent from the local Orphadata index, so the Orphanet rows cited in this entry come from the subtype records ORPHA:99429 and ORPHA:90797. Confirmed still true. This matters more after the merge than before, because the entry is now keyed at exactly that parent level.

    3. Dropped the deprecated percentage field from all three prevalence records, which were carried over verbatim from the merged entries. CLAUDE.md directs that it not be populated on new records.

    Change in the follow-up commit:

    4. Added measure_type POINT_PREVALENCE to the PAIS prevalence record. This corrects a regression introduced by change 3: while percentage held the verbatim Orphanet phrasing "Unknown | Worldwide | Point prevalence", the measure dimension was still asserted in the record; removing it left prevalence_class UNKNOWN with no structured measure, reading as an unspecified kind of unknown. The cited ORPHA:90797 row states Point prevalence explicitly, and both CAIS sibling records already carry a measure_type, so this completes the structured-prevalence migration rather than adding new content.

    Deliberately not changed, with reasons:

    - The stub's notes still name the two deleted files. Editing stubs/ would put the pull request outside the curation-scope CI guard's allowlist; that conflict between CLAUDE.md's prescribed curation-PR shape and the guard is filed separately as issue #9070. The reference is prose, not a foreign key.
    - Aplasia of the ovary on the partial subtype reads oddly for a 46,XY individual, but it is an Orphanet-sourced frequency annotation carried over verbatim from the deleted entry. Rewriting a sourced annotation because it reads oddly would be editorialising over the source; resolving it requires examining the ORPHA:90797 annotation itself.
    - Mild androgen insensitivity remains unrepresented in has_subtypes, recorded as a known gap in the merge record.

    Validation: schema validation with 127 of 127 snippets verified against the cached references, term validation, check_snippet_length against origin/main reproducing the CI invocation, check_folded_hyphens, check_title_snippets, and check-duplicate-keys all clean. No snippet text was changed by these commits.

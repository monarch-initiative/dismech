  summary: Evidence-claim mismatch review (#12827)
  details: |
    Reviewed the 13 root-level MISMATCH findings from the Jev evidence_claim_match assessment against the cached sources. Changed: (1) SRD5A2 differential snippet extended to name 5-alpha-reductase deficiency and biallelic SRD5A2 variants (GeneReviews NBK1429). (2) Pelvic imaging diagnosis: the PMID:36851849 item now quotes the MRI findings together with the benign Leydig cell tumour pathology, so it supports both localization by imaging and the benign-stromal caveat. (3) CAIS increased-AMH phenotype: removed a PMID:30251955 item that measured only two PAIS neonates; description now says elevation is age-dependent. (4) PAIS increased-AMH phenotype: the same item is now supports REFUTE (normal male-range neonatal AMH in two cases, which the source states is in contrast to previous reports). (5) ClinVar VCV000804018 snippets on genetic AR and the Ser176Arg discussion now name the variant. (6) Sertoli AR to Impaired Spermatogenesis edge gained a PMID:14745012 snippet with the germ-cell reductions and apoptosis. Retained as-is: MAP3K1 and gonadal-risk discussion evidence, HEK293T/17 method snippets, the GRCm38 annotation snippet, Orphanet ovarian-aplasia row and Sertoli-node conclusion; these snippets support the specific fact each item is cited for, and the flags fall on curator-assigned structural fields.

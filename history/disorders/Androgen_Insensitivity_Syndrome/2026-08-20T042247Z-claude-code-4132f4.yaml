  summary: Merge Complete and Partial AIS entries into one AR allelic-series entry
    with has_subtypes
  details: |
    Merged kb/disorders/Complete_Androgen_Insensitivity_Syndrome.yaml (MONDO:0021023) and kb/disorders/Partial_Androgen_Insensitivity_Syndrome.yaml (MONDO:0010720) into a single entry keyed on MONDO:0019154, retaining both named clinical entities as grounded has_subtypes carrying their original MONDO terms as subtype_term.

    Rationale. The split was not carrying a mechanistic distinction. All 8 nodes of the complete-form pathograph had a counterpart in the partial-form pathograph, and three pairs differed only by a 'Partial' prefix on an otherwise identical node. Severity in AIS is set by the residual transcriptional activity of the variant androgen receptor - one allelic series, one chain - not by a different pathway. Several node evidence snippets were already shared verbatim between the two entries.

    Divergences were curation drift rather than biology. The complete-form entry recorded raised luteinizing hormone and testosterone as phenotypes but never built the endocrine-feedback node the partial-form entry carried, hanging those phenotypes off target-tissue resistance as INDIRECT edges instead. The merged entry carries the explicit Androgen-Resistance Endocrine Feedback node and routes both forms through it.

    Information preserved, not averaged. Of the ten phenotypes shared between the two entries, six had different curated frequencies: bilateral cryptorchidism, blind vagina, germ cell neoplasia, increased antimullerian hormone, increased estradiol, primary amenorrhoea. Those are curated as separate subtype-keyed phenotype records so the per-form frequency survives; only the four with identical frequency across the spectrum are unkeyed. 47 phenotype records in total. Prevalence records are subtype-keyed and the MAP3K1 modifier is keyed to PAIS. Evidence blocks were copied verbatim from the source entries, so all snippets remain exact quotes of their cached references.

    Precedent. Follows ZRS-Related_Limb_Malformation, where an entry curated as a named syndrome was retargeted to its locus-level allelic series with the named entities kept as subtypes, and Arthrogryposis-Renal_Dysfunction-Cholestasis_Syndrome.

    Also deletes kb/groupings/Androgen_Insensitivity_Syndrome.yaml, created earlier in this same pull request. That grouping was the wrong structure for this concept: a grouping is a union of entries with genuinely distinct pathographs, and it cannot express per-subtype phenotype frequency at all. It was also unable to represent mild androgen insensitivity, which has no MONDO descendant term and so could never resolve to a member entry.

    Known gaps. Mild androgen insensitivity is not curated as a subtype because it has no distinct MONDO term; the milder-AR-variant contribution to isolated male infertility is captured on the Impaired Spermatogenesis and Sexual Function node. biological_scale is not populated on the merged nodes - deliberately out of scope, left as a follow-up.

    Validation: schema validation with 127 of 127 snippets verified, term validation passed, and an offline snippet audit against the abstract-only reference cache.

  details: |
    New entry for MONDO:0020628 (OMIM:618097), the biallelic TOP3A Bloom syndrome-like disorder, curated from the Perplexity deep-research report (the only DR source; 20/20 references resolved, no unresolved terms) and primary papers. just preflight-dr returned PASS (TOP3A mentioned 44 times; OMIM 618097 matched). just check-genereviews --online returned NO_CHAPTER for GeneReviews and StatPearls. The full text of the index paper (PMID:30057030) and of PMID:37013609 was retrieved from PMC by a forced refetch; phenotype frequencies and several snippets are taken from the index paper's Table 3 rows and body text. Pathophysiology is a chain from hypomorphic TOP3A loss through impaired BTRR double Holliday junction dissolution to crossover hyper-recombination (read out as SCE) and persistent mitotic entanglement, chromosome segregation errors and genome instability, with edges to growth restriction, microcephaly, short stature and low weight marked INDIRECT_UNKNOWN_INTERMEDIATES because the source proposes rather than demonstrates that step. Scope decision: adult-onset TOP3A mitochondrial disease has its own MONDO concept (MONDO:0020845, PEOB5, OMIM:618098) and is not folded in; the childhood mitochondrial-only TOP3A presentations are also excluded. Cardiomyopathy, muscle mtDNA depletion and hepatomegaly are kept as phenotypes but are not wired to a mitochondrial mechanism node, because mtDNA maintenance failure is not shown for every case; a KNOWLEDGE_GAP discussion records the hypothesis and evidence. MONDO:0034991 (Orphanet 508512) is mapped as closeMatch. Not cited: the 2024 report of two Egyptian children (no PubMed record found; the DR-cached DOI abstract does not mention TOP3A) and PMID:38701747 (author correction, no quotable text retrieved; mentioned in genetic notes). PMID:40556620 was fetched by a search mistake, is unrelated, and was deleted. Validation: just validate passed with 47/47 snippets; validate-terms passed; count-verified-snippets 47/47; check-entity-refs, check-causal-targets, check-duplicate-keys and check-block-scalar-comments clean; 4/14 phenotypes causally connected (SCE is connected as a readout, which the metric does not count).

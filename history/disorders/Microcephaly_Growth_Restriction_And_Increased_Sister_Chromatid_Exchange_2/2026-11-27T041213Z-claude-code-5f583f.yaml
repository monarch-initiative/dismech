  details: |
    Removed the synonym 'TOP3A-related microcephalic primordial dwarfism', which is not a MONDO synonym and is not used for this disorder in either cited paper (PMID:30057030 uses microcephalic primordial dwarfism only as a collective term). Removed GO:0000070 mitotic sister chromatid segregation from the 'Persistent DNA Entanglements in Mitosis' node, because the downstream 'Chromosome Segregation Errors and Genome Instability' node already carries the segregation process (GO:0007059); the entanglement node keeps its fibroblast cell type and ultrafine-bridge evidence. Reworded the ClinGen sentence in genetic notes to state that the ClinGen gene-disease validity export dated 2026-01-24 has no TOP3A record. Cached PMID:38701747 (author correction); it has no abstract, and the notes say the c.2271dup correction is therefore not quote-validated. The CARDIOVASCULAR Harrison's classification was kept: cardiomyopathy is reported in several patients and is a cause of death.

  summary: 'Create: CDC20-related Oocyte Maturation Defect (MONDO:0859521)'
  details: |
    New standalone entry for oocyte maturation defect 14, autosomal-recessive female infertility from biallelic CDC20 variants. Lump/split: curated as its own DISEASE entry (one MONDO term, one gene), parallel to TUBB8-related_Oocyte_Maturation_Defect; no grouping of oocyte maturation defects exists. Sources: the two Zhao et al. cohort papers (PMID:32666501, PMID:33898437), two independent case reports (PMID:34218387, PMID:39862142), a Sanger-screening cohort (PMID:33683667) and the Cdc20 hypomorphic mouse (PMID:20941357). Pathograph: biallelic CDC20 variants (partial loss of function, GO:0097027 ubiquitin-protein transferase activator activity decreased) -> impaired APC/C-dependent cyclin B1 degradation -> failed meiosis I metaphase/anaphase transition -> metaphase I and mixed maturation arrest; a model-only meiosis I missegregation node links to fertilization failure and embryo arrest. CDC20 cRNA injection recorded as experimental. Deep research: claude_code provider report committed under research/. Validated with just validate, validate-terms, count-verified-snippets (33/33), causal-target, entity-ref, duplicate-key and coarse-phenotype checks, and the gene-activity grounding ratchet.

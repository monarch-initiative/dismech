  summary: 'Review round 1: regrade, synonyms, variants, mouse gene binding'
  details: |
    Addresses the first review of PR 14378. Removed the PMID:32666501 dosage-threshold evidence item from the Failed Metaphase I to Anaphase I Transition node: it was the authors' Discussion synthesis graded HUMAN_CLINICAL, and the PMID:20941357 mouse item on the same node already carries the threshold claim as primary evidence. Added synonyms OOMD14 (MedGen C5830326) and OZEMA14 / oocyte/zygote/embryo maturation arrest 14 (OMIM #620276 title, read via NCBI E-utilities); check-genereviews still reports NO_CHAPTER for GeneReviews and StatPearls. Rewrote the explanation of the PMID:33898437 cRNA safety caveat to say it is a limitation supporting only the experimental framing, and removed its quote_role (the sentence is the authors' own judgement, neither background nor a synthesis of others' work). Rebound the Cdc20 hypomorphic mouse gene to MGI:1859866 (Cdc20, confirmed via mygene.info MGI field). Added a genetic[].variants list of the published CDC20 alleles, each with exact-quote evidence; no clinical_significance was assigned because no ClinVar record was consulted. Flagged that PMID:39862142's abstract pairs its cDNA and protein changes inconsistently (c.533 lies in codon 178, c.1373 in codon 458).

  summary: 'Create: Developmental And Epileptic Encephalopathy 38'
  details: |
    Curated ARV1-related autosomal recessive DEE38 (MONDO:0014868, OMIM 617020) de novo. Deep research via claude_code provider (needs_review flag was for one unsupported full-text-only quote, PMID:34017911 'Purkinje cell loss', which was not used). preflight-dr returned WARN because the GPI abbreviation is frequent; resolved by inspection (canonical gene ARV1, OMIM 617020 match). NOTE: the claim-issue/stub clinical description was for ALG13 X-linked DEE, a different disorder; the actual MONDO:0014868 entity is ARV1, confirmed by MONDO record, OMIM 617020, and all primary literature. Curated 4-node GPI-anchor pathophysiology chain (ARV1 LoF -> impaired GPI-GnT/GPI biosynthesis -> reduced surface GPI-anchored proteins -> neuronal dysfunction/DEE), 15 phenotypes, genetic, inheritance, prevalence, progression, diagnosis, 4 treatments, neuronal Arv1-KO mouse and yeast complementation models, and two knowledge-gap discussions (GPI-vs-lipid driver; E-I route). Did not declare conformance to epilepsy_excitation_inhibition_imbalance or congenital_disorder_of_glycosylation modules (GPI-anchor lesion, not N-glycosylation; no E-I measurement). Validation: just validate PASS (48/48 snippets verified), validate-terms PASS, check-entity-refs/check-duplicate-keys PASS, validate-disorders PASS.

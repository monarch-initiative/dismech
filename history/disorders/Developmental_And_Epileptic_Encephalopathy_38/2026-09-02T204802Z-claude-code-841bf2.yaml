  summary: 'Address PR #10552 review: phenotypes, drugs, environmental, grouping'
  details: |
    Round-two edits responding to the automated PR #10552 review. (1) Ketogenic-diet treatment removed: its supporting detail is full-text-only in PMID:34017911 (abstract-only cache), so it could not carry a validatable snippet; moved to notes with that rationale, consistent with declining the Purkinje-cell full-text quote. (2) Consumed the PMID:32165008 full text further, adding five phenotypes with exact quotes: Feeding difficulties (HP:0011968; closes the aspiration-pneumonia pathograph gap), Spasticity/peripheral spasticity (HP:0001257), Nystagmus (HP:0000639), Retinal dystrophy (HP:0000556), and Abnormal skeletal muscle morphology (HP:0011805, from PMID:35227294). (3) Pharmacotherapy now carries therapeutic_agent bindings for the drugs the caches actually name (levetiracetam CHEBI:6437, clobazam CHEBI:31413, topiramate CHEBI:63631, pyridoxine CHEBI:16709) with two supporting evidence snippets; removed the uncited valproate/phenobarbital/vigabatrin/benzodiazepine list. (4) Added a Febrile illness environmental entry with influences_mechanisms EXACERBATES targeting the encephalopathy node, entry-level evidence, and a notes line recording that ECTO/XCO carry no suitable fever/infection exposure term. (5) Attached the PMID:35227294 genotype-phenotype sentence (LoF/N-terminal splice vs hypomorphic missense) plus the early-lethality quote to genetic evidence. (6) Added DEE38 as a member of the Disorders_of_GPI_Anchor_Biosynthesis grouping (satisfies the NECESSARY GO:0006506 criterion; membership evaluated SATISFIED) and corrected that grouping's now-stale MONDO consistency note. ER-stress/UPR step left as a knowledge gap (only full-text-only support). Validation: just validate PASS (60/60 snippets), validate-terms PASS, check-duplicate-keys/entity-refs/causal-targets/environmental-evidence/enum-values PASS, validate-disorders PASS, validate-grouping/check-groupings PASS.

  summary: Reviewed and enriched NUP62-Related Infantile Bilateral Striatal Necrosis with Harrison's chapter
    and ICIMD classification evidence, biological scales and GO molecular function grounding for NUP62,
    causal edge to Basal Ganglia Atrophy, phenotype diagnostic flags, and new diagnosis, treatments, and
    references blocks.
  details: Added classifications.harrisons_chapter (NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE) and icimd_category
    evidence with PMID:16786527; added biological_scale, GO:0017056 molecular function, CL:0000540, GO:0051402,
    and UBERON:0002420 annotations across pathophysiology nodes and wired Basal Ganglia Neuronal Degeneration
    to Basal Ganglia Atrophy; added diagnostic flags to phenotypes; and added diagnosis (Brain MRI and
    NUP62 Genetic Testing), treatments (Oral Biotin Supplementation targeting Basal Ganglia Neuronal Degeneration),
    and references sections.

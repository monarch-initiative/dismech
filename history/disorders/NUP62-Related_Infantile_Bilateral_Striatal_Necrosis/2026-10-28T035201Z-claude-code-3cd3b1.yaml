  details: |
    The previous commit's write to cache/enums/diseaseterm_b84b03ef2175.csv removed the MONDO:0014501 row used by Macular_Degeneration_Early-onset; reset the file to main and let just validate-terms re-add MONDO:0010080. Removed GO:0051402 neuron apoptotic process INCREASED from Basal Ganglia Neuronal Degeneration: the sources report atrophy, gliosis and neuronal loss but not the mode of cell death, and the suggested neutral alternative GO:0070997 neuron death is obsolete in GO. Added CHEBI:15956 biotin as therapeutic_agent on the biotin treatment, and rewrote both biotin explanations to say the observation is uncontrolled, in three children, and hedged by the authors. Removed the basal ganglion location from the constitutional NUP62 p.Q391P variant node. Aligned the MRI and edge prose with the cited MRI sentence (basal ganglia atrophy) instead of naming caudate, putamen or lenticular nuclei. The 2026-10-24 record still lists GO:0051402 because that session added it.

  summary: 'Anchor repair: bind the NUP62-specific MONDO leaf'
  details: |
    Anchor repair for the series-069 row MONDO:0010080 familial infantile bilateral
    striatal necrosis (NUP62), which is this entry's own disease.

    The entry bound MONDO:0015518 infantile bilateral striatal necrosis, and its notes
    described that as "the available public disease term", broader than the
    NUP62-specific familial form. That negative-existence claim is wrong:
    MONDO:0010080 exists, its OWL axioms record hgnc:8066 NUP62 as the causal gene, and
    MONDO files it as a child of MONDO:0015518 alongside striatonigral degeneration and
    syndromic disease. disease_term now binds it. MONDO:0015518 is kept as a
    skos:broadMatch cross-reference, since its own definition describes "several
    syndromes" of bilateral striatal degeneration and it asserts no gene. The notes
    paragraph is rewritten to describe the binding rather than to repeat the claim.

    just validate-terms passes on the new binding, so MONDO:0010080 is inside the
    DiseaseTerm dynamic enum, not merely resolvable.

    No other content touched. Wiring is unchanged and was already complete on the gene
    side: 1/1 causal genes wired, 4/5 phenotypes with a causal inlink, 0 of 3
    pathophysiology nodes without an outgoing edge.

    Validation on the committed tree: just validate 0 issues; just validate-terms
    passed; just count-verified-snippets 15/15.

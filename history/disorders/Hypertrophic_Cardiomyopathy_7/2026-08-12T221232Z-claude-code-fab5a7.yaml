  summary: 'Address PR #7818 review: trials, treatments, hotspot, variant'
  details: |
    Responds to the ai4c-reviewer CHANGES_REQUESTED review on PR #7818 (raised twice - the
    intervening push was a rebase, not a fix). All four IMPORTANT items are addressed. Three
    needed no new literature, as the review noted; the fourth needed no fetches either, because
    the aficamten and trial records had landed on main independently since the branch was cut.

    ITEM 1 - no clinical_trials block. Added NCT03470545 (EXPLORER-HCM) and NCT05186818
    (SEQUOIA-HCM), each with a snippet from its cached registry summary and a note that enrolment
    was by obstructive phenotype rather than genotype, so neither supports a TNNI3-specific
    effect. The SEQUOIA note additionally records that enrolment required outflow-tract
    obstruction, a phenotype some CMH7 patients do not have.

    ITEM 2 - three deep-research treatments absent. Anticoagulation for atrial fibrillation added,
    with a target_mechanisms edge onto Arrhythmogenic Substrate - the review's point that this was
    an unexploited edge in the entry's own pathograph was correct, since the ICD entry already
    used that node while the atrial arm of the same substrate had nothing attached. Heart
    transplantation added (NCIT:C15246, SURGERY), joining Heart Failure and Sudden Cardiac Death.
    Aficamten was folded into the existing Cardiac Myosin Inhibition treatment rather than given a
    separate entry, which the review offered as an option: it is the same mechanistic class acting
    on the same node, so a separate treatment would have duplicated the target_mechanisms edge
    without adding a distinct mechanistic claim. It carries CHEBI:747213; mavacamten remains
    term-less and the treatment notes now record why (NCIT:C174901 is not reachable from
    NCIT:C1909 Pharmacologic Substance, sitting under Inotropic Support instead, and CHEBI has no
    mavacamten term), so the enum-root gap the review flagged is documented in the file rather
    than only in a review thread.

    Both anticoagulation and transplantation are deliberately unsourced at the TNNI3 level and say
    so in their notes: no TNNI3-specific study exists for either, and the guideline record cached
    for this entry (PMID:38718139) carries only AIM/METHODS/STRUCTURE sections with no quotable
    recommendation text, so no snippet is claimed rather than a citation being attached that does
    not support the claim. One schema correction along the way: treatment_effect PREVENTS is not
    in the enum (INHIBITS/ACTIVATES/MODULATES/BYPASSES/RESTORES); transplantation uses BYPASSES,
    which is also the more accurate description - replacing the ventricle bypasses the terminal
    node rather than modifying the upstream lesion.

    ITEM 3 - exon 7/8 hotspot quote unconsumed. Added to the Cardiac Troponin I Inhibitory
    Dysfunction trigger node, both as an evidence item quoting PMID:38548731 verbatim and as a
    sentence in the node description. The point worth preserving is not the 80% figure on its own
    but what the same sentence says next: the hotspot exons encode the actin- and
    troponin-C-interacting domains, so the mutational distribution coincides with the functional
    interfaces this node models. Quoted as a flowed block scalar because the sentence is
    line-wrapped in the cache, per the review's own note.

    ITEM 4 - p.Arg79Cys / c.235C>T neither curated nor disclosed. Curated as a variant rather than
    excluded. PMID:39426416 is a study entirely about this allele and the entry was already citing
    it six times, including once for generic allelic heterogeneity, while the variants list did
    not contain it - the silence was the problem, as the review put it. Three evidence items: the
    family-level identification as disease-causing, the AC16 cellular hypertrophy phenotype
    (ANP/BNP/MYH7 upregulation, increased cell size, ERK activation), and the authors' own hedged
    conclusion quoted verbatim as PARTIAL. The description states two caveats explicitly - that
    causality here rests on one family plus a transfection model rather than on linkage or a
    documented de novo event, unlike Arg145Gly and Lys206Gln, and that the study's own conclusion
    is hedged - so the allele is not read as equivalent in evidential weight to the founding CMH7
    alleles. The variant is named by its cDNA change, which is what the source uses throughout;
    the protein-level designation appears in parentheses.

    NOT CHANGED, and previously verified by the reviewer as correct: the rejection of HP:0001716
    (WPW) and HP:0031992 (apical HCM) from the OMIM annotations, which remains documented in
    notes.

    VALIDATION. 'just validate-disorders kb/disorders/Hypertrophic_Cardiomyopathy_7.yaml' passes
    in full - schema, terms, references - with "Snippets checked: 93/93 verified against cached
    references", up from 86/86 before this session. The branch was rebased onto current
    origin/main.

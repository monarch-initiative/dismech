  summary: 'Create: Hypertrophic Cardiomyopathy 7 (TNNI3)'
  details: |
    Created kb/disorders/Hypertrophic_Cardiomyopathy_7.yaml for MONDO:0013369 (CMH7, OMIM:613690, TNNI3), the TNNI3-related hypertrophic node of the TNNI3 allelic series. Scope is deliberately separate from the existing umbrella Hypertrophic_Cardiomyopathy entry (MONDO:0005045), which was not edited; the parent MONDO:0024573 (familial hypertrophic cardiomyopathy) is uncurated, so no existing entry covered this entity.

    Content: a six-node pathophysiology chain (cardiac troponin I inhibitory dysfunction -> myofilament calcium hypersensitization and impaired relaxation -> hypertrophic signaling and metabolic stress -> cardiomyocyte hypertrophy, myocyte disarray and interstitial fibrosis -> LVH with diastolic dysfunction plus arrhythmogenic substrate -> heart failure and sudden cardiac death), with four nodes declaring conforms_to against the cardiomyopathy_maladaptive_remodeling module; two mechanistic_hypotheses (CANONICAL calcium-hypersensitization, EMERGING signaling/metabolic); 11 phenotypes; a genetic block with five variants and two structured case_fractions (3 percent of HCM overall, up to 5 percent of genotyped familial HCM); plus prevalence, inheritance, diagnosis, differential_diagnoses, progression, treatments, animal_models, experimental_models, discussions, references and notes.

    DEEP-RESEARCH PROVIDER SUBSTITUTION: the requested provider falcon/Edison is unavailable in this environment (neither EDISON_API_KEY nor FUTUREHOUSE_API_KEY is set; deep-research-client reports "Provider 'falcon' not available. Available: claude_code"). claude_code was substituted and its report is committed at research/Hypertrophic_Cardiomyopathy_7-deep-research-claude_code.md.

    NEC discipline: TNNI3 also causes restrictive (RCM1) and dilated (CMD1FF) cardiomyopathy, so every citation was individually checked to concern the hypertrophic phenotype. The MONDO record was verified with OAK (definition names TNNI3, OMIM xref 613690, synonyms include CMH7); the DR report passed the gene-frequency NEC check (TNNI3 named 192 times versus MYBPC3 10 and MYH7 9, with OMIM:613690 and MONDO:0013369 both matching). The ClinGen assertion cited is the TNNI3/hypertrophic-cardiomyopathy Definitive record, not the two TNNI3/dilated-cardiomyopathy Strong assertions also present in the cache; the ClinGen gene-validity paper cited is the HCM curation (PMID:30681346), not the DCM curation (PMID:33947203) that also lists TNNI3. Mogensen (PMID:12531876, restrictive) is cited only inside the differential-diagnoses entry that scopes CMH7 against RCM1.

    DR output was treated as leads only. Four report-derived references were adopted after independent verification (PMID:25524337 Coppini thin-filament cohort, PMID:11815426 Niimura elderly-onset, PMID:38548731 paediatric de novo case, PMID:12531876 Mogensen), each fetched with just fetch-reference and quoted only from the cached record. Two report suggestions were rejected on checking: apical hypertrophic cardiomyopathy (HP:0031992) and Wolff-Parkinson-White syndrome, neither quotable from a primary source, and PMID:37561025 places TNNI3-associated hypertrophy in the interventricular septum and anterior and lateral walls rather than the apex.

    Validation: just validate passed (schema, terms and references); just validate-references reported 86/86 snippets verified against cached references; just validate-terms passed. Nineteen references_cache files were added, all via just fetch-reference; none was hand-created.

  summary: Enhance Marden-Walker Syndrome with separated PIEZO2 sensory-neuron/tendon cascade and clinical
    FADS nosology, Piezo2 knock-in mouse model, and clinical sections
  details: Wired causal gene PIEZO2 (hgnc:26270), molecular function GO:0008381, and proprioceptive sensory
    neuron cell type (CL:1001451) to the upstream PIEZO2 Gain-of-Function and Mechanotransduction Defect
    node; modeled the PIEZO2-specific sensory-neuron and tendon-shortening cascade (Excessive Mechanotransduction
    in Proprioceptive Sensory Neurons -> Tendon Shortening and Disrupted Musculoskeletal Development)
    from PMID:36634173 separately from the clinical Fetal Akinesia Deformation Sequence node (PMID:8370150)
    and Central Nervous System and Hindbrain Maldevelopment node (PMID:36588752); removed unsupported
    causal edges for Hypospadias, Arachnodactyly, Low-set ears, and Postnatal growth retardation; added
    the Piezo2 E2799del knock-in mouse model (PMID:36634173) with Botox and dietary EPA rescue readouts;
    added synonyms, inheritance_term bindings (HP:0000006, HP:0000007), progression, diagnosis, differential_diagnoses,
    supportive treatments, Hypospadias phenotype (HP:0000047), and top-level references.

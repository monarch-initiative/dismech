  details: |
    Review of Carbonic Anhydrase VA Deficiency

    Scope and preflight: inherited CA5A disease, eligible under exclusion of infectious/environmental diseases and poisonings. No prior REVIEW, one CREATE. No KB/history overlap among 98 paginated open PRs. New isolated branch from origin/main 84e8ade3abddc4a9f248562716a8abfa193bf1b8; explicit rebase up to date. No matching deep-research report or citation companion exists; similarly named incidental research references were screened as off-topic.

    Sources: existing PMID26913920 full publisher PDF read across patient selection, results, clinical/biochemical tables, Sf9 methods, stability/activity assays, treatment discussion and limitations. PMID24530203 regenerated from abstract to full HTML and read clinical families, patient RNA/liver validation, COS-7 assays, biochemical interpretation, normal screening, differential and treatment hypotheses. Original phenotypes and numeric prose checked against those sources; the 10/96 figure is referral-cohort yield, never prevalence.

    GeneReviews PMID25834911 tagged. Full August2021 chapter retrieved via /sites/books/NBK284774/, read clinical, diagnosis, molecular, differential, management, surveillance, family testing and counseling. Clinical spectrum updated using later primary sources, avoiding outdated <20-case and uniformly benign claims. No formal management guideline claimed.

    PMID38974611 full XML: 18-person c.59G>A founder cohort, narrative/table and limitations read. 7/18 recurrence,7/18 delay,7/18FTT,3/18microcephaly;9/11tested hyperCKemia;normal lactate and sparse ketosis refute obligatory triad. Frequencies explicitly scoped, two MCAD co-diagnoses and incomplete additional genetic testing limit causal attribution. Asymptomatic homozygous adults support variable penetrance.

    PMID41736722 full XML: exon3–7 deletion,3children without recognized crises. Body and tables read; additional SYT2/SYNE4 genotypes in two siblings and authors' attribution caveat retained. No untested RNA/protein consequence or definitive CA5A-only developmental mechanism claimed; no exact genomic coordinate copied because assembly is not established.

    PMID41113665 full XML: p.Trp159Arg remains VUS, despite plausible clinical phenotype and computational prediction. No unsupported upgrade to likely pathogenic. Standard newborn screen normal, clinical follow-up short. PMID41737902 full XML: antenatal sibling management combines feeds, monitoring, prophylactic carglumic acid; paternal frameshift/maternal VUS retained, no drug-only prophylactic efficacy assertion. No doses promulgated as a treatment protocol.

    PMID42371568 full XML: original siblings' adolescent follow-up, recurrent crisis at8years, normal later development, clinical literature synthesis including biochemical heterogeneity, neurological/CK limitations, care and uncertainties read. Do not use pooled percentages as population prevalence or universal risk; overlapping previous patients are not counted as independent cohorts. Source's stronger claim about crisis-independent injury is tempered by original deletion report's co-variants.

    PMID31641285 fetched but unavailable for quotation. Full publisher letter fetched as URL and read; actual fatal case had exon1–2 deletion and progressive neurological injury despite biochemical normalization. No title-only quote from empty PMIDcache. PMID23589845 fetched abstract, full PMC HTML separately cached/read results/discussion/methods: single vs double knockout, normal fasting glucose in single knockouts, citrate neonatal benefit but no growth/postweaning benefit. Do not repeat later paper's overbroad claim that citrate improved growth. No animal benefit presented as established human treatment. COS-7 and Sf9 experiments distinct, IN_VITRO; mice MODEL_ORGANISM.

    ClinicalTrials.gov official API search on2026-10-04 returned NCT03655223, Early Check. Condition list explicitly includes CA-VA deficiency. Observational, ACTIVE_NOT_RECRUITING, last update2026-07-01; include as screening research, not a CA5A efficacy trial. Summary regenerated with just fetch-reference. API snapshot tmp/clinicaltrials-search.json. No new dataset accession reported in the disease-specific sources; no retired shared accession blob accessed.

    Completeness: phenotypes expanded to acute, biochemical, growth and developmental findings; single spectrum without invented molecular subtypes; four affected reactions separated as atomic mechanisms; functional and animal models represented with limitations; diagnosis/copy-number/pseudogene/VUS/screening pitfalls and differential covered; treatment, prevention, monitoring, reproductive care and investigational screening included; central sources consumed across full text. CA-VB modifier and developmental attribution remain explicit open questions. No unsupported ammonia-to-all-development causal chain.

    Ontology: local OAK HP/NCIT/CHEBI searches and info checked proposed terms; authoritative validation corrected HP0003236 canonical label to activity and rejected monitoring NCIT terms outside TreatmentActionTerm. Monitoring is represented by its existing action_category without a misleading therapeutic binding. No schema or validator changes. Bicarbonate is hydrogencarbonate CHEBI17544; carbonate dehydratase activity GO0004089 retained with decreased modifier.

    Validation: batched schema, terms,107snippets/120titles; actual causal graph41nodes22edges, no orphans/integrity issues; file and repository gates, node-class examples, rendering, history and hooks recorded in local logs. All newly generated reference caches came from just fetch-reference, with only sanctioned normalizer/hook changes. Scope limited to one disease, REVIEW history and derived caches. Independent approval and CI tracked on the PR.

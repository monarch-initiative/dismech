  summary: 'Create: Carbonic Anhydrase VA Deficiency (CA5A)'
  details: |
    First WP-001 IEMbase-metabolic new-entry increment for issue #5556. Created kb/disorders/Carbonic_Anhydrase_VA_Deficiency.yaml for CA-VA deficiency [row 1.1.09.01; CA5A / OMIM:615751 / ORPHA:401948 / MONDO:0014332], one of the 7 true new-entry gaps from the WP-001 coverage triage. NEC preflight passed: MONDO:0014332 xrefs OMIM:615751, Orphanet:401948, and gene HGNC:1377 CA5A all match the seed. Entry conforms to the metabolic_intoxication_decompensation module across its enzymatic-block, toxic-accumulation, decompensation, and encephalopathy nodes, substituting the CA-VA/bicarbonate lesion. Mechanism: loss of mitochondrial carbonic anhydrase VA depletes bicarbonate for four hepatic carboxylases CPS1, pyruvate carboxylase, PCC, and 3-MCC, giving combined hyperammonemia, hyperlactatemia, ketonuria, metabolic acidosis, and hypoglycemia progressing to hyperammonemic encephalopathy; carglumic acid resolves hyperammonemia. Evidence from two primary references PMID:24530203 and PMID:26913920; all 21 snippets verified as exact whitespace-normalized substrings of cached abstracts. Validated with just validate and just validate-terms, all passing.

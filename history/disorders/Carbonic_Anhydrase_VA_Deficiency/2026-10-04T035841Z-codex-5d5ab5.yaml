  summary: Correct causal links and evidence after independent review
  details: |
    The independent review identified an unsupported causal link from organic acid accumulation to ketonuria. That link has been removed, and the node now describes only metabolites associated with secondary propionyl-CoA and 3-methylcrotonyl-CoA carboxylase dysfunction. Ketonuria remains a variable clinical observation. The sources do not establish its mechanism in this disorder.

    The hyperammonemia counterexample now quotes the founder cohort's explicit observation that the two asymptomatic patients had normal ammonia. GeneReviews supports a sequela from hyperammonemia to respiratory alkalosis. Coma and cerebral edema are connected to acute hyperammonemic encephalopathy using the GeneReviews clinical description and the founder cohort's MRI findings during an acute episode. The cellular intermediates remain unspecified. Drug avoidance no longer carries an inaccurate Supportive Care ontology binding.

    This record also restates the source audit in readable prose. The original committed REVIEW record is preserved because history is append-only. The review covered clinical manifestations, subtype scope, pathophysiology, genetics, diagnosis, treatment, research studies, experimental models and references. No disease-specific deep-research report was available. The inherited CA5A disorder falls within the review campaign's scope, which excludes infectious and environmental diseases and poisonings.

    The full 2014 discovery paper (PMID:24530203) and 2016 clinical and functional study (PMID:26913920) provided the biochemical interpretation, family observations, molecular testing, cell-based assays and acute-treatment evidence. The reported 10 diagnoses among 96 selected referrals are a diagnostic yield, not population prevalence. The full GeneReviews chapter supplied clinical, diagnostic, management, surveillance and counseling material. Later primary studies qualify its older description of a generally favorable course and the early studies' apparently obligatory biochemical triad.

    The full 2024 founder-cohort report (PMID:38974611) described 18 people with the same CA5A variant and substantial clinical variability. Seven had developmental delay, seven had failure to thrive and three had microcephaly. Creatine kinase was elevated in nine of the eleven people tested. These denominators describe a selected cohort. Asymptomatic adults, normal lactate in some patients and limited observed ketosis demonstrate that the classical presentation is not universal. Two siblings also had medium-chain acyl-CoA dehydrogenase deficiency, and additional genetic testing was incomplete, limiting attribution of every finding to CA5A.

    Three children with an exon 3–7 deletion were described in the full 2026 report (PMID:41736722) without recognized hyperammonemic crises. Additional SYT2 and SYNE4 findings in two siblings and the authors' own caveat prevent a definitive claim that CA5A alone caused their developmental findings. The full Guatemalan case report (PMID:41113665) retains p.Trp159Arg as a variant of uncertain significance. The full antenatal and neonatal sibling report (PMID:41737902) likewise retains the maternal variant's uncertain classification and cannot separate the effects of carglumic acid from regular feeding and monitoring.

    The full long-term follow-up (PMID:42371568) reports favorable adolescent outcomes in the original siblings but also a recurrent crisis at age eight. Its literature synthesis was checked against the original reports rather than treating overlapping case series as independent populations. The full publisher letter corresponding to PMID:31641285 documents fatal neurological deterioration despite biochemical correction. Because the PMID cache was unavailable, the evidence is quoted from the separately fetched publisher URL. These sources support variable prognosis and continued emergency planning without assigning universal risks from pooled case reports.

    The original full mouse study (PMID:23589845, also fetched as a PMC URL) distinguishes Car5a single knockouts from Car5a/Car5b double knockouts. Citrate improved neonatal survival but did not improve growth or post-weaning mortality. A later paper's broader claim about growth was not carried forward. The COS-7 and Sf9 experiments remain in-vitro evidence, and the knockout findings remain animal-model evidence. Neither establishes treatment efficacy in people. Compensation by carbonic anhydrase VB and the cause of developmental abnormalities remain explicit knowledge gaps.

    The official ClinicalTrials.gov record for NCT03655223, Early Check, lists CA-VA deficiency among its screening conditions. It is represented as observational screening research, with ACTIVE_NOT_RECRUITING status from the record updated July 1, 2026. It is not a CA5A treatment trial. All added reference-cache files were generated through the repository fetch command, including the full GeneReviews chapter and full primary sources where available. No dataset accession was reported in the disease-specific sources.

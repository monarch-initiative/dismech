    Review round for #15263. (1) Takes the AI reviewer's first optional suggestion: the Tumor Surveillance description and a new PMID:39196581 evidence item now carry the AACR 2024 Table 3 recommendation of annual urinalysis with cytology from age 10 (cystoscopy if hematuria), with the table footnote that routine cytology is encouraged within a research study (OTHER, REVIEW_SYNTHESIS, DIRECT). (2) The one-line removal of the now-stale Costello row from tests/coarse_phenotype_baseline.txt, recorded as done in the session record of 2026-10-22T202512Z, is reverted: the CI curation-scope check does not allow a curation PR to change that file without a scope-override label. The stale row is reported as a note by check-coarse-phenotypes, never a failure, and can be dropped by a later baseline sweep. Not taken: onset descriptors on the three tumour phenotypes (the sources' age ranges each span two HPO onset categories, so one category would overstate precision) and entry-level synonyms (outside this PR). Validated with just validate, count-verified-snippets --strict and the offline gates.

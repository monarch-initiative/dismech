  summary: 'Costello_Syndrome: onset of the three tumour phenotypes and MONDO synonyms'
  details: |
    Follow-up to the optional review items on #15263. Added onset descriptors under phenotype_term: Rhabdomyosarcoma and Neuroblastoma CHILDHOOD, Transitional Cell Carcinoma of the Bladder YOUNG_ADULT, each with a note naming its source. The age groups come from GeneReviews (PMID:20301680, already cited: young children for rhabdomyosarcoma and neuroblastoma, adolescents and young adults for bladder carcinoma) and from the 2023 systematic review's age-stratified standardized incidence ratios (PMID:36966234). Three new evidence items from PMID:36966234, all HUMAN_CLINICAL and PRIMARY_RESULT: the rhabdomyosarcoma SIR raised from birth until age 14; the bladder cancer SIR highest at ages 10-14 and raised throughout life; and the discussion sentence that bladder tumours were more common in adult life and presented earlier than in the general population. The neuroblastoma age sentence was already cited. Bladder onset spans adolescence and young adulthood; YOUNG_ADULT was chosen because the review found bladder tumours more common in adult life, and the note records the 10-14 peak. Added synonyms from MONDO:0009026 (OLS): the exact synonyms faciocutaneoskeletal syndrome and FCS syndrome, and the related abbreviation CSTLO. Validation: just validate-disorders reports no issues; 98/98 snippets verified; the 18 offline gates used for this series all pass.

  summary: 'Gene-family review: HRAS, NRAS'
  details: |
    Typed the HRAS record CAUSATIVE with variant_origin GERMLINE and copied the ClinGen RASopathy GCEP Definitive tier for Costello syndrome (MONDO:0009026, the entry's disease term) from the CGGV assertion it cited; heterozygous HRAS missense variants, chiefly p.Gly12Ser, cause most cases (PMID:16443854). Typed the NRAS record UNKNOWN, GERMLINE, with its ClinGen Limited tier and a note. Bound GTPase activity DECREASED on the 'Germline HRAS gain-of-function mutation' node: the Costello glycine-12/13 substitutions impair GTP hydrolysis and hold HRAS in the GTP-bound state, as the record's notes state.

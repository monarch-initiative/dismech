  summary: 'Edit: Costello_Syndrome - split the coarse malignancy phenotype into its
    three tumours; 2024 AACR surveillance'
  details: |
    Replaces the coarse phenotype 'Predisposition to Malignancy' (HP:0002664 Neoplasm) with the three tumours the sources name, as part of the neuroblastoma curation project (#14976, slate item P-b Costello): Rhabdomyosarcoma (HP:0002859, OCCASIONAL; 30 of 573, 5.2%), Neuroblastoma (HP:0003006, VERY_RARE; 5 of 573, 0.9%; SIR 60, 70 at ages 0-4) and Transitional Cell Carcinoma of the Bladder (HP:0006740, VERY_RARE; 13 of 573, 2.2%), from the 2023 systematic review and meta-analysis (PMID:36966234), GeneReviews (PMID:20301680) and the 2024 AACR RASopathy surveillance update (PMID:39196581). The coarse phenotype was removed rather than given a coarse_binding_basis because the sources list the tumours, the three account for most cancers in the largest series, and the aggregate risk already has a home on the 'Tumor Predisposition' node; the stale row in tests/coarse_phenotype_baseline.txt is removed.

    Tumor Predisposition: the single edge to the old phenotype becomes three INDIRECT_UNKNOWN_INTERMEDIATES edges with their own evidence; the node description gives the 13% cumulative incidence by age 20 and the lower combined cancer-and-death rate with HRAS p.Gly12Ser; Kerr 2006's 'about 17%' item moved here, graded BACKGROUND.

    Tumor Surveillance: action_category SCREENING (no target_phenotypes); description and eight new evidence items follow the 2024 AACR Table 3 and text (abdominopelvic ultrasound every 3 months to age 14 for rhabdomyosarcoma; neuroblastoma screening to age 6, then tapering to age 10; urine catecholamines not useful; cystoscopy every 2 years from age 10 could be considered), with the 2023 review's statement that no evidence yet shows a mortality benefit.

    Source discrepancy noted, not quoted: the AACR update gives the 38.7% cancer rate for p.Gly12Asp, while the meta-analysis it cites gives it for p.Gly12Ala; genotype figures in the entry come from the meta-analysis only. New reference cache: PMID:36966234. Validated with just validate-disorders, count-verified-snippets --strict, validate-terms and the offline gates, including check-coarse-phenotypes.

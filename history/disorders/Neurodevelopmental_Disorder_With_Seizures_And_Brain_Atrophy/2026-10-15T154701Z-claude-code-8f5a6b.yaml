  summary: 'Create: Neurodevelopmental Disorder With Seizures And Brain Atrophy (EXOC7)'
  details: |
    New EXOC7 entry for MONDO:0033658 (OMIM:619072), curated as a single DISEASE. The EXOC8 family in the same report is a separate OMIM disease and is excluded. Sources: the defining series PMID:32103185 (full text cached), Liu et al. 2007 PMID:17761530 for the Exo70 phosphatidylinositol-4,5-bisphosphate binding that grounds the gene node's molecular function (GO:0005546; EXOC7 also carries this GO annotation in QuickGO), and PMID:19846717 for Exo70-dependent membrane addition in neurons. The claude_code deep-research report was used as a lead; preflight-dr was not run because no local MONDO build is available. Validated with validate-disorders, validate-terms, count-verified-snippets and the offline gates.

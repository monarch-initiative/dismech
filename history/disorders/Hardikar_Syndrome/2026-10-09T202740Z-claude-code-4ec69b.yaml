  summary: 'Create: Hardikar Syndrome (MONDO:0012997, MED12)'
  details: |
    Created the entry for Hardikar syndrome, the female-specific truncating-allele arm of the MED12 series and the last uncurated MED12 disease. Closes the stub Cholestasis-pigmentary_Retinopathy-cleft_Palate_Syndrome.yaml, which is deleted in the same change. Claim issue #13793.

    Naming. Curated as Hardikar_Syndrome rather than the stub's proposed_name (Cholestasis-pigmentary_Retinopathy-cleft_Palate_Syndrome, MONDO's label). The eponym is what the primary literature uses and what the existing MED12 has_subtypes row on Mediator_Complex_Neurodevelopmental_Disorder already calls it. MONDO's label is retained as the disease_term label and as a synonym.

    Sources and how they were used. Deep research was run with Edison/falcon (research/Hardikar_Syndrome-deep-research-falcon.md, 21.6 min, committed with its citations sidecar and artifacts). just preflight-dr against MONDO:0012997 returned PASS: MED12 was the dominant gene mention at 35, and the report's OMIM set overlapped MONDO's on 301068. The report's own reference validation recorded 10/10 resolved with a 0.0 confabulation rate and zero off-topic, and its term validation 15/15 resolved; its single reported label mismatch is an artifact of the template text 'MONDO:0012997 (if available)' being parsed as a label.

    The report stated plainly that Strong et al. 2024 'was identified bibliographically but its primary text could not be examined here; no experimental results are attributed to it below.' That paper, PMID:39045790, turned out to be the principal mechanistic source for the disease, so it was fetched and read directly. It supplies the ciliation, Hedgehog and YAP/TEAD results, the cardiomyopathy/arrhythmia/vascular phenotypes, the extension of the allele class to splice-site variants, and the surveillance recommendation. Most of this entry's mechanism therefore rests on a source the research report explicitly did not read.

    The report's own mechanism section, assembled from older zebrafish and mouse Med12 work on endoderm specification and Wnt/SOX9 signalling, was deliberately not curated. It is model-organism evidence about MED12 developmental biology in general rather than about this disease, and the human cell-based ciliary and YAP results are both more specific and more recent. This is a decision not to use available DR content, not an oversight.

    Pathograph. Eleven nodes running from MED12 truncating loss of function through reduced dosage in the Mediator kinase module to three parallel molecular defects (impaired primary ciliogenesis, impaired Hedgehog pathway activation, impaired YAP-TEAD transcriptional output), converging on disrupted developmental organogenesis and then branching to biliary dysgenesis with progressive cholestatic liver injury and to a cardiac/vascular arm. Skewed X-inactivation is modelled as a separate node feeding dosage, because it is a measured and consistent finding but is measured in blood and so cannot say which allele is active in an affected organ. mechanism_confidence is graded per node: ESTABLISHED for the human genetics and the in vitro molecular results, PROVISIONAL for the organogenesis node whose authors state it as a model, HYPOTHETICAL for the cardiac/vascular node where the authors allow that the cardiac disease may be independent of both ciliary and YAP effects.

    Verified connectivity with dismech.graph.build_causal_graph: 39 edges over 36 nodes, orphan_targets empty, no isolated nodes. An initial pass left Biliary atresia, Absent gallbladder and Cyst of the ductus choledochus unwired; they were connected downstream of Biliary Dysgenesis, where they belong. just list-disconnected-phenotypes now reports 21 of 21 phenotypes causally connected.

    Ontology bindings. Every identifier was looked up in the step it was written. HP:0100890 is the one to note: the research report called it 'Choledochal cyst' while HPO's canonical label is 'Cyst of the ductus choledochus', so the binding was right and the report's label would have failed validation. HP:6000413 Ectopic ureteral orifice was checked rather than inferred from the phrase 'ectopic ureters'; HP:0000070, which a careless search would have returned, is Ureterocele and is not it.

    Two bindings were declined on positive grounds, with the reasoning recorded on the nodes. GO:0035329 hippo signaling was rejected for the YAP node because that term denotes the Hippo kinase cascade, which inhibits YAP, so binding it with a DECREASED modifier would assert the opposite of the source; searched l~Hippo, l~TEAD and l~transcription coactivator activity, and GO has no biological-process term for YAP/TEAD-driven transcription, so the process slot carries GO:0006357 with the specific claim in preferred_term and the YAP/TEAD identity kept queryable through the GO:0140552 TEAD-YAP complex component. The X-inactivation node carries no term at all, because HPO's inheritance subtree has no term for skewed X-inactivation as a cellular state and the GO X-inactivation terms describe the normal process, so a modifier would assert a defect in the inactivation machinery that no source claims.

    Deliberate restraint on the 2026 case report. PMID:42510827 is cited for phenotypic observations and for the existence of its candidate allele only. Its MED12 c.3868-5C>G variant was retained as a variant of uncertain significance by its own authors with no RNA or protein validation, so it is recorded with clinical_significance UNCERTAIN_SIGNIFICANCE, is not counted as a molecularly confirmed case, and is not used as evidence that splice disruption is an established mechanism. Every evidence item drawn from that report is graded directness INDIRECT for that reason.

    No ClinGen gene-disease validity assertion was recorded, and the reason is in the genetic notes: ClinGen's Definitive MED12 assertion is against MONDO:0100000 MED12-related intellectual disability syndrome, which is neither this entry's disease_term nor an exactMatch mapping of it, so copying that tier here would attribute a classification to a pair ClinGen did not classify.

    Three discussions. hardikar_med12_hedgehog_direction is a CONTROVERSY recording that this entry asserts MED12 promotes Hedgehog signalling while dismech's own FG_Syndrome_1 entry carries a node for derepression of GLI3-dependent Sonic Hedgehog target transcription, which asserts the opposite. Both may be correct because the alleles differ, but the tension should be recorded rather than left for a reader to find. The other two are KNOWLEDGE_GAPs: that the whole molecular mechanism rests on siRNA knockdown in one retinal pigment epithelial line with no organ-level assignment, and that X-inactivation skewing is untested as the explanation for the organ-restricted hepatobiliary presentation.

    Prevalence is recorded as CASES_IN_LITERATURE / ULTRA_RARE with no numeric rate, and no phenotype carries a frequency band, because every available count is a literature compilation rather than a denominator.

    Validation, all run in this worktree and read: just validate (54 snippets checked, 59 titles checked, 0 issues), just validate-terms (passed), just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms, just check-stubs (no errors after the stub deletion), just model-scale-audit (1 link, scale ALIGNED, 2 typed divergences, confirming the audit can see the link rather than reporting zero). All 31 candidate snippets were verified as exact substrings of the cached references before any YAML was written.

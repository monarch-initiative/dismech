  summary: 'Create: Splenic Marginal Zone Lymphoma'
  details: |
    Created kb/disorders/Splenic_Marginal_Zone_Lymphoma.yaml (MONDO:0019462) de novo. Duplicate preflight against origin/main, all PRs and all issues confirmed no existing entry; issue #5044 had closed the marginal zone lymphoma ROOT (MONDO:0017604) as covered by MALT_Lymphoma.yaml, but splenic MZL is a distinct sibling disease with its own MONDO term and CURATE_ROOT recommendation, and no KB entry mentioned it except as a differential. Modeled a five-node pathophysiology chain: chronic antigenic stimulation of splenic marginal zone B cells (conforms_to tumor_promoting_inflammation#Chronic Inflammatory Stimulus) to disruption of marginal zone B-cell identity and quiescence (NOTCH2 PEST-domain truncation, KLF2 loss, 7q deletion) to constitutive NF-kB activation (conforms_to sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation) to splenic white pulp infiltration and hypersplenism to cytopenias and autoimmune complications. Used CL:0000845 marginal zone B cell of spleen rather than the lymph-node sibling used by MALT_Lymphoma. Bound the splenic nodes to UBERON:0001959 white pulp of spleen and UBERON:0002106 spleen via the locations slot. Curated 6 phenotypes, 4 genetic drivers (NOTCH2, KLF2, TNFAIP3, TP53), 5 treatments including the hepatitis C antiviral arm as the splenic counterpart of H. pylori eradication in gastric MALT lymphoma, plus prevalence and progression blocks. Frequency bands were deliberately omitted throughout rather than estimated, and the lymphocytosis phenotype carries an explicit PARTIAL qualifier because absolute lymphocytosis is not universal in this disease. Deep research: just research-disorder claude_code was run per the curate skill (21 web searches, ~20 min, 5.86 USD, session f8f5205d). The resulting artifact is RETAINED FOR PROVENANCE ONLY and was NOT used as an evidence source: the provider hit the known claude_code serialization defect and wrote only its final turn, so the report body and its Appendix A are absent and the artifact cites zero PMIDs. The one substantive item surviving in the fragment, UBERON:0001959, was independently re-verified against the live EBI OLS API before use rather than trusted from the report. All evidence was therefore sourced independently via direct PubMed E-utilities searches. All 10 references fetched with just fetch-reference; every snippet was pre-verified as an exact whitespace-normalized substring of the cached reference body using a scratch checker, with known-good CI-passing MALT_Lymphoma snippets used as a control to confirm the validator normalizes whitespace rather than requiring raw substring equality. Validation: just validate passed schema, term and reference validation with 42/42 snippets verified against cached references; just compliance reports 92.3 percent global and 93.1 percent weighted.

  summary: 'Address PR #7423 review findings'
  details: |
    Addressed all 8 IMPORTANT and all 4 SUGGESTION findings from the ai4c-reviewer review of PR #7423. Added diagnosis (immunophenotype, positive and exclusionary arms), differential_diagnoses (6 entries: HCL, HCL-V, WM, CLL, NMZL, SDRPL with molecular discriminators), histopathology (5 findings from an 8-case clinicopathologic series), classifications (icdo_morphology Lymphoma), and clinical_trials (MAGNOLIA NCT03846427). Added cladribine plus rituximab treatment using the previously unused headline result of PMID:23712547. Added structured case_fractions to all genetic entries and a new Deletion of Chromosome 7q entry (approximately 40 percent, the most frequent lesion, deliberately without gene_term since it is a multi-gene region). Removed the GO:0006915 apoptotic process binding from the cytopenias node and recorded in notes why no term is bound, since sequestration and antibody-mediated destruction are not apoptosis. Qualified the TNFAIP3 claim: the 7-15 percent frequency is SMZL-specific but the source states the NF-kB mechanism was shown in other NHLs, so both evidence items are now PARTIAL and the notes flag the driver role as probable rather than demonstrated. Upgraded IGHV evidence to the full-text review and demoted the weak Russian B-LPD paper to PARTIAL corroboration. Upgraded anatomy to UBERON:0001251 marginal zone of spleen, the part_of parent of CL:0000845. Two reviewer claims were checked and NOT taken at face value: the reviewer's case-fraction quote used hyphens where the source uses en-dashes and would have failed validation, so the verified en-dash form was used; and the reviewer's histopathology finding cited intrasinusoidal marrow infiltration as near-pathognomonic, but that term appears nowhere in PMID:39280243, so it was sourced instead to PMID:28892912 and recorded as PARTIAL with an explicit note that a single case report cannot establish how characteristic it is. The related unsourced phrase was also removed from the disease description and the pathophysiology prose. Guessed NCIT:C1614 for cladribine was checked against live OLS, found to be KRN5500, and replaced with CHEBI:567361. Four new references fetched (PMID:19575895, PMID:28892912, PMID:34526366, NCT03846427); all 24 new snippets pre-verified before writing. Validation: just validate passes with 74/74 snippets verified; compliance rose from 92.3 to 93.8 percent global and 92.4 to 94.9 percent weighted.

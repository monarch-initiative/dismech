  details: |
    New de novo Disease entry for short-rib thoracic dysplasia 21 without polydactyly (MONDO:0030356, KIAA0753/Moonraker/OFIP, hgnc:29110).

    entry_type decided as DISEASE (standalone), not a has_subtypes entry on Jeune_Asphyxiating_Thoracic_Dystrophy. Grounds recorded in the entry notes: the mechanism differs from every subtype currently listed on that entry (those are intraflagellar-transport, dynein-2 and Hedgehog-kinase defects; KIAA0753 loss removes the distal-centriole recruitment platform that docks the basal body before any transport question arises), and the KB already curates Short-Rib_Thoracic_Dysplasia_6_With_Or_Without_Polydactyly standalone on the same per-gene-SRTD reasoning. The counter-argument is stated rather than hidden: MONDO does place MONDO:0030356 under Jeune syndrome, and reported patients overlap Joubert syndrome clinically.

    Same-gene separation, the specific risk the claim issue flagged. KIAA0753 causes three named disorders and the KB already holds two: Joubert_syndrome carries it as a causal gene, and Orofaciodigital_Syndrome_17 (an INTU disorder) names it only inside a quoted gene list. Both were read before curating. Every citation was checked for which presentation it describes. Two are cited deliberately for the other arms and are confined to differential_diagnoses: PMID:28220259 for the Joubert presentation, PMID:26643951 for the OFD VI presentation (the same paper is also cited for the OFIP complex cell biology, which is presentation-neutral).

    preflight-dr PASS (KIAA0753 mentioned 46 times, top gene; rivals SHH and OFD1 are pathway partners rather than a second disease entity).

    Nodes 2, 3, 5 and 7 declare conforms_to against ciliopathy_dysfunction. Node 5 substitutes the polydactyly-free presentation for the module's Skeletal Dysplasia with Polydactyly node and says so in its description, since absence of polydactyly is in this disorder's name.

    Animal models. The zebrafish kiaa0753 nonsense mutant (PMID:29138412) is the only model with a skeletal readout, curated PARTIALLY_RECAPITULATES with LOW fidelity because zebrafish have no mammalian endochondral growth plate. The Mnr-null mouse (PMID:34241634) was found by checking rather than assumed absent - an early draft said the zebrafish was the only animal model, which was wrong and was corrected. The mouse RECAPITULATES both the ciliogenesis and the Hedgehog nodes with measured readouts, but was characterised at E8.5-E9.5, before the skeleton forms.

    A HUMAN_MODEL_MISMATCH discussion records that every functional measurement for this disorder was made in fibroblasts or immortalised lines, while the disease is a chondrodysplasia, and that neither animal model closes that gap. A second KNOWLEDGE_GAP records that nothing distinguishes which of the three phenotypes a given genotype produces.

    Not curated: no clinical_trials, datasets, environmental or biochemical sections. Thoracic expansion surgery is used in the short-rib dysplasias generally but no KIAA0753 patient has been reported to have had it, so it is described in the treatment prose and deliberately not curated as a treatment for this disorder.


  summary: Review SRTD21 phenotype evidence, HPO specificity and causal explanations
  details: |
    Reviewed all 27 original phenotypes against the Falcon report and primary source context, including skeletal versus Joubert/OFD presentation. Removed dental hypoplasia explicitly attributed to the coexisting SLC13A5 diagnosis in discovery-series P1/P2; retained its confounding effect on developmental and speech findings and removed misleading developmental and MRI frequency fractions. Narrowed corpus-callosum binding to hypoplasia. Added 25 clinical findings from skeletal cases, with case-specific scope and RUNX2 VUS caveat where relevant. Repaired phenotype and growth-plate evidence, added 15 causal links supported by skeletal growth, respiratory restriction, indirect cerebellar developmental evidence and the explicitly attributed dyskinesia-infection relationship. Preserved unresolved clinical routes as a knowledge gap rather than assuming a shared mechanism. Corrected the SHH/WNT experimental context to Joubert-patient fibroblasts and mouse NIH3T3 cells. Final entry has 51 phenotypes, 15 causally connected and 36 unresolved clinical findings; none are assay readouts. Validated schema, references, ontology terms, history, duplicate keys, entity and causal targets, and supplemental evidence/cache gates on refreshed main.

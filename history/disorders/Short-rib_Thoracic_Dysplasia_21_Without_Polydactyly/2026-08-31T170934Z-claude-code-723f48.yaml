  summary: 'Review follow-up: pulmonary hypoplasia node, missing allele, craniofacial
    phenotypes; migrate retired PARTIAL grades'
  details: |
    Third session on this entry, addressing the review on head 9a0605ce.

    MISSING VARIANT ADDED. c.2656C>T (p.Arg886*) is the in-trans partner of c.943C>T in the skeletally-presenting patient of PMID:34523780. c.943C>T was already curated, so omitting its partner made the allele list read as complete when it was not. Added as a nonsense PATHOGENIC variant with the reporting sentence quoted.

    PULMONARY HYPOPLASIA MODELLED AS THE MISSING INTERMEDIATE. The chain ran Short Ribs and Thoracic Constriction directly to Respiratory Insufficiency from Thoracic Restriction, which treats the lungs as normal organs that are merely poorly ventilated. The one skeletally-presenting patient described in detail required neonatal intensive care for pulmonary hypoplasia and pulmonary hypertension and died at two weeks. Added a Pulmonary Hypoplasia pathophysiology node (biological_scale TISSUE, UBERON:0002048 lung) with DIRECT edges in from the thoracic node and out to the respiratory node, and reworded the respiratory node's description so it names both the mechanical and the developmental route rather than asserting a purely mechanical origin. The existing direct thoracic-to-respiratory edge was left in place: postnatal mechanical restriction and antenatal failure of lung growth are two real routes, not one mis-drawn one.

    PHENOTYPES ADDED. Pulmonary hypoplasia (HP:0002089) and Macrocephaly (HP:0000256) from the same patient vignette. Also closed the craniofacial gap the previous review left as a follow-up, from the Table 1 craniofacial row of PMID:29138412: Frontal bossing (HP:0002007, present in the P1, P2 and P3 columns, and independently in the skeletally-presenting patient of PMID:34523780), Flat face (HP:0012368, same three columns), Depressed nasal bridge (HP:0005280, P1 and P2 only) and Hypoplasia of teeth (HP:0000685, P1 and P2 only). The table extraction runs the patient columns together with no delimiter, so each explanation states which columns carry the feature. HP:0000685 was the only term not already cached and was added by term validation.

    TREATMENT FINDING DECLINED, WITH THE REASON RECORDED IN THE ENTRY. The review asked for ventilatory and nutritional support to be split out of the generic NCIT:C15747 Supportive Care node, citing tracheostomy, ventilator dependence and gastrostomy feeding in references_cache/PMID_34523780.md. Checked the source: those lines are Patients 1 and 2, the sibling pair at the Joubert end of the KIAA0753 spectrum, whose airway support the paper attributes to central apnea from the brainstem malformation, and neither is reported with a narrow chest or short ribs. Growth hormone therapy in the same gene is likewise recorded only for the two previously reported Joubert siblings, per the Table 1 footnote in PMID:29138412. Patient 3 is the skeletal presentation and what is recorded for him is a two-week course, not a regimen. Curating the sibling pair's interventions here would attribute a central-apnea treatment to thoracic restriction, which is the presentation confusion this entry's own genetic notes warn the next curator about. Recorded the absence in treatments[0].notes instead, naming what exists, whose presentation it belongs to, and what a future source would have to describe for the split to be made.

    RETIRED SUPPORT VALUE MIGRATION. This branch predated the removal of PARTIAL from EvidenceItemSupportEnum, so rebasing onto main made two items unschematic. Migrated per the taxonomy in the schema comment. First, the growth-plate causal edge evidence from PMID:29138412 establishes gene expression in the normal growth plate and the histological lesion in the affected fetus but not the steps between, which is indirect support, so it became SUPPORT with directness INDIRECT, consistent with the edge's own INDIRECT_UNKNOWN_INTERMEDIATES typing. Second, the PMID:34016807 sentence on the Respiratory Insufficiency node reports confirmed respiratory ciliary dyskinesia, which supports the second motile-cilia route named in that node's description rather than the thoracic-restriction route, so it became SUPPORT with directness INDIRECT and its explanation was rewritten to say which sentence of the description it backs and that the quoted sentence itself limits it to one patient.

    VALIDATION. just validate exit 0, 91 of 91 snippets machine-verified, term validation passed. just check-entity-refs exit 0, just check-duplicate-keys exit 0.

  summary: 'Address PR #17575 review feedback on HAX1 GO binding, treatment effects, variants, and prevalence'
  details: |
    Replaced discouraged GO:0005515 (protein binding) on HAX1 Insolubility with GO:0001671 (ATPase activator activity, modifier: DECREASED) backed by PMID:42244541. Changed treatment_effect from RESTORES to BYPASSES on G-CSF and HSCT target_mechanisms and bounded HSCT prose strictly to G-CSF-refractory compartment replacement supported by PMID:35499078. Added verbatim structural and functional evidence quotes for CLPB variants (p.Arg561Gln, p.Gly560Arg, p.Arg620His, p.Arg598Cys), dropped prevalence_class: ULTRA_RARE from the Polish cohort case-share record, and added the PMID:41383606 background quote for overall congenital neutropenia registry prevalence (3-17 per million).

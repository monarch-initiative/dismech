  summary: 'Create: Severe_Congenital_Neutropenia_9'
  details: |
    New entry for autosomal dominant severe congenital neutropenia 9 (CLPB-SCN; MONDO:0030726, OMIM 619813), claimed in #15046. Scoped against 3-methylglutaconic_Aciduria_Type_VIIA (OMIM 619835, dominant CLPB with neurological involvement) and VIIB (recessive); the open question of whether SCN9 and VIIA are one disorder is a KNOWLEDGE_GAP in both entries. Main sources: the defining series PMID:34115842 (abstract only), the Polish national cohort PMID:41383606 (CLPB 10% of genetically diagnosed CN, counts normalised with age, one MDS case), the Care-for-Rare heterozygous patients in PMID:35499078 (one of four with CNS disease, noted wherever it is cited), and the 2025 review PMID:40194906. Mechanistic nodes reuse the knockout and reconstitution papers (PMID:32573439, PMID:42244541, PMID:39644357) marked INDIRECT. Myelodysplasia hangs off the marrow maturation node, not the neutrophil count, matching the change made to VIIA in #15048. GeneReviews (PMID:27891836) covers CLPB deficiency but not this disorder by name; it is tagged and its management lines are cited as INDIRECT. Deep research: falcon is not configured here, so the run used --fallback and openscientist wrote the report. Unlike the VIIA run it was on target: 18/18 references resolved, 18/18 quotes matched, preflight-dr PASS. It added no CLPB-specific source beyond those already cited; its general SCN transplant papers (PMID:15640815, PMID:15489867) and its NCIT:C15847 (resolves to Non-Ionizing Radiotherapy) were not used. A pre-PR self-review led to: narrowing the variant-clustering claim (the Polish carriers include ankyrin- and D2-domain variants, p.Arg297Trp among them); a REFUTE caveat that overexpression models do not reflect patient respiration; attribution notes on PMID:35499078 items; the R561 count explained as pooled; HP:0025826 Severely decreased neutrophil count for the phenotype; a REFUTE noting R561Q still binds HAX1; and PMID:39644357 insoluble-HAX1 evidence. Validation: just validate and validate-disorders pass; count-verified-snippets 47/47; check-genereviews TAGGED; entity-ref, causal-target, duplicate-key, enum, snippet-grading, coarse-phenotype and block-scalar checks pass; model-scale-audit 2/2 aligned.

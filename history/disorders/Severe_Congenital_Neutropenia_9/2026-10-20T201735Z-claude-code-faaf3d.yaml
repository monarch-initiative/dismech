  summary: 'Create: Severe_Congenital_Neutropenia_9'
  details: 'New entry for autosomal dominant severe congenital neutropenia 9 (CLPB-SCN; MONDO:0030726,
    OMIM 619813), claimed in #15046. Scoped against 3-methylglutaconic_Aciduria_Type_VIIA (OMIM 619835,
    dominant CLPB with neurological involvement) and VIIB (recessive); the open question of whether SCN9
    and VIIA are one disorder is a KNOWLEDGE_GAP in both entries. Main sources: the defining series PMID:34115842
    (abstract only), the Polish national cohort PMID:41383606 (CLPB 10% of genetically diagnosed CN, counts
    normalised with age, one MDS case), the Care-for-Rare heterozygous patients in PMID:35499078 (one
    of four with CNS disease, noted wherever it is cited), and the 2025 review PMID:40194906. Mechanistic
    nodes reuse the knockout and reconstitution papers (PMID:32573439, PMID:42244541, PMID:39644357) marked
    INDIRECT. Myelodysplasia hangs off the marrow maturation node, not the neutrophil count, matching
    the change made to VIIA in #15048. GeneReviews (PMID:27891836) covers CLPB deficiency but not this
    disorder by name; it is tagged and its management lines are cited as INDIRECT. Deep research: falcon
    is not configured here, so the run used --fallback and openscientist wrote the report. Unlike the
    VIIA run it was on target: 18/18 references resolved, 18/18 quotes matched, preflight-dr PASS. It
    added no CLPB-specific source beyond those already cited; its general SCN transplant papers (PMID:15640815,
    PMID:15489867) and its NCIT:C15847 (resolves to Non-Ionizing Radiotherapy) were not used. A pre-PR
    self-review led to: narrowing the variant-clustering claim (the Polish carriers include ankyrin- and
    D2-domain variants, p.Arg297Trp among them); a REFUTE caveat that overexpression models do not reflect
    patient respiration; attribution notes on PMID:35499078 items; the R561 count explained as pooled;
    HP:0025826 Severely decreased neutrophil count for the phenotype; a REFUTE noting R561Q still binds
    HAX1; and PMID:39644357 insoluble-HAX1 evidence. Validation: just validate and validate-disorders
    pass; count-verified-snippets 47/47; check-genereviews TAGGED; entity-ref, causal-target, duplicate-key,
    enum, snippet-grading, coarse-phenotype and block-scalar checks pass; model-scale-audit 2/2 aligned.


    The deep-research report also cited PMID:41560087, a de novo p.R561W case with white-matter disease
    and a movement disorder. It was left out of this entry because that case belongs with type VIIA (where
    it is cited), not SCN9.


    Review round 1 on #15057 (changes requested). Added a Mitochondrial ROS Accumulation node (GO:1903409,
    INCREASED) between impaired respiration and precursor apoptosis, from PMID:39644357 (knockout mouse
    myeloblasts: lower membrane potential, ROS-linked apoptosis, rescue by N-acetylcysteine, free fatty
    acids or citrate), all marked INDIRECT; the respiration node no longer calls that step untested. Added
    GeneReviews diagnosis and genetic-counselling lines (autosomal dominant, 50% transmission) as INDIRECT
    items; the inheritance description notes that GeneReviews'' all-de-novo statement concerns its neurological
    dominant form and that the SCN9 sources do not say whether their variants were de novo. count-verified-snippets
    53/53.

    '

  summary: 'Review and enrich: Severe Congenital Neutropenia 9'
  details: |
    Added Harrison's chapter classifications (ONCOLOGY_HEMATOLOGY, IMMUNE_RHEUMATOLOGIC, GENETICS_ENVIRONMENT_DISEASE) and IUIS phagocyte defect classification with verbatim quotes. Grounded HAX1 Insolubility with GO molecular_functions (GO:0001671 ATPase activator activity) and cellular_components (GO:0005758 mitochondrial intermembrane space), and added causal-edge evidence across pathophysiology downstream links and Congenital neutropenia sequelae. Added ULTRA_RARE prevalence classification on literature case counts and cohort share data, structured six heterozygous CLPB missense variants (p.Arg561Gln, p.Gly560Arg, p.Arg620His, p.Arg598Cys, p.Arg599Cys, p.Arg297Trp), bound NCIT diagnosis_term values and added Bone marrow aspiration and biopsy (NCIT:C92958), added target_mechanisms with treatment_effect: BYPASSES on G-CSF and HSCT, and added model-level evidence on experimental_models.

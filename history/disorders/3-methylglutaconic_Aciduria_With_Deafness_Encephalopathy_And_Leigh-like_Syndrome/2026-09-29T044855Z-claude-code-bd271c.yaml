  summary: Split the fibroblast calcium readout onto its own model link
  details: |
    The PR's own checks were green and the automated review approved it three times, but the deterministic shepherd sweep enqueued it four times (2026-09-21 07:02Z and 19:40Z, 2026-09-23 00:05Z and 06:30Z) and it never merged. The cause was invisible from the PR page: check_model_readout_targets_match_link in tests/test_data.py reported experimental_models[0].modeled_mechanisms[1].readouts[1].target='Deficient Mitochondrial Calcium Handling' against link target 'Mitochondrial Network Fragmentation'. That test runs in the ungated merge_group lane (recipe _test-python-kb) but is skipped on a kb/-only branch, where CI selects the Python and schema pytest lanes by changed path, so the PR stayed green while the queue rejected it. Fixed by splitting rather than retargeting. Unlike the same check's finding on PR #12406, the readout's target here is a real pathophysiology node in this entry and the calcium measurement is a distinct functional claim, not an instrument for the structural one: the link's own description already said the patient line shows 'fragmentation, altered cristae and deficient calcium handling as distinct cellular findings', which is three claims on a link that targeted only the first. So the calcium readout moved onto a new modeled_mechanisms link targeting Deficient Mitochondrial Calcium Handling, RECAPITULATES/MODERATE like its sibling, carrying its own link-level evidence and a limitations string recording both the single-patient-line caveat and that fibroblast calcium buffering does not establish the equivalent defect in neurons or hair cells. The fragmentation link's description was narrowed to the structural findings it still claims, since it would otherwise describe the other link's claim. No claim was weakened or removed and no phenotype, frequency or ontology binding changed. The link-level evidence reuses PMID:34751152 'The calcium buffer function between cytoplasm and mitochondria was deficient', already graded IN_VITRO/SUPPORT twice elsewhere in this file, so snippet grading is unchanged; the snippet count moves 180 to 181, which is that one added evidence item. Also merged main, whose tip had moved about a week past the branch's base. Verified on the merged tree: the exact ejecting test passes, tests/test_data.py 7293 passed, validate-disorders 181/181 snippets and 212 titles with 0 issues, and check-snippet-grading, check-snippet-length, check-title-snippets, check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values all clean. Not addressed, because they are the author's calls rather than gate failures: the reviewer's optional mtDNA-primacy REFUTE item, the 6/33 phenotype connectivity, and the now-vestigial scope-override label.

  summary: Review MEGDEL clinical spectrum, evidence, causal mechanisms, and supportive care
  details: 'Reviewed the complete existing disorder entry and its matching OpenScientist deep-research
    report, then audited every one of its 22 cached references. Read actual article bodies
    where available, rather than accepting content_type metadata as proof of full text. Nine
    of the original papers had usable full texts after provider regeneration; the remaining
    original papers remained abstract-only after bounded retrieval attempts. Added seven further
    primary full-text papers (PMID:29205472, 29686941, 32305867, 33426169, 37917582, 40145675,
    40884098), the complete May 2026 GeneReviews chapter NBK195853 via a generated URL cache,
    its PMID:24741715 abstract, and the 2025 hearing cohort PMID:40714654 abstract. The canine
    full text PMID:39596578 received an independent delegated source audit. The full GeneReviews
    care and genetic sections were read, not only its summary.


    Corrected deterministic null/hypomorphic genotype predictions, claims of obligatory aciduria
    or early death, an unsupported cochlear localization, and an asserted contradiction between
    contact-site and outer-membrane localization. Split bundled lipid, calcium, serine, nucleotide
    and mtDNA findings into 15 atomic mechanisms. Removed a cholesterol-to-bioenergetic edge
    supported only by shared SERAC1 dependence and qualified unproven causal connections.
    Distinguish measured protein/RNA effects from predictions, including the uncertain p.Met499Val
    allele and the p.Arg411Cys VUS in the adult dystonia/DBS reports. Normal filipin, respiratory-chain
    and mtDNA findings do not exclude disease. The LPGAT1 model is a parallel experimental
    pathway model and does not establish an additional human MEGDEL gene.


    Replaced case-report frequency guesses with feature-specific numerators and denominators
    from the 67-person retrospective cohort. Kept combined feeding/failure-to-thrive and dyskinesia/dysphagia/drooling
    counts from becoming separate feature rates. Added feeding, swallowing, salivary, hepatic,
    renal, respiratory and visual findings, absent speech, hyperlactatemia distinct from acidosis,
    inability to walk and human cerebellar atrophy. Recorded internal source discrepancies:
    liver failure is nine of 30 severe hepatic cases in the narrative versus 15/65 in Table
    1; absent speech is 34/61 in the narrative versus 34/59 in the table; basal-ganglia involvement
    is described in 55 available scans versus 55/56 in Table 1; the narrative''s 78% for 26/38
    unable to walk is an arithmetic error (approximately 68%). Peer review independently checked
    the clinical frequency and care sections. Frequency bands retain ascertainment and age
    limitations.


    Expanded supportive care with baclofen response variability, selected-case DBS outcomes,
    physical and occupational therapy, communication support, seizure management and valproate
    avoidance, drooling management and surveillance. The hearing cohort limits expected language
    benefit from implants; neither anatomy nor improved speech can be assumed. Neonatal dialysis/protein-withholding
    and dexmedetomidine anaesthesia remain case-specific experience. Wider mitochondrial/myopathy
    precautions are explicitly background extrapolations. Nucleoside rescue remains preclinical.
    A bounded current trial search found no directly SERAC1-specific intervention record suitable
    for inclusion; general mitochondrial/depletion studies were not represented as MEGDEL
    trials.


    Corrected animal-model claims: canine hearing and cognition were unassessed, liver/organic-acid
    phenotyping was not reported, neuronal loss was prior postmortem pathology rather than
    new counts, and cerebellar involvement is not excluded in humans. The mouse abstract does
    not establish all human lipid, anatomical or treatment outcomes. Differentiated genetic
    lifetime-risk modeling from observed point prevalence and removed a geographic over-representation
    claim inferred from selected case reports.


    All reference caches were generated with just fetch-reference; none were hand-edited.
    The previously reviewed tracked modern PMC HTML adapter was cherry-picked as a separate
    reproducibility commit (0f7e99bac2c, equivalent to 21023a155b7), and affected HTML caches
    were regenerated after the shared upstream dependency was restored to its pristine implementation.
    PMID:24997715 used the unmodified OpenAlex fallback to actual NCBI article HTML; PMID:40821445
    and 33426169 used canonical PMC URLs through the tracked adapter. Generated cache whitespace
    was normalized by repository pre-commit hooks; no manual cleanup was performed. No frozen
    dataset-accession cache was read, changed, or staged.


    Validation: authoritative just validate-disorders passed schema, live terms and 179/179
    exact snippets. Focused PMC adapter/reference-patch tests passed (39 tests). Scoped graph,
    entity, qualifier, coarse-binding, source-defect, snippet-boundary and GeneReviews checks
    passed. Repository-wide checks passed for reference-cache frontmatter, term-cache integrity,
    cache order, case collisions, folded hyphens, snippet length, title-only snippets, reference
    titles, snippet grading, empty snippets and environmental evidence. History schema validation
    passed. The final diff passes git diff --check after repository pre-commit formatting.

    '

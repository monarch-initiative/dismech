  summary: 'Review round 2: reference_title backfill, GO rebindings, diagnosis and
    differentials'
  details: |
    Answered the CHANGES_REQUESTED review on PR #10453 in a single push. Backfilled reference_title on all 142 evidence items; the values are derived programmatically from each reference cache's frontmatter rather than typed, after three hand-written titles failed validation in this same session - the cache is the single source of truth for a title and there is no reason to retype one. Rebound four GO terms that had been adopted verbatim from the deep-research report's suggestion block and named broader or different processes than the claims they carried: GO:0006655 phosphatidylglycerol biosynthetic process became GO:0036148 phosphatidylglycerol acyl-chain remodeling, since the entry's own description says the pool is re-proportioned rather than reduced; GO:0008203 cholesterol metabolic process became GO:0032367 intracellular cholesterol transport; GO:0007005 mitochondrion organization, which was serving as both mitochondrion organization at one node and mitochondrial DNA maintenance at another so that one CURIE denoted two concepts in one file, became GO:0032042 mitochondrial DNA metabolic process at the mtDNA node with a separate GO:0006730 one-carbon metabolic process binding for the serine-import half; and GO:0032048 cardiolipin metabolic process was narrowed to GO:0035965 cardiolipin acyl-chain remodeling. GO:0000002, suggested in review for the mtDNA node, was checked against GO and is obsolete, so it was not used. Added a diagnosis section with four records - urine organic acid analysis, brain MRI pattern recognition, fibroblast phosphatidylglycerol and filipin profiling, and SERAC1 sequencing with copy-number analysis - and a differential_diagnoses section covering primary AUH deficiency, the other secondary 3-methylglutaconic acidurias, and HTRA2 defect. Expanded the variant spectrum from four alleles to eight, adding p.Trp460*, the rs797045105 insertion, c.1404-2A>G and the juvenile complicated-HSP splice allele with its graded lipid phenotype. Added two treatments backed by cached quotes: nutritional and feeding support, and perioperative risk management carrying the succinylcholine contraindication, the continuous-propofol restriction and the shortened preoperative fast. Declined to add rehabilitation, physiotherapy, dystonia and spasticity agents, valproate hepatotoxicity and aminoglycoside ototoxicity: the research report asserts all of them but no sentence in any of the 22 cached sources states them, and the reason is recorded in the entry notes. Validation: schema, terms and references clean with 142/142 snippets verified, up from 123/123; all offline gates green.

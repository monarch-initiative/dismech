  summary: 'Create: MEGDEL / MEGD(H)EL syndrome (SERAC1)'
  details: |
    Curated MEGDEL / MEGD(H)EL syndrome from an OpenScientist deep-research report plus 22 fetched PubMed abstracts. Built an 11-node pathograph from biallelic SERAC1 loss of function through absent or mislocalized protein at the ER-mitochondria contact site, impaired phosphatidylglycerol remodeling, and three parallel branches (altered cardiolipin subspecies, BMP depletion with free cholesterol accumulation, mitochondrial network fragmentation with deficient calcium transfer) converging on respiratory chain deficiency and bioenergetic failure, then tissue-selective damage to basal ganglia, cochlea and liver. Recorded the competing outer-mitochondrial-membrane / SFXN1 serine transport model as an explicit mechanistic_hypotheses group with its own pathophysiology node and an open KNOWLEDGE_GAP discussion, since the two models assign SERAC1 different subcellular locations and different candidate therapies. Curated three severity bands as subtypes rather than separate entries. Included two REFUTE evidence items where the literature genuinely contradicts a general claim (normal muscle respiratory chain and normal lactate in a confirmed patient; a confirmed patient without deafness). Added the Serac1-/- mouse and the naturally occurring canine SERAC1 disorder as animal models, the latter PARTIALLY_RECAPITULATES with a HUMAN_MODEL_MISMATCH discussion because deafness, hepatopathy and organic aciduria are undocumented in the dogs while cerebellar and nigral involvement is extra. Corrected four errors in the deep-research report, recorded in the entry notes: a quote misattributed to PMID:35943861 that is actually in PMID:23918762; a claim that no Serac1 knockout mouse existed when PMID:35235340, cited by the same report, describes one; NCIT:C15277 offered for Supportive Care, which is Mastectomy; and HP:0002518 offered for Leigh-like basal ganglia lesions, which is Abnormal periventricular white matter morphology. Did not bind a cochlear hair-cell type - the report's CL:0000598 is pyramidal neuron, and no study localizes the auditory lesion in this disease. Validation: linkml-validate, linkml-term-validator and linkml-reference-validator all pass with 123/123 snippets verified against the local reference cache; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms (offline and online), check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean.

  details: |
    New entry for RAB28-related retinopathy (MONDO:0100448) from one OpenScientist deep-research report (research/RAB28-Related_Retinopathy-deep-research-openscientist.md; 12/12 citations verified). preflight-dr flagged that the report gives HGNC:9764 (RAB22A) for RAB28; the entry binds hgnc:9768 from the ClinGen Definitive assertion. Claims were re-sourced from cached abstracts or PMC full text of PMID:23746546, 25356532, 33396523, 32084271, 42231409, 30228185, 32258030 and 35471581. Cone-rod dystrophy 18 (MONDO:0014153), the only MONDO descendant, is recorded as a synonym and a skos:narrowMatch mapping rather than a subtype. Validated with just validate (schema, terms, 40 snippets) and the offline pre-PR gates.

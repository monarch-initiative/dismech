  summary: 'Create: TTLL5-Related_Retinopathy'
  details: |
    Created the entry for TTLL5-related retinopathy (MONDO:1040038) from claim issue #16890. Falcon deep research could not run (no usable Edison key; host blocked), so OpenScientist was used instead (research/TTLL5-Related_Retinopathy-deep-research-openscientist.md; 10/10 references resolved, preflight-dr PASS). The entry was drafted from 13 PubMed records fetched directly (discovery study PMID:24791901, the RPGR glutamylation mechanism paper PMID:27162334, the RPGR-TTLL5 structure PMID:41941273, the male fertility series PMID:28173158, the Stamp mouse PMID:23558686, case series and the 21-patient cohort PMID:41933583) plus the ClinGen Definitive assertion. The pathograph runs TTLL5 loss -> loss of RPGR-ORF15 glutamylation -> connecting-cilium trafficking defect with cone opsin mislocalization -> cone-predominant photoreceptor degeneration, with a sperm axonemal polyglutamylation branch. The OpenScientist report added PMID:42315353, cited on the cone-rod dystrophy and OCT rows. Its other report-only citations were not used: PMID:35119454 names TTLL5 only as a very rare gene, which is not a prevalence figure, and the rest concern other genes. Its suggested GO:0120197 is mucociliary clearance, not the outer-segment term the report names, and was not bound. Validation: count-verified-snippets all verified, validate-terms passed, check-genereviews NO_CHAPTER, entity refs, causal targets, enum values, duplicate keys, coarse phenotypes and logical rules all OK.

  summary: 'Review round: correct DBD domain claim, re-anchor p.Phe110Leu genetic
    evidence'
  details: |
    Addressed the blocking review on PR #9765.

    CRITICAL (factual inversion). The genetic notes said "Additional missense variants outside the canonical DBD have been reported, including p.Phe110Leu". This is backwards. Chen et al. 2016 (PMID:26986877), already cited in this entry and whose full text is cached here, states "confirmed that one nonframeshifting indel within the DBD (individual 8, p.Phe110del) also reduced reporter activity" - the same residue - and separately describes only p.Ala155Thr as "located outside of, but adjacent to, the DBD". Residue 110 is therefore inside the DBD. PMID:42606787 makes no domain claim at all, so the sentence was both unsourced and inverted. It also read as a counterexample to the preceding DBD-severity correlation when the case is in fact consistent with it. The notes now state that residue 110 lies within the DBD, cite the p.Phe110del characterization and the p.Ala155Thr exception, and say the variant is consistent with the correlation rather than an exception. A new PMID:26986877 evidence item carries that placement.

    IMPORTANT (claim-evidence mismatch). The PMID:42606787 genetic evidence item quoted the PATIENT PRESENTATION sentence (clinical features only) while its explanation asserted de novo status, the c.330C>A/p.Phe110Leu change, and the ACMG likely-pathogenic classification - none of which appear in that quote. Split into three items anchored on the sentences that carry each claim: METHODS AND RESULTS for the variant identification, the segregation sentence for de novo status, and CONCLUSION for the ACMG classification. The clinical snippet stays on the Seizures phenotype, where it was correctly placed.

    IMPORTANT. This history record, which the previous round lacked.

    Suggestions taken. The Seizures description generalized "severity ranges from occasional to drug-resistant" from a single case; it now states the n=1 observation and says the cohort distribution is unreported, and the evidence explanation says it is cited for occurrence rather than frequency. The same abstract sentence was added to Hearing impairment, which the proband had, cited for occurrence with the frequency band still resting on the cohort figure.

    Suggestion declined. The reviewer also suggested the sentence supports Thin corpus callosum. It does not: the abstract says "structural brain anomalies", which is not specific to callosal thinning. Adding it would reintroduce the exact claim-evidence mismatch fixed above.

    Validation: just validate passes (schema, terms, references); snippets 97/102 verified against cached references, 5 skipped by url: prefix. check-duplicate-keys and check-entity-refs clean.

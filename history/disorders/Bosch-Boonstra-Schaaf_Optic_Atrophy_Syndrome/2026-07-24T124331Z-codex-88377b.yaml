  summary: 'Review: Bosch-Boonstra-Schaaf optic atrophy syndrome'
  details: |
    Re-reviewed BBSOAS from cached human cohort, GeneReviews, Orphadata, functional, model-system, and GEO sources. Expanded the entry to distinguish established NR2F1 functional insufficiency from variant-specific dominant-negative effects and retained the neuronal mitochondrial network as a provisional mouse-supported branch. Rebuilt the pathograph as 25 evidence-graded nodes and 25 causal edges; every edge has explicit directness and evidence, all 14 phenotypes and the causal NR2F1 gene are connected, and graph integrity reports no orphan targets. Added dual-source prevalence estimates without forcing reconciliation, three natural-history phases, high but variable burden, molecular and clinical diagnosis, two represented source-named differentials, seven evidence-backed management actions, three animal models, and four open discussions. Added GSE106302 and GSE228566 and recorded that current official ClinicalTrials.gov searches returned no studies. Generated eight new reference caches only through just fetch-reference. Focused schema and ontology-term validation passed, all 84 evidence snippets matched 16 cached sources exactly, compliance was 207 of 207, targeted CX2 and Koza KGX exports passed, scoped pre-commit hooks passed, and a fully paginated scan of 30 open PRs and 4,408 file entries found no overlap.

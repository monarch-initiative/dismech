  summary: 'Create: TOPORS-Related_Retinopathy'
  details: |
    New entry for TOPORS-related retinopathy (MONDO:0700233), the autosomal dominant retinitis pigmentosa caused by heterozygous TOPORS variants (RP31). Built from primary literature found by PubMed and Europe PMC searches and from the ClinGen gene-disease validity record (CGGV assertion 8d71be46, Definitive, AD, Retina GCEP, 2023), which is copied into genetic.gene_disease_validity. The OpenScientist deep-research report (research/TOPORS-Related_Retinopathy-deep-research-openscientist.md) was read and checked after the first draft. Its reference validation resolved 24 of 24 citations, with one flagged off topic (PMID:18356260, depression and quality of life in RP, not used); its term validation had no unresolved CURIEs but five mislabelled ones (HP:0007894, GO:0120289 which is obsolete, UBERON:0001789, MONDO:0009299, HP:0000512 as a label variant), none of which is bound here; RPE atrophy is bound to HP:0007722, which is the correct term for the report's wrongly numbered suggestion. just preflight-dr returned PASS (TOPORS named 89 times). The report agreed with the draft on mechanism and phenotype; it added two onset citations (PMID:16189705, PMID:42627262), now on the rod-cone dystrophy phenotype. Its RP-wide progression, quality-of-life and cataract-surgery citations are not TOPORS-specific and were not used; its claim that onset is adult was not adopted because the RP31 index family had early onset.

    Scope. No recessive TOPORS retinopathy or TOPORS cone-rod dystrophy was found in PubMed or Europe PMC, and the ClinGen summary states TOPORS variants are only known to cause adRP, so no has_subtypes were created. The reported biallelic TOPORS disease (homozygous p.Pro10Gln, oral-facial-digital and Joubert syndrome, PMID:34132027 and PMID:37227088) is a syndromic ciliopathy carried by the Joubert_syndrome entry. RP31 (MONDO:0012367), the single MONDO child of the disease term, is recorded as a skos:narrowMatch mapping.

    Mechanism. Causal chain from the heterozygous last-exon variant to loss of TOPORS ubiquitin/SUMO ligase function at the photoreceptor basal body (PMID:21159800, PMID:26872363), connecting cilium and outer segment defect (zebrafish morphant, PMID:21159800), rod degeneration and secondary cone loss, wired to night blindness, field constriction, ERG abnormality and reduced acuity. Haploinsufficiency (PMID:17924349, ClinGen) and a dominant-negative effect (PMID:35579903, inferred from the 807-867 truncation cluster) are recorded as competing mechanistic_hypotheses; functional_impact_category is deliberately unset.

    Phenotypes include the perivascular RPE atrophy cuff (PMID:17924349) with the observation that it is absent in families examined later (PMID:18509552), the pericentral form (PMID:19183411), and fundus, macular and lens findings from a 2024 case series (PMID:38592336). Case fractions: about 1 percent of a US adRP cohort (PMID:18509552) and 12.5 percent of solved French Canadian families (PMID:26720483).

    GeneReviews: no TOPORS-specific chapter; just check-genereviews --online reported the Nonsyndromic Retinitis Pigmentosa Overview (PMID:20301590) as a gene-scoped candidate, now tagged in references. Validation: just validate, count-verified-snippets (all snippets verified), validate-terms and the offline whole-repo gates were run on the final file.

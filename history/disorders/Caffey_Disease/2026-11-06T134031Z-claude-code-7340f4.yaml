  details: |
    New entry for Caffey disease (infantile cortical hyperostosis, MONDO:0007244), COL1A1. Deep research: one Perplexity report (research/Caffey_Disease-deep-research-perplexity.md). Its body stops partway through section 9 (inheritance), so it has no diagnosis, prognosis, treatment or model-organism sections, and it cites by URL only (7 resolved references, no PMIDs in the body). Its term-validation block lists 10 mislabelled CURIEs and 1 unresolved (HP:0003389); none of the report's CURIEs were copied. preflight-dr returned WARN because IFITM5 is mentioned 16 times; those passages are about COL1A1-negative lethal prenatal cortical hyperostosis attributed to a Medscape page, and IFITM5 was left out of the entry. Report URLs were resolved to PMIDs (24389367, 15864344, 18553566, 19203363, 41479472, 40620547); PMID:25478424 had no cached content and was not used. Phenotype baseline is the GeneReviews chapter (PMID:22855962), tagged; StatPearls (PMID:30422473) tagged and cited only for site frequencies. Primary papers came from the ClinGen CGGV record's PMID list (15864348, 17309652, 18704262, 21249479, 21567126, 24390061, 34272483) plus PubMed searches for the prostaglandin E1 phenocopy (3769947, 26423344), NSAID and steroid treatment (29090879, 11468051) and adolescent recurrence (23389580). ClinGen Definitive (AD) copied from CGGV:assertion_21b43a7b. The COX-2/PGE step is marked hypothesised with INDIRECT edges and an open KNOWLEDGE_GAP discussion. No prevalence recorded (no sourced figure). COL1A1 node carries GO:0030020 (ABNORMAL) after check-gene-activity-grounding flagged the gene as ungrounded. Validation: just validate, validate-terms, count-verified-snippets (77/77), the offline whole-repo gates, check-snippet-grading and validate-disorders all pass.

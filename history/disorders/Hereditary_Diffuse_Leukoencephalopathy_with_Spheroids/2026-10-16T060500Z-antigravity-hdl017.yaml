events:
- type: REVIEW
  outcome: changed
  summary: Thorough completeness review and enhancement of Hereditary_Diffuse_Leukoencephalopathy_with_Spheroids.
  details: Added Harrison's classification, top-level inheritance entries with incomplete age-dependent
    penetrance and variable expressivity, structured prevalence and progression records, diagnostic criteria
    (CSF1R molecular genetic testing and brain MRI/CT neuroimaging), biochemical readouts (impaired CSF1R
    autophosphorylation, elevated brain GFAP and CCL2/MCP-1, and white-matter MR spectroscopy N-acetylaspartate
    and choline changes), differential diagnoses (AARS2-related leukoencephalopathy, AARS1-related Swedish-type
    HDLS, frontotemporal dementia, multiple sclerosis, corticobasal syndrome, and BANDDOS), expanded the
    pathophysiology causal graph into 8 distinct nodes (Impaired Microglial CSF1R Signaling, Microglial
    Dyshomeostasis and Depletion, Elevated Cerebral CSF2 Signaling, Microglial Oxidative Stress, Primary
    Axonal Degeneration and Spheroid Formation, Secondary Demyelination and White Matter Atrophy, Reactive
    Astrocytosis, and Periventricular Dystrophic Calcification) wired to all 12 phenotypes (including
    diffusion-restricted white matter lesions on brain MRI), and linked established treatments to their
    target mechanisms while documenting the terminated Phase 2 IGNITE study of iluzanebart (NCT05677659).

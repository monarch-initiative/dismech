events:
  - type: REVIEW
    outcome: changed
    summary: Thorough completeness review and enhancement of Hereditary_Diffuse_Leukoencephalopathy_with_Spheroids.
    details: >-
      Added Harrison's and mechanistic classifications, top-level inheritance
      entries with incomplete age-dependent penetrance and variable expressivity,
      structured prevalence and progression records, biochemical readouts
      (impaired CSF1R autophosphorylation, elevated brain GFAP and CCL2/MCP-1,
      and white-matter MR spectroscopy N-acetylaspartate and choline changes),
      differential diagnoses (AARS2-related leukoencephalopathy, AARS1-related
      Swedish-type HDLS, frontotemporal dementia, multiple sclerosis,
      corticobasal syndrome, and BANDDOS), expanded the pathophysiology causal
      graph from the CSF1R landing node through microglial dyshomeostasis,
      CSF2-driven oxidative stress, primary axonal degeneration, secondary
      demyelination, and periventricular calcification to all 11 phenotypes, and
      linked treatments to their target mechanisms.

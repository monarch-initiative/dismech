  summary: 'Create: Inflammatory_Skin_And_Bowel_Disease_Neonatal_1'
  details: |
    Created the NISBD1 (ADAM17 deficiency, MONDO:0013693) entry from primary literature: the founding NEJM family (PMID:22010916), the Armenian c.308dupA family (PMID:25804906), the exon 1 deletion patient (PMID:26683521), the functionally confirmed compound heterozygous missense family (PMID:33953303, full text), and the 2022 and 2026 case reports (PMID:34993966, PMID:40968583, PMID:42015567). Mechanism nodes (ADAM17 loss, failed ectodomain shedding, reduced epithelial EGFR signalling, barrier failure, cutaneous dysbiosis, hair follicle niche failure, defective intestinal regeneration, cytokine dysregulation and impaired antibacterial defence) rest on patient cell assays and Adam17 mouse models (PMID:9812885, PMID:20603312, PMID:22565824, PMID:27089454, PMID:25902485, PMID:22696231, PMID:27077118). NISBD2 (MONDO:0014481) is added as a differential with the EGFR discovery paper (PMID:24691054); the sibling entry was not edited. An OpenScientist deep-research report was generated and used to check coverage and pick up the hair follicle niche (PMID:22696231) and colonic ADAM17-EGFR (PMID:27077118) papers. Its reference validation resolved 18 of 18 references with none off topic; its term validation set needs_review because seven CURIEs carried wrong labels (for example NCIT:C1130 offered as budesonide is Hydroxyl Radical, NCIT:C15190 offered as Nutritional Support is Needle Biopsy); none of those CURIEs was used, every term here was looked up in the term caches or OLS. just preflight-dr could not run because the local mondo.db is absent; the report was read and is about ADAM17 and MONDO:0013693 throughout. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). HPO has no collodion membrane term, so that finding is in the description only. No ClinGen validity assertion exists for ADAM17 and this disease. Cardiac, renal, hepatic and prenatal phenotypes are left without causal edges because no source explains them; a KNOWLEDGE_GAP discussion records the cardiac and blood pressure question. Validation: just validate, validate-terms, count-verified-snippets (138/138), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-grading and validate-disorders all passed.

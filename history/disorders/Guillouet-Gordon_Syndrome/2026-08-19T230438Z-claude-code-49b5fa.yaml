  summary: Create standalone Guillouet-Gordon Syndrome (MED16) entry
  details: |
    Created a standalone Guillouet-Gordon Syndrome (GGNS, MED16-related) entry as part of the MEDopathy spectrum expansion, alongside the Mediator_Complex_Neurodevelopmental_Disorder grouping entry.

    Content: description, classifications, prevalence, pathophysiology, phenotypes, genetic section, and treatments. 15 PMID-backed evidence items.

    Known follow-up from the PR #8832 review (item 1): frequency bands on several phenotypes were derived from a single undifferentiated cohort snippet describing features as constant, which does not support split FREQUENT/OCCASIONAL bands. Per docs/frequency-evidence-guidelines.md the unsupported bands should be replaced with quantitative per-band evidence or omitted; that pass is left for the entry author.

    This record replaces a zero-byte history file committed earlier in the same PR (reviewer item 7); it documents the same curation session, rewritten with real content.

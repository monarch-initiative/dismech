  summary: Link cadmium exposure routes and iron-deficiency modifier into the pathograph
  details: |
    Backfill for issue #8085. All four environmental entries target the cadmium absorption and systemic distribution node. Occupational exposure, environmental contamination and tobacco smoke are TRIGGERS/DIRECT: each is a genuine route by which cadmium enters the body, inhalational for the first and third and dietary for the second. Iron deficiency is EXACERBATES/DIRECT instead, because low iron stores upregulate the shared divalent metal transporter DMT1 so that more of an identical dietary intake is absorbed; it amplifies absorption without supplying cadmium, which is the distinction between a modifier and a route. The cited sentence for that link uses the word exacerbate directly. Noted for review: the tobacco smoke link is the thinnest evidence in this batch, since the available sentence establishes smoking as a recognized risk factor rather than measuring absorbed dose, and the explanation says so explicitly rather than overclaiming. Validated with just validate, just validate-terms and just validate-references (107/116, 9 pre-existing DOI-prefix skips); zero integrity issues.

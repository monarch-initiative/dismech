  details: |
    Augmentation of the existing Cadmium_Poisoning entry (it already existed on
    origin/main; the duplicate preflight found the file plus four prior history
    records, so this session ran as an EDIT, not a CREATE).

    Deep research: `just research-disorder claude_code Cadmium_Poisoning`
    (provider requested by the user). Report at
    research/Cadmium_Poisoning-deep-research-claude_code.md - 14 web searches,
    16 turns, 55 citations, ~$1.43. The provider emitted no frontmatter
    reference_validation block, so a `## Reference Validation` section was added
    retroactively with `just validate-research-reference`: 32/32 identifiers
    resolved, 0 unresolved, 1 flagged off topic (PMID:22437713, "A
    two-dimensional polymer prepared by organic synthesis" - the report had
    attached it to the Fujishiro ZIP8/ZIP14/DMT1 transporter claim). That PMID
    was NOT cited; the real Fujishiro paper was located independently via PubMed
    esearch and is cited as PMID:22534978. The prior falcon report
    (research/Cadmium_Poisoning-deep-research-falcon.md) was also read.

    NEC preflight: `just preflight-dr ... MONDO:0043523` returned SKIP, correctly
    - MONDO records no RO:0004003 causal gene for an environmental toxicosis.
    Manual fallback done instead: the report's top gene mentions (SLC39A8,
    TRPV6, TRPM7, SLC11A2, SLC39A14) are all cadmium transporters, consistent
    with the intended entity, and "cadmium poisoning" carries no eponym,
    numbered-series, or acronym ambiguity. GeneReviews step skipped as
    out of scope: this is an acquired environmental toxicosis, not Mendelian.

    What was added:

    1. Carcinogenesis arm - the single largest content gap. Cadmium is an IARC
       Group 1 human carcinogen and the entry had no carcinogenesis node,
       phenotype, or classification at all (the word "cancer" appeared only
       inside an unrelated external_assertion snippet). Added two
       pathophysiology nodes - "Zinc-Finger Displacement and DNA Repair
       Inhibition" (MOLECULAR; GO:0008270 ABNORMAL, GO:0006281 DECREASED) and
       "Cadmium-Associated Carcinogenesis" (ORGANISM) - plus an Oncologic
       phenotype "Cadmium-Associated Malignancy" bound to HP:0100526. Site
       attribution is deliberately non-uniform and bounded by a PARTIAL evidence
       item on each of the node and the phenotype: PMID:38480109 supports lung,
       pancreas and bladder but calls breast and prostate weak or inconclusive,
       and PMID:12746140 records that the prostate association was not confirmed
       on cohort update. `frequency:` was omitted on the phenotype because the
       underlying evidence is exposure-response association across heterogeneous
       cohorts, not a per-patient manifestation rate.

    2. Module conformance - the entry previously declared none.
       - "Zinc-Finger Displacement and DNA Repair Inhibition" ->
         genome_instability_mutation#Failure of DNA Damage Surveillance and
         Repair. Precedent checked: Formaldehyde_Poisoning, the closest existing
         Group 1 chemical-toxicant entry, conforms its repair-saturation node to
         the identical target.
       - "Renal Phosphate Wasting" ->
         defective_skeletal_mineralization#Phosphopenic Substrate Deficiency.
         The module explicitly names Fanconi syndrome among its phosphopenic
         substitutions, and cadmium causes acquired Fanconi syndrome.
       - "Defective Bone Mineralization" ->
         defective_skeletal_mineralization#Impaired Hydroxyapatite Deposition at
         the Mineralization Front (the module's central effector). This is the
         same arm+effector pattern X-Linked_Hypophosphatemia uses.
         A `notes:` on the phosphate-wasting node records the one honest caveat:
         the module separates its arms partly on PTH being normal in the
         phosphopenic arm, and that discriminator degrades in cadmium poisoning
         once tubular injury has progressed to CKD with secondary
         hyperparathyroidism. The conformance is asserted on the mechanism, not
         the PTH profile.

    3. `genetic:` block (the entry had none). Five toxicokinetic modifiers, each
       typed SUSCEPTIBILITY or MODIFIER rather than CAUSATIVE, with a note
       stating that an acquired toxic disorder has no causal gene: SLC39A8/ZIP8
       (hgnc:20862), SLC39A14/ZIP14 (hgnc:20858), SLC11A2/DMT1 (hgnc:10908),
       MT1A (hgnc:7393), MT2A (hgnc:7406). All five HGNC IDs were verified with
       OAK; note the deep-research report gave MT2A as hgnc:7407, which is wrong
       - the correct ID is hgnc:7406. The ZIP8 A391T evidence is marked PARTIAL
       because the cited study measured blood pressure and insulin resistance,
       not cadmium handling, so the susceptibility link is inferred from the
       transporter's role rather than measured.

    4. Occupational and exposure classifications (the entry had no
       `classifications:` block and no `exposure_classifications:`). Added
       harrisons_chapter POISONING_ENVENOMATION + ENVIRONMENTAL_EXPOSURES;
       ilo_agent_category `cadmium` (ILO item 1.1.2) and `cancer_cadmium` (item
       3.1.17), with a note explaining that the two coexist because the ILO
       list keeps occupational cancers in a separate section from the
       organ-system items; eu_occupational_category `cadmium_compounds` (EU
       Annex I item 105). Note these went on `ilo_agent_category`, not
       `ilo_disease_category` - the latter is bound to the section-2
       target-organ-system enum and rejects chemical-agent values.
       Per-exposure `exposure_classifications:` were added to both environmental
       entries: CHEMICAL agent; INHALATION/CHRONIC+ACUTE and
       SPECIFIC_EXTERNAL for the occupational route, ORAL/LIFETIME and
       GENERAL_EXTERNAL for the dietary route; IARC GROUP_1 with its own
       evidence item on both; GHS CARCINOGENICITY and STOT_REPEATED_EXPOSURE.

    New references cited, all fetched with `just fetch-reference` and all
    snippets confirmed as exact substrings of the cached abstracts before
    commit: PMID:38480109, PMID:16310985, PMID:38922068, PMID:12746140,
    PMID:22534978, PMID:35784893, PMID:19834257.

    Validation actually run and read (not merely invoked):
      - `just validate kb/disorders/Cadmium_Poisoning.yaml` - passed (schema,
        terms, references). One schema failure was hit and fixed en route: the
        ILO chemical-agent values had first been placed on ilo_disease_category.
      - `just validate-terms` - passed.
      - `just count-verified-snippets` - 133/142 verified, 9 skipped by prefix
        (DOI/dataset prefixes in `skip_prefixes`); 0 unverified.
      - `just validate-disorders kb/disorders/Cadmium_Poisoning.yaml` - the
        batched pre-PR sweep CI runs; passed.
      - All five ungated CI gates run over the whole KB and passed with no new
        findings: check-folded-hyphens, check-snippet-length,
        check-title-snippets, check-environmental-evidence,
        check-duplicate-keys.
      - `just check-not4curation` - no bound term carries a do-not-annotate
        marker.
      - `pytest tests/test_data.py` - full suite.

    Compliance moved 90.4% -> 87.3%. This is a denominator effect from adding
    content, not a regression: the residual gap is dominated by
    `pathophysiology[].downstream[].evidence`, which was already 0/22 on the
    pre-existing edges, plus `datasets[].evidence`. Evidence was added to the
    two new causal edges and to the new IARC/GHS classification assignments.

    Known gaps deliberately left for a later session: the cardiovascular
    (hypertension) and neurocognitive (depression, cognitive impairment) arms
    the deep-research report describes are not curated here; both rest largely
    on cross-sectional NHANES associations and warrant their own evidence pass.

    Post-review fix (same session, before any reviewer verdict landed): the PR
    reviewer flagged a pathograph connectivity issue and a local check confirmed
    two orphan nodes - nodes with no incoming causal edge, so they render
    detached from the graph.

    - "Zinc-Finger Displacement and DNA Repair Inhibition", added by this
      session, had outgoing edges but nothing pointing at it. Connected it as a
      downstream target of "Cadmium Absorption and Systemic Distribution" with
      its own edge evidence (PMID:38922068), which is the correct parent: the
      genotoxic arm begins when distributed cadmium enters cells as free Cd(2+)
      and competes for structural zinc.
    - "Acute Pulmonary Injury" was a PRE-EXISTING orphan, confirmed by
      re-deriving the orphan set from `git show origin/main:...`. Fixed in the
      same pass because it is a one-link change directly adjacent to this work:
      added an `influences_mechanisms` link from the Occupational Cadmium
      Exposure entry with `environmental_effect: TRIGGERS` and its own evidence
      (PMID:16933734). The exposure entry is the right parent rather than a
      pathophysiology node, because acute fume injury acts at the portal of
      entry and does not require the systemic accumulation that drives the
      chronic renal and skeletal arms.

    After the fix the entry has zero orphan pathophysiology nodes and zero
    dangling `downstream` targets. Re-validated: `just validate` passed,
    `count-verified-snippets` 135/144 verified with 0 unverified, and all five
    ungated CI gates re-run clean.


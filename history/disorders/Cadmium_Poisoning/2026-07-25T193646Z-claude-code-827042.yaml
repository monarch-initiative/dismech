  details: |
    Claim-evidence correctness review (docs/reports/exposure-disorder-claim-evidence-review-2026-07-25.md).
    Weakest entry of ten exposure disorders reviewed. Fixes:
    (1) BAL contraindication was asserted with no supporting evidence; rewritten and sourced to PMID:6734559, keeping both directions of that rat study (renal Cd deposition increased at 30 min post-exposure, unchanged at 24 h after MT induction) and marking it PARTIAL / MODEL_ORGANISM rather than a human contraindication.
    (2) Removed PMID:19364190 (Altern Med Rev) entirely from the urinary-cadmium biochemical and diagnosis nodes; provoked/post-chelation urine metal testing is not accepted mainstream toxicology practice. Reanchored on PMID:20354761 and PMID:41000307.
    (3) Re-tagged 17 evidence_source values: reviews (PMID:20354761, 19106433, 41453694) to OTHER and cell-transport/analytical papers (PMID:20204475, 31704329) to IN_VITRO; all had been HUMAN_CLINICAL.
    (4) Direct Osteoblast Toxicity downgraded to PARTIAL, removed the unsupported osteoblast-differentiation DECREASED process assertion, rewrote the description to state the direct arm is not established, and added KNOWLEDGE_GAP gap_cadmium_direct_osteoblast_toxicity with two proposed experiments.
    (5) Removed five unevidenced quantitative claims (bioavailability percentages, 200 mcg/g cortex threshold, ~7 kDa, blood cadmium 5/50 mcg/L cut-offs, per-cigarette and smoker-ratio figures).
    (6) Relaxed three histopathology descriptions to what the sources document and downgraded the three generic multiple-organ-damage citations to PARTIAL.
    (7) Dropped 8 frequency bands with no quantitative support, including two VERY_FREQUENT bands resting on single case reports.
    (8) Corrected the hepatic glutathione node's direction-of-effect overreach and downgraded the mouse-only transaminase readout to PARTIAL.
    Validated: schema clean; all snippets verified as exact substrings of cached sources.

  summary: Review MED25 mechanisms, clinical spectrum, variants and models using cached
    full text
  details: |
    Reviewed the complete original entry and available cached source text, including the founding 2015 clinical table and co-immunoprecipitation figure, 2019 clinical reports, 2021 MRI figure, 2025 splice and epilepsy papers, and 2011/2022 model papers. Full articles could not be retrieved for every report; those claims are limited to the accessible abstract, figure/table, or explicitly identified secondary source. No disease-specific deep-research artifact was present. The Mediator umbrella report was read and its other-gene findings excluded. GeneReviews index search returned NO_CHAPTER (2026-09-10 snapshot).

    Phenotypes — adequate: expanded seven broad findings to 79 precisely bound findings, including specific ocular, palatal, cardiac, genitourinary, skeletal, brain, seizure and EEG phenotypes. The founding table details six of seven reported patients; no pooled frequency or universal manifestation inferred. Short table cells are quoted with their clinical table caption and row heading.
    Subtypes — adequate: no established MED25-specific subtype taxonomy or validated genotype-based subtypes identified. Other Mediator-gene disorders were not imported.
    Pathophysiology — adequate: allele-specific Mediator incorporation and splicing defects separated; direct variant assays distinguished from computational predictions. Added a provisional SOX9/palatal hypothesis with explicit model-to-human limits, four cell systems and two animal models with readouts and mechanism links. No shared neuronal transcription defect assumed for all alleles.
    Treatments/trials — adequate: direct levetiracetam/clonazepam case observations and secondary valproate/topiramate/oxcarbazepine exposures included without comparative efficacy claims. Mobility and communication supports represented. No MED23 ketogenic diet or untested COQ10 benefit imported. ClinicalTrials.gov site searches found no BVSYS-specific interventional trial; carpal-tunnel NCT07042542 and old CMT protocol NCT03124459 hits were unrelated.
    Genetics — adequate: 14 reported variants, recessive inheritance and parental segregation; uncertain classifications retained, Arg224Gly protein effects remain computational, Leu144Phe ACID localization not propagated. Ile173Thr shared-founder claim removed in accordance with the primary haplotype result. PNKP reassignment of the older MED25-CMT2B2 pedigree prevents an incorrect allelic neuropathy inference.
    Biomarkers/diagnostics — adequate: molecular testing, variant interpretation, EEG, MRI and eye assessment; normal scans/eye examinations do not exclude the disorder. COQ8A co-variation complicates assigning lactate/ataxia to MED25, so no MED25-specific biochemical marker inferred.
    References — adequate: consumed high-value primary papers and available full text, with exact quotations and explicit secondary-table evidence. Refreshed PMID30039206 also revalidated in its three other KB consumers. Reference cache files were generated with the repository fetch recipe, never hand-edited.
    Overall consumption — adequate: major source themes captured; no blocking omission identified. E-MTAB-537 was a Sox9-null/WT discovery dataset, not MED25 perturbation or a BVSYS cohort, and was excluded on that basis.

    Validation: final authoritative validate-disorders passed 258 snippets and 258 titles; strict cached-quotation audit passed 258/258. An earlier four-file batch including all refreshed-cache consumers passed 622 snippets and 631 titles. Dedicated term and repository content gates were run before commit; details are in the PR validation summary.

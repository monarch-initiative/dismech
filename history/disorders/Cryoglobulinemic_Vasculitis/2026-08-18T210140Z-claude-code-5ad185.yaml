  summary: Annotate HP:6000253 necrotizing vasculitis (grouping member)
  details: |
    Added a Histopathologic phenotype node bound to HP:6000253 "Necrotizing vasculitis" as part of creating the Necrotizing Vasculitides grouping (kb/groupings/Necrotizing_Vasculitides.yaml, issue #8754). Before this change no entry anywhere in the KB used HP:6000253, so the grouping's NECESSARY membership criterion had nothing to evaluate against and just check-groupings reported every listed member as a contradiction; annotating the defining lesion on each member is what makes the grouping auditable rather than aspirational. Every snippet is an exact quote from an abstract already cached by just fetch-reference. Validation actually run over this file: just count-verified-snippets (no unverified snippets) and the batched pre-PR sweep just validate-disorders across all eight edited entries, which passed schema, ontology-term and reference validation ("Files validated: 8 ... All validations passed", "Snippets checked: 386/401 verified against cached references (15 skipped by prefix)"). Evidence: PMID:33713282 (Fraticelli et al.) for both halves of the claim - that the leukocytoclastic lesion is defined by neutrophilic infiltration with fibrinoid necrosis of the vessel wall, and that cryoglobulinemic vasculitis is among the systemic diseases most frequently underlying it. Note on ontology: HPO makes HP:0034786 Leukocytoclastic vasculitis and HP:6000253 Necrotizing vasculitis siblings under HP:0034785 rather than parent and child, so the fibrinoid-necrosis component has to be asserted with its own term and its own evidence rather than inherited from a leukocytoclastic annotation.

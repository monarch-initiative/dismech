  summary: Address PR review feedback on complement C4 assay term, prevalence band/population,
    HCV exposure binding, and GO/link refinements
  details: |
    Replaced incorrect NCIT:C70617 (Total Complement Assay / CH50) binding on Serum complement C4 assay with NCIT:C80177 (Complement C4 Measurement). Updated prevalence_class from RARE to BAND_1_9_PER_100000 alongside rate_per_100000: 1.0, revised population to Not specified (essential mixed cryoglobulinemia), and trimmed unsupported epidemiology claims from prevalence notes. Refined Chronic hepatitis C virus infection exposure_term to species-level ECTO:3000284 (exposure to Hepacivirus hominis) with an ontology note, updated Classical complement activation and neutrophil recruitment to biological_scale CELLULAR while dropping redundant parent GO:0006956, refined Fc-receptor signaling to GO:0038094 (Fc-gamma receptor signaling pathway), and attached PMID:35348938 evidence directly to Cyclophosphamide target_mechanisms.

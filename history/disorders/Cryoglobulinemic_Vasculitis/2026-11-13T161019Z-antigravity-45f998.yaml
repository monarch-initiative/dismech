  summary: Review and enrich Cryoglobulinemic Vasculitis classifications, HCV etiology,
    necrotizing vasculitis module conformance, and StatPearls coverage
  details: |
    Added synonyms, Harrison's chapters (IMMUNE_RHEUMATOLOGIC, INFECTIOUS_DISEASES), structured prevalence (1 per 100,000 essential MC estimate with POPULATION denominator), chronic Hepatitis C virus environmental trigger (ECTO:3000001 exposure to virus, linked to B-cell clonal immune-complex production), StatPearls chapter PMID:32310505 tagged in references, full necrotizing_vasculitis module conformance chain (adding Classical complement activation and neutrophil recruitment and Intramural neutrophil Fc-receptor activation and cytotoxic degranulation while preserving protected pathograph node B-cell clonal immune-complex production and Necrotizing_Vasculitides grouping criteria), 100% phenotype causal connectivity (11/11), NCIT diagnosis bindings (NCIT:C217458, NCIT:C51692, NCIT:C70617), and therapeutic_modality plus target_mechanisms across all five treatments.

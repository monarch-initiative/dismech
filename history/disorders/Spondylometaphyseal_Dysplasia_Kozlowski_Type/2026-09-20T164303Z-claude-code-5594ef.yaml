  summary: 'Genetics pass: bind TRPV4 gene_term, wire it to both channel nodes'
  details: |
    Genetics pass for issue 12206. The genetic record was named TRPV4 Mutations and carried good evidence but no gene_term, so no gene edge was exportable at this entry's own disease term and gene-to-mechanism wiring was 0/1. Added gene_term hgnc:TRPV4 and relationship_type: CAUSATIVE, and added genes: descriptors to the two TRPV4 channel nodes, which previously carried the gene only inside genetic_context and so did not register as wired; now 1/1. Migrated both nodes from the legacy free-text functional_impact to functional_impact_category (GAIN_OF_FUNCTION and LOSS_OF_FUNCTION). Sourced two prose claims that were unsourced. The note said the R594H hotspot was found in the majority of genotyped SMDK patients; it now says 12 of 20 probands and cites the cohort sentence from PMID:20577006 that gives the denominator. The note's cytogenetic location 12q24.11 was briefly removed and then restored with a citation - PMID:39457470 was already in references_cache for another entry and states the TRPV4 locus - following the rule that an unsourced band is usually true but uncited and should be sourced rather than deleted. MONDO reconciliation: TRPV4 was present in the file but not in a gene_term, so it was invisible to the export; it is now present properly.

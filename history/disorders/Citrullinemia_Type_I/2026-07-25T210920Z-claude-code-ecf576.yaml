  summary: 'Address code review: machine-readable prevalence conflation, evidence_source,
    biological_scale, peripartum management'
  details: |
    Addresses the automated code review on PR #6992. All four blocking items were
    correct.

    Machine-readable conflation reintroduced (item 1) - the sharpest finding. The
    PR's whole thesis is that the all-UCD class rate must not be read as a CTLN1
    rate, and it then placed that class rate in CTLN1's prevalence block as
    rate_per_100000: 2.857 with the "NOT for CTLN1" caveat only in
    human-readable notes. Any consumer reading the structured field gets exactly
    the conflation the PR set out to fix. The record is removed from prevalence
    entirely and the context moved to disease-level notes, where it is explicitly
    labelled as kept out of the prevalence block for that reason.

    The reviewer also noted the consequence: the entry now has no CTLN1-specific
    prevalence record. That is stated plainly in the notes as a real gap rather
    than left implicit. The suggested fix - rebuilding ORPHA:247525 for an
    Orphanet epidemiology row - was tried and does not work: that record contains
    only synonyms, definition, cross-references and source, with no Epidemiology
    section. Recorded in the notes so the next curator does not repeat the
    attempt. The closest available figure remains the ASSD-plus-ASLD combined
    newborn-screening frequency, already present and labelled an upper bound.

    evidence_source on the severity-threshold items (item 2). Both PMID:31469252
    items were tagged IN_VITRO on the basis of the assay, but the quoted snippets
    are the human-outcome side - hyperammonemic events and cognitive function
    from UCDC and E-IMD registry data, and peak plasma ammonium and citrulline at
    presentation. Both retagged HUMAN_CLINICAL with the reasoning stated in the
    explanations. Took the reviewer's suggestion of splitting off a third item
    for the expression-system methods sentence, which is genuinely IN_VITRO, so
    the assay is still represented.

    biological_scale contradicted the node (item 3). The astrocyte
    glutamine-osmotic injury node carries cell_types: astrocyte, GO:0071470
    cellular response to osmotic stress and locations: brain, yet was tagged
    ORGANISM. Corrected to CELLULAR. The reviewer's further observation is worth
    recording: the ambiguity was itself the bundling signal CLAUDE.md describes,
    since the node spans an astrocyte-level mechanism and organism-level
    outcomes. Splitting it is a larger change than a review response should carry
    and is left for a future curation pass.

    Pregnancy management unmodelled (item 4). The PR promoted
    pregnancy/postpartum onset to a first-class subtype on the argument that it
    is the presentation most likely to be missed, then left the actionable half
    out. Added a Peripartum metabolic surveillance treatment quoting the
    GeneReviews pregnancy-management sentence, with a target_mechanisms edge to
    the impaired-ureagenesis node and hyperammonemia/encephalopathy as target
    phenotypes. The description makes the point the subtype implies: the risk
    window is predictable, so surveillance can be planned rather than depending
    on crisis recognition in an obstetric setting.

    Unsourced ordinal claim (suggestion). The notes opened "CTLN1 is the second
    most common urea cycle disorder" with nothing supporting the rank, and the
    PR removed the Spanish-registry prevalence record that had been its implicit
    basis. Reworded to the sourced claims - the Spanish registry names OTC and
    ASS1 deficiency as its two commonest defects, the UCDC study puts ASSD plus
    ASLD at about 30% of urea cycle disorders - and states that the rank varies
    by cohort and ascertainment, so no fixed ordinal is asserted.

    Validation. Schema, term and reference validation all pass.

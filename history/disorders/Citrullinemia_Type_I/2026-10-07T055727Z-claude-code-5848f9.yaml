  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding dried-blood-spot citrulline, LOINC:42892-0 Citrulline [Moles/volume] in DBS, as a measurement, with one reference range carrying the single-centre tandem mass spectrometry pilot (610,000 samples, 1999-2002) threshold of citrulline above 85.5 umol/L (PMID:12684898), banded half-open with the one-point inclusive/exclusive discrepancy stated in notes. Diagnosis-row evidence from PMID:35279366 (citrulline as the NBS target analyte for distal urea cycle disorders) and PMID:42481021 (German UCD NBS pilot). Added loinc_term LOINC:20640-9 Citrulline [Moles/volume] in Serum or Plasma on the biochemical Citrulline marker, which describes plasma citrulline. Citrulline ratio codes exist in LOINC but were not bound because no PubMed abstract found by the named query states a programme ratio cut-off for CTLN1. All LOINC codes and labels read from the Monarch KG via just loinc-seed-cache; cache/loinc/terms.csv rows committed. Part of dismech issue 13642, batch 3.

  summary: 'Review: fix all-UCD prevalence conflation, add four-form subtype structure
    and staged progression'
  details: |
    Review of the sixth-oldest unreviewed disorder entry (creation_date
    2025-06-12).

    Class-level prevalence recorded as disease prevalence (the principal
    finding). The single prevalence record had no population, no measure_type
    and no prevalence_class, and its only content was the Spanish registry's
    1:36,063 incidence of ALL urea cycle disorders together with the observation
    that OTC and ASS1 deficiency are the two commonest. That is a statement about
    the disease class, not about CTLN1, and reading it as a CTLN1 rate overstates
    the disorder substantially. (The same conflation was found and fixed in
    Carbamoyl_Phosphate_Synthetase_I_Deficiency during this same review sweep -
    it appears to be a systematic pattern across the urea-cycle entries, worth
    checking in the remaining ones.)

    Replaced with two evidenced, correctly-typed records built from the UCDC
    longitudinal study (PMID:25135652), whose full text was already in the
    reference cache but unused for epidemiology: a US newborn-screening birth
    frequency of 1 in 117,000 for ASSD and ASLD combined across over 6 million
    births in seven states - explicitly labelled an upper bound on CTLN1 because
    the two distal defects are reported jointly - and the class-level 1-in-35,000
    all-UCD figure retained as clearly-marked context, carrying the finding that
    ASSD and ASLD together are about 30% of urea cycle disorders so the class
    rate can be bounded rather than substituted.

    Missing subtype structure for a four-form disease. GeneReviews defines CTLN1
    as a spectrum of four presentations and the entry quoted that sentence
    verbatim in its progression notes, yet there was no has_subtypes block at
    all. Added all four: Acute neonatal (MONDO:0016600, ORPHA:247546), Late-onset
    (MONDO:0016601, ORPHA:247573), Pregnancy or postpartum onset, and
    Asymptomatic. The latter two have no MONDO class - the only MONDO descendants
    of citrullinemia type I are the acute neonatal and adult-onset forms - which
    is recorded in review_notes as an ontology gap with an explicit instruction
    not to substitute the adult-onset term, since it does not carry the pregnancy
    trigger.

    Two of these forms matter clinically and were previously buried in a prose
    paragraph:
    - The pregnancy/postpartum form is the presentation most likely to be missed.
      The patient has no metabolic history, and the differential in an obstetric
      setting rarely includes a urea cycle disorder. It is now a first-class
      subtype with its own progression phase, evidenced by a case report of a
      23-year-old who presented obtunded and required intubation four days
      postpartum before CTLN1 was recognised (PMID:36859323, fetched for this
      review).
    - The asymptomatic form is a genuine lifelong outcome, not a pre-symptomatic
      interval, and bears directly on newborn-screening interpretation: a
      positive screen does not by itself predict a symptomatic course. Stated
      explicitly.

    Progression rebuilt. Previously a single unnamed, unstaged phase whose notes
    mixed all four forms plus class-level registry mortality. Split into five
    subtype-scoped evidenced phases (the neonatal form gets two: the acute crisis
    and the post-crisis survival-with-deficits phase). This surfaced two
    GeneReviews statements the flat version had lost: survival of the neonatal
    form is "usually with significant neurologic deficits" rather than intact,
    and long-term complications including liver failure remain possible even on
    chronic protein restriction and scavenger therapy - i.e. standard treatment
    controls but does not abolish the disease.

    Quantitative severity threshold added. The genotype-phenotype node asserted
    only that "variants with less than 2% of wild-type activity typically produce
    classic neonatal presentations", supported by an in silico structural study
    and a dementia-cohort exome paper. Added the primary source for severity
    stratification (PMID:31469252): a biallelic expression system measuring
    residual ASS1 activity across 71 individuals and 48 variants found that 8% or
    less residual activity predicts more frequent and more severe hyperammonemic
    events and lower cognitive function. This converts residual activity from a
    retrospective explanation into a usable prospective stratification tool, and
    is the evidence GeneReviews alludes to when it says enzyme activity "may help
    to predict" phenotype.

    Module conformance. The entry had none. Added four
    metabolic_intoxication_decompensation conformance edges spanning the full
    module chain - Enzymatic Block on the ASS1 node, Toxic Metabolite
    Accumulation on impaired ureagenesis, Acute Metabolic Decompensation on the
    catabolic-stress node, and Acute Metabolic Encephalopathy on the astrocyte
    glutamine-osmotic injury node, which maps the module's mechanism exactly -
    plus biological_scale tags.

    Phenotypes staged. Four phenotypes specific to the neonatal crisis (poor
    feeding, cerebral edema, spasticity, coma) assigned to the Acute neonatal
    subtype. Phenotypes that genuinely span forms (hyperammonemia,
    encephalopathy, seizures, lethargy, vomiting, intellectual disability,
    developmental delay, failure to thrive, respiratory alkalosis) were left
    unassigned rather than forced.

    Tooling. MONDO:0016600 and MONDO:0016601 appended to both enum caches after
    verifying reachability against sqlite:obo:mondo - the ols:mondo limitation
    filed as issue #6989. check-enum-cache-offline passes.

    Validation. Schema, term and reference validation all pass.

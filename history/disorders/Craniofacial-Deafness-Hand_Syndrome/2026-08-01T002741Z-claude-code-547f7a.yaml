  summary: 'Create: Craniofacial-Deafness-Hand Syndrome'
  details: |
    Created the standalone CDHS entry [MONDO:0007395, PAX3, OMIM:122880, ORPHA:1529] - the counterpart the PAX3_Waardenburg_Spectrum entry anticipated when it scoped CDHS out of the ClinGen PAX3-Waardenburg validity assertion. Deep research: falcon/Edison was attempted first per the default provider policy but returned HTTP 402 Payment Required; the report used is claude_code, with an openscientist run also launched. Every PMID, snippet and ontology term was independently re-derived from cached primary sources and OAK rather than copied from the report; one report-suggested CHEBI ID [CHEBI:51068 for bosentan, actually 'miotic'] was caught and replaced with the verified CHEBI:51450. NEC preflight confirmed gene/OMIM/Orphanet against the MONDO record. No GeneReviews chapter exists for CDHS - a PubMed search returns zero - so the phenotype baseline is the primary literature: PMID:6859126 original description, PMID:8664898 PAX3 Asn47Lys, PMID:14556253 20-year follow-up. Curated a five-node pathophysiology chain from paired-domain missense through altered base-specific DNA recognition and cranial neural crest patterning failure to craniofacial skeletal hypoplasia and cochlear melanocyte deficiency, plus 19 HPO-bound phenotypes, three PAX3 variants, three diagnostic modalities, four treatments, two differential diagnoses, the splotch mouse model, and two discussions: a HUMAN_MODEL_MISMATCH on null-allele models versus the CDHS missense allele class, and a KNOWLEDGE_GAP on the single-case cardiovascular association. Single-patient findings from PMID:39850491 and the PAX3-negative case PMID:18553554 were deliberately excluded from disease-level phenotypes and documented in notes. Validated with just validate: schema clean, term validation passed, 60/60 snippets verified against cached references; compliance 92.1 percent global and 92.5 percent weighted.

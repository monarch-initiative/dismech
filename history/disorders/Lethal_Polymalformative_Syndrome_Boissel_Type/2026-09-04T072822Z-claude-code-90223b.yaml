  summary: 'Wire pathograph: split bundled node, connect 15 orphaned phenotypes'
  details: |
    Split 'Failure of central nervous system and cardiovascular development' into separate CNS and cardiovascular nodes, each carrying the part of the evidence that speaks to it, and added an 'Impaired prenatal and postnatal growth' node. Wired 15 previously orphaned phenotypes to their mechanistically appropriate parents, using causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES where intermediates are unspecified: CNS node to the brain malformations, hypotonia, hypertonia and seizure; cardiovascular node to the four septal/ductal defects, LVH and pulmonary hypertension; Wnt/neural-crest node to the craniofacial phenotypes; growth node to IUGR and failure to thrive. Phenotypes wired went from 5 of 28 to 20 of 28. The remaining 8 are deliberately unwired, each with a notes line naming the plausible candidate node and saying why it does not fit. Verified no reference to the old bundled node name survives, since a bare-name pathograph target dangles silently. Validated: schema, terms, 97/97 snippets, entity refs, causal targets, duplicate keys, enum values, snippet grading, title snippets, snippet length.

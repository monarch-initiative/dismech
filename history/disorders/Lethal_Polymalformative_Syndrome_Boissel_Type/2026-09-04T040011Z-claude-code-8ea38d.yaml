  summary: 'Review round 1: address five blocking findings on PR #10826'
  details: |
    Response to the CHANGES_REQUESTED review on PR #10826. Finding 1 (tone): PMID:26740239's abstract says hypotonia but its case description says 'On examination, she was hypertonic' and its discussion lists hypertonicity among the features shared with the index pedigree, and the deep-research report records hypertonicity in 6/6 assessable members of that pedigree. Hypertonia (HP:0001276) added, sourced from the body text. Hypotonia kept but re-sourced: the abstract is no longer cited for it, and PMID:37529081's account of the Rohena siblings (NICU admission for hypotonia; truncal hypotonia with limb spasticity at 1 year) is cited instead, so both tone directions are curated from the text that actually observed them. The abstract/body discrepancy is recorded in notes on the Hypotonia entry so a later reader does not resolve it the other way. Finding 2: brain malformations and genital abnormalities were named in a PMID:26740239 sentence already quoted three times; Abnormal brain morphology (HP:0012443) and Abnormality of the genital system (HP:0000078) now curate them. Finding 3: mined both full-text caches. CNS spectrum added as Dandy-Walker malformation (HP:0001305), Hydrocephalus (HP:0000238) and Ventriculomegaly (HP:0002119); cardiac lesions added as Ventricular septal defect (HP:0001629), Secundum atrial septal defect (HP:0001684), Patent ductus arteriosus (HP:0001643) and Pulmonary hypertension. Pulmonary hypertension is bound to HP:0004890 Elevated pulmonary artery pressure rather than HP:0002092 Pulmonary arterial hypertension, because the report does not subclassify it hemodynamically and 'pulmonary hypertension' is not an exact synonym of the arterial term. The optional extras from the review's triage list were also taken: intrauterine growth retardation, short neck, cutis marmorata and brachydactyly, all from the omnibus sentence already in the file. Finding 4: diagnosis section added with four entries - trio exome (NCIT:C101295), genome sequencing (NCIT:C101294), Sanger confirmation with parental segregation (NCIT:C19641 Dideoxy Chain Termination DNA Sequencing) and a negative karyotype/copy-number entry (NCIT:C16768) recorded as the test that does not answer the question. The report's suggested NCIT:C159670 was not used; it means Bladder Leiomyosarcoma. Chromosomal microarray is described in the report but no reported patient had one in a quotable sentence, so it is recorded in notes rather than curated as a diagnosis entry. Finding 5: the single generic NCIT:C15747 supportive-care treatment was split into five queryable entries - tracheostomy (NCIT:C15341), long-term invasive mechanical ventilation (NCIT:C191573), antiseizure pharmacotherapy (NCIT:C64172 with five CHEBI agents), ketogenic diet (NCIT:C173168) and third ventriculostomy with choroid plexus cauterization (NCIT:C182204) - each with an exact full-text snippet, therapeutic_modality, and target_phenotypes where a phenotype in this entry is the target. The generic supportive-care entry is kept but no longer names the specifics in prose. Non-blocking finding 7 also addressed: progression now cites the two Rohena deaths (6 years, 2.5 years), the cross-series statement that all described patients died young, and the 5.5-year evaluation of the fourth patient, and the progression notes were corrected to describe survival by family rather than by publication year. Non-blocking finding 6 (frequencies) deliberately not changed - the Boissel counts are still only in the deep-research report and the PMID:19559399 cache is abstract-only, so a band would be asserted from an unquotable source. Every NCIT and CHEBI term was resolved with runoak before use and every snippet was grepped against its cache file before being written.

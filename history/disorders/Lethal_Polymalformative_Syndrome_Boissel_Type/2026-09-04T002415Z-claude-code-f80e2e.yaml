  summary: 'Create: Lethal Polymalformative Syndrome, Boissel Type (MONDO:0013050,
    FTO)'
  details: |
    entry_type DISEASE. Single gene, single recessive mechanism, nothing in kb/ that could host it as a subtype. The retrieval problem here is that FTO's obesity literature is orders of magnitude larger and is about a different molecule: the BMI-associated variants are in intron 1 and act on IRX3/IRX5 rather than on FTO protein function, so an obesity citation is not weak evidence for this disease but evidence about something else. Every citation was checked to confirm it concerns the coding-variant malformation syndrome; three exceptions are cited deliberately and labelled in notes (two FTO enzymology papers cited only to date what was known about FTO substrates when each disease report chose its assay, and a lean-vs-obese sequencing survey cited only because it independently characterised R322Q as catalytically dead and found inactive alleles heterozygously in unaffected adults). Five reported families were found rather than the three the issue's research comment listed; the two extra (PMID:26697951 Yemeni family with R322Q, PMID:26740239 with H271P) were surfaced by reading the PMID lists attached to the GenCC submissions. Gene-disease validity is curated as contested via external_assertions: four GenCC submitters split Strong/Strong/Supportive/Limited, read directly from the GenCC submissions export rather than taken on trust, and the CONTROVERSY discussion records that the split tracks how much of the literature each submission counted, since the Limited and Supportive calls each cite only the 2009 index report. No FrequencyEnum values anywhere: every available count is intra-familial, mostly from nine siblings of one pedigree. Mortality is in progression, not phenotypes, because HP:0003819 sits under Clinical modifier; the MONDO label's lethality claim is explicitly limited to the index pedigree since two later patients survived past a year. The senescence node carries a REFUTE item: a second patient's fibroblasts showed no proliferation or morphology abnormality against parental controls, and the same sentence states senescence was not tested, so cellular_senescence module conformance was not declared. Osborn 2014 (PMID:24503721) supplies the only worked-out route from FTO loss to malformation - a canonical/non-canonical Wnt shift with defective ciliogenesis - curated as its own node and zebrafish model, with the edge into the human malformation node left UNKNOWN because no patient tissue has been examined. The HUMAN_MODEL_MISMATCH records that mouse and zebrafish disagree with each other. Deep research: falcon, preflight PASS with FTO mentioned 63 times and OMIM matching. The DR report proposed NCIT:C15421 for Supportive Care, which is actually Postmenopausal; NCIT:C15747 was used instead.

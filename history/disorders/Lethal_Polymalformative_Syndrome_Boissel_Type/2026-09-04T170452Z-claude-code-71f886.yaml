  details: |
    Addressed the CHANGES_REQUESTED review on PR #10826. The root pathophysiology node 'Biallelic FTO missense variant' said five homozygous missense alleles had been reported but named only four, omitting H271P, and asserted that each had been shown biochemically to reduce or abolish demethylase activity. Checked references_cache/PMID_26740239.md directly: that report performed fibroblast morphology, proliferation (no difference from controls), apoptosis, transcriptome, Western blot, qPCR and IHC nuclear localization, and no demethylase or 2-oxoglutarate assay; it places H271P in the catalytic domain ('In our patient, as well as in the previously reported case, the homozygous FTO mutation affected the catalytic domain of the protein') and concludes there is still much to be learned about the mechanism. The node description now names all five alleles, places H271P in the catalytic domain, scopes the biochemical claim to the four characterised alleles, and states what the case for H271P actually rests on. The adjacent genetic_context.description was softened the same way. This aligns the node with the CONTROVERSY discussion, which already said 'all five families and the four independently characterised alleles'. Also took two non-blocking suggestions: attached the sentences that actually report each assay as IN_VITRO evidence on the S319F variant (PMID:26378117, reduced 2-oxoglutarate turnover and N-methyl-nucleoside demethylase activity) and the R96P variant (PMID:37529081, 90 percent reduction in demethylase function), so the strongest functional claims in the variants section are self-supporting rather than resting on prose; and curated drumstick fingers as a Clubbing of fingers phenotype (HP:0100759) from a snippet already used elsewhere in the file, left deliberately unwired with a notes entry explaining why. The reviewer suggested HP:0100759 under the label 'Digital clubbing'; the canonical HPO label is 'Clubbing of fingers', which is what is bound, with 'Digital clubbing' kept as preferred_term. Validation: just validate, validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all clean; count-verified-snippets 100/100; whole-KB check-title-snippets, check-snippet-length and check-snippet-grading all report no new violations.

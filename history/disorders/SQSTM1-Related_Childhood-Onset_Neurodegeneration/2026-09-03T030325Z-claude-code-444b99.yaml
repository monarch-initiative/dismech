  summary: 'Create: SQSTM1-Related_Childhood-Onset_Neurodegeneration (NADGP, MONDO:0014940)'
  details: |
    Curated the biallelic, childhood-onset SQSTM1 entity (NADGP, MONDO:0014940) as a standalone DISEASE entry, replacing the seed-stub placeholder at the same path and consuming stubs/Neurodegeneration_With_Ataxia_Dystonia_And_Gaze_Palsy_Childhood-onset.yaml.

    LUMP/SPLIT DECISION: DISEASE, split from the dominant SQSTM1 disorders by zygosity and allele class. Paget_Disease_of_Bone is already curated and is the only KB entry where SQSTM1 (hgnc:11280) is a causal genetic: binding; it is dominant, adult-onset, skeletal, and caused by UBA-domain missense alleles (verified against PMID:11992264). NADGP is biallelic-null, childhood-onset and neurological, with complete absence of p62 protein demonstrated by immunoblot in patient fibroblasts (PMID:27545679). No missense NADGP allele has been reported. A has_subtypes relationship on either dominant entry would misstate onset, organ system, allele class and molecular consequence.

    COVERAGE CHECK (verified by hand, not trusted from the issue): MONDO:0014940 was bound nowhere in kb/. The issue asserted SQSTM1 appears elsewhere only as the p62 protein; that is close but not exact. hgnc:11280 appears as a causal gene in Paget_Disease_of_Bone only. Amyotrophic_Lateral_Sclerosis carries hgnc:11280 inside a pathophysiology node's genes: list but SQSTM1 is NOT in its genetic: section at all. Huntington_Disease carries it in genetic: with association 'Pathophysiological Role', not causal. Macroautophagy_Deficiency_Disorders carries it as the representative autophagy-receptor gene on its ALS member. Myofibrillar_Myopathy mentions a digenic SQSTM1-TIA1 combination in prose only; Spinocerebellar_Ataxia_Autosomal_Recessive_31 uses p62/SQSTM1 as a mechanism node (cargo receptor accumulating in ATG7 deficiency). This entry is therefore the first causal binding of SQSTM1 to a recessive phenotype in the KB.

    RESEARCH INPUT: research/SQSTM1-Related_Childhood-Onset_Neurodegeneration-deep-research-claude_code.md. This report was produced by the claude_code provider, NOT by falcon. The requested provider was falcon; that attempt failed with ProviderBillingError HTTP 402 (account out of credits) and the run fell back to claude_code via the documented --fallback path, which the report frontmatter records as fell_back: true with provider_attempts. just preflight-dr with --strict returned PASS (SQSTM1 mentioned 30 times, OMIM 617145 present). The report was treated as a lead only: every snippet was re-derived by hand from the cached reference files, and the report's four self-flagged unsupported quotes (PMID:31525130, PMID:33891871, PMID:29959261) were not copied. One report claim was rejected outright: it cited PMID:18346206 for 'elevated oxidative stress demonstrated in p62-null mice', which that abstract does not state; only the tau/neurofibrillary-tangle/neurodegeneration claim was used.

    MODULE CONFORMANCE: two edges declared. disabled_macroautophagy#Failure of Cytoplasmic Quality Control on the cargo-recognition node, and cerebellar_purkinje_degeneration#Cerebellar Neuron Insult on the neuronal stress node (that module's trigger explicitly admits impaired protein quality control as an initiating lesion and its scope covers autosomal recessive ataxias). Deliberately NOT declared: cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration, because no human neuropathology exists for this disorder so Purkinje loss is inferred rather than shown; and disabled_macroautophagy#Autophagy Machinery Decline, which is framed as age-associated decline rather than a congenital null.

    NUANCES CURATED RATHER THAN FLATTENED: Cerebellar Atrophy carries one INDIRECT group-level SUPPORT (PMID:29112993) plus two REFUTE items (PMID:39587727, PMID:31525130) documenting genetically confirmed patients with normal MRI or no significant atrophy, since a normal MRI does not exclude the diagnosis. The KEAP1-NRF2 branch is scoped to a mechanistic_hypotheses group (nrf2_axis_failure, status EMERGING) with INDIRECT evidence, because the demonstrated direction (PMID:20173742) is inverted: p62 overproduction stabilises NRF2, and blunted NRF2 under p62 absence is an inference not measured in patients. Three discussions record the open questions: no human neuropathology (KNOWLEDGE_GAP), the p62-null mouse tau/obesity phenotypes absent from human NADGP (HUMAN_MODEL_MISMATCH), and heterozygous carrier risk for the dominant allelic diseases (KNOWLEDGE_GAP).

    DELIBERATELY NOT CURATED: no datasets: block (a gene-only dataset search would surface the dominant SQSTM1 diseases, which is the named-entity-confusion trap here); no clinical_trials: block (no interventional trial found for biallelic SQSTM1 disease); no environmental: block (no reported contributor). The one published treatment narrative (PMID:40728085) reporting non-response to levodopa/carbidopa, baclofen, trihexyphenidyl and tetrabenazine is recorded in entry notes rather than as a treatment claim, because that record exposes neither abstract nor full text in the cache and so has no quotable substring. Six further correspondence-format case reports (PMID:38279634, PMID:38532471, PMID:41482852, PMID:41708390, PMID:42014241, PMID:42403283) likewise have empty cache bodies and were not used as evidence. No dedicated ORPHA code for this entity could be located, so prevalence is anchored on a published case count (PMID:41307082, 27 cases) rather than an Orphanet epidemiology class.


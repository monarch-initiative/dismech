  details: |
    Addressed the five blocking items and two of the three suggestions from the automated review of PR #10655 (comment 5519767878). No content the reviewer commended was undone.

    RESEARCH INPUT (restated for accuracy): research/SQSTM1-Related_Childhood-Onset_Neurodegeneration-deep-research-claude_code.md was produced by the claude_code provider, NOT by falcon. Falcon was the requested provider and failed with ProviderBillingError HTTP 402; the run fell back to claude_code via the documented --fallback path, recorded in the report frontmatter as fell_back: true. It was used as a lead only in this session as in the create session.

    BLOCKING 1 - reference_title. Every evidence item now carries reference_title. Values were read programmatically out of each references_cache/*.md frontmatter rather than typed, which is the failure mode #9138 documents (correct PMID, verified snippet, invented title). 77 evidence items now carry one; the file had 55 at review time and gained 22 with the new diagnosis, differential_diagnoses and phenotype content. just check-reference-titles OK, no new sub-0.85 titles.

    BLOCKING 2 - top-level references: block. Added, listing all 22 cited references with cache-derived titles, generated by the same script. GeneReviews: searched PubMed 2026-09-02 via E-utilities. 'SQSTM1[Title] AND GeneReviews[Book]' returns 0. 'GeneReviews AND SQSTM1' across all fields returns exactly one record, PMID:20301623 'Amyotrophic Lateral Sclerosis Overview', which covers the dominant SQSTM1 disorder, not this recessive entity. 'GeneReviews AND (\"neurodegeneration with ataxia, dystonia, and gaze palsy\" OR NADGP)' returns 0. There is no chapter to tag, so no tags: [GeneReviews] entry was added; the searches and their results are recorded in entry notes so the next curator does not repeat them. The reviewer could not run this check (PubMed blocked in its environment) and marked it N/A; it is now resolved rather than assumed.

    BLOCKING 3 - wrong GO binding. The reviewer was right. GO:0043130 'ubiquitin binding' on the node 'Failure of Selective Autophagy Cargo Recognition' was attached to preferred_term 'LC3-interacting region binding of p62 to the phagophore'; the LIR binds ATG8/LC3, and ubiquitin binding is the UBA domain at the C-terminus. Rebound to GO:0030674 'protein-macromolecule adaptor activity' (verified present in cache/go/terms.csv with that exact label). The separate GO:0043130 binding on 'Absence of p62/Sequestosome-1 Protein', whose preferred_term is 'ubiquitin-binding autophagy cargo receptor activity of p62', is correct and was left alone. PMID:17580304 (Pankiv 2007), already cached in this PR but uncited, is now cited on that node with the direct-interaction sentence, graded IN_VITRO/INDIRECT because it maps the normal interaction in HeLa cells rather than measuring it in NADGP material.

    BLOCKING 4 - diagnosis: section. Three entries, all from cached references. Next-generation sequencing (NCIT:C101295 Whole Exome Sequencing) with PMID:31525130 and PMID:41307082; p62/SQSTM1 immunoblot on patient-derived cells (NCIT:C16357 Western Blotting, resolved online during term validation and now cached in cache/ncit/terms.csv and the treatmentactionterm enum cache) with PMID:27545679 and PMID:39587727; and the urine-derived-cell splicing/expression assay for VUS resolution with PMID:39587727, deliberately left with no term: because NCIT has no clinical-action term for that assay and a free-text preferred_term is the documented fallback.

    BLOCKING 5 - differential_diagnoses: section. Five entries. Niemann-Pick disease type C (MONDO:0018982) is the principal phenocopy and is what the prose at the vertical-gaze-palsy phenotype was already gesturing at; it is now a structured entry with distinguishing_features covering the neurovisceral onset, gelastic cataplexy, filipin/oxysterol confirmation and the licensed therapy, evidenced by two newly fetched references (PMID:20525256 Vanier Orphanet review, PMID:22810120 Salsano VSGP review). Also added: ataxia-telangiectasia and the ataxia with oculomotor apraxia syndromes (MONDO:0008840), reached from the oculomotor apraxia phenotype added in this same session and separated by the normal alpha-fetoprotein and absent telangiectasia explicitly documented in PMID:41307082; Wilson disease (MONDO:0010200), separated by the normal copper and ceruloplasmin in the same paper; hereditary chorea syndromes, which PMID:39587727 states directly; and other inherited childhood-onset cerebellar ataxias, from PMID:34147300 and PMID:31525130. PMID:35402641 (Eye Movement Disorders in Movement Disorders) was fetched to evidence the oculomotor route into these differentials.

    SUGGESTION 6 - minority phenotypes. Added five, each with an exact quote: Oculomotor Apraxia (HP:0000657), Nystagmus (HP:0000639), Tremor (HP:0001337), Bradykinesia with Limb Rigidity (HP:0002067), Hearing Loss (HP:0000365). Bradykinesia rather than HP:0001300 Parkinsonism deliberately: no reported patient carries a formal parkinsonism diagnosis and no dopaminergic imaging has been published, so the narrower defensible term was chosen and the reasoning recorded in the phenotype description. Urinary incontinence and bilateral internuclear ophthalmoplegia were NOT added: no cached reference in this PR contains the word 'incontinence', and the internuclear-ophthalmoplegia report is one of the correspondence-format publications with an empty cache body. Both omissions are recorded in entry notes so they are re-checked rather than forgotten.

    SUGGESTION 7 - Progressive Gait Ataxia vs Progressive Cerebellar Ataxia overlap. Scoped rather than merged. 'Progressive Cerebellar Ataxia' (HP:0002073) was renamed 'Progressive Appendicular Ataxia' and rebound to HP:0002070 Limb ataxia, with new limb-specific evidence (PMID:39587727 'Both limb and truncal ataxia were evident.'; PMID:41307082 finger-to-nose dysmetria) replacing the two generic cerebellar-ataxia quotes, one of which moved to Progressive Gait Ataxia graded directness: INDIRECT and the other of which already lived on Cerebellar Atrophy. This also fixed a pathograph defect the review did not catch: the old node had no incoming edge and was an orphan in the causal graph. The rename broke nothing because no downstream target referenced it; a downstream edge from 'Regional Neurodegeneration of Cerebellum, Brainstem and Basal Ganglia' was added for it and for the four new movement/oculomotor phenotypes. Hearing Loss was left unconnected because no source localises it.

    PRESERVED DELIBERATELY: the treatment non-response narrative stays in notes rather than being given a manufactured snippet (PMID:40728085 and its DOI record are both content-empty); the two REFUTE items on Cerebellar Atrophy; the nrf2_axis_failure EMERGING hypothesis scoping; and the withheld cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration conformance with its KNOWLEDGE_GAP.

    CACHE HYGIENE: three references were fetched (PMID:20525256, PMID:22810120, PMID:35402641). PMID:20525256 was already tracked as abstract_only and the fetch upgraded it to full_text_pdf, producing 1935 lines of unrelated churn; it was restored with git restore and both snippets taken from it were re-verified against the original abstract-only body. A one-line frontmatter churn on PMID:17580304 was likewise restored. Only the two genuinely new cache files are committed.

    VALIDATION (all run, real output read): just validate PASS with 77/77 snippets verified; just validate-terms PASS; just count-verified-snippets 77/77; just check-duplicate-keys OK; just check-entity-refs OK; just check-causal-targets OK, no new breakage; just check-qualifier-terms OK and check-qualifier-terms-online OK with 97 CURIEs resolved; just check-enum-values OK; just check-reference-titles OK; just check-snippet-grading OK; just check-folded-hyphens, check-snippet-length, check-title-snippets all OK with no new entries; just check-term-cache-integrity OK; just validate-disorders PASS, exit 0. All 22 cited references are PMIDs, so the validate-disorders DOI-prefix skip does not apply to this entry and no --unskip-prefix pass was needed.

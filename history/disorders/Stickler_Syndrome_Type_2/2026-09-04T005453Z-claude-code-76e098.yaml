  summary: 'Create: Stickler Syndrome Type 2 (COL11A1)'
  details: |
    New Mendelian disorder entry for COL11A1-related Stickler syndrome type 2 (MONDO:0011493), curated from a claude_code deep-research run (research/Stickler_Syndrome_Type_2-deep-research-claude_code.md, 288s, 13 web searches, 26 citations) with the GeneReviews Stickler syndrome chapter (PMID:20301479) as the mandatory phenotype baseline.

    The report carried no frontmatter validation, so both retro-fits were run: just validate-research-reference (17/17 references resolved, 0 unresolved, 0 off topic, but 2 of 3 quoted claims not found in source) and just validate-research-terms (39/41 resolved; 4 CURIEs named as a different term). No quote was copied from the report - all 87 snippets were taken directly from cached abstracts and full texts. The four mislabelled CURIEs were all rejected: UBERON:0000955 (report said cochlea, UBERON says brain) replaced by UBERON:0001844; UBERON:0002481 (report said mandible, UBERON says bone tissue) not used; HP:0000875 (report said lattice degeneration, HP says Episodic hypertension) not used; HP:0000272 Malar flattening replaced by HP:0011800 Midface retrusion.

    Three PMIDs recalled from memory during reference gathering turned out to be unrelated papers (24560571, 8894694, 7859280 - synapses, dystrophin, HIV-1) and were discarded rather than cited; their cache files are not committed.

    Content: a seven-node causal chain from the COL11A1 triple-helical-domain variant through loss of type XI regulation of collagen fibrillogenesis, branching to the beaded vitreous and retinal detachment, cartilage disorganisation with craniofacial and articular arms, and cochlear plus middle-ear extracellular matrix abnormality. 12 phenotypes, 8 treatments, 2 animal models with modeled_mechanisms links, one environmental exposure linked into the pathograph, and a HUMAN_MODEL_MISMATCH discussion for the cho/+ mouse, which recapitulates the joint phenotype but has normal ABR thresholds through 10 months (PMID:12527136) - the negative result that argues the human cochlear lesion is dominant-negative rather than a dosage effect.

    Scope-boundary discipline: no prevalence band or rate is asserted, because Orphanet's rows are scoped to the whole Stickler group and disagree among themselves by 500-fold; the COL11A1 case fraction (10-20% of Stickler patients, PMID:32558342) is recorded under genetic.case_fractions instead. Pooled myopia (83%) and retinal-detachment (45%) figures were declined for the same reason, with the reason recorded next to each. Cataract FREQUENT and sensorineural hearing impairment FREQUENT both rest on type-2-scoped numbers (59%, PMID:32316871; 69%, PMID:32901364). All retinal-prophylaxis evidence carries directness: INDIRECT because the controlled cohorts are type 1.

    No datasets are recorded: just discover-datasets returns only GENE_ONLY COL11A1 matches from ovarian cancer and cutaneous SCC invasion studies - resolvable accessions about a different disease.

    An adversarial pre-PR review pass was run against the dismech-pr-review skill and returned three blocking and eleven important findings; all were addressed before commit, including a group-scoped prevalence band published in machine-readable numeric fields, a phenotype description that attributed a source's middle-ear-collagen claim to the wrong referent, and a treatment whose only evidence described a different intervention.

    Validation: just validate (schema + terms + 87/87 snippets), just validate-disorders (batched, the CI gate), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-reference-titles all pass. Weighted compliance 94.2%. The stubs/ entry was deleted.

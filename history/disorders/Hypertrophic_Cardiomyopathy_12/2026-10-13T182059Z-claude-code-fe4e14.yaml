  summary: 'Create: Hypertrophic_Cardiomyopathy_12'
  details: |
    Created the CMH12 (CSRP3, MONDO:0012804) entry and deleted stubs/Hypertrophic_Cardiomyopathy_12.yaml. Deep research: research/Hypertrophic_Cardiomyopathy_12-deep-research-claude_code.md (claude_code provider; 18/18 references resolved, 2/2 quotes valid; term validation flagged only a paraphrased MONDO:0005045 label; just preflight-dr PASS, CSRP3 mentioned 40 times). The report was used as leads; it marked Bos 2006, Geier 2008, Knoll 2002 and Theis 2006 as uncached, but all four were already in references_cache and were read directly. It also stated that no skeletal myopathy is documented for CMH12, which the Geier 2008 abstract (PMID:18505755) contradicts; the entry follows the abstract. PMID:15781201 (W4R letter) has no abstract text and is not cited.
    Key sources: Geier 2003 PMID:12642359 and Geier 2008 PMID:18505755 (cosegregation, linkage, mild skeletal muscle disease), Gehmlich 2004 PMID:15205937 (C58G binding and folding), Ehsan 2018 PMID:30048712 (C58G knock-in, proteasomal MLP depletion), Salazar-Mendiguchia 2020 PMID:33035702 (C150Y, late-onset, age-dependent penetrance), homozygous truncating cases PMID:30012424, 31919335, 38666070, Egypt cohort PMID:37431535, biobank PMID:41893039, Walsh 2017 PMID:27532257 HCM table row, Bos 2006 PMID:16352453, Li 2019 hESC knockout PMID:31406109, Riaz 2022 iPSC/W4R modifier PMID:35384713, ClinGen reappraisal PMID:39971408 and the CGGV Definitive SD assertion.
    Judgement calls: relationship_type CAUSATIVE follows the ClinGen Definitive tier (CMH28 precedent); the CGGV assertion is for generic HCM (MONDO:0005045), so it is cited as evidence and not copied into gene_disease_validity (list-gene-validity reports other_disease, as expected). Two inheritance blocks (autosomal dominant and semidominant HP:0032113). W4R is a separate genetic row with relationship_type MODIFIER. The calcineurin-NFAT node follows the human iPSC data (increased signalling) and a CONTROVERSY discussion records the opposite direction in MLP+/- mice after infarction (PMID:15665106). General HCM features without CSRP3-specific data (arrhythmia, SCD, outflow obstruction, fibrosis in patients) were left out rather than inferred.
    Re-fetching a few already-tracked caches during the run rewrote them (PMID:17097056, 30681346, 12507422, 16352453, 18505755, 34526680); those rewrites were reverted to the committed versions, and snippets were verified against the committed text.
    Validation: just validate, validate-terms, count-verified-snippets 105/105, check-causal-targets, check-entity-refs, check-duplicate-keys, check-gene-validity, check-snippet-grading, check-gene-activity-grounding --against-ref origin/main, check-genereviews (GeneReviews TAGGED, PMID:20301725), list-disconnected-phenotypes 3/3 connected, and validate-disorders as the final gate.

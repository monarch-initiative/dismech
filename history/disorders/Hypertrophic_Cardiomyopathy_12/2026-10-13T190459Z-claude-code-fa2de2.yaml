  summary: 'Review: Hypertrophic Cardiomyopathy 12 (CSRP3)'
  details: |
    Adversarial review of the new CMH12 entry against the cached sources; no unsupported or inexact quotes were found. Calcineurin-NFAT: this entry models increased signalling (Riaz 2022, PMID:35384713, iPSC cardiomyocytes) while the allelic DCM1M entry models blunted signalling (Heineke 2005, PMID:15665106); the calcineurin-direction discussion now quotes Riaz proposing that MLP has both inhibitory and facilitative effects on calcineurin, names the DCM1M split, and states that the C58G knock-in Rcan1.4 induction is seen only in KI/KI hearts. Evidence from MLP-null hESC (PMID:31406109) and W4R/MYH7 iPSC models is now graded INDIRECT on every pathograph node and edge it supports, as is the Bos 2006 pooled-carrier edge. The skeletal muscle phenotype was rebound from HP:0003198 Myopathy to the more specific HP:0003756 Skeletal myopathy; no frequency is assigned because the Geier 2008 abstract gives none. The W4R modifier row association now states that W4R modifies sarcomeric HCM and is not itself diagnostic of CMH12. Notes: removed a statement about local reference-cache state and softened a claim about reverse-curvature septal contour that the cited abstract does not make.

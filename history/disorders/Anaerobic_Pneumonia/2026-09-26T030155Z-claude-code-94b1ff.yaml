  summary: 'Create: Anaerobic Pneumonia'
  details: |
    Created the Anaerobic Pneumonia entry from an OpenScientist deep-research report. Curated MONDO:0004649 as an anaerobe-dominant pneumonia overlapping aspiration pneumonia and lung abscess, with genus-level Prevotella, Fusobacterium nucleatum, Peptostreptococcus, and Bacteroides infectious agents; a four-node aspiration-to-polymicrobial-infection-to-inflammatory-adhesion-to-necrotizing-cavitary-destruction pathograph; fever, productive cough, lung abscess, and pleural empyema phenotypes; bronchoalveolar-lavage mNGS diagnosis; and anti-anaerobic pharmacotherapy plus drainage/surgery treatments. The OpenScientist report resolved 38/38 references but marked six report quotes unsupported and proposed several wrong HP/NCIT CURIEs plus one obsolete GO term, so ontology bindings were rechecked with OAK and unsupported or off-entity report claims were left out.

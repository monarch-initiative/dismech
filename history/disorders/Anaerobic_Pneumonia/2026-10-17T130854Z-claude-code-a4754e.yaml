  summary: Bind LOINC anaerobe culture code to the protected-sampling row
  details: |
    LOINC tranche B batch 28. The protected lower-airway sampling row takes LOINC:635-3 (Bacteria identified in Specimen by Anaerobe culture). The anaerobe-culture method is what the row turns on, so the code is bound for the method rather than for any one organism: the row names no single agent, and an anaerobe culture reports whichever of this entry's four genera grows.

    The specimen is left unqualified deliberately. The row names lower-airway, abscess or pleural samples; LOINC carries abscess and pleural-fluid anaerobe culture codes but none for a lower-respiratory specimen, so binding the two available sites would have represented two of the row's three options while silently dropping the one it names first. The serial-isolate variants of this code, numbered 2 through 7, were avoided as they report a second or later isolate rather than the test.

    Sources: observation-code existence and absence from the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows with status and deprecation checked per code, so each result set is complete rather than a ranked page; Part-level questions from the Monarch KG, which the export cannot answer because it carries no LP or LG rows. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 273 LOINC rows added by all 45 open loinc PRs, enumerated with pagination: no collision.

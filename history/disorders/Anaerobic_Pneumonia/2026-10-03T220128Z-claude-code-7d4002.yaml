  summary: Rung-3 lump/split review (#10115, design decisions §3e)
  details: |
    Two changes, both required by design decisions section 3e. First, the missing transmission block (R25, reported as the deterministic MISSING_TRANSMISSION finding) was added: one route, aspiration of colonized oropharyngeal secretions and gastric contents, with four cited evidence items (PMID:39536943, PMID:20477271, PMID:11695090, PMID:42445473) and a notes field recording that the route is endogenous, with no person-to-person spread and no environmental or vector reservoir, and that the host factors permitting aspiration are modelled separately in the environmental section. Gradings for sentences already quoted elsewhere in the file were kept at the file's existing values (OTHER for the three review sentences) so one sentence does not carry two evidence_source values. Second, a rung-3 review of the four anaerobes (Prevotella, Fusobacterium nucleatum, Peptostreptococcus, Bacteroides) against the six axes. Outcome: a deliberate lump, recorded with the 'Deliberately lumped.' sentinel in entry-level review_notes, so the checker reports LUMP_RECORDED. The decisive fact is that these organisms do not partition cases - the infection is polymicrobial, with an average of three anaerobes per specimen and all four genera among the commonest isolates (PMID:8324128, PMID:12959026), and one empiric regimen treats the group (PMID:20477271) - so a clinical stratum cannot be assigned to a case yielding several of them. Four PubMed queries are recorded verbatim in review_notes with their counts (19, 5, 32, 42). The strongest contrary evidence is recorded explicitly rather than omitted: PMID:30951830, newly fetched, is a susceptibility survey of exactly these organisms as causes of aspiration pneumonia and reports per-genus differences (Fusobacterium beta-lactamase negative and susceptible to all drugs tested except ampicillin; Bacteroides fragilis and Peptostreptococcus with decreased cefmetazole/flomoxef susceptibility; Prevotella with decreased ceftriaxone susceptibility). Drug susceptibility is one of the six axes, so this is a genuine near miss; it is judged insufficient because the differences are microbiological rather than clinical, no source names a genus-specific first-line regimen or a clinical entity such as 'Prevotella pneumonia', and co-isolation means a case's susceptibility profile is the union of whatever grew. The paper is cached and named in review_notes but cited as evidence nowhere, since it supports no claim the entry makes. R10 is invoked for a future row. The pre-existing NO_PROGRESSION advisory is out of scope. Validated: just validate (42/42 snippets), just check-granularity (MISSING_TRANSMISSION cleared, LUMP_RECORDED).

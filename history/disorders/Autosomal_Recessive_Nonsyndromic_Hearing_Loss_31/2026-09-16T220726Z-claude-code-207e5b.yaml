  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 31 (DFNB31, WHRN)'
  details: |
    Curation outcome for MONDO:0011767 (autosomal recessive nonsyndromic hearing loss 31; DFNB31, WHRN, OMIM 607084) is a standalone kb/disorders/ entry, consistent with the dozen-plus DFNA/DFNB per-locus entries already in the KB. The two WHRN neighbours were checked and neither is coverage: Usher_Syndrome.yaml curates USH2D as a WHRN subtype, which is the allelic syndromic disease and not this one, and Autosomal_Recessive_Nonsyndromic_Hearing_Loss_48 is a CIB2 entry that mentions whirlin only in prose while arguing CIB2's stereocilia role is not exercised through whirlin. Content: a four-node pathograph from biallelic WHRN loss of function through loss of whirlin from the stereocilia tip complex, failure of stereocilia elongation and bundle organization, to hair bundle mechanotransduction failure; two wired phenotypes; a genetic section built around the isoform-position genotype-phenotype question; a negative-linkage prevalence record; cochlear implantation and early habilitation as treatments, both deliberately evidence-free with the reason stated; three mouse models (the whirler Whrn wi/wi null, the Whrn tm1b long-isoform null, and the AAV8 rescue) each with modeled_mechanisms, model_scale, limitations and readouts; Usher syndrome type 2D as the differential; and two discussions. Thirty evidence snippets across eight PMIDs, all verified. The mechanistically interesting content is the allelic relationship with USH2D. DFNB31 patients have profound hearing loss and normal vision while USH2D patients have moderate loss with retinitis pigmentosa, and the proposed explanation is that WHRN's long and short isoforms are hit differently: the DFNB31 alleles reported so far are C-terminal truncations and the USH2D alleles lie in the long-isoform-specific N terminus. That is recorded as the authors' proposal rather than a rule, with a KNOWLEDGE_GAP discussion, because it rests on two alleles in one family and because one later nonsyndromic report carries a homozygous missense change at residue 207 inside the region the rule would assign to Usher syndrome, with no reported retinal assessment. A second discussion records a HUMAN_MODEL_MISMATCH: whirlin-null mice circle and head-bob and the double-isoform-null mouse has overt vestibular dysfunction, while the review states that no published WHRN patient self-reported a vestibular deficit - self-report, not testing. Deep research: a Falcon report is committed. The query was seeded with a disambiguated disease name rather than the numbered locus, because numbered loci are where providers substitute a different disease; the entry's name: field was temporarily set to that string and restored before commit. preflight-dr PASSed against MONDO:0011767 with WHRN mentioned 66 times and the correct OMIM 607084 present, and the report's own reference validation resolved 9 of 9 citations at confabulation rate 0. The report was used as a lead only and changed no conclusion. One of its claims - that the AAV8 rescue did not improve ABR sensitivity and that adult treatment did not restore stereocilia - is attributed to full text this entry could not fetch, so it is recorded in notes and in the model's limitations as the report's unverified claim rather than asserted as evidence. Deleted stubs/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_31.yaml. Validation: just validate (30/30 snippets, all PMID, no prefix skips), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-folded-hyphens, check-enum-values, check-stubs, validate-disorders, whole-KB check-title-snippets, check-snippet-length, check-snippet-grading, plus a manual orphan audit: every phenotype and non-root node is targeted, and the only untargeted node is the root trigger.

  summary: 'Review round: verify AAV8 functional outcome from cached review'
  details: |
    The claim that round-window AAV8-whirlin delivery did not restore hearing had been recorded as unverifiable, but the whirlin isoform review (PMID:30831381) is cached in full and states it. Added an UNCHANGED hearing readout on the AAV8 model link citing that sentence, and link-level evidence that posterior semicircular canal delivery partially improved auditory and vestibular function, so the negative result is route-specific. Rewrote the AAV8 limitations and the notes paragraph; the adult-treatment claim remains unasserted. Added the review's VsEP sentence to the HUMAN_MODEL_MISMATCH discussion (Whrnneo mice lose VsEP responses without overt vestibular behaviour). Added GO:0120045 stereocilium maintenance to the stereocilia node. Clarified the whirler model limitation: positionally matched to DFNB31 alleles but a double-isoform null. Merged main, taking main's current abstract cache for PMID:17171570 over the branch's stale full-text copy; all snippets still verify.

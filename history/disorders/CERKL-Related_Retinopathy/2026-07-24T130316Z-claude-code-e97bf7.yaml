  summary: 'Create: CERKL-Related Retinopathy'
  details: |
    Fresh curation of CERKL-Related Retinopathy, MONDO:0800401, cross-referenced to RP26 MONDO:0012024 via skos:narrowMatch since RP26 is the original gene-linkage-era name for the RP-pattern subset. NEC preflight passed: gene hgnc:21699/CERKL and OMIM:608380 both match the MONDO record. Sourced via independent WebSearch/WebFetch literature research, no DR tool run this session, across 5 PMIDs: gene discovery 14681825, oxidative-stress protection mechanism 19158957, mitochondrial dynamics/autophagy mouse model 34048907, the largest natural-history cohort to date 37331655, and an ethnically diverse UK clinical cohort 33322828. Six-node pathophysiology chain: CERKL biallelic loss-of-function to loss of oxidative-stress protection to two branches, mitochondrial fragmentation/bioenergetic dysfunction plus dysregulated autophagy, converging on combined rod and cone photoreceptor apoptosis (conforms_to photoreceptor_degeneration#Rod Photoreceptor Apoptosis, explicitly modeling the atypical non-rod-first pattern), terminating in macular and peripheral retinal atrophy. Modeled as a single umbrella entity rather than forcing has_subtypes partitions, since the natural-history literature explicitly states the phenotype spectrum does not cleanly separate and no separate MONDO IDs exist for the non-RP26 presentations. New MONDO:0800401 and MONDO:0012024 enum values required manual append to cache/enums/diseaseterm_f618932bb23f.csv, same recurring gotcha as CACNA1F and other recent entries. Full just validate pass, schema plus term plus reference validation, all clean on first content pass.

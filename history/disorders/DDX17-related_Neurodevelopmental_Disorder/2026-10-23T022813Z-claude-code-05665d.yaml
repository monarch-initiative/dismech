  summary: 'Review round 1: DDX17-related Neurodevelopmental Disorder'
  details: |
    Addressed review 5623180958 on PR 15270. Added reference_title to all 55 evidence items with scripts/backfill_reference_titles.py, which copies titles from references_cache. On the Impaired Axon Outgrowth to Disrupted Cortical Circuit Development edge, added the positive contralateral axon density finding from PMID:39405200 as the first evidence item and kept the white-matter null sentence second. Removed the shRNA off-target caveat item graded SUPPORT on Impaired Cortical Neuronal Migration; the caveat stays in the node description and the mouse model limitations. Added the synonym DDX17-related disorder after confirming it in MONDO through the OLS4 REST API (terms?obo_id=MONDO:0700368 returns synonyms [DDX17-related disorder]). Added two notes paragraphs: seizures are not described in any patient in the case series (a full-text search of the cached PMID:39405200 finds seizure mentioned only for the tadpoles), and no treatments section is recorded because no disease-specific management has been published. The no-epilepsy point is a note, not evidence, because the paper has no sentence stating the absence in patients.

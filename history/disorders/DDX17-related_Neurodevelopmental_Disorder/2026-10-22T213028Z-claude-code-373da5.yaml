  summary: 'Create: DDX17-related Neurodevelopmental Disorder'
  details: |
    New entry for MONDO:0700368 (DDX17, heterozygous de novo). Entry type decided as DISEASE: one gene, one dominant haploinsufficiency mechanism, no MONDO descendants. Primary source is the single delineating case series (PMID:39405200, full text cached), which supplies the cohort phenotype frequencies (n=11), the variant spectrum, and the mouse, Xenopus and SH-SY5Y functional data. Mechanism background from PMID:29931089 (DDX17 and REST), PMID:35007564 (DDX5/DDX17 in NTERA2 neural differentiation), PMID:31851931 (microRNA processing) and PMID:24275493 (splicing). Pathograph: DDX17 haploinsufficiency leads to dysregulated neurodevelopmental gene expression, impaired cortical neuronal migration and impaired axon outgrowth, which converge on disrupted cortical circuit development and the neurodevelopmental phenotypes. Model-to-phenotype and expression-to-cellular edges are marked INDIRECT where the source only proposes them. Facial and limb features, macrocephaly and hypotonia are left unconnected because no source explains them. Deep research: one OpenScientist report (research/DDX17-related_Neurodevelopmental_Disorder-deep-research-openscientist.md), 15/15 references resolved, 32/33 terms resolved, preflight-dr WARN only for REST, which is a genuine co-regulator here, not a second disease. Report claims not used: the OMIM MRD73 identifier and the ClinVar variant table (no source given), and its cohort frequencies for ID (7/11) and ADHD (5/11), which differ from the paper's 7/10 and 5/9. No GeneReviews chapter (just check-genereviews --online: NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (55/55), validate-disorders, check-entity-refs, check-causal-targets and the ratchet gates.

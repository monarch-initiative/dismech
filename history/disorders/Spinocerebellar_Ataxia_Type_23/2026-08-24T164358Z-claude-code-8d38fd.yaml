  summary: 'Create: Spinocerebellar Ataxia Type 23 (PDYN)'
  details: |
    De-novo creation of the SCA23 entry, MONDO:0012449, claimed via issue #9389.

    Deep research: `just research-disorder claude_code`. NEC preflight PASS (PDYN
    dominant at 38 mentions; report OMIM 610245 matches the MONDO xref). The report
    was generated without a reference_validation block, so one was retro-fitted with
    `just validate-research-reference`: 15/15 references resolved, 1/1 quoted claim
    valid, 11/15 on topic and 0 off topic (the remainder undecided). The report was
    notably good on this disorder - it surfaced the gene-validity controversy
    unprompted and told the curator to treat PDYN-SCA23 causality as contested.

    The defining curation decision for this entry is how to handle that
    controversy. In 2016 Brain published a correspondence titled "SCA23 and
    prodynorphin: is it time for gene retraction?" and the original authors replied
    in the same issue. Both cache as metadata only, content_type unavailable, with
    zero-length bodies, so neither can supply a snippet. The controversy is
    therefore recorded as a CONTROVERSY discussion whose rationale states the
    challenge exists and cites both letters as top-level references, while
    explicitly declining to assert their specific arguments. In particular the
    report's claim that "7 of 9 originally published SCA23 variants were
    subsequently found in ExAC" is NOT curated: no quotable source for it was found,
    PMC has no version of either letter, and the figure would otherwise rest on the
    deep-research report alone.

    What could be said from quotable sources was said instead, and it is
    independently damaging to a simple gene-disease story: the functional evidence
    is variant-specific rather than uniform (L5S shows increased degradation and no
    aggregation, the opposite of R6W and R9C), and wild-type dynorphin A was among
    the most toxic peptides in the same cerebellar neuron assay that found R6W
    toxic, while the opioid-to-NMDA receptor switch invoked to explain R6W toxicity
    was explicitly not observed for wild-type. That tension is curated as its own
    KNOWLEDGE_GAP, because it bears on whether the mouse-model authors' therapeutic
    proposal - lower the mutant peptide - targets the right variable.

    Content: 6-node pathograph from the PDYN missense variant through altered
    dynorphin A secondary structure, persistent peptide elevation and the
    opioid-to-NMDA receptor switch, to Purkinje cell degeneration with climbing
    fibre retraction and progressive cerebellar ataxia. Three nodes conform to
    `cerebellar_purkinje_degeneration`; the module's Purkinje calcium and
    proteostasis amplifier is deliberately NOT claimed, because no calcium or
    protein-quality-control measurement exists in SCA23 and NMDA excitotoxicity
    implying calcium entry is an inference rather than a measurement here. 4
    phenotypes, genetic, prevalence, progression, diagnosis, the PDYN R212W knock-in
    mouse with two modeled_mechanisms links and readouts, and 2 discussions.

    No treatments block: no disease-modifying therapy exists or has been trialled,
    and the supportive care common to progressive ataxias is not specific to or
    evidenced for this disorder. The mouse authors' therapeutic proposal is recorded
    as a proposal in the animal-model section rather than presented as a treatment.

    Evidence discipline: hedges in the sources are preserved rather than upgraded.
    The convergence framing ("We propose that the pathology of SCA23 results from
    converging mechanisms...") is graded PARTIAL; the original report's "may lead to
    glutamate neurotoxicity" is graded PARTIAL; the dysarthria item is graded
    PARTIAL because the quoted sentence characterizes the SCA class rather than
    SCA23 specifically.

    Validation run and read: `just validate` (schema, terms, 33/33 snippets verified
    first pass); the six ungated CI gates all clean; `just check-snippet-boundaries`
    and `just check-not4curation` clean; `just validate-disorders` over the changed
    file; the conforms_to foreign-key test passes. Weighted compliance 92.2%.

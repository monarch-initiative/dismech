  summary: 'Address PR #9395 review: developmental arm, reference consumption, phenotypes,
    treatments, histopathology'
  details: |
    Addresses the CRITICAL finding and all five IMPORTANT findings from the automated review.

    CRITICAL - PMID:33043513 unconsumed, and contradicting a stated rationale. Two things were wrong. First, the entry twice asserted that no calcium-handling measurement has been made in SCA23; that paper reports altered expression of several critical Ca2+ channel subunits in the R212W mouse, so the assertion was too broad. Both passages are narrowed to state precisely what was and was not measured - an expression change in channel subunits, with the authors' own hedge that this is 'potentially contributing to altered Ca2+ transients', and no transient, buffering or store-release measurement anywhere - and the paper is now cited at the point the rationale is made. The non-conformance to the module's Purkinje Cell Calcium and Proteostasis Dysregulation amplifier stands, but on the correct grounds, and a new calcium_handling_in_sca23 KNOWLEDGE_GAP records the gap with the imaging experiment that would close it.

    Second, the developmental mechanism that paper reports was entirely unmodelled. Added a seventh pathophysiology node, Cerebellar Developmental Deficit in Purkinje Cell Innervation, carrying the reduced GABAergic synapses on Purkinje cell soma from two weeks, the delayed early-phase climbing fibre elimination, the failure of climbing fibres to reach terminal height, and the parallel-fibre takeover evidenced by increased vGlut1. It is wired from the elevated-peptide node and to the degeneration node, both as INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence, because neither causal step is established. A new developmental_versus_degenerative HUMAN_MODEL_MISMATCH discussion records the translational question - the mouse is abnormal at two weeks, humans present at a mean of 43 years - with three readings compatible with current evidence and two experiments that would separate them.

    IMPORTANT 2 - reference under-consumption. Now consumed: PMID:34944698 (KOR potency falls for both G-protein and beta-arrestin branches, plus the molecular-modelling rationale as a separate COMPUTATIONAL item), PMID:15306549 and PMID:19089525 (human autopsy neuropathology), PMID:23108490 (independent 0.1 percent frequency in 852 patients, and the front-line testing recommendation), PMID:32587707 (which the fetcher upgraded from abstract_only to full_text_xml during this round, supplying per-patient examination findings), PMID:35081319, PMID:35239817, and the 2026 Cerebellum case DOI. References went from 7 to 16, snippets from 33 to 73.

    IMPORTANT 3 - phenotypes. Went from 3 to 10: cerebellar atrophy, hyperreflexia, cerebellar tremor, nystagmus, abnormal saccadic eye movements, parkinsonism, dysphagia. All are SCA23-specific observations. The review's other suggestions - decreased vibratory sense, peripheral neuropathy, ocular dysmetria, Babinski sign - are deliberately declined and the notes say why: their sources describe the spinocerebellar ataxias as a class, and the one SCA23 series with a per-patient examination table records Babinski sign absent in all five patients and sensory deficits absent in all four assessed. Curating them would assert of SCA23 something a primary source contradicts.

    An attempt to ground those properly from Orphanet's own phenotype table was abandoned and recorded: just refresh-orphadata fails a sha256 check on en_product1.xml because Orphadata has published a release newer than the pin in data/orphadata/MANIFEST.yaml, and the recipe aborts before fetching en_product4.xml, the file that carries phenotypes. The cache file generated in that state had no phenotype section and would have been derived from an unpinned snapshot, so it was discarded rather than committed.

    IMPORTANT 4 - genetic depth. Added variant class and distribution (eight variants, six within residues 207-236, the big-dynorphin coding region), incomplete or age-dependent penetrance with the asymptomatic-parents observation, and the homozygote dosage effect - all four with their own evidence, two classified PARTIAL to preserve the authors' hedges.

    IMPORTANT 5 - treatments. A treatments block now exists with one entry, multidisciplinary rehabilitation, because one SCA23 patient was actually referred for it. Its target_mechanisms link points at the clinical endpoint with MODULATES, not at any mechanistic node, and no outcome is claimed because none is reported.

    IMPORTANT 6 - histopathology. Three findings from the founding family's autopsy: neuronal loss across Purkinje cell layer, dentate nuclei and inferior olives; demyelination of the spinal cord posterior and lateral columns; and the ubiquitin-positive nigral intranuclear inclusions, curated as a documented negative because the reporting neuropathologists judged them incidental Marinesco bodies. All three are left unbound, with the reason stated per finding: HistopathologyFindingTerm is reachable only from the NCIT Histopathology Result branch, and neither HP:0002529 nor NCIT:C117277 is a member.

    Also added an MSA-P differential (the presentation that actually misdirects diagnosis) and a second diagnosis entry on where SCA23 sits in the ataxia testing sequence.

    Validation: just validate (71/73 snippets verified, 2 skipped by prefix as DOI), just validate-terms, just validate-disorders, pytest -k Spinocerebellar_Ataxia_Type_23 (16 passed), all six ungated CI gates plus check-snippet-boundaries and check-not4curation - clean. Global compliance 91.7 percent.

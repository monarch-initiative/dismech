  summary: 'Create: Hantavirus Hemorrhagic Fever with Renal Syndrome (MONDO:0005784)'
  details: |
    New disease entry for the Old World / renal arm of human orthohantavirus disease, created by the curation-scanner run on issue #6321 ([lit-scan] Hantavirus Infections, PMID:42430118). HFRS was absent from the KB even though its New World sibling Hantavirus_Pulmonary_Syndrome (MONDO:0017879) was already curated.

    Pathograph: 11 nodes running from aerosol exposure, through beta3 integrin-mediated entry into endothelium, platelets and macrophages (PMID:10196290), to noncytopathic microvascular endothelial infection, then three parallel proximal leak arms (IL-6 trans-signaling PMID:40203030; VEGF/VE-cadherin PMID:20810734; factor XII kallikrein-kinin/bradykinin PMID:23874198) plus a cytotoxic T cell arm (PMID:21994770), converging on the hub node "Increased vascular permeability and capillary leak", then to acute thrombocytopenia with haemorrhage and to oliguric acute kidney injury, then staged renal recovery.

    Epistemics were deliberately preserved rather than smoothed. Three competing mechanistic_hypotheses are curated (vegf_ve_cadherin_model CANONICAL, kallikrein_kinin_model ALTERNATIVE, t_cell_immunopathogenesis_model ALTERNATIVE) with the relevant causal edges opted into the matching hypothesis_groups. A REFUTE evidence item sits on the VEGF node quoting the three-dimensional vessel experiment in which VE-cadherin degradation did not reproduce. A CONTROVERSY discussion records the tension between the three leak models and why the choice is therapeutically consequential. A HUMAN_MODEL_MISMATCH discussion records that the canonical VEGF evidence comes from the HPS-associated Andes virus in lung endothelium rather than from an Old World agent in renal endothelium, with the Old/New World tropism difference evidenced by PMID:40857262. An OPEN_QUESTION discussion records the tension between the positive 1991 ribavirin randomised trial (PMID:1683355) and the 2023 Lancet Infectious Diseases statement that no effective antiviral is available (PMID:37105214); that same statement is also carried as a REFUTE evidence item on the ribavirin treatment rather than being omitted.

    Four subtypes are curated with severity-stratified evidence: HTNV, SEOV, PUUV, DOBV. The Seoul virus urban and pet/feeder-rat emergence route is curated from PMID:33801789 and PMID:31319534, matching the SEOV focus of the triggering review.

    Validation: just validate passes all three stages. Schema clean, term validation passed, and 73 of 73 snippets verified against cached references. All 15 references were fetched with just fetch-reference; no cache file was hand-written. All ontology terms (MONDO, HP, CL, GO, CHEBI, NCIT, NCBITaxon) were verified with OAK or the OLS API before the YAML was written.

    Two snippets quote typographical errors that are present in the published abstracts (HRFS for HFRS in PMID:36851775, and Apodernus agraricus for Apodemus agrarius in PMID:35384417). They are quoted verbatim so that reference validation succeeds against the cached text; corrected forms appear in the surrounding descriptions and the choice is documented in the entry notes.

    Deliberately not curated, and listed as explicit follow-ups in the entry notes: histopathology (acute tubulointerstitial nephritis with medullary haemorrhage), HLA-linked genetic susceptibility, country-level quantitative incidence, and the Hantavax vaccine.

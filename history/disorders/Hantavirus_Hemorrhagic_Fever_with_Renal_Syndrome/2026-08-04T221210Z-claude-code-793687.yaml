  details: |
    PR Shepherd fix pass on PR #7936, addressing the ai4c-reviewer CHANGES_REQUESTED review.

    Blocking items:
    1. Diagnosis claim-evidence mismatch. Replaced the unsupported PMID:36851775 snippet on the "Hantavirus serology and viral RNA detection" entry with two exact quotes from the already-cached full text of PMID:35384417 - the four laboratory modalities (serology, molecular techniques, viral isolation, immunochemistry) and IgM/IgG serology as the most often used HFRS diagnostic test.
    2. Missing prevalence block. Added five structured ANNUAL_INCIDENCE records quoting PMID:35384417 verbatim: worldwide ~100,000 cases/yr; China >90% of global cases; HTNV-related HFRS 10,000-20,000/yr in China and 300-900/yr in Korea (both subtype-scoped to HTNV HFRS); Europe >9,000/yr. rate_per_100000 and prevalence_class are deliberately omitted - the source reports absolute annual case counts with no denominator population, so converting to a rate would require an external denominator it does not supply. That choice is recorded in the entry notes.
    3. Hantavax omission. Added a vaccination treatment (NCIT:C15346 Vaccination, therapeutic_modality VACCINE) curated as PARTIAL because the same source sentence reports the protective response to be short-lived, and softened the prevention treatment's "no widely available vaccine" phrasing to "no globally available vaccine - Hantavax is licensed only in Korea and its protection is short-lived".
    4. Prevention treatment_term semantics. NCIT:C15747 Supportive Care -> NCIT:C15843 Preventive Intervention.

    Suggestions also applied:
    6. Serial urinalysis diagnosis_term NCIT:C25294 Laboratory Procedure -> NCIT:C17241 Urinalysis.
    7. Evidence-backed frequency bands from PMID:35384417 on three previously frequency-less phenotypes: Fever VERY_FREQUENT (94.0%), Abdominal pain FREQUENT (64.0%, source wording "abdominal discomfort"), Headache FREQUENT (50.7%). Each carries its own evidence item quoting the frequency sentence.
    8. Ribavirin target_mechanisms retargeted from "Acute kidney injury with oliguric renal failure" to "Noncytopathic microvascular endothelial infection", since the nucleoside analogue acts on viral replication; the clinical outcome remains in target_phenotypes.

    Not done, with reasons: item 5 (deep-research artifact for a new entry) is a curation-workflow requirement outside a shepherd fix pass and is flagged for the PR author; item 9 (leptospirosis/dengue differentials) is not stated in any reference cached in this PR, so it is deferred in notes rather than asserted without a quotable source; item 10 (splitting the mixed-source PMID:21994770 item) would duplicate one sentence under two evidence_source values, which is left for the author to arbitrate.

    Validation: `just validate` clean (schema + terms + references); 83/83 snippets verified against cached references, up from 73/73. Reference-cache requoting churn produced by the validator was reverted and is not part of the commit; the only cache changes are two single-line NCIT insertions for NCIT:C17241.

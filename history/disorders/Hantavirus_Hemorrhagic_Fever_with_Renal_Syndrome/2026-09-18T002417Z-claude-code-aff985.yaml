  summary: Declare conforms_to on the viral hemorrhagic fever syndrome module
  details: |
    Added conforms_to: viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability to the 'Increased vascular permeability and capillary leak' pathophysiology node, wiring this entry to the new shared mechanism module created when the Viral_Hemorrhagic_Fever umbrella Disease entry was retired (design decisions section 3e, rules R4 and R24; issue dismech#10115). The module's central effector is the increased vascular permeability that every viral hemorrhagic fever funnels through, and this node is this disease's instance of it.

    The conformance is also what satisfies the CONFORMS_TO_MODULE membership criterion of the new kb/groupings/Viral_Hemorrhagic_Fevers.yaml grouping, which lists this entry as a member. No other content was changed: nothing from the retired umbrella entry was merged in, because every phenotype and treatment it carried that belongs to this disease was already present here.

    Also relocated the dataset geo:GSE245916 (Seoul orthohantavirus infection of human and rat lung microvascular endothelial cells) here from the retired umbrella entry. It is an HFRS dataset -- the GEO summary names the syndrome -- and had only ever been on the umbrella because scripts/discover_datasets.py indexed it there. Its GEO cache file references_cache/GEO_GSE245916.md is already committed, so verification is offline.

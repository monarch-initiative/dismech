  summary: 'Create: Pelvic Inflammatory Disease MONDO:0000922'
  details: |
    New disorder entry for pelvic inflammatory disease, curated from the obstetrics/gynaecology coverage-gap punch list in issue #7837. Fourteen pathophysiology nodes running from cervical colonization through ascent, intracellular persistence, neutrophil/TNF-driven ciliated-epithelium sloughing and cHSP60 immunopathology, to tubal fibrosis and the three reproductive sequelae; a parallel bacterial-vaginosis entry route; and subclinical endometritis and treatment delay as separate nodes. Two nodes conform to intracellular_pathogen_persistence. Conformance to fibrotic_response, bacterial_protein_synthesis_inhibition and bacterial_cell_wall_synthesis_inhibition was considered and deliberately withheld for lack of node-level evidence, and the reasons are recorded in the entry notes. The Ectopic pregnancy phenotype is left unbound because HP:0031456 sits outside the HP:0000118 PhenotypeTerm enum root, a fifth instance of gap 3 in issue #7837. Validation: schema and term validation clean; count-verified-snippets reports 74/74 snippets verified against cached references; check-title-snippets OK; validate-disorders run as the pre-PR sweep.

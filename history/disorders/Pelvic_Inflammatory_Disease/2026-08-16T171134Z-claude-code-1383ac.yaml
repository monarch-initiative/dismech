  details: |
    PR Shepherd pass addressing the ai4c-reviewer CHANGES_REQUESTED review on PR 8634.

    (1) Replaced the Ceftriaxone target_mechanisms snippet, which quoted only the
    doxycycline/metronidazole oral backbone and never mentioned ceftriaxone, with two
    ceftriaxone-specific quotes from the cached CDC STI Treatment Guidelines full text
    (PMID:34292926): that ceftriaxone has better coverage against N. gonorrhoeae, and that
    PID regimens must be effective against N. gonorrhoeae and C. trachomatis because negative
    endocervical screening does not rule out upper genital tract infection.

    (2) Added five missing clinical phenotypes, all bound to HPO terms already present in
    cache/hp/terms.csv and the phenotypeterm enum cache: Fever (HP:0001945), Abnormal vaginal
    discharge (HP:0034269), Cervicitis (HP:0030160), Dyspareunia (HP:0030016), Abnormal
    uterine bleeding (HP:0034263). Frequency bands were deliberately omitted on all five: the
    CDC additional-criteria list establishes these as recognized findings without quantifying
    them, and the majority-finding sentence is a disjunction with wet-prep leukocytes, so it
    does not license a majority rate for discharge alone.

    (3) Added a biochemical section with elevated ESR, elevated CRP, and vaginal fluid
    leukocytes on saline microscopy, all quoted from the same cached guideline.

    (4) Corrected the location on the Loss of Vaginal Lactobacillus Dominance node from
    UBERON:0000002 uterine cervix to UBERON:0000996 vagina; the node description and its
    bacterial-vaginosis evidence are about the vaginal community.

    (5) Added the CDC's own statement that the optimal regimen and long-term outcome of early
    treatment of subclinical PID are unknown to the pid_subclinical_treatment_failure
    KNOWLEDGE_GAP, which previously argued the point without quoting a source stating it.

    Not addressed: the review's finding 5 (no deep-research artifact). No DR report was
    fabricated; the gap remains disclosed in the entry notes and the PR body.

    Validation: just validate-disorders (batched schema + terms + references, --no-full-text)
    passed; just count-verified-snippets 84/84 verified, up from 74/74; just
    check-title-snippets clean; just check-term-cache-integrity OK. The two cache rows
    (cache/uberon/terms.csv, cache/enums/anatomicalentityterm) were written by
    linkml-term-validator and ordered with just normalize-cache, not hand-edited.

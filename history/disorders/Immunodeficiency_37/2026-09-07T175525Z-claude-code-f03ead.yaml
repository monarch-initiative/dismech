  summary: 'Create: Immunodeficiency 37 (BCL10 deficiency)'
  details: |
    De novo curation of MONDO:0014491 (immunodeficiency 37), the autosomal recessive combined immunodeficiency caused by biallelic BCL10 loss of function. Pathophysiology is curated as a causal chain from the CARD-domain lesion through CBM signalosome assembly failure, loss of antigen-receptor NF-kappaB signalling, arrested lymphocyte activation, failure of memory B and T cell generation, and hypogammaglobulinemia to the infection phenotype, with a parallel non-haematopoietic branch for the fibroblast innate-signalling defect that the founding report is named for. 53 evidence snippets, all exact-quote verified against the reference cache. Deep research: one openscientist run, committed; its reference validation resolved 16/16 citations but flagged one unsupported quote (PMID:30283440), which is not used. The report contributed two references the manual literature search had missed, the CBM filament structure (PMID:24074955) and the Bcl10-null mouse (PMID:11163238); every snippet was taken from the cached reference text rather than from the report. Validated with just validate (schema, terms, references), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading, all passing.

  summary: 'Review round 1: correct Treg claim, add three phenotypes'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES on PR #11379. Both blocking findings were verified against the cached primary sources before acting, and both held.

    Finding 1, failure to thrive omitted: added Failure to thrive (HP:0001508) with evidence from PMID:38159157 and PMID:42473108. Frequency set to OCCASIONAL rather than the FREQUENT band the deep-research table suggested, because it is documented in two of seven reported patients (29 percent) and growth is not systematically reported across the series; the description says the band is a floor rather than an estimate.

    Finding 2, the regulatory T cell claim was wrong: the entry said the Treg reduction was a single-patient mass-cytometry finding that conventional flow cytometry would not have resolved. PMID:42473108, already cited elsewhere in the same entry, contradicts both halves. It measured Tregs by conventional flow cytometry with intracellular FOXP3, Helios and CTLA-4 staining and found them markedly reduced with a preserved residual population, and it describes reduced or absent Tregs as a typical cross-patient feature citing five prior reports. The phenotype now carries frequency FREQUENT with three evidence items, and the discussion was narrowed to NK and gamma-delta T cells, which remain genuinely single-patient. Note the reviewer suggested grouping Th17 with the single-patient subsets; that was not done, because PMID:42473108 reports Th17 increased rather than reduced.

    All five reviewer suggestions taken in the same push: chronic diarrhea (HP:0002028) curated separately from colitis; BCGitis (HP:0020086) for the localized suppuration at the BCG vaccination site, with the description recording that the source does not state culture confirmation; the newborn-screening diagnosis claim re-pointed to PMID:38159157, which is the paper that reports it; the R88X gnomAD minor allele frequency added to the genetic section; and the TLR3-independence result added to the fibroblast node to bound the defect from the other side.

    Three snippets initially failed the pre-commit exact-substring check because non-ASCII characters in the cached text had been normalized during transcription (a non-breaking space in '3 months' and U+2010 hyphens in 'early-onset'). All were re-extracted programmatically from the cache. One of those edits broke the YAML by inserting a multi-line snippet; repaired and re-parsed before validating.

    Validated: just validate (62/62 snippets), just validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence. No cache churn: every reference used was already committed in this PR.

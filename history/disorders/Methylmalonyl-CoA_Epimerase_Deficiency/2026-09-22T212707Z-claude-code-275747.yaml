  summary: 'Create: Methylmalonyl-CoA Epimerase Deficiency (MONDO:0009615)'
  details: |
    New Disease entry for MCEE deficiency, curated as increment row 1.2.2.01 of the metabolic WP-001 package (issue #5556). Curated as a standalone entry rather than a subtype of Methylmalonic_Acidemia: distinct enzyme and pathway step, distinct MONDO term, and a partial rather than complete block that makes it present as propionic acidemia. Pathograph: MCEE loss of function -> two molecular routes to enzyme loss (truncation/NMD vs misfolding vs active-site loop distortion) -> partial block of the propionate-to-succinate pathway -> metabolite accumulation -> acute decompensation under catabolic stress -> a deliberately PROVISIONAL neurological-injury node. The provisional marking records the published sepiapterin reductase (SPR) co-inheritance confounder at 2p13.3 and the absence of any genotype-phenotype correlation; two REFUTE evidence items carry that. Validation: schema clean, term validation clean, 84/84 snippets verified against newly fetched cached references, duplicate-key/entity-ref/causal-target/qualifier-term/enum-value/folded-hyphen/snippet-length/title-snippet/snippet-grading/coarse-phenotype/reference-title/case-collision gates all clean, GeneReviews chapter PMID:20301409 tagged, 12 of 13 phenotypes causally connected. Two PMIDs written from memory resolved to unrelated papers and were discarded; recorded in the entry notes.

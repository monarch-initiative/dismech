  summary: 'Address review on PR #10450 (POT1-TPD)'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10450. Three blocking items and most of the suggestions.

    Item 1, reference_title: added to all 28 evidence items (now 38 after the additions below), taken verbatim from each references_cache frontmatter.

    Item 2, GeneReviews DIAGNOSIS/TESTING unmined: added a diagnosis: block carrying the GeneReviews statement of how the diagnosis is established, plus the Andreotti 2024 caveat that the non-melanoma associations partially lack evidence. The reviewer's point that an entry built entirely on telomere length should say telomere-length measurement is not diagnostic is captured in the block description.

    Item 3, Pot1a R117C knock-in mouse: PMID:35727838 was cached by this PR and unused. It is now an animal_models entry with two modeled_mechanisms links. RECAPITULATES against the elongation node, carrying two readouts (telomere length INCREASED, and telomerase dependence ABOLISHED on a Tert-null background), and RECAPITULATES against Angiosarcoma with a spontaneous-incidence readout. Limitations record that mouse Pot1a and Pot1b split the functions of the single human protein, and that the model reproduces only the angiosarcoma arm of the spectrum.

    Suggestions taken: the p.Tyr36Cys sentence is a structural prediction, so its evidence_source went HUMAN_CLINICAL to COMPUTATIONAL. GO:0000723 (telomere maintenance) on the replicative-capacity node was an approximate binding describing the upstream telomere state rather than that node's claim; it is replaced by GO:0090399 (replicative senescence) with modifier DECREASED. Four CL cell types added to that node (melanocyte, endothelial cell, B cell, glial cell) so the lineage restriction is queryable. Andreotti's argument against automatic maximal surveillance added to the treatment evidence. BAP1-related tumor predisposition and familial melanoma added to differential_diagnoses.

    The frequency point was accepted and handled in prose rather than by changing values: the entry description now states that the tumor frequency bands are a curator-assigned ordering of spectrum consistency, not measured rates, and should not be read as risk estimates.

    Not done, with reasons. Genetic.case_fractions from PMID:32987645 (Wu 2020) could not be added because that record is cached abstract_only and the per-cohort fractions sit in the full text; the reference is recorded in the top-level references: block instead. The Ashkenazi founder allele was likewise not addable from cached text.

    One defect was introduced and caught: the top-level references entry for PMID:32987645 initially carried an explanatory sentence appended to the title, and the validator checks that title against the cache. The title now matches exactly.

    Validation: validate-disorders passes; 38/38 snippets verified; 38/38 evidence items carry reference_title; entity-ref, causal-target, duplicate-key, enum-value, title-snippet, snippet-length and snippet-grading gates all clean.

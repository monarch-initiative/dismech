  summary: 'Take review suggestions on PR #10450 (POT1-TPD)'
  details: |
    Second response round on PR #10450, after the reviewer approved the blocking fixes and left six non-blocking notes. Four taken.

    The substantive one was fidelity on both Pot1a R117C mouse links, changed from HIGH to MODERATE. The entry contradicted itself: its own limitations lines said the Pot1a/Pot1b paralogue split bounds extrapolation to human POT1, and that the model covers only the angiosarcoma arm of a four-tumour spectrum, while the fidelity grade said the model captures the human mechanism faithfully. MODERATE is what those caveats already imply. This was the same misreading of the slot made on the SGBS1 entry in this series, where HIGH sat on a FAILS_TO_RECAPITULATE link; in both cases the value being encoded was how well characterised the result is rather than how faithfully the model maps to human biology, which is not what the slot means.

    Also taken: diagnosis_term bound to NCIT:C15709 (Genetic Testing), matching 416 other disorder entries; the telomerase-dependence readout now states that it is measured in Pot1a+/ki Tert-/- double mutants rather than the declared Pot1a+/ki genotype, since the comparison is the experiment and a reader should not have to infer it; and the GeneReviews genetic counseling gap closed with the 50% per-child transmission figure on inheritance and cascade testing of first-degree relatives as a treatment, carrying the age-18 threshold and its early-cancer exception.

    Not done, and the reason is the same for both. Genetic.case_fractions and the Ashkenazi p.Ile78Thr founder allele both need PMID:32987645 as full text; it is cached abstract_only, and the per-cohort figures the reviewer quoted (4/105, 7/56, 2/55) appear in the deep-research report rather than in anything a snippet can be verified against. Copying them from the report into a citation is the fabrication risk the evidence SOP exists to prevent. Re-fetching that paper as full text makes both straightforward. PMID:38573059 stays uncited for the same reason: its POT1 content could not be isolated to a quotable sentence.

    Validation: 41/41 snippets verified; validate, reference-titles, entity-refs, causal-targets, duplicate-keys, enum-values and snippet-grading all clean.

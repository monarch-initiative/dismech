  summary: 'Create: POT1 Tumor Predisposition Syndrome'
  details: |
    De novo curation of POT1 tumor predisposition (MONDO:0014368, POT1) from a falcon/Edison deep-research report (research/POT1_Tumor_Predisposition_Syndrome-deep-research-falcon.md), with the GeneReviews POT1 Tumor Predisposition chapter (PMID:33119245) as the phenotype baseline.

    This was the cleanest of the three reports: its own validation recorded 9/9 references resolved and 17/17 terms resolved, with 7 of 9 references assessed on topic. It cited by DOI rather than PMID, so every DOI was converted through the PMC ID converter and the PMID cited in preference, per the reference-validator skip-prefix rule.

    Entry-type decision: MONDO places this term under two susceptibility parents (susceptibility to familial cutaneous melanoma, glioma susceptibility) and several synonyms are locus-style labels, which is the shape the claim-disease guidance treats as usually out of scope. It is curated as a DISEASE because it is a single-gene syndrome with one conserved mechanism upstream of a defined tumor spectrum and published surveillance guidance, matching the germline predisposition syndromes design decisions section 3a keeps as their own entries. The file is named POT1_Tumor_Predisposition_Syndrome rather than the MONDO label, which remains the disease_term binding.

    Mechanism is curated with its open question intact rather than resolved. Calvete 2015 (PMID:26403419) measured reduced telomere-bound POT1, long telomeres and increased fragility in human carriers; Kim 2021 (PMID:33934394) found no telomere damage response in CRISPR-engineered hESCs and HSCs and argues elongation is the selected property. The instability node carries mechanism_confidence PROVISIONAL and a REFUTE item from Kim, and an OPEN KNOWLEDGE_GAP discussion records the elongation-versus-instability question with the authors' own statement that it is unclear.

    Named Entity Confusion preflight PASS (POT1 mentioned 69 times; report OMIM 615848 matches MONDO). Validation: just validate passed; 28/28 snippets verified; validate-terms passed; check-entity-refs and check-causal-targets clean; whole-KB gates clean. Stub stubs/Tumor_Predisposition_Syndrome_3.yaml deleted.

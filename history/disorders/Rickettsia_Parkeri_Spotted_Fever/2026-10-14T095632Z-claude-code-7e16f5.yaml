  summary: Bind LOINC group-level SFG serology code to the multi-test eschar diagnosis
    row
  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and diagnosis[].measurements binding LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Eschar-focused clinical diagnosis with molecular confirmation row. That row bundles four distinct test modalities -- PCR, immunohistochemistry, culture, and paired serology -- and only the serology arm is coded by LOINC:22474-1, since the row's own description names 'serologically cross-reactive species', matching the group-level scope of this code. Per the multi-test-row completeness rule, a sentence stating which part is coded ('The bound LOINC code, 22474-1, identifies the group-level serology arm named here as cross-reactive; PCR, immunohistochemistry, and culture are not themselves coded.') was added to the row's own description field in the entry, not only here. No new cache/loinc/terms.csv row was required -- 22474-1 was already cached from earlier LOINC tranche-B batches. This entry was previously rejected in an earlier batch under the assumption that no matching code existed; re-reading the row's text this round showed the already-cached group-level code is the correct binding for its serology component.

  summary: 'Create: Kariminejad Neurodevelopmental Syndrome (RBSN FYVE-domain disorder)'
  details: |
    New DISEASE entry for MONDO:0975795, the RBSN FYVE-domain disorder.

    The lump/split decision this entry exists to make. The stub left entry_type UNDECIDED and set out the question: RBSN has two named Mendelian disorders and whether the second is a distinct DISEASE or a has_subtypes row on the first had not been settled. Curated as DISEASE, on three independent grounds. The alleles segregate cleanly by phenotype, with ClinVar keying p.Arg180Gly and p.Gly183Arg to this condition and p.Gly97Arg to MONDO:0975797 - an assignment recorded in the already-curated sibling entry, whose curator read the ClinVar records through the NCBI esummary API on 2026-09-19, and which this entry relies on rather than re-deriving. The phenotypes do not overlap: this disorder is neuromuscular and cognitive, the sibling is a congenital bone marrow failure syndrome. And the cellular defects are different and were measured in the same paper, which concludes explicitly that distinct germline RBSN mutations cause non-overlapping phenotypes with discrete endolysosomal defects. MONDO agrees - the two are separate terms and neither descends from the other, so a has_subtypes row would have asserted a hierarchy the ontology does not carry. The automated second-opinion comment on claim issue #12393 reached the same conclusion independently.

    The mechanism is unusually clean and is the reason the entry is worth reading. The two alleles sit three residues apart in the FYVE finger, abolish PI3P binding, and so prevent rabenosyn-5 reaching the early endosome at all. Yet endosomal recycling is unaffected; what accumulates in patient fibroblasts is cargo tagged for lysosomal degradation. The authors call these separation-of-function alleles. That selectivity is curated as its own node, because it is the claim the whole nosology rests on: if the FYVE alleles impaired both arms there would be no principled reason to separate this disorder from the RBSN myelofibrosis syndrome.

    A schema gap recorded as a CURATION_TODO rather than worked around: FunctionalImpactEnum has no value for a separation-of-function allele. The genetic_context records LOSS_OF_FUNCTION, which is true and loses the point - a query for LOSS_OF_FUNCTION returns this variant next to alleles that simply destroy their gene product. PARTIAL_LOSS_OF_FUNCTION and HYPOMORPHIC both mean reduced activity rather than selectively lost activity and would be different and wrong claims. Whether this warrants a schema change is genuinely open; recorded so the next curator meeting such an allele finds a precedent rather than inventing a convention.

    A live disagreement between an automated aggregator and a careful human read, carried as a CONTROVERSY discussion. Monarch's HPO annotation set for MONDO:0975795 is sourced in part to PMID:25233840 - the p.Gly425Arg patient the sibling entry deliberately declined to assign to either RBSN disorder. A phenotype list taken from that aggregated set would import intention tremor, ptosis, coxa valga and several dysmorphic features into this entry on the strength of a patient whose membership is disputed, and nothing in the list itself would say which phenotypes came from which paper. This entry's phenotypes section is therefore limited to the four features stated in PMID:35652444, each with an exact quote - which is why it is short. Surfaced by the second-opinion comment.

    Module conformance left unset: kb/modules/ was grepped for endosom, lysosom, traffick, vesicle, Rab, autophag and sorting, and there is no endosomal-maturation or membrane-trafficking module. The lysosomal storage modules were rejected on positive grounds - this is a delivery defect upstream of the lysosome with no storage material described, and conforming would assert accumulation of an undegraded substrate nobody has reported. The second-opinion comment independently flagged the same caution about lysosomal_substrate_accumulation.

    Deep research: an OpenScientist run for this entry was launched with the others in this batch and had not completed when the entry was committed. It will be reconciled in a follow-up round before the pull request is opened.

    Validation. just validate passes with 19/19 snippets verified. just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-coarse-phenotypes all pass. just check-genereviews reports NO_CHAPTER for both collections.

    One evidence defect caught by validation during drafting: a supporting cell-biology item quoted PMID:22308388's title as its snippet. Reference validation rejected it and it was replaced with a result sentence from that abstract - the depletion experiment showing the effect is specific to rabenosyn-5 rather than general to early-endosomal proteins. That is the second title-as-snippet error in this batch of five entries.

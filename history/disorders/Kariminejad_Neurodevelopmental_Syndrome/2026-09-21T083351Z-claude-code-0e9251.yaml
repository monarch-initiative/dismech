  summary: Reconcile OpenScientist deep-research report; wire pathograph
  details: |
    Reconciled the OpenScientist deep-research run and fixed a pathograph inconsistency before opening the PR.

    preflight-dr returns PASS against MONDO:0975795: RBSN mentioned 31 times, no rival gene above 5, and the report's OMIM 620937 matches the MONDO xref.

    The report's single most useful contribution was PMID:26192890, Kariminejad et al. 2015 - the founding clinical description the syndrome is named after, published seven years before the gene was identified. This entry did not cite it at all, which was a real gap. It supplies four things no other source in the entry does: the electrophysiological signs of myopathy alongside non-specific muscle biopsies, the leukoencephalopathy with delayed myelination on MRI in two of the three siblings, the unilateral abduction deficit that is the concrete observation behind the ophthalmoplegia, and the only enumeration of the facial features anywhere in the literature. Every other source calls the face dysmorphic and stops. Two new phenotypes were curated from it, Leukoencephalopathy HP:0002352 and Delayed myelination HP:0012448, both looked up rather than recalled, and three existing phenotypes gained it as a second evidence item.

    Pathograph wiring. The entry previously wired two of its four phenotypes from Delayed Endosomal Maturation with Preserved Recycling and left the other two isolated - but all four rest on the SAME sentence in PMID:35652444, which names them as the four features constituting the disorder. Wiring two and not the other two asserted a distinction between them that no source makes. All six phenotypes are now wired, each with directness INDIRECT and a description saying plainly that no published mechanism connects it to the endosomal defect, which is what the rbsn_cellular_defect_to_tissue_phenotype discussion already records. Coverage is 6/6.

    Term discipline. All three of the report's terms named as a different term findings are artifacts of the validator reading a phenotype table's frequency column as the term name - All (6/6), Frequent, 1 patient - and none is a wrong binding. That is the same false-positive class reported as issue #12415, now seen in a second report. The report also flags GO:0017137 as obsolete, replaced by GO:0031267; this entry uses neither.

    One error caught before commit. Four new evidence items were drafted with a reference_title for PMID:35652444 written from memory rather than copied from the cache frontmatter - Rabenosyn-5 suppresses non-homologous end joining... which is not that paper. The real title is RABENOSYN separation-of-function mutations uncouple endosomal recycling from lysosomal degradation, causing a distinct Mendelian disorder. Corrected and re-checked with check-reference-titles.

    Two fetched references, PMID:17235359 and PMID:18685079, were pruned rather than committed: they are model-organism endosomal-trafficking papers the report cites, and nothing in this entry ended up citing them.

    Validation: just validate-disorders passes, 28/28 snippets verified, up from 19. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-reference-titles all clean.

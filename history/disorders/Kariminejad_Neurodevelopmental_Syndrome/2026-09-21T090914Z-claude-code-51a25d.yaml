  summary: 'Review round 1 on PR #12433'
  details: |
    Addressed the blocking finding and the suggestion from the ai4c-reviewer round on 9cbf37b9a.

    The blocking finding is correct and I created it in the previous round by improving the entry. Adding the founding paper's enumerating sentence to the Abnormal facial shape phenotype falsified the coarse_binding_basis SOURCE_UNSPECIFIED declared directly above it: that basis means the cited source characterises the finding no further, and the new snippet enumerated eight features. The declaration and its own evidence contradicted each other. check-coarse-phenotypes passes either way because it checks that a basis is declared, not that it is true.

    Remedy is the one the coarse-phenotype-bindings skill prescribes: if you can list the findings, they are phenotypes. The eight facial features are now curated individually beside the coarse node - Highly arched eyebrow HP:0002553, Downslanted palpebral fissures HP:0000494, Prominent nasal bridge HP:0000426, Prominent nose HP:0000448, Low hanging columella HP:0009765, Narrow mouth HP:0000160, Narrow palate HP:0000189, Carious teeth HP:0000670 - and the enumerating quote moved onto them. The coarse node keeps only the gene paper's sentence, which names dysmorphism and stops, so SOURCE_UNSPECIFIED is now true of the evidence that remains.

    Every CURIE was verified independently rather than taken from the review. Seven came from the reviewer and all seven check out against cache/hp/terms.csv with matching labels. The eighth, for columella extending below alae nasi, was not supplied: HP:0009765 Low hanging columella was found by searching and confirmed by reading its HPO definition, Columella extending inferior to the level of the nasal base when viewed from the side.

    PATHOGRAPH_HUB was considered for the coarse node, as the review suggested, and rejected. The skill defines a hub by convergence of incoming edges and warns specifically against declaring one on a node that is merely one arm of a wide fan-out. This node is one of fourteen targets of a single upstream node, which is the Rubinstein-Taybi pattern the skill describes.

    All eight new phenotypes are wired from the mechanism node on the same footing as the rest, keeping the internal consistency the previous round established. Coverage is 14/14.

    Suggestion taken: the rbsn_aggregator_phenotypes_include_a_disputed_patient discussion now covers the second exclusion class as well. Global developmental delay, hypotonia, spastic paraplegia, sensorimotor peripheral neuropathy, short stature, elevated creatine kinase and hippocampal atrophy are attributed to this disease by aggregated sources and by the deep-research report, drawing on the second family and OMIM's clinical synopsis. They are omitted because none is quotable - the caches are abstract-only and an OMIM synopsis is not citable here - which is a limit on verification rather than a judgement that the features are absent.

    Stale prose corrected in two places. The discussion said the phenotypes section was limited to the four features from PMID:35652444, which stopped being true when the imaging phenotypes were added. The notes said all six phenotypes are wired, which stopped being true at fourteen. Prose describing repository state rots, and both were rewritten rather than patched.

    Validation: just validate-disorders passes, 43/43 snippets verified, up from 28. check-coarse-phenotypes, check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms all clean. list-disconnected-phenotypes reports 14/14.

  summary: 'Create: Distal Hereditary Motor Neuronopathy Type 5B (REEP1)'
  details: |
    De novo curation of dHMN5B (MONDO:0013884), the REEP1-associated distal hereditary motor neuronopathy. One openscientist deep-research report was generated and preflighted with "just preflight-dr ... MONDO:0013884", which PASSed with REEP1 as the dominant gene mention and matching OMIM 614751. The report surfaced the 2026 mechanistic study PMID:41268727, which was fetched and its quoted sentences verified against the cache before use.

    The mechanism is a toxic gain of function, which is the opposite of the loss-of-function mechanism by which the same gene causes SPG31, and the entry is built around that contrast. Pathograph: REEP1 exon 5 skipping variant, impaired HUWE1-dependent REEP1 degradation, accumulation of shaping-competent REEP1, endoplasmic reticulum fragmentation in spinal motor neurons, spinal motor neuron axonal degeneration, distal motor amyotrophy with upper-limb predominance. The accumulating protein retains membrane-curvature activity in liposome assays, so the lesion is excess of a functional protein rather than absence of it.

    Two mouse models are curated as a matched pair. The exon-5 knock-in RECAPITULATES the spinal motor neuron lesion; the Reep1 knockout is recorded as FAILS_TO_RECAPITULATE because it loses cortical rather than spinal motor neurons and therefore models SPG31, not this disease. That negative link is included deliberately, since the knockout is the model a curator would reach for first when looking for "a REEP1 mouse", and inferences drawn from it about dHMN5B would be reversed.

    The accumulation node uses modifier GAIN_OF_FUNCTION rather than INCREASED because the claim is qualitative - the protein has escaped ubiquitin-proteasome control - which is the trade of ontology grounding for expressivity that CLAUDE.md describes.

    Several phenotype items carry directness INDIRECT on purpose. The HPO annotation set for this disease lists thenar and peroneal atrophy, pes cavus and the reflex findings, but the primary literature for this ultra-rare disorder does not state each in a quotable sentence. The deep-research report offered an electrophysiology quote drawn from a BSCL2 dHMN-V series; that was not used, because quoting a different gene's patients to support this disease's phenotype is Named Entity Confusion reached through the phenotype rather than the gene. The closest true statement about REEP1 disease is cited instead, graded indirect, with the gap named in each explanation.

    Reference titles were initially taken from the deep-research report's paraphrases and were wrong for four PMIDs; the reference validator caught every one, and all reference_title values were rewritten from the cached records.

    Validated with just validate for schema and references, 40 of 40 snippets verified against cached references, plus just validate-terms, just check-entity-refs and just check-duplicate-keys, all passing.

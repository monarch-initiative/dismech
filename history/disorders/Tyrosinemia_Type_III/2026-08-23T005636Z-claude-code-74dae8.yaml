  summary: 'Review follow-up: mouse strain III animal model, pathograph-to-phenotype
    edges, DR artifacts'
  details: |
    Curation-scanner follow-up addressing the CHANGES_REQUESTED review on PR 9189.

    Finding 1 (animal model). The entry asserted "No experimental, animal, or computational model ... was identified". That was wrong: mouse strain III is a spontaneous Hpd-null inbred strain characterised as the murine counterpart of this disorder. Added it to animal_models with three modeled_mechanisms links - RECAPITULATES (fidelity HIGH) against "4-Hydroxyphenylpyruvate dioxygenase deficiency" with hepatic enzyme-activity and immunoblot readouts; RECAPITULATES (HIGH) against "Hypertyrosinemia and phenolic metabolite accumulation" with a blood-tyrosine/urinary-derivative readout plus an UNCHANGED urinary-succinylacetone negative; and FAILS_TO_RECAPITULATE (LOW) against "Neurodevelopmental dysfunction". The last carries the schema-required limitations recording that "apparently healthy" is a gross-observation negative, not neurobehavioural phenotyping. Added a HUMAN_MODEL_MISMATCH discussion (tyrosinemia_iii_mouse_model_neurodevelopmental_silence) with a proposed phenotyping experiment and a three-way decision criterion, and corrected review_notes.

    Finding 2 (disconnected phenotype layer). Added six downstream edges so the pathograph reaches clinical events: "Hypertyrosinemia and phenolic metabolite accumulation" -> Hypertyrosinemia, and "Neurodevelopmental dysfunction" -> Intellectual disability / Global developmental delay / Ataxia / Seizure / Attention deficit hyperactivity disorder. 6 of 9 edges now land on phenotypes, up from 0 of 3. Each edge carries its own exact-quote evidence from an already-cited PMID. causal_link_type is DIRECT rather than INDIRECT_UNKNOWN_INTERMEDIATES because the unknown-intermediate hedge already sits on the upstream metabolite-to-neurodevelopmental-dysfunction edge and these edges are that node manifesting as its named phenotypes; this mirrors Tyrosinemia_Type_II, which hedges the metabolite-to-cognition edge and uses DIRECT for manifestation edges out of a downstream node. Ventriculomegaly was deliberately left unwired - a single unreplicated report the source itself flags as novel, curated PARTIAL.

    Suggestion 4. Moved CHEBI:16169 homogentisate (modifier DECREASED) off the accumulation node onto the upstream enzyme-deficiency trigger node, where a decreased reaction product belongs. The trigger node's existing PMID:11073718 evidence names homogentisic acid as the product of the blocked reaction.

    Finding 3 (deep-research artifact). Two reports committed. The claude_code report is a literature sweep run inside this repository, so it is NOT an independent cross-check of the entry - it says so itself - and is committed for provenance rather than as validation. The falcon report is the independent one. Both were run through just preflight-dr against MONDO:0010162 given the high NEC risk of a numbered series sharing an HPD/nitisinone theme with alkaptonuria and tyrosinemia type I. Both returned PASS with HPD dominant. The falcon pass earned its keep: it surfaced Xie et al. 2019 Nature Communications, PMID:31537781, which neither the original curation nor the review had found. Ttc36-null mice lose hepatic HPD post-translationally through STK33-mediated T382 phosphorylation and PELI1-mediated degradation, develop tyrosinemia, and show hippocampal neuronal damage with learning and memory deficits. That is the direct counterweight to strain III silence, and it materially changes how the HUMAN_MODEL_MISMATCH reads: reduced HPD with tyrosinemia is not inherently neurologically silent in mouse, so the difference between the two strains is most parsimoniously a difference in what was measured. The paper was verified against PubMed and against its cached abstract before use, and it is curated as a second animal model of the low-HPD state, not of this disease - PARTIALLY_RECAPITULATES at LOW fidelity on both links, with limitations recording that there is no Hpd allele, that TTC36 has other substrates, and that adult rodent hippocampal learning and memory is not the human childhood neurodevelopmental phenotype. Its evidence items are marked PARTIAL for the same reason. One snippet had to be trimmed around a non-breaking space in the cached abstract.

    Validation run. just validate (schema + terms + references) passed; snippets 76/76 verified against cached references, up from 51/51; just validate-disorders, the CI-equivalent --no-full-text sweep, also passes 76/76. Ungated CI gates: check-folded-hyphens OK, check-snippet-length OK, check-title-snippets OK, check-duplicate-keys OK. check-environmental-evidence reported 5 findings in Heart_Failure, Lyme_Disease and Merkel_Cell_Carcinoma, none touched by this branch and all an artefact of the branch predating fixes on main; addressed by refreshing the branch from main. pytest tests/test_data.py -k "readout or model or discussion or attaches or reference or research" -> 18049 passed, 1 failed. The single failure is test_evidence_items_have_references on kb/disorders/Machado_Joseph_Disease.yaml and is pre-existing on main: PR 9214 added a STRCHIVE: evidence reference without adding that prefix to the allow-list in tests/test_data.py. That file is untouched by this branch, so the failure is reported separately rather than fixed here. New references PMID:2014797 and PMID:7774914 were fetched with just fetch-reference; no cache file was hand-written.

  summary: 'Create: Tyrosinemia Type III (HPD deficiency)'
  details: |
    New kb/disorders/Tyrosinemia_Type_III.yaml for IEMbase WP-002 row 1.4.03.01 (HPD-related 4-hydroxyphenylpyruvate dioxygenase deficiency), filling the one unfilled enzymatic step of the tyrosine catabolic pathway in the KB: TAT is curated as Tyrosinemia_Type_II, HGD as Alkaptonuria, and FAH as Tyrosinemia_Type_I. Identity was confirmed against MONDO:0010162 before curation - RO:0004003 HGNC:5147 (HPD), OMIM:276710, Orphanet:69723 - matching the seed row exactly, with no entity confusion against tyrosinemia types I and II or against hawkinsinuria (MONDO:0007700, a distinct autosomal dominant disorder of the same gene, deliberately left as open WP-002 row 1.4.04.01). Four-node pathograph: HPD deficiency (trigger) to hypertyrosinemia and phenolic metabolite accumulation (central effector) to urinary 4-hydroxyphenyl organic acids (biomarker) and neurodevelopmental dysfunction (consequence). The neurodevelopmental edge is curated INDIRECT_UNKNOWN_INTERMEDIATES with a PARTIAL counter-citation because the literature reports no correlation between tyrosine level and phenotype; a KNOWLEDGE_GAP discussion carries that reasoning plus a proposed screened-cohort follow-up experiment. A second OPEN_QUESTION discussion records the genetic-versus-pharmacological discrepancy at the same enzyme: nitisinone-induced HPD blockade causes corneal keratopathy while genetic HPD deficiency reportedly does not. No phenotype frequency bands were asserted, for want of defensible denominators. Validation run: just validate PASS; just validate-terms PASS; just count-verified-snippets 51/51 verified against cached references; check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-duplicate-keys all PASS.

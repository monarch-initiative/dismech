  summary: 'Create: Tyrosinemia Type III (HPD deficiency)'
  details: |
    New kb/disorders entry for WP-002 row 1.4.03.01, HPD-related 4-hydroxyphenylpyruvate dioxygenase deficiency, anchored to MONDO:0010162 and HPD (hgnc:5147). Five pathophysiology nodes run from biallelic HPD loss of function through the blocked 4-hydroxyphenylpyruvate-to-homogentisate step to hypertyrosinemia, the 4-hydroxyphenyl organic-aciduria signature, and the variable CNS arm. The CNS edge is typed INDIRECT_UNKNOWN_INTERMEDIATES and carries a KNOWLEDGE_GAP, because the only quantitative literature statement about it is negative: no correlation of genotype, enzyme activity or tyrosine level with cognitive outcome (PMID:10942115). Nitisinone is curated as an INTERPRETATION discussion and deliberately not as a treatment, since it inhibits the already-deficient enzyme. Mouse strain III carries both a RECAPITULATES link for the enzymatic lesion and a FAILS_TO_RECAPITULATE link for the CNS arm. Validation: schema clean, terms clean, and count-verified-snippets reported 64/64 verified against cached references. No deep-research provider report was used.

  details: Added top-level synonyms for humeroradial synostosis; strengthened Syndromic subtype evidence
    with PMID:40673520 and PMID:21146417; added Onset and syndromic Progression entries to progression
    with full-sentence snippets; separated POR-Deficient Cytochrome P450 Steroidogenesis Impairment (GO:0016491,
    GO:0008202, GO:0016125), FGFR2 Gain-of-Function Receptor Signaling (GO:0005007, GO:0004714, GO:0008543,
    GO:0060363), and ESCO2 Cohesinopathy and Sister Chromatid Cohesion Defect (GO:0016407, GO:0034087,
    GO:0035108) from Defective Joint Interzone Specification (GDF6, GDF5, NOG, FGF9, WNT7A; GO:0008083,
    GO:0036122) alongside Retinoic Acid Gradient Disruption (CYP26B1; GO:0004497, GO:0042573); connected
    all 9 phenotypes via downstream edges; linked early-pregnancy fluconazole exposure to POR-Deficient
    Cytochrome P450 Steroidogenesis Impairment; added target_mechanisms and target_phenotypes on the surgical
    treatment entry; added Antley-Bixler syndrome (MONDO:0008803), Pfeiffer syndrome (MONDO:0007043),
    Multiple synostoses syndrome (MONDO:0017923), and Roberts-SC phocomelia syndrome (MONDO:0100253) to
    differential_diagnoses with abstract-prose evidence snippets; and listed all 14 cited PMIDs under

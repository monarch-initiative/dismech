  summary: 'Review: remove overstated conformance edge on the tandem-repeat node'
  details: |
    Adversarial review of conformance edges asserted in this branch. Removed the conforms_to edge from 'Tandem-Repeat-Associated Gene Dysregulation' to the module's 'Dysregulated Neurodevelopmental Transcriptional Program'. That node is about ATRX binding G-rich tandem repeats and producing repeat-size-dependent dysregulation including alpha-globin downregulation - the haematological arm of ATR-X, not the neurodevelopmental transcriptional program the module node names. The edge was a name-level match, not a content correspondence. The entry retains three sound edges at the trigger, chromatin-state and consequence nodes. Separately, the module's trigger node description was broadened in the same pass to state that hypomorphic and hemizygous reduced-function alleles conform there, which is what this entry's own node says about ATRX alleles.

  summary: 'Address review round 1 on PR #16940'
  details: |
    Review round 1 fixes: rebound the advanced-carpal-ossification phenotype from HP:0005616 (Accelerated skeletal maturation) to the specific HP:0004233 (Advanced ossification of carpal bones). Re-decided the lumped stub Desbuquois_Dysplasia (MONDO:0015426) from DISEASE to GROUPING, recording that DBQD1 (CANT1) and DBQD2 (XYLT1) are curated as separate entries with distinct molecular lesions and that ClinGen anchors CANT1 validity at MONDO:0009629. Connected previously isolated phenotypes with defensible causal edges (Micromelia and Progressive scoliosis downstream of Defective Endochondral Ossification; Accelerated carpal/tarsal ossification, Delta phalanx, Short metacarpals downstream of growth-plate chondrocyte dysfunction as INDIRECT_UNKNOWN_INTERMEDIATES; Pulmonary hypoplasia -> Respiratory insufficiency sequela). Changed quote_role REVIEW_SYNTHESIS to BACKGROUND on the two PMID:39334831 introduction quotes. Added a prenatal ultrasound diagnosis row citing PMID:31587486 and PMID:40368527; removed two uncited new-in-PR cache files (PMID:20425819, PMID:32922611).

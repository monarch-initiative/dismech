  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 32 (DFNB32, CDC14A)'
  details: |
    New entry for CDC14A-related autosomal recessive hearing loss (MONDO:0012091), claimed in issue 13349. Deep research: falcon (Edison) report research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_32-deep-research-falcon.md, used as a lead; its disease-specific sources (Imtiaz 2018, Mohseni 2020, Doll 2020, Delmaghani 2016, Zehri 2024) were fetched and quoted directly. Its general hearing-loss reviews (otoacoustic emissions, newborn screening, gene therapy) were not cited because they say nothing specific about CDC14A. Additional primary sources found by PubMed search: Masmoudi 2003 (locus mapping), Shabbir 2026 (truncated CDC14A structure, NMD escape, nuclear retention), the UAE cohort 2022 (p.Arg312Gly frequency and absent reported infertility), Wen 2020 (independent Cdc14a knockout testis phenotype) and Uddin 2019 (drebrin substrate, cilium length in RPE1 cells).

    Scope decision: MONDO carries a separate syndromic term, hearing impairment and infertile male syndrome (MONDO:0100069, parent MONDO:0002254 syndromic disease), checked on OLS. OMIM 608653 lumps both as deafness with or without immotile sperm. The entry lumps and records HIIMS as a has_subtypes row bound to MONDO:0100069, with the allele boundary (catalytic domain / exon 10 and upstream versus exon 11 and downstream) and its weaknesses recorded in an INTERPRETATION discussion. Further discussions record the unknown phosphatase substrates (KNOWLEDGE_GAP) and the morpholino kinocilium result that germline mutants did not reproduce (HUMAN_MODEL_MISMATCH).

    Ten references are cited, all PMID-keyed and cached; caches fetched during research but not cited (seven DOI-keyed reviews and PMID:33187236) were removed. The entry's two pathophysiology branches are allele-specific: a catalytic-loss node (GO:0008138 protein tyrosine/serine/threonine phosphatase activity, DECREASED, HIIMS subtype) that feeds both hair cell degeneration and the seminiferous tubule lesion, and a C-terminal truncation node (DFNB32 subtype) that feeds nuclear retention of an active enzyme and then hair cell degeneration. Male infertility and the semen phenotypes are scoped to the HIIMS subtype.

    just preflight-dr was not run: it requires a local MONDO build, which was not downloaded because disk was limited. Validation: just validate, count-verified-snippets (all snippets verified), validate-terms, the offline gates, check_gene_activity_grounding, check-genereviews --online (NO_CHAPTER) and validate-disorders.

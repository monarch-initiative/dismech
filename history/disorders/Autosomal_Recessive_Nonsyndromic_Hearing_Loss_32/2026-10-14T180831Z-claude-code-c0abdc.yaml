  details: |
    Added a LOINC-coded pure-tone audiometry measurement set (panel plus 500/1000/2000/4000 Hz per ear) to the existing Serial audiologic assessment diagnosis row. No reference range is bound: the entry's own phenotype section documents congenital severe-to-profound loss in some families, straddling the WHO/GBD Severe/Profound boundary, while progression is reported in some families and explicitly absent in others carrying different alleles, so no single band or static grade would represent what this gene produces.

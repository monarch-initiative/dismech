  summary: 'Create: Yao Syndrome'
  details: |
    Created the Yao Syndrome (YAOS, NOD2-associated autoinflammatory disease, MONDO:0015019) entry de novo, using a Perplexity deep-research report as leads only. Curated a four-node causal chain (NOD2 low-penetrance susceptibility variants -> aberrant NOD2-RIP2-MAPK/NF-kappaB pathway activation -> dysregulated IL-6/IL-1beta/TNF production -> systemic autoinflammation) feeding 10 HPO-bound phenotypes, plus genetic (NOD2 as SUSCEPTIBILITY, germline, with IVS8+158/R702W/L1007fs/V955I/Q902K variants), 7 treatments, 3 diagnosis entries, 5 differential diagnoses (Blau syndrome, Crohn disease, FMF, sarcoidosis, Sjogren syndrome), histopathology, 2 experimental models and 3 discussions. Causality is recorded honestly rather than assumed: NOD2 is bound as SUSCEPTIBILITY not CAUSATIVE, mechanism nodes carry mechanism_confidence PROVISIONAL, the signaling model is an EMERGING mechanistic hypothesis, and a CONTROVERSY discussion carries REFUTE evidence from PMID:42169997 (the 2026 -Not getting the nod- review noting roughly 1 in 5 people carry IVS8+158 in gnomAD) against SUPPORT from the All of Us case-control study PMID:41207643. Category is Complex, not Mendelian, to reflect the genetically transitional architecture; the disease is kept clearly distinct from the sibling Mendelian NOD2 entry Blau_Syndrome. No GeneReviews chapter exists (PubMed search returned zero results), so no GeneReviews baseline was mined. An environmental section was deliberately omitted because no cached abstract supplies a quotable sentence for the reported COVID-19 or GI-surgery triggers. Every ontology CURIE was resolved independently with OAK against OLS rather than copied from the report, whose own term validation flagged 20 mislabelled CURIEs (for example HP:0004430 is Severe combined immunodeficiency, HP:0002108 is Spontaneous pneumothorax, NCIT:C34588 is Enuresis, GO:1900746 is a VEGF term) and 2 unresolved HP terms; hgnc:5331 was checked against cache/hgnc/terms.csv. Validation: just validate passed (schema, terms, references); just count-verified-snippets reported Snippets checked: 98/98 verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-reference-titles and check-term-cache-integrity all passed; just validate-disorders passed with 98/98 snippets. check-title-snippets and check-snippet-grading each report one new finding, both in unrelated files (IgG4-Related_Disease.yaml and Tay-Sachs_Disease.yaml) that this branch does not touch. Report citations not used: 14 fetched references were pruned uncited, 12 of them because their PubMed records carry no abstract text and so offer no quotable sentence.

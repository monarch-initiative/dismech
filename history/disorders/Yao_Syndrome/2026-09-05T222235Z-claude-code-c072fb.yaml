  summary: 'Review round 1: Yao Syndrome'
  details: |
    Addressed CHANGES_REQUESTED on PR #11151 in a single push. (1) Fixed four phenotypes orphaned from the pathograph: Gastrointestinal dysmotility, Weight loss, Fatigue and Oral ulcer were never the target of any edge. Added downstream edges from Systemic Autoinflammation with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, using bare names. All 19 phenotypes are now edge targets and no target carries an illegal phenotypes# prefix. (2) Corrected a false statement about repository state, which was the most serious finding: the notes block claimed the reported environmental triggers appear only in full text absent from the reference cache and that no cached abstract supplies a quotable sentence. That was wrong - references_cache/PMID_39372397.md is in this PR, is full text, and contains the sentence naming both triggers. Fixed by modeling rather than by rewording: added an environmental section with three entries (SARS-CoV-2 infection, COVID-19 vaccination, gastrointestinal surgery), each with influences_mechanisms targeting Systemic Autoinflammation, environmental_effect TRIGGERS, and its own link-level evidence block in addition to entry-level evidence, all citing PMID:39372397 with that exact sentence. Only the infection exposure could be bound to an ontology term (ECTO:3000001 exposure to virus, verified reachable from ExO:0000002 and carrying no Not4Curation marker); ECTO has no term for vaccination or surgery, so those exposure_term blocks carry a free-text preferred_term only, with per-entry notes recording exactly which searches were run. The false sentence was deleted from notes and replaced with an accurate description. (3) Replaced the TNF-inhibition therapeutic_agent binding NCIT:C20401 Monoclonal Antibody, which conveyed only that the drug is a biologic and is wrong for etanercept-type fusion proteins. NCIT has no TNF-inhibitor drug-class term and neither cited cohort names its agents, so the slot now carries an unbound preferred_term with a note recording the searches. (4) Captured the two remaining comorbidities from an already-verified snippet: Autonomic dysfunction (HP:0012332) and Mast cell activation-like symptoms, the latter deliberately unbound because HPO has no mast cell activation term and the mastocytosis terms denote a different entity. (5) Added Myalgia (HP:0003326), Diarrhea (HP:0002014) and Elevated erythrocyte sedimentation rate (HP:0003565) from snippets the entry already cited, each also given a downstream edge so the round introduced no new orphans. Every CURIE verified with OAK before binding. Validation: just validate passed; count-verified-snippets reports 109/109 verified, up from 98; check-environmental-evidence, check-causal-targets, check-entity-refs, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-not4curation, check-folded-hyphens, check-snippet-length, check-reference-titles and check-term-cache-integrity all pass; check-title-snippets and check-snippet-grading now pass outright, the unrelated findings previously seen having been resolved on main by the rebase; validate-disorders passed with 109/109.

  summary: Record ClinGen Definitive validity for ATP2B2 and qualify the PMCA2 localisation
  details: |
    Added a gene_disease_validity assertion copying the ClinGen Hearing Loss Gene Curation Expert Panel classification for ATP2B2 (Definitive, autosomal dominant, 2025-07-22), filed under MONDO:0019587, which the entry now maps as skos:broadMatch beside its existing exact match; that term's rows were added to the MONDO term and disease enum caches by validation. Set variant_origin GERMLINE. The calcium-extrusion node stated that PMCA2 sits in the stereocilia membrane and the basolateral wall. An isoform-resolved study (PMID:11438582) found PMCA2a confined to hair bundles with PMCA1b as the basolateral pump, so the description now gives both reports and the node cites the later one. The CGGV cache file was built from the ClinGen export downloaded 2026-11-11, newer than the pinned manifest snapshot, where it was not already committed. Validated with just validate-disorders, count-verified-snippets, check-gene-validity and the offline whole-repo gates.

  details: |
    Second session on this entry. The first record (2026-09-01T180746Z) reports 49/49 snippets and is left unedited, since history is append-only.

    Review on PR #10421, all four findings correct, and three of them came from the full text of PMID:30535804 rather than its abstract - which is where I had stopped.

    Critical. The entry stated that no rate in decibels per year had been published, and the paper this PR caches reports one: an age-related typical audiogram giving average annual threshold deterioration over ages 10 to 70 of 0.5 dB/year low, 1.1 dB/year middle, 0.7 dB/year high. That is now quoted. The reviewer's accompanying nuance is the more useful half and is written into the note: the middle frequencies deteriorate fastest while onset is high-frequency-weighted, so onset configuration and rate of decline are different quantities and the entry must not be read as claiming they agree. Audiograms below age 10 were excluded as unreliable, so the rate describes established disease.

    The same progression phase was evidenced by a sentence about mice graded HUMAN_CLINICAL. Regraded MODEL_ORGANISM with directness: INDIRECT and kept alongside the human rate.

    Vestibular prose. The abstract states the negative more strongly than the results section, which reports only minor vestibular abnormalities, two subjects with complaints (benign paroxysmal positional vertigo, and perilymph leakage after cholesteatoma surgery - both with identifiable non-genotypic causes), saccular function unmeasurable in three ears and utricular in one, and one family untested. The description now follows the results section, the unmeasurable-function sentence is carried as NO_EVIDENCE, and the reasoning for retaining frequency: EXCLUDED is written out: minor abnormalities with attributable causes are not a vestibular phenotype, but this is a judgement on incomplete testing rather than a clean negative.

    Tinnitus added at OCCASIONAL (2 of 11, 18 percent), with the denominator and its single-family concentration stated.

    Own full-text pass, taking the reviewer's closing suggestion. Three further findings. All five DFNA82 alleles fall in the w/a isoform of PMCA2, the predominant calcium pump of hair cells which localises to stereocilia - the reason this is a cochlear rather than a systemic calcium-handling disease, and missing from the calcium-extrusion node. ATP2B2 has a pLI of 1.00 and DOMINO predicts a dominantly inherited disorder, which is the population-genetic argument for the haploinsufficiency model, added there and graded COMPUTATIONAL since it is a prediction rather than a measurement in these patients.

    Most importantly, the CDH23 hedge. The entry said the founding study sequenced CDH23 and found it did not explain the phenotype - true and incomplete. Rare CDH23 variants co-occurred with the ATP2B2 allele in ALL FIVE index cases, and the authors state that a modifying effect of those variants cannot be excluded. Monogenic causation and a superimposed modifier are not mutually exclusive claims, and the original framing let the second disappear. Both are now curated and the ALTERNATIVE hypothesis's description says the entry asserts the first without denying the second, which is a better statement of the modifier-versus-monogenic boundary than the version this PR opened with.


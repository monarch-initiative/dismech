  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing molecular-testing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound: the clinical course (passed newborn screening, preschool diagnosis, rapid downsloping progression) is unusually consistent, but the severity that course reaches is not -- the entry's own phenotype section reports a range from mild to profound across the founding series, the full WHO/GBD scale rather than a tier a band could name, with one subject's reported onset at 55 years a further exception to the otherwise consistent preschool timing.

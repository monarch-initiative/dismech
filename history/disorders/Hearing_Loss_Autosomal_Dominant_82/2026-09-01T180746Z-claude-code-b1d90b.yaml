  summary: 'Create: Hearing Loss Autosomal Dominant 82 (DFNA82, ATP2B2)'
  details: |
    De novo curation of DFNA82 (MONDO:0030719, OMIM 619804), heterozygous loss-of-function ATP2B2/PMCA2.

    entry_type decision: DISEASE. One gene, one conserved pathograph (heterozygous ATP2B2 loss of function -> impaired calcium extrusion from stereocilia -> reduced endolymph calcium and outer hair cell dysfunction/degeneration -> rapidly progressive high-frequency hearing impairment). Not a SUBTYPE: no dismech entry covers ATP2B2 as a cause. The two existing ATP2B2 mentions in kb/ are incidental and were checked - Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11 records ATP2B2 SNPs that did NOT segregate with severity in a MYO7A family, and Intellectual_Disability_Autosomal_Dominant_52 records an ATP2B2 VUS co-occurring in an ASH1L proband. Neither claims DFNA82 and neither needed changing.

    NEC separation, which is the point of this entry. ATP2B2 carries three human phenotypes and preflight cannot tell them apart because it keys on the gene (preflight PASS: ATP2B2 mentioned 49 times, CDH23 8 times). They are separated here by allele class and curated so the boundary is machine-readable rather than only prose:
    - DFNA82 = heterozygous truncating and splice-site alleles (PMID:30535804; two de novo). This is the disease.
    - Modifier = the hypofunctional missense p.Val586Met worsening deafness caused by CDH23, MYO6 or noise (PMID:15829536). Curated as mechanistic_hypotheses cdh23_modifier_interaction with status ALTERNATIVE - well supported, but a claim about a different genotype. The Smits sentence describing the pre-2019 literature ('Up to now ATP2B2 has only been reported as a modifier...') is graded supports: NO_EVIDENCE with respect to DFNA82, since it bears on the modifier claim rather than on this one.
    - Neurodevelopmental/movement disorder = de novo missense plus penultimate-exon frameshifts, with mixed loss- and gain-of-function calcium effects in cells (PMID:37675773). Recorded in genetic notes and in a KNOWLEDGE_GAP, not merged into DFNA82.
    No digenic ATP2B2/CDH23 citation is used anywhere as evidence for the monogenic entity. The founding study sequenced CDH23 in every index case and evaluated all rare variants before concluding monogenic causation, and that step is written into the diagnosis section as an interpretation requirement.

    Vestibular sparing is curated as an examined negative (frequency: EXCLUDED) because the homozygous mouse has a florid vestibular phenotype that an entry importing the animal data wholesale would wrongly predict in patients; the resolution is allele dose.

    A second HUMAN_MODEL_MISMATCH records that the CRISPR rescue in the Oblivion mouse is allele-specific disruption, which suits a missense allele making a bad pump and has no target in a human truncating allele - if DFNA82 is haploinsufficiency the rational strategy is the opposite one. The study's 'digenic' arm (Tmc1 Beethoven plus Atp2b2 Oblivion) is explicitly recorded as not being a model of ATP2B2-CDH23 modification.

    Deliberately not curated: hearing aids and cochlear implantation (no DFNA82-specific outcome data); gene editing as a treatment (preclinical, mouse missense allele, recorded under animal_models); the basolateral neurotransmitter-release arm proposed in the 1998 deafwaddler paper (no human evidence bears on it).


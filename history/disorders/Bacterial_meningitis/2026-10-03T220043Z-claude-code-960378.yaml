  summary: Rung-3 lump/split review (#10115, design decisions §3e)
  details: |
    Rung-3 lump/split review of the four agents against the six differentiating axes of design decisions section 3e (R7-R12, R20). Outcome: four subtypes added, all MONDO-bound. Meningococcal (MONDO:0018059) - age distribution (most disease between ages 2 and 18), petechial/purpuric rash as presentation and prognostic sign, serogroup-specific conjugate vaccine; PMID:9519033, PMID:1994692, PMID:17696042. Pneumococcal (MONDO:0006913) - commonest cause overall, contiguous ear/sinus route; PMID:9519033, PMID:30873934. This row carries curated_in: Pneumococcal_Meningitis, the R20 pointer convention, because that standalone entry exists and is anchored to the same MONDO class; the checker now reports POINTER rather than DOUBLE_MODELLED. Hib (MONDO:0000889) - under-five at-risk population and the decisive vaccine axis, having virtually disappeared where Hib conjugate vaccine was introduced; PMID:11032188, PMID:15907145. Listerial (MONDO:0006836) - the first-line-therapy difference that most clearly earns a row, since suspecting Listeria adds ampicillin or amoxicillin to the third-generation cephalosporin that covers the other three, plus a distinct at-risk population and a foodborne route; PMID:18582342, PMID:37649122, PMID:28536811. PMID:18582342 (EFNS guideline) and PMID:37649122 (German guideline) were newly fetched for this review. The Listerial row deliberately carries no curated_in: Listeriosis.yaml is the organism-wide disease (MONDO:0005828), not a promotion of the meningeal stratum, and the description says so. Three reference_title values written during drafting were wrong and were corrected by reading the title: line of each cache file (PMID:9519033, PMID:30873934, PMID:28536811). disease_term, pathophysiology and infectious_agent bindings were not touched. Validated: just validate (146/146 snippets), just validate-terms, just check-granularity.

  summary: 'Manual evidence review of Bacterial meningitis: verified 135 items; fixed
    5 semantic/source issues'
  details: |
    Systematic manual evidence-verification review. All 135 snippets confirmed exact quotes, correctly attributed (no fabrication/NEC). Fixes: (1) Neck Stiffness frequency VERY_FREQUENT -> FREQUENT, since its two citations report 36-78% and 'less than half'; retagged those items REFUTE->PARTIAL to reflect they support FREQUENT not VERY_FREQUENT; diagnostic:true retained. (2) Treated case-fatality range 10-15% -> 7-30% (contradicted by its own NO_EVIDENCE citations), anchored on van de Beek 2004 PMID:15509818 (nationwide cohort: overall 21%, pneumococcal 30% vs meningococcal 7%); Iceland 15-20% item retagged SUPPORT (now in-range). (3) Added evidence_source IN_VITRO to PMID:16785556 (murine microglia in vitro) and PMID:37001294 (in-vitro macrophages), and MODEL_ORGANISM to PMID:37603152 (Wistar-rat model). Outstanding: untreated CFR (70-100%) and droplet-transmission rest on NO_EVIDENCE items -> issue #6228.

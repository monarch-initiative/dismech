  details: |
    Typed the NRAS Q61R, Q61K and Q61L records SOMATIC_DRIVER with variant_origin SOMATIC. The 'NRAS Q61 Oncogenic Mutation' node named no gene; it now carries NRAS with GTPase activity DECREASED, matching its description (codon 61 substitutions impair intrinsic GTPase activity and GAP sensitivity, leaving NRAS GTP-bound), which wires the entry's defining gene into the pathograph.

    Integration cleanup of errors already present on main: linkml-reference-validator 0.8.0 failed this entry's evidence or deep-research reference annotations, so CI rejects any PR that touches it. Removed 3 deep-research reference finding(s) whose statement and supporting text were only the reference title, on references cached without retrievable text; the reference entries stay. The DOI:10.1186/s12943-023-01789-9 quote spanned fused section headings; it now quotes the results sentence on CXCR1/CXCR2 inhibition reducing tumor incidence and growth.

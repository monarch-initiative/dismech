  summary: Add Breslow thickness diagnosis row (tranche Q batch 3)
  details: |
    LOINC tranche Q batch 3 (final batch; staging and severity scores). Added a diagnosis[] row binding LOINC:92839-0 (Breslow thickness [Length] of Skin melanoma) via measurements, with diagnosis_term NCIT:C15189 (Biopsy Procedure). Citing PMID:28797232 (already cited elsewhere in this entry for Lymphadenopathy), quoting its statement that NRAS mutations had previously been associated with higher Breslow thickness and faster growth of the primary tumor, which directly sources this entry's own prose claim (phenotypes#Cutaneous Melanoma: 'may present with thicker primary tumors compared to BRAF-mutant disease'). No reference_ranges band: per the coordinator's explicit tranche-wide instruction, Gleason and Breslow are both specimen grading read by a pathologist off tissue and the code belongs in measurements only; separately, this entry's own sources state only the qualitative NRAS-vs-BRAF comparison (plus their own caveat that it was not confirmed in their cohort), not the numeric AJCC T-category depth thresholds that would anchor a band. Code confirmed via the NLM Clinical Table LOINC search service and Monarch KG API in the step written. Neither LOINC:92839-0 nor NCIT:C15189 requires a third-party copyright notice. No collision with LOINC:92839-0 on any other open loinc-* branch's cache. The snippet quotes the source's own split-apostrophe typography (Breslow [space]'s thickness, an extraction artifact) verbatim rather than correcting it, per the never-correct-a-quoted-source rule; it folds cleanly under normalize_text. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

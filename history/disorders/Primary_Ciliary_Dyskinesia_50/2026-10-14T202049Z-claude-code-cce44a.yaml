  summary: 'Create: Primary Ciliary Dyskinesia 50 (DNAH7)'
  details: |
    New entry for CILD50 (MONDO:0957252), the DNAH7-related disorder, also listed as a has_subtypes row on the umbrella Primary_Ciliary_Dyskinesia entry (not edited). Deep research: the requested falcon provider failed authentication (503) on two attempts, including with --fallback, so the report used is research/Primary_Ciliary_Dyskinesia_50-deep-research-claude_code.md; just preflight-dr against MONDO:0957252 returned PASS. The human genetic evidence is two Chinese asthenozoospermia studies (PMID:34476482 missense, PMID:40810911 truncating; both abstract-only) showing inner dynein arm loss in sperm and ICSI success. No genotyped DNAH7 patient has documented airway disease or ciliary studies, so no respiratory phenotypes were recorded; the respiratory branch (PMID:11877439, a 2002 ungenotyped PCD case lacking ciliary DNAH7, and PMID:39056782) is marked hypothetical and ends at mucociliary clearance without phenotype edges. A Kartagener child with DNAH7 plus DNAH5 variants (PMID:31443223) is recorded as weak, confounded support. No animal model was curated. ClinGen rates DNAH7 Limited for generic PCD (MONDO:0016575), so no gene_disease_validity was recorded. Validated with just validate, count-verified-snippets (all verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders.

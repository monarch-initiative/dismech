  summary: 'Review response: Primary_Ciliary_Dyskinesia_50'
  details: |
    Review response for PR 14205. The earlier statement that no genotyped DNAH7 patient had documented respiratory disease was wrong. The 2021 paper (PMID:34476482) full text could not be obtained (closed access); OMIM 620356, read via its MedGen copy, and the ClinGen evidence summary both attribute chronic sinusitis and bronchitis to CILD50, and PMID:37998386 (full text) reports a homozygous DNAH7 frameshift patient with bronchiectasis, chronic wet cough and CRSwNP but normal airway-cilia ultrastructure and nasal NO above the PCD threshold. Added Chronic sinusitis, Chronic bronchitis and Bronchiectasis phenotypes linked from the clearance node; added a REFUTE item for the inner-arm node; added PMID:35543642 as a sixth infertile man with MMAF. Rebound the sperm inner-arm finding from HP:0012257 (scoped to respiratory cilia) to HP:0033524 Abnormal sperm axoneme morphology after an OLS search found no sperm-specific dynein-arm term. Added an airway clearance treatment. Regenerated the DNAH7 ClinGen cache to include its evidence summary.

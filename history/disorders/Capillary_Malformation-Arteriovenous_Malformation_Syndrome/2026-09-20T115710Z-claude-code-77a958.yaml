  summary: 'Genetics pass: wire RASA1/EPHB4 into the pathograph and bind both subtypes'
  details: |
    Genetics pass for #12192. Both causal genes were curated in `genetic:` but neither reached a pathophysiology node, so gene-to-mechanism wiring was 0/2 despite a node literally named 'Germline RASA1 and EPHB4 loss of vascular Ras suppression'. Added `genes:` descriptors for RASA1 and EPHB4 on that node and RASA1 on the somatic second-hit node (whose evidence is RASA1 allele loss), taking wiring to 2/2. `just check-genereviews` reported an UNTAGGED_CHAPTER: the disease's own GeneReviews chapter (PMID:21348050) was not cited at all. Fetched and tagged it, and used it to give CM-AVM1 and CM-AVM2 their gene bindings, inheritance blocks and first evidence. Added `relationship_type: CAUSATIVE` to both genetic records. MONDO reconciliation: MONDO:0020783 / RASA1 present and bound at the CM-AVM1 row.

    The GeneReviews evidence items added to the two subtype rows are graded OTHER with quote_role REVIEW_SYNTHESIS, matching how GeneReviews chapter sentences are graded elsewhere in the KB.

  summary: 'Create: Microcephaly, Short Stature, and Impaired Glucose Metabolism 2
    (MSSGM2, PPP1R15B)'
  details: |
    De-novo curation of MSSGM2 (MONDO:0014785, PPP1R15B/CReP). Deep research: falcon (Edison), 648s runtime, 21 citations; report retained under research/. NEC preflight passed: the MONDO definition names PPP1R15B, and OMIM:616817 plus RO:0004003 HGNC:14951 are concordant; deliberately distinguished from MSSGM1 (MONDO:0000208, TRMT10A), which carries a near-identical clinical label. No GeneReviews chapter exists for PPP1R15B (PubMed search returned no results), so that baseline step was not applicable. Curated the eIF2-alpha phosphatase causal chain from the PP1-binding-site lesion through loss of CReP-directed dephosphorylation, chronic attenuation of cap-dependent translation, and beta-cell secretory failure/apoptosis, to microcephaly, short stature and young-onset diabetes. Evidence anchored on PMID:26159176 (Abdulkarim 2015), PMID:26307080 (Kernohan 2015), PMID:27640355 (Mohammad 2016, hepatic presentation), PMID:38159565 (Fatalska 2024, source of the p.Asn423Asp substrate-recruitment allele surfaced by the falcon run) and PMID:38139150 (Hicks 2023 review). An incorrect PMID in the falcon report (26310607 for Abdulkarim 2015; correct is 26159176) was caught and documented in the entry notes. An adversarial pre-PR self-review was run and materially changed the entry. It caught three substantive errors, all fixed before commit: (1) the disease description asserted diabetes across both R658C families, but the second family's siblings were last assessed at 5y2m and 3y8m, far below the reported second-to-third-decade onset window, so the claim was rewritten as an age-dependent phenotype; (2) frequency VERY_FREQUENT on diabetes was an over-claim (2 of 4 individuals) and was removed, with the ascertainment-age reasoning recorded in the entry notes; (3) an initial note excluded hypothyroidism as unverifiable, which was wrong - PMID:26307080 documents an elevated TSH of 9.53 requiring replacement, so Hypothyroidism (HP:0000821) was added as a cross-family-discordant phenotype alongside the index family's normal thyroxine. The review also prompted adding cerebellar hypoplasia, gait ataxia, thin corpus callosum and delayed skeletal maturation from the second family, an autoantibody-negative evidence item, extension of three truncated snippets, correction of an inconsistent evidence_source, softening of an overstated human beta-cell-mass claim to reflect that the supporting data are rat siRNA knockdown, and a new INTERPRETATION discussion recording that CReP inhibitors would be directionally counterproductive here. Final validation: just validate, just validate-terms and just validate-references all pass, with 56/56 snippets verified against cached references; compliance 86.5 percent.

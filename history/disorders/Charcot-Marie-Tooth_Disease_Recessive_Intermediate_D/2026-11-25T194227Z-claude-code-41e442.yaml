  summary: 'Gene-family review: COX6A1'
  details: |
    COX6A1 genetic record: variant_origin GERMLINE added, an autosomal recessive inheritance block bound to HP:0000007 with the founding-pedigree evidence (PMID:25152455), and a note that ClinGen rates COX6A1 Strong (AR) for mitochondrial disease (MONDO:0044970), broader than this entry's MONDO:0014467. CAUSATIVE is kept (Strong-level evidence; Japanese, Czech and stop-loss families). The Reduced COX6A1 Protein Abundance node now binds GO:0004129 cytochrome-c oxidase activity (DECREASED), described as the holoenzyme activity the non-catalytic subunit supports, so the gene lands on a molecular function.

  summary: Review COX6A1 neuropathy against full primary clinical reports
  details: |
    Reviewed the existing entry and the complete substantive OpenScientist report against primary sources. Used fetcher-generated full text of Tamiya et al. (PMID:25152455, PMC4157141) and the full confirmation letter (PMID:26302975, DOI:10.1111/cge.12649, author-hosted PDF). PMID retrieval alone did not recover these texts; supported URL fetches did. Read main text, clinical tables, methods, figures and discussion. Supplemental download returned an interstitial and is not used. Read the COX6A1 row and relevant results of the 2016 panel cohort (PMID:27549087) without double-counting the Czech family. Other mechanism and stop-loss sources remain abstract-limited after full-text attempts.

    Corrected claims that human NCVs, onion bulbs, mouse NCVs, tissue-specific mouse biochemical measurements, human gait findings and CMTRID treatments were unreported. Replaced unrelated SPG11 phenotype anchors with direct clinical evidence. Removed unsupported frequency bands and inferred onset ages. Distinguished the original and HGVS-normalized representations of the same splice-region deletion. Separated measured patient RNA, enzyme activity and ATP from provisional assembly mechanisms and hypothetical tissue compensation. Corrected the null mouse limitations and recorded patient-derived and knockdown cell systems. Resolved the erroneous absence-of-NCV knowledge gap.

    Content completeness: (1) phenotype coverage adequate: distal motor/sensory findings, reflex variation, gait, pes cavus, finger contractures, hearing loss, pain, onion bulbs, plus the single stop-loss child's developmental/lactate findings; no justified disease-wide frequencies. (2) subtype completeness adequate: no established additional subtype to split; broader severe spectrum remains open. (3) pathophysiology adequate: atomic splice-region lesion, RNA reduction, stop-loss/protein reduction, provisional assembly, activity, ATP, axonal neuropathy, conduction and atrophy; compensation explicitly hypothetical. (4) treatment/trials adequate: primary case aids, surgery and partially effective gabapentin/clonazepam; general CMT rehabilitation, counseling and vincristine precaution explicitly indirect; COX6A1 ClinicalTrials.gov query returned zero, without excluding generic CMT trials. (5) genetics adequate: two reported variant mechanisms, recessive inheritance, normalized intronic representation, recurrence hypothesis; no invented penetrance, prevalence, modifier or universal population absence. (6) diagnostics adequate: actual NCVs/CMAPs, panel/genome/exome testing and intronic coverage; functional research assays not represented as validated clinical diagnostics. (7) references adequate: seven used sources, full primary clinical reports and full CMT Overview; no dedicated COX6A1 GeneReviews chapter found. (8) overall consumption adequate: rejected unsupported generic frequencies, ontology errors and mechanistic extrapolations from the research report.

    All 72 evidence items have titles read against source metadata, source type, directness and quote-role grading. Source assertions were checked against actual content, not titles. The general CMT GeneReviews Overview supports management and recessive counseling only; phenotype evidence remains disease-specific. HP:6000040 is a clinical modifier outside the phenotype root; neuropathic pain binds to HP:0012531 with specificity retained in preferred_term. Preserved original untracked references and used the existing Orca checkout; no new worktree or parallel subsession.

    Replaced the obsolete tissue-vulnerability example in the shared node-class tree with the measured COX6A1 protein-abundance node under protein abundance loss. Validation found and corrected a date-time format error, an HPO modifier used as a phenotype, and three short excerpts; all expanded snippets remain exact source text.

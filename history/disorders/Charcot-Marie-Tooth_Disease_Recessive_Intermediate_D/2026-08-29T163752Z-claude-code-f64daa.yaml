  summary: 'Create: Charcot-Marie-Tooth Disease Recessive Intermediate D'
  details: |
    Created the CMTRID entry, the COX6A1-related recessive intermediate Charcot-Marie-Tooth neuropathy. It conforms to the complex_iv_assembly_deficiency module at three nodes rather than duplicating that cascade, and adds two disease-specific nodes: isoform-restricted tissue vulnerability, which is the candidate explanation for why a housekeeping respiratory-chain subunit defect presents as a peripheral neuropathy rather than as an encephalomyopathy, and peripheral nerve degeneration with mixed conduction slowing. The Cox6a1-null mouse is curated as an animal model with two modeled_mechanisms links and readouts. Deep research: openscientist, research/Charcot-Marie-Tooth_Disease_Recessive_Intermediate_D-deep-research-openscientist.md. Its most valuable contribution was PMID:20307258, in which ectopic COX6A2 restores holoenzyme and activity in COX6A1-knockdown human cells; that replaced a weaker mouse-muscle citation as the load-bearing evidence for the isoform node and reshaped the HUMAN_MODEL_MISMATCH discussion. Claims from the report that were NOT adopted: PMID:7687470, which the report cites for COX6A1 being the ubiquitous isoform but which is a 1993 bovine paper using the reverse numbering, so it supports the opposite of the claim; the HPO onion-bulb annotation for OMIM:616039, which would largely answer the intermediate-designation knowledge gap but has no citable underlying PMID in this KB's reference model; and the gnomAD constraint metrics, uncitable for the same reason. Both are recorded in the entry notes. The report's own reference validation flagged PMID:23001492 as off topic and it was not used. Validated with just validate, 30 of 30 snippets verified, plus just validate-terms and just check-entity-refs.

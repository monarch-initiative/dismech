  summary: 'Self-review fixes: correct awakening-clustering overstatement and six
    other findings'
  details: |
    Adversarial pre-PR self-review of the entry created in the preceding record, and the fixes it produced. The review re-verified all 48 evidence snippets independently, every ontology id/label pair via OAK, and all five conforms_to targets; those were clean. It found seven substantive problems, all now fixed.

    CRITICAL, and the reason this record exists. The entry's headline framing - that seizures cluster shortly after awakening - was contradicted by a sentence sitting in the cached full text of the entry's own primary source. PMID:38819591 states that only 30% of patients exclusively experienced seizures within 2 hours of waking, "a finding that challenges the conventional view which posits that most seizures in this syndrome will occur shortly after awakening." The original entry instead justified a FREQUENT band with that cohort's 59.6% "exclusively diurnal" statistic, which measures something weaker and different. Fixed by rewriting the disease description, rewriting the module-conformance note, renaming the phenotype to "Seizures Confined to the Two Hours After Awakening", and re-evidencing the band on the 30% figure plus the authors' own caveat. The phenotype now carries a notes block recording the corrected reasoning rather than hiding the earlier error.

    Photoparoxysmal response was banded OCCASIONAL from a 2001 Japanese ILAE-1989 "grand mal on awakening" series, when the entry's own EGTCA cohort reported 20.2% on initial EEG and 34.8% across follow-up recordings. Re-banded FREQUENT on the syndrome-specific data; the older series is retained at PARTIAL for the juvenile-myoclonic-epilepsy comparison only.

    The valproate mechanism edge cited an odds ratio whose outcome is whether an IGE patient has generalized tonic-clonic seizures at all - a comparison against IGE patients without them, i.e. mostly absence and myoclonic syndromes. Within EGTCA every patient has such seizures by definition, so that OR cannot describe a treatment effect. Demoted to PARTIAL class-level context, the causal wording withdrawn, and the EGTCA-specific 14%-versus-73% figure promoted to primary support.

    One CLCN2 evidence item was tagged REFUTE while its own explanation said it supports the SUSCEPTIBILITY typing; supports is relative to the claim being made, so it is now SUPPORT. A second CLCN2 item ("only a rare cause") moved REFUTE to PARTIAL, since bounding a susceptibility claim is not refuting it.

    Normal interictal status carried a VERY_FREQUENT band with no frequency evidence. Now evidenced on the cohort's 4.5% developmental delay and 5.6% psychiatric comorbidity figures.

    Three phenotypes reused HP:0002069 for non-seizure content, including for the absence of a phenotype. The two exclusion phenotypes were split apart and rebound to HP:0002121 and HP:0032794 with modifier ABSENT, which states what is actually absent; the normal-status phenotype now omits term entirely, following existing repository precedent for phenotypes HPO cannot express.

    PMID:37872695, the largest ILAE-2022-criteria cohort at n=247, was about 80% unconsumed. Added: a new Catamenial Gating of Seizure Threshold modulator node (catamenial seizures and morning predominance independently predicted drug resistance), the 16.3% drug-resistance figure, the relapsing-remitting pattern figure, and - importantly - the 83% post-withdrawal recurrence figure, which conflicts with the 44% already curated from the other cohort. That 44-versus-83 discrepancy is now stated explicitly in the progression notes rather than averaged away or silently ignored, and predictors are attributed per cohort instead of merged.

    Also fixed: an unevidenced sudden-death clause removed; modifier ABNORMAL dropped from the circadian sleep/wake cycle term, since the node models a normal cycle acting as a modulator; GABA signalling modifier aligned to the module's DECREASED; a phenotype renamed to drop an unevidenced polyspike-wave claim; the onset descriptor corrected from a median-age-at-inclusion quote to the actual mean/median/range at onset; prevalence measure_type changed from POINT_PREVALENCE to UNKNOWN because both records hold shares of a diagnostic group rather than population rates; valproate superlative softened; sleep-deprivation trigger claim bounded by the cohort's finding that 51.7% could identify no trigger.

    Added a diagnosis section, which the entry lacked despite sibling precedent, covering the 3-hour sleep-deprived video-EEG protocol, the mandatory-GSWD criterion, and MRI for lesion exclusion - the last of which also supplies the previously uncited "no lesion" claim in the description.

    Added a naming caveat to the notes recording that the historical awakening-epilepsy labels are NOT interchangeable with the 2022 ILAE syndrome. That conflation was the root cause of two of the findings above and of the polluted dataset search recorded in the previous entry.

    Validation after fixes: just validate-disorders passes; snippets 64/64 verified against cached references, up from 48/48; term validation passes; the conforms_to, phenotype, and foreign-key subset of tests/test_data.py passes at 5824 tests. Weighted compliance 87.2%.

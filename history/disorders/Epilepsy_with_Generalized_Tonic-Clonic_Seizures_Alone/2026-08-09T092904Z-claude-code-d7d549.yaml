  summary: Fix exclusion phenotypes to frequency EXCLUDED so HPOA export emits NOT
  details: |
    PR-review follow-up (ai4c-reviewer, 2026-08-09). The two defining exclusion phenotypes (Absence Seizures Absent, Myoclonic Seizures Absent) carried 'frequency: OBLIGATE' plus 'phenotype_term.modifier: ABSENT'. src/dismech/export/hpoa_export.py:250-252 derives the NOT qualifier from frequency == EXCLUDED only and never consults modifier, so both phenotypes exported as positive obligate assertions (HP:0040280) - the inverse of the syndrome definition. Swapped both to 'frequency: EXCLUDED', matching the in-KB precedents in Osteogenesis_Imperfecta_Type_IV and Fanconi_Anemia. Verified by running hpoa_rows_for_disorder on this branch: both rows now emit qualifier NOT with an empty frequency column. Also extended the exclusion 'notes:' to record that frequency EXCLUDED is the operative mechanism and modifier ABSENT is intent documentation only. Validated with 'just validate' - schema, terms and references all clean, 64/64 snippets verified against cached references.

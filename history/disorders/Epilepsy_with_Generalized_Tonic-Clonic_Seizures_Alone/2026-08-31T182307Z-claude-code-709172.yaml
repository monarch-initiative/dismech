  summary: Rewrite 20 explanations naming the retired PARTIAL grade
  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place, so this entry explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim, restated in terms of the current enum, following the pattern set by PR 10120 and continued in PRs 10258 and 10263. directness: INDIRECT is added only where the curator's own words name an inference step. Where they do not, the retired token is dropped and no directness is asserted: absent means nobody has assessed the item, which is the honest state and is what #10003 chose for all 11,620 of its own migrated items. A consistency check enforces both directions - no explanation claims INDIRECT without the item carrying the slot, and no item carries the slot without the explanation saying why - and is zero across the tranche. No supports value, snippet, reference, evidence_source or ontology term changed. Twenty explanations rewritten; three carry directness: INDIRECT where the reason names an inference step (an all-comers epilepsy clinic rather than EGTCA, a four-syndrome class share rather than EGTCA alone, an outcome modeled for IGE rather than this syndrome). The rest are left unassessed - several are strength caveats rather than directness ones, notably the GWAS item whose explanation is careful to say it records an absence of evidence at n=499 rather than evidence of absence. Two entry-level notes blocks updated: the evidence-level note documenting the class-versus-syndrome discipline, and the note recording that one borrowed grand-mal-on-awakening statistic is bounded for the same conflation reason. Validated with just validate-disorders across the tranche: 372/372 snippets verified.

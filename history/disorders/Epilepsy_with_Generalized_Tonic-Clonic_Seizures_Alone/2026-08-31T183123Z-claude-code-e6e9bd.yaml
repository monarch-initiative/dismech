  details: |
    Pre-empting the two prose findings the ai4c-reviewer raised on PR 10258 against the same PARTIAL-residue work, so a reviewer does not have to find them a second time. First, substituting the word 'bounded' for the retired grade reintroduces the defect the issue exists to remove: a new undefined grading token in the sentence position PARTIAL just vacated, not established usage anywhere else in kb/ in that sense, with no retired enum value behind it to trace, in a field no gate checks. Second, an explanation must not deny the supports value its own item carries. Both are fixed. Reading the affected items to remove the token also exposed that this tranche UNDER-applied directness: the pattern table fired on very few of them, but most of the reasons are plainly inference steps of the kind CLAUDE.md names, so they now carry directness: INDIRECT with the reason stated in the explanation. Items whose caveat is about strength rather than directness keep the plain statement and gain no slot. The consistency check is zero in both directions. No supports value, snippet, reference, evidence_source or ontology term changed. Fifteen items move from the invented token to directness: INDIRECT, all where the reason is an inference step: an IGE-wide or all-comers cohort rather than EGTCA, a review synthesising across syndromes, the pre-2022 grand-mal-on-awakening entity rather than the ILAE-2022 syndrome, a heterologous expression system rather than human EGTCA, a treated-versus-untreated contrast that cannot isolate the specific drug, and background framing rather than a result the trial generated. Two keep the plain statement and gain no slot because their caveat is strength rather than directness: the GWAS item, whose explanation is careful to record an absence of evidence at n = 499 rather than evidence that no such locus exists, and the counselling item, where no trial evidence was identified at all. The entry-level note recording that one borrowed grand-mal-on-awakening statistic is carried with the pre-2022 cohort named is reworded to say that rather than to use the token.

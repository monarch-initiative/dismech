  summary: 'Create: Epilepsy with Generalized Tonic-Clonic Seizures Alone'
  details: |
    New entry completing the ILAE idiopathic generalized epilepsy tetrad; childhood absence epilepsy, juvenile absence epilepsy, and juvenile myoclonic epilepsy were already present.

    Duplicate preflight: searched origin/main kb/disorders for MONDO:0005754 and the syndrome name and synonyms, plus GitHub PRs and issues in all states. No existing entry, PR, or issue.

    Deep research: just research-disorder claude_code, the provider requested by the user. Run recorded at research/Epilepsy_with_Generalized_Tonic-Clonic_Seizures_Alone-deep-research-claude_code.md with 15 web searches, 28 turns, 21 citations, about 5.6 minutes.

    NEC preflight: just preflight-dr returned SKIP because MONDO:0005754 records no causal gene for this polygenic disease, so the gene-identity check cannot discriminate. Fell back to the documented manual check. The report's ORPHA:698005 matches the MONDO Orphanet xref exactly, and the names it keys off - epilepsy with generalized tonic-clonic seizures alone, EGTCA, grand mal on awakening - are all MONDO EXACT synonyms of the intended entity. Report accepted.

    DR verification: every PMID cited in the deep-research report was independently resolved via the PubMed E-utilities API and confirmed real and correctly attributed before use. Two UBERON ids the report suggested were wrong - UBERON:0001890 is forebrain, not thalamus, and UBERON:0001872 is parietal lobe, not thalamic reticular nucleus - and were replaced with terms verified via OAK. Its CHEBI and HGNC suggestions were correct on check.

    GeneReviews: searched PubMed; no GeneReviews chapter exists for this syndrome, as expected for a polygenic IGE. No action needed.

    Curation choices worth flagging for review. First, the defining negative criteria - no absence or myoclonic seizures, and normal interictal status - are curated as explicit phenotypes, but HPO has no term for the absence of a phenotype, so those descriptors reuse HP:0002069 and carry the real claim in the description plus a notes field admitting the imperfect binding. Second, the sleep-wake gating node is modeled as a modulator with its own edge rather than as a step in the module's causal chain, because the circadian clustering is the syndrome's most distinctive feature. Third, the usual avoid-sodium-channel-blockers-in-IGE teaching is NOT repeated as fact; the aggravation evidence concerns myoclonic and absence seizures that EGTCA patients do not have, so it is recorded as an open KNOWLEDGE_GAP discussion. Fourth, CLCN2 is typed SUSCEPTIBILITY with two REFUTE evidence items attached rather than omitted or overstated. Fifth, there is no datasets block: dataset discovery returned 12 candidates and none survived relevance triage, since the CLCN2 hits were corn snake pigmentation, hyperaldosteronism, leukodystrophy, and retinal degeneration, while the grand mal epilepsy synonym matched an autism study. That decision is recorded in the entry notes.

    Validation: just validate passed for schema, terms, and references via the pre-edit hook; just count-verified-snippets reports 48/48 verified against cached references; just validate-terms passed; the conforms_to and foreign-key subset of tests/test_data.py passed with 5812 tests. One snippet was caught mid-curation stitching together two non-contiguous clauses of the PMID:21269293 abstract and was replaced with a genuine contiguous quote before commit.

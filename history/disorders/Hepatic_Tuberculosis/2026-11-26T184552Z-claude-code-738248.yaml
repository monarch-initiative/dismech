  summary: 'Create: Hepatic_Tuberculosis'
  details: |
    New entry for hepatic tuberculosis (MONDO:0005787) curated from claim issue #19039; stubs/Hepatic_Tuberculosis.yaml deleted. Lump/split: the miliary (diffuse), local (tuberculoma, pseudotumour, abscess) and tubular (biliary) hepatic forms are kept in one entry as clinical_form subtypes, recorded in a 'Deliberately lumped.' review_notes paragraph; a 22-patient comparison (PMID:7744492) found the miliary and local forms clinically and pathologically similar, and all share caseating granulomas, biopsy-based diagnosis and four-drug therapy. Whole-body disseminated disease is left to Miliary_Tuberculosis (in progress separately). Hepatosplenic disease is in scope where the liver is involved; splenic tuberculosis alone is out of scope. Pathograph: lung or gut focus -> hepatic-artery or portal-vein seeding -> Kupffer cell and macrophage uptake -> epithelioid granuloma -> caseation and tuberculoma -> abscess, plus tuberculous cholangitis, porta hepatis lymphadenitis (biliary obstruction, portal hypertension), massive miliary infiltration (acute liver failure) and a drug-induced liver injury node; three nodes conform to granuloma_formation. The hepatotoxicity caveat for isoniazid, rifampicin and pyrazinamide is sourced from the ATS statement (PMID:17021358), a review (PMID:17995946), the hepatic systematic review (PMID:25943103) and a hepatobiliary series (PMID:18360350). Main sources: systematic review of 14 series (PMID:25943103), narrative review (PMID:24976240), HIV-associated case series (PMID:28148232), prospective series from western India (PMID:18603675) and South Africa (PMID:3659266). Deep research: research/Hepatic_Tuberculosis-deep-research-claude_code.md (claude_code provider), used as leads only; every quote and CURIE re-verified against references_cache and OLS. Validated with just validate-terms, count-verified-snippets, the whole-repo gates and validate-disorders.

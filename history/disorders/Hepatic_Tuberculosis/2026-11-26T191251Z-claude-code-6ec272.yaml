  details: |
    Addressed review 6079335333 on PR #19044. Added an incoming edge from Portal Venous Seeding from a Gastrointestinal Focus to Porta Hepatis Tuberculous Lymphadenitis, sourced to the PMID:24976240 sentence on caseation of the hepatic hilar lymph nodes in the tuberculous primary complex, and rebound that node's location from liver to UBERON:0038694 hepatoportal lymph node (OLS synonym: porta hepatis lymph node). Set Massive Miliary Hepatic Infiltration to biological_scale TISSUE. Added a clinical_burden block (HIGH) with case-fatality figures quoted from PMID:25943103, PMID:28148232 and PMID:18360350. Added Xpert MTB/RIF evidence (PMID:25943103) to the PCR diagnosis row. Added notes explaining why the drug-induced liver injury node has no incoming edge and recording the evidence-grading convention (systematic review of human series HUMAN_CLINICAL; narrative reviews and the ATS statement OTHER, both REVIEW_SYNTHESIS); the existing grades were kept. Updated the scope note now that Miliary_Tuberculosis is on main. Merged origin/main first.

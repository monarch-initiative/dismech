  summary: 'Gene-family review: NTRK2 (and NTRK1, NTRK3)'
  details: |
    The three NTRK records carried only the free-text association 'Somatic Gene Fusions' and no gene reached the pathograph. Typed NTRK1, NTRK2 and NTRK3 SOMATIC_DRIVER with somatic origin, and named all three on the fusion node, which now binds protein tyrosine kinase activity as GAIN_OF_FUNCTION: the 3' NTRK kinase domain fused to a 5' partner is constitutively active without neurotrophin (PMID:33893159), a qualitative escape from ligand control. The generic tyrosine kinase term is used rather than the receptor term because many fusion proteins lack the transmembrane region. Also corrected that node's process descriptor, whose preferred_term read 'protein tyrosine kinase activity' over the GO process protein phosphorylation. The advisory reference-validation error on DOI:10.21037/pcm-23-19 in the references block predates this change.

    Integration cleanup of errors already present on main: linkml-reference-validator 0.8.0 failed this entry's evidence or deep-research reference annotations, so CI rejects any PR that touches it. Removed 2 deep-research reference finding(s) whose statement and supporting text were only the reference title, on references cached without retrievable text; the reference entries stay.

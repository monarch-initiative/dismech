  summary: 'Create: Leber Hereditary Optic Neuropathy'
  details: |
    Created kb/disorders/Leber_Hereditary_Optic_Neuropathy.yaml [MONDO:0010788, OMIM 535000] de novo.

    NEC preflight was run first with "runoak -i sqlite:obo:mondo info MONDO:0010788 -O obo", confirming OMIM:535000, Orphanet:104 and the mitochondrial-oxidative-phosphorylation basis. The Edison deep-research report was then checked against that anchor - MT-ND1/ND4/ND6 as the causal genes, strict maternal inheritance, and an explicit statement contrasting LHON with Leber congenital amaurosis - and passed, so it was used. Duplicate preflight against origin/main, all PRs and all issues found no existing LHON coverage; the closest neighbours are Autosomal_Dominant_Optic_Atrophy_Plus and Behr_Syndrome, which mention LHON only as a differential.

    Deep research: "just research-disorder falcon Leber_Hereditary_Optic_Neuropathy" (Edison, 537 s, 25 citations, 1 artifact). Report and citations sidecar are committed under research/. The DR output was treated strictly as leads: it cites DOIs rather than PMIDs, so every claim used here was re-anchored on a PMID recovered via the PMC ID converter, fetched with "just fetch-reference", and each snippet verified as an exact substring of the cached abstract. Nothing from the report was accepted without that round trip.

    GeneReviews baseline (required, chapter exists): PMID:20301353 (Yu-Wai-Man and Chinnery) was fetched, tagged GeneReviews in the top-level references block, and its Clinical Characteristics, Management, Agents/Circumstances to Avoid, and Genetic Counseling sections were cross-referenced into the phenotypes, treatments and inheritance blocks.

    Content curated: a seven-node pathophysiology chain (complex I subunit missense mutation -> complex I electron transfer deficiency -> ATP deficit and reactive oxygen species overproduction -> retinal ganglion cell degeneration and apoptosis -> papillomacular bundle axonal degeneration -> optic atrophy and irreversible central vision loss), plus a parallel penetrance-modulation node carrying mtDNA haplogroup J/K/H background, the male sex bias, and smoking/alcohol triggers. Four subtypes (MT-ND4, MT-ND1, MT-ND6, arLHON); mitochondrial and autosomal recessive inheritance blocks; 14 phenotypes spanning the core ocular syndrome, the LHON-plus extraocular arm and Harding disease; five genetic records (the three mtDNA genes, DNAJC30, and NQO1 as a pharmacogenetic modifier); four variants; three environmental exposures; three prevalence records that make the carrier-frequency versus manifest-disease penetrance gap explicit; idebenone and lenadogene nolparvovec treatment arms wired to the pathograph with target_mechanisms; two clinical trials (LEROS, RESTORE); and three KNOWLEDGE_GAP discussions with structured proposed experiments.

    A pre-PR adversarial self-review was then run over the draft and its fixes folded in before opening the PR. Substantive changes from that pass: (1) treatment target_mechanisms predicates corrected - idebenone INHIBITS -> BYPASSES, lenadogene INHIBITS -> RESTORES and retargeted from the mutation node to the electron-transfer-deficiency node it actually complements (the mtDNA mutation is neither removed nor edited by allotopic therapy), and the behavioural-avoidance edge INHIBITS -> MODULATES; (2) the RGC-5 superoxide-regulation account was demoted from asserted mechanism to flagged hypothesis, because the underlying measurements were made in a line later shown not to be of retinal ganglion cell origin, and the anatomical high-ATP-demand account was made the primary explanation for selective vulnerability; (3) transmitochondrial cybrid evidence (PMID:34311469, IN_VITRO) was added so the complex I nodes rest on experimental rather than review-only support, and the uniform-block wording was hedged because m.11778G>A and m.14484T>C differ biochemically from m.3460G>A; (4) HP:0000618 Blindness was replaced with HP:0007663 Reduced visual acuity plus severity SEVERE, since HP:0000618 implies a constricted visual field and LHON spares the periphery; HP:0001716 Wolff-Parkinson-White -> HP:0004309 Ventricular preexcitation; HP:0001332 Dystonia -> HP:0100022 Abnormality of movement, because LHON-plus dystonia tracks m.14459G>A rather than the primary variants modelled here; (5) an unevidenced "nuclear/X-chromosomal background" modifier claim was removed from the description and left as the open knowledge gap it is; (6) the 93%-in-smokers and 17.5%/5.4% penetrance figures were explicitly reconciled as pedigree-ascertained versus registry-ascertained rather than left in apparent contradiction; (7) uncontrolled gene-therapy responder rates were downgraded SUPPORT -> PARTIAL and a REFUTE item added for the non-significant treated-versus-sham difference; the RHODOS subgroup finding was downgraded to PARTIAL as post hoc; (8) evidence_source was made internally consistent across the four narrative reviews; (9) added Myopathy and Ataxia phenotypes, a histopathology block, a classifications block, the RESCUE and REFLECT trials, and the previously un-mined GeneReviews 60%-maternal-history and prenatal-testing content.

    Validation after those fixes: "just validate" passed, "just validate-terms" passed, "just validate-references" passed with 128/128 snippets verified against cached references, and the full tests/test_data.py suite passed.

    Deliberately omitted for lack of snippet-verifiable primary sources: genotype-specific spontaneous-recovery percentages, the Madrid capture-recapture prevalence figures, the Slovenian VFQ-25 quality-of-life and productivity-loss estimates, and the vitamin B12 deficiency association. All four appeared in the Edison report but could not be traced to a citable abstract with an exact quotable snippet.

    # Review: Leber Hereditary Optic Neuropathy

    - **File:** `/home/user/dismech/kb/disorders/Leber_Hereditary_Optic_Neuropathy.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical audit:** `dismech.reference_snippet_audit` — **140/140 snippets verified** against cached references. No unverified snippets.

    ## Verdict: MINOR_ISSUES

    No fabricated snippet, no wrong-gene/wrong-disease confusion, no misattributed species, and no case-report-to-general-claim overreach was found. Every quantitative figure that the entry attributes to a source (3.22 and 11.82 per 100,000; 1 in 68,403 = 1.46 per 100,000; 17.5%/5.4%; 93% penetrance in male smokers; 95–99% fiber depletion; 68% and 66.1% responder rates; P = .60 / P = .27; N = 199 vs 372) matches the cached source exactly. The entry is unusually disciplined about grading — it self-flags the RESTORE null result as `REFUTE`, downgrades the RHODOS post-hoc subgroup to `PARTIAL`, and separates cybrid (`IN_VITRO`) from clinical (`HUMAN_CLINICAL`) sentences within the same papers. The findings below are all about uncited prose or grade calibration, not about evidence fidelity failures.

    ## Findings

    ### 1. MINOR — Uncited quantitative and geographic claims in prose

    **Location:** disease `description`; `phenotypes` → *Subacute Bilateral Central Visual Loss* `description`; `progression` → *Acute and subacute phase* / *Chronic phase* `notes`; `inheritance` → *Autosomal recessive* `description`; `has_subtypes` → *arLHON*; `genetic` → *DNAJC30* `association`; `variants` → *DNAJC30 p.Tyr51Cys* `description`; `environmental` → *Other Putative Mitochondrial-Toxic Exposures* `description`.

    **What the entry claims:** several specific statements that no cited source in the file supports:
    - "Acuity commonly deteriorates to worse than 20/200 and reaches a nadir at around four months" and "most macular ganglion cell loss is complete within the first six months" — the two evidence items on that phenotype (PMID:20301353, PMID:37071596) say only "bilateral, painless, subacute visual failure" and "sudden and severe vision loss".
    - "the p.Tyr51Cys founder allele, prevalent in Central and Eastern Europe" — repeated in four places. The cached PMID:35148383 abstract characterizes p.Tyr51Cys as a founder variant in 28 individuals from 26 families but states no geographic distribution; PMID:37071596 states none either.
    - Chronic phase "From approximately 12 months after symptom onset"; "Delayed partial or (rarely) substantial recovery ... most often with the m.14484T>C genotype".
    - "These associations rest largely on case reports rather than controlled estimates" (head trauma / industrial toxins / mitochondrial-toxic drugs).

    **Why it matters:** these are all consensus-correct, but the entry elsewhere is scrupulous about labelling unsourced consensus as such (see finding 2), so the inconsistency is what stands out rather than the content. Any of these could be resolved by fetching GeneReviews' full text (the cache is `content_type: abstract_only`) or by adding the same caveat sentence used in `has_subtypes`.

    ### 2. MINOR — Consensus-only prognosis claims carry a caveat in `has_subtypes` but are stated flatly in `genetic`

    **Location:** `genetic` → *MT-ND4* `association` and *MT-ND6* `association` (both cite PMID:37071596, snippet "mutations in ND1, ND4 and ND6, respectively.").

    **What the entry claims:** "m.11778G>A ... is the most frequent primary LHON mtDNA variant and generally carries the poorest prognosis for spontaneous visual recovery"; "m.14484T>C ... is the primary LHON variant with the most favourable natural history for spontaneous visual recovery."

    **What the source says:** the quoted sentence assigns each variant to its subunit gene and nothing more. The evidence `explanation` is honest about this ("Assigns m.14484T>C to the ND6 subunit gene"), so the mismatch is between the `association` text and its only evidence item.

    **Why it matters:** the parallel `has_subtypes` entries explicitly say "both statements are the consensus clinical view rather than claims curated here against a quantitative source." That caveat should travel with the claim into `genetic`, or the claim should be trimmed there.

    ### 3. MINOR — Uncited mechanistic contrast between the three primary variants

    **Location:** `pathophysiology` → *Complex I Electron Transfer Deficiency* `description`.

    **What the entry claims:** "transmitochondrial cybrid work shows a frank assembly and catalytic-activity defect for m.3460G>A, whereas m.11778G>A and m.14484T>C are generally reported to impair coupling efficiency and raise ROS with comparatively better preserved catalytic activity."

    **What the sources say:** PMID:34311469 supports the m.3460G>A half in detail (complex I assembly 67.2% of control, in-gel activity 78.2%, basal OCR 33.1%, ATP 81.1%, ΔΨm 31.5%, ROS 129.3%). Nothing in the file's reference set addresses m.11778G>A or m.14484T>C coupling efficiency.

    **Why it matters:** the hedge ("generally reported") is appropriate and the claim is correct in the wider literature, but the sentence is the entry's justification for treating this node as "a shared functional endpoint rather than an identical molecular block" — a load-bearing modelling decision resting on an uncited statement.

    ### 4. MINOR — RGC-5 cell-line provenance caveat is asserted without a citation

    **Location:** `pathophysiology` → *ATP Deficit and Reactive Oxygen Species Overproduction* `description` and the two PMID:18427623 evidence `explanation` fields.

    **What the entry claims:** the superoxide-regulation measurement "was made in the RGC-5 cell line, which was subsequently shown not to be of retinal ganglion cell origin".

    **What the source says:** PMID:18427623 (Levin, 2007) describes RGC-5 as an RGC line throughout; the later re-identification work is not cited anywhere in the file.

    **Why it matters:** this is a *conservative* uncited claim — it downgrades evidence rather than inflating it, and the resulting `PARTIAL` grade is right. But an uncited assertion is still an uncited assertion, and this one would be cheap to source.

    ### 5. MINOR — Truncated confidence interval in a `REFUTE`-graded snippet

    **Location:** `treatments` → *Lenadogene Nolparvovec Gene Therapy*, PMID:39699886, `supports: REFUTE`.

    **What the entry quotes:** `"logMAR (+4 lines) for eyes treated with sham (difference, -0.05; 95% CI, -0.15"`.

    **What the paper says:** "…(difference, −0.05; 95% CI, −0.15 to 0.04; P = .27)."

    **Why it matters:** the quote stops mid-interval, so the snippet alone shows only the lower bound and does not itself carry the non-significance the `REFUTE` grade rests on. The `explanation` supplies P = .27 and P = .60, both of which are verbatim in the cache, so nothing is wrong — but extending the snippet by seven characters would make the grade self-evidencing.

    ### 6. MINOR — Cardiac pre-excitation phenotype is supported only by a management recommendation

    **Location:** `phenotypes` → *Cardiac Pre-Excitation* (HP:0004309), PMID:20301353, `supports: SUPPORT`.

    **What the entry quotes:** "Referral to a cardiologist for individuals with pre-excitation syndrome on".

    **What the source says:** the sentence is in GeneReviews' MANAGEMENT section and recommends referral; it does not state that pre-excitation occurs at elevated frequency in LHON, and the CLINICAL CHARACTERISTICS paragraph (which lists tremor, peripheral neuropathy, myopathy, movement disorders, MS-like illness) does not mention it.

    **Why it matters:** the inference (GeneReviews would not recommend cardiology referral for a non-feature) is sound but indirect. `PARTIAL` would match the treatment given to the structurally identical *Temporal Optic Disc Pallor* and *Centrocecal Scotoma* items elsewhere in the same file.

    ### 7. MINOR — Background sentence from a cybrid paper graded `HUMAN_CLINICAL`

    **Location:** `pathophysiology` → *Complex I Subunit Missense Mutation*, PMID:34311469, snippet "oxidoreductase (complex I) have been found to be responsible for the majority of LHON cases worldwide."

    **What the source is:** this sentence is in the paper's introduction, restating prior literature (refs 4–8, 12–14), not a result of this study. PMID:34311469 does contain human clinical material (19 Han Chinese pedigrees, 247 matrilineal relatives, penetrance 2.8–50%), so the paper legitimately carries `HUMAN_CLINICAL` items — but this particular quote is a review statement rather than either the paper's cybrid data or its pedigree data.

    **Why it matters:** low practical risk (the claim is epidemiological and uncontested), and it is *not* a `check-snippet-grading` violation — no snippet in this file carries two `evidence_source` values. Noted for completeness only.

    ### 8. MINOR — Male-excess ratio and the registry figure sit side by side without reconciliation

    **Location:** `pathophysiology` → *Penetrance Modulation by Genetic Background and Environmental Triggers* `description`.

    **What the entry claims:** "(2) Sex: males are affected four to five times more often than females" (PMID:20301353) alongside "17.5% of males and 5.4% of females in a contemporary Australian registry cohort" and "The registry authors state explicitly that historically higher male rates are not supported by their data" (PMID:34670133).

    **What the papers say:** GeneReviews does say "four to five times". Lopez Sanchez et al. say "Higher reported rates of vision loss in males with a LHON mutation are not supported by our work and other epidemiologic studies" — and their own figures imply roughly a 3.2× ratio, not 4–5×.

    **Why it matters:** both quotes are accurate and the node already carries a long, careful ascertainment caveat about not comparing the 93% and 17.5%/5.4% figures. The unreconciled item is the *ratio*: the node asserts 4–5× as an established modifier one sentence before quoting a source that contests exactly that number. A half-sentence noting that the contemporary registry ratio is closer to 3× would close it.

    ## Coverage

    - **Total evidence items in file: 140.** All 140 were examined against their cached reference.
    - **References cited: 23** — 19 PMIDs plus 4 `clinicaltrials:` records. **All 23 are present in `references_cache/`**; none missing.
      - PMID:20301353 (28 items), PMID:37071596 (17), PMID:11190025 (11), PMID:38540197 (9), PMID:19525327 (8), PMID:38272025 (8), PMID:33298565 (6), PMID:12518276 (5), PMID:35148383 (5), PMID:17668373 (5), PMID:34311469 (5), PMID:21788663 (5), PMID:39364415 (5), PMID:39699886 (5), PMID:19001017 (4), PMID:34670133 (3), PMID:38428428 (3), PMID:18427623 (2), PMID:24198293 (2), and one each for NCT02774005, NCT02652767, NCT03293524, NCT03406104.
    - **Cache limitations noted:** PMID:20301353 (GeneReviews) is cached `abstract_only`, which is why several GeneReviews-derived prose statements in finding 1 cannot be snippet-verified from the cache even though they are likely in the full chapter. PMID:34311469 is the only full-text-XML cache in the set.
    - **Cross-cutting check (step 4):** ran a per-file scan for the same quoted sentence carrying two different `evidence_source` values — **no conflicts**. Model-organism evidence is used exactly once (PMID:33298565 nonhuman-primate biodistribution) and is never the sole support for a human phenotype claim; the cybrid `IN_VITRO` items always sit alongside a human clinical item on the same node.


    # Fix summary: Leber Hereditary Optic Neuropathy

    File: `/home/user/dismech/kb/disorders/Leber_Hereditary_Optic_Neuropathy.yaml`

    All edits are prose/grading only. No evidence item was added or removed, no ontology binding
    changed, no node renamed, no new reference fetched.

    ## Findings fixed

    1. **Finding 1 (uncited quantitative and geographic claims).** I grepped every cached
       reference cited by this entry for each claim before editing; none of them is supported.
       - **DNAJC30 Central/Eastern Europe geography (asserted in four places).** PMID:35148383's
         cached abstract establishes p.Tyr51Cys as a founder variant in 28 individuals from 26
         families but states no geography (author affiliations are not a distribution claim), and
         PMID:37071596 says nothing either; a whole-cache grep for "Eastern Europe" found no
         supporting source. Removed the geographic phrase from all four locations (disease
         `description`, `inheritance` → *Autosomal recessive*, `genetic` → *DNAJC30* `association`,
         `variants` → *DNAJC30 p.Tyr51Cys*), keeping the cited founder-allele status, and recorded
         the trim and its reason in the entry `notes` alongside the file's existing "deliberately
         omitted" list.
       - **"worse than 20/200 ... nadir at around four months"** (phenotype description) and
         **"nadir around four months ... most macular ganglion cell loss complete within the first
         six months"** (progression `notes`): rewritten to keep the clinical picture but label the
         numbers as consensus clinical description rather than curated figures, using the same
         caveat sentence the file already uses in `has_subtypes`.
       - **Chronic phase "from approximately 12 months" and "delayed recovery most often with
         m.14484T>C"**: same caveat applied; the arLHON recovery half, which *is* cited, is kept
         as the sourced part.
       - **"These associations rest largely on case reports rather than controlled estimates"**
         (Other Putative Mitochondrial-Toxic Exposures): replaced with what the cited source
         actually does — frames them as putative triggers warranting reasonable avoidance and
         reports no measured association.
    2. **Finding 2 (prognosis caveat present in `has_subtypes`, missing in `genetic`).** Added the
       file's own "consensus clinical view rather than claims curated here against a quantitative
       source" caveat to the MT-ND4 and MT-ND6 `association` texts, and noted in each what the
       attached evidence item does establish (the variant-to-subunit assignment).
    3. **Finding 3 (uncited m.11778G>A / m.14484T>C coupling-efficiency contrast).** Kept the
       sentence (it is load-bearing for the node's modelling decision) but made the split explicit:
       the m.3460G>A half is attributed to the cybrid work cited here, and the other half is
       labelled as the wider literature's consensus, not curated against a cited source.
    4. **Finding 4 (RGC-5 provenance caveat uncited).** Reworded the node description and the
       PMID:18427623 `explanation` so the re-identification is attributed to the later cell-line
       authentication literature and explicitly flagged as not cited in this entry. I did not add a
       citation: the only cached source stating it (PMID:33723228) is an OPTN-glaucoma paper, and
       pulling a cross-disease reference in for a cell-line-identity aside is more intrusive than
       the finding warrants — the claim is conservative and downgrades its own evidence.
    5. **Finding 5 (truncated confidence interval in the REFUTE snippet).** Extended to
       `"...95% CI, -0.15 \nto 0.04; P = .27)."`, matching the cache's line wrapping exactly (the
       file already uses embedded `\n` for wrapped quotes in the NQO1 items). Verified against the
       cache bytes; the snippet audit re-verifies it.
    6. **Finding 6 (cardiac pre-excitation graded SUPPORT on a management recommendation).**
       Regraded the `phenotypes` → *Cardiac Pre-Excitation* item to `PARTIAL` and rewrote the
       explanation to say why, matching the treatment of *Temporal Optic Disc Pallor* and
       *Centrocecal Scotoma*. The identical snippet on the `treatments` → *Cardiology Referral for
       Pre-Excitation* item was deliberately left at `SUPPORT` — `supports` is claim-relative and a
       management recommendation fully supports a management claim. `evidence_source` unchanged in
       both, so no grading divergence is created.
    8. **Finding 8 (4–5x male excess asserted next to a source contesting it).** Changed the flat
       "four to five times" assertion to "several times more often", followed by an explicit
       half-sentence that the size of the excess is contested — GeneReviews gives four to five
       times, the Australian registry figures imply closer to three. Removed the now-duplicated
       "registry authors state explicitly..." sentence later in the same description so the node
       makes the point once.

    ## Findings intentionally skipped

    7. **Finding 7 (PMID:34311469 introduction sentence graded HUMAN_CLINICAL).** Skipped — the
       review explicitly records it "for completeness only", notes it is not a
       `check-snippet-grading` violation, and the paper does carry genuine human clinical material
       (19 pedigrees, 247 matrilineal relatives). Regrading on a hedged finding would be a new
       judgment call, not a clear fix.


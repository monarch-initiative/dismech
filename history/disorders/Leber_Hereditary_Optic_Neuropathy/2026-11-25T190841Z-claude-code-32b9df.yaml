  summary: 'Gene-family review: MT-ND1, MT-ND4, MT-ND6, DNAJC30 and arLHON complex
    I genes'
  details: |
    DNAJC30 sat on the node Complex I Subunit Missense Mutation, whose bound activity is NADH dehydrogenase (ubiquinone) activity. DNAJC30 is not a complex I subunit: it is a J-domain protein that interacts transiently with assembled complex I and supports exchange of ROS-damaged N-module subunits (PMID:33465056). It now has its own node, DNAJC30 Loss and Impaired Complex I N-Module Repair, bound to enzyme binding (its interaction with complex I subunits) and protein-containing complex remodeling, matching the gene-specific entry Leber-like Hereditary Optic Neuropathy, Autosomal Recessive 1, and linked downstream to Complex I Electron Transfer Deficiency. The mtDNA subunit records (MT-ND1 m.3460G>A, MT-ND4 m.11778G>A, MT-ND6 m.14484T>C) were checked and left unchanged. The arLHON subtype named only DNAJC30 although the entry's prose already listed NDUFS2 and NDUFA12; genetic records were added for NDUFS2 (PMID:28031252, PMID:37071596) and NDUFA12 (PMID:35141356, PMID:37071596), and for NDUFS7, NDUFV1, NDUFAF2, NDUFAF4 and NDUFAF8, which a 2026 complex I gene screen of inherited optic neuropathy associated with the arLHON phenotype (PMID:41234160). All seven are germline, subtype arLHON and typed UNKNOWN, because none has an external validity classification for LHON and most rest on one or a few families. The subtype's gene list and description were updated to match.

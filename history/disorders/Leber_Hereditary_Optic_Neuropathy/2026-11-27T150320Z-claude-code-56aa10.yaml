  summary: 'Review: add MT-ND4L (m.10663T>C, m.10680G>A) genetic record'
  details: |
    Added MT-ND4L as a gene of the LHON primary lesion. A new genetic record (relationship_type UNKNOWN, germline, no subtype) covers two rare variants in maternal lineages lacking the three common primary variants: m.10663T>C (p.Val65Ala), first reported in three independent haplogroup J patients with a partial complex I defect in lymphoblasts and cybrids (PMID:11935318), counted among nine rare primary LHON mutations in Italian, French and German probands (PMID:22879922), and found with m.10609T>C in a Kuwaiti haplogroup L3 pedigree (PMID:24568867); and m.10680G>A (p.Ala71Thr), found in two of 774 Chinese patients (PMID:22400981) and in one of 41 patients in a further whole-mitochondrial-genome study (PMID:40969215). It is typed unknown because the evidence is a handful of families in which the authors attribute part of the expression to the haplogroup background or a second variant, and the m.10680G>A report presents pathogenicity as speculation. ClinGen classifies MT-ND4L as Limited only for the lumped term mitochondrial disease (MONDO:0044970), so that tier is recorded in notes and not copied into gene_disease_validity. MT-ND4L was also added to the genes of the Complex I Subunit Missense Mutation node, with two evidence items and a sentence in the node description. MT-ND2 was assessed for LHON and not added: its only LHON report is one Russian family carrying m.4640C>A (PMID:11479733), with a complex I-linked respiration defect but normal complex I specific activity, which the 2012 complete-mtDNA study (PMID:22879922) lists as provisional. Validated: linkml-validate, term validation, reference validation (165/165 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen, snippet-grading and gene-term checks.

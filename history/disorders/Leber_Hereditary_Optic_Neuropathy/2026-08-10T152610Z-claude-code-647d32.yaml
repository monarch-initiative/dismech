  summary: Link the three conversion-gating exposures to the penetrance node
  details: |
    Backfill for issue #8085. All three exposures point at the penetrance modulation node, which exists precisely to hold the factors gating whether a carrier converts to visual loss, and they are graded on a spread the sources themselves justify. Tobacco smoking is TRIGGERS with DIRECT and supports SUPPORT because its evidence is measured at the node rather than around it, reporting clinical penetrance as a figure of 93% in men who smoked and holding the association independent of sex and alcohol. Heavy alcohol intake and the grouped other putative mitochondrial-toxic exposures are both PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL: the same study that gave smoking a penetrance figure found only a trend for alcohol and only at heavy intake, and the GeneReviews sentence for the third exposure recommends avoidance as reasonable rather than reporting a measured effect. Several pre-existing evidence items on these exposures quote sentence fragments, one of them only two words long, which would fail the repository's minimum-snippet check if newly added. Rather than reuse them, the new links cite the same references with the complete sentences from the cached abstracts. The pre-existing items were left untouched. The smoking link's GeneReviews item carries a clause explaining why it is graded above the structurally similar avoidance sentence on the other-exposures link: that one says only that avoidance would be reasonable, while this one says strongly advised and sits beside a measured penetrance figure. Without it the two links appeared to apply opposite logic to recommendations from the same source. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 140 of 140 verified with no skips.

  summary: Cross-reference the DNAJC30-specific arLHON entry from the arLHON subtype
  details: |
    Single-paragraph addition to the arLHON subtype description, made in response to
    a review suggestion on PR 9586.

    The arLHON subtype here is bound to MONDO:0030309 and therefore covers DNAJC30
    together with NDUFS2, MCAT and NDUFA12. PR 9586 adds a separate entry for the
    DNAJC30-specific child concept MONDO:0958183. Without a pointer in this
    direction the two would be liable to drift, or to have the same mechanism
    curated twice in incompatible ways. The added paragraph records the relationship
    and says that the impaired complex I repair mechanism belongs in the child entry
    rather than here.

    No mechanism, evidence, phenotype or term in this entry was changed. The note was
    placed in the subtype description rather than a notes field because Subtype has
    no notes slot, which just validate confirmed.


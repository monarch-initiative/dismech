  details: |
    Applied an independent review of the initial curation. Added the remaining PMID:32080367 Table 1 rows as phenotypes: low birth weight 6/9 (HP:0001518 Small for gestational age, whose HPO exact synonyms include Low birth weight), full/long philtrum 5/9 (HP:0000343), frontal hair upsweep 4/9 (HP:0002236), full lips 3/7 (HP:0012471), all FREQUENT; thin corpus callosum given OCCASIONAL with its 1/5 table row. Confirmed in cache/clingen/gene_validity.csv that ClinGen classifies OGT/MONDO:0030907 as Moderate (XL, SOP10, Syndromic Disorders GCEP); cached the record with just clingen-rebuild --csv-only (no manifest change) and recorded it as gene_disease_validity on the OGT row; removed the notes sentence that said no ClinGen record existed and the process wording about the GeneReviews check. Rebound the O-GlcNAc homeostasis process to GO:7770074 (protein O-linked glycosylation via N-acetylglucosamine) and added GO:0010468 regulation of gene expression (DYSREGULATED) to the gene-expression node; both confirmed with runoak. Regraded the PMID:42209020 case-count quote as HUMAN_CLINICAL (BACKGROUND). Added evidence to the cortical-development to ID edge (PMID:42770280, INDIRECT), a RECAPITULATES link from the N648Y mouse to the cortical/callosal node, PMID:35863433 in the shared-mechanism discussion, and a small-denominator note on hypotonia. Not done: PMID:25679214 was not cited because its abstract does not mention OGT (the cache stays because the deep-research report cites it, as do the other six caches the review listed); an OMIM/DOID mappings block, because sibling entries carry only mondo_mappings; Mayfield 2024 variants N806S, S93L, A431V, because they appear only as a list in a table cell.

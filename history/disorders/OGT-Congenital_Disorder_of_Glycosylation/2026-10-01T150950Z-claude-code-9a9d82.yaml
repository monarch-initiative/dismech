  details: |
    New entry for OGT-CDG (MONDO:0030907, intellectual disability, X-linked 106; OGT hgnc:8127), named as a CDG following PMID:32080367 and the note in Non-Syndromic_X-Linked_Intellectual_Disability; stub stubs/Intellectual_Disability_X-linked_106.yaml deleted. Deep research: just research-disorder falcon with --fallback; falcon was not configured (no EDISON_API_KEY) and the run fell back to claude_code, written as research/OGT-Congenital_Disorder_of_Glycosylation-deep-research-claude_code.md. Its reference validation resolved 29/30 (PMID:41651253 unresolved and not cited); term validation had no unresolved CURIEs. just preflight-dr returned WARN only because OGA, the counter-enzyme, is mentioned at 54% of OGT; the OGA sections are about this disease, so the report was used. Content: two variant-class root nodes (TPR-domain and catalytic-domain missense) each bound to OGT with molecular_functions GO:0097363 DECREASED, feeding Disrupted O-GlcNAc Homeostasis (OGA downregulation via mSin3A-HDAC1, blunted feedback), Impaired HCF1 Proteolytic Maturation (variant-restricted; the 2020 review's statement that it is not the general mechanism is recorded as REFUTE), stem-cell gene-expression changes, impaired neuronal differentiation, abnormal cortical/callosal development (mouse) and impaired synaptic development (Drosophila), wired to ID, microcephaly, thin corpus callosum, short stature and sleep phenotypes. 33 phenotypes, 8 pathophysiology nodes; frequencies are from the only pooled clinical table (13 patients, PMID:32080367 Table 1), quoted as table rows; ID and developmental delay set OBLIGATE (13/13, and 'All patients' in PMID:39059494). Variants: L254F, R284P, c.463-6T>G, A259T, E339G, A319T (UNCERTAIN_SIGNIFICANCE because it co-segregates with a MED12 variant), N567K, N648Y, C921Y. Models: C921Y and N648Y mice, TPR-variant and C941Y Drosophila, N567K and C921Y mESCs, TPR-variant hESCs, TPR-deletion patient iPSCs. No treatments section (none reported); OGA inhibition and glucosamine recorded as an EMERGING_HYPOTHESIS discussion. GeneReviews: just check-genereviews --online returned NO_CHAPTER. Hepatoblastoma (single case, possibly coincidental) and review-only mentions of connective-tissue disease and ulcerative colitis not curated. Validation: just validate 0 issues (123 snippets, 125 titles); count-verified-snippets 123/123; entity-refs, causal-targets, duplicate-keys, qualifier-terms, coarse-phenotypes OK; gene-activity grounding (baseline origin/main) no newly ungrounded genes; snippet-length, title-snippets, snippet-grading, folded-hyphens, reference-titles, term-cache-integrity, cache-order OK; just validate-disorders passed.

  summary: Add TRPV4 GeneReviews chapter and correct the severity-tier claim
  details: |
    Self-correction found while running the GeneReviews check two other reviews in this run asked for.

    The recommended query GeneReviews[TI] gives false negatives, because GeneReviews chapters carry the book title in the Book field, not in the chapter title. The correct query GeneReviews[Book] returns PMID:24830047 Autosomal Dominant TRPV4-Related Disorders for TRPV4. That chapter was already cited by the sibling Kozlowski entry, so this entry should have had it from the start.

    Its content changes a claim in this entry and in its PR body. The entry asserted, following PMID:22791502, that SEDM is a variant phenotype deviating from the TRPV4 severity series rather than a tier within it, and the PR body cited that as a correction of the deep-research report. The GeneReviews chapter, updated 2025-12, explicitly orders the five TRPV4 skeletal dysplasias from mildest to most severe with spondyloepimetaphyseal dysplasia (Maroteaux type) as the fourth tier, between Kozlowski and metatropic. The deep-research report was closer to right on that point than the PR body allowed.

    Both readings are now curated as PARTIAL evidence with the conflict stated, rather than resolved by curator preference. The description says sources differ and names which says what.

    The chapter also uses the MONDO spelling spondyloepimetaphyseal, which supports the naming note: the two spellings are not a MONDO invention.

    Added external_assertions with OMIM:184095 (cited as MIM 184095 in PMID:20503319) and a references block tagging the GeneReviews chapter.

    Orphanet remains unconsulted; just refresh-orphadata fails on a stale manifest pin, filed as issue 9687 and recorded in notes.

    13/13 snippets verified; all gates pass; no new cache rows.

  summary: 'Create: Spondyloepimetaphyseal Dysplasia Maroteaux Type'
  details: |
    Curated MONDO:0008473 as a DISEASE entry from a Perplexity deep-research report plus three primary references verified against the local cache (PMID:2229114 original clinical series, PMID:20503319 TRPV4 causation, PMID:22791502 TRPV4 dysplasia family review). All 11 evidence snippets verified as exact substrings of cached abstracts; term validation passed.

    Two deep-research findings were rejected rather than curated. The report proposed HP:0000110 among this disorder's phenotypes; HP:0000110 is Renal dysplasia, not a skeletal feature, and was dropped. The report also described SEDM as a simple severity tier within the TRPV4 series; PMID:22791502 instead calls it a variant phenotype that deviates from the general pattern, and the description follows the source.

    Functional-impact annotation was deliberately omitted from the TRPV4 node: PMID:20503319 reports SEDM patients carrying substitutions previously reported in metatropic dysplasia, so the sibling entries' gain-of-function annotation cannot be assumed to transfer. Recorded as a KNOWLEDGE_GAP discussion instead.

  summary: 'Review round 2: bind Eye Examination, debundle the diagnosis entry'
  details: |
    Review round follow-up on #11600, findings 2 and 3, applied by the PR Shepherd agent.

    Finding 2 - Absent Corneal Opacity was left with no diagnosis_term on the stated grounds that NCIT has no slit-lamp examination term. The premise is true but the conclusion did not follow: NCIT:C38060 Eye Examination is already in cache/ncit/terms.csv and already a member of the treatmentactionterm enum cache, so it validates offline with no ontology research. Bound it with preferred_term "slit-lamp examination for corneal opacity", which is the documented repo convention of binding a broader-but-accurate clinical action and carrying the specificity in preferred_term - the same shape as the cochlear-implantation worked example in CLAUDE.md. Updated the description, which previously recorded the decision to leave it unbound.

    Finding 3 - Clinical and Radiographic Findings bundled three diagnostic modalities behind an imaging-only binding, NCIT:C17369 Imaging Procedure. Unlike finding 2, this ran the wrong way round: the entry name and preferred_term were broader than the binding. Split it into two single-concept entries:
      - Clinical Examination Findings, bound to NCIT:C20989 Physical Examination
      - Radiographic Findings, keeping NCIT:C17369 Imaging Procedure

    Deliberately did NOT create a third entry for the neurophysiologic modality, although the reviewer's option 1 suggested NCIT:C88502 Nerve Conduction Velocity Test and that term is cached and enum-valid. The GeneReviews sentence covers the whole autosomal dominant TRPV4-related spectrum, which spans both the neuropathies and the skeletal dysplasias; nerve conduction studies diagnose the neuropathy phenotypes, not this skeletal dysplasia. Adding an NCV diagnostic entry to SEMD Maroteaux would have asserted something false about the disease in order to satisfy the split. The source itself scopes the radiographic limb "in the skeletal dysplasias". Both new explanations record this scoping.

    No entity references pointed at the old bundled name, so the rename breaks no foreign keys.

    Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets 126/126 verified across the four changed files; just check-entity-refs OK; just check-duplicate-keys OK; just check-causal-targets OK.

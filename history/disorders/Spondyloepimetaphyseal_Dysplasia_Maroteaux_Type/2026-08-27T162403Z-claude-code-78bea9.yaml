  summary: Address review findings 1-5 on PR 9663
  details: |
    The GeneReviews chapter was tagged and cited twice, both from its CLINICAL CHARACTERISTICS section; the other four sections were unread. This is the third instance in this run of a cached full source being mined only partially, after the two the reviewer caught on HLD15.

    Mined all four remaining sections. DIAGNOSIS/TESTING and the PMID:2229114 discriminating negatives (no corneal opacity, no keratan sulfate) became a diagnosis block — the latter was previously curated only as a differential, though absence of those findings is what makes the diagnosis. MANAGEMENT, surveillance and agents-to-avoid became five treatments, following the sibling Kozlowski entry's pattern for the same chapter. The odontoid-hypoplasia assessment before general anaesthesia is the clinically actionable one and the entry carried it nowhere. GENETIC COUNSELING supplied evidence for a claim the inheritance block was already making uncited, that both inherited and de novo variants occur, plus the 50 percent transmission risk.

    The reduced-penetrance sentence turned out to bear on the entry's existing variant-discordance knowledge gap, which the review did not note: GeneReviews states prospectively for the whole TRPV4 family that phenotype, onset and severity cannot be predicted. That makes the shared-variant observation in PMID:20503319 a recognized property of these disorders rather than an artefact of one six-patient series, and is attached to the gap.

    Added brachydactyly, tagged OBLIGATE since GeneReviews states it as universal across the family, and progressive spinal deformity — both from a sentence already quoted in the file. Replaced HP:0004322 Short stature with the more specific HP:0003498 Disproportionate short stature, which matches the original series' own wording. Consumed PMID:33774370, cached but previously cited only in notes prose.

    Regraded the clinical-characteristics GeneReviews item from OTHER to HUMAN_CLINICAL. The nosology-ordering item stays OTHER: that one is a classification judgement, not an observation, and the two now differ for a stated reason.

    One term error caught by validation: NCIT:C16502's canonical label is Diagnostic Imaging Testing, and I had put the preferred_term (cervical spine imaging) in the label slot. Corrected; the sibling entry has it right.

    25/25 snippets verified; all gates pass; graph clean with a single root and the terminal node now wired to its phenotypes; no new cache rows.

  summary: 'Genetics pass (wiring-002): add the genetic: block; CASP10 bound and graded
    DISPUTED'
  details: |
    Genetics pass for issue #12191. This entry had no genetic: block at all. CASP10, the MONDO-recorded causal gene for MONDO:0011383 (ALPS type 2A), was named in the subtype description, in the pathophysiology node description, and in the entry's own notes: block quoting its HGNC id, and was bound nowhere. FAS and FASLG were bound on has_subtypes rows and on the apoptosis node but had no genetic: record either.

    Research first. GeneReviews (PMID:20301287, fetched and tagged for this pass) still lists CASP10 among the ALPS genes and states that ALPS-CASP10 is inherited in an autosomal dominant manner. The subtype originates in Wang et al. 1999 (PMID:10412980), two kindreds with ALPS type II and independent missense CASP10 variants. Against that, a 2024 study (PMID:38704374) retrieved six carriers of the previously implicated variants (p.C401LfsX15, p.V410I, p.Y446C) from a diagnostic database, found none of them had ALPS and two were healthy, found FAS-mediated apoptosis normal even in a homozygous carrier with completely abolished CASP10 protein, and concluded that caspase-10 is dispensable for FAS-mediated apoptosis.

    Curation. Added a genetic: block with three records: FAS (CAUSATIVE), FASLG (CAUSATIVE), and CASP10 graded relationship_type: DISPUTED with both the founding SUPPORT evidence and two REFUTE items from the 2024 study. Bound CASP10 on the ALPS-CASP10 has_subtypes row and as a genes: descriptor on Defective Fas-Mediated Lymphocyte Apoptosis, with a node-level notes: recording that its placement there is what the 2024 study contests and that the FAS and FASLG arms are unaffected. The subtype row and its MONDO binding were kept because the entity exists in both OMIM (603909, confirmed as the MONDO:0011383 xref) and MONDO; only the grading records the dispute.

    Not done: no ClinGen gene-disease validity classification is cited, because references_cache/ holds no CGGV record mentioning CASP10 and the ClinGen refresh was not run (its pin is known to have drifted, dismech#10426). The DISPUTED grading therefore rests on published literature, not on a ClinGen verdict. Note also that the KGX exporter ignores relationship_type (dismech#12320), so this DISPUTED record will export as a plain contributes_to edge.

    Validated: just validate (22/22 snippets), validate-terms, check-genereviews (chapter now TAGGED), check-snippet-grading, and the offline gate set.

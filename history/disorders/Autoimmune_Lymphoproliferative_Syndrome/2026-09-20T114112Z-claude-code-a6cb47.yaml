  summary: 'Review round 1: bind ALPS-FASLG to MONDO:0700306; retract a false absence
    claim'
  details: |
    Second finding on this entry, caught in self-review after the first push rather than by the reviewer.

    The entry's notes: asserted that ALPS-FASLG was left unbound because no MONDO term specifically denotes the FASLG form, and the FASLG genetic: record added in the first commit restated it. Both were wrong. runoak -i ols:mondo search 'l~FASLG' returns MONDO:0700306, whose label is 'FASLG-related immunodeficiency' but whose synonyms include 'ALPS-FASLG' and 'Autoimmune lymphoproliferative syndrome caused by a homozygous null FAS ligand (FASLG) mutation'. Bound the ALPS-FASLG row to it and rewrote both prose claims.

    Why the original search missed it is the part worth keeping: MONDO names the concept after the gene and the immune phenotype rather than after ALPS, and files it under MONDO:0021094 immunodeficiency disease rather than under MONDO:0017979. So a label search on the disease name does not reach it, and neither does walking the ALPS descendants. The entry's separate claim that its exclusion list is complete against MONDO's descendants of MONDO:0017979 survives unchanged for the same reason — MONDO:0700306 is not one of them.

    This is the dismech-terms rule about unverified absence notes, in the subtype slot: the original note asserted a search had been done without naming it, and it was wrong. The replacement names the query. The same lesson was applied back to this branch's CETN3 absence claim on Autosomal_Recessive_Primary_Microcephaly, which was re-run with synonym-inclusive searches as well as label searches.

    Whether MONDO should file this concept under ALPS is a question for MONDO, not something to work around here; it is flagged in the entry notes and in the pull request, and no upstream issue was filed.

    Validated: just validate (22/22 snippets), validate-terms (MONDO:0700306 resolves and is in the DiseaseOrSubtypeTerm enum; one row each added to cache/mondo/terms.csv and the enum cache), and the offline gate set.

  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Evidence-integrity review of all 11 evidence items against the entry's 3 cached references, re-reading each cited publication, with the FAS-related sibling entry consulted for cross-entry consistency. Two defects fixed: (1) the 2009 NIH consensus workshop report (PMID:20538792), a criteria document with no primary data, was graded HUMAN_CLINICAL in two places - both regraded OTHER, matching CLAUDE.md's consensus-without-data rule and the FAS-related sibling entry's grading of the same PMID; (2) the autosomal-dominant inheritance block was supported only by a quote about non-Mendelian expression - added a second exact-quote item from PMID:36621650 contrasting heterozygous FAS mutations with rare biallelic FASLG mutations, supporting the dominant-acting FAS genotype. Named-entity check against the FAS-related sibling is clean: every quote is either genuinely syndrome-level or attached to the specific subtype it belongs to (both FASLG quotes sit on ALPS-FASLG); no FAS-specific finding carries a root-level claim. Left unfixed with reasons: a historical FAS-discovery quote whose explanation claims exactly what it establishes; four unevidenced phenotypes (the clinical triad is evidenced one node above and clinical depth lives on the FAS sibling; coverage gap, not defect); a diagnosis description broader than its quote with no better quote available in the cached reference set; a LOSS_OF_FUNCTION vs DECREASED modifier question (ontology binding, out of scope). Validation: just validate passes; strict snippet audit clean.

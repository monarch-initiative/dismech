  summary: 'Create: Otosclerosis'
  details: |
    De-novo curation of Otosclerosis (MONDO:0005349) as a single DISEASE entry. The
    entry models the pathophysiology as one causal chain: germline susceptibility
    variants in bone-remodelling genes, failure of the otic capsule's normal
    suppression of remodelling (the osteoprotegerin/RANKL axis, with TGF-beta1
    signalling), a focal osteolytic phase seeded at the fissula ante fenestram,
    sclerotic remodelling of the focus, and then two branches - stapes footplate
    fixation at the oval window giving the conductive loss, and endosteal/cochlear
    extension giving the sensorineural component. 12 pathophysiology nodes, 17
    downstream edges, 8 phenotypes, 9 genetic records, 3 environmental exposures, 3
    diagnostic modalities, 5 treatments, 3 animal models with modeled_mechanisms, 5
    differential diagnoses, 7 discussions (KNOWLEDGE_GAP, HUMAN_MODEL_MISMATCH and
    CONTROVERSY), 4 prevalence records and 3 progression phases. 189 evidence items
    citing 68 distinct PMIDs.

    Lump/split: curated as one disease, agreeing with the stub's DISEASE
    disposition. MONDO carries ten numbered otosclerosis terms beside the parent
    (otosclerosis 1-5, 7, 8, 10-12; 6 and 9 unassigned) and these were deliberately
    NOT made has_subtypes. Eight are linkage intervals of tens of megabases mapped
    in single multiplex families with no gene, no distinguishing phenotype and, for
    OTSC2, a failed replication; the two that name genes (FOXL1, SMARCA4) were each
    found in one kindred and are recorded as causative genes. No clinical or
    therapeutic decision follows from which interval a family maps to, so the loci
    are consolidated into one genetic record. The fenestral/retrofenestral axis was
    also considered and rejected as a subtype axis: the temporal-bone literature
    treats endosteal disease as a stage of the same lesion, so it is modelled as a
    branch in the pathophysiology chain instead. No GeneReviews chapter exists for
    this disease; PubMed searches confirmed that.

    Provider: Perplexity sonar-deep-research (research/Otosclerosis-deep-research-perplexity.md,
    needs_review: true). Corrections made to the report: it offered five wrong
    ontology bindings, four of which its own Term Validation section flagged.
    UBERON:0001750 is lacrimal apparatus, not middle ear; UBERON:0002228 is rib,
    not stapes; UBERON:0001738 is thyroid cartilage, not cochlea; NCIT:C26835 is
    Nervous System Disorder, not otosclerosis; and HP:00003944, offered twice for
    mixed hearing impairment, does not exist. None of these reached the entry. The
    correct bindings used instead are UBERON:0005411 (bony otic capsule),
    UBERON:0002496 (stapes base), UBERON:0001844 (cochlea) and HP:0000410 (Mixed
    hearing impairment); every CURIE in the entry was looked up independently
    before being written. The report also mislabels HP:0001730 as "age-related
    progressive hearing loss" when it is Progressive hearing impairment. Several
    of the report's central claims are sourced to Wikipedia, StatPearls, OMIM entry
    pages, a German ICD-code website and a lecture PDF, none of which is citable
    here, so the primary literature behind those claims was located independently
    through PubMed. Rejected content: the autoimmunity/HLA hypothesis (a patchwork
    of small unreplicated association studies) and quality-of-life instruments
    named without otosclerosis-specific results. No datasets block was added
    because no otosclerosis-specific accession could be verified.

    Two evidence conflicts are recorded rather than resolved: the frequency of
    cochlear involvement (10% in one review, 20-30% in another, both cited on the
    sensorineural and mixed hearing loss phenotypes), and the measles hypothesis,
    where the contradicting British cohort is kept as a REFUTE item on the
    environmental entry. One item is graded NO_EVIDENCE deliberately - an
    osteogenesis imperfecta stapes-surgery series that states the general principle
    this entry asserts but is about a different disease.

    Validation run and read (all with the shared venv): just validate -> schema
    "No issues found", terms "Validation passed", references 189/189 snippets
    verified; just count-verified-snippets -> 189/189; just validate-terms ->
    passed; just check-entity-refs -> OK; just check-causal-targets -> OK, no new
    broken targets; just check-duplicate-keys -> OK; just check-enum-values -> OK;
    just list-gene-term-mismatches -> 8 gene bindings, 8 named by the entry, 0
    naming a different gene; just check-qualifier-terms-online -> OK, 390 labels
    match, 102 resolved online; just validate-disorders (authoritative batch) ->
    all passed, 189/189. Whole-KB ratchet gates, none with a baseline edit:
    check-snippet-grading, check-title-snippets, check-snippet-length,
    check-reference-titles, check-folded-hyphens, check-environmental-evidence -
    all OK with no new findings. just normalize-cache -> 0 files updated; just
    check-term-cache-integrity -> OK; just check-cache-order -> OK. The six UBERON
    and eight NCIT/ECTO bindings were additionally spot-checked concept-by-concept
    against ols: adapters, because label validation cannot tell a right label on a
    wrong concept. One defect was found in the drafted text and fixed: the tinnitus phenotype's evidence quoted a mid-sentence fragment and its explanation claimed the cached record splits the sentence at the decimal point in 84.5%. The cache does not; the full sentence verifies. The snippet now carries the whole 56%-84.5% range and the explanation says the range is pooled and spans two frequency bands, which is why FREQUENT was set from its lower bound. The stub stubs/Otosclerosis.yaml is deleted by this change.

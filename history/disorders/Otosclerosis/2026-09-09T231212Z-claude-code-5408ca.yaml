  summary: 'Review round 1: add cochlear implantation outcome evidence'
  details: |
    Acted on the non-blocking suggestion in the approving review of PR 11569. The deep-research report cited PMID:39155792 (far-advanced otosclerosis cochlear-implant cohort, n=17, all with prior stapes surgery) and its cache file was committed with the entry but nothing cited it, so the treatment carried indication and sequencing evidence with no outcome measure. Added a third SUPPORT item on the Cochlear implantation treatment quoting the results sentence verbatim from the cached record rather than from the report, since 5 of that report's 7 checked quotes were near-miss paraphrases. The explanation states that the cohort had already undergone stapes surgery, so the figure describes implantation as the second operation rather than the first. Snippet count went from 99/99 to 100/100 verified. Did not act on the review's second suggestion, that speech discrimination impairment be modeled as its own phenotype: it is a functional measure of the hearing-loss phenotypes already curated, the reviewer flagged it as a judgement call rather than a defect, and the HP term the report offered for it is one of the 13 mislabelled CURIEs.

  summary: 'Genetics pass: wire FOXL1/SMARCA4/MEPE, map OTSC11 and OTSC12'
  details: |
    Genetics-gap pass for series-070 (issue 12277). Gene wiring measured with dismech.qc_plugins.gene_mechanism_wiring_coverage, which builds the causal graph and so reads gene, gene_term, genes and genetic_context gene slots together: 2/6 mechanism-relevant genetic records reached a pathophysiology node before this pass, 5/6 after. FOXL1, SMARCA4 and MEPE were bound as genes descriptors on Loss of Otic Capsule Remodeling Quiescence, each with its own evidence item on that node: PMID:34633540 for the authors' inhibitory role for wild-type Foxl1 in otic-capsule bone remodelling, PMID:37399313 for BRG1 in postnatal otic-capsule bone homeostasis through osteoblast differentiation (graded INDIRECT because it is the authors' proposal, not a measurement in human otic capsule), and PMID:36653343 for the MEPE increased-bone-turnover model (graded INDIRECT and quote_role BACKGROUND because the GWAS restates another group's model). RELN is left unwired deliberately: its own genetic record records that reelin has no demonstrated link to the bone dysregulation of otosclerosis, so there is no node it can be bound to. Checklist row MONDO:0957928 (otosclerosis 11, FOXL1) was recorded as a skos:narrowMatch in mappings.mondo_mappings rather than as a has_subtypes row, following the entry's existing ruling that the numbered OTSC loci are genetic detail of one disease rather than clinical subtypes, and the Multiple_Synostoses_Syndrome precedent for that shape. MONDO:0968980 (otosclerosis 12) was mapped the same way after NCBI MedGen concept 1856162 was read live and links it to NCBI Gene 6597, approved symbol SMARCA4; MONDO asserts no causal gene on that class. Gates: validate, validate-terms, count-verified-snippets (151/151 over both changed entries), list-gene-term-mismatches --resolve (26/26 compared, 0 findings).

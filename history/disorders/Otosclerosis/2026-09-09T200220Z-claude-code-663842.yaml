  details: |
    Created kb/disorders/Otosclerosis.yaml (MONDO:0005349) from the lump-reviewed stub, which was deleted. Curated as a single Disease per stubs/Otosclerosis.yaml entry_type DISEASE: the numbered OTSC linkage loci and reported genes (FOXL1, SMARCA4, MEPE, TGFB1, RELN, CD109, SERPINF1, COL1A1, TNFRSF11B) are recorded under genetic:, not as has_subtypes; histologic/clinical/cochlear forms are recorded under stages:. Pathograph is an eight-node causal chain from reduced osteoprotegerin restraint, local TNF-alpha/IL-1beta expression and dysregulated TGF-beta signalling, through loss of otic-capsule remodeling quiescence, focal otospongiotic resorption and sclerotic replacement, to stapes footplate fixation (conductive loss) and cochlear endosteal involvement (mixed loss, vestibular symptoms). Module conformance to osteoporosis_bone_resorption was considered and declined - that module scopes to the osteoporoses and terminates in net bone loss, whereas otosclerosis is focal in a normally quiescent bone and ends in net sclerosis; the reasoning is recorded on the node and in entry notes. Contested claims are curated as SUPPORT/REFUTE pairs rather than resolved: SERPINF1 (PMID:27056980 discovery vs PMID:30968248 non-replication), persistent measles virus infection (PMID:24676726 detection vs PMID:28971731 non-detection), and pregnancy/estrogen exposure (PMID:33107781 null). Deep research: 'just research-disorder perplexity Otosclerosis' failed three times with 'Server disconnected without sending a response' on the default sonar-deep-research model; 'just dr_fallback=--fallback' did not engage because a runtime API error is not treated as the provider being unable to take work, and an explicit --fallback-provider chain did not engage either. The committed report research/Otosclerosis-deep-research-perplexity.md is a Perplexity run on sonar-reasoning-pro, so the requested provider did produce it. Its reference validation was 12/12 resolved, 0 unresolved, 2/7 quotes valid, needs_review true; term validation was 26/33 resolved with 13/27 labels naming a different term, so no CURIE was lifted from it and every binding was selected independently with OAK. No datasets: block was added because 'just discover-datasets Otosclerosis' returned no DIRECT candidate - all hits were GENE_ONLY lung cancer, AML and macular degeneration studies reached through SMARCA4/TGFB1/RELN. Validated: just validate (98/98 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-qualifier-terms-online, check-enum-values, check-stubs, check-environmental-evidence, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, and just validate-disorders.

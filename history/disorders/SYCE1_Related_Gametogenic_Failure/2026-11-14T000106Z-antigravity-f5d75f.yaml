  summary: 'Review and enrich: SYCE1-related gametogenic failure'
  details: |
    Grounded Synaptonemal complex assembly failure with GO molecular_functions (GO:0005198 structural molecule activity, GO:0005515 protein binding), cell_types (CL:0000586 germ cell), cellular_components (GO:0000795 synaptonemal complex), and biological_scale across all pathophysiology nodes. Verified PMID:34718620 HEK293 co-IP snippet is accurately graded IN_VITRO. Added synonyms, Harrison's chapter classifications (ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE), ultra-rare prevalence literature estimates, subtype bindings (POF12/SPGF15) on sex-specific phenotypes, causal variants and multicenter Strong validity evidence (PMID:40896145) on SYCE1, Cytogenetic Analysis and Biopsy Procedure diagnostics, TESE 0/14 surgical sperm-retrieval outcome evidence on treatments, and the humanized Syce1 c.721C>T mouse model (PMID:32402064).

  summary: 'Genetics pass: add the POF12 and SPGF15 subtype rows'
  details: |
    Genetics pass for the series-069 row MONDO:0014847 spermatogenic failure 15 (SYCE1),
    which sits directly under this entry's own disease_term.

    Row ruling: has_subtypes row, and a second one beside it. MONDO:1060214, the
    gene-axis term bound here, has two children and both assert hgnc:28852 in their
    axioms: MONDO:0014844 premature ovarian failure 12 and MONDO:0014847 spermatogenic
    failure 15. Both are now subtype rows, POF12 and SPGF15, each with SYCE1 bound and
    its own founding-report evidence: the consanguineous pedigree with two homozygous
    affected sisters for the female arm, and the two men with non-obstructive azoospermia
    whose SYCE1 CNVs arrest spermatogenesis at the pachytene stage for the male arm.
    They are rows rather than separate entries because the lesion, the
    synaptonemal-complex node and the management are shared; what differs is which
    gamete lineage the arrest is observed in.

    Worth recording as a caught error: the first version of the SPGF15 row asserted in
    notes that MONDO had no matching numbered class for the female presentation. That was
    false and was refuted by querying the children of MONDO:1060214, which returns POF12.
    The note was corrected and the POF12 row added before anything was committed.

    Anchor audit: disease_term MONDO:1060214 is the ClinGen-minted gene-axis class, its
    definition covers both the male and female presentations, and its two children are
    now the entry's two rows, so it passes both the over-broad and the reciprocal test.
    No change.

    Wiring is unchanged and was already complete: 1/1 causal genes wired, 5/5 phenotypes
    with a causal inlink, 0 of 4 pathophysiology nodes without an outgoing edge.


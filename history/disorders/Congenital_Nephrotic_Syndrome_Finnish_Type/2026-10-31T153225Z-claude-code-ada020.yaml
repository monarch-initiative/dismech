  summary: 'Create: Congenital Nephrotic Syndrome, Finnish Type'
  details: |
    New entry for MONDO:0009732 (NPHS1). entry_type decided as DISEASE: MONDO lists no descendants and one causal gene; milder childhood-onset NPHS1 disease (PMID:18614772) is recorded as the mild end of the same allelic series rather than a separate entry. Pathograph: biallelic NPHS1 loss (founder Fin-major/Fin-minor nulls; ER-retained missense nephrin) -> absent slit diaphragm -> glomerular filtration barrier failure -> fetal proteinuria/raised amniotic AFP and whole-body protein loss -> hypoalbuminaemia, oedema, secondary hypothyroidism, infections, thrombosis; plus a separate post-transplant anti-nephrin immunity node for graft recurrence in Fin-major homozygotes. Deep research: falcon was requested but not configured in this environment, so the run fell back to openscientist (recorded in the report frontmatter); 36/36 references resolved and just preflight-dr passed. All evidence was taken from PubMed abstracts fetched with just fetch-reference. No GeneReviews chapter exists (just check-genereviews --online). Validated with just validate (58+ snippets, 0 issues), just validate-terms, and the offline per-file gates. Following the claim-issue triage comment, two nodes conform to nephrotic_podocyte_injury and the Fin-major founder enrichment is recorded as a population_effects row bound to HANCESTRO:0321.

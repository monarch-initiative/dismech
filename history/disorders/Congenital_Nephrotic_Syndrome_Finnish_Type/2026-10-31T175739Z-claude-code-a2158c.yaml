  summary: 'Review round 1: ClinGen validity, hypercholesterolaemia, graft-recurrence
    treatment'
  details: |
    Addressed the first automated review. Blocking: recorded the ClinGen Definitive AR gene-disease validity for NPHS1 (CGGV assertion b474ea36, Glomerulopathy GCEP; just check-gene-validity reports no conflict or backfill), and added Hypercholesterolemia (HP:0003124) wired from Massive Urinary Protein Loss. Optional items taken: plasma exchange with rituximab for anti-nephrin graft recurrence (PMID:24682440, PMID:21672106); Proteinuria frequency set to OBLIGATE; a second Edema evidence item; Hydrops fetalis and Tubular microcystic change phenotypes; Fin-major/Fin-minor population carrier frequency (PMID:10839769); a progression block with the untreated Finnish course and current timing of kidney failure. The unsupported VERY_FREQUENT band on raised amniotic AFP was removed rather than kept on one case and a carrier study. Not taken: prematurity and small-for-gestational-age (no quotable abstract found), and a separate peritoneal dialysis row (no source specific to it).

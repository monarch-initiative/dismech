  summary: Address PR #17302 review by adding clinical trials and investigational therapies, splitting respiratory and enteric GI pathophysiology nodes, and adding nine documented phenotypes
  details: |
    Fetched and cached four ClinicalTrials.gov records (NCT05025332, NCT07135050, NCT07150026, NCT04132427), added a clinical_trials block, and added investigational treatments for oral NNZ-2591, MZ-1866 AAV9 intracerebroventricular TCF4 gene therapy (GENE_THERAPY, linked to TCF4 Haploinsufficiency with preclinical eLife rescue support), vorinostat HDAC inhibition (CHEBI:45716, linked to TCF4 Haploinsufficiency), and microbiota transfer therapy (NCIT:C118643). Split Autonomic / Brainstem Respiratory Dysregulation into Brainstem Respiratory Control Dysregulation (CELLULAR, GO:0002087, retaining SCN10A/Nav1.8 edges) and Enteric Autonomic Gastrointestinal Dysmotility (CELLULAR, CL:0007011 enteric neuron, GO:0120054 intestinal motility). Added nine phenotypes documented by GeneReviews and Orphanet (Episodic Breath-Holding / Apnea HP:0002104, Feeding Difficulties HP:0011968, Failure to Thrive HP:0001508, Thick Vermilion Border HP:0012471, Anteverted Nares HP:0000463, Single Transverse Palmar Crease HP:0000954, Astigmatism HP:0000483, Corpus Callosum Hypoplasia HP:0007370, and Scoliosis HP:0002650). Reclassified the DOI:10.1038/s41380-022-01811-4 introduction snippet quote_role to BACKGROUND, marked unknown developmental mechanisms on craniofacial/ocular/palmar edges, split Ketogenic Diet Therapy (NCIT:C15447, BEHAVIORAL) from Anticonvulsant Therapy, and split Pitt-Hopkins-like Syndrome into MONDO-bound PTHS-like 1 (MONDO:0012400) and PTHS-like 2 (MONDO:0013690).

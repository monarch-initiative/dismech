  summary: Fixed short snippet and missing GeneReviews/phenotype evidence, added ClinGen
    TCF4 Definitive validity and ORPHA:2896, and wired pathophysiology
  details: |
    Fixed baseline 4-word snippet on Wide Mouth, added and tagged GeneReviews chapter PMID:22934316 alongside consensus statement PMID:30677142, ORPHA:2896, and ClinGen Definitive validity assertion CGGV:assertion_096f830c-0065-456a-9e26-db54fd157981-2018-05-02T170000.000Z, and removed draft process narration from notes. Preserved protected node SCN10A / Nav1.8 Channel Dysregulation and grounded all five pathophysiology nodes with biological_scale, TCF4 (hgnc:11634) and SCN10A (hgnc:10582), GO molecular functions and biological processes, astrocyte/neuron cell types, UBERON locations, quote_role annotations, and bare-name downstream edges to all 18 phenotypes. Supplied missing evidence on Postnatal Microcephaly, Motor Stereotypies, and Constipation, expanded phenotypes to 18 (adding Autistic behavior, Gastroesophageal reflux, Deeply set eye, Prominent nasal bridge, Myopia, Strabismus, Hypotonia, Ataxia, and Sleep disturbance), bound MONDO terms on differential diagnoses, and enriched treatments including preclinical Nav1.8 inhibition and autonomic/seizure/developmental management.

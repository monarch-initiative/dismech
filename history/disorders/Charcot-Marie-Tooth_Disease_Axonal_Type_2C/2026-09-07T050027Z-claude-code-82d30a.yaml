  summary: 'Review round: keep the neurophysiology queryable as a qualifier'
  details: |
    Review round on PR #11278. The diagnosis record is named 'Molecular Genetic Testing with Characteristic Neurophysiology' and both halves matter, but diagnosis_term is single-valued and was bound to NCIT:C15709 Genetic Testing alone, which is the right primary binding since genetic testing is the confirmatory test per GeneReviews. Added the axonal electrophysiology as a qualifiers predicate-value pair following the house pattern (NCIT:C18020 Diagnostic Procedure as predicate, the specific procedure as value; Bullous_Pemphigoid is the worked example, and the predicate has 29 existing uses). The value is NCIT:C88502 Nerve Conduction Velocity Test, which covers both measurements the description names - reduced CMAP amplitudes with preserved conduction velocities. Because validate-terms does not look inside qualifiers, this was checked with just check-qualifier-terms-online as well as the offline gate; both CURIEs were already cached and their labels match the ontology.

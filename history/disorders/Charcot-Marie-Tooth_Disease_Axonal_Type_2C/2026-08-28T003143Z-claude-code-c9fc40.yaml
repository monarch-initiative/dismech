  summary: 'Review round 1: correct the mechanism, add clinical layer'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 9782. Two of the changes are corrections rather than additions and matter more than the completeness items. First, the entry asserted a neuron-autonomous calcium-toxicity chain as uncontested. PMID:38776392, already cached in this repo and already curated in the sibling Scapuloperoneal_Spinal_Muscular_Atrophy entry, shows that in knock-in mice carrying the same ankyrin-domain substitutions, deleting the mutant allele from endothelial cells rescues the phenotype while deleting it from neurons, glia or muscle does not, and that motor neuron degeneration is non-cell-autonomous via focal blood-spinal cord barrier breakdown. An Endothelial Blood-CNS Barrier Breakdown node was added and the two accounts are now curated as competing hypothesis groups, with the endothelial one CANONICAL and the neuron-autonomous one ALTERNATIVE. Second, reading PMID:20037588 for the variant spectrum surfaced a controversy the entry had flattened: that 2010 paper concluded the mutations produce decreased stimulus-dependent channel activity and reduced surface expression, and proposed haploinsufficiency, which is the opposite direction to the gain-of-function reading this entry adopts. A third hypothesis group records that, marked DEPRECATED because the enum has no CONTESTED value, with a note that the intent is superseded-but-historically-real. Third correction: the channel-blockade knowledge gap stated that blockade had been shown only in transfected cells and was untested in vivo. That was factually wrong. A systemic TRPV4 antagonist rescues symptomatic knock-in mice. The gap was rewritten as a HUMAN_MODEL_MISMATCH about whether a rescue measured against early murine lethality predicts benefit in a chronic non-lethal human disease. Completeness items: added treatments from the GeneReviews management section including the vocal-fold and respiratory-infection guidance, a diagnosis section with the molecular criteria and surveillance schedule, the Trpv4 knock-in mice as an animal model with RECAPITULATES and PARTIALLY_RECAPITULATES links and a severity limitation, joint contractures as the fourth item of a GeneReviews sentence already quoted three times, and citations to both 2010 gene-discovery papers for the variant spectrum. Corrections from review: evidence_source on the 17-family sequencing item regraded IN_VITRO to HUMAN_CLINICAL, the high-penetrance claim qualified to the single family it came from with the GeneReviews reduced-penetrance statement recorded alongside, calcium ion homeostasis modifier changed to DYSREGULATED, redundant calcium channel activity descriptor dropped, denervation node rescaled to TISSUE. Snippets 40 of 40 verified.

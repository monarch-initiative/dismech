  summary: 'Create: Charcot-Marie-Tooth Disease Axonal Type 2C'
  details: |
    New Disease entry for MONDO:0011633, TRPV4-related CMT2C, curated from a claude_code deep-research report at research/Charcot-Marie-Tooth_Disease_Axonal_Type_2C-deep-research-claude_code.md. The report resolved 13 of 13 references with confabulation_rate 0.0 and both checked quotes valid, but only 6 of 13 scored on topic, so claims were anchored to primary abstracts. The GeneReviews baseline required for a Mendelian entry is PMID:24830047, Autosomal Dominant TRPV4-Related Disorders, tagged in the references block. Its Clinical Characteristics section covers all three TRPV4 neuromuscular phenotypes together rather than CMT2C alone, so features drawn from it are curated with that scope stated in each evidence explanation instead of being silently attributed to CMT2C. Pathophysiology is a five-node chain: TRPV4 ankyrin-domain gain-of-function variant, cytotoxic intracellular calcium elevation, motor-predominant axonal degeneration, and two endpoints, laryngeal and diaphragmatic denervation and distal limb weakness with sensory loss. The gain-of-function direction is curated in both available slots per the CLAUDE.md decision tree: genetic_context functional_impact_category GAIN_OF_FUNCTION for the variant consequence and a GAIN_OF_FUNCTION modifier on the calcium channel activity molecular function, since the authors state the qualitative claim that gain rather than loss is pathologically important. The boundary against the existing Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant and Scapuloperoneal_Spinal_Muscular_Atrophy entries is drawn on sensory involvement, a definitional rather than a clinical ground, and recorded in top-level notes. Two KNOWLEDGE_GAP discussions: the TRPV4 genotype-phenotype discordance, where the same variant yields CMT2C or undifferentiated CMT2 within one family and non-ankyrin variants cause skeletal dysplasia with no neuropathy, and the channel-blockade therapeutic hypothesis, recorded as a gap attached to the calcium node rather than as an absent treatments section. Validated with just validate, just validate-terms, just count-verified-snippets at 22 of 22, just check-entity-refs and just check-duplicate-keys.

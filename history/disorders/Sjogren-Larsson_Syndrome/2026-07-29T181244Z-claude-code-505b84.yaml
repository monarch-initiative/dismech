  summary: 'Create: Sjogren-Larsson Syndrome (ALDH3A2 / FALDH deficiency)'
  details: |
    New de-novo entry for Sjogren-Larsson syndrome (MONDO:0010031, ALDH3A2 fatty aldehyde dehydrogenase deficiency). Deep research via the claude_code provider (research/Sjogren-Larsson_Syndrome-deep-research-claude_code.md); no GeneReviews article exists for this disease (confirmed by PubMed search) so primary literature was used as the baseline. Seven atomic (unbundled) pathophysiology nodes model the ALDH3A2 loss-of-function -> impaired fatty aldehyde oxidation -> fatty aldehyde/alcohol accumulation -> three site-specific arms (epidermal barrier disruption -> ichthyosis; CNS myelin/membrane lipid disruption -> spastic diplegia/intellectual disability/leukoencephalopathy/seizures; retinal crystalline deposition -> glistening white dots) plus a leukotriene B4 accumulation arm -> pruritus (the zileuton drug target). 11 phenotypes, ALDH3A2 genetics, Swedish prevalence, three diagnostics (FALDH assay/molecular testing, MR-spectroscopy 1.3ppm lipid peak, urinary LTB4), treatments (zileuton with target_mechanisms, systemic acitretin, topical skin care, baclofen, physiotherapy, MCT diet; therapeutic_modality tagged), a Phase 3 clinical trial (NCT03445650, reproxalap aldehyde scavenger), classifications, and a discussions section (KNOWLEDGE_GAP on the three competing pathogenic mechanisms; OPEN_QUESTION on whether LTB4-directed therapy is CNS-disease-modifying). Incorporated an internal red-team review pass before PR: fixed a claim-evidence snippet mismatch on the CNS node, upgraded two ontology terms to exact matches (GO:0050061 long-chain fatty aldehyde dehydrogenase; HP:0030501 macular crystals), split the epidermal node for atomicity, and added the diagnostic/treatment/clinical-trial/dysarthria completeness items. Validated: linkml schema, term validation (--labels), and reference validation all pass; all evidence snippets verified as exact substrings; pathograph fully connected.

  details: |
    Response to two review rounds on PR #10198.

    Round 1 - four blocking findings, all resolved from snippets already committed and
    already verified in the PR; no new literature was searched.

    - Phenotypes expanded from 6 to 16. Every addition came from a sentence already quoted
      elsewhere in the entry. Banding was decided per source rather than uniformly: FREQUENT
      for the three features counted 3/3 in the 2022 series and for the four named in the
      disease-level characterization sentence of PMID:35109800; OCCASIONAL for seizures,
      hepatic and renal involvement, which rest on the single Chinese patient. Each
      explanation states which of the two it is, because the band alone cannot distinguish a
      counted frequency from a judged one.
    - GO:0030488 (tRNA methylation) replaced by GO:0070901 (mitochondrial tRNA methylation),
      which is what the preferred_term already said. The compartment is the disorder.
    - PMID:33398350 was cached and claimed as cited in notes but appeared in zero evidence
      items. Repaired by using it on the entry's weakest node rather than by deleting the
      claim.
    - histopathology section added, and the giant-mitochondria finding wired into the
      CONTROVERSY attaches_to so the structural half of that argument is retrievable without
      reading prose.

    Round 2 - four non-blocking suggestions, all taken.

    - Renamed "Muscle Weakness and Hypotonia" to "Muscle Weakness". The name promised a
      bundle the entry deliberately does not contain; hypotonia has its own entry and its own
      term.
    - Added PMID:35109800's muscle biopsy result to both the respiratory-chain node and the
      CONTROVERSY. This is the substantive one. The discussion framed the disagreement as the
      founding report against the 2022 series, when a third report, already cited five times
      in this entry, independently found reduced respiratory-chain complex enzyme activities.
      The tally is two reports against one, not one against one. The rationale now says so,
      and also notes that the dissenting series is the largest single patient group of the
      three - so counting reports and counting patients do not point the same way, and the
      reader is told that rather than handed a majority verdict.
    - Added the hepatic histology: diffuse steatosis, PAS-positive intracytoplasmic glycogen,
      activated Kupffer cells, portal fibrous hyperplasia. The authors state that liver
      pathology in this disorder had not previously been reported, which makes this the only
      histological description of the hepatic phenotype in the COXPD26 literature. It is one
      patient, and the entry says so in the same block.
    - This record.

    Validation after the round-2 changes: just validate passed with 69/69 snippets verified,
    up from 65/65. validate-terms, check-entity-refs, check-duplicate-keys,
    check-snippet-grading, check-folded-hyphens, check-snippet-length, check-title-snippets
    and check-term-cache-integrity all clean.

    Note on tooling: the review suggested scaffolding this with --event UPDATE, which is not
    a value new_history.py accepts. The enum is GENERAL, CREATE, EDIT, REVIEW, AUDIT; REVIEW
    is used here.

  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 26 (COXPD26, TRMT5)'
  details: |
    De-novo curation of COXPD26 (MONDO:0014684, TRMT5) from primary literature. Modelled the chain: TRMT5 loss of function, m1G37 hypomodification of mitochondrial tRNA, tissue-specific amplification of the modification defect in skeletal muscle, impaired mitochondrial translation, combined respiratory chain complex deficiency, multisystem energy-failure phenotype. Recorded two negative results explicitly: loss of m1G37 does not destabilise the tRNA, and one of the two founding patients showed no detectable change in fibroblast oxygen consumption. Filed a CONTROVERSY discussion because the 2022 three-patient neuropathy series found normal skeletal-muscle respiratory-chain activity, contradicting the biochemical feature the disorder is named for, and a KNOWLEDGE_GAP on the unexplained muscle-versus-fibroblast tissue gradient. The first OpenScientist deep-research run produced a fully cited report about TRMT10C, which is COXPD30, not COXPD26; just preflight-dr flagged it and the report was discarded. The entry was built from primary literature and is unaffected. Validated with just validate, just validate-terms, just validate-disorders, just check-entity-refs, just check-duplicate-keys and just check-snippet-grading.

  summary: 'Review round 3: COX limitation on the third report, histopathology term
    bindings, EM finding'
  details: |
    Third review round on PR #10198. All three non-blocking suggestions taken.

    - The third enzymology report added last round carries a limitation the entry did not
      record. The same paragraph in PMID:35109800 states "Unfortunately, the enzyme activity
      of COX could not be detected in our lab." COX is complex IV, the complex the founding
      report found most affected, so that report's panel is incomplete on exactly the axis
      the CONTROVERSY turns on. It still belongs on the founding report's side - it does
      establish abnormal enzymology - but it cannot speak to which complexes. Recorded on
      both evidence items and in the discussion rationale, because a reader who has just been
      told the tally is 2-versus-1 needs the caveat in the same place as the tally.

    - finding_term bound on two of the three histopathology entries. The review flagged that
      322 of 444 entries with a histopathology section bind this slot, and explicitly asked
      that candidate CURIEs be checked rather than taken on trust, since its own runner had
      no network. Checked: NCIT:C45961 "Giant Mitochondria Present" is an exact match for the
      skeletal-muscle finding, and NCIT:C36185 "Steatosis" is the generic morphologic term
      matching "diffuse hepatocellular steatosis". Both resolved and both are genuine members
      of the HistopathologyFindingTerm dynamic enum - validate-terms wrote membership rows for
      each, so this is enum membership and not merely label agreement.

      The review's warning was well placed. NCIT:C82990 "Macrovesicular Steatosis" is already
      in the term cache and looks like a match, but the source says "diffuse hepatocellular
      steatosis" without specifying the vesicle pattern, so binding it would manufacture
      specificity the paper does not support. C36185 is the term that says what the source
      says.

      The nerve-biopsy entry is left unbound. Its content is "distinct morphological
      features", which is not a finding a term can carry; NCIT:C117277 "Demyelination" names
      the process, not the biopsy observation, and would assert more than the entry claims.
      No term beats a bad one.

    - Electron-microscopy lipid droplets added as their own evidence item on the hepatic
      entry. It was inside the figure-legend quote already committed but was not carried
      anywhere; EM is a distinct modality from the light microscopy, and it is the companion
      to the ultrastructural mitochondrial finding already modelled.

    Validation: just validate passed with 70/70 snippets verified, up from 69/69.
    validate-terms, check-entity-refs, check-duplicate-keys, check-snippet-grading,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-term-cache-integrity and check-cache-order all clean. Two new term-cache rows and
    two new enum-membership rows, all written by the validator rather than by hand.

    This is the last round I intend to push for on non-blocking suggestions. Three rounds of
    optional findings have each been worth taking, but they are not converging to zero, and
    per CLAUDE.md the right move now is to say what is still open rather than keep spending
    review cycles on an approved entry.

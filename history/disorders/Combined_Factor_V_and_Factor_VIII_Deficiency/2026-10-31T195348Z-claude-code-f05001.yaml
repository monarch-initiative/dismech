  summary: 'Create: Combined Factor V and Factor VIII Deficiency (LMAN1 and MCFD2
    types as subtypes)'
  details: |
    New entry bound to the parent MONDO:0018175. The two stubbed genetic types, LMAN1 (MONDO:0009206) and MCFD2 (MONDO:0013331), are recorded as has_subtypes rather than separate entries: the genes encode the two subunits of one ER-to-Golgi cargo receptor, the phenotype is indistinguishable, and only mean factor levels differ. Pathograph: biallelic LOF variants, loss of the receptor complex, impaired ER export of FV (hepatocyte) and FVIII (endothelial cell), concordantly reduced plasma FV/FVIII, reduced thrombin generation (attributed to the FVIII deficit), and the bleeding tendency, with low free TFPI as a partial counterweight. Both genes carry ClinGen Definitive AR assertions. Evidence is from 15 PubMed records plus two ClinGen records; all 65 snippets verified against the cache, and term validation passed. Claims: #16213, #16214.

  summary: 'Review round 1: consume the three cached HSAN1C references'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review (2 critical, 3 important). The PR had fetched and committed three HSAN1C-specific reference caches and cited none of them; one falsified a sentence the entry asserted.

    Critical 1: cited PMID:29042446, the only L-serine study in HSAN1C itself. Rewrote the hsan1c_serine_evidence_is_sptlc1_mouse rationale, which claimed no SPTLC2-mutant model has been reported with functional outcomes. It has - a 52-week n-of-1 in an SPTLC2 p.(Arg183Trp) carrier - and the outcomes were inconclusive rather than absent, which is a different and more precise gap. Added three treatment evidence items covering the biochemical conclusion, the authors' own limit on it, and the 400 mg/kg/day dose and duration, none of which the entry carried.

    Critical 2: cited PMID:32730653 and added a Demyelinating Features phenotype (HP:0007108) with the NCS finding. Framed as coexisting with rather than replacing the axonal characterisation, since the sural-biopsy literature on the R183W families reports severe chronic axonal loss.

    Important 3: cited PMID:26573920 for distal muscle weakness and intraepidermal nerve fibre loss.
    Important 4: rebound Acral Ulceration from HP:0200042 Skin ulcer to the exact-match HP:0006121 Acral ulceration.
    Important 5: added four phenotypes (neuropathic pain, demyelinating features, distal muscle weakness, loss of intraepidermal nerve fibers), taking the entry from two to six.

    Two term corrections made during the work, both worth recording. I first bound intraepidermal nerve fibre loss to HP:0040064 'Abnormality of limbs', written without a lookup; an OLS search found the exact term HP:0034997 'Reduced intraepidermal small nerve fiber density'. And the reviewer's suggested HP:6000040 'Neuropathic pain' is present in cache/hp/terms.csv but is not reachable within the PhenotypeTerm dynamic enum, so it fails validation in that slot; bound HP:0012531 'Pain' with the specificity carried in preferred_term, and recorded the reason in the phenotype description.

    Gates: validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading all pass. Snippets 18/18 to 26/26 verified.

  summary: 'Create: Hereditary Sensory and Autonomic Neuropathy Type 1C (MONDO:0013337)'
  details: |
    De novo curation of the SPTLC2 form of HSAN1.

    Lump/split decision: curated as a separate Disease rather than a has_subtypes row. kb/disorders/Hereditary_Sensory_and_Autonomic_Neuropathy.yaml carries an HSAN1 subtype scoped to SPTLC1, and the corpus already splits Hereditary_Sensory_Neuropathy_Type_1D, _Type_1E, _Type_2 and _Type_6 into their own entries, so a separate 1C entry follows the pattern the corpus already set. No conforms_to is asserted against the parent's Neurotoxic Deoxysphingolipid Formation node, because conformance targets a kb/modules/ module and the parent is a disease entry.

    The substantive curation call is functional_impact_category: NEOMORPHIC rather than LOSS_OF_FUNCTION. PMID:20920666, the founding SPTLC2 report, measured partial to complete loss of SPT activity. PMID:26681808 re-assayed eleven SPTLC1 and six SPTLC2 mutants by a uniform isotope-labelling method and found canonical serine activity was not reduced in any of them, with three variants showing increased canonical activity. The entry follows the later uniform re-assay and carries the earlier finding as a REFUTE evidence item plus a KNOWLEDGE_GAP discussion, rather than silently dropping it. This is not cosmetic: it decides whether substrate competition alone is the right therapeutic principle.

    A HUMAN_MODEL_MISMATCH discussion records that the only functional-outcome evidence for oral L-serine comes from an SPTLC1-C133W transgenic mouse, so it differs from this disease in both species and subunit; the human pilot study supports only the metabolite change, which is a surrogate. The two treatment-level evidence items are graded MODEL_ORGANISM for that reason, and the human arm is quoted separately on the treatment's mechanism link where it is graded HUMAN_CLINICAL.

    quote_role: BACKGROUND is used on five items. PMID:29778900 is quoted both ways in the entry, which is the intended use of the slot: BACKGROUND for the patient blood levels it cites to other work, unmarked for the in vitro neurotoxicity it measured itself.

    Validation: 18 snippets verified against cached references; schema, term, duplicate-key, entity-ref, causal-target and qualifier-term gates pass.

    One error caught and fixed during curation, recorded because it is the failure mode CLAUDE.md documents: reference_title for PMID:22045570 was first written from memory as '...hereditary sensory and autonomic neuropathy type 1' when the cached title reads '...hereditary sensory autonomic neuropathy type 1'. All 18 snippets verified at the time the title was wrong, so only check-reference-titles caught it. Titles were then copied from the references_cache frontmatter.

    A Perplexity deep-research report is committed as a lead source; preflight-dr returns PASS against MONDO:0013337.

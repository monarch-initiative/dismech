  summary: 'Create: Brain Small Vessel Disease 4 (NIT1)'
  details: |
    New entry for MONDO:0979873 from the two primary reports of NIT1 deficiency: the Genet Med 2024 founding series (PMID:38430071, abstract) and the 2019 French family described as a familial deep cavitating state (PMID:31705625, full text), plus the PNAS 2017 biochemical study identifying NIT1 as the deaminated-glutathione amidase (PMID:28373563). Pathograph: NIT1 loss of function -> dGSH accumulation -> proposed oxidative stress; NIT1 loss -> cerebral artery wall deposits -> dilated basal ganglia perivascular spaces, intracerebral hemorrhage and movement disorder, with unknown-intermediate links marked as such and a KNOWLEDGE_GAP discussion on the dGSH-to-vasculopathy step. An Ann Neurol 2025 letter and a 2026 Neurology teaching image were found but have no fetchable abstract and are not cited. Validated with just validate, count-verified-snippets (31/31) and validate-terms.

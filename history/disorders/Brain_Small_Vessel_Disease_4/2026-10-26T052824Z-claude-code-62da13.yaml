  details: |
    Ran just research-disorder with falcon and fallback enabled; falcon had no usable key, so openscientist produced research/Brain_Small_Vessel_Disease_4-deep-research-openscientist.md. preflight-dr PASS (NIT1, OMIM 621313). All 7 report references resolved. The report adds no human cases, alleles or phenotypes beyond the 2024 Genet Med series already cited, does not cover the 2019 French family, and found nothing for the 2025 Ann Neurol letter or 2026 Neurology image; its remaining references are NIT1 enzymology, plant and mouse knockout work, and general small vessel disease reviews. Its term section flags GO:0160011 (wrong ID for the dGSH amidase activity; the entry uses GO:0110050) and an unresolved UBERON CURIE, none of which were adopted. Entry edits from review suggestions: added an INDIRECT_UNKNOWN_INTERMEDIATES edge from Cerebral Small Vessel Wall Deposits to Basal Ganglia Cystic Lesions, supported by the French authors' classification of the cavities among lacunar lesions, and removed an unsupported 'all seven patients' count from the movement-disorder explanation.

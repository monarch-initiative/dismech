  summary: Backfill gene_term for 21 genetic entries (HGNC tranche 3/5)
  details: |
    Bulk HGNC gene_term backfill, tranche 3 of 5 (PR #9015, addresses #2099). Regenerated curation half of the stale PR #2620; pairs with the KGX exporter strict-mode fix in PR #8996.

    Added a gene_term block (lowercase hgnc: CURIE plus canonical HGNC label) to 21 genetic[] entries that carried a bare gene symbol as name but no grounded term. Without this grounding, PR #8996's strict mode drops these gene nodes from the KGX export.

    Genes grounded: ITPKC (hgnc:14897), FCGR2A (hgnc:3616), FCGR3A (hgnc:3619), BLK (hgnc:1057), CD40 (hgnc:11919), HLA-B (hgnc:4932), CASP3 (hgnc:1504), ORAI1 (hgnc:25896), STIM1 (hgnc:11386), TGFBR2 (hgnc:11773), SMAD3 (hgnc:6769), TGFB2 (hgnc:11768), IL1B (hgnc:5992), IL1R1 (hgnc:5993), TNF (hgnc:11892), IL17A (hgnc:5981), IL23A (hgnc:15488), NLRP3 (hgnc:16400), NOS3 (hgnc:7876), ICAM1 (hgnc:5344), VCAM1 (hgnc:12663).

    Generated by scripts/upgrade_genetic_gene_terms.py (introduced in PR #9004), which writes a gene_term only on a single exact match against the HGNC primary label via sqlite:obo:hgnc, and only when the entry has no gene_term key at all. Entries whose name is not a single current gene symbol (haplotypes, fusions, cytogenetic loci, multi-gene strings, retired symbols) were left untouched by design. The block is inserted as text immediately after name, so the file diff is additions only with no reformatting of existing content; a before/after parse comparison confirmed no other key changed.

    Validated with: just validate-disorders over all 44 tranche files (schema + terms + references, exit 0, 2060/2295 snippets verified against cached references); just check-duplicate-keys; just check-cache-order; just check-term-cache-integrity; uv run pytest tests/test_data.py -k 'gene or genetic or term'. All 176 CURIEs in the tranche were round-tripped through HGNC in both directions with zero label mismatches and no symbol mapping to more than one CURIE; 24 entries were hand-checked against their own notes/evidence for in-context correctness, weighted toward collision-risk short symbols.

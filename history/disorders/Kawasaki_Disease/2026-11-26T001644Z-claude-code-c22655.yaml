  summary: 'Gene-family review: BLK'
  details: |
    The BLK record was untyped and carried no evidence. It is now typed SUSCEPTIBILITY (germline) and cites the two 2012 genome-wide association studies that found genome-wide significant association at FAM167A-BLK in Japanese (PMID:22446962) and Han Chinese (PMID:22446961) Kawasaki disease. The notes distinguish this common-variant association from the refuted BLK-MODY claim. BLK remains on the multi-gene Immune Response Dysregulation node, which binds no molecular function.

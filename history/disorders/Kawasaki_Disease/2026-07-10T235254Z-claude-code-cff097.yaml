  summary: Add guideline-derived long-term cardiac management to Kawasaki disease
  details: |
    Mined the Kawasaki disease clinical Practice Guideline citations collected for issue #4878 (projects/CLINICAL_CARE_GUIDELINES batch 2) into the entry, targeting the long-term cardiac-management gap. Added 2 treatments: Long-Term Antithrombotic Therapy for Coronary Aneurysms (MAXO:0000178; risk-stratified aspirin / dual antiplatelet / warfarin-LMWH anticoagulation) and Risk-Stratified Long-Term Cardiology Follow-up (MAXO:0000950; Z-score-based surveillance, lifelong follow-up). Reinforced existing IVIG and Aspirin treatments with the flagship 2021 ACR/Vasculitis Foundation guideline (PMID:35257501). Evidence drawn from the AHA 2017 scientific statement (PMID:28356445), ACR/VF 2021 (PMID:35257501), and the Italian Society of Pediatrics guideline (PMID:33494789), each snippet-verified against fetched abstracts. Deliberately EXCLUDED PMID:34076713 (MIS-C anti-thrombosis; a distinct COVID-associated entity with its own dismech entry) and PMID:40784605 (general cardiac-MRI mapping consensus, not KD-specific). Schema and term validation pass; all 7 new snippets confirmed as exact substrings (validate-references reports 0 checks, the known false-pass).

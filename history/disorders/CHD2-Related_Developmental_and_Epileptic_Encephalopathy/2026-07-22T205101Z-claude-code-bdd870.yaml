  summary: 'Create: CHD2-Related Developmental and Epileptic Encephalopathy (MONDO:0014150)'
  details: |
    Created new Mendelian entry for CHD2-related DEE (DEE-94), a chromatin-remodeler epilepsy (distinct mechanism from channelopathies). Unbundled cascade: CHD2 haploinsufficiency -> dysregulated ATP-dependent chromatin remodeling -> aberrant neuronal gene expression -> (fork) impaired neuronal development + cortical E/I imbalance; E/I node conforms_to epilepsy_excitation_inhibition_imbalance. Includes a KNOWLEDGE_GAP discussion on which CHD2 target genes translate the broad chromatin defect into the specific brain-restricted photosensitive myoclonic epilepsy. Deep research via just research-disorder claude_code. Evidence from GeneReviews (PMID:26677509), Carvill 2013 founding paper (PMID:23708187), the MAE cohort paper (PMID:26262932), and a chromatin-remodeling-in-epilepsy review (PMID:29962935) for the mechanism nodes. 24 evidence snippets all verified as exact substrings; validation passes; compliance 92.3% weighted.

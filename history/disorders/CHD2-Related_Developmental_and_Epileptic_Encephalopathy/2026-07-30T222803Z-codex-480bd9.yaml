  summary: Review CHD2-related developmental and epileptic encephalopathy
  details: |
    Reviewed the CHD2-related developmental and epileptic encephalopathy model against cached GeneReviews, primary mechanistic, model-organism, and pooled-cohort evidence. Wired CHD2 haploinsufficiency into the chromatin-remodeling mechanism; added exact-snippet evidence to all 14 causal edges; connected all 10 existing phenotypes through impaired-neurodevelopment and cortical-hyperexcitability branches; and wired the sole causal gene to pathophysiology. Added evidence supporting both proposed experiments but did not invent unavailable public dataset accessions. Reviewed the D2P audit: five OMIM seizure phenotypes were not imported because PMID:23708187 is abstract-only in the cache and lacks the phenotype-level text needed for exact local evidence; three narrower EEG terms remain covered by the existing broader, directly evidenced EEG abnormality. Final compliance is 97.9% global and 98.5% weighted, with deductions only for absent datasets; evidence compliance is 100%, phenotype connectivity is 10/10, and causal-gene wiring is 1/1. A full pre-publication scan of 105 open PRs completed with zero failures and found no CHD2 model overlap.

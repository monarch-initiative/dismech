  summary: 'Address reviewer changes on GABRG2-Related Epilepsy PR #6987'
  details: |
    Automated-reviewer change requests addressed. (2) Fixed claim-evidence mismatch on the Epileptic encephalopathy phenotype: replaced the HEK293T recombinant-receptor biophysics snippet (mistagged HUMAN_CLINICAL) with a genuine human-clinical sentence from PMID:27864268 (NGS of patients across the epileptic-encephalopathy spectrum); moved the HEK293T snippet's evidence_source to IN_VITRO where it recurs in the discussions block. (3) Split the bundled pathophysiology: temperature-sensitive receptor trafficking is now its own node with its own trigger/evidence/downstream, and the merged hyperexcitability/E-I node is split into 'Excitation-Inhibition Imbalance' and 'Neuronal Hyperexcitability and Hypersynchrony'. (4) Module conformance raised from 1 to 3 of the 5 epilepsy_excitation_inhibition_imbalance nodes (Ion Channel and Synaptic Dysfunction, Excitation-Inhibition Imbalance, Neuronal Hyperexcitability and Hypersynchrony). (5) Connected the pathograph into a single component: all seven phenotypes (incl. Myoclonic seizures, Developmental delay, Epileptic encephalopathy) are now downstream targets, and treatments carry target_mechanisms (ASM + benzodiazepine INHIBITS the hyperexcitability node). (6) Cited the cached ClinGen Definitive GABRG2/epilepsy gene-validity assertion (CGGV:assertion_3a3176e9..., MONDO:0005027, AD, Epilepsy GCEP). (7) Added has_subtypes DEE74 (MONDO:0032725) with a syndromic-breakdown snippet from PMID:35359574. (8) Added classifications: neurological channelopathy + NEUROLOGIC Harrison's chapter. (9) Cited the previously-unused 2024 GABRG2 review PMID:39143639. (10) Confirmed no GeneReviews chapter covers GABRG2 (only SCN1A/CDKL5/SLC6A1), so no GeneReviews tag added. Also added benzodiazepine and ketogenic-diet treatments, biological_scale tags on all nodes, and a MONDO:0005027 broadMatch mapping. All snippets verified as exact substrings of their references_cache files; schema+term validation pass; no folded-hyphen splits. Deep-research run for this disorder timed out and produced no artifact; entry basis remains primary literature (11 PMIDs + ClinGen).

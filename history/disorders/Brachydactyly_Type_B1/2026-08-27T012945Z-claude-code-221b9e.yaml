  summary: 'Create: Brachydactyly Type B1'
  details: |
    ISDS group 18 completeness pass. Scoped to the ROR2 form [MONDO:0007220] and kept separate from the NOG-related type B2, which the nosology lists as its own row. Pathophysiology emphasises the two lines of evidence that exclude haploinsufficiency - 9q22 whole-gene deletion carriers without BDB, and the tight allele clustering flanking the tyrosine kinase domain - plus the PCP/Vangl2 mouse work implicating excess BMP signalling as the proximate cause of phalangeal loss. Records the ROR2 allele-class contrast with recessive Robinow syndrome. Four initially mis-transcribed snippets were corrected against the cached full text; all 32 now verify.

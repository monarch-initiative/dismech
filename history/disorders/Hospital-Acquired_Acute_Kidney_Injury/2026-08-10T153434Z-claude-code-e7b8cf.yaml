  summary: Link the four hospital exposures to their injury nodes
  details: |
    Backfill for issue #8085. This entry maps unusually cleanly, because three of its four nodes name the exposures in their own text. Nephrotoxic drug exposure and contrast media both point at the nephrotoxic injury node at TRIGGERS with DIRECT and are graded identically, the node naming aminoglycosides, vancomycin, NSAIDs and contrast media itself; both carry PARTIAL evidence because no cited sentence measures tubular injury, one reporting associated mortality, one an attributable fraction of about 40%, and one the risk factors within an already-assumed contrast-induced entity. That node is this entry's conformer to the drug_induced_nephrotoxicity module, which models the uptake-to-cell-death chain in full. Major surgery points at ischemic tubular injury with INDIRECT_KNOWN_INTERMEDIATES, hypoperfusion being the intervening step named by the node; its evidence is PARTIAL because the sentence describes the multi-hit model and names ischemia without naming surgery, taking its surgical context from the paper's subject rather than the sentence. Sepsis takes two edges. The first, into the sepsis-associated injury node, is the only SUPPORT grade in this entry, since the exposure and the node are the same claim seen from two sides. The second, into mitochondrial dysfunction, cites a sentence from the same study that measures oxidative DNA damage and reduced mitochondrial mass in post-mortem kidney biopsies, which is that node's content almost word for word; it is INDIRECT_KNOWN_INTERMEDIATES rather than DIRECT because the sepsis-associated injury node sits between the exposure and it and is drawn explicitly in this graph. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 59 of 59 verified.

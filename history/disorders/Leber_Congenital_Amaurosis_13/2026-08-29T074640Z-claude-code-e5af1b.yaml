  summary: 'Review round 1: address ai4c-reviewer items on PR 10027'
  details: |
    Addressed all five IMPORTANT items and four of five suggestions from the automated review of PR 10027. Item 1 was a substantive correction, not a polish item, and it changed how several other things in the entry are graded.

    Item 1, the undisclosed human/model mismatch. Rdh12-null mice do not develop retinal degeneration. Two independent knockout lines were generated and both have normal retinal histology. I had cited that mouse for the light-susceptibility claim without recording that it fails to reproduce the defining human phenotype, and the entry's Light Exposure Reduction treatment rested entirely on it. Three consequences. A HUMAN_MODEL_MISMATCH discussion attaching to five places - two pathophysiology nodes, the animal model, the gene-therapy treatment and the light-avoidance treatment - because the mismatch constrains all of them. The Retinaldehyde and Aldehyde Toxicity node downgraded from ESTABLISHED to PROVISIONAL, since its step to degeneration rests on a model that does not degenerate. And the top-level description rewritten: it previously said the therapeutic window closes in early childhood, which is more pessimistic than the sources support, and it now states the constraint without asserting a closing age, plus the model limitation.

    Item 2, the ER and oxidative stress arm. PMID:34445569 was cached and cited nowhere. Added as its own PROVISIONAL node - mutant RDH12 cell lines cannot protect against all-trans-retinal and mount an ER and oxidative stress response with sXBP1, CHOP and ATF4 upregulated, against a wild-type control that does protect. The reviewer's point that its absence made the which-toxic-species knowledge gap read as a false binary is right, and that discussion's rationale now says explicitly that stress signalling is the shared downstream consequence of either candidate, so the question is about which upstream species drives it rather than a two-way choice about what kills the cell.

    Item 3, pregabalin. Added as an investigational treatment targeting the new stress node. It is the only candidate in this literature that acts on the toxic species rather than on the missing gene, which matters because a scavenger strategy does not depend on delivering a transgene to photoreceptors that may already be lost. The limits are stated in the entry: HEK-293 cells rather than photoreceptors, and a stress marker rather than photoreceptor survival as the endpoint.

    Item 4, PMID:31237438 listed but unused. Now carries two evidence items on the gene-therapy treatment, one for the vector and its safety result and one, graded PARTIAL, for the efficacy claim with the authors' own limiting clause attached - efficacy demonstrated in an animal model that does not exhibit a retinal degeneration phenotype.

    Item 5, the inverted peripapillary binding. Removed HP:0500087 Peripapillary atrophy entirely. The reviewer's argument is the general one worth keeping: a PARTIAL grade and an explanatory description do not survive KGX or BioLink export, so the graph would have asserted peripapillary atrophy where the finding is sparing. The phenotype now carries a free-text preferred_term with no term binding, and the evidence is regraded SUPPORT because it now supports what the phenotype actually says.

    Suggestions taken. Added animal_models with the Rdh12-null mouse - RECAPITULATES for the enzymatic deficit at HIGH fidelity, FAILS_TO_RECAPITULATE for degeneration at LOW, with an UNCHANGED readout for normal retinal histology recorded as the real negative result it is - and the zebrafish CRISPR mutant as PARTIALLY_RECAPITULATES, with the authors' hedge about early signs intact. Added experimental_models with the HEK-293 lines at LOW fidelity, since a cell with no outer segment, visual cycle or light exposure can show that mutant RDH12 fails to protect a cell and cannot show that this kills a photoreceptor. Renamed Absence of Marked Hyperopia to Mild Hyperopia, with a note that the schema has no phenotype-negation slot and the discriminating information is in the absence of the marked form, which the entry can only state in prose. Softened the therapeutic-window claim as above. Cited two of the four uncited cohorts: PMID:37240262 for RDH12's share of a German cohort, which is the clearest available illustration of why these fractions should not be pooled - 13 per cent across LCA-associated genes and 7 per cent restricted to a clinical LCA diagnosis, a two-fold spread inside one cohort from the inclusion criterion alone - and PMID:38371258 for thirteen patients sharing one variant with varying clinical characteristics, graded REFUTE as evidence against a simple allele-to-severity rule.

    Two deliberate absences are now recorded in notes so a later reader does not read them as omissions. No clinical_trials section: an ongoing prospective natural-history study is described but no interventional trial is identified in any cited source, and no identifier was invented to fill the section. And PMID:29398085 is left uncited because it is a CEP290 natural-history study, cached because the deep-research report's citation list resolved it, with no RDH12 content.

    Separately, running the model-link pytest lanes on this branch surfaced a pre-existing failure on main that is not from this PR: test_failure_to_recapitulate_links_are_substantiated fails on Polycystic_Kidney_Disease_3.yaml, whose animal model link has no evidence. Filed as issue 10028 after checking for duplicates; the file is untouched by this branch.

    Validation after changes. Schema validation passes; 56 of 56 evidence snippets verified, up from 36; term validation, entity-ref and duplicate-key checks pass.

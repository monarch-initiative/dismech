  summary: 'Review round 2: two CI-gate defects I introduced, plus the last uncited
    reference (PR 10027)'
  details: |
    Round 2 fixed two defects the round-1 fix commit introduced, and both were mine to have caught before pushing.

    The process failure is worth recording first, because it is the reusable part. After round 1 I ran just validate, validate-terms, check-entity-refs and check-duplicate-keys - and not check-folded-hyphens, check-snippet-length or check-title-snippets. Those three are ungated whole-KB CI steps, precisely so that a kb-only PR cannot skip them, and I skipped them locally anyway. Both new defects were in text I wrote during the fix commit, so both were introduced by fixing something else, which is the situation a re-run of the full local gate set exists to catch.

    Defect 1, check-folded-hyphens at line 1022. A folded-scalar line I wrote ended in light-, so the loaded value read light- damage with a space. Reflowed so light-damage stays on one line. This is a class of error invisible in the source file - the YAML looks correct, and only the loaded value is wrong - which is why the check exists.

    Defect 2, check-snippet-length on the prevalence evidence. I quoted RDH12 (13%) from the German cohort table, which is two words with no propositional content. The same paper carries the sentence that makes the claim, and it is better in every way: Fourteen patients (14/105, 13%, age 3-51 years; 6 female, 8 male) had variants in the RDH12 gene. Swapping it in kept the figure and added the numerator, denominator and age range. The lesson generalises beyond the check: a bare number lifted from a table is not evidence for a claim, because it carries no statement about what the number counts.

    Also took the one remaining suggestion. PMID:17512964 was the last cached-but-uncited reference and, unlike PMID:29398085, had no disposition recorded. It is genuinely useful, so it is now cited rather than dispositioned: across 119 patients spanning LCA, retinitis pigmentosa and cone-rod dystrophy, the RDH12 mutants associated with LCA were inactive or had only residual activity in COS-7 and Sf9 cells, while the changes that proved polymorphic were fully active. That is the mirror image of the entry's existing variant-interpretation caveat rather than a contradiction of it: residual in vitro activity does not exclude pathogenicity, but full in vitro activity has so far tracked with benignity. Both statements now sit together in the genetic notes.

    Validation after changes. Schema validation passes; 57 of 57 evidence snippets verified; and this time the full ungated gate set was run rather than a subset - check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass, alongside term validation, entity-ref and duplicate-key checks. The same full set was re-run across all five entries in this curation batch, which surfaced one further folded-hyphen defect in the IgA pemphigus entry that no reviewer had reached yet.

  summary: 'Create: Leber Congenital Amaurosis 13 (MONDO:0012990, RDH12)'
  details: |
    New disorder entry for Leber congenital amaurosis 13, the RDH12-associated early-onset severe retinal dystrophy.

    Lump/split decision. Curated as its own kb/disorders entry, following the per-gene retinopathy pattern the KB already uses - Leber_Congenital_Amaurosis_10, RPE65-Related_Retinopathy, AIPL1-Related_Retinopathy, CRB1_Retinal_Dystrophies. The justification here is stronger than pattern-matching: RDH12 is the LCA gene whose mechanism sits outside the visual cycle, and that difference has direct therapeutic consequences.

    Curation inputs. One Perplexity deep-research run, committed alongside, plus independent PubMed E-utilities searching. The report was used for framing only, and its term validation is why. It reported 25 of 44 checked labels mismatched, the worst of the five reports in this curation batch, and the mismatches were of the most dangerous kind - real HPO terms paired with the wrong names. It offered HP:0000639 as visual impairment when HPO calls it Nystagmus, and HP:0000556 as nystagmus when HPO calls it Retinal dystrophy. The two labels are swapped between two real terms, so neither the CURIE nor the name looks wrong in isolation. Its reference validation was clean, 8 of 8 resolving and all on topic, which is a good illustration that the two validators measure different things.

    GeneReviews baseline. The nonsyndromic LCA/EOSRD overview, PMID:30285347, is cited and tagged. It covers the disease class rather than this genotype, so it is not used as an evidence source for phenotypes; those come from the two natural-history studies, which between them cover 57 and 134 individually reported subjects.

    Structure. Six pathophysiology nodes: biallelic RDH12 loss of function, failure of all-trans-retinal clearance in the photoreceptor inner segment, then two parallel toxic consequences - retinaldehyde and aldehyde toxicity, and retinoic acid overproduction - converging on photoreceptor degeneration and early macular atrophy.

    The compartment distinction is the substantive content. RDH8 does the visual-cycle reduction in the outer segment; RDH12 clears the all-trans-retinal that leaks into the inner segment under continuous illumination, and also reduces lipid peroxidation products. Single-cell imaging in knockout mice separates the two cleanly. That is why RPE65 is a poor analogue: RPE65 disease is a functional visual-cycle defect with relatively preserved macular structure, while RDH12 disease destroys the macula early, and gene supplementation cannot restore atrophied photoreceptors.

    Early macular atrophy is curated as its own node rather than folded into the degeneration, because it is the feature that makes the genotype therapeutically distinct.

    Two discussions, both KNOWLEDGE_GAP. The first is the therapeutic window: macular atrophy is universal from age two and the ERG is non-recordable from age one, yet useful vision is retained until adolescence, so there is a decade with something to preserve and no validated outcome measure to detect preservation - the ERG is already at floor. The second is which toxic species drives cell death, aldehyde or retinoic acid; the cited work supports each without discriminating, which is why the aldehyde node is ESTABLISHED and the retinoic acid node PROVISIONAL, and it matters because the two accounts imply different drugs.

    Two variant-interpretation points are recorded in the genetic notes because they are traps. Residual in vitro activity does not exclude pathogenicity - T49M and I51N retain significant activity on purified protein and still fail in cells, through reduced NADPH affinity and lower expression. And the 2005 biochemical paper refers to RDH12 as linked to Leber's congenital amaurosis 3, not 13; LCA3 is now assigned to SPATA7, so a search on the old designation returns the wrong gene.

    One phenotype carries a term-binding compromise stated in place: peripapillary sparing is bound to HP:0500087 Peripapillary atrophy, the nearest anatomical anchor, because HPO has no term for peripapillary sparing. The evidence item is graded PARTIAL and the description states the actual finding.

    Validation. Schema validation passed on the first run; 36 of 36 evidence snippets verified against cached primary references; term validation, duplicate-key and entity-ref checks pass.

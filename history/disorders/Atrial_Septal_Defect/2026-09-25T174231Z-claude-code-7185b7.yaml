  summary: 'Review round 1 (series-045): Atrial_Septal_Defect'
  details: |
    Review round 1 on PR #12817. Corrected a miscount in the entry notes. The paragraph said two of the nine numbered MONDO ASD members are not curated as has_subtypes rows and then named ASD1 and patent foramen ovale, but patent foramen ovale is not a numbered member, it is a separate descendant that this entry excludes on morphological grounds. Eight of the nine numbered members, ASD2 to ASD9, do have rows; only ASD1 does not, because MONDO gives it no causal gene and its MedGen concept describes generic secundum atrial septal defect, which the Ostium secundum row already covers.

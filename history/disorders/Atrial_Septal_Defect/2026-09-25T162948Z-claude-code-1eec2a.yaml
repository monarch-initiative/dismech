  summary: 'Genetics pass (series-045): Atrial_Septal_Defect'
  details: |
    Genetics pass for the series-045 gap list (issue #12252). Enumerating the fifteen hierarchical descendants of MONDO:0006664 in OLS4 showed the gap list covered only ASD3 to ASD8; ASD2 (GATA4), ASD9 (GATA6) and ASD1 were absent from it. Added five genetic records: TBX20 (hgnc:11598), ACTC1 (hgnc:143), CITED2 (hgnc:1987) and GATA6 (hgnc:4174) as CAUSATIVE, and TLL1 (hgnc:11843) as UNKNOWN because ClinGen grades it Limited, which is insufficient evidence rather than refutation. Bound subtype_term MONDO ids to the four pre-existing anatomic has_subtypes rows, which had none, and added eight gene-defined rows for ASD2 through ASD9. Wired TBX20, ACTC1, CITED2 and GATA6 onto the Abnormal Atrial Septation node with four new node-level evidence items, one per gene; TLL1 is deliberately unwired. Recorded in the entry notes why ASD1 gets no row: MONDO gives it no causal gene and its MedGen concept describes generic secundum atrial septal defect, so it duplicates the existing anatomic row. GATA6's broader outflow-tract and pancreatic phenotype is left to Congenital_Heart_Disease and Pancreatic_Agenesis, which already carry it.

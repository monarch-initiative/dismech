  summary: 'Create: Achalasia-Progeroid Syndrome'
  details: |
    New entry for MONDO:0700300 (BUD13). Deep research was run with the openscientist and claude_code providers; both reports are committed and were used as leads only. just preflight-dr passed on both reports (canonical gene BUD13, OMIM 621123). Clinical and cellular content comes from the abstract of PMID:35670808, the only primary report (five patients, one homozygous nonsense allele); its full text is not freely available, so only features the abstract names are curated and the further features MedGen lists are recorded in notes as uncurated. Mechanism evidence adds the zebrafish RES-complex mutant paper (PMID:29969449) and the BUD13 intron-retention paper (PMID:30639243). The variant nomenclature and classification were read from ClinVar VCV003767879. Mortality (3 of 5 in the first decade) is recorded under progression because HP:0003819 is outside the PhenotypeTerm enum. No causal edges are drawn from the fibroblast-level nodes to the clinical phenotypes, because no study links them; this is recorded as a KNOWLEDGE_GAP discussion. The entry was not added to kb/groupings/Progeroid_Syndromes.yaml, whose necessary criterion is a prematurely aged appearance phenotype that this entry does not bind. The RES splicing node binds RNA binding (GO:0003723, DECREASED) as the BUD13 molecular function, sourced from PMID:30639243; the reduction is inferred from the hypomorphic allele and the evidence item is marked INDIRECT. After review on #14669, the diagnosis term was narrowed from NCIT:C19770 Molecular Analysis to NCIT:C101295 Whole Exome Sequencing, matching the cited exome sequencing, and the splicing-defect and nuclear-envelope edges were moved from the truncated-protein node to the variant node, because the truncated isoform limits those defects rather than causing them. Validated with just validate-disorders (schema, terms, 30 snippets), check_gene_activity_grounding against origin/main, and the offline gates.

  details: |
    Second session on this entry, addressing the review on head e0b9e220 and correcting an inaccuracy in the CREATE record for this slug (2026-08-29T025713Z-claude-code-d8c7b0.yaml), which is append-only and has not been edited.

    CORRECTION TO THE EARLIER RECORD. That record states that a block of numbers in PMID:34223797 (onset 13-30 years, BCVA 20/60-20/200, hearing onset under 10 to 24 years) sits after the CEP78 paragraph with no gene-labelled heading, so its attribution is ambiguous, and that it was therefore not used. That conclusion was wrong. Re-reading references_cache/PMID_34223797.md: the paper runs one block per gene; line 94 closes the CEP78 block, line 96 is the block in question, line 98 is the CEP250 imaging paragraph and line 100 closes the CEP250 variant description, with the ARSG block starting at line 102. Every internal patient identifier inside line 96 is a CEP250-n; no CEP78, ARSG or ABHD12 patient appears in it. The entry was in any case already quoting one sentence out of that same paragraph, so treating the rest as unattributable was inconsistent.

    WHAT WAS ADDED FROM THAT PARAGRAPH. The four-sentence run beginning "Age of onset ranged from 13 to 30 years" now supports four claims, each in the block that carries it: the visual onset range on the Cone-rod dystrophy phenotype, the acuity range on Reduced visual acuity, the hearing onset range on Progressive sensorineural hearing impairment, and vestibular sparing on the Audiometry diagnosis entry. Vestibular sparing is one of the grounds this entry gives for curating a standalone disease rather than an Usher subtype, and it now has a third independent human-clinical source rather than one sentence plus a mouse preprint. The relevant descriptions were reworded so the prose states the range rather than the single patient.

    TWO IMAGING PHENOTYPES PROMOTED. Photoreceptor layer loss on macular OCT (HP:0030609, 3/3 patients) and Abnormal fundus autofluorescence imaging (HP:0030602, 2/3) were already present as evidence under other nodes but were not searchable as phenotypes. Both terms were already in cache/hp/terms.csv and in the phenotypeterm enum cache, so no cache churn.

    RETIRED SUPPORT VALUE MIGRATION. This branch predated the removal of PARTIAL from EvidenceItemSupportEnum, so rebasing onto main made three items unschematic. Migrated per the taxonomy in the schema comment rather than by blanket replacement. First, the cGMP-PKG-MAPK edge evidence from PMID:37240188 was indirect support, since the authors say the pathway may contribute, so it became SUPPORT with directness INDIRECT. Second, the normal-colour-fundus sentence from PMID:34223797 under Spicular pigmentation of the retina exists specifically to bound a claim the node's other evidence overreaches toward, so it became REFUTE with directness DIRECT, and its explanation was rewritten to say what it bounds. Third, the PMID:34223797 sentence under the CEP250-attribution knowledge gap supports the gap by an inference step, so it became SUPPORT with directness INDIRECT.

    VALIDATION. just validate exit 0, 68 of 71 snippets machine-verified; the 3 skipped are DOI-prefixed preprint snippets, unchanged from the previous session and hand-checked there. just check-entity-refs exit 0, just check-duplicate-keys exit 0.

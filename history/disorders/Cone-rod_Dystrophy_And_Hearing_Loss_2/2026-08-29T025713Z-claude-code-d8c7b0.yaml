  summary: 'Create: Cone-rod dystrophy and hearing loss 2 (MONDO:0020780)'
  details: |
    New de novo Disease entry for cone-rod dystrophy and hearing loss 2 (MONDO:0020780, CEP250, hgnc:1859).

    entry_type decided as DISEASE (standalone), not a has_subtypes entry on Usher_Syndrome. Three grounds, recorded in the entry notes: MONDO places MONDO:0020780 under cone-rod dystrophy and hearing loss rather than under Usher syndrome; the mechanism is centriole cohesion rather than the Usher protein interactome that the existing Usher pathograph is built on, which is why the sibling CEP78 disorder was likewise described as different from typical Usher syndrome; and the clinical pattern differs on each of the three axes that define the Usher types - postlingual progressive rather than congenital hearing loss, cone-first rather than rod-first retinal disease, and preserved vestibular function.

    Named Entity Confusion: preflight-dr PASS (CEP250 mentioned 80 times, OMIM 618358 matching MONDO). The gene-keyed check cannot see the two real confusion risks here, which were handled by re-reading:

    1. Two-gene discovery family. PMID:24780881 segregated nonsense alleles in both CEP250 and C2orf71. Double homozygotes had early-onset severe RP; CEP250 homozygotes carrying a single C2orf71 allele had mild retinal degeneration. Severe early retinal disease is therefore NOT curated as part of the CEP250 phenotype; the genotype-by-genotype breakdown is quoted in genetic.notes and a KNOWLEDGE_GAP records the unresolved second-locus contribution.

    2. Four-gene cohort paper. PMID:34223797 covers CEP78, CEP250, ARSG and ABHD12. Only sentences explicitly labelled CEP250 were used. A block of numbers in the full text (age of onset 13-30 years, BCVA 20/60-20/200, hearing onset under 10 to 24 years) sits immediately after the CEP78 paragraph with no gene-labelled heading in the cached extraction, so its attribution is ambiguous and it was NOT used, even though the falcon deep-research report attributed it to CEP250.

    Deep-research defect noted: the falcon report cites nan2024thecochlearmorphology three times for a claim about basal-turn hair-cell loss in Cep250 mice. That citation key has no bibliographic entry in the sidecar and no matching PubMed record was found, so the claim was dropped.

    Four animal models curated, kept separate because they are distinct lines from distinct groups: the exon 6-7 knockout (PMID:36857066, retina and hearing, late onset), the p.R188* patient-allele knock-in (PMID:30998843), a cochlea-phenotyped knockout (PMID:37759551), and a global knockout used for retinal transcriptomics and metabolomics (PMID:37240188 with PMID:37656476).

    Evidence-source convention stated in the entry notes: patient findings HUMAN_CLINICAL, mouse MODEL_ORGANISM, the NIH3T3 localisation experiment IN_VITRO, established cell biology quoted from introductions OTHER.


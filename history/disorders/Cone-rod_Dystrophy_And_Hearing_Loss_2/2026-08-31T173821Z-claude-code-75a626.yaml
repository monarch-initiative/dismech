  summary: Correct a wrong superlative applied to PMID:34223797; mine the 5/7 dual-sensory
    figure
  details: |
    Round-5 review follow-up.

    WRONG SUPERLATIVE CORRECTED. Eight sites in the entry described PMID:34223797 as the largest gene-labelled CEP250 series. It is not: that paper reports three CEP250 patients, while PMID:39610034 reports seven, and this entry already correctly calls the latter the largest series in the inheritance description and in the organ-selectivity knowledge gap. Verified against references_cache/PMID_39610034.md line 62, which states seven unrelated individuals. The phrase originated in a review comment and was adopted verbatim into the prose written in the previous session. All eight sites now describe PMID:34223797 by the property that actually makes it the right source for these numbers - it is the four-gene series that reports per-patient ophthalmic detail - rather than by a size claim. No snippet, attribution or evidence_source changed; every quoted number really does come from that paper's CEP250 paragraph.

    5/7 DUAL-SENSORY FIGURE MINED. The sentence 'Most patients (5/7) exhibit both retinal dystrophy and SNHL.' from PMID:39610034 had been carried as an open suggestion across three review rounds. Added as evidence on the organ-selectivity knowledge gap, whose rationale makes exactly this point in prose, and the rationale now states the five-of-seven split. Not set as a FrequencyEnum value on any individual phenotype: the quoted figure is the co-occurrence of two systems, and turning it into a per-phenotype frequency would require deriving six-of-seven for each of retinal dystrophy and SNHL, which the paper does not state.

    VALIDATION. just validate exit 0, 69 of 72 snippets machine-verified with 3 skipped by DOI prefix. validate-disorders, check-entity-refs, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and check-environmental-evidence all exit 0.

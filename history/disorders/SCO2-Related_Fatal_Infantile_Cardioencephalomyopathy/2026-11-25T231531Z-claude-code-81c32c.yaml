  summary: 'Gene-family review: SCO2'
  details: |
    SCO2's molecular function was rebound from GO:0016531 copper chaperone activity to GO:0015035 protein-disulfide reductase activity (DECREASED). In vitro reconstitution shows SCO1 is the metallochaperone that transfers Cu(I), whereas SCO2 is a copper-dependent thiol reductase of the COX2 CuA cysteine ligands (PMID:26351686), and SCO2 sets the redox state of SCO1's copper-binding cysteines in patient cells (PMID:19336478); both are now cited on the node, and the node, description and classification prose were corrected accordingly. The genetic record is typed CAUSATIVE with variant_origin GERMLINE and its inheritance bound to HP:0000007; ClinGen's Definitive (Leigh syndrome, mitochondrial disease) and Moderate (Charcot-Marie-Tooth disease) tiers are noted, none being this entry's MONDO:0011451.

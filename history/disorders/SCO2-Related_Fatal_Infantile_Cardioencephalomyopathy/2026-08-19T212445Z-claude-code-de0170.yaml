  summary: Harvest PR 5064 SCO2-specific evidence into existing entry
  details: |
    Ported the SCO2-specific, verified content from PR 5064 (which proposed a redundant gene-agnostic 'Fatal Infantile Encephalocardiomyopathy' MONDO:0015487 Disease entry) into this existing member entry of the Mitochondrial_Complex_IV_Deficiency grouping. Added: four phenotypes (muscular hypotonia HP:0001252, respiratory insufficiency HP:0002093, SMA-like neurogenic muscular atrophy HP:0007269, sensory axonal neuropathy HP:0003390); additional evidence on the two existing pathophysiology nodes and the three existing phenotypes; a p.E140K founder-allele genotype-phenotype account in the genetic features with four supporting evidence items; a copper-histidine treatment with a BYPASSES target_mechanisms link to the copper-delivery node plus a CHEBI therapeutic_agent; a genetic counseling treatment; an SCO2 patient iPSC-derived cardiomyocyte experimental_model and an allele-matched Sco2 E129K knock-in animal_model, both pathograph-linked; and a HUMAN_MODEL_MISMATCH discussion on the Sco2 mouse cardiac gap with two proposed experiments. Deliberately not ported: the umbrella disease entity itself, and the SCO1 (PMID:23878101) and COX15 (PMID:12474143) evidence, which belong to the sibling entries. Eight validator-generated references_cache files were retrieved from the PR branch via git checkout. Validation: just validate passed (schema, terms, references; Snippets checked 32/32 verified); count-verified-snippets 32/32; check-duplicate-keys OK; check-title-snippets OK; check-cache-order OK; check-term-cache-integrity OK; check-groupings reports this member still SATISFIED.

  summary: Add anesthetic-trigger EHR case-finding definition for latent MH susceptibility
  details: |
    Fourth worked example for hypothesis-based phenotype algorithms — the anesthetic-trigger member of the trigger-provoked-latent-disease archetype and the first to move out of cardiac electrophysiology into skeletal-muscle Ca2+ release (RYR1/CACNA1S). No new pathophysiology node needed: the definition attaches_to the existing 'Trigger-dependent RyR1 calcium dysregulation' node (which already frames anesthetics/succinylcholine as exposing a latent defect). Added a PHENOTYPE_ALGORITHM definition (derivation_basis: ESTABLISHED_CRITERIA, validation_status: UNVALIDATED) for a peri-anesthetic MH-reaction case-finding query for latent RYR1/CACNA1S carriers, evidenced by PMID:32898259 (50->70% of MH-reaction patients carry RYR1/CACNA1S variants; carriers asymptomatic until triggered). eMERGE/All of Us or an anesthesia/MH registry (NAMHR/MHAUS) noted as validation substrate. Snippets verified as exact substrings; schema/term/reference validation pass; data tests pass.

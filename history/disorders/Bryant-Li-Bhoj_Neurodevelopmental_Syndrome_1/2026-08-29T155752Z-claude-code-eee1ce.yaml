  summary: 'Create: Bryant-Li-Bhoj Neurodevelopmental Syndrome 1'
  details: |
    De novo curation of BLBS1 (MONDO:0030606, H3-3A) from stubs/Bryant-Li-Bhoj_Neurodevelopmental_Syndrome_1.yaml, using a claude_code deep-research report. The sibling entry Bryant-Li-Bhoj_Neurodevelopmental_Syndrome_2 (H3-3B) already existed and explicitly recorded BLBS1 as a differential diagnosis rather than folding it in, so this entry reciprocates that differential. just preflight-dr returned WARN because the report mentions H3-3B 27 times against 34 for H3-3A; the report discusses both entities, and its H3-3B-specific content (the p.Leu48Arg iPSC hyper-deposition model, the inherited p.Asn108Ser allele, the synonymous stop-gain and stop-loss alleles) was excluded rather than folded in. The GeneReviews baseline required by the disorder-creation skill was fetched (PMID:37782742) and its Clinical Characteristics, Management and Surveillance sections were cross-referenced into phenotypes and treatments; the top-level references block carries the GeneReviews tag. Mechanism is a seven-node chain from the de novo H3-3A variant through disrupted nucleosome assembly and aberrant local histone post-translational modification to deregulated proliferation, the neural crest craniofacial defect, and the neurodevelopmental plus degenerative brain phenotype. The zebrafish h3f3a model is curated here with modeled_mechanisms, readouts and an explicit limitations note, because h3f3a is the H3-3A ortholog. Three ontology CURIEs suggested by the report were wrong and were replaced after checking the ontologies directly: HP:0031808 is Decreased total basophil count rather than Camptocormia (correct HP:0100595), CL:0002608 is hippocampal neuron rather than radial glial cell (correct CL:0000681), and HP:0007256 is Abnormal pyramidal sign rather than Spasticity (correct HP:0001257). No conforms_to is declared against epigenetic_machinery_neurodevelopmental_dysregulation because that module's entry node is haploinsufficiency and this disease is explicitly not haploinsufficiency; the sibling entry makes the same choice. Validated with just validate (61/61 snippets verified), just validate-terms, check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, and the batched just validate-disorders. After the first CI run, the branch was rebased onto main to pick up #10003, which retired supports: PARTIAL; the three PARTIAL evidence items were migrated to supports: SUPPORT with directness: INDIRECT, which is what each of them was actually recording - a quote from which the curated claim follows by an inference step rather than one that asserts it.

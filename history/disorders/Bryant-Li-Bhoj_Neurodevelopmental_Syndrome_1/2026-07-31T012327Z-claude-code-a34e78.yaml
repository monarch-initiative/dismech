  summary: 'Create: Bryant-Li-Bhoj Neurodevelopmental Syndrome 1'
  details: |
    De novo curation of BLBS1 (MONDO:0030606, H3-3A/HGNC:4764, OMIM 619720). Deep research: falcon (Edison), report at research/Bryant-Li-Bhoj_Neurodevelopmental_Syndrome_1-deep-research-falcon.md (27 citations, 1 artifact). NEC preflight passed: the MONDO causal gene (H3-3A), OMIM xref (619720), and synonym (BRYLIB1) all match the DR report's primary entity. GeneReviews baseline PMID:37782742 fetched, tagged, and cross-referenced against Clinical Characteristics. Every falcon-supplied citation was independently verified and three falcon errors were caught and discarded: two abstract quotes attributed to PMID:33268356 that are absent from the cached full text, and the HPO suggestion HP:0002062 for delayed walking, which is actually Abnormal pyramidal tract morphology (replaced with HP:0031936). Curated a 9-node pathograph from de novo H3-3A missense variation through mutant-H3.3 nucleosomal perturbation, cis histone-PTM deregulation, transcriptional and chromatin-accessibility dysregulation, and impaired neuronal differentiation to abnormal brain development, neurodevelopmental impairment, and a progressive-decline arm, plus two mechanistic_hypotheses groups (gain-of-function versus dominant-negative; G34-specific H3K36me2/DNMT3A branch). 27 phenotypes carrying H3-3A-stratified frequencies from the 96-person cohort (PMID:38678163) where available, 7 imaging findings from the dedicated neuroradiology review (PMID:35772801), 3 animal and cellular models, 6 treatments, 3 diagnostic modalities, and 5 discussions (4 KNOWLEDGE_GAP plus 1 HUMAN_MODEL_MISMATCH for the murine G34R mechanism). No prevalence record was curated, deliberately: exome capture kits miss the H3-3A last exon so published case counts are biased downward, which is documented in the prevalence discussion. Validated with just validate (schema, term, and reference validators all pass); compliance 91.8 percent global and 92.0 percent weighted.

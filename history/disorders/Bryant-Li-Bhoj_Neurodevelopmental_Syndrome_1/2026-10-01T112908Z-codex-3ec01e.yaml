  summary: Review H3-3A mechanisms, natural history, clinical care and experimental
    models against cached primary sources
  details: |
    Reviewed the complete existing entry, prior history, deep-research report, clinical cohorts and full GeneReviews chapter. Corrected the db1092 zebrafish allele from null to dominant-negative D123N and removed the peripheral-glia-to-CNS-myelination inference. Replaced uniform gain-of-function and obligatory adult degeneration claims with variant-specific, qualified mechanisms and natural history. Added measured H3-3A abundance and DAXX effects, T45I H3K36/PWWP findings, and yeast transcriptional results with model limitations. Read both new preprints in full; recorded negative mouse histological and cognitive results. Used the G34R H3f3a study as an explicitly indirect mechanistic comparison because its human cases carry H3-3B variants. Corrected pooled versus gene-specific phenotype denominators and added specific imaging, growth, musculoskeletal, ocular and endocrine findings. Expanded management, baseline assessment and genetic counseling; qualified cancer-risk evidence. H3-3B neural organoids remain outside the BLBS1 model set. All 161 evidence snippets and 178 titles pass automated cache validation; schema and ontology checks pass.

  summary: Review and enhance dermatitis herpetiformis curation
  details: |
    Added Harrison's chapter classifications (DERMATOLOGY, IMMUNE_RHEUMATOLOGIC, GASTROINTESTINAL) with evidence from PMID:31244841 and PMID:29757210; added United Kingdom annual incidence record (0.8 per 100,000 person-years, PMID:29757210); grounded diagnosis entries with NCIT terms (Skin Biopsy NCIT:C51692, Diagnostic Serology Testing NCIT:C217458); added human skin-grafted SCID mouse anti-TG3 passive-transfer animal model (PMID:21335491) linked to Granular IgA-TG3 Deposition in the Papillary Dermis.

  summary: 'Create: Dermatitis_Herpetiformis'
  details: |
    New entry for dermatitis herpetiformis (MONDO:0015614), the cutaneous IgA/epidermal-transglutaminase (TG3) manifestation of gluten sensitivity. Deep research: claude_code (research/Dermatitis_Herpetiformis-deep-research-claude_code.md); report used as a coverage lead only. All 22 evidence snippets were taken from independently PubMed-fetched, cached abstracts and verified. Causal chain: HLA-DQ2/DQ8 gluten presentation -> gut small-bowel autoimmunity (anti-tTG) -> high-avidity anti-TG3 IgA -> granular IgA-TG3 papillary-dermis deposition -> neutrophil recruitment/microabscess -> subepidermal vesicles -> pruritic papulovesicular eruption; all 3 phenotypes causally connected. Key PMIDs: 11901200 (TG3 as DH autoantigen, Sardy), 29757210/31093998/33432477/31244841/21571167 (reviews), 21335491 (anti-TG3 passive transfer, human-skin-grafted mouse). Gluten environmental trigger left without ECTO term (searched l~gluten, l~wheat; none). No GeneReviews chapter (complex HLA disease). Validated: just validate (schema/terms/22 snippets), check-entity-refs, check-causal-targets, gene-grounding, list-disconnected-phenotypes (3/3).

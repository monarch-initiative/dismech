  details: |
    Addressed ai4c-reviewer re-review (round 1 verdict) on PR #13249. Blocking: removed frequency: OCCASIONAL from the lymphoma phenotype — the sources give only a six- to tenfold relative risk, not an absolute 5-29% share, so OCCASIONAL overstated it; the relative risk remains in the description. Suggestions taken: renamed the phenotype and its two bare-name targets (gut-node downstream, gluten-free-diet target_mechanism) from 'Enteropathy-associated lymphoma' to 'Lymphoma' (sources say T-cell OR B-cell / NHL, so the EATL-specific name overclaimed); tightened the rituximab description to 'single refractory case' and noted it depletes CD20+ B cells not plasma cells. Declined (optional, with reasons on PR): plasma cell on the anti-TG3 node (kept B cell for coherence with the rituximab target and because the node models the whole B-lineage response), topical clobetasol/dapsone gel, thyroid comorbidity, Finnish point prevalence, KNOWLEDGE_GAP discussion. All 36 snippets verified; validate-disorders, entity-refs, causal-targets clean; 4/4 phenotypes connected.

  summary: 'Create: Craniofaciocardiohepatic_Syndrome'
  details: |
    New entry for craniofaciocardiohepatic syndrome (MONDO:0978295, AMOTL1). Phenotypes, inheritance and variants come from the 16-patient cohort report (PMID:36751037, PMC full text; frequencies taken from its Table 1), the de novo p.Pro160Leu case (PMID:33026150), the liver case report (PMID:36116699) and the naming report (PMID:39538375). The mechanism chain follows the 2026 functional study (PMID:42012498): hotspot variants in the tankyrase-binding motif escape tankyrase/RNF146-mediated degradation, accumulate in the cytoplasm, disrupt junctions and focal adhesions and slow cell migration, with zebrafish craniofacial, cardiac and trunk defects. The Liegel 2019 mouse work (PMID:30375152) supplies the knock-in survival defect and the tolerated deletion. Neither animal model produces a cleft, recorded as a HUMAN_MODEL_MISMATCH discussion. Deep research was requested from falcon, which is not configured here; the run used --fallback and openscientist produced research/Craniofaciocardiohepatic_Syndrome-deep-research-openscientist.md (10/10 references resolved). just preflight-dr confirmed AMOTL1 and OMIM 621192. Three report citations on normal AMOTL1 biology (PMID:19590046, 21832154, 23942117) were not used because they do not concern the disease variants. No GeneReviews chapter exists. Validated with just validate, validate-terms, count-verified-snippets (42/42), check-entity-refs, check-causal-targets, check-coarse-phenotypes and validate-disorders. A fresh-context self-review before the PR led to: frequency bands for the 5/16 features corrected to FREQUENT and the liver-disease count moved off the transaminase phenotype; functional_impact_category removed because the sources leave gain of function versus dominant interference open and show a partial loss of DDI2-dependent function; mechanism claims restricted to the variants tested (R157C, P160L) with the wild-type overexpression effect stated; primary mouse negatives and the off-target CRISPR caveat added; GO terms changed to tight junction organization and focal adhesion assembly; inheritance counts and two clinical confounders (Beckwith-Wiedemann syndrome, a KANSL1 nonsense variant) recorded. PR review round 1 (changes requested for missing management and diagnosis): added diagnosis rows for exome sequencing and the cohort's screening recommendations (echocardiography, electrocardiography, audiology, multisystem surveillance), and treatments for cardiac repair, cochlear implantation, gastrostomy and constipation management, each quoting PMID:36751037 or PMID:33026150. Cleft repair was added as standard care without evidence because no AMOTL1 source describes the repair. Also added hypertelorism and neutropenia, a constipation frequency, and descriptions on the morphogenesis edges stating which are inferred from zebrafish and that clefting is not modelled. A follow-up push fixed the CI gate check-gene-activity-grounding, which reported AMOTL1 as wired into the pathograph without a molecular function: the variant node now binds enzyme binding (tankyrase 1/2) and ubiquitin protein ligase binding (RNF146), both DECREASED, citing PMID:42012498. Neutropenia also gained an OCCASIONAL frequency (1/16).

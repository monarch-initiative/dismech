  summary: 'Fix: Rebind Alcohol consumption exposure to ECTO:0001082'
  details: |
    Rebound the 'Alcohol consumption' environmental entry from ECTO:9000027 (exposure to
    ethanol) to ECTO:0001082 (exposure to alcohol consumption), completing the alcohol arm of
    issue #8469.

    Like the Essential_Hypertension entry fixed in the same pass, this one was not in the
    original #8469 conflict list and acquired its binding on main after that issue was filed.

    The entry records a contested risk association rather than a mechanism: its
    influences_mechanisms link is graded PREDISPOSES / INDIRECT_UNKNOWN_INTERMEDIATES and its
    own description says the association is 'confounded with smoking' and treated as
    controversial by the cited review, whose snippet lists 'alcohol intake' among
    environmental risk factors. No ethanol or acetaldehyde chemistry is curated, so the
    behaviour term is correct.

    No evidence items were added, removed, or re-quoted; the existing PMID:21060335 item and
    its grading are untouched.

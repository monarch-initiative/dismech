  summary: 'Create: Spinocerebellar_Ataxia_Autosomal_Recessive_With_Axonal_Neuropathy_3'
  details: |
    New entry for SCAN3 (MONDO:0020770), caused by biallelic COA7 variants.

    Sources. One claude_code deep-research report
    (research/Spinocerebellar_Ataxia_Autosomal_Recessive_With_Axonal_Neuropathy_3-deep-research-claude_code.md).
    Its reference validation resolved 18/18 references and matched 6/6 quotes, with no
    unresolved or off-topic references. Term validation flagged needs_review only for
    labelling artefacts (MONDO:0020770 and DOID:0070465 called "MONDO"/"DOID"), one
    obsolete GO cellular-component term (GO:0005751, not used) and unresolvable GARD
    xrefs (not used). just preflight-dr returned PASS (COA7 mentioned 54 times, OMIM
    618387 matches). No CURIE was copied from the report without a cache or OLS lookup.
    Every cited paper was fetched and its cached text read before quoting: the founding
    Japanese series (PMID:29718187), the first patient (PMID:27683825), the COA7
    knockdown, import and structure studies (PMID:24333015, PMID:30885959,
    PMID:35210360), and later case reports (PMID:34322155, PMID:35603692,
    PMID:37264311, PMID:37750949, PMID:42182620). Fetching PMID:37750949 upgraded its
    existing abstract-only cache file to PMC full text; the full text is needed for the
    ACMG classification sentences. Not used: PMID:42552261 (Turkish neuropathy cohort;
    COA7 details not in the abstract) and PMID:40830826 (COX18, a differential the
    report suggested without a COA7-specific comparison).

    GeneReviews. just check-genereviews --online returned NO_CHAPTER for the entry name
    and all four synonyms, so the case reports are the baseline.

    Pathophysiology. Fifteen nodes, one scale each: reduced mitochondrial COA7 protein
    (slow MIA import, proteasomal degradation) -> loss of COA7 heme-binding disulfide
    reductase activity -> complex IV assembly stall after the COX1 module -> deficient
    complex IV electron transfer -> glycolytic lactate rise, and -> bioenergetic failure
    in energy-demanding tissue, which branches to peripheral nerve (insult -> axonal
    degeneration -> length-dependent nerve dysfunction -> neuropathy phenotypes),
    cerebellum (insult -> cerebellar neurodegeneration -> ataxia, dysarthria, intention
    tremor), cerebral white matter, cerebral neurodegeneration (infantile form),
    nigrostriatal terminals -> striatal dopamine deficiency -> parkinsonism and
    dystonia, and subclinical mitochondrial myopathy. Laboratory, biopsy and imaging
    findings are attached as READOUT_OF reports_on links. 22 of 36 phenotypes are
    causally connected; the rest are 11 readouts plus respiratory failure, feeding
    difficulties and scoliosis, left unconnected where no source states a mechanism.

    Conformance added: complex_iv_assembly_deficiency at Complex IV Biogenesis Failure,
    Impaired Terminal Electron Transfer and ATP Synthesis, Lactic Acidosis and Metabolic
    Decompensation (mild lactate elevation only) and High-Energy Tissue Dysfunction;
    peripheral_axonal_degeneration at Insult to Peripheral Neurons and Schwann Cells,
    Distal Axonal Degeneration and Demyelination and Length-Dependent Nerve Fiber
    Dysfunction; cerebellar_purkinje_degeneration at Cerebellar Neuron Insult;
    parkinsonism_dopaminergic_degeneration at Nigrostriatal Dopaminergic
    Neurodegeneration and Striatal Dopamine Deficiency and Basal Ganglia Circuit
    Dysfunction. Considered and not used: cerebellar_purkinje_degeneration Purkinje
    Neuron Degeneration (no neuropathology; Purkinje loss not shown);
    mitochondrial_dysfunction (aging-hallmark module, excludes monogenic respiratory
    chain lesions); cns_myelin_failure (primary defect is not in oligodendrocytes or
    myelin, and myelin loss is not histologically evidenced); schwann_cell_myelin_maintenance
    (the neuropathy is axonal); corticospinal_tract_axonopathy (spasticity in a few
    patients but no evidence of corticospinal degeneration); complex_i_deficiency (complex
    I reduction is secondary and seen in one patient).

    Treatments: levodopa, deep brain stimulation, baclofen and protirelin tartrate, each
    from single-patient reports, and supportive care. Proteasome inhibition is recorded
    only as an in vitro rescue readout on the patient-fibroblast experimental model. An
    infection-triggered worsening in one infant was not modelled as an environmental
    factor because it rests on one case.

    Validation: just validate passed; count-verified-snippets 125/125; check-entity-refs,
    check-causal-targets, check-logical-rules, check-coarse-phenotypes, check-enum-values,
    check-duplicate-keys and check-block-scalar-comments clean; whole-tree snippet-length,
    title-snippet, reference-title, snippet-grading and retired-support-prose gates
    passed; check-gene-activity-grounding reports nothing for this file; just
    validate-disorders passed.

    Review response (PR 15783): rebound the cerebellar insult node's cell
    type from CL:0000540 neuron to CL:1001611 cerebellar neuron. Connected
    Respiratory failure downstream of the length-dependent nerve fiber node,
    citing the PMID:37750949 Discussion sentence that attributes it mainly to
    phrenic nerve axonal impairment. Added Dysphagia (HP:0002015, two
    patients) and Vocal cord paralysis (HP:0001605, one patient) from the
    same full text. The optional diagnosis section and cardiomyopathy
    phenotype were not added in this round.

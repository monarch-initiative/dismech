  summary: 'Review response: expand phenotypes from HPOA, resolve eyelid term'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9996.

    Blocking item 1, phenotype coverage. The reviewer was right and the original reasoning was wrong. The first pass curated 5 phenotypes and recorded the omission of the rest as a source-availability constraint, on the grounds that the index paper is cached abstract-only and does not enumerate the malformations. But Phenotype.evidence is not schema-required, and recording HPO annotation provenance in notes is attribution rather than a fabricated quote. The full HPO disease annotation for OMIM:617746 was fetched directly from the ontology.jax.org API rather than taken from the deep-research report, and 47 additional phenotypes were curated from it across eleven organ systems, each carrying a notes line naming HPOA as the provenance and no evidence item. Frequencies were not assigned to these, because the API returns none and guessing them is what the frequency-mapping guidance forbids. The Inheritance and Clinical course categories were skipped as already modelled elsewhere in the entry.

    Blocking item 2, the ablepharon term. The reviewer's doubt was well founded and the authoritative check confirmed it: HP:0011224 Ablepharon is absent from the HPO annotation for OMIM:617746, which instead carries HP:0000636 Upper eyelid coloboma. The resolution is not a swap. Upper eyelid coloboma is now curated as the primary eyelid term from HPOA, describing the two index subjects, and Ablepharon is retained as a separate OCCASIONAL entry because it is explicitly documented in the later Glu117Asp case report. Both notes say why the entry carries two eyelid terms rather than one.

    Non-blocking items taken up. Two treatments were added, both explicitly phenotype-directed rather than disease-directed and graded PARTIAL, with notes saying so: corneal protection for the eyelid phenotypes, and infection prophylaxis for the curated asplenia annotation. The knowledge-gap discussion that previously said the treatments section was deliberately empty was rewritten to state the remaining gap accurately. The ClinVar nomenclature discrepancy is recorded in the genetic notes, with the published c.351C>G left uncorrected inside the evidence snippet. UBERON:0004017 periocular mesenchyme was added to the fifth pathophysiology node. The craniosynostosis phenotype was renamed Coronal Craniosynostosis to match the breadth of HP:0004440, which broke a foreign key in a discussion attaches_to; that was caught by check-entity-refs and fixed. The cranial-neural-crest EMT thread was added as PARTIAL evidence from the cached PMID:35781329, and a mechanistic_hypotheses group, glu117_interference_dosage_continuum, was added with status EMERGING and wired to the first causal edge and to the Saethre-Chotzen boundary discussion.

    One suggestion was not taken. No modifier was set on GO:0046983 protein dimerization activity. The claim is that dimerisation is retained, and ModifierEnum has no value meaning unchanged; INCREASED, DECREASED, ABNORMAL and the rest would all assert something the sources do not support. The node description states the retention explicitly instead.

    Compliance falls from 86.7 percent to 73.5 percent because the 47 HPOA-derived phenotypes carry no evidence items. That is the intended trade, not a regression.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (40/40), just check-entity-refs, just check-duplicate-keys, just check-snippet-grading, just check-snippet-length, and just check-title-snippets.

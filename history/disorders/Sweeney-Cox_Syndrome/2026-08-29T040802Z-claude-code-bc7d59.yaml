  summary: 'Review response 3: fix congenital onset overreach, regrade ACMG quote'
  details: |
    Third review response on PR #9996, addressing two IMPORTANT items and three non-blocking suggestions.

    Item 1, congenital onset asserted where it cannot hold. The reviewer caught a real error introduced by the previous commit. HP:0003577 Congenital onset was propagated from one disease-level HPOA row onto every HPOA-derived phenotype descriptor, including Delayed speech and language development and Global developmental delay. Both are diagnosed by failure to meet post-natal milestones and cannot be observed at birth, so the structured slot was making a claim the accompanying note did not. onset: was removed from those two. The sweep was left in place elsewhere, because for the structural malformations it covers, anal atresia, choanal atresia, patent ductus arteriosus, patent foramen ovale, syndactyly and cerebellar hypoplasia, congenital onset is independently true regardless of how it arrived.

    Item 2, evidence_source on the ACMG standards quote. Regraded HUMAN_CLINICAL to OTHER. The quoted sentence cites a professional standard and has no patients, cohort or data behind it, which is the canonical OTHER case in CLAUDE.md. The reviewer noted the entry already applies this reasoning to three PMID:41850652 quotes and was inconsistent here, which is correct. The ClinGen classification snippet in the genetic block stays HUMAN_CLINICAL because that one does aggregate human case evidence.

    Non-blocking suggestions taken up. The frequency policy was applied asymmetrically: 46 HPOA-derived phenotypes carried a note declining to assert a band, while five hand-curated phenotypes a few lines away carried bands drawn from the same small patient set. Each hand-curated frequency now records its basis, which is the source's qualitative characterisation rather than a patient count, and states that the HPOA phenotypes carry no band for the complementary reason. The reviewer separately observed that OCCASIONAL is 5 to 29 percent in HPO while the two features carrying it are 1 of 3; the note on Coronal Craniosynostosis now states that disagreement explicitly and explains why the qualitative statement is preferred, namely that a denominator of three cannot distinguish 33 percent from 5 percent and that the source is characterising the syndrome rather than tallying its own series.

    A vaccination treatment was added alongside antibacterial prophylaxis, bound to NCIT:C15346 with therapeutic_modality VACCINE. The cited asplenia recommendation names vaccination first and the previous commit consumed only the antibiotic half of it. Two further diagnosis entries were added, craniofacial CT with three-dimensional reconstruction and ophthalmic examination, both curated with notes provenance and no evidence item on the same basis as the abdominal ultrasound entry.

    One suggestion was not taken. No corneal-exposure pathophysiology node was added. The reviewer marked it optional and noted there is no cached quotable abstract for exposure keratopathy in this context, and adding an uncited mechanism node to close a loop between two curated items would assert a mechanism the entry cannot support.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (43/43), just check-entity-refs, just check-duplicate-keys and just check-snippet-grading. The entry now carries 53 phenotypes, 4 diagnosis entries and 3 treatments across 18 sections.

    Separately, the branch was rebased onto origin/main during this session to clear an out-of-date branch state. It was behind by two unrelated commits. The rebase was clean and the post-rebase diff was reviewed for unrelated deletions and cache reversions before pushing; there were none.

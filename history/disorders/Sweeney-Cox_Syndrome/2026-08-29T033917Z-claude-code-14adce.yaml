  summary: 'Review response 2: dedupe phenotype, add diagnosis, recover HPOA frequencies'
  details: |
    Second review response on PR #9996, addressing three IMPORTANT items plus four non-blocking suggestions.

    Item 1, duplicate phenotype. HP:0000636 Upper eyelid coloboma was curated twice in the previous commit: once by hand with the term-choice reasoning, and once inside the 46-term HPOA sweep, because the exclusion set used to generate that sweep listed HP:0011224 but not HP:0000636. Nothing catches this, since check-duplicate-keys inspects mapping keys rather than list items and the two names differed only in case. The Craniofacial bulk-import copy was removed and the Ophthalmologic hand-curated one kept.

    Item 2, falsified note. The ascertainment-bias discussion still said the entry under-represents the index malformations because they sit in uncached full text. The previous commit made that false. The trailing source-availability sentences were rewritten to separate ascertainment from evidence availability, which is the argument that survives: the malformation list is now curated from HPOA, but a two-patient annotation cannot say whether those patients span the phenotype of Glu117 substitution or only its survivable part. The n=3 argument is unchanged.

    Item 3, diagnosis section. Two entries added. Molecular confirmation of the codon-117 variant, citing the already-cached PMID:42059179 on ACMG panel-eligibility thresholds and graded PARTIAL, with the point that reporting the gene alone is insufficient because TWIST1 loss-of-function and TWIST1 Glu117 substitution are different diseases. Abdominal ultrasound for asplenia, curated with notes provenance and no evidence item, on the same basis as the HPOA phenotypes, because no source recommends imaging in this syndrome specifically.

    Non-blocking suggestions taken up. The reviewer was right that frequencies are recoverable and my previous statement that the API returns none was wrong: the fraction is nested under metadata.frequency, and the earlier extraction read a non-existent top-level key. Each HPOA phenotype now records its actual fraction in notes. No FrequencyEnum band is assigned, because a count out of two patients does not support one; the reviewer made the same point about 2/2 not licensing VERY_FREQUENT. HP:0003577 Congenital onset at 2/2 is captured as onset.onset_category CONGENITAL on the HPOA-derived phenotypes. Asplenia was recategorised from Cardiovascular to Immunologic. Cheek pads at the oral commissures were added as a phenotype with preferred_term free text and no term binding, with a note explaining that HP:0000293 Full cheeks describes generalised fullness rather than localised pads and would assert a different phenotype.

    The modifier on GO:0046983 remains unset, which the reviewer endorsed.

    A destructive edit was made and caught during this session. The first attempt at replacing the bulk phenotype block used mechanistic_hypotheses as its end boundary rather than genetic, which deleted the genetic, prevalence, animal_models and datasets sections. The snippet count dropping from 40 to 33 exposed it; the file was restored with git checkout and the edit redone against the correct boundary, with a top-level key assertion added afterwards. Nothing defective was committed.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (42/42), just check-entity-refs, just check-duplicate-keys, just check-folded-hyphens, just check-snippet-grading, just check-snippet-length, and just check-title-snippets. Compliance 73.8 percent.

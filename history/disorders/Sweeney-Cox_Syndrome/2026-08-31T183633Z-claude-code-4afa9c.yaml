  summary: Rebase onto main and migrate evidence to supports+directness (#10003)
  details: |
    Rebased PR #9996 onto current main and migrated its evidence items to the new supports and directness schema.

    The branch was 120 commits behind main and marked CONFLICTING. The rebase hit four cache conflicts, all of the same benign shape: main had added one term row and this branch had added an adjacent one in the same sorted region. Each was resolved by keeping both rows in canonical sorted order rather than choosing a side, and just check-cache-order confirms the result. The post-rebase diff was reviewed for unrelated deletions and silent reversions; the cache diff against main is pure additions with zero deleted lines.

    The rebase then surfaced a breaking schema change that had landed on main while this PR was open. PR #10003 split evidence direction from directness and retired PARTIAL, so supports is now SUPPORT, REFUTE or NO_EVIDENCE, with a separate directness slot taking DIRECT, INDIRECT or UNKNOWN. All nine PARTIAL items in this entry failed schema validation.

    Each item was mapped individually rather than swept to a single value, because PARTIAL had been carrying two distinct meanings in this entry. Where the quoted text asserts something from which the claim follows by an inference step, the item became SUPPORT with directness INDIRECT: the TWIST1 dimer-balance proposal, the mouse loss-of-function EMT work cited for a human antimorphic allele, the periocular reporter activity cited for the eyelid route, the nose-and-facial-bone hypoplasia quote cited for a midface retrusion term, the ACMG panel-threshold standard cited for a diagnostic consequence, and the three phenotype-directed treatments whose sources are about eyelid coloboma and paediatric asplenia rather than about this syndrome. Where the quote asserts the claim itself and the hedge was about strength, the item became SUPPORT with directness DIRECT and the strength caveat was kept in the explanation, since the new schema has no slot for strength. That applies to the ClinGen classification item: the sentence asserts a curated gene-disease relationship, and Limited describes how much evidence supports it rather than how directly the quote bears on it.

    Explanations that referred to the retired grade were rewritten so the entry does not describe itself in terms the schema no longer has.

    No content was otherwise changed. The review approval on this PR predates the rebase and the approval will have been dismissed by the force-push, so a fresh review is needed.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (43/43), just check-entity-refs, just check-duplicate-keys, just check-folded-hyphens and just check-cache-order.

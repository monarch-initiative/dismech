  summary: 'Create: Sweeney-Cox_Syndrome'
  details: |
    Created kb/disorders/Sweeney-Cox_Syndrome.yaml (MONDO:0060592, TWIST1 Glu117).

    Deep research was requested from falcon; falcon was not configured (no EDISON_API_KEY), so the run was executed with --fallback and the report was produced by claude_code. The substitution is recorded in the report frontmatter as fell_back / requested_provider / provider_attempts rather than described in prose here: research/Sweeney-Cox_Syndrome-deep-research-claude_code.md, 25 citations, 21/21 references verified. The report's reference_validation set needs_review for one unsupported quote attributed to PMID:40020686; that reference is not cited in this entry. Its term_validation flagged three mislabelled CURIEs, of which NCIT:C15329 and NCIT:C16186 were surgical-procedure terms the report had attached to phenotype labels; none were copied into the entry.

    GeneReviews was searched via PubMed for both the disease name and TWIST1. No article exists, so no GeneReviews baseline applies.

    Pathophysiology is a five-node chain: the Glu117 basic-domain substitution, antimorphic interference with TWIST1 bHLH complexes, failure of the frontonasal ectomesenchyme programme, and then frontonasal skeletal deficiency and periocular/eyelid morphogenesis failure. functional_impact_category is DOMINANT_NEGATIVE, which is what separates this disorder from Saethre-Chotzen haploinsufficiency; the two entries are deliberately modelled as different lesions in the same gene.

    Two animal models are linked into the pathograph: the C. elegans hlh-8 Glu29 allelic series (RECAPITULATES, MODERATE) and the neural-crest conditional Twist1 knockout mouse (PARTIALLY_RECAPITULATES, MODERATE, with a skeletal readout). One dataset, geo:GSE230316, was selected manually from the mechanism literature rather than from gene-name dataset search, because a TWIST1 accession search returns predominantly cancer EMT studies; verified with just verify-datasets.

    The ClinGen Craniofacial GCEP Limited gene-disease classification is recorded on the genetic block and graded PARTIAL, since it reflects case count rather than doubt about the mechanism.

    Three discussions record open questions: a HUMAN_MODEL_MISMATCH because no model carries both the right allele and the right tissue, a KNOWLEDGE_GAP on the Saethre-Chotzen boundary, and a KNOWLEDGE_GAP on allelic ascertainment bias. Detailed malformations from the index cases were deliberately omitted because they sit in full text not available in the reference cache; the entry says so in its notes rather than curating uncitable phenotypes.

    Validated with just validate, just validate-terms, just count-verified-snippets (35/35), just check-entity-refs, just check-duplicate-keys, just verify-datasets, and just validate-disorders.

  summary: Enriched classifications, pathophysiology ontology bindings, Hypercalciuria diagnostic flag, diagnostic testing, and treatments for Hypercalciuria, Absorptive, 2.
  details: >-
    Added Harrison's chapter classifications (KIDNEY_URINARY_TRACT,
    ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) backed by verbatim
    literature snippets. Enriched ADCY10 pathophysiology nodes with anatomical
    locations (small intestine, kidney, bone element), cytosolic cellular
    component, and full immunoblot expression evidence. Marked Hypercalciuria as
    diagnostic, narrowed 24-hour urinary calcium measurement to Urine Chemistry
    Measurement (NCIT:C61044) with sourced per-kg thresholds, added ADCY10
    molecular genetic testing to diagnosis, and expanded treatments with dietary
    and fluid intervention targeting Hypercalciuria and Kidney stone.

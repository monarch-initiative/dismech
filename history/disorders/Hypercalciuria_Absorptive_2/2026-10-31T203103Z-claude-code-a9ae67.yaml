  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #16221 in one pass. IMPORTANT items: (1) the Hypercalciuria phenotype's only evidence supported the stone sequela, not the phenotype - added the direct observation (urine calcium/creatinine 0.95 and 1.61 mmol/mmol, PMID:38258300) and moved the stone-cause snippet onto the Hypercalciuria->Kidney stone sequela edge; (2) unused variant/onset data from PMID:38258300 - added the ADCY10 variant-class spectrum (16 variants: 7 missense/5 splicing/2 frameshift/2 nonsense) and near-universal heterozygosity to the genetic notes with two evidence items, added Reed 2002's segregation sentence to the genetic record, and recorded pooled mean age of onset 23.61 plus or minus 20.08 years as an onset block on the Hypercalciuria phenotype_term plus an evidence item. Suggestions taken: added an allelic-phenotype caveat to notes (biallelic ADCY10 -> recessive asthenozoospermia, PMID:31119281, distinct from this AD entry); added a KNOWLEDGE_GAP discussion attached to the sAC node (no functional assay shows the variants change sAC activity or act in intestine; both sAC edges are INDIRECT_UNKNOWN_INTERMEDIATES); added a diagnosis row for 24-hour urinary calcium (PMID:40330359). Branch scope: rebuilt the branch from origin/main so the diff carries only the ADCY10 commit, dropping the already-merged CBX1 (#16115) commits that the shared history had re-shown. Re-validated: validate-disorders (23/23 snippets, 23/23 titles), validate-terms, and the offline check-* gates all pass; all 3 phenotypes causally connected.

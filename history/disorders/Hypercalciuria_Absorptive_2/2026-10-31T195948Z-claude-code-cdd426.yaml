  summary: 'Create: Hypercalciuria, Absorptive, 2 (ADCY10)'
  details: |
    Created de-novo entry for absorptive hypercalciuria 2 (MONDO:0007748), the ADCY10 (soluble adenylyl cyclase) subset of primary absorptive hypercalciuria. Causal chain: ADCY10/sAC dysregulation (MOLECULAR) -> enhanced intestinal calcium absorption (TISSUE) -> hypercalciuria -> nephrolithiasis; a parallel sAC -> reduced bone mineral density edge connects the skeletal phenotype (all 3 phenotypes causally connected). relationship_type set to RISK_FACTOR (not CAUSATIVE): founding evidence (Reed 2002, PMID:11932268) is an association of ADCY10 base substitutions with 2.2-3.5-fold increased AH risk and the gene is described as a susceptibility gene (PMID:31119281); later heterozygous pathogenic variants reported as causative in single families (PMID:38258300); no ClinGen classification exists.
    Deep research: user selected openscientist (falcon key unavailable). openscientist and a subsequent --fallback run both hung in this environment because the openscientist client binary (agentapi) is not on PATH, producing no report; both were stopped. DR was then run via the claude_code provider (in-session, no external binary): research/Hypercalciuria_Absorptive_2-deep-research-claude_code.md, 3 web searches, reference_validation 2/2 verified and on-topic, term_validation 12/12 verified (one harmless HP:0000787 label-variant), and just preflight-dr PASS (intended entity ADCY10 absorptive hypercalciuria, ADCY10 mentioned 26x, OMIM 143870 matches - no Named Entity Confusion). The claude_code report corroborated the entry and added no ADCY10-specific content beyond the targeted-PubMed evidence already used.
    Evidence from targeted PubMed retrieval: PMID:11932268 (Reed 2002 linkage/variant study), PMID:38258300 (2024 pediatric heterozygous-variant case series with thiazide response), PMID:31119281 (2019 dominant segregation), PMID:15659711 (sAC biochemistry, in vitro), PMID:40330359 (2025 idiopathic hypercalciuria review, used for the heightened-intestinal-absorption and thiazide-mechanism statements with quote_role REVIEW_SYNTHESIS), PMID:18343451 (primary hypercalciuria genetic review; cached). GeneReviews/StatPearls baseline: no chapter exists (checked offline and via PubMed by disease name and ADCY10 gene symbol).
    A fresh-context red-team self-review (dismech-pr-review) was run before any PR; its findings were applied in one pass: added a snippet explicitly stating heightened intestinal calcium absorption, wired the osteopenia phenotype into the graph, loosened HP:0000938 Osteopenia to HP:0004349 Reduced bone mineral density to match "lower bone density", set the absorption node biological_scale to TISSUE, changed the two proposed sAC edges to INDIRECT_UNKNOWN_INTERMEDIATES, and added reference_title to every evidence item plus evidence on the thiazide target_mechanism link.
    Validated with just validate-disorders (schema+terms+references, 17/17 snippets, 17/17 titles), validate-terms, count-verified-snippets, and the offline check-* gates (entity-refs, causal-targets, logical-rules, coarse-phenotypes, qualifier-terms, duplicate-keys, block-scalar-comments, enum-values, delivery-system) - all pass. Closes claim issue #16177.

  summary: Review PLOD3 disease using full-text clinical, collagen and model evidence
  details: |
    Replaced activity-selective and universal secretion claims with collagen- and model-specific findings. Corrected urinary sample provenance, unsupported frequency bands and clinical management negatives. Read available primary full texts including accepted blistering manuscript, 2022 small-vessel and collagen-knockout studies, 2023 enzymology, 2025 enzyme-complex studies and 2026 patient-cell/zebrafish work. Added clinical manifestations, documented interventions, diagnostics, differentials, models and translational limits. Separated fetal hemorrhage candidate variants from confirmed recessive disease, and excluded COL7A1-RDEB and ARC data as direct PLOD3 patient evidence. Scientific OpenScientist report consumed; no disease-specific GeneReviews chapter identified, while primary care and counseling evidence was recovered. Live registry queries found no PLOD3/BCARD-specific trial; succinate remains preclinical. BMJ and ResearchGate full-text attempts for the 2019 family study failed; that source and the 2025 clinical expansion remain abstract-backed. Clinical spectrum is not wired to unproven organ-specific mechanisms merely from expression location.

  summary: 'Create: Bone Fragility With Contractures Arterial Rupture And Deafness
    (BCARD)'
  details: |
    Created BCARD syndrome (PLOD3 / lysyl hydroxylase 3 deficiency) from the primary literature plus an OpenScientist deep-research report (11/11 references verified). Five-node chain from biallelic PLOD3 loss of function through loss of hydroxylysine-linked glycosylation and failure of type IV and VI collagen assembly and secretion to basement membrane failure and multisystem connective tissue fragility. The entry is framed as a collagen glycosylation disease rather than a hydroxylation disease, following the mouse genetics: a mouse blocked only in the lysyl hydroxylase activity develops normally, while reducing glucosyltransferase activity is embryonic-lethal in proportion to the residual level. Causal-chain evidence is therefore graded MODEL_ORGANISM, with human evidence anchoring the endpoints. Two discussions record open points: whether LH3 carries both glycosyltransferase activities or only the glucosyltransferase (a 2023 direct mass-spectrometry study contradicts the original indirect-assay assignment), and whether the epidermolysis-bullosa-like blistering is a rare feature of one syndrome or a distinct presentation. Phenotype frequencies are graded from where a feature appears in the literature rather than from counts, because no per-feature counts exist across the roughly eleven published patients. During curation just check-reference-titles caught a reference_title I had composed from the deep-research report's description rather than copied from the cache frontmatter (similarity 0.53); both occurrences were corrected from the cached title. Validated with just validate-disorders (28/28 snippets), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-reference-titles.

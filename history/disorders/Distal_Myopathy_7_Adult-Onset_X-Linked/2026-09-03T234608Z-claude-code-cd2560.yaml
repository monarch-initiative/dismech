  summary: 'Create: Distal Myopathy 7, Adult-Onset, X-Linked (MONDO:0024771, SMPX)'
  details: |
    entry_type DISEASE. Curated as a standalone entry rather than as a subtype of X-linked Nonsyndromic Hearing Loss, which already covers DFNX4/SMPX. The boundary was set on the allelic series rather than on the gene: Johari 2021 (PMID:33974137) states the missense alleles act by gain of function through aggregation and contrasts this with the loss-of-function alleles that cause hearing loss, and Lu 2024 (PMID:39272213) states the same split from a 3,646-patient X-linked hearing-loss cohort. MONDO also places MONDO:0024771 under distal myopathy, not under the hearing-loss branch. This entry claims no auditory phenotype, on the basis that the defining cohort recorded no hearing loss into the eighth decade. Because that is an absence of recorded hearing loss rather than a systematic audiometric study, and because aggregated third-party phenotype annotations for MPD7 do list hearing impairment, the residual uncertainty is curated as a KNOWLEDGE_GAP discussion with a proposed audiometry experiment rather than resolved silently. A second HUMAN_MODEL_MISMATCH discussion records that the Smpx-deficient zebrafish shows both inner-ear and muscle phenotypes but models the loss-of-function allele class, not the missense alleles that cause this disease; the model link is PARTIALLY_RECAPITULATES with fidelity LOW for that reason. The stress-granule arm of the mechanism is deliberately modelled as a hypothesized edge with a NO_EVIDENCE item quoting the authors' statement that they saw no major differential effect between wild-type and mutant SMPX, because the abstract sentence about slowed granule clearance is about SMPX generally rather than about the disease alleles. Module conformance declared only to loss_of_proteostasis#Misfolded-Protein Aggregation; amyloidogenesis and disabled_macroautophagy were considered and rejected on evidence strength, recorded in notes. Two later phenotype-expansion case reports have no indexed abstract and were not cited; the axial-involvement finding is instead cited through the 2024 distal-myopathy review that summarizes it. Deep research: falcon, 8/8 references verified, 0 confabulation, preflight PASS with SMPX mentioned 56 times. Review follow-up (PR 10819): added HP:0009077 finger-extensor and HP:0009027 foot-dorsiflexor weakness as the two cardinal presenting phenotypes, HP:0003547 shoulder girdle weakness for the progression, the two missing alleles p.A13V and p.P27A, a diagnosis section, a classifications block, and split the treatment into physical therapy (BEHAVIORAL) and orthosis/mobility aids (DEVICE, unbound because NCIT has no reachable clinical-action term for orthosis use). Declined the reviewer's HP:0009099, which is Median cleft palate, not finger-extensor weakness; and declined HP:0003691 Scapular winging, because the source describes involvement of the arm abduction muscles and winging is a distinct sign no cited source reports. Dropped the two case-variant DOI cache files that duplicated PMID_39017652.

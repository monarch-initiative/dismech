  summary: Cite psychosocial stress; remove two unsupported sleep claims
  details: |
    Added evidence to the Psychosocial Stress and Type A Personality environmental entry and corrected its notes. The core stress and type A personality claims are supported (PMID:36120212, PMID:38131544, the latter comparing against an ocular-disease control group). Two quantitative claims were removed as unsupported: an uncited poorer-sleep-quality figure of 58.2 versus 23.9 percent, which a controlled study of 109 patients against 247 matched controls contradicts (PMID:40011741, recorded as REFUTE), and an uncited approximately 5-fold sleep-apnea risk, where the largest propensity-matched cohort reports 0.4 versus 0.2 percent incidence (PMID:34016006, PARTIAL). Both refuting and qualifying sources are attached rather than the claims silently dropped. Part of #8296.

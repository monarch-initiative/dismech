    # Review: Central Serous Chorioretinopathy

    - **File:** /home/user/dismech/kb/disorders/Central_Serous_Chorioretinopathy.yaml
    - **Review date:** 2026-08-28
    - **Mechanical audit:** `Snippets checked: 11/34 verified against cached references
      (23 skipped by prefix)` — the audit tool skips `DOI:` references, so 23 snippets
      are invisible to the mechanical gate. I verified all 23 manually against the
      cache bodies (with unicode/whitespace normalization to tolerate PDF ligatures):
      **19 of 23 verify verbatim; 4 do not** — see findings 1–4.
    - **Term validation:** `linkml-term-validator validate-data` — passed.

    ## Verdict: NEEDS_FOLLOWUP

    Four DOI-referenced snippets are not exact quotes: three are paraphrase composites
    presented as quotations (one of which misstates the paper's headline result and
    names a gene that does not appear in the paper; another imports a statistic from a
    *different* paper), and one cites a cache with no retrievable content. These all sit
    in the `DOI:` blind spot of the snippet audit, which is why they passed CI.

    ## Findings

    1. **CRITICAL** — pathophysiology › "Complement Factor H Pathway Dysregulation" ›
       evidence[0], DOI:10.1038/s41598-025-92210-6 (Mori 2025 GWAS meta-analysis).
       **Entry snippet:** "A meta-analysis of three GWAS comprising 8,811 Asians and
       Caucasians with replication in 4,338 additional Asians identified seven
       genome-wide significant loci including CFH, TNFRSF10A, GATA5, CDH5, and VIPR2,
       with 26 CFH- or CFHR-related pathways showing significant associations
       indicating the complement pathway's importance in CSCR pathogenesis."
       **Not in the cache** — it is a fabricated composite, and it is wrong on the
       facts: the paper's abstract says "we conducted a meta-analysis of three
       genome-wide association studies (GWASs) for CSC consisting of 8811 Asians and
       Caucasians, followed by replication in an additional 4338 Asians. **We
       identified four genome-wide hits**" (CFH, TNFRSF10A-DT, near GATA5, and the
       novel LINC01924-CDH7). "Seven loci" is not the paper's result; **CDH5 appears
       nowhere in the paper** (apparent confusion with CDH7 — Named Entity Confusion);
       VIPR2 is mentioned only as a *prior* study's locus (ref 25, Hosoda). The 26
       CFH/CFHR pathways are ToppGene functional-enrichment associations
       ("A total of 26 CFH- or CFHRs-related pathways showed significant
       associations"), not "genome-wide significant" loci. The node description
       repeats the same inflation ("26 … pathways with genome-wide significant
       associations"). Fabricated quotation + wrong gene + wrong result count.

    2. **CRITICAL** — environmental › "Male Sex and Hormonal Factors" › evidence[0],
       DOI:10.1038/s41598-025-92210-6. **Entry snippet:** "Expression/splicing
       quantitative trait loci analyses showed association of identified GWAS hits
       with expression and/or splicing of genes in genital organs, potentially
       explaining the sex differences in CSCR. Men represent 72–87.5% of patients, but
       older women show similar prevalence rates to men." The first sentence is a
       close paraphrase (the cache reads "Expression/splicing quantitative trait loci
       (QTL) analyses showed **an** association of **all these** hits with **the**
       expression and/or splicing of genes in genital organs, **which may** explain
       the sex differences in **CSC**") — not verbatim. The second sentence **does not
       appear in this paper at all**: the 72%–87.5% male share is from the *other*
       cited review (DOI:10.1186/s40662-023-00349-y, line "with men accounting for 72%
       to 87.5% of CSCR patients … older women"). A cross-paper mash-up presented as a
       single quotation.

    3. **CRITICAL** — pathophysiology › "Choroidal Hyperpermeability and Pachychoroid
       Dysfunction" › evidence[1], DOI:10.1038/s41467-025-58686-6 (Rämö 2025, PTPRB).
       **Entry snippet:** "The rs113791087 missense variant in PTPRB encoding vascular
       endothelial protein tyrosine phosphatase (VE-PTP) confers OR = 3.06
       (P = 7.4 x 10^-15) in a meta-analysis of 2,452 CSC patients and 865,767
       controls across four studies, and abnormal choroidal veins in CSC patients
       share morphological similarities with varicose veins." Not present in the
       cache; it is a synthesis of two separate abstract sentences ("This was
       confirmed in a meta-analysis of 2,452 patients and 865,767 controls from 4
       studies (odds ratio=3.06, P = 7.4 × 10-15)" and "Abnormal choroidal veins in
       central serous chorioretinopathy patients have been shown to have similarities
       with varicose veins"). The facts are faithful to the paper — gene, variant, OR,
       and P are right — but the snippet is a paraphrase presented as an exact quote,
       which violates the non-negotiable exact-substring rule.

    4. **CRITICAL** — pathophysiology › "Complement Factor H Pathway Dysregulation" ›
       evidence[1], DOI:10.1016/j.xops.2025.101043 (CFH-CFHR5 locus study). The cache
       file `references_cache/DOI_10.1016_j.xops.2025.101043.md` is
       `content_type: unavailable` with an **empty body** — the snippet ("The CFH
       rs1329428 variant showed significant association with chronic CSCR with
       macular neovascularization, and 26 CFH- or CFHR-related pathways were
       significantly associated in GWAS analyses") is unverifiable against any cached
       text. Its second clause recycles the "26 CFH- or CFHR-related pathways" phrase
       that belongs to the Mori GWAS paper (finding 1), which strongly suggests the
       quote was composed, not copied. Per repo rules, evidence that cannot be
       verified should be re-sourced with an exact quote, moved to notes, or removed.

    5. **MAJOR** — phenotypes › "Micropsia": `phenotype_term` binds
       `HP:0012508 Metamorphopsia` while the entry's own description says micropsia
       "May be confused with or co-occur with metamorphopsia" and the evidence
       explanation asserts Orphanet lists micropsia "**distinct from metamorphopsia**".
       The binding contradicts the entry's own claim, and the file now carries two
       phenotype entries (Metamorphopsia and Micropsia) bound to the *same* HP term.
       If HPO has no micropsia term, the repo contract is to omit `term:` and keep the
       free-text `preferred_term`, not to bind the nearest sibling concept.

    6. **MINOR** — treatments › "Mineralocorticoid Receptor Antagonists" › evidence
       graded `supports: REFUTE` on the sentence "The use of oral eplerenone for
       routine clinical care remains controversial, and long-term randomized clinical
       trials are warranted…". That sentence is equivocal, not refuting; the actual
       refuting sentence exists in the same cache ("The VICI study found that oral
       eplerenone … was not superior to placebo for improving VA in people with cCSCR
       at 12 months") and would be the right quote for a REFUTE grade. (The treatment
       description's VICI characterization itself is accurate to the cache.)

    7. **MINOR** — diagnosis › "Optical Coherence Tomography" and "Fluorescein
       Angiography" both cite the s40662 sentence "The novel multimodality imaging
       platforms, including the ultra-widefield imaging system, flavoprotein
       fluorescence, fluorescence lifetime imaging ophthalmoscopy, and multispectral
       imaging system…", which names neither OCT nor FA and says nothing about SRF,
       PEDs, or inkblot/smokestack patterns. The quote does not substantively support
       the specific claims it is attached to (the claims themselves are textbook-true
       and supportable from the same reviews with better quotes).

    8. **MINOR** — pathophysiology › "Mineralocorticoid and Glucocorticoid Receptor
       Overstimulation" › evidence[1] grades SUPPORT on the eplerenone-controversy
       sentence; a sentence saying the MR-antagonist's efficacy is unproven is weak,
       arguably counter-directional, support for the MR-overstimulation mechanism the
       node asserts. The mechanistic detail in the description (permeability-factor
       upregulation, tight-junction disruption) is likewise not in either quoted
       sentence.

    9. **MINOR** — top-level description and node 1 call **NR3C2 a GWAS
       susceptibility locus**. In the cited literature NR3C2 appears only as a
       candidate-gene haplotype association (van Dijk et al., cited as ref 24 of the
       Mori GWAS paper); it is not a genome-wide-significant locus in any cited GWAS.
       Overstated genetic claim.

    10. **MINOR** — phenotypes › "Blurred Central Vision" `frequency: OBLIGATE`
        (100%). PMID:36120212, cited in this same file, notes "there are cases of CSC
        in which the patient remains asymptomatic over the initial phase of the
        disease" — OBLIGATE is over-strong; VERY_FREQUENT would match the sources.
        Also, phenotype frequencies throughout are curator-assigned; the ORPHA record
        quoted carries no frequency data.

    11. **MINOR** — phenotypes › "Photopsia" and "Macular Atrophy" carry no evidence
        at all, and photopsia is not among the symptoms in the quoted ORPHA
        definition; their OCCASIONAL frequencies and mechanistic descriptions are
        uncited. (Evidence is recommended, not required — noted for follow-up, not as
        a rule violation.)

    12. **MINOR** — evidence_source: the two review/consensus papers
        (DOI:10.1186/s40662-023-00349-y, DOI:10.1038/s41433-025-03894-z) are graded
        HUMAN_CLINICAL on every use. Repo practice for management reviews/expert
        consensus without primary data is `OTHER` (cf. AIPL1 entry's handling of the
        PMID:33712480 review). Defensible either way for reviews summarizing human
        cohorts, but inconsistent with the repo's own exemplar.

    13. **MINOR** — description-level numbers not present in any cited cache as
        stated: "SRF resolution rates exceed 91% **at 19 months**" (cache has "SRF
        resolution rates of 91%" without the 19-month qualifier), acute recurrence
        "15–50%", micropulse resolution "36–100%". The often-repeated "12.8% legal
        blindness after mean 11.3-year follow-up" and "CNV in 2–15.6%" **are**
        supported by cached text (Mori intro; s40662 "2% to 15.6%"), so those are
        fine.

    Positive note: the "Psychosocial Stress and Type A Personality" entry is exemplary
    — it documents two removed unsupported sleep claims in `notes` and retains the
    refuting study (PMID:40011741, REFUTE) and the correctly-sized OSA association
    (PMID:34016006, PARTIAL; the 13,084-per-arm figure in the explanation matches the
    cache) so the bad claims cannot silently return.

    ## Coverage

    - Total evidence items with snippets: **34** (11 distinct references). All 34
      examined; the 11 PMID/ORPHA snippets were also machine-verified, and the 23
      DOI snippets were hand-verified against cache bodies.
    - Cache status: all 11 references have cache files, but
      `DOI_10.1016_j.xops.2025.101043.md` has an **empty body**
      (`content_type: unavailable`) and cannot verify its snippet (finding 4).
    - Tooling gap worth surfacing: `reference_snippet_audit` skips `DOI:`-prefixed
      references entirely, so none of findings 1–4 are caught by the audit CI runs.


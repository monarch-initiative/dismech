       association of all these hits with the expression and/or splicing of genes in
       genital organs, which may explain the sex differences in CSC.") and moved the
       72%–87.5% male-share claim to a NEW second evidence item citing its actual source
       (DOI:10.1186/s40662-023-00349-y) with the exact quote "Various studies have reported
       a higher prevalence of CSCR in men than in women in clinic-based populations, with
       men accounting for 72% to 87.5% of CSCR patients".
    3. **CRITICAL (Rämö 2025 PTPRB paraphrase)** — Split into two exact-quote items:
       (a) "Abnormal choroidal veins in central serous chorioretinopathy patients have been
       shown to have similarities with varicose veins." and (b) "This was conﬁrmed in a

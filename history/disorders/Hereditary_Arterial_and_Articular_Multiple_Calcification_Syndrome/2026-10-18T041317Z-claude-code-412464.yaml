  summary: 'Address review on PR 14704: phenotypes, differentials, history links'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 14704. Split the bundled phenotypes 'Arthralgia and joint deformity' and 'Arterial tortuosity and arteriomegaly' into atomic nodes (Arthralgia; Joint deformity bound to HP:0001367; Arterial tortuosity; Arteriomegaly and ectasia of lower-limb arteries bound to HP:0035012) and added Early-onset osteoarthritis (HP:0003088), Lower-extremity arterial occlusion with reduced ankle-brachial index (HP:0004950) and Chronic ischemic rest pain of the feet (HP:6000627), each wired from the calcification node and cited to PMID:21288095, DOI:10.1007/s42399-023-01485-1 or DOI:10.3941/jrcr.v17i12.5175. Added a diagnosis row for normal serum calcium, phosphate, vitamin D and PTH. In the GACI differential, replaced the PXE-vs-GACI snippet with evidence for sparing of vasculature above the diaphragm and of the aorta; rewrote the PXE distinguishing feature and cited PMID:33925341 and PMID:27562569 for it. Added a 2023 case-count prevalence record (23 patients). Removed the duplicate gene binding on the first pathophysiology node. Corrected the earlier history record's PR link. HPO terms were looked up in OLS; snippets verified 53/53 against references_cache.

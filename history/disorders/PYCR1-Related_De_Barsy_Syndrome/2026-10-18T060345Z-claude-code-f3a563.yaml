  summary: 'Create: PYCR1-Related De Barsy Syndrome'
  details: |
    Created the PYCR1-related de Barsy syndrome entry (MONDO:0013755) from the stub, with ARCL2B (MONDO:0013051) as a has_subtypes row. Deep research: one Perplexity sonar-deep-research report, run with --param reasoning_effort=low because default-effort requests were dropped by the network after about five minutes. Report validation: 15/15 references resolved, 0 unresolved, 8 on topic, 0 off topic, 7 undecided; term validation 58/63 resolved, 1 obsolete (GO:0006561, not used; GO:0055129 bound instead), 4 unverifiable (ORPHA, MGI prefixes), needs_review set. just preflight-dr PASS (PYCR1 74 mentions). The report's numbered in-text citations do not correspond to its citation sidecar, so claims were anchored to PubMed records found by DOI lookup and targeted esearch rather than to the report's bracket numbers. Not used: PMID:22411858 and PMID:21834030 (cache body empty), PMID:29148179 (de Barsy anaesthesia series without genotyping), PMID:21431621 and PMID:32518230 (general reviews), the eLife 2023 Pycr1 mouse preprint (not fetched; mouse evidence taken from PMID:33734376). GeneReviews chapter PMID:41570168 (Neurocutaneous Disorders due to Mitochondrial Proline Synthesis Defects) tagged; it pools PYCR1 and ALDH18A1 disease, so PYCR1-specific primary reports were preferred for phenotypes and the chapter was cited for inheritance, diagnosis and management. Lump/split: PYCR1 ARCL2B and ARCL3B treated as one spectrum per the 33-patient cohort PMID:24035636 and GeneReviews; no mondo_mappings row because MONDO places the two as siblings. ClinGen Definitive (PYCR1/ARCL2B) recorded on the genetic row with subtype ARCL2B. No module conformance (no fitting module). No grouping edit: no cutis-laxa grouping exists and the ALDH18A1 entries are not members of any. Validation: just validate, validate-terms, count-verified-snippets (94/94), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, connectivity 28/28, check-genereviews --online TAGGED, validate-disorders; whole-KB check-snippet-length, check-title-snippets, check-snippet-grading (one divergence on a PMID:19648921 conclusion sentence fixed by grading it HUMAN_CLINICAL in both places), check-retired-support-prose, check-coarse-phenotypes, check-reference-titles and check-qualifier-terms pass.

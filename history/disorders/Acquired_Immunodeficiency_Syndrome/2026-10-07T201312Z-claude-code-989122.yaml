  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). The HIV confirmation row now carries the U.S. laboratory testing algorithm (antigen/antibody screen, HIV-1/HIV-2 antibody differentiation, HIV-1 NAAT) in its description, cited to PMID:42054824 and PMID:32343517, with measurements LOINC:105080-6 (method-less fourth-generation screen), LOINC:7917-8 and LOINC:7919-4 (HIV-1 and HIV-2 antibody, method-less presence) and LOINC:104781-0 (HIV-1 RNA, generic molecular genetics method, because no method-less serum or plasma HIV-1 RNA code or LOINC Part was found in the Monarch KG). The CDC surveillance-stage row binds the blood CD4 count LOINC:24467-3 and carries three age-stratified reference ranges (under 1 year, 1 to 5 years, 6 years or older) whose stage bands reproduce the count columns of the 2014 CDC staging table already quoted in the entry. The CD4 and HIV viral load biochemical markers gained loinc_term. No viral-suppression or failure band was recorded: no guideline statement of a cut-off was found in a quotable PubMed record, and the marker notes name the searches.

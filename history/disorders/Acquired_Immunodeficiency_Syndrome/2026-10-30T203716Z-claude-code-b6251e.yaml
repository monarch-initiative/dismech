  summary: 'Lump HIV infection into AIDS: fold in prevention and reservoir conformance'
  details: |
    Maintainer decision (jhc) under design decisions 3e: HIV infection and AIDS are lumped, AIDS being the disorder resulting from HIV infection, so they are modelled as one entry. The separately drafted HIV_Infectious_Disease entry is removed from PR 16040; this entry is the single HIV/AIDS entry, which already models the HIV-infection-to-AIDS continuum (persistent infection, GALT CD4 loss, caspase-1 pyroptosis, reservoir, immunodeficiency). Folded in the non-duplicate value from the HIV deep-research pass (research/HIV_Infectious_Disease-deep-research-claude_code.md): two primary-prevention treatments it lacked, twice-yearly lenacapavir PrEP (CHEBI:234519, PMID:39046157) and voluntary medical male circumcision (PMID:17321311). Wired the Persistent Cellular HIV Reservoir node to viral_latency_reservoir_persistence#Establishment of a Latent or Archival Viral Genome, giving that module the real conformer its description already names. Left viral_integrase_inhibition unwired: this entry has no integrase-strand-transfer node to carry it honestly. validate-disorders clean, 82/82 snippets verify.

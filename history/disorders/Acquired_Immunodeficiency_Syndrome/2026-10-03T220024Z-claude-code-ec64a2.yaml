  details: |
    Added three transmission records, one per route, as issue 10115 asks; the existing infectious_agent block (HIV-1, HIV-2) was left untouched. Sexual transmission (PMID:22229120 for the 80% mucosal share; PMID:27424812 HPTN 052 for the interventional result that no genetically linked partner infection occurred under stable viral suppression). Parenteral transmission through blood and shared injection equipment (PMID:22229120 for the percutaneous route; PMID:36710474, pooled emulated trials showing comprehensive needle/syringe and opioid agonist therapy lower HIV acquisition by 41%). Vertical transmission in pregnancy, at delivery and through breastfeeding (PMID:22229120 for the perinatal route; PMID:40753992, a 110-study meta-regression quantifying the per-week-of-maternal-ART reduction). New reference caches: PMID_27424812, PMID_36710474, PMID_40753992. Two snippets quoting figures were typed in ASCII (5.6%, 0.36-0.96) against a source using middle dots and en dashes, and both verified, as the typography folds on both sides of normalization. just validate clean (94 titles). No other section touched; progression was already present and was not altered.

  summary: 'Create: 5-Fluorouracil Poisoning'
  details: |
    De novo curation of 5-Fluorouracil Poisoning (MONDO:0016312). Deep research via the claude_code provider (research/5-Fluorouracil_Poisoning-deep-research-claude_code.md). Built a 7-node pathophysiology chain (deficient DPD catabolism -> systemic overexposure -> anabolic activation -> thymidylate synthase inhibition / RNA misincorporation -> proliferating-tissue cytotoxicity; overexposure also -> a fluorinated-catabolite/drug toxicity node for cardiotoxicity and hyperammonaemic encephalopathy). Proliferating-tissue cytotoxicity wires to stomatitis/diarrhoea/marrow suppression and the toxicity node to the cardiac/neuro phenotypes (6/7 phenotypes connected; palmoplantar erythrodysesthesia left unwired as its mechanism is not modelled). Phenotypes: stomatitis, diarrhoea, bone marrow suppression, palmoplantar erythrodysesthesia, myocardial ischaemia, hyperammonaemic encephalopathy, cerebellar ataxia. Genetic risk via DPYD (RISK_FACTOR) and TYMS (MODIFIER). Treatments: uridine triacetate antidote (CHEBI:90914), DPYD genotype-guided dosing, supportive care. One H9c2 rat-cardiocyte in-vitro experimental model linked to the cardiotoxicity node. Evidence from CPIC 2017 (PMID:29152729), Saif review (PMID:33283204), Jacob UTA case/review (PMID:36160401), cardiotoxicity systematic review (PMID:25186061), hyperammonaemic encephalopathy case (PMID:32082663), and rat cardiocyte study (PMID:22812382). No GeneReviews/StatPearls chapter exists. Validated: just validate (21/21 snippets, 21 titles), validate-terms, validate-disorders (CI gate), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes all pass. preflight-dr returned SKIP (no MONDO causal gene for a poisoning entity); report top genes DPYD/TYMS confirm correct entity.

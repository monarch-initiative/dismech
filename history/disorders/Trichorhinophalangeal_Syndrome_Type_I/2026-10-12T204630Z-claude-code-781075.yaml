  summary: 'Review round 1: dental branch, GeneReviews counselling and management,
    hip node split, titles'
  details: |
    Answered review round 1 on PR 13969. Added three GeneReviews (PMID:28426188) evidence items to the inheritance block covering autosomal dominant inheritance, the de novo fraction and the 50 percent recurrence risk. Added a dental branch: a pathophysiology node for disordered tooth development and dentin mineralisation downstream of the TRPS1 repression node (PMID:32442662, PMID:22508542), a Supernumerary teeth phenotype bound to HP:0011069 quoting PMID:37147064, and an extraction-of-supernumerary-teeth treatment bound to NCIT:C51770. Split the hip node into Abnormal Hip Joint Development and Premature Joint Degeneration, with the hypomorph mouse pointing at the development node only. Added GeneReviews and PMID:36990068 evidence for growth hormone and GeneReviews evidence for bisphosphonates. Split orthopaedic management into Hip replacement and a physiotherapy and analgesia treatment bound to NCIT:C15302. Added topical minoxidil bound to CHEBI:6942. Kept PMID:18424451 as MODEL_ORGANISM because its abstract reports mouse growth-plate and double-heterozygote rescue data and does not say the interaction assay used cultured cells. Left Nail dystrophy unconnected because no cited abstract places nail changes downstream of the hair-follicle mechanism. Backfilled reference_title on every evidence item with just backfill-reference-titles. Validated with validate-disorders and the offline gate set.

  summary: 'Create: Trichorhinophalangeal Syndrome Type I'
  details: |
    New entry for trichorhinophalangeal syndrome type I (MONDO:0008596), TRPS1, with TRPS I (truncating, haploinsufficiency) and TRPS III (GATA zinc-finger missense, severe brachydactyly) as subtypes, since MONDO folds type III into this term. TRPS II (Langer-Giedion) stays a subtype of Hereditary_Multiple_Osteochondromas. Pathograph: heterozygous TRPS1 variants -> loss of GATA-dependent transcriptional repression -> (a) uncoupled chondrocyte differentiation and perichondrial mineralisation via Runx2/Ihh/PTHrP -> hand, stature and hip phenotypes and joint degeneration; (b) disrupted hair follicle morphogenesis via Wnt inhibitors and Sox9 -> sparse hair; (c) craniofacial and axial dysplasia from the mouse GATA-deletion model -> facial features and osteopenia. 14 of 15 phenotypes connected; nail dystrophy has no mechanism node. GeneReviews chapter PMID:28426188 tagged and used as the phenotype baseline. One OpenScientist deep-research report: built-in validation completed (43/43 references resolved); preflight-dr PASS, RUNX2 mentions reflecting the TRPS1 target, and the report's OMIM 604386 is the gene record rather than the disease. Several NCIT treatment CURIEs in the report resolve to unrelated concepts and were not used. Validated with just validate-disorders and the offline CI gates.

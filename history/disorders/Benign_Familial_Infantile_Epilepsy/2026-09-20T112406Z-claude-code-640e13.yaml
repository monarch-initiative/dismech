  details: |
    Genetics pass for issue #12191. SCN8A, the MONDO-recorded gene for MONDO:0014903 (seizures, benign familial infantile, 5), was already curated with a bound hgnc: CURIE and already reached its own pathophysiology node, as did PRRT2, SCN2A and ANKH. The gap was that all four has_subtypes rows were unbound. Bound PRRT2 to both PRRT2-related BFIE and ICCA, SCN2A to SCN2A-related BFNIS, SCN8A to SCN8A-related BFIS. Added relationship_type: CAUSATIVE and a subtype foreign key to the PRRT2, SCN2A and SCN8A genetic: records; ANKH was left without a subtype key because no subtype row corresponds to it. Genetic.subtype is single-valued (the multivalued subtypes slot is not on that class), so the PRRT2 record keys on PRRT2-related BFIE only, with the ICCA link carried by the subtype row's own gene binding. No prose, evidence or references changed. Validated: just validate (72/72 snippets), validate-terms, and the offline gate set.

  summary: 'Review round 1: record why one PRRT2 record covers two subtype rows'
  details: |
    Response to a non-blocking review suggestion on PR #12331: the ICCA subtype row carries genes: PRRT2 but no genetic: record points at it, because the PRRT2 record's subtype key names PRRT2-related BFIE only. That is a schema constraint rather than an oversight — Genetic.subtype is single-valued and Genetic has no multivalued subtypes slot — so the fix is to say so rather than to add a key that cannot exist. Added two sentences to the PRRT2 record's notes recording that one record covers both rows, that the ICCA row's own gene binding is what connects it, and that the record should be split if the two subtypes ever need different allele-level or frequency detail. No binding, evidence or grading changed. Validated: just validate (72/72 snippets).

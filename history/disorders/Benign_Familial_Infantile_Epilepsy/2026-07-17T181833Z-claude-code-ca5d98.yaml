  details: |
    Added a top-level discussions block with three open questions on PRRT2-related BFIE: (1) KNOWLEDGE_GAP on PRRT2 pleiotropy determinants (why the same haploinsufficient allele yields BFIE vs PKD vs ICCA vs migraine), attached to the pleiotropy and synaptic-release nodes; (2) OPEN_QUESTION on the developmental-window basis of spontaneous seizure remission contrasted with persistent PKD, attached to the synaptic-release node; (3) KNOWLEDGE_GAP on whether the presynaptic (PRRT2) and ion-channel (SCN2A/SCN8A/KCNQ2-3) routes converge on one infantile hyperexcitability mechanism. Each carries proposed_experiments. All evidence reuses already-cited PMIDs (22243967, 23343561, 38160512, 12243921, 27052163) with exact verified snippets. No new ontology terms invented. Validated with just validate, just validate-disorders, manual substring check, and check_folded_hyphens.

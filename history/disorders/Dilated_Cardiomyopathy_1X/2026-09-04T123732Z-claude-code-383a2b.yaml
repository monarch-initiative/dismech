  summary: 'Address review on PR #10869: GeneReviews baseline, diagnosis, CK phenotype,
    genetic depth'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10869. All four blocking items closed, plus three of the non-blocking suggestions.

    1. GeneReviews baseline. Tagged PMID:20301486 (Dilated Cardiomyopathy Overview) with tags: [GeneReviews] and added a GeneReviews scope paragraph to the entry notes, following the pattern in Dilated_Cardiomyopathy_1S.yaml. The cached record is content_type abstract_only and carries only the chapter front matter, so section-by-section mining is genuinely impossible and no snippet is quoted from it; the notes say so rather than leaving the omission silent.

    2. Diagnosis block added, with four steps: echocardiography, serum creatine kinase measurement, muscle biopsy with alpha-dystroglycan glycoepitope staining and laminin overlay, and FKTN sequencing. The CK step is written as the workup trigger, since the disease looks idiopathic until someone measures it. The biopsy step records the trap that routine histology on the same specimen is near-normal, so the glycoepitope study has to be requested specifically. The sequencing step records that the founder insertion and deep-intronic alleles need targeted assays rather than coding-sequence analysis.

    3. Elevated serum creatine kinase phenotype added, bound to HP:0003236. The reviewer was right that PMID:17036286 does not mention CK, so this needed a new reference: PMID:35743126 was fetched, and it reports elevated CK in a genetically confirmed compound heterozygote.

    4. Genetic section expanded from gene plus prose to the full allelic architecture: the Japanese founder retrotransposal insertion (about 3 kb, FKTN 3' UTR, 87 per cent of FCMD chromosomes, abolishes expression), the p.Ser299Arg and p.Asn442Ser missense alleles, deep-intronic splicing alleles, and the one-severe-allele-in-trans-with-one-hypomorphic-allele model that explains why CMD1X is a separate entity from Fukuyama congenital muscular dystrophy. Three new evidence items from PMID:9690476 and PMID:35743126.

    Non-blocking suggestions taken: therapeutic_agent (NCIT:C247 ACE Inhibitor, NCIT:C29576 Beta-Adrenergic Antagonist) and a target_mechanisms link added to the guideline-directed pharmacotherapy treatment so it joins the pathograph; the pregnancy case report was resolved from PMC4630494 to PMID:26566449 through the NCBI ID converter and is now curated as an environmental entry with environmental_effect EXACERBATES, so the exposure the previous PR description called uncitable turned out to be citable; the module conformance divergence on GO:0035269 is now stated in notes as deliberate; and the PMID:27194101 reference title now matches the cache frontmatter's Unicode alpha.

    Term-binding note worth recording, because it happened twice in one session. Four NCIT codes written from memory were wrong and were caught by just validate: NCIT:C16463 is Computer Systems Development, not Echocardiography; NCIT:C1614 is KRN5500, not an ACE inhibitor class; NCIT:C265 is Antidepressant Agent, not a beta-blocker class; and NCIT:C15189 is labelled Biopsy Procedure rather than Biopsy. All four were replaced with codes looked up through runoak. The two wrong codes had already been written into cache/ncit/terms.csv and the chemicalentityterm enum cache by the failed validation runs, so cache/ was reverted with git checkout and re-derived from the corrected entry; the resulting cache diff is empty, meaning every term the entry now uses was already cached.

    Not done: the reviewer suggested adding model: to the ai_agent actor of the history record. Declined, and the reason is a constraint on this session rather than a disagreement about the convention: the operating instructions for this agent forbid writing any model identifier into an artifact pushed to a repository. Also not added: ICD and device therapy, and the arrhythmia and cardiomegaly phenotypes, which the reviewer marked non-blocking and for which the sources currently in this PR carry no usable quote.

    Validation: just validate, just validate-terms, just count-verified-snippets (29/29 verified, up from 19/19), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just check-environmental-evidence and just check-snippet-length all pass.

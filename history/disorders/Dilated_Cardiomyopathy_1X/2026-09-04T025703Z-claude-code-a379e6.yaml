  summary: 'Create: Dilated Cardiomyopathy 1X (MONDO:0012704, FKTN)'
  details: |
    New entry for CMD1X, curated as a standalone Disease rather than a has_subtypes row on Dystroglycanopathy. MONDO places MONDO:0012704 directly under MONDO:0700335 (familial isolated dilated cardiomyopathy), and the causal chain from the FKTN lesion to heart failure stays in the heart rather than running through the skeletal-muscle and pial-basement-membrane routes that Dystroglycanopathy.yaml curates.

    Deep research: one run with the claude_code provider (research/Dilated_Cardiomyopathy_1X-deep-research-claude_code.md). Its reference validation was clean (8/8 references resolved, 0 unresolved, 2/2 quoted claims found in source). Its term validation was materially useful and changed two bindings: HP:0001635 is Congestive heart failure, not Dilated cardiomyopathy, so the dilated cardiomyopathy phenotype is bound to HP:0001644 and HP:0001635 is used for the heart failure phenotype instead; and HP:0003749 is canonically Pelvic girdle muscle weakness, which is the label recorded. GO:0006486 was flagged obsolete and was not used.

    The single most important thing the research corrected is the disease name. CMD1X is NOT X-linked: the X is the position reached in OMIM's sequential lettering of the CMD1 series, FKTN is autosomal at 9q31.2, and inheritance is autosomal recessive through compound heterozygous hypomorphic alleles. The claim issue body and the first-pass draft both implied X-linkage. The entry now carries a top-level notes block stating this explicitly, because the entity is routinely conflated with DMD-related X-linked dilated cardiomyopathy at Xp21.

    Pathograph: seven nodes from reduced fukutin ribitol-phosphate transferase activity through alpha-dystroglycan hypoglycosylation, weakened sarcolemma-to-basement-membrane linkage, impaired compensatory hypertrophic signalling, ventricular remodelling, to dilated cardiomyopathy with systolic failure, plus a node recording the relative sparing of skeletal muscle and brain. Conformance declared to pial_basement_membrane_radial_glial_endfoot_failure#Alpha-Dystroglycan Glycosylation and ECM Ligand Binding Failure (checked first that this node is written generically and names FKTN, rather than being brain-scoped) and to three nodes of cardiomyopathy_maladaptive_remodeling.

    Mouse evidence is graded MODEL_ORGANISM with directness INDIRECT throughout, and the cardiac-specific Fktn knockout is recorded as an animal model with two modeled_mechanisms links, one RECAPITULATES and one PARTIALLY_RECAPITULATES with limitations. A HUMAN_MODEL_MISMATCH discussion records that no current model can address the defining question, because the available models are complete nulls made cardiac-restricted by a Cre driver rather than hypomorphic alleles acting body-wide.

    Also added Dilated Cardiomyopathy 1X as a member of kb/groupings/Familial_Dilated_Cardiomyopathy.yaml with a differentiating_mechanisms entry, and updated that grouping's rationale from five to six mechanistic classes, FKTN being the only member whose failing component lies outside the myocyte. Checked before adding that the grouping already admits a member with skeletal muscle involvement (CMD1A/LMNA), so CMD1X's minimal extracardiac involvement does not breach the isolated clause. just check-groupings reports CMD1X SATISFIED on both necessary criteria.

    Not done: no environmental entry for pregnancy as a decompensation trigger, although the research reports a case, because the source was available only as a PMC identifier and could not be fetched into the reference cache as a citable PMID. No prevalence record, because the entity is known only from case reports and no population rate can be honestly stated. No clinical trials.

    Validation: just validate, just validate-terms, just count-verified-snippets (19/19 verified), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just validate-grouping and just check-groupings all pass.

  details: |
    Addressed the round-2 findings. (1) Added an Infection prevention and control bundle treatment (NCIT:C15843 Preventive Intervention, BEHAVIORAL) targeting the environmental exposure/colonization node with INHIBITS, citing PMID:34412693's headline result (CRAB incidence 30.4->0 per 1000 patient-days) - the paper was previously cited only for background framing. (2) Unbound HP:0100658 Cellulitis from the Skin and soft-tissue infection phenotype: Cellulitis is a specific SSTI, not the general wound infection the node's four other fields describe, and no fitting HP term exists, so preferred_term is kept and term dropped with the HPO gap noted (same judgement already made for UTI here). (3) Regraded the four OTHER PMID:36272902 items to HUMAN_CLINICAL so all five uses of that review's human-nosocomial-disease framing share HUMAN_CLINICAL + REVIEW_SYNTHESIS. (4) Refined the combination-therapy description to distinguish sulbactam-durlobactam as the core regimen from cefiderocol for refractory/resistant disease. validate, validate-terms, validate-disorders (LRV, 24/24), check-folded-hyphens, check-causal-targets and list-disconnected-phenotypes (5/5) all pass. Deferred: a separate cefiderocol row with the sulbactam-durlobactam-vs-colistin comparative figure (PMID:38634975, not cached) and clinical_trials, noted in the PR comment.

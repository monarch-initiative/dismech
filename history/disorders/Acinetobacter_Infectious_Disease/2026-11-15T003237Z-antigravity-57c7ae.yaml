  summary: Add CRITICAL_CARE classification, ICU and surveillance prevalence, nosocomial
    progression, NCIT diagnosis binding, AMR differentials, and rodent lung models
  details: |
    Added CRITICAL_CARE Harrison's classification backed by PMID:36272902; added ICU CRAB incidence density (PMID:34412693) and CHINET national surveillance prevalence (PMID:41890236); added nosocomial colonization to ventilator-associated pneumonia and pneumogenic bacteremia progression phase (PMID:38852767); bound NCIT:C25300 on diagnosis; added Klebsiella pneumonia (MONDO:0030602) and Pseudomonas aeruginosa pneumonia (MONDO:0037398) differential diagnoses; and added neutropenic BALB/c mouse (PMID:33436835) and Sprague-Dawley rat (PMID:41260154) lung infection animal models.

  details: |
    Addressed the review's blocking items. Item 1 (genus scope, design decisions 3e R5): Pathophysiology has no singular subtype foreign key and MONDO carries no species/syndrome-specific Acinetobacter subtype terms, so a MONDO-bound has_subtypes restructure is not feasible; instead formalized the genus-agent scope in review_notes (the reviewer's 'narrow and declare' option) - the pathophysiology curates the shared opportunistic pathway (acquisition, biofilm, OmpA/OMV host-cell injury) plus the dominant invasive pneumonia/bacteremia pathway, with localized forms (UTI, wound) sharing upstream steps only and described as presentations rather than carried as separate pathophysiology. Item 2: re-snippeted PMID:33436835 to its in-vivo mouse alveolar-macrophage sentence (keeps MODEL_ORGANISM honest and grounds the macrophage CL binding). Item 3: wired all phenotypes (Inflammatory Pneumonia to Pneumonia; Bacteremia and Sepsis to Bacteremic sepsis, Fever, Endocarditis; Biofilm to Skin and soft-tissue infection), now 5/5 connected. Item 4: dropped the Meningitis phenotype, which had no evidence and no cached snippet to cite. Item 7: trimmed the PMID:24054697 genus-agent explanation to what the 'four validly named species of the ACB complex' quote actually carries. Item 10: renamed the 'Bacteremia and sepsis' phenotype to 'Bacteremic sepsis' to remove the case-only collision with the 'Bacteremia and Sepsis' node. Item 9: rebound the fission node to GO:0000266 mitochondrial fission (organelle-level) from GO:0090149. Item 12: parents set to Bacterial Infection. Item 5 (partial): added sulbactam-durlobactam and cefiderocol as therapeutic_agent preferred_term entries; bound CURIEs were not resolvable offline in this environment (no OLS/NCIT build access), so they carry preferred_term only pending a run with ontology access. Item 6 (deferred): ECTO binding for the two environmental exposures could not be attempted - OLS and the local ECTO build were unreachable here, so rather than write an unverifiable search note it is left for a follow-up with ontology access. validate, validate-terms, count-verified-snippets (23/23), check-folded-hyphens, check-block-scalar-comments, check-duplicate-keys, check-enum-values, check-case-collisions, check-causal-targets, check-entity-refs, list-disconnected-phenotypes (5/5) and validate-disorders all pass.

  summary: Bind CSF amyloid-beta 40 and 42 LOINC codes as plain concentrations, not
    a ratio
  details: |
    LOINC tranche J batch 1. Bound LOINC:70072-4 (Amyloid beta 40 peptide [Mass/volume] in Cerebral spinal fluid) and LOINC:33203-1 (Amyloid beta 42 peptide [Mass/volume] in Cerebral spinal fluid) to the two separate CSF amyloid-beta 40 and 42 biochemical markers. Both are plain concentration codes, not the Abeta42/Abeta40 ratio code (LOINC:98485-6) that also exists in the same LOINC family: this entry's two rows each report a standalone 'Decreased' finding for one peptide, not a ratio value, so the ratio code would misstate what the rows actually claim. LOINC:33203-1 was already cached from an earlier-merged Alzheimer entry; LOINC:70072-4 is new, verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

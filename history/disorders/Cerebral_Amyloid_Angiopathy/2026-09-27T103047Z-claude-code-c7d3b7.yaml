  summary: 'Genetics pass: wire APOE/APP/CST3 into the pathograph, bind ACys'
  details: |
    Genetics-gap pass for series-070 (issue 12277). Gene wiring measured with dismech.qc_plugins.gene_mechanism_wiring_coverage, which builds the causal graph and so reads gene, gene_term, genes and genetic_context gene slots together: 0/3 causal genetic records reached a pathophysiology node before this pass, 3/3 after. APOE bound as a genes descriptor on Impaired perivascular amyloid-beta clearance, whose own cited evidence (PMID:39745195) is the APOE review sentence about processing, aggregation and clearance. APP bound on Vascular amyloid-beta deposition with a new evidence item from PMID:36324420 naming APP as the precursor of the amyloid-beta deposited in cerebral vessel walls. A new pathophysiology node, Vascular cystatin C amyloid deposition, carries CST3 and the non-amyloid-beta arm, sourced to PMID:39054254, with a downstream edge to Vessel-wall degeneration and fragility; before this the entry had an ACys subtype row and no mechanism for it. The ACys row gained subtype_term MONDO:0007098 (ACys amyloidosis, MONDO axiom gene hgnc:2475), and the Dutch-type and ACys rows gained inheritance_term HP:0000006. The CST3 genetic record gained a gene-specific evidence item because its only prior item quoted a sentence listing five genes together. Reciprocal anchor test: the Dutch-type row is bound to MONDO:0011583, the whole APP-related arm with six variant children, while the row names only the Dutch form; MONDO:0015033 is recorded as a subtype-level narrowMatch and the review_notes name the five uncovered variants. Checklist row MONDO:0008306 (ABri amyloidosis, ITM2B) was declined structurally to its own entry and seeded as stubs/ABri_Amyloidosis.yaml, matching its committed sibling ADan_amyloidosis. Gates: validate, validate-terms, count-verified-snippets (151/151 over both changed entries), list-gene-term-mismatches --resolve (26/26 compared, 0 findings).

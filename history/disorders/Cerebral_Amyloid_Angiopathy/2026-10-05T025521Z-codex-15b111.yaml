  summary: Review CAA mechanisms, hereditary subtypes, diagnosis and treatment evidence
  details: |
    Reviewed the existing CAA entry against the Falcon research narrative, citations and structured evidence table, the 2025 International CAA Association/World Stroke Organization statement, hereditary and early-onset reviews, and primary human, mouse and cell studies. Refreshed source caches with just fetch-reference and recovered complete guideline, pathophysiological-framework and tramiprosate PDFs. Full texts informed diagnostic criteria, antithrombotic exceptions, subtype-specific mechanisms, trial interpretation and dataset scope.

    Expanded to ten subtypes, fourteen pathophysiology nodes with connected phenotypes, nine diagnostic blocks, fifteen treatment entries and eight studies. Distinguished amyloid-beta CAA from cystatin C disease, APOE susceptibility from Mendelian causes, cortical superficial siderosis from nonspecific siderosis, and TFNE from ischemic attacks or epilepsy. Added mapped APP variants and copy-number context. Preserved negative/inconclusive evidence for ponezumab, tramiprosate and NAC; diagnostic studies are not therapeutic efficacy trials. NAC registry status remains UNKNOWN because official records conflict.

    Audited all four dataset accessions and corresponding primary full texts. Human donor counts are distinguished from repeated tissue fractions, peripheral blood from brain, and ADan mice from amyloid-beta disease. Experimental models state their readouts and limitations; cell-marker changes are not evidence of clinical efficacy. No GeneReviews chapter matched the name/synonyms in the 2026-09-10 Bookshelf index. Other systemic amyloidoses, AD-only treatment efficacy and exploratory computational drug/gene candidates are explicitly scoped rather than generalized.

    Content-completeness review covered phenotypes, subtypes, mechanisms, treatments/trials, genetics, biomarkers/diagnostics, reference consumption and overall scope. No central verified omission remains. The research term lookup was unavailable; selected KB ontology bindings were independently checked and validated. All added evidence carries source titles, with primary results separated from background/review synthesis.

    Validation: just validate-disorders verified 207 snippets and 219 titles with no skipped/unavailable snippets or issues. The only other disorder consuming refreshed reference caches, ACys_Amyloidosis, also passed (71 snippets/71 titles). All fourteen phenotypes have graph connections. Repository gates, rendering and independent PR review are separately checked in the accompanying PR workflow.

  summary: Record 1 entry-relative no-link decision on environmental entries
  details: |
    Backfill for issue #8085. No pathograph link was added. This records, in the entry's own review_notes: field, that the exposure is deliberately left unlinked, and the reason specific to this entry.

    Entry dispositioned (1):
      - Hypertension

    Hypertension: The quoted text is the fragment 'vascular risk factors and concomitant medications', which names no exposure, no direction and no target. This entry's description asserts more than its evidence does, and an edge into Vessel-wall degeneration and fragility would rest on that description alone. A sentence supporting vessel-wall weakening would change this.

    The reason is entry-relative, not categorical, and this took three passes to get right. The first version asserted that a host state or demographic cannot originate a pathograph edge. The reviewer on PR #10980 showed that is false as a description of this knowledge base: 58 host-state or demographic exposures were already linked across 40 files on 2026-09-04, including Osteoarthritis (Age to Chondrocyte Senescence), Endometrial_Carcinoma (Obesity to Unopposed Estrogen Signaling) and Heart_Failure (Hypertension to Ventricular Remodeling). Seventeen entries were dropped from the change at that point.

    A second review then showed that three of the surviving reasons were themselves contradicted by the repository, and those three were dropped too. Age_Related_Macular_Degeneration/Older Age argued the evidence does not name the target node, while the Cigarette Smoking entry ten lines below links to that same node citing the same PMID:38193957 and concedes its quote reaches only the disease. Essential_Tremor/Aging and Benign_Prostatic_Hyperplasia/Age argued from the citation being epidemiological, but the Osteoarthritis link this change holds up as its own precedent was made on a prevalence-gradient citation and says so verbatim. No surviving reason rests on a citation being epidemiological.

    Central_Serous_Chorioretinopathy/Male Sex was rewritten for the same reason: its original text said the receptor-overstimulation node is already reached by the corticosteroid exposure, and that file contains no influences_mechanisms at all, so the route it pointed at did not exist.

    review_notes rather than notes: `notes:` is disease content and renders on the public disorder page, `review_notes:` is the curation record and renders nowhere. The docstring of scripts/check_environmental_evidence.py states that split. The waiver sentinel is a prefix match on a different sentence, so these do not trip it and the waiver count is unchanged at 4.

    Coverage in this file is partial by design and each note says so: other exposures here remain undispositioned. Nothing was deleted, moved or regraded, and the change is insertion-only.

    Validation: linkml-validate passed on all 10 changed files; count-verified-snippets 353/407 verified with 54 skipped by prefix and none failing; check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-environmental-evidence and check-folded-hyphens all OK.

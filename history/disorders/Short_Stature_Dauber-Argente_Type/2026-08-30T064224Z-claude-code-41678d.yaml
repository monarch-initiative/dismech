  summary: 'Create: Short Stature, Dauber-Argente Type'
  details: |
    De novo curation of Short stature, Dauber-Argente type (MONDO:0859182, PAPPA2) as a disorder of IGF-1 bioavailability rather than IGF-1 deficiency. One OpenScientist deep-research report was generated and read; its validation was clean (16/16 references verified, 19/20 terms verified, the single mislabel flag being a column-header artefact on MONDO:0859182 itself, whose CURIE is correct). Every claim taken from the report was re-verified against the cached abstract it cites. No GeneReviews chapter exists for this disease: PubMed searches for PAPPA2 GeneReviews and PAPP-A2 GeneReviews returned zero results. One error was caught during validation and fixed: PMID:34358737 had been given the title of PMID:36646053; the reference validator flagged the mismatch and all four occurrences were corrected. rhIGF-1 is recorded as BYPASSES rather than RESTORES because it supplies free hormone downstream of the blocked proteolytic step without restoring PAPP-A2 activity, evidenced by total IGF-1 and IGFBP-3 remaining elevated on treatment while free IGF-1 and growth velocity rise. Validated with just validate (41/41 snippets verified), check-entity-refs, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens.

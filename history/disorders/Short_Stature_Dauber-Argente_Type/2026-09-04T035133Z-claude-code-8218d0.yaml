  summary: Drop the phenotypes# prefix from three pathograph targets
  details: |
    Pre-emptive fix for the same defect that dequeued PR #10142 from the merge queue. Three downstream targets used the entity-reference grammar in a slot that takes a bare name: phenotypes#Postnatal growth retardation, phenotypes#Reduced bone mineral density and phenotypes#Insulin resistance. Per the Pathograph Targets section of CLAUDE.md and issue #10112 this is silent - the unresolved target draws a phantom red duplicate node labelled with the raw string and orphans the real phenotype out of the graph - so all three phenotypes were disconnected from the pathograph while the entry still validated. All three names exist verbatim in the phenotypes section, so the fix is to drop the prefix. The check-causal-targets gate does not exist on this branch; it was added to main after the branch opened, which is why the PR's own checks were green. Verified by running main's scripts/check_causal_targets.py against the fixed file: 'OK: no new broken pathograph targets'. Also re-ran just validate (passed), just validate-terms (passed), 53/53 snippets verified, check-entity-refs and check-duplicate-keys clean. No claim, evidence, snippet or node name changed.

  summary: 'Create: Tricho-dento-osseous_Syndrome'
  details: |
    New entry for tricho-dento-osseous syndrome (MONDO:0008592), autosomal dominant, caused by heterozygous DLX3 variants (hgnc:2916, the same binding the AIHHT subtype of Amelogenesis_Imperfecta uses). Deep-research input: one Perplexity sonar-deep-research report (research/Tricho-dento-osseous_Syndrome-deep-research-perplexity.md), generated through a locally streaming-patched deep-research-client because of dismech#9357 / deep-research-client#94; the process died after writing the report, so the recipe's final stamp-and-place step was run by hand; the content is the provider's. Its validation block had needs_review: true for one unresolved term, HP:0002796 (osteosclerosis), which was not bound; 29/29 references resolved. preflight-dr could not run because the local MONDO build is absent, so disease identity was checked by hand against MONDO via OLS (OMIM 190320 xref, synonyms) and the report, which names DLX3 throughout. Curated: AD inheritance; Orphanet prevalence class; DLX3 with six allele records (founder c.571_574delGGGG, attenuating c.561_562delCT, de novo p.Gln178Arg, the UK c.574delG / p.Arg159Leu / whole-gene deletion set, p.Ser202*, and the c.516+1_516+2insA splice variant); a seven-node pathograph from DLX3 transcriptional dysfunction to ameloblast, odontoblast, osteoclast, osteoblast-lineage, osteoprogenitor-senescence and hair-follicle nodes, wired to enamel, taurodontism, bone density and hair phenotypes; 22 phenotypes (92 evidence items, 29 PMIDs plus ORPHA:3352); diagnostic criteria; AIHHT differential; dental treatments; mouse, zebrafish and calf models. Conflicting bone-mechanism findings are recorded as REFUTE items on the osteoblast node rather than resolved. Orphanet ORPHA:3352 was built with just fetch-reference (Orphadata files differed from the manifest pin; the cache file is stamped with the 2026-06-23 release). Report references not used: PMID:38481875 (a letter with no abstract; the H19/miR-29c-3p/KDM5B axis is not curated), PMID:37818127 (a general odontoblast review), PMID:16301156's three-case series used only for bone findings; DOI-keyed items were replaced by their PMID records where one exists (10.1111/pde.15309 = PMID:36973173, 10.1111/scd.70058 = PMID:40402097, 10.1111/odi.12955 = PMID:30095208), and 10.1155/2020/8217919 (isolated AI with DLX3), 10.1308/rcsfdj.2024.31 (a general enamel-defect review) and 10.1002/ajmg.1320160212 (1983 heterogeneity report, superseded by the 1997 kindred study) were not needed. The H19/miR-29c-3p/KDM5B and Delta-Np63-alpha mechanisms and the WNT10A modifier hypothesis are left in prose or omitted pending more than one study. Not curated for lack of a quotable source: tooth-loss and abscess rates (~80%/~40%) quoted by the report, fracture risk, nail dysplasia frequency, and dental eruption timing. PMID:5054226 and PMID:4518033 cached with no quotable text and are not cited. No GeneReviews or StatPearls chapter exists (check-genereviews --online: NO_CHAPTER). Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading, list-gene-term-mismatches and validate-disorders all pass.

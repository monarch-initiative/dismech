  summary: Correct an over-hedged attribution on the M6P readout
  details: |
    The mannose-6-phosphorylation readout added in PR 10161 carried a note saying the quoted result was attributed to the alpha/beta genotype generally rather than verified as this specific gene-trap line. That hedge was unnecessary: MGI_PhenoGenoMP.rpt annotates PMID:17652091 to Gnptab<Gt(OST97730)Lex>/Gnptab<Gt(OST97730)Lex>, the exact genotype curated here, so the alpha/beta knockout assayed in that paper is this same line. The interpretation now states that, cites the basis, and points at the gamma-subunit arm of the same comparison now curated in GNPTG-Mucolipidosis. No snippet, evidence item or grade changed.

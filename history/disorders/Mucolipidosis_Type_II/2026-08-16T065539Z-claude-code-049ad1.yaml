  summary: Add Harrison's and lysosomal storage classifications
  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). The entry already carried isds_skeletal_category but no other classification. Added harrisons_chapter ENDOCRINOLOGY_METABOLISM + GENETICS_ENVIRONMENT_DISEASE and lysosomal_storage_category 'mucolipidosis', the latter with a real evidence block quoting PMID:34172897, which names ML II as an autosomal recessive lysosomal storage disorder of the mucolipidosis group. The notes flag that the mechanism is atypical for this enum: no single hydrolase is defective, rather loss of the mannose-6-phosphate recognition marker missorts many acid hydrolases at once. Deliberately did NOT assign icimd_category. GNPTAB adds GlcNAc-1-phosphate to N-glycan mannose, which could plausibly place ML II under the ICIMD N-linked glycosylation group or the other-glycan-metabolism group, and I could not determine which from the sources to hand. Per the guidance that it is better to be incomplete than incorrect, the slot is left empty and the gap is called out in the PR body for a curator with the ICIMD table. Validated with 'just validate' - schema, term and reference validation all passed, 25/25 snippets verified.

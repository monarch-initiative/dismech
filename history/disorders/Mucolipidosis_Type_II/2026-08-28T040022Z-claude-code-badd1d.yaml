  summary: Add Gnptab gene-trap mouse model
  details: |
    Curated mouse models from MGI genotype-phenotype annotations on the two MP branches that separate abnormal enzyme/coenzyme LEVEL (MP:0005319, under abnormal homeostasis) from abnormal enzyme/coenzyme ACTIVITY (MP:0005584, under abnormal metabolism). Candidates were selected from MGI_PhenoGenoMP.rpt joined to the MP descendant closures from OLS and to genes already present in dismech, prioritising genes annotated on BOTH branches. Each model was added as an animal_models entry with modeled_mechanisms links to existing pathophysiology nodes, per-link and per-readout evidence, and exact snippets verified against the local reference cache. The Gnptab<Gt(OST97730)Lex> gene-trap homozygote (PMID:17962477) is the clearest amount-versus-activity case in the set: MGI annotates it to abnormal circulating enzyme LEVEL (MP:0001570) and to abnormal enzyme/coenzyme ACTIVITY (MP:0005584), and the two observations point in opposite directions for the same hydrolases. Serum enzyme levels are elevated because the enzymes are secreted rather than delivered to the lysosome, while mannose-6-phosphate tagging is abolished (PMID:17652091, which also contrasts the partial loss seen in the gamma-subunit knockout). Both are curated as readouts on the same link so the dissociation is explicit. The storage link is PARTIALLY_RECAPITULATES with severe retinal degeneration recorded as a fidelity limitation, since human ML II ophthalmic data are limited by the authors' own account. Validated with just validate and exact-substring snippet checks.

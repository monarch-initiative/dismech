    (`GO:0051209`, `GO:0051402`), `locations` (`UBERON:0002037`, `UBERON:0002129`), `cell_types` (`CL:0000121`),
    and causal `downstream` edges.

    - Marked core phenotypes with `diagnostic: true` and structured `diagnosis` (`Brain MRI` and `Molecular
    Genetic Testing`) and `treatments` (`Supportive and Symptomatic Care` and `Physiotherapy and Rehabilitation`)
    backed by PMID:17590087, PMID:17932120, PMID:21827915, PMID:29196976, PMID:29421540, PMID:35081319,
    PMID:38058854, and PMID:39866519.


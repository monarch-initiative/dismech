  summary: Review and enrich Spinocerebellar Ataxia Type 15/16 compliance and mechanistic grounding
  details: '- Added `classifications` (`NEUROLOGIC`, `GENETICS_ENVIRONMENT_DISEASE`) and `inheritance`

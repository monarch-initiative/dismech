  summary: Withdraw incorrect module conformance; structure per-type frequencies as
    phenotype_contexts
  details: |
    Addresses the code review on PR #6999. All four blocking items were correct;
    item 1 is a substantive modelling error on my part and the conformance is
    withdrawn.

    Module conformance was a category error (item 1) - withdrawn, not defended.
    Both metabolic_intoxication_decompensation edges are removed. The reviewer is
    right: that module models the intoxication-type inborn errors, in which
    catabolic stress unmasks an enzymatic block and precipitates ACUTE
    decompensation (metabolic acidosis, hyperammonemia and/or hypoglycemia)
    progressing to encephalopathy. D-2-HGA is a cerebral organic aciduria and has
    none of that: I checked, and the only occurrences of acidosis, hypoglycemia,
    hyperammonemia, catabolic or decompensation anywhere in the entry were the
    conforms_to lines I had added. In the cited review the word "decompensation"
    refers to NEUROLOGICAL decompensation (loss of milestones) and to an L-2-HGA
    riboflavin-withdrawal case - not to metabolic crises. The course is
    progressive or static, not episodic.

    Worth recording how the error arose: the six entries reviewed immediately
    before this one were urea-cycle and organic-acidemia disorders where the
    module genuinely applies, and the pattern was carried across on the
    superficial resemblance - an enzyme deficiency causing metabolite
    accumulation with neurological injury. That resemblance is not sufficient for
    conformance. This is the same consistency-driven error the previous version
    of this entry explicitly warned about for the type II node, made one level up
    at the whole-entry scale. The type I node now carries a notes field stating
    why conformance is withheld, so the absence is a documented decision rather
    than an omission a future curator might "fix".

    Curation meta-commentary moved out of a rendered description (item 2). The
    type II node's description explained the conformance-withholding reasoning.
    description is public-facing biology; Pathophysiology has a notes slot. The
    reasoning is retained there, rewritten to state the biology rather than the
    curation decision: type II is mechanistically the inverse of type I - a
    neomorphic gain that manufactures D-2-HG versus a loss-of-function block that
    fails to clear it - so the disease is one entity with two etiologically
    distinct subtypes rather than two severities of one lesion.

    Per-type frequencies structured (item 3). The previous response declined to
    split by type on the grounds that duplicating phenotypes was too large a
    change. That premise was wrong: PhenotypeContext carries subtype, frequency,
    severity and evidence as a nested list on the SAME phenotype, so no
    duplication is needed. Epilepsy, Global developmental delay and Muscular
    hypotonia now each carry two phenotype_contexts entries with per-type
    frequency bands and their own Table 1 evidence, replacing the free-text
    notes. This also makes the bands machine-readable rather than narrated -
    seizures OCCASIONAL in type I versus FREQUENT in type II, developmental delay
    FREQUENT versus VERY_FREQUENT, hypotonia FREQUENT versus VERY_FREQUENT.

    Unbound inheritance_term in the genetic section (item 4). The previous
    response bound inheritance on the subtypes but left the genetic section's two
    blocks unbound - fixing the gap in one place and not the other. Both now
    bound to HP:0000007 and HP:0000006.

    Minor items: subtype preferred_term values were copied verbatim from the
    MONDO labels including their lowercase and numeric styling
    ("d-2-hydroxyglutaric aciduria 2"); changed to readable forms, which is what
    preferred_term is for. The non-temporal progression phase "Variable,
    sometimes near-normal type I course" renamed to "Established disease course
    and long-term outcome".

    Validation. Schema, term and reference validation all pass, including the
    Table 1 snippets quoted in the new phenotype_contexts.

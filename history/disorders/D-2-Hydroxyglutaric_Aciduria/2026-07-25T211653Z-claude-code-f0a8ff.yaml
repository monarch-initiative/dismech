  summary: 'Review: bind unbound subtype descriptors, split progression by type, document
    blended frequency bands'
  details: |
    Review of the seventh-oldest unreviewed disorder entry (creation_date
    2025-06-12). This entry was in better shape than the preceding six - it
    already had has_subtypes, classifications, and evidenced prevalence - so the
    findings are narrower.

    Unbound subtype descriptors (the principal finding). Both has_subtypes
    entries carried skeleton descriptors: genes with a preferred_term and no
    term, inheritance blocks with a name and no inheritance_term, and no
    subtype_term at all. CLAUDE.md calls the unbound inheritance_term "the common
    gap" explicitly. All now bound: D2HGDH (hgnc:28358) and IDH2 (hgnc:5383);
    HP:0000007 autosomal recessive and HP:0000006 autosomal dominant;
    MONDO:0024554 (D-2-hydroxyglutaric aciduria 1) and MONDO:0013345
    (d-2-hydroxyglutaric aciduria 2), both verified reachable against
    sqlite:obo:mondo before being appended to the enum cache.

    The type II inheritance description also now records a counselling point the
    bare "Autosomal dominant (de novo)" label obscured: the mode is formally
    dominant, but because the IDH2 variant is almost always new in the proband,
    sibling recurrence risk is low (bounded by parental gonadal mosaicism) rather
    than the 50% a transmitted dominant implies.

    Progression rebuilt from a single unnamed prose phase into four
    subtype-scoped evidenced phases, using full text of PMID:22391998 that was
    already cached but unmined for these figures. The prose asserted that "type
    II is generally more severe than type I" without numbers; the phases now
    carry them, and two facts emerge that the prose had flattened:
    - Type I outcome is not genotype-determined. Monozygotic twins concordant for
      type I diverged completely - one with multiple congenital anomalies and
      severe delay, the other reaching all milestones normally - implying
      postzygotic or environmental modifiers. Type I life expectancy is
      explicitly undefined in the source.
    - Cardiomyopathy is the single most discriminating feature between types (9
      of 19 type II, absent from type I in the same cohort), with one isolated
      type I exception - so near-exclusive rather than absolute.

    Blended frequency bands documented rather than silently averaged. Epilepsy
    (FREQUENT), Global developmental delay (VERY_FREQUENT) and Muscular hypotonia
    (FREQUENT) sit at disease level, but the underlying per-type figures differ
    sharply: seizures 29% type I versus 79% type II; developmental delay 78%
    (3 of 14 unaffected) versus 100% and more severe; hypotonia 57% versus 89%.
    A single band across a disease whose two types differ this much is
    misleading. Rather than duplicating each phenotype per type - a larger
    restructuring than a review should carry - each now has a notes field giving
    the per-type breakdown and stating that the band is a whole-disease average.
    Dilated cardiomyopathy's free-text context was converted to a structured
    subtype reference.

    Module conformance, with a deliberate asymmetry. Added conforms_to on the
    type I D2HGDH node (Enzymatic Block in Intermediary Metabolism) and on the
    shared mitochondrial-dysfunction node (Toxic Metabolite Accumulation and
    Energy Deficit), plus biological_scale tags. The type II IDH2 node was
    deliberately NOT given the Enzymatic Block edge, and the description now says
    why: that module node is a loss-of-function block interrupting substrate
    flux, whereas type II is the inverse lesion - a neomorphic gain manufacturing
    a metabolite the normal pathway never produces. The two types converge
    downstream at toxic-metabolite accumulation, which is where conformance is
    asserted. Asserting the block node on type II would have been an easy
    consistency-driven error that misdescribes the mechanism.

    Tooling. Two MONDO CURIEs appended to the DiseaseOrSubtypeTerm enum cache
    after verifying reachability - the ols:mondo limitation filed as issue #6989.
    check-enum-cache-offline passes.

    Validation. Schema, term and reference validation all pass.

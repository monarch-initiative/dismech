  details: |
    Addressed reviewer findings on PR #7850 (review comment 5155373631).

    (1) Hypotonia phenotype: the PMID:39587636 snippet terminated at "including
    neonatal", one clause before the word hypotonia, so the quote did not contain
    the claim it evidenced. Extended the verbatim span through "...feeding
    difficulties, hypotonia, choreoathetoid", stopping before the "move -/ments"
    hyphen break in references_cache/PMID_39587636.md.

    (2) Feeding difficulties: previously evidenced only by the proband's
    never-genotyped sister. Added the four-patient shared-feature sentence as a
    first evidence item and rescoped the sister quote's explanation to what it
    actually shows.

    (3) Retagged the six evidence items citing PMID:39239479 (an Irp2-null mouse
    behavioural study) from HUMAN_CLINICAL to OTHER where the quoted sentence is
    that paper's secondhand restatement of the human index patient. The primary
    human report PMID:30915432 is abstract-only in cache and its abstract does not
    mention epilepsy, frontal lobe atrophy or the hypochromic anaemia, so the mouse
    paper's restatement remains the only cached source for those and was retained
    rather than replaced; each explanation now states the secondhand provenance
    inline. The genuinely murine PMID:39239479 items and the paper's own
    convergence claim were already MODEL_ORGANISM and were left alone.

    (4) Added the missing "general knowledge, not evidence-backed" notes disclosure
    to the Neurodegeneration with brain iron accumulation differential, matching
    the five other differentials. The OAK statement in that note was produced by
    actually running `runoak -i sqlite:obo:mondo info MONDO:0018307 -O obo`, which
    confirms xref OMIMPS:234200, the Orphanet:385-sourced grouping definition, and
    the absence of an RO:0004003 causal-gene relation (the term is a
    disease_grouping).

    (5) GeneReviews baseline the reviewer asked to confirm: PubMed esearch for
    "IREB2[Title/Abstract] AND genereviews[book]" returns 0 results and no NDCAMA
    chapter exists, so the absence of a GeneReviews tag is correct.

    The missing deep-research artifact finding is being handled at batch level and
    was not addressed here.

    Validation: schema OK, terms OK, 121/121 snippets verified verbatim,
    check_folded_hyphens OK, check_snippet_length --against-ref origin/main OK.

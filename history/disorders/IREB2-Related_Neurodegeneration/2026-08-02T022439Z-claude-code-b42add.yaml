  summary: 'Create: IREB2-Related Neurodegeneration (NDCAMA, MONDO:0032758)'
  details: |
    New entry for neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia (MONDO:0032758, OMIM:618451, IREB2 / HGNC:6115). NEC preflight run with OAK before any content was written: MONDO:0032758 returns exactly one causal-gene relationship (RO:0004003 HGNC:6115 IREB2) and xref OMIM:618451. The 15q25.1 COPD and lung-cancer GWAS literature at IREB2 (adjacent to CHRNA5-CHRNA3-CHRNB4) and the ferroptosis/oncology literature were audited and deliberately excluded as locus-adjacency NEC traps; a RESOLVED discussion records that scoping decision. Built from primary literature only; no deep-research provider report was used. Thirteen pathophysiology nodes trace IRE/IRP regulatory failure to both the CNS and the erythroid phenotype: bi-allelic IREB2 variants, NMD and FBXL5-proteasome loss of IRP2, impaired IRE-binding activity, loss of IRE-dependent post-transcriptional control, failure of IRP1 compensation, functional cytosolic iron deficiency, iron-limited erythropoiesis with ALAS2 derepression, Fe-S and haem-dependent mitochondrial dysfunction, HIF2-alpha stabilisation with the glycolytic shift, neuronal and oligodendrocyte iron mishandling, synaptic failure with microglial activation, progressive neurodegeneration, and the extrapyramidal movement disorder. Four discussions record the brain-iron paradox, the mouse-human haematology mismatch, the dystonia-versus-ataxia species difference, and the untested hypomorphic spectrum. Validation: just validate PASS; just validate-terms PASS; just validate-references PASS with 115/115 snippets verified; check_snippets_verbatim.py PASS 115 verified; check_folded_hyphens.py --check PASS; pytest tests/test_data.py 16782 passed.

  details: |
    Applied fixes from an independent adversarial verification pass on the original curation commit.

    Term bindings. "hippocampal neuron" was rebound from the generic parent CL:0000540 (neuron) to CL:0002608 (hippocampal neuron), which OAK confirms exists and which is the established binding in several other files in this KB. "patient-derived lymphoblastoid cell line" bound to CL:0000542 (lymphocyte) was rebound to CL:0017005 (lymphoblast), with the preferred term aligned to the source's own wording, "patient-derived lymphoblasts".

    Source fidelity. Two claims mis-attributed to PMID:39587636 were corrected. First, the roughly 70 percent IRP2 reduction (SH-SY5Y overexpression, Western blot) and the absence of an IREB2 mRNA change (RT-qPCR on patient PBMCs) had been conflated into a single sentence in both the pathophysiology node and the p.Asp826Val variant description; they are now stated as the two separate experiments the paper reports, with an added evidence item quoting the PBMC result. Second, the p.Ile371Val / A1111G allele was described as producing no change in ferritin, whereas the paper records a slight increase in FTH expression. The prose was corrected in both the pathophysiology node and the variant entry, and the qualifying sentence was added as an evidence item in each.

    Unsourced prose. The belzutifan class comparison in the HIF2-alpha treatment node is now cited to PMID:39670660, already present in references_cache, and the class's on-target anaemia liability was added as a caveat specific to a disorder that features microcytic anaemia. The diagnosis claim that all four patients were ascertained by trio exome or genome sequencing and that none was suspected clinically was weakened to what the source states, namely whole-exome sequencing or parallel gene sequencing. The Named Entity Confusion note no longer asserts the 15q25.1 cytogenetic location or CHRNA5-CHRNA3-CHRNB4 adjacency, since no COPD or 15q25 reference was fetched, and the PubMed-search process claim no longer names specific populations or tumour types; it is phrased as a search performed on a date that leaves no cached artifact.

    Differential diagnoses. The "general knowledge, not evidence-backed" disclosure that previously appeared only under aceruloplasminemia was extended to neuroferritinopathy, X-linked sideroblastic anemia with ataxia, IRIDA and erythropoietic protoporphyria, whose distinguishing features are textbook facts with no reference fetched for this curation.

    References. The dangling bibliography entry PMID:21907140, cited by no evidence item and mentioned nowhere in the prose, was removed along with the cache file this branch had added solely for it. PMID:39670660 was added in its place.

    Validation. just validate (120 of 120 snippets verified), just validate-terms, scripts/check_snippets_verbatim.py (120 verified, 0 failed), scripts/check_folded_hyphens.py --check, scripts/check_snippet_length.py --against-ref origin/main, and tests/test_data.py all pass.

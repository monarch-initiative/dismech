  summary: Add deep-research artifact and curate PMID:22003390 Irp2-null mitochondrial
    evidence
  details: |
    Ran the deep-research pipeline promised in the PR description, closing the
    reviewer's outstanding finding on the missing research/ artifact:

      just research-disorder claude_code IREB2-Related_Neurodegeneration

    Reconciliation of the sweep against the entry surfaced one genuine gap, which
    was curated; everything else the sweep cited was already present.

    PMID:22003390 (Jeong et al., PLoS One 2011, "Iron insufficiency compromises
    motor neurons and their mitochondrial function in Irp2-null mice") was absent.
    It was reachable from the sweep only as a bare PMC identifier in the
    bibliography (PMC3189198) with no PMID, and was resolved via the NCBI ID
    converter before being fetched.

    Added as a MODEL_ORGANISM SUPPORT item on the pathophysiology node
    "Mitochondrial Dysfunction from Iron-Sulfur Cluster and Haem Insufficiency".
    That node previously rested entirely on three IN_VITRO patient-cell studies,
    which establish mitochondrial dysfunction as a cellular phenotype but do not
    resolve which respiratory complexes are affected in nervous tissue. The new
    item measures Complex I and II activity directly in Irp2-null lumbar spinal
    cord. Complex I and II are the two complexes most dependent on iron-sulfur
    clusters, so the result is specific to the substrate-starvation mechanism the
    node proposes rather than to generic mitochondrial failure. Labelled mouse,
    not human, in the explanation.

    Also noted: the entry contained zero occurrences of "motor neuron" before this
    change, so the lower-motor-neuron dimension of the Irp2-null phenotype was
    previously unrepresented.

    Deliberately NOT added:
    - PMID:19800047 (DeMeo 2009, IREB2 as a COPD susceptibility gene at 15q25).
      This is the named NEC trap for this gene. The sweep itself quarantined it,
      labelling it a distinct entity driven by common noncoding variants versus the
      Mendelian rare-biallelic-coding syndrome curated here. Importing it would
      conflate two diseases.
    - PMID:24389303, which the sweep cites only as "PMID:24389303-adjacent
      literature" for a peripheral HIF2-alpha/IRE aside. The hedged phrasing means
      the sweep is not asserting the paper says this, so it cannot be snippet-
      verified against the claim it is offered for.

    All other sweep citations already resolve into the entry: PMC11372806 =
    PMID:39239479, PMC11587613 = PMID:39587636, PMC6487337 = PMID:30915432.

    Validation: check_snippets_verbatim.py 122 verified / 0 failed. Schema and
    term validation pass (run via the pre-edit validation hook). The
    references_cache churn from validation was reverted; only the new
    PMID_22003390.md cache file is committed.

    Two local-environment notes, neither a defect in this branch:
    1. The pre-edit validation hook initially blocked the edit claiming
       MONDO:0032758 was "not found in ontology". This was a false negative: the
       hook log shows an EBI read timeout followed by a cold re-download of the
       ontology databases. Verified independently with
       runoak -i sqlite:obo:mondo info MONDO:0032758, which returns the live term
       (NDCAMA, OMIM:618451, RO:0004003 to HGNC:6115 IREB2). The identical edit
       succeeded on retry once the databases were present. The term was not
       changed.
    2. check_snippet_length.py --against-ref origin/main reports one finding in
       kb/disorders/Pseudohypoparathyroidism.yaml, a file this branch does not
       touch. The branch carries a copy predating a fix on main. CI evaluates the
       PR merge result, where main's corrected copy wins, and CI is green. Local
       checks against an un-merged branch are stricter than CI here.

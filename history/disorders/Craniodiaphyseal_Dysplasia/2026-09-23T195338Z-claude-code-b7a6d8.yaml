  summary: 'Create: Craniodiaphyseal Dysplasia'
  details: |
    New entry for the autosomal dominant, SOST-related form of craniodiaphyseal dysplasia (MONDO:0021021). Deep research: one OpenScientist report, research/Craniodiaphyseal_Dysplasia-deep-research-openscientist.md (22 of 22 references resolved, none unresolved; term validation found no unresolved CURIEs but several HP identifiers named as different terms, so no CURIE was taken from the report; preflight-dr warned that SP7 content for the separate recessive form is mixed in, and that content was excluded). No GeneReviews or StatPearls chapter exists (check-genereviews --online). Pathograph: five pathophysiology nodes (SOST signal-peptide secretion defect, osteocyte unfolded protein response as an EMERGING mouse-based hypothesis group, loss of sclerostin restraint on Wnt signaling, excessive osteoblastic bone formation, progressive craniofacial hyperostosis with foraminal encroachment) reaching 20 HP-bound phenotypes, all causally connected. Genetics rest on Kim et al. 2011 (PMID:21221996); phenotypes rest on pre-molecular case reports that do not state a genotype, as recorded in the entry notes. Treatments are surgical and supportive; calcitriol with low-calcium diet is recorded with REFUTE evidence, and 4-phenylbutyrate is recorded as preclinical (mouse). Prevalence recorded as CASES_IN_LITERATURE / ULTRA_RARE. Validation: just validate-disorders passed (schema, terms, 51/51 snippets verified); causal-target, entity-ref, duplicate-key, snippet-length, title-snippet, snippet-grading, reference-title, coarse-phenotype and gene-term checks clean. Stub stubs/Craniodiaphyseal_Dysplasia_Autosomal_Dominant.yaml deleted.

  details: |
    Changes made in response to review of PR 12633. Added a diagnosis section with four records: radiographic skeletal survey (NCIT:C38101 X-Ray Imaging), temporal bone CT (NCIT:C17204), MRI (NCIT:C16809) and SOST sequencing (NCIT:C153598 DNA Sequencing), each quoting PMID:8733453, PMID:14530887 or PMID:21221996. Added an animal_models record for the osteocyte unfolded protein response transgenic mouse (PMID:28973168), linked to Unfolded Protein Response in Osteocytes (PERTURBS, LOW fidelity, CELLULAR) and Excessive Osteoblastic Bone Formation (PARTIALLY_RECAPITULATES, MODERATE fidelity, ORGANISM), with limitations stating that the model carries no SOST allele. On the bone-anchored hearing aid treatment, added the device as a qualifier: NCIT:C16830 Medical Device as predicate and NCIT:C185117 Bone-anchored Hearing Aid, found by an OLS search of ncit, as value; just check-qualifier-terms-online passed. Rewrote the PMID:8733453 explanations on choanal stenosis, the choanal and lacrimal surgery treatment and the calcitriol treatment to state that Cases 1 and 2 of that mixed series are the craniodiaphyseal dysplasia cases; the full text confirms both had choanal stenosis and both received calcitriol with a low-calcium diet. Added Osteosclerosis of ribs (HP:0006634) and Clavicular sclerosis (HP:0100923), both quoted from the CDD row of the PMID:8733453 radiological table and wired from Excessive Osteoblastic Bone Formation. Short stature was not added: the only source is a single case report (PMID:17456942) with no stated mechanism, so it could not be wired causally from evidence. PMID:14564212 was not used for clavicle sclerosis because that adult patient tested negative for SOST mutations. Validation: just validate-disorders passed with 61/61 snippets verified; 22/22 phenotypes causally connected; causal-target, entity-ref, duplicate-key, enum, qualifier, coarse-phenotype, snippet and reference-title checks clean.

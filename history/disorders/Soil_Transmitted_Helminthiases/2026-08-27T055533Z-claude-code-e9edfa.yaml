  details: |
    Addressed the Soil_Transmitted_Helminthiases row of curation-scanner issue #6309 (parasitic disorders content-gap tracker). The entry previously modeled only hookworm blood-feeding anemia; Ascaris, Trichuris, and Strongyloides had no species-specific pathophysiology despite being listed as infectious_agent entries. Picked the Trichuris trichiura sub-gap (dysentery/blood-loss mechanism + rectal prolapse) as a single bounded addition, sourced from a single new reference (PMID:40258770, a 2025 pediatric case-report/literature-review in Medicine) to keep fabrication risk low: added a new pathophysiology node (Trichuris colonic mucosal invasion causing mechanical/chemical injury and chronic blood loss, quantified at ~0.005 mL/worm/day), a second evidence item on the existing Anemia phenotype attributing it to Trichuris as well as hookworm, and a new Rectal Prolapse phenotype (HP:0002035, frequency intentionally omitted -- sourced from a case report, not a cohort estimate). Left the remaining Soil_Transmitted_Helminthiases gaps (Ascaris Loeffler pneumonitis/obstruction, Strongyloides autoinfection/hyperinfection, ivermectin/MDA treatment) open for a future tranche, and left Chagas_Disease/Babesiosis/other unclaimed #6309 rows untouched. Ran just validate, count-verified-snippets (14/34 verified, 20 skipped by prefix), validate-terms, the full check-* gate set (duplicate-keys, entity-refs, snippet-length, title-snippets, snippet-grading, folded-hyphens, not4curation), check-term-cache-integrity, check-cache-order, the batched validate-disorders sweep, and pytest -k Helminth (18/18) -- all pass.

  details: |
    Responded to the claude-code-review CHANGES_REQUESTED on PR #9634. (1) Split the bundled 'Trichuris Mucosal Invasion and Chronic Blood Loss' node into three atomic nodes (anterior-end embedding -> colonic mucosal mechanical and chemical injury -> chronic intestinal blood loss) connected by downstream edges terminating on the Anemia phenotype, so the whipworm arm is no longer a disconnected dot in the pathograph. (2) Re-sourced the Rectal Prolapse phenotype: PMID:11386693 (Stephenson, Holland, Cooper; Parasitology 2000) names rectal prolapse as a component of Trichuris dysentery syndrome and is now the primary DIRECT evidence. The original PMID:40258770 case report is retained as an INDIRECT supporting case observation, with an explanation recording that the burden was a single 1.5 cm worm, that albendazole did not resolve the protrusion, and that occasional prolapse persisted at 2-year follow-up. (3) Widened the first mechanism snippet to the full source sentence so it covers the burrowing claim the node makes. (4) Added the missing reference_title to the 0.005 mL/d evidence item and matched preferred_term casing to the HP label. Merged origin/main into the branch to pick up the #7439 evidence-enum change, which supplied the directness slot used above. Validated with just validate, count-verified-snippets, validate-terms, check-entity-refs, check-duplicate-keys, check-snippet-length, check-title-snippets and check-snippet-grading.

  details: |
    Content-gap follow-up from issue 6309 (Soil_Transmitted_Helminthiases item). Added: an environmental corticosteroid-exposure entry (ECTO:0000173) that TRIGGERS a new Strongyloides hyperinfection node; pathophysiology nodes for nematode larval migration through the lungs, the Strongyloides autoinfection cycle, and Strongyloides hyperinfection and dissemination; phenotypes Eosinophilic pneumonia (Loeffler syndrome, HP:0032071), Eosinophilia (HP:0001880) and Bacteremia (HP:0031864), each wired from a mechanism node; and an ivermectin treatment (CHEBI:6078) targeting the hyperinfection node. New references PMID:35396957, PMID:30712758, PMID:16612768 and PMID:41161022 were fetched with just fetch-reference; all 55 snippets verify against the cache and validate-terms passes. Also removed four deep-research findings in the references block whose supporting_text was only the paper title (DOI:10.1016/j.ijpddr.2024.100570, DOI:10.1016/j.lanwpc.2023.100974, DOI:10.1038/s41598-024-73164-7, DOI:10.1371/journal.pntd.0009422). They failed reference validation on main (two caches have no content, two titles are not in the cached text) and a title is not a finding; the reference records themselves are kept. validate-disorders now passes.

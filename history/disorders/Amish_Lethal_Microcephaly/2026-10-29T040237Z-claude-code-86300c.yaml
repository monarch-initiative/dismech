  summary: 'Create: Amish_Lethal_Microcephaly'
  details: |
    New entry for Amish lethal microcephaly (MONDO:0011790), caused by the homozygous SLC25A19 c.530G>C (p.Gly177Ala) founder variant in the mitochondrial thiamine pyrophosphate (ThPP) carrier. The pathograph runs from carrier deficiency to mitochondrial ThPP depletion, then to 2-oxoglutarate dehydrogenase dysfunction (2-oxoglutaric aciduria; impaired prenatal CNS development leading to microcephaly, lissencephaly, vermis hypoplasia, callosal agenesis, spinal dysraphism, developmental delay and seizures) and a hypothesised pyruvate dehydrogenase insufficiency (lactic acidosis). An illness-triggered decompensation node conforms to metabolic_intoxication_decompensation#Acute Metabolic Decompensation and is triggered by intercurrent viral illness. Primary sources: Kelley 2002 (PMID:12376931), Rosenberg 2002 (PMID:12185364), Lindhurst 2006 knockout mouse and ThPP transport (PMID:17035501), Siu 2010 long-term survivor (PMID:20583149), and the GeneReviews chapter SLC25A19-Related Thiamine Metabolism Dysfunction (PMID:20301539, tagged GeneReviews), which is the phenotype and management baseline. THMD4 (bilateral striatal necrosis with polyneuropathy) is kept as a separate disease and the reasoning is in notes. Thiamine is recorded with its GeneReviews recommendation but flagged as untested in this phenotype, with a KNOWLEDGE_GAP discussion; a HUMAN_MODEL_MISMATCH discussion records that the null mouse dies at E12 with a neural-tube defect and cannot show microcephaly. One OpenScientist deep-research report was used (research/Amish_Lethal_Microcephaly-deep-research-openscientist.md): 14/14 references resolved, needs_review set by term mislabels (HP:0045051 offered for 2-oxoglutaric aciduria is Decreased DLCO; CHEBI:9533 offered for ThPP; HGNC:12782 written beside SLC25A19 is WNT3; the correct gene CURIE is hgnc:14409). No report CURIE was copied; every term was looked up in OLS or the term caches. From the report I added PMID:33544541 (cDNA position and thiamine response in THMD4), PMID:28706281 (Slc25a19 knockdown in rat neurons) and PMID:17975804 (differential diagnosis). Not used: PMID:34532947 (Plain-community founder research overview, no disease-specific claim needed), PMID:14598172 (SLC25 family review, no claim needed), PMID:31295743 (THMD4 cases). just preflight-dr exited 2 because the local MONDO build is absent; the report was checked by hand and names SLC25A19 throughout. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), entity-ref, causal-target, coarse-phenotype, logical-rule, snippet-grading, snippet-length, title-snippet, duplicate-key and block-scalar gates, and validate-disorders.

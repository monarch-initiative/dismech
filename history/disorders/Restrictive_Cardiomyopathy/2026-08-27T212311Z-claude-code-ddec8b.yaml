  summary: Extend Restrictive Cardiomyopathy with the familial arm (MONDO:0016340)
  details: |
    Curated MONDO:0016340 (familial restrictive cardiomyopathy) for issue #8967.

    Concept decision. The issue was filed when no disease-level restrictive
    cardiomyopathy entry existed; one was created in the interim
    (kb/disorders/Restrictive_Cardiomyopathy.yaml, anchored MONDO:0005201) and
    already scoped its `notes` to the primary/heritable sarcomeric-cytoskeletal
    form. The familial arm was therefore curated into that entry rather than as a
    second file, and MONDO:0016340 recorded as a `skos:narrowMatch` in
    `mappings.mondo_mappings` with a written justification and a MONDO consistency
    record. A Grouping was considered and rejected: unlike the sibling
    Familial_Hypertrophic_Cardiomyopathy and Familial_Dilated_Cardiomyopathy
    groupings, which unite many pre-existing numbered Disease entries, none of
    RCM1-RCM6 is a curated Disease entry here, so the union would have no members.

    Named Entity Confusion preflight. `just preflight-dr` returned SKIP because
    MONDO records no RO:0004003 causal gene for MONDO:0016340 - correctly, since
    it is a `disease_grouping` term (OMIMPS:115210). Fell back to the manual
    check: the report's gene frequencies (FLNC 30, TNNI3 18, TNNT2 9, MYPN 7,
    MYH7 6) are the RCM phenotypic-series gene set, and the report's OMIM
    references are consistent with the MONDO xrefs. No confusion found.

    What was added. Two `has_subtypes` bound to numbered MONDO entities - RCM1
    (TNNI3, MONDO:0007270) and RCM3 (TNNT2, MONDO:0012900). Four new `genetic`
    records with human evidence (ACTC1, DES, FLNC, MYPN) and human evidence added
    to the pre-existing TNNI3 and TNNT2 records, including a TNNI3
    `case_fractions` entry (61% of 185 children, PMID:41219744). A new CELLULAR
    pathophysiology node for cardiac fibroblast stiffening and
    fibroblast-cardiomyocyte crosstalk (PMID:36174041), curated as a parallel
    amplifier because it acts on diastolic function independently of the
    myofilament and covers the majority of patients with no sarcomere variant. A
    `progression` record quantifying the pediatric course. Four
    `differential_diagnoses` establishing the boundary against acquired
    infiltrative restrictive physiology, two of them MONDO-bound. An
    `experimental_models` entry for the FLNC patient-derived engineered cardiac
    tissue system with two readouts, and the trequinsin PDE3 screening hit
    recorded as an explicitly preclinical lead rather than a treatment.

    Scoping decisions recorded in the entry rather than left silent. The issue
    asked for a `has_subtypes` arm per gene. FLNC's RCM5 is a MONDO synonym of
    CMH26 and is curated in Hypertrophic_Cardiomyopathy_26; MYPN's RCM4 is a
    synonym of MONDO:0014100, an open nomination as a dilated cardiomyopathy in
    stubs/Dilated_Cardiomyopathy_1KK.yaml; ACTC1 and DES have no numbered MONDO
    entity to bind a `subtype_term` to; RCM2 and RCM6 have no causal gene named in
    anything cached here. Those four arms are curated in `genetic` instead, with
    the reason stated in the entry `notes`.

    Existing discussions narrowed, not closed or deleted. The
    HUMAN_MODEL_MISMATCH `rcm_mechanism_is_model_organism_weighted` now records
    the two human-cell measurements added (PMID:36921598 engineered tissue against
    a CRISPR-corrected isogenic control; PMID:36174041 patient fibroblast
    rheology) while stating that neither is a measurement in human myocardium, so
    the translational question stands. The KNOWLEDGE_GAP
    `rcm_tnni3_myh7_restrictive_evidence_absent` had its TNNI3 and TNNT2 halves
    closed by human cohort evidence and now attaches to `genetic#MYH7` only; the
    discussion_id was deliberately left unchanged so external references resolve.

    Validation. `just validate` (schema, terms, references) and
    `just validate-disorders` both passed; 42/42 snippets verified against cached
    references; `just check-duplicate-keys` and `just check-title-snippets` clean.
    All reference cache files were produced by `just fetch-reference`; no cache
    file or cache CSV row was hand-written.

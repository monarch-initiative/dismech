  summary: 'Create: Restrictive Cardiomyopathy (genetic/sarcomeric)'
  details: |
    Curated a dedicated Restrictive Cardiomyopathy entry (MONDO:0005201), the third classic cardiomyopathy pattern, previously absent. Scoped to primary/heritable sarcomeric-cytoskeletal RCM (TNNI3/TNNT2/MYH7/ACTC1/MYL3/DES) whose restrictive filling is the final common pathway of increased myofilament tension and myocardial stiffness; conforms to cardiomyopathy_maladaptive_remodeling. Infiltrative RCM (amyloid/storage) out of scope. Evidence currently model-organism-weighted (Drosophila TnT, mouse MYL3 E143K). All snippets verified; full validation passes.

  summary: 'Review response: FLNC evidence and human phenotype curation'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 9763. (1) The genetic FLNC record cited PMID:26666891 with abstract background prose that never mentions FLNC and attributes familial RCM to sarcomere proteins; FLNC is a Z-disc actin cross-linker. Replaced with the sentence reporting the two segregating missense variants, added the paper's own conclusion sentence, and rewrote the explanation accordingly. (2) The phenotypes section held three entries supported only by MODEL_ORGANISM evidence. Added human clinical evidence to all three and added six phenotypes quantified in the PR's own caches: left and right atrial enlargement (HP:0031295, HP:0030718 - HPO has no single biatrial term), hepatomegaly 67 percent, fatigue 68 percent, peripheral edema 41 percent, dyspnea 41 percent, all from the 185-patient Chinese national pediatric cohort PMID:41219744 Table 1, with frequency bands carried by their own quantitative snippets. (3) Non-blocking suggestions: re-sourced two background-quoting fibroblast-node items to that paper's RNA-seq finding and conclusion, moved the genotype-negative claim to a HUMAN_CLINICAL cohort source, corrected the amyloidosis differential snippet to the case definition the distinguishing feature turns on, added Dong 2024 PMID:39472949 to the FLNC record, recorded the PROMISE PDE3 mortality caveat PMID:1944425 as REFUTE on the trequinsin record, and added an antithrombotic treatment record plus two observational clinical trials. Validation: schema, terms, duplicate keys, snippet length, title snippets, and the batched validate-disorders sweep.

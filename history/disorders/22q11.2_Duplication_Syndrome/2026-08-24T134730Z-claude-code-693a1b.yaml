  summary: 'Create: 22q11.2 Duplication Syndrome'
  details: |
    Created chromosome 22q11.2 microduplication syndrome (MONDO:0012020), the reciprocal copy-number gain of the 22q11.2 deletion, from PMID:18707033 (Wentzel clinical variability) and PMID:34845825 (Bartik cohort). Modeled LCR22A-D duplication, TBX1 dosage increase (HYPERMORPHIC), markedly reduced penetrance (inheritance from minimally affected parents), and management per 22q11.2 deletion guidelines. Schema + term validation pass; 10/10 snippets verified.

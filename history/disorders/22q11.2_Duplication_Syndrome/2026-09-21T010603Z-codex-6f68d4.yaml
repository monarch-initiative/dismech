  summary: Review proximal 22q11.2 duplication mechanisms and clinical evidence
  details: |
    Comprehensive review against both previously cited abstract caches (PMID:18707033 and PMID:34845825), the newly fetched and read full-text cohort PMID:27158440 (methods, results, Tables 4-5, screening discussion), and full-text nested-duplication study PMID:30614210 (regional comparison and mechanistic limitations). Also inspected the cached duplication-specific section of immunological practice guideline PMID:36648576. GeneReviews index identified retired chapter PMID:20301749; fetched and mined all four clinical domains while marking its historical status. No matching duplication deep-research artifact exists; reciprocal-deletion reports were excluded as a different disease. Fixed unsupported TBX1 HYPERMORPHIC attribution and direct phenotype edges, corrected diagnosis evidence, removed unsupported palatal frequency, separated genomic rearrangement events and unresolved gene-to-phenotype intermediates, and expanded from four to twenty-five phenotypes using clinical or table evidence with cohort denominators. Added medical screening, educational support, counseling, and documented ENT interventions, without inferring trial efficacy. Specific learning disability binding removed because the cited general learning-difficulty wording does not establish a specific academic disorder. Central nested duplications are comparative evidence, not pooled clinical-frequency estimates. A separate peer audit confirmed the cohort denominators and candidate-gene limitations and prompted specific velopharyngeal-insufficiency and bifid-uvula annotations plus child-specific screening wording. Titles copied from cache. Authoritative just validate-disorders passed schema, ontology-term, and reference validation with 64/64 snippets verified. GeneReviews baseline check reports the retired chapter tagged. Targeted duplicate-key, entity-reference, causal-target, qualifier-term, and history validation checks passed; git diff --check was clean.
    Follow-up after independent automated approval: harmonized the GeneReviews management evidence source, added the supported hypocalcemia band, connected the two specific palate findings with unresolved intermediates, and replaced the partial tonsillectomy binding with NCIT:C51684 Tonsillectomy with Adenoidectomy found by OLS search for tonsillectomy adenoidectomy. Added recurrent anemia, thrombocytopenia, and neutropenia from the cohort table with individual counts, retaining observational status without asserting a gene-specific causal route.

  summary: 'Create: Mandibular Hypoplasia, Deafness, Progeroid Features, and Lipodystrophy
    Syndrome'
  details: |
    New entry for MDPL (MONDO:0014157), POLD1, autosomal dominant and mostly de novo. Phenotype baseline from the original clinical series (PMID:20631028), the gene-discovery paper (PMID:23770608) and the 2026 pooled genotype-phenotype comparison (PMID:41742372), whose p.Ser605del column supplies the phenotype frequencies; no GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). Pathophysiology is a chain from the POLD1 polymerase active-site defect through impaired DNA replication and repair, telomere attrition, nuclear envelope abnormalities and mitochondrial dysfunction to premature cellular senescence, grouped under an EMERGING mechanistic hypothesis because the link from cellular senescence to adipose, muscle, bone and facial phenotypes is proposed rather than demonstrated; those edges carry directness INDIRECT. Deafness, mandibular hypoplasia and male hypogonadism are linked to the molecular lesion by genetic causation only. ClinGen Definitive (AD) copied from the CGGV record. One openscientist deep-research report was used as leads: 17/17 references resolved, 17/18 quotes matched (the miss is an ellipsis-elided form of a real sentence in PMID:41742372), preflight-dr PASS. From it, PMID:35356184 (pancreatitis) and PMID:37794082 (metreleptin, pooled lipodystrophy evidence, marked INDIRECT) were added. Its ORPHA:280356 suggestion was not used; MONDO xrefs ORPHA:363649. Term lookups caught two wrong MONDO CURIEs before commit (MONDO:0016319 is not mandibuloacral dysplasia; MONDO:0100351 is obsolete, replaced with MONDO:0012953). PMID:29199204 could not be fetched from NCBI and is not cited. Validated with just validate, validate-terms, count-verified-snippets (all verified) and validate-disorders.

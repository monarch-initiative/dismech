  summary: 'Review round 1: Mal_de_Meleda'
  details: |
    Addressed the review of PR 14258. Added an edema of the hands and feet phenotype (FREQUENT, 60% in the Anatolian series, PMID:12592079) bound to HP:0012398 Peripheral edema, since HPO has no single hand-and-foot edema term; it has no causal in-edge because no source gives a mechanism. Regraded the PMID:20854438 PBMC T-cell activation snippet from HUMAN_CLINICAL to IN_VITRO in both places it is used (patient cells stimulated in culture); the melanoma statement from the same paper stays HUMAN_CLINICAL. Added Papillon-Lefevre syndrome (MONDO:0009490) as a second differential from the PMID:38903266 sentence that names it. Added sclerosis of the digital skin (HP:0011838 Sclerodactyly) and skin atrophy (HP:0004334 Dermal atrophy) from PMID:28885351 and the PMID:41048964 introduction, connected as sequelae of the flexion contractures because PMID:28885351 attributes the atrophic, sclerotic skin to long-term contractures. Not taken: evidence for the two uncited differentiation edges, because no cached source states that the differentiation defect causes the hypergranulosis or hyperkeratosis; Z-plasty release of pseudoainhum, because PMID:39509536 reports it in a Vohwinkel syndrome patient and no Mal de Meleda source was found. Checks: validate, validate-terms, count-verified-snippets (all verified), check-entity-refs, check-causal-targets, check-snippet-grading, check-snippet-length, check-title-snippets, check-coarse-phenotypes, validate-disorders.

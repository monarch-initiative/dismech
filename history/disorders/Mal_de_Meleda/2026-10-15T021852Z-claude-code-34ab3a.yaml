  summary: 'Create: Mal_de_Meleda'
  details: |
    New entry for Mal de Meleda (MONDO:0009552), the autosomal recessive transgredient diffuse palmoplantar keratoderma caused by biallelic SLURP1 (hgnc:18746) loss of function. Sources: Orphanet ORPHA:87503 structured record, the SLURP1 gene-discovery and founder-allele papers (Algerian, Croatian, Tunisian, Turkish, German, Palestinian, Taiwanese, Swedish families), keratinocyte alpha7 nicotinic receptor studies of SLURP-1, the Slurp1 knockout mouse papers (PMID:24499735, PMID:28418591, PMID:38866482), and clinical case reports for phenotypes, cancers and treatment. Deep research: the OpenScientist report (research/Mal_de_Meleda-deep-research-openscientist.md) was used as leads; 25/25 references resolved; just preflight-dr PASS. Its term-validation section flagged HP:0100648 (Neoplasm of the tongue) offered for pseudoainhum and HP:0000973 (Cutis laxa) for perioral erythema, and the body gives SLURP1 as HGNC:11827; none of these were used (bindings HP:0010491, HP:0033194 and hgnc:18746 were looked up independently). The report also cites PMID:26905431, which characterises recombinant SLURP-1 as an allosteric antagonist of alpha7 receptors rather than a potentiator, so the receptor node is worded as loss of modulation with modifier DYSREGULATED and cites both views. Lump/split: the Gamborg-Nielsen (Norrbotten) type, MONDO:0009489, is recorded as a has_subtypes entry because SLURP1 sequencing shows it is allelic (PMID:24604124) and Orphanet has moved its record into Mal de Meleda; the autosomal dominant SLURP1 PPK/PSEK (PMID:39913669, PMID:40023748) is a distinct allelic disorder and is noted as out of scope. Keratoderma hereditarium mutilans is listed only as a sourced differential. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Six phenotypes (hyperhidrosis, pruritus, lichenoid plaques, nail abnormalities, brachydactyly, tapered fingers) are left without causal in-edges because no source states their mechanism. Validation: just validate, validate-terms, count-verified-snippets (all verified), check-entity-refs, check-causal-targets, check-snippet-length and validate-disorders.

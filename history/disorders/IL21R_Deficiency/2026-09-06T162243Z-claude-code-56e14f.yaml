  summary: 'Create: IL21R Deficiency / immunodeficiency 56 (MONDO:0014082)'
  details: |
    De novo curation of IL-21R deficiency (immunodeficiency 56).

    Lump/split: DISEASE. MONDO leaf, one causal gene. IL21R appears in Asthma, Crohn_Disease and Rheumatoid_Arthritis as a susceptibility/pathway gene and in Immunodeficiency_88 only as a downstream TBX21 target; none curates it as a causal Mendelian gene, so this is not a duplicate.

    Naming: filed as IL21R_Deficiency rather than the MONDO clinical label, matching the GATA2_Deficiency convention. The MONDO label is carried as disease_term.preferred_term and in synonyms.

    Two-factor structure is the point of the entry. Neither the IL21R genotype nor Cryptosporidium exposure produces the defining cholangiopathy alone, so the exposure is modelled as an environmental[] entry with influences_mechanisms (environmental_effect: TRIGGERS) into the 'Failure to Clear Cryptosporidium from Biliary Epithelium' node, rather than described in prose.

    exposure_term deliberately left unbound with the search recorded in review_notes: ECTO has no term naming Cryptosporidium or a protozoan pathogen, and the nearest term (ECTO:7000119 exposure to contaminated water) asserts a transmission route none of the cited sources establishes in these patients. check-environmental-evidence passes because the entry carries real evidence.

    Treatment evidence is deliberately hedged. Post-HSCT survival is 33.3% in six patients against 42.9% in seven non-transplanted. That is not a demonstration of benefit. The cohort authors attribute it to pre-existing organ damage, which is plausible, but with those numbers and no stage matching the comparison cannot separate procedure from timing. A discussion entry states this plainly rather than the entry asserting efficacy.

    Deep research: one openscientist report. preflight-dr WARN, resolved manually: the 'rival gene STAT3' flag is a false positive (STAT3 is the downstream signalling molecule this entry cites as such, not a second disease entity), OMIM 615207 matches MONDO both ways, and IL21R is mentioned 23 times as the causal gene. 13/13 references resolved.

    Schema notes: ProgressionInfo has no 'description' slot (use age_range/notes), and TreatmentMechanismTarget.treatment_effect has no CORRECTS value (RESTORES is the correct one). Both were caught by schema validation.

    Validation: just validate passes schema plus 38/38 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-environmental-evidence all pass.

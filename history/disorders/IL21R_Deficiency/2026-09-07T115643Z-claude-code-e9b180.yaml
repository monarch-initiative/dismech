  summary: 'Review round 1: widen two over-narrow bindings, add the supportive mainstay,
    remove a derived statistic on a self-contradicting source'
  details: |
    Addressed all four IMPORTANT findings from the first review of PR 11244. The reviewer identified a single root cause for all of them: the entry was curated against the abstract of PMID:33929673 while this PR caches its full text, so the missing content was quotable from a file already on the branch. Added three phenotypes above the ten percent threshold: inflammatory abnormality of the skin at 15.3 percent, which the authors name as a novel phenotype of the disorder, bronchiectasis at 46.2 percent, and failure to thrive from the case description in PMID:23440042 without a frequency band because the support is case-level. Added the supportive mainstay that was entirely absent: immunoglobulin replacement with trimethoprim-sulfamethoxazole prophylaxis, given to all patients in the cohort, with a target_mechanisms link marked BYPASSES to the class-switching node because replacement substitutes for antibody rather than repairing the defect. Also added clarithromycin, graded REFUTE because liver disease progressed despite it, which is a negative therapeutic result and supports this entry's thesis that failure to clear the organism is the crux; and avoidance of live rubella vaccination as a management caution, left with an unbound treatment_term because no NCIT clinical action term names an avoidance. Widened two ontology bindings that were narrower than the sentences supporting them: HP:0004315 decreased circulating IgG concentration to HP:0004313 decreased circulating immunoglobulin concentration, since the source says hypogammaglobulinemia without naming an isotype, and removed the explanation sentence that had wrongly called the IgG term the closest validated match; and HP:0030388 decreased class-switched memory B cell proportion to HP:0030374 decreased memory B cell proportion, since the quoted sentence reports only reduced memory B cells. Removed the derived 42.9 percent survival figure. It was arithmetic on the abstract's 57.1 percent mortality and not a quantity any sentence states, and the same paper's full text gives 42.8 percent mortality for the same group, so the entry now quotes both conflicting figures verbatim on the transplant treatment and records the discrepancy in the discussion rather than resolving it silently. Took the suggestion to add PMID:30850087, a cohort of primary immunodeficiencies with sclerosing cholangitis in which the survivors had less severe cholangiopathy at transplant, graded directness INDIRECT because the cohort is not IL-21R specific; it is the strongest available evidence on the transplant-timing question this entry raises. Ran the GeneReviews search the reviewer could not run and recorded the negative result in notes. Validation: schema passes, 48/48 snippets verified (was 38/38), term validation passes, and the whole-KB gates were run.

  summary: 'Review round 2: fix inverted transplant comparison, split supportive mainstay'
  details: |
    Second review round on PR #11244. Blocking finding: the knowledge-gap rationale rewritten in round 1 to remove a derived survival figure introduced an inverted comparison, saying the untransplanted group did worse than the transplanted one on the abstract figure. Transplanted survival is 33.3%; untransplanted survival is 42.9% (abstract) or 57.2% (full text), so the untransplanted group fared better on both readings. Rewrote the clause. Also took the reviewer's reconciliation lead: the full-text 42.8% is qualified 'due to infectious complications' while the abstract's 57.1% is unrestricted, which is recorded as a lead rather than a resolution because Table 1 lists five deaths among the seven untransplanted patients and matches neither figure. Updated the two evidence explanations that had framed the pair as a bare self-contradiction. Split 'Immunoglobulin replacement and antibacterial prophylaxis' into two treatments, because therapeutic_modality is single-valued and the bundle dropped the antibacterial half's classification: IVIG now binds NCIT:C121331 (Intravenous Immunoglobulin Therapy, a valid TreatmentActionTerm) with PROTEIN_REPLACEMENT and keeps the BYPASSES link to the class-switching node, and TMP-SMX is a separate SMALL_MOLECULE treatment with therapeutic_agent NCIT:C909 and its own INHIBITS link to the Recurrent bacterial infections phenotype. Added therapeutic_agent CHEBI:3732 to the clarithromycin treatment. Added a second independent IVIG citation from PMID:23440042. Bound MAIT cells as CL:0000940 on the NK/T effector node, where they were previously only named in prose. Changed the sclerosing cholangitis node's biological_scale from ORGANISM to TISSUE, since the lesion is biliary-tract-scoped. Did not split that node; the reviewer flagged the split as non-blocking and it would break the existing downstream edge and its evidence. Validation: just validate passes, 51/51 snippets verified (was 48), entity-refs, causal-targets, duplicate-keys, enum-values and qualifier-terms all clean.

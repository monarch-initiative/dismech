  summary: 'Review: Scabies evidence re-read against cached sources'
  details: |
    Re-read every cached reference and re-verified all 18 evidence items. This entry needed
    manual verification more than most: 28 of its 34 references are DOI:, which the repo's
    snippet verifier skips entirely, so almost none of its snippets had ever been machine-
    checked. All 18 verified as exact substrings, including every DOI-backed one. Ontology
    bindings all check out.

    Recorded for follow-up:
    - Two references have no cache file anywhere in references_cache/ and their sole finding
      is the article title used as both statement and supporting_text:
      DOI:10.1111/bjd.19170 and DOI:10.3389/fimmu.2023.1128688. Both are contentless as
      recorded and unverifiable. Fix is to fetch the reference and quote something
      substantive, or drop the findings block and keep a bare bibliography entry.
    - evidence_source grading is internally inconsistent across the DOI items: two narrative
      reviews (DOI:10.3389/fitd.2024.1429266, DOI:10.3390/jcm13185511) are graded
      HUMAN_CLINICAL while two comparable Sharaf reviews are correctly OTHER, and a primary
      human cost study (DOI:10.1371/journal.pgph.0003706) is graded OTHER.
    - phenotypes[Pruritus] and phenotypes[Skin rash] both assert frequency: FREQUENT for
      scabies generally but are evidenced only by a crusted (Norwegian) scabies case report -
      the atypical variant, whose own cache says "The pruritus may be absent or severe".
    - Two snippets carry a PDF-extraction artifact ("burrowing miteSarcoptes scabiei") that is
      now KB text; both caches contain the cleanly spaced sentence a few lines later.
    - One cited reference is a medRxiv preprint, not marked as such.

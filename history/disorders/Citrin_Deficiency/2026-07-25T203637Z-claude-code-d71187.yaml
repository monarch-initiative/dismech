  summary: 'Review: separate carrier frequency from prevalence, add staged progression,
    surface protein-restriction contraindication'
  details: |
    Review of the fifth-oldest unreviewed disorder entry (creation_date
    2025-06-12).

    Carrier frequency recorded as prevalence (the principal finding). All three
    prevalence records were uncited, used the deprecated free-text percentage
    field ("Rare"), and two of them recorded a CARRIER frequency under
    prevalence: "carrier rates are approximately 1:42 to 1:65 in parts of Japan"
    and "carrier rate reported as approximately 1:65" for China, each tagged
    prevalence_class: RARE. These are different quantities separated by roughly
    the square of the allele frequency - a 1-in-62 carrier frequency corresponds
    to a disease prevalence on the order of 1 in 15,000, not 1 in 62 - and the
    schema has a dedicated CARRIER_FREQUENCY measure_type precisely to keep them
    apart. Neither figure, nor the Thai 1-in-33,000 incidence, could be traced to
    any reference cited anywhere in the entry.

    Replaced with three evidenced, correctly-typed records from a 2025
    comprehensive SLC25A13 variant analysis (PMID:40551388, fetched for this
    review): an East Asian CARRIER_FREQUENCY of 1 in 62 across 17,501 individuals
    in gnomAD/ToMMo, a Korean CARRIER_FREQUENCY of 1 in 86 across 7,214
    individuals in gnomAD/KOVA, and the Korean BIRTH_PREVALENCE of 1 in 29,502
    that the authors derive from it - kept as a separate record and explicitly
    labelled a modelled Hardy-Weinberg estimate rather than an ascertained count.
    The carrier records carry a note stating the distinction so the conflation is
    not reintroduced.

    Missing progression on a disease defined by its stages. The entry had no
    progression section at all, despite citrin deficiency being characterised
    almost entirely by its age-dependent sequence (NICCD -> FTTDCD -> CTLN2) and
    despite has_subtypes already encoding those three stages. Added three
    subtype-scoped evidenced phases from GeneReviews. Two points this surfaces
    that the entry did not previously state anywhere:
    - The post-infantile phase is conventionally called the "apparently healthy"
      or silent period, but GeneReviews documents poor weight gain, growth
      deficiency, severe fatigue, anorexia and impaired quality of life alongside
      dyslipidemia, recurrent hypoglycemia, raised lactate-to-pyruvate ratio and
      deviated TCA-cycle metabolites. The phase notes say plainly that it is not
      asymptomatic.
    - CTLN2 may present with no prior history of NICCD or FTTDCD. Absence of an
      infantile phase does not exclude the diagnosis - a diagnostic trap worth
      stating explicitly.

    Counterintuitive contraindication under-stated. The contraindication
    treatment was named and described for fructose and glycerol infusions only,
    yet quoted the full GeneReviews avoidance sentence, which also names
    LOW-PROTEIN, HIGH-CARBOHYDRATE diets and alcohol. The protein point is the
    important one and was invisible: protein restriction is the reflex management
    for hyperammonemia in urea cycle disorders, and applying that reflex to
    citrin deficiency makes it worse. The entry elsewhere describes the patients'
    protein- and lipid-rich food preference as a physiological adaptation but
    never connected that to the contraindication. Renamed the treatment,
    broadened the description, and rewrote the notes to state both traps: routine
    osmotic IV solutions can be fatal, and protein restriction is contraindicated.

    Phenotypes staged. Eight phenotypes assigned to their stage via the subtype
    foreign key (neonatal cholestasis, jaundice, conjugated hyperbilirubinemia
    and low birth weight to NICCD; dyslipidemia and abnormal food preference to
    FTTDCD; encephalopathy and pancreatitis to CTLN2). Phenotypes that genuinely
    span stages - hyperammonemia, hepatomegaly, hepatic steatosis, failure to
    thrive, hypoglycemia - were deliberately left unassigned rather than forced
    into one bucket.

    Subtype term precision. CTLN2 was bound to MONDO:0016603 "citrullinemia type
    II"; upgraded to its child MONDO:0011326 "citrullinemia, type II,
    adult-onset", which is what this subtype actually denotes, with the previous
    term retained as a skos:broadMatch mapping. FTTDCD has no subtype_term
    because MONDO has no class for it - the only MONDO descendants of citrin
    deficiency are NICCD, citrullinemia type II and its adult-onset child. That
    is recorded in review_notes as an ontology gap with an instruction not to
    substitute an adjacent term, rather than left looking like an omission.

    Evidence-source consistency. The same GeneReviews record (PMID:20301360) was
    tagged HUMAN_CLINICAL on 42 evidence items and OTHER on 6 within this one
    entry. GeneReviews is expert-consensus review rather than primary clinical
    data, so per the classification rules all 48 are now OTHER.

    Module conformance. Added three metabolic_intoxication_decompensation
    conformance edges (Enzymatic Block on the SLC25A13 node, Toxic Metabolite
    Accumulation and Energy Deficit on the malate-aspartate shuttle node, Acute
    Metabolic Decompensation on the impaired-ureagenesis node) with
    biological_scale tags.

    Tooling. MONDO:0011326 and MONDO:0016603 had to be appended to the
    DiseaseOrSubtypeTerm and DiseaseTerm enum caches - the same ols:mondo
    reachability limitation filed as issue #6989. Reachability was verified
    against sqlite:obo:mondo before appending; check-enum-cache-offline passes.

    Validation. Schema, term and reference validation all pass.

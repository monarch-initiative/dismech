  details: |
    Genetics pass for issue #12193 (d2g wiring-004). MONDO records SLC25A13 for both MONDO:0011601 (NICCD) and MONDO:0011326 (adult-onset citrullinemia type II). Both terms were already bound as has_subtypes rows and SLC25A13 was already curated and already reached the pathograph on the SLC25A13 transporter molecular function deficiency node, so this was an export-layer gap, not a curation gap: gene_to_edge reads only the entry's own disease_term, so subtype terms export no gene edge however well curated they are.

    What changed. Each of the three has_subtypes rows (NICCD, FTTDCD, CTLN2) gained its genes list naming SLC25A13. The genetic record gained relationship_type CAUSATIVE and variant_origin GERMLINE, plus a notes block explaining why it deliberately carries no subtype foreign key: NICCD, FTTDCD and CTLN2 are age-of-onset stages of one gene's disease, not genetically distinct subtypes, and both MONDO subtype terms record the same causal gene.

    Sourcing. The genetic features text asserted that SLC25A13 is located on chromosome 7q21.3 with no attached evidence. The statement is correct and the sentence supporting it was already in a cached reference this entry cites (PMID:40551388); it now carries its own evidence item quoting that sentence, so the figure is attached to a verbatim quote rather than standing on prose alone.

    Validation. just validate-pre-edit, count-verified-snippets 94/94, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean.

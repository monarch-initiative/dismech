  summary: 'Address code review: prevalence band, stale carrier figures, evidence_source
    revert, GeneReviews counseling'
  details: |
    Addresses the automated code review on PR #6991. All four blocking items
    were correct.

    Prevalence band misapplied (item 1). The Korean birth-prevalence record
    carried rate_per_100000: 3.39 with prevalence_class: BAND_1_5_PER_10000,
    which the schema and scripts/migrate_prevalence.py reserve for rates at or
    above 10 per 100,000. Corrected to BAND_1_9_PER_100000. This was the one
    record where the PR misapplied its own normalization logic - a good catch,
    since a wrong band is exactly the kind of error the structured slots exist to
    prevent.

    Stale uncited carrier figures (item 2). The PR removed "1:42 to 1:65 in
    Japan, 1:65 in China" from the prevalence section but left the same figures
    in genetic[0].features and in the top-level notes, so the entry asserted two
    different carrier stories in two places - a worse state than before the PR.
    The reviewer also pointed out that the newly added reference substantiates
    them, so they are now cited rather than deleted: PMID:40551388 gives 1/42 to
    1/69 for Japan and an approximate 1/45 disease-associated allele frequency in
    a large Chinese newborn-screening study, with 1/90 Thai and 1/112 Korean
    comparators. Both prose passages rewritten to those sourced figures, with a
    pointer to the prevalence section as the authoritative record, and two
    evidence items added to the genetic block.

    evidence_source normalization reverted (item 3). The PR flipped all 48
    GeneReviews evidence items from HUMAN_CLINICAL to OTHER, reasoning from the
    CLAUDE.md edge case for expert consensus without data. The reviewer is right
    that this made the entry a KB-wide outlier: a census of PMID:203* GeneReviews
    citations on main shows HUMAN_CLINICAL used essentially everywhere. A
    one-entry divergence is worse than either convention applied consistently, so
    all 48 are reverted to HUMAN_CLINICAL.

    The underlying inconsistency is real and predates this PR - the same
    GeneReviews record was tagged HUMAN_CLINICAL on 42 items and OTHER on 6
    within this single entry, which is what prompted the change - so it is now
    raised as issue #6997 rather than silently re-normalized per entry. That
    issue sets out both readings, recommends confirming HUMAN_CLINICAL and
    documenting it explicitly in the CLAUDE.md edge-case list, and notes the
    adjacent question for ORPHA and CGGV records.

    Claim-evidence mismatch and unmined GeneReviews section (item 4). An
    inheritance evidence item quoted the NICCD-manifestation sentence while its
    explanation claimed it "confirms the genetic basis and inheritance pattern" -
    the snippet described the clinical spectrum, not inheritance. Replaced with
    the actual GENETIC COUNSELING sentence ("Citrin deficiency is inherited in an
    autosomal recessive manner") and added a second item carrying the 25%/50%/25%
    recurrence-risk figures, which were previously unmined.

    Validation. Schema, term and reference validation all pass.

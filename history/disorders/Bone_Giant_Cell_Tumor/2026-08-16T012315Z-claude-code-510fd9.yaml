  summary: Attach embolization evidence flagged as stale note on re-review
  details: |
    Attached evidence to the Embolization Therapy treatment, which the re-review
    flagged as a non-blocking staleness introduced by the previous commit.

    The treatment's notes had recorded that no cached abstract stated the practice
    in quotable form, so the entry was deliberately carried without evidence under
    the evidence SOP. That was true when written. It stopped being true in the same
    commit: PMID:21045974, fetched to supply human evidence for the spinal-cord
    compression phenotype, also reports embolization use and outcomes in sacral
    GCTB. The note therefore asserted something false about the state of the cache
    it was describing.

    Three evidence items added, all verified against the cached abstract:
    - On the target_mechanisms link to Locally Aggressive Osteolytic Tumor Mass:
      "One sacral GCT patient was treated only with serial arterial embolization
      with good disease control." This is embolization as sole therapy, so it is the
      cleanest demonstration that devascularization acts on the mass node rather
      than merely assisting surgery.
    - On the treatment: the six-patient preoperative-adjunct group, documenting the
      standard adjunctive use.
    - On the treatment, as PARTIAL: the authors' conclusion that "conservative
      therapy involving arterial embolization and intralesional resection offers the
      best results." Recorded as PARTIAL rather than SUPPORT because the same
      abstract also concludes that en bloc resection should be preferred whenever
      possible; the statement is a qualified recommendation for the sacral subset,
      not a general one, and curating it as unqualified SUPPORT would overstate it.

    The notes block now records the lesson rather than the superseded claim: a "no
    evidence available" note can go stale the moment the reference cache grows, and
    should be re-checked rather than trusted. This is worth recording because the
    same pattern will recur - within a single curation pass, a reference fetched for
    one section routinely turns out to cover another.

    No approval-preservation shortcut was taken. Pushing this drops the approval the
    re-review had just granted and costs another review cycle, which is the accepted
    cost of not shipping a statement known to be false.

    Validation: just validate, just validate-terms, and the full batched
    just validate-disorders sweep all pass; 147/147 snippets verified against cached
    references (was 144/144); compliance 96.4 percent global / 96.4 percent
    weighted. Folded-hyphen, snippet-length, and title-snippet gates clean. No new
    reference caches were needed - PMID:21045974 was already committed.

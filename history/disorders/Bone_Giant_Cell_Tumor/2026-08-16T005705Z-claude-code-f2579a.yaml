  summary: 'Address review on PR 8582: human evidence, Paget subset, trials, staging'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #8582 - both
    blocking items and all four suggestions.

    IMPORTANT 1 - human phenotypes supported only by a canine case report.
    "Secondary Aneurysmal Bone Cyst Change" (HP:0012063) and "Spinal Cord or Nerve
    Root Compression" (HP:0002176) each cited only PMID:41908959 with
    evidence_source MODEL_ORGANISM, violating the CLAUDE.md rule that model-organism
    evidence must not be the sole support for a human phenotype. Added human
    citations to each and retained the canine observation as a labelled second item:
    PMID:23708046 (human GCT with secondary ABC, multiple fluid-fluid levels on MRI)
    and PMID:21139758 (imaging review, haemorrhagic complication) for the ABC
    phenotype; PMID:21045974 (23-case spine and sacrum series - neurologic deficit
    a usual presenting feature) and PMID:29745092 (30-case sacral GCT cohort scoring
    sacral nerve deficit as a denosumab endpoint) for cord compression. The candid
    notes block explaining the model-organism-only citation was removed because it
    no longer describes the entry.

    Note on a rejected candidate: PubMed relevance search surfaced PMID:33596487
    for spinal disease, which is spinal pigmented villonodular synovitis and
    tenosynovial giant cell tumour - the same-name-different-entity trap this entry
    already curates as a differential. Rejected rather than cited.

    IMPORTANT 2 - Paget-associated familial subset absent while the header asserted
    no inheritance. Resolved both ways rather than either/or. The header notes now
    scope the claim explicitly to conventional sporadic GCTB and state why the
    subset is out of scope; and the theme is consumed as a new KNOWLEDGE_GAP
    discussion (gctb_paget_associated_familial_subset) carrying three verified
    PMID:25196811 snippets (increased GCT risk in PDB; ~50% versus 0-5% five-year
    mortality; 24.8% multifocal) plus a proposed experiment to genotype H3-3A codon
    34 and sequence germline DNA in the subset. The honest open question is recorded:
    the literature does not report whether PDB-associated GCT carries the G34W
    driver at all, so it cannot yet be said whether it is the same disease on a
    permissive background or a mechanistically separate entity sharing a
    histological name.

    SUGGESTION 3 - added a clinical_trials block: NCT00680992 (pivotal denosumab
    phase 2), NCT00889590 (adjuvant zoledronic acid), NCT05595603 (zoledronic-acid-
    loaded bone cement). All three fetched via just fetch-reference and cited with
    verified snippets from the ClinicalTrials.gov summaries.

    SUGGESTION 4 - added a stages block for Campanacci I/II/III and a diagnosis
    block for the radiographic signature. Grade III carries evidence for the
    curettage-versus-resection flip (PMID:22773395), the pulmonary-implantation
    association (PMID:28443231 - all 46 lung-metastasis tumors were stage 3), and a
    PARTIAL item qualifying the rule (PMID:20934816 - single-site cortical
    perforation can still be managed intralesionally). The diagnosis block cites
    PMID:21139758 three times for location, margin/matrix, and skeletal maturity,
    with a notes line stating that imaging narrows but does not close the
    differential.

    SUGGESTION 5 - rebound the differentiation-arrest node's cell type from
    CL:0000062 osteoblast to CL:0000134 mesenchymal stem cell. The reviewer is
    right that binding the mature identity on a node whose claim is that
    differentiation is arrested short of it was self-contradictory; CL:0000375
    osteoprogenitor cell is obsolete, so the mesenchymal anchor already used on the
    trigger node is the correct substitute.

    SUGGESTION 6 - reworded three edge explanations that referenced a PROVISIONAL
    designation as though it sat on the edge; they now reference the
    mechanism_confidence on the target node, which is where it actually is.

    Validation after changes: just validate, just validate-terms, and the full
    batched just validate-disorders sweep all pass; 144/144 snippets verified
    against cached references; compliance 95.7 percent global / 95.7 percent
    weighted (denominator grew with the new blocks). Folded-hyphen, snippet-length,
    and title-snippet gates clean. tests/test_data.py subset of 10,237 tests passes.

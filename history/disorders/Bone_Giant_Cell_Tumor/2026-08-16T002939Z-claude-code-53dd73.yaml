  summary: 'Create: Bone Giant Cell Tumor'
  details: |
    Created kb/disorders/Bone_Giant_Cell_Tumor.yaml (MONDO:0005674) from a
    claude_code deep-research run plus independent primary-literature verification.

    Model: giant cell tumor of bone as a paracrine neoplasm. Twelve pathophysiology
    nodes trace the somatic H3-3A p.Gly34Trp oncohistone through genome-wide
    epigenetic reprogramming, arrested osteogenic differentiation of the neoplastic
    stroma, two parallel routes to osteoclast recruitment (enhancer-level SCUBE3
    de-repression and stromal RANKL overexpression), fusion of reactive
    osteoclast-like giant cells, a deliberate SEMA4D feed-forward cycle back onto
    the mutant stroma, excessive resorption, the osteolytic mass, and the three
    downstream outcomes (local recurrence, pulmonary implantation, malignant
    sarcomatous transformation). All 14 causal edges carry their own evidence.

    Two nodes declare conforms_to against osteoporosis_bone_resorption
    (RANKL-Driven Osteoclastogenesis; Increased Osteoclastic Bone Resorption) -
    the first module conformance in this curation series.

    Denosumab is wired by target_mechanisms to the RANKL node and to the giant-cell
    node it depletes; zoledronic acid to the stromal node instead, since cell-line
    data show it kills the compartment denosumab does not touch. That asymmetry is
    also the mechanistic basis of the curated denosumab-withdrawal CONTROVERSY.

    Discussions: KNOWLEDGE_GAP (no in vivo G34W knock-in model exists; every step of
    the paracrine loop rests on culture systems), HUMAN_MODEL_MISMATCH (the only
    naturally occurring animal case, a canine vertebral tumor, is G34W-negative by
    immunohistochemistry - three readings enumerated, none resolvable without
    sequencing), and CONTROVERSY (denosumab and post-curettage recurrence).

    Deep-research handling. The report's own reference_validation block reported
    48/48 identifiers resolved but 0/4 quoted claims exact, so every DR-supplied
    quote was discarded and re-derived from cached abstracts. Three specific DR
    errors were caught and corrected: MONDO:0018219 (does not exist; correct term is
    MONDO:0005674, confirmed by matching Orphanet:363976 xref), PMID:23955596 for
    Behjati et al. (correct PMID is 24162739), and NCIT:C77012 for denosumab
    (correct term is NCIT:C61313). Two suggested ontology terms proved obsolete on
    lookup and were not used: CL:0000375 osteoprogenitor cell and GO:0070734 histone
    H3-K27 methylation.

    NEC preflight returned SKIP (MONDO records no causal gene for this somatic-driver
    neoplasm). Manual identity check performed instead: Orphanet xref, OMIM 601128
    (H3F3A), and synonym list all match. Tenosynovial giant cell tumor and giant cell
    tumor of soft tissue are curated as explicit differentials for exactly this
    same-name confusion risk.

    Four GEO datasets added after manual relevance triage; three discovery
    candidates were rejected as off-disease (an osteosarcoma RBP series, an AML
    ZNF687 series, and a gene-only pediatric solid-tumor atlas match). All four
    retained accessions verified with just verify-datasets.

    Evidence discipline notes. Two snippets were quoted mid-sentence because
    bracketed abbreviations do not survive reference-validator normalization; the
    omitted words are stated verbatim in the adjacent explanation. Three claims were
    deliberately left without evidence rather than attached to a non-supporting
    quote: the radiotherapy-to-sarcoma association, embolization practice, and the
    canine G34W-negative result (which appears in the report body, not the abstract,
    so abstract-only validation would not verify it) - the last is recorded in the
    model link's limitations and notes instead.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (127/127), and the full batched just validate-disorders sweep all pass. Compliance
    96.7 percent global / 96.6 percent weighted. Folded-hyphen, snippet-length, and
    title-snippet gates clean. tests/test_data.py subset (10,237 tests covering
    conforms_to references, foreign keys, model readout targets, and history layout)
    passes.

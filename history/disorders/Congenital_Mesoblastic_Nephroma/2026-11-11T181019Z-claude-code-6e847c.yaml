  details: |
    Four findings, two of them evidence that did not support the claim it sat on. The larotrectinib REFUTE item quoted a background sentence about the cellular subtype's prognosis, saying nothing about the drug; it now carries the paper's own result sentence as SUPPORT and the acquired-resistance death as REFUTE, with the single-centre cohort's TPM3::NTRK1 death added as a second REFUTE so the description's claim is cited rather than asserted. The salvage-chemotherapy snippet did not mention chemotherapy; it now quotes the sentence up to the bracketed regimen list, with a second reference carrying the limited-efficacy half directly, which removes the need for the bracket workaround to do that job. The entry-level review_notes still said no targeted-therapy row was included and that larotrectinib was not fetched, which the previous round made false; the paragraph now covers only the EML4::ALK and entrectinib fence, and names the ALK-inhibitor salvage arm of the cohort as a further fenced omission. Larotrectinib now binds CHEBI:755964 as therapeutic_agent, looked up rather than written from memory. The target_mechanisms link cites the selectivity sentence as well as the fusion sentence, and its description scopes the link to the NTRK-fusion subset because the target node also carries the EGFR and BRAF lesions. The osteolysis row gains a note explaining why a bone-metastasis and remodelling report supports an osteolysis binding. The optional renin intermediate node is not added: no cached source describes renin-mediated hypertension in this disease.

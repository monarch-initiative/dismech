  summary: 'Review round 1: phenotypes, pathograph wiring, diagnosis, treatments'
  details: |
    The entry used a small part of its own research report. Six phenotypes added with cached quotable sources: polyhydramnios and premature birth from the fetal systematic review, hypercalcemia, arterial hypertension and hematuria from the presenting-features list, and osteolysis scoped to the cellular subtype. Phenotype causal connectivity went from 0/1 to 7/7: the proliferation node now reaches the lesion, the obstetric chain and the paraneoplastic chain, and the previously floating polysomy node has an incoming edge from the activation node. A new Tumour PTHrP Secretion node carries the hypercalcemia mechanism, which the cited cases establish by PTHrP normalising on resection. The convergence node's molecular function moved from GO:0004714 transmembrane receptor protein tyrosine kinase activity to GO:0004672 protein kinase activity: the narrower term is false of BRAF, a serine/threonine kinase, and of the cytoplasmic ETV6::NTRK3 fusion protein, and the node's own description says all three lesion classes converge there. Three treatments added: salvage chemotherapy, larotrectinib with a target_mechanisms link to the activation node and a REFUTE item for the fusion-positive case with a poor outcome, and preoperative hypercalcemia correction. A diagnosis section was added covering ultrasound and molecular subtype assignment. Three snippets written in this round failed validation and were replaced: two were the cache file's title line rather than a body sentence, and one was broken by the validator stripping a bracketed regimen list. The fetal review's cache was force-upgraded to full text because the obstetric findings are not in its abstract; it was untracked at the time, so no committed content was rewritten. Entrectinib and the ALK-inhibitor salvage arm of the single-centre cohort remain unrecorded under content fence a.

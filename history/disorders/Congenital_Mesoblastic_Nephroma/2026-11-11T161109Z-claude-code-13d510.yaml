  summary: 'Create: Congenital Mesoblastic Nephroma'
  details: |
    New entry on MONDO:0017043 with all three histological subtypes bound: classic MONDO:0004455, cellular MONDO:0004454 and mixed NCIT:C97058. The mixed subtype was expected to have no term; NCIT carries one, so it is bound rather than left free text. Built from a fresh claude_code report run with --no-cache, with all 23 snippets re-derived from cached references and verified. The pathograph models the three driver classes as separate somatic lesions converging on one ligand-independent kinase activation node, because they segregate by subtype rather than co-occurring, with the secondary polysomies downstream of the initiating fusion on the strength of a paper that establishes that temporal order directly. The mixed subtype carries a deliberate SUPPORT and REFUTE pair: the SIOP/GPOH cohort of 111 found all mixed tumours translocation negative, the Knezevich series reports fusion-positive mixed tumours, and the two are recorded as contradicting rather than averaged. A sampling explanation for the disagreement is offered in review_notes and labelled as a hypothesis, not a resolution. Content fence (a) removed the EML4::ALK rare variant and any targeted-therapy row; entrectinib is fenced and the larotrectinib case literature was not verified in this pass, so neither is asserted. Two errors were caught in validation and fixed: a quote retyped as a rare pediatric renal neoplasm when the source says the most common renal neoplasm, and a preflight WARN about four gene identifiers that proved to be false positives of a proximity heuristic on fusion rows. Three further defects were caught by the pre-push gate and fixed in the same session. Two reference_title values had been written from memory and named papers other than the PMIDs they sat on; both were replaced by copying the title out of the cache file. The origin node's cell type had been bound to CL:0011020, which is neural progenitor cell, under a preferred term reading renal mesenchymal progenitor cell, and its notes justified that with a claim that the Cell Ontology had no fitting term - a claim OLS and the local cache both refute. It is now bound to CL:0008019 mesenchymal cell, with the renal localisation carried in the preferred term and the reason recorded, because none of the cited sources names the compartment the lesion arises in. The same node carried no molecular function for the gene reaching it; it now binds GO:0004672 protein kinase activity, chosen over the tyrosine-kinase term because the node covers BRAF as well as EGFR and NTRK3, and lists all three genes rather than EGFR alone.

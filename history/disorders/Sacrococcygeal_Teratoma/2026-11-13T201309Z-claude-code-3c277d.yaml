  summary: 'Create: Sacrococcygeal Teratoma'
  details: >-
    New entry for sacrococcygeal teratoma (MONDO:0042727), curated by hand from the cached
    references in this branch. There is no stub to delete.


    The chain is: a primordial germ cell left in the caudal midline, epigenetic reprogramming of it
    to a pluripotent state, and a tridermal mass at the sacrococcyx with four arms out of it - the
    presenting mass, a high-output cardiac state from vascular steal, a malignant yolk sac
    component, and pelvic and perineal mass effect. All ten phenotypes are causally connected.


    The first two nodes are the weak ones and the entry says so on both. The midline origin rests on
    a review whose own words are that the distribution of extragonadal germ cell tumours along the
    midline is still best explained by germ cell migration - a statement about competing hypotheses,
    not a demonstration. Nothing cited mentions Hensen's node, the primitive streak, the caudal cell
    mass or a totipotent cell, which are the other accounts in the wider literature, and a note says
    the entry records the germ cell account because it is the one its sources make rather than
    because the alternatives were weighed.


    The reprogramming step is supported entirely by mouse work, and every mouse in the cited
    literature has a gonadal teratoma. That is recorded as a HUMAN_MODEL_MISMATCH discussion rather
    than only as a caveat, because the thing being modelled is a germ cell that never reached a
    gonad and the model contains one. The Dnd1 mutant mouse is RECAPITULATES with two typed
    divergences, a BOUNDARY_OMISSION for the missing caudal midline and a SPECIES_MISMATCH for the
    strain-restricted allele. The MC4R strains are FAILS_TO_RECAPITULATE, which is the honest grade
    for a paper reporting that Dnd1 mutation alone gives germ cell loss rather than teratoma and
    that strains built for testicular teratomas produced ovarian ones.


    At least six prenatal thresholds compete in the cited literature and the entry records all of them
    with their denominators: tumour volume to fetal weight ratio at 0.12 before 24 weeks, the same ratio
    at 0.095 for fetal outcome and 0.12 for maternal risk, a solid tumour volume index at 0.09, and
    growth velocity at 7 mm per week. The validation study of the first reports that none of the
    factors associated with poor prognosis was an independent predictor on multivariate analysis. A
    KNOWLEDGE_GAP discussion records that the choice has not been made.


    Two cited sources disagree about whether fetal hydrops predicts survival, and the disagreement
    is recorded as a CONTROVERSY with a REFUTE-graded item rather than averaged. The phenotype row
    carries both.


    The Altman classification is deliberately not defined. Its primary source, the 1974 surgical
    section survey, is cached with an empty body under both its PMID and its DOI, and no other cited
    source states what the types are; a classification cannot be transcribed from a covariate
    column. The entry records what it can - types II and III carry an odds ratio of 1.6 for
    recurrence in a 3407-child cohort, and the classification predicts no long-term sequela - and a
    KNOWLEDGE_GAP discussion says what would resolve it.


    Three other things are absent on purpose. No cited source mentions the coccyx or coccygectomy,
    so the resection row's own notes say that its name states standard practice that nothing cited
    here establishes. No susceptibility gene is claimed for this tumour specifically: all four loci
    come from studies that pool germ cell tumours across sites, and the strongest reported effect
    for one of them is in testis. And neither mouse model carries a bound gene, because a model
    organism's own gene takes its model-organism database identifier, no MGI build was available and
    the Alliance search endpoint returned nothing; binding the human identifier would have been
    wrong rather than approximate.


    Content fences. No chromosomal lesion at 1p36, 11q or 17q and no chromothripsis is cited, and
    the literature digest that read the cached corpus was given that exclusion. The committed
    deep-research report carries its own fence disclosure and names PMID:26687816 only to record
    that it was neither fetched nor cited.


    Validation: just validate passes with 97 snippets and 97 titles verified and no issues; just
    list-disconnected-phenotypes reports 10 of 10 connected. Every snippet was checked against its
    cache at the moment it was written, and every reference_title was read from the cache's own
    title line, parsed as YAML, rather than typed.


    An adversarial verification pass before the push found six blocking defects on an entry that
    passed every gate, all of them in prose rather than in a quote. The worst was a fabricated
    method: the cardiomegaly row said the factor survived multivariate analysis, where the cited
    cohort ran none and the one study in the entry that did ran it found no factor independent - the
    exact result the entry quotes elsewhere as the qualifier on every prenatal predictor. A
    negative-existence claim on the KITLG row was refuted by the same sentence the row quotes, and
    the row's own explanation said so: the study reports a second parent-of-origin result, and
    labels the KITLG one a maternal effect rather than a parent-of-origin effect at all. A quoted
    "many" was upgraded to "most" in three places, including a duration field. Hydrops was called
    the single strongest reported predictor where a cited growth-velocity study reports a higher
    odds ratio and is the only factor that survived a stepwise regression. The discussion counting
    competing prenatal thresholds counted four where the entry's own snippets give at least six. And
    an odds ratio was attributed to 84 fetuses in three places where the analysis ran on the 68 left
    after sixteen terminations were excluded, which is what makes its interval run from 2.6 to
    275.1. Sixteen further findings are taken: the Altman types are no longer described in the same
    paragraph that says no source defines them; the study-design universal in notes is replaced by a
    count, because five cited sources are none of the designs it listed; two quote_role values on
    background sentences are corrected and one on a primary study's own conclusion; a frequency band
    is removed because its evidence gives 36% of recurrences and 3.7% of children and the band
    fitted neither; and the alpha-fetoprotein decline, the whole-specimen claim, the coccygectomy
    claim in the description, two unsourced superlatives and a garbled sentence are rewritten to
    what the sources say. Two evidence items are added to carry the corrected claims.


    A second verification pass, on bindings and hygiene, found the same failure shape pointed at an
    ontology rather than at the literature. The Altman discussion said resolving the missing
    definitions needs the 1974 paper or a review that restates them. It does not: HPO's own text
    definition of HP:0030736 - the term this entry binds for the mass - states all four types, and
    HPO carries separate terms for types I, II and III and one for the presacral type IV. The claim
    that no cited source defines them stays, because it is true and is what the evidence requirement
    is about; the resolution sentence now names HPO and says why an ontology definition cannot be an
    evidence snippet. The same definition also asserts an origin from totipotent cells at the node
    of Hensen, which is one of the accounts the entry's own notes say no cited source makes, so the
    notes now record that HPO takes the other view and that the entry does not adjudicate it. Four
    bindings or slots changed: the hydrops row's preferred term said non-immune, which no cited
    source does, and now says fetal hydrops; the ultrasound row is rebound from the generic
    NCIT:C17230 to NCIT:C217447 Diagnostic Obstetric Ultrasound, which is already cached; the
    Finland prevalence record no longer asserts a rate_denominator of live births when its own note
    says the denominator is pregnancies, and the note now also explains the band; and creation_date
    was 47 minutes in the future and is set to the session's own timestamp. The label on GO:0008354
    is the committed cache's rather than the current ontology's - GO now calls it primordial germ
    cell migration - which is corpus-wide drift shared by two other entries and is recorded rather
    than fixed here. The two empty Altman cache files are committed with the entry so the gap it
    describes stays checkable after merge.

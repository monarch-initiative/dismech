  summary: 'Sacrococcygeal teratoma: platinum chemotherapy for malignant disease'
  details: |
    Added two treatment rows for malignant disease and extended the existing JEB row. The PEB
    row (cisplatin, etoposide and bleomycin, bound to NCIT:C128248 PEB Regimen, which NCIT
    defines as the paediatric regimen and which fixes no cisplatin dose, as its notes say) rests
    on the pediatric intergroup trial POG 9049/CCG 8882 (PMID:11150431): 74 children with
    malignant sacrococcygeal tumours, 44 with metastases, randomised to standard-dose or
    high-dose cisplatin with etoposide and bleomycin, with resection as part of the treatment
    (initially in 29, and after chemotherapy in 42 of the 45 first biopsied; the three who had a
    biopsy only had a 4-year event-free survival of 33%), 4-year overall survival of 90% and
    event-free survival of 84% for all 74, and the dose comparison inconclusive in this subset
    (89% against 78% event-free survival, P = .21) while following the whole trial's trend; the
    row links to the malignant yolk sac component, graded indirect, and its explanation says the
    survival follows surgery as well, pools both doses, and that the abstract names
    no histological subtype. The preoperative chemotherapy row rests on the German cooperative
    series (PMID:11283126) of 66 analysed among 71 enrolled patients, with the five exclusions,
    the chemotherapy-first group's larger share of metastatic tumours, the complete-resection
    counts, the better overall survival of locally advanced and metastatic tumours with
    neoadjuvant treatment, and the whole series' cycles, survival and deaths, graded indirect
    for the strategy; its notes say the abstract names no drug besides cisplatin. It also rests
    on the intergroup trial's conclusion that delayed resection was not associated with an
    adverse outcome, with that trial's figures (83% against 90% event-free survival, P
    = .50). The JEB row gains the NCIT JEB Regimen term and three NCI Thesaurus accepted-use
    records: carboplatin's and etoposide's name germ cell tumours without a site, broader than
    this disease, and bleomycin sulfate's names particular sites and histologies, none of them
    this disease, which each explanation says. The JEB and PEB rows take the action term
    Cytotoxic Chemotherapy, a child of the Chemotherapy term the JEB row had (parents read from
    the local NCIT build); the preoperative row takes Preoperative Chemotherapy. Twenty-five new
    evidence items: twenty-two from the two new caches and three accepted-use records already
    cached. One German-series quote ends with a bracketed set of overall-survival figures, which
    the validator strips before matching, so those figures were compared with the cache by eye.
    NCI's PDQ summary could not be cached in full and is not cited. Validated with just
    validate-disorders, count-verified-snippets, check-snippet-grading and the rest of the
    repository's gate set.

  summary: Fetal intervention and delivery planning
  details: |
    Adds fetal intervention and delivery planning to the treatments section, as three new
    rows, each linked to the node it acts on. Amnioreduction is linked to polyhydramnios.
    Its row cites a 2004 series, which gives the indications for cyst aspiration and
    amnioreduction together (maternal discomfort, preterm labour and prevention of tumour
    rupture at delivery), and the exclusion sentence of a 2024 systematic review. It is
    bound to Paracentesis (NCIT:C15310), the removal of excess fluid by needle puncture,
    because no NCIT label names amnioreduction and NCIT defines Amniocentesis as diagnostic.

    Pre-emptive early delivery with immediate resection, for impending fetal or maternal
    decompensation between 27 and 32 weeks, is linked to the high-output state; its row
    cites a 2019 single-centre series (9 of 11 survived, none died of prematurity, and the
    authors support the approach for selected cases) and a 2019 case report's literature
    review that restates it and names the conditions for success. It is bound to Tumor
    Resection (NCIT:C164212), as the complete-resection and open fetal resection rows are,
    because the treatment term takes one term and the row's link runs through the resection;
    the series' abstract does not give the mode of delivery, so no more specific delivery
    term was available either.

    Caesarean section for a large or vascular tumour (NCIT:C46088) is linked to haemorrhage
    into the tumour, the nearest node for bleeding at birth, from the literature review of a
    2025 single-centre series; the row also cites that series and a 2019 study of tumour
    volume to fetal weight ratio, for its definition of a higher-risk maternal operation and
    its 0.12 threshold.

    The radiofrequency ablation row now gives survival without intervention beside survival
    after percutaneous procedures and after radiofrequency ablation itself, with
    denominators, and says the groups are not alike, citing the 2024 review's reason (fetal
    intervention is indicated for hydrops or cardiac dysfunction, which were rarer without
    it) and a 2011 cohort of 22 in which the treated fetuses (radiofrequency ablation in
    six, shunting alone in two) had larger tumours, more often vascular, and an outcome its
    authors call similar. The row also gives the review's statement that it could not
    evaluate fetal surgery of any type against no intervention, and its notes say that
    twelve of the review's 18 ablations come from three studies the row cites.

    The open fetal resection row says the review reports significantly higher survival
    without intervention than in the cohorts treated by fetal surgery, without a p-value and
    without saying whether that holds for open surgery alone. The row also says the review
    did not aim to compare the two and could not evaluate the effectiveness of fetal surgery
    of any type against no intervention. Its link now says INHIBITS rather than BYPASSES, as
    the radiofrequency ablation link does, and the new pre-emptive delivery link says
    INHIBITS too. The open fetal resection row is now bound to Tumor Resection
    (NCIT:C164212) too, as the complete-resection and pre-emptive delivery rows are, and its
    notes give NCIT's narrower definition of the term (removal of cancerous tissue).

    The 2024 review's cache is upgraded to full text; the entry's 272 existing snippets
    still verify. Validated with just validate, validate-terms and count-verified-snippets
    (303 of 303).

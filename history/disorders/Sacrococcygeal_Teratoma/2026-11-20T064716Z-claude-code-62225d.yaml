  summary: Imaging before and after birth, and the imaging-derived risk indices
  details: |
    Adds an imaging_findings section of twelve rows, in the modalities the schema offers
    (ultrasound for B-mode, Doppler and fetal echocardiography; MRI for fetal MRI and
    surveillance MRI). The rows: the sacral mass on prenatal ultrasound and when it is found
    (PMID:36326365, PMID:40269769, PMID:38969517); cystic or solid content, with every cystic
    tumour doing well in 37 fetuses and solid morphology a predictor but not independent in a
    three-centre series that evaluated 79 fetuses and excluded eleven terminations
    (PMID:23845611, PMID:25783370, PMID:36326365); a hypervascular tumour on Doppler ultrasound
    (PMID:37964422, PMID:36326365, PMID:40269769); three volume indices with their own sources -
    the solid tumour volume index on fetal MRI above 0.09 (PMID:23773720), the solid tumour
    volume to head volume ratio above 1 (PMID:19752518) and tumour volume over biparietal
    diameter above 60 cm3 per cm (PMID:29399854); tumour growth on serial ultrasound, where two
    multicentre series each find a different single growth measure independent and define a poor
    outcome differently (PMID:39482803, PMID:40261238); the signs of a high-output heart on
    fetal echocardiography, graded indirect because the cohort mixes this tumour with twin
    reversed arterial perfusion (PMID:22086180); a raised fetal middle cerebral artery peak
    systolic velocity, bound to HP:0034191, with the authors' call for validation
    (PMID:42815687); extent within the pelvis and spinal canal on fetal MRI (PMID:36326365,
    PMID:40269769); bladder displacement and hydronephrosis on prenatal imaging (PMID:36326365,
    PMID:40269769); and recurrent mature teratoma on surveillance MRI (PMID:39016163). Postnatal
    MRI or CT is a new diagnosis row bound to NCIT:C16502, since it records a test and its
    correlation with the prenatal scan rather than an imaging appearance (PMID:40269769). The
    tumour-volume to fetal-weight ratio stays on its diagnosis row; its description and its
    validation study's explanation, like the cystic or solid row, now say that the three-centre
    series evaluated 79 fetuses and excluded eleven terminations, and its notes and the
    threshold discussion now list the four thresholds this change adds, the two direct
    comparisons between indices and the two growth series' independence results. Two cited full
    texts make earlier text false, so it is reworded: the first node's note now says what the
    two series say about the origin in their introductions, citing earlier work, and that
    neither presents data of its own for it; the Altman discussion now quotes the two series'
    restatements of the four types and asks whether to curate the types from them; and the edges
    from the high-output state to polyhydramnios and to premature birth gain one series'
    statement, from its review of the literature, that the raised output contributes to
    polyhydramnios, which can lead to preterm birth (PMID:40269769). The prenatal progression
    note's sentence that the fetuses that do badly do so through the high-output state is left
    as it is, because another change to this entry rewords it with a source of its own. Older
    sentences that the cited sources contradict are corrected: the high-output node's definition
    is no longer called the only numerical cut-off cited; the cardiomegaly row names the
    84-fetus Dutch national cohort and says that two growth series did find an independent
    measure; the long-term sequelae node (Pelvic and Perineal Mass Effect) now gives the scar's
    40% apart from the nearly half with impaired bowel function or urinary incontinence, where
    it had put all three in nearly half, and gives the one risk factor the national study's
    abstract reports, tumour size above 500 cm3 for an unacceptable scar (PMID:17560233), beside
    its conclusion, and its incoming edge gives the same result, graded indirect there; the node
    also quotes, as an addition, one series' literature review, which says that the
    complications listed in one passage, mostly obstructive and bowel problems, are commoner
    with a larger intrapelvic component (PMID:40269769); the long-term survivorship note no
    longer says that no clinical variable the national study tested predicted the sequelae,
    gives the same risk factor, and gives the scar's 40% apart from the bowel and bladder
    figure; the derivation study's 100% sensitivity is said to rest on at most five poor
    outcomes; the ratio row's last explanation no longer says its result qualifies every
    prenatal predictor in this entry; and the threshold discussion no longer calls the
    three-centre study the largest prenatal cohort. The ratio row gains as evidence the
    comparison between the ratio and the head-circumference composite (PMID:39753205), and the
    hypervascular row gains one series' methods sentence naming Doppler (PMID:40269769). The
    first paragraph of the entry notes, the resection row's note on the coccyx and a passage of
    the review notes are reworded without counts, with the same wording as two other changes to
    this entry. Eight references are cached for the first time, and the new terms HP:0034191 and
    UBERON:0005473 have cache rows. After review, the echocardiography row's notes say that its
    HP term covers only the size sign, and the sequelae node keeps the series' introduction's
    words, incontinence and aesthetic concerns, rather than reading the latter as the scar.
    Validation: just validate passes, all 162 snippets verify, and the full gate set passes.

  summary: 'Review round 1: four phenotypes from the cached abstracts, three wired'
  details: |
    The reviewer listed four outcomes present in the abstracts this PR already cites but absent from the entry, and they are now phenotype rows. Cosmetically unacceptable surgical scar (40 percent of respondents, PMID:17560233) binds HP:0100699 Scarring and is wired downstream of Pelvic and Perineal Mass Effect. Stillbirth (10 percent) and placentomegaly are wired downstream of High-Output Cardiac State from Tumour Vascular Steal; placentomegaly binds HP:0006267 Large placenta, and stillbirth carries no term because HP:0003826 Stillbirth sits under HP:0012823 Clinical modifier rather than under HP:0000118 Phenotypic abnormality and so is outside the PhenotypeTerm dynamic enum. Associated major birth defect is deliberately left unwired and unbound as a co-occurring anomaly. Two further suggestions were taken: the PMID:41612690 item, whose quoted sentence is a textbook definition of teratoma inside a veterinary case report, is regraded from HUMAN_CLINICAL to OTHER; and the Cardiomegaly edge explanation stated the hydrops confidence interval twice, so one statement is removed.

    An adversarial evidence pass over the draft then found four claims the new rows made that their own sources do not, and all four were confirmed against the cached text before being repaired. The birth-defect row presented 31.8 percent as a sacrococcygeal teratoma rate; its denominator in PMID:16420341 is 22 infant teratomas of all sites, of which 13 were sacrococcygeal, and the row's note claimed the source does not name the defects - refuted by PMID:23432104, a register of 124 sacrococcygeal teratomas that this entry already cites, which gives 30 percent and names urinary tract anomalies and syndromes. That sentence is now the row's primary evidence and the Hawaii item is INDIRECT with its denominator stated. The placentomegaly edge cited the review's list of factors associated with poor outcome while its prose asserted a link to the high-output state; the snippet is swapped for the review's closing sentence, which is the one that calls those features factors associated with cardiac failure. The scar row called 40 percent the most common long-term complaint, a ranking PMID:17560233 does not make and which its own 46 percent bowel-and-urinary composite exceeds. The stillbirth row asserted the high-output attribution flatly where its own edge already hedged it; the row now carries the same caveat.

    Three negative-existence notes were re-grounded by running the searches they claimed rather than asserting them: an OLS search of HPO for l~scar returns a dozen terms, all anatomically specific but HP:0100699; l~birth defect returns nothing; and an OLS hierarchicalAncestors walk on HP:0003826 returns All, Age of death, Clinical modifier, Clinical course, Prenatal death and Mortality/Aging, with no HP:0000118.

    105 snippets verified against the committed cache, terms validated, twelve file gates green, 13 of 14 phenotypes causally connected.

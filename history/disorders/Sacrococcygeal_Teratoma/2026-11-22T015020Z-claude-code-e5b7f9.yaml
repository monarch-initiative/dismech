  summary: 'Sacrococcygeal teratoma: terminal myelocystocele as a differential diagnosis'
  details: |
    Added a differential-diagnosis row for terminal myelocystocele, bound to MONDO:0970962. It
    rests mainly on a 2007 report of two cases (PMID:17569957, newly cached, with full text): an
    isolated terminal myelocystocele that mimicked a cystic sacrococcygeal teratoma on prenatal
    ultrasound, and a type 2 teratoma for comparison. From its discussion the row takes that the
    two conditions may look alike there but differ in perinatal risk, long-term morbidity and
    surgical team; that terminal myelocystocele comes with spinal dysraphism and usually normal
    AFP, and, citing earlier work, that solid teratomas come with raised AFP; that the dysraphic
    spine and the sac's continuity with the central canal are the key imaging distinction; that,
    citing earlier work, prenatal complications are rare and vaginal delivery often considered
    safe in terminal myelocystocele; that terminal myelocystocele is often associated with the
    OEIS complex, though it also occurs in isolation; and, citing earlier work, that
    myelocystocele is typically not listed in this tumour's differential diagnosis, graded
    INDIRECT for the row because the sentence uses the general term. From its two cases it takes
    why the index case was taken for a teratoma (its ultrasound appearance, polyhydramnios and
    mildly raised AFP), that delivery was planned on that diagnosis, that fetal MRI was declined
    and neonatal imaging made the diagnosis, and that its intraoperative figure shows the
    septation seen on ultrasound to be the wall of the terminal dilation of the central canal;
    and that in the comparison case, which looked cystic on ultrasound, fetal MRI showed pelvic
    extension that ultrasound had missed and a significant intracorporeal solid component, and
    its MRI figure shows a septation seen on ultrasound to be part of the mass, not an extension
    of the spinal canal. The row states each case's AFP on its own (mildly raised maternal serum
    AFP in the terminal myelocystocele case, which the authors say led, with polyhydramnios, to
    the presumptive diagnosis of a teratoma; normal amniotic fluid AFP in the comparison
    teratoma), notes that the report does not compare the two values, which were measured in
    different fluids, and says the report makes no general statement on AFP in cystic teratomas.
    The authors' recommendation of fetal MRI is quoted from the summary without a quote role.
    The row lists three distinguishing features (dysraphism, the imaging distinction and AFP)
    and a note on prognosis and management; the OEIS association is in the description, since
    the report does not use it to tell the two apart. Two quotes the entry already carries in
    other differential rows are cited on it too: a review's list of caudal cell mass anomalies,
    graded INDIRECT as on the anterior sacral meningocele row, since a shared developmental
    origin is not a report of one condition taken for the other; and a 2022 fetal MRI series'
    list of differential diagnoses for the cystic forms, graded DIRECT as on the chordoma row,
    since the series names the entity itself. The same report restates four types corresponding
    to the other two restatements without naming any classification, so the Altman discussion
    now counts three restating sources instead of two and quotes the third, graded INDIRECT
    because only the other two name the classification; its prompt says so, and its rationale
    says how each source names the classification and words type IV, and how the report's type
    III differs. Twenty-six new evidence items, twenty-five on the row and one on the
    discussion. Validated with just validate-disorders, just count-verified-snippets, just
    check-snippet-grading and the other whole-repo gates CI runs, all passing.

  summary: 'Edit: Sacrococcygeal_Teratoma - coccyx and differential-diagnosis sources'
  details: |
    Cites on the resection row the sources that say the coccyx is removed with the tumour: a
    fetal MRI series and a review give coccygectomy as part of the operation, a
    single-centre series says coccyx removal prevents local recurrence and removed it in
    every newborn it operated on, an older series removed it within the first week of life,
    and the review names failure to remove the coccyx among the primary drivers of
    recurrence; the six items follow the row's existing pair of quotes. The row's note and
    the review notes no longer say the coccyx is absent from its evidence, and the neonatal
    resection phase now names the review's two further drivers of recurrence. The fetal MRI
    series' list of differential diagnoses is cited on the chordoma, anterior sacral
    meningocele and presacral neuroblastoma rows, graded INDIRECT on the meningocele and
    neuroblastoma rows because the series says sacral meningocele without saying anterior
    and low-lying neuroblastoma without saying presacral; the chordoma row's notes and
    distinguishing feature now cover both of its sources. A review of caudal cell mass
    anomalies is cited on the anterior sacral meningocele row, and on the fetus-in-fetu row
    the systematic review's line between a teratoma and fetus in fetu and a case report's
    distinguishing features, organogenesis and a fetal heartbeat, beside the review's
    finding that heart tissue is exceptionally rare; the chordoma row adds the series'
    statement that most cases are sporadic. The origin node's note now counts four sources
    that touch on the origin without naming a germ cell and without data of their own,
    adding the fetus-in-fetu review and the caudal cell mass review. The myelomeningocele
    row now says what the centre's two re-assessed fetuses were referred with and found to
    have. A terminal myelocystocele row is left for a later change, because adding it would
    change the Altman discussion's count of cited sources that restate the four types, and
    another open change rewrites that discussion. One reference cached for the first time.
    Validated with just validate and count-verified-snippets (287 of 287).

    In the first review round, the chordoma row's item saying most cases of this tumour are
    sporadic is graded NO_EVIDENCE with no directness grade, since it does not bear on the
    chordoma differential, and the caudal cell mass item on the anterior sacral meningocele
    row is graded INDIRECT, since a shared developmental origin in the review's account is not
    a report of one lesion taken for the other. Two explanations and one notes sentence are
    reworded to match: each explanation now says which claim its grade is relative to, and
    the chordoma notes name the familial claim they do not repeat.

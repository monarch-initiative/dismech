  summary: Classification, NCIT mapping and epidemiology
  details: |
    Adds classifications, an NCIT mapping, an epidemiology section and two prevalence rows. The
    classifications are Harrison's oncology part and the ICD-O germ cell tumour group, both from
    a review's opening statement that the tumour is an extragonadal germ cell tumour
    (PMID:33906346, already cited). The NCIT mapping, NCIT:C99055 Sacrococcygeal Teratoma as an
    exact match, is MONDO's own cross-reference for the entry's disease term, from which MONDO
    takes its exact synonyms; its notes say the entry does not read the synonym presacral
    teratoma as covering the presacral teratoma of Currarino syndrome. The epidemiology section
    gives the sex distribution in the Hawaiian registry, with the registry's result, for
    teratomas of all sites, that its rate differences other than by gestational age were not
    significant and its authors' caveat on small numbers (PMID:16420341); the share with
    associated anomalies in the Finnish register (PMID:23432104) and among infant teratomas of
    all sites in Hawaii; the Hawaiian null result for plurality, the only cited source on it;
    and the prenatal detection rates in Finland, southern Sweden and a regional database, which
    are counted over different groups (PMID:26454470, PMID:18973151). The prevalence section
    gains southern Sweden, 1:13,982 live births, and the regional database, 1 per 27 000 live
    births, as birth prevalences per 100,000 live births. Three existing passages are brought
    into line with the new figures and the Finnish register's wording: the sacrococcygeal mass
    phenotype now says it is found before birth in half to nearly three quarters of cases in
    population-based series, the associated birth defect row keeps to the Finnish register's own
    wording of its anomalies, and the notes paragraph on numbers that disagree gives the range
    of the four prevalence figures and says that Finland's, the highest, is a total prevalence
    over pregnancies. The progression section's prenatal note, which says just over half, is
    left as it is, because another change to this entry rewords the sentence after it. The notes
    sentence saying that denominators are named wherever a number appears is left as well,
    because four other changes to this entry rewrite the passage it sits in, although the
    regional detection rate and the Hawaiian sex percentages are given without denominators,
    which their abstracts do not state. Classifications and mappings sit before the description,
    and epidemiology before prevalence. Two references are cached for the first time, and
    NCIT:C99055 has cache rows. Validation: just validate passes, all 124 snippets verify, and
    the full gate set passes.

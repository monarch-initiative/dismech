  summary: 'Function after surgery: bladder, bowel and leg outcomes'
  details: |
    Adds function after surgery. A new node, Pelvic and Sacral Nerve Injury, sits downstream
    of the pelvic and perineal mass effect node, with edges to urinary incontinence, bowel
    incontinence and a new lower limb weakness phenotype (HP:0007340, occasional). Two cited
    sources name a nerve mechanism: a 2022 MRI series restates tumour compression or
    infiltration of the sacral nerves, and a 1990 series attributes leg weakness in 2 of 27
    children to sciatic nerve palsy; the operation as a second cause is the entry's
    inference. The rest is association rather than a measured mechanism: the same 1990
    series (more sequelae after abdominoperineal resection of large intrapelvic tumours), a
    2020 single-centre series (functional disorders with a low Apgar score, larger tumours,
    abdominosacral resection, surgical injury to the pelvic organs and immature or malignant
    histology; leg motor disorders, not further specified, in 3 of 29), a 2023 systematic
    review (abnormal bladder function by Altman type, lowest in type I and highest in type
    IV; worse urological outcome with unfavourable biology and in patients who needed
    reoperation) and a Swedish series (dysfunction with gestational age, immature histology
    and tumour size on univariate analysis). The results against these associations are
    cited beside them: the Dutch national questionnaire study's finding that neither Altman
    type nor histopathology was a risk factor for any long-term sequela on the new node and
    on its edges from the mass effect and to urinary incontinence, the review's finding of
    no significant association of bowel dysfunction with tumour characteristics on the bowel
    incontinence edge, and both, with a Scottish cohort's finding of no obvious predictive
    features at presentation for its bowel findings, in the long-term survivorship phase;
    the Altman discussion now records the review's bladder result beside the Dutch null. The
    bowel incontinence, urinary incontinence and constipation rows now give the spread of
    figures from later reports (the systematic review of published studies, a Swedish
    series, a Scottish national cohort and the 2020 series), graded INDIRECT where a source
    reports dysfunction rather than incontinence. The long-term survivorship phase adds the
    predictors those studies report, the results that agree with the Dutch null, a UK
    nationwide figure of 36% with documented bladder or bowel dysfunction, and the Swedish
    quality-of-life result. Older text that called the Dutch study the national or long-term
    study now names it, and the constipation row quotes the Dutch study's 17% and grades its
    summary sentence INDIRECT, since problems with defecation are broader than constipation.
    Six new reference caches. Validated with just validate, validate-terms and
    count-verified-snippets (316 of 316).

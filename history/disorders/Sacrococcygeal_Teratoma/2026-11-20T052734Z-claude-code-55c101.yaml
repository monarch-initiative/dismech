  summary: 'Mirror syndrome, bleeding into the tumour and early birth'
  details: |
    Extends the fetal high-output branch and adds bleeding into the tumour. A new node,
    Haemorrhage into the Tumour, is fed from the tumour mass through unknown intermediates (an
    association with size) and leads to a new Neonatal death phenotype. In a Dutch series of 235
    children, internal tumour haemorrhage was among the commonest causes of early death; nine
    children died within 27 days of birth, seven of the deaths related to tumour haemorrhage,
    circulatory failure or both; haemorrhagic deaths, which the abstract does not split by
    source, were almost 70% of the neonatal mortality; and prematurity, a tumour volume above
    1000 cm3 and emergency operation were its risk factors (PMID:27502009). The figures that
    count circulatory failure with tumour haemorrhage, or do not split haemorrhagic deaths by
    source, are graded indirect for the node and its edge. A case report found histological
    signs of bleeding in its resected tumour (PMID:30949371). The high-output node gains edges
    into Neonatal death, on the same series' finding that high-output failure is among the
    commonest causes of early death, and into a new Maternal mirror syndrome phenotype, through
    unknown intermediates: in one case the mother's hypertension, epigastric pain, proteinuria
    and thrombocytopenia began shortly after the fetus showed right heart failure,
    placentomegaly and polyhydramnios, before overt hydrops, and resolved after delivery, while
    the same report says the syndrome is usually associated with severe fetal hydrops
    (PMID:17465292); a second case report's discussion cites earlier work linking a large
    tumour's arteriovenous shunts to cardiac failure, placentomegaly, hydrops and the syndrome,
    and says the placenta has been suggested as its source (PMID:30949371, background), which no
    cited source demonstrates. The mirror syndrome row also carries the syndrome's definition
    and its likeness to preeclampsia (PMID:30949371), a management review naming it among the
    potentially lethal conditions the tumour can precipitate (PMID:42219219), its grave
    prognosis with hydrops (PMID:18675620, background) and a sequela edge into Premature birth,
    through the decision to deliver, for a hydropic fetus delivered at 27 weeks for it
    (PMID:18675620); HP and MONDO have no term for it, which OLS searches confirm.
    Placentomegaly gains the two case reports' placentas, and Premature birth gains early
    delivery of eleven fetuses with impending fetal or maternal decompensation at one centre,
    nine surviving, with no death attributed to prematurity (PMID:29734172), prematurity as a
    risk factor for haemorrhagic death, and the 27-week delivery. Neonatal death carries no
    term, as for the stillbirth row: HP:0003811 sits outside the PhenotypeTerm enum. The
    top-level description now names bleeding in the first weeks after birth among the dangers,
    as the Dutch series' commonest cause of death in that period. The prenatal
    progression note no longer says that every fetus that does badly does so through the
    high-output state, since the early-delivery series reports one death from tumour rupture in
    the womb and one from pulmonary hypoplasia (PMID:29734172). The entry notes no longer say
    that every cached source is an abstract, since one case report is cached as a full text, and
    their list of source types no longer counts the sources. A cited management review includes
    coccygectomy in the operation (PMID:42219219), so the resection row's note and the review
    notes no longer say that no cited source mentions it; the note now says that each cited source
    that mentions the coccyx describes removing it with the tumour. Two rewordings no new
    source forced are made with them: the review notes' sentence on the Altman classification no
    longer depends on what other sources state, and the entry notes describe the JEB treatment
    study as a single-arm treatment study, since its abstract does not say phase II. Six
    references are cached for the first time. Validation: just validate passes, all 139 snippets
    verify, and the full gate set passes.

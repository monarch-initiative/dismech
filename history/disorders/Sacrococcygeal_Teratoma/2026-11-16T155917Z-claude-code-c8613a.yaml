  summary: 'Review round 3: the LT strain claim, the mouse count, and the MC4R grade'
  details: |
    Round 3 of review on #17462. Two blocking items and three suggestions, all in one push.

    The first blocking item was a strain attribution the source does not give. Two places in the entry said that mutating Dnd1 alone gave germ cell loss *on the LT background*, and read that as reconciling the two cited mouse papers: 129/Sv enhancement in one, germ cell loss in the other. PMID:33568756's abstract says only 'However, the phenotype of mice with a mutated Dnd1 gene was germ cell loss' and names no strain; LT appears in that abstract four times and every one is about MC4R or the ett1 locus, never about Dnd1. So the reconciliation was manufactured. Both sites now say that the abstract gives no strain for that sentence, and that whether the two results disagree cannot be settled from what is cached. The 129/Sv half stays, because PMID:29378702 states it.

    The second was a count. The top-level notes said six cited sources are mouse work; the entry cites two mouse papers. Six is the number of MODEL_ORGANISM evidence items. Corrected to two.

    The MC4R link was graded FAILS_TO_RECAPITULATE against 'Epigenetic Reprogramming to a Pluripotent State' on the ground that the strains produced ovarian rather than testicular teratomas. The reviewer pointed out that the Dnd1 model is graded RECAPITULATES against the same node and also produces only gonadal teratomas, so the organ difference cannot be what separates them. It is now PARTIALLY_RECAPITULATES with two typed divergences: BOUNDARY_OMISSION for the caudal midline, which is the site this disease is defined by and which no mouse teratoma in either paper occupies, and SPECIES_MISMATCH for the strain restriction. Both QUALIFYING. The two evidence explanations under the link named the retired grade and now describe what each quote establishes instead.

    Two suggestions taken. PMID:42250912 was quoted only for its equal-survival result, 94.9% against 96.9%; the same abstract carries the malignancy difference that is the reason this entry is curated separately from Currarino_Triad, so both of its figures are now quoted - 10.3% and 31.9% against 4.2% at initial resection, and 35.4% (n=114) against 5.9% (n=1) at recurrence - and the phase notes say what the pair means. The single Currarino case behind the 5.9% is named, because that figure carries no weight alone. The Bowel incontinence and Urinary incontinence phenotype rows quoted only general framing sentences, with the 46/9/13/17/31% breakdown living on the causal edges; the breakdown is now quoted on each row as well, so each stands on its own numerator.

    109 snippets verified, up from 105. Terms validated. check-snippet-grading, check-name-collisions, check-entity-refs, check-causal-targets, check-logical-rules and model-scale-audit all green.

  summary: 'Edit: Sacrococcygeal_Teratoma - detection shares and sex ratios'
  details: |
    Attributes the share of tumours found before birth to its three population-based
    series. The progression section's prenatal phase said just over half were detected
    on ultrasound; the mass node's link to the sacrococcygeal mass phenotype said the
    same and that the rest were found at birth. The Finnish register gives 55% of
    pregnancies, detected in utero with no method named, and does not say when the rest
    were found; two other series give 74% and 50%. The three figures are cited on that
    phase and on the mass phenotype, whose description gives the range, and the phase
    now cites the three hospital series behind its median weeks of diagnosis. The
    prenatal detection row now says that only the Finnish abstract says what its share
    is counted over, describes the Swedish and regional series alike by the affected
    children their abstracts count, and no longer says the Swedish 74% is counted over
    that series' 19 children; the mass phenotype no longer says the mass is present at
    birth. The shared notes now say that denominators are named wherever the source
    gives one, that they span nearly three orders of magnitude, and which figures come
    without a count. The sex distribution row adds two series' own counts (37 female and
    18 male among 55 operated neonates without a recurrence; 29 female patients, given
    as 89%, in an older series of 36, a share that does not fit 36) and three sources
    that restate a female excess of about 3:1, and its wording follows its source:
    females rather than girls, and maternal race/ethnicity. No new reference caches.
    Validated with just validate and count-verified-snippets (289 of 289).

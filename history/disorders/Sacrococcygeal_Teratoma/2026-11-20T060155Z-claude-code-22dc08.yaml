  summary: Alpha-fetoprotein with its age-specific intervals and recurrence cut-off,
    and hCG
  details: |
    Adds a biochemical section. Serum alpha-fetoprotein is bound to NCIT:C16278 and
    LOINC:1834-1. Its one reference range is a Dutch nationwide cohort of 57 children followed
    after resection, whose recurrence cut-off of 55 ug/L is recorded as two interpretation
    bands, with a sensitivity of 50% and a specificity of 100% for recurrence overall; the
    authors add that values above it can indicate malignant recurrence especially
    (PMID:38418277). The population reference figures are in the record's notes and evidence
    rather than as reference ranges, since the repository carries a population interval as a
    range only where it anchors a band the disease owns: in 260 term and near-term newborns,
    15.7 to 146.5 ug/mL at birth and 9.7 to 111.9 ug/mL at discharge (PMID:15469851); an upper
    limit of 87 ng/mL between day 180 and day 720, with adult levels not reached by two years
    (PMID:9592840); a value in this disease is read against the child's age (PMID:42460113). A
    readout links the marker, in follow-up for recurrence, to the Malignant Yolk Sac Component
    node: a sensitivity of 96% for malignant recurrence in a systematic review, beside the
    review's caveat that its sensitivity to detect recurrence could be overestimated, because
    levels are mainly reported in patients with raised levels or at recurrence, also quoted on
    the readout and graded indirect there, since the review gives it for recurrence in general
    and it bears on the readout of the malignant component only by inference (PMID:32376010); a
    significant rise in malignant recurrence, and no prediction of mature or immature
    recurrence, in the Dutch cohort; and a markedly raised level in the malignant recurrences of
    one series, a mean that rests on about three children (PMID:7508500). The record's notes
    give the slow fall after resection, nine months on average in six infants (PMID:16621769),
    and the contested question whether the decline differs in children who recur: in a series of
    55 newborns the half-life lengthened with age, and the formula for recurrent tumours rises
    more steeply (PMID:30249359), while the dynamics did not differ in the Dutch cohort. Serum
    hCG is bound to NCIT:C2275 and the total-hCG code LOINC:19080-1, the code the
    Choriocarcinoma entry uses for serum hCG measured in units per volume, because the sources
    do not name the assay: it is sometimes measured in follow-up (PMID:9834677), was raised in 8
    of 21 children with malignant germ cell tumours from several sites (PMID:1696831), and one
    infant's immature teratoma secreted it (PMID:26859587). A third record gives maternal serum
    alpha-fetoprotein and total beta-hCG at 15 weeks, not raised in ten pregnancies with the
    tumour, so second-trimester trisomy screening does not detect it (PMID:9021828). The
    alpha-fetoprotein surveillance row in diagnosis now binds LOINC:1834-1 under measurements,
    replacing a note that said no LOINC code could be checked, and neither its reference-study
    explanation nor the phenotype's explanation of the same study calls the infants healthy any
    longer; the row's explanation also gives their age range and the term births as the abstract
    does, and the phenotype's says a single neonatal value is hard to read, and names the term
    babies and the births before the 37th gestational week its means come from. The row's
    description now gives the review's own words, an accuracy for recurrence that seems
    promising and a sensitivity that could be overestimated, and the phenotype's explanation
    gives the review's reason in the review's terms, with its count of 83 of the 111 patients
    with a recurrence whose level was reported. The row's own copy of the caveat is now
    explained as the source of the description's warning, and the subgroup in which everyone was
    measured is no longer called the only unbiased one, only less exposed than the review's
    figures across all included studies to the selection the caveat describes. The description
    also no longer says the infant level plateaus well above the adult range: the reference
    study's plateau mean is 8 ng/mL, against adult levels of 0 to 6 ng/mL (PMID:9592840). The
    entry notes no longer say that every cached source is an abstract, since a letter is cached
    as a full text, and their list of source types no longer counts the sources. Two cited
    sources mention the coccyx: a series removed it with the tumour (PMID:7508500), and a letter
    describes resection with coccygectomy (PMID:42460113). So the resection row's note no longer
    says that no cited source mentions coccygectomy or that the word coccyx appears only in the
    site name, the review notes no longer say that no cited source mentions coccygectomy, and
    the note now says that each cited source that mentions the coccyx describes removing it with
    the tumour. Two further rewordings, not prompted by a new source, are made in the same pass:
    the review notes' sentence on the Altman classification no longer depends on what other
    sources state, and the entry notes describe the JEB treatment study as a single-arm
    treatment study, since its abstract does not say phase II. Nine references are cached for
    the first time. Validation: just validate passes, all 131 snippets verify, and the full gate
    set passes.

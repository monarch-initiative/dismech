  summary: Differential diagnoses of a sacral mass
  details: |
    Adds a differential_diagnoses section of six rows, placed between prevalence and
    discussions: myelomeningocele (MONDO:0019773), with a case report of a cystic tumour that
    mimicked a meningomyelocele, in which three-dimensional power Doppler helped make the
    correct prenatal diagnosis (PMID:19484739), one centre's re-assessment that re-classified
    one referral as a myelomeningocele (PMID:16985105), and both conditions named as the main
    clinical differentials in two cases of presacral neuroblastoma (PMID:33307929); anterior
    sacral meningocele, bound to the broader meningocele (MONDO:0001147) because MONDO has no
    term for it, with the lesion itself as the HPO phenotype HP:0007293, from a report of two
    siblings in whom it and presacral teratoma occurred with no bony sacral abnormality on
    imaging, in a family whose history resembles Currarino syndrome (PMID:11733920), and from
    the case report's warning that a cystic teratoma may be misdiagnosed as an anterior sacral
    meningomyelocele (PMID:19484739); the presacral teratoma of Currarino syndrome
    (MONDO:0008305), with its lower malignancy risk, from a Dutch national series already cited
    on the resection row and a global cohort already cited in the progression section
    (PMID:25746708, PMID:42250912); presacral neuroblastoma, bound to neuroblastoma
    (MONDO:0005072), the Neuroblastoma entry's term, because MONDO has no presacral
    neuroblastoma term, told apart by histology, from a newborn whose imaging suggested an
    Altman type III teratoma and two congenital cases (PMID:15793740, PMID:33307929); fetus in
    fetu, which has no MONDO term, with both theories of its origin and the review's case
    definition, from a systematic review of 241 single and 33 multiple cases, a systematic
    review of 17 fetiform teratomas and a case report (PMID:39479419, PMID:40515865,
    PMID:40041259); and sacrococcygeal chordoma, bound to spinal chordoma (MONDO:0002894), from
    one adolescent case (PMID:9165473). The neuroblastoma row leaves out the two congenital
    tumours' MYCN result. The myelomeningocele row grades two quotes indirect: the case report's
    framing, because its term, anterior sacral meningomyelocele, sits between that row and the
    anterior sacral meningocele row, and the neuroblastoma report's differentials, because they
    are drawn from a third condition; the anterior sacral meningocele row says that the familial
    report's presacral teratoma may be the Currarino lesion rather than this tumour, and grades
    its quotes indirect. The notes of the anterior sacral meningocele, neuroblastoma and fetus
    in fetu rows give the MONDO searches as run on the local MONDO build, and for fetus in fetu
    also on OLS. Three kinds of source found in the search are left for a follow-up change,
    because citing them would mean rewording passages that another change to this entry rewrites
    (the first node's note on origin, the Altman discussion and the coccyx note): a terminal
    myelocystocele case report that defines the four Altman types, an imaging review that names
    the caudal cell mass as the tumour's origin, and five case reports that mention the coccyx
    other than its removal. The summary of source types that opens the entry notes is reworded
    without its counts, with the same wording as three other changes to this entry, because two
    of the new sources are cached as full texts and its list of source types does not cover the
    new reviews. Seven references are cached for the first time, two that were already cached
    for another entry are cited here for the first time, and MONDO:0001147 and MONDO:0002894
    have label cache rows, and these two and MONDO:0019773 have enum cache rows. Validation:
    just validate passes, all 152 snippets verify, and the full gate set passes.

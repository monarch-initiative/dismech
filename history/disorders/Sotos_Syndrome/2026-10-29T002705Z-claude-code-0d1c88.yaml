  summary: Add a sourced neuroblastoma phenotype
  details: |
    Adds a Neuroblastoma phenotype (HP:0003006) after the Neoplasia row, so the entry can join the neuroblastoma predisposition grouping. Part of the neuroblastoma expansion series (issue 15822).

    Evidence: three sentences from the GeneReviews chapter (two individuals with neuroblastoma; an absolute risk of about 1% shared with sacrococcygeal teratoma; the chapter's caveat that single case reports may be coincidental findings) and one sentence from a 2007 review (PMID:17825104) reporting one neuroblastoma in a child with a confirmed NSD1 mutation, who may be one of the GeneReviews pair. Frequency VERY_RARE (<5%).

    No causal edge points at the row, and its notes say why: the entry's only NSD1-neuroblastoma mechanism data come from NSD1 silencing in neuroblastoma cell lines, which the Reduced NSD1 Tumor-Suppressor Function node itself says do not establish the tumour spectrum of germline NSD1 haploinsufficiency. That node's evidence is not reused for the new row.

    Validation: just validate-disorders, count-verified-snippets --strict, check-snippet-grading, the whole-repo offline gates that CI runs, check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

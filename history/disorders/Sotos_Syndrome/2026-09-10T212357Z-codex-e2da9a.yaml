  summary: Restore Sotos behavioral and dental findings with source-specific evidence
  details: |
    Responded to the latest CHANGES_REQUESTED review on PR11638. Added sleep disturbance, aggressive behavior, self-injurious behavior (HP0100716 rather than self-mutilation), and hypodontia using GeneReviews and primary clinical sources. Preserved 27/38 SDSC screens versus two prior diagnoses, 60% questionnaire response, two unavailable sleep-study genotypes, clinical-only Sheth confirmation, and dental9/13 with12/13 NSD1-positive including all nine hypodontia cases; no composite behavioral percentage or selected-cohort population frequency assigned. Early bed/rise timing does not establish insomnia or circadian phase disorder. Added qualified high-palate contribution limited to respiratory sleep symptoms and GREM2/TSPEAR hypodontia hypothesis from blood expression, with tissue and mediation gaps explicit. Individualized COL6A1, CTTNBP2/NEO1 and NECTIN3/GPC4 edge explanations. Added GeneReviews neuropsychiatric screening/surveillance and specialist management advice. Preserved all prior history, AJNR dual-source/gutter corrections, age-scoped frequency corrections, and grouping gap. Aggression/self-injury causal attribution remains unresolved; generic NSD1 developmental fanout and sleep-score correlations do not establish causal edges.

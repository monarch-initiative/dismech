  details: |
    Created kb/disorders/Sotos_Syndrome.yaml (2021 lines) for MONDO:0019349, NSD1-related
    Sotos syndrome, closing claim issue #11086. Stub stubs/Sotos_Syndrome.yaml deleted.

    DEEP RESEARCH THAT ACTUALLY RAN. Two providers, both completed, no fallback used.

    (1) asta (`just research-disorder asta Sotos_Syndrome`, 9.6s) ->
    research/Sotos_Syndrome-deep-research-asta.md. It is retrieval-only and this run was
    poor: of 20 retrieved papers only three were about Sotos syndrome. The rest were
    Bartter syndrome, nasopharyngeal carcinoma, benign prostatic hyperplasia, pregnancy
    toxaemia in goats, and similar. Its reference_validation reported 37/37 verified with
    needs_review: true and two off-topic references (PMID:22169837, GEO:GSE3586). Nothing
    from this report is cited in the entry; it contributed only orientation (confirming
    NSD1/H3K36 and the APC2 link, both of which were then sourced from primary literature).

    (2) falcon / Edison (`just research-disorder falcon Sotos_Syndrome`, 677s) ->
    research/Sotos_Syndrome-deep-research-falcon.md plus one artifact
    (Sotos_Syndrome-deep-research-falcon_artifacts/artifact-00.md, a markdown summary table,
    not an image, so it is not referenced from any evidence `images:` slot). This run was
    substantive. reference_validation: 14/14 resolved, 0 not found, 0 off topic. Its ordered
    causal chain independently matches the one curated here, including its explicit
    statement that "The exact growth-effector pathway is unresolved; a simple GH/IGF excess
    mechanism has not been established" - which is the basis of the
    sotos_overgrowth_mechanism_unexplained knowledge-gap discussion.

    TERM VALIDATION FINDINGS FROM THE FALCON REPORT (none of these were bound).
    Its term_validation block reported needs_review: true, with GO:0016571 (obsolete histone
    methylation) and GO:0006306 (obsolete DNA methylation) flagged obsolete - both avoided;
    GO:0140954 (histone H3K36 dimethyltransferase activity) and GO:0040029 (epigenetic
    regulation of gene expression) were used instead. Separately, and NOT caught by the
    report's own validator, the report suggested HP:0001513 for "Overgrowth". HPO calls
    HP:0001513 "Obesity". That binding was rejected; the overgrowth phenotype is bound to
    HP:0000098 Tall stature. This is the exact failure mode the dismech-terms skill warns
    about - a resolvable CURIE naming a different concept - and it is worth recording that
    the report's own term validator did not flag it because the report never asserted a
    label for it.

    The dismech pre-edit validation hook also caught two MONDO IDs I had written from memory
    in the differential_diagnoses block: MONDO:0013994 (actually Joubert syndrome 20) for
    Malan syndrome and MONDO:0014508 (actually vitelliform macular dystrophy 4) for
    Tatton-Brown-Rahman syndrome. Both were corrected against the existing KB entries to
    MONDO:0013885 and MONDO:0014382 respectively before the file was written.

    GENEREVIEWS BASELINE (required, and present). PMID:20301652 "Sotos Syndrome." (Adam,
    Bick, Mirzaa et al.), tagged `GeneReviews` in the top-level `references:` block. Every
    phenotype named in its Clinical Characteristics section is represented in `phenotypes:`
    except two, both deliberate: malar flushing has no HPO term (searched HP via OLS; folded
    into the Distinctive Facial Appearance description instead), and maternal preeclampsia is
    a maternal rather than proband finding with no suitable proband-level HPO binding (noted
    in the entry rather than curated as a phenotype). Its Management section supplied the
    Developmental and Educational Intervention and Multisystem Surveillance treatments,
    including the explicit do-not-treat rule for ventricular dilatation without raised ICP,
    which is curated as evidence on both the imaging phenotype and the surveillance treatment.
    GeneReviews lists no Agents/Circumstances to Avoid section in the cached abstract.

    MECHANISM MODEL AND WHY. The pathophysiology is a nine-node causal chain, not a list:

      NAHR at 5q35 Sos-REP low-copy repeats  ->  NSD1 Haploinsufficiency
      NSD1 Haploinsufficiency  ->  Genome-Wide H3K36me2 Depletion
      H3K36me2 Depletion  ->  Intergenic DNA Hypomethylation (loss of DNMT3A recruitment)
      H3K36me2 Depletion  ->  Loss of Developmental Enhancer Priming
      both arms  ->  Dysregulated Developmental Transcriptional Program
      Transcriptional Program  ->  Impaired Cortical Neuronal Migration  ->  (phenotype) ID
      Transcriptional Program  ->  Impaired Mesendodermal Differentiation  ->  (phenotype) CHD
      Reduced NSD1 Tumor-Suppressor Function  ->  (phenotype) Neoplasia

    Judgement calls:

    - The NAHR node is placed UPSTREAM of haploinsufficiency rather than beside it, because
      the structural event is how one subtype reaches the dosage lesion. It carries
      `subtypes: [5q35 Microdeletion]` so it does not read as a claim about every case.
    - The two chromatin arms are separate nodes because they are separate claims evidenced in
      separate systems (Weinberg 2019 mouse/human intergenic methylation vs the 2025 JBC mESC
      enhancer-priming work). Collapsing them would have bundled two mechanisms in one node.
    - The episignature is deliberately NOT a pathophysiology node. It is curated under
      `diagnosis:` as a classifier, and the reason is recorded as an explicit
      KNOWLEDGE_GAP discussion (sotos_episignature_causal_status): the signature is measured
      in blood, the phenotype is generated in developing brain/heart/skeleton, and no cited
      study settles whether the methylation change in those tissues is causal or parallel.
      This follows the parent module's own recorded position on episignatures.
    - The overgrowth arm has NO curated edge, and that is the single most important modelling
      decision here. The entry reaches intellectual disability through APC2 (rescue-validated)
      and cardiac defects through mesendodermal differentiation, but nothing in the cited
      literature connects the chromatin lesion to a growth-plate or GH/IGF mechanism. Rather
      than draw an unsourced edge from the transcriptional node to Childhood Overgrowth and
      Advanced Bone Age, I left the gap open and recorded it as
      sotos_overgrowth_mechanism_unexplained with a proposed isogenic-chondrocyte experiment.
      The Choufani evidence item on that discussion is quoted precisely because the authors'
      interpretation ("reflects the cardinal features of SS (that is, overgrowth and
      developmental delay)") overreaches the enrichment categories they actually report.
    - Three edges are graded INDIRECT_UNKNOWN_INTERMEDIATES with `directness: INDIRECT` on
      their evidence: migration -> intellectual disability, mesendoderm -> cardiac defects,
      and tumour suppressor -> neoplasia. Each is an inference across a species, system or
      population gap and is said so in the edge description.

    MODULE CONFORMANCE. Five nodes conform to
    epigenetic_machinery_neurodevelopmental_dysregulation, including its declared key target
    "Dysregulated Neurodevelopmental Transcriptional Program". NSD1 is named in that module's
    own notes as a writer-class component, so this is the intended fit. The NAHR node and the
    tumour-suppressor node are deliberately unconformed: the module scopes structural-variant
    mechanisms out and explicitly assigns cancer biology to the cancer hallmark modules.

    SUBTYPE DECISION. Intragenic variant vs 5q35 microdeletion are `has_subtypes`, not
    separate entries. Tatton-Brown 2005 (PMID:15942875) states that every feature in deletion
    patients also occurs in intragenic-variant patients and that deletion size does not
    correlate with phenotype, so the deletion is not a contiguous-gene syndrome with its own
    features. The quantitative differences (less overgrowth, more severe learning disability,
    more progressive scoliosis) are recorded on the subtype records and on the Childhood
    Overgrowth, Intellectual Disability and Scoliosis phenotypes.

    SCOPE. NFIX-related "Sotos syndrome 2" is a separate MONDO concept, already curated as
    kb/disorders/Malan_Syndrome.yaml, and is cross-referenced as a differential diagnosis
    rather than absorbed. Biallelic APC2 loss ("Sotos syndrome 3") is likewise not curated
    here as a disease; APC2 appears only in its evidenced role as an NSD1 transcriptional
    target.

    GROUPING. No overgrowth-syndrome grouping exists in kb/groupings/ (checked all 101
    files; nothing matches overgrowth, chromatin or epigenetic). Several KB members of that
    family already exist (Weaver, Malan, Tatton-Brown-Rahman, Luscan-Lumish, Marshall-Smith,
    CHD8-related overgrowth). An "Overgrowth-Intellectual Disability Syndromes" grouping is a
    sensible follow-up but NO grouping file was created or edited by this session, as
    instructed.


  details: |
    Round answering the ai4c-reviewer review of 2026-09-08 (changes requested, 1 blocking + 3 suggestions). All four taken.

    BLOCKING - the module-conformance paragraph misdescribed the file. It claimed five nodes declared conformance and two were unconformed. Verified independently before editing: the file has 9 pathophysiology nodes and 4 conforms_to declarations, so 5 are unconformed, and the reviewer named the three unaccounted ones correctly (Intergenic DNA Hypomethylation from Loss of DNMT3A Recruitment, Loss of Developmental Enhancer Priming, Impaired Mesendodermal Lineage Differentiation).

    Corrected the count rather than adding the missing conformance, and extended the rationale to cover all five. The reasoning, now recorded in notes: the module is a deliberately coarse five-step spine and this entry is finer-grained than it. Two unconformed nodes are outside the module's subject matter (structural variant, cancer biology), as the note already said. The other three are inside its subject matter but between its steps: the DNA-hypomethylation and enhancer-priming nodes are NSD1-specific molecular intermediates sitting between the module's chromatin-imbalance step and its transcriptional step, and conforming them would either duplicate the anchor already claimed by Genome-Wide H3K36me2 Depletion or assert a one-to-one mapping the module does not offer; the mesendodermal node is non-neural, so a neurodevelopmental module has no node for it at any grain. Also recorded that the module's fifth node is phenotype-level and is covered here by phenotypes: rather than by a pathophysiology node.

    SUGGESTIONS, all three taken:
    - animal_models: the Oishi 2020 Nsd1 heterozygous mouse (PMID:31909872), the entry's first model of any kind, linked to Dysregulated Developmental Transcriptional Program. Recorded as PARTIALLY_RECAPITULATES with fidelity LOW, NOT as FAILS_TO_RECAPITULATE. The reviewer suggested the latter, and falcon reports explicit negatives (no overgrowth, no macrocephaly, no gross cortical enlargement, reduced SATB2-positive upper-layer neurons), but those come from full text that is not in the reference cache; the cached record is abstract_only and claims just 'behavioral characteristics reminiscent of some of the deficits'. A FAILS_TO_RECAPITULATE link requires substantiating evidence, and asserting a specific negative result from a source that cannot be quoted is the fabrication risk the evidence SOP exists to prevent. The limitations field records what the abstract does and does not say, and the link's own notes say what would justify upgrading it.
    - discussions: a HUMAN_MODEL_MISMATCH entry attached to the model, Childhood Overgrowth, and the transcriptional node. The mismatch is real on the cached evidence alone: the same abstract names overgrowth as one of three cardinal features and then claims only behavioural resemblance. It connects to the entry's existing overgrowth knowledge gap - a model reproducing the neurobehavioural arm but not the growth arm is evidence the two arms are separable.
    - phenotypes: ADHD (HP:0007018) and Anxiety (HP:0000739) broken out of the autism entry's prose, both quantified from the PMID:37384309 cohort, with the ADHD band left at OCCASIONAL because the authors say their own figure is probably an underestimate and the anxiety explanation recording that its 35.5% is shared with impulsive behaviour and so is an upper bound.

    VISION - went further than the suggestion. The reviewer asked for the decision on vision to be recorded, since hearing is curated and vision is absent. The same already-cached cohort reports ophthalmological disorders in 71% with strabismus and refractive defects predominating, so this is curated as a VERY_FREQUENT phenotype bound to HP:0000478 rather than dispositioned in notes. Bound the general eye term rather than strabismus or refraction alone because the snippet covers both.

    One self-inflicted defect caught before push: the first draft of the rewritten conformance paragraph split 'transcriptional-dysregulation' across a folded-scalar line break, which check-folded-hyphens flagged. Reflowed.

    Validation: schema, terms and references pass, 131/131 snippets verified (up from 124). All structural gates clean, check-folded-hyphens clean after the fix, check-cache-order and check-term-cache-integrity clean. check-snippet-length, check-title-snippets and check-snippet-grading report findings, but none is in this file and the branch trails origin/main, which makes those --against-ref gates re-check every differing entry without grandfathering.

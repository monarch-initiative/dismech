  details: |
    Round 2 of the ai4c-reviewer review. One blocking item, and it was a real error of mine.

    The Ophthalmological Abnormalities phenotype added in the previous round was banded VERY_FREQUENT on the strength of a snippet reporting 71%. The schema's FrequencyEnum defines VERY_FREQUENT as HP:0040281, 80-99%, and FREQUENT as HP:0040282, 30-79%. 71% is FREQUENT. Verified against the enum in src/dismech/schema/dismech.yaml before changing it rather than taking the review's word for the ranges.

    The compounding fault was in the evidence explanation, which asserted that the 71% quote 'is the basis both for the VERY_FREQUENT band and for binding the general eye term'. That made the entry state a justification its own quoted evidence contradicts - the same defect class as the conformance miscount that blocked round 1, and the third such instance in this batch of seven. Two changes: frequency is now FREQUENT, and the explanation now says explicitly which band 71% falls in and why, so the reasoning is checkable against the number rather than merely asserted.

    The description prose needed no change; it said 'common' and 'frequent', which was already consistent with the corrected band and inconsistent with the band that was recorded. That mismatch between prose and enum is in hindsight the signal that should have caught this before the push.

    ON THE PREVIOUS HISTORY RECORD. The reviewer also asked that the matching sentence in 2026-09-08T122326Z-claude-code-98d18b.yaml be corrected. Deliberately not done. That sentence says the phenotype 'is curated as a VERY_FREQUENT phenotype', which is an accurate account of what that session actually did, and docs/history.md holds these records to describing the session as it ran. Rewriting it would make the record false about its own round in order to make it agree with a later correction. This record is the correction, and a reader following the slug's history in order sees the band set, then sees it corrected and why. Flagged in the PR reply in case the maintainers would rather amend an unmerged record than append to it, in which case this is a one-line change.

    Validation: schema, terms and references pass, 131/131 snippets verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-cache-order and check-term-cache-integrity all clean.

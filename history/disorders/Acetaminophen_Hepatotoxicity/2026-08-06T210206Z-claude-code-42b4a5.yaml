  summary: Link exposure and susceptibility modifiers into the pathograph
  details: |
    Backfill for issue #8085. This entry exercises three of the five EnvironmentalEffectEnum values. Supratherapeutic acetaminophen exposure is TRIGGERS/DIRECT into the matching exposure node. Chronic alcohol use with CYP2E1-inducing comedications and malnutrition with eating disorders are both EXACERBATES/DIRECT into the NAPQI formation and glutathione depletion node: neither creates the pathway, one increases flux into NAPQI by inducing CYP2E1 and the other lowers the baseline glutathione pool that detoxifies it. Obesity and nonalcoholic fatty liver disease is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the acute liver injury outcome node, because the cited source reports both a higher prevalence of injury after overdose and the failure of several investigations to reproduce it, making it a susceptibility association rather than a demonstrated amplifier. Validated with just validate, just validate-terms and just validate-references (117/117 snippets). Note: this file carries one pre-existing pathograph integrity issue, a readout edge whose source is written Centrilobular hepatocyte necrosis while the node is named Centrilobular Oncotic Hepatocyte Necrosis. Confirmed byte-identical on origin/main and left untouched as out of scope for this backfill.

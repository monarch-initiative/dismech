  summary: 'Augment: Acetaminophen Hepatotoxicity (Falcon deep research)'
  details: |
    Integrated verified findings from the Falcon (Edison Scientific) deep-research report. NEC preflight passed: report is genuinely about APAP/paracetamol NAPQI hepatotoxicity. Added 10 new evidence items across 5 newly-cited PubMed-indexed reviews; every snippet independently verified as an exact (whitespace-normalized) substring of a freshly fetched abstract and every ontology term validated with OAK. Pathophysiology: Jaeschke 2024 [PMID:38265880] evidence added for mitochondrial peroxynitrite/oxidant stress on the mitochondrial node; oncotic necrosis plus mitochondria-derived-endonuclease nuclear DNA fragmentation point-of-no-return on the necrosis node; Kupffer-cell/monocyte-derived-macrophage/neutrophil sterile-inflammation effectors on the inflammation node, and a monocyte-derived macrophage cell type [CL:0000235]. Phenotypes: Increased intracranial pressure [HP:0002516] from Fernandez 2024 [PMID:39170946]. Biochemical: acetaminophen-protein adducts APAP-CYS from Prescott 2024 [PMID:37683599] and circulating CXCL14 emerging prognostic biomarker from Umbaugh 2024 [PMID:38217408]. Treatments: Fomepizole [CHEBI:5141, SMALL_MOLECULE] from Jaeschke 2024, and N-acetylcysteine strengthened with Prescott 2024 and Bateman 2022 [PMID:34957591]. DOI-cached refs were converted to PMID so CI snippet validation covers them. validate-schema, validate-references, validate-terms all pass.

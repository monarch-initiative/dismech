  summary: 'Create: Turnpenny-Fry Syndrome (PCGF2)'
  details: |
    New entry for Turnpenny-Fry syndrome (MONDO:0032707, PCGF2). Deep research with the claude_code provider: the first run ended with answer_status unsuccessful (it could not open the Turnpenny 2018 full text) and was deleted unused; the second run succeeded and is committed (research/Turnpenny-Fry_Syndrome-deep-research-claude_code.md; 5/6 report quotes valid, the failing one from the uncached full text and not used). just preflight-dr returned WARN only because PRC1, the complex PCGF2 belongs to, is counted as a second gene. The Turnpenny et al. 2018 series (PMID:30343942) caches as abstract only even with --force, so per-feature counts were quoted from the comparison table in PMID:38283775, whose last column reproduces the 2018 counts; the entry's notes say so. Other sources: DDD 2015, Ercoskun 2022, Qi 2022 (mosaic father, molecular dynamics), the 2024 T-ALL case, the 2025 adult epilepsy case, the Mel18 knockout mouse (Akasaka 1996), the 2024 Pcgf2-null ESC chromatin-loop study, and the ClinGen CGGV record (raised to Definitive in 2026; the committed export still lists the older Strong assertion, so the current record was fetched from a fresh export). The mechanism is unknown, so every edge below the PRC1 node is INDIRECT_UNKNOWN_INTERMEDIATES and the dominant-negative model is an EMERGING hypothesis. Abnormal heart morphology carries coarse_binding_basis VARIABLE_SPECTRUM because per-lesion counts are only in the uncached full text. Feeding, gastrointestinal, hearing, genitourinary, prenatal and leukemia phenotypes are left without an upstream edge because no mechanism is described. No GeneReviews chapter (just check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-name-collisions, check-snippet-grading, check-gene-validity, check-coarse-phenotypes, check-logical-rules and validate-disorders.

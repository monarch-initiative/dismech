  summary: 'Create: Transketolase Deficiency (TKT / SDDHD)'
  details: |
    Created new dismech Disease entry for Transketolase Deficiency (MONDO:0014881, OMIM:617044, ORPHA:488618, gene TKT hgnc:11834) as the first increment of IEMbase WP-008 issue 5563, pentose phosphate metabolism row 3.5.04.01. NEC preflight confirmed gene/OMIM/ORPHA against the MONDO record. All evidence sourced from the defining whole-exome study Boyle et al. 2016 PMID:27259054 with exact-quote snippets. Modeled non-oxidative PPP block to polyol/pentose-phosphate accumulation to reduced NADPH/glutathione redox and impaired nucleic-acid synthesis as pathophysiology nodes. Review follow-up corrected the downstream target name to the matching NADPH pathophysiology node and added VERY_FREQUENT frequency for congenital heart defect based on the 4/5 cohort evidence. Validated with just validate, validate-references, and validate-terms, all pass.

  summary: Address automated review on PR 7759
  details: |
    Addressed 5 blocking items from the automated reviewer, 0 critical. Added four missing phenotypes: Congenital Heart Defect HP:0001627 with a snippet-backed evidence item from PMID:34713961, plus Delayed Speech and Language Development HP:0000750 at 11 of 11, Motor Delay HP:0001270 at 16 of 18, Scoliosis HP:0002650 at 8 of 10 and Behavioral Abnormality HP:0000708 at 11 of 19 — these four carry no evidence block by design because their denominators live in Nostvik 2021 full text that is not cached, so frequency is omitted and the derivation recorded in notes. Corrected HP:0001274 Agenesis of corpus callosum to HP:0001273 Abnormal corpus callosum morphology: the source reports dysgenesis, and agenesis asserts complete absence, a strictly stronger claim. Corrected the metabolic exclusion panel from NCIT:C19770 Molecular Analysis to NCIT:C25294 Laboratory Procedure, since urine GAGs, organic acids, tandem MS and plasma lactate are biochemical not molecular; the genuinely molecular tRNA pseudouridine assay retains NCIT:C19770. On HP:0001627 a sibling reviewer suggested it lacks congenital semantics; OAK shows it carries Congenital heart defect as an EXACT synonym and the source names no specific lesion, so it is the correct binding rather than a fallback, and that reasoning is recorded in the phenotype notes. Also renamed the ophthalmology treatment to Ophthalmological Surveillance to match its Eye Examination action term, and expanded the rehabilitation treatment target_phenotypes to include the new motor, speech and scoliosis terms. Validation: just validate passed, just validate-terms passed, just validate-references reported 86 of 86 snippets verified, just validate-history-all passed.

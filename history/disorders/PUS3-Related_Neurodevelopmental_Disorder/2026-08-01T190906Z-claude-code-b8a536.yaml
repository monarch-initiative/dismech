  summary: 'Create: PUS3-Related Neurodevelopmental Disorder'
  details: |
    Created the dismech entry for MONDO:0014886. Identity was established BEFORE deep research: the MONDO record has no definition text but carries the gene-association line RO:0004003 HGNC:25461 PUS3 plus xref OMIM:617051 and xref Orphanet:488627, and the NCBI MedGen record for the same concept supplies the OMIM definition of NEDMIGS citing Shaheen 2016 and Froukh 2020. Gene established as PUS3, hgnc:25461. NEC preflight PASSED on the Edison/Falcon deep-research report: it is anchored on PUS3 and OMIM 617051 and did not drift onto GM1 gangliosidosis or the mucolipidoses despite the dermal-melanocytosis label. Deep-research provider falcon/Edison, 571 second runtime, 15 citations, one markdown artifact. DR output was used only as leads; every PMID was fetched with just fetch-reference and every snippet verified against the cached abstract. Three cited papers have no PubMed abstract and are listed under references only, with no snippet-backed evidence item. No GeneReviews chapter exists for PUS3, confirmed by an empty E-utilities search. Orphanet prevalence was not adopted because refresh-orphadata currently fails its manifest checksum upstream, so a qualitative ULTRA_RARE prevalence class backed by a published case count is used instead. Two KNOWLEDGE_GAP discussions were added: the unmeasured translation step, and whether extensive dermal melanocytosis generalises beyond the founding family. Validation: just validate passed, just validate-terms passed, just validate-references reported 85 of 85 snippets verified.

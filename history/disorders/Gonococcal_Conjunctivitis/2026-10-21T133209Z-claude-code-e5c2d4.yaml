  details: |
    Two round-2 items. (1) The Haemorrhagic conjunctivitis phenotype description claimed no haemorrhage-specific HP term exists, which one search refutes (HP:0011896 Subconjunctival hemorrhage). Moved the provenance from description to notes and made it an honest, re-run search record: l~hemorrhagic conjunctivitis returns nothing, l~conjunctival h returns only hyperemia/hamartoma/hyperpigmentation, l~subconjunctival returns HP:0011896 Subconjunctival hemorrhage - a discrete subconjunctival bleed, not the diffuse hemorrhagic conjunctivitis the Glasgow series describes - so the term is rejected and the binding stays omitted (no term beats a bad one). (2) The Corneal perforation phenotype quoted PMID:18064057's aim statement graded PRIMARY_RESULT; replaced it with that paper's result sentence already in the file ('corneal perforation occurred with a mean duration of 11 days after development of conjunctivitis') and dropped quote_role. validate, count-verified-snippets (28/28), check-folded-hyphens, check-title-snippets and check-block-scalar-comments all pass.

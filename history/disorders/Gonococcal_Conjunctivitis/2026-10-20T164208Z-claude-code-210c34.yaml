  details: |
    Addressed the six IMPORTANT review items, all from references already cached in the PR. (1) Wired the three terminal pathophysiology nodes to their phenotypes as bare-name downstream targets; also wired the three new phenotypes, so list-disconnected-phenotypes now reports 6/6 connected. (2) Added therapeutic_agent ceftriaxone (CHEBI:29007) and azithromycin (CHEBI:2955) to the ceftriaxone treatment. (3) Added the two cached model systems - a human-CEACAM transgenic mouse (PMID:29760215) and an in-vitro human epithelial cell assay (PMID:31119630) - each linked to Opa-CEACAM Epithelial Uptake as PARTIALLY_RECAPITULATES/LOW with a BOUNDARY_OMISSION divergence for the absent ocular surface; model-scale-audit reports both ALIGNED. (4) Added a neonatal ocular antimicrobial prophylaxis treatment (PMID:8771523) targeting the inoculation node. (5) Added the three >10% phenotypes from the Glasgow series (PMID:34211138): preseptal cellulitis 60% (HP:0100658), keratitis 33% (HP:0000491), and haemorrhagic conjunctivitis 67% (term omitted - no haemorrhage-specific HP term exists). (6) Regraded the four PMID:41222259 and PMID:31119630 items from quote_role REVIEW_SYNTHESIS to BACKGROUND. validate, validate-terms and count-verified-snippets (28/28) all pass. Deferred optional suggestions (progression, prevalence, AMR note, mappings) to keep the push bounded.

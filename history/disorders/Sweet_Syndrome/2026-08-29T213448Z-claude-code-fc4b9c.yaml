  summary: 'Review: Sweet Syndrome evidence re-read against cached sources'
  details: |
    Re-read all 5 cached references and re-verified all 34 evidence items. Every snippet is
    an exact substring of its cache, including quotes drawn from the 2963-line PDF-derived full
    text of PMID:17655751 where several otherwise-attractive sentences are broken by
    line-hyphenation and would not validate. No Named Entity Confusion; every cited paper is
    Sweet-syndrome-specific.

    Fixed in this pass:
    - diagnosis[Clinicopathologic diagnostic criteria (major plus minor)] was evidenced by a
      table-of-contents sentence from PMID:8089280 listing what that review covers
      ("reviews its epidemiology, clinical spectrum, histologic features, ...") - a
      non-propositional scope sentence substantiating none of the criteria the record
      describes. The actual von den Driesch criteria rule is reproduced verbatim in the other
      cached reference, so the record now cites PMID:17655751 ("The presence of both major
      criteria (1 and 2), and two of the four minor criteria (3, 4, 5, and 6) is required in
      order to establish the diagnosis of classical Sweet's syndrome") and keeps PMID:8089280
      as a PARTIAL item quoting its propositional cohort sentence instead.

    Recorded, not fixed:
    - phenotypes[Leukocytosis] binds HP:0001974 (increased total leukocyte count) but quotes
      neutrophilia; the same cache states leukocytosis directly.
    - phenotypes[Elevated inflammatory markers] binds an explicitly CRP term but its quote
      says only "elevated markers of inflammation" - and the identical snippet from the same
      paper is graded PARTIAL eleven lines later for an equally indirect ESR claim.
    - biochemical thresholds (neutrophils >70%, leukocytes >8,000/uL) are attributed to a
      systematic review that does not report them; they are quotable from PMID:17655751's
      Table 1.
    - Treatment prose details unsupported by any cited reference: a 0.5 mg/kg/day steroid
      lower bound (the source says 1 mg/kg/day), potassium iodide "when corticosteroids are
      contraindicated", G6PD screening before dapsone, and azathioprine as a culprit drug.

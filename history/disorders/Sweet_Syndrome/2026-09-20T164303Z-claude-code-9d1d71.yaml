  summary: 'Genetics pass: first genetic block; MEFV graded DISPUTED, UBA1 added'
  details: |
    Genetics pass for issue 12206. The entry had no genetic: block at all while MONDO records MEFV as a causal gene. Research first, checklist after, and the research does not support the MONDO edge. The entire published corpus linking MEFV to Sweet syndrome is two case reports - the index report (PMID:18824843), in a patient who also had chronic myelogenous leukaemia and carried E148Q/R202Q, whose own title calls MEFV a possible modifier; and a 2015 letter on Sweet syndrome in myelodysplastic syndrome that carries no abstract. Both patients had a concurrent myeloid neoplasm, itself a recognised Sweet trigger. A systematic review addressing exactly this question (PMID:34159892) concluded the evidence is insufficient. ClinGen curates MEFV only for familial Mediterranean fever. MEFV is therefore recorded with relationship_type: DISPUTED, carrying the case report as SUPPORT and the systematic review as REFUTE, so the claim stays visible with its counter-evidence rather than being silently dropped. Separately added UBA1 as SOMATIC_DRIVER with variant_origin SOMATIC - somatic UBA1 at methionine-41 causes VEXAS syndrome, whose skin lesions frequently take the form of a histiocytoid Sweet-like neutrophilic dermatosis (PMID:33108101, PMID:38865133) - which is the best-supported genetic association of the Sweet phenotype and is not the gene MONDO names. Added a new upstream pathophysiology node, Clonal Myeloid Somatic Mutation, carrying UBA1 and feeding the existing cytokine core node, evidenced by a transcriptomic comparison of VEXAS, myelodysplasia cutis and idiopathic Sweet skin (PMID:40072458). Updated a notes sentence that said no genetic block existed, which this change made stale. Gene-to-mechanism wiring 0/0 to 1/1. Note that tag-references wanted to promote PMID:20301735 - a retired Majeed Syndrome GeneReviews chapter named in notes only to explain that it is a different disease - into the top-level references block; that is issue 12329 and the change was reverted.

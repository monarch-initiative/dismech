  summary: 'Review round 1: bind the progenitor cell where the UBA1 lesion arises'
  details: |
    First review round on PR 12340, also reached independently in self-review. The Clonal Myeloid Somatic Mutation node located the somatic UBA1 variant in haematopoietic progenitor cells in its description but bound only CL:0000775 neutrophil, which is clone progeny rather than the cell the lesion arises in. Added CL:0008001 hematopoietic precursor cell alongside the neutrophil binding rather than replacing it, since both are real: the lesion is in the precursor and the dermal infiltrate is neutrophilic. CL:0008001 was chosen over the reviewer's suggested CL:0000049 and CL:0000037 because it is the exact generic for the phrase the sources use; it is already in cache/cl/terms.csv and the celltypeterm enum cache, so the binding validates offline. Also softened the node description from 'indistinguishable from Sweet syndrome' to 'clinically and histologically mimics Sweet syndrome', matching the source's own word, and added the sentence carrying that wording as a third evidence item.

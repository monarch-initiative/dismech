  summary: 'Create: Autosomal_Dominant_Nonsyndromic_Hearing_Loss_53'
  details: |
    Curated DFNA53 as a deliberately thin Disease entry after establishing that it is a mapped linkage locus with no identified gene. Evidence base: PMID:15958501 (the single published report; PubMed returns exactly one record for DFNA53), PMID:37371710 (2023 DFNA narrative review, whose locus table still lists the gene as unknown), and the GeneReviews Genetic Hearing Loss Overview for class-level care. No ClinGen gene-disease validity assertion exists against MONDO:0012380; HPO and MedGen record no associated gene; MONDO's term is live and defines the entity by chromosome region. Four candidate genes (COCH, SLC22A17, EFS, HSPC156) were sequenced and excluded by the mapping study and none was adopted here. The pathograph runs from an explicitly unidentified 14q11.2-q12 allele (mechanism_confidence PROVISIONAL) through a cochlear-dysfunction node evidenced by DPOAE to the two audiometric phenotypes; no molecular mechanism is asserted. An OUT_OF_SCOPE ruling was considered and rejected; the reasoning against it, and the DFNB46 and DFNA47 precedents, are recorded in the entry notes. Deep research: falcon returned HTTP 402 (out of credits) and the claude_code fallback produced the report; preflight-dr returned SKIP (MONDO records no causal gene, so the gene-identity check cannot discriminate) with OMIM 609965 matching on both sides.

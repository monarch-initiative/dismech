  details: |
    Added a LOINC-coded pure-tone air-conduction audiometry measurement set to the existing Audiometric and pedigree diagnosis row, matching the exact seven frequencies (250/500/1000/2000/4000/6000/8000 Hz per ear) the founding report states it tested, with a clarifying sentence restricting the codes to air-conduction pure-tone audiometry only (not bone-conduction audiometry, otoscopy, oto-immittance or DPOAE, also described in that row). The 250/6000/8000 Hz per-ear LOINC codes were absent from origin/main and were seeded as six new, additive cache/loinc/terms.csv rows. No reference range is bound: the entry's own phenotype section reports severity ranging from mild to profound with variable expressivity within and between generations, so no single WHO/GBD band would represent the pedigree's range.

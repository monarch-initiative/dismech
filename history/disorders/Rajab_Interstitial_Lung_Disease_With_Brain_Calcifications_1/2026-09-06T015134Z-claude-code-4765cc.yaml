  summary: Take the three offline follow-ups from the approving review
  details: |
    The ai4c-reviewer APPROVED the PR and left five non-blocking follow-ups. Two of them (commit the derived cache rows for the five new CURIEs; re-ground cerebral calcification, ILD and liver disease on FARSB-specific quotes from PMID:29979980 and PMID:30014610) need the NCBI and ontology services this session's egress policy still returns 403 for, and are left for a network-enabled run. The other three needed no network and are taken here, bundled into one push rather than left as debt. First, a real accuracy defect the reviewer caught: the description and the interstitial-lung-disease explanation both said the 86-100% figure was the frequency 'in FARSB-deficient patients', but that band is shared across FARSA, FARSB and MARS1 deficiency and is not a FARSB point estimate. This was the entry contradicting its own standard, since the growth and anemia phenotypes already say in terms that their bands span multiple genes. Both passages now say so, and note that unlike those two bands this one lies wholly inside VERY_FREQUENT, which is why the ILD phenotype keeps a frequency where growth and anemia carry none. Second, added a classifications block following the sibling cytoplasmic-ARS entry Neurodevelopmental_Disorder_with_Microcephaly_Seizures_and_Cortical_Atrophy (VARS1): icimd_category non_mitochondrial_trna_metabolism, which is exactly right for a cytoplasmic tRNA synthetase and distinguishes it from mitochondrial FARS2; and harrisons_chapter RESPIRATORY with its own evidence item, assigned on the organ system that determines outcome rather than the one that names the disease, with a note explaining why this differs from the VARS1 entry's NEUROLOGIC assignment. Third, trimmed the curation-session provenance out of notes. The reviewer observed that much of that block described this session's environment rather than the disease, duplicated the history records, and would rot the moment somebody does the fetch. Kept: the evidence-base statement, the fetch-first paper list, the precisely named gaps, the cross-ARS1 frequency caveat, the two unasserted mechanistic features, the term-cache follow-up, the GeneReviews absence, the cross-references and why they cannot go in a mappings block. Removed: the sandbox narration, which now lives only in history/. Also swept the same session narration out of the variant descriptions, the prevalence note and two phenotype descriptions, so the entry no longer refers to the conditions it was written under anywhere in its disease content. Validation: schema No issues found; snippets 30/30 verified (the new harrisons_chapter evidence item is the thirtieth); entity-refs, causal-targets, duplicate-keys, folded-hyphens, snippet-length, title-snippets, snippet-grading, enum-values, qualifier-terms all OK. Weighted compliance 74.4 to 74.2 percent, unchanged in substance. Note this push resets the approval, which is the accepted cost of not leaving a known misattribution in the entry.

  details: |
    Created the FARSB entity (RILDBC1) from the stubs/ queue; the stub is deleted in the same change. Deep research: the requested provider (falcon/Edison) could NOT run - this sandbox's network egress policy returns 403 for api.futurehouse.org, so Edison authentication failed. The provider actually used was claude_code (research/Rajab_Interstitial_Lung_Disease_With_Brain_Calcifications_1-deep-research-claude_code.md), which works here because it drives server-side WebSearch rather than an external provider API: 40 web searches, 48 turns, 23 citations, 414s. No --fallback flag was used because the fallback would have hit the same egress policy for every other external provider (openscientist, asta, perplexity, openai are all blocked); claude_code was selected deliberately, not by automatic fallback, and this note is the record of that substitution. The report carries no reference_validation or term_validation frontmatter block because both of those checks also require blocked hosts (eutils, OLS). CRITICAL LIMITATION on the evidence base: NCBI E-utilities is blocked, so just fetch-reference could cache no new reference at all (verified: PMID:29979980 returns 'Tunnel connection failed: 403 Forbidden'). Every citation in the entry is therefore drawn from the pre-existing references_cache/, which holds no FARSB-specific primary paper. The three cited references are ARS1-family papers that do carry genuine FARSB-specific data - PMID:40044141 (438-patient cross-ARS1 phenotype/treatment review, full text), PMID:34194004 (the aminoacylation/thermostability/amino-acid treatment study whose FARSB patient is individually characterised, full text) and PMID:39702998 (tRNA therapeutics review covering the same treated cohort, full text). The disease-defining primary literature (PMID:29979980 Xu 2018 AJHG, PMID:30014610 Zadjali 2018, PMID:29573043 Antonellis 2018, PMID:19161147 Rajab 2009, Schuch 2021) is cited nowhere and is named in the entry notes as the fetch-first list for the next curator. The named consequence, disclosed in the entry: the brain calcification that names the disease carries only a cross-ARS1 CNS-imaging frequency graded directness INDIRECT, and cholesterol pneumonitis plus the variant spectrum are omitted entirely, because no cached source states them for FARSB. Cross-ARS1 cohort frequencies are labelled as such in the explanations rather than being presented as RILDBC1 figures. Validation actually run and passed: just validate schema step (No issues found); just count-verified-snippets 23/23 verified; check-entity-refs OK; check-causal-targets OK; check-duplicate-keys OK; check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-qualifier-terms all OK. Validation NOT passed: the term-validation step cannot complete - OLS returns 403 through the proxy. Run offline against the committed cache, exactly two distinct CURIEs fail and both only because they are new to this repo: MONDO:0100215 (disease term) and hgnc:17800 (FARSB). Every other binding (all HP, GO, NCIT terms) validates offline. Those two are corroborated by the MONDO-derived stub record and by the deep-research report, but are NOT machine-verified and must be re-validated with network access before this entry should be trusted or merged.

  summary: Correct the frequency-tier justification (VERY_FREQUENT is 80-99, not 80-100)
  details: |
    Fixes a factual error in this entry's own reasoning prose, caught as a non-blocking nitpick on the second approving review. Two passages added in the previous round justified keeping frequency VERY_FREQUENT on the interstitial-lung-disease phenotype by saying the source's 86-100% band 'lies wholly within VERY_FREQUENT'. That is wrong. Checked against FrequencyEnum in src/dismech/schema/dismech.yaml: VERY_FREQUENT is HP:0040281 and covers 80-99%, while 100% is OBLIGATE, HP:0040280. The band therefore straddles the VERY_FREQUENT/OBLIGATE boundary at its top endpoint, in the same way the growth (50-100%) and anemia (47-82%) bands straddle FREQUENT/VERY_FREQUENT. The tier itself is unchanged and remains correct: what distinguishes this band from those two is that it does not straddle the FREQUENT/VERY_FREQUENT boundary, so a tier can be assigned at all, and VERY_FREQUENT is the conservative choice with no FARSB-specific point estimate available. Both passages now say that instead. Swept the rest of the entry's frequency prose for the same class of error and found none: the 50-100% and 47-82% descriptions state their straddled boundary correctly. Validation: schema No issues found; snippets 30/30 verified; folded-hyphens and duplicate-keys OK. This push resets the approval for the third time, for a prose-only correction; the alternative was leaving a statement in the entry that its own schema contradicts.

  details: |
    Responds to the ai4c-reviewer changes-requested review on PR 11207. KEY FACT that shapes this round: the reviewer re-ran just fetch-reference on a CI runner and it succeeded, and concluded the network blocker had lifted. It has not lifted for this curation session. Re-tested here immediately on receiving the review: just fetch-reference PMID:29979980 still returns 'Tunnel connection failed: 403 Forbidden'. The block is a property of this sandbox's egress policy, not of the repository or CI. So the reviewer's blocking item - fetch PMID:29979980 and PMID:30014610, commit the cache files, and re-ground Cerebral Calcification on FARSB-specific verbatim quotes with directness DIRECT - CANNOT be done from here and is left undone. The review quotes those verbatim sentences, and they were deliberately NOT pasted into the entry: a snippet whose source has no committed references_cache file cannot be checked offline, while validate-disorders in CI silently network-fetches it and reports it verified, which is the exact silent-CI-pass failure mode CLAUDE.md warns about. Applied instead, all offline: rebound the two GO terms to the specific children the reviewer verified resolve (GO:0004812 -> GO:0004826 phenylalanine-tRNA ligase activity, GO:0006418 -> GO:0006432 phenylalanyl-tRNA aminoacylation); added therapeutic_agent CHEBI:17295 L-phenylalanine to the supplementation treatment; added a five-allele variants list under genetic (the c.3G>T/c.1118G>C pair that carries the verified quote, plus the Omani founder c.853G>A, c.767C>T and c.848+1G>A recorded explicitly WITHOUT evidence and with the reason on each); added a prevalence record as CASES_IN_LITERATURE/ULTRA_RARE with no numeric rate, since the ORPHA:178506 record is not among the 349 cached Orphanet files and Orphadata is unreachable; added differential_diagnoses covering FARS2 (the Named Entity Confusion risk the reviewer flagged, and the reason the only nearby GeneReviews chapter is not this disease's), RILDBC2/FARSA, Aicardi-Goutieres, and primary familial brain calcification; recorded in notes that GeneReviews was checked and has no FARSB chapter. Rewrote the notes passages the reviewer correctly called stale: they had asserted the fetcher was blocked in general and that MONDO:0100215 and hgnc:17800 must be re-validated before the entry is trusted. Both now say the block was sandbox-specific and record that the reviewer verified all five new CURIEs resolve with matching labels. DISAGREED with one review item, with reason: the reviewer asked for a mappings block carrying OMIM #613658, ORPHA:178506 and MedGen C3150910, but DiseaseMappings in this schema admits only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings - there is no slot for those three, so it would be a schema change rather than a curation edit. Those identifiers are recorded in notes instead. NOT done, and stated as outstanding: the derived cache rows for the five new CURIEs are still uncommitted, because deriving them requires the ontology service this sandbox cannot reach. Validation run: schema No issues found; snippets 29/29 verified; entity-refs, causal-targets, duplicate-keys (one duplicate genetic notes key introduced during this round was caught and merged), folded-hyphens, snippet-length, title-snippets, snippet-grading, enum-values, qualifier-terms all OK. Weighted compliance falls 83.5 to 74.4 percent, because the variants, prevalence and differential_diagnoses blocks added this round are unevidenced by necessity; that is the score counting real missing evidence rather than a regression.

  summary: Reviewed and expanded Schinzel-Giedion syndrome entry with subtypes, epidemiological and clinical
    sections, 18 additional HPO-bound phenotypes, causal link types and edge evidence across all pathophysiology
    edges, and corrected evidence grading and differential diagnosis sourcing.
  details: '1. Causal connectivity and pathophysiology: Connected all 22 curated phenotypes from SETBP1
    pathophysiology nodes (0 disconnected phenotypes), removed the redundant ORGANISM-scale Refractory
    epilepsy wrapper node in favor of a direct edge from Impaired neurogenesis and neuronal migration
    to Seizure, added causal_link_type and verbatim evidence to all downstream edges, and expanded locations
    and biological_processes on Disrupted visceral and craniofacial morphogenesis (kidney, heart, skull,
    face, skeletal system). 2. Phenotype expansion: Expanded from 4 to 22 phenotypes by adding Brain atrophy
    (HP:0012444), Ventriculomegaly (HP:0002119), Hypotonia (HP:0001252), Spasticity (HP:0001257), Dysautonomia
    (HP:0012332), Sleep disturbance (HP:0002360), Hearing impairment (HP:0000365), Cerebral visual impairment
    (HP:0100704), Feeding difficulties (HP:0011968), Recurrent pyelonephritis (HP:0012787), Chronic kidney
    disease (HP:0012622), Genital anomalies (HP:0000078), Congenital heart defects (HP:0001627), Midface
    retrusion (HP:0011800), Choanal stenosis (HP:0000452), Talipes equinovarus (HP:0001762), Neuroepithelial
    neoplasia (HP:0004375), and Recurrent infections (HP:0002719), with sequelae on Hydronephrosis to
    Recurrent pyelonephritis and Chronic kidney disease. 3. Subtypes, epidemiology, and diagnosis: Added
    synonyms and structured Classic and Atypical subtypes in has_subtypes referenced by prevalence; split
    combined ultrasound/MRI surveillance into separate Ultrasound Imaging (NCIT:C17230) and Magnetic Resonance
    Imaging (NCIT:C16809) diagnosis entries. 4. Genetics, treatments, differential diagnoses, and evidence
    hygiene: Added ClinGen DEFINITIVE gene_disease_validity for SETBP1, added Avoidance of nephrotoxic
    agents (NCIT:C15843 with NSAID and vancomycin therapeutic_agent bindings) and Genetic counseling (NCIT:C15240),
    reclassified PMID:37872881 background quotes to HUMAN_CLINICAL + BACKGROUND, replaced PMID:39825586 aim
    statements with result/clinical quotes (including PMID:38585550 and PMID:34807554 for MRD29), removed
    unsourced Kabuki syndrome differential and single-case datasets entry (PMID:36147799), and updated
    references.'

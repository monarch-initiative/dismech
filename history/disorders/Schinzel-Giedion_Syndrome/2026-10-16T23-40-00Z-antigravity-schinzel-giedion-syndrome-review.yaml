  summary: >-
    Reviewed and expanded Schinzel-Giedion syndrome entry with missing clinical
    and epidemiological sections, 9 additional HPO-bound phenotypes, and full
    causal connectivity from SETBP1 pathophysiology nodes to all 13 phenotypes.
  details: >-
    1. Causal connectivity: Previously, 4/4 phenotypes were disconnected from
    pathophysiology because terminal nodes (Severe neurodevelopmental impairment
    and Refractory epilepsy) had no downstream edges. Added Disrupted visceral
    and craniofacial morphogenesis downstream of Aberrant developmental gene
    transcription (supported by PMID:29875417 and PMID:37872881) and connected
    Impaired neurogenesis and neuronal migration, Disrupted visceral and
    craniofacial morphogenesis, Severe neurodevelopmental impairment, and
    Refractory epilepsy to all 13 curated phenotypes (0 disconnected phenotypes).
    2. Phenotype expansion: Expanded from 4 to 13 phenotypes by adding Brain
    atrophy (HP:0012444), Ventriculomegaly (HP:0002119), Hypotonia (HP:0001252),
    Spasticity (HP:0001257), Hearing impairment (HP:0000365), Cerebral visual
    impairment (HP:0100704), Feeding difficulties (HP:0011968), Midface
    retrusion (HP:0011800), and Talipes equinovarus (HP:0001762) using verbatim
    snippets from cached literature (PMID:38452171, PMID:37872881, PMID:38711130,
    PMID:36147799).
    3. New sections: Added Harrison's chapter classifications
    (GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC, KIDNEY_URINARY_TRACT), prevalence
    entries for classic (>50 cases) and atypical (5 cases) SGS (CASES_IN_LITERATURE,
    ULTRA_RARE), Neonatal and Infantile progression phases, HIGH clinical_burden,
    SETBP1 molecular genetic testing and ultrasonography/MRI surveillance in
    diagnosis, and longitudinal serum alpha-fetoprotein monitoring in
    biochemical.
    4. Genetics and treatments: Added relationship_type CAUSATIVE, variant_origin
    DE_NOVO, and structured ClinGen DEFINITIVE gene_disease_validity
    (CGGV:assertion_71885c03-b578-4baf-a17c-4817349eaf36-2021-02-16T170000.000Z)
    to SETBP1; added target_phenotypes to Supportive multidisciplinary care and
    added Genetic counseling (NCIT:C15240).
    5. Notes and references: Replaced Asta retrieval process note in top-level
    notes with domain-focused SETBP1 dosage-sensitivity genotype-phenotype
    correlations and populated the references list with all cited PMIDs.

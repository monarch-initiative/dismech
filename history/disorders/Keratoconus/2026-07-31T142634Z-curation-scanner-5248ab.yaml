  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES on PR #7128 (4 IMPORTANT, no BLOCKER), plus the blocking check_folded_hyphens.py CI failure.

    BLOCKING CI FIX: reflowed the folded-scalar line ending in "stabilisation-" in the exosome discussion evidence explanation, which check_folded_hyphens.py rejected as a new compound-word split.

    IMPORTANT 1 (spurious causal edge) - ACCEPTED. Removed the unevidenced "Irregular Astigmatism and Optical Degradation" -> "Corneal Stromal Scarring" downstream edge. The edge description itself described co-occurrence and a shared keratoplasty indication, not causation, and it was the only pathograph edge with no supporting evidence. A notes: block records why no edge is asserted. Graph remains fully connected via Corneal Ectasia -> Descemet Membrane Rupture -> Stromal Imbibition -> Corneal Stromal Scarring; verified with dismech.graph --validate.

    IMPORTANT 2 (bundled nodes) - ACCEPTED BOTH. (a) "Descemet Membrane Rupture and Acute Corneal Hydrops" split into "Descemet Membrane Rupture" (the lesion, UBERON:0004367) -> "Stromal Imbibition and Acute Corneal Oedema" (the consequence, UBERON:0001777). The PMID:24491416 snippet ("marked corneal edema caused by a break in Descemet membrane") separates them explicitly and is reused on both nodes with distinct explanations. (b) "Progressive Stromal Thinning and Anterior Limiting Membrane Rupture" also split into two parallel TISSUE nodes with different anatomical substrates (UBERON:0001777 vs UBERON:0004370), both downstream of ECM degradation and both feeding Loss of Corneal Biomechanical Rigidity. The reviewer said they would not insist; splitting was chosen because both cited snippets enumerate them as separate findings and neither asserts a causal direction between them. Pathograph is now 12 atomic nodes.

    IMPORTANT 3 (no deep-research artifact) - ADDRESSED with a Claude Code literature sweep rather than a third-party DR provider (none available in this runner). research/Keratoconus-deep-research-claude-code.md plus a .citations.md sidecar: 10 independent PubMed queries, one per coverage axis (biomechanics, tear proteomics, atopy/rubbing, comorbidity, hydrops, keratoplasty, CXL evidence, progression definition, pediatric, genetics), 56 distinct records. Every PMID came from a live esearch/esummary call, not model memory. The sweep's single most consequential find is PMID:42228627, Global Consensus on Keratoconus and Ectatic Diseases Edition 2 (Cornea, 2026-07), which supersedes the 2015 edition the entry cited - curating a new entry against a superseded consensus would have been a real defect. The artifact also records, with reasons, the leads deliberately NOT acted on, so the next curator does not re-run the same searches.

    IMPORTANT 4 (genetics under-mines the GWAS; LOX/VSX1 inconsistency) - ACCEPTED. Re-read the cached FULL TEXT of PMID:33649486 (not just the abstract) and added five per-gene records: COL12A1 (rs35523808 p.Glu2160Val, the strongest coding signal; collagen XII localises to Bowman's layer, tying the locus to the new Anterior Limiting Membrane Rupture node), FNDC3B, ZNF469, ALDH3A1, ITGA2. Added genuine Table 1 association evidence to the pre-existing COL5A1 (rs3118518) and LOX (rs840464) records. The LOX/VSX1 inconsistency is thereby resolved on the merits rather than by downgrading: LOX now rests on a genome-wide significant association plus an eQTL on its own transcription, VSX1 still rests only on the shared "analysis included markers in..." sentence, so SUSCEPTIBILITY vs DISPUTED no longer rest on the same evidence. A notes: block on LOX states this explicitly.

    SUGGESTIONS ACCEPTED: (5) added phenotypes Corneal Stromal Oedema (HP:0012040) and Corneal Iron Line / Fleischer Ring (HP:6001232 - HPO does have this term, and its own definition names keratoconus), plus a new histopathology section with three findings (stromal thinning, Bowman's-layer breaks, epithelial basement-membrane iron deposition), all with finding_term deliberately unbound and a notes: explaining that NCIT has no corneal morphologic finding terms. (6) PMID:25738235 was cached and listed in references: but never cited - now cited in diagnosis, alongside the newly found Edition 2. (8) dropped GO:0009612 from the ORGANISM-scale Chronic Mechanical Eye Rubbing node - eye rubbing is a behaviour, not a molecular/cellular process - with a notes: pointing to the downstream cellular node. (9) Ocular Surface Inflammatory Mediator Release retyped MOLECULAR -> CELLULAR. (10) removed prevalence_class from the ANNUAL_INCIDENCE record; Orphanet classes are prevalence bands. (11) parents: "Ocular growth disorder" -> "Corneal ectatic disorder". (12) systemic associations curated as a KNOWLEDGE_GAP discussion (gap_kc_systemic_associations) from PMID:37374145 rather than as comorbidity assertions - kb/comorbidities/ is a separate file type, and more importantly the atopy association is plausibly mediated entirely by the eye rubbing already modelled here, so asserting it independently would double-count one causal pathway; the gap carries mediation-analysis and Mendelian-randomisation experiments that would settle which pairs deserve real comorbidity entries. It also records the candidate PROTECTIVE diabetes association.

    SUGGESTION DECLINED WITH REASON: (7) no clinical_trials record added. ClinicalTrials.gov queries could not confirm an NCT for the US multicentre CXL trial (PMID:28495149); the closest enrollment/design match, NCT00567671, is an Emory SINGLE-SITE study, not that trial. Asserting an unverified NCT would be precisely the misattribution the evidence SOP exists to prevent. Documented in the research artifact.

    FOLLOW-UPS FILED IN THE RESEARCH ARTIFACT: mine PMID:39448666 (Nat Rev Dis Primers 2024) and PMID:38830186 (Cornea 2025 pathophysiology); a keratoconus_corneal_ectasia mechanism module following the glaucoma/cataract/osteoporosis disease-like-phenotype precedent (reviewer suggestion 13, endorsed); the MAXO NTR for corneal collagen cross-linking; and OSA-keratoconus (PMID:37227479) as a candidate comorbidity pair.

    VALIDATION: just validate (schema + term + reference) passes; 73/73 distinct evidence snippets verified as exact whitespace-normalized substrings of references_cache/; dismech.graph --validate passes; check_folded_hyphens.py passes; ruff passes. All four new PMIDs cached via just fetch-reference - no cache file was hand-written.

    ## Verdict: MINOR_ISSUES

    No unverified snippets, no fabricated or paraphrased quotes, no Named Entity Confusion, no
    title-as-finding snippets, no wrong-direction or wrong-magnitude claims. The entry is unusually
    careful: node `notes` repeatedly document which causal edges were deliberately *not* asserted
    (keratocyte apoptosis vs cytokines, Bowman's-layer rupture vs biomechanics, oxidative stress
    initiation), and each of those hedges matches what the cited abstracts actually say. All numeric
    claims were re-checked against source text and are correct (OR 3.09/6.42/1.42/1.94/2.95;
    prevalence 1.38/1000 → 138 per 100,000 with CI 114–162; NL registry 265 [260–270] per 100,000 and
    incidence 13.3 [11.6–15.2]; mean age 28.3 y, 60.6% male; 36 GWAS loci, 12.5% genetic variance,
    4,669 cases/116,547 controls; Kmax 85.5%, 97.8% anterior curvature, 64.7% 6–12-month follow-up;
    CXL −1.6 D at 1 year; Delphi Edition 2: 128 panelists/4 rounds; 2015: 36 panelists/3 rounds).
    GWAS full text was checked in context for every per-gene claim: ITGA2 ("this gene" is indeed
    ITGA2, rs12515400), ALDH3A1 (rs4646785 eQTL), FNDC3B (rs4894414, KLF5-downstream), COL12A1
    (rs35523808 p.Glu2160Val, Bowman-layer localization), COL5A1/LOX table rows, the "six loci
    previously associated" claim (FOXO1, COL5A1, FNDC3B... — line 295), the ZNF469/BANP CCT
    divergence, and the EDS/OI collagen-gene sentence — all accurate.

    ## Findings

    1. **MINOR — evidence_source** | pathophysiology → "Corneal Stromal Extracellular Matrix
       Degradation" → PMID:9493273. The entry grades the quote "Laboratory studies suggest a role for
       degradative enzymes and proteinase inhibitors and a possible role for the interleukin-1
       system..." as `evidence_source: HUMAN_CLINICAL`. The quoted sentence explicitly attributes the
       finding to *laboratory* studies (protease/inhibitor assays on corneal tissue and cells), i.e.
       the evidence type being summarized is IN_VITRO, not human clinical observation. Since
       `evidence_source` classifies the type of evidence presented, IN_VITRO (or OTHER for a
       review-level synthesis) would be more accurate. Why it matters: this node's
       protease/anti-protease mechanism would otherwise appear to carry human-clinical support it does
       not have (the same file's own controversy discussion notes the mechanism is "not yet fully
       defined").

    2. **MINOR — evidence_source (same pattern)** | pathophysiology → "Corneal Oxidative Stress" →
       PMID:38830186. "Increased oxidative stress leads to the activation of collagenase and
       gelatinase enzymes" is a review-synthesis statement of predominantly laboratory (biochemical /
       tissue) work, graded HUMAN_CLINICAL. Same reasoning as finding 1; borderline because the
       review does not itself label the evidence type in the quoted sentence. HUMAN_CLINICAL is the
       repo default, so this is a judgment call rather than a defect.

    3. **MINOR — annotation not in cited source** | pathophysiology → "Ocular Surface Inflammatory
       Mediator Release" → `cell_types: corneal epithelial cell (CL:0000575)`. The cited source
       (PMID:25931166) documents elevated IL-6/TNF-α/MMP-9 *in tears*; it does not attribute the
       mediator release to corneal epithelial cells (tear-film mediators can derive from lacrimal
       gland, conjunctiva, or infiltrating cells). The cell-type binding is a plausible curator
       inference, but no cited evidence in the node supports that specific cellular attribution.

    4. **MINOR — uncited assertion in notes** | genetic → VSX1 → notes claim "VSX1 is the most
       historically cited candidate gene for keratoconus". Neither cited reference (PMID:30816092)
       states this ranking; the paper merely lists VSX1 among analysed markers. The DISPUTED typing
       and the two evidence items themselves are correctly sourced (VSX1 analysed but not among the
       prioritised replication variants); only the "most historically cited" superlative is
       unsourced prose.

    Not flagged per calibration: repeated sentences carrying different `supports:` values for
    different claims (e.g. the "Elevated levels of proinflammatory cytokines..." sentence is SUPPORT
    on the Keratocyte Apoptosis node and REFUTE in the inflammatory-status controversy — correct,
    claim-relative); `evidence_source: OTHER` on the two Delphi consensus statements and the CXL
    science review (correct use of OTHER for consensus/review-mechanism sources); the unbound
    Vogt-striae phenotype and unbound histopathology finding_terms (documented in notes as deliberate).


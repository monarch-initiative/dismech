  summary: Route atopy and lens wear through the eye-rubbing node
  details: |
    Backfill for issue #8085. Eye rubbing is TRIGGERS/DIRECT into the entry's own 'Chronic Mechanical Eye Rubbing' node, an identity link rather than a causal step, since the exposure and the node are the same behaviour. Atopic diathesis is PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES into that same rubbing node rather than into a corneal node, because atopy acts largely through itch provoking the rubbing; recording that indirection is what makes treating the allergy legible as a way of reducing keratoconus risk. Contact lens wear also targets the rubbing node as PREDISPOSES, with the description recording that it is confounded in both directions, since lenses both irritate and are the commonest treatment for the refractive error the disease produces. Ultraviolet light exposure targets corneal oxidative stress as PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, and its description notes that the direction is complicated because ultraviolet A with riboflavin is the basis of corneal cross-linking, the treatment that halts progression. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 90 of 90 verified; integrity issue count unchanged from origin/main. PR review noted that the contact lens and atopy links named the same kind of intermediate, irritation or itch provoking rubbing, but carried different causal_link_type values. The contact lens link is now INDIRECT_KNOWN_INTERMEDIATES to match, and its description separates the two uncertainties: the intermediate is known, while what is uncertain is direction, since lenses are also the commonest treatment for the refractive error the disease produces and wearers are therefore enriched for existing disease. That confounding is carried by the PREDISPOSES effect value rather than by the link type. Re-verified: 90 of 90 snippets.

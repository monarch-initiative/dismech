  summary: 'Genetics pass: wire GWAS susceptibility genes and phenotypes, add TUBA3D,
    reinforce VSX1 dispute'
  details: |
    d2g genetics pass for the two keratoconus rows of dismech#12274 (MONDO:0007851
    keratoconus 1 / VSX1 and MONDO:0054771 keratoconus 9 / TUBA3D). Neither CURIE
    appeared anywhere in kb/ before this change.

    Anchor test. MONDO:0015486 is the right class for this entry and needed no
    change. Its eleven children were enumerated from OLS; only two carry a causal
    gene in their logical axioms, and both are the issue's rows. Keratoconus 2 to 8
    are locus designations with no gene axiom, and the remaining two children are
    disease-course states (acute hydrops, stable condition).

    Wiring. Gene-to-mechanism coverage measured with
    dismech.qc_plugins.gene_mechanism_wiring_coverage went 0/9 to 8/9, and
    phenotype causal inlink from causal_inlink_coverage went 0/7 to 7/7. Eight
    already-curated GWAS susceptibility genes (COL5A1, COL12A1, ZNF469, LOX, ITGA2,
    ALDH3A1, FNDC3B, HGF) were bound as `genes:` descriptors on the Polygenic
    Corneal Matrix Susceptibility node, whose own description already names several
    of them and whose evidence is the same trans-ethnic GWAS. Seven phenotypes were
    wired from the ectasia, optical-degradation, hydrops-oedema and scarring nodes.
    The ninth genetic item, "Polygenic susceptibility architecture", carries no
    gene_term and so cannot be matched to a node by the graph builder; it is left
    unwired rather than given a binding it does not have.

    Rows. Both were declined as subtype rows and dispositioned in `notes:`. VSX1 was
    already typed DISPUTED here; PMID:41953647 (2026) was added as two REFUTE items
    reporting that all reported VSX1 variants were reclassified as likely benign or
    benign and that VSX1 is an unlikely candidate gene for keratoconus. TUBA3D was
    added as a new `genetic` record typed UNKNOWN with three evidence items from
    PMID:29051577, the single primary TUBA3D keratoconus report.

    Validation on the committed tree: `just validate` clean, `just validate-terms`
    clean, and the file's share of a 643/643 snippet verification across the ten
    files this PR touches. Orphanet could not be consulted: neither Orphanet code
    MONDO cross-references from this term has a committed ORPHA cache file. The
    committed Bookshelf index records no GeneReviews chapter for keratoconus.

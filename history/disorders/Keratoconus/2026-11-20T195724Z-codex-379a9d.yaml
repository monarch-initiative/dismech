  summary: Map Keratoconus to OMIMPS:148300
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS148300 contains nine numbered keratoconus records in January 2026, reflecting genetic loci and reported familial forms. This Disease describes multifactorial corneal ectasia, with polygenic susceptibility interacting with mechanical and other environmental factors. RelatedMatch links the series to that clinical disorder without treating the nine records as a complete molecular partition or endorsing every historical locus association as a deterministic cause. MONDO:0015486 also contains clinical state and complication classes, so its series crosswalk does not make those subdivisions equivalent. The mapping does not merge brittle cornea syndrome or all syndromic corneal thinning with keratoconus on the basis of shared genes or signs.

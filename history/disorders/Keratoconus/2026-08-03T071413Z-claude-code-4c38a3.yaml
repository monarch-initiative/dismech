  summary: 'Mining pass: consume 4 cached-but-unconsumed references from PR 7128 round-2
    review'
  details: |
    Round-3 response to the second ai4c-reviewer review on PR #7128, which flagged four
    references -- PMID:38830186, PMID:39448666, PMID:39671084, PMID:39535071 -- as shipped in
    references_cache/ but consumed by zero evidence items. This was a mining pass over
    abstracts already on disk: no new literature search was run, and no reference cache files
    were created or edited.

    From PMID:38830186 [The Pathophysiology of Keratoconus, Cornea 2025]: two new
    pathophysiology nodes. "Corneal Oxidative Stress" [CELLULAR; GO:0006979] takes a DIRECT
    edge to "Corneal Stromal Extracellular Matrix Degradation", justified by the review's
    explicit statement that increased oxidative stress leads to activation of collagenase and
    gelatinase enzymes. "Keratocyte Apoptosis" [CELLULAR; GO:0006915] takes an
    INDIRECT_UNKNOWN_INTERMEDIATES edge to "Progressive Stromal Thinning". Both nodes carry a
    notes: field recording which upstream edge was deliberately NOT asserted and why -- the
    source reports both features without establishing what drives either, and "along with" is
    co-observation rather than causation. The same source also supplied a biomechanical-primacy
    evidence item on "Loss of Corneal Biomechanical Rigidity" and two REFUTE items on the
    controversy_kc_inflammatory_status discussion.

    From PMID:39448666 [Nat Rev Dis Primers 2024]: two environmental records, UV light exposure
    and contact lens wear, both scoped to "associated with progression" because the primer
    asserts association only and quantifies no effect size. The contact-lens record notes the
    confound that lens wear is also this entry's own visual-rehabilitation treatment.

    From PMID:39671084 [Definition of Progressive Keratoconus: A Systematic Review]: a second
    progression record covering the operational definition of progression that gates the
    cross-linking indication -- Kmax in 85.5 percent of 221 articles, 6-to-12-month follow-up
    in 64.7 percent -- with the lack-of-unified-criteria conclusion typed PARTIAL.

    From PMID:39535071 [polygenic risk score, Hum Mol Genet 2025]: two evidence items on the
    "Polygenic susceptibility architecture" genetic record. The prior round's stated concern
    about which cohort an AUC refers to was handled by naming the biobank inside each snippet
    rather than quoting a bare AUC.

    Also applied review suggestion 2: retyped the "Anterior Limiting Membrane Rupture" to
    "Loss of Corneal Biomechanical Rigidity" edge from DIRECT to
    INDIRECT_UNKNOWN_INTERMEDIATES, with a notes citing the standard PRK counter-observation.
    And review suggestion 3: added PMID:9493273 plus the four newly consumed PMIDs to the
    top-level references block. The research artifact's "NOT acted on" table and follow-ups
    list were updated so they no longer describe these four sources as unmined.

    Validation: just validate kb/disorders/Keratoconus.yaml passes schema, term and reference
    validation with 85/85 snippets verified, up from 73/73. The causal-graph validator reports
    all disorders have valid causal graphs. The repo-wide references_cache/ reference_id
    requoting churn that validate-references produces locally was reverted and is not in this
    commit.

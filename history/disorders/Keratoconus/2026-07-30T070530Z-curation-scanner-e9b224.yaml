  summary: 'Create: Keratoconus (MONDO:0015486)'
  details: |
    New disease entry created in response to the curation-scanner selection of issue #5899 ("[preprint-scan:new] Keratoconus: limbal stem cell exosome therapy signals"), which recorded that keratoconus was absent from kb/disorders/. Companion issue #6110 ("[lit-scan:new] Keratoconus: corneal cross-linking") documents the same gap.

    Deliberate deviation from the scanning issue's "defer" recommendation: #5899 recommended deferral because its own source is a non-peer-reviewed preprint (PPR1273000, 10.20944/preprints202607.0111.v1). That reasoning applies only to using the preprint AS the evidence base. This entry is built entirely from peer-reviewed sources; the preprint contributes no evidence item and is referenced only obliquely, in the rationale of the OPEN_QUESTION discussion, as an unvalidated regenerative-therapy lead with no candidate cargo asserted.

    Pathograph: 10 atomic nodes, all biological_scale-tagged with single-value discipline. Polygenic Corneal Matrix Susceptibility (MOLECULAR) and Chronic Mechanical Eye Rubbing (ORGANISM) are the two aetiologic arms; they converge via Ocular Surface Inflammatory Mediator Release (MOLECULAR) on Corneal Stromal Extracellular Matrix Degradation (TISSUE), then Progressive Stromal Thinning and Anterior Limiting Membrane Rupture, Loss of Corneal Biomechanical Rigidity, and Corneal Ectasia and Conical Protrusion, which branches to Irregular Astigmatism and Optical Degradation (ORGANISM) and to Descemet Membrane Rupture and Acute Corneal Hydrops, both feeding Corneal Stromal Scarring. The susceptibility-to-degradation edge is INDIRECT_UNKNOWN_INTERMEDIATES because both the 2014 pathogenesis review and the 2021 GWAS state the mechanism is unknown.

    Evidence discipline: 48 evidence snippets across 10 PMIDs, each verified as an exact whitespace-normalized substring of the abstract cached by "just fetch-reference". Two PMIDs initially drawn from model recall were fetched, found to be entirely different papers - PMID:32521197 is a clinical-uncertainty history article and PMID:26161976 is a pearl-oyster shell-protein paper - and were discarded unused; all remaining PMIDs were located via NCBI E-utilities rather than recall. No frequency band is asserted for any phenotype except the OBLIGATE defining one, and the notes field records the reason in each case.

    Modelling judgements worth reviewer attention: category Complex with HP:0010982 Polygenic inheritance rather than a Mendelian framing; VSX1 typed relationship_type DISPUTED rather than SUSCEPTIBILITY because the cited marker review analysed it but did not carry it forward to replication genotyping; treatment_term for cross-linking uses NCIT:C15301 Phototherapy plus therapeutic_agent CHEBI:17015 riboflavin, since neither MAXO nor NCIT has a corneal-collagen-cross-linking term - a possible ontology gap; therapeutic_modality OTHER for cross-linking, since a riboflavin/UV-A photochemical procedure fits none of the enum's platform values; contact lenses carry target_phenotypes but deliberately no target_mechanisms, since optical correction does not modify the ectatic process; and three prevalence records are kept separate rather than reconciled, because the worldwide meta-analytic figure of 138 per 100,000 and the Dutch registry figure of 265 per 100,000 differ by design and the registry authors say so explicitly.

    Validation: "just validate kb/disorders/Keratoconus.yaml" passes schema, term, and reference validation; "uv run python -m dismech.graph --validate kb/disorders/Keratoconus.yaml" passes; all 48 snippets were independently re-verified against references_cache. The repo-wide "just validate-graphs" failure (Vulvar Adenocarcinoma and others) is pre-existing on main and unrelated to this entry.

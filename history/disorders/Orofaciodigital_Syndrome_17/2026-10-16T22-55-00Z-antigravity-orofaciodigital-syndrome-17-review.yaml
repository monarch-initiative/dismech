  summary: Reviewed and enriched Orofaciodigital syndrome XVII with prevalence, progression, diagnosis,
    references, causal gene-to-mechanism-to-phenotype wiring, and differential diagnosis disease bindings.
  details: 'Added prevalence (3 families reported in the literature; PMID:34623732), congenital/neonatal
    progression (PMID:29451301, PMID:34623732), and diagnostic procedures (Molecular Analysis NCIT:C19770
    and Magnetic Resonance Imaging NCIT:C16809; PMID:29451301, PMID:28289185). Wired the causative gene
    INTU (hgnc:29239, relationship_type: CAUSATIVE) onto the trigger pathophysiology node INTU/CPLANE
    Ciliary Basal Body and Intraflagellar Transport Defect grounded via GO biological processes (GO:0060271,
    GO:0042073, GO:0001736) and cellular components (GO:0036064, GO:0005929), and added experimental basal-body
    localization and ciliogenesis evidence from PMID:29581513. Connected the consequence pathophysiology
    node Multisystem Pleiotropic Ciliopathy Phenotype downstream to all eight curated phenotypes with
    INDIRECT directness and verbatim literature support (PMID:34623732, PMID:29451301). Rebound Renal
    Malformation from HP:0000110 (Renal dysplasia) to HP:0012210 (Abnormal renal morphology) and expanded
    its evidence to cover urogenital malformations reported in the third family (PMID:34623732). Added
    classification evidence, MONDO disease_term bindings and literature evidence to all three differential
    diagnoses (MONDO:0010702, MONDO:0010176, MONDO:1060154), an empty datasets list, the references block,
    and curation review_notes.'

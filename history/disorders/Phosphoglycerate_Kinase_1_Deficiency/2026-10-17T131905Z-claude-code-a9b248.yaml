  summary: Bind post-exercise lactate to the ischemic forearm lactate-response marker
  details: |
    LOINC Diagnostics tranche G, batch 27 (functional and provocative tests with diagnostic thresholds). Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows at all. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 435 snippets and 466 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:59849-0 as the loinc_term of the ischemic forearm lactate response marker, in millimoles per litre, the unit the cited rise of 2 to 3 against under 1 is reported in. The normal-ammonia half of the contrast this record draws has no code to carry it, by the enumeration recorded on the myoadenylate deaminase entry in this batch. No paired baseline is bound because the release's only pre-exercise lactate code is for D-lactate, a different enantiomer. No reference range was added: the figures are a rise from each patient's own baseline and the source reports them as a contrast between two patient groups rather than as a decision limit.

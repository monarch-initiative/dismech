  summary: 'Create: Phosphoglycerate Kinase 1 Deficiency'
  details: |
    New entry for IEMbase WP-007 row 3.3.1.01 (issue #5562), anchored to MONDO:0010392 and PGK1 (hgnc:8896). The pathograph separates three tissue arms from one trigger: erythrocyte ATP depletion with 2,3-BPG accumulation conforming to hemolytic_anemia_erythrocyte_destruction, a compensatory right shift of the oxygen dissociation curve, exertional muscle glycolytic failure leading to rhabdomyolysis, and a HYPOTHETICAL neuronal energy-failure node supported by a Drosophila PGK mutant, feeding a nigrostriatal node conforming to parkinsonism_dopaminergic_degeneration. Retinal dystrophy, leukodystrophy and neuropathy are left unconnected because no source proposes a mechanism. Two mechanistic hypotheses (residual glycolytic capacity; 2,3-BPG-driven hemolysis) and two discussions (tissue selectivity; heterozygote Parkinson susceptibility). 22 PMIDs fetched with just fetch-reference. Orphanet ORPHA:713 was not cited because the Orphadata bulk files were not available locally.

  summary: 'Create: Neurodevelopmental Disorder With Dystonia And Seizures'
  details: |
    New entry for MONDO:0859258 (claim #14597), caused by biallelic SHQ1. Clinical features come from the sibling-pair report (PMID:34542157), the 8-patient Taiwanese series (PMID:36847845), the p.I278T homozygous families (PMID:36810590, full text), the first patient (PMID:29178645) and three case reports (PMID:40837391, PMID:41885709, PMID:42881840). The mechanism chain (loss of SHQ1 protein and dyskerin binding, impaired H/ACA snoRNP assembly, defective rRNA processing) rests on patient fibroblasts, yeast complementation and human cell work (PMID:37818102, PMID:19383767, PMID:22085966). Neuronal migration rests on mouse in utero knockdown (PMID:39326821). Patient dopaminergic markers are low, while SHQ1-knockdown cultured neurons showed increased dopaminergic function. The cultured-neuron result is recorded as REFUTE on the dopamine node and as a FAILS_TO_RECAPITULATE experimental model, with a HUMAN_MODEL_MISMATCH discussion. Frequencies were not set to OBLIGATE where other reports contradict the Taiwanese series. The hypomyelinating leukodystrophy report is treated as the same entity because MONDO has no separate term. Deep research: falcon was requested and failed authentication (403); openscientist produced the report via --fallback. Its term-validation step timed out against EBI (recipe exit 3), so the Reference Validation and Term Validation sections were added with just validate-research-reference and just validate-research-terms: 8/8 references resolved and 13/13 quotes were found. just preflight-dr passed (SHQ1 mentioned 67 times). The report says the abbreviation NEDDS is shared with an unrelated KCNN2 disorder; this was not independently checked, and NEDDS is kept out of synonyms. No GeneReviews chapter (NO_CHAPTER). A fresh-context review before the PR corrected four OBLIGATE frequencies, rewrote the blood-findings note (one child had neutropenia and thrombocytopenia), regraded the cultured-neuron dopamine result as IN_VITRO, removed the cannabidiol-to-seizure link the source disclaims, and added ataxia, levetiracetam and other cohort features. Validated with just validate (62/62 snippets), the offline gates, and the model and treatment pytest checks.

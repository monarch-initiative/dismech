  summary: 'Create: Congenital Rubella Syndrome'
  details: |
    Created de-novo Congenital Rubella Syndrome (MONDO:0017361) entry. Curated 5-node pathophysiology cascade (maternal viremia/transplacental entry conforming to vaccine_induced_humoral_neutralization, placental chorionic villus endothelial infection with IFN-induced CXCL10 angiogenic impairment GEO:GSE225949, fetal cytopathic apoptosis/mitotic arrest via capsid-p32 mitochondrial disruption, retinal pigment epithelium degeneration, and brain microglial tropism PMID:16051872 PMID:37327049 PMID:28012878, disseminated fetal reticuloendothelial infection/extramedullary hematopoiesis PMID:35367004 PMID:25654000, and postnatal viral persistence with delayed autoimmune endocrinopathy PMID:4001724 PMID:12463994) wired to 15 HPO-bound phenotypes (including Pigmentary Retinopathy HP:0000580 and Delayed-Onset Thyroid Disease HP:0000821), 2 progression phases, 3 diagnostic assays (LOINC:31616-6, LOINC:34421-8, NCIT:C17003), and live-attenuated rubella vaccination (MMR) + supportive/surgical PDA occlusion care (PMID:31745134).

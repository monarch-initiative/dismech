  summary: 'Create: Mucopolysaccharidosis-Plus Syndrome'
  details: |
    De-novo curation of MPSPS / MONDO:0015012 / OMIM 617303 / VPS33A. NEC preflight run via OAK against MONDO:0015012 confirming gene VPS33A HGNC:18179 and OMIM:617303 before any DR content was used; the Edison/falcon deep-research report was checked to be MPSPS-specific with no leakage from classical MPS types, from VPS33B ARC syndrome, or from VPS16/VPS41 HOPS disorders. Deep research provider: Edison Scientific via just research-disorder falcon; the report was read in full but returned a thin bibliography of only four sources and exposed no PMIDs, so an independent PubMed sweep supplied the citation base. Eleven PMIDs were fetched with just fetch-reference and every snippet verified as an exact substring of the cached abstract. The mechanism is modelled as storage disease without an enzyme deficiency: VPS33A destabilisation and proteasomal degradation, HOPS and CORVET tethering complex depletion, impaired endosome-lysosome tethering and fusion, then GAG accumulation with normal lysosomal hydrolase activity, endolysosomal expansion and over-acidification, renal podocyte storage, marrow hypoplasia, and progressive multisystem disease with plus features. Conformance to the lysosomal_substrate_accumulation module is deliberately partial and downstream-only: the two upstream trafficking nodes carry no conforms_to because MPSPS reaches substrate accumulation by a delivery failure rather than a catabolic block, and the rationale is written into the entry notes. Grouping membership was assessed but no grouping or module file was edited: MPSPS satisfies the Lysosomal_Storage_Disorders defining criterion and should surface as a candidate member, while under Mucopolysaccharidoses it is a boundary case that fails the stated enzyme-deficiency rationale. Three open discussions record the nosology debate, the autophagy discrepancy between the Arg498Trp and Arg200Pro studies, and a HUMAN_MODEL_MISMATCH for the absence of any organ-level model. No GeneReviews chapter exists for MPSPS or VPS33A. Orphanet prevalence was skipped because the local Orphadata manifest checksum fails, so a qualitative ULTRA_RARE band is used. Validation: just validate, just validate-terms, and just validate-references all pass with 64 of 64 snippets verified.

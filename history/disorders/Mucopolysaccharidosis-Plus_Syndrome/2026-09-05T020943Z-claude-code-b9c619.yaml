  summary: 'Phenotype review: Mucopolysaccharidosis-Plus_Syndrome'
  details: |
    Campaign phenotype review (snippet-claim consistency, HPO term optimality, pathograph explanation) of all 34 phenotypes against cached sources (PMID:31936524 full text and five abstracts). Snippet review found no wrong-disease or negated-context quotes; three phenotypes whose only support was an indirect abstract phrase (dysostosis multiplex via 'skeletal abnormalities', global developmental delay via 'mental retardation', recurrent respiratory infections via 'respiratory problems') gained directness: INDIRECT plus a new direct full-text quote from PMID:31936524, and recurrent respiratory infections gained frequency: OBLIGATE ('All MPSPS patients showed recurrent infections'). Eight stale 'Marked PARTIAL' explanations left over from the supports-enum PARTIAL removal were rewritten, with directness: INDIRECT added where the quote bears indirectly. Term review rebound one phenotype: generic source statements of 'pulmonary hypertension' accompanying left-sided valve disease do not establish group-1 physiology, so HP:0002092 Pulmonary arterial hypertension (under Pre-capillary PH) was broadened to HP:0004890 Elevated pulmonary artery pressure and the phenotype renamed Pulmonary hypertension. Pathograph: connectivity raised from 0/34 to 17/34 by wiring the renal storage node to its three evidenced renal phenotypes, the marrow node to its four cytopenia phenotypes, and the GAG-accumulation node to the MPS-like cluster the sources themselves attribute to storage (with INDIRECT_UNKNOWN_INTERMEDIATES and the PMID:31936524 attribution quote), plus a GAG-accumulation-to-renal-podocyte edge. The 17 phenotypes left unconnected (congenital cardiac lesions, neuro/neuroimaging findings, IgG/IgM pattern, fundus hypopigmentation, nephromegaly, HLH, fetal ascites) have no mechanistic account in any source and are documented in a new KNOWLEDGE_GAP discussion rather than wired; the marrow-without-storage-cells precedent shows storage edges cannot be assumed. All validation gates passed (validate, 120/120 snippets, validate-terms, duplicate-keys, entity-refs, validate-disorders, snippet-length and folded-hyphen ratchets).

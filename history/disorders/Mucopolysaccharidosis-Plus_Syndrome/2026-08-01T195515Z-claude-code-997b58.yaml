  summary: 'Address PR review: phenotype coverage and cardiac term binding'
  details: |
    Response to automated review on PR 7763, two IMPORTANT items. First, phenotype coverage: mined the systematic organ-system table in the already-cached PMID:31936524 and added fourteen phenotypes with verbatim snippets - macroglossia, multiple joint contractures, joint stiffness, kyphosis, hypotonia, nystagmus, nephromegaly, atrial septal defect, patent ductus arteriosus, tricuspid regurgitation, mitral regurgitation, ventricular hypertrophy, decreased circulating IgG and increased circulating IgM. Phenotype count rose from twenty to thirty-four and verified snippets from eighty-nine to one hundred and nine. Second, the cardiac term binding: the generic entry bound preferred_term Congenital heart defect to HP:0001627 Abnormal heart morphology, which carries no congenital semantics. HPO has no current non-obsolete congenital-heart-defect grouping term since HP:0004760 is obsolete, so the umbrella was renamed to match its ontology label and the congenital claim moved to the specific child terms now curated separately. Declined the suggested hearing impairment phenotype after reading both candidate sources in context: the hearing-loss sentence in PMID:35628659 describes conventional MPS as the explicit contrast class to MPSPS, and the mention in PMID:31936524 sits in a paragraph about VPS33B ARC and ARKID syndromes, a different gene. Neither supports hearing impairment in MPSPS and the refusal is documented in the entry notes. Also applied the suggestions: recorded that no subtype has a distinct MONDO, OMIM or Orphanet identifier; deepened the genetic section with variant class, complete penetrance, the genotype-phenotype correlation and secondary VPS18 and VPS41 reduction; split supportive care into respiratory support and transfusion entries; and tagged the Vasilev 2020 review plus Sofronova 2022 in the top-level references as the GeneReviews substitute baseline. The partial downstream-only conforms_to decision and the explicitly non-conforming marrow node were left unchanged as instructed. Validation: validate, validate-terms, validate-references and validate-history all pass with 109 of 109 snippets verified.

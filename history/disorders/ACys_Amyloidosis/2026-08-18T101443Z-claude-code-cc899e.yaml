  summary: 'Create: ACys Amyloidosis (hereditary cystatin C amyloid angiopathy, CST3
    L68Q)'
  details: |
    New standalone Disease entry for ACys amyloidosis (MONDO:0007098; hereditary cystatin C amyloid angiopathy, HCCAA / HCHWA-Icelandic type), filling a gap flagged by the MONDO priority dashboard. ACys previously existed only as a subtype within Cerebral_Amyloid_Angiopathy; this entry parallels the existing standalone ADan_amyloidosis sibling.

    Mechanism: nine pathophysiology nodes running CST3 L68Q founder variant -> destabilized cystatin C precursor -> three-dimensional domain-swapped dimerization/oligomerization -> amyloid deposition in cerebral arterial walls -> arterial wall matrix accumulation and thickening / vascular smooth muscle cell loss / perivascular glial scar / systemic extracerebral deposition -> recurrent lobar intracerebral hemorrhage. Five nodes declare conforms_to against all five nodes of the amyloidogenesis module, making this a full-chain conformer. A secondary secretion/trafficking arm (intracellular retention of the variant, reduced CSF cystatin C) is modeled separately, and its edge into aggregation is recorded as PARTIAL with unknown intermediates because the source frames it as a presumption rather than a demonstration.

    Named Entity Confusion guard: HCHWA without a type qualifier also names the Dutch type (APP / amyloid-beta), a different disease. Every cited paper was read and confirmed to concern the Icelandic CST3 disease. HCHWA-D is curated as an explicit differential diagnosis, and a naming caution is recorded in notes. No deep-research report was used; the entry was built directly from primary literature, so the DR preflight was not applicable.

    Evidence: 71 evidence snippets across 15 PMIDs, all fetched with just fetch-reference and verified as exact substrings of the cached references. Treatment coverage of the 2025 N-acetylcysteine phase 2a trial (PMID:40163249) is deliberately hedged: the entry records the trial's own suggestive framing plus a PARTIAL evidence item noting that five cerebral bleeds occurred during treatment, so NAC is not presented as established therapy.

    Three discussions record open questions: the absence of any animal model, the unresolved direction of the basement-membrane/deposition relationship (this entry draws deposition -> matrix accumulation, while the skin-biopsy study argues the reverse), and the unidentified environmental modifier behind the historical halving of carrier life span.

    Validation run: just validate (schema + terms + cache normalization) passed; just count-verified-snippets reported 71/71 verified against cached references; just check-duplicate-keys passed; just check-title-snippets reported no new title-quoting snippets; a targeted tests/test_data.py selection covering conforms_to node references, unique names, subtype foreign keys and environmental mechanism targets passed (10306 tests); and the full pre-PR just validate-disorders sweep passed with exit 0, reporting 71/71 snippets verified.

    Cache note: MONDO:0007098 was absent from both cache/mondo/terms.csv and the DiseaseTerm enum membership cache, and EBI OLS was responding in roughly 30 seconds against the 5-second default timeout hardcoded in ols_client. The two cache rows were therefore derived from OLS itself by re-running the term validator with a widened HTTP timeout, not hand-written; the label recorded is the one OLS returned.

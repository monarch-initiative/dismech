  summary: 'Meningeal melanocytoma: malignant melanotic nerve sheath tumour as a differential
    diagnosis'
  details: |
    Added a differential-diagnosis row for malignant melanotic nerve sheath tumour, which the
    2020 and 2021 WHO classifications renamed from melanotic schwannoma and which has its own
    entry, Malignant_Melanotic_Nerve_Sheath_Tumor. The row binds MONDO:0002558 (melanotic
    neurilemmoma) and carries seven evidence items from two sources. The 2015 review of primary
    melanocytic tumours of the central nervous system gives the cell features of the tumour, the
    need to tell melanocytoma apart from it, and the sites it shares with primary leptomeningeal
    melanocytic neoplasms; this entry already cites that review by its DOI, and the new items do
    the same, while pull request 18721 adds the same paper to the malignant melanotic nerve
    sheath tumour entry as PMID:25534128. The 2010 study that re-examined 25 archived lesions
    first diagnosed as melanotic schwannoma (PMID:20865267) gives the make-up of its series,
    diffuse and strong S100 in all its melanotic schwannomas against focal S100 in its
    four melanocytomas, and the diagnostic value of a GNAQ mutation, with the authors' caveat
    that its absence does not rule out a melanocytic lesion; its discussion names the
    histological features that favour the diagnosis of melanotic schwannoma. Each sentence that
    this row and pull request 18721's version of the malignant melanotic nerve sheath tumour
    entry both quote is graded the same way in both. The row's name is the tumour's current
    name; its description says that the sources below call it melanotic schwannoma, and follows
    this entry's US spelling. PMID_20865267.md is a new cache file here, identical to the copy
    pull request 18721 adds, so the two pull requests do not conflict. Validated with
    just validate, count-verified-snippets and validate-terms.

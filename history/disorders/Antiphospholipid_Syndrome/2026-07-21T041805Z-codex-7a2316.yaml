  summary: Rigorous evidence and mechanism review of antiphospholipid syndrome
  details: |
    Reworked APS around persistent criterion antiphospholipid antibodies plus qualifying clinical manifestations, explicitly separating aPL-carrier status, clinical diagnosis, and research classification. Added the 2023 ACR/EULAR weighted framework and preserved the 2006 Sydney framework as historical classification. Bounded obstetric phenotypes by recurrence, gestational age, severe preeclampsia, and severe placental insufficiency. Recalibrated antibody, cellular, NET, complement, coagulation, trigger, thrombotic, and placental pathways with uncertainty-aware causal links. Removed unsupported universal phenotype frequencies, stale trial-status assertions, and weak genetic or exposure claims. Updated guideline-supported VKA and obstetric therapy and qualified CAPS combination and refractory treatment evidence. All cited snippets were checked against helper-generated reference caches.

  summary: 'Address #14439 review: add lupus-anticoagulant panel caveat'
  details: |
    Reviewer on #14439 noted LOINC:75881-3 is one laboratory's reflex order (aPTT, dRVVT and PT), while the 2023 ACR/EULAR criteria cited on the same row define lupus anticoagulant by dRVVT and aPTT only -- PT is not part of the criteria. Added a notes line on the Core antiphospholipid laboratory panel diagnosis row stating that LOINC:75881-3 is the closest available panel code, not a criteria-defined set, and naming the extra PT component explicitly, so a reader does not mistake it for a criterion.

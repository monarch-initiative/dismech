  summary: 'LOINC: bind core aPL laboratory panel codes'
  details: |
    Bound three panel-level LOINC codes to the Core antiphospholipid laboratory panel diagnosis row's new measurements slot, as part of dismech LOINC Diagnostics tranche C (autoantibodies): LOINC:24319-6 (Cardiolipin IgG and IgM panel - Serum), LOINC:72488-0 (Beta 2 glycoprotein 1 IgG and IgM panel - Serum), and LOINC:75881-3 (Lupus anticoagulant aPTT, dRVVT and PT screening panel W Reflex). Each covers a clean match to one of the three bundled analyte families the row's description already separates (functional lupus anticoagulant assay; IgG/IgM anticardiolipin; IgG/IgM anti-beta2GPI), so no single code spans all three and three separate measurements entries were used rather than one. All three labels were verified against the Monarch KG entity API in the same step they were written. Confirmed all three CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding; also checked against cache/loinc/external_copyright_codes.csv (no hit, so no third-party notice applies).

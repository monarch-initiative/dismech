  summary: Map thrombotic APS to thrombogenesis
  details: |
    Mapped the evidence-backed thrombotic APS branch to four thrombogenesis
    anchors: Platelet Adhesion, Activation, and Aggregation; Coagulation Cascade
    Activation and Thrombin-Driven Fibrin Formation; Pathological
    Fibrin-Platelet Thrombus Formation; and Thrombotic Vascular Occlusion and
    Ischemic Tissue Injury.
    Added the missing platelet-to-coagulation edge and duplicated the module's
    conserved platelet, GO-process, blood-vessel, and causal-edge content with
    APS-specific evidence plus generic coagulation evidence where needed. Split
    impaired fibrinolysis into a parallel nonconforming persistence-amplifier
    node, retained its aPL-driven inbound edge so it does not become an
    independent pathograph root, and split cumulative organ-damage accrual from
    the conforming acute local-ischemia node. Limited formed-thrombus conformance
    to conventional arterial and venous fibrin-platelet thrombi, with propagation
    and occlusion conditional, while excluding microvascular disease, thrombotic
    microangiopathy, and CAPS from that composition claim.
    Deliberately left the Virchow-triad trigger unmapped because no single triad
    limb is necessary across APS events. Explicitly preserved the obstetric
    nonthrombotic branch, the rule that thrombosis is neither necessary for all
    APS nor sufficient for APS diagnosis, and the APS-specific VKA/rivaroxaban
    warning rather than inheriting module treatment semantics. Validation
    completed: LinkML schema reported no issues, ontology-term validation
    passed, strict cache-only snippet audit with the DOI prefix enabled verified
    172/172 snippets, and the CI-equivalent batched disorder validator passed
    schema, terms, and references (its default audit verified 170/172 and skipped
    the two DOI-prefixed snippet uses).

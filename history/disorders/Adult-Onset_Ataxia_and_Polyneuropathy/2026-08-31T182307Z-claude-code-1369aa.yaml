  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place, so this entry explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim, restated in terms of the current enum, following the pattern set by PR 10120 and continued in PRs 10258 and 10263. directness: INDIRECT is added only where the curator's own words name an inference step. Where they do not, the retired token is dropped and no directness is asserted: absent means nobody has assessed the item, which is the honest state and is what #10003 chose for all 11,620 of its own migrated items. A consistency check enforces both directions - no explanation claims INDIRECT without the item carrying the slot, and no item carries the slot without the explanation saying why - and is zero across the tranche. No supports value, snippet, reference, evidence_source or ontology term changed. This entry was read end to end because its caveats are unusually uniform, and 26 of 27 turn out to name the same kind of inference step: the evidence comes from a different MT-ATP6 variant (m.9035T>C or m.9185T>C rather than the defining m.8993T>C), from a cohort published under a different diagnosis that this knowledge base curates as a separate entity (NARP syndrome MONDO:0010794, or the Leigh syndrome spectrum), or from a general statement about mtDNA disorders rather than about this entity. All of those reach this disorder through an inference step, which is what INDIRECT records. The single exception is the discussions item citing regional imaging as the deepest available tissue-level characterisation: that evidence directly documents the evidence ceiling the knowledge gap asserts, so it is direct support for the gap and gains no slot. Two entry-level notes blocks that documented the whole discipline in terms of PARTIAL now document it in terms of directness. Validated with just validate-disorders across the tranche: 372/372 snippets verified.

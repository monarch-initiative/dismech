  summary: 'Create: Adult-Onset Ataxia and Polyneuropathy (MONDO:0010781)'
  details: |
    New CURATE_ROOT entry for MONDO:0010781 (OMIM 500010).

    Disease identity was anchored before any curation. MedGen 374087 links OMIM 500010 to the MT-ATP6 gene entry (OMIM 516060), MeSH C564020 heading-maps the concept to "Mitochondrial Proton-Translocating ATPases / deficiency" and "Mitochondrial Diseases", and the OMIM 500010 title matches Rantamaki 2005 (PMID:16049925), the defining kindred with the heteroplasmic MT-ATP6 m.8993T>C variant.

    Deep research: one falcon (Edison) run, DISCARDED IN FULL for Named Entity Confusion. "just preflight-dr" returned SKIP because MONDO records no causal gene (RO:0004003) for MONDO:0010781, so the manual OMIM/gene preflight from CLAUDE.md was applied and the report failed it: top gene RFC1 with 61 mentions, zero mentions of MT-ATP6 or nucleotide 8993, the report having resolved the descriptive label "adult-onset ataxia and polyneuropathy" to RFC1 spectrum disorder / CANVAS (MONDO:0044720). No content, citation, or ontology term in this entry derives from that report; every reference was located and cached independently via PubMed E-utilities plus "just fetch-reference". The report is committed under research/ so the preflight verdict is reproducible, and the entry notes record the verdict so a later curator does not re-mine it.

    Curation decisions worth recording. Evidence that comes from a different MT-ATP6 variant in the same adult-onset ataxia spectrum (m.9035T>C, m.9185T>C) rather than from m.8993T>C is marked supports: PARTIAL, with the variant named explicitly in its explanation. GeneReviews PMID:20301352 covers the mtDNA-Leigh syndrome spectrum rather than this entity, so its management, agents-to-avoid, and inheritance statements are also marked PARTIAL. Two normal test results are curated as biochemical entries with presence: ABSENT (cytochrome c oxidase muscle histochemistry, respiratory chain enzymology), because their normality is the diagnostic trap that causes these patients to be missed. CANVAS / RFC1 spectrum disorder is curated as a differential from an independently retrieved primary source (PMID:30926972), since it is the leading real-world differential for this clinical description.

    Three discussions record what is not known: a KNOWLEDGE_GAP that no cell-level cerebellar neuropathology exists for this entity (Purkinje involvement is inferred from the wider ataxia literature, not shown here, so the node carries mechanism_confidence: PROVISIONAL); an OPEN_QUESTION that heteroplasmy load demonstrably fails to predict age of onset; and a HUMAN_MODEL_MISMATCH on the cybrid CoQ10 / vitamin E rescue, which is the reason no antioxidant treatment is curated.

    Module conformance: three pathophysiology nodes declare conforms_to against peripheral_axonal_degeneration (two nodes) and cerebellar_purkinje_degeneration (one node); all targets were checked to resolve.

    Validation. "just validate" passed (schema, terms, references). "just count-verified-snippets" reported 50/50 snippets verified against cached references. "just check-duplicate-keys" and "just check-title-snippets" were clean. "just validate-disorders" was run once over the changed file before opening the PR. Compliance was 93.0 percent global / 93.5 percent weighted; the datasets block is deliberately empty because no verifiable dataset accession exists for this ultra-rare entity and fabricating one is the failure mode the dataset SOP warns about.

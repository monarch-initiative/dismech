  summary: Review adult-onset MT-ATP6 ataxia against full primary sources
  details: |
    Review eligibility and scope. The parsed history on origin/main cd7ddf4cd04 contained CREATE and three EDIT events, with no REVIEW. Open claims and the fully paginated open-PR changed-file inventory had no competing review at reservation. The entry remains anchored on OMIM500010/MONDO:0010781 and the original MT-ATP6 m.8993T>C adult kindred. Related m.9035T>C/m.9185T>C and NARP/Leigh evidence is explicitly qualified. No schema or reference-provider code change is included.

    Primary clinical correction. The full Rantamäki2005 article, reproduced on its published pp.337–340 in the author thesis, describes overt ataxia/dysarthria in two of three examined adults and axonal neuropathy in all three. The prior obligate-ataxia assertion was false. Removed unsupported phenotype frequency bands and the ULTRA_RARE prevalence band; selected referral denominators are retained without population extrapolation. Added directly observed dysarthria, gaze-evoked nystagmus, absent ankle reflexes, vibration loss, pes cavus, weakness, muscle atrophy and clinically described drop attacks. The proband's EEG was normal; a sibling's attacks were only probable. The childhood-onset deceased sibling had nonspecific gliosis at autopsy and no documented molecular assay, and is not counted as an adult molecularly confirmed case. The maternal cousin's MS was regarded as independent by the original authors. An independent peer read the original full article and confirmed these denominator, tissue and diagnostic limits.

    Mechanistic correction. Split ATP depletion from ROS overproduction, removed the bundled terminal syndrome, and joined the clinical nodes to phenotype targets. Patient lymphocytes and related-variant cybrids establish cellular observations, not direct neuronal assays. Connections to adult nerve/cerebellar dysfunction retain unknown intermediates. Removed an unproven Purkinje-cell binding and its obsolete degenerative-node example. Heteroplasmy modifies expression without providing a universal threshold or explaining adult onset solely by low load: the original proband had89% in blood, and related adult pedigrees had90–99% in leukocytes. Normal routine complexI–IV tests do not establish normal ATP synthesis; normal oligomycin-sensitive ATPase in the later primary-cell study is retained rather than suppressed in favor of the earlier cybrid defect.

    Source consumption. All nine original reference identities and complete cached abstracts were read. Full primary scientific bodies for PMIDs20953793,30926972 and35159298 were read, including methods, results, discussion, and the available tables/legends; the cache for35159298 omits actual figure/table objects, so no uninspected table-specific quantitative claim was added. The full PDF20953793 includes Table1 and all three figure legends. The newly regenerated PMID22577227 contains the full body and clinical Table1, all read:3/5 normal MRI, three normal/nonspecific biopsies, two normal complexI–IV studies, high leukocyte loads, selected64-pedigree diagnostic yield, and variant-specific phenotypic heterogeneity. Its discussion swaps the m.9035 and m.9185 protein positions; these erroneous substitutions were not copied. The correct assignments follow the2022 paper and GeneReviews. The original16049925 four-page article was read in its entirety from the sanctioned generated thesis PDF cache; the surrounding thesis and other reproduced papers were not used as an audited source. The generated URL title is preserved and each quote identifies the original article. Canonical PMID16049925 remains in the bibliography.

    Access limits. Canonical refreshes of17568559,19626676 and18055910 remained abstract-only. For18055910, the full primary PMC clinical/results/discussion text was inspected through the web; canonical/URL retrieval returned challenge pages or rate limits, EuropePMC returned403, and Citeseer timed out. Two tracked PMC fallbacks were tested through sanctioned just fetch-reference but did not improve this source, so the unused code commits were removed and the exact original abstract cache restored. The structured18055910 evidence quotes remain within its cached abstract. No generated challenge-page cache is committed. The lymphocyte and cybrid model descriptions respect the information available in their complete abstracts; no unverified assay detail or human antioxidant efficacy was added.

    GeneReviews. The full NBK1173 chapter was recovered through the public /sites/books/ URL after canonical/print/PDF attempts returned challenge content. All clinical, diagnostic, genotype-phenotype, management, counseling and molecular sections through the molecular tables were read, including Tables1–8. The canonical PMID20301352 and the full chapter URL are both titled and tagged. Evidence is actively used across clinical differential context, diagnosis, supportive care and counseling. Full chapter content adds leukocyte/variant-specific interpretation, comprehensive sequencing, mobility and visual care, and the limits of maternal recurrence prediction and preimplantation testing. The m.8993T>C/G tissue/age behavior is distinguished from other mtDNA variants. Quotes ending at embedded glossary links are continuous cache substrings, with the remaining clinical context identified in the explanation. The chapter concerns Leigh syndrome spectrum; infantile phenotype frequencies, its generic mitochondrial trials and outdated2024 regulatory/trial statements are not transferred to the adult entity. No absolute childhood-onset restriction is used for NARP.

    Experimental models. Three non-animal systems are now explicit: patient m.8993T>C lymphocyte assays, m.9035T>C transmitochondrial cybrids, and two primary m.9035T>C fibroblast donors. Variant, cell background, normalization dependence, mixed-age controls, small donor counts and assay-specific negative findings are retained. The later fibroblast/muscle ATPase result is not conflated with the earlier cybrid result. CoQ10/vitaminE rescue of artificial stress-induced cell death remains experimental, not a treatment recommendation. No animal model was inferred from related mitochondrial biology.

    Deep-research content-completeness checklist. The actual falcon narrative begins after repeated prompt material and addresses RFC1/CANVAS/MONDO:0044720, with no MT-ATP6/8993 disease content. This independently reconfirms the prior Named Entity Confusion disposition; it is not a valid adult MT-ATP6 completeness baseline. Phenotypes: adequate against the defining adult primary article; indirect related-variant phenotypes retain scope. Subtypes: no independently mapped adult subtypes established; NARP/Leigh/RFC1 remain differentials. Mechanisms: seven atomic nodes, assay limitations and clinical joins. Treatments: five supportive/counseling/surveillance entries with shared-care scope. Genetics: causal variant, maternal inheritance and high-load/variable-expression limits. Diagnostics: molecular testing, electrophysiology, variable MRI and normal-test limitations. References: all nine PMIDs plus the two full-source URLs cataloged and used; central original clinical findings replace indirect NARP support. Overall: intentional adult-kindred scope rather than importing every infantile/related-variant manifestation.

    Trials and datasets. ClinicalTrials.gov API queries on2026-09-21 returned zero records for the exact adult-ataxia name and for8993T>C. The MT-ATP6 query returned two unrelated records, NCT05789888 (obesity/adipose genetic variation) and NCT05261373 (type2 diabetes exercise/nutrition), whose registry identities and conditions were inspected and excluded. No disease-specific interventional trial or accession was established from the reviewed primary sources. No dataset cache blob was accessed. The mapping concern about the MONDO DNA-repair parent is left to separate ontology work.

    Validation. Schema, live ontology bindings and all101 exact snippets pass. The newly full22577227 cache has only this disorder as a current KB consumer. The remaining curation guards, complete history corpus validation, node-class integrity and commit hooks are recorded in the PR once complete. New ontology descriptors were read from live OLS responses before binding; no reference cache was hand-edited. ICIMD classification uses the mtDNA-encoded respiratory-chain-protein group rather than the nuclear complexV group.

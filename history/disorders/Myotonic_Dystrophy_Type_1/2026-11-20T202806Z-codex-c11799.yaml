  summary: Map Myotonic Dystrophy Type 1 to OMIMPS:160900
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS160900 contains DMPK-related myotonic dystrophy 1 (OMIM:160900) and CNBP-related myotonic dystrophy 2 (OMIM:602668). This entry is explicitly restricted to the DMPK CTG-repeat disorder, so the two-member series is a broader target. Shared toxic repeat RNA and spliceopathy explain the family relationship, but the repeat loci, repeat motifs, and clinical spectra remain distinct. This mapping does not claim coverage of DM2 or equate DM1 with the slide-level myotonic dystrophy umbrella MONDO:0016107; the entry remains bound to MONDO:0008056. A full two-member grouping requires a separately curated DM2 entry.
    Preserved the verbatim mouse-model abbreviation in a pre-existing evidence quote with a line-specific spelling exemption; formatter-only changes preserve parsed values.

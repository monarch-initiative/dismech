  details: |
    Assessed kb/hypotheses/Myotonic_Dystrophy_Type_1/canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model/openscientist.md (verdict SUPPORTED; sidecar openscientist-assessment-by-claude-opus-5.yaml, 14 claims) and integrated its RETAINED and QUALIFIED claims.

    Added: two genetic-proof evidence items on the canonical hypothesis (PMID:31253581 CRISPR excision of the repeat abolishes foci and corrects splicing; PMID:16864772 AAV-Mbnl1 rescue of myotonia). Reframed the Toxic CUG RNA Nuclear Foci node around nuclear retention rather than focus formation, with PMID:40238630 showing single nuclear-retained RNAs titrate MBNL1. Added PMID:19223393, PMID:17936705 and PMID:21400563 to the spliceopathy node, which previously asserted a CELF1 arm with no supporting citation. Qualified the SCN5A cardiac branch with a REFUTE item (PMID:39126705: forcing the adult isoform in a DM1 heart model rescues nothing) and added a new Splicing-Independent Progressive Cardiac Pathology node (PMID:41855125). Added Satellite Cell Premature Senescence (PMID:19246640) and dsRNA-Triggered Innate Immune Activation in Lens (PMID:22062891) nodes, and human lens-cell evidence (PMID:17101631) to the existing SIX5 lens node, which previously rested on mouse data alone. Added an investigational DMPK-targeting ASO treatment (baliforsen, PMID:36804094). Added four discussions: nonsplicing cardiac progression, cataract mechanism hierarchy, congenital multigene dosage fidelity (HUMAN_MODEL_MISMATCH), and the MBNL1 restoration threshold.

    Corrections made against the report: it claims the phase 1/2a baliforsen trial demonstrated pharmacologic activity, whereas the trial reported muscle drug concentrations below the level predicted to reduce the target; that claim was REJECTED and the entry's hypothesis notes were amended so the ASO arm is not cited as corroborating the RNA-toxicity axis. Its claimed 153-source systematic evaluation is also REJECTED as unreconstructible from the 48-entry citation manifest.

    Deliberately not integrated: the MSH3 somatic-expansion claim (QUALIFIED; the cited paper explicitly found no Rs26279 association with age at onset, and the somatic-expansion node already carries MSH3 and FAN1 evidence); the CTG-length mortality result (verified, but the top-level description slot takes no evidence); RAN translation, miRNA dysregulation, signaling-cascade, and bidirectional-transcription models (report-level orientation with no DM1 tissue evidence checked); and the spliceosomal-stoichiometry modifier (a HeLa siRNA screen result, too preliminary for a node).

    Every new snippet was copied from references_cache after just fetch-reference; count-verified-snippets reports 77/77 verified. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-folded-hyphens all pass.

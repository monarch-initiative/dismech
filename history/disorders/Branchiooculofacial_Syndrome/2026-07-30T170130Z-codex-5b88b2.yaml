  details: |
    Reviewed the TFAP2A mechanism and phenotype graph for branchiooculofacial syndrome. Added structured autosomal dominant inheritance, wired TFAP2A to the reduced and dominant-negative AP-2 alpha transcriptional activity node, and renamed the downstream neural-crest mechanism so it accurately covers the documented null, hypomorphic, and antimorphic allele spectrum. All 22 locally curated phenotypes remain connected; external OMIM and Orphanet phenotype differences were retained for evidence-specific review rather than imported without exact local support.

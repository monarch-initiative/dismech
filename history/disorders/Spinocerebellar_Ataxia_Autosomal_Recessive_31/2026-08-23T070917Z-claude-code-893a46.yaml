  summary: 'Create: Spinocerebellar Ataxia, Autosomal Recessive 31 (ATG7 deficiency)'
  details: |
    Created the dismech entry for spinocerebellar ataxia, autosomal recessive 31 (MONDO:0030323), biallelic ATG7 deficiency — the first described human disorder of the core macroautophagy conjugation machinery.

    Source: PMID:34161705 (Collier et al., N Engl J Med 2021), the defining report of 12 patients from 5 families. This remains the primary source for the disorder; no deep-research provider was used, and all content was curated directly from the fetched primary literature.

    Curated a six-node pathograph: loss of ATG7 E1-like activating enzyme function -> failure of ATG12-ATG5 conjugation and LC3 lipidation -> impaired autophagosome formation and autophagic flux -> cerebellar and callosal maldevelopment / skeletal muscle and endocrine dysfunction -> ataxia and neurodevelopmental impairment.

    Two nuances were curated as discussions rather than flattened into the graph. A KNOWLEDGE_GAP records that autophagic sequestration was markedly reduced but NOT abolished — basal autophagy was readily identified in patient fibroblasts and skeletal muscle — so this must not be annotated as a complete autophagy-null state. A HUMAN_MODEL_MISMATCH records that Atg7-null mice die within 24 hours of birth while patients survive into adulthood, so mouse lethality must not be imported as a prognostic claim; the conditional knockout is curated as PARTIALLY_RECAPITULATES with that limitation stated.

    Module conformance was considered and deliberately NOT declared. loss_of_proteostasis is framed as age-associated proteostatic collapse with misfolded-protein aggregation downstream, and no aggregation is reported in these patients. cerebellar_purkinje_degeneration derives its output-loss node from Purkinje degeneration, whereas the finding here is developmental cerebellar hypoplasia. Declaring either edge would assert an unevidenced mechanism and corrupt CONFORMS_TO_MODULE grouping evaluation. The reasoning is recorded in the entry notes.

    Zygosity is left unset on the genetic_context because the reported families span homozygous and compound-heterozygous configurations and ZygosityEnum has no BIALLELIC value.

    Deliberate omissions: no prevalence, progression, or treatments sections — 12 patients reported, no disease-specific therapy exists.

    Validation: linkml-validate clean; term validation passed first pass (all terms looked up via OAK before drafting); reference snippet audit 22/22 verified; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates clean.

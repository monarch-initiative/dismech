  summary: 'Review: wire Osteoglophonic Dysplasia into the FGFR module and grouping'
  details: |
    Completeness review of the FGFR-Related Skeletal Dysplasias grouping found this entry curated but structurally disconnected: it had no conforms_to anchors at all, so the FGFR module could not see it and the grouping's NECESSARY_AND_SUFFICIENT criterion could not admit it, despite FGFR1 gain of function being the entry's own stated mechanism.

    Changes: (1) added conforms_to on three nodes - FGFR1 Constitutive Activation -> #Constitutive FGFR Activation, Premature Cranial Suture Fusion -> #Premature Suture Fusion and Craniosynostosis, Impaired Endochondral Ossification -> #Impaired Endochondral Ossification and Chondrodysplasia; (2) added biological_scale tags to all four nodes; (3) added a new pathophysiology node "FGF23 Excess and Renal Phosphate Wasting" (ORGANISM scale, osteocyte CL:0000137, GO:0055062 DECREASED) wired from the FGFR1 trigger node to the previously orphan Hypophosphatemia phenotype, which had no upstream mechanism node - this arm is deliberately left without a conforms_to anchor because it is endocrine, not part of the shared growth-plate/suture mechanism, and it is what distinguishes OGD from allelic Pfeiffer syndrome; (4) added a denosumab treatment for aggressive recurrent central giant cell granuloma (PMID:41093593) with target_mechanisms on the fibrous-lesion node, recorded as an emerging single-case option with its safety caveat, not standard care.

    Validation: just validate PASS; just validate-terms PASS; just validate-disorders (batched, CI-equivalent) PASS; snippets 37/37 verified. The entry was then added to kb/groupings/FGFR_Related_Skeletal_Dysplasias.yaml and check-groupings reports SATISFIED.

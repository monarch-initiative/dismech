  summary: 'Create: Renal Nutcracker Syndrome'
  details: |
    De novo curation of renal nutcracker syndrome, MONDO:0019105. Deliberately a non-genetic pick: the pathograph is haemodynamic - mesoaortic compression of the left renal vein, left renal vein hypertension, then collateral formation and fornix varices - so it exercises schema areas monogenic entries do not, namely imaging_findings, diagnosis, differential_diagnoses and environmental influences_mechanisms. Deep research: one openscientist report, research/Renal_Nutcracker_Syndrome-deep-research-openscientist.md, 31 citations, reference_validation 31/31 verified, confabulation 0.0, 25/31 on topic with 0 off topic. just preflight-dr returned SKIP because MONDO records no causal gene for this term and the Named Entity Confusion check is gene-identity based; the report was checked manually against title, summary and section content instead. Worth recording that the tool's top-gene list was led by ACE at 11 mentions, which is the drug class not the gene. The report contributed five substantive references that materially changed the entry and were not in my first draft: PMID:39276407 for the low-BMI and fat-pad trigger, PMID:41985840 for the 250-patient multi-institution demographics, PMID:39362632 for the 2024 international Delphi consensus that states no specific diagnostic criteria exist, PMID:16902785 for ACE inhibition of orthostatic proteinuria with mesangial change, and PMID:38617183 for renal autotransplantation outcomes and the roughly 23 percent population prevalence of asymptomatic left renal vein compression. That last figure is the quantitative basis for the phenomenon-versus-syndrome distinction that runs through the entry. Two title-only snippets in the first draft were caught by reference validation and replaced with real outcome data from the same paper. Validated with just validate at 41/41 snippets verified, check-entity-refs and check-duplicate-keys clean.

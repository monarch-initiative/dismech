  summary: 'Review round 1: correct the stenting narrative, add proteinuria limb and
    mechanism gap'
  details: |
    Worked the ai4c-reviewer changes-requested review on PR 9843. The critical finding was that the entry said the opposite of two sources already in its own cache: it described endovascular stenting as increasingly preferred and its comparative-efficacy discussion claimed no comparative data existed, while PMID:41985840 states endovascular therapy was associated with significantly worse results for all outcomes and is not appropriate as initial treatment, and PMID:39362632 records Delphi consensus for left renal vein transposition first with the statement that endovascular stenting is preferred over open procedures rejected at 80 percent consensus. Both were cited once each with weak snippets. The stenting treatment description is rewritten, carries a REFUTE-graded evidence item against the first-line proposition plus the Delphi consensus quote, and the comparative-efficacy discussion is rewritten so the open question is patient selection and durability rather than absence of data. Other corrections: the 89.5 percent transposition snippet was truncated before the word respectively, which read as a single resolution rate when 89.5 is flank pain alone and proteinuria was 57.8, so it now quotes the full sentence with the per-symptom breakdown in the explanation; the epidemiology evidence quoted a methods sentence and now quotes the demographic finding; the environmental influences_mechanisms evidence quoted an association and now quotes the fat-pad-to-angle mechanism sentence from the same paper. Structural additions: a glomerular capillary hypertension and orthostatic proteinuria pathophysiology node, which was the missing fourth limb and gives ACE inhibition a target_mechanisms link it previously lacked; gonadal or ovarian vein transposition as a treatment, the second commonest operation in the cohort at 31 percent and the only intervention reaching the previously terminal pelvic congestion node; target_mechanisms on conservative management pointing at the compression node with the Delphi weight-gain consensus and the 78 percent nonoperative success figure. A third KNOWLEDGE_GAP records that the Delphi failed to reach consensus on the haematuria and proteinuria mechanisms - 60 and 45 percent - and withdrew both statements, which inverts what the entry previously signalled as its secure part. Suggestions applied: two biological_scale values corrected from ORGANISM to TISSUE, the generic vein binding replaced with UBERON:0003848 gonadal vein, stent migration quantified at 6.6 percent, the Delphi 6-month symptom duration criterion added to diagnosis, and the prevalence notes now record the 10 to 30 percent spread across imaging criteria rather than a single 23 percent figure. Note the reviewer suggested UBERON:0001152 for gonadal vein and flagged it as unverified; OLS resolves gonadal vein to UBERON:0003848, so the verified term was used and the discrepancy recorded in notes. Validated with just validate at 54/54 snippets verified plus all six offline gates clean.

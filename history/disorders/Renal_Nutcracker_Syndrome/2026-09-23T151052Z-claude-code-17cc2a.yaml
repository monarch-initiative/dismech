  summary: Retype two symptom-mechanism edges to INDIRECT_UNKNOWN_INTERMEDIATES; add
    PMID:40816484
  details: |
    Two downstream edges from Left renal vein hypertension (to the proteinuria node and to the haematuria node) were typed INDIRECT_KNOWN_INTERMEDIATES, while the entry's own ncs_symptom_mechanisms_unresolved gap quotes the 2024 Delphi panel (PMID:39362632) saying the mechanism is unknown. Both are now INDIRECT_UNKNOWN_INTERMEDIATES, with the candidate routes the panel was offered (septal/fornix vein rupture; renal venous pressure transmitted to glomerular capillaries; angiotensin II and norepinephrine) recorded as suspected intermediate_mechanisms. Node and edge descriptions that stated those routes as fact now call them the conventional explanation, and the gap rationale no longer says the entry presents them as settled. PMID:40816484 (Sarikaya 2025, systematic review, 24 studies, 578 patients) was fetched and cited three times on ncs_intervention_comparative_efficacy for pooled symptom-resolution and reintervention rates and its own conclusion that the comparative question remains open. The same review reports extravascular stenting (132 patients), which the entry did not cover, so it was added as a treatment with a target_mechanisms link to the compression node (aortomesenteric angle 20.6 to 44.5 degrees) and two evidence items. All 60 snippets verify against the cache; just validate-disorders passes.

  summary: 'Review response: tag GeneReviews chapter; curate cerebellar atrophy'
  details: |
    Response to the automated review on PR #11024. Both items addressed.

    Blocking item - GeneReviews. PMID:26425749 (Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview) is now tagged in the top-level references block with tags: [GeneReviews], and a notes paragraph records why it is deliberately not cited as evidence anywhere: the cached PubMed record holds only the chapter's statement of purpose and no clinical content, so a snippet from it would attest to the chapter's aims rather than to a fact about this disease. The wording follows Mitochondrial_Complex_I_Deficiency_Nuclear_Type_2.yaml, as the reviewer suggested. The original entry had reasoned itself into the opposite conclusion - that tagging a Leigh overview would import the class membership the entry declines to assume - which was wrong on repo practice: the tag records applicability, and the not-cited-as-evidence discipline is what carries the caution.

    Non-blocking item - cerebellar atrophy. Curated as a new Neurological phenotype bound to HP:0001272, wired from Brainstem and Basal Ganglia Neurodegeneration with an INDIRECT_UNKNOWN_INTERMEDIATES edge, and evidenced from PMID:41234160 with directness: INDIRECT.

    The attribution needed its reasoning written out, and that reasoning is now in the phenotype's description rather than left implicit. The quoted sentence - 'Cerebellar atrophy was reported in two cases (Family J and L)' - names families, not genes. The same paper assigns Family J to NDUFA1 (c.55C>T p.P19S) and Families K and L to the homozygous NDUFA10 p.(A78del) allele. So Family L is the NDUFA10 case and Family J is not, and the entry says so explicitly rather than letting a reader infer that both families are NDUFA10. That structural inference across two passages of one paper is why the item is INDIRECT.

    Worth curating because it is the only structural neuroimaging finding attributable to an NDUFA10 patient in the citable literature, and because it sits outside the visual pathway - evidence that the mild pole of this entity is not always confined to the optic nerve. One patient, so no frequency band.

    Validation after the change: 40/40 snippets verified (was 39/39). just validate, validate-disorders, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values pass; whole-KB check-title-snippets, check-snippet-length and check-snippet-grading re-run and pass. Pathograph orphan audit re-run: no orphan targets and no unwired phenotypes.

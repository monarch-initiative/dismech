  summary: 'Gene-family review: NDUFA10'
  details: |
    The NDUFA10 lesion node had no molecular function. NDUFA10 is an accessory subunit with no demonstrated catalytic activity in complex I, and patient missense residues lie in its interfaces with NDUFC1, NDUFC2 and ND2 (PMID:41234160); the node now binds structural molecule activity, decreased. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

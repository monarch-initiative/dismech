  details: |
    Added a progression block with two phases (childhood-onset insidious optic atrophy, onset 0-12 years; persistent optic atrophy at last examination, 16-37 years), sourced from per-patient rows of Tables 2 and 3 of PMID:41234160 for NDUFA10 Families K, L and M. Added a phenotype_contexts onset descriptor (min 0, max 12 years) with evidence on the Optic Atrophy phenotype. Added evidence to three causal edges (assembly defect to reduced complex I, reduced complex I to decreased activity phenotype, optic nerve degeneration to optic atrophy). Revised the entry notes that previously stated no progression block existed. No Leigh-pole phase was added because no cached source gives its age of onset. Validated with just validate, validate-terms, count-verified-snippets (52/52) and validate-disorders.

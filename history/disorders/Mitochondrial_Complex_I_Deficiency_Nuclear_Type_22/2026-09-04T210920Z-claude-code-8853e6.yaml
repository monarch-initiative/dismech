  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 22 (MONDO:0032626,
    NDUFA10)'
  details: |
    New standalone Disease entry for MC1DN22 (OMIM 618243), the NDUFA10-related nuclear complex I deficiency.

    entry_type decision: DISEASE. dismech curates the MC1DN series as standalone per-gene entries (nuclear types 2, 6, 12, 23, 24, 31 and 34 are all separate files on main); MONDO records no descendants for MONDO:0032626 and a single causal gene, so this is a leaf entity, not a grouping. MC1DN34 (NDUFAF8) was used as the structural template because it faces the same two-cohort problem.

    Named-entity-confusion preflight: 'nuclear type 22' also exists in the complex IV series, where it names a different disease with a different gene. Verified via OLS that MONDO:0032626 is the complex I term with OMIM:618243 and that the KB's complex IV 'nuclear type 22' material sits in separate entries. The collision is curated as a differential diagnosis so the next reader does not have to rediscover it.

    Evidence: 39/39 snippets verified against the reference cache; no DOI-prefixed citations, so nothing was skipped by prefix. Sources are the 2011 defining case report (PMID:21150889), the 2017 second case (PMID:28247337), the 2026 nuclear-complex-I optic-atrophy series (PMID:41234160, full text cached, the source of the mild pole and of the p.R337C phenotypes), the Russian Leigh cohort (PMID:36675121), and mechanistic work on the dGTP reservoir (PMID:35739187) and the PINK1/serine-250 axis (PMID:24652937, PMID:25412178).

    Contested evidence curated as such: the serine-250 phospho-switch node carries a REFUTE item from PMID:25412178 alongside SUPPORT items from PMID:24652937, split by sentence, because the two papers agree that NDUFA10 abundance sets complex I activity and disagree about whether phosphorylation at that residue is the mechanism.

    Deliberate omissions, all recorded in notes: no treatments block, no progression block, no frequency bands on any phenotype, no experimental_models block, and no environmental block. Fewer than ten patients are published, ascertained through three unrelated clinical routes, so any proportion would describe the ascertainment rather than the disease. PMID:36270260 is listed under references and cited nowhere: it is a letter with no abstract and no retrievable body text, so dystonia and spasticity are NOT curated as phenotypes of this entity.

    Deep research: falcon, run with a disambiguating disease_name inlining the gene, OMIM number and complex number because the plain label collides with the complex IV series. preflight-dr PASSed (NDUFA10 mentioned 58 times; report OMIM 618243 matches MONDO). The report had full-text access to both paywalled case reports and supplied per-patient allele, biochemical and clinical detail that no cached abstract carries; all of it is recorded as explicitly uncited leads in the genetic notes, the biochemical notes and the entry notes, and none of it is curated as evidence.

    Validation: just validate, validate-terms, count-verified-snippets, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass. Pathograph orphan audit run separately: no orphan downstream targets and no unwired phenotypes.

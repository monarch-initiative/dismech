  details: |
    Answered the four blocking findings on PR #11212 in a single push. (1) Added the missing deep-research artifact: research/Maleylacetoacetate_Isomerase_Deficiency-deep-research-falcon.md plus its .citations.md sidecar and _artifacts/ directory, generated with just research-disorder falcon (claude_code is unauthenticated on this runner; the openai provider 404s on o3-deep-research-2025-06-26). The report's own validation sections record 10/12 references verified with a 0.0 confabulation rate and 15/15 terms verified. (2) Added reference_title to the twelve evidence items that lacked it, all inside animal_models[].modeled_mechanisms[] and its nested readouts[].evidence; each title was read out of the corresponding references_cache frontmatter by script rather than transcribed. (3) Corrected the ordinal error: MAAI is the fourth step of tyrosine catabolism, not the fifth, so the ordinal was dropped in favour of 'the step immediately upstream of fumarylacetoacetate hydrolase'. (4) Fixed the claim-evidence misalignment on the NTBC rescue evidence for PMID:12052898. The review's proposed leftward extension does not validate, because conf/reference_validator_config.yaml strips bracketed spans from the snippet and the chemical-name gloss matches neither literal_bracket_patterns entry; the snippet instead starts after the bracket and the explanation names the sentence it completes. All four suggestions were also taken: directness INDIRECT on the two predictive evidence items, the DCA background sentence regraded from MODEL_ORGANISM to OTHER with a human-clinical PMID:29641284 item added ahead of it so the avoidance advice no longer rests on a mouse paper's background clause, modifier INCREASED on the HP:0031980 urinary maleic acid binding, and biological_scale MOLECULAR rather than ORGANISM on the bypass-saturation node. The deep-research cross-check the review asked to be made possible then surfaced a real content gap, so a third animal model was curated: the independently derived Gstz1-null BALB/c line (PMID:15277241), which has hepatomegaly, renomegaly, splenic atrophy and multifocal hepatitis on standard chow where the existing line is healthy for 22 months. It is linked PARTIALLY_RECAPITULATES at LOW fidelity with POPULATION_MISMATCH and SPECIES_MISMATCH divergences, and the HUMAN_MODEL_MISMATCH discussion rationale now records that the murine baseline is strain-dependent. Also resolved the branch's single merge conflict, in cache/hgnc/terms.csv, by keeping both rows in canonical CURIE order. Validation on the merged tree: just validate PASS with 85/85 snippets verified; validate-terms, check-reference-titles, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-reference-cache-frontmatter, check-term-cache-integrity, check-cache-order all PASS; model-scale-audit --strict exits 0.

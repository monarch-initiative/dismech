  summary: 'Create: Maleylacetoacetate Isomerase Deficiency (GSTZ1, MONDO:0060527)'
  details: |
    New kb/disorders entry for IEMbase WP-002 row 1.4.06.01 (GSTZ1-related maleylacetoacetate isomerase deficiency, OMIM 617596), anchored to MONDO:0060527 (skos:exactMatch, OMIM:617596 / MEDGEN:713903 / UMLS:C1291607). Curated from ten PubMed references fetched with just fetch-reference; no cache file hand-written. The pathograph is built around the disorder's defining negative: a block immediately upstream of the tyrosinemia type 1 lesion is not disease, because glutathione isomerises maleylacetoacetate to fumarylacetoacetate non-enzymatically. Two mechanistic_hypotheses groups separate that CANONICAL bypass account from the EMERGING bypass-saturation toxicity arm, which carries only model-organism and in vitro evidence and has no human phenotype attached below it. Three discussions: a HUMAN_MODEL_MISMATCH on the mouse dying on a high-protein diet against a 32-year human natural history on unrestricted intake, a KNOWLEDGE_GAP on whether lifelong succinylacetone exposure is inert given its characterization as an oncometabolite in hepatocellular carcinoma models, and a CONTROVERSY on the single unconfirmed fatal historical case that the LOW burden level depends on excluding. Two animal models from the 2002 Gstz1-null study, curated separately because they answer different questions. Two treatments left ontology-unbound (surveillance without disease-directed therapy, exposure avoidance) following the Congenital_Laryngomalacia and ReNU_Syndrome precedent that NCIT has no suitable term below NCIT:C25218. Validation: just validate PASS with 80/80 snippets verified against cached references; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-term-cache-integrity, check-cache-order and model-scale-audit --strict all PASS.

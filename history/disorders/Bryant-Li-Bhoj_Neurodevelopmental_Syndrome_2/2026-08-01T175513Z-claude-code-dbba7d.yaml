  summary: 'Create: Bryant-Li-Bhoj Neurodevelopmental Syndrome 2'
  details: |
    De novo curation of BLBS2 (H3-3B / MONDO:0030607 / OMIM:619721). Deep research provider: falcon (Edison Scientific), report at research/Bryant-Li-Bhoj_Neurodevelopmental_Syndrome_2-deep-research-falcon.md (12 citations, 468s runtime). The DR report was used as leads only: every PMID, snippet and ontology term was independently re-verified against fetched PubMed abstracts and OAK. NEC preflight was run against MONDO:0030607 (causal gene H3-3B/HGNC:4765, OMIM:619721 xref, BRYLIB2 synonym) because BLBS is a numbered series with a paralog twin (BLBS1/H3-3A); no entity confusion was found. GeneReviews baseline PMID:37782742 was fetched, tagged in the top-level references block, and cross-referenced against the phenotype list. The entry carries an 8-node pathograph running from the de novo H3-3B variant through disrupted nucleosome assembly and chaperone interaction and aberrant local histone PTM (explicitly contrasted with the global PTM collapse of somatic oncohistones) to altered chromatin accessibility, then to impaired neuronal differentiation and maturation, a neural-crest craniofacial defect, deregulated proliferation, and the organism-level brain phenotype. 42 phenotypes with HPO bindings and cohort-derived frequencies; H3-3B-specific figures are quoted wherever sources stratify by gene (seizures 59 vs 45 percent, genital anomalies 28 vs 17 percent, delayed walking 65 vs 85 percent, dysmorphism 86 vs 95 percent). Five knowledge-gap discussions, one of them a HUMAN_MODEL_MISMATCH covering the fact that the zebrafish evidence models the h3f3a paralog rather than h3f3b. Validation: just validate passes for schema, terms and references, with 114/114 snippets verified against cached references; check-snippet-length is clean for this file; compliance root score 50 percent with only datasets missing.

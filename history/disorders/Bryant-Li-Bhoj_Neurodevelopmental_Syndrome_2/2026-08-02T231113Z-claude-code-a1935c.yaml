  summary: 'Address PR review: evidence-integrity fixes'
  details: |
    Responded to the automated dismech PR review on #7883, which requested changes on one evidence-integrity finding. Fixed the blocking issue: the Generalized Hypotonia evidence snippet had been truncated at a comma to read 'Eighty-four percent of individuals present with hypotonia,', which asserts an 84 percent hypotonia frequency and contradicts the 57/92 (62 percent) denominator quoted in the sibling evidence item of the same phenotype. The 84 percent figure is the combined any-tone-abnormality rate. Extended the snippet through the full clause (hypotonia, hypertonia, or a combination of axial hypotonia with peripheral hypertonia) and rewrote the explanation to state the distinction explicitly. This truncation was self-inflicted during an earlier pass that lengthened snippets to satisfy check-snippet-length, and is the failure class where a snippet passes substring validation while misleading a downstream reader. Also folded in both non-blocking suggestions: the two treatment snippets (Antiseizure Pharmacotherapy, Craniosynostosis Surgery) now begin at the 'Standard treatment for' clause so they read as management recommendations rather than bare manifestation lists; and two evidence_source values were reclassified, the germline-versus-somatic proliferation-convergence conclusion from HUMAN_CLINICAL to IN_VITRO (it rests on patient fibroblast assays) and the H3F3A/H3F3B ubiquitous-expression statement from HUMAN_CLINICAL to OTHER (expression-atlas background). The reviewer's fourth item concerned PR description drift rather than the YAML and had already been corrected before the review job completed. Revalidated: just validate passes for schema, terms and references with 114/114 snippets verified; check-snippet-length clean for this file.

  summary: 'Phenotype review: Bryant-Li-Bhoj_Neurodevelopmental_Syndrome_2'
  details: |
    Campaign phenotype review of all 42 phenotypes: snippet-claim consistency in whole-source context, optimal HPO binding, and pathograph explanation. Snippet/evidence fixes: two evidence items whose explanations declared PARTIAL while supports said SUPPORT were reconciled to the post-7439 pattern (Developmental Regression historical-classification quote -> SUPPORT + directness INDIRECT; Paroxysmal Dyskinesia title-only case letter -> SUPPORT + directness DIRECT with weakness noted); the cardiac snippet was extended to include 'including atrial septal defects'; an 8%-autism quantitative snippet from PMID:38678163 was added to ground the OCCASIONAL band. Term rebinds (4): Structural Brain Abnormalities HP:0002060 Abnormal cerebral morphology -> HP:0012443 Abnormal brain morphology (findings include posterior fossa, not just cerebrum); Oculomotor Dysfunction HP:0012373 Abnormal eye physiology -> HP:0000496 Abnormality of eye movement; Congenital Heart Defects HP:0001631 Atrial septal defect -> HP:0001627 Abnormal heart morphology (13% figure covers cardiac anomalies generally, ASD only an example); Dermatologic Anomalies HP:0001212 Prominent fingertip pads -> HP:0001574 Abnormality of the integument with frequency OCCASIONAL -> FREQUENT (52% dermal burden). Checked and kept: HP:0001382 for ligamentous laxity (HP:0001388 Joint laxity is obsolete, merged into it). Pathograph: 0/42 -> 28/42 phenotypes causally connected. Added Seizures edge from Impaired Neuronal Differentiation and Maturation (E/I imbalance, PMID:41689096 edge evidence); Craniofacial Dysmorphism + five component facial features + Delayed Myelination from Neural Crest and Craniofacial Developmental Defect (zebrafish edge evidence, PMID:33268356); 20 summary edges from the organism-level endpoint node for the neurologic, imaging, developmental, tone and neurobehavioral manifestations it explicitly describes. The 14 remaining unexplained phenotypes (cardiac, genital/cryptorchidism, short stature, macrocephaly, craniosynostosis, dermatologic, joint laxity, scoliosis, failure to thrive/feeding difficulties, hypothyroidism, hearing, constipation, astigmatism) have no published mechanism and were deliberately left unwired, recorded in a new KNOWLEDGE_GAP discussion (blbs2_systemic_features_mechanism). Review round (PR 10485, ai4c-reviewer CHANGES_REQUESTED): the first pass wired Scoliosis and Failure to Thrive and Feeding Difficulties from the neurologic endpoint node on neuromuscular/oromotor reasoning that no BLBS source states, which is the same inference the knowledge gap explicitly rejects for Constipation, and which treated Scoliosis differently from Joint Hypermobility despite both coming from one musculoskeletal table row at 21% and 22%. Both edges were removed and both phenotypes moved into blbs2_systemic_features_mechanism (12 -> 14), taking the connected count from 30/42 to 28/42; the gap rationale now names all three neurologic-secondary temptations and records why Craniosynostosis is left unwired despite sitting near the neural-crest node. The Structural Brain Abnormalities on Neuroimaging description was extended to state the small-posterior-fossa (13/18, 72%) finding the HP:0012443 rebind rests on. Validated: just validate, count-verified-snippets 119/119, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, validate-history, validate-disorders all pass.

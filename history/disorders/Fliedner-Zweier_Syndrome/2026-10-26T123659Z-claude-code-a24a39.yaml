  summary: 'Create: Fliedner-Zweier_Syndrome'
  details: |
    New entry for Fliedner-Zweier syndrome (MONDO:0957787; SCAF4, hgnc:19304),
    curated from the stub queue (stub deleted).

    Sources: the founding cohort (Fliedner et al. 2020, PMID:32730804, full
    text) and the 50-individual replication cohort (Schmid et al. 2025,
    PMID:39668183, full text) carry the clinical picture. Phenotype
    frequencies are the n/N of the "Truncating, this cohort" column of the
    Schmid Table 1, quoted row by row; the pooled Total column was not used as
    a frequency. White matter anomalies use the founding cohort's 3/5.
    Mechanism: Gregersen et al. 2019 (PMID:31104839, HEK293 knockout cells,
    graded IN_VITRO) and the CID-CTD structure (PMID:34897689, IN_VITRO);
    patient blood RNA-seq (PMID:32730804, PMID:40290495); fly and zebrafish
    models (PMID:32730804, PMID:37394306, MODEL_ORGANISM). Edges from SCAF4
    haploinsufficiency to downstream nodes and phenotypes are marked
    INDIRECT_UNKNOWN_INTERMEDIATES; the termination defect itself is shown
    only in engineered knockout cells, not in patient cells.

    Deep research: openscientist report committed
    (research/Fliedner-Zweier_Syndrome-deep-research-openscientist.md); used
    as leads only. Its retro-fitted reference validation resolved 7/7
    references; the one unmatched quote (PMID:37891035) is a square-bracket
    normalisation artefact, not a missing passage. just preflight-dr was not
    run because it requires a local MONDO sqlite build, which was not
    downloaded for disk-space reasons.

    ClinGen classifies SCAF4 as Definitive for MONDO:0100038 complex
    neurodevelopmental disorder (Intellectual Disability and Autism GCEP,
    2025-01-07), a different MONDO term, so no gene_disease_validity was
    recorded. No GeneReviews chapter exists (just check-genereviews:
    NO_CHAPTER).

    Validation: just validate, validate-terms, count-verified-snippets
    (64/64), entity-ref, causal-target, coarse-phenotype, duplicate-key,
    enum and GeneReviews checks passed.

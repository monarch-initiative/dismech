  summary: 'Detailed evidence review: all 42 evidence items verified, no defects'
  details: |
    Full manual evidence audit of kb/disorders/Chordoma.yaml.

    Scope: all 42 evidence items were re-read against their cited sources, covering 19 unique references -- 18 PMIDs (16538613, 30664779, 31221659, 25323095, 29026114, 32855205, 36804377, 36127333, 29880900, 38652222, 26099010, 19801981, 32631481, 36063190, 29423299, 28059654, 24774721, 36813169, 22331945, 29237806, 40627883) and 1 ClinicalTrials.gov record, NCT01811394. Every cache file was opened and read, and for the full-text caches the paragraph surrounding each quoted passage was checked.

    Checks performed on each evidence item:
    1. Snippet is an exact substring of the cached reference body. Mechanically confirmed at 42/42 verified by count-verified-snippets.
    2. The quote semantically supports the specific claim it sits under -- the pathophysiology node, causal edge, phenotype, biochemical marker, gene block, treatment or clinical trial.
    3. The supports grading matches the strength of the quoted statement.
    4. evidence_source classifies the cited study rather than the claim or the curator.
    5. No Named Entity Confusion between chordoma and the tumours it is most easily confused with at the skull base, in particular chondrosarcoma and benign notochordal cell tumour.
    6. Snippets are propositional statements rather than paper titles.

    Result: no defects found. No edits were made to the entry.

    Findings supporting that conclusion:
    - The evidence tiering across the mixed human, cell-line and animal literature in this entry is accurate. PMID:30664779 CRISPR screening and PMID:32855205 H3K27-demethylase inhibition are graded IN_VITRO because both are cell-line work. PMID:31221659 is graded MODEL_ORGANISM because the transformation result is a zebrafish notochord experiment. PMID:29880900 is split correctly across two items, IN_VITRO for the U-CH1 and U-CH2 EMT marker switch and MODEL_ORGANISM for the nude mouse xenograft growth result, which is exactly the split the classification rules ask for when one paper mixes sources.
    - The strongest attribution check in this entry concerns PMID:29026114. The snippet stating that recurrent CDKN2A loss is a key driver in chordoma development is drawn from the paper's introduction, where it summarises earlier copy-number and targeted-sequencing studies rather than this paper's own 104-tumour cohort. Both places that use it, the Cell-Cycle Dysregulation via CDKN2A Loss pathophysiology node and the CDKN2A genetic block, attribute it in their explanations to genomic surveys generally rather than to this cohort, and each pairs it with a second snippet drawn from the paper's own results confirming that homozygous CDKN2A deletion was recapitulated in their study. The pairing is honest and needed no change.
    - PMID:36804377 is used twice with different gradings, COMPUTATIONAL for the TBXT/TGF-beta/SOX6/SOX9 pathway-hyperactivation inference from expression profiling and IN_VITRO for the chordoma-cell experimental confirmation of TGF-beta dependence. The paper itself distinguishes its computational from its experimental evidence in the same terms, so the split is faithful to the source.
    - PMID:38652222 is graded IN_VITRO for the bone-dissolving-activity claim, and the explanation states that the mechanistic demonstration was in JHC7 chordoma cells. The paper does also report patient CT and histology, but the quoted conclusion is carried by the cell-based bone lysis assay, so the grading is defensible as written.
    - Named Entity Confusion check: no problems. PMID:25323095 and PMID:28059654 are both skull base chordoma series and are used only for chordoma claims, not chondrosarcoma. PMID:26099010 is the 5229-case brachyury immunohistochemistry study whose quoted conclusion is specifically about chordoma and which separately reports chondrosarcomas as negative. PMID:36063190 covers both benign notochordal cell tumour and spinal chordoma, and the quoted symptom sentence is drawn from the chordoma portion of the abstract.
    - PMID:19801981 is used for familial germline TBXT duplication and PMID:29026114 for somatic TBXT duplication in sporadic disease. The two are kept distinct rather than conflated.
    - Reference titles on evidence items match the title recorded in each cache file's frontmatter.

    Validation after review: just validate kb/disorders/Chordoma.yaml passed, and just count-verified-snippets reported 42/42 verified against cached references. No files under cache/ or references_cache/ were touched.

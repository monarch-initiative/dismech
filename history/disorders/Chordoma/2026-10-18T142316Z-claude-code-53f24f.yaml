  details: |
    Addressed the two IMPORTANT findings on the CircRNA m6A-Mediated c-MYC Dysregulation node. Added two HUMAN_CLINICAL evidence items from PMID:42667146 (circRNA sequencing showing circPSMB1 downregulation in chordoma tissue; association of low circPSMB1 with shorter disease-free survival). Added the xenograft sentence comparing circ@HA/HMnO2-Gel against the empty HA/HMnO2-Gel carrier, with an explanation that only the effect beyond the empty-carrier arm is attributed to circPSMB1, and reworded the downstream edge and node description to match. Did not add METTL3/HNRNPA2B1/MYC gene descriptors: the node carries no molecular function, so wiring genes would fail the gene-activity grounding gate, and the paper does not state a single molecular function for the node. Validation: just validate passed; count-verified-snippets 48/48; check-folded-hyphens and check-reference-titles clean.

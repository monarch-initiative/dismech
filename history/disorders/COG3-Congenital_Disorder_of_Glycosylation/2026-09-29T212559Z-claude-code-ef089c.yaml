  summary: 'Create: COG3-Congenital Disorder of Glycosylation'
  details: |
    De novo curation of COG3-CDG (MONDO:0957820, OMIM:620546) from a seed file. Deep research input was one Perplexity sonar-deep-research report, research/COG3-Congenital_Disorder_of_Glycosylation-deep-research-perplexity.md, generated through the streaming transport shim that works around dismech#9357 (same model). Its reference validation verified all 4 references it resolved, but it cited mostly database pages; its only primary source was the delineating paper. The preflight-dr WARN counted disease acronyms as second genes and was a false positive; the report is about COG3. Primary literature was re-derived from PubMed searches on COG3 with glycosylation, Golgi and patient terms. The delineating report, Duan et al. 2023 (PMID:37711075), was re-fetched with --force to replace an abstract-only cache with the PMC full text, which supplies the per-patient phenotypes, both alleles, the COG3/COG4 western blots and the Brefeldin A transport assay. That paper reports no rescue by COG3 re-expression, so none is claimed. No second COG3 patient report was found. Mechanism steps between trafficking failure and hyposialylation cite COG3 siRNA knockdown (PMID:16420527, PMID:21421995) and CRISPR knockout HEK293T studies (PMID:27066481, PMID:34053170), all graded directness INDIRECT; the lobe A severity hypothesis (PMID:28848061) is cited INDIRECT for the non-viability of lobe A null genotypes. Nodes conform to congenital_disorder_of_glycosylation (Golgi N-Glycan Processing and Trafficking Defect; Protein Hypoglycosylation), matching the COG1, COG7 and COG8 entries. Phenotype frequency bands were omitted because the denominator is four patients; counts are in descriptions. Muscle wasting in the Pakistani family is flagged as possibly due to a homozygous SCN4A VUS the authors name. No GeneReviews or StatPearls chapter exists (check-genereviews --online, with synonyms). Validation: validate, count-verified-snippets (79/79), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-reference-titles, check-title-snippets, check-snippet-length and validate-disorders all passed; 18 of 26 phenotypes are causally connected, the rest (craniofacial features, lactate, weight gain, muscle wasting) have no sourced mechanism. The curation stub for CDG IIbb was deleted.

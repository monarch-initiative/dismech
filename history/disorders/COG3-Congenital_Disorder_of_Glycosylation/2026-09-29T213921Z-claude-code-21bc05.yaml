  summary: 'Review round 1: COG3-CDG motor phenotypes, mortality, scale'
  details: |
    Addressed the round 1 review (CHANGES_REQUESTED) of PR 13182. All new quotes were checked against the PMC full-text cache of PMID:37711075, and every HP term was looked up in cache/hp/terms.csv and confirmed current in OLS. (1) Added six motor phenotypes. Tetraparesis (HP:0002273, quadriparesis) and Hand tremor (HP:0002378) come from the Egyptian proband, a family with no reported second locus, and are wired from the neurodevelopmental node; Drooling (HP:0002307) comes from the adult Pakistani proband and is also wired. Gait disturbance (HP:0001288), Spasticity (HP:0001257) and Joint contracture (HP:0034392) are from the Pakistani family. Their descriptions record that the proband is homozygous for an SCN4A variant of uncertain significance, which the authors name as a possible cause of his muscle wasting, contractures and impaired gait; gait and contracture carry a REFUTE item quoting that sentence. These three are deliberately not wired to the mechanism. (2) Added a structured progression block with two phases. The first is onset from 8 months to 2 years. The second is progressive decline and early death: 3 of 5 affected family members died, at 3 years (aspiration pneumonia), 15 years (unknown cause) and about 15-16 years in an ungenotyped sister described as progressively deteriorating; each case is cited by its own sentence. Global developmental delay now carries clinical_course PROGRESSIVE, backed by the regression and deterioration sentences; the explanation states that the deteriorating sister was never genotyped. (3) The three transferrin snippets were extended to the full sentence ending (Figure 2A). (4) Deficient Protein Sialylation was retagged from ORGANISM to MOLECULAR: the node states a structural glycan change on proteins, measured on the transferrin molecule. It is not an organism-level process, even though the specimen is serum. (5) The seizure description now notes that the synopsis gives onset from 10 months while the case reports give 8 months in both Egyptian siblings. Validation: validate, count-verified-snippets (99/99), validate-terms, check-entity-refs, check-causal-targets and check-duplicate-keys passed; 21 of 32 phenotypes are causally connected.

  summary: Wire rate-control therapy to the beta-adrenergic blockade module
  details: |
    Added a therapeutic_vulnerability pathophysiology node, Beta-Adrenergic Receptor Blockade (Rate-Control Target), conforming to beta_adrenergic_receptor_blockade#Beta-Adrenergic Receptor Antagonist Occupancy, and pointed the existing Rate Control treatment at it. That treatment previously targeted only Palpitations and Exercise Intolerance, which are the symptoms it relieves rather than the mechanism it acts on, so the pathograph recorded no mechanistic account of rate control at all. Only ADRB1 is bound, since rate control depends on beta-1 blockade of nodal tissue. Evidence reuses PMID:39604644, already cited by that treatment, plus PMID:17998992 for the receptor-level action. Validated with just validate-disorders (0 issues).

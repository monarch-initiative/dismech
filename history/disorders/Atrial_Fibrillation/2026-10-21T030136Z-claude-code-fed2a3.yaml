  details: |
    Two corrections from the #15087 review, both correct findings.
    The new conformer node binds GO:0004939 with modifier DECREASED, so it already means reduced receptor activity; pointing the treatment at it with treatment_effect: INHIBITS read as the beta-blocker suppressing its own blockade. Changed to ACTIVATES, matching the module's own treatments, which use ACTIVATES on the same occupancy node.
    The node's description named the upstream driver it blunts (and, in Essential_Hypertension, a downstream node) while carrying no causal edge, leaving it an island in the pathograph. Rather than draw an edge, the description now records why there is none: the relation to the driver is inhibitory and a downstream edge asserts causation, so the node is deliberately a treatment anchor reached through target_mechanisms. This matches the four merged mu-opioid conformers, which also carry no downstream edge.
    Revalidated with just validate-disorders (0 issues) plus the offline entity-ref, causal-target, duplicate-key, enum and block-scalar gates.

  summary: Add gut-microbial TMAO -> M2R autonomic-dysfunction mechanism arm
  details: |
    Added a debundled 5-node causal chain from Arjunan et al., J Clin Invest 2026 in-press (DOI:10.1172/JCI201684): Gut Microbial TMA Production (CutC/D) -> Hepatic FMO3 Oxidation to TMAO -> Elevated Circulating TMAO -> Muscarinic M2 Receptor Inhibition -> Cardiac Autonomic Dysfunction, wiring into the existing Atrial Electrical Remodeling (APD80/wavelength shortening) and Atrial Structural Remodeling (left atrial dilation) nodes. Added the gut-restricted CutC/D inhibitor iodomethylcholine (IMC) treatment using the target_mechanisms INHIBITS pattern, and an EMERGING mechanistic_hypotheses group (tmao_autonomic_af). Each node carries an evidence snippet verified as an exact substring of the cached DOI abstract; DOI refs are skipped by the snippet validator by project config, so snippets were checked manually. Validated: linkml-validate (schema) clean, term validation passed, targeted test_data.py FK/uniqueness/target-mechanism tests passed.

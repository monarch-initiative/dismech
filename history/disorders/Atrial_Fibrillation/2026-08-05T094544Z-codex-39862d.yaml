  summary: 'Publication-readiness review: Atrial Fibrillation'
  details: |
    Full independent publication-readiness review through 2026-08-05. Reconciled common clinical AF scope to MONDO:0004981; removed rare familial channelopathy leakage and unsupported frequency bands; replaced broad/mismatched HPO terms; split human, model, in-vitro, computational, and review evidence; added epidemiology, natural history, prognosis/burden, diagnosis, biomarkers, differential diagnoses, trials, models, and knowledge gaps. D2P dispositions (31/31): (1) Dizziness/Vertigo rejected and removed (mismapped/unsupported); (2) aortic valve stenosis rejected (comorbidity/source leakage); (3) chest pain accepted as HP:0100749; (4) elevated LV end-diastolic diameter rejected (source-specific structural finding); (5) exercise intolerance accepted as HP:0003546; (6) first-degree AV block rejected (conduction/channelopathy leakage); (7) hypertension rejected as phenotype and retained as risk factor; (8) left atrial enlargement rejected as top-level phenotype and retained only as progression/substrate observation; (9) LV hypertrophy rejected (structural comorbidity leakage); (10) myocardial infarction rejected (nonspecific associated outcome); (11) prolonged P wave rejected (source-specific electrophysiology); (12) prolonged PR rejected (conduction leakage); (13) prolonged QRS rejected (ventricular conduction leakage); (14) prolonged QTc rejected (familial KCNQ1 leakage); (15) right-ventricular dilatation rejected (comorbidity leakage); (16) ST elevation rejected (ischemic/channelopathy leakage); (17) syncope rejected (familial source; disease review supports presyncope only); (18) third-degree AV block rejected (conduction leakage); (19) thromboembolic stroke accepted as HP:0001727; (20) generic thromboembolism represented by Atrial Thrombus Formation plus specific thromboembolic stroke, not duplicated; (21) tricuspid regurgitation rejected (structural comorbidity leakage); (22) unlinked Dizziness rejected by removing it rather than inventing an edge; (23) specific AF accepted by replacing broad Arrhythmia with HP:0005110; (24) atrial flutter rejected as phenotype and added as differential; (25) bradycardia rejected as separate rate/conduction phenotype; (26) paroxysmal AF accepted as evidenced subtype rather than duplicate phenotype; (27) permanent AF accepted as evidenced management-state subtype; (28) premature atrial contractions rejected as core phenotype (pre-AF marker/trigger not general manifestation); (29) sinus bradycardia rejected (sinus-node/source leakage); (30) sudden cardiac death rejected (nonspecific outcome/source leakage); (31) supraventricular tachycardia rejected (broader/separate rhythm category). Scoped graph validation passes with 7/7 phenotype connectivity. PITX2 and ZFHX3 remain intentionally unwired because GWAS susceptibility does not justify a gene-to-mechanism causal edge.

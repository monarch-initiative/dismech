  summary: Link modifiable risk factors to the remodelling nodes they act on
  details: |
    Backfill for issue #8085. Six exposures deliberately routed to four different nodes rather than a single substrate node, because the entry models electrical, structural, oxidative and autonomic arms separately and the risk factors do not act alike. Hypertension targets atrial fibrosis via pressure-driven stretch. Obesity targets the NOX2-dependent oxidative stress node specifically, because the cited work shows NOX2 inhibition normalising action potential duration and abolishing obesity-mediated ion channel remodelling, placing NOX2 on the causal path; that item carries supports PARTIAL since the demonstration is experimental animal work. Obstructive sleep apnoea targets cardiac autonomic dysfunction, reflecting the pressure swings and autonomic surges of apnoeic episodes. Alcohol and hyperthyroidism target atrial electrical remodelling, both being effects on refractoriness and automaticity rather than on structure, and hyperthyroidism is noted as reversible with restored euthyroidism. Tobacco smoking is PREDISPOSES only, appearing in cohort risk modelling without an identified atrial mechanism. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged.

  summary: 'Review round 2: replace three snippets that did not carry their claims'
  details: |
    All three blocking findings in round 2 were defects introduced by my round-1 fix commit, and all three are the same defect: an exact, verified snippet that does not itself say what the claim says. Passing the reference validator is not the same as supporting the claim, and I had treated verification as if it were.

    The Vaccination and Management of Atopic Disease treatments both quoted the Table 6 caption - 'Summary of therapeutic interventions that may be beneficial for SIgMD deficiency' - which names neither intervention and asserts nothing about either. Replaced with the specific rows. The atopy row is better on its merits as the reviewer said, because it gives the reason: managing atopic disease may reduce complicating sinopulmonary infections, which ties it to infection burden rather than comfort. The vaccination row carries a safety qualification the caption also lost - attenuated vaccines warrant T cell assessment first.

    The PMID:30610030 item on Autoimmunity quoted a sentence about recurrent infections and undefined pathogenesis, attached to an autoimmunity claim. Worse than an oversight: my own explanation conceded the support was the paper's title rather than the quoted sentence, so I noticed the mismatch, wrote it down, and shipped it anyway. Replaced with the report's own conclusion, which states directly that sIgMD can manifest sometimes only with autoimmunity - a distinct claim from the 43% frequency, and the report's result rather than its framing, so quote_role BACKGROUND came off and directness became DIRECT.

    Non-blocking items also taken: split the bundled antibiotics treatment into Prophylactic Antibiotics and Prompt Treatment of Febrile Illness, which Table 6 lists as separate rows and which are genuinely different interventions - one reduces infection rate, the other limits the consequences of an infection already under way. Both cite the same unhedged body sentence, with each explanation naming the half it covers. Pruned PMID_23760686, re-deriving the cited list immediately beforehand and confirming nothing in kb/ cites it.

    Left: Discussion.evidence is used on the treatments discussion and not on the other three.

    One self-inflicted error worth recording: I duplicated the therapeutic_modality key while adding the new treatment. check-duplicate-keys caught it, which is the gate CLAUDE.md documents as existing because PyYAML silently keeps the last value while the reference validator aborts.

    Gates: validate, validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all pass. Snippets 29/29 to 30/30 verified.

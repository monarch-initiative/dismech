  summary: 'Review round 1: curate treatments, immunophenotype and split allergic
    node'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review (0 critical, 6 important). Same root cause as the sibling PRs in this batch: sources committed by this PR carried quotable in-scope material the entry did not consume.

    1. Added a treatments section with four interventions from PMID:37685399 Table 6, following the Selective_IgA_Deficiency pattern: prophylactic antibiotics and prompt treatment of febrile illness; immunoglobulin replacement marked as a restricted indication; vaccination; management of atopic disease. Rewrote the sigmd_no_curated_treatments rationale, which claimed curating immunoglobulin replacement would assert a non-existent evidence base. The intervention is described in the literature; what is missing is trial evidence. The rewritten discussion says that, carries the review's own 'no conclusive data' sentence as evidence, and notes that none of the four interventions is directed at the IgM deficit itself.

    2. Six uncited caches resolved. Cited PMID:28730517 and PMID:31970029 (see below) and PMID:30610030. Pruned two: DOI_10.1111_pai.14015 duplicates PMID_37728524 (identical title, scp markup), and DOI_10.3389_fimmu.2017.01056 is content_type unavailable with a zero-length body. Re-derived the cited-reference list immediately before pruning.

    3. Curated the measured immunophenotype from PMID:28730517 as four biochemical readouts: isohemagglutinin titers, marginal zone B cells, transitional and CD21low B cells, serum IgE. Recorded as laboratory correlates rather than mechanism, consistent with the entry's stance and with that paper's own conclusion that pathogenesis remains unclear.

    4. Split the Allergic Disease phenotype, which was bound only to HP:0003193 Allergic rhinitis while its snippet reported rhinitis and asthma at comparable frequencies. Now separate Allergic Rhinitis and Asthma (HP:0002099) nodes. Added Neoplasia (HP:0002664) at 13.51%. The rename broke discussions[2].attaches_to; check-entity-refs caught it and it is repointed at all three relevant nodes, which is more accurate than the single reference it replaced.

    5. Added the direct 43% autoimmune-disease frequency from PMID:31970029 as DIRECT evidence on Autoimmunity, ahead of the existing INDIRECT follow-up recommendation, which is retained and correctly graded.

    6. Bound biomarker_term HP:0002850 on Serum IgM. Left Serum IgG and IgA unbound: the entry's claim there is that both are normal, and a term asserting an abnormality would misdescribe it.

    Suggestion taken: added quote_role BACKGROUND to the three PMID:41009569 definitional snippets, which restate IUIS and ESID criteria rather than reporting that cohort study's own result.

    Gates: validate, validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-environmental-evidence all pass. Snippets 14/14 to 29/29 verified.

    One validator behaviour worth recording: the reference validator normalizes inline citation markers such as [71] out of cached text, so a snippet spanning one cannot match. Split that quote into two bracket-free spans rather than paraphrasing.

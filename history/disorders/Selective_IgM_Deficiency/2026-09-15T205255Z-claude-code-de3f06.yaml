  summary: 'Create: Selective IgM Deficiency (MONDO:0018039)'
  details: |
    De novo curation of selective IgM deficiency.

    Lump/split decision: curated as a Disease, though the claim issue (#11867) anticipated that OUT_OF_SCOPE might be the honest outcome. Two grounds for keeping it: the IUIS has classified it among the predominantly antibody-affecting deficiencies since 2017, and the phenotype associations (recurrent respiratory infection, allergy, autoimmunity) reproduce across independent cohorts. The counter-argument is recorded as a discussion rather than settled, because it turns on a redefinition the field has explicitly called for and not yet made.

    The entry has ONE pathophysiology node and it has no upstream parent. That is the finding, not an incomplete curation. PMID:37685399 states that no genetic or molecular basis has been established as a definitive cause. Candidate mechanisms in the literature — defective B-cell terminal differentiation, regulatory-T-cell suppression of IgM synthesis, impaired class-switch-independent secretion — are deliberately absent from the pathograph, because a node with no evidence behind it reads as knowledge once it is in the graph.

    What is curated instead is the definitional state: the IUIS and ESID criteria as two DIAGNOSTIC_CRITERIA definitions plus the shared secondary-cause exclusion, and three KNOWLEDGE_GAP discussions covering the missing mechanism, whether this is one entity at all, and whether infection should be a diagnostic criterion when allergy is more frequent.

    Three findings behind the 'is it one entity' discussion: the two definitions select measurably different clinical profiles when applied to the same 75 patients; IgM concentration is dynamic within a patient (chronic/intermittent/progressive/resolved courses), so a single-timepoint criterion does not identify a stable group; and 26% of one isolated-IgM-deficiency pediatric cohort had a different nameable IEI on molecular testing.

    category: Acquired rather than Mendelian, departing from the seed value: no gene is established and MONDO records no causal gene, so Mendelian would assert an inheritance model the literature says is not known.

    quote_role is used on four items (BACKGROUND / REVIEW_SYNTHESIS) and carries real weight here, because much of what can be said about this entity comes from narrative reviews. Without the marker, evidence_source: OTHER alone would not distinguish 'a review synthesising others' work' from 'a study whose design does not fit the enum', and for an evidence base this thin that distinction is most of the information.

    No treatments curated: the review states no conclusive management data exist and that immunoglobulin replacement, where considered, is indicated by associated antibody deficiency rather than by the IgM deficit.

    The two prevalence records are deliberately not merged: one is complete IgM deficiency in the general population (0.03%), the other a referred immunology-clinic population whose own quoted range spans thirtyfold (0.07-2.1%).

    Validation: 14 snippets verified; schema, term, duplicate-key, entity-ref, causal-target, qualifier-term and enum-value gates pass.

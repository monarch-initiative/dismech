  summary: 'Create: Adamantinoma'
  details: |
    Created new dismech entry for adamantinoma (MONDO:0002422), a rare low-grade malignant bone tumor of the tibial diaphysis, closing curation issue #9551. Curated as a single CURATE_ROOT entry per issue scope (no has_subtypes); classic/tubular/basaloid/spindle-cell/squamoid growth patterns and the OFD-like/dedifferentiated forms are modeled as histopathology findings, not subtypes. Sourced primarily from direct PubMed literature search (PMID esearch/esummary/efetch) rather than the deep-research report, given the issue's explicit HIGH Named-Entity-Confusion risk with ameloblastoma (MONDO:0017795, odontogenic jaw tumor) and adamantinomatous craniopharyngioma (already kb/disorders/Craniopharyngioma.yaml). A falcon (Edison Scientific) deep-research report was also run (research/Adamantinoma-deep-research-falcon.md); just preflight-dr returned SKIP because MONDO records no RO:0004003 causal gene for MONDO:0002422 (expected, since no established driver gene exists for this tumor). Manual NEC checks (runoak sqlite:obo:mondo info MONDO:0002422 -O obo) confirmed: MONDO def matches the curated clinical picture (tibial diaphysis, biphasic epithelial/osteofibrous pattern, recurrence/metastasis to lung/nodes/liver/brain/skeleton if untreated); MONDO OMIM:102660 xref matches the DR report's own OMIM citation; MONDO synonyms (adamantinoma, adamantinoma of long bones, extragnathic adamantinoma, long bone adamantinoma) do not overlap ameloblastoma/craniopharyngioma synonyms; and the DR report itself carries an explicit Scope and evidence note distinguishing adamantinoma of long bones from ameloblastoma, adamantinomatous craniopharyngioma, and adamantinoma-like Ewing sarcoma, independently converging on the same tibial/OMIM/trisomy-7,8,12,19,21/no-established-driver facts sourced directly from PubMed. Verdict: not NEC. Modeled the OFD to OFD-like-adamantinoma to classic-adamantinoma histogenetic relationship as an OPEN discussions entry (kind KNOWLEDGE_GAP, discussion_id adam_ofd_progression_sequence) with attaches_to pointing at the relevant pathophysiology/histopathology/differential_diagnoses nodes and a proposed_experiments entry, rather than asserting a settled progression chain, since the largest recent clinicopathologic series (PMID:41653544) explicitly observed a morphological continuum but no progression during follow-up, in tension with older cytogenetic common-histogenesis literature (PMID:9242211) and a newer genomic study suggesting classic adamantinoma and OFD may be genetically distinct (PMID:42379271). Recurrent trisomies/copy-number gains (chromosomes 7, 8, 12, 19, 21) are recorded with mechanism_confidence PROVISIONAL and explicit framing that no single driver gene or fusion is established, per issue guidance. Keratin/p63 epithelial immunoprofile captured as the diagnostic histopathology anchor (PMID:7694513 keratin subclass paper, PMID:21674157 p63 paper, PMID:41653544 IHC positivity rates). differential_diagnoses covers ameloblastoma, adamantinomatous craniopharyngioma, adamantinoma-like Ewing sarcoma (t(11;22)/t(21;22) negative in true adamantinoma per PMID:11592101), and osteofibrous dysplasia. Treatments cover wide en bloc resection (mainstay), limb-sparing reconstruction, and pazopanib (case-report evidence of limited standalone efficacy, PMID:38486378), with a notes-only mention of the single-case olaparib precision-oncology report (PMID:41370129) rather than a fabricated general targeted-therapy entry. Validation: just validate (schema plus terms plus references, 32/32 snippets verified), just count-verified-snippets (32/32), just validate-terms (passed), just validate-disorders (the batched CI-equivalent sweep, passed cleanly), and just check-duplicate-keys (OK, no duplicates across 4383 files) were all run and their full output observed before this record was written.

  summary: 'Detailed evidence review: Adamantinoma evidence and reference audit'
  details: |
    Full per-item evidence review of kb/disorders/Adamantinoma.yaml.

    Scope: 50 evidence snippets checked across 17 distinct references, every cached
    reference body read in full (PMID:7694513 keratin subclass immunoreactivity,
    PMID:9242211 and PMID:11227067 cytogenetics, PMID:11592101 EWSR1 translocation
    status, PMID:12679847, PMID:18279517 clinicopathological review, PMID:20717000
    dedifferentiated case report, PMID:21674157 p63, PMID:30844202, PMID:34697136,
    PMID:35094574 osteofibrous dysplasia series, PMID:38486378 pazopanib case
    report, PMID:38539216 osteofibrous dysplasia review, PMID:39555331 SEER
    analysis, PMID:41653544 single-institution series, PMID:42379271 genomic
    characterization, PMID:42496518 structured narrative review). Each snippet was
    checked for exact-substring match, semantic support for its claim, supports
    grading, evidence_source classification of the cited study, and Named Entity
    Confusion.

    Named Entity Confusion was the specific risk audited hardest here, because
    "adamantinoma" collides with three other concepts. All checks passed: no cited
    paper is about ameloblastoma of the jaw, adamantinomatous craniopharyngioma, or
    adamantinoma-like Ewing sarcoma mistaken for the bone tumor. PMID:11592101 is
    correctly used to show that the EWSR1 t(11;22) and t(21;22) translocations are
    absent from true adamantinoma, and the file already carries explicit
    differential_diagnoses entries and a notes warning for the craniopharyngioma
    collision.

    Verified without change: the keratin 14/19/5 immunoreactivity figures and the
    basal-epithelial-differentiation conclusion; the recurrent trisomy 7/8/12/19/21
    pattern across two independent cytogenetic series; the contemporary genomic
    series' copy-number gains and its point that isolated structural and point
    variants differ tumor to tumor; the recurrence (15-31%), metastasis (10-27%),
    margin hazard ratio 0.164, multifocality 24% and pathological fracture 10-21%
    figures; the osteofibrous dysplasia-like subtype's absence of metastases; the
    single-institution pankeratin 94.7%/95%, p40 and p63 rates, the 20.7% diagnostic
    revision rate, and the 40%/60% radiologic-histologic concordance; the inguinal
    nodal and abdominopelvic recurrence documented in the pazopanib case report,
    which correctly grounds the nodal-metastasis model rather than a
    pulmonary-only one; and the REFUTE grading on the pazopanib efficacy item,
    which correctly reflects a case report of treatment failure.

    Defects found and fixed. Two claims rested on evidence that did not establish
    them. No snippet text was rewritten; both fixes add an exact sentence from
    PMID:18279517, a reference already cited elsewhere in this file.

    1. Tibial Bowing phenotype. Both evidence items were about osteofibrous
    dysplasia, not adamantinoma: a 101-lesion tibial osteofibrous dysplasia case
    series and an osteofibrous dysplasia narrative review. Osteofibrous dysplasia is
    a separate disease, curated in this same file as a differential diagnosis
    (MONDO:0011806), and whether it lies on a continuum with adamantinoma is exactly
    the open question recorded in this file's discussions block; the case series
    cited is in fact the one reporting that no lesion transformed to adamantinoma.
    Citing them as unqualified SUPPORT for an adamantinoma phenotype assumed the
    unsettled continuum. Fixed by adding the adamantinoma-specific sentence from the
    clinicopathological review, "The patient may presents with bowing deformity of
    the tibia due to involvement of anterior tibial surface" (the grammatical error
    is verbatim in the source), as the primary support. The two osteofibrous
    dysplasia items were kept, because they are informative about the spectrum and
    their explanations already disclose their source, but they now carry
    directness INDIRECT alongside SUPPORT (the supports enum retired PARTIAL
    while this review was in flight, so the indirect-support judgment is
    recorded on the directness axis instead).

    2. Local Cortical Bone Destruction and Structural Compromise node. Its only
    evidence was a sentence establishing that adamantinomas affect the tibial
    diaphysis and metaphysis, which gives the site but not the cortical destruction
    the node asserts. Fixed by adding "The lesion is commonly intra-cortical, but
    may destroy cortex and invade the extracortical soft tissues in about 15% of
    cases" from the same clinicopathological review, and marking the site-only
    quote directness INDIRECT with the limitation stated.

    Noted, not changed: the prevalence record's quote establishes the 0.1-0.5%
    rarity band that sets prevalence_class ULTRA_RARE, but the record's notes also
    state "74 patients identified in the SEER registry", which that quote does not
    cover; the figure is correct against the cached SEER abstract and sits in notes
    rather than in an evidenced claim, so it was left alone.

    Validation after edits: just validate passed. just count-verified-snippets
    reported 52/52 verified against cached references, with none skipped.
    just validate-disorders passed for this file. check-duplicate-keys,
    check-entity-refs, check-title-snippets, check-snippet-length,
    check-snippet-grading and check-folded-hyphens are all clean for this file.

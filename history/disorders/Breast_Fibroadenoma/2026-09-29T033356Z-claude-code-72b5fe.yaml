  summary: Record why no estrogen receptor gene is bound on the estrogen-annotated
    node
  details: |
    Third tranche of the estrogen-signalling pathograph work in issue #12925.
    The issue lists this entry's estrogen-annotated node among fourteen that
    bind GO:0030520 while naming no gene, as candidates for an ESR1 descriptor.
    Read against the node's own claim and sources, ESR1 is not the gene this
    node is about, so the node carries a recorded reason instead of a binding.
    The issue treats that as a closed task rather than an avoided one.

    The lesion here is the MED12 exon-2 mutation, which already has its own
    upstream node and is the only gene bound in the entry. PMID:25038752
    reports the estrogen-response and extracellular-matrix programs as
    expression-profiling correlates of that mutation and implicates no variant
    in any estrogen receptor gene. The node's own description says the
    intervening paracrine mechanisms remain incompletely resolved, and its
    modifier is DYSREGULATED rather than INCREASED, both consistent with an
    association rather than a receptor lesion.

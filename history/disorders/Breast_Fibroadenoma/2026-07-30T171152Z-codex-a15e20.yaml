  summary: Expand breast fibroadenoma mechanism model
  details: |
    Reviewed breast fibroadenoma as a benign biphasic tumor. Rebuilt the pathograph from the primary human-tumor evidence for stromal MED12 exon-2 mutations through dysregulated estrogen signaling and extracellular-matrix organization to biphasic fibroepithelial proliferation and breast mass. Added a structured somatic MED12 assertion, the primary discovery reference, and a triple clinical-imaging-biopsy diagnostic pathway. The overlapping MED12 HGNC descriptor from open PR 2620 was incorporated.

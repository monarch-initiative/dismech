  summary: 'Create: Distal_Arthrogryposis_Type_5'
  details: |
    Created the PIEZO2-related distal arthrogryposis type 5 entry (MONDO:0007158) from a stub. Deep-research input was a Perplexity sonar-deep-research report (research/Distal_Arthrogryposis_Type_5-deep-research-perplexity.md), generated with a locally streaming-patched deep-research-client because of dismech#9357 / deep-research-client#94. Its reference validation resolved 20/20 identifiers with none off topic; its term validation flagged only the MONDO and DOID mentions, which were label-paraphrase artefacts. Evidence was taken from primary reports rather than the report prose: Coste 2013 (PMID:23487782) for the patch-clamp gain of function, McMillin 2014 (PMID:24726473) for the 24/29 family yield, Ma 2023 (PMID:36634173) for the proprioceptive-neuron mouse mechanism, the C. elegans pezo-1(R2405P) model (PMID:38349741), DA5 family reports (PMID:25712306, 30938034, 35906671, 35698866, 36317804) and pre-PIEZO2 clinical delineations (PMID:15103714, 15389706, 17345626), plus the Orphanet record ORPHA:1154 for frequency grades. Pathophysiology is a chain from PIEZO2 gain of function through sensory-neuron excess mechanotransduction and tendon shortening to contractures, and from restrictive chest disease through alveolar hypoventilation to pulmonary hypertension; the edges from the PIEZO2 node to restrictive chest disease, ophthalmoplegia and ptosis carry INDIRECT_UNKNOWN_INTERMEDIATES and a KNOWLEDGE_GAP discussion because no source demonstrates their mechanism. A HUMAN_MODEL_MISMATCH discussion records the postnatal mouse critical window. References read but not used: PMID:41699910 (pneumothorax case with a Marden-Walker phenotype, not DA5), PMID:39062310 (review that tabulates ECEL1 DA5D and PIEZO2 cases together), PMID:8533802 and PMID:8923937 (older DA IIB reports, not needed for any claim), PMID:10466425 (no abstract available). Orphanet-graded inguinal hernia, macrotia, visual impairment, optic atrophy, deviation of finger and chin dimple were not curated for lack of a primary report. An OLS label search of HP for "cruciate" returned no term, so the absent-cruciate-ligament phenotype is unbound. The ORPHA:1154 cache was built from Orphadata files that have drifted from the manifest pin (release 2026-06-23 vs pin 2025-12-09); the manifest was not repinned. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), the per-file check-* gates and validate-disorders were run.

  summary: 'Deepen Ectodermal Dysplasia and Immunodeficiency 2 with GO:0051059 (NF-kappaB binding) grounding, AD EDA-ID-specific PMID:28629746 phenotype evidence, four additional phenotypes, structured gene_disease_validity, and CHEBI:3770 therapeutic_agent.'
  details: 'Wired NFKBIA into the IkBa Gain-of-Function pathophysiological trigger node with GO:0051059 (NF-kappaB binding, INCREASED) and modifier DECREASED on GO:0007249, connected downstream pathophysiology nodes to clinical phenotypes including Chronic Mucocutaneous Candidiasis (HP:0002728), Pneumocystis jirovecii Pneumonia (HP:0020102), Chronic Diarrhea (HP:0002028), and Decreased Gamma-Delta T Cell Proportion (HP:0500271), replaced generic ectodermal dysplasia snippets with AD EDA-ID-specific PMID:28629746 evidence, populated gene_disease_validity: DEFINITIVE on NFKBIA and therapeutic_agent CHEBI:3770 on Antimicrobial Prophylaxis, and added classifications, prevalence, progression, diagnosis, and differential_diagnoses sections.'

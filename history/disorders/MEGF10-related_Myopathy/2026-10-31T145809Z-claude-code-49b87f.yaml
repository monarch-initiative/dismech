  summary: 'Create: MEGF10-related_Myopathy'
  details: |
    New Disease entry for MEGF10-related myopathy (MONDO:0013731), curated from primary literature plus one OpenScientist deep-research report (research/MEGF10-related_Myopathy-deep-research-openscientist.md). Entry named MEGF10-Related Myopathy, the MONDO label in title case and an established gene-related dyad; the severity spectrum is carried as two has_subtypes rows, EMARDD (no MONDO term, since MONDO folds the severe variant into the primary term as an exact synonym) and the mild variant bound to MONDO:0859515. Nine pathophysiology nodes form a chain from biallelic MEGF10 loss of function through loss of receptor tyrosine phosphorylation, impaired MEGF10 to NOTCH1 signalling, reduced satellite cell proliferation and migration, premature differentiation with Pax7-positive pool depletion, reduced myofiber number and failed regeneration, and a branch to neuromuscular junction degeneration, ending in diaphragmatic weakness and generalized weakness; 28 phenotypes, 23 of them causally connected. ClinGen Definitive AR tier copied onto the MEGF10 genetic record with the CGGV assertion quoted. The report validated clean on references (24/24 resolved, 0 unresolved) but needs_review on terms (1 unresolved, HP:0001383, offered as Distal joint hyperlaxity and not used here; 4 label variants). just preflight-dr returned WARN: the report is about the right disease (MEGF10 mentioned 77 times, OMIM 614399 matches MONDO) but twice writes HGNC:3233, which is MEGF8, beside MEGF10; the entry binds hgnc:29634, read from HGNC, the stub and the ClinGen record. The report was used for cross-checking the causal chain, the genotype to onset correlation, the Notch-pathway gene network and the model inventory; every snippet was taken from a cached reference, not from the report. Validated with just validate, validate-terms, count-verified-snippets (136/136), check-genereviews (no chapter exists; the PubMed genereviews[book] searches are recorded in the entry notes), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-logical-rules, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-grading, check-retired-support-prose, check-shared-disease-terms, check-gene-validity, list-gene-term-mismatches, list-disconnected-phenotypes, check-term-cache-integrity and validate-disorders.

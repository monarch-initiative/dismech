  summary: 'Create: Immunodeficiency 53 (RELB deficiency)'
  details: |
    Entry type decided as DISEASE: one gene (RELB), one MONDO leaf term
    (MONDO:0054696), and one conserved pathograph. The stub
    stubs/Immunodeficiency_53.yaml is deleted in the same change. This
    session continued a skeleton entry from an earlier session on the same
    branch.

    Deep research. The claude_code report (from the earlier session) was
    used. Its references all resolved (6/6). preflight-dr returned WARN,
    which is benign: "CD4" there is the CD4+ T cell marker, and OMIM 604758
    is the RELB gene record. Falcon was attempted twice and failed with
    "Failed to authenticate", so no Falcon report exists. OpenScientist
    completed, but its report is about CARMIL2 deficiency, not RELB
    deficiency. It mentions RELB zero times, although all 22 references
    resolved, and preflight-dr told us to discard it. It was deleted
    uncommitted, and nothing in the entry comes from it.

    Sources. The entry rests mainly on full texts of PMID:39231201 (Le Voyer
    2024; two patients plus a nine-patient synthesis), PMID:36402602 (Sharfe
    2022; P364L sibship), PMID:37938781 (anti-type I IFN autoantibodies and
    patient thymus) and PMID:33791233 (Q135dup infant). The abstracts of
    PMID:26385063 and the 2015 LymphoSign DOI cover the original kindred.
    PMID:7834753, PMID:7845467 and PMID:37460023 supply the mouse data.
    ClinGen now classifies RELB / IMD53 as Definitive (2026-05-21, AR); the
    committed cache/clingen export still shows the 2023 Limited record. The
    Definitive record was fetched as a CGGV: cache file and copied into
    gene_disease_validity.

    Citations considered and not used:
    - PMID:28552761 (HSCT for RelB deficiency) has no cached text.
    - PMID:33083013, which ClinGen cites, mentions RELB only in a supplement.
    - The fungal review PMID:42461459 claims Pneumocystis pneumonia in RELB
      deficiency; no primary report supports this.

    Modelling. The organ autoimmunity of the P364L sibship has two
    published explanations, mTEC tolerance failure (Le Voyer 2024) and
    loss of RelB restraint on RelA (Sharfe 2022). Both are recorded as
    ALTERNATIVE mechanistic hypotheses with a CONTROVERSY discussion.
    Anti-type I IFN autoantibodies have no HPO term, so they are a
    pathophysiology node. No mechanism module fits, so there is no
    conforms_to.

    Review. An independent red-team subagent review led to these fixes:
    - Patient counts corrected to four complete and five partial, per
      PMID:39231201; the 2026 review's "three complete" is noted as
      inconsistent.
    - Organ autoimmunity limited to two of the three P364L siblings.
    - HP:0011950 replaced. Its current label is "Unusual bronchiolitis", an
      infection term; the committed cache still says "Bronchiolitis", so
      validation did not catch it. Pulmonary tuberculosis was added from the
      same resected lobe.
    - Hepatitis narrowed to Chronic hepatitis plus Hepatic fibrosis.
    - Verrucae replaced by Unusual warts.
    - Phenotypes added: B cell count, CD4 count, adenovirus infection and
      mastoiditis.
    - evidence_source, quote_role and the post-HSCT autoantibody wording
      corrected.

    Validation. just validate passes (schema, terms, references). All 87
    snippets verify, including the DOI item via --unskip-prefix DOI. The
    entity-ref, causal-target, duplicate-key, coarse-phenotype,
    snippet-length, title-snippet, snippet-grading, retired-prose, enum and
    folded-hyphen gates pass.

    PR review round 1 (PR #14207). The reviewer's one blocking item was a
    missing skin phenotype. HP:0011123 Inflammatory abnormality of the skin
    was added, with two PMID:36402602 snippets and an edge from the
    organ-autoimmunity node. All four suggestions were taken:
    - a diagnosis section (flow cytometry, anti-type I IFN autoantibody
      testing, fibroblast pathway assay, exome sequencing);
    - a notes sentence on rituximab and the lung resection;
    - a notes sentence on PMID:33083013, whose RELB case is supplement-only;
    - a stated reason the tuberculosis phenotype has no incoming edge.
    CI's gene-activity-grounding gate failed because RELB landed on a node
    with no molecular function. GO:0003700 DNA-binding transcription factor
    activity (DECREASED) is now bound on the RELB node, and the gate passes
    against origin/main. Snippets: 93/93 verified.

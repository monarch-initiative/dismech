  summary: 'Review fixes: Parkinson Disease, Mitochondrial'
  details: |
    Removed relationship_type CAUSATIVE from the MT-RNR1 m.T1095C genetic record and recorded in notes that the claim rests on a single pedigree with one cybrid functional study and no ClinGen/GenCC classification. Downgraded both cybrid modeled_mechanisms links from RECAPITULATES/HIGH to PARTIALLY_RECAPITULATES (MODERATE for the respiratory chain node, LOW for the hair-cell apoptosis node) with limitations: complex II is nuclear-encoded and complex IV was not reported for the cybrid; apoptosis was measured in cybrid host cells rather than cochlear hair cells. Dropped two descriptive synonyms that MONDO (OLS) does not list. Added PMID:22735573 evidence for the aminoglycoside-gene interaction to the GENETICS_ENVIRONMENT_DISEASE classification. Changed functional_impact_category to PARTIAL_LOSS_OF_FUNCTION for the heteroplasmic rRNA variant.

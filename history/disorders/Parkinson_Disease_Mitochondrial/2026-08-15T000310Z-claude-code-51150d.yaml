  summary: 'Create: Parkinson Disease, Mitochondrial (MONDO:0010796)'
  details: |
    De-novo curation of the maternally inherited MT-RNR1 m.T1095C form of Parkinson disease (OMIM:556500), scoped distinct from idiopathic PD (MONDO:0005180) and nuclear PARK forms. Deep research via OpenScientist (report validated 45/45 references, 0 confabulation). Manual NEC identity check confirmed the entity against OMIM:556500 / MT-RNR1 anchors; the report cleanly separated the OMIM 556500 core lesion from broader mitochondrial-PD context. Core evidence: Thyagarajan 2000 (PMID:11079536; defining mutation and complex IV deficiency) and Muyderman 2012 (PMID:22735573; cybrid confirmation and aminoglycoside hypersensitivity). Corrected an initial stub framing that described complex I deficiency (the idiopathic-PD signature) rather than the entity-specific translation defect leading to complex IV/II-III deficiency. GeneReviews: no dedicated chapter, expected for an mtDNA entity. Validation: validate + validate-terms + validate-disorders all pass; 14/14 snippets verified against cached references.

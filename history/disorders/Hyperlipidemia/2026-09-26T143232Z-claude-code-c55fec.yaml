  summary: 'Genetics pass: APOA5 type V subtype, subtype term bindings, LPL-FCHL decline'
  details: |
    Genetics pass for the d2g series-052 gap list (issue 12259). Checked the parent
    anchor first: disease_term MONDO:0021187 hyperlipidemia is exactly the class the
    entry is named after, so the anchor is correct. All four checklist diseases are
    grandchildren of it through MONDO:0001336 familial hyperlipidemia, which is why a
    correct broad anchor still pulls them into the gap list.

    Curated. Bound subtype_term MONDO:0005347 on the Hypertriglyceridemia row. Added a
    new gene-defined row, Hyperlipoproteinemia Type V, bound to MONDO:0007762 with
    APOA5 (hgnc:17288), a multifactorial inheritance block recording the second-allele
    requirement, and evidence from the APOA5 Q139X study and the six-variant in vitro
    study. Added an APOA5 genetic record with the reciprocal subtype foreign key and
    bound APOA5 as a gene on Impaired Lipoprotein Lipase Activity and ApoC-III
    Dysregulation, the node at which the protein acts. Gave the LPL genetic record the
    evidence it previously lacked and typed it CAUSATIVE.

    Declined, with reasons in the entry notes. Cholesterol-ester transfer protein
    deficiency (MONDO:0007744, CETP) and hyperlipidemia due to hepatic triglyceride
    lipase deficiency (MONDO:0013533, LIPC) are both filed by MONDO under
    hyperalphalipoproteinemia (MONDO:0015903); each is a single-enzyme deficiency with
    its own MONDO class and belongs in an entry of its own rather than as a subtype row
    of a complex-trait umbrella.

    Declined after investigation, against MONDO. MONDO:0007759 is labelled
    "hyperlipidemia, familial combined, LPL related" and asserts RO:0004003 hgnc:6677.
    No LPL-defined subtype row was created. A resequencing study of stringently
    classified patients and controls found defective LPL alleles at the same frequency
    in both groups and no triglyceride-modulating effect of loss-of-function LPL
    variants; a 2016 review concludes the trait is multigenic; and the pedigree report
    behind the attribution states its own conclusion as a speculation confined to one
    family. All three papers are cited on the Familial Combined Hyperlipidemia row,
    which records MONDO:0007759 as a skos:narrowMatch cross-reference so the concept is
    addressable without the gene claim being asserted.

    No subtype_term for Polygenic Hypercholesterolemia: MONDO has no class for it. The
    searches are recorded verbatim in that row's review_notes.

    Phenotype wiring. Added three mechanistically sourced causal edges to phenotype
    nodes, taking phenotype causal inlink from 1/7 to 3/7. Premature Atherosclerosis,
    Xanthomas, Corneal Arcus and Decreased HDL Cholesterol remain unwired; each would
    need a source for the specific edge and none was added rather than asserting one.

    Validation: just validate passed with 76 snippets checked and 0 issues;
    just validate-terms passed; just list-gene-term-mismatches --resolve reported 0
    findings with full HGNC coverage; the offline gate set ran clean.

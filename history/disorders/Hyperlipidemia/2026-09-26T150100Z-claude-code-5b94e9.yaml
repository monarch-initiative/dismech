  summary: 'Review round 1: type V is not the mixed pattern; stronger plaque-to-CAD
    source'
  details: |
    Review round 1 on PR 12906. Two changes.

    The reviewer showed that the Hyperlipoproteinemia Type V row had been linked to the
    wrong sibling row. Mixed Hyperlipidemia describes simultaneous elevation of
    cholesterol and triglyceride, which is the combined pattern of raised LDL and VLDL,
    and type V is raised chylomicrons plus VLDL triglyceride. The old name "mixed
    hyperlipemia", which MONDO:0007762 carries as a synonym, is the likely source of
    the conflation. The sentence calling type V the gene-defined form of the Mixed
    Hyperlipidemia pattern is removed; the type V row now describes itself as severe
    hypertriglyceridemia with chylomicrons and VLDL triglyceride elevated, states
    explicitly that this is not the Mixed Hyperlipidemia phenotype, and records that
    the MONDO synonym is the older name for type V rather than a link to that row. The
    cross-reference now runs from the Hypertriglyceridemia row, where the lipid
    phenotype matches.

    The evidence for the Atherosclerotic Plaque Development to Coronary Artery Disease
    edge was replaced. It had quoted PMID:30165986 on preventing cardiovascular events
    by slowing atherosclerosis, which is a framing of prevention rather than a
    statement that the lesion causes coronary disease. It now quotes the opening
    sentence of the Nature Reviews Disease Primers atherosclerosis review
    (PMID:31420554), which names the fibrofatty lesion in the artery wall as the cause
    of most myocardial infarctions. The reviewer suggested PMID:28444290 as a possible
    source; its abstract states that LDL causes atherosclerotic cardiovascular disease,
    which is the upstream claim rather than this edge, so a different paper was fetched
    instead.

    Also added quote_role BACKGROUND to the PMID:16200213 snippet about the etiology of
    type 5 hyperlipidemia, which is that paper's opening framing.

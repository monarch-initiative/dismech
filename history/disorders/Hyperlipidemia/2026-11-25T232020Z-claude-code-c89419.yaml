  summary: 'Gene-family review: LDLR, APOB, PCSK9, LPL, APOA5, APOE'
  details: |
    Typed the LDLR, APOB and PCSK9 records CAUSATIVE germline, consistent with the existing LPL and APOA5 records (each gene causes a monogenic hyperlipidemia curated in its own entry), added germline origin to LPL and APOA5, and bound the free-text inheritance blocks to HP:0000006 / HP:0000007. Typed APOE as RISK_FACTOR and gave it evidence for the first time: APOE variation contributes to polygenic hypercholesterolemia, combined hyperlipidemia and dysbetalipoproteinemia (PMID:37051929). Added molecular functions to the three gene-bearing nodes, which had only processes: LDL receptor activity and apoB-LDLR binding decreased on the shared clearance node; PCSK9 LDLR binding increased on the PCSK9 degradation node; lipoprotein lipase activity and apoA-V activator activity decreased, and apoC-III lipase inhibitor activity increased, on the lipolysis node.

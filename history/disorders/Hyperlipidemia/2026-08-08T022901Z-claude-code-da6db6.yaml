  summary: Link sedentary behaviour and obesity to the VLDL overproduction node
  details: |
    Backfill for issue #8085. Sedentary lifestyle and obesity both target the dysregulated hepatic lipogenesis and VLDL overproduction node at TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES, and are graded identically because they reach it by the same route: insulin resistance, which that node already names as the driver of its SREBP-1c lipogenesis. The intermediate is recorded as known for that reason. All four items are graded PARTIAL, because each measures the step before the node or the step after it and none measures the node. The sedentary cohort quantifies insulin and HOMA-IR on one side and triglycerides on the other; the obesity items report the circulating high-triglyceride and low-HDL pattern the node produces, with the weight-loss reversal carrying more causal weight than the association because removing the exposure reverses the output. High saturated fat diet was deliberately left unlinked. Its mechanism as stated in the entry, reduced LDL receptor expression, would point at the impaired hepatic apoB-containing lipoprotein clearance node, but the only quotable sentence available is a background sentence from a randomised trial reporting that saturated-fat-driven LDL cholesterol rises come primarily from large cholesterol-enriched LDL with minimal change in apolipoprotein B. That describes cholesterol enrichment of existing particles rather than reduced clearance of apoB-containing particles, and reduced receptor-mediated clearance would be expected to raise apoB particle number. Citing it under an apoB clearance node would have asserted more than it says, and pointed slightly against the node it was attached to, so the gap is left visible instead. The obesity exposure is a disease state rather than an exposure in the strict sense, the same modelling question raised against Cirrhosis in PR #8168; it is pre-existing here and was not re-modelled. No evidence grade or evidence_source was changed on any pre-existing item. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 34 of 60 verified with 26 pre-existing DOI-prefix skips, none of them on items added by this change.

  details: |
    Genetics pass for issue #12195 (d2g wiring-006).

    Research first: the GeneReviews chapter for dystrophic epidermolysis bullosa (PMID:20301481)
    is already cited and tagged in this entry and was re-read as the baseline before the
    reconciliation checklist was opened.

    The one checklist gene, COL7A1 (hgnc:2214), was already fully curated and fully wired: a
    `genetic:` record with a `gene_term`, plus `genes:` bindings on four pathophysiology nodes.
    The knowledge-graph gap is an export artefact - the checklist keys on MONDO:0007549
    (generalized dominant dystrophic epidermolysis bullosa), which is the DDEB `has_subtypes`
    term here, while the exporter emits gene edges only against `disease_term`
    (MONDO:0006543). See dismech#12316.

    What changed: all four `has_subtypes` rows (DDEB, RDEB-sev gen, RDEB-intermediate,
    RDEB-Inversa) now carry a `genes:` list naming COL7A1, and the `genetic:` record gained
    `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE`. No new evidence was added;
    nothing in the entry's existing evidence was altered.

    Noted, not changed: `just prose-figure-audit` flags three percentages in this entry
    (90% cumulative SCC risk twice, 30% of RDEB patients with nonsense mutations). The 90%
    figure is verbatim in a cited snippet elsewhere in the same file, which is the
    report-by-locality behaviour the audit is known for; the 30% figure sits in a treatments
    block untouched by this pass.

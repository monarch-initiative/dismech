  summary: 'Review: remove mismatched citation from mucosal blistering node (ECM review)'
  details: |
    Claim-evidence correctness review of ECM disorders. Fixed: removed PMID:19700011 from the Esophageal and Mucosal Blistering pathophysiology node. Its snippet ('Some epidermolysis bullosa subtypes are at risk for severe injury of the bone marrow, musculoskeletal system, heart, kidney, and teeth') contains no esophageal or mucosal content, and the explanation described generic multisystem extracutaneous complications rather than the node's claim. The node retains PMID:20301481, which directly supports esophageal stricture formation. The same reference's second use, on the Dental Caries phenotype, is apt and was left in place. Deferred to issue #6951: seven phenotypes carry a disease-level frequency (mostly VERY_FREQUENT) restricted only by a free-text note to severe RDEB - Pseudosyndactyly, Esophageal Stricture, Dysphagia, Growth Retardation, Cutaneous SCC, Microstomia, Osteoporosis. The entry's scope includes DDEB, where by its own subtype description nail dystrophy may be the only manifestation, so none of these occur in 80-99% of all DEB patients. The entry defines four subtypes but uses the subtype: foreign key zero times although the schema supports it and tests/test_data.py enforces it. Also noted but not changed: Anemia, Osteoporosis and Constipation frequencies rest on management-list fragments that establish the complication is managed, not how often it occurs. Validated with linkml-validate and an offline snippet-vs-cache substring check.

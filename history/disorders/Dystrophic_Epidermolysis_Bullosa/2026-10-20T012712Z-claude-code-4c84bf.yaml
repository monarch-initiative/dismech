  summary: Add Bart syndrome (MONDO:0007557) as a DDEB subtype
  details: |
    Resolved the stub for MONDO:0007557 (epidermolysis bullosa with congenital localized absence of skin and deformity of nails; Bart syndrome) as SUBTYPE rather than a new disorder entry. Mutation analysis of Bart's original kindred (PMID:8618021) found a heterozygous COL7A1 exon 73 glycine-to-arginine substitution and called the syndrome a clinical variant of dominant dystrophic EB; ultrastructure of the same kindred (PMID:7778916) shows poorly formed anchoring fibrils and sub-lamina densa cleavage; an unrelated three-generation family carries the same c.6007G>A (p.G2003R) variant (PMID:29722429). The mechanism is the DDEB COL7A1/anchoring-fibril chain this entry already models and only the presentation (aplasia cutis congenita at birth) differs, so the concept became a has_subtypes row bound to MONDO:0007557 plus a subtype-scoped Aplasia cutis congenita phenotype (HP:0001057). PMID:7778916 also notes Bart-like presentations reported with epidermal and junctional EB; the subtype description records that the row covers the COL7A1 form. Validated with just validate, validate-terms, and count-verified-snippets (92/92).

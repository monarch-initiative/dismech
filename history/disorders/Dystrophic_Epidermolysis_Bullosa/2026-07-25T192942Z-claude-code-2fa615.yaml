  summary: 'Review: DEB - frequency bands sourced from management sentences'
  details: |
    Anemia, Osteoporosis and Constipation carried frequency bands whose only evidence was a GeneReviews management sentence (for example, Anemia is treated with iron supplements and transfusions as needed), which establishes that a complication is recognized and treated but carries no occurrence rate; the cached GeneReviews content contains no occurrence statement for any of the three. Removed those three bands and downgraded the evidence to PARTIAL with corrected explanations. Scoped Cutaneous Squamous Cell Carcinoma to the RDEB-sev gen subtype, since the VERY_FREQUENT band derives from National EB Registry cumulative risk in RDEB-HS specifically and DDEB carries no comparable risk. Removed the disease-wide VERY_FREQUENT band from Nail Dystrophy, whose supporting sentence is explicitly DDEB-specific. Validated: schema, terms, references, and subtype foreign keys all pass.

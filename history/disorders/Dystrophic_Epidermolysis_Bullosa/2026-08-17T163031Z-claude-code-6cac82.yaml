  summary: Apply frequency scope-mismatch policy to five phenotypes
  details: |
    Issue #6951 (grouping/spectrum frequency bands leaking into subtype-scoped records). Five phenotypes carried a disease-level frequency band whose only cited source (PMID:20301481, GeneReviews DEB) states no occurrence rate, while their notes restricted the claim to RDEB or severe RDEB in free text: Pseudosyndactyly (VERY_FREQUENT), Esophageal Stricture (VERY_FREQUENT), Dysphagia (VERY_FREQUENT), Microstomia (FREQUENT), Growth Retardation (VERY_FREQUENT). Dropped all five bands per the policy added in this PR to docs/frequency-evidence-guidelines.md (Anti-pattern 5, arm 3) and CLAUDE.md section 7, following the pattern already applied in this same file to Osteoporosis, Nail Dystrophy, Anemia and Constipation. Added subtype: RDEB-sev gen to Pseudosyndactyly, Microstomia and Growth Retardation, whose notes name severe RDEB specifically, mirroring the existing Cutaneous Squamous Cell Carcinoma record in this file; the notes retain the 'primarily' hedging. Esophageal Stricture and Dysphagia were left unscoped because their notes say RDEB, which spans three of the four defined subtypes, and subtype: is single-valued. No evidence items, snippets or ontology terms were added or altered. Validated with just validate, just count-verified-snippets (72/86 verified, 14 skipped by prefix), just check-duplicate-keys, just validate-disorders, and pytest tests/test_data.py subtype-foreign-key selection (1992 passed).

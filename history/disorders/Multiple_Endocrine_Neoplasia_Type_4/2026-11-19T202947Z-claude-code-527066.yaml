  summary: 'Create: Multiple Endocrine Neoplasia Type 4'
  details: |
    De novo curation of MONDO:0012552 from a claude_code deep-research report, after seven OpenScientist runs produced no report at any available timeout. preflight-dr returned WARN: CDKN1B is confirmed as the canonical gene at 159 mentions, and the flagged second gene MEN1 (91 mentions) is the clinical comparator that defines MEN4 - a MEN1-like phenotype without a MEN1 variant - rather than a second disease; the sections naming MEN1 were read and none was imported as MEN4 content. The substantive curation decision is mechanistic. MEN1 is curated in this repository as a Knudson two-hit syndrome and it would have been easy to copy that shape, but the evidence does not support it for MEN4: a somatic second hit is found in a minority of tumours, most reported tumours show no second hit with both alleles still transcribed, and whether the operative mechanism is haploinsufficiency or epigenetic silencing is unresolved. The pathograph therefore models a dosage mechanism and this entry does not declare conformance to the germline two-hit module. Phenotype frequencies are cited from the Singeisen systematic review with its denominator stated (n/48 symptomatic) rather than pooled with the GeneReviews and Chevalier series, whose inclusion rules differ; that is recorded in notes. One node, the release of the G1/S restriction point, deliberately carries no evidence item and says so: it is canonical p27 biology that no retrieved source measures in human MEN4 tumour tissue, and attaching a general p27 reference would have let it read as MEN4 evidence. References cached and cited: PMID:37733893 (GeneReviews chapter, full CLINICAL CHARACTERISTICS), PMID:17030811 (Pellegata, the defining paper), PMID:36520683 (Singeisen systematic review), PMID:30990521 (Frederiksen case and review), PMID:23555276 (Occhi, the 5-prime UTR uORF mechanism), PMID:32232325 (Chasseloup, paediatric Cushing disease), PMID:38288531 (Chevalier, variant reclassification), plus the ClinGen Hereditary Cancer GCEP Definitive assertion. Every snippet re-verified against the local reference cache: 17 snippets, 0 issues. One correction: HP:0100634 was labelled 'Neoplasm of the endocrine system' from memory; its actual label is 'Neuroendocrine neoplasm'. Validated with just validate plus check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-name-collisions, check-cancer-origin, check-snippet-grading, check-gene-validity and check-shared-disease-terms.

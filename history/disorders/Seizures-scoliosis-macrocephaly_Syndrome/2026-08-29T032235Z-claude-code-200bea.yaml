  details: |
    New de novo Disease entry for seizures-scoliosis-macrocephaly syndrome / AREXT2 (MONDO:0014731, EXT2, hgnc:3513).

    entry_type decided as DISEASE. The disorder has its own MONDO term with OMIM 616682, a distinct genetic mechanism from the dominant EXT2 disease, and one conserved pathograph running from biallelic hypomorphic missense variants through reduced heparan sulfate chain polymerisation to a systemic proteoglycan deficit with neurological and skeletal branches. It is not a subtype of anything already in kb/: EXT2 appears only in Chondrosarcoma.yaml and Membranous_Nephropathy.yaml, neither of which is coverage of either arm.

    The dose/direction trap, which is the whole point of this entry. EXT2 causes autosomal dominant hereditary multiple exostoses by haploinsufficiency for a null allele, and that is what nearly all EXT2 literature is about. This disorder is the biallelic missense one. Every citation was checked for which arm it describes. Deliberately NOT curated because they belong to the dominant arm: the zebrafish dackel/ext2 cartilage work, the osteochondroma-to-chondrosarcoma progression literature, and the EXT-carrier metabolic studies.

    One paper about the dominant arm is used on purpose and only in two marked places. PMID:16236767 (Stickens, Ext2 knockout mouse) supplies the homozygous-null gastrulation arrest at E6.0, which is evidence about why human alleles must be hypomorphic and why no usable model exists; and its heterozygous exostoses result is quoted inside that model's limitations for the express purpose of labelling it as the other disease's evidence. The model link is FAILS_TO_RECAPITULATE with limitations and evidence, paired with a HUMAN_MODEL_MISMATCH discussion.

    preflight-dr returned WARN, correctly: it flagged NDST1 at 27% of EXT2 mentions and an OMIM mismatch. Both were investigated. The OMIM number in the report (608210) is the EXT2 gene MIM, not a different phenotype. NDST1 appears because one reported patient (PMID:30997052) carries a monoallelic NDST1 variant of uncertain significance alongside the biallelic EXT2 variants, with no second NDST1 hit and the same variant present in the mildly affected twin sister. That is recorded in genetic.notes and as a differential diagnosis rather than folded into the mechanism.

    Frequency discipline: head size is curated as two separate phenotypes, Macrocephaly and Microcephaly, because different families went in opposite directions and the syndrome name asserts only one. Multiple exostoses is curated with an explicit frequency and both the positive and negative reports, since its presence in the third biallelic family is a within-disorder observation rather than a reclassification.

    A biochemical entry records the low heparan sulfate in dried blood spot, serum and urine. No reference_ranges block was reconstructed: the source states the intervals are in its Table 1 and that table is not present in the cached text.


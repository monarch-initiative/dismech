  summary: 'Review: APECED publication-completeness deep review (IUIS Table 4)'
  details: |
    Publication-completeness pass over the sources the entry already cited, adding 257 lines without introducing a new reference. The gap was that several cited papers had been mined for one claim each and then left.

    Added: the classic clinical diagnostic dyad as a structured definition, anti-interferon-omega autoantibody testing and AIRE molecular genetic testing as diagnostic definitions, and two differential diagnoses the literature explicitly contrasts with APECED - IPEX syndrome (FOXP3, a peripheral-tolerance defect against APECED's central-tolerance defect) and thymoma-associated chronic mucocutaneous candidiasis, which shares the anti-cytokine autoantibody profile without the AIRE lesion.

    Twenty evidence items added, every snippet an exact substring of its cached reference. Validated with just validate-disorders as part of the 396/396-snippet run covering all six entries in commit 57cd3f0.

  summary: 'Create: Platelet-type Bleeding Disorder 16'
  details: |
    New Mendelian entry for BDPLT16 (MONDO:0008552, OMIM 187800), autosomal dominant ITGA2B-related macrothrombocytopenia.

    Scope decision: entry_type DISEASE, scoped to ITGA2B. MONDO's definition names both ITGA2B and ITGB3, but OMIM (mirrored by MedGen UID 1781222) restricts BDPLT16 to ITGA2B and curates the ITGB3 form as BDPLT24 (OMIM 619271, MONDO:0030996), which still has its own stub (stubs/Bleeding_Disorder_Platelet-type_24.yaml). ITGB3 is therefore not curated as a subtype here; it appears in prose and in class-level mechanistic evidence only, each such item graded directness INDIRECT. Kept distinct from kb/disorders/Glanzmann_Thrombasthenia.yaml, which already records this disorder as a differential with the inverse mechanism; that file was not edited.

    Content: 11-node causal chain from the ITGA2B membrane-proximal variant through disruption of the alphaIIb Arg995-beta3 Asp723 inner membrane clasp, constitutive partial integrin activation, persistent outside-in signalling, and the two consequence arms (abnormal proplatelet formation, receptor internalisation plus arrested platelet cytoskeletal remodelling) to the shared plug-failure and bleeding endpoints. 14 phenotypes, all causally connected (just list-disconnected-phenotypes reports 14/14). conforms_to primary_hemostatic_plug_failure at the component-loss node, the alphaIIbbeta3 aggregation arm, the plug-failure key target and the mucocutaneous-bleeding node; the quantitative production arm is deliberately left unconformed because that module scopes itself out of it. Two REFUTE evidence items are recorded on the constitutive-activation node (the R995Q transfectant was not constitutively active; the largest series detected spontaneous PAC-1 binding in a minority of patients and in controls at a similar rate) and one on macrothrombocytopenia (a family with the recurrent allele and normal platelet size).

    Deep research: openscientist run completed (research/Platelet-type_Bleeding_Disorder_16-deep-research-openscientist.md, 15 citations, plus final_report.html/pdf artifacts). The run wrote no validation sections, so they were added with just validate-research-reference and read: 16/16 references resolved, 0 unresolved, 0 off topic, 1 of 11 quoted claims not matched (PMID:40123272, whose closest text in the source is identical, so it looks like a normalisation artefact rather than a bad quote); term validation resolved 30/32 with 0 unresolved and no wrong-term bindings. The report is unambiguously about this disease (36 mentions of BDPLT16/OMIM 187800/MONDO:0008552). just preflight-dr returned WARN, for reasons that match the scope decision above: ITGA2B is mentioned 21 times but ITGB3 26, and the report cites OMIM 173470 and 607759 (the ITGB3 and ITGA2B gene entries) where MONDO:0008552 xrefs OMIM 187800 (the disease). Reading the ITGB3 sections confirmed they describe the sibling ITGB3 form and the shared receptor rather than a different report subject, which is why they are used only as class-level mechanistic evidence graded INDIRECT. Two DR citations were deliberately not used, PMID:40123272 and PMID:41778036, because both report Glanzmann thrombasthenia cohorts and would have imported a different disease's management evidence; that reasoning is recorded in the entry notes. Two DR citations were added: PMID:23926302 (murine sitosterolemia phenocopy, INDIRECT) and PMID:16169642 (congenital macrothrombocytopenia review, for the ITP-misdiagnosis point). The remaining entry evidence was found by PubMed search before the report landed.

    Checks run: just validate, validate-terms (passed), count-verified-snippets (100/100), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, check-folded-hyphens, check-environmental-evidence, check-enum-values, check-case-collisions, list-disconnected-phenotypes, list-gene-term-mismatches (0 findings), check-genereviews --online (NO_CHAPTER for GeneReviews; the StatPearls CANDIDATE_CHAPTER is the Glanzmann thrombasthenia chapter matched via a synonym and is not a baseline for this disease), normalize-cache, check-term-cache-integrity, validate-disorders. NCIT:C79903 Blood Smear was tried and rejected for the blood-film diagnosis entry because it is not reachable from NCIT:C25218; that slot is left unbound with the reason in its description.

    Follow-up in a later commit on the same branch: check_gene_activity_grounding reported ITGA2B as newly ungrounded, because the node the gene lands on carried no molecular_functions and the gene reached none that did. GO:0070051 fibrinogen binding (confirmed a molecular_function via the OLS API, not from memory) is now bound on that trigger node with modifier DYSREGULATED, and two evidence items were added there for the two halves of that modifier: fibrinogen binds resting platelets that have not been activated (PMID:21454453), and agonist-induced fibrinogen binding is reduced because less receptor remains on the surface (PMID:33276370). DYSREGULATED rather than INCREASED or GAIN_OF_FUNCTION precisely because of the second half and because of the REFUTE items on the activation node, which would make a one-directional modifier overstate the evidence. The gate then reports OK with no baseline change.

    A further commit added reference_title to all 102 evidence items with just backfill-reference-titles, which copies each title verbatim from the title frontmatter of the matching references_cache file; the change is 102 inserted lines and nothing else, and an independent script reading the same frontmatter produced a byte-identical file.

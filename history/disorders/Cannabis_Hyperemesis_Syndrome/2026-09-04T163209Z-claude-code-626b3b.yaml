  details: |
    Backfill for issue #8085, tranche 43. One influences_mechanisms link and one deliberate no-link, and the second is the point of this record.

    LINKED. Chronic Cannabis Use TRIGGERS 'Endocannabinoid System Dysregulation', causal_link_type DIRECT. The strongest exposure-to-node fit in this tranche: the node's own item PMID:32656345 names prolonged high doses of THC acting at the CB1 receptor as what changes the endocannabinoid system, so exposure and target sit in one sentence and the quote states the edge (directness DIRECT). PMID:22150623 from the exposure entry carries the chronicity the node requires and is graded INDIRECT because it names no receptor step.

    NOT LINKED. High-Potency THC Products. Its cited sentence reports that CHS became more prevalent as cannabis potency and use rose under legalization. That is a population trend, not a statement that potency acts on the dysregulation node, and a second edge would assert a dose-response this entry does not evidence. The reason is recorded in the entry's own notes: field as well as here. Earlier tranches in this issue recorded such decisions only in the history record, which made them invisible to a survey that reads the knowledge base; from this tranche on the reason goes in both places.

    Validation: linkml-validate passed; just validate-terms passed; count-verified-snippets over the seven files of this tranche reported 405/430 verified, 25 skipped by prefix, none failing. The twelve guard scripts listed in the PR body all reported OK. Insertions only.

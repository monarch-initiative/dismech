  summary: 'Create: Hearing Loss Autosomal Dominant 84 (DFNA84, ATP11A)'
  details: |
    De-novo curation of DFNA84 (MONDO:0030724, OMIM:619810), dominant postlingual progressive sensorineural hearing loss caused by heterozygous ATP11A variants.

    Entity identity was checked before curating: ATP11A causes both DFNA84 (nonsyndromic, Pater 2022) and AUNA2 (auditory neuropathy, Chepurwar 2023), and the historical DFNA33 locus shares the 13q34 coordinates. PMID:37671045 states the DFNA84 designation explicitly and reports that the original DFNA33 haplotypes contain implausible double and triple recombinations, so DFNA33 is left unresolved in a discussion rather than merged into this entry. kb/disorders/Auditory_Neuropathy.yaml already mentions ATP11A/AUNA2 as one cause among many in the broad ANSD entry; this entry is the gene-specific Mendelian entity and AUNA2 is curated here as a has_subtypes entry.

    Pathograph: ATP11A C-terminal/3' variants -> loss of phosphatidylserine flippase activity -> loss of plasma membrane phospholipid asymmetry -> branching to cochlear hair cell/supporting cell dysfunction and to auditory nerve/spiral ganglion dysfunction -> progressive bilateral SNHL. The dominance mechanism (haploinsufficiency vs dominant-negative) is left open, as the primary literature does.

    Deliberate omissions: no phenotype frequency bands are asserted apart from the definitional OBLIGATE on progressive bilateral SNHL, because the audiometric detail comes from single probands in separate papers and pooling them would count different patients toward one denominator. The phosphatidylserine-externalisation-to-phagocytosis step is carried in node descriptions and a knowledge gap rather than as an asserted node, because it has not been measured in cochlear tissue in any model.

    Two animal models are linked with modeled_mechanisms and readouts: the CRISPR atp11a zebrafish (PARTIALLY_RECAPITULATES; heterozygotes show an intermediate significant stereocilia deficit, which is what makes it relevant to a dominant disease) and the conditional Atp11a knockout mouse (RECAPITULATES the AUNA2 neural deficit). Both carry explicit limitations noting that they model loss of the protein rather than the C-terminal alleles patients carry.

    Validation: just validate, validate-terms, count-verified-snippets (57/57), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders all pass. The re-fetch of the shared references_cache/PMID_36300302.md was reverted so this PR does not touch a file another entry owns.

  summary: 'Review round 1: address CHANGES_REQUESTED on PR #10901'
  details: |
    Addressed the eight IMPORTANT findings and three suggestions in the automated review of PR #10901.

    Fixed:
    - Replaced the truncated PMID:41007806 snippet ("the variant induced the selection of a cryptic 5") with the authors' summary sentence at cache line 102, which contains no typographic prime and names ATP11A explicitly. The previous item's justification - that the reference validator normalises the prime glyph - is not documented in conf/reference_validator_config.yaml, and the reviewer was right that a snippet stopping mid-token is not propositional.
    - Bound the AUNA2 subtype to MONDO:0957279, copying the binding already used in kb/disorders/Auditory_Neuropathy.yaml.
    - Recorded the deliberate AUNA2 overlap with Auditory_Neuropathy.yaml in a subtype review_notes and in the entry's top-level notes, rather than resolving the lump/split silently.
    - Added conforms_to "sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult" on the Cochlear Hair Cell and Supporting Cell Dysfunction node, following the ADNSHL_17 precedent, and wrote into both that node and the spiral-ganglion node why the deeper module nodes are not claimed.
    - Rebound the Deiters cell descriptor from CL:0002490 (organ of Corti supporting cell) to CL:0000635 (Deiter's cell).
    - Added a top-level references: block, external_assertions for OMIM:619810, and classifications.harrisons_chapter NEUROLOGIC.
    - Added notes recording why the hearing-aid treatment_term is unbound and why the intrafamilial-variability phenotype uses the generic HP:0000407.

    Declined, with reasons written into the entry:
    - No deep-research artifact was added. CLAUDE.md forbids hand-writing markdown into research/, and no provider recipe was available in this environment. A manual PubMed sweep was run instead on 2026-09-04 (ATP11A crossed with hearing loss / deafness / auditory / cochlea / 13q34 / phosphatidylserine flippase, plus DFNA84 and AUNA2 as strings). It returned exactly the six ATP11A hearing-loss reports already cited, plus one genuinely missing paper: PMID:28601886, the pre-gene clinical description of the AUNA2 family. That paper was fetched and mined into the AUNA2 subtype (natural history, the 12q24/13q34 linkage that later resolved to ATP11A, and the nonsyndromic character). The sweep is recorded in the entry's top-level notes.
    - PMID:20301607 (Genetic Hearing Loss Overview) was not tagged GeneReviews. Its cached record is abstract-only and its body is the chapter's six-point statement of scope; it contains no occurrence of ATP11A, DFNA84 or AUNA2, so tagging it would create a tagged-but-not-mined reference - the same defect the reviewer flagged in the sibling DFNB26 review. The negative is recorded in the entry's notes so it is auditable.

    Validation: just validate (60/60 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-title-snippets, check-snippet-length, check-snippet-grading all pass. references_cache/PMID_36300302.md was rewritten by the validator run and reverted, as in the previous round.

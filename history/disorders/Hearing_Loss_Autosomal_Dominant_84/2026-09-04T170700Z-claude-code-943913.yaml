  details: |
    Addressed the CHANGES_REQUESTED review of 2026-09-04T08:02Z on PR #10901.

    IMPORTANT (fixed). The notes: literature-base paragraph still said no deep-research provider report was generated, which commit c9e341228 in this same PR falsified by adding research/Hearing_Loss_Autosomal_Dominant_84-deep-research-falcon.md. Rewrote the paragraph to record both checks: the manual PubMed sweep (which surfaced PMID:28601886) and the falcon report, plus what the report contributed. Every indexed source in the report's citation list resolves to a paper already cited here - DOI:10.21203/rs.3.rs-530835/v1 is the Research Square preprint of PMID:35278131, and the remaining DOIs are PMID:36300302, PMID:37671045, PMID:40223426 and PMID:41007806. The report's only other sources are two unindexed dissertations (von Loh 2021; Pater 2019) with no PMID or DOI. The prior round's history record was left untouched; history is append-only.

    SUGGESTION 1 (taken). The pathophysiology node ATP11A C-Terminal and 3' Region Variants opened by asserting that all reported disease alleles disturb the C-terminal region or the 3' end, then listed c.1221+5G>C, an intron 12 allele that the prevalence note already and correctly calls VUS-grade. Reworded to 'every established disease allele' and split c.1221+5G>C out as the double exception - mid-gene position, and uncertain rather than established significance - so the node and the prevalence note now agree.

    SUGGESTION 2 (taken). Added GO:0007605 sensory perception of sound with modifier ABNORMAL to the conforming node Cochlear Hair Cell and Supporting Cell Dysfunction, and recorded in its conformance paragraph why the module's other process, GO:0050910, is deliberately omitted: no ATP11A study demonstrates a mechanotransduction defect. The nearest observation is a Yo-Pro-1 uptake difference in one zebrafish lateral-line neuromast that PMID:40223426's authors read as either cell loss or loss of mechanotransduction capacity without deciding between them, and which is not a cochlear hair cell.

    SUGGESTION 3 (taken). Recorded the preflight-dr Named Entity Confusion false positive in notes: it flags ABR as a rival gene symbol (hgnc:81 is a real gene called ABR), but every occurrence of ABR here is the auditory brainstem response. This will recur for any audiology entry curated from a DR report. Also recorded that the report's GO:0004012 suggestion is obsolete (replaced by GO:0140326) and was not bound.

    Not changed. The DFNA33 locus remains deliberately unresolved (PMID:37671045 reports implausible double and triple recombinations in the original haplotypes). The spiral-ganglion node is still not conformed to the module's amplification-loss node, because AUNA2 has preserved outer-hair-cell amplification and a primary neural deficit.

    Validation. just validate, validate-terms, count-verified-snippets (60/60), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass on the file. Whole-KB check-folded-hyphens, check-title-snippets, check-snippet-length and check-snippet-grading all report no new divergences. The term validator again reserialized references_cache/PMID_36300302.md frontmatter; that drift was reverted so this PR does not touch a cache file another entry owns.

  summary: 'Create: Immunodeficiency 84 (IKZF3/AIOLOS dominant-negative)'
  details: |
    De novo curation of MONDO:0030333 from one OpenScientist deep-research report (research/Immunodeficiency_84-deep-research-openscientist.md; 18/18 references resolved, confabulation_rate 0.0 for references) plus the ClinGen Antibody Deficiencies GCEP Moderate assertion and the two founding publications. just preflight-dr returned SKIP because MONDO records no causal gene (RO:0004003) for this term, so identity was confirmed manually per the dismech-references skill: the term's OMIM xref OMIM:619437 matches the report, 'immunodeficiency due to IKZF3 deficiency' is an exact MONDO synonym, and ClinGen independently records IKZF3 against this identifier. Scoped to the dominant-negative DNA-binding-domain arm only (G159R, N160S, G191R), which is the scope of the ClinGen curation and the scope the existing kb/disorders/Immune_Dysregulation_With_Immunodeficiency_Due_To_AIOLOS_Haploinsufficiency.yaml entry already assigns to IMD84; the haploinsufficiency alleles E82K, M77L and Q402X belong to that sibling entry. The report treats both allele classes as one disease with a two-mechanism paradigm, which was not followed because it would merge two MONDO diseases the KB and ClinGen both keep apart. Two ontology identifiers the report offered were rejected: HP:0410330, offered for an abnormal T-cell count or subset, is Meat allergen allergy, and HP:0005405 does not resolve (the report's own term validation reported confabulation_rate 0.031 and needs_review true). Terms were taken from the committed caches, several reused from the sibling IKZF1 dominant-negative entry so the two entries use the same terms for the same immunological findings. just check-gene-validity reports this record as 'overstated' because relationship_type CAUSATIVE maps to a ClinGen Definitive or Strong tier while ClinGen rates this pair Moderate; CAUSATIVE was kept and the tension recorded in the genetic notes, because the Moderate tier reflects evidence volume rather than a weaker causal claim and no enum value expresses a Mendelian relationship with moderate evidence. A maintainer may prefer a different value. Validated with just validate-disorders (31/31 snippets, 31 titles, 0 issues), validate-terms, check-gene-namespaces-online, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-enum-values, check-duplicate-keys, check-logical-rules, check-name-collisions, check-qualifier-terms, check-block-scalar-comments, check-retired-support-prose. check-snippet-grading initially FAILED on this entry with two new divergences: the sentence 'In vitro studies demonstrated that the mutant protein failed DNA binding and pericentromeric targeting.' was graded HUMAN_CLINICAL on the N160S variant record and IN_VITRO on the pathophysiology and diagnosis records citing the same sentence. IN_VITRO is correct, the variant record was regraded, and the check then passed. This is recorded because an earlier draft of this record wrongly listed the check as having passed first time; the check is not run by CI on a kb-only PR, so only running it locally caught it.

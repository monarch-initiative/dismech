  summary: 'Review round 2: reconnect the allele nodes, move the CLL evidence, retract
    a false absence claim'
  details: |
    Four findings from the round-2 review, all verified against the entry and the reference cache before acting. First, the round-1 push inserted the new B-cell lymphoma downstream edge between the Chronic lymphatic leukemia edge's causal_link_type and its evidence block, so the leukaemia edge was left with no evidence and the lymphoma edge cited a sentence about chronic lymphocytic leukaemia. The evidence block is moved back to the leukaemia edge and the lymphoma edge now cites PMID:34155405 'both developed B cell lymphoma in adulthood', which the phenotype row already used. Second, neither allele-specific node had an incoming edge, so both rendered as roots unattached to the lesion. The IKZF3 variant node now points to IKAROS Heterodimeric Interference (G159R), citing the PMID:38773004 sentence that only G159R extends the dominant-negative effect to IKAROS, and the shared dominant-negative node points to Impaired CD62L Induction and Lymphocyte Homing (N160S), citing the review's statement that AiolosN159S mice did not manifest early B cell differentiation defects. The pathograph now has one root, the lesion, which is correct. Third, the IKZF1 differential said no sentence stating the structural homology is present in the cached text. That was false: references_cache/PMID_34694366.md carries 'multiple sequence alignments of IKAROS and AIOLOS protein sequences implied that AIOLOS N160 is homologous to IKAROS N159, the site of an IKAROS variant (N159S) that previously has been associated with CID and PJP' in its full text. The claim and the hedge built on it are deleted and that sentence is cited as COMPUTATIONAL PRIMARY_RESULT evidence, the alignment being in silico. This was a negative-existence claim committed without re-running the search against the file, which is the failure CLAUDE.md describes and which no automated gate can catch; the reviewer caught it. Fourth, the EBV snippet stopped at 'susceptibility to Epstein', one word before the virus it was cited for. It now reads through 'Epstein-Barr virus (EBV) infection'; the source prints an en dash, which the validator folds to a space, so the hyphen form verifies. Snippets verified rose from 41 of 41 to 45 of 45. The branch is also rebased onto origin/main, which clears the ref-mode baseline exposure that turned PR #17245 red at the same merge base. Three sentences of process narration were removed from evidence explanations in the same push.

  summary: 'Review round 1: scope the IKAROS mechanism to G159R, add N160S and G159R-family
    content'
  details: |
    First review round on PR #17255, five blocking items. (1) The central mechanism was written as true of every allele when the sources scope it to one. The entry stated that the mutant corrupts IKAROS as well as AIOLOS in the top-level description, the shared node and the genetic_context; PMID:38773004 says G159R acts dominant-negatively against AIOLOS and IKAROS while N160S acts exclusively against AIOLOS, and the entry's own inheritance snippet from PMID:34694366 already said 'dominant-negative effect over WT AIOLOS but not WT IKAROS'. So the entry quoted the sentence refuting its own universal claim. Restructured: the shared node is now 'Dominant-Negative Loss of AIOLOS DNA Binding and Pericentromeric Targeting', which holds for every allele and explicitly declines to assert IKAROS corruption, and a new allele-scoped node 'IKAROS Heterodimeric Interference (G159R)' carries that claim with the asymmetry quotes. (2) Added the N160S-specific node 'Impaired CD62L Induction and Lymphocyte Homing (N160S)' with MODEL_ORGANISM evidence, marked PROVISIONAL and recording that the review attributes the defect to IKAROS dysfunction while its own assay found no dominant-negative effect of N160S on IKAROS - a tension left unresolved rather than smoothed. (3) The founding G159R family's phenotypes were missing; added Severe Epstein Barr virus infection (HP:0031693) and B-cell lymphoma (HP:0012191), the latter with both the human family observation and the Aiolos-null mouse lymphoma result from PMID:9806640, and extended the malignancy edge to both targets since the two allele groups reported different malignancies. (4) Claim-evidence mismatch: the Recurrent bacterial infections row's only snippet was a ClinGen sentence about B-cell differentiation and hypogammaglobulinaemia that does not mention infection at all; replaced with the PJP and sinopulmonary-infection sentence, which also now gives the T cell to Pneumocystis edge a direct IKZF3 source where it previously rested only on the paralogous IKZF1 review. (5) Six uncited cache additions removed, and three tracked caches rewritten out of scope reverted to origin/main (PMID_38015619, PMID_38539501, PMID_39381601); PMID_9806640 was kept because it is now cited. While reverting I initially over-reverted four cited files as well and restored them, since the reviewer had scoped the request to the uncited three. Suggestions taken: hypogammaglobulinaemia now also quotes ClinGen's direct 'severe hypogammaglobulinemia' sentence; GO:0046982 protein heterodimerization activity added alongside homodimerization; trimethoprim-sulfamethoxazole added as the prophylaxis therapeutic_agent. The N160/N159 homology suggestion was only partly taken: the sentence the reviewer quoted is not in the cached text, so the claim was softened from structural homology to correspondence and is now backed by the measured transcriptional overlap (104 of 807 shared differentially expressed genes), with the distinction stated. Re-validated: validate-disorders 41/41 snippets and 41 titles with 0 issues, plus validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-enum-values, check-logical-rules, check-name-collisions, check-gene-activity-grounding, check-gene-namespaces and check-snippet-grading.

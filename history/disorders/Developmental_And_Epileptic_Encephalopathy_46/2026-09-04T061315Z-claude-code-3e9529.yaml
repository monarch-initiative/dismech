  summary: 'Address review on PR #10899'
  details: |
    Addressed the four IMPORTANT findings in the CHANGES_REQUESTED review of PR #10899.

    GeneReviews mined. PMID:35914066 was tagged in references: but never quoted, on the stated grounds that its cache is content_type: abstract_only and therefore unquotable. That rationale was factually wrong: content_type records how the record was fetched, not whether it carries text, and the cache's ## Content section holds the complete four-section GeneReviews summary in full sentences. The same label sits on PMID:31918992, which this entry already quotes five times. The notes paragraph asserting the opposite has been rewritten to say what is true, and the chapter is now cited across all four sections: Clinical Characteristics (tone, movement, autism, cerebral visual impairment, sleep, feeding phenotypes, plus the 22-published-case count under prevalence), Diagnosis/Testing (Molecular Genetic Testing), Management (Developmental and Supportive Care, including the no-cure statement), and Genetic Counseling (the 1 percent sib recurrence risk from possible parental mosaicism on the autosomal dominant inheritance block, and the prenatal/preimplantation testing option on the Genetic Counseling treatment).

    GeneReviews-documented phenotypes added. Seven new phenotypes, each bound to a CURIE re-derived against OLS with the canonical label in term.label: Spasticity (HP:0001257), Dystonia (HP:0001332), Chorea (HP:0002072), Autistic behavior (HP:0000729, preferred_term autism spectrum disorder), Cerebral visual impairment (HP:0100704, preferred_term cortical visual impairment - the canonical label is Cerebral, not cortical), Sleep disturbance (HP:0002360) and Feeding difficulties (HP:0011968). The cerebral visual impairment omission was an internal inconsistency: the entry's own description already asserted the finding. None carries a frequency: value - the decision not to import the deep-research report's untraceable cohort percentages is preserved and is now stated explicitly in notes item 4. All seven are wired into the pathograph as INDIRECT_UNKNOWN_INTERMEDIATES downstream of Impaired Activity-Dependent Synaptic Maturation, matching the existing Hypotonia edge; the pre-existing orphan Movement disorder phenotype was connected in the same pass.

    Claim-evidence mismatch repaired. On the Reduced GluN2D Receptor Surface Expression node, the PMID:34560056 snippet quoted 'Functional analysis of variants introduced into GRIN2D cDNA have shown gain of function characteristics' - which asserts the opposite branch. Re-quoted to the continuation of the same cached sentence, 'possibly with a compensatory reduced expression', which bears on the node. The gain-of-function half of that sentence was moved to the NMDA Receptor Gain-of-Function node, graded IN_VITRO, so the review statement is not lost.

    Mouse-model evidence regraded. Six evidence items citing PMID:40200555 and PMID:40277233 - both knock-in mouse studies - were graded HUMAN_CLINICAL and are now MODEL_ORGANISM. The review named five; the sixth (Movement disorder, PMID:40277233) is the identical defect and was fixed with them. Two phenotypes were left with only model-organism support by the regrade: Hypotonia and Movement disorder now both carry the GeneReviews human sentence as their primary source, which is what makes the regrade safe.

    Validation: just validate, count-verified-snippets (92/92), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and validate-disorders all pass. Whole-KB baseline gates check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-not4curation report no new defects; no baseline was edited. pytest tests/test_data.py filtered to entity-ref/causal/phenotype/subtype/unique/readout tests: 16061 passed. git status shows no references_cache/ or cache/ churn.

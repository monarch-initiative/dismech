  summary: 'Address re-review on PR #10899'
  details: |
    Second-round review fixes on PR #10899 (ai4c-reviewer, CHANGES_REQUESTED).

    Required item 1 - too-general EEG binding. The 'Multifocal Epileptiform EEG Abnormality' phenotype was bound to HP:0002353 (EEG abnormality), the generic parent, while its own preferred_term was verbatim the canonical label of HP:0010841. Rebound to HP:0010841 'Multifocal epileptiform discharges'. Label re-derived independently from cache/hp/terms.csv and from 'runoak -i ols:hp info/definitions'; the OLS definition ('abnormality in cerebral electrical activity ... identified at multiple locations (foci)') matches the node. Already present in cache/enums/phenotypeterm_939f99dde0f5.csv, so no new cache rows. The existing snippet already supported the specific claim, so no new evidence was needed.

    Required item 2 - seizure types asserted in the description but not modeled. The entry description claims focal motor and generalized seizures; only spasms and status epilepticus were curated. Added two phenotypes, both grounded in the already-verified PMID:41673952 sentence: 'Focal motor seizures' bound to HP:0011153 'Focal motor seizure' (not the reviewer-suggested HP:0007359 'Focal-onset seizure' - the source says 'motor focal seizures', so the motor-specific child is the most specific accurate term, and HP:0011153 is already used in two other KB entries), and 'Generalized-onset seizures' bound to HP:0002197 'Generalized-onset seizure' rather than the reviewer-suggested HP:0002069 'Bilateral tonic-clonic seizure' - the source says only 'generalized seizures' and never states a tonic-clonic semiology, so HP:0002069 would have manufactured a narrower match. The reasoning is recorded in that phenotype's notes. Both new phenotypes take an infantile onset supported by a second quote from the same abstract ('began at 2 months of age with afebrile focal-to-generalized tonic seizures'). Both were wired into the pathograph as bare-name downstream targets of 'Neuronal Hyperexcitability and Hypersynchronous Network Firing' so they are not orphan nodes.

    Required item 3 - co-agonist supplementation stated as established practice. The loss-of-function node claimed the mechanism-directed strategy for these alleles 'is co-agonist supplementation instead', which neither of its evidence items supported and which the falcon report explicitly cautions against. Softened to 'is instead being tested as co-agonist supplementation (L-serine, NCT07377032, still recruiting)', with an explicit sentence that this is a trial hypothesis rather than validated or known-safe practice. Added a supporting evidence item citing clinicaltrials:NCT07377032 (already curated in clinical_trials in this entry, so the reference stays consistent) quoting the registration record's goal sentence. The same over-strong framing in the top-level description was softened to match.

    Suggestions applied. (a) prevalence.notes now records the GeneReviews figure of 22 reported individuals alongside the ~30 registry count and the 13-14 published cases; that sentence was already a verified snippet on the same prevalence record. (b) The two background-physiology quotes at what were lines 470 and 478 are from different papers, not one paper as the review read them, but the grading divergence was still real: the PMID:31504254 quote was HUMAN_CLINICAL while every other quote from that publication in this file is IN_VITRO, and the sentence states receptor biophysics established by heterologous-expression electrophysiology rather than a patient observation. Regraded to IN_VITRO with the reasoning in the explanation. (c) 'animal_models#Mouse' was ambiguous because both animal models carry species Mouse; repointed at 'animal_models#Grin2d V664I knock-in mouse (Rubinstein laboratory)', which resolves on name, and the discussion rationale now says which of the two mice the pharmacology came from. (d) notes section 4 now records the VNS and ACTH omission: both trace to the same unverifiable Camp & Yuan / XiangWei page ranges, and all seventeen cited cache bodies were grepped for vagus/VNS/ACTH/adrenocorticotrop/corticotropin with zero hits. (e) Added a genetic_context block on the NMDA Receptor Gain-of-Function node with functional_impact_category GAIN_OF_FUNCTION, gene hgnc:4588, allelic_events MISSENSE_VARIANT, variant_origin DE_NOVO, zygosity HETEROZYGOUS, and a description scoping the category to c.1999G>A (p.Val667Ile) and the two other demonstrated GoF alleles rather than to GRIN2D missense variation as a class.

    Validation. just validate, count-verified-snippets (92/92 before, 96/96 after - four new evidence items, all exact cached substrings), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-not4curation and the batched validate-disorders all pass. Targeted pytest selection over entity refs, causal targets, subtype foreign keys, model readouts and unique names: 10759 passed. git status after validation shows only the KB entry modified - no reference_cache upgrades and no new cache/ rows, since every CURIE used was already cached.

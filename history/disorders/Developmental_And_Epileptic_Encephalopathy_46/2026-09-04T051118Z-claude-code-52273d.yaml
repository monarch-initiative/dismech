  summary: 'Create: Developmental_And_Epileptic_Encephalopathy_46'
  details: |
    New Mendelian entry for DEE46 / GRIN2D-related developmental and epileptic
    encephalopathy (MONDO:0014947, causal gene hgnc:4588 GRIN2D).

    RESEARCH PROVENANCE. Two deep-research runs were commissioned for this
    disease. The FIRST run returned a report about the wrong gene entirely: it
    researched GRIA2 (AMPA receptor GluA2) and never mentioned GRIN2D once. That
    report was discarded and NOT committed. The run was repeated with a
    disambiguated prompt naming GRIN2D and the GluN2D subunit explicitly, and it
    is that corrected report
    (research/Developmental_And_Epileptic_Encephalopathy_46-deep-research-falcon.md,
    GRIN2D mentioned 44 times) that this entry was curated against. Four
    references_cache/DOI_*.md files left behind by the discarded GRIA2 run
    (10.1038/s41467-019-10910-w, 10.1101/mcs.a006172, 10.1111/cge.14770,
    10.3390/ijms252211982) were deliberately left uncommitted, since they belong
    to no committed report. Because of that history, every substantive claim was
    checked to be about GRIN2D and not a neighbouring glutamate-receptor
    disorder before curation.

    STRUCTURE. The entry is organised around the gain-of-function versus
    loss-of-function branch point rather than a single "altered NMDA receptor
    function" step, because the therapeutic implication inverts between the two
    branches. Pathograph: 30 nodes, 28 edges, orphan_targets empty (verified
    directly via dismech.graph.build_causal_graph). Conformance declared against
    glutamate_excitotoxicity (Glutamate Receptor Overactivation and Calcium
    Overload; Excitotoxic Neuronal Death) and
    epilepsy_excitation_inhibition_imbalance (Ion Channel and Synaptic
    Dysfunction; Excitation-Inhibition Imbalance; Neuronal Hyperexcitability and
    Hypersynchrony). Treatments carry target_mechanisms back into the pathograph:
    memantine and ketamine+magnesium against NMDA Receptor Gain-of-Function,
    conventional antiseizure medication and perampanel against the downstream
    network node. Two mouse knock-in models and a patient-derived iPSC line carry
    modeled_mechanisms with readouts.

    EVIDENCE DISCIPLINE. 75 evidence snippets, all exact substrings of cached
    references. The memantine block deliberately carries a REFUTE item: three
    individuals with the identical p.Val667Ile variant had divergent outcomes in
    the 2026 multicentre GRIN series (PMID:41489401), one with seizure worsening.
    Cross-GRIN response rates from that series are graded directness: INDIRECT
    because only three of 34 individuals were GRIN2D. The mouse ketamine
    proconvulsant result (PMID:40277233) is a second REFUTE item and drives a
    HUMAN_MODEL_MISMATCH discussion.

    REPORT CORRECTIONS. (a) Four report-proposed HP CURIEs named a different
    concept while the report's own Term Validation section reported them clean:
    HP:0002063 offered as "drug-resistant epilepsy" is actually Rigidity
    (replaced with HP:0020174 Refractory drug response); HP:0002069 labelled
    "generalized tonic-clonic seizure" is Bilateral tonic-clonic seizure;
    HP:0002079 labelled "thin corpus callosum" is Hypoplasia of the corpus
    callosum; HP:0000733 labelled "stereotypy" is Motor stereotypy. HP:0100704
    was labelled "cortical visual impairment" against canonical Cerebral visual
    impairment. (b) The report states no relevant interventional trial exists; a
    direct ClinicalTrials.gov API search found NCT07224581 and NCT07377032, both
    naming GRIN2D explicitly, plus NCT05818943. All three curated. (c)
    Frontmatter mondo_id was empty (dismech#10335); just preflight-dr was run
    manually against MONDO:0014947 and passed. (d) The report carries zero PMIDs;
    all DOIs were resolved via the PMC ID converter and cited as PMIDs.
    10.30565/medalanya.891938 has no PubMed record, so the memantine dosing
    figures it sourced were dropped rather than carried over unsourced. (e) Song
    et al. 2024 (PMID:37649269) is cited by the report in GRIN2D context but its
    cached full text contains zero occurrences of "GRIN2D"; not used. (f) Cohort
    percentages attributed to page ranges of Camp & Yuan 2020 and XiangWei 2019
    are absent from those papers' cached abstracts and were not curated.

    CURATOR-INTRODUCED CURIE ERRORS, caught by just validate-terms: NCIT:C15282
    (Oriental Medicine, not Immunotherapy) replaced with NCIT:C62710
    Immunoglobulin Therapy; NCIT:C15607 (Clinical Diagnosis, not Differential
    Diagnosis) replaced with NCIT:C25294 Laboratory Procedure and the diagnosis
    entry renamed accordingly.

    GENEREVIEWS. PMID:35914066 (GRIN2D-Related Developmental and Epileptic
    Encephalopathy) is tagged in references: with the GeneReviews tag. Its cache
    record is content_type: abstract_only, so nothing is quoted from it; that is
    stated in the entry notes together with the phenotypes it summarises that are
    consequently not curated (spasticity, dystonia/chorea, sleep disorder, the
    "22 individuals reported" count).

    CACHE CHANGE. references_cache/PMID_41489401.md moved from abstract_only to
    full_text_xml on re-fetch. The GRIN2D-specific memantine outcomes are in the
    PMC full text, not the abstract. Added content is a superset, so the snippet
    cited by the existing GRIN2B entry still matches.

    NON-DUPLICATION. GRIN2B-Related_Developmental_and_Epileptic_Encephalopathy
    (DEE27) was read before writing. Complementarity is recorded in this entry's
    notes: GluN2D's distinct developmental expression window and ~10-fold weaker
    magnesium block, the absence of any reported truncating GRIN2D allele in
    affected individuals, and the dominance of one recurrent M3 substitution.

    VALIDATION. just validate, just validate-disorders, count-verified-snippets
    (75/75), validate-terms, check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-qualifier-terms (offline and --online),
    check-enum-values, check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-environmental-evidence,
    check-not4curation, check-term-cache-integrity — all clean, no baseline
    updated. Two folded-hyphen splits introduced by this entry were fixed by
    rephrasing rather than baselining.

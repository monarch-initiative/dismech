  summary: Curate Leber congenital amaurosis 2 (MONDO:0008765) as the LCA2 subtype
    of RPE65-Related Retinopathy
  details: |
    Lump/split: MONDO:0008765 (Leber congenital amaurosis 2) was curated as a has_subtypes node plus a skos:narrowMatch mondo_mappings entry on the existing kb/disorders/RPE65-Related_Retinopathy.yaml (MONDO:0100368), not as a new Disease entry. MONDO files MONDO:0008765 beneath MONDO:0100368; the gene (RPE65, hgnc:10294) and the proximal lesion are identical, and the existing entry's own notes already recorded LCA2/EOSRD/juvenile RP as one genetic entity separated by residual enzyme activity. This differs from Leber_Congenital_Amaurosis_9/10/13, which are separate entries because each is a different gene with no gene-level entry to fold into. Gene confirmed against the primary source PMID:9326941 (Gu et al. 1997), not from the stub. Added: LCA2 subtype bound to MONDO:0008765 with AR inheritance and three evidence items; mappings.mondo_mappings narrowMatch; three LCA2-scoped pediatric phenotypes (oculodigital sign HP:0001483, high hypermetropia HP:0008499, abnormal pupillary light reflex HP:0007695); five new causal edges taking the pathograph from visual-cycle arrest through to nyctalopia, pupillary reflex, peripheral field loss and photophobia, plus two phenotype sequelae (nystagmus, hypermetropia), raising phenotype causal-inlink coverage from 1/6 to 7/9; a delivery_system block on voretigene neparvovec (VIRAL_VECTOR, AAV2, subretinal, RPE target cell) sourced to the phase 3 report; and three treatment evidence items recording the limits of the pivotal trial (1-year controlled endpoint) and a REFUTE item on durability from the phase 1 follow-up literature. Corrected an overstated nystagmus frequency claim. PMID:42425207 lost its quotable body under linkml-reference-validator 0.3.0rc1 (issue #12672) and its snippet was removed rather than paraphrased; the citation and an explicit gap statement were kept. Deep research: falcon requested, returned HTTP 402, claude_code fallback produced research/RPE65-Related_Retinopathy-deep-research-claude_code.md; preflight-dr PASS against MONDO:0100368. All gates run under linkml-reference-validator 0.3.0rc1.

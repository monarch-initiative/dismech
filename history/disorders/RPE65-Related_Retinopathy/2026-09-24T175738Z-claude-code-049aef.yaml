  details: |
    Review round on PR #12699 (ai4c-reviewer CHANGES_REQUESTED). Blocking finding, both parts confirmed against the committed files. Part A: the explanation on the treatments[].evidence item citing PMID:42425207 asserted that neither PubMed nor the publisher DOI returns a retrievable abstract body. references_cache/PMID_42425207.md as committed in this PR carries the full abstract under ## Content, so that was a false statement about a source. A verified exact quote covering both the pooled visual-function improvement and the pooled chorioretinal atrophy proportion was restored and the explanation rewritten to describe what the quote supports. The original snippet had failed only because the re-fetched text renders confidence intervals as -0.16-0 and 0.10-0.51 where the earlier cache wrote -0.16 to 0 and 0.10 to 0.51; hyphens and the word 'to' do not fold to the same normalized string. Part B: this PR's refresh of references_cache/PMID_42425207.md left kb/disorders/Inherited_Retinal_Dystrophy.yaml treatments[0].evidence[1] quoting the earlier 'to' spelling, so that snippet no longer verified. Because that file is outside this PR's changed set, PR CI would not have caught it and the break would have surfaced on main. Re-quoted against the refreshed cache. Also added a GeneReviews (PMID:31725251) agents/circumstances-to-avoid evidence item to the oculodigital sign phenotype, and set directness: INDIRECT on the visual-cycle-arrest to abnormal-pupillary-light-reflex causal edge, whose snippet lists amaurotic pupils as a clinical feature without stating the rod-afferent mechanism the edge description gives.

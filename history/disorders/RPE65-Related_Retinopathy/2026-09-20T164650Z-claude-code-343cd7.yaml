  summary: 'Genetics pass: bind RPE65 on the dominant subtype, type the relationship'
  details: |
    Genetics pass for dismech#12205 (d2g wiring-016).

    RPE65 was already bound with `gene_term` and already wired into the pathograph
    (1/1). The gap was the `has_subtypes` row.

    Changes:
    - `genes:` binding RPE65 (`hgnc:10294`) on the `RPE65-related dominant
      retinopathy` row, which carries MONDO:0100452, the term this job lists.
    - `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` on the genetic
      record.

    Not changed, deliberately: MONDO defines MONDO:0100452 as "A retinopathy caused
    by a heterozygous gain of function variant in the RPE65 gene", while this entry's
    subtype description says the dominant mechanism - dominant-negative interference,
    gain-of-function toxicity, or haploinsufficiency - "is not fully resolved for
    most reported families". The entry's hedge is the more defensible statement and
    was kept; the divergence is reported in the pull request.

    Verification: full offline gate list passes; the GeneReviews chapter
    (PMID:31725251) was already tagged and cited.

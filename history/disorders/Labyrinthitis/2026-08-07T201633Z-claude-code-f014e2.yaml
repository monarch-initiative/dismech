  summary: Link the three infection routes to the pathogen-entry node
  details: |
    Backfill for issue #8085. This entry names three anatomical routes into the labyrinth at its pathogen-entry node, and the three exposures map one to one onto them. Otitis media is TRIGGERS with DIRECT for the tympanogenic route: middle-ear infection sits against the round and oval windows and organisms or toxins cross that membrane, with nothing in between. Bacterial meningitis is TRIGGERS with DIRECT for the meningogenic route through the cochlear aqueduct and internal auditory canal. Both cite two evidence items each, and each item keeps the support level this entry had already assigned it, so the cochlear-implant series stays PARTIAL because it records the downstream deafness rather than the entry step. Viral upper respiratory infection is graded below both, PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, because the hematogenous and neural routes are not demonstrated in the cited case, only the temporal sequence. A reference title was added to that DOI item from its cache record. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 63 of 74 with 11 pre-existing DOI-prefix skips.

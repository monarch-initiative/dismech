  summary: 'Address PR 8774 review: diagnosis, Naked mouse model, term/reference notes'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR 8774 (findings 2, 3, 5, 6) and to an independent pre-PR review. Added a diagnosis block whose load-bearing point is that exon-level copy-number analysis is required because a 27.6 kb HOXC13 exon-1 deletion is an established cause and a sequence-only assay misses it; evidence is the Lin 2012 deletion sentence already cached and verified for this entry. Added four differential_diagnoses. Added the Naked (N) mouse (DOI:10.1111/exd.14469) to animal_models as PARTIALLY_RECAPITULATES with two readouts, and recorded in limitations that it models the phenotype but not the mechanism: its transcript escapes nonsense-mediated decay and heterozygotes are affected, a dominant-negative behaviour with no human counterpart. Extended the hoxc13_model_fidelity_disagreement discussion with that mismatch, and amended pathophysiology node 1 so the mouse route is explicitly excluded from the human three-route convergence rather than folded into it. Documented PMID:41714886 as cached-but-unquotable alongside the two already noted. Recorded the HP:0009121 axial-versus-general scope caveat on the Skeletal Involvement Absent node. Verification: validate-disorders passed both entries; snippet audit 35/39 verified with 4 DOI refs skipped by prefix, and those four were checked by hand against the cached DOI record with NFKC plus whitespace normalisation. The reference_title initially written for that DOI was invented and was corrected to the cached title. Separately confirmed via PubMed that no GeneReviews chapter exists for PHNED, ECTD7, ECTD9, HOXC13, or KRT74, resolving the reviewer caveat that live verification had been blocked in its environment.

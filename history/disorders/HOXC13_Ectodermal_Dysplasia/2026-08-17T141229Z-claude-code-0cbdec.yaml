  summary: 'Create: HOXC13-Related Pure Hair-Nail Ectodermal Dysplasia (ECTD9)'
  details: |
    De-novo curation of ECTD9 (MONDO:0013976) from Edison (falcon) deep research plus independent primary-literature verification. The Edison report research/HOXC13_Ectodermal_Dysplasia-deep-research-falcon.md passed 'just preflight-dr' against MONDO:0013976 (HOXC13 49 mentions vs KRT85 5, KRT74 3) and reported 15/15 references resolved, 0 confabulation. Edison surfaced the original discovery paper (PMID:23063621) and the pig (PMID:28011715), rabbit (PMID:30125135) and HoxC-enhancer (PMID:33199643) model papers that the issue's research comment had missed; all were fetched and their abstracts read before use. Three Edison-suggested HPO CURIEs were rejected after OAK validation: HP:0001006 (obsolete Hypotrichosis), HP:0001800 (actually Hypoplastic toenails, not Micronychia) and HP:0001813 (does not exist). The issue's requested informative negative is curated as three EXCLUDED-frequency phenotypes with modifier ABSENT (hypohidrosis, hypodontia, skeletal involvement), following the Osteogenesis_Imperfecta_Type_V convention. A HUMAN_MODEL_MISMATCH discussion records the mouse/pig/rabbit model-fidelity disagreement. Validation run: schema validation via the pre-edit hook; 'just validate-terms' passed; 'just count-verified-snippets' 35/35 verified against cached references; 'just validate-disorders' run once as the pre-PR sweep.

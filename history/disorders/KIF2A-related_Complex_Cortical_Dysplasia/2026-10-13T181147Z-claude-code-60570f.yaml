  summary: 'Create: KIF2A-related_Complex_Cortical_Dysplasia'
  details: |
    New entry for CDCBM3 (MONDO:0014170), caused by heterozygous, mostly de novo KIF2A motor-domain missense variants. Curated from the founding Poirier 2013 report, the Cavallin 2017 hotspot series, single-case reports (Tian 2016, Hatano 2021, Zhao 2022 and 2023), the Broix 2018 and Gilet 2020 mechanistic studies, the Kif2a-null mouse and zebrafish models, and the GeneReviews Tubulinopathies Overview, which lists CDCBM3 as a differential. Pathograph: nucleotide-pocket disruption (bound to ATP hydrolysis activity and microtubule binding) leads to impaired microtubule depolymerization, which branches to neuronal migration failure, a progenitor ciliogenesis and cell-cycle defect, and increased apoptosis, converging on posterior-predominant lissencephaly and microcephaly. A HUMAN_MODEL_MISMATCH discussion records that conditional Kif2a knockout spares embryonic neurogenesis while variant electroporation reduces progenitor proliferation. Validated with just validate, count-verified-snippets (49/49), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments and check-genereviews.

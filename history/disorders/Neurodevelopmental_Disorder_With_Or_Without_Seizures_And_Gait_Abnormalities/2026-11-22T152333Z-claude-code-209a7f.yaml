  summary: 'Create: Neurodevelopmental Disorder With Or Without Seizures And Gait
    Abnormalities (GRIA4)'
  details: |
    New entry for MONDO:0060641 (OMIM 617864), the GRIA4 de novo missense neurodevelopmental disorder, curated from a Perplexity deep-research report used as leads only. Primary sources: Martin 2017 founding series (PMID:29220673, abstract), Wang 2022 case plus six-patient review table (PMID:35518358, full text), a 2024 ESES case (PMID:38819422), the Gria4 mouse absence-epilepsy papers (PMID:18316356, PMID:21857658), a GRIA1-4 functional survey abstract (PMID:37921875) and the ClinGen Moderate assertion. Pathograph: de novo missense variant -> disturbed GluA4 channel gating (direction left unset because no GRIA4 patient variant has published electrophysiology) -> dysregulated AMPA excitatory transmission -> developmental, tone, gait and speech phenotypes, and -> cortico-thalamic hypersynchrony (mouse-derived, marked hypothetical) -> seizures, EEG abnormality and ESES. The obsolete HP:0007770 used by the source was replaced with HP:0007973 per HPO's replacement. The entry name keeps the MONDO label because no GRIA4-related dyadic name is established. Validated with just validate, validate-terms, count-verified-snippets and the whole-repo gates.

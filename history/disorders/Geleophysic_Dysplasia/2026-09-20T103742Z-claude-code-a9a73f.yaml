  summary: 'Genetics pass: gene wiring (#12198)'
  details: |
    Genetics pass for issue #12198 (d2g wiring-009). All three MONDO-recorded genes were already
    present in genetic: with subtype scoping, relationship_type and evidence, so the gap was entirely
    in reach rather than presence. Added genes: descriptors to the three has_subtypes rows (GD1
    ADAMTSL2, GD2 FBN1, GD3 LTBP3), and bound genes onto three pathophysiology nodes whose own
    descriptions and evidence already named those genes without binding them: ADAMTSL2/FBN1/LTBP3 on
    "Fibrillin microfibril matrix dysregulation", ADAMTSL2/FBN1 on "TGF-beta and SMAD signaling
    dysregulation" and on "Fibroblast ECM secretion and MMP-mediated migration dysregulation". LTBP3
    was deliberately not bound to the TGF-beta node: the entry's own LTBP3 evidence places it in the
    microfibrillar network, and the node's description says LTBP3's TGF-beta effect is "predicted or
    reported", which is weaker than the binding would assert. Tagged the GeneReviews chapter
    PMID:20301776, which was already cited but untagged. No new references were fetched and no prose
    claim was added. FBN1 overlap with Marfan syndrome is already handled by the GD2 description,
    which records that domain-specific FBN1 variants give a geleophysic rather than a Marfan
    phenotype. Validated with just validate, validate-terms, count-verified-snippets,
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, list-gene-term-mismatches, check-genereviews and validate-disorders.

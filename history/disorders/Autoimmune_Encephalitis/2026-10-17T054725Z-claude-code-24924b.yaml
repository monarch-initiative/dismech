  summary: Split the bundled oligoclonal bands/IgG index marker; bind each its own
    LOINC code
  details: |
    LOINC tranche J batch 1. The existing 'CSF Oligoclonal Bands and IgG Index' biochemical marker carried a note explaining it was left without a LOINC code because it bundled two analytes LOINC codes separately. Split it into two markers: CSF Oligoclonal Bands, bound to LOINC:32358-4 (Oligoclonal bands [Presence] in Cerebral spinal fluid), and CSF IgG Index, bound to LOINC:14117-6 (IgG clearance/Albumin clearance [Ratio] in Serum and CSF) -- the classic Tourtellotte/Link IgG index, found by searching 'IgG index' broadly after a specimen-qualified search ('IgG index Cerebral spinal fluid') returned only pathogen-specific antibody-index codes (CMV, Borrelia, VZV, etc.), a different analyte family from the general intrathecal-synthesis index this entry's row describes. Both new markers reuse the same existing evidence item, which names both tests together. Both codes verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

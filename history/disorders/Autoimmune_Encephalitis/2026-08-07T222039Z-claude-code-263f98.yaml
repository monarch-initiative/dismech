  summary: Separate the HSV, checkpoint, and tumor routes to autoimmunity
  details: |
    Backfill for issue #8085. Herpes simplex encephalitis is pointed at the anti-GluN1 NMDAR node rather than the general autoimmunity node, because the association is specific to NMDAR autoimmunity, which the entry's own evidence explanation already stated; it is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES, antigen release from virus-killed neurons being the intervening step. The other two exposures share the general neural antigen autoimmunity node and are graded differently for a stated reason. Immune checkpoint inhibitor exposure is PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES and supports SUPPORT, since its guideline sentence names neurological autoimmune complications and loss of peripheral tolerance is the understood route, the same machinery the immune_checkpoint_blockade module models from the tumour side; it is predisposing rather than triggering because most treated patients never develop it. Underlying Neoplasm into the same node is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL on both items, because tumour risk varies so widely by antibody that no single route holds across the syndrome, and the two sentences available are a screening recommendation and a timing statistic. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 51 of 77 with 26 pre-existing DOI-prefix skips, and both DOI snippets added by this change were checked against the cache by hand.

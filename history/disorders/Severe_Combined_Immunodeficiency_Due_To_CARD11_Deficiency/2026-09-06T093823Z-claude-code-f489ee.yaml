  summary: 'Self-audit: OBLIGATE on agammaglobulinemia asserted 100% from a definition'
  details: |
    Found by applying to this entry the frequency-band audit that a reviewer's third finding on the sibling PR #11169 forced there, rather than waiting for the same finding here. Agammaglobulinemia carried frequency OBLIGATE, which asserts every patient has it, and the band came from the founding paper's characterisation of the entity rather than from a count. Across the published probands the antibody defect is reported as agammaglobulinemia in the index case, as hypogammaglobulinemia in the second report, and not at all for the two patients in the 2021 series or for the Omenn reversion case, whose syndrome is itself defined in part by elevated IgE. Lowered to FREQUENT, with the second report's hypogammaglobulinemia sentence added as evidence so the spectrum is cited rather than described, and the reasoning recorded in a phenotype notes field. The developmental block that explains the defect is not in question; only the claim that every patient sits at the severe end of it. While in the file I also audited every reference_title against its cache frontmatter and found one I had written from memory in this same edit, which named a different paper entirely; it was replaced with the cached title before validation. The same audit across all five entries in this run found no other title defect, and three apparent mismatches in the IRF8 entry are a non-breaking space in the cached title rather than a curation error, which is why check-reference-titles compares by similarity rather than equality. Validation: schema, terms, 30/30 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms clean; five whole-KB gates report nothing naming this entry; no cache change.

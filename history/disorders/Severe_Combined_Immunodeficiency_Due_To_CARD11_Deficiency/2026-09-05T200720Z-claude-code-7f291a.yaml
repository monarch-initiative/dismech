  summary: 'Create: SCID due to CARD11 deficiency (IMD11A)'
  details: |
    De-novo curation of SCID due to CARD11 deficiency (MONDO:0014081, IMD11A),
    claimed at #11156. entry_type resolved to DISEASE and the stub deleted.

    Preflight. CARD11 appears in kb/ on main only as an incidental gene-list string
    inside snippets on lymphoma entries and on Immunodeficiency_60.yaml, whose causal
    gene is BACH2. There was no existing coverage to extend.

    Scope. The entry is the biallelic null (recessive SCID) form only. CARD11
    gain-of-function (BENTA) and dominant-interfering hypomorphic disease (CADINS)
    are curated as differentials rather than subtypes, because they act in opposite
    directions on the same pathway. The CADINS differential says so explicitly
    rather than describing it as a milder form, and cites the transfection result
    showing dominant interference.

    Deep research: one OpenScientist run, committed with the entry. It contributed
    the TREC-screening gap, the CBM-complex differential group and the allelic
    series framing. Its CARD11 gene identifier (HGNC:16393) is correct, which is
    worth recording given that report gene CURIEs are never checked at all (#9845).

    Two of its HPO terms name different concepts and are not bound. HP:0002754,
    offered as "Recurrent respiratory infections", is Osteomyelitis. HP:0032256,
    offered as "Pneumocystis pneumonia", is Unusual Histoplasma capsulatum
    infection; the entry binds HP:0020102 (Pneumocystis jirovecii pneumonia)
    instead. Neither was flagged by the report's own term validation. That pattern
    is reported on #10459.

    preflight-dr returns WARN on MALT1 at 29% of CARD11 mentions. That is expected
    rather than entity confusion: MALT1 and BCL10 are the other two components of
    the CBM signalosome and a correct mechanistic report has to discuss them. No
    MALT1-deficiency clinical content was taken; MALT1 appears in this entry only in
    the signalosome mechanism and in the differential.

    The TREC newborn-screening gap is curated as a KNOWLEDGE_GAP rather than as a
    fact. It follows directly from the biology, since TREC screening detects T-cell
    lymphopenia and this disease has normal T-cell counts, and the reported patients
    presented with established infection rather than through screening. But no study
    has measured the miss rate, and with a handful of published probands none
    realistically could yet. A retrospective TREC study is proposed.

    One binding is coarser than the finding. The defining abnormality is deficient
    T-cell function with preserved T-cell numbers, and HPO has no term for that
    dissociation; the binding is HP:0011840 (Abnormal T cell physiology) with the
    specific finding in preferred_term.

    Validation: just validate-disorders passes schema, terms and 21/21 snippets.
    check-entity-refs, check-causal-targets, check-duplicate-keys and
    check-enum-values are clean. No GeneReviews chapter exists (PubMed search for
    "CARD11 GeneReviews" returns zero). Seventeen references fetched during research
    but not cited were pruned from references_cache rather than staged.

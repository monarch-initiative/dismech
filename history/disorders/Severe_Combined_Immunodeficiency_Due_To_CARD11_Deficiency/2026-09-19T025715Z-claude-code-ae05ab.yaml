  summary: 'Review round 2: re-source the P7 OBLIGATE evidence to a T-cell readout'
  details: |
    Answers the single blocking finding of review round 2. The P7 evidence item on the 'Abnormal T cell physiology' phenotype quoted the IkB-alpha degradation / p65 phosphorylation sentence from PMID:26277595, whose stimuli are anti-IgM and CD40L. Both are B-cell stimuli and the sentence sits in a B-cell stretch of the source paragraph, so it attests a B-cell receptor signalling defect rather than deficient T-cell function - which left the notes: block's claim that OBLIGATE is attested in both probands undelivered. Replaced the snippet with 'T-cell proliferation in response to CD3/CD28 stimulation was completely abolished in vitro', stopping before the glued reference superscripts. That sentence is a T-cell functional readout, parallels the P6 proliferation item above it, sits in the P7 stretch of the same paragraph and cites both primary reports, so OBLIGATE now rests on a T-cell assay in both reported patients. The explanation records why the IkB-alpha sentence was not used. Both non-blocking suggestions bundled into the same push per the one-push convention: added a clause to the 'Like P6, P7 had hypogammaglobulinemia' explanation noting the preface is loose and that the same review states P6's agammaglobulinemia directly, so the spectrum reading is the review's own; and added quote_role: REVIEW_SYNTHESIS to the pre-existing 'P7 was treated with intravenous immunoglobulin' item. Validation: just validate, count-verified-snippets 34/34, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading (no new divergences) all pass.

  summary: 'Review round 1: treatments, pathograph connectivity, frequency band'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 11177 in a single push.

    Blocking items.
    (1) No treatments section existed, while a pathophysiology description asserted in prose that transplantation is curative. Added allogeneic HSCT (NCIT:C15431, CELL_THERAPY) with target_mechanisms joining the pathograph at Biallelic CARD11 Loss of Function, quoting the two disease-specific sentences already sitting unused in the cached PMID:33872653.
    (2) Four phenotypes had no incoming causal edge. Abnormal T cell physiology and Recurrent fungal infections now hang off Loss of Antigen-Receptor-Driven T Cell Activation, both DIRECT. Interstitial pneumonitis and Colitis hang off Failure of CBM Signalosome Assembly as INDIRECT_UNKNOWN_INTERMEDIATES, with a new KNOWLEDGE_GAP asking whether they are dysregulatory or infectious. Verified by recomputing in-edges from the file: all seven phenotypes now connected, no unresolved targets.
    (3) Pneumocystis pneumonia was VERY_FREQUENT (80-99%) on evidence attesting occurrence in roughly two of five published probands. Lowered to FREQUENT with the denominator stated in the description.

    Also from item 3: the five-word fragment 'viral and fungal respiratory infections' backed two phenotypes and asserts neither recurrence nor frequency. Replaced with the fuller sentence already quoted elsewhere in the file, and both phenotypes now say the recurrence in the HPO label is this entry's reading rather than the source's claim.

    Suggestions taken.
    (4) BENTA added as a third differential with distinguishing_features, citing the newly fetched PMID:30170123 sentence naming all three allele classes.
    (5) Two animal models added: the CARMA1-knockout Treg checkpoint (PMID:19454668) and the Th17/EAE model (PMID:23091043), both PARTIALLY_RECAPITULATES with model_scale CELLULAR and explicit limitations, plus a model-level caveat quoting PMID:26277595 on partial human-mouse concordance.

    Suggestions declined, with reasons recorded in notes.
    Immunoglobulin replacement and Pneumocystis prophylaxis were requested on the strength of deep-research section 12. That section names them with no citation at all, and none of the entry's cached references mentions either, so adding them would mean an evidence-free treatment or a manufactured quote. The report's own HSCT recommendation is cited to a MALT1-deficiency outcome, a different disease, and was not used; the CARD11-specific PMID:33872653 evidence was used instead. The top-level references block was left absent.

    Validation: schema pass, term validation pass, 27/27 snippets verified against the local cache (was 21/21), entity refs, causal targets, duplicate keys, enum values, qualifier terms all clean, whole-KB gates report nothing for this entry. No cache change; every term was already cached.

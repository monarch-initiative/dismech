  summary: 'Create: Severe_Combined_Immunodeficiency_Due_To_CARD11_Deficiency (CARD11,
    MONDO:0014081)'
  details: |
    Created immunodeficiency 11A (complete CARD11 deficiency) as a Disease entry (stub entry_type decision: DISEASE), kept separate from the allelic dominant-negative CADINS entry curated in the same tranche and from the not-yet-curated gain-of-function BENTA disorder. Chain: biallelic CARD11 loss, failure of CBM complex assembly and antigen receptor signalling (NF-kB, JNK, MALT1; CD40 preserved), defective T-cell activation and helper differentiation, arrest of B-cell differentiation at the transitional stage, failure of T-B cooperation and germinal centre formation, profound combined immunodeficiency. Sources: PMID:23374270, PMID:23561803 (2013 discovery papers), PMID:26289640 (somatic reversion causing Omenn syndrome), PMID:33872653 (2021 mechanistic study), PMID:25087226, PMID:26277595, PMID:30283440, PMID:31060714, PMID:40625738 (CBM-opathy reviews). Deep research: the first Edison/falcon run died with a provider connection error and the entry was drafted from PubMed abstracts fetched with just fetch-reference; the relaunched run completed afterwards, passed just preflight-dr (CARD11 85 mentions, OMIM 615206), and its reference list was cross-checked against the entry, which added PMID:25087226 and PMID:30283440 on the signalling node. No GeneReviews chapter exists. Immunoglobulin replacement is recorded as standard bridging care without an abstract-level citation. Validation: just validate pass, just validate-terms pass, count-verified-snippets 50/50, check-causal-targets and check-entity-refs clean.

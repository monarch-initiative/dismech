  summary: 'Review round 2: connect the pituitary node, split hormone replacement,
    fix evidence framing'
  details: |
    Round-2 review response.

    Blocking: the round-1 node split left 'Anterior Pituitary Hormone Secretion Failure' with no inbound causal edge, so hypopituitarism, central hypothyroidism, growth delay, hypogonadism and genital hypoplasia formed an island with no path back to EIF2S3. Added a second downstream edge from 'Over-Activated Integrated Stress Response' to the pituitary node (INDIRECT_UNKNOWN_INTERMEDIATES), and removed the sentence in the beta-cell edge description that asserted the pituitary node sat downstream of the beta-cell node, which was never written and was not the intended topology.

    Also from my own re-read of the round-1 changes: 'Motor delay' was bound to HP:0001263 Global developmental delay, which duplicated the separate developmental-delay phenotype; rebound to HP:0001270 Motor delay and repointed its edges. The single 'Anterior Pituitary Hormone Replacement' treatment bundled growth hormone and levothyroxine under one modality; replaced with two treatments, Growth Hormone Replacement (NCIT:C15986 with NCIT:C837 Somatropin, PROTEIN_REPLACEMENT) and Levothyroxine Replacement (NCIT:C15986 with NCIT:C62080, SMALL_MOLECULE). The round-1 binding NCIT:C15599 was wrong on its definition, not just its label: it is treatment with estrogens or estrogen/progesterone after menopause or ovariectomy, which does not describe hormone replacement in an affected child.

    Evidence framing. The PMID:37823684 ALS explanation argued for REFUTE and then denied it ('does not show that eIF2B activation is wrong here'); rewritten to argue the grade it carries, with a second item from the same paper quoting that the direction of ISR modulation that helps patients is still debated, graded NO_EVIDENCE and quote_role BACKGROUND. The hypothesis itself was framed backwards as 'over-activation of the integrated stress response is the druggable step', which asserts an ISR over-activation in MEHMO that nothing reported establishes; renamed to eif2b_activation_is_the_therapeutic_route and the description now says explicitly what is not being claimed. The PMID:35765291 independent-origin claim sat in an explanation whose snippet did not carry it; split into a second evidence item quoting the authors' own absence-of-common-heritage sentence.

    Frequency and prose. Growth delay was VERY_FREQUENT on a two-family abstract quote; added the PMID:28055140 comparison-table row (positive in seven families, negative in one, not assessed in two) and reworded the description to that count. The prevalence note carried an uncited 1998 Xp21.1-p22.13 mapping claim; removed and replaced with what the cited report itself shows.

    Validation: just validate clean (70 snippets, 71 titles, 0 issues); validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-coarse-phenotypes, check-genereviews (NO_CHAPTER), check-folded-hyphens, check-snippet-length, check-title-snippets and check_gene_activity_grounding all pass.

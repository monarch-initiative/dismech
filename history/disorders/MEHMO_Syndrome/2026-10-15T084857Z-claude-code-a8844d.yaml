  details: |
    Round-3 review response.

    Blocking: my round-2 rewrite of the eIF2B hypothesis description overshot. In fixing a backwards framing I wrote that nothing reported establishes ISR over-activation in MEHMO, which contradicts this entry's own 'Over-Activated Integrated Stress Response' node (GO:0140467, INCREASED) and its three citations: increased ISR activation in patient fibroblasts (PMID:28055140), DDIT3 significantly increased in a patient with a different variant (PMID:34999262), and ATF4 derepression in human cells expressing the mutant subunit (PMID:30517694). The narrower true claim is that the over-activation is reported but nothing shows it drives the phenotype rather than the reduced translation initiation it accompanies, and that ISRIB does not separate the two because it restores ternary complex formation as well. The description now says that and points at the node.

    Also from the round-3 review's minor items, both taken. The round-2 rebinding of Motor delay to HP:0001270 left no HP:0001263 phenotype, although round 1 had asked for global developmental delay. PMID:30878599 reports it directly in the mild hypopituitarism family ('He has global developmental delay needing 1:1 support in mainstream school'), and the PMID:28055140 comparison table has it positive in all ten families, so it is back as its own phenotype with VERY_FREQUENT and both quotes. The description says why it is carried separately from Motor delay. And the new pituitary edge now carries the PMID:30878599 expression snippet as evidence, graded INDIRECT because expression in a tissue is not a demonstration that the stress response acts on it, which is what the edge's unknown-intermediates marking already says.

    Wiring: the two neurological phenotypes that had no inbound edge, Global developmental delay and Motor delay, are now downstream of Neurodevelopmental Impairment. Causal connectivity on this entry goes from 10 of 15 phenotypes to 12 of 16. Checked with build_causal_graph restricted to qc_plugins.CAUSAL_PREDICATES, which also confirms the only pathophysiology node with no causal inbound edge is 'Hemizygous EIF2S3 Variants', the legitimate root.

    Validation: just validate clean (73 snippets, 74 titles, 0 issues); validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-folded-hyphens and check_gene_activity_grounding all pass.

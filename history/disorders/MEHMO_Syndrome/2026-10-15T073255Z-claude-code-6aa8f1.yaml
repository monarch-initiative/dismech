  summary: 'Create: MEHMO Syndrome'
  details: |
    Created kb/disorders/MEHMO_Syndrome.yaml for MONDO:0010258, the X-linked EIF2S3 neuroendocrine disorder.

    Deep research: one OpenScientist run (research/MEHMO_Syndrome-deep-research-openscientist.md). Its validation blocks reported 22/22 references resolved and 29/29 terms resolved, with two labels mismatched, one of them HP:0000055 reported as 'Hypogonadism / micropenis' when HPO calls it Abnormal female external genitalia morphology. That term is not bound in this entry; HP:0003241 is used for hypogenitalism instead. just preflight-dr returned WARN on two counts, both dispositioned by reading the report: DDIT3 at 8 mentions is this disease's own integrated-stress-response effector (CHOP) rather than a second disease entity, and the OMIM number the report cites, 300161, is the EIF2S3 gene record, with the disease number 300148 also present in the report and matching MONDO's xref.

    Three citations were taken from the report after reading each abstract, and all three changed the entry: PMID:32901502 added an immunologic phenotype (frequent infections despite normal IgG and IgM) and the one reported intervention with a quantified benefit, immunoglobulin replacement cutting infection frequency by 54.5 per cent; PMID:34999262 added a second stress-response effector raised in a patient with a different variant, which makes the ISR over-activation a property of the disease rather than of one allele; and PMID:37823684 added the counterweight to the ISRIB hypothesis, two eIF2B activators of the same class accelerating disease in an ALS mouse model.

    Scope decisions. The milder EIF2S3 phenotype of X-linked hypopituitarism with glucose dysregulation and normal head circumference is curated inside this entry rather than as a separate disease or a has_subtypes row, because it is the same gene acting through the same mechanism with less functional loss, the published variant-to-severity relationship is a gradient rather than two groups, and no MONDO term exists for it. The reasoning is recorded in the entry's notes.

    Deliberately not asserted. ISRIB is a mechanistic hypothesis, not a treatment entry, because no patient has been reported treated, and the ALS result above is why that distinction is worth keeping. Untreated neonatal hypoglycaemia as a cause of part of the neurological phenotype is a second EMERGING hypothesis rather than a pathograph edge, resting on one hedged sentence. A HUMAN_MODEL_MISMATCH discussion records the live disagreement about the endocrine cell mechanism: EIF2S3 knockdown in a human pancreatic line increased cell death, while the zebrafish knockout produced hyperglycaemia from progenitor deficiency explicitly not related to apoptosis, and patient fibroblasts showed no apoptosis either.

    One near-miss worth recording, of exactly the class CLAUDE.md warns about. NCIT:C15742 was written from memory as 'Hormone Replacement Therapy'; the OAK lookup returned Postremission Therapy. The correct term, NCIT:C15599, was read from the ontology and bound instead. Nothing else in the entry was written from memory.

    Validation: just validate, just validate-disorders (52/52 snippets, 53 titles, 0 issues), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-granularity, check-genereviews (NO_CHAPTER, which the entry's notes record).

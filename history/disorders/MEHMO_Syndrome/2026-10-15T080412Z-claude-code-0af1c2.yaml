  summary: 'Review round 1: node split, phenotype gaps, specific HPO terms, CI fix'
  details: |
    Review round 1 on PR #14302, answering all four reviewer items plus the CI failure.

    CI fix. The test job failed on check_gene_activity_grounding: EIF2S3 was wired into the pathograph on a node carrying no molecular function. Bound GO:0003743 translation initiation factor activity with modifier LOSS_OF_FUNCTION, which is what the entry's whole mechanism is about.

    Item 4, the bundled node. Pancreatic and Pituitary Secretory Cell Vulnerability made two claims whose evidence differs in kind: the zebrafish model covers only the pancreas and says so in its own limitations, the apoptosis-versus-developmental-deficit question is about beta cells, and the pituitary half rests on expression data alone. Split into Pancreatic Beta Cell Failure, bound to CL:0000169, and Anterior Pituitary Hormone Secretion Failure, bound to CL:0000637, each carrying only its own evidence. Hypoglycaemia and diabetes now route from the first; hypopituitarism, central hypothyroidism, growth delay and hypogonadism from the second. The zebrafish link, its readout and the HUMAN_MODEL_MISMATCH discussion were repointed to the beta cell node, and the pituitary node states plainly that it has no animal model and no patient tissue behind it.

    Item 1, missing phenotypes. Added growth delay, central hypothyroidism, hypogonadism, micropenis, cryptorchidism and global developmental delay, each with a quoted source. Growth retardation is in the title of the paper that first linked two EIF2S3 variants to the syndrome and was absent entirely.

    Item 2, coarse bindings. Three phenotypes were bound to a parent when the exact term exists and the entry's own preferred_term already named it: neonatal hypoglycaemia to HP:0001998, anterior hypopituitarism to HP:0000830, central obesity to HP:0001956.

    Item 3, evidence_source. The patient-fibroblast result from PMID:33942450 was MODEL_ORGANISM and is now IN_VITRO; cultured human fibroblasts are not an animal model, and the same publication's zebrafish results keep MODEL_ORGANISM. Yeast evidence was graded IN_VITRO in the pathophysiology section and MODEL_ORGANISM under animal_models; it is now MODEL_ORGANISM throughout, which is what the rest of the corpus does (16 yeast items graded MODEL_ORGANISM against 1 IN_VITRO).

    Suggestions taken. The PMID:30878599 item inside the discussion moved from REFUTE to SUPPORT with an explanation of why: what that discussion asserts is that two results conflict, and this is one of the two, so it supports the mismatch and contradicts only the other experiment. Both treatments gained target_mechanisms, each BYPASSES rather than RESTORES because insulin and hormone replacement act downstream of the failing cell rather than on it. The hormone replacement modality moved to OTHER, since growth hormone is a protein and levothyroxine a small molecule and no single modality value covers the pair. Added a diagnosis section for exome and X-exome sequencing.

    Validation: just validate-disorders (65/65 snippets, 66 titles, 0 issues), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check_gene_activity_grounding against origin/main, list-disconnected-phenotypes 10/15 connected.

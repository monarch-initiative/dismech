  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #9834, one CRITICAL and five IMPORTANT items. The CRITICAL was a real and instructive miss: the entry asserted that no cited source demonstrates a primary Schwann cell lesion, and encoded that belief structurally as INDIRECT_UNKNOWN_INTERMEDIATES plus a PARTIAL grade, while the deep-research report committed in the same PR block-quoted PMID:22451505 at section 6.1, which demonstrates exactly that. I built the entry from PubMed searches and used the report only as a cross-check, so the caveat was true of what I had cited and false of the literature. Sidiropoulos 2012 shows CMT-associated dynamin-2 mutants impair myelination where CNM mutants do not, and that Schwann cells and neurons expressing CMT mutants have defective clathrin-mediated endocytosis with altered protein surface levels. The node is rewritten, carries GO:0042552 myelination DECREASED, and its downstream edge is now DIRECT. The same paper supplies the missing evidence for the two DECREASED modifiers on the fission node. Also added PMID:40393994 Goret 2025, which demonstrates the loss-of-function direction in vitro rather than proposing it, superseding the review hedge that previously carried functional_impact_category; the corresponding DOI cache was discarded because its extracted text has ligature and spacing corruption, and the PubMed abstract is clean. Added a histopathology section from an already-cached sural nerve biopsy showing axonal loss and focal myelin thickenings together, which is the human tissue basis for the intermediate framing. Added two animal models with modeled_mechanisms: the zebrafish CMT-versus-CNM mRNA comparison with an ABOLISHED branching readout, and the Dnm2 S619L/K562E compound cross as a RESCUES link, which is the genetic test of the opposite-directions hypothesis. Mined the remaining GeneReviews management items as analgesia, surveillance and pregnancy management, and unbundled orthopedic surgery from the DEVICE orthoses entry. Added six downstream phenotypes# edges, CHILDHOOD onset on cataract, and three structured variants including both Lys558 alleles. Revalidated: 47/47 snippets verified, check-entity-refs, check-duplicate-keys and check-snippet-length all pass.

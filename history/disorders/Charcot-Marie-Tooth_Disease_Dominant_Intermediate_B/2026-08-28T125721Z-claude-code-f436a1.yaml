  summary: 'Review round 2: post-approval suggestions'
  details: |
    Addressed the five non-blocking suggestions from the approving review.

    1. Regraded the PMID:22451505 myelination evidence item from MODEL_ORGANISM to IN_VITRO. The assay is an ex vivo peripheral nerve culture established from Dnm2-deficient mouse tissue (MeSH: Cells, Cultured; Ganglia, Spinal/cytology; Transfection), which CLAUDE.md classifies as IN_VITRO; MODEL_ORGANISM is reserved for in vivo animal data. The explanation previously implied an in vivo readout and now states the grading reason explicitly.

    2. Retargeted the Dnm2 S619L/K562E RESCUES link. It previously pointed at the variant node, which nothing can rescue. It now points at Reduced Dynamin-2 Membrane Fission Activity, carrying the PIP2 liposome binding readout that is the biochemical event the cross actually corrects, and a second RESCUES link to Length-Dependent Distal Axonal Degeneration carries the organism-scale motor and nerve fibre readouts. The composite motor-coordination readout is graded PARTIAL for the nerve target because the animal also carries a myopathy allele.

    3. Upgraded Reduced Dynamin-2 Membrane Fission Activity to Schwann Cell Myelin Dysfunction from INDIRECT_UNKNOWN_INTERMEDIATES to INDIRECT_KNOWN_INTERMEDIATES, with a description naming the intermediate PMID:22451505 supplies (altered protein surface levels in Schwann cells).

    4. Extended the Intermediate Nerve Conduction Slowing snippet to the end of its sentence, so the non-retired cohort paper PMID:19502294 carries the 26 m/s figure itself rather than leaving it sourced to the retired GeneReviews chapter.

    5. Declined the mappings suggestion. OMIM 606482 has nowhere to go: DiseaseMappings (src/dismech/schema/dismech.yaml:7085) carries only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings. The same suggestion was raised and withdrawn on PR 9828 for the same reason.

    Validation on this head: just validate passes with 49/49 snippets verified (was 47/47); validate-terms, check-entity-refs, check-duplicate-keys, check-snippet-length, check-snippet-grading, check-title-snippets and check-folded-hyphens all clean.

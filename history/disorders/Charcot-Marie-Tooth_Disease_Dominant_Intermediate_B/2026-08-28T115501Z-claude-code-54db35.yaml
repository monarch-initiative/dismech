  summary: 'Create: Charcot-Marie-Tooth Disease Dominant Intermediate B, DNM2, MONDO:0011674'
  details: |
    De novo curation of CMTDIB from claim issue #9819. Deep research: Perplexity sonar-deep-research, report at research/Charcot-Marie-Tooth_Disease_Dominant_Intermediate_B-deep-research-perplexity.md; 4/4 identifiers resolved, 0 confabulation, 4/4 on topic, though only 4 of 19 citations were resolvable identifiers. Used as a lead source; every snippet anchored to an independently fetched PMID. The pathograph carries a Schwann cell arm and an axonal arm rather than choosing one, because the defining feature of this entity is intermediate nerve conduction velocity straddling the CMT1 and CMT2 ranges; the Schwann cell node is deliberately thin and its upstream edge marked INDIRECT_UNKNOWN_INTERMEDIATES because no cited source demonstrates a primary Schwann cell lesion. Records the allelic relationship with DNM2 centronuclear myopathy as a mechanistic contrast rather than as subtypes, with functional_impact_category PARTIAL_LOSS_OF_FUNCTION on the CMT variant node, graded PARTIAL against a review that says CMT mutations could impair activity, so the claim is a proposal rather than a demonstrated result. Important source limitation, recorded in entry notes: the GeneReviews chapter for this disease, PMID:20614582, is RETIRED, and every evidence item drawing on it says so in its explanation, with peer-reviewed cohort papers cited in preference wherever they state the same fact. A tags value of retired on the top-level reference was attempted and rejected by the schema, whose ReferenceTag enum permits only GeneReviews, so this can only live in prose. Two ontology labels were wrong on first pass and corrected against OLS: HP:0007107 is Segmental peripheral demyelination not a vibration term, replaced with HP:0002936 Distal sensory impairment; HP:0001875 label is Decreased total neutrophil count. Validated with just validate, 28/28 snippets verified, plus check-entity-refs and check-duplicate-keys.

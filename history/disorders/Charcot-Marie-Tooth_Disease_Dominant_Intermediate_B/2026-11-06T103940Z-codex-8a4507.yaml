  summary: Review CMTDIB using primary full texts and current CMT guidance
  details: |
    Reviewed the complete entry, substantive deep-research report and citation list against cached primary literature, including full texts. Replaced retired GeneReviews support with clinical cohort/case evidence and the current full CMT overview; corrected family-dependent neutropenia, variable clinical expression, cataract onset, unsupported frequencies and cross-sectional wheelchair estimates. Restricted reduced lipid-coupled GTPase activity to K562E and included the ΔDEE biochemical counterexample. Separated developmental axon branching from adult axonal degeneration; recorded incomplete allelic/BIN1 rescue and negative or adverse postnatal DNM2-delivery outcomes with model limitations. Added distal atrophy, falls, Met580Thr, clinically likely Gly537Ser, and case-supported gabapentin. Completed all eight research-completeness dimensions; rejected unsupported infection/prophylaxis, oxidative/autophagy mechanisms, other-CMT subtype histology, and human efficacy extrapolations. New reference caches were generated with just fetch-reference; abstract-only limits remain for the Czech family and 2012 culture study.

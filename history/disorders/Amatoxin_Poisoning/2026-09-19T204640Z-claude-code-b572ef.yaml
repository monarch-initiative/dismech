  summary: 'Create: Amatoxin_Poisoning (no MONDO term)'
  details: |
    New entry for amatoxin poisoning, created because the concept had zero footprint
    anywhere in kb/ - no disorder entry, no module, no stub, not a single mention -
    despite causing the large majority of fatal mushroom poisonings.

    Named for the toxin rather than the genus, because Amanita, Galerina and Lepiota
    species converge on the same molecule. This follows the existing toxin-named
    entries Aconitine_Poisoning, Colchicine_Poisoning and Ricin_Poisoning.

    No disease_term. MONDO was searched through the OLS index for eight spellings of
    the concept and has no amatoxin or mushroom-poisoning term; the searches and the
    two unrelated hits are recorded in the entry's own notes. No GeneReviews chapter
    exists and `just check-genereviews` confirms NO_CHAPTER, correct for an acute
    toxic exposure with no genetic cause.

    Deep research: `just research-disorder claude_code Amatoxin_Poisoning` (366s, 23
    web searches, 32 citations). The run exited 3 on a network timeout resolving
    MeSH:D009145 during term validation, so it wrote neither validation block. Both
    were retro-fitted afterwards - references with
    `just validate-research-reference`, and terms with the underlying
    `scripts/run_deep_research_client.sh validate-terms` with `--skip-prefix MeSH`
    added alongside the recipe's default `--skip-prefix HGNC`, since MeSH does not
    resolve through the OLS adapter and is not an ontology this repo binds to.

    The report is unusually unreliable and nothing was copied from it. Its reference
    validation resolves 27/27 identifiers but finds 11 of 12 quoted claims absent
    from the cited source - the exact case where confabulation_rate reads 0.0 and the
    report is still not quotable. Its term validation names four CURIEs that are
    different terms: CHEBI:2828 offered as alpha-amanitin is Arnebinone;
    NCBITaxon:33397 offered as Amanita phalloides is Chironomus plumosus, a midge;
    CL:1001016 offered as proximal convoluted tubule epithelium is loop-of-Henle
    ascending limb epithelial cell; and GO:0006919 and GO:0070265 are obsolete. Every
    snippet here was re-derived by reading the cached reference, and every CURIE by a
    live OLS or local-OAK lookup performed while writing the line. The correct values
    are CHEBI:37415 and NCBITaxon:67723.

    Snippet verification was run as a pre-pass before the YAML was written: 44
    candidate quotes checked as exact substrings of references_cache/, 42 passed, and
    both failures were exotic whitespace - a thin space around the >= in
    PMID:41163058, and non-breaking spaces in "6 h" and "200 g" in PMID:34143367.
    Those two were extracted from the cache files by regex rather than retyped. Every
    reference_title was likewise read from cache frontmatter programmatically and
    re-checked after assembly: 15 distinct pairs, 0 mismatches.

    Pathophysiology is a single connected chain of 15 atomic nodes - ingestion,
    systemic exposure, OATP1B3-mediated hepatocyte uptake, RNA polymerase II
    inhibition, mRNA arrest, protein-synthesis failure, p53/caspase-dependent
    apoptosis, centrilobular necrosis and acute liver failure, plus the enterohepatic
    recirculation loop and the intestinal, renal, mitochondrial-renal, TNF and
    haematopoietic branches. 13 of 17 phenotypes are causally connected (76.5%).

    Four hypothesis groups, all wired to edges: rnap2_translocation_block
    (CANONICAL), oatp1b3_independent_uptake (EMERGING), mitochondrial_nephrotoxicity
    (EMERGING), tnf_ros_amplification (ALTERNATIVE).

    Three deliberate REFUTE items, each scoped to a claim rather than to a mechanism.
    PMID:38276537 refutes extending the OATP1B3 uptake account to haematopoietic
    cells, where inhibitors do not rescue, without touching the hepatocyte evidence
    where knockdown is protective. PMID:41378447 refutes a mortality benefit for oral
    silymarin, while a separate SUPPORT item from the same paper records its positive
    acute-kidney-injury secondary outcome. PMID:41163058 refutes a plasma-exchange
    benefit in unselected patients, while a SUPPORT item records the positive
    subgroup result in encephalopathy grade 2 or worse.

    The ECTO binding is the genus ECTO:0000537 exposure to toxin, rejected from
    ECTO:0000524 exposure to mycotoxin on positive grounds: that term is defined as
    involving CHEBI:25442 mycotoxin, and an ancestors query on the pinned CHEBI build
    shows alpha-amanitin is not a descendant of it. This matches how the KB already
    splits the two, with Ergotism on ECTO:0000524 and Ciguatera_Fish_Poisoning and
    Acute_Ackee_Fruit_Intoxication on ECTO:0000537.

    Two corrections made during validation, both caught by `just validate`:
    NCIT:C77524 Activated Charcoal is not reachable from the ChemicalEntityTerm roots
    and was replaced by CHEBI:91090 charcoal with the specificity carried in
    preferred_term; and the first draft's environmental block carried an `organism:`
    slot that does not exist on Environmental, so the Amanita phalloides taxon
    binding was dropped rather than relocated.

    Eleven evidence items quoting the review PMID:39684738 for human clinical
    features were regraded from evidence_source OTHER to HUMAN_CLINICAL with
    quote_role REVIEW_SYNTHESIS, since OTHER asserts nothing about a quote describing
    the patient picture.

    The ChiCTR-registered trial behind the biliary-drainage pilot is recorded as a
    clinical_trials entry keyed on ICTRP:ChiCTR2300073442, with the WHO ICTRP record
    fetched and committed, rather than left in prose.

    A pre-PR red-team review by a fresh-context subagent against
    `dismech-pr-review` returned 22 findings; every one was acted on before the
    first push. The two blocking ones were both content the entry's own committed
    cache supported and the entry either omitted or contradicted. First, the
    oatp1b3_independent_uptake hypothesis asserted "the route has not been
    identified" while the entry's most-cited reference describes a CRISPR screen
    identifying STT3B/N-glycan biosynthesis as required for cellular entry; a
    STT3B node was added to the chain and the hypothesis reworded to the question
    that is actually open. Second, benzylpenicillin was absent although the same
    source calls it the most widely used agent for this poisoning, so it was added
    with its OATP1B3 mechanism and with two REFUTE items carrying the comparative
    evidence against its efficacy.

    Other corrections of note. The N-acetylcysteine explanation claimed no
    controlled efficacy evidence "was found in the sources screened", which the
    same cache disproves; the efficacy statements were added and the wording
    narrowed to the true claim, that no randomised or controlled trial exists.
    An OATP1B3-dependent hepatic edge had been opted into the
    OATP1B3-INDEPENDENT hypothesis group - the tag was removed. Three snippets did
    not name the thing they were attached to: the Vomiting quote recorded an onset
    interval, the diarrhea quote never said diarrhea, and the silibinin
    transport quote was truncated just before silibinin is named. All three were
    replaced with sentences that do, already exact in the cache. A node-level
    REFUTE was refuting a claim made by the hypothesis rather than by the node,
    and was corrected to SUPPORT at the node. The lead description conflated the
    6-18 h asymptomatic latency with the 6-24 h symptom-onset window, and
    contradicted the entry's own phenotype text. The GeneReviews note asserted a
    `just check-genereviews` verdict the tool contradicts - and the note itself is
    what triggers the contradiction, because naming NBK431052 in prose makes the
    checker read it as a citation; the note now says so. "Thirty-four" entries
    without disease_term was wrong; the count is 36 including this one.

    The pathophysiology node `Acute Liver Failure` and the phenotype `Acute liver
    failure` differed only in case, so they were two graph nodes for one concept
    and the phenotype rendered isolated. The mechanism node was renamed
    `Hepatic Synthetic and Metabolic Failure`, which is what it actually describes,
    and the phenotype wired from it. With three further edges added from nodes
    already present, phenotype connectivity went from 13/17 to 17/17.

    The diagnosis binding moved from the bare root NCIT:C18020 to NCIT:C217459
    Diagnostic Toxicology Testing, after confirming via OLS hierarchicalAncestors
    that it descends from both NCIT:C25218 and NCIT:C18020. `GO:0016071` mRNA
    metabolic process was replaced by `GO:0009299` mRNA transcription, since the
    former subsumes mRNA degradation and so carries the wrong sign for a node about
    synthesis failing. The duplicate `Ingestion of Amatoxin-Containing Mushroom`
    pathophysiology node was dropped and the environmental link retargeted at the
    systemic-exposure node, following Arsenic_Poisoning.

    Six previously uncited references were consumed, including the species-scope
    source that the entry's own naming rationale depends on, the intravenous
    silibinin evidence, the dedicated urinary-quantification study, and the
    ulcerating-ileocolitis phenotype. The thirteen that remain uncited are listed
    in the entry's notes with the reason each was not used.

    One process failure to record: the benzylpenicillin CHEBI identifier was
    written from memory rather than from a lookup, in the middle of a fix pass that
    was itself correcting reviewer-surfaced defects. It happened to be right -
    CHEBI:18208 is benzylpenicillin - and it was checked immediately afterwards
    against OLS, but it was right by luck and not by process, which is the same
    failure the rest of this entry was built to avoid.

    Validation: `just validate-disorders` reports 89/89 snippets verified, with
    schema and term validation passing. Clean: check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms, check-snippet-grading, check-title-snippets,
    check-snippet-length, check-folded-hyphens, check-environmental-evidence,
    check-case-collisions, check-reference-titles, check-not4curation,
    validate-history.

  summary: Bind LOINC measurement to the urinary amatoxin diagnosis row
  details: |
    Added a LOINC-coded measurement (LOINC:80636-4, Alpha-amanitin [Mass/volume] in Urine) to the existing Urinary amatoxin detection diagnosis row, merging the new identity note into the row's pre-existing notes field rather than duplicating the key. LOINC has no combined, method-less code for amatoxin as a class; only per-species codes and a method-specific combined panel exist, so alpha-amanitin (the dominant species) is bound as the closest match. No reference range is bound: the cited 'urinary concentrations > 55 ng/mL' figure is a single 32-patient study's prognostic association with hepatotoxicity, not a diagnostic or population-validated cut-off, and its strict '>' inequality cannot be represented by a half-open reference_ranges band without asserting a precision the source does not state. LOINC:80636-4 was verified against the Monarch KG and confirmed absent from origin/main and from every other open campaign branch before being seeded as a new, additive cache row.

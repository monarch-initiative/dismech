  summary: 'Create: Methylmalonic acidemia with homocystinuria, type cblJ'
  details: |
    New Disease entry for MONDO:0014109 (ABCD4 deficiency, cblJ). Curated from an OpenScientist deep-research report plus primary literature; 26/26 evidence snippets verified against references_cache. Pathograph runs from ABCD4 loss-of-function through failed ABCD4-LMBD1 complex assembly and blocked lysosomal cobalamin export to the combined AdoCbl/MeCbl deficiency, giving the dual methylmalonic acidemia + homocystinuria biochemical signature. Two discussions recorded: cblj_ascertainment_shapes_severity (INTERPRETATION -- the reported phenotypic range is drawn from a handful of index cases found by targeted sequencing after a biochemical phenotype, so mild ends of the spectrum are structurally under-ascertained) and cblj_cblf_phenocopy_boundary (KNOWLEDGE_GAP -- ABCD4 and LMBRD1 defects are cellular phenocopies and the entry does not assert that they are clinically separable). Validated with just validate-disorders plus the ungated whole-KB gates (snippet length/title/grading, folded hyphens, enum values, duplicate keys, entity refs, causal targets, qualifier terms).

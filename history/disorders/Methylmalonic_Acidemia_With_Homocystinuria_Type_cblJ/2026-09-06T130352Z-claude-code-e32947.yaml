  details: |-
    Adds the classifications block, which was the one round-1 review suggestion I did not
    address in the round-1 push and did not mention when I replied. Recording that omission
    here rather than presenting this as new work: the reviewer wrote "No mappings: (OMIM
    #614857), no classifications:", I answered the mappings half at length (the schema has no
    OMIM slot, filed as #10750/#7906) and let the classifications half fall off the list.

    harrisons_chapter: ENDOCRINOLOGY_METABOLISM and GENETICS_ENVIRONMENT_DISEASE.

    icimd_category: cobalamin_metabolism, ICIMD category 21 group "Disorders of cobalamin
    (vitamin B12) metabolism". The notes record why this is not filed under organic_acidurias
    the way the sibling Methylmalonic_Acidemia entry is: there, methylmalonic acidemia is the
    primary enzymatic defect; here it is one of two secondary consequences of a transport
    defect upstream of the cofactor branch point, and the organic-aciduria group would lose
    the homocystinuria arm entirely. That is the same branch-point argument the entry is
    built on, applied to its own classification.

    Provenance is in notes rather than evidence, per the disease-classification skill: an
    ICIMD placement is a definitional taxonomy mapping, and the ICIMD paper carries no
    per-disease sentence that would serve as an exact-quote snippet for this group.

    Validated: just validate-disorders (51/51, unchanged - this round adds no snippets),
    just validate-terms, check-enum-values, check-duplicate-keys, check-entity-refs. Green.

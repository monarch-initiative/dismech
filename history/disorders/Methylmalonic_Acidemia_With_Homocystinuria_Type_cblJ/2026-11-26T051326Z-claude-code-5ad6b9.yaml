  summary: 'Gene-family review: ABCD4, LMBRD1'
  details: |
    ABCD4 was typed CAUSATIVE while ClinGen classifies ABCD4 in cblJ (MONDO:0013925, this entry's disease_term) as Moderate (CGGV:assertion_902c9288-f6bd-4068-9a5f-652b49583d93-2026-01-23T200000.000Z, already recorded); following the convention that CAUSATIVE needs a Definitive or Strong tier, the record is now UNKNOWN with a note, and its inheritance block is bound to HP:0000007. The ABCD4 lesion node already bound GO:0015420 ABC-type vitamin B12 transporter activity as DECREASED, which is correct. The ABCD4-LMBD1 complex node named both genes but no molecular function; it now binds GO:0015420 for the complex's export activity and GO:0061462 protein localization to lysosome for LMBD1's part, citing the reconstitution showing that ABCD4 exports cobalamin from liposomes in an ATPase-dependent way and LMBD1 has no transport activity (PMID:33845046). LMBRD1 has no genetic record here, correctly, since it is the cblF gene rather than a cblJ gene.

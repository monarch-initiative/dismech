  summary: 'Review round 1: address all seven findings on PR #11232'
  details: |-
    Review round 1 on PR #11232. All seven blocking findings and all seven suggestions
    addressed in one push. Evidence base goes from 26 to 51 verified snippets and from
    5 to 10 distinct references.

    1. GeneReviews mined. A top-level references: block now tags PMID:20301503 as
       GeneReviews, and the chapter is quoted in diagnosis (the sentence naming ABCD4
       as the cblJ confirmatory gene, which is the one GR statement specific to this
       disease rather than the group), treatments (early injectable hydroxocobalamin,
       and the agents-to-avoid list including nitrous oxide), inheritance (25/50/25
       recurrence risk, prenatal and preimplantation testing, and the in-utero
       treatment-initiation point), the new haematologic phenotype, and three of the
       four biochemical readouts. Every GR item is graded OTHER and carries
       directness: INDIRECT where the statement is class-level rather than cblJ-specific.

    2. Pathograph island wired. Depletion of Both Cobalamin Cofactors now has a
       downstream edge into the clinical node, and the clinical node has edges out to
       all seven clinical phenotypes. The edge is drawn from the depletion node rather
       than from the two enzyme-failure nodes deliberately: no study separates the
       neurological and haematological consequences by arm, so two edges would assert
       an attribution nobody has made.

    3. PMID:41378236 consumed, and it corrected a factual error. The entry said in
       three places that "roughly ten" patients are described; no cited source supported
       that. The 2025 report describes its patient as the eighth documented instance.
       All three occurrences are corrected and the prevalence notes says explicitly that
       the earlier figure was unsupported and has been removed.

    4. Megaloblastic anemia added as a bound phenotype (HP:0001889), with the
       cblJ-specific documentation and the GR group-level statement.

    5. Recurrent abdominal pain attacks added (HP:0002027) with the within-patient
       withdrawal and rechallenge - attacks ceased on cobalamin and recurred when levels
       fell. That is the strongest causal evidence in the entry that a clinical feature
       is driven by the cofactor deficit rather than merely co-occurring, and it is n=1.

    6. biochemical: section added with four analytes. The important one is serum
       vitamin B12, curated with direction THRESHOLD_DEPENDENT and an interpretation
       saying a normal value does not exclude the disease - the lesion is downstream of
       absorption and transport. The entry made that point in prose; it is now where a
       reader would look for it.

    7. evidence_source misgrade corrected. The "Vitamin B12 (cobalamin (Cbl)), in the
       cofactor forms..." snippet is background biochemistry from a paper's introduction,
       not a human clinical observation. Regraded HUMAN_CLINICAL to OTHER with the reason
       stated in the explanation.

    History record: the CREATE record for this entry said MONDO:0014109 in its details.
    The correct ID is MONDO:0013925, which is what the entry, the deleted stub and the
    cache row all carry. Corrected in place rather than by superseding, because the PR
    is unmerged and the error is a factual mistake in the prose rather than a change in
    what the session did. links.issues and links.prs are now populated.

    Suggestions taken. PMID:42231716 now supports the hydroxocobalamin therapeutic_agent
    binding, which neither cblJ-specific snippet named. The betaine and carnitine note is
    rewritten: the guideline recommends betaine first-line for MTHFR deficiency, a
    folate-cycle disorder, and makes no betaine recommendation for cobalamin-related
    defects, so the class-level source does not license it here either; carnitine appears
    in no cited source. Failure to thrive now leads with the quote that names it rather
    than the poor-feeding correlate. The Homocystinuria description now says why the bound
    term is the urinary finding while plasma tHcy is curated as a biomarker.

    Two structural papers consumed: PMID:42303638 (cryo-EM of the ABCD4-LMBD1 complex,
    establishing that ABCD4 lacks a sorting motif and reaches the lysosome only as LMBD1
    cargo - the structural basis for the cblJ/cblF phenocopy question this entry records)
    and PMID:38069516 (proteoliposome reconstitution, TM helix 6). Both feed a new
    experimental_models: section covering the only two systems in which this disease's
    mechanism has been studied, since no animal model exists.

    Four caches were pruned rather than cited, with the reason recorded in notes:
    PMID:23546813 (unassigned cobalamin defect, MMACHC-negative, group not resolved),
    PMID:23751581 (58 Chinese patients, predominantly cblC), PMID:34655177 (cblC prenatal
    diagnosis) and PMID:35013307 (Hcfc1/Ronin mouse, cblX-like). None is about cblJ.

    Not done, and why. The reviewer suggested a mappings: block for OMIM:614857. The
    schema has no OMIM slot - DiseaseMappings carries only icd10cm, icd11f, mondo and
    ncit - so the identifier cannot be recorded structurally today. Already filed as
    #10750 and #7906; commented on #10750 with this occurrence rather than filing a third.

    Validated: just validate-disorders (51/51), just validate-terms, and the ungated
    whole-KB gates: snippet length, title snippets, snippet grading, folded hyphens,
    environmental evidence, enum values, duplicate keys, entity refs, causal targets,
    qualifier terms, model-scale-audit --strict. All green.

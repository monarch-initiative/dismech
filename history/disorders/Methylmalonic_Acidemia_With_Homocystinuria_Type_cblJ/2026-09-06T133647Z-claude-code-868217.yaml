  summary: 'Round 2: take all four review suggestions'
  details: |-
    Takes all four round-2 suggestions. The review approved the PR and marked them non-blocking; three
    of the four are internal inconsistencies rather than polish, which is why they were worth a cycle.

    1. Megaloblastic anemia regraded FREQUENT -> VARIABLE. This is the one that mattered. The grade
       rested on one cblJ patient plus a class-level GeneReviews sentence about the intracellular
       cobalamin disorders with cblC as prototype. That is the same evidence shape carried by Seizures
       and Developmental delay, both VARIABLE in this entry, and weaker than the shape behind Hypotonia
       and Failure to thrive, which are named in a cblJ case-series sentence. Grading the same shape two
       different ways inside one entry is the defect. The description now states the reasoning rather
       than leaving the grade to be re-derived.
    2. directness: INDIRECT added to that class-level GeneReviews item. Every other class-level GR item
       in the entry carries it; this one was added last and missed it.
    3. p.Arg531Trp added to the genetic record's allele list, with two evidence items - the variant
       identification, and the sentence locating the residue in the ABC transporter domain, which is
       what makes it mechanistically interpretable rather than just a reported allele. The variant was
       cited elsewhere in the entry while the record whose job is to list alleles did not carry it.
    4. Homocystinuria preferred_term trimmed from "Homocystinuria with hyperhomocysteinemia" to
       "Homocystinuria". The term is bound to HP:0002156, the urinary finding, and the description says
       plainly that plasma tHcy is curated as a biomarker instead. The preferred_term was claiming both
       while the description disclaimed one.

    A general point the frequency item raises, recorded because it recurs. FREQUENT asserted from a
    counted cohort and FREQUENT asserted from a class-level statement are different claims, and nothing
    in the schema separates them. directness: INDIRECT is the only handle and it sits on the evidence
    item rather than on the frequency, so a reader sees the grade without the caveat. Same shape as
    EvidenceItem having no slot for study design or n. Not fixable in this entry.

    Also ran pytest tests/test_data.py for this entry for the first time - the round-2 review of the
    sibling AIP PR found a hard gate that just validate-disorders does not run and that CI skips on a
    kb/-only diff. Clean here.

    Validated: just validate-disorders 53/53 (up from 51), just validate-terms,
    pytest tests/test_data.py (2 passed), and the full ungated set: snippet length, title snippets,
    snippet grading, folded hyphens, environmental evidence, enum values, duplicate keys, entity refs,
    causal targets, qualifier terms.

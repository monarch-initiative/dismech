  details: |
    New gene-specific entry for MONDO:0700337, curated under claim issue #13685.
    The stub was decided as a Disease: MONDO has a gene-specific term only for
    the ACE form, and the REN, AGT and AGTR1 forms have no terms of their own,
    so a four-gene grouping is deferred until those forms are curated.

    Deep research: one OpenScientist report
    (research/Renal_Tubular_Dysgenesis_-_ACE-deep-research-openscientist.md).
    `just preflight-dr` passed (ACE mentioned 61 times). The report's
    validation listed PMID:32808512 and PMID:18406804 as unresolved; the run
    log shows both lookups failed with HTTP 429. Both were re-fetched with
    `just fetch-reference` and resolve to on-topic papers (an ACE-RTD case
    report and a review of ACE-null mice). PMID:32808512 is cited; 18406804 is
    not, because PMID:8642790 is the primary mouse report. The report's
    CL:1000697 for juxtaglomerular cells is a kidney interstitial macrophage
    term and was not used; CL:0000648 kidney granular cell was bound instead.
    Report citations not used: 9860997 and 11096065 (AGTR1 and AGT mice),
    33768328 and 38649831 (AGTR1 patients), 24061643 and 21359618
    (ureteric bud branching, not shown in ACE-RTD).

    Further sources were found by PubMed search and fetched: Gribouval 2005
    and 2012 series, ACE trafficking studies (24163131, 21695262, 20454656),
    the kidney organoid study (38071212), ACE-null and secreted-ACE mice
    (8642790, 9153279), survivor reports, the ClinGen Definitive assertion,
    and ACE inhibitor fetopathy papers for the differential.

    Pathograph: ACE loss of function, loss of cell-surface ACE, absent
    angiotensin II, loss of RAS blood pressure support, fetal renal
    hypoperfusion, proximal tubule dysgenesis, anuria, then oligohydramnios
    and the Potter sequence. Side branches cover aldosterone, renin
    overexpression, erythropoiesis (mouse data only) and urine concentration
    (mouse data only). The organoid delayed-angiogenesis model is an EMERGING
    hypothesis group, and the organoid itself is recorded as
    FAILS_TO_RECAPITULATE the tubule lesion in vitro. Stillbirth and neonatal
    death are under progression because their HPO terms are outside the
    PhenotypeTerm enum. Maternal ACE inhibitor exposure is a differential
    diagnosis, not an environmental cause.

    A pre-PR review by a separate agent led to these changes. The root node no
    longer claims lost catalytic activity: PMID:24163131 and PMID:21695262
    show lethal variants that keep catalysis but lose membrane-bound ACE, so
    the angiotensin II node now reads as loss of tissue angiotensin II
    generation. The delayed-angiogenesis edge now comes from that node rather
    than from hypoperfusion, because hypoxia rescued VEGF-A in the organoid
    study. The erythropoiesis branch is now an EMERGING hypothesis group.
    Histopathology, renal histology and plasma renin/ACE diagnosis entries
    were added, the fludrocortisone evidence now quotes the reported result,
    and a mixed-source PMID:24163131 item was split by evidence_source.

    Dropping the root node's GO:0008241 binding left ACE landing on a node
    with no molecular function, which the PR's CI gate
    `check_gene_activity_grounding.py` rejects. The binding is restored with
    preferred term "tissue-bound peptidyl-dipeptidase activity"; the node
    description already states that the loss is of membrane-bound enzyme. At
    the PR reviewer's suggestion, the plasma ACE biomarker context now says
    "usually undetectable", because a secreted truncated enzyme can persist.

    No GeneReviews chapter exists (`just check-genereviews --online`:
    NO_CHAPTER). Validation: `just validate` and `just validate-disorders` passed, snippets verified
    offline (115/115 after the review round), entity refs and causal targets clean, and every reference_title
    checked against the cache frontmatter. Stub deleted.

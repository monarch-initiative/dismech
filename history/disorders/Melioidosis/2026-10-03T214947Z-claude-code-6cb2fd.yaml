  details: |
    Added a four-phase progression block drawn from the 20-year Darwin prospective study (PMID:21152057) and the Nature Reviews primer (PMID:29388572): Incubation (incubation_days 1-21, mean 9 days; 81 percent of cases present in the monsoonal wet season from recent infection), Acute melioidosis (symptoms under 2 months at presentation, 85 percent of presentations, deaths concentrated early with a median of 3 days from admission), Chronic melioidosis (symptoms over 2 months, 11 percent of presentations, 2 percent mortality), and Latency with late reactivation (4 percent of the series; reactivation described up to 62 years after exposure; the Vietnamese time bomb that did not materialise). No new references. No other section edited. Validation: just validate passed; count-verified-snippets all verified; check-snippet-grading, check-title-snippets, check-snippet-length, check-duplicate-keys, check-enum-values, check-entity-refs and check-causal-targets clean; check-granularity no longer reports NO_PROGRESSION.

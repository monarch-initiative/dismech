  summary: 'Create: Melioidosis'
  details: |
    Created de-novo entry for Melioidosis (Burkholderia pseudomallei, MONDO:0017775). Deep research via the claude_code provider (327s, 24 web searches, claude-haiku-4-5 plus claude-sonnet-5). Modelled facultative-intracellular pathophysiology (T3SS-3 phagosomal escape, BimA actin-based motility, MNGC formation, sepsis, multi-organ abscesses) and antibiotic-mechanism nodes conforming to bacterial_cell_wall_synthesis_inhibition (ceftazidime/carbapenem intensive phase), bacterial_folate_synthesis_inhibition (TMP-SMX eradication), and intracellular_pathogen_persistence (eradication-phase cell-penetrant requirement). Content: 11 phenotypes, 5 environmental risk factors (diabetes, soil/water, CKD, thalassemia/iron overload, alcohol), a culture diagnosis, and 2 two-stage treatments. A fresh-context red-team review (dismech-pr-review) was run pre-PR; resulting fixes: reframed the intracellular conformance node to state beta-lactams are effective acutely (only eradication needs a cell-penetrant agent) and set its role to therapeutic_vulnerability; dropped an unsupported T6SS-5 molecular claim from the MNGC node; added the septic-shock and prostatic-abscess phenotypes; retargeted the diabetes edge to the innate-immunity/sepsis node; added the culture diagnostic; removed a misleading DECREASED modifier on the two drug-target processes. All 12 PMIDs fetched and verified against PubMed; 50/50 evidence snippets verified against cached references; the claude_code report's Meumann PMID (37749352) was a misattribution and was discarded after verification. Validated with just validate and just validate-disorders (schema, terms, references).

  summary: Enhanced Satoyoshi Syndrome with classifications, sporadic inheritance, evidence-backed diagnostic
    criteria, pathograph causal links and evidence, phenotype sequelae and coarse binding basis, NCIT
    diagnosis bindings, treatment target mechanisms, and key reference syntheses.
  details: '1. Added classifications.harrisons_chapter (IMMUNE_RHEUMATOLOGIC, NEUROLOGIC, GASTROINTESTINAL)
    with evidence from PMID:36749015, PMID:16972238, and PMID:32429959. 2. Added Sporadic inheritance
    (HP:0003745) supported by PMID:28215594. 3. Added verbatim evidence (PMID:31217029, PMID:36749015,
    PMID:15069249) to both diagnostic criteria sets and removed the ungrounded exclusion_criteria item.
    4. Added causal_link_type and verbatim evidence (with directness: INDIRECT on inferred edges) to all
    pathophysiology downstream edges and connected Uveitis, Amenorrhea, Abdominal Pain, Alopecia Universalis,
    and Trismus into the pathograph. 5. Added sequelae on Painful Muscle Spasms targeting Skeletal Abnormalities
    (causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES, directness: INDIRECT, PMID:15069249, PMID:28267828),
    declared coarse_binding_basis SOURCE_UNSPECIFIED on Skeletal Abnormalities (HP:0000924), and added
    Trismus (HP:0000211, PMID:28215594, PMID:28267828). 6. Added PMID:36749015 evidence to Antinuclear
    Antibodies (ANA) and added Secondary Organ-Specific and Systemic Autoantibodies (PMID:36749015). 7.
    Added target_mechanisms with verbatim evidence (directness: INDIRECT) from PMID:32429959 and PMID:31217029
    to Corticosteroids (INHIBITS), Dantrolene (INHIBITS), Immunosuppressive Agents (INHIBITS), and Intravenous
    Immunoglobulin (IVIG) (MODULATES). 8. Bound all 5 existing diagnosis entries to NCIT terms (NCIT:C15607,
    NCIT:C181397, NCIT:C45946, NCIT:C38056, NCIT:C16357) and added Gastrointestinal endoscopic biopsy
    (NCIT:C15389, PMID:32429959, PMID:17405137). 9. Added Dystonia (Spasmodic Dystonia) (MONDO:0003441,
    PMID:23649720, PMID:31217029) to differential_diagnoses. 10. Added top-level references syntheses
    with verbatim evidence for PMID:36749015, PMID:31217029, PMID:32429959, PMID:17405137, and PMID:16972238.'

  summary: 'Create: ZDHHC9-Related_X-Linked_Intellectual_Disability'
  details: |
    New entry for X-linked intellectual disability caused by hemizygous ZDHHC9 loss-of-function variants (MONDO:0010427, OMIM 300799). Built from the claude_code deep-research report (research/ZDHHC9-Related_X-Linked_Intellectual_Disability-deep-research-claude_code.md; preflight-dr PASS) plus PubMed. PMID:25984423, which the report guessed for the Baker 2015 cohort, is an unrelated pulmonary fibrosis paper and is not cited; the correct PMID is 26000327. The disease_term label follows the current MONDO label (intellectual developmental disorder, X-linked, syndromic, Raymond type); the older label is kept as a synonym. Pathophysiology runs from ZDHHC9 loss of function through impaired DHHC9-GCP16 palmitoyltransferase activity into three branches: neuronal Ras palmitoylation and dendrite outgrowth, neuronal TC10 palmitoylation and inhibitory synapse formation leading to network hyperexcitability and epilepsy, and oligodendrocyte MBP palmitoylation leading to abnormal myelination and reduced corpus callosum and white matter volume. The Ras node carries REFUTE evidence (H-Ras palmitoylation preserved in mutant mouse brain). Phenotypes come from the discovery report, three family reports, the UK cohort of nine males, and a 2023 review; frequencies only where a cohort gave a count. ClinGen Definitive (XL) copied from the CGGV record. No GeneReviews chapter (check-genereviews --online: NO_CHAPTER). One KNOWLEDGE_GAP on neuronal versus oligodendrocyte mechanism. Validation: just validate and validate-terms pass, 81/81 snippets verified against cached references, entity-ref, causal-target, duplicate-key, block-scalar, snippet-length, title-snippet, snippet-grading and coarse-phenotype checks pass.

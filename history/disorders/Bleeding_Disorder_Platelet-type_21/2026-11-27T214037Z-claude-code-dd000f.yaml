  details: |
    Enriched four existing phenotypes (abnormal bleeding, thrombocytopenia, abnormal platelet aggregation, abnormal alpha granules) with evidence from already-cached sources: Gabinaud et al. 2025 (DOI:10.3324/haematol.2024.286372), the normal-count inherited platelet disease review PMID:33147934, the Stockley 2013 cohort and Vo 2017. Removed a stale 'marked PARTIAL' explanation. Wired all five phenotypes from existing pathophysiology nodes (0/5 to 5/5 causally connected). Corrected the 'a third of the dominant cohort had a normal count' wording in notes and diagnosis, since that 2 of 6 count spans FLI1 and RUNX1 carriers. NCBI, Europe PMC, OMIM, Orphanet and OLS were unreachable from the curation environment, so no new references could be cached; Saultier et al. 2017 (PMID:28255014), which reports macrothrombocytopenia and near-absent dense granules, is recorded in notes as a lead. just validate-disorders, count-verified-snippets (37/37), validate-terms, check-causal-targets, check-coarse-phenotypes and check-name-collisions all pass.

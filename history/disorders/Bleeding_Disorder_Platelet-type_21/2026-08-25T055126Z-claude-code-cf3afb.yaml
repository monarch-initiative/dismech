  summary: 'Review round 1: add convergence node on the qualitative arm only'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9456 (round 1). Changes here: finding 6 only. Added 'Failure of Primary Hemostatic Plug Formation' downstream of the granule/secretion node. Deliberately routed only the qualitative arm through it - the entry's thrombopoiesis arm still reaches the bleeding node directly, because impaired platelet production is the route the module explicitly does not model.

    Findings 1-4 were blocking; 5-8 were suggestions and were also addressed, one of them by argument rather than by change.

    FINDING 1 (blocking) - two ontology bindings asserting the opposite of the curated finding. Confirmed and fixed; this was my error. 'Preserved Platelet Aggregation' (Scott) and 'Normal Platelet Count and Morphology' (BDPLT18) were both bound to HP:0011869 'Abnormal platelet function', with that label also copied into preferred_term. The Scott case was the damaging one - preserved collagen-induced aggregation is the single feature distinguishing the disorder from the rest of its family, and a consumer reading only the bound term got the reverse claim. The BDPLT18 case was wrong twice: an abnormality term on a normal result, and a function term on a count/morphology finding. Both now carry a free-text preferred_term with no term: and a notes: block naming the HPO gap and recording that a new-term request is the durable fix. This is the same disposition the entry set already used for the serum-B12 marker in Gray_Platelet_Syndrome, so it restores internal consistency rather than adding a new convention. The root cause was reaching for a generic parent to satisfy the validator instead of leaving the term off.

    FINDING 2 (blocking) - no treatments: in four of five new entries. Addressed by explicit deferral notes rather than by curating blocks, because no disorder-specific management evidence exists in the reference cache for these four: the cited sources are gene-discovery, mechanism and cohort papers whose abstracts name no agent or regimen. Writing the blocks would have meant citing a general inherited-platelet-disorder source for a disease-specific claim, or manufacturing snippets. Each entry now states the deferral, what management actually is in practice, and why it is not curated. Where a mechanism-derived inference is clinically real it is stated as an inference and labelled as such - platelet transfusion being rational in Scott syndrome because the defect is thrombin generation rather than platelet number; avoidance of P2Y12 antagonists in BDPLT8.

    Also recorded in each: these entries deliberately do NOT inherit the module's rFVIIa BYPASSES pattern. That is the module's own written rule (its evidence base is Glanzmann thrombasthenia; use elsewhere in the series is extrapolation), so the unused join the reviewer noted is a deliberate policy, not an oversight.

    FINDING 3 (blocking) - BDPLT8 had no inheritance: block. Added, curated as autosomal recessive on the cached genotypes (three homozygous frameshifts, one compound heterozygote). The fourth patient's unidentified second allele is carried as a PARTIAL evidence item, since it is consistent with but does not establish the mode. The reviewer mentioned a reported heterozygous dominant-negative allele; nothing in the cache evidences one, so no dominant mode is asserted and the entry says so explicitly rather than importing the claim on the reviewer's word.

    FINDING 4 (blocking) - no deep-research artifact. These were curated by direct full-text and abstract review, not from a DR provider. Rather than only noting this in the PR body, a 'Curation provenance' paragraph was added to each of the five entries' notes:, recording the method, that candidate PMIDs were fetched before use, and that several initially plausible identifiers turned out to be unrelated papers and were discarded rather than cited on their titles. That keeps the provenance in the KB where a later curator will find it.

    FINDING 5 (suggestion) - diagnosis: absent from GPS and BDPLT18. Added to both, from evidence already cached. The BDPLT18 entry documents the PMA arm as the discriminator against Glanzmann thrombasthenia, which is the practical point of the disorder.

    FINDING 6 (suggestion, and the sharpest one) - the grouping's defining criterion was stricter than two of its members. Confirmed: Platelet-Type_von_Willebrand_Disease and Bleeding_Disorder_Platelet-type_21 had no node at the central effector, and check-groupings passed only because it matches at module rather than node granularity, so the grouping_rationale over-claimed. Fixed by adding a 'Failure of primary hemostatic plug formation' node to both, the same repair already applied to the GFI1B entry, each with the convergence evidence. In BDPLT21 only the qualitative arm is routed through the new node; its thrombopoiesis arm still reaches bleeding directly, because impaired platelet production is the route the module deliberately excludes. All nine members now carry the anchor the criterion names.

    FINDING 7 (suggestion) - modifier mismatch on GO:0017121 between module (DECREASED) and Scott syndrome (LOSS_OF_FUNCTION). Addressed by argument rather than by change. The reviewer proposed moving the module; instead the module now documents the convention: arms carry the quantitative PATO-bound default because an arm must accommodate partial and hypomorphic lesions, while a conformer whose own lesion is qualitative uses LOSS_OF_FUNCTION on its own node. The difference is intended - the module states the general case, the conformer its own - and is now written down so it does not read as an oversight.

    FINDING 8 (suggestion) - no top-level references: block. Added to all five, naming the anchor reviews.

    SEPARATE DEFECT FOUND WHILE FIXING FINDING 8, not raised by the reviewer. Adding the references: block caused the title check to fail on Gray_Platelet_Syndrome, revealing that all 16 evidence items citing PMID:21765412 (Kahr, 'NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet alpha-granules') carried the title of PMID:21765413 (Albers, 'Mutations in NBEAL2, encoding a BEACH protein, cause gray platelet syndrome') - two back-to-back 2011 Nature Genetics NBEAL2 papers. All snippets were and remain exact quotes from the correct cached record, so no scientific claim was affected, but the provenance label was wrong on every one. Fixed, and an audit of every reference_title against every cached title across all ten touched files was then run; it found one further discrepancy (a doubled space in the BDPLT8 P2Y12 title) and now reports zero. Worth recording that reference_title is checked in the references: block but was not being compared for evidence-item titles here, which is why sixteen wrong labels survived earlier passes - the same field the previous PR's reviewer identified as the one place a curator's paraphrase meets the source.

    Validation after all changes: schema, terms and references pass on all five new entries (52/37/19/25/21 snippets verified), the module (11/11), and the two edited pre-existing entries (32/32 PT-VWD, 31/31 BDPLT21). Grouping audit: nine members, all SATISFIED on both criteria, structure OK. check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence all clean; one new folded-hyphen finding was introduced by my own deferral prose and reflowed.

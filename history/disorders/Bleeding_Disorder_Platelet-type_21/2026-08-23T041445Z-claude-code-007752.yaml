  summary: 'Review response: rewire the pathograph into two parallel arms, add models'
  details: |
    Addressed the automated review on PR #9264. The blocking finding was that the pathograph serialized the two arms the entry claimed to separate: Platelet Granule and Secretion Defect hung off Impaired Megakaryocyte Maturation and Thrombopoiesis, asserting the qualitative defect is caused by the low platelet count. Both the PR description and the entry notes said the opposite, and the cited evidence contradicts it - absent collagen-induced aggregation against only moderate thrombocytopenia in PMID:26316623, and a third of the dominant cohort with a normal count. Rewired so both arms branch from Loss of FLI1 Target Gene Transactivation and each reaches Mucocutaneous Bleeding Diathesis independently. Split a mixed-source evidence item whose snippet spanned in vitro iMeg data and in vivo NSG-mouse results under a single IN_VITRO tag, into IN_VITRO and MODEL_ORGANISM items quoting the corresponding sentences. Added the two model systems PMID:28432223 describes: an experimental_models entry for the PTSx and FLI1+/- iPSC-derived megakaryocytes (RECAPITULATES the quantitative arm, with the limitation that the patient line carries the whole 11q deletion so only the FLI1+/- line isolates the gene) and an animal_models entry for the NSG mouse iMeg infusion assay, typed MEASURES rather than RECAPITULATES because the mouse is a host for human cells and is not itself FLI1-deficient. Upgraded two phenotype terms after checking the HPO hierarchy as the reviewer asked: HP:0011875 Abnormal platelet morphology to HP:0012483 Abnormal alpha granules, and HP:0011869 Abnormal platelet function to HP:0030397 Abnormal platelet dense granule secretion. Recorded the OMIM:617443 identity in external_assertions rather than mappings.omim_mappings, because DiseaseMappings carries only ICD-10-CM, ICD-11, MONDO and NCIT slots and omim_mappings fails schema validation. Added the deep-research artifact, whose NEC preflight against MONDO:0054577 returns PASS (FLI1 mentioned 50 times against 7 for the next gene; report OMIM 617443 matches the MONDO xref) and whose reference validation reports 7/7 resolved, 0 unresolved, 0 off topic. Validation: linkml-validate clean, linkml-term-validator passed, 30/30 snippets verified against cached references (was 26/26), all five ungated gates clean, term cache integrity OK.

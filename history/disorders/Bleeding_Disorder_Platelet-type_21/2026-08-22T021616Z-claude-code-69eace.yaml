  summary: 'Create: Bleeding disorder, platelet-type, 21 (FLI1)'
  details: |
    New Disease entry for bleeding disorder, platelet-type, 21 (MONDO:0054577), claimed via issue #9218.

    Lump/split decision: DISEASE. One causal gene (hgnc:3749 FLI1), no MONDO descendants, and no existing entry covering the term or the FLI1 platelet phenotype.

    Mechanism curated as a five-node chain plus one modifier: FLI1 DNA-binding domain dysfunction -> loss of FLI1 target gene transactivation (GP6, GP9, ITGA2B) -> impaired megakaryocyte maturation and thrombopoiesis -> platelet granule and secretion defect -> mucocutaneous bleeding diathesis.

    Deliberate structural choice: the quantitative arm (impaired thrombopoiesis) and the qualitative arm (granule/secretion defect) are kept as separate nodes rather than collapsed. This is load-bearing -- bleeding in this disorder is disproportionate to platelet count, and a third of the reported dominant cohort had a normal count, so curating it as a thrombocytopenia whose bleeding follows from the low count would misrepresent it. Recorded in notes so a later curator does not merge them.

    Both heterozygous (Stockley, PMID:24100448) and homozygous (Stevenson, PMID:26316623) presentations are curated in one entry as two Inheritance blocks, because both are ETS-domain loss of function converging on the same targets and the same pathograph. Whether they are one entity is genuinely unsettled -- the apparent severity gradient is confounded by different assays, populations and ascertainment -- and is recorded as an open KNOWLEDGE_GAP rather than decided silently.

    ETS1 derepression is curated as a role: modifier node at PROVISIONAL confidence with its own KNOWLEDGE_GAP: the source frames it as a suggestion, and excess ETS1 could plausibly compensate for or distort megakaryopoiesis, predictions no published experiment separates.

    Paris-Trousseau thrombocytopenia and Jacobsen syndrome are curated as differential diagnoses rather than as part of this entry, since they are contiguous 11q23 deletions carrying cardiac, craniofacial and neurodevelopmental features from other genes. RUNX1-related familial platelet disorder is the second differential, with the myeloid-malignancy risk difference noted as the reason the distinction matters for counselling.

    No treatments block: no FLI1-specific treatment evidence exists.


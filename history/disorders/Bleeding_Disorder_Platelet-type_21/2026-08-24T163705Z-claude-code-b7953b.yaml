  details: |
    Re-reviewed as part of a sweep of the platelet-type bleeding disorders. No content rewritten, no evidence changed.

    Change made: three conforms_to declarations added - the FLI1 trigger node to primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component, 'Platelet Granule and Secretion Defect' to #Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling, and 'Mucocutaneous Bleeding Diathesis' to the module's identically named consequence node.

    This entry sits furthest upstream of any conformer on the secretion arm: FLI1 is a transcription factor that under-builds the platelet wholesale rather than removing one component, which the module's arm guidance covers explicitly (the megakaryocyte transcription-factor disorders). Its thrombopoiesis arm stays outside the module by design.

    Also added as a member of the new Inherited_Platelet_Function_Disorders grouping, where it satisfies both the defining conformance criterion and the necessary bleeding criterion.

    Validation after the change: linkml-validate PASSED; reference validation PASSED with 30/30 snippets verified.

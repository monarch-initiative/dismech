  summary: 'Review round 1: OMIM MIMs, T-cell lymphopenia, type III IFN, heterozygous
    genetic record, node splits'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #11979. All seven IMPORTANT items plus most of the suggestions, in a single push.

    Item 1. The iuis_category notes glossed 603122 as the disease MIM. It is the DOCK2 gene MIM; the IUIS table column is a gene column. The snippet is untouched, as it is an exact quote of that row. The prose now says which number is which and points at the new external_assertions records.

    Item 2. OMIM:616433 (Immunodeficiency 40) and OMIM:603122 (DOCK2 gene) are both recorded, as external_assertions rather than mappings. DiseaseMappings carries only ICD-10-CM, ICD-11, MONDO and NCIT slots; there is no omim_mappings slot and issue #9922 withdrew a proposal to add one. This follows the precedent in Platelet-type_Bleeding_Disorder_15. Recording the gene MIM alongside the disease MIM is deliberate: it is the number in the quoted IUIS row, and the pair is what prevents the misreading that item 1 was about.

    Item 3. Added a Decreased total T cell count phenotype (HP:0005403), evidenced from the index cohort and from an independent Iranian registry patient, wired inbound from the new T Cell Lymphopenia node.

    Item 4. The interferon node now binds GO:0034343 type III interferon production alongside GO:0032606. The node name, description and snippet all asserted type III and only type I was bound.

    Item 5. Added a second genetic record for the heterozygous ELMO1-binding-domain form, scoped to its subtype. relationship_type is SUSCEPTIBILITY rather than CAUSATIVE, because the phenotype is severe illness on encountering particular viruses and not a constitutive immunodeficiency. The enum's own description for SUSCEPTIBILITY is written for polygenic GWAS loci, which this is not; the value is used for its plain meaning and the record says so. PMID:38857861 is cited there for the structural reason an ELMO1-binding-region variant is pathogenic, as BACKGROUND and INDIRECT since that paper's own result is about DOCK5.

    Item 6. Interferon alfa now carries therapeutic_agent NCIT:C225 Recombinant Interferon Alfa. The source says only IFN-alpha and does not name a product, which the description now records. therapeutic_modality changed from PROTEIN_REPLACEMENT to OTHER: it is an immunomodulatory cytokine given pharmacologically, not replacement of a protein the patient lacks.

    Item 7. The TREC newborn-screening claim in diagnosis now carries two evidence items, PMID:34418894 for the measured TREC/KREC result and PMID:34872585 for the authors' screening recommendation. The explanation records that the DOCK2 arm of the first series is a single patient, so it establishes abnormality and not sensitivity.

    Suggestions taken. The Lymphopenia and Impaired T Cell Activation node was split into T Cell Lymphopenia (a count claim, carrying the TREC evidence) and Impaired T Cell Activation and Antibody Response (a function claim, carrying the PHA and T-dependent antibody evidence). All four references to the old node were retargeted: the upstream chemotaxis edge now goes to both, the HSCT target_mechanisms now names both with different descriptions, and the mouse model plus its readout now target the function node only, which let its limitations prose shrink to what the model actually speaks to. A new Impaired Neutrophil Respiratory Burst node (GO:0045730) takes the reactive-oxygen-species half of the PMID:30838481 sentence, which the chemotaxis node was carrying as if it were a cytoskeletal result. Elevated serum IgE (HP:0003212) added from the registry case, with its single-patient basis stated. PMID:40860338, the 503-patient MENA registry, added to the HSCT record for the survival benefit that names DOCK2. The supportive-care treatment was split into Immunoglobulin Replacement (PROTEIN_REPLACEMENT, NCIT:C121331, with a target_mechanisms link to the antibody-response node) and Anti-Infective Prophylaxis and Symptomatic Care (SMALL_MOLECULE), because one record could not answer what modality it was. Three previously disconnected phenotypes were wired: colitis from the chemotaxis node via the mucosal lymphocyte paucity the biopsy shows, granulomatous inflammation from the T-cell function node, and failure to thrive as a sequela of the colitis. All three edges are INDIRECT_UNKNOWN_INTERMEDIATES with descriptions saying the route is inferred rather than demonstrated.

    Suggestion declined. GO:0030676 was not bound: the OLS API reports it obsolete (is_obsolete true, label GO_0030676). A GO search for a Rac-specific guanyl-nucleotide exchange factor activity term returns only GO:0005085, the parent already bound, so there is no live specific term to move to.

    Validation: just validate clean (schema, terms, references), 46/46 snippets verified, up from 35/35. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean.

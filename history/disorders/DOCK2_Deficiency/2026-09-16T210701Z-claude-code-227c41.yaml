  details: |
    Created kb/disorders/DOCK2_Deficiency.yaml from claim issue #11962. Deep research: openscientist (research/DOCK2_Deficiency-deep-research-openscientist.md, 19 citations, 19/19 resolved, 0 unresolved, 0 off topic; 12 of 19 weighed on topic, 7 undecided for lack of an abstract). The run's own term-validation step aborted on an EBI network timeout, so the report was written with no reference_validation or term_validation frontmatter; the ## Reference Validation section was added afterwards with just validate-research-reference. Pathograph: 7 nodes from the SCARB2-independent single lesion (DOCK2 LOF) through failed RAC1 activation to four functional branches - lymphocyte actin/chemotaxis, NK degranulation, interferon production, and a non-haematopoietic fibroblast antiviral defect. The deep-research report changed the entry's framing: it surfaced PMID:41654261 (2026), a heterozygous ELMO1-binding-domain hypomorphic form, so the entry now carries two has_subtypes and a second (dominant) inheritance block rather than describing a purely recessive disease. It also supplied PMID:30838481 (primary human neutrophil ROS/cytoskeleton defect) and PMID:38366567 (mouse HSV-1 model). Two ontology CURIEs written from memory were caught and corrected during curation elsewhere in this run; every CURIE here was read from cache/ or OAK. Validation: just validate passes (schema, terms, 35/35 snippets verified); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all clean. PMID:33928462 is deliberately not cited - the fetcher returns content type unavailable for it, so there is no quotable text; recorded in the entry notes.

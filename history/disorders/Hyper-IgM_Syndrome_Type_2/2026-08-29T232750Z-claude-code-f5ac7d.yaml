  summary: 'Create: Hyper-IgM Syndrome Type 2 (AID deficiency)'
  details: |
    Created kb/disorders/Hyper-IgM_Syndrome_Type_2.yaml (MONDO:0011528, AICDA/hgnc:13203, OMIM:605258) de novo. Duplicate preflight: no AICDA or MONDO:0011528 entry existed in the local worktree or on origin/main; the pre-existing hyper-IgM_Syndrome_Type_1 stub is CD40LG and a different disease (IUIS Table 1). No GeneReviews chapter exists for AICDA/HIGM2 - the only hyper-IgM GeneReviews chapter is CD40 Ligand Deficiency (PMID:20301576), which covers HIGM1, so it was deliberately NOT cited here to avoid named-entity confusion. Content: eleven pathophysiology nodes tagged with biological_scale, tracing AID enzymatic loss (GO:0004126, LOSS_OF_FUNCTION) into two parallel arms - failed class-switch recombination (GO:0045190) to an IgM-restricted repertoire, and failed somatic hypermutation (GO:0016446) to absent affinity maturation - converging on loss of opsonizing/mucosal antibody function and recurrent bacterial sinopulmonary and mucosal infection, plus a giant-germinal-center arm (GO:0002467, INCREASED) driving massive lymphoid hyperplasia and a B-cell tolerance arm (GO:0002514) driving autoimmunity. Fifteen phenotypes with HP bindings; frequency bands asserted only where Quartier 2004 quantifies them (lymphoid hyperplasia 22/29 = FREQUENT; autoimmune/inflammatory disease 6/29 = OCCASIONAL) and deliberately omitted for single-case-report findings. Three treatments with target_mechanisms links: immunoglobulin replacement (NCIT:C62710), antibiotics (NCIT:C15620), and HSCT recorded as NOT a routine indication, contrasting with HIGM1. Genetic section covers both the AR disease and the AD C-terminal R190X form as a separate genetic context with a Variant record. Classifications: harrisons_chapter IMMUNE_RHEUMATOLOGIC + GENETICS_ENVIRONMENT_DISEASE, and single-valued iuis_category 'predominantly antibody deficiency' evidenced by the IUIS 2022 Table 3 section-3 heading, with notes recording the contrast that CD40LG/CD40 hyper-IgM sit in Table 1 instead. SOURCE DEFECT HANDLED: the AICDA recessive row in references_cache/PMID_35748970.md is corrupted by PDF text extraction - its disease label was lifted onto a later line and its OMIM is misprinted as a 7-digit 6055258 (correct value OMIM:605258, confirmed against MONDO:0011528) - so the intact single-line section heading was quoted instead of the broken row, and the correction is recorded in the classification notes rather than inside any snippet. Validation: just validate, just count-verified-snippets (60/60), just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-title-snippets, just check-snippet-length, just check-folded-hyphens, and the authoritative just validate-disorders all pass. Eight initially-short snippets were rewritten as full propositional quotes rather than baselined.

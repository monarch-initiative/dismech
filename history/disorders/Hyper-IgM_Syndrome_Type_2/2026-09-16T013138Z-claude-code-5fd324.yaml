  details: |
    Changed the two biological_processes modifiers added on 'AID Enzymatic Loss of Function' (GO:0016446, GO:0045190) from LOSS_OF_FUNCTION to ABSENT, per the automated reviewer: ABSENT is PATO-bound (PATO:0000462) and matches the cited evidence's own wording ('the absence of ... class switch recombination', 'the lack of ... somatic hypermutations') exactly, where LOSS_OF_FUNCTION is reserved by ModifierEnum's description for a qualitative change in regulatory control rather than complete abolition by enzyme loss. Also added a clause to the node's description explaining why this node, rather than either of its two downstream nodes, is the conformance anchor: it is the single molecular lesion that causes both the Failed CSR and Failed SHM nodes, and neither downstream node alone covers the module's bundled central-node claim.

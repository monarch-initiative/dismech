  summary: 'Create: Neutrophil Immunodeficiency Syndrome (MONDO:0011988), RAC2 dominant-negative
    arm'
  details: |
    Created kb/disorders/Neutrophil_Immunodeficiency_Syndrome.yaml. entry_type DISEASE; the
    stub is retired by this change.

    This claim (#9309) replaced #9301 (AOA1) mid-run, after AOA1 turned out to be an earlier
    claim held by another curator on #8936 that was invisible to just fetch-claims because a
    REVIEW_AGAINST_PARENT retitle had dropped its claim label. That tooling gap is filed as
    #9307.

    Scope decision, and it is the substantive one here. RAC2 disease is a four-way
    allele-class spectrum, not a single entity: constitutively active RAS-like alleles cause
    neonatal SCID, dominant-negative alleles cause the LAD-like phagocyte disease curated
    here, and dominant-activating alleles cause a later-onset combined immunodeficiency
    accounting for 44 of 54 patients in the flagship cohort. MONDO:0011988 denotes the
    dominant-negative arm only, so this entry covers only that, and the boundary is stated in
    the entry description and recorded as an OPEN_QUESTION rather than left implicit. The
    IMD73B and IMD73C stubs remain open and belong to the CID arm.

    The mechanistic point that makes the entry worth having is that RAC2 sits at one branch
    point controlling two independent effector arms - NOX2 oxidase activation and
    chemoattractant-driven actin assembly - so a single allele disables both killing and
    getting there. Those are curated as two separate nodes converging on a third, rather than
    bundled into one neutrophil-dysfunction node, which also respects the single-value
    biological_scale discipline.

    The relationship to chronic granulomatous disease is recorded explicitly because it is
    easy to get backwards. Both end in a failed respiratory burst, but in CGD the catalytic
    NOX2 complex is broken while here it is intact and only its RAC2 activator is missing -
    which is exactly why adding recombinant Rac to patient extracts restores superoxide
    production. The second, chemotaxis arm is what CGD lacks and what makes this a leukocyte
    adhesion deficiency mimic rather than a CGD mimic; normal CD11b is what excludes LAD-I
    itself.

    An upstream ontology question is recorded as a KNOWLEDGE_GAP rather than acted on:
    MONDO:0011988's second parent, T-B- severe combined immunodeficiency, fits the
    constitutively active allele class rather than the dominant-negative one this term
    denotes, and looks like gene-level classification applied to an allele-level term.

    NEC handling deserves a note. The gene-level preflight passed with RAC2 mentioned 210
    times, but that check is weak for this disease because every allele class would pass it.
    The real risk was a report nominally about RAC2 and substantively about the CID cohort.
    That was checked separately at the allele level - D57N mentioned 58 times, E62K/G12R/Q61
    not at all - confirming the report is about the correct arm. The preflight tool cannot
    make that distinction, so the check was done and recorded by hand.

    The Rac2-null mouse is curated with two ModelMechanismLinks and honest limitations: it is
    a complete null while the human disease is a heterozygous dominant-negative, so it cannot
    speak to sequestration of the wild-type product; and its superoxide defect was present in
    bone marrow neutrophils but ABSENT in activated peritoneal exudate neutrophils, so the
    oxidase node is deliberately NOT claimed as recapitulated.

    Validation: just validate passes all three stages, reporting "Snippets checked: 21/21
    verified against cached references". All six cited PMIDs fetched with just
    fetch-reference; no cache file hand-written. One snippet had been written from memory and
    was corrected against the source - the real PMID:11445809 abstract states that screening
    tests of phagocyte function were normal, which is a more useful claim than the one that
    had been invented, and it is now curated as the diagnostic-trap evidence.

    The first deep-research run for this disease failed on a transient Perplexity server
    disconnect and was relaunched; the second succeeded.

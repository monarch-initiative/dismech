  summary: 'Review: connect NIS''s four detached phenotypes (IUIS Table 5)'
  details: |
    All four were detached. The two assay findings are drawn from the specific nodes they measure - chemotaxis from the actin-assembly node, oxidative burst from the NOX2 node - rather than both from the common downstream node, because the RAC2 dominant-negative allele breaks two pathways and the entry models them separately.

    The normal-or-elevated count edge carries the finding most likely to mislead: release is intact and function is not, so the count does not flag the disease.

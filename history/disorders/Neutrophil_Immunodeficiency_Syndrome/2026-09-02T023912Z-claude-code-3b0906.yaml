  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Created a classifications block; the entry previously had none. Added harrisons_chapter (IMMUNE_RHEUMATOLOGIC, GENETICS_ENVIRONMENT_DISEASE) and iuis_category: phagocyte defect.

    IUIS 2022 Table 5, section 2 (Defects of Motility), cache line 3046: 'Rac2 deficiency RAC2 AD LOF 608203', affected cells N, affected function adherence, chemotaxis and superoxide production, associated features poor wound healing and leukocytosis.

    RAC2 is printed in THREE different IUIS 2022 tables as three distinct diseases, and the notes record the split by OMIM number because the disease NAME does not discriminate - two of the three rows are both printed 'RAC2 deficiency':
    - Table 1, 'Activated RAC2 defect', AD GOF, MIM 602049 (cache line 667);
    - Table 3, 'RAC2 deficiency', AR, MIM 602049 (line 2100);
    - Table 5, 'Rac2 deficiency', AD LOF, MIM 608203 (line 3046) - this entry.

    This entry is confirmed as the AD LOF / dominant-negative arm: MONDO:0011988, synonym IMD73A, the p.Asp57Asn allele, matching MIM 608203. Its own description already scoped it that way before this change. The notes name the IMD73B (MONDO:0033554) and IMD73C (MONDO:0033555) arms as belonging to Tables 1 and 3, so a later reader does not try to pull them in here.

    Evidence cites PMID:35748970 with the row quoted verbatim; the explanation states that the 'AD LOF' cell plus MIM 608203 are what distinguish it from the two MIM 602049 rows.


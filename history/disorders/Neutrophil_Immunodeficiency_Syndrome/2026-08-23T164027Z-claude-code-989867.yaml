  summary: 'Review rounds: address ai4c-reviewer findings on RAC2 neutrophil immunodeficiency'
  details: |
    Three review rounds on PR #9313, recorded together.

    Round 1 raised five IMPORTANT findings. Added treatments: (HSCT as the definitive
    therapy, joined by target_mechanisms at the initiating allele node because RAC2 is
    haematopoietic-restricted, so replacing that compartment replaces the whole diseased
    tissue) and diagnosis: (normal CD11b as the LAD-I discriminator, functional neutrophil
    assays, and RAC2 sequencing framed as insufficient without functional characterisation,
    since the disease follows the allele class rather than the gene). Added the Rac2D57N
    transgenic zebrafish, which was the significant omission: it is the only model carrying
    the actual human allele rather than a null, and it supplied a mechanism the entry
    lacked - RAC2 is required for CXCR4-mediated retention in haematopoietic tissue, so the
    peripheral neutrophilia is partly active over-mobilization rather than only failed
    consumption at tissue sites. Also mined PMID:11445809 further and added human support
    to the oxidase node.

    The GeneReviews baseline check the round-1 reviewer could not complete was resolved
    here: a PubMed search of the GeneReviews book index for RAC2 returns nothing, so the
    absent references: block is correct. Recorded in notes:.

    Round 2 confirmed four of five resolved and correctly held the fifth. The defining
    phenotype still rested solely on MODEL_ORGANISM evidence, which CLAUDE.md forbids for a
    human phenotype, and the explanation conceded the human counterpart was not quotable.
    That premise was FALSE - the quote was in a reference this PR had already fetched, at
    PMID_38194689.md line 133. This is the second time in the same session I asserted
    something was not quotable without checking properly; the other was the ACMG prevalence
    figure on the GSD VI entry. The pattern is inferring a limitation from tooling
    behaviour rather than testing it against the cache.

    Fixing it changed two things beyond adding a citation. The human cohort describes counts
    as "normal or elevated", which is weaker than the node's previous claim that counts "are
    raised, not lowered", so the description was softened to match. And HP:0410258
    "Neutrophilia in absence of infection" was over-committed: the absence-of-infection
    qualifier is what the mouse baseline data supports, while the human patients were
    described mid-infection. The node now uses HP:0011897 "Increased total neutrophil
    count", and the mouse evidence is retained at supports: PARTIAL so its stronger,
    differently-qualified baseline claim is not read back onto the human phenotype.

    Three round-2 suggestions taken. The same cohort sentence supplied an onset descriptor
    (NEONATAL, presentation within the first month of life) and a prevalence record
    (CASES_IN_LITERATURE, five dominant-negative patients in a 54-patient cohort). The
    antimicrobial treatment was regrounded from NCIT:C15747 Supportive Care to NCIT:C15986
    Pharmacotherapy with therapeutic_modality SMALL_MOLECULE, since treating an active
    rapidly progressive soft-tissue infection is directed therapy rather than supportive
    care.

    Two schema details learned in the process: onset is a slot on the descriptor
    (phenotype_term), not on the phenotype, and OnsetDescriptor takes notes rather than
    description.

    Validation: 37/37 snippets verified under just validate-disorders, the exact CI command,
    up from 21/21 at first submission. All five ungated CI gates pass.

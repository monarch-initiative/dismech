  summary: Record four open questions as structured discussions
  details: |
    Added four KNOWLEDGE_GAP discussions. The entry already carried four
    mechanistic_hypotheses and two discussions, so this records open questions that
    were either sitting in prose where no query could read them, or absent.

    paf_functional_deficit_versus_neuronal_loss asks whether the noradrenergic failure
    is carried by surviving neurons that cannot synthesise or sequester norepinephrine
    rather than by loss of those neurons. This was already in the entry as a hedge at
    the end of the vesicular storage node's description - "Sympathetic dysfunction may
    therefore precede frank denervation" - which is a question written as a claim. The
    rationale records the reason it stays open: the vein biopsy that found normal
    norepinephrine transporter with very low tyrosine hydroxylase sampled a forearm
    vein, while the 18F-dopamine PET showing lost uptake imaged the myocardium, so
    normal transporter in one territory and lost uptake in another is as consistent
    with regional heterogeneity as with a lesion in living neurons. The entry cites no
    study pairing the two in the same patients, which is what the proposed experiment
    does. Goldstein's sick-but-not-dead review (PMID:32372682) supplies the general
    position and the precedence claim; PMID:29162745 supplies the PAF-specific reading.

    paf_is_nonconverting_paf_a_distinct_entity asks whether a stable peripheral PAF
    exists or whether every case would convert given long enough follow-up. The entry
    records the conversion rates thoroughly but says nothing about the non-converting
    majority. The meta-analysis states that heterogeneity between studies was partly
    explained by follow-up duration, which is the signature of censoring rather than of
    a distinct group, so that sentence is the evidence rather than a rate figure. The
    proposed experiment is autopsy-anchored because clinical follow-up cannot separate
    a lesion that never ascended from one that ascended without becoming symptomatic.

    paf_can_the_prodromal_window_be_intercepted attaches to the No Disease-Modifying
    Therapy treatment and asks whether the peripheral lesion is still the right target
    once PAF is diagnosed. The argument is internal to the entry: by diagnosis the
    postganglionic lesion is severe, and a therapy aimed instead at preventing ascent
    targets propagation, which this entry's own HUMAN_MODEL_MISMATCH discussion records
    as unproven in PAF. Two of its three evidence items are graded OTHER because the
    quoted sentences are the authors' recommendations rather than results they measured.

    paf_genetic_contribution_to_a_sporadic_disease records that sporadic is a claim
    about family history and not about susceptibility. The negative-existence claim was
    searched rather than assumed: PubMed for pure autonomic failure AND genome-wide
    association returns 0 records (2026-10-27), and the eleven hits for a broader
    genetic-association query were checked by title and are reviews, other diseases or
    unrelated. Both the query and the date are in the rationale so the absence can be
    re-run, and the gap is framed as untested rather than refuted. PMID:29508456 was
    newly fetched for this; the entry-level notes paragraph on SNCA was left as it
    stands, because it is a caveat about how the gene is recorded and not the question.
    No genetic section was added - there is still no causal gene to record - so the
    discussion attaches to disease# and to the aggregation node.

    Validated with just validate (233 snippets, 233 titles, 0 issues - up from 222,
    since the four discussions add eleven evidence items), validate-terms, and the
    per-file gates for entity refs, causal targets, enum values, duplicate keys,
    block-scalar comments, coarse phenotypes, qualifier terms and delivery system. The
    entity-ref gate is what confirms the new anchors resolve, including
    progression#Phenoconversion to a central synucleinopathy,
    treatments#No Disease-Modifying Therapy and disease#Pure Autonomic Failure. The
    causal graph is unchanged at 65 nodes and 71 edges with no orphan targets and no
    integrity issues, which is expected: a discussion and its proposed experiments add
    no pathograph edges, and none of the four declares a model system.

  summary: Add OpenScientist deep research and integrate new evidence
  details: |
    Ran OpenScientist deep research on the entry (research/Pure_Autonomic_Failure-deep-research-openscientist.md, with its final_report artifacts). This is the first independent provider report for PAF: the earlier report was a Claude Code fallback after Falcon returned 403 and drew on references already cached in the curation worktree.

    Report checks: 30/30 references resolved, 22/22 quotes valid, 24 on topic. Report mentions PAF 60 times; preflight-dr returned SKIP because MONDO records no causal gene, and a manual identity check confirmed the report is about PAF. Term validation flagged 9 mislabelled CURIEs (for example NCIT:C66878 given as droxidopa is lapatinib ditosylate; HP:0012694 given as supine hypertension is enlarged thalamic volume; ORPHA:95429 given as the PAF Orphanet ID, which is ORPHA:441). None of the report's CURIEs were bound.

    Additions, each with exact snippets from cached abstracts:
    - Aggregation node: SNCA E46K carriers presenting as PAF with heavy cutaneous p-synuclein (PMID:31178336) and SNCA-triplication cosegregation of cardiac denervation (PMID:14736756), both graded INDIRECT.
    - prodromal_msa_paf hypothesis: Queen Square autopsy cohort where 5/15 nonmotor-onset MSA cases were first diagnosed PAF and all had normal supine noradrenaline (PMID:35790426).
    - Droxidopa: pooled 3-trial analysis (PMID:28494751), including its 2-10 week duration caveat, and NNT/NNH (PMID:27538531).
    - New treatment Ampreloxetine: phase 2 SUPPORT (PMID:34657222) plus REFUTE from the phase 3 SEQUOIA/REDWOOD programme that enrolled PAF and missed its primary endpoints (PMID:42475649). The report described only the positive phase 2 result; the phase 3 paper was found by a separate PubMed search.
    - Supine hypertension treatment: nOH/nSH trade-off review (PMID:33687577).
    - New animal_models block: ganglionic fibril injection in TgM83 mice (PMID:32071315), PARTIALLY_RECAPITULATES the aggregation node and, at LOW fidelity, CNS spread, with typed CAUSE_UNREPRESENTED and SPECIES_MISMATCH divergences.
    - notes: removed the statement that no dedicated PAF animal model exists, which PMID:32071315 contradicts.

    Validation: just validate, validate-terms, validate-disorders all pass; 195/195 snippets verified; entity refs, causal targets, snippet grading, duplicate keys, enum values and the whole-tree gates pass; 24/24 phenotypes causally connected.

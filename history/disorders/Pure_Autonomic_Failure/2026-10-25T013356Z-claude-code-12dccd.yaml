  summary: Record the absence of any exposure epidemiology as a knowledge gap
  details: |
    Added a discussions block with one KNOWLEDGE_GAP entry recording that no environmental,
    occupational or lifestyle exposure has been studied as a risk factor for this disease.

    This entry has no environmental section because the exposure sweep across the
    alpha-synucleinopathies returned nothing at all for it, not because exposures were judged
    irrelevant. The gap is recorded as an absence of evidence rather than evidence of absence,
    and attaches to environmental# as an intentionally empty section.

    The reason it is worth recording is that the exposure findings which do exist disagree
    across these diseases: smoking is inversely associated with Parkinson disease, positively
    associated with isolated REM sleep behaviour disorder and null in dementia with Lewy
    bodies, and occupational pesticide exposure is positive in Parkinson disease and null in
    multiple system atrophy under a job-exposure matrix. Nothing can be inferred about this
    disease from its neighbours, so the absence is a real gap rather than a formality.

    The note states the limit of the search honestly: these were disease-named exposure
    queries run across the synucleinopathies, and a dedicated strategy for this disease
    including the older Bradbury-Eggleston designation has not been run.

    Provider: OpenScientist (autonomous mode, 5 iterations, 52 citations, 20 minutes).
    The report is committed at research/Alpha_Synucleinopathies-environmental-exposures-deep-research-openscientist.md
    with its citations sidecar and HTML/PDF artifacts. Falcon was unavailable for this
    run (the configured Edison key returns 403), so no second provider corroborates it.

    Every quoted sentence was read from the cached abstract in references_cache/ rather
    than from the report, and several of the report's figures were corrected or qualified
    against source in the process. The report was treated as a lead throughout.

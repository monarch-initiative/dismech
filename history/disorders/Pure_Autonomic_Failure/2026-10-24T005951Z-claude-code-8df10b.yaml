  summary: 'Create: Pure_Autonomic_Failure'
  details: 'New entry for pure autonomic failure (MONDO:0018608). No stub existed; the disease was mentioned
    only in the Multiple_System_Atrophy notes and as an Autoimmune_Autonomic_Ganglionopathy differential.


    Deep research: falcon was requested but Edison returned 403 (authentication) on both the run and the
    provider health probe. The run was repeated with the recipe''s --fallback, which produced research/Pure_Autonomic_Failure-deep-research-claude_code.md
    (frontmatter records requested_provider falcon, fell_back true). That report states it was written
    from the abstracts already cached in this worktree, so its agreement with the entry is not independent
    corroboration. Its reference validation was 59/59 resolved and 13/13 quotes valid; preflight-dr returned
    SKIP because MONDO records no causal gene, and a manual identity check found the report is about PAF
    (SNCA, TH and SLC18A2 noradrenergic biology). The evidence base was assembled directly from PubMed
    searches (natural history, phenoconversion, biomarkers, skin biopsy, CSF seeding, cardiac imaging,
    treatment trials, supine hypertension) plus Orphanet ORPHA:441.


    Curated: two-hypothesis pathograph (Lewy-body PAF with postganglionic noradrenergic lesion; non-Lewy
    PAF as premotor MSA), with 24 phenotypes all causally connected; progression with phenoconversion
    rates from a meta-analysis and four cohorts; histopathology, imaging, biochemical readouts (plasma
    norepinephrine, DHPG:NE ratio, CSF seeding, CSF NfL, erythropoietin), diagnostics, differentials and
    13 treatments including supine hypertension management. A REFUTE item records the autopsied PAF case
    without synuclein pathology (PMID:28188385).


    An independent subagent review before the PR led to: HP:0004370 instead of Heat intolerance, HP:0000505
    instead of Blurred vision, CL:0000107 for preganglionic neurons, a prodromal-MSA root node, removal
    of unsupported differential features, a renamed erythropoietin node, and dropped frequencies not supported
    for PAF specifically.


    Validation: just validate passes (schema, terms, references); count-verified-snippets 181/181; check-entity-refs,
    check-causal-targets, check-enum-values, check-duplicate-keys, check-block-scalar-comments clean;
    list-disconnected-phenotypes 24/24. check-genereviews: NO_CHAPTER (non-Mendelian).'

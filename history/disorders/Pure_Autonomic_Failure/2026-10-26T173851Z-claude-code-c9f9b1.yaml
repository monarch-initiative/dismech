  summary: 'Review round 2: regrade the absent-animal-testing citation'
  details: |-
    The reviewer found one evidence item graded wrongly on the catecholaldehyde_autotoxicity
    hypothesis group. The PMID:34206133 sentence "there has been insufficient testing of the
    catecholaldehyde hypothesis in animal models" was recorded as supports: REFUTE with
    evidence_source: MODEL_ORGANISM, which asserts that animal work was done and told against
    the hypothesis. The sentence says the opposite: the experiment is missing and reports no
    animal data at all.

    Regraded to supports: NO_EVIDENCE with evidence_source: OTHER, keeping
    quote_role: REVIEW_SYNTHESIS, and the explanation now states why. The item was kept rather
    than dropped because the absence of animal testing is the stated reason the hypothesis group
    is EMERGING rather than ALTERNATIVE, and leaving it queryable is worth more than removing it.

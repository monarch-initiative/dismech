  summary: 'Review round and upstream catecholaldehyde layer: Pure Autonomic Failure'
  details: |-
    Review round on PR 15556, plus an upstream extension of the pathograph requested in the same session.

    Review fix (blocking): the Ampreloxetine description said benefit "was confined to MSA", which asserts a PAF result the cited phase 3 report never measured. Rewritten to state the prespecified MSA subgroup finding and that no PAF-specific result has been reported, with the trial-powering sentence added as its own evidence item. Three optional suggestions from the same review were also taken: the droxidopa duration caveat folded into the pooled-analysis explanation rather than kept as a separate SUPPORT item; SEQUOIA (NCT03750552) and REDWOOD (NCT03829657) added as clinical_trials records; and the CNS-spread model link given typed divergences.

    Upstream extension: the pathograph previously began at alpha-synuclein aggregation with the trigger recorded as unknown. Added one node upstream, Catecholaldehyde (DOPAL) Autotoxicity in Noradrenergic Neurons, marked mechanism_confidence HYPOTHETICAL, carrying the monoamine-oxidase route to DOPAL, the covalent oligomerization of alpha-synuclein, and the vesicular-storage feedback loop. Its edge into the aggregation node and the return edge from the vesicular storage node are both tagged to a new EMERGING hypothesis group, catecholaldehyde_autotoxicity, so they read separately from the canonical Lewy-body chain. A second EMERGING group, sympathetic_body_first_origin, records the postmortem body-first staging evidence for where the pathology starts, as distinct from what starts it. Every item on both is graded INDIRECT except the PAF-specific PET quote: the chemistry is in vitro, the staging cohorts are incidental Lewy body disease, PD and DLB rather than PAF, and the progression model is computational.

    Open questions captured structurally rather than as prose. paf_what_initiates_aggregation is a KNOWLEDGE_GAP attached to both upstream nodes and the new hypothesis group, citing the review's own PAF-specific unanswered question, with two proposed experiments keyed to the fact that PAF is the one Lewy body disease whose affected neurons are reachable by vein and skin biopsy. paf_peripheral_aggregate_seeding_mismatch is a HUMAN_MODEL_MISMATCH rather than a generic gap, because evidence exists on both sides and conflicts: synthetic fibrils injected into mouse ganglia spread to the CNS, while Lewy-body aggregates purified from human sympathetic ganglia failed to seed in mouse brain when nigral aggregates from the same patients succeeded. That negative result is recorded as REFUTE evidence and as a CAUSE_UNREPRESENTED divergence on the model link it undercuts.

    Searched and not added: no genetic susceptibility finding for sporadic PAF exists. GBA1 and LRRK2 searches return nothing for this disease, and the entry's existing statement that PAF is sporadic with rare SNCA phenocopies is unchanged.

    Validation on the committed tree: just validate passes (214 snippets, 212 titles, 0 issues); validate-disorders passes; validate-terms passes with the two new bindings CHEBI:27978 and GO:0042420; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-snippet-grading, check-reference-titles, check-title-snippets, check-snippet-length, check-folded-hyphens, check-retired-support-prose and check-environmental-evidence all clean; term cache integrity OK after normalize-cache.

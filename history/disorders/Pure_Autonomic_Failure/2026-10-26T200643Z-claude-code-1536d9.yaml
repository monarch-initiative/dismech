  summary: Connect non-animal models (NAMs) to the PAF pathograph
  details: |
    Added an experimental_models section, so the non-animal systems behind the
    catecholaldehyde step are recorded as models rather than left inside evidence
    items, and added one proposed experiment that names an iPSC platform.

    Two realized systems. The first is the BE(2)-M17 neuroblastoma line with mouse
    primary cortical neurons as the non-overexpressing arm (PMID:28084443), which
    is the system in which DOPAL-driven alpha-synuclein oligomers were shown to
    permeabilise synaptic vesicles and release stored dopamine. It is linked
    PERTURBS to the catecholaldehyde node and PARTIALLY_RECAPITULATES to the
    vesicular storage node, which is the return arm of the loop this entry draws
    between them. The second is the MO3.13 oligodendrocyte line co-incubated with
    dopamine-producing PC12 cells (PMID:26777075), which establishes that the
    aldehyde crosses between cells, and which comes from the same laboratory as the
    MO3.13 quinonisation result the entry already cited.

    Neither is a model of PAF, and every link says so in typed divergences rather
    than in prose: CAUSE_UNREPRESENTED because DOPAL is supplied in the medium
    instead of arising from vesicular leak, BOUNDARY_OMISSION because the
    sympathetic noradrenergic neuron is absent, PROXY_QUANTITY because dopamine
    leak stands in for norepinephrine storage failure, and SPECIES_MISMATCH for the
    rodent arms. Review round 1 corrected two things here. The primary cortical
    neurons in PMID:28084443 are mouse, not rat, which the paper states directly and
    its MeSH list confirms; and the species divergence on both links of that model is
    QUALIFYING rather than IMMATERIAL, because the endogenous-alpha-synuclein result
    and the electron-microscopic vesicle counts come only from the mouse arm, while
    both human lines overexpress a tagged construct and were exposed at 100
    micromolar against 20 and 50 in the neurons. The PC12 partner in the MO3.13
    co-culture is a rat line and was correct as written.

    The proposed experiment paf_dopal_loop_in_ipsc_sympathetic_neurons was added to
    the existing paf_what_initiates_aggregation knowledge gap. Its model system is
    human iPSC-derived postganglionic sympathetic neurons (PMID:32822546,
    PMID:30702809), which secrete norepinephrine on activation and so can report
    the function PAF loses; aldehyde dehydrogenase inhibition raises DOPAL
    endogenously rather than by addition. A patient-derived line is explicitly not
    the design, because PAF is sporadic with no causal gene, so an unselected
    patient line carries no lesion to express - which is why the protocol's
    established disease use is a Mendelian autonomic disorder.

    A search for a PAF-specific NAM found none: no patient iPSC line, fibroblast
    model, organoid or organ-chip for this disease is reported. That absence is why
    the two realized systems are graded MODERATE and LOW rather than higher, and
    why the third system is recorded as a proposal.

    Validated with just validate (222 snippets, 220 titles, 0 issues),
    validate-terms, and the per-file gates for entity refs, causal targets, enum
    values, duplicate keys, block-scalar comments, coarse phenotypes, qualifier
    terms and delivery system. The whole-tree snippet-grading, reference-title,
    title-snippet, snippet-length, folded-hyphen, retired-support-prose,
    environmental-evidence and shared-disease-term gates pass, as does
    check-term-cache-integrity. just model-scale-audit reports 6 model-to-mechanism
    links, all scale-determined, with no upward extrapolation and typed divergences
    on every one. The causal graph builds with 65 nodes, 71 edges, no orphan
    targets and no integrity issues; the 4 new links appear as 3 edges because a
    model system inside a proposed experiment is deliberately not back-linked.

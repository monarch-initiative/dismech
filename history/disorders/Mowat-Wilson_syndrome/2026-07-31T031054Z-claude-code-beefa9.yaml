  summary: Add monosomy 2q22 etiological subtype to Mowat-Wilson syndrome
  details: |
    Augmented the existing Mowat-Wilson syndrome entry with the monosomy 2q22 etiological subtype (MONDO:0016855, Orphanet:261537), the contiguous-gene-deletion form in which the entire ZEB2 locus is deleted rather than altered in situ. Curated as a subtype rather than a standalone Disease because MONDO models it as is_a MONDO:0009341 and it converges on the same ZEB2 haploinsufficiency mechanism, differing in lesion class and in the copy-number diagnostic modality needed to detect it. Added a has_subtypes block bound to MONDO:0016855 with subtype-scoped genes, inheritance and evidence; a new pathophysiology node '2q22 contiguous-gene deletion removing ZEB2' (biological_scale MOLECULAR) with a DIRECT downstream edge into the existing ZEB2 haploinsufficiency node; a subtype-scoped genetic record (relationship_type CAUSATIVE, variant_origin DE_NOVO); and a diagnosis record for chromosomal microarray testing (MAXO:0001612). Deep research: a falcon (Edison) run was completed for this session alongside the pre-existing asta report. Falcon corroborated the contiguous-gene framing and the necessity of copy-number testing, but its genotype-phenotype citation (Zou 2020, DOI:10.3892/etm.2020.9393) was checked against the cached abstract and found to describe only truncating point variants with no deletion cases, so it was excluded from all deletion-specific claims. NEC preflight passed: MONDO:0009341 causal gene ZEB2/HGNC:14881, OMIM:235730 and Orphanet:2152 were confirmed via OAK before any research output was used. GeneReviews baseline PMID:20301585 was fetched and used. Validation: just validate (schema plus term validation) passed, and all 33 evidence snippets in the file were independently verified as exact whitespace-normalized substrings of their cached abstracts.

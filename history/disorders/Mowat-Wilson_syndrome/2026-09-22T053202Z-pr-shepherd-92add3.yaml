  details: |
    PR-shepherd repair round addressing the three carried-forward review findings on PR #7293.

    CRITICAL: diagnosis[1].diagnosis_term.term was MAXO:0001612, which no longer validates - MAXO was removed from dismech and diagnosis_term is bound to the NCIT-rooted TreatmentActionTerm dynamic enum. Reproduced the failure with 'just validate-terms' on this HEAD, then rebound to NCIT:C18477 (Microarray Analysis), which is present in cache/enums/treatmentactionterm_b7dcb86faf99.csv so it validates offline, and is the existing repo-wide convention for this diagnostic (Cri-du-Chat_Syndrome, Wolf-Hirschhorn_Syndrome, MED13L_Syndrome, Chung-Jansen_Syndrome and others all pair it with preferred_term 'chromosomal microarray testing'). preferred_term is unchanged, so the curated specificity is retained per the Ontology Term Contract.

    IMPORTANT 1: the has_subtypes description claimed deletion patients show the recognizable Mowat-Wilson phenotype rather than a distinct syndrome - the load-bearing justification for the subtype-not-standalone call - with no evidence item behind it. Added a subtype-level evidence item citing PMID:16053902, already cited elsewhere in the entry and already cached, quoting the sentence that puts deletions and truncating variants on the same phenotypic footing. Verified as an exact whitespace-normalized substring of references_cache/PMID_16053902.md.

    IMPORTANT 2: added case_fractions to the subtype-scoped genetic record 'ZEB2 whole-gene deletion at 2q22', recording the 21 percent (six of 28) exonic-deletion share from the Polish cohort in PMID:33982229, whose full text this PR already commits. cohort_size 28 and a notes field record the ascertainment caveat (MLPA alongside sequencing; one further patient carried a large 2q22.3q23.3 deletion found by array-CGH). Snippet verified as an exact whitespace-normalized substring of the cached full text; clean spans were chosen to avoid the PDF hyphenation artifacts and the non-breaking space in '8 Mb' noted by the reviewer.

    The prior history record for this entry (2026-07-31T031054Z-claude-code-beefa9) still names MAXO:0001612 in its details prose. History records are append-only and that record accurately describes the session as it ran, so it was not rewritten; this record supersedes that detail. Only links.prs was filled in on it, which is metadata about which PR carries the record rather than a change to the session account.

    Validation: just validate, just validate-terms, just count-verified-snippets, just check-duplicate-keys, just check-entity-refs and just check-causal-targets were all run on the changed file.

  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review against all five cited references. All five are abstract-only in the cache, and the defining report (PMID:36662884) was already mined close to exhaustively - most of that abstract's substantive sentences were already curated. The gaps here were therefore structural rather than a matter of unread source content.

    FIDELITY FIXES (overreach), two of them:

    (1) Onset. Two phenotypes carried onset_category: INFANTILE, one with the note "Very early onset, often within the first year of life", and the top-level description said patients "present in early childhood". No cited abstract states any age of onset. PMID:36662884 describes seven patients from six families without ages; PMID:40274250 says only "pediatric case". Softened both to CHILDHOOD, rewrote the description, and recorded in the onset notes what the sources do and do not establish, with a pointer that this should be revised if the full text of PMID:36662884 gives onset ages.

    (2) Immunoglobulin replacement notes asserted "One reported IMD131 proband received IVIG (PMID:36662884 cohort / associated case reports)". Neither cached abstract mentions immunoglobulin replacement, and "associated case reports" cites nothing checkable. Claim removed and the removal recorded in place. What the literature does support was added instead, as PARTIAL: conventional therapy failed in the one published transplanted case.

    DISCONNECTED MODEL - the main structural gap. The Irf4 T95R knock-in mouse had no modeled_mechanisms, so per the repository's own rule it rendered but reached no mechanism node. Added a ModelMechanismLink to "Agammaglobulinemia (Absent Antibody Production)": RECAPITULATES, fidelity MODERATE, with an explicit limitations field noting that the abstract reports only the antibody-production defect and says nothing about whether the mouse reproduces the opportunistic-infection susceptibility or the TH17/TFH deficits. One ExperimentalReadout (serum antibody production at steady state and after immunization, DECREASED) with its own evidence, plus link-level evidence, keeping the two evidence layers distinct. Added a name field so the model has a stable pathograph label rather than falling back on genotype-plus-species.

    NEW SECTIONS: progression (2 phases - the paediatric presenting syndrome with its laboratory picture; then failure of conventional therapy followed by immune reconstitution and complete resolution of gastrointestinal symptoms after reduced-toxicity unrelated-donor HSCT) and clinical_burden (HIGH, with the rationale stating openly that it rests on the severity of the documented immunological defect rather than on cohort mortality data, which do not exist for a disorder with seven published patients).

    MECHANISM EVIDENCE. The T95R node cited the structural paper's binding-affinity sentence but not the defining paper's own hypermorph statement, nor the crystal structures that are the structural paper's actual result. Both added.

    DIFFERENTIAL DIAGNOSES. The IRF4 F359L entry had one evidence item and two distinguishing features. Added the naive-versus-terminal-effector T-cell dissociation (low naive CD4/CD8 alongside high terminal effector CD4/CD8) and the finding that F359L still binds canonical IRF4 motifs normally and fails only at ISREs - which is the precise mechanistic contrast with a DNA-binding-domain variant and was stated only as prose before.

    PHENOTYPES. Added Abdominal pain (HP:0002027), the one presenting feature in the PMID:40274250 sentence that was quoted three times for its other three features and left uncurated.

    Validation: schema pass, terms pass, entity-refs pass, duplicate-keys pass. Snippets 32 -> 43 verified individually; 264/264 in the batched three-file sweep. classifications.iuis_category untouched, including its note that IMD131 postdates the IUIS 2022 tables.

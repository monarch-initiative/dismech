  summary: 'Create: Immunodeficiency 131 IRF4 T95R combined immunodeficiency'
  details: |
    Created de-novo entry for Immunodeficiency 131 [IMD131; MONDO:0976229, OMIM:621097], the IRF4 p.T95R multimorphic autosomal dominant combined immunodeficiency. Driving reference PMID:36662884 [IRF4 International Consortium, Sci Immunol 2023] anchors the genetics, multimorphic DNA-binding mechanism, dysregulated transcriptional program, B-cell/T-cell defects, combined-immunodeficiency phenotype, and mouse knock-in. Supporting refs: PMID:37683642 crystal-structure/DNA-binding basis IN_VITRO; PMID:40274250 allo-HSCT case adding treatment and clinical phenotypes; PMID:41424747 and PMID:36917008 IRF4 haploinsufficiency/Whipple R25S and F359L neomorphic allelic disorders, added as differentials to avoid conflation. NEC preflight confirmed MONDO parent is IRF4-related immune disorder, gene IRF4. Deep research provider: falcon/Edison, 659s run, confirmed T95R-centered identity and surfaced the F359L/R98W allelic disorders. No GeneReviews article exists for IRF4. Validated with just validate: schema, terms, and references all pass; compliance 90.2 percent.

  summary: 'Create: Multiple_Mitochondrial_Dysfunctions_Syndrome_7'
  details: |
    New entry for MMDS7 (GCSH, MONDO:0957382), resolving the deferral recorded in PR #15787 about whether GCSH needs its own entry. It is curated as a separate disease in line with MMDS1, 2, 4, 5, 6 and 9B; GCSH stays in the Nonketotic_Hyperglycinemia mechanism graph unchanged.

    Sources: the two published GCSH case series (PMID:36190515, six patients with functional studies; PMID:33890291, three patients with the start-loss c.1A>G), the NKH GeneReviews chapter (PMID:20301531, tagged as the closest baseline because no GCSH-specific chapter exists), the human lipoyl-relay biochemistry paper (PMID:29987032), the Gcsh null mouse (PMID:33569080), Kure 2002 on transient neonatal hyperglycinemia in heterozygous carriers (PMID:12402263), and the ClinGen Definitive AR assertion (CGGV:assertion_d360db9d...). The pathograph has two branches from H-protein deficiency: glycine cleavage deficiency leading to glycine accumulation, then seizure, coma and apnea; and E2 under-lipoylation leading to PDH/2-KGDH deficiency, then dystonia, lactic acidosis and developmental delay.

    Deep research: antigravity (gemini-4-carbon-medium), research/Multiple_Mitochondrial_Dysfunctions_Syndrome_7-deep-research-antigravity.md. 19/19 references resolved; just preflight-dr PASS (GCSH named 92 times). Not used from the report: PMID:30042211, which the report cites 13 times as 'Cao et al., 2018' on the H-protein lipoyl relay but which is an unrelated birth-weight/cardiovascular paper (the real Cao 2018 is PMID:29987032); the two PMC references flagged off topic (PMC5776853, PMC3225883); PMID:35298263 (Tsvetkov 2022), which only lists GCSH among lipoylated proteins; and the report's ketogenic-diet recommendation, which neither GCSH series makes. The report also never cites PMID:33890291.

    Self-review before the PR: an independent agent read the entry against the cached papers. Changes from it: PDH-node and edge evidence now quotes the measured PDH activity and reserve capacity, and the 2-KGDH half is stated as lipoylation only; the GCS edge gained the patient liver GCS activity; edges from glycine accumulation (coma, apnea, developmental delay) carry the PMID:33890291 background sentence, marked INDIRECT; the lactic acidosis edge quote was replaced with one that names lactate; LIAS and LIPT1 distinguishing features were cut back to what is sourced, with PMID:28757203 added for LIPT1 sparing the GCS; a second p.His57Arg item quotes the lipoyl-transfer defect; benzoate evidence now quotes the GeneReviews management sentence, and the valproate/vigabatrin warning moved to that treatment's notes; the lipoylated-protein biomarker is no longer bound to free lipoic acid; quote_role BACKGROUND was set on introduction sentences; and eight phenotypes were added (myoclonic seizure, developmental regression, microcephaly, thin corpus callosum, NKH-type diffusion restriction, Leigh-like basal ganglia lesions, thalamic lesion, reduced caudate volume). Ataxia and tremor, which the deep-research report mentions, were not added because no cached source states them.

    Validation, after those changes: just validate-disorders passed (schema, terms, 89/89 snippets, 0 issues); check-entity-refs, check-causal-targets, check-genereviews (TAGGED), check-snippet-grading, check-snippet-length and check-name-collisions passed, and the whole-repo gates (snippet length, title snippets, reference titles, folded hyphens, shared disease terms, retired support prose, environmental evidence, gene validity, cache order) passed on the earlier draft. fetch-reference rewrote three already-committed caches (PMID_20301531, PMID_35298263, PMID_36190515); they were restored from git and not committed, and five snippets were re-matched to the committed text of PMID:36190515.

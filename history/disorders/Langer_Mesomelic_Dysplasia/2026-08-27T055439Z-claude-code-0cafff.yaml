  summary: Wire the pathograph, add the 2025 splice-variant family and Madelung deformity
  details: |
    Final-pass review. Phenotype causal-inlink went from 0/8 to 7/9: the terminal mesomelic-shortening node now names the limb and stature phenotypes it explains, and a SHOX gene descriptor was added to the molecular node so the gene wires into the mechanism graph. Micrognathia and conductive hearing loss are deliberately left unwired and the entry notes now say why: SHOX has no described expression domain in the mandible or middle ear, and the hearing-loss report comes from one consanguineous cohort whose own authors could not separate a real manifestation from coincidence. Added Madelung deformity as an OCCASIONAL phenotype with PARTIAL evidence, since the source explicitly says it may be severe, mild or absent here, unlike in Leri-Weill where it is the diagnostic sign. Added PMID:41042407, a family in which one splice-donor variant produces LMD when homozygous and idiopathic short stature when heterozygous with perfect co-segregation, which is the cleanest available demonstration that the LMD/ISS distinction is dosage.

  summary: 'Create: Langer Mesomelic Dysplasia'
  details: |
    De-novo curation of Langer mesomelic dysplasia, row NOS 15-0020 of ISDS Nosology 2023 group 15, the biallelic counterpart of the Leri-Weill entry already in the KB. The pathograph separates three claims that are usually collapsed: complete loss of SHOX protein, loss of its downstream chondrogenic target program (NPPB induction, SOX5/SOX6 aggrecan regulation, FGFR3 repression), and the zeugopod-restricted SHOX expression domain that explains why the phenotype is mesomelic rather than global. Growth-plate histology is cited from LMD fetal specimens rather than transferred from Leri-Weill. The growth-hormone treatment section carries REFUTE evidence: the only reported LMD treatment experience showed an IGF-1 response with no height-velocity response, against a licensed indication established entirely in heterozygous patients. Two KNOWLEDGE_GAP discussions (GH efficacy in complete SHOX deficiency, prenatal ultrasound operating characteristics) and one HUMAN_MODEL_MISMATCH discussion recording that rodents lost SHOX entirely, so no knockout model of this gene exists. All 33 evidence snippets verified against the reference cache; schema, term and reference validation pass.

  summary: Reviewed and enhanced Stromme syndrome entry with disease classifications, biochemical CENP-F
    fibroblast expression readout, differential diagnoses, and causal edge evidence on key ciliopathy-driven
    congenital malformations.
  details: 'Added classifications block assigning GENETICS_ENVIRONMENT_DISEASE (Harrison''s chapter) and
    ciliopathy (mechanistic category) backed by PMID:26820108 (with quote_role: BACKGROUND on the introduction
    citation) and PMID:25564561. Populated biochemical section with Fibroblast CENP-F protein expression
    (DECREASED in CL:0000057 fibroblast) and a READOUT_OF link to Biallelic CENPF dysfunction based on
    Western blot data from an isolated MCPH patient''s fibroblasts and the proposed dosage hypothesis
    (PMID:25564561). Added differential_diagnoses covering Feingold syndrome (MONDO:0015267), Axenfeld-Rieger
    syndrome (MONDO:0019187), autosomal recessive primary microcephaly (MONDO:0016660), and Meckel syndrome
    (MONDO:0018921). Enriched downstream edges from Defective CENPF-dependent IFT88 ciliary targeting
    to Duodenal atresia, Intestinal malrotation, and Cleft palate with qualified descriptions and verbatim
    reference snippets.'

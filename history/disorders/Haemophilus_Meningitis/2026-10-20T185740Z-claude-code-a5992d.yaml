  summary: 'Round-1 review fixes: antibiotics, vaccine, prophylaxis, phenotypes, wiring,
    node split, regrades'
  details: |
    Addressed the seven blocking review items. (1) Added a third-generation cephalosporin treatment (ceftriaxone CHEBI:29007, cefotaxime CHEBI:204928; PMID:19375903) targeting bacteremia and meningeal seeding. (2) Added Hib PRP-protein conjugate vaccination (VACCINE modality, NCIT:C15346; PMID:33247582) targeting PRP Capsule Immune Evasion, and rifampin chemoprophylaxis (rifampicin CHEBI:28077; PMID:3485275) targeting nasopharyngeal acquisition. (3) Added six phenotypes from the already-cached PMID:9570646 - vomiting 29%, poor feeding 19%, lethargy 14%, subdural effusion 23% (term omitted, no HP match), motor deficit 30% (HP:0004302), developmental delay 9% (HP:0001263) - and corrected the fever band FREQUENT to VERY_FREQUENT (86%). (4) Regraded the four colonization-sentence evidence items from IN_VITRO to HUMAN_CLINICAL+BACKGROUND (the quote describes human carriage and clinical disease); genuine in-vitro choroid-plexus results left IN_VITRO. (5) Replaced the bacteremia node's misplaced PRP-capsule snippet with a bacteremia->CNS dissemination snippet (PMID:10470555); the PRP snippet stays correctly on the PRP Capsule node, which already carried it. (6) Wired the pathograph to its phenotypes (bacteremia->fever, meningeal inflammation->vomiting/poor feeding/lethargy/seizure/subdural effusion, BBB breakdown->hearing loss/hydrocephalus/motor deficit/developmental delay) so list-disconnected-phenotypes is now 10/10; split the bundled LOS-TNF node into a cytokine-release node and a neutrophilic-inflammation node (the rabbit model separates TNF at 45 min from WBC influx at 75 min) and removed the unsupported macrophage cell type, retargeting the Meningeal Seeding downstream edge and the dexamethasone treatment onto the cytokine node. (7) Added a progression block (colonization, bacteremia, meningitis, sequelae), clearing NO_PROGRESSION. Also moved the deep-research session log out of notes into this record: the Falcon request fell back to OpenScientist, all 49 references resolved, four generated epidemiology/vaccine quotes were non-exact and not curated, and preflight-dr skipped gene-identity checks (no RO:0004003 gene on MONDO:0000889). validate, validate-terms, validate-disorders (LRV, 31/31) and the connectivity/grading gates all pass. Deferred the optional diagnosis and prevalence sections, which need Hib-specific sources not yet cached.

  summary: 'Create: KY-related Neuromyopathy'
  details: |
    De novo curation of KY-related neuromyopathy (MONDO:1010194) from a Perplexity deep-research report (research/KY-related_Neuromyopathy-deep-research-perplexity.md; 5/5 refs verified, confabulation 0.0, preflight-dr PASS with KY mentioned 256x). Gene-defined KY disease spanning three presentations (MFM7/congenital myopathy and hereditary spastic paraplegia) curated as has_subtypes. Mechanism chain: KY loss of function (filamin binding, GO:0031005) -> Z-disc protein mislocalization/myofibrillar disorganization -> impaired filamin C turnover (CASA), deficient muscle hypertrophy, NMJ maturation defect -> lower-limb weakness, foot deformities, contractures, spastic paraplegia. Evidence from PMID:27485408 (index), PMID:28488683 (HSP kindred), PMID:35752288 (spectrum), PMID:11136708 (ky mouse), PMID:29914939 (CASA/BAG3 models). MONDO:0014922 (MFM7) deliberately not re-bound to avoid shared disease_term collision with the Myofibrillar_Myopathy grouping entry (see notes); PR #14853 had left this stub for curation. KY molecular node binds filamin binding, not peptidase activity, since catalytic activity is undemonstrated. All terms verified via runoak/OLS. Review round 2 (PR #16678): fixed the CASA node (now 'Impaired Chaperone-Assisted Selective Autophagy', aggrephagy GO:0035973 DECREASED, citing PMID:42696787 reduced autophagic flux and PMID:29914939 compensatory factor upregulation, wired KY LoF -> CASA -> Z-disc); moved the spastic-paraplegia edge off the NMJ node to a new hypothetical 'KY Deficiency in CNS Motor Pathways' node under an EMERGING mechanistic_hypotheses group; rebound Talipes equinovarus to PMID:41223033/PMID:30591934 (equinus -> equinovarus fix); bound MONDO:0044648 to the HSP subtype and folded MONDO:0044647 into the MFM7 row with a note; added a diagnosis section (WES, muscle biopsy) and elevated-CK, myopathic-EMG, calf-atrophy and fiber-size-variability phenotypes; cited PMID:42696787 (catalytic triad dispensable) and PMID:41223033 (reduced protein abundance, histology). 38/38 snippets verified across 8 PMIDs. No current GeneReviews chapter (only a retired MFM overview).

  summary: 'Review round 1: evidence regrading, biochemical section, prevalence normalization'
  details: |
    Response to the automated review on PR #10510 (four blocking items, six suggestions). All four blocking items addressed; five of six suggestions taken.

    1. The mouse aggregation readout asserted direction: DECREASED while quoting the methods sentence describing how the mice were built. Verified the reviewer's claim: the results sentence is in the cache. Swapped. The methods sentence was not discarded - it moved to the link-level evidence, where a statement about how the model was constructed is what belongs.

    2. The link evidence quoting the paper's framing statement about low-dose aspirin in people was graded MODEL_ORGANISM. Regraded OTHER with directness: INDIRECT. evidence_source classifies the study behind the quoted sentence, and that sentence is about human pharmacology, not the mouse work.

    3. Added a biochemical: block for arachidonate-stimulated platelet thromboxane B2, with a DIAGNOSTIC readout on the thromboxane node and a reference_ranges entry carrying the 49-81 ng/3x10^8 platelet interval. The interval is explicitly annotated as a single 1996 laboratory's range rather than a consensus interval, because assay methods have changed. Urinary 11-dehydro-thromboxane B2 is named in block notes as the other confirmation route and explicitly not curated, since no cached reference states it for this disorder.

    4. HP:0002584 gastrointestinal haemorrhage and HP:0005261 joint haemorrhage were not added. Checked all ten cached references: neither finding appears in any of them, so both would be uncitable. Argued out in notes with a second, independent reason for haemarthrosis specifically - joint bleeding is the signature of a coagulation-factor deficiency, and curating it in a disorder whose mechanism is failure of primary rather than secondary haemostasis would assert something this entry's own pathograph contradicts.

    Suggestions taken: two PMID:33326144 background sentences regraded IN_VITRO to OTHER; rate_per_100000: 600.0 dropped and prevalence_class set to UNKNOWN, because normalizing a referral-cohort yield would be read downstream as a population prevalence and is wrong by orders of magnitude; the genetic_context block now states explicitly that its zygosity and functional-impact values describe the modal dominant allele class and not the recessive p.Trp322Ser allele cited in the same node; megakaryocyte CL:0000556 added to the COX-1 deficiency node; recombinant activated factor VIIa added as a treatment, flagged as the least directly supported of the four since its trial evidence is from Glanzmann thrombasthenia.

    Not taken: congenital onset (HP:0003577). No cached reference states onset for this disorder; the HPO annotation is an annotation record, which is the same reason items in point 4 were declined.

    Validation: 43/43 snippets verified, up from 39. validate-disorders, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading all pass.

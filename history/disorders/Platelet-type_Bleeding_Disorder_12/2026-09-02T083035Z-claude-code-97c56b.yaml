  summary: 'Create: Platelet-type Bleeding Disorder 12 (MONDO:0011588, PTGS1)'
  details: |
    De-novo curation of BDPLT12 (MONDO:0011588), platelet cyclooxygenase-1 deficiency, the aspirin-like defect.

    Deep research: one openscientist run (research/Platelet-type_Bleeding_Disorder_12-deep-research-openscientist.md). The run itself exited non-zero: after the report was produced, term validation hit a 5-second read timeout resolving MeSH:C567786 against EBI OLS and aborted the recipe. The report survived and both validations were retrofitted in place (just validate-research-reference, then just validate-research-terms, which succeeded on retry). Reference validation: 10/10 resolved, 9 on topic. Term validation flagged one label mismatch, a column header rather than a binding. just preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0011588; the manual fallback was applied and passes (OMIM 605735 matches, PTGS1 is the top gene at 31 mentions).

    Module conformance: this entry conforms to primary_hemostatic_plug_failure at the activation-and-secretion arm, which that module's own description assigns to cyclooxygenase-1 defects, plus the central plug-formation node and the mucocutaneous bleeding output. It deliberately does not attach at the aggregation arm despite abnormal aggregometry being the diagnostic hallmark, which is the mistake the module warns against.

    Mechanism: the chain is anchored on the 1996 enzymology rather than on genetics, because that is where the evidence is strongest. The bypass experiment (arachidonate-induced aggregation and thromboxane defective, exogenous PGH2-induced aggregation and thromboxane normal) localises the block to the COX-1 step and is curated as three evidence items on the node it establishes. The two enzyme defect types (absent protein, versus normal protein with impaired catalytic activity) are curated as two routes described within one node rather than as separate entries.

    Deliberate omissions: no phenotype frequency, because the one quantified figure (bleeding in 25/34) comes from an aggregometry-defined referral cohort with relatives added by family testing. The 0.6% figure is curated as a POINT_PREVALENCE with rate_per_100000 600.0 and its population stated as the paediatric referral group, not the general population. Three mucocutaneous phenotypes are graded directness: INDIRECT because the cohort study reports bleeding in aggregate without itemising it in the cached text.

    Validation: just validate-disorders, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all pass. 39/39 snippets verified against cached references.

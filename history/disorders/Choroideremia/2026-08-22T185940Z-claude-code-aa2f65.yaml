  summary: 'Create: Choroideremia'
  details: |
    New entry for CHM/REP1 choroideremia. Four pathophysiology nodes from REP1 deficiency through defective Rab prenylation and vesicle trafficking to chorioretinal degeneration and centripetal field loss. The entry deliberately preserves rather than resolves the unsettled question of which of the three affected tissues is the primary site, and records it as a KNOWLEDGE_GAP because it determines what a gene therapy vector must transduce. The phase 3 timrepigene emparvovec trial is recorded as having failed its primary endpoint, marked PARTIAL rather than presented as an available therapy. Natural history is anchored on the individual-level meta-analysis showing exponential decline of residual RPE area over roughly six decades. The initially guessed MONDO id was wrong and was caught by term validation; corrected to MONDO:0010557. Validated: linkml-validate clean, term validation passed, 14 of 14 snippets verified against cached references.

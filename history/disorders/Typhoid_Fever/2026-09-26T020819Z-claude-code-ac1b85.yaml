  summary: 'Review round: split hepatosplenomegaly, fix measure_type, drop GO necrosis
    binding, remove updated_date'
  details: |
    Addressed the four blocking findings on PR 12757. (1) Split the Hepatosplenomegaly phenotype (HP:0001433, which asserts both organs in one patient) into Hepatomegaly (HP:0002240, 30.1%) and Splenomegaly (HP:0001744, 22.3%), both backed by the same source sentence, and split the upstream downstream edge to target both. (2) Corrected the prevalence measure_type from POINT_PREVALENCE to ANNUAL_INCIDENCE (the notes already said the 14.3M figure is modeled annual incidence, not a point prevalence) and added rate_denominator: POPULATION_PER_YEAR. (3) Dropped the GO:0097300 programmed-necrotic-cell-death binding on the ileal ulceration node: the source describes inflammation and necrosis of Peyer's patches, not a regulated cell-death program, and the node's evidence never mentions necrosis. (4) Removed the deprecated updated_date field.

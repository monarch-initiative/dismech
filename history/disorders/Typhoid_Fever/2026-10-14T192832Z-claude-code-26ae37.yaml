  summary: 'Reversal: bind Salmonella sp culture plus S. Typhi agglutination identification'
  details: |
    Coordinator review: the batch-23 rejection of this entry assumed the row described one test. Re-reading it: 'Blood culture with organism identification confirms S. Typhi bacteremia and distinguishes typhoid from paratyphoid' names two workflow steps -- culture, then species identification on the recovered isolate -- and the second step is what does the distinguishing. Reversed the rejection: added diagnosis_term (NCIT:C25300) and two measurements -- LOINC:17563-8 (Salmonella sp identified in Specimen by Organism specific culture, the culture step, genus-level since growth itself needs no species call) and LOINC:53956-9 (Salmonella typhi [Identifier] in Isolate by Agglutination, the identification step operating on the isolate the culture produces, and the code that actually establishes species identity). Together the two codes say what the row says; the earlier concern that a genus-level code alone would contradict the row's species-distinguishing claim is resolved by the second code, not worked around by a caveat. New cache/loinc/terms.csv row for 53956-9 (17563-8 was already cached on this branch from Invasive_Non-Typhoidal_Salmonellosis), confirmed absent from origin/main and checked against every open loinc-*-batch* branch for a seeding collision -- none found.

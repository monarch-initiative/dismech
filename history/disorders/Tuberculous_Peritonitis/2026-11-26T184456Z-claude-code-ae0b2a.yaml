  summary: 'Create: Tuberculous_Peritonitis'
  details: |
    New entry for tuberculous peritonitis (MONDO:0006000), seeded from research/Tuberculous_Peritonitis-deep-research-claude_code.md (claude_code provider; preflight-dr SKIP because MONDO records no causal gene) and PubMed searches. Every snippet was re-read in the cached reference. Tuberculous ascites (MONDO:0023153) was judged to be the wet-ascitic type of tuberculous peritonitis, from its MONDO definition and the cited reviews, so it is recorded as a has_subtypes row with that term, and stubs/Tuberculous_Ascites.yaml was deleted with stubs/Tuberculous_Peritonitis.yaml. The fibrotic-fixed and dry plastic types are unbound subtype rows. Six-node causal chain from primary pulmonary infection to granulomatous peritoneal inflammation (conforms to granuloma_formation Organized Granuloma Assembly), lymphocytic exudative ascites, and fibrosis/adhesions (conforms to Tissue Containment versus Destruction and Fibrosis). Risk factors: cirrhosis, peritoneal dialysis, HIV, diabetes, TNF inhibitors and corticosteroids. Diagnosis covers ascitic fluid analysis, SAAG, ascitic ADA with pooled meta-analyses and cut-offs, interferon-gamma, smear/culture, laparoscopy with peritoneal biopsy as reference standard, CA-125 and ovarian carcinoma mimicry, and CT. Treatments: standard antituberculous chemotherapy, adjunctive corticosteroids (unproven), surgery for complications, PD catheter management. Validated with just validate, validate-terms and count-verified-snippets.

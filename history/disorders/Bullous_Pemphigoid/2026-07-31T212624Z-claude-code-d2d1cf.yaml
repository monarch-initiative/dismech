  summary: 'Edit: Bullous_Pemphigoid - clear non-blocking review suggestions'
  details: |
    Cleared the four remaining non-blocking suggestions from the ai4c-reviewer approval on PR #7437.

    Corticosteroid therapeutic_agent: the reviewer was right and my earlier note was wrong. I had recorded CHEBI:50858 as failing ChemicalEntityTerm reachability, but it is in the enum cache and already used as a therapeutic_agent in at least five other entries. The error came from my OAK 'ancestors -p i' reachability probe, which I had already found unreliable for NCIT in the previous round and should not have trusted for CHEBI either. Binding added.

    Prevalence class: the worldwide record set BAND_1_9_PER_1000000 (0.1-0.9 per 100,000) while carrying rate_high 4.28, which is internally contradictory and would make BP look an order of magnitude rarer to any consumer filtering on the class. Rather than pick a band by judgement, applied the KB's canonical rule - _band_from_rate in scripts/migrate_prevalence.py, evaluated at the range midpoint (2.27 per 100,000) as scripts/resolve_bare_prevalence.py does for ranges - which yields BAND_1_9_PER_100000. That is self-consistent with rate_high and with the Sweden record.

    Diagnosis assay specificity: adopted the Giardiasis qualifiers pattern the reviewer pointed to. diagnosis_term.term stays NCIT:C18020 (the only value reachable from the TreatmentActionTerm root), with a qualifiers block carrying the specific assay in qualifiers.value - NCIT:C17370 Fluorescent Antibody Procedure for DIF and NCIT:C16553 ELISA for the BP180-NC16A assay. Confirmed by term validation that qualifiers.value is not bound to TreatmentActionTerm, so the specific terms validate there. This recovers the machine-readable specificity that was lost when those terms failed as primary bindings.

    target_mechanisms evidence: the rituximab B-cell-depletion and omalizumab IgE-neutralization mechanism claims were unsourced. Both now carry evidence, deliberately as PARTIAL: the primer establishes both drugs as accepted BP biologics but does not state their mechanisms, and the mast cell review explicitly notes the pathogenic role of mast cells has been questioned. Overstating these as SUPPORT would repeat the claim-evidence mismatch this PR exists to fix.

    Also removed the stub references block (a single entry with empty findings).

    Not actioned: the reviewer's provenance nits (#5) need no change - the incidence figures are quoted from PMID:42206441's introduction which attributes them to its own references, and both prodrome phenotypes share a composite denominator; both caveats are already recorded in the relevant notes fields.

    Branch refreshed against origin/main (11 commits behind, clean merge, no conflicts) per suggestion #6.

    Validation: schema, terms, references, enum-cache integrity all pass. Snippets 38/38 (up from 36). Compliance 90.1 to 92.6 percent global, 90.7 to 93.3 weighted.

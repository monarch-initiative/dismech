  summary: 'Review: Bullous Pemphigoid evidence re-read against cached sources'
  details: |
    Re-read all 7 cached references and re-verified all 39 evidence items against
    references_cache/. Every snippet is an exact substring of its cache; no fabricated
    quote, no missing cache, and no Named Entity Confusion (all quotes concern BP even
    in PMID:29545809, which also discusses MS/RA/EBA).

    Fixed in this pass:
    - pathophysiology "Complement Activation and Inflammatory Cell Recruitment": the mast
      cell mediator item cited PMID:29545809 for a sentence reporting human lesional skin
      and blister fluid, but was graded MODEL_ORGANISM while its own explanation said
      "human". The identical quote was graded HUMAN_CLINICAL at
      treatments[3].target_mechanisms[0]. Regraded to HUMAN_CLINICAL. The matching
      row in tests/snippet_grading_baseline.txt is now stale, since it grandfathers
      a divergence that no longer exists, but it was deliberately left in place:
      this is a curation-scope PR, and CI blocks a PR touching kb/ from also
      modifying tests/. The stale row is inert, because check_snippet_grading
      reports only new divergences, so it should be dropped by a separate infra
      change rather than by widening this PR.
    - phenotypes "Mucosal Involvement": notes claimed the cited 10-20% range "maps to
      OCCASIONAL (29-5%) at its lower end and slightly exceeds it at the upper end".
      OCCASIONAL is 5-29%, so 10-20% falls entirely inside it. Corrected.

    Recorded, not fixed:
    - phenotypes "Increased Eosinophil Count" (HP:0001880, a blood count) is evidenced by
      a quote reporting eosinophil granule proteins in skin biopsies; nothing cited
      measures a peripheral count. Either re-anchor to the tissue infiltrate (PMID:29545809
      states it directly) or cite a source reporting blood eosinophilia.
    - pathophysiology "Anti-Hemidesmosomal Autoantibody Formation": the NC16A
      immunodominance claim is evidenced by a methods sentence (which regions were
      screened in 13 sera), not a result. PMID:29545809 states the claim outright.
    - diagnosis "BP180 NC16A Serology": "Titres correlate with disease activity" is
      uncited; the quoted r=0.72 is an assay-vs-assay correlation, not titre-vs-activity.
    - The lamina lucida cleavage plane and non-scarring healing are asserted in three
      places but no cited source goes beyond "subepidermal".

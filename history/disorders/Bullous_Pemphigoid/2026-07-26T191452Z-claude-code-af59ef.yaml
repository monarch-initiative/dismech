  summary: 'Create: Bullous_Pemphigoid'
  details: |
    Created the Bullous Pemphigoid entry, identified as a notable KB gap: BP is the most common autoimmune blistering disease yet had zero mentions anywhere in kb/, while the rarer pemphigus vulgaris was already curated. Preflight checked all three duplicate surfaces (origin/main KB, all PRs, all issues) - no existing entry, PR or issue. MONDO:0019082 confirmed as the human term; note MONDO:0005685 is obsolete and MONDO:1010137/1010769/1010770/1010771 are non-human-animal terms.

    Deep research (skill Step 3) could not be completed: all four providers failed for environmental reasons - claude_code produced a degenerate 1-turn, zero-citation report because agentapi is missing from PATH; asta returned an upstream 500; falcon returned HTTP 402 (Edison credits exhausted); openscientist remained queued. The failed claude_code artifact was deleted rather than committed. Curation therefore proceeded on direct PubMed E-utilities grounding, with every claim verified against a fetched abstract or full text.

    Modelled the four-step mechanism: anti-hemidesmosomal autoantibody formation (BP180/COL17A1 and BP230/DST, NC16A immunodominant epitope) to classical complement activation with mast cell degranulation and granulocyte recruitment, to proteolytic degradation of the dermal-epidermal junction by neutrophil proteinases plus eosinophil granule proteins EDN/ECP, to subepidermal blister formation. Deliberately framed as the mechanistic counterpoint to pemphigus vulgaris: the split is subepidermal and above the lamina densa, so BP heals without scarring - the same distinction that showed the PV entry's Orphanet-derived frequent-scarring annotation to be wrong in the preceding review pass.

    Evidence discipline: 7 distinct references, 25 evidence items, all snippets verified verbatim both by linkml-reference-validator and by an independent substring check. Of the PMIDs recalled from memory before verification, two of three were wrong (11832525 is a pacemaker image, 23260147 an iPS-cell paper) - only the BLISTER trial PMID was correct, which is why all identifiers were re-derived from PubMed search. Frequency bands asserted only where a source quantifies them: pruritus VERY_FREQUENT from 'in almost all patients', mucosal involvement OCCASIONAL from '10-20%'. Tense bullae carries no band because the primer gives no rate. Prevalence records the rising-incidence trend only, with prevalence_class UNKNOWN, because no numeric incidence was quotable.

    Deliberately not curated: drug-induced BP (gliptins, checkpoint inhibitors) is recorded as a CURATION_TODO discussion rather than asserted, because the candidate reference PMID:41747673 is indexed without an abstract and no quotable excerpt exists. The neurological comorbidity association is recorded as an OPEN_QUESTION discussion with two proposed experiments rather than as a causal pathograph edge, preserving the cohort's discordant negative finding for Alzheimer disease.

    Also noted during this work: data/orphadata/MANIFEST.yaml is stale - upstream en_product1.xml no longer matches the pinned sha256, so refresh-orphadata aborts on checksum mismatch. No ORPHA evidence was used and the unverified artifacts were deleted.

    Validation: linkml-validate, linkml-term-validator and linkml-reference-validator all pass. Compliance 86.1 percent global, 86.8 percent weighted. MONDO:0019082 added to cache/enums/diseaseterm CSV as a one-line append after confirming via OAK that it is a descendant of MONDO:0000001; enum cache integrity check passes.

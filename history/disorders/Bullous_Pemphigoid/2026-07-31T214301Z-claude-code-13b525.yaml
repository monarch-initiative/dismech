  details: |
    Addressed the single non-blocking suggestion from the ai4c-reviewer re-review of 5092ed8. The omalizumab target_mechanisms evidence item citing PMID:29545809 was tagged evidence_source: MODEL_ORGANISM, but its quoted sentence ('Mast cells and mast cell-derived mediators ... are increased in lesional skin and blister fluids of BP.') is a human lesional-tissue observation; the animal-model claim is the adjacent sentence. Rather than retag, split into two EvidenceItems so each carries the evidence_source matching its own quoted claim: the human observation as HUMAN_CLINICAL, and 'BP animal model evidence also implicates mast cells in the pathogenesis of BP.' as MODEL_ORGANISM. Both remain supports: PARTIAL, since neither tests omalizumab itself. Validation: linkml-validate no issues; term validation passed; reference validation 39/39 snippets verified against cached references (was 38/38).

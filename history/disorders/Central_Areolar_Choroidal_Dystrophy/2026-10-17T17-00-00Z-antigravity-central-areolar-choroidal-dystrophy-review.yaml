  summary: >-
    Review and compliance enhancement of Central_Areolar_Choroidal_Dystrophy with
    verified literature evidence across prevalence, progression, genetics,
    diagnosis, treatments, differential diagnoses, and animal models.
  details: >-
    Added population prevalence (1-9 per 100,000 from PMID:37914688, noted as
    cited second-hand from Orphanet), adult-onset and grade I-IV progression
    (PMID:37914688, PMID:28125083, PMID:39693084), PRPH2 c.828+3A>T splice-site
    variant evidence (PMID:39693084), diagnostic procedures (multimodal retinal
    imaging and FAF, full-field and multifocal ERG, and PRPH2/GUCY2D/GUCA1A
    molecular genetic testing), supportive care and genetic counseling entries,
    differential diagnoses (age-related macular degeneration, Stargardt disease,
    and PRPH2-associated pattern macular dystrophy), and the Prph2 p.Arg195Leu
    knock-in mouse model (PMID:37914688).

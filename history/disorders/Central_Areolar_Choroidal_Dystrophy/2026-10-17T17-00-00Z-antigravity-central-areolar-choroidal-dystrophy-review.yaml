  summary: Added PRPH2/GUCY2D/GUCA1A gene and GO molecular function bindings on pathophysiology nodes,
    plus prevalence, 4-stage progression, diagnosis, differential diagnoses, and cohort datasets for CACD.
  details: Bound PRPH2 (hgnc:9942, GO:0005198) on the outer-segment rim formation node and GUCY2D (hgnc:4689)
    + GUCA1A (hgnc:4678) with guanylate cyclase activity (GO:0004383), guanylate cyclase activator activity
    (GO:0030250), and calcium ion binding (GO:0005509) on the cGMP phototransduction node. Added HP:0000006
    inheritance_term, Harrison's classifications, point prevalence (1 in 30,000 to 1 in 100,000), adult
    onset and 4-stage progression, multimodal imaging/ERG/ NGS diagnostic entries, evidence on Genetic
    Counseling, differential diagnoses (AMD, Stargardt disease, pattern macular dystrophy), two large
    PRPH2 cohort datasets (PMID:38743414, PMID:39693084), and references.

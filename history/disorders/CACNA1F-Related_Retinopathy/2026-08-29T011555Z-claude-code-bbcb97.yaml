    # Fixes: CACNA1F-Related Retinopathy

    File: `/home/user/dismech/kb/disorders/CACNA1F-Related_Retinopathy.yaml`
    Review: `reviews/CACNA1F-Related_Retinopathy.md` (verdict MINOR_ISSUES, 8 findings)

    ## Findings fixed

    1. **MINOR 1 — photophobia snippet truncated mid-"respectively".** Snippet
       extended to start at the first subject: "nyctalopia and photophobia were
       reported in 50% (8 of 16) and 44% (7 of 16) of documented cases,
       respectively". Explanation now states explicitly that photophobia is the
       second figure, 44% (7 of 16). `frequency: FREQUENT` unchanged (44% still
       falls in that band).

    2. **MINOR 2 — optic-disc-pallor explanation stated a number its quote didn't
       establish.** Snippet swapped for the abstract sentence that actually states
       it: "Twenty-one patients had some degree of disc pallor (bilateral in 19)."
       Explanation rewritten to say 21 patients with some degree of pallor
       (bilateral in 19), out of the 21 of 22 subjects with colour fundus photos —
       replacing the bare "21 of 22 subjects". `frequency: VERY_FREQUENT`
       unchanged.

    3. **MINOR 3 — non-propositional fragment carrying the channel-biophysics
       claim.** The fragment "A set of known mutations affects conserved gating
       charges in" was replaced with the result sentence: "We further identified
       alterations in their biophysical properties, such as a hyperpolarizing shift
       of the activation threshold and an increase in slope factor of activation
       and inactivation." Explanation updated to name the heterologous-expression
       electrophysiology of two disease-causing gating-charge substitutions found
       in CSNB2 patients. `evidence_source: IN_VITRO` retained (correct).

    4. **MINOR 4 — gene-therapy description's four specific claims rested on an
       aims sentence.** `PMID:40129245` was re-fetched with
       `scripts/run_reference_validator.sh cache reference` and still comes back
       `content_type: abstract_only` (no full text available to the fetcher), so
       the cache file is unchanged. Therefore the description was scoped down to
       what the cached abstract supports (no approved therapy; gene-based
       correction is preclinical; a 2025 review surveys candidate strategies,
       animal models, their limitations, and remaining challenges). The four
       specifics — beta2-subunit augmentation and its smaller gene size, in vivo
       electroporation in Cav1.4-KO mice with sparse transfection and
       statistically insignificant improvement, CACNA1F exceeding single-AAV
       packaging capacity, and dual-AAV systems — were moved into a `notes:` field
       on the treatment, attributed explicitly to the open-access full text
       (PMC11938310) and marked as not carried by the quotable cached abstract. The
       evidence item's explanation now says plainly that the quote is a statement
       of scope.

    6. **MINOR 6 — "stable, not progressive" dropped both cohorts' hedges.**
       `pathophysiology` → "Inner Retinal Thinning and Optic Nerve Involvement"
       description now reads: longitudinal pRNFL data in three patients showed
       stability; whether the inner retinal changes are stationary or progressive
       remains unresolved, with both cited cohorts calling for larger and longer
       prospective follow-up. The PMID:36469668 explanation was softened to match
       (n=3 longitudinal, authors' caveat noted). Snippets unchanged.

    8. **MINOR 8 — uncited carrier-manifestation detail.** "occasionally with mild
       latent nystagmus or ERG abnormalities" (no source in the file) was removed
       from the `inheritance` description, replaced with what GeneReviews actually
       says: females who inherit a pathogenic variant are carriers and usually not
       affected, though a female proband may be diagnosed on suggestive ERG
       findings plus a heterozygous/biallelic variant. A second evidence item was
       added on the same block quoting PMID:20301423 exactly ("Males who inherit
       the pathogenic variant will be affected; females who inherit the pathogenic
       variant will be carriers and will usually not be affected."), verified
       against the cached body.

    ## Skipped (with reasons)

    - **MINOR 5 — no `HUMAN_MODEL_MISMATCH` discussion for the I756T
      gain-of-function mouse node.** Skipped: the report frames this as the node
      being "a natural candidate" for such a discussion, not a defect; adding one
      means authoring a new structural `discussions` block with its own prompt,
      rationale, and proposed experiments — a judgment call beyond a clear,
      low-risk MINOR fix. The node text is already correctly scoped to the mouse.
    - **MINOR 7 — `subtype: CORDX3` on the two PMID:40390739 phenotypes.**
      Skipped: the report itself calls it "defensible as a curatorial call", and
      changing a `subtype:` key is a nosology decision, not a quote repair. The
      phenotype descriptions already hedge appropriately ("reported in a CACNA1F
      patient at the cone-rod-dystrophy/retinitis-pigmentosa-like end").

    ## References


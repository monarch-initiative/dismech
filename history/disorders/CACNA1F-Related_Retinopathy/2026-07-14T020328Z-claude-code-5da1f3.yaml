  summary: 'Create: CACNA1F-Related Retinopathy (MONDO:0700243)'
  details: |
    New gene-level entry for CACNA1F-related retinopathy (X-linked incomplete CSNB / Cav1.4 channelopathy), the next unaddressed high-priority target from issue #4008's retinopathy tracker. Modeled with two has_subtypes (CSNB2A stationary form, MONDO:0010241; CORDX3 progressive form, MONDO:0010335); Aland Island eye disease is left as its own separately-curated dismech entry rather than duplicated here, cross-linked via parents/description. 4-node pathophysiology causal chain: Cav1.4 channel dysfunction -> defective photoreceptor-to-bipolar glutamatergic transmission -> (a) cone bipolar sprouting/cone pathway dysfunction (mouse model) and (b) inner retinal thinning/optic nerve involvement (human). 9 PMIDs fetched and snippet-verified (GeneReviews baseline PMID:20301423 plus 8 primary literature sources from a falcon deep-research run, research/CACNA1F-Related_Retinopathy-deep-research-falcon.md, 72 citations). During term verification, caught and corrected 4 hallucinated/incorrect ontology IDs the deep-research report had suggested (HP:0000556 -> HP:0000512 for abnormal ERG, HP:0007368 -> HP:0007750 for foveal hypoplasia, CL:0000740 -> CL:0000748 for retinal bipolar neuron, CL:0000741 -> CL:0000745 for retinal horizontal cell, UBERON:0001854 -> UBERON:0001790 for outer plexiform layer) and one NEC near-miss (MONDO:0011395 'cone-rod dystrophy 3' is ABCA4-caused, not CACNA1F; used MONDO:0010335 'X-linked cone-rod dystrophy 3' instead). just validate (schema+term+reference) and just compliance (87.0%) both pass.

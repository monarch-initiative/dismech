  summary: 'Genetics pass: four gene-defined subtypes, genetic section, BMP and MYO18B
    mechanism nodes'
  details: |
    Genetics pass for issue #12260 (d2g series-053), which listed four gene-defined
    Klippel-Feil MONDO classes as uncurated under this parent.

    Anchor check first: disease_term MONDO:0001029 Klippel-Feil syndrome is as broad
    as the entry, which models the umbrella; its MONDO definition carries the usage
    note "this class includes both isolated forms and forms that are features of
    other syndromes", so the four subordinate classes belong here rather than being
    dragged in by an over-broad anchor. No rebinding needed.

    Research route: no GeneReviews chapter exists for Klippel-Feil syndrome (the
    committed Bookshelf index matches only a StatPearls chapter, which is never a
    baseline). ClinGen's committed 2026-08-13 gene_validity.csv has exactly one
    Klippel-Feil row, MYO18B / MONDO:0014689 / AR / Definitive, curated by the
    Congenital Myopathies expert panel; MEOX1, GDF6 and GDF3 have none. Orphanet was
    not consulted: no ORPHA record for this disease is in the committed
    references_cache. Primary literature: PMID:23290072 and PMID:24073994 (MEOX1),
    PMID:18425797 (GDF6), PMID:19864492 (GDF3), PMID:25748484 and PMID:33179433
    (MYO18B), PMID:32278351 (exome cohort and diagnostic yield).

    Added: four has_subtypes rows (KFS1/GDF6, KFS2/MEOX1, KFS3/GDF3, KFS4/MYO18B)
    with bound subtype_term, genes and per-row inheritance; a genetic section of five
    records, four CAUSATIVE with reciprocal subtype foreign keys plus RIPPLY2 as a
    reported association with relationship_type UNKNOWN; two new pathophysiology
    nodes (a GDF6/GDF3 BMP ligand node and a MYO18B sarcomeric node) so each gene
    reaches the node it acts at instead of sharing one flat gene list; a Myopathy
    phenotype scoped to KFS4; and five new causal edges.

    Removed from the MEOX1 node: the GDF6 and GDF3 gene descriptors and the sentence
    asserting that the dominant forms perturb the same axial-segmentation program.
    That node's evidence is entirely MEOX1 and mouse Meox1, so it did not support the
    BMP claim; both genes now sit on a node with their own GDF6 and GDF3 evidence.

    Judgement calls: PMID:33179433 calls the MYO18B muscle phenotype nemaline
    myopathy, while ClinGen's expert-panel summary states the evidence points to
    congenital myopathy with nemaline rods as a secondary consequence. The phenotype
    is therefore bound to HP:0003198 Myopathy rather than a nemaline term, and both
    positions are cited on the KFS4 row. PMID:32278351 found no pathogenic variant in
    GDF6, MEOX1, GDF3 or RIPPLY2 across 37 consecutively recruited patients, and only
    variants of uncertain significance in MYO18B; that low yield is recorded on the
    GDF6 record with its citation rather than left implicit.

    Validation: just validate, validate-terms, check-duplicate-keys,
    check-entity-refs, check-causal-targets all pass. Phenotype causal inlink
    coverage 1/5 -> 6/6; gene mechanism outlink 0 records -> 4/4 wired; subtype
    foreign-key coverage 0 -> 4/4 with all four WIRED_DIRECT.

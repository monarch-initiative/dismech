  summary: 'Review: evidence-bound TUBB2B p.Arg390Gln curation'
  details: |
    Scope and eligibility. Reviewed kb/disorders/Uner_Tan_Syndrome.yaml as the
    MONDO:0100144, TUBB2B p.Arg390Gln-specific entity. The live-main pin used to
    create the isolated worktree was
    ffa3f27226a4ab879a4da2f95e04a3e305613239. Effective history was evaluated
    using (target.superseded_by.path // target.path) and any events[].type ==
    REVIEW: the two existing effective records contained CREATE and EDIT only,
    so the target was review-eligible. A stable, exhaustive explicit-page scan
    of 222 open pull requests checked both filename and previous_filename and
    found no target or effective-history collision. Pull request 7922 exceeded
    the API file cap and was reconciled with an exact immutable
    c43343af4054eeeab847621eaab1e10da7efde84...1718953e560f96a66daacc93a8108ba7336200b5
    comparison covering all 7,728 declared files.

    Identity, nomenclature, and entity boundaries. Retained the disease binding
    and stable name, added the source-supported synonym recessive
    quadrupedalism, and made the p.Arg390Gln-only scope explicit. The record is
    not a lump for every historical use of the Uner Tan eponym, every biallelic
    TUBB2B variant, dominant/de novo TUBB2B cortical-malformation disease, or the
    VLDLR-, WDR81-, CA8-, and ATP8A2-associated CAMRQ disorders. Added bounded
    structured differentials for complex cortical dysplasia with other brain
    malformations 7 and the separately curated CAMRQ umbrella. Retained the
    reviewed relatedMatch boundary to the TUBB2A/TUBB2B cortical-malformation
    entry. The current literature scan did not justify expanding MONDO:0100144
    beyond p.Arg390Gln; a later biallelic TUBB2B report involved a dual molecular
    diagnosis and was kept review-notes-only.

    Genetics and mechanism. Preserved autosomal recessive inheritance and the
    causal TUBB2B association but limited both to the reported consanguineous
    family and biallelic p.Arg390Gln. Changed functional_impact_category from
    PARTIAL_LOSS_OF_FUNCTION to UNKNOWN: intact folding, heterodimer assembly,
    polymer incorporation, and mild yeast drug sensitivity do not prove a
    hypomorphic loss of function, explain recessivity, or exclude unmeasured
    effects. Recast the variant-to-cerebellar-development edge as
    INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL author-inference evidence. Kept
    the developmental cerebellar node but removed the unsupported
    cerebellar-hypoplasia-to-quadrupedal-gait causal edge. Considered cortical
    migration and Purkinje-cell degeneration models; neither was added because
    the cached evidence establishes neither migration failure nor degeneration.

    Phenotype, imaging, diagnosis, and frequency. Replaced the nonspecific
    HP:0002066 mapping with exact HPO term HP:0009878, Cerebellar ataxia
    associated with quadrupedal gait. Replaced implicit population-like
    frequencies with 3/3 affected individuals in the single reported family and
    moved SEVERE to the valid phenotype-level slot for cerebellar hypoplasia.
    Removed the positive Abnormal basal ganglia morphology phenotype carrying
    REFUTE evidence and represented the reported absence as a supported negative
    structural finding. Because the cached abstract does not state the imaging
    modality, both structural findings use modality OTHER with an explicit
    limitation rather than an unsupported MRI assertion. Added a bounded
    molecular-identification diagnosis while explicitly declining a validated
    diagnostic-performance claim. More detailed neurodevelopmental, seizure,
    language, and imaging features available only outside the cached abstract
    were not promoted into structured or evidence-backed claims.

    Treatment, models, datasets, trials, and other sections considered. Removed
    unsupported supportive-care, rehabilitation, no-disease-modifying-therapy,
    and genetic-counseling treatment-effect entries; treatments is intentionally
    empty because the reviewed evidence contains no treatment or management
    study. Added two source-typed experimental models from the cached abstract:
    the in-vitro folding/heterodimer/polymer-incorporation assays and the
    Saccharomyces cerevisiae TUB2-390Q depolymerizer-sensitivity model. No animal
    model, histopathology, or progression section was added because no cached
    evidence supported one. Exact-name and gene/variant ClinicalTrials.gov
    searches returned no registered studies on 2026-08-24. Disease- and
    variant-specific NCBI GDS, SRA, and BioProject searches returned no dedicated
    dataset. The full article's dbGaP accession belongs to a broader
    controlled-access exome initiative rather than a disorder-specific dataset;
    datasets and clinical_trials are therefore explicitly empty.

    Evidence and cache provenance. Existing references PMID:28013290,
    PMID:19465910, and PMID:41080462 were retained; no new reference was added.
    Before regenerating the existing references_cache/PMID_28013290.md, a fresh
    stable collision gate scanned all 223 of 223 open pull requests, all 17,384
    declared files, and both filename and previous_filename. The pull request
    7922 immutable fallback again reconciled 7,728 of 7,728 files. No collision
    was found. The sanctioned just fetch-reference PMID:28013290 completed but
    left the cache byte-identical at SHA-256
    e348d169f0a651bc4d9d51d511ee7a6993e74fc597150bf1b0d1d502422a41a2,
    1,548 content characters, and content_type abstract_only. No raw-URL cache
    was created to bypass that limitation, no dbGaP cache was created, and no
    cache file was hand-edited. PMID:19465910 is also abstract_only;
    PMID:41080462 is full_text_xml. Full-text-only clinical information was
    confined to explicit review notes rather than structured or snippet-backed
    claims. Evidence sources now distinguish HUMAN_CLINICAL, IN_VITRO,
    MODEL_ORGANISM, COMPUTATIONAL, and OTHER author inference.

    Ethics and language. Used affected individuals and habitual quadrupedal
    locomotion, preserved intellectual disability only where source- or
    cross-record-supported, and rejected primitive, devolution, reverse
    evolution, and atavism framings. The evidence supports a neurodevelopmental
    locomotor phenotype, not an evolutionary hierarchy or a single proven route
    from cerebellar anatomy to gait.

    Frozen content and validation. Independent content audit approved the exact
    target Git blob 7391eac3d3c192533f6e8adfb8da9e25e9cec3be and SHA-256
    de2bec2a499dc0bdf985230eeff79d96dfc4ec2dbac3f72b76e63cd7f3925470.
    Target schema, live ontology terms and labels, strict reference validation,
    25/25 exact snippets, snippet boundaries, duplicate-key checks,
    source-defect checks, and causal-graph construction passed. Compliance was
    98.3% global and 100.0% weighted; the sole scorer gap is intentionally empty
    datasets. Gene-to-mechanism wiring is 1/1. Phenotype connectivity is 1/2;
    habitual quadrupedal locomotion is intentionally floating rather than joined
    by an unsupported causal edge. Validator-only NCBITaxon cache churn was
    restored, leaving a target-only content diff before this history record was
    scaffolded.

    Publication state. This record has prs: [] because no pull request exists
    yet. Content was frozen and independently audited before history creation,
    and this target-plus-history boundary remains unstaged and uncommitted. Live
    main and open-PR state can advance after the recorded preflight; publication
    therefore requires a fresh authoritative main/collision check, exact-head
    revalidation, and separate history audit before any commit, push, or draft
    pull request. No ready-for-review, merge, auto-merge, review dismissal, or
    other publication action is authorized by this record.

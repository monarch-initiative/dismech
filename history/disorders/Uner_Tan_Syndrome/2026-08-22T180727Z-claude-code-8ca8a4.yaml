  summary: Add eponym scope caveat distinguishing MONDO:0100144 from the CAMRQ series
  details: |
    QA-pass finding. The entry is correctly bound to MONDO:0100144, whose MONDO definition is specifically the TUBB2B p.Arg390Gln entity, but the entry's prose did not say that the eponym 'Uner Tan syndrome' is used more broadly in the clinical literature for VLDLR, CA8, WDR81 and ATP8A2 families - concepts MONDO keeps separate as CAMRQ 1-4 (MONDO:0024542, MONDO:0012430, MONDO:0013188, MONDO:0014104). A reader could therefore have taken this entry as covering every patient described under that name. Added a notes paragraph recording the distinction, quoting the MONDO definition that justifies the binding, and stating that the CAMRQ entries are not tubulin disorders, were out of scope for this tranche, and remain uncurated. Notes-only change; no evidence or ontology terms touched. Validated: schema OK.

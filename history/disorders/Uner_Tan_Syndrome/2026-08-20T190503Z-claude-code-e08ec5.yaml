  summary: 'Create: Uner Tan Syndrome (recessive TUBB2B p.Arg390Gln)'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified; just validate and just validate-terms pass.

    Closes the MONDO:0100144 gap the review identified: an is-a descendant of MONDO:0100153 tubulinopathy that no DisMech entry covered.

    Curated as a SEPARATE entry rather than folded into TUBB2A/TUBB2B-related Cortical Malformation, which maps it as skos:relatedMatch with a gap_tubb2b_uner_tan_boundary discussion. Three differences drive the split: recessive versus dominant; cerebellar hypoplasia with explicitly ABSENT basal ganglia malformation, where the other entry curates dysmorphic basal ganglia as core; and a molecularly mild allele leaving folding, dimerization and polymer incorporation intact, where the other entry curates impaired heterodimer formation.

    The absent basal ganglia malformation is curated as a phenotype with supports REFUTE, because the claim being made is the absence of the finding.

    functional_impact_category is PARTIAL_LOSS_OF_FUNCTION - the only use of that value across the tubulin entries - and it is evidenced: the allele incorporates normally and preserves basal function, so it is neither dominant-negative nor null.

    NOT added to the Tubulinopathies grouping despite being a MONDO tubulinopathy descendant: the NECESSARY criterion requires migration-module conformance and this disorder has no evidenced cortical migration failure.

    Includes a discussion on the sharpest isotype-specificity experiment available - TUBB2B Arg390Gln is mild and recessive while the structurally equivalent TUBB2A Arg391His is severe and dominant.

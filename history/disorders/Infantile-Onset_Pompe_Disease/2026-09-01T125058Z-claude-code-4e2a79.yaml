  summary: 'Address PR #10365 review: CNS histopathology, NBS pseudodeficiency, AAV
    class safety, Glc4 dynamics, CRIM determination'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10365. The review confirmed every deterministic gate passes and requested changes purely on evidence consumption: papers this PR had fetched into references_cache but not cited. Each claimed paper was read from its own cached abstract and its snippets verified before use, rather than taken on the review's word.

    CNS histopathology (the blocking item). PMID:42538472, a systematic review of 39 articles covering 49 patients under a strict classic-infantile definition, was cached and uncited while the new histopathology section carried only muscle findings. Three CNS findings added: the regional distribution (white matter, globus pallidus, dentate nucleus, brainstem motor nuclei, anterior horn cells, subcortical over cortical); severe glycogen accumulation specifically in astrocytes and globus pallidus neurons; and the temporal separation between autopsy pathology before 21 months and MRI change at 2-3 years, biomarker change at ~5, cognitive decline at ~8-10.

    The gap_iopd_cns_glycogen_white_matter discussion was rewritten rather than closed. The review's own reading was right: this evidence settles the storage half of the gap - CNS glycogen accumulation is no longer an inference from the muscle phenotype - while the review states outright that the mechanisms linking glycogen accumulation to neurological manifestations remain incompletely understood, and no interventional evidence shows that reducing CNS glycogen changes the neuropsychological outcome. The temporal gap adds a dimension the discussion did not previously have, and constrains both any causal account and any trial endpoint. Status stays OPEN, with the two supporting snippets added.

    Newborn screening false positives. PMID:42320386 added to the diagnosis entry: pseudodeficiency alleles cause false-positive enzyme reductions, individuals homozygous for the haplotype stayed asymptomatic despite dried blood spot activity below the diagnostic threshold, and the haplotype is enriched in East Asian populations, so screening performance is ancestry-stratified.

    AAV class safety. PMID:42142433 added to the gene-therapy treatment, with an explicit scope caveat the review did not state: the case is a 49-year-old with LATE-ONSET disease who received AT845, a different product from the AAV9-GAA vector curated here. It is cited as a class-level caution about dorsal-root-ganglion injury, and the explanation says so rather than implying a finding about this treatment. PMID:37463048 added alongside it as the preclinical arm - systemic AAV reversed glycogen storage in muscle, diaphragm and CNS in Gaa-knockout mice and reversed the autophagy and mTORC1/AMPK abnormalities, which also covers the review's non-blocking mTORC1/AMPK item at the point where it is load-bearing.

    Glc4/Hex4 dynamics. PMID:15886040 added to the biomarker entry. The important nuance is that levels fall in every treated patient, so the fall is not the discriminating signal; persistent elevation above the control range is what marks a poorer response.

    CRIM determination. PMID:41583481 supports a new diagnosis entry, since CRIM status decides whether prophylactic immune tolerance induction is needed and the entry previously had no diagnosis entry for it despite heavy CRIM content elsewhere. The first NCIT term tried for it, NCIT:C16410, turned out to be Centrifugation; caught by OAK verification before it was written, and replaced with NCIT:C18020 Diagnostic Procedure.

    Deliberately deferred, and why: beta2-agonist adjuncts (PMID:24448824, PMID:30803275) and dose-intensive alglucosidase alfa are real treatment additions but widen the PR beyond what the review flagged as blocking; CRIM-positive/negative as has_subtypes is a modelling change with no MONDO or OMIM identifier behind it and should be its own PR with its own subtype foreign-key migration; a HUMAN_MODEL_MISMATCH discussion for the mouse models is worth doing but the limitations text on the model links already carries the content. These are stated on the PR so the reviewer can treat them as scoped out or push back.

    Validation. just validate and just validate-disorders pass; 161/161 snippets verified, up from 144. All offline gates pass with no new violations. Local pytest over the KB test selection relevant to this change (entity refs, model readout targets, subtype keys, causal targets, unique names) ran green: 20917 passed. Compliance holds at 99.4%.

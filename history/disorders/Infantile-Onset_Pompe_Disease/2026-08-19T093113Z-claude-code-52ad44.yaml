  summary: Wire new phenotypes into the pathograph (re-review suggestion G)
  details: |
    Follow-up on suggestion G of the approving re-review of PR #8877: wire the newly added phenotypes into the pathograph as downstream targets, so the mechanism-to-manifestation edge exists rather than the phenotype floating unattached.

    Two edges added.
    (1) Skeletal and respiratory myofiber injury -> Generalized muscle weakness, DIRECT, evidenced by the GeneReviews sentence that names generalized muscle weakness alongside but separately from hypotonia. This is the edge the reviewer specifically called out as having an obvious parent node.
    (2) Lysosomal glycogen accumulation -> Hepatomegaly, DIRECT, evidenced by the natural-history cohort's attribution of the moderate liver enlargement to glycogen storage. The evidence item is deliberately supports: PARTIAL, not SUPPORT: the same sentence explicitly leaves open a contribution from cardiac decompensation, so storage is a partial rather than sole explanation and the evidence record should say so.

    Macroglossia was deliberately left unattached. No cached reference states a causal link from the storage lesion to tongue enlargement; the sources report its frequency (45 percent Dutch, 29 percent literature) and its airway consequence, not its mechanism. Asserting a myofiber-injury-to-macroglossia edge would be a plausible inference presented as an evidenced claim, which is the failure mode the evidence SOP exists to prevent. It joins the six phenotypes that were already unattached for the same kind of reason.

    Suggestion H checked, no change needed: NCT04910776 status ACTIVE_NOT_RECRUITING was taken from the ClinicalTrials.gov API record (overallStatus ACTIVE_NOT_RECRUITING, statusVerifiedDate 2026-04), not inferred. The cached registry summary holds design and duration only, which is why the value is not snippet-checkable.

    Suggestion I (mitochondrial dysfunction / oxidative stress, step 6 of the deep-research causal chain) is not taken in this pass and remains a reasonable future addition.

    Validation. just validate passed (schema plus reference validation, 102/102 snippets). just validate-terms passed. just validate-disorders over both changed kb files passed. just check-duplicate-keys and just check-title-snippets OK. Pathograph re-audited programmatically after the edit: every downstream, target_mechanisms and modeled_mechanisms target resolves, no danglers.

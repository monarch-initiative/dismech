  summary: 'Create: Infantile-Onset Pompe Disease (MONDO:0017694)'
  details: |
    New standalone Disease entry binding MONDO:0017694 (classic infantile-onset Pompe disease, IOPD), plus a one-block edit to kb/disorders/Pompe_Disease.yaml adding subtype_term MONDO:0017694 to the existing IOPD has_subtypes entry.

    Scope decision. Pompe_Disease.yaml (MONDO:0009290) remains the umbrella entry for the whole GAA-deficiency continuum and already carried an unbound IOPD subtype. A standalone entry was chosen over subtype-only binding because IOPD carries substantial mechanism that the umbrella entry does not model and that is absent from late-onset disease: near-total (<1 percent) residual GAA activity; the obligate hypertrophic cardiomyopathy that is definitional for IOPD in GeneReviews; the untreated infantile natural history (median onset 1.6 months, median death 6-7.7 months); and above all the CRIM-status axis, in which biallelic null GAA alleles produce no GAA protein at all so that infused rhGAA is a foreign antigen, driving early high sustained neutralizing anti-rhGAA IgG, ERT failure, and the immune-tolerance-induction therapy that answers it. The repository already has 90 cases where a subtype_term on an umbrella entry matches a standalone entry primary disease_term, so this pattern is well-precedented.

    Pathograph. Nine nodes: near-complete GAA deficiency -> lysosomal glycogen accumulation (conforms_to lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation) -> cardiomyocyte storage/hypertrophic remodeling and skeletal/respiratory myofiber injury -> cardiopulmonary insufficiency of infancy -> death in infancy; a parallel CRIM-negative arm (absence of immunologically detectable GAA protein -> high sustained anti-rhGAA antibody response -> ERT failure and clinical decline); and an ERT-era CNS arm (CNS glycogen storage and progressive white matter abnormality -> cognitive decline).

    Evidence. 81 evidence snippets, all exact substrings of locally cached references (PMID:12897283 van den Hout natural history, PMID:19775921 Kishnani CRIM outcomes, PMID:22252923 Bali CRIM genotype prediction, PMID:22237443 Messinger immune tolerance induction, PMID:22538254 Prater long-term survivors, PMID:29573408 Ebbink brain cohort, PMID:32373469 Chien dosing, PMID:40449831 Mini-COMET, PMID:20301438 GeneReviews, PMID:17151339 pivotal trial, PMID:39424261 birth prevalence, ORPHA:365).

    Notable curation decisions. (1) The Death in infancy phenotype is deliberately left without a phenotype_term: HP:0001522 sits under HP:0040006 (Mortality/Aging), not HP:0000118, so it is not a legal PhenotypeTerm in this schema, and no reachable term expresses it. (2) IOPD was NOT added to the Lysosomal_Storage_Disorders grouping because its parent Pompe Disease is already a member and the grouping deliberately avoids listing subtypes alongside their parent. (3) One KNOWLEDGE_GAP discussion records that the CNS-storage-to-white-matter mechanism is asserted temporally rather than demonstrated, with a proposed experiment.

    Validation. just validate (schema + terms) passed on both changed kb files; 81/81 snippets verified against cached references by just count-verified-snippets; just validate-disorders, just check-duplicate-keys and just check-title-snippets run before opening the PR.

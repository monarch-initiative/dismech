  summary: 'Review response: address CHANGES_REQUESTED on PR 8877'
  details: |
    Review-response pass on PR #8877, addressing the five blocking findings and five of the six suggestions in the ai4c-reviewer CHANGES_REQUESTED review.

    Blocking findings.
    (1) Tagged the top-level PMID:20301438 reference with tags: [GeneReviews]; it is the GeneReviews Pompe Disease chapter and is cited throughout the entry, so the GeneReviews baseline marker belongs on it.
    (2) Mined the GeneReviews GENETIC COUNSELING section: the inheritance block now carries the 25/50/25 percent sib recurrence-risk sentence, which is the transmission claim that block was previously asserting without a GR citation.
    (3) Corrected the reference_title on the ORPHA:365 evidence item in classifications.lysosomal_storage_category, which had been copy-pasted from PMID:22252923 and so misattributed an Orphanet structured-database row to a journal article.
    (4) Reclassified the PMID:38785980 evidence item from HUMAN_CLINICAL to OTHER; it is a review quoted for general autophagy cell biology, not a human clinical observation.
    (5) Added the three missing cardinal phenotypes. Generalized muscle weakness (HP:0003324) is curated separately from the existing Generalized hypotonia because GeneReviews names both in the same sentence as distinct features. Macroglossia (HP:0000158) is backed by the natural-history cohort's 45 percent tongue-enlargement figure plus the GR tracheostomy guidance. Hepatomegaly (HP:0002240) is backed by the cohort's attribution of moderate liver enlargement to glycogen storage.

    Suggestions taken.
    (A) Replaced the GAA-knockout mouse model-level snippet, which quoted a disease definition rather than a model result, with the sentence reporting that autophagosome buildup disrupts the contractile apparatus and acts as a sink for infused recombinant enzyme. MODEL_ORGANISM is retained because the replacement snippet now genuinely reports the model finding, which is a better fix than relabelling a definition quote as OTHER.
    (B) Added Baby-COMET (NCT04910776), the phase 3 open-label study of avalglucosidase alfa in treatment-naive IOPD, the first-line counterpart to the already-curated Mini-COMET salvage study.
    (C) Added the MetabERN 2024 European clinical pathway recommendations (PMID:39482698, cited by PMID rather than DOI because DOI: is in skip_prefixes and would not be snippet-checked) for the cardiac surveillance schedule on the cardiac-management treatment.
    (D) Deepened the genetic section: GAA locus 17q25.2-q25.3 and 20-exon structure, the breadth of the allelic spectrum, and the copy-number blind spot, namely that large deletions are about 1.5 percent of known GAA variants, invisible to exon sequencing, so MLPA is indicated when sequencing returns fewer than two explanatory alleles. Four new evidence items from PMID:39482698 and PMID:39273088. Carrier frequency was deliberately NOT added: no cached reference states one, and inventing a figure is the failure mode the evidence SOP exists to prevent.
    (E) Tightened the Respiratory insufficiency claim-snippet alignment: the GR sentence naming respiratory distress directly is now the primary evidence, with the diminished-lung-volume sentence retained as support for the second clause of the description.

    Suggestion not taken.
    (F) The prior history record was left untouched, as the reviewer asked. History is append-only and that record accurately describes the session as it ran; this record is the follow-up.

    Frequency discipline. Macroglossia is banded FREQUENT on the 45 percent prospective Dutch figure, with the 29 percent retrospective literature figure treated as under-ascertainment. Hepatomegaly carries NO frequency band: the 90 percent versus 29 percent spread between the two series is too wide to map onto one band, and omitting is preferred to fabricating justification.

    Validation. just validate passed (schema plus reference validation, 100/100 snippets). just validate-terms passed. just count-verified-snippets reported 194/194 verified across both changed kb files. just check-duplicate-keys OK across 2334 files. just check-title-snippets OK, no new title-quoting snippets. just validate-disorders over both changed kb files passed (2 files, 194/194). Two incidental references_cache regenerations (PMID_38785980, PMID_39424261) triggered by the validator on pre-existing cache files were reverted to keep the diff scoped and avoid conflict churn with the concurrent late-onset Pompe PR.

  summary: 'Review fixes and openscientist reconciliation: Infantile-Onset Pompe Disease'
  details: |
    Follow-up to the augmentation commit 36f066199, addressing a self-run adversarial review and reconciling the openscientist deep-research report that finished after that commit.

    Review fixes (all verified against the cited sources before acting, not taken on the reviewer's word):

    1. Ontology specificity. diagnosis[0] bound NCIT:C15419 (Disease Screening) on an entry literally named 'Newborn screening for GAA deficiency'. NCIT:C81178 (Newborn Screening) exists, is a descendant of C15419 and so still in the enum, and is what the Late-Onset_Pompe_Disease sibling uses for the same concept citing the same PMID and snippet. Rebound to C81178.

    2. Dataset evidence misattribution. Both PMID:42337614 snippets were taken from the abstract's background block and explained as findings about the Gaa-/- mouse the dataset profiles; they are general statements about Pompe disease. Worse, the satellite-cell snippet ('satellite cells fail to activate') was explained as the mouse counterpart of this entry's own histopathology finding, which records satellite-cell activation as HIGHER in poorly responding biopsies - the opposite direction. Both replaced with snippets from the study's actual results (dysferlin/ANXA2/AHNAK2 overexpression; myostatin accumulation), and the dataset caveat widened to record that the publication's human validation arm is late-onset rather than infantile-onset patients.

    3. Unsupported model claims and an internal contradiction. The knock-in mouse description asserted that the original knockout lines 'do not show early muscle weakness' and that they 'do not reproduce [cardiomyopathy] on this timescale'. PMID:36517654 makes neither claim - its only KO-weakness sentence says the opposite ('respiratory muscle weakness caused by Gaa KO deletion'), and it makes no cardiac KI-vs-KO comparison. That claim came from the deep-research report's prose, not from the cited paper, and was attributed to the wrong source. Both removed. Separately, the experimental-model description said mouse models are poorly placed to address cardiac mitochondrial biology 'because they do not develop the infantile cardiac phenotype on a comparable timescale', contradicting the knock-in mouse added 60 lines earlier in the same commit; rewritten to say what is actually true of the iPSC system (human cardiomyocytes carrying patient genotypes).

    4. Derived statistic. Progression phase 2 asserted that ventilation precedes death 'by a median of under three months'. That is 8.7 minus 5.9, the difference of two marginal medians, which is not the median of the paired interval and is not a claim PMID:16737883 makes. Replaced with a note saying explicitly that the interval is not derivable from the reported figures.

    5. Scope-discipline note. The entry's pre-existing note claimed all snippets were checked to be about the classic cardiac infantile form; several new mechanism, model and dataset snippets are not, and one model's own limitations text concedes it. The note now states which two classes of item are deliberately broader and where each says so.

    6. CRIM over-claim. The AAV9 antibody evidence was explained as contrasting with CRIM-negative antibody-mediated ERT failure. PMID:40561529 does not report CRIM status for any of the four patients (zero mentions in the cached text), so the contrast is unavailable; the explanation now says only what was observed and notes the gap.

    7. Unsourced superlative. 'first reported' AAV9-GAA series appeared twice; neither the publication nor the ICTRP record says 'first', and the deep-research report cites an earlier 2022 first-in-human case report. Removed both.

    8. Bundled readout. One readout was named 'Hypertrophic cardiomyopathy and skeletal muscle weakness' with a single direction against the cardiac node. Split: the cardiac half stays, and the skeletal half became a second modeled_mechanisms link to Skeletal and respiratory myofiber injury with relationship PARTIALLY_RECAPITULATES, since the model shows skeletal weakness but no respiratory phenotype.

    9. Minor: histopathology finding renamed to what its quote supports (it said 'vacuolar myopathy'; the quote never mentions vacuoles); progression phases made disjoint (phase 1 was a superset of the other two) and the 0.3-73.4 month death range acknowledged against the 'first year of life' framing; an uncited cause-of-death assertion replaced with a pointer to the pathophysiology node that carries it; stray space in the genotype 'Gaa em1935C>A' removed. A duplicate 'evidence' key introduced while restructuring phase 2 was caught by check-duplicate-keys and merged.

    Openscientist reconciliation. The openscientist run launched at the start of the session finished after the first commit (2472s; report and citations sidecar committed, plus its HTML/PDF artifacts). It carried no validation sections, so both were retro-fitted before use: 38/38 references resolved, 0 unresolved, 0 off topic; 42 terms checked, 38 resolved, 0 unresolved. Its 13 'named as a different term' warnings are a table-column parsing artifact - the report's HPO table has an adjacent onset column, and the validator paired the wrong cell, so it read 'Infantile' as several terms' names. The CURIEs match the report's own label column and were spot-checked with OAK.

    Two genuine gaps came out of it. Cardiomegaly (HP:0001640) was absent despite being the most frequent sign in the untreated cohort at 92%, added as VERY_FREQUENT. And PMID:41014101, a two-decade follow-up of CRIM-positive infantile-onset survivors on ERT, supports flaccid dysarthria (8/8) and ptosis (4/8) as part of the residual survivor phenotype this entry already describes in prose; both added, ptosis with the cohort's ambulation figures as context. PMID:24706590 (eyelid levator vacuolation in an early-treated infant) was fetched as corroboration for ptosis but is a Letter with no abstract in the cache, so it is not cited - nothing was quoted from it.

    Validation. just validate and just validate-disorders pass; 144/144 snippets verified. All offline gates pass with no new violations: entity-refs, causal-targets, duplicate-keys, qualifier-terms, enum-values, snippet-grading, snippet-length, title-snippets, folded-hyphens, environmental-evidence. Compliance holds at 99.4%.

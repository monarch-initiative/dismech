  summary: 'Augment: Infantile-Onset Pompe Disease (natural history, histopathology,
    models, datasets)'
  details: |
    Augmentation of an existing entry, not a new curation. The requested disease (MONDO:0017694, "glycogen storage disease due to acid maltase deficiency, infantile onset") was already curated by PR #8877 closing issue #8758, so per the initiate-new-disorder-creation skill the existing file was edited rather than duplicated.

    Deep research. Ran `just research-disorder claude_code Infantile-Onset_Pompe_Disease` (report: research/Infantile-Onset_Pompe_Disease-deep-research-claude_code.md; 19 web searches, 21 turns, 48 citations). Falcon was NOT re-run: a falcon report for this disorder already existed on disk from the original August 2026 curation and the recipe writes to a deterministic filename, so re-running would have overwritten the provenance the current entry rests on. An openscientist run was also launched and was still queued server-side when this session's edits were completed; nothing from it was used.

    The claude_code report had no validation sections (the provider does not emit them), so both were retro-fitted before any of its content was used: `just validate-research-reference` (22/22 references resolved, 0 unresolved, 0 off topic) and `just validate-research-terms` (46 terms checked, 43 resolved, 0 unresolved). Term validation caught two mislabelled bindings that were therefore NOT used: MONDO:0008608, which the report called 'glycogen storage disease II / Pompe disease' but which MONDO calls Down syndrome, and MONDO:0009291, which the report called 'glycogen storage disease II, infantile onset' but which MONDO calls glycogen storage disease III. No ontology term was taken from the report; every new term binding was verified independently with OAK.

    The report was used as a source of leads only. Each lead was re-found in PubMed and cited from its own cached abstract: the IOPD natural-history cohort (PMID:16737883), serial pre/post-ERT muscle pathology (PMID:17075580), the naturally occurring Lapphund canine model (PMID:23457621), the Gaa c.1935C>A knock-in mouse (PMID:36517654), the first AAV9-GAA gene-therapy series in IOPD (PMID:40561529), and patient iPSC-derived cardiomyocytes (PMID:37916452).

    What was added. synonyms; mappings (skos:broadMatch to the parent MONDO:0009290, which deliberately does not retire the parent from the curation queue); progression (three phases from the 168-patient untreated natural-history cohort); histopathology (four findings from serial quadriceps biopsies in eight ERT-treated infants, including the negative capillary-density result); diagnosis (newborn dried-blood-spot screening, with the MetabERN limitation that the assay is a screening test only); two animal models; one experimental model (patient iPSC cardiomyocytes, with a rescue readout); AAV9 gene therapy as a treatment, carrying a REFUTE evidence item for the patient who was withdrawn and died so the four-patient series is not read as an established benefit; the GC301 trial keyed on its WHO ICTRP identifier because it is registered on ChiCTR and has no NCT number; three GEO datasets; and quantitative frequency anchoring on two phenotypes that previously had none.

    No histopathology finding_term was bound: no NCIT term under the HistopathologyFindingTerm roots names vacuolar myopathy or lysosomal glycogen accumulation, and the candidate HP terms (HP:0030231, HP:6000977, HP:0003736) are not under HP:0025461 and so are not in the enum. This matches the Late-Onset_Pompe_Disease sibling, which also omits it.

    Validation. `just validate` passes; 140/140 snippets verified against the reference cache. `just validate-disorders` (the batched pre-PR gate) passes. `just verify-datasets` resolves 3/3 GEO accessions. check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass with no new violations. Compliance rose from 98.7% to 99.4%; the one remaining gap is a pre-existing proposed (not-yet-run) experiment, which correctly has no results to cite.

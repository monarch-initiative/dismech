  summary: Reground disease_term to MONDO:1010179 type 5 diabetes mellitus
  details: |
    Entry was grounded to MONDO:0005015 (generic diabetes mellitus) and carried no mappings block. MONDO:1010179 'type 5 diabetes mellitus' lists 'malnutrition-related diabetes mellitus' and 'MRDM' as exact synonyms and is defined as diabetes caused by underdeveloped pancreatic tissue resulting from prolonged undernutrition, matching this entry; it is a child of MONDO:0005015. Regrounded disease_term to MONDO:1010179 (skos:exactMatch) and added a mappings block retaining MONDO:0005015 as skos:broadMatch. This entry remains a worked conformer of the diabetic_vascular_complications module and a member of the Diabetes_Mellitus grouping; neither reference changed. Validated with 'just validate' and 'just count-verified-snippets'.

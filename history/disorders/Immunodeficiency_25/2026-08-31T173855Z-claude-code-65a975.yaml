  summary: 'Create: Immunodeficiency 25 (CD247/CD3zeta deficiency)'
  details: |
    De novo curation of immunodeficiency 25 (MONDO:0012426), CD247/CD3zeta deficiency. One openscientist deep-research report was generated and preflighted with "just preflight-dr ... MONDO:0012426", which PASSed with CD247 as the dominant gene mention and matching OMIM 610163.

    The deep-research report made a material contribution here rather than merely confirming the entry. The first draft was written from a PubMed-led search that had surfaced the two recent Regueiro-group papers but not the founding case. The report identified Rieux-Laucat et al. NEJM 2006, PMID:16672702, the four-month-old boy with homozygous Q70X and three heterozygous somatic second-site changes; that reference was fetched and its quoted sentences verified against the cache before being added. PMID:28743717 was added alongside it, distinguishing true reversion from second-site compensation and supplying the measured mutation-propensity explanation for why reversion is common in this gene.

    Pathograph: biallelic CD247 loss-of-function variants, impaired TCR/CD3 complex assembly and surface expression, loss of ITAM-dependent proximal TCR signaling, failed thymic selection and T-cell development, T-cell lymphopenia with impaired function. A sixth node, Revertant Somatic Mosaicism, is curated with no downstream edge because it modifies the disease course without being a step toward the phenotype; treating it as a causal step would wrongly imply it contributes to the immunodeficiency.

    Two model systems are curated. The MA5.8 murine CD247-deficient T-cell line is recorded as FAILS_TO_RECAPITULATE, because the Q70X allele restores surface TCR in that line and not in human cells; the error direction is optimistic, making a damaging human allele look tolerated. That grounds a HUMAN_MODEL_MISMATCH discussion, supported additionally by the established mouse-human reciprocity of CD3gamma and CD3delta roles, which means the mismatch should be assumed across the CD3 complex rather than rediscovered per subunit. The ZKO CRISPR Jurkat line carries the positive mechanistic argument.

    A second genetic entry records heterozygous nonsense CD247 alleles with relationship_type DISPUTED. Their dominant-negative effect is well demonstrated in cell lines under overexpression, but no segregation or penetrance data are reported and the source states the correlation with clinical features only as a possibility, so recording it as CAUSATIVE would overstate the claim. An OPEN_QUESTION discussion records what would settle it.

    Validated with just validate for schema and references, 42 of 42 snippets verified against cached references, plus just validate-terms, just check-entity-refs and just check-duplicate-keys, all passing.

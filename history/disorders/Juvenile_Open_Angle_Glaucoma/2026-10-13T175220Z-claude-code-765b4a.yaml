  summary: 'LOINC tranche G: IOP measurement, no sourced band'
  details: |
    Bound LOINC:56844-4 (intraocular pressure) as a diagnosis measurement on the existing Tonometry row. No reference range is recorded: the entry's own top-level description states IOP is 'frequently >30-40 mmHg' in JOAG but carries no citation for that figure, and the cited clinical and genetic update (PMID:34536459) states only that JOAG has high intraocular pressures with no numeric cut-off in its abstract. Notes record this rather than manufacturing a band on an unsourced figure. Part of LOINC tranche G batch 11 (projects/LOINC_DIAGNOSTICS.md).

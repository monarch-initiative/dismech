  summary: 'Genetics pass: bind GLC1A on the MYOC subtype row and wire CYP1B1'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The series row MONDO:0007664 glaucoma 1 open angle A is now bound as the subtype_term of the existing MYOC JOAG row, which previously carried neither a MONDO term nor a gene; MYOC is bound there too, and CYP1B1 on the CYP1B1 JOAG row. No MONDO class is bound on the CYP1B1 row and the row says why: the six MONDO children of this entry's term are the MYOC and other GLC1 loci, while CYP1B1 is filed under the congenital-glaucoma GLC3A locus. A new MOLECULAR node, Loss of CYP1B1 Monooxygenase Activity, carries GO:0004497 monooxygenase activity DECREASED and feeds the existing CYP1B1 dysgenesis node, sourced to a 2025 review that states the enzymatic function, lists juvenile open-angle glaucoma among the diseases its variants cause, reports trabecular meshwork degeneration in the knockout mouse, and says the ocular substrate is unidentified. Genes wired 0/2 to 1/2. MYOC is deliberately not wired, and the notes field gives the reason: myocilin has no established molecular function to name, its mechanism is a gain of toxic function in which the mutant protein aggregates instead of being secreted, and binding a molecular function at that node to satisfy the wiring metric would invent one. The dead-end optic neuropathy node now reaches optic nerve cupping and visual field loss, and the outflow-obstruction node reaches raised intraocular pressure and open-angle glaucoma; phenotype causal inlink 0/5 to 4/5, dead-end nodes 1 to 0. Myopia is left unwired because both its sources describe an association and neither places it downstream of raised pressure. Validation on the committed tree: just validate 0 issues, validate-terms passed, 38/38 snippets verified.

    Self-review round, same session: two corrections. The notes field had justified leaving myopia unwired partly on an unsourced claim that myopic eyes are structurally more susceptible to pressure-related optic nerve damage; that clause is removed and the note now rests only on what the two cited sources do and do not establish. The CYP1B1 node's description called the enzyme a heme-thiolate monooxygenase, a qualifier that is in the cited review's body but not in the sentence quoted on the node, so it was dropped. The CYP1B1 subtype row's inheritance evidence was regraded from OTHER to HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, because the quoted sentence is about inheritance patterns in human patients and so has a system to grade. Snippets after the round: 38/38.

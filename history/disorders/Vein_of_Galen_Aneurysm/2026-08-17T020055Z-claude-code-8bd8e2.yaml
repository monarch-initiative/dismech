  summary: 'Close six content gaps from review: better quotes, mouse and fish models,
    trials, diagnosis, inheritance, genes'
  details: |
    Six IMPORTANT findings, and the reviewer's framing was accurate: almost none of these required new literature, because every sentence needed was already sitting in a references_cache file this PR adds. That is the uncomfortable part. The entry passed snippet validation at 22 of 22 while under-consuming its own cached sources by roughly half.

    The most instructive finding was the fourth: one methods sentence from Tas 2022, listing the variables the study RECORDED (hemorrhage, neurological deficit, hydrocephalus, incidental, heart failure), was cited four separate times as support for four different causal claims. The quote is genuine and validates as an exact substring, which is exactly why no automated check could catch it. A sentence saying a study recorded hydrocephalus does not assert that venous hypertension causes hydrocephalus. All four uses are gone. The replacement for the venous-hypertension and steal nodes is the paper's own mechanistic sentence, that locoregional venous hypertension is likely to lead to seizure or neurological deficit through vascular steal or chronic venous ischemia, with the authors' hedge left intact rather than sharpened; the seizure phenotype now carries the measured onset statistic (p < 0.0001) instead.

    Where the sources genuinely do not support a claim, that is now recorded rather than smoothed over. The conventional route from venous hypertension to hydrocephalus, impaired cerebrospinal fluid absorption, appears in no source cited in this entry, and the venous node carries a note saying so.

    ACVRL1 was citing a sentence about endothelial cell localisation that does not mention ACVRL1; it now cites the sentence naming the gene in probands and in a multi-generational pedigree, upgraded PARTIAL to SUPPORT.

    Added: the EPHB4 p.Phe867Leu knock-in mouse, PARTIALLY_RECAPITULATES with a readout, carrying its second-hit condition rather than dropping it; the acvrl1a/b zebrafish rescue model; a KNOWLEDGE_GAP discussion on what the second hit is in humans, since a somatic endothelial event would explain non-penetrant carrier parents and the focal anatomy of a disease whose germline variant is in every cell. Also added: two fetal-embolization trials (NCT04434729, NCT07483255) with cached evidence; a diagnosis section (fetal ultrasound, Doppler echocardiography, MR angiography, catheter angiography) where two entries carry explicit notes saying no quotable sentence exists rather than attaching a quote that does not say it; an inheritance block, autosomal dominant with INCOMPLETE penetrance and VARIABLE expressivity, tying the 50 percent transmission risk to the mouse second-hit finding as a candidate explanation graded PARTIAL because it is a mouse result offered for a human puzzle; NOTCH1, ITGB1 and PTPN11 gene entries; the RASA1 2042.5-fold and EPHB4 17.5-fold burden statistics; per-gene case fractions (RASA1 25 percent, EPHB4 8 percent of 115 children) with the denominator caveat that the cohort is all cerebral high-flow shunts; three phenotypes (macrocephaly, prominent scalp veins, intracranial hemorrhage) with frequency bands from the 114-proband salient-features sentence, the scalp-vein band graded PARTIAL because the source counts face and scalp vasculature together; and a progression record holding the 62/38 outcome split against near-certain untreated lethality.

    Suggestions also taken: treatment_term moved from the generic NCIT:C49236 Therapeutic Procedure to NCIT:C15230 Embolization Therapy, and the prevalence record's measure_type changed from POINT_PREVALENCE to UNKNOWN, since a proportion of a lesion class is not a population rate and the structured slots are what downstream tooling reads.

    Validated: just validate passed; count-verified-snippets 54/54 (was 22/22); pytest tests/test_data.py -k Vein_of_Galen 16 passed; folded-hyphen and title-snippet gates OK; graph reachability re-checked, single connected component with only the initiating node lacking an incoming edge.

  summary: Connect the three phenotypes added last round, which I left orphaned
  details: |
    Self-caught after approval, from a parse of every entry in this batch. The three phenotypes I added in the previous round to close the coverage gap, macrocephaly, prominent scalp veins and intracranial hemorrhage, all had no incoming edge. Closing a coverage gap by adding disconnected leaves is not really closing it: the phenotypes render, but nothing in the graph says what produces them, which is the same defect that blocked the pigment dispersion PR in this batch. That I introduced it while fixing a different completeness finding is worth recording.

    All three now hang off Cerebral Venous Hypertension, at three different strengths rather than one uniform edge type. Prominent scalp veins is DIRECT: raised cerebral venous pressure decompresses through emissary veins into the scalp, so the sign is the venous hypertension made visible on the surface. Macrocephaly is INDIRECT_KNOWN_INTERMEDIATES, reached through hydrocephalus and the mass of the pouch in a skull whose sutures have not fused, which is also why an infant shows a growing head rather than a pressure crisis. Intracranial hemorrhage is INDIRECT_UNKNOWN_INTERMEDIATES and the edge says why: raised venous pressure and the fragility of an abnormally built vasculature are both plausible routes, and the cited evidence reports haemorrhage in two individual patients without distinguishing them.

    Only the initiating node now lacks an incoming edge. Validated: just validate passed; count-verified-snippets 54/54; pytest -k Vein_of_Galen 16 passed; folded-hyphen gate OK. Note this push drops the existing approval; that is the intended trade, since merging a known orphan-leaf defect to preserve a green badge is the wrong way round.

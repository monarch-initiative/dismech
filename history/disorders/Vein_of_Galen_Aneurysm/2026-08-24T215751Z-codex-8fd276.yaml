  details: |
    Scope and review state. This is the bounded repair requested by formal
    CHANGES_REQUESTED review 5012781934 on draft PR #9416 at rejected head
    edf07e0fa91e232df9436b88667a0c4b8fcca361. The prior REVIEW record and the
    GENERAL/no_change PR backlink are append-only and were not modified. The
    formal review was preserved: it was not dismissed or replied to, and the PR
    was not marked ready. This EDIT records the target repair and the one new
    collision-gated reference cache; it does not claim independent approval or
    authorize staging, committing, pushing, merging, or auto-merge.

    Fetal presentation and graph. Hydrops fetalis (HP:0001789), cardiomegaly
    (HP:0001640), and tricuspid regurgitation (HP:0005180) were added from a
    single primary VOGM fetal case. Each phenotype carries its own exact local
    evidence and deliberately has no frequency. Each is wired from High-Output
    Circulatory Overload through a calibrated INDIRECT_KNOWN_INTERMEDIATES edge;
    the edge descriptions preserve that the source establishes case-level
    occurrence rather than population frequency or an invariant causal order.
    The graph now has six mechanisms, twelve phenotypes, seventeen causal edges,
    one connected component, no missing targets, and no orphan phenotypes. All
    twelve phenotype nodes are causally connected, and all three genetics entries
    classified as causal or susceptibility relationships are mechanism-wired;
    six gene descriptors remain attached to the upstream endothelial-signaling
    node.

    Diagnosis and supportive management. Prenatal ultrasonography was restored
    with NCIT:C222238 and exact PMID:35547535 evidence for identifying deep
    cerebral shunts with markedly dilated venous drainage. Fetal
    echocardiography was restored with NCIT:C16525 and exact PMID:40788723
    evidence for cardiac-output measurement. Magnetic resonance angiography was
    restored with NCIT:C190557 and exact PMID:35547535 evidence for the shunt and
    alternative deep-venous-drainage anatomy that distinguish a genuine VOGM.
    A preferred-only Bicêtre neonatal evaluation-score assessment was added from
    PMID:38747605. It is PARTIAL and explicitly does not infer score components,
    thresholds, or validation absent from that source. Long-term
    neurodevelopmental rehabilitation was added as the only new supportive
    treatment, using exact PMID:31713850 text that survivors with learning-related
    neuropsychological disorders may require rehabilitation or medical
    management. It is PARTIAL, specifies no unsupported drug or rehabilitation
    protocol, and makes no efficacy claim.

    Epidemiology decision. No `prevalence` record was added. The notes now state
    that no population-based incidence estimate could be verified in the cached
    sources reviewed for this entry. They also preserve why the prior 30 percent
    figure remains excluded: it described VOGM as a share of pediatric vascular
    malformations, not population prevalence or incidence. No category fraction
    was relabelled as a population measure.


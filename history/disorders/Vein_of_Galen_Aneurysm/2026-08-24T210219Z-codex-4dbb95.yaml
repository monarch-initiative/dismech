  summary: 'Review: Vein of Galen malformation'
  details: |
    Scope and outcome. Deep review covered every content section plus evidence,
    schema fit, ontology precision, graph and phenotype connectivity, genetics,
    diagnosis and structured imaging, treatments, models, datasets, and trials.
    The independently reviewed content bundle was pinned and APPROVED at the
    exact four-file aggregate
    25b00a07eb5d05b1d19b64afbf205c3d286a572b41b2e64b0ef8e279f5f03a26.
    The first pinned audit rejected four calibration issues; the target-only
    repair removed the scalp-vein frequency category and diagnostic overclaim,
    made the predominant venous-absorption account of hydrocephalus explicitly
    provisional while allowing obstructive, haemorrhagic, and ex-vacuo routes,
    removed unrelated untreated-lethality evidence from that phenotype, and
    removed HHT from the differential. The repaired bundle then received pinned
    independent approval. No reference cache changed during that repair.

    Naming, mechanism, genetics, and graph. The preferred name is now Vein of
    Galen malformation while the same MONDO:0015196 entity and its exact ontology
    label are retained. Category and creation date were checked and left
    unchanged. The molecular direction was corrected: loss of RASA1 negative
    regulation and impaired EPHB4 kinase-dependent control are compatible with
    increased downstream Ras/ERK/MAPK activity, not a uniform failure of Ras
    signaling. The graph is atomic: dysregulated endothelial developmental
    signaling leads to impaired developmental angiogenesis and arteriovenous
    specification, then to the persistent embryonic shunt, which branches into
    high-output overload, cerebral venous hypertension, and arterial steal.
    EPHB4 and RASA1 are susceptibility genes; ACVRL1 is a probable susceptibility
    gene supported by pedigree and zebrafish evidence; NOTCH1, ITGB1, and PTPN11
    remain candidates with UNKNOWN relationships. All six gene descriptors are
    attached to the upstream mechanism. Pooled fractions from mixed cerebral
    high-flow shunts and the inference of 50 percent disease recurrence were
    removed; autosomal-dominant transmission applies only to a gene-associated
    subset, and disease recurrence remains unquantified.

    Phenotypes, diagnosis, and clinical scope. All nine phenotypes have incoming
    mechanistic edges. Cutaneous vascular lesions were added with the heterogeneous
    cohort category preserved rather than forced to a narrow HPO code. The 45
    percent face-and/or-scalp composite is PARTIAL upper-bound context only for
    prominent scalp veins and does not support a frequency band. Hydrocephalus
    retains its direct 48 percent cohort observation but not irrelevant lethality
    evidence. Fetal MRI and catheter angiography were added to diagnosis, with
    structured findings for a wide falcine sinus as a prognostic fetal-MRI sign
    and direct arterial shunting to the median prosencephalic vein as the defining
    angiographic finding. Preferred-only terms were used where no precise forced
    ontology code was defensible. The differential is restricted to anatomical
    mimics: pial arteriovenous fistula draining into an enlarged vein of Galen and
    dural arteriovenous fistula of infancy. HHT remains only in supported
    etiologic and syndromic genetic context.

    Models, treatment, trials, and open questions. The three in-vivo models were
    retained with calibrated fidelity and retargeted to the developmental
    angiogenesis node. A COS-7 EPHB4 cell-line model was added as IN_VITRO,
    NCBITaxon:9534, preserving abundance and decay while losing detectable
    phosphotyrosine; its mechanistic link is LOW fidelity. Endovascular treatment
    evidence now distinguishes staged postnatal embolization from fetal
    intervention and records shunt-closure and safety results without treating
    long-term uncertainty as efficacy. The second-hit discussion proposes matched
    deep DNA sequencing of coil-sampled lesional endothelium and blood; the cited
    endoluminal-biopsy study established sampling and single-cell feasibility, not
    a positive somatic-DNA result.

    Official live ClinicalTrials.gov metadata was reconciled on 2026-08-24 and
    retained exactly even where other summaries differed. NCT04434729 is phase
    NOT_APPLICABLE and ACTIVE_NOT_RECRUITING, verified 2025-12, with seven actual
    participants, actual primary completion 2024-09-06, estimated overall
    completion 2026-08, `hasResults` true, results first posted 2026-01-06, and
    the primary fetal-intervention results publication PMID:40788723.
    NCT07483255 is phase NOT_APPLICABLE and RECRUITING, verified 2026-07, with an
    actual start date of 2026-07-20 and estimated enrollment of 20. Registry
    status, not a secondary report, controls these structured values.

    Dataset and prevalence decisions. No stable public accession for a reusable
    VOGM-specific dataset was verified, so no dataset record was invented. The
    prior proportion of VOGM within a broader vascular-malformation category was
    removed because it is neither population prevalence nor incidence; no
    unsupported replacement rate was added.

    Eligibility and collision provenance. Authoritative live main, the isolated
    worktree HEAD, and origin/main were pinned to
    ffa3f27226a4ab879a4da2f95e04a3e305613239; the upstream target SHA256 was
    abd42e9e85413a591fb5d4e99e66415c9ba1b9e00cd46447a91ebde03db6840d.
    Existing histories were evaluated with `events[].type == REVIEW` and
    `target.superseded_by.path // target.path`; the effective REVIEW count was
    zero. The stable exhaustive OPEN-PR scan enumerated 218 PRs on explicit pages
    100 + 100 + 18 + 0, inspected both filename and previous_filename, and found
    no target collision. API file enumeration returned 13,016 records against
    14,744 declared changed files; the two anomalies, PR #7922 and PR #9240, were
    reconciled with exact base...head fallbacks over 7,728 and 4,355 paths,
    respectively, again with zero target hits. Exact case, target-history,
    branch, and worktree absence guards passed before the isolated exact-main
    worktree was created.

    Reference-cache provenance. Each new candidate independently repeated a fresh
    live-main pin, main-path absence check, stable exhaustive 218-PR filename and
    previous_filename scan, declared-count reconciliation, and exact fallback for
    both anomalous PRs before a literal CLEAR and its own `just fetch-reference`:
    PMID:40788723 (fetal-intervention results), PMID:40171650 (fetal-MRI falcine

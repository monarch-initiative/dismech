  summary: 'Create: Vein of Galen Aneurysm (MONDO:0015196)'
  details: |
    New entry from an Edison Falcon deep-research report. Five pathophysiology nodes running failure of endothelial Ras signalling in fetal cerebrovascular development, persistent embryonic arteriovenous shunt, and then three parallel consequences of a single physical fact: high-output circulatory overload, cerebral venous hypertension, and cerebral arterial steal. The parallel structure is deliberate; all three follow from the low resistance of a capillary-free channel rather than from one another. Nomenclature is curated explicitly because the disease name is wrong twice: it is not an aneurysm (no weakened arterial wall, but a direct arteriovenous connection) and the dilated vessel in the true malformation is the embryonic median prosencephalic vein of Markowski rather than the mature vein of Galen. The MONDO label is retained as the disease term while the description and nodes use the accurate anatomy. Scope distinction curated as a differential rather than left implicit: a pial arteriovenous fistula draining into a secondarily enlarged vein of Galen looks similar on imaging and is a different lesion with different anatomy, genetics and interventional risk. Genetics reframed per the 2023 integrated analysis of 310 proband-family exomes with 336,326 cerebrovascular single-cell transcriptomes, which localises susceptibility to developing endothelial cells, placing the disease in a cell type at a developmental moment rather than in a vessel. EPHB4 carries the strongest functional case and is supported by a zebrafish rescue design curated as an animal_models RESCUES link, whose limitations state plainly that the fish has no median prosencephalic vein to persist, so the model tests allele function rather than reproducing the lesion. The outcome literature's key caution is curated on the developmental phenotype and on the treatment: long-term results are less favourable than short- and medium-term assessment suggests, and this holds even without encephalomalacia at birth, so embolization carries PARTIAL as a limit rather than SUPPORT. That deterioration is the entry's KNOWLEDGE_GAP, with a proposed study testing whether later impairment is predicted by residual shunt, interval imaging change, or neither, since neither would itself be the finding. Population incidence figures were NOT curated because they vary several-fold between sources; the prevalence record instead carries the reliably supported proportion of paediatric vascular malformations. Validated: just validate passed; count-verified-snippets 22/22; title audit 22 citations 0 mismatches; check_folded_hyphens and check-title-snippets OK; pytest -k Vein_of_Galen 16 passed.

  summary: Add nine gene-defined AMC subtypes, create the genetic section, and wire
    genes by etiologic branch
  details: |
    Gene-defined subtype enumeration for issue #12232 (genetics-gap series-025).

    Anchor check and scope ruling. Arthrogryposis multiplex congenita is a clinical
    sign, not one disease, and this entry deliberately models it that way. The job
    therefore required deciding, per checklist term, whether it belongs on this
    umbrella at all. MONDO:0015168 is the right anchor and was left unchanged.
    Checking MONDO's own hierarchy separated the checklist cleanly: nine of the
    sixteen terms are direct children of the anchor and carry arthrogryposis in
    their own concept name, and seven sit under different MONDO parents.

    Added as has_subtypes rows (9), each with a bound MONDO subtype_term, a bound
    gene, a description and exact-quote evidence: AMC1 LGI4 (MONDO:0060486), AMC2
    ERGIC1 (MONDO:0008823), AMC3 SYNE1 (MONDO:0032778), AMC4 SCYL2 (MONDO:0032903),
    AMC5 TOR1A (MONDO:0100218), AMC6 NEB (MONDO:0030281), AMC7 THOC2
    (MONDO:0975826), MYBPC1-related non-lethal AMC (MONDO:0044682), and LAAHD GLE1
    (MONDO:0012750). These are the nosologic subdivision of this exact concept, not
    separate diseases that merely feature contractures, so adding them makes the
    umbrella's own subdivision explicit rather than converting it into a single
    etiologic disease.

    Declined, with reasons recorded in the entry notes (7): fetal akinesia
    deformation sequence 1, 2 and 3 (MUSK, RAPSN, DOK7) sit under MONDO:0008824, not
    under this term, and all three genes are already curated with bound MONDO
    subtype terms on Congenital_Myasthenic_Syndrome as CMS9, CMS10 and CMS11, of
    which the fetal-akinesia presentations are the severe prenatal end; FADS4 (NUP88)
    sits under the same separate parent and is not a neuromuscular-junction gene,
    and has no curated home here yet, but a row on this umbrella would not be one;
    SMABF1 and SMABF2 (TRIP4, ASCC1) sit under MONDO:0000209 and belong to the
    spinal muscular atrophy space, where X-Linked_Infantile_Spinal_Muscular_Atrophy
    already carries SMABF2 as a differential; van den Ende-Gupta syndrome (SCARF2) is
    dual-parented under multiple congenital anomalies/dysmorphic syndrome, is
    diagnosed on blepharophimosis and arachnodactyly rather than on contractures, and
    is already curated as a differential of
    Congenital_Heart_Defects_and_Skeletal_Malformations_Syndrome.

    genetic: section created. The entry previously had none at all, so every causal
    gene for this concept was absent from any gene query. Nine records were added,
    each with a gene_term, relationship_type CAUSATIVE, a subtype foreign key that
    resolves, and verified snippets.

    Pathograph: three etiologic-branch nodes were added upstream of the existing
    "Etiology-specific fetal hypomobility or akinesia" node, so each gene reaches
    the movement-dependent chain through the branch it actually acts in rather than
    as a flat list: Primary skeletal muscle etiologic branch (MYBPC1, NEB, SYNE1),
    Peripheral nerve and anterior horn cell etiologic branch (LGI4, ERGIC1, GLE1),
    and Central nervous system etiologic branch (SCYL2, TOR1A, THOC2). The three-way
    split is not invented for this entry: a 315-family cohort of undiagnosed AMC
    reports primary skeletal muscle involvement as the most frequent cause at 40%,
    followed by brain at 22%, and that sentence is cited on two of the three nodes.
    All three nodes are marked mechanism_confidence PROVISIONAL, consistent with the
    entry's existing caution about the akinesia pathway.

    Two label-versus-phenotype mismatches are recorded rather than silently
    followed. MONDO and OMIM label AMC4 (SCYL2) "neurogenic", but the reported
    phenotype is central (microcephaly, agenesis of the corpus callosum, optic
    atrophy), so it is wired to the brain branch and the description says so.
    MONDO:0060486 is labelled "arthrogryposis multiplex congenita 1" but is filed
    under hypomyelination neuropathy-arthrogryposis syndrome rather than directly
    under the AMC parent; that is noted in the AMC1 row.

    A published disagreement with the MONDO/OMIM split is recorded in the LAAHD row:
    the authors of the GLE1 spectrum report argue that LCCS1 and LAAHD are not
    sufficiently differentiated clinically or molecularly to be treated as separate
    allelic disorders, and report a patient surviving to 12 years, contradicting the
    previously reported uniform perinatal lethality. LCCS1 remains curated under
    Lethal_Congenital_Contracture_Syndrome; both homes are cross-referenced.

    Caveats preserved rather than smoothed over: the NEB series resolved two
    pathogenic alleles only in the Ashkenazi Jewish family, with a single
    heterozygous mutation detected in each of the other two; AMC7 (THOC2) rests on
    two male fetuses of one family.

    The entry notes previously stated that it "intentionally omits prevalence,
    inheritance, and a gene list". That sentence became false the moment a gene list
    was added, so it was rewritten rather than left to rot, and now carries the
    inclusion rule and all seven declines.

    Validation: just validate passes with 101/101 snippets verified against cached
    references; validate-terms, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values and
    list-gene-term-mismatches all clean.

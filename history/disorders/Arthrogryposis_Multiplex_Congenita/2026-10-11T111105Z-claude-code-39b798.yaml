  details: |
    Merged current main. Bound GO:0048018 receptor ligand activity on Peripheral nerve hypomyelination, licensed by the node's existing PMID:28318499 snippet that LGI4 is a secreted ligand acting through its receptor ADAM22; no modifier asserted. The remaining AMC genes were added to tests/gene_activity_grounding_baseline.txt. ERGIC1 deliberately binds nothing (its function is stated only as a possible role in ER-Golgi transport). GLE1, MYBPC1, NEB, SYNE1, SCYL2, TOR1A and THOC2 sit on etiologic-branch nodes; their cited sources describe gene products and phenotypes but do not license a molecular function for each gene, and splitting the two multi-gene branch nodes into per-gene nodes was left to the author because without a sourced MF per gene the split would not change what the gate checks.

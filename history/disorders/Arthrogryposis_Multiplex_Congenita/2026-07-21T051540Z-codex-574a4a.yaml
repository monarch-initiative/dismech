  summary: 'Review: Arthrogryposis Multiplex Congenita umbrella-syndrome curation'
  details: |
    Reframed AMC as a descriptive multi-region congenital-contracture phenotype with heterogeneous etiologies. Removed umbrella-level inheritance, gene, prevalence, and universal fetal-akinesia claims. Added evidence-backed clinical pattern boundaries, prenatal and postnatal etiologic evaluation, variable burden and course, bounded fetal-immobility and Amyoplasia tissue branches, connected phenotypes, cautious management, differential boundaries, animal models, and explicit interpretation and knowledge-gap records. Added exact PubMed title and snippet evidence and generated every new reference cache through the repository fetch workflow.

  summary: 'Review round 1: split the bundled nerve/anterior-horn node and correct
    the MONDO parentage note'
  details: |
    Review round 1 on PR #12669, addressing the ai4c-reviewer CHANGES_REQUESTED verdict.

    Split the bundled "Peripheral nerve and anterior horn cell etiologic branch" node into three. That node carried LGI4, ERGIC1 and GLE1 together under GO:0032290 peripheral nervous system myelin formation DECREASED in Schwann cells, so the graph asserted a Schwann-cell myelin lesion for GLE1 and ERGIC1 that no cited source supports. It is now: "Peripheral nerve hypomyelination" (LGI4, GO:0032290 DECREASED, CL:0002573 Schwann cell, the three PMID:28318499 snippets); "Anterior horn motor neuron loss" (GLE1, GO:0021522 spinal cord motor neuron differentiation DECREASED, CL:2000048 anterior horn motor neuron); and "ERGIC1-associated etiologic branch" (ERGIC1, no process and no cell type bound). All three point downstream to "Etiology-specific fetal hypomobility or akinesia" as the single node did. The old node name appears in the 2026-09-24T102350Z record on this entry; that record is left as written, being append-only.

    Sourced the anterior horn node on PMID:18204449 (Nousiainen 2008, already cached for Lethal_Congenital_Contracture_Syndrome), which gives the LCCS1 neuropathology ("lack of anterior horn motoneurons, severe atrophy of the ventral spinal cord") as a BACKGROUND quote and the GLE1 identification as a PRIMARY_RESULT quote. The bound process is differentiation rather than a degeneration term because the authors read the lesion as an early block in the development and survival of anterior motoneurons.

    Left the ERGIC1 node unbound to any cell type or biological process, and recorded in node notes what was searched: a PubMed title/abstract query for ERGIC1 returns 17 records, three of which concern arthrogryposis (PMID:28317099, PMID:34037256, PMID:42140882), and none reports nerve or muscle histology. Added PMID:34037256 (Marconi 2021) as a new reference: it independently establishes ERGIC1 causation with a loss-of-function mechanism, and states that careful neurological examination of the two siblings never pointed towards a neuromuscular disorder, which is the direct source for declining a nerve lesion here.

    Corrected the entry notes. The claim that all nine gene-defined rows are entities "MONDO places directly under this term" was wrong: OLS confirms MONDO:0015168 has 24 direct children, and MONDO:0060486 (AMC1) is not among them - it sits under MONDO:0700428 hypomyelination neuropathy-arthrogryposis syndrome, itself a direct child. Eight direct children plus AMC1 as a grandchild. The same check showed MONDO:0008824 fetal akinesia deformation sequence is itself a direct child of this term, so the declined-concepts paragraph was reworded from "not under this term" to "grandchildren rather than rows here".

    Removed the curation-session narrative from notes per the CLAUDE.md rule that notes is not a session log: "The entry previously carried no gene list at all. It now carries...", "reviewed during that pass", and "Recording these as declined, with the reason, is the curation outcome; it is not an omission." The per-term reasons for declining each of the seven concepts are kept in full.

    Validation: validate, validate-terms, count-verified-snippets (226/226 over both entries), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches (0 findings, 81 bindings confirmed), check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-case-collisions, check-coarse-phenotypes, check-genereviews (NO_CHAPTER, unchanged), validate-disorders.

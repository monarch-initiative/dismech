  summary: Re-cite the GLE1 anterior horn node around the stale full-text guard
  details: |
    Repaired the two reference-validation errors that made this PR red in CI, without removing the Anterior horn motor neuron loss node or any of its claims. Both errors were on PMID:18204449 (Nousiainen 2008, Nat Genet), whose cache is content_type full_text_html. Under linkml-reference-validator 0.3.0rc1 (dismech#12672) a stale HTML body is refused and validation falls back to the re-fetched PubMed abstract, so the two quotes taken from that paper's introduction and closing paragraph no longer resolve. Neither quote was decorative: they were added one commit earlier to source the anterior horn motor neuron cell type and the motor neuron differentiation process on the node that was split out of the bundled peripheral nerve node during review. The refreshed abstract was read first for both. It carries the paper's own conclusion that mRNA processing is a critical molecular mechanism in motoneuron development and maturation, so the differentiation evidence item was requoted from the abstract and the citation kept. It contains neither the word anterior nor the word horn, so the neuropathology item could not be requoted from it and was re-cited instead to PMID:7821908 (Vuopala 1995, Hum Pathol), the autopsy series that delineated LAAHD, one of the two GLE1-related AMC subtypes. That cache is abstract_only and carries extractor_version 1, so it is not exposed to the same regression. The new snippet reports both halves of the node in a single sentence, a paucity of anterior horn motor neurons in the spinal cord of the twelve infants studied and neurogenic muscular atrophy in all of them, and it is a primary autopsy result rather than a background sentence restating other work, so the node is better sourced than before. The node description was updated to track the abstract wording and the new autopsy source. In doing so a claim that the defect is an early block in development and survival rather than degeneration of neurons that formed normally was dropped: it rested only on the withheld full text and is contradicted by PMID:7897624, which describes LCCS as early onset degeneration of the anterior horn motor neurones. The explanation on the existing PMID:27684565 item was adjusted because that item is no longer the licence for the anterior horn cell type binding, only the link between GLE1 and LAAHD. No phenotype, pathophysiology node, gene binding or ontology term was removed. Branch rebased onto main to pick up the 0.3.0rc1 lockfile floor, since the stale 0.2.1 venv reports a green result that is not the CI verdict. Validated under 0.3.0rc1: validate-disorders clean over both entries, 226/226 snippets verified, terms, entity refs, causal targets, duplicate keys, enum values, gene term mismatches, snippet length, title snippets, snippet grading, folded hyphens and reference titles all green.

  summary: 'Review round 3 on PR 12669: revert the unsourced molecular_functions bindings'
  details: |
    Review round 3 on PR #12669. The reviewer blocked the same item twice and the intervening push changed neither entry, only merging main. Both entries are restored to 9afcd35dd, the content the reviewer approved, removing 81 lines of node-level molecular_functions added afterwards. The bindings were unsourced, and because molecular_functions sits at node level while these nodes list several genes, each function was attributed to all of that node's genes. Verified the sharpest case rather than taking it on the reviewer's word: the Primary skeletal muscle etiologic branch node lists MYBPC1, NEB and SYNE1 and carried actin binding and myosin binding; those are MYBPC1 and NEB functions, SYNE1 is a nesprin whose lesion is loss of its KASH domain, and grep found zero snippets anywhere on that node mentioning actin or myosin. Three molecularfunctionterm enum rows the bindings had introduced (GO:0004703, GO:0005102, GO:0030276) are each used nowhere in kb/ on this branch, so that cache file is taken from origin/main; validate-terms still passes on both entries. Main was merged to clear a cache/hgnc/terms.csv conflict, resolved as a union with no row dropped. Consequence that needs a decision and is recorded on the PR: check-gene-activity-grounding, which is in just qc, now reports 27 new findings on this branch - the 9 AMC and 18 Jeune genes whose landing nodes no longer name a molecular function - and no other entry. Clean main is green on that gate when compared the way CI compares (--against-ref origin/main), and the gate prints 'Grandfathering is unavailable when checking against a ref', so the reviewer's prescribed fix cannot pass CI as given. The underlying defect the gate and the reviewer both point at is the same many-gene bundle node; the proper repair is splitting those nodes so each gene lands on its own node with its own sourced molecular function, which is more than a review round. Validation: just validate passes on both entries, count-verified-snippets 226/226 after reverting validator cache churn, and check-duplicate-keys, check-entity-refs, check-causal-targets, check-folded-hyphens, check-enum-values, check-case-collisions and check-term-cache-integrity are all clean.

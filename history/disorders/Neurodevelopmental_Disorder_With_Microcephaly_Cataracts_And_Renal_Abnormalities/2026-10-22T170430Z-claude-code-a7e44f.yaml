  summary: 'Create: Neurodevelopmental_Disorder_With_Microcephaly_Cataracts_And_Renal_Abnormalities'
  details: |
    New entry for GEMIN4-related NEDMCR (MONDO:0060664, OMIM:617913). Sources: the 16-patient Saudi series (PMID:35861185), the p.His147Arg sibship with full clinical and MRI detail (PMID:35052432), the pediatric cataract genomics cohort that confirmed GEMIN4 with p.Pro105Leu and reported lens expression (PMID:27878435), the founding candidate-gene study (PMID:25558065, abstract only), the autozygome confirmation study (PMID:30237576), and GEMIN4 functional papers (PMID:10725331, PMID:16301532, PMID:29371219, PMID:11914277). Clinical details of the founding p.Trp818Arg families are quoted from the discussion of PMID:35052432 and marked quote_role BACKGROUND because the PMID:25558065 cache is abstract only and no PMC full text exists.

    Deep research: one OpenScientist run, committed as research/Neurodevelopmental_Disorder_With_Microcephaly_Cataracts_And_Renal_Abnormalities-deep-research-openscientist.md. Reference validation 8/8 resolved, 13/14 quotes matched (the one miss is a paraphrased title of PMID:35052432, not used). Term validation flagged NCIT:C15335, NCIT:C15917 and NCIT:C15317 as naming different concepts and UBERON:0000340 as nonexistent; none were used. just preflight-dr returned PASS (GEMIN4 mentioned 48 times, OMIM 617913 matches). The report was used as leads only; every claim here cites a fetched PMID with an exact snippet (66/66 verified).

    Not curated: the report lists renal hypoplasia, hydronephrosis, nephrocalcinosis, renal artery stenosis, aminoaciduria, electrolyte disturbances, GERD, epiphyseal dysplasia, hip dislocation, optic atrophy and splenomegaly from the OMIM/HPO annotation of OMIM:617913. None of these appears in any cached source text, so they were left out rather than cited to the report. ClinVar-only variants named in the report (p.Lys76Glu, p.Phe125fs) were also left out.

    Mechanism: the SMN complex snRNP assembly node is HYPOTHETICAL and deliberately unconnected to phenotypes, because no study has measured snRNP assembly or splicing in patient cells (the authors of PMID:35052432 state the link is unclear). Neurological phenotypes are connected through a PROVISIONAL neuronal-deficiency node supported by the fly neuronal knockdown in PMID:35861185. Cataract is connected through a HYPOTHETICAL lens node based on mouse lens expression data. Renal, skeletal and craniofacial phenotypes are unconnected (14/26 phenotypes connected). Four discussions record the gaps (SMN complex link, miRNP role, renal and lens mechanism, absence of a hypomorphic vertebrate model). No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER).

  summary: 'Create: Bowen-Conradi_Syndrome'
  details: |
    New entry for Bowen-Conradi syndrome (MONDO:0008879), the Hutterite founder ribosomopathy caused by homozygous EMG1 p.Asp86Gly. Curated from primary literature retrieved through PubMed (clinical series PMID:484596 and PMID:12838567, linkage PMID:15578624, gene discovery PMID:19463982, patient-cell, yeast and biochemical studies of EMG1/Nep1, the null, D86G knock-in and surface-ectoderm conditional mouse models) plus the Orphanet record ORPHA:1270 and the ClinGen Strong (AR) validity assertion. The pathograph runs from D86G protein instability and proteasomal degradation, through reduced nucleolar recruitment (with a refuting patient-fibroblast result recorded) and delayed 18S rRNA maturation, to a TP53-independent proliferation and mitotic defect in rapidly dividing cells, and then to impaired brain growth and global growth failure, ending in microcephaly, psychomotor delay and pre- and postnatal growth retardation. Death in infancy is recorded under progression because HP:0001522 is outside the PhenotypeTerm enum. The entry does not conform to the pol1 nucleolar stress module because the EMG1 proliferation defect is reported as p53-independent. One OpenScientist deep-research report was used: 18/18 references resolved, 0 off topic; needs_review was set by term-label mismatches, mostly table-column artifacts, plus three wrong NCIT treatment CURIEs (C133419, C15277, C47384) that were not used. Its claims matched the primary-literature draft; it added PMID:25799636 (first molecularly confirmed case). Its bone marrow failure phenotype and its statement that delayed SSU biogenesis is demonstrated to cause the G2/M arrest were not adopted as stated: bone marrow failure is mentioned in notes only, and the SSU-to-proliferation edge is marked indirect. PMID:21087996 and PMID:22588997 from the report were not needed. just preflight-dr exited 2 because the local MONDO build is absent; the report names EMG1 in its first paragraph and discusses no other gene. No GeneReviews chapter exists (check-genereviews --online NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (75/75), validate-disorders, and the entity-ref, causal-target, coarse-phenotype, logical-rule, snippet, title and duplicate-key gates.

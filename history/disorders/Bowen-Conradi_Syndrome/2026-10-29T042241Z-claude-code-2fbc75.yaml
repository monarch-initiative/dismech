  summary: 'Review round 1: Bowen-Conradi_Syndrome evidence grading'
  details: |
    Addressed the automated review of PR 15899. The PMID:25708872 sentence naming the c.257A>G founder variant comes from the background of a mouse study and states human genetics, so it is now HUMAN_CLINICAL with quote_role BACKGROUND. On the edge from reduced proliferation to impaired prenatal brain growth, the PMID:26676230 introduction sentence about CNS involvement was replaced by the discussion sentence in which the authors extrapolate from their patient-lymphoblast proliferation data to rapidly proliferating embryonic cells and developmental delay; it is kept IN_VITRO with directness INDIRECT because the inference rests on cultured-cell data. The PMID:26676230 introduction items graded HUMAN_CLINICAL (average age at death, common physical manifestations, not found outside the Hutterites) now carry quote_role BACKGROUND. The Orphanet joint stiffness row was moved off the flexion contracture phenotype onto a new Joint Stiffness phenotype (HP:0001387, very frequent), which also cites joint limitation from the 1979 Hutterite series. Abnormal lung lobation was not added because it would be an unwired, Orphanet-only occasional finding, and no supportive-care treatment was added because no quotable source describes one. Re-validated with validate, validate-terms, count-verified-snippets (76/76), check-snippet-grading, check-coarse-phenotypes, check-causal-targets, check-entity-refs and validate-disorders.

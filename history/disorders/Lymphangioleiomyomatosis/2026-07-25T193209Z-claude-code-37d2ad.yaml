  details: |
    Manual claim-evidence review. Fixed: (1) the Pneumothorax and Chylothorax phenotypes were supported only by PMID:31729820, an n=12 post-LUNG-TRANSPLANT cohort - i.e. complications after transplantation being used to evidence the native-lung natural history - added the ATS/JRS guideline PMID:29140122 pneumothorax recommendation as the primary support and downgraded the transplant cohort to PARTIAL with its limitation stated; (2) both prevalence records used the deprecated free-text percentage field - replaced with rate_per_100000 and moved the verbatim phrasing into notes (the existing rate_low/rate_high normalisations, 3-8 per million -> 0.3-0.8 and 30-40% -> 30000-40000, were checked and are correct).
    Verified as correct, no change: the conforms_to target deregulated_nutrient_sensing#mTORC1 Hyperactivation resolves; the Renal Angiomyolipoma FREQUENT band matches the cited 60% figure.
    Remaining gaps not fixed: the TSC1 genetic entry has no evidence; Hemoptysis, Cough and Chronic Respiratory Failure have no evidence.

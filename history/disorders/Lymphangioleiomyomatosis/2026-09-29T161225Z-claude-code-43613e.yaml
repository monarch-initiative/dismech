  summary: Bind ESR1 on the estrogen-driven LAM cell survival node
  details: |
    Fifth tranche of the estrogen-signalling pathograph work in issue #12925.
    The Estrogen-Driven LAM Cell Survival and Dissemination node bound
    GO:0030520 with modifier INCREASED and named no gene. It now carries genes:
    ESR1 (hgnc:3467) and a molecular_functions descriptor bound to GO:0030284
    nuclear estrogen receptor activity, modifier INCREASED. The receptor is
    structurally normal; the lesion is TSC2, bound on the upstream node, and the
    estrogen signal is ligand acting on an intact receptor in a cell the lesion
    has made responsive to it.

    Evidence, two items. PMID:19202070 (fetched and cached) is the primary
    mouse xenograft study showing estradiol enhances the survival and lung
    colonization of detached tuberin-null cells through a MEK-dependent
    pathway; graded MODEL_ORGANISM. Before this change the node cited evidence
    only for the benign-metastasis model, not for estrogen driving it, so this
    item closes a gap in the node's own claim as well as grounding the
    direction. PMID:28410230 (fetched and cached) names the receptor: it places
    the estradiol effect on TSC2-null LAM patient-derived cells in the estrogen
    and ERalpha signaling pathway, with proliferation, apoptosis, migration and
    invasion readouts. Graded IN_VITRO, quote_role PRIMARY_RESULT, directness
    INDIRECT, because the study's direct subject is IGFBP2 as an effector in
    that pathway rather than a measurement of the receptor.

    ESR2 is deliberately not bound, and the node's notes say why: the first
    cultured LAM-associated angiomyolipoma cells expressed estrogen receptor
    alpha, beta and androgen receptor (PMID:12922981, fetched and cached, cited
    in notes only), so expression alone would justify both paralogues, but the
    mechanistic work on estrogen-driven survival and dissemination attributes
    the signal to the alpha receptor and no LAM study read for this node
    attributes it to the beta receptor. Binding ESR2 would assert a mechanistic
    role the sources do not report.

    The deep-research report for this disease (claude_code) was read first. It
    is the one report in this tranche that names the receptor, giving ERalpha
    synergy with mTORC1 and ERalpha/PgR positivity of LAM cells, but it cites
    those facts by PMC identifier and secondary source rather than by PMID, so
    it served as the lead and PubMed title searches resolved the primary
    sources quoted here.

    Checks: validate, validate-terms and count-verified-snippets passed on the
    file; validate-disorders over the whole tranche passed; list-gene-term-
    mismatches compared every gene binding in the four files against HGNC with

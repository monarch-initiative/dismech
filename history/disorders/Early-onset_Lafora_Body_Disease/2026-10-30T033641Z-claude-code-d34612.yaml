  summary: 'Create: Early-onset Lafora Body Disease'
  details: |
    Created a Disease entry for early-onset Lafora body disease (EPM10, MONDO:0014717), kept separate from Lafora_Disease because the causal gene (PRDM8), the MONDO placement and the clinical course differ. The pathograph runs from the PRDM8 Phe261Leu gain of function, through excess nuclear sequestration of laforin and malin, to polyglucosan Lafora body formation and neurodegeneration, then to five phenotypes. The two family reports (PMID:22961547, PMID:35034233) are the only PRDM8 disease literature in PubMed and both are cached as abstracts. The step from Lafora bodies to neurodegeneration reuses two Lafora disease mouse-model references already cached, graded INDIRECT. Snippets 28/28 verified; terms, entity references and causal targets validate.

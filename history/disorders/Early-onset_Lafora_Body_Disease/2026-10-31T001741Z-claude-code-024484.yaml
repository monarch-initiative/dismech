  summary: 'Review round 1: Early-onset Lafora Body Disease'
  details: |
    Addressed review round 1 on PR 16097. Added the three MONDO synonyms (EPM10 and the two progressive myoclonic epilepsy 10 forms), after which check-genereviews reports NO_CHAPTER for every name. Removed claims the two abstracts do not support: consanguinity, homozygosity, zygosity HOMOZYGOUS on the root node, and FREQUENT frequencies on three phenotypes. Dropped Lafora_Disease from parents and added a disease_term to the Lafora disease differential. Bound GO:0140311 protein sequestering activity on the PRDM8 node, which fixes the newly-ungrounded-gene gate. Ran an OpenScientist deep-research report (the falcon provider was not available). It gives no sourced answer to the Iranian variant, the positive Lafora-body tissue, or seizures and cognitive decline, and its ClinVar variant conflicts with the founding abstract, so notes record that nothing was adopted from it. Neither paper has machine-readable full text, which notes also record.

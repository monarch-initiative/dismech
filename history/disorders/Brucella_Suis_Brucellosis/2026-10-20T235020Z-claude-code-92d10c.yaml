  details: |
    Addressed the changes-requested review on PR #14911. Committed a fresh claude_code deep-research report (research/Brucella_Suis_Brucellosis-deep-research-claude_code.md plus citations sidecar) because the entry was originally built from a lost OpenScientist fallback run that was never committed; the new report is stamped, term/reference-validated (0.0 confabulation), and lets the completeness checklist run. Removed PMID:26959235 (marine-mammal B. pinnipedialis study) and its cache from the inflammation node: the quoted sentence described the marine-mammal strain, not B. suis 1330. Renamed the Granulomatous Brucella suis Inflammation node to Systemic Brucellosis Inflammatory Syndrome (dropping the unsupported granulomatous claim) and re-grounded it on the genus-level human-clinical systemic-infection sentence from PMID:29621840. Connected all phenotypes (Fever, Fatigue, Arthralgia, Depression) via downstream edges from the inflammation node and added a Focal Organ Complications node; phenotype causal-inlink coverage is now 4/4. Added a Depression phenotype with no frequency band (the source is qualitative, no counted denominator). Added a progression block (acute -> relapse/chronic) clearing the §3e NO_PROGRESSION flag. Added conforms_to intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion on the Intracellular Macrophage Survival node and directness: INDIRECT on the B. abortus VirB evidence. Moved the original curation-run session log out of the entry notes into history. A sibling parent-pointer-subtype row was added to Brucellosis.yaml (recorded separately).

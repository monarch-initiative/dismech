  summary: Record FAME5 (CNTN2) as a deliberate scope exclusion
  details: |
    Issue 11562 reported that FAME5 (MONDO:0014167, CNTN2) was dispositioned by omission: PR 11524 deleted the lumped FAME stub because the repeat-positive spectrum was curated, and the CNTN2 locus then appeared in neither kb/ nor stubs/. PR 11560 re-seeded stubs/Epilepsy_Familial_Adult_Myoclonic_5.yaml, which restored the queue half; this session records the other half inside the entry, so a reader of the FAME page sees why CNTN2 is absent from has_subtypes. Three changes: (1) the top-level notes now name FAME5, MONDO:0014167 and CNTN2 as the nonrepeat locus the pre-existing exclusion clause was about, and point at the stub; (2) a differential_diagnoses record 'Autosomal recessive CNTN2-related cortical myoclonic tremor and epilepsy' carrying the primary report (PMID:23518707, exact-quote frameshift finding) and the FCMTE systematic review that excluded recessive FCMTE from its dominant-pedigree case set (PMID:29416935); (3) an OPEN_QUESTION discussion oq_fame5_cntn2_entity_status recording what the exclusion does not settle, namely whether the single-pedigree CNTN2 assignment is an entity at all, evidenced by the reporting study's own negative screen of 189 further epilepsy patients and by its hedged causal conclusion. No subtype, pathophysiology node, phenotype, or ontology binding was added or changed; the entry's scope to the TTTCA pentanucleotide repeat mechanism is unchanged. Validation: just validate passed with 61/61 snippets verified, just validate-terms passed, duplicate-key, entity-ref, causal-target, qualifier-term, enum-value, folded-hyphen and snippet-length checks all clean. Two references were newly fetched with just fetch-reference (PMID:23518707, PMID:29416935) and are committed.

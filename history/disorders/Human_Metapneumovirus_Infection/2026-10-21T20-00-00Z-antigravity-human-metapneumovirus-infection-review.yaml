  summary: Comprehensive deep review and clinical/diagnostic enrichment for Human Metapneumovirus Infection
  details: >-
    - Added `progression` covering the 3-to-5-day incubation period (`incubation_days: 3-5`, PMID:40034641) and primary childhood infection with near-universal seropositivity by age 5, lifelong reinfection, and disease in older/immunocompromised adults (PMID:11385510, PMID:40034641).
    - Upgraded PMID:40034641 review evidence items across `progression`, `transmission`, `phenotypes`, `diagnosis`, `treatments`, and `differential_diagnoses` to `evidence_source: HUMAN_CLINICAL` with `quote_role: REVIEW_SYNTHESIS`.
    - Added verbatim literature evidence from PMID:40034641 to `Cough` (`HP:0012735`) and `Fever` (`HP:0001945`), added `Rhinorrhea` (`HP:0031417`) and `Acute otitis media` (`HP:0000371`), and wired `Rhinorrhea` (`DIRECT`) and `Acute otitis media` (`INDIRECT_UNKNOWN_INTERMEDIATES`) into the `pathophysiology` causal graph.
    - Added `diagnosis` entries for `Reverse transcription polymerase chain reaction` (`NCIT:C17003`) and `Chest radiography` (`NCIT:C38103`) supported by PMID:40034641.
    - Added `target_mechanisms` (`Fever` and `Lower Respiratory Tract Involvement`), `target_phenotypes`, and verbatim evidence (PMID:40034641) to `Supportive Care` in `treatments`.
    - Added `differential_diagnoses` (`Respiratory syncytial virus infection`, `MONDO:0001577`) backed by PMID:40034641 and PMID:11385510.

  summary: 'Create: TULP1-Related_Retinopathy'
  details: |
    Created TULP1-Related Retinopathy from stub Leber_Congenital_Amaurosis_15 (claim issue 17002). Scope: LCA15 and RP14 lumped in one entry with two has_subtypes rows, following the ClinGen Retina GCEP, which lumped both into TULP1-related retinopathy and curated it against MONDO:0013457 (Definitive, 2025-06-05). disease_term stays MONDO:0013457 because MONDO has no TULP1 spectrum term; the issue's second-opinion comment offered both shapes and the ClinGen record decided it. The entry was first drafted under the stem TULP1-Related_Leber_Congenital_Amaurosis and renamed once the ClinGen record was read; the deep-research report was produced under that stem by `just research-disorder claude_code` and the file was renamed to match the entry, with one edit: four lines of the subprocess's process narration before the report heading ("Heard. Pulling the TULP1 abstracts...", "Rate-limited, likely...") were deleted and the closing sentence's opening phrase "It is written on the tablet:" was replaced by "Checked during the run:"; no research content, citations or identifiers were changed (the run wrote no citations sidecar). Report validation: needs_review true. The three unresolved PMIDs (36128853, 25074776, 9462750) were NCBI HTTP 429 rate-limit failures in the run log; I re-checked all three with E-utilities efetch and just fetch-reference, and all three resolved and are cached and cited. The three unmatched quotes were ellipsis-shortened forms of real abstract sentences. preflight-dr --strict PASS. Further references came from PubMed E-utilities searches on TULP1. Pathograph: 18 pathophysiology nodes, 38 downstream edges (23 node-to-node, 15 to phenotypes), 16 edges cited; 14 of 16 phenotypes causally connected (hyperopia and myopia left unconnected, mechanism unknown). Conformance: photoreceptor_degeneration Photoreceptor Gene Defect, Photoreceptor Metabolic and Oxidative Stress, Rod Photoreceptor Apoptosis, Progressive Visual Field Loss and Blindness; the secondary-cone and ciliopathy nodes were deliberately not conformed (reasons in notes). Eight discussions. GeneReviews: only Overview chapters (TAGGED_OVERVIEW), so phenotypes come from TULP1 case series. Validation: validate, validate-terms, count-verified-snippets 100%, compliance, check-entity-refs, check-conformance-content, validate-disorders.

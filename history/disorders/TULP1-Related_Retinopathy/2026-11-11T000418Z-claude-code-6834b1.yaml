  summary: 'Create: TULP1-Related_Retinopathy'
  details: |
    Created TULP1-Related Retinopathy from stub Leber_Congenital_Amaurosis_15 (claim issue 17002). Scope: LCA15 and RP14 lumped in one entry with two has_subtypes rows, following the ClinGen Retina GCEP, which lumped both into TULP1-related retinopathy and curated it against MONDO:0013457 (Definitive, 2025-06-05). disease_term stays MONDO:0013457 because MONDO has no TULP1 spectrum term; the issue's second-opinion comment offered both shapes and the ClinGen record decided it. The entry was first drafted under the stem TULP1-Related_Leber_Congenital_Amaurosis and renamed once the ClinGen record was read; the deep-research report was produced under that stem by `just research-disorder claude_code` and the file was renamed to match the entry, with one edit: four lines of the subprocess's process narration before the report heading ("Heard. Pulling the TULP1 abstracts...", "Rate-limited, likely...") were deleted and the closing sentence's opening phrase "It is written on the tablet:" was replaced by "Checked during the run:"; no research content, citations or identifiers were changed (the run wrote no citations sidecar). Report validation: needs_review true. The three unresolved PMIDs (36128853, 25074776, 9462750) were NCBI HTTP 429 rate-limit failures in the run log; I re-checked all three with E-utilities efetch and just fetch-reference, and all three resolved and are cached and cited. The three unmatched quotes were ellipsis-shortened forms of real abstract sentences. preflight-dr --strict PASS. Further references came from PubMed E-utilities searches on TULP1. Pathograph: 18 pathophysiology nodes, 38 downstream edges (23 node-to-node, 15 to phenotypes), 16 edges cited; 14 of 16 phenotypes causally connected (hyperopia and myopia left unconnected, mechanism unknown). Conformance: photoreceptor_degeneration Photoreceptor Gene Defect, Photoreceptor Metabolic and Oxidative Stress, Rod Photoreceptor Apoptosis, Progressive Visual Field Loss and Blindness; the secondary-cone and ciliopathy nodes were deliberately not conformed (reasons in notes). Eight discussions. GeneReviews: only Overview chapters (TAGGED_OVERVIEW), so phenotypes come from TULP1 case series. Validation: validate, validate-terms, count-verified-snippets 100%, compliance, check-entity-refs, check-conformance-content, validate-disorders. Review round 1 (ai4c-reviewer on PR 17012): added uniparental isodisomy of chromosome 6 as a second inheritance row (HP:0032382) with PMID:30090012 and PMID:23499059, since the original description enumerated only consanguineous homozygosity and compound heterozygosity and so excluded the two reported UPD6 patients, whose recurrence risk differs; added the Finnish founder evidence (PMID:31087526) to the c.148delG variant row, which previously asserted founder status in free text only; added a perivascular hyperautofluorescence phenotype (HP:0025158) from PMID:38450199 and PMID:34865612 and wired it to outer retinal loss; added three diagnosis rows (SNP array for UPD, SD-OCT, full-field ERG, the last two with needs-term notes where no NCIT term was found) and a three-phase progression section; regraded the two PMID:10892883 evidence items from HUMAN_CLINICAL to IN_VITRO because the study is post-mortem donor-retina immunohistochemistry. Pruned 14 reference caches that no claim cites (PMID:10509669, 11483369, 15180277, 18055821, 19837063, 20065226, 20079931, 22801849, 24547928, 24664737, 31877759, 33187986, 33441055, 39766915); the cited list was re-derived immediately before pruning and each was checked for use elsewhere in kb/. PMID:33441055 (Coats-like vasculopathy) was pruned rather than consumed: its six mutations span CRB1, CNGB1, RPGR and TULP1 across six patients, so no Coats-like feature can be attributed to the TULP1 patient. Snippets after the fixes: 163/163.

  summary: Add mappings, epidemiology and a Harrison's classification
  details: |
    Adds mappings, an epidemiology section and a classifications block. Mappings: ICD10CM:Q33.2
    Sequestration of lung (exact; Orphanet's cross-reference table for ORPHA:3161 lists WHO
    ICD-10 Q33.2 as exact, and ICD-10-CM uses the same code with no subdivision by form);
    icd11f:1833083626 Congenital sequestration of lung (exact; the ICD-11 Foundation entity
    whose exact synonyms include congenital pulmonary sequestration and whose two children are
    the extralobar and intralobar forms; MONDO records an exact match to it, and Orphanet's
    LA75.6 is an MMS code this slot cannot hold); MONDO:0017843 (exact, per Orphanet, with
    MONDO's own exact match to ORDO:3161; the entry's disease_term); and NCIT:C97124
    Bronchopulmonary Sequestration (exact, per MONDO's exact match; NCIT is not in Orphanet's
    table). Validation added label and enum cache rows for the three codes not already cached.
    Epidemiology: the share of congenital lung malformations (0.15-6.4%, a range quoted in a
    1979 review; second commonest per national surveillance), the sex ratio (1.58 to 1 male to
    female in 2625 cases pooled from Chinese literature reports; 0.45 against 0.38 per 10,000 by
    infant sex in surveillance; 18 women and 7 men in a 25-adult surgical series) and age at
    diagnosis (mean 23 weeks' gestation in a fetal series; Orphanet's usual ages for the two
    forms; symptom onset within the first decade in 37.2% and 60% in the 1979 review's
    intralobar and extralobar accounts, graded INDIRECT because the abstract attributes them by
    paragraph; mean age at surgery 38 in the adult series). Classifications: Harrison's
    respiratory Part, quoting Orphanet's definition of the disease as a respiratory malformation
    (ORPHA:3161, newly cached from the 2026-06-23 Orphadata release). Validation: just validate
    passes; all snippets verify.

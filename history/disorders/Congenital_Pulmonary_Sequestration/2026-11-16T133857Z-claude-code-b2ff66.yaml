  summary: Three repairs from the approving review
  details: |
    Three defects the approving review of #17140 named, repaired here rather than pushed to that PR, because a push would have dropped its approval.

    The fetal pleural effusion row was scoped subtype: Extralobar on a sentence that does not confine the effusion to that form. The series reports eight fetuses with hydrothorax and gives no lesion type for them; what it puts in parentheses as extralobar is the hydrops that followed in four of them. The subtype scoping is removed, and the description and explanation now attach the extralobar fact to the hydrops rather than to the effusion.

    The HOXB5 and adhesion-molecule node said it sits in its own hypothesis group. It declares none, none is declared in mechanistic_hypotheses, and the node could not be in one: hypothesis_groups is a slot on a causal edge, and this node asserts no edge. The clause is replaced by what is true, which is that the node has no edges and therefore no hypothesis group.

    The cough and sputum edges from recurrent infection both quoted the paper's conclusion that early onset, recurrent pneumonia, a lower-lobe lesion and aberrant arterial supply are diagnostic indicators. That sentence names neither cough nor sputum. Both now quote the series' own symptom list, and both explanations say plainly that the source lists cough and sputum among the disease's symptoms without attributing them to the infection, so the causal step is an inference rather than a statement the paper makes.

    Validation: just validate passes with 70 snippets and 71 titles verified and no issues.

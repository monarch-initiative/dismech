  summary: Add three histopathology rows for the two forms
  details: |
    Adds three histopathology rows. Type 2 cystic adenomatoid malformation within extralobar
    sequestration (extralobar subtype), from a 50-case pathology series (PMID:10441623): 23 of
    46 cases carried a coexistent malformation, all of the type 2 pattern, 48% of them with
    rhabdomyomatous dysgenesis; the authors find the association more frequent than earlier
    reports and conclude that the combined lesions present differently. Pulmonary
    hypertension-like arterial changes in intralobar sequestration (intralobar subtype): intimal
    proliferation and plexiform lesions as the usual change, stated from earlier work by a 2020
    case report (PMID:31694419), which also counts only one earlier case of arteritis associated
    with local pulmonary hypertension and judges its own arteritis and plexiform lesion to be
    associated with local pulmonary hypertension; a 2016 case report describes necrotizing
    arteritis in a patient without systemic vasculitis (PMID:26874730). Cystic adenomatoid
    change with an abnormal bronchial tree (intralobar subtype), from a ten-case series of
    resected cystic lung lesions of children in which five lesions were intralobar
    sequestrations and none extralobar (PMID:12171491); the items that do not say which
    specimens carried the change are graded INDIRECT. The existing hybrid-lesion row now opens
    "Some lesions" rather than "A minority of lesions", since the new extralobar series found
    the combination in half its cases. Four reference caches are new. Validation: just validate
    passes; all snippets verify.

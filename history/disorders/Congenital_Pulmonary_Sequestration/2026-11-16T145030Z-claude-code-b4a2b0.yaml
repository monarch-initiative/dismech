  summary: Add differential diagnoses, including neuroblastoma for the suprarenal
    form
  details: |
    Five differential-diagnosis rows, each bound to its MONDO term and each citing a source that states the overlap rather than one that merely mentions both diseases. Congenital pulmonary airway malformation (MONDO:0016580) is the principal one and the least separable: a prospective pathology series found the parenchymal maldevelopment that defines CCAM in 91 percent of extralobar and 91 percent of intralobar sequestration specimens, and a fetal series of fourteen fetuses reports three in whom the lesion was histologically both entities. Congenital lobar emphysema (MONDO:0007536) sits on the same spectrum through shared bronchial atresia. Bronchogenic cyst (MONDO:0016523) comes from a two-hospital chart review in which only 56 percent of 39 patients had a classic isolated sequestration and the preoperative diagnosis was right in 59 percent. Congenital diaphragmatic hernia (MONDO:0005711) is the prenatal differential: a series of seventeen echogenic fetal chest masses could not separate hernia from cystic adenomatoid malformation in three fetuses, one of which proved after delivery to be a sequestration. Neuroblastoma (MONDO:0005072) is the differential for the subdiaphragmatic extralobar form, where the mass is not thoracic at all; a literature review gives the echotexture, side and trimester distinctions, and two case reports make the same recommendation independently. Four references were newly fetched and cached.

    An adversarial evidence pass over the draft found eight problems, each checked against the cached text before repair, and five evidence items were added to close them. One distinguishing feature per row was stated as fact with no quote behind it anywhere in the entry: that a CPAM is supplied by the pulmonary circulation and the feeding artery is seen on Doppler; the radiographic appearance of lobar overinflation against sequestration; that a bronchogenic cyst has no systemic supply; the signs that favour a diaphragmatic hernia; and that a systemic feeding artery is the positive finding for sequestration in a suprarenal mass. All five are removed, and the arterial contrast is now carried by a quoted sentence that states it: the fetal series defines its cohort as lesions deriving arterial supply from systemic arteries rather than the pulmonary artery. The lobar-emphysema row dropped the source's own qualifier on its 50 percent figure and did not say that the figure is over four specimens; both are restored, and the authors' own summary sentence, which says "some" rather than 50 percent, is quoted beside the table row. The bronchogenic-cyst row reported the study's stated aim as a result; the aim sentence is now quoted as such, and the item that reaches bronchogenic cyst through it is regraded INDIRECT to match the sibling item that already carried that reasoning. The diaphragmatic-hernia row's opening quote is regraded PRIMARY_RESULT to BACKGROUND, since it opens the abstract and is followed immediately by the statement of purpose, and its outcome contrast is now quoted on both sides rather than summarised as "most died" over a group of which two were terminations. Two wording drifts were corrected: "usually presumed to be neuroblastoma" to the source's "often", and a plural "fetal series" where one series is cited.

    The approving review then found the bronchogenic-cyst row's aim quote tagged quote_role: PRIMARY_RESULT while its own explanation said it was an aim. A quoted aim has no value in that enum, so the field is removed and the item regraded INDIRECT, since naming the entities a study searched for does not show that any were found. The neuroblastoma row's two prose figures - one sequestration reported per 2.5 neuroblastomas, and that a suprarenal mass is often presumed to be neuroblastoma and resected - are now each quoted rather than stated.

    87 snippets verified against the committed cache, terms validated, twelve file gates green. No pathophysiology, phenotype or treatment row was touched.

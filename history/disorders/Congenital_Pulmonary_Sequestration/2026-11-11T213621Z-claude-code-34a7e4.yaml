  summary: 'Create: Congenital Pulmonary Sequestration'
  details: |
    New entry for congenital pulmonary sequestration, MONDO:0017843, with subtype rows for the intralobar form, MONDO:0017245, and the extralobar form, MONDO:0017246. Built from 45 verified snippets. A read-only literature digest read all 46 on-topic cached references first and reported verbatim candidate quotes by section; every quote was re-extracted from the cache body programmatically before it entered the file. The entry records no embryologic mechanism, and the omission is the most important decision in it. The standard account, an accessory lung bud from the foregut or a bronchial atresia, appears in no source cached here: foregut, lung bud, accessory and atresia return nothing in any cached body, and the only embryology hits are MeSH keyword fields, which are frontmatter rather than quotable text. What the caches do carry is a molecular-correlate layer, and it is recorded in genetic as correlation rather than cause, with both papers' own hedges quoted. Both rows carry relationship_type UNKNOWN rather than RISK_FACTOR or MODIFIER, because every other value asserts a contribution to disease that a protein-level correlation in resected tissue does not support. The two forms are kept apart wherever a figure differs between them, which is most of them: relative frequency, venous drainage, site, age at presentation and the fetal course all differ, and the classic 540-case series reports several figures inside a run of sentences about one form only, so a figure lifted out of that run reads as applying to both when it does not. Four cached sentences were deliberately not used even though they say what the entry wanted said. One source writes presents an abnormal connection with the tracheobronchial tree, the opposite of the standard definition and of every other cached source. Two carry split hyphenation from a line wrap, infra- diaphragmatically and back- to- back, which check-folded-hyphens would flag, and a different cached source carries each claim cleanly. One surveillance study's prevalence figure is garbled in the source itself, with a stray space and a missing digit, so the national study's rate is used instead. One cached review is about congenital lung malformations as a class and never uses the word sequestration; nothing from it is cited, which matters because the asymptomatic-management question is live in that literature and the entry records only what a source about this disease says. The pulmonary-hypertension frequency is recorded with the caveat that its cohort was catheterisation-referred and 86 per cent of it had a congenital heart defect, so the figure is not attributable to the sequestration alone. The birth-prevalence record notes that its source counts still births in the denominator as well as live births, which rate_denominator cannot express.

    Two read-only verifiers then re-checked the entry against its sources, split by axis, and the
    repairs they produced are part of this record. The most serious was a mechanism the entry had
    originated rather than read: a node named Left-to-Right Shunt through the Aberrant Feeder, carrying
    two causal edges, asserted a shunt direction that is wrong for the majority of cases. The entry's
    own cited figure says 96 per cent of intralobar lesions - 84 per cent of all cases - drain into the
    pulmonary veins and so return to the left atrium, which is a recirculation on the left side and not
    a left-to-right shunt; only the extralobar minority returns to the systemic veins. No cached source
    uses the word shunt in that sense at all. The node is renamed Hemodynamic Load from the Aberrant
    Systemic Feeder, its description records the form-dependent return path and asserts no direction,
    and the one cached source that names high-output cardiac failure in this disease is now cited for
    that clause rather than left as unsourced prose.

    Next most serious, prevalence_class read BELOW_1_IN_1000000 against a rate of 4.2 per 100,000 - out
    by a factor of about forty-two, and wrong under every reading of the source figure. Both verifiers
    found it independently. The arithmetic and the denominator note were right; only the band was wrong.
    It is now BAND_1_9_PER_100000, which is what scripts/migrate_prevalence.py computes for that rate.
    Nothing in the repository cross-checks a band against its own rate, which is a candidate gate.

    Five explanations described the sentence immediately after the one quoted - the definition's
    functional consequence, the loss of gas exchange, the named draining veins, the scarcity of
    epidemiological studies - and each snippet is extended by that sentence rather than the explanation
    trimmed, since in two cases the causal step the edge asserts was the unquoted half. One snippet
    stopped one word short of the organism it was cited for, reading as a sentence-final abbreviation:
    in 5 cases it was A. now ends A. fumigatus. The Recurrent pneumonia row's only quote listed five
    symptoms, none of them pneumonia; it now quotes the same paper's conclusion, which names recurrent
    pneumonias among the diagnostic indicators. One evidence item graded HUMAN_CLINICAL quotes a
    conclusion summarising tissue Western blots and a mouse fibroblast knockdown, so it is now IN_VITRO.
    Three rows scoped to one form by their own evidence - hydrops fetalis, the fetal tension hydrothorax
    node and haemoptysis - now carry the subtype foreign key, taking subtype reference coverage from
    none to both. The thoracic aorta binding is joined by the abdominal aorta, which the same node's own
    quoted figures name for 18 per cent of cases. Two further figures that prose asserted without
    citation - the 91 per cent intralobar share of a 97-patient adult series, and that the extralobar
    form is the one reported to torse - are now cited, the second from a case report the research run
    had already cached but nothing referenced. Four prose claims were firmer than their sources and are
    softened to match: a diagnostic protocol the source calls promising rather than established, a
    comparison of symptomatic with asymptomatic surgical cases that concludes nothing about
    pre-symptomatic resection, an approximately that had been dropped, and a rarely massive that no
    cached source states. Finally this record's own process narration was removed from review_notes,
    where it had been duplicating what belongs here.

    Review round 1, which answered all five of the reviewer's blocking items and most of the
    suggestions. Nearly all of it was content the entry's own cited caches already held and the entry
    had left out, which is the fair criticism.

    Five phenotypes were added. Cough, abnormal sputum, fever and chest pain come from the 2,625-case
    symptom list the entry was already quoting on the recurrent-pneumonia row without using, plus the
    surveillance series' own list and the adult series' counts; all four are wired from the infection
    node, since in this disease they are symptoms of infection in the segment rather than of the lesion.
    Fetal pleural effusion was added as the finding the fetal mechanism node produces and the fetal
    procedures treat, scoped to the extralobar subtype because the cached fetal series reports hydrops
    following it only there.

    All four treatments now reach the pathograph. Resection targets the non-functioning tissue;
    embolisation targets both the anomalous supply and the haemodynamic load, with the improvement-after-
    closure sentence supporting the second; and a new fetal thoracentesis or thoracoamniotic shunt row
    targets the fetal hydrothorax node. That last row records in its own evidence explanation that the
    same sentence reports maternal betamethasone in all four hydropic fetuses, so hydrops resolution is
    not attributable to drainage alone and no corticosteroid treatment row is asserted from it. The
    embolisation row's therapeutic_modality moved from SURGERY to DEVICE, a catheter procedure placing
    coils and plugs rather than an operation.

    The two protein-level findings left the genetic section, which is now gone. Neither is a
    gene-disease claim: no variant is reported in either gene, and both studies measure protein
    abundance in resected lesion tissue against matched normal lung. They are now one pathophysiology
    node carrying both genes as descriptors with modifier INCREASED, asserting no causal edge, with the
    reason in its own description. The relationship_type UNKNOWN workaround and its justification went
    with the section. The aim-statement evidence item - We hypothesized that Hoxb-5 is similarly
    involved - was dropped rather than regraded, since CLAUDE.md gives a quoted aim no value in the
    quote_role enum.

    The developmental origin is now modelled, and the entry's earlier claim that no cached source
    states the embryology was true only of what had been fetched. A PubMed title search resolved the
    Riedlinger 2006 series the research report had flagged as PMID-unconfirmed; it is a prospective
    examination of 47 resected specimens finding an atretic lobar, segmental or subsegmental bronchus
    in 100 per cent of extralobar and 82 per cent of intralobar sequestrations. That is now a
    Segmental Bronchial Atresia trigger node under a bronchial_atresia_origin hypothesis group, status
    EMERGING because the evidence is cross-sectional - atresia in resected tissue is consistent with
    being the cause and with being a consequence - and because the authors write only that the
    entities may share an etiopathogenesis. The competing accessory-lung-bud account is not modelled:
    its sources in the research report are a PMC review and a collective review reachable only as
    PDFs, neither yielding a citable abstract. The notes now record both accounts, which searches were
    run, and that a curator who fetches a lung-bud source should add a second node in its own group
    rather than replace this one.

    Smaller items: a prenatal-course progression phase records that four of fourteen fetuses' large
    lesions regressed completely before birth; a histopathology row records the three hybrid
    sequestration and congenital pulmonary airway malformation lesions in the same series, which bears
    on the origin question as well as the histology; and PMID:30335347 is now tagged StatPearls in a
    references block, taking just check-genereviews from CITED_UNTAGGED to TAGGED.

    Two node_class values had to be corrected during the round. Both new nodes were first written
    STILL UNPLACED, which is not a permissible value - the tree's judgement classes are deliberately
    excluded from the enum - and hypothesis_groups was first put on the nodes, where it is not a slot;
    it belongs on the downstream edge. They are now DEVELOPMENTAL_MALFORMATION and
    PROTEIN_ABUNDANCE_EXCESS, with the group on the atresia edge.

  summary: Imaging findings before and after birth
  details: |
    A new imaging_findings section, five rows across four modalities, anchored before prevalence so it does not collide with the differential_diagnoses insertion point in the parallel PR on this entry.

    Prenatal ultrasound carries two rows. The first is the echogenic intrathoracic mass with a systemic feeding artery, built on the referral series whose fourteen fetuses all had masses supplied by identifiable systemic arteries rather than by the pulmonary artery, with a second series naming Doppler as the technique that shows the vessel and recording that it did so in four of ten cases - so the vessel is a finding when present rather than a test expected to succeed. The second row is regression on serial scanning, with the two forms' rates given separately (71 percent extralobar, 94 percent intralobar) and the 26 to 28 week peak that serial scanning is timed around.

    Computed tomography carries the lower-lobe paraspinal mass, with the four appearances and their proportions from a 2625-case series and the same paraspinal position confirmed in an independent 97-patient adult series. CT angiography carries its own row, graded diagnostic, using the vessel-based performance figures from the 43-patient study whose patient-based figures the diagnosis section already quotes.

    A fifth row records absent FDG avidity on PET. It rests on one patient and its notes say so: the claim is kept because an incidental lower-lobe mass in an adult is read against malignancy, not because any series has measured FDG avidity in this disease.

    Two modalities named in the plan are deliberately absent. No cached source for this entry mentions fetal MRI, and the one strong candidate could not be fetched during this session. For the chest radiograph, a search of the literature found no abstract reporting a radiographic appearance of sequestration; the appearance lives in figures and full text. An XRAY row could honestly have been built around what the radiograph contributes rather than what it shows, and was left out rather than written at that strength.

    An adversarial evidence pass over the draft found seven problems and five evidence items were added to close them. The PET row's only quote described the lesion and said nothing about PET or FDG, while being graded DIRECT; the sentence that carries the finding was on the CT angiography row instead, and is now quoted on both. The CT angiography row said the modality had replaced catheter angiography, which no source states and which this entry's own diagnosis section already words correctly as one series reporting promising results from its protocol. That row also attributed vessel-based performance figures to a 43-patient denominator; 43 is the study population, the abstract never says how many arteries there were, and the methods sentence is now quoted so the reference standard is visible. The prenatal row asserted second-trimester detection with no quote behind it and in terms both cited series run past, so both series' gestational figures are now quoted with their ranges. The resected-specimen quote's denominator is a mixed congenital-lung-lesion cohort in which sequestrations are a minority, which its explanation now says. The CT row claimed two series agreed on both appearance and position while quoting only one for appearance; the second series' appearance figure is now quoted too, and "series" is corrected to an aggregation of reported cases for the source that is one. The prenatal row's diagnostic flag now says in its description why ultrasound raises the diagnosis where CT angiography confirms it.

    One reference newly fetched. 86 snippets verified against the committed cache, terms validated, offline gates green. No existing row was touched.

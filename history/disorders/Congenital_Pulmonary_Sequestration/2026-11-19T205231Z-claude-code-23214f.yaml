  summary: Add two registered studies that include pulmonary sequestration
  details: |
    Adds a clinical_trials section with two ClinicalTrials.gov records that include pulmonary
    sequestration. NCT03044769 is a Swiss multicentre prospective database of antenatally
    diagnosed congenital lung anomalies, whose summary lists pulmonary sequestration among them.
    NCT06302985 tests inhaled indocyanine green as an aid to thoracoscopic resection of
    congenital lung malformations in children, and its registered title names pulmonary
    sequestration. Neither tests a treatment of the malformation itself, and each record says
    what it tests. Each quotes its cached registry summary (evidence_source OTHER, a
    registration record); designs, statuses and registered conditions were read from
    ClinicalTrials.gov on 19 Nov 2026 and are recorded in each record's notes. A condition
    search for pulmonary sequestration and a full-text search for pulmonary, bronchopulmonary,
    lung, extralobar or intralobar sequestration, run on 19 Nov 2026, returned three records in
    all. The third, NCT06498583, tests an erector spinae plane block for pain after
    thoracoscopic surgery for congenital cystic lung disease. It is left out because only its
    registered condition list, which the cache does not hold, names sequestration. The research
    report also names NCT03913416 and NCT04449614. Read on 19 Nov 2026, the first mentions
    sequestration only to exclude obvious extrapulmonary sequestration, and the second only in
    the title of a cited reference, so neither is carried. Validation: just validate passes; all
    snippets verify.

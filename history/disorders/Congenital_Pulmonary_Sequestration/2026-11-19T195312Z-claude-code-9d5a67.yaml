  summary: Add the accessory-lung-bud and acquired-origin accounts as hypothesis groups
    beside bronchial atresia
  details: |
    Adds two hypothesis groups beside bronchial_atresia_origin. accessory_lung_bud_origin
    (ALTERNATIVE, intralobar subtype) carries a new node, Accessory Lung Bud (trigger), whose
    edge to Anomalous Systemic Arterial Supply is in that group. Its sources: a 1986
    single-hospital pathology series (PMID:3737276) stating the account as the view generally
    held for the intralobar form (BACKGROUND, OTHER, INDIRECT on the node and edge), and the
    same series' proposal that most intralobar sequestrations are cystic adenomatoid
    malformations or developmentally normal lung with a systemic artery (REFUTE, INDIRECT); a
    case report reading one bilateral intralobar lesion as possibly arising from accessory lung
    tissue (PMID:24144479, INDIRECT); and a fetal postmortem series judging the anomalous
    arteries consistent with an origin from the embryonic splanchnic plexus (PMID:14692645,
    INDIRECT, on the edge). acquired_intralobar_origin (ALTERNATIVE, intralobar subtype) has no
    node or edge, because no cached source sets out its steps; it is stated in its unqualified
    form, which four fetal postmortem cases (PMID:14692645) and seven infants (PMID:10201034)
    refute directly, while a case report (PMID:9695620) and an adult surgical series
    (PMID:21362733) support an acquired cause for some lesions (INDIRECT). The Segmental
    Bronchial Atresia node's description and the entry notes no longer say the lung-bud account
    has no cached source; the notes record both PubMed searches with their counts, run on 19 Nov
    2026, and say that the research report's fuller version (a supernumerary ventral bud from
    the primitive foregut, caudal to the normal bud) has no cached source and is not recorded;
    the node carries none of those details. The bronchial_atresia_origin group's description now
    says, as the cached sentence does, that the atresia series' authors suggest bronchial
    atresia and CCAM may share an etiopathogenesis. After review, the group item's explanation
    says why that sentence is graded DIRECT on the group and INDIRECT on the node and edge. Six
    reference caches are new. Validation: just validate passes, all snippets verify,
    validate-terms, check-entity-refs and check-causal-targets pass.

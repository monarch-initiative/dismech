  summary: 'Address PR #8847 review: rebind behaviour term, drop unsupported phenotype'
  details: |
    Addresses the two blocking findings from the automated review on PR #8847,
    plus four of its six non-blocking suggestions.

    Blocking finding 1 — `Behavioural Abnormalities` bound HP:0000718 Aggressive
    behavior while its only evidence documented non-specific "abnormal
    behaviors". Rebound to HP:0000708, whose canonical label is `Atypical
    behavior` (the review quoted the label as "Behavioral abnormality", which is
    not the current canonical form; the canonical label is used here so term
    validation passes). The aggression descriptor from the OMIM/MedGen synopsis
    is retained in `notes` as a split candidate pending a citable source.

    Blocking finding 2 — `Inability to Walk` cited the identical motor-delay
    table row already used by the `Motor Delay` phenotype, and motor delay does
    not support non-ambulation. The phenotype was removed rather than
    re-evidenced: the OMIM/MedGen synopsis records it but no citable publication
    states it, and OMIM is not a snippet-validatable reference prefix in this
    repo. The decision and its reasoning are recorded in the entry's `notes`.

    Non-blocking suggestions addressed:
    - Uncited cached reference PMID:38866022 (Deb 2024, PSMD11) is now cited
      twice: for the primary-proteasomopathy class definition naming PSMB1, and
      in the interferon knowledge-gap discussion, where it supplies the concrete
      picture of what a demonstrated interferon arm looks like (impaired 26S
      assembly, persistent type I IFN signature, PKR/ISR mediator) against which
      the PSMB1 gap is defined.
    - Added an audiological assessment and hearing-management treatment, since
      hearing impairment is curated at 2/2. NCIT has no clinical-action term for
      hearing-device use, so the generic NCIT:C15315 Rehabilitation action is
      used with a specific `preferred_term`.
    - Wired the distal pathograph: `Impaired Brain Growth and Neurodevelopment`
      now has `downstream` edges into Microcephaly (DIRECT), Severe Intellectual
      Disability and Global Developmental Delay (both
      INDIRECT_UNKNOWN_INTERMEDIATES), each separately evidenced.
    - Re-typed `Reduced Proteasome Proteolytic Capacity` from CELLULAR to
      MOLECULAR, since it is an enzyme-activity claim.

    One suggestion declined, deliberately: the gnomAD / 300-control-chromosome
    absence datum. It appears only in the claude_code deep-research report and in
    no cached abstract, so curating it would be precisely the
    treat-a-DR-lead-as-ground-truth failure the evidence SOP warns against. The
    decline and its reasoning are recorded in the entry's `notes` so a later
    curator does not re-litigate it.

    Re-validated: `just validate` passes; 58/58 snippets verified against cached
    references; folded-hyphens, snippet-length, title-snippets, duplicate-keys,
    environmental-evidence and term-cache-integrity guards all pass;
    `just validate-disorders` passes; targeted pytest selection passes.
- type: EDIT

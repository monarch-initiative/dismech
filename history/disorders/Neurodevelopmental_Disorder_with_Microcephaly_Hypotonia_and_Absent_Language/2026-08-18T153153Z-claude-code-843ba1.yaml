  summary: 'Fix CI: folded-scalar hyphen split and sub-5-word evidence snippets'
  details: |
    Follow-up in the same session, fixing two CI guards that are not part of
    `just qc` or `just validate-disorders` and so were not run before the first
    push. Both failures were real and both were mine.

    1. `scripts/check_folded_hyphens.py`: a line inside a folded scalar ended in
       "20S core-", which YAML folding would render as "20S core- particle".
       Reflowed so the compound stays on one line.

    2. `scripts/check_snippet_length.py`: seven evidence snippets were under the
       five-word minimum because they quoted only the leading cells of a row in
       the review's clinical-features table (e.g. "Hypotonia 100% (2/2)"). The
       guard's pipe-delimited structured-source exemption does not apply, since
       these rows come from PMC XML text extraction rather than an ORPHA/ClinGen
       style table. Each was replaced with the full table row, which is still an
       exact substring of the cached reference and is strictly better evidence:
       a reader can now see every column and verify for themselves that the
       second column is the PSMB1 form. The accompanying explanations were
       rewritten to match, since they previously described the snippet as the
       "opening of" a row. The abnormal-behaviour explanation additionally notes
       the adjacent autistic-features cell reading 0% (0/2), which the fuller
       quote now exposes.

    No phenotype, mechanism, or ontology binding changed; this commit alters
    only snippet extent and explanatory prose.

    Re-validated after the fix: `just validate` passes; 54/54 snippets still
    verified against cached references; `check_folded_hyphens`,
    `check_snippet_length`, `check_title_snippets`, `check_duplicate_yaml_keys`,
    `term_cache_integrity` and `validate-history-all` all pass;
    `just validate-disorders` passes; targeted pytest selection passes.
- type: EDIT
  outcome: changed

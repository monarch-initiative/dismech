  summary: 'Create: Neurodevelopmental Disorder with Microcephaly, Hypotonia, and
    Absent Language'
  details: |
    New entry for NEDMHAL (MONDO:0859287, OMIM:620038), the PSMB1/beta6
    neurodevelopmental proteasomopathy.

    Duplicate preflight: no existing kb/ entry, PR, or issue for MONDO:0859287,
    PSMB1, or NEDMHAL. The only prior PSMB1 mention in kb/ is an unrelated
    gene-list line in Proteasome_Associated_Autoinflammatory_Syndrome.yaml.

    Deep research: falcon was attempted first as the default provider but the
    Edison API returned HTTP 402 Payment Required, so no falcon report exists.
    Two other providers were run instead and both reports are committed:
    claude_code (296s, 11 web searches, reference_validation 3/3 verified,
    confabulation_rate 0.0, on_topic 3/3) and openscientist (1016s,
    reference_validation 7/7 verified, confabulation_rate 0.0, on_topic 7/7).
    Neither report listed any unresolved or off-topic reference.

    NEC preflight: `just preflight-dr` returned SKIP on both reports because
    MONDO records no causal gene (RO:0004003) for MONDO:0859287, so the
    automated gene-identity check could not discriminate. The manual fallback
    was run and passes decisively on both reports: PSMB1 dominates gene
    mentions (59 vs 7 for the next gene in the claude_code report; 50 vs 6 in
    the openscientist report), the reports' OMIM identifiers include 620038
    which matches the MONDO xref, and MedGen records PSMB1 (6q27) as the
    associated gene for this concept. This entity is at elevated NEC risk from
    two near-identically named MONDO terms (MONDO:0100348 and MONDO:0971172)
    and from CDK19-related DEE87 (OMIM:618916), which surfaced in the
    claude_code report's searches; all three are named in the entry's `notes`
    as an explicit do-not-conflate list.

    GeneReviews: PubMed searches for a GeneReviews chapter on PSMB1 or NEDMHAL
    returned no results, so the GeneReviews baseline step was not applicable.
    The OMIM/MedGen clinical synopsis was used as the equivalent baseline and
    every feature it lists is represented in `phenotypes`.

    Content curated: 6-node atomic pathophysiology chain from the homozygous
    PSMB1 p.(Tyr103His) allele through the destabilised beta6-alpha5 interface,
    impaired beta6 maturation and 20S assembly, reduced proteolytic capacity and
    impaired ubiquitin-dependent proteostasis, to impaired brain growth; 12
    phenotypes; genetic section with the single reported allele; a zebrafish
    psmb1 animal model and an SH-SY5Y experimental model, both linked into the
    pathograph via modeled_mechanisms; supportive treatments; diagnosis;
    differential diagnoses; and four discussions covering the single-kindred
    evidence base, the zebrafish HUMAN_MODEL_MISMATCH, the interferon knowledge
    gap, and the 20S-versus-19S open question.

    Deliberate curation decisions worth recording. (1) No `frequency:` qualifier
    is asserted on any phenotype: every available proportion is a 2/2 or 1/2
    count from one sibship, which is not a population frequency. Counts are
    stated in phenotype descriptions and evidenced from the review's clinical
    features table instead. (2) The claude_code report asserted that the
    biochemical work was done in patient fibroblasts; the primary abstract and
    the Wolfgramm review table both say human SH-SY5Y cells. The report was not
    followed on this point and the entry says SH-SY5Y. (3) The measured
    functional deficit is only a slight reduction of chymotrypsin-like activity,
    which sits uneasily with the clinical severity; this is recorded in the
    pathophysiology node description rather than smoothed over. (4) The type I
    interferon arm of the proteasomopathy class mechanism is deliberately NOT
    carried into the mechanism chain, because PMID:37256937 explicitly names
    PSMB1 as the one 20S core-particle subunit whose variants have not been
    shown to provoke immune dysregulation. (5) No `datasets:` block: no dataset
    was found that is actually about this disease, and dataset relevance triage
    is a required manual step. (6) Table-row snippets from the review's
    clinical-features table are quoted verbatim as exact substrings; each
    explanation names which column is the PSMB1 form, and the column mapping was
    verified against the table's own patient-count and inheritance rows.

    References used: PMID:32129449 (Ansar 2020, the founding report),
    PMID:39220754 (Cuinat 2024 proteasomopathy review, full text),
    PMID:42370079 (Wolfgramm 2026 proteasomopathy mechanisms review, full text),
    PMID:37256937 (Ebstein 2023 PSMC3/interferon paper, full text). All fetched
    with `just fetch-reference`; no reference cache file was hand-written.

    Validation: `just validate` passes (schema, terms, references). `just
    count-verified-snippets` reports 54/54 snippets verified against cached
    references. `just check-title-snippets` reports no new title-quoting
    snippets. `just check-duplicate-keys` reports no duplicate mapping keys.
    `just validate-disorders` (the batched pre-PR sweep CI runs) passes.
    Compliance rose from 48.6% to 85.3% after adding reference_title to every
    evidence item.

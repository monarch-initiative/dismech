  details: |
    Addressed the single blocking item on PR #10008. The evidence item on the ccrcc_vegfr_tki_hypertension_as_efficacy_biomarker discussion used supports=PARTIAL, which the issue #7439 narrowing of EvidenceItemSupportEnum removed; the value was legal when written and became invalid only when the branch merged main. Migrated to supports=SUPPORT plus directness=INDIRECT, which is the mapping CLAUDE.md and the schema comment both prescribe for the indirect-support case: the quoted sentence states the retrospective pooled-database design, and the discussion's claim that the biomarker question remains open follows from that design by an inference step. Snippet, evidence_source and explanation are unchanged. Also took review suggestion 1: added GO:0097746 blood vessel diameter maintenance with modifier DECREASED to the Treatment-Emergent Vasoconstriction and Increased Peripheral Vascular Resistance node, so the conformance to vegf_inhibitor_hypertension#Vasoconstriction and Increased Peripheral Vascular Resistance is literal in both bound processes rather than only the first. Suggestions 2 and 3 were left for the module and for a cross-conformer decision respectively, as the review itself recommended.

  summary: Wire ccRCC as a conformer of vegf_inhibitor_hypertension
  details: |
    Added the VEGFR-TKI treatment-emergent hypertension arm to Clear_Cell_Renal_Cell_Carcinoma, completing the conformance deferred by PR #8207 (issue #5923). Two pathophysiology nodes were added: 'VSP Inhibitor Blockade of Systemic Endothelial VEGF Signaling' (conforms_to vegf_inhibitor_hypertension#VEGF Signaling Pathway Inhibition) and 'Treatment-Emergent Vasoconstriction and Increased Peripheral Vascular Resistance' (conforms_to the module central-effector node). The trigger-to-convergence edge is INDIRECT_KNOWN_INTERMEDIATES naming the module's three arms, because which arm is rate-limiting is unsettled; the entry deliberately does not assert one. A Cardiovascular phenotype 'Treatment-Emergent Hypertension' (HP:0000822, VERY_FREQUENT) was added, the existing 'VEGFR Tyrosine Kinase Inhibitors' treatment gained an ACTIVATES target_mechanisms edge to the toxicity trigger (the APL_PML_RARA ATRA/differentiation-syndrome pattern), and an OPEN_QUESTION discussion records hypertension-as-efficacy-biomarker as a candidate rather than established practice, with the retrospective pooled-database limitation curated as its own PARTIAL evidence item. References PMID:21527770 and PMID:26492223 were newly fetched with just fetch-reference. Validation: just validate passed, just validate-disorders passed, validate-terms passed, count-verified-snippets 25/26 (up from 16/17 on main; the single skip is a pre-existing prefix skip), check-duplicate-keys / check-entity-refs / check-snippet-grading / check-title-snippets / check-snippet-length / check-folded-hyphens all OK, and 10451 relevant pytest cases passed.

  summary: 'LOINC: bind MOG-IgG and AQP4-IgG differential-diagnosis codes'
  details: |
    Bound LOINC:91545-4 (MOG-IgG, cell binding immunofluorescent assay) to the Serum MOG-IgG cell-based assay diagnosis row, and LOINC:43638-6 (AQP4-IgG) to the Serum AQP4-IgG testing when NMOSD is suspected diagnosis row, as part of dismech LOINC Diagnostics tranche C (autoantibodies). This entry names both antibodies explicitly, each in its own separate diagnosis row for a distinct differential-diagnosis purpose (ruling in MOGAD reclassification versus ruling in NMOSD), not as a joint test -- so both were bound rather than picking one. Both codes are reuses of codes already bound in earlier, still-open tranche-C PRs: LOINC:91545-4 on MOGAD.yaml (batch 3, #14471) and LOINC:43638-6 on Neuromyelitis_Optica_Spectrum_Disorder_with_Anti-AQP4_Antibodies.yaml (batch 2, #14446). Both are competing-field conflicts with this branch's own seeded rows (same CURIE and label, different retrieved_at timestamp) against the cache/loinc/terms.csv rows on loinc-c-batch2 and loinc-c-batch3 respectively -- reported in the PR body, not resolved here, per the coordinator's correction that a full-row comparison (not just the label) determines whether an overlap is byte-identical or competing. Both labels were re-verified against the Monarch KG entity API in this session's own step before writing. Confirmed both CURIEs absent from origin/main's cache/loinc/terms.csv before seeding.

  summary: Link infection and immunization to the antecedent node, unequally
  details: |
    Backfill for issue #8085. Both exposures target the preceding immune trigger node and are deliberately graded far apart. Preceding infection is TRIGGERS with DIRECT, because this node is the antecedent itself rather than a consequence of it, and the cited review places a preceding illness in 70 to 80 percent of cases. Recent immunization is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, and its description is worded so that adding a pathograph link does not quietly convert a contested temporal report into a mechanism. The source cited actually argues against general vaccine causation, stating that no clear pathogenetic correlation exists and that incidence after infection exceeds incidence after immunisation, and the link records that rather than working around it. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 113 of 113 verified.

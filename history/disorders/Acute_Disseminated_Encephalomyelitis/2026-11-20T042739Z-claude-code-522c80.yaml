  summary: Add postinfectious cerebellitis as a differential diagnosis
  details: |
    Adds postinfectious cerebellitis (MONDO:0850107) as a differential diagnosis. A review says
    ADEM may be confused with acute cerebellitis when ADEM's clinical findings are mainly
    cerebellar, that ADEM's lesions on neuroimaging are usually widespread, and that severe
    cerebellitis can also alter consciousness and cause focal deficits (PMID:22805251). ADEM's
    definition requires encephalopathy and polyfocal signs (PMID:33153097, graded as the entry
    already grades that sentence). A series of children with acute ataxia found encephalopathy
    more often in acute cerebellitis than in acute postinfectious cerebellar ataxia, and gives
    the share of each cause by age (PMID:41321459). A note says why the row is bound to
    postinfectious cerebellitis: the sources speak of acute cerebellitis and acute
    postinfectious cerebellar ataxia, which the Postinfectious_Cerebellitis entry holds as tiers
    of that disease. All three sources were already cached; no cache file is added. Validation:
    just validate passes, all 118 snippets verify, and the targeted gates pass.

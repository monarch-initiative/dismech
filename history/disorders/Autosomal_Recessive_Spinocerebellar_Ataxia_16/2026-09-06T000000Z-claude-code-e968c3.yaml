  summary: 'Edit: link SCAR16 treatments into the pathograph via target_mechanisms'
  details: |
    Final item from the pre-PR red-team review. Neither of the two rehabilitation treatments reached the causal graph, so they rendered as list entries no mechanism node knew about. Physiotherapy and Coordinative Training and Speech and Swallowing Therapy now each declare a target_mechanisms link to the Cerebellar Cortical Atrophy and Output Failure node, with treatment_effect MODULATES rather than RESTORES because neither acts on the molecular lesion or slows the degeneration - they work downstream of the structural damage. Each link carries its own evidence, distinct from the treatment-level evidence: the physiotherapy link cites the SARA meta-analysis (PMID:39866519, directness INDIRECT because the pooled trials are not SCAR16-specific and the improvement is in the clinical output of the node rather than the atrophy), and the speech link cites the degenerative-cerebellar-disorder consensus (PMID:24222635, INDIRECT because it names the intervention without saying which mechanism it acts on). The speech link's description records that its swallowing arm is weaker than its speech arm, since the dysphagia phenotype it targets rests on a mixed SCAR16/SCA48 source. Two related review suggestions were deliberately not taken and are recorded here so they are not mistaken for oversights. The T246M knock-in rat still carries no modeled_mechanisms: the source reports only that the animal was engineered at the endogenous locus and gives no rat-specific phenotype, so a mechanism link would assert more than the paper does. Dystonia and Dysphagia remain unreachable from any causal edge because neither has a sourced causal parent, and an unconnected node is honest where a fabricated edge is not. Validation: just validate-disorders passes over both changed files with 249/249 snippets verified, compliance back to 100.0% weighted after adding the link-level evidence, and the causal-target, entity-ref, duplicate-key, enum-value and snippet-grading gates all pass.

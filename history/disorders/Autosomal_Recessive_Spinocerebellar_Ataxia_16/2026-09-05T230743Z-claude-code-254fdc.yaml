  summary: 'Create: Autosomal Recessive Spinocerebellar Ataxia 16 (SCAR16, STUB1)'
  details: |
    New gene-defined entry for biallelic STUB1 disease (MONDO:0014339). Lump/split: kept separate from Spinocerebellar_Ataxia_48 (MONDO:0032526, allelic dominant) and from Cerebellar_Ataxia-Hypogonadism_Syndrome (MONDO:0008935, clinically defined and genetically heterogeneous), because most SCAR16 patients have no hypogonadism and the SCAR16 literature argues for organising STUB1 disease by gene rather than by syndrome name (PMID:28193273). Deep research: falcon was requested but its API key is invalid in this environment, so the run used --fallback and openscientist produced research/Autosomal_Recessive_Spinocerebellar_Ataxia_16-deep-research-openscientist.md (fell_back/requested_provider/provider_attempts recorded in its frontmatter). The report contributed the PDE9A/cGMP and mitophagy pathophysiology branches, the peripheral-neuropathy phenotype, and the TPR-domain alleles from PMID:25258038. Its report-level validation says needs_review: true; the two quotes it failed to resolve are not cited here, and its NCIT treatment CURIEs are wrong (NCIT:C15367 is Health Risk Assessment, not Physical Therapy) so all treatment terms were looked up independently. One substantive error was caught and not imported: the report attributes the massive Purkinje-cell loss of PMID:32713943 to SCAR16, but that paper states the autopsied patient was STUB1 heterozygous, so the neuropathology belongs to SCA48. GeneReviews: no STUB1/SCAR16 chapter exists (three PubMed searches, all zero); the Hereditary Ataxia Overview PMID:20301317 is tagged but its cached record has no clinical content, so it is not quoted. just discover-datasets was run and every candidate rejected on relevance triage (its DIRECT hits are SNX14/SCAR20 and TDP2/SCAR23 matching on the disease-name phrase), so no datasets block was added. Validation: just validate passes (schema, terms, 120/120 snippets verified), compliance 100.0% weighted, and check-duplicate-keys/check-entity-refs/check-causal-targets/check-qualifier-terms all pass.

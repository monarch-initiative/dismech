  summary: 'Create: Autosomal Recessive Spinocerebellar Ataxia 16 (SCAR16, STUB1)'
  details: |
    New entry for SCAR16 (MONDO:0014339), the STUB1/CHIP biallelic recessive
    cerebellar ataxia. Curated from two deep-research reports plus targeted
    PubMed work; 97 evidence snippets, all verified against the committed
    reference cache.

    Deep research. The requested provider was falcon (Edison), which was
    unreachable in this environment: EDISON_API_KEY was present but empty, and
    `deep-research-client providers --check` reported falcon UNREACHABLE with
    403. Rather than substitute a provider by hand, the run was re-issued as
    `just dr_fallback='--fallback' research-disorder falcon ...`, so the
    substitution is recorded in the report itself (fell_back: true,
    requested_provider: falcon, provider_attempts listing the falcon 403). The
    fallback provider was openscientist; its report is committed as
    research/Autosomal_Recessive_Spinocerebellar_Ataxia_16-deep-research-openscientist.md
    (20/20 references resolved, none off topic, run duration ~47 min). A second
    report was generated with the claude_code provider (16 web searches, 25
    turns) and is committed alongside it. Both were read and used. Neither
    report existed before this session, so no retro-fit was needed beyond
    running validate-research-reference / validate-research-terms on the
    claude_code report, which does not write a frontmatter summary.

    Report findings acted on. Three items the claude_code report offered were
    rejected on its own validation output and are cited nowhere in the entry:
    PMID:23847347 (does not resolve; attributed to Shi 2013, whose real record
    is PMID:24312598), PMID:32778825 (resolves to a newborn-screening
    metabolomics paper; attributed to Roux 2020, whose real record is
    PMID:32713943), and hgnc:17208 for STUB1 (the correct identifier is
    hgnc:11427, confirmed against MONDO's RO:0004003 causal-gene relation and
    cache/hgnc/terms.csv). Cohort percentages that report attributed to
    Madrigal 2019 (71% cognitive dysfunction, 75% hyperreflexia, 17%
    hypogonadism) do not appear in the paper; the figure the entry does take
    from Madrigal is the combined "over 70% ... increased tendon reflex and/or
    cognitive dysfunction" line, quoted from the cached full text. From the
    openscientist report, HP:0000765 (offered for autonomic dysfunction; it is
    Abnormal thorax morphology) and HP:0006888 (offered for cerebellar atrophy;
    it is Meningoencephalocele) were rejected, both flagged by that report's own
    term validation. All of this is recorded in the entry's notes: as well.
    `just preflight-dr` passed against MONDO:0014339 (STUB1 mentioned 52 times,
    OMIM 615768 matching).

    GeneReviews. No STUB1-, SCAR16- or Gordon-Holmes-specific GeneReviews
    chapter exists; PubMed searches for "STUB1 GeneReviews[All Fields]" and
    "SCAR16 GeneReviews[All Fields]" both returned zero records. No baseline
    was therefore available and none is tagged; the entry's notes record this.
    Phenotype coverage was built from the primary literature instead (Shi 2013
    PMID:24312598, Shi 2014 PMID:24113144, Heimdal 2014 PMID:25258038, Synofzik
    2014 PMID:24742043, Hayer 2017 PMID:28193273, Madrigal 2019 PMID:31619515,
    De Michele 2020 PMID:32342324, Chiu 2020 PMID:32367277, Ravel 2021
    PMID:33417001, Zheng 2026 PMID:41851873).

    Scope decision. SCAR16 is curated as its own entry rather than folded into
    Cerebellar_Ataxia-Hypogonadism_Syndrome (MONDO:0008935). MONDO makes
    MONDO:0014339 a child of MONDO:0015244 (autosomal recessive cerebellar
    ataxia), not of MONDO:0008935, and hypogonadism is a subset feature of
    SCAR16 rather than a defining criterion: Synofzik's unbiased screening
    cohort found it in none of three STUB1 ataxia patients. The Gordon Holmes
    label is a clinical syndrome with several causal genes (RNF216, OTUD4,
    PNPLA6, STUB1), which is what MONDO:0008935 carries.

    Collateral fix in the same change. Spinocerebellar_Ataxia_48.yaml asserted
    in both its description and its differential_diagnoses block that SCAR16 is
    "curated separately in this knowledge base as Cerebellar
    Ataxia-Hypogonadism Syndrome", bound to MONDO:0008935. Creating this entry
    made that false, so both were repointed to MONDO:0014339 and the
    differential renamed. That file revalidates clean (120/120 snippets).

    Pathograph. Nine nodes in one connected component: biallelic STUB1
    variants branching into CHIP destabilization, loss of E3 ligase activity
    and impaired CHIP-HSC70 chaperone coupling, converging on failure of
    chaperone-assisted protein quality control, then Purkinje cell
    degeneration, cerebellar atrophy, and the ataxia and dysarthria phenotypes.
    Two further branches hang off the quality-control node as
    INDIRECT_UNKNOWN_INTERMEDIATES: corticospinal tract involvement, and
    hypothalamic-pituitary gonadotropin deficiency. Fourteen causal edges carry
    their own evidence, distinct from their nodes'.

    Two discussions record where the model stops. A KNOWLEDGE_GAP on the
    hypogonadism node: no study localizes the defect in the
    hypothalamic-pituitary-gonadal axis or names the CHIP client, and cohorts
    disagree sharply on whether the feature occurs at all. A
    HUMAN_MODEL_MISMATCH on the proteostasis node: SCAR16 patient fibroblasts
    show an impaired heat-shock response, but patient iPSC-derived cortical
    neurons do not, and an isogenic CRISPR STUB1 knockout neuron line behaves
    like the patient lines, so the neuronal readout does not discriminate. The
    two cell systems are curated as separate experimental_models records so
    that disagreement is visible structurally rather than only in prose.

    Datasets. `just discover-datasets` returned twelve candidates and eleven
    were rejected on relevance triage. The three scored DIRECT are mouse TDP2
    and SNX14 studies matched on the words "autosomal recessive spinocerebellar
    ataxia" in their summaries, which are different recessive ataxias; the
    GENE_ONLY hits are STUB1 in tumour immunology, prostate cancer and
    epithelial NF-kB signalling. Only geo:GSE310700 (STUB1 knockdown in HEK293
    under heat shock) was taken, with its description saying plainly that it is
    a knockdown cell line rather than patient material and was generated for an
    SCA48 study. `just verify-datasets` resolves it and GEO_GSE310700.md is
    committed.

    Pre-PR review. A red-team review was run against the entry before
    committing and found twenty issues. Acted on: the stale SCA48
    cross-reference (above); three `supports: REFUTE` items that in fact
    corroborated the claims they were attached to, regraded to SUPPORT with
    `directness: INDIRECT`; a hypogonadism evidence item quoting a paper's
    background sentence when that paper's own patients had no hypogonadism,
    regraded to OTHER/INDIRECT with the circularity stated in the explanation;
    an onset range taken from a combined SCAR16+SCA48 cohort, replaced with the
    SCAR16-only median of 17 years (range 0.5-49) from Madrigal's cached full
    text, with onset_category corrected from ADULT to JUVENILE; three
    prevalence_class values of ULTRA_RARE lowered to RARE, since no source
    describes the disease that way and one calls STUB1 a frequent cause of
    ataxia; a chaperone-binding node whose descriptors claimed reduced binding
    while its evidence showed failed ubiquitination, given the
    decreased-chaperone-interaction evidence that actually supports it; a
    "sufficient on its own to produce disease" claim about p.Thr246Met dropped,
    since the same paper says that allele is not equivalent to total loss of
    CHIP; missing peripheral neuropathy and tremor phenotypes added; diagnosis
    and differential_diagnoses sections added; HP:0001251 replaced by the exact
    HP:0002073 Progressive cerebellar ataxia; a "Pyramidal Signs" phenotype
    renamed to Hyperreflexia to match its binding and evidence; CL:0001031
    cerebellar granule cell removed from the Purkinje node, since the
    supporting quote reports expression rather than degeneration; chorea
    removed from the extrapyramidal description as an SCA48 feature; an
    aggregation claim narrowed to the one variant that shows it; two truncated
    snippets extended to include the quantifiers their explanations relied on;
    hormone replacement rebound from generic Pharmacotherapy to NCIT:C15599
    with CHEBI:17347 testosterone as therapeutic_agent; and two evidence_source
    grades corrected (a mitophagy result spanning in vitro and C. elegans
    regraded MODEL_ORGANISM, a review's editorial framing regraded OTHER).

    Not acted on. The reviewer noted `parents:` lists "spinocerebellar ataxia"
    alongside MONDO's single parent "autosomal recessive cerebellar ataxia".
    That slot is free text and the clinical family is the useful second parent,
    so it was left. The reviewer also suggested modelling the U-box-to-cognition
    versus TPR-to-hyperreflexia genotype-phenotype split as structure; the
    Madrigal correlation is a cohort-level regression rather than a per-variant
    assignment, so it is recorded in the node descriptions rather than as
    separate nodes.

    Validation on the final tree. `just validate` clean on both changed KB
    files. `just validate-disorders` (the batched gate CI runs) clean.
    97/97 snippets verified for this entry and 217/217 across both changed
    files, re-run after pruning uncited reference caches. Offline gates all
    clean: check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-snippet-length,
    check-snippet-grading, check-folded-hyphens, check-title-snippets,
    check-environmental-evidence, check-not4curation, check-stubs.
    `just verify-datasets` OK. Compliance 92.8%. The stub
    stubs/Autosomal_Recessive_Spinocerebellar_Ataxia_16.yaml is deleted by this
    change.

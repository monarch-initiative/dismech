  summary: Review SCAR16 clinical evidence, allele-specific mechanisms and experimental models
  details: |-
    Reviewed the existing entry and both matching OpenScientist and Claude Code research reports against primary sources. This is the first REVIEW event for the biallelic STUB1 disorder; dominant SCA48 remains a separate entry. The disorder is Mendelian and meets the sweep's exclusions of infectious and environmental diseases/poisonings.

    Principal corrections: median onset is not a mean; mixed SCA48/SCAR16 ages and phenotype fractions are not recessive frequencies; a combined reflex-or-cognition percentage does not establish either marginal frequency. CHIP variants have substrate-, allele- and assay-dependent effects, including retained ubiquitination in some assays. The 2015 recessive autopsy supplies Purkinje/granule-cell loss, Bergmann gliosis and sparse inclusions; a dominant autopsy is not substituted. The uniparental-isodisomy case retains the authors' intronic VUS classification and only predicted splice disruption. Recurrence counseling is conditional on parental genotype. Parental segregation, not the 2026 paper's repeat-testing PCR, establishes variant phase.

    Full scientific body, methods, available tables and figure legends consumed from generated caches for PMIDs 24312598, 24742043, 25258038, 25259530, 28193273, 28396517, 30222779, 31619515, 33097556, 34070858, 34630034, 36569391, 41851873, 29581457, 31189917 and 39806097. XML/PDF extraction does not guarantee every supplementary or embedded table body is present: the 2019 analysis supplements were not obtained, and no unseen supplement values were curated. Generated public PDFs recovered the complete scientific text of Bettencourt 2015 (25592071, CiteSeer), Agianda 2024/2025 (39728009, def-lab) and Earnshaw 2024 (39117117, mito2i). Cached full-text paragraphs establish claim context beyond short exact snippets.

    The original 24113144 family paper was read through its public author manuscript, including clinical table, methods and figure legends. The 29317501 Kanack paper was read through public author text, including methods and legends; its two tabular data bodies were not exposed, so unseen table values were not curated. The 36853170 CARP study was read through the publisher's indexed full text, including variant Table 1 and cellular methods. Sanctioned full-cache retrieval for these three papers remained unavailable (publisher/author access failures; the long 2013 PDF URL also exceeded filename length). Their generated PMID abstracts support the quoted evidence; additional contextual findings were checked against the public full text, not copied from research synthesis. No cache was hand-edited.

    Roux 32713943 was checked in its full cached methods, results, variant table, three-patient recessive subset and discussion. The rest of its dominant case histories are outside this entry. Its second-hit suggestions, sex ratio and autopsy must not be transferred to recessive SCAR16. Broad review 33200713 was consumed for SCAR16, SCA48, CHIP biology and therapeutic context; its other-disease sections were scope-screened, not used to establish human SCAR16 pathology. Primary studies take precedence where its biochemical or trehalose summaries overgeneralize. The available abstracts of 32367277, 32342324, 33417001, 29679845 and 42080998 were reviewed; inaccessible full text was not presumed read. The Ravel HAL retrieval supplied only a cover, so pooled parkinsonism and ages were not assigned to SCAR16. The 34906452 TBP interaction and 39707479 Y252S tau experiments concern heterozygous/digenic disease, not proven recessive modifiers or tau pathology. The 28593200 skeletal-muscle null-mouse findings are peripheral gene biology and were not imported as a human muscle phenotype. The uncited granule-progenitor electroporation lead could not be identified as a STUB1 study and was not curated.

    Mechanistic additions include the patient-fibroblast PKA-CREB and cilium-resorption phenotypes, with HEK293 pathway reconstruction, and the 2025 PDE9A/cGMP/CHIP phosphorylation rat work. All remain provisional for human SCAR16. The 2024 mitophagy study tested gene perturbation and SCA48 alleles, so its transfer is hypothetical and indirect; the 2025 static autophagy markers do not establish an opposite flux rate. CARP-dependent insoluble sequestration is separated from soluble oligomerization and structural destabilization. Protein abundance is a distinct state. NR2A/Fbx2 turnover is a reconstituted cellular readout, not evidence of patient excitotoxicity. Recombinant and expression-construct assays are distinguished from endogenous patient RNA or protein measurements.

    Models were checked at species, allele, age, tissue and readout resolution. Rodent ortholog numbering, null versus missense phenotypes, zebrafish Purkinje loss preceding measured proteasome decline, negative zebrafish locomotor/oligomer results, and immature cortical neurons versus mature Purkinje cells are retained. Trehalose is a one-patient fibroblast lead with pseudoreplicates; neither CHIP abundance nor clinical benefit was established as its rescue mechanism. BAY 73-6691 and AAV-CHIP improved rat outcomes but are preclinical; higher endpoint cell density does not demonstrate regeneration. The uncontrolled 4-aminopyridine and levetiracetam observations retain the UPD case's molecular uncertainty.

    GeneReviews NBK1138 was generated, tagged and read for general hereditary-ataxia evaluation, care, surveillance and recessive counseling. It is not a disease-specific SCAR16 chapter: no general-ataxia frequency or phenotype is represented as SCAR16-specific. Rehabilitation, swallowing/nutrition, spasticity, psychiatric care and longitudinal monitoring are explicitly extrapolated. The original sisters' estrogen/progestin response and GnRH challenge were verified in the family paper; the exact hormone preparations were unspecified, so chemical-role classes were not falsely bound as compounds.

    ClinicalTrials.gov API checks identified no SCAR16-specific disease-modifying intervention in the queried records. NCT05354622 is a recruiting observational HSP sequencing study through which the UPD case was identified, not a drug trial. The broad CoRDS registry was not presented as SCAR16-specific treatment. GEO data already in the entry were verified. OMIX008238 was independently checked in the public repository and its four expression-matrix archives linked to PRJCA033500/39806097; its URL accession is unsupported by the automated dataset verifier, and no automatic verification is claimed. Source sample-count wording is inconsistent, so a sample count was not invented. SRA105955 is the discovery paper's submission identifier; a public usable study/run record was not resolved and no dataset accession was fabricated. The 2019 supplement DOI yielded metadata without its data tables. No omics reanalysis was performed.

    Content-completeness assessment: (1) phenotypes adequate, with case-level motor, cognitive, endocrine, ocular, hearing and autonomic findings and unsupported frequency bands removed; (2) subtype scope adequate, retaining SCAR16, SCA48 and broader Gordon Holmes distinctions; (3) mechanisms adequate, including the newly recovered central signaling studies, with unproved human causal links explicitly limited; (4) treatments/trials adequate, including general care, endocrine response, preclinical candidates and observational provenance; (5) genetics adequate, with segregating clinical alleles, assay-specific functional effects, intronic VUS and conditional counseling, without invented penetrance or TBP modifier claims; (6) diagnostics adequate, with sequencing/segregation and supportive imaging, without a validated fluid biomarker or a zygosity-only diagnosis; (7) references adequate, using cached full text and recovered primary reports rather than research-summary assertions; (8) overall consumption adequate, with dominant-only and generic CHIP biology deliberately scoped out. No central verified, quotable SCAR16 theme remains omitted.

    Final checks passed: schema and ontology validation; 248 snippets and 264 titles with none skipped or unavailable; two scoped data tests; history validation; entity, causal-target, coarse-binding, source-defect, snippet-boundary, GeneReviews, snippet-length, title-snippet, reference-title and snippet-grading checks; and commit hooks. Formatting preserved parsed YAML and cached source word sequences. Failed/empty/captcha caches and unrelated trial-cache refreshes are excluded from the commit. The retired dataset-accessions JSON is not read or restored.

  summary: 'Edit: address ai4c-reviewer round 1 on SCAR16'
  details: |
    Response to the ai4c-reviewer review of 2026-09-09 (CHANGES_REQUESTED on one item). Blocking finding: genetic[0].notes claimed 'zygosity is recorded as HOMOZYGOUS' while the file's only zygosity value, in the initiating pathophysiology node's genetic_context, is COMPOUND_HETEROZYGOUS with its own contradicting rationale. The reviewer is correct and this was my defect twice over: the red-team round earlier in this session identified the same contradiction and my fix silently failed to apply, because that one string replacement was written without an assertion and its anchor did not match the file's line wrapping while its paired edit succeeded. The note is now rewritten to say the Genetic class has no zygosity slot, that the value lives on the pathophysiology node's genetic_context, that it reads COMPOUND_HETEROZYGOUS, and that the slot is single-valued so neither genotype should be read as predominant, which agrees with PMID:31619515 reporting nearly equal numbers. Every edit in this round was applied under an assertion and re-read from the file afterwards. Non-blocking suggestions taken: added an animal_models entry for the CHIP-mutant Caenorhabditis elegans neurons of PMID:39117117, which was cited as evidence but carried no model entry and so could not express fidelity or limitations - recorded PARTIALLY_RECAPITULATES against Mitophagy Dysregulation in Cerebellar Neurons at LOW fidelity and CELLULAR model_scale, with a SPECIES_MISMATCH divergence stating that the nematode has no cerebellum and no Purkinje cells so the node's vulnerable cell type is absent from the model entirely; gave Occupational Therapy a target_mechanisms link to Cerebellar Cortical Atrophy and Output Failure with treatment_effect MODULATES and its own INDIRECT evidence, and stated in its description why it is deliberately not linked to Multisystem Neuronal Degeneration; and documented in notes why chorea and myoclonus are excluded, parallel to the existing parkinsonism note - PMID:32342324 names chorea only in its SCA48 sentence, and the clearest myoclonus description (PMID:33811518) is a de novo heterozygous start-lost patient and therefore SCA48, while dystonia is the one member of that group with a documented biallelic patient. Suggestion not taken: symptomatic pharmacotherapy for spasticity, epilepsy and hypogonadism was left out, because no SCAR16-specific source for any of the three is cached, the consensus paper the entry already cites states no medication has been proven effective, and the deep-research report's NCIT codes for them were confabulated (NCIT:C376 is Cisplatin, not Baclofen). Validation: just validate-disorders passes over both changed files with 253/253 snippets verified, compliance 100.0% weighted after adding link-level evidence to the new divergence, and the causal-target, entity-ref, duplicate-key, qualifier-term, enum-value, folded-hyphen and environmental-evidence gates all pass. check-snippet-grading, check-snippet-length and check-title-snippets fail locally on five files this PR does not touch (AIPL1-Related_Retinopathy, CRX_Related_Retinopathy, Congenital_Glaucoma, EYS_Related_Retinitis_Pigmentosa, MPI-Congenital_Disorder_of_Glycosylation, Primary_Ciliary_Dyskinesia, ZNF407-Related_Neurodevelopmental_Disorder); that is branch staleness against a main 208 commits ahead, since those baselines are computed against origin/main while the working tree still holds the pre-main versions of those files. No baseline was updated and no other curator's file was touched.

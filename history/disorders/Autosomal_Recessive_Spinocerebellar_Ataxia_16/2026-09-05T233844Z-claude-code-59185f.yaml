  summary: 'Edit: address pre-PR red-team review findings on SCAR16'
  details: |
    Fixes from an adversarial pre-PR review of the entry created earlier in this session. Blocking scientific fixes: (1) removed the Parkinsonism phenotype - its only source PMID:33417001 is a 4-SCAR16/9-SCA48 series whose additional findings are not broken down by genotype, and PMID:32342324, cited elsewhere in this entry, partitions the movement disorders the other way, assigning parkinsonism to SCA48 and hyperkinetic disorders to SCAR16; the decision is recorded in notes so it is not re-added. (2) Replaced the unsupported onset range 'childhood to the eighth decade', which could only have come from that same mixed cohort, with the biallelic-only figures: median 17 years, range 0.5-49 (PMID:31619515) plus a 31-57 sibship (PMID:30058754); the claim was also load-bearing inside the CHIP-null mouse limitations and was fixed there too. (3) Dropped the 'genetically confirmed SCAR16' description of PMID:36569391, whose patient is reported only as having a 'known mutation of the STUB1 gene' with no zygosity and whose SCAR16 label is a radiological inference; the Dysarthria edge now cites PMID:32258232, a documented compound heterozygote, and the brainstem-atrophy imaging claim carries the caveat plus the paper's own imaging-pattern sentence. (4) The Hypothalamic-Pituitary-Gonadal edge cited PMID:24113144's opening definition of Gordon Holmes syndrome, a background sentence about a genetically heterogeneous entity; replaced with the same paper's actual result naming a homozygous STUB1 genotype. (5) Dysphagia keeps its mixed-cohort source but now states the caveat, drops the unsourced natural-history sentence and asserts no frequency band. Internal consistency: rewrote the genetic notes paragraph that described a nonexistent Genetic.zygosity slot and claimed compound heterozygosity is commoner, which PMID:31619515 refutes ('nearly an equal number ... homozygous and compound heterozygous'); the genetic_context justification was corrected to match. Removed a notes sentence asserting that SCA48 still points its differential at MONDO:0008935, which this same change falsified. Evidence grading: regraded three uses of the CHIP-null mouse sentence from MODEL_ORGANISM to OTHER, since it is background in a paper reporting only human fibroblast and iPSC work; broke the circular use of that one sentence to prove both Purkinje loss and cerebellar atrophy by adding the Purkinje-specific rescue result from PMID:39806097; regraded a cultured patient fibroblast result from HUMAN_CLINICAL to IN_VITRO; and converted two REFUTE items to SUPPORT with directness INDIRECT where the quote bounded a frequency band rather than contradicting the claim. Frequency bands are now grounded in the biallelic-only quantifying sentence from PMID:31619515 (over 70% with increased tendon reflex and/or cognitive dysfunction, hypogonadism in only four patients); Dystonia moved from VERY_RARE to OCCASIONAL to match its own stated arithmetic of 3 patients against 15 families. Pathograph: Spastic Tetraparesis, Autonomic Dysfunction and Peripheral Neuropathy are now reachable from Multisystem Neuronal Degeneration. Also scoped the panel-yield claim in diagnosis to STUB1-as-a-gene with a note that SCA48 accounts for most of it, replaced a molecular-function binding that annotated the substrate rather than the failing process, corrected prose that read the NR2A colocalization as human when it is mouse brain, and accounted in notes for five reference caches that belong to the research report rather than to this entry. Validation after fixes: just validate-disorders passes over both changed files with 247/247 snippets verified, compliance 100.0% weighted, and all offline gates green.

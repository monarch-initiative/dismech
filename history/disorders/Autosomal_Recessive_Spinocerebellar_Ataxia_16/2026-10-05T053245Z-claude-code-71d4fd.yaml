  summary: Evidence-claim mismatch review (#13155)
  details: |
    Reviewed the Jev evidence-claim assessments (342 items, run on the current file revision) for issue #13155, triaging the roughly 45 highest-probability MISMATCH items against the cached sources. Repaired snippets that were too short to carry their claims: the GEO:GSE310700 snippet now quotes the HEK293 shRNA design and the SCA48 purpose the description states; the OMIX008238 snippet quotes the four rat conditions; the Earnshaw 2024 U2OS model link now quotes the discussion sentence covering both CHIP overexpression and knockdown, the model evidence quotes the mt-Keima reporter sentence, and the knockdown snippet carries its CCCP context (three locations); the NEK10 cilia snippets include the control-fibroblast resorption (four locations); the PMID:32713943 p.Asn65Ser carrier snippet includes the recessive early-onset report and the 27-55 year onset range, with the explanation rewritten to drop an unsupported statement about unaffected relatives; the PDE9A ubiquitination snippet names the K30A and T246M mutants (two locations); the rat water-maze snippet names the assay. Replaced two readout snippets whose direction did not match: the knock-in mouse rotarod readout (DECREASED) now quotes the decline from about 30 weeks rather than preserved early learning, and the rat mitochondrial injury-score readout (INCREASED) quotes the higher Flameng scores in untreated mutants rather than the post-treatment reduction, with its interpretation rewritten to match. Added to the progressive-ataxia description the severity-onset non-correlation that its PMID:31619515 evidence was cited for. Retained as is, with reasons: Gordon Holmes review items (PMID:42080998) and the non-hypogonadal cohort item (PMID:24742043), whose explanations already state the ascertainment limits; the SCA48 differential description snippet, which describes the comparator; the PMID:28396517 REFUTE item already reflected in the node description; model-organism items flagged only because they are not human SCAR16 data, which their limitations already state. Validated with just validate, just count-verified-snippets (259/259), and just validate-disorders.

  summary: 'Create: Infantile Liver Failure Syndrome 1 (LARS1)'
  details: |
    De-novo curation of MONDO:0024568 (LARS1 deficiency, infantile liver failure syndrome type 1).

    Deep research: one openscientist run (research/Infantile_Liver_Failure_Syndrome_1-deep-research-openscientist.md). Its reference_validation reported 15/15 references resolved, confabulation_rate 0.0, 0 off-topic.

    The DR report produced a substantive correction to the initial draft. The draft cited the 2015 clinical series reporting that leucine supplementation had no appreciable benefit, and drew a mechanistic inference from that failure. The report surfaced PMID:34194004 (Genet Med 2021), which showed in patient fibroblasts that aminoacylation is further reduced at 38.5/40 C, that growth is substrate-sensitive, and that cognate amino acid supplementation INTENSIFIED DURING INFECTIONS produced benefit. The treatment entry now records both results and the reading that reconciles them - timing rather than substrate was what the earlier attempt got wrong - while stating explicitly that the 2021 series pooled four ARS deficiencies and had no control arm.

    The report also surfaced PMID:38844943, a 36-patient cumulative series that supplies real frequency denominators (IUGR 31/32, hypoalbuminemia 32/32, microcytic anemia 32/33, acute liver failure 24/34) and Kaplan-Meier prognostic factors (onset under 3 months HR 12.29; liver failure HR 6.57; 12/36 died or were transplanted). These replaced frequency assertions that had been made without denominators, and added a progression block. PMID:22424946 was added as the primary source for LeuRS acting as a Rag GTPase GAP in mTORC1 leucine sensing.

    Mechanism: biallelic LARS1 variants -> reduced, TEMPERATURE-SENSITIVE leucyl-tRNA aminoacylation capacity -> febrile decompensation -> impaired cytoplasmic protein synthesis in high-demand tissues -> recurrent hepatocellular injury, hypoalbuminemia, microcytic anemia. A separate mTORC1/autophagy branch is modelled from the larsb-knockout zebrafish and graded PROVISIONAL.

    Encephalopathy is deliberately NOT modelled downstream of the liver: it occurred after liver transplantation in one individual and independently of liver crises in a separate cohort.

    Four discussions record the gaps, including a HUMAN_MODEL_MISMATCH on the zebrafish autophagy branch (a null model with a progressive lethal phenotype standing in for a partial loss-of-function, episodic, survivable human disease) with a proposed autophagic-flux experiment.

    PMID:33314043 is topically relevant but its cached record has an empty body, so no snippet can be verified against it; it is excluded and the exclusion is recorded in the entry's notes.

    Validation: just validate passes - schema, terms, and 51/51 snippets verified against cached references.

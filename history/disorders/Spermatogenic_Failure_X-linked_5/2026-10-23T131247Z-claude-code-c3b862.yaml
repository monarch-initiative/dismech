  summary: 'Create: Spermatogenic Failure X-linked 5 (SSX1)'
  details: |
    New entry for SSX1-related X-linked asthenoteratozoospermia (MONDO:0859477), claimed in issue 15324. Curated from the abstracts of PMID:36796361 (six men, cynomolgus monkey and tree shrew testicular knockdown) and PMID:42467186 (one further splice donor variant from a WGS series, co-occurring with a CPNE1 variant). PMC full text of PMID:36796361 was not reachable, so individual variants and sperm ultrastructure are not recorded. Pathograph: hemizygous SSX1 loss -> disrupted spermatogenic program (from knockdown RNA-seq) -> reduced motility and abnormal morphology, edges marked INDIRECT_UNKNOWN_INTERMEDIATES. Validated with just validate, count-verified-snippets (22/22) and validate-terms.
    Review round 1 (PR 15402): added a claude_code deep-research report, which found no SSX1 infertility papers beyond the two cited; its leads (536-man screen, p.Tyr55Cys, reduced SSX1 in patient sperm) are unverified and absent from both abstracts, so not curated. Re-pointed the two knockdown-model links' evidence to the RNA-seq sentence and moved the motility and morphology findings into readouts. Reworded the genetic-counseling 50% risk as a consequence of X-linked transmission. Grandfathered SSX1 in tests/gene_activity_grounding_baseline.txt because no cited source states SSX1's molecular function in spermatogenesis. Revalidated: 26/26 snippets verified.

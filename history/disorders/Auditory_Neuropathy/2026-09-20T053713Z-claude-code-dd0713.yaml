    subtype key: neither has a subtype row in this entry.

    MONDO reconciliation. MONDO:0012196 records DIAPH3 (hgnc:15480), MONDO:0859235 records
    TMEM43 (hgnc:28472), MONDO:0010986 records OTOF (hgnc:8515). All three were present at

  summary: 'Gene-family review: AIFM1, OPA1'
  details: The AIFM1 (AUNX1) record had no relationship type or variant origin; typed it CAUSATIVE
    and germline. ClinGen classifies AIFM1 as Definitive for MONDO:0010378, the AUNX1 subtype's
    own term, so the tier was recorded with subtype AUNX1 and the CGGV row quoted. The AIFM1
    neuronal-injury node carried the gene with no activity; added protein-membrane adaptor
    activity (GO:0043495, AIF's anchoring of the CHCHD4 import receptor) as DECREASED, supported
    by patient iPSC-derived neurons in which the variant weakens the AIF-CHCHD4 interaction
    (PMID:37365177). The OPA1 record also had no relationship type or variant origin; typed
    it CAUSATIVE and germline (autosomal dominant), the dominant optic atrophy-plus allele
    class in which auditory neuropathy is established. OPA1 stays on the shared Auditory Nerve
    Dyssynchrony node, which carries several genes and binds no molecular function for any
    of them.

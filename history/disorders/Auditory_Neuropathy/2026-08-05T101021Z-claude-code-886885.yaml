    Independent publication-readiness review through 2026-08-05. Corrected HPO specificity; replaced unsupported AIFM1/TMEM43-to-speech edges with narrower source-supported links to hearing impairment; added GeneReviews coverage, DFNB9/AUNX1 subtypes, HPO-bound inheritance, structured low-risk-newborn prevalence, an OTOF case fraction, acquired etiologies, current Otarmeni and distinct investigational OTOF trial evidence, natural history, diagnostics, evidence-bearing differential diagnoses, rehabilitation, trials, models, and explicit limitations. D2P dispositions: accepted HP:0004463 and HP:0000407 at umbrella scope and HP:0001284, HP:0034585, HP:0002936, and HP:0002317 at AUNX1 subtype scope; deferred HP:0004454 and HP:0008529 for lack of clean exact evidence; rejected HP:0000545 and HP:0000360 for lack of exact cache-backed support and HP:0003390 because the cited study instead interprets the findings as possible demyelination. Preserved OAE/CM remains intentionally noncausal; no unsupported edges were added for connectivity. PR: https://github.com/monarch-initiative/dismech/pull/8011

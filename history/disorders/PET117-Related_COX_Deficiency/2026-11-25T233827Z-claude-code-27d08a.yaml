  summary: 'Gene-family review: PET117'
  details: |
    PET117 relationship_type changed from CAUSATIVE to UNKNOWN: the disorder rests on one family (two sisters homozygous for a nonsense variant, PMID:28386624) and ClinGen rates PET117 Limited (AR) for Leigh syndrome and mitochondrial disease, neither being this entry's MONDO:0033654; the inheritance block is bound to HP:0000007. The PET117 node now binds GO:0044183 protein folding chaperone (DECREASED), described as a non-catalytic assembly chaperone, with new evidence that PET100 and PET117 are the conserved chaperones assisting complex IV biogenesis (PMID:28199844) and that PET117 binds and stabilizes TACO1 (PMID:37247699).

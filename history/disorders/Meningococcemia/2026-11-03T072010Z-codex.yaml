  summary: 'Create: Meningococcemia (MONDO:0042972)'
  details: |
    Added a de novo Meningococcemia entry for the bloodstream/septicemic form of invasive Neisseria meningitidis disease. The pathograph separates the existing Meningococcal_Meningitis blood-brain-barrier and CSF inflammation branch from this entry's complement-gated bacteremia, LPS/IL-10 systemic inflammation, type-IV-pilus dermal endothelial adhesion, and ADAM10-mediated EPCR shedding/coagulation-failure branches. Curated N. meningitidis as the NCBITaxon infectious agent, human nasopharyngeal carriage and respiratory close-contact transmission, terminal/alternative complement deficiency as a host genetic risk factor, petechiae, purpura, DIC, shock, and gangrene phenotypes, blood/CSF culture or PCR and red-flag recognition diagnostics, and early parenteral antibiotics, MenACWY/MenB vaccination, and close-contact chemoprophylaxis.

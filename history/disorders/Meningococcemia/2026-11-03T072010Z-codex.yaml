  summary: 'Create: Meningococcemia (MONDO:0042972)'
  details: |
    Added a de novo Meningococcemia entry for the bloodstream/septicemic form of invasive Neisseria meningitidis disease. The pathograph separates the existing Meningococcal_Meningitis blood-brain-barrier and CSF inflammation branch from this entry's complement-gated bacteremia, LPS/IL-10 systemic inflammation, circulating myocardial-depressant activity, type-IV-pilus dermal endothelial adhesion, and ADAM10-mediated EPCR shedding/coagulation-failure branches. Curated N. meningitidis as the NCBITaxon infectious agent, human nasopharyngeal carriage and respiratory close-contact transmission, anti-C5 blockade, smoke exposure, and household/congregate crowding as environmental risks, C5, C6, C7, C8A, C8B, C9, CFP, CFD, and MBL2 as HGNC-bound susceptibility genes, LPS, IL-10, meningococcal DNA, and MIF severity biomarkers, petechiae, purpura, purpura fulminans, DIC, shock, gangrene, and Waterhouse-Friderichsen adrenal failure phenotypes, blood/CSF culture or PCR and red-flag recognition diagnostics, early parenteral antibiotics, MenACWY/MenB vaccination, complement-inhibitor prophylaxis, close-contact chemoprophylaxis, and humanized mouse and 3D microfluidic human-vessel model joins.

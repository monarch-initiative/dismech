  summary: 'LOINC tranche G: pediatric elevated-IOP criterion'
  details: |
    Bound LOINC:56844-4 (intraocular pressure) as a diagnosis measurement on the existing Examination Under Anesthesia row, with a reference range at the pediatric PCG elevated-IOP criterion (strictly >21 mmHg on at least two occasions; PMID:38249492), bumped to lower_bound 22 to match the whole-mmHg clinical convention. Notes record the source's normal-pediatric-IOP mean+/-SD (12.02+/-3.74 mmHg, not usable as a band boundary) and explicitly preserve the entry's existing caution that a single reading, especially under anaesthesia, is not diagnostic alone. Part of LOINC tranche G batch 11 (projects/LOINC_DIAGNOSTICS.md).

    Review round: the initial push had also added diagnosis_term NCIT:C120543 (Tonometry) to this row, undisclosed in the PR body and wrong on the merits -- the row's own description says the act is a full exam under anaesthesia (tonometry, gonioscopy, corneal diameter, axial length, disc exam) and that diagnosis rests on the combination rather than any single measurement, so binding the action to tonometry alone contradicted the row's own framing. Rebound diagnosis_term to NCIT:C38060 (Eye Examination) with preferred_term "eye examination under anaesthesia", which matches the row's actual scope; the IOP specificity stays where it belongs, in the measurements LOINC code.

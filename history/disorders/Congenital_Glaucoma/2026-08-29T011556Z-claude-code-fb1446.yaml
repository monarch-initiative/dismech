    # Fixes: Congenital Glaucoma

    File: `/home/user/dismech/kb/disorders/Congenital_Glaucoma.yaml`
    Review: `reviews/Congenital_Glaucoma.md` (2 MAJOR, 7 MINOR)

    ## Findings fixed

    ### 1 (MAJOR) — zebrafish `FAILS_TO_RECAPITULATE` link evidenced from the wrong line
    `animal_models[2]` "Zebrafish cyp1b1 knockout". The misattributed snippet (PMID:39890032's
    *introduction* describing Alexandre-Moreno et al. 2021's line) was removed and the link
    rebuilt so each claim sits with the study that made it:

    - **New reference fetched:** `PMID:34208498` (Alexandre-Moreno et al. 2021, *Null cyp1b1
      Activity in Zebrafish Leads to Variable Craniofacial Defects…*). Quoted its own
      conclusion: *"we did not observe ocular glaucoma-related histological defects associated
      with complete cyp1b1 LoF in zebrafish, which might be due to developmental species
      differences and shows that zebrafish are not adequate to model cyp1b1-associated
      glaucoma"* — this is the paper that actually examined anterior chamber angle and cornea
      histologically (MODEL_ORGANISM / SUPPORT).
    - **Re-scoped the wh5 claims to what PMID:39890032 reports:** added its own conclusion
      *"While these findings could not point to specific ocular defects over other
      neurobehavioral phenotypes"* and *"Larval mutant zebrafish were hyperactive during the
      vision-based larval photomotor response assay"*, both PARTIAL, so the entry no longer
      asserts that the wh5 eye is "indistinguishable from wild type". The species-divergence
      quote was kept.
    - Model `description`, link `description` and `limitations` rewritten: the wh5 line is
      named and characterised as behavioural/metabolomic/transcriptomic (26 differentially
      abundant eye metabolites, altered visual-stimulus responses), the morphological negative
      is explicitly attributed to the separately generated knockout line, and the limitations
      now record that the morphology result comes from a different line and that wh5 mutants
      are not phenotypically normal.

    ### 2 (MAJOR) — one sentence graded two ways for `PMID:9097971`
    `pathophysiology[1].evidence[1]` regraded `HUMAN_CLINICAL` → `IN_VITRO`, matching
    `discussions[0].evidence[0]`, with the same "tissue expression experiment" reason added to
    the explanation. `scripts/check_snippet_grading.py` no longer reports this file. (The now
    stale row in `tests/snippet_grading_baseline.txt` line 86 was **left in place** — protocol
    forbids editing files outside the assigned disorders; a stale baseline row is inert, but
    dropping it is a clean follow-up.)

    ### 3 (MINOR) — GeneReviews graded `HUMAN_CLINICAL` once
    `pathophysiology[8].evidence[1]` (`PMID:20301314`) regraded to `OTHER` with the standard
    "GeneReviews is an expert-curated clinical synthesis rather than a primary study" reason,
    matching the other 16 citations of the same chapter.

    ### 4 (MINOR) — bad "midpoint" arithmetic in `prevalence[1]`
    Note reworded: it now says the source gives no point estimate and that 4.0 is a central
    value on a log scale (geometric mean of the bounds is 3.9), explicitly **not** the
    arithmetic midpoint (5.75). Values unchanged.

    ### 6 (MINOR) — truncated SVEP1 snippet
    `genetic[7]`: snippet extended through the clause the cut removed (*"…and correlate with
    increased disease severity in human families with PCG"*). `notes` and `explanation` no
    longer assert the basis is animal-model work alone. `evidence_source` changed
    `MODEL_ORGANISM` → `OTHER`, since the quoted sentence is a systematic review's second-hand
    summary mixing animal-model expression data with a human-family severity correlation
    (the only other citation of this PMID in the file quotes a different sentence, so no new
    divergence). The `PARTIAL` grading and the "do not report SVEP1 as a cause" warning stand.

    ### 7 (MINOR) — non-significant trend described as a steep dose-response
    `pathophysiology[5]` description no longer says risk "rises steeply"; it now reports the
    stage-wise frequencies and states that the reported trend across stages did not reach
    statistical significance in that 31-eye series, so a gradient is *suggested* rather than
    established. The "dose-response" explanation on the existing evidence item was rewritten,
    and two PARTIAL items were added from the same cached paper: *"the incidence of secondary
    glaucoma tended to increase as the disease progressed"* and *"This retrospective study
    included 31 eyes of 20 patients with Peters anomaly."*

    ### 8 (MINOR, third bullet only) — ANGPT1 listed among the GLC3 loci
    Top-level `description` now reads "the GLC3A-GLC3E loci (CYP1B1, LTBP2, TEK) plus ANGPT1,
    which has no numbered GLC3 designation of its own", removing the contradiction with
    `has_subtypes[6]`.

    ## Findings intentionally skipped

    - **5 (MINOR) — `ANNUAL_INCIDENCE` vs `BIRTH_PREVALENCE` for the Danish row.** The review
      calls it a modelling nit and the entry follows the source's own wording ("annual
      incidence … per 100 000 live born"). Changing `measure_type` is a curation judgment about
      comparability across rows, not an evidence defect; left for a curator.
    - **8 (MINOR, first two bullets) — unsourced mechanistic prose.** The lamina-cribrosa
      explanation of reversible cupping and the "angle incision is much less effective in an
      obliterated angle" surgical corollary are plausible clinical reasoning that the review
      itself hedges on; the Peters series points at corneal staphyloma as the trabeculotomy
      failure predictor. Rewriting the actionable surgical claim needs a clinical source, not a
      wording tweak, so it was left with the finding recorded here.
    - **9 (MINOR) — clinical-trial enrolment figures and the NCT04116450 "or juvenile"
      population.** Enrolment numbers are not checkable from the cached registry records, and
      the review rates the risk as low; no cached source to correct them against.


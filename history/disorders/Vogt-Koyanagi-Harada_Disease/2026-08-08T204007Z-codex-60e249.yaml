  summary: 'Review: Vogt-Koyanagi-Harada disease evidence and causal model'
  details: |
    Completed an independent evidence, completeness, ontology, and causal-graph
    review of Vogt-Koyanagi-Harada disease. Rebuilt the mechanism model as
    atomic, directed steps from HLA-DRB1, PRKCD, CARD9, and immune triggers
    through Th1 inflammation, choroidal and retinal pigment epithelium injury,
    persistent subclinical disease, depigmentation, extraocular involvement,
    and visual loss. Added direct evidence and defensible frequency data for
    core ocular and extraocular phenotypes; expanded progression, diagnostic
    imaging and cerebrospinal-fluid findings, histopathology, biochemical
    monitoring, differential diagnoses, therapies, clinical trials, and the
    Smyth line chicken model.

    Migrated DOI citations to canonical PubMed identifiers where possible,
    fetched every added reference through the repository helper, and documented
    evidence limitations rather than fabricating support for the pre-existing
    GEO dataset. The Falcon report and citation sidecar were consumed, and
    Disease-to-Phenotype suggestions were triaged: independently supported core
    features were retained while redundant, nonspecific, complication-level,
    or apparently conflated ORDO-only terms were not imported mechanically.

    Validation passed with 82 of 82 exact snippets, 218 of 219 weighted
    compliance checks, 12 of 12 phenotypes and 3 of 3 genes connected, no graph
    orphans or broken discussion anchors, successful HTML rendering, and 11
    targeted data tests.

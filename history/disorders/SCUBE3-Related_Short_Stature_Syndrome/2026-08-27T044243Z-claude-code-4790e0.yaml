  summary: 'Create: SCUBE3-Related Short Stature Syndrome'
  details: |
    New entry for ISDS Nosology 2023 group 21 row NOS 21-0240 (OMIM 619184). Mechanistically the outlier of its group: SCUBE3 is a secreted BMP2/4 co-receptor that concentrates BMP receptor complexes in lipid rafts, so the defect is in growth-factor signalling required for endochondral bone formation rather than in DNA replication, centrosome biology or proteostasis like the rest of group 21. Mechanism and the knockout mouse from PMID:37237303; a molecularly confirmed case from PMID:40331102. The Scube3 knockout is linked through modeled_mechanisms with its limitation recorded explicitly - the null mouse is viable and fertile with no overt embryonic phenotype, attributed to redundancy with other Scube family members, so it understates the human disorder. A MONDO label collision is flagged in both the description and the classification note: MONDO:0100297 carries a near-identical label for SSFSC1 (OMIM 617877), a different gene not in this group, so the OMIM number is what identifies the row. Validation: just validate-disorders passes, 17/17 snippets verified.

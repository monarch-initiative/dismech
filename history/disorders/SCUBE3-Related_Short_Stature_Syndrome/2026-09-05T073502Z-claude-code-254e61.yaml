  summary: 'Augment: SCUBE3-Related Short Stature Syndrome (SSFSC2)'
  details: |
    Augmentation of the existing SSFSC2 entry (MONDO:0030953, SCUBE3). The task
    named the disorder de novo, but the duplicate preflight found it already
    curated on origin/main and its claim issue (#8547) already closed, so this
    became an EDIT rather than a CREATE. Compliance went from 82.4% to 96.2%.

    Deep research. Requested provider was falcon; its key was rejected with a
    403 ProviderAuthError, so the run was re-issued with `--fallback` and
    openscientist produced the report. The runner renamed it accordingly:
    research/SCUBE3-Related_Short_Stature_Syndrome-deep-research-openscientist.md,
    with fell_back, requested_provider and provider_attempts in its frontmatter.
    The pre-existing claude_code report from the original curation session was
    read as well. Both validation sections were retro-fitted onto the
    openscientist report (11/11 references resolved, 0 unresolved; 56 terms
    checked, one unresolved UBERON:0002332, which was not used). `just
    preflight-dr ... MONDO:0030953` PASSed with SCUBE3 as the dominant gene
    mention.

    What was added. Nine references were fetched and cached: PMID:34142127
    (saturation-mutagenesis Scube3 spine-deformity mouse plus a matching human
    patient and reduced SMAD transactivation), PMID:27815347 (the Munich ENU
    kta41 line, which carries the N294K substitution that is also a human
    disease allele), PMID:39250278 (SCUBE3 knockdown and rescue in human
    bone-marrow MSCs), PMID:37189178 (epithelium-derived SCUBE3 driving
    odontoblastic differentiation), PMID:40912446 (zebrafish scube single,
    double and triple mutants), PMID:38838658 and PMID:39706863 (two
    independent cohorts reaching the diagnosis by sequencing), PMID:21441952
    (the TGF-beta arm) and the GEO record for geo:GSE56402.

    From those: a new CELLULAR pathophysiology node for the dental arm
    (Impaired BMP-Driven Odontoblast Differentiation) with its own edge into
    Dental anomalies; evidence added to six of the eight previously bare causal
    edges, which was the largest compliance gap - the Microcephaly and prenatal
    growth edges were left uncited on purpose, since no source states either
    link; four new skeletal phenotypes from the
    radiological findings already quoted in the entry (11 pairs of ribs, radial
    bowing, irregular vertebral endplates, narrow iliac wing); two further
    animal models (the saturation-mutagenesis ENU allele and the N294K kta41
    line) alongside the existing knockout, which now also carries entry-level
    evidence; two experimental_models (hBMSC osteogenesis, hDPSC/pulp-dentin
    organoid); a datasets block with geo:GSE56402; and six discussions.

    Datasets. `just discover-datasets` returned three GENE_ONLY candidates.
    Only geo:GSE56402 survived relevance triage - it profiles the Scube3 N294K
    mutant mouse, which is a model of this disorder. The other two (a SCUBE3
    antibody cancer study, an osteoporosis study) were dropped as gene-name
    matches rather than disease-relevant data. `just verify-datasets` resolved
    it and references_cache/GEO_GSE56402.md is committed with the block.

    A correction that matters. The entry's ISDS classification note asserted
    that no cardiac finding is reported in any affected individual. That was
    inferred from the discovery cohort's abstract, and it is stronger than the
    sources support: two independent deep-research runs, against different
    providers, both report atrial septal defect in two of that cohort, tracing
    to HPO annotations on OMIM:619184. The full text of PMID:33308444 is not
    retrievable into references_cache, so no quotable sentence exists either
    way and no cardiac phenotype was added. The note was rewritten to say what
    is actually verifiable, and the open question recorded as a CURATION_TODO
    discussion (scube3_cardiac_clause_unresolved) with an explicit instruction
    not to resolve it from a deep-research report. The rest of that note - the
    Named Entity Confusion warning about SCUBE1/SCUBE2 cardiac biology, and the
    transgenic-overexpression caveat - was left intact and is still correct.

    Citations the reports offered and this entry did not take. The
    openscientist report carries a full HPO frequency table for OMIM:619184
    (brachydactyly 12/15, dental crowding 12/15, enamel hypoplasia 4/15, short
    palm, thick vermilion border, Pierre-Robin sequence and others). None of it
    was curated: those frequencies come from HPO disease annotations, not from
    a sentence in a cachable reference, and the underlying full text is not
    fetchable. Adding the phenotypes without evidence would have traded
    verifiable content for coverage. That decision is now recorded in the entry
    as the scube3_phenotype_frequencies_not_quotable discussion, so the odd
    shape it leaves - four single-case skeletal phenotypes curated while several
    majority-frequency ones are absent - is explained rather than rediscovered. PMID:21441952 was used only inside a
    discussion, graded INDIRECT, because it demonstrates the SCUBE3/TGF-beta
    type II receptor interaction in lung cancer cells; treating that as
    pathophysiology of a skeletal disorder would be the Named Entity Confusion
    the reference SOP warns about. The same reasoning governs the three other
    non-disease-context papers used (hBMSC bone repair, dental pulp
    regeneration, zebrafish development): each is confined to a mechanism claim
    with the context limitation stated in its explanation or the model's
    limitations.

    No treatments section was added, and that is deliberate. PubMed searches
    for SCUBE3 with growth hormone, treatment and management return no
    interventional study, no case series reporting a growth response, and no
    guideline, and there is no GeneReviews chapter for SCUBE3 (searched, no
    hit, so Step 3b does not apply). The gap is recorded as a KNOWLEDGE_GAP
    discussion attached to the empty treatments section rather than filled with
    uncitable supportive-care prose.

    Pre-PR red-team review, and what it caught. An adversarial review was run
    against the dismech-pr-review checklist before committing, and it found a
    real error that this session had introduced and hardened. The entry now says
    plainly that N294K is a mouse ENU allele: it had been described as a human
    disease allele, which no cached source supports - PMID:37237303 calls it an
    ENU-induced mutant allele throughout, and no human report in the cache
    mentions position 294. That claim was load-bearing in three places, all
    corrected: the model's fidelity was dropped from HIGH to MODERATE, the
    dataset's relevance-triage rationale was rewritten to run through the model
    rather than a genotype match, and the trigger node's pre-existing phrase
    "the disease-causing N294K missense allele" (which predates this session)
    was fixed rather than left. The correspondence to the human disease is now
    stated as what it is: a shared cbEGF7 calcium-binding module, with the
    receptor-binding defect demonstrated for the mouse allele.

    The same review round also: split two evidence items that mixed human and
    in-vitro claims in one quote, and one that mixed human and mouse expression
    data; regraded an animal-experiment snippet that had been marked IN_VITRO;
    added directness: INDIRECT to the two odontoblast edges, which rest on a
    sufficiency result in healthy cells read in reverse, and said so in the
    node description alongside a note that the DECREASED modifiers there are
    inferred rather than measured; replaced a methods sentence and a
    "first time" framing sentence used as evidence with the corresponding
    result sentences; named the second ENU allele (C301Y) and corrected a
    limitation claiming its protein function was uncharacterized, which
    PMID:37237303 contradicts; cited the two premises of the
    HUMAN_MODEL_MISMATCH discussion that were quotable but unsourced; hedged
    the cardiac paragraph, which had presented the curator's inference about
    HPO provenance as the deep-research reports' own attribution and had said
    "of the discovery cohort" where the reports say only "two patients"; removed
    a flat negative about hearing and renal findings that repeated the mistake
    the cardiac rewrite was meant to fix; restated the 11-ribs framing, which
    called the finding a single incidental case when the new report puts it at
    roughly 31% (4/13); folded a referral-pathway record that was not a
    diagnostic test into the molecular-testing record's notes; and added a
    reference_title to the one evidence item missing it. Three caches the entry
    does not cite (PMID:24084593, PMID:24849601, PMID:41001785) were kept
    deliberately: the committed openscientist report cites all three, and
    qc-deep-research checks report citation coverage.

    Validation. `just validate` passes (schema, terms, 73/73 snippets verified
    against the cache) and `just validate-disorders` was run as the batched
    pre-PR gate. Also run and passing: check-entity-refs, check-causal-targets,
    check-enum-values, check-duplicate-keys, check-qualifier-terms,
    check-snippet-grading, check-snippet-length, check-title-snippets,
    check-folded-hyphens, model-scale-audit --strict, verify-datasets.
    check-source-defect-claims reports no new contradiction for this entry.
    Compliance after the review round is 96.2%.

  summary: Record why no cardiac phenotype is curated
  details: |
    Added to the ISDS classification notes the reason this entry curates no cardiac phenotype despite the bound disease label reading 'with or without cardiac anomalies 2'. Three points: no cardiac finding is reported in any affected individual, the eighteen-patient discovery cohort included; cardiac and vascular biology in the SCUBE family is almost entirely SCUBE1 and SCUBE2, so importing it would be Named Entity Confusion; and the one genuine SCUBE3 cardiac result is accelerated hypertrophy in transgenic mice OVERexpressing SCUBE3 after pressure overload, which is the opposite manipulation from the human biallelic loss of function. Recorded so the question is not reopened at each review.

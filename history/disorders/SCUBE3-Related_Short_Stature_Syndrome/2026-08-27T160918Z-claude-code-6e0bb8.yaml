  summary: Correct the mouse-hypertrophy timing in the cardiac note
  details: |
    The reviewer caught a factual overstatement I introduced: the note said cardiac hypertrophy in SCUBE3-overexpressing transgenic mice occurred 'only after pressure overload'. The source has it appearing spontaneously at around eight months, with pressure overload augmenting rather than causing it. Corrected, and added the type I collagen promoter detail. The argument is unaffected - it remains an overexpression model, the opposite manipulation from human biallelic loss of function - but the parenthetical made the finding sound more conditional than it is.

  summary: 'Review round 1: add cardiometabolic, musculoskeletal, genital and speech
    phenotypes and surveillance'
  details: |
    Addressed review on PR 15498. Added phenotypes from PMID:28640239 (Table) and the GeneReviews chapter PMID:41926606: Hypercholesterolemia (6/26, 23%), Hypertension (GeneReviews cardiometabolic sentence, no frequency), Scoliosis (6/32), Joint hypermobility (10/30), Clinodactyly (11/28), Body asymmetry (7/30, HP:0100555 Asymmetric growth), Undermasculinized genitalia in males (5/17, HP:0000032 Abnormal male external genitalia morphology, since the table pools several male genital findings (MP, cryptorchidism, hypospadias)), and Speech delay (HP:0000750, GeneReviews 'common', no frequency). Frequencies follow the source counts. Cardiometabolic surveillance now also targets hypercholesterolemia and hypertension, with the GeneReviews blood pressure schedule. Added Glycemic surveillance (hypoglycemia in infancy and childhood) and Sleep apnea surveillance treatments from the GeneReviews surveillance paragraph. The GnRH analogue treatment has no therapeutic_agent because no cached source names the drug. New phenotypes are not wired into the pathograph because no cached source states their mechanism. HP and NCIT CURIEs were looked up in OLS and the NCIT treatment-enum cache. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders. Reflowed the description so retrotransposon-derived is not split across a folded line. Also grandfathered DLK1, MEG3 and RTL1 in tests/gene_activity_grounding_baseline.txt: no cached source supports a molecular function on the nodes they reach (MEG3 is a lncRNA, RTL1 has no established activity, and the only cached DLK1 statement calls it a Notch-like ligand, which does not support GO:0005112 Notch binding).

  summary: 'Create: Temple Syndrome'
  details: |
    New entry for Temple syndrome, curated together with Kagami-Ogata_Syndrome as the reciprocal 14q32.2 DLK1-DIO3 imprinting disorders, with loss of DLK1 and of the retrotransposon-derived RTL1 (PEG11/SIRH2) as the mechanisms.

    MONDO choice: MONDO:0100507 (multiple congenital anomalies due to 14q32.2 paternally expressed gene defect, exact synonym Temple syndrome) is the primary disease_term. It is the sibling of the KOS class MONDO:0016779 under MONDO:0100499, its definition describes the whole syndrome, and Silver_Russell_Syndrome.yaml already uses it for its Temple syndrome differential. MONDO:0014541 (motor developmental delay due to 14q32.2 paternally expressed gene defect) carries OMIM:616222 and ORPHA:254516 (Orphanet maps it as exact) and has the three molecular subtype classes as children, so it is the same disease; it is recorded as skos:exactMatch, with the reason in mapping_justification, so the near-duplicate is retired from the curation queue. It was not chosen as primary because its label and definition describe a single feature and only the maternal UPD14 mechanism. MONDO:0019915, MONDO:0016782 and MONDO:0016780 bind the UPD(14)mat, epimutation and microdeletion subtypes.

    Sources: GeneReviews chapter (PMID:41926606, tagged), Ioannides 2014 (PMID:24891339, 51 cases, phenotype frequencies), Kagami 2017 (PMID:28640239, 32 Japanese patients, full text), Prasasya 2020 review (PMID:32592473), GH studies (PMID:36977395, PMID:30836360), Orphanet ORPHA:254516. Mouse evidence (PMID:32878913, PMID:28111885, PMID:18176565) is graded MODEL_ORGANISM. All MONDO, HP, GO, CL and HGNC CURIEs were looked up via OLS or the HGNC REST API when written; NCIT terms were read from cache/ncit/terms.csv.

    Genes DLK1, RTL1 and MEG3 are recorded without relationship_type, because no enum value fits an imprinted dosage gene.

    Deep research: just research-disorder openscientist Temple_Syndrome produced research/Temple_Syndrome-deep-research-openscientist.md (30/30 references resolved; needs_review true: 1 unsupported quote PMID:42677749, 1 off-topic PMID:39889767). The report gives a wrong HGNC id for RTL1 (HGNC:35814; the correct id is hgnc:14665) and a different Orphanet number from MONDO's xref, and its term validation flagged NCIT mislabels. No claim was taken from the report; the entry is built on the cached primary sources above. preflight-dr could not run (no local MONDO build); identity was checked by hand against MONDO:0100507.

    Validation: just validate, validate-terms, count-verified-snippets (62/62 for this file) and validate-disorders passed; whole-repo gates passed.

  summary: 'Review round 1: phenotype connectivity, two retracted notes claims, convergence
    split, prevalence and progression'
  details: |
    Response to review round 1 on PR #10532. Seven blocking items and most of the suggestions.

    The reviewer's central diagnosis was correct and is the thing worth recording. Two claims in notes asserted that facts were unavailable when they were sitting in full-text reference files this PR itself committed. Vinblastine was said to have no CHEBI term; CHEBI:27375 vincaleukoblastine is vinblastine, was already in the committed cache, and was already bound to this agent elsewhere in the knowledge base. No quotable female-predominance ratio was said to exist; PMID:35670122, cited five times in this entry, states that desmoid tumours occur predominantly in women, approximately 70 percent of cases. Both claims are now retracted in notes rather than silently deleted.

    The cause of both was the same and is worth naming: PMID_37436594 and PMID_35670122 are full-text reviews of 69k and 35k characters, not abstracts, and they had been read selectively for the specific claims being written rather than end to end. They were subsequently read in full, which is where the codon frequencies, the prospective active-surveillance figures, the misdiagnosis rate, the postsurgical recurrence ranges and the two NCT identifiers all came from. This is the same failure class as concluding absence from a truncated query.

    Blocking items. Phenotype connectivity was the largest: the pathograph had no edge reaching any phenotype, so all five rendered disconnected from the mechanism producing them. Local Tissue and Organ Compromise now has downstream edges to Chronic Pain, Limitation of Joint Mobility and Intestinal Obstruction, using bare names per the pathograph-target convention. The truncated mid-word snippet was replaced with the full sentence carrying its 57-86 percent figure. Pregnancy now declares influences_mechanisms toward Clonal Myofibroblast Proliferation with EXACERBATES, and carries both the supporting estrogen evidence and a REFUTE item recording that the antiestrogen therapeutic test was uncontrolled and abandoned by guidelines. A structured prevalence block was added. PMID:15375433 was regraded IN_VITRO to HUMAN_CLINICAL, matching the other human IHC study in the file, and its background-prose snippet was swapped for the tissue-microarray result.

    Suggestions taken. The convergence argument now lives in the graph rather than only in prose: node one was split into CTNNB1 Exon 3 Activating Mutation and Germline APC Loss of Function, both feeding the shared degradation-failure node, which also gives the two subtypes distinct mechanistic anchors. The natural-history node is no longer isolated, reached by an edge from Clonal Myofibroblast Proliferation. Spontaneous regression was upgraded from 5-10 percent to the 10-28 percent estimate plus the prospective 55 percent figure from NCT02547831, with the older figure retained to show the range. A four-phase progression section was added. Codon frequencies were promoted from unevidenced notes to an evidence item. clinical_trials records DeFi and RINGSIDE. biological_scale and therapeutic_modality were populated.

    One suggestion declined with reasons. conforms_to sustaining_proliferative_signaling does not fit: that module's central node is defined as flux through RAS-RAF-MEK-ERK and PI3K-AKT-mTOR and is bound to GO:0007265 Ras protein signal transduction, whereas desmoid tumour is driven by canonical Wnt/beta-catenin and shares none of that machinery. A conforming node would carry none of the module's expected biological processes. Reasoning recorded in notes, along with the observation that invasion_and_metastasis is inapplicable for a more interesting reason: this tumour invades but provably never metastasises, satisfying half the module and refuting the other half.

    A process note. Three content gates initially failed after these edits, in Epidermolysis_Bullosa_Simplex, Appendiceal_Neoplasm, Bullous_Pemphigoid, Follicular_Lymphoma, Meckel_Diverticulum and others. None were in this diff. The branch had gone stale against a moved origin/main, so the gates were evaluating other contributors' files. The branch was rebased on current origin/main and the post-rebase diff reviewed for unrelated deletions or protected-path churn before continuing; 30 files, all in scope. All gates then passed.

    Validation: 76/76 snippets verified, term validation passes, weighted compliance 100.0 percent, all content gates clean.

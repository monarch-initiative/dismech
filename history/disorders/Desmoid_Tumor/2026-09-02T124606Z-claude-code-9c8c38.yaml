  summary: 'Create: Desmoid Tumor MONDO:0007608'
  details: |
    Created from PubMed literature directly rather than from a deep-research report: both configured research providers were unavailable. openscientist.io returned a CloudFront 403 on POST ("distribution supports only cachable requests") and 401 on authenticated GET; the cyberian backend returned 500 from localhost:3284. Sixteen candidate PMIDs were found by NCBI esearch, fetched with just fetch-reference, and read in full before any YAML was written.

    The pathograph is a short convergent chain rather than a branching one, because that is the biology. Two genetically distinct lesions - somatic CTNNB1 exon 3 mutation in sporadic disease, germline APC loss in familial adenomatous polyposis - converge on one biochemical failure, the Axin/APC/GSK3-beta destruction complex no longer degrading cytoplasmic beta-catenin. From there: nuclear beta-catenin, clonal myofibroblast proliferation, infiltrative growth without metastatic capacity, local organ compromise.

    Two nodes are deliberately not part of the chain. Notch Pathway Dependence is marked mechanism_confidence HYPOTHETICAL because the evidence for it is the response to gamma-secretase inhibition in the DeFi trial, not direct pathway measurement in this tumour - the node is inferred backwards from therapy. Unpredictable Natural History with Spontaneous Regression is a property rather than a step, included because it is the single most consequential fact about the disease: it is why surgery lost its first-line role, and it is why uncontrolled treatment series here overstate benefit. The sorafenib trial makes that quantitative, with 36 percent of placebo patients progression-free at two years.

    The two chemotherapy entries carry their own evidence of having no randomised control ("There were no randomized controlled trials", "There was no case-control report (vs. no treatment)") rather than response rates alone, for the same reason.

    Ontology notes. HPO has exact terms for both the lesion (HP:6001034) and its intra-abdominal form (HP:0100245), so no generic parent was needed. Three NCIT terms were initially bound wrongly: Gamma-Secretase Inhibitor and Tyrosine Kinase Inhibitor are drug classes, not medical actions, and Surveillance is not under NCIT:C25218 at all. The two drug classes moved to therapeutic_agent alongside the specific CHEBI drug; Active Surveillance was left without a treatment_term, because nothing under the enum root represents watchful waiting and binding it to a generic Observation Activity would have misrepresented it. That was caught by the term validator, not by inspection.

    Validation: 49/49 snippets verified, term validation passes, weighted compliance 100.0 percent, all content gates clean. Top-level references generated programmatically from cache frontmatter rather than typed.

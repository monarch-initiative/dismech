  summary: 'Create: PSMC1-related neurodevelopmental disorder (MONDO:0859296)'
  details: |
    Resolved curation claim #10985 as a standalone DISEASE entry. Identity work: the stub recorded no causal gene, so the gene was obtained outside MONDO - MONDO:0859296 xrefs OMIM:620071, and NCBI mim2gene_medgen plus MedGen's curated gene-disease link both map MIM 620071 to GeneID 5700 = PSMC1. The defining publication is Aharoni et al. 2022 (PMID:35861243), an autosomal recessive syndrome in three siblings of one consanguineous Bedouin Israeli kindred homozygous for PSMC1 p.I328T. Checked for an existing gene-named entry: PSMC1 appears in kb/ only inside review snippets cited by the PSMB1 entry (Neurodevelopmental_Disorder_with_Microcephaly_Hypotonia_and_Absent_Language), which is a different gene and a different OMIM entity, and Proteasome_Associated_Autoinflammatory_Syndrome covers the immunoproteasome/PRAAS side. No overlap, so a standalone entry was correct. Structure was modelled on the sibling PSMB1 proteasomopathy entry. Pathograph: a five-node molecular chain (variant -> destabilised AAA+ ATPase fold -> reduced 26S proteolytic capacity -> accumulation of ubiquitinated substrates -> neuronal proteostasis failure) with eight edges out of the terminal node to the neurological phenotypes, every one of them causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES with directness INDIRECT, because no source demonstrates the step from proteostasis failure to any specific finding. Structural-modelling evidence is graded COMPUTATIONAL and the fly and mouse results MODEL_ORGANISM. Two animal models: the Drosophila Rpt2 eye-knockdown complementation assay (PERTURBS, with a RESTORED rescue readout that is the sole evidence the allele is hypomorphic rather than null) and the Psmc1 neuron-restricted conditional knockout mouse (PMID:18701681; PARTIALLY_RECAPITULATES, fidelity LOW, with the genotype and phenotype mismatches recorded in limitations). Sixteen phenotypes; eight are wired and eight are deliberately unwired with the reason recorded in each notes field. No frequency band is asserted anywhere - every proportion is a 3/3 or 2/3 count within one sibship. A duplicated renal collecting system and a ventricular septal defect in one patient were NOT curated, because the source itself says they may be unrelated. Three discussions: single-kindred phenotype boundary (KNOWLEDGE_GAP), model-genotype mismatch (HUMAN_MODEL_MISMATCH), and the hypogonadism that is unique to PSMC1 within the proteasomopathies (KNOWLEDGE_GAP). Every snippet was additionally verified by hand as a raw exact substring of its cache file, and every reference_title against the cache frontmatter. Validation: just validate, validate-terms, count-verified-snippets (67/67, no prefix skips), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders, check-title-snippets, check-snippet-length, check-snippet-grading, check-stubs all pass. Stub deleted.

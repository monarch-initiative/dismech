  summary: 'Address review on PR #10997: add gastrostomy feeding and four phenotypes'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10997. Blocking item addressed: the one intervention actually documented in the source - gastrostomy feeding - was missing from a treatments list otherwise made of standard-of-care inferences. Added a Gastrostomy Feeding treatment bound to NCIT:C93322 (Enteral Tube Feeding, which validates as reachable from NCIT:C25218), with the exact quote 'was fully nonambulatory, fed through gastrostomy, with severe failure to thrive' as evidence_source HUMAN_CLINICAL, a second INDIRECT item quoting the per-patient table legend that defines PEG, and a target_mechanisms link to the Failure to Thrive phenotype with treatment_effect BYPASSES. That link also gives Failure to Thrive an incoming graph edge, so it is no longer disconnected. therapeutic_modality is DEVICE rather than BEHAVIORAL, with the reason recorded in the treatment's notes: this is nutrition delivered through a surgically placed tube, not a dietary or behavioural change. Non-blocking suggestions also addressed. Added Feeding Difficulties (HP:0011968), graded INDIRECT throughout because the source documents the intervention rather than naming the finding, and left unwired. Split the cranial findings out of Abnormal Facial Shape into their own phenotypes, Dolichocephaly (HP:0000268) and Microcephaly (HP:0000252), both recorded as borderline; note the reviewer suggested HP:0000252/HP:0000256 for this, but HP:0000256 is Macrocephaly, so HP:0000268 was used for dolichocephaly instead. Added Widened Subarachnoid Space (HP:0012704) for the previously prose-only broadened extra-axial space, wired from Neuronal Proteostasis Failure on the same INDIRECT footing as Ventriculomegaly since it is the same observation on the same scans; its evidence snippet was extended to the full MRI sentence. Added explanatory notes to the five treatments that carry no evidence item, following the pattern the reviewer praised on Supportive and Symptomatic Care. Updated the entry's notes block: the unwired count is now ten and Failure to Thrive is described as treatment-linked. On the reviewer's disclosed limitation, no GeneReviews chapter exists for PSMC1 and none was cited either way, so nothing rests on it. Validation after the changes: just validate, validate-terms, count-verified-snippets (75/75, no prefix skips), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens, validate-disorders, plus whole-KB check-title-snippets, check-snippet-length and check-snippet-grading all pass. Every snippet re-verified by hand as a raw exact substring and every reference_title against the cache frontmatter. No cache rows were added: all five new CURIEs were already cached.

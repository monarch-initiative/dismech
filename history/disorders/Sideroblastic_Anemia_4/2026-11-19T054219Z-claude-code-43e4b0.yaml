  summary: 'Create: Sideroblastic Anemia 4'
  details: |
    Created the HSPA9 entry (MONDO:0008422). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true; it passed just preflight-dr (HSPA9 mentioned 51 times). The entry is named Sideroblastic Anemia 4 after OMIM 182170 rather than the MONDO label autosomal dominant sideroblastic anemia, because the founding study states the disease is recessive and that the apparently dominant pedigrees are pseudodominant; by the entry-naming rule a name must not assert more than the entry supports. The MONDO label is kept in synonyms, and the mismatch is recorded in notes as a candidate upstream MONDO label correction that has not yet been reported. Two inheritance blocks are recorded, recessive and pseudodominant, because the second is a distinct claim with its own evidence. The pathophysiology is an unbundled chain of nine nodes with two separate trigger nodes, a severe allele and a common low-expression allele, converging on chaperone dosage; the central effector is the transfer step to glutaredoxin 5. The iron regulatory protein 1 to ALAS2 steps are marked INDIRECT and their inferred status is stated in the node descriptions, because the experimental support comes from glutaredoxin 5 and co-chaperone models rather than from HSPA9 patient erythroblasts. Per-patient haematology values and variant phasing are in the founding paper's tables rather than its abstract and were deliberately not curated as evidence-backed claims. Three discussion sections cover whether the common allele is causal or a linkage marker, the unverified ALAS2 route, and why one gene gives both this anemia and EVEN-PLUS syndrome, each with a proposed experiment. Two nodes conform to the new mitochondrial_iron_sulfur_cluster_assembly_failure module. Review round 1 addressed a blocking finding that six evidence items were marked SUPPORT for claims their snippets did not make, two of them with explanations that admitted it. The ALAS2 repression step now cites the zebrafish and human erythroid demonstrations of the IRP1-to-ALAS2 route (PMID:16110529, PMID:20364084), marked INDIRECT because both are glutaredoxin 5 rather than HSPA9. The other five claims lost their quotes rather than keeping a non-supporting one: the prevalence band, the progression phase, the microcytosis row, the erythropoiesis node's dosage argument, and a discussion item whose quote was about genotyping technology. Each now carries its own notes saying it is deliberately unevidenced and where the real figure lives, and the entry-level notes summarise the policy. Forced re-fetches of both PMID:26491070 and PMID:30401706 returned abstract_only, so the tables could not be used. The pseudodominant inheritance block was unbound from HP:0000006, because binding autosomal dominant would make the entry machine-assert the mode its own naming argument rejects; HPO has no pseudodominance term, and the searches run are recorded in notes. A treatments section was added with transfusion and pyridoxine, both with notes stating what is not known rather than evidence items. The two conforms_to anchors were removed because the module is not yet on main; the wiring is deferred to a follow-up PR. Review round 2 found that two of round 1's claimed fixes had never landed. The script making them raised an AssertionError on a later edit before writing the file, so every edit in that script was lost, and the round-1 commit message asserted work that was not in the tree while the entry-level notes described a state the YAML contradicted. The prevalence evidence item and the discussion's genotyping-technology item are now actually removed, verified by grepping for both snippets and getting zero, and the prevalence row carries the deliberately-unevidenced note the others got. Round 2 also took three suggestions: the cross-entry pyridoxine claim now points at the ABCB7 entry that carries its evidence instead of asserting it here, the erythropoiesis node's evidence is marked INDIRECT, and the transfer node names HSPA9 itself alongside its partners. A later push fixed a CI failure the earlier rounds had missed: check-gene-activity-grounding reported HSPA9 as newly wired into the pathograph with no molecular function on the node it reaches. The central effector, the transfer of the nascent cluster to glutaredoxin 5, now binds GO:0140132 iron-sulfur cluster chaperone activity, whose GO definition is binding an iron-sulfur cluster and delivering it to an acceptor molecule - which is precisely the step that node represents and that its cited evidence describes. Validated with just validate-disorders (174 snippets and 174 titles across the batch, 0 issues) and just check-entity-refs.

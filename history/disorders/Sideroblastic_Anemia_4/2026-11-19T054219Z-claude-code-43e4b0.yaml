  summary: 'Create: Sideroblastic Anemia 4'
  details: |
    Created the HSPA9 entry (MONDO:0008422). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true; it passed just preflight-dr (HSPA9 mentioned 51 times). The entry is named Sideroblastic Anemia 4 after OMIM 182170 rather than the MONDO label autosomal dominant sideroblastic anemia, because the founding study states the disease is recessive and that the apparently dominant pedigrees are pseudodominant; by the entry-naming rule a name must not assert more than the entry supports. The MONDO label is kept in synonyms, and the mismatch is recorded in notes as a candidate upstream MONDO label correction that has not yet been reported. Two inheritance blocks are recorded, recessive and pseudodominant, because the second is a distinct claim with its own evidence. The pathophysiology is an unbundled chain of nine nodes with two separate trigger nodes, a severe allele and a common low-expression allele, converging on chaperone dosage; the central effector is the transfer step to glutaredoxin 5. The iron regulatory protein 1 to ALAS2 steps are marked INDIRECT and their inferred status is stated in the node descriptions, because the experimental support comes from glutaredoxin 5 and co-chaperone models rather than from HSPA9 patient erythroblasts. Per-patient haematology values and variant phasing are in the founding paper's tables rather than its abstract and were deliberately not curated as evidence-backed claims. Three discussion sections cover whether the common allele is causal or a linkage marker, the unverified ALAS2 route, and why one gene gives both this anemia and EVEN-PLUS syndrome, each with a proposed experiment. Two nodes conform to the new mitochondrial_iron_sulfur_cluster_assembly_failure module. Validated with just validate-disorders (174 snippets and 174 titles across the batch, 0 issues) and just check-entity-refs.

  details: |
    Response to review round 1 on PR #11460. All four blocking items and all actionable suggestions, bundled into a single push as requested.

    The first blocking item is the one worth dwelling on, because I introduced it during a self-review an hour earlier. The obesity-prevalence counterevidence carried supports REFUTE while attached to the multifactorial hypothesis, so the structured claim was that the quote contradicts the multifactorial account. Its own explanation said the opposite, that it challenges an obesity-driven mechanical account. The supports value and the explanation contradicted one another and I did not notice, because the self-review checks I ran were mechanical - truncation detection, evidence_source consistency, duplicate keys, orphan nodes - and none of them compare a supports value against the prose beside it. Self-review catches mechanical defects reliably and reasoning defects poorly, which is an argument for the external reviewer rather than against it. The item now sits on the mechanical hypothesis where the body-mass premise it contradicts actually lives.

    Second, the radiographic diagnosis node asserted that imaging separates progressive disease from physiological bowing but was evidenced by a sentence about pre-operative surgical planning. PMID:32809758, already cited eight times here, contains a sentence stating that radiographic findings are diagnostic and naming the Langenskiold system; that now leads the node, with the planning sentence retained as secondary support. While making this fix I attached the new snippet to the wrong reference and the validator caught it immediately.

    Third, limb length discrepancy was missing from phenotypes despite being quotable from two references already cached in this PR. Added as HP:0100559 Lower limb asymmetry with an incoming edge from the deformity node.

    Fourth, non-operative bracing had been omitted on the stated grounds that no NCIT action term exists under NCIT:C25218. The instinct was right but the conclusion was wrong: CLAUDE.md documents a device-qualifier pattern for exactly this case. The action binds NCIT:C49236 Therapeutic Procedure and the device is carried as a qualifier with NCIT:C16830 Medical Device as predicate and NCIT:C86054 Brace as value. All three terms were looked up with the local ontology databases rather than written from memory, as the reviewer asked. NCIT:C86054 is genuinely not under the TreatmentActionTerm root, which is precisely why it belongs in the qualifier slot.

    Suggestions taken. The Hueter-Volkmann edge now leads with PMID:17585254, an ovine proximal tibial preparation explicitly framed as a Blount model - same bone, same physis, direct mechanical measurement - and that study also becomes the entry's only animal model, giving the graph a join point it lacked. The finite-element scoliosis study is retained on the growth-suppression node with its honest mismatch disclosure intact. Langenskiold staging fills the progression gap, and it is recorded with its own limitation: neither the femorotibial nor the metaphyseal-diaphyseal angle predicted which limbs would resolve before age four, so the staging grades severity without predicting individual course. The genetic relationship_type moved from DISPUTED to UNKNOWN, since the record asserts that no gene is known rather than that a specific relationship is contested. Leptin was correctly omitted and stays omitted.

    A new REFUTE item was added to the bracing treatment from PMID:11922370, which found no difference in resolution rate between braced and untreated limbs and advised no initial treatment with six-monthly review. Recording the treatment without that evidence would have overstated it.

    Validation: 65/65 snippets verified, term validation passes, qualifier terms pass, weighted compliance 100.0 percent, all content gates clean. Topology verified by parsing: no dangling targets and no orphan phenotypes other than the deliberately unparented Obesity risk factor.

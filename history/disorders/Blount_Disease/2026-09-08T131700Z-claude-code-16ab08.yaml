  summary: 'Create: Blount Disease MONDO:0017194'
  details: |
    Created from PubMed literature with a five-iteration OpenScientist deep-research job as a cross-check.

    This entry is structurally unlike most in the knowledge base. There is no molecular initiating lesion, no causal gene, and the aetiology is formally unknown. The pathograph therefore models a biomechanical hypothesis, and the uncertainty is expressed in node confidence rather than only in prose: the initiating load node is HYPOTHETICAL, the growth-suppression node PROVISIONAL, and only the histological lesion and its downstream consequences are asserted plainly.

    The evidence grading is the substance of the entry. The only systematic review of the aetiology literature concludes that the origin is multifactorial and that every supporting paper is low level of evidence. That review is recorded as an ALTERNATIVE mechanistic hypothesis with a note stating that on the evidence it is probably the more accurate account, and that it is listed as the alternative only because it does not specify a causal chain that can be drawn as a graph. A reader should not read the CANONICAL status of the mechanical hypothesis as a claim that it is established.

    The graph deliberately contains a cycle. Tibia vara displaces the limb mechanical axis medially, which increases the medial load that produced it, so the deformity is self-reinforcing rather than self-limiting. A consequence is that a root-finding check returns empty, since every pathophysiology node has an incoming edge; the entry points are the two environmental factors declaring influences_mechanisms onto the load node. This is documented in notes so a reviewer does not read the absent root as a modelling error. The Obesity phenotype is likewise deliberately unparented, being a risk factor rather than a consequence.

    Guided growth is the disease mechanism run backwards, which is the strongest practical argument that the mechanism is real. Hemiepiphysiodesis compresses the lateral physis so the medial side can catch up, using the same growth-modulation principle the disease is proposed to exploit. That is also why medial epiphysiodesis is modelled as its own node: once the physis closes the modulation route is gone and treatment becomes reconstructive.

    The deep-research report contributed three things the initial draft lacked, each verified against the cited paper before use. A negative whole exome sequencing result in a series with 62 percent positive family history, which is why the genetic section exists specifically to record that no gene is known. A quantitative natural history, 64 percent of varus legs resolving over time with severe bowing persisting in 9 percent, which qualifies the relentlessly progressive framing taken from the review literature. And direct vitamin D measurement showing only 16 percent of patients deplete, which downgrades hypovitaminosis D from a listed extension point to a qualified negative.

    Two disagreements were left unresolved rather than silently reconciled. Sources differ on the age cut-off separating early from late-onset disease, two giving four years and one giving ten; both are cited. And the guided-growth treatment carries a REFUTE item quoting the same review that endorses it calling the technique controversial, because both statements should travel together.

    Process. Content_type was checked on every cache before writing; only one of ten was full text at draft time, with a second added later. Topology was verified by parsing, which caught five orphan phenotypes on the first pass, all connected before commit.

    Validation: 50/50 snippets verified, term validation passes, weighted compliance 100.0 percent, all content gates clean.

  summary: 'Review round 2: regrade ex vivo lamb study to IN_VITRO, extend three truncated
    snippets'
  details: |
    Response to review round 2 on PR #11460. Both items accepted; no disagreement.

    The evidence_source grading on PMID:17585254 was wrong. The lamb study is an ex vivo mechanical preparation - fresh proximal tibia specimens mounted on a servohydraulic test frame - and CLAUDE.md places tissue explants and ex vivo material under IN_VITRO, reserving MODEL_ORGANISM for in vivo animal data. All three items citing that paper are regraded. The reviewer also confirmed the model belongs in animal_models rather than experimental_models, since the latter is for non-animal systems, so only the grading changed.

    This is the second instance in two rounds of the same failure class: a structured enum value contradicting the prose sitting next to it. In round one it was supports REFUTE on a hypothesis whose explanation argued against a different hypothesis. Here the limitations text on the same block already said "not a living animal" while the evidence_source said MODEL_ORGANISM. Both times the entry contained its own refutation and no gate caught it, because gates check that values are members of an enum, not that they agree with adjacent prose.

    A check for that class has been written and is now part of the pre-commit routine. It compares evidence_source against ex vivo and in vivo markers in the surrounding description, limitations and explanation text, and compares supports against language in the explanation that argues for or against. Run against the pre-fix state of this file it reproduces the reviewer's finding; run against the fixed state it reports clean.

    The second item was a snippet cut mid-word, ending at "six-monthly inter". Extended to the full sentence.

    A process correction matters more than either fix. A truncation check had already been run on this file during an earlier self-review and reported clean, but two further truncations were introduced afterwards by the round-1 response and went unchecked, because the checks were run in the middle of the work rather than at the end. Running the full battery as the final step before commit found both immediately - two snippets citing PMID:32809758 that stopped before the end of the sentence. Checks now run last, not midway.

    Validation: 65/65 snippets verified, term validation passes, qualifier terms pass, weighted compliance 100.0 percent, all content gates clean, no truncations, no value/prose contradictions, no dangling targets.

  summary: 'Review round 1: human support for the pneumonia edge, bubonic fever route,
    supportive-care source'
  details: |
    Answers the CHANGES_REQUESTED review on PR #16857.

    Blocking finding: the Pneumonic Plague -> Pneumonia edge was supported only by a MODEL_ORGANISM item (PMID:30940874, a review sentence sourced to murine work). Added PMID:23041039 alongside it, graded HUMAN_CLINICAL / INDIRECT / REVIEW_SYNTHESIS as the same sentence already is on the sibling Cough edge, so the human phenotype no longer rests on murine support alone.

    Re-running the Supportive Care treatment's recorded negative-existence search refuted it. PMID:3716968 (Welty, Am Fam Physician 1986) states that successful plague treatment depends on early diagnosis, effective antibiotics and adequate supportive care. It is now fetched, cited on the treatment, and quoted with the source's own 'plaque' misspelling. The note was rewritten: it now carries both PubMed queries verbatim with their dates and hit counts (21 and 0), names PMID:42842561 as the only other candidate and says why it was not used, and gives the actual reason no target_mechanisms link is recorded - no source states which mechanism supportive care acts on.

    Added a Lymph Node Colonization and Bubo Formation -> Fever edge on the PMID:37943880 sentence placing fever after the bubo in 78% (1004/1279) of confirmed bubonic cases, graded INDIRECT on the same frequency-only basis the Sepsis and DIC edges in this PR already use. This removes the asymmetry the reviewer flagged. The septicemic route to fever stays unwired and the Pneumonic Fever edge's description was corrected to say so.

    Entry note: the five-term absence search was re-run over all 15 cited references (up from 14) and still returns nothing, so the count was updated rather than left stale; added a clause recording that the Pneumonia description's mention of dyspnea is unsourced in the same way the purpura one is.

    Validation: validate passes, 51/51 snippets verified, validate-terms passes, and check-causal-targets, check-entity-refs, check-name-collisions, check-logical-rules, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-snippet-length, check-snippet-grading, check-title-snippets, check-reference-titles, check-cache-order and check-granularity are all clean. Phenotype connectivity is unchanged at 7/10; Purpura, Splenomegaly and Dyspnea remain unwired for the documented reason.

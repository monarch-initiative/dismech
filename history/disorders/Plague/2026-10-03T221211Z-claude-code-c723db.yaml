  summary: Backfill agent_life_cycle; mark three subtypes as pointers (#10115, R26
    and R20)
  details: |
    Added agent_life_cycle for Yersinia pestis. Hosts: Rattus (NCBITaxon:10114, rodent host of the enzootic cycle), Cynomys (NCBITaxon:45478, prairie dogs, the burrowing rodent whose colonies suffer the die-offs that raise human risk), Xenopsylla cheopis (NCBITaxon:163159, the flea in which proventricular blockage and regurgitative transmission are most frequent), Homo sapiens (NCBITaxon:9606, accidental host). Vectors: the Oriental rat flea plus other rodent fleas of the sylvatic cycle. Three stages: enzootic sylvatic maintenance in burrowing rodents and their fleas (PMID:39179552 for the persistence of foci and for the host list naming mice, rats, prairie dogs and ground squirrels; PMID:30940874 independently assigning the reservoir role to wildlife rodents), epizootic amplification and rodent die-off (PMID:18689662 for the prairie dog die-offs, and for its own statement that an interepizootic small-rodent reservoir is argued but has little empirical support, which is why no such host is bound), and flea acquisition with proventricular blockage and transmission to humans (PMID:39179552 quantifying blockage in X. cheopis). Block evidence PMID:39179552 states the stable rodent-flea cycle that keeps the agent endemic. The block is placed immediately after infectious_agent, which is its position in the schema's slot order. Two new references fetched: PMID:39179552 and PMID:18689662. Separately, added curated_in pointers to the three has_subtypes rows (Bubonic -> Bubonic_Plague, Septicemic -> Septicemic_Plague, Pneumonic -> Pneumonic_Plague), each of which is also a standalone entry; check-granularity previously reported all three as DOUBLE_MODELLED and now reports them as POINTER. Nothing else in those rows was touched and the three standalone entries were not edited. Validated with linkml-validate, linkml-term-validator, count-verified-snippets (647/647 across the tranche), check-granularity (MISSING_LIFECYCLE cleared, DOUBLE_MODELLED cleared, --strict exits 0) and validate-disorders (0 issues).

  summary: Wire Plague phenotypes, ERAP2 node and antibiotic target_mechanisms
  details: |
    Pathograph wiring pass for issue #16719. Added causal edges from the lymph-node colonization node to Bubo, from the septicemic node to Sepsis and Disseminated Intravascular Coagulation, and from the pneumonic node to Pneumonia, Cough, Chest Pain and Fever, taking phenotype causal-inlink coverage from 0/10 to 7/10. Connected the previously floating ERAP2 Evolutionary Selection node to Phagocytosis Inhibition and Bacterial Replication as a host modifier, using the ERAP2 macrophage-control evidence already in the entry. Added target_mechanisms to the aminoglycoside and tetracycline treatments; Supportive Care was left unlinked because no cached or searchable source states anything about supportive care in plague, and the searches run are recorded in its notes. Bound subtype_term on the three pointer subtypes (MONDO:0001112, MONDO:0005956, MONDO:0001024), clearing three UNBOUND_SUBTYPE advisories. Purpura, Splenomegaly and Dyspnea are left unconnected with the reason recorded in entry notes. Four references were newly fetched: PMID:33298527, PMID:37943880, PMID:23041039, PMID:10807389.

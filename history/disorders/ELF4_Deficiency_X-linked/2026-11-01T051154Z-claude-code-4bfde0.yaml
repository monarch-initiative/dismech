  summary: 'Create: ELF4 deficiency, X-linked (DEX)'
  details: |
    Created the ELF4 deficiency, X-linked (DEX) entry. Deep research via claude_code;
    preflight-dr confirmed ELF4 dominant with matching OMIM 301074. Evidence anchored on
    fetched primary abstracts (Tyler 2021 Nat Immunol discovery PMID:34326534, Sun 2022 LOF
    PMID:35266071, DEX cohort/entity review PMID:38231408, females-with-skewed-XCI
    PMID:39976696). Atomic pathograph: ELF4 LOF variant -> loss of ELF4 transcriptional
    restraint of inflammation (macrophage) -> macrophage hyperinflammatory response and
    impaired antiviral control -> mucosal/systemic autoinflammation; 9/9 phenotypes connected
    (recurrent aphthous stomatitis, colitis, fever, arthritis, arthralgia, myalgia, weight
    loss, anemia, recurrent infections). X-linked inheritance with affected skewed-XCI females
    recorded. Treatments: anti-TNF biologic, IL-1 blockade (anakinra), vedolizumab. No module
    conformance target (transcriptional inflammation regulator). All gates pass.

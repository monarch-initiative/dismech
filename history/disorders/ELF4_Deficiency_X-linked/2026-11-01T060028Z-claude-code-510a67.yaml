  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED. Added disease_term MONDO:0024770 and a genetic: section (ELF4 hgnc:3319, CAUSATIVE) with ClinGen Definitive XL gene_disease_validity (CGGV assertion), variant classes (frameshift/nonsense NMD, ETS-domain missense, exon 2-7 deletion, intronic splice) and maternal-vs-de-novo origin (11/12 maternal), all from cached PMID:38231408 full text. Mined the Olyha 2024 cohort: added skin inflammation, abdominal pain, diarrhea, decreased appetite, fatigue, neutrophilic leukocytosis, thrombocytosis, elevated CRP/ESR phenotypes with cohort fractions; fixed frequencies (oral ulcers VERY_FREQUENT->FREQUENT 11/14; fever 9/13; colitis backed by 7/8 GI-ulcer figure). Softened 'recurrent infections' to OCCASIONAL with a REFUTE from the cohort ('sporadic ... absence of specific immunodeficiency'). Added TREM1/neutrophil amplifier node (Th17/neutrophil recruitment; Trem1-blockade mouse). Added treatments: systemic glucocorticoids (14/14), ustekinumab+canakinumab, exclusive enteral nutrition, colchicine (REFUTE); gave IL-1 blockade a PROTEIN_REPLACEMENT rationale + target_mechanisms. Added diagnosis, two Elf4 mouse models (PMID:34326534) with modeled_mechanisms, prevalence (CASES_IN_LITERATURE, ultra-rare, n=14). Corrected the OMIM/NF-kB notes. 17/17 phenotypes causally connected. validate-disorders (45/45 snippets), terms, causal-targets, entity-refs, logical-rules, gene-validity, model-scale-audit, coarse/qualifier/duplicate/enum/delivery all pass.

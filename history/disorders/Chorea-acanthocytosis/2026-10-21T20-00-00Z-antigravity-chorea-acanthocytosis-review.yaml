  summary: Reviewed Chorea-acanthocytosis, added literature-backed evidence to classifications, annotated VPS13A Loss of Function and Chorein Deficiency with molecular_functions and functional evidence, refined treatment metadata and GPi-DBS target_mechanisms links, and added Huntington Disease to differential_diagnoses.
  details: >-
    1. Added literature-backed evidence (PMID:41030128 and PMID:19497603) to both
    classifications harrisons_chapter entries (NEUROLOGIC and
    GENETICS_ENVIRONMENT_DISEASE). 2. Added molecular_functions (GO:0120013 lipid
    transfer activity, DECREASED) and in vitro functional evidence (PMID:41552990)
    to the root node VPS13A Loss of Function and Chorein Deficiency. 3. Added
    therapeutic_modality: SMALL_MOLECULE to Off-label dasatinib Src/Lyn kinase
    inhibition, and added target_mechanisms links with PMID:35880382 meta-analysis
    evidence from Globus pallidus internus deep brain stimulation to Dystonia and
    Chorea. 4. Added a differential_diagnoses entry for Huntington Disease
    (MONDO:0007739) supported by PMID:17122731.

  summary: 'Genetics pass: collagen IV genes bound on three subtype rows and the network
    node, with case fractions'
  details: |
    Genetics pass for issue #12190 (d2g wiring-001), part of epic #12189.

    Research first. The Alport Syndrome GeneReviews chapter (PMID:20301386) is the baseline
    and states the gene-to-inheritance-class assignment directly: COL4A5-related disease is
    X-linked, and COL4A3- and COL4A4-related disease is autosomal dominant or autosomal
    recessive. ClinGen grades COL4A3 and COL4A4 semidominant for Alport syndrome, which the
    entry already cited. The existing digenic modelling and the digenic and AS-DL subtype
    rows were left untouched.

    What changed. The X-linked, autosomal recessive and autosomal dominant has_subtypes rows
    previously carried no genes and no evidence at all. Each now carries its genes - COL4A5
    on the X-linked row, COL4A3 and COL4A4 on both autosomal rows - and the GeneReviews
    sentence above as evidence. The three genetic records gained relationship_type CAUSATIVE
    and variant_origin GERMLINE, and each gained a case_fractions record from PMID:29854973
    (78% COL4A5, 11% COL4A3, 7% COL4A4 of 73 patients), annotated with the caveat that the
    cohort was ascertained after kidney transplantation and so describes patients who had
    already reached kidney failure. Three unsourced distribution figures in the subtype
    descriptions (approximately 80%, 15% and 5% of cases) were replaced by qualitative
    wording plus a pointer to those sourced case_fractions. COL4A3, COL4A4 and COL4A5 are now
    bound on the Defective Type IV Collagen Network node, which had no gene bound; before
    this pass no node in the entry did.

    Disagreement with MONDO, verified independently. MONDO's structured causal-gene axioms
    for the autosomal Alport terms are narrower than the terms' own text definitions. Checked
    directly through the OLS has_material_basis_in_germline_mutation_in (RO:0004003) link:
    MONDO:0008762 asserts COL4A4 alone while its definition reads "mutations in both copies
    of the COL4A3 or COL4A4 genes"; MONDO:0007086 asserts COL4A3 alone while its definition
    reads "one mutation in either the COL4A3 or COL4A4 gene in each cell". The reason is that
    both terms are equivalent to OMIM's gene-specific entities rather than to the inheritance
    classes their labels name - MONDO:0008762 is equivalent to OMIM:203780 and carries the
    synonym "Alport syndrome 2, autosomal recessive"; MONDO:0007086 is equivalent to
    OMIM:104200 with the synonym "Alport syndrome 3, autosomal dominant". The axioms are
    therefore right about OMIM and the definitions are right about clinical practice, and
    they describe different things. This entry follows GeneReviews and binds both genes on
    both rows, recording the divergence on each row and in the MONDO:0957811 mapping
    justification. The entry's existing note predicting this for MONDO:0008762 was extended
    to cover MONDO:0007086, which has the same shape.

    Validation: just validate, validate-terms, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches
    and validate-disorders all pass.

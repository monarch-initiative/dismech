  summary: Add differential diagnoses
  details: |
    Added a differential_diagnoses block with four entries: focal segmental glomerulosclerosis (MONDO:0100313), IgA nephropathy (MONDO:0005342), thin basement membrane nephropathy (MONDO:0957317, hematuria, benign familial; found by an OLS search for "benign familial hematuria"), and anti-GBM disease (MONDO:0009303). Most evidence quotes the 2025 pathology review PMID:39384359 (cached full text): COL4A3-5 variants in familial FSGS and in IgA nephropathy with a thin GBM, absence of specific immune deposits in Alport biopsies, the TBMD ultrastructural criterion and thickness thresholds, and normal alpha5 staining in autosomal dominant disease. Anti-GBM disease cites PMID:30404116 for linear GBM deposition and PMID:28515156 for de novo anti-GBM disease after transplantation for Alport syndrome; IgA deposition also cites ORPHA:34145. Distinguishing features without a quotable source in the cache (episodic macroscopic hematuria in IgA nephropathy, benign course and absent extrarenal findings in TBMD) were left out. MYH9-related disease was not added because no cached source covers it. Schema, term, snippet (108/108), entity-ref, enum, duplicate-key, snippet-length, title-snippet, snippet-grading, reference-title and folded-hyphen checks pass.

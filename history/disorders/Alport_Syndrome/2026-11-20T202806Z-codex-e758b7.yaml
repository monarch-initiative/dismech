  summary: Map Alport Syndrome to OMIMPS:301050
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. The January 2026 series enumerates X-linked Alport syndrome 1, COL4A4-related recessive type 2, COL4A3-related dominant type 3a, and COL4A3-related recessive type 3b. All four fall within this Disease, whose scope additionally includes digenic Alport syndrome, diffuse leiomyomatosis-Alport syndrome, and COL4A4-related dominant disease under its inheritance-class subtypes. The enumerated series is therefore a narrower target than the entry as curated. The shared collagen IV basement-membrane disorder supports retaining the disease umbrella, while inheritance and gene-specific distinctions remain internal. MONDO:0018965 has an OMIMPS crosswalk, but that alone does not establish equality with these broader subtype boundaries.
    Repaired a pre-existing reference-validation failure in DOI:10.1002/hsr2.70595 by removing the concatenated abstract heading from its finding and supporting quote. The retained sentence is verbatim in the generated reference cache.

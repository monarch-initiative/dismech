  summary: Add MYH9-related disease differential
  details: |
    Added MYH9-related disease (MONDO:0015912) to differential_diagnoses. PMID:19726116 (review, newly cached) states that the hearing loss and cataract of MYH9-related disorders make Alport syndrome the key differential, and names the blood-smear findings that separate them (thrombocytopenia, giant platelets, leukocyte inclusions). GeneReviews PMID:20301740 supports neutrophil MYH9 aggregates. PMID:40372468 (newly cached), a nationwide Japanese series of nine biopsies, found Alport-like GBM thinning, thickening and splitting in five but no basket-weave appearance; the explanation records the small, likely severe sample. Also took the optional review suggestion on the PR: the COL4A5-COL4A6 Contiguous Deletion node now has a second downstream edge to Defective Type IV Collagen Network, citing the PMID:28275241 sentence that defines AS-DL as a variant of X-linked Alport syndrome with renal symptoms, so the subtype joins the main renal, ear and eye chain. Two other candidates fetched during the search (PMID:21071975, PMID:29987460) were not cited and their caches were removed. Schema, term, snippet (112/112), duplicate-key, snippet-length, title-snippet, snippet-grading, reference-title and folded-hyphen checks pass.

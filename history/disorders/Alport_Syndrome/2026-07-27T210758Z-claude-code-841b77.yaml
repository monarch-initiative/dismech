  details: |
    Addressed claim-evidence review issue #6952. (1) GBM Lamellation and Focal Segmental Glomerulosclerosis were human phenotypes supported ONLY by a Col4a5 mouse study (PMID:34029143, MODEL_ORGANISM); added a human renal-pathology reference (PMID:39384359) documenting basket-weave GBM lamellation and secondary segmental/global glomerulosclerosis on human biopsy, alongside the retained mouse evidence. (2) progression record 1 cited a generic disease-definition snippet whose explanation described the paper title, not onset; replaced with GeneReviews (PMID:20301386) natural-history sequence establishing microhematuria as the first kidney manifestation in most XLAS males. (3) Microscopic Hematuria was supported by an over-read screening-programme snippet; replaced with the GeneReviews natural-history quote and tightened the description to what is evidenced. Full curation additions: new diagnosis section (molecular genetic testing + kidney biopsy/EM, GeneReviews + pathology review); new discussions section with two KNOWLEDGE_GAP entries (progression predictors in XLAS females/ADAS; optimal RAAS-blockade initiation timing), each with proposed experiments; GeneReviews tagged in top-level references. Validated: schema, term validation, folded-hyphen, reference validator (title fixed); all new snippets exact substrings.

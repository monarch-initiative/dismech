  summary: 'Review: replace digenic snippet with the paper''s conclusion (ECM review)'
  details: |
    Claim-evidence correctness review of ECM disorders. Fixed: the Digenic inheritance block quoted PMID:25575550's BACKGROUND hypothesis sentence ('Therefore, we explored the possibility that Alport syndrome is under digenic control') while its explanation claimed the study 'explicitly establishes' digenic inheritance - exploring a possibility does not establish it. Replaced with the METHODS and CONCLUSIONS sentences from the same cached abstract ('we identified 11 patients who had pathogenic mutations in two collagen IV genes ... This pedigree analysis provides evidence for digenic inheritance of Alport syndrome') and rewrote the explanation to describe the segregation analysis across 56 individuals. This mattered because CLAUDE.md names Alport_Syndrome as a worked digenic/oligogenic exemplar. The inheritance_term binding (HP:0010984) was already correct. Deferred to issue #6952: GBM Lamellation and Focal Segmental Glomerulosclerosis are human phenotype claims whose only evidence is PMID:34029143, a Col4a5 mouse study, contravening the rule that model organism evidence should not be the sole support for human phenotypes - a citation gap rather than a factual error, since both are well documented in human biopsy series; progression record 1 has an explanation describing the cited paper's title rather than its quoted text; and Microscopic Hematuria's 'earliest and most consistent finding' claim rests on a screening-programme recommendation. Validated with linkml-validate and an offline snippet-vs-cache substring check.

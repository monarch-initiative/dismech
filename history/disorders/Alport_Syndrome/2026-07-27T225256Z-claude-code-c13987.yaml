  details: |
    Third round of non-blocking PR #7061 suggestions. (1) Extended the ADAS counseling snippet to include its governing conditional (if a parent carries the COL4A3/COL4A4 variant). (2) Split the bundled Protective Measures supportive-care node into three organ-system entries (Adequate Hydration/renal, Corneal Trauma Protection/ocular, Loud-Noise Avoidance/auditory) so ocular/auditory recommendations are queryable alongside the hearing-aid and cataract treatments. (3) Made PGT availability non-X-linked-specific by adding it to the ARAS and ADAS inheritance blocks (GeneReviews states it generically). (4) Added a Diffuse Leiomyomatosis phenotype (HP:0006756) as the extrarenal counterpart of the COL4A5-COL4A6 leiomyoma-surgery treatment. (5) Standardized reference_title drift for PMID:20301386 to the cached 'Alport Syndrome.' (6 inline occurrences). Note: no MAXO immunohistochemistry term exists (OAK-checked), so the alpha-5(IV) immunostaining diagnosis stays bound to biopsy of skin. Validated: schema, term validation (HP:0006756 seeded), folded-hyphen; all new snippets exact substrings.

  summary: Bind digenic, ATS3B, and AS-DL MONDO concepts (#10796)
  details: |
    Added a fourth has_subtypes entry (Digenic, MONDO:0958104) with evidence from Savige 2022 (PMID:35675912, heterotrimer-dose and cis/trans transmission) and Inoki 2024 (PMID:39137047, cohort ESKD-age comparison and prevalence), leaving the existing disease-level Digenic inheritance (HP:0010984) block untouched since it records a different claim (mode of transmission, not named MONDO entity). Added a fifth has_subtypes entry (AS-DL, MONDO:0010641) citing the primary COL4A5-COL4A6 contiguous-deletion characterization paper (PMID:28275241), giving the entry's existing Diffuse Leiomyomatosis phenotype and Leiomyoma Surgery treatment a named subtype anchor; noted in the description that MONDO does not nest AS-DL under Alport syndrome. Bound MONDO:0957811 (Alport syndrome 3b, autosomal recessive / ATS3B) as a disease-level mappings.mondo_mappings skos:narrowMatch rather than a has_subtypes entry, because MONDO's causal_gene data now splits the old AR concept into a COL4A4-specific MONDO:0008762 (already bound to this entry's Autosomal Recessive subtype) and a COL4A3-specific MONDO:0957811 sibling, while this entry's Autosomal Recessive subtype still curates both genes together; recorded the split as a follow-up lead in the mapping_justification rather than restructuring the already-merged AR subtype in this PR. Deleted both folded stubs (Alport_Syndrome_3b_Autosomal_Recessive.yaml, X-linked_Diffuse_leiomyomatosis-Alport_Syndrome.yaml); MONDO:0958104 had no stub to delete. All three MONDO labels and parent relationships verified live against OLS4 before binding.

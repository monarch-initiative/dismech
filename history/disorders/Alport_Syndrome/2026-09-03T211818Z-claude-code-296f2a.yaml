  summary: Bind MONDO subtype_term to all three Alport has_subtypes entries
  details: |
    Claim #10788 (X-linked Alport syndrome, MONDO:0010520). The umbrella entry already carried X-linked, Autosomal Recessive and Autosomal Dominant in has_subtypes, but none of the three had a subtype_term, so MONDO:0010520 was bound nowhere in kb/ and tidy-stubs saw no coverage.

    Bound all three, each resolved and label-checked through the EBI OLS4 MONDO API before writing (obo_id lookup; is_obsolete False; label copied from the API response, not from memory):
      X-linked            -> MONDO:0010520 X-linked Alport syndrome (OMIM:301050, Orphanet:88917)
      Autosomal Recessive -> MONDO:0008762 autosomal recessive Alport syndrome (OMIM:203780, Orphanet:88919)
      Autosomal Dominant  -> MONDO:0007086 autosomal dominant Alport syndrome (OMIM:104200, Orphanet:88918)

    All three mapped 1:1, so none needed the top-level mappings/skos:narrowMatch treatment that #10780 used for the C8 chain split.

    No other content changed. In particular the Digenic inheritance block (HP:0010984) that CLAUDE.md cites as a worked digenic exemplar was left untouched. MONDO:0958104 (digenic Alport syndrome) exists but has no corresponding has_subtypes entry here; adding one would be a content change beyond this claim and is noted as a follow-up rather than made.

    Retires three stubs: X-linked_Alport_Syndrome (the claim), plus the previously unclaimed Autosomal_Recessive_Alport_Syndrome and Autosomal_Dominant_Alport_Syndrome, which the same binding covers. Neither collateral stub had an open claim issue.

  summary: 'Create: PGM1-CDG'
  details: |
    Created kb/disorders/PGM1-Congenital_Disorder_of_Glycosylation.yaml (MONDO:0013968, OMIM 614921, PGM1/hgnc:8905). NEC preflight was run against the MONDO record before any deep-research content was used: gene PGM1 (RO:0004003 HGNC:8905), the OMIM:614921 xref, and synonyms CDG-It/CDG1T/GSD type 14 all matched, confirming GSD XIV is the same entity and ruling out confusion with PGM3-CDG, PMM2-CDG and MPI-CDG. Duplicate preflight found no existing KB entry, PR or issue other than #7709. Deep research: Edison/falcon, 492s, 26 citations. Its output was treated as leads only; every PMID was fetched with just fetch-reference and every snippet verified as an exact substring of the cached text. GeneReviews baseline: no dedicated PGM1-CDG chapter exists. The only GeneReviews record is the RETIRED multi-gene overview PMID:20301507, tagged in the top-level references block, and its lack of PGM1-specific content is documented in notes; the 2021 international consensus guideline PMID:32681750 and the landmark NEJM cohort PMID:24499211 were used as the equivalent phenotype baseline. The mixed type I plus type II glycosylation defect is modelled as two parallel arms, UDP-glucose/ER lipid-linked oligosaccharide assembly and UDP-galactose/Golgi galactosylation, each conforming to the matching trigger node of the congenital_disorder_of_glycosylation module and converging on the shared Protein Hypoglycosylation hub. The oral D-galactose treatment arm is curated with its Leloir-pathway mechanism, target_mechanisms links to both nucleotide-sugar nodes, and explicit evidence that it does NOT correct the cardiomyopathy. The galactose-resistant cardiac phenotype is modelled as a mechanistic_hypotheses group with two competing arms, cardiomyocyte energetic/mitochondrial failure versus sarcolemmal laminin-211 hypoglycosylation, wired via downstream hypothesis_groups, plus a HUMAN_MODEL_MISMATCH discussion on the AAV9-PGM1 mouse rescue and a KNOWLEDGE_GAP discussion on the unexplained craniofacial malformation. Multisystem and Myopathic subtypes were added so hepatic phenotypes are not asserted disease-wide. A red-team review pass was run before opening the PR and its CRITICAL and IMPORTANT findings were addressed. Validation: just validate passes with schema, terms and 90/90 snippets verified; pytest tests/test_data.py -k PGM1 passes 9/9; compliance 87.5 percent.

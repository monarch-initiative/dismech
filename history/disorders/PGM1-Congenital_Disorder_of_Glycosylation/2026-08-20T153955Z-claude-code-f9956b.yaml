  summary: Add the glycosylation-independent Z-disk cardiomyopathy arm
  details: |
    Galactose corrects glycosylation in PGM1-CDG but not the cardiomyopathy, and the entry already carried a galactose_resistant_cardiomyopathy hypothesis with two arms. PMID:41723528 adds a third and, importantly, the first evidenced in human patient cardiomyocytes rather than mouse heart or skeletal-muscle surrogates.

    New node Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction: patient iPSC-cardiomyocyte proteomics shows depletion of Z-disk components including LDB3, and an AlphaFold3-predicted direct PGM1-LDB3 interaction was confirmed in vitro. This makes PGM1 a structural binding partner as well as a metabolic enzyme, and no amount of nucleotide-sugar repletion addresses a protein-protein interaction - which is why it is a separate arm rather than a restatement of arm (a). Its edge to the mitochondrial node is PARTIAL and INDIRECT_UNKNOWN_INTERMEDIATES, because the authors state the Z-disk-to-mitochondrion link as a suggestion from correlated proteomics and respirometry, not as a demonstrated sequence.

    The hypothesis description was extended to name arm (c) and to record that it is a candidate cause of arm (a) rather than a competitor, and two new evidence items added - the glycosylation-independence premise and the human-cardiomyocyte respiration result.

    New experimental_models entry for the patient iPSC-cardiomyocyte line, with two modeled_mechanisms links and three readouts. Limitations record what matters: iPSC-cardiomyocytes are immature with fetal-like sarcomeres and glycolytic metabolism, which are precisely the properties being measured, and no galactose-rescue arm was run so the model does not itself test the treatment-resistance claim.

    Notes record the dataset search: no relevant public dataset exists (yeast/Candida PGM1 gene-symbol collisions only; direct GEO searches for PGM1-CDG and PGM1 deficiency return zero series), so datasets stays empty rather than being filled with a Named Entity Confusion hit.

    Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets 129/129.

  summary: Refresh ISDS provenance to 2023 revision; add Harrison's Part
  details: |
    Reviewed the existing chondrodysplasia_punctata assignment as part of a sweep over ISDS group 23. Updated notes from 2019 to 2023-revision provenance with row NOS 23-0110 and its MIM number, and recorded that this is the one group-23 row whose gene and inheritance columns are both blank - the nosology's way of accepting the entity on clinical and radiographic grounds with no molecular cause established. Added harrisons_chapter GENETICS_ENVIRONMENT_DISEASE, with a note explaining why no metabolic Part is added here even though the other group members take one: this entity has no demonstrated biochemical lesion. No ICIMD assignment for the same reason. No content outside the classifications block was changed.

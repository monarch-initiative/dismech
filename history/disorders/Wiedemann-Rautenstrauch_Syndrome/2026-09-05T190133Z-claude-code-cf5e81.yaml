  summary: 'Create: Wiedemann-Rautenstrauch Syndrome'
  details: |
    Created the Wiedemann-Rautenstrauch syndrome (MONDO:0009910, POLR3A) entry de novo from a Perplexity sonar-deep-research report used as a lead source plus targeted PubMed searches. Curated 10 pathophysiology nodes as a causal chain from biallelic POLR3A variants with residual function, through aberrant transcript processing and reduced wild-type POLR3A, to Pol III transcriptional hypofunction and then in parallel to nucleolar stress/p53 senescence, impaired mesenchymal progenitor differentiation, lipoatrophy, skeletal/craniofacial dysmorphogenesis, growth failure and CNS hypomyelination; 46 phenotypes with HP terms; 3 genetic entries (POLR3A causative, POLR3GL and POLR3B recorded as unreplicated candidate loci); 3 mechanistic hypotheses including the allele-combination model that separates WRS from 4H leukodystrophy, with a REFUTE item for the homozygous-missense counterexample; 5 experimental models and 2 Polr3a mouse models including a FAILS_TO_RECAPITULATE link; 3 knowledge-gap/human-model-mismatch discussions. Validation: just validate passed (schema, terms, references); just validate-disorders passed with Snippets checked 200/200 verified against cached references; entity-ref, causal-target, enum-value, duplicate-key and qualifier-term (offline and online) gates all clean; compliance 91.2 percent global. No GeneReviews chapter exists for WRS, so the POLR3-Related Leukodystrophy chapter PMID:22855961 is cited only for its single sentence about WRS and is not tagged as a baseline. Report citations not used: PMID:1026530 was a mis-parsed DOI fragment resolving to a 1976 disopyramide pharmacokinetics paper, and the report's DOI-keyed Frontiers citation was replaced by that paper's PMID 36385762 so the gating validator checks the quote. The report's suggested terms HP:0008106 and HP:0001077 do not exist, GO:0006379 is obsolete, and GO:0009306, UBERON:0002371, UBERON:0008897 and three NCIT codes name unrelated concepts; every CURIE was re-derived with OAK. ORPHA:3455 has no fetcher so Orphanet prevalence and frequency annotations were not cited.

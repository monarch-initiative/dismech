  summary: 'Review round 1: add progression and clinical_burden; correct a false notes
    rationale'
  details: |
    Addresses the CHANGES_REQUESTED review on PR #11157. BLOCKING item: progression and clinical_burden had been omitted on a rationale that this PR's own cache disproves. references_cache/PMID_28447407.md is a full-text cache and states 'Four patients have died within the 1st weeks of life, 2 other in the 1st year, 4 between 5 and 10 years of age, 1 at 17 years, but 2 are still alive at age 20 years' and 'These symptoms arise typically in late infancy or childhood'; references_cache/PMID_36159344.md states the average survival of seven months and names malnutrition as a cause of death. Added a three-phase progression block (neonatal period and infancy; late infancy and childhood; adolescence and adulthood) and a clinical_burden block at HIGH, both backed by those exact cached sentences. Note that when the entry was first curated PMID_28447407.md was cached abstract_only; it is now full_text_pdf, which is what made the omission indefensible on re-check. SUGGESTION taken: assigned frequency bands from the same paper's prose summary to Pointed chin and Narrow mouth (VERY_FREQUENT, 'almost all patients'), Prominent scalp veins and Hypodontia (FREQUENT, conservative mapping of 'shared very often'), and upgraded Natal teeth from FREQUENT to VERY_FREQUENT while keeping the older weaker-worded case report as association-only evidence with the conflict stated. Added two quote-backed phenotypes the same sentences supply, Wide cranial sutures (HP:0010537) and Thin upper lip vermilion (HP:0000219), and wired both into the craniofacial pathophysiology node. Declined to add a phenotype for 'lower eyelid covering part of the cornea' because no HPO term fits it. NOTES CORRECTED: deleted the false clause 'no WRS cohort reports per-feature percentages' outright, since Table 2 of PMID:28447407 does report per-feature counts for the WRS column; replaced it with an accurate account of what the table contains, why bands are taken from the paper's prose rather than the table cells (the extracted PDF text interleaves the WRS column with three comparison cohorts on one line), and what the caches genuinely do not contain (no survival analysis, life table, cause-of-death series or genotype-specific prognosis). Validation after the round: just validate passed; 217/217 snippets verified; entity-ref, causal-target, enum-value, duplicate-key, qualifier-term, folded-hyphen, title-snippet, snippet-grading and reference-title gates all clean. A stray full_text_attempted rewrite of references_cache/PMID_22855961.md by just validate was reverted and is not part of this commit.

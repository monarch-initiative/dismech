  summary: 'Create: Spondyloenchondrodysplasia'
  details: |
    Opens ISDS Nosology group 12 (Spondylometaphyseal dysplasias) with row NOS 12-0010. Models the disease as a type I interferonopathy rather than a skeletal dysplasia with extras: ACP5 loss branches into an interferon arm driving autoimmunity and intracranial calcification, and a bone-resorption arm producing the enchondroma-like chondroid persistence. The osteopontin-TLR9 route between them is recorded as an EMERGING mechanistic_hypotheses group rather than as settled pathophysiology, following the 2025 review's own statement that the immunopathology remains unclear. 43 evidence snippets verified against the local reference cache; schema, term, duplicate-key and entity-reference checks pass.

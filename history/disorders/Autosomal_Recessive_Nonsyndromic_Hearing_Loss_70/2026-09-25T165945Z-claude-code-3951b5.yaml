  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 70 (DFNB70, PNPT1)'
  details: |
    De novo creation of the DFNB70 entry (MONDO:0013978), claimed in issue #12799.

    Lump/split decision. PNPT1 carries three inherited phenotypes on different
    allele classes: DFNB70 (OMIM 614934), combined oxidative phosphorylation
    defect type 13 (OMIM 614932, MONDO:0013977), and the dominant spinocerebellar
    ataxia type 25. A search of kb/ for PNPT1 and hgnc:23166 before writing found
    COXPD13 already curated, and its own notes and differential_diagnoses record
    that DFNB70 is deliberately kept out of it and curated separately. DFNB70 is
    therefore curated as a standalone Disease, which also matches this KB's
    one-entry-per-locus practice for the DFNB/DFNA series. The stub's entry_type
    was set to DISEASE in a first commit and the stub deleted in the curation
    commit. The soft boundary between DFNB70 and COXPD13 is recorded as an open
    discussion, a progression phase and a differential rather than resolved by
    merging.

    Evidence. Five PubMed references, all fetched with just fetch-reference:
    PMID:23084290 (founding Moroccan family, abstract_only), PMID:34194829
    (Tunisian family, full_text_xml), PMID:34374074 (South Indian family,
    abstract_only), PMID:30244537 (adult siblings, abstract_only) and
    PMID:41255389 (2025 comparative functional study, full_text_xml), plus
    PMID:35411967 for the SCA25 differential (abstract_only). Every cited cache
    is abstract_only or full_text_xml, so none is exposed to the stale
    full_text_html refusal described in issue #12672. A seventh reference,
    PMID:30024931, carries the mouse model (see below), and PMID:20301607 is
    listed untouched so the GeneReviews baseline check reads TAGGED rather than
    CITED_UNTAGGED. 35 of 35 snippets verified.

    Second-opinion comment on issue #12799, addressed. The automated comment
    confirmed the split call independently and pointed at a mammalian model the
    first pass of this entry had missed: PMID:30024931 reports a PNPase knockout
    restricted to mouse inner ear hair cells with progressive hearing loss, and
    the COXPD13 entry that already curates it notes that the relevant human
    comparator for that arm is DFNB70 rather than COXPD13. An animal_models block
    was added here, the cochlear node regraded from HYPOTHETICAL to PROVISIONAL,
    and the HUMAN_MODEL_MISMATCH discussion rewritten - its first version
    asserted that no conditional inner-ear Pnpt1 deletion existed, which was
    false. The comment's other two points were also acted on: no has_subtypes
    entry was added under MYO6_Hearing_Loss (the over-broad-anchor artifact of
    issue #12184), and PMID:40757543 was not cited, being a heterozygous
    SCA25-shaped case rather than DFNB70. The founding allele was re-verified
    against PMID:23084290's own abstract rather than copied from COXPD13's prose:
    the abstract gives c.1424A>G p.(Glu475Gly), which agrees.

    references_cache hygiene under issue #12672. just validate truncated
    references_cache/PMID_30024931.md from full_text_pdf (84 KB) to full_text_xml
    twice during this session; it was restored with git checkout both times, and
    PMID_20301607.md was restored likewise. Neither is modified in the commit.

    Negative searches run for this entry, re-run immediately before committing.
    ClinGen: the Gene-Disease Validity download from
    search.clinicalgenome.org/kb/gene-validity/download, retrieved 2026-09-25,
    contains exactly one PNPT1 row - PNPT1, HGNC:23166, Leigh syndrome,
    MONDO:0009723, AR, SOP7, Moderate, Mitochondrial Diseases Gene Curation
    Expert Panel - so there is no published CGGV assertion for the hearing
    phenotype and none is cited; the Limited grading is cited from the Tunisian
    paper that reports it. GeneReviews: the committed Bookshelf index contains no
    PNPT1 or DFNB70 chapter; the adjacent Genetic Hearing Loss Overview (NBK1434,
    PMID:20301607) was fetched, returned 472 characters with no PNPT1 mention,
    and its cache file was restored to its committed state rather than kept.
    PubMed: esearch for "PNPT1 AND (deafness OR hearing)" returns 12 records, all
    of which were triaged; PMID:39924761 (heterozygous PNPT1 sensory ataxic
    neuropathy) was fetched, judged to belong to the dominant SCA25 axis rather
    than to DFNB70, not cited, and its cache file deleted.

    Ontology bindings. Every CURIE was resolved against the OLS REST API in the
    same step it was written; no local ontology SQLite build was downloaded, per
    the disk constraint on this run. This matters here: the deep-research report
    offered CL:0002510 for "spiral ganglion neuron", which is actually a lymph
    node dendritic cell, and its own Term Validation section flagged that plus an
    unresolved HP:0002520 and an obsolete GO:0140373. No CURIE was taken from the
    report.

    Deep research. falcon was requested and returned HTTP 402 (out of credits);
    the claude_code fallback produced the report, which is committed as
    research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_70-deep-research-claude_code.md
    with its citations sidecar. just preflight-dr returned PASS (PNPT1 mentioned
    53 times, OMIM 614934 matched). Its reference validation resolved 10 of 10
    citations with no confabulation. The report corroborated the entry's
    independently derived content and added no primary source the entry does not
    already cite; its three DR-fetched cache files
    (DOI_10.1002_ajmg.a.40516.md, DOI_10.1002_ana.26366.md, PMID_42375813.md)
    are committed because the report's citation validation resolves against them.

    Validation run on the final tree: just validate, count-verified-snippets
    (32/32), validate-terms, check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-coarse-phenotypes,
    check-qualifier-terms, check-reference-titles, check-genereviews,
    list-gene-term-mismatches, check-case-collisions, validate-history, pytest
    tests/test_data.py -k, and validate-disorders under a linkml-reference-validator
    0.3.0rc1 environment built from this worktree.

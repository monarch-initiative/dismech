  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing exome/panel-sequencing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound: severity is reported inconsistently across the four published DFNB70 families (profound in the South Indian family, severe congenital in the adult siblings, severe in the Moroccan kindred), and no per-individual threshold data or audiogram configuration is published for any family, as the phenotype section's own notes already state.

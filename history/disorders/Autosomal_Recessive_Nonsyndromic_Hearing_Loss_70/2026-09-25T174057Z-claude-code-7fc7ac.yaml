  summary: 'Review round 1 on PR #12820: stale prose, GO bindings, evidence grading'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #12820. All
    four blocking items and both suggestions were taken, in one push.

    Item 1, prose written before the mouse model was added. The description
    still said "no cochlea-restricted animal model exists" and the notes still
    described grades (PROBABLE, HYPOTHETICAL) that no node in the entry carries.
    Both were rewritten to match the entry as it now stands: ESTABLISHED for the
    allele and trimer nodes, PROVISIONAL for import, degradation and the
    cochlear node, with the reason for each.

    Item 2, two GO bindings broader than an exactly matching term. The
    RNA-degradation node moved from GO:0000963 mitochondrial RNA processing to
    GO:0000957 mitochondrial RNA catabolic process, and from GO:0004532 RNA
    exonuclease activity to GO:0000175 3'-5'-RNA exonuclease activity. Both new
    labels were read from OLS in the step they were written and both terms were
    already in cache/go/terms.csv and the relevant enum caches, so the cache
    diff shrank rather than grew: the now-orphaned GO:0000963 and GO:0004532
    rows this branch had added were removed after confirming no kb/ file still
    binds either, leaving only GO:0070207 and MONDO:0013978 as new rows.

    Item 3, animal-model evidence. The "we established PNPase knockout (PKO)
    systems" snippet describes cultured mouse embryonic fibroblasts, so it is
    regraded MODEL_ORGANISM to IN_VITRO. Its explanation had ended "which is why
    no constitutive knockout mouse exists", which the cited paper contradicts. A
    constitutive knockout exists and is embryonic lethal, so the false clause was
    removed and a second evidence item added quoting the paper directly:
    "Constitutive PNPase knockout (PKO) in mice is lethal at embryonic day 8",
    MODEL_ORGANISM with quote_role BACKGROUND, since the paper is citing earlier
    mouse work there.

    That sentence is absent from the committed full_text_pdf extraction of
    references_cache/PMID_30024931.md and present in the full_text_xml one that
    linkml-reference-validator 0.3.0rc1 produces, so the cache file is updated to
    the XML extraction in this push. This is a change of extractor, not a
    truncation to abstract: the XML body carries the full text, and
    Combined_Oxidative_Phosphorylation_Defect_Type_13, the other entry citing this
    reference, verifies 97 of 97 snippets against it. It also ends the churn in
    which every just validate run rewrote the committed file.

    Item 4, three quote_role BACKGROUND items graded by the citing paper rather
    than by the quoted sentence. PMID:41255389's "heterozygous parents ... were
    asymptomatic" and "Several missense PNPT1 mutations cause genetic diseases"
    are both clinical statements and move from IN_VITRO to HUMAN_CLINICAL;
    PMID:23084290's "A subset of nuclear-encoded RNAs has to be imported" is
    established cell biology drawn from many study types and moves from
    HUMAN_CLINICAL to OTHER. quote_role BACKGROUND is retained on all three and
    each explanation now says what the grade applies to.

    Both suggestions taken as well. The Vestibular Dysfunction phenotype now
    records that its incoming edge comes from a node named for the cochlea, that
    vestibular hair cells are not cochlear, that no work places PNPase in the
    utricle, saccule or crista, and that the mouse knockout was not assessed for
    balance. Unilateral Progressive Vision Loss is left with no incoming edge, as
    the reviewer noted is acceptable, because no mechanism evidence exists for it.

    Validation re-run on the post-review tree: just validate, 36 of 36 snippets
    verified, validate-terms, check-snippet-grading, check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-coarse-phenotypes, check-qualifier-terms, check-reference-titles,
    check-genereviews (TAGGED), check-case-collisions, check-term-cache-integrity,
    check-cache-order, list-gene-term-mismatches (0 naming a different gene),
    validate-history, pytest tests/test_data.py -k (129 passed), and
    validate-disorders under linkml-reference-validator 0.3.0rc1 (36 snippets, 44
    titles, 0 issues).

  summary: 'Review round 1: DFNB108 (ROR1) reviewer response'
  details: |
    Addressed the ai4c-reviewer REQUEST_CHANGES review on PR #11130 (two blocking
    content-completeness gaps plus the worthwhile suggestions) in one bundled push.

    Blocking findings:
    1. Deepened the genetic: section. Added variant_origin: GERMLINE and an
       association: narrative on the ROR1 entry, a genetic_context block
       (variant_origin GERMLINE, zygosity HOMOZYGOUS, functional_impact_category
       LOSS_OF_FUNCTION) on the "Biallelic ROR1 Loss of Function" pathophysiology
       node, and a variants[] sub-entry carrying the full variant identity
       (NM_005012.4:c.2207G>C p.R736T, ClinVar VCV000437889/RCV000504579.2,
       chr1p31.3, absent from ExAC/EVS/1000G and 330 control chromosomes) with
       the WES identification quote as evidence.
    2. Added a Speech and Language Therapy treatment bound to NCIT:C159273
       (Speech Language Therapy), therapeutic_modality BEHAVIORAL, with an
       INDIRECT ANSD-management evidence quote.

    Suggestions taken:
    - onset_category: CONGENITAL on the sensorineural-hearing-impairment phenotype.
    - differential_diagnoses: OTOF/DFNB9, PJVK/DFNB59, SLC26A4/Pendred, CHARGE.
    - Animal model: re-graded both existing modeled_mechanisms links HIGH -> MODERATE,
      added a third link (mouse -> Cochlear Common Cavity Malformation,
      PARTIALLY_RECAPITULATES) and typed PROXY_QUANTITY divergences on all three
      (constitutive null vs the R736T partial-trafficking allele; shortened cochlea
      vs the human common cavity), plus a HUMAN_MODEL_MISMATCH discussions node
      attaching to the innervation and common-cavity nodes.

    Not taken, with reasons:
    - HP:0000750 (Delayed speech and language development): the only source is the
      OMIM clinical synopsis, which returned HTTP 403 and is not in any cached
      reference, so there is no exact-quote support for the DFNB108-specific claim.
      No phenotype beats an unverifiable one. (Speech-language therapy is still
      modeled as a treatment, above.)
    - Preserved vestibular function as an explicit negative: the human negative is
      OMIM-synopsis-only (403/uncached); only the mouse preserved-vestibular claim
      is quotable, which is model evidence and not adequate sole support for a human
      negative.
    - classifications: none of the Autosomal_Recessive_Nonsyndromic_Hearing_Loss
      sibling entries carries a classifications block, so there is no established
      pattern to copy; a wrong classification is worse than none.

    Validation: just validate-disorders green (schema + terms + 28/28 snippets, up
    from 24). Offline gates pass: entity-refs (new attaches_to), causal-targets,
    duplicate-keys, enum-values, qualifier-terms, cache-order; model-scale-audit
    --strict exit 0; 81 model/divergence/readout pytest cases pass. Merged current
    main earlier in the round to keep whole-KB baselines current.

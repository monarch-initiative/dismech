  details: |
    Added a LOINC-coded auditory brainstem response (ABR, click-evoked) measurement set to the existing Audiologic testing for the auditory neuropathy pattern row, rather than the standard pure-tone audiometry set used elsewhere in this tranche: the row's own claim is specifically about abnormal/absent ABR thresholds with preserved otoacoustic emissions, and no source cited on this entry states that standard pure-tone threshold testing was performed on the human family. The three LOINC codes (panel, left/right click threshold) were verified absent from origin/main and from every other open campaign branch (checked via git log --all -p over cache/loinc/terms.csv), each verified against the Monarch KG before being written, and are committed as three new, additive cache rows. No reference range is bound: no source cited on this entry gives a numeric ABR threshold for the human family, only the qualitative description 'abnormal or absent.'

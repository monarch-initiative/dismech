  summary: 'Create: Hearing Loss Autosomal Recessive 108 (DFNB108, ROR1)'
  details: |
    De novo curation of DFNB108 (MONDO:0033200), autosomal recessive nonsyndromic sensorineural hearing loss from biallelic ROR1 (hgnc:10256) loss of function. Entry type DISEASE. Mechanism curated from the single founder study PMID:27162350 (Diaz-Horta et al, PNAS 2016): homozygous ROR1 c.2207G>C p.R736T mislocalizes the WNT5A co-receptor from the plasma membrane, abolishing WNT5A-ROR1 non-canonical Wnt/NF-kB signaling; the Ror1 mutant mouse shows spiral ganglion neuron fasciculation defects, impaired type I inner-hair-cell synapses and aberrant type II projections plus malformed cochleae, and is severely deaf with preserved otoacoustic emissions (auditory neuropathy). Human family had common cavity inner ear malformation and auditory neuropathy. Human vs mouse evidence kept distinct via evidence_source (HUMAN_CLINICAL / MODEL_ORGANISM / IN_VITRO). Treatments (hearing amplification, cochlear implantation with device qualifier, genetic counseling) evidenced from ANSD management reviews PMID:32290039 and PMID:37638998 (marked directness INDIRECT). Deep research: falcon (Edison) was configured but returned 402 Payment Required (out of credits), so per the fallback policy the report used is the claude_code literature sweep (research/Hearing_Loss_Autosomal_Recessive_108-deep-research-claude_code.md), which confirmed PMID:27162350/OMIM #617654 as the sole primary source. ROR1 kept distinct from ROR2/Robinow. Validated with just validate-disorders (21/21 snippets), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms(-online), check-snippet-length/title/grading, check-folded-hyphens.

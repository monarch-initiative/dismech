  summary: 'Review round 1: D-serine node, myelination split, reference titles'
  details: |
    Review round 1 on PR 17147. The 20 evidence items without a reference_title, mostly Orphanet and ClinGen citations, now carry the title from their reference cache files, which the CI title check requires. The node Brain D-Serine Deficiency and NMDA Receptor Co-agonist Loss is renamed Altered Brain D-Serine Homeostasis. Its D-serine deficit comes from the constitutive Slc1a4 null mouse (PMID:30185558); the knock-in carrying the common p.Glu256Lys allele (PMID:37642681) shows increased brain D-serine uptake and normal hippocampal long-term potentiation, so the node now carries a REFUTE item from that paper and its description says the deficit is shown in the null and not in the knock-in. The NMDA glutamate receptor activity binding (GO:0004972) is removed, since neither paper reports reduced receptor activity. The knockout's link to the node is now fidelity UNKNOWN with the knock-in contrast in its limitations, and the HUMAN_MODEL_MISMATCH discussion l_versus_d_serine_axis now cites the paper's reading of the allele as a gain of function at low D-serine. The node Deficient Myelination and Corpus Callosum Hypoplasia is split into Corpus Callosum Hypoplasia (GO:0022038) and Deficient Myelination (GO:0042552), because the knock-in has a thin corpus callosum with normal myelin basic protein staining. The MBP REFUTE item and the edge to Cerebral hypomyelination moved to the myelination node; the callosal node keeps the edges to the thin corpus callosum, spasticity and hyperreflexia phenotypes, still typed INDIRECT_UNKNOWN_INTERMEDIATES; Brain L-Serine Deficiency now points at both nodes. The GeneReviews chapter Serine Deficiency Disorders (PMID:37347880) is now cited in the PHGDH, PSAT and PSPH differentials. The carrier-frequency note records the figure of up to 6 percent given by PMID:37642681 beside the 0.7 percent, 5 of 450 and 1 in 100 figures in the 2015 reports. The neurodegeneration node lost its brain development binding and is left unbound, with a note: GO:0070997 neuron death is obsolete and the sources do not name apoptosis. The antiseizure treatment names oxcarbazepine (CHEBI:7824) and sodium valproate (CHEBI:9925), the salt the case report names. Brain L-Serine Deficiency and the D-serine node are tagged TISSUE scale, since both deficits are measured in brain. Validated with just validate, validate-terms, count-verified-snippets (107 of 107), check-entity-refs, check-causal-targets and validate-disorders (107 snippets, 114 titles, 0 issues).

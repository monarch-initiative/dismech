  summary: 'Create: ASCT1 Deficiency'
  details: |
    New entry for ASCT1 deficiency (SPATCCM, MONDO:0014725), the autosomal recessive SLC1A4 transport defect, curated from the three 2015 founding reports, the later case reports extending it beyond the Ashkenazi Jewish founder population, the 2024 blood-brain-barrier mouse study, and Orphanet ORPHA:447997 for frequencies. Named ASCT1 Deficiency: the dyad is a MONDO EXACT synonym and recurs in the literature, while the MONDO label's descriptive triad is kept in synonyms. The pathograph runs from transporter loss of function through two parallel supply failures (blood-brain barrier influx, astrocyte-to-neuron shuttle) to a brain L-serine deficit, then to deoxysphingolipid accumulation, impaired cortical growth, the white-matter and callosal findings, and neurodegeneration; a parallel D-serine/NMDA branch is marked PROVISIONAL because the allele-matched knock-in mouse separates the structural from the cognitive phenotype. Three mouse models carry modeled_mechanisms, including the endothelium-restricted knockout that localises the defect to the barrier. The ClinGen Aminoacidopathy GCEP Definitive tier is copied into gene_disease_validity with its CGGV record quoted. L-serine supplementation is recorded as investigational only: it rescues the mouse models but no patient series reports an outcome, and a REFUTE item records that. No GeneReviews chapter covers SLC1A4; the Serine Deficiency Disorders chapter is scoped to the biosynthesis defects, which notes records. The dominant-negative heterozygous SLC1A4 epilepsy syndrome is a separate entity and is cited only in notes. Deep research used the OpenScientist provider after falcon failed to authenticate; its reference validation resolved 14 of 14 citations with no confabulation, its term validation flagged two obsolete GO terms and one mislabelled HP term, none of which were used here, and just preflight-dr returned PASS.

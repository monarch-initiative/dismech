  summary: 'Create: NRROS-Related_Microgliopathy'
  details: |
    Created the entry for SENEBAC (MONDO:0030033, NRROS) from claim #16506, named NRROS-Related Microgliopathy after recurring literature use, with the MONDO label kept as a synonym. Curated from the primary case series (PMIDs 32100099, 32197075, 35099671, 39422130, 40463927, 42806633), the systematic review PMID:35716448 and the Nrros/Lrrc33 knockout mouse papers (PMIDs 28459434, 29909984, 24739962), plus the ClinGen Definitive AR assertion. Built the causal chain NRROS loss, loss of microglial autocrine TGF-beta1 activation, failure of homeostatic microglial identity, then foamy macrophage accumulation, neuronal loss and white matter loss, with calcification recorded as dystrophic. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). Falcon was requested but no Edison key was configured, so the run fell back to openscientist. Validated with just validate (53/53 snippets verified, terms pass) and the per-file structural gates.

  details: |
    Applied a fresh-context review. Removed the unsupported joint hypermobility phenotype: Nava et al. tabulate joint hyperlaxity only for RNU4-2, and the single RNU5B-1 patient in PMID:42502410 Table 2 had none (0/1); the discrepancy with the MONDO/OMIM name is recorded in entry notes. Stopped describing Jackson et al. and Nava et al. as independent, since both draw on Genomics England data. Restored the source's hedging on variant-specific splicing effects, corrected 'blood' to cultured lymphocytes, and replaced general genotype-head-size statements with counts (2 n.39C>G macrocephaly, 3 n.44A>G acquired microcephaly). Rebound acquired microcephaly to HP:0005484 and the loop I process to GO:0000398 (GO:0000350 named a later step than the 5' exon recognition the sources describe). Reclassified two background quotes as evidence_source OTHER, added the n.39C>T gnomAD caveat, Table 2 evidence for macrocephaly and pectus excavatum, GDD frequency FREQUENT (7 of 9 delayed), and the missing references. Not changed: pulmonary and sacrococcygeal anomalies (n=2, unspecified), specific eye-term children, and an NCIT diagnosis term. Re-validated: validate, count-verified-snippets 38/38, validate-disorders 0 issues.

  details: |
    New entry for MONDO:1060179, curated from the stub of the same name (stub deleted). Primary sources: Nava et al. 2025 (PMID:40379786) and Jackson et al. 2025 (PMID:40442284), read in full text; supporting: PMID:40968615 (Chinese WGS reanalysis, n.38C>T), PMID:42502410 (snRNA-extended exome), PMID:39809319 (review of U5 loop 1 and the two 5' splice-site classes). Deep research: falcon was requested but Edison returned 503 'Failed to authenticate' twice, including with --fallback, so the claude_code provider report was used; it passed preflight-dr (RNU5B-1 mentioned 24 times; OMIM 621302 matches the MONDO xref). Its one unmatched quote (PMC12165836, 'is highly likely to have arisen on the maternal allele') was not used. The pathograph runs variant -> perturbed loop I exon alignment -> variant-specific splice-site changes -> abnormal brain development -> phenotypes. The splicing-to-brain edge is tagged as an EMERGING hypothesis because no mis-spliced neurodevelopmental transcript has been identified. A KNOWLEDGE_GAP discussion records which splicing errors cause the phenotype, with a proposed isogenic iPSC-neuron experiment. Joint hypermobility (in the MONDO name and definition) has no quotable RNU5B-1 source and carries no evidence. Validated with just validate, validate-terms, count-verified-snippets (35/35), check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-reference-titles and validate-disorders (0 issues).

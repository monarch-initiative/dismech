  summary: 'Create: Distal Myopathy, Tateyama Type'
  details: |
    New entry for distal myopathy, Tateyama type (MONDO:0013686, OMIM:614321, ORPHA:488650), caused by heterozygous CAV3 variants. First pass from PubMed (Tateyama 2002 index case PMID:11805270; Spanish p.Arg27Gln family PMID:18930476) and the Orphanet record ORPHA:488650, which supplies the HPO phenotype frequencies and the prevalence class. The openscientist deep-research report was then read in full and integrated: it added PMID:11786420 (caveolae loss and T-system disorganization in caveolin-3-deficient human muscle), PMID:30723005 and PMID:40695747 (c.80G>A pathogenic and recurrent in rippling muscle disease), PMID:27312022 (immunoblot more sensitive than immunostaining), PMID:15318349 (asymptomatic 86-year-old carrier of the same allele, used for incomplete penetrance) and PMID:39370631 (differential diagnoses). Report reference validation: 29/29 resolved, 0 off topic. Report term validation flagged four mislabelled CURIEs (HP:0003750 offered for rippling is Increased muscle fatiguability; HP:0003552, HP:0100284, GO:0005901 labels); none of those were used. The report's statements that MPDT has no OMIM phenotype number or Orphanet code are wrong (OMIM:614321, ORPHA:488650), and its myalgia and muscle stiffness rows describe the wider caveolinopathy spectrum rather than MPDT, so they were not added. Its PFK-M metabolic branch (PMID:14633633, in vitro) was not modelled because no MPDT phenotype depends on it. just preflight-dr could not run because the local MONDO build is absent (exit 2, not downloaded for disk reasons); identity was checked by hand: the report names CAV3 and c.80G>A throughout and cites the Tateyama index paper. The R26Q allele in the mechanism papers (PMID:12839838, 16319126, 19380584, 31036801) is the MPDT allele in older numbering. The membrane-repair node conforms to sarcolemmal_fragility_myofiber_necrosis#Sarcolemmal Membrane Repair Failure. ClinGen classifies CAV3 only for lumped caveolinopathy (MONDO:0016146), so it is cited as evidence and no gene_disease_validity is recorded. Validation: just validate, validate-terms, count-verified-snippets (67/67), check-entity-refs, check-causal-targets, check-genereviews --online (retired GeneReviews chapter PMID:20301559 tagged) and validate-disorders all pass.

  summary: 'Review round 1: second allele, GeneReviews sections, myostatin treatment'
  details: |
    Review round 1 on PR 15434. Added PMID:26947586 (Chen et al. 2016): a second CAV3 variant c.136G>A (p.Ala46Thr), apparently de novo in a sporadic Chinese distal myopathy patient, with evidence on the genetic variants list and the inheritance block; its reduced plasmalemmal caveolin-3 biopsy finding on the caveolin-3 deficiency node; and a new imaging_findings row for the distal and proximal lower-limb MRI signal change. Asymmetric involvement was not added because only the paper's title states it and the abstract does not. Added two retired GeneReviews (PMID:20301559) statements, both graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS and explained as caveolinopathy-wide: the sequencing yield above 99% on the CAV3 sequencing diagnosis row and the 50% recurrence risk on inheritance. Regraded the PMID:12839838 background quote from OTHER to HUMAN_CLINICAL. Added an experimental myostatin inhibition treatment targeting Myostatin signaling disinhibition and the Cav3 P104L transgenic mouse as an animal model linked to the same node with a p-Smad2 readout, all from PMID:17039257 and graded MODEL_ORGANISM with directness INDIRECT; no NCIT term for myostatin inhibition was found (OLS NCIT searches 'myostatin inhibitor' and 'myostatin propeptide' returned nothing), so treatment_term and therapeutic_agent are omitted. The PFK-M branch (PMID:14633633) was not added: it is in vitro only and no curated MPDT phenotype depends on it. Validation: validate, validate-terms, count-verified-snippets 79/79, check-entity-refs, check-causal-targets, check-snippet-grading, model-scale-audit, gene-activity grounding and validate-disorders pass.

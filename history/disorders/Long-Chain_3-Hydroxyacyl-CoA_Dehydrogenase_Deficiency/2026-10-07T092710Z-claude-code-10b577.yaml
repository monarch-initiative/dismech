  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding the two primary dried-blood-spot markers of the shared MTP/LCHAD screen, LOINC:50125-4 3-Hydroxypalmitoylcarnitine (C16-OH) [Moles/volume] in DBS and LOINC:50113-0 3-Hydroxyoleoylcarnitine (C18:1-OH) [Moles/volume] in DBS, with the description stating that the screen does not distinguish isolated LCHAD deficiency from complete TFP or isolated LCKAT deficiency (PMID:15896654, PMID:30029694). Four reference ranges from the case descriptions in PMID:30029694: the German screening laboratory cut-offs C16-OH below 0.05 and C18:1-OH below 0.04 umol/L (patient 1, HADHA c.1528G>C homozygous), and the Austrian cut-offs C16-OH below 0.12 and C18:1-OH below 0.10 umol/L (patient 3, preterm, same genotype), each banded as positive at or above the value. No programme performance paper stating a numeric C16-OH or C18:1-OH cut-off was found by the named PubMed queries, so the notes say the cut-offs come from case descriptions. No loinc_term was placed on the biochemical marker Long-chain 3-hydroxyacylcarnitines (C16OH, C18OH, C18:1OH) because it bundles three analytes and the slot is single-valued. All LOINC codes and labels read from the Monarch KG via just loinc-seed-cache; cache/loinc/terms.csv rows committed. Part of dismech issue 13642, batch 3.
    Review round: the Austrian C18:1-OH cut-off of 0.10 umol/L conflicts with the source's Table 2, which gives 0.16 for the same filter-paper sample; the band keeps the quoted text value and the range notes now disclose the discrepancy.

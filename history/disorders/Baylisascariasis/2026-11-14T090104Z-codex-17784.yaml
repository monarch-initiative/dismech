  summary: Create Baylisascariasis infectious disease entry
  details: |
    Added a new Baylisascariasis entry for MONDO:0000297 and deleted its stub. The curation models Baylisascaris procyonis as a raccoon roundworm whose embryonated eggs are shed at raccoon latrines, records raccoons as definitive hosts and humans as accidental paratenic hosts, and separates egg ingestion, larval intestinal-wall penetration, hematogenous somatic migration, neural larva migrans, and ocular larva migrans in the pathograph.

    The entry uses PMID:16223954 and PMID:26960940 to support agent identity, raccoon definitive-host ecology, egg shedding, and paratenic larval migration; PMID:40671903 to summarize the 60-case scoping review, pica/geophagia risk, and severe neural/ocular outcomes; PMID:40742893 for recent pediatric cases, rooftop-latrine exposure, rBpRAG1 serology, MRI, and early albendazole treatment; and PMID:23829916 plus PMID:15715975 for concise diagnosis and treatment context.

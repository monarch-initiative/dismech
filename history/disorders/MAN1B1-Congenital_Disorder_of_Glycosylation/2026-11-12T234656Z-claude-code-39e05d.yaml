  summary: 'Create: MAN1B1-Congenital_Disorder_of_Glycosylation'
  details: |
    Curated MAN1B1-CDG (MONDO:0018349) from primary literature fetched into references_cache: the founding MRT15 report (PMID:21763484), the first CDG-II series with Golgi morphology and localisation data (PMID:24348268), the transferrin mass spectrometry cohort (PMID:24566669), later case series (PMID:29908352, 34141584, 34162022, 34831340, 41393301), the 44-patient review used for frequencies (PMID:39840888), the disulfiram trial (PMID:34258140), the Man1b1 knockdown study (PMID:40869158), and ERManI cell biology papers on both sides of the Golgi versus quality-control-vesicle localisation question (PMID:21697506, 25411339). ClinGen Definitive (AR) was copied from CGGV:assertion_e0f50bc5. MONDO:0013624 (Rafiq syndrome, OMIM:614202) was recorded as an exactMatch because MONDO keeps separate OMIM-derived and Orphanet-derived classes for the same MAN1B1 patients. No current GeneReviews chapter exists; the retired CDG overview (PMID:20301507) is tagged but carries no clinical characteristics.

    The openscientist deep-research report landed during curation and was read after the entry was drafted. Reference validation: 17/17 resolved, PMID:27856750 flagged off topic (a general GH47 enzymology paper the report cites as demonstrating the MAN1B1-CDG trimming failure). Term validation: 22/23 resolved, one obsolete GO term (GO:0030433, replaced by GO:0036503, which the entry uses); the 13 'named as a different term' rows are table-column artefacts, not wrong CURIEs. preflight-dr PASS (MAN1B1 mentioned 63 times). Points where the report is wrong or overstated: it attributes the 1300-fold kcat reduction specifically to p.Arg334Cys, which the source abstract does not do; it presents Golgi localisation as settled without the conflicting quality-control-vesicle evidence; it says no animal model exists while missing the 2025 mouse knockdown and in utero electroporation study; and it reads PMID:41905312 as making MAN1B1 the second most frequent CDG gene, whereas that count is of referrals with equivocal molecular findings. No term or reference was taken from the report without independent lookup.

    Validation: just validate, validate-terms, count-verified-snippets (75/75), the kb-only CI gates and just validate-disorders all passed. While curating, just fetch-reference on the already-tracked PMID_21763484.md and PMID_20301507.md rewrote them; both were restored with git checkout and are not part of this change.

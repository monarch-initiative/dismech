  summary: 'Genetics pass: ten gene-defined mtDNA subtypes wired into the pathograph'
  details: |
    Genetics pass for the d2g series-034 gap list (issue #12241). Verified the entry's disease_term anchor against OLS first: MONDO:0010789 is MELAS syndrome itself and its ten hierarchical children are exactly the ten gene-defined MELAS terms the gap list names, so the anchor is not over-broad and the gap list is not an artefact of it.

    Restructured has_subtypes from three mechanism-grouped rows into ten gene-defined rows, one per MONDO child, each with subtype_term bound to its MONDO leaf, a genes descriptor bound to HGNC, a description of the reported variant and presentation, and exact-quote evidence. Added eight genetic records (MT-ND1, MT-ND6, MT-TQ, MT-TH, MT-TK, MT-TC, MT-TS1, MT-TS2) and narrowed the previous catch-all MT-ND5 record to MT-ND5 alone; every record carries relationship_type and a subtype foreign key to its row. Added a case_fractions record on MT-TL1 for the 80 percent share of clinically diagnosed MELAS, stating the ascertainment.

    Added two pathophysiology nodes so the nine non-MT-TL1 genes reach the pathograph without being attached to the tRNA-Leu(UUR)-specific nodes: Non-MT-TL1 mitochondrial tRNA dysfunction (six mt-tRNA genes, mitochondrial translation DECREASED) and Complex I structural subunit defect (MT-ND1/5/6, NADH dehydrogenase activity DECREASED). Both feed Oxidative phosphorylation deficiency.

    Modelled as mitochondrial genetics throughout: no zygosity or biallelic vocabulary, heteroplasmy and threshold effects cited where they carry a claim, and the existing HP:0001427 maternal-inheritance block left in place as already correct.

    Recorded a top-level notes lump/split ruling, including that MONDO has no MELAS child term for MT-TV, MT-TW or MT-TM although the literature attributes MELAS to all three.

    Every gene CURIE was read from a live HGNC lookup in the same step it was written; every MONDO subtype CURIE and label from an OLS children query. This session ended at a usage limit before validation was finished; schema and term validation had passed. Reference validation, the offline gates and the remaining curation were completed in the resumed session, recorded separately.

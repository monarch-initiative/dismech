  summary: Add MassIVE and GSE1462 datasets from the OpenScientist pass
  details: |
    Folds in the OpenScientist deep-research report (research/datasets/MELAS_Syndrome-datasets-openscientist.md, run against templates/disease_datasets_research.md) and curates the two datasets it surfaced that the deterministic and manual passes had both missed.

    massive:MSV000088237 - paired proteomics and metabolomics of patient-derived dermal fibroblasts carrying m.14453G>A in MT-ND6. Two things earn it a place. It is the only public patient-tissue multi-omics deposit found for a non-m.3243A>G MELAS genotype, so it speaks to the allele arm of the genotype-phenotype gap and to the complex I subunit subtype in this entry. And it reports downregulated arginine biosynthesis through blocked argininosuccinate synthase, which is a cell-intrinsic route to arginine deficiency and therefore a different claim from the reduced plasma arginine the existing therapeutic rationale rests on. Attached to both the genotype-phenotype and the arginine-evidence gaps, with the arginine rationale updated to separate the mechanistic case (strengthened) from the clinical efficacy question (unchanged - no dataset substitutes for the trial that has never been run).

    geo:GSE1462 - skeletal muscle from four PEO and four MELAS patients, all carrying m.3243A>G, against controls. This is the only dataset in the entry that holds genotype constant and varies clinical phenotype in patient tissue, which is precisely the design the genotype-phenotype gap calls for; the authors read the difference as support for nuclear background as the modifier. Four patients per arm on a 2005 array platform, so a hypothesis rather than a demonstration.

    A triage note is recorded on GSE1462 because it is easy to get wrong: its GEO title is the uninformative "Mitochondrial disorders", and summary-level screening reads it as a mixed-genotype cohort. It was dismissed on first pass for exactly that reason and recovered only by reading the full record. The OpenScientist report itself filed it under "broader mitochondrial-disease datasets containing a MELAS stratum", which understates it.

    Also not curated, from the same report: GSE42986 (primary respiratory-chain disease cohort, genuinely class-level), GSE106601 and GSE142741 (MERRF), GSE208690/GSE208691 (share mitochondrial-encephalomyopathy wording, different conditions), GSE33831 (mesenchymal mitochondrial transfer). Accessions appearing at lines 71-73 of the report (GSE67472, E-MTAB-2770, PXD000001, phs000424, MTBLS123, SRP123456, EGAS00001000123, OSD-737, MSV000078618, MGYS00005566) are the template's own worked examples of accession syntax, not proposals, and were checked as such rather than triaged as candidates.

    The report and its citations sidecar and HTML/PDF artifacts are committed under research/datasets/ per the research-artifact policy. The 29 new references_cache/GEO_*.md records were generated by the deep-research client's reference validation and follow the existing GEO_ cache convention (146 already tracked).

    Validation: 190/190 evidence snippets verified; all 16 dataset accessions resolve; schema, term, entity-ref, and just validate-disorders pass.

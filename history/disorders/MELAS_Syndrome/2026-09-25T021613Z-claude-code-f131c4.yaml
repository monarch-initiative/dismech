  details: |
    Resumed session for the d2g series-034 genetics pass (issue #12241); the first session on this entry ended at a usage limit. This record covers the second half of the work and the review of the first.

    Curated three further mtDNA genes that MONDO has no MELAS child term for, so the earlier ruling that they could not be recorded at all was wrong: a subtype row needs a MONDO term to anchor, a genetic record does not. Added MT-TV (hgnc:7500, m.1616A>G), MT-TW (hgnc:7501, m.5541C>T) and MT-TM (hgnc:7492, m.4450G>A) as genetic records with relationship_type CAUSATIVE and no subtype anchor, each with abstract-quote evidence and a note recording that the evidence base is one reported patient. Bound all three onto the Non-MT-TL1 mitochondrial tRNA dysfunction node, whose gene list now carries nine genes, and added the MT-TW iPSC result as node evidence because it orders the two lesions: the translation defect comes first and respiratory dysfunction follows, which is what the decreased mitochondrial translation annotation on that node asserts. Re-enumerated the hierarchical children of MONDO:0010789 in OLS to confirm the ten-child claim in the entry notes before keeping it.

    Re-cited three evidence items away from PMID:28242802. That cache is content_type full_text_html, which linkml-reference-validator 0.3.0rc1 refuses to serve as stale, and all three quoted sentences sat outside the abstract. The claims were kept and moved to sources whose text the validator will serve: the migraine phenotype and the ptosis phenotype to the GeneReviews chapter abstract (PMID:20301411), the ptosis phenotype additionally to a clinical case report naming ptosis with ophthalmoplegia (PMID:26937404), and the lactic-acidosis-to-recurrent-vomiting sequela to the GeneReviews list of common manifestations, marked directness INDIRECT because GeneReviews does not attribute the vomiting to acidosis. The Ptosis description lost one detail with the source: only PMID:28242802 stated that ptosis preceded the neurological presentation, so the description now says ptosis occurs alongside other extraocular involvement. PMID:28242802 is no longer cited anywhere in kb/; its cache file is left in place.

    Fixed one snippet from the first session: the PMID:41692888 quote contained the source's own square-bracketed abbreviation, which the validator strips from a snippet as an editorial insertion while leaving it in the source, so the quote could not match. Re-expressed with an ellipsis across the bracket.

    Corrected a fabricated reference_title caught during self-review: an added evidence item for PMID:26937404 carried a plausible-looking title written from inference rather than copied from the cache file's own title frontmatter. Replaced with the cached title.

    Outcome is needs_followup for one reason unrelated to this entry's content. Twenty-five pre-existing evidence items cite the GeneReviews MELAS chapter as url:https://www.ncbi.nlm.nih.gov/books/NBK1233/ and its PDF. Under 0.3.0rc1 the validator re-fetches any cache lacking extractor_version, and NCBI Bookshelf answers this environment with a reCAPTCHA interstitial, which the validator then writes over the committed 248,275-character chapter cache. Every run therefore reports a title mismatch on all twenty-five. Reproduced in isolation on an unmodified quote against a scratch cache directory, so it is independent of anything this PR changed; the committed caches were reverted after each run and are byte-identical to main. The quotes cannot move to PMID:20301411, whose cache holds only the chapter summary: one of the twenty-five sentences is in it.

    Validation at 0.3.0rc1: schema and term validation pass on both files; check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-coarse-phenotypes, check-case-collisions, check-stubs, compliance-connectivity, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values and validate-history-all all pass; list-gene-term-mismatches examined 60 HGNC bindings across the two entries with 0 findings; count-verified-snippets verifies 442/442 against the committed cache. validate-disorders reports exactly the 25 Bookshelf title mismatches above and nothing else.

  summary: Add gap-linked public datasets from GEO, PRIDE and registries
  details: |
    Searched public repositories for datasets bearing on the seven knowledge gaps recorded in the previous MELAS session, and curated the results with each dataset attached to the gap it speaks to.

    Method: deterministic search first (just discover-datasets, which found 8 GEO candidates), then targeted E-utilities queries against GEO on "3243A>G", "MELAS", and the expanded syndrome name, which surfaced substantially more; then non-NCBI repositories that GEO search cannot reach - PRIDE, MetaboLights, Metabolomics Workbench, EGA, dbGaP - and an OpenScientist deep-research pass as an independent cross-check. Every curated accession passes just verify-datasets.

    Curated 14 datasets (13 GEO, 1 PRIDE), each attached to a gap via Discussion.attaches_to using the datasets# entity-reference grammar:

    - Genotype-phenotype discordance: GSE202747 (per-cell heteroplasmy in human MELAS retina; partitions by developmental lineage, not randomly), GSE56158 (cybrids across the full heteroplasmy range; sharp transcriptional transitions rather than a gradient), GSE129091 (low vs high load on the MELAS-versus-MIDD axis), GSE85549 (allele-level: m.3243A>G vs m.3302A>G RNA processing).
    - Ischemic-versus-hyperexcitable controversy: GSE127478 (vascular arm - m.3243A>G iPSC endothelium is cell-autonomously dysfunctional and pro-inflammatory), GSE154825 (neuronal arm - MEA-seq network electrophysiology plus non-cell-autonomous astrocyte changes), GSE165953 (heteroplasmy-scaled glutamate dysregulation confirmed in MELAS post-mortem brain), GSE202747 (cuts against the vascular arm: choroidal vasculature near-homoplasmic wild-type while neural lineages carried high mutant load).
    - Human-model mismatch: GSE324301 (cerebral organoid slice model with cortical architecture, generated because no animal carries the mutation, validated against MELAS autopsy), PXD058785 (hiPSC myofibres, heteroplasmy-graded proteomics/phosphoproteomics/metabolomics), GSE61390 (isogenic corrected lines from reprogramming segregation).
    - Prognostic biomarker: GSE89066 (20 patients vs 20 controls, serum miR-27b-3p outperforming lactate - but on diagnosis, not prognosis), GSE14882 (MELAS whole blood correlated to mutant load and clinical features), GSE165953, GSE113300.
    - Episodic trigger: recorded as a negative result. No public dataset addresses the timing question, and the absence is structural - every public MELAS dataset is a cross-sectional snapshot while an episode is a transition in living cortex. GSE27545 attached as the nearest relevant work (a self-aggravating RXRA-ROS-JNK-PGC1alpha retrograde loop, which accounts for progression but not for punctuation).
    - Multi-organ ascertainment: also a negative result for omics. Added two natural-history registry records instead - NCT01532791, which ascertains through maternal relatives of known carriers regardless of their own carrier status with paternal relatives as controls, and NCT05554835, the global harmonized registry.

    Deliberately not curated, with reasons: GSE222921 (TYMP/MNGIE - a different mitochondrial disease; both the deterministic tool and OpenScientist independently flagged or rejected it); GSE105454 and GSE122198 (TARGET-seq method papers on JAK2-V617F myelofibrosis HSPCs, which OpenScientist listed as confirmed MELAS datasets - they are not); PXD063824 (disease-class-level "mitochondrial disorders", not MELAS); Metabolomics Workbench ST003924 (genetically confirmed paediatric primary mitochondrial disorders with a renal framing - relevant to the ascertainment gap, but its sample factors carry only the disease-class label so MELAS cases cannot be identified within it; referenced in the gap rationale rather than curated). SubSeries were not curated alongside their SuperSeries (GSE202735/202746/202886 under GSE202747; GSE89065/89059 under GSE89066). EGA and dbGaP returned nothing for MELAS.

    OpenScientist contributed one dataset the deterministic path missed (GSE89066, the strongest biomarker candidate in the set) and independently reproduced the rest of the GEO list and the GSE222921 rejection; it also returned two false positives. It searched only NCBI, so it missed the PRIDE proteomics dataset.

    Validation: 186/186 evidence snippets verified against the reference cache; all 14 dataset accessions resolve via just verify-datasets; schema, term, entity-ref (38 hash refs, none dangling), duplicate-key, folded-hyphen, snippet-length, title-snippet and source-defect gates pass, as does just validate-disorders. Root-level compliance is now 100%.

  summary: 'Evidence-claim mismatch review: repaired differential, burden, biomarker,
    histopathology and subtype evidence'
  details: |
    Review of the saved evidence-claim evaluation for this entry (issue #13623). All ten whole-claim mismatch flags and the higher-confidence partial flags on substantive fields were read against the cached sources.

    Corrected:
    - Differential diagnosis, Leigh syndrome: the lesion contrast had no supporting quote. Added the source's definition of the bilateral symmetrical deep grey matter and brainstem lesions of Leigh syndrome and its observation that MELAS lesions in the overlap cohort were predominantly cortical. "Asymmetric" was removed from the MELAS lesion description because no cited source states it.
    - Differential diagnosis, MERRF: the only quote covered the COX-negative vessels in MERRF. Added the companion sentence stating that MELAS vessels have normal COX activity, and a quote recording that MERRF/MELAS overlap syndromes are described.
    - Differential diagnosis, acute ischemic stroke: the distinguishing features had no supporting quotes. Added the review's list of stroke-like-episode features, the SPECT hyperperfusion result, and the spectroscopy lactate result. "Elevated rather than restricted diffusion" was rewritten, because the entry's own imaging evidence documents restricted diffusion coexisting with high ADC in the same lesions. The unsupported framing as "the default misdiagnosis, and the one with therapeutic consequences" was removed.
    - Clinical burden: added the survival-cohort figures (23.1% mortality, stroke-like episode or status epilepticus as the predominant cause of death at 42.9%, 39.8% of survivors needing assistance), the atrophy-and-dementia sequela, and GeneReviews' statement that treatment is generally supportive. "Mostly from" became "most often from" since 42.9% is not a majority, and the drug-resistant epilepsy statement is now attributed to the pediatric cohort it comes from.
    - GDF-15 biomarker: "outperforms FGF-21 on every diagnostic metric" and "the better first-line serum screen" overstated the meta-analysis, which reports four pooled metrics and concludes only that GDF-15 had the highest diagnostic accuracy. The context now says that and notes the absence of MELAS-specific accuracy data; the authors' conclusion was added as evidence.
    - FGF-21 biomarker: the "useful for diagnosis" clause had no supporting evidence; added the meta-analysis conclusion on its sensitivity and specificity.
    - Blood lactate: added the multivariate result naming severe lactate elevation as an independent predictor of mortality, which the context asserts.
    - Histopathology: ragged-red fibres (74.4%) and strongly SDH-reactive vessels (71.8%) were coded VERY_FREQUENT (80-99%); both are now FREQUENT (30-79%). The SSV finding also gained the MERRF COX-negative quote, since its description draws the MELAS/MERRF contrast.
    - Progression: the juvenile form's "before ~18 years" cutoff is not in the cited abstract and was replaced; added quotes for the juvenile short-stature difference, for the seizure-onset/drug-resistance sentence (marked as coming from a separate pediatric cohort), and for survival declining mainly within 12 years of onset.
    - Complex I/mitophagy pathophysiology node: removed the unsupported claim that complex I subunits are "the most dependent on mtDNA-encoded synthesis" and softened "this is the mechanistic reason" to a proposed iPSC-derived explanation, matching the PROVISIONAL confidence and the source's "suggesting".
    - Cortical laminar necrosis node: added the source quotes for cortical-predominant edematous lesions and pathologically confirmed gyral microhemorrhage, and marked laminar neuronal loss as a proposal.
    - Mitochondrial angiopathy node: "cerebral small vessels" narrowed to "small blood vessels", which is what the quoted review says.
    - MT-ND5 genetic association: removed the unsupported causal claim that overlap enrichment occurs "because" the lesion is in a structural subunit, and the prescriptive closing sentence; the association now states what the overlap cohort observed.
    - MT-TQ, MT-TK and MT-TC subtypes: the descriptions summarised case presentations with no supporting quotes. Added the presentation sentences from each case report, and for MT-TK the sentence establishing that m.8296A>G is not MELAS-specific.
    - Dataset GSE89066: GEO lists four samples (checked against the GEO record), which matches sample_count; the description now says the 20-versus-20 cohort describes the study rather than the deposited profiles.

    Retained flagged items:
    - Phenotype items for focal-onset seizures, mitochondrial retinal dystrophy, intestinal pseudo-obstruction and right bundle branch block were flagged as whole-claim mismatches only because each snippet supports one sentence of a multi-sentence description; the other sentences are carried by sibling evidence items on the same claim.
    - The cardiac knowledge-gap discussion was flagged on its identifier, kind and status, which are not claims a snippet can support; its rationale matches its evidence.
    - Clinical-trial phase flags: the cached registration titles confirm every recorded phase. Dataset sample counts for GSE56158, GSE165953 and GSE89066 match GEO. GeneReviews Table 3 frequency intervals on diabetes, cardiomyopathy, conduction abnormality and basal ganglia calcification were left as recorded.
    - Most remaining partial flags concern claims broader than one snippet with complementary evidence on the same assertion, or in vitro and carrier-cohort sources whose scope is already stated in the claim text.

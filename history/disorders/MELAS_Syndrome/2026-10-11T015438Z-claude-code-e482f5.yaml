  summary: Set variant_origin GERMLINE on MT-TL1, MT-ND1, MT-ND5, MT-ND6 genetic records
  details: |
    Added variant_origin GERMLINE to the MT-TL1 m.3243A>G, MT-ND5, MT-ND1 and MT-ND6 genetic records. Each record got a GeneReviews evidence item (PMID:20301411, 'MELAS is caused by pathogenic variants in mtDNA and is transmitted by maternal inheritance.') and a notes sentence: GERMLINE means a constitutional, maternally transmitted variant, and the mother usually but not invariably carries it. The other mt-tRNA records (MT-TQ, MT-TH, MT-TK, MT-TC, MT-TS1, MT-TS2, MT-TV, MT-TW, MT-TM) were left without variant_origin: most rest on single case reports whose cited sources do not state transmission. The node 'Complex I structural subunit defect' already binds GO:0008137 DECREASED. This was checked against the new ai-gene-review MT-ND1/5/6 core functions (contributes_to GO:0008137) and is consistent; no change. Validated: just validate, validate-terms, count-verified-snippets (371/371), check-snippet-grading, check_gene_activity_grounding.

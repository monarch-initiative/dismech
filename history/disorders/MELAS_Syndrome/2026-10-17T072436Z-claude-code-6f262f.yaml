  summary: 'Bind LOINC: blood and CSF lactate'
  details: |
    Added loinc_term LOINC:32693-4 (Lactate [Moles/volume] in Blood) and LOINC:2520-5 (Lactate [Moles/volume] in Cerebral spinal fluid) to the existing 'Blood lactate' and 'Cerebrospinal fluid lactate' biochemical markers. Both markers already carried disease-specific, cohort-derived reference_ranges and interpretation_bands citing a MELAS prognostic cohort's own mild/severe thresholds (blood >2/>4 mmol/L, CSF >2.2/>4.4 mmol/L), the strongest case in this tranche for a disease-specific finding with its own value. Pre-existing interpretation_bands were left untouched. Both LOINC codes were already cached; LOINC:2520-5 was newly seeded via just loinc-seed-cache. just validate-disorders passed with 0 issues.

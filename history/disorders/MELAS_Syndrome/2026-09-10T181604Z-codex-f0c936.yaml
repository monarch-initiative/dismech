  summary: Respond to MELAS cardiac attribution and clinical-detail review
  details: |-
    Restored broad MELAS cardiac conduction abnormality while preserving bundle branch block, arrhythmias, sudden cardiac death and the myocardial spectrum at the mixed m.3243A>G-carrier scope of PMID30128910. Added ataxia and ten source-scoped frequency assignments, preserving ranges that cross HPO bands; did not silently repair the literal GeneReviews 7%-89% band. Restored supported seizure, cognitive, retinal, gastrointestinal and renal detail; distinguished broad and subtype causal edges; added qualified migraine-to-stroke-like-episode trigger and multisystem surveillance. GR counseling already supported under PMID20301411. Remaining 12 clinical causal-attribution gaps plus 3 observational readouts retained; no causal edges added from mere disease membership. New evidence titles copied from fetched cache metadata, including PDF URL title fallback. Prior history preserved.
     Independently verified MELAS cardiac sources add arrhythmia and right bundle branch block (completeness unspecified), with one selected-cohort frequency and one qualified remodeling-to-arrhythmia edge. PMID26937404 documents non-sustained atrial tachycardia in a clinical/genetic MELAS case; PMID39930534 documents right bundle branch block in 1/11 clinical MELAS patients, all with stroke-like episodes and lactic acidosis. Sudden cardiac death and left bundle branch block remain carrier-scoped. Total response adds four phenotypes, two edges, eleven frequency assignments and no mechanism nodes or existing HPO rebindings.

  summary: 'Expand MELAS entry: phenotypes, mechanism hypotheses, knowledge gaps'
  details: |
    Literature-driven expansion of the MELAS entry.

    Phenotypes: added 14 - focal-onset seizures, status epilepticus, dementia, cerebral atrophy, cortical visual impairment, mitochondrial retinal dystrophy, progressive external ophthalmoplegia, ptosis, nephropathy with proteinuria, intestinal pseudo-obstruction, hypertrophic cardiomyopathy, WPW and conduction defects, anemia, hemiparesis - and gave every pre-existing phenotype a category, with frequency where a cohort supports it.

    Pathophysiology: extended the pathograph from 5 to 11 nodes. New proximal node for the taurine wobble-modification deficiency carrying the UUG codon-specific decoding defect; a complex I / neuronal mitophagy node from the iPSC data; and the stroke-like-episode chain - neuronal hyperexcitability with propagating epileptic activity, increased capillary permeability with vasogenic edema, cortical laminar necrosis with lesion spread, and progressive brain atrophy. Tagged biological_scale throughout.

    Mechanistic hypotheses: three groups - canonical wobble/translation failure (CANONICAL), ischemic vascular angiopathy (ALTERNATIVE), non-ischemic neuronal hyperexcitability (EMERGING) - with the contested causal edges opted into hypothesis_groups so the pathograph carries both accounts rather than picking one.

    Discussions: seven records - the ischemic-versus-hyperexcitable controversy, the unexplained episodic trigger (with a proposed prospective monitoring experiment), genotype-phenotype discordance across the m.3243A>G carrier population, the absence of any usable prognostic biomarker, the uncontrolled evidence base behind L-arginine, a HUMAN_MODEL_MISMATCH covering the impossibility of a transgenic mtDNA animal, and multi-organ ascertainment bias.

    Also added: histopathology (ragged-red fibers, SSV with preserved COX unlike MERRF, cortical laminar necrosis), imaging_findings, biochemical markers with lactate and CSF-lactate interpretation bands, progression, clinical_burden, differential_diagnoses, synonyms, six clinical trials, one iPSC experimental model with modeled_mechanisms and readouts, and two treatments (antiseizure therapy, soluble guanylate cyclase stimulation). Wired target_mechanisms evidence onto the existing arginine, citrulline, and taurine treatments.

    Validation: all 169 evidence snippets verified against the reference cache; linkml-validate, term validation, causal-graph validation, entity-ref foreign keys, duplicate-key, folded-hyphen, snippet-length, title-snippet, empty-snippet, environmental-evidence and source-defect gates all pass.

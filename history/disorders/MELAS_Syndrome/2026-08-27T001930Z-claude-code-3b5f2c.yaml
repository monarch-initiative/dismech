  summary: Add classifications and cross-ontology mappings
  details: |
    Completes the two remaining top-level blocks on the MELAS entry.

    classifications:
    - harrisons_chapter: NEUROLOGIC as the primary Part (the cardinal manifestation is a paroxysmal neurological event, and epilepsy, encephalopathy and cognitive decline dominate the course and the causes of death), plus GENETICS_ENVIRONMENT_DISEASE for the maternal-mitochondrial inheritance axis and ENDOCRINOLOGY_METABOLISM for the metabolic and endocrine axis (lactic acidosis as a metabolic emergency, diabetes as a curated phenotype and as the dominant presentation of the same variant in its MIDD form). Each carries evidence from an already-cached reference with a verified snippet rather than notes alone.
    - mechanistic_category: mitochondrial disease.
    - icimd_category: two groups, because the entry genuinely spans them. mtdna_encoded_trna_rrna covers the MT-TL1 genotypes (m.3243A>G, m.3271T>C) that account for most MELAS; mtdna_encoded_respiratory_chain_proteins covers the curated "MT-ND5 and other genes" subtype (MT-ND1/ND5/ND6). The two genotype classes reach the same syndrome by different molecular routes - a translation defect versus a structural subunit defect - which is what makes the dual assignment correct rather than hedging. Provenance in notes per the ICIMD convention (Ferreira et al. 2021, PMID:33340416); no manufactured snippet.

    mappings: four, all looked up against authoritative sources rather than recalled.
    - ICD10CM:E88.41 "MELAS syndrome", exactMatch (resolved via the OAK icd10cm adapter).
    - icd11f:1369657886 "Mitochondrial encephalopathy with lactic acidosis and stroke-like episodes", exactMatch. ICD-11 also carries two cardiomyopathy-due-to-MELAS entities; those are manifestation codes, not alternative names for the syndrome, and are deliberately not mapped.
    - NCIT:C84885 "MELAS Syndrome", exactMatch.
    - MONDO:0010785 "maternally-inherited diabetes and deafness", relatedMatch. The predicate choice is the substantive decision here. MIDD is the other major syndrome produced by m.3243A>G and is contrasted with MELAS throughout this entry, but MONDO does not place MIDD under MELAS - it subsumes MIDD under diabetes mellitus and mitochondrial oxidative phosphorylation disorder, so the two are distinct classes sharing a causal variant rather than a parent and a subtype. narrowMatch would have been wrong on the ontology and would additionally have retired MIDD from the curation queue, per the MONDO-coverage rule in CLAUDE.md. relatedMatch is correct on both counts and leaves MIDD as a disease still owed its own entry.

    Also rebased the branch onto origin/main (26 commits). The rebase applied cleanly; the two term-cache CSVs that were expected to conflict turned out to be non-overlapping appends. Post-refresh diff reviewed: all additions plus three expected modifications, no unrelated deletions and no protected-path churn.

    Validation: 193/193 evidence snippets verified; schema, term, classification-schema, Not4Curation, duplicate-key, folded-hyphen, snippet-length, title-snippet gates and just validate-disorders all pass. Term caches picked up exactly the seven rows for the four new bindings. Root-level compliance remains 100%.

  summary: 'Gene-family review: mitochondrial tRNA genes (MT-TL1, MT-TQ, MT-TH, MT-TK,
    MT-TC, MT-TS1, MT-TS2, MT-TV, MT-TW, MT-TM); MT-TL2 added'
  details: |
    Mitochondrial tRNA genes carry no enzymatic activity, but GO does define the molecular function of a tRNA: triplet codon-amino acid adaptor activity (GO:0030533). Both mt-tRNA mechanism nodes now bind it with modifier DECREASED, so every MT-T gene in the entry lands on a molecular function. For MT-TL1 the new evidence is PMID:15477592: tRNA-Leu(UUR) lacking the wobble taurine modification that m.3243A>G and m.3271T>C abolish shows severely reduced UUG decoding with UUA decoding intact; the node description now states the codon-specific failure. On the shared non-MT-TL1 node the MT-TW functional study (PMID:26297375) carries the claim. Each of the nine non-MT-TL1 genetic records gains a Mitochondrial inheritance block (HP:0001427, GeneReviews PMID:20301411). MT-TC and MT-TQ change from CAUSATIVE to UNKNOWN: each rests on one reported patient (PMID:38881794, PMID:11171912), and the ClinGen Mitochondrial Diseases expert panel rates both genes only Limited for mitochondrial disease as a whole (2025-07-14), so the Definitive/Strong level that CAUSATIVE stands for is not reached for MELAS. The ClinGen tier itself is not copied because it is for the broader disease.
    MT-TL2 is added as an UNKNOWN record and on the shared non-MT-TL1 node: a heteroplasmic m.12315G>A variant was reported in a 5-year-old with neurological regression and stroke-like episodes that the authors call MELAS-like (PMID:37953071); MONDO has no MELAS child term for the gene and the case is the only MELAS-spectrum report, while ClinGen rates MT-TL2 Definitive for mitochondrial disease as a whole.

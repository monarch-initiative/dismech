  summary: 'Create: Hypomagnesemia, Seizures, and Intellectual Disability 2'
  details: |
    De novo curation of HOMGSMR2 (MONDO:0020788, OMIM 618314), caused by de novo heterozygous ATP1A1 missense variants. One openscientist deep-research report was used (research/Hypomagnesemia_Seizures_And_Intellectual_Disability_2-deep-research-openscientist.md); it was retrieved by re-attaching to the original OpenScientist job 6cadd0d9-f5ca-494d-969b-43c2b3472e61 after a container restart, so no second job was submitted. The report's bundled final_report.html and final_report.pdf artifacts duplicate the markdown and were left out of the commit; the .md report and .citations.md sidecar are committed. Report reference_validation: 7/7 references resolved, 0 unresolved, 5/7 on topic. Report term_validation: needs_review true, 6 mislabelled_terms (NCIT:C260, NCIT:C29136, NCIT:C15265, HP:0100520 renal magnesium wasting mapped to Oliguria, plus loose GO/UBERON paraphrases); none of those wrong CURIEs were used. Every CURIE was re-looked-up in cache or OLS when written. Renal magnesium wasting is bound to HP:0005567, not the report's HP:0100520. Treatments use NCIT:C15986 Pharmacotherapy and NCIT:C64172 Anticonvulsant Therapy. preflight-dr exits 2 because no local mondo.db is present (about 1.3 GB); it was not downloaded, so the MONDO causal-gene/OMIM-xref named-entity check was not run automatically. A manual named-entity check was done instead: the report mentions ATP1A1 44 times and the disease OMIM 618314, with CNNM2/TRPM6 only as the excluded differentials, so it is about the right disease. Eight fetched references were not cited and left unstaged: PMID:31705535, 34232746, 35110381 (allelic CMT/HSP/complex-NDD disorders, out of scope), 37090550 (preprint of the cited 37659504), 42579713 (commentary) and 42764777 (broad NKA review). The report's p.Asp933Asn/p.Gly864Arg/p.Leu337Pro variants were excluded from the HOMGSMR2 variant list because their patients had normal serum magnesium. Two behavioral phenotypes (Hyperactivity, Self-biting) were drafted then dropped because their only sources were non-propositional single-patient table-cell fragments that fail check-snippet-length. Validated with just validate, validate-terms, count-verified-snippets (58/58), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-length, check-coarse-phenotypes, check-enum-values, check-term-cache-integrity and the authoritative just validate-disorders (schema+term+reference, all passed). No GeneReviews chapter exists (check-genereviews NO_CHAPTER).

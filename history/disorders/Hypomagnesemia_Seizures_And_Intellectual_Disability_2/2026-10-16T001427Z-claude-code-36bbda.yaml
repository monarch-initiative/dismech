  summary: 'Fix: bind molecular function on ATP1A1 trigger node'
  details: |
    CI fix for PR 14445. The gene activity grounding gate (scripts/check_gene_activity_grounding.py) reported ATP1A1 as newly wired into the pathograph with no molecular function on the node it lands on, 'ATP1A1 Transmembrane Arginine Substitution'. Bound GO:0005391 (P-type sodium:potassium-exchanging transporter activity) on that node with modifier ABNORMAL, because the arginine substitutions both reduce pumping and add a passive leak current, so neither DECREASED nor GAIN_OF_FUNCTION alone describes the variant node. The downstream nodes keep their specific modifiers. Re-run after the change: just validate, validate-terms, count-verified-snippets (61/61), check-entity-refs, check-enum-values and the grounding gate against origin/main all pass. The earlier CREATE record's 58/58 snippet count predates the experimental-model evidence; the current count is 61/61.

  details: |
    Round 4 on PR #9008. The blocking item was a model mis-attribution and the reviewer is
    right.

    I had attached a FAILS_TO_RECAPITULATE link, evidenced from PMID:7918681, to the
    "PNP-knockout mouse" animal_models entry whose structured identity
    (name/genotype/publication) points at PMID:10859343, the Arpaia knockout. But PMID:7918681
    did not study the knockout: it studied the B6-NPE and B6-NPF ENU-induced mutant strains,
    published six years earlier, which are hypomorphs carrying residual activity (the paper
    itself reports residual deoxyguanosine kinase activity of 6-52% and 2-22% respectively),
    not nulls.

    The prose was honest - both the description and the limitations named B6-NPE/B6-NPF
    explicitly and said the failure was line-specific - but prose is not what the renderer and
    downstream exports consume. As curated, the structured edge asserted "PNP-knockout mouse
    FAILS_TO_RECAPITULATE intracellular dGTP pooling", which is a strong negative claim about
    the field's principal model that the 1994 experiment does not make. A hypomorph failing to
    accumulate dGTP is a materially weaker negative than a null failing to.

    Fixed by splitting into a second animal_models entry with the correct identity:
      name: B6-NPE / B6-NPF ENU-induced PNP-deficient mouse strains
      genotype: Pnp hypomorphic ENU-induced point mutants with secondary deoxyguanosine
                kinase deficiency
      publication: PMID:7918681
    The link, its readout and all its evidence moved across verbatim - no evidence changed and
    all snippets still verify. The new entry's description states explicitly why it is curated
    separately rather than merged. The cross-line caveat in the knockout's limitations was left
    in place, since that is the right spot to record that the murine metabolic phenotype is not
    uniform across lines.

    Also took suggestion 1, narrowing two diagnosis terms to already-cached, already-validated
    NCIT terms: PNP sequencing NCIT:C18020 -> NCIT:C15709 Genetic Testing, and newborn
    screening NCIT:C18020 -> NCIT:C81178 Newborn Screening. The lymphocyte-enumeration entry
    keeps NCIT:C25294 because, as the reviewer noted, it covers more than flow cytometry;
    NCIT:C16585 would understate it. The enzyme-assay and metabolite-profiling entries also
    keep NCIT:C25294, which is correct for them.

    Suggestion 2 (penetrance note) not taken: the DR artifact supplies no quotable penetrance
    figure and the 8-11% residual-activity threshold is already curated in multiple places.

    Note the review that raised this was written against commit b66982a70 and so predates the
    pathograph correction pushed in the previous round (therapy-node removal, motivation-edge
    removal, SAMHD1 parent). Both sets of changes are independent and both are now in.


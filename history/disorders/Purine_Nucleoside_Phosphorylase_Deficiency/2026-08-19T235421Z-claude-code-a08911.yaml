  summary: 'Address review on PR #9008: fix kinase in description, add diagnosis section,
    ataxia/ID phenotypes, NIH trial'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9008. Both IMPORTANT
    items addressed plus four of the suggestions.

    IMPORTANT 1 - wrong kinase in the top-level `description`. A genuine catch and a good
    one: the deoxycytidine-kinase correction had been applied to all four pathophysiology
    nodes but not to the description prose, which is the most-read field on the rendered
    page. The description now reads "phosphorylated to dGTP, a conversion that in the
    T-cell-lethal arm requires deoxycytidine kinase", matching the nodes and the verified
    snippet from PMID:35653193. Confirmed zero remaining occurrences of "deoxyguanosine
    kinase" in the file.

    IMPORTANT 2 - missing `diagnosis:` section. Added five entries, each grounded in a
    verified snippet from an independently fetched paper rather than in the DR report's
    opaque citation keys:
      - PNP enzyme activity assay, with the point that residual activity must be quantified
        rather than merely called present/absent, because 8-11% predicts a mild phenotype.
      - Plasma and urine purine metabolite profiling, recording that urinary substrate
        elevation is the more sensitive half of the pair since partial-deficiency patients
        had normal serum urate.
      - Lymphocyte subset enumeration, recording both diagnostic traps: normal
        immunoglobulins do not exclude, and a single normal T-cell count does not exclude
        because the defect is attritional.
      - PNP sequencing WITH deletion/duplication analysis, justified by a real compound
        genotype (frameshift plus exon 2-6 deletion) that sequencing alone would have missed.
      - Newborn screening, distinguishing the two routes - DBS tandem mass spectrometry
        detecting the metabolite signature directly, and TREC/KREC detecting the downstream
        lymphopenia - and noting that the TREC route may miss milder disease because it
        detects the consequence rather than the defect.
    Three new references were fetched and verified for this: PMID:24767876, PMID:34698070,
    PMID:40981309.

    SUGGESTIONS ADDRESSED:
      - Added Ataxia (HP:0001251) and Intellectual disability (HP:0001249). The ataxia
        evidence consumes PMID:22038677, which the reviewer correctly flagged as cached but
        uncited; it is a good fit because it establishes that neurological signs are a CORE
        feature of PNP deficiency, grouping it with ataxia-telangiectasia.
      - Phenotype name broader than its term: "Neurological dysfunction" bound to
        HP:0001263 was renamed to "Global developmental delay" to match its term, with the
        description now stating explicitly that the FREQUENT band derives from the
        two-thirds figure for the neurological arm as a whole and is therefore an upper
        bound for this individual manifestation.
      - Added NCT06092346, the NIH natural-history protocol, noted as relevant precisely
        because the entry's principal knowledge gap is the neurological arm.
      - Removed the duplicate uppercase-DOI cache file DOI_10.1172_JCI160852.md, keeping the
        lowercase form that eight other disorder files already use.

    NOT DONE, with reasons:
      - Onset descriptor (4 months - 6 years): no verified snippet for that window was
        available in the fetched references, so it was not asserted.
      - More specific NCIT term than C15747 Supportive Care: the treatment is a
        heterogeneous bridge (immunoglobulin replacement, prophylaxis, irradiated blood
        products) and no single NCIT action term covers it more precisely without
        overstating one component.
      - Top-level `references:` block: reference_title is populated on every evidence item,
        so provenance is not lost.
      - DOI_10.23937_2378-3672_1410043.md remains uncited. It was written by the DR
        reference-validation pass, not deliberately fetched, and no claim in the entry needs
        it.


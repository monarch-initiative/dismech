  summary: Remove therapy-as-pathophysiology node and two motivation edges; give SAMHD1
    node a causal parent
  details: |
    Proactive correction, not requested on this PR. The reviewer of PR #9007 flagged that a
    pathophysiology edge encoding clinical motivation rather than causation exports to KGX/cx2
    as a false causal assertion. Auditing this entry found the same pattern, and following it
    through exposed a deeper category error.

    The two offending edges were "Recurrent and Opportunistic Infection" -> HSCT node and
    "Immune Dysregulation with Autoimmunity and EBV-Driven Lymphoma" -> HSCT node. Both
    described why transplantation matters ("the lethality of infection is what makes timely
    definitive correction the central therapeutic goal"; "EBV-driven lymphoma before transplant
    is a principal cause of treatment failure") rather than what causes what.

    Removing them would have isolated the "Haematopoietic Stem Cell Reconstitution as
    Definitive Correction" node entirely, since it had no outgoing edges - and that is the
    diagnostic. A node that only motivation edges can reach is not a pathophysiological
    process. It is a therapy, and dismech already has the right place for a therapy: a
    treatment with target_mechanisms. So the node was removed rather than patched, and the HSCT
    treatment's target_mechanisms repointed to the two real nodes it actually acts on:
      - "Loss of Purine Nucleoside Phosphorolysis" (INHIBITS) - donor haematopoiesis restores
        the missing enzymatic step in the compartment carrying the substrate burden, which is
        the metabolic logic of why replacing that compartment suffices.
      - "Impaired Thymocyte Development and Reduced T-Cell Output" (INHIBITS) - restoring
        enzyme-competent haematopoiesis re-establishes thymic output; the caveat that
        established neurological disease is not reliably reversed is retained here.
    No content was lost; it moved to where it belongs.

    Separately, the SAMHD1 synthetic-lethality node was a second directed root. It now has a
    causal parent, "Intracellular dGTP Pooling in Lymphoid Cells", with a description that
    makes the mechanism explicit rather than merely wiring it up: the synthetic-lethal
    interaction is not a standing property of the thymocyte but is created by the accumulating
    dNTP load arriving in the one cell type that has physiologically stood down SAMHD1, its
    disposal enzyme.

    Result: 16 nodes, 18 edges, exactly ONE directed root (the trigger), all 16 connected, no
    orphans, no dangling references from either downstream edges or treatment target_mechanisms.


  summary: 'Create: Purine nucleoside phosphorylase deficiency (MONDO:0013171)'
  details: |
    New disorder entry for purine nucleoside phosphorylase deficiency (MONDO:0013171),
    an autosomal recessive inborn error of purine salvage causing T-cell predominant
    combined immunodeficiency with neurological disease and autoimmunity. Claimed via
    issue #9001 off the priority dashboard (CURATE_ROOT, score 71.5, no NEC risk badge).

    Deep research: `just research-disorder falcon Purine_Nucleoside_Phosphorylase_Deficiency`
    (Edison/Falcon). Three gates:
      Gate 1 - report reference_validation: 4 references, 4 resolved, 0 unresolved,
        0 off-topic.
      Gate 2 - `just preflight-dr ... MONDO:0013171` returned PASS, the only clean
        automated verdict of this session's three disorders: MONDO records PNP as the
        canonical causal gene (RO:0004003 HGNC:7892) and the report mentions PNP 61 times,
        far ahead of any rival.
      Gate 3 - the entry was built from independently sourced and fetched references before
        the report landed; every snippet was verified against the fetched cache.

    DR CONTRIBUTED REAL VALUE HERE, and also one correction:
      - Value: the report surfaced Abt et al. JCI 2022 on PNP as a DUAL metabolic checkpoint.
        Independently verified as PMID:35653193. This resolves what would otherwise be the
        entry's central unexplained paradox - how a profound T-cell immunodeficiency produces
        autoimmunity in a third of patients - via two independent lineage-specific mechanisms:
        SAMHD1-dependent synthetic lethality in developing T cells, and a TLR7 (deoxy)guanosine
        ligand checkpoint in B cells and macrophages. Two new pathophysiology nodes were added
        for these, plus a HUMAN_MODEL_MISMATCH on their human validity since the work is murine
        and cellular.
      - Correction: the report attributed dGuo phosphorylation to deoxycytidine kinase while an
        earlier draft of this entry said deoxyguanosine kinase. Neither had a verified snippet
        at the time, so the unsupported attribution was removed from the node and replaced with
        the claim the verified abstract actually makes ("This interaction requires deoxycytidine
        kinase activity"), cited to PMID:35653193.

    Pathograph: 17 atomic nodes, 19 edges, single connected component, no orphans, all four
    biological_scale values (8 MOLECULAR). Chain: biallelic PNP LOF -> loss of phosphorolysis
    -> {substrate accumulation, hypouricemia/urinary nucleoside readout} -> dGTP pooling in
    lymphoid cells -> {ribonucleotide reductase inhibition, mitochondrial dGTP and impaired
    mtDNA repair} -> thymocyte/T-cell apoptosis -> impaired thymic output -> combined
    immunodeficiency -> {infection, immune dysregulation}. Parallel branches: the TLR7 arm
    feeding immune dysregulation, the SAMHD1 synthetic-lethality arm feeding T-cell apoptosis,
    and the CNS purine imbalance arm feeding neurological dysfunction at low confidence.

    The lymphoid selectivity of a ubiquitously expressed enzyme is curated explicitly with its
    explanation (PNP is highest in lymphoid tissue, so lymphoid cells carry the largest flux
    through the missing step), rather than left as an unexplained fact.

    An activity threshold is curated as a first-class finding: siblings with 8-11% residual PNP
    activity reached their third decade with mild immune abnormalities and entirely normal
    neurological development (PMID:32695102). The same paper supplies human-cell corroboration
    of the murine mitochondrial mechanism, since irradiation survival of lymphoblastoid B cells
    tracked residual PNP activity.

    Module conformance: none declared. metabolic_intoxication_decompensation models acute
    decompensation crises unmasked by catabolic stress; PNP deficiency is chronic accumulation
    with progressive cell loss and no acute decompensation phenotype.
    lysosomal_substrate_accumulation is inapplicable - the substrate is cytosolic and
    mitochondrial, and the toxicity is nucleotide-pool distortion rather than storage. The notes
    record that a future "nucleotide salvage toxicity" module covering PNP and ADA deficiency
    together would be the natural home, with the dGTP-pooling node as attachment point.

    Frequency discipline: exactly two bands, both from explicit proportions in a 33-patient
    literature review - neurological disease two thirds and autoimmunity one third, at the upper
    and lower ends of FREQUENT (30-79%). All other phenotypes left unbanded because the sources
    are three- and four-patient case series.

    Discussions: `pnp-neurological-mechanism` (KNOWLEDGE_GAP) - the neurological arm is not
    explained by the T-cell mechanism, dissociates from it in individual patients, and is not
    reversed by the treatment that cures the immunodeficiency; and
    `pnp-dual-checkpoint-human-validation` (HUMAN_MODEL_MISMATCH) on the murine dual-checkpoint
    model.


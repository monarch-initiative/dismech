  summary: 'Round 2 review response on PR #9008: re-cite ataxia, add animal models
    incl. FAILS_TO_RECAPITULATE, biochemical'
  details: |
    Second review round on PR #9008. Both IMPORTANT items addressed plus three suggestions.

    IMPORTANT 1 - Ataxia phenotype not supported by its evidence. The reviewer is exactly
    right and this is the sharpest catch of the session. My snippet from PMID:22038677 was a
    verbatim quote, so count-verified-snippets passed it, but the only occurrence of "ataxia"
    in that abstract is inside "ataxia-telangiectasia" - the name of a DIFFERENT disease. The
    sentence supports "neurological signs are a core feature of PNP deficiency"; it does not
    support "PNP patients have ataxia". This is a snippet-verification-passes-but-claim-fails
    defect of exactly the class the SOP warns about, and no mechanical check can catch it.

    Re-cited to PMID:33061764, already cached and already cited elsewhere in the entry, which
    states directly: "Developmental retardation, hypertonia, spasticity, tremors, ataxia, and
    motor retardation are observed frequently." Also added the structural correlate from the
    same source - "Cranial MRI reveals cerebral cortical and cerebellar atrophy and white
    matter demyelination" - so the ataxia claim now rests on both a symptom report and a
    matching cerebellar imaging finding rather than on an inference.

    While in that sentence, added the other manifestations it names: Hypertonia (HP:0001276)
    and Tremor (HP:0001337), plus Cerebellar atrophy (HP:0001272) from the MRI sentence.

    IMPORTANT 2 - no animal_models section. Added the PNP-knockout mouse with THREE
    modeled_mechanisms links, each with fidelity, limitations, readouts and evidence:
      - RECAPITULATES the mitochondrial dGTP / mtDNA repair node (the model is where that
        mechanism was established), with limitations recording that the mitochondrial locus has
        never been demonstrated in human tissue.
      - RECAPITULATES the thymic output node at HIGH fidelity.
      - FAILS_TO_RECAPITULATE the dGTP-pooling node. This is the important one and it required
        going beyond what the reviewer suggested. PMID:7918681 reports that in the B6-NPE and
        B6-NPF PNP-deficient lines, dGTP accumulation was NOT detectable in thymocytes, spleen
        leucocytes or erythrocytes, and that those lines instead carry a secondary deficiency of
        deoxyguanosine kinase - so the mouse partly protects itself from the very lesion the
        model is meant to represent. That is a substantive negative result with a mechanism for
        the failure, which is what FAILS_TO_RECAPITULATE requires, and it is the structural
        counterpart of the existing HUMAN_MODEL_MISMATCH discussion. Evidence recorded as
        REFUTE with direction UNCHANGED on the readout.

    SUGGESTIONS ADDRESSED:
      - GO:0006281 DNA repair narrowed to GO:0043504 mitochondrial DNA repair on the
        mitochondrial node, matching the node name exactly.
      - Lymphoma added as a phenotype (HP:0002665) with two independent case series reporting
        fatal EBV-driven lymphoma before transplant.
      - biochemical: section added with serum uric acid and urinary purine nucleosides, the
        diagnostic biomarker pair, including the PARTIAL item recording that urate is normal in
        partial deficiency so a normal value does not exclude. No reference_ranges: no citable
        interval was available in the fetched sources, and inventing one would be worse than
        omitting it.

    NOT DONE:
      - Penetrance statement: no verified source; the research artifact itself states no robust
        penetrance data exists.
      - Camici et al. 2023 as a modernised citation for the two-thirds/one-third figures: the
        DOI resolves but the figures would need to be re-verified against its abstract, and the
        1991 review states them directly and is already verified. Swapping a verified citation
        for an unverified one is not an improvement.


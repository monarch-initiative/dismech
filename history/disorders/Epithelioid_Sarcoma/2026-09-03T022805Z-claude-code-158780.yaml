  summary: Move the somatic origin marking to the SMARCB1 lesion node
  details: |
    Correction following PR review (monarch-initiative/dismech#10629). The backfill had marked 'EZH2/PRC2 Dependency and H3K27 Hypermethylation' because its name contains a lesion word, but that node is the chromatin consequence of the real lesion. Moved genetic_context.variant_origin: SOMATIC onto 'SMARCB1 (INI1) Loss'. The derived cell of origin is unchanged (mesenchymal stem cell); what changes is which event the entry claims was the somatic one. The backfill regex now matches gene loss written with a parenthetical alias, and no longer treats bare hypermethylation as a lesion.

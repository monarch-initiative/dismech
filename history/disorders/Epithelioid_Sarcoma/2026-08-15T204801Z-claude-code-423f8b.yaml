  summary: Add ICD-O morphology classification to the existing classifications block
  details: |
    Weekly compliance pass, cancer-classification/ICD-O theme. The entry already carried harrisons_chapter=ONCOLOGY_HEMATOLOGY but no icdo_morphology. Added icdo_morphology=Sarcoma. Derivation: the entry disease term MONDO:0017387 epithelioid sarcoma carries xref ICDO:8804/3 and NCIT:C3714, which OAK confirms is a descendant of NCIT:C9118 Sarcoma, the NCIT term the ICDOMorphologyEnum Sarcoma value is bound to. Notes explicitly record that the epithelioid cytomorphology and keratin/EMA immunophenotype are not a carcinoma signal, since the morphology axis records histogenesis. Also added an explanatory note to the pre-existing harrisons_chapter assignment. Validated with just validate.

  summary: Remove the borrowed cell binding left on the EZH2/PRC2 node
  details: |
    Follow-up to PR review (monarch-initiative/dismech#10629), non-blocking suggestion. The cancer-origin backfill had bound a cell type onto a node alongside a SOMATIC marking; when that marking was moved or removed in the previous correction, the borrowed binding stayed behind on a node that is no longer the origin. Removed it. The binding existed only because a heuristic placed it there, not because a curator judged that lineage for that node, and the derived cell of origin is unchanged because it now reads from a different node. Here it also resolved an inconsistency the reviewer caught: the lesion node's own binding is deliberately hedged (preferred_term: mesenchymal cell of uncertain differentiation against label: mesenchymal stem cell), while the borrowed one on the downstream node asserted the same CURIE flatly. Two nodes in one file, same term, different strength of claim.

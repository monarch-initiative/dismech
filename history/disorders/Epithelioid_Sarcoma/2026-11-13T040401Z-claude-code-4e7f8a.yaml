  summary: 'Address PR 17268 review feedback: rebind cell of origin to CL:0008019,
    add SWI/SNF-PRC2 antagonism evidence, and refine doxorubicin and metastasis notes'
  details: |
    Rebound cell_types on both 'SMARCB1 (INI1) Loss' and 'Aberrant Proliferation and Blocked Differentiation' from CL:0000134 (mesenchymal stem cell) to CL:0008019 (mesenchymal cell) and added a note on 'SMARCB1 (INI1) Loss' documenting that epithelioid sarcoma's normal cell of origin remains unsettled beyond mesenchymal differentiation (PMID:37916971). Added primary SWI/SNF-Polycomb antagonism evidence (PMID:20951942) on 'EZH2/PRC2 Dependency and H3K27 Hypermethylation' directly supporting elevated EZH2 expression and broad H3K27 trimethylation in SNF5/SMARCB1-deficient cancers. Marked the clinicaltrials:NCT02601950 evidence item on 'Doxorubicin-Based Systemic Chemotherapy' target_mechanisms as directness: INDIRECT, trimmed unsupported DNA-intercalation/topoisomerase-II prose from the link description, and added notes documenting the verified live ClinicalTrials.gov NCT02601950 record and the HPO query behind HP:0100526 (Neoplasm of the lung) on 'Pulmonary Metastasis'.

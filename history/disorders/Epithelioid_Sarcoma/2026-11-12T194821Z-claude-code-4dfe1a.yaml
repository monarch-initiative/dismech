  summary: 'Review and enrich Epithelioid Sarcoma: ground SMARCB1 loss, expand short
    snippets, add prevalence, progression, diagnosis, and systemic therapy'
  details: |
    Expanded short fragment snippets on Adjunctive Radiotherapy (PMID:4014539) and Tazemetostat (PMID:33035459) to full sentences, added missing evidence on Aberrant Proliferation and Blocked Differentiation, Spindle Cell Component, Wide Surgical Excision, INI1/SMARCB1 Immunohistochemistry (with diagnostic MechanisticReadout targeting SMARCB1 (INI1) Loss), and Tazemetostat target_mechanisms. Grounded 'SMARCB1 (INI1) Loss' with hgnc:11103, somatic biallelic loss-of-function genetic_context, and GO molecular_functions (GO:0003682, GO:0003712), while preserving protected node 'Local Invasion and Metastatic Dissemination' (node_class: NEOPLASTIC_INVASION_AND_METASTASIS, conforms_to: invasion_and_metastasis#Local Invasion and Intravasation) and connecting 4/4 phenotypes including new Pulmonary Metastasis (HP:0100526). Added SEER/Orphanet prevalence (PMID:37916971, ORPHA:293202), clinical progression phases, 3 NCIT-bound diagnostic procedures, ChEBI therapeutic_agent bindings for tazemetostat (CHEBI:231598) and front-line doxorubicin chemotherapy (CHEBI:28748, clinicaltrials:NCT02601950), and tagged StatPearls chapter PMID:30422506.

  summary: 'Create: Rickettsialpox'
  details: |
    Created a standalone Rickettsialpox entry for MONDO:0019360 after exact
    ignored-file-inclusive local search found it only as a Spotted_Fever_Rickettsiosis
    subtype, Boomer analysis row, and rare-disease ICD worklist row. The only GitHub
    overlaps were the completed root curation issue/PR (#8890/#8899), whose root entry
    intentionally left rickettsialpox promotable; no active local or remote branch was
    found.

    PROMOTION. Kept Rickettsialpox under the Spotted fever rickettsiosis parent and
    updated the Rickettsialpox subtype description there from "No standalone dismech
    entry yet" to `Curated in full in Rickettsialpox.yaml`.

    DEEP RESEARCH. Ran `just research-disorder openscientist Rickettsialpox`; the report
    is `research/Rickettsialpox-deep-research-openscientist.md`, with the generated
    citation table and HTML/PDF artifacts committed alongside it. The report resolved all
    13 references, but term validation correctly flagged several lead-quality CURIE
    errors: `NCIT:C842` for "Tetracycline antibiotic" resolves to Stanozolol, `NCIT:C242`
    for "Broad-spectrum; 50S ribosome inhibitor" resolves to Anti-Androgen, and `NCIT:C312`
    for doxycycline resolves to Bleomycin Sulfate. None were used. Doxycycline was instead
    modeled with the existing CHEBI:50845 agent under NCIT:C15986 Pharmacotherapy, following
    the nearby rickettsiosis treatment pattern.

    NEC. `just preflight-dr research/Rickettsialpox-deep-research-openscientist.md
    MONDO:0019360` returned SKIP because MONDO records no RO:0004003 causal gene for this
    acquired infection. Manual identity review matched the report to rickettsialpox
    throughout: MONDO:0019360, Rickettsia akari (NCBITaxon:786), mite-borne transmission,
    and the core New York City rickettsialpox case series all refer to the intended entity.

    CONTENT. Curated the Rickettsia akari infectious agent, house mouse mite transmission,
    the conserved intracellular and 70S-ribosome drug-mechanism module conformances,
    cutaneous R. akari infection, macrophage cytokine response, papulovesicular rash/eschar
    formation, and rare hepatic involvement. Added four phenotype nodes and wired all four
    to causal parents: fever, eschar, papulovesicular eruption, and rare acute hepatitis.
    Added diagnosis by lesional skin immunohistochemistry/PCR/culture and paired-serum
    indirect immunofluorescence. Added empiric doxycycline treatment targeting both the
    rickettsial ribosome node and the obligate intracellular niche.

    SOURCES. Reused existing cached rickettsialpox/Rickettsia akari evidence where exact
    snippets already supported the claim, and lifted three central sources from the
    OpenScientist report: Koss et al. for the 18-patient New York City diagnostic series
    (PMID:14676069), Madison et al. for rare self-limited hepatitis and the concise
    agent/vector statement (PMID:18171106), and Walker's spotted-fever-group review for
    the endothelial-invasion and doxycycline claims (PMID:2677080). Orphanet lists
    Rickettsialpox as ORPHA:83312 in the rare-disease ICD worklist, but `just
    fetch-reference ORPHA:83312` reported "No source found for reference type"; no
    hand-written Orphanet cache was created.

    VALIDATION. `just validate kb/disorders/Rickettsialpox.yaml` passed with 21 snippets
    checked, no skipped or unavailable snippets, and 24 titles checked. `just
    count-verified-snippets kb/disorders/Rickettsialpox.yaml` reported 21/21 snippets
    verified against cached references. `just list-disconnected-phenotypes
    kb/disorders/Rickettsialpox.yaml` reported 4/4 phenotype nodes causally connected.
    `just validate kb/disorders/Spotted_Fever_Rickettsiosis.yaml` passed after the parent
    row pointer edit.

  summary: 'Review round 1: Carboxypeptidase_N_Deficiency (PR #11682)'
  details: |
    Addressed all five findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #11682, plus three of the non-blocking suggestions. All findings accepted; none disputed.

    FINDING 1 - GO:0002254 kinin cascade with modifier DECREASED asserted reduced bradykinin PRODUCTION, the inverse of the disease, and contradicted the node's own description. Accepted; this was a real error and the sort that reads plausibly because the term name contains the right word. Rebound to GO:0010815 bradykinin catabolic process with DECREASED, which now mirrors the sibling anaphylatoxin node's GO:0043171 pattern exactly.

    FINDING 2 - NCIT:C49236 Therapeutic Procedure bound to a diagnostic plasma enzyme assay, with a note claiming it was the closest accurate ancestor. The note was wrong. Rebound to NCIT:C25294 Laboratory Procedure and the note rewritten.

    FINDING 3 - icatibant missing. Accepted. Added as a treatment with CHEBI:68556, target_mechanisms on Persistence of B2 Receptor Kinins, and two verified quotes from two unrelated families. It is the only agent in the entry acting directly on a pathograph node.

    FINDING 4 - antihistamine curated on mouse evidence while the same cited paper reports H1-antihistamine failure at maximal dose in these patients. Accepted, and this is the most important of the five for how the entry reads. Added a REFUTE HUMAN_CLINICAL item quoting the failure, rewrote the treatment description so both results are visible, and rewrote the notes to say what each result answers: the mouse shows histamine is a necessary mediator of acute anaphylatoxin-driven lethality, the human series shows blocking H1 does not control the clinical syndrome. Kept rather than deleted because read together they argue the bradykinin arm dominates, which is the entry's own thesis.

    FINDING 5 - tranexamic acid prophylaxis missing. Accepted; added with CHEBI:48669 and two verified quotes, at the consistent 3 g/d dose reported across families.

    NON-BLOCKING TAKEN: montelukast added (CHEBI:50730), with a note that it is one family, always in combination. Asthma/atopy added as a VERY_RARE phenotype from the index case, with the single-patient caveat in the description. Hormonal and physical triggers added as an environmental entry with an influences_mechanisms link (TRIGGERS, INDIRECT_UNKNOWN_INTERMEDIATES) to the kinin node, quoting the oral-contraception onset.

    NON-BLOCKING NOT TAKEN, with reason recorded in the entry: the cold and pressure triggers appear only in a clinical-records table in PMID:38445235. A quoted table cell is not a propositional statement, so they are described in a review_notes line on the environmental entry rather than curated with a manufactured quote. A urticaria frequency figure was looked for and not found in quotable form.

    Evidence count rose from 32 to 41 snippets across 6 PMIDs, all exact-quote verified. Re-validated with just validate (schema, terms, 41/41), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-environmental-evidence, and a bulk id/label comparison against OLS (0 mismatches of 23 pairs).

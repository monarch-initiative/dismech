  summary: Review CPN deficiency inheritance, mechanisms and clinical evidence
  details: |
    Reviewed the existing CPN deficiency entry before its first REVIEW history event. The inherited disorder is in scope for this campaign; the drug-associated biochemical case is supporting context, not a separate environmental-disease review. Branch was created from and explicitly rebased onto origin/main 11e35ff9f41ce5b2660150213f7ec0ab6bafefcb. No existing history records were changed.

    Source audit: read all six previously cited references, using the full 2009 mouse article and the full 2024 clinical study, including methods, clinical pedigrees, tables and discussion. The 1980 index case and 2004 review remain abstract-level after fetch attempts. The 2003 molecular paper cache advertises HTML full text but contains abstract/landing-page material; the publisher PDF route likewise returned that material, so full-body access is not claimed. Retrieved and read the 2014 drug-case publisher PDF. Retrieved and read the full 2024 corrigendum (PMID:39239323), the full 2025 Hida family report from J-STAGE (PMID:40175265 itself has no available abstract), and relevant diagnostic, mechanistic, treatment and family-screening sections of the full 2025 international consensus (PMID:40053270). The 2025 correspondence PMID:39974309 and reply PMID:39974307 were checked for interpretation; they are not independent cohorts. Retrieved and read the abstract of the 2022 vascular-leakage mouse study (PMID:34626062); its attempted publisher full-text route was unavailable. PMID:7593646 likewise exposed a duplicated abstract under its HTML-full-text marker; a separate publisher PDF supplied the complete 1995 methods, results and discussion, which were read. The full-PDF caches are preserved, including when evidence quotes use the cleaner PMID abstract.

    Corrected inheritance and variant interpretation: the 2024 families include homozygous p.Gly178Asp, not exclusively compound heterozygotes; the 2025 heterozygous p.Thr245Met pedigree suggests possible dominant inheritance without establishing allele sufficiency. The p.Glu194= splice effect is predicted, not confirmed by patient RNA. Proposed XPNPEP2 regulatory and KLKB1/F12 modifiers remain knowledge gaps, without asserting measured expression effects or oligogenic causation. Applied the corrigendum identifying two asymptomatic relatives and correcting pedigree annotations. Removed unsupported phenotype-frequency bands, keeping the nearly 60% urticaria observation explicitly episode-based. Retained asthma as an uncertain single-patient association without a causal edge.

    Corrected peptide physiology: des-Arg kinins can signal through B1 receptors and C5a-desArg retains reduced receptor affinity, so cleavage does not make all products inert. Preserved the partial human deficiency versus complete mouse knockout distinction and challenge dependence. Added the vascular-leakage study and the purified-CPN cell-binding model; the 1995 CPN clot-lysis result was negative, unlike that for plasma carboxypeptidase B. Added separate hypothetical plasminogen-binding and kinin-generation nodes, with patient kininogen cleavage and treatment responses described as compatible observations rather than proof of all intermediates. Removed the mitochondrial/calcium discussion: the research artifact's source concerns calpain 1 abbreviated CPN1, not carboxypeptidase N (confirmed directly against PMID:31411917). This was a wrong-protein import, not a superseded CPN mechanism.

    Expanded clinical evidence: included incomplete icatibant response, tranexamic-acid failure and acute/prophylactic plasma-derived C1-inhibitor benefit in the 2025 patient. Montelukast was used in two families as combined therapy, with no isolated efficacy estimate. Removed unsupported montelukast/H1-blockade-to-histamine-release edges. The 2014 multiple-enzyme drug case neither establishes a CPN1 genotype nor provides predrug CPN activity; drug withdrawal is scoped accordingly. Added assay-versus-protein distinctions, complement testing, cautious variant interpretation, differential diagnoses, family counseling and individualized follow-up. The 2024 assay-specific reference ranges exist, but no universal diagnostic threshold is inferred. Literature family counts and selected-clinic screening yield are not population prevalence or penetrance estimates.

    Deep-research completeness audit: read the matching genuine Perplexity report and citation companion and checked central claims against primary cached sources. Phenotypes: adequate after frequency corrections; abdominal, laryngeal, skin and biochemical manifestations represented. Subtypes: N/A; no established separately mapped subtypes, and proposed inheritance differences remain uncertainty. Pathophysiology: adequate after adding explicitly hypothetical kinin-production nodes and separating cellular, mouse and human evidence. Treatments/trials: adequate for disease-specific reports, now including C1 inhibitor; broader HAE drugs lack CPN-specific trial evidence. An official ClinicalTrials.gov CPN1/carboxypeptidase-N query returned unrelated adrenal studies, with no eligible trial imported. Genetics: adequate, with genotype classes, corrected segregation and modifier uncertainties. Biomarkers/diagnosis: adequate with enzyme activity, C1-inhibitor testing and genetic interpretation. References: central verified papers and accessible full texts consumed; no disease-specific GeneReviews or StatPearls chapter in the offline Bookshelf index. Overall: central omissions repaired; speculative lifespan, high penetrance and wrong-protein mitochondrial claims were not imported.

    New evidence titles were checked against cache metadata and study relevance, with human observations, animal experiments, in-vitro experiments, computational splice predictions and synthesis kept distinct. Validation passed for schema, terms, all 92 evidence snippets and 103 titles. The shared consensus-reference consumer Hereditary Angioedema also passed (255 snippets across both entries). Offline reference, snippet, entity, causal-target, qualifier, coarse-phenotype, enum, duplicate-key and cache checks passed; gene activity grounding passed against origin/main. CPN1 is linked to a molecular-function-bearing activity node. Five of six phenotypes have supported causal inlinks; asthma remains unwired because its causal relationship is unresolved. The page rendered and all applicable pre-commit checks passed.

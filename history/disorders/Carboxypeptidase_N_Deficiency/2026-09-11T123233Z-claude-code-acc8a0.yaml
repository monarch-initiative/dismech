  summary: 'Create: Carboxypeptidase_N_Deficiency'
  details: |
    De novo curation of carboxypeptidase N deficiency (MONDO:0008910, CPN1) from a Perplexity sonar-deep-research report plus independent PubMed retrieval.

    Deep research: research/Carboxypeptidase_N_Deficiency-deep-research-perplexity.md (perplexity, sonar-deep-research, 355.8 s, 17 citations). The run only completed after the installed deep-research-client Perplexity provider was patched locally to stream; the unpatched non-streaming POST is dropped at 300 s in this environment. That is the already-open dismech#9357, so no new issue was filed and no repository file was changed to work around it.

    The report was used for the causal chain and for the ACE-inhibitor interaction, not for identifiers. Its own term_validation reports 13 of 31 checked labels mismatched, including HP:0001873 offered as 'Angioedema' (HPO: Thrombocytopenia), HP:0011121 as 'Urticaria' (Abnormal skin morphology), NCIT:C82474 as 'C1 Esterase Inhibitor' (Egg Laying) and CL:0000761 as 'Basophils' (type 9 cone bipolar cell). No CURIE was taken from the report; every term in this entry was looked up against OLS or the committed caches in the same step it was written. Its reference_validation resolved only 5 of 17 citations because the rest are bare URLs, so all PMIDs here were found by independent PubMed search.

    Evidence: 32 snippets across 6 PMIDs, all exact-quote verified against references_cache. Human evidence is thin by nature of the disease (index family 1980, molecular characterisation 2003, four-family series 2024, one iatrogenic case 2014); the only complete-deficiency data are from the Cpn1-null mouse and are graded MODEL_ORGANISM throughout, including on the antihistamine treatment entry, which is not presented as established human therapy.

    Judgement calls recorded in the entry rather than left implicit: no conforms_to was declared (complement_dysregulation was read and rejected because complement activation itself is normal here); no reference_ranges block was written for plasma carboxypeptidase N activity because both sources report it as a percentage of their own laboratory median; two diagnosis term bindings are broader than the act they describe because NCIT has no measurement term reachable from Clinical Intervention or Procedure, and that is stated in notes rather than hidden.

    Validated with just validate (schema, terms, 32/32 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-reference-titles, check-title-snippets.

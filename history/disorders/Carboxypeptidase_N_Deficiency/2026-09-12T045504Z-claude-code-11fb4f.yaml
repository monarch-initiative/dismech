    - Asthma moved from category Immunologic to Respiratory, matching how this entry already files Laryngeal edema.
    - The environmental entry 'Hormonal and physical triggers of attacks' is renamed 'Hormonal triggers of attacks'. The physical trigger it was named for moved to its own Cold exposure entry last round, so the name had become a signpost pointing at the wrong entry.

    Not changed: onset and diagnostic delay remain uncurated. The reviewer independently checked the table-only reasoning against PMID_38445235.md and confirmed Table I extracts as one unbroken run of concatenated cells with no sentence boundaries, so those figures still cannot be quoted propositionally.


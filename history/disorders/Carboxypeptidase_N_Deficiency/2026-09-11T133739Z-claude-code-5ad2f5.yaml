  summary: 'Review round 2: urticaria frequency anchor, cold exposure, two ECTO rebinds'
  details: |
    Second review round on PR #11682, acting on the full review body rather than its summary.

    Corrections to my own earlier work:
    - I had replied on the PR that no quotable urticaria frequency figure existed. That was false; PMID:38445235 states 'An urticarial rash accompanied nearly 60% of symptomatic episodes of angioedema.' Added as the quantitative anchor for the FREQUENT band, with the explanation noting the denominator is episodes, not patients.
    - The environmental review_notes claimed cold and pressure triggers appeared only in Table I and so could not be quoted. Wrong for cold, which the paper states in prose. Added a separate 'Cold exposure' environmental entry bound to ECTO:0001057 (exposure to decreased temperature) with an influences_mechanisms link (TRIGGERS, INDIRECT_UNKNOWN_INTERMEDIATES) to Mast Cell Histamine Release. review_notes rewritten to record the earlier error and to keep pressure/fatigue's table-only status visible.
    - The hormonal exposure was bound to ECTO:0000509 (exposure to drug), far broader than the claim. Rebound to ECTO:9000010 (exposure to estrogens) and the preferred_term/description rescoped so triptorelin is named rather than covered by the binding.

    Stronger quotes substituted for weaker ones:
    - Icatibant: the authors' cross-family summary, which is also what makes the response mechanistic evidence for bradykinin rather than only therapeutic.
    - Antihistamine REFUTE: the authors' conclusion that symptoms in these families do not respond to H1 antihistamines and that HAE prophylaxis must be adapted, generalising beyond the single-proband failure already cited.

    Validation: just validate (schema clean, terms clean, 46/46 snippets verified); an OLS bulk label check over all 25 CURIE/label pairs (0 mismatches); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-environmental-evidence all clean.

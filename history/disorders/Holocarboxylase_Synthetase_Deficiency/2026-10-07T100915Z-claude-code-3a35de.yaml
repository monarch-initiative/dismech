  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    LOINC tranche A batch 5 (issue 13642). The entry had no diagnosis section; added one newborn-screening row (NCIT:C81178) with the measurement bound to LOINC:50106-4 (3-hydroxyisovalerylcarnitine C5-OH in DBS, method-less quantitative DBS code). One reference range on that code with a 0.6 umol/L upper threshold: the Shanghai Xinhua Hospital newborn-screening centre HLCS cohort (PMID:36890565, 2006-2021) reports a C5-OH reference range of 0.06-0.6 umol/L and that every patient was far beyond the cutoff, and a Chinese MS/MS neonatal-screening series (PMID:25190158) states its C5-OH cut-off as <0.6 umol/L. Row evidence from PMID:40937535 (Dutch C5-OH screening for 3-MCCD, HMGCLD and HLCSD), PMID:36890565 (DBS acylcarnitines and ratios, confirmatory urine pattern, one screen-missed case) and PMID:37994125 (MCD among C5-OH disorders in a Shanghai series). The C5-OH/C3 ratio is not bound because the Monarch KG searches returned no code. On the biochemical C5-OH marker, loinc_term bound to the Part LOINC:LP19309-1. Labels seeded by just loinc-seed-cache; validate, validate-terms, count-verified-snippets, validate-disorders, check-duplicate-keys, check-entity-refs and check-snippet-grading all pass.

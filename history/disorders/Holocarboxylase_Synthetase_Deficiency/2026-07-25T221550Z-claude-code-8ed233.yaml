  summary: 'Address code review: two band errors, snippets omitting their figures,
    conformance placement, two omitted phenotypes'
  details: |
    Addresses the code review on PR #7002. All four items were correct.

    Two prevalence_class values contradicted their own rates (item 1). Japan at
    rate 1.0 was banded BAND_1_9_PER_1000000 when 1.0 per 100,000 is
    BAND_1_9_PER_100000; China at 0.107 was banded BELOW_1_IN_1000000 when the
    schema reserves that for under 0.1. Both corrected.

    This is the third band error of this review sweep - after the Citrin Korean
    record (#6991) and the Beta-Ketothiolase Huaihua record (#6966) - which makes
    it a process failure rather than three slips. I was eyeballing the tier from
    the "1 in N" phrasing instead of computing it from rate_per_100000. For this
    fix I imported the repo's own _band_from_rate from
    scripts/migrate_prevalence.py and ran every rate through it, which is what I
    should have been doing from the start.

    The reviewer's observation that this INVERTS the PR's framing is the more
    interesting point: correctly banded, Japan sits a full band above the other
    two, which strengthens rather than weakens the geographic-outlier claim the
    record was making.

    Snippets omitted the figures they were cited for (item 2). All three
    prevalence snippets stopped before their numbers - "The worldwide overall
    incidence of" supports no numeric claim at all. I had justified this by the
    PDF's hyphenation, but that only applies to the Japanese sentence; the other
    two wrap on plain newlines, and the validator contract is
    whitespace-normalized with ellipsis splitting available. Rewritten to carry
    the figures: the worldwide and Japanese snippets now quote through the
    number directly, and the Chinese one uses an ellipsis split across the line
    break. Verified the ellipsis form validates.

    conforms_to mis-assignment (item 4). Multiple carboxylase deficiency carried
    #Toxic Metabolite Accumulation and Energy Deficit, but MCD IS an enzymatic
    block - it is the loss of four carboxylase activities, and its descriptors
    carry no accumulation or energy-deficit semantics. Moved to Impaired
    propionate metabolism, which is the node that actually documents metabolite
    accumulation. The other three edges were correctly placed.

    Two quantified phenotypes omitted (item 3). Both clear the >10%-with-an-HPO-term
    threshold and neither was a judgement call:
    - Diarrhea, 37.5% (9 of 24) - the third most common presenting symptom, and
      literally inside the Vomiting snippet this PR added. Adding the snippet
      without reading the figure next to it is a poor showing.
    - Coma, 20.8% (5 of 24) - previously present only as prose inside the
      Lethargy description, despite being both quantified and a materially
      different severity.
    The previous round's claim that the remaining phenotypes were "left unbanded
    rather than guessed" was right as a principle but wrong about these two:
    they were quantified in the same sentence, not guesses.

    Validation. Schema, term and reference validation all pass.

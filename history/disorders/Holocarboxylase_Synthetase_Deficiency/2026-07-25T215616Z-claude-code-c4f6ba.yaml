  summary: 'Review: cite uncited prevalence figures from newly-fetched full text,
    add cohort frequencies and module conformance'
  details: |
    Review of the ninth-oldest unreviewed disorder entry (creation_date
    2025-06-12).

    Uncited prevalence, now fully sourced (the principal finding). The prevalence
    section was one record with no population, no measure_type, no
    prevalence_class and no evidence, asserting three geographic figures in a
    single free-text sentence: about 1/200,000 worldwide, 1/100,000 in Japan and
    1/930,600 in China.

    Unlike the comparable cases earlier in this review sweep, all three turned
    out to be verifiable - but only after fetching full text. PMID:36890565 was
    abstract-only in the cache and its abstract contains no epidemiology;
    re-fetching pulled the full text, whose introduction states all three figures
    with their own citations. The worldwide figure is independently corroborated
    by PMID:32841162, which was already cached and already cited elsewhere in the
    entry.

    Split into three structured records with the correct bands. Recording them
    separately makes the geographic spread legible in a way the single sentence
    did not: Japan is roughly twice the worldwide rate and about ninefold China,
    which is a real and notable difference rather than measurement noise.

    A quoting note: the source is a PDF whose text layer hyphenates and wraps
    across the figures ("vom -\niting", "more fre -\nquently"), so the snippets
    are deliberately short and stop before the wrap. Each explanation states the
    figure the sentence carries, so the short quote does not hide the claim.

    Phenotype frequencies added. All seventeen phenotypes had no frequency at
    all. The same newly-fetched full text reports quantitative frequencies for a
    28-patient cohort, and five phenotypes are now banded from it: skin lesions
    66.7%, vomiting 62.5%, respiratory distress 29.2%, drowsiness 29.2%, seizures
    12.5%. Each carries the cohort percentage in its notes and its own evidence
    item.

    The seizure figure is worth flagging: at 12.5% it is markedly lower than the
    prominence the untreated-disease literature implies, and the band is
    OCCASIONAL rather than the FREQUENT a reader might expect. The same source
    records that seizures were the INITIAL symptom in three patients, so low
    overall frequency does not mean low diagnostic importance - that is stated in
    the phenotype notes so the band is not misread.

    Two mappings are approximate and say so: drowsiness is banded on the Lethargy
    phenotype, and respiratory distress on Tachypnea (respiratory distress in this
    disorder being the compensatory response to metabolic acidosis). The
    remaining twelve phenotypes are left unbanded rather than guessed.

    Module conformance added, and here it genuinely fits. Four conforms_to edges
    to metabolic_intoxication_decompensation spanning the full chain - Enzymatic
    Block on the HLCS node, Toxic Metabolite Accumulation on multiple carboxylase
    deficiency, Acute Metabolic Decompensation on secondary organic acidemia and
    ketotic decompensation, and Acute Metabolic Encephalopathy on neurologic
    metabolic decompensation - plus biological_scale tags. Unlike the two entries
    immediately before this one in the sweep (D-2-HGA and GAMT deficiency, where
    the module was withheld and the reason recorded), HCSD is a textbook
    intoxication-type inborn error: it has catabolic-stress-triggered
    high-anion-gap acidosis, ketotic decompensation, hyperammonemia and
    hypoglycemia, all already modelled as nodes in this entry.

    Validation. Schema, term and reference validation all pass.

  summary: 'Create: Spermatogenic Failure 95 (CFAP57)'
  details: |
    New entry for SPGF95 (MONDO:0975747), autosomal recessive MMAF caused by CFAP57. Deep research with the claude_code provider (research/Spermatogenic_Failure_95-deep-research-claude_code.md; preflight-dr matched CFAP57) was used as leads only; PubMed search added the 2025 Chinese families (PMID:41466333), the 2026 Emirati family (PMID:41793497), the PCD report (PMID:32764743) and the DNAH10-CFAP57 interaction (PMID:40898283). Pathograph: loss of long-isoform CFAP57 (GO:0045504 dynein heavy chain binding, DECREASED) -> inner dynein arm assembly failure and MYH10/IFT88 mislocalization -> MMAF -> phenotypes. Divergent sperm ultrastructure between reports is stated on the MMAF node. Hypothesis on isoform specificity: long-isoform truncations give isolated MMAF, the exon 11 shared-region allele gave PCD (ClinGen Limited for PCD, cited as REVIEW_SYNTHESIS; no tier recorded for SPGF95 because ClinGen has not curated this pair), with a weak REFUTE item for one unexamined breathing complaint. Mouse model with SPECIES_MISMATCH divergence (oligozoospermia and disorganized axoneme in mice). ICSI with one delivery, genetic counselling, exome testing, semen analysis, TEM. No GeneReviews/StatPearls chapter. Stub deleted. Validated with the same gates as the companion entries.

  summary: 'Create: Schimke immuno-osseous dysplasia (SMARCAL1)'
  details: |
    De novo curation of SIOD (MONDO:0009458, SMARCAL1, AR). Pathograph built as an atomic chain: SMARCAL1 annealing-helicase deficiency (MOLECULAR, GO:0036310, genetic_context LOSS_OF_FUNCTION) leading to replication stress/genome instability (CELLULAR), fanning into four arms: impaired chondrogenesis to SED/short stature; podocyte injury to FSGS to steroid-resistant nephrotic syndrome to ESRD; thymic T-cell development failure (IL7R promoter hypermethylation) to T-cell lymphopenia and recurrent infections; defective elastogenesis to premature atherosclerosis and cerebral ischemia; plus an NHL-predisposition edge. 17 HP-bound phenotypes with sourced frequencies. Treatments: kidney transplantation (NCIT:C15265), minimized post-transplant immunosuppression, HSCT (historical 1/5 survival under myeloablative conditioning), sequential haploidentical HSCT+kidney transplantation (NEJM 2022), supportive care. Classifications: Harrisons GENETICS_ENVIRONMENT_DISEASE + KIDNEY_URINARY_TRACT; IUIS 2022 combined immunodeficiency with syndromic features (Table 2 row quoted from the PMID:35748970 cache); ISDS 2023 group 13 spondylo_epi_metaphyseal_dysplasias. All 21 PMIDs verified via PubMed E-utilities before fetching; no deep-research provider run (PubMed-first per task spec). Prevalence anchored to PMID:40004207 (about 1 per 1-3 million live births); ORPHA:1830 verified as MONDO xref but the Orphadata pinned-manifest refresh failed on upstream checksum drift, so no structured ORPHA evidence. Validated: just validate, count-verified-snippets 98/98, validate-terms, check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, and batched just validate-disorders - all passing. supports PARTIAL avoided per retired-enum guidance.

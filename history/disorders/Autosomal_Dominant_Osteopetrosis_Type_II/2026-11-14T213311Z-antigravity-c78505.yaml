  summary: Review and enrich Autosomal_Dominant_Osteopetrosis_Type_II
  details: >-
    Added MONDO and Orphanet synonyms and cited/mined the CLCN7-Related Osteopetrosis GeneReviews baseline (PMID:20301306). Enriched classifications with ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE, and isds_skeletal_category osteopetrosis_and_related (PMID:36779427), added variable expressivity on inheritance, removed deprecated prevalence fields and added the Orphanet Worldwide point-prevalence estimate alongside the Danish cohort rate, added an upstream germline dominant-negative Heterozygous CLCN7 Missense Variant lesion node with GO molecular_functions while preserving the locked CLCN7 Dominant Negative Chloride Channel Dysfunction node, bound GO/CL/UBERON terms and cached evidence on all 19 downstream phenotype edges, added a biochemical section for serum TRAP5b and serum CTX/urinary NTX bone-turnover markers (DOI:10.1093/jbmr/zjaf123), added phenotype categories and repaired two non-verbatim snippets, consolidated duplicate CLCN7 genetic rows with ClinGen Definitive gene_disease_validity, added skeletal radiography/DXA/genetic diagnosis entries, and bound specific NCIT treatment procedures (including Blood Transfusion NCIT:C15192), therapeutic agents, and modalities.

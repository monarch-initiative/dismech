  summary: Add gut-microbiota/checkpoint-response KNOWLEDGE_GAP discussion
  details: |
    Added one KNOWLEDGE_GAP discussion (gap_mrcc_gut_microbiota_checkpoint_response) on whether gut microbiota composition causally determines checkpoint inhibitor response. The anchor is the CBM588 randomized phase 1 trial (PMID:35228755), where progression-free survival differed markedly (12.7 vs 2.5 months) while the microbiome primary endpoint went unmet -- a benefit whose proposed mediator did not move, leaving unmeasured-mediator, microbiota-independent, and chance explanations unseparated. Attached to the checkpoint-sensitivity and immune-evasion nodes and to the ICI combination treatment. Attached here rather than to Renal_Cell_Carcinoma because checkpoint sensitivity and ICI therapy are modeled in this entry and the randomized evidence is in treatment-naive metastatic disease. Proposed experiment is powered for causal mediation with a heat-inactivated control arm. No causal edge from a microbiota node was added. Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets over the three edited files reported 77/90 verified, 13 skipped by prefix (DOI), 0 failures.

  summary: 'Create: Borrelia Miyamotoi Disease'
  details: |
    Created a B. miyamotoi disease leaf under Relapsing Fever, bound MONDO:0958150 and NCBITaxon:47466, curated Ixodes transmission and agent_life_cycle, CbiA-mediated complement evasion, bacteremia and antigenic variation nodes, common surveillance phenotypes, PCR/GlpQ diagnosis, and doxycycline/ceftriaxone treatment evidence. OpenScientist research highlighted the direct CbiA and Vmp mechanistic papers; its automated deep-research preflight fell back because MONDO records no causal human gene for this infectious disease, and the manual entity review matched the intended B. miyamotoi disease throughout. Updated Relapsing Fever so the hard-tick relapsing fever subtype points to this leaf via subtype_term and curated_in.

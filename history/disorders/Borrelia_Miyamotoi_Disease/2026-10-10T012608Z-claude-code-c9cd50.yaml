  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Extended the existing PCR with GlpQ serologic support row with two measurements: LOINC:101749-0 (B. miyamotoi DNA presence in blood by NAA with probe detection; the KG has no method-less or molecular-genetics-method DNA code) and LOINC:93871-2 (method-less B. miyamotoi IgG+IgM antibody interpretation; LOINC has no GlpQ-specific antibody code). Added evidence from the Molloy case series PMID:26053877 (rGlpQ antibody in 16 percent at presentation, 78 percent in convalescence; PCR on blood confirms seronegative acute cases) and from the Krause review PMID:25700888 (standard two-tier B. burgdorferi serology met seropositivity criteria in 10 percent of infected patients; GlpQ antibody distinguishes relapsing fever from Lyme disease), and said so in the row description. No reference_ranges: qualitative results.

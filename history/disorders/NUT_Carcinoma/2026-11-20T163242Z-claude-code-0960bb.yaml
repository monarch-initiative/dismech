  summary: An immune-cold tumour, PD-L1, and checkpoint inhibitors
  details: |
    Adds the tumour's immune picture and what immune checkpoint inhibitors have done. Two
    pathophysiology nodes: Low Tumour Mutational Burden and Microsatellite Stability (the
    registry's median 1.0 mutation per megabase with no microsatellite instability; all 16
    microsatellite-stable cases in the immune-biomarker review's pooled analysis of thoracic and
    head and neck cases; none of the tumours tested at 10 or more per megabase in a sequencing
    study; whole-exome burdens in two patients), with an edge to Immunologically Cold Tumour
    Microenvironment whose evidence is graded indirect, because the immune-biomarker review
    infers the label from biomarkers rather than showing a mechanism; the same review's
    restatement of a computational prediction that peptides spanning the fusion junction could
    be presented by some HLA-C types is recorded against the step. The cold node carries the
    review's inference, the registry's description, the sequencing study of 54 tumours with
    significantly lower immune cell infiltration than head and neck and lung squamous
    carcinomas, and, against the label, its significantly higher B cells and monocytes and a
    six-tumour study that found cytotoxic T cells, macrophages and tertiary lymphoid structures;
    its notes name the second comparator study (neutrophils in a sinonasal series) and a mouse
    model's down-regulated immunostimulatory genes. A histopathology row, PD-L1 expressed in a
    minority of tumours: 16 of 73 registry cases at 1% or more, 18 of 78 in the review's pooled
    analysis, 8 of 33 in that paper's own institutional cohort with none at 50% or more, 12 of
    47 in the sequencing study, 7 of 16 in a head and neck series, two of three in a whole-exome
    study, none in a pulmonary series of six or a 57-case series, the antibodies used, and no
    significant difference by fusion partner. A treatment row, Immune checkpoint inhibition
    (NCIT:C131060 Checkpoint Blockade Immunotherapy, with the checkpoint-inhibitor class and
    eight agents as therapeutic agents: those the cited sources name as given in this disease),
    carries the state of the evidence (largely case reports, series and retrospective cohorts,
    no randomised data); the reported responses, including two published reports that two
    papers' tables record differently (nivolumab with or without chemotherapy, a second
    patient's partial response or progression, and the patients' sex and primary site), each
    version quoted from its table; a German cohort's tendency to longer survival when an
    inhibitor was added to first-line chemotherapy; and the failures, including the
    immune-biomarker review's summary that most published cases show primary resistance or rapid
    progression, and, in an exploratory analysis of the sequencing study, similar survival with
    chemoimmunotherapy and with chemotherapy alone. Apart from toripalimab and the inhibitor
    class, the bound agents were already in the NCIT label and chemical-entity enum caches.
    Cemiplimab is not bound, because no cited source reports a patient given it. A trial record,
    NCT07050186, adds the recruiting phase 2 trial of cemiplimab; its phase is in the cached
    summary, and its recruitment status was read from the ClinicalTrials.gov record and
    confirmed with just clinicaltrials-status-audit. The treatment row is not linked to a
    mechanism node, and the entry notes' count of treatment rows without a target_mechanisms
    link becomes four of six. Sentences elsewhere that were untrue or loose are
    corrected: the chemotherapy row's notes now say which further agents the
    checkpoint row's sources name, the overall-survival phase lists the new site-specific
    medians, the fusion node's notes say that no cached source shows the cell of origin in a
    patient and name what the sources do say, the Ewing-regimen and vorinostat sentences are
    scoped to what the sources report, and the transcription-factor knowledge gap cites, as
    prose and as an evidence item, a study stating that p63 and MYC are required for the growth
    and the blocked differentiation of NUT carcinoma cells. Eleven references are cached for the
    first time; toripalimab and the checkpoint-inhibitor class add one row each to the NCIT
    label and chemical-entity enum caches, and the treatment term one row each to the NCIT label
    and treatment-action enum caches. Left out: the international NUT carcinoma guideline, whose
    full text covers the whole disease and would make several older sentences about what the
    cached sources contain untrue (on BET inhibitor trials, the cell of origin, vorinostat and
    Ewing-type regimens), so it belongs in a pass over the whole entry; the BET-inhibitor and
    PD-L1 interaction work, which is in other cancers or animals; and the sequencing study's
    figures for BET inhibitors and its suggestion that MYC and the loss of MHC class I explain
    the low infiltration, which belong to the BET row and the mechanism. Validated with just
    validate, count-verified-snippets and the pre-PR gates.

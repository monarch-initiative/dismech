  summary: Link the BET and HDAC rows to the steps they act on
  details: |
    The entry had no target_mechanisms on any of its five treatment rows, so every drug rendered beside the pathograph rather than in it. Four links added, on the two mechanism-directed rows.

    BET bromodomain inhibition links to two nodes. To NUTM1 Rearrangement, INHIBITS: that node already records chromatin binding by the fusion protein's bromodomain half as its molecular function, GO:0003682 with modifier GAIN_OF_FUNCTION, which is exactly what the drug class blocks, so the link is to the lesion node because the drug acts on the fusion protein itself. The evidence is the OTX015 compassionate-use paper's own significance sentence, which names BRD4-NUT as what is targeted - that is what makes it a mechanism link rather than an outcome association. And to Block to Squamous Differentiation, INHIBITS, on the NSD3-NUT cell-line result reporting that bromodomain inhibitors induce differentiation; the cells carry a variant fusion, so the effect is not BRD4-partner-specific, and the item is graded IN_VITRO.

    Histone deacetylase inhibition links to Global Hypoacetylation with Local Hyperacetylation, RESTORES, and to Block to Squamous Differentiation, INHIBITS. One sentence of PMID:21447744 carries both halves - the acetylation restoration and the differentiation it engages - so it is quoted on the acetylation node as DIRECT, where the same sentence already sits on the differentiation node as INDIRECT. The in vivo half, three xenograft models with growth inhibition and a survival benefit, is quoted on the differentiation link and graded MODEL_ORGANISM.

    INHIBITS rather than RESTORES on both differentiation links, because the node is the block rather than the differentiation: the drug inhibits the node. The link descriptions say so, so the choice is readable rather than inferred.

    NCIT:C1946 Histone Deacetylase Inhibitor added as a second therapeutic_agent beside CHEBI:45716 vorinostat. The row's in vitro work used the class and its single patient received vorinostat, so both belong. The term was read from cache/ncit/terms.csv and is already a member of the chemicalentityterm enum cache, so it validates offline with no new cache row.

    Three decisions recorded in notes rather than left as silence. Surgical resection, radiotherapy and conventional chemotherapy get no link: every cached sentence about them is an outcome association - extent of resection and initial radiotherapy as independent survival predictors, no chemotherapy regimen associated with improved outcome - and an outcome association does not say which mechanism a treatment acts on. No resistance claim is curated: the only cached sentence pairing BET proteins with resistance is a trial report's framing line about BET proteins driving resistance to other agents, and citing it for resistance to BET inhibitors would invert it. And two figures in circulation do not survive a check against the cached abstracts - the 11% quoted for molibresib is its dose-limiting-toxicity rate rather than a response rate, where the response figure in the same abstract is four of nineteen; and that trial's thrombocytopenia figures are over all 65 patients rather than over its nineteen with this disease, for which the abstract gives no separate breakdown. The single child treated with vorinostat is reported only as having an objective response after five weeks, and no cached source says treatment stopped for thrombocytopenia.

    67 snippets verified, up from 63. Terms validated, offline gates green. No pathophysiology, phenotype or diagnosis row touched.

    Review round 1. The HDAC inhibitor to Block to Squamous Differentiation link had one evidence item, the xenograft sentence, graded DIRECT - and that sentence reports growth inhibition and a survival benefit without mentioning differentiation, so the link had no item stating its own claim. The in vitro sentence that does state it is added as IN_VITRO and DIRECT, matching how the same sentence is graded elsewhere in the file, and the xenograft item drops to INDIRECT with an explanation saying what it did and did not measure. That exposed a second defect the round did not name: the acetylation link's explanation said the same sentence was INDIRECT on the differentiation node, a grading that node did not carry because it did not cite the sentence at all. Both explanations now describe what is there.

    The three paragraphs added to notes had been inserted above the paragraph beginning "Beyond those two", whose "those two" names the two unbound phenotypes in the paragraph before it. They are moved below it, so the reference resolves again, and the whole notes field now uses the double blank line separator its other paragraphs already used. The figures paragraph is reworded: it listed three corrections while calling them two, and it now names PMID:32328561 so the molibresib figures can be rechecked without hunting for the trial.

    68 snippets verified. The BET to NUTM1 Rearrangement link is left where it is: the node binds chromatin binding as a gained molecular function and the link's description says the drug acts on what the fusion protein does, so the link is on the activity the node records. If a later row splits the lesion from that activity, the link moves with it.

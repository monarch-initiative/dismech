  summary: The two mouse models, and the transcription-factor requirement gap
  details: |
    The entry had no model section of any kind - no animal_models, no experimental_models, no
    computational_models - and no discussions, although two mouse papers were already cited and
    already committed. This adds the two models and one knowledge gap.

    Two records rather than one. The second paper says only that it used a genetically engineered
    mouse model that faithfully recapitulates human NC; it does not name the strain and does not cite
    the first paper. The two share authors, which is a cached fact, but shared authorship is not
    strain identity, so folding them into one record would assert something no cited source states.

    The first model links to two nodes, both RECAPITULATES. Against NUTM1 Rearrangement the fusion is
    made by engineering the mouse t(2;17) syntenic to the human t(15;19), and it is sufficient to
    produce tumours. Against Block to Squamous Differentiation the tumours are poorly differentiated
    with areas of squamous differentiation and keratinization in variable proportion, which is the
    human pattern - a block to complete squamous differentiation rather than an absence of it - and
    fifty mouse tumours were scored for exactly that by a veterinary pathologist.

    That second link was first written as PARTIALLY_RECAPITULATES with fidelity LOW and a
    BOUNDARY_OMISSION divergence, on the grounds that the report never calls the tumours squamous and
    that the words squamous, keratin and epithelial do not occur in it. That was true of the cached
    abstract and false of the paper, and this repository already held the answer: its own
    deep-research report for this disease quotes full-text strings describing squamous carcinomas
    with keratinization and KRT14 and P63 positivity. The reference was re-fetched as full text, which
    carries squamous four times, keratin five and KRT14 eleven, and the link is re-derived from it.
    The divergence is removed because the lineage is established rather than absent; what remains as
    a limitation is that the scoring covers head-and-neck and skin tumours, the sites a
    basal-keratinocyte driver produces.

    The lesson is the one CLAUDE.md states and I did not apply: a negative-existence claim has to be
    re-run against the source it names, not against the cache standing in for it. An abstract-only
    cache is silence, not a negative answer.

    The second model is a PERTURBS link, not a RECAPITULATES one, because a lineage-specific
    conditional deletion of Sox2 manipulates the transcription-factor node rather than reproducing
    it. Its readout is UNCHANGED, which is a real negative result: tumours still formed, kept their
    histology, and kept expressing BRD4::NUTM1, MYC and TP63.

    No FAILS_TO_RECAPITULATE link anywhere, because no cached sentence says either mouse fails to
    reproduce any facet of the human disease, and that relationship requires evidence. The SOX2
    result is a finding about the biology, not a model failure.

    The knowledge gap is scoped to what the sources leave open rather than to a mouse-versus-human
    mismatch. SOX2 had been proposed as a critical driver and proved dispensable for initiation and
    progression; the authors scope their own conclusion to universality, so a context-dependent
    requirement is not excluded. MYC and TP63 remained expressed in those tumours, so the same
    experiment tested neither. A HUMAN_MODEL_MISMATCH would invert the direction here - the mouse is
    the only in vivo loss-of-function test in the cache, and there is no cached human
    loss-of-function result for it to be mismatched against.

    No genes block on either model. Mouse Brd4 and Nutm1 take MGI identifiers and neither is in
    cache/mgi/terms.csv, so neither can be bound offline.

    71 snippets verified, against 63 on the base branch. Both papers were already committed and
    already cited, so no new reference was fetched. just model-scale-audit sees all three links and
    reports every one as MODEL_ABOVE_TARGET, which needs no caveat - a whole animal contains a
    molecular target. Offline gates green, including check-snippet-grading and
    check-gene-namespaces, neither of which CI runs on a kb-only PR.

    An adversarial pass found a false justification and three places where prose outran its quote.

    The false one was the MGI note, and it was the shape CLAUDE.md warns about: it said binding those
    identifiers would mean writing something nothing in this repository can check. That is wrong.
    just check-gene-namespaces treats an uncached MGI identifier as a failure and
    just check-gene-namespaces-online resolves it through the Alliance API, so the gap is one command
    from closed. The note had quoted the clause about the term validator having no MGI adapter while
    dropping the sentence before it, which names the check that does cover this. A note telling the
    next curator to skip the one check that would close the gap is worse than no note. It now says
    what is true, and it has moved to the record whose genes it is about - it had been parsed onto
    the Sox2 model.

    Three quotes added rather than paraphrased. The RECAPITULATES link's description claimed the
    lesion is sufficient to start the disease, which its single quote does not say; the sentence that
    does is now attached. The squamous limitation rested on a characterisation from a different
    sentence of the same cache, now quoted, and it is scoped explicitly to the abstract, since that
    cache is abstract-only and the silence is the abstract's rather than the paper's. And the
    discussion attributed to the authors a scoping to universality that two other sentences of the
    same abstract contradict - they say dispensable without qualification - so the narrower reading is
    now recorded as this entry's inference from the lineage-specific design.

    One clarification: the UNCHANGED readout direction applies to the measured readouts, not to a node
    one of whose three bound transcription factors is deleted in this model.

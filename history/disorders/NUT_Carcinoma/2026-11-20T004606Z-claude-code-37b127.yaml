  summary: Add chemotherapy agents, chemoradiotherapy and surgery outcomes, and HDAC-inhibitor
    patients
  details: |
    Extends the surgery, radiotherapy, chemotherapy and HDAC-inhibitor treatment rows.
    Conventional chemotherapy binds ten cytotoxic agents, read from cache/chebi/terms.csv:
    cisplatin (CHEBI:27899), etoposide (CHEBI:4911), ifosfamide (CHEBI:5864), docetaxel
    (CHEBI:4672), pemetrexed (CHEBI:63616), capecitabine (CHEBI:31348), cyclophosphamide
    (CHEBI:4027), doxorubicin (CHEBI:28748), 5-fluorouracil (CHEBI:46345) and paclitaxel
    (CHEBI:45863). They are every cytotoxic agent the sources this entry cites name as given in
    this disease, and binding one records that it was given, not that it worked. It adds the NUT
    Carcinoma Registry's regimens among patients treated before diagnosis (PMID:41348986); the
    regimens, further agents and chemotherapy-alone survival, a mean of 5.58 months over 13 of
    16 patients, in a review of published primary pulmonary cases (PMID:36290813), and that
    review's reading that chemotherapy alone lengthens survival to a certain degree, recorded as
    a refutation of the row's negative result, which rests on the clinical database's 54
    patients with outcome data and on the SEER analysis's landmark and time-dependent methods; a
    platinum and capecitabine regimen from the case table of an 18-patient head and neck series
    (PMID:41160255); three sinonasal patients each given cisplatin with doxorubicin,
    5-fluorouracil or paclitaxel (PMID:22534723, cited here for the first time); a review's list
    of agents used with some success, recorded as an indirect refutation because the phrase
    carries no figures, and its statement that responses give way to early progression
    (PMID:35372003); the conclusion of a report from an international symposium on NUT carcinoma
    that standard chemotherapy is only modestly effective in a minority of cases
    (PMID:35417004); the antibody study's background statement that the disease responds poorly
    to regimens designed for carcinomas, and, as a separate indirect refutation, the single cure
    with a regimen designed for Ewing sarcoma that it cites (PMID:19363441, background); and the
    head and neck series' restatement of a larger cohort's 75% response rate to ifosfamide in
    metastatic disease, with its lack of durability and of an overall-survival benefit
    (background). The row's notes say what is bound, that the classes and the immunotherapy and
    targeted agents are not, and that no cited source names carboplatin. Radiotherapy adds the
    pulmonary review's mean survival of 13.2 months with first-line chemoradiotherapy, graded
    indirect, against 5.58 months with chemotherapy alone, a figure quoted on the chemotherapy
    row, and its conclusion that the disease is sensitive to radiotherapy and that
    chemoradiotherapy was the most efficient regimen; the notes say the comparison is of means
    across case reports with no test of the comparison, that no cached source says why patients
    received chemoradiotherapy, and that some first-line treatment was given for a misdiagnosed
    disease. Surgical resection adds the head and neck series' finding of no statistically
    significant association between survival and treatment modality, graded as an indirect
    refutation; every patient in that series had radiotherapy, so the result says nothing about
    radiotherapy itself. Histone deacetylase inhibition is described as preclinical plus one
    patient described in a cited primary study, with the xenograft result stated as growth
    inhibition and a survival benefit from HDAC inhibitor differentiation therapy. It adds the
    pulmonary review's six later-line patients given BET or HDAC inhibitors, the classes not
    separated and no significant benefit, recorded as an indirect refutation of the benefit the
    row records, and a dataset paper's background remark, citing other reports, that HDAC
    inhibitors have been used clinically with anecdotal tumour regression (PMID:37747726). The
    BET-inhibitor row now calls PMID:35417004 the report of an international symposium on NUT
    carcinoma rather than a consensus review, in its description and in one explanation. Outside
    the treatment rows four passages change: the progression survival note keeps the cached
    cohorts apart and adds the pulmonary review's 4.4-month and the head and neck series'
    12-month medians; the entry-level note on the treatment rows says the cached sentences
    report outcomes, responses or use, none of them a mechanism; the resistance paragraph says
    no claim of resistance to BET or HDAC inhibitors is curated, because the four cached
    sentences that pair therapy resistance with these drugs or their targets frame their papers'
    questions or restate other work; and the review_notes provenance sentence now refers to the
    bound identifiers and adds the HP, CHEBI and NCBITaxon caches, which the presenting-features
    change also needs. Validation: just validate passes, all 138 snippets verify, and the
    targeted gates pass.

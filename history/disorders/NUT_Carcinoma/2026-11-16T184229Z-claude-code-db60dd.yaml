  summary: 'Review round 1: stale explanation, MGI gene bindings, one regrade'
  details: |
    Answers the review on PR #18294. Blocking item: the last evidence item on the Block to
    Squamous Differentiation link carried an explanation left over from an earlier draft. It
    said the report 'names no lineage' and referred to 'the typed divergence', but the link's
    two sibling snippets both name the squamous lineage, and the file has no divergences block:
    the link was re-derived to RECAPITULATES, without one, after the full-text re-fetch and
    before the PR was opened. As written one evidence item argued for the reading the rest of
    the link rejects. Rewritten to describe what the quoted sentence carries - the consistency
    of the poorly differentiated phenotype across the model, which the authors read as strong
    reprogramming activity of the fusion. It stays INDIRECT because poorly differentiated names
    no lineage; the squamous lineage comes from the sibling items. Two suggestions taken in the
    same push. The GEMM record's notes field explained why no genes block existed and then
    instructed the next agent on which recipe to run, which is the agent-facing register
    CLAUDE.md rules out; rather than trim it, the gap it described is now closed. Mouse Brd4 and
    Nutm1 were resolved from NCBI Gene (NCBIGene:57261 and NCBIGene:213765) and their MGI
    cross-references read out of those records as MGI:1888520 and MGI:2661384, then confirmed by
    just check-gene-namespaces-online, which wrote both rows to cache/mgi/terms.csv. The note is
    replaced by the genes block itself. Second, the BACKGROUND quote stating that SOX2's role
    had not been investigated in vivo was graded MODEL_ORGANISM; a sentence asserting the
    absence of in vivo evidence describes no animal study, so it is now OTHER with quote_role
    unchanged. Deep-research follow-ups the review listed (human cell lines, luciferised
    xenografts, the PER-403 HDAC-inhibitor RESCUES link, Pdx1-Cre dissemination) are left for
    separate rows. The round was drafted on 16 Nov and finished on 20 Nov; in between, main was
    merged into the branch twice on GitHub, and the push that carries this round merges main
    again.

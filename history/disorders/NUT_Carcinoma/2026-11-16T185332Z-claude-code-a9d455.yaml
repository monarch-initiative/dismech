  details: |
    Answers the review on PR #18292, which raised three blocking items. First, the NUT-rearranged sarcoma row's note gave this repository's MONDO term cache as its basis for saying no class exists. That cache holds only CURIEs something in kb/ has already bound, so its silence is not a negative answer - the same error the PR fixed on three other rows and left on this one. The note now records the search actually run against the local MONDO build dated 2026-10-21, both queries and what each returned: labels and synonyms containing NUTM1 return only MONDO:0975864 B-lymphoblastic leukemia with NUTM1 rearrangement, and labels containing NUT return no carcinoma class but MONDO:0005563, which this entry holds, and two obsolete duplicates of it. Second, the SMARCB1 row's second distinguishing feature cited a variable squamous immunophenotype as separating that entity from this one, but the sentence in the SWI/SNF review contrasts SMARCB1-deficient tumours with SMARCA4-deficient ones, and a source cited on this entry's own squamous cell carcinoma row argues that NUT carcinoma is itself a squamous cell carcinoma. The feature is now recorded as shared rather than discriminating. Third, an explanation ended with a sentence about what an earlier draft of this PR had quoted, which is session narration rather than a fact about the evidence; it is deleted. One suggestion taken, and then corrected before the push. The sinonasal undifferentiated carcinoma row had only the absence of a NUTM1 rearrangement as a discriminator, so the IDH2 axis was added from the review already on that row. The pre-push adversarial pass found that this re-committed, on another row and from the same abstract, the named-entity-scope defect the first blocking item fixed. The quoted sentence reads 'all studied cases lacked oncogenic IDH2 mutations characteristic of genuine SNUC', and 'all studied cases' resolves through the preceding sentence to the four SWI/SNF-deficient sinonasal tumour types; the next sentence names NUT carcinoma among the entities those four must be separated from, and this entry's own histopathology records BRG1 and INI1 retained in all cases, so it cannot be one of them. The feature now records the IDH2 mutations as a positive feature of the other entity and states plainly that no cited source reports IDH2 status in this carcinoma. Three further corrections went into the same push. The new MONDO note dated the build by its download, 2026-10-21, where the build's own owl:versionIRI is the 2026-09-01 release; it now gives both, and names the further spellings searched, since the two queries first recorded would not have found a class worded 'nuclear protein in testis sarcoma'. The SMARCB1 row's own negative-existence claim still rested on another dismech entry rather than on a search, and is now re-based on the same build. And the squamous row's explanation said the cited argument is that the two are one entity, where the paper argues subsumption - a subtype of squamous cell carcinoma. Two corrections to the previous round's records, recorded here because history records are append-only. The earlier history record said five differential rows bind a MONDO class and one does not; four bind and two do not, the unbound pair being SMARCB1-deficient sinonasal carcinoma and NUT-rearranged sarcoma. The PR body said two rows carry a REFUTE item; after the second commit only the squamous cell carcinoma row does.

  summary: Add presenting features by site and early spread
  details: |
    Adds two pathophysiology nodes and five presenting-symptom phenotypes. Rapidly Enlarging
    Primary Mass: Orphanet's definition of a rapidly growing mass usually arising along the
    midline and its statement that presenting symptoms come from mass effect depending on the
    location (ORPHA:443167); the NUT Carcinoma Registry's split of 64% thoracic and 33% head and
    neck primaries, graded indirect because it gives sites rather than growth, and its 32% of
    non-thoracic patients presenting with swelling or a palpable mass, graded indirect because
    the sentence gives no site (PMID:41348986); and a review of 55 published primary pulmonary
    cases naming rapid enlargement of the mass among the signs that should raise the diagnosis
    (PMID:36290813). An edge into it from NUTM1 Rearrangement (INDIRECT_UNKNOWN_INTERMEDIATES)
    cites the framing sentence that the fusion drives the cells' growth (PMID:26220994),
    NSD3-NUT keeping the cells proliferating (PMID:24875858) and the mouse Brd4::Nutm1 fusion
    inducing aggressive carcinomas (PMID:38724194), all graded indirect. Its edge to Nasal
    congestion is marked direct, since no mechanism node of this entry sits between them, on a
    representative endoscopy image from an 18-patient head and neck series showing tumour
    obstructing the nasal meatus (PMID:41160255); its three quotes are graded indirect, for
    reasons the entry notes give; its four edges to the thoracic symptoms carry an unknown link
    type, each with Orphanet's mass-effect quote and a presence quote, all graded indirect.
    Early Metastatic Spread: Orphanet's statement that local invasion, nodal involvement and
    distant metastasis are often present at diagnosis; the registry's 55% metastatic at the
    first cancer diagnosis, with four patients progressing before the NUT carcinoma diagnosis,
    and its table row of 72% thoracic against 32% non-thoracic at that diagnosis; the head and
    neck series' imaging of the mass invading adjacent structures; and distant metastasis during
    follow-up in 7 of its 18 patients, graded indirect for a node about early spread. Its edges
    to the existing Regional lymph node involvement and Distant metastasis phenotypes are marked
    direct, since no mechanism node of this entry sits between the spread and either, and each
    cites Orphanet's statement and, respectively, the pulmonary review's 34 of 37 and 21 of 39;
    the nodal edge also cites that review's statement that most cases had lymph node metastases
    at the initial imaging, and the distant edge the registry's 55% and its list of common
    metastatic sites. The registry's cached text does not define metastatic disease; the entry
    reads it as distant spread, because the sites it lists include distant lymph nodes, and says
    so where the reading is used. All are graded indirect because they report presence, and both
    descriptions scope how often spread is present to a thoracic primary. Phenotypes Cough,
    Dyspnea, Chest pain, Hemoptysis and Nasal congestion, bound to HP terms read from
    cache/hp/terms.csv, with the registry's thoracic and non-thoracic figures (dyspnoea counted
    with fatigue, congestion not said to be nasal, both graded indirect), the pulmonary review's
    44 cases with symptoms recorded, and the head and neck series, whose sites are quoted
    because 14 of its 18 tumours were sinonasal. The top description now says the disease arises
    across a wide age range, from children to older adults, as the NUT Carcinoma Registry's
    cached report describes diagnoses across the entire age spectrum, from 7 to 81 years, in
    place of mostly in adolescents and young adults; the head and neck series also says that the
    disease in the head and neck is not confined to adolescents. Sentences the change or the new
    sources made false are narrowed: the top description and a node note, whose pointer to the
    edge it means is also corrected, state the NSD3-NUT finding as the source does, the fusion
    necessary and sufficient both to block differentiation and to maintain proliferation; and it
    says the disease is thought to be widely underdiagnosed, keeping its source's hedge; the
    Distant metastasis phenotype no longer says metastatic stage is where the disease is usually
    found or that no source links it to the short course, and quotes the registry's worse
    survival with metastatic disease as an association, graded indirect because the registry's
    cached text does not define metastatic disease; the Regional lymph node involvement
    phenotype calls nodal spread common rather than usual; the entry notes no longer say there
    is no presenting symptom list, and name the two unbound phenotypes; the resistance paragraph
    now says no claim of resistance to BET or HDAC inhibitors is curated, and why: the four
    cached sentences that pair therapy resistance with these drugs or their targets frame their
    papers' questions or restate other work; the survival note adds the pulmonary review's
    4.4-month and the head and neck series' 12-month medians; review_notes move the symptom list
    to the recorded items, open the paragraph on the research report's quotations with the fact,
    that the caches concerned hold abstracts only, rather than with how the curation was done,
    make the provenance sentence refer to the bound identifiers and add the HP, CHEBI and
    NCBITaxon caches to it, note the head and neck series' mention of the first mediastinal or
    thymic description, and now say the Thymic_Carcinoma row already points to this entry; the
    rearrangement node's note gives the PMIDs of the review and the registry that between them
    name ZNF532, ZNF592 and BRD2, and adds the CHRM5 partner the pulmonary review names; two
    mentions of the review now give its PMID, to tell it apart from the other reviews the entry
    cites, and the Ki-67 row names its series; the prevalence note adds that the pulmonary
    review repeats the fewer-than-100 figure and that a cached review holds the reported count
    to understate the disease, quoting it; the registry's congestion is scoped to its cached
    text, since the supplemental figure it cites is not cached; the clinical trial row's note no
    longer refers to a pull request, and the row's study-design sentence no longer carries a
    quote role; and the entry-level note on the treatment rows now says the cached sentences
    report outcomes, responses or use, none of them a mechanism. The top description also names
    the sites the two cached registries report, the thorax and the head and neck, rather than
    midline structures. Two new caches are committed. Validation: just validate passes, all 163
    snippets verify, and the targeted gates pass.

  summary: Add four GEO datasets on NUT carcinoma cell lines and BRD4-NUT chromatin
    binding
  details: |
    Adds a datasets section with four GEO series found with just discover-datasets and checked
    by hand for relevance: GSE18668 (microarray profiling of the TC-797 and PER-403 lines after
    siRNA knockdown of BRD4-NUT and after trichostatin A; PMID:21447744), GSE179693 (RNA-seq of
    the TC-797 and 10-15 lines treated with panobinostat or IRBM6, against vehicle;
    PMID:34285087), GSE208774 (RNA-seq of the 10-15 and PER-403 lines treated with tazemetostat,
    a BET bromodomain inhibitor, or tazemetostat with ABBV075, at 6 or 96 hours; PMID:37747726)
    and GSE229558 (ChIP-seq of BRD4-NUT introduced into HUES64 embryonic stem cells,
    HUES64-derived mesoderm and Ntera-2 embryonal carcinoma cells; PMID:37119804). Titles are
    copied from the GEO records. Each record quotes its GEO summary as evidence; the GSE229558
    record also quotes the linked study for its conclusion and for what the two cell lines are.
    Cell lines, arms, sample counts and series types come from the GEO records and their sample
    titles, read on 19 Nov 2026 through NCBI E-utilities, and each record's notes says so. GEO
    links GSE179693 to PMID:34285087 and GSE208774 to PMID:37747726, while those papers' own
    data statements name GSE179694, and GSE142481 with GSE228533; the notes record both. Left
    out: GSE232838, a tazemetostat time course from the same study as GSE208774, and two series
    from a genetically engineered mouse model (GSE241476, GSE241477), whose model is the subject
    of a separate pull request. Validation: just verify-datasets resolves all four accessions;
    just validate passes; all snippets verify.

  summary: Differential diagnoses, and a false negative-existence claim about SMARCB1
  details: |
    Two things: a differential_diagnoses block, which the entry did not have, and the repair of a
    claim in histopathology that was false.

    The false claim first. The row BRG1 and INI1 retained said "No cached source mentions SMARCB1, so
    no claim is made about INI1's gene or about SMARCB1-deficient tumours." Many committed caches
    mention SMARCB1, and one of them names this tumour and the SMARCB1-deficient sinonasal carcinoma
    in the same sentence as entities that must be separated. INI1 is SMARCB1's protein product, so
    the retention the row already reported is precisely what excludes that tumour - and the note told
    the next curator not to look. The row now names both SWI/SNF-deficient mimics and points at the
    differential rows below.

    Six differential rows, each with at least one cached sentence that separates the entity from this
    one. Five bind a MONDO class. One does not: SMARCB1 (INI-1)-deficient sinonasal carcinoma, where
    MONDO genuinely has no class and Sinonasal_Undifferentiated_Carcinoma already records the same
    gap on its own row for the same entity.

    Three of those five bindings were wrong in the first draft, and all three for the same reason: I
    searched cache/mondo/terms.csv and the existing entries, which hold only what kb/ has already
    bound, and read their silence as MONDO having no class. That is the cache-first contract read
    backwards. Checked against the local MONDO build instead, three classes exist and are now bound.
    MONDO:0018761 SMARCA4-deficient sarcoma of thorax is the thoracic SMARCA4-deficient
    undifferentiated tumour under its older name - its NCIT cross-reference carries the newer name
    verbatim, which is the name the cited series uses. MONDO:0000402 small cell carcinoma is siteless
    and is the parent of the lung class I had bound; the cited series names the mimic without a site,
    and this tumour arises in the mediastinum and head and neck as well, so the lung class asserted a
    site the source does not. MONDO:0005096 squamous cell carcinoma replaces a note claiming the
    nearest class was the paranasal sinus one; MONDO has no grade-qualified class, so the grade is
    carried in the preferred term and the description instead. NUT-rearranged sarcoma remains
    genuinely absent from MONDO - the only NUTM1 class there is a B-lymphoblastic leukaemia.

    One reference_title was written as a folded scalar beginning with a quotation mark, which puts
    the quote characters into the string. The title gate cannot see that, because it exempts a title
    that contains the cached one verbatim. It is a double-quoted scalar now.

    The NUT-rearranged sarcoma row is the one that matters most, because it limits the entry's own
    first-line test. The diagnosis section says nuclear NUT expression is what the diagnosis requires,
    which is true as a necessary condition. The 2026 WHO soft tissue classification reports uniform
    nuclear NUT staining for a mesenchymal NUTM1-driven tumour as well, so the stain establishes a
    NUTM1-driven tumour without establishing which one. Nothing in the entry said that.

    Two rows carry a REFUTE item against their own premise. The squamous cell carcinoma row cites a
    paper arguing this tumour should be reclassified as a squamous cell carcinoma, so a reader does
    not take the differential as settled nosology. The small cell carcinoma row cites the cited
    series' own INSM1 figure - positive in 54 per cent of cases tested, which its authors call a
    pitfall - so the neuroendocrine marker is recorded as an overlap rather than a discriminator. The
    same applies to CD99 and CD34 in that series; those are left for a later row rather than
    stretched into a Ewing differential the sources do not draw.

    Rows deliberately not written: lymphoma and germ cell tumour. The only cached material is the
    series' sentence that CD45 and SALL4 were rarely positive, and no cached source names either as a
    differential of this tumour, so a row would assert a separation nobody made. Both have MONDO
    terms available, which is not a reason to write a row.

    Two reference_title values were written from what the papers are about rather than copied from
    their cache title lines, and the title gate caught both. They are copied now. The corrected
    second title - "Hiding in plain sight: NUT carcinoma is an unrecognized subtype of squamous cell
    carcinoma of the lungs and head and neck" - states that paper's argument more plainly than the
    title I had composed for it.

    73 snippets verified, against 63 on the base branch. Every reference cited here was already
    committed, so none was fetched. Offline gates green, including check-snippet-grading, which CI
    does not run on a kb-only PR.

    An adversarial evidence pass after the first push found three more defects, all in how a source
    was used rather than in whether the quote was exact.

    The worst was named-entity confusion. The SWI/SNF review's immunophenotype sentence begins "These
    different tumor types", and its antecedent is the four SWI/SNF-driven *sinonasal* types the
    abstract has just listed - so "their SMARCA4-related counterparts" are the sinonasal SMARCA4
    entities, not the thoracic tumour the row is about. The quote attributed to a thoracic entity a
    phenotype the source states of different ones. That item and the distinguishing feature it backed
    are removed, and the row's notes now say why the review is not cited there.

    Two gradings were refuting claims their rows do not make. The squamous row quoted that paper's
    statement of the *current* classification - that the two are currently separate - which agrees
    with the row; the sentence that actually cuts against it, the authors' proposal that NUT carcinoma
    is a squamous cell carcinoma, is now the snippet. And the INSM1 figure was graded REFUTE because
    it undermines the obvious way to use the row; it supports the row, since a neuroendocrine marker
    in over half the cases makes the differential harder rather than less real, and it refutes only an
    assumption the row explicitly does not make.

    Two smaller repairs. The sarcoma row's snippet stopped immediately before the NUTM1 fusion the row
    rests on, and is replaced by the classification's own table row, which carries entity, malignancy
    and fusion in one string. And a feature claimed uniform nuclear NUT staining for both entities,
    where no cited source uses that word of this carcinoma.

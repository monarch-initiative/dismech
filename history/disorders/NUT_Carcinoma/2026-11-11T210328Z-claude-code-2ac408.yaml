  summary: 'Create: NUT Carcinoma'
  details: |
    New entry for NUT carcinoma, MONDO:0005563, from cached references and 50 verified snippets. A read-only literature digest read all 33 cached references first and reported verbatim candidate quotes by section; every quote was re-extracted from the cache body programmatically before it entered the file. MONDO's canonical label for the term is the superseded name, nut midline carcinoma, and it is copied exactly into the binding while NUT Carcinoma is used as the entry name, since that is what the cached literature calls it; the label is recorded in review_notes as a candidate MONDO term request rather than corrected here. Every one of the 33 caches is an abstract, so no full-text claim is used. The digest found that 14 of the research report's 26 block quotations are not in the cache they are attributed to, most of them PMC full text, and nothing from that set is used. Several claims that look standard for this disease are therefore absent and each absence is recorded in review_notes: abrupt squamous differentiation and round-cell morphology; the NUT antibody's sensitivity and specificity figures; the rarer fusion partners beyond BRD4, BRD3 and NSD3; a presenting symptom list, which is why the entry carries no phenotypes; and any statement about environmental risk factors. One trap is named explicitly, because it would be easy to merge: the only 87 per cent anywhere in the cached corpus is p63's sensitivity, not the NUT antibody's. Two readings of what the fusion does to acetylation look contradictory and are not - bulk acetylation falls while the megadomains are hyperacetylated - so both are cited on the node that records them rather than one being chosen. The mechanism is written for the entity rather than for BRD4, because a variant-fusion study found NSD3-NUT necessary and sufficient for the differentiation block. The three prognostic strata from the registry's survival-tree analysis are has_subtypes rows, and the row for the best-prognosis stratum carries a cached disagreement in its review_notes: a 40-patient head and neck series found no association between fusion type and outcome, and head and neck sits inside the nonthoracic group where that split lives. The chemotherapy row is recorded with its negative results rather than as an effective therapy, including a SEER analysis in which the chemotherapy association did not survive landmark and time-dependent methods while surgery and radiotherapy did. The two cached incidence figures are in flat contradiction - about 1,400 cases a year in the United States against fewer than 100 reported worldwide in a review scoped to pulmonary disease - and are recorded as a contradiction rather than reconciled. No cached source mentions the thymus at all, and the follow-up the slate plans on Thymic_Carcinoma is smaller than it looked: that entry already carries a NUT has_subtypes row bound to NCIT:C146706, so what it needs is curated_in pointing here, a one-line edit needing no new reference. Two read-only verifiers were then run in parallel against the entry, split by axis, and between them found nineteen things. All are acted on. The claim-truth axis: a clinical-trial note said the phase is in no cached source, where the cited abstract calls it a Phase 1 study and is indexed as one; a review_notes sentence said two cached files are not used, where two are not usable and fourteen are simply uncited, four of them carrying prose claims; two of those four are now real evidence items rather than prose, the head and neck series behind the recorded disagreement and the mouse study behind the SOX2 claim; the disagreement itself now says that both analyses draw on the same registry at different cut-offs and that 86 per cent of the smaller series carried the common fusion, so it is a real null rather than independent corroboration; the p300 and acetylation nodes were written for the entity on the strength of a result about the differentiation block, and both now say that every cached result on them is BRD4-NUT; keratin negativity was 8 of the 55 cases assessed, not 15 per cent of 57; a partial-response figure dropped the source's confirmed-or-unconfirmed qualifier; the cached registry named two different papers; a differential named SMARCB1-deficient tumours, which no cached source mentions; a note reasoned about a BRD-targeted assay where the only cached assays are NUTM1-anchored; two incidence figures called a flat contradiction measure different things at different scopes; and a framing sentence about NMC cells was graded HUMAN_CLINICAL and is now IN_VITRO. The bindings axis: the rearrangement node bound four genes with no molecular function, failing check-gene-activity-grounding, and now binds GO:0003682 chromatin binding, the partner gene's own wild-type activity on a lesion node; the Ki-67 note said no Ki-67 term is inside the enum, where 21 reach it through NCIT:C40998 and the true reason to reject them is that they are threshold predicates against a median; the acetylation node was bound to regulation of transcription with modifier INCREASED, naming the wrong process and asserting the opposite of what its own evidence reports, and is now chromatin organization with no modifier; GO:0030154 became GO:0030855 epithelial cell differentiation; CL:0000076 sat on the node carrying the somatic genetic_context and so was the derived cell of origin, a claim that node's notes denied, and has moved to the differentiation-block node, leaving the entry reporting ORIGIN_WITHOUT_CELL, which is the honest answer; the three per-partner percentages moved from free-text frequency into structured case_fractions with the denominator question recorded; and the three prognostic bands moved out of has_subtypes into progression, since they are one survival-tree regression's output, no stratum-specific mechanism or therapy exists for any of them, nothing in the entry scoped to them, and a subtype row asserts an entity nobody diagnoses.

    Review round 1. The entry carried no phenotypes at all; it now has two, regional lymph node
    involvement and distant metastasis, from the nine-of-twelve and eight-of-twelve counts in the
    multicentre series it already cited. Neither carries an ontology binding and neither is wired into
    the pathograph, and both decisions are argued rather than defaulted. HPO has no term for nodal
    involvement or distant metastasis - searches for metasta, metastatic, tumor spread and invasion
    return only Metastatic angiosarcoma, a different disease - and the nearest lymph-node terms
    describe enlargement or altered morphology, which is not what involvement by tumour means. MONDO
    is the other half of the phenotype slot and does carry candidates that would validate; they are
    declined because the entries that bind MONDO there do so for a comorbid distinct disease, whereas
    a metastasis is this same tumour in another site. No edge is drawn because no cached sentence
    links the terminal differentiation-block node to nodal or distant spread; the only sentence in the
    whole cached corpus about spread is the one the two rows already quote.

    The histone deacetylase row described a xenograft result and a vorinostat response without citing
    either; both sentences are in the abstract it already cited and are now evidence items, and
    vorinostat is bound as a therapeutic agent. The Ki-67 histopathology finding was bound to NCIT
    Increased Mitotic Activity; a proliferation index is not a mitotic count, so the term is dropped
    and the free-text preferred term kept.

    The reviewer asked for the head and neck series' null result on fusion type to be recorded as a
    refutation on all three risk-group rows. It is not, and the reasons are now written out on group
    A. That series is head and neck only, so it contains no thoracic patients and cannot bear in
    either direction on group C, which is defined by a thoracic primary. For groups A and B the claim
    each row makes is its own stratum median survival, which the series never computed. The null does
    bear on the A-versus-B split, but that is a claim neither row asserts alone. The same null is
    recorded as a refutation on the radiotherapy row, where it meets the same variable head-on.

    Adversarial verification then found six further problems. Two were blocking. The entry-level notes
    still opened by saying the entry carries no phenotypes, which the round had just made false, and
    both new descriptions pointed at those notes for a binding rationale the notes did not contain;
    the opening is rewritten and now carries the rationale the descriptions promise. A reference count
    corrected from 19 to 21 left the following clause saying two of the other 14 were unusable, when
    33 minus 21 is 12. Of the rest: the distant-metastasis description attributed the short course to
    metastatic stage, which no cached source does; the radiotherapy refutation said the comparison
    cohort was registry-drawn, which its abstract never says, and now reports what that abstract
    actually claims; and an explanation narrated the entry's own edit history rather than the
    evidence. A second verifier found three more of the same
    kind. The Ki-67 histopathology row's own notes still said Increased Mitotic Activity is bound
    instead, after this round had removed that binding; the note now says nothing is bound and why,
    and records that the one NCIT term naming the concept, Ki-67 Labeling Index, sits outside the
    enum. The reference tally described one unusable cache as a duplicate of a cited paper, when the
    paper it duplicates is not cited either. And the precedent offered for leaving a phenotype unbound
    was Ewing_Sarcoma's Metastatic Disease at Diagnosis, which is a stages row and cannot carry a
    binding at all - while Ewing's actual Metastatic Disease phenotype is bound, so the citation
    argued against the claim it was offered for. Alveolar_Rhabdomyosarcoma, whose Metastatic Disease
    and Regional Nodal Disease rows are both unbound, is the real precedent, and the note now records
    that the practice across the corpus is not uniform.

    One pre-existing finding is worth a line for whoever reads this next: check-cancer-origin reports
    ORIGIN_WITHOUT_CELL on this entry's NUTM1 Rearrangement node, which marks an origin and binds no
    cell type. The node is untouched by this round. CLAUDE.md records that class as being at zero
    across the knowledge base and therefore ready to become a real gate, so this entry is the one that
    takes it off zero.

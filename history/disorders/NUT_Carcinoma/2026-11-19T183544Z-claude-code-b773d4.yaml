  summary: 'Edit: NUT Carcinoma - morphology, the NUT antibody''s accuracy and fusion
    testing'
  details: |
    Adds how NUT carcinoma is recognised and confirmed: three histopathology rows and three edited diagnosis rows. Because the change caches three full texts, it also rewrites older sentences of the entry that said no cached source carries something those texts carry.

    Histopathology. Abrupt keratinisation: a review's account of keratinisation as a clue to the diagnosis, its figure legend giving abrupt keratinisation in up to 30% of cases, and its caveat that the feature is seen in only about 30% of cases and also in HPV-associated basaloid squamous cell carcinomas (PMID:35372003, REVIEW_SYNTHESIS), with the antibody study's statement that many but not all tumours show focal squamous differentiation (PMID:19363441, BACKGROUND). Diffuse speckled nuclear NUT staining: the antibody study's contrast between the diffuse speckled staining of NUT carcinoma and the focal smooth staining of germ cell tumours, and the review's statement that the nuclear foci correlate with the fusion protein's megadomains. INSM1 and other markers that can mislead: INSM1 in 7 of 13, focal TTF-1 in 10 of 38, CD34 in 3 of 20 and CD99 in 3 of 14 cases of a 57-case immunohistochemistry series (PMID:38059551), and weak NUT staining in germ cell tumours, 64% of dysgerminomas among them, which the antibody study's authors think unlikely to cause confusion in practice.

    Diagnosis. The NUT immunohistochemistry row now says the defining rearrangement is usually shown by nuclear NUT staining: the review's abstract makes nuclear expression the requirement, and its body asks for a demonstrated rearrangement, which staining can confirm, with molecular testing as an alternative (both quoted, REVIEW_SYNTHESIS). It gains the antibody study's accuracy (sensitivity 87%, specificity 100%, negative and positive predictive values 99% and 100%), scoped as the full text scopes it, to NUT carcinoma among non-germ-cell tumours, with 1068 tissues stained and 4 false negatives and no false positive among 919 non-germ-cell malignancies. The rearrangement-testing row gains how the NUT Carcinoma Registry's diagnoses were made (PMID:41348986: immunohistochemistry 79%, RNA sequencing 12%, FISH 8%, DNA sequencing 1%), the registry report's statement that standard DNA sequencing misses most cases (BACKGROUND), and the antibody study's two cryptic BRD4-NUTM1 rearrangements that split-apart FISH missed (which lowered its sensitivity to 93%, while the two tests together reached 100%), the probe spanning NUTM1 that found them, its authors' explanation, and, among the tumours the antibody missed, two rearrangements with a partner other than BRD4 or BRD3 that split-apart FISH did detect. Its notes now describe what a split-apart probe can miss and what it catches, and lose a sentence about an earlier version of the note. The recognition row gains the registry's 78% of patients first diagnosed as something else, and two background sentences on the tumours it overlaps with morphologically.

    Older sentences the new full texts made false. The entry's description and the p300 node's notes said that no cached source had mapped a fusion other than BRD4-NUT or shown a non-BRD4 fusion building megadomains; the review now states it for BRD3 and for the ZNF532 and ZNF592 fusions, so both now speak of cached primary studies, and the notes say what the review states. The NUTM1 Rearrangement node's notes now say that the review and the registry report name ZNF532, ZNF592 and BRD2, not yet recorded. The conventional chemotherapy row's notes now say what the antibody study, the review and the registry report say about regimens, which the entry does not yet weigh. The entry-level notes now say the registry report gives a presenting symptom list, not yet recorded. In review_notes, the paragraph on claims left out at first curation is put in the past tense and says which of them are now recorded (abrupt keratinisation, the antibody's accuracy) and which are now in cached sources but not yet recorded (round-cell morphology, rarer partners, a presenting symptom list, smoking); the thymus paragraph says what the registry report and the antibody study now say about the thymus; and the count of cited references is stated as the count when the entry was first curated.

    A pre-existing grading slip is corrected: the 57-case series' sentence on morphological overlap, from its abstract's context section, was graded PRIMARY_RESULT in two differential rows and is now BACKGROUND there too, as in its new use.

    Two references are newly cached and committed, both as full text: PMID:19363441 and PMID:41348986. PMID:35372003, already cited, is re-fetched as full text, and the entry's existing quotes from it still verify. Validated with the repository's gate set over the changed entry.

  summary: 'Edit: NUT Carcinoma — Orphanet mappings, ICD-O morphology and point prevalence'
  details: |
    Added the entry's first mappings and classifications blocks and a third prevalence record, from the cached Orphanet record ORPHA:443167.

    mappings carries two exact matches: MONDO:0005563, which Orphanet lists as an exact cross-reference and which the entry already binds as its disease_term, and NCIT:C45716 NUT Carcinoma, read from the NCI Thesaurus itself because Orphanet's cross-reference table does not list NCIT. Five of Orphanet's six cross-reference rows are not carried, and the entry's notes say why: ICD-10 C80.9 is a WHO ICD-10 code absent from ICD-10-CM, which is the vocabulary this schema's slot takes, so binding it would invent a code; the two ICD-11 references are linearisation codes where every ICD-11 binding in this knowledge base is a numeric foundation identifier, and the local foundation build answers neither code; and MedDRA and UMLS have no slot for their vocabulary at all. Each negative finding about an identifier records the query that was run and what it returned.

    classifications records the ICD-O morphology family as Carcinoma rather than Squamous Cell Carcinoma, because the source describes a poorly differentiated carcinoma in which squamous differentiation is often but not always present. The four-digit ICD-O code has no slot in the schema.

    prevalence adds Orphanet's worldwide point-prevalence band, below one per million, with a note that it is a band rather than a measured rate and is not comparable with the United States annual-incidence estimate already in the entry.

    The record's nine phenotype rows are deliberately not transcribed. Read as phenotypes they would say a third to four fifths of patients have leukaemia, neuroblastoma and Ewing sarcoma; read as the set of tumours in which a NUTM1 rearrangement has been reported they are coherent, and the notes record that reading.

    Validated with the repository's gate set over the changed entry: schema, reference and term validation, snippet verification, duplicate keys, entity references, causal targets, coarse phenotypes, enum values, block scalars, snippet grading and length, titles, and the knowledge-base pytest lane. All passed.

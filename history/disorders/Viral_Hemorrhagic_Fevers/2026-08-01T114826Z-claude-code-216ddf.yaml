- type: EDIT
  outcome: changed
  sections:
  - datasets
  summary: Add public dataset records from GEO
  details: |
    Added 2 datasets record(s) discovered via the GEO DataSets index (scripts/discover_datasets.py, batch 6, infectious disease category). Accession, title, organism, sample count and linked PMID are GEO's own metadata rather than model-generated text, and every accession resolved against NCBI E-utilities before commit. Candidates were manually triaged for disease identity; records naming a sibling organism, a different pathogen, or a same-named non-human entity were rejected. No evidence blocks generated, since an evidence item requires an exact abstract quote; records carry publication and provenance notes instead.

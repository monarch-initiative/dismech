  summary: Retire Infectious_Disease under rung 0 (#10115, design decisions §3e)
  details: |
    Retired kb/disorders/Infectious_Disease.yaml (MONDO:0005550, infectious disease) under rung 0 of the infectious disease granularity ladder, design decisions section 3e rule R2: the concept is the root of MONDO's infectious-disease branch and too abstract to carry a mechanism. The entry held three generic host-response pathophysiology nodes (Pathogen Invasion and Replication; Host Genetic Susceptibility and Immune Response; Toll-Like Receptor Signaling and Cytokine Release), two generic treatments (Vaccination, Antimicrobial Therapy), a 21-item references list with no findings attached, and one GEO dataset (geo:GSE216009, a sepsis whole-blood single-cell atlas). Nothing was disease-specific enough to move to another entry; the sepsis dataset is noted in the PR as a lead for Sepsis.yaml rather than moved. The decision is recorded as stubs/Infectious_Disease.yaml with entry_type OUT_OF_SCOPE, priority LOW, and the reasoning in notes, so the concept is not re-nominated (seed-stubs never overwrites an existing stub; next-stubs offers only UNDECIDED and DISEASE stubs; tidy-stubs sweeps a stub only when its term is obsolete or a kb entry or grouping maps it). References repointed: the worked example [Infectious_Disease] Pathogen Invasion and Replication was removed from kb/node_classes/pathograph_node_classes.txt (it cited a node that no longer exists), and projects/CLINICAL_CARE_GUIDELINES.md no longer declares the slug in its frontmatter and its prose notes the retirement; the historical search-result table row is left as a record. The existing history record for this entry carries target.superseded_by pointing at the stub, as does this one, so both stay under history/disorders/Infectious_Disease/ and pass the layout test. Research reports under research/Infectious_Disease-deep-research-*.md and cited references_cache files are left in place as provenance. No grouping member, comorbidity, causal-target baseline row, or cross-file entity reference named the entry.

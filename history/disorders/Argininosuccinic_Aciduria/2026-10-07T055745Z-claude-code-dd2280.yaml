  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding two dried-blood-spot measurements: LOINC:42892-0 Citrulline [Moles/volume] in DBS (the primary marker, shared with citrullinemia type I and citrin deficiency) and LOINC:53062-6 Argininosuccinate [Moles/volume] in DBS (the discriminating analyte, measured by a dedicated MS/MS scan function, PMID:11400762). One reference range on the citrulline code carries the single-centre tandem mass spectrometry pilot (610,000 samples, 1999-2002) threshold of citrulline above 85.5 umol/L (PMID:12684898), the same threshold that ascertained argininosuccinate lyase deficiency in that pilot. Argininosuccinate is bound without a reference range: PMID:11400762 flags abnormal files on a mass-ratio threshold without a concentration, and no PubMed abstract found by the named query states a numeric DBS argininosuccinate cut-off. Added loinc_term LOINC:LP15417-6 Argininosuccinate (the specimen-independent Part) on the biochemical Argininosuccinic acid marker, which describes plasma and urine together. All LOINC codes and labels read from the Monarch KG via just loinc-seed-cache; cache/loinc/terms.csv rows committed. Part of dismech issue 13642, batch 3.

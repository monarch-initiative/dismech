  summary: 'Create: Cryptococcal Meningitis (MONDO:0005723)'
  details: |
    New entry curated so that kb/modules/fungal_nucleic_acid_antimetabolite.yaml has a conformer; the module had none, and the stub added earlier in this session queued the work rather than doing it. Five pathophysiology nodes: inhalation and pulmonary colonisation, failure of pulmonary containment in advanced immunosuppression, haematogenous dissemination with blood-brain barrier invasion, meningoencephalitis with raised intracranial pressure fanning out to three phenotypes, plus a therapeutic_vulnerability node for flucytosine activation by fungal cytosine deaminase which carries the conformance link. The vulnerability node is modelled because the trial evidence identifies flucytosine specifically rather than antifungal therapy in general as the component that changes mortality; its evidence is clinical efficacy and the activation biochemistry stays the module's claim. Also curated: the NCBITaxon-bound agent with its virulence determinants, inhalation transmission, an agent_life_cycle recording an environmental saprophytic reservoir with the human as a dead-end host, global burden, amphotericin B plus flucytosine induction with an ACTIVATES target_mechanisms link (the prodrug is activated by the pathway rather than inhibiting it), therapeutic lumbar puncture targeting the pressure component, two progression phases, and a KNOWLEDGE_GAP discussion on CNS tropism. One REFUTE evidence item records that adjunctive dexamethasone worsened outcomes, which is why drainage rather than corticosteroids is the adjunctive measure. Granularity: the entry is the named clinical entity rather than MONDO:0005724 cryptococcosis, and C. gattii is deliberately excluded with the reason stated; just check-granularity reports zero findings in every class including the advisory ones after the life-cycle block was added. Two snippets were reworded before commit to avoid square brackets, which the reference validator strips, and one truncated mid-word quote was replaced with a clean clause. Every PMID was found by PubMed search in this session and every snippet copied from the cached abstract. Validation: just validate-disorders passed with 32/32 snippets verified and terms clean. stubs/Cryptococcal_Meningitis.yaml is deleted by the same change.

  summary: Wire the polyene half of induction therapy to its module
  details: |
    This entry modelled amphotericin B plus flucytosine induction and wired only flucytosine. The treatment carried both drugs as bound CHEBI therapeutic_agent entries and a single target_mechanisms edge, to the flucytosine activation node. So half a two-drug regimen reached a module and half did not, and fungal_membrane_ergosterol_binding - a complete five-node polyene module, trigger through adaptive_escape - was left as one of three modules in kb/ with no conformer anywhere.

    Added Amphotericin B Extraction of Membrane Ergosterol (therapeutic_vulnerability, MOLECULAR) conforming to fungal_membrane_ergosterol_binding#Polyene Binding and Ergosterol Extraction / Pore Formation, which is the conformance target that module's own description names. The node records the sterol-sponge mechanism, the ergosterol-over-cholesterol selectivity that is imperfect enough to explain the nephrotoxicity and the liposomal formulation, and the two consequences specific to this disease: resistance is rare because the target is a finished membrane lipid rather than a mutable gene product, which is why a five-decade-old drug is still the induction backbone; and the killing is physicochemical rather than replication-dependent, so it clears organisms from CSF at a directly measurable rate, which is the endpoint the single-high-dose liposomal regimen was judged on.

    No biological_processes or molecular_functions term is bound, following the module node, which records on itself why: the mechanism is a drug-lipid interaction and GO's process and function branches describe gene-product activities. The node repeats that reasoning in its own notes so the absence does not read as an omission. Consequently just check-conformance-content classes this link anchor_no_process, which is the correct reading and not a defect.

    Evidence reuses two already-cached references rather than adding any: PMID:24681535 for the extraction mechanism, graded IN_VITRO with the same snippet string the module node uses so the two cannot diverge under check-snippet-grading, and PMID:35320642 for the CSF clearance rate, graded HUMAN_CLINICAL and directness INDIRECT because a clearance rate supports the fungicidal mechanism by an inference step rather than measuring sterol extraction.

    Also added the treatment's second target_mechanisms edge, INHIBITS, with a description saying what is and is not inhibited - not an activity but the integrity of the membrane - since the drug removes the sterol rather than blocking an enzyme. Both edges together make the regimen's two drugs reach two different modules.

    Both therapeutic nodes report edges_absent, which is expected: a therapeutic_vulnerability is not a step in the disease chain and carries no downstream.

    Validated: validate-disorders (35 snippets, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms.

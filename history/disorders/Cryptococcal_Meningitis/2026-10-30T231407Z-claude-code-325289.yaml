  summary: 'Review round: amphotericin edge, incidence rate, phenotypes, IRIS phase'
  details: |
    Addressed ai4c-reviewer blocking items on PR 16040. (1) Amphotericin B treatment edge changed INHIBITS->ACTIVATES to match the flucytosine edge: the node names the drug's own ergosterol-extraction action, so the treatment engages it, with membrane disruption downstream in the module. (2) Removed the invented rate_per_100000 (1.9) and its derived prevalence_class from the incidence record: the figure was 152,000 global HIV-associated cases over world population, measuring neither the stated at-risk cohort; absolute counts stay in notes and evidence. (3) Added two >10% phenotypes already quoted in-file from the Kenyan cohort (PMID:23457857): Nuchal rigidity (HP:0031179, 69%) and Weight loss (HP:0001824, 48%). The reviewer's suggested HP:0031360 was wrong (it resolves to Yellow skin plaque); looked up the correct nuchal-rigidity term. (4) Added a Cryptococcal IRIS progression phase citing the COAT definition (PMID:24963568), making the IRIS concept queryable rather than only prose in the deferred-ART treatment. validate-disorders clean, 49/49 snippets verify.

  details: |
    Addresses the automated review of PR 13924.

    Pathograph. Cryptococcal Meningoencephalitis with Raised Intracranial Pressure bundled two claims that are treated separately in the clinic, so the entry could not record that drainage acts on one and antifungal therapy on the other. It is split into Cryptococcal Meningoencephalitis, the infection, and Raised Intracranial Pressure from Impaired Cerebrospinal Fluid Outflow, which the infection node now feeds on a cited edge. The dissemination node is retargeted onto the infection node, and Therapeutic Lumbar Puncture onto the pressure node.

    Ontology bindings. The bundled node carried GO:0050832 defense response to fungus with modifier INCREASED, asserting a heightened host antifungal response at the point where both upstream nodes record it as DECREASED, and no cited source grades the intensity of the meningeal response. The binding is dropped and the searches run are recorded in the node's notes. The new pressure node binds GO:0090660 cerebrospinal fluid circulation, DECREASED, which is the mechanism its name states.

    Evidence. The containment node quoted the five-word fragment 'as this group is at highest risk for cryptococcosis'; it now quotes the PMID:36049486 sentence naming advanced HIV disease and the routes into it. The Headache phenotype quoted a sentence about lumbar puncture guidelines rather than about headache; PMID:23457857, a Kenyan cohort of HIV-positive adults, is added and quoted for headache in 93 percent of cryptococcal meningitis patients. On Therapeutic Lumbar Puncture the item graded REFUTE quoted a dexamethasone harm result, which refutes an alternative intervention rather than this claim; it is replaced with the guideline-status sentence that the treatment description actually makes. Evidence source grades are taken from the quoted text rather than the review genre: human disease-course statements become HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, macrophage and virulence-factor mechanism statements become IN_VITRO, and organism taxonomy and environmental-reservoir statements stay OTHER. The knowledge-gap item quoted the review's aim sentence; it now quotes the statement that three candidate routes across the blood-brain barrier are proposed, which is what the gap asserts.

    Treatment metadata. therapeutic_modality on Therapeutic Lumbar Puncture changes from SURGERY to OTHER. Repeated diagnostic-therapeutic cerebrospinal fluid drainage is a bedside procedure, not a surgical one; the NCIT:C15327 Lumbar Puncture action term is unchanged.

    Validation. just validate-disorders over both changed entries: 71 of 71 snippets verified, 0 issues, plus the full offline gate set.

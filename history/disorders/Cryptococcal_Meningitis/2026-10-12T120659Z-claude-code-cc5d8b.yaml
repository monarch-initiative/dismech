  summary: 'Review round 2: add the diagnosis section'
  details: |
    Addresses round 2 of the automated review of PR 13924, which recorded that this entry had no diagnosis section.

    Two records. Cryptococcal antigen detection is bound to NCIT:C154829 Cryptococcus Antigen Measurement and carries two sources: the Kenyan cohort added in round 1, which diagnosed a third of 340 adults presenting with suspected cryptococcal meningitis by antigen, and the global burden analysis on the lateral flow device. That test is the reason antigen screening in advanced HIV disease is a prevention strategy rather than an early diagnosis, which is the claim the containment-failure node already makes, so the diagnosis record and the pathograph now say the same thing from two directions.

    Lumbar puncture with cerebrospinal fluid examination is the second record, bound to NCIT:C15327. The same procedure is curated as a treatment, and the description says why that is not duplication: the diagnostic reading and the drainage are different claims about one act, and after the round-1 split the drainage targets the pressure node specifically.

    No opening-pressure reference range is recorded, and the record says so. Manometry is standard of care here and the cited sources say as much, but none states a numeric threshold in a quotable sentence, and a cut-off written from memory is what the reference-range slot must not carry.

    Validation. just validate-disorders over all three changed entries: 109 of 109 snippets verified, 0 issues, plus the full offline gate set.

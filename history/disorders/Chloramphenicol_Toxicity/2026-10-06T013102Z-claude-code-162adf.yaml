  summary: 'Create: Chloramphenicol Toxicity'
  details: |
    De novo curation of Chloramphenicol Toxicity (MONDO:0010784). Deep research via the claude_code provider (research/Chloramphenicol_Toxicity-deep-research-claude_code.md; the run returned no PMIDs/snippets, only search-summary leads, so all evidence was fetched and quoted independently). One entry spans the three forms: dose-dependent reversible marrow suppression and gray baby syndrome are wired through the shared mitochondrial-injury mechanism (mitochondrial translation inhibition -> oxidative phosphorylation failure), while idiosyncratic aplastic anaemia is a separate arm off the exposure node (Yunis PMID:2486534 frames them as distinct). The gray-baby cardiac step and the aplastic-anaemia mechanism are marked INDIRECT_UNKNOWN_INTERMEDIATES / recorded as uncertain per the sources. Neonatal glucuronidation immaturity raises exposure; no gene is bound on that node (the chloramphenicol isoform is UGT2B7, not the drafted UGT1A1, but no primary source naming it was verified - recorded in notes). Phenotypes (all connected): ashen-gray discoloration, hypothermia, vomiting, circulatory collapse, anaemia, aplastic anaemia. Environmental (ECTO:9000360), diagnosis (serum concentration; blood-count monitoring) and a differential (other causes of aplastic anaemia) included. Evidence: Yunis review (PMID:2486534), gray baby case report/review (PMID:41602900), ocular-chloramphenicol aplastic-anaemia case-control (PMID:9723830), StatPearls gray baby chapter (PMID:28846297). No GeneReviews chapter; StatPearls chapter tagged-worthy. Validated: validate-disorders (19/19 snippets, 19 titles), validate-terms, check-entity-refs, check-causal-targets, every phenotype connected. preflight-dr not run (report had no CURIEs/PMIDs to confuse); MONDO/ECTO verified against local sqlite builds.

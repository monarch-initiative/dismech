  summary: 'Create: Chloramphenicol Toxicity'
  details: |
    De novo curation of Chloramphenicol Toxicity (MONDO:0010784). Deep research via the claude_code provider (research/Chloramphenicol_Toxicity-deep-research-claude_code.md; the run returned no PMIDs/snippets, only search-summary leads, so all evidence was fetched and quoted independently). One entry spans the three forms: dose-dependent reversible marrow suppression and gray baby syndrome are wired through the shared mitochondrial-injury mechanism (mitochondrial translation inhibition -> oxidative phosphorylation failure), while idiosyncratic aplastic anaemia is a separate arm off the exposure node (Yunis PMID:2486534 frames them as distinct). The gray-baby cardiac step and the aplastic-anaemia mechanism are marked INDIRECT_UNKNOWN_INTERMEDIATES / recorded as uncertain per the sources. Neonatal glucuronidation immaturity raises exposure; no gene is bound on that node (the chloramphenicol isoform is UGT2B7, not the drafted UGT1A1, but no primary source naming it was verified - recorded in notes). Phenotypes (all connected): ashen-gray discoloration, hypothermia, vomiting, circulatory collapse, anaemia, aplastic anaemia. Environmental (ECTO:9000360), diagnosis (serum concentration; blood-count monitoring) and a differential (other causes of aplastic anaemia) included. Evidence: Yunis review (PMID:2486534), gray baby case report/review (PMID:41602900), ocular-chloramphenicol aplastic-anaemia case-control (PMID:9723830), StatPearls gray baby chapter (PMID:28846297). No GeneReviews chapter; StatPearls chapter tagged-worthy. Validated: validate-disorders (19/19 snippets, 19 titles), validate-terms, check-entity-refs, check-causal-targets, every phenotype connected. preflight-dr not run (report had no CURIEs/PMIDs to confuse); MONDO/ECTO verified against local sqlite builds. Self red-team (pre-PR) then applied: unbound the ashen-gray phenotype from HP:0000961 Cyanosis (sources list ashen-gray and cyanosis as distinct; no HPO term for ashen-gray) and added Cyanosis as its own phenotype; swapped the blood-count-monitoring diagnosis evidence to an on-point snippet (PMID:41602900); tagged the StatPearls chapter in a top-level references block. Re-validated: 20/20 snippets, 7/7 phenotypes connected. Review round 1 (ai4c-reviewer): cited the two previously-assertion nodes (neonatal glucuronidation, oxidative phosphorylation failure) from PMID:41602900; added a Myocardial Dysfunction and Microcirculatory Failure intermediate node between OXPHOS failure and circulatory collapse (the source names the intermediates); renamed Gray Baby Circulatory Collapse -> Gray Baby Toxidrome and fanned it to the early features (fixing an inverted collapse->vomiting order), with collapse now downstream of the myocardial node; added Abdominal distension (HP:0003270) and Metabolic acidosis (HP:0001942) phenotypes; rebound Circulatory collapse to HP:0031273 Shock; bound extracorporeal removal to NCIT:C126400 Renal Replacement Therapy (reachable from C25218; exchange transfusion NCIT:C173284 is not reachable, named in prose); added a CASES_IN_LITERATURE prevalence record (19 cases, 35.3% mortality); added a peer-reviewed second evidence item to the ashen-gray phenotype and a metabolic-acidosis early-indicator diagnosis node. Kept the serum-level snippet unit-free to avoid the non-folding micro-sign (U+00B5) trap. Re-validated: 28/28 snippets, 9/9 phenotypes connected.

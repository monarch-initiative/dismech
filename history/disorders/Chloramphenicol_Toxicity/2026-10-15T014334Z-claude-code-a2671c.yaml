  summary: 'LOINC tranche I: bind serum chloramphenicol code and therapeutic range'
  details: |
    Bound LOINC:3455-3 (Chloramphenicol, Serum or Plasma) to the existing 'Clinical recognition and serum concentration' diagnosis row, and banded only the therapeutic target range (15-25 mg/L) as a reference_ranges/interpretation_bands entry. The fatal/toxic tier the same cited source reports -- 'serum levels exceeding 50 mg/L' -- was deliberately not banded: it is a strict inequality, and a half-open interpretation_bands entry with an inclusive lower_bound at 50 would assert that exactly 50 mg/L is fatal-range, which the citation does not state.

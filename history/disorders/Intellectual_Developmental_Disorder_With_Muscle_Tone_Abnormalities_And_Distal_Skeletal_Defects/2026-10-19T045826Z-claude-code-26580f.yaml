  summary: 'Pre-PR review fixes: Intellectual_Developmental_Disorder_With_Muscle_Tone_Abnormalities_And_Distal_Skeletal_Defects'
  details: |
    A fresh-context review read the full text cached for PMID:36828548 and PMID:38194969 and found three claims those papers contradict; each quote was re-checked against the cache before editing. (1) LGI3 was described as secreted by myelinating glia and bound to CL:0000218 myelinating Schwann cell; PMID:36828548 reports that deleting Lgi3 in Schwann cells alone leaves Kv1 localization intact and places the peripheral source in neurons. Schwann cell was replaced with CL:0000100 motor neuron and the neuron-origin sentence added as evidence. (2) An evidence item claimed juxtaparanodal Kv1 complexes control axonal excitability; the same paper says they do not affect excitability and that their loss prolongs the refractory period (measured in sensory fibres of Adam23 mutants). That item was removed, the sentence was added as REFUTE/INDIRECT on the Kv1-mislocalization to hyperexcitability edge (now INDIRECT_UNKNOWN_INTERMEDIATES), the authors' speculative facial-nerve explanation was added on the edge to facial myokymia, and a KNOWLEDGE_GAP discussion was added. (3) The entry said mouse behaviour was unreported; PMID:38194969 found no behavioural deficit in Lgi3-null mice. This was added as REFUTE evidence on the EMERGING hypothesis, as a FAILS_TO_RECAPITULATE model link, and as a HUMAN_MODEL_MISMATCH discussion. Also: the plasticity node now binds CL:0000598 pyramidal neuron and GO:0048172 (DYSREGULATED, since the paper reports reduced short-term depression); KCNA1 and KCNA2 added to the Kv1 node; an unsourced claim about the founding family was removed; the D331N secretion wording was softened to match the source; classifications and a CASES_IN_LITERATURE prevalence record were added; and the mild-to-moderate severity of intellectual disability was added from PMID:38194969 with quote_role BACKGROUND. Re-validated with just validate, validate-disorders, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-snippet-grading, check-retired-support-prose and model-scale-audit, all passing.

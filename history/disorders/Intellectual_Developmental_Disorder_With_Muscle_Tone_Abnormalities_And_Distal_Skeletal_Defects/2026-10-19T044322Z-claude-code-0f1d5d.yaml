  summary: 'Create: Intellectual_Developmental_Disorder_With_Muscle_Tone_Abnormalities_And_Distal_Skeletal_Defects'
  details: |
    New entry for the LGI3-related disorder (MONDO:0859277, OMIM:620007). Deep research was requested from falcon, but EDISON_API_KEY was empty in the session, so the run used --fallback and OpenScientist produced the report (research/...-deep-research-openscientist.md, fell_back: true). Its reference validation was clean (12/12 resolved, 3/3 quotes valid); needs_review was set by the term check only (the MONDO label written in title case, and obsolete GO:0005615). just preflight-dr could not run because the local MONDO build is absent; identity was checked by hand instead (the report body names LGI3 62 times and no competing gene, and carries the correct MONDO and OMIM IDs). Three report citations are about unrelated disorders (PMID:32783359, PMID:33288834, PMID:37196654) and were not used, nor were the LGI3 cancer-prognosis and in-vitro neurite papers. Evidence rests on four PubMed records: PMID:35948005 (defining 16-patient cohort, abstract only), PMID:29269699 (first Jordanian family), PMID:36828548 and PMID:38194969 (mouse LGI3-ADAM23-Kv1 mechanism). A PubMed search found no later case reports. Per-feature counts come from the HPO annotation file (release 2026-09-02, OMIM:620007) and are recorded in phenotype notes, not as frequency bands. Five phenotypes taken from that file (myokymia, tongue fasciculations, appendicular hypotonia, narrow mouth, ADHD) have no quotable evidence item because the PMID:35948005 abstract does not name them. The report's description of hip dysplasia, pectus carinatum and kyphosis as distal skeletal defects was not adopted: each is 1/16 in HPO and none is distal. Validated with just validate, validate-terms, count-verified-snippets (24/24), check-entity-refs, check-causal-targets, check-coarse-phenotypes and validate-disorders. The stub was deleted.

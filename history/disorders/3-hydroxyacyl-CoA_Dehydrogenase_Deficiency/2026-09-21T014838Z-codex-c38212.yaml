  summary: Review HADH deficiency against full-text mechanistic and clinical evidence
  details: |
    Reviewed the entire disorder entry and its evidence, matching Asta and OpenAI
    research reports, and the full clinical/mechanistic source material available
    in the reference cache. No prior REVIEW event existed for this disorder.

    Source coverage: read the clinical reports PMID:11489939 (full PDF),
    PMID:19417036, PMID:21252247 and PMID:26316438 (full text), the global
    knockout/islet study PMID:20670938, and the transplantation study
    PMID:26953163. Regenerated PMID:20670938 with just fetch-reference using
    the committed modern PMC adapter; this live fetch contains the real Results,
    experimental details, tables and Discussion. Regenerated PMID:37454648 as
    genuine full XML and used its diagnosis, acute management, diazoxide,
    surveillance and molecular-testing guidance with explicit general-HI scope.
    PMID:14693719 and PMID:27771675 were used as abstracts. PMID:23430856 has
    misleading full-text metadata but only a publisher preview; its proposed
    relationship between residual activity and obligatory metabolites was not
    generalized to all patients. No reference cache was hand-edited.

    Named-entity checks: Asta preflight warns that HADHA exceeds HADH mentions
    and lists mismatching OMIM identifiers. The verified HADH clinical and islet
    papers were assessed separately; long-chain/trifunctional-protein, EHHADH,
    and other fatty-acid oxidation material was excluded. OpenAI preflight passes
    on HADH mentions, but manual inspection shows disease conflation and a sole
    PMID:15254104 that concerns nitrate fertilizer rather than HADH disease.
    That report was rejected as curation evidence despite the automated pass.

    Mechanisms: split bundled processes into eleven nodes. Variable metabolite
    accumulation remains separate from the islet insulin/hypoglycemia route;
    removed the unsupported four-carbon-to-five-carbon reaction and the claim
    that fatty-acid intermediates drive hypoglycemia. Distinguished residual
    catalytic activity from protein abundance/regulatory function. The GDH
    kinetic change is an alpha-ketoglutarate affinity result in the assay that
    converts alpha-ketoglutarate to glutamate, not direct oxidative-deamination kinetics, and GTP/ADP
    allosteric responses remain intact. Amino-acid evoked ATP/calcium/secretion
    responses do not imply continuous basal hypersecretion. Established channel
    coupling is cited as background physiology, with its HADH-specific inference
    identified. Systemic insulin action is explicit between islet secretion and
    clinical hypoglycemia. The global knockout and transplant models are now
    separate, with model/assay scales and limitations; islet sufficiency does
    not establish beta-cell specificity.

    Clinical corrections: the 11/115 finding is a selected diagnostic yield,
    not worldwide prevalence and not an entirely consanguineous cohort. Its
    denominator, 5/18 consanguineous subset and alternative-transcript variant
    uncertainty are retained in genetic case fractions. The combined less-than-
    four-percent estimate for multiple genes and historical forty-case count
    were removed. Normal acylcarnitines/urine organic acids do not exclude HADH
    disease. Postprandial episodes do not exclude fasting hypoglycemia. Late
    intellectual disability/microcephaly observations do not establish an
    inevitable individual postnatal injury trajectory. Recurrent hypoglycemia
    on treatment withdrawal limits claims of resolution with age. Chlorothiazide
    is used to address diazoxide fluid retention; the unsupported pancreatic
    phosphodiesterase mechanism was removed.

    Content-completeness checklist:
    - Phenotypes: eleven supported clinical/metabolic findings retained, with
      corrected specificity, variable markers and no inferred cohort frequencies.
    - Subtypes: no established separately mapped HADH subtype was supported.
      Variant-dependent residual activity does not justify a severity taxonomy.
    - Pathophysiology: eleven atomic nodes, explicit intermediates where known,
      source-supported regulatory/energetic mechanisms and model limitations.
    - Treatments/trials: seven entries cover diazoxide, adjunctive diuretic,
      individualized diet, acute glucose, surveillance and counseling. The
      international guideline provides general HI care, not HADH-specific trial
      efficacy. No verified HADH-targeted trial, gene therapy or long-chain-FAOD
      regimen was identified in the relevant sources.
    - Genetics: causative biallelic variants, recessive inheritance, residual
      activity, deep-intronic pseudoexon activation and selected-cohort yield.
    - Diagnostics/biomarkers: critical-sample insulin-action criteria and four
      biochemical readouts, with metabolic sensitivity and exon-test limitations.
    - References: principal full-text papers actively mined for positive results,
      negative experiments and limitations; titles match the cited publications.
    - GeneReviews: the correct NBK1375/PMID:20301549 chapter is tagged. Its cache
      contains only the purpose abstract; live chapter retrieval repeatedly
      returned challenge pages, so chapter-wide clinical claims were not invented.
      This is a nonblocking source-access gap addressed with primary reports and
      the full-text international guideline. No StatPearls chapter was found.
    - Overall consumption: all central verified HADH findings in the reports
      and cached primary material are represented; off-topic mechanisms and
      speculative treatment claims were excluded after source-level review.

    Independent clinical and mechanism/model peer audits informed these changes.
    Final schema, ontology and reference validation passes with 95/95 snippets.
    The two consumers of the regenerated caches retain 269/269 verified snippets.
    History validation, causal targets, entity references, duplicate keys, coarse
    bindings and qualifier terms pass. Final targeted snippet length/grading
    checks report no violations. Repository gates pass for snippet length,
    grading, title snippets, reference titles, environmental evidence and cache
    frontmatter; page generation succeeds. The PMC provider and its companion
    frontmatter/network patches pass all 45 targeted regression tests in a fresh
    dependency environment.

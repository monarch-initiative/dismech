  summary: Recover and use the full hyperinsulinism GeneReviews chapter
  details: |
    The /sites/books/NBK1375/ route recovered the complete GeneReviews chapter
    through just fetch-reference after the canonical /books/NBK1375/ route
    continued returning challenge pages. The generated URL cache contains the
    actual chapter body, tables, management and family-risk sections, with the
    31 October 2024 update, and no challenge content. The earlier REVIEW record
    is retained unchanged as an accurate record of the initial access limitation;
    this event resolves that source-access gap.

    Read the complete clinical chapter, including its HADH-specific Table 2 row,
    genetic evaluation, treatment, surveillance and recessive family-risk sections.
    Its variable biochemical findings and diazoxide responsiveness agree with the
    primary HADH reports already curated. The chapter's selected-cohort gene
    fractions are not population prevalence; its general HI remission language
    does not supersede the HADH case with recurrent hypoglycemia on withdrawal.
    Focal KATP disease, pancreatic surgery and therapies for refractory HI were
    not imported as demonstrated HADH-specific management.

    Added the full chapter as a tagged reference, illness-related glucose
    monitoring to the existing surveillance entry, and a diagnostic assessment
    of at-risk relatives with newborn surveillance from birth. Both added
    snippets are exact continuous text in the generated chapter cache, without
    extracting a synthetic quote across embedded HTML links. Schema, ontology
    and all 97 evidence snippets pass. No reference cache was hand-edited.

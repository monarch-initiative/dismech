  summary: Initial curation of 3-hydroxyacyl-CoA dehydrogenase deficiency (HADH)
  details: |
    End-to-end de novo curation of 3-hydroxyacyl-CoA dehydrogenase deficiency (MONDO:0017715, HADH). Curated dual pathophysiology: mitochondrial short-chain fatty acid beta-oxidation block and loss of tonic allosteric inhibition of glutamate dehydrogenase (GDH/GLUD1) causing hyperinsulinemic hypoglycemia and protein sensitivity. Cites primary and landmark studies with 40 snippet-verified evidence items.

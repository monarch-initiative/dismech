  summary: Address HADH GeneReviews evidence and diagnostic binding review
  details: |
    Addressed the two requested findings in the automated review of PR 12374. Added exact full-GeneReviews HADH-table evidence for diazoxide responsiveness/severe presentations and for elevated versus normal acylcarnitine/urine-organic-acid results; added the chapter's autosomal-recessive recurrence-risk excerpt to counseling with both-carrier conditions explicit. Raw HTML entities and the source spelling are preserved; the recurrence excerpt stops before an embedded link instead of assembling noncontiguous text. The URL chapter is the full form of the already tagged PMID20301549, so no redundant overview-abstract evidence was manufactured.

    Live OLS/NCIT searches and info checks support Acylcarnitine Measurement, Genetic Screening and Supportive Care bindings. The family-screening binding is limited to familial variant testing, with additional neonatal glucose surveillance still described. Searches for organic acid/organic returned no suitable urine assay procedure, and biochemical analysis/clinical chemistry/blood glucose did not yield a procedure representing the full critical-sample assessment. These two compound/source-specific diagnoses now have explicit preferred-term descriptors and documented search limitations rather than an unrelated disease or single-analyte binding. Added a CASES_IN_LITERATURE record for the 2015 approximately-forty-patient summary, explicitly not a current total or population prevalence, and a broad verified supportive-care binding for the mixed surveillance treatment.

    The optional private-symbol adapter suggestion is deferred to adapter maintenance: this review does not alter the already tested retrieval implementation or regenerate caches. No reference cache content was hand-edited and frozen dataset-accession data were never accessed. Authoritative schema, live terms and all 105 snippets pass; relevant structural/source guards, derived-cache integrity, history and commit hooks are checked before publication.

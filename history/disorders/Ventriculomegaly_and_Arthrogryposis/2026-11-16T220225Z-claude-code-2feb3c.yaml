  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES review on PR #18304.

    Blocking: added reference_title to the two ClinGen (CGGV) evidence items under genetic[0].gene_disease_validity and diagnosis; the title was copied from the cache frontmatter. scripts/add_pmid_titles.py fills PMID items only, which is why these two were missed.

    Suggestions taken: (1) Rebound the cerebellar phenotype from HP:0001317 Abnormal cerebellum morphology to HP:0001321 Cerebellar hypoplasia, citing the ClinGen expert summary sentence that names cerebellar hypoplasia (a sentence without the narrative's erroneous "autosomal dominant" wording); the same sentence was added as a second source for the arthrogryposis and abnormal heart morphology phenotypes. (2) Added evidence to the three uncited causal edges: LOF -> VEGF receptor signalling (PMID:22048155 VEGFR2 binding, INDIRECT), neurotrophin signalling -> neuronal apoptosis (PMID:22048169 "likely to occur through neurotrophin receptor signaling", INDIRECT), cardiac developmental defect -> abnormal heart morphology (PMID:22048169 mouse heart defects, INDIRECT). (3) Split the diagnosis row into Prenatal Ultrasound (NCIT:C222238 Fetal Ultrasound Imaging, under NCIT:C25218) and Exome Sequencing (NCIT:C15709).

    CI fix: the whole-repo gate check_gene_activity_grounding failed on the first push because KIDINS220 reached the pathograph on a node with no molecular function. Added molecular_functions on the three gene-bearing nodes: GO:0005165 neurotrophin receptor binding DECREASED on the KIDINS220 loss-of-function node (the in-frame deletion reduces TrkA binding; GO annotates KIDINS220 only with generic protein binding, kinase regulator and PDZ domain binding terms), GO:0030674 protein-macromolecule adaptor activity DECREASED on the SNX27 node (IDA annotation on SNX27), and GO:0015250 water channel activity DECREASED on the AQP4 node (experimental annotations on AQP4). The same run's reference-title gate failure was the two ClinGen items above.

    Not taken: the report's ventriculostomy treatment for the liveborn child and the extra survivor phenotypes, which are only in full texts that are not cached.

    Validation after the changes: just validate-disorders passed (0 issues, 58 titles checked); count-verified-snippets 58/58; the 36 whole-repo gates from .github/workflows/main.yaml run locally with scripts/run_ci_gates.sh: all passed.

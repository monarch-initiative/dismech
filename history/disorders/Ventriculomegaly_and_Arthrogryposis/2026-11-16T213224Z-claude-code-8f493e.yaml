  details: |
    New entry for autosomal recessive KIDINS220 ventriculomegaly and arthrogryposis (VENARG, MONDO:0859184, OMIM:619501), curated from stubs/Ventriculomegaly_And_Arthrogryposis.yaml (deleted here). Claim: #18299.

    Deep research: antigravity provider (agy, model gemini-4-carbon-medium), report research/Ventriculomegaly_and_Arthrogryposis-deep-research-antigravity.md. Two runs from the repository root returned an empty response after about 60 s (exit 1, "0-character report"); the same prompt run with agy started in an empty directory produced a full report. The committed report was therefore produced by the standard research-disorder recipe with --param agy_executable pointing at a two-line wrapper that changes into an empty directory before running agy; the wrapper path is recorded in the report's provider_config. Report validation: 17/17 references resolve, needs_review true because PMID:22045431 (CTGF polymorphism, type 2 diabetes) and PMID:22194689 (HIV-1 Nef) are off topic; the report used them in place of the Kidins220 knockout papers PMID:22048155 and PMID:22048169, which the entry cites from their own cached text. Neither off-topic PMID is cited. preflight-dr: WARN for AQP4 mentions; AQP4 is part of this disease's mechanism (KIDINS220-SNX27-retromer-AQP4), not a second disease. The report pools a recessive SINO case (PMID:39296002) and lists features of the liveborn VENARG child (macrocephaly, nystagmus, thin corpus callosum, micrognathia) from full texts that are not cached; the four human case papers are cached abstract-only, so those phenotypes were not added.

    Evidence: human case reports PMID:28934391, PMID:32909676, PMID:33205811, PMID:36588759; genotype-phenotype review PMID:39296002; ClinGen Definitive AR record (CGGV assertion 6bd6659f, cached from the 2026-11-16 ClinGen export, which differs from the pinned manifest sha); mouse and cell studies PMID:22048155, PMID:22048169, PMID:34002021, PMID:35140204, PMID:22699907, PMID:19449316. The ClinGen narrative twice says "autosomal dominant VENARG" while its table and MONDO say AR; only the table row and an unaffected sentence are quoted. No GeneReviews chapter (check-genereviews NO_CHAPTER).

    Naming: kept the MONDO/OMIM label. No established KIDINS220-related name exists for the recessive disorder; "KIDINS220-related" in the literature refers to SINO syndrome, and "KIDINS220-associated ventriculomegaly" appears in a single title (PMID:36588759), recorded as a synonym.

    Pre-PR red-team review by a separate agent found nothing blocking; applied: split the retromer node into SNX27-Retromer Downregulation -> AQP4 Lysosomal Degradation with SNX27 and AQP4 gene descriptors; added evidence to the LOF->retromer and neurotrophin->dendrite edges and the dendrite deficit itself (PMID:22699907, PMID:19449316); marked the VEGFR2 binding item INDIRECT; bound bilateral clubfoot to HP:0001776; tightened prose that overstated the sources (protein absence is predicted not measured; iNPH tissue showed reduced AQP4, not water dyshomeostasis; pregnancy loss reported by one family); dropped unsourced family nationalities; added the Egyptian frameshift variant. Not taken: separate ultrasound diagnosis row, onset qualifiers, HP:0001321 for the cerebellum (the primary abstract says only "cerebellar anomalies").

    Validation: just validate-disorders passed (0 issues, 49 titles checked); count-verified-snippets 51/51; check-entity-refs, check-causal-targets, check-duplicate-keys, gene-term mismatch, check-gene-validity and the whole-KB snippet, title, folded-hyphen, block-scalar, coarse-phenotype, grading and retired-prose gates all OK. 2 of 9 phenotypes are causally connected; the others have no sourced mechanism, and the contracture mechanism is recorded as a knowledge gap.

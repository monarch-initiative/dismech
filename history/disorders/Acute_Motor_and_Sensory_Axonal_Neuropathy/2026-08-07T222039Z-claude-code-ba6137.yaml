  summary: Link Campylobacter to the mimicry node; leave SARS-CoV-2 unlinked
  details: |
    Backfill for issue #8085. Campylobacter jejuni infection is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into the Campylobacter lipooligosaccharide ganglioside mimicry node, with the anti-GM1 and anti-GD1a response as the named intervening step. Both evidence items keep the PARTIAL grade this entry already assigned them, because neither isolates an effect size for this axonal subtype as opposed to the syndrome at large, and the entry's own description warns against exactly that misreading. Two reference titles on the new items were taken from the cache records rather than copied from the sibling items, which carry ASCII transliterations of the accented originals. SARS-CoV-2 infection was deliberately left unlinked. This entry's node graph begins with a Campylobacter-specific mimicry node, and the available evidence is one case with a positive nasopharyngeal swab, which supports co-occurrence and nothing mechanistic; there is no node the exposure can honestly reach. The entry's own description already says the evidence does not establish a causal trigger, and adding a link would assert more than that. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 46 of 96 with 50 pre-existing DOI-prefix skips, and both DOI snippets on the new link were checked against their caches by hand.

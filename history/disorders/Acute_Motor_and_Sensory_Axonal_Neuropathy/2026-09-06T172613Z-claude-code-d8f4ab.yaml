  sections:
  - animal_models
  summary: Name animal models to resolve duplicate fallback labels
  details: |
    Gave each animal model in this entry a distinct name.

    The models here previously had no name, so the renderer and pathograph fell back to a genotype-plus-species label via animal_model_label. Two or more models in this file produced the identical fallback, which collapses them to a single pathograph node and makes an animal_models# entity reference ambiguous about which model is meant.

    This is not a backfill of every unnamed animal model. Across the KB 441 of 1044 models are unnamed and that is fine - name is a recommended class-local attribute, not a requirement, and models that actually reach the pathograph are named 589 times out of 607. Only 7 files had colliding labels; this is one of them.

    tests/test_data.py::test_animal_model_labels_are_unique_within_a_file now enforces the invariant, and was confirmed to fail on a real collision before being committed.

    Validation: just validate passes.

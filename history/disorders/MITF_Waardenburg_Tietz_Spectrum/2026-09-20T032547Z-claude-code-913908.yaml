  details: |
    Genetics pass for the d2g wiring-013 gap job (issue #12202). Research first: checked the committed Bookshelf index for a GeneReviews baseline and found only NBK1531 "Waardenburg Syndrome Type I", which is a different Waardenburg type; recorded that checked absence with its re-runnable query in notes:. Used the ClinGen Hearing Loss GCEP curation (CGGV assertion bc5d40d2) and the existing primary reports instead.

    Changes:
    - Bound MITF as a genes descriptor on the MITF Loss of Function pathophysiology node, which previously reached no gene, and on all three has_subtypes rows (WS2A, Tietz, COMMAD).
    - Added the ClinGen MITF / Waardenburg syndrome type 2 (Definitive) assertion as evidence on the WS2A row, including its independent statement that the mechanism is likely haploinsufficiency, which the row's description already asserted from a single 1996 family study.
    - Added TYR (hgnc:12442) to genetic: with relationship_type COOPERATING. The entry already carried a Digenic inheritance block naming TYR and the TYR(R402Q) hypomorph, but TYR was never bound, so it was invisible to any gene-level query. The notes: on the entry state explicitly that TYR is not an independent cause here.
    - Set relationship_type CAUSATIVE and variant_origin GERMLINE on the three MITF genetic entries.

    Deliberately not changed: the existing three-subtype lump/split framing, which is evidence-backed and matches MONDO's three terms; and the p.E318K melanoma-susceptibility allele, which the entry already excludes as a mechanistically distinct gain-of-function entity.

    Validation: just validate (28/28 snippets), validate-terms, and the offline gate suite all clean.

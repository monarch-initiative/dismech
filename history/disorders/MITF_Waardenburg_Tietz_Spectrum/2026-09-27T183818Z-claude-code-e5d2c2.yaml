  summary: Anchor repair off the Waardenburg class; wire TYR and all nine phenotypes
  details: |
    Anchor repair, gene wiring and phenotype wiring, for the series-069 row
    MONDO:0030983 Waardenburg syndrome 2F (KITLG).

    Anchor audit: the binding was wrong in both directions, which is why the row landed
    here. disease_term was MONDO:0018094 Waardenburg syndrome, a class that asserts no
    causal gene and whose five children span several: WS1 and WS3 (curated as
    PAX3_Waardenburg_Spectrum), Waardenburg-Shah (EDN3_EDNRB_Waardenburg_Shah), WS2, and
    WS2F, whose recorded gene is KITLG rather than MITF. It also failed the reciprocal
    test: MONDO:0007077 Tietz syndrome is filed under eye disorder, hypopigmentation of
    the skin and hereditary skin disorder, and MONDO:0015014 COMMAD directly under
    hereditary disease, so two of this entry's three subtype rows sat outside the bound
    class. I searched MONDO for MITF synonym-inclusive (runoak -i ols:mondo search
    "MITF") and the human hits are WS2A, melanoma susceptibility 8 and MIT family
    translocation renal cell carcinoma, none of them this entry; the rest are golden
    hamster, pig and Japanese quail classes. There is no MITF umbrella term to move to,
    so the ANK2 remedy applies: disease_term is now free text with no term:, and
    MONDO:0018094 is recorded as skos:broadMatch, which leaves it in the curation queue
    rather than retiring it here.

    Row ruling: declined structurally. WS2F is a KITLG disease and this entry is
    MITF-scoped, so its home is its own entry. Recorded in notes.

    Wiring, measured with dismech.qc_plugins before and after:
      genes wired into the pathograph 3/4 -> 4/4
      phenotypes with a causal inlink  0/9 -> 9/9
      pathophysiology nodes with no outgoing edge 2 of 4 -> 0 of 4
    TYR is now a node gene on Melanocyte Deficiency, which carries GO:0042438 melanin
    biosynthetic process DECREASED, because tyrosinase acts inside that step; the
    hypomorphic R402Q evidence already in the entry supports it. The two dead-end nodes
    now discharge: Cochlear Melanocyte Absence to Sensorineural Hearing Impairment, and
    Pigmentary Abnormalities to White Forelock, Heterochromia Iridis, Generalized
    Hypopigmentation and Albinism, which is the patchy-to-generalized-to-absent axis the
    node's own notes describe. The four non-melanocytic COMMAD features (coloboma,
    microphthalmia, osteopetrosis, macrocephaly) are wired from the lesion node rather
    than from the pigmentary one, because the COMMAD report attributes them to MITF
    itself and not to melanocyte loss.

    Not a finding, reported instead: PAX3_Waardenburg_Spectrum binds the same
    MONDO:0018094 as its disease_term. Its own rows, WS1 and WS3, are both inside that
    class, so it fails only the over-broad test, not the reciprocal one. It is not one of
    this issue's parents and its anchor is left to its owner.

    Validation on the committed tree: just validate 0 issues; just validate-terms
    passed; just count-verified-snippets 38/38.

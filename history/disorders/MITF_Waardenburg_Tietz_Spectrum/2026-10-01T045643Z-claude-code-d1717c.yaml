  summary: 'Review round on PR 13265: re-source the heterochromia edge'
  details: |
    Review round 1 on PR #13265. Blocking finding: the Pigmentary Abnormalities to Heterochromia Iridis edge cited PMID:7874167 with a snippet describing where MITF is expressed - adult skin, embryonic retina, otic vesicle and hair follicles. That sentence names no iris, no heterochromia and no melanocyte loss, and the embryonic retina it names is not where iris stromal melanocytes sit, so it was not a premise for the edge at all and directness INDIRECT could not repair it. Searched Europe PMC for a Waardenburg source covering the iris and fetched PMID:32809714, whose abstract supplies both halves: heterochromia or hypopigmented irides named among the hallmark features, and the mechanism step that affected individuals exhibit abnormal melanocyte distribution because melanocytes develop from the neural crest. Both items are typed directness INDIRECT and quote_role REVIEW_SYNTHESIS, because the review covers Waardenburg syndrome across its types rather than the MITF form specifically. PMID:7874167 remains cited three times elsewhere on claims it does support. Also on the White Forelock edge, whose explanation had carried an inference step in prose, directness INDIRECT is now recorded with an explanation stating that the quoted sentence is the generic WS2 statement and does not name the forelock. In mapping_justification the opening sentence described this entry's own binding history; it is recast as a statement about why MONDO:0018094 cannot be the disease_term. The negative-existence claim in that field was re-run before commit as the reviewer asked: runoak -i ols:mondo search MITF returns seven hits, and the note's reading holds - the human hits are MONDO:0008671 Waardenburg syndrome type 2A, MONDO:0013759 melanoma susceptibility 8 and MONDO:0017886 MIT family translocation renal cell carcinoma, none of them an MITF umbrella - but the note listed three non-human classes where the query returns four, so horse white spotting coat colour MONDO:7770069 is added alongside the golden hamster, pig and Japanese quail classes. Noted and deliberately not changed: the three MITF genetic records share a name, which is pre-existing on main and correct, each being scoped by subtype to WS2A, Tietz and COMMAD. Validation: just validate and just validate-terms pass, count-verified-snippets 165/165 across this round's four files.

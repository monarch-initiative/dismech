  summary: 'Create: Dilated Cardiomyopathy 1E (SCN5A)'
  details: |
    Curated CMD1E (SCN5A, MONDO:0011003; ClinGen Definitive). The mechanistic outlier of the DCM series: the causal protein is an ion channel with no structural role, and the same gene's other alleles cause the primary channelopathies curated elsewhere (Brugada, PCCD). Founding allele D1275N cosegregates with a composite DCM plus atrial fibrillation plus impaired automaticity plus conduction delay phenotype. Two caveats deliberately preserved: the channel-to-structure link is curated as INDIRECT_UNKNOWN_INTERMEDIATES with supporting model evidence marked PARTIAL because it derives from the conduction-disease phenotype, and the founding study's caution that similar or identical mutations may cause heart failure, arrhythmia or both is curated on the endpoint node so no genotype-predicts-arm claim is made. Stub deleted; added to grouping. 13 snippets verified.

  summary: Curate CPVT1 (RYR2) within the disease-level CPVT root
  details: |
    Curated catecholaminergic polymorphic ventricular tachycardia 1 (CPVT1, MONDO:0011484, RYR2). Duplicate preflight showed CPVT1 is already covered in substance by kb/disorders/RYR2_CPVT.yaml, the disease-level CPVT root keyed to the umbrella MONDO:0017990 (design decisions in PR #1165 and #7227), which lists CPVT1 as a synonym; open PR #7452 independently states CPVT1 is already curated in this file. Augmented the existing entry rather than creating a duplicate. NEC preflight via OAK: MONDO:0011484 name catecholaminergic polymorphic ventricular tachycardia 1, causal gene RO:0004003 HGNC:10484 RYR2, xrefs OMIM:600996 and OMIM:604772, is_a MONDO:0017990 - confirmed before use. Both deep-research reports contained errors caught by OAK: the claude_code report asserted MONDO:0011001 for CPVT1 (wrong) and CL:0002355 for cardiac Purkinje myocyte (actually primitive red blood cell); neither was used. Added: disease-level skos:narrowMatch mapping to MONDO:0011484; has_subtypes for CPVT1 (fully curated, bound to MONDO:0011484) plus verified stubs for CPVT2 to CPVT5 (each MONDO term and gene checked against sqlite:obo:mondo and agreeing with the existing genetic section); classifications.channelopathy_category with evidence; four new pathophysiology nodes modelling the competing molecular accounts of the RYR2 gain-of-function lesion (SOICR luminal-calcium sensing, calstabin-2/FKBP12.6 dissociation, interdomain unzipping, primed-state conformation) with causal edges opting into four new mechanistic_hypotheses groups (CANONICAL, ALTERNATIVE, ALTERNATIVE, EMERGING); a CONTROVERSY discussion recording the directly contradictory FKBP12.6 replication failure, also curated as a REFUTE evidence item on the node it disputes; an INTERPRETATION discussion recording the RYR2 loss-of-function versus calcium release deficiency syndrome boundary; and pediatric-cohort evidence for combined beta-blocker plus flecainide therapy. Deep research: falcon was attempted first but the Edison API returned HTTP 402 Payment Required, so the claude_code provider was used as fallback (research/RYR2_CPVT-deep-research-claude_code.md); the pre-existing falcon report for this slug was also read. DR outputs were treated as leads only. New references fetched with just fetch-reference: PMID:16239587, PMID:12837242, PMID:20224043, PMID:39278969, PMID:37558302, PMID:39733778, PMID:38542006, PMID:38053087, PMID:38464671. No cache file was hand-written. Validation: just validate passes for schema, terms and references with 84/84 snippets verified; all 24 new-reference snippets were additionally re-verified independently against the cached abstracts; 5577 targeted structural tests pass; weighted compliance 91.1 percent. Deliberately not curated: RYR2 loss-of-function and CRDS content, and no frequency band was back-derived from the composite 43.5 percent neuropsychiatric endpoint in the Korean pediatric cohort.

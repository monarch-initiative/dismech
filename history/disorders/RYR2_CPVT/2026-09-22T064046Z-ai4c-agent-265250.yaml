  details: |
    PR Shepherd round answering the 2026-08-27 CHANGES_REQUESTED review.

    IMPORTANT 1 (snippet does not state per-gene tiers). Took the reviewer's Option A. The three CALM genetic entries asserted specific ClinGen tiers while their only supporting snippet ("Seven genes had definitive to moderate evidence...") establishes the range and the AD/AR split but never says which gene sits at which tier. Added the ClinGen structured rows as separate evidence items:

    - CALM1 CGGV:assertion_1ca1d8df-10fa-48ef-aea4-fb4dc6564dd0-2021-06-17T160000.000Z
    - CALM2 CGGV:assertion_42d280da-accc-46f2-8832-47d5a3eeeba7-2021-06-17T160000.000Z
    - CALM3 CGGV:assertion_1b7fc965-a109-4448-94a0-00a9b078b484-2021-06-17T160000.000Z

    Each carries the gene-disease validity table row verbatim, so each gene's Moderate/AD tier is now quoted from ClinGen rather than inferred. The three PMID:34557911 explanations were reworded to claim only what that sentence supports. Cache files were generated with `just clingen-rebuild --id`, which works per-assertion and is unaffected by the data/clingen/MANIFEST.yaml checksum drift that blocks `just clingen-refresh`; no bulk rebuild was performed and the manifest is untouched.

    Correction to the review: the CALM3 "scored Limited and manually upgraded to Moderate" claim is NOT unverifiable. The reviewer could not confirm it because the ClinGen CSV records only the final tier, but the report-page narrative that clingen-rebuild fetches states it directly: "CALM3 scored with limited evidence of association with CPVT but was upgraded to a Moderate classification by the expert panel." That sentence is now cited as a fourth evidence item, so the claim is retained rather than dropped.

    IMPORTANT 2 (evidence_source). The three PMID:34557911 items were HUMAN_CLINICAL; Walsh et al is an expert-panel evidence reappraisal, which CLAUDE.md files under OTHER. Changed all three to OTHER, matching kb/disorders/ANK2_Ankyrin_B_Syndrome.yaml and this file's own CGGV item. All three occurrences of that quoted sentence in this file now agree, so no snippet-grading divergence is introduced.

    Suggestion (b), partially taken. Cached and cited PMID:18463378 (Wilde et al 2008 NEJM) on the LCSD treatment. Important caveat recorded in the evidence explanation: that abstract does NOT describe the surgical anatomy, so it supports the indication and long-term-efficacy sentences, not the caudal-stellate/T2-T4/Horner-sparing extent. The anatomy correction that is this PR's central claim therefore remains unevidenced and needs a full-text surgical-technique source.

    Suggestion (c) taken: PMID:34557911 added to the top-level references block.

    Suggestion (a) NOT taken, deliberately. GeneDiseaseRelationshipEnum has no value corresponding to ClinGen Moderate: CAUSATIVE is defined as "Definitive or Strong", DISPUTED as "Disputed or Refuted", and UNKNOWN as unclassified. Setting relationship_type to any of these would assert something false, so it is left unset and association is left as authored. Closing the gap is a schema question, not a curation one, and is raised on the PR.

    Validation: just validate passes (schema, terms, 92/92 snippets verified, up from 87/87). check-duplicate-keys and check-entity-refs pass. No retired enum values in the file and no merge conflicts against origin/main, so the branch was not refreshed.

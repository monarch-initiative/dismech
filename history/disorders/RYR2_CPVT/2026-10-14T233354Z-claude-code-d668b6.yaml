  details: |
    Added the heterozygous Calm1 N54I knock-in mouse (PPR:PPR1322481) as an animal model with four modeled_mechanisms links: RECAPITULATES Calmodulin Dysfunction, Diastolic Sarcoplasmic Reticulum Calcium Leak and Triggered Ventricular Arrhythmia, and PARTIALLY_RECAPITULATES Sinoatrial Node Dysfunction. The source is a preprint, so no pathophysiology node, phenotype or genetic claim rests on it; the model's own existence and measurements are what it supports. Five readouts include two negatives read as results: the normal baseline surface ECG and the atrial/conduction findings that do not match this entry's low-sinus-rate account of sinoatrial dysfunction, which is why that link is PARTIALLY_RECAPITULATES. The source gives the variant as an N54I-equivalent substitution without naming a human kindred, recorded in model notes rather than reconciled with the p.Asn53Ile variant the entry cites from PMID:23040497. validate-disorders passes with 98/98 snippets verified.

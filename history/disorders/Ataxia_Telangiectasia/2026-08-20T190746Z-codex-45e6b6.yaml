  summary: Add computational models for Ataxia-Telangiectasia
  details: |
    Curated three complementary computational models spanning a qualitative ATM/ATR DNA-damage-response ODE, allele-specific ATM p.Ala2386Glu structural predictions, and a normative diffusion-perfusion MRI autoencoder. Each entry is linked only to the exact pathophysiology node it directly represents or measures, with structured readouts, conservative fidelity assessments, primary evidence, validation boundaries, and explicit reproducibility limitations.

    The released ODE SBML and BioModels copy were inspected, cross-compared, parsed, and smoke-run; the curation records the artifact count mismatch, absent disease scenario files, qualitative units, and source-specific licensing. The autoencoder repository was pinned and audited; the curation records missing weights and data-preparation code plus the four-versus-five latent-dimension paper/code mismatch. PubMed caches were generated through the repository fetch workflow and all evidence snippets validate against cached primary sources.

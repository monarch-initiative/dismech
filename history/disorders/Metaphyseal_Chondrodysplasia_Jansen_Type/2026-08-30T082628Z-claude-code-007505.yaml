  details: |
    Takes the three non-blocking suggestions from the round-2 review on PR #10146, pushed while that round's re-review was still in flight.

    Thiazide Diuretic for Hypercalciuria gains therapeutic_agent NCIT:C49185 Thiazide Diuretic. The source says thiazide diuretic without naming a drug, so the class term is the right grain rather than binding a specific agent the literature does not specify.

    The limitations slot on the T410R link to Renal and Skeletal Calcium Mobilization was carrying a readout caveat, not a fidelity caveat. Reported as an acute normalisation after a single injection, durability under chronic dosing is not addressed described the inverse-agonist measurement rather than the model's faithfulness to the node, so it moved into the readout's interpretation. The link now carries the fidelity caveat it should have had: the allele is T410R, the milder end of the human spectrum and not the common H223R, and murine mineral-ion handling differs from human in calcium set point and renal phosphate response, so the magnitude of the abnormality does not transfer even though its direction and PTH-independence do.

    Schmid metaphyseal chondrodysplasia added as a differential. The reviewer's point was that the section listed only Blomstrand, which the entry itself says is not clinically confusable, and none of the differentials that actually arise. Schmid is far commoner and shares the metaphyseal flaring and irregularity, so radiography alone does not separate them. The discriminator is the biochemistry this entry stakes JMC's identity on: normal calcium and phosphorus metabolism in the rest of the metaphyseal chondrodysplasia group against PTH-independent hypercalcaemia in JMC. Cited to PMID:8644413, a Danish case report of a Schmid patient treated as rickets, which states both the group membership and the discriminator.

    Validation: linkml-validate clean, linkml-term-validator --labels clean, 82/82 snippets verified, entity references resolve, no duplicate keys, all four baseline gates report no new divergences. One new reference cache, no cache row changes.

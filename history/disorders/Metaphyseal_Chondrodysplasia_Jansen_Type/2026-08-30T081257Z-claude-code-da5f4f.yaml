  details: |
    Second review round on PR #10146.

    Blocker fixed: references_cache/PMID_40455993.md was cited five times by the humanized T410R-PTH1R knock-in animal model but was absent from the pushed branch, so four snippets failed to verify. Root cause was mine and worth recording: the list of cited PMIDs used to prune uncited reference caches was generated before the animal-models section was added, so the cleanup pass deleted a cache the entry had started citing. The same pass deleted PMID_31977144.md, which the notes still claimed was cached. Both are restored via just fetch-reference; 80/80 snippets now verify.

    Chronic kidney disease added as a phenotype (HP:0012622, OCCASIONAL). The natural-history cohort reports two of 24 patients with advanced chronic kidney disease, which is the clinical endpoint the entry already models as a pathophysiology node but had not surfaced as a phenotype.

    Hypertension added as a phenotype (HP:0000822, no frequency band). The first draft excluded it because the only dedicated report is a single neonate whose own title poses the association as a question. That reading was too narrow: GeneReviews independently instructs clinicians to measure blood pressure at every visit and to treat elevation with angiotensin-pathway drugs, which is a disorder-specific management recommendation rather than a one-patient observation. The case report is attached as a second item graded directness INDIRECT, since one case with a negative secondary workup is consistent with but does not establish a causal link to the receptor defect. The notes block was corrected to record the reversal rather than leaving the original exclusion argument standing.

    Genetic counseling evidence added to the inheritance block: the GeneReviews 50 percent per-child transmission statement, which is what counseling actually turns on and which the mode-of-inheritance quote alone does not carry.

    Epidemiology explanation made honest about provenance: the cohort size of 24 is stated in the study objectives rather than its results, because it describes the cohort assembled and not a finding measured in it. The quote is left in place as the only source for the number, with the explanation now saying so.

    Validation: linkml-validate passes, linkml-term-validator passes with labels, entity references resolve, no duplicate keys, 80/80 snippets verified.

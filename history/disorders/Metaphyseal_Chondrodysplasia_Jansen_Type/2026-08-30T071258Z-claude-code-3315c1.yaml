  summary: 'Create: Metaphyseal Chondrodysplasia, Jansen Type'
  details: |
    De novo curation of Jansen metaphyseal chondrodysplasia (MONDO:0007982, PTH1R), using GeneReviews PMID:40638774 as the phenotype baseline plus the 24-patient natural-history series and the SIK/HDAC mechanism work. One OpenScientist deep-research report was generated and read; it was the cleanest of this batch, with 32/32 references verified and 33/34 terms verified, its single label mismatch being the obsolete GO:0007050, which is not used. Notably this report declined to guess a MONDO ID, writing that it was not resolved, where three of the other four reports in the batch supplied a disease-level MONDO term naming a different disease. Two validator catches: a first draft quoted the article title of PMID:11713230 as animal-model evidence and the reference validator rejected it; reading the actual abstract supplied a better sentence and corrected a factual error, since the transgene rescues PTHrP-null lethality but does not prevent perinatal lethality in receptor-null mice, which the draft had conflated. Separately the inverse-agonist snippet failed to match because bracketed residue notation is stripped before matching; rather than widen conf/reference_validator_config.yaml for one quote, the snippet was shortened to a bracket-free span. Named Entity Confusion: Chung-Jansen syndrome (PHIP) shares only the eponym and nothing was cited across. Validated with just validate (53/53 snippets verified), check-entity-refs, check-duplicate-keys, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens.

  details: |
    Answers the two actionable suggestions from the approving review on PR 12015 (review 5238573131). The review found no blocking issues; both items below were marked optional and are taken because each corrects a statement the file makes about itself.

    1. The lowest interpretation band overreached its own reference interval.

    The band "Below 500 cells/uL" carries no lower_bound, so under the half-open [lower, upper) convention it covers every result below 500 - including results beneath the 50 cells/uL floor that the same reference_ranges block asserts. Its interpretation opened "Within the laboratory reference interval", which is false for a result of, say, 20 cells/uL.

    The opening clause is now "At or below the reference interval's upper limit", which is true across the whole band, and the text states explicitly that sub-50 results fall here too and are deliberately not graded LOW. abnormal_flag stays NORMAL and no fourth band was added, for two reasons recorded in the text: no cited source addresses eosinopenia, so a LOW band would be unsourced; and in treated disease a near-zero count is the therapeutic goal rather than an abnormality, so flagging it LOW would be clinically wrong for this entry. Splitting the band at 50 was considered and rejected - it would have dropped a treated patient at 20 cells/uL into an ungraded gap and lost the hematologic-remission reading the band also carries.

    2. quote_role was missing on every quote of one structured BACKGROUND sentence.

    PMID:19910029's definitional sentence is quoted four times in this file - on the eosinophil-expansion pathophysiology node, on the tissue-infiltration node, on the Increased total eosinophil count phenotype, and in diagnosis - each time with the literal NLM label "BACKGROUND:" inside the snippet, and none carried quote_role. The same sentence is tagged quote_role BACKGROUND on the biochemical readout this PR added, so the file disagreed with an assessment it already contained.

    All four now carry quote_role: BACKGROUND. evidence_source stays HUMAN_CLINICAL on each: the quoted sentence states the human clinical definition, and quote_role records that the citing paper is a retrospective analysis restating it rather than the source of it. The review flagged only the phenotype instance; the other three are the same sentence making the same claim, and tagging one while leaving three would reproduce the inconsistency the suggestion is about.

    Note that just list-background-citations reports 0 findings on this file. Tier A locates a snippet's zone by string containment, and these snippets begin with the label rather than sitting after it, so the tool is silent. This was a read-the-sentence catch, not a tool catch.

    Not taken: the review's third suggestion, that the diagnostic: true phenotype is bound to HP:0001880 (increased total eosinophil count, at or above 0.5 x 10^9/L) where HP:0032061 matches the 1.5 x 10^9/L threshold the syndrome is defined by. The review itself scopes it to a separate PR and the evidence attached to that phenotype quotes the 1.5 threshold, so the rebinding needs its own evidence review rather than riding along here.

    Validation: just validate-disorders over both files passes with 131/131 snippets verified against committed caches, plus the offline gate battery.

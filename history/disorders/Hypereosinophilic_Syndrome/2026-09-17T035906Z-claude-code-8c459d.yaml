  summary: Add the absolute eosinophil count biomarker with its diagnostic bands
  details: |
    Added an `Absolute eosinophil count` biochemical record: the measurement this entry is
    defined by, which existed in the file only as prose and as numbers inside quoted
    snippets, with nothing queryable behind them.

    The record carries a LOINC binding (LOINC:26449-9, the absolute-count code, PROPERTY
    NCnc - verified against the NLM Clinical Table Search Service rather than written from
    memory, since LOINC has no adapter in conf/oak_config.yaml and no gate in this repo
    resolves the CURIE), a biomarker_term of NCIT:C188680 (Absolute Eosinophil Count), a
    laboratory reference interval of 50 to 500 cells/uL, three interpretation bands, and a
    readouts link joining it to the pathograph.

    Unlike the Asthma blood eosinophil count record, this one does assert a laboratory
    reference interval, because a source states one directly: PMID:39056762 gives the adult
    AEC normal range as 0.05 to 0.5 x 10^9/L. The bands are the diagnostic tiers of the
    eosinophilic-disorder classification rather than severity grades, and every boundary is
    quoted:
    - below 500 cells/uL, NORMAL - the reference interval, and also the hematologic
      remission target on treatment (PMID:39056762).
    - 500 to 1499 cells/uL, HIGH, phenotype_term HP:0001880 - eosinophilia by the ICOG-EO
      classification but below the hypereosinophilia threshold (PMID:39056762,
      PMID:38611061).
    - 1500 cells/uL or greater, HIGH, phenotype_term HP:0032061 - hypereosinophilia. The
      HPO definition of that term is itself the threshold, "more than 1.5 billion cells per
      liter", so the band and the phenotype agree by construction.

    Unit conversion is recorded in notes: the sources state the boundaries as 0.05, 0.5 and
    1.5 x 10^9/L, and the record converts to cells/uL so the values sit on the same scale as
    the KB's other blood eosinophil records. Each snippet keeps its source's own form. The
    notes also record that because the sources define eosinophilia as at or above
    0.5 x 10^9/L, a result of exactly 500 cells/uL falls in the eosinophilia band rather
    than inside the reference interval.

    No new references were fetched - every source was already cached and cited elsewhere in
    these two entries. PMID:19910029's threshold sentence sits in that paper's structured
    BACKGROUND paragraph and is recorded as quote_role BACKGROUND.

    Validation: just validate-disorders over both files passes (schema, terms, references;
    131/131 snippets verified), plus the offline gate battery. just normalize-cache re-sorted
    two pre-existing mis-ordered rows in cache/mondo/terms.csv and the diseaseterm enum
    cache; that drift predates this change and is surfaced rather than reverted.

    This entry's biochemical block was previously empty. The readout targets
    "Persistent eosinophil expansion in blood and tissues"; its interpretation records that
    the blood count measures only the circulating half of that node, so a normal count does
    not exclude tissue hypereosinophilia.

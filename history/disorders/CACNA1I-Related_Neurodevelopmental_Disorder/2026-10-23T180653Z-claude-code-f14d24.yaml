  summary: 'Create: CACNA1I-Related_Neurodevelopmental_Disorder'
  details: |
    New entry for MONDO:0859313 (OMIM:620114), the autosomal dominant
    neurodevelopmental disorder caused by heterozygous CACNA1I missense
    variants. It replaces the stub
    Neurodevelopmental_Disorder_With_Speech_Impairment_And_With_Or_Without_Seizures,
    decided as a single DISEASE entry with no subtypes: the reported
    patients form one allelic series in one gene, and the gain-of-function and
    partial loss-of-function alleles are modelled as two separate molecular
    nodes rather than as subtypes.

    Sources. The clinical and mechanistic content rests on the two cohort
    reports from the discovering group (PMID:33704440, 2021, six patients;
    PMID:40825030, 2025, four patients), both cached with full text, plus a
    2026 case report of brain iron accumulation (PMID:41147801, abstract only),
    the group's review (PMID:36592228), the Cav3.3 knockout mouse papers
    (PMID:21808016, PMID:26612388), a Pakistani family with a de novo
    p.Tyr1524Cys variant (PMID:41751541) and, for differentials, the CACNA1G
    cerebellar atrophy report (PMID:29878067) and the Swedish schizophrenia
    allelic series (PMID:34919654).

    Deep research. An OpenScientist report was generated and is committed
    with its citations file and artifacts. All 13 of its references resolved
    and none was off topic; its term section flagged an obsolete CHEBI CURIE
    for ethosuximide (not used; CHEBI:4887 is bound) and placeholder labels
    for the HPO terms. just preflight-dr returned PASS with no warnings:
    CACNA1I, MONDO's causal gene, is mentioned 52 times, against 6 for
    CACNA1G, and MONDO's OMIM xref is 620114. The report was used as a
    lead list; it supplied PMID:26612388, PMID:29878067 and PMID:34919654.
    Its references not cited in the entry: PMID:25071191 (knockout mice show
    enhanced drug-induced absence seizures, a loss-of-function result not
    needed for any claim), PMID:36865984 (an autoantibody study in
    schizophrenia), PMID:35220405 and PMID:35079122 (schizophrenia and autism
    risk), PMID:40165594 (a T-type blocker in rat absence-epilepsy models, not
    tested in this disorder), PMID:17535809 (muscarinic modulation of Cav3.3),
    PMID:41798403 (an autism case with a CACNA1I variant of uncertain
    significance) and PMID:41791021 (a child with a CACNA1I variant and a
    homozygous LRP5 variant, mentioned only in the gene notes). The report's
    statement that the variants are never somatic was not taken over:
    PMID:40825030 reports an allele balance suggesting mosaicism for
    p.Ala398Glu.

    Mechanism. Gain-of-function gating (HEK293T patch clamp) leads to larger
    window currents and calcium influx and, in NEURON simulations, to
    hyperexcitable thalamic reticular neurons. The three downstream
    explanations offered by the authors (calcium overload of developing
    neurons, reticular neuron hyperexcitability causing seizures, and
    disturbed sleep spindles) are recorded as EMERGING mechanistic hypotheses
    and every edge belonging to them is tagged and marked as indirect. Seven
    single-patient phenotypes (reflux, growth retardation, stereotypy, ADHD,
    psychosis, sleep apnoea, brain iron) have no causal edge because no source
    proposes a mechanism for them. Phenotype frequencies are omitted because
    the case count is about a dozen.

    Validation. just validate, just validate-terms and
    just count-verified-snippets (97/97) passed, as did the entity-ref,
    causal-target, duplicate-key, qualifier-term, gene-term-mismatch,
    snippet-length, snippet-grading, title-snippet and reference-title
    checks, and just validate-disorders on the file. check-genereviews
    reports NO_CHAPTER. No ClinGen gene-disease validity record for this
    pair is cached.

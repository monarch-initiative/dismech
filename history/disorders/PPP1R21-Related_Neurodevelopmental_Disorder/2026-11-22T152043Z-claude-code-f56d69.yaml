  summary: 'Create: PPP1R21-Related Neurodevelopmental Disorder'
  details: |
    New entry for MONDO:0859165 (OMIM:619383), curated from the committed Perplexity deep-research report as leads, with every snippet taken from cached abstracts of the PPP1R21 gene-discovery papers (PMID:30520571, PMID:29808498), the adult case report (PMID:32985083), the proteasome study (PMID:36692708), the 11-individual expansion (PMID:38356149), the 2026 literature review (PMID:42570139), the GeneReviews chapter (PMID:41570170), the FERRY-complex review (PMID:40062705) and the TBCK-PPP1R21-FERRY3 RAB5-GAP paper (PMID:41789809). Renamed from the MONDO phenotype label to PPP1R21-Related Neurodevelopmental Disorder under the entry-naming rules; MONDO, OMIM and GeneReviews names kept as synonyms. ClinGen classification recorded as Definitive from the current ClinGen export (re-evaluated 2026; the committed snapshot still shows Strong). The deep-research report claimed Definitive and listed OMIM:620852, which is the separate WBP4 disorder and was excluded. The causal link from fibroblast endosomal dysfunction to the brain abnormalities is recorded as indirect, with a knowledge-gap discussion noting that no neural model exists.

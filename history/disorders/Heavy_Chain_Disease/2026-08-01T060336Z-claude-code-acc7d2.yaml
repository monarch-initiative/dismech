  summary: 'Create: Heavy_Chain_Disease'
  details: |
    De-novo curation of heavy chain disease MONDO:0019464 for issue 7559. Deep research via Edison/Falcon produced research/Heavy_Chain_Disease-deep-research-falcon.md in 429s with 14 citations and 1 artifact, but it was a single-source synthesis of the Ria 2018 review, so the evidence base was rebuilt from PubMed E-utilities directly. Core model is the CH1-deletion mechanism as an explicit five-node causal chain: somatic IGH deletion, loss of CH1 and failure of light-chain pairing, escape from BiP-dependent ER quality control, secretion of the truncated light-chain-free heavy chain, and unassembled free light chain excess in mu-HCD. An emerging antigen-independent BCR-aggregation amplifier arm is carried as a mechanistic_hypotheses group. Three subtypes modelled: alpha-HCD as IPSID/Mediterranean lymphoma with C. jejuni and antibiotic responsiveness, gamma-HCD as Franklin disease with autoimmune association and palatal oedema, and mu-HCD as a CLL/SLL-like marrow neoplasm with vacuolated plasma cells, Bence Jones proteinuria, and MYD88 L265P. Conformance to tumor_promoting_inflammation#Chronic Inflammatory Stimulus is claimed on both trigger nodes. Conformance to the module Pro-Tumorigenic Inflammatory Microenvironment node was deliberately NOT claimed for lack of myeloid-microenvironment evidence. Structured differential_diagnoses with bound MONDO terms cover MALT lymphoma, Waldenstrom macroglobulinemia, multiple myeloma, MGUS, CLL/SLL, celiac disease, and heavy chain deposition disease. Prevalence is recorded honestly as CASES_IN_LITERATURE per subtype with no invented rates. Entry size: 19 phenotypes, 11 pathophysiology nodes, 7 treatments, 7 structured differential diagnoses, 5 genetic entries, 4 histopathology findings, 123 evidence items over 16 distinct PMIDs. A self red-team pass against the dismech-pr-review skill before opening the PR found and fixed: a truncated BCR-aggregation snippet that stopped before the claim it supported (3 occurrences), a dangling causal edge to Villous Atrophy which existed only under histopathology and is not a graph node section, an uncaused Antigen-Independent B-Cell Receptor Aggregation node now wired downstream of the CH1-loss node, a frequency band of OCCASIONAL on recurrent respiratory infections that the source explicitly calls rare, a Plasma Cell Neoplasm category that contradicted the entry's own ICD-O reasoning and its cited source, and an under-consumed treatment source. Validation: just validate PASS for schema and terms, just validate-terms PASS, validate-references PASS at 121/121 snippets, compliance 85.2 percent global and 85.3 percent weighted, compliance-connectivity clean with all phenotypes and all causal genes wired, dismech.graph --validate reports no orphan targets. Term corrections made during curation: GO:0051082 rejected as obsolete and replaced with GO:0051087, MAXO:0000647 and MAXO:0000088 absent from the TreatmentActionTerm enum and replaced with NCIT:C15632 and NCIT:C15447, HP:0011473 absent from HistopathologyFindingTerm and replaced with NCIT:C38731, MONDO:0009693 label corrected to plasma cell myeloma, and NCIT:C63450 avoided as a retired CHOP concept in favour of NCIT:C9549.

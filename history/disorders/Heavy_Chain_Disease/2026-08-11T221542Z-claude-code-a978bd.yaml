  details: |
    Backfill for issue #8085. Both exposures point at the chronic enteric antigenic stimulation node, which names Campylobacter jejuni as the most convincingly implicated source of the sustained antigenic drive it describes. The organism link is TRIGGERS with DIRECT on that wording, but no item on it is graded supporting, and the reason is the entry's own: causal weight remains debated and the organism is neither necessary nor sufficient in every case. Two items were added beyond the exposure's own evidence, both taken from sentences this entry already cites on the target node. The first is the source study's conclusion, that the organism and the disease are associated and that it should be added to the list of pathogens responsible for immunoproliferative states, which is the strongest wording available and still only associative. The second is the controversy sentence from a separate review, stating that the link is established but the organism's role in pathogenesis is contested; it is carried on the link so the dispute travels with the claim rather than sitting where a reader of the pathograph would never meet it. The link description now states outright that the triggering effect and the directness are inherited from the node rather than asserted by any cited sentence, so that inference does not have to be re-derived. The socioeconomic exposure is graded below the organism at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, since it is an epidemiological pattern rather than an agent; what makes it a claim about this node at all is that the source reads the pattern as suggesting an environmental and probably infectious mechanism. Validated with linkml-validate and just validate-terms.

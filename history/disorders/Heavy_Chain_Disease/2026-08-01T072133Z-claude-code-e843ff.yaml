  summary: 'Address PR review: Heavy_Chain_Disease'
  details: |
    Round-two curation of heavy chain disease in response to the automated review on PR 7614, plus a self red-team pass. Supersedes the count figures in the CREATE record for this slug, which described the entry as it stood at first push. Both IMPORTANT review findings fixed: subtype_term bindings added to all three subtypes using MONDO:0015045 alpha-heavy chain disease, MONDO:0015046 gamma-heavy chain disease, and MONDO:0015044 mu-heavy chain disease, all verified non-obsolete and all direct is_a children of MONDO:0019464; and a distinct Radiation Therapy treatment added using NCIT:C15313 with therapeutic_modality RADIOTHERAPY, covering total abdominal radiation for refractory alpha-HCD and local radiation for localised extranodal gamma-HCD. Suggestions implemented: the antigen-independent BCR snippet continuation carrying the growth-advantage clause added as a second evidence item at all three occurrences, since a PDF page break makes a single contiguous quote impossible; a Surgical Procedure treatment added using NCIT:C15329 targeting both the infiltration node for localised resection and the transformation node for bowel complications; four advanced-disease phenotypes added with frequency deliberately omitted, namely Ascites HP:0001541, Anasarca HP:0012050, Intestinal Obstruction HP:0005214 for alpha-HCD and Thrombocytopenia HP:0001873 for gamma-HCD; and Anasarca rebound from the two-levels-broader HP:0000969 Edema to the exact-match HP:0012050. One suggestion declined with reasoning accepted by the reviewer: rheumatoid arthritis stays a phenotype rather than moving to comorbidities, because it is wired as a downstream target of the Chronic Autoimmune B-Cell Stimulation trigger and moving it would sever that edge. Earlier self red-team fixes in the same round: extended a truncated BCR snippet that stopped before the claim it supported, resolved a dangling causal edge to Villous Atrophy which existed only under histopathology and is not a graph node section, wired the previously uncaused BCR aggregation node downstream of the CH1-loss node, corrected recurrent respiratory infections from OCCASIONAL to VERY_RARE where the source says rare, replaced a Plasma Cell Neoplasm category that contradicted the entry's own ICD-O reasoning, and consumed the previously under-used PMID:32245744 therapy content. The branch was also rebased onto origin/main to clear a merge conflict confined to sorted term-cache CSVs, with a set-diff audit confirming zero net term loss. Final entry state: 23 phenotypes, 11 pathophysiology nodes, 9 treatments, 7 structured differential diagnoses, 5 genetic entries, 4 histopathology findings, 3 biochemical markers, 3 knowledge-gap discussions, 134 evidence items over 16 distinct PMIDs. Validation: just validate PASS, just validate-terms PASS, validate-references PASS at 132/132 snippets, compliance 84.6 percent global and 84.7 percent weighted, compliance-connectivity clean, dismech.graph --validate clean. PR 7614 approved by ai4c-reviewer after these changes.

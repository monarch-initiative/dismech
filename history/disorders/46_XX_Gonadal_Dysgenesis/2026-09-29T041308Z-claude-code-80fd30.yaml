  summary: Estrogen receptor binding decision on the estrogen-annotated node
  details: |
    Fourth tranche of the estrogen-signalling pathograph work in issue #12925.
    No estrogen receptor gene is bound on the PSMC3IP-Related Oocyte Dysfunction
    node, and the node carries a recorded reason instead.

    The issue lists this node among fourteen that bind GO:0030520 while naming
    no gene. That premise does not hold here: the node already carries
    genes: PSMC3IP (hgnc:17928), so it is not gene-less and it already
    satisfies the gene-to-mechanism wiring metric.

    The defect PMID:21963259 demonstrates is in a coactivator of
    estrogen-driven transcription rather than in the receptor. The variant
    abolishes PSMC3IP activation of that transcription while the receptor
    itself is intact, so the gene the node is about is PSMC3IP and the
    DECREASED modifier on the pathway term carries the downstream consequence
    for receptor signalling. Adding ESR1 beside PSMC3IP would put two genes
    with different roles on one node, a lesion and the pathway that lesion acts
    through, and would read as receptor involvement the source does not report.

    The entry already represents the receptor family where it belongs: ESR2 is
    bound on the umbrella node covering oocyte-granulosa signalling, which is
    the single node in the whole disorder corpus that carried a receptor gene
    before this issue's work began.

    Deep-research reports for this disease were read before any external
    source was consulted. They discuss estrogen but name no ESR gene at all,
    so the receptor-gene fact this decision turns on is not in them. That is
    a gap in those reports rather than a reason to skip them, and it is
    recorded here so the next curator does not re-derive it.

  summary: Review RIPOR2 clinical course and model mechanisms against full texts
  details: |
    Reviewed the complete 1,186-line baseline and all five prior CREATE/EDIT histories; no REVIEW existed. Read the substantive deep-research report (lines 489–861) and the unique ten-reference citation appendix. The report has genuine provider metadata and narrative content, but some authors, ontology suggestions and variant nomenclature require correction against primary sources. Named-entity preflight passes for RIPOR2, MONDO:0014675 and OMIM:616515. Live open-PR preflight found no overlapping DFNB104 review. This Mendelian disease is within the user's noninfectious, nonenvironmental scope. The user subsequently restricted work to finishing this disorder and existing review PRs; no later disorder will be started.

    Refreshed PMID:24958875 and read the complete scientific main text, five figure captions and the brief methods section. Detailed supplementary methods were not read. Six Turkish relatives had symmetric profound prelingual/congenital loss; available audiograms suggested stability but did not prove lifelong nonprogression. Negative symptoms and bedside balance testing were not a formal vestibular battery. Temporal-bone CT was normal in two relatives only. Patient leukocyte cDNA directly demonstrates exon 3 skipping and p.Arg34_Asp86delinsSer; localization was tested in transfected COS7 cells, not patient cochlear tissue. The 2014 zebrafish experiment used two transient splice-blocking morpholinos, with reduced microphonic amplitudes for both but a significantly raised threshold only for MO1. Mild cardiac edema and developmental/assay differences limit generalization.

    Read all scientific text and methods, including nine main figure captions, from cached PMID:27269051. The KOMP null deletes exons 2–14 and replaces them with lacZ on a C57BL/6 background. Hearing was first tested at four weeks, not birth. P2 inner-hair-cell bundles are already severely abnormal; by P5 both hair-cell types are affected. Removed normal-development-then-adult-maintenance framing. P16/P28 preparations have little cell loss despite severe bundle abnormalities. P5 outer-hair-cell peak mechanotransduction currents are reduced, not absent (approximately 233 versus 417 pA), and the authors explicitly leave direct transduction effects versus secondary morphological effects unresolved. Re-expression at P2 plus two days of culture restores morphology and fluid-jet GCaMP3 responses; the functional rescue is calcium imaging, not direct restored-current recording or in vivo hearing recovery. The study does not establish adult efficacy or a closed treatment window.

    The 2016 taperin signal is reduced/diffuse while espin is retained. Tested heterologous assays did not detect direct association with taperin, CLIC5, radixin, whirlin or PTPRQ cytoplasmic domain. RhoC enhances N-terminal self-association in HEK293 cells; cochlear colocalization uses overexpressed tagged proteins. RL/AA also reduces basal homophilic binding, so failure of rescue cannot uniquely isolate RhoC binding. Ring-like STORM localization does not itself establish lipid binding or a PX domain. Separate supplements were not read.

    Read all cached scientific main text and methods of PMID:30280293; its XML extraction does not provide a complete separate figure-caption set. Orientation defects are present at E18.5 and P5. MYH9 protein and phospho-MYH9 decrease while Myh9 transcript increases, but turnover was not measured. Tagged-protein co-immunoprecipitation establishes association rather than purified direct binding. Acetylated alpha-tubulin is reduced without a detected kinocilium-length change. HDAC6-mediated effects and the causal contribution of these biochemical changes to polarity remain hypotheses. Split protein-abundance, tubulin-acetylation, bundle-orientation and stereociliary-morphology findings into separate nodes. Mouse vestibular evidence is behavioral/rotarod screening, which cannot exclude subtle end-organ dysfunction.

    Refreshed PMID:37864412, which still provides only an abstract in the local cache. Read the publisher's complete scientific main text, methods and two figure captions online at https://onlinelibrary.wiley.com/doi/full/10.1111/cge.14436. Its clinical results contradict universal stable/profound-at-birth wording: the three Tunisian siblings had severe loss progressing to profound loss, delayed walking at 21–24 months and vestibular areflexia. All three received unilateral cochlear implants with satisfactory six-month results. Stable exon-14 CRISPR F2 zebrafish lines lacked overt hearing and balance behavioral differences at 5 dpf; this is not the 2014 morphant experiment and does not prove entirely normal sensory physiology. Paralog compensation is proposed, not demonstrated. The supplemental Word document and detailed patient data were not read. Publisher full-text, PDF and alternative endpoint requests returned HTTP 403 or otherwise failed; no cache file was fabricated. Detailed manually verified findings are recorded under the publication, and the delayed-walking phenotype transparently lacks a cached exact quote. Abstract quotations are limited to claims the abstract actually supports.

    Fetched PMID:25239234 and read its full correspondence challenging the PX–BAR assignment through sequence searches, secondary-structure prediction and unsuccessful homology modeling. Read the complete reply, PMID:25239233, online: the authors defend their N-terminal model but acknowledge that experimental verification remains necessary. Automated fetching of the reply did not recover its body; several URL attempts yielded CAPTCHA pages, which are excluded from the commit. The entry no longer treats the original domain prediction as established. ClinVar RCV000190353 was fetched and its HGVS/coordinate block checked: NM_014722.2:c.102-1G>A and NM_001286445.3:c.189-1G>A are aliases of NC_000006.12:g.24873800C>T. This record is used for identity, not as independent proof of the disputed domain annotation.

    Read all cached scientific text and methods of PMID:32631815 for the DFNA21 differential; separate supplements and figure images were not read. The specific dominant four-residue deletion has variable onset from congenital to 70 years, incomplete penetrance remains possible, and its molecular mode of action is unresolved. Both dominant and recessive alleles can produce in-frame deletions, so broad variant class cannot distinguish the diseases. Do not transfer Dutch founder prevalence or dominant penetrance estimates to DFNB104. Removed assertions that recessive alleles are necessarily globally private or that consanguinity is required.

    Fetched the GeneReviews Genetic Hearing Loss Overview PDF, PMID:20301607. Read the relevant diagnostic/genetic-testing, habilitation/communication, surveillance and recessive-counseling sections and the Usher type I table row; the whole chapter and other disease-specific tables were not read. Exact quotations support broad-panel/genomic testing, VUS limitations, age-appropriate audiology, vestibular-directed physical therapy, cochlear implantation, hearing aids, communication choices, follow-up and conditional 25/50/25 recurrence risk. This is a general chapter, not a RIPOR2 phenotype baseline. A normal early retinal examination cannot exclude Usher syndrome. No phase II or later RIPOR2 intervention trial was identified in the report or audited primary sources, and neonatal explant rescue is not clinical gene therapy evidence.

    Completeness cross-check: major auditory, vestibular and motor-milestone findings, atomic mechanisms, allele identity, diagnostic assessment, supportive care and central references are covered. No established disease subtypes or proven human modifier alleles require additional records. Sparse pedigrees do not support numerical phenotype frequencies or complete penetrance. Unknown causal intermediates are not replaced by invented edges: MYH9 and tubulin changes are observations, not proven drivers of polarity; prelingual onset and delayed walking remain unwired. The gene is explicitly connected to the triggering mechanism. New evidence/publication titles were matched to source identity. All cache additions/refreshes came from just fetch-reference; the frozen dataset accession file was not accessed.

    Schema, terms and all 63 cached quotations pass. Two targeted disorder-data tests passed before the final small additions; final checks, node-class verification, repository evidence gates and commit hooks are recorded in the PR/worktree. REVIEW history and PR linkage will be validated before completion.

  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Extended the existing Audiologic Characterization diagnosis row. Pure tone threshold audiometry panel LOINC:89015-2 bound for identity, plus the eight per-ear hearing threshold codes at 500, 1000, 2000 and 4000 Hz that the WHO grades average. Two reference ranges without a loinc_term, because Monarch KG searches found no LOINC pure-tone-average code: the Global Burden of Disease Expert Group grades (normal below 20, mild 20 to 35, moderate 35 to 50, moderately severe 50 to 65, severe 65 to 80, profound 80 to 95, complete 95 dB HL and above, better-ear four-frequency average) and the earlier WHO grades based on the 1991 version (26, 41, 61, 81 dB boundaries), both quoted from Olusanya, Davis and Hoffman 2019 (PMID:31656340, full text cached), with Bonetti 2026 (PMID:41718341) showing the same boundaries used as the WHO categories. The WHO World Report itself is not PubMed-indexed. Notes say the grading is generic to hearing loss.

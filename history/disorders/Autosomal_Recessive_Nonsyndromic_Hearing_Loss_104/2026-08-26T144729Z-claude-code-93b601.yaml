  details: |
    Second round of review response on PR #9529, acting on two non-blocking suggestions from the approving re-review. Changed treatment_effect on Vestibular Rehabilitation from MODULATES to BYPASSES: the link's own description says it does not act on the mechanism but trains substitute sensory strategies around a deficit that remains, which is a statement of BYPASSES and contradicts MODULATES. Retyped three evidence items from MODEL_ORGANISM to IN_VITRO. The underlying experiments are cochlear explants prepared at postnatal day 2 or 3, injectoporated and cultured for two days, and CLAUDE.md types tissue explants and ex vivo preparations as IN_VITRO. One of the three was IN_VITRO originally and had been changed to MODEL_ORGANISM in the previous round on an earlier reviewer suggestion; reverting it is the correct reading of the documented rule. The rescue link's limitations field now records that the preparation is ex vivo and why the evidence is typed IN_VITRO despite sitting under animal_models. Left unchanged, with reasoning on the PR: the RESCUES link targets the taper-loss node while its readout measures bundle morphology, which the reviewer judged defensible as written. Validated with just validate (39/39 snippets verified) plus the offline gates.

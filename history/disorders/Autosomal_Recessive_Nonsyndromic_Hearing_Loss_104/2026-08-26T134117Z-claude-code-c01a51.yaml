  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 104'
  details: |
    De-novo curation of DFNB104, RIPOR2-related autosomal recessive nonsyndromic hearing loss. Deep research was run with the claude_code provider; the report is committed at research/Autosomal_Recessive_Nonsyndromic_Hearing_Loss_104-deep-research-claude_code.md. The report suggested CL:0000601 for inner hair cell and CL:0000602 for outer hair cell; OLS lookup shows CL:0000601 is cochlear outer hair cell and CL:0000602 is pressoreceptor cell, so the entry binds CL:0000589 and CL:0000601 instead. Two further suggestions (UBERON:0002106 for organ of Corti, HP:0002321 for vestibular areflexia) were also wrong and were replaced. The entry is scoped to the recessive disease; the allelic dominant in-frame-deletion disorder DFNA21 is curated under differential diagnoses only, and PMID:32631815 is cited for what it actually reports rather than for any phenotype of this disease. The reported mouse and zebrafish models are deaf with normal vestibular function while the human patients with a nonsense allele have vestibular areflexia, so that link is curated as FAILS_TO_RECAPITULATE with a HUMAN_MODEL_MISMATCH discussion rather than smoothed over. Evidence comes from PMID:24958875, PMID:27269051, PMID:30280293, PMID:37864412 and PMID:32631815. All 37 snippets verified against the reference cache. Validated with just validate plus the offline gates check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets and check-environmental-evidence.

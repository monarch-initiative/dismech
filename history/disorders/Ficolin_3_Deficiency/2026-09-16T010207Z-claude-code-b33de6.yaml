  summary: 'Review round 2: fix two defects my own round-1 push introduced'
  details: |
    Both blocking findings in round 2 were defects introduced by my round-1 fix commit, not pre-existing.

    1. The evidence item I added to the carrier-frequency prevalence record quoted 'The FCN3 gene was sequenced in 237 healthy Danish Caucasians.' That is a methods sentence stating a cohort size; it says nothing about a frequency, so it did not substantively support rate_per_100000 2000.0. Swapped for the sentence in the same abstract that states the allele frequency of 0.011 outright. The methods sentence remains under the FCN3 sequencing diagnosis entry, where the claim genuinely is about a healthy-population survey.

    2. The notes paragraph said quote_role BACKGROUND 'is used three times' and enumerated three. My round-1 push added a fourth, on the prevalence record, without updating it. Rewrote without a count - the principle is what matters and a count rots. This is the failure CLAUDE.md describes as prose describing repository state being content that rots, and it rotted inside one commit of my writing a near-identical warning into a different entry's notes.

    Suggestions also taken:
    - reference_title for PMID:36574978 carried literal escaped quote characters, an artifact of my own string escaping when I wrote the citation. The cached title has no surrounding quotes. Corrected.
    - Added PMID:18261799's recombinant-protein result as IN_VITRO evidence on the LOSS_OF_FUNCTION genetic_context node. The category previously rested on an association between the variant and the deficiency state; this is the direct demonstration of the functional consequence.
    - Bound diagnosis_term on all three diagnosis entries. NCIT:C198283 'Ficolin-3 Measurement' is an exact match for the serum assay and was worth searching for rather than assuming absent; NCIT:C70617 Total Complement Assay and NCIT:C153598 DNA Sequencing cover the other two.

    Not taken: a second prevalence record from PMID:35083404 for indigenous Russian Arctic populations, and citing DOI:10.1186/s13104-025-07251-x. Both are real content rather than cleanup and belong in a scoped follow-up.

    Gates: validate, validate-terms, check-entity-refs, check-enum-values, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all pass. Snippets 25/25 to 26/26 verified.

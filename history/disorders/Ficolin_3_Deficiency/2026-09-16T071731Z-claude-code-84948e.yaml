  summary: 'Review round 5: remove the last surviving copy of the retracted argument'
  details: |
    One finding. My round-4 commit rewrote the penetrance rationale to retract the silent-deficiency conclusion, and left an evidence explanation forty lines below still asserting it - homozygotes at 3.5% in unselected newborns 'reported without disease, which favours the silent-deficiency arm'. It contradicted the rationale above it, the prevalence record's correction to 3.3%, and the relabelling of that group as the Krasnoyarsk city comparison group.

    Rewrote the explanation to say what the abstract's summary actually establishes that survives reading the full text: the genotype frequency differs by population, so the Danish-derived figure is not a global prediction. It no longer claims silence, records that the 3.5% is the abstract's rounding of a full-text 3.3%, names the population correctly, and points at the prevalence record for the heterozygote anomaly.

    Then grepped for every other trace of the retracted argument rather than fixing only the instance named: 'apparently well', 'without reported disease', 'no disease reported', '350 times', 'second unselected', 'Arctic newborn' all return zero. The surviving '3.5%' mentions are the corrections themselves and 'Russian Arctic' appears only inside the paper's verbatim reference_title.

    This is the fifth instance in this batch of prose surviving a change to the thing it described, and the second where a leftover copy of a retracted argument outlived the retraction. The lesson is narrower than 'check your prose': when retracting an argument, grep for its distinctive phrases across the whole file, because the argument will have been stated in more than one slot.

    Gates: validate, validate-terms, check-entity-refs, check-enum-values, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all pass. Snippets 29/29 verified.

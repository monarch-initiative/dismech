  summary: 'Create: Ficolin 3 Deficiency (MONDO:0013467)'
  details: |
    De novo curation of the FCN3 lectin-pathway deficiency, closing the lectin-pathway row that kb/groupings/Complement_Deficiency_IEIs.yaml records as uncurated in its curate_early_and_regulatory_complement_defects experiment.

    Evidence base: six PubMed references fetched into references_cache/, 18 snippets verified against cached abstracts by just validate.

    Two curation decisions worth flagging for a reviewer.

    First, the entry carries a REFUTE evidence item alongside a SUPPORT item on the same pathophysiology node (Impaired Opsonophagocytic Clearance of Bacteria). This is deliberate. PMID:19535802 framed ficolin-3 deficiency as an immunodeficiency; PMID:25662573 concluded, with more patients available, that the infection link is more complicated and less clear-cut. Per CLAUDE.md the two directions are separate evidence items quoting the sentences that carry them, rather than one item hedged in prose.

    Second, no HPO frequency band is tagged on any phenotype. Every published proportion has a single-figure denominator (3/9 for SLE), and the case series is assembled from case reports, which select for being unwell. A frequency band would present that as a penetrance.

    quote_role: BACKGROUND is used on three items where the quoted sentence is a paper's framing of ficolin-3 biology rather than its own result. Each of those papers is also quoted elsewhere in the entry without the marker.

    A Perplexity deep-research report was generated as a lead source and is committed alongside. Its citations were not used directly: every reference in the entry was found by PubMed search and read from its own reference_cache record. The report's own term-validation section flags 16 of 37 checked CURIEs as naming a different concept, so none of its suggested bindings were adopted.

  summary: 'Review round 3: the penetrance argument''s central number was wrong'
  details: |
    One blocking finding in round 3, and it invalidated the quantitative argument the penetrance discussion turned on.

    PMID:35083404, cached in this branch and uncited, genotyped about 1000 unselected Russian Arctic newborns and found the del/del FCN3 homozygote at 3.5% among Russians and 0.8% among Dolgans and Nganasans, with no disease reported. My rewrite in round 1 had concluded that the gap between predicted homozygote numbers and published cases is one of statistical power in unselected screening. That is wrong twice over: this study had power and returned an answer, and the answer favours the silent-deficiency arm rather than leaving the question open. The 1-in-10,000 prediction is also specific to the Danish allele frequency of 0.011; a 3.5% homozygote rate implies an allele frequency near 0.19, so there is no single global prediction to be short of.

    Rewrote the discussion around what is actually still open, which is narrower and more interesting than sample size: the one European homozygote found in unselected screening had a confirmed group B streptococcal infection while the Arctic homozygotes are reported well, and nothing published distinguishes chance in two small numbers from ascertainment from real modification by genetic background.

    Also qualified the top-level description, which said fewer than a dozen homozygotes have been described in total. True of clinically reported cases, not of genotyped individuals, and the distinction is the whole point of this finding.

    Added a second prevalence record for the Arctic populations. Kept separate from the Danish carrier-frequency record rather than merged, because one is an allele rate and the other a genotype rate in a different population.

    I had deferred this reference last round as additive, on the reviewer's own description of it as 'a second population record for free'. That was a reasonable read of the description and the wrong call on the merits; reading the abstract in full would have caught it. The reviewer said the same about its own framing.

    Suggestions taken: recorded in notes why NCIT:C70617 Total Complement Assay is kept for the pathway-specific functional assay despite being broader than it, naming the three alternatives checked. Removed the sentence in notes narrating this PR's own commit history, which belongs in history records rather than in entry content that outlives the PR.

    check-folded-hyphens caught a line ending in 'population-' in the new prose, which would have folded to 'population- specific'. Reflowed. Second time tonight this gate has caught my writing.

    Gates: validate, validate-terms, check-entity-refs, check-enum-values, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all pass. Snippets 26/26 to 28/28 verified.

  summary: 'Review round 4: the Arctic prevalence claim was wrong on three counts'
  details: |
    Round 4 found that the fix I made in round 3 rested on a misreading of the paper I had just added. All three sub-findings verified against the cached full text before acting.

    1. The 3.5% group is not Arctic. It is the study's Krasnoyarsk city comparison group - 'compared to the Caucasians of Krasnoyarsk', at roughly 56 degrees north, about 2,000 km south of the Taimyr Dolgano-Nenets region the paper is about. The actual Arctic populations carry the genotype at 0% (Nenets) and 0.8% (Dolgans and Nganasans). My prevalence record was labelled 'Russians in the Russian Arctic regions' and the description and rationale inherited the error. Relabelled to the city comparison group.

    2. PMID:36574978 is the same 926 newborns as PMID:35083404, by overlapping authors, not a second independent cohort. My rationale used one as the Arctic screen reframing the European expectation and the other as a European cohort too small to test it - one dataset weighed on both sides of the same argument in opposite directions. Removed; the explanation on that item now records the overlap.

    3. The genotype distribution is internally impossible. The same paper reports ONE heterozygote in all 926 newborns against 15 del/del homozygotes. Hardy-Weinberg at that homozygote rate predicts hundreds of heterozygotes. A common rare homozygote with an absent heterozygote is the signature of allele dropout in a single-base-deletion assay. Added this as a REFUTE evidence item against reading the homozygote figure as a population frequency, and said so in the record's notes.

    Also corrected: the rate now uses the full text's 3.3% (10 of 302) rather than the abstract's 3.5%; measure_type changed from BIRTH_PREVALENCE to UNKNOWN, since this is a genotype frequency in a newborn sample and labelling it a birth prevalence invites reading 3300 per 100,000 as the rate at which the disease is born; and 'without reported disease' is gone from the description and rationale, because the study assessed no phenotypes and defers infectious morbidity to future work - the homozygotes are not known to be well, nobody looked.

    The rewritten rationale keeps only what survives: the 1-in-10,000 figure is specific to the population it was computed from, so there is no single global prediction to fall short of. The question of whether the deficiency is usually silent is open, and the evidence available to close it is one Polish neonatal series and one Siberian screen whose internal distribution cannot be reconciled.

    The pattern the reviewer named is the one that matters: the full text of PMID_35083404 was fetched in my round-3 commit, growing that cache by 680 lines, and I quoted the abstract. Every finding in rounds 1, 3 and 4 has been a reference present in the branch and read only as far as its abstract.

    Gates: validate, validate-terms, check-entity-refs, check-enum-values, check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles all pass. Snippets 28/28 to 29/29 verified.

  summary: 'Review round 1: consume cached references, add diagnosis section'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review (three IMPORTANT findings, all about under-consuming references already cached in this PR).

    IMPORTANT 1: the ficolin3_penetrance_versus_carrier_frequency rationale said distinguishing silent deficiency from rarer-than-Hardy-Weinberg homozygosity requires unselected-cohort genotyping or serum measurement 'which has not been reported'. Two such cohorts are cached in this PR: 613 neonatal serum concentrations with 529 genotypes (PMID:22226667) and 926 genotyped newborn dried blood spots (PMID:36574978). Rewrote the gap as one of statistical power rather than absent data, and added all three as evidence. The neonatal series found exactly one homozygote, who had a confirmed group B streptococcal infection - a single observation that points away from the silent-deficiency reading rather than being neutral, which is now recorded.

    IMPORTANT 2: cited PMID:18261799, the primary FCN3 population survey, next to the prevalence record. The carrier frequency previously rested on the NEJM case report's background restatement of it; that item is now marked quote_role BACKGROUND and the primary determination carries PRIMARY_RESULT.

    IMPORTANT 3: added a diagnosis section with three entries - serum ficolin-3 measurement, the lectin-pathway functional assay (PMID:21085669), and FCN3 sequencing.

    Suggestion taken: pruned references_cache/DOI_10.1056_NEJMoa0900381.md, which duplicated PMID_19535802.md. Re-derived the cited-reference list immediately before removing it and confirmed nothing in kb/ cites the DOI form.


  summary: 'Review: C2 deficiency publication-completeness deep review (IUIS Table
    8)'
  details: |
    The entry had no treatments section at all. For a disease whose whole clinical problem is preventable invasive pneumococcal infection, that was the most consequential gap in it.

    Added two treatments. Vaccination against encapsulated bacteria is linked to the Impaired Opsonophagocytosis node, because the reason it works here is mechanistically specific: C2-deficient people make normal antibody, and that antibody restores opsonophagocytosis by driving alternative-pathway activation around the missing C2 step, rather than by repairing the classical pathway. Antibiotic prophylaxis carries both sides of a genuine disagreement - a 21-year two-brother follow-up reporting no invasive infection under combined vaccination and prophylaxis, and the 77-patient European registry finding no association between prophylactic antibiotics and subsequent infection risk, recorded as a REFUTE item rather than omitted.

    Also added the progressive hypogammaglobulinemia reported on long-term follow-up, deliberately without a frequency band because it rests on one patient, and quantified the type I/type II allele split at 95% and 5-7%.

    Three references fetched for this: PMID:22842196, PMID:25663093, PMID:32164349. 33/33 snippets verify.

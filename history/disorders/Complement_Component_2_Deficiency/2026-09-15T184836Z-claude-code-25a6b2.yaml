  summary: 'Review: C2 deficiency publication-completeness deep review (IUIS Table 8)'
  details: 'The entry had no treatments section at all. For a disease whose whole clinical problem is
    preventable invasive pneumococcal infection, that was the most consequential gap in it.


    Added two treatments. Vaccination against encapsulated bacteria is linked to the Impaired Opsonophagocytosis
    node, because the reason it works here is mechanistically specific: C2-deficient people make normal
    antibody, and that antibody restores opsonophagocytosis by driving alternative-pathway activation
    around the missing C2 step, rather than by repairing the classical pathway. Antibiotic prophylaxis
    carries both sides of a genuine disagreement - a 21-year two-brother follow-up reporting no invasive
    infection under combined vaccination and prophylaxis, and the 77-patient European registry finding
    no association between prophylactic antibiotics and subsequent infection risk, recorded as a REFUTE
    item rather than omitted.


    Also added the progressive hypogammaglobulinemia reported on long-term follow-up, deliberately without
    a frequency band because it rests on one patient, and quantified the type I/type II allele split at
    95% and 5-7%.


    Three references fetched for this: PMID:22842196, PMID:25663093, PMID:32164349. 33/33 snippets verify.


    Review rounds. A KNOWLEDGE_GAP reading "No treatments are curated" was left in place by the commit
    that added two treatments, 520 lines below them; it is now narrowed to the prophylaxis half, which
    is the part genuinely still open, and retargeted at that treatment rather than the whole section.
    The prophylaxis treatment was rebound from generic Pharmacotherapy to NCIT:C51993 Antibiotic Prophylaxis,
    and benzathine benzylpenicillin added so all three agents named in the quoted snippet are bound.


    PMID:16026838 was fetched and two phenotypes curated from it: rheumatological disease at 43% and an
    atherosclerosis association with no band, since the source reports an association and no rate. The
    wider autoimmune spectrum a deep-research report attributed to Orphanet is deliberately NOT curated
    - the abstract does not name it and ORPHA:169147 cannot be built here - and the phenotype description
    records that rather than leaving the omission unexplained.'

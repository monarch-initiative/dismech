  summary: Fix dangling pathograph edge, %% artifacts, and AID/SLE conflation
  details: |
    Three review findings, all of them my own errors introduced by the previous fix commit.

    Critical: renaming Impaired Opsonisation of Encapsulated Bacteria to Impaired Opsonophagocytosis left the upstream downstream target pointing at the old name, so the infection branch was severed at exactly the place the previous finding asked me to connect it. Reconnected and verified by rebuilding the causal graph: no dangling targets, single root at the gene defect.

    I then swept all five entries in this run with the same check and found a second instance in CMT4K, which that PR's reviewer had recorded as fixed. Both breaks are invisible to CI for the same reason: a bare downstream target carries no kind prefix, so check_entity_refs skips it, and schema validation, all six baseline gates and the full pytest suite pass with the edge dangling.

    Three literal %% in prose, an artifact of python percent-formatting during insertion. Fixed.

    AID is not SLE. I attached the 24.4 percent autoimmune-disease figure to the tolerance node as SUPPORT and called it an independent replication of the 25 percent SLE penetrance, in both the explanation and the notes. That was wrong twice: AID in PMID:31440263 means autoimmune disease broadly and the same paper reports SLE separately at 16/51, and the figure comes from the same referral series this entry argues is ascertainment-inflated, so it could not be a clean penetrance replication even if the outcomes matched. Regraded PARTIAL with corrected framing in both places, and the denominator corrected from 67 to the 45 with clinical data.

    Took the frequency suggestion: changed the infection phenotype from FREQUENT to OCCASIONAL. The reviewer was right that FREQUENT contradicted this entry's own ascertainment argument, which concludes the genotype denominator is the one that means penetrance.

    Also added a Serum IgD biochemical record from the same PMID:12959222 quote block, as a deliberate negative: IgD deficiency is extraordinarily common in these patients but equally common with and without infections, which separates a co-occurring abnormality from a real infection-risk modifier.

    22/22 snippets verified; all gates pass; no new cache rows.

  summary: Address review findings 1-7 on PR 9667
  details: |
    Addressed all seven blocking findings from the ai4c-reviewer review.

    Split the two bundled pathophysiology nodes. Both were named for cellular processes but tagged biological_scale ORGANISM because their descriptions carried the clinical outcome as well; that is exactly the bundling signal CLAUDE.md describes. Impaired Opsonisation of Encapsulated Bacteria became Impaired Opsonophagocytosis (CELLULAR) with neutrophil and macrophage cell types and GO:0006909, and the clearance node kept its cellular scope with GO:0002434 and GO:0043277 bound. A new Loss of Tolerance to Nuclear Autoantigen node (ORGANISM) sits between clearance and the SLE phenotype. Both branches now terminate in downstream edges targeting the phenotypes, which were previously orphaned from the pathograph.

    The substantive content finding was PMID:31440263, a 67-patient C2D cohort already in the PR cache and cited only once for a class-level sentence. Its C2-specific results are now curated: 57.8 percent with recurrent or severe infection, 24.4 percent with autoimmune disease, and 54 of 67 homozygous for the 28-bp deletion. The 57.8 percent materially qualifies the roughly-a-quarter infection figure the entry previously stated as settled. Both are retained with an explicit note that the difference is most likely ascertainment (a complement-laboratory referral series versus a homozygote series), that the genotype denominator is the one for penetrance, and that the phenotype is tagged FREQUENT to span both. The 24.4 percent is flagged as a genuine independent replication of the 25 percent SLE penetrance, in contrast to the coincidental pair already noted.

    Added a biochemical block: CH50 below 10 percent of normal with preserved AP50, which substantiates both the diagnostic assertion and the previously uncited intact-alternative-pathway claim; and IgG4, whose deficiency is markedly commoner in infection-prone homozygotes, making it the infection-branch counterpart of the C4A copy-number modifier already curated for the autoimmune branch.

    One reviewer suggestion was only partly satisfiable. The type I extended MHC haplotype is named in PMID:12959222 but the only sentence stating it embeds the haplotype in square brackets, and the snippet matcher strips bracketed content unless conf/reference_validator_config.yaml literal_bracket_patterns matches it. No pattern covers an HLA haplotype. Rather than change repo-wide config from a curation PR, the claim is left as unquoted background with the reason recorded in notes and filed separately.

    Also softened the uncited 90 percent C1q SLE figure to a qualitative contrast (it came from another paper's introduction and is not about this disease), added distinguishing_features and evidence to both differentials, and added harrisons_chapter and iuis_category to match the sibling entry.

    21/21 snippets verified; schema, term, entity-ref, duplicate-key and the three baseline gates all pass. No new cache rows.

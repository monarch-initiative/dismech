  summary: 'Curate phenotypes: Complement Component 2 Deficiency'
  details: |
    Added ten phenotypes from already-cached sources (PMID:35648651, PMID:26941740, PMID:26913032, PMID:31440263, PMID:32164349): meningitis, pneumonia, sepsis, myocardial infarction, cutaneous photosensitivity, malar rash, discoid lupus rash, arthritis, antinuclear antibody positivity and anti-Ro/SS-A antibody positivity. Enriched Recurrent Bacterial Infection with the Swedish 57% figure (PMID:16026838) and Systemic Lupus Erythematosus with the published 10-40% penetrance range, sex ratio and clinical shape. Wired the three invasive infections from Impaired Opsonophagocytosis and the two autoantibody phenotypes from Loss of Tolerance to Nuclear Autoantigen. SLE-subset features carry no frequency band because the source percentages are within the SLE subset only. Updated the description, the SLE edge text, the knowledge-gap prompt and the notes that the new content made stale. NCBI and EBI were not reachable from the curation environment, so new references could not be cached; the primary Swedish study PMID:15643297 and thin review mentions are recorded in notes as leads. Validated with just validate, count-verified-snippets (55/55), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions.

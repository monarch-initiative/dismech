  summary: 'Create: Complement Component 2 Deficiency'
  details: |
    Curated MONDO:0009006 as a Disease entry, the early-classical-pathway counterpart to the existing Late_Complement_Component_Deficiency entry. Four-node pathograph: C2 gene defect -> classical pathway C3 convertase failure -> two parallel consequences (impaired opsonisation; defective immune complex and apoptotic debris clearance). Type I and type II deficiency are modelled as has_subtypes because they differ in molecular mechanism (premature stop vs blocked secretion) rather than in clinical entity.

    All 13 snippets were inserted programmatically as exact substrings extracted from the cached reference text, because the source contains non-breaking and thin spaces inside the statistics that hand-typing would silently normalise. 13/13 verified.

    Two provenance limits recorded in notes rather than smoothed over. The 1:20,000 prevalence and 0.01 carrier frequency both come from the introduction of PMID:35729719, which cites them to earlier Swedish work rather than measuring them. And the 25 percent infection figure (PMID:12959222) and 25 percent SLE penetrance (PMID:35729719) are independent coincidental numbers describing different patient subsets, noted so they are not later combined.

    No treatments section: the sources consulted give management for complement deficiency as a class, not outcomes in C2-deficient cohorts. Recorded as a KNOWLEDGE_GAP rather than curating class-level guidance as C2 evidence.

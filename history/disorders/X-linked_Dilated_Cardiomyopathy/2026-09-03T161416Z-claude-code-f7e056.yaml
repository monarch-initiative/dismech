  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #10725. Mined GeneReviews (PMID:20301298) into four sections: molecular genetic testing and agents-to-avoid (succinylcholine/inhalational anesthetics, MH-like reactions) in a new diagnosis section, transplant candidacy on Heart Transplantation, and carrier-female surveillance. Added diagnosis section (MLPA first-tier + sequencing, muscle-promoter/exon-1-specific testing, characteristic ECG R/S pattern, echo + CMR late gadolinium enhancement). Added biochemical NT-proBNP (NCIT:C96610) with 32939432 + 34429516; no citable reference_ranges so none recorded. Added animal_models with modeled_mechanisms: mdx (PARTIALLY_RECAPITULATES, LOW), Cmah-/-;mdx (RECAPITULATES, MODERATE, RV EF/SV readout), GRMD dog (PARTIALLY_RECAPITULATES) - all PMID:30281092/PMID:28526070 MODEL_ORGANISM. Added HUMAN_MODEL_MISMATCH discussion attaching to Ventricle-Selective Loss of Dystrophin (no model reproduces the cardiac-selective phenotype). Connected six orphan phenotypes via bare-name downstream targets. Split 'Ventricular Arrhythmia and Sudden Cardiac Death' into Ventricular Arrhythmogenesis -> Arrhythmic Sudden Cardiac Death. Added has_subtypes (5' promoter vs exon 45-55) + progression + ICD/CRT device treatment. Changed necrosis term GO:0097300 (programmed necrotic cell death) to GO:0008219 (cell death) to stop over-claiming necroptosis. Added directness: INDIRECT to DMD-cohort trial/CMR evidence applied to XLDCM. reference_title on all new evidence. Fixed CREATE record: #10718 moved from prs to issues (it is the closed issue).

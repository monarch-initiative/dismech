  summary: 'Create: X-linked Dilated Cardiomyopathy'
  details: |
    Created XLDCM (dilated cardiomyopathy 3B, MONDO:0010542), the cardiac-selective dystrophinopathy caused by DMD (hgnc:2928) mutations. Curated from a Claude Code deep-research report (18 web searches, 45 citations). Modeled a seven-node pathophysiology chain: 5' DMD muscle-promoter/isoform-disrupting lesion -> ventricle-selective loss of dystrophin (B-isoform compensation fails in ventricle per Neri 2012, PMID:22455600) -> DGC disruption -> sarcolemmal fragility (conforms cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult) -> calcium overload -> necrosis/replacement fibrosis -> LV dilation and systolic failure (conforms #Structural Cardiac Impairment and Heart Failure) -> ventricular arrhythmia/sudden death. Phenotypes (DCM, CHF, reduced LVEF, ventricular arrhythmia, sudden death, variable CK, carrier-female DCM), X-linked recessive inheritance block (HP:0001419), diagnostic-yield prevalence note, and treatments (ACE-I+beta-blocker, ARB/losartan, transplant, surveillance). Verified that two candidate anchor PMIDs supplied to the curator were WRONG: PMID:8281153 (NF-kB paper) and PMID:8302331 (lymphoma model); used the correct primaries Towbin 1993 (PMID:8504498) and, for the 5' mechanism, Neri 2012 (Muntoni NEJM PMID:8361506 has no cached abstract). All snippets exact (33/33). Validated: validate, validate-terms, count-verified-snippets 33/33, check-causal-targets, check-duplicate-keys, check-entity-refs, check-qualifier-terms, validate-disorders.

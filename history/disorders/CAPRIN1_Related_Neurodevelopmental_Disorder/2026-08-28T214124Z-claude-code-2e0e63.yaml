  summary: 'Create: CAPRIN1-related neurodevelopmental disorder'
  details: |
    De novo curation from an OpenScientist deep-research report. Gene identifier verified against HGNC and correct: CAPRIN1 is hgnc:6743. This is the one entry in the batch where per-phenotype frequencies are properly citable, and every band is bound to a quote stating that figure for that named phenotype: language impairment 100 percent as OBLIGATE, intellectual disability 83 and ADHD 82 as VERY_FREQUENT, autism 67, respiratory 50, limb and skeletal 50, developmental delay 42, feeding difficulties 33, seizures 33 and ophthalmologic 33 as FREQUENT. That is the discipline the previous batch failed when a frequency was taken from a number describing a neighbouring phenotype in the same sentence. Twelve patients is a coarse denominator and the notes say so. This report was the only one of the five to carry a flagged confabulation. Its own reference validation reported a quote not found in PMID:35979925, beginning The majority of reported pathogenic mutations in the CAPRIN1 gene result in decreased protein levels and haploinsufficiency. That sentence is not in the cached abstract and is not used anywhere in the entry; it is recorded in the top-level notes so it is not re-derived from the report. Pathograph runs from haploinsufficiency through impaired dendritic mRNA localisation to attenuated AMPAR scaling and reduced synaptic strength, then splits into a neuronal arm and an extraneural one. The extraneural node is deliberately a sibling rather than downstream of cortical neuron development, because routing a limb anomaly through neuronal development would be false; its description says the features occur in the disease without claiming each follows from the neuronal mechanism. Respiratory, skeletal and ophthalmologic phenotypes are bound to high-level HP terms because the cohort describes them only as problems or anomalies without naming a specific finding. A HUMAN_MODEL_MISMATCH records the dose problem at the centre of the entry: the mRNA-localisation mechanism is established only in a homozygous mouse deletion while the human disease is haploinsufficiency, and the CRISPR-edited heterozygous iPSC neurons that are at the right dose were characterised for morphology, translation, calcium, oxidative stress and electrical activity but are not reported to have been assayed for dendritic mRNA localisation. A proposed experiment names the assay that would close it. Validation: just validate passes, 24 of 24 snippets verified, entity refs and duplicate keys clean, one root, no dangling targets, every phenotype reached.

  summary: 'Review round 2: two snippets that verified but did not support their claims'
  details: |
    Second review round on PR #9942. Both items are the same class of defect and neither is a substring failure: a quote that verifies exactly against its cited source while not supporting the claim it is attached to.

    The PMID:35977029 snippet stopped one word before the gene name that fixes its subject. "a new neurodevelopmental disorder (NDD) with common features of language problems, intellectual disability, and behavioral issues caused by de novo likely gene-disruptive variants in" continues "UBAP2L". Those three features are Jia et al's description of the UBAP2L disorder, not CAPRIN1's, and the explanation built on their resemblance to this entry's three most frequent phenotypes - a coincidence between two different disorders. Re-quoted to the sentence that is actually about CAPRIN1, regraded from SUPPORT/HUMAN_CLINICAL to PARTIAL/IN_VITRO, and the explanation rewritten: this paper is functional corroboration of the gene, not a clinical replication cohort.

    The PMID:20861386 NKA-cargo item was attached to Disrupted Cortical Neuronal Development while its explanation described the claim of Impaired Dendritic mRNA Localisation, one node upstream. Moved to the node its explanation was describing.

    Also taken: renamed the respiratory phenotype from Abnormal Respiratory System Physiology to Respiratory Problems, since round 1 moved its binding to HP:0002086 specifically to avoid asserting a physiological abnormality while leaving the name asserting exactly that; updated both downstream refs. Replaced attaches_to animal_models#Mouse with the two model names, since the rationale now turns on the distinction between them and both models share a species. Marked the neonatal-lethality quote as the secondary citation it is.

    Note for the record: the truncated quote was supplied by the round-1 review and I used it without re-reading the surrounding sentence in the cache. It verified, so nothing objected - which is the failure this entry's own notes describe and which is now filed as #9970.

    Validation: 32/32 snippets verified, validate, validate-terms, check-entity-refs all pass.

  details: |
    First review round on PR #9942. Four important items, no criticals; two of them corrected prose claims the entry made that its own cached references contradict.

    Changed GO:0008104 (intracellular protein localization) to GO:0008298 (intracellular mRNA localization) on the Impaired Dendritic mRNA Localisation node. The old term was the wrong molecule class and contradicted the node it annotated.

    Added the heterozygous Rng105+/- mouse (PMID:26865403) as a second animal model, linked to phenotypes#Autism at PARTIALLY_RECAPITULATES / MODERATE. The entry had claimed the CRISPR-edited iPSC neurons were the only model at the human gene dose; a dose-matched mouse exists and had been comprehensively characterised. Rewrote the HUMAN_MODEL_MISMATCH rationale accordingly: the gap is not that half dosage has never been modelled, but that neither dose-matched model has been assayed for the molecular step the causal chain runs through.

    Consumed the extraneural evidence the entry said did not exist. Complete RNG105 knockout is neonatally lethal from respiratory failure (PMID:29157358, already cached in this PR) and targeted inner-ear deletion causes progressive hearing loss (PMID:35165318). Both are complete loss, so the node's claim is now that Caprin-1 has demonstrated non-neural organ requirements at complete loss and that nothing shows them failing at half dosage.

    Added PMID:35977029 as independent replication, reached through stress-granule assembly regulators rather than CAPRIN1-first ascertainment.

    Corrected the confabulated-quote claim, which was itself wrong. The sentence attributed to PMID:35979925 is real and verbatim; it belongs to PMID:41859620, now cited for the expanded phenotype. The defect is misattribution, not fabrication, and the two need different defences: a fabricated quote fails any substring check, while a misattributed one fails only because the curator cited the wrong paper. Had the report named the right PMID, the quote would have verified exactly.

    Also taken from the suggestions: mouse genotype precision (Camk2a-Cre conditional plus constitutive null primary neurons), CL:0000679 glutamatergic neuron in place of CL:0000540, HP:0002086 in place of HP:0002795 for the unspecified respiratory phenotype, the Na+/K+-ATPase cargo class from PMID:20861386, and a diagnosis section. The exome-sequencing quote from PMID:41859620 is used for the method only: that abstract calls the same variant maternally inherited in one sentence and de novo in the next.

    Not taken: no phenotype records for cerebellar ataxia, hearing loss or dysmorphic features. They appear in a background sentence of a single case report summarising the literature, with no denominator, so they are recorded on the genetic block at PARTIAL rather than curated as phenotypes.

    Validation: 32/32 snippets verified (was 24/24). validate, validate-terms, check-entity-refs, check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens, check-snippet-grading all pass. One root, no dangling targets, no unreached phenotype.

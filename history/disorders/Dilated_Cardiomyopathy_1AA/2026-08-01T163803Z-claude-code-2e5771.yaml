  summary: 'Create: Dilated Cardiomyopathy 1AA (ACTN2, MONDO:0012808)'
  details: |
    De-novo curation of the ACTN2-related dilated cardiomyopathy node (CMD1AA). NEC preflight against MONDO:0012808 with OAK confirmed ACTN2 as the causal gene, the OMIM:612158 xref, and the CMD1AA synonym. Falcon deep research (Edison) was run and used as leads only: every cited PMID was fetched with just fetch-reference and every snippet verified verbatim (58/58 snippets checked). The ClinGen Hereditary Cardiovascular Disease GCEP assertion (CGGV; ACTN2 Definitive for ACTN2-related cardiac and skeletal myopathy) was rebuilt into references_cache and cited. The pathograph is a ten-node chain conforming to cardiomyopathy_maladaptive_remodeling at five nodes, with two mechanistic_hypotheses groups (canonical Z-disc force transmission; emerging variant-specific proteostatic stress) and three discussions (ClinGen lumping versus MONDO splitting, the mechanism gap, and a mouse-heterozygote HUMAN_MODEL_MISMATCH).

  details: |
    Response to two rounds of ai4c-reviewer REQUEST_CHANGES on PR #7696. All five IMPORTANT items addressed: (1) new six-entry diagnosis section (echocardiography NCIT:C16525; cardiac MRI with late gadolinium enhancement NCIT:C16809; ECG and ambulatory rhythm monitoring NCIT:C38053; NT-proBNP NCIT:C96610; cardiomyopathy multigene panel with copy-number analysis NCIT:C15709; plus a term-free diagnosis-by-exclusion entry), carrying the ACTN2-specific point that two informative genotypes are structural so copy-number calling is required; (2) PMID:20301486 tagged as GeneReviews, its two verbatim-quotable clauses cited on cascade testing and on the exclusion entry, and the notes claim about the record softened; (3) five therapeutic_agent NCIT drug-class terms added for the HFrEF pillars; (4) ICD term moved to NCIT:C80435 Implantable Cardioverter-Defibrillator Placement with supporting evidence; (5) Restrictive cardiomyopathy (HP:0001723) added with ClinGen and PMID:27662471 evidence. Four of the five optional suggestions also taken up: differential_diagnoses (six entries, four MONDO-bound), Myocardial fibrosis (HP:0001685) with CMR-LGE prognostic evidence (PMID:39298146), a four-phase progression block, and the LVNC pathophysiology-node rename to Failed Trabecular Compaction; the previously uncited PMID:33802723 is now cited on the trigger node. Snippets checked: 86/86 verified; term validation clean; new term-cache entries committed alongside.

  summary: 'Create: Cole-Carpenter syndrome CCS1 P4HB / CCS2 SEC24D'
  details: |
    New lumped Mendelian entry for Cole-Carpenter syndrome MONDO:0016085 with two gene-defined subtypes: CCS1 P4HB autosomal dominant MONDO:0007204 and CCS2 SEC24D autosomal recessive MONDO:0014573. Pathophysiology models both arms - P4HB/PDI disulfide isomerase dysfunction and SEC24D/COPII procollagen ER-export failure - converging on defective type I collagen biosynthesis, with reduced bone quality and increased osteoclastic resorption. Evidence from Rauch 2015 PMID:25683117 P4HB, Garbes 2015 PMID:25683121 SEC24D, Takeyari 2018 PMID:30462379 CCS2 compound-het, and the seed Maurizi 2026 mouse model plus therapeutic proof-of-concept PMID:42425402. All snippets verified as exact substrings; MONDO enum-cache membership added for the three CCS terms. Routed from lit-scan issue #6078 P4HB Y393C model. Draft PR pending automated review.

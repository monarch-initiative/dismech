  details: |
    Bound 2 differentials: Pitt-Hopkins (MONDO:0012589) and Coffin-Siris syndrome 10 (MONDO:0032791, RO:0004003 HGNC:11200 SOX4 confirmed). Every MONDO term was resolved and NEC-verified with runoak before binding: labels checked against the ontology, obsolete terms rejected, and gene-specific terms confirmed via their RO:0004003 relation. No prose or evidence content changed. Three differentials are deliberately left unbound, each for a stated reason. (1) Coffin-Siris syndrome: MONDO:0015452 was bound in an earlier revision of this PR and then REMOVED, because MONDO:0014376 - this entry's own anchor - is_a MONDO:0015452, so binding it made the entry machine-assert its own superclass as a differential; binding a single subtype such as MONDO:0007617 (Coffin-Siris syndrome 1, ARID1B) would instead narrow a BAF-core-subunit differential to one gene. (2) SOX2-related anophthalmia: an earlier revision of this record claimed "no clean MONDO term resolves", which was FALSE and is retracted here - MONDO:0008799 (OMIM:206900) carries "SOX2 anophthalmia syndrome" as a RELATED synonym. It is unbound because that term's primary label foregrounds oesophageal atresia, which is not what makes SOX2 a differential for this entry; the reason is narrowness, not absence. (3) 2p25 contiguous-gene deletion phenotypes: a category spanning MYCN and MYT1L rather than a single nameable entity.

  details: |
    Created the SOX11-related neurodevelopmental disorder entry (MONDO:0014376, OMIM:615866, SOX11/HGNC:11191). Preflight confirmed the MONDO RO:0004003 gene relation is HGNC:11191 SOX11 before any writing. Deep research provider: claude_code (23 min, 8 web searches, 53 citations); report committed under research/. Curated 15 atomic pathophysiology nodes forming one connected graph with a single root (Heterozygous SOX11 Loss of Function), covering the neural, ocular/Hedgehog, craniofacial/FGF9, renal/Gdnf, endocrine GnRH-axis, cochlear-nerve, and DNA-methylation-episignature arms; 31 phenotypes with HPO terms; genetic, inheritance, prevalence, treatments, differential diagnoses, and three discussions (one KNOWLEDGE_GAP on phenotype denominators, one HUMAN_MODEL_MISMATCH on the homozygous-model vs human-heterozygote zygosity mismatch, one KNOWLEDGE_GAP on non-coding variants and adult natural history). Named-entity-confusion handling: SOX11 is curated as distinct from classical BAF core-subunit Coffin-Siris syndrome, from the SOX4 paralogue, and from SOX2, with the lump-vs-split reasoning recorded in differential_diagnoses and notes; no ARID1B/SMARCB1 cohort phenotype data were imported, and the Coffin-Siris epilepsy frequency and ARID1A hepatoblastoma surveillance were explicitly excluded. GeneReviews baseline: no SOX11-specific chapter exists; the Coffin-Siris Syndrome chapter (PMID:23556151) was fetched, tagged GeneReviews, and cross-checked item by item, with imported and deliberately-excluded items listed in notes. Validation: just validate clean (schema no issues, term validation passed, 96/96 snippets verified against cached references); compliance 88.2 percent global / 88.5 percent weighted.

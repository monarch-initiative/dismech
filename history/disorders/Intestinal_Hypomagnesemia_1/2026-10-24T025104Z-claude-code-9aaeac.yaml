  details: |
    New entry for TRPM6-related hypomagnesemia with secondary hypocalcemia (MONDO:0011176). Deep research was run with the claude_code provider (research/Intestinal_Hypomagnesemia_1-deep-research-claude_code.md); its five cited references all resolved, and the report flagged several leads as unverified, which were looked up in PubMed and fetched rather than taken from the report (Schlingmann 2005 JASN PMID:16107578, Walder 2009 HMG PMID:19692351, Chubanov 2016 eLife PMID:27991852, Lainez 2014 EJHG PMID:23942199). Additional sources found by PubMed search: Aftab 2026 cohort (PMID:40853861), Long-term follow-up 2021 (PMID:33565749), and a 2025 review of PTH suppression by hypomagnesemia (PMID:40740723), cited as REVIEW_SYNTHESIS for the parathyroid G-alpha step. The pathophysiology is built as an atomic chain from TRPM6 variants to loss of channel activity, branching to enterocyte apical uptake and distal tubule reabsorption, converging on systemic magnesium deficiency, then splitting into PTH suppression (via G-alpha disinhibition) and end-organ PTH resistance before hypocalcemia and neuromuscular hyperexcitability. The Orphanet record ORPHA:30924 was generated with just fetch-reference; the local Orphadata files differ from the manifest pin, so the cache file is stamped with the 2026-06-23 release. Validated with just validate-disorders (73 snippets, 0 issues), validate-terms, and the offline whole-repo gates.

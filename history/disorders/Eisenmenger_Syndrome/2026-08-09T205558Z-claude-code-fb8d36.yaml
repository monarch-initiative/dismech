  summary: 'Edit: Eisenmenger Syndrome - address PR #8269 review'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #8269 (0 critical, 4 important, 2 suggestions). All six items acted on.

    IMPORTANT 1 - missing arrhythmia/atrial fibrillation phenotype. Added an `Atrial fibrillation` phenotype (HP:0005110) carrying the 11.45-fold sudden-cardiac-death risk, and a new pathophysiology node `Atrial arrhythmia and conduction system disease` wired downstream of `Pulmonary arterial hypertension with right ventricular pressure overload`, so the arrhythmic route to sudden death now appears in the pathograph rather than only as prose. The reviewer suggested a downstream edge into the sudden-death phenotype; `downstream` targets are pathophysiology nodes, so the arrhythmic substrate was modeled as its own node instead, which is the structurally correct way to express the same claim. New reference fetched: PMID:32174228 (Determinants of Sudden Cardiac Death in Adult Patients With Eisenmenger Syndrome, 246 patients, two centres), which the deep-research report had cited only by PMC URL. Also curated from it: advanced pulmonary vasodilator therapy was strongly protective against sudden death, and heart-failure symptoms predicted overall mortality but NOT sudden death, which is the authors' basis for inferring an arrhythmic cause.

    IMPORTANT 2 - missing syncope phenotype. Added `Syncope` (HP:0001279) at frequency OCCASIONAL from a documented 8.1% in the same 246-patient cohort. Curated with a correction the review did not anticipate: the review described syncope as a "validated poor-prognosis predictor", and the largest dedicated sudden-death analysis in this disease found the opposite - prior syncope showed NO significant association with sudden cardiac death, cardiac mortality, or all-cause mortality. That null result is curated as a REFUTE evidence item and the phenotype description states the caveat explicitly, so the entry does not propagate the claim.

    IMPORTANT 3 - five cached-but-uncited PMIDs. Four are now cited: PMID:32565271 (UNOS analysis of 442 Eisenmenger transplants, added to the transplantation treatment with absolute bilateral-lung survival figures and the refractory-RV-failure indication), PMID:27054605 (systematic review, added to the endothelin antagonist treatment, including its own statement that the evidence does not settle when to start or escalate these drugs), PMID:11923814 (106-patient prognosis cohort with survival figures and two independent haemodynamic mortality predictors) and PMID:40204597 (risk stratification; cited both for the independent predictors and for the fact that no externally validated risk score exists). The fifth, PMID:28566473, CANNOT be cited: it is a Heart editorial comment whose PubMed record carries no abstract text, so no verifiable snippet exists. That is now stated explicitly in the entry's top-level notes, together with the fact that the same epidemiological decline is curated from PMID:39711759 which does state it quotably. Also replaced a weak BREATHE-5 open-label-extension snippet with the quantitative walk-distance result from the same abstract.

    IMPORTANT 4 - truncated snippet. The evidence item quoting PMID:17692749 ended mid-word at "thrombosi". Replaced with a complete sentence from the same abstract giving the pulmonary artery diameter and peak systolic velocity findings, and the explanation was updated to match what the new quote actually says (dilated artery plus slow flow, rather than velocity alone).

    SUGGESTION 5 - CL term specificity. `CL:0000192` smooth muscle cell replaced with `CL:0002591` smooth muscle cell of the pulmonary artery, which matches the preferred_term exactly. Verified with OAK and by `just validate-terms`.

    SUGGESTION 6 - secondary omissions. Added: `Fatigue` (HP:0012378) as PARTIAL, since the sources name clinical heart failure symptoms rather than fatigue itself; a `biochemical` entry for brain natriuretic peptide as a prognostic marker, with the caveat that it is a risk marker and not part of any validated score; two `clinical_trials` entries for the MAESTRO programme (NCT01743001 phase 3 and NCT01739400 open-label extension), both fetched via `just fetch-reference` after an initial ClinicalTrials.gov 500 error resolved on retry, with the description recording that MAESTRO was negative for its primary endpoint, which is precisely why this entry curates bosentan rather than macitentan as the endothelin antagonist with Eisenmenger-specific randomised support; and an `ACVRL1 and ENG` genetic entry curated as DISPUTED rather than SUSCEPTIBILITY, because unlike BMPR2 no cohort has shown them enriched in congenital heart disease with pulmonary vascular disease relative to congenital heart disease without it - their only support here is inclusion on a clinical gene panel.

    The `has_subtypes` decision the reviewer asked to see justified is now stated in the entry's notes: progression risk is strongly lesion-dependent (nearly all unrepaired truncus arteriosus, about half of large VSDs, under a tenth of large ASDs), but that variation is a property of the underlying congenital defect rather than of Eisenmenger syndrome, which is the same entity once established regardless of which defect produced it. Splitting by lesion would model the antecedent, not the disease. The one place lesion identity genuinely changes management - transplant strategy selection - is curated on the transplantation treatment instead, and shunt level is carried in the trigger node description.

    Validation actually run and read after the changes:
    - `just validate kb/disorders/Eisenmenger_Syndrome.yaml` - passed (schema, terms, references).
    - `just count-verified-snippets` - 105/105 snippets verified against cached references, up from 85/85, 0 skipped by prefix.
    - `just validate-disorders kb/disorders/Eisenmenger_Syndrome.yaml` - passed. This is the batched pre-PR sweep CI runs.
    - `tests/test_data.py -k "conforms_to_module_node or unique_name or subtype_foreign or treatment_mechanism or environmental_mechanism or graph or clinical_trial"` - 5878 passed, exercising the new pathophysiology node's foreign keys and the two new clinical trial records.
    - `just compliance` - 97.9% global, 97.8% weighted. The small drop from 98.5% is expected and is a scoring artifact of adding new object types (biochemical, clinical_trials, an extra genetic entry) that introduce their own recommended-slot denominators; no previously satisfied slot regressed.

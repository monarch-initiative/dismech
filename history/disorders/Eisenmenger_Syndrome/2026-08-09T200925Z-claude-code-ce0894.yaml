  summary: 'Create: Eisenmenger Syndrome'
  details: |
    Created a new KB entry for Eisenmenger syndrome (MONDO:0019944), the terminal stage of an uncorrected congenital systemic-to-pulmonary shunt and the most advanced form of pulmonary arterial hypertension associated with congenital heart disease.

    Deep research provider: claude_code, via `just research-disorder claude_code Eisenmenger_Syndrome` (research/Eisenmenger_Syndrome-deep-research-claude_code.md; 25 web searches, 31 turns, 44 citations, 317s). claude_code was used because no other provider's API key is present in this environment; it reuses the Claude Code credential.

    NEC preflight: `just preflight-dr` returned SKIP, because MONDO records no causal gene (RO:0004003) for this acquired physiologic end-state. The manual fallback was run and passed. Note the tool's gene-frequency line is misleading here and should not be read as a signal: its top hit "PAH=35" is the report's abbreviation for pulmonary arterial hypertension being matched as the phenylalanine hydroxylase gene symbol, an artifact of the heuristic lexicon. The genes genuinely discussed (BMPR2, ACVRL1, ENG) are PAH-pathway susceptibility genes appropriate to this disease. MONDO carries no OMIM xref for MONDO:0019944, so there was nothing to compare the report's OMIM 600799 against; that number is the BMPR2/heritable-PAH entry cited in the report's genetics section, not a claimed identifier for Eisenmenger syndrome. Report synonyms (Eisenmenger complex, Eisenmenger reaction, Eisenmenger physiology) match.

    GeneReviews: none exists. A PubMed search for `Eisenmenger GeneReviews[All Fields]` returned 0 results, expected for an acquired end-state of a congenital lesion rather than a Mendelian disorder. Recorded in the entry's top-level notes.

    Module conformance: this entry declares `conforms_to` against five nodes of the `pulmonary_vascular_remodeling` module (endothelial dysfunction, PASMC proliferation and vasoconstriction, obstructive remodeling, increased pulmonary vascular resistance, pulmonary arterial hypertension). The shunt-reversal node is deliberately NOT mapped: the module has no counterpart for it, and it is precisely what distinguishes Eisenmenger syndrome from idiopathic and heritable PAH. That deliberate non-mapping is stated in the node description so a future curator does not "complete" the mapping by mistake.

    Curated content: a twelve-node pathograph running from the uncorrected non-restrictive shunt through shear-stress endothelial dysfunction, PASMC proliferation, obstructive remodeling, rising pulmonary vascular resistance, shunt reversal, and onward to chronic hypoxaemia with secondary erythrocytosis, hyperviscosity with haemostatic derangement, loss of pulmonary filtration of emboli, and the multisystem complications of chronic cyanosis; 12 causal edges, all evidence-bearing. A deliberately counterintuitive node, "Right-to-left shunt as a protective right ventricular pop-off", captures why this disease behaves unlike other severe PAH: the shunt that caused it now decompresses the right ventricle, which is why survival exceeds idiopathic PAH at comparable haemodynamics and why closing the defect is contraindicated rather than curative. Also 15 phenotypes across cardiovascular, haematologic, neurologic, renal, rheumatologic and gastrointestinal domains; 6 treatments (endothelin receptor antagonist, PDE5 inhibitor, prostanoid, iron replacement, transplantation) with target_mechanisms edges; 4 diagnostic modalities; 2 differential diagnoses, of which the operable-PAH-CHD one is the clinically decisive distinction because the two are managed in opposite directions; structured prevalence; clinical_burden HIGH; 2 genetic entries (BMPR2 SUSCEPTIBILITY with structured case_fractions, trisomy 21 RISK_FACTOR); and one CONTROVERSY discussion on the treat-and-repair strategy with a proposed registry study.

    Evidence discipline worth noting: several results are curated at reduced strength or as REFUTE rather than smoothed over. The EIGER iloprost study improved walk distance and quality of life but explicitly did NOT improve pulmonary artery pressure or resistance, curated as a REFUTE item so the drug is not presented as resistance-lowering. Adding sildenafil to bosentan did not improve walk distance though it did raise resting saturation, curated PARTIAL. Pulmonary artery thrombosis was shown NOT to differ by haemoglobin or haematocrit, curated to argue against erythrocytosis as its driver. The systematic review correcting for immortal time bias, finding no survival improvement in treatment-naive patients across four decades, is curated alongside the modern survival figures rather than in place of them.

    Five ontology errors in the deep-research output were caught and corrected by independent OAK lookup, all of them ID/label mismatches where the cited ID belongs to an unrelated concept: HP:0007204 claimed as "Central cyanosis" is Diffuse white matter abnormalities (correct: HP:0034032); HP:0100738 claimed as "Brain abscess" is Abnormal eating behavior (correct: HP:0030049); HP:0040217 claimed as hypertrophic pulmonary osteoarthropathy is Elevated hemoglobin A1c (no HPO term for that phenotype exists, so it was omitted rather than substituted); CL:0002544 claimed as "pulmonary artery endothelial cell" is aortic endothelial cell (correct: CL:1001568); hgnc:11177 claimed as SMAD9 is SOAT1 (correct: hgnc:6774, though SMAD9 was ultimately not curated). The report self-flagged a sixth (HP:0002804) as inexact. By contrast every PMID the report cited was real and correctly attributed, checked by esummary lookup - the failure mode in this provider is ontology identifiers, not citations.

    Three further term errors were my own, not the report's, and were caught by `just validate-terms`: NCIT:C38084 and NCIT:C51948 were guessed rather than looked up (correct: NCIT:C38085 Pulse Oximetry, NCIT:C28133 Blood Cell Count), and MONDO:0015924 for idiopathic PAH is the parent term (correct: MONDO:0001999).

    Datasets: added geo:GSE126322 with an explicit note that it contains NO Eisenmenger and no congenital heart disease samples. It is human pulmonary artery endothelial cell chromatin profiling in pulmonary arterial hypertension, included only because the entry conforms to the shared endothelial-dysfunction module node; no evidence item cites it and it cannot support an Eisenmenger-specific claim. All 12 discovery candidates were gene-only BMPR2 matches with no congenital-heart-disease content.


  summary: 'Edit: Eisenmenger Syndrome - address PR #8269 second review round'
  details: |
    Addressed the second ai4c-reviewer CHANGES_REQUESTED round on PR #8269 (2 important, 3 non-blocking). All five acted on. The reviewer stated these were its last items.

    IMPORTANT A - relationship_type: DISPUTED was the wrong controlled value for ACVRL1/ENG. The reviewer is right and the correction matters beyond wording: the schema defines DISPUTED as an association whose validity is contested (ClinGen Disputed/Refuted), and nothing contests ACVRL1 or ENG in pulmonary arterial hypertension - they are established heritable-PAH genes, which is exactly why they sit on the diagnostic panel the note cites. What is absent is Eisenmenger-specific cohort evidence, and the enum already has a value for that: UNKNOWN. Because the enum is what gets exported while the prose is not, the record as written would have surfaced these genes to a downstream consumer as contested associations, the opposite of the literature, and would have contradicted Hereditary_Hemorrhagic_Telangiectasia.yaml where the same hgnc:175 is curated as causative. Changed to UNKNOWN. Also split the bundled `ACVRL1 and ENG` record into two records so each gene carries its own gene_term binding (hgnc:175 and hgnc:3349) rather than one record naming two genes but binding only one. Dropped the evidence item entirely per evidence SOP option C: its snippet mentioned neither gene, and the notes already carry the whole argument, so a contextual quote added nothing but the appearance of support.

    IMPORTANT B - the brain natriuretic peptide biochemical record was unbound and directionless. Added presence: INCREASED and a bound biomarker_term. The reviewer's caution was the substantive part and was heeded: both cited snippets say "serum brain natriuretic peptide", i.e. BNP, not the N-terminal fragment, so the sibling entries' NCIT:C88524 (N-Terminal Fragment Brain Natriuretic Protein) was NOT reused. Looked up the correct analyte and bound NCIT:C88523 Brain Natriuretic Peptide 32. The notes now state explicitly that BNP and NT-proBNP are different molecules measured by different assays and should not be conflated, so the divergence from the sibling entries is deliberate and legible rather than looking like an inconsistency.

    NON-BLOCKING 1 - the fatigue description claimed "near-universal", which no cached source supports; the only quotable sentence names "clinical heart failure symptoms" among recognised sequelae without naming fatigue or quantifying it. Rewrote the description to drop the frequency claim and to say explicitly that the widely repeated near-universal claim is not curated here.

    NON-BLOCKING 2 - the MAESTRO clinical trial description asserted the primary endpoint was negative "in less advanced patients". The trial outcome is not reported by any cached source in this entry, and the "less advanced patients" restriction was unsourced. Removed the outcome claim entirely and replaced it with the honest reason bosentan rather than macitentan is curated as the endothelin antagonist: BREATHE-5 is the trial whose positive result is quotable from a cached abstract.

    NON-BLOCKING 3 - the reviewer asked whether a downstream edge from the new arrhythmia node to the Sudden cardiac death phenotype was appropriate, conditional on downstream-targeting-a-phenotype being an established pattern. Checked it rather than guessing: across kb/disorders, 3971 of 6443 downstream edges target a phenotype name rather than a pathophysiology name, so it is not merely established but the majority pattern. Added the edge with its own evidence item, so the arrhythmic route now runs from RV pressure overload through the arrhythmic substrate to sudden cardiac death rather than stopping one step short.

    Validation actually run and read after the changes:
    - `just validate kb/disorders/Eisenmenger_Syndrome.yaml` - passed (schema, terms, references).
    - `just count-verified-snippets` - 105/105 snippets verified against cached references, 0 skipped by prefix. Unchanged in count because one evidence item was removed and one added.
    - `just validate-disorders kb/disorders/Eisenmenger_Syndrome.yaml` - passed.
    - `tests/test_data.py -k "conforms_to_module_node or graph or unique_name or subtype_foreign or treatment_mechanism or environmental_mechanism or clinical_trial"` - 5878 passed, exercising the new phenotype-targeting causal edge and the split genetic records.
    - `just compliance` - 97.1% global, 97.0% weighted, down from 97.9%. The drop is expected and is not a regression: splitting one genetic record into two and removing an unsupportable evidence item both add recommended-slot denominators without adding satisfied slots. Trading a compliance point for a correct controlled value and an honestly unsupported claim removed is the right direction.

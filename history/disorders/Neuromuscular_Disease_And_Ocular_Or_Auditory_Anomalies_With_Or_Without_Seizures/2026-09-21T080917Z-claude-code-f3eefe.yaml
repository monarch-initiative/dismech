  summary: Wire pathograph; record deep-research failure
  details: |
    Two changes before opening the PR.

    Pathograph wiring. Phenotype causal in-link coverage was 4/11, below the KB-wide floor, and the same gap was raised as a blocking finding on both sibling PRs in this batch (#12409 at 4/13, #12400 at 3/7), so it was fixed before review rather than after. The rule used is the one the entry already states: the Selective Failure of Neuromuscular and Sensory Tissues node names retina, cochlea, skeletal muscle and the developing CNS as the tissues this disease fails in, so phenotypes in those tissues hang off it and phenotypes elsewhere do not. Macular atrophy, optic atrophy, seizures and the autism phenotype are wired on that basis, each on evidence the entry already carried. Coverage is now 8/11.

    Three phenotypes are deliberately left unwired, with the reasons recorded in notes. Abnormal vertebral morphology is skeletal rather than neuromuscular or sensory, and the founding cohort that reports it spanned four different DExD/H-box genes so the finding is not specifically a DHX16 observation. Premature ovarian insufficiency is gonadal and outside the node's stated tissue set. Mitochondrial DNA depletion in skeletal muscle is the substantive one: the tissue is in the affected set, so what blocks the edge is causal direction rather than tissue selectivity - the authors write the depletion could be associated with the variant, and nothing establishes whether it is downstream of the splicing defect, parallel to it, or secondary. Wiring it would assert a direction the source declines to assert.

    Deep research failed and that is recorded rather than glossed. Two OpenScientist runs were attempted. The first was cancelled because five jobs were submitted concurrently while the provider queues them server-side and each job's timeout runs from submission. The second ran alone from 06:03:14 to 08:05:33 UTC on 2026-09-21 and hit the 7200 second ceiling: job b000eb3b-dca0-49a4-ae26-97499edf8a22 timed out and was cancelled by the client, writing no report. There is no deep-research report for this entry, nothing in it is sourced from one, and no other provider was substituted. Everything here was curated directly from PubMed-indexed primary literature with snippets verified against references_cache.

    Validation: just validate passes, 46/46 snippets verified, up from 42. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-snippet-grading all clean.

  summary: 'Create: DHX16-related neuromuscular oculoauditory syndrome (NEDOAS)'
  details: |
    New DISEASE entry for MONDO:0032890, DHX16-related neuromuscular oculoauditory syndrome.

    The interesting problem, and the reason the pathograph has a node that asserts something it cannot explain. DHX16 is the human Prp2 orthologue, a DEAH-box ATPase that activates the spliceosome immediately before the first catalytic step. It is core housekeeping machinery required for splicing introns generally. Yet the phenotype is a fairly reproducible three-tissue syndrome - developmental delay, neuromuscular involvement, retinal or auditory disease, seizures in some - rather than a generalised cellular failure. A node named 'Selective Failure of Neuromuscular and Sensory Tissues' holds that gap explicitly, and the edge into it is marked INDIRECT because the step from intron retention to specific tissue involvement is asserted by nobody. Candidate explanations from the wider spliceosomopathy field are deliberately not curated as edges.

    Mechanism, curated at step level. PMID:20423332 shows the discriminating observation: nuclear extracts from dominant-negative DHX16 cells still form splicing complex B but are impaired in splicing, so the block is at activation, not assembly. PMID:20841358 adds that the unspliced transcripts are retained in the nucleus and are not cleared by nonsense-mediated decay. PMID:42562406 is the only assay on an allele actually found in a patient, showing intron retention in HSPH1 and FOS.

    functional_impact_category is DOMINANT_NEGATIVE on three converging grounds - missense-only allele spectrum with no truncating variant reported, a residue hit by two different substitutions in unrelated patients, and mutant protein added to competent nuclear extract actively inhibiting splicing. That inference is flagged in an OPEN_QUESTION discussion rather than left as a bare enum value, because the direct-inhibition experiments used engineered constructs rather than patient alleles, and because PMID:37574199 found DHX16 expression decreased in patient fibroblasts and muscle, which is what a destabilising loss-of-function allele would do and is not what a stable interfering protein predicts. Those two observations have not been reconciled.

    Codon 454 is recurrent and is recorded as such: p.Arg454Trp (PMID:37574199, again in PMID:41052356) and p.Arg454Gly (PMID:42562406) - the same nucleotide, two different substitutions, unrelated patients.

    The mitochondrial DNA depletion is curated as a phenotype and explicitly not as a pathophysiology node, because its reporting authors call it a possible secondary manifestation and no route from the splicing lesion to mtDNA maintenance has been proposed. During curation the phenotype was first bound to the coarse term HP:0012103 with a coarse_binding_basis of NO_HPO_TERM; running the search that justification claimed returned HP:0009141 Depletion of mitochondrial DNA in muscle tissue, an exact match. The binding was corrected and the false justification removed. Recorded because it is the dismech-terms step-3a failure and it was caught only by running the search rather than asserting it.

    Module conformance left unset: kb/modules/ was grepped for splic, spliceosom, RNA, helicase, transcript and mRNA, and just list-modules read in full; no module covers spliceosomal dysfunction. A CURATION_TODO discussion records the case for one, and names the four existing spliceosomal-gene entries in the KB - PRPF31-Related_Retinopathy, Burn-McKeown_Syndrome, Mandibulofacial_Dysostosis_with_Microcephaly and Cerebrocostomandibular_Syndrome - all verified present, each modelling the pathway locally rather than through conforms_to. Those four were named by the automated second-opinion comment on claim issue #12391, which independently reached the same conclusion that no core-spliceosome module exists.

    Deep research: an OpenScientist run for this entry was launched with the others in this batch and had not completed when the entry was committed. It will be reconciled in a follow-up round before the pull request is opened.

    Validation. just validate passes with 42/42 snippets verified. just validate-terms, check-entity-refs, check-causal-targets and check-duplicate-keys all pass. just check-genereviews reports NO_CHAPTER.

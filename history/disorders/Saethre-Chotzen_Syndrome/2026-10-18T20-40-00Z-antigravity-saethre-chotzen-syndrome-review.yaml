      patterning (UBERON:0002101, GO:0030326, TISSUE scale) and wired cranial, facial,
      ocular, and limb phenotypes including Increased intracranial pressure (HP:0002516)
      and Hearing impairment (HP:0000365). 3. Added GeneReviews (PMID:20301368) Genetic
      Counseling evidence to inheritance and TWIST1 genetic block, populated classifications
      (GENETICS_ENVIRONMENT_DISEASE), progression, diagnosis, and treatment evidence/targets,
      and tagged PMID:20301368 with GeneReviews in references.

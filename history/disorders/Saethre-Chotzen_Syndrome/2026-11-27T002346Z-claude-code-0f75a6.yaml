  summary: Record TWIST1-related craniosynostosis (MONDO:0007399) as the CRS1 subtype
  details: |
    Resolved the claim on TWIST1-related craniosynostosis (MONDO:0007399, dismech#19034) as a SUBTYPE rather than a new Disease entry, and recorded it as a has_subtypes row on this entry.

    The decision, and what settled it. The claim was filed from the stub queue as a disease to curate, and an OpenScientist deep-research run was commissioned for it. The run reached PASS on just preflight-dr with TWIST1 mentioned 187 times, 39 of 39 references verified and a confabulation rate of 0, and it concluded in its own limitations section that the split between craniosynostosis 1 and Saethre-Chotzen syndrome is a curation artefact rather than a biological boundary. Checked independently rather than taken from the report: MONDO:0007399's definition read from OLS at MONDO release 2026-11-03 is gene-scoped, "Any craniosynostosis in which the cause of the disease is a mutation in the TWIST1 gene", which describes this entry's cause rather than a different disease; the term's only descendants-and-xrefs picture is thin, with no Orphanet and no ICD cross-reference; and MONDO places it over OMIM 123100, whose HPO annotation rests on two patients against the 49 terms annotated to Saethre-Chotzen. PMID:30651579 cites "Craniosynostosis (CS, MIM #123100)" for craniosynostosis in general, in a paper whose own TWIST1 cases are discussed against Saethre-Chotzen, which is evidence that the OMIM identifier is not used in the literature as a distinct TWIST1 entity.

    What stopped this being an OUT_OF_SCOPE disposal is that the isolated presentation is real. PMID:30651579 recovered two de novo TWIST1 variants from patients ascertained as coronal nonsyndromic craniosynostosis, and concluded that variants in syndromic-craniosynostosis genes play a role in isolated craniosynostosis. So a stratum exists; it is a point on this entry's expressivity range rather than a separate disease. The has_subtypes row records both halves of that, binds MONDO:0007399 so the concept is retired from the curation queue, and follows the pattern this entry already uses for Robinow-Sorauf, a historically separate label that TWIST1 evidence folded into the same spectrum.

    Two TWIST1 diseases were checked and deliberately not folded in, and the entry-level note says so: Sweeney-Cox syndrome (MONDO:0060592), whose own entry states its mechanism is antimorphic and explicitly not haploinsufficiency, and the 7p deletion craniosynostoses, which involve genes beyond TWIST1.

    Checked before composing, because the sibling ATP6AP2 curation in this session had to be restructured late for exactly this reason: which committed entries already bind TWIST1 or cover a TWIST1 phenotype, searched by gene and by name rather than only by MONDO identifier. That search found Saethre-Chotzen_Syndrome and Sweeney-Cox_Syndrome, which is what made the subtype reading available before any entry was written. A skeleton kb/disorders/TWIST1-Related_Craniosynostosis.yaml had been committed earlier in the session as a placeholder; it is deleted here, since no separate entry is warranted.

    Not done, and not needed for this disposition: the report's wider content on surgical management, intracranial pressure, cohort frequencies and mouse suture-boundary genetics is not curated here. This change is the scope decision and its evidence only, so the entry's existing pathophysiology, phenotypes and treatments are untouched. The report and its citations are committed alongside for whoever extends the entry from them. Thirty-six references the run fetched but this change does not cite were pruned, and one tracked references_cache file the run's own validator had rewritten, PMID_16540516.md, was reverted per dismech#9963; it had lost 37 lines.

    Validation: validate-disorders clean over the whole entry, 59 snippets and 67 titles with 0 issues, and 59 of 59 snippets re-verified after pruning. The MONDO:0007399 cache rows are committed so term validation runs offline.

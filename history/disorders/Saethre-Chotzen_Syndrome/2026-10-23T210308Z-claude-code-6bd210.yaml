  summary: Add Robinow-Sorauf syndrome as a subtype
  details: |
    Resolved the Robinow-Sorauf syndrome stub (MONDO:0008391) as SUBTYPE of Saethre-Chotzen syndrome rather than a separate disorder entry. Robinow-Sorauf is Saethre-Chotzen facies with bifid or partially duplicated halluces; TWIST1 frameshift and nonsense variants were found in Robinow-Sorauf families including the original family (Kunz 1999, Cai 2003), and both phenotypes segregated in one family (PMID:7793794). It shares the TWIST1 haploinsufficiency pathograph, so a separate entry would duplicate it. Added a has_subtypes row bound to MONDO:0008391 with four snippet-verified evidence items from PMID:25565733 and PMID:7793794. The Kunz and Cai papers have no PubMed abstract, so they are cited through the PMID:25565733 review rather than directly. Validated with just validate, count-verified-snippets (55/55) and validate-terms.

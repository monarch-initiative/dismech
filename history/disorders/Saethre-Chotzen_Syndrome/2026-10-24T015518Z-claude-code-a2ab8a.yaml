  summary: Add hallux duplication phenotype for the Robinow-Sorauf subtype
  details: |
    Review round 1 on PR 15431. Added the phenotype that defines the Robinow-Sorauf subtype: Duplication of phalanx of hallux (HP:0010066), scoped with subtype: Robinow-Sorauf because a duplicated distal hallux is what the historical Robinow-Sorauf label names, while its description records that GeneReviews (PMID:20301368) lists it as a less common finding of Saethre-Chotzen syndrome as a whole. Evidence is the GeneReviews sentence (OTHER, matching the grading already used for that sentence in this entry) and the PMID:25565733 foot radiograph caption (HUMAN_CLINICAL). Wired it into the pathograph with a downstream edge from Disrupted TWIST1-dependent limb bud mesenchyme patterning. Also marked the PMID:25565733 definitional sentence quote_role: BACKGROUND, since the case report restates the established clinical definition there.

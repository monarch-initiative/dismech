  summary: Add VEGF-inhibitor drug-cause arm conforming to vegf_inhibitor_hypertension
  details: |
    Enriched kb/disorders/Secondary_Hypertension.yaml with a worked drug-cause arm, wiring it as the first conformer of the new kb/modules/vegf_inhibitor_hypertension.yaml module (issue #5923).

    The entry's own description already named 'certain drugs' as a cause of secondary hypertension but modelled none of them; before this change the file carried a single pathophysiology node (Sympathetic and hormonal coactivation). Two nodes were added:

    1. 'VEGF Pathway Inhibitor Exposure' (role: trigger, biological_scale: MOLECULAR), conforms_to vegf_inhibitor_hypertension#VEGF Signaling Pathway Inhibition.
    2. 'Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance' (role: central_effector, biological_scale: TISSUE), conforms_to vegf_inhibitor_hypertension#Vasoconstriction and Increased Peripheral Vascular Resistance, with a downstream edge to the entry's existing Hypertension phenotype.

    The node descriptions state explicitly that this is one worked exemplar of the drug cause and that other pharmacological causes (NSAIDs, combined oral contraceptives, glucocorticoids, calcineurin inhibitors, sympathomimetics) are equally in scope for this entry but are not yet modelled, so the entry is not read as claiming VEGF inhibitors are the only drug cause.

    Evidence reuses two module references (PMID:36621810, PMID:29931399), both already fetched via 'just fetch-reference'. The reversibility-on-withdrawal quote is curated here specifically because it distinguishes this drug cause from the structural and endocrine causes of secondary hypertension.

    Validation run this session: linkml-validate 'No issues found'; linkml-term-validator validate-data --labels 'Validation passed'; 'just count-verified-snippets' over this file plus the module reported 27/27 snippets verified against cached references. The slow batched 'just validate-disorders' pre-PR sweep was then run and passed on this file (schema, terms, and references; 6/6 snippets verified); it skipped the module file as a non-disorder path, so the module was reference-validated separately via scripts/run_reference_validator.sh.

    Left unchanged deliberately: the deprecated updated_date field already present on this entry (per CLAUDE.md, existing entries may retain it until a bulk cleanup).

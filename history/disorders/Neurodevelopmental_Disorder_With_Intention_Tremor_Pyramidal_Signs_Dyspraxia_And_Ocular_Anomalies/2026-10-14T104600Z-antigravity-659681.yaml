  summary: 'Create: Neurodevelopmental_Disorder_With_Intention_Tremor_Pyramidal_Signs_Dyspraxia_And_Ocular_Anomalies'
  details: |
    Initial curation of neurodevelopmental disorder with intention tremor, pyramidal signs, dyspraxia, and ocular anomalies (MONDO:0859274) caused by homozygosity for the Finnish founder hypomorphic missense variant SMG9 c.551T>C p.(Val184Ala) (PMID:35087184). Curated clinical cohort phenotypes, structural/biochemical studies of the SMG1-SMG8-SMG9 complex (PMID:31792449), selective endogenous transcript dysregulation (SMOX, OSBP2, GPX3, RAP1GAP, MAP1B, TUBB2A, HEY1, ZNF155), smg9oi7/oi7 zebrafish SMOX/acrolein/ROS and radial glial progenitor rescue studies (PMID:38806677), and allelic/subunit differential diagnoses (HBMS MONDO:0014833, Alzahrani-Kuwahara syndrome MONDO:0859136; PMID:27018474, PMID:35321723, PMID:33242396).

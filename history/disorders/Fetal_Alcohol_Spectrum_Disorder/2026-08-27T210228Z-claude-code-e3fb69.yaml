  summary: 'Act on approving-review suggestions: facial triad phenotypes, CYP2E1,
    phenotype frequencies'
  details: |
    Acted on the non-blocking suggestions from the approving re-review of PR #9719. Suggestion 2 turned out to be actionable: two reviews that state the FAS facial triad explicitly were located (PMID:23439907 and PMID:24639410) and the three cardinal features are now curated as bound phenotypes — short palpebral fissure HP:0012745, smooth philtrum HP:0000319, thin upper lip vermilion HP:0000219 — each marked diagnostic with an OCCASIONAL frequency, because PMID:24639410 states that only a minority across the spectrum exhibit the facial phenotype at all. The fasd_dysmorphology_criteria discussion is closed with a resolution_note. Suggestion 3: added frequency to the five pre-existing phenotypes. Suggestion 4: added CYP2E1 as a second MODIFIER carrying the same negative study, with a SUPPORT item establishing that rs3813867 was tested and a REFUTE item for the null result. Suggestion 5: regraded the Hoyme consensus practice guideline PMID:27464676 from HUMAN_CLINICAL to OTHER, since it is an expert-consensus document rather than a primary clinical study. Suggestion 1 was not actionable and remains recorded in the Nager notes — the Orphadata snapshot pinned in data/orphadata/MANIFEST.yaml is no longer retrievable. Validated: 50/50 snippets verified, all gates pass.

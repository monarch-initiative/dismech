  summary: 'Create: Fetal Alcohol Spectrum Disorder'
  details: |
    New entry created to host the Xenopus retinaldehyde dehydrogenase competition model from Disease Models and Mechanisms (PMID:19380308). Scope is deliberately narrow and stated as such: the pathograph curates the retinoic acid route only (ethanol competing for RALDH activity at the onset of gastrulation, reduced retinoic acid signaling, multisystem malformation), with a CURATION_TODO discussion recording that apoptosis, oxidative stress, adhesion and growth-factor mechanisms are not represented. The animal model carries three readouts covering the phenocopy, rescue and epistasis arms, the last recorded as UNCHANGED because ethanol adds nothing once RALDH2 is knocked down. The sentinel facial features used diagnostically are omitted rather than sourced to a paraphrase, and tracked as a second CURATION_TODO. Prenatal alcohol exposure is curated in environmental with an ECTO binding and an influences_mechanisms link. Validated: 29/29 snippets verified.

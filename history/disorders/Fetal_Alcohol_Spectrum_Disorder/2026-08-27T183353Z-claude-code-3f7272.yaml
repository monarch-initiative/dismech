  details: |
    Response to the REQUEST_CHANGES review on PR #9719. Added reference_title to all 29 evidence items and a top-level references block. Added has_subtypes for the four spectrum categories: FAS and pFAS bound to MONDO, ARND and ARBD deliberately left unbound because MONDO's nearest concepts are different criteria sets and an approximate mapping on a diagnostic category would mislead. Added a diagnosis section with three items sourced to the 2016 guidelines and the 2025 diagnosis review. Added a genetic section for ADH1B as a MODIFIER carrying its conflicting evidence in both directions, including an explicit REFUTE item for the negative 303-child/251-mother study. Added a second prevalence record for high-risk populations and a clinical_burden block. Updated the dysmorphology CURATION_TODO to reflect that the guideline is now cited for the scoring system while the sentinel facial triad itself remains unquotable from the abstract. Validated: 42/42 snippets verified.

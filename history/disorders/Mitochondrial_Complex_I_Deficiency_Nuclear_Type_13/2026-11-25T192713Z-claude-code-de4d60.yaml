  summary: 'Gene-family review: NDUFA2, NDUFS1, NDUFV1, NDUFV2'
  details: |
    NDUFA2 is an accessory subunit that binds the matrix arm only through its contact with NDUFS1 and is too far from any cluster to do chemistry (PMID:33233646). The node Destabilisation of the NDUFA2-NDUFS1 Contact now binds structural molecule activity, decreased, for NDUFA2. The N-module node that names the core subunits NDUFS1, NDUFV1 and NDUFV2 lost secondarily now binds NADH dehydrogenase (ubiquinone) activity, decreased, matching its evidence that complex I activity is extremely low for lack of the NADH-binding module; those three genes are named only as secondarily lost subunits and have no genetic record here. Structural molecule activity is GO's term for a molecule that contributes to the structural integrity of a complex or its assembly, the role of complex I accessory subunits.

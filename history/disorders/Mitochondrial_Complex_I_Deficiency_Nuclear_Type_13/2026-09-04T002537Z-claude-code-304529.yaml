  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 13 (MONDO:0032618,
    NDUFA2)'
  details: |
    Created kb/disorders/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_13.yaml
    (MONDO:0032618, NDUFA2, OMIM 618235). Scope: DISEASE, standalone, consistent with
    MC1DN types 2, 6, 12, 23, 24, 31 and 34. Stub deleted.

    Leigh check, done for this term rather than assumed from MC1DN1: MONDO:0032618 has
    exactly one superclass, MONDO:0100223, and is NOT placed under Leigh syndrome; and
    kb/disorders/Leigh_Syndrome.yaml does not bind NDUFA2 (it binds NDUFS4, NDUFV1,
    SURF1, LRPPRC, MT-ATP6, PDHA1). So the MC1DN1 precedent transfers. The real tension
    is curated rather than smoothed: only one of the four reported patients had Leigh
    disease, and the modal published phenotype is a leukodystrophy.

    Deep research: falcon (Edison), NEC preflight PASS (NDUFA2 62 mentions; SLC22A5
    correctly identified as a dual diagnosis rather than a competing cause). Its
    denominator is three patients rather than four because it did not retrieve
    PMID:32154054. Its full-text-derived clinical detail is recorded as uncited leads in
    prose only.

    Sources: PMID:18513682 (Hoefs 2008, abstract), PMID:28857146 (Perrier 2018,
    abstract), PMID:32154054 (2020, abstract), PMID:33233646 (Dang 2020 structural
    review, full text) which carries most of the structural and per-patient detail and
    is graded OTHER where it restates other papers and COMPUTATIONAL where it analyses
    published structures.

    Deliberate exclusions: decreased circulating carnitine, which is in the HPOA set for
    OMIM:618235 but belongs to the SLC22A5 dual diagnosis in one patient (own discussion);
    NDUFA2 p.Asp50Asn from a breast-cancer screen; no treatments block; no biochemical,
    dataset, animal-model or trial content, none of which exists.

    Validation: just validate exit 0; 42/42 snippets verified; check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-snippet-grading, check-title-snippets,
    check-snippet-length, check-folded-hyphens all exit 0. check-snippet-grading caught
    one real inconsistency during drafting (a summary sentence about the patient's
    mutation graded both HUMAN_CLINICAL and IN_VITRO); resolved to HUMAN_CLINICAL
    following the MC1DN24 precedent for that sentence type.

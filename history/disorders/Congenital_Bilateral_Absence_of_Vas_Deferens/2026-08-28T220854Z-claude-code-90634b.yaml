  details: |
    De novo curation of congenital bilateral absence of the vas deferens, MONDO:0018801, claimed via issue #9941. One OpenScientist deep-research report was run: research/Congenital_Bilateral_Absence_of_Vas_Deferens-deep-research-openscientist.md. Reference validation reported 25/25 verified; term validation reported five mislabelled terms, including MONDO:0009299 offered under the bare label MONDO when the ontology calls it 46 XX gonadal dysgenesis. No CURIE from the report was bound; all bindings were resolved independently against the term caches and OLS. Scoped to isolated CBAVD with CFTR-related and ADGRG2-related has_subtypes; congenital unilateral aplasia is recorded as a differential diagnosis rather than a subtype. Validated with just validate at 30/30 snippets verified.

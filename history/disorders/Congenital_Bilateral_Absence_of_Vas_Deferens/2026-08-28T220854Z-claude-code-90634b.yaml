  summary: 'Create: Congenital_Bilateral_Absence_of_Vas_Deferens'
  details: 'De novo curation of congenital bilateral absence of the vas deferens, MONDO:0018801, claimed
    via issue #9941. One OpenScientist deep-research report was run: research/Congenital_Bilateral_Absence_of_Vas_Deferens-deep-research-openscientist.md.
    Reference validation reported 25/25 verified; term validation reported five mislabelled terms, including
    MONDO:0009299 offered under the bare label MONDO when the ontology calls it 46 XX gonadal dysgenesis.
    No CURIE from the report was bound; all bindings were resolved independently against the term caches
    and OLS. Scoped to isolated CBAVD with CFTR-related and ADGRG2-related has_subtypes; congenital unilateral
    aplasia is recorded as a differential diagnosis rather than a subtype. Validated with just validate
    at 53/53 snippets verified after two rounds of review, which added the poly-T tract and variant spectrum,
    prenatal CFTR modulator therapy, corrected anatomy on the seminal vesicle phenotype, subtype MONDO
    bindings, prognosis and the GeneReviews baseline. SLC9A3 is recorded as SUSCEPTIBILITY: the human
    evidence is a heterozygous single-copy deletion in a small series and the causal demonstration is
    in a homozygous-null mouse, which is short of what CAUSATIVE asserts.

    '

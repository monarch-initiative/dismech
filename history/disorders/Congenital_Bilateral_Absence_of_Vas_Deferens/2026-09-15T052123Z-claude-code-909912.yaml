  summary: 'Review round: qualify Adgrg2 model, add CFTR rat/mouse models'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED round on PR #10669. (1) The Adgrg2/He6 knockout mouse link was asserting RECAPITULATES against 'Progressive Involution of Mesonephric Duct Derivatives' while its own limitations text recorded that the mouse shows efferent-ductule dilation and testicular fluid backup rather than the duct involution the node describes; downgraded to PARTIALLY_RECAPITULATES and said why in the link description. (2) The animal_models section had been created with only a modifier gene (SLC9A3) and a ~2% X-linked cause (ADGRG2), omitting CFTR, which the entry itself says explains most cases; added a CFTR-knockout rat model (RECAPITULATES, fidelity HIGH, hypospermatogenesis divergence in limitations, two readouts) and a CFTR knock-in/partial-knockout mouse model (FAILS_TO_RECAPITULATE with both limitations and evidence, since residual-function alleles leave fertility intact). Both cite the already-cached comparative review PMID:42380629. (3) Took the three reviewer suggestions: rebound the epididymal epithelial cell descriptor from CL:0000066 (epithelial cell) to the more specific and still accurate CL:0000068 (duct epithelial cell), rewriting the note to keep the record of the absent male-excurrent-duct term; changed the seminal fructose readout direction from PRESENT_ABSENT to THRESHOLD_DEPENDENT to match its own quoted >25 microM cutoff; added frequency: FREQUENT from the deep-research grading. Validation: just validate (67/67 snippets verified), just validate-terms, just check-entity-refs, just check-causal-targets, just check-duplicate-keys all pass. Note quote_role is not yet in this branch's schema copy, so the review-sourced evidence items carry evidence_source: MODEL_ORGANISM without it.

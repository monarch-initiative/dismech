  summary: 'Review fixes: NTM Lung Disease (PR #9728)'
  details: |
    Address ai4c-reviewer findings on PR #9728. C5: re-pointed Granulomatous Inflammation conforms_to from the TNF-driven node (contradicted by its mouse evidence showing no TNF difference) to granuloma_formation#Persistent Indigestible Stimulus; framed the TNF-inhibitor risk as clinical predisposition (PMID:30302953). C1: wired all phenotypes into one connected pathograph. Retagged PMID:33563837 (mouse) OTHER to MODEL_ORGANISM. Split two bundled nodes (host susceptibility into structural-lung-disease + impaired-Th1; progressive destruction into nodular-bronchiectatic + fibrocavitary). Softened the ribosome-target claim and added MAC-specific grounding. Added hemoptysis, dyspnea, night-sweats phenotypes; an acquired-macrolide-resistance node conforming to bacterial_protein_synthesis_inhibition#Ribosomal Target Resistance; structured prevalence (PMID:25692495); an ATS/ERS/ESCMID/IDSA diagnosis block; a Nrf2-deficient mouse animal_models entry; the CONVERT trial (NCT02344004); and evidence on the infectious_agent entries. 57/57 snippets verified; schema and term validation pass; conforms_to/model/clinical-trial guards green.

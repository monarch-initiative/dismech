  details: |
    Added diagnosis_term (NCIT:C25300 Microbial Culture Procedure) and diagnosis[].measurements binding LOINC:543-9 (Mycobacterium sp identified in Specimen by Organism specific culture) to the ATS/ERS/ESCMID/IDSA diagnostic criteria row. Confirmed the code by direct Monarch KG entity lookup. The genus-level code is the honest identity binding here for the same species-scope reason applied to Borrelia in Relapsing_Fever: this disease spans the whole NTM species complex rather than one named organism, and the criterion itself is repeated culture of the same species, not a specific species identity. No cross-branch collision against any open loinc-*-batch* branch. New cache/loinc/terms.csv row, confirmed absent from origin/main before seeding.

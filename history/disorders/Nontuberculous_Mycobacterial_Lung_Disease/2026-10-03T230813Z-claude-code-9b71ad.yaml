  summary: 'Rung-3 review: split NTM lung disease by species; add transmission'
  details: |
    Applied the rung-3 lump/split test of the infectious-disease granularity ladder (design decisions section 3e, rules R6 to R16) plus the rule R25 transmission requirement.

    Decision: SPLIT. Three has_subtypes rows were added with classification etiologic_species, for Mycobacterium avium complex, Mycobacteroides abscessus and Mycobacterium kansasii. The deciding axis is first-line treatment and drug susceptibility, and the ATS/ERS/ESCMID/IDSA clinical practice guideline (PMID:32636299, already cached in this repository) states a different regimen for each: a macrolide-containing three-drug regimen for macrolide-susceptible MAC pulmonary disease, a rifampicin-plus-ethambutol-plus-isoniazid-or-macrolide regimen for rifampicin-susceptible M. kansasii, and for M. abscessus a susceptibility-guided multidrug regimen of at least three active drugs with no recommended duration, because an inducible erythromycin resistance methylase makes the macrolide unreliable as a counted active drug. Those three regimens share no common anchor drug, so the therapy axis of rule R7 is cleared by each stratum independently.

    MISSING_TRANSMISSION was also fixed. Two routes were added, both inhalational and both quoted from the review already cited by the entry's environmental-exposure pathophysiology node (PMID:30302953): aerosol from engineered water systems, above all hot tubs and showerheads, and aerosol from natural water and soil, which the organisms' surface hydrophobicity favours. No agent_life_cycle block was added.

    subtype_term is omitted on all three rows under rule R12. runoak against ols:mondo finds no Mycobacterium kansasii or Mycobacteroides abscessus disease class and no descendant of this entry's disease_term MONDO:0018469. For MAC it finds MONDO:0005866 Mycobacterium avium complex disease, which names MAC disease at any site including disseminated MAC and MAC lymphadenitis and so is broader than this pulmonary stratum; it is recorded as a skos:broadMatch row in that subtype's mappings rather than bound in subtype_term, and the term and label were added to cache/mondo/terms.csv and the diseaseterm enum cache by validation.

    The entry's notes paragraph that described species subtyping as a possible future refinement was rewritten, because it now describes work that has been done; the fibrocavitary versus nodular-bronchiectatic distinction is left as a radiographic pattern rather than an organism stratum. Nothing else was touched: disease_term, pathophysiology, phenotypes, treatments, animal_models and clinical_trials are unchanged, and no progression block was added. Validation: just validate-disorders over the four entries in this tranche reported 248 snippets checked and 0 issues; just check-granularity on this file no longer reports TAXON_LUMP or MISSING_TRANSMISSION.

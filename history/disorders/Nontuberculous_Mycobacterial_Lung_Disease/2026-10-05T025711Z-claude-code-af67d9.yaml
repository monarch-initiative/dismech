  summary: 'Review round 1 on PR 13501: regrade the PMID:33563837 epidemiology quote,
    add three reference titles'
  details: |
    Both blocking findings of the first review round on PR 13501.

    The PMID:33563837 item quoting 'Mycobacterium avium complex (MAC) is the most common cause of pulmonary NTM disease worldwide' was graded MODEL_ORGANISM in two places, on the MAC has_subtypes row added by that PR and on the pre-existing MAC infectious_agent record. The sentence is human epidemiology stated in the introduction of a mouse Nrf2 study, so MODEL_ORGANISM asserted that a mouse measured human disease frequency. Both copies are now HUMAN_CLINICAL with quote_role BACKGROUND, which is what CLAUDE.md's quote_role section prescribes for exactly this shape, and both explanations were rewritten: they previously argued for the retired grade. check-snippet-grading keys on the quoted sentence, so the two copies had to move together. The six other PMID:33563837 items in this entry quote the study's own mouse results and correctly remain MODEL_ORGANISM.

    Three evidence items were missing reference_title: that MAC subtype item and both PMID:30302953 items in the transmission block added by the same PR. Each title was read programmatically from the title: line of its references_cache file rather than typed, which is the failure mode check-reference-titles exists to catch.

    The entry's notes sentence that said evidence was 'classified MODEL_ORGANISM for the mouse MAC-infection findings (PMID:33563837)' described repository state that is no longer true, so it now distinguishes that study's own mouse findings from the background epidemiology quoted out of its introduction.

    No KB content claim changed: no subtype was added or removed, no snippet text altered, and the lump/split decisions of the parent PR stand. Validation: just validate on this file reported 0 issues, count-verified-snippets over the PR's four entries 248/248, check-snippet-grading and check-reference-titles both clean against origin/main, and check-granularity still reports neither TAXON_LUMP nor MISSING_TRANSMISSION.

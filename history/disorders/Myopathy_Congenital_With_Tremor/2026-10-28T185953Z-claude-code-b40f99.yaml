  summary: 'Create: Myopathy_Congenital_With_Tremor'
  details: |
    New Mendelian entry for congenital myopathy with tremor (CMYO16, "Myotrem", MONDO:0032797), claimed in issue 15834. Pathograph: heterozygous MYBPC1 M-motif missense variant -> altered sMyBP-C binding to myosin (increased for Y247H, E248K and the LKR duplication; decreased for L263R) -> sarcomere disorganization and reduced force (E248K knock-in mouse) -> hypotonia, axial and proximal weakness, type 1 fiber atrophy and the skeletal deformities; and -> spontaneous oscillation of slow muscle fibers (PROVISIONAL; mouse fibers) -> the 10-11 Hz myogenic tremor of limbs and tongue. The gene node carries myosin binding (ABNORMAL) and functional_impact_category NEOMORPHIC because the variants change binding in both directions rather than removing the protein. E248K knock-in mouse linked to the sarcomere and oscillation nodes, with the 55-65 Hz mouse tremor frequency recorded as a limitation. Allelic distal arthrogryposis type 1B and lethal congenital contracture syndrome 4 recorded as differentials, with spinal muscular atrophy and essential tremor. Deep research: one OpenScientist report (8/8 references resolved; preflight anchored on MYBPC1; a single de novo MYH7 tremor case it discusses is a different disease and is excluded). Validated with just validate, count-verified-snippets and the whole-repo gates.

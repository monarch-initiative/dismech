  details: |
    Answers the round-3 review in one push.

    IMPORTANT 1. PMID:32112337 was graded evidence_source: HUMAN_CLINICAL on the Reduced THAP1 Transcriptional Regulatory Function node. The publication is entirely cell-based (SK-N-AS and HEK293 transfection, patient fibroblast immunoblot, microarray, ChIP-seq, promoter luciferase); cached MeSH is Cell Line Tumor, Cells Cultured, HEK293 Cells, Fibroblasts, Neurons. Regraded IN_VITRO with directness: INDIRECT, because the quoted sentence is the paper's introduction summarising the published mutation spectrum rather than a result it measures. The same PMID is graded IN_VITRO at four other sites in this file, not two as the review stated; verified by enumerating every occurrence.

    SUGGESTION 2 taken. The PMID:20825472 cohort sentence (4.5 percent overall, THAP1 1.8 percent) appeared both inside the new genetic.case_fractions record and on the THAP1 record's own evidence list. Checked the cited Bardet-Biedl_Syndrome precedent directly: its four duplicated snippets are all ORPHA table rows reused across phenotypes, and no cohort figure is duplicated between case_fractions and record-level evidence. Dropped the record-level copy; the structured record retains it with its own evidence.

    Third instance of one defect class in this entry. Round 2 fixed PMID:39732371 graded HUMAN_CLINICAL; this round fixes PMID:32112337. Both are papers whose quoted sentence is *about* humans while the publication is not a human clinical study. check-snippet-grading cannot see either, because it keys on the quoted sentence and this PMID carries a different sentence at each site.

    A file-wide re-audit was written for this round rather than checking only the lines the review named: for each PMID in the file, collect the set of evidence_source values. It found a fourth divergence, PMID:19182804, which was examined and deliberately NOT changed. Fuchs 2009 reports both the human family discovery (three Amish-Mennonite families) and an in vitro DNA-binding demonstration, and the two evidence items quote those two results separately. That is the split-by-source pattern CLAUDE.md prescribes for a paper that mixes evidence types, so the divergence is correct.

    That false positive is the useful result: a PMID-keyed grading check cannot be a gate, because the correct handling of a mixed-source paper produces exactly the signal it fires on. It belongs in the report-only class next to list-gene-term-mismatches.

    Validation: 51/51 snippets verified (52 before the duplicate was removed), schema and terms pass, per-file and whole-KB offline gates green.

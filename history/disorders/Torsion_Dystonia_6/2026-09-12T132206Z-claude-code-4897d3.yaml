  summary: 'Create: Torsion Dystonia 6 (THAP1, MONDO:0011264)'
  details: |
    De novo curation of torsion dystonia 6 (DYT6, DYT-THAP1) from claim issue #11739.

    Curated as a Disease distinct from the existing Cervical_Dystonia entry. That entry covers common adult-onset sporadic focal cervical dystonia, deliberately binds no causal gene, and types THAP1 as SUSCEPTIBILITY on the grounds that these genes explain a small minority of unselected cases; the cohort cited here puts THAP1 at 1.8 percent of an unselected primary dystonia series. DYT6 is the Mendelian entity itself: one gene, dominant transmission with reduced penetrance, characteristic early-onset craniocervical and laryngeal involvement with limb spread.

    The pathograph runs from heterozygous THAP1 loss-of-function variants through reduced THAP1 transcriptional regulatory function, transcriptional dysregulation executed through the SP1 family, and reduced striatal GABAergic transmission, to basal ganglia and cerebellar motor network dysfunction and isolated dystonia. Three distinct molecular routes to the second node are curated separately because they are separately demonstrated: impaired DNA binding, reduced protein stability, and abolished HCFC1 cofactor recruitment at promoters where DNA binding is intact.

    The entry is built to show where the chain is strong and where it is not. The molecular and cellular ends are supported by human in vitro work including patient-derived iPSC striatal medium spiny neurons. The final edge from network dysfunction to dystonia is inferred and is marked as such: no curated study demonstrates it in humans, and no model reaches it.

    Model mismatch is recorded structurally rather than as prose. Germline Thap1 deletion is embryonic lethal; the heterozygote, the genotype that should model human haploinsufficiency, is rescued by autoregulatory upregulation of the intact allele and has no phenotype; conditional nervous-system deletion gives locomotor deficits and a dystonia-related transcriptional signature but not dystonia. These are two AnimalModel records with FAILS_TO_RECAPITULATE and PARTIALLY_RECAPITULATES links, typed divergences, and a HUMAN_MODEL_MISMATCH discussion carrying a proposed experiment.

    Deep research: one openscientist report was run and is committed alongside the entry. just preflight-dr returned PASS. The report's own Term Validation section flagged four genuine ontology confabulations, and none reached this entry because every CURIE here was read from cache/ or an OAK lookup at the moment it was written: HP:0002408 offered as Torticollis is Cerebral arteriovenous malformation (entry uses HP:0000473), HP:0001350 offered as Dysphonia is Slurred speech (entry uses HP:0012049 Laryngeal dystonia), NCIT:C1084 offered as botulinum toxin is Staphylococcal Enterotoxin B (entry uses no agent term and says why), and NCIT:C38150 offered as deep brain stimulation is PEComa (entry uses NCIT:C21024). A fifth identifier, HP:0004350, does not exist in HPO. The report did not repeat the THAP1/THAP11 confusion of issue #10948; it uses HGNC:20856 correctly.

    Schema notes for reviewers. One divergence is typed OTHER because ModelDivergenceTypeEnum has no value for a model that reproduces the mechanism but not the phenotype. CLAUDE.md names INCOMPLETE_PHENOTYPE as a likely future addition to that enum and I initially used it; schema validation rejected it, correctly, and the description records the substitution.

    Several phenotype evidence items carry directness: INDIRECT with an explanation stating that the cached abstract establishes cranial or craniocervical involvement without naming the individual body region. That is recorded rather than smoothed over, because the alternative was to attach a quote that does not say what the phenotype claims.

    Validation: just validate passed with 40/40 snippets verified; just validate-terms passed; check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms all clean.

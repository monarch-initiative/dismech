  summary: 'Review round 1: consume the deep-research report the entry was contradicting'
  details: |
    Answers all six blocking findings of the round-1 review in one push. The common cause of five of them was under-consumption of the deep-research report committed in this same PR, and in two places the entry asserted a negative that its own report contradicts.

    1. Genotype-phenotype correlation. The entry asserted in three places that none exists, on a 2011 review of 56 families. PMID:22377579 (>1800 subjects) reports the opposite: truncating and THAP-domain missense variants manifest earlier and spread further. Verified in the committed report at finding F011. The description, genetic notes and KNOWLEDGE_GAP rationale now record a genuine dispute rather than a settled negative, and the contradicting sentence is curated as a REFUTE evidence item against the no-correlation claim rather than omitted.

    2. Two-hit model. The entry said the mouse does not get the disease. PMID:39732371 shows sciatic nerve crush in Thap1+/- mice produces significantly more dystonia-like movements than in naive heterozygotes and than in injured wild-types. Added as a second modeled_mechanisms link on the same animal model, PARTIALLY_RECAPITULATES against Isolated Dystonia at ORGANISM scale, with a SPECIES_MISMATCH divergence marked QUALIFYING because a nerve crush is not a human precipitant. The existing FAILS_TO_RECAPITULATE link against the molecular node is kept and is still correct: it concerns steady-state dosage, which autoregulation does rescue. The HUMAN_MODEL_MISMATCH prompt and rationale were rewritten, since their premise was false.

    3. DBS evidence. The treatment notes claimed no publication reported outcomes in genotyped THAP1 patients. False, and falsifiable from this PR's own report. PMID:31817799 is a genotyped multicentre cohort with a median 58 percent reduction; PMID:21949105 records that the response is weaker than in DYT1. Both curated; the false claim is replaced by a note saying what it was.

    4. Botulinum toxin modality. SMALL_MOLECULE was wrong for a roughly 150 kDa bacterial protein. Changed to OTHER, with the reasoning recorded. PEPTIDE would be nearly as wrong at that size and PROTEIN_REPLACEMENT does not apply. A KB-wide scan found botulinum treatments carrying SMALL_MOLECULE about as often as OTHER, which is worth a separate sweep.

    5. GeneReviews. Recorded in a new top-level notes block per the Neurodevelopmental_Disorder_with_Hypotonia_and_Speech_Delay convention: the query THAP1 AND GeneReviews[All Fields] run 2026-09-13 returns exactly one hit, PMID:20301334, whose cached content is only the chapter's six-point purpose statement with no quotable clinical finding. Checked rather than mined, and not cited.

    6. TOR1A derepression. Added as a distinct MOLECULAR pathophysiology node with a downstream edge from Reduced THAP1 Transcriptional Regulatory Function, citing PMID:20976771 and PMID:20865765. This is THAP1's best-characterised direct target and the molecular bridge to DYT1. No downstream edge is asserted from it, because how much of the dystonia is attributable to TOR1A derepression rather than the wider SP1-mediated change is not established.

    Non-blocking items also taken: penetrance quantified at 40-60 percent and mean onset age 16.8 years, both now cited; an oral pharmacotherapy tier added from PMID:31117876.

    Process failure worth recording: three reference_title values in this round were written from inference rather than read from the cache, and all three were wrong. Reference validation caught all three. They were replaced by reading the title: frontmatter programmatically. This is the same failure class the titles convention exists to prevent, committed while fixing a review about evidence discipline.

    Validation: 51/51 snippets verified, schema and terms pass.

  summary: 'Review round 2: correct supports and evidence_source on two items I introduced'
  details: |
    Answers both blocking findings of the round-2 re-review plus both carried-over suggestions and one non-blocking observation. Both blocking findings are defects I introduced in the round-1 fix commit.

    1. supports: REFUTE pointed at the wrong object. I graded the PMID:22377579 item REFUTE intending it to cut against the 2011 review's no-correlation claim. But supports grades evidence against the record it hangs on, and that record is the THAP1 Genetic entry typed CAUSATIVE, which the paper affirms. Read as the KB reads it, the item said the paper contradicts THAP1's causal role in DYT6. The reviewer's internal tell is decisive: the same PMID sat on the same record twice, once REFUTE and once SUPPORT, and two items on one record cannot diverge when supports is relative to the attached claim. Changed to SUPPORT with the explanation rewritten to describe what the paper shows. The literature dispute was already carried twice, by the record's notes and by the dyt6_no_genotype_phenotype_correlation rationale.

    2. A mouse paper graded HUMAN_CLINICAL. PMID:39732371 is the Thap1(+/-) multi-omics study; its cached MeSH terms are Animals, Mice, Mice Knockout, Disease Models Animal, and the same PMID is graded MODEL_ORGANISM twice on the animal model in the same file. evidence_source classifies the publication, not the claim. Changed to MODEL_ORGANISM with directness INDIRECT, because the quoted sentence is the paper's background statement of a human penetrance figure rather than a result it measures. The explanation now says the primary human penetrance source would be better and is not cited.

    Worth recording why no gate caught either: check-snippet-grading keys on the quoted sentence, and this PMID carries different sentences in the two places, so the divergence is invisible to it. Nothing at all compares supports against the record an item hangs on.

    Suggestion 3 taken, by removal rather than by moving. GO:0007268 chemical synaptic transmission was bound on Basal Ganglia and Cerebellar Motor Network Dysfunction, which carries biological_scale TISSUE. The upstream CELLULAR node already binds GO:0051932 synaptic transmission GABAergic, which is strictly more specific, so moving the generic term down would have duplicated it at lower precision. The TISSUE-node binding is dropped instead.

    Suggestion 4 taken: the 1.8 percent THAP1 and 4.5 percent combined cohort figures are now a genetic.case_fractions record with its own evidence, following the Bardet-Biedl_Syndrome pattern, instead of living only inside an evidence explanation.

    Observation taken: the DBS notes narrated this entry's own revision history. That belongs in a history record, which is here, and self-referential edit history in curation notes rots. Trimmed to the ontology-confabulation note.

    Validation: 52/52 snippets verified, schema and terms pass, all ten whole-KB gates green.

  summary: 'Create: Intellectual_Developmental_Disorder_With_Macrocephaly_Seizures_And_Speech_Delay'
  details: |
    New entry for PAK1-related IDDMSSD (MONDO:0032568, OMIM 618158). Curated from PubMed primary reports (Harms 2018, Horn 2019, Kernohan 2019, Ohori 2020, Corriveau 2023, Scorrano 2023, Wang 2025, two Chinese case reports, a 2025 case report/review), the 2023 PAK-NDD review, Parrini 2002 (wild-type PAK1 trans-inhibition), Huang 2011 (Pak1/Pak3 double knockout brain size) and a 2026 NanoBRET study; 15 references cited. Pathograph: loss of autoinhibitory homodimerization -> constitutive kinase activation -> downstream JNK/AKT signalling and actin (filopodia) dysregulation in patient fibroblasts, plus indirect edges to postnatal megalencephaly, structural brain anomalies and impaired neurodevelopment, with all 15 phenotypes wired. GAIN_OF_FUNCTION recorded because Harms 2018, Horn 2019 and the 2023 review state it. Patient fibroblasts recorded as an experimental model (FRAX486 rescue readout). No mechanism module conformed: the seizure mechanism has not been studied. One OpenScientist deep-research report was used as leads (9/9 references resolved, preflight-dr PASS); it supplied Parrini 2002 and Huang 2011. Its claim that Horn 2019 showed dimer dissociation and autophosphorylation experimentally was not adopted: that sentence is background in Horn's abstract, and Horn's own evidence is structural modelling. Validation: validate, validate-terms, count-verified-snippets 68/68, entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, duplicate-keys, enum-values, block-scalar-comments, logical-rules, snippet gates, gene-term mismatches all pass; check-genereviews reports no GeneReviews chapter.

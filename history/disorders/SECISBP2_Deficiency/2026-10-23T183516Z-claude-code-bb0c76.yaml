  summary: Wire the hearing phenotype to oxidative-stress vulnerability
  details: |
    The entry's `Sensorineural hearing impairment` phenotype was causally disconnected: `Impaired thyroid hormone metabolism` had an empty `downstream`, and the phenotype's own description attributed the deficit to impaired selenoprotein-dependent thyroid hormone action during cochlear development.

    Reading the cited source (PMID:21084748) against that claim showed it says the opposite. Its discussion raises the thyroid route, notes that hearing loss occurs in dio2-null mice but that these patients' hormone profile fits a combined partial deficiency of all deiodinases rather than that pattern, and proposes oxidative cochlear injury as the alternative mechanism, supported by the age-severity gradient between its two probands. The entry's description asserted the mechanism its own source set aside.

    So the edge was drawn from `Oxidative-stress vulnerability` instead, and the phenotype description was corrected to state the source's position. The edge carries two evidence items rather than one, because the sentence making the argument mixes evidence types: the cochlear-ROS and GPx1-null premise is graded MODEL_ORGANISM with quote_role BACKGROUND, since the discussion is restating work done elsewhere in knockout mice, and the authors' application of it to their own patients is graded HUMAN_CLINICAL. Both are directness INDIRECT; neither is a measured result.

    The thyroid comparison itself is recorded in the edge description rather than as a snippet. Both sentences carrying it are broken mid-word across lines in the cached record (the thy- / roid, deiodin- / ases), so no verbatim quote matches after normalization, and bridging the gap with an ellipsis would omit the word the claim depends on.

    No new references were needed; PMID:21084748 was already cited and cached.

    Validation, all on the changed file: linkml-validate no issues; term validation passed; reference validation 26/26 snippets checked, 26 titles checked, 0 issues; entity refs resolve; no new broken pathograph targets; no duplicate keys; no out-of-enum values; snippet-grading, retired-grade-prose, folded-hyphen and reference-title gates clean. Phenotype causal-inlink coverage for this entry moved from 0/11 to 1/11.

    Prompted by an evaluation of AOP-Wiki AOP 8 (monarch-initiative/enviromech#13), which is where the thyroid-to-hearing question came from. That evaluation's own chain does not apply here, and finding that out is what produced this correction.

  summary: Bind ECTO/XCO exposure_term on pathograph-linked environmental exposures
  details: |
    Bound exposure_term on environmental[] entries that carry influences_mechanisms and so render as nodes in the mechanism graph: Ultraviolet Radiation Exposure -> ECTO:0000006 (exposure to ultraviolet radiation); Immunosuppression (Organ Transplant) -> ECTO:9001747 (exposure to immunosuppressive agent). Terms were selected against the local sqlite:obo:ecto / sqlite:obo:xco builds that conf/oak_config.yaml configures for term validation, not against OLS, because the OLS-served ECTO release contains terms the pinned build lacks. Verified with linkml-validate (schema) and linkml-term-validator (--labels, dynamic-enum membership); no evidence items were added or changed, so snippet validation is unaffected.

  summary: Add checkpoint inhibitor outcomes in transplant recipients
  details: |
    Issue #12839 (preprint scan PPR:PPR1323317). Extended the Cemiplimab treatment description to cover solid organ transplant recipients: checkpoint inhibitors still produce responses in advanced cSCC, but allograft rejection and graft loss are treatment-limiting, and mTOR inhibitor plus corticosteroid maintenance is associated with fewer rejections. Because the preprint cannot be sole support, added peer-reviewed evidence from a phase I cemiplimab trial in kidney transplant recipients (PMID:38252908) and an individual participant data meta-analysis of 343 transplant recipients (PMID:40545616), with the preprint as secondary support. Validated with just validate-disorders; 27/27 snippets verified against cache.

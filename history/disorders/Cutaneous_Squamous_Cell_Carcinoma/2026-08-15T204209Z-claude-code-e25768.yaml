  summary: Add ICD-O morphology and Harrison's chapter classification
  details: |
    Weekly compliance pass, cancer-classification/ICD-O theme. Added a classifications block with icdo_morphology=Squamous Cell Carcinoma and harrisons_chapter=ONCOLOGY_HEMATOLOGY. Derivation: the entry disease term MONDO:0002529 skin squamous cell carcinoma carries NCIT:C4819 Skin Squamous Cell Carcinoma, which OAK confirms is a descendant of NCIT:C2929 Squamous Cell Carcinoma, the NCIT term the ICDOMorphologyEnum Squamous Cell Carcinoma value is bound to. Harrison chapter set to ONCOLOGY_HEMATOLOGY rather than DERMATOLOGY because the entry covers oncological staging and systemic therapy. Validated with just validate.

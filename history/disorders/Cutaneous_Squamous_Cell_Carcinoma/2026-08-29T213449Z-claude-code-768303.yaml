  summary: 'Review: Cutaneous Squamous Cell Carcinoma evidence re-read against cached
    sources'
  details: |
    Re-read all 9 cached references and re-verified all 22 evidence items. 17 of the 22 ride
    on DOI: references that the repo validator skips entirely, so this was their first check;
    all are substring-exact under whitespace normalization. No fabricated, paraphrased or
    hallucinated snippet, and no title-as-snippet. The problems are claim-evidence fit rather
    than quoting.

    Recorded for follow-up:
    - histopathology[Squamous Cell Carcinoma of Skin] describes nests and sheets of atypical
      squamous cells with keratinization, but its sole evidence is an epidemiology sentence
      about cSCC being the second most common skin cancer with rising incidence. The cached
      abstract describes no histology at all, so SUPPORT is not defensible.
    - phenotypes[Squamous Cell Carcinoma of the Skin] claims lesion morphology and anatomic
      distribution; its quote is about surgical cure rates and an aggressive subset.
    - phenotypes[Actinic Keratosis] asserts that fewer than 0.1% of individual AKs progress,
      evidenced by a quote about perilesional field-cancerized tissue that says nothing about
      AKs or any rate. The entry's own cached full text
      (DOI:10.1038/s41467-023-40822-9) states "fewer than 0.1% of individual AKs will progress
      to cSCC" verbatim and should be cited instead.
    - A bare driver-gene list ("TP53, the NOTCH family, CDKN2A, PIK3CA, and EGFR") is reused
      three times to carry precise prevalence figures (TP53 in 54-95%) and a UV-signature C>T
      claim that it does not state.

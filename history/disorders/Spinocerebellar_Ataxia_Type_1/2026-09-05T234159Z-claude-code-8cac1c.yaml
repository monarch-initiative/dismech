  summary: Fix sub-5-word evidence snippet flagged by CI
  details: |
    CI (test 3.13) failed on PR #11197 with one finding, and it was a real
    defect in this entry:

      treatments[7].evidence[0].snippet: 4 word(s): 'vitamin supplementation as needed'

    That snippet was added during the pre-PR review round to support the
    GeneReviews vitamin-supplementation treatment. Four words is below the
    five-word floor: a bare phrase carries no propositional content and cannot
    support the claim. Replaced with the fuller clause from the same
    GeneReviews Management sentence, "caloric support for those with weight
    loss; vitamin supplementation as needed", verified as an exact substring of
    references_cache/PMID_20301363.md. The explanation now records why the
    adjacent caloric-support clause rides along, since caloric support itself
    is curated under the Dysphagia and Nutritional Management treatment.

    WHY THE PRE-PR CHECK MISSED IT. The curation session ran
    `just check-snippet-length`, which grandfathers against the committed
    baseline file. CI runs
    `scripts/check_snippet_length.py --against-ref "origin/$BASE_REF"`, and in
    that mode grandfathering is unavailable, so the ref-based invocation is
    strictly stricter than the recipe. The entry was reported clean against the
    permissive form. This is a gap in the curation loop, not a flake.

    Rather than fix only the flagged line, CI's step list in
    .github/workflows/main.yaml was diffed against what the session had
    actually run. Two gates had never been executed at all:
    `check_reference_titles.py --against-ref` (relevant, the entry adds about
    90 reference_title fields) and
    `dismech.reference_cache_frontmatter references_cache` (relevant, the PR
    commits 39 cache files). Both were run and are clean, as are
    check_title_snippets --against-ref, check_folded_hyphens,
    term_cache_integrity, not4curation_audit, check_environmental_evidence,
    dismech-stubs check and validate-history-all. tests/test_data.py passes
    locally at 6088 tests. check_source_defect_claims is report-only and
    unchanged by this edit.

    After the fix: just validate passes, snippets 95/95 verified, and
    `check_snippet_length.py --against-ref origin/main` passes in CI's exact
    form.

    The push was briefly held to bundle with the in-flight claude-review, since
    main has dismiss_stale_reviews enabled and a review lands on the commit it
    checked out. It was released while that review was still running because
    red CI is work now regardless of review state; the review re-triggers on
    the new head.

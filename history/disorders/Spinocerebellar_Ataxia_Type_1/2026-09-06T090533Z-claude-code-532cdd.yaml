  summary: 'Address ai4c-reviewer changes-requested review on PR #11197'
  details: |
    Addresses the ai4c-reviewer changes-requested review on PR #11197 (run
    34022708678, the first of five review attempts to actually read the diff;
    the previous four errored at 0s on an account limit). All seven findings and
    all three suggestions are handled in this one push, per the repo's
    one-push-per-review convention.

    CRITICAL 1, stale prevalence prose. The notes paragraph still asserted that
    no SCA1-specific prevalence study was identified and that the record was
    class-level only. That was true when written and became false when the
    SCA1-specific record (1-2 per 100,000, PMID:37238658) was added in the same
    session; the paragraph was instructing readers to disregard the entry's own
    headline figure. Rewritten to describe both records and why each is carried.

    IMPORTANT 2, sentence fragment. The CAG-expansion node description ended in a
    dangling subordinate clause, collateral from softening an earlier
    RNA-toxicity exclusion. Rewritten as a complete sentence that points at the
    new RAN branch instead of gesturing at a claim it cannot support.

    IMPORTANT 3, three absent mechanistic branches, all with caches this PR had
    already committed and never cited. Added as pathophysiology nodes wired into
    the existing chain:
    - Non-Cell-Autonomous Oligodendrocyte Dysfunction (PMID:42113962). Mutant
      ataxin-1 in oligodendrocytes alone is sufficient for dysmyelination,
      Purkinje axonal shrinkage and torpedo formation. This fills the gap the
      entry's own notes had conceded, and it converges on the existing Purkinje
      dysfunction node rather than forming a parallel chain.
    - Repeat-Associated Non-AUG Translation (PMID:41422503). PolySer/polyLeu
      aggregates in SCA1 autopsy brain, prominent in white matter where
      polyglutamine is minimal, impairing autophagy. Routed out of the expansion
      node, which is why that node no longer claims a protein-level mechanism to
      the exclusion of RNA-level ones.
    - RBFOX1-Mediated Alternative Splicing Dysregulation (PMID:37802886), routed
      out of the Capicua node as a transcript-level mechanism distinct from the
      transcriptional one.

    IMPORTANT 4, no symptomatic pharmacotherapy. Added off-label riluzole,
    4-aminopyridine and varenicline with CHEBI agent bindings, and non-invasive
    neuromodulation, both from PMID:41387161, with the source's own
    "subtype-specific benefits" wording quoted so no SCA1 efficacy is claimed.
    Troriluzole added separately and deliberately hedged: see the verification
    note below.

    IMPORTANT 5, biomarkers and diagnostics. Added a biochemical block for blood
    neurofilament light chain (PMID:42677125) recording the premanifest window
    that matters given the ATXN1-lowering ASO already curated, plus diagnosis
    entries for CAT-interruption determination by triplet-primed PCR and
    enzymatic digestion (PMID:39289638) and for SARA/MRI staging with the
    source's stated sensitivity limitation.

    IMPORTANT 6, genetic modifiers. Added TGM5 (PMID:35499073), including the
    human-brain colocalization result so the modifier claim is not model-only,
    and RBFOX1 (PMID:37802886) matching the new splicing branch.

    SUGGESTIONS. Added the patient iPSC-derived neuronal model as an
    experimental_models entry linked to the Purkinje dysfunction node with a
    PROXY_QUANTITY divergence recording that these are not Purkinje cells
    (PMID:37278528); added the posterior-vermis severity gradient to the Purkinje
    degeneration node (PMID:38750673); and dropped the GO:0051402 neuron
    apoptotic process binding that the entry's own notes had flagged as copied
    from the conformance targets and inconsistent with non-classically-apoptotic
    Purkinje death, keeping a free-text preferred_term.

    TWO REVIEWER CLAIMS VERIFIED RATHER THAN ACCEPTED. The review cited
    PMID:40988103 as a source for troriluzole in cerebellar ataxia. That paper is
    a rat opioid-addiction study; the ataxia statement is a single aside in its
    conclusions. The phrase is real and quoted exactly, but the treatment entry
    is graded OTHER and its description says explicitly that this establishes
    only that the trials exist, not any SCA1 result. Separately, a title I
    guessed for PMID:37802886 was wrong and check_reference_titles caught it;
    corrected to the cache's title.

    RESEARCH CONSUMPTION. Evidence-cited PMIDs went from 18 to 29 of the 39
    committed caches. PMID:42608759 was additionally taken up in the genetic
    section for the gain-of-function-plus-partial-loss framing. Of the remaining
    ten, two are declined on relevance grounds and named in notes
    (PMID:31523939 is a SCA2/SCA3 cohort; PMID:19429075 is a Cuban SCA2
    founder-effect study whose repeat-length correlation is SCA2, verified by
    reading it), and the rest are the report's own citations covering other
    ataxias, regional cohorts and preclinical compounds with no SCA1 standing,
    now described in notes rather than left unexplained.

    VALIDATION. just validate passes; snippets 125/125 verified, up from 95. The
    full twelve-gate set was re-run in CI's exact command form against
    origin/main, and tests/test_data.py was run locally.

  summary: Third main-merge round on the SCA1 curation branch
  details: |
    Third branch-maintenance round on PR #11197. No change to the SCA1 entry
    itself; this record exists because the branch history changed again.

    main advanced 4 commits and the PR conflicted on two derived caches this
    time rather than one: cache/enums/diseaseterm_f618932bb23f.csv, which has
    now collided on all three merges, and cache/hgnc/terms.csv, which is new
    because the review round added the gene rows for TGM5 (hgnc:11781) and
    RBFOX1 (hgnc:18222). Both are append-to-sorted-file caches that every
    merged curation PR writes to, so the collision surface grows with the
    number of ontology prefixes an entry touches. git auto-merged both without
    a conflict hunk; all three of this branch's cache rows survive, verified
    individually.

    Resolved by merging origin/main, as in the previous two rounds, rather than
    rebasing: PR #11197 is authored by another account and a force-push would
    invalidate that checkout. No cache row was hand-written or reordered.

    Post-merge review: the diff against the new origin/main is exactly this
    PR's own 54 files. No unrelated deletions, no stale reversions, no
    protected-path churn.

    Re-validated: just validate passes and snippets remain 125/125 verified.
    The full twelve-gate set was re-run against the new origin/main in CI's
    exact command form.

    Cost of this merge, recorded deliberately: the branch was reviewer-APPROVED
    on commit ab46d2bc9 as of 09:27 UTC, and main enables dismiss_stale_reviews,
    so this push drops that approval and triggers a fresh review. That is
    unavoidable and correct - a conflicted PR cannot merge, and the alternative
    is leaving the branch un-mergeable to preserve an approval it could not act
    on. The five non-blocking notes from the approving review are still NOT
    bundled into this push: they are curation-quality points with no gate
    effect, and this round is mechanical merge maintenance, so mixing them in
    would put unreviewed content changes into a commit whose purpose is to
    restore mergeability.

  summary: Add the neuroblastoma-like schwannoma subtype
  details: |
    Adds a has_subtypes row for neuroblastoma-like schwannoma, a rare benign histological variant whose small round Schwann cells form rosettes around collagen cores and can be mistaken for neuroblastoma. Part of the neuroblastoma expansion series (issue 15822), which records conditions that must be told apart from neuroblastoma.

    Binding: NCIT:C207079 'Neuroblastoma-Like Schwannoma', checked in OLS on 28 Oct 2026: not obsolete, sole parent NCIT:C3269 Schwannoma, and under all three DiseaseOrSubtypeTerm roots. MONDO has no class for this variant.

    Evidence: eight items from four references, all human case material graded HUMAN_CLINICAL. The original three-case series (Goldblum, Beals and Weiss 1994, PMID:8116794) supplies the histology, the immunophenotype (S-100 positive; neurofilament protein, PGP and synaptophysin negative) and the basis on which the schwannoma diagnosis was made. A 2003 case report and literature review (PMID:12544097) corroborates the collagen-core rosette pattern and, in its second sentence, names neuroblastoma, peripheral neuroectodermal tumours and malignant change in a schwannoma as the differential diagnoses, an independent source for the neuroblastoma differential besides the 1994 series. A 2010 case report and review (PMID:19922484) supports the rarity, the 1994 first description and the benign, sporadic character. A 2016 skull-base case report (PMID:27151231) supports the rarity and the mimicry of malignant small round cell tumours. The immunophenotype and the hyperchromatic-cell detail are attributed to the original series only, because a later review (PMID:42378124, not cited) tabulates neurofilament positivity in 2 of 8 reported cases.

    Left out: SOX10 status (no English abstract states it); the reported association with SMARCB1-related schwannomatosis (two single case reports, PMID:22082606 and PMID:26715928; the row covers histology only); the 2019 proposal (PMID:30582192) to rename giant-rosette tumours; subtype frequency (no source gives a fraction). The five existing subtype rows are unchanged.

    Review round 1 (approved, two optional suggestions, both taken): the 2003 differential-diagnosis sentence was added as an evidence item, with a matching sentence in the subtype description, and the evidence count in this record was corrected.

    Validated with just validate-disorders, count-verified-snippets --strict, check-snippet-grading, check-reference-titles-present and the whole-repo gates in run_c4 (all pass).

  details: |
    The Ganglioneuroma entry names schwannoma as a differential diagnosis; this entry had no differential diagnoses. A new differential_diagnoses section carries one row that points back, bound to MONDO:0005033. Nothing existing in the entry is changed.

    The row rests on PMID:41563553, already cached and already cited by the Ganglioneuroma entry: a study that pooled 30 adrenal schwannomas and 27 adrenal ganglioneuromas, most from published reports. Four quoted items: the two tumours named together as benign adrenal lesions (BACKGROUND); their similarity except for the younger age of ganglioneuroma patients, 28 against 49.5 years, with all schwannomas and 92.5% of ganglioneuromas nonsecretory; progressive delayed enhancement on computed tomography in all schwannomas and 70.4% of ganglioneuromas; and the authors' conclusion that the pattern is specific for the two tumours together. The row lists age as the one separating feature and says that hormone status and the enhancement pattern do not separate them. It states that the evidence is for adrenal tumours only. The sentences shared with the Ganglioneuroma entry keep its grading (REVIEW_SYNTHESIS, HUMAN_CLINICAL).


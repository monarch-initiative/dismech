  summary: 'Schwannoma: add perineurioma as a differential diagnosis'
  details: >-
    Added perineurioma as a differential diagnosis of schwannoma, bound to MONDO:0019404, with 18
    evidence items: the longitudinal series of intraneural perineurioma naming schwannoma in its
    differential diagnosis (PMID:19567701); a 2002 marker study of soft tissue perineurioma, which
    compared its cases with mimics including schwannomas, noted that EMA may be focal or faint, and
    found claudin-1 in 11 of 12 selected perineuriomas, in none of the lesional cells of the mimics
    and in a subpopulation of cells of presumed perineurial lineage in one of four schwannomas
    reported, and whose authors place claudin-1 as an adjunct to EMA (PMID:12459629); a 2003 study
    finding S-100 protein-positive Schwann cells in schwannoma and EMA- and GLUT1-positive, S-100
    protein-negative tumor cells in three perineuriomas and four perineurial malignant peripheral
    nerve sheath tumors, and judging GLUT1 and EMA specific to perineurial cells (PMID:12692193);
    the 81-case soft tissue series, with claudin-1 in 22 of 76 tumors and S-100 protein in 4 of 81
    (PMID:15958848); a 2012 review on S-100 protein in schwannoma, EMA in most perineuriomas, its
    table's EMA row (graded INDIRECT, since the table has no perineurioma column), the limited
    specificity of claudin-1 and GLUT1, set beside the 2003 study's view, and hybrid
    schwannoma-perineurioma tumors (PMID:22327363); and focal S-100 staining in 3 of 10 intraneural
    perineuriomas, which the authors read as likely residual Schwann cells (PMID:41657107). It is
    the counterpart of the Schwannoma row on the Perineurioma entry, a row scoped to the intraneural
    form; this row covers both forms and adds the two marker studies and the 81-case series. Quotes
    shared with that entry keep its evidence_source and quote_role, and the new prose uses this
    entry's spelling. Two new reference cache files. just validate, validate-terms and
    count-verified-snippets pass.

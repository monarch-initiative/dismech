  summary: 'Schwannoma: point the melanotic subtype at its own entry'
  details: |
    Pointed the schwannoma entry's Melanotic/Psammomatous Schwannoma subtype row at the
    malignant melanotic nerve sheath tumour entry, which curates that tumour in full: added
    curated_in: Malignant_Melanotic_Nerve_Sheath_Tumor, the subtype term melanotic neurilemmoma
    (MONDO:0002558), which is that entry's disease term, and two sentences, one on the renaming
    in the 2020 and 2021 WHO classifications and the tumour's recognition as a distinct entity,
    with two evidence items from a 2023 review already cached (PMID:38025185), quoted and graded
    as the target entry quotes them, and one naming the file the tumour is curated in. So that
    the entry no longer carries a view that diverges from the tumour's own entry (design
    decisions section 3a L4 (d) and section 3e R20, applied by analogy), the row's opening
    sentence now says the tumour was formerly classed as a variant of schwannoma, its next
    sentence compares it with schwannomas, in which malignant transformation is rare, instead of
    counting it among them, and the entry-level description no longer lists melanotic schwannoma
    among the current variants but says that the WHO now classes it as a distinct tumour. The
    row keeps its name and display name, the clause on the syndrome it is associated with is
    unchanged, and nothing moves out of the entry. Validated with just validate,
    count-verified-snippets, validate-terms and check-granularity.

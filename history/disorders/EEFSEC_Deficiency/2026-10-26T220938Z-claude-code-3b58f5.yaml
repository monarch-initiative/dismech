  details: |
    Responded to the 2026-10-24 review. Removed the supportive care treatment, whose only evidence was a sentence about potential future targeted therapies, and recorded in notes why no treatment is curated. Removed GO:0051402 neuron apoptotic process from the neurodegeneration node, since PMID:39753114 reports MRI hypoplasia and atrophy and not the mode of neuronal death. Removed brain and cerebellum locations, GO:0003746 and selenocysteine from the fibroblast selenoprotein node so the readout node no longer duplicates the trigger node, and removed the neuron cell type and brain/cerebellum locations from the trigger node, keeping fibroblast. Removed the unsourced diagnostic flags from phenotypes. Added the eEFSec-RNAi Drosophila model as an animal model partially recapitulating progressive neurodegeneration, quoting the abstract with evidence_source MODEL_ORGANISM. Corrected the earlier session record's details and added the PR link. Left cerebellum development on the neurodegeneration node; splitting out a developmental node is a judgement for the author.

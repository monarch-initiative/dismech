  summary: 'Gene-family review: EEFSEC; record the basis for CAUSATIVE and an independent
    replication'
  details: |
    Reviewed EEFSEC modelling: the node binds translation elongation factor activity (GO:0003746) as decreased with selenocysteine incorporation decreased; GO has no selenocysteine-specific elongation-factor term, so the binding stands. ClinGen has not classified EEFSEC. CAUSATIVE was kept: the founding report has nine individuals from eight unrelated families with six biallelic variants, reduced fibroblast selenoprotein levels and a Drosophila knockdown model (PMID:39753114), and an independent compound-heterozygous case with impaired serum selenoprotein synthesis (PMID:40652205) is now cited on the record. The record's note states this basis. Two further 2026 reports (PMID:41517874, PMID:42609176) were found and not added.

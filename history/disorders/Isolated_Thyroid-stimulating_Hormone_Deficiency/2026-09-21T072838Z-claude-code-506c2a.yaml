  summary: 'Review round 1 on PR #12400'
  details: |
    Addressed all three IMPORTANT findings and both applicable suggestions from the ai4c-reviewer round on 261d12be.

    Finding 1, disconnected second root. Invisibility to TSH-Based Newborn Screening had no incoming edge. It is now downstream of Failure to Assemble Bioactive TSH Heterodimer, which is the right parent rather than the low-hormone state: the absent bioactive heterodimer is itself the analyte a TSH-based screen measures, so a screen looking for raised TSH reads normal in exactly the patients who have none. The pathograph now has a single root, Biallelic TSHB Loss of Function.

    Finding 2, four disconnected phenotypes. Hypotonia, Failure to thrive, Short stature and Intellectual disability are now downstream of Systemic Thyroid Hormone Deficiency, each on evidence the entry already carried on the phenotype itself.

    Finding 3, a prevalence note that contradicted its own numbers. The note claimed the pooled 3.3-7.7 per 100,000 range sat below the Dutch T4-screening figure of 1 in 16,000, and drew an ascertainment inference from that. 1 in 16,000 is 6.25 per 100,000, which is inside the range. The comparison was wrong and so was everything built on it. Rewritten to state that the two sources are consistent and that no ascertainment inference can be drawn, with the earlier mistake recorded rather than silently removed.

    Suggestion taken: the CAGYC conservation snippet is regraded from HUMAN_CLINICAL to OTHER. The quoted sentence is a comparative-sequence observation across paralogues, not a clinical finding in the patients, even though the variant was found by sequencing them. The reasoning is written into the explanation so the grade is not re-litigated.

    Suggestion taken in part: four further phenotypes named in a snippet the entry already holds are now curated with HPO bindings looked up rather than recalled - Hypothermia HP:0002045, Lethargy HP:0001254, Constipation HP:0002019, Umbilical hernia HP:0001537 - each wired from the systemic node on the same verified sentence. Generalized edema HP:0007430 was NOT added. The term resolves, but it comes from the deep-research report and no cached reference for this entry mentions edema, so there is no sentence to quote. Curating it would have meant inventing a snippet.

    Phenotype causal in-link coverage is now 11/11, 100 percent, from 3/7.

    Validation: just validate passes, 66/66 snippets verified, up from 53. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-snippet-grading all clean. The pathograph root check confirms a single root.

  summary: 'Create: Isolated Thyroid-stimulating Hormone Deficiency (TSHB)'
  details: |
    New DISEASE entry for MONDO:0010139, the TSHB-caused form of congenital central hypothyroidism.

    Scope decision. Curated as the TSHB entity only, not the wider clinical category of congenital central hypothyroidism. IGSF1, TBL1X, TRHR and IRS4 also cause central hypothyroidism and are each a different disease with its own MONDO term and its own extrathyroidal features. A kb/groupings/ record over the clinical differential is recorded as a CURATION_TODO discussion rather than created here.

    Deep research: research/Isolated_Thyroid-stimulating_Hormone_Deficiency-deep-research-openscientist.md, provider openscientist, 26 citations, run 2026-09-21. just preflight-dr against MONDO:0010139 returned WARN, reporting IGSF1 mentioned 33 times against TSHB's 67 and warning the report may mix in a second disease entity. That is exactly what it does; the IGSF1, TBL1X, TRHR and IRS4 sections were excluded rather than curated down, and nothing in this entry is sourced from them.

    Two items from the report's own validation output were followed up rather than accepted:

    - Its reference validation listed PMID:25248602 as unresolved (8 mentions), which would bar citing it. Re-fetched with just fetch-reference PMID:25248602 on 2026-09-21; it resolves cleanly to Persani & Bonomi, 'Uncertainties in endocrine substitution therapy for central endocrine insufficiencies: hypothyroidism', and contains both sentences the report quoted. The flag was a transport-level lookup failure, not a confabulation. It is cited in this entry and the re-check is recorded in the entry's notes as well as here.
    - Its term validation reported 8 of 14 checked labels as naming a different term. One is substantive: the report gives CL:0000209 for 'thyrotrope/thyrotropic cell of pars distalis'. CL:0000209 is taste receptor cell. This entry uses CL:0000476 thyrotroph, looked up in cache/cl/terms.csv. No CURIE in this entry was taken from the report without an independent lookup.

    The report's most valuable contribution was a negative one, verified directly against PMID:34981755 before recording: TSHB p.R75G, a founder variant at ~4% carrier frequency in Bene Israel Indian Jews, does not cause this disease. It leaves TSH function intact and defeats its detection on some immunoassay platforms, producing a spurious low TSH in euthyroid people. Without the report this entry would probably have curated it as a pathogenic founder allele, since it reads that way from a title search. It is curated as an INTERPRETATION discussion with a REFUTE evidence item.

    Curation notes. Invisibility to TSH-based newborn screening is modelled as a pathophysiology node rather than left in prose, because in this disorder the detection pathway determines the outcome as directly as the biology: everything downstream of it is preventable, and the within-kindred contrast in PMID:27362444 (three late-diagnosed relatives with neurodevelopmental retardation, the younger sibling treated from birth developing normally) is curated as a paired SUPPORT/REFUTE on the developmental-delay phenotype. The recurrent frameshift allele appears in the literature under two cDNA numberings (c.373delT and c.313delT) depending on whether the signal peptide is counted; the entry names it at protein level to avoid implying two alleles. No numeric reference intervals are recorded for TSH or free T4: the cited sources state directions but no intervals, and importing a conventional adult band into a congenital disorder would misstate the age-specific ranges.

    Validation. just validate passes with 50/50 snippets verified against cached references. just validate-terms, just check-entity-refs, just check-causal-targets and just check-duplicate-keys all pass. just check-genereviews reports NO_CHAPTER for both GeneReviews and StatPearls against the committed Bookshelf index snapshot of 2026-09-10, which is the basis for the no-chapter statement in the entry's notes.

    Four NCIT and CL identifiers were written from memory during drafting and were wrong: NCIT:C16340 (Biomedical Ethics, written as Blood Group Determination, in a sibling entry), NCIT:C38086 (Renography, written as Laboratory Procedure), NCIT:C177209 (Believe, written as Newborn Screening), and the report's CL:0000209. All were caught by just validate-terms or by cache lookup and replaced with looked-up terms. Recorded because the failure mode is the one CLAUDE.md describes under 'Every CURIE is read from a source in the same step it is written' and it recurred several times in one session.

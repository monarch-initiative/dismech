  summary: 'Scoping response: engage the existing Central_Congenital_Hypothyroidism
    entry'
  details: |
    Revision round answering the automated second-opinion comment on claim issue #12392, which found that kb/disorders/Central_Congenital_Hypothyroidism.yaml (MONDO:0016410) already exists, already carries a TSHB genetic row, and is MONDO's parent of MONDO:0010139 - and argued this should perhaps be a has_subtypes row there rather than a standalone entry.

    The standalone entry is kept, on a mechanistic ground. The parent entry's pathograph is rooted at 'Impaired Hypothalamic-Pituitary TSH Drive', and that node is the wrong description of this disease: in TSHB deficiency the drive is intact and the hormone it produces cannot assemble. The founding report (PMID:2792087, newly added this round) shows the mutant beta polypeptide is conformationally altered and cannot associate with the alpha subunit. Folding TSHB into a regulatory-drive node would assert a mechanism that is wrong for it. What the parent carries for TSHB today is a gene row with one citation and an inheritance block, not a pathograph.

    Changes in this round:
    - mappings.mondo_mappings added, skos:broadMatch to MONDO:0016410, so the relationship to the parent entry is queryable from this side. broadMatch deliberately does not retire the parent from the curation queue, which is correct.
    - The scope note rewritten to engage the parent entry directly instead of not mentioning it, which was the real defect in the first version.
    - PMID:2792087 added, with two evidence items on the heterodimer-assembly node. This is the founding 1989 report and it upgrades that node from inference to direct demonstration: the CAGYC-region substitution produces a beta polypeptide that cannot pair with alpha, shown by microinjection into Xenopus oocytes.
    - PMID:39913280 added with a category-level incidence record (1 in 13,000-30,000), marked as an upper bound on this disease rather than an estimate of it, and noting that it sits below the Dutch T4-screening figure - ascertainment under T4 screening finds more than the pooled estimate assumes.
    - The entity-boundary discussion rewritten to name two concrete follow-ups: the parent entry carries no mappings block and no reciprocal cross-reference, and a grouping over the clinical differential should wait until more than one of IGSF1/TBL1X/TRHR/IRS4 is curated. Neither is actioned here because both change files outside this PR's scope.

    Recorded honestly: the duplicate preflight for this claim searched origin/main for MONDO:0010139 and for the label, and found nothing. It did not search for TSHB or for 'central congenital hypothyroidism', which is how an entry covering the same gene was missed. That is the exact failure the claim-disease skill warns about when it says the claim check cannot see a disease curated under a different term.

    Validation after the round: just validate passes with 53/53 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-coarse-phenotypes all pass.

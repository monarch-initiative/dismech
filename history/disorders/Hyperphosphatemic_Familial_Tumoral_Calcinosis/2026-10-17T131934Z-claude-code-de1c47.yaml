  summary: Record that tubular phosphate reabsorption and TmP/GFR have no LOINC code,
    and why the complement must not be substituted
  details: |
    LOINC Diagnostics tranche G, batch 27 (functional and provocative tests with diagnostic thresholds). Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows at all. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 435 snippets and 466 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Nothing is bound on either phosphate-handling row, and the finding is why. Tubular reabsorption of phosphate is the reabsorbed fraction as a percentage, so the 96 per cent this entry quotes is one hundred minus the fractional excretion. LOINC 2.83 codes the excreted fraction, as LOINC:50057-9 and LOINC:56925-1, and binding either would attach a figure of 96 to a scale on which the same patient reads 4. The relation being arithmetic is exactly what makes the substitution tempting and wrong, and it would pass every gate. The release's two phosphate renal clearance codes, LOINC:2776-3 and LOINC:50058-7, are a third quantity again, a volume rate. The derived index TmP/GFR has no code of any kind: neither the release table nor the KG returns a record for a tubular reabsorption of phosphate or for TmP. The diagnosis row already carried a notes field recording the parallel NCIT absence with its runoak queries; rather than add a second notes key, which is the duplicate-key failure mode, the LOINC paragraph was appended to that existing field and the original text kept verbatim. No reference ranges were added, there being no code to key one to.

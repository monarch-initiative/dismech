  summary: Bind alpha-Klotho co-receptor activity on the KL node
  details: |
    The KL loss-of-function node named KL but carried no GO molecular function. Added GO:0015026 coreceptor activity (DECREASED), the KL core molecular function in ai-gene-review, with two PMID:17710231 snippets: the background statement that FGF23 requires klotho to bind and signal through FGFRs, and the primary in vitro result that H193R KL expression and secretion are reduced, diminishing FGF23 signalling. GALNT3 and FGF23 nodes already carried their core activities and were left unchanged.

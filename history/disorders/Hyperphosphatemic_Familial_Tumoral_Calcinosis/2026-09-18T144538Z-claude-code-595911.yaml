  summary: 'Address review: diagnosis section and term rebindings'
  details: |
    Addressed the automated review on PR 12108. Term rebindings (all labels verified with runoak -i ols:<ontology> info): sevelamer therapeutic_agent CHEBI:32127 Sevelamer hydrochloride -> CHEBI:759084 sevelamer, because no cited source names a salt; the pathophysiology location 'subcutaneous tissue' UBERON:0002190 subcutaneous adipose tissue -> UBERON:0002072 hypodermis; the Heterotopic Ossification phenotype HP:0010766 Ectopic calcification -> HP:0011986 Ectopic ossification, with the notes rewritten to record the two runoak searches run and why the tissue-specific children (HP:0011987-HP:0011989, HP:6000071) were rejected, replacing an incorrect claim that no narrower term existed. Added a diagnosis section (9 items) reflecting the deep-research report's section 10 workup where a cached reference supports it: serum phosphate (NCIT:C64857), tubular reabsorption of phosphate bound to the same phosphate-measurement term with the absence of a TRP/TmP-GFR term documented by query, the calcium/creatinine/ALP/PTH/25-OHD/1,25D panel (NCIT:C25294, per-analyte terms listed in notes), paired intact plus C-terminal FGF23 assays (NCIT:C96650; low intact with high C-terminal in GALNT3/FGF23 disease vs high intact in KL disease), plain radiography (NCIT:C38101), CT (NCIT:C17204), MRI (NCIT:C16809, inflammatory signal mimicking osteomyelitis), molecular genetic testing (NCIT:C15709) quoting the GeneReviews confirmatory sentence verbatim from PMID:29389098, and anti-FGF23 autoantibody measurement (NCIT:C181397) as the differential for genotype-negative disease. All diagnosis terms were confirmed reachable from NCIT:C25218 via the OLS ancestors API before binding. The panel-then-WES/WGS escalation is recorded as the report's uncited recommendation. Added a histopathology section (4 items) sourced only from already-cached PMID:27164190 and PMID:20358599: soft-tissue calcification (NCIT:C3672), chronic inflammatory infiltrate with foamy macrophages and giant cells (NCIT:C35980), heterotopic ossification with lamellar remodelling and reversal lines (NCIT:C35988), and reactive woven bone with fibroblastic stroma in hyperostotic diaphysis (NCIT:C53954); amorphous calcium-phosphate composition and surrounding fibrosis were not asserted because no cached source describes them, and this is stated in notes. In the mismatch_hftc_galnt3_mouse_no_calcinosis discussion the rationale now states that the model at issue is the Galnt3-null mouse, since attaches_to animal_models#Mus musculus is ambiguous across the three mouse models. clinical_trials remains deliberately absent: the deep-research report identified no disease-specific interventional trial (NCT00024804 is a broad NIH natural-history protocol), so there is nothing to cite. No new references were fetched; no references_cache files were added. Validation: just validate passed; just count-verified-snippets 176/176 verified; just validate-terms passed; just normalize-cache updated the chebi and ncit term caches and the chemicalentityterm, histopathologyfindingterm and treatmentactionterm enum caches; check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading and check-title-snippets all OK; just validate-disorders passed.

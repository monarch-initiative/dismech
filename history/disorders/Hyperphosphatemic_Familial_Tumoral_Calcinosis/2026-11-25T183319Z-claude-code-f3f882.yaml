  summary: 'Gene-family review: GALNT3, FGF23, KL'
  details: |
    All three loss-of-function directions confirmed: HFTC is FGF23 deficiency or FGF23 resistance, the opposite of the FGF23-excess hypophosphatemias. The GALNT3 node (polypeptide N-acetylgalactosaminyltransferase activity, GO:0004653) and the FGF23 node (hormone activity, GO:0005179) used the qualitative LOSS_OF_FUNCTION modifier for variant-driven loss of a normal activity; both are now DECREASED. The KL node already bound coreceptor activity as decreased. KL-related HFTC3 rests on one patient homozygous for p.His193Arg (PMID:17710231); Europe PMC searches for klotho or KL with tumoral calcinosis found no further families, and ClinGen has no KL assertion, so the KL record is now typed UNKNOWN rather than CAUSATIVE, with the reason in its notes. GALNT3 (ClinGen Definitive, already recorded) and FGF23 (several families) stay CAUSATIVE. Each of the three records gains a record-level autosomal recessive inheritance block (GeneReviews PMID:29389098).

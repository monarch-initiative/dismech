  summary: 'Create: Hyperphosphatemic Familial Tumoral Calcinosis (MONDO:0100251)'
  details: |
    De novo creation of the HFTC entry.

    LUMP/SPLIT DECISION. The pre-existing skeleton was anchored on MONDO:0100252 (HFTC1, GALNT3-only). Retargeted disease_term to the umbrella MONDO:0100251 'familial hyperphosphatemic tumoral calcinosis/hyperphosphatemic hyperostosis syndrome' and recorded the three molecular subtypes as has_subtypes: HFTC1 (GALNT3, hgnc:4125, MONDO:0100252), HFTC2 (FGF23, hgnc:3680, MONDO:0060714), HFTC3 (KL, hgnc:6344, MONDO:0060715). Hyperostosis-hyperphosphatemia syndrome is modelled as a presentation of the same disease, not a separate entity, on the evidence that the same GALNT3 c.1524+1G>A founder allele segregates in both HFTC and HHS families on a shared haplotype (PMID:15599692) and that identical GALNT3 genotypes produce massive calcinosis in one patient and isolated hyperostosis in another (PMID:20358599). Normophosphatemic familial tumoral calcinosis (SAMD9, MONDO:0012502) is excluded as a distinct disease and recorded as such in notes. Acquired anti-FGF23 autoantibody tumoral calcinosis is not modelled; the scoping question is left open in a discussion.

    NODE CHAIN (13 pathophysiology nodes). Three genetic roots converge: Biallelic GALNT3 Loss of Function -> Failure of FGF23 O-Glycosylation and Furin Cleavage of Intact FGF23 -> Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess; Biallelic FGF23 Missense Variants Blocking Intact Hormone Secretion -> the same deficiency node; Biallelic KL Loss of Function and Renal FGF23 Resistance bypasses the hormone node. All three reach Loss of FGF23-Klotho-FGFR1c Signaling in the Renal Proximal Tubule -> Increased Proximal Tubular Sodium-Phosphate Cotransport and Unsuppressed Renal Calcitriol Production -> Hyperphosphatemia with Elevated Calcium-Phosphate Product -> Ectopic Calcium-Phosphate Deposition in Periarticular Soft Tissue, Diaphyseal Cortical Hyperostosis, and Ectopic Calcification of Vessels, Teeth and Other Organs -> Foreign-Body and Systemic Inflammation Around Calcific Deposits. Fourteen phenotypes hang off the tissue-level nodes as bare-name edge targets.

    MODULE CONFORMANCE. None declared. kb/modules/defective_skeletal_mineralization.yaml was considered and rejected: it models mineralization failure, whereas HFTC is a hyper-mineralizing disease, so conforming would invert the claim. No ectopic-calcification module exists in kb/modules/; creating one is suggested as follow-up.

    PROVIDER AND DOI RESOLUTION. The Falcon deep-research report research/Hyperphosphatemic_Familial_Tumoral_Calcinosis-deep-research-falcon.md was used as a lead list only. It cites by author-year/DOI key, so DOIs were resolved to PMIDs via PubMed esearch before any snippet was taken: 10.1002/jbmr.2870 -> PMID:27164190 (Ramnitz 2016 NIH cohort), 10.1007/s00223-020-00659-6 -> PMID:31965220 (Ito and Fukumoto 2021), 10.1002/jbm4.10470 -> PMID:33977199 (Lee 2021 dental cohort), 10.1007/s00223-024-01247-8 -> PMID:38951179 (Cherian 2024 systematic review). Primary mechanism and treatment papers were found independently via PubMed E-utilities. The report's term-validation block flags HP:0002905 as mislabelled in the report prose; the canonical label Hyperphosphatemia is used here. The report stated no umbrella MONDO identifier was established in its evidence; MONDO:0100251 was verified directly against the ontology with runoak. No unresolved identifier or CURIE from the report was used.

    PMIDS CITED (16): 29389098 (GeneReviews, tagged), 27164190, 31965220, 33977199, 38951179, 15133511 (Topaz 2004 GALNT3), 15599692 (Frishberg 2005 HHS/HFTC allelism), 15590700 (Benet-Pages 2005 FGF23 S71G), 17710231 (Ichikawa 2007 KL H193R), 16638743 (Kato 2006 O-glycosylation), 17129170 (Frishberg 2007 augmented FGF23 processing), 20358599 (Ichikawa 2010 clinical variability), 19213845 (Ichikawa 2009 Galnt3-null mouse), 14966565 (Shimada 2004 Fgf23-null mouse), 9363890 (Kuro-o 1997 klotho mouse), 24668887 (Finer 2014 acetazolamide), 19188744 (Lammoglia 2009 sevelamer plus acetazolamide).

    NOT SOURCED, AND WHY. (1) Sodium thiosulfate was named in the curation brief but no HFTC-specific PubMed record was found; the candidate hits were calcinosis cutis, calciphylaxis and pemigatinib-associated calciphylaxis, all different diseases, so it was omitted rather than cited across a Named Entity Confusion boundary. (2) The FGF23 Thr178 residue and the Arg179-Ser180 furin site could not be quoted from any cached abstract, so the node description states the RXXR proprotein-convertase site without asserting residue numbers. (3) The 'fewer than 100-200 reported cases' figure has no quotable source in the cached set; prevalence is recorded as CASES_IN_LITERATURE with the 63-patient denominator from PMID:38951179 and ULTRA_RARE, with the limits of that denominator stated in notes. (4) The ISDS group assignment (abnormal_mineralization) rests on the disease's mechanism, not on a per-disorder listing: the cached PMID:36779427 record is the 2023 revision summary and does not enumerate disorders. This is stated in the classification notes and flagged for review. (5) No datasets or clinical_trials blocks: no accession was verified and no NCT record was fetched. (6) Enamel hypoplasia carries a REFUTE item from PMID:33977199, whose SEM found no enamel or dentin structural difference from controls; the GeneReviews listing and the structural study are both recorded rather than reconciled.


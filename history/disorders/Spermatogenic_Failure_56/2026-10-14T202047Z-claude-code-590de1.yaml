  details: |
    New entry for MONDO:0030430 (DNAH10-related SPGF56, OMIM 619515), curated from the open stub, which is deleted. Falcon research runs failed with a 503 Edison authentication error (also with dr_fallback='--fallback'), so the report used is research/Spermatogenic_Failure_56-deep-research-claude_code.md from just research-disorder claude_code; preflight-dr returned PASS (DNAH10 mentioned 14 times). Curation rests on PubMed-found papers fetched with just fetch-reference: PMID:34237282, PMID:34657236, PMID:37314648, PMID:41058558 and PMID:40592014 (abstracts), PMID:39996363 and PMID:40898283 (full text), plus the already cached PMID:42522280. The ClinGen record CGGV:assertion_0128b225-6f43-4ed2-b111-a50dde1b25e5-2026-05-07T190000.000Z (Moderate, AR) was generated with just fetch-reference and copied into gene_disease_validity; relationship_type is left unset because CAUSATIVE implies Definitive or Strong. Causal chain: DNAH10 protein loss, co-depletion of DNAH1, DNAH2 and DNAH6, inner dynein arm loss, MMAF, phenotypes; a manchette/intramanchette-transport node (PMID:41058558, MeSH-indexed mouse study) explains the head defect. An EMERGING hypothesis records the conflict between sperm-restricted SPGF56 and DNAH10-related primary ciliary dyskinesia (PMID:37314648 patient and mice). PMID:40373254 (SUN5 plus DNAH10 double homozygote) was read and deliberately not used. Validated with just validate (all snippets verified), count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-gene-validity (no conflict) and check-genereviews (NO_CHAPTER).

  details: |
    New entry for MONDO:0014816, curated from the Perplexity deep-research report (research/Split-Foot_Malformation_with_Mesoaxial_Polydactyly-deep-research-perplexity.md). just preflight-dr returned WARN only because the report cites the MAP3K20 gene OMIM number 609479 alongside the phenotype number 616890; the report is about this disease (MAP3K20 mentioned 13 times). The off-topic flagged reference (PMC11805609, ribosomes and UV) was not used. Evidence comes from the original Genome Research report (PMID:26755636, full text), the 2025 ZAK collided-ribosome study (PMID:41261136, full text) for p.Phe368Cys hyperactivity, and the 2024 heterozygous MAP3K20 report (PMID:38451290) for isoform structure and a literature count. The disease alleles affect the SAM domain of the long ZAK-alpha isoform, not ZAK-beta. Pathophysiology is a five-node chain with two unresolved branches (constitutive kinase activation in cells, and reduced Trp63 in SAM-deleted mouse hindlimbs); the links from either branch to limb patterning are INDIRECT_UNKNOWN_INTERMEDIATES. No Orphanet cache could be generated for ORPHA:488232 and no GeneReviews chapter exists. Validated with just validate, count-verified-snippets (47/47), validate-terms, check-entity-refs, check-causal-targets, check-genereviews and validate-disorders.

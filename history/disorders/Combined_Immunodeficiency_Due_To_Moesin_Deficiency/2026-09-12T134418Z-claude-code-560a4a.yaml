  summary: 'Create: Combined Immunodeficiency Due To Moesin Deficiency (MSN, MONDO:0010514)'
  details: |
    De novo curation of X-linked moesin-associated immunodeficiency (X-MAID) from claim issue #11741.

    The mechanism is cytoskeletal rather than signalling, which is the reason the entry is interesting alongside the other inborn errors of immunity in this knowledge base. Moesin is an ERM protein cross-linking cortical actin to the plasma membrane, so the pathograph runs from hemizygous MSN loss of function through loss of cortical actin-membrane cross-linking to two parallel cellular branches, impaired migration and adhesion and impaired proliferation, converging on multi-lineage leukopenia.

    The proliferation node carries the strongest evidence in the entry: the defect is rescued by re-expression of wild-type MSN in patient cells, which makes it a demonstrated dependency rather than an association between a genotype and a panel of assays.

    Model fidelity contrasts deliberately with the Torsion_Dystonia_6 entry curated in the same session. There the mouse fails to reproduce the phenotype and is recorded as FAILS_TO_RECAPITULATE. Here the moesin-deficient mouse is lymphopenic like patients and is recorded as RECAPITULATES. The mouse also carries a second link, typed PERTURBS at CELLULAR scale, for an IL-15-dependent CD8+ regulatory T cell finding that has no human counterpart in the curated evidence; its limitations field says explicitly that this is a mechanistic hypothesis for the human disease rather than a human finding, and a SPECIES_MISMATCH divergence records that the CD8+CD44+CD122+Ly49+ marker definition is a mouse characterisation.

    One evidence item is marked directness: INDIRECT with an explanation stating that the quoted sentence is about SCID and not about X-MAID. It is cited for the transplant-timing principle the case report invokes. Recorded that way rather than dropped, because the alternative was to let a quote about a different disease read as evidence about this one.

    Gene binding note: a substring search for MSN in HGNC returns SAMSN1 (hgnc:10528) and the moesin pseudogene MSNP1 (hgnc:7374) alongside the intended gene. The CURIE was resolved with an exact-label lookup and is hgnc:7373.

    Deep research: one openscientist report was run and is committed alongside the entry. just preflight-dr returned WARN for a rival gene HP at 31 percent of MSN mentions; that is the HPO CURIE prefix, not haptoglobin, and is the third instance of the same false positive across the five reports run in this session. A second flagged rival, BCR, is the B cell receptor rather than the BCR gene.

    Reference-cache hygiene: PMID:39381601 was fetched during triage and is not cited by this entry, so it is not part of this PR. It was already tracked on main and an accidental deletion of it was reverted before commit.

    Validation: just validate passed with 23/23 snippets verified; just validate-terms passed; check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms all clean.

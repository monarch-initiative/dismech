  details: |
    Answers the single blocking finding of the round-1 review plus two of its optional notes, in one push.

    Blocking, prose only: the description contained the clause 'marked as an upward extrapolation is not needed', which does not parse. It was an edit that replaced a clause without deleting 'marked as'. The claim it garbled is correct and load-bearing, so it is now stated plainly: the CD8+ Treg link's model_scale is CELLULAR and its target node's biological_scale is CELLULAR, so no upward extrapolation is involved, and the link still carries its own limitations because that population has not been shown to be the relevant one in patients.

    Optional taken 1: the viral-infection phenotype was named 'Recurrent viral infections', which is the bound HPO term's label. The source claims only increased susceptibility and says nothing about recurrence, so the record is renamed to 'Varicella zoster virus susceptibility' and the description now says explicitly that the recurrence is the ontology's wording rather than a claim this entry makes. The HP:0004429 binding itself is unchanged and the reviewer independently agreed it is correct: the VZV-specific HPO terms all assert a severity the source does not claim.

    That rename is the reason this record exists rather than being a one-line fix. A phenotype name is a foreign-key target for bare pathograph edges, and the rename immediately dangled the downstream edge pointing at it. check-causal-targets caught it and the edge was retargeted. This is the silent-rename failure CLAUDE.md describes, reproduced and caught within one edit.

    Optional taken 2: added a prevalence record, measure_type CASES_IN_LITERATURE and prevalence_class ULTRA_RARE, citing the defining series of seven male patients from five families. The cohort size was previously only prose, and it is what the KNOWLEDGE_GAP discussion turns on.

    Not taken: a classifications block with the IUIS immunodeficiency fields, and a sentence on the second animal-model link noting its readouts sit downstream of its target. The reviewer marked both optional and explicitly said leaving the second one is fine.

    Validation: 24/24 snippets verified, schema and terms pass, all nine whole-KB gates green.

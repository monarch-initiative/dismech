  summary: 'Review and enhance: Combined Immunodeficiency Due To Moesin Deficiency'
  details: |
    Rewrote top-level description in encyclopedic clinical register noting variable NK-cell status (T-B-NK- in ClinGen vs T-B-NK+ in newborn-screened SCID), eczema, severe molluscum contagiosum, and autoimmune cytopenias; added classifications (IMMUNE_RHEUMATOLOGIC, GENETICS_ENVIRONMENT_DISEASE, iuis_category combined immunodeficiency); bound hgnc:7373 (MSN) and GO:0051015 (actin filament binding) on Hemizygous MSN Loss-of-Function Variants and replaced methods quote from PMID:29556235 with Western blot results quote; added CL:0000542 (lymphocyte) and UBERON:0002370/UBERON:0002371 (thymus, bone marrow) plus evidence on downstream pathophysiology nodes; added Autoimmune cytopenia (HP:5210419), Eczema (HP:0000964), and Severe molluscum contagiosum (HP:0032163) phenotypes; fetched and cited ClinGen Definitive CGGV assertion on genetic[0], prevalence, and lymphopenia; added three NCIT-bound diagnosis entries (Genetic Testing, Newborn Screening, Flow Cytometry); enriched HCT treatment with three-patient outcomes and RESTORES link to Loss of Cortical Actin-Membrane Cross-Linking, added Immunoglobulin Replacement Therapy, Granulocyte Colony-Stimulating Factor Therapy, and Antimicrobial Prophylaxis, and updated mouse model limitations and KNOWLEDGE_GAP discussion to reflect documented human autoimmune cytopenias.

  summary: 'Create: Progressive Myoclonic Epilepsy Type 8 (CERS1)'
  details: |
    New Disease entry for progressive myoclonic epilepsy type 8 (MONDO:0014545, OMIM 616230, EPM8), autosomal recessive, biallelic CERS1 (hgnc:14253). This is the epilepsy pick of the batch and adds a mechanism class absent from the KB's roughly 89 existing epilepsy entries: a sphingolipid biosynthetic defect rather than a channelopathy, transcription-factor or trafficking disorder.

    Mechanism curated as 6 atomic nodes: CERS1 loss of function -> reduced C18-ceramide -> ER stress response with proapoptotic signalling, and in parallel lipofuscin accumulation with ubiquitylated proteins -> neuronal degeneration -> the progressive myoclonus epilepsy syndrome.

    Two competing mechanistic_hypotheses rather than one settled chain: er_stress_apoptosis_model (CANONICAL, the founding study's account, resting on neuroblastoma knockdown) and sphingolipid_membrane_homeostasis_model (ALTERNATIVE, better supported by the mouse lipidomics and the storage phenotype). The ALTERNATIVE carries a PARTIAL evidence item quoting the founding mouse paper against its own hypothesis: that paper states it remains largely unclear whether sphingolipid changes in neurodegeneration are pathological events or homeostatic responses.

    Module conformance attaches at epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures, the clinical endpoint, and deliberately not at the excitation-inhibition or hyperexcitability nodes. No source measures excitability, synaptic function or network synchrony in CerS1-deficient neurons; the established mechanism is neurodegenerative and the epilepsy is observed rather than explained.

    Evidence-base honesty was the main curation decision. The human literature is essentially one Algerian family of four affected siblings, a review restating it, and an isolated later case whose PubMed record caches as metadata with no abstract and is therefore not quotable. Consequently no frequency bands are asserted anywhere in this entry, and the ataxia phenotype is curated at supports PARTIAL with evidence_source MODEL_ORGANISM, with the explanation stating explicitly that this is mouse evidence supporting a human phenotype and why no human quote is available. The treatment section records that the absence of real treatment content is the honest state of the disease rather than an oversight.

    The animal model is two independently arising spontaneous mouse mutants (flincher and toppler) in the same gene, which is what makes the mouse evidence strong. It is curated RECAPITULATES for the lipid node and PARTIALLY_RECAPITULATES for neurodegeneration, because the regional pattern does not match: mice show cerebellar ataxia and Purkinje cell death while humans lead with myoclonic epilepsy and dementia, and no source reports seizures in the mice at all.

    Three discussions: a HUMAN_MODEL_MISMATCH on the ER stress node resting on acute knockdown in a proliferating tumour-derived line rather than a post-mitotic neuron; a KNOWLEDGE_GAP on the human-mouse regional discrepancy, which determines whether the mouse can serve as a therapy model for the epilepsy; and a KNOWLEDGE_GAP on why CERS1 loss and ASAH1 loss - failing to make ceramide and failing to degrade it - both produce progressive myoclonus epilepsy.

    Gene naming hazard recorded: the mouse literature calls the gene Lass1 and the human literature CERS1. Same gene; LASS1 is a previous HGNC symbol. Noted in the genetic section so a future curator does not treat it as a separate locus.

    Validation: just validate passed; 31/31 snippets verified; just validate-terms passed; check-duplicate-keys, check-title-snippets, check-snippet-length, check-folded-hyphens and check-environmental-evidence all clean. Module anchor verified to resolve against kb/modules/epilepsy_excitation_inhibition_imbalance.yaml.

    GeneReviews: no chapter exists for CERS1 or EPM8, checked directly (CERS1[TIAB] AND GeneReviews[BOOK] returns zero); the chapters surfacing for a looser PME search cover Lafora disease and AFG3L2. Absence documented in notes.

    NEC preflight: PASS (CERS1=34 mentions, CERS2=3 and CSTB=3 behind it, OMIM 616230 matching the MONDO xref). The report carried needs_review true with quotes_valid 0 of 1 - its single quoted claim, attributed to PMID:21625621, was a paraphrase that elided part of the sentence. The validator printed the true sentence and this entry quotes that instead. The report cited only three PMIDs, too thin for an entry; six further references were found by direct PubMed search and fetched independently.

  summary: 'Create: Congenital_Amegakaryocytic_Thrombocytopenia_1'
  details: |
    New Mendelian entry for MPL-related congenital amegakaryocytic thrombocytopenia (CAMT1, MONDO:0800452), claimed in issue 15832. Pathograph: biallelic MPL loss of function -> loss of thrombopoietin receptor signaling -> failure of megakaryopoiesis (thrombocytopenia, megakaryocytopenia) and hematopoietic stem/progenitor exhaustion (pancytopenia, aplastic anemia, hypocellular marrow); raised thrombopoietin; bleeding phenotypes with intracranial hemorrhage carrying the ocular, brain and developmental sequelae that the 56-patient cohort attributes to bleeding. CAMT type I and type II recorded as has_subtypes. Mpl knockout mouse (megakaryocyte defect without aplasia) and patient iPSC model linked to mechanism nodes. Deep research: one OpenScientist report (27/27 references resolved, preflight anchored on MPL); additional sources found by PubMed search (King 2005 series, inducible Thpo knockout HSC study, EBMT transplant registry). No GeneReviews chapter exists. Validated with just validate, count-verified-snippets (all verified) and the whole-repo gates. Review round 1 on PR 15840: petechiae snippet quoted in full; FLI1 fate-control finding added to the signaling node (PMID:23908116); edge to raised thrombopoietin cited to receptor-mediated clearance (PMID:9831170); PMID:12799278 snippet replaced with a patient-only sentence; evidence added for the TAR, RUSAT and Fanconi differentials; thrombopoietin receptor agonists recorded as investigational, with only in vitro evidence (PMID:20188141, PMID:34010413) and a pediatric review (PMID:38925157).

  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Extended the Serologic testing diagnosis row with the US two-tier algorithm (EIA or IFA first tier, IgM and IgG immunoblot second tier, or the modified EIA-EIA algorithm) and bound three measurements: LOINC:11006-4 for the first tier and LOINC:22135-8 and LOINC:22128-3 for the IgM and IgG second tier, all method-less serum codes so that both second-tier variants are covered. Evidence is the CDC 2019 MMWR recommendation PMID:31415492 (two quotes). The anti-Borrelia IgM/IgG biochemical marker gained loinc_term LOINC:22131-7, since the Monarch KG search returned no LP Part for the antibody. No reference_ranges: the CDC text defines a sequence of tests, not a numeric cut-off, and EIA positivity is manufacturer-set. The 2020 IDSA/AAN/ACR guideline abstract (PMID:33417672) was read and does not describe the algorithm, so it is not cited.

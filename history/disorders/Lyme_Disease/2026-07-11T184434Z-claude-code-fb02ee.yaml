  details: |
    Manual evidence-verification review. All ~60 evidence items resolve to existing caches with accurate substring quotes; every Lyme cite concerns B. burgdorferi/Lyme (no NEC). Fixes: (1) Fatigue frequency VERY_FREQUENT -> FREQUENT: the prior citation reported 'general weakness (19%)' (OCCASIONAL); added PMID:8644761 (Nadelman 1996, culture-confirmed erythema-migrans cohort) reporting fatigue at 54% to anchor the FREQUENT band, and retagged the 19% item SUPPORT->PARTIAL as a secondary lower estimate. (2) Two casing quote-nits made verbatim exact substrings ('examples'->'Examples' PMID:34861197; 'Southern'->'southern' PMID:40788480). Minor: Arthritis/Facial-Palsy population frequencies not quantitatively sourced (left for follow-up).

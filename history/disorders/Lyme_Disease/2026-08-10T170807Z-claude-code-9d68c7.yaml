  summary: Link the three vector exposures to the transmission node
  details: |
    Backfill for issue #8085. All three evidenced exposures point at the tick-borne transmission and enzootic cycle node, on a three-way spread. Seasonal exposure is MODULATES with DIRECT, the only modulating link in this backfill so far, and the value is chosen deliberately: season does not cause transmission and does not worsen it, it determines when in the year the questing nymphs that carry out transmission are available to do so. Its evidence sits directly on that claim, putting the nymphal activity peak and the peak of reported human cases in the same months. Outdoor activities is graded lower at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, because of a gap in the evidence rather than in the biology: the one available sentence describes the months during which human exposure is possible and never mentions an activity, so what is evidenced is the exposure window rather than the behaviour that meets it. Non-Ixodes tick exposure is graded lowest and for two reasons stated in its description: the evidence is a single case report, and the vector it describes sits outside the enzootic cycle the node is built around, since a dog tick in India is not part of the Ixodes and small-mammal cycle the node names. Tick exposure and geographic location were not linked because they carry no evidence at all, which is the gap recorded in issue #8296. Three items had no evidence_source and would have defaulted to HUMAN_CLINICAL; the two entomological surveillance items are now tagged OTHER and the case report HUMAN_CLINICAL. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 64 of 64 verified.

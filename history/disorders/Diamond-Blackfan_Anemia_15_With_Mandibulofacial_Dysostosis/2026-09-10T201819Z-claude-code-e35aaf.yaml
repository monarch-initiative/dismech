  summary: 'Post-approval follow-up: remove an unsourced frequency band, level directness
    across GeneReviews items, connect two orphan phenotypes'
  details: |
    Follow-up push after the approving re-review on PR #11639, taking the four non-blocking suggestions the reviewer explicitly said to take "only if something else brings you back". Nothing else brought me back; one of the four is a false statement rather than a nit, and that was worth the approval this push drops.

    CORRECTION TO THE FIRST RECORD IN THIS DIRECTORY. That record's final sentence still reads: "The DBA GeneReviews chapter PMID:20301769 was retrieved but its PubMed record is a bibliographic stub with no abstract text, so nothing is quoted from it." That is false, for the reason the second record in this directory sets out - the cached record is 122 lines opening with about 30 lines of bibliographic header, and only the header was read. The chapter carries the full four-section abstract and is now tagged and mined across all four sections. The first record is left as written and this one supersedes that sentence.

    Noting a process error alongside it. That same record was earlier corrected IN PLACE for a different false claim (about the deep-research report's validation blocks), which is not how append-only provenance is supposed to work; the reviewer on a sibling PR in this batch, #11642, made the point explicitly - amend via a new record once a PR has been through a round. Correcting it in place a second time would compound that, so this record exists instead.

    SUGGESTION 1, and the reason this push happened at all. Hydrops fetalis was banded VERY_RARE. The quoted GeneReviews sentence describes where hydrops sits on the severity spectrum - "to a severe form of fetal anemia resulting in nonimmune hydrops fetalis" - and gives no rate whatsoever. The band was a number this curator supplied, sitting immediately beneath a verified exact quote that appeared to license it and did not. That is the same defect class as an unsourced CURIE: a fabricated value made to look sourced by proximity to a real one, and it is worse here than in prose because a frequency band is machine-readable and will be believed. The band is removed rather than softened, and the phenotype description now says what happened and that absent is the honest state. It sat in the same entry whose notes paragraph this round rewrote to explain banding discipline, which is the part worth remembering.

    SUGGESTION 2. Every one of the fourteen evidence items citing PMID:20301769 now carries directness: INDIRECT. Exactly one of the fourteen carried it before, which asserted a distinction between them that does not exist: each is a statement about DBA as a whole - a recurrence risk, a malformation rate, a management recommendation, a diagnostic criterion - reaching an RPS28 patient by one inference step from the class to this member. This is an assessment and not a completeness exercise; CLAUDE.md is explicit that directness should be left absent where nobody has judged it, so the items from the RPS28 case report and the founding series still carry no value. The notes record the rule.

    The mechanical edit for this went wrong first, and the gate caught it. A line-oriented insertion pass put a second directness key into treatments[1].evidence[1], next to the one already there. PyYAML keeps the last silently, so just validate passed; just check-duplicate-keys reported it at line 821. That is precisely the case CLAUDE.md describes when it says a duplicate key is invisible to every renderer and test in the repo while being fatal to reference validation. Removed, re-checked clean.

    SUGGESTION 3. The two remaining orphan phenotypes are connected. Growth delay hangs off Impaired Ribosome Biogenesis rather than off the craniofacial node, because the founding authors' prediction sentence names reduced growth alongside abnormal embryologic development and defective erythropoiesis as a third consequence of the same lesion, not as a downstream effect of either; the edge is typed INDIRECT_UNKNOWN_INTERMEDIATES to match the sentence's hedged verbs. Hydrops fetalis is a sequela of Macrocytic anemia typed DIRECT, because GeneReviews states that direction outright - fetal anemia resulting in hydrops - and the edge sits at the level at which the source makes the claim rather than one node upstream.

    SUGGESTION 4 is this record.

    VALIDATION. just validate passes with 55/55 snippets verified, up from 53/53. just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-snippet-grading and check-title-snippets all pass.

  summary: 'Review round 1: mine the GeneReviews chapter, level frequency bands, add
    chelation and surveillance (PR #11639)'
  details: |
    Addressed the CRITICAL and both IMPORTANT findings from the ai4c-reviewer review on PR #11639, in one push. CRITICAL: the entry claimed the DBA GeneReviews chapter PMID:20301769 is a bibliographic stub with no abstract text. That was wrong, and the cause is worth recording because it is a repeatable failure mode rather than a one-off: the cached record is 122 lines and opens with roughly 30 lines of bibliographic header, I read only the first dozen lines, saw header, and concluded the file had no content. The chapter carries the full four-section GeneReviews abstract. It is now tagged in references with tags GeneReviews and mined across all four sections - CLINICAL CHARACTERISTICS into new phenotypes (growth deficiency 30%, cancer predisposition to AML/MDS/osteogenic sarcoma, nonimmune hydrops fetalis at the severe end of the spectrum), DIAGNOSIS/TESTING into a new clinical-diagnosis entry and an added molecular criterion, MANAGEMENT into new Iron Chelation Therapy and Malignancy Surveillance treatments plus the corticosteroid age and response rate, and GENETIC COUNSELING into the inheritance block (50% recurrence risk, 40-45% inherited versus 55-60% de novo). The deferiprone agents-to-avoid warning is curated on the chelation treatment and is pointed for this genotype because the one reported RPS28 patient was granulocytopenic from birth. The notes paragraph is corrected rather than deleted, and states why the original read was wrong. IMPORTANT 2: the corticosteroid response rate is now cited from both sources (40% in the 2014 series, 60-80% in GeneReviews) with the treatment description explaining that they measure different things, rather than presenting one silently. IMPORTANT 3: frequency bands are levelled. Micrognathia, Cleft palate and Downslanted palpebral fissures were banded FREQUENT while Low-set ears, Hypertelorism, Exotropia and Short neck were OCCASIONAL, though four of them come from the same sentence of the same n=1 abstract; all single-case observations are now OCCASIONAL uniformly, while the GeneReviews figures are banded from their real denominators. Also connected five previously orphan craniofacial phenotypes to the pathograph by bare-name targets, including Mandibulofacial dysostosis, the umbrella phenotype the disease is named for. The original history record for this entry has been corrected in place: it repeated the false claim that the report carries no validation blocks; it carries both, with needs_review true on an HP:0001931 label mismatch that is bound nowhere in the entry, and the report narrative is truncated mid-sentence in section 2.1. Suggestion not taken: no OMIM mapping added, since the reviewer noted the sibling DBA14 entry omits one too and called it a house pattern rather than a defect - changing it here alone would make the pair inconsistent. Validation: just validate passed, 53/53 snippets verified (was 38/38), just validate-terms passed, entity-refs / causal-targets / duplicate-keys passed.

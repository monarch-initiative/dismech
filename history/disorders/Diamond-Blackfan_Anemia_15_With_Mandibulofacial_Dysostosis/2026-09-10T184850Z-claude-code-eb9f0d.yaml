  summary: 'Create: Diamond-Blackfan Anemia 15 with Mandibulofacial Dysostosis (RPS28,
    MONDO:0011639)'
  details: |
    De novo curation of DBA15 (RPS28), curated as the sibling of the existing DBA14 (TSR2) entry, which was created from the same founding paper (PMID:24942156) and already carried a differential-diagnosis entry anticipating this genotype. Structure, the ICD10CM broadMatch mapping and the parents list deliberately mirror DBA14. Deep research: one Perplexity sonar-deep-research report, committed. It carries no reference_validation or term_validation block and cites URLs rather than identifiers, so it was used for orientation only and every reference was located independently via PubMed and cached. Evidence: PMID:24942156 (founding six-family series), PMID:40135709 (the only subsequent case report), PMID:18697920 (human ribosomal protein depletion panel, the only source that measures rather than predicts anything about RPS28). Two nodes are graded mechanism_confidence HYPOTHETICAL and the entry notes explain why in each case: for Defective Erythropoiesis it is the explanation rather than the finding that is provisional, and for Abnormal Craniofacial Embryonic Development the founding authors' link is explicitly a prediction covering all five genotypes collectively. Frequency bands are weak by construction - three reported patients, most dysmorphic features documented in one of them - and the notes say so. Ontology bindings were resolved in the same step they were written, which caught two wrong CURIEs I had written from memory: NCIT:C15356 (actually Whipple Procedure, not Blood Transfusion - the correct term is NCIT:C15192) and NCIT:C2322 for corticosteroid, which is not in the ChemicalEntityTerm dynamic enum; the sibling DBA14 entry's validated CHEBI:50858 was used instead. The DBA GeneReviews chapter PMID:20301769 was retrieved but its PubMed record is a bibliographic stub with no abstract text, so nothing is quoted from it. Validation: just validate passed, 38/38 snippets verified, just validate-terms passed, entity-refs / causal-targets / duplicate-keys passed.

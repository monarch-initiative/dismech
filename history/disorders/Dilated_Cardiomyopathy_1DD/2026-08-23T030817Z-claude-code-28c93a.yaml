  summary: 'Create: Dilated Cardiomyopathy 1DD (RBM20)'
  details: |
    Curated CMD1DD (RBM20, MONDO:0013168; ClinGen Definitive). A post-transcriptional lesion: RBM20 is a heart-enriched splicing factor whose principal client is titin, governing the N2B/N2BA isoform switch that sets passive stiffness. Six-node pathograph: RS-domain (exon 9) variant -> loss of RBM20-dependent splicing regulation -> pathological titin isoform switch AND a parallel arrhythmogenic-substrate node -> ventricular dilation -> heart failure and malignant ventricular arrhythmia; conforms to cardiomyopathy_maladaptive_remodeling. Records that RBM20 sits with the arrhythmogenic LV cardiomyopathy genes and that LV systolic function is an insensitive predictor of arrhythmic risk. Arrhythmia causal chain explicitly curated as unestablished. Deleted stub. 18 snippets verified; validation passes.

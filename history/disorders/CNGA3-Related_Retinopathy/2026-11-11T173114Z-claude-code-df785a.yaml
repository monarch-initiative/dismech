  summary: 'Create: CNGA3-Related Retinopathy'
  details: |
    New entry for CNGA3-related retinopathy (MONDO:0800102), the autosomal recessive cone disorder caused by biallelic CNGA3 variants. It carries two subtypes: ACHM2 (complete and incomplete achromatopsia, bound to MONDO:0009003) and a rare CNGA3 progressive cone dystrophy, which has no MONDO term and is left unbound. The pathograph runs from the missense-dominated CNGA3 lesion through three molecular routes (impaired channel surface expression, loss of channel conductance, and constitutive channel opening for gating-ring alleles such as R410W) to failure of the cone light response, cGMP accumulation and ER stress-associated cone death, and then to congenital cone dysfunction and slow foveal cone loss. Ten of fifteen phenotypes are causally connected; foveal hypoplasia, hyperopia, myopia, nyctalopia and the abnormal dark-adapted electroretinogram have no incoming edge because no cited source establishes their mechanism in this disease. The ClinGen Definitive (AR) classification is copied from its CGGV record. A second genetic row records CNGA3 as an accessory modifier allele in CNGB3 p.Arg403Gln disease, which is a CNGB3-driven digenic triallelic presentation rather than CNGA3 disease. Animal models are the Cnga3 knockout mouse and the CNGA3-mutant day-blind Awassi sheep; treatments include investigational subretinal AAV CNGA3 gene augmentation, with the intravitreal route recorded as refuted in sheep, and three registered gene-therapy trials. The deep-research input was an OpenScientist report (the requested falcon provider returned HTTP 403 and the recipe fell back); its preflight check returned WARN because the report gives HGNC:2383, which is CRX, as the CNGA3 identifier, so no identifier was copied from it, and the report carries no reference-validation section. Every cited reference was fetched into references_cache and all snippets verified against it. Achromatopsia.yaml's ACHM2 subtype now carries curated_in pointing to this entry.

  summary: 'Create: Neurodevelopmental_Disorder_With_Movement_Abnormalities_Abnormal_Gait_And_Autistic_Features'
  details: |
    New Mendelian entry for MONDO:0060642 (OMIM 617865), the ZSWIM6
    p.Arg913Ter disorder; stub deleted. entry_type DISEASE. Acromelic
    frontonasal dysostosis (ZSWIM6 p.Arg1163Trp) is already curated as a
    subtype of Frontonasal_Dysplasia and is cross-referenced in notes, not
    duplicated; the homozygous p.Arg1040His short-stature presentation
    (PMID:42731068) is treated as a separate allelic entity.

    Sources: founding series of 7 (PMID:29198722, PMC full text) is the
    phenotype baseline; frequencies are the paper's own counts (n=7).
    Gastro-esophageal reflux carries no frequency because the source pools it
    with feeding difficulty and failure to thrive. Two later case reports
    (PMID:33958584, PMID:38386481). Mechanism: NMD escape in patient
    lymphoblastoid cells (IN_VITRO); dominant-negative truncation recorded as an
    EMERGING hypothesis; ZSWIM6 chromatin binding and increased chromatin
    accessibility plus SPN AMPA-receptor synaptic changes from PMID:39823338
    (IN_VITRO / MODEL_ORGANISM); striatal volume, MSN morphology and motor
    phenotype from the knockout mouse (PMID:28433741). Gene node grounded on
    GO:0003682 chromatin binding. Two open discussions: allelic spectrum
    (5' frameshifts classed LP in PMID:41828661) and mouse-null vs human
    truncation mismatch.

    Deep research: openscientist (report and artifacts committed). Its 6
    references all resolved; its causal chain matched the entry. Not adopted:
    Hedgehog activation (shown only for the AFND allele), ZSWIM6 E3 ligase
    activity toward NAT10 (PMID:38246918, head-and-neck cancer cells, no
    neuronal or disease link), constipation and hyporeflexia "in a subset"
    (no count or source found beyond the single neuropathy case). The research
    run was launched from a stub entry without the causal gene recorded, but the
    report identifies ZSWIM6 and OMIM 617865 in its first paragraph.
    `just preflight-dr` could not run: the local MONDO build is absent and the
    container had under 300 MB of free disk. `just check-genereviews`:
    NO_CHAPTER.

    Validation: just validate (schema, terms, references) passed; 49/49
    snippets verified. The --against-ref modes of check-snippet-grading,
    check-reference-titles, check-title-snippets and gene-activity grounding
    failed with ENOSPC while extracting origin/main; their local-baseline modes
    passed with no finding for this entry.

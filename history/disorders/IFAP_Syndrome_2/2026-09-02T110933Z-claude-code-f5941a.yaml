  summary: 'Create: IFAP Syndrome 2 (SREBF1-related, autosomal dominant)'
  details: |
    De novo curation of IFAP syndrome 2 (MONDO:0100221) from primary literature plus a claude_code deep-research report (falcon was requested but returned HTTP 402, so the run fell back and the report is named for claude_code). The report's term-validation section flagged 13 CURIEs as naming a different term than the report claimed - among them HP:0100708 for meibomian gland dysfunction, which HPO calls Abnormal microglia morphology, and UBERON:0006238 for meibomian gland, which UBERON calls future brain - so none of its ontology suggestions were copied across; every binding here was resolved independently via OLS. HPO has no meibomian gland dysfunction term, so that phenotype is bound to HP:0025610 Posterior blepharitis with the precise entity in preferred_term. Pathophysiology runs from the SREBF1 site-1 cleavage-site variant through blocked proteolytic activation and reduced nuclear SREBP1 output, forking into follicular keratinization failure, keratinocyte apoptosis, and meibomian gland lipid synthesis failure leading to ocular surface disease. The hereditary mucoepithelial dysplasia lumping question is recorded as a CONTROVERSY discussion with a skos:closeMatch mapping to MONDO:0008017 rather than an exactMatch, since MONDO still maintains both terms. Half the clinical literature for this disease is published under the HMD name, which is recorded in notes. Validated with just validate (schema, terms, 48/48 snippets verified against cached references) plus the same gate suite as the sibling entry in this run.

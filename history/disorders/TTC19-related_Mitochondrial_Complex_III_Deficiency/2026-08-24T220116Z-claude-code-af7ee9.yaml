  summary: 'Create: TTC19-related mitochondrial complex III deficiency'
  details: |
    New entry for mitochondrial complex III deficiency nuclear type 2, MONDO:0014063, curated from six primary references located independently in PubMed. Four decisions worth recording. First, the pathophysiology follows the 2017 mechanism revision rather than the 2011 framing: PMID:21278747 called TTC19 a putative complex III assembly factor, but PMID:28673544 showed it binds the fully assembled complex after Rieske UQCRFS1 incorporation and clears the N-terminal maturation fragments that would otherwise accumulate inside the holocomplex. Curating this as an assembly defect would misplace the lesion by one step. Second, the diagnostic caveat that normal complex III activity does not exclude the diagnosis is curated with its own evidence from PMID:25887401, which reports a patient with normal activity in two independent muscle biopsies, and the biochemical node carries a PARTIAL evidence item for the same reason. Third, the NEC preflight returned WARN because UQCRC2 was mentioned 49 times against TTC19's 178; UQCRC2 causes complex III deficiency nuclear type 5, a different MONDO entity, and no UQCRC2 content was carried into this entry. Fourth, pyocyanin is curated as a mechanism with treatment_effect BYPASSES rather than as a treatment option, and the treatment description states in capitals that it is not a clinical treatment: the evidence is patient fibroblasts plus fly and zebrafish models with a mouse toxicity study, and there is no human trial. Validated with just validate for schema and terms, 31/31 snippets verified against cached references, and the offline CI gates. Two drafting errors were caught by the validators: an invented anatomical_context slot rejected by schema validation and corrected to locations, and a guessed reference title for PMID:41818954 rejected by the title check; after correcting it all six titles were verified against the cache programmatically.

  summary: 'Review round 1: add olivary degeneration, psychiatric and neuropathy phenotypes'
  details: |
    Addresses all three blocking findings and both non-blocking items from the ai4c-reviewer review on PR 9423. Blocking 1: hypertrophic olivary degeneration is now a phenotype bound to HP:0008303 with two evidence items from PMID:25887401, including the statement that it was present in all patients reported so far; it previously appeared only in the entry prose, which was inconsistent with the entry itself calling it the distinctive finding. Blocking 2: psychosis and peripheral neuropathy added. The psychiatric item is quotable from PMID:33833234 as the reviewer indicated and is graded PARTIAL because it is a review sentence naming a category with a downstream citation rather than a primary description; the embedded digits in that snippet are flattened superscript citation markers in the cached text and are quoted as they appear. Peripheral neuropathy was NOT quotable from PMID:33833234, contrary to the review, so PMID:37927170 was fetched instead and supplies the hedged statement that some patients had peripheral neuropathy, graded PARTIAL with no frequency band because the source gives no denominator. Blocking 3: PMID:26425749 added to references with the GeneReviews tag only and deliberately not mined, per the reviewer's own caveat that its cached record never names TTC19. Non-blocking: a CHEBI:8653 pyocyanine therapeutic_agent added to the pyocyanin treatment; and the paediatric weighting question answered with a notes paragraph stating that it follows from the cited cohorts being paediatric rather than being a deliberate boundary, that the adult psychiatric and neuropathy arms are now represented, and that the adult spinocerebellar-ataxia presentation remains a genuine gap in this entry's sources. One drafting error was caught by the validators again: a guessed reference title for PMID:37927170 saying literature review where the record says systematic review. All reference titles in the file were then rewritten programmatically from the cache rather than by hand, which is the practice adopted for the rest of this run. Revalidated: schema and terms pass, snippets rose from 31/31 to 35/35 verified, offline gates clean, zero dangling entity refs.

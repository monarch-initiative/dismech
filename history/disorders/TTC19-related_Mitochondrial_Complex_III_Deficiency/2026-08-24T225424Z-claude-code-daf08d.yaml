  summary: 'Review round 2: widen psychiatric phenotype term to match its evidence'
  details: |
    Acts on the single non-blocking suggestion left on the approving re-review of PR 9423. The psychiatric phenotype bound HP:0000709 Psychosis, which is defined in terms of hallucinations and delusions, while its only cited support says severe psychiatric disorders and its own description said that no finer term is asserted. That was a self-contradiction and an over-assertion of the same kind flagged and agreed on PR 9424, where a term was removed for being a false match. The binding is widened to HP:0000708, whose current HPO label is Atypical behavior, which matches the quoted evidence without asserting a specific psychiatric diagnosis; the phenotype is renamed from Psychosis to Psychiatric Manifestations accordingly, and the description records the change and the reason. HP:0000708 was already present in the term and enum caches so the change validates offline and introduces no new cache rows. HP:0000709 remains in the cache but was already present at origin main and is used by three other disorder entries, so nothing was removed. This push resets the approval the re-review had just granted; that cost was accepted deliberately because an ontology binding that asserts more than its evidence is a defect rather than polish, and holding a lower standard on an approved entry than on an unapproved one would be inconsistent. Revalidated: schema and terms pass, 35/35 snippets still verified, duplicate-key and folded-hyphen gates clean, zero dangling entity refs, no cache changes.

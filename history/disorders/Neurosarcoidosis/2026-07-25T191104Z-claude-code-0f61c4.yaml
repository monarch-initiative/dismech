  details: |
    Claim-evidence correctness audit of 10 neuroimmune entries.

    Two pathophysiology nodes cited PMID:30167654 (Neurosarcoidosis Consortium consensus criteria) with sentences that carry no claim content, both tagged SUPPORT:

    1. 'Nervous System Granulomatous Inflammation' quoted 'Diverse disease presentations and lack of specificity of relevant diagnostic tests contribute to diagnostic uncertainty' -- a statement about diagnostic uncertainty, not about granulomatous involvement of neural tissue. Replaced as primary support with PMID:32404428 ('definite neurosarcoidosis criteria require nervous system pathology consistent with sarcoidosis'); the consensus paper is retained at PARTIAL quoting its neural-biopsy requirement.

    2. 'Neurologic Dysfunction' quoted 'The work of this collaboration included a review of the manifestations of neurosarcoidosis and the establishment of an approach to the diagnosis of this disorder' -- a scope sentence about the paper itself. Replaced as primary support with PMID:32404428, which enumerates cranial neuropathies, aseptic meningitis, peripheral neuropathy, myelopathy, intraparenchymal mass lesions, and hydrocephalus. The consensus paper is retained at PARTIAL for clinical heterogeneity, with an explanation noting it frames heterogeneity as a diagnostic problem rather than enumerating manifestations.

    Added conforms_to declarations against the granuloma_formation module, which names sarcoidosis as a target conformer: the Th1/Th17 node to #Th1 and TNF-Driven Macrophage Recruitment and Activation, and the granulomatous inflammation node to #Organized Granuloma Assembly.

    Validation: linkml-validate (Disease) passes; linkml-term-validator --labels passes; all 69 evidence snippets verified as exact substrings.

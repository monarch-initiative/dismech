  summary: 'Create: Juvenile Neuronal Ceroid Lipofuscinosis'
  details: |
    Created the MONDO:0019262 genetically heterogeneous juvenile-onset NCL grouping as a separable subtask of issue #7581. A corrected sanctioned claude_code deep-research report was manually audited for entity identity after an earlier CLN3-reanchored report failed the named-entity check and was discarded. Curated independently evidenced juvenile presentations of CLN1/PPT1, CLN2/TPP1, CLN3, CLN5, CLN6, CLN7/MFSD8, CLN8, CLN10/CTSD, and CLN12/ATP13A2; each branch has a matching subtype, genetic, progression, and proximal pathophysiology record. Added historical juvenile-NCL prevalence, ancestry-aware carrier context, variable-expressivity guardrails, richer phenotype and diagnostic workflows, a CLN2-specific cerliponase-to-TPP1 treatment join, GeneReviews metadata, and membership in the NCL grouping. Verified schema, ontology terms, and every evidence snippet against generated caches. This record does not resolve the CADASIL or SMA anchor decisions or close issue #7581.

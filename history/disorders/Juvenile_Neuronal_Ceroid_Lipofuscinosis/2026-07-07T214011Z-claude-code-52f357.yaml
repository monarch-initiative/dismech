  summary: 'Create: Juvenile Neuronal Ceroid Lipofuscinosis'
  details: |
    De-novo curation of MONDO:0019262, the onset-defined juvenile NCL (Batten/Spielmeyer-Vogt). NEC preflight confirmed it is a genetically heterogeneous onset group (no single causal-gene edge), distinct from the gene-level NCL3 entry MONDO:0008767; MONDO:0019262 was unused. Conforms to lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation. CLN3 (hgnc:2074) modeled as predominant cause with genetic heterogeneity noted. Evidence: Mole/Cotman 2015 PMID:26026925, Nita/Mole/Minassian 2016 PMID:27629553, macular CLN3 PMID:26486417; all 16 snippets verified as exact substrings. Schema/terms/references validation pass.

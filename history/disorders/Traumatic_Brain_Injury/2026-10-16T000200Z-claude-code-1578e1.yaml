  summary: Add GCS severity-band diagnosis row (tranche Q batch 2)
  details: |
    LOINC tranche Q batch 2 (staging and severity scores, Parkinsonism cluster plus the canonical GCS entry). Added a diagnosis[] row binding LOINC:35088-4 (Glasgow coma scale panel) via measurements and LOINC:9269-2 (Glasgow coma score total) via reference_ranges, with three interpretation_bands (Severe TBI upper_bound 9 / Moderate TBI 9-13 / Mild TBI lower_bound 13, half-open per the schema convention). This is the first tranche-Q entry where a band is warranted rather than declined: GCS mild/moderate/severe cut-offs are a published property of the instrument used as a disease-level severity classification, not an allocation-policy trigger or treatment gate (contrast MELD and Child-Pugh in batch 1). Cited PMID:36183712 (the 2022 Lancet Neurology Commission update on TBI, already cited three times elsewhere in this entry), quoting its single sentence stating all three cut-offs together: 'The GCS remains the main instrument for classifying the severity of TBI as mild (GCS 13-15), moderate (GCS 9-12), or severe (GCS <=8).' Found by grepping every PMID already cited in this entry's cache files for GCS-numeric-band language rather than searching the literature fresh; this source already carries OTHER grading elsewhere in the file for its own epidemiological synthesis statements, so the new item is graded evidence_source: OTHER, quote_role: REVIEW_SYNTHESIS to match (no check-snippet-grading divergence). Both codes confirmed against the Monarch KG API in the step written, then seeded into cache/loinc/terms.csv via just loinc-seed-cache; neither requires a third-party copyright notice. No collision with either code on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, and tests/test_loinc_measurement_schema.py all pass.

    Review round (PR #14447): accepted the row as-is but suggested citing the Mild TBI band's "comprises the large majority of cases" interpretation, which had been uncited. Added a second evidence item on the same reference_ranges block, quoting the same PMID:36183712 full text: "Mild TBI, defined as a Glasgow Coma sum score of 13-15, comprises most of the TBI cases (over 90%) presenting to hospital." Same OTHER / REVIEW_SYNTHESIS grading as the sibling item.

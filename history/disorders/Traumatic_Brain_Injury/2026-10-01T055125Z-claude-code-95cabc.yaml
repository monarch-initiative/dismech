  summary: Add seizure prophylaxis, hyperosmolar therapy and haematoma evacuation;
    fix corticosteroid snippet
  details: |
    Addresses the three blocking findings of the automated review of PR 13278. Added Early Seizure Prophylaxis (phenytoin, levetiracetam) citing the Temkin randomised trial for its first-week benefit and, as REFUTE, for the absence of any effect on late seizures. Added Hyperosmolar Therapy (mannitol, hypertonic saline) with background evidence that it is routine for lowering intracranial pressure and refuting evidence from a ten-trial meta-analysis and the COBI trial that it improves outcome. Added Haematoma Evacuation (craniotomy) citing STITCH(Trauma): background that evacuation of significant subdural and extradural haematomas is established, and the trial's finding of fewer deaths with early surgery for intraparenchymal haemorrhage. Replaced the corticosteroid snippet, which said only that mortality was not reduced, with the CRASH findings sentence reporting higher two-week mortality (relative risk 1.18), so the snippet supports the explanation. Also took four of the review's suggestions: added PMID:16174940 (physical model of contrecoup injury) as mechanistic support for the head-acceleration to contusion edge, which previously rested only on a severity definition; marked the rat-paper sentence on shear forces as quote_role BACKGROUND and regraded it OTHER; split the GFAP and UCH-L1 biomarker into two records so each is bound; and recorded in the entry notes why persistent psychiatric and somatic symptoms and APOE are not yet curated. Validation: just validate passes; 84/84 snippets verify.

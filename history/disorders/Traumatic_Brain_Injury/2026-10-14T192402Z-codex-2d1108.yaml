  summary: Curate PSD-95-nNOS coupling and preclinical ZL006 evidence in TBI
  details: |
    Targeted curation of Qu et al. (PMID:31989159; PMC7264644), requested by the user. Added a provisional molecular mechanism linked to excitotoxic glutamate release and secondary neuronal loss, with DLG4 and NOS1 bindings verified against the HGNC term cache. Added the reported mouse ZL006 intervention as explicitly preclinical. Included Bach et al. (PMID:26177569) because negative PDZ-domain binding results limit inference that ZL006 rescue establishes selective inhibition of this interface; the discussion distinguishes biochemical target specificity from the observed animal benefit. Both references were retrieved through just fetch-reference. Schema, terms and reference checks passed, with 102/102 evidence snippets and titles validated.
    Both targeted TBI data tests and duplicate-key, entity-reference, causal-target and qualifier checks passed. Independent source review accepted the provisional mechanism and uncertainty framing; the treatment summary was narrowed to the outcomes supported by its adjacent quote, and upstream wording avoids implying newly induced complex assembly.

  summary: 'Create: Megacystis-Microcolon-Intestinal_Hypoperistalsis_Syndrome_1'
  details: |
    New entry for megacystis-microcolon-intestinal hypoperistalsis syndrome 1, the MYLK form (MONDO:0100354), claimed in issue 15340, modelled on the MMIHS2 sibling entry. Deep research: one Perplexity report (research/Megacystis-Microcolon-Intestinal_Hypoperistalsis_Syndrome_1-deep-research-perplexity.md; 15/15 references resolved; preflight-dr PASS). Three medium-effort runs were dropped by the API after about five minutes, so the report was produced with reasoning_effort=low (recorded in its provider_config).

    The gene-discovery report (PMID:28602422) and the GeneReviews MMIHS overview (PMID:31070878, tagged) are cached abstract-only, so the discovery families' individual findings that the report attributes to full text are not curated. Phenotypes come from the discovery abstract, a 2025 MMIHS cohort and a 2022 systematic review; the cohort's only MYLK patient carries a missense variant (p.G1607V) of unreported zygosity, so every item drawn from that patient says so, and duodenal stenosis, reported only in that patient, was not curated. Mechanism from the smooth muscle-specific Mlck knockout mouse (PMID:18586037). The validator strips bracketed spans, so the variant quote bridges the bracketed protein notation with an ellipsis.

    An internal red-team review before the PR found a false cache claim in notes, the unflagged missense variant, an unsupported statement about monoallelic variants, missing directness on mouse edges, a generic cell-type binding and missing treatment and readout content; all were corrected. Validation: validate-disorders (26/26 snippets), validate-terms, check-entity-refs, check-causal-targets, gene-activity grounding, model-scale-audit and check-genereviews pass.

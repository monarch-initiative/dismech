  summary: Link dietary carbohydrate and prior antibiotics to gut nodes
  details: |
    Backfill for issue #8085. Two exposures, two different nodes, two different grades. High carbohydrate and monosaccharide exposure is TRIGGERS with DIRECT into the excess microbial ethanol production node, because dietary carbohydrate is the substrate that node consumes rather than something acting on it from outside; the description notes that the cited case-control study calls monosaccharide content a potential inducing factor rather than a demonstrated one. Prior antibiotic exposure is PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES into the fungal overgrowth node and keeps the PARTIAL grade this entry already assigned its evidence, because the systematic review reports prior antibiotic treatment in only some of the fungal cases and the intervening loss of colonization resistance is understood but unmeasured. The entry's own description already called this a risk context rather than a necessary cause, and the link agrees with it. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 55 of 55 verified.

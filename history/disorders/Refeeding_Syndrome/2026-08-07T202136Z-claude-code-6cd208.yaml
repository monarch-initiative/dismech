  summary: Link starvation, aggressive feeding, and risk groups to the setup
  details: |
    Backfill for issue #8085. Four exposures across two nodes, with the grading turning on whether an exposure constitutes a node or merely reaches it. Aggressive refeeding after malnutrition is TRIGGERS with DIRECT into the aggressive nutritional reintroduction node, and prolonged malnutrition or starvation is TRIGGERS with DIRECT into the pre-refeeding malnutrition state, because in both cases the exposure and the node describe the same event. Severe acute malnutrition in hospitalized children targets the same malnutrition node but is PREDISPOSES rather than TRIGGERS: it identifies a population arriving in that state without adding a step to the chain. Severe mental illness with starvation is graded lowest, PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES and supports PARTIAL, because reduced intake and sustained starvation genuinely intervene and because the single cited report hedges on both the diagnosis and whether the syndrome occurred. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 77 of 77 verified.

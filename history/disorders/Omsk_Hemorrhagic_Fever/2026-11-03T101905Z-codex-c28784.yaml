  summary: 'Create: Omsk Hemorrhagic Fever'
  details: |
    Created kb/disorders/Omsk_Hemorrhagic_Fever.yaml for MONDO:0017882 and issue #16369 as a distinct tick-borne and muskrat-associated Orthoflavivirus omskense hemorrhagic fever. Bound the virus to NCBITaxon:3048233, Dermacentor reticulatus to NCBITaxon:57047, muskrat to NCBITaxon:10060, and the disease to its exact MONDO term after confirming with ignored-inclusive local search and GitHub issue/PR search that no Omsk entry, stub, or open PR already existed.

    Deep research did not yield a usable provider report. `just research-disorder claude_code Omsk_Hemorrhagic_Fever` was blocked before writing a file by the local Claude Code workspace-trust gate, and two `just research-disorder openscientist Omsk_Hemorrhagic_Fever` attempts produced no staged report in roughly six and roughly ten silent minutes, respectively, and were interrupted. A later `just research-disorder-cyberian-codex Omsk_Hemorrhagic_Fever` attempt reached AgentAPI after the standalone helper was installed locally, but AgentAPI returned HTTP 500 on the first message because the Codex terminal never reached an input-ready state from AgentAPI's perspective. The fallback research artifact at research/Omsk_Hemorrhagic_Fever-deep-research-fallback.md records those attempts and the PubMed/PMC sources used directly.

    Curated the infectious-disease sections required by the granularity ladder: the OHFV agent, tick-bite and infected-muskrat transmission routes, and a life-cycle block with Dermacentor reticulatus as the principal tick vector/reservoir, Ixodes persulcatus as a second tick vector/reservoir, muskrat as amplifying host, and human as incidental host. Added ultra-rare focal prevalence, a three-phase incubation / initial febrile illness / secondary severe phase progression block, an Omsk-specific three-node mechanism chain from OHFV replication through NS1-mediated endothelial barrier disruption to increased vascular permeability, and a Supportive Care treatment noting the absence of an approved specific therapy or human vaccine. Phenotypes cover fever, headache, myalgia, cough, petechiae, thrombocytopenia, abnormal bleeding, pneumonia, hematuria and nuchal rigidity.

    All evidence was re-fetched or confirmed in references_cache with `just fetch-reference` and exact snippets rather than copied from a provider report. New Omsk references: PMID:40005791, PMID:40733540, PMID:35001393, PMID:24259273 and PMID:19277843; cached VHF review PMID:31668201 was also used. The pathophysiology deliberately conforms only to the endothelial and vascular-permeability arm of viral_hemorrhagic_fever_syndrome: direct Omsk evidence supports NS1-driven endothelial leak, but not decreased coagulation-factor production or platelet dysfunction.

    Validation: `just validate kb/disorders/Omsk_Hemorrhagic_Fever.yaml` passed with 29 of 29 snippets verified; `just count-verified-snippets kb/disorders/Omsk_Hemorrhagic_Fever.yaml` reported 29/29; `just validate-disorders kb/disorders/Omsk_Hemorrhagic_Fever.yaml`, `just validate-terms kb/disorders/Omsk_Hemorrhagic_Fever.yaml`, `just check-entity-refs`, `just check-duplicate-keys`, `just check-enum-values`, and `just check-granularity kb/disorders/Omsk_Hemorrhagic_Fever.yaml` all passed. A custom Omsk-only title-snippet check verified that none of the 29 evidence snippets merely quote a cached reference title; the whole-repo `just check-title-snippets` scan was interrupted after several minutes in its baseline cache walk.

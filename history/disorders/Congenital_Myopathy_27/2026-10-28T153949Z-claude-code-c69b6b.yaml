  summary: 'Answer review of #15519: remove evidence that does not state its claim,
    reword mouse findings presented as human results'
  details: |
    Removed evidence items attached to claims they do not state: the PMID:29202928 necrosis sentence on the Elevated circulating creatine kinase activity phenotype, the PMID:34990060 mouse sentence on both inheritance blocks, the review and mouse sentences on the Myopathy and Exercise intolerance phenotypes (model-organism evidence alone must not support a human phenotype), the PMID:34990060 sentence on PACSIN3 Molecular Genetic Testing, and the PMID:34990060 items on both classifications. The three phenotypes are uncited again, with the notes main carried, because the only human report (PMID:38637313) has no abstract. Removed GO:0010657 muscle cell apoptotic process: the sources report necrosis and inflammation, not apoptosis, and GO's necrotic cell death term GO:0070265 is obsolete. Reworded the Muscle Biopsy row as what a biopsy would be examined for, based on the knockout mouse, and removed its presence and results. Renamed the treatment to Supportive Care, removed its target_mechanisms link, its evidence and its BEHAVIORAL modality, and recorded in notes that no management guidance has been published. Corrected the 2026-10-24 history record, which said classifications and inheritance were added and backed by PMID:38637313.

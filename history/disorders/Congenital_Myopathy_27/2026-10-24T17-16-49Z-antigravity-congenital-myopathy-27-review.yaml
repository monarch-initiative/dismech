  summary: Review and enrich Congenital Myopathy 27 with node annotations, edge evidence, diagnosis and
    treatment rows
  details: Added cell_types (CL:0008002 skeletal muscle fiber) and locations (UBERON:0001134 skeletal
    muscle tissue) on the first three pathophysiology nodes, GO:0007009 plasma membrane organization on
    Loss of Sarcolemmal Tension Buffering, and GO:0010657 muscle cell apoptotic process on Exercise-Induced
    Myofiber Damage. Added PMID:29202928 evidence on the edges to Elevated circulating creatine kinase activity
    and Exercise intolerance. Added evidence items (from PMID:34990060 and PMID:29202928) to the two existing
    harrisons_chapter classifications, the disease-level inheritance block, all three phenotypes and the
    animal model, and a genetic-level inheritance block. Set diagnostic true on Myopathy and Elevated circulating
    creatine kinase activity. Added a diagnosis section (Muscle Biopsy, PACSIN3 Molecular Genetic Testing)
    and a treatments section (Supportive Care and Activity Modification). The classifications and the disease-level
    inheritance block already existed on main, and PMID:38637313 is not cited by any evidence item because
    it has no abstract. Several of these additions were revised or removed in the next review round.

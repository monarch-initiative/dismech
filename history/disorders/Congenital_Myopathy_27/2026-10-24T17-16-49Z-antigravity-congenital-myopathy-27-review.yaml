  summary: Review and enrich Congenital Myopathy 27 compliance and mechanistic grounding
  details: '- Added `classifications` (`NEUROLOGIC`, `GENETICS_ENVIRONMENT_DISEASE`) and `inheritance`
    (`Autosomal Recessive`) backed by PMID:34990060 and PMID:38637313.

    - Grounded `pathophysiology` nodes (`Loss of Syndapin III Membrane-Shaping Activity`, `Failure of
    Caveolar Invagination in Muscle`, `Loss of Sarcolemmal Tension Buffering`, and `Exercise-Induced Myofiber
    Damage`) with `molecular_functions` (`GO:0005543`), `biological_processes` (`GO:0070836`, `GO:0007009`,
    `GO:0010657`), `locations` (`UBERON:0001134`), `cell_types` (`CL:0008002`), and causal `downstream`
    edges.

    - Marked core phenotypes with `diagnostic: true` and structured `diagnosis` (`Muscle Biopsy` and `PACSIN3
    Molecular Genetic Testing`) and `treatments` (`Supportive Care and Activity Modification`) backed
    by PMID:11082044, PMID:29202928, PMID:34990060, and PMID:38637313.


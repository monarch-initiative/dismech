  summary: 'Create: Congenital Myopathy 27 (PACSIN3)'
  details: |
    New entry for PACSIN3-related congenital myopathy (MONDO:0979897). The defining human report (PMID:38637313, Brain 2024 letter) has no abstract and no open full text, so phenotypes are uncited and explained in notes. Pathophysiology chain (loss of syndapin III F-BAR membrane shaping -> failed caveolar invagination -> loss of sarcolemmal tension buffering -> exercise-induced myofiber damage -> phenotypes) is evidenced from the syndapin III knockout mouse (PMID:29202928, full text) and a review (PMID:34990060). relationship_type left unset (single report, no ClinGen classification). Validated with just validate, validate-terms, count-verified-snippets (16/16), entity-ref, causal-target and duplicate-key checks, and validate-disorders.

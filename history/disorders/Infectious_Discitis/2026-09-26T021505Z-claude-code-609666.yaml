  summary: 'Create: Infectious Discitis'
  details: |
    Created a MONDO:8000000 Infectious Discitis entry from the OpenScientist report. The entry covers the bacterial MONDO leaves for staphylococcal, E. coli, pneumococcal, and Salmonella discitis as subtypes; it models hematogenous or procedural spinal entry, endplate seeding, disk-space invasion, inflammatory and biofilm-associated bone destruction, and epidural or paravertebral abscess with neural compression. The curation deliberately excluded the report's mislabeled HP:0032243 and UBERON:0006678 term suggestions and scoped tuberculous, brucellar, and fungal spondylodiscitis out of this bacterial pass. Validated with just validate, just count-verified-snippets, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, and just prose-figure-audit.

  summary: 'Address review: re-source REFUTE item, link phenotypes, add diagnosis'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 11201 (ai4c-reviewer). Finding 1 (genuine claim-evidence mismatch): the REFUTE evidence item on broad-spectrum antiseizure pharmacotherapy quoted 'treated with valproic acid (VPA), LEV, and sulthiame with no benefit' from the Patient 14 narrative; two-column PDF extraction makes that read as seizure-treatment failure, but the 'no benefit' attaches to persistent EEG abnormalities and that patient in fact achieved seizure freedom, so the entry cited one sentence twice with opposite readings. Re-sourced to the paper's direct statement ('Conversely, ASMs are ineffective in patients with GoF GABRA1 variants with severe epilepsy...') and rewrote the treatment description and explanation to match. Finding 2: all 11 phenotypes were orphaned from the pathograph; added 12 bare-name downstream edges from 'Seizure Generation in the Developing Brain' (seizure-type, EEG and fever-sensitivity phenotypes) and 'Drug-Resistant Epilepsy with Developmental Impairment' (developmental, behavioral and movement phenotypes), taking phenotype linkage from 0/11 to 12/12. Finding 3: added a diagnosis section with two steps (trio exome/panel sequencing; functional electrophysiological variant classification), 5 evidence items. Finding 4: added the 'Behavioral disturbance and ADHD' phenotype (HP:0007018, 7/24 = 29%), which was more frequent than the ASD already modeled. Suggestion 1: added the actionable levetiracetam finding to the pharmacotherapy treatment. Suggestion 3: extended the ASD snippet through its denominator. Suggestion 4: replaced the tonic-current snippet with the paper's direct 'no change in tonic GABAAR currents' phrasing. Suggestion 2 (normalize alpha1 vs alpha-1 symbol) was declined and documented in notes: the two spellings belong to two different papers (PMID:32047208 writes 'alpha1' in its own text, PMID:25447232 writes the Greek symbol), so each snippet is exact for its source and normalizing either would break exact-quote validation. Also refreshed the notes quotation-artifact paragraph, which had gone stale because two of the artifact-bearing snippets it named were removed by this round. Validation after the final edit: validate, validate-terms, count-verified-snippets 68/68, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, and the authoritative validate-disorders all pass. PR was MERGEABLE (not conflicting), so no rebase was performed.

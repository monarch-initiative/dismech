  details: |
    Landed the deep-research artifact the entry previously lacked. falcon (Edison Scientific) was retried and still returns HTTP 402 (account out of credits), confirmed on a direct run; the repository's recorded --fallback path then selected openscientist, which produced research/Developmental_And_Epileptic_Encephalopathy_19-deep-research-openscientist.md (fell_back: true, requested_provider: falcon recorded in frontmatter). Report reference validation is clean (23/23 resolved, confabulation_rate 0.0, 19/23 on topic); just preflight-dr against MONDO:0014328 PASSES with GABRA1 dominant at 34 mentions and OMIM 615744 matching, so no Named Entity Confusion. The report's term_validation carries needs_review: true with four mislabelled CURIEs (NCIT:C935 offered as valproate is Vindesine Sulfate; NCIT:C62735 offered as ketogenic diet is Vaccine-Draining Lymph Node Lymphocyte Therapy; GO:0005783 and NCBITaxon:10116 mislabelled) and one obsolete term (GO:0005887); no CURIE was taken from the report. Content added from the report: a vinpocetine treatment (CHEBI:32297, therapeutic_modality SMALL_MOLECULE) targeting the loss-of-function arm, with three HUMAN_CLINICAL evidence items from PMID:42227896, including the GABRA1 Arg112Gln seizure-freedom result; the treatment is explicitly scoped as investigational and as inappropriate for the gain-of-function arm. Rewrote the stale 'Deep research provenance' paragraph in notes, which asserted no report backed the entry. Also corrected an overstatement found by an independent red-team review of the previously unreviewed commit 52d00f54: the entry claimed ADHD/behavioral disturbance was the most frequent neurodevelopmental accompaniment after developmental delay, but PMID:37606373 reports movement disorders at the identical 7/24 (29%), so the two are tied; corrected in both the phenotype description and the mirrored causal-edge description. Deliberately did not add the ERAD/proteostasis references the report surfaced (PMID:30481215, PMID:25406314): the cached full-text PDF extraction is heavily corrupted and the entry already covers the trafficking-rescue axis via verapamil. Validated with just validate, validate-terms, count-verified-snippets (71/71), the per-file and whole-KB gates, and validate-disorders.

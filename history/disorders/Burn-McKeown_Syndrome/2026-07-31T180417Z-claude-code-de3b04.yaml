  summary: 'Create: Burn-McKeown_Syndrome'
  details: |
    Created the Burn-McKeown syndrome entry (choanal atresia-hearing loss-cardiac defects-craniofacial dysmorphism syndrome; MONDO:0012064; OMIM 608572; TXNL4A) for issue #7214. Deep research provider falcon/Edison. NEC preflight passed - MONDO:0012064 carries OMIM:608572 and the TXNL4A gene association, and the falcon report is anchored on TXNL4A/BMKS. Scope was actively policed away from the other craniofacial spliceosomopathies (EFTUD2 mandibulofacial dysostosis with microcephaly, SF3B4 Nager, SNRPB cerebrocostomandibular) and away from the unrelated TXNL4A hepatocellular-carcinoma biomarker literature. GeneReviews chapter PMID:27413799 fetched and tagged, with all four abstract sections mined. Curated 5 pathophysiology nodes, 17 phenotypes with HPO terms, structured prevalence, genetics emphasising the promoter-deletion architecture and its diagnostic consequence, 6 treatments, an experimental_models entry for the patient iPSC-derived neural crest system, one animal model and a KNOWLEDGE_GAP discussion on spliceosomopathy tissue specificity with two proposed experiments. Module conformance was declared against the first two nodes of pharyngeal_arch_patterning_serial_homology and deliberately declined at the third serially-homologous-bundle node, with the reasoning and its caveats documented in notes. Validation: just validate PASS, just validate-terms PASS, programmatic snippet check 66 of 66 exact whitespace-normalised substrings with 0 mismatches, 0 dangling refs and 0 orphan nodes.

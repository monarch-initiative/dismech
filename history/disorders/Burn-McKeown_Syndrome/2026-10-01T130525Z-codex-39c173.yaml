  summary: Review TXNL4A regulation, clinical spectrum and experimental mechanisms
  details: |
    Reviewed the full existing entry, prior history, Falcon report and citation index against cached references, including full GeneReviews and the 2014 discovery, 2017 clinical, published 2020 patient-cell, 2022 Xenopus and 2024 mouse-cell studies. Separated the two recurrent 34-bp promoter deletions from promoter activity, functional dosage, tri-snRNP assembly and downstream splicing; removed the misleading 56-bp-deletion and carrier-frequency interpretations. Qualified TCF7L2/WNT/EMT causality, non-isogenic controls, untested patient migration, model-specific apoptosis and the provisional Txnl4a-Mdm2-p53/metabolic route. Added micrognathia, maxillary and mouth/lip findings, specific cardiac lesions and hypomimic face; replaced unsupported frequency bands with explicitly pooled TXNL4A-spectrum counts and corrected categorical differential claims. Expanded promoter/second-allele/phase testing, care and surveillance, ontology-bound differentials and five cell/assay models plus the frog model. Kept dual-diagnosis and incidental liver-adenoma reports as attribution questions, without inventing cancer surveillance or transferring findings from TXNL4A-negative phenocopies. No registered study was returned by the current Burn-McKeown/TXNL4A ClinicalTrials.gov search. Updated the renamed node-class example. Regenerated cited caches with the repository fetcher; all 122 quotes and 136 titles validate. Shared Xenopus-cache quotes were checked in mandibulofacial dysostosis with microcephaly. Research coverage is adequate across phenotype, mechanism, genetics, diagnosis, care and models; molecular subtypes and disease-modifying treatment remain unsupported.

  summary: 'Create: SLC26A1-Related Hypersulfaturia'
  details: |
    New entry for biallelic SLC26A1 loss-of-function hypersulfaturia (MONDO:0957268, OMIM 620372), aligned with the ai-gene-review SLC26A1 review (core MF GO:0015383 sulfate:bicarbonate antiporter activity, BP GO:1902358, basolateral plasma membrane). Pathograph: SLC26A1 LoF -> renal proximal tubular sulfate wasting -> hyposulfatemia -> perichondritis (author inference). Evidence from PMID:36719378 (full text) and PMID:30383413 (knockout mouse abstract). Cross-references, rather than duplicates, SLC26A1-Related_Oxalate_Transporter_Deficiency, which keeps the contested oxalate/stone phenotype. No ClinGen assertion exists for SLC26A1. No stub existed for MONDO:0957268.

  summary: 'Gene-family review: SLC26A1 retyped UNKNOWN'
  details: |
    The SLC26A1 record was typed CAUSATIVE while quoting its own source saying the data do not meet ClinGen gene-phenotype attribution criteria and do not yet define a Mendelian disorder (PMID:36719378). CAUSATIVE asserts Definitive or Strong evidence; a Mendelian disorder here rests on a single homozygous proband, so the record is now typed UNKNOWN. The gene's control of plasma sulfate is well supported and the notes say so: both Slc26a1 knockout mouse lines are hyposulfatemic (PMID:30383413), damaging variants lower plasma sulfate at population level (PMID:36719378), and an independent metabolomics-exome study shows an SLC26A1 allelic series with graded effects on plasma sulfate (PMID:39747595, newly added evidence). The note's statement that no ClinGen assertion exists for SLC26A1 was corrected: ClinGen has one (Limited) for the stone class MONDO:0020722, none for hypersulfaturia. Record-level autosomal recessive inheritance added. Mechanism node unchanged: sulfate:bicarbonate antiporter activity decreased at the basolateral membrane.

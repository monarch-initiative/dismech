  summary: 'Create: intellectual disability, X-linked, syndromic 33'
  details: |
    New entry for MRXS33 / TAF1 intellectual disability syndrome (MONDO:0010500), curated for issue 11067. Deep research: Edison (falcon) was requested but its account returned HTTP 402 out of credits, so the run used the documented --fallback path and claude_code produced the report, recorded in research/Intellectual_Disability_X-linked_Syndromic_33-deep-research-claude_code.md with fell_back: true and requested_provider: falcon. The report was used as leads only; every evidence snippet was taken from a reference fetched directly into references_cache and verified against it. preflight-dr against MONDO:0010500 returned WARN only because the HPO 'HP:' prefix is counted as the haptoglobin gene, and because the report mentions OMIM 314250 (XDP), which the entry deliberately discusses as the allelic differential. Gene-drift check: TAF1 mentioned in 44 lines / 57 occurrences with no competing gene. Content: 8 pathophysiology nodes forming a chain from TAF1 hypomorphic missense variants and Xq13.1 duplication through TFIID-dependent transcription dysfunction to impaired neurodevelopment and model-derived cerebellar Purkinje cell loss; 23 phenotypes bound to HP terms; genetic block with four named TAF1 variants; X-linked recessive inheritance bound to HP:0001419; structured prevalence as CASES_IN_LITERATURE / ULTRA_RARE; three animal models (mouse KO as FAILS_TO_RECAPITULATE, zebrafish KO, CRISPR-edited rat) with readouts; two mechanistic hypotheses; a HUMAN_MODEL_MISMATCH discussion; and differential diagnoses positioning MRXS33 against X-linked dystonia-parkinsonism and the other TAFopathies. A pre-PR red-team review in a subagent found that the 2024 TAF1 review already cited by the entry reports TAF1's kinase activity as unreproduced and largely retracted; the RAP74 node was rewritten to curate the measured phosphorylation change rather than assert a TAF1 kinase activity, the GO:0004674 binding was dropped, and REFUTE evidence was added. Three DIRECT causal edges were downgraded to INDIRECT_UNKNOWN_INTERMEDIATES where sources state association or possibility, two modifiers changed to DYSREGULATED, four background statements in animal-model papers regraded from HUMAN_CLINICAL to OTHER, and the mouse-KO FAILS_TO_RECAPITULATE link retargeted to the lesion node. No conforms_to was declared: TAF1 is a general transcription factor and the closest module scopes itself to chromatin machinery. Validation: just validate passes with 102/102 snippets verified, validate-terms passes, and check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all pass.

  summary: Address review findings on PR 11159
  details: |
    Round two on PR 11159, addressing the ai4c-reviewer CHANGES_REQUESTED review. Item 1, pathograph connectivity: 18 of 23 phenotypes had no incoming edge. Added two pathophysiology nodes and connecting edges - Impaired Craniofacial Development (evidence from the taf1/taf5 zebrafish TAFopathy study, PMID:37746814) feeding the facial gestalt, and six INDIRECT_UNKNOWN_INTERMEDIATES edges from Impaired Neuronal Differentiation and Neurodevelopment to generalized hypotonia, delayed speech and language development, autism spectrum disorder, abnormal brain morphology, seizure, and oral-pharyngeal dysphagia. Individual facial features are attached to the facial-dysmorphism phenotype via sequelae. Five phenotypes are deliberately left unattached (hearing impairment, strabismus, sacral dimple, joint hypermobility, genitourinary anomaly) because no source proposes a mechanism connecting them to any curated node; that decision is recorded in notes rather than left silent. Item 2: added the Loss of TAF1 Bromodomain Repression in Cardiogenesis node from PMID:36958711, which supplies the mechanism for the previously orphaned congenital heart malformation phenotype. Item 3: the symptomatic-female-carrier clause was asserted twice and cited zero times; now cited to PMID:38804708 and PMID:32564284. Item 4: added the genitourinary anomaly phenotype that had been dropped from a sentence already quoted three times. Reviewer suggestions also taken: zinc-knuckle promoter-occupancy evidence on the TFIID node (PMID:29545534), a second SAK3 readout covering cortical neurons, astrocytes and BDNF/AKT/GSK3-beta signaling (PMID:33359140), a chromosomal-microarray diagnosis entry for the duplication lesion (PMID:30298503, newly fetched), four further facial and skeletal features, and the Abidi syndrome synonym. Two term bindings were initially guessed and corrected against the ontologies before commit: UBERON:0011595 to UBERON:0007811 for craniocervical region, and NCIT:C17563 to NCIT:C18477 Microarray Analysis. Validation: just validate passes with 130/130 snippets verified, validate-disorders passes, and check-folded-hyphens, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms (including the online variant) and check-enum-values all pass. check-snippet-length, check-title-snippets and check-snippet-grading report findings only in other disorder files (Ewing_Sarcoma, Tangier_Disease, Glutaryl-CoA_Dehydrogenase_Deficiency, CRX_Related_Retinopathy, IgG4-Related_Disease, Primary_Ciliary_Dyskinesia, AIPL1_Related_Retinopathy, Congenital_Glaucoma, EYS_Related_Retinitis_Pigmentosa, Tay-Sachs_Disease) - this branch carries 163-commit-old copies of those files and the gates baseline against current origin/main, so the findings are stale-branch artifacts and none is in this entry. A rebase onto origin/main was attempted to clear them but is blocked by the case-colliding references_cache pair recorded in issue 11204; the PR remains MERGEABLE, so the rebase was not required.

  summary: 'Create: BRPF1-Related_Intellectual_Disability'
  details: |
    Created the BRPF1-Related Intellectual Disability (IDDDFP, MONDO:0015022, OMIM:617333, BRPF1/HGNC:14255) disorder entry from scratch. MONDO preflight confirmed the RO:0004003 gene relation is HGNC:14255 BRPF1 before any writing. Deep research ran via 'just research-disorder claude_code BRPF1-Related_Intellectual_Disability' (claude_code provider, 958s, 7 web searches, 61 turns, 19 citations); the full report and citations sidecar are committed under research/. A GeneReviews baseline was searched for and does not exist: PubMed queries for 'BRPF1 GeneReviews[All Fields]', 'BRPF1[All Fields] AND GeneReviews', and the disease-name plus GeneReviews query returned no BRPF1 chapter, so the phenotype baseline was anchored on the two 2017 founding series (PMID:27939639, PMID:27939640), the 29-patient 2025 cohort (PMID:39837771), and the dedicated speech-phenotyping study (PMID:38346666). Curated: 10 connected pathophysiology nodes forming one graph rooted at Heterozygous BRPF1 Loss-of-Function Variation, running through BRPF1 haploinsufficiency, impaired BRPF1-KAT6 complex function, and the parallel H3K23 acetylation and propionylation deficits to chromatin/transcriptional dysregulation and then to cortical neurogenesis, dendrite/spine, excitatory and inhibitory synaptic, learning-and-memory, and hematopoietic arms; two mechanistic_hypotheses (CANONICAL H3K23 acetylation loss, EMERGING H3K23 propionylation loss); 26 phenotypes with HPO bindings and frequency bands only where a published numerator/denominator exists; a genetic section with variant spectrum, inheritance, and gonadal mosaicism; two diagnosis entries; six treatments including an explicitly-caveated preclinical acylation-restoration entry; seven differential diagnoses covering the KAT6A, KAT6B, SETD5, 3p25.3, BPES and Noonan neighbours; a harrisons_chapter classifications block; and a HUMAN_MODEL_MISMATCH discussion on the mouse-null versus human-heterozygous zygosity gap. Named-entity-confusion discipline was applied throughout because BRPF1 is the scaffold of the KAT6A/KAT6B complexes: every clinical citation was checked to confirm the described patients carry BRPF1 variants, and KAT6A/KAT6B entities appear only as differentials. Validation: 'just validate' passes clean (schema, term, and reference validation) with 115/115 snippets verified against cached references; 'just compliance' reports 96.4 percent global / 96.8 percent weighted.

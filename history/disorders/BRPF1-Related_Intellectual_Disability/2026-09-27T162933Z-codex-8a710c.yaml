  summary: Review BRPF1 clinical evidence, mechanisms, models and datasets
  details: 'Reviewed the complete existing entry, all four preceding CREATE/EDIT histories, and the
    substantive deep-research report and citation sidecar. The entity is Mendelian BRPF1-related neurodevelopmental
    disease (MONDO:0015022; OMIM:617333; hgnc:14255), not an infectious or environmental disease.
    No preceding REVIEW record or competing open BRPF1 PR was found. Rebased before editing and again
    onto 91778fac335 before final corrections. The GeneReviews Bookshelf match is the FOXL2/BPES differential
    chapter, not a BRPF1 baseline.


    Used all 25 existing reference caches and retrieved three additional sources. Read the full scientific
    texts available for PMIDs 27939639, 39837771 (including clinical tables), 32010779, 31213987,
    33744924, 34485298, 36711238, 37862219, 27500495, 32457794, 31020800, 37946714 and 36077605. Retrieved
    and read the full scientific text of 18469222 and 25773539, including methods, rescue experiments
    and negative results. Read the remaining cached abstracts, including the newly retrieved 2025
    review 40593219. Full text for 25568313 could only be partially accessed online; retained exact
    cached abstract evidence rather than treating captcha or landing pages as a paper. All cache changes
    were produced by supported reference/dataset fetchers or validation normalization. No cache was
    manually authored, and the retired dataset-accessions JSON was not used.


    Content-completeness assessment:

    1. Phenotypes: adequate after adding 20 records, including frequent cohort omissions, separate
    callosal agenesis, facial asymmetry and epicanthus inversus. The entry now has 70 phenotypes.
    Distinguished callosal agenesis from hypoplasia, visual acuity impairment from pooled ocular abnormalities,
    and intellectual disability from global developmental delay. Preserved source conflicts in small-hand
    and laryngomalacia/stridor counts rather than inventing a denominator. The table''s bulimia label
    lacks diagnostic criteria for bulimia nervosa; recorded that limitation without asserting the
    psychiatric diagnosis. The combined aggressive/impulsive/violent category does not give a separate
    frequency for each behavior. Cohort-specific estimates retain missing-data and ascertainment caveats.

    2. Subtypes: adequate; no established disease subtypes requiring separate MONDO/OMIM bindings
    emerged. Variant-domain groupings are not treated as validated clinical subtypes. Contiguous deletions
    involving SETD5 remain a separate differential and interpretation problem.

    3. Mechanisms: adequate; 19 atomic nodes distinguish chromatin accessibility from transcription,
    neurogenesis from callosal development, dendrites from spines and axons, and intrinsic excitability
    from synaptic transmission. Removed exact-half-protein and universal complex-disruption claims.
    KAT7 association in vitro is distinguished from uncertain in-vivo relevance. Co-occupancy is not
    proof of direct histone-mark recognition. Patient-cell and overexpression findings are separated,
    and neuronal mediation is qualified where only co-occurrence is established. Seven cellular models
    and eight animal models capture genotype, lineage, timing, rescue and important negative findings.
    The zebrafish Hox-maintenance loss contrasts with Hox upregulation in mouse forebrain; global-null
    vascular and neural-tube phenotypes are model findings, not human prognosis.

    4. Treatments/trials: adequate. Split physical and occupational therapy and marked supportive-care
    inference separately from demonstrated efficacy. Added documented speech-therapy use and ptosis
    operations with limited repeat outcomes. HDAC inhibitors and propionate retain genotype-dependent
    biochemical responses and explicit preclinical status; zebrafish trichostatin-A rescue is not
    treated as a clinical neurodevelopmental intervention. Verified CHEBI identities, including valproic
    acid CHEBI:39867 rather than the research report''s incorrect suggested identifier. ClinicalTrials.gov
    API searches on 2026-09-27 for BRPF1, IDDDFP and the full syndrome name each returned zero studies;
    this does not exclude participation in broader trials.

    5. Genetics: adequate. Preserved variant-class and inheritance information, distinguished suspected
    gonadal mosaicism from directly demonstrated mosaicism, and added five structured variants. Val352Leu
    remains a VUS as explicitly classified in the primary methods, despite stronger wording in its
    title; predicted structural effects are not functional-assay results. Intrafamilial variability
    does not establish a population penetrance estimate or a reliable genotype-phenotype correlation.

    6. Diagnostics/biomarkers: adequate. Split exome and genome sequencing with accurate NCIT bindings,
    retained copy-number detection without requiring redundant assays for every patient, and removed
    unsupported ophthalmological screening intervals. A VUS does not establish diagnosis. Histone
    acylation readouts remain experimental, and the proposed DNA-methylation signature remains a research
    question rather than an established diagnostic test.

    7. References/datasets: adequate. Refreshed caches recovered clinical tables and model full texts.
    Added three high-value publications and verified five GEO datasets: GSE157903, GSE174600, GSE212983,
    GSE213695 and GSE63908. The last contains three paired array samples representing six embryos;
    GSE213695''s 18 deposited assay samples are not 18 donors. Preserved the GEO-versus-paper sequencing-platform
    discrepancy for the hESC study. Titles were checked for identifier/entity relevance; clinical
    evidence is not imported from KAT6A/KAT6B patients merely because their proteins share a complex.

    8. Overall consumption: adequate across central clinical, genetic, molecular, neuronal, hematopoietic
    and diagnostic themes. The research report''s secondary preprint on chromatin-loop insulation
    and inhibitor-based osteoclast experiments do not establish additional clinical mechanisms of
    heterozygous human BRPF1 disease; these remain nonblocking research leads. Cancer-directed BRPF1
    inhibition is outside this germline neurodevelopmental entry''s treatment scope. Replaced the
    previous process diary in KB notes with disease-specific limitations; review provenance is recorded
    here.


    Validation: schema, ontology terms and reference validation passed with 337 snippets and 370 titles,
    zero skipped or unavailable snippets and zero reference issues. All five dataset accessions verified.
    Scoped disorder and entity-reference tests passed. Causal-target and coarse-phenotype checks found
    no new violations. Formatter preserved parsed YAML values. Final commit hooks and current-head
    CI/independent review remain PR-stage checks and are not represented here as already completed.


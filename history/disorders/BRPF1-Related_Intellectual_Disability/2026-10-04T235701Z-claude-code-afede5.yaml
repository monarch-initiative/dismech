  summary: Evidence-claim mismatch review (#13154)
  details: |
    Reviewed the 33 whole-claim MISMATCH findings in the saved Jev assessment. Fixed six: (1) moved the H3K23 acetylation snippet from PMID:27500495 off the hematopoietic stem/progenitor node onto the Deficient Histone H3K23 Acetylation node, which is what it states; (2) removed the novelty sentence ('none were reported to have optic neuropathy') from the optic neuropathy phenotype, since it does not attest the finding and the two-case limitation is already in the description and notes; (3) added the zebrafish trichostatin A hoxa2b rescue to the HDAC-inhibition treatment description so the claim covers its cited evidence; (4) dropped the VUS-classification snippet from the gene-level causative record, where it bears on one missense allele rather than gene causality, and kept it on the p.Val352Leu variant record; (5) replaced the Map2k7 qPCR snippet on the transcription to MGE-interneuron excitability edge with the authors' sentence linking the mRNA-Seq changes to the electrophysiology; (6) replaced a null water-maze result cited as SUPPORT on the synaptic transmission to learning edge with the paper's own association statement (directness INDIRECT), and on the hippocampal shRNA model moved the two null snippets onto the UNCHANGED readouts they ground, using the tendency statement as link-level evidence. Retained: the remaining findings are mostly mouse, zebrafish and cell-model records flagged because the disease context is human; the model descriptions already state those systems and their limits, and the snippets support the model-level claims. Validated with just validate, count-verified-snippets (338/338) and validate-disorders.

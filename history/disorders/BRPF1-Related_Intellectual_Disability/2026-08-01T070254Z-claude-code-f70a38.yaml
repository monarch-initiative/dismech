  summary: 'Address review items: BRPF1'
  details: |
    Closed the seven blocking review items on PR #7599. (1) Added 24 phenotypes that the Colson 2025 frequency table supports and the entry had omitted (round face, behavioural disorder, bulbous nose, hypertelorism, high palate, epicanthus, synophrys, hair abnormalities, low hanging columella, laterally extended eyebrows, sleep disturbance, gastro-oesophageal reflux, constipation, obesity, short stature, cryptorchidism, microcephaly, autistic behavior, anxiety, Chiari type I malformation, visual impairment, refractive error, clinodactyly of the fifth finger, prominent fingertip pads); phenotype count 26 -> 50. (2) Added frequency bands with a per-phenotype notes: derivation to 42 of 50 phenotypes (was 5 of 26), including ptosis at 20/29 (69%, FREQUENT); the eight without a band each record why in notes:. (3) Added the prevalence: section - Orphanet ORPHA:698090 validated worldwide point-prevalence class <1/1,000,000 (BELOW_1_IN_1000000) plus a CASES_IN_LITERATURE record - and corrected the notes: text that had wrongly claimed no population estimate exists. (4) Added ClinGen dosage sensitivity CGDS:HGNC_14255 (HI score 3, TS score 0, curated 2023-08-23) to the genetic section, plus the 13/17-truncating-allele count; gnomAD pLI/LOEUF deliberately not added because no quotable cached source was available. (5) Resolved the Feeding Difficulties self-contradiction by omitting the band consistently in description, notes and both evidence explanations, since the published denominators straddle bands (12% vs 53-57%). (6) Added the Pitx2/Hmx1/Pax6 ocular-craniofacial intermediate node ('Deregulated Ocular and Periocular Developmental Transcription Factor Programs', mechanism_confidence HYPOTHETICAL) wired in from the transcriptional-program hub and out to Ptosis, Blepharophimosis and Strabismus; pathograph verified as a single connected DAG with one root (13 nodes, no cycles). (7) Added a 'Chromosomal microarray or exome-based copy-number analysis' diagnosis entry sourced to the array-CGH detection of two alleles in Colson 2025 and to the founding series' BRPF1 deletions. Non-blocking items also done: mappings: block with a MONDO exactMatch justified from the Orphanet cross-reference; 3p26-p25 corrected to 3p25.3; BPES differential given distinguishing_features and two GeneReviews-sourced evidence items; a Behavioural and ADHD Management treatment added; two generic NCIT diagnosis terms made specific (Molecular Analysis -> Whole Exome Sequencing, Clinical Evaluation -> Eye Examination); CL granularity increased on the dendritic and hematopoietic nodes. Because the PMID:39837771 reference cache is abstract-only (NCBI PMC returns a restricted record for this Wiley article), body-text quotes are cited against the Europe PMC full-text endpoint url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11973018/fullTextXML, following existing precedent in the repo. Validated with just validate (schema, terms and references all clean; 188/188 snippets verified), just validate-references, just compliance (weighted 98.1%), and an independent normalizing verbatim check over all 188 snippets including the 54 url-prefixed ones (0 failures). scripts/check_snippets_verbatim.py does not exist on this branch or on main, so the equivalent check was run from a local stand-in. The Orphadata and ClinGen-dosage MANIFEST pins were bumped to current upstream snapshots (2026-06-23 and 2026-07-31) because the previous checksums no longer matched; only the two newly required cache records were rebuilt.

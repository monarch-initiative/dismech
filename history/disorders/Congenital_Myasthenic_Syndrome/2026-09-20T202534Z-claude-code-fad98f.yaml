  summary: Enumerate gene-defined CMS subtypes and wire every causal gene into the
    pathograph
  details: |
    Gene-defined subtype enumeration under the CMS umbrella (issue #12225, epic #12189).

    Anchor check first, as the series job requires. The entry's disease_term MONDO:0018940 was re-verified against MONDO before any enumeration: it is the umbrella class, its definition describes the group rather than one disease, and all 23 terms listed in the issue are among its 37 is_a descendants. The anchor is correct and was not changed.

    Curation. Added 23 gene-defined has_subtypes rows (CMS1A, CMS1B, CMS2A, CMS2C, CMS3A, CMS3B, CMS3C, CMS4, CMS5, CMS8-CMS13, CMS17, CMS19-CMS25), each with subtype_term bound to its own MONDO term, a genes descriptor bound to lowercase hgnc, an HPO-bound inheritance block, a mechanism description and exact-quote evidence from the Ohno et al. 35-gene review (PMID:36835142). The four pre-existing NMJ-compartment rows were kept and given classification nmj_compartment, children lists naming their members, and subtype_term bindings where a live MONDO class exists (presynaptic MONDO:0700466, postsynaptic MONDO:0020344); the synaptic and glycosylation grouping classes are obsolete in MONDO with no live replacement, which is recorded in each row's review_notes together with the searches run.

    Added 8 genetic entries that the entry previously named only in prose: COL13A1, SLC5A7, SLC18A3, PREPL, SLC25A1, MYO9A, VAMP1 and SYT2. Added subtype foreign keys to all 22 genetic entries.

    Pathograph. Bound 22 gene descriptors onto pathophysiology nodes, taking the entry's gene-to-mechanism wiring from 0/14 to 22/22. Three new nodes were added because the existing single presynaptic node bundled three mechanistically and therapeutically distinct lesions: Defective SNARE-Mediated Synaptic Vesicle Fusion (SYT2, VAMP1; conforms to the module's Reduced Quantal Acetylcholine Release node), Defective Motor Nerve Terminal Formation (SLC25A1, MYO9A) and Endplate Collagen XIII Deficiency (COL13A1). The pre-existing presynaptic node was narrowed to the acetylcholine supply arm (CHAT, SLC5A7, SLC18A3, PREPL).

    Export-layer measurement. gene_to_edge keys every gene edge on the entry's own disease_term, so the KGX export goes from 14 to 22 gene edges, all at MONDO:0018940, and none of the 23 subtype-bound MONDO terms produces an edge. The curation gap is closed; the export gap (dismech#12316) is not.

    Self-review found three wrong absence claims in the first draft of the prose, all corrected before commit: CMS14 (MONDO:0014543) is curated as a has_subtypes row of ALG2-Congenital_Disorder_of_Glycosylation, CMS18 (MONDO:0014590) is the disease_term of SNAP25_Encephalopathy, and the GMPPB wording had to be narrowed because MONDO:0700084 exists as a GMPPB myopathy class. Only CMS16 (SCN4A, MONDO:0013620) is genuinely absent from kb/.

    Validation: just validate, validate-terms, count-verified-snippets (108/108), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches (67 gene descriptors, 0 mismatches), check-genereviews, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-case-collisions, check-environmental-evidence, compliance-connectivity, normalize-cache, check-term-cache-integrity, validate-disorders.

    Term-to-gene spot check (dismech#12333). Every one of the 23 subtype rows binds both a MONDO term and a gene, so each pairing was checked against three independent sources: MONDO's own textual definition or synonym set, Table 1 of PMID:36835142, and the Monarch v3 CausalGeneToDiseaseAssociation endpoint. All three agree on all 23, and Monarch returns exactly one causal gene per term. No mis-binding was found.

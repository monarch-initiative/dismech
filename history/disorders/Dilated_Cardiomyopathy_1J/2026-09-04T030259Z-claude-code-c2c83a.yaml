  details: |
    Created the EYA4 cardio-auditory dilated cardiomyopathy entry (MONDO:0011541) from the Edison/falcon deep-research report at research/Dilated_Cardiomyopathy_1J-deep-research-falcon.md. The report carried mondo_id: '' (dismech#10335) so just preflight-dr was run manually against MONDO:0011541 and passed (EYA4 mentioned 57 times, report OMIM 605362 matching MONDO's). The report cites 0 PMIDs and ~20 DOIs; every DOI was resolved to a PMID via the PMC ID converter or a PubMed title search before use, so the entry cites PMIDs throughout and no DOI-keyed evidence item exists. References fetched: PMID:10769282 (Schonberger 2000 Circulation, the founding linkage study), PMID:15735644 (Schonberger 2005 Nat Genet, the causal EYA4 4846-bp deletion), PMID:26499333 (Williams 2015, the p27/CK2-alpha/HDAC2 pathway and E193/E215 transgenics), PMID:33301229 (Mi 2021), PMID:30155266 (Abe 2018), PMID:25961296 (Liu 2015), PMID:32277154 (Morin 2020), PMID:39674807 (Sorella 2025 guideline synthesis), PMID:29800419 (Bondue 2018), PMID:20301486 (GeneReviews Dilated Cardiomyopathy Overview). Term-validation catch worth recording: the report proposed HGNC:3518 for EYA4, which is EXTL3; the entry uses hgnc:3522, verified with OAK. HGNC sits in the report's unresolvable_prefixes so its own validator never checked it. The report's four flagged mislabelled HP terms are validator artefacts from reading a table column as a label; all four labels are correct as bound. Deliberately omitted: cardiomegaly, myocardial fibrosis, cardiomyocyte hypertrophy and sudden cardiac death, because the supporting text sits in Circulation 2000 sections the cached abstract does not cover and no exact snippet was available; this is recorded in the entry notes and the pathograph carries no sudden-death edge. ClinicalTrials.gov was queried directly during curation rather than trusting the report: 'EYA4' and 'dilated cardiomyopathy 1J' each returned zero studies, so no clinical_trials block was written and the absence is curated as a KNOWLEDGE_GAP discussion. Two nodes conform to cardiomyopathy_maladaptive_remodeling. Validation run to completion: just validate (61/61 snippets), just validate-terms (passed), just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms plus check-qualifier-terms-online (328 labels matched, 97 resolved online), just check-enum-values, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-environmental-evidence, and just validate-disorders (all passed).

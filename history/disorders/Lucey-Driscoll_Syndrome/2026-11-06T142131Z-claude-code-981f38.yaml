  summary: 'Create: Lucey-Driscoll Syndrome'
  details: |
    De novo curation of transient familial neonatal hyperbilirubinemia (MONDO:0009383) from a Perplexity deep-research report. Grounded entirely on the 2016 review PMID:26595536 using evidence_source: OTHER + quote_role: REVIEW_SYNTHESIS, since the 1960/1965 primary description (PMID:14332157) has no retrievable abstract. Pathophysiology: transient serum-factor inhibition of UGT1A1 -> impaired bilirubin conjugation -> neonatal unconjugated hyperbilirubinemia -> kernicterus. No treatments block (self-resolving; no LDS-specific therapy). notes record that the entity's existence has been questioned since 1960. All terms verified in OLS.

  summary: 'Create: Lucey-Driscoll Syndrome'
  details: |
    De novo curation of transient familial neonatal hyperbilirubinemia (MONDO:0009383) from a Perplexity deep-research report. Grounded entirely on the 2016 review PMID:26595536 using evidence_source: OTHER + quote_role: REVIEW_SYNTHESIS, since the 1960/1965 primary description (PMID:14332157) has no retrievable abstract. Pathophysiology: placental transfer of a maternal serum inhibitor -> transient UGT1A1 inhibition -> impaired bilirubin conjugation -> neonatal unconjugated hyperbilirubinemia -> kernicterus. treatments block carries the review's Lucey-Driscoll-specific recommendations: close monitoring in the first two weeks, aggressive phototherapy (NCIT:C15301) and possible exchange transfusion (NCIT:C15192), each linked to the hyperbilirubinemia node. genetic UGT1A1 relationship recorded as UNKNOWN (not CAUSATIVE), since the review's table gives the defect as placental transfer of a maternal inhibitor and no germline variant is demonstrated. notes record that the entity's existence has been questioned since 1960 and that category: Mendelian is a MONDO/OMIM nosological placement. Round 2 added the treatments block, the maternal-transfer upstream node, and the genetic downgrade in response to review. All terms verified in OLS/runoak.

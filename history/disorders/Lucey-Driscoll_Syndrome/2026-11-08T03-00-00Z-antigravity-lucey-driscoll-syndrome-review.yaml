  summary: Enriched Lucey-Driscoll syndrome with Harrison's classifications, anatomical/subcellular pathophysiology grounding, neonatal serum bilirubin monitoring, and treatment evidence.
  details: Added GASTROINTESTINAL and ENDOCRINOLOGY_METABOLISM Harrison's chapter classifications backed by PMID:26595536. Grounded pathophysiology nodes with placenta (UBERON:0001987) and liver (UBERON:0002107) anatomical locations, endoplasmic reticulum membrane (GO:0005789) cellular component with supporting UGT1A1 localization evidence, and bilirubin conjugation (GO:0006789) biological process. Added neonatal serum bilirubin monitoring bound to LOINC:LP15448-1 in diagnosis, marked neonatal unconjugated hyperbilirubinemia as diagnostic, and added non-duplicative summary-table evidence to phototherapy and exchange transfusion treatments.

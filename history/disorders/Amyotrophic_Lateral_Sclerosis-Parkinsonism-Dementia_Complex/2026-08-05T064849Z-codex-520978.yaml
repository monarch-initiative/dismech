  summary: 'Review: publication readiness for Guam ALS-PDC'
  details: |
    Full publication-readiness review against primary and review literature.
    Added the 1940-1999 incidence trajectory; qualified chromosome 12p and
    MAPT-region susceptibility signals; explicit C9orf72 and LRRK2 negative
    evidence; TDP-43 localization, CTE-fold tau structure, and current
    tau-seeding evidence; supranuclear ocular-motor and retinal findings; three
    clinical differentials; limited early levodopa response; washed-cycad,
    BSSG, and vervet models; and a one-case/one-control iPSC neural resource.

    Separated BMAA, sterol-glucoside, and TRPM7/mineral hypotheses; corrected
    cellular bioassays to IN_VITRO; and documented unresolved etiology,
    model-to-human translation, premortem biomarkers, and disease-modifying
    treatment/trial gaps. Kii and West Papua remained comparison entities, and
    Kii-only C9orf72 and tau-imaging findings were excluded. A D2P
    cerebral-atrophy lead was rejected because its cited PMID was a Kii C9orf72
    paper, not Guam phenotype evidence.

    Audited exact snippets, reference metadata, polarity, study type, ontology
    bindings, population and model scope, and causal graph targets. All new
    reference caches were created only with just fetch-reference. The raw deep
    research working artifact was not retained because its unpromoted leads did
    not satisfy curated citation/found_in coverage.

    Automated review follow-up added subtype-specific ALS and PDC onset estimates;
    PDC bradykinesia, dysarthria, dysphagia, and mask-like facies; corticobasal
    degeneration and Lewy body dementia differentials; and the direct conflict
    between an all-patient ocular examination series and a review describing
    ocular motility as usually intact. The ocular binding was broadened to
    Abnormality of eye movement, current tau-seeding evidence was disclosed as a
    PubMed-indexed bioRxiv preprint, and two unsupported standalone hypothesis
    declarations were removed rather than given speculative causal edges; their
    genetic and animal-model evidence remains in the appropriate sections.

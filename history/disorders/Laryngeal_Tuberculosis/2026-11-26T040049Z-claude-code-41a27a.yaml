  summary: 'Create: Laryngeal_Tuberculosis'
  details: |
    New entry for laryngeal tuberculosis (MONDO:0005819), created from the stub. Sources: PubMed case series of laryngeal tuberculosis (49, 134, 61, 39, 36, 24 and 15 patients; a 103-patient primary vs secondary comparison), a 119-article structured literature review, a Japanese registry comparison of laryngeal and bronchial TB transmissibility, an outbreak investigation, and a South African prospective diagnostic series. The deep-research report research/Laryngeal_Tuberculosis-deep-research-claude_code.md (second run; the first run was marked unsuccessful and deleted) was used as leads only; preflight-dr returned SKIP (no causal gene). Primary and secondary laryngeal TB are recorded as has_subtypes because one series compared them directly and reported different lesion patterns; organism strata are deliberately lumped. Pathophysiology runs from sputum-borne or direct inhalational seeding through caseating granulomatous laryngitis (conforms to granuloma_formation#Organized Granuloma Assembly) to vocal fold infiltration, ulceration, exophytic hyperplasia, luminal narrowing, bacillary shedding and scarring. Validated with just validate, count-verified-snippets, validate-terms and validate-disorders.

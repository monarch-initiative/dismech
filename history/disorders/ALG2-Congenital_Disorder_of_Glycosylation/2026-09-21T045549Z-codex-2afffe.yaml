  summary: Review ALG2-CDG clinical spectrum, full-text evidence and causal models
  details: |
    Reviewed the entire entry against all eleven original cited publications,
    matching deep research, recovered primary full texts and GeneReviews.
    Recovered the complete 2013 congenital-myasthenia article, institutional
    full PDFs of the Argentinean and Swedish reports, and the complete CMS
    GeneReviews and retired CDG GeneReviews chapters through sanctioned
    reference fetching. Read relevant clinical, diagnostic and care sections
    of the broad CMS review, and the complete available mechanistic, cellular,
    Mexican case and GLM101 articles. Independent peers read the medaka study
    in full and audited the Argentinean clinical table. The founding 2003
    report and 2014 myasthenia report remained abstract-only; their claims
    are restricted to those abstracts. The retired CDG chapter is explicitly
    historical, and general CMS recommendations are distinguished from
    ALG2-specific observations.

    Rebuilt the graph as eight atomic nodes separating allele effects,
    protein abundance, catalytic activity, lipid-linked oligosaccharide
    assembly, protein hypoglycosylation and altered glycan structures.
    Updated membrane topology from the 2022 primary enzymology study and
    removed unsupported protein-stability, ER-stress and broad organ-damage
    bridges. The 2013 acetylcholine-receptor knockdown experiment concerns
    ALG14, not ALG2, and is no longer used as direct ALG2 evidence. Unknown
    glycoprotein intermediates between glycosylation and neuromuscular
    transmission remain explicit. Medaka rod-cell loss is experimental and
    is not used to assert a human retinal phenotype or human onset clock.

    Reconciled 53 phenotypes with patient-level reports, added diagnostic,
    respiratory, ophthalmic, nutritional and developmental detail, and
    removed unsupported disease-wide frequency bands and penetrance claims.
    Preserved mixed central and peripheral presentations, variable serum
    transferrin findings and treatment responses. Corrected the Argentinean
    caption's de-novo implication using parental segregation in Results;
    three patients represent two families, and grouped ocular observations
    are not converted into individual counts. The Mexican missense VUS is
    not independently reclassified from combined patient-cell findings.

    Separated one whole-animal model and five cellular models. Preserved
    the medaka study's single human fibroblast line, partial prophylactic
    rescue, nonsignificant proteomic pathway enrichments and distinction
    between protein abundance and degradation. GLM101 evidence is confined
    to short-term cellular glycopeptide changes in three ALG2 donors, with
    no clinical efficacy or brain-delivery claim. Added symptomatic care
    and claim-local therapeutic joins while leaving monitoring and genetic
    counseling without therapeutic graph edges.

    Validated the complete disorder and the sole other consumer of the
    regenerated PMID:23404334 cache with schema, live ontology and exact
    snippets: 201/201 supporting spans passed. All 25 repository quality
    guards passed, as did phenotype-connectivity and node-example integrity
    checks and validation of 11,282 history records. Peer integration review
    found no remaining major mechanism or clinical contradiction; its
    wording refinements and symptomatic treatment joins were incorporated.

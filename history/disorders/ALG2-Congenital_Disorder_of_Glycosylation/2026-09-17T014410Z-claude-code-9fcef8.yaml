  summary: 'Review round 1: re-parent coloboma, correct three frequencies against
    Table 2, add three phenotypes'
  details: |
    Addresses the REQUEST_CHANGES review of ebe65434 (run 35152444026). All five blocking findings shared one cause the review identified correctly: PMID:38770420 is quoted six times in this entry and its Table 2, which gives published per-feature denominators, was never consumed.

    Finding A, a developmentally impossible causal edge. Photoreceptor Maintenance Failure pointed at Iris coloboma. Coloboma is a failure of optic fissure closure in the embryo, not a consequence of progressive rod loss, and the node's own description already said the established human eye features are developmental and not degenerative. The entry contradicted itself inside one node. Coloboma is re-parented onto the developmental branch under Protein Hypoglycosylation, alongside the neuromuscular, neurodevelopmental and hepatic branches, with INDIRECT_UNKNOWN_INTERMEDIATES because which glycoprotein's hypoglycosylation keeps the fissure open is unknown.

    Finding B. With that edge gone the photoreceptor node has no inbound and no outbound human edge. It is now explicitly model-only in its description, which also records why wiring it in either direction would assert the translational claim the HUMAN_MODEL_MISMATCH discussion exists to hold open.

    Finding C, three overstated frequencies. Seizures, global developmental delay and axial hypotonia were VERY_FREQUENT, meaning 80 to 99 percent. Table 2 gives 4/14, 10/14 and 9/14. All three are now FREQUENT and each carries the Table 2 row as an evidence snippet, so the denominator is in the record rather than inferred. The hypotonia row counts hypotonia generally while this entry curates axial hypotonia, and the explanation says so.

    Findings D and E, plus the non-blocking row. Added Nystagmus (HP:0000639), Congenital hip dislocation (HP:0001374) and Predominantly proximal muscle weakness (HP:0003701). Proximal weakness at 10/14 ties with developmental delay as the most frequent feature of the disorder and was unmodeled.

    The review suggested HP:0003285 for congenital hip dislocation. That CURIE does not exist: OLS returns 404 for it. The correct term is HP:0001374, which is in the committed cache and matches the source's wording exactly. Nystagmus carries no frequency because the only published denominator pools coloboma, strabismus and nystagmus in one ocular row at 2/14, so no nystagmus-specific figure exists.

    Non-blocking correction to the PR body. check-genereviews reports CITED_UNTAGGED rather than NO_CHAPTER, because the retired N-linked glycosylation chapter's PMID appeared in notes in the sentence explaining that it is not cited. The checker matches identifiers anywhere in the file and cannot distinguish a citation from a mention that denies citing. The chapter is now named by title alone, the check reports TAGGED, and notes records both the reason and the accurate claim, which is that no ALG2-specific chapter exists rather than that the checker returns NO_CHAPTER.

    One defect I introduced and caught before pushing: inserting the two new edges between an existing edge's causal_link_type and its description produced a duplicate description key, which DuplicateKeyError caught on the first validation run. This is the merge-shaped defect CLAUDE.md describes, arrived at by hand rather than by merge.

    Validation: just validate passed with 57/57 snippets verified, up from 49/49. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-genereviews, check-snippet-length, check-title-snippets and check-snippet-grading all OK.

    Created kb/disorders/ALG2-Congenital_Disorder_of_Glycosylation.yaml (MONDO:0011933) as a new per-gene CDG entry, following the established <GENE>-Congenital_Disorder_of_Glycosylation shape. Deep research: Perplexity sonar-deep-research (reasoning_effort medium, 361s). just preflight-dr PASS (ALG2 mentioned 123 times; report OMIM set includes MONDO's 607906). The report's term validation reported needs_review true with 21 of 52 checked labels mismatched, including HP:0002063 offered as 'hypomyelination' (HPO: Rigidity) and HP:0000514 as 'coloboma of iris' (HPO: Slow saccadic eye movements); no CURIE was taken from the report. Every ontology term was resolved independently against the committed caches or OLS, and every evidence snippet was derived by hand from cached PubMed abstracts, not from the report. CMS14 (MONDO:0014543) curated as has_subtypes rather than a separate file. One HUMAN_MODEL_MISMATCH discussion records that the medaka model's retinitis pigmentosa has no human counterpart. Validated: just validate (49/49 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms.

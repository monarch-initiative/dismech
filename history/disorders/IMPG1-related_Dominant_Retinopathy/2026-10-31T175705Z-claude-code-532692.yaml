  summary: 'Create: IMPG1-related Dominant Retinopathy'
  details: |
    Created the dominant IMPG1 retinopathy entry (MONDO:1040036), the ClinGen Definitive monoallelic IMPG1 disease, as the complement to IMPG1-related_Recessive_Retinopathy (MONDO:1040037). Scoped as the mechanism-centered dominant entity spanning dominant adult-onset vitelliform macular dystrophy (p.Leu238Arg, SEA1 domain), benign concentric annular macular dystrophy (p.Leu579Pro, MONDO:0007934, bound as a subtype), and dominant retinitis pigmentosa; the dominant-negative matrix mechanism (not a null) distinguishes it from the recessive biallelic-LOF entity. The VMD4/AOFVD overlap is recorded in notes with a skos:broadMatch mapping. Curated from the primary literature cached in references_cache (Manes 2013 PMID:23993198 founding dominant families + dominant-negative hypothesis; Khan 2017 PMID:28644393 second codon-238 allele; Olivier 2020 PMID:32817297 dominant RP and BCAMD reclassification; Olivier 2022 PMID:36140676 and Salido 2020 PMID:32265257 Impg1 knockout mice; Kuehn 1999 PMID:10601738; organoid PMID:29777959) plus ClinGen dominant CGGV assertion. Two discussions: a HUMAN_MODEL_MISMATCH noting the LOF mouse/medaka models do not test the dominant-negative allele, and a KNOWLEDGE_GAP on VMD-vs-RP presentation. Deep research requested as falcon, which is unavailable in this environment; run relaunched with --fallback (falling back to openscientist) and its findings to be reconciled before the PR. Validated: just validate / validate-disorders (30/30 snippets verified, 0 issues), validate-terms, entity-refs, causal-targets, logical-rules, coarse-phenotypes, qualifier-terms, duplicate-keys, enum-values, delivery-system, shared-disease-terms, snippet-grading, gene-term-mismatches all clean; phenotype causal connectivity 5/5; GeneReviews NO_CHAPTER confirmed offline.

  summary: 'Genetics pass: wire the bone-disease endpoint to its phenotypes'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The pathograph terminated at Multifocal Relapsing Bone Disease with no outgoing edge, so none of the five phenotypes had an incoming causal edge. Sterile Osteoinflammation now reaches the Osteomyelitis phenotype, and Multifocal Relapsing Bone Disease reaches bone pain and vertebral compression fracture; phenotype causal inlink 0/5 to 3/5. The two extraosseous phenotypes, inflammatory bowel disease and severe acne, are deliberately left unwired, as the existing phenotype descriptions already argued: the source gives them as comorbid conditions at 10% each and does not state that the bone disease or the monocyte cytokine imbalance produces them. FBLIM1 remains unwired (0/1) and the entry notes now say precisely why: a wired gene should land on a node naming the molecular activity it disrupts, and the sources here give FBLIM1 a hedged regulatory role in RANKL activation rather than a molecular activity, locating the variants in the filamin-binding domain without establishing which activity they abolish. The series row MONDO:0012316 Majeed syndrome needed no curation: it is a separate Disease entry in this repository, and it was additionally a differential_diagnoses row here that named the disease and gene but bound no CURIE, which is why a CURIE grep of the gap list missed it. That row now binds MONDO:0012316, so the concept is machine-visible from this parent. Validation on the committed tree: just validate 0 issues, validate-terms passed, 31/31 snippets verified.

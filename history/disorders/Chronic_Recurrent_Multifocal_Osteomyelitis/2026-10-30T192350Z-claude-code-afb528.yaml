  summary: Replace retired Majeed GeneReviews chapter with its current successor
  details: |
    The Majeed syndrome differential quoted the retired GeneReviews chapter 'Majeed Syndrome' (PMID:20301735). Replaced that evidence item with two quotes from the current chapter, 'LPIN2-Related Majeed Syndrome' (PMID:36877799): its clinical-characteristics sentence (osteomyelitis with dyserythropoietic anaemia) and its statement that anti-IL-1 therapy is the drug of choice, which supports the differential's existing treatment-response feature. The notes paragraph on the GeneReviews search now names both chapters. evidence_source HUMAN_CLINICAL, matching Majeed_Syndrome's grading of the same chapter. Snippets verified with just count-verified-snippets.

    The retired chapter's sentence had also been the only source for the differential's "early onset with a lifelong course" and congenital-anaemia features, which the current chapter's abstract does not state. Added two quotes from PMID:23087183 (Herlin et al., anti-IL-1 treatment in Majeed syndrome) for those points, both from its introduction and so graded quote_role BACKGROUND with evidence_source HUMAN_CLINICAL.

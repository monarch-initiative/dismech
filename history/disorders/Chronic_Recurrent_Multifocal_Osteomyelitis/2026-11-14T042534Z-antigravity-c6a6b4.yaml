  summary: 'Review and enhance: Chronic Recurrent Multifocal Osteomyelitis'
  details: |
    Added MONDO/Orphanet synonyms (including CNO, CNO/CRMO, CRMO, NBO), Harrison's IMMUNE_RHEUMATOLOGIC classification, and Orphanet-backed annual incidence and point prevalence records (ORPHA:324964). Enriched pathophysiology nodes with monocyte and osteoclast CL bindings, metaphysis and bone element UBERON locations, and inflammasome/inflammatory/bone-resorption GO processes; added causally wired Hyperostosis, Osteolysis, and Arthritis phenotypes; added Bone Biopsy diagnosis (NCIT:C15189); added therapeutic_agent and target_mechanisms on NSAID and Escalation Therapy; and resolved strict GeneReviews baseline validation by tagging PMID:36877799 in references and removing the uncached retired Majeed PMID from notes.

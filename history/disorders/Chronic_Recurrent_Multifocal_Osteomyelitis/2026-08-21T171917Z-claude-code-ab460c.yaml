  summary: 'Fix wrong-disease TNF evidence; add phenotypes and genetic section (PR
    #9188 review)'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #9188.

    CRITICAL - evidence attributed to the wrong disease. The snippet "TNFa blockers have almost no effect" from PMID:29080202 was curated against sporadic CNO/CRMO as a REFUTE item, but that sentence sits inside the review's monogenic-syndromes section and is about Majeed syndrome. The same paper reports the opposite for sporadic disease: "treatment with pamidronate or anti-TNF agents has been reported to be highly effective in a significant percentage of CNO/CRMO patients". This is the #7791 failure mode - real PMID, byte-exact snippet, wrong claim - so no validator could catch it.

    Fixed all four dependent locations. Removed the REFUTE item from Escalation Therapy and replaced it with the correct CNO efficacy quote plus a corticosteroid escalation quote. Rewrote the Escalation Therapy description, which had asserted the asymmetry as a property of sporadic disease. Rewrote the KNOWLEDGE_GAP prompt and rationale, both of which were built on "why does TNF blockade fail"; the gap is now framed on the real contrast, that the monogenic mimics have a single defined cytokine dependency while sporadic CNO has no such signature. Rewrote the proposed-experiment premise to match, and made the prospective design its explicit point.

    Relocated the salvageable correct claim to the Majeed syndrome differential as a distinguishing feature, with its own evidence item whose explanation records why the sentence belongs there rather than on sporadic CNO.

    Review item 3 - split Bisphosphonate Therapy out of the bundled Escalation Therapy node, with a CHEBI-bound pamidronate therapeutic_agent and a target_mechanisms INHIBITS link to Sterile Osteoinflammation.

    Review item 1 - added three phenotypes quotable from references already cached in this PR: vertebral compression fracture from PMID:33870159, and inflammatory bowel disease and severe acne from PMID:29080202. The latter two carry an explicit 10 percent denominator, banded OCCASIONAL; the fracture sequela has no denominator, so no frequency is asserted.

    Review item 2 - added the missing genetic section: FBLIM1 as SUSCEPTIBILITY and IL10 as MODIFIER, both from the already-cached PMID:29080202. FBLIM1 is curated as SUSCEPTIBILITY rather than causal because two unrelated probands is not an established Mendelian cause. A note on the IL10 record records the unresolved tension between the entry's DECREASED cellular IL-10 node and the cohort's over-representation of high-expression germline promoter haplotypes, and flags the review's own reconciliation as the unconfirmed hypothesis it is labelled as there.

    No new references were fetched; everything used was already in references_cache in this PR.

    Validation run. just validate: schema, term and reference validation all passed, 0 issues. just count-verified-snippets: 28/28 verified against cached references. just check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence: all OK, no new findings.

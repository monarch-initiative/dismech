  summary: 'Create: Chronic Recurrent Multifocal Osteomyelitis (CNO/CRMO)'
  details: |
    New entry for chronic nonbacterial osteomyelitis / chronic recurrent multifocal osteomyelitis (MONDO:0009813), a sterile autoinflammatory bone disease of children. Category Complex, not Mendelian: no causal gene is established for sporadic disease, and the monogenic diseases in which CRMO appears (Majeed syndrome, IL1RN deficiency) are curated as differentials rather than subtypes. Deep research: claude_code provider; report resolved 31/31 references at confabulation_rate 0.0 with 26 of 31 weighed on topic and none flagged off topic. Reference set assembled by direct PubMed search. GeneReviews: a search returns exactly one chapter, PMID:20301735, which was fetched and READ rather than assumed - it is Majeed Syndrome, a different monogenic disease in which CRMO is one feature, and it is additionally marked RETIRED CHAPTER FOR HISTORICAL REFERENCE ONLY. It is therefore NOT used as a phenotype baseline; it is cited once in the Majeed differential for a definitional statement, with its retired status recorded both there and in notes. Four pathophysiology nodes from innate immune signalling dysregulation through monocyte cytokine imbalance to sterile osteoinflammation and multifocal relapsing disease. The cytokine imbalance node curates both directions - increased IL-1 beta and decreased IL-10 - because the disease behaves as a failure of restraint rather than a response to a stimulus. Curated the 2025 EULAR/ACR classification criteria as a definitions entry with definition_type PHENOTYPE_ALGORITHM, derivation_basis ESTABLISHED_CRITERIA and validation_status VALIDATED_AGAINST_GOLD_STANDARD, recording development in 441 patients and validation in a separate 514-patient cohort at 82 percent sensitivity and 98 percent specificity, and noting explicitly that classification criteria are not diagnostic criteria. Recorded the reported failure of TNF-alpha blockade as a REFUTE evidence item rather than omitting it, because a negative therapeutic result constrains any mechanistic account, and carried that constraint into the KNOWLEDGE_GAP on the unresolved molecular pathophysiology. Dual identity recorded in notes: MONDO:0009813 carries xref HP:0002754, so the concept has both disease and phenotype identifiers; it is curated as a Disease while HP:0002754 is used separately for the bone lesions. No frequency bands assigned. Validated: just validate passed; just validate-terms passed; count-verified-snippets 19/19; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

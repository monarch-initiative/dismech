  summary: 'Review round 1: reconnect pathograph, specific cell type, animal model'
  details: |
    Addresses the CHANGES_REQUESTED review on PR #10896. (1) Reconnected the pathograph: added a downstream edge from LDHA Loss and Muscle Lactate Dehydrogenase Deficiency to Epidermal and Follicular Glycolytic Failure (drawn from the enzyme null itself, not from the skeletal-muscle ATP-deficit node, so no keratinocyte ATP mechanism is asserted); added Exercise intolerance as a downstream target of Abortive Glycolysis and Muscle ATP Deficit; added a sequelae edge from Myoglobinuria to Acute kidney injury. Every node except the root now has an incoming edge. (2) Replaced CL:0000192 smooth muscle cell with CL:0002601 uterine smooth muscle cell on Uterine Smooth Muscle Energy Failure. (3) No deep-research provider is reachable in this environment and CLAUDE.md forbids hand-writing files into research/, so the sweep was manual against PubMed: 25 hits for the disease name variants, 8 for LDHA deficiency with a myopathy term, and a separate search for Ldha-deficient mouse models. Confirmed no GeneReviews chapter exists for GSD XI. (4) Recorded in the uterine phenotype notes that HPO was searched and has no term for myometrial pain, uterine stiffness or labour dystocia, flagging it as an NTR candidate; the nearest terms are HP:0100718, HP:0000139 and HP:0011413. (5) The sweep found PMID:42465323, a Drosophila Ldh-null model that reproduces the exertion-dependent phenotype; added it as the entry's first animal_models entry with a PARTIALLY_RECAPITULATES link to Abortive Glycolysis and Muscle ATP Deficit, two readouts, and limitations covering the single-LDH fly enzyme, the non-muscle-autonomous rescue result and the lethality endpoint. Recorded that it is a preprint, and that no mouse model of GSD XI exists. Validated with just validate, validate-terms, count-verified-snippets (51/51), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms and validate-disorders.

  summary: Bind post-exercise lactate and pyruvate to the forearm exercise test
  details: |
    LOINC Diagnostics tranche G, batch 27 (functional and provocative tests with diagnostic thresholds). Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows at all. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 435 snippets and 466 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:59849-0 (lactate post exercise) and LOINC:58895-4 (pyruvate post exercise) to the forearm exercise test row. Two of the three analytes the row names are codeable, and they are the pair that carries the discrimination: a steep pyruvate rise against a flat lactate curve is what separates this terminal glycolytic block from a glycogenolytic one. The ammonium limb has nothing to bind to, by the same enumeration recorded on the myoadenylate deaminase entry in this batch - no challenge-qualified ammonia code in the release, four unqualified ammonia Parts in the KG. The two bound codes disagree on specimen and unit, blood in milligrams per decilitre against serum or plasma in millimoles per litre; that is LOINC's own shape and the release has no matching pair, so it is disclosed on the row. No reference range was added: the row's figures are multiples of each patient's own baseline, around 25 to 30 times against a normal 5 to 10, which is a within-patient ratio and not a value on either bound scale.

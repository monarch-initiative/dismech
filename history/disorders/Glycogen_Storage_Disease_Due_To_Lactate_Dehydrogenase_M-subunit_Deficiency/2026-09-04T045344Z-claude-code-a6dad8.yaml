  summary: 'Create: Glycogen Storage Disease Due To Lactate Dehydrogenase M-subunit
    Deficiency (MONDO:0013047)'
  details: |
    New Disease entry for LDHA (lactate dehydrogenase M-subunit) deficiency, numbered GSD XI. Pathograph: biallelic LDHA null alleles -> loss of cytosolic NADH reoxidation at the glyceraldehyde-3-phosphate dehydrogenase step -> abortive glycolysis and anaerobic ATP deficit, with a parallel glycerol-3-phosphate dehydrogenase shunt node that the literature proposes as the severity modifier; downstream tissue nodes for exertional myocyte injury, epidermal and follicular glycolytic failure, and uterine smooth muscle energy failure. Eleven references fetched with just fetch-reference; 48/48 evidence snippets verified against the cache. Named Entity Confusion guard: 'GSD XI' also denotes Fanconi-Bickel syndrome (SLC2A2), and one candidate reference found during the literature sweep (PMID:37910600, dapagliflozin) turned out to be about that disease and was discarded rather than cited; the conflict is recorded in the entry notes and in a differential. Frequency bands carry explicit numerator/denominator notes and are coarse because the whole literature is about 14 families. Two discussions record open questions: the mechanism linking the enzyme defect to psoriasiform skin disease, and whether glycerol-3-phosphate dehydrogenase capacity really is the severity modifier. Validated with just validate, validate-terms, count-verified-snippets, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms and validate-disorders.

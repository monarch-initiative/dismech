  summary: 'Genetics pass: bind PPNAD1-4 subtype terms and wire PDE11A, PDE8B, PRKACA
    into the pathograph'
  details: |
    Genetics pass for issue #12261 (d2g series-054). Verified the parent anchor
    first: MONDO:0015999 primary pigmented nodular adrenocortical disease is the
    concept this entry models, and the four MONDO classes the gap list attributes to
    it are its direct children, so no anchor change was needed.

    The four has_subtypes rows PPNAD1 to PPNAD4 already existed with genes and
    evidence but carried no subtype_term. Bound each to its MONDO child class:
    PPNAD1 MONDO:0012509 (PRKAR1A), PPNAD2 MONDO:0012505 (PDE11A), PPNAD3
    MONDO:0013616 (PDE8B), PPNAD4 MONDO:0014359 (PRKACA). Added reciprocal
    genetic[].subtype foreign keys, relationship_type: CAUSATIVE and variant_origin:
    GERMLINE on all four genetic records, and HP:0000006 autosomal dominant
    inheritance bindings on PPNAD1, PPNAD2 and PPNAD4 with cited evidence.

    Wired the three previously unwired genes into the pathograph with two new
    upstream nodes: Phosphodiesterase Loss and Impaired cAMP Degradation, carrying
    PDE11A and PDE8B with GO:0006198 cAMP catabolic process DECREASED; and PRKACA
    Copy-Number Gain and Constitutive PKA Catalytic Activation, carrying PRKACA with
    GO:0034199 activation of protein kinase A activity INCREASED. Both point at the
    existing Autonomous Steroidogenesis and Adrenocortical Hyperplasia node, which
    is where the three genetic routes converge. Gene-to-mechanism wiring moved from
    1/4 to 4/4.

    No phenotype had a causal inlink. Added four edges from the convergence node to
    the phenotypes the sources support: ACTH-independent Cushing syndrome, increased
    circulating cortisol, pigmented micronodular adrenocortical disease and
    decreased circulating ACTH. Phenotype connectivity moved from 0/10 to 4/10. The
    remaining six (osteoporosis, hypertension, weight gain, diabetes, short stature,
    spotty skin pigmentation) were left unwired because no source read for this pass
    states the edge; the systemic consequences of hypercortisolism appear only as
    co-occurring findings in individual case reports.

    PPNAD3 carries no inheritance pattern, and its review_notes records the three
    PubMed searches run for a PDE8B family study and what they returned. The one
    pedigree study among them, PMID:25146409, sequenced PDE8B alongside PRKAR1A,
    PDE11A and CTNNB1 and found the causative variant in PRKAR1A. PDE11A is graded
    CAUSATIVE with the variable-penetrance caveat recorded in its notes, because the
    gene was originally described as a low-penetrance predisposing factor.

    Added the GeneReviews Carney Complex chapter (PMID:20301463) as the PRKAR1A
    baseline in a new references block tagged GeneReviews; there is no GeneReviews
    chapter for PPNAD itself, and check-genereviews now reports the entry as TAGGED.

    Orphanet could not be consulted: no ORPHA cache file exists for this disease in
    the repository. The committed ClinGen gene-validity download has one PRKAR1A row,
    for Carney complex type 1 (MONDO:0008057, AD, Definitive), and no row for PDE11A,
    PDE8B, PRKACA or for PPNAD as a disease.

    Validation: just validate passed with 0 issues, just validate-terms passed,
    count-verified-snippets 65/65, list-gene-term-mismatches --resolve reported 0
    findings with full coverage, and the whole-repo gates listed in CLAUDE.md all
    returned OK. Run under linkml-reference-validator 0.3.0rc3.

  summary: 'Review round 1: restore an explanation orphaned by an evidence-list insertion'
  details: |
    Review round 1 on PR #12919.

    Blocking finding, repaired: the PMID:39006359 evidence item under
    has_subtypes[PPNAD1] lost its explanation when two GeneReviews items were
    inserted after it, and the explanation that followed the item afterwards
    belonged to the newly inserted PMID:20301463 item instead. The original text,
    "Establishes PRKAR1A as the most common pathogenic gene among tested PPNAD
    patients.", is restored on the item it belongs to. No gate could see this:
    explanation is optional, so a missing one is valid, and the count of
    explanations in the file rose rather than fell because items were added.

    Swept both entries for the same defect afterwards by parsing the origin/main
    and branch versions and comparing every evidence item keyed on reference plus
    snippet. All 28 pre-existing items in the FCS entry and all 42 in this one are
    present with their fields unchanged, no item on the branch lacks an
    explanation, and no pre-existing pathophysiology, phenotype, genetic,
    has_subtypes, treatment, dataset or prevalence record was dropped. This was the
    only instance.

    Also in this round: reworded one causal-edge description that said reported
    PRKACA-duplication index cases "required" adrenalectomy, where the cited
    snippet says they "underwent" it.

    Declined one optional suggestion, with reason: modelling the cortisol negative
    feedback as a phenotypes[].sequelae link from Increased circulating cortisol to
    Decreased circulating ACTH, rather than as the present
    INDIRECT_KNOWN_INTERMEDIATES edge from the pathophysiology node. The existing
    edge already states that it is indirect and names the intermediate in its
    description, so the change is a pathograph modelling improvement rather than a
    correction, and it belongs in a pass whose subject is the pathograph.

    Validation after the round: just validate 0 issues, just validate-terms passed,
    count-verified-snippets 65/65 for this entry and 123/123 across both, and the
    per-file and whole-repo gates in CLAUDE.md all returned OK. Run under
    linkml-reference-validator 0.3.0rc3.

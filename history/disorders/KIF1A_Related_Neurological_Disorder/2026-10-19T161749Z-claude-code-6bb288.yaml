  summary: Antisense oligonucleotide detail from OpenScientist deep research
  details: |
    Enriched the antisense oligonucleotide content after two OpenScientist deep-research runs: the standard disorder report (research/KIF1A_Related_Neurological_Disorder-deep-research-openscientist.md) and a drug-mechanism report on nL-KIF1-001 (research/drug_mechanism/). Added to the existing nL-KIF1-001 treatment: n-Lorem Foundation attribution, the rs7578279 phasing and 468-gapmer screen behind its allele selectivity, stable CSF neurofilament light chain, and the authors' statement that intrathecal delivery will not reach optic nerve atrophy. Added a second treatment for the preclinical polymorphism-targeted ASO strategy (PMID:41513671), including an item recording that every ASO tested also knocked down the non-targeted allele, so selectivity is relative rather than absolute. Added an experimental_models record for the patient-derived iPSC glutamatergic neurons in which the ASO mechanism was tested, with two typed divergences and two readouts. Added a KNOWLEDGE_GAP discussion, kand_aso_target_engagement_unmeasured, for the absence of in-patient target-engagement measurement, with two proposed experiments. Added a notes sentence recording why these treatments are not conformed to the antisense_oligonucleotide_therapy module. The drug-mechanism report concluded the entry mis-attributes the drug's mechanism; that reading is incorrect, because target_mechanisms names the pathophysiology node a treatment acts on rather than the drug's mode of action, so no correction was made. Of the report's two validation flags, PMID:30778698 did not resolve during the run but fetched cleanly on retry and is not cited here; PMID:42587136 was flagged off topic, was read, is genuinely about KIF1A prime editing, and was not cited because it is gene editing rather than ASO. A pre-PR self-review in fresh context corrected several things here. The non-targeted-allele item was graded REFUTE and is now SUPPORT: the treatment's own description already states that selectivity is relative, so the quote supports that record rather than contradicting it, and no strict-selectivity claim exists in it to refute. Three evidence_source values moved off OTHER to HUMAN_CLINICAL, since each quotes human patient data: the allelic-heterogeneity sentence (with quote_role BACKGROUND, as Introduction prose restating the established spectrum), the four-polymorphism eligibility result (with PRIMARY_RESULT), and the long-read phasing of the treated patient's own genome. The optic-atrophy sentence moved the other way, from HUMAN_CLINICAL to OTHER, because it is the authors' expectation from the route of administration rather than a measurement. quote_role BACKGROUND was added to the dimerization rationale. Four prose claims were corrected: the experimental_models description had said this was the only model in which the ASO mechanism had been tested, which the entry's own fibroblast evidence contradicts, so it now says the only neuronal model; the new treatment had said no patient has been treated on this strategy, which is wrong because nL-KIF1-001 also targets a common polymorphism, so it now says neither rs1063353 ASO has been given to a patient and the description names the real contrast, pre-selected reusable reagents against a bespoke screen; "gapmers" was replaced with "antisense oligonucleotides" because PMID:41513671 states no chemistry for its own ASOs; and "the only molecular measure reported" was narrowed to the one disease-related measure, since the study also ran safety laboratory tests. The proposed experiment's claim that the paper reports CSF bioanalysis was replaced, as that word implies drug-level measurement the paper does not report, and the gap rationale's literature-wide negative about control-ASO experiments was narrowed to what the two ASO papers report. The 468-gapmer screen figure, previously an uncited description claim, is now carried by its own quoted item. Left unchanged: the experimental_models link stays relationship MEASURES rather than gaining a second RESCUES link, because what rescues the phenotype is the ASO rather than the model, and the RESTORED readout already records the rescue arm.

    Review round 1 corrected a factual error introduced by the pre-PR self-review itself. The experimental_models description said nL-KIF1-001's selectivity was established in patient fibroblasts, which carry no neuronal phenotype, and that this iPSC model is therefore the only neuronal model in which the ASO mechanism has been tested. The cached full text of PMID:39122967 says potency and allele-selectivity were determined in iPSC-derived neurons from the patient's fibroblasts, so the fibroblasts were the reprogramming source and not the assay system; the entry's own Figure 1B evidence item already recorded this correctly. Both halves of the sentence were wrong, and the self-review that introduced them justified itself by appealing to fibroblast evidence elsewhere in the entry, which does not exist: the only fibroblast mention in the file was the one that correction wrote. The description now states that nL-KIF1-001's selectivity was established in iPSC-derived neurons reprogrammed from the patient's fibroblasts as well, measured as allele-specific expression alone, and scopes the uniqueness claim to phenotypic rescue across the two ASO papers cited here rather than to neuronal models in general. Verified that PMID:39122967 reports no neurite, outgrowth or morphology readout anywhere in its cached text. Also added directness INDIRECT to the dimerization evidence item on the preclinical ASO's target_mechanisms link, since the quote is the authors' reasoning about why allele-specific knockdown should relieve the dominant-negative effect rather than a measured dimerization result. Declined the suggestion to change the AAV9 gene-therapy link from RESTORES to BYPASSES: BYPASSES is defined as working around a disrupted mechanism via an alternative pathway, and AAV9-IGHMBP2 supplies a functional copy of the same gene, which is the RESTORES definition and its named example.

    Validated with just validate, just validate-terms, just count-verified-snippets (214/214), just validate-disorders, and the duplicate-key, entity-ref, causal-target, qualifier-term, enum-value, delivery-system, snippet-grading, title-snippet, folded-hyphen, block-scalar, retired-support-prose, snippet-length, case-collision, model-scale, background-citation and GeneReviews gates.

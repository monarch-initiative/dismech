  summary: 'Create: KIF1A_Related_Neurological_Disorder'
  details: |
    Created the KIF1A-related neurological disorder (KAND, MONDO:0700055, KIF1A hgnc:888) entry as a Disease with four has_subtypes rows: MRD9 (MONDO:0013656, de novo motor-domain missense; PMID:21376300 p.Thr99Met), SPG30A (MONDO:0700307, dominant missense plus loss-of-function outside the motor domain; PMID:31488895, case fraction 6-7%), SPG30B (MONDO:0971149, biallelic; PMID:21487076 homozygous p.Ala255Val) and HSAN2C (MONDO:0013634) as a pointer subtype with curated_in: Hereditary_Sensory_and_Autonomic_Neuropathy_Type_2. All MONDO IDs/labels checked with runoak ols:mondo. Pathophysiology: 8 nodes; the three KIF1A trigger nodes (motor-domain missense / dominant-negative; haploinsufficiency; biallelic) carry GO microtubule motor activity (GO:0003777) and plus-end-directed microtubule motor activity (GO:0008574) to satisfy the gene-activity grounding gate, scoped with the subtypes list slot; downstream: dominant-negative heterodimer inhibition (PMID:35917346), impaired anterograde SVP transport, synaptic vesicle depletion, progressive neuronal degeneration, cerebellar Purkinje/granule cell loss (autopsy, PMID:33880452). 25 phenotypes with cohort frequencies (PMID:42500835, 33880452, 39009236); neurodevelopmental, seizure and visual features scoped to MRD9 because loss-of-function SPG30A carriers lack them. Treatments: n-of-1 allele-specific 2'-MOE gapmer ASO (PMID:39122967) with oligonucleotide_details, plus GeneReviews-sourced supportive care, tendon lengthening, ubiquinol (uncontrolled, PMID:34487232) and genetic counseling. Animal models: C. elegans unc-104 KAND knock-ins and Kif1a-null mouse. Discussions: genotype-severity conflict (PMID:33880452 vs 34487232), haploinsufficiency tolerance for ASO strategy, SPG30B direction of effect (A255V suggested gain of function), and a HUMAN_MODEL_MISMATCH for the neonatal-lethal null mouse. GeneReviews PMID:41941559 tagged in references and confirmed TAGGED by just check-genereviews --online. Deep research: requested falcon was not configured (ProviderNotConfiguredError) and the run fell back to claude_code; 17/17 references resolved. just preflight-dr returned SKIP because MONDO records no causal gene at the umbrella class; manual check found KIF1A is the sole gene discussed (46 mentions). Stubs retired: KIF1A_Related_Neurological_Disorder, Intellectual_Disability_Autosomal_Dominant_9, Hereditary_Spastic_Paraplegia_30. Validation: just validate 0 issues (105/105 snippets verified); check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, gene-activity grounding (against origin/main), check-snippet-grading, check-title-snippets, check-snippet-length, check-coarse-phenotypes, check-term-cache-integrity and check-cache-order all OK.

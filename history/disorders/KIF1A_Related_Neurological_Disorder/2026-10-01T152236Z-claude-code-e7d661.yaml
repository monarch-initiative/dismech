  summary: 'Revise: KIF1A_Related_Neurological_Disorder review fixes'
  details: |
    Applied independent review of the initial curation. Added a diagnosis item (NCIT:C15709 Genetic Testing) quoting the GeneReviews diagnostic sentence (PMID:41941559). Added 11 phenotypes: abnormal temperature regulation 46%, extremities cold to touch 60%, high pain tolerance 65% (bound to HP:0007328 Impaired pain sensation rather than the stronger Pain insensitivity), bruxism 35%, stereotypical hand wringing 21%, anxiety 19%, drooling 26% (all PMID:33880452, scoped MRD9), dysphagia 29% plus enteral feeding 10%, delayed speech and language development, failure to thrive (poor weight gain) and abnormal autonomic physiology (GeneReviews, unscoped). Added feeding therapy (NCIT:C156237 Swallowing Therapy) and refractive-error management (NCIT:C15747 Supportive Care). Added a skos:narrowMatch MONDO mapping to MONDO:0012476 (hereditary spastic paraplegia 30, a child of MONDO:0700055). Cited PMID:31455732 (SPG variants hyperactivate KIF1A, in vitro and unc-104) on the Biallelic KIF1A Variants node and the SPG30B direction-of-effect discussion, which now also attaches to the motor-domain missense node; cited PMID:33496723 on the motor-domain node. Added Table 1 frequency snippets for microcephaly and peripheral neuropathy; replaced 'consanguineous' with wording matching PMID:21487076 (inbred Palestinian kindred, parents denied consanguinity). The reviewer asked to note learning difficulties in the haploinsufficiency description; PMID:31488895 Table 1 shows those two families (P3 p.Ser69Leu, P8 p.Leu173Pro) carried motor-domain missense variants, so the fact was added to the SPG30A subtype with evidence, and the haploinsufficiency node notes they were not loss-of-function families. Reused the autopsy snippet on the degeneration to cerebellar-loss edge. Ubiquinol left unbound: PMID:34487232 says only 'Ubiquinol supplementation' and does not name ubiquinol-10. Validation: just validate 0 issues (132/132 snippets); gates rerun.

  summary: Review and enrich Corticobasal Syndrome
  details: |
    Added synonym CBS and classifications (NEUROLOGIC, tauopathy); preserved protected node 4R-Tau Aggregation with Astrocytic Plaques while adding biological_scale, loss_of_proteostasis module conforms_to links, MAPT hgnc:6893 with GO:0008017 microtubule binding grounding, UBERON anatomical locations, and bare-name downstream edges connecting all 10 phenotypes; added Armstrong consensus diagnostic criteria (NCIT:C15607); added therapeutic_modality, target_phenotypes, and target_mechanisms with evidence across treatments; replaced meta-note in notes with domain prose and OPEN KNOWLEDGE_GAP discussion; aligned PMID:42438177 title, expanded snippet fragments, and harmonized evidence_source and quote_role. In PR #17359 review round 1, added missing core phenotype Cortical Sensory Deficit (HP:0011730 Abnormal central sensory function, wired from the CBS node), tightened HPO bindings on Limb Apraxia (HP:0030217 Limb apraxia) and Nonfluent/Agrammatic Aphasia (HP:0002427 Expressive aphasia), removed unsupported GO:0051402 neuron apoptotic process from Network-Specific Tau Propagation and Asymmetric Neurodegeneration and added quote_role BACKGROUND on its PMID:27797812 animal-model sentence, dropped unquoted DECREASED modifier on GO:0008017 microtubule binding, pointed Botulinum toxin for limb dystonia target_mechanisms at Limb Dystonia, aligned MAPT notes examples (G389R, p.N410H, P301S) with the cited snippet, expanded the histopathology snippet to include ballooned neurons, and added the PR link to this history record.

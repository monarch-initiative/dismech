  summary: 'Create: Corticobasal Syndrome'
  details: |
    Initial curation of Corticobasal Syndrome (MONDO:0018696), the clinical syndrome, anchored distinctly from corticobasal degeneration (CBD) pathology (MONDO:0022308). Modeled three pathophysiology nodes (clinicopathological heterogeneity of CBS; 4R-tau aggregation with astrocytic plaques as the most common CBD pathology; asymmetric frontoparietal + basal ganglia neurodegeneration), seven phenotypes (asymmetric parkinsonism, limb apraxia, rigidity, limb dystonia, myoclonus, alien limb phenomenon, cognitive impairment), MAPT H1 risk-factor genetics, symptomatic/supportive treatment, and structured prevalence (Scotland CBS point prevalence 2.05/100,000). All 9 PMIDs fetched via 'just fetch-reference' and every snippet verified as an exact substring of the cached abstract; all ontology terms verified via OAK. New MONDO anchor MONDO:0018696 was added to the DiseaseTerm enum cache via the local sqlite:obo:mondo adapter (the committed conf uses ols:mondo, which cannot traverse to admit new terms). Automated high-effort curation-scanner run for issue #6528.

  details: |
    Re-reviewed as part of a sweep of the platelet-type bleeding disorders. No content rewritten, no evidence changed.

    Change made: one conforms_to declaration added, wiring 'Hyperresponsive platelet GPIb-alpha binding to von Willebrand factor' to primary_hemostatic_plug_failure#Impaired Platelet Adhesion to the Injured Vessel Wall. This is the arm's deliberate second entry route, and the module's notes name it explicitly: a GAIN of function at the receptor produces a LOSS of function at the vessel wall, because constitutive binding depletes the high-molecular-weight VWF multimers that adhesion depends on. Curating it at the same arm as Bernard-Soulier syndrome, from the opposite direction, is the point rather than an inconsistency.

    Error caught and corrected during this change: a conforms_to was initially added to the entry's 'GP1BA gain-of-function variants' block, which is under genetic: rather than pathophysiology:. Schema validation rejected it and it was removed rather than relocated, since the trigger is already represented in the pathophysiology chain.

    Validation after the change: linkml-validate PASSED; reference validation PASSED with 30/30 snippets verified.

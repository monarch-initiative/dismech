  details: |
    Curated kb/disorders/Nicotine_Dependence.yaml from stubs/Nicotine_Dependence.yaml (MONDO:0008575), which the stub had already decided as entry_type DISEASE with HIGH priority. Twelve pathophysiology nodes, four of them conforming to the addiction_cycle module (acute mesolimbic dopamine reinforcement, incentive salience and habit formation, reward deficit and stress-system recruitment, prefrontal executive control deficit, plus compulsive seeking and loss of control), with the nicotine-specific pharmacology kept on the entry as the module's own notes require: alpha4beta2 agonism, receptor upregulation and desensitization, the habenulo-interpeduncular alpha5 aversion brake, CYP2A6-dependent clearance, and a partial-agonist target node. Named to the binding rather than to the DSM-5 construct tobacco use disorder, per the entry-naming scope rule. 57 of 57 evidence snippets verified against 23 cached references, 20 of them newly fetched and three reused from the addiction_cycle module. Every CURIE read from OLS, the committed caches or the Alliance in the step it was written; one MGI identifier written from memory (MGI:99779 for Chrna5) was caught by check-gene-namespaces-online as Chrna7 and corrected to MGI:87889. No LOINC code bound for the nicotine metabolite ratio, with the reason recorded on the diagnosis row. Three discussions: a CONTROVERSY over whether cytisinicline engages alpha4beta2 at clinical doses, recorded as a SUPPORT and a REFUTE item on the same node; a KNOWLEDGE_GAP that the habenular circuit has never been measured in human risk-allele carriers; and a HUMAN_MODEL_MISMATCH between the Chrna5 null mouse and the partial-loss-of-function human allele.

  summary: 'Review round 1: Nicotine Dependence'
  details: |
    Answered review round 1 on PR 18468 in one push. Blocking item 1: the entry quoted the eight DSM-IV withdrawal symptoms twice but modelled only seven of them, dropping decreased heart rate; added a Bradycardia phenotype row bound to HP:0001662 (verified at OLS, already in the committed cache) with the same enumerating snippet from PMID:11082828, and added it to the withdrawal node's downstream. Blocking item 2: CHRNA4 and CHRNB2 were typed relationship_type RISK_FACTOR while their own notes said they were recorded for a mechanistic role rather than an association signal. Every permissible value of that enum is a claim about variants in the gene, and none describes a gene that is present because it encodes the receptor the mechanism runs through, so both rows were removed from genetic: rather than retyped or given an association citation assembled to satisfy the slot. Both genes remain bound on the Nicotinic Acetylcholine Receptor Agonism node's genes list, which is how a gene reaches the pathograph, and the beta-2 knockout evidence is already carried on that node's downstream edge. Took three suggestions: the nicotine-e-cigarette high-certainty estimate is now a second evidence item on the agonism node so the device-controlled contrast is complete where it is argued; the six withdrawal phenotype rows that carried no evidence now each carry the PMID:11082828 enumeration; and a biochemical block for cotinine and the nicotine metabolite ratio was added with biomarker_term NCIT:C70941, whose admissibility in the BiomarkerDescriptor enum was established by running just validate-terms rather than assumed. 67 of 67 snippets verified after the changes.
